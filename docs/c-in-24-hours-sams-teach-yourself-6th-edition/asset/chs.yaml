  \    address = rhs.getAddress();\n    salary = rhs.getSalary();\n\n    return *this;\n\
  }\n```\n\n```cpp\nint main()\n{\n    Employee snett(\"Silver\", \"Burdett\", \"\
  800 East 96th St.\", 20000);\n    snett.setSalary(50000);\n    String lastName(\"\
  Snett\");\n    snett.setLastName(lastName);\n    snett.setFirstName(\"Sam\");\n\
  \    std::cout << \"Name: \";\n    std::cout << snett.getFirstName();\n    std::cout\
  \ << \" \" << snett.getLastName();\n    std::cout << \"\\nAddress: \";\n    std::cout\
