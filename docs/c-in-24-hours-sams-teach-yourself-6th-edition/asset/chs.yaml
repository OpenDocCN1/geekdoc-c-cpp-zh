  \ `FunctionTwo()` 的调用没有产生。\n\n### 传递 const 指针\n\n虽然向 `FunctionTwo()` 传递指针更高效，但它是危险的。`FunctionTwo()`\
  \ 不应该改变它所接收的 `SimpleCat` 对象，但它被赋予了对象的地址。这使得对象暴露在不可允许的之下，并违背了按值传递所提供的保护。\n\n按值传递就像是给博物馆提供一张你杰作的照片，而不是实品。如果破坏者在照片上涂鸦，原作不会受到任何伤害。按引用传递就像是将你的家庭地址发送给博物馆，并邀请客人过来查看实品。\n\
  \n如果你想提供按值传递的安全性和按引用传递的效率，解决方案是向 `SimpleCat` 传递一个 `const` 指针。这样做可以防止调用 `SimpleCat`\
  \ 上的任何非 `const` 成员函数，从而保护对象免受改变。列表 13.2 中的 `ConstPasser` 程序演示了这一想法。\n\n**列表 13.2\
