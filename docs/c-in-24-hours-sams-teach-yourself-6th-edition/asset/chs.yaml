  \ const { return weight; }\n16:    void setWeight(int newWeight) { weight = newWeight;\
  \ }\n17:\n18:    // other member functions\n19:    void speak() const { std::cout\
  \ << \"Mammal sound!\\n\"; }\n20:    void sleep() const { std::cout << \"shhh. I'm\
  \ sleeping.\\n\"; }\n21:\n22: protected:\n23:    int age;\n24:    int weight;\n\
  25: };\n26:\n27: class Dog : public Mammal\n28: {\n29: public:\n30:     // constructors\n\
  31:    Dog(): breed(YORKIE) {}\n32:    ~Dog() {}\n33:\n34:    // accessors\n35:\
  \    BREED getBreed() const { return breed; }\n36:    void setBreed(BREED newBreed)\
  \ { breed = newBreed; }\n37:\n38:    // other member functions\n39:    void wagTail()\
  \ { std::cout << \"Tailging ...\\n\"; }\n40:    void begForFood() { std::cout <<\
  \ \"Begging food ...\\n\"; }\n41:\n42: private:\n43:    BREED breed;\n44: };\n45:\n\
  46: int main()\n47: {\n48:    Dog fido;\n49:    fido.speak();\n50:    fido.wagTail();\n\
  51:    std::cout << \"Fido is \" << fido.getAge() << \" years old\\n\";\n52:   \
  \ return 0;\n53: }\n```\n\n\n\n\n```cpp\nvoid wagTail() { std::cout << \"Tail wagging\
  \ ...\\n\"; }\n\nvoid begForFood() { std::cout << \"Begging for food ...\\n\"; }\n\
  \nprivate:\n  BREED breed;\n};\n\nMammal::Mammal():\nage(3),\nweight(5)\n{\n  std::cout\
  \ << \"Mammal constructor ...\\n\";\n}\n\nMammal::~Mammal()\n{\n  std::cout << \"\
  Mammal destructor ...\\n\";\n}\n\nDog::Dog():\nbreed(YORKIE)\n{\n  std::cout <<\
  \ \"Dog constructor ...\\n\";\n}\n\nDog::~Dog()\n{\n  std::cout << \"Dog destructor\
  \ ...\\n\";\n}\n\nint main()\n{\n  Dog fido; // create a dog\n  fido.speak();\n\
  \  fido.wagTail();\n  std::cout << \"Fido is \" << fido.getAge() << \" years old\\\
  n\";\n  return 0;\n}\n```\n\n* *\n\n以下是程序的输出：\n\n```\nMammal constructor ...\nDog\
  \ constructor ...\nMammal sound!\nTail wagging ...\nFido is 3 years old\nDog destructor\
  \ ...\nMammal destructor ...\n```\n\n`Mammal3` 程序在调用构造函数和析构函数时会显示一行文本。当在第 71 行创建\
  \ `fido` 时，会先调用 `Mammal` 的构造函数，然后是调用 `Dog` 的构造函数。此时，`Dog` 已经完全存在，可以调用它的成员函数。当 `fido`\
  \ 随着第 76 行 `main()` 函数的结束而离开作用域时，会调用 `Dog` 的析构函数，随后是调用 `Mammal` 的析构函数。\n\n### 向基类构造函数传递参数\n\
  \n当你在处理这一小时内开发的这些类时，你可能想要重载 `Mammal` 的构造函数以设置特定的年龄，并重载 `Dog` 的构造函数以设置品种。你该如何将 `age`\
  \ 和 `weight` 参数传递给 `Mammal` 中正确的构造函数呢？如果 `Dog` 需要初始化重量而 `Mammal` 不需要该怎么办？\n\n基类的初始化可以在类初始化期间完成，方法是编写基类名，后跟基类所期的参数，正如\
  \ `Mammal4` 程序所示（列表 16.4）。\n\n**列表 16.4 `Mammal4.cpp` 的完整文本**\n\n点击此处查看代码图像\n\n\
  * *\n\n```cpp\n#include <iostream>\n\nenum BREED { YORKIE, CAIRN, DANDIE, SHETLAND,\
  \ DOBERMAN, LAB };\n\nclass Mammal\n{\npublic:\n  // 构造函数\n  Mammal();\n  Mammal(int\
