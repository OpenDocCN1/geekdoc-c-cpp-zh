  \n# 第 VI 部分：特殊主题\n\n## 第 19 小时：在链表中存储信息\n\n你在此小时将学到：\n\n![Image](img/00002.jpeg)\
  \ 什么是链表\n\n![Image](img/00002.jpeg) 如何创建链表\n\n![Image](img/00002.jpeg) 如何通过继承封装功能\n\
  \n### 链表与其他结构\n\n数组就像用于邮寄物品的箱子。它们是有用的容器，但每个容器的大小都是固定的。如果你选择了一个太大的容器，就会浪费空间甚至可能被收取更多费用。如果你选择了一个太小的，则没有足够的空间来存放你需要运送的东西。\n\
  \n在编程中，拥有一个与其包含的数据大小完全匹配的容器是非常用的。实现这一目标的方法之一是使用链表。\n\n链表 是由连接在一起的小容器组成的数据结构。在这种语境下，容器是指包含要存储在列表中对象的类。其思想是编写一个类，它持有你的数据中的一个对象（例如一个\
  \ `Cat` 或一个 `Rectangle`），并知道如何指向链表中的下一个容器。你为每个对象创建一个容器，并将它们链在一起。\n\n这些连接的容器被称为 `nodes`（节点）。链表的第一个节点称为\
  \ `head`（头），链表的最后一个节点称为 `tail`（尾）。\n\n列表有三种基本形式。从简单到复杂依次为：\n\n![Image](img/00002.jpeg)\
  \ 单向链表\n\n![Image](img/00002.jpeg) 双向链表\n\n![Image](img/00002.jpeg) 树\n\n在单向链表 中，每个节点指向下一个节点，但不指向上一个。要找到特定节点，你从顶部开始按顺序从节点移动到节点。双向链表\
  \ 允许你向前向后移动到下一个和上一个节点。树 是由节点构建的复杂结构，每个节点都可以指向两个或三个方向。图 19.1 显示了这三种基本结构。\n\n![Image](img/00018.jpeg)\n\
  \n**图 19.1** 链表。\n\n计算机科学家们创建了更复杂、更巧妙的数据结构，其中大多数都于节点的相互互连。\n\n### 链表案例研究\n\n在本节中，我们将详细研究链表，将其作为如何使用继承、多态和封装来管理大型项目的案例研究。这也是探索如何在\
  \ C++ 中创建复杂结构的机会。\n\n#### 责任的委托\n\n面向对象编程的一个基本前提是：每个对象都很好地做好一件事，并将任何不属于其使命的任务委托给其他对象。\n\
  \n汽车是这一理念的演示。引擎的工作是产生动力。动力的分配不是引擎的任务；那是变速箱的事。转向不是引擎或变速箱的任务；那被委托给了轮子。\n\n一个设计良好的机器有许多微小且易于理解的部件，每个部分都承担自己的工作并协作完成更大的目标。一个设计良好的程序也是如此：每个类都坚持自己的任务，但它们共同创建了一个可以运行的程序。\n\
  \n#### 组件部分\n\n链表将由节点组成。`node` 类本身将是抽象的；我们将使用三个子类型来完成工作。将有一个头节点尾节点来管理列表的这些部分，以及零或多个内部节点。内部节点将跟踪要存储在列表中的实际数据。\n\
  \n注意，数据和列表是完全不同的。你可以在列表中保存任何你喜欢的数据。连接在一起的不是数据；而是持有数据的节点。\n\n程序实际上并不知道节点；它只与列表交互。列表做得很少，仅仅是将工作委托给节点。\n\
  \n本小时的第一个项目 `LinkedList` 程序演示了链表的面向对象方法。该程序有三个主要类：`Data`、`Node` 和 `LinkedList`。运行时，程序向用户索取一系列整数，并将每个整数存储在\
  \ `Data` 类对象中。这些对象被存储在 `LinkedList` 对象中，并按数字顺序显示（如果它们不是按顺序输入的）。`LinkedList` 对象使用\
  \ `HeadNode` 类作为三种实现之一。代码有大量的注释，以让你在进入代码前更好地理解每个部分。列表 19.1 是完整程序。\n\n**列表 19.1 `LinkedList.cpp`\
  \ 的完整文本**\n\n```cpp\n#include <iostream>\n\nenum { kSmaller, kLarger, kIsSame };\n\
  \n// 链表中的任何类都支持两个\n// 函数：show（显示）和 compare（返回相对位置）。\nclass Data\n{\npublic:\n  \
  \  Data(int newVal):newVal(newVal) {}\n    ~Data() {}\n    int compare(const Data&);\n\
  \    void show() { std::cout << value << \"\\n\"; }\nprivate:\n    int value;\n\
  };\n\n// 决定特定对象在列表中位置位置的函数。\nint Data::compare(const Data& otherData)\n{\n    if\
  \ (value < otherData.value)\n        return kSmaller;\n    if (value > otherData.value)\n\
  \        return kLarger;\n    else\n        return kIsSame;\n}\n\n// 前向声明\nclass\
  \ Node;\nclass HeadNode;\nclass TailNode;\nclass InternalNode;\n\n// 代表列表中节点的抽象\
  \ ADT。\n// 每个派生类必须重写 insert() 和 show()。\nclass Node\n{\npublic:\n    Node() {}\n\
  \    virtual ~Node() {}\n    virtual Node* insert(Data* data) = 0;\n    virtual\
  \ void show() = 0;\nprivate:\n};\n\n// 持有 Data 类型对象的节点。\nclass InternalNode : public\
  \ Node\n{\npublic:\n    InternalNode(Data* data, Node* next);\n    virtual ~InternalNode()\
  \ { delete next; delete data; }\n    virtual Node* insert(Data* data);\n    virtual\
  \ void show()\n        { data->show(); next->show(); } // 委托！\n\nprivate:\n    Data*\
  \ data; // 数据本身\n    Node* next; // 指向链表中的下一个节点\n};\n\n// 一个简单的构造函数\nInternalNode::InternalNode(Data*\
  \ newData, Node* newNext):\ndata(newData), next(newNext)\n{\n}\n\n// 用于在列表中存储新对象的函数。\n\
  // 对象被传递给节点，节点会计算其去向\n// 并将其插入列表中。\n```\n\n\n\n\n```cpp\nNode* InternalNode::insert(Data*\
  \ otherData)\n{\n    // 新对象比我大还是小呢？\n    int result = data->compare(*otherData);\n\
  \n    switch (result)\n    {\n        // 如果和我相同，则它排在前面\n        case kIsSame:  \
  \    // 穿透\n        case kIsLarger:    // 新数据在我之前\n        {\n            InternalNode*\
  \ dataNode =\n                new InternalNode(otherData, this);\n            return\
  \ dataNode;\n        }\n\n        // 它更大，所以把它传递给下一个\n        // 节点并让它来处理。\n    \
  \    case kIsSmaller:\n            next = next->insert(otherData);\n           \
  \ return this;\n    }\n    return this; // 抚抚编译器\n}\n```\n\n// 列表中的尾尾节点\nclass TailNode\
  \ : public Node\n{\npublic:\n    TailNode() {}\n    virtual ~TailNode() {}\n   \
  \ virtual Node* insert(Data* data);\n    virtual void show() {}\nprivate:\n};\n\n\
  // 如果数据到达我这里，它必须被插入在我之前\n// 因为尾部之后没有任何东西\nNode* TailNode::insert(Data* data)\n{\n\
  \    InternalNode* dataNode = new InternalNode(data, this);\n    return dataNode;\n\
  }\n\n// 头节点，它不包含数据但指向\n// 列表的开头。\nclass HeadNode : public Node\n{\npublic:\n   \
  \ HeadNode();\n    virtual ~HeadNode() { delete next; }\n    virtual Node* insert(Data*\
  \ data);\n    virtual void show() { next->show(); }\nprivate:\n    Node* next;\n\
  };\n\n// 列表中的第一个节点，它创建尾节点\nHeadNode::HeadNode()\n{\n    next = new TailNode;\n}\n\
  \n// 因为头节点之前没有任何东西，直接将\n// 数据传递给下一个节点\nNode* HeadNode::insert(Data* data)\n{\n \
  \   next = next->insert(data);\n    return this;\n}\n\n// 我获得了所有的荣誉，却没做任何实际工作\n\
  class LinkedList\n{\npublic:\n    LinkedList();\n    ~LinkedList() { delete head;\
  \ }\n    void insert(Data* data);\n    void showAll() { head->show(); }\nprivate:\n\
  \    HeadNode* head;\n};\n\n// 在创建时，我创建头节点，再由它创建\n尾节点。\nLinkedList::LinkedList()\n\
  {\n    head = new HeadNode;\n}\n\n// 委托给头节点\nvoid LinkedList::insert(Data* pData)\n\
  {\n    head->insert(pData);\n}\n\n// 对这些类进行测试\nint main()\n{\n    Data* pData;\n\
  \    int val;\n    LinkedList ll;\n\n    // 在链表中存储用户输入的值\n    while (true)\n   \
  \ {\n        std::cout << \"What value (0 to stop)? \";\n        std::cin >> val;\n\
  \        if (!val)\n            break;\n        pData = new Data(val);\n       \
  \ ll.insert(pData);\n    }\n\n    // 显示列表\n    ll.showAll();\n    return 0;\n}\n\
  ```\n\n当你运行 `LinkedList` 程序时，请逐个输入一系列数值。这些值将用作存储在每个链表节点中的数据。当你输入完任意数量的值后，选择 0 结束输入。链表中的节点将按数值升序顺序显示，如例所示：\n\
  \n```\nWhat value (0 to stop)? 7\nWhat value (0 to stop)? 4\nWhat value (0 to stop)?\
  \ 13\nWhat value (0 to stop)? 8\nWhat value (0 to stop)? 0\n```\n\n\n\n\n让我们回顾一下发生过什么：数据被插入到列表中。列表将数据传递给头部（head）。头部盲目地将数据传递给它当前恰好指向的任何地方。在第一个情况下，头部指向的是尾部（tail）。尾部立即创建了一个新的内部节点，并将新节点初始化为指向尾部。然后尾部将新节点的地址返回给头部，头部随后重新分配了它的\
  \ `next` 指针以指向新节点。\n\n大搞定！数据已经处于列表正确的位置，如图 19.3 所示。\n\n![Image](img/00020.jpeg)\n\
  \n**图 19.3** 插入第一个节点后的链表。\n\n在插入第一个节点后，程序控制权从第 179 行继续。再次对该值进行求值。为了说明起见，假设输入了值 3。这导致在第\
  \ 183 行创建一个新的 `Data` 对象，并在第 184 行将其插入列表。\n\n再次，在第 164 行，列表将数据传递给它的 `HeadNode`。`HeadNode::insert()`\
  \ 函数反过来将新值传递给它的 `next` 恰好指向的任何地方。如你所知，它现在指向包含值为 15 的 `Data` 对象的节点。这调用了第 73 行的 `InternalNode::insert()`\
  \ 函数。\n\n在第 76 行，`InternalNode` 使用它的 `data` 指针告诉它的 `Data` 对象（值为 15 的那个）调用它的 `compare()`\
  \ 成员函数，并传入新的 `Data` 对象（值为 3）。这调用了第 21 行所示的 `compare()` 函数。\n\n对这两个值进行比较；因为 `value`\
  \ 是 15 且 `otherData.value` 是 3，所以返回值为 `kIsLarger`。这导致程序流跳转到第 84–85 行。\n\n为新的 `Data`\
  \ 对象创建了一个新的 `InternalNode`。新节点指向当前的 `InternalNode` 对象，并将新 `InternalNode` 的地址从 `InternalNode::insert()`\
  \ 函数返回给 `HeadNode`。因此，这个对象值小于当前节点对象值的新节点被插入到列表中，现在列表看起来如图 19.4 所示。\n\n![Image](img/00021.jpeg)\n\
  \n**图 19.4** 插入第二个节点后的链表。\n\n在循环的第三次调用中，用户添加了值 8。这个值比 3 大但比 15 小，因此应该插入两个现有节点之间。过程与上一个示例完全相同，只是当对象值为\
  \ 3 的节点执行 `compare` 时，它返回的不是 `kIsLarger`，而是 `kIsSmaller`（这意味着值为 3 的对象小于值为 8 的新对象）。\n\
  \n这导致 `InternalNode::insert()` 函数跳转到第 92 行。`InternalNode` 并没有创建新节点并插入，而是将新数据传递给它的\
  \ `next` 指针恰好指向的任何地方的 `Insert` 函数。在这种情况下，它调用了 `Data` 对象值为 15 的 `InternalNode` 上的\
  \ `InsertNode`。\n\n再次进行比较，现在创建了一个新的 `InternalNode`。这个新的 `InternalNode` 指向 `Data`\
  \ 对象值为 15 的 `InternalNode`，并且它的地址如第 93 行所示被传给了 `Data` 对象值为 3 的 `InternalNode`。\n\
  \n最终效果是新节点被插入到列表正确的位置。\n\n这一切的最终结果是，你有了一个排序好的数据项列表——无论你输入数据的顺序如何。\n\n### 作为对象的链表\n\
  \n在面向对象的编程中，每个单独的对象都被赋予了一组狭窄且定义良好的职责。链表负责维护头部节点。`HeadNode` 立即将任何新数据传递给它当前指向的任何地方，而不考虑那可能是什么。\n\
  \n`TailNode` 每当接收到数据时，都会创建一个新节点并插入。它只知道一件事：如果数据传到了这里，它就会被插入在我之前。\n\n内部节点（Internal\
  \ nodes）要稍微复杂一点；它们要求现有的对象与新对象进行比较。根据结果，它们要么随后插入，要么直接向下传递。\n\n注意，`InternalNode` 并不知道如何进行比较；这应该恰当地留给对象本身。`InternalNode`\
  \ 知道的只是让对象进行相互比较，并期待三个可能的答案之一。根据其中一个答案，它进行插入；否则，它只是向下传递，不知道也不在乎最终落到何处。\n\n那么是谁在负责呢？在一个设计良好的面向对象程序，没有哪个类是负责人。每个对象都承担自己的工作，最终效果就是一台运行良好的机器。\n\
  \n链表的优美之处在于，你可以将任何想要的数据类型放入该类的 `Data` 中。在本例中，它包含一个整数。它可以包含多个内置数据类型，甚至是其他对象（包括其他链表）。\n\
  \n动态内存的使用允许链表在较小时使用极少的内存，并在它们增长时使用大量内存。\n\n### 注意\n\n注意，`InternalNode` 并不知道如何进行比较；这应该恰当地留给对象本身。所有\
  \ `InternalNode` 知道的只是让对象进行相互比较，并期待三个可能的答案之一。根据其中一个答案，它进行插入；否则，它只是向下传递，不知道也不在乎最终落到何处。\n\
  \n\n\n现在你已经学习了如何实现一个复杂的数据结构，请回答几个问题并进行几项练习以将它们联系起来。\n\n## 测验\n\n1. **1.** 链表中的第一个节点称为什么？\n\
  \   A. 起点 (origin)\n   B. 头节点 (head)\n   C. 顶部 (top)\n\n2. **2.** 链表节点包含哪两个内容？\n\
  \   A. 行为和数据\n   B. 函数和变量\n   C. 数据和节点指针\n\n3. **3.** 双向链表需要几个指针？\n   A. 2\n   B.\
  \ 1\n   C. a 或 b 可\n\n## 答案\n\n1. **1. B.** 正如名称所示，它包含了链表的头。知道列表从哪里开始非常重要，这样才能访问它。\n\
  \n2. **2. C.** 数据可以是任何类型的对象。指针指向链表中的下一个成员。\n\n3. **3. A.** 双向链表中的每个节点有两个指针，一个用于\
  \ `next`（下一个），一个用于 `previous`（上一个），这样你可以从一端开始向另一端移动。\n\n## 活动\n\n1. 重写 `LinkedList`\
  \ 程序（Listing 19.1），使其存储 `Tricycle` 对象而不是整数。\n2. 为 `LinkedList` 类添加一个函数（Listing 19.1），用于显示列表所包含的节点数量。\n\
  \n要查看这些活动的解决方案，请访问本书的网站 [`cplusplus.cadenhead.org`](http://cplusplus.cadenhead.org)。\n\
  \n## 第 20 小时：使用特殊类、函数和指针\n\n在本小时中学习：\n- 什么是静态成员变量和静态成员函数\n- 如何使用静态成员变量和静态成员函数\n\
  - 什么是友函数（friend functions）和友类（friend classes）\n- 如何使用友函数解决特殊问题\n- 如何使用成员函数指针\n\n\
  ### 静态成员数据\n\n到目前，你可能认为每个对象中的数据都是该对象独有的，类中的其他之间并不共享。例如，如果你有五个 `Robot` 对象，每个对象都有自己的年龄、重量和其他数据。一个对象的年龄不会影响另一个对象的年龄。\n\
  \n有时，你想跟踪类中许多对象之间共享的信息。例如，你可能想知道创建了多少 `Robot` 对象，还有多少仍然存在。\n\n与其他成员变量不同，`static`\
  \ 成员变量在类的所有实例之间共享。它们处于全局数据（对程序的所有部分都可用）和成员数据（通常只对每个对象可用）之间的中间地带。\n\n你可以将静态成员 视为属于类而不是对象。普通成员数据是每个对象一个，但静态成员是每个类一个。\n\
  \nListing 20.1 中的 `StaticRobot` 程序声明了一个带有静态数据成员 `howManyRobots` 的 `Robot` 对象。该变量通过增加静态变量来跟踪创建了多少\
  \ `Robot` 对象。该变量在每次构造时增加，在每次销毁时减少。\n\n**LISTING 20.1 `StaticRobot.cpp` 的完整全文**\n\
  \n```cpp\n1: #include <iostream>\n2:\n3: class Robot\n4: {\n5: public:\n6:     \
  \ Robot(int newAge = 1):age(newAge){ howManyRobots++; }\n7:      virtual ~Robot()\
  \ { howManyRobots--; }\n8:      virtual int getAge() { return age; }\n9:      virtual\
  \ void setAge(int newAge) { age = newAge; }\n10:     static int howManyRobots;\n\
  11:\n12: private:\n13:      int age;\n14: };\n15:\n16: int Robot::howManyRobots\
  \ = 0;\n17:\n18: int main()\n19: {\n20:      const int maxRobots = 5;\n21:     \
