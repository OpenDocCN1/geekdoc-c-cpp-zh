  \n# 第五部分：继承与多态\n\n## 第 16 节 通过继承扩展类\n\n在本节中你将学习：\n\n- 什么是继承\n- 如何从另一个类派生类\n- 如何重写基类函数\n\
  - 什么是基类\n\n### 什么是继承？\n\n继承是类从另一个类获取属性的方式。C++ 通过继承允许类之间产生相互作用。类可以以不同的方式进行分类。当你观察一个类时，你看到了什么？生物学家看到的是器官，物理学家看到的是力，分类学家看到的是一个物种，而孩子看到的是一个伴侣。\n\
  \n每个类别都可以进一步细分。分类学家将世界划分为界、门、纲、目、科、属、种。\n\n继承建立了一种“是（is）”的关系——狗是犬科。哺乳动物是动物。这种“是”的关系无处可见。汽车是车辆中的一种类。\n\
  \n#### 继承与派生\n\n这些关系是通过继承传递的。狗继承了哺乳动物的所有特征。因为是哺乳动物，它们会移动并呼吸；根据定义，所有哺乳动物移动并呼吸。狗的概念增加了吠叫、摇尾等特征。\n\
  \n狗可以进一步细分为猎犬和梗犬；梗犬可以进一步细分为约克梗犬。约克梗犬是犬的一种，因此是哺乳动物。\n\nC++ 尝试通过定义相互派生的类来表示这些关系。派生是表达“是”关系的一种。你从\
  \ `Mammal` 类派生出一个新类 `Dog`。你不需要显式声明狗会移动，因为它们从 `Mammal` 继承了这一点。\n\n向现有类添加新功能的类被称为派生自该类。原始类被称为该新类的基类。\n\
  \n如果 `Dog` 类派生自 `Mammal` 类，那么 `Mammal` 就是 `Dog` 的基类。派生类是基类的超集。正如在现实世界中狗为哺乳动物的概念增加了某些特征，`Dog`\
  \ 类也将为 `Mammal` 类添加某些成员函数或数据。\n\n基类可以拥有多个派生类。正如狗、猫和马都是哺乳动物的类型，它们的类都将派生自 `Mammal`\
  \ 类。\n\n\n\n\n访问控制将在稍后介绍。这里有一个访问级别为 `public` 的类声明示例：\n\n```cpp\nclass Dog : public\
  \ Mammal\n```\n\n该语句创建了一个名为 `Dog` 的派生类，它继承自基类 `Mammal`。列表 16.1 中的 `Mammal1` 程序创建了一个派自\
  \ `Mammal` 的完整 `Dog` 类。\n\n#### 列表 16.1 `Mammal1.cpp` 的全文\n\n点击此处查看代码图像\n\n```cpp\n\
  1: #include <iostream>\n2:\n3: enum BREED { YORKIE, CAIRN, DANDIE, SHETLAND, DOBERMAN,\
  \ LAB };\n4:\n5: class Mammal\n6: {\n7: public:\n8:     // constructors\n9:    \
  \ Mammal();\n10:     ~Mammal();\n11:\n12:     // accessors\n13:     int getAge()\
  \ const;\n14:     void setAge(int);\n15:     int getWeight() const;\n16:     void\
  \ setWeight();\n17:\n18:     // other member functions\n19:     void speak();\n\
  20:     void sleep();\n21:\n22: protected:\n23:     int age;\n24:     int weight;\n\
  25: };\n26:\n27: class Dog : public Mammal\n28: {\n29: public:\n30:     // constructors\n\
  31:     Dog();\n32:     ~Dog();\n33:\n34:     // accessors\n35:     BREED getBreed()\
  \ const;\n36:     void setBreed(BREED);\n37:\n38:     // other member functions\n\
  39:     // wagTail();\n40:     // begForFood();\n41:\n42: protected:\n43:     BREED\
  \ itsBreed;\n44: };\n45:\n46: int main()\n47: {\n48:     return 0;\n49: }\n```\n\
  \n该程序可以编译，但没有输出；它只是一组没有实现的类声明。尽管如此，这里仍有很多值得关注的内容。\n\n在第 5–25 行，声明了 `Mammal` 类。由于所有哺乳动物都有年龄和体重，这些属性在类类中通过成员变量\
  \ `age` 和 `weight` 来表示。\n\n`Mammal` 类中定义了六个成员函数：四个访问器成员函数、`speak()` 和 `sleep()`。\n\
  \n如第 27 行所示，`Dog` 类继承自 `Mammal`。每个 `Dog` 对象都有三个成员变量：`age`、`weight` 和 `breed`（犬种）。请注意，第\
  \ 27–44 行中 `Dog` 的类声明并不包含这些变量中的两个，即 `age` 和 `weight`。`Dog` 对象从 `Mammal` 类继承这些变量，并继承\
  \ `Mammal` 的所有成员函数，但拷贝运算符、构造函数和析构函数除外。\n\n### 私（Private）与受保护（Protected）\n\n在列表 16.1\
  \ 中的 `Mammal1` 程序第 22 和 42 行引入了一个新的访问关键字 `protected`。此前，类数据被声明为 `private`。然而，私有成员对派生类不可。你可以将\
  \ `age` 和 `weight` 成员变量设置为 `public`，但这并不是理想的。你不希望其他类直接访问这些数据成员。\n\n你希望让数据对该类及其派生类可见，这可以通过\
  \ `protected` 实现。受保护的数据成员和函数对派生类是完全可见的但在其他情况下是私有的。\n\n这里有三种访问修饰符：`public`、`protected`\
  \ 和 `private`。如果一个函数拥有某个类的实例，它就可以访问该类的所有公共成员数据和函数。然而，类的成员函数可以访问其派自的任何类的所有私有数据成员和函数。\n\
  \n因此，函数 `Dog::wagTail()` 可以访问私有数据 `breed`，并访问 `Mammal` 类中的受保护数据。\n\n即使在 `Mammal`\
  \ 和 `Dog` 之间的层级中加入了其他类（例如 `DomesticAnimals`），只要这些其他类具有公共继承，`Dog` 类仍然能够访问 `Mammal`\
  \ 的受保护成员。列表 16.2 中的 `Mammal2` 程序演示了如何创建 `Dog` 对象并访问其数据和成员函数。\n\n#### 列表 16.2 `Mammal2.cpp`\
  \ 的全文\n\n点击此处查看图像\n\n```cpp\n1: #include <iostream>\n2:\n3: enum BREED { YORKIE,\
  \ CAIRN, DANDIE, SHETLAND, DOBERMAN, LAB };\n4:\n5: class Mammal\n6: {\n7: public:\n\
  8:     // constructors\n9:     Mammal(): age(2), weight(5) {}\n10:    ~Mammal()\n\
  11:\n12:    // accessors\n13:    int getAge() const { return age; }\n14:    void\
  \ setAge(int newAge) { age = newAge; }\n15:    int getWeight() const { return weight;\
  \ }\n16:    void setWeight(int newWeight) { weight = newWeight; }\n17:\n18:    //\
  \ other member functions\n19:    void speak() const { std::cout << \"Mammal sound!\\\
  n\"; }\n20:    void sleep() const { std::cout << \"shhh. I'm sleeping.\\n\"; }\n\
  21:\n22: protected:\n23:    int age;\n24:    int weight;\n25: };\n26:\n27: class\
  \ Dog : public Mammal\n28: {\n29: public:\n30:     // constructors\n31:    Dog():\
  \ breed(YORKIE) {}\n32:    ~Dog() {}\n33:\n34:    // accessors\n35:    BREED getBreed()\
  \ const { return breed; }\n36:    void setBreed(BREED newBreed) { breed = newBreed;\
  \ }\n37:\n38:    // other member functions\n39:    void wagTail() { std::cout <<\
  \ \"Tailging ...\\n\"; }\n40:    void begForFood() { std::cout << \"Begging food\
  \ ...\\n\"; }\n41:\n42: private:\n43:    BREED breed;\n44: };\n45:\n46: int main()\n\
  47: {\n48:    Dog fido;\n49:    fido.speak();\n50:    fido.wagTail();\n51:    std::cout\
  \ << \"Fido is \" << fido.getAge() << \" years old\\n\";\n52:    return 0;\n53:\
  \ }\n```\n\n当你运行 Mammal2 时，会出现输出：\n\n```\nMammal sound!\nTailging ...\nFido is 2\
  \ years```\n\n在第 5–25 行，`Mammal` 类声明了若干成员函数。在第 27–44 行，`Dog` 类声明为 `Mammal` 的派生类。这些声明让\
  \ `Dog` 对象拥有年龄、体重和犬种。在第 48 行，`Dog` 知道如何执行 `speak()`、`sleep()`。\n\n### 构造函数与析构函数\n\
  \n理解 C++ 继承的一个重要方面是，创建一个派生类对象时会调用多个构造函数。\n\n`Dog` 对象也是 `Mammal` 对象。在 Mammal2 程序中创建\
  \ `fido` 时，首先调用基类构造函数，然后调用 `Dog` 构造函数完成 `Dog` 对象的构造。由于创建 `fido` 时没有参数，因此使用了默认构造函数。\n\
  \n当 `fido` 对象被销毁时，首先调用 `Dog` 析构，然后是 `Mammal` 部分的析构。每个析构函数都有机会清理自己的部分。构造函数按继承顺序调用，析构函数按反向调用。\n\
  \n列表 16.3 中的 `Mammal3` 程序演示了如何调用属于类的构造函数和析构函数。\n\n```cpp\n1: #include <iostream>\n\
  2:\n3: enum BREED { YORKIE, CAIRN, DANDIE, SHETLAND, DOBERMAN, LAB };\n4:\n5: class\
  \ Mammal\n6: {\n7: public:\n8:     // constructors\n9:     Mammal(): age(2), weight(5)\
