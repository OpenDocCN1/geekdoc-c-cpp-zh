  \ { PostMaster,\n7: Gmail, Hotmail, Internet };\n8:\n9: class String\n10: {\n11:\
  \ public:\n12: // constructors\n13: String();\n14: String(const char*);\n15: String(const\
  \ String&);\n16: ~String();\n17:\n18: // overloaded operators\n19: char operator[](int\
  \ offset);\n20: char operator[](int offset) const;\n21: String operator+(const String&);\n\
  22: void operator+=(const String&);\n23: String& operator=(const String&);\n24:\
  \ friend std::ostream& operator<<(std::ostream& stream, String&);\n25: // accessors\n\
  26: int getLen() const { return len; }\n27: const char* getString() const { return\
  \ string; }\n28:\n29: private:\n30: String(int); // private constructor\n31: char*\
  \ string;\n32: int len;\n33: };\n34: // default constructor creates string of 0\
