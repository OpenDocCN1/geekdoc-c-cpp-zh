  \n**2.** 修改 `Mammal2` 程序 ([part0029.html_ch16lis02))，使用字符串而不是枚举数据类型作为品种。\n\n要查看这些活动的解答，请访问本书的网站。\n\
  \n## 第 17 节：使用多态和派生类\n\n* * *\n\n本节将学习：\n\n- 什么是虚成员函数\n- 如何使用虚析构函数和拷贝构造函数\n- 虚成员函数如何让你以多态方式使用基类\n\
  - 使用虚成员函数的代价和危险\n\n* * *\n\n### 用虚成员函数实现多态\n\n上一节强调了 `Dog` 对象是一个 `Mammal` 对象。这意味着\
  \ `Dog` 对象继承基类的属性（数据）和能力（成员函数）。在 C++ 中，基类与派生类之间的关系比此深得多。\n\n多态允许将派生对象视为基类对象。例如，假设你创建了专门的\
  \ `Mammal` 类型，如 `Dog`、`Cat`、`Horse` 等。所有这些都派自 `Mammal`，并且 `Mammal` 具有从派生类中提取出来的若干个成员函数。其中一个函数是\
  \ `speak()`，它实现了所有哺乳动物发出声音的能力。\n\n你想教导每个派生类型专门化它们的说话方式。狗叫“汪”，猫叫“喵喵”，以此类推。\n\n\n\n\
  \n\n同时，当你拥有一组 `Mammal` 对象时（例如一个包含 `Dog`、`Cat`、`Horse` 和 `Cow` 对象的 `Farm`），你希望这个农场能够告诉这些中的每一个对象执行\
  \ `speak()`，而不需要知道或关心它们实现 `speak()` 函数的具体细节。当你通过调用 `Mammal.speak()` 函数将这些对象视为都是哺乳动物时，你实际上是在以多态的方式处理它们。\n\
  \n***\n\n### Note\n\n`Polymorphism`（多态）是一个不寻常的，意思是以多种形式呈现的能力。它源于词根 `poly`（意为多）和\
  \ `morph`（意为形式）。你正在处理多种形式的 `Mammal`。\n\n***\n\n你可以使用多态来声明一个指向 `Mammal` 的指针，并将你在堆上创建的\
  \ `Dog` 对象的地址赋值给它。因为一个 `Dog` “是一个” `Mammal`，所以以下代码完全完全法的：\n\n```cpp\nMammal* pMammal\
  \ = new Dog;\n```\n\n然后你可以使用该指针来调用 `Mammal` 的任何成员函数。你希望那些在 `Dog` 中被重写的函数能够调用正确的函数。\n\
  \n`Virtual`（虚）成员函数允许你实现这一点。当你以多态的方式处理这些对象时，你在 `Mammal` 指针上调用成员函数，而不需要也不关心实际对象是什么，或者它是如何实现该函数的。\n\
  \n虚成员函数用 `virtual` 关键字声明。以下是本小时第一个项目的示例：\n\n```cpp\nvirtual void speak() const {\
  \ std::cout << \"Mammal speak!\\n\"; }\n```\n\n`Listing 17.1` 中的 `Mammal8` 程序说明了虚函数是如何实现多态的。\n\
  \n**LISTING 17.1 `Mammal8.cpp` 的全文**\n\n```cpp\n#include <iostream>\n\nclass Mammal\n\
  {\npublic:\n    Mammal():age(1) { std::cout << \"Mammal constructor ...\\n\"; }\n\
  \    ~Mammal() { std::cout << \"Mammal destructor ...\\n\"; }\n    void move() const\
  \ { std::cout << \"Mammal, move one step\\n\"; }\n    virtual void speak() const\
  \ { std::cout << \"Mammal speak!\\n\"; }\n\nprotected:\n    int age;\n};\n\nclass\
  \ Dog : public Mammal\n{\npublic:\n    Dog() { std::cout << \"Dog constructor ...\\\
  n\"; }\n    ~Dog() { std::cout << \"Dog destructor ..\\n\"; }\n    void wagTail()\
  \ { std::cout << \"Wagging tail ...\\n\"; }\n    void speak() const { std::cout\
  \ << \"Woof!\\n\"; }\n    void move() const { std::cout << \"Dog moves 5 steps ...\\\
  n\"; }\n};\n\nint main()\n{\n    Mammal *pDog = new Dog;\n    pDog->move();\n  \
  \  pDog->speak();\n    return 0;\n}\n```\n\n***\n\n`Mammal8` 显示了以下输出：\n\n```\nMammal\
  \ constructor ...\nDog constructor ...\nMammal, move one step\nWoof!\n```\n\n在第\
  \ 9 行，`Mammal` 提供了一个名为 `speak()` 的虚成员函数。类的设计者借此发出信号，预计该类最终将成为另一个类的基类型。派生类可能想要重写这个函数。\n\
  \n在第 27 行，创建了一个指向 `Mammal` 的指针 `pDog`，但它被赋值了一个新 `Dog` 对象的地址。因为 `Dog` 是一个 `Mammal`，这是一个合法的赋值。随后该指针被用于调用\
  \ `move()` 函数。由于编译器认为 `pDog` 只是 `Mammal`，因此它查找 `Mammal` 对象来寻找 `move()` 函数。\n\n接下来，指针调用了\
  \ `speak()` 函数。由于 `speak()` 是虚函数，因此调用了 `Dog` 中重写的 `speak()` 函数。\n\n对于调用函数来说，它持有一个\
  \ `Mammal` 指针，但调用的却是 `Dog` 的函数。事实上，如果你有一个指向 `Mammal` 指针的数组，其中每个指针都指向 `Mammal` 的一个子类，你可以依次调用它们，并会调用正确的函数。`Mammal9`\
  \ 程序说明了这一点。\n\n**LISTING 17.2 `Mammal9.cpp` 的全文**\n\n```cpp\n#include <iostream>\n\
  \nclass Mammal\n{\npublic:\n    Mammal():age(1) { }\n    ~Mammal() { }\n    virtual\
  \ void speak() const { std::cout << \"Mammal speak!\\n\"; }\n\nprotected:\n    int\
  \ age;\n};\n\nclass Dog : public Mammal\n{\npublic:\n    void speak() const { std::cout\
  \ << \"Woof!\\n\"; }\n};\n\nclass Cat : public Mammal\n{\npublic:\n    void speak()\
  \ const { std::cout << \"Meow!\\n\"; }\n};\n\nclass Horse : public Mammal\n{\npublic:\n\
  \    void speak() const { std::cout << \"Whinny!\\n\"; }\n};\n\nclass Pig : public\
  \ Mammal\n{\npublic:\n    void speak() const { std::cout << \"Oink!\\n\"; }\n};\n\
  \nint main()\n{\n    Mammal* array[5];\n    Mammal* ptr;\n    int choice, i;\n \
  \   for (i = 0; i < 5; i++)\n    {\n        std::cout << \"(1) dog (2) cat (3) horse\
  \ (4) pig: \";\n        std::cin >> choice;\n        switch (choice)\n        {\n\
  \            case 1:\n                ptr = new Dog;\n                break;\n \
  \           case 2:\n                ptr = new Cat;\n                break;\n  \
  \          case 3:\n                ptr = new Horse;\n                break;\n \
  \           case 4:\n                ptr = new Pig;\n                break;\n  \
  \          default:\n                ptr = new Mammal;\n                break;\n\
  \        }\n        array[i] = ptr;\n    }\n}\n```\n\n***\n\n### 虚函数的工作原理\n\n当创建一个派生对象（例如\
  \ `Dog` 对象）时，首先调用基类的构造函数，然后调用派生类的构造函数。图 17.1 显示了 `Dog` 对象在创建后的样子。注意，对象中的 `Mammal`\
  \ 部分与 `Dog` 部分在内存中是连续的。\n\n当在对象中创建虚函数时，对象必须跟踪该函数。许多编译器会构建一个虚函数表，称为 v-table。每个类型都保留一个表，而该类型的每个对象都保留一个虚表指针（称为\
  \ v-pointer 或 vptr），它指向该表。\n\n每个对象的 v-pointer 指向虚函数表，而该表反过来又每个虚成员函数都有一个指针。当 `Dog`\
  \ 的 `Mammal` 部分被创建时，v-pointer 被初始化为指向 `Mammal` 的虚成员函数，如图 17.2 所示。\n\n\n\n\n\n**图\
  \ 17.2** `Mammal` 的虚表（v-table）。\n\n当调用 `Dog` 构造函数并向此对象添加 `Dog` 部分时，虚函数指针（v-pointer）将调整为指向\
  \ `Dog` 对象中的虚函数重写（如果有的话），如 图 17.3 所示。\n\n![Image](img/00017.jpeg)\n\n**图 17.3**\
  \ `Dog` 的虚表。\n\n当使用指向 `Mammal` 的指针时，虚函数指针继续指向正确的函数，取决于对象的真实类型。因此，当调用 `speak()` 时，会调用正确的函数。\n\
  \n## 你无法从这里到达那里（无法直接访问）\n\n如果 `Dog` 对象拥有一个名为 `wagTail()` 的成员函数，且该函数未在 `Mammal` 类中，那么你无法通过指向\
  \ `Mammal` 的指针来访问该函数（除非你将其强制转换为指向 `Dog` 的指针）。由于 `wagTail()` 不是虚函数且不在 `Mammal` 对象中，除非拥有\
  \ `Dog` 对象或 `Dog` 指针，否则你无法访问它。\n\n尽管你可以将 `Mammal` 指针转换为 `Dog` 指针，但通常有更好、更安全的方法来调用\
  \ `wagTail()` 成员函数。C++ 不反对显式类型转换，因为它们很容易出错。这个主题在第 18 小节 介绍多重继承时、“利用高级多态”时进行了深入讨论，并且在第\
  \ 24 小节 介绍模板时再次提到，即“处理异常和错误处理”。\n\n## 切片问题（Slicing）\n\n注意，虚函数的魔力只对指针和引用有效。按值传递对象将无法启用虚成员函数的调用。列表\
  \ 17.3 中的 `Mammal10` 程序阐释了这一问题。\n\n**列表 17.3** `Mammal10.cpp` 的全文\n\n点击此处查看代码图像\n\
  \n```cpp\n1: #include <iostream>\n2:\n3: class Mammal\n4: {\n5: public:\n6:    \
  \ Mammal():age(1) {  }\n7:      ~Mammal() { }\n8:     virtual void speak() const\
  \ { std::cout << \"Mammal speak!\\n\"; }\n9: protected:\n10:      int age;\n11:\
  \ };\n12:\n13: class Dog : public Mammal\n14: {\n15: public:\n16:      void speak()\
  \ const { std::cout << \"Woof!\\n\"; }\n17: };\n18:\n19: class Cat : public Mammal\n\
  20: {\n21: public:\n22:      void speak()const { std::cout << \"Meow!\\n\"; }\n\
  23: };\n24:\n25: void valueFunction(Mammal);\n26: void ptrFunction(Mammal*);\n27:\
  \ void refFunction(Mammal&);\n28:\n29: int main()\n30: {\n31:      Mammal* ptr=0;\n\
  32:      int choice;\n33:      while (1)\n34:      {\n35:          bool fQuit =\
  \ false;\n36:          std::cout << \"(1) dog (2) cat (0) quit: \";\n37:       \
  \   std::cin >> choice;\n38:          switch (choice)\n39:          {\n40:     \
  \     case 0:\n41:              fQuit = true;\n42:              break;\n43:    \
  \      case 1:\n44:              ptr = new Dog;\n45:              break;\n46:  \
  \        case 2:\n47:              ptr = new Cat;\n48:              break;\n49:\
  \          default:\n50:              ptr = new Mammal;\n51:              break;\n\
  52:      }\n53:      if (fQuit)\n54:          {\n55:              break;\n56:  \
  \    }\n57:      ptrFunction(ptr);\n58:      refFunction(*ptr);\n59:      valueFunction(*ptr);\n\
  60:  }\n61:  return 0;\n62: }\n63:\n64: void valueFunction(Mammal mammalValue) //\
  \ 这个函数最后被调用\n65: {\n66:     mammalValue.speak();\n67: }\n68:\n69: void ptrFunction\
  \ (Mammal *pMammal)\n70: {\n71:     pMammal->speak();\n72: }\n73:\n74: void refFunction\
  \ (Mammal &rMammal)\n75: {\n76:     rMammal.speak();\n77: }\n```\n\n以下是示例运行和对应的输出：\n\
  ```\n(1) dog (2) cat (0) quit: 2\nMeow!\nMeow!\nMammal speak!\n(1) dog (2) cat (0)\
  \ quit: 1\nWoof!\nWoof!\nMammal speak!\n(1) dog (2) cat (0) quit: 0\n```\n\n在第 3-23\
  \ 行，`Mammal`、`Dog` 和 `Cat` 类被声明。`ptrFunction()`、`refFunction()` 和 `valueFunction()`\
  \ 分别接受指针、引用和值。在第 38-52 行的 `switch` 语句根据用户选择创建不同的对象。在第 57-59 行，调用了这三个函数。`valueFunction`\
  \ 最后被调用，它是按值传递的，导致了对象被“切片”。在 `(1) dog (2) cat (0) quit: 2` 的输出中，`Meow!` 出现了两次是因为\
  \ `ptrFunction` 和 `refFunction`，而最后一次 `Mammal speak!` 则是由于 `valueFunction` 切片。当对象被删除时，如果基类的析构函数是虚的，派生类的析构函数也会被调用。\n\
  \n## 虚析构函数\n\n在 C++ 中，允许并经常在需要基类指针时传递派生类对象。当该指针被删除时会发生什么？如果析构函数是虚的（正如它应该的一样），派生类的析构函数就会被调用。派生类的析构函数会自动调用基类的析构函数，整个对象将被正确销毁。\n\
  \n法则是：如果类中的任何函数是虚的，那么析构函数也应该是虚的。\n\n## 虚构造函数\n\n如前所述，构造函数不能是虚的。然而，某些程序确实需要通过基指针创建派生类对象的副本。解决此问题的常用方案是在基类中创建一个\
  \ `clone` 成员函数并将其设为虚。每个派生类重写 `clone` 函数以返回当前对象的拷贝。\n\n`clone` 函数在堆上创建派生类对象的副本。这在代码中如何所示：\n\
  \n```cpp\n1: #include <iostream>\n2:\n3: class Mammal\n4: {\n5: public:\n6:    \
  \ Mammal():age(1) {  }\n7:      ~Mammal() { }\n8:     virtual void speak() const\
  \ { std::cout << \"Mammal speak!\\n\"; }\n9:     virtual Mammal* clone() { return\
  \ new Mammal(*this); }\n10:    int getAge() const { return age; }\n11: protected:\n\
  12:     int age;\n13: };\n14:\n15: Mammal::Mammal(const Mammal &rhs):age(rhs.getAge())\n\
  16: {\n17:     std::cout << \"Mammal copy constructor ...\\n\";\n18: }\n19:\n20:\
  \ class Dog : public Mammal\n21: {\n22: public:\n23:     void speak() const { std::cout\
  \ << \"Woof!\\n\"; }\n24:     virtual Mammal* clone() { return new Dog(*this); }\n\
  25: };\n26:\n27: Dog::Dog(const Dog &rhs):Mammal(rhs)\n28: {\n29:     std::cout\
  \ << \"Dog copy constructor ...\\n\";\n30: }\n31:\n32: class Cat : public Mammal\n\
  33: {\n34: public:\n35:     void speak() const { std::cout << \"Meow!\\n\"; }\n\
  36:     virtual Mammal* Clone() { return new Cat(*this); }\n37: };\n38:\n39: Cat::Cat(const\
  \ Cat &rhs):Mammal(rhs)\n40: {\n41:     std::cout << \"Cat copy constructor ...\\\
  n\";\n42: }\n43:\n44: enum ANIMALS { MAMMAL, DOG, CAT};\n45: const int numAnimalTypes\
  \ = 3;\n46: int main()\n47: {\n48: }\n```\n\n\n\n\n\n```cpp\n58:      Mammal *array[numAnimalTypes];\n\
  59:      Mammal *ptr;\n60:      int choice, i;\n61:      for (i = 0; i < numAnimalTypes;\
  \ i++)\n62:      {\n63:          std::cout << \"(1) dog (2) cat (3) mammal: \";\n\
  64:          std::cin >> choice;\n65:          switch (choice)\n66:          {\n\
  67:          case DOG:\n68:              ptr = new Dog;\n69:              break;\n\
  70:          case CAT:\n71:              ptr = new Cat;\n72:              break;\n\
  73:          default:\n74:              ptr = new Mammal;\n75:              break;\n\
  76:          }\n77:          array[i] = ptr;\n78:      }\n79:      Mammal *otherArray[numAnimalTypes];\n\
  80:      for (i=0; i < numAnimalTypes; i++)\n81:      {\n82:          array[i]->speak();\n\
  83:          otherArray[i] = array[i]->clone();\n84:      }\n85:      for (i=0;\
  \ i < numAnimalTypes; i++)\n86:      {\n87:          otherArray[i]->speak();\n88:\
  \      }\n89:      return 0;\n90: }\n```\n\n以下输出展示了程序的程序运行结果：\n\n点击此处查看代码图片\n\n\
  1: (1) dog (2) cat (3) mammal: 3\n2: Mammal constructor ...\n3: (1) dog (2) cat\
  \ (3) mammal: 1\n4: Mammal constructor ...\n5: Dog constructor ...\n6: (1) dog (2)\
  \ cat (3) mammal: 2\n7: Mammal constructor ...\n8: Cat constructor ...\n9: Mammal\
  \ speak!\n10: Mammal copy constructor ...\n11: Woof!\n12: Mammal copy constructor\
  \ ...\n13: Dog copy constructor ...\n14: Meow!\n15: Mammal copy constructor ...\n\
  16: Mammal speak!\n17: Woof!\n18: Mammal speak!\n\n列表 17.4 与之前的两个列表相似，不同在于在 `Mammal`\
  \ 类中添加了一个新的虚函数：`clone()`。该函数通过调用拷贝构造函数并将自身（`*this`）作为 `const` 引用传递，返回一个指向新 `Mammal`\
  \ 对象的指针。\n\n`Dog` 和 `Cat` 都重写了 `clone()` 函数，初始化它们的数据并将自身的拷贝传递给它们自己的拷贝构造函数。由于 `clone()`\
  \ 是虚的，这在实际上创建了一个虚拷贝构造函数，如第 83 行所示。\n\n用户被提示选择狗、猫或哺乳动物，这些对象在第 65–76 行被创建。第 77 行将每个选择的指针存储在数组数组中。\n\
  \n当程序遍历数组时，在第 82–83 行依次调用每个对象的 `speak()` 和 `clone()` 函数。`clone()` 调用的结果是一个指向对象拷贝的指针，该指针随后存储在第\
  \ 83 行的第二个数组中。在输出的第 1 行，用户被提示并响应为 3，选择创建一个哺乳动物。调用了 `Mammal` 构造函数。在第 3 行，用户选择 1 并创建了一个狗。调用了\
  \ `Mammal` 和 `Dog` 构造函数。最后，在第 6 行，用户选择 2 表示猫。调用了 `Mammal` 和 `Cat` 构造函数。\n\n输出的第\
  \ 9 行代表对第 82 行（第一个 `for` 循环内）第一个对象的 `speak()` 调用。虚函数 `speak()` 函数被调用，并执行了正确的 `speak()`\
  \ 版本。然后调用 `clone()` 函数，由于它也是虚的，调用了 `Mammal` 的 `clone()` 函数，导致调用了 `Mammal` 构造函数。第\
  \ 11–13 行对 `Dog` 重复了操作，第 14–16 行对 `Cat` 也复了了操作。最后，遍历新数组（输出 14–18，代码 85–88），并对每个新对象调用了\
  \ `speak()`。\n\n这种方法与使用拷贝构造函数的区别在于，你作为程序员必须显式地调用 `clone()` 函数。拷贝构造函数在对象被拷贝时是自动调用的。但那种方法降低了灵活性。\n\
  \n### 虚函数的开销\n\n由于具有虚成员函数的对象必须维护一个虚函数表（vtable），因此使用它们需要一些开销。如果你有一个不预期从中派生其他类的小类，那么可能没有理由使用任何虚函数。在声明任何函数之后，你已经支付了虚函数表的大大部分（尽管每个条目确实添加了微小的内存开销）。在那个时刻，你希望析构函数是虚的，并且会假设其他函数可能也是虚的。仔细观察非虚函数，并确定它们不是虚函数的原因。\n\
  \n### 总结\n\n- 多态允许在一组通过继承关系相关的类中通过不同的成员函数实现相同的接口。\n- 这使得相关对象能够以相同的方式进行处理。\n\n###\
  \ 问答\n\n**Q. 为什么不把所有函数都变成虚函数？**\n\n**A.** 这会产生开销。许多 C++ 程序员认为如果一个函数是虚的，那么其他的也应该是。\n\
  \n### 练习\n\n你过去一小时学习了多态和派生类。现在你应该回答几个问题并做一些练习来巩固这些知识。\n\n#### 测验\n\n1. 当对象存储在基类类型的变量中，C++\
  \ 程序如何知道调用哪个虚函数？\n   A. 函数具有 `virtual` 关键字。\n   B. 使用虚函数表。\n   C. 这是可能的。\n\n2. 哪种类型的成员函数不能是虚？\n\
  \   A. 构造函数\n   B. 析构函数\n   C. Clone\n\n3. 在运行时指针绑定到对象（如多态所示），这被称为什么？\n   A. 晚绑定\n\
  \   B. 静态绑定\n   C. 解引用\n\n#### 答案\n\n1. B. 虚函数表为你跟踪了这些信息。正是与该表相关的开销使得虚函数的使用比普通函数略贵一点。\n\
  \n2. A. 构造函数（包括拷贝构造函数）。\n\n3. A. 晚绑定发生在运行时。\n\n#### 活动\n\n1. 修改 `Mammal8` 程序，注释掉第\
  \ 21 行：`dog` 内部的 `speak()` 成员函数。你能想到在哪些情况下这样做是合理的吗？\n\n\n\n\n\n## 2. 修改 `Mammal10`\
  \ 程序以移除第 8 行的 `virtual` 关键字（基类中 `speak()` 的定义）？你能看出为什么重写函数从未被调用过吗？\n\n要查看这些练习的解决方案，请访问书籍网站：[`cplusplus.cadenhead.org`](http://cplusplus.cadenhead.org)。\n\
  \n## 第 18 小时：使用高级多态\n\n你将在这一小时学到：\n\n- 什么是向下转型（casting down）以及你为什么可能需要这样做它\n- 什么是抽象数据类型\n\
  - 什么是纯虚函数\n\n### 单继承的问题\n\n在之前的时节中，派生对象是以其基类的方式通过多态性被处理的。你已经看到，如果基类有一个成员函数 `speak()`，且该函数在派生类中被重写，那么赋值给派生对象的基类对象指针将执行正确的操作。列表\
  \ 18.1 中的 `Mammal12` 程序阐述了这一思想。\n\n### 列表 18.1 `Mammal12.cpp` 的全文\n\n点击此处查看代码图像\n\
  \n```cpp\n1: #include <iostream>\n2:\n3: class Mammal\n4: {\n5: public:\n6:    \
  \ Mammal():age(1) { std::cout << \"Mammal constructor ...\\n\"; }\n7:     virtual\
  \ ~Mammal() { std::cout << \"Mammal destructor ...\\n\"; }\n8:     virtual void\
  \ speak() const { std::cout << \"Mammal speak!\\n\"; }\n9: protected:\n10:     int\
  \ age;\n11: };\n12:\n13: class Cat : public Mammal\n14: {\n15: public:\n16:    \
  \ Cat() { std::cout << \"Cat constructor ...\\n\"; }\n17:     ~Cat() { std::cout\
  \ << \"Cat destructor ...\\n\"; }\n18:     void speak() const { std::cout << \"\
  Meow!\\n\"; }\n19: };\n20:\n21: int main()\n22: {\n23:     Mammal *pCat = new Cat;\n\
  24:     pCat->speak();\n25:     return 0;\n26: }\n```\n\n当你运行 `Mammal12` 程序时，会显示以下输出：\n\
  \n```\nMammal constructor ...\nCat constructor ...\nMeow!\n```\n\n在第 8 行，`speak()`\
  \ 被声明为虚成员函数，随后在第 18 行被重写，并在第 24 行被调用。再次注意，`pCat` 被声明为指向 `Mammal` 的指针，但赋值给它的是 `Cat`\
  \ 的地址。正如在第 17 小时 中讨论的“使用多态和派生类”，这就是多态性的精髓。\n\n然而，如果你想为 `Cat` 添加一个对 `Mammal` 来不适当的成员函数，会发生什么呢？假设你想添加一个名为\
  \ `purr()` 的函数。猫会打呼噜声，但其他哺乳动物不会。你可以这样声明你的类：\n\n点击此处查看代码图像\n\n```cpp\nclass Cat:\
  \ public Mammal\n{\npublic:\n    Cat() { std::cout << \"Cat constructor ...\\n\"\
  ; }\n    ~Cat() { std::cout << \"Cat destructor ...\\n\"; }\n    void speak() const\
  \ { std::cout << \"Meow!\\n\"; }\n    void purr() const { std::cout << \"Rrrrrrrr!\\\
  n\"; }\n};\n```\n\n问题在于：如果你现在使用你指向 `Mammal` 的指针调用 `purr()`，你将得到一个编译错误，显示“'Purr’不是\
  \ Mammal 的成员”。\n\n当你的编译器尝试在它的 `Mammal` 虚函数表中解析 `purr()` 时，并没有该条目。你可以将此函数移动到基类中，但这是一个坏主意。虽然这作为权宜之计可行行的，但在基类中填充特定于派生类的函数是糟糕的编程习惯，也是导致代码难以维护的根源。\n\
  \n事实上，整个问题反映了糟糕的设计。通常，如果你有一个指向派生类对象的基类指针，那是因为你*意图*以多态的方式使用该对象，在这种情况下，你不应该试图尝试去访问特定于派生类的函数。\n\
  \n问题不在于你有这些函数；而在于你试图通过基类来获取它们。在理想的世界里，当你拥有这样的指针时，你不会尝试获取那些函数。但这不是理想世界，有时你会发现自己有一组基类对象——一个装满哺乳动物的动物。在某个时刻，你可能会意识到你有一个\
  \ `Cat` 对象，并且你想让该家伙打呼噜。在这种情况下，可能只有一种办法：作弊。要作弊，将你的基指针转换为你的派生类型。你对编译器说：“我知道这真的是只猫，所以按我说的做。”为了实现这一点，你将使用\
  \ `dynamic_cast` 运算符。该运算符确保你在进行转换时转换是安全的。它的工作原理如下：如果你有一个指向基类的指针，并将其赋值为派生类对象（如 `Cat`），你可以通过多态使用\
  \ `Mammal`。如果你需要调用 `purr()` 函数，可以使用 `dynamic_cast` 运算符来创建一个 `Cat` 指针。在运行时会检查转换。如果转换是正确的，`Cat`\
  \ 指针就是有效的。如果转换是不准确的，你的指针将为 `null`。`Mammal13` 程序在列表 18.2 中阐述了这一点。\n\n### 列表 18.2\
