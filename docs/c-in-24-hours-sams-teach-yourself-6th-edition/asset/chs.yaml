  \ 运算符确保了该对象是一个 `Cat`。如果是的话，指针将不等于 `null` 并通过第 56 行的条件测试。\n\n### 抽象数据类型\n\n通常，你经常一起创建一个类层级结构。例如，你可能会创建一个\
