  # 什么是引用\n\n在过去的两个小时里，你学习了如何使用指针来操作堆上的对象并间接接引用这些对象。本小时的主题是引用，它为你提供了指针几乎的所有功能，但语法要简单得多。\n\
  \n`reference`（引用）是一个别名。当你创建一个引用时，你用另一个对象的名称（即目标）来初始化它。从那一刻起，该引用就作为目标的一个替代名称，你对引用执行的任何操作实际上都是在目标上进行的。\n\
  \n你可能在其他地方读到引用就是指针，但这是错误的。虽然引用通常使用指针来实现，但那是编译器编写者才关心的问题；作为一名程序员，你必须将这两个概念区分开。\n\n\
  指针是存储另一个对象地址的变量。引用是对象的别名。\n\n### 创建引用\n\n你通过编写目标对象的类型、随后是引用运算符 `&`、最后是引用的名称来创建一个引用。引用可以使用任何合法的变量名，但在书中，所有的引用名称都以\
  \ `r` 开头，且第二个字母大写。因此，如果你有一个名为 `someInt` 的整数变量，你可以通过以下语句为该变量创建一个引用：\n\n```cpp\nint\
  \ &rSomeRef = someInt;\n```\n\n这读作“`rSomeRef` 是一个整数的引用，初始化为指向 `someInt`”。[Listing\
  \ 12.1] 中的 Reference 程序展示了如何创建和使用引用。\n\n**LISTING 12.1 `Reference.cpp` 的全文**\n\n\
  ```cpp\n#include <iostream>\n\nint main()\n{\n    int intOne;\n    int &rSomeRef\
  \ = intOne;\n\n    intOne = 5;\n    std::cout << \"intOne: \" << intOne << std::endl;\n\
  \    std::cout << \"rSomeRef: \" << rSomeRef << std::endl;\n\n    rSomeRef = 7;\n\
  \    std::cout << \"intOne: \" << intOne << std::endl;\n    std::cout << \"rSomeRef:\
  \ \" << rSomeRef << std::endl;\n    return 0;\n}\n```\n\n引用产生了以下输出：\n\n```text\n\
  intOne: 5\nrSomeRef: 5\nintOne: 7\nrSomeRef: 7\n```\n\n在第 5 行，声明了一个局部 `int` 变量 `intOne`。在第\
  \ 6 行，声明了一个 `int` 引用 `rSomeRef` 并将其初始化为指向 `intOne`。如果你声明了一个引用但不对其初始化，就会得到编译器错误。引用必须被初始化。\n\
  \n在第 8 行，`intOne` 被赋值为值 5。在第 9-10 行，显示了 `intOne` 和 `rSomeRef` 中的值，它们是相同的，因为 `rSomeRef`\
  \ 仅仅是 `intOne` 的引用。\n\n在第 12 行，7 被赋值给 `rSomeRef`。因为这是一个引用，它是 `intOne` 的别名，因此 7 实际上被赋值给了\
  \ `intOne`，正如第 13-14 行的显示所示。\n\n### 注意事项\n\n引用运算符 `&` 与取地址运算符使用的是同一个符号。在这种情况下，它用于声明中。\n\
  \n请记住，对于指针来说，声明中的星号（`*`）表示变量是一个指针。在语句中，当与指针一起使用时，它是间接运算符；当用在数学表达式时，它是乘法运算符。\n\n\
  ## 在引用上使用取地址运算符\n\n如果你向引用请求它的地址，它返回其目标的地址。这就是引用的本质——它们是目标的别名。\n\n[Listing 12.2]\
  \ 中的 Reference2 程序演示了这一概念。\n\n**LISTING 12.2 `Reference2.cpp` 的全文**\n\n```cpp\n\
  #include <iostream>\n\nint main()\n{\n    int  intOne;\n    int &rSomeRef = intOne;\n\
  \n    intOne = 5;\n    std::cout << \"intOne: \" << intOne << std::endl;\n    std::cout\
  \ << \"rSomeRef: \" << rSomeRef << std::endl;\n    std::cout << \"&intOne: \" <<\
  \ &intOne << std::endl;\n    std::cout << \"&rSomeRef: \" << &rSomeRef << std::endl;\n\
  \    return 0;\n}\n```\n\n这里是 Reference2 的输出：\n\n```text\nintOne: 5\nrSomeRef: 5\n\
  &intOne: 0x60fe98\n&rSomeRef: 0x60fe98\n```\n\n再次，`rSomeRef` 被初始化为对 `intOne` 的引用。这次显示了两个变量的地址，并且它们是相同的。C++\
  \ 没有提供访问引用本身地址的方法，因为这是没有意义的，就像你不会使用指针或其他变量一样。引用在创建时被初始化，并且始终作为其目标的同义词，即使应用了取地址运算符。\n\
  \n例如，如果你有一个类 `President`，你可能会如下声明该类的实例：\n\n```cpp\nPresident Millard_more;\n```\n\
  \n然后你可能会声明一个对 `President` 的引用并用该对象初始化它：\n\n```cpp\nPresident &Fillmore = Millard_more;\n\
  ```\n\n只有一个 `President`；两个标识符都指向同一个对象。对 `Fillmore` 执行的任何操作都会作用在 `Millard_more` 上。\n\
  \n请区分 [12.2] 中第 6 行的 `&` 符号（它声明了一个名为 `rSomeRef` 的 `int` 引用）与第 12 和 13 行的 `&` 符号（它们返回整数变量\
  \ `intOne` 和引用 `rSomeRef` 的地址）。\n\n通常，当你使用引用时并不使用取地址运算符。你像使用目标变量一样使用引用。这在第 10 行所示。\n\
  \n即使是经验丰富的 C++ 程序员知道引用不能重新赋值且始终是目标的别名这一规则，也会在你尝试重新赋值引用时感到困惑：看似是重新赋值的结果是给目标赋值了一个新值。[Listing\
  \ 12.3] 中的 Assignment 程序演示了这一点。\n\n**LISTING 12.3 `Assignment.cpp` 的全文**\n\n```cpp\n\
  #include <iostream>\n\nint main()\n{\n    int intOne;\n    int &rSomeRef = intOne;\n\
  \n    intOne = 5;\n    std::cout << \"intOne:\\t\" << intOne << std::endl;\n   \
  \ std::cout << \"rSomeRef:\\t\" << rSomeRef << std::endl;\n    std::cout << \"&intOne:\\\
  t\" << &intOne << std::endl;\n    std::cout << \"&rSomeRef:\\t\" << &rSomeRef <<\
  \ std::endl;\n\n###int intTwo = 8;\n    rSomeRef = intTwo; // 不是你想的那样！\n    std::cout\
  \ << \"\\nintOne:\\t\" << intOne << std::endl;\n    std::cout << \"intTwo:\\t\"\
  \ << intTwo << std::endl;\n    std::cout << \"rSomeRef:\\t\" << rSomeRef << std::endl;\n\
  \    std::cout << \"&intOne:\\t\" << &intOne << std::endl;\n    std::cout << \"\
  &intTwo:\\t\" << &intTwo << std::endl;\n    std::cout << \"&rSomeRef:\\t\" << &rSomeRef\
  \ << std::endl;\n    return 0;\n}\n```\n\n程序显示此输出：\n\n```text\nintOne: 5\nrSomeRef:\
  \ 5\n&intOne: 0x60fe98\n&rSomeRef: 0x60fe98\nintOne: 8\nintTwo: 8\nrSomeRef: 8\n\
  &intOne: 0x60fe98\n&intTwo: 0x60fe94\n&rSomeRef: 0x60fe98\n```\n\n\n\n\n不出所然，当显示\
  \ `intOne` 和 `rSomeRef` 的值时（第 16–18 行），它们的值与 `intTwo` 相同。事实上，当第 19–21 行打印地址时，你会发现\
  \ `rSomeRef` 仍然指向 `intOne` 而不是 `intTwo`。\n\n### 什么对象可以被引用？\n\n任何对象都可以被引用，包括用户定义的对象。注意，你创建的是对对象的引用，而不是对类或数据类型（如\
  \ `int`）。你不应该写这样的代码：\n\n```cpp\nint &rIntRef = int; // 错误\n```\n\n你必须将 `rIntRef`\
  \ 初始化为一个特定的整数，例如：\n\n```cpp\nint howBig = 200;\nint &rIntRef = howBig;\n```\n\n\
  同样地，你不能对 `Cat` 的引用进行初始化：\n\n```cpp\nCat &rCatRef = Cat; // 错误\n```\n\n你必须将 `rCatRef`\
  \ 初始化为一个特定的 `Cat` 对象：\n\n```cpp\nCat Frisky;\nCat &rCatRef = Frisky;\n```\n\n对对象的引用使用方式与对象本身相同。成员数据和函数通过普通的类成员访问运算符（`.`）进行访问。与内置类型一样，引用充当了对象的别名。\n\
  \n### 空指针与空引用\n\n当指针未初始化或被删除时，它们应该被赋值为 `nullptr`。但这对于引用来说是不成立的。事实上，引用不能为空，而一个包含指向空对象的引用的程序被认为是无效程序。当程序无效时，几乎可以发生任何事情。它可能看起来运行正常，可能伴随着微小的错误运行，也可能删除你硬盘硬盘上的重要文件。这些都是无效程序可能的结果。\n\
  \n大多数编译器都支持空引用而不会有太多抱怨（报错或警告），只有当你尝试以某种方式使用该引用时才会崩溃。然而，利用这一点并不是一个好主意。当你将程序移动到另一台计算机或使用不同的编译器时，如果存在空引用，可能会出现神秘的\
  \ Bug。\n\n### 通过引用传递函数参数\n\n在第 5 小节“调用函数”中，你学习到了函数有两个局限性：参数按值传递的，且 `return` 语句只能返回一个值。\n\
  \n通过引用向函数传递值可以克服这两个局限性。在 C++ 中，通过引用传递有两种实现方式：使用指针和使用引用。语法不同，但最终效果是相同的：并不是在函数作用域内创建一个副本，而是将原始对象传递到函数中。\n\
  \n通过引用传递对象使函数能够修改被引用的对象。\n\n列表 12.4 中的 `ValuePasser` 程序创建了一个 `swap` 函数并按值传递了其参数。\n\
  \n**列表 12.4 `ValuePasser.cpp` 的**全文**\n\n点击此处查看代码图像\n\n```cpp\n1: #include <iostream>\n\
  2:\n3: void swap(int x, int y);\n4:\n5: int main()\n6: {\n7:      int x = 5, y =\
  \ 10;\n8:\n9:      std::cout << \"Main. Before swap, x: \" << x\n10:           \
  \          << \" y: \" << y << std::endl;\n11:      swap(x,y);\n12:      std::cout\
  \ << \"Main. After swap, x: \" << x\n13:                     << \" y: \" << y <<\
  \ std::endl;\n14:      return 0;\n15: }\n16:\n17: void swap (int x, int y)\n18:\
  \ {\n19:      int temp;\n20:\n21:      std::cout << \"Swap. Before swap, x: \" <<\
  \ x\n22:                     << \" y: \" << y << std::endl;\n23:\n24:      temp\
  \ = x;\n25:      x = y;\n26:      y = temp;\n27:\n28:      std::cout << \"Swap.\
  \ After swap, x: \" << x\n29:                     << \" y: \" << y << std::endl;\n\
  30:\n31: }\n```\n\n显示如下输出如下：\n\nMain. Before swap, x: 5 y: 10\nSwap. Before swap,\
  \ x: 5 y: 10\nSwap. After swap, x: 10 y: 5\nMain. After swap, x: 5 y: 10\n\n此程序在\
  \ `main()` 中初始化了两个变量并将它们传递给 `swap()` 函数，该函数似乎交换了它们。但当在 `main()` 中检查它们时，它们并没有改变！此之处的问题在于\
  \ `x` 和 `y` 是按值传递给 `swap()` 的。函数内部创建了局部副本，并交换了这些副本，但原始值保持不变。你想做的是通过引用传递 `x` 和 `y`。在\
  \ C++ 中解决这个问题有两种种方法：你可以让 `swap()` 的参数成为指向原始值的指针，或者你可以传递指向原始值的引用。\n\n#### 使用指针实现\
  \ swap()\n\n当你传递一个指针时，你传递的是对象的实际地址。因此，函数可以操作该地址的值。为了让 `swap()` 修改实际值，函数应该声明为接受两个指针。通过解引用指针，列表\
  \ 12.5 中的 `PointerSwap` 程序展示了这一点。**列表 12.5 `PointerSwap.cpp` 的**全文\n\n点击此处查看代码图像\n\
  \n```cpp\n1: #include <iostream>\n2:\n3: void swap(int *x, int *y);\n4:\n5: int\
  \ main()\n6: {\n7:      int x = 5, y = 10;\n8:\n9:      std::cout << \"Main. Before\
  \ swap, x: \" << x\n10:                     << \" y: \" << y << std::endl;\n11:\
  \      swap(&x, &y);\n12:      std::cout << \"Main. After swap, x: \" << x\n13:\
  \                     << \" y: \" << y << std::endl;\n14:      return 0;\n15: }\n\
  16:\n17: void swap (int *x, int *y)\n18: {\n19:      int temp;\n20:\n21:      std::cout\
  \ << \"Swap. Before swap, x: \" << *x\n22:                     << \" y: \" << *y\
  \ << std::endl;\n23:\n24:      temp = *x;\n25:      *x = *y;\n26:      *y = temp;\n\
  27:\n28:      std::cout << \"Swap. After swap, x: \" << *x\n29:                \
  \     << \" y: \" << *y << std::endl;\n30: }\n```\n\n`PointerSwap` 程序展示了交换尝试的结果：\n\
  \nMain. Before swap, x: 5 y: 10\nSwap. Before swap, x: 5 y: 10\nSwap. After swap,\
  \ x: 10 y: 5\nMain. After swap, x: 10 y: 5\n\n这种方法是成功了！在第 3 行，`swap()` 的原型更改为接受\
  \ `int` 指针而不是 `int`。通过解引用指针，`x` 和 `y` 的值确实被交换了。\n\n#### 使用引用实现 swap()\n\n之前的程序可以工作，但\
  \ `swap()` 函数的语法在两个方面都很繁琐。首先，在 `swap()` 函数中反复需要解引用指针容易出错且难以阅读。其次，在调用函数中传递地址的需求使得\
  \ `swap()` 的内部实现对用户来说过于明显。\n\nC++ 中一个实用的目标是防止函数调用者担心它是如何工作的，而是关注它能做什么以及返回什么值。通过指针传递将负担放在了调用函数上，而这不是它所在的位置。调用函数必须知道传递它想要交换的对象地址。\n\
  \n理解引用语义的负担应该属于实现交换的函数。为了实现这一点，你使用引用。列表 12.6 中的 `ReferenceSwap` 程序使用引用重写了 `swap()`\
  \ 函数。\n\n\n\n\n[content]\n现在调用函数只需传入对象，由于参数被声明为引用，因此语义上是按引用传递的。调用函数不需要任何特殊操作。\n\n\
  ### 列表 12.6 `ReferenceSwap.cpp` 的完整文本\n\n点击此处查看代码图像\n\n```cpp\n1: #include <iostream>\n\
  2:\n3: void swap(int &x, int &y);\n4:\n5: int main()\n6: {\n7:     int x = 5, y\
  \ = 10;\n8:\n9:     std::cout << \"Main. Before swap, x: \" << x\n10:          \
  \          << \" y: \" << y << std::endl;\n11:     swap(x, y);\n12:     std::cout\
  \ << \"Main. After swap, x: \" << x\n13:                    << \" y: \" << y <<\
  \ std::endl;\n14:     return 0;\n15: }\n16:\n17: void swap(int &rx, int &ry)\n18:\
  \ {\n19:     int temp;\n20:\n21:     std::cout << \"Swap. Before swap, rx: \" <<\
  \ rx\n22:                    << \" ry: \" << ry << std::endl;\n23:\n24:     temp\
  \ = rx;\n25:     rx = ry;\n26:     ry = temp;\n27:\n28:     std::cout << \"Swap.\
  \ After swap, rx: \" << rx\n29:                    << \" ry: \" << ry << std::endl;\n\
  30: }\n```\n\n在程序的输出中，展示了交换的成功：\n\n点击此处查看代码图像\n\nMain. Before swap, x: 5 y: 10\n\
  Swap. Before swap, rx: 5 ry: 10\nSwap. After swap, rx: 10 ry: 5\nMain. After swap,\
  \ x: 10 y: 5\n\n正如指针示例一样，声明了两个变量（第 7 行），并在第 9–10 行显示了它们的值。在第 11 行调用了函数 `swap()`，但注意这里传递的是\
  \ `x` 和 `y`，而不是它们的地址。调用函数只需传递变量即可。\n\n当调用 `swap()` 时，程序执行跳转到第 17 行，在该处，通过参数类型和名称之间的引用运算符\
  \ `&` 将变量识别为引用。`x` 和 `y` 的值在第 21–22 行显示，但注意不需要任何特殊的操作符。它们是原始值的别名，可以像别名一样被使用。\n\n\
  在第 24–26 行交换了这些值，然后在第 28–29 行显示。程序执行跳转回调用函数，并在第 12–13 行在 `main()` 中显示了这些值。由于 `swap()`\
  \ 的参数被声明为引用，因此来自 `main()` 的值是通过引用传递的，从而在 `main()` 中也被改变了。\n\n引用提供了普通变量的便利性和易用，同时结合了指针的力量和按引用传递的能力。\n\
  \n### 理解函数头和原型\n\n接收引用的 `swap()` 函数更易用，代码也更易读。但调用函数如何知道值是按引用传递还是按值传递的？作为 `swap()`\
  \ 的用户，程序员必须确保 `swap()` 实际上会改变参数。\n\n这是函数原型的另一个用途。通过检查原型中声明的参数（原型通常与所有其他原型一起位于头文件中），程序员就能知道传入\
  \ `swap()` 的值是按引用传递的，因此它们将能够正确地交换。\n\n如果 `swap()` 是一个类的成员函数，那么类的声明（同样在头文件中可用）将提供这些信息。\n\
  \n在 C++ 中，类的用户（任何使用该类的其他类）依赖头文件来获取所有所需信息。该文件充当类或函数的接口。实际实现对客户端是隐藏的，这使得程序员能够关注当前的问题，并在不担心其如何实现的情况下使用该类或函数。\n\
  \n### 返回多个值\n\n正如前面讨论的，函数可以返回一个值。但如果你需要从一个函数获取两个两个值呢？解决此问题的方法之一是通过引用将两个对象传入函数。然后函数就可以用正确的值填充这些对象。由于按引用传递允许函数修改原始对象，这实际上允许函数返回两个信息。这种方法绕过了函数的返回值，返回值随后可以预留给错误。\n\
  \n再次，这可以通过引用或指针完成。列表 12.7 中的 `ReturnPointer` 程序演示了一个返回三个值的函数，其中两个作为指针参数，一个作为返回值。\n\
  \n#### 列表 12.7 `ReturnPointer.cpp` 的完整文本\n\n点击此处查看代码图像\n\n```cpp\n1: #include <iostream>\n\
  2:\n3: short factor(int, int*, int*);\n4:\n5: int main()\n6: {\n7:     int number,\
  \ squared, cubed;\n8:     short error;\n9:\n10:     std::cout << \"Enter a number\
  \ (0–20): \";\n11:     std::cin >> number;\n12:\n13:     error = factor(number,\
  \ &squared, &cubed);\n14:\n15:     if (!error)\n16:     {\n17:         std::cout\
  \ << \"number: \" << number << \"\\n\";\n18:         std::cout << \"square: \" <<\
  \ squared << \"\\n\";\n19:         std::cout << \"cubed: \" << cubed << \"\\n\"\
  ;\n20:     }\n21:     else\n22:         std::cout << \"Error encountered!!\\n\"\
  ;\n23:     return 0;\n24: }\n25:\n26: short factor(int n, int *pSquared, int *pCubed)\n\
  27: {\n28:     short value = 0;\n29:     if (n > 20)\n30:     {\n31:         value\
  \ = 1;\n32:     }\n33:     else\n34:     {\n35:         *pSquared = n*n;\n36:  \
  \       *pCubed = n*n*n;\n37:         value = 0;\n38:     }\n39:     return value;\n\
  40: }\n```\n\n`ReturnPointer` 程序产生以下输出：\n\nEnter a number (0–20): 13\nnumber: 13\n\
  square: 169\ncubed: 2197\n\n在第 7 行，`number`、`squared` 和 `cubed` 被定义为 `int`。`number`\
  \ 根据用户输入赋值。`squared` 和 `cubed` 的地址传递给函数 `factor()`。`factor()` 检查第一个参数，它是按值传递的。如果它大于\
  \ 20（该函数能处理的最大值），它会将 `value` 设置为 1。注意，函数的返回值被留给了这个错误值或 0 值，表示一切正常）。函数在第 39 行返回该值。\n\
  \n调用函数的实际值（`number` 的平方和立方）不是通过返回值返回的，而是通过传入的指针修改的。在第 35–36 行，指针被赋予了值。在第 37 行，`value`\
  \ 被赋值为 0。\n\n该程序的另一个改进可能是声明如下：\n\n点击此处查看代码图像\n\n`enum ERR_CODE { SUCCESS, ERROR\
  \ };`\n\n那么，与其返回 0 或 1，程序可以返回 `SUCCESS` 或 `ERROR`。枚举常量根据顺序赋予整数值，因此第一个枚举值（`SUCCESS`）为\
  \ 0，第二个为 1。\n\n#### 按引用返回值\n\n尽管 `ReturnPointer` 程序可以工作，但通过使用引用而不是指针可以使其更易读和维护。列表\
  \ 12.8 中的 `ReturnReference` 程序展示了使用引用重写并结合 `ERR_CODE` 枚举的程序。\n\n### 列表 12.8 `ReturnReference.cpp`\
  \ 的完整文本\n\n点击此处查看代码图像\n\n```cpp\n1: #include <iostream>\n2:\n3: enum ERR_CODE {\
  \ SUCCESS, ERROR };\n4:\n5: ERR_CODE factor(int, int&, int&);\n6:\n7: int main()\n\
  8: {\n9:     int number, squared, cubed;\n10:    ERR_CODE result;\n11:\n12:    \
  \ std::cout << \"Enter a number (0–20): \";\n13:     std::cin >> number;\n14:\n\
  15:     result = factor(number, squared, cubed);\n16:\n17:     if (result == SUCCESS)\n\
  18:     {\n19:         std::cout << \"number: \" << number << \"\\n\";\n20:    \
  \     std::cout << \"square: \" << squared << \"\\n\";\n21:         std::cout <<\
  \ \"cubed: \" << cubed << \"\\n\";\n22:     }\n23: }\n```\n\n\n\n\n\n```cpp\nelse\n\
  \  {\n    std::cout << \"Error encountered!!\\n\";\n  }\n  return 0;\n}\n\nERR_CODE\
  \ factor(int n, int &rSquared, int &rCubed)\n{\n    if (n > 20)\n    {\n       \
  \ return ERROR;   // 错误代码\n    }\n    else\n    {\n        rSquared = n * n;\n \
  \       rCubed = n * n * n;\n        return SUCCESS;\n    }\n}\n```\n\n这里是 `ReturnReference`程序的示例输出：\n\
  \n输入一个数字 (0–20): 15\n\nnumber: 15\n\nsquare: 225\n\ncubed: 3375\n\n`ReturnReference`\
  \ 程序与 `ReturnPointer` 程序相同，仅有两处不同：首先，`ERR_CODE` 枚举使得第 34 行和 40 行的错误报告更加显式，且第 17\
  \ 行的错误处理也是如此。\n\n较大的变化是 `factor()` 现在被声明为接收 `squared` 和 `cubed` 的引用而不是指针。这使得对这些参数的操作变得更加简单且易于理解。\n\
  \n### 总结\n\n在本小时中，你学习了引用，它的作用与指针类似，有时会被误认为是指针。区别在于，指针是存储对象地址的变量，而引用是对象的别名。\n\n理解指针和引用的区别至关重要。\n\
  \n引用是另一个对象（称为目标）的别名。引用作为目标的替代名称。对引用采取的任何操作实际上都会影响目标。\n\n引用以更简单的语法提供了指针的强大功能。\n\n\
  ### 问答\n\n**Q. 既然指针可以完成引用能做的所有事情，为什么还要使用引用？**\n\n**A.** 引用更容易使用和理解。间接性被隐藏了，不需要反复对变量进行解引用。\n\
  \n**Q. 既然引用更容易，为什么还要使用指针？**\n\n**A.** 引用不能为 `NULL` 且不能重新赋值。指针提供了更大的灵活性，但更难使用。\n\n\
  **Q. 某类物种在迪士尼世界灭绝是真的吗？**\n\n**A.** 位于佛罗里达州奥兰多迪士尼世界的发现岛（Discovery Island）自然保护区是暗色海边雀（Dusky\
  \ Seaside Sparrow）最后的家园，这是一种非迁徙鸟，主要栖息地是佛罗里达州的梅瑞岛和圣约翰河。\n\n喷洒杀虫剂 DDT、控制蚊子的故意淹水以及公路建设破坏了这种鸟的栖息地，导致其数量在\
  \ 20 世纪下半叶期间不断减少。到 1979 年，已知仅剩六只这种雀——而且全都是雄性。\n\n最后四只雀被带到迪士尼的自然保护区与斯科特海边雀进行杂交繁殖计划，但并未成功。\n\
  \n该物种于 1990 年被宣布灭绝。\n\n### 工作坊\n\n现在你已经有机会看到引用的应用，你可以回答几个问题并完成一些练习来检查你的知识。\n\n####\
  \ 测验\n\n**[1]](#part0023.html_ch12ans01)。** 什么是引用？\n\n**A.** 别名\n\n**B.** 同义词\n\n\
  **C.** a 和 b 都是\n\n**[2]](#part0023.html_ch12ans02)。** 使用什么运算符创建引用？\n\n**A.** `->`\n\
  \n**B.** `&`\n\n**C.** `*`\n\n**[3]](#part0023.html_ch12ans03)。** C++ 中将变量传递给被调用函数的默认机制是什么？覆盖该机制的技巧有哪些？\n\
  \n**A.** 按值传递\n\n**B.** 按引用传递\n\n**C.** 传递沙拉\n\n#### 答案\n\n**[1]](#part0023.html_ch12que01).\
  \ C.** 引用是另一个变量或对象的别名或同义词。\n\n**[2]](#part0023.html_ch12que02). B.** 在声明引用时使用取地址符（`&`）。引用在声明时必须初始化。你不能像指针那样拥有一个空引用。\n\
  \n**[3]](#part0023.html_ch12que03). A.** 按值传递是将变量的拷贝传递给函数而不是原始——这防止了函数更改原始值。指针是绕过按值传递的一种方法，因为它传递了原始值的地址。\n\
  \n#### 活动\n\n**1.** 修改 `ReturnPointer` 程序以使用引用。\n\n**2.** 重写 `Swap` 程序。\n\n要查看这些活动的解决方案，请访问\
  \ [`cplus.aden.org`](http://cplus.aden.org)。\n\n## 13. 开发引用和指针\n\n* *\n\n在本小时你将学到：\n\
  \n- 如何使用引用\n- 如何决定何时使用指针\n- 如何避免陷阱\n\n### 按引用传递\n\n每当你通过值将一个对象传递给函数时，都会创建一个拷贝。每当你从函数返回一个对象时，也会创建一个拷贝。对于大型对象，这些拷贝可能是巨大的。\n\
  \n按引用传递避免了创建拷贝和调用拷贝构造函数。然而，它也让对象暴露于函数的改变。\n\n按引用传递避免了创建拷贝和调用拷贝构造函数，通常效率更高。另一方面，它传递的是对象本身，因此该对象在被调用函数中会被改变。\n\
  \n```cpp\n#include <iostream>\n\nclass SimpleCat\n{\npublic:\n    SimpleCat(); \
  \        // 构造函数\n    SimpleCat(SimpleCat&); // 拷贝构造函数\n    ~SimpleCat();      \
  \  // 析构函数\n};\n\nSimpleCat::SimpleCat()\n{\n    std::cout << \"Simple Cat Constructor\
  \ ...\" << std::endl;\n}\n\nSimpleCat::SimpleCat(SimpleCat&)\n{\n    std::cout <<\
  \ \"Simple Cat Copy Constructor ...\" << std::endl;\n}\n\nSimpleCat::~SimpleCat()\n\
  {\n    std::cout << \"Simple Cat Destructor ...\" << std::endl;\n}\n\nSimpleCat\
  \ FunctionOne(SimpleCat theCat);\nSimpleCat* FunctionTwo(SimpleCat *theCat);\n\n\
  int main()\n{\n    std::cout << \"Making a cat ...\" << std::endl;\n    SimpleCat\
  \ Frisky;\n}\n```\n\n\n\n\n\n```cpp\n33:    std::cout << \"Calling FunctionOne ...\"\
  \ << std::endl;\n34:    FunctionOne(Frisky);\n35:    std::cout << \"Calling FunctionTwo\
  \ ...\" << std::endl;\n36:    FunctionTwo(&Frisky);\n37:    return 0;\n38: }\n\n\
  // FunctionOne, 按值传递\nSimpleCat FunctionOne(SimpleCat theCat)\n{\n43:    std::cout\
  \ << \"Function One. Returning ...\" << std::endl;\n44:    return theCat;\n45: }\n\
  \n// functionTwo, 按引用传递\nSimpleCat* FunctionTwo (SimpleCat *theCat)\n{\n50:    std::cout\
  \ << \"Function Two. Returning ...\" << std::endl;\n51:    return theCat;\n52: }\n\
  ```\n\n运行程序时，显示以下输出内容：\n\n点击此处查看代码图片\n\n1: 正在制作一只猫 ...\n2: SimpleCat 构造函数 ...\n\
  3: 正在调用 FunctionOne ...\n4: SimpleCat 拷贝构造函数 ...\n5: Function One. 返回中 ...\n6: SimpleCat\
