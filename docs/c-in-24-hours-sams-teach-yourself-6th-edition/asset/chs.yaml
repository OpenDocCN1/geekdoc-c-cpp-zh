  n\";\n}\n```\n\n`StaticFunction` 程序创建了机器人，每次调用 `countots()` 静态函数来查看存在多少机器人，输出如下：\n\
  \n有 1 个机器人。\n有 2 个机器人。\n有 3 个机器人。\n有 4 个机器人。\n有 5 个机器人。\n有 4 个机器人。\n有 3 个机器人。\n\
  有 2 个机器人。\n有 0 个机器人。\n\n静态成员变量 `constructorCount` 在 `Robot` 定义的第 13 行声明。公共访问器 `getMany()`\
  \ 被声明为 `public` 和 `static`，位于第 10 行。\n\n由于 `getMany()` 是公开的，它可以被任何函数访问。因此，在第 41\
  \ 行，函数 `countots()` 能够访问 `Robot` 对象，尽管它没有 `this` 指针（在 `main()` 函数中与其他访问器函数一样）。\n\
  \n### 注意\n\n静态成员函数没有 `this` 指针，因此它们不能被声明为 `const`。此外，成员变量通过成员函数中的 `this` 指针访问，静态成员函数无法访问成员变量。\n\
  \n### 包含（Containment）\n\n正如你之前看到的，类的成员数据包含另一个类的对象。这在外部类（outer class）和内部类（inner class）之间建立了“包含”关系。C++\
  \ 程序员说，外部类包含了内部类。`Employee` 类可能包含 `String` 对象，用于员工的姓名以及工资等。\n\n`String` 类在 `Listing\
  \ 20.3` 中定义了一个精简但实用的类。该文件应保存为 `String.hpp` 并在稍后的章节中使用。\n\n** 列表 20.3 String.hpp\
  \ 的完整文本**\n\n```cpp\n#include <iostream>\n#include <string.h>\n\nclass String\n\
  {\npublic:\n    // 构造函数\n    String();\n    String(const char *const);\n    String(const\
  \ String&);\n    ~String();\n\n    // 载载运算符\n    char& operator[](int offset);\n\
  \    char operator[](int offset) const;\n    String operator+(const String&);\n\
  \    void operator+=(const String&);\n    String& operator= (const String &);\n\n\
  \    // 访问器\n    int getLen() const { return len; }\n    const char* getString()\
  \ const { return value; }\n    // static int constructorCount;\n\nprivate:\n   \
  \ String(int); // 私有构造函数\n    char* value;\n    int len;\n};\n\n// 默认构造函数创建 0 字节的字符串\n\
  String::String()\n{\n    value = new char[1];\n    value[0] = '\\0';\n    len =\
  \ 0;\n    std::cout << \"\\tDefault constructor\";\n    // constructorCount++;\n\
  }\n\n// 私有（辅助）构造函数，由类函数用于创建指定大小的新字符串。\nString::String(int len)\n{\n    value = new\
  \ char[len + 1];\n    int i;\n    for (i = 0; i < len; i++)\n        value[i] =\
  \ '\\0';\n    this->len = len;\n    std::cout << \"\\tString(int) constructor\"\
  ;\n    // constructorCount++;\n}\n\nString::String(const char* const cString)\n\
  {\n    len = strlen(cString);\n    value = new char[len + 1];\n    int i;\n    for\
  \ (i = 0; i < len; i++)\n        value[i] = cString[i];\n    value[len] = '\\0';\n\
  \    std::cout << \"\\tString(char*) constructor\";\n    // constructorCount++;\n\
  }\n\nString::String(const String& rhs)\n{\n    len = rhs.getLen();\n    value =\
  \ new char[len + 1];\n    int i;\n    for (i = 0; i < len; i++)\n        value[i]\
  \ = rhs[i];\n    value[len] = '\\0';\n    std::cout << \"\\tString(String&) constructor\"\
  ;\n    // constructorCount++;\n}\n\nString::~String()\n{\n    delete [] value;\n\
  \    len = 0;\n    std::cout << \"\\tString destructor\";\n}\n\n// 赋值运算符，释放现有内存然后拷贝字符串和大小\n\
  String& String::operator=(const String &rhs)\n{\n    if (this == &rhs)\n       \
  \ return *this;\n    delete [] value;\n    len = rhs.getLen();\n    value = new\
  \ char[len + 1];\n    int i;\n    for (i = 0; i < len; i++)\n        value[i] =\
  \ rhs[i];\n    value[len] = '\\0';\n    return *this;\n    std::cout << \"\\toperator=\"\
  ;\n}\n\n// 非 const 运算符，返回字符引用以便修改\nchar& String::operator[](int offset)\n{\n   \
  \ if (offset < len)\n        return value[offset];\n    else\n        return value[len];\n\
  }\n\n// const 运算符，用于 const 对象（见拷贝构造函数！）\nchar String::operator[](int offset) const\n\
  {\n    if (offset < len)\n        return value[offset];\n    else\n        return\
  \ value[len];\n}\n\n// 通过将当前字符串加 rhs 创建新字符串\nString String::operator+(const String&\
  \ rhs)\n{\n    int totalLen = len + rhs.getLen();\n    int i, j;\n    String temp(totalLen);\n\
  \    for (i = 0; i < len; i++)\n        temp[i] = value[i];\n    for (j = 0; j <\
  \ rhs.getLen(); j++, i++)\n        temp[i] = rhs[j];\n    temp[totalLen] = '\\0';\n\
  \    return temp;\n}\n\n// 修改当前字符串，无返回值\nvoid String::operator+=(const String& rhs)\n\
  {\n    int rhsLen = rhs.getLen();\n    int totalLen = len + rhsLen;\n    int i,\
  \ j;\n    String temp(totalLen);\n    for (i = 0; i < len; i++)\n        temp[i]\
  \ = value[i];\n    for (j = 0; j < rhs.getLen(); j++, i++)\n        temp[i] = rhs[j];\n\
  \    temp[totalLen] = '\\0';\n    *this = temp;\n}\n```\n\n\n\n\n```cpp\n{\n   \
  \ public:\n        Employee();\n        Employee(const char*, const char*, const\
  \ char*, long);\n        ~Employee();\n        Employee(const Employee&);\n    \
