  \ 5 行包含关键字 `public`，它告诉编译器后续的内容是一组公有成员。第 6 行有公有访问器 `getSpeed()` 的声明，它提供了对第 11 行声明的私有成员变量\
  \ `speed` 的访问权限。\n\n*注：此处原文存在大量重复段落，译文已按要求完整保留并翻译这些重复内容。*\n\n### 创建与删除对象\n\n对于内置类型（如整数），有两种定义方法。一种是先定义变量，然后再赋值：\n\
  \n```cpp\nint weight;\nweight = 7;\n```\n\n或者，你可以定义整数并立即初始化它：\n\n```cpp\nint weight\
  \ = 7;\n```\n\n类有一种特殊的成员函数称为*构造函数*（constructor），它在类实例化时被调用。构造函数的工作是创建一个有效的对象，通常包括初始化其数据。构造函数的名称与类名相同，但没有返回值。构造函数可以可以没有参数，就像其他函数一样。\n\
  \n这里有一个 `Tricycle` 类的构造函数：\n\n```cpp\nTricycle::Tricycle(int initialSpeed)\n{\n\
  \    setSpeed(initialSpeed);\n}\n```\n\n此构造函数使用参数设置 `speed` 成员变量的初始值。\n\n当你声明构造函数时，也应该声明一个析构函数（destructor）。就像构造函数创建并初始化类对象一样，析构函数清理对象并释放为它们分配的内存。析构函数的名称在类名前面有一个波浪号（`~`）。析构函数没有参数，也没有返回值。\n\
  \n这里有一个 `Tricycle` 析构函数：\n\n```cpp\nTricycle::~Tricycle()\n{\n    // do nothing\n\
  }\n```\n\n目前该类不需要特殊操作来释放内存，因此析构函数仅包含注释。\n\n#### 默认构造函数\n\n设置对象时有多种方法调用构造函数。\n\n\
  一种是在括号中指定一个或多个参数：\n\n```cpp\nTricycle wichita(5);\n```\n\n参数（或参数）会被发送到构造函数。在这个示例中，它设置了三车的初始速度。\n\
  \n你也可以在指定参数的情况下设置对象：\n\n```cpp\nTricycle wichita;\n```\n\n这会调用类的默认构造函数，即没有参数的构造函数。\n\
  \n#### 编译器提供的构造函数\n\n如果你没有声明构造函数（如你在 Tricycle 程序中所所示），编译器会创建一个默认构造函数。\n\n\n\n\n\
  编译器提供的默认构造函数不执行任何操作；它就像是你声明了一个没有参数且函数体空的构造函数。\n\n有两点需要注意：\n\n![Image](img/00002.jpeg)\
  \ 默认构造函数是任何不带参数的构造函数。你可以自己定义它，也可以由编译器提供一个默认的构造函数。\n\n![Image](img/00002.jpeg) 如果你定义了任何构造函数（无论是否带参数），编译器都不会为你提供默认构造函数。在这种情况下，如果你想要默认构造函数，就必须自己定义它。\n\
  \n如果你没有定义析构函数，编译器也会提供一个，该析构函数的函数体为空且什么都不做。\n\n如果你定义了构造函数，即使你的析构函数什么都不做，定义一个析构函数也是一个良好的习惯。这有助于你记住在需要采取显式步骤释放内存时使用析构函数。\n\
  \n在列表 8.2 中的 `NewTricycle` 程序重写了 `Tricycle` 类，使用构造函数来初始化对象，将其速度设置为初始值。它还演示了在何处调用析构函数。\n\
  \n**列表 8.2** `NewTricycle.cpp` 的全文\n\n点击此处查看代码图像\n\n***\n\n```\n1: #include <iostream>\n\
  2:\n3: class Tricycle\n4: {\n5: public:\n6:     Tricycle(int initialAge);\n7:  \
