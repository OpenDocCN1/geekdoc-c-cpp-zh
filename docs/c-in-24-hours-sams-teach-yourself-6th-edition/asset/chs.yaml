  \         case 1:\n72:             pFunc = &Mammal::speak;\n73:             break;\n\
  74:         default:\n75:             pFunc = &Mammal::move;\n76:             break;\n\
  77:         }\n78:\n79:         (ptr->*pFunc)();\n80:         delete ptr;\n81: \
  \    }\n82:     return 0;\n83: }\n```\n\n\n\n\n\n程序要求用户选择一种对象类型，然后选择在该对象上调的行为（函数）。以下是运行示例：\n\
