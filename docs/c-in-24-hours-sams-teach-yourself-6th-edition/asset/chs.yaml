  \n### 总结\n\nC++ 是创建编程语言时非常受欢迎的语言。当你接触模板（templates）等特性时，原因就变得显而易见了。C++ 暴露了语言的构建模块以便进行修改。模板使得类的功能能够适应多种类型，而无需为每种类型重复代码。通过模板，可以编写抽象代码，使其适用于多种数据类型。\n\
  \n### 问答\n\n**Q. 既然宏可以做到，为什么还要用模板？**\n**A.** 模板是类型安全的并且内置在语言中。编译器可以对模板做更多工作以确保它们被正确使用，从而使生成的程序包含错误的概率更低。\n\
  \n**Q. 模板函数的参数化类型与普通函数有什么区别？**\n**A.** 普通函数（非模板函数）接收参数并可能对这些参数执行操作。模板函数允许你对函数特定参数的类型进行参数化。\n\
  \n**Q. 什么时候使用模板，什么时候使用继承？**\n**A.** 当所有或几乎所有行为保持不变，但类所作用的项目类型不同时，使用模板。如果你发现自己正在复制一个类并只更改其一个或多个成员的类型，那么可能是时候考虑使用模板了。\n\
  \n**Q. 美国是否有任何地方可以使用模板？**\n**A.** 你可以在八个州使用模板：加利福尼亚州和西海岸、阿拉巴马州、乔治亚州、密根州、北卡罗来纳州、南卡罗来纳州和弗吉尼亚州。单张地图的价格约为\
  \ 29 美元，套装更贵。\n\n### 工作坊\n\n现在你已经有机会学习了模板，可以回答几个问题并做几个练习来巩固对该主题的知识。\n\n#### 测验\n\
  \n**1. 编译器如何知道你定义的是模板而不是普通类？**\n**A.** 由预处理器确定。\n**B.** 使用了 `template` 关键字。\n**C.**\
  \ 在语句使用了 `T` 类型。\n\n**2. 在代码 `template <class T>` 中，`T` 是什么？**\n**A.** 参数化类型\n**B.**\
  \ 成员变量\n**C.** 类标识符\n\n**3. 在 ParamList 程序（列表 23.1）中，编译器如何知道何时析毁链表中包含的对象？**\n**A.**\
  \ 它是自动发生的。\n**B.** 链表超出了作用域。\n**C.** 链表必须删除它们。\n\n#### 答案\n\n**1. B.** 编译器知道是因为使用了前缀\
  \ `template <class T>`。\n**2. A.** `T` 将出现在普通类中出现数据类型的地方。\n**3. C.** 当 `main` 函数退出时，链表超出作用域，该类的析构函数被调用。由于单个（包含）对象是动态分配的，因此必须由链表删除它们。\n\
