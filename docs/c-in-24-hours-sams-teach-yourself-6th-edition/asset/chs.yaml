  \ 800 East 96th St.\nSalary: 50000\n```\n\n列表 20.4 显示了 `Employee` 类，它包含了三个 `String`\
  \ 对象：`firstName`、`lastName` 和 `address`。在第 70 行，创建了一个 `Employee` 对象并传递了四个值来初始化它。在第\
  \ 71 行，调用了 `Employee` 函数 `setSalary()` 并传入字面量 `50000`。在第 72 行，创建了一个字符串并使用 C++ 字符串常量进行初始化。随后，该字符串对象在第\
  \ 73 行被用作 `setLastName()` 的参数。在第 74 行，调用了 `Employee` 函数 `setFirstName()` 并传入了另一个字符串常量。`Employee`\
  \ 并没有一个接受字符串作为参数的 `setFirstName()` 函数；`setFirstName()` 需要一个常量字符串引用。编译器解决了这个问题，因为它知道如何从常量字符串创建一个\
  \ `String` 对象。它之所以知道这一点，是因为你在列表 20.3 的第 9 行告诉了它该如何做。\n\n### 访问包含的类的成员\n`Employee`\
  \ 对象对 `String` 类的成员变量没有特殊的访问权限。如果 `Employee` 对象 `snett` 尝试访问其所属类的成员变量 `firstName`，将会导致编译错误。然而，这种访问的缺失并没有带来太大负担。访问器函数为\
  \ `String` 类提供了一个接口。`Employee` 类不需要担心实现细节，就像它不需要担心整数变量 `salary` 如何存储其信息一样。\n\n###\
  \ 过滤对包含成员的访问\n请注意 `String` 类提供了 `operator+`。`Employee` 类的设计者通过声明所有 `String` 访问器（如\
  \ `getFirstName()`）都返回常量引用，阻止了在 `Employee` 对象上调用 `operator+`。`operator+` 不能是一个 `const`\
  \ 函数，因为它会改变被调用的对象，因此尝试编写以下代码会导致编译错误：\n\n```cpp\nString buffer = snett.getFirstName()\
  \ + snett.getLastName();\n```\n\n`getFirstName()` 函数返回一个常量 `String`；你不能在常量对象上调用\
  \ `operator+`。为了修复这个问题，请重载 `getFirstName()` 为非 `const` 版本：\n\n```cpp\nconst String&\
  \ getFirstName() const { return firstName; }\nString& getFirstName() { return firstName;\
  \ }\n```\n\n注意，返回值不再是 `const` 了，且成员函数本身也不再是 `const` 了。仅仅更改返回值不足以重载函数名；你必须更改函数本身的常量属性。由于同时提供了\
  \ `const` 版本和非 `const` 版本，编译器会在尽可能的情况下调用 `const` 版本（例如，当客户端调用 `getFirstName` 时），并在需要时调用非\
  \ `const` 版本（例如在调用 `operator+` 时）。\n\n### 按值拷贝与引用传递\n当按值传递 `Employee` 对象时，它们包含的字符串也会被复制，因此调用了构造函数。这是非常昂贵的；会占用内存和时间。\n\
  \n当通过指针或引用传递 `Employee` 对象时，这些都节省了。这就是为什么 C++ 程序员努力避免按值传递大于几个字节的内容。\n\n### 友元类与函数\n\
  有时我们会一起创建类。这些成对的类可能需要访问对方的私有成员，但你可能不想将这些信息公开。\n\n如果你想将私有成员数据或函数暴露给另一个类，必须将该类声明为友元（friend）。这扩展了你的类的接口以包含了友元类。\n\
  \n这种友谊关系不可传递，也不会被继承。它也不是对称的。将 `Class1` 声明为 `Class2` 的朋友并不会让 `Class2`  `Class1` 的朋友。（在我看来，`Class2`\
  \ 这样做有点像鲁。）\n\n友元类的声明应该极其谨慎使用。如果两个类密不可分，且其中一个必须频繁访问另一个类的数据，那么可能有理由使用这种声明。通常使用公共访问器也同样简单。这样做允许你修改一个类而无需重新编译另一个类。\n\
  \n有时，你可能希望授予友元权限的不是整个类，而是该类中的一个或两个函数。你可以通过将另一个类的成员函数声明为友元来实现，而不是将整个类声明为友元。事实上，你可以将任何函数（无论它是否是另一个类的成员函数）声明为友元函数。\n\
  \n#### 函数指针\n正如数组名是指向数组第一个元素的常量指针一样，函数名也是指向该函数的常量指针。你可以声明一个指向函数的指针变量，并使用该指针来调用函数。这被证明非常有用；它允许你创建根据用户输入来决定调用哪些函数的程序。\n\
  \n\n\n\n函数指针唯一棘手的部分在于理解所指向对象的类型。指向 `int` 的指针指向一个整数变量，而指向函数的指针必须指向一个具有适当返回类型和签名的函数。\n\
  \n考虑此声明：\n\n```cpp\nlong (*funcPtr)(int);\n```\n\n变量 `funcPtr` 被声明为一个指针，它指向一个接受一个整数参数并返回\
  \ `long` 的函数。`*funcPtr` 周围的括号是必要的，因为 `int` 周围的括号优先级高于间接引用符（`*`）。如果没有第一个括号，这将声明一个接收一个整数并返回\
  \ `long` 指针的函数。\n\n检查这两个声明：\n\n```cpp\nlong* func(int);\nlong (*funcPtr)(int);\n\
  ```\n\n第一个 `func()` 是一个*函数*，它接收一个整数并返回一个指向 `long` 类型变量的指针。第二个 `funcPtr` 是指向函数的*指针*，该函数接收一个整数并返回一个\
  \ `long` 类型变量。\n\n函数指针的声明始终包含返回类型以及用于指示参数类型（如果有）的括号。列表 20.5 中的 `FunctionPointer`\
  \ 程序说明了函数指针的声明和使用。\n\n### 列表 20.5 `FunctionPointer.cpp` 的完整文本\n\n```cpp\n#include\
  \ <iostream>\n\nvoid square(int&, int&);\nvoid cube(int&, int&);\nvoid swap(int&,\
  \ int&);\nvoid printVals(int, int);\n\nint main() {\n    void (*pFunc)(int&, int&);\n\
  \    bool fQuit = false;\n    int valOne = 1, valTwo = 2;\n    int choice;\n   \
  \ while (fQuit == false) {\n        std::cout << \"(1) Change Values \"\n      \
  \            << \"(2) Square (3) Cube (4) Swap: \";\n        std::cin >> choice;\n\
  \        switch (choice) {\n            case 1:\n                pFunc = getVals;\n\
  \                break;\n            case 2:\n                pFunc = square;\n\
  \                break;\n            case 3:\n                pFunc = cube;\n  \
  \              break;\n            case 4:\n                pFunc = swap;\n    \
  \            break;\n            default:\n                fQuit = true;\n     \
  \           break;\n        }\n        if (fQuit)\n            break;\n        printVals(valOne,\
  \ valTwo);\n        pFunc(valOne, valTwo);\n        printVals(valOne, valTwo);\n\
  \    }\n    return 0;\n}\n\nvoid printVals(int x, int y) {\n    std::cout << \"\
  x: \" << x << \" y: \" << y << \"\\n\";\n}\n\nvoid square(int& rX, int& rY) {\n\
  \    rX *= rX;\n    rY *= rY;\n}\n\nvoid cube(int& rX, int& rY) {\n    int tmp;\n\
  \    tmp = rX;\n    rX *= rX;\n    rX = rX * tmp;\n\n    tmp = rY;\n    rY *= rY;\n\
  \    rY = rY * tmp;\n}\n\nvoid swap(int& rX, int& rY) {\n    int temp;\n    temp\
  \ = rX;\n    rX = rY;\n    rY = temp;\n}\n\nvoid getVals(int& rOne, int& rTwo) {\n\
  \    std::cout << \"New value for valOne: \";\n    std::cin >> rOne;\n    std::cout\
  \ << \"New value for valTwo: \";\n    std::cin >> rTwo;\n}\n```\n\n### 函数指针数组\n\n\
  ```cpp\n#include <iostream>\n\nvoid square(int&, int&);\nvoid cube(int&, int&);\n\
  void swap(int&, int&);\nvoid printVals(int, int);\n\nint main() {\n    int valOne\
  \ = 1, valTwo = 2;\n    int choice, i;\n    const int maxArray = 5;\n    void (*pFuncArray[maxArray])(int&,\
  \ int&);\n\n    for (i = 0; i < maxArray; i++) {\n        std::cout << \"(1) Change\
  \ Values \"\n                  << \"(2) Square (3) Cube (4) Swap: \";\n        std::cin\
  \ >> choice;\n        switch (choice) {\n            case 1:\n                pFuncArray[i]\
  \ = getVals;\n                break;\n            case 2:\n                pFuncArray[i]\
  \ = square;\n                break;\n            case 3:\n                pFuncArray[i]\
  \ = cube;\n                break;\n            case 4:\n                pFuncArray[i]\
  \ = swap;\n                break;\n            default:\n                pFuncArray[i]\
  \ = nullptr; // 终止逻辑\n                break;\n        }\n        if (pFuncArray[i]\
  \ != nullptr) {\n            pFuncArrayi;\n            printVals(valOne, valTwo);\n\
  \        } else {\n            break;\n        }\n    }\n    return 0;\n}\n```\n\
  （注：源代码提供的代码包含一些逻辑痕迹；我已为标准 Markdown 格式清理了结构，同时保持了预期的逻辑。）\n\n以下是 `FunctionPointer`\
  \ 的输出：\n\n```\n(1) Change Values (2) Square (3) Cube (4) Swap: 1\nNew value for\
  \ valOne: 12\nNew value for valTwo: 9\nx: 12 y: 9\n(1) Change Values (2) Square\
  \ (3) Cube (4) Swap: 4\nx: 12 y: 9\n(1) Change Values (2) Square (3) Cube (4) Swap:\
  \ 0\n```\n\n在第 3-6 行，声明了四个函数，它们具有相同的返回类型和签名，返回 `void` 并接受两个整数引用。在第 1 行，`pFunc` 被声明为指向函数的指针，该函数返回\
  \ `void` 并接受两个引用参数。用户反复提供调用函数的选择，并据此分配 `pFunc`。在第 4-5 行，显示两个整数当前的值，调用当前分配的函数，然后再次显示值。函数指针不需要被解引用，尽管你也可以这样做。因此，如果\
  \ `pFunc` 是一个接受整数并返回 `long` 类型变量的指针，并且将其赋值了一个匹配的函数，可以使用以下形式之一调用该函数：\n\n`pFunc(x);`\n\
  \n`(*pFunc)(x);`\n\n这两种形式是相同的。前者只是后者的简写形式。\n\n#### 函数指针数组\n\n正如你可以声明整数指针数组一样，你也可以声明返回特定类型且具有特定签名的函数指针数组。列表\
  \ 20.6 中的 `Array` 程序演示了这一点。\n\n\n\n\n\n正如书开头提到的，这些项目并没有防止无效的用户输入。如果在 `ArrayFunction`\
  \ 程序中选择了 1, 2, 3 或 4 以外的值，它将会尝试在第 42 行调用一个未定义的函数，并报错失败。\n\n***\n\n## 将函数指针传递给其他函数\n\
  \n函数指针（确切地说，是函数指针数组）可以传递给其他函数，这些函数可能会执行某些操作，然后使用指针调用正确的函数。\n\n例如，你可以通过将选定的函数指针传递给另一个函数（`main()`\
  \ 之外）来改进 `ArrayFunction` 程序，该函数将显示值、调用函数，然后再次显示它们。`FunctionPasser` 程序（列表 20.7）展示了如何实现。\n\
