  \ i++)\n24:      gestalt[i] = new Robot(i);\n25:\n26:      for (i = 0; i < maxRobots;\
  \ i++)\n27:      {\n28:      std::cout << \"There are \";\n29:      std::cout <<\
  \ Robot::howManyRobots;\n30:      std::cout << \" robots left!\\n\";\n31:      std::cout\
  \ << \"Deleting the one which is \";\n32:      std::cout << gestalt[i]->getAge();\n\
  33:      std::cout << \" years old\\n\";\n34:      delete gestalt[i];\n35:     \
  \ gestalt[i] = 0;\n36:      }\n37:      return 0;\n38: }\n```\n\n运行程序以查看它创建了五个机器人然后删除对象：\n\
  ```\n5 robots left!\nDeleting the one which is 0 years\n4 robots left!\nDeleting\
  \ the one which is 1 years\n3 robots left!\nDeleting the one which is 2 years\n\
  2 robots left!\nDeleting the one which is 3 years\n1 robots left!\nDeleting the\
  \ one which is 4 years\n```\n\n在第 3–14 行，声明了简化的 `Robot` 类。在第 10 行，`howManyRobots`\
  \ 被声明为 `int` 类型的静态成员。`howManyRobots` 的声明并没有定义整数；没有分配存储空间。与非静态成员变量不同，实例化 `Robot`\
  \ 对象时并不会为静态成员分配存储空间，因为 `howManyRobots` 成员变量并不在对象中。因此，在第 16 行对该变量进行了定义和初始化。\n\n忘记定义类的静态变量是一个常见错误。你不需要对第\
  \ 13 行的 `age` 这样做，因为它是非静态成员变量，每当你创建一个 `Robot` 对象时（如第 24 行），就会定义它。构造函数在第 6 行增加静态变量。析构函数在第\
  \ 7 行减少它。因此，在任何时刻，`howManyRobots` 都是已创建尚未销毁的对象的准确计数。\n\n从第 18 行开始的 `main` 函数实例化五个\
