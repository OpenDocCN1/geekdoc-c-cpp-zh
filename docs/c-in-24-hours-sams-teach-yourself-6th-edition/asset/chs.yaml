  \n![Image](img/00002.jpeg) 如何创建常量表达式\n\n![Image](img/00002.jpeg) 如何为自动类型变量赋值\n\n\
  ![Image](img/00002.jpeg) 如何使用新的基于范围的 `for` 循环\n\n### C++ 最新版本\n\n自 C++ 编程语言由 Bjarne\
  \ Stroustrup 于 1979 年创建以来，它经历了几次重大修订。\n\n1983 年，它的名字从 C for Classes 改为 C++，并增加了虚函数、运算符重载和引用等许多功能。两年后，Stroustrup\
  \ 的著作 *The C++ Programming Language* 第一版出版，它为一种当时尚未成为正式标准的语言提供了完整的参考。\n\n1989 年，C++\
  \ 2.0 版本问世，包含了多重继承、静态成员函数和抽象类等功能。\n\n九年后，C++ 标准委员会发布了该语言的标准版本，该版本非正式地描述为 C++98。\n\
  \n2011 年，C++11 发布，在此之前的的几年里，由于其推迟的发布时间表，它被称为 C++0x（`0x` 是年份最后两位数字的占位符）。\n\n该语言的最新、最强大的版本是\
  \ C++14。大多数目前的 C++ 工具都完全支持此版本，因此你可以开始利用该语言的最新改进。\n\n### 在函数返回类型中使用 `auto`\n\nC++\
  \ 是一门类型类型安全的语言，提供了一项重要保证，即所有数据在变量声明时将保持其原始形式。过去，根据类型使用每个变量的负担一直落在程序员身上。但随着语言每个新版本的发布，编译器都确保了更多的类型安全。\n\
  \n在 C++11 中，可以在变量声明中使用 `auto` 关键字来让编译器推断数据类型。这使得诸如下操作成为可能：\n\n```\nauto length =\
  \ 50;\nauto width = 30;\nauto height = 3;\nauto area = length * width * height;\n\
  \nstd::cout << \"Area: \" << area << std::endl;\n```\n\n所有变量都是整数，编译器这一点。`length`、`width`\
  \ 和 `height` 变量是整数，因为它们在声明时被赋值了整数字面量值。`area` 变量是一个整数，因为它是三个整数相乘的结果。\n\nC++ 通过允许将\
  \ `auto` 作为函数的返回类型，扩展了这种类型推断能力。\n\n正如编译器处理变量声明的方式一样，`auto` 关键字会导致函数的返回类型取决于上下文。该函数使用\
  \ `auto` 作为返回类型：\n\n```cpp\nauto getSalaryMultiple(int years)\n{\n    if (years\
  \ < 10)\n    {\n        return 1.1;\n    }\n    return 1.25;\n}\n```\n\n该函数接受员工的工作年限作为参数，少于\
  \ 10 年返回 1.1 倍的倍数，否则返回 1.25 倍。这将与员工当前的工资相乘以计算新工资。\n\n编译器确定该函数返回 `double` 类型的值，因为两个\
  \ `return` 语句返回的该类型的字面量。\n\n为了让 `auto` 用作函数的返回类型，每个 `return` 语句必须返回相同的类型。如果将代码更改为返回\
  \ 2 而不是 1.25，编译将失败并出现此错误：`inconsistent deduction for 'auto': 'double' and 'int'`\n\
  \n### 列表 21.1 AutoArea.cpp 的全文\n\n```cpp\n#include <iostream>\n\nauto findArea(auto\
  \ length, auto width, auto height)\n{\n    return length * width * height;\n}\n\n\
  int main()\n{\n    auto length = 50.0;\n    auto width = 30.0;\n    auto height\
  \ = 3.5;\n\n    auto area = findArea(length, width, height);\n\n    std::cout <<\
  \ \"Area: \" << area << std::endl;\n\n    return 0;\n}\n```\n\n此程序定义了一个 `findArea()`\
  \ 函数，并将返回类型指定为 `auto`。还将 auto 作为三个参数的类型。编译器计算出了第 9-11 行的实际类型，并用浮点数初始化它们。这些字面量的类型推断为\
  \ `double`。因此，当 `findArea()` 函数在第 4 行乘以三个 double 并返回该值时，该值也被确定为 `double`。\n\nAutoArea\
  \ 程序在从未使用 double 关键字定义变量的情况下处理双 值。使得程序能够以一种有趣且独特的方式进行修订。\n\n回到编辑器并更改第 9-11 行的值，使语句变为：\n\
  \n```\nauto length = 50;\nauto width = 30;\nauto height = 3;\n```\n\n所有三个字面量现在都是整数，使得编译器推断的数据类型为\
  \ `int` 而不是 `double`。程序将成功编译并运行：\n\nArea: 4500\n\n由于类型推断，整个程序改变了行为，转而采用整数和产生整数的乘法表达式。编译器为你完成了这项工作。\n\
  \n在调用自己的递归函数中，递归调用必须由另一个类型可以被编译器确定的 `return` 语句引导。\n\n在像 AutoArea 这样简单的演示程序中，这种灵活性的优势可能看起来不值一提。但在大型\
  \ C++ 程序中，更改某个事物的数据类型可能会影响到其他变量、参数和返回类型，需要对每一项进行以适应新类型的修改。\n\n你的程序越是使用自动推断，在进行重构时就越灵活。\n\
  \n### 注意事项\n\n`auto` 关键字可以用函数的正向声明，但有一个陷阱：函数必须在调用该函数的代码之前定义。否则，编译器将报错。\n\n\n\n\n\
  \nC++14 版本引入的两个微小变化可能认为不如其他改进重要，但仍然有用。整数字面量现在可以以二进制值表示，并包含数字位分隔符。\n\n要以二进制形式表示整数，请在数字前加上\
  \ `0b` 或 `0B` 字符，如下语句所示：\n\n```cpp\nint role = 0b11111111;\n```\n\n这使得 `role` 的十进制值为\
  \ 255（一个八位位全部设置为 1 的字节）。\n\n这里是另一个将 `role` 设置为十进制 15 的示例：\n\n```cpp\nint role =\
  \ 0b00001111;\n```\n\n二进制字面量也可以用于表达式，例如该语句：\n\n点击此处查看代码图像\n\n```cpp\nint role =\
  \ 0b00001111 – 0b00001101;\n```\n\n该表达式的结果为十进制 2（二进制字面量 `0b00000010`）。\n\n数字位分隔符是放置在大数字中的字符，用以提高可读性。最常见的用法之一是货币，其中数字\
  \ 10000000 比 $10,000,000 更难一目理解。\n\n在那个货币数字中，逗号（`,`）就是数字位分隔符。为了可读性，每三个数字出现一个。该分隔符不影响实际值。\n\
  \nC++ 中新的数字位分隔符是单引号字符（`‘`）。\n\n这里有一个使用了它的语句：\n\n点击此处查看代码图像\n\n```cpp\nlong long\
  \ ouch = 19'241'686'248'628;\n```\n\n变量 `ouch` 是本文撰写时美国国债的整美元金额（约 19.24 万亿美元且仍在增加）。分隔符（`‘`）会被\
  \ C++ 编译器忽略。如果你显示此变量，输出将如下：\n\n```\n19241686248628;\n```\n\n在本文写作期间，一场激烈的总统竞选正在进行中。在你读到这里时，其中一个候选人可能已经当选总统。如果是这样，基于所有人在竞选活动中做出的铁承诺，上面的数字应该低得多。\n\
  \n要检查是否发生了这种情况，请停下这一小时，访问国家债务时钟网站 [www.brillig.com/debt_clock](http://www.brillig.com/debt_clock)，将我们的\
  \ 14 位数字与当前数字进行比较。我们将等你回来。\n\n[戏剧性的停顿]\n\n欢迎回来。是的，这在短时间内是一个惊人的巨大增长。\n\n### constexpr\
  \ 关键字\n\n常量表达式函数是指其值可以由编译器确定的函数，使得该常量值可以替换函数。\n\n该函数前面必须跟有关键字 `constexpr`，并满足以下三个标准：\n\
  \n![Image](img/00002.jpeg) 该函数必须返回一个值（而不是 `void`）\n\n![Image](img/00002.jpeg) 函数的整个体必须是一个返回表达式的单个\
  \ `return` 语句\n\n![Image](img/00002.jpeg) 该表达式在替换后必须求值为常量。\n\n常量表达式不能在定义之前调用。\n\n\
  这里是一个有效常量表达式的代码片段：\n\n点击此处查看代码图像\n\n```cpp\nconstexpr double expand(int original)\n\
  {\n    return original * 1.5;\n}\n```\n\n`constexpr` 的使用改进了 C++，因为它首次允许程序员发出该代码应被用作常量表达式的意图。\n\
  \n该关键字告诉编译器，当函数的所有参数都是常量时，该函数是一个常量。如果任何参数不是常量，则应该进行动态求值。\n\n`constexpr` 派上用场的最常见情况之一是数组声明。\n\
  \n当在 C++ 中初始化数组时，该数组的大小必须是一个常量。很多时候，通过调用函数来设置数组的大小非常方便。这里有一种可以尝试的方法：\n\n点击此处查看代码图像\n\
  \n```cpp\nconst int getArraySize(int hours)\n{\n    return 60 * 60 * hours;\n}\n\
  \nint ticks[getArraySize(24)];\n```\n\n因为 `[` 和 `]` 之间的数组大小必须是常量，旧版本的 C++ 编译器会报错“array\
  \ bound is not an integer constant before ‘]’ token。”\n\n通过将函数声明中的 `const` 关键字更改\
  \ `constexpr` 并按 C++14 标准编译程序，你可以解决这个问题。\n\nListing 21.2 中的 `ArrayMaxer` 程序演示了这种方法。该程序创建了一个整数数组，在每个数组元素中存储一个值。\n\
  \n**列表 21.2 `ArrayMaxer.cpp` 的全文**显示一个值。\n\n点击此处查看代码图像\n\n* *\n\n```cpp\n1: #include\
  \ <iostream>\n2:\n3: constexpr int getArraySize()\n4: {\n5:   return 1024;\n6: }\n\
  7:\n8: int main()\n9: {\n10:     int bolts[getArraySize()];\n11:     int boltsSize\
  \ = sizeof(bolts) / sizeof(bolts[0]);\n12:\n13:     for (int i = 0; i < boltsSize;\
  \ i++)\n14:         {\n15:             bolts[i] = i;\n16:         }\n17:\n18:  \
  \   std::cout << \"Value of bolts: \" << bolts[10] << std::endl;\n20:\n21:     return\
  \ 0;\n22: }\n```\n\n* *\n\n使用 `-std=c++14` 编译程序并运行，产生如下输出：\n\n```\nValue of bolts:\
  \ 1024\n```\n\n常量表达式定义在第 3-6 行。`constexpr` 位于返回类型、名称和参数之前。\n\n### Lambda\n\n近年来\
  \ C++ 请求最多的特性是 Lambda 表达式，它允许创建联匿名函数。语法最初可能有些困惑，但当你掌握了它的用法后，你会发现它们提供了让源代码更易理解的强大功能。\n\
  \nLambda 表达式类似于一个语句并且可以在单行代码中定义。该表达式存储在变量中，并像函数一样调用。\n\n这里有一个示例：\n\n点击此处查看代码图像\n\
  \n```cpp\nauto aarhus = [](){ std::cout << \"Solidum petit in profundis!\" << std::endl;\
  \ };\n\naarhus();\n```\n\n这段代码产生输出：\n\nSolidum petit in profundis!\n\n匿名函数执行 `{`\
  \ 和 `}` 之间的代码。注意在 `}` 括号后的行尾有一个分号。\n\n该函数存储在变量 `aarhus` 中，并使用与调用函数相同的语法。\n\nLambda\
  \ 表达式可以有一个或多个参数，这些参数在 `[` 和 `]` 方括号后的圆括号内指定。\n\n\n\n\n\n```cpp\nauto multiply =\
  \ [](int x, int y){ std::cout << \"Total: \" << x * y << std::endl; };\n\nmultiply(7,\
  \ 17);\n```\n\n输出如下：\n\nTotal: 117\n\n当 lambda 表达式没有参数时，可以省略表达式中的括号。第一个例子没有参数，所以这里是该表达式的另一个版本：\n\
  \n点击此处查看代码图像\n\n```cpp\nauto aarhus = []{ std::cout << \"Solidum petit in profundis!\"\
  \ << std::endl; };\n```\n\n该表达式可以通过在 `->` 运算符之后指定返回类型（或 `auto`）来返回数值。\n\n这里是对上一个示例的重写，它返回\
  \ `x` 和 `y` 的乘积和。\n\n点击此处查看代码图像\n\n```cpp\nauto multiply = [](int x, int y) -> int\
  \ { return x * y; };\n\nint sum = multiply(7, 17);\n\nstd::cout << \"Total: \" <<\
  \ sum << std::endl;\n```\n\nlambda 表达式通常无法访问定义在表达式所在作用域中的变量。\n\n你可以通过表达式的最后部分工作来改变这一点：即\
  \ `[]` 方括号，它们被称为捕获块（capture block）。\n\n为了让闭包作用域中的一个或多个变量在 lambda 表达式可用，将它们列在 `[`\
  \ 和 `]` 括号内，并用逗号隔开。\n\n这段代码使用了捕获块：\n\n点击此处查看代码图像\n\n```cpp\nint x = 7;\n\nauto multiply\
  \ = x -> int { return x * y; };\n\nint sum = multiply(17);\n\nstd::cout << \"Total:\
  \ \" << sum << std::endl;\n```\n\n输出保持不变。\n\n### 总结\n\n许多程序员已开始使用“现代 C++”来指代 C++14\
  \ 及其前身 C++11。随着新版本的发布速度比过去快得多，C++ 创始人比雅恩·斯特劳斯特普（Bjarne Stroustrup）对语言的现状表示了极大的兴奋。他在自己的网站上写道：“这些部分比以前结合得更紧密，我发现更高层次的编程风格比以前更自然，而且像既往一样高效。”\n\
  \n欲了解他的更多想法，请访问他的网站 [www.stroustrup.com](http://www.stroustrup.com)。\n\n### 问答\n\
  \n**Q. 使用 `auto` 关键字有任何风险吗？**\n\n**A.** 最大的风险之一是你误解了语句所赋值的数据类型。C++ 中的一个常见错误是假设字面量\
  \ `3.5` 是一个 `float` 字面量。它实际上是一个 `double`。所以，如果你使用像这样的值创建了一个 `auto` 类型的变量，而你没有意识到它是\
  \ `double`，那么你可能会对如何在程序中使用该变量做出错误的假设。\n\n**Q. 由于 C++11 和 C++14 仅相三年发布，C++ 的下一个版本预计什么时候发布？**\n\
  \n**A.** 目前的计划是在 2017 年发布 C++17 下一个版本，保持三年间隔的频率，这比语言过去改进的速度要快得多。\n\n在写作期间，该版本尚未宣布为“功能完成”，因此尚不清楚这一时间表能否实现。\n\
  \n开发期间采用了临时名称 `C++1z`，作为指示，表明如果出现意外延迟或实现障碍，它可能会推迟到 2018 年或 2019 年。\n\n欲了解该版本的当前状态，请访问\
  \ C++ 标准化网站 [`isocpp.org/std/status`](https://isocpp.org/std/status)。\n\n**Q. 谁发明了字谜游戏？**\n\
  \n**A.** 字谜游戏是由亚瑟·怀恩（Arthur Wynne）于 1913 年为《纽约世界报》发明的。第一个字谜游戏于 1913 年 12 月 21 日出版，被描述为“单词交叉”（Word-Cross）。\n\
  \n怀恩每周为报纸创作新的谜题。他的谜题规则与现在的字谜游戏相同，但形状很不常。单词在菱形的网格上交叉排列，中间有黑色方块。\n\n怀恩很快确定了矩形形状并命名为“Cross-Word”。十一年后的\
  \ 1924 年，初出书商迪克·西蒙和林肯·舒斯特通过出版《纽约世界报》谜题集向国际读者介绍了字谜游戏，该书成为了畅销书。\n\n第一个字谜游戏可以在 [www.fun-with-words.com/worlds_first_crossword.html](http://www.fun-with-words.com/worlds_first_crossword.html)\
  \ 查看。如果你能猜“书面承认”、以 R 开头的七字母单词，我将不感激。\n\n### 工作坊\n\n现在你已经花了一个小时研究 C++ 的未来，请回答几个问题并进行练习，看看你带回了多少知识。\n\
  \n#### 测验\n\n**1.** 下列哪个不是使用 `auto` 关键字的合适位置？\n\n**A.** 使用字面量初始化变量\n\n**B.** 从函数返回值\n\
  \n**C.** A 和 B 都是\n\n**2.** `nullptr` 可以转换为哪些类型？\n\n**A.** int\n\n**B.** bool\n\n\
  **C.** 无\n\n**3.** `constexpr` 可以定义什么？\n\n**A.** 函数\n\n**B.** 变量\n\n**C.** 函数和变量\n\
  \n#### 答案\n\n**1.** C. `auto` 可以用作函数参数。\n\n**2.** B. `nullptr` 在转换后值为 `false`。\n\
  \n**3.** C. 任何变量或函数被隐式地视为 `const`。\n\n#### 活动\n\n1. 编写一个程序，获取美国债务，每天增加 25 亿美元，使用\
  \ lambda 表达式显示结果。\n\n2. 编写一个 `square()` 函数，将一个数字乘以自身，并使用 `auto` 类型变量作为参数。使用 `int`、`long`、`float`\
  \ 和 `double` 调用函数。将结果存储在 `auto` 类型变量中并显示。\n\n欲查看这些活动的解决方案，请访问本书的网站。\n\n## 22 节。采用面向对象的分析与设计\n\
  \n* * *\n\n在本节你将学习：\n\n- 从面向对象的角度分析问题\n- 从面向对象的角度设计程序\n- 如何应用 C++ 语法实现设计目标\n- 如何进行可用性和扩展性设计\n\
  \n* * *\n\n### 开发周期\n\n许多书籍和文章讨论了开发周期。有些提出了一种*瀑布模型](#part0041.html_gloss_117)* 技术，其中设计人员确定程序应该做什么。架构师确定如何构建程序、使用哪些类等。程序员实现设计和架构。当设计和架构交付给程序员时，它们已经完成，程序员只需要实现所需的功能即可。\n\
  \n\n\n\n这一小时的重点是大型、复杂程序的设计，这些程序将在许多年内不断扩展和增强。许多程序员喜欢在技术的最前沿工作；他们倾向于编写复杂性推向其工具和理解极限的程序。在许多方面，C++\
  \ 的设计初衷是为了扩展程序员所能管理的复杂性。\n\n## 模拟报警系统\n\n`simulation`（模拟）是真实世界系统的计算机模型。构建模拟有很多原因，但一个良好的设计必须开始于理解你希望模拟回答什么问题。\n\
  \n作为一个起点，请观察这个问题：你被要求模拟一栋房屋的报警系统。这栋房子有四间卧室、一个装修过的地下室以及一个位于房屋下方的车库。\n\n楼下有以下窗户：厨房三个，餐厅四个，半卫卫生间一个，客厅和家庭室各两个，前门旁边有两个小窗户。所有四间卧室都在楼上；每间卧室有两个窗户，主卧室除外（它有四个）。有两个间浴室，每个各有一个窗户。最后，地下室有四扇高窗，车库有一个窗户。\n\
  \n进入房屋的正常方式是通过前门。此外，厨房有一扇推拉玻璃门，车库有两个供汽车使用的门和一个方便进入地下室的门。后院还有一扇地窖门。\n\n所有的窗户和门都安装了报警器，每个电话上都有恐慌按钮，主卧室床边还有一个。地面也有报警器，尽管这些报警器经过仔细校准，不会被小动物或鸟类触发。\n\
  \n地下室的中央报警系统在报警被触发时会发出警告啾声。如果报警在规定时间内未关闭，将拨打警察。如果按下恐慌按钮，将立即报警。\n\n报警系统还连接到火灾和烟雾探测器以及喷淋系统。报警系统本身具有容错性，拥有自己的内部备电源，并封装在防火箱中。\n\
  \n### 概念化\n\n在`conceptualization`（概念化）阶段，你试图理解客户希望从程序中获得什么：这个程序是干什么用的？这个模拟可能会回答哪些问题？例如，你可能可以使用模拟来回答这些问题：传感器在有人察觉之前可能会损坏多久？是否有办法在不通知警察的情况下破解窗户报警器？\n\
  \n\n\n概念化阶段是思考程序内部和外部内容的良好时机。模拟中代表了警察吗？实际房屋报警器的控制权在系统内部吗？\n\n### 分析与需求\n\n概念化阶段让分析阶段。在分析期间，你作为面向对象编程分析师的职责是帮助客户理解她对程序的需求。程序具体将表现出什么样的行为？客户可以期待什么种交互？\n\
  \n这些需求通常被记录在一系列文档中，可能包括用例。`use case`（用例）是对系统将如何被使用的描述。它描述了交互和使用模式，帮助程序员捕捉系统的设计目标。\n\
  \n**注意**\n\n统一建模语言（`UML`）是表示需求和分析的一种方法。使用 `UML` 表示你的信息的优势有两点：它是图形化的，并且遵循标准形式，因此许多人都能理解它。虽然教授\
  \ `UML` 超出了本书的范范围（仅这一个主题就有很多好书），但你应该知道它包含了表示用例的方法。它特别适用于面向对象的开发，因为它直接支持抽象类和其他类型的类。\n\
  \n学习 `UML` 的好书是 Joseph Schmuller 写的 *Sams Teach Yourself UML in 24 Hours, Third\
  \ Edition*（ISBN: 0-672-32640-X）。\n\n### 高级设计与低级设计\n\n在完全理解产品并将需求记录在适当的文档中后，是时候转向高级设计了。在设计的这一阶段，程序员不需要担心平台、操作系统或编程语言问题。相反，他集中于系统将如何工作：主要组件有哪些？它们之间是如何相互作用的？\n\
  \n处理这个问题的一种方法是撇开与用户界面相关的问题，只关注`problem space`（问题空间）的组件。\n\n`problem space` 是你的程序试图解决的问题和问题的集合。`solution\
  \ space`（解决方案空间）是解决这些问题的可能方案。\n\n随着你高级设计的演进，你将开始思考你所识别的对象的职责——它们做什么以及持有什么信息。你还想思考它们的协作——它们与哪些对象进行交互。\n\
  \n例如，显然你有各种类型的传感器、一个中央报警系统、按钮、电线和电话。进一步的思考说服你还必须模拟房间、可能的楼层，以及可能像所有者和警察这样的群体。\n\n\
  传感器可以分为运动探测器、触发线、声音探测器、烟雾探测器等。这些都是传感器的类型，尽管并没有所谓的传感器本身（`per se`）。这很好地表明传感器是一个抽象数据类型（ADT）。\n\
  \n作为一个 ADT，`Sensor` 类将为所有类型的传感器提供完整的接口，而每个派生类型将提供实现。\n\n要创建一个良好的 ADT，你需要对传感器的功能有完全理解，而不是它们是如何工作的。例如，传感器是被动设备还是活动设备？它们是在等待某些元素加热、电线断裂或某块胶水融化，还是它们在探测环境？也许某些传感器只有二进制状态（已触发或未触发），但其他传感器具有更类模拟的状态（当前温度是多少？）？抽象数据类型的接口应该足够完整，以处理所有预期的派生类的需求。\n\
  \n### 其他对象\n\n设计以此继续，推导出满足规格说明所需的其他类。例如，如果需要保存日志，可能需要一个定时器；应该是定时器轮询每个传感器，还是每个传感器定期提交自己的报告？\n\
  \n用户将需要能够设置、取消报警和编写系统，因此需要某种终端。你可能想在模拟中为报警程序本身设置一个单独的对象。\n\n类 类设计\n\n当你解决这些问题时，你将开始设计你的类。例如，你已经预见到\
  \ `HeatSensor` 将派自 `Sensor`。如果传感器要定期报告，它可能还会通过多继承派自 `Timer`，或者它可能将定时器作为成员变量。\n\n\
  `HeatSensor` 可能会有成员函数，例如 `currentTemp()` 和 `setTempLimit()`，并可能会从它的基类 `Sensor` 继承\
  \ `soundAlarm()` 等函数。\n\n\n\n\n面向对象设计中一个常见的问题是封装。你可以想象这样一种设计：报警系统有一个 `maxTemp` 设置。报警系统询问热传感器当前温度是多少，将其与最高温度进行比较，如果温度过高，则响响警报。有人可能会认为，这违背了封装原则。也许，如果报警系统不知道或不在乎温度分析的细节会更好——可以说，这些细节应该在\
  \ `HeatSensor`（热传感器）中处理。\n\n无论你是否认同这一观点，这都是你可以在设计分析期间想要关注的决策类型。为了继续这一分析，有人认为，只有传感器和\
  \ `Log` 对象应该知道传感器活动如何记录的细节；`Alarm` 对象不应该知道或不在乎。\n\n良好的封装的标志是：每个类都有一组连贯且完整的职责，并且没有其他类具有相同的职责。如果\
  \ `Sensor` 负责记录当前温度，那么其他任何类都不应拥有该项职责。\n\n另一方面，其他类可能有助于帮助实现必要的功能。例如，尽管记录和记录当前温度可能是\
  \ `Sensor` 类的职责，但它可以通过将实际记录数据的任务委托给 `Log` 对象来实现该职责。\n\n保持明确的职责划分使你的程序更容易扩展和维护。当你决定为了增强模块而更换报警系统时，它与日志和传感器的接口将是狭窄且定义良好的。对报警系统的更改不应影响\
  \ `Sensor` 类，反之亦然。\n\n`HeatSensor` 是否应该有一个 `reportAlarm()` 函数？所有的传感器都需要具备报告警报的能力。这是一个很好的信号，表明\
  \ `reportAlarm()` 应该是 `Sensor` 的一个虚成员函数，并且 `Sensor` 可能是一个抽象基类。`HeatSensor` 可能会调用\
  \ `Sensor` 更通用的 `reportAlarm()` 成员函数；被覆盖的函数将只需填充它唯一胜任提供的细节。\n\n***\n\n#### 注意事项\n\
  关于面向对象概念的更多信息，请参阅 Matt Weisfeld 编写的 Addison-Wesley 出版 *The Object-Oriented Thought\
  \ Process, Fourth Edition*（ISBN: 0-321-86127-2）。\n\n***\n\n### 添加更多类\n当你的传感器报告报警状态时，它们想要向报警警察的对象和日志提供大量信息。你很可能想要创建一个\
  \ `Condition` 类，其构造函数接收若干测量值。根据测量值的复杂性，这些值也可能是对象，或者可能是简单的标量值（如整数）。\n\n`Condition`\
  \ 对象可能会被传递给中央报警对象，或者 `Condition` 对象可能会被子类为 `Alarm` 对象，这些对象本身知道如何采取应急行动。也许没有中央对象；相反，可能会有知道如何创建\
  \ `Condition` 传感器。某些 `Condition` 对象将知道如何记录自己；另一些可能知道如何联系警察。\n\n一个设计良好的事件驱动系统不需要中央协调器。可以想象所有传感器都独立地相互接收和发送消息对象、设置参数、读取读数并监控房屋。当检测到故障时，会创建一个\
  \ `Alarm` 对象来记录问题（例如通过向 `Log` 对象发送消息），并采取适当的行动。\n\n### 事件循环\n为了模拟这样一个事件驱动系统，你的程序需要创建一个事件循环。事件循环通常是一个无限循环，如\
  \ `while(true)`，它从操作系统获取消息（鼠标点击、键盘按键等）并逐个分发它们，返回循环，直到满足退出条件。在代码列表 22.1 中的 `SimpleEvent`\
  \ 程序实现了一个原始的事件循环。\n\n**列表 22.1** `SimpleEvent.cpp` **全文**\n\n点击此处查看代码图像\n\n***\n\
  \n```cpp\n1: #include <iostream>\n2:\n3: class Condition\n4: {\n5: public:\n6: \
  \     Condition() { }\n7:      virtual ~Condition() {}\n8:      virtual void log()\
  \ = 0;\n9: };\n10:\n11: class Normal : public Condition\n12: {\n13: public:\n14:\
  \      Normal() { log(); }\n15:      virtual ~Normal() {}\n16:      virtual void\
  \ log()\n17:             { std::cout << \"Logging normal conditions ...\\n\"; }\n\
  18: };\n19:\n20: class Error : public Condition\n21: {\n22: public:\n23:      Error()\
  \ { log(); }\n24:      virtual ~Error() {}\n25:      virtual void log() { std::cout\
  \ << \"Logging error!\\n\"; }\n26: };\n27:\n28: class Alarm : public Condition\n\
  29: {\n30: public:\n31:      Alarm();\n32:      virtual ~Alarm() {}\n33:      virtual\
  \ void warn() { std::cout << \"Warning!\\n\"; }\n34:      virtual void log() { std::cout\
  \ << \"General log\\n\"; }\n35:      virtual void call() = 0;\n36: };\n37:\n38:\
  \ Alarm::Alarm()\n39: {\n40:      log();\n41:      warn();\n42: }\n43:\n44: class\
  \ FireAlarm : Alarm\n45: {\n46: public:\n47:      FireAlarm() { log();};\n48:  \
  \    virtual ~FireAlarm() {}\n49:      virtual void call() { std::cout << \"Calling\
  \ department!\\n\"; }\n50:      virtual void log() { std::cout << \"Logging call\\\
  n\"; }\n51: };\n52:\n53: int main()\n54: {\n55:      int input;\n56:      int okay\
  \ = 1;\n57:      Condition *pCondition;\n58:      while (okay)\n59:      {\n60:\
  \          std::cout << \"(0) Quit (1) Normal (2) Fire: \";\n61:          std::cin\
  \ >> input;\n62:          okay = input;\n63:          switch (input)\n64:      \
  \    {\n65:              case 0:\n66:                  break;\n67:             \
  \ case 1:\n68:                  pCondition = new Normal;\n69:                  delete\
  \ pCondition;\n70:                  break;\n71:              case 2:\n72:      \
  \        pCondition = new FireAlarm;\n73:              delete pCondition;\n74: \
  \             break;\n75:          default:\n76:              pCondition = new Error;\n\
  77:              delete pCondition;\n78:              okay = 0;\n79:           \
  \   break;\n80:          }\n81:      }\n82:      return 0;\n83: }\n```\n\n***\n\n\
  `SimpleEvent` 程序接收三个选项之一作为输入。这里是程序的运行示例：\n\n点击此处查看代码图像\n\n(0) Quit (1) Normal (2)\
  \ Fire: 1\nLogging normal conditions ...\n(0) Quit (1) Normal (2) Fire: 2\nGeneral\
  \ alarm log\nWarning!\nLogging call\n(0) Quit (1) Normal (2) Fire: 0\n\n第 58–81\
  \ 行的简单循环允许用户输入以模拟传感器的正常报告和火警报告。注意，这种报告的影响是产生 `Condition` 对象，其构造函数调用了各种成员函数。\n\n\
  如果不注意对象的构造顺序，从构造函数调用虚成员函数可能会导致困惑的结果。例如，在第 72 行创建 `FireAlarm` 对象时，构造顺序是 `Condition`、`Alarm`、`FireAlarm`。\n\
  \n`Alarm` 构造函数调用 `Log`，但调用的是 `Alarm` 的 `Log()` 构造，而不是 `FireAlarm` 的，尽管 `Log()` 被声明为虚函数。\n\
  \n这是因为在 `Alarm` 构造函数运行时，还没有 `FireAlarm` 对象。随后，当 `FireAlarm` 本身被构造时，它的构造函数再次调用了 `Log()`，这次调用的是\
  \ `FireAlarm::Log()`。\n\n\n\n\n\n这里另一个可以练习你的面向对象分析技能的问题：你被 Defective Software 公司聘用来启动一个新的软件项目，并聘佣一个\
  \ C++ 程序员团队来实现你的程序。新产品开发副总裁 Sam Snett 是你的新老板。他希望你设计并构建 `PostMaster`，这是一个用于从各种提供商读取电子邮件的实用程序。潜在客户是使用多种电子邮件产品（商务人士（例如，Gmail、Yahoo\
  \ Mail 和 Microsoft Outlook）。\n\n客户将能够配置 `PostMaster` 连接到每个电子邮件提供商。`PostMaster` 将获取邮件并以统一的方式呈现，使用户能够组织邮件、回复、在不同服务之间转发邮件等。\n\
  \n人们已经预见到了开发作为 `PostMaster` 第二版本的 `PostMaster Professional`。它将增加一个行政助手模式，允许用户指定另一个人阅读部分或全部邮件，处理例行信函等。市场部门还推测，引入人工智能组件可能会为\
  \ `PostMaster` 增加根据主题和内容关键词以及关联对邮件进行预排序和优先级排序的能力。\n\n他们还讨论过其他增强功能，包括不仅处理邮件还能处理讨论组（例如互联网公告板和邮件列表）的能力。显然，Defective\
  \ 对 `PostMaster` 寄予了厚望，而且你面临着严格的时间限制，尽管你似乎拥有近乎无限的预算。\n\n## 两次测量，一次切割\n\n你布置了办公室并订购了设备；你的首要任务是为产品获取良好的规格。在研究市场后，你决定将开发集中在单一平台上，并着在\
  \ Linux、Mac OS 和 Windows 之间做出决定。\n\n你与副总裁 Snett 进行了多次痛苦的会议。事实显然，没有正确的选择，因此你决定将前端——即用户界面（或\
  \ UI）与后端——即通信和数据库部分分离开。为了让工作快速启动，你决定先为 Windows 编写代码，随后是 Mac OS，可能还有 Linux。\n\n这个简单的决定对你的项目产生了巨大的影响。你很快发现，你需要一个类库或一系列库来处理内存管理、各种用户界面，可能还有通信和数据库组件。\n\
  \nSnett 坚信，项目的成败取决于是否有一个拥有清晰愿景的人，因此他要求你在聘佣任何程序员之前先进行初步的架构分析和设计。你开始分析这个问题。\n\n##\
  \ 分而治之\n\n你很快发现自己有多个问题要解决。你将项目分为以下几个重要的子项目：\n\n![Image](img/00002.jpeg) **通信**：软件通过网络拨号到电子邮件提供商的能力。\n\
  \n![Image](img/00002.jpeg) **数据库**：存储数据和从磁盘检索数据的能力。\n\n![Image](img/00002.jpeg)\
  \ **邮件**：读取各种邮件格式向每个系统写入新消息的能力。\n\n![Image](img/00002.jpeg) **编辑**：用于创建和操作消息的先进编辑器。\n\
  \n![Image](img/00002.jpeg) **平台问题**：每个平台提出的各种用户界面问题。\n\n![Image](img/00002.jpeg)\
  \ **扩展性**：针对增长和增强的规划。\n\n![Image](img/00002.jpeg) **组织和调度**：管理程序员及其代码的相互依赖关系。每个小组必须制定并发布进度，然后能够进行相应的计划。高层和市场部门需要知道产品何时准备好。\n\
  \n你决定聘佣一名经理来处理这些项目之一：组织和调度。你聘佣了高级开发人员帮助你分析和设计，然后管理其余领域的实现。这些高级开发人员将创建以下团队：\n\n![Image](img/00002.jpeg)\
  \ **通信团队**：负责网络通信。他们处理的是包、流和位，而不是邮件消息本身。\n\n![Image](img/00002.jpeg) **消息格式**：负责将来自每个电子邮件提供商的消息转换为标准格式（`PostMaster\
  \ standard`）并反之转换。该团队的工作还是将这些消息写入文件，并在需要时从文件中读取它们。\n\n![Image](img/00002.jpeg) **消息编辑器**：该小组负责产品在每个平台上的整个\
  \ UI。编辑器的任务是确保产品后端和前端之间的界面足够窄，以便在将产品扩展到其他平台时不需要重复代码。\n\n## 消息格式\n\n你决定首先关注消息格式，暂搁与通信和用户界面相关的问题。当你更充分地理解你正在处理什么之后，这些问题将会其后。在理解它是什么类型的信息之前，担心如何向用户展示信息毫无意义。\n\
  \n对电子邮件格式的检查显示，尽管它们存在差异，但它们有许多共同点。每封电子邮件都有一个起点、一个终点和一个日期。几乎所有此类消息都有标题或主题行，以及正文可能由简单文本、富文本（带有格式的文本）、图形，甚至可能声音或其他花哨的附加物。大多数电子邮件服务还支持附件，使用户发送程序和其他文件。\n\
  \n你确认了早期的决定：你将以原始格式读取每封邮件，并将其转换为 `PostMaster` 格式。这样，你只需要存储一种记录格式，并简化磁盘的读写操作。你还决定将头部信息（发送者、接收者、日期、标题等）与消息正文分开。用户通常希望扫描头部信息，而不一定阅读所有消息的内容。目前，你打算\
  \ `PostMaster` 第一版本始终获取完整消息，尽管它可能不会向用户显示。\n\n## 初始类设计\n\n对消息的分析引导你设计了 `Message`\
  \ 类。为了能够将程序扩展到非邮件消息，从抽象基类 `Message` 派生 `EmailMessage`。从 `EmailMessage` 派生 `PostMasterMessage`、`InterchangeMessage`、`OutlookMessage`、`GmailMessage`\
  \ 等。\n\n对于处理邮件消息的程序来说，消息是对象的自然选择，但在复杂的系统中找到所有正确的对象是面向对象编程的最大挑战。在某些情况下（如消息），主要对象似乎是从你对问题的理解中自然而产生的。然而，在更多情况下，你必须仔细思考你试图实现什么，才能找到正确的对象。\n\
  \n不要绝望。大多数设计在第一次并不是完美的。一个好的起点是大声描述这个问题。列出你在描述项目时使用的所有名词和动词。名词是对象的良好候选者。动词可能是这些对象的函数（或者动词本身也是对象）。这并不是一种万无一失的技术，但在开始设计时，这是一个很有用的技巧。\n\
  \n现在问题随之浮产生：“消息头部应该是一个与正文分开的类吗？”如果是，你是否需要并行的层次结构——即 `ForumBody` 和 `ForumHeader`，以及\
  \ `EmailBody` 和 `EmailHeader`？\n\n\n\n\n\n并行层级结构通常是设计不良的警告。在面向对象设计中，在一个层级中拥有一组对象而在另一个层级中拥有一组对应的管理器对象是一种常见的错误。保持这些层级结构更新并相互同步的负担很快就会变得令人难以收拾：这是一场经典的维护噩梦。\n\
  \n当然，设计类层级结构并没有硬性规定，有时并行层级结构确实是解决特定问题最有效的方法。尽管如此，如果你发现你的设计正朝着这个方向发展，你就应该重新思考这个问题，因为可能存在更优雅的解决方案。\n\
  \n当消息从电子邮件提供商到达时，它们并不一定会被分成页头和正文；许多消息将是一个巨大的数据流，你的程序必须对其进行解构。也许你的层级结构应该直接反映这一想法。\n\
  \n对手头任务的进一步思考引导你列出这些消息的属性，以便在合适的抽象层级引入功能和数据存储。列出对象的属性是寻找数据成员，并梳理出你可能需要的其他对象的好方法。\n\
  \n邮件消息需要存储，用户的偏好、电话号码等也是如此。存储功能显然需要位于层级结构的高层。邮件消息是否必须与偏好共享同一个基类？\n\n### 有根层级结构与非根层级结构\n\
  \n继承层级结构有两种总体方法：你可以让你所有（或几乎所有）类继承自一个公共的根类，或者你可以拥有多个继承层级结构。公共根类的优点是它们通常可以避免多重继承；缺点是，许多实现细节会向上移动到基类中。\n\
  \n如果一组类共享一个共同祖先，那么这些类就是有根的。非根层级结构并非都共享一个公共基类。\n\n由于你知道你的产品将在许多平台上开发，而且由于多重继承很复杂，并不一定被所有平台的所有编译器良好支持，你的第一个决定是使用有根层级结构和单继承。你决定识别出未来可能使用多重继承的地方。然后你就可以进行设计，使得以后拆分层级并添加多重继承不会对你的整个设计造成破坏性影响。\n\
  \n你决定在所有内部类的名称前加上字母 `p`，这样你就能轻松快速地判断哪些类是你自己的，哪些来自其他库。\n\n你的根类将是 `pObject`。你创建的几乎每个类都将继承自这个对象。`pObject`\
  \ 本身将保持相当简单；只有每个项目绝对共享的数据才会出现在这个类中。\n\n如果你想要有根的层级结构，你应该给根类一个相当通用的名称（如 `pObject`）并赋予它很少的功能。根对象的意义在于能够创建所有后代类的集合，并将它们引用为\
  \ `pObject` 的实例。权衡是，有根层级结构通常会将接口推向根类。\n\n下一个可能处于层级结构顶端的候选者是 `pStored` 和 `pWired`。`pStored`\
  \ 对象在不同时间保存到文件（例如，当程序未使用时），而 `pWired` 对象通过网络发送。由于你几乎所有的对象都需要存储到文件中，因此将此功能推到层级结构的高层是有意义的。所有通过网络发送的对象都必须存储，但将此功能推到层级结构的高层是合理的。\n\
  \n### 设计接口\n\n在设计产品的这一阶段，避免关注实现是非常重要的。你希望将所有的精力集中在设计清晰的接口上，然后界定每个类需要什么数据。\n\n在尝试设计派生类之前，对基类有良好的理解通常是一个好主意，因此你决定首先关注\
  \ `pObject`、`pStored` 和 `pWired`。\n\n根类 `pObject` 将仅拥有所有对象共同的数据和函数。也许每个对象都应该有一个唯一的编号。你可以创建\
  \ `pID`（PostMaster ID）并将其作为 `pObject` 的一个成员；但你必须先问自己：“任何未存储也没有连接网络的对象是否需要这样的编号？”\n\
  \n```cpp\nclass pOjbect\n{\npublic:\n    pObject();\n    ~pObject();\n    pID GetID()\
  \ const;\n    void SetID();\n\nprivate:\n    pID itsID;\n}\n```\n\n\n\n\n第三，`const`\
  \ 成员函数已经确定了；这是接口的一部分，而不是实现部分。最后，隐含了一个新的数据类型：`pID`。将 `pID` 定义为一种类型而不是使用类似 `unsigned\
  \ long` 的类型，会让你的设计更加灵活。\n\n也许 `pID` 内部会使用 `unsigned long` 来表示 PostMaster ID。这仍然比在\
  \ `pObject` 类中将 ID 设为 `unsigned long` 整数要好的方法。如果最后发现你不需要 `unsigned long`，或者 `unsigned\
  \ long` 的空间不够大，你可以修改 `pID`。这种修改将影响所有使用 `pID` 的地方，你就不必去追踪并编辑每一个包含 `pID` 的文件。\n\n\
  目前，你使用 `typedef` 将 `pID` 声明为 `ULONG`，而你又将其声明为 `unsigned long`。这引出了一个问题：这些声明应该放在哪里？\n\
  \n在编写大型项目时，需要对文件进行整体设计。一种标准的方法（也是你在本项目中正在遵循的方法）是：每个类都出现在自己的头文件中，而该类成员函数的实现在关联的 `.cpp`\
  \ 文件中。因此，你有一个名为 `Object.hpp` 的文件和另一个名为 `Object.cpp` 的文件。你预见到会有其他文件，如 `Message.hpp`\
  \ 和 `Message.cpp`，分别带有 `pMessage` 的声明和其函数的实现。\n\n### 构建原型\n\n对于像 PostMaster 这样规模的项目，你的初始设计不太可能是完整且完美的。很容易被问题的庞大规模所淹没，并且试图在编写第一行可运行代码之前就创建所有的类并完成它们的接口，这将是灾难的根源。\n\
  \n有很多很好的理由让你在原型上尝试你的设计——一个你核心想法的快速、粗的运行示例。有许多类型的原型，每种都能满足不同的需求。\n\n接口设计原型提供了与潜在用户测试产品外观和感受的机会。\n\
  \n功能性原型没有最终的用户界面，但它让用户能够尝试各种功能，例如转发消息或附加文件。\n\n最后，架构原型的设计可能是为了让你有机会开发程序的较小版本，并评估随着程序的完善，你的设计决策能多容易地扩展。\n\
  \n保持你的原型目标清晰至关重要。你是在检查用户界面、在功能上进行实验，还是在构建最终产品的比例模型？一个良好的架构原型会变成一个糟糕的用户界面原型，反之亦然。\n\
  \n同样重要的是，留惕原型的过度工程，或者过度关注你在原型上投入的精力，以至于在进展过程中不于拆掉代码并重新设计。\n\n### 80/80 原则\n\n在这个阶段，一个良好的设计法则是：针对那些\
  \ 80% 的人想在 80% 的时间里做的事情进行设计，并把剩下的 20% 的顾虑留以后。边界条件迟早需要解决的，但你的设计核心应该集中在 80/80 上。\n\
  \n因此，你可能决定从设计主要类开始，忽略次要类的需求。此外，当你识别出多个设计相似且仅有细微改进的类时，你可能会选择一个代表性类并专注于它，将其它的“近亲类”的设计和实现留到以后。\n\
  \n***\n\n**注意**\n\n还有另一个规则，即 80/20 原则，是这样说的：你程序的前 20% 将花费你 80% 的时间来编写；而程序剩下的 80%\
  \ 将占据你剩下的 80% 的时间！\n\n真正的规则是，完成 20% 的工作需要 80% 的时间——或者说一家公司 80% 的利润来自于 20% 的客户。这一规则有广泛的应用。\n\
  \n***\n\n### 设计 PostMasterMessage 类\n\n考虑到这些因素，你决定专注于 `PostMasterMessage`，这是你最直接控制的类。\n\
  \n作为其接口的一部分，`PostMasterMessage` 显然需要与其他类型的消息通信。你希望能够与其他消息提供者紧密合作，并获取他们的消息格式规范，但目前你只需要通过观察在使用他们的服务时发送到你电脑的内容，就可以做出一些明智的。\n\
  \n无论如何，你知道每个 `PostMasterMessage` 都会有一个发送者、一个接收者、日期和一个主题，以及消息正文和可能的附件。这告诉你需要为这些属性中的每一个提供访问器（accessors），以及报告附件文件大小、消息大小等的成员函数。\n\
  \n你将连接的某些服务使用富文本——带有格式化指令的文本，用于设置字体、字符大小以及粗体和斜体等属性。其他服务不支持这些属性，而可能支持的服务可能会使用它们自己的专有方案来管理富文本。你的类需要转换函数，将富文本转换为纯\
  \ ASCII，可能还需要将其他格式转换为 PostMaster 格式。\n\n### 应用程序编程接口\n\n应用程序编程接口（API）是一组用于使用服务的文档和函数。许多邮件提供者将给你提供一个\
  \ API，以便 PostMaster 邮件能够利用它们更高级的功能，例如富文本和嵌入文件。你也想为 PostMaster 发布一个 API，以便其他提供者可以为未来与\
  \ PostMaster 工作做计划。你的 `PostMasterMessage` 类需要有一个良好的设计，转换函数将是 PostMaster API 的组成部分。列表\
  \ 22.2 展示了 `PostMasterMessage` 目前的样子。\n\n***\n\n**注意**\n\n由于此列表没有定义基类（`MailMessage`），它无法编译。\n\
  \n***\n\n**列表 22.2 PostMasterMessage.cpp 全文**\n\n```cpp\n1: class PostMasterMessage\
  \ : public MailMessage\n2: {\n3: public:\n4:     PostMasterMessage();\n5:     PostMasterMessage(\n\
  6:         pAddress sender,\n7:         pAddress recipient,\n8:         pString\
  \ subject,\n9:         pDate creationDate);\n10:\n11:    // 此处添加其他构造函数\n12:    //\
  \ 记得包含拷贝构造函数\n13:    // 以及来自存储的构造函数\n14:    // 和来自传输格式的构造函数\n15:    // 也包含来自其他格式的构造函数\n\
  16:    ~PostMasterMessage();\n17:     pAddress& getSender() const;\n18:     void\
  \ setSender(pAddress&);\n19:    // 此处添加其他成员访问器\n20:    // 此处添加运算符，包括等于运算符\n21: \
  \   // 以及将 PostMaster 消息转换为\n22:    // 其他格式的转换程序。\n23:\n24: private:\n25:     pAddress\
  \ sender;\n26:     pAddress recipient;\n27:     pString subject;\n28:     pDate\
  \ creationDate;\n29:     pDate lastModDate;\n30:     pDate receiptDate;\n31:   \
  \  pDate firstReadDate;\n32:     pDate lastReadDate;\n33: };\n```\n\n***\n\n`PostMasterMessage`\
  \ 被声明为派自 `MailMessage`。提供了许多构造函数，以便从其他类型的邮件消息创建 `PostMasterMessage` 对象。\n\n####\
  \ 大型团队中的编程\n\n\n\n\n即使是这种初步架构，也足以指示你的开发小组应该如何进行。通信组可以着手开始通信后端的工作，并与 `Message Format`\
  \ 组协商一个狭窄的接口。\n\n`Message Format` 组可能会定义通往 `Message` 类的通用接口（你已经开始了这一过程），然后将注意力转移到如何将数据写入文件并将其读回的问题。在充分理解了该文件接口后，团队将处于良好的位置来与通信层接口进行协商。\n\
  \n消息编辑器可能会倾向于创建那些对消息类内部细节有深入了解的编辑器，但这是一个糟糕的设计错误。它们也必须与消息类协商一个非常窄的接口；消息编辑器对象对消息的内部结构应该尽可能少地知之。\n\
  \n## 设计考虑\n\n随着项目的进行，你将反复遇到这个基本的设计问题：你应该将某组功能（或信息）放在哪个类中？是消息类应该拥有这个函数，还是地址类应该拥有？编辑器应该存储这些信息，还是由消息本身存储它们？\n\
  \n你的类应该在“按需知”的原则上运行，就像国际顶级间谍一样。它们共享的知识不应超过绝对必要的范围。\n\n随着程序的进展，你将面临数百个设计问题。这些问题的范围很广，从更全局的问题“我们想让它做什么？”到更具体的“我们如何让它运行起来？”。\n\
  \n尽管你的实现细节在交付代码之前不会最终确定，而且某些接口在你工作过程中会不断变动和变化，但你必须确保在过程早期就能充分理解你的设计。在编写代码之前，明确你正试图构建什么是至关重要的。软件项目夭折的最频繁原因，一定是在在过程足够早的阶段，对于正在构建的内容没有达成足够的共识。\n\
  \n为了对设计过程有一个直观感受，观察这个问题：菜单上会有什么？对于 `PostMaster` 来说，第一个选择可能是 `New Mail Message`，这引发了另一个设计问题：当用户选择\
  \ `New Mail Message` 时，会发生什么？是创建一个编辑器，进而创建一个邮件消息，还是创建一个新的邮件消息，然后再创建一个编辑器？\n\n你正在处理的命令是\
  \ `New Mail Message`，所以创建一个新的邮件消息似乎是理所当然的。但如果用户在开始写消息后点击了 `Cancel` 会发生什么呢？也许先创建编辑器让它来创建（并拥有）新消息会更干净一些。\n\
  \n这种方法的问题在于，如果编辑器是在创建消息而不是编辑消息，那么它的行为将需要不同。如果消息是先创建的然后交给编辑器，那么只需要存在一套代码，因为一切都是对现有消息的编辑。\n\
  \n如果消息是先创建的，是谁创建了它？是由菜单命令代码创建的吗？如果是，菜单是否也告诉消息编辑自己，还是这是消息构造函数的一部分？\n\n从乍看之下，构造函数这样做是有意义的；毕竟每当你创建一个消息时，你可能都想对其进行编辑。尽管如此，这不是一个好的设计主意。首先，前提可能是错误的；你可能会创建“预设”消息（例如发送给系统操作员的自动错误消息），这些消息不会放入编辑器。其次，更重要的是，构造函数的工作是创建一个对象；它应该不多也不少。在邮件消息被创建后，构造函数的工作就完成了。添加对\
  \ `edit` 函数的调用会混淆构造函数的作用，并使邮件消息容易受到编辑器失败的影响。\n\n糟糕糟糕，`edit` 函数将调用另一个类——编辑器——导致它的构造函数被调用。但编辑器并不是消息的基类，也不包含在消息内部。如果消息的构建取决于编辑器的成功构建，那将是非常不幸的。\n\
  \n最后，如果消息无法成功创建，你根本不想调用编辑器；然而，在这种情况下，成功的创建又依赖于调用编辑器！显然，最好的方法是在调用 `Message::Edit()`\
  \ 之前，完全从消息的构造函数返回。\n\n这种是你需要反复做的的设计决策，而你所做的设计将对软件是否可靠、无错误且可维护起到主要作用。\n\n## 与驱动程序（Driver\
  \ Programs）协同工作\n\n快速将设计问题推向表面的一种方法是在过程早期创建一个驱动程序。驱动程序仅为了测试其他对象及其成员函数而存在。例如，`PostMaster`\
  \ 的驱动程序可以提供一个简单的菜单，用于创建 `PostMasterMessage` 对象、操纵它们，并在其他方面测试某些设计。这种方法的另一个术语是“测试平台架”（`test\
  \ harness`）。\n\n列表 `22.3` 展示了一个稍为健壮的 `PostMasterMessage` 类定义和一个简单的驱动程序。由于程序很长，它包含了大量的注释来解释代码在做什么。\n\
  \n**列表 22.3 `Driver.cpp` 的全文**\n\n点击此处查看代码图像\n\n```cpp\n1: #include <iostream>\n\
