  \ 对象，调用 `Mammal` 构造函数和 `Dog` 构造函数（接两行）。第 41 行，`Mammal` 对象调用其 `speak()` 函数。第 42 行，`Dog`\
  \ 对象调用其 `speak()` 函数。最后，两个对象超出作用域并调用它们的析构函数。\n\n### 重载（Overloading）与重写（Overriding）\n\
  \n`overloading` 和 `overriding` 术语听起来相似，在 C++ 中的功能也相似。当你重载一个成员函数时，你创建了多个同名但不同的函数。当你重写一个成员函数时，你在派生类中创建一个与基类同相同且签名相同的函数。\n\
  \n### 隐藏基类函数（Hiding the Base Class Function）\n\n在你创建的 `Mammal5` 程序中，`Dog` 类的成员函数\
  \ `speak()` 隐藏了基类的函数。这正是想要的，但可能会产生意外的结果。如果 `Mammal` 有一个被重载的 `move()` 成员函数，而 `Dog`\
  \ 重写了该函数，那么 `Dog` 函数会隐藏所有同名的 `Mammal` 函数。\n\n如果 `Mammal` 将 `move()` 重载为三个函数——一个不接受参数的、一个接受整数、一个接受整数和方向的——而\
  \ `Dog` 只重写不接受参数的 `move()` 函数，那么使用 `Dog` 对象访问另外两个函数将会变得困难。列表 16.6 程序说明了这个问题。\n\n\
  **列表 16.6** `Mammal6.cpp` **全文**\n\n点击此处查看代码图片\n\n***\n\n```cpp\n1: #include <iostream>\n\
  2:\n3: class Mammal\n4: {\n5: public:\n6:      void move() const { std::cout <<\
  \ \"Mammal moves one step\\n\"; }\n7:      void move(int distance) const\n8:   \
  \   { std::cout << \"Mammal moves \" << distance << \" steps\\n\"; }\n9: protected:\n\
  10:      int age;\n11:      int weight;\n12: };\n13:\n14: class Dog : public Mammal\n\
  15: {\n16: public:\n17:      void move() const { std::cout << \"Dog moves 5 steps\\\
  n\"; }\n18: }; // 你可能会收到一个警告，说你隐藏了一个函数！\n19:\n20: int main()\n21: {\n22:      Mammal\
  \ bigAnimal;\n23:      Dog fido;\n24:      bigAnimal.move();\n25:      bigAnimal.move(2);\n\
  26:      fido.move();\n27:      // fido.move(10);\n28:      return 0;\n29: }\n```\n\
  \n`Mammal6` 程序在运行时产生此输出：\nMammal moves one step\nMammal moves 2 steps\nDog moves\
  \ 5 steps\n\n这些类中已移除所有额外的成员函数和数据。在第 6–8 行，`Mammal` 类声明了两个重载的 `move()` 函数。在第 17 行，`Dog`\
  \ 重写了不接受参数的 `move()` 版本。这些函数在第 24–26 行被调用，输出反映了执行情况。\n\n然而，第 27 行被注释掉了，因为这会导致编译器错误。虽然\
  \ `Dog` 类在没有重写无参数的 `move()` 版本时本可以调用 `move(int)` 函数，但现在它已经这样做了，就必须重写两者才能使用两者。这让人联起了如果你提供了任何构造函数，编译器将不再提供默认构造函数的规则。\n\
  \n\n\n\n\n一个常见的错误是，当你打算重写一个基类成员函数时，忘记包含 `const` 关键字。该关键字是函数签名的一部分，漏掉它会改变签名，从而隐藏（hide）该成员函数而不是重写（override）它。\n\
  \n在编写 `Mammal6` 程序时，某些编译器会在第 14–18 行左右对你给出一个警告。虽然你允许派生类隐藏基类的成员函数，但这通常是无意之为，这会触发某些编译器发出警告。\n\
  \n### 调用基类成员函数\n\n如果你重写了一个基类成员函数，仍然可以通过完全限定函数名来调用它。你通过编写基类类名、后跟两个冒号、然后是函数名来实现这一。。例如：\n\
  \n`Mammal::move()`\n\n本可以重写 Listing 16.6 中的第 27 行，使其通过编译：\n\n点击此处查看代码图像\n\n27: \
  \    fido.Mammal::move(10);\n\n这显式地调用了 `Mammal` 成员函数。本节最后的项目——Listing 16.7 中的 `Mammal7`\
  \ 程序，说明了这一思想。\n\n**LISTING 16.7 `Mammal7.cpp` 的全文**\n\n点击此处查看代码图像\n\n* * *\n\n```\n\
  1: #include <iostream>\n2:\n3: class Mammal\n4: {\n5: public:\n6:     void move()\
  \ const { std::cout << \"Mammal moves one step\\n\"; }\n7:     void move(int distance)\
  \ const\n8:             { std::cout << \"Mammal moves \" << distance << \" steps\\\
  n\"; }\n9: protected:\n10:     int age;\n11:     int weight;\n12: };\n13:\n14: class\
  \ Dog : public Mammal\n15: {\n16: public:\n17:     void move() const;\n18: };\n\
  19:\n20: void Dog::move() const\n21: {\n22:     std::cout << \"Dog moves ...\\n\"\
  ;\n23:     Mammal::move(3);\n24: }\n25:\n26: int main()\n27: {\n28:     Mammal bigAnimal;\n\
  29:     Dog fido;\n30:     bigAnimal.move(2);\n31:     fido.Mammal::move(6);\n32:\
  \     return 0;\n33: }\n```\n* * *\n\n`Mammal7` 运行时产生以下输出：\n\nMammal moves 2 steps\n\
  Mammal moves 6 steps\n\n在第 28 行创建了一个 `Mammal` 对象；在第 29 行创建了一个 `Dog` 对象。第 30 行的成员函数调用了\
  \ `Mammal` 的 `move()` 函数，该函数接收一个整数。\n\n如果你想在 `Dog` 对象上调用 `move(int)`，就会出现问题。`Dog`\
  \ 重写了 `move()` 函数，但没有重载它，并且没有提供接收 `int` 的版本。这通过在第 31 行显式调用基类的 `move(int)` 函数得到了解决。\n\
  \n### 总结\n\n如果这是你第一次接触类继承，你可能会想，创建基类和派生类的工作是否值得投入。在一组相关类之间决定成员变量和函数的放置位置可能需要一些时间和规划。\n\
  \n之所以要做这些工作是因为它让你的类变得更强大且更具重用性。\n\n当你很好地设计了一组相关类时，你可以更轻松地扩展基类并设计一个新的派生类。你只需要关注使新类与其父类不同的部分即可。\n\
  \n### 问答\n\n**Q. 继承的成员和函数会传递给后续代际吗？如果 `Dog` 继承自 `Mammal`，而 `Mammal` 继承自 `Animal`，那么\
  \ `Dog` 会继承 `Animal` 的函数和数据吗？**\n\n**A.** 是的。随着派生的继续，派生类继承所有基类中所有函数和数据的总和。\n\n**Q.\
  \ 派生类可以将公共基类函数变为私有吗？**\n\n**A.** 可以，并且它在所有后续派生中将保持私有。\n\n**Q. 君士坦丁堡何时成为伊斯坦布尔的？**\n\
  \n**A.** 在东罗马皇帝奥多西二世从 408 年到 450 年统治期间，土耳其伊斯坦布尔市被称为君士坦丁堡。这个名字是为了纪念大君士丁皇帝，他曾将该城市变为罗马帝国的东方首都。\n\
  \n几个世纪后，伊斯坦布尔名称也开始被使用，大致意思是“城市”。\n\n在土耳其共和国成立后，1930 年通过了一项法律，要求世界其他地区开始称称为伊斯坦布尔。为了让这一请求更有力，土耳其邮政开始拒绝邮寄到君士坦丁堡的包裹。\n\
  \n这一名称的改变激发了 Four Lads 演唱的 1953 年歌曲《Istanbul (Not Constantinople)》，以及 They Might\
  \ Be Giants 在 1990 年的翻唱。\n\n“君士坦丁堡为什么会遭遇这一切？”歌曲中这样问道。“这不是土耳其人的事。”\n\n### 工作坊\n\n\
  现在你已经接触了继承，可以回答几个问题并做一些练习来巩固知识。\n\n#### 测验\n\n**Q. 哪个关键字限制了对象及其派生类的成员变量？**\n\nA.\
  \ `public`\nB. `private`\nC. `protected`\n\n**Q. 在派生类中，构造函数的调用顺序是怎样的？**\n\nA. 按继承顺序向下\n\
  B. 按继承顺序向上\nC. 按定义顺序\n\n**Q. 你为什么想在派生类中隐藏基类函数？**\n\nA. 为了防止其被使用\nB. 为了调用它\nC. 没有理由\n\
  \n#### 答案\n\n**1** C. `protected`\n\n**2** A. 基类构造函数首先调用\n\n**3** A. 有时派生类的行为足够不同\n\
