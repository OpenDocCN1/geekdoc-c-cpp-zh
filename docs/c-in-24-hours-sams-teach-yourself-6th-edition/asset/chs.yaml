  \ const { return firstName; }\n        const String& getLastName() const { return\
  \ lastName; }\n        const String& getAddress() const { return address; }\n  \
  \      long getSalary() const { return salary; }\n\n        void setFirstName(const\
  \ String& fName) { firstName = fName; }\n        void setLastName(const String&\
  \ lName) { lastName = lName; }\n        void setAddress(const String& newAddress)\
  \ { address = newAddress; }\n        void setSalary(long newSalary) { salary = newSalary;\
  \ }\n    private:\n        String firstName;\n        String lastName;\n       \
  \ String address;\n        long salary;\n};\n```````cpp\nEmployee::Employee():\n\
