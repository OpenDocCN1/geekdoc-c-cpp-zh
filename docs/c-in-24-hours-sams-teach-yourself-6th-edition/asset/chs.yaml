  输出与上一个程序产生的完全相同。唯一的变化是第 55–62 行中的 `FunctionTwo()` 现在接收并返回一个指向常量对象的引用。再次，使用引用比使用指针要简单一些；并且实现了相同的节省和效率，以及由\
  \ `const` 提供的安全性。\n\n### 何时使用引用以及何时使用指针\n\n通常情况下，C++ 程序员倾向于使用引用而非指针，因为它们更简洁且易于使用。然而，引用不能重新赋值。如果你需要指向一个对象然后再指向另一个对象，则必须使用指针。引用不能为\
  \ `NULL`，所以如果对象有可能是 `NULL`，那么你必须使用指针而不是引用。如果你想从堆上分配动态内存，必须像之前讨论的那样使用指针。\n\n### 不在作用域的对象引用\n\
  \n在 C++ 程序员学习了引用传递后，他们往往会过度使用。然而，这样做可能会过头。记住，引用始终是某个其他对象的别名。如果你将引用传递到函数内部或传出函数，请务必问自己：“我正在别名的对象是什么，它在每次被使用时仍然存在吗？”\
  \ 列表 13.4 中的 `ReturnRef` 程序说明了返回不再存在的对象的引用的危险。\n\n### 列表 13.4 `ReturnRef.cpp` 的完整文本\n\
  \n点击此处查看代码图像\n\n```cpp\n1: #include <iostream>\n2:\n3: class SimpleCat\n4: {\n5:\
  \ public:\n6:      SimpleCat(int age, int weight);\n7:      ~SimpleCat();\n8:  \
  \    int GetAge() { return itsAge; }\n9:      int GetWeight() { return itsWeight;\
  \ }\n10: private:\n11:      int itsAge;\n12:      int itsWeight;\n13: };\n14:\n\
  15: SimpleCat::SimpleCat(int age, int weight):\n16: itsAge(age), itsWeight(weight)\
  \ {}\n17:\n18: SimpleCat &FunctionTwo();\n19:\n20: int main()\n21: {\n22:      SimpleCat\
  \ &rCat = FunctionTwo();\n23:      int age = rCat.GetAge();\n24:      std::cout\
  \ << \"rCat is \" << age << \" years old!\" << std::endl;\n25:      return 0;\n\
  26: }\n27:\n28: SimpleCat &FunctionTwo()\n29: {\n30:      SimpleCat Frisky(5,9);\n\
  31:      return Frisky;\n32: }\n```\n\n当你构建此程序时，会遇到一个关于返回局部变量引用的错误。某些编译器足够聪明，能检测到这一点并不允许运行；其他编译器则允许运行，但结果是不可预测的。当\
  \ `FunctionTwo()` 返回时，局部对象 `Frisky` 被销毁。\n\n### 返回堆上的对象引用\n\n你可能被尝试让 `FunctionTwo()`\
  \ 在堆上创建 `Frisky`。这样当你从 `FunctionTwo()` 返回时，`Frisky` 仍然存在。列表 13.5 中的 `Leak` 程序说明了这个问题。\n\
  \n### 列表 13.5 `Leak.cpp`\n\n这种方法的问题是：当你完成对 `Frisky` 的操作后，如何处理这些内存？\n\n```cpp\n1:\
