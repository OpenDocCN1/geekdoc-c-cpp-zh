  \n当家谱网站 [Ancestry.Com](http://Ancestry.Com) 在 2008 年研究美国王位的继承问题时，他们发现乔治·华盛顿的 8000\
  \ 名亲属可以纳入决策范围。共有四条可能的继承路径，而保罗·华盛顿位于其中两条路径的末端。\n\n“我怀疑自己是否能成为非常好的国王，”保罗告诉 NBC 的《今日秀》（*Today\
  \ Show*）。“我们作为一个没有国王的国家已经过得非常好了，所以我认为乔治做出了最好的决定。”\n\n尽管保罗拒绝了他的君主身份继承权，但他开始称呼他的长子比尔为“威廉王子”。当保罗于\
  \ 2014 年以 87 高龄去世时，比尔登上了那个假设的王位。\n\n## 工作坊\n\n现在你已经学习了指针，可以回答几个问题并完成一些练习来巩固你的知识。\n\
  \n### 测验\n\n**1.** 在初始化指针时，`0` 和 `nullptr` 的区别是什么？\n\n**A.** `nullptr` 创建一个空指针。\n\
  \n**B.** `0` 创建一个空指针。\n\n**C.** 两者都创建空指针。\n\n**2.** 当你完成操作后没有释放堆空间时，这称为什么？\n\n**A.**\
  \ 内存泄漏\n\n**B.** 内存洞\n\n**C.** 我忘记问题了\n\n**3.** 我如何释放用 `new` 分配的内存？\n\n**A.** `return`\n\
  \n**B.** `delete`\n\n**C.** `*`\n\n### 答案\n\n**1. C.** `0` 和 `nullptr` 都会将指针初始化为无地址，使其成为空指针。使用\
  \ `nullptr` 更清晰，因为它显显然是一个指针，而值 `0` 在 C++ 中有许多其他用途。在支持的情况下，应该使用新常量 `nullptr` 代替 `0`\
  \ 或 `NULL`。\n\n**2. A.** 内存泄漏。程序继续根据需要分配新空间，但可用的内存越来越少。\n\n**3. B.** 使用 `delete`\
  \ 关键字。在完成对堆上变量内容的操作后立即 `delete` 是一种良好的习惯。\n\n### 活动\n\n**1.** 修改 `PointerCheck`\
