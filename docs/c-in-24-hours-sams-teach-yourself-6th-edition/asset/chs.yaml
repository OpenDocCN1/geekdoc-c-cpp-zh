  \n\n\n\n除了提供默认构造函数和析构函数外，编译器还提供了默认拷贝构造函数。每当创建对象的拷贝时，拷贝构造函数就会被调用。\n\n当你按值传递对象（无论是作为函数参数还是作为函数的返回值）时，会创建该对象的临时副本。如果该对象是用户定义的对象，则会调用类的拷贝构造函数。\n\
  \n所有的拷贝构造函数都接受一个参数：指向相同类对象的引用。将其作为常量引用是一个好主意，因为构造函数不需要修改传入的对象。例如：\n\n点击此处查看代码图像\n\
  \n```\nTricycle(const Tricycle &trike);\n```\n\n在这一语句中，`Tricycle` 构造函数接收指向现有 `Tricycle`\
  \ 对象的常量引用。拷贝构造函数的目标是为 `trike` 创建副本。\n\n默认拷贝构造函数简单地将作为参数传入对象的每个成员变量复制到新对象的成员变量中。这被称为浅拷贝（或按成员拷贝）。虽然对于大多数成员变量这是可以的，但对于指向堆上对象的指针成员变量，它是无效。\n\
  \n浅拷贝将一个对象的成员变量的精确值复制到另一个对象中。两个对象的指针最终指向同一块内存。另一方面，深拷贝](#part0041.html_gloss_23)将分配在堆上的值复制到新分配的内存中。\n\
  \n一个示例说明了这个问题：如果 `Tricycle` 类包含一个名为 `durability` 的成员变量，指向堆上的一个整数，默认拷贝构造函数会将传入的 `Tricycle's\
  \ durability` 成员变量复制到新 `Tricycle's durability` 成员变量中。然后两个对象将指向同一块内存，如图 14.1 所示。\n\
  \n![Image](img/00013.jpeg)\n\n**图 14.1** 使用默认拷贝构造函数。\n\n当任何一个 `Tricycle` 对象超出范围时，会导致灾难。该对象的析构函数会被调用，并尝试清理已分配的内存。\n\
  \n然而，另一个对象仍然指向该内存。如果它尝试访问该内存，程序就会崩溃。\n\n解决此问题的方法是定义自己的拷贝构造函数，并在拷贝过程中正确分配内存。创建深拷贝允许你将现有值拷贝到新内存中。列表\
  \ 14.3 中的 `DeepCopy` 程序演示了如何这样做。\n\n**列表 14.3** `DeepCopy.cpp` 的全文\n\n点击此处查看代码图像\n\
  \n```cpp\n1: #include <iostream>\n2:\n3: class Tricycle\n4: {\n5: public:\n6:  \
  \    Tricycle();                   // 默认构造函数\n7:      Tricycle(const Tricycle&);\
  \      // 拷贝构造函数\n8:      ~Tricycle();                  // 析构函数\n9:      int getSpeed()\
  \ const { return *speed; }\n10:      void setSpeed(int newSpeed) { *speed = newSpeed;\
  \ }\n11:      void pedal();\n12:      void brake();\n13:\n14: private:\n15:    \
  \  int *speed;\n16: };\n17:\n18: Tricycle::Tricycle()\n19: {\n20:      speed = new\
  \ int;\n21:      *speed = 5;\n22: }\n23:\n24: Tricycle::Tricycle(const Tricycle&\
  \ rhs)\n25: {\n26:      speed = new int;\n27:      *speed = rhs.getSpeed();\n28:\
  \ }\n29:\n30: Tricycle::~Tricycle()\n31: {\n32:      delete speed;\n33:      speed\
  \ = NULL;\n34: }\n35:\n36: void Tricycle::pedal()\n37: {\n38:      setSpeed(*speed\
  \ + 1);\n39:      std::cout << \"\\nPedaling \" << getSpeed() << \" mph\" << std::endl;\n\
  40: }\n41: void Tricycle::brake()\n42: {\n43:      setSpeed(*speed - 1);\n44:  \
  \    std::cout << \"\\nPedaling \" << getSpeed() << \" mph\" << std::endl;\n45:\
  \ }\n46:\n47: int main()\n48: {\n49:      std::cout << \"Creating trike named wichita...\"\
  ;\n50:      Tricycle wichita;\n51:      wichita.pedal();\n52:      std::cout <<\
  \ \"Creating trike named dallas ...\" << std::endl;\n53:      Tricycle dallas(wichita);\n\
  54:      std::cout << \"wichita's speed: \" << wichita.getSpeed() << std::endl;\n\
  55:      std::cout << \"dallas's speed: \" << dallas.getSpeed() << std::endl;\n\
  56:      std::cout << \"setting wichita to 10 ...\" << std::endl;\n```\n\n\n\n\n\
  点击此处查看代码图像\n\n```cpp\nint year = 2016 + getCentury();\n```\n\n尽管该成员函数返回一个常量，但函数本身可能并不是常量的。它可能会修改全局变量，或者调用非常量的成员函数。\n\
  \nC++ 在最近的版本中通过 `constexpr` 关键字引入了常量表达式：\n\n```cpp\nconstexpr int getCentury()\n\
  {\n    return 100;\n}\n```\n\n常量表达式必须具有非 `void` 的返回类型，并 `return` 一个表达式作为其内容。返回的表达式仅可以包含字面量值、对其他常量表达式的调用，或者同样被定义为\
  \ `constexpr` 的变量。\n\n以下语句使用 `constexpr` 关键字定义了一个名为 `century` 的常量和一个名为 `year` 的常量表达式：\n\
  \n点击此处查看代码图像\n\n```cpp\nconst int century = 100;\nconstexpr year = 2016 + century;\n\
  ```\n\n`Circle` 程序（Listing 14.4\n\n* * *\n\n```cpp\n1: #include <iostream>\n2:\n\
  3// 获取 PI 的近似值\n4: constexpr double getPi() {\n5:     return (double) 22 / 7;\n\
  6: }\n7:\n8: int main()\n9: {\n10:     float radius;\n11:\n12:     std::cout <<\
  \ \"Enter the radius of the circle: \";\n13:     std::cin >> radius;\n14:\n15: \
  \    // 面积等于 PI 乘以半径平方\n16:     double area = getPi() * (radius * radius);\n17:\n\
  18:     std::cout << \"\\nCircle's area: \" << area << std::endl;\n19:\n20:    \
  \ return 0;\n21: }\n```\n\n* * *\n\n以下是程序半径为 19 时的示例输出：\n\n点击此处查看代码图像\n\n```text\n\
  Enter the radius of the circle: 19\nCircle's area: 1134.57\n```\n\nC++ 没有用于表示 `PI`\
  \ 值的关键字。其适用于某些用途的合理近似值是 22 除以 7。当在 C++ 中被存储为 `double` 类型时，它等于 3.14286，即 `PI` 值四舍五入到五位数。\n\
  \n`Circle` 程序将 `22/7` 计算为常量表达式。该函数之所以做到，是因为它只包含一条语句（即 `return` 后跟一个表达式），并且仅包含字面量、常量或常量表达式。\n\
  \n### 总结\n\n在这一小时中，你学习了如何在 C++ 中对对象的创建和销毁实现更精细的控制。\n\n构造函数像函数一样可以重载。构造函数的参数数量和类型允许编译器确定类的用户应该调用哪一个。\n\
  \n构造函数可以像成员函数和普通函数一样具有默认值。\n\n当对象被复制时，所有成员变量都会由默认拷贝构造函数复制。当成员变量是指堆上对象的指针时，这就会产生问题。原始对象和副本都指向同一个对象。当一个对象离开作用域并销毁时，另一个对象仍然持有该对象的有效指针。任何尝试使用该指针的操作都会导致程序崩溃。\n\
  \n可以通过为类编写自己的拷贝构造函数来解决这个问题。该构造函数接受一个参数：要被复制的原始对象。在构造函数中，可以确保指针使用新的堆内存。\n\n### 问答\n\
  \n**Q. 既然可以重载函数，为什么还要使用默认值呢？**\n\n**A.** 因为维护一个函数比维护两个更容易，理解一个带有默认参数的函数也比研究两个函数的体要容易。此外，更新其中一个函数而忽略更新另一个是常见的\
  \ Bug 来源。\n\n**Q. 鉴于重载方法存在的问题，为什么不总是使用默认值呢？**\n\n**A.** 重载方法提供了默认变量无法实现的功能，例如根据类型而非仅仅根据数量来改变参数列表。\n\
  \n**Q. 在编写类构造函数时，你如何决定哪些内容放在初始化器中，哪些内容放在构造函数体中？**\n\n**A.** 一个简单的经验法是在初始化阶段尽可能多做工作，并在那里初始化所有成员变量。某些事情（如计算和\
  \ `std::cout` 语句）必须放在构造函数体内。\n\n**Q. 重载方法可以有默认参数吗？**\n\n**A.** 可以。\n\n\n\n\n一个类可以通过\
  \ `multiply()` 和 `add()` 成员函数提供相同的功能，但语法要复杂得多。这里有一个用于 `Number` 类的代码片段，它表示整数并执行与前面的示例相同的工作：\n\
  \n```cpp\nNumber x(17);\nNumber y(12);\nNumber z, temp;\ntemp = y.add(5);\nz = x.multiply(temp);\n\
  ```\n\n这段代码给 `y` 加上 5，并将结果与 `x` 相乘。结果仍然是 289。\n\n如你所见，代码更长且更复杂。为了采用更简单的方法，可以使用名为“运算符重载”（operator\
  \ overloading）的技术通过运算符来对类进行操作。\n\n运算符重载定义了当使用特定运算符处理类对象时会发生什么。C++ 中几乎所有的运算符都可以被重载。使用运算符编写的表达式更容易阅读和理解。\n\
  \n在你首次探索运算符重载时，**Listing 15.1 中的 `Counter` 程序创建了一个同名的类。`Counter` 对象将用于计数、循环以及其他需要对数字进行递增、递减或监控的任务。**\n\
  \n**列表 15.1 `Counter.cpp` 的全文**\n\n点击此此处查看代码图片\n\n```cpp\n1: #include <iostream>\n\
  2:\n3: class Counter\n4: {\n5: public:\n6:      Counter();\n7:      ~Counter(){}\n\
  8:      int getValue() const { return value; }\n9:      void setValue(int x) { value\
  \ = x; }\n10:\n11: private:\n12:      int value;\n13: };\n14:\n15: Counter::Counter():\n\
  16: value(0)\n17: {}\n18:\n19: int main()\n20: {\n21:      Counter c;\n22:     \
  \ std::cout << \"The value of c is \" << c.getValue()\n23:             << std::endl;\n\
  24:      return 0;\n25: }\n```\n\n该程序创建了一个计数器并显示其当前值：\nThe value of c is 0\n\n目前，这些只是非常基础的内容。类定义在第\
  \ 3–13 行，只有一个成员变量，一个名为 `value` 的 `int`。在第 6 行声明并在第 15–17 行实现的默认构造函数，将成员变量初始化为 0。\n\
  \n与内置的 `int` 不同，`Counter` 对象不能通过运算符进行递增、递减、加、赋值或操作。它也无法方便地显示自己的值。接下来的章节将解决这些缺点。\n\
  \n### 编写递增方法\n\n运算符重载提供了 `Counter` 等自定义类中本会缺失的功能。当你为类实现一个运算符时，就认为是在*重载*（overloading）该运算符。\n\
  \n在类中重载运算符的最常用方法是使用成员函数。函数声明采用如下形式：\n\n```cpp\nreturnType operatorsymbol(parameter\
  \ list)\n{\n   // body of overloaded member function\n}\n```\n\n函数名是 `operator`\
  \ 后跟要定义的运算符，例如 `+` 或 `++`。`returnType` 是函数的返回类型，参数列表包含零、一个或两个参数（取决于运算符）。\n\n**Listing\
  \ 15.2 中的 `Counter2` 程序说明了如何重载递增运算符 `++`。**\n\n**列表 15.2 `Counter2.cpp` 的全文**\n\n\
  点击此此处查看代码图片\n\n```cpp\n1: #include <iostream>\n2:\n3: class Counter\n4: {\n5: public:\n\
  6:      Counter();\n7:      ~Counter(){}\n8:      int getValue() const { return\
  \ value; }\n9:      void setValue(int x) { value = x; }\n10:      void increment()\
  \ { ++value; }\n11:      const Counter& operator++();\n12:\n13: private:\n14:  \
  \    int value;\n15: };\n16:\n17: Counter::Counter():\n18: value(0)\n19: {}\n20:\n\
  21: const Counter& Counter::operator++()\n22: {\n23:      ++value;\n24:      return\
  \ *this;\n25: }\n26:\n27: int main()\n28: {\n29:      Counter c;\n30:      std::cout\
  \ << \"The value of c is \" << c.getValue()\n31:             << std::endl;\n32:\
  \      c.increment();\n33:      std::cout << \"The value of c is \" << c.getValue()\n\
  34:             << std::endl;\n35:      ++c;\n36:      std::cout << \"The value\
  \ of c is \" << c.getValue()\n37:             << std::endl;\n38:      Counter a\
  \ = ++c;\n39:      std::cout << \"The value of a: \" << a.getValue();\n40:     \
  \ std::cout << \" and c: \" << c.getValue();\n41: }\n```\n\n该程序多次递增 `Counter` 对象并显示其值：\n\
  The value of c is 0\nThe value of c is 1\nThe value of c is 2\nThe value of a: 3\
  \ and c: 3\n\n在第 35 行，`++c` 被解释为调用 `Counter` 对象的 `operator++()` 成员函数。由于它返回 `const\
  \ Counter&` 引用，因此它可以赋值给变量 `a`（如第 38 行所示）。\n\n### 后置运算符\n\n处理后置运算符的问题是：如何重载它？\n\n\
  重载后置运算符的方法是在成员函数中包含一个 `int` 参数（用于与前置运算符区分）。由于后置运算符返回的是原始值而不是增加后的值，因此我们需要在函数内部创建一个临时对象来持有原始值，然后对成员变量进行递增。\n\
  \nListing 15.3 中的 `Counter3` 程序演示了如何重载前置和后置运算符。\n\n**列表 15.3 `Counter3.cpp` 的全文**\n\
  \n点击此此处查看代码图片\n\n```cpp\n1: #include <iostream>\n2:\n3: class Counter\n4: {\n5:\
  \ public:\n6:      Counter();\n7:      ~Counter(){}\n8:      int getValue() const\
  \ { return value; }\n9:      void setValue(int x) { value = x; }\n10:     const\
  \ Counter& operator++();  // 前置\n11:     const Counter operator++(int); // 后置\n\
  12:\n13: private:\n14:      int value;\n15: };\n16:\n17: Counter::Counter():\n18:\
  \ value(0)\n19: {}\n20:\n21: const Counter& Counter::operator++() // 前置\n22: {\n\
  23:      ++value;\n24:      return *this;\n25: }\n26:\n27: const Counter Counter::operator++(int)\
  \ // 后置\n28: {\n29:      Counter temp(*this);\n30:      ++value;\n31:      return\
  \ temp;\n32: }\n33:\n34: int main()\n35: {\n36:      Counter c;\n37:      std::cout\
  \ << \"The value of c is \" << c.getValue()\n38:             << std::endl;\n39:\
  \      c++;\n40:      std::cout << \"The value of c is \" << c.getValue()\n41: \
  \            << std::endl;\n42:      ++c;\n43:      std::cout << \"The value of\
  \ c is \" << c.getValue()\n44:             << std::endl;\n45:      Counter a = ++c;\n\
  46:      std::cout << \"The value of a: \" << a.getValue();\n47:      std::cout\
  \ << \" and c: \" << c.getValue() << std::endl;\n48:      a = c++;\n49:      std::cout\
  \ << \"The value of a: \" << a.getValue();\n50: }\n```\n\n\n\n\n```cpp\n50:    \
  \  std::cout << \" and c: \" << c.getValue() << std::endl;\n51:      return 0;\n\
  52: }\n```\n\n该程序重载了前置和后置递增运算符，并在多个语句中使用了它们：\n\n- `c` 的值为 0\n- `c` 的值为 1\n- `c`\
  \ 的值为 2\n- `a` 的值为 3 且 `c` 的值为 3\n- `a` 的值为 3 且 `c` 的值为 4\n\n后置运算符在第 11 行声明，并于第\
  \ 27–32 行实现。注意，第 27 行函数声明中的 `int` 参数没有以任何方式使用。它甚至没有被赋予变量名。\n\n## 重载加运算符\n\n递增运算符是一个一元运算符，这意味着它只接受一个操作数。加运算符（`+`）是一个二元运算符，它将两个操作数相加，这为重载的工作方式增加了复杂性。\n\
  \n`Counter` 类的下一个版本将能够使用 `+` 运算符将两个 `Counter` 对象相加：\n\n```cpp\nCounter var1, var2,\
  \ var3;\nvar3 = var1 + var2;\n```\n\n虽然你可以写一个接受两个 `Counter` 对象并返回包含它们和的 `Counter`\
  \ 的 `add()` 方法，但更好的技术是重载 `+` 运算符。列表 15.4 中的 `Counter4` 程序展示了如何这样做。\n\n### 列表 15.4\
  \ Counter4.cpp 的全文\n\n```cpp\n1: #include <iostream>\n2:\n3: class Counter\n4: {\n\
  5: public:\n6:      Counter();\n7:      Counter(int initialValue);\n8:      ~Counter(){}\n\
  9:      int getValue() const { return value; }\n10:      void setValue(int x) {\
  \ value = x; }\n11:      Counter operator+(const Counter&);\n12:\n13: private:\n\
  14:      int value;\n15: };\n16:\n17: Counter::Counter(int initialValue):\n18: value(initialValue)\n\
  19: {}\n20:\n21: Counter::Counter():\n22: value(0)\n23: {}\n24:\n25: Counter Counter::operator+(const\
  \ Counter &rhs)\n26: {\n27:      return Counter(value + rhs.getValue());\n28: }\n\
  29:\n30: int main()\n31: {\n32:      Counter alpha(4), beta(13), gamma;\n33:   \
  \   gamma = alpha + beta;\n34:      std::cout << \"alpha: \" << alpha.getValue()\
  \ << std::endl;\n35:      std::cout << \"beta: \" << beta.getValue() << std::endl;\n\
  36:      std::cout << \"gamma: \" << gamma.getValue()\n37:              << std::endl;\n\
  38:      return 0;\n39: }\n```\n\n该程序两个两个 `Counter` 对象，并将和存储在第三个对象中：\n\n- alpha:\
  \ 4\n- beta: 13\n- gamma: 17\n\n从输出可以看出，`gamma` 对象包含了 `alpha` 加上 `beta` 的和。\n\n\
  加运算符在第 33 行被调用：\n\n```cpp\ngamma = alpha + beta;\n```\n\n编译器解释该语句就像你写了以下代码一样：\n\n\
  ```cpp\ngamma = alpha.operator+(beta);\n```\n\n第 33 行调用了在第 11 行声明并在第 25–28 行定义的\
  \ `operator+` 成员函数。\n\n加表达式中有两个操作数。左操作数是调用 `operator+()` 函数的对象。右操作数是该方法的参数。\n\n\
  如果你写了一个 `add()` 方法来将两个对象相加，可以使用这样的语句调用：\n\n```cpp\ngamma = alpha.add(beta);\n```\n\
  \n运算符重载通过替换显式函数调用使程序更容易使用和理解。\n\n## 运算符重载的局限性\n\n尽管运算符重载是 C++ 语言中最强大的特性之一，但它是有限制的。\n\
  \n用于 `int` 等内置类型的运算符不能重载。优先级顺序不能更改，运算符的元数（无论是一元、二元还是三元）也无法更改。你不能发明运算符，因此没有办法通过将\
  \ `*` 声明为幂运算符来执行某些操作。\n\n运算符重载是新程序员最常使用和滥用的 C++ 方面之一。为某些晦涩的运算符创建新的、有趣的用途是很诱人的，但这些通常会导致代码混乱且难以阅读。\n\
  \n### 注意事项\n\n做诸如让 `+` 运算符变为减法、`*` 运算符变为加法等反直觉的事情在第一次尝试时很有趣，但没有人会在代码中这样做。\n\n真正的危险在于对运算符进行出于良好意但奇特的用法，例如使用\
  \ `+` 连接一串字母或使用 `/` 分割字符串。考虑这些用法有充分的理由，但更有充分的理由是谨慎行。重载运算符的目标是提高可用性。\n\n## operator=\n\
  \nC++ 编译器为每个类提供默认的构造函数、析构函数和拷贝构造函数。当类中没有指定时，编译器提供的第四个成员函数定义了赋值运算符。\n\n赋值运算符的重载函数形式为\
  \ `operator()`，当你使用如下语句对对象赋值时它会被调用：\n\n```cpp\nTricycle wichita;\nwichita.setSpeed(4);\n\
  Tricycle dallas;\ndallas.setSpeed(13);\ndallas = wichita;\n```\n\n名为 `wichita` 的\
  \ `Tricycle` 对象被创建，其成员变量赋值为 4，随后是 `dallas` 被赋值为 13。由于赋值语句，`dallas.speed` 获得来自 `wichita`\
  \ 的值。\n\n在这种情况下，没有调用构造函数，因为 `dallas` 已经存在，取而代之的是调用赋值运算符。\n\n浅拷贝和深拷贝的区别：浅拷贝只是让对象指向堆上的同一区域。深拷贝则分配内存。\n\
  \n相同的问题在这里出现了，增加了一个变量。由于 `dallas` 已经存在并分配了内存，必须删除内存以防止内存泄漏。\n\n因此，在重载赋值运算符时要做的的第一件事是通过语句删除内存：\n\
  \n```cpp\ndelete speed;\n```\n\n这样做是有效的，但如果你将 `dallas` 赋值给自己会发生什么：\n\n```cpp\ndallas\
  \ = dallas;\n```\n\n程序员不太可能故意这样做，但类必须能够处理这种情况，因为可能会意外发生。引用和解引用指针可能会隐藏对象正在自赋值的事实。\n\
  \n如果不防止这个问题，自赋值会导致 `dallas` 删除它自己的内存。在它删除之后，当它准备从赋值右侧拷贝内存时，该内存已经消失了。\n\n如果赋值运算符使用\
  \ `this` 指针检查赋值右侧是否为对象本身，就可以防止。列表 15.5 中的 `Assignment` 类使用重载定义了自定义的赋值运算符并避免了相同对象的问题。\n\
  \n### 列表 15.5 Assignment.cpp 的全文\n\n```cpp\n1: #include <iostream>\n2:\n3: class\
  \ Tricycle\n4: {\n5: public:\n6:      Tricycle();\n7:      // 拷贝构造函数和析构函数使用默认\n\
  8:      int getSpeed() const { return *speed; }\n9:      void setSpeed(int newSpeed)\
  \ { *speed = newSpeed; }\n10:     Tricycle operator=(const Tricycle&);\n11:\n12:\
  \ private:\n13:      int *speed;\n14: };\n15:\n16: Tricycle::Tricycle()\n17: {\n\
  18:      speed = new int;\n19:      *speed = 5;\n20: }\n21:\n22: Tricycle Tricycle::operator=(const\
  \ Tricycle& rhs)\n23: {\n24:      if (this == &rhs)\n25:          return *this;\n\
  26:      delete speed;\n27:      speed = new int;\n28:      *speed = rhs.getSpeed();\n\
  29:      return *this;\n30: }\n```\n\n\n\n\n```cpp\nint main()\n{\n    Tricycle\
  \ wichita;\n    std::cout << \"Wichita's speed: \" << wichita.getSpeed() << std::endl;\n\
  \    std::cout << \"Setting Wichita's speed to 6 ...\" << std::endl;\n    wichita.setSpeed(6);\n\
  \    Tricycle dallas;\n    std::cout << \"Dallas' speed: \" << dallas.getSpeed()\
  \ << std::endl;\n    std::cout << \"Copying Wichita to Dallas ...\" << std::endl;\n\
  \    wichita = dallas;\n    std::cout << \"Dallas' speed: \" << dallas.getSpeed()\
  \ << std::endl;\n    return 0;\n}\n```\n\n赋值操作运行时会产生此输出：\n\n点击此处查看代码图像\n\nWichita's\
  \ speed: 5\nSetting Wichita's speed to 6 ...\nDallas' speed: 5\nCopying Wichita\
  \ to Dallas ...\nDallas' speed: 5\n\nListing 15.5 再次介绍了 `Tricycle` 类，省略了拷贝构造函数和析构函数以节省空间。在第\
  \ 10 行声明了赋值运算符，在第 22–30 行对其进行了定义。\n\n在第 24 行，对当前对象（被赋值的 `Tricycle`）进行测试，检查它是否与被赋值的\
  \ `Tricycle` 。这是通过检查 `rhs` 的地址是否与存储在 `this` 指针中的地址来实现的。\n\n相等运算符 (`==`) 也可以重载，允许你自己决定对象相等意味着什么。\n\
  \n### 注意\n\n在 Listing 15.5 的第 26–27 行，成员变量 `speed` 被删除并并在堆上重新创建。虽然这并非严格必要，但在处理没有重载赋值运算符的变长对象时，这是一个良好的编程习惯，可以避免内存泄漏。\n\
  \n### 转换运算符\n\n当你尝试将内置类型的变量（如 `int` 或 `unsigned short`）赋值给用户定义类的对象时，会发生什么？Listing\
  \ 15.6 再次介绍了 `Counter` 类，并尝试将 `int` 类型的变量赋值给 `Counter` 对象。\n\n### 注意事项\n\nListing\
  \ 15.6 将无法编译，原因你将在准备好它后就会了解到。\n\n#### LISTING 15.6 `Counter5.cpp` 的全文\n\n点击此处查看代码图像\n\
  \n```cpp\n#include <iostream>\n\nclass Counter\n{\npublic:\n    Counter();\n   \
  \ ~Counter() {}\n    int getValue() const { return value; }\n    void setValue(int\
  \ newValue) { value = newValue; }\nprivate:\n    int value;\n};\n\nCounter::Counter():\n\
  value(0)\n{}\n\nint main()\n{\n    int beta = 5;\n    Counter alpha = beta;\n  \
  \  std::cout << \"alpha: \" << alpha.getValue() << std::endl;\n    return 0;\n}\n\
  ```\n\n当你尝试编译此程序时，它会在第 21 行产生关于尝试将 `int` 转换为 `Counter` 对象的错误。\n\n在第 3–12 行声明的 `Counter`\
  \ 类只有一个默认构造函数。它没有声明任何用于将 `int` 转换为 `Counter` 对象的特定成员函数，因此第 21 行触发了编译错误。在缺少此类函数的情况下，编译器无法确定应该将\
  \ `int` 赋值给对象的成员变量 `value`。`Counter6` 程序 (Listing 15.7) 通过创建一个转换运算符纠正了这一点：一个接受 `int`\
  \ 并产生 `Counter` 对象的构造函数。\n\n#### LISTING 15.7 `Counter6.cpp` 的全文\n\n点击此处查看代码图像\n\
  \n```cpp\n#include <iostream>\n\nclass Counter\n{\npublic:\n    Counter();\n   \
  \ ~Counter() {}\n    Counter(int newValue);\n    int getValue() const { return value;\
  \ }\n    void setValue(int newValue) { value = newValue; }\nprivate:\n    int value;\n\
  };\n\nCounter::Counter():\nvalue(0)\n{}\n\nCounter::Counter(int newValue):\nvalue(newValue)\n\
  {}\n\nint main()\n{\n    int beta = 5;\n    Counter alpha = beta;\n    std::cout\
  \ << \"alpha: \" << alpha.getValue() << std::endl;\n    return 0;\n}\n```\n\n此代码成功编译并产生以下输出：\n\
  alpha: 5\n\n重要的变化在第 8 行，那里构造函数被重载以接受一个 `int`；在第 19–21 行，那里构造函数得到了实现。该构造函数的作用是从 `int`\
  \ 创建一个 `Counter` 对象。由于有了这个构造函数，编译器知道在第 26 行将整数赋值给 `Counter` 对象时调用它。\n\n#### int()\
  \ 运算符\n\n上一个项目演示了如何将内置类型赋值给对象。也可以将对象赋值给内置值，这部分代码尝试了这一点：\n\n点击此处查看代码图像\n\n```cpp\n\
  Counter gamma(18);\nint delta = gamma;\ncout << \"delta : \" << \"\\n\";\n```\n\n\
  如果将这段代码添加到 `Counter6` 程序中，它将无法成功编译。该类知道如何从整数创建 `Counter`，但不知道如何反过来从 `Counter` 创建整数。\n\
  \nC++ 提供了转换运算符，可以将其添加到类中以指定如何进行到内置类型的隐式转换。Listing 15.8 中的 `Counter7` 程序阐明了这一点。\n\
  \n#### LISTING 15.8 `Counter7.cpp` 的全文\n\n点击此处查看代码图像\n\n```cpp\n#include <iostream>\n\
  \nclass Counter\n{\npublic:\n    Counter();\n    ~Counter() {}\n    Counter(int\
  \ newValue);\n    int getValue() const { return value; }\n    void setValue(int\
  \ newValue) { value = newValue; }\n    operator unsigned int();\nprivate:\n    int\
  \ value;\n};\n\nCounter::Counter():\nvalue(0)\n{}\n\nCounter::Counter(int newValue):\n\
  value(newValue)\n{}\n\nCounter::operator unsigned int()\n{\n    return (value);\n\
  }\n\nint main()\n{\n    Counter epsilon(19);\n    int zeta = epsilon;\n    std::cout\
  \ << \"zeta: \" << zeta << std::endl;\n    return 0;\n}\n```\n\n此程序产生以下输出：\nzeta:\
  \ 19\n\n在第 11 行声明了转换运算符。注意它没有返回值。该函数的实现在第 24–27 行。第 26 行返回对象成员变量 `value` 的值。函数返回的整数与声明中的类型匹配。现在编译器知道如何将整数转换为\
  \ `Counter` 对象反之亦然，因此它们可以自由赋值。\n\n注意转换运算符没有指定返回值，尽管它们确实返回了转换后的值。\n\n### 总结\n\n运算符重载是\
  \ C++ 语言最强大的特性之一。通过在你设计的类中中定义运算符的行为，你使得操作这些类的对象变得更加容易。\n\nC++ 中几乎所有的运算符都可以重载。\n\n\
  正如你在处理内置类型时所看到的，使用运算符操作对象比调用成员函数要容易得多。它还能让程序更易理解。\n\n这当然假设重载运算符的行为与它们在内置类型上的工作方式是一致的。\n\
  \n### 答\n\n**问：在可以创建成员函数的情况下，为什么要重载运算符？**\n\n答：当运算符的行为被良好理解时，使用重载运算符更容易。完成相同任务所需的代码更少，并且你的类可以模拟内置类型的功能。\n\
  \n**问：拷贝构造函数和赋值运算符之间的区别是什么？**\n\n答：拷贝构造函数创建一个与现有对象相同值的新对象。赋值运算符修改现有对象，使其具有另一个对象的相同值。\n\
  \n\n\n\n\n## Q. 后置运算符中使用的 `int` 会发生什么呢？\n\n**A.** 什么都没有发生。那个 `int` 从没有被使用过，仅作为重载后置和前缀运算符的标记位。\n\
  \n## Q. Alanis Morissette 在《You Oughta Know》中唱道的那位前男友是谁？\n\n**A.** 这首收自她 1995 年专辑\
  \ *Jagged Little Pill* 的、极具煽动性的分手歌曲曾获得榜单冠军，销量超过 3300 万份，它描写的是她曾经交往过的一个真实人物。Morissette\
  \ 在采访中承认了这一点，但从未公开确认过那个人的身份。\n\n媒体中的头号嫌疑人是演员 Dave Coulier，他曾在情景剧《全福》（*Full House*）及其\
  \ 2016 年版《友爱》（*Fuller House*）中饰演 Joey。他在专辑发布前不久与 Morissette 分手。\n\n2008 年，Coulier\
  \ 告诉《卡尔加里侍报》（*Calgary Herald*）那首歌是关于他的。在描述第一次在电台听到这首歌时的感受时，Coulier 透露：“我说：‘哇，这个女孩很生气。’接着我说：‘噢天呐，我想那是\
  \ Alanis。’我一遍又一遍地听这首歌，然后我说：‘我觉得我真的伤害这个人了。’”\n\n她本该知道的。\n\n## 工作坊\n\n现在你已经学习了如何重载运算符，可以回答几个问题并做几个练习来巩固这一节课的知识。\n\
  \n### 测验\n\n**1.** 为什么你不能创建像 `**` 这样用于幂的完全新运算符？\n\n**A.** 该运算符不是语言的一部分。\n**B.**\
  \ 因为它使用了已有的运算符 `*`。\n**C.** 你的问题前提是值得怀疑的。你可以创建新运算符。\n\n**2.** 为什么前缀和后置递减操作的重载语法是不同的？\n\
  \n**A.** 因为前缀和后置返回的值不同\n**B.** 因为一个使用 `++`，而另一个使用 `––`\n**C.** 语法并没有不同。\n\n**3.**\
  \ 转换运算符的作用是什么？\n\n**A.** 将对象转换为内置类型\n**B.** 将内置类型转换为对象\n**C.** a 和 b 都是\n\n### 答案\n\
  \n**1. A.** 添加诸如 `**` 这样的新运算符需要修改编译器，因为 `**` 并不是语言的一部分，所以编译器不知道该如何处理它。\n\n**2. A.**\
  \ 行为完全取决于 `++` 或 `––` 运算符出现在变量的之前还是之后，因此代码必须遵循相同的行为。从技术上讲，它并不非模拟这种行为，但你类的用户会期望它是那样工作的。\n\
  \n**3. A.** 它们将对象类型转换为内置类型。\n\n### 活动\n\n**1.** 修改赋值程序（Listing 15.6）以重载相等运算符（`==`）。使用该运算符比较两个\
  \ `Tricycle` 对象的速度。\n\n**2.** 修改 Counter2 程序（Listing 15.5）也重载减法运算符，并使用它执行简单的减法。\n\
