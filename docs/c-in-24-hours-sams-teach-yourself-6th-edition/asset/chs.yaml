  \ Functions）\n\n`Dog` 对象可以访问 `Mammal` 类中所有的成员函数，以及 `Dog` 类声明可能添加的任何成员函数（例如 `wagTail()`）。它还可以重写基类函数。重写函数意味着派类实现类当你创建一个派生类对象时，会调用正确的函数。\n\
  \n当派生类创建一个与基类成员函数具有相同返回类型和签名的成员函数，但具有新的实现时，被称为重写了该函数。\n\n当你重写一个函数时，它在返回类型和签名上必须与基类中的函数一致。签名是指除返回类型以外的函数原型：即函数名、参数列表以及如果使用了\
  \ `const` 关键字。\n\n函数的签名是它的名称以及参数的数量和类型。签名不包括返回类型。\n\n`Mammal5` 程序（列表 16.5）说明了当 `Dog`\
  \ 类重写 `Mammal` 类中的 `speak()` 成员函数时会发生什么。为了节省空间，这些类中省略了访问器函数。\n\n**列表 16.5** `Mammal5.cpp`\
  \ **全文**\n\n点击此处查看代码图片\n\n***\n\n```cpp\n1: #include <iostream>\n2:\n3: enum BREED\
  \ { YORKIE, CAIRN, DANDIE, SHETLAND, DOBERMAN, LAB };\n4:\n5: class Mammal\n6: {\n\
  7: public:\n8:      // 构造函数\n9:      Mammal() { std::cout << \"Mammal constructor\
