  \n***\n\n此程序产生以下输出，反映了初始速度为 5 mph 的点击此处查看代码图像：\n\nPedaling; tricycle speed 6 mph\n\
  Pedaling; tricycle speed 7 mph\nBraking; tricycle speed 6 mph\nBraking; tricycle\
  \ speed 5 mph\nBraking; tricycle speed 4 mph\n\n8.2 中的 `Tricycle` 类定义包含以下新增：\n-\
  \ `Tricycle::Tricycle(int initialSpeed)` 构造函数（17-20 行）。\n- `Tricycle::~Tricycle()`\
  \ 析构函数（23-26 行）。\n- `Tricycle::getSpeed()` 方法（29-32 行）。\n- `Tricycle::setSpeed(int\
  \ newSpeed)` 方法（35-41 行）。\n- `Tricycle::pedal()` 方法（44-48 行）。\n- `Tricycle::brake()`\
  \ 方法（51-55 行）。\n\n### 总结\n\n在 OOP 中，程序由对象组成，对象拥有数据和函数。数据存储在成员变量中，函数对数据进行操作。编译器提供的默认构造函数不执行任何操作；默认构造函数是任何不带参数的构造函数。你可以自己定义它，也可以由编译器提供一个默认的构造函数。如果你定义了任何构造函数（无论是否带参数），编译器都不会为你提供默认构造函数。在这种情况下，如果你想要默认构造函数，就必须自己定义它。如果你没有定义析构函数，编译器也会提供一个，该析构函数的函数体为空且什么都不做。如果你定义了构造函数，即使你的析构函数什么都不做，定义一个析构函数也是一个良好的习惯。这有助于你记住在需要采取显式步骤释放内存时使用析构函数。\n\
  \n### 工作坊\n\n现在你已经学习了类和对象，可以回答一些问题并完成一些练习。\n\n#### 测验\n\n1. **下列哪项不内存？**\n   - A.\
  \ 类\n   - B. 对象\n   - C. 两者\n\n2. **哪个关键字防止某些成员数据和函数在类外部使用？**\n   - A. `public`\n\
  \   - B. `private`\n   - C. 都不是\n\n3. **为什么作者的父母在他四岁时留下了自行车？**\n   - A. 冷漠\n   -\
  \ B. 搬运车空间不足\n   - C. 因为逆境塑造性格\n\n#### 答案\n\n1. **A.** 类不占用内存，因为它只是对创建对象的定义。对象是类的实现。\n\
  2. **B.** 私有数据和函数只能在类内部访问。公共数据和函数可以在类外部访问。你通常希望将所有的类数据项设为私有，并将函数设为公共。\n3. **B.**\
  \ 他们租的 U-Haul 货车空间不足。我听说在到达达拉斯后不久收到了一辆新自行车，但我并不记得了。\n\n#### 活动\n\n1. 修改 `Tricycle`\
  \ ，添加第二辆自行车。给它一个初始值，并尝试调用它的 `pedal()` 和 `brake()` 成员函数。\n2. 修改 `NewTricycle` ，添加一个名为\
  \ `wheelSize` 的成员变量，当使用访问器设置时其值至少为 4。\n\n\n\n\n要查看这些活动的解决方案，请访问本书的网站：[`cplusplus.cadenhead.org`](http://cplusplus.cadenhead.org)。\n\
  \n# 第 9 小时：进入高级类\n\n在本小时中你将学习到：\n\n![Image](img/00002.jpeg) 什么是`const 成员函数`\n\n\
  ![Image](img/00002.jpeg) 如何将类的接口与其实现分离\n\n![Image](img/00002.jpeg) 如何管理你的类\n\n![Image](img/00002.jpeg)\
  \ 如何发现并避免错误\n\n### const 成员函数\n\n如果你使用 `const` 关键字将成员函数声明为常量函数，则表示该函数不会改变类中任何成员变量的值。要将函数声明为常量函数，请在括号之后写上\
  \ `const` 关键字，如下例所示：\n\n```cpp\nvoid displayPage() const;\n```\n\n用于获取变量值的访问器（也称为\
  \ getter 函数）通常是常量函数。上一节课中的 `Tricycle` 类有两个访问器：\n\n```cpp\nvoid setSpeed(int newSpeed);\n\
  int getSpeed();\n```\n\n`setSpeed()` 函数不能是 `const` 的，因为它改变了成员变量 `speed`。相反，`getSpeed()`\
  \ 函数可以是 `const` 的，因为它完全没有改变类。它只是简单返回成员变量 `speed` 的当前值。因此，函数的声明可以变为：\n\n```cpp\n\
  int getSpeed() const;\n```\n\n如果你将一个函数声明为 `const`，但该函数的实现通过改变其任何成员的值来改变对象，那么编译器将将其标记为错误。\n\
  \n尽可能将许多函数声明为 `const` 是一种良好的编程习惯。当你这样做时，可以让编译器捕获对成员变量的意外修改，而不是让这些错误在程序运行时才出现。\n\n\
  ### 接口与实现\n\n创建和使用对象的程序部分是类的客户端。类声明是与这些客户端的一份合同。合同告诉客户端类拥有哪些可用数据以及该类能做什么。\n\n例如，在\
  \ `Tricycle` 类的声明中，你在合同中承诺每个 `Tricycle` 对象都能获取其速度，你可以在构造时初始化速度，并在之后设置或获取速度，并且每个\
  \ `Tricycle` 都知道如何 `pedal()`（踩板）和 `brake()`（刹车）。\n\n如果你将 `getSpeed()` 设为 `const`\
  \ 函数，合同还承诺它不会改变在该函数中被调用的 `Tricycle` 对象。\n\n## 类声明与函数定义的组织\n\n在 C++ 程序的源代码中，类的定义通常与它们的实现分离。你为类声明的每个函数都必须有一个定义。与函数一样，类函数的定义也有函数头和函数体。\n\
  \n定义必须位于编译器可以找到的文件中。大多数 C++ 编译器期望该文件以 `.cpp` 结尾。\n\n虽然你可以将声明放在源代码文件中，但大多数程序员采用的惯例是将声明放在一个与相同同名的头文件中，文件扩展名为\
  \ `.hpp`（或者较少情况下使用 `.h` 或 `.hp`）。\n\n因此，如果你将 `Tricycle` 类的声明放在名为 `Tricycle.hpp`\
  \ 的文件中，那么类函数的定义将位于 `Tricycle.cpp` 中。可以使用预处理器指令将头文件包含到 `.cpp` 文件中\n\n```cpp\n#include\
  \ \"Tricycle.hpp\"\n```\n\n将它们分离的原因是类的客户端并不关心实现的具体细节。它们需要知道的一切都在头文件中。\n\n### 内联实现\n\
  \n就像你可以告诉编译器将普通函数内联（inline）处理一样，你也可以让成员函数变为内联。`inline` 关键字出现在返回值之前，如下例所示：\n\n```cpp\n\
  inline int Tricycle::getSpeed()\n{\n    return speed;\n}\n```\n\n你也可以将函数的定义放在类的声明中，这会自动使该函数变为内联。这是一个示例：\n\
  \n```cpp\nclass Tricycle\n{\npublic:\n    int getSpeed() const { return speed; }\n\
  \    void setSpeed(int newSpeed);\n};\n```\n\n`getSpeed()` 的定义发生了变化。在 `const` 关键字之后不是分号，而是大括号内的一段短代码。内联函数的体紧接在成员函数的声明之后开始；括号后没有分号。空格不影响，所以声明可以格式化为：\n\
  \n```cpp\nclass Tricycle\n{\npublic:\n    int getSpeed() const\n    {\n        return\
  \ speed;\n    }\n    void setSpeed(int newSpeed);\n};\n```\n\n`9.1` 和 `9.2` 重新创建了\
  \ `Tricycle` 类，将声明移动到 `Tricycle.hpp`，并将函数的实现移动到 `Tricycle.cpp`。`Listing 9.1` 还将\
  \ `getSpeed()` 访问器以及 `pedal()` 和 `brake()` 函数改为内联。\n\n### 列表 9.1 Tricycle.hpp 的全文\n\
  ```cpp\n#include <iostream>\n\nclass Tricycle\n{\npublic:\n    Tricycle(int initialSpeed);\n\
  \    ~Tricycle();\n    int getSpeed() const { return speed; }\n    void setSpeed(int\
  \ speed);\n    void pedal()\n    {\n        setSpeed(speed + 1);\n        std::cout\
  \ << \"Pedaling \" << getSpeed() << \" mph\\n\";\n    }\n    void brake()\n    {\n\
  \        setSpeed(speed - 1);\n        std::cout << \"Pedaling \" << getSpeed()\
  \ << \" mph\\n\";\n    }\nprivate:\n    int speed;\n};\n```\n\n### 列表 9.2 Tricycle.cpp\
  \ 的全文\n```cpp\n#include \"Tricycle.hpp\"\n\n// 对象的构造函数\nTricycle::Tricycle(int initialSpeed)\n\
  {\n    setSpeed(initialSpeed);\n}\n\n// 对象的析构函数\nTricycle::~Tricycle()\n{\n    //\
  \ 什么都不做\n}\n\n// 设置自行车的速度\nvoid Tricycle::setSpeed(int newSpeed)\n{\n    if (newSpeed\
  \ >= 0)\n        speed = newSpeed;\n}\n\n// 创建三辆车并骑行\nint main()\n{\n    Tricycle\
  \ wichita(5);\n    wichita.pedal();\n    wichita.pedal();\n    wichita.brake();\n\
  \    wichita.brake();\n    wichita.brake();\n    return 0;\n}\n```\n\nPedaling 6\
  \ mph\nPedaling 7 mph\nPedaling 6 mph\nPedaling 5 mph\nPedaling 4 mph\n\n`getSpeed()`\
  \ 函数在 `Listing 9.1` 的第 8 行声明，并提供了其内联实现。`Listing 9.2` 的第 1 行是在源代码中包含头文件 `Tricycle.hpp`\
  \ 的预处理器指令。\n\n### 以其他类作为成员数据的类\n\n通过声明简单的类并将其包含在更复杂的类的声明中来构建复杂的类并不罕见。\n\n例如，你可能会声明\
  \ `Wheel`、`Motor`、`Transmission` 等类，然后将它们组合到 `Car` 类中。这种安排声明了“拥有”关系：汽车拥有一个发动机，有一组轮子，还有一个变速箱。\n\
  \n考虑第二个例子。矩形由四条线组成。每条线由两个点定义。每个点由 x 和 y 坐标定义。`Listing 9.3` 显示了 `Rectangle` 类的完整声明，就像它可能出现在\
  \ `Rectangle.hpp` 中一样。\n\n\n\n\n\n由于矩形被定义为连接四个点的四条线，而每个点对应图上的一个坐标，因此首先声明一个 `Point`\
  \ 类来存储每个点的 `x` 和 `y` 坐标。列表 9.4 显示了这两个类的完整声明。\n\n### 列表 9.3 `Rectangle.hpp` 的完整文本\n\
  \n点击此处查看代码图片\n\n```cpp\n1: #include <iostream>\n2:\n3: class Point\n4: {\n5:   \
  \  // 无构造函数，使用默认的\n6: public:\n7:     void setX(int newX) { x = newX; }\n8:    \
  \ void setY(int newY) { y = newY; }\n9:     int getX() const { return x; }\n10:\
  \     int getY() const { return y; }\n11: private:\n12:     int x;\n13:     int\
  \ y;\n14: };\n15:\n16: class Rectangle\n17: {\n18: public:\n19:     Rectangle(int\
  \ newTop, int newLeft, int newBottom, int newRight);\n20:     ~Rectangle() {}\n\
  21:\n22:     int getTop() const { return top; }\n23:     int getLeft() const { return\
  \ left; }\n24:     int getBottom() const { return bottom; }\n25:     int getRight()\
  \ const { return right; }\n26:\n27:     Point getUpperLeft() const { return upperLeft;\
  \ }\n28:     Point getLowerLeft() const { return lowerLeft; }\n29:     Point getUpperRight()\
  \ const { return upperRight; }\n30:     Point getLowerRight() const { return lowerRight;\
  \ }\n31:\n32:     void setUpperLeft(Point location);\n33:     void setLowerLeft(Point\
  \ location);\n34:     void setUpperRight(Point location);\n35:     void setLowerRight(Point\
  \ location);\n36:\n37:     void setTop(int newTop);\n38:     void setLeft (int newLeft);\n\
  39:     void setBottom (int newBottom);\n40:     void setRight (int newRight);\n\
  41:\n42:     int getArea() const;\n43:\n44: private:\n45:     Point upperLeft;\n\
  46:     Point upperRight;\n47:     Point lowerLeft;\n48:     Point lowerRight;\n\
  49:     int top;\n50:     int left;\n51:     int bottom;\n52:     int right;\n53:\
  \ };\n```\n\n### 列表 9.4 `Rectangle.cpp` 的完整文本\n\n点击此处查看代码图片\n\n```cpp\n1: #include\
  \ \"Rectangle.hpp\"\n2:\n3: Rectangle::Rectangle(int newTop, int newLeft, int newBottom,\
  \ int newRight)\n4: {\n5:     top = newTop;\n6:     left = newLeft;\n7:     bottom\
  \ = newBottom;\n8:     right = newRight;\n9:\n10:     upperLeft.setX(left);\n11:\
  \     upperLeft.setY(top);\n12:\n13:     upperRight.setX(right);\n14:     upperRight.setY(top);\n\
  15:\n16:     lowerLeft.setX(left);\n17:     lowerLeft.setY(bottom);\n18:\n19:  \
  \   lowerRight.setX(right);\n20:     lowerRight.setY(bottom);\n21: }\n22:\n23: void\
  \ Rectangle::setUpperLeft(Point location)\n24: {\n25:     upperLeft = location;\n\
  26:     upperRight.setY(location.getY());\n27:     lowerLeft.setX(location.getX());\n\
  28:     top = location.getY();\n29:     left = location.getX();\n30: }\n31:\n32:\
  \ void Rectangle::setLowerLeft(Point location)\n33: {\n34:     lowerLeft = location;\n\
  35:     lowerRight.setY(location.getY());\n36:     upperLeft.setX(location.getX());\n\
  37:     bottom = location.getY();\n38:     left = location.getX();\n39: }\n40:\n\
  41: void Rectangle::setUpperRight(Point location)\n42: {\n43:     upperRight = location;\n\
  44:     upperLeft.setY(location.getY());\n45:     lowerRight.setX(location.getX());\n\
  46:     top = location.getY();\n47:     right = location.getX();\n48: }\n49:\n50:\
  \ void Rectangle::setLowerRight(Point location)\n51: {\n52:     lowerRight = location;\n\
  53:     lowerLeft.setY(location.getY());\n54:     upperRight.setX(location.getX());\n\
  55:     bottom = location.getY();\n56:     right = location.getX();\n57: }\n58:\n\
  59: void Rectangle::setTop(int newTop)\n60: {\n61:     top = newTop;\n62:     upperLeft.setY(top);\n\
  63:     upperRight.setY(top);\n64: }\n65:\n66: void Rectangle::setLeft(int newLeft)\n\
  67: {\n68:     left = newLeft;\n69:     upperLeft.setX(left);\n70:     lowerLeft.setX(left);\n\
  71: }\n72:\n73: void Rectangle::setBottom(int newBottom)\n74: {\n75:     bottom\
  \ = newBottom;\n76:     lowerLeft.setY(bottom);\n77:     lowerRight.setY(bottom);\n\
  78: }\n79:\n80: void Rectangle::setRight(int newRight)\n81: {\n82:     right = newRight;\n\
  83:     upperRight.setX(right);\n84:     lowerRight.setX(right);\n85: }\n86:\n87:\
  \ int Rectangle::getArea() const\n88: {\n89:     int width = right - left;\n90:\
  \     int height = top - bottom;\n91:     return (width * height);\n92: }\n```\n\
  \n\n\n\n\n通过查看 Listing 9.3 中的头文件（该文件包含了 `Rectangle` 类的声明），程序员知道 `getArea()` 返回一个\
  \ `int`。`getArea()` 如何实现这一点的对于 `Rectangle` 类的用户并不重要。事实上，`Rectangle` 的作者可以更改该函数而不影响使用\
  \ `Rectangle` 类的程序。\n\n## 总结\n\nC++ 程序员完全可以不使用类或对象。程序可以仅由变量和函数组成，从而无需掌握面向对象编程的复杂概念。\n\
  \n很少有程序员选择这条路线。为什么？因为如果你将程序设计为一组相互作用的类，你的效率会高得多。\n\n开发类使得代码更具重用性。如果一个程序中有用的对象在另一个程序中也有用，那么该类就可以重用。文字处理器的\
  \ `Spellchecker` 类可以被添加到网络浏览器或其他任何用户编写文本的工具中。检查检查对象的功能在任何程序中的工作方式都是相同的。\n\n类还让代码更加可靠。程序所需的任务与完成这些工作所需的数据封装在一起。将程序视为一组每个执行特定任务的对象，工作被分散并组织了起来。当问题出现时，更容易确定发生错误的类。\n\
  \n## 问答\n\n**Q. 如果使用 const 函数来更改类可能会导致编译器错误，为什么我不直接去掉 const 这个单词并确保避免错误呢？**\n\n\
  **A.** 如果你的函数在逻辑上不应该改变类，那么使用 `const` 关键字是让编译器帮助你发现愚蠢错误的好方法。例如，考虑如果 `getSpeed()`\
  \ 函数有这一行会发生什么：\n\n点击此处查看代码图像\n\n```cpp\nif (speed = 100) std::cout << “Maximum speech\
  \ reached\\n”;\n```\n\n这段代码包含一个错误，如果 `getSpeed()` 函数被声明为 `const`，编译器将会捕捉到它。该语句本应检查\
  \ `speed` 是否等于 `100`，却意外地将值 `100` 赋值给了成员变量。（误用了赋值运算符 `=` 而不是相等运算符 `==`）。因为这种赋值在常量函数中改变了类，编译器将发现这个错误。\n\
  \n这种错误很难通过通过扫描代码来找到——眼睛往往只能看到它想看到的东西。更重要的是，程序可能看起来运行正常，但 `speed` 现在被设置为了一个错误的数字。\n\
  \n**Q. 考虑到昆虫是令人作呕的甜点原料，“蚱冰淇淋”是如何得名的？**\n\n**A.** 归咎于新奥尔良的一种饮料吧。\n\n“grasshopper”（蚱）一词一直被用来描述几种不同的绿色食物和液体，包括甜点、派点和鸡尾酒。如果你去酒吧点了一份“grasshopper”，你将得到一种深绿色的饮料，带有薄荷利酒（crème\
  \ de menthe）、可可酒（crème de cacao）和鲜奶油的调味。\n\n蚱派是由奥利奥 饼干、融化的棉花糖、薄荷利酒、可可酒和打发奶油制成的。\n\
  \n蚱奶昔和冰淇淋是用带有薄荷酒味的薄荷冰淇淋制成的。\n\n所有这些“蚱”的源头都是 Tujague's，新奥尔良第二老老的餐厅，也是这种鸡尾酒首次调制的地方。当\
  \ Philibert Guichet 在 1919 年发明这种饮料时，他选择这个名字是因为它那种“蚱绿”颜色。\n\n## 工作坊\n\n在这一小时中，你对类有了更多的了解，现在是时候你回答几个问题并做几个练习来巩固你的知识了。\n\
  \n### 测验\n\n**1.** 下列哪个不是 C++ 头文件的常见文件名后缀？\n\n**A.** `.hpp`\n**B.** `.cpp`\n**C.**\
  \ `.h`\n\n**2.** 如果没有定义 `Point` 类，在 `Rectangle.cpp` 和 `Rectangle.hpp` 中会发生什么？\n\n\
  **A.** 发生编译器错误。\n**B.** 程序运行不正确。\n**C.** 结果不异。\n\n**3.** 你可以在哪里让类函数内联（inline）执行？\n\
  \n**A.** 在类声明中\n**B.** 在类实现中\n**C.** 两者都是\n\n### 答案\n\n**1. B.** C++ 头文件通常以 `.hpp`\
  \ 结尾（较少见的是 `.h`）。C++ 程序以 `.cpp` 结尾。\n\n**2. A.** 假设 `Point` 在其他地方没有定义，编译器会报告关于未定义引用的错误。类依赖其他类并在此基础上进行构建是很常见的。\n\
  \n**3. C.** 自动包含在类声明中的类函数是内联函数。否则，类函数必须包含 `inline` 关键字以请求该方法内联执行以获得更快的性能。\n\n###\
  \ 活动\n\n**1.** 将 `Point` 类从 `Rectangle.hpp` 分离到单独的头文件中，并在 `Rectangle.hpp` 中包含它。这如何改变\
  \ `Rectangle.cpp` 的编译？\n\n**2.** 创建一个由两个点组成的 `Line` 类。要查看解决方案，请访问：[`cplus.org`](http://cplus.org)。\n\
  \n# 第三部分：内存管理\n\n## 第 10 小时：创建指针\n\n### 你在本小时将学习：\n\n* 指针是什么\n* 如何声明和使用\n* 什么是堆\n\
  \n### 理解指针及其用法\n\nC++ 可用的强大工具之一是指针。这种力量是有代价的：指针是 C++ 中最困难的部分之一。变量是一个可以存储值的对象。整数持有数字。字符持有字母。那么地址是什么？为了完全理解这一点，你必须了解内存。计算机内存分为顺序编号的位置。每个位置都是地址。不同的计算机使用不同的方案。通常，程序员不需要知道给定变量的具体地址，因为编译器会处理细节。如果你需要这些信息，可以使用地址运算符\
  \ `&`，它在 Listing 10.1 的 `Addresser` 程序中演示。\n\n**列表 10.1 `Addresser.cpp` 的全文**\n\n\
  ```cpp\n#include <iostream>\n\nint main()\n{\n    unsigned short shortVar = 5;\n\
  \    unsigned long longVar = 65535;\n    long sVar = –65535;\n\n    std::cout <<\
  \ \"shortVar:\\t\" << shortVar;\n    std::cout << \"\\tAddress of shortVar:\\t\"\
  \ << &shortVar << \"\\n\";\n    std::cout << \"longVar:\\t\" << longVar;\n    std::cout\
  \ << \"\\tAddress of longVar:\\t\" << &longVar << \"\\n\";\n    std::cout << \"\
  sVar:\\t\\t\" << sVar;\n    std::cout << \"\\tAddress of sVar:\\t\" << &sVar <<\
  \ \"\\n\";\n\n    return 0;\n}\n```\n\nAddresser 输出如下所示：\n\n```text\nshortVar: \
  \       5\nAddress of shortVar:     0x60fe9e\nlongVar:        65535\nAddress of\
  \ longVar:     0x60fe98\nsVar:           -65535\nAddress of sVar:     0x60fe9c\n\
  ```\n\n\n\n\n\n`longVar: 65535 Address of longVar: 0x60fe98`\n`sVar: -65535 Address\
  \ of sVar: 0x60fe94`\n\n每个指针的实际地址会有所不同，因为每台计算机存储变量的位置不同，这取决于内存中其他内容以及可用内存的大小。\n\n\
  ***\n\n### Note\n\nListing 10.1 第 9–14 行中的特殊字符 `\\t` 会在输出中插入一个制表符。这是创建列的一种简单方法。除了换行符\
  \ `\\n` 之外，还有其他此类字符。\n\n`\\\\` 字符用于显示反斜杠。\n\n`\\\"` 字符用于显示双引号。\n\n`\\'` 字符用于显示单引号。\n\
  \n***\n\n声明并初始化了三个变量：第 5 行的 `short`、第 6 行的 `unsigned long` 以及第 7 行的 `long`。在第 9–14\
  \ 行中，使用地址运算符 `&` 显示它们的值和地址。\n\n`shortVar` 的值为 `5`（如预期），其地址为 0x60fe9e。这个复杂的地址是计算机特定的，并且每次运行程序时都会略有变化。你的结果将所不同。然而，不变的是，如果你的计算机使用四字节的\
  \ `short` 整数，那么前两个地址之间的差是四个字节。如果你的计算机使用四字节的 `long` 整数，那么第二个和第三个地址之间的差是四个字节。图 10.2\
  \ 展示了程序中的变量将如何存储在内存中。（注意，在某些计算机上，取决于编译器的配置，两者的差都将四个字节。）\n\n![Image](img/00011.jpeg)\n\
  \n**图 10.2** 变量存储说明。\n\n没有理由需要知道每个变量地址的实际数值。你关心的是每个变量都有一个地址，并且预留了足够的内存。\n\n编译器是如何知道每个变量需要多少内存的？你通过声明变量类型来告诉编译器为变量分配多少内存。\n\
  \n因此，如果你将变量声明为 `unsigned long` 类型，编译器就知道要分配四个字节的内存，因为每个 `unsigned long` 占用四个字节。编译器负责分配实际地址。\n\
  \n当分配一个指针时，编译器会在你的硬件和操作系统环境中分配足够的内存来存储一个地址。指针的大小可能与整数的大小相同，也可能不同，因此请确保不要做任何假设。\n\
  \n### 在指针中存储地址\n\n每个变量都有一个地址。即使不知道给定变量的具体地址，你也可以将该地址存储在指针中。\n\n例如，假设变量 `howOld`\
  \ 是整数。为了声明一个名为 `pAge` 的指针来持有它的地址，你编写了以下语句：\n\n```cpp\nint *pAge = nullptr;\n```\n\
  \n这声明 `pAge` 为一个指向 `int` 的指针。也就是说，`pAge` 被声明为持有一个 `int` 的地址。\n\n指针可以使用任何对其他变量合名称。本书遵循的命名约定，即所有指针都以字母\
  \ `p` 开头，第二个字母大写，例如 `pAge` 或 `pHeap`。\n\n注意，`pAge` 是一个和其他变量无一样的变量。当你声明一个整数变量时，它被配置为存储一个整数。当你声明像\
  \ `pAge` 这样的指针变量时，它被配置为存储一个地址。指针只是一种特殊的变量类型，它持有内存中对象的地址；在这种情况下，`pAge` 持有一个整数变量的地址。\n\
  \n你声明你想要指针指向的变量类型。这告诉编译器如何处理指针所指位置的内存。指针本身本身包含一个地址。\n\n在这个示例中，`pAge` 初始化为 `nullptr`，这在\
  \ C++ 中表示一个地址指向空无的指针。具有此值的指针被称为*空指针*（null pointer）。所有指针在创建时都应该被初始化为某些值。如果你不知道想给指针分配什么值，请赋值为\
  \ `nullptr`。未初始化的指针被称为*野指针*（wild pointer）。野指针是危险的，因为当使用指针时，它们会导致程序产生不可预测的结果。\n\n\
  你可能还会看到指针初始化为 0，如下所示：\n\n```cpp\nint *pAge = 0;\n```\n\n结果应该与初始化为 `nullptr` 相同，但从技术上讲，0\
  \ 是一个整数常量。\n\n***\n\n### Tip\n\n在早期版本的 C++ 中，没有 `nullptr`。你会用 `0` 或 `NULL` 代替。\n\
  \n***\n\n如果你将指针初始化为 `nullptr`，则必须使用地址运算符 `&`。以下是相关代码：\n\n```cpp\nint howOld = 50;\
  \ // 创建变量 howOld\nint *pAge = nullptr; // 创建指向 howOld 的指针\npAge = &howOld; // 分配\
  \ howOld 的地址\n```\n\n第一行创建一个变量 `howOld`，其类型为 `unsigned int`，并将其初始化为 `5`。第二行声明 `pAge`\
  \ 为指向 `unsigned int` 的指针并将其初始化为 `nullptr`。第三行将 `howOld` 的地址分配给 `pAge`。\n\n等待，提供的文本提到：`howOld`\
  \ 是指针是因为地址运算符 `&`。让我们对齐逻辑：\n\n```cpp\nint howOld = 50; // 创建变量 howOld\nint *pAge\
  \ = nullptr; // 创建指向 howOld 的指针\npAge = &howOld; // 分配 howOld 的地址\n```\n\n第一行创建一个变量\
  \ `howOld`，其类型为 `unsigned int`，并将其初始化为 `50`。第二行声明 `pAge` 为指向 `unsigned int` 的指针并将其初始化为\
  \ `nullptr`。第三行将 `howOld` 的地址分配给 `pAge`。（原文中关于类型和地址运算符的描述有些重复/混乱，但我保留了代码块的核心逻辑）。\n\
  \n### 间接运算符，或间接使用指针\n\n间接运算符 `*` 也称为解引用运算符（dereference operator）。当指针被解引用时，会获取指针所存储地址的值。考虑以下语句以将一个变量的值赋值给另一个：\n\
  \n```cpp\nunsigned short howOld = 50;\nunsigned short yourAge;\nyourAge = howOld;\n\
  ```\n\n指针提供了对其存储地址变量值的间接访问。通过指针 `pAge` 将 `howOld` 的值赋值给新变量 `yourAge`，你编写如下：\n\n\
  ```cpp\nunsigned short howOld = 50; // 创建变量 howOld\nunsigned short *pAge = &howOld;\
  \ // 创建指向 howOld 的指针\nyourAge = *pAge; // 将 howOld 的值赋值给 yourAge\n```\n\n\n\n\n\n\
  ```cpp\nunsigned short int yourAge; // 创建另一个变量\n\nyourAge = *pAge; // 将 pAge 处的值\
  \ (50) 赋值给 yourAge\n```\n\n变量 `pAge` 前面的间接运算符 `*` 意味着“存储在……的值”。这条赋值语句的意思是：“获取存储在\
  \ `pAge` 地址的值，并将其赋值给 `yourAge`。”另一种思考方式是“不要影响指针本身，而要影响指针地址处存储的项目。”\n\n***\n\n###\
  \ 注意\n\n间接运算符 `*` 在指针中有两种截然不同的用法：声明和解引用。当声明一个指针时，星号表示它是一个指针，而不是一个普通变量。例如：\n\n点击此处查看代码图片\n\
  \n```cpp\nunsigned short *pAge = nullptr; // 创建一个指向无符号短型的指针\n```\n\n当对指针进行解引用时，间接运算符表示要访问指针所存储的内存位置的值，而不是地址本身：\n\
  \n点击此处查看代码图片\n\n```cpp\npAge = 5; // 将 5 赋值给 pAge 的的值\n```\n\n另外请注意，同一个字符 (`*`)\
  \ 也用作乘法运算符。编译器根据上下文判断调用哪个运算符。\n\n***\n\n我们在日常生活中一直在处理间接性。如果你想给一个朋友打电话，你会在手机的联系人列表中选择他们的名字（或告诉手机拨打那个号码）。名字是实际电话号码的引用，手机会拨打该号码。当你这样做时，你就在依赖于间接性。\n\
  \n#### 指针、地址和变量\n\n区分指针、指针所持有的地址以及指针所持地址处的值是非常关重要的。这是许多关于指针的困惑的根源。\n\n考虑以下代码段：\n\
  \n```cpp\nint theVariable = 5;\n\nint *pPointer = &theVariable;\n```\n\n`theVariable`\
  \ 被声明为整数变量，并初始化值为 5。`pPointer` 被声明为指向整数的指针；它被初始化为 `theVariable` 的地址。`pPointer` 持有的地址是\
  \ `theVariable` 的地址。`pPointer` 所持地址处的值是 5。图 10.3 显示了 `theVariable` 和 `pPointer`\
  \ 的示意图。\n\n![图像](img/00012.jpeg)\n\n**图 10.3** 内存的示意图。\n\n#### 使用指针操作数据\n\n在指针赋值了变量的地址后，你可以可以使用该指针访问该变量中的数据。列表\
  \ 10.2 中的 `Pointer` 程序演示了如何将局部变量的地址赋值给指针，以及指针如何操作该变量中的值。\n\n**列表 10.2 `Pointer.cpp`\
  \ 的全文**\n\n点击此处查看代码图片\n\n***\n\n```cpp\n1: #include <iostream>\n2:\n3: int main()\n\
  4: {\n5:     int myAge;             // 一个变量\n6:     int *pAge = nullptr;  // 一个指针\n\
  7:\n8:     myAge = 5;\n9:     pAge = &myAge;      // 将 myAge 的地址赋值给 pAge\n10:  \
  \  std::cout << \"myAge: \" << myAge << \"\\n\";\n11:    std::cout << \"*pAge: \"\
  \ << *pAge << \"\\n\\n\";\n12:\n13:    std::cout << \"*pAge = 7\\n\";\n14:    *pAge\
  \ = 7;           // 将 myAge 设为 7\n15:    std::cout << \"*pAge: \" << *pAge << \"\
  \\n\";\n16:    std::cout << \"myAge: \" << myAge << \"\\n\\n\";\n17:\n18:    std::cout\
  \ << \"myAge = 9\\n\";\n19:    myAge = 9;\n20:    std::cout << \"myAge: \" << myAge\
  \ << \"\\n\";\n21:    std::cout << \"*pAge: \" << *pAge << \"\\n\";\n22:\n23:  \
  \  return 0;\n24: }\n```\n\n由于程序使用了 C++ 语言最近添加的 `nullptr`，因此必须使用 `-std=c++14` 进行编译。这是该程序的输出：\n\
  \n```\nmyAge: 5\n*pAge: 5\n*pAge: 7\nmyAge: 7\nmyAge: 9\n*pAge: 9\n```\n\n该程序声明了两个变量：`int\
  \ myAge` 和指针 `pAge`，`pAge` 是一个指向 `int` 的指针并持有 `myAge` 的地址。`myAge` 在第 8 行被赋值为 5；这通过输出得到了验证。在第\
  \ 9 行，`pAge` 被赋值为 `myAge` 的地址。在第 11 行，`pAge` 被解引用，显示了 `pAge` 存储地址处的值。在第 14 行，`myAge`\
  \ 被设为 7。在第 19 行，`myAge` 被赋值为 9。\n\n#### 存储在指针中的地址\n\n指针允许你在不知道其真实值的情况下操作这些地址。当你将变量的地址赋值给指针时，指针就持有了该变量的值。但仅仅一次，为什么不检查一下？列表\
  \ 10.3 中的 `PointerCheck` 程序对指针进行了测试。\n\n\n\n\n到目前为止，你已经看到了将变量地址分配给指针的逐步细节。然而，在实践中，你永远不会这样做。毕竟，既然你已经有一个可以访问该值的变量了，为什么还要费劲使用指针呢？这种对变量进行指针操作的唯一理由仅仅是为了演示指针是如何工作的。\n\
  \n现在你已经熟悉了指针的语法，就可以更有效地使用它们了。指针通常用于以下三个任务：\n\n![Image](img/00002.jpeg) 管理堆上的数据\n\
  \n![Image](img/00002.jpeg) 访问类成员数据和函数\n\n![Image](img/00002.jpeg) 向函数通过引用传递变量\n\n\
  本小时的剩余部分将重点关注管理堆上的数据以及访问类成员数据和函数。在第 12 小时 的“创建引用”中，你将学习如何通过引用向函数传递变量。\n\n### 栈堆\n\
  \n程序员通常处理五个内存区域：\n\n![Image](img/00002.jpeg) 全局命名空间\n\n![Image](img/00002.jpeg)\
  \ 堆\n\n![Image](img/00002.jpeg) 寄存器\n\n![Image](img/00002.jpeg) 代码空间\n\n![Image](img/00002.jpeg)\
  \ 栈\n\n局部变量位于栈上，函数参数也是如此。代码当然位于代码空间，而全局变量位于全局命名空间中。寄存器用于内部管理函数，例如跟踪栈顶和指令指针。几乎所有剩余内存都分配给了堆，堆有时被称为自由存储（free\
  \ store）。\n\n局部变量的局限性是它们不会持久化。当函数返回时，局部变量就会被丢弃。全局变量解决了这个问题，但代价是在整个程序中无限制地访问，这导致产生容易出现错误且难以理解和维护的代码。将数据放在堆中可以同时解决这两个问题。\n\
  \n你可以将堆想象成巨大的内存区域，其中有成千上万个顺序编号的储格在等待你的数据。但是，你不能像对栈那样给这些储格标记标签。你必须请求你预留的储格地址，然后将该地址存储在指针中。\n\
  \n思考这种现象的方法是使用类比：在露营时，为了避免迷路，你将帐篷的位置设置在 GPS 设备并给它一个描述性名称“营地”。设备保存了该位置的经纬度，但你不需要自己记忆它们。\n\
  \n当你以后使用该设备时，你并不知道精确的经纬度，只知道“营地”这个名字会带你去那里。\n\n“营地”就是你在堆上的数据。你不知道它在哪里，但你知道如何到达它。你通过使用它的地址来访问它。你不需要知道那个数字，只需要把它放入指针中。指针让你访问你的数据，而不会被这些细节困扰。\n\
  \n栈在函数返回时会自动清理。所有局部变量都超出了作用范围，并从栈中移除。堆直到你的程序结束才会被清理，在你完成工作后释放你预留的任何内存是你的责任。在不再需要某些项时将它们留在堆中被称为“内存泄漏”，这是本小时稍些时候会讨论的主题。\n\
  \n堆的优势在于你预留的内会在显式释放它之前一直保持可用。如果你在函数内部在堆上预留内存，当函数返回时，该内存仍然可用。\n\n使用这种方式访问内存而不是使用全局变量的优势在于，只有拥有指针的函数才能访问数据。这为该数据提供了一个紧凑的接口，并消除了一个函数以意想不到和无法预测的方式更改数据的问题。\n\
  \n为了实现这一点，你必须能够创建一个指向堆上区域的指针。以下章节将描述如何实现。\n\n### 使用 new 关键字\n\n在 C++ 中，你通过使用 `new`\
  \ 关键字后跟要分配对象的类型在堆上分配内存，因此，`new unsigned short int` 在堆上分配两个字节，而 `new long` 分配四个字节。\n\
  \n`new` 的返回值是一个内存地址。它必须分配给指针。为了在堆上创建一个 `unsigned short`，你可能会写如下代码：\n\n点击此处查看代码图像\n\
  \n```\nunsigned short int *pPointer;\npPointer = new unsigned short int;\n```\n\n\
  当然，你可以在创建指针时对其进行初始化：\n\n点击此处查看代码图像\n\n```\nunsigned short int *pPointer = new unsigned\
  \ short int;\n```\n\n在任何情况下，`pPointer` 现在都指向堆上的一个 `unsigned short int`。你可以像使用其他变量指针一样使用它，并向该内存区域分配一个值：\n\
  \n```\n*pPointer = 72;\n```\n\n这意味着“将 72 放入 `pPointer` 所向的值处”或“将值 72 分配给内存区域”。\n\
  \n### 使用 delete 关键字\n\n当你完成对该内存区域的使用后，必须对指针调用 `delete`，将内存返回给堆。例如：\n\n```\ndelete\
  \ pPointer;\n```\n\n当你删除指针时，你实际上是在释放存储在指针中的地址的内存。你是在说：“将指针指向的内存返回给堆。”指针仍然是一个指针，并且可以重新赋值。\n\
  \n当你对一个指针调用 `delete` 时，它所指向的内存会被释放。再次对该指针调用 `delete` 将导致你的程序崩溃！在删除指针时，将其设置为 `nullptr`。对空指针调用\
  \ `delete` 保证是安全的。例如：\n\n点击此处查看代码图像\n\n```\nAnimal *pDog = new Animal;\ndelete pDog;\n\
  pDog = nullptr;\n```\n\n如果前面的代码看起来很困惑，不要担心。我们将在下一小时中查看如何在堆上分配对象。这同样适用于 `int` 等数据类型，如下所示：\n\
  \n点击此处查看代码图像\n\n```\nint *pNumber = new int;\ndelete pNumber;\npNumber = nullptr;\n\
  ```\n\n列表 10.4 程序演示了在堆上分配变量、使用该变量并将其删除。\n\n**列表 10.4** `Heap.cpp` **全文**\n\n点击此处查看代码图像\n\
  \n```\n1: #include <iostream>\n2:\n3: int main()\n4: {\n5:     int localVariable\
  \ = 5;\n6:     int *pLocal= &localVariable;\n7: }\n```\n\n\n\n\n```cpp\nint *pHeap\
  \ = new int;\n\n  if (pHeap == nullptr)\n  {\n    std::cout << \"Error! No memory\
  \ for pHeap!!\";\n    return 1;\n  }\n  *pHeap = 7;\n  std::cout << \"localVariable:\
  \ \" << localVariable << \"\\n\";\n  std::cout << \"*pLocal: \" << *pLocal << \"\
  \\n\";\n  std::cout << \"*pHeap: \" << *pHeap << \"\\n\";\n  delete pHeap;\n  pHeap\
  \ = new int;\n  if (pHeap == nullptr)\n  {\n    std::cout << \"Error! No memory\
  \ for pHeap!!\";\n    return 1;\n  }\n  *pHeap = 9;\n  std::cout << \"*pHeap: \"\
  \ << *pHeap << \"\\n\";\n  delete pHeap;\n  return 0;\n```\n\n***\n\n该程序的输出如下：\n\
  \n```\nlocalVariable: 5\n*pLocal: 5\n*pHeap: 7\n*pHeap: 9\n```\n\n第 5 行声明并初始化了一个局部变量。第\
  \ 6 行声明并初始化了一个指向局部变量地址的指针。第 7 行声明了另一个指针，但它使用调用 `new int` 获取的结果来初始化它。这在堆上为一个 `int`\
  \ 分配了空间。第 13 行将值 7 赋值给新分配的内存。第 14 行显示局部变量的值，第 15 行打印 `pLocal` 所指向的值。正如预期的那样，这些值是相同的。第\
  \ 16 行打印 `pHeap` 所指向的值。它表明在第 13 行赋值的值实际上是可以是可以访问的。\n\n在第 17 行，通过调用 `delete` 将第 7\
  \ 行分配的内存返回到堆中。这释放了内存并断开了指针与该内存位置的关联。`pHeap` 现在可以空地指向其他内存了。它在第 18 行和第 24 行被重新赋值，第\
  \ 25 行显示了结果。第 26 行再次将该内存归还给堆。\n\n***\n\n### 注意事项\n\n尽管第 26 行是多余的（程序结束时会自动返回该内存），但显式释放这段内存是一个好主意。如果程序发生更改或扩展，那么这一步已经处理过了将是有益的。\n\
  \n***\n\n### 避免内存泄漏\n\n另一种可能无意中创建内存泄漏的方法是在删除指针所指向的内存之前对其进行重新赋值。请考虑以下代码：\n\n点击此处查看代码图像\n\
  \n```cpp\nunsigned short int *pPointer = new unsigned short int;\n*pPointer = 72;\n\
  pPointer = new unsigned short int;\n*pPointer = 84;\n```\n\n此片段中的第 1 行创建了 `pPointer`\
  \ 并为其分配了堆上某个区域的地址。第 2 行将值 72 存储在该内存区域中。第 3 行将 `pPointer` 重新赋值到另一个内存区域。第 4 行将值 84\
  \ 放在该区域。原始区域（现在持有值 72 的区域）变得不可用了，因为指向该内存区域的指针已经被重新赋值。没有办法访问该原始内存区域，在程序结束前也没有任何办法释放它。\n\
  \n代码应该写成如下：\n\n点击此处查看代码图像\n\n```cpp\nunsigned short int *pPointer = new unsigned\
  \ short int;\n*pPointer = 72;\ndelete pPointer;\npPointer = new unsigned short int;\n\
  *pPointer = 84;\n```\n\n现在，原本由 `pPointer` 指向的内存在前一个片段的第 3 行被删除——从而被释放。\n\n***\n\n\
  ### 注意事项\n\n在你的程序中，每当调用一次 `new`，就应该有一个对应的 `delete` 调用。跟踪哪个指针拥有某块内存，并确保在完成工作后将内存返回到堆中是非常关重要的。\n\
  \n***\n\n### 空指针\n\n正如你之前学到的，确保指针始终有值是非常重要的。未初始化的指针可能会指向任何地方。\n\n在 C++ 的早期版本中，使用\
  \ `NULL` 来表示空指针，但现在于使用 `nullptr`。`NULL` 是一个通常定义为 0 的宏。\n\n将指针设置为 `nullptr` 可以解决在使用函数重载时的歧义问题。考虑这些函数：\n\
  \n```cpp\nvoid displayBuffer(char *);\nvoid displayBuffer(int);\n```\n\n如果使用 `nullptr`\
  \ 调用此函数，将调用 `int` 版本，因为 `nullptr` 是一个类型安全的字面量。\n\n### 列表 10.5 Swapper 全文\n\n***\n\
  \n```cpp\n#include <iostream>\n\nint main() {\n  int localVariable = 5;\n  int *pLocal\
  \ = &localVariable;\n  int *pHeap = new int;\n\n  if (pHeap == nullptr)\n  {\n \
  \   std::cout << \"Error! No memory for pHeap!!\";\n    return 1;\n  }\n  *pHeap\
  \ = 7;\n  std::cout << \"localVariable: \" << localVariable << \"\\n\";\n  std::cout\
  \ << \"*pLocal: \" << *pLocal << \"\\n\";\n  std::cout << \"*pHeap: \" << *pHeap\
  \ << \"\\n\";\n  delete pHeap;\n  pHeap = new int;\n\n  if (pHeap == nullptr)\n\
  \  {\n    std::cout << \"Error! No memory for pHeap!!\";\n    return 1;\n  }\n \
  \ *pHeap = 9;\n  std::cout << \"*pHeap: \" << *pHeap << \"\\n\";\n  delete pHeap;\n\
  \  return 0;\n}\n```\n\n***\n\n该程序必须使用 `-std=c14` 标志编译，因为 `nullptr` 是新特性。成功编译后运行\
  \ Swapper，产生如下输出：\n\n```\nlocalVariable: 5\n*pLocal: 5\n*pHeap: 7\n*pHeap: 9\n```\n\
