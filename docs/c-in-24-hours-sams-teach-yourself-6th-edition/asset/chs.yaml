  \n`template class <T>`\n\n这告诉编译器，你正在根据一个类型对列表进行参数化，而该类型将在你以后实例化列表时定义。例如，`Node` 类的声明现在变为：\n\
  \n```cpp\ntemplate <class T>\nclass Node\n```\n\n这表示 `Node` 本身不会作为一个类存在，而是你将实例化\
  \ `Robot` 的 `Node` 和 `Data` 对象的 `Node`。你传递的实际类型由 `T` 表示。\n\n因此，`InternalNode` 现在变为\
  \ `InternalNode<T>`（读作“`T` 的 `InternalNode`”）。`InternalNode<T>` 指的不是一个 `Data` 对象另一个\
  \ `Node`；而是指向一个 `T`（任何类型的对象）和一个 `Node<T>`。你可以在第 118–119 行看到这一点。\n\n仔细观察第 107–129\
  \ 行定义的 `insert()` 函数。逻辑是相同的，但在我们以前使用特定类型（`Data`）的地方，现在我们使用了 `T`。因此，在第 107 行，参数是一个指向\
  \ `T` 的指针。稍后，当我们实例化特定的列表时，编译器会将 `T` 替换为正确的类型（`Data` 或 `Robot`）。\n\n重要的是，`InternalNode`\
  \ 可以继续工作，而不受实际类型的影响。它知道要求对象进行自我比较。它不在乎 `Robot` 对象的比较方式是否与 `Data` 对象相同。事实上，我们可以重写代码，使得\
