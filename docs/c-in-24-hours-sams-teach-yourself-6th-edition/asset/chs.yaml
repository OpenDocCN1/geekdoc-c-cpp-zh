  \ IN 46240 USA\n\n## 读者服务\n\n访问我们的网站并在 **[informit.com/register](http://informit.com/register)**\
  \ 注册本书，以便方便获取本书可能提供的任何更新、下载内容或错误说明。\n\n## 引言\n\n恭喜你！读到这句话时，你已经离学习 C++（世界上最重要的编程语言之一）近了\
  \ 20 秒。\n\n如果你能继续学习 23 小时 59 分钟 40 秒，你将掌握 C++ 编程语言的基础知识。24 节每节一小时的课程涵盖了重要的特性，如管理\
  \ I/O、创建循环和数组、使用模板进行面向对象的编程，以及创建 C++ 程序。\n\n所有这些内容都被组织成了结构良好、易于理解的课程。书中包含了由你创建的运行项目——附带输出结果和代码分析——用来说明每节的主题。语法示例已有清晰标记，方便参考。\n\
  \n为了帮助你变得更加精通，每节课程的结束处都有一组常见问题和解答。\n\n### 谁应该读这本书？\n\n你不需要任何编程经验就可以通过这本书学习 C++。它从基础知识开始，教你语言本身以及与\
  \ C++ 编程涉及的概念。无论你是刚起步，还是已经有一些编程经验，你都会发现这本书让学习 C++ 变得既快速又简单。\n\n### 我应该先学 C 吗？\n\n\
  不需要，你不需要先学 C。C++ 是一种强大得多且功能多多的语言，由 Bjarne Stroustrup（比雅尼·斯特斯特普）作为 C 语言的继任者创建。先学\
  \ C 可能会让你养成一些比在 C++ 中更容易出错的编程习惯。本书并不假设读者熟悉 C 语言。\n\n### 为什么要学 C++？\n\n你可以学习许多其他语言，但学习\
  \ C++ 是很有价值的，因为它经受了时间的考验，并且仍然现代编程的热门选择。\n\n尽管 C++ 创建于 1979 年，但由于该语言的强大和灵活性，它今天仍被用于专业软件领域。该语言甚至还有一个新版本，称为\
  \ C++14，它使其变得更加实用。\n\n由于 Java 等其他语言是受 C++ 启发，学习这种语言也可以让你对其他语言产生见解。掌握 C++ 让你拥有了可移植的技能，你可以将其应用于当今市场上的几乎任何平台，从桌面级电脑到\
  \ Linux 服务器、移动设备、游戏机主机和大型机。\n\n### 如果我不想要这本书怎么办？\n\n很抱歉你有这种想法，但这种情况有时会发生。请将这本书封面朝外，放回商店人流量较大的尽头书架侧板上。\n\
  \n### 本书使用的约定\n\n本书包含了此处处描述的特殊元素。\n\n***注意（Note）***\n\n这些框将为你刚刚阅读的内容提供额外信息。\n\n\
  ***\n\n***警告（Caution）***\n\n这些框将你的注意力集中在特定情况下可能出现的问题或副作用上。\n\n***\n\n***提示（Tip）***\n\
  \n这些框为你提供技巧，并突出可以让你的 C++ 编程更高效有效的信息。\n\n***\n\n当你看到这个符号时，你就知道接下来看到的是 C++ 代码。本书使用了不同的字体：\n\
  \n为了帮助你区分 C++ 代码和普通英语，实际的 C++ 代码使用`等宽字体（monospace）` 排。\n\n占位符——临时用于代表真实单词的词或字符——使用*斜体*\
  \ 排。\n\n新的或重要的术语使用*斜体*。（等等，我看到原文中有重复，，让我重新核实一下）。\n\n在本书的代码列表中，每一行 C++ 代码都有行号。如果你在代码列表中看到未编号的行，你就知道该行是前一个编号行的延续（某些代码行太长，超出了书页的宽度）。\n\
  \n# 第一部分：C++ 入门\n\n## 第 1 小：编写你的第一个程序\n\n***\n\n本节你将学到：\n\n* C++ 是如何以及为什么要发明的\n\
  * 如何找到 C++ 编译器\n* 如何创建并编译你的第一个程序\n* 如何链接并运行程序\n\n***\n\n### 使用 C++\n\n1979 年，美国贝尔实验室的一位丹麦计算机科学家开始对\
  \ C 语言语言进行增强。Bjarne Stroustrup 在他的个人网站上解释说，他希望有一种语言，“我可以在其中写出既高效又优雅的程序”。\n\n许多其他人也想这样做。\n\
  \nStroustrup 创建的语言被他命名为 C++，几十年来一直占据世界顶级编程语言的一席之地。多年来，许多编程趋势层起彼伏，但这种语言仍然是软件开发中一种现代且实用的选择。\n\
  \nC++ 是一种可移植的语言，在 Microsoft Windows、Apple Mac OS、Linux 和 UNIX 系统上运行同样良好。学习这种语言最好的方法是在忽略程序运行的操作系统的情况下，直接编写程序。\n\
  \n《24 小时教你学 C++》为你提供了该语言的上手介绍，且完全对你的操作系统不作任何假设。本书能够实现这一点，是因为它涵盖了标准 C++（也称为 [ANSI]/[ISO]\
  \ C++），这是该语言国际公认的版本，可以移植到任何平台和开发环境。\n\nC++14（该语言的当前版本）中引入的新特性也涵盖在内。流行的 C++ 开发环境都支持这个版本，它之所以名称带有\
  \ 14，是因为它是在 2014 年发布的。\n\n\n\n\nC++ 程序是由一组协同工作的工具开发的，这些工具被称为`compiler`（编译器）和`linker`（链接器）。\n\
  \n编译器将 C++ 程序转换为运行的形式。编译器将程序从称为`source code`（源代码）的人类可读格式转换为机器可运行的形式，即`machine code`（机器码）。编译器生成对象文件。从对象文件中，`linker`\
  \ 构建出一个可以运行的可执行文件。\n\n目前有几种流行的 C++ 编程环境，你可能以前用过，或者知道如何获取。其中一些包括 GCC（GNU 编译器集）、Microsoft\
  \ Visual Studio、NetBeans 和 Embarcadero C++ Builder。\n\n如果你的系统上安装了最新版本的 C++ 编译器，并且知道如何使用它的基础知识，那么你在完成本书中的编程项目将不会遇到任何困难。\n\
  \n如果你没有 C++ 编译器，不知道如何使用编译器，或者不知道如何找到它，请放松。你可以在附录 D 中的“在 Windows 上使用 MinGW C++ 编译器”中学习如何下载和安装一个优秀的免费编译器\
  \ GCC。如果你在继续阅读本书之前需要编译器，现在就执行该操作。\n\nMicrosoft Visual Studio 也支持 C++ 编程，并且可以在 [www.visualstudio.com](http://www.visualstudio.com)\
  \ 网站获取名为 Visual Studio Community 的免费版本。本书中为使用 Visual Studio 学习 C++ 的人员提供了一些指导。\n\
  \n### 编译和链接源代码\n\n在这一小时稍后时候创建你的第一个 C++ 程序之前，了解这个过程是值得的。\n\nC++ 程序始于源代码，这只是输入到 Windows\
  \ WordPad、Gedit、Emacs 或 Vi 等编辑器中的文本。虽然 Microsoft Word 和其他文字处理器可以将文件保存为纯文本，但在编程时，你应该使用更简单的编辑器，因为你不需要文字处理器的所有格式化和显示功能。源代码由没有特殊格式的纯文本组成。\n\
  \n***\n\n注意\n\nWindows 上有一个名为 Notepad++ 的免费文本编辑器，它为 C++ 编程提供了很好的支持。它包含了一些你在获得创建自己程序的经验后会非常欣赏的功能，例如代码高亮，它用不同的颜色显示语言的不同元素。你可以从\
  \ [`notepad-plus-plus.org`](https://notepad-plus-plus.org) 下载它。\n\n***\n\n你为 C++\
  \ 创建的源代码文件可以使用 `.cpp`、`.cxx`、`.cp` 或 `.c` 扩展名命名。本书所有的源代码文件都使用 `.cpp` 扩展名，这是 C++\
  \ 程序员常用的选择，也是某些编译器的默认选择。大多数 C++ 编译器不在意源代码的扩展名，但一致使用 `.cpp` 有助于识别源代码文件。\n\n源代码是 C++\
  \ 程序的人类可读形式。在编译和链接之前，它是无法运行的。\n\n源代码编译后，会生成一个对象文件。该文件由链接器转换为`executable program`（可执行程序）。\n\
  \nC++ 程序通过将一个或多个对象文件与一个或多个库链接在一起。`library`（库）是可链接文件的集合，提供了可以在程序中依赖的有用函数和类。`function`（函数）是执行任务的代码块，例如乘以两个数字或显示文本。`class`（类）是新数据类型和相关函数的定义。\n\
  \n以下是创建 C++ 程序的步骤：\n\n1. 使用文本编辑器创建一个源代码文件。\n2. 使用编译器将源代码转换为对象文件。\n3. 使用链接器将对象文件和任何必要的库链接起来以生成可执行程序。\n\
  4. 输入可执行程序的名称来运行它。\n\nGCC 编译器可以在单一步中处理编译和链接。\n\n### 创建你的第一个程序\n\n现在你已经了解了这个过程，是时候创建你的第一个\
  \ C++ 程序并给编译器进行试用了。\n\n启动你用于创建程序的文本编辑器并打开一个新文件。你创建的第一个程序将在屏幕上显示文本。\n\n将列表 1.1 的文本输入到编辑器中。忽略列表左侧的数字和紧随其后的冒号——这些在书中仅是为了参考目的而存在的。\n\
  \n在你打字时，请确保正确输入每行的标点符号，例如第 5 行的 `::` 和 `<<` 字符。\n\n完成后，将文件保存为 `Motto.cpp`。\n\n**列表\
  \ 1.1 `Motto.cpp` 的全文。**\n\n点击此此处查看代码图片\n\n***\n\n```\n1:  #include <iostream>\n\
  2:\n3:  int main()\n4:  {\n5:      std::cout << \"Solidum petit in profundis!\\\
  n\";\n6:      return 0;\n7: }\n```\n\n***\n\n这个项目的意义是熟悉创建 C++ 程序的步骤。如果你对每一行在做什么感到困惑，不要惊慌——你将在第\
  \ 2 小时“组织程序的部分”中发现发生了什么。\n\n在你保存文件后，它需要被编译和链接。如果你使用 GCC，以下命令可以完成这两项任务：\n\n```bash\n\
  g++ Motto.cpp -o Motto.exe\n```\n\n该命令告诉 `g++` 编译 `Motto.cpp` 并将其链接为名为 `Motto.exe`\
  \ 的执行程序。如果编译成功，不会显示任何消息。如果有问题，编译器会显示错误信息以及出现问题的行。\n\n如果你遇到编译器错误，请逐行检查程序。确保包含了所有的标点符号，特别是第\
  \ 5 行和第 6 行末的分号。在解决任何问题后，再次尝试编译。如果你继续遇到问题并找不到原因，可以从本书的网站 cplusplus.cadenhead.org\
  \ 下载此程序的副本。前往第 1 小时页面。\n\n当程序正确编译后，你可以像运行计算机上的任何其他程序一样运行 `Motto.exe`：输入它的名称 `Motto.exe`\
  \ 并按回车。\n\n该程序显示以下输出：\n\n```\nSolidum petit in profundis!\n```\n\n这是奥胡斯大学的校训，这是一所位于丹麦奥胡斯、拥有\
  \ 3 万 万学生的公立学校，也是该王国第二大大学。校训是拉丁语，意为“在深处寻求稳实的基础”。\n\n奥胡斯的校友包括丹麦女王玛格丽特二世、诺贝尔奖得化学家\
  \ Jens Christian Skou、弗雷德里克王子以及一个名叫 Bjarne Ststrup 的家伙。\n\n### 总结\n\n恭喜！你现在可以称自己为\
  \ C++ 程序员了，尽管如果你现在就此放弃，没有人会认为你是一个心勃勃的人。\n\nC++ 语言在三十多年里一直是软件开发的流行选择。这种语言有其特殊之处，但当你熟悉了程序的结构后，很容易通过创建更复杂的程序来扩展你的知识。\n\
  \n在接下来的几小时里，你将学习 C++ 的基本构建块，每小时创建几个程序来展示语言的新侧面和编程技巧。\n\n*Solidum petit in profundis!*\n\
  \n### 问答\n\n**问. 文本编辑器和文字处理器有什么区别？**\n\n\n\n\n\n# 入门\n\n**A.** 文本编辑器产生包含纯文本的文件——仅包含字母、数字、空格和标点符号。它没有用于如粗体或斜体文本、两端对齐、特殊边距等格式的命令。在\
  \ `C++` 源代码中，你不需要任何这些格式，而且使用文字处理器会在文件中保存编译器无法理解的内容。如果你在编译 Motto 程序时遇到困难，且你正在使用文字处理器，请尝试在\
  \ Windows 上使用更简单的编辑器，如 `Notepad`（记事本）或 `Notepad++`，以看看这是否能解决问题。\n\n**Q. 我的编译器内置了编辑器。使用它是正确的选择吗？**\n\
  \n**A.** 听起来你正在使用一个集成开发环境（IDE），这是一种可以加速程序编写、调试和测试过程的图形化工具。像 `Microsoft Visual Studio`\
  \ 这样复杂的编译器包含了一个完整的 IDE，允许程序员直接在环境中访问帮助文件、编辑并编译代码，并且无需离开环境即可解决编译和链接错误。这些工具为编写 `C++`\
  \ 程序提供了更好的方法，但前提是你已经知道如何使用该 IDE。在学习 `C++` 的同时去学习 IDE 的各种门道是非常困难的。这就是为什么本书推荐 `GCC`\
  \ 的原因之一，它简单、强大且免费。\n\n**Q. 我可以忽略编译器的警告信息吗？**\n\n**A.** 绝对不行的。`C++` 使用编译器在当你作为程序员执行了某些可能并非你意图的操作时发出警告。最好的方法是重视这些警告，并采取必要措施消除它们。获取错误（error）意味着编译器无法无法将你编写的内容转换为机器语言。而警告（warning）意味着它可以转换，但可能不是你预期的方式。\n\
  \n**Q. 你只回答与 `C++` 相关的问题吗？**\n\n**A.** 不是。任何问题都可以提问。\n\n**Q. 太酷了（Groovy）。为什么没有人卖葡萄味的冰淇淋？**\n\
  \n**A.** 与加入冰淇淋的其他水果味不同，葡萄的味几乎完全来自于果皮，而不是果实内部。没有了果皮，它们尝起来只有完全没有特色且普通的甜味，因此除非有人告诉你，否则你不知道自己吃的是葡萄味冰淇淋。\n\
  \n当为了解决这个问题而加入果皮时，冰淇淋制造商表示，最终产品的口感会让人们感到惊异。因此，即使有葡萄味冰淇淋，也极其罕见，而且甚至有点恶心。\n\n这种口味的粉丝仍然可以享受葡萄汁、葡萄果冻和葡萄汽水。但不能吃\
  \ Grape-Nuts。这种有 120 年历史的早餐谷物中既没有葡萄也没有坚果。\n\n## 工作坊\n\n现在你已经有机会输入、编译、链接并执行你的第一个程序，你可以回答几个问题并完成几项练习，以巩固你关于编译器的知识。\n\
  \n### 测验\n\n**[1].** 什么工具将 `C++` 源代码转换为目标代码？\n\n**A.** 编译器\n**B.** 链接器\n**C.** 集成开发环境\n\
  \n**[2].** 源代码文件最常见的文件名扩展名是什么？\n\n**A.** `.cpp`\n**B.** `.c`\n**C.** `.h`\n\n**[3].**\
  \ 你可以使用哪些工具来编辑你的源代码？\n\n**A.** 文本编辑器\n**B.** 文字处理器\n**C.** 两者皆可\n\n### 答案\n\n**[1].\
  \ A.** 编译器获取 `C++` 源代码文件并将其转换为目标代码。链接器将该目标文件和其他任何必要的目标文件链接在一起，以创建一个可执行程序。\n\n**[2].\
  \ A.** 编译器可以处理任何扩展名的源代码文件，但 `.cpp` 被广泛用作 `C++` 代码的物理文件扩展名。使用这个扩展名可以让你以后在电脑文件文件夹中查找程序源代码时变得更加从容。\n\
  \n**[3]. C.** 你可以使用任何将代码保存为纯文本的工具。你可以使用操作系统附带的简单编辑器（如 `Notepad`、`Vi`、`Gedit` 或 `Emacs`）或其它可用的编辑器。我提到过\
  \ `Notepad++` 吗？\n\n### 活动\n\n1. 修改 Motto 程序以显示文本“Saluton Mondo!”，这是人造语言世界语中的“Hello\
  \ world!”问。\n2. 如果你没有 `C++` IDE 且不习惯使用命令行，请查看 `Notepad++`、位于 `http://netbeans.org`\
  \ 的 `NetBeans` 或位于 `http://codeblocks.org` 的 `Code::Blocks`。它们是免费的 IDE，可以配置为与 `GCC`\
  \ 配合工作。在阅读本书时，你可能会发现它们更易用。\n\n要查看这些活动的解决方案，请访问本书的网站 `http://cplusplus.cadenhead.org`。\n\
  \n## 第二小时：程序的组成部分\n\n### 你在此小时将学到：\n\n- 为什么要使用 `C++`\n- `C++` 程序是如何组织的\n- 注释如何让程序更容易理解\n\
  - 函数可以完成什么任务\n\n尽管 `C++` 编程语言诞生虽不久，但它的发展程度比 70 年代后期出来的的一些东西要好得多。它仍然是一门世界级的编程语言。\n\
  \n它具有惊人寿命的原因是 `C++` 使得用少量代码创建执行快速的程序成为可能。如今的 `C++` 编程工具能够在商业、业务和开源开发中创建复杂的应用程序。\n\
  \n### 使用 C++ 的理由\n\n在计算时代的七十年里，计算机编程经历了剧烈的演变。`C++` 被认为是 1972 年引入的 `C` 语言的进化性改进。\n\
  \n最早的程序员处理的是最原始的指令：机器语言。这些指令由长串的 0 和 1 表示。汇编器的出现使得可以将机器指令映射到人类可读且易于管理的命令，如 `ADD`\
  \ 和 `MOV`。\n\n构成计算机程序的指令被称为源代码。\n\n随着时间的推移，出现了高级语言如 `BASIC` 和 `COBOL`。这些语言让程序员能够开始使用接近实际单词和句子的语言来编写程序，例如\
  \ `Let Average = .366`。这些指令通过被称为解释器或编译器的工具翻译回机器语言。\n\n基于解释器的语言在读取每一行时对其进行翻译，并执行每条指令。\n\
  \n基于编译器的语言通过一个称为编译的过程将程序翻译成所谓的目标代码。这些代码存储在目标文件中。接下来，链接器将目标文件转换为可以在操作系统上运行的可执行程序。\n\
  \n由于解释器在编写代码时进行读取并即时执行，因此它们对程序员来说易于操作。编译器则需要编译和链接程序等更不便的额外步骤。这种方法的益处是，程序的运行速度比解释器运行的程序快得多。\n\
  \n\n\n\n今天，编程中最大的开销是程序员的时间成本。`C++` 等现代语言能够更快速地编写出良好、易于维护且可以扩展和增强的程序。\n\n## 编程风格\n\
  \n随着编程语言的演进，出现了许多为了满足不同编程风格而设计的语言。\n\n在过程化编程中，程序被构想为对一组数据执行的一系列动作。结构化编程的引入是为了为提供一种系统化的方法来组织这些过程并管理大量数据。\n\
  \n结构化编程背后的思想是分而治之。取一个在程序中需要完成的任务，如果它太复杂，就将其分解为一组较小的组件任务。如果其中任何一个任务仍然太复杂，就将其分解为更小的任务。最终目标是使任务足够小且自包含，从而易于理解。\n\
  \n例如，假设你受这家出版社的要求，编写一个程序来追踪其由才华横溢且低调富有魅力的计算机书籍作者团队的平均收入。这项工作可以分解为以下子任务：\n\n1. 找出每位作者赚了多少钱。\n\
  2. 统计出版社有多少位作者。\n3. 计算所有收入的总和。\n4. 将总和除以作者人数。\n\n计算总收入可以进一步分解为：\n\n1. 获取每位作者的人员记录。\n\
  2. 访问作者的书籍预和版税。\n3. 扣除早晨咖啡、正光眼镜和脊椎治疗的费用。\n4. 将收入累加到运行总量中。\n5. 获取下一个作者的记录。\n\n反之，获取每位作者的记录可以分解为这些子任务：\n\
  \n1. 打开作者的文件文件夹。\n2. 找到正确的记录。\n3. 从磁盘读取数据。\n\n尽管结构化编程被广泛使用，但这种方法也有一些缺点。随着数据量的增加，数据与操作数据任务的分离变得越来越难以理解和维护。对数据需要的操作越多，程序就变得越混乱。\n\
  \n过程化程序员经常发现自己是在为旧问题发明新的解决方案，而不是产生可重用的程序。可用性背后的思想是构建可以根据需要插入程序中的程序组件。这种方法模仿了物理世界，设备由每个执行特定任务且已经制造好的各个部分组成。一个设计自行车的人不需要从头创建刹车系统。相反，她可以将现有的刹车整合到设计中并利用其现有的功能。\n\
  \n这种基于组件的方法随着面向对象编程的引入，首次供计算机程序员使用。\n\n## C++ 与面向对象编程\n\n`C++` 帮助推广了一种具有革命性的编程风格，它有一个幽默的缩写：OOP。\n\
  \n面向对象编程的本质是将数据和作用于数据的过程视为单个对象——一个具有自身身份和特征的自包含实体。\n\n`C++` 语言完全支持面向对象编程，包括三个被认为是面向对象开发支柱的概念：封装、继承和多态。\n\
  \n### 封装\n\n当上述的自行车工程师创建一个辆新自行车时，她将车架、车把、轮子和大灯等组件碎片连接在一起（辐条上的棒球卡是可选的）。每个组件都有某些属性并能完成某些行为。只要她知道大灯的作用，她就可以使用大灯，而无需理解其工作原理的细节。\n\
  \n为了实现这一点，大灯必须是自包含**的。它必须完成一个定义良好的任务，并且必须完整地完成。完整地完成一件事被称为封装。\n\n大灯的所有属性都封装在大灯对象中。它们没有分散在整个自行车上。\n\
  \n`C++` 通过创建名为 `classes`（类）的用户定义类型来支持封装的属性。一个定义良好的 `class` 充当完全封装的实体，作为一个整体使用或完全不使用。`class`\
  \ 的内部运作应该是隐藏的，基于使用定义良好的 `class` 的程序不需要知道 `class` 是如何工作的。它们只需要知道如何使用它。你可以在第 8 节“创建基本类](#part0018.html_ch08)”中学习如何创建`classes`。\n\
  \n### 继承与重用\n\n现在我们开始学习更多关于这位自行车工程师的信息。让我们叫她 Penny Farthing 吧。Penny 需要她的新自行车尽快上市——她向那些不以耐心著称的人欠了巨额赌债。\n\
  \n由于时间紧迫，Penny 从现有自行车的设计开始，并用杯架和里程计等酷炫的附件对其进行增强。她的新自行车被构想为一种带有附加功能的自行车。她重用了普通自行车的所有特征，同时添加了扩展其实用性的功能。\n\
  \n`C++` 通过继承 支持重用思想。可以声明一种新类型，它是现有类型的扩展。这个新的 `subclass`（子类）被认为派生自现有类型。Penny 的自行车派自一辆普通的自行车，因此继承了它所有的特性，但根据需要添加了额外的功能。继承及其在\
  \ `C++` 中的应用将在第 16 节“通过继承扩展类](#part0029.html_ch16)”中讨论。\n\n### 多态性\n\n作为它的新卖点，Penny\
  \ Farthing 的自行车在按喇叭时表现不同。轻按时，它听起来像一只痛苦的鸭子；用力按时，它像像雾笛。喇叭根据其使用方式执行正确的行为。\n\n`C++`\
  \ 通过称为*函数多态*和*类多态*的语言特性支持这种想法。多态性 指的是同一事物具有多种形式，并在第 17 节“使用多态和派生类](#part0030.html_ch17)”中讨论。\n\
  \n当你完成整个 24 小时的行程并开始开发自己的 `C++` 程序时，你将学会面向对象编程的全貌。\n\n免责声明：你不会学会如何设计自行车或解决债务。\n\n\
  ## 程序的部分\n\n你在第一小时创建的程序 `Motto.cpp` 包含了 `C++` 程序的 Basic 框架。列表 2.1 重现了该程序的源代码，以便更详细地探索。\n\
  \n在 NetBeans 等编程编辑器中输入此程序时，请记住不要在列表中包含行号。包含行号仅是为了引用书中的特定行。\n\n**列表 2.1 `Motto.cpp`\
  \ 的全文**\n\n点击此处查看代码图像\n\n```cpp\n1:�#include <iostream>\n2: \n3:�int main()\n4:�{\n\
  5:    std::cout << \"Solidum petit in profundis!\\n\";\n6:    return 0;\n7:�}\n\
  ```\n\n该程序产生单行输出，奥胡斯大学的校格言：\n\nSolidum petit in profundis!\n\n\n\n\n# 预处理器指令\n\n\
  C++ 编译器的第一个动作是调用另一个名为预处理器的工具，它会检查源代码。这在每次编译器运行时都会发生。\n\n第 1 行的第一个字符是 `#`符号，它表示该行是一个由预处理器处理的命令。这些命令被称为`预处理器指令`。预处理器的工作是读取源代码寻找指令，并根据指示的指令修改代码。修改后的代码被交给编译器。\n\
  \n预处理器在代码编译之前充当代码编辑器的角色。每条指令都是告诉该编辑器该做什么的命令。\n\n`#include` 指令告诉预处理器在程序的该位置包含指定文件的全部内容。正如你在第\
  \ 1 小时中所学习到的，“编写你的第一个程序”，C++ 包含了一个标准源代码库，可以在你的程序中使用它来执行有用的功能。`iostream` 文件中的代码支持输入输出任务，例如在屏幕上显示信息和从用户获取输入。\n\
  \n文件名 `iostream` 外围的 `<` 和 `>` 括号告诉预处理器在标准位置集中查找该文件。由于括号的存在，预处理器会在存放编译器头文件的文件夹中查找\
  \ `iostream` 文件。这些文件称为`包含文件`，因为它们被包含在程序的源代码中。\n\n`iostream` 的完整内容被包含在第 1 行。\n\n\
  ## 注意\n\n头文件传统上以扩展名 `.h` 结尾，被称为 `h 文件`，因此它们使用形式为 `include <iostream.h>` 的指令。\n\n\
  现代编译器不需要该扩展名，但如果你使用它引用文件，出于兼容性考虑，指令可能仍然有效。本书在包含文件中省略了多余的 `.h`。\n\n`iostream` 文件的内容被第\
  \ 5 行中的 `cout` 命令使用，该命令向屏幕显示信息。\n\n源代码中没有其他指令，因此编译器处理 `Motto.cpp` 的其余部分。\n\n# 源代码逐行解析\n\
  \n第 3 行通过声明名为 `main()` 的函数开始实际程序。`函数`是执行一个或多个相关操作的代码块。函数执行一些工作，然后返回到程序中调用它们的地方。\n\
  \n每个 C++ 程序都有一个 `main()` 函数。当程序启动时，`main()` 会被自动调用。\n\n所有 C++ 函数在完成工作后必须返回某种类型的值。`main()`\
  \ 函数始终返回一个整数值。整数使用关键字 `int` 指定。\n\n函数与 C++ 程序中的其他代码块一样，使用大括号 `{` 和 `}` 组合在一起。所有函数都以左括号\
  \ `{` 开始，并以右括号 `}` 结束。\n\n`Motto.cpp` 中 `main()` 函数的大括号分别位于第 4 行和第 7 行。左括号和右括号之间的所有内容都是函数的一部分。\n\
  \n在第 5 行，使用 `cout` 命令在屏幕上显示消息。该对象前面有 `std::` 标识，这告诉编译器使用标准 C++ 输入/输出库。这种工作原理的细节对于初阶段的你来说太复杂了，如果在这里介绍，可能会导致你把书扔出房间。为了你周围其他人的安全，这些内容将在稍后进行解释。现在，将\
  \ `std::cout` 视为处理程序中输出的对象的名称，将 `std::cin` 视为处理用户输入的对象。\n\n第 5 行中对 `std::cout` 的引用后面跟着\
  \ `<<`，它被称为`输出重定向运算符`。运算符 是代码行中根据某些信息执行操作的字符。`<<` 运算符显示该行中后面的信息。在第 5 行中，文本 `\"Solidum\
  \ petit in profundis!\\n\"` 被包含在双引号内。这会在屏幕上显示一个字符字符串，紧接着是一个由 `\"\\n\"` 指定特殊字符，即换行符，它将程序的输出推进到下一行的开头。\n\
  \n在第 6 行，程序返回整数值 `0`。该值在程序运行结束后由操作系统接收。通常情况下，程序返回值 `0` 表示它运行成功。任何其他数字都表示某种失败。\n\n\
  第 7 行的右括号结束了 `main()` 函数，从而结束了程序。你所有的程序都使用此程序演示的基础框架。\n\n## 注释\n\n当你第一次编写自己的程序时，源代码每一行的作用对你来说似乎非常清晰。但随着时间的推移，当你回到程序修复错误或添加新功能时，你可能会发现自己对自己的工作完全困惑。\n\
  \n为了避免这种困境并帮助他人理解你的程序，你可以用注释对源代码进行说明。注释是解释程序正在做什么的文本。编译器忽略它们，因此它们完全是为了阅读代码的人的利益。\n\
  \nC++ 中有两种类型的注释。单行注释以两个斜杠 (`//`) 开头，导致编译器忽略同一行中斜杠之后的所有内容。这是一个例子：\n\n```cpp\n// 下一行是一个临时权宜之计\n\
  ```\n\n多行注释以斜杠和星号字符 (`/*`) 开始，并以反转的字符 (`*/`) 结束。`/*` 和 `*/` 之间的所有内容都是注释，即使它们跨越了多行。如果程序包含\
  \ `/*` 但没有后续 `*/`，那就是会被编译器标记的错误。这是一个多行注释：\n\n```cpp\n/* 程序的这部分运行得不好。请在代码上线之前修复它，否则找一个可以替罪的人。新人\
  \ Curtis 会是个不错的选择。 */\n```\n\n在前面的注释中，左边距的文本对齐以提高可读性。这不是强制要求的。由于编译器忽略 `/*` 和 `*/`\
  \ 之间的所有内容，可以在那里放入任何内容。\n\n### 注意\n\n多行注释不能嵌套。如果你使用一个 `/*` 开始注释，然后在几行后使用了另一个 `/*`，编译器遇到的第一个\
  \ `*/` 标记将结束所有的多行注释。第二个 `*/` 标记会导致编译器错误。大多数 C++ 编程编辑器用不同的颜色显示注释，以明确它们的开始和结束。\n\n\
  你创建的项目包含了两种注释。在你的程序中编写大量的注释。花更多时间编写解释源代码情况的注释，在几周、几个月甚至几年后维护这些代码就越容易。\n\n## 函数\n\
  \n`main()` 函数在所有 C++ 函数中是特殊的，因为它在程序启动时会被自动调用。\n\n程序按源代码逐行执行，从 `main()` 开始。当调用函数时，程序会分支执行该函数。在函数完成工作后，它会返回到调用函数的地方。函数由头部和正体组成。头部由三部分组成：\n\
  \n1. 函数返回的数据类型\n\n\n\n\n\n![Image](img/00002.jpeg) 函数名称\n\n![Image](img/00002.jpeg)\
  \ 函数接收的参数\n\n`function name` 是一个描述其用途的短名称标识符。\n\n当函数不返回返回值时，它使用数据类型 `void`，表示“空”。为了澄清：`void`\
  \ 并不是没有意义。它意味着“无”，就像太空中的星星被巨大的、被称为“虚空”（the void）的无隔离开分开。\n\n`Arguments`（参数）是发送给函数以控制其行为的数据。这些参数作为\
  \ `parameters`（形式参数）被函数接收。一个函数可以有零、一个或多个形式参数。你创建的下一个程序有一个名为 `add()` 的函数，用于将两个数字相加。它的声明方式如下：\n\
  \n点击此处查看代码图片\n\n```cpp\nint add(int x, int y)\n\n{\n    // 函数体写在此处\n}\n```\n\n参数被组织在括号内，作为一个用逗号分隔的列表。在这个函数中，参数是名为\
  \ `x` 和 `y` 的整数。\n\n函数的名称、它的参数以及这些参数的顺序被称为它的 `signature`。就像人的签名一样，函数的签名可以唯一地标识它。\n\
  \n没有参数的函数有一对空括号，如例所示：\n\n点击此处查看代码图片\n\n```cpp\nint getServerStatus()\n\n{\n    //\
  \ 函数体写在此处\n}\n```\n\n函数名不能包含空格，因此 `getServerStatus()` 函数在第一个单词之后的每个单词的首字母都大写。这种命名约定在\
  \ C++ 程序员中很常见，并贯穿本书。\n\n返回值的函数使用 `return` 语句来退出函数。如果你没有在函数中包含至少一个 `return` 语句，它会在函数体结束时自动返回\
  \ `void`。在这种情况下，`void` 必须被指定为函数的返回类型。\n\n### 在函数中使用参数\n\nListing 2.2 中的 `Calculator.cpp`\
  \ 程序详细说明了上述的 `add()` 函数，用它将两个数字相加并显示结果。该程序演示了如何创建一个接受两个整数参数并返回一个整数值的函数。\n\n**列表\
  \ 2.2 `Calculator.cpp` 的完整文本**\n\n点击此处查看代码图片\n\n```cpp\n1: #include <iostream>\n\
  2:\n3: int add(int x, int y)\n4: {\n5:      // 将数字 x 和 y 相加并返回和\n6:      std::cout\
  \ << \"Running calculator ...\\n\";\n7:      return (x+y);\n8: }\n9:\n10: int main()\n\
  11: {\n12:      /* 此程序调用 add() 函数将两组不同的\n13:          数字相加并显示结果。add()\n14:     \
  \     函数被 main() 函数中的某行调用，否则\n15:          就不会执行任何操作。 */\n16:      std::cout <<\
  \ \"What is 867 + 5309?\\n\";\n17:      std::cout << \"The sum is \" << add(867,\
  \ 5309) << \"\\n\\n\";\n18:      std::cout << \"What is 777 + 9311?\\n\";\n19: \
  \     std::cout << \"The sum is \" << add(777, 9311) << \"\\n\";\n20:      return\
  \ 0;\n21: }\n```\n\n该程序产生以下输出：\n\n```\nWhat is 867 + 5309?\nRunning calculator ...\n\
  The sum is 6176\nWhat is 777 + 9311?\nRunning calculator ...\nThe sum is 10088\n\
  ```\n\n`Calculator` 程序在第 5 行包含一个单行注释，在第 12–15 行包含多行注释。所有的注释都会被编译器忽略。\n\n`add()`\
  \ 函数接收两个名为 `x` 和 `y` 的整数参数，并在 `return` 语句中将它们相加（第 3–8 行）。\n\n程序的执行从 `main()` 函数开始。第\
  \ 16 行的第一条语句使用对象 `std::cout` 和重定向运算符 `<<` 显示文本 `\"What is 867 + 5309?\"` 然后是一个换行符。\n\
  \n下一行显示文本 `\"The sum is\"` 并带参数 `777` 和 `9311` 调用 `add()` 函数。程序的执行跳转到 `add()` 函数，你可以从输出中的文本\
  \ `\"Running calculator....\"` 可以看出。\n\n函数返回的整数值将同两个额外的换行符一起显示。\n\n该过程在第 18–19 行针对另一组数字重复。\n\
  \n公式 `(x+y)` 是一个表达式。你在第 4 小节“使用表达式、语句和运算符”中学习了如何创建这些数学工具。\n\n### 总结\n\n在本节中，你了解了\
  \ C++ 如何从其他类型的计算机语言演变而来并采用了一种被称为面向对象编程的方法。这种方法在计算领域非常成功，以至于……\n\n### 工作坊\n\n现在你已经学习了\
  \ C++ 程序的部分组成，可以回答几个问题并完成几个练习来巩固你的知识。\n\n#### 测验\n\n\n\n\n\n# 1. `main` 函数返回什么数据类型？\n\
  \n**A.** `void`\n\n**B.** `int`\n\n**C.** 它不返回任何类型。\n\n# 2. 大括号在 C++ 程序中起什么作用？\n\
  \n**A.** 表示函数的开始和结束\n\n**B.** 表示程序的开始和结束\n\n**C.** 弄直程序的“锯齿”\n\n# 3. 哪哪项不是函数签名的一部分？\n\
  \n**A.** 它的名称\n\n**B.** 它的参数\n\n**C.** 它的返回类型\n\n## 答案\n\n**1. B.** `main` 函数返回一个\
  \ `int`（整型）。\n\n**2. A.** 大括号标记了函数以及你在接下来的几小时内将学习的其他代码块的开始和结束。\n\n**3. C.** 函数签名由它的名称、参数以及这些参数的精确顺序组成。它不包括返回类型。\n\
  \n## 活动\n\n**1.** 重写 Motto 程序，在一个函数中显示奥尔胡斯大学（Aarhus University）的校训。\n\n**2.** 重写\
  \ Calculator 程序，在 `add()` 函数中添加名为 `z` 的第三个整数，并用两组三个数字调用该函数。\n\n要查看这些活动的解决方案，请访问此书的网站：[`cplusplus.cadenhead.org`](http://cplusplus.cadenhead.org)。\n\
  \n## 第 3 小时：创建变量和常量\n\n* *\n\n本小时你将学到：\n\n![Image](img/00002.jpeg) 如何创建变量和常量\n\n\
  ![Image](img/00002.jpeg) 如何给变量赋值并更改这些值\n\n![Image](img/00002.jpeg) 如何显示变量的值\n\n\
  ![Image](img/00002.jpeg) 如何确定一个变量需要多少内存\n\n* *\n\n### 什么是变量？\n\n变量是计算机内存中的一个位置，你可以在那里存储和检索值。你的计算机内存可以被成一排排整齐排列的小储格。每个储格都按顺序编号。每个储格的数字就是它的内存地址。\n\
  \n变量拥有地址，并被赋予描述其用途的名称。在游戏程序中，你可以创建一个名为 `score` 的变量来存储玩家的分数，创建一个名为 `zombies` 的变量来存储玩家击败的僵尸数量。变量是储格上的标签，以便在不知道实际内存地址的情况下访问它。\n\
  \n图 3.1 显示了七个地址从 101 到 107 的储格。在地址 104 处，变量 `zombies` 存储值为 17。其他储格是空的。\n\n![Image](img/00003.jpeg)\n\
  \n**图 3.1** 内存的可视化表示。\n\n### 在内存中存储变量\n\n在 C++ 中创建一个变量时，你必须告诉编译器变量的名称以及它将持有什么类型的信息，例如整数、字符或浮点数。这就是变量的类型（有时称为*数据类型*）。类型告诉编译器在内存中留出多少空间来存放变量的值。\n\
  \n内存中的每个储格可以容一个字节。如果变量的类型是两个字节，它就需要两个字节的内存。因为计算机使用字节来表示值，因此熟悉这个概念是非常重要的。\n\n在 C++\
  \ 中用 `short` 表示的短整型通常是两个字节。长整型（`long`）是四个字节，整数（`int`）可以是两个或四个字节，而 `long long` 整数是八字节。\n\
  \n文本字符在 C++ 中用 `char` 类型表示，通常大小为一个字节。在图 3.1 中，每个储格存储一个字节。两个字节的值（如短整型）可以存储在地址 106\
  \ 和 107 处。\n\n真假值存储为 `bool` 类型（Boolean 的缩写）。`true` 和 `false` 是它能持有的唯一值。\n\n* *\n\
  \n**注意**\n\n布尔变量以乔治·布尔（George Boole）命名，他是一位生活在 1815 年至 1864 年的英国数学家。他创立了布尔代数，这是一个值限于真或假的分支。他的创造构成了现代计算的基础，一直延伸到最微的数字电路。他小时候一定很擅长做是非判断题。\n\
  \n* *\n\n`short` 的大小总是小于或等于 `int`。`int` 的大小总是等于或小于 `long`。浮点数值类型则不同，将在本小时的稍后部分讨论。\n\
  \n到为止描述的常用类型大小在所有系统上并不适用。你可以使用 `sizeof()` 函数检查 C++ 中某种类型所占的大小。`sizeof` 之后的括号内应该填写类型的名称。\n\
  \n```cpp\n#include <iostream>\n\nint main() {\n    std::cout << \"The size of int:\"\
  \ << sizeof(int) << \"\\n\";\n    std::cout << \"The size of short:\" << sizeof(short)\
  \ << \"\\n\";\n    std::cout << \"The size of long:\" << sizeof(long) << \"\\n\"\
  ;\n    std::cout << \"The size of char:\" << sizeof(char) << \"\\n\";\n    std::cout\
  \ << \"The size of bool:\" << sizeof(bool) << \"\\n\";\n    std::cout << \"The size\
  \ of float:\" << sizeof(float) << \"\\n\";\n    std::cout << \"The size of double:\"\
  \ << sizeof(double) << \"\\n\";\n    std::cout << \"The size of long int:\" << sizeof(long\
  \ long) << \"\\n\";\n    return 0;\n}\n```\n\n* *\n\n**警告**\n\n此程序使用了 C++ 较新添加的特性：`long\
  \ long` 数据类型，它可以持有极大的整数。如果你的编译器在编译 `Sizer.cpp` 时报错，你可能正在使用不支持 C++11 的过旧编译器。删除第 19\
  \ 和 20 行并尝试重新编译。如果成功了，那就是问题所在，你需要更新版本的编译器。\n\n* *\n\n**有符号和无符号变量**\n\n所有整数类型都有通过关键字指定的两种种类。使用\
  \ `unsigned` 声明时它们只持有正值，而使用 `signed` 声明时它们持有正值或负值。这里是一个创建一个名为 `zombies` 的短 `int`\
  \ 变量的语句，它不持有负数：\n\n```cpp\nunsigned short zombies = 0;\n```\n\n\n\n\n该变量被赋予初始值 0。有符号和无符号整数都可以等于\
  \ 0。\n\n未指定 `signed`（有符号）或 `unsigned`（无符号）的整数被认为是有符号的。\n\n有符号和无符号整数使用相同的字节数存储。因此，无符号整数可以存储的最大数值是有符号整数能容的最大正数的两倍。`unsigned\
  \ short` 可以处理从 0 到 65,535 之间的数字。`signed short` 表示的数字有一半是负数，因此 `signed short` 表示从\
  \ –32,768 到 32,767 之间的数字。在这两种情况下，可能值的总数都是 65,535。\n\n## 变量类型\n\n除了整数变量外，C++ 类型还涵盖了浮点数和文本字符。\n\
  \n浮点数变量的值可以表示为小数值。字符变量存储单个字节，代表标准 ASCII 字符集中 256 个字符和符号之一。\n\nC++ 程序支持的变量类型如表 3.1\
  \ 所示，该表列出了变量类型、常见的内存大小以及它可以存储的可能值。将此表与在你计算机上运行 Sizer 程序的输出进行比较，寻找尺寸差异。\n\n![Image](img/00004.jpeg)\n\
  \n**表 3.1 变量类型**\n\n`short` 和 `long` 变量在 C++ 中也被称为 `short int` 和 `long int`。这两种形式在你的程序中都是可以的。\n\
  \n如表 3.1 所示，`unsigned short` 整数只能存储高达 65,535 的值，而 `signed short` 整数最多只能存储其的一半。虽然\
  \ `unsigned long long int` 整数可以存储超过 18.4 亿亿（quintillion），但这仍然是有限的。如果你需要更大的数字，必须使用\
  \ `float` 或 `double`，这将以牺牲数值精度为代价。float 和 double 可以存储极大的数字，但在大多数计算机上，只有前 7 位或 19\
  \ 位数字是有效的。额外的数字会被舍入。\n\n尽管被认为是不良的习惯，但 `char` 变量可以用作非常小的整数。每个字符都有一个数值，等于其在该字符集中的\
  \ ASCII 代码。例如，感叹号字符（`!`）的值为 33。\n\n一种名为 `auto` 的特殊变量类型将在本节稍后介绍。\n\n## 定义变量\n\n在\
  \ C++ 中，通过声明其类型、变量名并用分号结束语句来定义变量，如下例所示：\n\n```\nint highScore;\n```\n\n在同一个语句中可以定义多个变量，只要它们共享相同的类型。变量名之间应该用逗号分隔，如这些示例所示：\n\
  \n点击此处查看代码图像\n\n```cpp\nunsigned int highScore, playerScore;\n\nlong area, width,\
  \ length;\n```\n\n`highScore` 和 `playerScore` 变量都是无符号整数。第二个语句创建了三个 `long` 整数：`area`、`width`\
  \ 和 `length`。因为这些整数具有相同的类型，所以它们可以在一个语句中创建。\n\n变量名可以是大写字母、小写字母、数字和下划线（`_`）的任意组合且没有空格。法的变量名包括\
  \ `x`、`driver8` 和 `playerScore`。C++ 是大小敏感的，所以变量 `highScore` 与命名为 `highscore` 或 `HIGHSCORE`\
  \ 的变量不同。\n\n使用描述性的变量名有助于阅读程序的人理解程序。（编译器并不关心哪种）。看看以下两个代码示例，看哪一个更容易理解。\n\n示例 1\n\n\
  ```cpp\nmain()\n{\n    unsigned short x;\n    unsigned short y;\n    unsigned int\
  \ z;\n    z = x * y;\n}\n```\n\n示例 2\n\n```cpp\nmain ()\n{\n    unsigned short width;\n\
  \    unsigned short length;\n    unsigned short area;\n    area = width * length;\n\
  }\n```\n\n程序员在采用的变量命名规范上有所不同。有些人倾向于使用全小写字母，并用下划线分隔单词，例如 `high_score`、`player_score`\
  \ 和 `new_world_record`。另一些人倾向于使用小写字母，但新单词的首字母除外，例如 `highScore`、`playerScore` 和 `newWorldRecord`。（后者的命名法被称为大驼峰命名法\
  \ CamelCase，因为单词中间的大写字母看起来像骆驼的驼。）\n\n在 Linux 环境下学习的程序员倾向于使用第一种规范，而在微软世界的人则使用驼峰命名法。编译器并不关心。\n\
  \n本书中的代码遵循驼峰命名法。\n\n通过良好的变量命名和大量的注释，当你几个月或几年后回到代码前时，你的 C++ 代码将变得容易理解。\n\n* *\n\n\
  注意\n\n某些编译器允许你关闭变量名的大小敏感性。不要这样做。\n\n* *\n\n某些单词不能用作变量名，因为它们是保留字。关键字包括 `if`、`while`\
  \ 和 `for`。\n\n## 赋值\n\n使用 `=` 运算符对变量进行赋值。以下语句展示了其用法：\n\n```cpp\nint highScore;\n\
  highScore = 13000;\n```\n\n变量可以在创建时被赋予初始值：\n\n点击此处查看代码图像\n\n```cpp\nunsigned int\
  \ highScore = 13000;\n```\n\n这被称为*初始化变量*。\n\n**列表 3.2 Rectangle.cpp 的完整文本**\n\n\
  * *\n\n```cpp\n#include <iostream>\n\nint main()\n{\n    // 设置宽度和长度\n    unsigned\
  \ short width = 26, length = 40;\n\n    // 创建一个 unsigned short 并初始化为\n    // 乘以长度的结果\n\
  \    unsigned short area = width * length;\n\n    std::cout << \"Width: \" << width\
  \ << \"\\n\";\n    std::cout << \"Length: \" << length << \"\\n\";\n    std::cout\
  \ << \"Area: \" << area << \"\\n\";\n\n    return 0;\n}\n```\n\n* *\n\n该程序运行时产生以下输出：\n\
  \nWidth: 26\n\nLength: 40\n\nArea: 1040\n\n与你目前为止编写的所有程序一样，Rectangle 使用 `#include`\
  \ 指令将 `iostream` 库引入程序。这使得使用 `std::cout` 显示信息成为可能。\n\n在程序的 `main()` 块中，第 6 行创建了变量\
  \ `width` 和 `length`，并为 `width` 赋予初始值 26。在第 7 行，使用 `=` 赋值运算符为 `length` 变量赋值 40。\n\
  \n## 使用类型定义\n\n当 C++ 程序包含大量变量时，对每个变量反复编写 `unsigned short int` 会很重复。可以使用关键字 `typedef`（意为类型定义）为现有类型创建快捷方式。\n\
  \n\n\n\n\n`typedef` 需要 `typedef` 后面跟着现有类型和其新名称。这是一个示例：\n\n点击此处查看代码图片\n\n`typedef\
  \ unsigned short USHORT`\n\n此语句创建了一个名为 `USHORT` 的类型定义，它可以在程序的任何地方代替 `unsigned short`\
  \ 使用。列表 3.3 中的 `NewRectangle` 程序是 `Rectangle` 的重写版本，并使用了该类型定义。\n\n**列表 3.3 `NewRectangle.cpp`\
  \ 的全文**\n\n点击此处查看代码图片\n\n***\n\n```cpp\n1: #include <iostream>\n2:\n3: int main()\n\
  4: {\n5:     // 创建一个类型定义\n6:     typedef unsigned short USHORT;\n7:\n8:     // 设置宽度和长度\n\
  9:     USHORT width = 26;\n10:     USHORT length = 40;\n11:\n12:     // 创建一个 unsigned\
  \ short，并初始化为\n13:     // 宽度乘以长度的乘积\n14:     USHORT area = width * length;\n15:\n\
  16:     std::cout << \"Width: \" << width << \"\\n\";\n17:     std::cout << \"Length:\
  \ \"  << length << \"\\n\";\n18:     std::cout << \"Area: \" << area << \"\\n\"\
  ;\n19:     return 0;\n20: }\n```\n\n***\n\n该程序的输出与 `Rectangle` 相同：`width` (26)、`length`\
  \ (40) 和 `area` (1040) 的值。\n\n在第 6 行，创建了 `USHORT` typedef 作为 `unsigned short` 的快捷方式。在任何使用快捷方式\
  \ `USHORT` 的地方，类型定义都会替换底层的定义 `unsigned short`。\n\n在第 8 小节 的“创建基本类”中，你学习了如何在 C++\
  \ 中创建新类型。这与创建类型定义不同。\n\n***\n\n### 注意\n\n某些编译器会警告 `NewRectangle` 程序中的“转换可能会丢失有效数字”。这是因为第\
  \ 14 行中两个 `USHORT` 的乘积可能大于 `unsigned short` 整数能容纳的值。对于此程序，你可以安全地忽略该警告。\n\n***\n\n\
  ### 常量\n\n常量 变量变量，是一个存储值的内存位置。与变量不同，常量的值永远不会改变。创建常量时必须对其进行初始化。C++ 有两种类型的常量：字面量常量和符号常量。\n\
  \n字面量常量 是直接输入到程序中需要地方的值。例如，考虑以下语句：\n\n```cpp\nlong width = 19;\n```\n\n该语句将整数变量\
  \ `width` 赋值为 `19`。语句中的 `19` 是字面量常量。你不能给 `19` 赋值，它的值也无法更改。\n\n存储在 `bool` 变量中的值 `true`\
  \ 和 `false` 也是字面量常量。\n\n符号常量 是由名称表示的常量，就像变量一样。`const` 关键字位于类型、名称和初始化之前。这是一个设置击杀僵尸奖励分数的语句：\n\
  \n```cpp\nconst int KILL_BONUS = 5000;\n```\n\n每当派遣一个僵尸时，玩家的得分就可以增加奖励分：\n\n点击此处查看代码图片\n\
  \n```cpp\nplayerScore = playerScore + KILL_BONUS;\n```\n\n如果你以后决定将奖励增加到 10,000 分，你可以更改常量\
  \ `KILL_BONUS`，它将反映在整个程序中。如果你使用字面量常量 `5000`，那么找到所有使用它的地方并更改该值将更加困难。使用常量可以减少错误的可能性。\n\
  \n命名良好的符号常量还能使程序更易理解。程序员通常将常量全大写，以将它们与变量区分开。C++ 并不强制要求这样做，但常量的大小写在任何出现的语句中必须保持一致，因为该语言是大小写敏感的。\n\
  \n#### 定义常量\n\n另一种定义常量的方法可以追溯到 C 语言的早期版本（C++ 的前身）。预处理器指令`#define` 使用 `enum` 关键字跟随一系列用括号括起的名称创建一组常量：\n\
  \n```cpp\nenum Color { RED, GREEN, WHITE };\n```\n\n该语句创建了一组整数常量。枚举的值从 0 开始并递增 1，因此\
  \ `RED` 等于 0，`GREEN` 等于 1，`WHITE` 等于 2。\n\n常量也可以使用 `=`运算符指定其值：\n\n```cpp\nenum Color\
  \ { RED=100, GREEN=500, WHITE=700 };\n```\n\n这种技术的优点是你可以使用符号名称如 `RED` 而不是无意义的数字\
  \ `100`。列表 3.4 中的 `Compass` 程序使用枚举常量表示八方向，并将一个值存储在变量中。\n\n```cpp\n1: #include <iostream>\n\
  2:\n3: int main()\n4: {\n5:     // 设置枚举\n6:     enum Direction { North, Northeast,\
  \ East, Southeast,\n7:     South, Southwest, West, Northwest };\n8:\n9:     // 创建一个变量保存它\n\
  10:    Direction heading;\n11:    // 初始化该变量\n12:    heading = Southeast;\n13:\n\
  14:    std::cout << \"Moving \" << heading << std::endl;\n15:    return 0;\n16:\
  \ }\n```\n\n你可能好奇当 `heading` 变量的值发送到第 14 行的输出流时会显示什么。编译并运行程序：\n\nMoving 3\n\n###\
  \ 自动类型变量\n\n正如你所学的，C++ 中的变量必须有一个类型来指示它所包含的信息，例如 `long` 用于长整数，`bool` 用于布尔值。作为程序员，你在创建变量时确定类型：\n\
  \n```cpp\nint seconds = 86400;\n```\n\nC++ 中的 `auto` 关键字允许根据最初赋值给它的值来推断类型。编译器会找出合适的数据类型。\n\
  \n以下是一些示例：\n\n```cpp\nauto index = 3;\nauto multiple = 2.25F;\nauto rate = 500 /\
  \ 3.0;\n```\n\n\n\n\n这些语句创建了一个持有 `int` 值的 `index` 变量，一个持有 `float` 值的 `multiple`\
  \ 变量以及一个持有 `double` 值的 `rate` 变量。初始化时赋值给变量的字面量决定了其类型。\n\n在 `rate` 语句中，表达式 `500 /\
  \ 3.0` 产生一个 `double`，因为其中操作数之一是 `double` 值。（你可以在第 4 小时中学习更多关于表达式以及“使用表达式、语句和运算符”的知识。）\n\
  \n编译器决定了类型。在前面的示例中，它就好像遇到了以下语句：\n\n```cpp\nint index = 3;\nfloat multiple = 2.25F;\n\
  double rate = 500 / 3.0;\n```\n\n使用 `auto` 时，你必须在初始化时为变量赋值。\n\n只要每个变量都具有相同的数据类型，就可以使用\
  \ `auto` 关键字为多个变量赋值。\n\n`auto a = 86, b = 75, c = 30;`\n\n对于本小时的最终项目，列表 3.5 中的 `Combat`\
  \ 程序计算了类似视频游戏中角色的战斗统计。\n\n### 列表 3.5 `Combat.cpp` 的全文\n\n```cpp\n#include <iostream>\n\
  \nint main() {\n    // 定义角色值\n    auto strength = 80;\n    auto accuracy = 45.5;\n\
  \    auto dexterity = 24.0;\n\n    // 定义常量\n    const auto MAXIMUM = 50;\n\n   \
  \ // 计算角色属性\n    auto attack = strength * (accuracy / MAXIMUM);\n    auto damage\
  \ = strength * (dexterity / MAXIMUM);\n\n    std::cout << \"\\nAttack rating: \"\
  \ << attack << \"\\n\";\n    std::cout << \"Damage rating: \" << damage << \"\\\
  n\";\n}\n```\n\n由于 `auto` 关键字是在最近的 C++ 版本中添加的，你可能需要使用特殊的命令行选项编译 `Combat.cpp`。使用\
  \ `-std=c++11` 选项：\n\n```bash\ng++ -std=c++11 Combat.cpp -o Combat\n```\n\n编译成功后，程序显示：\n\
  \nAttack rating: 72.8\nDamage rating: 38.4\n\n在第 6-8 行，`strength`、`accuracy` 和 `dexterity`\
  \ 分别是 `int`、`double` 和 `double`。`attack` 和 `damage` 分别是 `double` 和 `double`。使用 `auto`\
  \ 关键字时，你必须在初始化时为变量赋值。只要每个变量都具有相同的数据类型。`long` 还是 `float` 或 `double`。在第 6-8 行是`double`。在第\
  \ 6-8 行，这些变量被赋值为 `int`。如果一个数字包含浮点值，它将是 `float` 或 `double`。\n\n### 总结\n\n`auto` 关键字简化了变量的使用，因为它让编译器决定类型。\n\
  \n在处理变量时，最大的挑战是选择正确的类型。如果使用的整数超过 65000，应该使用 `long` 而不是 `short`。\n\n### 注意\n\n本小时涵盖了如何使用变量，如整数、浮点值和常量。`auto`\
  \ 关键字在 C++ 中是冗余的。\n\n在使用变量时需要记住的是它们占据的字节数，这在不同系统中可能会有所不同。C++ 提供的 `sizeof()` 函数返回变量类型所需的字节数。\n\
  \n### 问答\n\n问：`short` 整数可能会溢出，为什么不总是使用 `long` 呢？\n\n答：`short` 整数和 `long` 整数都会溢出，但\
  \ `long` 整数在数字大得多时才会。在大多数计算机上占用双倍内存。\n\n问：如果我将一个带有小数的数字赋值给整数而不是 `float` 或 `double`\
  \ 会发生什么？考虑以下代码：\n\n```cpp\nint rating = 5.4;\n```\n\n答：某些编译器会发出警告，但 C++ 允许将小数值赋值给整数。数字会被截断为整数。\n\
  \n### 练习\n\n现在你学习了变量和常量，可以回答一些问题并进行一些练习来巩固知识。\n\n#### 测验\n\n1. 为什么要使用无符号整数代替符号整数？\n\
  A. 它包含更多的数字。\nB. 它包含更多的正数。\nC. 没有理由偏好其中任何一个。\n\n2. 变量 `ROSE`、`rose` 和 `Rose` 是同一个吗？\n\
  A. 是\nB. 否\nC. 不关你的事\n\n3. `#define` 常量与 `const` 的区别是什么？\nA. 只有前者被预处理器处理。\nB. 只有后者有类型。\n\
  C. a 和 b 都是。\n\n#### 答案\n\n1. B\n2. B\n3. C\n\n\n\n\n\n## 2. B. 因为 C++ 是区分大小写的，因此\
  \ `ROSE` 不是 `rose`，也不是 `Rose`。编译器将每个引用视为一个不同的变量。\n\n3. C. 预处理器指令 `#define` 会将指定的数值替换到代码中出现的每一个地方。它没有数据类型，并且对编译器是不可见的。使用关键字\
  \ `const` 创建的常量则具有数据类型，并由编译器处理。\n\n### 活动\n\n1. 创建一个程序，使用常量来表示达区得分（6 分）、射门得分（3 分）、达区后加分（1\
  \ 分）和安全区得分（2 分），然后按照这些球队在最后一次超级碗中得分的顺序将这些分数相加。显示最终得分。（额外加分项：让卡罗莱纳纳黑豹队获胜。）\n\n2.\
  \ 扩展矩形程序，使其能够计算具有宽度、长度和高度的三维矩形的面积。要确定面积，请使用乘法运算符 `*` 将三个值相乘。\n\n要查看这些活动的解决方案，请访问本书的网站：[`cplusplus.cadenhead.org`](http://cplusplus.cadenhead.org)。\n\
  \n## 第 4 小时。使用表达式、语句和运算符\n\n你将在本小时内学到：\n\n![Image](img/00002.jpeg) 如何编写语句\n\n![Image](img/00002.jpeg)\
  \ 如何创建表达式\n\n![Image](img/00002.jpeg) 当满足条件时如何运行代码\n\n![Image](img/00002.jpeg) 不同的运算符的作用\n\
  \n### 语句 全所有的 C++ 程序都由语句 组成，语句是以分号结尾的命令。按照惯例，每条语句占据一行，但这不是强制要求的——只要每条语句都以分号结尾，就可以将多条语句放在同一行。语句控制程序的执行顺序、评估表达式，甚至可以什么都不做（`null`\
  \ 语句）。一种常见的语句是赋值：\n\n```\nx = a + b;\n```\n\n该语句将变量 `x` 赋值为 `a + b` 的和。赋值运算符 `=`\
  \ 将运算符右侧的值赋值给左侧的变量。如果 `a` 等于 4 且 `b` 等于 13，在执行语句后 `x` 将等于 17。\n\n#### 空格\n\n在 C++\
  \ 程序的源代码中，任何空格、制表符和换行符都称为空白。编译器通常会忽略空白，其目的是让代码对程序员更具可读性。\n\n之前的赋值语句可以用以下两种方式编写，且工作原理相同：\n\
  \n点击此处查看代码图像\n\n```\nx = a + b;\n\nx      =      a      +      b\n```\n\n编译器忽略空白（或缺少空白）。变量名内部不能使用空白，因此\
  \ `player` 不能写成 `player Score`。\n\n程序中用于缩进的制表符或空格是空白。正确的缩进可以更容易看到程序块的开始和结束。\n\n\
  #### 复合语句\n\n多条语句可以组合成复合语句，复合语句以大括号 `{` 开始，以大括号 `}` 结束。复合语句可以出现在任何单独语句的地方。\n\n虽然复合语句中的每条语句都以分号结尾，但复合语句本身并不以分号结尾。这里有一个示例：\n\
  \n```\n{\n    temp = a;\n    a = b;\n    b = temp;\n}\n```\n\n此复合语句使用名为 `temp` 的变量交换了变量\
  \ `a` 和 `b` 的值。\n\n### 表达式\n\n表达式 是语句中任何返回值的部分，如这个简单的示例所示：\n\n```\nx = y + 13;\n\
  ```\n\n该语句将变量 `x` 赋值为变量 `y` 加 13。因此，如果 `y` 等于 20，`x` 就等于 33。整个语句返回 `x` 的最终值，因此它也是一个表达式。为了更好地理解，请考虑一个更复杂的语句：\n\
  \n```\nz = x = y + 13;\n```\n\n该语句包含三个表达式：\n\n- 表达式 `y + 13` 的结果存储在变量 `x` 中。\n-\
  \ 表达式 `x = y + 13` 返回 `x` 的值，并存储在变量 `z` 中。\n- 表达式 `z = x = y + 13` 返回 `z` 的最终值。\n\
  \n\n\n\n\nC++ 根据操作数的类型决定执行何种除法。如果至少有一个操作数是浮点数变量或字面量，则执行浮点数除法。否则，执行整数除法。\n\n### 组合运算符\n\
  \n给一个变量增加一个值然后将结果赋值回该变量，这并不罕见。以下表达式为名为 `score` 的变量加上 10：\n\n```cpp\nscore = score\
  \ + 10;\n```\n\n该表达式获取 `score` 的现有值，加上 10，并将结果存储在 `score` 中。\n\n使用 `+=` 自赋值加法运算符可以更简单地编写此操作：\n\
  \n```cpp\nscore += 10;\n```\n\n自赋值加运算符 `+=` 将右值加到左值，然后将结果赋值给左值。同样，还有自赋值减（`-=`）、除（`/=`）、乘（`*=`）和取模（`%=`）运算符。\n\
  \n这些自赋值运算符的作用与较长的表达式相同，因此可以根据需要使用任一种形式。\n\n### 递增和递减运算符\n\n变量最常见的加或减值是 1。将变量增加 1\
  \ 称为`递增`（incrementing），将其减少 1 称为`递减`（decrementing）。C++ 包含了 `++` 递增运算符和 `--` 递减运算符来完成这些任务：\n\
  \n```cpp\nscore++;\nzombies--;\n```\n\n这些语句分别将 `score` 增加 1 并将 `zombies` 减少 1。它们等于这些更详细的语句：\n\
  \n```cpp\nscore = score + 1;\nzombies = zombies – 1;\n```\n\n`++` 运算符读作“plus-plus”，“--”读作“minus-minus”。\n\
  \n***\n\n**注意**\n\n现在你已经接触了递增运算符，C++ 这个名字应该变得更好理解了。创始人比雅尼·斯特劳斯特普（Bjarne Stroustrup）设计\
  \ C++ 语言是为了对 C 语言进行增量改进。他像表达式一样对其命名，将递增运算符放入名称中，导致多年来无数的人在疑惑为什么它被称为“C-plus-plus”而不是“C-plus”。\n\
  \n***\n\n### 前缀和后缀运算符\n\n递增运算符 `++` 和递减运算符 `--` 既可以用于变量名之前也可以之后以实现不同的结果。放在变量名之前的运算符被称为`前缀运算符`，如下句所示：\n\
  \n```cpp\n++count;\n```\n\n放在变量名后的运算符被称为`后缀运算符`：\n\n```cpp\ncount++;\n```\n\n在像前面的示例这样的简单语句中，运算符的作用相同。在两个语句中，`count`\
  \ 变量都增加了 1。\n\n前缀和后缀运算符存在的意义在复杂的表达式中变得明显，因为在这些表达式中，变量被递增或递减并赋值给另一个变量。前缀运算符在表达式中使用变量之前发生。后缀在之后求值。\n\
  \n通过一个具体的例子会更容易理解：\n\n```cpp\nint x = 5;\nint sum = ++x;\n```\n\n在执行这些语句后，`x` 变量和\
  \ `sum` 变量都等于 6。`++x` 中的前缀运算符导致 `x` 在赋值给 `sum` 之前从 5 增加到 6。\n\n与此示例对比：\n\n```cpp\n\
  int x = 5;\nint sum = x++;\n```\n\n这导致 `sum` 等于 5，而 `x` 等于 6。后缀运算符导致 `x` 在从 5 增加到\
  \ 6 之前赋值给 `sum`。\n\n`Listing 4.2` 包含了 `Years` 程序，该程序使用前缀和后缀递增运算符向后计算几年。\n\n**列表\
  \ 4.2 `Years.cpp` 的全文**\n\n[点击此处查看代码图像]\n\n```cpp\n1: #include <iostream>\n2:\n\
  3: int main()\n4: {\n5:     int year = 2016;\n6:     std::cout << \"The year \"\
  \ << ++year << \" passes.\\n\";\n7:     std::cout << \"The year \" << ++year <<\
  \ \" passes.\\n\";\n8:     std::cout << \"The year \" << ++year << \" passes.\\\
  n\";\n9:\n10:     std::cout << \"\\nIt is now \" << year << \".\";\n11:     std::cout\
  \ << \" Have the Chicago Cubs won the World Series yet?\\n\";\n12:\n13:     std::cout\
  \ << \"\\nThe year \" << year++ << \" passes.\\n\";\n14:     std::cout << \"The\
  \ year \" << year++ << \" passes.\\n\";\n15:     std::cout << \"The year \" << year++\
  \ << \" passes.\\n\";\n16:     std::cout << \"Surely the \" << \"\\n\";\n17:   \
  \  return 0;\n18: }\n```\n\n\n\n\n[content]\n\n当优先级顺序不能满足你的需求时，可以使用括号来强制执行不同的顺序。括号内的项优先级高于任何数学运算符：\n\
  \n点击此处查看代码图像\n\n```cpp\nint totalSeconds = (minutesWork + minutesTravel) * 60;\n\
  ```\n\n此表达式将 `minutesWork` 和 `minutesTravel` 相加，将结果乘以 60，并赋值给 `totalSeconds`。\n\n\
  括号可以相互嵌套。最内层的括号最执行：\n\n点击此处查看代码图像\n\n```cpp\ntotalSeconds = ((secondsWork * 60)\
  \ + minutesTravel) * 60;\n```\n\n### 注意\n当有疑问时，使用括号使表达式的含义变得清晰。它们不会影响程序的性能，因此即使在不需要的情况下使用它们也没有坏处。\n\
  \n### 关系运算符\n\n关系运算符 用于比较，以确定两个数字是否相等，或其中一个大于或小于另一个。每个关系表达式都返回 `true` 或 `false`。关系运算符如表\
  \ 4.2 所示。\n\n![Image](img/00006.jpeg)\n\n**表 4.2 关系运算符**\n\n如果你有两个名为 `myAge` 和 `yourAge`\
  \ 的整数变量，表达式 `myAge == yourAge` 判断它们是否相等。以下语句使用了该表达式：\n\n点击此处查看代码图像\n\n```cpp\nstd::cout\
  \ << (myAge == yourAge) << \"\\n\";\n```\n\n该语句如果它们相等则显示 1，如果不相等则显示 0。\n\n### 注意事项\n\
  许多初学者 C++ 程序员会混淆赋值运算符 `=` 和相等运算符 `==`，这可能会在程序中引入难以发现的错误。当你在使用相等运算符更合适的地方使用赋值运算符时，编译器可能会给你发出警告，但有时在程序没有按照预期执行之前无法检测到该问题。\n\
  \n### If-Else 条件语句\n你目前为止创建的程序按从上上的顺序执行每行代码。`if` 关键字使得只有在满足条件时才运行代码，例如两个变量是否相等、一个变量是否大于特定值，或者\
  \ `bool` 变量的值为 `true`。\n\n以下 `if` 语句仅在名为 `zombies` 的整数满足特定条件时才显示消息：\n\n点击此处查看代码图像\n\
  \n```cpp\nif (zombies == 0)\n    std::cout << \"No more zombies!\\n\";\n```\n\n\
  如果 `zombies` 变量等于 0，此代码将显示“No more zombies!”字样。括号内的表达式是条件。如果表达式为 `true`，则执行 `if`\
  \ 之后的语句。如果为 `false`，则跳过该语句。\n\n例如，当这段代码运行时，如果 `zombies` 变量等于 25，则什么都不显示。\n\n表达式必须为\
  \ `true` 才会执行条件代码。由于 `bool` 变量可以是 `true` 或 `false`，因此可以使用它作为条件：\n\n```cpp\nbool\
  \ run = true;\n\nif (run)\n    std::cout << \"Running\\n\";\n```\n\n此代码仅当 `bool`\
  \ 变量 `run` 等于 `true` 时才显示文本“Running”。\n\n#### Else 子句\n如果 `if` 条件为真，程序可以执行一条语句；如果条件为假，则执行另一条语句。`else`\
  \ 关键字标识在条件为假时要执行的语句：\n\n点击此处查看代码图像\n\n```cpp\nif (zombies == 0)\n    std::cout <<\
  \ \"No more zombies!\\n\";\nelse\n    std::cout << \"Beware the zombie apocalypse!\\\
  n\";\n```\n\n列表 4.3 中的 Grader 程序演示了条件语句的使用。\n\n**列表 4.3** `Grader.cpp` 的全文**\n\n\
