  \ age, int weight);\n7:      ~SimpleCat();\n8:      int GetAge() { return itsAge;\
  \ }\n9:      int GetWeight() { return itsWeight; }\n10: private:\n11:      int itsAge;\n\
  12:      int itsWeight;\n13: };\n14:\n15: SimpleCat::SimpleCat(int age, int weight):\n\
  16: itsAge(age), itsWeight(weight) {}\n17:\n18: SimpleCat &FunctionTwo();\n19:\n\
  20: int main()\n21: {\n22:      SimpleCat &rCat = FunctionTwo();\n23:      int age\
  \ = rCat.GetAge();\n24:      std::cout << \"rCat is \" << age << \" years old!\"\
  \ << std::endl;\n25:      std::cout << \"&rCat: \" << &rCat << std::endl;\n26: \
  \     // How do you get rid of that memory?\n27:      SimpleCat *pCat = &rCat;\n\
  28:      delete pCat;\n29:      // Uh oh, rCat 现在指向 ??\n30:      return 0;\n31:\
  \ }\n32:\n33:\n34: SimpleCat &FunctionTwo()\n35: {\n36:      SimpleCat *pFrisky\
  \ = new SimpleCat(5,9);\n37:      std::cout << \"pFrisky: \" << pFrisky << std::endl;\n\
  38:      return *pFrisky;\n39: }\n```\n\n这里的输出是：\n\n```\npFrisky: 0x7918b0\nrCat\
  \ is 5 years old!\n&rCat: 0x7918b0\n```\n\n此程序可以编译、链接并并且看起来正常。但它是一个随时可能爆炸的定时炸弹。\n\
  \n\n\n\n\n`TheFunction()` 函数已经过更改，它不再返回局部变量的引用。内存在第 36 行在堆上分配并赋值给一个指针。程序显示该指针所持有的地址，然后对指针进行解引用并以引用方式返回\
  \ `SimpleCat` 对象。\n\n在第 23 行，`TheFunction()` 的返回值赋值给一个 `SimpleCat` 的引用，并使用该对象获取猫的年龄，该年龄在第\
  \ 25 行显示。\n\n为了证明在 `main()` 中声明的引用确实指向 `TheFunction()` 中放置在堆上的对象，对 `rCat` 应用了地址运算符。果其然，它显示了其所引用对象的地址，这与堆上对象的地址相匹配。\n\
  \n到目前为止一切正常。但那块内存将如何释放呢？你不能对引用调用 `delete`。一个巧妙的解决方案是创建另一个指针并用从 `rCat` 获取的地址对其初始化。这确实删除了内存并填补了内存泄漏。但有一个小问题：在第\
  \ 29 行之后，`rCat` 指向什么？如前所述，引用必须是实际对象的别名。如果它引用一个空对象（如现在这样），程序就是无效的。\n\n***\n\n###\
  \ 注意事项\n\n必须强调的是，一个带有空对象引用的程序可能会编译，但它是无效的，且其性能是不可预测的。\n\n***\n\n这个问题实际上有两个解决方案。第一个是返回一个指向第\
  \ 36 行创建的内存的指针。这样调用函数就可以在完成后删除该指针。要做到这一点，将 `TheFunction` 的返回值更改为指针（而不是引用），并返回指针，而不是解引用后的指针：\n\
  \n点击此处查看代码图像\n\n```cppSimpleCat *TheFunction()\n{\n    SimpleCat *pFrisky = new\
  \ SimpleCat(5,9);\n    std::cout << \"pFrisky: \" << pFrisky << \"\\n\";\n    return\
  \ pFrisky; // 返回指针\n}\n```\n\n更好的解决方案是在调用函数中声明对象，然后通过引用将它传递给 `TheFunction()`。这种方法的优点是，分配内存的函数（即调用函数）也是负责释放内存的函数。\n\
  \n### 指针，指针，谁拥有指针？\n\n当你的程序在堆上分配内存时，会返回一个指针。你必须保留指向该内存的指针，因为指针丢失后，内存将无法删除并变成内存泄漏。\n\
  \n当你在函数之间传递这块内存时，其中一个函数“拥有”该指针。通常，内存块中的值通过引用传递，而创建内存块的函数负责删除它的。但这是一个通用规则，并不是不可逾越的规定。\n\
  \n然而，让一个函数在内存中创建空间而另一个函数来释放它是危险的。关于谁拥有指针的歧义可能导致两个问题之一：忘记删除指针或重复删除。其中任何一个都可能导致你的程序出现严重问题。更安全的方法是构建函数，让它们删除自己创建的内存空间。\n\
  \n如果你编写了一个需要创建内存块并将其传回调用函数的函数，考虑更改你的接口。让调用函数分配内存，然后通过引用将其传递到你的函数中。这把所有的内存管理移出了你的函数，交给了准备好删除它的函数。\n\
  \n### 总结\n\n通过本节的学习，你现在应该已经熟悉 C++ 中创建指针和引用的方式，并理解它们的优缺点。\n\n指针是一个持有内存地址的变量，而引用是一个别名。\n\
  \n两者都提供了间接形式，使得函数更加强大、更功能化。但在许多情况下，你会发现引用是更好的选择。\n\n### 问答\n\n**Q. 既然引用更易用，为什么还需要指针？**\n\
  \n**A.** 引用不能为 `NULL` 且不能重新赋值。指针提供了更大的活性，但使用起来稍微难一点。\n\n**Q. 为什么要从函数中按值返回？**\n\n\
  **A.** 如果返回的对象是局部的，你必须按值返回，否则你返回的是一个不存在对象的引用。\n\n**Q. 鉴于按引用返回的危险，为什么不总是按值返回？**\n\
  \n**A.** 按引用返回的效率高得多。可以节省内存并让程序运行更快。\n\n**Q. 我可以去哪所大学成为一名小丑？**\n\n**A.** 一个地方是俄亥州小丑学院（Ohio\
