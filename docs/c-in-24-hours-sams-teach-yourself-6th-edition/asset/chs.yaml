  \n### 抽象数据类型\n\n通常，你经常一起创建一个类层级结构。例如，你可能会创建一个 `Shape` 类作为基类，以此派生 `Rectangle` 和 `Circle`。从\
  \ `Rectangle`，你可能还会派生 `Square` 作为 `Rectangle` 的一种特例。\n\n每个派生类都重写了 `draw()` 成员函数、`getArea()`\
  \ 函数等。列表 18.3 演示了 `Shape` 类及其派生类 `Circle` 和 `Rectangle` 类的简易实现。\n\n**列表 18.3 `Shape.cpp`\
  \ 的全文**\n\n点击此处查看代码图像\n\n\n\n\nListing 18.4 中的 `Shape2` 程序将 `Shape` 定义为抽象数据类型（ADT），并包含了对纯虚函数\
  \ `draw()` 的实现。`Circle` 类重写了 `draw()`（这是必须的），然后链式调用基类函数以获取额外的功能。\n\n在这个示例中，额外的功能仅仅是显示了一条额外的消息。一个更健壮的图形类可以设置一个共享的绘制机制，例如设置一个所有派生类都使用的窗口。\n\
  \n### 列表 18.4 `Shape2.cpp` 的完整文本\n\n点击此处查看代码\n\n```cpp\n#include <iostream>\n\n\
  class Shape\n{\npublic:\n    Shape() {}\n    virtual ~Shape() {}\n    virtual long\
  \ getArea() = 0;\n    virtual long getPerim()= 0;\n    virtual void draw() = 0;\n\
  private:\n};\n\nvoid Shape::draw()\n{\n    std::cout << \"Abstract drawing mechanism!\\\
  n\";\n}\n\nclass Circle : public Shape\n{\npublic:\n    Circle(int newRadius):radius(newRadius)\
  \ {}\n    ~Circle() {}\n    long getArea() { return 3 * radius * radius; }\n   \
  \ long getPerim() { return 9 * radius; }\n    void draw();\nprivate:\n    int radius;\n\
  \    int circumference;\n};\n\nvoid Circle::draw()\n{\n    std::cout << \"Circle\
  \ drawing routine here!\\n\";\n    Shape::draw();\n}\n\nclass Rectangle : public\
  \ Shape\n{\npublic:\n    Rectangle(int newLen, int newWidth):\n        length(newLen),\
  \ width(newWidth) {}\n    virtual ~Rectangle() {}\n    long getArea() { return length\
  \ * width; }\n    long getPerim() { return 2 * length + 2 * width; }\n    virtual\
  \ int getLength() { return length; }\n    virtual int getWidth() { return width;\
  \ }\n    void draw();\nprivate:\n    int width;\n    int length;\n};\n\nvoid Rectangle::draw()\n\
  {\n    for (int i = 0; i < length; i++)\n    {\n        for (int j = 0; j < width;\
  \ j++)\n            std::cout << \"x \";\n\n        std::cout << \"\\n\";\n    }\n\
  \    Shape::draw();\n}\n\nclass Square : public Rectangle\n{\npublic:\n    Square(int\
  \ len);\n    Square(int len, int width);\n    ~Square() {}\n    long getPerim()\
  \ {return 4 * getLength();}\n};\n\nSquare::Square(int newLen):\n    Rectangle(newLen,\
  \ newLen)\n{}\n\nSquare::Square(int newLen, int newWidth):\n    Rectangle(newLen,\
  \ newWidth)\n{\n    if (getLength() != getWidth())\n        std::cout << \"Error,\
  \ not a square ... a rectangle?\\n\";\n}\n\nint main()\n{\n    int choice;\n   \
  \ bool fQuit = false;\n    Shape * sp;\n\n    while (1)\n    {\n        std::cout\
  \ << \"(1) Circle (2) Rectangle (3) Square (0) Quit: \";\n        std::cin >> choice;\n\
  \n        switch (choice)\n        {\n        case 1:\n            sp = new Circle(5);\n\
  \            break;\n        case 2:\n            sp = new Rectangle(4, 6);\n  \
  \          break;\n        case 3:\n            sp = new Square(5);\n          \
  \  break;\n        default:\n            fQuit = true;\n            break;\n   \
  \     }\n        if (fQuit)\n            break;\n        sp->draw();\n        std::cout\
  \ << \"\\n\";\n    }\n    return 0;\n}\n```\n\n再次，用户被询问创建哪些形状。以下是示例输出：点击此处查看代码\n\
  \n```\n(1) Circle (2) Rectangle (3) Square (0) Quit: 3\nx x x x x\nx x x x x\nx\
  \ x x x x\nx x x x x\nx x x x x\nAbstract drawing mechanism!\n(1) Circle (2) Rectangle\
  \ (3) Square (0) Quit: 2\nx x x x x x\nx x x x x x\nx x x x x x\nx x x x x x\nAbstract\
  \ drawing mechanism!\n(1) Circle (2) Rectangle (3) Square (0) Quit: 0\n```\n\n在第\
  \ 3–12 行，声明了抽象数据类型 `Shape`，其三个访问器都被声明为纯虚。注意，这并不是必要的。如果其中任何一个被声明为纯虚，该类就会成为一个 ADT。但良好的编程习惯是不依赖于此：在\
  \ ADT 中将所有应该是虚的函数声明为虚。\n\n`getArea()` 和 `getPerim()` 成员函数没有实现，但 `draw()` 实现了。`Circle`\
  \ 和 `Rectangle` 都重写了 `draw()` 并都调用了基类成员函数，利用了基类中的共享功能。\n\n#### 抽象的复杂层次结构\n\n有时，你会从其他\
  \ ADT 派生 ADT。你可能希望让某些派生的纯虚函数变为非纯虚，而另一些保持纯虚。\n\n如果你创建一个 `Animal` 类，你可以让 `eat()`、`sleep()`、`move()`\
  \ 和 `reproduce()` 设为虚函数。可能你想从 `Animal` 派生 `Mammal` 和 `Fish`。\n\n事实上，你可能决定让 `Mammal`\
  \ 以相同的方式繁殖，并将 `eat()`、`sleep()` 和 `move()` 设为纯虚。从 `Mammal` 派生 `Dog`，而 `Dog` 必须重写并实现这三个纯虚函数。\n\
  \n作为设计者，你认为 `Animal` 或 `Mammal` 对象不能实例化，但 `Dog` 对象可以继承提供的 `reproduce()` 函数。\n\n\
  `Animal` 类 类通过这些类的简单实现展示了这种技术。\n\n### 列表 18.5 `Animal.cpp` 的完整文本\n\n点击此处查看代码\n\n\
