  ;\n    }\n    return 0;\n}\n```\n\n这里是运行的示例输出：\n```\n(1) Dog (2) Horse (3) Fish\
  \ (0) Quit:\nAnimal constructor ...\nMammal constructor ...\nDog constructor ...\n\
  Whoof!\nDog eating ...\nDogs reproducing ...\nDog running...\nDog snoring ...\n\
  Dog destructor ...\nMammal destructor ...\nAnimal destructor ...\n(1) Dog (2) Horse\
  \ (3) Fish (0) Quit:\n```\n\n在第 5–19 行中，声明了抽象数据类型 `Animal`。`Animal` 拥有针对 `age` 的非纯虚拟访问器，这些访问器被所有\
  \ `Animal` 对象共享。它五个纯虚函数：`sleep()`、`eat()`、`reproduce()`、`move()` 和 `speak()`。\n\n\
  `Mammal` 继承自 `Animal`，并在第 27–35 行中声明。它没有添加任何数据。然而，它重写了 `reproduce()`，为所有 `Mammal`\
  \ 对象提供了一种共同的繁殖形式。`Fish` 必须重写 `reproduce()`，因为 `Fish` 直接派自 `Animal`，无法利用 `Mammal`\
  \ 的繁殖机制。\n\n`Mammal` 类不再需要重写 `reproduce()` 函数，但如果它们选择，也可以自由这样做（如 `Dog` 在第 94–95\
  \ 行中所示）。`Fish`、`Horse` 和 `Dog` 都重写了剩余的纯虚函数，以便这些类型的对象可以实例化。\n\n在程序体中，使用 `Animal`\
  \ 指针轮流指向各种派生对象。调用虚成员函数时，根据指针的运行时绑定在派生类中调用正确的函数。\n\n尝试实例化 `Animal` 或 `Mammal` 将导致编译时错误，因为它们都是抽象数据类型。\n\
  \n### 哪些类型是抽象的？\n\n在一个程序中，`Animal` 类是抽象的；在另一个程序中它却不是。是什么决定了是否使一个类变为抽象类？\n\n这个问题的答案并不取决于任何现实世界的内在因素，而是取决于你的程序设计中的逻辑。如果你正在编写一个描绘农场或动物园的程序，你可能希望\
  \ `Animal` 是一个抽象数据类型，而 `Dog` 是一个可以从中实例化对象的类。\n\n相反，如果你正在制作一个动画犬舍，你可能希望将 `Dog` 保持为抽象数据类型，并且只实例化狗的类型：金毛寻回犬、梗犬等。抽象程度取决于你需要多精细地区分你的类型。\n\
  \n### 总结\n\n在这一小时中，你学习了抽象数据类型和纯虚函数，这是 C++ 语言的两个方面，使得它对面向对象编程的支持更加健壮。\n\n抽象数据类型是一个无法实现为对象的类。相反，它为它的派生类定义了共同的成员变量和函数。\n\
  \n通过声明末尾添加 `= 0`，函数就变成了纯虚函数。如果一个类包含至少一个纯函数，该类就是抽象数据类型。\n\n编译器不允许实例化抽象数据类型的对象。\n\n\
  ### 问答\n\n**Q. 为什么动态类型转换（dynamic casting）不好？**\n\n**A.** 虚函数的意义在于让虚函数表 own 程序员来决定对象的运行时类型。\n\
  \n**Q. 为什么要费力创建抽象数据类型？为什么不让它非抽象并避免创建该类型的对象？**\n\n**A.** C++ 中许多规范的目的是利用编译器来发现错误。通过赋予纯函数使类变为抽象，可以让编译器将任何创建的对象标记为错误。\n\
  \n**Q. 有人研究过贡梅拉岛使用的哨声语言 Silbo 吗？**\n\n**A.** 关于该主题最好的参考是《Whistled Languages》，由 R.\
  \ Busnel 和 A. Classe 于 1976 年编写，许多公共图书馆都有。\n\n### 工作\n\n在学习了更多多态后，回答几个问题并做一些练习以巩固知识。\n\
  \n#### 测验\n\n1. **基类中的虚成员函数和重写成员函数有区别吗？**   - 是\n   - 否\n   - 回复模糊，再试\n\n2. **是什么让抽象数据类型变成抽象的？**\n\
  \   - `abstract` 关键字\n   - 它至少包含一个纯虚函数\n   - 它全是纯虚函数\n\n3. **提供仅适用于特定派生类的基类成员函数可以吗？**\n\
  \   - 是\n   - 否\n   - 取决而定\n\n#### 答案\n\n1. **A.** 虚函数期望在派生类中被重写。重写函数不需要在派生类中。\n\
  2. **B.** 该类是抽象的，因为它至少有一个无法直接调用的纯虚函数。由于该函数，你无法创建该类的具体实例，必须从该抽象类派生一个具有适当成员函数的类并从派生类进行实例化。\n\
  \n\n\n\n\n### B. 仅适用于某些类的基类成员函数使得使用派生对象变得困难。只有在检查每个对象的数据类型后才能调用该函数。\n\n#### 活动\n\
  \n1. 修改列表 18.5 中的 Animal 程序，以实例化 `Animal` 或 `Mammal` 类型的对象。编译器告诉了你什么？为什么？\n\n2.\
  \ 修改列表 18.2 中的 `Mammal13` 程序，查看如果移除第 56–59 行的 `if` 测试并在所有情况下调用 `purr()` 成员函数会发生什么。哪些对象可以正常工作，哪些会失败？\n\
