  \n面向对象编程侧重于将集成的数据和功能作为离散单元，这些单元既有知识（数据）又具有能力（函数）。\n\n在熟悉面向对象编程方法论的基础上，加上在编写第一行代码之前投入时间进行程序设计过程，对于开发稳健且高效的\
  \ C++ 软件是必要的。\n\n### 问答\n\n**Q. 面向对象编程最终是解决所有编程问题的“银弹”吗？**\n\n`A. 是的！所有编程中最严峻的挑战都能迎刃而解。让街道、酒吧和计算机实验室充满欢声吧。OOP\
  \ 的光辉时代已经到来，并将持续千上万年。`\n\n`抱歉。我刚才有点说过头了。`\n\n当然，编程中的任何方法论都不会解决所有问题。但是对于大型复杂的问题，面向对象的分析、设计和编程可以为程序员提供工具，以以前无法实现的方式管理巨大的复杂性。\n\
