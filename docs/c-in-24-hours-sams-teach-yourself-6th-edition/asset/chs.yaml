  \ 1\nWoof!\n\n(0) Quit (1) Dog (2) Cat (3) Horse: 2\n(1) Speak (2) Move: 1\nMeow!\n\
  \n(0) Quit (1) Dog (2) Cat (3) Horse: 3\n(1) Speak (2) Move: 2\nGalloping ...\n\n\
  (0) Quit (1) Dog (2) Cat (3) Horse: 0\n```\n\n在第 5–14 行，定义了抽象数据类型 `Mammal`，它包含纯虚成员函数\
  \ `speak()` 和 `move()`。`Mammal` 被派生为 `Dog`、`Cat` 和 `Horse`，每个子类都重写了 `speak()` 和\
  \ `move()`。\n\n`main()` 函数要求用户选择要创建哪种类型的动物，然后在第 49–63 行的 `switch` 块中创建一个新的 `Animal`\
  \ 子类实例并将其赋值给 `ptr`。\n\n随后，系统提示用户调用哪个函数，并将该函数赋值给指针 `pFunc`。在第 79 行，通过所创建的对象调用选定的函数，其中使用指针\
  \ `ptr` 访问对象，使用 `pFunc` 访问函数。\n\n最后，在第 80 行，对指针 `ptr` 调用 `delete`，将为对象分配的内存返回堆堆。\n\
  \n***\n\n### 注意\n\n没有理由对 `pFunc` 调用 `delete`，因为它是指向代码的指针，而不是堆上对象的指针。事实上，尝试这样做会导致编译错误。\n\
  \n### 成员函数指针数组\n\n与函数指针一样，成员函数指针也可以存储在数组中。该数组可以用各种成员函数的地址初始化，并通过数组中的偏移量来调用这些函数。列表\
  \ 20.9 说明了这种技术。\n\n**列表 20.9 `MPFunction.cpp` 的全文**\n\n点击此处查看代码图像\n\n***\n\n```cpp\n\
  #include <iostream>\n\nclass Dog\n{\npublic:\n    void speak() const { std::cout\
  \ << \"Woof!\\n\"; }\n    void move() const { std::cout << \"Walking to heel ...\\\
  n\"; }\n    void eat() const { std::cout << \"Gobbling food ...\\n\"; }\n    void\
  \ growl() const { std::cout << \"Grrrrr\\n\"; }\n    void whimper() const { std::cout\
  \ << \"Whining noises ...\\n\"; }\n    void rollOver() const { std::cout << \"Rolling\
  \ over ...\\n\"; }\n    void playDead() const { std::cout << \"Is the end of Caesar?\\\
  n\"; }\n};\n\ntypedef void (Dog::*PDF)() const;\n\nint main()\n{\n    const int\
  \ maxFunc = 7;\n    PDF dogFunctions[maxFunc] = {\n        &Dog::speak,\n      \
  \  &Dog::move,\n        &Dog::eat,\n        &Dog::growl,\n        &Dog::whimper,\n\
  \        &Dog::rollOver,\n        &Dog::playDead\n    };\n\n    Dog* pDog =0;\n\
  \    int method;\n    bool fQuit = false;\n\n    while (!fQuit)\n    {\n       \
  \ std::cout << \"(0) Quit (1) Speak (2) Move (3) Eat (4) Growl\\n\";\n        std::cout\
  \ << \"(5) Whimper (6) Roll Over (7) Play Dead: \";\n        std::cin >> method;\n\
  \        if (method == 0)\n        {\n            fQuit = true;\n            break;\n\
  \        }\n        else\n        {\n            pDog = new Dog;\n            (pDog->*dogFunctions[method\
  \ - 1])();\n            delete pDog;\n        }\n        std::cout << std::endl;\n\
  \    }\n    return 0;\n}\n```\n\n***\n\n该程序产生了以下输出：\n\n点击此处查看代码图像\n\n```\n(0) Quit\
  \ (1) Speak (2) Move (3) Eat (4) Growl\n(5) Whimper (6) Roll Over (7) Play Dead:\
  \ 3\nGobbling food ...\n(0) Quit (1) Speak (2) Move (3) Eat (4) Growl\n(5) Whimper\
  \ (6) Roll Over (7) Play Dead: 5\nWhining noises ...\n(0) Quit (1) Speak (2) Move\
  \ (3) Eat (4) Growl\n(5) Whimper (6) Roll Over (7) Play Dead: 6\nGalloping ...\n\
  ```\n\n\n\n\n\n## 3. 在用完函数指针后，何时应该调用 `delete`？\n\n**A.** 总是\n\n**B.** 永远不\n\n**C.**\
  \ 有时\n\n### 答案\n\n**1. B.** 对于该类的所有对象，只实例化了一个版本。\n\n**2. A.** `static` 关键字使得成员变量和函数对于整个类来说都是静态的。\n\
  \n**3. B.** 与存储内存地址的指针不同（后的指针在不再需要时应该被删除），函数指针指向的是代码，无法通过 `delete` 释放内存。\n\n###\
