  \n要查看这些活动的解决方案，请访问本书的网站 `http://cplusplus.cadenhead.org`。\n\n## 第 23 小时。创建模板\n\n\
  ***\n\n本小时你将学到：\n\n- 什么是模板以及如何使用它们\n- 为什么模板是宏更好的替代方案\n- 如何创建类模板\n\n***\n\n### 什么是模板？\n\
  \n在`第 19 小时`“在链表中存储信息”中，你学习了如何制作链表。你的列表是封装的：列表只知道它的头指针；头指针将其工作委托给内部指针，依此类推。\n\n\
  链表的一个设计缺陷是，它只知道如何处理创建它时使用的类型。如果你想在链表中放入其他任何内容，你是做不到的。例如，你无法创建一个 `Car` 对象列表、`Robot`\
  \ 对象列表或任何与原始列表类型不同的对象列表。\n\n解决此问题的旧方法是为每种数据类型创建新版本的列表。更面向对象的方法是创建一个 `List` 基类并从中派生出\
  \ `RobotList`。然后你可以将 `LinkedList` 类的大部分剪贴到新的 `RobotList` 声明中。然而，将来，当你想创建一个 `Car`\
  \ 对象的列表时，你必须创建一个新类并重复大部分代码。\n\n这两种方法都不是满意的解决方案。随着时间的推移，`List` 类及其派生类将必须不断扩展。确保所有的更改传播到所有类中将是一场噩梦。\n\
  \n`模板` 是 C++ 中引入较新的特性，为该问题提供了解决方案。与旧式的宏不同，模板是语言的集成部分，是类型安全的且非常灵活。\n\n模板允许你创建一个通用类，并将类型作为参数传递给模板，以构建参数化类型的特定实例。\n\
  \n### 模板的实例\n\n从类创建对象或从模板创建特定类型的行为被称为**实例化**（instantiation），而单独的类被称为模板的**实例**（instances）。\n\
  \n### 模板定义\n\n你使用 `template` 关键字来声明一个参数化的 `List` 对象（即一个用于列表的模板），如此代码所示：\n\n```cpp\n\
  template <class T> // 声明模板和参数\nclass List // 被参数化的类\n\n{\npublic:\n    List();\n\
  \    // 此处是完整的类声明\n};\n```\n\n\n\n关键字 `template` 用于每个模板类声明和定义的开头。`template` 的参数跟在关键字\
  \ `template` 之后；它们是会随每个实例而改变的项目。例如，在本文代码所示的列表模板中，存储在列表中对象的类型将会改变。一个实例可能存储 `Integer`\
  \ 对象的列表，另一个实例可能存储 `Animal` 对象的列表。\n\n在这段代码中，使用了 `class` 关键字，后紧跟标识符 `T`。`class` 关键字表示该参数是一个类型。标识符\
  \ `T` 在模板定义的其余部分中被用于引用该参数化类型。该类的某个实例会将 `T` 出现的地方替换为 `int`，而另一个实例将将其替换为 `Robot`。\n\
  \n要声明参数化列表类的 `int` 实例和 `Robot` 实例，你可以编写如下代码：\n\n```cpp\nList<int> intList;\nList<Robot>\
  \ robotList;\n```\n\n对象 `intList` 的类型是整数列表；对象 `robotList` 是 `Robot` 对象的列表。现在你可以在任何通常使用类型的地方使用\
  \ `List<int>` 类型——例如作为函数的返回值、函数的参数等。\n\n`ParamList` 程序（列表 23.1）对 `List` 对象进行了参数化。这是构建模板的一种极佳技术：让你的对象在单一类型上运行，正如我们在第\
  \ 19 节中所做的那样。然后通过参数化，泛化你的对象以处理任何类型。\n\n### 列表 23.1 `List.cpp` 的全文\n\n点击此处查看代码图像\n\
