  \ (myAge == yourAge) << \"\\n\";\n```\n\n该语句如果它们相等则显示 1，如果不相等则显示 0。\n\n### 注意事项\n\
  许多初学者 C++ 程序员会混淆赋值运算符 `=` 和相等运算符 `==`，这可能会在程序中引入难以发现的错误。当你在使用相等运算符更合适的地方使用赋值运算符时，编译器可能会给你发出警告，但有时在程序没有按照预期执行之前无法检测到该问题。\n\
  \n### If-Else 条件语句\n你目前为止创建的程序按从上上的顺序执行每行代码。`if` 关键字使得只有在满足条件时才运行代码，例如两个变量是否相等、一个变量是否大于特定值，或者\
  \ `bool` 变量的值为 `true`。\n\n以下 `if` 语句仅在名为 `zombies` 的整数满足特定条件时才显示消息：\n\n点击此处查看代码图像\n\
  \n```cpp\nif (zombies == 0)\n    std::cout << \"No more zombies!\\n\";\n```\n\n\
  如果 `zombies` 变量等于 0，此代码将显示“No more zombies!”字样。括号内的表达式是条件。如果表达式为 `true`，则执行 `if`\
  \ 之后的语句。如果为 `false`，则跳过该语句。\n\n例如，当这段代码运行时，如果 `zombies` 变量等于 25，则什么都不显示。\n\n表达式必须为\
  \ `true` 才会执行条件代码。由于 `bool` 变量可以是 `true` 或 `false`，因此可以使用它作为条件：\n\n```cpp\nbool\
  \ run = true;\n\nif (run)\n    std::cout << \"Running\\n\";\n```\n\n此代码仅当 `bool`\
  \ 变量 `run` 等于 `true` 时才显示文本“Running”。\n\n#### Else 子句\n如果 `if` 条件为真，程序可以执行一条语句；如果条件为假，则执行另一条语句。`else`\
  \ 关键字标识在条件为假时要执行的语句：\n\n点击此处查看代码图像\n\n```cpp\nif (zombies == 0)\n    std::cout <<\
  \ \"No more zombies!\\n\";\nelse\n    std::cout << \"Beware the zombie apocalypse!\\\
  n\";\n```\n\n列表 4.3 中的 Grader 程序演示了条件语句的使用。\n\n**列表 4.3 `Grader.cpp` 的全文**\n\n点击此处查看代码图像\n\
  \n```cpp\n1: #include <iostream>\n2:\n3: int main()\n4: {\n5:     int grade;\n6:\
  \     std::cout << \"Enter a grade (1–100): \";\n7:     std::cin >> grade;\n8:\n\
  9:     if (grade >= 70)\n10:         std::cout << \"\\nYou passed. Hooray!\\n\"\
  ;\n11:     else\n12:         std::cout << \"\\nYou failed. Sigh.\\n\";\n13:\n14:\
  \     return 0;\n15: }\n```\n\n你目前为止编写的所有程序都使用了 `std::cout`，这是标准 C++ 库中的一个对象，用于显示信息。第\
  \ 1 行的指令使该对象在程序可用。Grader 程序使用了输入输出库中的另一个对象 `std::cin`，它从用户处收集信息。第 6 行显示了一个查询。\n\n\
  #### 复合语句\n复合语句可以放在任何单条语句可以的地方。大括号用于包裹多条语句，形成一个逻辑块。例如：\n\n```cpp\nif (zombies ==\
  \ 0)\n{\n    std::cout << \"No more zombies!\\n\";\n    score += 5000;\n}\n```\n\
  \n此代码在 `zombies` 等于 0 时执行两个操作：显示“No more zombies!”并将 `score` 增加 5000。如果 `zombies`\
  \ 不等于 0，则这些操作都不会执行。\n\n\n\n编译器允许这样做，并且这使得 `if` 和 `else` 代码块在视觉上更加容易区分。它还避免了当单条语句通过添加新行变成复合语句时，由于程序员忘记将其封装在大括号内而可能发生的错误。\n\
  \n***\n\n### 注意\n\n请记住，空格和缩进对你这个程序员来说是有意义的，但对编译器来说完全没有意义。它不在乎 `if` 语句是如何对齐的。\n\n\
  ***\n\n### 逻辑运算符\n\n到为止使用的 `if`-`else` 条件判断都使用单个表达式作为条件。使用逻辑运算符 `&&`（也称为 `AND` 与）和\
  \ `||`（`OR` 或）可以测试多个条件。逻辑运算符 `!`（`NOT` 非）测试表达式是否为假。这些运算符列在表 4.3 中。\n\n![Image](img/00007.jpeg)\n\
  \n**表 4.3 逻辑运算符**\n\n#### AND 运算符\n\n逻辑 `AND` 运算符评估两个表达式。如果两个表达式都为真，则逻辑 `AND` 表达式也为真。考虑这条语句：\n\
  \n```cpp\nif ((x == 5) && (y == 5))\n    // 执行某些操作\n```\n\n如果 `x` 和 `y` 都等于 5，则表达式为真。如果\
  \ `x` 或 `y` 有一个不等于 5，则表达式为假。只有当双方都真时，整个表达式才为真，条件语句才会执行。\n\n#### OR 运算符\n\n逻辑 `OR`\
  \ 运算符评估两个表达式，如果其中一个为真，则表达式为真：\n\n```cpp\nif ((x == 5) || (y == 5))\n    // 执行某些操作\n\
  ```\n\n如果 `x` 或 `y` 等于 5 或者都等于 5，则表达式为真。事实上，如果 `x` 等于 5，编译器根本不会检查 `y`。\n\n#### NOT\
  \ 运算符\n\n逻辑 `NOT` 语句反转普通表达式的值，如果表达式为假则返回真，如果表达式为真则返回假。这里有一个使用该运算符的语句：\n\n```cpp\n\
  if (!(grade < 70))\n```\n\n如果 `grade` 大于或等于 70，该表达式为真，否则为假。`Grader` 和 `NewGrader`\
  \ 程序使用表达式 `grade >= 70` 来检查及格分数。这个 `NOT` 表达式通过寻找不小于 70 的分数来实现相同的功能。\n\n#### 关系优先级\n\
  \n关系运算符和逻辑运算符与其他运算符一样，返回真或假的值，并具有决定哪些关系先被评估的优先级。在确定如下语句的值时，这一事实非常重要：\n\n```cpp\n\
  if (x > 5 && y > 5 || z > 5)\n```\n\n逻辑 `AND` 和 `OR` 运算符具有相同的优先级，因此它们按照从左到右的顺序评估。要使这个表达式为真，`x`\
  \ 和 `y` 必须大于 5，或者 `z` 大于 5。\n\n可以使用括号来强制不同的顺序：\n\n点击此处查看代码图片\n\n```cpp\nif (x >\
  \ 5 && (y > 5 || z > 5))\n```\n\n要使这个表达式为真，`x` 必须大于 5，且 `y` 或 `z` 必须有一个大于 5。\n\n\
  ***\n\n### 注意\n\n在复杂的逻辑表达式中使用额外的括号是一个很好的主意，只为了明确语句在做什么。逻辑运算符从左到右的优先级编译器来说很容易理解，但对程序员来说并不总是清晰。目标始终应该是编写出运行正常且易于理解的程序。\n\
  \n***\n\n### 复杂的表达式值\n\n表达式产生真或假的值。在 C++ 中，值 0 也被视为假，任何其他值都视为真。某些 C++ 程序员在 `if`\
  \ 语句利用了这一特性：\n\n点击此处查看代码图片\n\n```cpp\nif (zombies)\n    std::cout << \"There are\
  \ \" << x << \" zombies left\\n\";\n```\n\n当 `zombies` 等于 0 时，`if` 表达式为假，不显示僵尸数量。当\
  \ `zombies` 等于任何其他数字时，表达式为真并显示数量。这段代码与以下代码相同：\n\n点击此处查看代码图片\n\n```cpp\nif (zombies\
  \ != 0)\n    std::cout << \"There are \" << x << \" zombies left\\n\";\n```\n\n\
  两种语句在 C++ 中都是允许的，但后者更清晰。良好的编程习惯是将前者方法预留给真正的逻辑测试，而不是用于测试非零值。\n\n这两条语句也是等价的：\n\n```cpp\n\
  if (!x)\nif (x == 0)\n```\n\n当 `x` 等于 0 时，两条语句都为真。第二条语句稍微更容易理解。\n\n### 总结\n\n在这个小时里，你学习了语句、表达式和运算符，这些是\
  \ C++ 程序的构建基础。\n\n语句是执行特定任务的单行代码。一个程序由成百、上千甚至数百万语句组成。每条语句都以分号结束。\n\n表达式是产生值的语句或语句的一部分。\n\
  \n运算符是引起动作、赋值值、执行数学运算和比较值的符号。\n\n`if`-`else` 条件判断仅在条件为真时执行语句。\n\n### 问答\n\n现在你已经学习了表达式和语句，是时候你回答几个问题并做一些练习来巩固这些主题的知识了。\n\
  \n#### 测验\n\n1. `x++` 和 `++x` 有什么区别？\n\nA. 它们在不同的时间增加 `x` 的值。\n\nB. 后一种形式在 C++ 中是不允许的。\n\
  \nC. 一个是猫向左跑，另一个是向右跑。\n\n2. 左值（l-value）和右值（r-value）有何区别？\n\nA. 只有右值可以用在表达式中。\n\n\
  B. 某些右值不是左值，但所有左值都是右值。\n\nC. a 和 b。\n\n3. 取模运算符 `%` 做什么？\n\nA. 它执行整数除法。\n\n\n\n\n\
  \n**B.** 它产生整数除法的余数。\n\n**C.** 它产生一个数字的平方根。\n\n#### 答案\n\n**1. A.** 前者使用后置运算符，后者使用前置运算符。后置在递增\
  \ `x` 之前求值 `x`，而前置在求值 `x` 之前递增。选择后置或前置会影响 `x` 在表达式中使用的值。\n\n**2. B.** 左值（l-value）出现在\
  \ `=` 赋值运算符的左侧，而右值（r-value）出现在右侧。所有的左值也可以出现在运算符的右侧，但某些右值（如字面量）不能作为左值。\n\n**3. B.**\
  \ 它在对提供的操作数执行整数除法后计算余数。\n\n#### 活动\n\n**1.** 创建一个 `NewGrader` 程序的版本，除了最后一个 `return`\
  \ 语句外，不包含任何 `return` 语句。使用大量的测试值运行它，直到发现错误，然后弄明为什么发生这种情况。\n\n**2.** 编写一个程序，询问用户\
  \ 1 到 100 之间的成绩，询问在同一刻度下及格分是多少，并报告用户是否及格。\n\n要查看这些活动的解决方案，请访问本书的网站 [`cplusplus.cadenhead.org`](http://cplusplus.cadenhead.org)。\n\
  \n## 第 5 小时：调用函数\n\n你将在这一小时学到：\n\n![Image](img/00002.jpeg) 函数的作用\n\n![Image](img/00002.jpeg)\
  \ 如何声明和定义函数\n\n![Image](img/00002.jpeg) 如何带参数调用函数\n\n![Image](img/00002.jpeg) 如何从函数返回一个值\n\
  \n### 什么是函数？\n\n`function`（函数）是程序的一部分，它可以对数据进行操作并返回一个值。每个 C++ 程序至少有一个函数，即在程序运行时自动调用的\
  \ `main()` 函数。该函数可以包含调用其他函数的语句，其中某些函数可能会调用其他函数，以此类推。\n\n每个函数都有一个名称，用于调用该函数。程序的执行跳转到该函数的第一条语句，并持续到遇到\
  \ `return` 语句或函数的最后一个语句为止。在该点，执行将从调用函数的地方继续。\n\n设计良好的函数执行特定的任务。复杂的任务应该被拆分为多个函数，每个函数都可以轮流调用。这使得你的代码更容易于理解和维护。\n\
  \n### 声明和定义函数\n\n在编写函数代码之前，你必须对其进行声明。\n\n`function declaration`（函数声明）告诉编译器函数的名称、函数产生的数据类型以及函数接收的任何参数的类型。函数的声明也称为\
  \ `prototype`（原型），它不包含任何代码。\n\n声明告诉编译器函数是如何工作的。函数原型是一个单一语句，以分号结尾。\n\n参数列表标识每个参数及其类型，并用逗号分隔。\n\
  \n这里是一个使用 `length` 和 `width` 参数确定矩形面积的函数声明：\n\n点击此处查看代码图像\n\n```cpp\nint findArea(int\
  \ length, int width);\n```\n\n声明的三个部分如下：\n\n![Image](img/00002.jpeg) 返回类型，`int`\n\
  \n![Image](img/00002.jpeg) 名称，`findArea`\n\n![Image](img/00002.jpeg) 两个参数的类型和名称，一个名为\
  \ `length` 的 `int` 和一个名为 `width` 的 `int`\n\n函数原型必须与函数的三个元素匹配，否则程序将无法编译。唯一不需要匹配的是参数名称。函数声明完全不需要命名参数。之前的声明可以重写为：\n\
  \n```cpp\nint findArea(int, int);\n```\n\n虽然这是允许的，但与使用参数名相比，它使得函数原型不够清晰。\n\n函数名称是一个短标识符，描述了它执行的任务。由于名称不能包含空格，常见的约定是将名称中除第一个单词以外的每个字母大写。这就是为什么\
  \ `findArea` 名称中的 `A` 是大写的。\n\n所有函数的结构与程序的 `main()` 函数相同。函数中的语句被包含在左大括号 `{` 和右大括号\
  \ `}` 之间。如果函数返回一个值，则至少应该有一个 `return` 语句返回返回适当返回类型的字面量或变量。在 C++14 的一个新功能中，`auto`\
  \ 关键字允许编译器选择函数返回的数据类型。\n\n函数可以返回任何 C++ 数据类型。如果函数不产生值，则声明应使用 `void` 作为类型。返回 `void`\
  \ 的函数不需要 `return` 语句，尽管仍然可以使用它，如下语句所示：\n\n```cpp\nreturn;\n```\n\n与函数声明不同，命名函数的语句不能以分号结尾。\n\
  \n这里是 `findArea()` 的定义，它通过乘以长度和宽度来确定面积：\n\n```cpp\nint findArea(int length, int\
  \ width)\n```\n\n该函数返回两个参数的值。\n\n列表 5.1 `Area.cpp` 的完整文本\n\n```cpp\n#include <iostream>\n\
  \nint findArea(int length, int width); // 原型\n\nint main() {\n    int length;\n\
  \    int width;\n    int area;\n\n    std::cout << \"How wide is your yard? \";\n\
  \    std::cin >> width;\n    std::cout << \"How long is your yard? \";\n    std::cin\
  \ >> length;\n\n    area = findArea(length, width);\n\n    std::cout << \"Your yard\
  \ is \" << area << \" square feet\\n\";\n\n    return 0;\n}\n\n// 定义\nint findArea(int\
  \ l, int w) {\n    return l * w;\n}\n```\n\n当程序编译并运行时，它产生以下输出：\n\nHow wide is your\
  \ yard? 32\n\nHow long is your yard? 25\n\nYour yard is 800 square feet\n\n`findArea()`\
  \ 的原型位于第 3 行。函数的代码位于第 25-28 行。比较原型的名称、返回类型和参数类型：它们是相同的，但参数名称在原型中是 `length width`，在函数中是\
  \ `l w`。\n\n#### 注意\n\n如果将 `Area.cpp` 中的函数定义移动到其调用之前，则不需要原型。虽然对于在本书中创建的小程序来说这是一个可行的解决方案，但在较大的编程项目中，确保所有函数在使用之前已定义将更加繁琐。\n\
  \n### 在函数中使用变量\n\n函数以多种不同的方式与变量工作。在调用函数时可以指定变量作为参数。变量可以在函数中创建并在函数完成时消失。变量也可以由函数和程序的其余部分共享。\n\
  \n#### 局部变量\n\n在函数中创建的变量被称为 `local variable`（局部变量），因为它只局部存在于函数内部。当函数返回时，其所有的局部变量将不再供程序使用。\n\
  \n\n\n\n\n局部变量的创建方式与其他任何变量一样。函数接收的参数也被视为局部变量。代码列表 5.2 中的 `Temperature` 程序使用局部变量将以华氏度表示的温度值转换为摄氏度。\n\
  \n#### 代码列表 5.2 `Temperature.cpp` 的完整文本\n\n点击此处查看代码图像\n\n```cpp\n1: #include <iostream>\n\
  2:\n3: float convert(float);\n4:\n5: int main()\n6: {\n7:     float fahrenheit;\n\
  8:     float celsius;\n9:\n10:      std::cout << \"Please enter the temperature\
  \ in Fahrenheit: \";\n11:      std::cin >> fahrenheit;\n12:      celsius = convert(fahrenheit);\n\
  13:      std::cout << \"\\nHere's the temperature in Celsius: \";\n14:      std::cout\
  \ << celsius << \"\\n\";\n15:      return 0;\n16: }\n17:\n18: // function to convert\
  \ Fahrenheit to Celsius\n19: float convert(float fahrenheit)\n20: {\n21:     float\
  \ celsius;\n22:     celsius = ((fahrenheit — 32) * 5) / 9;\n23:     return celsius;\n\
  24: }\n```\n\n以下是运行程序三次产生的输出，用户输入了华氏度值为 77、32 和 85：\n\n点击此处查看代码图像\n\nPlease enter\
  \ the temperature in Fahrenheit: 77\n\nHere's the temperature in Celsius: 25\n\n\
  Please enter the temperature in Fahrenheit: 32\n\nHere's the temperature in Celsius:\
  \ 0\n\nPlease enter the temperature in Fahrenheit: 85\n\nHere's the temperature\
  \ in Celsius: 29.4444\n\n该程序在第 19–24 行定义了一个 `convert()` 函数，它接受一个参数：一个名为 `fahrenheit`\
  \ 的 `float` 值。\n\n第 21 行声明了一个名为 `celsius` 的局部变量，并在第 22 行对其赋值。该值是使用华氏度转换为摄氏度的三步公式确定的：\n\
  \n1. 从数字中减去 32。\n2. 将结果乘以 5。\n3. 将该结果除以 9。\n\n函数在第 23 行返回转换后的值。当函数结束时，局部变量 `fahrenheit`\
  \ 和 `celsius` 消失，不再可以被使用。\n\n在 `main()` 方法中，创建了一个名为 `fahrenheit` 的变量来存储用户输入的值。名为\
  \ `celsius` 的变量存储了该温度转换后的版本。这些变量的名字与 `convert()` 函数中的局部变量相同，但它们是不同的变量。\n\n它们不相同的原因是它们在不同的作用域中创建。变量的作用域是程序中变量存在的部分。作用域决定了变量在程序中可用多久以及在何处可以被访问。在块内声明的变量具有该块的作用域。当块以结束的右大括号\
  \ `}` 结束时，该变量将变得不可用。\n\n你可以在任何块中声明变量，例如 `if` 条件语句或函数。\n\n#### 全局变量\n\n在 C++ 程序中，变量可以定义在所有函数之外，包括\
  \ `main()` 函数。这些被称为全局变量，因为它们在程序的任何地方都是可用的。\n\n定义在任何函数之外的变量具有全局作用域，因此可以在程序中的任何函数中（包括\
  \ `main()`）中使用。\n\n代码列表 5.3 中的 `Global` 程序是 `Temperature` 的修订版本，它使用了全局变量。\n\n####\
  \ 代码列表 5.3 `Global.cpp` 的完整文本\n\n点击此处查看代码图像\n\n```cpp\n1: #include <iostream>\n\
  2:\n3: void convert();\n4:\n5: float fahrenheit;\n6: float celsius;\n7:\n8: int\
  \ main()\n9: {\n10:\n11:      std::cout << \"Please enter the temperature in Fahrenheit:\
  \ \";\n12:      std::cin >> fahrenheit;;\n13:      convert();\n14:      std::cout\
  \ << \"\\nHere's the temperature in Celsius: \";\n15:      std::cout << celsius\
  \ << \"\\n\";\n16:      return 0;\n17:\n18: // function to convert Fahrenheit to\
  \ Celsius\n19: float convert(float fahrenheit)\n20: {\n21:     float celsius;\n\
  22:     celsius = ((fahrenheit — 32) * 5) / 9;\n23:     return celsius;\n24: }\n\
  ```\n\n#### 函数参数\n\n函数以函数参数的形式接收信息。只要它们之间用逗号分隔，就可以有多个参数，也可以在不带参数的情况下调用函数。传递函数的参数不需要是相同类型。例如，可以使用一个整数调用函数。\n\
  \n任何有效的 C++ 表达式都可以作为函数参数，包括常量、数学表达式以及返回值的其他函数。\n\n传递给函数的参数是函数内的局部变量，即使它们与调用该函数的变量同名。\n\
  \n考虑以下示例代码，它似乎在交换两个变量的值：\n\n```cpp\nint x = 4, y = 13;\nswap(x, y);\n\nvoid swap(int\
  \ x, int y) {\n    int temp = x;\n    x = y;\n    y = temp;\n}\n```\n\n与你预期的相反，`swap()`\
  \ 函数并没有交换变量使得 `x` 等于 13  `y` 等于 4。相反，变量保持了原始值。原因是 `swap()` 函数接收的参数是局部变量。改变它们的值不会影响调用\
  \ `swap()` 之前创建的变量。\n\n对参数的修改不会影响调用函数的值。这被称为值传递，因为值被传递给函数并为每个参数创建一个局部副本。这些局部副本的处理方式与其他任何局部变量一样。\n\
  \n`swap()` 函数交换了作为参数接收的局部变量，而调用 `swap()` 的变量保持不变。\n\n由于变量是通过值传递给函数的，`swap()` 函数不起作用。\n\
  \n#### 函数返回值\n\n函数返回值或 `void`。\n\n要从函数返回一个值，`return` 关键字后面跟着要返回的值。该值可以是字面量、变量或表达式，因为所有表达式都会产生一个值。这里是一些例子：\n\
  \n```cpp\nreturn 5;\nreturn (x > 5);\nreturn (convert(fahrenheit));\n```\n\n\n\n\
  \n这些都是允许的 `return` 语句，假设 `convert()` 返回一个值。在第二个语句中返回的值是：如果 `x` 小于或等于 5，则为 `false`；否则，为\
  \ `true`。\n\n当执行 `return` 语句时，程序执行会立即返回到调用该函数的语句。`return` 之后的任何语句都不会被执行。\n\n在函数中包含多个\
  \ `return` 语句是允许的。这通过列表 5.4 中的 `LeapYear` 程序得到了证明。\n\n### 列表 5.4 `LeapYear.cpp`\
  \ 的全文\n\n点击此处查看代码图像\n\n```cpp\n1: #include <iostream>\n2:\n3: bool isLeapYear(int\
  \ year);\n4:\n5: int main()\n6: {\n7:     int input;\n8:     std::cout << \"Enter\
  \ a year: \";\n9:     std::cin >> input;\n10:      if (isLeapYear(input))\n11: \
  \         std::cout << input << \" is a leap year\\n\";\n12:      else\n13:    \
  \      std::cout << input << \" is not a leap year\\n\";\n14:      return 0;\n15:\
  \ }\n16:\n17: bool isLeapYear(int year)\n18: {\n19:     if (year % 4 == 0)\n20:\
  \     {\n21:          if (year % 100 == 0)\n22:          {\n23:              if\
  \ (year % 400 == 0)\n24:                  return true;\n25:              else\n\
  26:                  return false;\n27:          }\n28:         else\n29:      \
  \       return true;\n30:     }\n31:     else\n32:         return false;\n33: }\n\
  ```\n\n`LeapYear` 程序判断一个年份是否为闰年。以下是使用不同用户输入连续运行运行的输出：\n\nEnter a year: 2016\n2016\
  \ is a leap year\n\nEnter a year: 2017\n2017 is not a leap year\n\nEnter a year:\
  \ 2100\n2100 is not a leap year\n\nEnter a year: 2000\n2000 is a leap year\n\n闰年有\
  \ 366 天而非 365 天，遵循三条规则：\n\n![Image](img/00002.jpeg) 如果年份能被 4 整除，它就是闰年，\n\n![Image](img/00002.jpeg)\
  \ 除非该年份也能被 100 整除，则它不是闰年，\n\n![Image](img/00002.jpeg) 除非该年份能被 400 整除，否则它仍然闰年。\n\n\
  第 17–33 行的 `isLeapYear()` 函数使用多个 `if` 和 `else` 语句来执行这些规则。如果年份是闰年，该函数返回 `bool` 值\
  \ `true`，否则返回 `false`。该函数接收一个整数参数，即要检查的年份。\n\n函数中有四个不同的 `return` 语句，每个语句都会在不同的情况下结束函数的执行。与其他函数不同，最后一行并不是自动执行的\
  \ `return` 语句。它是条件判断的一部分。\n\n### 默认函数参数\n\n当在原型中声明一个函数以接收一个或多个参数时，该函数只能使用具有正确数据类型的参数进行调用。考虑一个接收一个整数的函数：\n\
  \n`bool isLeapYear(int year);`\n\n`isLeapYear()` 函数必须接收一个整数作为参数，编译器会检查这一要求。使用缺失或无效值调用函数会导致编译错误。\n\
  \n该规则有一个例外：如果函数原型为某个参数声明了默认值，则可以在不传递该参数的情况下调用该函数。每当省略该参数时，都会使用该默认值。以下是 `isLeapYear()`\
  \ 的一个经过修改的原型，它包含一个默认年份：\n\n点击此处查看代码图像\n\n`bool isLeapYear(int year = 2016);`\n\n\
  如果调用 `isLeapYear()` 函数时未指定年份，则使用默认值 `2016`。当原型中声明默认参数时，函数的定义不会发生改变。\n\n当函数有多个参数时，默认值根据参数的顺序进行分配。任何参数都可以分配默认值，但有一个重要的限制：如果某个参数没有默认值，则其之前的参数都不得有默认值。以下是一个带有四个参数的原型：\n\
  \n点击此处查看代码图像\n\n`long set4DPoint(int x, int y, int z, int t);`\n\n以下更改是不允许的：\n\n\
  点击此处查看代码图像\n\n`long set4DPoint(int x, int y, int z = 1, int t);`\n\n之所以不起通是因为 `t`\
  \ 参数缺少默认值（由于 `t` 缺少默认值，前面的 `z` 也不能有默认值，注：原文逻辑意为由于 `t` 没默认值，导致 `z` 无法有默认值，此处纠正原文\
  \ \"The reason it’s work\" 显然为 \"The reason it doesn't work\"）。\n*注：原文此处 \"The reason\
  \ it’s work\" 应为笔误，意为 \"The reason it doesn't work\"*。\n\n原因是 `t` 参数缺少默认值。如果一个参数没有默认值，则其之前的参数也不得有默认值。此处原文逻辑应为：因为\
  \ `t` 缺少默认值，所以前面的 `z` 无法有默认值。\n\n*抱歉，重新梳顺该段落翻译：*\n该规则有一个例外：如果函数原型为某个参数声明了默认值，则可以在不传递该参数的情况下调用该函数。每当省略该参数时，都会使用该默认值。以下是\
  \ `isLeapYear()` 的一个经过修改的原型，它包含一个默认年份：\n\n点击此处查看代码图像\n\n`bool isLeapYear(int year\
  \ = 2016);`\n\n如果调用 `isLeapYear()` 函数时未指定年份，则使用默认值 `2016`。当原型中声明默认参数时，函数的定义不会发生改变。\n\
  \n当函数有多个参数时，默认值根据参数的顺序进行分配。任何参数都可以分配默认值，但有一个重要的限制：如果某个参数没有默认值，则其之前的参数都不得有默认值。以下是一个带有四个参数的原型：\n\
  \n点击此处查看代码图像\n\n`long set4DPoint(int x, int y, int z, int t);`\n\n以下更改是不允许的：\n\n\
  点击此处查看代码图像\n\n`long set4DPoint(int x, int y, int z = 1, int t);`\n\n之所以不起通是因为 `t`\
  \ 参数缺少默认值（此处原文逻辑意为：由于 `t` 缺少默认值，导致前面的 `z` 无法有默认值）。\n*修正翻译该段落：*\n之所以不起通是因为 `t` 参数缺少默认值。如果一个参数没有默认值，则其之前的参数都不得有默认值。此处原文逻辑意为：由于\
  \ `t` 缺少默认值，导致前面的 `z` 无法有默认值。\n\n*重新翻译该段落：*\n之所以不起通是因为 `t` 参数缺少默认值。如果一个参数没有默认值，则其之前的参数都不得有默认值。\n\
  *注：原文中 \"The reason it’s work\" 显然是 \"The reason it doesn't work\" 的笔误。*\n\n之所以不起通是因为\
  \ `t` 参数缺少默认值。如果一个参数没有默认值，则其之前的参数都不得有默认值。此处原文逻辑意为：由于 `t` 缺少默认值，导致前面的 `z` 无法有默认值。\n\
  \n*等等，我直接按照原文逻辑重新翻译最后几句：*\n`long set4DPoint(int x, int y, int z = 1, int t);`\n\n\
