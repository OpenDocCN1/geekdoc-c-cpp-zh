  \n第 3–9 行声明了一个简化的 `SimpleCat` 类。构造函数、拷贝构造函数和析构函数都会打印一条信息消息，这样你就可以判断它们何时被调用的。\n\n\
  在第 31 行，`main()` 打印了一条消息；你可以在输出第 1 行看到它。在第 32 行，实例化了一个 `SimpleCat` 对象。这导致了构造函数的调用，构造函数的输出显示在输出的第\
  \ 2 行。\n\n在第 33 行，`main()` 报告它正在调用 `FunctionOne()`，这产生了输出第 3 行。由于调用 `FunctionOne()`\
