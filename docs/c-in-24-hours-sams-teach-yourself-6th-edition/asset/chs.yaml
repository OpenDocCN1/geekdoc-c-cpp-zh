  \n记住 `typedef` 创建别名；唯一的区别是可读性。\n\n### 成员指针\n\n到目前，你创建的所有函数指针都是针对普通函数的。也可以创建指向类成员函数的指针。\n\
  \n创建成员指针使用与函数指针相同的语法，但要包含类名和作用域运算符（`::`）。因此，如果 `pFunc` 指向 `Shape` 类中一个接受两个整数并返回\
  \ `void` 的成员函数，则 `pFunc` 的声明如下：\n\n点击此处查看代码图像\n\n```cpp\nvoid (Shape::*pFunc)(int,\
  \ int);\n```\n\n成员指针的使用方式与函数指针完全相同，不同之处它们需要正确的类对象来调用。列表 20.8 程序演示了成员指针的使用。\n\n###\
  \ 列表 20.8 `MemberPointer.cpp` 的全文\n\n点击此处查看代码图像\n\n```cpp\n1: #include <iostream>\n\
  2:\n3: enum BOOL { FALSE, TRUE };\n4:\n5: class Mammal\n6: {\n7: public:\n8:   \
  \   Mammal():age(1) {  }\n9:      virtual ~Mammal() { }\n10:     virtual void speak()\
  \ const = 0;\n11:     virtual void move() const = 0;\n12: protected:\n13:     int\
  \ age;\n14: };\n15:\n16: class Dog : public Mammal\n17: {\n18: public:\n19:    \
  \  void speak() const { std::cout << \"Woof!\"; }\n20:      void move() const {\
  \ std::cout << \"Walking to heel\"; }\n21: };\n22:\n23: class Cat : public Mammal\n\
  24: {\n25: public:\n26:      void speak() const { std::cout << \"Meow!\"; }\n27:\
  \      void move() const { std::cout << \"Slinking...\"; }\n28: };\n29:\n30: class\
  \ Horse : public Mammal\n31: {\n32: public:\n33:      void speak() const { std::cout\
  \ << \"Winnie!\"; }\n34:      void move() const { std::cout << \"Galloping...\"\
  ; }\n35: };\n36:\n37: int main()\n38: {\n39:     void (Mammal::*pFunc)() = 0;\n\
  40:     Mammal* ptr = 0;\n41:     int animal;\n42:     int method;\n43:     bool\
  \ fQuit = false;\n44:\n45:     while (fQuit == false)\n46:     {\n47:         std::cout\
  \ << \"(0) Quit (1) Dog (2) Cat (3) Horse \";\n48:         std::cin >> animal;\n\
  49:         switch (animal)\n50:         {\n51:         case 1:\n52:           \
  \  ptr = new Dog();\n53:             break;\n54:         case 2:\n55:          \
  \   ptr = new Cat();\n56:             break;\n57:         case 3:\n58:         \
  \    ptr = new Horse();\n59:             break;\n60:         default:\n61:     \
