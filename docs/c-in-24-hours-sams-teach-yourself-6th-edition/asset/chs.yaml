  2. 通过添加 `Cyborg` 类来扩展 ParamList 程序。将其存储在链表中并像 `main` 函数中的 `Robot` 对象一样处理它。\n\n要查看这些活动的解决方案，请访问本书网站\
  \ [`cplusplus.cadenhead.org`](http://cplusplus.cadenhead.org)。\n\n##  24 处理异常与错误处理\n\
  \n在本节中学习：\n\n* 什么是异常\n* 异常如何使用以及它们引发什么问题\n* 如何创建无 Bug 代码\n* 后续展望\n\n### Bug、错误与代码腐烂\n\
  \n书中的代码是为了演示而创建的。它特意没有处理错误，以专注于所介绍的核心问题。然而，现实程序必须考虑错误情况。事实上，预测和处理错误可能占据代码的大部分！\n\
  \n\n\n\n有很多种类型的错误可能会困扰程序。第一种是逻辑缺陷：程序完全执行了你要求的操作，但你没有妥善地考虑算法。第二种是语法错误：你使用了错误的惯用法、函数或结构。这两种是最常见的，也是大多数程序员防范的重点。更难发现的是那些只有在用户进行意料之外的操作才会出现的细微错误。这些小小的“逻辑炸弹”可能会一直潜伏，直到最终被触发并导致程序崩溃。\n\
  \n研究和实践经验一致表明，在开发过程中越晚发现问题，修复的成本就越高。修复成本最低的问题是那些你避免了创建的问题。其次便宜的是由编译器检测出的问题。C++ 语言标准强制编译器投入大量精力，在编译时报告不断增长的错误列表。\n\
  \n那些被编译后但在第一次测试中就被捕获的错误——即每次都会崩溃的错误——比那些偶尔崩溃一次的错误更容易发现和修复。\n\n比逻辑错误或语法错误更严重的问题是不必要的脆弱性：如果用户在你要求数字时输入数字，你的程序运行良好；但如果用户输入字母，程序就会崩溃。其他程序在内存耗尽、磁盘满或网络连接断开时也会崩溃。\n\
  \n为了对抗这种脆弱性，程序员努力让程序变得“无坚击”。一个无坚击的程序可以处理运行时出现的任何情况，从怪异的用户输入到内存耗尽。如果你留心并为这些情况做好准备，就可以避免崩溃。\n\
  \n### 处理意外情况\n\n程序员使用设计评审和详尽测试来发现逻辑错误。\n\n可能出现的另一种错误被称为 `exception`（异常）。\n\n异常的名称源于特殊情况。程序中可能某些情况是无法消除的。相反，你只能为它们做好准备。例如，计算机会不时地耗尽内存。这不是程序员可以防止的。当这些情况发生时，程序只能通过以下方法之一做出响应：\n\
  \n- ![Image](img/00002.jpeg) 崩溃程序（Crash the 程序）。\n- ![Image](img/00002.jpeg) 通知用户并优雅退出。\n\
  - ![Image](img/00002.jpeg) 通知用户并允许用户尝试恢复并继续。\n- ![Image](img/00002.jpeg) 采取纠正措施并在不通知用户的情况下继续。\n\
  \n对于你编写的每个程序来说，自动且静默地从所有异常情况下恢复并非必要，甚至是理想的，但显然，你必须比直接崩溃做得更好。\n\nC++ 异常处理提供了一种类型安全的集成技术，用于处理程序运行时出现的可预测但异常的情况。\n\
  \n### 异常\n\n在 C++ 中，`exception` 是一个对象从发生问题的代码区域传递到将处理该问题的代码部分。当异常发生时，被称为 `thrown`（抛出）。当异常被处理时，被称为\
  \ `caught`（捕获）。\n\n异常的类型决定了哪部分代码将处理该问题。作为异常抛出的对象的内容可以向用户提供关于问题的反馈。\n\n异常背后的基本思想相当直接：\n\
  \n- ![Image](img/00002.jpeg) 资源的实际分配（例如内存的分配或文件的锁定）通常在程序的非常低层完成。\n- ![Image](img/00002.jpeg)\
  \ 当操作失败、无法分配内存或无法锁定文件时的处理逻辑通常位于程序的高层，包含与用户交互的代码。\n- ![Image](img/00002.jpeg) 异常为分配资源的代码提供了一条快速路径，直接连接到可以处理错误状况的代码。如果中间有函数层，它们将获得清理内存分配的机会，但不需要包含仅用于传递错误状况的代码。\n\
  \n#### 异常如何使用\n\n创建一个 `try` 块，用于包围可能出现问题并抛出异常的代码区域。例如：\n\n```\ntry\n{\n    someDangerousFunction();\n\
  }\n```\n\n`catch` 块是紧随在 `try` 块之后的代码块，在其中处理异常。例如：\n\n```cpp\ntry\n{\n    someDangerousFunction();\n\
  }\ncatch (outOfMemory)\n{\n    // 采取行动从低内存状态恢复\n}\ncatch (fileNotFound)\n{\n   \
  \ // 在未找到文件时采取行动\n}\n```\n\n使用异常的基本步骤如下：\n\n1. 识别程序中开始执行可能引发异常的操作的区域，并将它们放入 `try`\
  \ 块中。\n2. 创建 `catch` 块在异常抛出时捕获它们，清理已分配的内存，并根据情况通知用户。列表 24.1 中的异常处理程序说明了 `try` 块和\
  \ `catch` 块的使用。\n\n> **注意**\n> 当异常被抛出（或引发）时，控制权将转移到紧随当前 `try` 块之后的 `catch` 块。\n\n\
  **LISTING 24.1 `Exception.cpp` 的全文**\n\n```cpp\n#include <iostream>\n\nconst int\
  \ defaultSize = 10;\n\n// 定义异常类\nclass XBoundary\n{\npublic:\n    XBoundary() {}\n\
  \    ~XBoundary() {}\nprivate:\n};\n\nclass Array\n{\npublic:\n    // 构造函数\n   \
  \ Array(int size = defaultSize);\n    Array(const Array &rhs);\n    ~Array() { delete\
  \ [] pType; }\n\n    // 运算符\n    Array& operator=(const Array &rhs);\n    int& operator[](int\
  \ offSet);\n    const int& operator[](int offSet) const;\n\n    // 访问器\n    int\
  \ getSize() const { return size; }\n\n    // 友元函数\n    friend std::ostream& operator<<(std::ostream&,\
  \ const Array& array);\n\nprivate:\n    int *pType;\n    int size;\n};\n\nArray::Array(int\
  \ newSize) : size(newSize)\n{\n    pType = new int[size];\n    for (int i = 0; i\
  \ < size; i++)\n        pType[i] = 0;\n}\n\nArray& Array::operator=(const Array\
  \ &rhs)\n{\n    if (this == &rhs)\n        return *this;\n    delete [] pType;\n\
  \    size = rhs.getSize();\n    pType = new int[size];\n    for (int i = 0; i <\
  \ size; i++)\n        pType[i] = rhs[i];\n    return *this;\n}\n\nArray::Array(const\
  \ Array &rhs)\n{\n    size = rhs.getSize();\n    pType = new int[size];\n    for\
  \ (int i = 0; i < size; i++)\n        pType[i] = rhs[i];\n}\n\nint& Array::operator[](int\
  \ offSet)\n{\n    int size = getSize();\n    if (offSet >= 0 && offSet < size)\n\
