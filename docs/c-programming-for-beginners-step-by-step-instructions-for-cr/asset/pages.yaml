    4 bytes.


    “float”: Stores decimal numbers with 7 decimal digits. Has a size of 4 bytes.


    “double”: Stores decimals numbers with 15 decimal digits. Has a size of 8 bytes.


    “char”: Keyword is short for “character” and stores single characters regardless
    of their capitalization. Has a size of 1 byte.


    “bool”: Keyword is short for “boolean” and stores values that have a state of
    either true or false. Has a size of 1 byte.


