    To write code and save it in an executable file you need the following things:


    A text editor: this will allow you to write and edit the code.


    A language compiler: This program takes the code you have written and translates
    it into machine language that your computer can understand and follow.


    All programming languages work like this except HTML, CSS, and JavaScript - these
    programs are interpreted and executed by the browser "Introduction," n.d.). This
    means browser languages like JavaScript are software-based, while C++ is compiled
    and then run directly on your machine, not in a software environment.


    This means C++ is an assembly language. Assembly languages are low-level programming
    languages that need a compiler so they can run on a machine (Lithmee, 2018). In
    this context, the word low- level does not carry a bad connotation; it is descriptive,
    meaning thatthe language is closer to the machine or just a step away from it.


    As you can probably guess, C++ is a general-purpose language that can run almost
    anywhere. This means it can be assembled and compiled in several different ways.
    This will largely depend on your operating system and the creation utilities you
    are using.


    Our C++ exercises will be compiled on an online IDE. IDE stands for Integrated
    Development Environment and it is used to edit and compile code. I bet that description
    sounds familiar. Yes, an IDE example of a text editor, but unlike a plain text
    editor, it has extra features that are important to the programming process. An
    IDE can do things like compile code, debug code, highlight code, warn you of syntax
    errors, and more.'
