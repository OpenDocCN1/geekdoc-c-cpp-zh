  md: '# PROGRAMMING


    Like any other language, programming languages have a structure, syntax, and set
    of rules that make them easy to learn and use. In order to be a good person, you
    need to know the words of another language. Knowing how to use them and how they
    work in that language is an important part of communicating well in language.
    They all work the same way, but the communication they care about is between humans
    and machines. Even though machines are not as smart or capable as we are today,
    there is still so much they can learn that we don''t understand. We can do this
    at a rate and in a way that isn''t possible for us. All programming is a set of
    steps. In these we can be rules, actions you want the machine to do, or something
    else. In other words, we are able to communicate with each other because we follow
    the rules of a programming language.


