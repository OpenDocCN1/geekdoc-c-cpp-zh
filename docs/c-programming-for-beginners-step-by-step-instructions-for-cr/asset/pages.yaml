  md: 'Let’s take a break from routines and explore other ways we can use logical
    operators. Logical operators are based on machine logic, especially logical gates.
    Logical gates are electronic circuits that have one or more inputs while having
    one output. Logical gates have the same function as logical operators. “AND” gates
    only pass “1” when all inputs are “1”; “OR” gates pass “1” when they receive a
    “1” from any of their inputs; “NOT” passes “1” when they receive a “0” as their
    input.


    Logical gates can control the flow of data in a circuit, the same as logical operations
    when combined with a conditional statement. It is called a **conditional short-circuit**
    in logical operators.


    AND operators and OR operators short-circuit. Recall how AND returns true both
    relational operators are conditionally true. What’s more, relational operators
    are assessed in the order they appear in a conditional statement – if the first
    one is false the second will not be evaluated, it short circuits.


