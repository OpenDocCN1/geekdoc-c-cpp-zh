    ## Logical Operators


    Logical operators add complexity to relational operators. They are used in conjunction
    with relational operators to combine two or more conditions. There are three operators
    (Jaggi, 2015b):


    - AND: the logical “AND” operator returns a Boolean true when both conditions
    are met. If one isn''t, it returns a false.

    - OR: the logical “OR” operator returns a Boolean true when one (or both) of the
    conditions are met. If none of the conditions are met, it returns false.

    - NOT: the logical “NOT” operator returns a Boolean true if the conditions are
    not satisfied. If one of the conditions is true, it returns a false.


    Logical operators are used in machines. Imagine a "NOT" operator in the security
    system. Let''s say locked doors are "0", and unlocked doors stay secure. But in
    a fire, these doors should open, the "NOT" signal will return to open doors.


