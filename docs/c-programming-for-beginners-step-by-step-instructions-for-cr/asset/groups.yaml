    This table lists the operator symbols and categorizes them by (1) how many operands
    they accept at a time > (2) the type of operation they implement. For example,
    most arithmetic operators operate on two operands at a time.


    All operators are characterized by how many operands they can operate on a time
    and the types of operations they can execute. They are divided into three types:


    - **Unary** - operators that only accept 1 operand at a time

    - **Binary** - operators that only accept 2 operands at a time

    - **Ternary** - operators that accept more than 2 operands, or conditional operators
    with several arguments


    They are further divided into 6 types:

    - Arithmetic

    - Relational

    - Logical

    - Bitwise

    - Assignment operators

    - Other operators such as a conditional, address, and redirection


    In this chapter, we will look at 5 types of operators and their functionalities.


    **Note:** Operators have precedence, just as in mathematical equations. For example,
    parentheses, which are used to call a function, have higher precedence than addition
    or subtraction. However, you should try to keep your lines of code as simple as
    possible. This makes your programs easier to edit and debug. Having clean, uncomplicated
    code avoids bugs.


    ## Binary Operators


    Binary operators are the majority of operands you find in C++. They include 5
    of the 6 types of operators. This makes them the perfect place to start. As the
    name suggests, binary operators compare two operands. They are the perfect for
    decision-making and controlling switches.


    ## Arithmetic Operators


    They are the most common and well understood of all operators because of how we
    use them even outside programming, since they are primarily mathematical. We use
    them to perform mathematical operations.


