    ## A. 在 Ubuntu 控制台中安装 GNU GCC


    在截图中，已经存在 GCC。运行高亮的命令——如果系统中不存在，则将在你的系统上安装 GNU GCC (Patel, 2014)。控制台等待-等待-等待-等待-等待-等待-等待-等待-等待。使用命令后，如果你的系统中没有
