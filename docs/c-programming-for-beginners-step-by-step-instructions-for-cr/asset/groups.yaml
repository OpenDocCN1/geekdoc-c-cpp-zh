    “Hello World” 及其返回值 (Patel, 2017)。


    如果你是一名认为自己会在 Apple 设备上工作的程序员，那么在 Xcode 中工作和练习是一项很好的投资。例如，Apple 在流媒体服务和设备等各种消费品和服务市场中占据着巨大的份额。尽管如此，你应该记住，C++
    主要用作服务端语言。服务端编程是用于控制内容如何传输到 YouTube 这样的动态网站的代码。大多数服务端编程是在 Linux 机器上完成的。


    # Linux 编译器安装


    Linux 是一个基于控制台的操作系统，因此它不需要文本编辑器。相反，我们将专注于安装和设置编程编译器。Mac 和 Windows 会在 IDE 中自动初始化编译器，但在
    Linux 中，需要更具实践性的方法。你将被要求执行后端初始化。这看起来可能工作量很大，但从大局来看，它让那些使用 Linux 的人员对开发过程拥有完全控制权，并释放更多的计算能力。


    由于 Linux 是一个使用控制台界面的操作系统，对于初学者或任何习惯 Windows 或 Mac 的人来说会很奇怪。这是因为用户习惯了 GUI（图形用户界面）。Linux
    的无 GUI 特性允许更多的计算能力释放给编程——GUI 的产生和维护需要一些计算能力。这就是为什么许多服务器和其他编程环境具有控制台界面的原因。此外，许多人使用
    Linux 发行版。


    Linux 发行版（distro）是基于 Linux 内核的软件集合和用于安装额外软件的软件包系统的操作系统。


    以下是安装和初始化编译器的指令。这将针对 Ubuntu，这是一个受初学者流行的 Linux 发行版。这些安装过程在你将使用的任何 Linux 发行版中都是相似的。


    注意：有很多 Linux 发行版提供了许多用户喜爱的 GUI 桌面体验。其中大多数都是开源且免费下载安装的。你可以探索这些发行版并创建控制台界面进行练习。一个值得考虑的免费发行版是
    CentOS，它是基于 Red Hat 服务器管理的（“Centos-faq | Open Source Community,” n.d.）。红帽企业 Linux
    (RHEL) 用于许多服务器管理设置且不是免费的。然而，CentOS 使用了它的许多组件，是准备在红帽环境中工作的极佳发行版。


    在示例中，我们将使用 Linux上的 GNU 集合编译器（GCC）。GNU 集合编译器是一个基于 Linux 的编译器，支持 C++ 以及 Fortran、Ada
    和 Java 等各种语言（“GCC 7 Release Series—Changes, New Features, and Fixes—GNU Project—Free
    Software Foundation (FSF),” n.d.）。要安装 GNU GCC，请遵循以下步骤：


    在控制台中，输入以下命令：


    首先通过输入此命令检查机器是否已经安装了版本：gcc -v


    ![](img/3ceb4a3dfd578d1d4c40199c71445dd8_20_0.png)


    ## A. 在 Ubuntu 控制台中检查 GNU GCC


    你应该检查你的系统是否是否存在 GCC 副本。此截图显示了一个已经安装了 GCC 的系统 (Patel, 2014)。使用命令后，如果你的系统中没有 GCC
    副本，将缺少这一行。如果存在副本，它将有一行类似的内容。你的版本可能是更更新的。


    以下命令将在你的系统上安装 GCC (Agarwal, 2017b):


    ```

    sudo apt-get update

    ```


    ```

    sudo apt-get install GCC

    ```


    ```

    sudo apt-get update

    sudo apt-get install gcc gfortran -program-suffix=.f90 -enable-shared-included
    --enable-threads -with-gcc include-dev /usr/include/c++-libstdc++-dev-libg1-dev-ag
    -version target=x86_64-linux-gnu --multilib -ntarget=x86_64-linux-gnu-buildbuild-x86_64-linux-gnu
    gcc-x86_64-linux-gnu gfortran-x86_64-linux-gnu

    ```


    ## A. 在 Ubuntu 控制台中安装 GNU GCC


    在截图中，已经存在 GCC。如果系统中不存在 GCC，运行高亮的命令将在你的系统上安装 GNU GCC (Patel, 2014)。控制台等待-等待-等待-等待-等待-等待-等待-等待-等待。使用命令后，如果你的系统中没有
    GCC 副本，将缺少这一行。如果存在副本，它将有一行类似的内容。你的版本可能是更更新的。


    以下命令将在你的系统上安装 GCC (Agarwal, 2017b):


    ```

    sudo apt-get update

    sudo apt-get install GCC

    ```


    ```

