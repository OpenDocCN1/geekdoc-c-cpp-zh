    \n![](img/3ceb4a3dfd578d1d4c40199c71445dd8_30_0.png)\n\n> Geeksforeks IDE 中的“Hello\
    \ World”程序 此截图显示了缺少分隔符的 Hello World\n\n我们可以看到 C++ 是多冗长，因为大多数步骤都涉及执行代码所需的 C++ 后端方面，例如调用库文件。在大多数情况下，你的算法不需要非常详细。\n\
    \n尽管很简单，但这个算法说明了开发者如何获取任务并将其转换为代码。在下一章中，我们将使用这个算法来编写我们的程序。\n\n... 函数：这是封装指令的代码。它可能接受输入并输出结果。每一个\n\
