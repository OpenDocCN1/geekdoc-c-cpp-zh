    be helpful to think of them as sentences, but not every sentence represents a
    string. We haveween how they work with our “Hello World” app. Strings are a separate
    data type with their own library. To manipulate and work with them a program needs
    an appropriate header – the string library. These libraries have methods and features
    that allow the program to manipulate strings.


    # Operation: String Concatenation


