  mdcn: "\n让我们暂时离开日常操作，探索我们使用逻辑运算符的其他方法。逻辑运算符基于机器逻辑，特别是逻辑门。逻辑门是具有一个或多个输入和一个输出的电子电路。逻辑门的功能与逻辑运算符相同。“与门（AND）”仅在所有输入都为“1”时才通过“1”；或门（OR）”在接收到任何一个输入的“1”时通过“1”；“非门（NOT）”在接收到“0”作为输入时通过“1”。\n\
    \n逻辑门可以控制电路中的数据流，这与条件语句结合使用时的逻辑操作是相同的。在逻辑运算符中，这被称为**条件短路**。\n\nAND 运算符和 OR 运算符具有短路特性。回想一下\
    \ AND 如何在两个关系运算符在条件下都为真时才返回真。此外，关系运算符是按照它们在条件语句中出现的顺序进行评估的——如果第一个为假，则第二个将不会被评估，它发生了短路逻辑。\n\
    \nOR 运算符的处理方式不同。只需要一个关系运算符返回其真布尔值即可。因此，如果第一个关系运算符返回真，它就不会检查下一个。\n\n这非常有用，因为我们可以向程序提供更复杂的指令，关于在什么情况下如何行为。OR\
    \ 和 AND 的短路是相反的。让我们利用这一点来编写一个程序，告诉我们何时发生 AND 和 OR 门的短路。\n\n遵循以下指令：\n\n```\n打开一个新的\
    \ IDE\n**a = 10,b** 声明两个变量：\n```\n\n打印程序的解释\n\n此程序将测试当 a 等于 b 时，OR 门或 AND 门是否短路。\n\
    \n打印 a 和 b 的当前值\n\n```cpp\nbool声明并计算两个变量\nresAND = ((a == b) && std::cout << \"\
    OR circuit shorted\")\nresOR = ((a == b) || std::cout << \"AND circuit shorted\"\
    ) 这看起来是这样的：\n```\n\n```java\nimport java.*;\n\npublic class Main {\n    public\
    \ static void main(String[] args) {\n        int a = 5;\n        int b = 10;\n\
    \        if (a < b) {\n            System.out.println(\"a is less than b\");\n\
    \        } else {\n            System.out.println(\"a is not less than b\");\n\
    \        }\n    }\n}\n```\n\n# 短路检测程序\n\n此截图是我们短路检测程序的成功运行。利用我们对逻辑 AND、逻辑 OR 以及它们之间关系的知识，我们开发出了一种检测短路的方法。可以通过此\
    \ URL 访问工作空间：https://ide.geeksforgeeks.org/uBLgLtBnnY\n\n尝试不同的值，看看你是否可以触发不同的“电路”。\n\
    \n- 考虑一个短路检测程序。我们在现实世界中会如何使用它？我提到过这类系统在银行安全中起着作用。问题是它如何实现这些功能的？你可以告诉程序如果某个条件不满足（“非”），则拒绝访问，例如密码不匹配。\n\
    \n理解逻辑运算符可以让我们很好机器和系统是如何做出决策的。关系运算符和逻辑运算符让我们对程序中发生的情况以及它与周围一切事物的关系有了更多的控制。我们通过各种库、语句和对象来实现这一点。到目前为止我们写了一些小型程序，但在更大的程序中，使用这类对象控制会给编译器带来开销。这在编程环境以及游戏引擎、内容分发等行业中有明显的影响。想想\
    \ YouTube 上每秒必须传输数 GB 数据的服务器，以及需要实时渲染的游戏引擎：它们必须在利用这些控制特性的同时减少开销。坦率地说，这可以通过使用位运算符来实现。\n\
    \n# 位运算符\n\n在电路层面，机器通过使用 AND 和 OR 门进行通信。这让它们在单比特数据层面上具备了决策能力。位运算符使用这些微观层计算来访问机器层面的过程，绕过了对象编程。换句话说，它们是在二进制位上对数字操作的逻辑运算符。\n\
    \n$5 \\times 10^2 + 3 \\times 10^1 + 4 \\times 10^0 = 534_{10}$\n\n人类使用十进制数字来概念化数字，也称为十进制制。例如，数字\
    \ 543 被理解为五百、四十和三个。在 10 进制中它看起来是这样：\n\n在二进制中，同一个数字看起来像这样 0b1000010110 —— “0b10-2”，它们只是看起来不同。这是一个二进制数。二进制数以位流的形式呈现，可以是两种状态之一：0\
    \ 或 1。在10 进制中，数字的位置决定了它的值。\n\n$2^9 + 2^4 + 2^2 + 2^1 = 534_{10}$ 示例显示了一个二进制数是如何\
    \ 10 位的。仔细观察 534 流，我们可以看到第 $2^{nd}$、$3^{rd}$、$4^{th}$ 和第 $10^{th}$ 位是开启的（从右向左），所有其他位都是关闭的（1\
    \ 为开启，0 为关闭）。在 2 进制中，我们这样计算它：\n\n对我们来说计算它并不容易，但这就是计算机通信的方式，通过数据位流进行通信。它们识别和计数这些数字就像人类识别\
    \ 10 进制数字一样容易。因此，使用运行在计算机自然水平上的位运算符可以提高速度和性能，因为它们跳过了从对象编程到机器语言的翻译。\n"
