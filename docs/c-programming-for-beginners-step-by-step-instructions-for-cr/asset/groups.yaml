    operators (Jaggi, 2015b):


    +   “AND": the logical "AND" operator returns a Boolean true when both the conditions
    are met and if they aren''t.


    +   “OR": the logical "OR" operator returns a Boolean true when one (or both)
    of the conditions are met, and if none of the conditions are met.


    +   “NOT": the logical "NOT" operator returns a Boolean true if the conditions
    in consideration are not satisfied. If one of the conditions is true, then it
    returns a Boolean false.


