  mdcn: "\n\n## 第二章：\n\n![](img/3ceb4a3dfd578d1d4c40199c71445dd8_27_0.png)\n\n## C++基础与编程原理\n\
    \n与任何其他语言一样，编程语言具有结构、语法和一套规则，使得它们易于学习和使用。为了成为一个优秀的人，你需要了解另一种语言的词汇。了解如何使用这些词汇以及它们在那种语言中如何运作，是良好交流的重要部分。它们的工作方式相同，但它们关注的通信是人与机器之间的通信。尽管机器不像我们现在这样聪明或强大，但它们仍然有许多我们无法理解的学习能力。我们可以以我们无法实现的速度和方式完成这些。所有的编程都是一组步骤。在这些步骤中，我们可以是规则、你想要机器执行的动作，或其他任何内容。换句话说，我们能够相互通信是因为我们遵循了编程语言的规则。\n\
    \n编程规则（或语法）是一组用于通信程序中函数和变量等内容的符号。这些符号被称为分隔符（delimiters），因此代码的外对于编译器来说非常重要。它告诉编译器向机器发出什么指令。\n\
    \n在我们开始之前，请记住这些点：C++ 不像 Python 或其他高级编程语言那样容易理解。高级语言如 JS、Python 和 C# 之所以这样设计是因为这使得它们更容易阅读和管理。这就是它们被这样设计的原因。C++\
    \ 尽管也是如此，但它对机器更容易理解，因为它没有那么抽象。这就是原因。当你使用 C++ 时，你只需要编译器和文本编辑器，而像 Python 这样的语言需要设置自己的环境。\n\
    \n## 编程原理\n\nC++ 有许多方法完成相同的任务。就像人类语言一样，有许多方式表达相同的意思，但某些方式适用于特定的场合，而有时并不适用。C++也是如此；某些方法非常好，因为它们减少了程序的开销。许多开发者希望它能提高整个应用程序的性能，这就是编程的第一原则：用尽可能少的函数完成任务。不要让事情变得比需要的更复杂。在大多数情况下，这意味着节约地使用循环或\
    \ switch 语句。\n\n做到此点的最佳方法是首先理解问题的本质以及如何最好实现解决方案。换句话说，你需要编写一个算法——一组你希望机器遵循以解决问题的指令列表。\n\
    \n你的设计应该始终从你想让程序做的事情开始。这也将包括你的算法，或者至少是算法将解决的问题。算法始终看起来像这样：\n\n- 输入：传来的数据、来源\n\
    - 处理：对数据执行的操作以及变量的声明\n- 输出：结果，或你执行的操作。\n\n这是一个显示“Hello World”的 C++ 程序的冗长示例。这是为了说明\
    \ C++ 程序是如何组成的：\n\n```cpp\n// Simple C++ program to display \"Hello World\"\n\
    // Header file for input and output functions\n#include<iostream>\nusing namespace\
    \ std;\n// main function -\n// where the execution of program begins\nint main()\n\
    {\n    // prints hello world\n    cout << \"Hello World\";\n    return 0;\n}\n\
    ```\n\n这是其结构：\n\n字体 调用输入输出函数的文件\n- 调用执行发生的 main 函数\n- 打印“Hello World”\n- 指示机器状态的终止语句\n\
    \n我们可以看到 C++ 是多冗长，因为大多数步骤都涉及执行代码所需的 C++ 后端方面，例如调用库文件。在大多数情况下，你的算法不需要非常详细。\n\n\
    尽管很简单，但这个算法说明了开发者如何获取任务并将其转换为代码。在下一章中，我们将使用这个算法来编写我们的程序。\n\n正如你在示例中所注意到的，代码中有注释解释了代码每个部分的作用。这些注释以“//”\
    \ 开头。编译器不会读取任何以 // 开头的代码行，因为它们不起任何作用，只是帮助其他编写代码的人阅读代码的功能。在你的代码中包含注释是一个良好的习惯，这样人们就知道每行代码的作用了。\n\
    \n## C++ 语法概述\n\n我们讨论过语法对编译器的重要性，但理解编程语言的语法同样重要，因为它允许你调试代码。就像人类语言一样，如果你了解语言的规则，当你出错时可以很容易纠正。\n\
    \n调试（Debugging）是发现并移除代码中错误和异常的过程，也被称为“bugs”（What is Debugging? n.d.）。这是一个修正的过程。\n\
    \nIDE 拥有调试工具可以高亮代码中发生的错误，但这些功能并不总是可靠。例如，漏掉分号来结束代码行是一个常见错误，但调试器会高亮 (.h) 文件而不是程序文件\
