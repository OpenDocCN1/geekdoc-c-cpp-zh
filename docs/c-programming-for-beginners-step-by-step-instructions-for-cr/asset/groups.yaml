    尽管这两个程序具备某些能力，但它们缺乏语法高亮等关键的文本编辑器功能。你可能认为这没什么大碍，但事实如此：代码中相同的单词因为其出现的方式和时间可能具有不同的含义，因此高亮有助于我们区分它们所指的内容。所以，如果一切都是纯黑白的，你就必须花费更多精力来理解某段代码指的是什么。现在听起来很复杂，但一旦你开始编写代码，这就会变得明显且必要。


    Notepad++（不要与 Windows 的“记事本”混淆）具有高亮功能，但你必须按照如下方式激活：


    ![](img/3ceb4a3dfd578d1d4c40199c71445dd8_10_0.png)

    # C++ 语法的 Notepad++ 截图


    Notepad++ 是免费的，正如名称所示，它是用 C++ 编写的。这张截图说明了如何启用语言语法。可以通过进入语言（language） > "C++" 并导航到
    C++ 来专门启用 C++ 语法。Notepad++ 仅适用于 Windows 平台（Orin, n.d。）。


    Bluefish 是更高级的文本编辑器，带有更多功能（“Bluefish Editor: Features,” n.d.）。与 Notepad++ 不同，Bluefish
    可适用于 Windows 以外的多个平台。我不向初学者推荐 Bluefish，因为它有很多功能会让完全的初学者感到无所从。如果你不是编程的新手，可以尝试一下；你会发现它具有许多
    IDE 编辑器典型的 GUI 功能。


    进入文本编辑器后，你必须选择一个编译器。现在让我向你展示如何在 Windows、Linux 和 Mac 三个平台上设置你的本地环境。


    ## Windows IDE 安装与设置


    你只需要安装一个 IDE。只需记住，它内部必须包含一个文本编辑器和一个编译器。**Code::Blocks** 是一个为 C++ 制作的实用开源 IDE，它可以轻松适配各种编译器，包括微软的
    Visual C++。安装 Code::Blocks 非常简单。你只需要访问他们的下载页面 http://www.codeblocks.org/downloads/26
    并选择最新版本即可。


    ![](img/3ceb4a3dfd578d1d4c40199c71445dd8_11_0.png)

    # Code::Blocks 下载页面


    截至本文编写，Code::Blocks 有适用于 Windows 和 Linux 发行版的 20.03 版本。页面还包含了有助于安装的注释。


    程序安装完成后，你就准备好了。你可以用它来编写 C++ 程序。要这样做，你需要遵循三个步骤：创建文件、编译程序和运行程序。


    创建新文件稍微微妙一些。你需要执行的是：


    - 点击 File（文件） > New（新建）

    - 选择“Create an empty file”（创建一个空文件）并输入你的代码

    - 以“.cpp”扩展名保存文件

    - 不用说，在运行程序之前必须先编译。你可以通过进入菜单中的 Build（编译） > “Build and Run”（编译并运行）来实现。


    ![](img/3ceb4a3dfd578d1d4c40199c71445dd8_12_0.png)

    # Code::Blocks 中的“Hello World”截图


    这是我们在 code blocks 中运行的“Hello World”程序的实时截图。此程序运行后，代码的编译消息（Build Messages）中会显示错误。Code::Blocks
    高亮了第 6 行的错误。根据你之前一节学到的 C++ 语法知识，你应该知道如何修复代码。我们该如何修复代码呢？


    顺便说一下，对于它允许完成的工作量，这个程序非常轻量。Code::Block 适用于 Windows 和 Linux，但没有 Mac 版本。


    ## Mac OS IDE 安装与设置


    对于 Mac，你需要获取 Xcode。它是适用于 macOS 的免费 IDE 软件开发套件。你可以在 App Store 获取它。Xcode 支持 Java、Python
    和 Ruby 等多种语言。


    它是面向 macOS 操作系统的开发；它可以用于 tvOS、watchOS 和 iPad（“What’s New in Xcode 9,” n.d.）。Xcode
    为不同的 macOS 平台提供了各种开发包（SDK）。

    '
