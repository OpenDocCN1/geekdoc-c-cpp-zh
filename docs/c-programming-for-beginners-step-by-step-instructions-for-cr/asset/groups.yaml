    逻辑数学运算，如 AND、OR、NOT。所有其他基于对象的 C++ 函数都必须由编译器翻译成机器语言。但位运算函数更快，因为它们跳过了这一步，直接与机器通信。它们通常被部署在竞争性编程中，以创建高度敏捷的程序和例。在竞争性编程之外，位运算函数在管理大数据方面也有一些功能。


    位运算函数的挑战在于它们对人类来说很难理解，因为它们是二进制的。为了看到计算机看到的内容，我们上了一节关于二进制和二进制数学的计算机科学课。我们用位运算程序创建了一个“字节大小”的寄存器流，并创建了动态缓冲区来存储位运算的位。这些虚拟缓冲区和寄存器就是服务器管理
    TB 数据的方式。想一下：我们的缓冲区和寄存器都只有一个字节长，但一个 TB 比我们的缓冲区大出 $10^{12}$ 倍：1,000,000,000 字节。


    对于像 YouTube 这样的网站来说，这些数字很小，它的后端计算基于 C++。YouTube 处理的数据是天文数字的（2018 年达到了 5.25 泽字节
    $10^{21}$ 字节）。它提供了超过 32.5 亿小时的内容（“How much data YouTube store? - Quora,” n.d.）。位运算函数赋予这些服务器在不中断或无大规模延迟的情况下处理负载的能力。这是
    C++ 力量及其处理大型复杂系统能力的最佳示例之一。对于程序员来说，这是一门非常有用的语言。如果你能将这些数据流可视化为具有 8 个槽位的数组，你将更容易理解许多位运算符，特别是移位运算符。


    除了二进制编程外，我们还处理了不同类型的数据，并探索了对象编程的不同方面。例如，我们做了大量处理字符串的练习。事实上，我们在每一项练习中都使用并部署了字符串。我们看到字符串也是数据数组，可以使用
    `<string>` 库中的各种对象进行解析。想想我们用过的拷贝构造函数调用组合。要解析任何类型的容器（vector 或数组），你需要一个带有元素地址运算符（Addressoof）的
    `for` 循环。该任务在 `<string>` 库中有一个专门的函数，你只需要正在解析的项的索引。如果说从这本书你应该中学到一点什么，那就是精通处理字符串：转义序列、通过数组索引处理字符串以及将字符串传递给不同的函数。


    我们还学习并讨论了功能和设计考虑。例如，我们讨论了如何以及何时使用循环。我们的银行安全示例通过我们在故障关闭（fail-close）系统中的退出控制循环示例得到了最好的说明。正如我们所说的，银行应该始终锁好并关闭门；它们是故障关闭的。银行的大多数事件都需要门和出口故障关闭，唯一应该打开的时候是火灾发生。系统应该保持一切受控，在例程之后测试条件。退出控制循环在其他领域也有用，例如数据控制。YouTube
    将数据修正作为正常操作的辅助例程。这确保了系统始终运行，不会被重发数据请求所阻塞。


