    # Basic Data Types


    Data types specify the size and types of information stored in a variable. Each
    has its own keyword and an associated size (“C++ Data Types”, n.d) :


    “int”: Keyword is short for “integer” and stores whole numbers. Has a size of
    4 bytes.


    “float”: Stores decimal numbers with 7 decimal digits. Has a size of 4 bytes.


    “double”: Stores decimals numbers with 15 decimal digits. Has a size of 8 bytes.


    “char”: Keyword is short for “character” and stores single characters regardless
    of their capitalization. Has a size of 1 byte.


    “bool”: Keyword is short for “boolean” and stores values that have a state of
    either true or false. Has a size of 1 byte.


    Note: Recall the “string”, data type. We have worked with this special datatype.
    String values can vary in size. Due to this, they are handled in the iostream
    library to apply more flexibility for text handling. We''ll return to strings
    and discuss some advanced topics in the next section.


    These sizes matter for data handling. For instance, when you use int with float
    / double all those numbers will be converted to int. It is because the compiler
