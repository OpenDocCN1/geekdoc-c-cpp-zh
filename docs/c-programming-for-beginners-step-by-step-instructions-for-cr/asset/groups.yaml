  - '[PAGE 13]


    For Mac, you will need to get Xcode . It is a free IDE software development suite
    for macOS. You can get it on the Mac App Store. Xcode supports a variety of other
    languages like Java, Python, and Ruby.


    It is geared towards developing software for macOS operating systems; this can
    be for the tvOS for AppleTV, watchOS for Apple watches, and the iPad for iPad
    tablets (“What’s New in Xcode 9,” n.d.). Xcode offers a variety of development
    kits (SDKs) for different macOS platforms to help programmers through Apple’s
    proprietary programming schemes. SDKs are a set of tools, providedby hardware
    and software vendors, used for developing applications for specific platforms
    (“What’s New in Xcode 9,” n.d.). SDKs allow developers to be fully integrated
    within a development community, like Apple’s or Android’s.


    Mac uses proprietary compilers that will only work with Xcode, so if you are on
    Mac you have little choice to develop with C++ using Xcode. You can download and
    install Xcode by following this link:


    https://apps.apple.com/us/app/xcode/id497798385?mt=12


    Once the file is downloaded and installed, open Xcode and click on the “Create
    a new Xcode Project” icon. Then select “New Project” in the initial window.


