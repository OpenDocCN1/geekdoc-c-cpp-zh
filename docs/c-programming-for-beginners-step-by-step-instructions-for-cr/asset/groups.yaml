    此表列出了操作符符号，并根据 (1) 它们一次接受多少操作数 > (2) 它们实现的操作类型进行分类。例如，大多数算术运算符一次对两个操作数进行操作。


    所有操作符的特征在于它们一次可以操作多少个操作数以及它们可以执行的操作类型。它们分为三类：


    - **一元运算符 (Unary)** - 一次只接受 1 个操作数的操作符

    - **二元运算符 (Binary)** - 一次只接受 2 个操作数的操作符

    - **三元运算符 (Ternary)** - 接受超过 2 个操作数的运算符，或带有多个参数的条件运算符


    它们进一步分为 6 类：

    - 算术运算符

    - 关系运算符

    - 逻辑运算符

    - 位运算运算符

    - 赋值运算符

    - 其他运算符，如条件运算符、地址和重定向运算符


    在本章中，我们将查看 5 种操作符及其功能。


    **注意：** 操作符具有优先级，就像数学方程一样。例如，用于调用函数的括号优先级高于加法或减法。然而，你应该尽量保持你的代码行尽可能简单。这使得你的程序更容易编辑和调试。整洁、复杂的代码可以避免错误。


    ## 二元运算符


    二元运算符是 C++ 中找到的大多数操作数。它们包含了 6 种运算符中的 5 种。这使得它们成为完美的起点。正如名称所示，二元运算符比较两个操作数。它们是决策和控制开关的完美选择。


    ## 算术运算符


    它们所有运算符中最常见且易理解的，因为即使在编程之外我们也使用它们，它们主要是数学性的。我们使用它们来执行数学运算。


    注意：在字符串拼接示例中，用于拼接的“ ” 并不是算术函数。相反，它是处理拼接的字符串库函数。


    此类分类中的大多数运算符都需要两个操作数。唯一的异常是用于在循环中增加或减少数值的一元“++”和“--”运算符。二元运算符 (Jaggi, 2015a)：


    - + +: 加法运算符，将两个操作数相加

    - -: 减法运算符，从一个操作数减去另一个

    - *: 乘法运算符，将两个操作数相乘

    - /: 除法“斜杠”运算符，将第一个操作数除以第二个

    - %: 取模运算符，返回第一个操作数除以第二个时的余数


