  \n```text\n\n\n\n\n# 13.15 标记\n# 13.16 标记\n# 13.17 图像\n\n### 13.1 图形类概览\n\n图形和 GUI\
  \ 库提供了大量的设施。我们所说的“大量”是指成百上千的类，每个类通常有几十个适用的函数。阅读描述、手册或文档，有点就像在看一本旧式的植物学教科，它根据晦涩的分类特征列出了成千上种植物的细节。这令人令望而畏！但它也可能令人兴奋——查看一个现代图形/GUI\
  \ 库的设施可以让你感觉像进了糖果店的孩子，但可能很难弄清楚从哪里开始，以及哪些对你真正有用。\n\n我们接口库的一个目的是减少由完整的图形/GUI 库的复杂性所带来的冲击。我们只展示了两个类类，几乎没有任何操作。然而，它们能够让你产生实用的图形输出。另一个密切相关的目标是通过这些类引入核心图形和\
  \ GUI 概念。现在，你就可以编写程序以简单图形的形式显示结果了。在本章之后，你的图形程序范围将增加到超过大多数人的初始需求。在学习第 14 章之后，你将理解涉及大部分设计技术和思想，以便你能够根据需要加深理解并扩展你的图形表达范围。你可以通过增加此处描述的设施或通过采用另一个\
  \ C++ 图形/GUI 库来实现。\n\n关键的接口类是：\n\n![Image](img/00105.jpeg)\n\n第 15 章将介绍函数（Function）和坐标轴（Axis）。第\
  \ 16 章将介绍主要的 GUI 接口类：\n\n![Image](img/00106.jpeg)\n\n源代码组织成如下文件：\n\n![Image](img/00107.jpeg)\n\
  \n除了图形类之外，我们还介绍了一个恰好用于存储形状（Shapes）或部件（Widgets）集合的类：\n\n![Image](img/00108.jpeg)\n\
  \n当你阅读后续章节时，请不要进展太快。虽然没有什么是不显而易见的，但本章的目的不仅仅是向你展示一些漂亮的图片——你每天都在电脑屏幕或电视机上看到更漂亮的图片。本章的要点是：\n\
  \n* 显示代码与生成的图像之间的对应关系。\n* 让你习惯阅读代码并思考它是如何工作的。\n* 让你思考代码的设计——特别是如何将概念表示为代码中的类。为什么这些类看起来是那样？它们还可以长什么样？我们做了许多、许多设计决策，其中大多数完全可以以不同的方式做出，在某些情况下甚至是是截然不同的。\n\
  \n所以请不要匆忙。如果你赶时间，你会错过一些重要的内容，然后可能会发现练习题变得异常地困难。\n\n### 13.2 点与线\n\n任何图形系统最基础的部分都是点。定义\
  \ `point` 就是在定义我们如何组织几何空间。在这里，我们使用一种传统的、面向计算机的二维点布局，由 `(*x*,*y)` 整数坐标定义。正如§12.5\
  \ 所述，`x` 坐标从 0（代表屏幕左侧）到 `x_max()`（代表屏幕右侧）；`y` 坐标从 0（代表屏幕顶部）到 `y_max()`（代表屏幕底部）。\n\
  \n正如在 `Point.h` 中定义的那样，`Point` 是一对 `ints`（坐标）：\n\n点击此处查看代码图像\n\n```cpp\nstruct Point\
  \ {\n    int x, y;\n};\n\nbool operator==(Point a, Point b) { return a.x==b.x &&\
  \ a.y==b.y; }\n\nbool operator!=(Point a, Point b) { return !(a==b); }\n```\n\n\
  在 `Graph.h` 中，我们找到了 `Shape`（我们将在第 14 章\n\n```cpp\nstruct Line : Shape { // 一个 Line\
  \ 是由两个 Points 定义的 Shape\n    Line(Point p1, Point p2); // 从两个 Points 构建一个 Line\n\
  };\n```\n\n`Line` 是 `Shape` 的一种。这就是 `: Shape` 的含义。`Shape` 被称为 `Line` 的 `base class`\
  \ 或简单称为 `Line` 的 `base`。基本上，`Shape` 提供了使 `Line` 定义变得所需的设施。一旦我们对特定的形状（如 `Line` 和\
  \ `Open_polyline`）有了感觉，我们将解释这意味着什么（第 4 章）。`Line` 由两个 `Points` 定义。忽略掉“脚手架”（如§12.3\
  \ 中描述的 `#includes` 等），我们可以创建线条并让它们像这样画出来：\n\n点击此处查看代码图像\n\n```cpp\n// 绘制线条\nPoint\
  \ x {100,100};\nSimple_window win1 {600,400};\nLine horizontal {x,200,100}; // 水平线\n\
  Line vertical {150,50}, {150,150}; // 垂直线\nwin1.attach(horizontal); // 附加水平线\nwin1.attach(vertical);\
  \ // 附加垂直线\n```\n\n执行这些，我们得到：\n\n![Image](img/0109.jpeg)\n\n正如所示，`Line` 运行得很好。你不需要是爱因斯坦也能猜到点击此处查看代码图像\
  \ `Line {150,50},{150,150}};` 创建了一个（垂直的）线。当然，有很多实现细节，但你不需要知道这些就可以制作 `Lines`。`Line`\
  \ 的构造函数相应地简单：\n\n点击此处查看代码图像\n\n```cpp\nLine::Line(Point p1, Point p2) // 从两个点构建\n\
  {\n    add(p1); // 向此 shape 添加 p1\n    add(p2); // 向此 shape 添加 p2\n}\n```\n\n也就是说，它只是“添加”了两个点。添加到哪里？`Line`\
  \ 如何在窗口中绘制？答案在 `Shape` 类中。正如我们将在第 14 章中描述的那样，`Shape` 可以持有定义线条，知道如何绘制由对定义的线条，并提供一个\
  \ `add()` 函数允许对象添加一个 `Point`。这里的关键点（point！）是定义 `Line` 是微不足道的。大部分实现工作由“系统”完成，以便我们可以编写易用的简单类。\n\
  \n从现在起我们将省略 `Simple_window` 的定义和 `attach()` 的调用。这些只是完整程序所需的“脚手架”，对特定形状的讨论帮助不大。\n\
  \n### 13.3 线\n\n事实证明，我们很少只画线。我们倾向于考虑由许多线条组成的对象，例如三角形、多边形、路径、迷宫、网格、柱状图、数学函数、数据图等。此类简单的“复合图形对象类”之一是\
  \ `Lines`：\n\n点击此处查看代码图像\n\n```cpp\nstruct Lines : Shape { // 相关线条\n    Lines()\
  \ {} // 空\n    Lines(initializer_list<Point> lst); // 从一组 Points 初始化\n    void draw_lines()\
  \ const;\n    void add(Point p1, Point p2); // 添加一条由两个点定义的线\n};\n```\n\n`Lines`\
  \ 对象仅仅是线条的集合，每条线由一对 `Points` 定义。例如，如果我们把§13.2 中 Line 示例的两条线视为单个图形对象的一部分，我们可以这样定义它们：\n\
  \n点击此处查看代码图像\n\n```cpp\nLines x;\nx.add(Point{100,100}, Point{200,100}); // 第一条线：水平线\n\
  ```\n\n\n\n\n\n```cpp\nx.add(Point{150,50}, Point{150,150}); // 第二条线：垂直线\n```\n\n\
