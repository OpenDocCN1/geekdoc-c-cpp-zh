  \ using 指令；参见 §A.15。\n\n### B.1.4 描述风格（原文为 B.1.3）\n\n即使是简单的标准库操作（如构造函数或算法），其完整描述也可能需要几页。因此，我们使用了极其简洁的表达风格。例如：\n\
