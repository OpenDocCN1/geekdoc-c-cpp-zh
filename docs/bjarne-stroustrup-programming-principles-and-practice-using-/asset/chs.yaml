  \         dst._lines.back ().push_back(token);\n        if( token =='\\n')\n   \
  \        dst._Lines.push_back(line{ } );\n    }\nif (!dst_.lastEmpty())//确保结尾有换行符\
  \ \n     dest.addLineAfterEOF();\nreturn source;\n}\n```\n\n两种基本容器都提供了名`.back()`的方法返回对尾端存储元素的引用\
