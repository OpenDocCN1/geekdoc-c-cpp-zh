  \n\n\n\n\n# 第四部分：拓展视野\n\n## 22\\. 理想与历史\n\n“当有人说，\n\n‘我想要一种编程语言，\n\n在其中我只需说出我希望完成的事，’\n\
  \n就给他一根棒棒糖。”\n\n——艾伦·佩利斯\n\n本章是一份极其简短且高度选择性的编程语言史，介绍了这些语言所服务的设计理想。这些理想以及承载它们的语言是专业精神的基础。由于本书中使用的是\
  \ C++，我们将重点介绍 C++及其影响过它的那些语言。目的在于为书中呈现的理念提供背景和视角。对于每种提到的语言，我们会介绍其设计者或团队：一门不仅是抽象的创造物而已，更是由具体个人为解决当时面临的问题而设计的实际方案。\n\
