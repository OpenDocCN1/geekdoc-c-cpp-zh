  \n- **图形是有用的**。在许多领域图形是必不可少的。例如，我们用它们来进行数据可视化。第 15 章给出了一些示例。\n- **图形是有趣的**。在许多领域图形是令人的。\n\
  - **图形具有可读性**。在许多领域图形代码是有启发性的。\n- **图形是设计示例的重要来源**。在许多领域图形设计至关重要。\n- **图形是对面向对象编程及其支持它的语言特性的很好的介绍**。与传闻相反，面向对象编程并不是为了图形而发明的，但它很快被应用于此，而图形提供了一些易于理解的面向对象设计。\n\
  - **一些核心概念并非偶然**。因此它们值得教授。如果我们不展示图形和 GUI 是如何实现的，你可能会认为它们是“魔法”，从而违背了本书的一个基本目标。\n\n\
  ### 12.2 显示模型\n\n`iostream` 库倾向于读取和写入字符流，这些流可能出现在数值列表或书籍中。对图形位置概念的直接支持只有换行符 `newline`\
  \ 和制表符 `tab`。你可以在一维字符流中嵌入颜色和二维位置等概念。这正是布局（排版、“标记”）语言（如 `Troff`、`TeX`、`Word`、`HTML`\
  \ 和 `XML` 以及它们相关的图形包）所做的。例如：\n\n点击此处查看代码图像\n\n## 组织结构\n\n此列表分为三个部分：\n\n- **提案 (Proposals)**，编号为\
  \ `EPddd`，. . .\n- **问题 (Issues)**，编号为 `EIddd`，. . .\n- **建议 (Suggestions)**，编号为\
  \ `ESddd`，. . .\n\n我们尝试 . . .\n\n\n\n\n\n这是一段 HTML，它定义了一个标题（`<h2>` . . . `</h2>`）、一个包含列表项（`<li>`\
  \ . . . `</li>`）的列表（`<ul>` . . . `</ul>`）以及一个段落（`<p>`）。我们省略了大部分实际的文本内容，因为它们在这里并不相关。重点在于，你可以用纯文本表示布局标记，但书写的字符与屏幕上显示的内容之间的联系是间接的，由一个解释这些“标记”命令的程序控制。这类技术从根本上来说简单且极其有用（你阅读的几乎所有内容都是它们生成的），但它们也有自己的局限性。\n\
  \n在本章接下来的四章中，我们将介绍另一种方案：一种直接面向计算机屏幕的图形和图形用户界面概念。基本概念本质上是图形化的（并且是二维的，适应屏幕的矩形区域），例如坐标、线、矩形和圆。从编程的角度来看，目标是实现内存中的对象与屏幕上图像之间的直接对应关系。\n\
  \n![Image](img/00005.jpeg)\n\n基本模型如下：我们用图形系统提供的基本对象（如线）来组合对象。我们将这些图形对象“附加”到一个代表我们物理屏幕的窗口对象上。我们可以将程序看作显示器本身，称为“显示引擎”、“我们的图形库”、“GUI\
  \ 库”，甚至（幽默地）称为“在屏幕背面写字的小矮人”，它会获取我们附加到窗口的对象并将它们画在屏幕上：\n\n![Image](img/00082.jpeg)\n\
  \n“显示引擎”在屏幕上绘制线条、在屏幕上放置文本字符串、为屏幕区域上等。为了简单起见，我们将用“我们的 GUI 库”甚至“系统”来称呼显示引擎，尽管我们的 GUI\
  \ 库所做的远不止于绘制对象。正如我们的代码让 GUI 库为我们完成大部分工作一样，GUI 库也将大部分工作委托给操作系统。\n\n### 12.3 第一个示例\n\
  \n我们的工作是定义类，从这些类中创建我们想要在屏幕上看到的对象。例如，我们可能想通过一系列连接的线来画一个图。这里有一个展示该功能简单版本的小程序：\n\n\
  点击此处查看代码图片\n\n```cpp\n#include \"Simple_window.h\"   // 访问我们的窗口库\n\n#include \"\
  Graph.h\"           // 使用我们的图形库设施\n\nint main()\n{\n    using namespace Graph_lib;\
  \     // 我们的图形设施在 Graph_lib 中\n    Point tl {100,100};               // 窗口的左上角\n\
  \    Simple_window win {tl,600,400,\"Canvas\"}; // 创建简单的窗口\n    Polygon poly;  \
  \                   // 创建一个形状（多边形）\n    poly.add(Point{300,200});         // 添加一个点\n\
  \    poly.add(Point{350,0});            // 添加另一个点\n    poly.add(Point{400,200});\
  \         // 添加第三个点\n    poly.set_color(Color::red);       // 调整 poly 的属性\n    win.attach(poly);\
  \                  // 将 poly 连接到窗口\n    win.wait_for_button();            // 将控制权交给显示引擎\n\
  }\n```\n\n当我们运行这个程序时，屏幕看起来像这样：\n\n![Image](img/00083.jpeg)\n\n让我们逐行检查程序，看看做了什么。首先，我们包含了图形接口的头文件：\n\
  \n点击此处查看代码图片\n\n```cpp\n#include \"Simple_window.h\"   // 访问我们的窗口库\n#include \"\
  Graph.h\"           // 使用我们的图形库设施\n```\n\n然后，在 `main()` 中，我们首先告诉编译器我们的图形设施可以在 `Graph_lib`\
  \ 中找到：\n\n点击此处查看代码图片\n\n```cpp\nusing namespace Graph_lib;     // 我们的图形设施在 Graph_lib\
  \ 中\n```\n\n接着，我们定义了一个点，将其作为窗口的左上角：\n\n点击此处查看代码图片\n\n```cpp\nPoint tl {100,100};\
  \               // 窗口的左上角\n```\n\n接下来，我们在屏幕上创建一个窗口：\n\n点击此处查看代码图片\n\n```cpp\nSimple_window\
  \ win {tl,600,400,\"Canvas\"}; // 创建简单的窗口\n```\n\n我们在 `Graph_lib` 接口库中使用了一个名为 `Simple_window`\
  \ 的类来表示窗口。这个特定的 `Simple_window` 命名为 `win`；即 `win` 是 `Simple_window` 类的变量。`win` 的初始化列表以用作左上角的点\
  \ `tl` 开始，随后是 `600` 和 `400`。它们分别是窗口在屏幕上显示的宽度和高度，单位为像素。我们稍后会进行详细解释，但这里的重点是我们通过给出宽度和高度来指定一个矩形。`Canvas`\
  \ 字符串用于标记该窗口。`tl` 点位于窗口的左上角。\n\n接下来，我们在窗口中放置了一个对象：\n\n点击此处查看代码图片\n\n```cpp\nPolygon\
  \ poly;                     // 创建一个形状（多边形）\npoly.add(Point{300,200});         //\
  \ 添加一个点\npoly.add(Point{350,0});            // 添加另一个点\npoly.add(Point{400,200});\
  \         // 添加第三个点\n```\n\n由于我们添加了三个点，所以得到了一个三角形。为了展示，我们接着将多边形的线条涂红：\n\n点击此处查看代码图片\n\
  \n```cpp\npoly.set_color(Color::red);       // 调整 poly 的属性\n```\n\n最后，我们将 `poly`\
  \ 附加到窗口 `win`：\n\n点击此处查看代码图片\n\n```cpp\nwin.attach(poly);                  // 将\
  \ poly 连接到窗口\n```\n\n为了让 GUI 系统在屏幕上显示对象，你必须将控制权交给“系统”。我们的 `wait_for_button()` 就是此，它还会等待你按下\
  \ `Simple_window` 的“下一步”按钮后继续。这让你在程序结束且窗口消失之前有机会观察它。\n\n点击此处查看代码图片\n\n```cpp\nwin.wait_for_button();\
  \            // 将控制权交给显示引擎\n```\n\n如果程序运行得不够快，你会注意到目前为止屏幕上什么都没有。我们创建了一个窗口（`Simple_window`\
  \ 对象），创建了一个多边形（名为 `poly`），将多边形涂成红色（`Color::red`），并将其附加到窗口（名为 `win`），但我们还没有请求显示该窗口。\n\
  \n孤立来看，我们的窗口看起来如下：\n\n![Image](img/00084.jpeg)\n\n你可能会注意到我们“作弊”了。那个标记为“下一步”的按钮是从哪里来的？我们把它构建在了\
  \ `Simple_window` 类中。\n\n\n\n\n你已经习惯了操作系统为每个窗口都加上一个边框，以至于你可能并没有特意注意到这一点。然而，本章及后续章节中的图片都是在\
  \ Microsoft Windows 系统上生成的，因此你“免费”拥有了右上角的那三个按钮。这非常有用：如果你的程序陷入了严重的混乱（这在调试过程中确实会发生），你可以通过点击\
  \ **X** 按钮将其杀掉。当你在另一个系统上运行程序时，系统会添加一个符合该系统习惯的不同边框。我们对边框的唯一贡献是标签（在这里是 `Canvas`）。\n\
  \n## 12.4 使用 GUI 库\n\n![Image](img/00005.jpeg)\n\n在本书中，我们不会直接使用操作系统的图形和 GUI（图形用户界面）设施。这样做会限制我们的程序只能在单个操作系统上运行，并且迫使我们直接处理许多杂乱的细节。就像文本\
  \ I/O 一样，我们将使用库来平滑操作系统差异、I/O 设备差异等，并简化我们的代码。遗憾的是，C++ 没有像提供标准流 I/O 库那样提供标准的 GUI 库，因此我们使用了许多可用的\
  \ C++ GUI 库之一。为了不让你直接绑定到其中某一个 GUI 库，并避免让你一次性面对 GUI 库的所有复杂性，我们使用了一组简单的接口类，这些类只需要几百行代码就可以实现任何\
  \ GUI 库。\n\n我们正在使用的 GUI 工具包（目前是间接使用）称为 `FLTK`（Fast Light Tool Kit，读作“full tick”），来自\
  \ [www.fltk.org](http://www.fltk.org)。只要使用 FLTK 的地方，我们的代码都是可移植的（Windows、Unix、Mac、Linux\
  \ 等）。我们的接口类也可以使用其他工具包重新实现，因此使用这些类的代码可能具有更好的可移植性。\n\n我们接口类提供的编程模型比通用工具包提供的要简单得多。例如，我们完整的图形和\
  \ GUI 接口库大约有 600 行 C++ 代码，而极其简练的 FLTK 文档有 370 页。你可以从 [www.fltk.org](http://www.fltk.org)\
  \ 下载它，但我们不建议你现在这样做。你一段时间内不需要那种程度的细节。在第 12 章–第 16 章中提出的通用思想可以用于任何流行的 GUI 工具包。当然，我们会解释我们的接口类是如何映射到\
  \ FLTK 的，以便你（最终）能够看到在必要时如何直接使用它（以及类似的工具包）。\n\n我们可以像这样阐明我们“图形世界”的部分：\n\n![Image](img/00005.jpeg)![Image](img/00085.jpeg)\n\
  \n我们的接口类提供了一个简单且用户可扩展的二维形状基本概念，对颜色的使用支持有限。为了实现这一点，我们提出了一种基于“回调”（callback）函数的简单 GUI\
  \ 概念，这些函数由屏幕上用户定义的按钮等的使用操作触发（见第 16 章）。\n\n## 12.5 坐标\n\n![Image](img/00005.jpeg)\n\
  \n计算机屏幕是由像素组成的矩形区域。像素是一个可以赋予某种颜色的微小点。在程序中建模屏幕的最常用方法是将其视为像素矩形。每个像素由一个 `x`（水平）坐标和一个\
  \ `y`（垂直）坐标标识。`x` 坐标从 0 开始，表示最左侧的像素，并向右侧增加到最右侧的像素。`y` 坐标从 0 开始，表示最顶部的像素，并向底部增加到最低的像素：\n\
  \n![Image](img/00086.jpeg)![Image](img/00007.jpeg)\n\n请注意，`y` 坐标是“向下增长”的。数学家们认为这很奇怪，但屏幕（和窗口）有很多尺寸，而左上角点大约是它们唯一的共同点。\n\
  \n可用的像素数量取决于屏幕：1024x768、1280x1024、1400x1050 和 1600x1200 是常见的屏幕尺寸。\n\n在使用屏幕与计算机交互的语境下，窗口是屏幕上用于某些特定目的并由程序控制的矩形区域。窗口的地址方式与屏幕完全一样。基本上，我们将窗口看作一个小屏幕。例如，当我们说\n\
  \n点击此处查看代码图像\n\n```\nSimple_window win {tl,600,400,\"Canvas\"};\n```\n\n我们请求了一个宽\
  \ 600 像素、高 400 像素的矩形区域，我们可以将其地址为 0–599（从左到右）和 0–399（从上到下）。你可以在上面绘图的窗口区域通常被称为 `canvas`（画布）。600x400\
  \ 的区域指的是窗口的“内部”，即系统提供的边框内部的区域；它不包括系统用于标题栏、退出按钮等的空间。\n\n## 12.6 形状\n\n我们用于屏幕上绘图的基础工具箱由十几个类组成：\n\
  \n![Image](img/00087.jpeg)\n\n我们的接口类提供了一个简单且用户可扩展的二维形状基本概念，对颜色的使用支持有限。为了实现这一点，我们提出了一种基于“回调”（callback）函数的简单\
  \ GUI 概念，这些函数由屏幕上用户定义的按钮等的使用操作触发（见第 16 章）。## 12.7 使用原始操作\n\n在本节中，我们将带你浏览一些原始操作。目标是让你对可以做什么有一个宽泛的认识，但还没有深入理解任何一个。在接下来的章节中，我们将探索它们的设计。\n\
  \n### 12.7.1 图形头文件和 main\n\n首先，包含定义图形接口的头文件：\n\n点击此处查看代码图像\n\n```cpp\n#include \"\
  Window.h\"\n```\n\n或者\n\n点击此处查看代码图像\n\n```cpp\n#include \"Simple_window.h\"\n```\n\
  \n正如你可能猜到的，`Window.h` 包含了窗口相关的设施，而 `Graph.h` 包含了在窗口中绘制形状相关的设施。像往一样，`main()` 包含了我们要执行（直接或间接）的代码并处理异常：\n\
  \n点击此处查看代码图像\n\n```cpp\nint main ()\ntry\n{\n    // 这里是我们的代码\n}\ncatch(exception&\
  \ e) {\n    // 错误报告\n    return 1;\n}\n\ncatch(...) {\n    // 更多的错误报告\n    return\
  \ 2;\n}\n```\n\n为了让这个 `main()` 编译，我们需要 `exception` 被定义。我们可以像往常一样包含 `std_lib_facilities.h`\
  \ 获取它，或者我们可以开始直接处理标准头文件并包含 `<stdexcept>`。\n\n### 12.7.2 一个几乎空白的窗口\n\n\n\n\n我们在这里不讨论错误处理（参见第\
  \ 5 章），特别是 §5.6.3），而是直接进入 `main()` 中的图形部分：\n\n点击此处查看代码图像\n\n```\nPoint tl {100,100};\
  \             // 我们窗口的左上角\n\nSimple_window win {tl,600,400,\"Canvas\"};\n\n    \
  \         // 左上角的屏幕坐标 tl\n             // 窗口大小(600*400)\n             // 标题: Canvas\n\
  \nwin.wait_for_button();   // 显示！\n```\n\n这创建了一个 `Simple_window`，即带有“Next”按钮的窗口并显示在屏幕上。显然，我们需要包含头文件\
  \ `Simple_window.h` 而不是 `Window.h` 来获取 `Simple_window`。在这里我们指定了窗口在屏幕上的位置：它的左上角位于\
  \ `Point{100,100}`。这离屏幕左上角很近，但不过分。显然，`Point` 是一个类，其构造函数接受一对整数并将它们解释为 `(x,y)` 坐标对。我们本可以这样写：\n\
  \n点击此处查看代码图像\n\n```\nSimple_window win {Point{100,100},600,400,\"Canvas\"};\n```\n\
  \n然而，我们想多次使用点 `(100,100)`，因此给它一个符号性名称更方便。600 是窗口的宽度，400 是高度，`Canvas` 是我们想要放在窗口框上的标签。\n\
  \n为了实际上在屏幕上画出窗口，我们必须将控制权交给 GUI 系统。我们通过调用 `win.wait_for_button()` 来，结果如下：\n\n![Image](img/00088.jpeg)![Image](img/00006.jpeg)\n\
  \n在我们窗口的背景中，我们看到一个笔记本屏幕（为了这个场合经过了一些清理）。对于对无关细节好奇的人，我们可以告诉你们，我这张照片时站在安比斯的毕加索图书馆附近，越过海湾看向尼斯。部分隐藏在后面的黑色控制台窗口是运行我们程序的窗口。有一个控制台窗口有点丑且没必要，但它的优势是，如果一个部分调试的程序进入无限循环并拒绝消失，它可以为我们一种有效的方法来杀死窗口。如果你仔细看，你会注意到我们正在运行\
  \ Microsoft C++ 编译器，但你完全可以使用其他任何编译器（如 Borland 或 GNU）。\n\n在演示的剩余部分，我们将消除窗口周围的干扰，只显示该窗口本身：\n\
  \n![Image](img/00089.jpeg)\n\n窗口的实际尺寸（英寸）取决于你屏幕的分辨率。某些屏幕的像素比其他屏幕大。\n\n### 12.7.3\
  \ 坐标轴\n\n一个几乎空白的窗口并不有趣，所以我们最好添加一些信息。我们想显示什么呢？为了提醒你，图形并不全是趣味玩乐，我们将从一些严肃且相当复杂的东西开始：坐标轴。没有轴的图表通常是耻辱。没有轴，你根本不知道数据代表什么。也许你已经在某些随附文本中解释了一切，但添加坐标轴要安全得多；人们通常不读解释，而且良好的图形表示往往会与其原始语境分离。因此，图表需要坐标轴：\n\
  \n点击此处查看代码图像\n\n```\nAxis xa {Axis::x, Point{20,300}, 280, 10, \"x axis\"};   //\
  \ 创建一个坐标轴\n                               // 坐标轴是形状的一种\n                       \
  \        // Axis::x 意味着水平的\n                               // 从 (20,300) 开始\n  \
  \                             // 长度 280 像素\n                               // 10\
  \ 个“刻度”\n                               // 将坐标轴标记为 \"x axis\"\n\nwin.attach(xa);\
  \                               // 将 xa 附加到窗口 win\nwin.set_label(\"Canvas\");\n\
  win.wait_for_button();\n```\n\n（重复部分略）\n为了实际上在屏幕上画出窗口，我们必须将控制权交给 GUI 系统。我们通过调用 `win.wait_for_button()`\
  \ 来，结果如下：\n\n![Image](img/00088.jpeg)![Image](img/00006.jpeg)\n\n（重复部分略）\n\n\n\n\
  这次我们改变了正弦曲线（`sine`）的颜色，仅仅是为了展示如何操作。然后我们添加了一个三角形，就像我们在 §12.3 的第一个示例中那样，作为一个多边形的示例。再次，我们设置了颜色，最后设置了样式。`Polygon`\
  \ 的线条有一个“样式”。默认情况下，它是实线，但根据需要，我们也可以将这些线条设置为虚线、点线等（参见 §13.5）。我们得到了：\n\n![Image](img/00093.jpeg)\n\
  \n### 12.7.6 矩形\n\n![Image](img/00005.jpeg)\n\n屏幕是一个矩形，窗口是一个矩形，一张纸也是一个矩形。事实上，我们现代世界中极大量的形状都是矩形（或者至少是圆角的矩形）。这是有原因的：矩形是最容易处理的形状。例如，它很容易描述（左上角坐标加上宽度和高度，或者左上角加上右下角坐标，以此此类推），很容易判断一个点是在矩形内部还是外部，而且让硬件快速绘制一个像素矩形也非常容易。\n\
  \n因此，大多数高级图形库对矩形的处理得比对其他闭合形状更好。因此，我们提供了 `Rectangle` 作为一个独立于 `Polygon` 类的类。一个 `Rectangle`\
  \ 的特征是它的左上角加上宽度和高度：\n\n点击此处查看代码图像\n\n```\nRectangle r {Point{200,200}, 100, 50};\
  \           // 左上角, 宽度, 高度\n\nwin.attach(r);\n\nwin.set_label(\"Canvas #6\");\n\n\
  win.wait_for_button();\n```\n\n从这里，我们得到了：\n\n![Image](img/00094.jpeg)\n\n请注意，仅仅在正确的位置用四个点创建一个折线并不足以构成一个\
  \ `Rectangle` 的。很容易创建一个在屏幕上看起来像 `Rectangle` 的 `Closed_polyline`（你甚至可以创建一个看起来完全像\
  \ `Rectangle` 的 `Open_polyline`）；例如：\n\n点击此处查看代码图像\n\n```\nClosed_polyline poly_rect;\n\
  \npoly_rect.add(Point{100,50});\n\npoly_rect.add(Point{200,50});\n\npoly_rect.add(Point{200,100});\n\
  \npoly_rect.add(Point{100,100});\n\nwin.attach(poly_rect);\n```\n\n![Image](img/00095.jpeg)\n\
  \n事实上，屏幕上这种 `poly_rect` 的*图像**确实*是一个矩形。然而，内存中的 `poly_rect` 对象并不是 `Rectangle`，它并不“知道”任何关于矩形的信息。证明这一点最简单的方法是添加另一个点：\n\
  \n```\npoly_rect.add(Point{50,75});\n```\n\n没有任何矩形是有五个点的：\n\n![Image](img/00096.jpeg)![Image](img/00005.jpeg)\n\
  \n对于我们代码的推理来说，`Rectangle` 不仅仅是在屏幕上看起来像个矩形是很重要的；它保持了矩形的根本保证（正如我们从几何中所学的那样）。我们编写的代码依赖于\
  \ `Rectangle` 在屏幕上确实是一个矩形，并保持如此。\n\n### 12.7.7 填充\n\n我们一直是以轮廓形式绘制形状。我们也可以用颜色“填充”矩形：\n\
  \n点击此处查看代码图像\n\n```\nr.set_fill_color(Color::yellow);           // 给矩形内部上色\n\npoly.set_style(Line_style(Line_style::dash,4));\n\
  \npoly_rect.set_style(Line_style(Line_style::dash,2));\n\npoly_rect.set_fill_color(Color::green);\n\
  \nwin.set_label(\"Canvas #7\");\n\nwin.wait_for_button();\n```\n\n我们还决定我们不喜欢三角形（`poly`）的线条样式，所以我们将它的线条样式设置为“粗（厚度是正常四倍）虚线”。同样，我们改变了\
  \ `poly_rect` 的样式（现在看起来不再像矩形了）：\n\n![Image](img/00097.jpeg)\n\n如果你仔细观察 `poly_rect`，你会发现轮廓打印在填充之上。\n\
  \n填充任何闭合形状都是可能的（参见 §13.9）。矩形的特殊之处在于填充它们非常简单（且快速）。\n\n### 12.7.8 文本\n\n![Image](img/00005.jpeg)\n\
  \n最后，任何绘图系统如果没有简单的文本写入方法都是不——将每个字符描成一组线条是不够的。我们可以为窗口本身标记标签，轴也可以有标签，但我们也可以使用 `Text`\
  \ 对象在任何地方放置文本：\n\n点击此处查看代码图像\n\n```\nText t {Point{150,150}, \"Hello, world!\"};\n\
  \nwin.attach(t);\n\nwin.set_label(\"Canvas #7\");\n\nwin.wait_for_button();\n```\n\
  \n\n\n\n间接地，我们也用到了操作系统。为了简化说明，我们把操作系统和标准库忽略掉，以下的图形结构图就可以表示我们绘图代码的组织方式：\n\n![Image](img/00103.jpeg)\n\
  \n*附录 D* 说明了如何将所有这一切组合在一起。\n\n### 12.8.1  源文件\n\n我们的图形界面接口库仅包含五个头文件和三个程序文件：\n\n\
