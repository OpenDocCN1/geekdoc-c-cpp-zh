  \n\n这个实现是正确的，但仔细审视后我们会发现其中存在大量冗余的内存分配和释放操作。当我们赋值的目标向量比源向量包含更多元素时该怎么办？当目标向量的元素数量与源向量相同时又该如何处理？在许多应用中，最后一种情况非常常见。无论是哪种情形，你其实都可以直接将\
  \ `a.elem[i]` 复制到目标对象已有的 `elem` 空间里。其代码应为：\n\n```\nvector& vector::operator=(const\
  \ vector& a)\n{\n    if (this==&a) return *this;      // 自我赋值检查,无需额外工作\n    if (a.sz<=space)\
  \ {                     // space 足够大则不用再分配新内存.\n        for (int i = 0; i<a.sz;\
  \ ++i) elem[i] = a.elem[i];   //复制所有内部变量。\n\tsz=a_sz；\n\t返回*这;\n}\n双精度浮点类型指针 p=new\
  \ double[a .sz ]                         foreach(... )进行循环重新赋初值过程 .\n```\n\n在这里我们首先检测了自引用的情况（示例中已体现）；这项判断有时能带来性能优化效果\
  \ 。逻辑上可以删除该分支但要保留它会更高效——练习时可以试着去掉这一句验证程序仍然正确 。\n\n现在我们拥有了几乎堪称真实可用的 double 型通用容器\
  \ :\n\n//近乎完整的 real_double_vector 类的定义：\nclass Vector {\n/*\n不变条件:\n若索引处于合法范围,\n\
  那么对应位置上的成员数值有效且为指定大小以及额外的预留容量保留了足够存储……\nprivate 部分应当持有：size_t 类型的 numElements ；T\
  \ 数据型的 elementData ； int reservedCapacity .\n*/\npublic 中的常用方法包括 ：构造函数 、析构函数和各种关键性操作符重载\
  \ ——这些都属于经典设计模式中必不可少的部分.\n\n由此能够看出它具有重要的生命周期管理能力、支持下标取值和信息查询接口以及动态扩充容量的特性 。但我们并不满足于只服务于\
  \ double 单一数据类型；期望的是能让使用者任意选择底层的数据种类 ∶比如象下面这样来用\n\n```\nVector<double>\nVector<int\
  \ >\n...\n```\n\n要达成此目的就必须掌握模板的语法知识.虽然我们从最开始就一直借助库提供好的现成工具却从没亲手试写过自身的模版创建显然是不够完善的\
  \ ，所以我们得了解标准化委员会是如何给语言加入泛化机制这不仅可以帮助看清本质还能使我们有能力撰写高质量的组件在后边的章节里面我们将说明怎样根据 Template\
