  n\";`\n11. `string s = \"ape\"; if (s==\"fool\") cout < \"Success!\\n\";`\n12. `string\
  \ s = \"ape\"; if (s+\"fool\") cout < \"Success!\\n\";`\n13. `vector<char> v(5);\
  \ for (int i=0; 0<v.size(); ++i) ; cout << \"Success!\\n\";`\n14. `vector<char>\
