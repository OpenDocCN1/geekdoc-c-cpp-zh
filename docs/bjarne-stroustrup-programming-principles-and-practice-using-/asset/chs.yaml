  \n如果 `Month` 是一个 `enum class`（类枚举），则两个条件都无法编译。如果 `monday` 是一个“普通”枚举的枚举成员，而不是 `enum\
  \ class`，那么月份与 `Monday` 的比较将成功，但很可能产生不理想的结果。\n\n倾向于使用更简单、安全的 `enum classes` 而不是“普通”枚举，但要做好在旧代码中发现“普通”枚举的准备：`enum\
  \ classes` 是 C++11 中引入的。\n\n### 9.6 运算符重载\n\n你可以为类或枚举操作数定义几乎所有的 C++ 运算符。这通常被称为`运算符重载`（operator\
  \ overloading）。当我们想要为设计的类型提供惯用的表示法时，就会使用它。例如：\n\n点击此处查看代码图像\n\n```cpp\nenum class\
  \ Month {\n    Jan=1, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec\n};\n\
  \nMonth operator++(Month& m)              // 前置增增运算符\n{\n    m = (m==Dec) ? Jan\
  \ : Month(int(m)+1);      // “回绕”\n    return m;\n}\n```\n\n`? :` 结构是一个“算术 if”：如果\
  \ `(m==Dec)` 为真，则 `m` 变为 `Jan`，否则变为 `Month(int(m)+1)`。这是表达月份在 12 月之后“回绕”事实的一种相当优雅的方法。`Month`\
  \ 类型现在可以这样使用：\n\n点击此处查看代码图像\n\n```cpp\nMonth m = Sep;\n++m;    // m 变为 Oct\n++m;\
  \    // m 变为 Nov\n++m;    // m 变为 Dec\n++m;    // m 变为 Jan (“回绕”)\n```\n\n你可能认为递增一个\
  \ `Month` 常见到并不需要专门定义一个运算符。也许确实如此，但输出运算符呢？我们可以这样定义它： \n\n点击此处查看代码图像\n\n```cpp\n\
  vector<string> month_tbl;\nostream& operator<<(ostream& os, Month m)\n{\n    return\
  \ os << month_tbl[int(m)];\n}\n```\n\n这假设 `month_tbl` 已在某处初始化，以便（例如）`month_tbl[int(Month::mar)]`\
  \ 是 \"March\" 或该月份的其他适当名称；请参见 §10.11.3。\n\n你可以为自己的类型定义 C++ 提供的几乎任何运算符，但仅限于现有的运算符，如\
  \ `+`、`-`、`*`、`/`、`%`、`[ ]`、`( )`、`^`、`!`、`&`、`<`、`<=`、`>`、`>=`。你不能定义自己的运算符（如 `*=`），C++\
  \ 不允许。你只能按照惯例的操作数数量定义运算符；例如，你可以定义一元 `-`，但不能定义一元 `<=`（小于等于），可以定义二元 `+`，但不能定义二元 `!`（逻辑非）。基本上，该语言允许你为定义的类型使用现有语法，但不允许扩展该语法。\n\
  \n![Image](img/00005.jpeg)\n\n重载的运算符必须至少有一个用户定义的类型作为操作数：\n\n点击此处查看代码图像\n\n```cpp\n\
  int operator+(int,int);                 // error: 你不能重载内置的 +\nVector operator+(const\
  \ Vector&, const Vector &);     // OK\nVector operator+=(const Vector&, int);  \
  \             // OK\n```\n\n![Image](img/00006.jpeg)\n\n通常情况下，除非你确定它会对你的代码产生重大影响，否则不为类型定义运算符是一个好主意。此外，仅按照惯例含义定义运算符：`+`\
  \ 应为加法，`*` 应为乘法，`[ ]` 应为访问，`( )` 应为调用。这只是建议而非语言规则，但它是很好的建议：运算符的惯用用法（如用 `+` 相加）可以显著帮助我们理解程序。毕竟，这种用法是数百年来数学符号表示的结果。相反，晦涩的运算符和不惯常的运算符用法可能会成为严重的干扰和错误来源。我们不再详述这一点。相反，在接下来的章节中，我们只会在认为适当的少数地方使用运算符重载。请注意，最有趣的重载的运算符并不是人们通常认为的\
  \ `+`、`-` 和 `/`，而是 `=`、`!=`、`<` 和 `( )`。\n\n### 9.7 类接口\n\n我们已经论证了类的公共接口和实现部分应该是分离的。只要我们留出使用\
  \ `struct` 处理“纯数据”类型的可能性，很少有专业人士会异议。然而，我们如何设计一个良好的接口？什么区分了良好的接口和一团糟？答案的一部分只能通过示例给出，但我们可以列出几条原则，它们在\
  \ C++ 中得到了一些支持：\n\n![Image](img/00005.jpeg)\n\n* 保持接口完整。\n* 保持接口极简。\n* 提供的构造函数。\n\
  * 支持拷贝（或禁止拷贝）（参见 14.2.4）。\n* 使用类型提供参数检查。\n* 识别非修改成员函数（参见 [9]）。\n* 释放资源（参见 [9.7]）。\n\
  * 析构函数（参见 [9.7]）。\n\n前两个原则可以总结为“保持接口尽可能小”。我们希望接口是完整的，因为我们希望它易用；但我们也希望接口尽可能小，因为我们希望它易于维护。我们希望提供构造函数，因为我们希望类能够正确初始化；我们也希望支持或禁止拷贝，因为我们需要管理对象的生命周期。我们使用类型提供参数检查，因为我们希望在编译期发现错误；我们识别非修改成员函数，因为我们希望代码的意图清晰。释放资源和析构函数是因为我们希望防止内存泄漏。月份和日期的表示问题（例如\
  \ 4/5 在美国是 4 月 5 日，在英国是 5 月  日））无法解决，必须采取其他措施。\n\n#### 9.7.1 类型参数\n\n当我们为 `Date`\
  \ 的构造函数使用 `int` 参数 时，， ` `..`，这导致了一些问题：\n\n点击此处查看代码图像\n\n```cpp\nDate d1 {4,5} \
  \ //    5 4 月 5 日还是 5 月 4 日？\nDate d2 {2005,4,5} // 同样，4 还是 5？\n```\n\n第一个问题（非法的日期）可以通过构造函数中的测试轻松解决。然而，第二个问题（月份与日的混淆）用户代码无法捕捉。第二个问题仅仅是编写月份和日的习惯不同。显而易见的解决方案是使用\
  \ `Month` 类型：\n\n点击此处查看代码图像\n\n```cpp\nenum class Month {\n    Jan=1, Feb, Mar,\
  \ Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec\n};\n\n// 简单的 Date（使用 Month 类型）\n\
  class Date {\npublic:\n    Date(int y, Month m, int d); // 检查有效日期并初始化\n    // .\
  \ . .\nprivate:\n    int y; // 年\n    Month m;\n    int d; // 日\n};\n```\n\n使用 `Month`\
  \ 类型时，如果我们交换了月份和日期，编译器会捕捉到错误，而且将枚举作为 `Month` 类型也为我们提供了符号名称。使用符号名称通常比使用数字更易于阅读和编写，因此不容易出错：\n\
  \n点击此处查看代码图像\n\n```cpp\nDate dx1 {1998, 4, 3};         // error: 第二个参数不是 Month\n\
  Date dx2 {1998, 4, Month::mar};  // error: 第二个参数不是 Month\nDate dx2 {4, Month::mar,\
  \ 1998};  // oops: 运行时错误：日期 1998\nDate dx2 {Month::mar, 4, 1998};  // error: 第二个参数不是\
  \ Month\nDate dx3 {1998, Month::mar, 30}; // OK\n```\n\n\n\n\n\n这处理了大多数“意外”。注意在使用枚举器\
  \ `mar` 与枚举名时的作用域限定符用法：`Month::mar`。我们不说 `Month.mar`，因为 `Month` 不是一个对象（它是一个类型），而\
  \ `mar` 不是一个数据成员（它是一个枚举器——一个符号常量）。在类、枚举或命名空间的名称后使用 `::`，在对象名称后使用 `.`（点）。\n\n![Image](img/00006.jpeg)\n\
  \n当我们有选择时，我们倾向于在编译时捕获错误，而不是在运行时。我们更倾向于让编译器来发现错误，而不是由我们来尝试确定问题具体发生在代码的哪个位置。此外，在编译时捕获的错误不需要检查要编写和执行的代码。\n\
  \n按照这种思路，我们还能捕获日期和年份的互换吗？我们可以做到，但解决方案不像对于 `Month` 那样简单或优雅；毕竟，曾经存在过公元 4 年，而你可能想要表示它。即使我们将自己限制在现代，相关的年份可能也太多，以至于我们无法在枚举中列出所有它们。\n\
  \n在不完全了解 `Date` 预期用途的情况下，我们可能能做的最好的办法可能是这样的：\n\n点击此处查看代码图像\n\n```cpp\nclass Year\
  \ { // 范围在 min:max) 的年份\n    static const int min = 1800;\n    static const int\
  \ max = 2200;\npublic:\n    class Invalid { };\n    Year(int x) : y{x} { if (x<min\
  \ || max<=x) throw Invalid{}; }\n    int year() { return y; }\nprivate:\n    int\
  \ y;\n};\n\nclass Date {\npublic:\n    Date(Year y, Month m, int d); // 检查有效日期并初始化\n\
  \    // . .\nprivate:\n    Year y;\n    Month m;\n    int d; // 日\n};\n```\n\n现在我们得到\n\
  \n[点击此处查看代码图像\n\n```cpp\nDate dx1 {Year{1998}, 4, 3}; // 错误：第二个参数不是 Month\nDate\
  \ dx2 {Year{1998}, 4, Month::mar}; // 错误：第二个参数不是 Month\nDate dx2 {4, Month::mar,\
  \ Year{1998}}; // 错误：第一个参数不是 Year\nDate dx2 {Month::mar, 4, Year{1998}}; // 错误：第二个参数不是\
  \ Month\nDate dx3 {Year{1998}, Month::mar, 30}; // OK\n```\n\n这个奇怪且不太可能发生的错误在运行之前仍然不会被捕获：\n\
  \n点击此处查看代码图像\n\n```cpp\nDate dx2 {Year{4}, Month::mar, 1998}; // 运行时错误：Year::Invalid\n\
  ```\n\n为了检查年份而增加额外的工作和符号是值得的吗？当然，这取决于你使用 `Date` 解决的问题类型的限制，但在这种情况下，我们怀疑这并不值得，并且在后续操作中不会使用\
  \ `Year` 类。\n\n![Image](img/00006.jpeg)\n\n当我们编程时，总是要问自己，对于给定的应用，什么才足够好。我们没有奢侈在找到一个足够好的方案后，去“永远”寻找一个完美的方案。如果继续搜索，我们甚至可能想出一个比简单方案更复杂的方案。这就是格言“最好的是好的敌人”（伏尔泰）的一种含义。\n\
  \n![Image](img/00005.jpeg)\n\n注意在 `min` 和 `max` 定义中使用了 `static const`。这是我们在类内部定义符号常量的方法。对于类成员，我们使用\
  \ `static` 来确保该值只有一份，而不是每个对象一份。在这种情况下，由于初始化器是一个常量表达式，我们可以使用 `constexpr` 代替 `const`。\n\
  \n### 9.7.2 拷贝\n\n我们总是必须创建对象；因此，我们必须始终考虑初始化和构造函数。可以说，它们是类中最重要的成员：编写它们时，你必须决定初始化一个对象需要什么，以及一个值有效意味着什么（不变性是什么？）。下一个要考虑的问题通常是：我们可以拷贝对象吗？如果，我们如何拷贝它们？\n\
  \n对于 `Date` 或 `Month`，答案是我们我们显然想要拷贝该类型的对象，而且拷贝的意义是显而易见的：只需复制所有成员。实际上，这是默认情况。所以只要你什么都不说，编译器就会恰好这样做。例如，如果你将一个\
  \ `Date` 作为初始化器或赋值的右值进行拷贝，它所有的成员都会被拷贝：\n\n点击此处查看代码图像\n\n```cpp\nDate holiday {1978,\
  \ Month::jul, 4}; // 初始化\nDate d2 = holiday;\nDate d3 = Date{1978, Month::jul, 4};\n\
  holiday = Date{1978, Month::dec, 24}; // 赋值\nd3 = holiday;\n```\n\n这将符合预期。`Date{1978,\
  \ Month::dec, 24}` 这种表示法产生一个 `Date` 对象，然后你使用它。例如：\n\n点击此处查看代码图像\n\n```cpp\ncout\
  \ << Date{1978, Month::dec, 24};\n```\n\n这种写法是某个类的构造函数的字面量用法，通常是默认函数的函数。如果我们不想要默认的拷贝行为呢？我们可以定义自己的（参见\
  \ 18.3）或者删除拷贝构造函数和拷贝赋值（参见 14.2）。\n\n### 9.7.3 默认构造函数\n\n![Image](img/00005.jpeg)\n\
  \n未初始化的变量可能是错误的根源。为了解决这个问题，我们使用构造函数确保每个类的对象都初始化。例如，我们声明了构造函数 `Date::Date(int, Month,\
  \ int)`。对于 `Date`，这意味着程序员必须提供三个正确类型的参数。例如：\n\n点击此处查看代码图像\n\n```cpp\nDate d0; //\
  \ 错误：没有初始化\nDate d1 {}; // 错误：空初始化\nDate d2 {1998}; // 错误：参数不足\nDate d3 {1,2,3,4};\
  \ // 错误：参数过多\nDate d4 {1,\"jan\",2}; // 错误：参数类型错误\nDate d5 {1,Month::jan,2}; //\
  \ OK：使用三参数构造函数\nDate d6 {d5}; // OK：使用拷贝构造函数\n```\n\n注意，尽管我们定义了构造函数，仍然可以拷贝许多类对默认值有良好的定义；即，“如果我不提供初始化器，它应该是什么值？”对于类型\
  \ `T`，`T{}` 是由默认构造函数定义的默认值的表示法，所以我们可以写：\n\n```cpp\nstring s1 = string{}; // 默认值：空字符串\
  \ \" \"\nvector<string> v1 = vector<string>{}; // 默认值：空 vector；没有元素\n```\n\n这看起来很合理。它的工作正如注释所示。然而，我们更倾向于等效且口语化的：\n\
  \n```cpp\nstring s1; // 默认值：空字符串 \" \"\nvector<string> v1; // 默认值：空 vector；没有元素\n\
  ```\n\n\n\n\n对于内建类型，如`int`和`double`，默认构造函数记法表示 0。因此 `int{}` 是一种复杂的表示 0 的方式，而 `double{}`则是冗长地表达“0.0”的一种方式。\n\
  \n使用默认构造函数不仅仅是外观问题。假设我们有一个未初始化的 `string``或 ``vector`\n\n点击此处查看代码图片\n\n```cpp\nstring\
  \ s;\n\nfor (int i=0; i<s.size(); ++i)     //哎呀：循环次数不确定\n    s[i] = toupper(s[i]);\
  \        //哎呀：读写随机内存位置\n\nvector<string> v;\n\nv.push_back(\"bad\");           \
  \    //哎呀：写入随机地址\n```\n\n如果`s(V)`的值确实是不确定的、那么它们就不知道自身包含多少个元素,也不知道这些元素应该存储在哪里（采用常规实现技术；参见§17.5）。结果将是对随机地址的访问——这就会导致最糟糕的错误类型的发生基本上来说没有用于建立不变量我们就无法确保那些变量的值是否有效必须坚持要求这样的变量进行初始化我们可以强制编写下面这样带初始值的代码：\n\
