  缺少稳定一致的定时却能在不同编译器平均情况下测得虽然缺乏法定保证常见的嵌入设置需初始化引导阶段使电源循环或重启后达到完全运行状态允许消耗定义的上限量或许可以使用相同方法启动或者单独为未来需求预设静态分配尽管出于结构原因很少这么做综合来看不准事的预留能力应遵循管理项目的约定编码规范参见§25。\n\
  \n有两个特别有用的模板可以实现确定性管理名为栈池设计在下个段落示例说明抑制内部空缺的性质详述；\n\n-   **栈:**  允许无限新增条目仅移除最新添加的增长收缩只在最顶端进行消除了穿插空槽的可能性因而维持连续排列。\n\
  \    \n-   **池**:   由等大的元素组成可在不超预设总数前提下获取释放单个单元尺寸不一致不会留下中间间隔的空间\n\n\n\n两种变体都表现出快速且有边界的特性非常适合要求严格可靠的上下文最优选择来自外部经过验证精确满足规范的库而标准容器类如\
