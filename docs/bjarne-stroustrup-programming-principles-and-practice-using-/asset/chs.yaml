  \ 和 C++ 中的 `const`。\n8. 讨论宏及其常见用途。\n9. 实现一个包含保护符。\n10. 列出从 C++ 采纳的 C 特性。\n11. 列出未被\
  \ C 采纳的 C 特性。\n12. 实现一个（C 风格字符串， int）查找表，包含 `find(struct table*, const char*)`、`insert(struct\
  \ table*, const char*, int)` 和 `remove(struct table*, const char*)` 等操作。表可以是结构体数组，也可以是数组对（`char*[]`\
  \ 和 `int*`），由你选择。同时也为你的函数选择返回值。记录你的设计决策。\n13. 编写一个程序，在 C 中实现等于 `string s; cin>>s;`\
  \ 的功能；即定义一个输入操作，将任意长度的空白终止字符序列读取到零终止的字符 数组中。\n14. 编写一个函数，接收 `ints` 数组作为输入并找到最小和最大的元素。它还应该计算中位数平均值。使用一个持有结果的结构体作为返回值。\n\
  15. 在 C 中模拟单继承。让每个“基类”包含一个指向函数数组的指针（以模拟虚函数，即以指向“基类”对象的指针作为第一个参数的自由函数）。通过将“基类”设为派生类第一个成员的类型来实现“派生”。对于每个类，相应地初始化“虚函数”数组。为了测试这些想法，实现一个版本的“旧\
  \ Shape 示例”，其中基类和派生类的 `draw()` 只打印它们的类名。仅使用标准 C 可用的语言特性和库设施。\n16. 使用宏来掩盖（简化符号）上一个练习中的实现。\n\
  \n### 结语\n\n\n\n\n我们之前提到过，兼容性问题并不总是那么令人兴奋。然而，存在大量 C 代码（数十亿行），如果你必须阅读或编写这些代码，本章将帮助你做好准备。就个人而言，我们更喜欢\
