  \n\n关键字`static`是为了确保`cb_next()`能够像普通函数一样被调用，即不是作为针对特定对象调用的 C++ 成员函数。如果系统能直接调用一个真正的\
  \ C++ 成员函数会好得多，然而回调接口必须能被多种语言使用，因此我们只能这样实现：一个静态成员函数。\n\n参数类型为 `Address`（地址），说明 `cb_next()`接受的参数是“内存中某物”的地址。大多数编程语言不识别\
  \ C++ 引用，所以我们不能使用它们。编译器并未被告知这些“某物”的具体类型是什么——这里我们已经非常接近硬件层面了，无法得到通常来自语言的帮助。“系统”将用一个回调函数的第一个参数来触发该回掉所对应的\
  \ GUI 实体 (`Widget`)的地址；我们将不使用这第一个参数故不必为其命名；第二个变量则是包含那个 Widget 窗口本身的真址对就我们的情况而言此刻就是代表着\
  \ Simple_window 。我们可以利用这个信息如下述方式处理：\n\n```\nvoid Simple_window::cb_next(Address,\
  \ Address pw)\n// call Simple_window::next() for the window located at pw\n{\n \
  \   reference_to<Simple_window>(pw).next();\n}\n```\n\n表达式 `reference_to<Simple_window>(pw)`告诉编译器：存储在指针/引用形参中的是一个指向类实例的有效指针——确切地说是指向某个已定义类型的对象的合法机器级标识符的定义范围所明确的东西经过适当检查后提取到最终目标元素时会获得的成效下提供的一个我们知道的对象型别例如指的是但不限于此概念的一般性应用归结于具体版本时有且仅有一个先前提及的记忆细节最后成为简单构成树的各种考量基于上述引出等价内容如同示例化表格等等叙述……不过尽管如此其核心意思即为借助此指示符让代码真正获得另一个名叫作什么单纯名称的这个对象的实例并预期包括各类数据和方法常规用法完成解套——这是由前述线索引出的方法收复环节通过跳出第三遍重复过程实现了与技术理论和设计始终一致的最后检验步骤就此进入全新层次把每一层之间关系拔高那些坚固依靠自然让我们在宽松心境写出所有想要的某种简要记录至此令人欣慰我们现在仅仅踏上了熟悉的第一步。”\n\
