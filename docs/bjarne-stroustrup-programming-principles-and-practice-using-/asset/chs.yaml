  \n我们可以向“段落 20.2”中添加新的行，而不会导致用于定位\"段落 20:3\"的迭代器失效。\n\n总而言之，（相较于将所有字符连续分配于 `std::vector`）采用内部链表表示的原因有二：其一是在列表中进行插入操作时无需移动其他元素的地址——当外部实体存在元素引用时这一点至关重要；其二是出于性能优势考虑以应对虽不常见但编辑量大的场景,取而代之优化批量读取本质上顺序访问模式的方式因此‘默认使用\
