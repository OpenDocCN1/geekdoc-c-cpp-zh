  \ 函数），最好是一个需要循环的计算。\n18. 什么时候不需要测试 `pre-condition`？\n19. 什么时候不需要测试 `post-condition`？\n\
  20. 调试的步骤有哪些？\n21. 为什么注释有帮助？\n22. 测试与调试有何区别？\n\n### 术语\n- `argument error`（参数错误）\n\
  - `assertion`（断言）\n- `catch`（捕获）\n- `compile-time error`（编译时错误）\n- `container`（容器）\n\
  - `debugging`（调试）\n- `error`（错误）\n- `exception`（异常）\n- `invariant`（不变性）\n- `link-time\
  \ error`（链接时错误）\n- `logic error`（逻辑错误）\n- `post-condition`（后置条件）\n- `pre-condition`（前置条件）\n\
  - `range error`（范围错误）\n- `run-time error`（运行时错误）\n- `syntax error`（语法错误）\n- `testing`（测试）\n\
  - `throw`（抛出）\n- `type error`（类型错误）\n\n### 练习\n1. 如果你还没有，请完成本章的**尝试练习**。\n2. 下面程序输入摄氏度值并转换为开尔文。这段代码有很多错误。找到它们、列出来并修正代码。\n\
  \n```\ndouble ctok(double c) // 将摄氏度转换为开尔文\n{\n    int k = c + 273.15;\n    return\
  \ int\n}\nint main()\n{\n    double c = 0; // 声明变量\n    cin >> c; // 获取温度\n    double\
  \ k = ctok(c); // 转换\n    cout << k << '\\n'; // 输出温度\n}\n```\n3. 绝对零是可以达到的最低温度；它是\
  \ 273.15°C。上面的程序即使修正了，在给定低于温度时也会产生错误结果。在主程序中放置一个检查，如果给定的温度低于此值，则产生错误。\n4. 重复练习 3，但这次在\
  \ `ctok()` 内部处理错误。\n5. 扩展程序使其也能从开尔文转换为摄氏度。\n6. 写一个从摄氏度转换为华氏度的程序（公式见 4.3）。使用估计法判断你的结果是否合理。\n\
  7. 二次方程的形式为 $a \\cdot x² + b \\cdot x + c = 0$。求解这些方程使用二次公式：\n$x = \\frac{-b \\\
  pm \\sqrt{b² - 4ac}}{2a}$\n但有一个问题：如果 $b²–4ac$ 小于零，它将失败。编写一个可以计算二次方程 $x$ 的程序。创建一个函数，在给定\
  \ $a$,$b$,$c$ 的情况下打印二次方程的根。当程序检测到无实根时，让它打印一条消息。\n8. 编写一个程序读取并存储一系列整数，然后计算前 $N$ 个整数的和。首先询问\
  \ $N$，然后将值读入向量，然后计算前 $N$ 个值的和。例如：\n“请输入你想求和的数字个数：”\n3\n“请输入一些整数（按 '|' 停止）：”\n12\
  \ 23 13 24 15 |\n“前 3 个数字（12 23 13）的和为 48。”\n处理所有输入。例如，如果用户请求的和的数字个数超过了向量中的数字个数，请确保给出一个错误信息。\n\
  9. 修改练习 8，如果结果无法表示为 int，则写出一个错误。\n10. 修改练习 8，使用 `double` 代替 `int`。此外，创建一个包含相邻值之间\
  \ $N$–1 个差值的 `double` 类型的向量，并输出该差值向量。\n\n\n\n\n### 11. 编写一个程序，输出斐波那契数列的前若干个值，即从\
  \ 1 1 2 3 5 8 13 21 34 开始的数列。该数列的下一个数字是前两个数字之和。找到能放入 `int` 类型中的最大 Fibonacci 斐波那契数。\n\
  \n### 12. 实现一个名为（出于某种不明的原因）“牛牛”（Bulls and Cows）的小猜游戏。该程序包含一个拥有 0 到 9 范围内四个不同整数的\
  \ `vector`（例如 1234，但不是 1122），用户的任务是通过反复猜测来发现这些数字。假设要猜测的数字是 1234，用户猜的是 1359；响应应该是“1\
  \ 个牛和 1 个兔”，因为用户有一个数字（1）正确且位置正确（一个牛），还有一个数字（3）正确但位置错误（一个兔）。继续猜下去，直到用户获得四个“牛”，即四个数字都正确且顺序正确。\n\
  \n### 13. 这个程序有点乏味，因为答案是硬编码在程序中的。制作一个版本，让用户可以反复玩（无需停止并重启程序），且每个游戏都有新的四个数字。你可以通过调用四次\
  \ `std_lib_facilities.h` 中的随机数生成器 `randint(10)` 来获取四个随机数字。你会发现，如果你反复运行该程序，每次启动时都会选择相同的四个数字序列。为了避免这种情况，让用户输入一个数字（任意数字），并在调用\
  \ `randint(10)` 之前调用 `srand(n)`，其中 `n` 是用户之前输入的数字。这样的 `n` 被称为*种子*（seed），不同的种子会产生不同的随机数序列。\n\
  \n### 14. 从标准输入中读取（星期，数值）值对。例如：\n\n点击此此处查看代码图片\n\n周二 23 周五 56 周二 –3 周四 99\n\n将每周每一天的数值收集到\
  \ `vector<int>` 中。输出这七个星期 `vector` 的值。打印每个 `vector` 中数值之和。忽略非法的星期（例如 Funday），但接受常见的同义词（如\
  \ Mon 和 monday）。输出被拒绝的数值数量。\n\n#### 结记\n\n![图像](img/00007.jpeg)\n\n你认为我们是否过度强调错误了吗？作为新手程序员，我们本会这么认为。显而易见且自然的反应是：“怎么可能那么糟糕！”好吧，事实确实如此糟糕。世界上许多顶尖的大脑都曾为编写正确程序的困难感到震惊和困惑。根据我们的经验，优秀的数学家最有可能低估\
  \ bug 问题，但我们很快就会超过了那种一次性写出完全正确程序的自然能力。你已经收到警告了！幸运的是，在大约 50 年后，我们在组织代码以减少问题方面积累了丰富经验，并掌握了寻找那些我们尽管我们尽力但在首次编写程序时不可避免会留下的\
  \ bug。本章的技术和示例是一个很好的开始。\n\n## 6. 编写程序\n\n“编程就是理解。”\n– Kristen Nygaard\n\n编写程序涉及逐渐完善你对想要做什么以及想要如何表达这些想法的想法。在本章和下一章中，我们将从一个模糊最初的想法开始，经过分析、设计、实现、测试、重新设计和重新实现的阶段，开发一个程序。我们的目标是让你了解在开发代码时所进行的这类思考。在此过程中，我们将讨论程序组织、用户定义类型以及输入处理。\n\
