  ```\n\n注意 `|=` 可以读作“设置某位”（或作为“设置某些位”）。同样，`&` 可以读作“某位是否被设置了？”。例如：\n\n点击此处查看代码图像\n\
  \n```cpp\nif (x& out_of_color) {             // out_of_color 设置了吗？（是的，设置了）\n// .\
  \ . .\n}\n```\n\n我们仍然可以使用 `&` 来进行掩码：\n\n点击此处查看代码图像\n\n```cpp\nunsigned char y =\
  \ x &(out_of_color | out_of_black);   // y 变为 24\n```\n\n现在 `y` 拥有了来自 `x` 第 4 位和第\
  \ 3 位（`out_of_color` 和 `out_of_black`）的副本。\n\n将 `enum` 作为一组位是非常常见的。在这样做时，我们需要进行类型转换，以将位逻辑运算的结果“转回”枚举类型。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nFlags z = Printer_flags(out_of_color | out_of_black);  //\
  \ 类型转换是必要的\n```\n\n之所以需要类型转换，是因为编译器不知道 `out_of_color | out_of_black` 的结果对于 `Flags`\
  \ 来说是一个有效值。编译器的怀疑是有必要的：毕竟，没有任何枚举成员的值是 24（`out_of_color | out_of_black`），但在这种情况下，我们知道赋值是合理的（但编译器并不知道）。\n\
  \n#### 2.5.5 位域 (Bitfields)\n\n![图像](img/0005.jpeg)\n\n如前所述，硬件接口是位频繁出现的一个区域。通常，接口被定义为位和各种大小数字的混合体。这些“位和数字”通常被命名，并出现在字的特定位置，通常称为寄存器。C++\
  \ 有一种特定的语言特性来处理此类布局：位域。考虑考虑操作系统深层中页管理器中使用的页码。这里是来自操作系统的一张图表：\n\n![图像](img/0009.jpeg)\n\
  \n这个 32 位字被用作两个数值字段（一个 22 位，一个 3 位）和四个标志位（每个 1 位）。这些数据的大小和位置是固定的。中间甚至有一个未使用的（且未命名的）“字段”。我们可以将其表达式为一个结构体：\n\
  \n点击此处查看代码图像\n\n```cpp\nstruct PPN {\n    unsigned int PFN : 22;  // 页帧号\n    int\
  \ : 3;               // 未用\n    unsigned int CCA : 3;  // 缓存一致性算法\n    bool nonreachable\
  \ : 1;\n    bool dirty : 1;\n    bool valid : 1;\n    bool global : 1;\n};\n```\n\
  \n我们必须阅读手册才能发现 `PFN` 和 `CCA` 应该被解释为无符号整数，否则我们可以直接根据图表写出该结构体。位域从左到右填充字。你需要在冒号后提供整数值作为位数。你不能指定绝对位置（例如，第\
  \ 8 位）。如果你用位域“消耗”的位超过了字的容量，无法容纳的字段将放入下一个字中。希望这就是你想要的。一旦定义，位域的使用方法与其他变量完全相同：\n\n\
  点击此处查看代码图像\n\n```cpp\nvoid part_of_VM_system(PPN * p )\n{\n    // . . .\n    if\
  \ (p->dirty) { // 内容已更改\n        // 拷贝到磁盘\n        p->dirty = 0 ;\n    }\n    //\
  \ . . .\n}\n```\n\n位域主要为你节省了通过移位和掩码来获取位于字中间信息的烦恼。例如，给定一个名为 `pn` 的 `PPN`，我们可以这样提取\
  \ `CCA`：\n\n点击此处查看代码图像\n\n```cpp\nunsigned int x = pn.CCA;   // 提取 CCA\n```\n\n\
  如果我们使用一个名为 `pni` 的 `int` 来表示相同的位，我们反而可以写成\n\n点击此处查看代码图像\n\n```cpp\nunsigned int\
  \ y = (pni>>4)&0x7;\n```\n\n那就是将 `pn` 右移使 `CCA` 位于最左位，然后用 `0x7` 掩码掉其他位。“缩写汤”在上下文中毫无意义。\n\
  \n#### 2.5.6 一个示例：简单加密\n\n作为位和字节操作的一个示例，让我们考虑简单加密：Tiny 算法（TEA）。它最初是由剑桥大学的 David\
  \ Wheeler （22.1）。它很小，但对非法解密的保护非常好。不要深究代码（除非你真的想并且愿意为此头疼）。我们展示代码仅仅是为了让你感受真实的位操作。如果你想对加密进行研究，你需要专门的教材。更多信息和该算法的变体，请参见\
  \ [Tiny Algorithm](https://en.wikipedia.org/wiki/Tiny_Algorithm) 以及布拉德福大学 Simon\
  \ Shepherd 教授的网站。\n\n![图像](img/0005.jpeg)\n\n加密/解密（也称为加密/解密）的基本思想非常简单。我想给你发送一些文本，但不让别人看到。因此，我以这种方式转换文本，使其对不知道我是如何修改它的人变得不可读。这就是加密。为了加密，我使用一种算法（我们必须假设不速客知道它）和一个被称为“密钥”的字符串。你我都有密钥（我们希望不速客没有）。\n\
  \nTEA 接收一个双无符号长整数数组（`v[0]`, `v[1]`）作为待加密的八个字符，一个双长整数数组（`w[0]`, `w[1]`）用于写入加密输出，以及一个四个无符号长整数数组（`k[0]`..`k[3]`）作为密钥：\n\
  \n点击此处查看代码图像\n\n```cpp\nvoid encipher(\n    const unsigned long *const v,\n    unsigned\
  \ long *const w,\n    const unsigned long * const k)\n{\n    static_assert(sizeof(long)==4,\"\
  size of long wrong for TEA\");\n    unsigned long y = v[0];\n    unsigned long z\
  \ = v[1];\n    unsigned long sum = 0;\n}\n```\n\n\n\n\n\n```\nconst unsigned long\
  \ delta = 0x9E3779B9;\n\nfor (unsigned long n = 32; n––>0; ) {\n    y += (z<<4 ^\
  \ z>>5) + z^sum + k[sum&3];\n    sum += delta;\n    z += (y<<4 ^ y>>5) + y^sum +\
  \ k[sum>>11 & 3];\n}\n\nw[0]=y;\nw[1]=z;\n```\n\n注意所有数据都是 `unsigned`（无符号）类型，这样我们就可以对其进行位运算操作，而无需担心因负数特殊处理带来的意外。移位（`<<`\
  \ and `>>`) 、异或 (`\\verb|^^|| ; :,`) ，和按位与 (`&\\bn){~}`;)执行核心工作——外加普通的(`unig 说明})加法作为补充手段。此代码专为机器上的``long```占用四个字节的场景编写。\n\
