  ### 9.4.5 引用当前对象\n\n### 9.4.6 报告错误\n\n## 9.5 枚举\n\n### 9.5.1 “普通”枚举\n\n## 9.6 运算符重载\n\
  \n## 9.7 类接口\n\n### 9.7.1 参数类型\n\n### 9.7.2 拷贝\n\n### 9.7.3 默认构造函数\n\n### 9.7.4\
  \ const 成员函数\n\n### 9.7.5 成员与“辅助函数”\n\n## 9.8 Date 类\n\n***\n\n### 9.1 用户定义类型\n\n\
  ![Image](img/00005.jpeg)\n\nC++ 语言为你提供了一些内置类型，如 `char`、`int` 和 `double` (§A.8)）。如果编译器在不需要程序员在源代码中提供声明的情况下，就已经知道如何表示该类型的对象以及可以对该对象执行哪些操作（如\
  \ `+` 和 `*`），则该类型被称为内置类型。\n\n![Image](img/00005.jpeg)\n\n不是内置的类型被称为用户定义类型 (UDTs)。它们可以是标准库类型——作为每个\
  \ ISO 标准的一部分供所有 C++ 程序员使用。（注：原文文本在此处存在大量重复内容，已根据逻辑进行了清理处理）。\n\n\n\n\n类（class）是一个用户定义的类型。它由内置类型、其他用户定义的类型以及函数组成。用于定义类的部分被称为\
  \ `members`（成员）。一个类有零或多个成员。例如：\n\n点击此处查看代码图片\n\n```cpp\nclass X {\npublic:\n   \
  \ int m;                               // 数据成员\n    int mf(int v) { int old = m;\
  \ m=v; return old; }   // 函数成员\n};\n```\n\n成员可以是各种类型。大多数要么是数据成员（data members），用于定义类对象的表示；要么是函数成员（function\
  \ members），用于对这些对象提供操作。我们使用 `object.member` 符号来访问成员。例如：\n\n点击此处查看代码图片\n\n```cpp\n\
  X var;                              // var 是类型 X 的变量\nvar.m = 7;               \
  \          // 为 var 的数据成员 m 赋值\nint x = var.mf(9);                 // 调用 var 的成员函数\
  \ mf()\n```\n\n你可以将 `var.m` 理解为 `var` 的 `m`。大多数人将其读作“var dot m”或“var’s m”。成员的类型决定了我们可以对其执行哪些操作。我们可以读取和写入一个\
  \ `int` 成员，调用一个函数成员等。\n\n成员函数（member function），例如 `X` 的 `mf()`，不需要使用 `var.m` 符号。它可以使用纯成员名称（在本例中为\
  \ `m`）。在成员函数内部，成员名称指的是调用该成员函数的对象中具有该名称成员。因此，在调用 `var.mf(9)` 时，`mf()` 定义中的 `m` 指的是\
  \ `var.m`。\n\n### 9.3 接口与实现\n\n![Image](img/00005.jpeg)\n\n通常，我们认为一个类有一个接口\n\n```cpp\n\
  class X {  // 此类的名字是 X\npublic:\n    // 公共成员：\n    //     – 给用户的接口（所有地方可访问）\n  \
  \  // 函数\n    // 类型\n    // 数据（通常最好保持为私有）\nprivate:\n    // 私有成员：\n    //     –\
  \ 实现细节（仅供该类的类的成员使用）\n    // 函数\n    // 类型\n    // 数据\n};\n```\n\n类成员默认是私有的；这意味着：\n\
  \n```cpp\nclass X {\n    int mf(int);\n    // . .\n};\n```\n\n意味着：\n\n```cpp\nclass\
  \ X {\nprivate:\n    int mf(int);\n    // . .\n};\n```\n\n因此：\n\n点击此处查看代码图片\n\n\
  ```cpp\nX x;            // 类型为 X 的 x\nint y = x.mf(); // 错误：mf 是私有的（即不可访问）\n```\n\
  \n用户不能直接引用私有成员。相反，我们必须通过公共函数。例如：\n\n点击此处查看代码图片\n\n```cpp\nclass X {\n    int m;\n\
  \    int mf(int);\npublic:\n    int f(int i) { m=i; return i; }\n};\nX x;\nint y\
  \ = x.f(2);\n```\n\n我们使用 `private` 和 `public` 来表示接口（用户对类的视图）与实现细节（实现者对类的视图）之间的重要区别。我们在讲解过程中解释这一点并给出大量例子。这里我们只需提一下，对于纯粹的数据，这种区分是没有意义的。因此，对于没有实现的类，有一个实用的符号。`struct`\
  \ 是一个成员默认是公有的类：\n\n```cpp\nstruct X {\n    int m;\n    // . .\n};\n```\n\n意味着：\n\
  \n```cpp\nclass X {\npublic:\n    int m;\n    // . .\n};\n```\n\n`structs` 主要用于数据结构，其中成员可以取任何值；也就是说，我们无法定义任何有意义的不变性（9.4.3）。\n\
  \n### 9.4 类的演变\n\n让我们通过展示如何以及为什么我们可能将一个简单的数据结构演变为一个具有私有实现和支持的操作的类，来说支持类的类的特性以及使用它们的基本技术。我们使用如何在程序中表示日期（例如\
  \ 1954 年 8 月 14 日）这个看似微不足道的问题。许多程序对日期的需求是显而易见的（商业交易、天气数据、日历程序、库存管理等）。唯一的问题是我们可以如何表示它们。\n\
  \n#### 9.4.1 struct 和函数\n\n我们如何表示日期？当被问及时，大多数人的回答是：“嗯，年份、月份和日期怎么样？”这并不是唯一的答案，也不总是最好的答案，但对于我们的用途已经足够了，所以我们将这样做。我们的第一次尝试是一个简单的\
  \ struct：\n\n点击此处查看代码图片\n\n```cpp\n// 简单的 Date（太简单了？）\nstruct Date {\n    int y;\
  \ // 年份\n    int m; // 年中的月份\n    int d; // 日期\n};\nDate today; // 一个 Date 变量（一个命名的对象）\n\
  ```\n\n一个 `Date` 对象（如 `today`）将仅仅三个 `ints`：\n\n![Image](img/00064.jpeg)\n\n在任何地方都没有依赖\
  \ `Date` 相关的隐藏数据结构的“魔法”——这在本章中 `Date` 的每一个版本都是如此。\n\n所以，现在我们有了 `Dates`；我们可以对它们做什么呢？我们可以做任何事情，意味着我们可以访问\
  \ `today`（以及任何其他 `Date`）的成员，并随所欲地读取和写入它们。问题在于这并不方便。几乎对 `Date` 想要做的任何事情都必须通过对成员的读取和写入来实现。例如：\n\
  \n点击此处查看代码图片\n\n```cpp\n// 将今天设为 2005 年 12 月 24 日\ntoday.y = 2005;\ntoday.m = 24;\n\
  today.d = 12;\n```\n\n这样做繁琐且容易出错。你发现错误了吗？任何繁琐的事情都是容易出错的！例如，这合理吗？\n\n```cpp\nDate\
  \ x;\nx.y = –3;\nx.m = 13;\nx.d = 32;\n```\n\n可能不会，但有人会写吗——或者会有？\n\n```cpp\nDate\
  \ y;\ny.y = 2000;\ny.m = 2;\ny.d = 29;\n```\n\n2000 年是闰年吗？你确定吗？\n\n我们所做的就是提供一些辅助函数来完成最常见的操作。这样我们就不需要重复相同的代码，也不会反复地发现并修复相同的错误。对于每种类型，初始化和赋值都是最常见的操作之一。对于\
  \ `Date`，增加日期的值另一个常见操作，所以我们写下\n\n点击此处查看代码图片\n\n```cpp\n// 辅助函数：\nvoid init_day(Date&\
  \ dd, int y, int m, int d) {\n    // 检查 (y,m,d) 是否为有效日期\n    // 如果是，使用它初始化 dd\n\
  }\nvoid add_day(Date& dd, int n) {\n    // 将 dd 增加 n 天\n}\n```\n\n我们现在可以尝试使用 `Date`：\n\
  \n点击此处查看代码图片\n\n```cpp\nvoid f() {\n    Date today;\n    init_day(today, 12, 24,\
  \ 2005); //哎！（12 年没有 2005 天）\n    add_day(today, 1);\n}\n```\n\n#### 9.4.2 成员函数和构造函数\n\
  \n\n\n\n我们为 `Dates` 提供了一个初始化函数，它对 `Dates` 的有效性进行了重要的检查。然而，如果我们不使用这些检查函数，它们就无用武处了。例如，假设我们已经为\
  \ `Date` 定义了输出运算符 `<<` (§9.8):\n\n点击此处查看代码图像\n\n```cpp\nvoid f()\n{\n    Date today;\n\
  \    // . . .\n    cout << today << '\\n';                使用 today\n    // . . .\n\
  \    init_day(today,2008,3,30);\n    // . . .\n    Date tomorrow;\n    tomorrow.y\
  \ = today.y;\n    tomorrow.m = today.m;\n    tomorrow.d = today.d+1;      //给 today\
  \ 加 1\n    cout << tomorrow << '\\n';      // 使用 tomorrow\n}\n```\n\n在这里，我们“忘记”了立即初始化\
  \ `today`，并且“某人”在我们得及调用 `init_day()` 之前使用了它。“另一些人”决定调用 `add_day()` 是浪费时间——或者可能没听过它——于是手动构造了\
  \ `tomorrow`。事实证明，这是很糟糕的代码——非常糟糕的代码。有时（可能在大多数时候），它是能够正常运行的，但微小的变化会导致严重的错误。例如，写出一个未初始化的\
  \ `Date` 将产生垃圾输出，而通过简单向其成员 `d` 相加 1 来增加一天是一颗定时炸弹：当 `today` 是该月的最后一天时，这种增加会产生一个无效的日期。这段“非常糟糕的代码”最糟糕的一点在于它看起来并不糟糕。\n\
  \n这种思维方式导致我们需要一个不会被遗忘的初始化函数，以及不容易被忽略的操作。实现这一点的基本工具是*成员函数*（member functions），即在类体内部声明为类成员的函数。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\n// 简单的 Date\n// 使用构造函数保证初始化\n// 提供一些符号上的便利\nstruct Date\
  \ {\n    int y, m, d;                    // 年，月，日\n    Date(int y, int m, int d);\
  \      // 检查有效日期并初始化\n    void add_day(int n);            // 将 Date 增加 n 天\n};\n\
  ```\n\n与类同名的成员函数是特殊的。它被称为*构造函数*，并将用于该类对象的初始化（即“构造”）。如果一个类有一个需要参数的构造函数，那么忘记初始化该类的对象就是一个错误（会被编译器捕获），而且我们有一种特殊的便捷语法来执行此类初始化：\n\
  \n点击此处查看代码图像\n\n```cpp\nDate my_birthday;                           // 错误：my_birthday\
  \ 未初始化\nDate today {12,24,2007};               // 哎！运行时错误\nDate last {2000,12,31};\
  \                // OK（口语化风格）\nDate next = {2014,2,14};               // OK（稍显冗长）\n\
  Date christmas = Date{1976,12,24};         // OK（冗长风格）\n```\n\n尝试声明 `my_birthday`\
  \ 失败了是因为我们没有指定所需的值。尝试声明 `today` 将通过编译，但构造函数中的检查代码会在运行时捕获非法日期（`{12,24,2007}`—— 12\
  \ 年第 24 月没有 27 日）。`last` 的定义提供了初始值——即 `Date` 构造函数所需的参数——紧跟在变量名后的 `{}` 列表中。这是对于一个具有需要参数的构造函数的类的最常见的变量初始化风格。我们也可以使用更冗长的风格，即显式地创建一个对象（这里是\
  \ `Date{1976,12,24}`）并使用 `=` 语法来初始化变量。除非你真的喜欢打字，否则很快就会厌倦这种方式。\n\n我们现在可以尝试使用新定义的变量了：\n\
  \n点击此处查看代码图像\n\n```cpp\nlast.add_day(1);\nadd_day(2);      // 错误：什么日期？\n```\n\n\
  注意，使用点访问符号为特定的 `Date` 调用了成员函数 `add_day()`。我们将在 9.4.4 中展示如何定义成员函数。在 C++98 中，人们使用括号分隔初始化列表，因此你会看到很多这样的代码：\n\
  \n点击此处查看代码图像\n\n```cpp\nDate last(2000,12,31); // OK（旧口语化风格）\n```\n\n我们更倾向于使用 `{}`\
  \ 作为初始化列表，因为它清晰地指示了何时（何时构造）完成，而且因为这种符号更有用。这种符号也可以用于内置类型。例如：\n\n点击此处查看代码图像\n\n```cpp\n\
  int x {7}; // OK（现代风格）\n```\n\n可选地，我们可以在 `=` 之前使用 `{}`：\n\n点击此处查看代码图像\n\n```cpp\n\
  Date next = {2014,2,14}; // OK（稍显冗长）\n```\n\n有些人认为这种新旧风格的结合更有可读性。\n\n### 9.4.3 将细节私有\n\
  \n我们仍然有一个问题：如果有人忘记使用成员函数 `add_day()` 怎么办？如果有人直接修改月份呢？毕竟我们“忘记”提供这种机制：\n\n点击此处查看代码图像\n\
  \n```cpp\nDate birthday {1960,12,31};   // 1960 年 12 月 31 日\n++birthday.d;     \
  \          // 哎！无效日期（birthday.d==32 无效）\nDate today {1970,2,3};\ntoday.m = 14; \
  \              // 哎！无效日期\n```\n\n只要我们让 `Date` 的表示对所有人可见，就会有人无论无意还是故意地搞乱它。![Image](img/00007.jpeg)\n\
  \n这些考虑让我们认为，Date 的表示除了通过我们提供的成员函数外，应该是不可访问的。这是第一版方案：\n\n点击此处查看代码图像\n\n```cpp\n//\
  \ 简单的 Date（控制访问）\nclass Date {\n    int y, m, d;                    // 年，月，日\npublic:\n\
  \    Date(int y, int m, int d);      // 检查有效日期并初始化\n    void add_day(int n);   \
  \         // 将 Date 增加 n 天\n    int month() { return m; }\n    int day() { return\
  \ d; }\n    int year() { return y; }\n};\n```\n\n我们可以这样使用它：\n\n点击此处查看代码图像\n\n```cpp\n\
  Date birthday {1970,12,30};   // 1970 年 12 月 30 日\nbirthday.m = 14;            \
  \   // 错误：Date::m 是私有的\ncout << birthday.month() << '\\n'; // 我们提供了读取 m 的方法\n```\n\
  \n\n\n\n另一种方案是我们在每次使用对象时都检查其有效性，或者仅仅希望没有人遗留下无效值。经验表明，“希望”可能会导致产生“还不错意”的程序。然而，作为一名专业人士，编写出偶尔产生错误结果并偶尔崩溃的“还不错意”的程序，并不是赢得朋友和尊重的办法。我们更倾向于编写能够证明是正确的代码。\n\
  \n![Image](img/00005.jpeg)\n\n定义什么是有效值的规则被称为 `不变式`。`Date` 的不变式（“一个 `Date` 象必须代表过去、现在或未来的某一天”）异常难以精确表述：要记住闰年、格里日历、时区等。然而，对于\
  \ `Date` 的简单实际用途，我们可以做到这一点。例如，如果我们正在分析网络日志，就不需要受格里日历、儒略历或玛雅历的困扰。如果我们想不出一个良好的不变式，那么我们可能在处理纯数据。如果是这样的话，请使用\
  \ `struct`。\n\n### 9.4.4 定义成员函数\n\n到为止，我们已经从接口设计者和用户的角度查看了 `Date`。但迟早，我们必须实现这些成员函数。首先，这里有一个\
  \ `Date` 类的子集，重新组织以适应先提供公共接口的常用风格：\n\n点击查看代码图像\n\n```cpp\n// simple Date (有些人倾向于将实现细节放在最后)\n\
  \nclass Date {\npublic:\n    Date(int y, int m, int d);  // 构造函数：检查有效日期并初始化\n  \
  \  void add_day(int n);         // 将日期增加 n 天\n    int month();\n    // . . .\nprivate:\n\
  \    int y, m, d;                 // 年，月，日\n};\n```\n\n人们将公共接口放在前面，是因为接口是大多数人感兴趣的内容。原则上讲，用户不需要查看实现细节。在现实中，我们通常很好奇，会快速看一眼实现看起来是否合理，以及实现者使用了哪些我们可以学习的技术。然而，除非我们是实现者，否则我们确实倾向于在公共接口上花费更多的时间。编译器并不关心类函数和数据成员的顺序；它会按照你愿意呈现的任何顺序来处理声明。\n\
  \n当我们在类外部定义成员时，我们需要说明它是哪个类的成员。我们使用 `class_name::member_name` 符号来实现这一点：\n\n点击查看代码图像\n\
  \n```cpp\nDate::Date(int yy, int mm, int dd)      // 构造函数\n    :y{yy}, m{mm}, d{dd}\
  \               // 注意：成员初始化器\n{\n}\n\nvoid Date::add_day(int n)\n{\n    // . . .\n\
  }\n\nint month()                             // 哎：我们忘记写 Date::\n{\n    return m;\
  \ // 不是成员函数，无法访问 m\n}\n```\n\n`y{yy}, m{mm}, d{dd}` 符号是我们是我们初始化成员的方式。它被称为（成员）初始化列表。我们本可以写成：\n\
  \n点击查看代码图像\n\n```cpp\nDate::Date(int yy, int mm, int dd)  // 构造函数\n{\n    y = yy;\n\
  \    m = mm;\n    d = dd;\n}\n```\n\n但那样的话，原则上我们会先对成员进行默认初始化，然后给它们赋值。我们还会留下一个不小心在成员初始化之前使用它的可能性。`y{yy},\
  \ m{mm}, d{dd}` 符号直接表达我们的意图。这种区别与以下完全相同：\n\n点击查看代码图像\n\n```cpp\nint x; // 稍后\nx\
  \ = 2; // 定义\n```\n\n我们也可以直接在类中定义成员函数：\n\n点击查看代码图像\n\n```cpp\n// simple Date (有些人倾向于将实现细节放在最后)\n\
  \nclass Date {\npublic:\n    Date(int y, int m, int d);  // 构造函数：检查有效日期并初始化\n  \
  \  void add_day(int n);         // 将日期增加 n 天\n    int month();\n    // . . .\nprivate:\n\
  \    int y, m, d;                 // 年，月，日\n};\n```\n\n我们注意到的第一点是类声明变得更大了。然而，对于短函数，例如\
  \ `month()`，我们可能考虑在类内编写定义。在类内编写成员函数有三个影响：\n\n- 编译器会尝试在每个调用点为函数生成代码，而不是使用函数调用。\n\
  - 每当我们修改函数体时，该类的所有用户都必须重新编译。如果函数在类外，只有当类声明改变时才需要重新编译。\n- 类定义变得更大。\n\n显而易见的经验法是：除非你知道你需要内联带来的性能提升，否则将成员体放在类声明中。大型函数（例如五行或更多行）不会从内联中获益，并会让类更难以阅读。\n\
  \n### 9.4.5 引用当前对象\n\n考虑到为止 `Date` 的简单用法：\n\n点击查看代码图像\n\n```cpp\nclass Date {\n\
  public:\n    // . . .\n    int month() { return m; }\n    // . . .\nprivate:\n \
  \   int y, m, d;                 // 年，月，日\n};\n\nvoid f(Date d1, Date d2)\n{\n \
  \   cout << d1.month() << ' ' << d2.month() << '\\n';\n}\n```\n\n`Date::month()`\
  \ 如何知道在第一次调用时返回 `d1.m` 的值，而在第二次调用时返回 `d2.m`？再次查看 `Date::month()`；它的声明没有指定函数参数！`month()`\
  \ 如何知道它是为哪个对象调用的？类成员函数（如 `Date::month()`）有一个隐式参数，它用它识别被调用的对象。所以在第一次调用中，`m` 正确地指向\
  \ `d1.m`，而在第二次调用中，它指向 `d2.m`。关于此隐式参数的更多用法，请见 §17.10。\n\n### 9.4.6 报告错误\n\n![Image](img/00005.jpeg)\n\
  \n\n\n\n当我们发现一个无效日期时，该怎么办？在代码的哪个位置查找无效日期？从 §5.6 中知道，第一个问题的答案是“抛出异常”，而显然应该查找的地方就是我们第一次构造\
  \ `Date` 的地方。如果我们不创建无效的 `Date`，并且正确地编写了成员函数，我们就永远不会拥有具有无效值的 `Date`。因此，我们将防止用户创建无效状态的\
  \ `Date`：\n\n点击此处查看代码图片\n\n```cpp\n// 简单的 Date（防止无效日期）\n\nclass Date {\npublic:\n\
  \    class Invalid { }; // 用作异常\n    Date(int y, int m, int d); // 检查有效性并初始化\n \
  \   // . . .\nprivate:\n    int y, m, d; // 年，月，日\n    bool is_valid(); // 如果日期有效则返回\
  \ true\n};\n```\n\n我们将有效性测试放在一个单独的 `is_valid()` 函数中，因为检查有效性在逻辑上与初始化是不同的，而且我们可能想要有多个构造函数。如你所示，我们可以有私有函数也可以有私有数据：\n\
  \n点击此处查看代码图片\n\n```cpp\nDate::Date(int yy, int mm, int dd)\n    : y{yy}, m{mm},\
  \ d{dd} // 初始化数据成员\n{\n    if (!is_valid()) throw Invalid{}; // 检查有效性\n}\n\nbool\
  \ Date::is_valid() // 如果日期有效则返回 true\n{\n    if (m<1 || 12<m) return false;\n  \
  \  // . . .\n}\n```\n\n给定 `Date` 的该定义，我们可以写出\n\n点击此处查看代码图片\n\n```cpp\nvoid f(int\
  \ x, int y)\ntry {\n    Date dxy {2004,x,y};\n    cout << dxy << '\\n'; // << 的声明请参\
  \ §9.8\n    dxy.add_day(2);\n}\ncatch(Date::Invalid) {\n    error(\"invalid date\"\
  ); // error() 定义在 §5.6.3\n}\n```\n\n我们现在知道 `<<` 和 `add_day()` 将对一个有效的 `Date` 对象进行操作。\n\
  \n在完成 §9.7 中对我们的 `Date` 类的演化之前，我们将绕路描述一些我们为了很好完成这项工作而需要的通用语言特性：枚举和运算符重载。\n\n###\
  \ 9.5 枚举\n\n![图像](img/00005.jpeg)\n\n`enum`（`enumeration`）是一种非常简单的用户定义类型，它将一组值（其\
  \ `enumerators`）指定为符号常常量。例如：\n\n点击此处查看代码图片\n\n```cpp\nenum class Month {\n    jan=1,\
  \ feb, mar, apr, may, jun, jul, sep, oct, dec\n};\n```\n\n枚举的“体”简单来说就是 `enumerators`\
  \ 列表。`enum class` 中的 `class` 意味着 `enumerators` 在枚举的作用域内。也就是说，要引用 `jan`，我们必须说 `Month::jan`。\n\
  \n你可以为枚举成员提供特定的表示（就像我们对 `jan` 做的那样），或者让编译器来选择值。如果你让编译器来选择，它将给每个枚举成员赋值上一个枚举成员的值加一。因此，我们的\
  \ `Month` 定义让月份从 1 开始。我们可以等价地写成：\n\n点击此处查看代码图片\n\n```cpp\nenum class Month {\n \
  \   jan=1, feb=2, mar=3, apr=4, may=5, jun=6,\n    jul=7, aug=8, sep=9, oct=10,\
  \ nov=11, dec=12\n};\n```\n\n然而，那样很乏味，且留下了错误的机会。事实上，我们在写出这个版本之前犯了两个输入错误；最好让编译器去做这些简单、重复的“机械”工作。编译器处理这类任务比我们更擅长，而且不会感到无聊。如果我们不初始化第一个枚举成员，计数将从\
  \ 0 开始。例如：\n\n点击此处查看代码图片\n\n```cpp\nenum class Day {\n    monday, tuesday, wednesday,\
  \ thursday, friday, saturday\n};\n```\n\n在这里 `monday` 被表示为 0，`sunday` 被表示为 6。在实践中，从\
  \ 0 开始通常是一个很好的选择。我们可以这样使用 `Month`：\n\n点击此处查看代码图片\n\n```cpp\nMonth m = Month::feb;\n\
  Month m2 = feb; // 错误：feb 不在作用域\nm = 7; // 错误：不能将 int 赋值给 Month\nint n = m; // 错误：不能将\
  \ Month 赋值给 int\nMonth m = Month::feb;\n```\n（注：此处原文中 `Month m = Month::feb;` 似乎有重复或示例延续，且示例代码中存在逻辑错误，已按原意翻译）\n\
  \n`Month` 这种 `int` 和 `Month` 这种 `` 之间的关系如下（此处原文逻辑似乎略有混乱，以下为字面翻译）：\n\n我们可以这样使用 Month：\n\
  \n点击此处查看代码图片\n\n```cpp\nMonth m = Month::feb;\nMonth m2 = feb; // 错误：feb 不在作用域\n\
  m = 7; // 错误：不能将 int 赋值给 Month\nint n = m; // 错误：不能将 Month 赋值给 int\nMonth m = Month::feb;\n\
  ```\n（修正：原文此处示例部分存在逻辑混乱，翻译保留原样）\n\n`Month` 这种 `int` 和 `Month` 这种 `` 之间的关系如下：\n`Month`\
  \ 这种 `int` 和 `Month` 这种 `` 之间的关系如下：\n`Month` 这种 `int` 和 `Month` 这种 `` 之间的关系如下：\n\
