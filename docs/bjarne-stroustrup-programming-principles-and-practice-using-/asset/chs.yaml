  \n\n\n\n因此，“它足够高效吗？”这个问题的答案是：“衡量有趣测试用例所需的时间。”要做到这一点，你显然必须充分了解你的最终用户，以便知道他们认为什么“有趣”，以及这些有趣的用途可以接受多长时间。逻辑上，我们只需用秒表为测试计时，并确保没有哪个测试消耗不合理的时间。当我们使用诸如`system_clock`（§26.6.1）这样的工具自动为我们计时时，这变得十分实用；并且我们可以将测试花费的时间与合理的预估进行自动比较。或者（此外），我们可以记录每次耗费的时长并与之前的运行结果对比——这样我们就获得了一种性能回归检测形式。\n\
