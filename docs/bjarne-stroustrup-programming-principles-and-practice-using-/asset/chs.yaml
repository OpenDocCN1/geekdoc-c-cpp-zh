  \ ，使用这种技术的容器通常称为 *哈希表 (hash table)* 。可能的键的数量远大于哈希表中的槽位数量。例如,我们经常用哈希函数将数十亿种可能的字符串映射到一个包含\
  \ 1000 个元素的向量的索引上。这可能有难度,但可以处理得很好,尤其适合实现大型 map. Hash 表的主要优点在于其平均查找开销(接近)恒定且与表中元素的数量无关即\
  \ O(1).显然这对于大型 map 来说是显著优势比如包含 500000 个网址的地图如需了解更多关于 Hash lookup 的信息可查看相关文档 unordered_map\
