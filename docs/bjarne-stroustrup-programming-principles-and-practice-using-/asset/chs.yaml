  \ 是某个值，具体取决于上下文。在这种表示法中，只有注释能区分无结果和布尔结果，所以如果你努力得足够努力，可能会把它们搞混。对于返回 `bool` 的操作，解释通常以问号结尾。\n\
  \n当算法遵循返回输入序列末尾以表示“失败”、“未找到”等通常模式时（参见 §B.3.1），我们不会显式提到。\n\n### B.2 错误处理\n\n标准库由跨越\
  \ 40 多年的开发的组件组成。因此，它们的风格和错误处理方法并不一致。\n\n- C 风格库由函数组成，其中许多函数设置 `errno` 来表示发生了错误；参见\
  \ §24.8。\n- 许多在元素序列上操作的算法返回指向最后一个元素之后位置的迭代器，以表示“未找到”或“失败”。\n- I/O 流库依赖每个流中的状态来反映错误，并可能（如果用户请求的话）抛出异常来指示错误；参见\
  \ §10.6, §B.7.2。\n- 某些标准库组件如 `vector`、`string` 和 `bitset` 通过抛出异常来指示错误。\n\n标准库的设计使得所有设施都遵守“基本保证”（参见\
  \ §19.5.3）；也就是说，即使抛出了异常，也不会泄漏资源（如内存），标准库类的不变性也不会被破坏。\n\n#### B.2.1 异常\n\n某些标准库设施通过抛出异常来报告错误：\n\
  \n![Image](img/00354.jpeg)\n\n在任何直接或间接使用这些设施的代码中都可能遇到这些异常。除非你*知道*没有设施以可能抛出异常的方式使用，否则在某处（例如在\
  \ `main()` 中）捕获标准库异常层次中的某个根类（如 `exception`）是一个好主意。\n\n我们强烈建议不要抛出内置类型，例如 `int` 和\
  \ C 风格字符串。相反，请抛出专门定义用于类型对象。\n\n点击此处查看代码图片\n\n```cpp\nclass exception {\npublic:\n\
  \    exception();\n    exception& operator=(const exception&);\n    virtual ~exception();\n\
  \    virtual char* what() const;\n};\n```\n\n点击此处查看代码图片\n\n```cpp\nstruct My_error\
  \ : runtime_error {\n    My_error(int x) : interesting_value(x) {}\n    int interesting_value;\n\
  \    const char* what() override { return \"My_error\"; }\n};\n```\n\n### B.3 迭代器\n\
  \n迭代器是把标准库算法与其数据连接的胶水。相反，你可以说迭代器是用于减少算法对数据结构依赖的机制。\n\n![Image](img/0035.jpeg)\n\n\
  #### B.3.1 迭代器模型\n\n迭代器类似于指针，因为它提供了访问（例如 `*`）和移动到新元素（例如 `++`）的能力。元素序列由一对迭代器定义：\n\
  \n![Image](img/0357.jpeg)\n\n也就是说，`begin` 指向序列第一个元素，`end` 指向最后一个元素之后。注意，空序列的 `begin\
  \ == end`；也就是说，任何迭代器的 `p:p)` 都是空序列。\n\n为了读取序列，算法通常接受一对迭代器 `b, e` 并一直迭代到结束：\n\n```cpp\n\
  while (b!=e) {\n    // 执行操作\n    ++b;\n}\n```\n\n在序列中搜索某些内容的算法通常返回序列末尾以表示“未找到”；例如：\n\
  \n[点击此处查看代码图片\n\n```cpp\np = find(v.begin(),v.end(),x);\nif (p!=v.end()) {\n   \
  \ // 在 p 找到了 x\n} else {\n    // 在 v.begin():v.end()) 中未找到 x\n}\n```\n\n参见 §[20.3。\n\
  \n写入序列的算法通常仅给定第一个元素的迭代器。在这种情况下，程序员有责任不越写序列末尾。例如：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<class\
  \ Iter> void f(Iter p, int n)\n{\n    while (n>0) *p++ = --n;\n}\n\nvector<int>\
  \ v(10);\nf(v.begin(),v.size()); // OK\nf(v.begin(),1000);    // 大麻烦\n```\n\n\n\n\
  \n一些标准库实现会进行范围检查——即抛出异常——针对`f()`的最后一次调用，但你不能依赖此特性编写可移植代码；许多实现并不进行检查。\n\n对迭代器的操作如下：\n\
  \n![Image](img/00358.jpeg)![Image](img/00359.jpeg)\n\n注意并非每种迭代器（§B.3.2）都支持每一项迭代器操作。\n\
  \n### B.3.2 迭化器类别\n\n标准库提供了五种类型的排序遍历装置：\n\n![Image](img/00360.jpeg)\n\n从逻辑上讲，这些“叠用”概念按层级组织搭配用途\
  \ 。如第 20 章章节所示：\n\n\n\n\n```cpp\nif (pp.first!=pp.second) {\n    cout << \"elements\
  \ with value '\" << k << \"':\\n\";\n} else {\n    cout << \"no element with value\
  \ '\" << k << \"'\\n\";\n}\nfor (auto p = pp.first; p!=pp.second; ++p)\n    cout\
  \ << p–>second << '\\n';\n```\n\n我们也可以价地使用：\n\n点击此处查看代码图像\n\n`auto pp = make_pair(m.lower_bound(k),m.upper_bound(k));`\n\
  \n然而，那样执行时间将是原来的两倍。`equal_range`、`lower_bound` 和 `upper_bound` 算法也为排序序列提供（§B.5.4）。`pair`\
  \ 的定义在 §B.6.3。\n\n## B.5 算法\n\n`<algorithm>` 中定义了大约 60 个标准算法。它们都可以在由一对迭代器（用于输入）或单个迭代器（用于输出）定义的序列上操作。\n\
  \n在复制、比较等两个序列时，第一个序列由一对迭代器 `b:e)` 表示，而第二个序列仅由单个迭代器 `b2` 表示，它被视为包含足够元素的序列的起始位置，例如，包含与第一个序列相同数量的元素：`[b2:b2+(e–b))`。\n\
  \n某些算法（如 `sort`）需要随机访问迭代器，而许多算法（如 `find`）仅按顺序读取元素，因此它们可以使用前向迭代器。\n\n许多算法遵循通常的惯例，即返回序列的末尾以表示“未找到”。我们没有对每个算法都提到这一点。\n\
  \n### B.5.1 非修改序列算法\n\n非修改性算法只读取序列的元素；它不重排序列，也不改变元素的值：\n\n![图像![图像](img/00377.jpeg)\n\
  \n注意，没有任何东西能阻止传递给 `for_each` 的操作修改元素；这被认为是可以接受的。将一个改变其检查元素的操作传递给其他算法（例如 `count`\
  \ 或 `==`）是不可接受的。\n\n一个示例（正确用法）：\n\n点击此处查看代码图像\n\n```cpp\nbool odd(int x) { return\
  \ x&1; }\n\nint n_even(const vector<int>& v)    // 统计 v 中偶值的个数\n{\n    return v.size()–count_if(v.begin(),v.end(),odd);\n\
  }\n```\n\n### B.5.2 修改序列算法\n\n修改算法（也称为*变异序列算法*）可以（并且经常）修改其参数序列的元素。\n\n![图像](img/00378.jpeg)![图像](img/00379.jpeg)![图像](img/00380.jpeg)\n\
  \n`shuffle` 算法洗牌其序列的方式就像我们洗一副牌一样；也就是说，在洗牌之后，元素是随机顺序的，其中“随机”由随机数生成器产生的分布定义。\n\n请注意，这些算法并不知道参数序列是否为容器，因此它们没有添加或删除元素的能力。因此，像\
  \ `remove` 这样的算法无法通过删除（移除）元素来缩短输入序列；相反，它将保留的元素（重新）移动到序列前端：\n\n点击此处查看代码图像\n\n```cpp\n\
  template<typename Iter>\nvoid print_digits(const string& s, Iter b, Iter e)\n{\n\
  \    cout << s;\n    while (b!=e) { cout << *b; ++b; }\n    cout << '\\n';\n}\n\n\
  void ff()\n{\n    vector<int> v {1,1,1, 2,2, 3, 4,4,4, 3,3,3, 5,5,5,5, 1,1,1};\n\
  \    print_digits(\"all: \",v.begin(), v.end());\n    auto  pp = unique(v.begin(),v.end());\n\
  \    print_digits(\"head: \",v.begin(),pp);\n    print_digits(\"tail: \",pp,v.end());\n\
  \    pp=remove(v.begin(),pp,4);\n    print_digits(\"head: \",v.begin(),pp);\n  \
  \  print_digits(\"tail: \",pp,v.end());\n}\n```\n\n输出结果为\nall: 1112234443335555111\n\
  head: 1234351\ntail: 443335555111\nhead: 123351\ntail: 1443335555111\n\n### B.5.3\
