  \ var\n    using namespace Y;\n    var = 9;\n    print();                // 打印 Y\
  \ 的 var\n    {\n        using Z::var;\n        using Z::print;\n        var = 11;\n\
  \        print();            // 打印 Z 的 var\n    }\n    print();                //\
