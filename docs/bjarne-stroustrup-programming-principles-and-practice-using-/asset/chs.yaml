  \n### 11.7 使用非标准分隔符\n\n本节提供了一个使用 `iostreams` 解决实际问题的半真实示例。当我们读取字符串时，默认是由空白字符分隔的。遗憾的是，`istream`\
  \ 并没有提供让我们让我们定义哪些字符构成空白字符，或者以其他方式直接更改 `>>` 读取字符串的方式。那么，如果我们需要另一个空白字符的定义，该怎么办？考虑第\
  \ §4.6.3 中的示例，在那里我们读取了“单词”并对它们进行了比较。那些单词是用空白分隔的，所以如果我们读取\n\n点击此处查看代码图片\n\n正如计划的那样，客人们到了；然后，\n\
  \n我们会得到“单词”\n\nAs\nplanned,\nthe\nguests\narrived;\nthen,\n\n这并不是我们在字典中会找到的内容：`planned,`\
  \ 和 `arrived;` 并不是单词。它们是单词加上了分散注意力且无关的标点符号字符。对于大多数目的，我们必须将标点符号视为与空白一样。我们如何去掉标点符号呢？我们可以读取字符，移除标点符号——或者将它们转换为空白——然后再次读取“清理后”的输入：\n\
  \n点击此处查看代码图片\n\n```cpp\nstring line;\ngetline(cin,line); // 读取到 line\nfor (char&\
  \ ch : line) // 将每个标点符号替换为空格\n    switch(ch) {\n    case ';': case '.': case ',':\
  \ case '?': case '!':\n        ch = ' ';\n    }stringstream ss(line); // 从 line\
  \ 创建一个 istream ss\nvector<string> vs;\nfor (string word; ss>>word; ) // 读取不带标点的单词\n\
  vs.push_back(word);\n```\n\n使用这种方法读取行后，我们得到了想要的\n\nAs\nthe\nguests\narrived\nthen\n\
  \n遗憾的是，上面的代码既混乱又用途特殊。如果我们有另一个标点符号的定义，该怎么办？让我们提供一种更通用、实用的方法从输入流中移除不需要的字符。那应该是什么？我们希望用户代码像什么样？点击此处查看代码图片\
  \ `ps.whitespace(\":.\");` // 将分号、逗号和点视为空白\n\nfor (string word; ps>>word; )\nvs.push_back(word);\n\
  \n我们如何定义一个像 `ps` 一样工作的流？基本思想是从普通流中读取单词，然后将用户指定的“空白”字符视为空白；也就是说，我们不把“空白”字符交给用户，我们只是使用它们来分隔单词。例如，`as.not`\
  \ 应该是两个单词。\n\n我们可以定义一个类来我们完成这些工作。它必须从 `istream` 获取字符，并有一个 `>>` 运算符，其工作方式与 `istream`\
  \ 类似，但我们可以告诉它哪些字符应该被视为空白。为了起见，我们不会提供一种将现有空白（空格、换行等）视为非空白的方法；我们将允许用户指定额外的“空白”字符。我们也不会提供完全从流中移除指定字符的方法；与之前一样，我们只需将其转换为空白。我们将该类命名为\
  \ `Punct_stream`：点击此处查看代码图片\n\n```cpp\nclass Punct_stream { //  istream，但用户可以添加\n\
  public:\n    Punct_stream(istream& is) : source{is}, sensitive{true} { }\n    void\
  \ whitespace(const string& s) // 使 s 为空白集\n    { white = s; }\n    void add_white(char\
  \ c) { white += c; } // 添加空白集\n    bool is_whitespace(char c); // c 是否在空白集中？\n \
  \   void case_sensitive(bool b) { sensitive = b; }\n    bool is_case_sensitive()\
  \ { return sensitive; }\n    Punct_stream& operator>>(string& s);\n    operator\
  \ bool();\nprivate:\n    istream& source; // 字符源\n    istringstream buffer; // 让\
  \ buffer 执行我们的格式化\n    string white; // 空白字符集\n};\n```\n\n基本思想与上面的示例相同——一次从 `istream`\
  \ 读取整行，将“空白”字符转换为空格，然后使用 `istringstream` 进行格式化。处理自定义空白之外，我们还为 `Punct_stream` 提供了一个相关功能：如果我们请求（使用\
  \ `case_sensitive()`），它可以将大小写敏感的输入转换为非大小写敏感。例如，如果我们请求，我们可以得到 `Punct_stream` 读取\n\
  \nMan bites dog!\n\nas\nman\nbites\ndog\n\n```\n\n```cpp\nPunct_stream ps {cin};\
  \ // ps 从 cin 读取\nps.whitespace(\":;.\"); // 分号、冒号和点也是空白\nps.case_sensitive(false);\
  \ // 非大小写敏感\n```\n\n显然，最有趣的操作是输入运算符 `>>`。它也是最难定义的部分。我们的通用策略是从 `istream` 读取整行到字符串（称为\
  \ `line`）。现在我们尝试填充缓冲区。代码看起来比这复杂一点，因为我们只是尝试从缓冲区中读取，并在它为空时尝试填充它：\n\n```cpp\nPunct_stream&\
  \ Punct_stream::operator>>(string& s)\n\n{\n```\n\n\n\n\n\n```cpp\nwhile (!(buffer>>s))\
  \ { // try to read from buffer\n    if (buffer.bad() || !source.good()) return *this;\n\
  \    buffer.clear();\n    string line;\n    getline(source,line); // get a line\
  \ from source\n    // do character replacement as needed:\n    for (char& ch : line)\n\
  \        if (is_whitespace(ch))\n            ch = ' '; // to space\n        else\
  \ if (!sensitive)\n            ch = tolower(ch); // to lower case\n    buffer.str(line);\
  \ // put string into stream\n}\nreturn *this;\n```\n\n让我们逐部分考虑这段代码。首先考虑这段不那么寻常的代码：\n\
  \n```cpp\nwhile (!(buffer>>s)) {\n```\n\n如果名为 `buffer` 的 `istringstream` 中存在字符，读取操作\
  \ `buffer>>s` 将正常工作，且 `s` 将接收一个由“空格”分隔的单词；那么就没有其他需要做的了。只要 `buffer` 中还有我们可以读取的字符，这种情况就会一直发生。然而，当\
  \ `buffer>>s` 失败时——也就是说，如果 `!(buffer>>s)` 为真——我们必须从 `source` 补充 `buffer`。注意 `buffer>>s`\
  \ 读取是在循环中进行的；在我们尝试补充 `buffer` 之后，我们需要再次尝试读取，因此得到了：\n\n```cpp\nwhile (!(buffer>>s))\
  \ { // try to read from buffer\n    if (buffer.bad() || !source.good()) return *this;\n\
  \    buffer.clear(); // replenish buffer\n}\n```\n\n如果 `buffer` 为 `bad()` 或者 `source`\
  \ 出现问题，我们就放弃；否则，我们 `clear` `buffer` 并重试。我们需要 `clear` `buffer` 是因为只有在读取失败时，我们才会进入这个“补充循环”，这通常是因为我们遇到了\
  \ `buffer` 的 `eof()`；即 `buffer` 中没有更多供读取的字符了。处理流状态总是复杂的，而且它往往是需要冗琐调试的微妙错误的根源。幸运的是，补充循环的其余部分非常直观：\n\
  \n```cpp\nstring line;\ngetline(source,line); // get a line from source\n// do character\
  \ replacement as needed:\nfor (char& ch : line)\n    if (is_whitespace(ch))\n  \
  \      ch = ' '; // to space\n    else if (!sensitive)\n        ch = tolower(ch);\
  \ // to lower case\nbuffer.str(line); // put string into stream\n```\n\n我们将一行 `line`\
  \ 读取到 `line` 中。然后我们检查该 `line` 的每个字符，看是否需要更改它。`is_whitespace()` 函数是 `Punct_stream`\
  \ 的成员，我们稍后会定义它。`tolower()` 函数是一个标准库函数，执行显而易见的操作，例如将 `A` 转换为 a。\n\n一旦我们得到了处理良好的 `line`，就需要将其放入我们的\
  \ `istringstream` 中。这就是 `buffer.str(line)` 的作用；它可以被理解为“将 `istringstream` 区的字符串设置为\
  \ `line`”。\n\n注意，我们“忘记”了在使用 `getline()` 从 `source` 读取后测试 `source` 的状态。我们不需要这样做，因为我们最终会遇到循环顶部的\
  \ `!source.good()` 测试。\n\n一如既往，我们返回流本身的引用 `*this` 作为 `>>` 操作的结果。\n\n测试空格很容易；我们只需将一个字符与存储空格的字符串的每个字符进行比较：\n\
  \n```cpp\nbool Punct_stream::is_whitespace(char c)\n{\n    for (char w : white)\n\
  \        if (c==w) return true;\n    return false;\n}\n```\n\n记住，我们留下了 `istringstream`\
  \ 以通常的方式处理常见的空格字符（例如换行和空格），所以我们不需要对这些字符做特殊处理。\n\n这留下了一个神秘的函数：\n\n```cpp\nPunct_stream::operator\
  \ bool()\n{\n    return !(source.fail() || source.bad()) && source.good();\n}\n\
  ```\n\n`istream` 的惯用法是测试 `>>` 的结果。例如：\n\n```cpp\nwhile (ps>>s) { /* . . . */ }\n\
  ```\n\n这意味着我们需要方法将 `ps>>s` 的结果视为布尔值。`ps>>s` 的结果是一个 `Punct_stream`，因此我们需要一种隐式地将 `Punct_stream`\
  \ 转换为 `bool`。这就是 `Punct_stream` 的 `operator bool()` 所做的。名为 `operator bool()` 的成员函数定义了到\
  \ bool 的转换。特别来说，如果对 `Punct_stream` 的操作成功，它返回 true。\n\n现在我们可以编写我们的程序了：\n\n```cpp\n\
  int main()\n{\n    vector<string> vs;\n    Punct_stream ps(cin); // enter words\n\
  \    string s;\n    while (ps>>s) { // read words\n        vs.push_back(s); // produce\
  \ dictionary\n    }\n    sort(vs.begin(),vs.end()); // sort in lexicographical order\n\
  \    cout << \"please enter words\\n\";\n    for (int i=0; i<vs.size(); ++i) //\
  \ output text\n        cout << vs[i] << '\\n';\n}\n```\n\n\n\n\n\n![Image](img/00005.jpeg)\n\
  \nI/O 的细节似乎是无尽的。它们可能确实如此，因为它们仅限于人类的创造力和反复无常的想法。例如，我们还没有考虑到自然语言所隐含的复杂性。在英语中写为 12.35\
  \ 的数字在大多数其他欧洲语言中习惯表示为 12,35。当然，C++ 标准库提供了处理此类以及许多其他特定自然语言 I/O 特性的设施。你如何编写汉字？你如何比较使用马拉雅姆语编写的字符串？答案是有的，但远超本书的范围。如果你需要了解，请查阅更专业或高级的书籍（如\
  \ Langer 的 *Standard C++ IOStreams and Locales* 以及 Stroustrup 的 *The C++ Programming\
  \ Language*）以及库和系统文档。寻找“locale”这是通常用于处理自然语言差异设施的术语。\n\n另一个复杂性来源是缓冲：标准库 `iostreams`\
  \ 依赖于名为 `streambuf` 的概念。对于 `iostreams` 的高级工作——无论是为了性能还是功能——这些 `streambufs` 都是不可避免的。如果你觉得需要定义自己的\
  \ `iostreams` 或调整 `iostreams` 以适应新的数据源/数据点，请参见 Stroustrup 的 *The C++ Programming\
  \ Language* 第 38 章或你的系统文档。\n\n在使用 C++ 时，你可能还会遇到 C 标准语言的 `printf()`/scanf()` 系列 I/O\
  \ 函数。如果你遇到了，请查阅 §27.6、§B.10.2 或 Kernighan 和 Ritchie 优秀的 C 语言教科书（*The C Programming\
  \ Language*）或网络上的无数资源。每种语言都有自己的 I/O 设施；它们都各不相同，大多数都很古怪，但大多数都（以各种奇怪的方式）反映了我们在第 10\
  \ 章和第 11 章中介绍的相同基本概念。\n\n标准库 I/O 设施在附录 B 中。\n\n图形用户界面 (GUIs) 的相关主题在第 12 章–第 16 章中描述。\n\
