  \ (`elem+sz`)）与 (`elem+space)`。\n\n当一个向量第一次构造时, `size==space`,也就是说没有任何闲置空间:\n\n\
  ![图片](img/00195.jpeg)\n\n直到我们需要增减其中的数据个数前都不会预先申请额外的插槽区域 ——默认情况下始终满足`sze == spac)e\
