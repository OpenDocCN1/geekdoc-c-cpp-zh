  \n计算的大部分涉及将大量数据从一个地方移动到另一个地方，例如，将文本从文件复制到屏幕，或将音乐从计算机移动到 MP3 播放器。通常，在途中需要对数据进行某些转换。`iostream`\
  \ 库是处理此类许多任务的方法，其中数据可以被看作值的序列（流）。输入和输出可能是常见编程任务中意料之外的大部分内容。这部分是因为我们（或我们的程序）需要大量数据，部分是因为数据进入系统的地方是容易发生大量错误的地方。因此，我们必须尝试保持\
  \ I/O 简单，并尽量减少坏数据“滑入”我们系统的机会。\n\n## 11. 自定义输入和输出\n\n“保持简单：\n尽可能简单，\n但不要更简单。”\n\n\
  —— 阿尔伯特·爱因斯坦\n\n在本章中，我们集中于如何将第 10 章中提出的通用 `iostream` 框架适应特定的需求和喜好。这涉及到许多由人类对阅读内容的感知所决定的杂乱细节，以及对文件使用的实际限制。最后的示例展示了一个输入流的设计，可以在其中指定分隔符集。\n\
  \n* *\n\n- 11.1 规则性与不规则性\n- 11.2 输出格式\n- 11.2.1 整数输出\n- 11.2.2 整数输入\n- 11.2.3 浮点数输出\n\
  - 11.2.4 精度\n- 11.2.5 字段\n- 11.3 文件打开与定位\n- 11.3.1 文件模式\n- 11.3.2 二进制文件\n- 11.3.3\
  \ 文件中的定位\n- 11.4 字符串流\n- 11.5 行导的输入\n- 11.6 字符分类\n- 11.7 使用非标准分隔符\n- 11.8 还有更多内容\n\
  \n***\n\n### 11.1 规则性与不规则性\n\n`iostream` 库 —— ISO C++ 库的输入输出部分 —— 提供了一个统一且扩展的输入输出框架。我们所谓的“文本”是指任何可以表示为字符序列的内容。因此，当我们谈论输入输出时，可以将整数\
  \ 1234 视为文本。\n\n到目前为止，我们认为输入源都是等等的。有时，这并不足够。例如，文件与其他输入源（如通信连接）的区别在于我们可以访问单个字节。同样，我们假设对象的类型完全决定了它的输入和输出。这并不准确，也不够。例如，我们通常希望指定输出时表示浮点数时使用的位数。本章展示了我们如何根据需求定制输入输出的多种方法。\n\
  \n![Image](img/00006.jpeg)\n\n作为程序员，我们偏好规则性；统一处理所有内存对象，等对待所有输入源，并对进入和离开对象的表示实施单一标准可以产生最整洁、最简单、最易维护的代码。然而，我们的程序是为了人类服务的，而人类有强烈的喜好。因此，作为程序员，我们必须努力在程序复杂性和适应用户喜好之间取得平衡。\n\
  \n### 11.2 输出格式\n\n![Image](img/00007.jpeg)\n\n人们非常在意他们必须阅读的输出中看似微道的细节。例如，对于物理学家来说，1.25（保留小数点后两位）与\
  \ 1.24670477 有很大；对于会计师来说(1.25) 在法律上可能与 (1.2467) 不同，与 1.25 完全不同（在财务文件中，有时用括号表示亏损，即负值）。作为程序员，我们的目标是让输出尽可能接近程序“消费者”的预期。输出流（ostreams）为内置类型的格式化提供了多种方法。对于自定义类型，则由程序员定义合适的\
  \ << 运算符。\n\n\n\n\n\n输出似乎有无限的细节、改进和选项，而输入也有相当多。例如，用于小数点的字符（通常是点或逗号）、货币数值的输出方式、在输出时用单词\
  \ `true`（或 `vrai` 或 `sandt`）而不是数字 `1` 来表示真、处理非 ASCII 字符集（如 Unicode）的方法，以及限制读入字符串的字符数的方法。这些功能在需要之前通常是无趣的，因此我们将它们的描述留给手册和专业著作，例如\
  \ Langer 的 *Standard C++ IOStreams and Locales*；Stroustrup 著的 *The C++ Programming\
  \ Language* 第 38 和第 39 章；以及 ISO C++ 标准的 §22 和 §27 节。在这里，我们将介绍最常用的用的特性和一些通用概念。\n\n\
  ### 11.2.1 整数输出\n\n整数值可以以八进制（八进制系统）、十进制（我们通常的十进制系统）和十六进制（十六进制系统）输出。如果你不了解这些系统，请在继续此处之前阅读\
  \ §A.2.1.1。大多数输出使用十进制。十六进制用于输出硬件相关信息，原因是一个十六进制位正好表示一个 4 位的值。因此，两个十六进制位可以表示一个 8 位字节的值，四个十六进制位可以表示\
  \ 2 字节的值（那通常是一个半字），八个十六进制位可以表示 4 字节的值（那通常是一个字或一个寄存器的大小）。当 C++ 的祖先 C 首次设计时（20  世纪\
  \ 70 年代），八进制在表示位模式时很流行，但现在很少使用了。\n\n我们可以将输出的（十进制）值 `1234` 指定为十进制、十六进制（通常称为“hex”）和八进制：\n\
  \n点击此处查看代码图像\n\n```cpp\ncout << 1234 << \"\\t(decimal)\\n\"\n     << hex << 1234\
  \ << \"\\t(hexadecimal)\\n\"\n     << oct << 1234 << \"\\t(octal)\\n\";\n```\n\n\
  `'\\t'` 字符是“制表符”（tabulation character 的缩写）。它打印出：\n\n1234 (decimal)\n4d2 (hexadecimal)\n\
  2322 (octal)\n\n符号 `<< hex` 和 `<< oct` 并不输出值。相反，`<< hex` 告诉流任何后续的整数值都应该以十六进制显示，而\
  \ `<< oct` 告诉流任何后续的整数值应该以八进制显示。例如：\n\n点击此处查看代码图像\n\n```cpp\ncout << 1234 << '\\\
  t' << hex << 1234 << '\\t' << oct << 1234 << '\\n';\ncout << 1234 << '\\n';  //\
  \ 八进制基仍然有效\n```\n\n这产生了：\n\n点击此处查看代码图像\n\n```\n1234  4d2   2322\n2322  // 整数将继续显示为八进制，直到更改\n\
  ```\n\n注意最后一次输出是八进制；也就是说，`oct`、`hex` 和 `dec`（用于十进制）是持续的（“粘性”）——在我们没有告诉流改变之前，它们应用于输出的每一个整数值。用于更改流行为的如\
  \ `hex` 和 `oct` 等术语称为操纵符（manipulators）。\n\n***\n\n![Image](img/00024.jpeg) **尝试一下**\
  \ 以十进制、十六进制和八进制形式输出你的出生年份。为每个值标记。使用制表符将你的输出对齐列。现在输出你的年龄。\n\n***\n\n看到不同于 10 基数的值通常会令人困惑。例如，除非另另通知，否则你会假设\
  \ 11 代表十进制数字 11，而不是 9（八进制的 11）或 17（十六进制的 11）。为了缓解此类问题，我们可以要求 `ostream` 显示打印的每个整数的基数。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\ncout << 1234 << '\\t' << hex << 1234 << '\\t' << oct <<\
  \ 1234 << '\\n';\ncout << showbase << dec;           // 显示基数\ncout << 1234 << '\\\
  t' << hex << 1234 << '\\t' << oct << 1234 << '\\n';\n```\n\n这打印出：\n\n1234  4d2 \
  \    2322\n1234  0x4d2  02322\n\n所以，十进制数没有前缀，八进制数以前缀 `0`，十六进制值以前缀 `0x`（或 `0X`）。这正是\
  \ C++ 中整数字面量的表示法。例如：\n\n点击此处查看代码图像\n\n```cpp\ncout << 1234 << '\\t' << 0x4d2 <<\
  \ '\\t' << 02322 << '\\n';\n```\n\n在十进制形式下，这将打印 1234 4d2。正如你可能注意到的，`showbase` 是持续的，就像\
  \ `oct` 和 `hex` 一样。操纵符 `nosbase` 反转了 `showbase` 的动作，恢复到默认，显示不带基数的每个数字。总之，整数输出操纵符是：\n\
  \n![Image](img/00071.jpeg)\n\n### 11.2.2 整数输入\n\n默认情况下，`>>` 假设数字使用十进制表示，但你可以告诉它读取十六进制或八进制：\n\
  \n点击此处查看代码图像\n\n```cpp\nint a;\nint b;\nint c;\nint d;\ncin >> a >> b >> c >> d;\n\
  ```\n\n如果你输入 1234 4d2 2322，你得到 1234 4d2 2322。\n\n注意，这意味着 `oct`、`dec` 和 `hex` 对于输入来说也是“粘性的”。\n\
  \n***\n\n![Image](img/00024.jpeg) **尝试一下** 完成代码片段使其成为程序。尝试其他输入看看结果。\n\n***\n\n你可以得到\
  \ `>>` 接受 `0` 和 `0x` 前缀。为了这样做，“取消”所有默认。例如：\n\n点击此处查看代码图像\n\n```cpp\ncin.unset(ios::dec);\
  \ // 不假设十进制\ncin.unset(ios::oct); // 不假设八进制\ncin.unset(ios::hex); // 不假设十六进制\n```\n\
  \n`unset()` 成员函数清除作为参数的标志。现在，如果你写 `cin >> a >> b >> c >> d;` 并输入 1234 4d2 2322，你得到\
  \ 1234 4d2 2322。\n\n### 11.2.3 浮点数输出\n\n如果你直接处理硬件，你需要十六进制（可能是八进制）表示。同样，如果你处理科学计算，你必须处理浮点数的格式。它们使用\
  \ `ostream` 操纵符的处理方式与处理整数的方式非常相似。例如：\n\n点击此处查看代码图像\n\n```cpp\ncout << 1234.56789\
  \ << \"\\t(default)\" // \\t 对齐列\n     << fixed << 1234.56789 << \"\\t(fixed)\"\n\
  \     << scientific << 1234.56789 << \"\\t(scientific)\";\n```\n\n这打印：\n\n1234.57\
  \ (general)\n1234.567890 (fixed)\n1.234568e+003 (scientific)\n\n操纵符 `fixed`、`scientific`\
  \ 和 `defaultfloat` 用于选择浮点格式；`defaultfloat` 是默认格式（也称为*通用格式*）。现在，我们可以写：\n\n点击此处查看代码图像\n\
  \n```cpp\ncout << 1234.56789 << '\\t'\n     << fixed << 1234.56789 << '\\t'\n  \
  \   << scientific << 1234.56789 << '\\n';\ncout << 1234.56789 << '\\n';        \
  \     // 浮点格式是“粘性的”\ncout << defaultfloat << 1234.56789 << '\\t'; // 默认格式对于\n```\n\
  \n\n\n\n默认情况下，浮点值使用 `defaultfloat` 格式以总共六位数字进行打印。系统会选择最合适的格式，并对数字进行舍入，以提供仅用六位数字即可打印的最近似值（`defaultfloat`\
  \ 格式的默认精度）。例如：\n\n1234.567 输出为 1234.57\n\n1.2345678 输出为 1.23457\n\n舍入规则是通常的 4/5\
  \ 舍规则：0 到 4 向下舍入（向零靠近），5 到 9 向上舍入（远离零）。注意，浮点格式化仅适用于浮点数，所以：\n\n1234567 输出为 1234567（因为它是一个整数）\n\
  \n1234567.0 输出为 1.23457e+006\n\n在后的情况下，`ostream` 认为 `1234567.0` 无法仅用六位数字使用 `fixed`\
  \ 格式打印，因此切换到科学计数法以保留最准确的表示。基本上，`defaultfloat` 格式在科学计数和固定格式之间进行选择，以便在通用格式精度（默认为总六位数字）内向用户呈现浮点值最准确的表示。\n\
  \n***\n\n![Image](img/00024.jpeg) 尝试一下\n\n编写一些代码，打印数字 `1234567.89` 三次，首先使用 `defaultfloat`，然后使用\
  \ `fixed`，最后使用 `scientific`。哪种输出形式为用户提供了最准确的表示？解释原因。\n\n***\n\n程序员可以使用操纵符 `setprecision()`\
  \ 设置精度。例如：\n\n点击此处查看代码图片\n\n```cpp\ncout << 1234.56789 << '\\t'\n     << fixed <<\
  \ 1234.56789 << '\\t'\n     << scientific << 1234.56789 << '\\n';\n\ncout << defaultfloat\
  \ << setprecision(5)\n      << 1234.56789 << '\\t'\n      << fixed << 1234.56789\
  \ << '\\t'\n      << scientific << 1234.56789 << '\\n';\n\ncout << defaultfloat\
  \ << setprecision(8)\n      << 1234.56789 << '\\t'\n      << fixed << 1234.56789\
  \ << '\\t'\n      << scientific << 1234.56789 << '\\n';\n```\n\n这会打印结果（注意舍入）：\n\n\
  点击此处查看代码图片\n\n1234.57         1234.567890         1.234568e+003\n1234.6 1234.56789\
  \      1.23457e+003\n1234.5679   1234.56789000   1.23456789e+003\n\n精度的定义为：\n\n\
  ![Image](img/00073.jpeg)\n\n除非有特殊，否则使用默认设置（精度为 6 的 `defaultfloat` 格式）。通常不使用的理由是“因为我们需要更高的输出精度”。\n\
  \n### 11.2.5 字段 (Fields)\n\n使用科学计数和固定格式，程序员可以精确控制值在输出中占用的空间大小。这对于打印表格等显然非常有用。整数值的等效机制被称为\
  \ `fields`。你可以使用“设置字段宽”操纵符 `setw()` 精确指定整数值或字符串值将占据多少个字符位置。例如：\n\n点击此处查看代码图片\n\n\
  ```cpp\ncout << 123456                                            // 不使用字段\n   \
  \  << '|' << setw(4) << 123456 << '|'           // 123456 无法放入 4 字符的字段\n     <<\
  \ setw(8) << 123456 << '|'                 // 设置字段宽为 8\n     << 123456 << \"|\"\
  ;                           // 字段大小不会持续\n```\n\n这会打印：\n\n123456|123456| 123456|123456|\n\
  \n![Image](img/00006.jpeg)\n\n注意第三次出现 `123456` 之前的两个空格。这是我们对八字符字段中六位数字的预期。然而，`123456`\
  \ 并没有被截断以适应四字符字段。为什么呢？`|1234|` 或 `|3456|` 可能会被认为是四字符字段的输出。然而，这将完全改变打印的值，而不会向读者警告任何事情发生了变化。`ostream`\
  \ 不会这样做；它会破坏输出格式。糟糕的格式总比“糟糕的输出”要好。在字段最常见的用法（如打印表格）中，“溢出”在视觉上是可见的，因此可以修正。\n\n字段也可以用于浮点数和字符串。例如：\n\
  \n点击此处查看代码图片\n\n```cpp\ncout << 123456                                         \
  \   // 不使用字段\n     << '|' << setw(4) << 123456 << '|'           // 123456 无法放入 4\
  \ 字符的字段\n     << setw(8) << 123456 << '|'                 // 设置字段宽为 8\n     << 123456\
