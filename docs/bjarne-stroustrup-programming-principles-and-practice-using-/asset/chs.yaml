  \n### 27.3.4 C 风格强制类型转换\n\n在 C（以及 C++）中，你可以通过这种极简符号将值 `v` 显式转换为类型 `T`：\n\n```\n\
  (T)v\n```\n\n![Image](img/00007.jpeg)\n\n这种“C 风格强制类型转换”或“旧式强制转换”深受打字不快和思考粗率的人的青睐，因为它非常简单，你不需要了解需要什么才能从\
  \ `v` 得到一个 `T`。另一方面，这种风格的强制转换深受维护程序员的恐惧，因为它们几乎是不可见的，没有留下任何关于编写者意图的线索。C++ 强制转换（*命名强制转换*或*模板风格强制转换*；参见\
  \ §[A.5.7]) 的引入是为了让显式类型转换易于识别（虽然很丑）且是特定的。在 C 中，你没有选择：\n\n点击此处查看代码图像\n\n```c\nint*\
  \ p = (int*)7;               /* 重新解释位模式：reinterpret_cast<int*>(7) */\nint x = (int)7.5;\
  \               /* 截断双精度：static_cast<int>(7.5) */\n\ntypedef struct S1 { /* . .\
  \ . */ } S1;\n\ntypedef struct S2 { /* . . . */ } S2;\n\nS2 a;\nconst S2 b;    \
  \                /* C 中允许未初始化的常量 */\nS1* p = (S1*)&a;               /* 重新解释位模式：reinterpret_cast<S1*>(&a)\
  \ */\nS2* q = (S2*)&b;               /* 去掉 const：const_cast<S2*>(&b) */\nS1* r =\
  \ (S1*)&b;               /* 移除 const 并更改类型；可能是一个 bug */\n```\n\n即使在 C 中，我们也不建议使用宏（§[27.8]），但这样表达意图可能是一个主意：\n\
  \n点击此处查看代码图像\n\n```c\n#define REINTERPRET_CAST(T,v) ((T)(v))\n\n#define CONST_CAST(T,v)\
  \ ((T)(v))\n\nS1* p = REINTERPRET_CAST (S1*,&a);\nS2* q = CONST_CAST(S2*,&b);\n\
  ```\n\n这并没有提供 `reinterpret_cast` 和 `const_cast` 所实现的类型检查，但它确实让这些本质上丑陋的操作变得可见，并使程序员的意图显式化。\n\
  \n### 27.3.5 void* 的转换\n\n在 C 中，`void*` 可以用作任何指针类型变量赋值或初始化的右侧操作数；在 C++ 中则可能不可以。例如：\n\
  \n点击此处查看代码图像\n\n```c\nvoid* alloc(size_t x);                           /* 分配 x 字节\
  \ */\nvoid f (int n)\n{\n    int* p = alloc(n*sizeof(int));      /* C 中合法；C++ 中错误\
  \ */\n    /* . . . */\n}\n```\n\n在这里，`alloc()` 返回的 `void*` 被隐式转换为 `int*`。在 C++ 中，我们必须重写那行代码：\n\
  \n点击此处查看代码图像\n\n```c\nint* p = (int*)alloc(n*sizeof(int));   /* C 和 C++均合法 */\n\
  ```\n\n我们使用 C 风格强制转换（§[27.3.4]）是为了它在 C 和 C++ 中都是合法的。\n\n![Image](img/00007.jpeg)\n\
  \n为什么 C++ 中 `void*`-to-`T*` 的隐式转换是非？因为这种转换可能是不安全的：\n\n点击此处查看代码图像\n\n```c\nvoid f()\n\
  {\n    char i = 0;\n    char j = 0;\n    char* p = &i;\n    void* q = p;\n    int*\
  \ pp = q;                     /* 不安全；C 中合法，C++ 中错误 */\n    *pp = -1;           \
  \             /* 覆盖从 &i 开始的内存 */\n}\n```\n\n我们甚至不能确定什么被覆盖了。也许是 `j` 和 `p` 的部分？也许是调用\
  \ `f()` 时使用的某些内存（f 的栈帧）？无论覆盖了什么，调用 `f()` 都是坏事。请注意（相反的）`T*` 到 `void*` 的转换是完全安全的——这些在\
  \ C 和 C++ 中都是允许的。不幸的是，隐式的 `void*`-to-`T*` 转换在 C 中很常见，可能是主要的 C/C++ 兼容性问题（参见 [27.4]）。\n\
