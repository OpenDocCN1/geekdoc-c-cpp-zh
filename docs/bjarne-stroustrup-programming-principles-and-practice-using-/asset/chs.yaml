  \n\n\n\n\n保持简洁性和一致性的一个方法是仔细（且始终如一地）记录每个接口。这样，不一致和重复的地方就更容易被发现。记录前置条件、后置条件和不变式尤其有用，对资源管理和错误报告的细致关注也同样重要。一致的错误处理和资源管理策略对于实现简单性至关重要（§19.5）。\n\
  \n![Image](img/00006.jpeg)\n\n对一些程序员来说，关键的设计原则是 KISS（“Keep It Simple, Stupid”）。我们甚至听说有人声称\
  \ KISS 是唯一值得采用的设计原则。然而，我们更喜欢不那么引人注目的表述方式，例如“让简单的事情保持简单”，或者爱因斯坦曾说的，“尽量做到简洁：尽可能简单——但不要过分简化。”最后这种说法反映了这样一种危险：过度化简可能适得其反并损害设计质量。“为谁而简？与什么相比？”这是我们必须回答的关键问题。\n\
  \n### 22.1.3 风格 / **范式**\n\n![Image](img/00005.jpeg)\n\n当设计和编写程序时我们要追求风格的一致性 。C++支持的四种主要模式可以视为基础：\n\
  *   过程化编程\n*   **数据抽象**\n*   *面向对象编程*\n*   泛型编程\n\n这些有时被略带夸张地称为 “ programming paradigms\
  \ ” （程序设计范型 ）。此外还有许多其他常见的 software design approach ，如函数式或逻辑式的规划 、规则驱动以及基于约束的方法等高级软件系统构造技术\
  \ ;由于本书初衷不在覆盖它们也不常见于初学者教材中所以我们决定略去针对此类风格的详细讨论：\n\n- ***过程化编程*** ：把程序组织成一系列操作参数的函数的理念总称；典型例子包括\
  \ sqrt()`及 cos()`.在支持该模式的 C++)语言机制便是 functions(第 8 章)。选择传值、引用或常量引用的能力非常宝贵;通常将信息组装为结构化结构体呈现出来并未运用显式的\
  \ abstraction mechanisms (比如类封装私有成员)，但在所有其它开发方法中都强调使用 routine & function 的过程。\n\
  \  \n - ***数据抽象*** :这种做法主张先定义一组适用于某个应用领域的 type(s)),再通过这些类型来构建流程核心业务应用程序 。Matrix\
