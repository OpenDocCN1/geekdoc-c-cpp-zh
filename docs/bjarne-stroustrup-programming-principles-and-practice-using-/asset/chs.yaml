  \ 语句成为测试者的良好目标。有两个需要关注的大问题：\n\n![Image](img/00006.jpeg)\n\n- 是否所有的可能性都被覆盖了？\n- 正确的操作是否与正确的可能性？\n\
  \n考虑这个毫无意义的函数：\n\n点击此处查看代码图像\n\n```cpp\nvoid do_branch1(int x, int y)          \
