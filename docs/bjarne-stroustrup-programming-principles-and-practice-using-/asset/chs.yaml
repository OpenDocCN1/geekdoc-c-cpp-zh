  \n\n\n\n跟在 `%` 之后的字符控制着参数的处理方式。第一个 `%` 应用于第一个“额外参数”（这里，`%d` 应用于 `x`），第二个 `%` 应用于第二个“额外参数”（这里，`%s`\
  \ 应用于 `p`），依此类推。特别是，该 `printf()` 调用的输出为：\n\n点击此处查看代码图片\n\n`x` 的值为 `'5'`，`p` 的值为\
  \ `'asdf'`，\n\n紧接着是一个换行符。\n\n通常情况下，`%` 转换指示与与其应用的类型之间的对应关系是无法检查的，即使可以检查，通常也不会进行检查。例如：\n\
  \n点击此处查看代码图片\n\n```c\nprintf(\"the value of x is '%s' and the value of p is '%d'\\\
  n\",x,p);  // 哎错了\n```\n\n转换规范集非常庞大，并提供了极大的灵活性（同时也存在混淆的可能性）。在 `%` 之后，可能会有：\n\n*\
  \   一个可选的减号，用于指定转换值在字段中的左对齐。\n*   一个可选的加号，用于指定符号类型的值将始终以 `+` 或 `—` 符号开头。\n*   `0`\
  \ 一个可选的零，用于指定使用前导零填充数值。如果指定了 `—` 或精度，则此 `0` 将被忽略。\n*   `#` 一个可选的 `#`，用于指定浮点值即使在后面没有非零数字也会打印小数点、将打印尾随零、八进制值将以\
  \ `0` 开头打印、十六进制值将以 `0x` 或 `0X` 开头打印。\n*   `d` 一个可选的数字字符串，用于指定字段宽度；如果转换值的字符少于字段宽度，它将在左侧（如果已给出的左对齐指示，则在右侧）填充空白以填满字段宽度；如果字段宽度以零开头，则将进行零填充而非空白填充。\n\
  *   `.` 一个可选的点，用于分隔字段宽度与下一个数字字符串。\n*   `*dd` 一个可选的数字字符串，用于指定精度，该精度指定了 `e-` 和 `f-`\
  \ 转换中小数点后出现的数字个数，或者从字符串中打印的最大字符数。\n*   `*` 字段宽度或精度可以用 `*` 代替数字字符串。在这种情况下，由整数参数提供字段宽度或精度。\n\
  *   `h` 一个可选的字符 `h`，指定后续的 `d`、`o`、`x` 或 `u` 对应短整数参数。\n*   `l` 一个可选的字符 `l`（字母 l），指定后续的\
  \ `d`、`o`、`x` 或 `u` 对应长参数。\n*   `L` 一个可选的字符 `L`，指定后续的 `e`、`E`、`g`、`G` 或 `f` 对应长双精度参数。\n\
  *   `%` 表示打印字符 `%`；不使用参数。\n*   `*c` 一个指示要应用何种类型的字符。转换字符及其含义如下：\n    *   `d`: 将整数参数转换为十进制表示。\n\
  \    *   `i`: 将整数参数转换为十进制表示。\n    *   `o`: 将整数参数转换为八进制表示。\n    *   `x`: 将整数参数转换为十六进制表示。\n\
  \    *   `X`: 将整数参数转换为十六进制表示。\n    *   `f`: 将 float 或 double 参数转换为格式为 `[–]*ddd*.*ddd*`\
  \ 的十进制表示。小数点后 `d` 的个数等于参数的精度。如有必要，会对数字进行四舍五入。如果缺少精度，则提供六位；如果精度明确为 `0` 且未指定 `#`，则不打印小数点。\n\
  \    *   `e`: 将 float 或 double 参数转换为科学计数法 `[–]*d*.*ddde+dd*` 或 `[–]*d*.*ddde*–*dd*`\
  \ 的十进制表示，其中小数点前有一个数字，小数点后的数字个数等于参数的精度指定。如有必要，会对数字进行四舍五入。如果缺少精度，则提供六位；如果精度显式为 `0`\
  \ 且未指定 `#`，则不打印数字也不打印小数点。\n    *   `E`: 与 `e` 类似，但使用大写的 `E` 来标识指数。\n    *   `g`:\
  \ 按 `d` 样式、`f` 样式或 `e` 样式打印 float 或 double 参数，取决于在最小空间内提供最大的精度。\n    *   `G`: 与\
  \ `g` 类似，但使用大写的 `E` 来标识指数。\n    *   `c`: 打印字符参数。忽略空字符。\n    *   `s`: 参数被视为字符串（字符指针），并打印字符串中的字符直到遇到空字符或达到精度指定所指示的字符数；然而，如果精度为\
  \ `0` 或缺失，则打印直到空字符为止的所有字符。\n    *   `p`: 参数被视为指针。打印的表示取决于实现情况。\n    *   `u`: 将无符号整数参数转换为十进制表示。\n\
  \    *   `n`: 将 `printf()`、`fprintf()` 或 `sprintf()` 调用到目前写入的字符数写入由整数指针参数所指向的 `int`\
  \ 中。\n\n在任何情况下，不存在或较小的字段宽度都不会导致字段被截断；只有当指定的字段宽度超过实际宽度时才会进行填充。\n\n由于 C 并没有像 C++ 那样的用户定义类型，因此没有关于用户定义类型（如\
  \ `vector`）的规定。C 标准输出 `stdout` 对应 `cout`。C 标准输入 `stdin` 对应 `cin`。C 标准错误 `stderr`\
  \ 对应 `cerr`。stdio 和 iostream 之间的这种对应非常紧密，以至于 stdio 和 iostream 操作可以共享缓冲区。为了提高性能，在第一次\
  \ I/O 之前调用 `ios_base::sync_stdio(false)`。\n\n那么，如果我们被迫使用 stdio，对输入能做什么呢？一个流行的答案是“使用标准库函数\
  \ `gets()`：“\n\n点击此处查看代码图片\n\n```c\n// 非常危险的代码：\nchar s[buf_size];\nchar* p = gets(s);\
  \ // 读取一行到 s\n```\n\n调用 `p=gets(s)` 读取字符到 `s` 直到遇到换行符或文件结束，并在写入 `s` 的最后一个字符之后放置一个\
  \ 0 字符。如果遇到文件结束或发生错误，`p` 被设置为 `NULL`（即 0）；否则设置为 `s`。永远不要使用 `gets(s)` 或其粗略等价物 `scanf(\"\
  %s\",s)`！多年，它们一直是病毒编写者的最爱：通过提供溢出输入缓冲区（示例中的 `s`）的输入，程序可能会被破坏，计算机可能会被攻击者接管。`sprintf()`\
  \ 函数也面临类似的缓冲区溢出问题。\n\nstdio 库还提供了简单且实用的字符读/写函数：\n\n![Image](img/00424.jpeg)\n\n\n\
  \n\n请注意，这些函数的返回值是一个 `int`（而不是 `char`，否则无法返回 `EOF`）。例如，这是一个典型的 C 风格输入循环：\n\n点击此处查看代码图像\n\
  \n```c\nint ch; /* 不要使用 char ch; */\n\nwhile ((ch=getchar())!=EOF) { /* 执行某些操作 */\
  \ }\n```\n\n不要在同一个流上连续执行两次 `ungetc()`。这种结果是未定义的，并且（因此）是不可移植的。\n\n还有更多的 `stdio` 函数；如果你需要更多信息，请参阅优秀的\
  \ C 语言教科书，例如 K&R 等。\n\n### B.11.3 C 风格字符串\n\nC 风格字符串是以零结尾的 `chars` 数组。这种字符串的概念由定义在\
  \ `<cstring>`（或 `<string.h>`；注意：*不是* `<string>`）和 `<cstdlib>` 中的一组函数提供支持。这些函数通过\
  \ `char*` 指针（对于只读内存使用 `const char*` 指针）对 C 风格字符串进行操作：\n\n![图像](img/00425.jpeg)\n\
  \n请注意，在 C++ 中，`strchr()` 和 `strstr()` 被复制了一以实现类型安全（它们不能像 C 版本那样将 `const char*` 转换为\
  \ `char*`）；另请参见 §27.5。\n\n提取函数会检查其 C 风格字符串参数，寻找约定格式的数字表示，例如 \"124\" 和 \" 1.4\"。如果未找到此类表示，提取函数返回\
  \ 0。例如：\n\n点击此处查看代码图像\n\n```c\nint x = atoi(\"fortytwo\");              /* x 变为\
  \ 0 */\n```\n\n### B.11.4 内存\n\n内存操作函数通过 `void*` 指针（对于只读内存使用 `const void*` 指针）对“原始内存”（未知类型）进行操作：\n\
  \n![图像](img/00426.jpeg)\n\n请注意 `malloc()` 等函数不会调用构造函数，且 `free()` 不调用析构函数。不要对带有构造函数或析构函数的类型使用这些函数。此外，永远不要将\
  \ `memset()` 用于任何带有构造函数的类型。\n\n`mem*` 函数位于 `<cstring>` 中，分配函数位于 `<cstdlib>` 中。\n\
  \n另请参见 §27.5.2。\n\n### B.11.5 日期和时间\n\n在 `<ctime>` 中，你可以找到几种与日期和时间相关的类型和函数：\n\n\
  ![图像](img/00427.jpeg)\n\n`struct tm` 定义如下：\n\n点击此处查看代码图像\n\n```c\nstruct tm {\n\
  \    int tm_sec;  // 分内的秒 [0:61]; 60 和 61 代表闰秒\n    int tm_min;  // 小时的分 [0,59]\n\
  \    int tm_hour;  // 天中的小时 [0,23]\n    int tm_mday;  // 月中的日 [1,31]\n    int tm_mon;\
  \  // 年中的月 [0,11]; 0 代表一月（注意：不是 [1:12]）\n    int tm_year;  // 自 1900 年起的年份; 0 代表\
  \ 1900 年，102 代表 2002 年\n    int tm_wday;  // 自星期日起的数 [0,6]; 0 代表星期日\n    int tm_yday;\
  \  // 自 1 月 1 日起的数 [0,365]; 0 代表 1 月 1 日\n    int tm_isdst;  // 夏令时小时\n};\n```\n\
  \n日期和时间函数：\n\n点击此处查看代码图像\n\n```c\nclock_t clock();                          // 自程序开始以来的时钟数\n\
  time_t time(time_t* pt);                   // 当前日历时间\ndouble difftime(time_t t2,\
  \ time_t t1);     // 以秒计的 t2–t1\ntm* localtime(const time_t* pt);           // *pt\
  \ 的本地时间\ntm* gmtime(const time_t* pt);             // *pt 的格林尼标准时间 (GMT)，或 0\ntime_t\
  \ mktime(tm* ptm);                   // *ptm 的 time_t，或 time_t(-1)\nchar* asctime(const\
  \ tm* ptm);             // *ptm 的 C 风格字符串表示\nchar* ctime(const time_t* t) { return\
  \ asctime(t); }\n```\n\n`asctime()` 调用结果示例为 \"Sun Sep 16 01:03:52 1973\"。一个名为 `strftime()`\
  \ 的函数提供了丰富的 `tm` 格式选项。如果需要，请查询它。\n\n### B.11.6 其他\n\n在 `<cstdlib>` 中我们找到了：\n\n![图像](img/00428.jpeg)\n\
  \n`qsort()` 和 `bsearch()` 使用的比较函数 (`cmp`) 必须具有类型\n\n`int (*cmp)(const void* p, const\
  \ void* q);`\n\n[/content]\n\n*(注：由于你提供的待翻译文本包含两部分重复的内容（从 B.11.3 到 B.11.6 之后又出现了\
  \ C 章节开头），根据“一定不要重复输出原文”的原则，我仅翻译了你提供的第一部分完整内容。如果需要翻译后部分的 C 章节，请告知。)*\n\n**纠正：**\
  \ 观察到你提供的“需要翻译的文本”在 B.11.6 之后确实重复了从 `C. Getting Started with Visual Studio` 开始的内容。为了遵循“不要重复输出原文”的指令，我将为你翻译后续不重复的\
  \ C 部分：\n\n[content]\n## C. 从 Visual Studio 开始\n\n“宇宙不仅比我们想象的奇异，而且比我们想象的还要奇异。”——J.\
  \ B. Haldane\n\n本附录解释了使用 Visual Studio 输入程序、编译并使其运行的步骤。\n\n### C.1 让程序运行\n\n要让程序运行，你需要将文件存放在一起（这样当一个源文件引用另一个文件时，它能找到它）。然后你需要调用编译器和链接器（如果不是的话，至少是为了链接到\
  \ C++ 标准库），最后你需要运行（执行）程序。有多种方法可以实现，不同的系统（例如 Windows 和 Linux）有不同的约定和工具集。然而，你可以在主要系统使用任何主要的工具集运行书中所有的示例。本附录解释了如何在一个流行的系统\
  \ Microsoft 的 Visual Studio 上操作。\n\n个人而言，我们发现在一个新的奇怪系统上运行第一个程序是最令人沮丧的任务。这是一个值得寻求帮助的任务。然而，如果你得到了帮助，请确保帮助者是教你如何做，而不是直接帮你完成。\n\
  \n### C.2 安装 Visual Studio\n\nVisual Studio 是 Windows 的交互式开发环境 (IDE)。如果你的电脑上没有安装\
  \ Visual Studio，你可以购买副本并按照附带说明操作，或者从 [www.microsoft.com/express/download](http://www.microsoft.com/express/download)\
  \ 下载并安装免费的 Visual C++ Express。这里的描述基于 Visual Studio 2005。其他版本可能不同。\n\n### C.3 创建并运行程序\n\
  \n步骤如下：\n\n1. **创建一个新项目。**\n2. **向项目添加 C++ 源文件。**\n3. **输入你的源代码。**\n4. **生成执行文件。**\n\
  5. **执行程序。**\n6. **保存程序。**\n\n#### C.3.1 创建新项目\n\n\n\n\n在 Visual Studio 中，“项目”是文件的集合，这些文件共同提供了在\
  \ Windows 下创建和运行程序（也称为*应用程序*）所需的内容。\n\n1.  点击 Microsoft Visual Studio 2005 图标打开\
  \ Visual C++ IDE，或从 `Start > Programs > Microsoft Visual Studio 2005 > Microsoft\
  \ Visual Studio 2005` 中选择它。\n\n2.  打开 `File` 菜单，指向 `New`，然后点击 `Project`。\n\n3. \
  \ 在 `Project Types` 下，选择 `Visual C++`。\n\n4.  在 `Templates` 中，选择 `Win32 Console\
  \ Application`。\n\n5.  在 `Name` 文本框中输入项目名称，例如 `Hello,World!`。\n\n6.  为项目选择一个目录。默认的\
  \ `C:\\Documents and Settings\\Your Name\\My Documents\\Visual Studio 2005\\Projects`\
  \ 通常是一个很好的选择。\n\n7.  点击 `OK`。\n\n8.  应当出现 WIN32 Application 向导。\n\n9.  在对话框左侧选择\
  \ `Application Settings`。\n\n10. 在 `Additional Options` 下选择 `Empty Project`。\n\n\
  11. 点击 `Finish`。现在你的控制台项目的编译器设置都应该已初始化。\n\n### C.3.2 使用 std_lib_facilities.h 头文件\n\
  \n对于你的第一个程序，我们强烈建议使用来自 [www.stroustrup.com/Programming/std_lib_facilities.h](http://www.stroustrup.com/Programming/std_lib_facilities.h)\
  \ 的自定义头文件 `std_lib_facilities.h`。将其副本放在你在 §C.3.1 第 6 步选择的目录。（注意：保存为文本，而不是 HTML。）要使用它，你需要在程序中使用这一行：\n\
  \n```\n#include \"../../std_lib_facilities.h\"\n```\n\n`../../` 告诉编译器你将头文件放在 `C:\\\
  Documents and Settings\\Your Name\\My Documents\\Visual Studio 2005\\Projects`，这样你的所有项目都可以使用它，而不是放在项目的源文件旁边（那样的话你就必须为每个项目都复制一次）。\n\
  \n### C.3.3 向项目添加 C++ 源文件\n\n你的程序中至少需要一个源文件（通常有很多个）：\n\n1.  点击菜单栏上的 `Add New Item`\
  \ 图标（通常是左侧的第二个图标）。这将打开 `Add New Item` 对话框。在 `Visual C++` 类别下选择 `Code`。\n\n2.  在模板窗口中选择\
  \ `C++ File (.cpp)` 图标。在 `Name` 文本框中输入你的程序文件名（`Hello,World!`）并点击 `Add`。\n\n你创建了一个空的源代码文件。现在你准备好输入你的源代码程序了。\n\
  \n### C.3.4 输入你的源代码\n\n此时，你可以通过直接在 IDE 中打字来输入源代码，也可以从其他来源复制并粘贴。\n\n### C.3.5 生成可执行程序\n\
  \n当你认为已经正确输入了程序的源代码时，进入 `Build` 菜单并选择 `Build Solution`，或者点击 IDE 窗口上方图标列表中指向右侧三角形三角形。IDE\
  \ 将尝试编译并链接你的程序。如果成功，`Output` 窗口将出现消息：\n\n```\nBuild: 1 succeeded, 0 failed, 0 up-to-date,\
  \ 0 skipped\n```\n\n否则，会出现一系列错误消息。调试程序以纠正错误并再次执行 `Build Solution`。\n\n如果你使用了三角形图标，如果没有错误，程序将自动运行（执行）。如果你使用了\
  \ `Build Solution` 菜单项，你必须显式地启动程序，如 §C.3.6 所示。\n\n### C.3.6 执行程序\n\n一旦消除了所有错误，进入\
  \ `Debug` 菜单并选择 `Start Without Debugging` 执行程序。\n\n### C.3.7 保存程序\n\n在 `File` 菜单下，点击\
  \ `Save All`。如果你忘记并尝试关闭 IDE，IDE 会提醒你。\n\n### C.4 以后\n\nIDE 拥有似乎无限的功能和选项。早期不要担心这些内容——否则你会完全迷失。如果你不小心把项目搞乱了导致它“行为异常”，请向一位有经验的朋友寻求帮助，或者从头开始创建一个新项目。随着时间的推移，慢慢地尝试新功能和选项。\n\
  \n# D. 安装 FLTK\n\n“如果代码和注释不一致，\n\n那么它们可能都是错的。”\n\n—Norm Schryer\n\n本附录描述如何下载、安装并链接到\
  \ FLTK 图形和 GUI 工具包。\n\n***\n\n* D.1 引言\n* D.2 下载 FLTK\n* D.3 安装 FLTK\n* D.4 在 Visual\
  \ Studio 中使用 FLTK\n* D.5 测试是否成功\n\n### D.1 引言\n\n我们选择 FLTK（Fast Light Kit，读作“flick”）作为我们演示图形和\
  \ GUI 问题的基础。本附录描述了如何下载、安装并链接到 FLTK 图形和 GUI 工具包。这是因为它是移植的、相对简单且易于安装。如果你使用其他系统，请参见\
  \ D.4 中描述的内容。\n\n### D.2 下载 FLTK\n\n在执行操作之前，首先查看你的机器是否已经安装了 FLTK；参见 D.5。如果没有，第一件事是获取文件：\n\
  \n1.  访问 [`fltk.org`](http://fltk.org)。（紧急情况下，可以从我们的支持网站下载：[www.stroustrup.com/Programming/FLTK](http://www.stroustrup.com/Programming/FLTK)。）\n\
  \n2.  点击导航菜单中的 `Download`。\n\n3.  在下拉列表中选择 `FLTK 1.1.x` 并点击 `Show Download Locations`。\n\
  \n4.  选择下载位置并下载 .zip 文件。\n\n得到的文件是 .zip 格式。这是一种传输大量文件的压缩格式。你需要在机器上一个程序将其“解压”为普通文件；在\
  \ Windows 上，WinZip 和 7-Zip 是此类程序。\n\n### D.3 安装 FLTK\n\n遵循我们的指令遇到的主要问题可能是：在我们编写和测试它们之后发生了变化（常如此），或者术语对你来说很陌生（我们对此无能为力；抱歉）。如果是后一种，请找一位朋友翻译。\n\
  \n1.  解压下载的文件并打开主文件夹 `fltk-1.1.?`。在 Visual C++ 文件夹（例如 `vc2005` 或 `vcnet`）中打开 `fltk.dsw`。如果询问是否更新旧项目文件，选择\
  \ `Yes to All`。\n\n2.  从 `Build` 菜单选择 `Build Solution`。这可能需要几分钟。源代码正在被编译成静态链接库，这样你每次创建一个新项目时，就不需要重新编译\
  \ FLTK 源代码。完成后，关闭 Visual Studio。\n\n\n\n\n\n### 3. 从 FLTK 主目录打开 `lib` 文件夹。将除 `README.lib`\
  \ 之外（应该有七个文件）的所有 `.lib` 文件复制（不只是移动/拖拽）到 `C:\\Program Files\\Microsoft Visual Studio\\\
  Vc\\lib`。\n\n### 4. 回到 FLTK 主目录，并将 `FL` 文件夹复制到 `C:\\Program Files\\Microsoft Visual\
  \ Studio\\Vc\\include`。\n\n专家们会告诉你，比复制到 `C:\\Program Files\\Microsoft Visual Studio\\\
  Vc\\lib` 和 `C:\\Program Files\\Microsoft Visual Studio\\Vc\\include` 有更好的安装方法。他们是对的，但我们并不是试图让你成为\
  \ VS 专家。如果专家们坚持要这样，就让他们负责向你展示更好的替代方案吧。\n\n### D.4 在 Visual Studio 中使用 FLTK\n\n**1.**\
  \ 在 Visual Studio 中创建一个新项目，与常规步骤相比有一处变化：在选择项目类型时，创建一个“Win32 项目”而不是“控制台应用程序”。确保创建一个“空项目”；否则某些“软件向导”会向你的项目添加你可能不需要或无法理解的内容。\n\
  \n**2.** 在 Visual Studio 中，从主（顶部）菜单选择 `Project`，然后从下拉菜单选择 `Properties`。\n\n**3.**\
  \ 在 `Properties` 对话框中，点击左侧菜单的 `Linker` 文件夹。这将展开一个子菜单。在此子菜单中，点击 `Input`。在右侧的 `Additional\
  \ Dependencies` 字段中输入以下文本：\n\n`fltkd.lib wsock32.lib comctl32.lib fltkjpegd.lib\
  \ fltkimagesd.lib`\n\n[此步骤可能是不需要的，因为现在是默认值。] 在 `Ignore Specific Library` 字段中输入以下文本：\n\
  \n`libcd.lib`\n\n**4.** [此步骤可能是不需要的，因为 `/MDd` 现在是默认值。] 在同一 `Properties` 窗口的左侧菜单中，点击\
  \ `C/C++` 展开另一个子菜单。点击 `Code Generation` 子项。在右菜单中，将 `Runtime Library` 下拉改为 `Multi-threaded\
  \ Debug DLL (/MDd)`。点击 OK 关闭 `Properties` 窗口。\n\n### D.5 测试是否成功\n\n在你新创建的项目中创建一个新的\
  \ `.cpp` 文件并输入以下代码。它应该能够无问题编译。\n\n点击此处查看代码图像\n\n```cpp\n#include <FL/Fl.h>\n#include\
  \ <FL/Fl_Box.h>\n#include <FL/Fl_Window.h>\n\nint main()\n{\n    Fl_Window window(200,\
  \ 200, \"Window title\");\n    Fl_Box box(0,0,200,200, \"Hey, I mean, Hello, World!\"\
  );\n    window.show();\n    return Fl::run();\n}\n```\n\n如果没有运行：\n\n* “Compiler\
  \ error stating a .lib file could not be found”：问题可能出现在安装部分。请注意步骤 3，这该步骤涉及将链接库（.lib）文件放在编译器可以轻松找到的地方。\n\
  * “Compiler error stating a .h file could not be opened”：问题可能出现在安装部分。请注意步骤 4，这该步骤涉及将头文件（.h）放在编译器可以轻松找到的地方。\n\
  * “Linker error involving unresolved external symbols”：问题可能出现在项目部分。\n\n如果这些没有帮助，请找个朋友问问。\n\
  \n## E. GUI 实现\n\n“当你终于理解自己在做什么时，事情就会变得顺利。”——Bill Fairbank\n\n本附录介绍了回调（callbacks）、Window、Widget\
  \ 和 `Vector_ref` 的实现细节。在第 16 章中，我们无法假设读者拥有完整解释所需的指针和类型转换知识，因此我们将这些解释放到了这个附录。\n\n\
  * E.1 回调实现\n* E.2 Widget 实现\n* E.3 Window 实现\n* E.4 Vector_ref\n* E.5 示例：操作 Widgets\n\
  \n### E.1 回调实现\n\n我们是这样实现回调的：\n\n点击此处查看代码图像\n\n```cpp\nvoid Simple_window::cb_next(Address,\
  \ Address addr)\n{\n    // 为位于 addr 的窗口调用 Simple_window::next()\n    reference_to<Simple_window>(addr).next();\n\
  }\n```\n\n一旦你理解了第 17 章，就很明显 `Address` 必须是 `void*`。当然，`reference_to<Simple_window>(addr)`\
  \ 必须以某种方式从名为 `addr` 的 `void*` 创建 `Simple_window` 的引用。然而，除非你有之前的编程经验，否则在阅读[第 17 章]之前，这一点并不“显而易见”或“当然如此”，所以让我们来看看地址的使用。\n\
  \n正如 `A.7` 所述，C++ 提供了一种为类型命名的方法。例如：\n\n```cpp\ntypedef void* Address; // 表示 Address\
  \ 现在可以代替 void*\n```\n\n这里我们使用 `Address` 来强调传递的是地址。由于 `cb_next()` 接收一个名为 `addr` 的\
  \ `void*`，我们使用模板函数将其转换为 `Simple_window&`：\n\n```cpp\ntemplate<class W> W& reference_to(Address\
  \ pw)\n{\n    // 处理 W\n    return *static_cast<W*>(pw);\n}\n```\n\n这里的类型转换 `static_cast`\
  \ 在 `1.8` 中有描述。编译器没有办法验证 `addr` 指向 `Simple_window`，但语言要求信任程序员。幸运的是，我们是对的。我们知道自己是对的是因为\
  \ FLTK 给了我们一个给给它的指针。我们可以使用 `reference_to` 来“拿到”。我们使用混乱的回调函数 `cb_next()` 只是为了根据需要调整类型以调用完全普通的成员函数\
  \ `next()`。\n\n### E.2 Widget 实现\n\n我们的 `Widget` 接口类如下：\n\n```cpp\nclass Widget\
  \ {\n    // Widget 是 Fl_widget 的句柄 — 它不是 Fl_widget\n    // 我们尽量让自己的接口类与 FLTK 保持距离\n\
  public:\n    Widget(Point xy, int w, int h, const string& s, Callback cb)\n    \
  \    :loc(xy), width(w), height(h), label(s), do_it(cb) { }\n    virtual ~Widget()\
  \ { } // 析构函数\n    virtual void move(int dx,int dy)\n        { hide(); pw->position(loc.x+=dx,\
  \ loc.y+=dy); show(); }\n    virtual void hide() { pw->hide(); }\n    virtual void\
  \ show() { pw->show(); }\n    virtual void attach(Window&) = 0; // 每个 Widget 都为窗口定义至少一个动作\n\
  \n    Point loc;\n    int width;\n    int height;\n    string label;\n    Callback\
  \ do_it;\n\nprotected:\n    Window* own; // 每一个 Widget 都属于一个 Window\n};\n```\n\n\
  \n\n\n\n```cpp\nFl_Widget* pw; // 一个 Widget “知道”它的 Fl_Widget\n};\n```\n\n注意，我们的\
  \ `Widget` 跟踪了它所属的 FLTK widget 以及它关联的 `Window`。之所以我们需要使用指针，是因为一个 `Widget` 在其生命周期内可能会与不同的\
  \ `Window` 关联。引用或具名对象是不够的。（为什么不行的呢？）\n\n它有一个位置（`loc`）、一个矩形形状（`width` 和 `height`）以及一个标签。有趣的地方在于，它还有一个回调函数（`do_it`）——它将屏幕上\
  \ `Widget` 的图像连接到我们代码的某部分。这些操作（`move()`、`show()`、`hide()` 和 `attach()`）的意义应该是显而易见的。\n\
  \n`Widget` 看起来像是一件“半成品”。它最初被设计成一个实现类，用户不应该经常看到它。它是重新设计的良好候选者。我们对所有这些公共数据成员都表示怀疑，而且“显而易见”的操作通常需要重新检查以发现未计划之外的微妙之处。\n\
  \n`Widget` 具有虚函数并可以作为基类使用，因此它有一个虚析构函数 (§17.5.2)。\n\n### E.3 Window 的实现\n\n我们什么时候使用指针，又什么时候使用引用？我们在\
  \ §8.5.6 中探讨了这个通用问题。在这里，我们只需要观察到某些程序员喜欢指针，而且当我们希望在程序的不同时间指向不同的对象时，我们需要指针。\n\n到为止，我们还没有展示图形和\
  \ GUI 库中的核心类之一：`Window`。最主要的原因它使用了指针，而且它使用 FLTK 的实现需要堆内存（free store）。如在 `Window.h`\
  \ 中所示，如下：\n\n点击此处查看代码图像\n\n```cpp\nclass Window : public Fl_Window {\npublic:\n\
  \    // 让系统选择位置：\n    Window(int w, int h, const string& title);\n    // xy 中的左上角坐标：\n\
  \    Window(Point xy, int w, int h, const string& title);\n    virtual ~Window()\
  \ { }\n    int x_max() const { return w; }\n    void resize(int ww, int hh) { w=ww,\
  \ h=hh; size(ww,hh); }\n    void set_label(const string& s) { label(s.c_str());\
  \ }\n    void attach(Shape& s) { shapes.push_back(&s); }\n    void attach(Widget&);\n\
  \    void detach(Shape& s); // 从 shapes 中移除 s\n    void detach(Widget& w); // 从\
  \ window 中移除 w\n    // (取消回调)\n    void put_on_top(Shape& p); // 将 p 置于其他形状之上\n\
  protected:\n    void draw();\nprivate:\n    vector<Shape*> shapes; // 附加到窗口的形状\n\
  \    int w,h; // 窗口大小\n    void init();\n};\n```\n\n所以，当我们 `attach()` 一个 `Shape`\
  \ 时，我们在 `shapes` 中存储一个指针，以便 `Window` 能够绘制它。由于我们之后可以 `detach()` 那个形状，我们需要一个指针。基本上，被\
  \ `attach()` 的形状仍然由我们的代码拥有；我们给了 `Window` 一个它的引用。`Window::attach()` 将其参数转换为指针以便存储。如上所示，`attach()`\
  \ 是轻而易举的；`detach()` 稍微复杂一点。查看 `Window.cpp`，我们发现：\n\n点击此处查看代码图像\n\n```cpp\nvoid Window::detach(Shape&\
  \ s) {\n    // 假设最后一个将被释放\n    for (vector<Shape*>::size_type i = shapes.size();\
  \ i>0; --i) {\n        if (shapes[i-1]==&s)\n            shapes.erase(shapes.begin()+(i-1));\n\
  \    }\n}\n```\n\n`erase()` 成员函数从 `vector` 中“擦除”一个值，使 `vector` 的大小减一 (§20.7)。`Window`\
  \ 意在用作基类使用，因此它有一个虚析构函数 (§17.5.2)。\n\n### E.4 Vector_ref\n\n基本上，`Vector_ref` 模拟了一个引用的\
  \ vector。你可以用引用或指针来初始化它：\n\n*   如果对象作为引用传递给 `Vector_ref`，则假设它由调用者拥有，调用者负责其生命周期（例如，该对象是一个作用域局部变量）。\n\
  *   如果对象作为指针传递给 `Vector_ref`，则假设它是通过 `new` 分配的，删除它是 `Vector_ref` 的责任。\n\n元素是以指针形式（而不是作为对象的拷贝）存储在\
  \ `Vector_ref` 中的，并且具有引用引用语义。例如，你可以将一个 `Circle` 放入 `Vector_ref<Shape>` 中而不会发生切片问题（slicing）。\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<class T> class Vector_ref {\n    vector<T*> v;\n\
  \    vector<T*> owned;\npublic:\n    Vector_ref() {}\n    Vector_ref(T* a, T* b\
  \ = 0, T* c = 0);\n    ~Vector_ref() { for (int i=0; i<owned.size(); ++i) delete\
  \ owned[i]; }\n    void push_back(T& s) { v.push_back(&s); }\n    void push_back(T*\
  \ p) { owned.push_back(p); }\n    T& operator[](int i) { return *v[i]; }\n    const\
  \ T& operator[](int i) const { return *v[i]; }\n    int size() const { return v.size();\
  \ }\n};\n```\n\n`Vector_ref` 的析构函数删除所有传递给 `Vector_ref` 的指针。`push_back(T* p)` 将指针存储到\
  \ `owned` 向量中。\n\n### E.5 示例：操作 Widgets\n\n这是一个完整的程序。它练习了 `Widget` 的许多功能。由于注释较少，遗憾的是，这种注释是不常见的。当你运行它时，它显示了四个按钮：它只是两个是隐藏的。\n\
  \n点击此处查看代码图像\n\n```cpp\n#include \"../GUI.h\"\n#include \"../Graph.h\"\n\nusing\
  \ namespace Graph_lib;\n\nclass W7 : public Window {\n    // 按钮的行为：\n    // 显示/隐藏，改变位置，创建/销毁\n\
  \    // 激活/取消激活\n    // 动作\npublic:\n    W7(int w, int h, const string& t);\n  \
  \  // 按钮\n    Button* p1; // 显示/隐藏\n    Button* p2; // 显示/隐藏\n    Button* mvp; //\
  \ 移动\n    Button* cdp; // 创建/销毁\n    Button* adp1; // 激活/取消激活\n    Button* adp2;\
  \ // 激活/取消激活\n    // 回调\n    static void cb_sh(Address, addr);\n    static void\
  \ cb_mv(Address, addr);\n    static void cb_cd(Address, addr);\n    static void\
  \ cb_ad(Address, addr);\n};\n```\n\n然而，一个 `W7`（7 号实验）实际上有六个按钮，它只是隐藏了两个：\n\n点击此处查看代码图像\n\
  \n```cpp\nW7::W7(int w, int h, const string& t)\n    :Window{w,h,t},\n    sh_left{true},\
  \ mv_left{true}, cd_left{true}, ad_left{true}\n{\n    p1 = new Button{Point{100,100},50,20,\"\
  show\",cb_sh};\n    p2 = new Button{Point{200,100},50,20, \"hide\",cb_sh};\n   \
  \ mvp = new Button{Point{100,200},50,20,\"move\",cb_mv};\n    cdp = new Button{Point{100,300},50,20,\"\
  create\",cb_cd};\n    adp1 = new Button{Point{100,400},50,20,\"activate\",cb_ad};\n\
  \    adp2 = new Button{Point{200,400},80,20,\"deactivate\",cb_ad};\n    attach(*p1);\n\
  \    attach(*p2);\n    attach(*mvp);\n    attach(*cdp);\n    p2–>hide();\n    attach(*adp1);\n\
  }\n```\n\n有四个回调。每个回调都让你看起来你按下的按钮消失了，出现了一个新按钮。然而，这是通过四种不同的方式实现的：\n\n\n\n\n\n```cpp\n\
  void W7::sh()                // 隐藏一个按钮，显示另一个\n{\n    if (sh_left) {\n        p1->hide();\n\
  \        p2->show();\n    }\n    else {\n        p1->show();\n        p2->hide();\n\
  \    }\n    sh_left = !sh_left;\n}\n\nvoid W7::mv() // 移动按钮\n{\n    if (mv_left)\
  \ {\n        mvp->move(100,0);\n    }\n    else {\n        mvp->move(-100,0);\n\
  \    }\n    mv_left = !mv_left;\n}\n\nvoid W7::cd()                // 删除按钮并创建一个新的\n\
  {\n    cdp->hide();\n    delete cdp;\n    string lab = \"create\";\n    int x =\
  \ 100;\n    if (cd_left) {\n        lab = \"delete\";\n        x = 200;\n    }\n\
  \    cdp = new Button{Point{x,300}, 50, 20, lab, cb_cd};\n    attach(*cdp);\n  \
  \  cd_left = !cd_left;\n}\n\nvoid W7::ad()                // 将按钮从窗口分离并附加其替换品\n{\n\
  \    if (ad_left) {\n        detach(*adp1);\n        attach(*adp2);\n    }\n   \
  \ else {\n        detach(*adp2);\n        attach(*adp1);\n    }\n    ad_left = !ad_left;\n\
  }\n\nint main()\n{\n    W7 w{400,500};\n    return gui_main();\n}\n```\n\n## 术语表\n\
  \n**Anonymous (匿名)** — 对文本中使用词汇的简要解释。这是我们认为最重要的术语简短词汇表，特别是在学习早期阶段。关于 C++ 的更详尽词汇表可以在\
  \ [www.ststrup.com/glossary.html](http://www.ststrup.com/glossary.html) 找到，请注意，一个术语可能有多个相关含义（因此我们偶尔会列出某些项），而且大多数术语在其他语境下也有（通常是微弱的）含义；例如，几个精选的词胜过千言。\n\
  \n**abstraction (抽象)** — 对某物的描述，选择性地忽略（隐藏）细节（例如，实现细节）；选择性忽略。\n\n**address (地址)**\
  \ — 允许我们在计算机内存中找到对象的值。\n\n**algorithm (算法)** — 用于解决问题的步骤或公式；产生结果的有限计算步骤序列。\n\n**alias\
  \ (别名)** — 引用对象的另一种方式；通常是名称、指针或引用。\n\n**application (应用程序)** — 被其用户视为一个实体的程序或一组程序的集合。\n\
  \n**approximation (近似)** — 接近完美或理想（值或设计）的某物（例如，一个值或设计）。近似通常是理想之间权衡的结果。\n\n**argument\
  \ (参数)** — 传递给函数或模板的值，通过参数进行访问。\n\n**array (数组)** — 一组同类元素的序列，通常有编号，例如 [0:max]。\n\
  \n**assertion (断言)** — 插入程序中的语句，用于声明（断言）某在某一点必须始终为真。\n\n**base class (基类)** — 用作类层次结构基础的类。通常，基类有一个或多个虚函数。\n\
  \n**bit (位)** — 计算机中信息的基本单位。一个位的值可以是 0 或 1。\n\n**bug (错误)** — 程序中的错误。\n\n**byte\
  \ (字节)** — 大多数计算机中寻址的基本单位。通常一个字节包含 8 位。\n\n**class (类)** — 用户定义的类型，其中可以包含数据成员、函数成员和成员类型。\n\
  \n**code (代码)** — 程序或程序的一部分；含义地同时用于源代码和目标代码。\n\n**compiler (编译器)** — 将源代码转换为目标代码的程序。\n\
  \n**complexity (复杂度)** — 一个难以精确定义的概念或衡量标准，用于衡量构建问题解决方案的难度或解决方案本身的难度。有时复杂度被用来（简单地）指执行算法所需操作次数的估计。\n\
  \n**computation (计算)** — 某些代码的执行，通常接收某些输入并产生某些输出。\n\n**concept (概念)** — (1) 念头、想法；(2)\
  \ 一组要求，通常针对模板参数。\n\n**concrete class (具体类)** — 可以创建对象的类。\n\n**constant (常量)** —\
  \ 在（给定作用范围内）不能更改的值；不可变性。\n\n**constructor (构造函数)** — 初始化（“构造”）对象的操。通常，构造函数会建立一个不变性，并经常获取对象使用所需的资源（这些资源通常由析构函数释放）。\n\
  \n**container (容器)** — 包含元素（其他对象）的对象。\n\n**copy (拷贝)** — 使两个对象具有相等比较的值的操作。另见 move\
  \ (移动)。\n\n**correctness (正确性)** — 如果程序或程序部分符合其规范，则认为它是正确的。遗憾的是，规范可能是不或不一致的，或者无法满足用户的预期。因此，为了产生可以的代码，我们有时必须做比遵循正式规范更多的事情。\n\
  \n**cost (成本)** — 生成程序或执行程序的开销（例如，程序员的时间、运行时间或空间）。理想情况下，成本应该是复杂性的函数。\n\n**data (数据)**\
  \ — 计算中使用的值。\n\n**debugging (调试)** — 在程序中搜索并移除错误的行为；通常比测试不系统得多。\n\n**declaration\
  \ (声明)** — 在程序中带有其类型的名称规范。\n\n**definition (定义)** — 对实体的声明，提供了完成使用该实体程序所需的所有信息。简化定义：分配内存的声明。\n\
  \n**derived class (派生类)** — 派自一个或多个基类的类。\n\n**design (设计)** — 关于软件应如何运行以满足其规范的整体描述。\n\
  \n**destructor (析构函数)** — 对象销毁（例如在作用域结束时）时隐含调用（调用）的操作。通常，它会释放资源。\n\n**encapsulation\
  \ (封装)** — 保护旨在私有的内容（例如，实现细节）免受未经授权的访问。\n\n**error (错误)** — 程序行为合理预期（通常为需求或用户指南）与程序实际行为之间的不匹配。\n\
  \n**executable (可执行文件)** — 准备在计算机上运行（执行）的程序。\n\n**feature creep (功能膨胀)** — 在程序中“以防万一”添加多余功能的倾向。\n\
  \n**file (文件)** — 计算机中永久信息的容器。\n\n**floating-point number (浮点数)** — 计算机对实数的近似，例如\
  \ 7.93 和 10.78e–3。\n\n**function (函数)** — 可以在程序不同部分调用（调用）的命名代码单元；逻辑计算单元。\n\n**generic\
  \ programming (泛编程)** — 一专注于算法设计和高效实现的编程风格。泛算法适用于所有满足其要求的参数类型。在 C++ 中，泛编程通常使用模板。\n\
  \n**handle (句柄)** — 通过成员指针或引用允许访问另一个对象的类。另见 copy (拷贝), move (移动), resource (资源)。\n\
  \n**header (头文件)** — 用于在程序部分之间共享接口的声明文件。\n\n**hiding (隐藏)** 防止直接查看或访问信息的行为。例如，嵌套（内部）作用域中的名称可以防止外部（包围）作用域中的相同名称被直接使用。\n\
  \n\n\n\n**理想**：我们努力追求的某种完美版本。通常我们必须进行权衡，并妥协于近似方案。\n\n**实现**：(1) 编写和测试代码的行为；(2) 实现程序的代码。\n\
  \n**无限循环**：终止条件永远不会变为真的的循环。参见**迭代**。\n\n**无限递归**：一种直到机器耗尽内存以存储调用栈为止都不会结束的递归。在现实中，这种递归永远不是无限，而是由某些硬件错误终止的。\n\
  \n*信息隐藏：*将接口与实现分离的行为，从而隐藏不打算让用户关注的实现细节，提供抽象。\n\n初始化 赋予对象第一个“初始值” 输入值 用于计算的 例如 函数参数\
