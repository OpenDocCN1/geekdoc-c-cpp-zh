  \ ####仅重点级别控制整体可索引满足需求虚静反射完结于 [/conent]。\n\n\n\n\n为了实现我们的列表（List）函数，我们首先 `#include`\
  \ 一些标准库头文件：\n\n```c\n#include<stdio.h>\n#include<stdlib.h>\n#include<assert.h>\n\
  ```\n\nC 语言没有命名空间，所以我们不需要担心使用声明或或 `using` 指令。另一方面，我们可能应该担心我们占用了一些非常常见的短名（`Link`、`insert`、`init`\
  \ 等），因此这组函数在练习程序之外无法“原样”使用。\n\n### 初始化\n初始化是非常容易的，但请注意 `assert()` 的使用：\n\n点击此处查看代码图像\n\
  \n```c\nvoid init(struct List* lst)    /* 将 *lst 初始化为空列表 */\n{\n    assert(lst);\n\
  \    lst->first = lst->last = 0;\n}\n```\n\n我们决定不处理运行时对无效列表指针的错误处理。通过使用 `assert()`，如果列表指针为空，我们只会给出一个（运行时）系统错误。该“系统错误”将提供失败的\
  \ `assert()` 的文件名和行号；`assert()` 是定义在 `<assert.h>` 中的一个宏，且仅在调试期间启用。在没有异常的情况下，很难知道对无效指针该怎么办。\n\
  \n### 内存管理\n`create()` 函数简单地在堆内存（free store）上创建一个 `List`。它是构造函数（`init()` 初始化）和 `new`（`malloc()`\
  \ 分配内存）的某种结合：\n\n点击此处查看代码图像\n\n```c\nstruct List* create()                /* 创建一个新的空列表\
  \ */\n{\n    struct List* lst = (struct List*)malloc(sizeof(struct List));\n   \
  \ init(lst);\n    return lst;\n}\n```\n\n`clear()` 函数假设所有的 `Links` 都是创建在堆内存上的，并对其进行\
  \ `free()`：\n\n点击此处查看代码图像\n\n```c\nvoid clear(struct List* lst)    /* 释放 lst 的所有元素\
  \ */\n{\n    assert(lst);\n    {\n        struct Link* curr = lst->first;\n    \
  \    while(curr) {\n            struct Link* next = curr->suc;\n            free(curr);\n\
  \            curr = next;\n        }\n        lst->first = lst->last = 0;\n    }\n\
  }\n```\n\n注意我们遍历 `Link` 的 `suc` 成员的方式。我们无法在成员被 `free()` 之后安全地访问它，因此我们引入了变量 `next`\
  \ 在 `free()` 一个 `Link` 的时候保留我们的位置。如果我们没有将所有的 `Links` 都分配在堆内存上，最好不要调用 `clear()`，否则\
  \ `clear()` 会造成混乱。\n\n`destroy()` 函数本质上是 `create()` 的相反操作，也就是说是某种析构函数和删除操作：\n\n\
  点击此处查看代码图像\n\n```c\nvoid destroy(struct List* lst)  /* 释放 lst 的元素；释放 lst */\n{\n\
  \    assert(lst);\n    clear(lst);\n    free(lst);\n}\n```\n\n注意，我们没有为 `Links` 代表的元素提供调用清理函数（析构函数）机制。这种设计并不是对\
  \ C++ 技术的忠实模仿——它不能且可能也不应该这样做。`push_back()` 函数——添加一个 `Link` 作为新的最后一个 `Link`——是直接的：\n\
  \n点击此处查看代码图像\n\n```c\nvoid push_back(struct List* lst, struct Link* p)  /* 将 p 添加到\
  \ lst 的末尾 */\n{\n    assert(lst);\n    {\n        struct Link* last = lst->last;\n\
  \        if (last) {\n            last->suc = p;  /*在 last 之后添加 p */\n         \
  \   p->pre = last;\n        }\n        else {\n            lst->first = p;  /* p\
  \ 是第一个元素 */\n            p->pre = 0;\n        }\n        lst->last = p;  /* p 是新的最后一个元素\
  \ */\n        p->suc = 0;\n    }\n}\n```\n\n### 删除元素\n然而，如果没有在草稿纸上画几个方框和箭头，我们永远无法写对。注意我们“忘记”考虑参数\
  \ `p` 为空的情况。传递 `0` 而不是 `Link` 指针，这段代码将惨遭失败。这在本质上并不是坏代码，但它不具备工业强度。它的目的是说明常见且实用的技术（在这种情况下，还有一种常见的缺陷/错误）。\n\
  \n`erase()` 函数可以这样写：\n\n点击此处查看代码图像\n\n```c\nstruct Link* erase(struct List* lst,\
  \ struct Link* p)\n/*\n    从 lst 中移除 p;\n    返回 p 之后 link 的指针\n*/\n{\n    assert(lst);\n\
  \    if (p==0) return 0;  /* 允许 erase(0) 是安全的 */\n    if (p == lst->first) {\n \
  \       if (p->suc) {\n            lst->first = p->suc;  /* 后继节点成为第一个 */\n     \
  \       p->suc->pre = 0;\n        }\n        else {\n            lst->first = lst->last\
  \ = 0;  /* 列表为空 */\n        }\n        return p->suc;\n    }\n    else if (p ==\
  \ lst->last) {\n        if (p->pre) {\n            lst->last = p->pre;  /* 前驱节点成为最后一个\
  \ */\n            p->pre->suc = 0;\n        }\n        else {\n            lst->first\
  \ = lst->last = 0;  /* 列表为空 */\n        }\n        return 0;\n    }\n    else {\n\
  \        p->pre->suc = p->suc;\n        if (p->suc) {\n            p->suc->pre =\
  \ p->pre;\n        }\n        return p->suc;\n    }\n}\n```\n\n我们将剩下的函数留作练习，因为我们不需要它们太简单。然而，现在我们面临核心问题：数据在哪里？如何实现一个简单的姓名列表？\n\
  \n由于我们知道 `Links` 在堆内存上，我们写一个在堆内存上创建 Name 的函数：\n\n```c\nstruct Name {\n    struct\
  \ Link ln;  /* 所需的 Link */\n    char* p;  /* 姓名 */\n};\n```\n\n```c\nstruct Name*\
  \ make_name(char* n)\n{\n    struct Name* p = (struct Name*)malloc(sizeof(struct\
  \ Name));\n    p->p = n;\n    return p;\n}\n```\n\n或者图示如下：\n![images/0317.jpeg\n\
  \n现在让我们使用它：\n\n```c\nint main()\n{\n    int count = 0;\n    struct List names; \
  \ /* 创建列表 */\n    struct Link* curr;\n    init(&names);\n    /* 创建一些姓名并将它们添加到列表：\
  \ */\n    push_back(&names,(struct Link*)make_name(\"Norah\"));\n    push_back(&names,(struct\
  \ Link*)make_name(\"Annemarie\"));\n    push_back(&names,(struct Link*)make_name(\"\
  Kris\"));\n    /* 删除第二个姓名（索引为 1）： */\n    erase(&names,advance(names.first,1));\n\
  \    curr = names.first;  /* 输出所有姓名 */\n    for (; curr!=0; curr=curr->suc) {\n\
  \        count++;\n        printf(\"element %d: %s\\n\", count, ((struct Name*)curr)->p);\n\
  \    }\n}\n```\n\n所以我们“作弊”了。我们使用强制类型转换将 `Name*` 视为 `Link*`。通过这种，用户知道“库类型” `Link`。然而，“库”并不知道“应用类型”\
  \ `Name`。这是允许的吗？是的，允许的：在 C（和 C++）中，你可以将结构体的指针视为指向其第一个元素的指针，反之亦然。\n\n\n\n显然，这个 `List`\
  \ 示例完全如其所写的 C++ 代码。\n\n***\n\n![Image](img/00024.jpeg) 尝试一下\n\nC++ 程序员在与 C 程序员交流时，经常听到的一句口禅是：“你能做的一切，我都能做得更好！”因此，请用\
