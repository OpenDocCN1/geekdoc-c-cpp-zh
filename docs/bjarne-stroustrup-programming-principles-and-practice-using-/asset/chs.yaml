  \ `.5` 分的向下舍入）。用 `long int` 中的分数表示货币金额，但输入和输出以美元和分的形式显示，例如 `$123.45`。无需担心无法放入 `long\
  \ int` 范围的金额。\n\n15. 通过添加货币（作为构造函数参数给出）来完善 `Money` 类。只要浮点初始化值可以被精确表示为 `long int`，就可以接受它。不接受非法操作。例如，`Money*Money`\
  \ 没有意义，而 `USD1.23+DKK5.00` 只有在你提供了定义美国美元（USD）和丹麦克朗（DKK）之间转换因子的转换表时才有意义。\n\n16. 定义一个输入运算符（`>>`），将带有货币单位的货币金额（如\
  \ `USD1.23` 和 `DKK5.00`）读入 `Money` 变量中。还要定义一个相应的输出运算符（`<<`）。\n\n17. 给出一个计算示例，其中\
  \ `Rational` 得到的结果上比 `Money` 更符合数学逻辑。\n\n18. 给出一个计算示例，其中 `Rational` 得到的结果上比 `double`\
  \ 更符合数学逻辑。\n\n# 后记\n\n用户定义类型有很多内容，远比我们在这里介绍的要。用户定义类型，特别是类，是 C++ 的核心，也是许多最有效设计技术的关键。书的大部分内容都是关于类的设计和使用的。类——或一组类——是我们代码中表示概念的机制。在这里，我们主要介绍了类的语言技术方面；在其他地方，我们关注如何优雅地将实用的想法表示为类。\n\
  \n# 第二部分：输入与输出\n\n## 10. 输入/输出流\n\n“科学是我们学到的如何不欺骗自己的知识。”\n\n—理查德·费曼\n\n在本章和下一章中，我们将介绍\
  \ C++ 标准库中处理来自各种来源的输入和输出的设施：I/O 流。我们将展示如何读写文件、如何处理错误、如何处理格式化输入，以及如何为用户定义类型提供并使用\
  \ I/O 运算符。本章重点关注基础模型：如何读写单个值，以及如何打开、读取和写入整个文件。最后的示例说明了编写较大代码时考虑的因素。下一章将涉及细节。\n\n\
  ***\n\n- 10.1 输入与输出\n- 10.2 I/O 流模型\n- 10.3 文件\n- 10.4 打开文件\n- 10.5 读写文件\n- 10.6\
  \ I/O 错误处理\n- 10.7 读取单个值\n    - 10.7.1 将问题分解为可管理的部分\n    - 10.7.2 将对话与函数分离\n- 10.8\
  \ 用户定义的输出运算符\n- 10.9 用户定义的输入运算符\n- 10.10 标准输入循环\n- 10.11 读取结构化文件\n    - 10.11.1\
  \ 内存中的表示法\n    - 10.11.2 读取结构化值\n    - 10.11.3 改变表示法\n\n***\n\n### 10.1 输入与输出\n\n\
  ![Image](img/0005.jpeg)\n\n没有数据，计算就是毫无意义的。我们需要将数据输入程序进行有趣的计算，并需要将结果输出。在 §4.1 中，我们提到了数据源和目标的极其多样。如果不注意，我们将编写出只能从特定源输入并向特定设备输出的程序。对于特殊应用程序（例如数字相机或发动机传感器），这是可以的（有时也是必要的），但对于常见的任务，我们需要一种方法将程序的读写与实际设备分离。如果我们必须直接处理每种设备，那么每当新屏幕上市时我们就必须修改程序，或者限制用户使用我们喜欢的屏幕。这是荒谬的。\n\
  \n现代操作系统将 I/O 设备的详细处理分离到驱动程序中，程序随后通过 I/O 库访问驱动程序，使得不同来源的 I/O 看起来尽可能相似。通常，驱动程序位于操作系统的底层，大多数用户看不见，而\
  \ I/O 库提供了 I/O 的抽象，使得程序员不需要考虑设备和驱动程序：\n\n![Image](img/0065.jpeg)\n\n当使用这种模型时，输入和输出可以被视为由输入/输出库处理的字节（字符）流。更复杂的\
  \ I/O 需要专业知识，并超出了本书的范围。作为应用程序程序员，我们的工作变成了：\n\n1. 为适当的数据源和目标设置 I/O 流\n2. 对这些流进行读写\n\
  \n我们的字符如何传输到/从设备的细节由 I/O 库和驱动程序处理。在本章和下一章中，我们将看到如何使用 C++ 标准库完成由格式化数据流组成的 I/O。\n\n\
  从程序员的角度来看，有很多不同的输入和输出。一种分类方法是\n\n![Image](img/0005.jpeg)\n\n- 数据项流（通常到/文件、网络连接、录制设备或显示设备）\n\
  - 与键盘的交互\n- 通过图形界面与用户交互（输出对象、接收鼠标点击等）\n\n\n\n\n\n这种分类并不是唯一的分类方法，而且三种 I/O 类型之间的区别并不像表面看起来那么清晰。例如，如果一个输出字符流恰好面向浏览器的\
  \ HTTP 文档，那么其结果看起来非常像用户交互，并且可能包含图形元素。相反，与 GUI（图形用户界面）的交互结果可能会以字符序列的形式呈现给程序。然而，这种分类符合我们的工具\
  \ set：前两种 I/O 由 C++ 标准库的 I/O 流提供，并受到大多数操作系统的直接支持。我们从第 1 章开始一直使用 `iostream` 库，并将在本章和下一章中重点关注它。图形输出和图形用户交互由各种不同的库提供，我们将在第\
  \ 12 章到第 16 章中重点关注这类 I/O。\n\n## 10.2 I/O 流模型\n\nC++ 标准库提供了 `istream` 类型来处理输入流，以及\
  \ `ostream` 类型来处理输出流。我们已经使用过标准的 `istream`（名为 `cin`）和标准的 `ostream`（名为 `cout`），所以我们知道如何使用标准库中这部分（通常称为\
  \ `iostream` 库）的基础。\n\n### 一个 ostream\n\n![Image](img/00005.jpeg)\n\n*   将各种类型的值转换为字符序列\n\
  *   将这些字符发送到“某处”（例如控制台、文件、主内存或另一台计算机）\n\n我们可以这样图形化地表示 `ostream`：\n\n![Image](img/00066.jpeg)\n\
  \n缓冲区是 `ostream` 在与操作系统通信时内部用于存储你提供的数据的数据结构。如果你注意到向 `ostream` 写入内容与字符出现在目标地之间有“延迟”，通常是因为它们仍在缓冲区中。缓冲对于性能至关重要，而当你处理大量数据时，性能也是至关重要的。\n\
  \n![Image](img/00005.jpeg)\n\n### 一个 istream\n\n*   将字符序列转换为各种类型的值\n*   从某处获取这些字符（例如控制台、文件、主内存或另一台计算机）\n\
  \n我们可以这样图形化地表示 `istream`：\n\n![Image](img/00067.jpeg)\n\n与 `ostream` 一样，`istream`\
  \ 也使用缓冲区与操作系统通信。对于 `istream`，缓冲对用户来说可能是相当明显的。当你使用连接到键盘的 `istream` 时，你输入的内容会留在缓冲区中，直到你按下回车（返回/换行），你可以使用退格键（Backspace）来“改变主意”（直到你按下回车为止）。\n\
  \n输出的主要用途之一是为人类阅读产生数据。考虑电子邮件、学术文章、网页、账单记录、业务报告、联系列表、目录、设备状态读数等。因此，`ostreams` 提供了许多格式化文本的功能以适应各种口味。同样，许多输入是由人类编写的或者是为了方便人类阅读而经过格式化的。因此，`istreams`\
  \ 提供了读取 `ostreams` 生成输出的功能。我们将在 §11.2 中讨论格式化，并在 §11.3.2 中讨论如何读取非字符输入。与输入相关的大部分复杂性都与如何处理错误有关。为了能够给出更真实的例子，我们将开始讨论\
  \ `iostream` 模型如何与数据文件相关。\n\n## 10.3 文件\n\n我们拥有的数据比计算机主内存能容的多得多，因此我们将大部分数据存储在磁盘或其他大容量存储设备上。这些设备还具有一个良好的特性，即掉电后数据不会消失——数据是持久的。在最基础的层，文件仅仅是一段从\
  \ 0 开始向上编号的字节序列：\n\n![Image](img/00005.jpeg)![Image](img/00068.jpeg)\n\n文件有一种格式；也就是说，它有一组决定字节含义的规则。例如，如果我们有一个文本文件，前\
  \ 4 个字节将是前四个字符。另一方面，如果我们有一个使用整数二进制表示的文件，那么这相同的前 4 个字节将被视为第一个整数的（二进制）表示（参见 §11.3.2）。格式对于磁盘上的文件起的作用与类型对于主内存中的对象起的作用相同。当我们知道文件的格式时（且仅当知道格式时），我们才能理解文件中的位（参见\
  \ §11.2–3）。\n\n对于文件，`ostream` 将主内存中的对象转换为字节流并写入磁盘。`istream` 则执行相反的操作；也就是说，它从磁盘获取字节流并由它们组合成对象：\n\
  \n![Image](img/00005.jpeg)![Image](img/00069.jpeg)\n\n大多数时候，我们假设这些“磁盘上的字节”实际上是我们的常用字符集中的字符。情况并非总是如此，但我们可以应付过去，而且处理其他表示并不困难。\n\
  \n要读取文件，一个 ostream 必须：\n1. 知道它的名字\n2. 打开它（为了读取）\n3. 读取\n4. 关闭它（尽管这通常是自动完成的）\n\n\
  要写入文件，我们必须：\n1. 命名\n2. 打开它（为了写入）\n3. 写出\n4. 关闭它（尽管这通常是自动完成的）\n\n我们已经知道读写的基础，因为连接到文件的\
  \ `ostream` 的行为与我们所做的对 `cout` 完全一致，而连接到文件的 `istream` 的行为与我们所做的对 `cin` 完全一致。\n\n\
  ## 10.4 打开文件\n\n如果你想从文件读取或写入文件，你必须专门该文件打开一个流。`ifstream` 是用于从文件读取的 `istream`，`ofstream`\
  \ 是用于向文件写入的 `ostream`，而 `fstream` 是可以用于读写的 `iostream`。在使用文件流之前，必须将其连接到文件。例如：\n\n\
  ![Image](img/00006.jpeg)\n\n点击此处查看代码图像\n\n```cpp\ncout << \"Please enter file name:\
  \ \";\nstring iname;\ncin >> iname;\nifstream ist {iname}; // ist 是名为 iname 的输入流\n\
  if (!ist) error(\"can't open input file \",iname);\n```\n\n使用字符串定义 `ifstream` 会打开该文件进行读取。测试检查文件是否已正确打开。之后，我们可以像从任何其他\
  \ `istream` 一样从文件中读取内容。例如，假设输入运算符 `>>` 已经为 `Point` 类型定义，我们可以写：\n\n```cpp\nvector<Point>\
  \ points;\nfor (Point p; ist>>p; ) {\n    points.push_back(p);\n}\n```\n\n输出到文件由\
  \ `ostreams` 以类似的方式处理。例如：\n\n点击此处查看代码图像\n\n```cpp\ncout << \"Please enter name of\
  \ output file: \";\nstring oname;\ncin >> oname;\nofstream ost {oname}; // ost 是名为\
  \ oname 的输出流\nif (!ost) error(\"can't open output file \",oname);\n```\n\n\n\n\n\
  \n点击此处查看代码图像\n\n```cpp\nfor (int p : points)\n    ost << '(' << p.x << ',' << p.y\
  \ << \")\\n\";\n```\n\n当文件流超出作用域时，它关联的文件会被关闭。当文件关闭时，其关联的缓冲区会被“刷新”（flushed）”，也就是说，缓冲区中的字符会被写入文件。\n\
  \n通常情况下，最好的做法是在程序早期（在任何正式计算之前）打开文件。毕竟，如果做了大量工作后却发现因为没有地方写入结果而无法完成任务，那是极大的浪费。\n\n\
  最理想的做法是：在创建 `ostream` 或 `istream` 的过程中隐式地打开文件，并依靠流的作用域来处理文件的关闭。例如：\n\n点击此处查看代码图像\n\
  \n```cpp\nvoid fill_from_file(vector<Point>& points, string& name)\n{\n    ifstream\
  \ ist {name};           // 以读取模式打开文件\n    if (!ist) error(\"can't open input file\
  \ \",name);\n    // . . . 使用 ist . . .\n    // 当离开函数时，文件会被隐式关闭\n}\n```\n\n![Image](img/00007.jpeg)\n\
  \n你也可以执行显式的 `open()` 和 `close()` 操作（§B.7.1）。然而，依靠作用域可以最大限度地减少在文件流附加到流之前或关闭之后尝试使用该文件流的概率。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nifstream ifs;\n// . . .\nifs >> foo; // 无法成功：ifs 没有打开文件\n\
  // . . .\nifs.open(name,ios_base::in);    // 读取读取打开名为 name 的文件\n// . . .\nifs.close();\
  \                   // 关闭文件\n// . . .\nifs >> bar; // 无法成功：ifs 的文件已关闭\n// . . .\n\
  ```\n\n在现实代码中，这些问题通常更难发现。幸运的是，你无法在不先关闭文件流的情况下再次打开它。例如：\n\n点击此处查看代码图像\n\n```cpp\n\
  fstream fs;\nfs.open(\"foo\", ios_base::in) ;   // 打开以输入\n// 缺少 close()\nfs.open(\"\
  foo\", ios_base::out);  // 无法成功：fs 已经打开\nif (!fs) error(\"impossible\");\n```\n\n\
  不要忘记在打开流后对其进行测试。\n\n为什么你要显式地使用 `open()` 或 `close()` 呢？嗯，偶尔文件连接的寿命并不方便地受作用域限制，所以你必须这样做。但这种情况非常罕见，不至于让我们在这里担心它。更重要的是，你发现在某些使用其他语言和库风格的人编写的代码中会有这种用法，这些语言没有\
  \ `iostreams`（以及 C++ 标准库的其他部分）所使用的作用域模式。\n\n正如我们在第 11 章 中将看到的，文件还有很多内容，但目前我们已经有了足够的知识将其作为数据源和数据终点。这将允许我们编写程序，如果假设用户必须直接输入所有输入，这些程序是不现实的。从程序员的角度来看，文件的一个巨大优势是，你可以在调试期间反复读取它。\n\
  \n### 10.5 读取和写入文件\n\n考虑你可能如何从文件中读取一组结果并将它们表示在内存中。这些可能是气象站的温度读数：\n\n0 60.7\n1 60.6\n\
  3 59.2\n...\n\n该数据文件包含一系列 `hour,temperature` 对。小时编号为 0 到 23，温度单位为华氏度。不假设任何进一步的格式；也就是说，文件不包含任何页头信息（例如读取发生的位置）、数值的单位、标点符号（如每对周围的括号）或结束标记。这是最简单的情况。\n\
  \n我们可以用 `Reading` 类型来表示温度读数：\n\n点击此处查看代码图像\n\n```cpp\nstruct Reading {        //\
  \ 一个温度读数\n    int hour;           // 午夜后的小时 [0:23]\n    double temperature; // 华氏度\n\
  };\n```\n\n基于此，我们可以像这样读取：\n\n点击此处查看代码图像\n\n```cpp\nvector<Reading> temps; // 将读数存储在这里\n\
  int hour;\ndouble temperature;\nwhile (ist >> hour >> temperature) {\n    if (hour\
  \ < 0 || 23 <hour) error(\"hour of range\");\n    temps.push_back(Reading{hour,temperature});\n\
  }\n```\n\n这是一个典型的输入循环。名为 `ist` 的 `istream` 可以是一个输入文件（如上一节所示的 `ifstream`）、标准输入流（`cin`\
  \ 的别名）或其他种类的 `istream`。对于此类代码，`istream` 确切来自哪里并不重要。我们的程序关心的是 `istream` 获取的数据是否符合预期的格式。下一节将讨论如何检测错误以及在输入错误后我们可以做什么。\n\
  \n写入文件通常比读取文件简单。再次，一旦流初始化，我们就可以像使用其他 `ostream` 一样使用输出文件 (`ofstream`)）。例如，我们可能想带括号输出每对数值：\n\
  \n点击此处查看代码图像\n\n```cpp\nfor (int i=0; i<temps.size(); ++i)\n    ost << '(' << temps[i].hour\
  \ << ',' << temps[i].temperature << \")\\n\";\n```\n\n生成的程序将读取原始温度读数文件并产生带有 `(hour,temperature)`\
  \ 格式的新文件。![Image](img/00006.jpeg)\n\n由于文件流超出作用域时会自动关闭文件，完整的程序变为：\n\n点击此处查看代码图像\n\
  \n```cpp\n#include \"std_lib_facilities.h\"\n\nstruct Reading {        // 一个温度读数\n\
  \    int hour;           // 午夜后的小时 [0:23]\n    double temperature; // 华氏度\n};\n\n\
  int main()\n{\n    cout << \"Please enter input file name: \";\n    string iname;\n\
  \    cin >> iname;\n    ifstream ist {iname}; // 从名为 iname 的文件读取\n    if (!ist)\
  \ error(\"can't open input file \",iname);\n    cout << \"Please enter output file:\
  \ \";\n    string oname;\n    cin >> oname;\n    ofstream ost {oname}; // 向名为 oname\
  \ 的文件写入\n    if (!ost) error(\"can't open output file \",oname);\n    vector<Reading>\
  \ temps; // 将读数存储在这里\n    int hour;\n    double temperature;\n    while (ist >>\
  \ hour >> temperature) {\n        if (hour < 0 || 23 <hour) error(\"hour of range\"\
  );\n        temps.push_back(Reading{hour,temperature});\n    }\n    for (int i=0;\
  \ i<temps.size(); ++i)\n        ost << '(' << temps[i].hour << ',' << temps[i].temperature\
  \ << \")\\n\";\n}\n```\n\n\n\n\n遗憾的是，`fail()` 和 `bad()` 之间的区别并没有精确定义，对于为新类型定义 I/O\
  \ 操作的程序员来说，也存在着不同看法。不过基本思想很简单：如果输入操作遇到一个简单的格式错误，它会令流进入 `fail()` 状态（假设你——我们输入操作用户——也许能够恢复）。反之如果发生了什么真正的严重问题（例如磁盘读取损坏），则输入操作会让这个流通入\
  \ `bad()` （因为你除了放弃从该流获取数据的尝试之外几乎无能为力）。处于 `bad()'状态的流同时也一定是 'fail()’的。这引出了以下通用逻辑:\n\
  \n![插图](img/00005.jpeg)\n\n点击此处查看代码图片\n\n```cpp\nint i =0;\n\ncin >>i ;\n\nif (\
  \ ! cin）{ //(仅仅)当某次输入失败时才会执行到这里  \n     if(cin.bad()) error(\"cin is bad\");//数据已破坏:终止！\n\
  \    if ( Cin.eof()){\n         //不再有更多输出\n        //一系列输入的通常结束方式正是如此          \
  \           \n    }\n   if(Cin.fail () ) {           /流动遭遇意外情况)\n       Ci.Cear();\
  \               使其准备好接新值。\n      ))然后设法恢复)。\n}\n```\n\n这里的“!cin”可以理解为\" cin 并非良好态\"\
  ，或是 \"关于 CIN 的操作出了问题\",或\"Cins 的状态不是 good。“它与\"上述成功完成相反。”注意我们在处理 fail（）部分使用了 clear\
  \ 。当一个出错使我们可能想回复原状以便再次看到它上面的字符;而这一行为就经由 Clear 来完成 -此后.你的标结果已经优良。\n\n下面举一示例说明如何运用这些指标：\n\
