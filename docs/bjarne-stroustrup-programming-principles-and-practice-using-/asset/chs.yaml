  \n\n\n\n\n- **派生**：一种从一个类构建另一个类的方式，使得新类可以替代原始类的使用。例如，`Circle` 派生自 `Shape`，换句话说，“圆形是一种形状”或者“形状是圆形的基类”。派生类（此处为\
