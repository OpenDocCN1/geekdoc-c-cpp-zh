  - **直接表达思想** (Direct expression of ideas)\n- **抽象层次** (Abstraction level)\n- **模块化**\
  \ (Modularity)\n- **一致性与极简主义** (Consistency and minimalism)\n\n![Image](img/00005.jpeg)\n\
  \n理想是为了被使用的。它们是思考的工具，而非仅仅为了取悦管理者和考官而搬出的花哨短语。我们的程序应当趋近于我们的理想。当我们在程序中遇到困难时，应后退一步审视问题是否源于对某些理想的偏离；这有时会有所帮助。当我们评估一个程序（最好是在交付给用户之前）时，我们寻找那些可能在将来引发问题的、与理想的偏离之处。\n\
  \n要尽可能广泛地应用这些理想，但请记住：实际问题（例如性能和简易性）以及语言本身的缺陷（没有完美的语言），往往会阻止你实现比“对理想的良好逼近”更好的结果。\n\
  \n![Image](img/00006.jpeg)\n\n在做具体的技术决策时，这些理想可以为我们指引方向。例如对于一个库中的接口设计问题：\n\n```\n\
  我们不能孤立地为每个接口单独决定所有细节 (§14.1)。\n```\n\n这样做的结果是混乱不堪的。\n取而代之的是：\n>我们必须回到根本原则上来——先明确这个特定库的核心价值所在，\n\
  然后推出一套一致的接口。\n最理想的情况是：\n在文档和代码注释中阐明我们对那个特定设计方案所做的取舍权衡。\n\n\n### ![图例标记]<br/>*项目启动阶段的行为指南*\n\
  \n###### • *正确性*\n诚然定义一个术语的具体含义并不容易完成完整任务的一部分重要内容就是明确定义范畴内的语义限定范围通常情况下由他人为某个给定项目的正确定性做出解释而我们则需要诠释并执行这一解释标准流程\n\
  &nbsp; <!-- keeping the blank as placeholder mapping -->\n\n• *可维护性*(Maintainability)：每一个成功的软件在其生命周期内都会被改变适应新硬件及软件的升级扩展添加功能同时还需要修正潜在的新出现错误以下关于结构化编程理念的部分主要针对此要求进行阐述;\n\
  \n• *(相对)性能指标\"效率\"(Performance)，指提供足以符合目标需求的运行速率标准的观点往往将所谓高效编码等同于底层操作且认为高质量的高层架构必然导致低效相反根据经验我们发现遵循推荐的设计理论和实践路径反而能获得令人满意的实时表现例子如\
  \ STL —这也是一段能够兼顾高层宏大结构设计与极高运算速度的优秀案例如果过分迷恋微末低级设置忽略全局大局同样也可造成整体效能欠佳反之亦然；\n\n• “按时发布”(On-time\
  \ delivery):推迟交付出完美作品一年通常是不切实际的公众理所当然会有超乎寻常预期作为行业人员有责用合理时间输出可靠源码虽然存在着一种模糊印象即按期交货意味着粗制滥造但从多个实际案例表明注重系统框架的资源调度管理器不变量的保证对外访问的功能定义也归结测试体系便于验证并且充分利用专用于某场景封装性的函数工具集则是确保不拖延死线的重要帮助手段\
