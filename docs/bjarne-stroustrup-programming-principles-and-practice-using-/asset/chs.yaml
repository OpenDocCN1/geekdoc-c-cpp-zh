  \ 的字符串参数通常源自文件（例如日志文件）或键盘。同样，我们在 `my_code()` 中组合的消息最终会被写入到屏幕的某个区域。例如，在 §11.7 中，我们使用字符串流过滤掉输入中不需要的字符。因此，字符串流可以被视为一种根据特殊需求和喜定制\
