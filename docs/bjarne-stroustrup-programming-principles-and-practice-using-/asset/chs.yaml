  \n![图像](img/00005.jpeg)\n\n\n\n你可以这样解释某个库的实用性：“它更符合数学逻辑”或者“它能让你免于编写那些为每个元素操作而写的循环代码”。无论哪种方式，最终生成的代码都会显著缩短，并且出错的机会也更少。诸如复制、赋值给所有元素以及针对全体元素的运算等\
  \ `Matrix` 操作，让我们无需再阅读或编写循环（也不必纠结我们是否把循环写对了）。\n\n`Matrix` 支持两个构造函数用于将内置数组的数据复制到\
  \ `Matrix` 中。例如：\n\n```\nvoid some_function(double* p, int n)\n{\n    double val[]\
  \ = {1.2, 2.3,  3 .4 ,  4 .5 };\n    Matrix<double> data(p,n);\n    Matrix<double>\
