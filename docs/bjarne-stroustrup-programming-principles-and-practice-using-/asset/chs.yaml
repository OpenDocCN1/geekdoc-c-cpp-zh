  \ 的内容在 1.5.3 标题下反复出现），作为高级工程师，我为您提取了逻辑核心内容。以下是完整的剩余部分翻译：\n\n由于我的电话是如何找到你的？声音是如何传输的？声音是如何编码成数据包的？这些答案可以填满许多比本书更厚的书，但它涉及到散布各地的数百台计算机的硬件和软件。如果你运气不好，通信卫星（本身也是计算机化的）也参与其中——不幸的是我们无法完美补偿进入太空的万公里绕路；光速（因此是你声音的速度）是有限的（光电缆要好得多：更短、更快、容量更大）。大部分工作运行良好；骨干通信系统的可靠性为\
  \ 99.999%（例如，每年`365*24*60`分钟内停机 20 分钟）。问题通常出现在移动电话与最近电话交换机之间的通信。\n\n有软件用于连接电话、将我们的话语切成数据包通过电缆和无线链路发送、路由这些消息、从各种故障中恢复、持续监控服务的质量和可靠性，当然还有用于计费。即使跟踪系统中所有的物理部件也需要大量的精巧软件：什么与什么连接？新系统需要哪些部分？什么时候需要进行预防性维护？\n\
  \n可以说，由半独立但相互连接的系统组成的全球骨干通信系统是世界上最大、最复杂的人造物体。为了让事情变得更真实：记住，这不仅仅是带了一些新花样的老旧电话业务。各种基础设施已经融合。它们也是互联网（网页网）运行的基础，是我们银行和交易系统运行的基础，也是将我们的电视节目输送到广播站的媒介。因此，我们可以增加几张照片来说明通信：\n\
  \n![Image](img/00013.jpeg)\n\n这个房间是纽约华尔街美国证券交易所的“交易大”，地图是互联网骨干网部分的表示（完整的地图会太乱而无法使用）。\n\
  \n恰好的是，我们也喜欢数字摄影以及使用计算机绘制专业地图来使知识可视化。\n\n\n\n\n\n### 1.5.4 医学\n\n这两张照片展示了一台 CT（计算机轴层扫描）扫描仪和一个计算机辅助手术的手术室（也称为“机器人辅助手术”或“机器人手术”）：\n\
  \n![Image](img/00014.jpeg)\n\n考虑计算机和软件在这里发挥关键作用的地方。扫描仪基本上就是计算机；它们发出的脉冲由计算机控制，而且在应用了非常复杂的算法将它们转换为我们能够识别的人体相关部位（三维）图像之前，这些读取结果无异于乱码。要进行计算机手术，我们必须更进一步几步。使用多种成像技术让外科医生能够看到患者的内部，以比通常情况下更大的放大倍数或更好的光线观察手术位点。在计算机的帮助下，医生可以使用精细到人手无法握的工具，或者在人手无法进行不必要的切割就能触及的地方进行操作。微创手术（腹镜手术）的使用就是其中的一个简单例子，它减少了数百人的痛苦和康复时间。计算机还可以帮助稳定医生的“手”，从而允许比通常情况下更精细的工作。最后，“机器人”系统可以进行远控操作，从而让医生能够远程（通过互联网）帮助他人。涉及的计算机和编程是极其惊人的、复杂且有趣的。单是用户界面、设备控制和成像挑战，就能让成千上万的研究人员、工程师和程序员忙碌几十年。\n\
  \n我们听说过一群医生之间在讨论哪种新工具对他们的工作提供了最大的帮助：CT 扫描仪？MRI 扫描仪？自动血液分析机？高分辨率超声机？PDA（个人数字助理）？经过一番讨论，这场“竞争”中出现了一个意外的“冠军”：快速访问患者记录。了解患者的病史（早期的疾病、之前尝试过的药物、过敏史、遗传问题、总体健康状况、当前药物等）简化了诊断问题并最大限度地减少了错误概率。\n\
  \n### 1.5.5 信息\n\n这两张照片展示了一台普通的 PC（或者说是两台）和服务器集群的一部分：\n\n![Image](img/00015.jpeg)\n\
  \n我们关注“小设备”是因为通常的原因：你无法看到、感觉到或听见软件。我们无法向你展示一张整洁程序的照片，所以我们向你展示一个运行该程序的“小设备”。然而，许多软件直接处理“信息”。因此，让我们考虑运行“普通软件”的“普通计算机”的“普通用途”。\n\
  \n“服务器集群”是提供网络服务的计算机集合。运行最先进服务器集群的机构（如 Google、亚马逊和微软）对其服务器的细节有些闭口如瓶，而且服务器集群的规格在不断变化（因此你在网络上找到的大多数信息都是过时的）。然而，这些规格是惊人的，足以说服任何人，编程远不仅仅是在笔记本电脑上简单地计算几个数字：\n\
  \n*   Google 在 25 到 50 个“数据中心”中使用约 100 万台服务器（每台都比你的笔记本电脑强大）。\n*   这样的数据中心位于一个面积可能达\
  \ 60m*100m（约 200ft*330ft）或更大的仓库内。\n*   2011 年，《纽约时报》报道，Google 的数据中心持续消耗约 2.6 亿瓦的电力（约与拉斯维加斯消耗的能量相当）。\n\
  *   假设一台服务器机器是 3GHz 四核，配备 24GB 主内存。这意味着具有约 12*10¹⁵Hz 的计算能力（每秒约 12,000,000,000,000,000\
  \ 条指令）和 24*10¹⁵ 字节的主内存（约 24,000,000,000,000,000 个 8 位字节），每台服务器可能还有 4TB 磁盘，提供 4*10¹⁸\
  \ 字节的存储。\n\n我们可能低估了这些数量，当你读到这里时，我们几乎肯定是如此。特别是减少能量消耗的努力似乎正在推动架构向每台服务器更多处理器和每个处理器更多核心的方向发展。GB\
  \ 是千兆字节，即约 `10⁹` 个字符。TB 是太字节，约是 1000GB，即约 `10¹²` 个字符。PB 是拍字节（即 `10¹⁵` 字节），正成为一种更常见的衡量标准。这是一个非常极端的例子，但每家主要公司都在网络上运行程序来与其用户/客户互动。例如亚马逊（书籍和其他销售）、安达信（航空票务和汽车租赁）和\
  \ eBay（在线拍卖）。数百万公司、组织和个人在网络上也存在。大多数人没有运行自己的软件，但许多人确实在运行，而且其中许多并非小事。\n\n另一种、更传统大规模计算工作涉及会计、订单处理、工资发放、记录保存、账单、库存管理、人事记录、学生记录、患者记录等——几乎每个组织（商业和非营利、政府和私营）都会保留的记录。这些记录是它们各自组织的支柱。作为一项计算工作，处理此类记录似乎很简单：大部分只是某些信息（记录）被存储和检索，对其做的处理极少。示例包括\n\
  \n*   我 12:30 飞往芝加哥的航班还准时吗？\n*   Gilbert Sullivan 患过麻疹吗？\n*   Juan Valdez 订购的那台咖啡机发货了吗？\n\
  *   Sprat 在 1996 年买了什么种厨房椅？\n*   2012 年 8 月从 212 区号打了多少个电话？\n*   卖出的咖啡壶价格是多少？\n\n\
  涉及的数据库规模使得这些系统变得极其复杂。再加上对快速响应的需求（通常查询少于两秒）以及对准确性的要求（至少大多数时候）。如今，人们谈论 级数据（一个字节是存储一个字符所需的内存量）并不罕见。那是传统的“数据处理”，而且由于大多数数据库的访问现在通过网络界面实现。\n\
  \n这种计算机使用方式通常被称为信息处理。它关注数据——通常是大量数据。这导致了在数据组织和传输方面的挑战，并在如何以易理解的形式呈现海量数据方面存在着许多有趣的工作：“用户界面”是处理数据的一个非常重要的方面。例如，考虑分析一部古代文学作品（例如乔叟的《坎德伯雷故事》或塞万提的《堂吉霍德》），通过比较多个版本来确定作者到底写了什么。我们需要根据分析人员提供的各种标准对文本进行搜索，并以有助于发现要点的方式显示结果。考虑到文本分析，就会想到出版：今天，几乎每篇文章、书籍、手册、报纸等都是在计算机上制作的。设计支持良好的软件对于大多数人来说仍然是一个缺乏真正解决方案的问题。\n\
  \n### 1.5.6 俯视图\n\n有时有人称，古生物学家通过研究一根小骨头就能重建一条完整的恐龙，并描述其生活方式和自然环境。这可能是夸张的，但观察一个简单的制品并思考其内涵，这种想法确实有道理。考虑这张由\
  \ NASA 的火星探测器之一上的相机拍摄的火星景观：\n\n![Image](img/00016.jpeg)\n\n\n\n\n如果你想从事“火箭科学”，成为一名出色的程序员是途径之一。各种航天计划聘用了大量的软件设计人员，尤其是那些能够理解载载和无人航天计划所需的物理、数学、电气工程、机械工程、医学工程等基础知识的人。那两辆火星车在火星上行驶多年是我们文明最伟大的技术成就之一。其中`Spirit`传回了六年的数据，另一辆`Opportunity`在本书编写时仍在工作，并在\
  \ 2014 年 1 月将迎来在火星上的十周年。它们的预计设计寿命仅为三个月。\n\n照片通过单程传输延迟为 25 分钟的通信通道传输到地球；这需要大量的精巧编程和高级数学，以确保图像以最少的比特数传输且不丢失任何位。在地球上，随后使用算法对照片进行渲染，以恢复颜色并减少由于光学和电子传感器引起的失真。\n\
  \n火星车的控制程序当然也是程序——火星车会自主运行 24 小时，并遵循前一天从地球发送的指令。传输由程序管理。\n\n用于火星车、传输和图像重建的各种计算机的操作系统是程序，用于编写本章的应用程序也是如此。运行这些程序的计算机是使用`CAD/CAM`（计算机辅助设计和计算机辅助制造）程序设计和生产的。这些计算机的芯片是在使用精密工具建造的计算机化流水线上生产的，而这些工具在设计和制造中也使用了计算机（和软件）。这些长期建造过程的质量控制涉及复杂的计算。所有代码都是由人类用高级编程语言编写，并由编译器翻译成机器码，而编译器本身就是一个程序。许多程序通过\
  \ GUI 与用户交互，并使用输入/输出流交换数据。\n\n最后，大量的编程工作用于图像处理（包括火星车照片的处理）、动画和照片编辑（网络上流传着带有“火星人”的火星车照片版本）。\n\
  \n### 1.5.7 所以怎样？\n\n![Image](img/00006.jpeg)\n\n所有这些“花哨复杂”的应用程序和软件系统与学习编程以及使用`C++`有什么关系？联系在于，许多程序员确实在从事这类项目。这些正是优秀的编程可以帮助实现的内容。此外，本章使用的每个示例都涉及`C++`以及书中描述的至少某些技术。是的，MP3\
  \ 播放器、船只、风力涡轮机、火星以及人类基因组计划中都有`C++`程序。更多`C++`的应用，请访问 [www.stroustrup.com/applications.html](http://www.stroustrup.com/applications.html)。\n\
  \n## 1.6 程序员的理想\n\n![Image](img/00005.jpeg)\n\n我们对程序想要什么？与特定程序的特定功能相比，我们总的来说想要什么？我们想要`正确性`以及作为其中的`可靠性`。如果一个程序没有执行它应该做的事，或者没有以我们可以信赖的方式执行，它充其量只是一个严重的麻烦，最坏则是危险。我们希望它是`设计良好的`，能够很好地解决实际需求；如果一个程序做的事情与我们无关，或者它以一种让我们恼意的方式正确做了某事，那么它是否正确并不重要。我们还希望它是`负担得起的`；我可能更倾向于开罗斯斯莱斯或私人飞机而不是普通的交通工具，但除非我是万富翁，否则成本会影响我的选择。\n\
  \n![Image](img/00005.jpeg)\n\n这些是非程序员可以从外部欣赏的软件（小装置、系统）的方面。它们必须是程序员的理想，而且我们必须时刻记住它们，特别是在开发早期，如果我们想生产出成功的软件的话。此外，我们必须关注与代码本身相关的理想：我们的代码必须是`可维护的`；也就是说，它的结构必须让没写过它的人能够理解并进行修改。一个成功的程序会“活”很长时间（通常是几十年），并会被反复修改。例如，它会被移动到新硬件上，会被添加新功能，会被修改以使用新的\
  \ I/O 设施（屏幕、视频、声音），以使用新的自然语言进行交互等。只有失败的程序永远不会被修改。为了具有可维护性，程序相对于其需求必须是简单的，且代码必须直接代表所表达的意图。复杂性——简单性和可维护性的敌人——可能是问题固有的（在这种情况下我们只能处理它），但它也源于代码中对想法的糟糕表达。我们必须通过良好的编码风格尝试避免这一点——风格非常重要！\n\
  \n这听起来并不太困难，但事实如此。为什么？编程从本质上来说是简单的：只需告诉机器它应该做什么。那么为什么编程可能是最有挑战性的呢？计算机从本质上是简单的；它们只需要执行几次操作，例如两个数字相加，并根据两个数字的比较选择下一条执行指令。问题在于我们不希望计算机做简单的事。我们希望“机器”做一些困难到让我们想要帮助的事，但计算机是挑剔的、不留情的、愚笨的野兽。此外，世界比我们愿意相信的要复杂得多，所以我们并不真正知道请求的含义。我们只想要程序“这样做”，而不被技术细节困扰。我们还倾向于假设“常识”。不幸的是，常识在人类中并不常见，而在计算机中完全缺失（尽管某些良好的程序在特定情况下可以模拟）。\n\
  \n![Image](img/00005.jpeg)\n\n这种思维导致了“编程即理解”的想法：当你能为一个任务时，你就理解了它。相反，当你彻底理解一个任务时，你就能写一个程序来完成。换句话说，我们可以将编程视为理解一个主题的一部分。程序是我们对一个主题理解的精确表示。\n\
  \n当你编程时，你会花费大量时间尝试理解你试图自动化的任务。\n\n我们可以将程序的开发过程分为四个阶段：\n\n![Image](img/00005.jpeg)\n\
  \n- *分析*：问题是什么？用户想要什么？用户需要什么？用户能负担起什么？我们需要什么样的可靠性？\n- *设计*：我们如何解决问题？整体结构应该是怎样的？它由哪些部分组成？部分之间如何通信？系统如何与用户交互？\n\
  - *编程**：用代码表达问题的解决方案（设计）。编写代码以满足所有约束（时间、空间、金钱、可靠性等）。确保代码是正确且可维护的。\n- *测试**：通过系统的尝试确保系统在所有要求的情况下都能正常工作。\n\
  \n\n\n\n\n编程加测试通常被称为`implementation`（实现）。显然，将软件开发简单地分为四个部分的做法是一种简化。关于这四个主题中的每一个，都写有厚厚的著作，还有更多书籍讨论它们之间如何相互联系。需要注意的一个重要点是，这些开发阶段并不是独立的，也不会严格按照顺序发生。我们通常从`analysis`（分析）开始，但来自`testing`（测试）的`feedback`可以帮助改进`programming`；程序运行中的问题可能表明`design`（设计）存在问题；而处理`design`的过程可能会暗示`analysis`中此前被忽视的`problem`方面。实际使用系统通常会暴露`analysis`的缺陷。\n\
  \n![Image](img/00005.jpeg)\n\n## 反馈的关键概念\n\n这里的关键概念是`feedback`。我们从经验中学习，并根据所学的内容修改自己的行为。这对于有效的软件开发至关重要。对于任何大型项目，在开始之前，我们并不知道关于问题及其解决方案的所有信息。我们可以尝试通过`programming`来测试想法并获得`feedback`，但在开发早期，通过写下`design\
  \ ideas`（设计想法）、尝试这些`design ideas`以及在朋友身上进行场景测试来获取`feedback`更容易也更快。我们所知的最佳设计工具是`blackboard`（黑板）（如果你更喜欢化学气味而不是粉笔灰，请用`whiteboard`白板）。如果可能，永远不要独自设计！在向他人解释并尝试你的想法之前，不要开始`coding`（编码）。在面对键盘之前，先与朋友、同事、潜在用户等讨论`designs`和`programming\
  \ techniques`。仅仅通过尝试清晰地表达一个想法就能学到这么多东西，这真是令人惊讶。毕竟，程序无非是某些想法的（代码形式）表达。\n\n同样，当你实现程序遇到卡壳时，从键盘上移开目光。思考`problem`本身，而不是你不完整的解决方案。与人谈谈：解释你想做什么以及为什么行不通。通过仔细向某人解释`problem`，你经常能因此发现解决方案，这非常奇奇。如果没有必要，不要独自进行`debug`（调试程序错误）！\n\
  \n## 关注实现\n\n本书的重点是`implementation`，特别是`programming`。除了为你提供大量问题及其解决方案示例之外，我们并不教“解决问题”。解决问题很大程度上在于识别已知问题并应用已知的解决方案技术。只有当大多数子问题通过这种方式处理后，你才会有时间投入到令人兴奋且富有创造意的“跳跃思维”。因此，我们侧重于展示如何在代码中清晰地表达想法。\n\
  \n![Image](img/00005.jpeg)\n\n## 代码中想法的表达\n\n在代码中直接表达想法是`programming`的一个基本理想。这其实显而易见，但到目前为止我们缺少一些良好的示例。我们会反复回到这个问题。当我们代码中需要一个整数时，我们将其存储在`int`中，它提供了基本的整数操作。当我们想要一个字符串时，我们将其存储在`string`中，它提供了最基本的文本处理操作。在最基础的层面，理想是：当我们有一个想法、一个概念、一个实体——一个我们认为的“东西”、一个我们可以在`whiteboard`上画出来的东西、一个我们在讨论中提到的东西、一个我们的（非计算机科学）教科书中谈到的东西，那么我们就希望这个东西能以`named\
  \ entity`（命名实体，即`type` 类型）的形式存在于我们的程序中，并提供我们认为适合它的操作。如果我们想做数学，我们需要用于复数的`complex\
  \ type`和用于线性代数的`Matrix`类型。如果我们想做图形，我们需要`Shape`类型、`Circle`类型、`Color`类型以及`Dialog_box`（对话框）。当我们要处理数据流时（例如来自温度传感器），我们需要一个`istream`类型（`i`代表输入）。显然，每种此类类型都应该提供适当的操作且仅提供适当的操作。这些只是书中的几个例子。除此之外，我们还提供了工具和技术，让你构建自己的类型，以直接在程序中表示你想要的任何概念。\n\
  \n编程部分是实践，部分是理论。如果你只是实践派，你将产生不可扩展、不可维护的 hacks（临时方案）。如果你只是理论派，你将产生无法使用（或负担不起）的玩具。\n\
  \n关于`programming`理想的不同观点，以及一些通过通过`programming languages`工作对软件做出重大贡献的人，请参阅`第 22 章`，“理想与历史”。\n\
  \n### 复习\n\n复习题旨在引导你关注章节解释的核心思想。观察它们的一种方法是将其看作练习的补充：练习侧重于`programming`的实践方面，而复习题试图帮助你清晰地表达想法和概念。在这方面，它们类似于优秀的面试题。\n\
  \n**1.** 什么是软件？\n**2.** 为什么软件很重要？\n**3.** 软件在哪些地方很重要？\n**4.** 如果某些软件故障可能会什么问题？列举一些例子。\n\
  **5.** 软件在哪些地方起着重要作用？列举一些例子。\n**6.** 哪些与软件开发相关的工作？列举一些。\n**7.** 计算机科学和编程之间的区别是什么？\n\
  **8.** 在船的设计、建造和使用过程中哪些部分使用了软件？\n**9.** 什么是服务器农？\n**10.** 你在线上会进行哪些类型的查询？列举一些。\n\
  **11.** 软件在科学中有哪些用途？列举一些。\n**12.** 软件在医学中有哪些用途？列举一些。\n**13.** 软件在娱乐中有哪些用途？列举一些。\n\
  **14.** 我们期望良好的软件具有哪些通用属性？\n**15.** 软件开发者看起来是什么样子的？\n**16.** 开发的阶段有哪些？\n**17.**\
  \ 为什么软件开发可能很困难？列举原因。\n**18.** 哪些软件用途让生活更轻松？\n**19.** 哪些软件用途让生活更困难？\n\n### 术语\n\n\
  这些术语展示了`programming`和`C++`的基础词汇。如果你想理解人们对编程话题的讨论并表达你自己的想法，你应该知道这些词的意思。\n\n- `affordability`（负担得起）\n\
  - `analysis`（分析）\n- `blackboard`（黑板）\n- `CAD/CAM`\n- `communication`（通信）\n- `correctness`（正确性）\n\
  - `customer`（客户）\n- `design`（设计）\n- `feedback`（反馈）\n- `GUI`（图形用户界面）\n- `ideals`（理想）\n\
  - `implementation`（实现）\n- `programmer`（程序员）\n- `programming`（编程）\n- `software`（软件）\n\
  - `stereotype`（刻板印象）\n- `testing`（测试）\n- `user`（用户）\n\n### 练习\n\n**1.** 选取一个你每天都会做的活动（例如上课、吃晚餐或看电视）。列出计算机直接或间接参与其中的方式。\n\
  \n**2.** 选取一个职业，最好是你感兴趣或有一定了解的职业。列出该职业人士从事的涉及计算机的活动。\n\n**3.** 将你在练习 2 中的列表与一位选择了不同职业的朋友交换，并改进他的或她的列表。当你们都完成操作后，比较你们的结果。记住：开放式练习没有完美的答案；改进总是可能的。\n\
  \n**4.** 根据你自己的经验，描述一个没有计算机就无法完成的活动。\n\n\n\n\n\n## 5. 列出一份你直接使用过的程序（软件应用程序）列表。仅列出你明显与程序有交互的示例（例如在\
  \ MP3 播放器上选择新歌），而不要列出可能刚好涉及到计算机的情况（例如转汽车方向盘）。\n\n## 6. 列出十项人们从事的完全不涉及或间接涉及计算机的活动。这可能比你想象的要难！\n\
  \n## 7. 识别五项目前没有使用计算机但你认为未来某个时刻会使用的任务。为你选择的每项任务写几句话进行详细说明。\n\n## 8. 写一段说明（至少 100\
  \ 字，少于 500 字），解释你为什么想成为一名计算机程序员。相反，如果你确定自己不想成为程序员，请解释原因。无论何种情况，请给出深思熟虑、逻辑严密的论点。\n\
  \n## 9. 写一段说明（至少 100 字，少于 500 字），说明除了程序员之外，你还想在计算机行业扮演什么角色（无论“程序员”是否是你的首选）。\n\n\
  ## 10. 你认为计算机是否会发展成为有意识、会思考并能够与人类竞争的生物？写一个短段落（至少 100 字）来支持你的观点。\n\n## 11. 列出大多数成功程序员共同具备的一些特征。然后列出人们普遍认为程序员应该具备的一些特征。\n\
  \n## 12. 识别本章中提到的至少五种计算机应用程序，并挑选一个你认为最有趣且你将来最想参与的类型。写一个短段落（至少 100 字）解释你为什么选择这一个。\n\
  \n## 13. 存储 (a) 本页文本、(b) 本章、(c) 莎士的所有作品需要多少内存？假设一个字节内存存储一个字符，并尽量精确到 20% 的误差范围内。\n\
  \n## 14. 你的计算机有多大内存？主内存？？磁盘空间？\n\n# 后记\n\n我们的文明运行在软件之上。软件是一个具有前所未有的多样性和机会的领域，充满了有趣、对社会有用且能获利的工作。当你接触软件时，请以原则性且严肃的态度对待：你想要成为解决方案的一部分，而不是增加问题。\n\
  \n我们显然对渗透我们技术文明的软件范围感到敬畏。当然，并非所有的软件应用都在行善，但那是另一个话题了。在这里，我们想强调软件是无处不在的，我们日常生活中很大程度上依赖软件。这一切都是由像我们这样的人编写的。所有这里提到的、构建软件的科学家、数学家、工程师、程序员等，他们的起点都像你现在开始的一样。\n\
  \n![Image](img/00006.jpeg)\n\n现在，让我们回到学习编程所需技术技能的务实事务中。如果你开始怀疑这是否值得你所有的努力（大多数深思熟虑的人想过这个问题），请回来重读这一章、前言以及\
  \ `第 0 章`（“给读者的注”）的内容。如果你开始怀疑自己是否能应对这一切，请记住，数万人已成功地成为了胜任的程序员、设计师、软件工程师等。你也可以。\n\n\
  # 第一部分：基础\n\n## 2. Hello, World!\n\n“编程是通过编写程序学习的。”\n\n——布莱恩·柯森 (Brian Kernighan)\n\
  \n在这里，我们展示了一个能够实际发挥作用的最简单的 C++ 程序。编写这个程序的目的是：\n\n- 让你尝试你的编程环境\n- 让你初步感受如何让计算机为你完成工作\n\
  \n因此，我们引入了“程序”的概念，引入了使用编译器将程序从人类可读的形式转换为机器指令的思想，并最后执行这些机器指令。\n\n***\n\n- **2.1 程序**\n\
  - **2.2 经典的第一个程序**\n- **2.3 编译**\n- **2.4 链接**\n- **2.5 编程环境**\n\n***\n\n### 2.1\
  \ 程序\n\n要让计算机做某事，你（或其他人）必须精确地告诉它——用极其详的细节——做什么。这种对“做什么”的描述被称为 `程序`，而 `编程`（programming）则是编写和测试此类程序的活动。\n\
  \n在某种意义上，我们以前都编写过程序。毕竟，我们已经给过要完成的任务描述，例如“如何开车去最近的电影院”、“如何找到楼上的洗手间”以及“如何用微波炉加热食物”。这类描述与程序之间的区别在于精确程度：人类倾向于用常识来弥补糟糕的指令，但计算机不会。例如，“在走廊里右转，上楼梯，它会在你左侧”，这可能是对通往楼上洗手间的很不错的描述。然而，当你看这些简单的指令时，你会发现语法很粗糙且指令不完整。人类可以很容易弥补。例如，假设你坐在桌旁并询问去洗手间的路。（注：原文在此节包含了一些重复/乱码的句子，已根据“不修改语义”的规则予以保留）。\n\
  \n### 2.2 经典的第一个程序\n\n这是一个经典第一个程序的版本。它在你的屏幕上打印“Hello, World!”：\n\n```cpp\n// 这个程序向显示器输出消息“Hello,\
  \ World!”\n#include \"std_facilities.h\"\n\nint main() // C++ 程序从执行 main 函数开始\n\
  {\n    cout << \"Hello, World!\\n\"; // 输出“Hello, World!”\n    return 0;\n}\n```\n\
  \n将这段文本看作是我们提供给计算机执行的一组指令集，就像我们给厨师一份食谱让他们遵循，或者就像我们提供一份组装指令列表让新玩具工作一样。让我们讨论这个程序的每一行的作用，从这一行开始\n\
  \n```cpp\ncout << \"Hello, World!\\n\"; // 输出“Hello, World!”\n```\n\n这是实际上产生 `输出`\
  \ 的行。它打印字符 Hello, World! 随后是一个换行符；也就是说，在写入 Hello, World! 之后，光标将放在下一行的开头。`cursor`（光标）是一个闪烁的小字符或线条，显示你可以在哪里输入下一个字符。\n\
  \n\n\n\n在 C++ 中，字符串字面量用双引号（`\"`）界定；例如，`\"Hello, World!\\n\"` 是一个字符字符串。`\\n` 是一个表示换行的“特殊字符”。`cout`\
  \ 指的是一个标准输出流。使用输出运算符 `<<` “放入” `cout` 的字符将显示在屏幕上。`cout` 的读音为“see-out”，是“character\
  \ output stream”（字符输出流）的缩写。你会发现编程中缩写非常常见。自然，当你第一次看到并必须记住一个缩写时，它可能会让你有些困扰，但一旦你开始反复使用缩写，它们就会变成本能，并且对于保持程序文本简短且易于管理至关重要。\n\
  \n该行的末尾\n\n```cpp\n// output “Hello, World!”\n```\n\n是一个注释。在某一行中，写 `//` 标记（即两次字符\
  \ `/`，被称为“slash”斜杠） 后的任何内容都是注释。编译器会忽略注释，注释是为了给阅读代码的程序员编写的。在这里，我们使用注释来告诉你该行的开头实际上起了什么作用。\n\
  \n注释是为了描述程序想要做什么，并通常为无法直接在代码中表达的人类提供有用信息。从你代码的注释中受益最大的人可能是你自己——当你下周或明年回到这段代码时，你可能已经完全忘记了你为什么要那样写这段代码。所以，请良好地记录你的程序。在\
  \ §7.6.4 中，我们将讨论什么是良好的注释。\n\n![Image](img/00005.jpeg)\n\n程序是为两个受众编写的。自然，我们编写代码是为了计算机执行。然而，我们花费了大量时间阅读和修改代码。因此，程序员是程序的另一个受众。所以，编写代码也是人与人之间交流的形式。事实上，将代码的人类读者视为我们的主要受众是有合理的：如果他们（我们）觉得代码不够易于理解，那么代码就不可能变得正确。所以，请不要忘记：代码是给人读的——尽一切努力让它变得可读。无论如何，注释仅对人类读者有利；计算机不会看注释中的文本。\n\
  \n程序的第一行是一个典型的注释；它只是告诉的人类读者程序应该做什么：\n\n点击此处查看代码图像\n\n```cpp\n// 这个程序向显示器输出消息“Hello,\
  \ World!”\n```\n\n此类注释是有用的，因为代码本身说明了程序在做什么，而不是我们*想要*它做什么。此外，我们通常向人类解释（粗略地）程序应该做什么，要比我们用代码向计算机（详细地）表达出来要简练得多。通常，这样的注释是我们编写的程序的第一部分。即使没有别的了，它也提醒了我们正在尝试做什么。\n\
  \n下一行\n\n```cpp\n#include \"std_lib_facilities.h\"\n```\n\n是一个“#include 指令”。它指示计算机提供（即“包含”）来自一个名为\
  \ `std_lib_facilities.h` 文件的设施。我们编写该文件是为了简化 C++ 所有实现中可用设施（“C++ 标准库”）的使用。我们将在学习过程中解释它的内容。它是完全标准的\
  \ C++，但它包含了一些我们不希望在接下来的十几个章节中打扰你的细节。对于这个程序，`std_lib_facilities.h` 的重要性在于我们提供了标准的\
  \ C++ 流 I/O 设施。在这里，我们只使用了标准输出流 `cout` 及其输出运算符 `<<`。使用 `#include` 包含的文件通常带有后缀 `.h`，被称为头文件或[header\
  \ file]。头文件包含了我们在程序中使用的项定义，例如 `cout`。\n\n计算机如何知道从哪里开始执行程序？它寻找一个名为 `main` 的[函数]，并开始执行在其中找到的指令。这里是我们的“Hello,\
  \ World!”程序的 `main` 函数：\n\n点击此处查看代码图像\n\n```cpp\nint main()          // C++ 程序从执行函数\
  \ main 开始\n{\n    cout << \"Hello, World!\\n\";      // 输出 “Hello, World!”\n   \
  \ return 0;\n}\n```\n\n![Image](img/00005.jpeg)\n\n每个 C++ 程序必须有一个名为 `main` 的函数来告诉它从哪里开始执行。函数基本上是一系列命名的指令，供计算机按照它们编写的顺序执行执行。一个函数有四个部分：\n\
  \n- 一个*返回类型*，这里是 `int`（意思是“整数”），它指定了函数将向请求执行它的的人返回什么类型的结果（如果有的话）。`int` 是 C++ 中的一个保留字（*关键字*），所以\
  \ `int` 不能用作任何其他的名字（参见 §A.3.1）。\n- 一个*名称*，这里是 `main`。\n- 包含在括号内的*参数列表*（参见 §8.2），这里参数列表是空的。\n\
  - 一个用一对大括号 `{}` 包围的*函数体*，它列出了函数要执行的动作。\n\n```cpp\nint main() {\n    cout << \"Hello,\
  \ World!\\n\";\n    return 0;\n}\n```\n\n### 2.3 编译\n\n![Image](img/00005.jpeg)\n\
  \nC++ 是一种编译型语言。这意味着为了让程序运行，你必须首先将其从人类可读的形式翻译成机器可以“理解”的形式。这种翻译是由一个称为编译器 的程序完成的。你阅读和编写的内容被称为源代码或*程序文本*，而计算机执行的内容被称为*可执行文件*、*目标代码*或*机器代码*。通常，C++\
  \ 源代码文件具有后缀 `.cpp`（例如 `hello_world.cpp`）或 `.h`（如 `std_lib_facilities.h`），目标代码文件具有后缀\
  \ `.obj`（在 Windows 上）或 `.o`（Unix）。因此，单词 *code* 实际上是有歧义的，可能会引起混淆；只有在它的意思很明确时才谨慎使用。除非另有说明，否则我们用\
  \ *code* 来指“源代码”甚至是“除去注释的源代码”，因为注释真的只是为了我们人类，而生成目标代码的编译器是看不到它们的。\n\n编译器读取你的源代码并尝试理解你所写的内容。它检查你的程序语法是否正确，每个单词是否有定义的含义，以及是否存在任何可以在不实际执行程序的情况下检测到的明显错误。你会发现编译器对语法相当挑剔。遗漏程序的任何细节，如\
  \ `#include` 文件、分号或大括号，都会导致错误。同样，编译器对拼写错误完全零容忍。让我们通过一系列示例来说明这一点，每个示例都有一个小错误。每个错误都是我们经常犯的某种错误的示例：\n\
  \n\n\n\n点击此处查看代码图像\n\n```\n// no #include here\n\nint main()\n\n{\n    cout << \"\
  Hello, World!\\n\";\n    return 0;\n}\n```\n\n我们没有包含任何告诉编译器 `cout` 是什么的内容，所以编译器报错了。为了纠正这一点，让我们添加一个头文件：\n\
  \n点击此处查看代码图像\n\n```cpp\n#include \"std_facilities.h\"\n\nint main()\n{\n    cout\
  \ << \"Hello, World!\\n\";\n    return 0;\n}\n```\n\n遗憾的是，编译器再次报错了：我们拼写错了 `std_lib_facilities.h`。编译器还对此表示反对：\n\
  \n点击此处查看代码图像\n\n```cpp\n#include \"std_lib_facilities.h\"\n\nint main()\n{\n   \
  \ cout << \"Hello, World!\\n;\n\n    return 0;\n}\n```\n\n我们没有用 `\"` 来结束字符串。编译器也对此表示反对：\n\
  \n点击此处查看代码图像\n\n```cpp\n#include \"std_lib_facilities.h\"\n\ninteger main()\n{\n\
  \    cout << \"Hello, World!\\n\";\n    return 0;\n}\n```\n\nC++ 中使用的是缩写 `int` 而不是\
  \ `integer` 单词。编译器也不喜欢这一点：\n\n点击此处查看代码图像\n\n```cpp\n#include \"std_lib_facilities.h\"\
  \n\nint main()\n{\n    cout < \"Hello, World!\\n\";\n    return 0;\n}\n```\n\n我们使用了\
  \ `<`（小于运算符）而不是 `<<`（输出运算符）。编译器也对此表示反对：\n\n点击此处查看代码图像\n\n```cpp\n#include \"std_lib_facilities.h\"\
  \n\nint main()\n{\n    cout << 'Hello, World!\\n';\n    return 0;\n}\n```\n\n我们使用了单引号而不是双引号来界定字符串。最后，编译器为此给出了错误提示：\n\
  \n点击此处查看代码图像\n\n```cpp\n#include \"std_lib_facilities.h\"\n\nint main()\n{\n   \
  \ cout << \"Hello, World!\\n\"\n    return 0\n}\n```\n\n我们忘记用分号结束输出语句了。请注意，许多 C++\
  \ 语句都是以分号（`;`）结尾的。编译器需要这些分号来判断一条语句何时结束，另一条语句从哪里开始。目前还没有一种既简短、完全正确又非技术性的方法来总结哪里需要分号。目前，只需复制我们的使用模式即可，这可以总结为：“在每一个不以右大括号（`}`）结尾的表达式后面加上一个分号。”\n\
  \n为什么我们要花两页宝贵的空间和你宝贵的时间向你展示一个简单程序中的平凡错误示例呢？为了说明一点——你和所有的程序员一样，将花费大量时间在程序源码中寻找错误。大多数时候，我们都在看带有错误的文本。毕竟，如果我们确信某些代码是正确的，我们通常会在看其他代码，或者在休息时间。对于早期的计算机先驱者来说，发现自己会犯错并必须投入大部分时间来寻找错误，这让他们非常惊讶。这对于大多数编程初学者来说仍然是令人惊讶的。\n\
  \n![图像](img/00006.jpeg)\n\n当你编写程序时，有时会对编译器感到非常烦恼。它有时似乎对一些无关紧要的细节（如缺少分号）或你认为“显然正确”的事情表示抱怨。然而，编译器通常是正确的：当它给出错误信息并拒绝从你的源码生成目标代码时，你的程序确实有些不对劲；也就是说，你写的内容含义没有被\
  \ C++ 标准精确定义。\n\n![图像](img/00007.jpeg)![图像](img/00006.jpeg)\n\n编译器没有常识（它不是人类），而且对细节非常挑剔。由于它没有常识，你不希望它试图猜测你对某个“看起来没问题”但不符合\
  \ C++ 定义的东西是什么意思。如果它真的这样做，而且它的猜测与你的不一致……\n\n### 2.5 编程环境\n\n为了编程，我们使用编程语言。我们还使用编译器将源码翻译成目标代码，并使用链接器将我们的目标代码链接成可执行文件。\n\
  \n## 4 链接\n\n如果你在命令行窗口中工作（正如许多专业程序员那样），你必须亲自发出编译和链接命令。如果你使用 IDE（“交互式开发环境”或“集成开发环境”），正如许多专业程序员所做，只需点击正确的按钮即可完成工作。\n\
  \nIDE 通常包含一个编辑器，具有实用的功能，如颜色编码（帮助区分注释、关键字和程序源码的其他部分），以及其他帮助你调试、编译和运行代码的设施。调试是在程序中寻找错误的活动；在这一过程中你会听到很多关于这的内容。\n\
  \n配合本书学习，你可以使用任何提供最新的、符合标准的 C++ 实现的系统。我们所说的大部分内容经过微小修改后对所有 C++ 实现都有效，并且代码可以随处运行。在我们的工作中，使用了几种不同的实现。\n\
  \n### ![图像](img/00019.jpeg)练习\n\n到目前为止，我们讨论了编程、代码和工具（如编译器）。现在你必须让程序运行起来。这是本书中的关键点，也是学习编程的关键点。这是你开始培养实践技能和良好编程习惯的地方。\n\
  \n\n\n\n练习（drill）的目的是建立或强化你的实际编程技能，并让你熟悉编程环境工具。通常，一个练习是对单个程序进行的一系列修改，使其从一个完全微不足道的东西“成长”成一个可能在真实程序中有用的部分。传统的练习题（exercises）设计用于测试你的主动性、聪明程度或创造力。相比之下，练习不需要你投入太多创造力。通常情况下，顺序至关重要，而且每一个单独的步骤应该是简单的（甚至是微不足道的）。请不要试图耍小聪明跳过步骤；平均而言，这会减慢你的速度甚至让你感到困惑。\n\
  \n你可能认为你理解了读过的每一个字以及导师或老师告诉你的一切，但重复和练习对于培养编程技能是必要的。在这方面，编程就像体育、音乐、舞蹈或任何基于技能的工艺。想象一下人们在没有经常练习的情况下尝试参加这些任何领域的竞争，你知道他们的表现会如何。持续的练习——对于专业人士来说，这意味着一生的持续练习——是开发和保持高水平实践技能的唯一途径。\n\
  \n![Image](img/00007.jpeg)\n\n所以，无论你多么受诱，永远不要跳过练习；它们对学习过程至关重要。从第一步开始并继续，在进行的过程中测试每一步，以确保你的操作正确。\n\
  \n![Image](img/00006.jpeg)\n\n如果你不理解正在使用的语法的每一个细节，不要惊慌，也不要向老师或朋友寻求帮助。继续下去，完成所有的练习和许多习题，一切终将变得明朗。\n\
  \n所以，这里是你的第一个练习：\n\n**1.** 转到附录 C 并按照要求的步骤设置项目。创建一个名为 `hello_world` 的空控制台 C++ 项目。\n\
  \n**2.** 输入 `hello_world.cpp`，完全按照下文指定的，将其保存在你的练习目录（文件夹）中，并将其包含在你的 `hello_world`\
  \ 项目中。\n\n点击此处代码图像\n\n```cpp\n#include \"std_lib_facilities.h\"\n\nint main()  \
  \        // C++ 程序从执行 main 函数开始\n{\n    cout << \"Hello, World!\\n\";   // 输出 “Hello,\
  \ World!”\n    keep_window_open();          // 等待输入字符\n    return 0;\n}\n```\n\n\
  在某些 Windows 机器上需要调用 `keep_window_open()` 以防止窗口在你有机会读取输出之前就关闭。这是 Windows 的特性/功能，而不是\
  \ C++ 的。我们在 `std_lib_facilities.h` 中定义了 `keep_window_open()` 以简化编写简单的文本程序。\n\n你如何找到\
  \ `std_lib_facilities.h`？如果你在课程中，请询问你的老师。如果没有，请从我们的支持网站 [www.stroustrup.com/Programming](http://www.stroustrup.com/Programming)\
  \ 下载。但如果你没有老师且无法访问互联网怎么办？在这种情况下（仅），将 `#include` 指令替换为\n\n点击此处代码图像\n\n```cpp\n#include<iostream>\n\
  #include<string>\n#include<vector>\n#include<algorithm>\n#include<cmath>\n\nusing\
  \ namespace std;\n\ninline void keep_window_open() { char ch; cin>>ch; }\n```\n\n\
  这直接使用标准库，将支持你学习到第 5 章，并在稍后详细解释（§8.7）。\n\n**3.** 编译并运行“Hello, World!”程序。很有可能某些地方没有正常运行。在第一次使用新编程语言或新编程环境时，很少能成功。找到问题并修复它！在这里，向更有经验的人寻求帮助是明智的，但务必理解他们向你展示的内容，以便在继续之前能够独立完成。\n\
  \n**4.** 到现在，你可能已经遇到了一些错误并不得不纠正它们。现在是时候熟悉你的编译器的错误检测和错误报告功能了！尝试 §2.3 中的六个错误，看看你的编程环境如何反应。至少想五个你在输入程序时可能犯的错误（例如：忘记写\
  \ `keep_window_open()`、在输入单词时开启大写锁定键，或用逗号代替分号），并尝试每一种，看看尝试编译和运行这些版本时会发生什么。\n\n###\
  \ 复习\n\n![Image](img/00006.jpeg)\n\n这些复习题的基本目的是让你有机会看看你是否已经注意到并理解了本章的关键点。你可能需要参考文本来回答问题；这是正常且符合预期的。你可能需要重读整个章节；这也是正常的。\n\
  \n**1.** “Hello, World!”程序的目的是什么？\n**2.** 写出函数的组成部分。\n**3.** 写出一个一个在每个 C++ 程序中必须出现的函数名称。\n\
  **4.** 在“Hello, World!”程序中，`return 0;` 的目的是什么？\n**5.** `#include` 的目的是什么？\n**6.**\
  \ C++ 文件结尾的 `.h` 后缀表示什么？\n**7.** 链接器做什么？\n**8.** 源文件和对象文件有什么区别？\n**9.** 什么是 `IDE`？它做什么？\n\
  **10.** 如果你理解了教科书，为什么练习是必要的？\n\n### 术语\n\n这些术语介绍了编程和 C++ 的基础词汇。如果你想理解人们讨论编程话题并表达自己的观点，你应该知道每个词的含义。\n\
  \n- `//`\n- `<<`\n- `C++`\n- `comment`\n- `compiler`\n- `compile-time error`\n-\
  \ `cout`\n- `executable`\n- `function`\n- `header`\n- `IDE`\n- `#include`\n- `library`\n\
  - `linker`\n- `main()`\n- `object code`\n- `output`\n- `program`\n- `source code`\n\
  - `statement`\n\n### 习题\n\n我们将练习与习题分开列出；在尝试习题之前，始终完成章节练习。这样做可以为你节省时间。\n\n**1.**\
  \ 修改程序输出以下两行：\n\nHello, programming!\n\nHere we go!\n\n\n\n\n## 2. 在你所学的基础上，编写一个程序，列出计算机寻找楼上卫生间的指令（该内容在\
  \ §2.1 中讨论过）。你能想到任何人类认为理所当然但计算机不会认为的步骤吗？将它们加入到你的列表中。这是“像计算机一样思考”的一个良好开始。警告：对于大多数人来说，“去厕间”是一个完全足够的指令。但对于一个对房屋或卫生间毫无经验的人来说（想象一个某种方式传送到你餐厅的石器时代人），必要的指令列表可能会非常长。请不要超过一页。为了读者的方便，你可以对你所构的的房屋布局添加一段简短描述。\n\
  \n## 3. 描述一下如何从你的宿舍、公寓、房子（或其他地方）的前门到达教室门（假设你正在某所学校学习；如果不是，请选择另一个目标）。让一个朋友尝试遵循这些指令，并在过程中对改进建议进行注释。为了留住朋友，在将指令交给他们之前，对这些指令进行“实地测试”可能是个好主意。\n\
  \n## 4. 找一本好的食谱。阅读烘焙蓝莓松芬的指令（如果你所在的国家“蓝莓松芬”是一种奇怪、异域的菜肴，请用更熟悉的菜肴代替）。请注意，在一点帮助和指导下，世界上大多数人都能烘焙出美味的蓝莓松芬。这不被认为是高级或困难的精细烹饪。然而，对于作者来说，书中很少有练习像这道题一样困难。通过一点练习，你能做到的事情令人惊叹。\n\
  \n- 重写这些指令，使每个单独的动作都位于自己的编号段落中。小心列出每一步使用的所有配料和所有厨具。注意关键细节，例如所需的烤箱温度、预热烤箱、松芬模的准备、烹饪计时的方法，以及从烤箱中取出松芬时保护手的需要。\n\
  - 从烹饪新手的角度考虑这些指令（如果你不是新手，请向一个不会做饭的朋友帮助）。补全书中作者（几乎肯定是经验丰富的厨师）认为显而易见而省略的步骤。\n- 建立一个用到的术语词表。（什么是松芬模？预热有什么作用？你说的“烤箱”是指什么？）\n\
  - 现在烘焙一些松芬并享受你的成果。\n\n## 5. 为“术语”中的每个术语写一个定义。首先尝试在不看章节的情况下完成（这可能不像），然后翻阅章节寻找定义。你可能会发现你的第一次尝试与书中版本之间的差异很有趣。你可以咨询一些合适的在线词汇表，例如\
  \ `www.stroustrup.com/glossary.html`。在查找之前写下自己的定义，可以加强你通过阅读所获得的学习。如果你必须重读某节才能形成定义，这有助于你理解。可以随意使用你自己的话来定义，并尽可能详细写得你认为合理。通常，在主定义之后有一个示例会有帮助。你可能喜欢将定义存储在一个文件中，以便从后续章节的“术语”部分不断添加内容。\n\
  \n# 后记\n\n![Image](img/00005.jpeg)\n\n“Hello, World!”程序为什么重要？它的目的是让我们熟悉编程的基本工具。当我们接触新工具时，往往倾向于做一个极其简单的例子，比如“Hello,\
  \ World!”。这样，我们将学习分为两个部分：首先我们通过一个微小的程序学习工具的基础知识，之后我们学习更复杂的程序，而不会被工具分心。同时学习工具和语言比先学一个再学另一个要困难得多。这种通过将复杂任务分解为一系列较小（且更易管理）步骤来简化学习的方法不仅限于编程和计算机。它在生活的大多数领域都是常见且实用的，特别是在涉及某些实际技能的领域。\n\
  \n## 3. 对象、类型与值\n\n“命运青睐有准备的心灵。”\n\n—路易·帕斯德\n\n本章介绍了程序中存储和使用数据的基本知识。为此，我们首先专注于从键盘读取数据。在建立起对象、类型、值和变量的基本概念后，我们引入了几个运算符，并提供了许多\
  \ `char`、`int`、`double` 和 `string` 类型变量的使用示例。\n\n***\n\n### 3.1 输入\n### 3.2 变量\n\
  ### 3.3 输入与类型\n## 3.4 运算与运算符\n### 3.5 赋值与初始化\n### 3.5.1 一个示例：检测重复单词\n## 3.6 复合赋值运算符\n\
  ### 3.6.1 一个示例：查找重复单词\n### 3.7 命名\n### 3.8 类型与对象\n### 3.9 类型安全\n### 3.9.1 安全转换\n\
  ### 3.9.2 不安全转换\n\n***\n\n### 3.1 输入\n\n“Hello, World!”程序只是写入屏幕。它产生输出。它不读取任何内容；不获取输入。这相当无聊。真正的程序倾向于根据我们提供的输入产生结果，而不是每次执行都做相同的事情。\n\
  \n![Image](img/00005.jpeg)\n\n为了读取某些东西，我们需要一个读取的地方；也就是说，我们需要在内存中放置读取的内容。我们将这样的“地方”称为对象是一个具有类型的内存区域，该类型规定了可以放置的信息。命名的对象被称为*变量*。例如，字符字符串被放入\
  \ `string` 变量中，整数被放入 `int` 变量中。你可以将对象想象成“盒子”，可以在其中放入对象类型的值：\n\n![Image](img/00020.jpeg)\n\
  \n这将代表一个类型为 `int`、名为 `age`、值为整数 42 的对象。使用字符串变量，我们可以从输入读取一个字符串并像下面这样输出：\n\n点击此此处查看代码\n\
  \n```cpp\n// 读取并写入一个名字\n#include \"std_lib_facilities.h\"\n\nint main()\n{\n   \
  \ cout << \"请输入你的名字（按回车）：\\n\";\n    string first_name; // first_name 是一个 string\
  \ 类型的变量\n    cin >> first_name; // 将字符读入 first_name\n    cout << \"Hello, \" <<\
  \ first_name << \"!\\n\";\n}\n```\n\n`#include` 和 `main()` 在第 2 章中已经见过。由于我们所有的程序都需要\
  \ `#include`（直到第 12 章），我们在演示时省略它以避免分心。同样，我们有时会展示只有放在 `main()` 或其他函数中才能运行的代码，如下所示：\n\
  \n点击此此处查看代码\n\n```cpp\ncout << \"请输入你的名字（按回车）：\\n\";\n```\n\n我们假设你可以弄清楚如何将此类代码放入一个完整的程序进行测试。\n\
  \n\n\n\n\n`main()` 的第一行简单地输出一条消息，鼓励用户输入名字。这样的消息通常被称为*提示*（prompt），因为它在提示用户采取行动。接下来的几行定义了一个类型为\
  \ `string`、名为 `first_name` 的变量，从键盘读取输入到该变量，并输出一条问候语。让我们依次来看这三行：\n\n点击此处查看代码图片\n\n\
  ```cpp\nstring first_name;     // first_name 是一个 string 类型的变量\n```\n\n这为存储字符字符串预留了内存区域，并将其命名为\
  \ `first_name`：\n\n![Image](img/00021.jpeg)\n\n在程序中引入新名称并为变量分配内存的语句被称为*定义*（definition)。\n\
  \n下一行从输入（键盘）将字符读入该变量中：\n\n点击此处查看代码图片\n\n```cpp\ncin >> first_name;     // 将字符读入\
  \ first_name\n```\n\n名称 `cin` 指的是标准库中定义的标准输入流（读作“see-in”，意为“character input”）。`>>`\
  \ 运算符的第二个操作数（“get 从”）指定了该输入的去向。因此，如果我们输入一个名字，比如 Nicholas，然后跟一个换行符，字符串 \"Nicholas\"\
  \ 就会成为 `first_name` 的值：\n\n![Image](img/00022.jpeg)![Image](img/00006.jpeg)\n\n\
  换行符是为了引起机器的注意。在输入换行符（按下 Enter 键）之前，计算机只是在收集字符。这种“延迟”让你有机会在按下 Enter 键之前改变主意、删除某些字符并将其替换为其他字符。换行符不会是存储在内存中的字符串的一部分。\n\
  \n获取输入字符串到 `first_name` 后，我们就可以使用它了：\n\n点击此处查看代码图片\n\n```cpp\ncout << \"Hello, \"\
  \ << first_name << \"!\\n\";\n```\n\n这会在屏幕上打印 Hello，随后是 Nicholas（`first_name` 的值），然后是\
  \ ! 和一个换行符（`'\\n'`）：\n\nHello, Nicholas!\n\n如果我们喜欢重复和额外的输入，本可以写三个独立的输出语句：\n\n```cpp\n\
  cout << \"Hello, \";\ncout << first_name;\ncout << \"!\\n\";\n```\n\n然而，我们是不愿打字的人，而且更重要的是——我们强烈反感无谓重复（因为重复会产生错误），所以我们将这三个输出操作合并成了一条语句。\n\
  \n注意我们在 \"Hello, \" 的字符周围使用了引号，但在 `first_name` 周围没有。当我们想要一个字面量字符串（literal string）时，我们使用引号。当我们不加引号时，我们指的是具有某个名称的值。考虑一下：\n\
  \n点击此处查看代码图片\n\n```cpp\ncout << \"first_name\" << \" is \" << first_name;\n```\n\
  \n在这里，“first_name\" 给了我们十个字符 `first_name`，而普通的 `first_name` 给了我们变量 `first_name`\
  \ 的值，在本例中是 Nicholas。所以，我们得到了：\n\nfirst_name is Nicholas\n\n### 3.2 变量\n\n![Image](img/00005.jpeg)\n\
  \n基本上，如果不在内存中存储数据（就像我们在上面的示例中处理输入字符串那样），我们就无法计算机做任何有意义的事。我们存储数据的“地方”被称为*对象*（objects）。要访问对象我们需要一个*名称*（name）。命名的对象被称为*变量*（variable），并有一个特定的*类型*（type，如\
  \ `int` 或 `string`），类型决定了可以放入对象中的内容（例如，`123` 可以放入 `int`，\"Hello, World!\\n\" 可以放入\
  \ `string`）以及可以应用哪些操作（例如，我们可以使用 `*` 运算符将整数相乘，并使用 `<=` 运算符比较字符串）。我们放入变量中的数据项被称为*值*（values）。定义变量的语句（意不意外地）被称为*定义*，而且一个定义可以（并且通常应该）提供一个初始值。考虑一下：\n\
  \n```cpp\nstring name = \"Annemarie\";\nint number_of_steps = 39;\n```\n\n你可以这样可视化这些变量：\n\
  \n![Image](img/00023.jpeg)\n\n你不能将错误类型的值放入变量中：\n\n点击此处查看代码图片\n\n```cpp\nstring name2\
  \ = 39;                  // 错误：39 不是字符串\nint number_of_steps = \"Annemarie\";  //\
  \ 错误：“Annemarie”不是整数\n```\n\n编译器记得每个变量的类型，并确保你按照其定义中指定的类型来使用它。\n\nC++ 提供了相当数量的类型（参见\
  \ §A.8）。然而，你只需要使用其中五种就可以编写完美的程序：点击此处查看代码图片\n\n```cpp\nint number_of_steps = 39;\
  \      // int 整数\ndouble flying_time = 3.5;       // double 浮点数\nchar decimal_point\
  \ = '.';      // char 字符\nstring name = \"Annemarie\";     // string 字符串\nbool tap_on\
  \ = true;             // bool 布尔值\n```\n\n`double` 这个名字是有历史原因的：`double` 是 double-precision\
  \ floating point（双精度浮点数）的缩写。浮点数是计算机对实数概念的近似。\n\n注意这些这些类型都有自己的字面量样式：点击此处查看代码图片\n\n\
  ```cpp\n39      // int：整数\n3.5     // double：浮点数\n'.'     // char：单个字符\n\"Annemarie\"\
  \ // string：字符序列\ntrue    // bool：真或假\n```\n\n即，数字序列（例如 `1234`、`2` 或 `976`）表示整数，单引号内的单个字符（例如\
  \ `'1'`、`'@'` 或 `'x'`）表示字符，带小数点的数字序列（例如 `1.234`、`.12` 或 `.98`）表示浮点值，而双引号内的字符序列（例如\
  \ `\"1234\"`、`\"Howdy!\"` 或 `\"Annemarie\"`）表示字符串。有关字面量的详细描述参见 §A.2。\n\n### 3.3\
  \ 输入与类型\n\n![Image](img/00005.jpeg)\n\n输入操作 `>>`（“从”）对类型敏感；也就是说，它根据你读取的变量类型来进行读取。例如：点击此处查看代码图片\n\
  \n```cpp\n// 读取名字和年龄\nint main()\n{\n    cout << \"Please enter your first name\
  \ and age\\n\";\n    string first_name;      // string 变量\n    int age;        \
  \        // 整数变量\n    cin >> first_name;      // 读取字符串\n    cin >> age;        \
  \     // 读取整数\n    cout << \"Hello, \" << first_name << \" (age \" << age << \"\
  )\\n\";\n}\n```\n\n因此，如果我们输入 Carlos 22，`>>` 运算符会将 Carlos 读入 `first_name`，将 22 读入\
  \ `age`，并产生如下输出：\n\nHello, Carlos (age 22)\n\n为什么它不会将（整个）Carlos 22 读入 `first_name`\
  \ 呢？因为惯例，字符串的读取由所谓的*空白*字符（whitespace）终止，即空格、换行符和制表符。否则，空白字符默认会被 `>>` 忽略。例如，你可以在读取的数字之前添加任意数量的空格；`>>`\
  \ 将直接跳过它们并读取数字。\n\n\n\n\n如果你输入 `22 Carlos`，你会看到一个可能让你惊讶的结果，直到你仔细思考一下。`22` 会被读入 `first_name`，因为毕竟，`22`\
  \ 也是一个字符序列。另一方面，`Carlos` 不是一个整数，所以它不会被读取。输出将是 `22` 后面跟着（`age` 加上某个随机数，例如 –96739\
  \ 或 0）。为什么呢？你没有给 `age` 赋初值，也没有成功向其中读取一个值。因此，你得到了一些在你开始执行时恰好位于该内存区域的“垃圾值”。在 §10.6\
  \ 中，我们将学习处理“输入格式错误”的方法。现在，让我们先初始化 `age`，这样在输入失败时就能得到一个可预测的值：\n\n点击此处查看代码图像\n\n```cpp\n\
  // 读取名字和年龄 (第 2 版)\n\nint main()\n{\n    cout << \"Please enter your first name\
  \ and age\\n\";\n    string first_name = \"???\";     // 字符串变量\n               \
  \                 // (\"????”意味着“不知道名字”)\n    int age = –1;                 // 整数变量\
  \ (–1 表示“不知道年龄”)\n    cin >> first_name >> age;      // 读取一个字符串后跟一个整数\n    cout\
  \ << \"Hello, \" << first_name << \" (age \" << age << \")\\n\";\n}\n```\n\n现在，输入\
  \ `22 Carlos` 将输出\n\n`Hello, 22 (age –1)`\n\n请注意，我们可以在一个输入语句中读取多个值，就像我们可以在一个输出语句中写入多个值一样。同样注意，`<<`\
  \ 对类型敏感，`>>` 也是如此，因此我们可以输出 `int` 变量 `age`，也可以输出字符串变量 `first_name` 以及字符串字面量 `\"Hello,\
  \ \"`、 `\" (age \"` 和 `\"\\n\"`。\n\n![图像](img/00006.jpeg)\n\n使用 `>>` 读取的字符串（默认情况下）是以空白字符结束的；也就是说，它读取的是单个单词。但有时，我们想要读取多个单词。当然，有许多方法可以实现。例如，我们可以这样读取一个由两个单词组成的名字：\n\
  \n点击此处查看代码图像\n\n```cpp\nint main()\n{\n    cout << \"Please enter your first and\
  \ second names\\n\";\n    string first;\n    string second;\n    cin >> first >>\
  \ second;           // 读取两个字符串\n    cout << \"Hello, \" << first << \" \" << second\
  \ << '\\n';\n}\n```\n\n我们只是简单使用了两次 `>>`，每个名字使用一次。当我们想要把名字输出到屏幕时，必须在它们之间插入一个空格。\n\
  \n***\n\n![图像](img/00024.jpeg) 尝试一下\n\n运行“名字和年龄”示例。然后，修改它以以月为单位输出年龄：以年为单位输入，并使用\
  \ `*` 运算符乘以 12。将年龄读入 `double` 中，以允许那些可能对只有五岁半感到非常自豪，而不仅仅是五岁的孩子。\n\n### 3.4 操作与运算符\n\
  \n除了指定变量可以存储哪些值之外，变量的类型还决定了我们可以对其执行哪些操作以及这些操作意味着什么。例如：\n\n点击此处查看代码图像\n\n```cpp\n\
  int count;\ncin >> count;                   // >> 将一个整数读入 count\nstring name;\n\
  cin >> name;                    // >> 将一个字符串读入 name\nint c2 = count+2;         \
  \      // + 加整数\nstring s2 = name + \" \";         // + 拼接字符\nint c3 = count–2;\
  \               // – 减整数\nstring s3 = name – \" \";        // 错误：字符串未定义定义 – 运算符\n\
  ```\n\n我们所说的“错误”是指编译器将拒绝尝试减去字符串的程序。编译器确切知道每个变量可以使用哪些操作，因此可以防止错误。然而，编译器并不知道哪些操作对你是有意义的，所以它会乐然接受某些在你看来可能荒谬的合法操作。例如：\n\
  \n![图像](img/0007.jpeg)\n\n```cpp\nint age = –100;\n```\n\n对你来说，这可能是显而易见的：年龄不能为负数（为什么呢？），但没有人告诉编译器，所以它会生成相应的代码。这里有一张针对常用且有用类型的常用运算符表：\n\
  \n![图像](img/0025.jpeg)\n\n空白方框表示该操作对某种类型不可直接使用（尽管可能存在间接使用该操作的方法；请参见 §3.9.1）。我们将在学习过程中解释这些操作以及更多内容。这里的关键点是，有很多非常有用的运算符，而且它们的含义对于相似的类型往往是相同的。让我们尝试一个涉及浮点数的示例：\n\
  \n点击此处查看代码图像\n\n```cpp\n// 练习运算符的简单程序\nint main()\n{\n    cout << \"Please enter\
  \ a floating-point value: \";\n    double n;\n    cin >> n;\n    cout << \"n ==\
  \ \" << n;\n    cout << \"n+1 == \" << n+1;\n    cout << \"three times n == \" <<\
  \ 3*n;\n    cout << \"n squared \" << n*n;\n    cout << \"nhalf of n == \" << n/2;\n\
  \    cout << \"square root of n == \" << sqrt(n);\n}\n```\n\n\n\n\n\n### 3.5 赋值与初始化\n\
  \n![Image](img/00005.jpeg)\n\n在很多方面，最有趣的运算符是赋值，表示为 `=`。它给变量赋上一个新值。例如：\n\n![Image](img/00026.jpeg)![Image](img/00007.jpeg)\n\
  \n最后那个赋值值得注意。首先，它清楚地显示了 `=` 并不意味着等于——显然，`a` 并不等于 `a+7`。它意味着赋值，即在变量中放置一个新值。`a=a+7`\
  \ 执行的操作如下：\n\n1. 首先，获取 `a` 的值；那是整数 `4`。\n2. 接着，在 `4` 上加上 `7`，得到整数 `11`。\n3. 最后，将\
  \ `11` 放入 `a` 中。\n\n我们也可以使用字符串来说明赋值：\n\n![Image](img/00027.jpeg)![Image](img/00005.jpeg)\n\
  \n上面，我们使用“开始”（starts out with）和“获取”（gets）来区分两个相似但逻辑上不同的操作：\n\n- 初始化（给变量它的初始值）\n\
  - 赋值（给变量一个新值）\n\n这些操作是如此相似，以至于 C++ 允许我们使用相同的符号（`=`）来处理两者：\n\n```cpp\nint y = 8;\
  \           // 初始化 y 为 8\nx = 9;               // 将 9 赋值给 x\nstring t = \"howdy!\"\
  ; // 初始化 t 为“howdy!”\ns = \"G'day\";         // 将“G’day”赋值给 s\n```\n\n然而，在逻辑上，赋值和初始化是不同的。你可以通过类型规格（如\
  \ `int` 或 `string`）来区分它们，初始化总是以它开头；而赋值没有。原则上讲，初始化总是发现变量是空的。另一方面，赋值（原则上）必须在放入新值之前清除变量中的旧值。你可以把变量看作一种小盒子，把值看作一个具体的物品（比如硬币），你把它放入其中。在初始化之前，盒子是空的，但在初始化之后它总是持有一个硬币，因此为了放入一个新硬币，你（即赋值运算符）必须先取出旧的（“销毁旧值”）。计算机内存中的情况并非完全如此字面，但这是理解发生过程的一种很好的思考方式。\n\
  \n#### 3.5.1 示例：检测重复单词\n\n当我们想要向一个对象放入一个新值时，就需要赋值。当你考虑到它时，显而易见，当你多次执行某些操作时，赋值是最用的。当我们想要用不同的值再次执行某些操作时，我们需要赋值。让我们来看一个小检测单词序列中相邻重复单词的程序。这类代码是大多数语法检查器的一部分：\n\
  \n```cpp\nint main()\n{\n    string previous = \" \";      // 上一个单词；初始化为“不是一个单词”\n\
  \    string current;             // 当前单词\n    while (cin>>current) {      // 读取单词流\n\
  \        if (previous == current)   // 检查单词是否与上一个相同\n            cout << \"repeated\
  \ word: \" << current << '\\n';\n        previous = current;\n    }\n}\n```\n\n\
  这个程序并不是最有用的，因为它没有告诉重复单词出现在哪里，但目前暂够使用。我们将逐行查看这个程序，从\n\n```cpp\nstring current; //\
  \ 当前单词\n```\n\n这是字符串变量，我们立即使用以下代码从中读取当前的（即最近一次读取的）单词：\n\n```cpp\nwhile (cin>>current)\n\
  ```\n\n![Image](img/00006.jpeg)\n\n这种结构被称为 `while` 语句，它本身很有趣，我们将进一步检查它。`while` 表示只要输入\
  \ `cin>>current` 成功，其后面的语句就会重复，而只要标准输入中有字符可读，`cin>>current` 就会成功。对于字符串，`>>` 读取由空白分隔的单词。你通过给程序一个输入结束字符（通常称为文件结束）来终止这个循环。在\
  \ Windows 上，那是 `Ctrl+Z`（按下 Control 和 Z）然后按回车。在 Unix 或 Linux 上，那是 `Ctrl+D`（按下 Control\
  \ 和 D）。\n\n所以，我们做是将单词读入 `current`，然后将其与 `previous`（存储在 `previous` 中）比较。如果它们相同，我们就说：\n\
  \n```cpp\nif (previous == current) // 检查单词是否与上一个相同\n    cout << \"repeated word:\
  \ \" << current << '\\n';\n```\n\n然后我们必须准备好为下一个单词再次执行此操作。我们通过将当前单词复制到 `previous`\
  \ 来实现：\n\n```cpp\nprevious = current;\n```\n\n只要我们能开始，这就处理了所有情况。对于我们没有 `previous`\
  \ 可比较的第一个单词，这段代码应该做什么呢？这个问题通过 `previous` 的定义解决了：\n\n```cpp\nstring previous = \"\
  \ \"; // 上一个单词；初始化为“不是一个单词”\n```\n\n`\" \"` 仅包含一个字符（空格字符，我们通过按下键盘上的空格键获得）。输入运算符\
  \ `>>` 会跳过空白，因此我们无法从输入中读取它。因此，第一次执行 `while` 语句时，测试 `previous == current` 失败（正如我们预期的那样）。\n\
  \n![Image](img/00006.jpeg)\n\n### 3.6 复合赋值运算符\n\n增加变量的值（即对其加 1）在程序中非常常见，因此 C++ 为其提供了特殊的语法。例如：\n\
  \n```cpp\n++counter\n```\n\n意味着\n\n```cpp\ncounter = counter + 1\n```\n\n根据当前值改变变量值还有许多常见方法。例如，我们可能想对其加上\
  \ 7、减去 9 或乘以 2。这些操作也被 C++ 直接支持。例如：\n\n```cpp\na += 7; // 意味着 a = a+7\nb -= 9; //\
  \ 意味着 b = b–9\nc *= 2; // 意味着 c = c*2\n```\n\n通常，对于任何二元运算符 `oper`，`a oper= b` 意味着\
  \ `a = a oper b`。对于初，该规则给了我们 `+=`、`-=`、`*=`、`/=` 和 `%=`。这提供了一种简洁的表示法，直接反映了我们的想法。例如，在许多应用领域中\
  \ `*=` 和 `/=` 被称为“缩放”。\n\n#### 3.6.1 示例：查找重复单词\n\n考虑上述检测相邻重复单词的示例。我们可以通过提供重复单词在序列中的位置来改进它。该想法的一个简单变体只需计数并输出重复单词的计数：\n\
  \n```cpp\nint main()\n{\n    int number_of_words = 0;\n    string previous = \"\
  \ \";      // 不是一个单词\n    string current;\n    while (cin>>current) {\n        ++number_of_words;\
  \     // 增加计数\n        if (previous == current)\n            cout << \"word number\
  \ \" << number_of_words;\n    }\n}\n```\n\n\n\n\n\n```cpp\n<< \" repeated: \" <<\
  \ current << '\\n';\nprevious = current;\n}\n```\n\n我们将单词计数器从 0 开始。每当我们看到一个单词时，就让计数器加\
  \ 1：\n\n```cpp\n++number_of_words;\n```\n\n这样，第一个单词就变成数字 1，下一个变成数字 2，以此此类推。我们通过以下方式也可以同样的效果：\n\
  \n```cpp\nnumber_of_words += 1;\n```\n\n甚至：\n\n```cpp\nnumber_of_words = number_of_words+1;\n\
  ```\n\n但 `++number_of_words` 更加短，并且直接表达了自增的思想。\n\n![Image](img/00006.jpeg)\n\n注意看这个程序与\
  \ §3.5.1 中的程序是多么的相似。显然，我们只是取了 §3.5.1 的程序并对其稍微修改，以满足我们的新需求。这是一种非常常用的技术：当我们需要解决一个问题时，我们会寻找一个类似的问题，并对它的解决方案进行适当修改后使用。除非万不得已，否则不要从零开始。使用程序的之前的版本作为修改的基础通常可以节省大量时间，而且我们可以从原始程序中所投入的大量努力中受益。\n\
  \n### 3.7 名称\n\n我们为变量命名是为了能够记住它们，并在程序的其他部分引用它们。在 C++ 中，什么可以作为名称？在 C++ 程序中，名称以字母开头，并且仅包含字母、数字和下划线。例如：\n\
  \n* `x`\n* `number_of_elements`\n* `Fourier_transform`\n* `z2`\n* `Polygon`\n\n\
  以下不是名称：\n\n```cpp\n2x              // 名字必须以字母开头\ntime$to$market  // $ 不是字母、数字或下划线\n\
  Start menu      // 空格不是字母、数字或下划线\n```\n\n当我们说“不是名称”时，我们的意思是 C++ 编译器不会接受它们作为名称。\n\
  \n![Image](img/00007.jpeg)\n\n如果你阅读系统代码或机器生成的代码，可能会看到以下划线开头的名称，例如 `_foo`。永远不要自己写这些；此类名称是为实现和系统实体保留的。通过避免前导下划线，你永远不会自己的名称与实现生成的某些名称发生冲突。\n\
  \n名称是对大小写敏感的；也就是说，大字母和小写字母是不同的，所以 `x` 和 `X` 是不同的名称。这个小程序至少有四个错误：\n\n```cpp\n#include\
  \ \"std_lib_facilities.h\"\n\nint Main()\n{\n    STRING s = \"Goodbye, cruel world!\
  \ \";\n    cOut << S << '\\n';\n}\n```\n\n定义仅在字符大小写上不同的名称通常不是一个好主意，例如 `one` 和 `One`；这不会困扰编译器，但很容易让程序员感到困惑。\n\
  \n***\n\n![Image](img/00024.jpeg) 尝试一下\n\n编译“Goodbye, cruel world!”程序并检查错误信息。编译器找到所有错误了吗？它建议的问题是什么？编译器是否感到困惑并诊断出了四个以上的错误？一个接一个删除错误，从词法上最靠前的开始，看看错误信息是如何变化（并改进）的。\n\
  \n***\n\n![Image](img/00007.jpeg)\n\nC++ 语言保留许多（约 85 个）名称作为“关键字”。我们在 §A.3.1 中列出了它们。你不能用它们来命名你的变量、类型、函数等。\n\
  \n```cpp\nint if = 7;    // 错误：if 是关键字\n```\n\n可以使用标准库中的设施名称，例如 `string`，但你不应该这样做。如果你以后使用标准库，重复使用这种常用名称会引起麻烦：\n\
  \n```cpp\nint string = 7; // 将导致麻烦\n```\n\n![Image](img/00006.jpeg)\n\n当你为变量、函数等选择名称时，请选择有意义的名称；也就是说，选择有助于人们理解你程序的名称。如果你在程序中充斥着如\
  \ `x1`、`x2`、`s3` 和 `p7` 这样“易于输入”的名称，即使是你也会难以理解程序想要做什么。缩写和首字母可能会困扰人们，所以要节节使用：\n\n\
  ```text\nmtbf\nTLA\nNBV\n```\n\n我们预计在几个月后，你会在其中至少一个上遇到困难。短名称如 `x` 和 `i` 在按照惯例使用时是有意义的；也就是说，`x`\
  \ 应该是局部变量（见 §4.5 和 §8.4），而 `i` 应该是循环索引（见 §4.4.2）。不要使用过长的名称；它们难以输入，会使行长到屏幕无法容纳，并且难以阅读。这些可能是好的：\n\
  \n```text\npartial_sum\nelement_count\n```\n\n这些可能太长了：\n\n```text\nthe_number_of_elements\n\
  remaining_free_slots_in_table\n```\n\n我们的“习惯”是使用下划线分隔单词，例如 `element_count` 而不是 `ElementCount`。C++\
  \ 语言不使用首字母大写样式，例如 `int` 而不是 `Int`，`string` 而不是 `String`。我们不使用全大写字母，例如 `ALL_CAPITAL_LETTERS`，因为那是保留的。避免易打错、易读错或混淆的名称。例如：\n\
  \n![Image](img/00007.jpeg)\n\n```text\nName  names S\nfoo   f00 fl\nf1    fI\n```\n\
  \n字符 `0`（零）、`o`、`O`（大写 O）、`1`（一）、`I`（大写 I）和 `l`（小写 L）特别容易引起麻烦。\n\n### 3.8 类型与对象\n\
  \n类型的概念是 C++ 以及大多数其他语言的核心。让我们更深入、更技术地查看类型，特别是我们存储数据时的类型。从长远来看，这将节省时间，并可能消除你的困惑。\n\
  \n![Image](img/00005.jpeg)\n\n* `type` 定义了一组可能的值和一组操作（针对对象）。\n* `object` 是存储给定类型值的某些内存。\n\
  * `value` 是根据类型解释的一组比特位。\n* `variable` 是命名的对象。\n* `declaration` 是给对象命名的陈语句。\n* `definition`\
  \ 是为对象分配内存的声明。（等等，纠正：`definition` 是为对象分配内存的声明。）\n\n非正式地说，我们把对象看作可以放入给定类型值的盒子。`int`\
  \ 盒子可以存放整数，如 7、42 和 -399。`string` 盒子可以存放字符字符串值，如 \"Interoperability\"、tokens: !@#$%^*\"\
  \ 和 \"Old MacDonald had a farm\"。图化来看，我们可以认为：\n\n![Image](img/00028.jpeg)\n\n字符串的表示比\
  \ `int` 复杂一点，因为字符串记录了它包含的字符数量。注意 `double` 存储数字，而 `string` 存储字符。例如，`x` 存储数字 1.2，而\
  \ `s2` 存储三个字符 '1'、'.' 和 '2'。字符字面量和字符串字面量的引号是不存储的。\n\n\n\n\n每个 `int` 的大小都是相同的；也就是说，编译器为每个\
  \ `int` 预留了相同的固定内存空间。在典型的桌面电脑上，该数量为 4 字节（32 位）。同样，`bools`、`chars` 和 `doubles` 也是固定大小的。你通常会发现桌面电脑使用\
  \ 1 字节（8 位）表示 `bool` 或 `char`，使用 8 字节表示 `double`。请注意，不同类型的对象占据的空间不同。特别是，`char` 占用的空间比\
  \ `int` 少，而 `string` 与 `double`、`int` 和 `char` 的不同之处在于，不同的字符串可以占据不同的空间。\n\n![Image](img/00005.jpeg)\n\
  \n内存中位位的含义完全取决于访问它时所使用的类型。可以这样想：计算机内存并不知道我们的类型；它只是内存。只有当我们决定如何解释这些内存时，内存中的位才有了意义。这与我们每天使用数字时所做的相似。`12.5`\
  \ 代表什么？我们不知道。它可能是 `$12.5`、`12.5cm` 或 `12.5gallons`。只有当我们提供单位时，`12.5` 这个符号才有任何意义。\n\
  \n例如，同一段内存位在视为 `int` 查看时表示值 `120`，但当视为 `char` 查看时则是 `'x'`。如果将其视为 `string`，那么它将完全没有意义，如果我们尝试使用它，会导致运行时错误。我们可以像这样图化地说明这一点，使用\
  \ `1` 和 `0` 表示内存中位的值：\n\n![Image](img/00029.jpeg)\n\n这是一个内存区域（一个字）位的设置，它可以被读取为 `int`\
