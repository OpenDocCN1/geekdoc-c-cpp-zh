  \n## 21.7.2 流迭代器\n\n你可能听说过“复制到输出”和“从输入中复制”这样的说法——这是一种对某些 I/O 形式非常直观有用的思维方式——实际上我们可以使用`copy()`来实现这一目标。请记住一个**序列**具有以下特点：\n\
  \n-   有起始位置与结束位置\n-   可以通过 `++` 访问下一个元素\n-   可以使用 `*` 获取当前元素的值\n\n这样我们就可以很容易地表示输入和输出了。例如：\n\
  \n```\nostream_iterator<string> oo{cout};     // *oo 赋值意味着写入 cout \n\n*oo = \"Hello,\
