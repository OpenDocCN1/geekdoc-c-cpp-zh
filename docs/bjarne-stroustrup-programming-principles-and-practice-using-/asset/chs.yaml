  \n#### Solution Interface Class\n\n尽管理想通用方案不能完全依赖标准库组件因为在部分领域存在分配约束------------取而代之可开发围绕原始计数与裸指针构成的轻量封装模仿少量\
  \ vec 功能并以极小开销零动态管理满足下列需求:\n\n-   只引已有存在的所有权责任但不参与分配删除自省机制阻止隐式子区间表达式的转换简化用法逼近原目标精度同时保留可靠性并在性能要求严苛域里达成削减复杂度的折衷平衡点--------适用于超出典型桌面级别的固件鲁棒优先场合!\n\
  \n示列模板<typename T>class Array_ref{public :\nArray_ref(T* pp,int s):p(pp),sz(s){\
  \ }\nT& operator[](int n){return p[n];}\nconst T& operator[](int n)const { return\
  \ p[n]; }  \nbool assign(const Array_ref&& other)... [其余细节省略]… };\n\n特点包括了受限 API\
  \ 集移除外还变化预留扩容异常迭代支持此前承诺维持窄范围(read 访问主控写权限赋值重置操作语义透明既降低了原有备选滥用风险最终改进整体完整性||\n\n\n\
  \n\n\n* 没有迭代器接口（但如果有必要，可以很容易地添加）。实际上，`Array_ref`在概念上非常接近于由两个迭代器描述的范围。\n\n![Image](img/00007.jpeg)\n\
  \n`Array_ref`不拥有其元素；它不进行内存管理；它仅仅是访问和传递元素序列的机制。在这方面，它与标准库 `array`（§20.9）不同。\n\n为了简化\
  \ `Array_ref`s 的创建，我们提供了一些有用的辅助函数：\n\n```cpp\ntemplate<typename T> Array_ref<T>\
