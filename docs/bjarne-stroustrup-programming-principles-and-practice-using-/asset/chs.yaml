  cd.add_day(1); // error: cd is a const\n```\n\n我们在成员函数的声明中，在参数列表之后直接使用 `const`，表示该成员函数可以被\
  \ `const` 对象调用。一旦我们声明了一个 `const` 成员函数，编译器就会要求我们遵守承诺，不修改该对象。例如：\n\n点击此处查看代码图片\n\n\
  ```cpp\nint Date::day() const\n{\n    ++d; // error: attempt to change object from\
  \ const member function\n    return d;\n}\n```\n\n理而然地，我们通常不会尝试通过这种方式“作弊”。编译器为类实现者提供的保护主要是防止意外错误，这对于更复杂的代码来说特别有用。\n\
  \n## 9.7.5 成员与“辅助函数”\n\n![Image](img/00006.jpeg)\n\n当我们设计的接口尽可能精简（尽管是完备）时，我们必须舍弃许多仅仅是有用的操作。如果一个函数可以简单、优雅且高效地实现为一个独立函数（即非成员函数），那么它应该在类之外实现。这样，该函数中的\
  \ Bug 就不会直接损坏类对象中的数据。不访问表示（representation）是非常重要的，因为通常的调试技术是“抓捕不常嫌疑犯”；也就是说，当类出现问题时，我们首先查看直接访问表示的函数：其中一个几乎肯定是罪魁祸首。如果有十个这样的函数，我们会比有\
  \ 50 个时要开心得多。\n\n一个 `Date` 类竟然有 50 个函数！你可能怀疑我们是否在开玩笑。我们并没有：几年前，我调查了一些商业化使用的 `Date`\
  \ 库，发现它们充满了诸如 `next_Sunday()`、`next_workday()` 等函数。对于一个为了方便用户使用而非为了便于理解、实现和维护而设计的类来说，50\
  \ 个并不是一个不合理的数字。\n\n另外注意，如果表示发生了变化，只有直接访问表示的函数需要重写。这是保持接口精简的另一个有力实际理由。在我们的 `Date`\
  \ 示例中，我们可能会决定用表示自 1900 年 1 月 1 日以来天数的整数，比 `(year,month,day)` 更好地满足我们的用途。只有成员函数需要更改。\n\
  \n以下是一些辅助函数的示例：\n\n点击此处查看代码图片\n\n```cpp\nDate next_Sunday(const Date& d)\n{\n  \
  \  // 使用 d.day(), d.month(), 和 d.year() 访问 d\n    // 创建并返回新的 Date 对象\n}\n\nDate\
  \ next_weekday(const Date& d) { /* . . */ }\nbool leapyear(int y) { /* . . */ }\n\
  bool operator==(const Date& a, const Date& b)\n{\n    return a.year()==b.year()\n\
  \           && a.month()==b.month()\n           && a.day()==b.day();\n}\nbool operator!=(const\
  \ Date& a, const Date& b)\n{\n    return !(a==b);\n}\n```\n\n![Image](img/00005.jpeg)\n\
  \n辅助函数也被称为 `convenience functions`（便利函数）、`auxiliary functions`（辅助函数）等等等等。这些函数与其他成员函数之间的区别是逻辑上的；也就是说，“辅助函数”是一个设计概念，而不是一种编程语言。辅助函数通常以它们所所属的类的实例作为参数。不过，也有例外情况：注意\
  \ `leapyear()`。通常，我们使用命名空间来标识一组辅助函数；参见 8.7。\n\n```cpp\nnamespace Chrono {\n    enum\
  \ Month { /* ... */ };\n    class Date { /* . . */ };\n    bool is_date(int y, Month\
  \ m, int d); // 有效则 true\n    Date next_Sunday(const Date& d) { /* . . */ }\n  \
  \  Date next_weekday(const Date& d) { /* . . */ }\n    bool leapyear(int y) { /*\
  \ . . */ } // 练习 10\n    bool operator==(const Date& a, const Date& b) { /* . .\
  \ */ }\n}\n```\n\n注意 `==` 和 `!=` 函数。它们是典型的辅助函数。对于许多类，`==` 和 `!=` 的意义显而易见，但由于它们对所有类都有意义，编译器无法像为你编写拷贝构造函数和拷贝赋值运算符那样为你编写它们。\n\
  \n另外注意，我们引入了一个辅助函数 `is_date()`。该函数取代了 `Date::is_valid()`，因为检查日期是否有效在很大程度上独立于 `Date`\
  \ 的表示。例如，我们不需要知道 `Date` 对象是如何表示的，就知道“2008 年 1 月 30 日”是一个有效日期，而“2008 年 2 月 30 日”不是。日期的某些方面可能依赖于表示（例如，我们可以表示“1066\
  \ 年 1 月 30 日”吗？），但（如有必要）`Date` 的构造函数可以处理这个问题。\n\n### 9.8 Date 类\n\n现在，让我们把所有内容整合在一起，看看当我们结合所有的想法/考量时，那个\
  \ `Date` 类可能是什么样子。当函数体只是 . . 注释时，实际实现是复杂的（请不要尝试编写）。首先我们将声明放在头文件 `Chrono.h` 中：\n\n\
  点击此处查看代码图片\n\n```cpp\n// file Chrono.h\nnamespace Chrono {\nenum class Month {\n\
  \    jan=1, feb, apr, may, jun, jul, sep, oct, nov, dec\n};\nclass Date {\npublic:\n\
  \    // default constructor\n    // nonmodifying operations:\n    int day() const\
  \ { return d; }\n    Month month() const { return m; }\n    int year() const { return\
  \ y; }\n    // modifying operations:\n    void add_day(int n);\n    void add_month(int\
  \ n);\n    void add_year(int n);\nprivate:\n    int y;\n    Month m;\n    int d;\n\
  };\nbool is_date(int y, Month m, int d); // true for date\nbool leapyear(int y);\
  \ // true if y is leap year\nbool operator==(const Date& a, const Date& b);\nbool\
  \ operator!=(const Date& a, const Date& b);\nostream& operator<<(ostream& os, const\
  \ Date& d);\nistream& operator>>(istream& is, Date& dd);\n} // Chrono\n```\n\n定义进入\
  \ `Chrono.cpp`：\n\n点击此处查看代码图片\n\n```cpp\n// Chrono.cpp\n#include \"Chrono.h\"\n\
  namespace Chrono {\n// member function definitions:\nDate::Date(int yy, Month mm,\
  \ int dd)\n    : y{yy}, m{mm}, d{dd}\n{\n    if (!is_date(yy,mm,dd)) throw Invalid{};\n\
  }\nconst Date& default_date()\n{\n    static Date dd {2001,Month::jan,1}; // start\
  \ of 21st century\n    return dd;\n}\nDate::Date()\n    : y{default_date().year()},\n\
  \      m{default_date().month()},\n      d{default_date().day()}\n{}\nvoid Date::add_day(int\
  \ n)\n{\n    // . .\n}\nvoid Date::add_month(int n)\n{\n    // . .\n}\nvoid Date::add_year(int\
  \ n)\n{\n    if (m==feb && d==29 && !leapyear(y+n)) { // beware of leap years!\n\
  \        m = mar; // use March 1 instead of February 29\n        d = 1;\n    }\n\
  \    y+=n;\n}\n// helper functions:\nbool is_date(int y, Month m, int d)\n{\n  \
  \  // assume that y is valid\n    if (d<=0) return false; // d must be positive\n\
  \    if (m<Month::jan || Month::dec<m) return false;\n    int days_in_month = 31;\
  \ // most months have 31 days\n    switch (m) {\n        case Month::feb: // the\
  \ length of February varies\n            days_in_month = (leapyear(y))?29:28;\n\
  \    }\n}\n}\n```\n\n\n\n\n\n```cpp\n    break;\n\ncase Month::apr: case Month::jun:\
  \ case Month::sep: case Month::nov:\n    days_in_month = 30;           // 其余为 30\
  \ 天\n    break;\n}\nif (days_in_month<d) return false;\n\nreturn true;\n}\n\nbool\
  \ leapyear(int y)\n{\n    // 查看练习 10\n}\n\nbool operator==(const Date& a, const\
  \ Date& b)\n{\n    return a.year()==b.year()\n               && a.month()==b.month()\n\
  \               && a.day()==b.day();\n}\n\nbool operator!=(const Date& a, const\
  \ Date& b)\n{\n    return !(a==b);\n}\n\nostream& operator<<(ostream& os, const\
  \ Date& d)\n{\n    return os << '(' << d.year()\n                  << ',' << d.month()\n\
  \                  << ',' << d.day() << ')';\n}\n\nistream& operator>>(istream&\
  \ is, Date& dd)\n{\n    int y, m, d;\n    char ch1, ch2, ch3, ch4;\n    is >> ch1\
  \ >> y >> ch2 >> m >> ch3 >> d >> ch4;\n    if (!is) return is;\n    if (ch1!= '('\
  \ || ch2!=',' || ch3!=',' || ch4!=')') {     // 错误：格式错误\n        is.clear(ios_base::failbit);\
  \                        // 设置失败位\n        return is;\n    }\n    dd = Date(y, Month(m),d);\
  \                              // 更新 dd\n    return is;\n}\n\nenum class Day {\n\
  \    sunday, monday, tuesday, wednesday, thursday, friday, saturday\n};\nDay day_of_week(const\
  \ Date& d)\n{\n    // ...\n}\nDate next_Sunday(const Date& d)\n{\n    // ...\n}\n\
  Date next_weekday(const Date& d)\n{\n    // ...\n}\n```\n\n### 用于 `Date` 的 `>>`\
  \ 和 `<<` 的函数将在 10.8 和 10.9 中详细解释。\n\n### 练习\n\n此练习涉及获取 `Date` 的序列。对于每个版本，定义一个名为\
  \ `today` 的 `Date`，并初始化为 1978 年 6 月 25 日。然后，定义一个名为 `tomorrow` 的 `Date`，通过将 `today`\
  \ 复制其中并使用 `add_day()` 将日期增加一天来为其赋值。最后，像 9.8 一样使用 `<<` 输出 `today` 和 `tomorrow`。\n\
  \n你对有效日期的检查可以非常简单。可以忽略闰年。但是，不要接受不在 [1,12] 范围内的月份或不在 [1,31] 范围内的日期。用至少一个无效日期测试每个版本（例如，\
  \ 2004, 13, -5）。\n\n1. 来自 9.4.1 的版本\n2. 来自 9.4.2 的版本\n3. 来自 9.4.3 的版本\n4. 来自 9.7.1\
  \ 的版本\n5. 来自 9.7.4 的版本\n\n### 复习\n\n1. 根据本章描述，`class` 的两个部分是什么？\n2. `class` 中的接口（interface）和实现（implementation）有什么区别？\n\
