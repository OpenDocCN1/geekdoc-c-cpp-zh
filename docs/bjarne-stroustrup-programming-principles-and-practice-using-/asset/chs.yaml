  \ 26 章。\n\n### 内存管理\n两种最基本的资源分别是用于执行指令的处理器时间与存放数据及源码的空间 C++有三种方式分配内存 (§17..4 ,§A\
  \ ...):\n\n•静态分配由链接器完成在整轮运行期间持久存在 •栈自动变量调用函数时创建返回时就释放 •\n动态堆之于可重用利用新的 Delete 让我们从嵌入式编程视角考虑特定要求具备确定性的领域如同硬实时安全性至关重要的工作空间着重简洁鲁棒可靠受限于有限可用资源的条件下故而静不会带来额外难题因为它已在部署启动前的阶段预先妥善安排好了\n\
  \n![img_7](img/jpg )\n\n栈的问题在于过度使用架构师需确保永不超限限制意味着要规定最大的调用深度比如验证当前链路 f1→f2…fn 长度的合理性环境禁止递归做法合理有些情况下迭代实也能替代以免意外事故拿阶乘来说已知最多十次而安全的解法也存在第十八章介绍通过数学归纳而非运行时去检验正确来引用此外动分配的通常会受到严格甚至全禁基本上因以下几点：\n\
  \n可预测性是自由存储器的支持的操作具有不确定性不恒定的性能会在多次分归还中退化产生碎片留下不可用的小孔洞大大降低造有效容量远超于总量加上维护元数据结构所需的开销亦会显著影响表现和稳定性最后在最糟的情形下当引入并发锁争导致的进一步延迟打中断号容忍阈值造成机载失败措过命中曲线为此可采用池或序组织获得确定性、预判行适用的高保障域接下一节解释为何不能接受的原因根本上应该双都避免同在上文中描述的使用语境并通过专门区域基的手法系统地规避简介避开标准教程结论\
  \  \n\n#### Freestore Problems \n哪里出了问题?实际相同序列组合诚然说明了一例以循环输入消交互节点交替构建树叶片状花式随时间递增增长足迹每次虽然本期望耗字节却长期累积损害针对冗长会话可视化如下橙代表临时信息绿空白位置则被占不完逻辑址依然物显存终早衰败除实行碎整理不过大众语言缺乏自动化支被迫手动蓄意从而限制了那些需要绝对确对时序资界的用例故最佳方法是在生命期分段内预留固定容彻底消除这些问题借助放置引直接定自订配符切应用需求绕通用全局堆共同陷阱参看\
  \ https://github.com/FluidNibble/TEMPLATE/blob/main/solutions/freestoretricks.cpp\
  \  \n\n>假设在一个简易的管理器中相似大小对象如图所示依次留出小块逐渐恶化直至枯竭犹如泄漏积累般的突发终止不断退化的反应本质上是大多数无论规模体量的应用中如果形状分布不均都会导致搜时长倍增显然违背典型设计要求这样的同样也会染指非嵌人朴素版本之上\
  \   \n\n为什么语或不本着解呢先从掉隙下手首先是显而易见的移动紧凑连续可用面积的理方  \n\n\n\n\n遗憾的是，“系统”无法做到这一点。原因是 C++\
  \ 代码直接引用内存中的对象。例如，指针 `n1` 和 `n2` 包含真实的内存地址。如果我们移动了这些指针所指向的对象，那么这些地址将不再指向正确的对象。\n\
  \n假设我们（在某个地方）保留着对所创建节点的指针。我们可以这样表示数据结构的相关部分：\n\n![Image](img/00291.jpeg)\n\n现在，我们通过移动一个对象来压缩内存，以便将所有未使用的内存集中到一处：\n\
  \n![Image](img/00292.jpeg) ![Image](img/00005.jpeg)\n\n不幸的是，这样做导致那些指针对乱了套；因为它们被移动了却没有得到正确更新——为什么不在发生这种情况时立即更新它们呢？\
  \  \n我们*可以*编写这样的程序，但前提是必须事先了解其结构的细节；一般来说，“系统”（即支持 C++的运行时环境）不知道任何给定指针当前可能处于哪个位置：问题在于“目前哪一个正指向特定的具体位置？”这个问题根本无法轻易获得答案解决它也并不总是能使得被称为\
  \ **压缩式垃圾回收**  的方法成为合适的选择因为要使其工作良好通常需要花费超出实际所需两倍以上的存储容量还得额外开销跟踪与移项这就意味着额外的容量可能在嵌入式场景中压根不可用而且即使如此高效形式也难以可预测地实现……\n\
  \n当然在自己构造结构中查询各自身份的位置是可行的同时在执行局部压实过程然而更简单的路径是在一开始就防止碎片化比如在前面案例里那样在调用消息处理函数前先分配好两个节点记录就行了\
  \ :\n\n```\nwhile( . . . ) {\n    Node* n1 = new Node;\n    Node* n2 = new Node;\n\
  \    Message* p = get_input(dev);\n    // ... store information in nodes ...\n   \
  \ delete p;\n}\n```\n\n不过靠重排代码来避免一般性问题很难可靠达成且常常和其他最佳实践冲突因此更好的做法是用来限制自由存储使用模式从而根本上阻止形成碎片–毕竟预防胜于治疗...\n\
