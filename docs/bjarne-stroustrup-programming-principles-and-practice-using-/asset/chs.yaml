  Success!\\n\";`\n24. `int x = 4; double d = 5/(x–2); if (d=2*x+0.5) cout << \"Success!\\\
  n\";`\n25. `cin << \"Success!\\n\";`\n\n### 复习\n1. 列出四种主要的错误类型并简要定义每。\n2. 我们可以忽略哪些类型的错误？\n\
