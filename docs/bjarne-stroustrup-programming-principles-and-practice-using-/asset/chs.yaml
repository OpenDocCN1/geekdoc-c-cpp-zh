  \n\n\n`vector` 可以抛出异常，我们建议当函数无法执行其所需操作时，应抛出异常以通知调用者（第 5 章）。现在我们需要考虑的是：当我们编写必须处理\
  \ `vector` 操作或其他被调用函数所抛出的异常的代码时应该怎么做。一个天真的答案——“使用 `try-block` 捕获异常、写入错误消息然后终止程序”——这对于大多数复杂系统来说过于粗糙。\n\
  \n编程的基本原则之一是：如果我们获取了资源，就必须直接或间接地将其归还给管理该资源的系统部分。资源示例包括：\n-   内存\n-   锁\n-   文件句柄\n\
  -   线程句柄\n-   Socket 套接字\n\n基本上我们将“资源”定义为某种需要先获取而后必须归还（释放）或被某个“资源管理器”回收的东西。最简单的例子是用\
  \ `new`分配并用 `delete[]()`返还到自由存储器的堆上内存：\n\n```cpp  \nvoid suspicious(int s, int x)\n\
  {\n     int* p = new int[s];        // 获取内存\n\n// ... \n```\n\n正如 §17.4.中所见，记住手动释放是容易出错的；一旦有多个退出路径或出现泄漏的倾向就变得很普遍——由于缺乏小心谨慎的处理方式常见的做法通常不足以确保局部变量能正确释放而拥有显式清理责任的管理器也未到位。\n\
  \n####19 个潜在的资源管理问题\n\n可疑之处在于像这样无辜的裸指针运算子:\n\n ```cpp /*已有的赋值片段*/\n`` ```\n\n因为改变指向的对象后可能不再对应正确的删除动作——例如条件语句导致返回前跳过析构等途径……\n\
  \n出于结构原因此处省略中间插图说明——\n\n我们把此类情况归因于根本的错误分类而不是好的实践技巧:在同一个作用域内抓住它只会造成混乱的数据复制与不当推广化;多次分次取得不同种类物件使得重复劳动大增破坏易读性与可维护性并增加风险隐患难以阅读及下笔称手完美安全曲线陡峭悬露着危险信号晦涩难懂可谓唐吉诃德对抗磨坊形势比强弱伙伴不靠谱制定规章团体抗议想现场快速过度依赖于专用工具妈妈呀一时也难以尽述顿感万念俱灰啊哈还是老老实实重构为好哇！\n\
  \n###尝试动手练习 ：为所有可能出现 throw 的情况添加适当的保证让全部数据都得到释还…\n\n**①更好的方法 ——RAII**\n\n幸运的是通过采用初始化即获得上述解法能够避免复杂的编码作业构造/析构成对出现的模式可应用于通用场景数据库表加锁缓冲\
  \ iostream 等等简称为 RAII 这个名目虽然棘手却十分强大”\n\n每当离开作用域无论因 return 还是 exception 都会全面地销毁已完整构建的子对象这种安全性是超越在原范围内赤裸使用动态分配的指針之显著优势所在。**\n\
  \n---\n关于保证机制的章节仍在继续……\n\n\n\n\n当我们无法将`vector`保持在单个作用域（及其子作用域）内时，可以采取什么措施？例如：\n\n\
  ```cpp\nvector<int>* make_vec()                                  // 创建一个已填充的 vector\n\
  {\n          vector<int>* p = new vector<int>;     // 在自由存储上分配内存\n          // .\
  \ . .  用数据填充该向量；这可能抛出异常 ...\n          return p;\n}\n```\n\n这是一种常见代码模式：调用函数来构建复杂的数据结构，并将该数据结构作为结果返回。问题是：如果在“填充”向量的过程中抛出了异常，那么\
  \ `make_vec()` 就会泄露这个向量。另一个不相关的问题是：如果函数执行成功，别人就不得不删除由 `make_vec()` 返回的对象（参见 §17.4.6）。\n\
  \n我们可以添加一个 try-block 来处理可能发生的 throw:\n\n```cpp\n\n【注意】您提供的原文最后一段内容中包含了明显混乱或残缺的文本（如\
  \ *?p、f ill 等拼写错误以及无意义注释），这些部分既不是有效的可翻译句子,也不符合文档规范。\n因此最终译文将以还原英文主体逻辑为目标处理——目前提交的上方译文中未包含那些语法/语义破损的内容。\n\
  \n如需保留原始乱码文字的字面形态以便校对参考，\n请重新提供干净规范的源文本段落进行逐字对照回复。\n\n】 \n\n\n\n\n将大量信息放置在自由存储区并返回指向它的指针这种技术非常常见。这同时也是导致复杂性和内存管理错误的主要源头之一：谁负责删除从函数返回的指向自由存储区的指针？我们能否确保在发生异常时，`ptr`\
  \ 所指向的自由存储区对象被正确删除？除非我们对指针的使用有系统化的规范（或者使用像 `unique_ptr` 和 `shared_ptr` 这样的“智能”指针），否则答案往往会是“嗯，我想是的”，但这并不够可靠。\n\
  \n幸运的是，在为 vector 添加移动操作后解决了这个问题：只需利用移动语义获取所有权即可。例如：\n\n```\nvector<int> make_vec()\
  \    // 创建填充好的向量\n{\n          Vector<int> res;\n           . Fill with data...\
