  \ “大致相同”是什么意思？ 在 10%的误差范围内是一个合理的答案。记住现代计算机速度很快：每秒执行 1,000,000,000 条指令是常态。这意味着除非你能将某个操作重复数万次，或者它执行了非常慢的操作（如写入磁盘或访问网络），否则你将无法进行有效测量。在后一种情况下，你可能只需要让它重复几百次，但你必须担心同时发生的其他事情太多而导致你难以理解结果。\n\
