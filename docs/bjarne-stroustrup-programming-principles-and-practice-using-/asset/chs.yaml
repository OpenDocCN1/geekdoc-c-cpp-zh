  \n#### 8.5.2 返回\n\n你可以在 ISO 中找到完整的语法。\n\n\n\n\n\n```cpp\n// pass-by-value (给函数传递的值的一个副本)\n\
  \nint f(int x)\n{\n    x = x+1;                   // 给局部 x 赋一个新值\n    return x;\n\
  }\n\nint main()\n{\n    int xx = 0;\n    cout << f(xx) << '\\n';           // 输出:\
  \ 1\n    cout << xx << '\\n';             // 输出: 0; f() 没有改变 xx\n    int yy = 7;\n\
  \    cout << f(yy) << '\\n';           // 输出: 8\n    cout << yy << '\\n';      \
  \        // 输出: 7; f() 没有改变 yy\n}\n```\n\n由于传递的是副本，因此 `f()` 中的 `x=x+1` 不会改变两次调用中传入的\
  \ `xx` 和 `yy` 的值。我们可以这样来说明值传递：\n\n![Image](img/00054.jpeg)\n\n按值传递非常直观，其代价就是复制值的代价。\n\
  \n### 8.5.4 常量引用传递\n\n当我们传递较小的值（如 `int`、`double` 或 `Token` (§6.3.2)）时，按值传递是简单、直接且高效的。但如果值很大，例如一个图像（通常有数百万位）、一个巨大的数值表（例如，数千个整数）或一个长字符串（例如，数百个字符）呢？那么复制可能会是非常昂贵的。我们不应该执着于代价，但做不必要的工作是很尴尬的，因为这表明我们没有直接表达自己想要实现的意图。例如，我们可以写这样一个函数来打印浮点数向量（vector）：\n\
  \n点击此此处查看代码图像\n\n```cpp\nvoid print(vector<double> v)             // 值传递；合适吗？\n\
  {\n    cout << \"{ \";\n    for (int i = 0; i<v.size(); ++i) {\n        cout <<\
  \ v[i];\n        if (i!=v.size()–1) cout << \", \";\n    }\n    cout << \" }\\n\"\
  ;\n}\n```\n\n我们可以用这个 `print()` 用于所有大小的向量。例如：\n\n点击此此处查看代码图像\n\n```cpp\nvoid f(int\
  \ x)\n{\n    vector<double> vd1(10);          // 小向量\n    vector<double> vd2(1000000);\
  \     // 大向量\n    vector<double> vd3(x);           // 某种大小的向量\n    // . . 用值填充 vd1,\
  \ vd2, vd3 . .\n    print(vd1);\n    print(vd2);\n    print(vd3);\n}\n```\n![Image](img/005.jpeg)\n\
  \n这段代码可以工作通，但 `print()` 的第一次调用必须复制十个浮点数（可能是 80 字节），第二次调用必须复制百万个浮点数（可能是 8 兆字节），而我们不知道第三次调用需要复制多少。我们在这里必须问自己的问题是：“我们为什么要复制？”我们想要打印向量，而不是创建它们元素的副本。显然，有一种方法让我们在不进行复制的情况下将变量传递给函数。作为一个类比，如果你被赋予了列出书单的任务，管理员不会给你寄一栋建筑及其所有内容的副本；他们会给你图书馆的地址，这样你就可以去查看书籍。因此，我们需要一种方法给我们的\
  \ `print()` 函数提供向量的“地址”，而不是向量的副本。这种“地址”被称为引用（reference），其使用方式如下：\n\n点击此此处查看代码图像\n\
  \n```cpp\nvoid print(const vector<double>& v)  // 常量引用传递\n{\n    cout << \"{ \"\
  ;\n    for (int i = 0; i<v.size(); ++i) {\n        cout << v[i];\n        if (i!=v.size()–1)\
  \ cout << \", \";\n    }\n    cout << \" }\\n\";\n}\n```\n\n`&` 意味着“引用”，而 `const`\
  \ 的作用是防止 `print()` 意外修改其参数。除了参数声明发生了变化外，其他都与之前相同；唯一的区别是 `print()` 不再在副本上操作，而是通过引用引用回参数。注意“引用回（refer\
  \ back）”这个短语；此类参数被称为引用，是因为它们“引用”了其他地方的对象。我们可以像以前一样调用这个 `print()`：\n\n点击此此处查看代码图像\n\
  \n```cpp\nvoid f(int x)\n{\n    vector<double> vd1(10);          // 小向量\n    vector<double>\
  \ vd2(1000000);     // 大向量\n    vector<double> vd3(x);           // 某种大小的向量\n  \
  \  // . . 用值填充 vd1, vd2, vd3 . .\n    print(vd1);\n    print(vd2);\n    print(vd3);\n\
  }\n```\n\n我们可以通过图示来说明：\n\n![Image](img/005.jpeg)\n\n常量引用有一个实用的属性，即我们无法意外修改传递的对象。例如，如果我们在\
  \ `print()` 内部犯了一个级错误并尝试给元素赋值，编译器会捕获它：\n\n点击此此处查看代码图像\n\n```cpp\nvoid print(const\
  \ vector<double>& v)  // 常量引用\n{\n    // . . .\n    v[i] = 7;                  \
  \      // 错误：v 是常量\n}\n```\n\n常量传递是一种有用且常用的机制。再次考虑 `my_find()` (§6.3.2) 它在向量中搜索字符串。按值传递可能是这样的：\n\
  \n点击此此处查看代码图像\n\n`int my_find(vector<string> vs, string s);`\n\n`my_find()` 在 `vs`\
  \ 中搜索 `s`。如果 `vs` 包含数千个字符串，按值传递可能是昂贵的。因此，我们可以通过通过引用参数来改进 `my_find()`：\n\n点击此此处查看代码图像\n\
  \n`int my_find(const vector<string>& vs, const string& s);`\n\n`my_find()` 在 `vs`\
  \ 中搜索 `s`。常量引用传递是一种有用且常用的机制。但如果我们想要 `my_find()` 修改参数呢？例如，我们可能想要一个 `init()` 来给向量赋值：\n\
  \n点击此此处查看代码图像\n\n`void init(vector<string>& v, string s);`\n\n`init()` 将 `s` 赋值给\
  \ `v`。在这里，我们想要 `init()` 修改向量，所以我们没有复制（没有使用值传递），也没有声明常量引用（没有使用常量引用传递），而是简单地传递了一个“普通”引用。\n\
  \n引用传递在传递较小的值（如 `int`、`double` 或 `Token`）时是简单、直接且高效的。但如果值很大，例如一个图像（通常有数百万位）、一个巨大的数值表（例如，数千个整数）或一个长字符串（例如，数百个字符）呢？那么，复制可能会是非常昂贵的。我们不应该执着于代价，但做不必要的工作是很尴尬的，因为这表明我们没有直接表达自己想要实现的意图。例如，我们可以写这样一个函数来打印浮点数向量：\n\
  \n点击此此处查看代码图像\n\n```cpp\nvoid print(vector<double> v)             // 值传递；合适吗？\n\
  {\n    cout << \"{ \";\n    for (int i = 0; i<v.size(); ++i) {\n        cout <<\
  \ v[i];\n        if (i!=v.size()–1) cout << \", \";\n    }\n    cout << \" }\\n\"\
  ;\n}\n```\n\n我们可以用这个 `print()` 用于所有大小的向量。例如：\n\n点击此此处查看代码图像\n\n```cpp\nvoid f(int\
  \ x)\n{\n    vector<double> vd1(10);          // 小向量\n    vector<double> vd2(1000000);\
  \     // 大向量\n    vector<double> vd3(x);           // 某种大小的向量\n    // . . 用值填充 vd1,\
  \ vd2, vd3 . .\n    print(vd1);\n    print(vd2);\n    print(vd3);\n}\n```\n![Image](img/005.jpeg)\n\
  \n这段代码可以工作，但 `print()` 的第一次调用必须复制十个浮点数（可能是 80 字节），第二次调用必须复制百万个浮点数（可能是 8 兆字节），而我们不知道第三次调用需要复制多少。我们在这里必须问自己的问题是：“我们为什么要复制？”我们想要打印向量，而不是创建它们元素的副本。显然，有一种方法让我们在不进行复制的情况下将变量传递给函数。作为一个类比，如果你被赋予了列出书单的任务，管理员不会给你寄一栋建筑及其所有内容的副本；他们会给你图书馆的地址，这样你就可以去查看书籍。因此，我们需要一种方法给我们的\
  \ `print()` 函数提供向量的“地址”，而不是向量的副本。这种“地址”被称为引用，其使用方式如下：\n\n点击此此处查看代码图像\n\n```cpp\n\
  void print(const vector<double>& v)  // 常量引用传递\n{\n    cout << \"{ \";\n    for\
  \ (int i = 0; i<v.size(); ++i) {\n        cout << v[i];\n        if (i!=v.size()–1)\
  \ cout << \", \";\n    }\n    cout << \" }\\n\";\n}\n```\n\n`&` 意味着“引用”，而 `const`\
  \ 的作用是防止 `print()` 意外修改其参数。除了参数声明发生了变化外，其他都与之前相同；唯一的区别是 `print()` 不再在副本上操作，而是通过引用引用回参数。注意“引用回（refer\
  \ back）”这个短语；此类参数被称为引用，是因为它们“引用”了其他地方的对象。我们可以像以前一样调用这个 `print()`：\n\n点击此此处查看代码图像\n\
  \n```cpp\nvoid f(int x)\n{\n    vector<double> vd1(10);          // 小向量\n    vector<double>\
  \ vd2(1000000);     // 大向量\n    vector<double> vd3(x);           // 某种大小的向量\n  \
  \  // . . 用值填充 vd1, vd2, vd3 . .\n    print(vd1);\n    print(vd2);\n    print(vd3);\n\
  }\n```\n\n我们可以通过图示来说明：\n\n![Image](img/005.jpeg)\n\n常量引用有一个实用的属性，即我们无法意外修改传递的对象。例如，如果我们在\
  \ `print()` 内部犯了一个级错误并尝试给元素赋值，编译器会捕获它：\n\n点击此此处查看代码图像\n\n```cpp\nvoid print(const\
  \ vector<double>& v)  // 常量引用\n{\n    // . . .\n    v[i] = 7;                  \
  \      // 错误：v 是常量\n}\n```\n\n\n\n\n引用的这一关键属性——即引用可以作为某些对象的方便简写——使得它们作为参数使用时非常有用。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\n// 按引用传递（让函数引用回传递的变量）\n\nint f(int& x)\n{\n    x = x+1;\n\
  \    return x;\n}\n\nint main()\n{\n    int xx = 0;\n    cout << f(xx) << '\\n';\
  \              // 输出: 1\n    cout << xx << '\\n';                  // 输出: 1; f()\
  \ 修改了 xx 的值\n    int yy = 7;\n    cout << f(yy) << '\\n';              // 输出: 8\n\
  \    cout << yy << '\\n';                  // 输出: 8; f() 修改了 yy 的值\n}\n```\n\n我们可以像这样来说说明按引用传递参数的过程：\n\
  \n![Image](img/00057.jpeg)\n\n将其与 §8.5.3 中的类似示例进行对比。\n\n![Image](img/00005.jpeg)\n\
  \n按引用显然显然非常强大的机制：我们可以让函数直接操作我们传递给它的引用的任何对象。例如，交换两个值是许多算法（如排序）中至关重要的操作。使用引用，我们可以编写这样一个交换两个\
  \ `double` 的函数：\n\n点击此处查看代码图像\n\n```cpp\nvoid swap(double& d1, double& d2)\n{\n\
  \    double temp = d1;              // 将 d1 的值拷贝给 temp\n    d1 = d2;           \
  \            // 将 d2 的值拷贝给 d1\n    d2 = temp;                     // 将 d1 的值拷贝给\
  \ d2\n}\n\nint main()\n{\n    double x = 1;\n    double y = 2;\n    cout << \"x\
  \ == \" << x << \" y== \" << y << '\\n'; // 输出: x==1 y==2\n    swap(x,y);\n    cout\
  \ << \"x == \" << x << \" y== \" << y << '\\n'; // 输出: x==2 y==1\n}\n```\n\n标准库为每个可以拷贝的类型都提供了\
  \ `swap()`，因此你不需要为每种类型都编写 `swap()`。\n\n#### 8.5.6 按值传递 vs. 按引用传递\n\n何时应该使用按值传递、按引用传递以及按常量引用传递？首先考虑一个技术性示例：\n\
  \n点击此处查看代码图像\n\n```cpp\nvoid f(int a, int& r, const int& cr)\n{\n    ++a; // 修改局部\
  \ a\n    ++r; // 修改 r 所引用的对象\n    ++cr; // 错误: cr 是 const\n}\n```\n\n如果你想更改传递的对象的值，必须使用**非-const\
  \ 引用**：按值传递会给你一个副本，而按常量引用传递会阻止你修改所传递对象的值。因此，我们可以尝试：\n\n点击此处查看代码图像\n\n```cpp\nvoid\
  \ g(int a, int& r, const int& cr)\n{\n    ++a; // 修改局部 a\n    ++r; // 修改 r 所引用的对象\n\
  \    int x = cr; // 读取 cr 所引用的对象\n}\n\nint main()\n{\n    int x = 0;\n    int y\
  \ = 0;\n    int z = 0;\n    g(x,y,z); // x==0; y==1; z==0\n    g(1,2,3); // 错误:\
  \ 引用参数 r 需要一个变量来供引用\n    g(1,y,3); // 确定: 既然 cr 是 const，我们可以传递一个字面量\n}\n```\n\n\
  所以，如果你想更改一个通过引用传递的对象的值，你必须传递一个对象。从技术上讲，整数字面量 `2` 仅仅是一个值（右值），而不是一个持有该值的对象。`g()` 的参数\
  \ `r` 需要的是一个**左值（lvalue）**，即可以出现在赋值语句左侧的东西。请注意，常量引用不需要左值。它可以执行与按值传递完全相同的类型转换。基本上，在最后一次调用\
  \ `g(1,y,3)` 中，编译器为 `g()` 的参数 `cr` 预留了一个 `int` 用于引用：\n\n点击此处查看代码图像\n\n```cpp\ng(1,y,3);\
  \ // 意味着: int compiler_generated = 3\n```\n\n这种编译器生成的对象被称为*临时对象（temporary object）*或简称为*临时对象（temporary）*。我们的经验法则是：\n\
  \n![Image](img/00006.jpeg)\n\n1. 使用按值传递传递小对象。\n2. 使用按常量引用传递不需要修改的大对象。\n3. 返回结果，而不是通过引用修改对象。\n\
  4. 仅在必须时才使用按引用传递。\n\n这些规则能产生最简单、最不容易出错且最高的代码。我们所说的“非常小”是指一个或两个 `int`、一个或两个 `double`\
  \ 或类似的东西。如果我们看到一个通过非-const 引用传递的参数，我们必须假设被调用函数会修改该参数。\n\n第三条规则反映了当你想要使用函数来更改变量的值时，你有选择权。考虑：\n\
  \n点击此处查看代码图像\n\n```cpp\nint incr1(int a) { return a+1; } // 返回新值作为结果\nvoid incr2(int&\
  \ a) { ++a; } // 修改按引用传递的对象\nint x = 7;\nx = incr1(x); // 显而易见\nincr2(x); // 比较晦涩\n\
  ```\n\n![Image](img/00005.jpeg)\n\n我们为什么要使用非-const 引用参数？偶尔，它们是必不可少的：\n- 对于容器（例如\
  \ `vector`）和其他大对象\n- 对于改变多个对象的函数（我们可以有多个这样的引用）\n\n例如：\n\n点击此处查看代码图像\n\n```cpp\n\
  void larger(vector<int>& v1, vector<int>& v2)\n    // 将 v1 中的每个元素变为 v1 和 v2 中对应元素的较大值\n\
  if (v1.size()v2.size()) error(\"different sizes\");\nfor (int i=0; i<v1.size();\
  \ ++i)\n        if (v1[i]<v2[i])\n            swap(v1[i],v2[i]);\n}\n\nvoid f()\n\
  {\n    vector<int> vx;\n    vector<int> vy;\n    // 从输入读取 vx 和 vy\n    larger(vx,vy);\n\
  \    // . .\n}\n```\n\n如果我们仅仅是为了避免拷贝而使用引用，我们就会使用常量引用。因此，当我们看到非-const 引用时，我们假设函数会更改其参数的值；也就是说，当我们看到按常量引用传递时，我们必须额外仔细检查调用处，以确保它符合我们的预期。\n\
  \n#### 8.5.7 参数检查与转换\n\n传递参数是用函数的形式参数对调用中指定的实际参数进行初始化。考虑：\n\n点击此处查看代码图像\n\n```cpp\n\
  void f(T x);\n\nf(y);\n\nT x = y; // 用 y 初始化 x（见§8.2.2）\n```\n\n只要初始化 `T x=y;` 是合法的，调用\
  \ `f(y)` 就是合法的，并且当合法时两个 x 得到相同的值。例如：\n\n点击此处查看代码图像\n\n```cpp\nvoid f(double x);\n\
  \nvoid g(int y)\n{\n    f(y);\n    double x = y; // 用 y 初始化 x（见§8.2.2）\n}\n```\n\
  \n\n\n\n注意，为了用 `y` 初始化 `x`，我们必须将一个 `int` 转换为 `double`。在调用 `f()` 时情况也是如此的。`f()` 接收到的\
  \ `double` 值与存储在 `x` 中的值相同。\n\n![Image](img/00007.jpeg)\n\n转换通常很有用，但偶尔会产生出乎意的结果（参见\
  \ §3.9.2）。因此，我们在处理它们时必须小心。将 `double` 作为参数传递给需要 `int` 的函数通常不是好主意：\n\n点击此处查看代码图片\n\
  \n```cpp\nvoid ff(int x);\n\nvoid gg(double y)\n{\n    ff(y);             // 你如何知道这是否合理？\n\
  \    int x = y;          // 你如何知道这是否合理？\n}\n```\n\n如果你确实想将一个 `double` 值截断为 `int`，请明确地写出来：\n\
  \n点击此处查看代码图片\n\n```cpp\nvoid ggg(double x)\n{\n    int x1 = x;                 \
  \        // 截断 x\n    int x2 = int(x);\n    int x3 = static_cast<int>(x);      //\
  \ 非常显式的转换 (§17.8)\n    ff(x1);\n    ff(x2);\n    ff(x3);\n    ff(x);           \
  \                   // 截断 x\n    ff(int(x));\n    ff(static_cast<int>(x));     \
  \      // 非常显式的转换 (§17.8)\n}\n```\n\n这样，下一个查看这段代码的程序员就能看到你考虑过这个问题。\n\n### 8.5.8\
  \ 函数调用的实现\n\n但计算机到底是如何执行函数调用的？来自 6 章和 7 章的`expression()`、`term()`和`primary()` 函数非常适合说明这一点，但有一个细节除外：它们不接受任何参数，所以我们无法用它们来解释参数是如何传递的。等一下！它们*必须*接受某些输入；如果没有，它们就无法做任何有用的事情。它们确实接受一个隐式参数：它们使用一个名为\
  \ `ts` 的 `Token_stream` 来获取输入；`ts` 是一个全局变量。这有点狡猾。我们可以通过让它们接受 `Token_stream&` 参数来改进这些函数。这里是添加了\
  \ `Token_stream&` 参数并删除了所有与函数调用实现无关的内容：\n\n首先，`expression()` 完全直观；它有一个参数（`ts`）和两个局部变量（`left`\
  \ 和 `t`）：\n\n点击此处查看代码图片\n\n```cpp\ndouble expression(Token_stream& ts)\n{\n    double\
  \ left = term(ts);\n    Token t = ts.get();\n    // . . .\n}\n```\n\n其次，`term()`\
  \ 与 `expression()` 非常相似，它有一个额外的局部变量（`d`），用于存储 `/` 的除数的结果：\n\n点击此处查看代码图片\n\n```cpp\n\
  double term(Token_stream& ts)\n{\n    double left = primary(ts);\n    Token t =\
  \ ts.get();\n    // . . .\n    case '/':\n    {\n        double d = primary(ts);\n\
  \        // . . .\n    }\n    // . . .\n}\n```\n\n第三，`primary()` 与 `term()` 非常相似，只是它没有局部变量\
  \ `left`：\n\n点击此处查看代码图片\n\n```cpp\ndouble primary(Token_stream& ts)\n{\n    Token\
  \ t = ts.get();\n    switch (t.kind) {\n        case '(':\n        {\n         \
  \   double d = expression(ts);\n            // . . .\n        }\n        // . .\
  \ .\n    }\n}\n```\n\n现在，它们不再使用任何“狡猾的全局变量”，并且非常适合我们的说明：它们有参数，有局部变量，并且相互调用。你可能想借此机会复习一下完整的\
  \ `expression()`、`term()` 和 `primary()` 的样子，但就函数调用而言，主要的特征在这里呈现。\n\n![Image](img/00005.jpeg)\n\
  \n当函数被调用时，语言实现会开留一个包含所有参数和局部变量副本的数据结构。例如，当第一次调用 `expression()` 时，编译器确保创建一个类似所示的结构：\n\
  \n![Image](img/00058.jpeg)\n\n“实现相关的的内容”随实现而异，但那基本上是函数需要返回给其调用者以及向其调用者返回值的信息。这种数据结构被称为函数激活记录（function\
  \ activation record），每个函数都有其激活记录的详细布局。请注意，从实现的角度来看，参数仅仅是另一个局部变量。\n\n到目前为止一切顺利，现在\
  \ `expression()` 调用了 `term()`，因此编译器确保为这次 `term()` 调用生成一个激活记录：\n\n![Image](img/00059.jpeg)\n\
  \n注意，`term()` 有一个额外的变量 `d` 需要存储，因此即使代码可能永远不会使用它，我们在调用中也预留了空间。这没关系。对于合理的函数（例如我们在书中直接或间接使用的每个函数），放置函数激活记录的运行时成本并不取决于它的大小。局部变量\
  \ `d` 只有在执行它的 case `/` 时才会被初始化。\n\n现在 `term()` 调用 `primary()`，我们得到\n\n![Image](img/00060.jpeg)\n\
  \n这开始变得有些重复，但现在 `primary()` 调用了 `expression()`：\n\n![Image](img/00061.jpeg)\n![Image](img/00005.jpeg)\n\
  \n因此，这次 `expression()` 调用获得了它自己的激活记录，与第一次 `expression()` 调用不同。这是好事，否则我们就会陷入糟糕的混乱中，因为\
  \ `left` 和 `t` 在两次调用中是不同的。直接或（如此处）间接调用自身的函数被称为递归函数（recursive）。\n\n\n\n\n\n```cpp\n\
  void user(Point p1)\n{\n    Point p2 {10,10};\n    Point p3 = scale(p1);     //\
  \ OK: p3 == {100,8}; run-time evaluation is fine\n    Point p4 = scale(p2);    \
  \ // p4 == {100,8}\n    constexpr Point p5 = scale(p1);   // error: scale (p1) is\
  \ not a constant expression\n    constexpr Point p6 = scale(p2);   // p6 == {100,8}\n\
  // . . .\n}\n```\n\n`constexpr` 函数的行为得与普通函数完全一致，直到你需要在需要常量的地方使用它。届时，只要其参数是常量表达式（例如\
  \ `p2`），它就会编译时进行计算；如果参数不是常量表达式（例如 `p1`），则会报错。为了实现这一点，`constexpr` 函数必须足够简单，以便编译器（每一个符合标准的编译器）都能对其求值。在\
  \ C++11 中，这意味着 `constexpr` 函数的函数体必须由单个返回语句组成（如 `scale()`）；在 C++14 中，我们也可以编写简单的循环。`constexpr`\
  \ 函数不能有副作用；也就是说，它不能更改其函数体外部变量的值，除非这些变量被赋值给它或用于初始化它。\n\n为了简单起见，这里有一个违反这些规则的函数示例：\n\
  \n点击此处查看代码图像\n\n```cpp\nint gob = 9;\nconstexpr void bad(int & arg)       // error:\
  \ no return value\n{\n    ++arg;                          // error: 通过参数修改调用者\n\
  \    glob = 7;                       // error: 修改非局部变量\n}\n```\n\n如果编译器无法确定一个 `constexpr`\
  \ 函数“足够简单”（根据标准中的详细规则），则该函数被视为错误。\n\n### 8.6 求值顺序\n\n![Image](img/00005.jpeg)\n\n\
  程序的求值——也称为程序的执行——是根据语言规则通过语句进行的。当这条“执行线程”到达变量的定义处时，变量就会被构造；也就是说，为对象分配内存并初始化对象。当变量离开作用域时，变量就会被销毁；也就是说，它所引的对象在原则上被移除，编译器可以将其内存用于其他他处。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nstring program_name = \"silly\";\nvector<string> v;    \
  \                           // v 是全局变量\nvoid f()\n{\n    string s;             \
  \                  // s 是 f 的局部变量\n    while (cin>>s && s!=\"quit\") {\n       \
  \ string stripped;                    // stripped 是循环局部变量\n        string not_letters;\n\
  \        for (int i=0; i<s.size(); ++i)   // i 有语句\n            if (isalpha(s[i]))\n\
  \                stripped += s[i];\n        else\n            not_letters += s[i];\n\
  \        v.push_back(stripped);           // . . .\n    }                      \
  \             // . . .\n}\n```\n\n全局变量（如 `program_name` 和 `v`）在 `main()` 的第一个语句执行之前初始化。它们会一直“生存”到程序结束，然后被销毁。它们按照定义的顺序进行构造（即\
  \ `program_name` 在 `v` 之前），并按照反序进行销毁（即 `v` 在 `program_name` 之前）。\n\n当有人调用 `f()`\
  \ 时，首先构造 `s`；也就是说，`s` 初始化为空字符串。它将一直生存到我们从 `f()` 返回。\n\n每当我们进入 `while` 语句体的块时，`stripped`\
  \ 和 `not_letters` 都会被构造。由于 `stripped` 定义在 `not_letters` 之前，因此 `stripped` 在 `not_letters`\
  \ 之前构造。它们一直生存到循环结束，在构造顺序的反序被销毁（即 `not_letters` 在 `stripped` 之前），然后重新求值条件。因此，如果在我们遇到字符串\
  \ `quit` 之前看到了十个字符串，`stripped` 和 `not_letters` 将各被构造和销毁十次。\n\n每当我们到达 `for` 语句时，`i`\
  \ 被构造。每当我们退出 `for` 语句时，`i` 在在我们到达 `v.push_back(stripped)` 语句之前被销毁。\n\n请注意，编译器（和链接器）是聪明的家伙，只要结果与我们在这里描述的等效，它们被允许并且确实会优化代码。特别是编译器非常擅长避免比实际需要频繁地分配和释放内存。\n\
  \n#### 8.6.1 表达式求值\n\n![Image](img/00007.jpeg)\n\n子表达式的求值顺序由规则支配，这些规则是为了取悦优化器而不是为了让程序员的生活变得简单。这很遗憾，但你仍然应该避免复杂的表达式，并且有一个简单的规则可以让你避免麻烦：如果你在表达式中更改了变量的值，不要在同一个表达式中读写两次它。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nv[i] = ++i;                          // 不要：求值顺序未定义\nv[++i]\
  \ = i;\nint x = ++i + i;                     // 不要：求值顺序未定义\ncout << ++i << ' ' <<\
  \ i << '\\n';    // 不要：求值顺序未定义\nf(++i,++i);                         // 不要：求值顺序未定义\n\
  ```\n\n遗憾的是，并不是所有的编译器在你写此类代码时都会警告；这是很的，因为如果你将代码移动到另一台计算机、使用不同的编译器或使用不同的优化器设置，你就无法依赖这些结果。特别注意，`=`（赋值）被视为表达式中的另一个运算符，因此不能保证赋值的左侧会在右侧之前被求值。这就是为什么\
  \ `v[++i] = i` 是未定义的。\n\n#### 8.6.2 全局初始化\n\n单个编译单元中的全局变量（以及命名空间变量；参见 8.7）按照它们出现的顺序进行初始化。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\n// file f1.cpp\nint x1 = 1;\nint y1 = x1+2;            \
  \          // y1 变为 3\n```\n\n这种初始化在逻辑上发生在“main() 中的代码执行之前”。\n\n在极有限的情况下使用全局变量通常不是一个好主意。我们提到过程序员没有真正有效的方法了解大型程序的哪些部分在读取/或写入全局变量的问题（8.4）。另一个问题是不同编译单元之间全局变量的初始化顺序是没有定义的。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\n// file f2.cpp\nextern int y1;\nint y2 = y1+2;         \
  \             // y2 变为 2 或 5\n```\n\n出于几个原因应避免这种代码：它使用了全局变量、变量了短名称，并使用了复杂的全局初始化。如果\
  \ $f1.cpp$ 中的全局变量在 $f2.cpp$ 之前初始化，`y2` 将初始化为 5（正如程序员可能天真且合理地预期的那样）。然而，如果 $f2.cpp$\
  \ 中的全局变量在 $f1.cpp$ 之前初始化，`y2` 将初始化为 2（因为在尝试复杂的初始化之前，用于全局变量的内存会被初始化为 0）。\n\n\n\n\n\
  但如果你真的需要一个带有复杂初始化器的全局变量（或常量），该怎么办呢？一个合理的例子是，我们想为为一个支持业务交易的库提供的 `Date` 类型设置一个默认值：\n\
  \n点击此处查看代码图像\n\n```cpp\nconst Date default_date(1970,1,1); // 默认日期是 1970 年 1 月 1\
  \ 日\n```\n\n我们如何知道 `default_date` 在初始化之前从未被使用过呢？基本上，我们无法获知，所以我们不应该写那个定义。我们最常用的技巧是调用一个返回该值的函数。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nconst Date default_date() // 返回默认日期\n{\n    return Date(1970,1,1);\n\
  }\n```\n\n![Image](img/00006.jpeg)\n\n这会在每次调用 `default_date()` 时都构造一个 `Date` 对象。这通常没问题，但如果\
  \ `default_date()` 被频繁调用且构造 `Date` 的代价很高，我们可能希望只构造一次 `Date`。做法如下：\n\n点击此处查看代码图像\n\
  \n```cpp\nconst Date& default_date()\n{\n    static const Date dd(1970,1,1); //\
  \ 在第一次进入此地时初始化 dd\n    return dd;\n}\n```\n\n静态局部变量只会在其函数第一次被调用时进行初始化（构造）。注意，我们返回一个引用是为了消除不必要的拷贝，特别是我们返回了一个\
  \ `const` 引用，以防止调用函数意外修改该值。关于如何传递参数的讨论 (§8.5.6) 同样适用于返回值。\n\n## 8.7 命名空间\n\n我们使用代码块来组织函数内部的代码（§8.4)）。我们使用类将函数、数据和类型组织成一个类型（第\
  \ 9 章）。函数和类都为我们做了两件事情：\n\n- 它们允许我们定义许多“实体”，而不必担心它们的名称与程序中的其他名称冲突。\n- 它们给了我们一个名称来引用我们所定义的内容。\n\
  \n![Image](img/00005.jpeg)\n\n我们目前缺乏的是某种机制，可以将类、函数、数据和类型组织成程序中可识别且命名的部分，而无需定义类型。这种声明分组的语言机制是\
  \ `namespace`（命名空间）。例如，我们可能想为一个图形库提供名为 `Color`、`Shape`、`Line`、`Function` 和 `Text`\
  \ 的类（参见第 13 章）：\n\n点击此处查看代码图像\n\n```cpp\nnamespace Graph_lib {\n    struct Color\
  \ { /* . . . */ };\n    struct Shape { /* . . . */ };\n    struct Line : Shape {\
  \ /* . . . */ };\n    struct Function : Shape { /* . . . */ };\n    struct Text\
  \ : Shape { /* . . . */ };\n    // . . .\n    int gui_main() { /* . . . */ }\n}\n\
  ```\n\n可能世界上其他人已经用过了这些名字，但现在这不重要了。你可以定义一个名为 `Text` 的东西，但我们的 `Text` 不会干扰。`Graph_lib::Text`\
  \ 是我们的类之一，而你的 `Text` 不是。只有当你有一个名为 `Graph_lib` 的类或命名空间，且 `Text` 是其成员时，我们才会遇到问题。`Graph_lib`\
  \ 是一个有点丑的名字；我们选择它是因为“漂亮且直观”的名称 `Graphics` 更有可能已经在某处被占用了。\n\n假设你的 `Text` 是一个文本处理库的一部分。让我们把图形设施放入\
  \ `Graph_lib` 命名空间中的逻辑，也应该让你把文本处理设施放在一个类似 `TextLib` 的命名空间中：\n\n点击此处查看代码图像\n\n```cpp\n\
  namespace TextLib {\n    class Text { /* . . . */ };\n    class Glyph { /* . . .\
  \ */ };\n    class Line { /* . . . */ };\n    // . . .\n}\n```\n\n如果我们都使用全局命名空间，我们就会遇到麻烦。同时使用我们两个库的人会在\
  \ `Text` 和 `Line` 上遇到真正的名称冲突。更糟糕的是，如果我们的库都有用户，他们将无法更改我们的名称（如 `Line` 和 `Text`）来避免冲突。我们通过使用命名空间避免了这个问题；也就是说，我们的是\
  \ `Graph_lib::Text`，而你的 `TextLib::Text`。一个由命名空间名（或类名）和成员名通过 `::` 组合而成的名称被称为完全限定名（fully\
  \ qualified name）。\n\n### 8.7.1 using 声明和 using 指令\n\n编写完全限定名可能很繁琐。例如，C++ 标准库的设施定义在\
  \ `std` 命名空间中，可以像这样使用：\n\n点击此处查看代码图像\n\n```cpp\n#include <string>\n#include <iostream>\n\
  int main() {\n    std::string text;\n    std::cout << \"Hello, \" << text << std::endl;\n\
  \    return 0;\n}\n```\n\n但如果使用 `using` 声明，可以这样写：\n\n点击此处查看代码图像\n\n```cpp\n#include\
  \ <string>\n#include <iostream>\nusing std::string;\nusing std::cout;\nint main()\
  \ {\n    string text;\n    cout << \"Hello, \" << text << std::endl;\n    return\
  \ 0;\n}\n```\n\n如果使用 `using` 指令，则可以更简单：\n\n点击此处查看代码图像\n\n```cpp\n#include <string>\n\
  #include <iostream>\nusing namespace std;\nint main() {\n    string text;\n    cout\
  \ << \"Hello, \" << text << endl;\n    return 0;\n}\n```\n\n\n\n源文件 `use.cpp` 包含了\
  \ `my.h`，定义了 `main()` 将 `foo` 的值设置为 `7` 并使用 `print_foo()` 打印它，并使用 `print()` 打印值\
  \ `99`。注意，`use.cpp` 没有包含 `std_lib_facilities.h`，因为它没有直接使用其中的任何一个设施。\n\n编译并运行这些文件。在\
  \ Windows 上，你需要在项目中同时包含 `use.cpp` 和 `my.cpp`，并在 `use.cpp` 中使用 `{ char cc; cin>>cc;\
  \ }` 才能看到你的输出。提示：你需要 `#include <iostream>` 才能使用 `cin`。\n\n**2.** 编写三个函数 `swap_v(int,int)`、`swap_r(int&,int&)`\
  \ 和 `swap_cr(const int&, const int&)`。每个函数的体都应为：\n\n```cpp\n{ int temp; temp = a,\
  \ a=b; b=temp; }\n```\n\n其中 `a` 和 `b` 是参数的名字。\n\n尝试如下调用每个 swap：\n\n点击此处查看代码图像\n\n\
  ```cpp\nint x = 7;\nint y = 9;\nswap_?(x,y);             //用 ? 替换为 v, r, 或 cr\n\
  swap_?(7,9);\n\nconst int cx = 7;\nconst int cy = 9;\nswap_?(cx,cy);\nswap_?(7.7,9.9);\n\
  \ndouble dx = 7.7;\ndouble dy = 9.9;\nswap_?(dx,dy);\nswap_?(7.7,9.9);\n```\n\n\
  哪些函数和调用编译通过了？为什么？在每个编译通过的 swap 之后，打印参数的值以查看它们是否真的被交换了。如果你对某个结果感到惊讶，请参阅 §8.6。\n\n\
  **3.** 使用包含三个命名空间 `X`、`Y` 和 `Z` 的单文件编写一个程序，使得以下 `main()` 能够正确工作：\n\n点击此处查看代码图像\n\
