  \ 最初于 1958 年由约翰·麦卡锡（John McCarthy）在麻省理工学院设计，用于链表和符号处理（因此得名：“LISt Processing”）。最初的\
  \ Lisp 是解释型且如今仍常以解释方式运行而非编译。有几十种甚至数百种的 Lisp 方言存在；事实上人们常说“LiSP 本身已然隐含复数形式”。当前最流行的两种分别是\
  \ Common LiSp 及 Scheme 。该系列长期以来一直支撑着人工智(`AI`)研究领域的发展尽管实际交付的产品往往采用 C 或++编写).而激发它诞生的主要源泉之一便是数学上被称为\
  \ lambda 演算的概念！\n\n福传兰( For tr an )与科博尔则是特意为解决各自应用领域的现实问题所创造出来的成果;相比之下 l 软件社区则更关注于编码自身以及程序优雅度—这种努力通常都获得了成功\
  \ ：它是第一个将其定义同硬件剥离并基于某种数理形态构建语义体系 ;至于具体适用方向就很难准确定义—“人工智能”“符合计算不像商业数据处理或者科学计那样可以清晰映射到日常操作中去”；它的思想及相关群体痕迹随处可见尤其是各式各样的现代函数式言语中！！\n\
