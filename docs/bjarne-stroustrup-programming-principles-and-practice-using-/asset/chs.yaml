  \n#### 3.9.1 安全转换\n\n在 §3.4 中，我们看到不能直接相加 chars 或将 `double` 与 `int` 比较。然而，C++ 提供了一种间接方法来完成这两者。需要时，`char`\
  \ 被转换为 `int`，`int` 被转换为 `double`。例如：\n\n```cpp\nchar c = 'x';\nint i1 = c;\nint\
  \ i2 = 'x';\n```\n\n这里 `i1` 和 `i2` 得到值 `120`，这是在最流行的 8 位字符集中 `'x'` 的整数值。这是获取字符数值表示形式的一种简单且安全的方法。我们称之为\
  \ char 到 int 的转换，因为没有信息丢失；也就是说，我们可以将生成的 `int` 拷贝回 `char` 并获得原始值：点击此处查看代码图像\n\n```cpp\n\
  char c2 = i1;\ncout << c << i1 << c2 << '\\n'; // 将打印 x\n```\n\n在这种意义上，char 到 int\
  \ 的转换是安全的，因为没有信息丢失；也就是说，我们可以将生成的 `int` 拷贝回 `char` 并获得原始值：\n\n- `bool` to `char`\n\
  - `bool` to `int`\n- `bool` to `double`\n- `char` to `int`\n- `char` to `double`\n\
  \n在这种意义上，char 到 int 的转换是安全的，因为没有信息丢失；也就是说，我们可以将生成的 `int` 拷贝回 `char` 并获得原始值：\n\n\
  ```cpp\nchar c2 = i1;\ncout << c << i1 << c2 << '\\n'; // 将打印 x\n```\n\n*(抱歉，由于生成逻辑异常，上述内容存在大量重复。请以最下方的完整译文为准。)*\n\
  \n\n\n\n使用各种输入运行此程序。尝试较小的值（例如 2 和 3）；尝试大值（大于 127，大于 1000）；尝试负值；尝试 56；尝试 89；尝试 128；尝试非整数值（例如\
  \ 56.9 和 56.2）。此程序不仅向你展示你的机器上如何进行从 `double` 到 `int` 以及从 `int` 到 `char` 的转换，还会向你展示对于给定的整数值，你的机器会打印什么字符（如果有的话）。\n\
  \n你会发现许多输入值会产生“不合理”的结果。基本上，我们正试图将一加仑的水放入品品杯中（大约 4 升水放入一个 500ml 的玻璃杯）。所有的转换：\n\n\
  - `double` 到 `int`\n- `double` 到 `char`\n- `double` 到 `bool`\n- `int` 到 `char`\n\
  - `int` 到 `bool`\n- `char` 到 `bool`\n\n![Image](img/00007.jpeg)\n\n即使这些转换是不安全的，编译器也会接受它们。这种“不安全”的意思在于，存储的值可能与赋值的值不同。为什么这会成为一个问题？因为我们通常不会怀疑正在发生不安全的转换。考虑：\n\
  \n点击此处查看代码图片\n\n```cpp\ndouble x = 2.7;\n\n// 很多代码\n\nint y = x; // y 变为 2\n```\n\
  \n当我们定义 `y` 时，可能已经忘记了 `x` 是一个 `double`，或者我们可能暂时忘记了 `double` 到 `int` 的转换会截断（始终向零舍入），而不是使用传统的\
  \ 4/5 舍入法。发生的情况是完全可以预测的，但 `int y = x;` 中没有任何东西能提醒我们信息（.7）被丢弃了。\n\n从 `int` 到 `char`\
  \ 的转换没有截断问题——`int` 或 `char` 无法表示整数的小数。然而，`char` 只能存放非常小的整数值。在 PC 上，`char` 是 1 字节，而\
  \ `int` 是 4 字节：\n\n![Image](img/00030.jpeg)![Image](img/00007.jpeg)\n\n所以，我们不能将像\
  \ 1000 这样的大数字放入 `char` 而不丢失信息：该值被“窄”了。例如：\n\n点击此处查看代码图片\n\n```cpp\nint a = 1000;\n\
  \nchar b = a; // b 变为 –24（在某些机器上）\n```\n\n并不是所有的 `int` 值都有对应的 `char` 值，且 `char`\
  \ 值的精确范围取决于具体的实现。在 PC 上，`char` 值的范围是 [–128:127]，但只有 [0:127] 可以跨平台地使用，因为不是每台计算机都是\
  \ PC，而且不同的计算机其 `char` 值的范围不同，例如 [0:255]。\n\n![Image](img/00005.jpeg)\n\n为什么人们接受窄化转换的问题？主要原因是历史原因：C++\
  \ 从它的祖先语言 C 那里继承了窄化转换，因此从 C++ 的第一天起，就存在大量依赖窄化转换的代码。此外，许多此类转换实际上并没有引起问题，因为涉及的值恰好在范围内，而且许多程序员反对编译器“告诉他们该做什么”。特别是，不安全转换产生的问题在小型程序中对于经验丰富的程序员来说通常是可控的。尽管如此，在较大的程序中它们可能是错误的来源，也是初学者产生问题的一个重要原因。然而，编译器可以对窄化转换发出警告——许多编译器确实可以。\n\
  \nC++11 引入了一种初始化符号，禁止了窄化转换。例如，我们可以（也应该）使用 `{}` 列表符号而不是 `=` 符号来重写上面那些有麻烦的示例：\n\n\
  点击此处查看代码图片\n\n```cpp\ndouble x {2.7}; // OK\n\nint y {x};      // error: double\
  \ -> int 可能会窄化\n\nint a {1000};   // OK\n\nchar b {a};     // error: int -> char\
  \ 可能会窄化\n```\n\n当初始化器是整数字面量时，编译器可以检查实际值并接受不意味着窄化的值：\n\n点击此处查看代码图片\n\n```cpp\nint\
  \ char b1 {1000}; // error: narrowing (假设 char 是 8 位的)\n\nchar b2 {48};      //\
  \ OK\n```\n\n`int char b1 {1000};` // error: narrowing (假设 char 是 8 位的)\n`char b2\
  \ {48};` // OK\n\n\n\n\n\n# MiniMineMine 题目正确吗？\n\n**19.** 请给出五个合法但你不应该使用的名称的示例，因为它们可能会引起混淆。\n\
  \n**20.** 选择名称时一些好的规则？\n\n**21.** 什么是类型安全？它为什么重要？\n\n**22.** 为什么从 `double` 转换为 `int`\
  \ 可能是件坏事？\n\n**23.** 定义一个规则，帮助判断从一种类型到另一种类型的转换是安全的还是不安全的。\n\n### 术语\n\n- 赋值\n- cin\n\
  - 拼接\n- 转换\n- 声明\n- 递减 (decrement)\n- 定义\n- 递增\n- 初始化\n- 名称\n- 窄化\n- 对象\n- 操作\n\
  - 运算符\n- 类型\n- 类型安全\n- 值\n- 变量\n\n## 练习题\n\n**1** 如果你还没有做，请完成本章的**尝试一下（Try this）**练习题。\n\
  \n**2** 编写一个 C++ 程序，将英里转换为公里。你的程序应该包含一个合理的提示，让用户输入英里数。提示：1 英里等于 1.609 公里。\n\n**3**\
  \ 编写一个什么都不执行的程序，但声明了一些具有合法和不合法名称的变量（例如 `int double = 0;`），以便你可以看到编译器的反应。\n\n**4**\
  \ 编写一个程序，提示用户输入两个整数值。将这些值存储在名为 `val1` 和 `val2` 的 `int` 变量中。编写程序来确定这些值的最小值、最大值、和、差、乘积和比例，并将结果报告给用户。\n\
  \n**5** 修改上面的程序，要求用户输入浮点数并将它们存储在 `double` 变量中。针对你选择的某些输入，比较两个程序的输出。结果相同吗？它们应该相同吗？区别是什么？\n\
  \n**6** 编写一个程序，提示用户输入三个整数值，然后用逗号分隔按数值顺序输出这些值。例如，如果用户输入值 10 4 6，输出应为 4, 6, 10。如果两个值相同，它们应该排在一起。因此，输入\
  \ 4 5 4 应该给出 4, 4, 5。\n\n**7** 完成第 6 题，但使用三个字符串值。例如，如果用户输入值 Steinbeck, Hemingway,\
  \ Fitzgerald，输出应该是 Fitzgerald, Hemingway, Steinbeck。\n\n**8** 编写一个程序测试一个整数值以判断它是奇数还是偶数。一如既往，确保你的输出是清晰且完整的。换句话说，不要只输出\
  \ yes 或 no。你的输出应该是独立的，例如“数值 4 是一个偶数”。提示：参阅 §3.4 中的取余（模）运算符。\n\n**9** 编写一个程序，将拼写出来的数字（如“zero”和“two”）转换为数字（如\
  \ 0 和 2）。当用户输入数字时，程序应打印对应的数字。对 0, 1, 2, 3 和 4 执行此操作，并且如果用户输入了不对应的内容（例如 stupid computer!），则输出“一个我不认识的数字”。\n\
  \n**10** 编写一个程序，接收一个操作符后跟两个操作数并输出结果。例如：\n\n```\n+ 100 3.14\n* 4 5\n```\n\n将操作符读入名为\
  \ operation 的字符串中，并使用 if 语句确定用户想要什么操作，例如，如果 `(operation==\"+\")`。将操作数读入 `double`\
  \ 类型的变量中。实现 `+`、`–`、`*`、`/`、`plus`、`minus`、`mul` 和 `div` 等具有明显含义的操作。\n\n**11** 编写一个程序，提示用户输入数量的美分（1\
  \ 分）、尼尔（5 分）、法（（10 分）、硬币（25 分）、半美元硬币（50 分）和美元硬币（100 分）。以美元和分的形式输出总值。修改程序仅以分的形式输出总值。\n\
  \n## 4. 计算\n\n### 4.1 计算\n\n![图像](img/00005.jpeg)\n\n从一个角度来看，程序所做的一切其实就是计算；也就是说，它接受一些输入并产生一些输出。毕竟，我们把运行程序的硬件称为计算机。只要我们对什么是输入和输出有一个宽泛的观点，这个观点就是准确且合理的：\n\
  \n输入可以来自键盘、鼠标、触摸屏、文件、其他输入设备、其他程序、程序的程序的其他部分。“其他输入设备”是一个涵盖范围广泛的类别，包含了大多数有趣的输入源：音乐键盘、视频录像机、网络连接、温度传感器、数字相机图像传感器等。这种多样性本质上是无限的。\n\
  \n\n\n\n为了处理输入，程序通常包含一些数据，这些数据被称为其 `data structures`（数据结构）或 `state`（状态）。例如，一个日历程序可能包含不同国家的节假日列表以及你的预约列表。其中一些数据从程序开始就已经存在；另一些数据是在程序读取输入并从中收集有用信息时建立的。例如，日历程序可能会根据你提供的输入来构建你的预约列表。对于日历来说，主要的输入是你请求查看的月份和日期的请求（可能是通过鼠标点击）以及你提供给它进行记录的预约（可能是通过在键盘输入信息）。`output`（输出）则是日历和预约的显示，以及日历程序在你的屏幕上写的输入按钮和提示。\n\
  \n`Input`（输入）来自各种来源。同样，输出也可以流向各种目的地。输出可以是屏幕、文件、网络连接、其他输出设备、其他程序以及程序的其他部分。输出设备的示例包括网络接口、音乐合成器、电机、发光发生器、加热器等。\n\
  \n从编程的角度来看，最重要且有趣的类别是“与另一个程序之间的数据交换”以及“与程序的其他部分之间的数据交换”。本书的大部分内容都可以看作是在讨论最后一个类别：我们如何将程序表示为一组协作的部分，它们又如何共享和交换数据？这些是编程中的关键问题。我们可以通过图表来说明：\n\
  \n![Image](img/00032.jpeg)\n\n缩写 `I/O` 代表“输入/输出”。在这种情况下，一段代码的输出是另一部分代码的输入。此类“程序部分”共享的是存储在主内存中、持久化存储设备（如磁盘）上或通过网络连接传输的数据。我们所说的“程序部分”是指某些实体，例如从一组输入参数产生结果的函数（例如，从浮点数计算平方根）、对物理对象执行操作的函数（例如在屏幕上画线的函数），或者修改程序内部某些表格的函数（例如，向客户表中添加一个名称的函数）。\n\
  \n当我们说“输入”和“输出”时，我们通常指的是进入和离开计算机的信息，但正如你所看到的，我们也可以将这些术语用于程序部分接收或由其产生的信息。程序部分的输入通常被称为\
  \ `arguments`（参数），程序部分的输出通常被称为 `results`（结果）。\n\n通过 `computation`（计算），我们简单指的是根据某些输入产生某些输出的行为，例如使用计算（函数）`square`\
  \ 根据参数（输入）`7` 生成结果（输出）`49`（见 §4.5）。作为一个可能很有趣的知识，我们注意到，直到 20 世纪 50 年代，计算机被定义为执行计算的人员，例如会计师、导航员或物理学家。今天，我们简单地将大多数计算委托给各种形式的计算机（机器），其中口袋计算器是最简单的之一。\n\
  \n### 4.2 目标与工具\n\n![Image](img/00005.jpeg)\n\n我们作为程序员的工作是表达计算：\n\n* 正确\n* 简单\n\
  * 高效\n\n请注意这些理想状态的顺序：如果一个程序给出的结果是，无论它运行有多快都无关。同样，一个正确且高效的程序可能非常复杂，以至于必须丢弃或完全重写以产生新版本（发布）。记住，实用的程序将不断修改以适应新需求、新硬件等。因此，一个程序——以及程序的任何部分——应该尽可能简单地完成其任务。例如，假设你已经写好了一个为当地学校儿童教授基础算术的完美程序，但它的内部结构一团糟。你用什么语言与孩子们交流？英语？英语和西班牙语？如果我想在芬兰使用它呢？在科威特呢？你会如何改变用于与孩子交流的（自然）语言？如果程序的内部结构是一团糟，那么在逻辑上简单（但在实践中几乎总是非常困难）的改变用户交流自然语言的操作将变得不可逾越。\n\
  \n![Image](img/00006.jpeg)\n\n当我们开始为他人编写代码并承担做好这件事的责任时，对正确性、简单性和效率的关注就成了我们的首要任务；也就是说，当我们决定成为专业人士时，我们必须接受这种责任。在实际操作中，这意味着我们不能只是把代码堆在一起直到它们看起来可以运行；我们必须关注代码的结构。矛盾的是，对结构和“代码质量”的关注通常是让程序运行的最快方法。当编程得良好时，这些关注会减少对编程中最令人沮丧的部分——调试的需求；也就是说，开发过程中良好的程序结构可以减少犯的错误数量，以及查找和消除此类错误所需的时间。\n\
  \n![Image](img/00005.jpeg)\n\n我们组织程序——以及在编程时组织思路——的主要工具是将一个大计算分解成许多个小计算。这种技术有两种变体：\n\
  \n* `Abstraction`（抽象）：在一个方便且通用的接口后面，隐藏我们不需要使用的功能细节（“实现细节”）。\n* `Divide and conquer`（分治法）：在这里我们取一个大问题并将其分为若干个小问题。例如，如果我们需要构建字典，可以将该工作分为三部分：读取数据、排序数据和输出数据。产生的每个问题都比原始问题小得多。\n\
  \n![Image](img/00007.jpeg)\n\n为什么这有帮助？毕竟，由部分构建的程序可能比所有内容都优化合并的程序稍大。原因是我们并不擅长处理大问题。我们实际上处理这些问题的方法（在编程和其他地方都是）是将它们分解成更小的问题，并继续分解成更小的部分，直到得到足够简单以便理解和解决的东西。在编程方面，你会发现一个\
  \ 1000 行的程序错误远比 100 行的程序多十倍以上，所以我们尝试用少于 100 行的部分来组成一个 1000 行的程序。对于大型程序，例如 10,000,000\
  \ 行，应用抽象和分治法不仅是一个选项，更是一个基本要求。我们无法编写和维护大型单体程序。将本书其余的内容看作是一系列需要分解成更小部分的长期示例，以及完成这些任务所需的工具和技术。\n\
  \n\n\n\n当我们考虑划分一个程序时，必须始终考虑我们拥有哪些工具来表达各个部分及其之间的通信。一个良好的库可以提供用于表达想法的实用设施，这至关重要地影响我们将功能分发到程序不同部分的方式。我们不能仅仅坐在那里“想象”如何划分程序最合适；我们必须考虑我们有哪些库可以用来表达这些部分及其通信。虽然现在还处于早期阶段，但现在指出这一点也不算为时过早：如果你可以使用现有的库（例如\
  \ `C++` 标准库），你就可以自己节省大量工作，不仅在编程方面，而且在测试和文档方面。`iostreams` 让我们免于直接处理硬件的输入输出端口。这是使用抽象划分程序的第一个例子。每一章新章节都将提供更多示例。\n\
  \n注意这里对结构和组织的强调：仅仅通过编写大量的语句是无法获得良好的代码的。我们为什么现在提到这个呢？在这个阶段，你（或至少很多读者）对代码是什么几乎没有概念，而且要过几个月，你才能准备好写出其他人可以赖以生存或生计的代码。我们提到这一点是为了帮助你确定学习的重点。人们很容易急于求成，专注于编程中那些——就像本章其余部分描述的那样——具体且立即有效的部分，而忽略了软件开发艺术中更“软”、更具概念性的部分。然而，优秀的程序员和系统设计师知道（通常是通过惨痛经历学到的），对结构的关注是良好软件的核心，而忽视结构会导致昂贵的混乱。没有结构，你（比喻地）就像是在用泥砖盖房子。这可以做到，但你永远盖不到五层（泥砖缺乏那样的结构强度）。如果你有野心建造某种相当永久的东西，你就要在这个过程中注意代码的结构和组织问题，而不是在失败后才回来学习它们。\n\
  \n### 4.3 表达式\n\n![Image](img/00005.jpeg)\n\n程序最基本的构建单元是表达式。表达式从多个操作数计算出一个值。最简单的表达式仅仅是一个字面量，例如\
  \ `10`、`'a'`、`3.14` 或 `\"Norah\"`。\n\n变量名也是表达式。变量代表它所命名的对象。考虑：\n\n点击此处查看代码图像\n\n\
  ```cpp\n// 计算面积：\nint length = 20;               // 一个字面量整数（用于初始化变量）\nint width\
  \ = 40;\nint area = length*width;       // 一个乘法\n```\n\n在这里，字面量 `20` 和 `40` 用于初始化变量\
  \ `length` 和 `width`。然后，`length` 和 `width` 相乘；也就是说，我们乘以在 `length` 和 `width` 中找到的值。在这里，`length`\
  \ 仅仅是“名为 length 的对象中的值”的简写。再考虑：\n\n点击此处查看代码图像\n\n```cpp\nlength = 99;   // 将 99\
  \ 赋值给 length\n```\n\n在这里，作为赋值的左侧操作数，`length` 表示“名为 length 的对象”，因此赋值表达式读作“将 99 放入由\
  \ length 命名的对象中”。我们区分用于赋值或初始化左侧的 `length`（`length` 的左值或“由 length 命名的对象”）与用于赋值或初始化右侧的\
  \ `length`（`length` 的右值、“名为 length 的对象的值”，或只需“length 的值”）。在这种语境下，我们发现将变量可视化为一个由名称标记的盒子是很有用的：\n\
  \n![Image](img/00033.jpeg)\n\n也就是说，`length` 是一个 `int` 类型对象的名称，其中包含值 `99`。有时（作为左值）`length`\
  \ 指代盒子（对象），有时（作为右值）`length` 指该盒子中的值。\n\n我们可以通过我们习惯的方式，使用运算符（如 `+` 和 `*`）组合表达式来创建更复杂的表达式。需要时，我们可以使用括号对表达式进行分组：\n\
  \n点击此处查看代码图像\n\n```cpp\nint perimeter = (length+width)*2;   // 先相加后相乘\n```\n\n如果没有括号，我们就得写成：\n\
  \n点击此处查看代码图像\n\n```cpp\nint perimeter = length*2+width*2;\n```\n\n这很笨拙，而且我们甚至可能犯这个错误：\n\
  \n点击此处查看代码图像\n\n```cpp\nint perimeter = length+width*2;      // 将 width*2 加到 length\
  \ 上\n```\n\n最后一个错误是逻辑上的，编译器是无法发现的。编译器看到的只是一个名为 `perimeter` 的变量，它由一个有效的表达式初始化。如果该表达式的结果是无意义的，那是你的问题。你知道周长的数学定义，但编译器不知道。\n\
  \n运算符优先级的通常数学规则适用，因此 `length+width*2` 意味着 `length+(width*2)`。使用括号的第一条规则是“如果有疑问，就加括号”，但过度使用括号会降低可读性。为什么你应该关注可读性呢？因为你和他人会阅读你的代码，而且可读性也更容易维护。不要编写荒谬复杂的表达式，例如：\n\
  \n点击此处查看代码图像\n\n```cpp\n7\n```\n\n### 4.3.1 常量表达式\n\n程序通常使用大量的常量。例如，一个几何程序可能会使用\
  \ `pi`，一个英寸转厘米的程序会使用转换因子 `2.54`。显然，我们不想意外地更改这些常量。因此，C++ 提供了符号常量的概念，即一个初始化后无法再赋予新值的命名对象。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nconstexpr double pi = 3.14159;\npi = 7; // 错误：赋值给常量\ndouble\
  \ c = 2*pi*r; // 确定的\n```\n\n这样的常量有助于保持代码的可读性。如果你在某些代码中看到 `3.14159`，可能会识别出 `pi`\
  \ 的近似，但你能识别 `299792458` 吗？而且，如果有人要求你在计算中使用 12 位精度的 `pi`，如果有人不小心使用了 `22/7`，你可能找不到它。最好直接修改\
  \ `pi` 的定义以使用更合适的值：\n\n点击此处查看代码图像\n\n```cpp\nconstexpr double pi = 3.14159265359;\n\
  ```\n\n![Image](img/00006.jpeg)\n\n因此，我们倾向于不在代码的大多数地方使用字面量（除了 `0` 和 `1` 这样非常明显的）。相反，我们使用具有描述性的常量。代码中不明显的字面量（符号常量定义之外）被贬蔑地称为“魔术数字”。\n\
  \n在某些地方，例如分支标签（§4.4.1.3](#part0010.html_ch04lev3sec3)），C++ 要求一个常量表达式，即一个完全由常量组成的具有整数值的表达式。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nconstexpr int max = 17; // 字面量是常量表达式\n```\n\n\n\n\n\n```cpp\n\
  int val = 19;\n```\n\n`max+2` // 一个常量表达式（一个 const int 加上一个字面量）\n\n`val+2` // 不是常量表达式：它使用了一个变量\n\
  \n![Image](img/00007.jpeg)\n\n顺便说一下，299792458 是宇宙的基本物理常数之一：以米/秒为单位的真空光速。如果你不能一眼识别出它，又怎么预期不会被代码中嵌入的其他字面量搞混并减慢速度呢？避免使用魔数常量（magic\
  \ constants）！\n\n`constexpr` 符号常量必须给出一个在编译时已知的值。例如：\n\n点击此处查看代码图像\n\n```cpp\nconstexpr\
  \ int max = 100;\n\nvoid use(int n)\n{\n    constexpr int c1 = max+7;   // OK：c1\
  \ 是 107\n    constexpr int c2 = n+7;     // 错误：我们不知道 c2 的值\n    // ...\n}\n```\n\
  \n为了处理那些初始化值在编译时未知但在初始化后永不再改变的“变量”情况，C++ 提供了第二形式的常量（`const`）：\n\n点击此处查看代码图像\n\n\
  ```cpp\nconstexpr int max = 100;\n\nvoid use(int n)\n{\n    constexpr int c1 = max+7;\
  \   // OK：c1 是 107\n    const int c2 = n+7;         // OK，但不要尝试修改 c2 的值\n    //\
  \ ...\n    c2 = 7;                     // 错误：c2 是 const\n}\n```\n\n这种“const 变量”非常常见，原因有两个：\n\
  \n*   C++98 没有 `constexpr`，所以人们使用 `const`。\n*   不是常量表达式（其值在编译时未知）但在初始化后不再改变值的“变量”本身具有广泛的用处。\n\
  \n### 4.3.2 运算符\n\n我们刚刚使用了最简单的运算符。然而，由于你想表达更复杂的操作，很快就会需要更多运算符。大多数运算符都是约定俗俗的，因此我们将在稍后根据需要解释它们，你可以在需要时查阅细节。以下是最常用的运算符列表：\n\
  \n![Image](img/00034.jpeg)\n\n当运算符修改操作数时，我们使用了 `lval`（“可以出现在赋值表达式左侧的值”的缩写）。你可以在\
  \ §A.5 中找到完整列表。\n\n关于逻辑运算符 `&&`（与）、`||`（或）和 `!`（非）的使用示例，请参阅 §5.5.1、§7.7、§7.8.2 以及\
  \ §10.4。\n\n![Image](img/00007.jpeg)\n\n注意 `a<b<c` 意味着 `(a<b)<c`，且 `a<b` 的结果值为布尔值：`true`\
  \ 或 `false`。因此，`a<b<c` 等于 `true<c` 或 `false<c`。特别地，`a<b<c` 并不意味着“b 是否在 a 和 c 之间？”，正如很多人天真（但并不合理）所假设的那样。因此，`a<b<c`\
  \ 基本上是一个无用的表达式。不要编写此类包含两个比较操作的表达式，如果你在别人的代码中发现这样的表达式，要保持警惕——它很可能是一个错误。\n\n自增可以用至少三种方式表示：\n\
  \n```cpp\n++a\na+=1\na=a+1\n```\n\n![Image](img/00006.jpeg)\n\n我们应该使用哪种符号？为什么我们更倾向于第一种\
  \ `++a`？因为它更直接地表达了递增的思想。它表达了我们想要做什么（增加 `a`），而不是如何做（给 `a` 加 1 然后将结果写入 `a`）。通常情况下，如果程序中表达某事的方式比另一种方式更直接地表达一个思想，那么它就是更好的。结果更简洁且更易于理解。如果我们写成\
  \ `a=a+1`，读者很容易怀疑我们是否是想要递加 1。也许我们误写了 `a=b+1`、`a=a+2` 甚至是 `a=a–1`；使用 `++a` 减少了此类疑虑的机会。请注意，这是一个关于可读性和正确性的逻辑论证，而不是关于效率的论证。与流行观点相反，当\
  \ `a` 是内置类型之一时，现代编译器倾向于为 `a=a+1` 和 `++a` 生成相同的代码。同样，我们倾向于使用 `a*=scale` 而不是 `a=a*scale`。\n\
  \n### 4.3.3 转换\n\n我们可以“混合”不同的类型。例如，`2.5/2` 是一个 `double` 除以一个 `int`。这意味着什么？我们是在做整数除法还是浮点除法？整数除法会丢弃余数；例如，`5/2`\
  \ 的结果是 `2`。浮点除法则不会丢弃余数；例如 `5.0/2` 的结果是 `2.5`。在 C++ 中，如果两个类型不匹配，编译器会执行类型转换。例如，在 `2.5/2`\
  \ 中，`int` 会转换为 `double`，然后执行浮点除法。在 `5/2.0` 中，`int` 会转换为 `double`，然后执行浮点除法。\n\n\n\
  \n\n如果没有分号，编译器就不知道我们是指 `a=b++; b;` 还是 `a=b; ++b;`。这类问题不仅限于计算机语言；考虑感叹句“man eating\
  \ tiger!”（人吃虎！）到底是谁在吃谁？标点符号的存在是为了消除此类问题，例如，“man-eating tiger!”（食人虎！）。\n\n当语句相互接继出现时，计算机按照它们编写的顺序执行它们。例如：\n\
  \n```cpp\nint a = 7;\ncout << a << '\\n';\n```\n\n在这里，`declaration` 及其初始化在输出表达式语句之前执行。\n\
  \n通常情况下，我们希望语句能产生某种效果。没有效果的语句通常是没用的。例如：\n\n```cpp\n1+2;      // 执行加法，但不使用结果和\na*b;\
  \      // 执行乘法，但不使用乘积\n```\n\n这种没有产生效果的语句通常是逻辑错误，编译器经常会对它们发出警告。因此，表达式语句通常是赋值语句、I/O\
  \ 语句或函数调用。\n\n我们还会提到另一种语句：“空语句”。考虑以下代码：\n\n```cpp\nif (x == 5);\n{ y = 3; }\n```\n\
  \n![Image](img/00007.jpeg)\n\n这看起来像是一个错误，而且几乎肯定确实是。第一行的 `;` 不应该出现在那里。但遗憾的是，这是 C++\
  \ 中一个合法的结构。它被称为 `empty statement`，即什么都不做的语句。分号之前的空语句很少有用。在这种情况下，它导致了不幸的结果：允许一个几乎可以确定错误被编译器接受，因此它不会提醒你该错误，你发现它的就会更加困难。\n\
  \n如果运行这段代码会发生什么？编译器将测试 `x` 查看它的值是否为 `5`。如果此条件为真，将执行后续语句（空语句），没有任何效果。然后程序继续执行下一行，将值\
  \ `3` 赋给 `y`（这是你希望在 `x` 等于 `5` 时发生的）。相反，如果 `x` 的值不为 `5`，编译器不会执行空语句（仍然没有效果），并像以前一样将值\
  \ `3` 赋给 `y`（除非 `x` 等于 `5`，否则这不是你希望发生的）。换句话说，这个 if 语句无关紧要；无论如何 `y` 都会得到值 `3`。这是初级程序员的一个常见错误，而且很难发现，所以请注意。\n\
  \n下一节将专门介绍用于改变求值顺序的语句，使我们能够表达比按编写顺序执行语句更有趣的计算。\n\n## 4.4.1 选择\n\n在程序中，正如生活中一样，我们经常需要在备选方案之间进行选择。在\
  \ C++ 中，这是通过 `if-statement` 或 `switch-statement` 完成的。\n\n### 4.4.1.1 if-statements\n\
  \n最简单的的形式是 `if-statement`，它在两种备选方案之间进行选择。例如：\n\n```cpp\nint main()\n{\n    int a\
  \ = 0;\n    int b = 0;\n    cout << \"Please enter two integers\\n\";\n    cin >>\
  \ a >> b;\n    if (a<b)       // 条件\n                               // 第一种方案（如果条件为真则执行）：\n\
  \        cout << \"max(\" << a << \",\" << b <<\") is \" << b <<\"\\n\";\n    else\n\
  \                               // 第二种方案（如果条件为假则执行）：\n        cout << \"max(\" <<\
  \ a << \",\" << b <<\") is \" << a << \"\\n\";\n}\n```\n\n![Image](img/00005.jpeg)\n\
  \n`if-statement` 在两种备选方案之间做出选择。如果它的条件为真，则执行第一个语句；否则执行第二条语句。这个概念很简单。大多数基础语言特性都是如此。事实上，编程语言中的大多数基础特性只是你在小学阶段学过的（或更早）内容的符号表示。例如，你在幼儿园时被告诉要在交通灯处过马路，你必须等灯变绿：“如果交通灯是绿色的，走”以及“如果交通灯是红色的，等”。在\
  \ C++ 中这变成了\n\n```cpp\nif (traffic_light==green) go();\nif (traffic_light==red)\
  \ wait();\n```\n\n所以，基本概念是简单的，但也容易以过于简单的方式使用 `if-statements`。考虑这个程序有什么问题（除了漏了 `#include`）：\n\
  \n```cpp\n// 将英寸转换为厘米或英寸\n// 后缀 ‘i’ 或 ‘c’ 表示输入的单位\nint main()\n{\n    constexpr\
  \ cm_per_inch = 2.4; // 厘米数\n    double length = 1;           // 英制长度\n    char\
  \ unit = 0;               // 厘米\n    cout << \"Please enter a length followed by\
  \ a unit (c or i):\\n\";\n    cin >> length >> unit;\n    if (unit == 'i')\n   \
  \     cout << length << \"in == \" << cm_per_inch*length << \"cm\\n\";\n    else\n\
  \        cout << length << \"cm == \" << length/cm_per_inch << \"in\\n\";\n}\n```\n\
  \n实际上，这个程序的运行结果大致如描述所示：输入 `1i` 你得到 `1in == 2.54cm`；输入 `2.54c` 你会得到 `2.54cm == 1in`。试试看；这是良好的做法。问题在于我们没有测试错误的输入。程序假设用户输入的是正确的输入。\n\
  \n如果用户输入 `15f`（英尺）“看看会发生什么？”条件 `(unit == 'i')` 将失败，程序将执行 `else` 部分（第二种方案），将厘米转换为英寸。这可能不是我们输入\
  \ `'f'` 时所想要的。\n\n![Image](img/00006.jpeg)\n\n我们必须始终用“坏”输入测试我们的程序，因为某人最终会故意或无意输入错误的输入。即使如此，程序也应该表现得正常。\n\
  \n这是一个改进后的版本：\n\n```cpp\nint main()\n{\n    constexpr cm_per_inch = 2.4; // 厘米数\n\
  \    double length = 1;           // 英制长度\n    char unit = ' ';             // 空格不是单位\n\
  \    cout << \"Please enter a length followed by a unit (c or i):\\n\";\n    cin\
  \ >> length >> unit;\n    if (unit == 'i')\n        cout << length << \"in == \"\
  \ << cm_per_inch*length << \"cm\\n\";\n    else if (unit == 'c')\n        cout <<\
  \ length << \"cm == \" << length/cm_per_inch << \"in\\n\";\n    else\n        cout\
  \ << \"Sorry, I don't know a unit called '\" << unit << \"'\\n\";\n}\n```\n\n我们首先测试\
  \ `unit=='i'`，然后测试 `unit=='c'`，如果（两者）都不是，我们就说：“抱歉。”这看起来似乎我们使用了一个“else-if-statement”，但\
  \ C++ 中并没有这种东西。相反，我们结合了两个 if 语句。`if-statement` 的通用形式是\n\n```cpp\nif ( *expression*\
  \ ) *statement* else *statement*\n```\n\n即：`if` 后面跟着括号内的 *expression*，然后是一个 *statement*，接着是\
  \ `else`，最后是另一个 *statement*。\n\n\n\n\n```cpp\nif ( expression ) statement else if\
  \ ( expression ) statement else statement\n```\n\n对于我们具有这种结构的程序：\n\n点击此处查看代码图像\n\
  \n```cpp\nif (unit == 'i')\n    . . . // 第 1 种备选\nelse if (unit == 'c')\n    . .\
  \ . // 第 2 种备选\nelse\n    . . . // 第 3 种备选\n```\n\n![Image](img/00006.jpeg)\n\n\
  通过这种方式，我们可以编写任意复杂的测试，并为每个备选项关联一个语句。然而，请记住，代码的理想之一是简单，而不是复杂。你不需要通过编写最复杂的程序来证明你的聪明。相反，你通过编写完成任务的最简单代码来证明你的能力。\n\
  \n* *\n\n![Image](img/00024.jpeg) 尝试一下\n\n使用上面的示例作为模版，编写一个将日元、欧元和英镑转换为美元的程序。如果你喜欢现实主义，可以在网上找到汇率。\n\
  \n* *\n\n### 4.4.1.2 switch-statements\n\n实际上，将 `unit` 与 `'i'` 和 `'c'` 进行比较是最常见的选择形式的示例：基于值与几个常数进行比较的选择。这种选择是如此常见，以至于\
  \ C++ 为它提供了一个专门的语句：`switch-statement`。我们可以将示例重写为：\n\n点击此处查看代码图像\n\n```cpp\nint main()\n\
  {\n    constexpr double cm_per_inch = 2.54; // 每英寸的厘米数\n    double length = 1; //\
  \ 以英寸或厘米为单位长度\n    char unit = 'a';\n    cout<< \"Please enter a length followed\
  \ by a unit (c or i):\\n\";\n    cin >> length >> unit;\n    switch (unit) {\n \
  \   case 'i':\n        cout << length << \"in == \" << cm_per_inch*length << \"\
  cm\\n\";\n        break;\n    case 'c':\n        cout << length << \"cm == \" <<\
  \ length/cm_per_inch << \"in\\n\";\n        break;\n    default:\n        cout <<\
  \ \"Sorry, I't know a unit '\" << unit << \"'\\n\";\n        break;\n    }\n}\n\
  ```\n\n![Image](img/00006.jpeg)\n\n`switch-statement` 的语法虽然古老，但仍然比嵌套的 `if-statements`\
  \ Clear，特别是当我们与常数进行比较时。`switch` 之后出现的值与一组常数进行比较。每个常数都作为 `case` 标签的一部分。如果值等于 `case`\
  \ 标签中的常数，则选择该 `case` 的语句。每个 `case` 都由 `break` 终止。如果该值不匹配任何 `case` 标签，则选择由 `default`\
  \ 标签标识的语句。你不需要提供 `default`，但除非你绝对确定已经列出了所有的备选项，否则这样做是個好主意。如果你不知道，编程会教你：对任何事情都想要绝对确定（且正确）是困难的。\n\
  \n##### 4.4.1.3 Switch technicalities\n\n这里是关于 `switch-statements` 的一些技术细节：\n\n\
  1. 用于 switch 的值必须是 `integer`（整数）、`char`（字符）或 `enumeration`（枚举）类型。特别是，你不能对 `string`（字符串）进行\
  \ switch。\n2. `case` 标签中的值必须是常量表达式。特别是，你不能在 `case` 标签中使用变量。\n3. 你不能对两个 `case` 标签使用相同的值。\n\
  4. 你可以为单个 `case` 使用多个 `case` 标签。\n5. 不要忘记用 `break` 结束每个 `case`。遗憾的是，编译器可能并不会警告你。\n\
  \n例如：\n\n点击此处查看代码图像\n\n```cpp\nint main() // 你只能对整数等进行 switch\n{\n    cout << \"\
  Do you like fish?\\n\";\n    string s;\n    cin >> s;\n    switch (s) { // 错误：值必须是整数、字符或枚举类型\n\
  \    case \"no\":\n        // . . .\n        break;\n    case \"yes\":\n       \
  \ // . . .\n        break;\n}\n}\n```\n\n要根据字符串进行选择，你必须使用 `if-statement` 或 `map`\
  \ (第 21 章)。\n\n`switch-statement` 生成用于与一组常数的优化代码。对于较大的常数集，这通常比一组 `if-statements`\
  \ 产生更高效的代码。然而，这意味着 `case` 标签值必须是常量且是唯一的。例如：\n\n点击此处查看代码图像\n\n```cpp\nint main()\
  \ // 标签必须是常量\n{\n    // 定义备选方案\n    int y = 'y'; // 这会引起麻烦\n    constexpr char n\
  \ = 'n';\n    constexpr char m = '?';\n    cout << \"Do you like fish?\\n\";\n \
  \   char a;\n    cin >> a;\n    switch (a) {\n    case n:\n        // . . .\n  \
  \      break;\n    case y: // 错误：case 标签中使用变量\n        // . . .\n        break;\n\
  \    case m:\n        // . . .\n        break;\n    case 'n': // 错误：重复 case（n 的值）\n\
  \        // . . .\n        break;\n    default:\n        // . . .\n        break;\n\
  \    }\n}\n```\n\n通常你希望对 `switch` 中的一组值执行相同的操作。重复该操作会很麻烦，因此你可以通过一组 `case` 标签来标记同一个操作。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nint main() // 你可以用多个 case 标签标记一个语句\n{\n    cout << \"Please\
  \ enter a digit\\n\";\n    char a;\n    cin >> a;\n    switch (a) {\n    case '0':\
  \ case '2': case '4': case '6': case '8':\n        cout << \"is even\\n\";\n   \
  \     break;\n    case '1': case '3': case '5': case '9':\n        cout << \"is\
  \ odd\\n\";\n        break;\n    default:\n        cout << \"is not a digit\\n\"\
  ;\n        break;\n    }\n}\n```\n\n![Image](img/00007.jpeg)\n\n`switch-statements`\
  \ 最常见的错误是忘记用 `break` 终止 `case`。例如：\n\n点击此处查看代码图像\n\n```cpp\nint main() // 坏代码示例（缺少了\
  \ break）\n{\n    double cm_per_inch = 2.54; // 每英寸的厘米数\n    double length = 1; //\
  \ 以英寸或厘米为单位长度\n    char unit = 'a';\n    cout << \"Please enter a length followed\
  \ by a unit (c or i):\\n\";\n    cin >> length >> unit;\n    switch (unit) {\n \
  \   case 'i':\n        cout << length << \"in == \" << cm_per_inch*length << \"\
  cm\\n\";\n    case 'c':\n        cout << length << \"cm == \" << length/cm_per_inch\
  \ << \"in\\n\";\n    }\n}\n```\n\n遗憾的是，编译器会接受这种代码，当你完成 case `'i'` 后，你将直接“穿透”进入 case\
  \ `'c'`，所以如果你输入 `2i`，程序将输出\n\n2in == 5.08cm\n2cm == 0.787402in\n\n你已经收到警告了！\n\n\
  ### 4.4.2 Iteration\n\n\n\n\n\n我们很少只做某件事一次。因此，编程语言提供了方便的方法来多次执行某些操作。这被称为 `repetition`（重复）或——特别是当你对数据结构中的一系列元素执行某些操作时——`iteration`（迭代）。\n\
  \n### 4.4.2.1 while-语句\n\n作为迭代的一个示例，考虑第一个在存储程序式计算机（EDSAC）上运行的程序。它是由 David Wheeler\
  \ 于 1949 年 5 月 6 日在英国剑桥大学的计算机实验室编写并运行的，用于计算并打印如下所示的简单平方数列表：\n\n```\n0       0\n\
  1       1\n2       4\n3       9\n4       16\n. . .\n98      9604\n99      9801\n\
  ```\n\n每一行都是一个数字，后面紧跟一个“制表符”字符（`'\\t'`），然后是该数字的平方。C++ 版本如下：\n\n点击此处查看代码图像\n\n```cpp\n\
  // calculate and print a table of squares 0–99\nint main()\n{\n    int i = 0;  \
  \         // 从 0 开始\n    while (i<100) {\n        cout << i << '\\t' << square(i)\
  \ << '\\n';\n        ++i;            // 增加 i（即 i 变为 i+1）\n    }\n}\n```\n\n符号 `square(i)`\
  \ 意味着 `i` 的平方。我们稍后会解释它是如何变成这种含义的 (§4.5)。\n\n不，第一个现代程序并不是用 C++ 编写的，但逻辑如下所示：\n\n*\
  \ 我们从 0 开始。\n* 我们检查是否已经达到了 100，如果是，则结束。\n* 否则，我们打印该数字及其平方，用制表符（`'\\t'`）分隔，增加数字，并再次尝试。\n\
  \n显然，为了做到这一点，我们需要：\n\n* 一种重复某些语句的方法（用于 `loop`（循环））\n* 一个变量来跟踪我们进入循环的次数（`loop variable`\
  \ 循环变量或控制变量），在这里是名为 `i` 的 `int`\n* 循环变量的初始化器，这里是 0\n* 一个终止准则，这里是我们想让循环 100 次\n*\
  \ 每次循环时要执行某些操作（循环的 `body` 循环体）\n\n我们使用的语言结构被称为 while-语句。只需遵循其独特的关键字 `while`，它有一个位于“顶部”的条件，后面跟着它的正体：\n\
  \n点击此处查看代码图像\n\n```cpp\nwhile (i<100)           // 测试循环变量 i 的循环条件\n{\n    cout <<\
  \ i << '\\t' << square(i) << '\\n';\n    ++i ;               增加循环变量 i\n}\n```\n\n\
  循环体是一个块（由大括号限定），它负责写入表格的一行并增加循环变量 `i`。我们每次通过循环时，都开始测试 `i<100` 是否为真。如果是，说明我们还没有完成，可以执行循环体。如果我们到达了末尾，即如果\
  \ `i` 是 100，我们就离开 while-语句并执行后续内容。在这个程序中，程序的结尾就是后续，所以我们退出了程序。\n\nwhile-语句的循环变量必须在\
  \ while-语句之外（之前）定义并初始化。如果我们没有定义它，编译器将向我们报告错误。如果我们定义了它但未能初始化它，大多数编译器会警告我们，说类似“局部变量\
  \ i 未设置”之的话，但如果我们坚持，它们也愿意让我们执行程序。不要坚持！编译器在警告未初始化的变量时确实是正确的。未初始化的变量是错误的常见来源。在这种情况下，我们写了\
  \ `int i = 0;` 从 0 开始，这样很好。\n\n基本上，写一个循环非常简单。要在现实世界的问题中正确实现它可能是复杂的。特别是，正确表达条件并初始化所有变量以确保循环正确启动可能是困难的。\n\
  \n![Image](img/00024.jpeg) 尝试 字符 `'b'` 是 `char('a'+1)`，`'c'` 是 `char('a'+2)`，等。使用循环写出一个带有其整数值的字符表：\n\
  a   97\nb   98\n...\nz   122\n\n### 4.4.2.2 块\n\n注意我们是如何组合 while 必须执行的两个语句的：\n\n\
  点击此处查看代码图像\n\n```cpp\nwhile (i<100) {\n    cout << i << '\\t' << square(i) << '\\\
  n';\n    ++i ;           增加 i（即 i 变为 i+1）\n}\n```\n\n![Image](img/00005.jpeg) 用大括号\
  \ `{ }` 限定的语句序列被称为 `block`（块）或 `compound statement`（复合语句）。块是语句的一种。空块 `{ }` 有时用于表达什么都不做。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nif (a) {\n    // 什么都不做\n}else {\n    // 赋值给 b\n    int t;\n\
  }\n```\n\n### 4.4.2.3 for-语句\n\n遍历数字序列非常常见，因此 C++ 和大多数其他语言都为其提供了特殊的语法。for-语句就像 while-语句，只是控制变量的管理集中在顶部，易于观察和理解。我们可以这样写“第一个程序”：\n\
  \n点击此处查看代码图像\n\n```cpp\n// 计算并打印 0–99 的平方表\nint main()\n{\n    for (int i = 0; i<100;\
  \ ++i)\n        cout << i << '\\t' << square(i) << '\\n';\n}\n```\n\n这意味着“从 0 开始执行体，每次执行后增加\
  \ i，直到达到 100”。for-语句总是等同于某些 while-语句。在这种情况下\n\n点击此处查看代码图像\n\n```cpp\n{\n    int\
  \ i = 0;           // for 语句初始化\n    while (i<100) {     // for 语句条件\n        cout\
  \ << i << '\\t' << square(i) << '\\n';   // for 语句体\n        ++i;            //\
  \ for 语句增量\n    }\n}\n```\n\n![Image](img/00006.jpeg) 有些初学者喜欢 while-语句，有些则喜欢 for-语句。然而，当循环可以定义为具有简单初始化、条件和增量的\
  \ for-语句时，使用 for-语句会产生更易于理解和维护的代码。只有在不是这种情况时才使用 while-语句。\n\n![Image](img/00007.jpeg)\
  \ 任何看到这个循环的人都会合理假设体会执行 100 次。然而，事实并非如此。体中的 `++i` 确保 `i` 每次循环增加，以便我们得到了 50 个 `i`\
  \ 值的输出。如果我们看到这样的代码，我们会认为它是错误，可能是由从 while-语句粗糙转换引起的。如果你想增加 2，就直说：\n\n点击此处查看代码图像\n\
  \n```cpp\n// 计算并打印 0:100) 范围内偶数的平方表\nint main()\n{\n    for (int i = 0; i<100; i+=2)\n\
  \        cout << i << '\\t' << square(i) << '\\n';\n}\n```\n\n![Image 请注意，更整洁、更明确的版本比混乱的版本更短。这很典型。*\
  \ * *![Image](img/00024.jpeg) 尝试\n\n将上一个 **尝试** 中的字符值示例重写为使用 for-语句。然后修改你的程序，也写出大写字母和数字的整数值表格。\n\
  \n\n\n\n还有一种更简单的“范围 for 循环”用于遍历数据集合，例如向量（vectors）；请参阅 §4.6。\n\n## 4.5 函数\n\n在上面的程序中，`square(i)`\
  \ 是什么？它是一个函数调用。具体来说，它是调用一个名为 `square` 的函数，并传入了参数 `i`。*函数*是一组命名的语句序列。函数可以返回一个结果（也称为*返回值*）。标准库提供了许多有用的函数，例如我们在\
  \ §3.4 中使用的平方根函数 `sqrt()`。然而，我们也会自己编写很多函数。这里是 `square` 的一个合理定义：\n\n点击此处查看代码图像\n\n\
  ```cpp\nint square(int x)    // 返回 x 的平方\n\n{\n    return x*x;\n}\n```\n\n该定义的第一行告诉我们这是一个函数（这就是括号的意思），它的名字叫\
  \ `square`，它接受一个 `int` 参数（在这里称为 `x`），并且它返回一个 `int`（在函数声明中，结果的类型始终在前）；也就是说，我们可以这样使用它：\n\
  \n点击此处查看代码图像\n\n```cpp\nint main()\n{\n    cout << square(2) << '\\n';        //\
  \ 打印 4\n    cout << square(10) << '\\n';     // 打印 100\n}\n```\n\n我们并不非使用函数调用的结果，但我们必须提供函数所需的确切参数。考虑：\n\
  \n点击此处查看代码图像\n\n```cpp\nsquare(2);                          // 可能错误：未使用的返回值\nint\
  \ v1 = square();                 // 错误：缺少参数\nint v2 = square;                  \
  \ // 错误：缺少括号\nint v3 = square(1,2);              // 错误：参数过多\nint v4 = square(\"\
  two\");            // 错误：参数类型错误 - 预期 int\n```\n\n![图像](img/00005.jpeg)\n\n许多编译器会对未使用的结果发出警告，并且都会如指示所示给出错误。你可能认为计算机应该足够聪明，能够看出通过字符串\
  \ \"two\" 你实际上是指整数 2。然而，C++ 编译器故意并不那么聪明。编译器的工作是在验证你的代码根据 C++ 的定义是正确的之后，完全按照你要求它做来来。如果编译器去猜你的意图，它偶尔会猜错，而你——或者你程序的用户——会感到非常恼火。预测你的代码将做什么已经足够困难了，不需要编译器通过“猜猜你的意图”来提供“帮助”。\n\
  \n*函数体*（function body）是实际执行工作的代码块（§4.4.2.2）。\n\n点击此处查看代码图像\n\n```cpp\n{\n    return\
  \ x*x;      // 返回 x 的平方\n}\n```\n\n对于 `square` 来说，工作是微不足道的：我们产生参数的平方并将其作为结果返回。在\
  \ C++ 中这样说比用英语说要简单得多。这对于简单的想法来说很典型。毕竟，编程语言的设计就是为了简单、准确地表达此类简单的想法。\n\n*函数定义*（function\
  \ definition）的语法可以描述如下：\n\n*类型 标识符* ( *参数列表* ) *函数体*\n\n也就是说，一个类型（返回类型），后面跟着标识符（函数名），然后是括号中的参数列表，最后是函数体（要执行的语句）。函数所需的参数列表被称为*参数列表*（parameter\
  \ list），其元素被称为*参数*（parameters，或*形参数* formal arguments）。参数列表可以是空的，如果我们不想返回结果，就给 `void`（意思是“无”）作为返回类型。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nvoid write_sorry()  // 不接受参数；不返回值\n{\n    cout << \"Sorry\\\
  n\";\n}\n```\n\n### 4.5.1 为什么要费心使用函数？\n\n![图像](img/00005.jpeg)\n\n我们在以下情况下定义函数：\n\
  \n- 使程序更清晰\n- 使计算分离\n- 使可能在多处使用\n- 方便测试\n\n我们将在学习过程中看到每种情况的许多例子。注意，对于这两种，我们都希望计算是有命名的。例如，如果我们想让循环变得非常简单，我们可以写成\n\
  \n点击此处查看代码图像\n\n```cpp\nvoid print_square(int v)\n{\n    cout << v << '\\t' << v*v\
  \ << '\\n';\n}\n\nint main()\n{\n    for (int i = 0; i<100; ++i) print_square(i);\n\
  }\n```\n\n为什么不使用 `print_square()` 的版本？相比之下，`square()` 版本明显更好，因为：\n\n- `print_square()`\
  \ 是一个相当特殊的函数，我们不指望之后使用，而 `square()` 是一个显而易见的候选\n\n两者的底层原因是 `print_square()` 执行了两个逻辑上独立的操作：\n\
  \n- 它打印\n- 它计算平方\n\n如果每个函数执行一个操作，程序通常更容易编写和理解。基本上，`square()` 版本的的设计更好。\n\n最后，为什么我们在问题的第一个版本中使用\
  \ `square(i)` 而不是简单的 `i*i`呢？嗯，函数的目的之一是将复杂的计算分离为命名的函数以简化代码，而对于 1949 年版本的程序，硬件并没有直接实现“乘法”。因此，在\
  \ 1949 年版本的程序中，`i*i` 实际上是一个相当复杂的计算，类似于用纸笔手工计算的过程。此外，那个版本的作者 David Wheeler 是现代计算中函数（当时称为子程序）的发明者，所以在这里使用它非常合适。\n\
  \n* *\n\n![图像](img/00024.jpeg) 尝试一下\n\n在不使用乘法运算符的情况下实现 `square()`；即通过重复加法完成 `x*x`（从\
  \ 0 开始一个结果变量，加 `x` 次 `x`）。然后使用该 `square()` 运行某些版本的“第一个程序”。\n\n* *\n\n### 4.5.2 函数声明\n\
  \n你是否注意到调用函数所需的所有信息都在定义的第一行中？例如：\n\n`int square(int x)`\n\n根据此，我们有了足够的信息来写出\n\n\
  ```cpp\nint x = square(44);\n```\n\n\n\n我们并不真的需要查看函数体。在实际程序中，我们通常都不想看函数体。我们为什么要看标准库函数\
  \ `sqrt()`的函数体呢？我们知道它计算的是参数的平方根。我们为什么要看自己的 `square()` 函数的函数体呢？当然，我们可能只是出于好奇。但几乎所有时候，我们只是感兴趣知道如何调用一个函数——看到定义只会分散我们的注意力。幸运的是，C++\
  \ 提供了一种独立于完整函数定义来提供这些信息的方法。它被称为`函数声明`：\n\n点击此处查看代码图像\n\n```cpp\nint square(int);\
  \           // square 的声明\ndouble sqrt(double);      // sqrt 的声明\n```\n\n注意末尾的分号。在函数声明中，使用分号代替了在相应的函数定义中使用的函数体：\n\
  \n点击此处查看代码图像\n\n```cpp\nint square(int x)         // square 的定义\n{\n    return x*x;\n\
  }\n```\n\n所以，如果你只想使用一个函数，你只需写下——或者更常见的 `#include`——它的声明。函数定义可以位于别处。我们将在 §8.3 和 §8.7\
  \ 中讨论那个“别处”可能在哪里。这种声明与定义之间的区别在较大的程序中变得至关重要，在这些程序中，我们使用声明将大部分代码隐藏在视野之外，以便我们一次集中处理程序的某部分\
  \ (§4.2)）。\n\n## 4.6 vector\n\n为了在程序中执行几乎任何感兴趣的操作，我们需要一组数据来处理。例如，我们可能需要一个电话号码列表、一个足球球队的成员列表、一个课程列表、去年读过的书籍列表、一个下载歌曲目录、一套汽车的一组支付选项、一个下周的天气预报列表、不同网络商店的相机价格列表等。这些可能性字面上是无限尽的，因此在程序中无处不在。我们将看到存储数据集的各种方式（各种数据容器；参见第\
  \ 20 章和第 21 章）。在这里，我们将从存储数据的最简单且可以说是最有用的方法之一开始：`vector`。\n\n![图像](img/00005.jpeg)\n\
  \n`vector` 简单来说是一个元素序列，你可以通过索引访问它。例如，这里有一个名为 `v` 的 vector：\n\n![图像](img/00035.jpeg)\n\
  \n也就是说，第一个元素的索引为 0，第二个索引为 1，依此类推。我们通过在 vector 名称后加上元素的索引作为下标来引用元素，所以这里 `v[0]` 的值是\
  \ 5，`v[1]` 的值是 7，依此类推。vector 的索引始终从 0 开始并每次增加 1。这看起来应该很熟悉：标准库 `vector` 仅仅是 C++ 标准库对一个老旧且为人知的想法的实现。我画这个\
  \ vector 是为了强调它“知道自己的大小”；也就是说，vector 不仅仅存储它的元素，它还存储它的大小。\n\n我们可以这样创建一个 vector：\n\
  \n点击此处查看代码图像\n\n```cpp\nvector<int> v = {1, 2, 3, 4, 5}; // 初始化 vector\n```\n\n\
  我们可以通过这样创建一个这样的 vector：\n\n点击此处查看代码图像\n\n```cpp\nvector<int> v; // 创建一个空 vector\n\
  v.push_back(5); // 添加元素 5\nv.push_back(7); // 添加元素 7\n```\n\n`vector` 仅仅是一个你可以通过索引访问的元素序列。例如，这里有一个名为\
