  \ §A.2.1.1。\n\n### 3.9 类型安全\n\n![Image](img/00007.jpeg)\n\n每个对象在定义时都被赋予一个类型。当对象仅根据其类型的规则进行使用时，程序（或程序的一部分）就是类型安全的。遗憾的是，存在某些操作方法并不是类型安全的。例如，在变量初始化之前使用它不被认为是类型安全的：\n\
  \n点击此处查看代码图像\n\n```cpp\nint main()\n{\n    double x;             // 我们“忘记”了初始化：\n\
  \                          // x 的值是未定义的\n    double y = x;         // y 的值是未定义的\n\
  \    double z = 2.0+x;     // + 的含义和 z 的值是未定义的\n}\n```\n\n实现甚至允许在运行未初始化的 `x` 时给出硬件错误。务必初始化你的变量！这条规则有极少数——极少数——例外，例如我们立即将一个变量作为输入操作的目标，但始终进行初始化是一个良好的习惯，将为你节省很多麻烦。\n\
  \n完全的类型安全 (type safety) 是该语言的理想状态，因此也是它的通用规则。遗憾的是，C++ 编译器无法保证完全类型安全，但我们可以通过良好的编码实践和运行时检查来避免类型安全违规。理想情况是永远不要使用编译器无法证明安全的语言特性：静态类型安全。遗憾的是，对于大多数有趣的编程用途来说，这太严格了。显而易见的\
  \ fallback——让编译器隐式生成代码来检查类型安全违规并捕获所有违规——超出了 C++ 的范围。当我们决定做一些（类型）不安全的事情时，我们必须自己进行一些检查。我们在遇到此类情况时会指出。\n\
  \n![Image](img/00006.jpeg)\n\n在编写代码时，类型安全的理想至关重要。这就是为什么我们在书中这么早就花时间研究它。请注意陷阱并避免它们。\n\
