  \n\n-   *正确性（Correctness）：* 这比通常情况下更为重要。“正确性”不仅仅是一个抽象概念。在嵌入式系统的背景下，程序的正确性意味着不仅要产生正确的结果，还意味着在正确的时间、以正确的顺序产生结果，并且仅使用可接受的资源集。理想情况下，构成正确性的细节会被细细规范，但通常此类规范只有在经过某些实验后才能完成。通常，关键实验只有在完整系统（其中\
  \ `the computer running` 是一部分）构建完成后才能进行。对于嵌入式系统来说，完全定义正确性可能同时是极其困难且极其重要的。在这里，“极其困难”可能意味着“即使在资源可用的情况下也无法实现”；必须竭尽全力使用所有可用工具和技术。幸运的是，给定领域内规范、仿真、测试和其他技术的范围是令人印象深刻的。在这里，“极其重要”可能意味着“失败会导致人身伤害或财产损失”。\n\
  \n![Image](img/00005.jpeg)\n\n-   *容错性（Fault tolerance）：* 我们必须小心指定程序应该处理的边界条件。例如，对于一个普通学生来说，程序可能会在演示时意外掉电而被踢出电源供应。失去电源不是普通\
  \ PC 应用程序应该处理的坐标。然而，在非嵌入式系统中，掉电是某些预期的故障，例如硬件系统的双路电源、备用电池等。更糟糕的是，“假设硬件工作正常”的假设适用于某些应用程序。随着时间的推移和范围的扩大，硬件根本无法正常工作。例如手机开关和航空航天应用，它们开发是基于这样一个假设：存储器内存不会在它决定更改值之前改变值（从\
  \ `0` 或 `1` 的二进制状态，类似于忽略时间更改该值）。当这种错误行为发生时，你最终会有足够的内存和足够长的时间。它很快就会发生，由于你的内存不足或硬件故障，你会在地球上发现它。当我们在嵌入式系统工作时，我们没有代码来决定如何从故障中恢复，除非指定的默认启动工作。当我们在处理更关键的系统时，假设似乎被修改了\n\
