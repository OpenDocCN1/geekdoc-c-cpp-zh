- "# Bjarne Stroustrup：C++ 编程原理与实践指南 第2版\n\n\n\n![](img/01900.jpeg)\n\n# 关于本电子书\n\n\
  ePUB 是一种开放的电子书标准格式。然而，不同阅读设备和应用程序对 ePUB 及其许多功能的支持程度不同。可以使用您的设备或应用设置根据您的喜好自定义显示。您可以自定义的设置通常包括字体、字体大小、单栏或双栏、横屏或竖屏模式，以及可以点击或触摸放大的图形。有关您的阅读设备或应用程序的设置和功能的更多信息，请访问设备制造商的网站。\n\
  \n许多书籍包含编程代码或配置示例。为了优化这些元素的显示效果，请在单栏横屏模式下查看电子书，并将字体大小调整为最小。除了以流式文本格式呈现代码和配置外，我们还包含了代码图像，以模仿印刷版中的呈现；因此，当流式格式可能会影响代码列表的显示时，您将看到“点击此处查看代码图像”链接。点击链接即可查看保真代码图像。要返回上一页，请点击设备或应用上的返回按钮。\n\
  \n\n\n![Image](img/00004.jpeg)\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n```cpp\nvector<int>\
  \ v1;\nvector<int> v2 {v1};      // C++14 风格的拷贝构造\n```\n\n请使用\n\n点击此处查看代码图片\n\n\
  ```cpp\nvector<int> v1;\nvector<int> v2 = v1;      // C++98 风格的拷贝构造\n```\n\n代替。\n\
  \n如果你的编译器不支持 `C++11`，请获取新编译器。良好的、现代 C++ 编译器可以从各种供应商下载；参见 [www.stroustrup.com/compilers.html](http://www.stroustrup.com/compilers.html)。使用较旧且支持较少的语言版本学习编程可能会增加不必要的困难。\n\
  \n## 支持\n\n本书网站 [www.stroustrup.com/Programming](http://www.stroustrup.com/Programming)\
  \ 包含了支持使用本书进行编程教学和学习的材料。材料可能会随着时间的推移而改进，但你可以找到：\n\n* 基于书籍的课程幻灯片\n* 教师指南\n* 书中使用的库的头文件和实现\n\
  * 书中示例的代码\n* 练习题的答案\n* 可能的链接\n* 错误列表\n\n随时欢迎改进建议。\n\n## 致谢\n\n我特别感谢我已故的同事兼任教师 Lawrence\
  \ “Pete” Petersen，他远在我在我感到能够胜任之前就鼓励我承担教学初学者的任务，并提供了实用的教学经验使课程取得成功。没有他，课程的第一版本将会失败。我们共同编写了设计此书的课程的第一版本，并反复教授这门课程，从经验中学习，不断改进课程和书籍。我在书中使用的“我们”最初指的是“Pete\
  \ 和我”。\n\n感谢德克萨斯 A&M 大学（TAMU）ENGR 112、ENGR 113 和 CSCE 121 的学生、助教和同行教师，他们直接和间接地帮助我们编写了这本书；感谢\
  \ Walter Daugherity、Hyunyoung Lee、Teresa Leyk、Ronnie Ward 和 Jennifer Welch，他们也教过这门课程。感谢\
  \ Damian Dechev、Tracy Hammond、Arne Tolstrup Madsen、Gabriel Dos Reis、Nicholas Stroustrup、J.\
  \ C. van Winkel、Greg Versoonder、Ronnie Ward 和 Leor Zolman 对本书的建设性意见。感谢 Mogens Hansen\
  \ 解释引擎控制软件。感谢 Al Aho、Stephen Edwards、Brian Kernighan 和 Daisy Nguyen 帮助我在夏天避开干扰以完成写作。\n\
  \n感谢 Art Werschulz 根据其在纽约市福特姆大学课程中使用本书第一版的经验，提供的许多建设性意见；感谢 Nick Maclaren 根据其在剑桥大学使用本书第一版，对练习题提出的许多详细意见。他的学生背景和专业需求与\
  \ TAMU 的大一学生完全不同。\n\n感谢 Addison-Wesley 为我找到的评审员。他们的意见大多基于在大学水平教授 C++ 或计算机科学 101，是无价的：Richard\
  \ Enbody、David Gustafson、Ron McCarty 和 K. Narayanaswamy。\n\n\n\n\n\n- `第一部分, “基础”`介绍了编程的基本概念和技术，以及开始编写代码所需的\
  \ C++ 语言和库设施。这包括类型系统、算术运算、控制结构、错误处理，以及函数和自定义类型的设计、实现和使用。\n- `第二部分, “输入与输出”`描述了如何从键盘和文件获取数值和文本数据，以及如何向屏幕和文件相应的输出。然后，它展示了如何将数值数据、文本和几何形状作为图形输出，以及如何从图形用户界面（GUI）向程序获取输入。\n\
  - `第三部分, “数据与算法”`专注于 C++ 标准库的容器和算法框架（`STL`，标准模板库）。它展示了容器（如 `vector`、`list` 和 `map`）是如何实现的（使用指针、数组、动态内存、异常和模板）以及使用的。它还演示了标准库算法（如\
  \ `sort`、`find` 和 `inner_product`）的设计和使用。\n- `第四部分, “拓宽视野”`通过讨论理想和历史、通过示例（如矩阵计算、文本处理、测试和嵌入式系统编程），以及对\
  \ C 语言的简要描述，提供了编程视角。\n- `附录`提供了不适合教程呈现的有用信息，例如 C++ 语言和标准库设施的综述，以及如何开始使用集成开发环境（IDE）和图形用户界面（GUI）库的说明。\n\
  \n遗憾的是，编程世界并没有真正分为四个完全独立的部分。因此，本书的“部分”仅对主题进行了粗略分类。我们认为这是一个有用的分类（显然，否则我们不会使用它），但现实总有办法逃避整齐的分类。例如，我们需要使用输入操作的时间远于我们能够对\
  \ C++ 标准 I/O 流（输入/输出流）进行彻底解释的时间。当介绍某个观点所需的话题与整体分类冲突时，我们会解释良好演示所需的最小内容，而不是仅仅引用其他地方的完整解释。严谨的分类对于手册比对于教程效果好得多。\n\
  \n主题的顺序由编程技术决定，而不是由编程语言特性决定；参见 §0.2。对于围绕语言特性组织的介绍，请参见 `附录 A`。\n\n![Image](img/00005.jpeg)\n\
  \n为了方便复习，并在你在第一次阅读时错过了关键点（此时你尚未发现哪种信息是关重要的）时提供帮助，我们在页边栏放置了三种“提醒标记”：\n\n- 蓝色：概念和技术（本段就是其中的例子）\n\
  - 绿色：建议\n- 红色：警告\n\n### 0.1.1 通用方法\n\n在书中，我们直接对你说话。这比大多数科学论文中常见的传统的“专业”间接称呼形式更简单、清晰。我们所说的“你”是指“你，读者”，而“我们”指的是“我们自己，作者和老师”，或者是指你我们通过一个问题共同工作，就像我们坐在同一个房间里可能会做的那样。\n\
  \n![Image](img/00006.jpeg)\n\n本书的设计旨在从头到尾逐章阅读。通常情况下，你可能想回头看第二次或第三次某些内容。事实上，这是唯一合理的方法，因为你总是会跳过一些你尚未看出其意义的细节。在这种情况下，你最终会再次回去。然而，尽管有索引和交叉引用，这并不是一本你可以打开任意一页并开始阅读且预期能成功的书。每个节和每个章节都假设你理解了之前的内容。\n\
  \n每一章都是一个相对独立的单元，旨在“一次性读完”（逻辑上是如此，尽管对于学生紧凑的时间表并不总是可行）。这是将文本分为章节的一个主要标准。其他标准还包括章节是练习和训练的合适单位，以及每个章节都介绍了某些特定的概念、思想或技术。这种标准的多元性导致少数章节变得异常冗长，因此请不要太字面地理解“一次性读完”。特别是，一旦你思考了复习题、完成了练习并做了几道习题，你通常会发现自己必须回去重读几节，而且时间已经过了几天。我们将章节分成了关注某个主要主题（如输入/输出）的“部分”。这些部分是很好的复习单元。\n\
  \n对教科书的常见赞誉是：“它在我刚想到时就回答了我所有问题！”这对于次要技术问题来说是一个理想状态，早期的读者已经在书中观察到了这种现象。然而，这不可能是全部的理想。我们提出的问题是学者可能根本的。我们的目标是提出并回答你在为他人编写高质量软件时需要考虑的问题。学习提出正确（通常是困难的）问题是学习像程序员一样思考的重要组成部分。\n\
  \n我们努力尊重你的智力并考虑到你的时间。在我们的介绍中，我们追求专业性而非可爱，我们宁愿淡化某个观点也不愿过度炒作。我们努力不夸大某种编程技术或语言特性的重要性，但请不要低估像“这通常有用”这样简单的陈述。如果我们静静地强调某事是重要的，我们的意思是如果不掌握它，迟早会浪费几天时间。我们对幽默的使用比我们预想的要有限，但经验表明，人们对什么是幽默的观点存在巨大差异，而且失败的幽默尝试可能会令人困惑。\n\
  \n![Image](img/00005.jpeg)\n\n我们并不假装我们的思想或提供的工具是完美的。没有任何工具、库、语言或技术是解决程序员面临的众多挑战的“终极方案”。至多，它可以帮助你开发和表达你的解决方案。我们努力避免“白色的谎言”；也就是说，我们克制使用那些清晰易懂但在真实语言和真实问题语境下不真实的过度简化解释。另一方面，本书并不是一本参考书；关于\
  \ C++ 更精确、更完全的描述，请参见 Bjarne Stroustrup 的 *The C++ Programming Language, Fourth Edition*\
  \ (Addison-Wesley, 2013) 以及 ISO C++ 标准。\n\n### 0.1.2 训练、习题等\n\n![Image](img/00006.jpeg)\n\
  \n不仅仅不仅仅智力活动，因此编写程序对于掌握编程技能是必要的。我们提供了两个级别的编程实践：\n\n- *训练 (Drills)*：训练是一种旨在培养实用、近乎机械技能的非常简单的练习。训练通常由对单个程序的一系列修改组成。你应该完成每一个训练。训练不需要深层次的理解、聪明或主动性。我们认为训练是书中的基础组成部分。如果你没有完成训练，你就没有“读完”这本书。\n\
  \n\n\n\n\n### 练习\n\n*   **练习：** 有些练习非常简单，另一些非常困难，但大多数练习都是为了留出一些发挥主动性和想象力的空间。如果你对待认真，你会做相当多的练习。至少做到到让你知道哪些对你来说是困难的，然后再多做几道这类题。这就是你进步最多的方法。这些练习的设计初衷是不需要过人的聪明就能完成的，而不是脑筋急转弯。然而，我们希望提供的练习具有足够的难度来挑战任何人，并且数量多到足以耗尽是最优秀的学生的精力。我们不要求你完成所有练习，但欢迎尽管尝试。\n\
  \n此外，我们建议你（每位学生）参加一个小型项目（如果时间允许，可以参加更多）。项目的目的是产生一个完整且用的程序。理想情况下，一个项目由一个小小组（例如三个人）合作完成一个月左右，同时学习第三部分中的章节。大多数人发现项目是最有趣的部分，也是将所有知识联系的纽带。\n\
  \n有些人喜欢在读完一个章节之前先放下书尝试一些示例；另一些人则倾向于在读到章节末尾后再尝试让代码运行。为了支持后者的偏好，我们在文本自然的断点处提供了标记为“**尝试这个（Try\
  \ this）**”的简单实际操作建议。`Try this` 通常是针对其前主题的狭窄范围的练习。如果你在没有尝试的情况下就跳过了 `Try this`——也许是因为你身边没有电脑，或者你觉得文本非常吸引人——那么请在做章节练习时回来尝试；`Try\
  \ this` 要么是章节练习的补充，要么是的一部分。\n\n在每个章节的末尾，你会找到一组复习题。它们旨在引导你关注章节中解释的核心思想。可以将复习题看作是练习练习的补充：练习侧重于编程的实践方面，而复习题试图帮助你清晰地表达想法和概念。在这方面，它们类似于良好的面试题。\n\
  \n每个章节末尾的“术语（Terms）”部分介绍了编程和 C++ 的基础词汇。如果你想理解人们在编程话题上的说法，并表达你自己的想法，你就应该知道每个词的含义。\n\
  \n学习涉及重复。我们的理想是让每个重要点至少出现两次，并通过练习对其进行强化。\n\n### 0.1.3 这本书之后是什么？\n\n![Image](img/00006.jpeg)\n\
  \n读完这本书后，你会成为编程和 C++ 专家吗？当然不会！如果方法得当，编程是一门微妙、深奥且高技能的艺术，建立在多种技术技能之上。你对在四个月内成为编程专家的期望，就像对在四个月内成为生物、数学、自然语言（如中文、英语或丹麦语）或小提琴专家的期望一样——哪怕是半年或一年也是如此。你应该希望的、并且如果你认真对待这本书就可以预期的，是有一个非常好的开始，让你能够编写相对简单实用的程序，能够阅读更复杂的程序，并为进一步工作提供良好的概念和实践基础。\n\
  \n这门入门课程最好的跟进方式是参与一个真实项目，开发供他人使用的代码。在那之后，或者（甚至是）在进行真实项目的同时，阅读一本专业级的通用教材（例如 Stroustrup\
  \ 编写的 *The C++ Programming Language*）、一本与你的项目需求更相关的专业书籍（如用于 GUI 的 Qt，或用于分布式编程的 ACE），或者一本专注于\
  \ C++ 特别方面的教科书（例如 Koenig 和 Moo 编写的 *Accelerated C++*；Sutter 的 *Exceptional C++*；或\
  \ Gamma 等人的 *Design Patterns*）。更多参考信息，请参阅 §0.6 或书末尾的参考文献部分。\n\n![Image](img/00006.jpeg)\n\
  \n最终，你应该学习另一种编程语言。我们认为，如果不了解超过一种语言，就不可能在软件领域成为专业人士——即使你主要职业不是程序员。\n\n### 0.2 教学与学习的哲学\n\
  \n我们试图帮助你学习什么？我们又是如何处理教学过程的？我们尝试为你提供最少的概念、技术和工具，以便你编写有效的实践程序，包括：\n\n*   程序组织\n*\
  \   调试与测试\n*   类设计\n*   计算\n*   函数和算法设计\n*   图形学（仅限二维）\n*   图形用户界面 (GUIs)\n*   文本处理\n\
  *   正则表达式匹配\n*   文件和流的输入输出 (I/O)\n*   内存管理\n*   科学/数值/工程计算\n*   设计与编程理想\n*   C++\
  \ 标准库\n*   软件开发策略\n*   C 语言编程技术\n\n通过学习这些主题，我们涵盖了被称为过程化编程（如 C 语言）、数据抽象、面向对象编程和泛型编程的编程技术。本书的主题是*编程*，即在代码中表达想法的理想、技术和工具。C++\
  \ 编程语言是我们的主要工具，因此我们详细描述了许多 C++ 的功能。但请记住，C++ 仅仅是一个工具，而不是本书的主题。这是“使用 C++ 编程”，而不是“带有一点编程理论的\
  \ C++”。\n\n我们讨论的每个主题至少有两个目的：它介绍了一种技术、概念或原则，同时也介绍了一种实用的语言或特性。例如，我们使用一个二维图形系统的接口来阐述类的用法。这允许我们节省空间（以及你的时间），并强调编程不仅仅是快速敲代码获取结果。C++\
  \ 标准库是此类“双重用途”示例的主要来源——许多甚至是三重用途。例如，我们介绍了标准库 `vector`，用它说明广泛使用的设计技术，并展示了实现它的许多编程技术。我们的目标之一是让你看到库设施是如何实现的，以及如何映射到硬件。我们坚持工匠必须理解他们的工具，而不仅仅是将它们视为“魔法”。\n\
  \n某些主题对某些程序员来说比对其他人更有趣。然而，我们鼓励你不要预判自己的需求（你如何知道未来需要什么呢？），至少看每一个章节。如果你作为课程的一部分阅读这本书，你的老师将指导你的选择。\n\
  \n![Image](img/00005.jpeg)\n\n我们将我们的方法表述为“深度优先”。它也是“具体优先”且“基于概念的”。首先，我们快速地（好吧，是相对快速，第\
  \ 1 章至第 11 章）汇集了编写小型实践程序所需的技能。在此，我们以最少的细节介绍了许多工具和技术。我们关注简单的具体的代码示例，因为人类掌握具体内容比掌握抽象内容更快。这正是大多数人的学习方式。在初始阶段，你不应该期望每一个微小的细节。特别是，你会发现尝试与刚刚成功略有不同的方法会产生“神秘”的效果。尽管如此，请尝试吧！并且请完成我们提供的练习和习题。。记住，早期你并不具备概念和技能来准确估计什么是简单的、什么是复杂的；要会有惊喜，并从中学习。\n\
  \n\n\n\n在初始阶段，我们进展得很快——我们希望让你尽可能快地达到编写有趣程序的水平。会有人辩道：“我们必须缓慢而谨慎地移动；在跑步之前，必须先学会走路！”但你观察过婴儿走路吗？婴儿在学会那种缓慢、受控的更精细的走路技能之前，他们真的会自己学会跑。同样地，你也会先飞冲直撞，其期间偶尔会绊绊子，以获得编程的感觉感，然后再慢下来，获得必要的精细控制和理解。你必须在学会走路之前先学会跑步！\n\
  \n![Image](img/00007.jpeg)\n\n至关重要的一点是，不要为了试图学习某种语言细节或技巧的“所有”内容而陷入僵局。例如，你可以记住 `C++`\
  \ 的所有内置类型以及它们的所有使用规则。当然，你可以做到这一点，而且这样做可能会让你觉得自己很有学问。然而，这并不能让你成为一名程序员。跳过细节会让你偶尔因为缺乏知识而“碰钉子”，但这是获得编写良好程序所需视角的最快方法。请注意，我们的方法本质上是孩子们学习母语时所采用的方法，也是教授外语最有效的方法。我们鼓励你在不可避免地遇到困难时，向老师、朋友、同事、指导员、导师等寻求帮助。请放心，早期章节中的没有任何内容在根本上是困难的。然而，很多内容将是陌生的，因此起初可能会感到困难。\n\
  \n随后，我们将在基础技能的基础上拓宽你的知识和技能基础。我们使用示例和练习来巩固你的理解，并为编程提供概念性基础。\n\n![Image](img/00006.jpeg)\n\
  \n我们非常强调理想和原因。在寻找实际解决方案时，你需要理想来引导你——知道何时一个解决方案是良好且有原则的。你需要理解这些理想背后的原因，以理解为什么它们应该是你的理想，为什么追求它们将帮助你以及你代码的用户。没有应该应该满足于“因为事实就是这样”这种解释。更重要的是，对理想和原因的理解使你能够从所知领域推广到新情况，并以新颖的方式结合想法和工具来解决新问题。知道“为什么”是获取编程技能的关键部分。相反，仅仅记忆许多理解不透彻的规则和语言功能是局限的，是错误的来源，也是对时间的巨大浪费。我们认为你的时间非常宝贵，并努力不浪费。\n\
  \n许多 `C++` 语言技术细节被归入附录和手册，你可以在需要时查阅。我们假设你有主动性在需要时搜索信息。使用索引和目录。忘记忘记编译器的在线帮助以及互联网。但请记住，在你有理由相信某个资源更好之前，对每个网络资源都要保持高度怀疑。许多看起来权威的网站是由编程初学者或有东西要卖的人建立的。另一些仅仅是过时的。我们在支持网站上提供了一系列链接和信息：[www.stroustrup.com/Programming](http://www.stroustrup.com/Programming)。\n\
  \n请不要对“现实的”示例过于不耐烦。我们的理想示例是直接说明语言功能、概念或技巧的最短、最简单的代码。大多数真实世界的示例比我们的要混乱得多，但它们所包含的内容并不超过我们演示内容的组合。数十万行代码的成功商业程序是基于我们在十几个\
  \ 50 行程序中演示的技巧。理解真实世界代码最快的方法是通过对基础的良好理解。\n\n另一方面，我们并不使用“涉及可爱动物的可爱示例”来阐述我们的观点。我们假设你的目标是编写供真实人员使用的真实程序，因此每一个未以语言技术形式的示例都取自真实世界。我们的基本基调是专业人士对（未来的）专业人士的对话。\n\
  \n### 0.2.1 主题顺序\n\n![Image](img/00005.jpeg)\n\n教人们编程的方法有很多。显然，我们并不认同流行的“我学习编程的方法就是最好的学习方法”这种理论。为了简化学习，我们在早期就介绍了一些几年前还被认为是高级的主题。我们的理想是，我们呈现的主题由你在学习编程过程中遇到的问题所驱动，并随着你理解和实践技能的提高，从一个主题平畅地流动到另一个主题。这本书的主流程像是一个故事，而不是字典或层级顺序。\n\
  \n不可能一次性学习编写程序所需的所有原则、技巧和语言功能。因此，我们必须选择一部分原则、技巧和特征作为开始。更广泛地说，教科书或课程必须引导学生经过一系列子集。我们认为选择主题和提供重点是我们的责任。我们不能介绍所有内容，所以必须选择；在旅程的每个阶段，我们留下的内容与保留的内容同样重要。\n\
  \n作为对比，你来说看到一份我们决定不采取的方法的（严重简化的的）特征列表可能对你有帮助：\n\n*   **“C 优先”**：这种学习 `C++` 的方法浪费了学生的时间，并通过强制学生使用比需要的少的设施、技巧和库来处理问题，导致糟糕的编程实践。`C++`\
  \ 比 `C` 提供了更强的类型检查、一个对初学者支持更好的标准库，以及用于错误处理的异常。\n*   **自下而上**：这种方法会分散学习良好且有效的编程实践的注意力。通过强制学生在语言和库支持不足的情况下解决问题，它促进了糟糕且浪费的编程实践。\n\
  *   **“如果你介绍了某些内容，就必须完整地介绍”**：这种方法意味着自下而上的方法（通过对每个每个主题不断深入）。它让初学者对他们不感兴趣且可能在多年后才需要的技术细节感到无味。一旦学会了编程，你可以在手册中查阅技术细节。手册擅长这一点，但对于最初学习概念来说是糟糕的。\n\
  *   **自顶向下**：这种从第一性原理向细节推进的方法往往会分散读者对编程实践层面的注意力，并迫他们在有机会欣赏其重要性之前集中于高级概念。例如，在学到程序中犯错有多容易以及纠正错误有多困难之前，你根本无法欣赏良好的软件开发原则。\n\
  *   **“抽象优先”**：关注通用原则并保护学生免受糟糕的真实世界限制，可能会导致对真实世界问题、语言、工具和硬件限制的蔑视。通常，这种方法由以后无法使用的“教学语言”提供支持，并（故意）让学生与硬件和系统问题隔离开来。\n\
  *   **“软件工程原则优先”**：这种方法和抽象优先的方法倾向于具有自顶向下方法相同的问题：如果没有具体的示例和实践经验，你根本无法欣赏抽象和良好的软件开发实践的价值。\n\
  \n\n\n\n\n- “从第一天起就面向对象”：面向对象编程是组织代码和编程工作的最佳方式之一，但它并非唯一有效的方法。特别是，我们认为，对类型基础和算法代码的深入理解是理解类设计和类层次结构的前提。我们确实从第一天起就使用用户定义类型（某些人称为“对象”），但直到第\
  \ 6 章\n\n我们先教编程，并将我们选择的编程语言视为次要的、工具。我们的通用方法适用于任何通用编程语言。我们的首要目标是帮助你学习通用概念、原理和技术。然而，这些内容不能孤立地去理解。例如，语法细节、可以直接表达的想法类型以及工具支持在不同的编程语言之间有所不同。然而，许多产生无\
  \ bug 代码的基础技术，例如编写逻辑简单的代码（第 5 章）、建立不变性（§9.4.3）以及将接口与实现细节分离（§9.7 和§14.1–2），不同编程语言之间的差异很小。\n\
  \n编程和设计技术必须通过编程语言来学习。设计、代码组织和调试不是你可以在抽象中获得的技能。你需要在某种编程语言中编写代码并获得这方面的实践经验。这意味着你必须学习编程语言的基础。我们称之为“基础”，是因为可以在几周内学完一门主流工业语言的时代已经一去不复了。我们介绍的\
  \ `C++` 部分被选择为最直接支持产生良好代码的子集。此外，我们还展示了你无法避免遇到的 `C++` 特性，可能是因为它们对于逻辑完整性是必要的，或者它们在\
  \ `C++` 社区中很常见。\n\n### 0.2.3 可移植性\n\n![Image](img/00005.jpeg)\n\n编写 `C++` 代码以运行在各种机器上是常见的。主要的\
  \ `C++` 应用程序运行在我们甚至从未听过的机器上！我们认为可移植性以及各种机器架构和操作系统的使用最为重要。基本上，书中的每一个示例不仅是 ISO 标准\
  \ `C++`，而且是可的。除非特别说明，我们展示的代码应该在每个 `C++` 实现上运行，并且已经在几台机器和操作系统上经过了测试。\n\n编译、链接和运行\
  \ `C++` 程序的细节在不同系统之间有所不同。每当我们需要引用实现问题时，提到每个系统和每个编译器的细节将非常繁琐。在附录 C 中，我们提供了关于在 Windows\
  \ 机器上开始使用 `Visual Studio` 和 `Microsoft C++` 的最基本信息。\n\n如果你在使用某个流行的但相当复杂的 IDE（集成开发环境）时遇到困难，我们建议你尝试从命令行工作；它出奇地简单。例如，这里是在\
  \ Unix 或 Linux 系统上使用 `GNU C++` 编译器编译、链接和执行一个由两个源文件 `my_file1.cpp` 和 `my_file2.cpp`\
  \ 组成的简单程序所需要的全套命令：\n\n点击此处此处查看代码图像\n\n```\nc++ –o my_program my_file1.cpp my_file2.cpp\n\
  ./my_program\n```\n\n是的，这真的就是全部了。\n\n## 0.3 编程与计算机科学\n\n编程就是计算机科学的全部吗？当然不是！我们提出这个问题的唯一原因是，人们已知对此感到困惑。我们涉及了计算机科学的主要议题，如算法和数据结构，但我们的目标是教编程：程序的的设计和实现。这比大多数被接受的计算机科学概念要多，也要少：\n\
  \n- *多*，因为编程涉及许多技术技能，这些技能通常不被认为是任何科学的一部分。\n- *少*，因为我们没有系统地介绍我们所使用的计算机科学部分的基础。\n\n\
  本书的目标是成为计算机科学课程的一部分（如果成为计算机科学家是你的目标），成为软件构建和维护中许多课程的基础（如果你的目标是成为程序员或软件工程师），泛而言之是更大整体的一部分。我们贯穿始终计算机科学并强调原理，我们将编程视为基于理论的实践技能。\n\
  \n## 0.4 创造力与问题解决\n\n本书的主要目标是帮助你用代码表达想法，而不是教你如何获得这些想法。在过程中，我们提供了许多解决问题的例子，通常是通过对问题的分析以及对解决方案的逐步完善。我们认为编程本身就是解决问题：只有完全理解问题及其解决方案，你才能编写正确的程序，而只有通过构建测试程序，你才能确定你的理解是完整的。因此，编程本质上是理解努力。然而，我们的目标是通过示例来演示，而不是通过“说教”或提供详细方案。\n\
  \n## 0.5 请求反馈\n\n我们认为完美的教科是不存在的；个人的需求差异太大，无法实现。然而，我们希望本书及其支持材料尽可能良好。为此，我们需要反馈；请向我们发送错误、拼写错误、文本不清晰、解释缺失等报告。我们也欢迎更好的练习、更好的示例以及增加或删除主题的建议。建设性的意见将有助于未来的读者，我们将在支持网站上发布错误列表：[www.stroustrup.com/Programming](http://www.stroustrup.com/Programming)。\n\
