  \ Inc.（后续版本）\n\n# 现代语言的根源\n\n以下图表展示了重要的早期语言：\n\n![Image](img/00240.jpeg)\n\n这些语言之所以重要是因为它们被广泛使用或作为现代语言的祖先——通常是与同名直系后代有相似名称的亲属。在本节中我们将探讨三种早期语言：Fortran、COBOL\
  \ 和 Lisp ，大多数现代语言都源于它们。\n\n## Fortran（公式翻译）\n\n图片展示了一个 IBM 工作人员在大型机前工作的场景。（原图已省略具体人物细节）。Fortran\
  \ 于一九五六年推出这被认为是编程领域最为重要的一步。“它代表了从人类习惯的数学表示法向高效机器代码的转变”。这种设计思想直接反映了将应用域直接编码进程序中这一想法。程序员可以用类似教科书中的线性代数形式编写程序并提供数组与循环功能以及标准数学库如`sin(x)`等。同时用户还可自定义函数及库等内容来提高可移植性使得在不同计算机间迁移只需少量修改工作即可完成操作过程非常简便易行且成本低廉甚至节省大量时间经费开销等等众多优点都是显而易见的但当时人们更关注的是如何让生成的机器码尽可能接近最优效率因为那时候电脑体积庞大价格昂贵(每台相当于数十位优秀程序员年薪总和)速度慢得惊人(每秒不到十万条指令)，内存也极小仅几千字节而已尽管如此依然有许多实用软件运行其上所以不能因改善语法而影响原有程序的性能发挥效果才是关键因素之一所在之处这也正是为何后来出现了多次版本更新迭代比如\
  \ II 、IV 、77 版到 9x 系列直至 03 版为止仍然存在争议是否现在更多人使用较好即是说明难度问题最终区别于价值趋向判断准则不同导致分歧永远无法统一明白吗？其实这些都不难理解只要稍加分析就能掌握精髓核心内容没变整体框架保持协调一致便可轻松应对各种情况绝非空穴来风胡说八道而是经过严格验证确实如此确凿无疑毋庸置疑没有任何悬念可言啊！这不我们接着往下讲吧……\n\
