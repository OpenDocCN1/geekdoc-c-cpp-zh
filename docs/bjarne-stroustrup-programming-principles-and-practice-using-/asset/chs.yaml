  ~~\");\n    return 2;\n}\n```\n\n## 7.8.4 我们到达目的地了吗？\n\n并没有。我们做了太多的改动，以至于我们需要再次测试所有内容、清理代码并检查注释。此外，我们还可以进行更多定义。例如，我们“忘记”提供一个赋值运算符（参见练习\
  \ 2），如果我们有了赋值操作，我们可能想要区分变量和常量（练习 3）。\n\n起初，我们放弃了在计算器中使用命名变量的想法。回头看实现它们的代码，我们可能会产生两种可能的反应：\n\
  \n1. **实现变量并没有那么糟糕；它只用了大约三十多行代码。**\n2. **实现变量是一项巨大的扩展。它触及了几乎每一个函数，并为计算器增加了一个全新的概念。它让计算器的体积增了\
  \ 45%，而我们甚至还没有实现赋值！**\n\n![Image](img/00006.jpeg)\n\n在一个具有显著复杂性的第一个程序的语境下，第二种反应是正确的。更广泛地说，对于任何会让程序规模和复杂度都增加约\
  \ 50% 的建议，产生这种反应都是正确的。当必须这样做时，它更像是基于之前的程序编写一个新程序，任何时候都应该被这样对待。特别是，如果你能像我们构建计算器那样分阶段构建程序并在每个阶段进行测试，这比尝试一次性完成整个程序要好得多。\n\
