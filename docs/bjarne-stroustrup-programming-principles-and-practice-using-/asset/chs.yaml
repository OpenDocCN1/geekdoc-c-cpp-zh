  \ 头文件\n- 8.4 作用域\n- 8.5 函数调用与返回\n- 8.5.1 声明参数和返回类型\n- 8.5.2 返回值\n- 8.5.3 按值传递\n\
  - 8.5.4 按常量引用传递\n- 8.5.5 按引用传递\n- 8.5.6 按值传递 vs. 按引用传递\n- 8.5.7 参数检查与转换\n- 8.5.8\
  \ 函数调用实现\n- 8.5.9 constexpr 函数\n- 8.6 求值顺序\n- 8.6.1 表达式求值\n- 8.6.2 全局初始化\n- 8.7\
  \ 命名空间\n- 8.7.1 using 声明与 using 指令\n\n## 8.1 技术细节\n\n如果有选择的话，我们更愿意讨论编程，而不是编程语言的特征；也就是说，我们认为如何将想法表示为代码，比研究用于表达这些想法的编程语言的技术细节要有趣得多。从自然语言中找一个类比来说：我们更愿意讨论一本好小说中的思想以及这些思想的表达方式，而不是研究英语的语法和词汇。重要是思想以及这些思想如何在代码中表达，而不是单个的语言特征。\n\
  \n然而，我们并不总是有选择的。当你开始编程时，你的编程语言对你来说是一门外语，你需要去查看它的“语法和词汇”。这就是我们在本章和下一章中要做的，但请不要忘记：\n\
  \n- 我们的主要学习是编程。\n- 我们的输出是程序/系统。\n- 编程语言（仅仅）是一个工具。\n\n记住这一点似乎是异常困难的。许多程序员开始热衷地关注语言语法和语义中看似微不足道的细节。特别是，有太多的人产生了一个错误认为，认为他们第一种编程语言中的处理方式是“唯一正确的方法”。请不要掉进陷阱。C++\
  \ 在很多方面都是非常棒的语言，但它并不完美；任何其他编程语言也是如此。\n\n大多数设计和编程概念是通用的，许多此类概念被流行的编程语言广泛支持。这意味着，在一个良好的编程课程中学到的基本思想和技术是可以从语言之间迁移的。\n\
  \n## 8.2 声明与定义\n\n声明 是一种向作用域中引入名称的语句：\n\n- 为所命名的指定类型（例如，变量或函数）\n- 可选地指定一个初始化（例如，初始化值或函数体）\n\
  \n例如：\n\n```cpp\nint a = 7; // 一个 int 变量\nconst double cd = 8.7; // 一个双精度浮点数常量\n\
  double sqrt(double); // 一个接受 double 参数并返回 double 结果的函数\nvector<Token> v; // 一个 Token\
  \ 向量变量\n```\n\n在 C++ 程序中使用某个名称之前，必须对其进行声明。考虑：\n\n```cpp\nint main()\n{\n    cout\
  \ << f(i) << '\\n';\n}\n```\n\n编译器会为这段代码给出至少三个“未定义的标识符”错误：`cout`、`f` 和 `i` 在此程序段中都没有声明。我们可以通过包含头文件\
  \ `std_lib_facilities.h` 来获取 `cout` 声明，该文件包含了它的声明：\n\n```cpp\n#include \"std_lib_facilities.h\"\
  \ // 我们在这里找到了 cout 的声明\n\nint main()\n{\n    cout << f(i) << '\\n';\n}\n```\n\n\n\
  \n\n现在，我们只剩下两个“undefined”（未定义）错误了。在编写实际程序时，你会发现大多数声明都出现在头文件中。我们就在那里为定义在“别处”的有用定义接口。基本上，声明定义了某物可以如何被使用；它定义了函数、`variable`或`class`的接口。请注意这种使用声明的一个显而易见但不可见的优势：我们不需要查看\
  \ `cout` 及其 `<<` 运算符是如何定义的；我们只需要 `#included` 它们的声明即可。我们甚至不需要看它们的声明；通过教科书、手册、代码示例或其他来源，我们只需要知道\
  \ `cout` 应该如何使用即可。编译器会读取头文件中所需的声明来“理解”我们的代码。\n\n然而，我们仍然必须声明 `f` 和 `i`。我们可以这样做：\n\
  \n点击此处查看代码图像\n\n```cpp\n#include \"std_lib_facilities.h\"      // 我们在这里找到了 cout\
  \ 的声明\n\nint f(int);                        // f 的声明\n\nint main()\n{\n    int i\
  \ = 7;                  // i 的声明\n    cout << f(i) << '\\n';\n}\n```\n\n这可以通过编译，因为每个名称都已经被声明，但它将无法链接\
  \ (2.4)，因为我们没有定义 `f()`；也就是说，我们没有在任何地方指定 `f()` 到底做什么。\n\n（同时也）完整指定了所声明实体的声明被称为定义\
  \ (definition)。例如：\n\n```cpp\nint a = 7;\n\nvector<double> v;\n\ndouble sqrt(double\
  \ d) { /* . . . */ }\n```\n\n每一个定义（根据定义 ![Image](img/00050.jpeg)）也是声明，但只有部分声明也是定义。以下是一些不是不是的声明示例；如果它所引用的实体被使用，则每个声明都必须在代码的其他地方匹配一个定义：\n\
  \n点击此处查看代码图像\n\n```cpp\ndouble sqrt(double);  // 这里没有函数体\n\nextern int a;      \
  \                  // “extern 加上无初始化”意味着“不是定义”\n```\n\n当我们对比定义和声明时，我们遵循惯例，使用 `declarations`\
  \ 来指代“不是定义的声明”，尽管这种术语略显不严。\n\n定义精确地指定了名称所引用的内容。特别是，变量的定义为该变量分配了内存。因此，你不能对某物定义两次。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\ndouble sqrt(double d) { /* . . . */ }  // 定义\ndouble sqrt(double\
  \ d) { /* . . . */ }  // 错误：重复定义\n\nint a;                               // 定义\n\
  int a;                               // 错误：重复定义\n```\n\n相比之下，不是定义的声明仅仅告诉你可以如何使用一个名称；它只是一个接口，不会分配内存或指定函数体。因此，只要你保持一致，你可以随心所欲地声明某物：\n\
  \n点击此处查看代码图像\n\n```cpp\nint x = 7;                          // 定义\nextern int x;\
  \                      // 声明\nextern int x;                      // 声明\n\ndouble\
  \ sqrt(double);                // 声明\ndouble sqrt(double d) { /* . . . */ }  //\
  \ 定义\n```\n\n\n\n\n• 模板（参见第 19 章）\n\n## 8.2.2 变量与常量声明\n\n变量或常量的声明指定了名称、类型以及一个可选的初始化器。例如：\n\
  \n点击此处查看代码图片\n\n```cpp\nint a;                          // 无初始化器\ndouble d = 7;\
  \                   // 使用 = 语法的初始化器\nvector<int> vi(10);             // 使用 ( ) 语法的初始化器\n\
  vector<int> vi2 {1,2,3,4};      // 使用 { } 语法的初始化器\n```\n\n你可以在 ISO C++ 标准中找到完整的语法说明。\n\
  \n常量的声明语法与变量相同。它们的区别在于类型中包含 `const` ，并且要求提供一个初始化器：\n\n点击此处查看代码图片\n\n```cpp\nconst\
  \ int x = 7;                // 使用 = 语法的初始化器\nconst int x2 {9};              // 使用\
  \ {} 语法的初始化器\nconst int y;                   // 错误：无初始化器\n```\n\n![Image](img/00006.jpeg)\n\
  \n`const` 要求初始化的原因显而易见：如果没有一个值，`const` 怎么能是一个常量呢？初始化变量几乎总是一个好主意；未初始化的变量是产生晦晦 bug\
  \ 的根源。例如：\n\n点击此处查看代码图片\n\n```cpp\nvoid f(int z)\n{\n    int x;                \
  \      // 未初始化\n    // . . . 此处没有给 x 赋值 . . .\n    x = 7;                      //\
  \ 给 x 赋值\n    // . . .\n}\n```\n\n这看起来很正常，但如果第一个 . . . 包含了对 `x` 的使用呢？例如：\n\n点击此处查看代码图片\n\
  \n```cpp\nvoid f(int z)\n{\n    int x;                      // 未初始化\n    // . .\
  \ . 此处没有给 x 赋值 . . .\n    if (z>x) {\n        // . . .\n    }\n    // . . .\n  \
  \  x = 7;                      // 给 x 赋值\n    // . . .\n}\n```\n\n由于 `x` 是未定义的，执行\
  \ `z>x` 将导致未定义行为。比较操作 `z>x` 在不同的机器上以及程序的不同运行中可能会产生不同的结果。原则上讲，`z>x` 可能会导致程序因硬件错误终止，但大多数情况下并不会发生。自然地我们不会故意这样做，但如果我们不一致地初始化变量，最终会不小心犯错。记住，大多数“愚错误”（例如在变量赋值之前使用未初始化的变量）都发生在你忙碌或疲劳时。编译器会尝试警告，但在复杂的代码中——这类错误最可能发生的地方——编译器并不足够智能来捕捉所有错误。有些人没有养成初始化变量的习惯，通常是因为他们学习编程的语言不允许或不鼓励一致的初始化；你会在他人的代码中看到这类例子。\n\
  \n我们更倾向于使用 `{ }` 语法。它是最通用的，并且显式地表示了“初始化器”。我们倾向于使用它，除非在非常简单的初始化中，我们有时会出于旧习惯使用 `=`，以及使用\
  \ `()` 来指定 `vector` 的元素数量（参见 17.4 节）。\n\n### 8.2.3 默认初始化\n\n你可能注意到，我们经常不为字符串、vector\
  \ 等等提供初始化器。例如：\n\n```cpp\nvector<string> v;\nstring s;\nwhile (cin>>s) v.push_back(s);\n\
  ```\n\n这并不违反“变量在使用在使用前必须初始化”的规则。原因在于 `string` 和 `vector` 的定义方式使得每当我们不提供初始化器时，这些类型的变量都会被初始化为默认值。因此，在我们进入循环之前，`v`\
  \ 是空的（它没有元素），而 `s` 是空的（`\"\"`）。保证默认初始化的机制被称为默认构造函数；参见 9.7.3。\n\n遗憾的是，语言不允许我们对内置类型提供此类保证。全局变量被初始化为\
  \ `0`，但你应该尽量减少全局变量的使用。最有用的变量——局部变量和类成员——除非你提供了初始化器（或默认构造函数），否则都是未初始化的。你已被警告过了！\n\
  \n## 8.3 头文件\n\n我们如何管理声明和定义呢？毕竟，它们必须保持一致，而在现实世界的程序中，可能有数万个声明；拥有数十万个声明的程序并不罕见。通常，当我们编写程序时，我们使用的多数定义并不是我们写的。例如，`cout`\
  \ 和 `sqrt()` 的实现是多年前别人编写的。我们只需要使用它们。\n\n![Image](img/00005.jpeg)\n\n在 C++ 中管理“别处”定义的设施声明的关键在于头文件。基本上，头文件是声明的集合，通常定义在一个文件中，因此也称为头文件。这些头文件会被包含在我们的源文件中。例如，我们可能决定通过分离标记管理来改进计算器源码（第\
  \ 6 和第 7 章）的组织结构。我们可以定义一个包含使用标记所需的声明的头文件 `token.h`：\n\n![Image](img/00052.jpeg)\n\
  \n`Token` 和 `Token_stream` 的声明在 `token.h` 中。它们的定义在 `token.cpp` 中。`.h` 后缀是 C++ 头文件最常用的，`.cpp`\
  \ 后缀是 C++ 源文件最常用的。实际上，C++ 语言并不关心后缀，但某些编译器和程序开发环境坚持如此，所以请对代码遵循这种约定。\n\n原则上，`#include\
  \ \"file.h\"` 只是将 `file.h` 中的声明复制到你的文件中。例如，我们可以写头文件 `f.h`：\n\n```cpp\n// f.h\nint\
  \ f(int);\n```\n\n并包含在我们的文件 `user.cpp` 中：\n\n```cpp\n// user.cpp\n#include \"f.h\"\
  \nint g(int i)\n{\n    return f(i);\n}\n```\n\n编译 `user.cpp` 时，编译器会执行 `#include`\
  \ 并编译：\n\n```cpp\nint f(int);\nint g(int i)\n{\n    return f(i);\n}\n```\n\n由于 `#include`\
  \ 逻辑上发生在任何其他操作之前，处理 `#include` 属于预处理的一部分。\n\n![Image](img/00006.jpeg)\n\n为了方便一致性检查，我们在使用声明的文件和提供定义的文件都包含头文件。这样，编译器就能尽早发现错误。例如，假设\
  \ `Token_stream::putback()` 的实现者犯了错误：\n\n点击此处查看代码图片\n\n```cpp\nToken Token_stream::putback(Token\
  \ t)\n{\n    buffer.push_back(t);\n    return t;\n}\n```\n\n这看起来很正常。幸运的是，编译器捕捉了这些错误，因为它看到了包含了\
  \ `Token_stream::putback()` 的声明。将该声明与我们的定义对比，编译器发现 `putback()` 不应该返回 `Token`，且 `buffer`\
  \ 是 `Token` 而不是 `vector<Token>`，所以我们无法使用 `push_back()`。这类错误发生在我们改进代码但未能让整个程序的更改保持一致时。\n\
  \n同样，考虑这些错误：\n\n点击此处查看代码图片\n\n```cpp\nToken t = ts.gett(); // 错误：没有成员 gett\n// .\
  \ . .\nts.putback();        // 错误：缺少参数\n```\n\n编译器会立即给出错误；头文件 `token.h` 提供了它检查所需的所有信息。\n\
  \n\n\n\n我们的 `std_lib_facilities.h` 头文件包含了我们使用的标准库设施的声明，例如 `cout`、`vector` 和 `sqrt()`，以及几个不属于标准库的简单实用函数，如\
  \ `error()`。在 §12.8 节中，我们展示了如何直接使用标准库头文件。\n\n![Image](img/00006.jpeg)\n\n一个头文件通常会被包含在多个源文件中。这意味着头文件应该只包含可以在多个文件中重复的声明（例如函数声明、类定义和数值型常量的定义）。\n\
  \n## 8.4 作用域\n\n![Image](img/00005.jpeg)\n\n作用域 是程序文本的一个区域。名称在作用域内声明，并从其声明处开始到其声明所在作用域结束处为止都是有效的（即“在作用域内”）。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nvoid f()\n{\n    g(); // error: g() 尚未（在）作用域内\n}\n\nvoid\
  \ g()\n{\n    f(); // OK: f() 在作用域内\n}\n\nvoid h()\n{\n    int x = y; // error:\
  \ y 尚未（在）作用域内\n    int y = x; // OK: x 在作用域内\n    g();       // OK: g() 在作用域内\n\
  }\n```\n\n作用域内的名称可以从嵌套在其内部的作用域看到。例如，`f()` 的调用位于 `g()` 的作用域内，而 `g()` “嵌套”在全局作用域中。全局作用域是不嵌套在任何其他作用域中的作用域。名称在使用之前必须先声明的规则仍然成立，因此\
  \ `f()` 不能调用 `g()`。\n\n我们使用几种类型的作用域来控制名称可以被使用的位置：\n\n- **全局作用域**：任何其他作用域之外的文本区域\n\
  - **命名空间作用域**：嵌套在全局作用域或另一个命名空间中的具名作用域；见 §8.7\n- 类作用域：类内部的文本区域；见 §9.2\n- **局部作用域**：块的\
  \ `{ . . . }` 大括号之间，或者在函数参数列表中\n- 语句作用域：例如，在 `for` 语句中\n\n作用域的主要目的是保持名称局部化，这样它们就不会与在别处声明的名称冲突。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nvoid f(int x) // f 是全局的；x 是 f 局部的\n{\n    int z = x+7; //\
  \ z 是局部的\n}\n\nint g(int x) // g 是全局的；x 是 g 局部的\n{\n    int f = x+2; // f 是局部的\n\
  \    return 2*f;\n}\n```\n\n或者用图示表示：\n\n![Image](img/00053.jpeg)\n\n这里 `f()` 的 `x`\
  \ 与 `g()` 的 `x` 不同。它们没有“冲突”，因为它们不在同一个作用域内：`f()` 的 `x` 是 `f` 局部的，`g()` 的 `x` 是 `g`\
  \ 局部的。同一作用域内两个不兼容的声明通常被称为**冲突**。同样，在 `g()` 内部定义并使用的 `f` 显然不是函数 `f()`。\n\n这里是一个逻辑等价但更真实的局部作用域使用示例：\n\
  \n点击此处查看代码图像\n\n```cpp\nint max(int a, int b) // max 是全局的；a 和 b 是局部的\n{\n    return\
  \ (a>=b) ? a : b;\n}\n\nint abs(int a) // 不是 max() 的 a\n{\n    return (a<0) ? a\
  \ : a;\n}\n```\n\n你可以在标准库中找到 `max()` 和 `abs()`，所以你不需要自己写它们。`?:` 结构被称为**算术 if**或**条件表达式**。如果\
  \ `a>=b`，则 `(a>=b)?a:b` 的值为 `a`，否则值为 `b`。条件表达式避免了我们编写如下这种冗长的代码：\n\n点击此处查看代码图像\n\n\
  ```cpp\nint max(int a, int b) // max 是全局的；a 和 b 是局部的\n{\n    int m; // m 是局部的\n\
  \    if (a>=b)\n        m = a;\n    else\n        m = b;\n    return m;\n}\n```\n\
  \n![Image](img/00006.jpeg)\n\n所以，除了全局作用域这个显著例外外，作用域使名称保持局部化。对于大多数目的来说，局部化是好的，因此请尽可能保持名称局部化。当我在函数、类等内部声明变量、函数等时，它们就不会干扰到你的。记住，名称的作用域越广，其名称越应该具有描述性：`x`、`y`、`f`\
  \ 作为全局名称是非常糟糕的。一个良好的程序应该只有极少（例如一两个），甚至没有全局变量。想象你正在调试一个程序，发现一个全局变量有一个意想不到的值。谁给它赋了这个值？哪些函数写入了该值？你如何知道？写入该错误值的函数可能位于你从未见过的源文件中！为了保持程序可管理，大多数名称应该是局部的。例如，计算器在第\
  \ 6 章和 7 章有两个全局变量：标记流 `ts` 和符号表 `names`。\n\n注意大多数 C++ 构造定义了作用域：\n\n- **类内部函数**：成员函数（见\
  \ §9.4.2）\n\n点击此处查看代码图像\n\n```cpp\nclass C {\npublic:\n    void f();\n    void g()\
  \ // 成员函数可以在类内定义\n    {\n        // ...\n    }\n    // ...\n};\n\nvoid C::f() //\
  \ 成员函数定义可以在类外\n\n\n\n\n这在 C++ 中是不合法的；不要这样做。编译器会拒绝它。\n\n• 函数内部的块和其他块：嵌套块\n\n```cpp\n\
  void f(int x, int y)\n{\n    if (x>y) {\n        // . . .\n    }\n    else {\n \
  \       // . . .\n        {\n            // . . .\n        }\n        // . . .\n\
  \    }\n}\n```\n\n嵌套块是不可避免的，但要对复杂的嵌套要保持警惕：它很容易隐藏错误。\n\nC++ 还提供了一种语言特征 `namespace`，专门用于表示作用域；请参见\
  \ §8.7。\n\n![Image](img/00006.jpeg)\n\n注意我们使用了一致的缩进来表示嵌套。如果没有一致的缩进，嵌套结构将变得不可读。例如：\n\
  \n```cpp\n// 极其危险的丑代码\nstruct X {\n    void f(int x) {\n        struct Y {\n   \
  \         int f() { return 1; } int m;\n        };\n        int m;\n        m=x;\
  \ Y m2;\n        return f(m2.f());\n    }\n    int m; void g(int m) {\n        if\
