  \ bug。\n\n# 后记\n\n碰巧，我们现在已经看到了编译器如何工作的简单示例。计算器分析分解为标记（tokens）的输入并根据语法进行理解。这正是编译器所做的。在分析输入后，编译器会生成一种表示（对象代码），我们稍后可以执行它。计算器立即执行它所分析的表达式；执行此类的程序被称为解释器而不是编译器。\n\
  \n# 8. 技术细节：函数等\n\n“任何才华都无法克服对细节的痴迷。”——传统格言\n\n在本章和下一章中，我们将关注点从编程转向我们编程的主要工具：C++\
  \ 编程语言。我们介绍语言的术细节，以便对 C++ 的基本设施提供更宽的视角，并为这些设施提供一个更系统性的视角。这些章节还作为目前为止介绍的许多编程概念的复，并提供了一个探索我们工具的机会，无需引入新的编程技术或概念。\n\
