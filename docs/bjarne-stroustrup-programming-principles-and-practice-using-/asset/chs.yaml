  \ T&`。\n\n- **布尔转换：** 指针、整数和浮点数值可以隐式转换为 `bool`。非零值转换为 `true`；零值转换为 `false`。\n\n\
  - **浮点到整数的转换：** 当浮点值转换为整数值时，小数部分会被丢弃。换句话说，从浮点类型到整数类型的转换会截断。如果截断后的值无法用目标类型表示，则行为是未定义的。从整数到浮点类型的转换在硬件允许的范围内尽可能准确。如果整数值无法精确表示为浮点类型的值，则会发生精度丢失。\n\
  \n- **常规算术转换：** 这些转换在二元运算符的操作数上进行，以将它们转换为公共类型，该类型随后作为结果的类型：\n\n1. 如果其中一个操作数的类型为\
  \ `long double`，则另一个被转换为 `long double`。否则，如果其中一个操作数是 `double`，则另一个转换为 `double`。否则，如果其中一个操作数是\
  \ `float`，则另一个转换为 `float`。否则，对两个操作数均执行整数提升。\n\n2. 接着，如果其中一个操作数是 `unsigned long`，则另一个转换为\
  \ `unsigned long`。否则，如果一个操作数是 `long int` 而另一个是 `unsigned int`，那么如果 `long int` 能表示\
  \ `unsigned int` 的所有值，则 `unsigned int` 转换为 `long int`；否则，两个操作数均转换为 `unsigned long\
  \ int`。否则，如果其中一个操作数是 `long`，则另一个转换为 `long`。否则，如果其中一个操作数是 `unsigned`，则另一个转换为 `unsigned`。否则，两个操作数均为\
  \ `int`。\n\n显然，最好不要过度依赖复杂的类型混合，以最大限度地减少对隐式转换的需求。\n\n### A.5.2.3 用户定义的转换\n\n除了标准的提升和转换外，程序员还可以为用户定义的类型定义转换。接受单个参数的构造函数定义了从其参数类型到该类型类型的转换。如果该构造函数是\
  \ `explicit` 的（见 §18.4.1)），则只有在程序员显式要求转换时才会发生。否则，转换可以是隐式的。\n\n### A.5.3 常量表达式\n\n\
  常量表达式是一个可以在编译时求值的表达式。例如：\n\n```cpp\nconst int a = 2.7*3;\nconst int b = a+3;\nconstexpr\
  \ int a = 2.7*3;\nconstexpr int b = a+3;\n```\n\n`const` 可以用涉及变量的表达式进行初始化。`constexpr`\
  \ 必须由常量表达式初始化。某些地方需要常量表达式，例如数组边界、case 标签、枚举初始化器和 int 模板参数。例如：\n\n```cpp\nint var\
  \ = 7;\nswitch (x) {\ncase 77:        // OK\ncase a+2:      // OK\ncase var:   \
  \   // 错误 (var 不是常量表达式)\n               // . . .\n};\n```\n\n声明为 `constexpr` 的函数可以在常量表达式中使用。\n\
  \n### A.5.4 sizeof\n\n在 `sizeof(x)` 中，`x` 可以是一个类型也可以是一个表达式。如果 `x` 是表达式，`sizeof(x)`\
  \ 的值是结果对象的大小。如果 `x` 是类型，`sizeof(x)` 是类型为 `x` 对象的大小。大小以字节为单位。根据定义，`sizeof(char)==1`。\n\
  \n### A.5.5 逻辑表达式\n\nC++ 为整数类型提供了逻辑运算符：\n\n位运算符对其操作数的每个位进行操作，而逻辑运算符（`&&` 和 `||`）将\
  \ 0 视为值 false，将其他任何视为值 true。操作的定义如下：\n\n### A.5.6 new and delete\n\n空存储区（动态存储、堆）上的内存使用\
  \ `new` 分配并使用 `delete`（针对单个对象）或 `delete[]`（针对数组）释放（释放内存）。如果内存耗尽，`new` 会抛出 `bad_alloc`\
  \ 异常。成功的 `new` 操作分配至少 1 字节并返回指向分配对象的指针。分配对象的类型在 `new` 之后指定。例如：\n\n```cpp\nint* p1\
  \ = new int;      // 分配（未初始化）int\nint* p2 = new int(7);   // 分配初始化为 7 的 int\nint*\
  \ p3 = new int[100]; // 分配 100 个（未初始化）int\n\ndelete p1;               // 释放单个对象\n\
  delete p2;\ndelete p3;              // 释放数组\n```\n\n如果使用 `new` 分配内置类型对象，它们不会初始化，除非你指定了初始化器。对于类对象，`new`\
  \ 会调用构造函数；除非你指定了初始化器。`delete` 会调用操作数的析构函数（如果有）。\n\n### A.5.7 强制转换\n\n四种类型转换运算符：\n\
  \n- `dynamic_cast` 通常用于类层次结构，其中 `p` 是基类指针且 `D` 是派生类。如果你希望 `dynamic_cast` 抛出异常（`bad_cast`）而不是返回\
  \ 0，请将其转换为引用。`dynamic_cast` 是唯一依赖运行时检查的转换。\n- `static_cast` 用于“良好的转换”，其中 `v` 可能是隐式转换的结果；见\
  \ §17.8。\n- `reinterpret_cast` 用于重新解释位模式。它不保证可移植。事实上，最好假设每次使用 `reinterpret_cast`\
  \ 都是不可移植的。典型的例子是将整数转换为指针以获取机器地址到程序；见 §17.8 和 §25.4.1。\n- C 风格转换和函数式转换可以执行任何通过 `static_cast`\
  \ 或 `reinterpret_cast` 结合 `const_cast` 实现的转换。\n\n最好避免强制转换。在大多数情况下，使用它们是编程不佳的标志。此规则的例外见于\
  \ §17.8 和 §25.4.1。C 风格转换和函数式转换有一个糟糕的特性，即你不需要完全理解转换在做什么（§27.3.4)）。在无法避免式类型转换时，优先使用命名转换。\n\
  \n### A.6 语句\n\n这里是 C++ 语句的语法（`opt` 表示“可选”）：\n\n```\nstatement:\n    declaration\n\
  \    { statement-list[opt] }\n    try { statement-list[opt] } handler-list\n   \
  \ expression[opt] ;\n    selection-statement\n    iteration-statement\n    labeled-statement\n\
  \    control-statement\n\nselection-statement:\n    if ( condition ) statement\n\
  \    if ( condition ) statement else statement\n\niteration-statement:\n    while\
  \ ( condition ) statement\n    do statement while ( expression ) ;\n```\n\n\n\n\n\
  \n```\nfor ( *for-init-statement condition*[*opt*] ; *expression*[*opt*] ) *statement*\n\
  for ( *declaration* : *expression* ) *statement*\n```\n\n### labeled-statement\n\
  ```\ncase *constant-expression* : *statement*\ndefault : *statement*\nidentifier\
  \ : *statement*\n```\n\n### control-statement\n```\nbreak ;\ncontinue ;\nreturn\
  \ *expression*[*opt*] ;\ngoto *identifier* ;\n```\n\n### statement-list\n`*statement\
  \ statement-list*[*opt*]`\n\n### condition\n```\n*expression*\n*type-specifier declarator*\
  \ = *expression*\n```\n\n### for-init-statement\n```\n*expression*[*opt*] ;\n*type-specifier\
  \ declarator* = *expression* ;\n```\n\n### handler-list\n```\ncatch ( *exception-declaration*\
  \ ) { *statement-list*[*opt*] }\n*handler-list handler-list*[*opt*]\n```\n\n注意，声明是一个语句，并且没有赋值语句或过程调用语句；赋值和函数调用都是表达式。更多信息请参见：\n\
  \n- 迭代（`for` 和 `while`）；参见 4.4.2。\n- 选择（`if`、`switch` 和 `case`）；参见 4.4.1。`break`\
  \ “跳出”最近的包含它的 `switch-statement`、`while-statement` 或 `for-statement`；也就是说，下一个执行的语句将是该语句之后的语句。\n\
  - 表达式；参见 A.5, 4.3。\n- 声明；参见 A.6, 8.2。\n- 异常（`try` 和 `catch`）；参见 5.6, 19.4。\n\n这是一个为了简单演示各种语句而编写的示例（它是做什么的？）：\n\
  \n```cpp\nint f(int p[], int n)\n{\n  if (p==0) throw Bad_p(n);\n  vector<int> v;\n\
  \  int x;\n  while (cin>>x) {\n    if (x==terminator) break; // 循环\n    v.push_back(x);\n\
  \  }\n  for (int i = 0; i<v.size() && i<n; ++i) {\n    if (v[i]==p)\n      return\
  \ p;\n    else\n      ++p;\n  }\n  return 0;\n}\n```\n\n### A.7 Declarations\n一个\
  \ `declaration` 由三部分组成：\n- 被声明实体的名称\n- 被声明实体的类型\n- 被声明实体的初始值（在大多数情况下可选的）\n\n我们可以声明：\n\
  - 内置类型和用户定义类型的对象（A.8）。\n- 用户定义类型（类和枚举）（A.10–11，第 9 章）。\n- 模板（类模板和函数模板）（A.13）。\n\
  - 别名（A.16）。\n- 命名空间（A.15, 8.7）。\n- 函数（包括成员函数和运算符）（A.9, 第 8 章）。\n- 举元素（枚举值）（A.11,\
  \ 9.5）。\n- 宏（A.17.2, 27.8）。\n\n初始化器可以是由 `{ }` 分隔的表达式列表，包含零或多个元素（3.9.2, 9.4.2, 18.2）。例如：\n\
  ```cpp\nvector<int> v {a,b,c,d};\nint x {y*z};\n```\n\n如果定义中对象的类型为 `auto`，则该对象必须初始化，且其类型即为初始化器的类型（13.3,\
  \ 21.2）。例如：\n```cpp\nauto x = 7; // x 是一个 int\nconst auto pi = 3.14; // pi 是一个 double\n\
  for (const auto& x : v) // x 是 v 中元素的引用\n```\n\n#### A.7.1 Definitions\n初始化、分配内存或以其他方式为在程序中使用某个名称提供所有必要条件的声明称为定义（definition）。程序中的每个类型、对象和函数必须恰好有一个定义：\n\
  \n```cpp\ndouble f(); // 一个声明\ndouble f() { /* . . */ }; // （也是）一个定义\nextern int\
  \ x; // 一个声明\nint y; // （也是）一个定义\nint z = 10; // 带有显式初始化器的定义\n```\n\n`const` 必须初始化。这通过要求\
  \ `const` 必须有初始化器来实现，除非它的声明中带有 `extern`（因此初始化器必须在别处）或者它是一个具有默认构造函数的类型（A.12）。`const`\
  \ 类成员必须在每个构造函数中进行初始化。\n\n### A.8 Built-in types\nC++ 有了一系列基础类型以及通过修饰符从基础类型构建的类型：这里，`T`\
  \ 表示“某种类型”，你可以拥有 `unsigned int`、`long double`、`unsigned char` 和 `const char`（指向常量的指针）。然而，这个系统并不是完美的；例如，没有\
  \ `short double`（那应该是 `float`），没有 `signed bool`（那将毫无意义），没有 `short int`（那是多余的），也没有\
  \ `long long int`。`long long` 保证至少包含 64 位。\n\n`floating-point types`（浮点类型）是 `float`、`double`\
  \ 和 `long double`。它们是 C++ 对实数的近似。\n\n`integer types`（整数类型，有时称为 integral types）是\
  \ `bool`、`char`、`int`、`long` 和 `long long` 以及它们的无符号变。注意，枚举类型或值通常可以使用需要整数类型或值的地方。\n\
  \n内置类型的大小在 3.8、17.3.1 和 25.5.1 中讨论。指针和数组在第 17 和 18 章中讨论。引用在 8.5.4 中讨论。\n\n#### A.8.1\
  \ Pointers\n一个 `pointer`（指针）是对象或函数的地址。指针存储在指针类型的变量中。一个有效的对象指针持有对象的地址：\n\n```cpp\n\
  int x = 7;\nint* pi = &x; // pi 指向 x\nint xx = *pi; // *pi 是 pi 所指向的对象的值，即 7\n```\n\
  \n无效的指针是不持有对象值值的指针：\n\n```cpp\nint* pi2; // 未初始化\n*pi2 = 7; // 未定义行为\npi2 = nullptr;\
  \ // 空指针（pi2 仍然无效）\n*pi2 = 7; // 未定义行为\npi2 = new int(7); // 现在 pi2 有效\nint xxx\
  \ = *pi2; // 正常：xxx 变为 7\n```\n\n我们尝试让无效指针持有空指针（`nullptr`），以便对其测试：\n\n```cpp\nif\
  \ (p2 == nullptr) { // “如果无效”\n  不要使用 *pi2\n}\n```\n\n或者简单的\n\n```cpp\nif (p2) {\
  \ // “如果有效”\n  使用 *pi2\n}\n```\n\n\n\n\n\n请注意，任何形式的指针算术运算（例如`++p`和`p += 7`）仅允许用于指向数组的指针，且对指向数组范围外的指针进行解引用的效果是未定义的（而且很可能不会被编译器或语言运行时系统检查）。比较运算符\
  \ `<`, `<=`, `>`, 和 `>=`也可用于同一对象或数组中相同类型的两个指针。\n\n对于“void*”类型的指针，唯一允许的操作有：复制操作（赋值或初始化）、类型转换以及比较操作（==、!=、<、<=、>\
  \ 和 >=）。\n\n函数指针对其只能进行复制与调用两种操作。示例如下：\n\n```\nusing Handle_type = void (*)(int);\n\
  \nvoid my_handler(int);\n\nHandle_type handle = my_handler;\n\nhandle(10);     \
  \     // equivalent to my_handler(10)\n```\n\n### A.8.2 Arrays\n\n**数组**是一个固定长度的连续序列，包含给定类型的一组对象元素：\n\
