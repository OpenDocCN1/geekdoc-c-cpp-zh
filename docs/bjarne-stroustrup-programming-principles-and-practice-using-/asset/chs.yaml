  \n### 术\n\nanalysis\n\nclass\n\ndata member\n\ndesign\n\ndivide by zero\n\ngrammar\n\
  \nimplementation\n\ninterface\n\nmember function\n\nparser\n\nprivate\n\nprototype\n\
  \npseudo code\n\npublic\n\nsyntax analyzer\n\ntoken\n\nuse case\n\n### 习题\n\n**1.**\
  \ 如果你还没有这样做，请完成本章的**尝试一下**练习。\n\n**2.** 使程序可以使用 `{}` 而以及 `()`，使得 `{4+5}6 / (3+4)`\
  \ 成为一个有效的表达式。\n\n**3.** 添加一个阶乘运算符：使用后缀 `!` 运算符表示“阶乘”。例如，表达式 `7!` 意味着 `7 * 6 * 5\
  \ * 4 * 3 * 2 * 1`。让 `!` 的优先级比 `*` 和 `/` 更紧；也就是说 `7*8!` 意味着 `7*(8!)` 而不是 `(7*8)!`。从修改语法以处理运算符开始。提示：计算器函数处理\
  \ double，但阶乘只对 int 定义，所以对于 `x!`，将 `x` 赋值给一个 int 并计算该 int 的阶乘。为了与标准的数学定义一致，让 `0!`\
  \ 的结果为 `1`。\n\n**4.** 定义一个持有字符串和值的 `Name_value` 类。重做 4 章中的第 19 题，使用 `vector<Name_value>`\
  \ 代替两个 vector。\n\n**5.** 在 §6.4.1 中的“英语”语法中添加冠词 `the`，以便它可以描述诸如“鸟在飞翔，但鱼在游泳”这样的句子。\n\
  \n\n\n\n\n## 6. 编写一个程序，检查句子是否符合 §6.4.1 节中定义的“英语”语法。假设每个句子都以带有空格的句号（.）结束。例如，`birds\
  \ fly but the fish swim .` 是句子，但 `birds fly but the fish swim`（缺少结束点）和 `birds fly\
  \ but the fish swim.`（点前没有空格）不是。对于输入的每个句子，程序只需简单响应“OK”或“not OK”。提示：不要管标记；直接使用 `>>`\
  \ 读取到字符串中。\n\n## 7. 为位运算逻辑表达式编写语法。位运算逻辑表达式与算术表达式相似，但运算符是 `!`（非）、`~`（取反）、`&`（与）、`|`（或）和\
  \ `^`（异或）。每个运算符对其整数操作数的每个位执行相应的操作（见 §25.5）。`!` 和 `~` 是前缀一元运算符。`^` 的优先级高于 `|`（就像\
  \ `*` 的优先级高于 `+`），因此 `x|y^z` 意味着 `x|(y^z)` 而不是 `(x|y)^z`。`&` 运算符的优先级高于 `^`，因此 `x^y&z`\
  \ 意味着 `x^(y&z)`。\n\n## 8. 重做 第 5 章 中练习 12 的“牛牛游戏”，使用四个字母而不是四个数字。\n\n## 9. 编写一个程序读取数字并将其组成整数。例如，`123`\
  \ 被读取为字符 `1`、`2` 和 `3`。程序应该输出 `123 is 1 hundred and 2 tens and 3 ones`。该数字应作为 `int`\
  \ 值的输出。处理一位、两位、三位或四位的数字。提示：从字符 `'5'` 获取整数值 `5`，需要减去 `'0'`，即 `'5'`–'0'==5。\n\n##\
  \ 10. 排列是集合的有序子集。例如，假设你想为一个保险箱选择一个组合。有 60 种可能的数字，你需要三个不同的数字作为组合。组合有 `P(60,3)` 种排列，其中\
  \ `P` 由公式定义：\n\n![Image](img/00048.jpeg)\n\n其中 `!` 用于后缀阶乘运算符。例如，`4!` 等于 `4*3*2*1`。\n\
  \n组合与排列相似，但对象的顺序并不重要。例如，如果你在制作一个“香蕉浮”冰激，并希望从拥有的五种冰淇淋中选择三种不同的口味，你并不会在意是在开头还是结尾使用一勺香草味；你都已经使用了香草味。组合的公式为：\n\
  \n![Image](img/00049.jpeg)\n\n设计一个程序，要求用户输入两个数字，询问他们想计算排列还是组合，并打印结果。这将包含几个部分。对上述需求进行分析。准确写出程序必须执行的操作。然后进入设计阶段。为程序编写伪代码，并将其拆分为子组件。该程序应该包含错误检查。确保所有错误输入都能生成良好的错误信息。\n\
  \n# 后记\n\n理解输入是基础编程活动之一。每个程序都会以某种方式面临这个问题。理解由人类直接产生是最困难的问题之一。例如，语音识别的许多方面仍然是一个研究问题。这个问题的简单变体（如我们的计算器）通过使用语法来定义输入得以解决。\n\
  \n## 7. 完成程序\n\n“胖女人不唱歌，战斗未结束。”\n\n——歌剧谚言\n\n编写程序涉及逐渐完善你对想做什么以及想如何表达它的想法。在第 6 章\
  \ 中，我们制作了计算器程序的初始工作版本。在这里，我们将对其进行完善。完成程序——即使其适合用户和维护者——涉及改进用户界面、对错误处理 进行一些大量工作、添加一些实用的功能，并重构代码以便于理解和修改。\n\
