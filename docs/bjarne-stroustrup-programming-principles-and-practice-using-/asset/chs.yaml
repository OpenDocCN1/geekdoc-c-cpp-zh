  既然我们已经有了名称，就可以很容易地预定义几个常用的名称。例如，如果我们假设我们的计算器将用于科学计算，我们想要 `pi` 和 `e`。我们应该在代码的哪个位置定义它们呢？是在\
  \ `main()` 中调用 `calculate()` 之前，还是在 `calculate()` 中循环之前？我们将把它们放在 `main()` 中，因为这些定义实际上并不属于任何计算：\n\
  \n点击此处查看代码图片\n\n```cpp\nint main() \n\ntry {\n    // predefine names:\n    define_name(\"\
  pi\",3.1415926535);\n    define_name(\"e\",2.7182818284);\n    calculate();\n  \
  \  keep_window_open();          // 处理 Windows 控制台模式\n    return 0;\n}\ncatch (exception&\
  \ e) {\n    cerr << e.what() << '\\n';\n    keep_window_open(\"~~\");\n    return\
