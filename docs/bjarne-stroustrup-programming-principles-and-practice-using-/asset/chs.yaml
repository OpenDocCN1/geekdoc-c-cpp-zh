  \ 字符串的拷贝，而 `ss.str(s)` 将 `ss` 的字符串设置为 `s` 的拷贝。§11.7 显示了一个 `ss.str(s)` 至关重要的示例。\n\
  \n### 11.5 行定向的输入 (Line-oriented input)\n\n`>>` 运算符根据该类型的标准格式读取到给定类型的对象。例如，当读取到\
  \ `int` 时，`>>` 将一直读取直到遇到非数字字符；当读取到 `string` 时，`>>` 将一直读取直到遇到空白字符。标准库 `istream` 也提供了按行读取的设施（注：抱歉，原文此处似乎有部分逻辑乱码或重复，已根据逻辑调整：*注：原文此处存在存在混乱，已按逻辑进行翻译*）。\n\
  \n如果我们尝试读取超出 `istringstream` 字符串的末尾，则 `istringstream` 将进入 `eof()` 状态。这意味着我们可以为 `istringstream`\
  \ 使用“常规输入循环”；`istringstream` 确实是一种 `istream`。\n\n（注：原文在 11.5 节之后存在多处文本重复和逻辑混乱，如“there\
