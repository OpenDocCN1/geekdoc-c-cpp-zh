  \t\n```\n\n\n\n\n\n点击此处查看代码图像\n\n```cpp\ncout << \"Please enter an integer in the\
  \ range 1 to 10 (inclusive):\\n\";\n\nint n = 0;\n\nwhile (cin>>n) { // 读取\n   \
  \ if (1<=n && n<=10) break;   // 检查范围\n    cout << \"Sorry \"\n         << n <<\
  \ \" is not in the [1:10] range; please try again\\n\";\n}\n\n// ...在此处使用 n ...\n\
  ```\n\n这段代码看起来相当糟糕，但它“勉强能用”。如果你不喜欢使用 `break`（参见 §A.6 ），你可以将读取和范围检查结合起来：\n\n点击此处查看代码图像\n\
  \n```cpp\ncout << \"Please enter an integer in the range 1 to 10 (inclusive):\\\
  n\";\n\nint n = 0;\n\nwhile (cin>>n && !(1<=n && n<=10))     // 读取并检查范围\n    cout\
  \ << \"Sorry \"\n         << n << \" is not in the [1:10] range; please try again\\\
  n\";\n\n// ...在此处使用 n ...\n```\n\n![图像](img/00007.jpeg)\n\n然而，这仅仅是外观上的改变。为什么它只是“勉强能用”？如果用户仔细输入整数，它是有效的。但如果用户打字不好，按了\
  \ `t` 而不是 `6`（在大多数键盘上 `t` 就在 6 的下方），程序将退出循环而不改变 `n` 的值，导致 `n` 有一个超出范围的值。我们不会称之为高质量代码。顽顽者（或勤奋的测试人员）还可能从键盘发送“文件结束”（Windows\
  \ 机器上为 `Ctrl+Z`，Unix 机器上为 `Ctrl+D`）。同样，我们离开循环时 `n` 仍超出范围。换句话说，为了获得健壮的读取，我们必须处理三个问题：\n\
  \n1. 用户输入了超出范围的值\n2. 没有获取到值（文件结束）\n3. 用户输入了类型错误的内容（此处为不是整数）\n\n在这三种情况下，我们想要做什么？这通常是编写程序时的问题：我们到底想要什么？在这里，对于这三个错误中的每一种，我们有三种替代方案：\n\
  \n1. 在执行读取的代码中处理问题。\n2. 抛出异常让其他人处理该问题（可能会终止程序）。\n3. 忽略该问题。\n\n恰好，这些是处理错误状况时非常常用的替代方案。因此，这是我们对错误进行此类思考的良好示例。\n\
  \n![图像](img/00006.jpeg)\n\n人们很容易说第三种替代方案（忽略问题）总是不可接受的，但这种说法可能太傲慢了。如果我只是为自己写一个微不足道的程序，我可以随心所欲，包括忘记错误检查并可能导致糟糕的结果。然而，对于一个我在写完后可能想使用几个小时以上的的程序，留下此类错误可能是愚蠢的，而且如果我想把那个程序分享给任何人，我就不应该在代码的错误检查中留下这样的漏洞。请注意，我们在这里特意使用了第一人称单数；使用“我们”会产生误导。即使只有两个人参与，我们也认为替代方案\
  \ 3 是不可接受的。\n\n在替代方案 1 和 2 之间进行选择是真实的；也就是说，在给定的程序中，可能有充分的理由选择其中一种方法。首先我们注意到，在大多数程序中，没有本地且优雅的方法来处理坐在键盘前的用户没有输入：输入流关闭后，要求用户输入数字没有太大意义。我们可以重新打开\
  \ `cin`（使用 `cin.clear()`），但用户不太可能意外关闭该流（你如何会意外按下 `Ctrl+Z` 呢？）。如果程序想要一个整数并发现“文件结束”，尝试读取该整数的程序部分通常必须放弃，并希望程序的其他部分能够处理；也就是说，我们请求用户输入的代码必须抛出异常。这意味着，选择并不是在抛出异常和本地处理问题之间进行，而是选择我们应该在本地处理哪些问题（如果有的话）。\n\
  \n#### 10.7.1 将问题拆分为可管理的部分\n\n让我们尝试在本地处理超出范围的输入和类型错误的输入：\n\n点击此处查看代码图像\n\n```cpp\n\
  cout << \"Please enter an integer in the range 1 to 10 (inclusive):\\n\";\n\nint\
  \ n = 0;\nwhile (true) {\n    cin >> n;\n    if (cin) { // 获取了一个整数；现在检查它\n     \
  \   if (1<=n && n<=10) break;\n        cout << \"Sorry \"\n             << n <<\
  \ \" is not in the [1:10] range; please try again\\n\";\n    }\n    else if (cin.fail())\
  \ { // 发现某些东西不是整数\n        cin.clear(); // 将状态置回 good();\n        // 我们想查看这些字符\n\
  \        cout << \"Sorry, that was not a number; please try again\\n\";\n      \
  \  for (char ch; cin>>ch && !isdigit(ch); ) // 丢弃非数字\n            /* 无 */\n    \
  \    if (!cin) error(\"no input\"); // 未找到数字：放弃\n        cin.unget(); // 退回，以便我们可以读取数字\n\
  \    }\n    else {\n        error(\"no input\"); // 文件结束或错误：放弃\n    }\n}\n// 如果我们到达这里，n\
  \ 在 [1:10] 范围内\n```\n\n这种代码很混乱，而且冗长。事实上，它太杂乱了，我们建议人们每次需要从用户获取整数时都写这样的代码。另一方面，代码混乱的原因是多个不同的关注点混合在了一起：\n\
  \n![图像](img/00007.jpeg)\n\n* 读取值\n* 提示用户输入\n* 编写错误信息\n* 跳过“坏”输入\n* 测试输入是否范围\n\n\
  ![图像](img/0006.jpeg)\n\n使代码更清晰的方法是将逻辑关注点分离到单独的函数中。例如，我们可以分离“坏”字符（即意外字符）后恢复的代码：点击此处查看代码图像\n\
  \n```cpp\nvoid skip_to_int()\n{\n    if (cin.fail()) { // 发现某些东西不是整数\n        cin.clear();\
  \ // 我们想查看字符\n        for (char ch; cin>>ch; ) // 丢弃非数字\n            if (isdigit(ch)\
  \ || ch=\"\") {\n                cin.unget(); // 退回，以便我们可以读取数字\n               \
  \ return;\n            }\n        }\n    }\n    error(\"no input\"); // 文件结束或错误：放弃\n\
  }\n```\n\n给定 `skip_to_int()` “工具函数”，我们可以写出：\n\n点击此处查看代码图像\n\n```cpp\ncout << \"\
  Please enter an integer in the range 1 to 10 (inclusive):\\n\";\n\nint n = 0;\n\
  while (true) {\n    if (cin>>n) { // 获取了一个整数；现在检查它\n        if (1<=n && n<=10) break;\n\
  \        cout << \"Sorry \" << n << \" is not in the [1:10] range; please try again\\\
  n\";\n    }\n    else {\n        cout << \"Sorry, that was not a number; please\
  \ try again\\n\";\n        skip_to_int();\n    }\n}\n// 如果我们到达这里，n 在 [1:10] 范围内\n\
  ```\n\n这段代码好了一些，但它仍然太长、太杂乱，无法在程序中多次使用。在经过（过）测试之后，我们永远无法一致地写对它。\n\n我们真正想要什么样的操作？一个合理的答案是“一个读取整数的函数，一个读取任意整数的函数，以及另一个读取给定范围内整数的函数”：\n\
  \n\n\n\n\n```cpp\nint get_int();                               // 从 cin 读取一个 int\n\
  int get_int(int low, int high);              // 从 cin 读取一个在 [low:high] 范围内的 int\n\
  ```\n\n如果我们有了这些函数，我们至少可以简单且正确地使用它们。编写它们并不难：\n\n点击此处查看代码图像\n\n```cpp\nint get_int()\n\
  {\n    int n = 0;\n    while (true) {\n        if (cin >> n) return n;\n       \
  \ cout << \"Sorry, that was not a number; please try again\\n\";\n        skip_to_int();\n\
  \    }\n}\n```\n\n基本上，`get_int()` 会固执地持续读取，直到它找到某些可以解释为整数的数字。如果我们想退出 `get_int()`，我们必须提供一个整数或文件结束符（文件结束符会导致\
  \ `get_int()` 抛出一个异常）。\n\n使用那个通用的 `get_int()`，我们可以编写出带有范围检查的 `get_int()`：\n\n点击此处查看代码图像\n\
  \n```cpp\nint get_int(int low, int high)\n{\n    cout << \"Please enter an integer\
  \ in the range \"\n             << low << \" to \" << high << \" (inclusive):\\\
  n\";\n    while (true) {\n        int n = get_int();\n        if (low<=n && n<=high)\
  \ return n;\n        cout << \"Sorry \"\n                << n << \" is not in the\
  \ [\" << low << ':' << high\n             << \"] range; please try again\\n\";\n\
  \    }\n}\n```\n\n这个 `get_int()` 和另一个一样固执。它会不断从非范围的 `get_int()` 中获取整数，直到获取到的整数在预期的范围内为止。\n\
  \n现在我们可以可靠地这样读取整数：\n\n```cpp\nint n = get_int(1,10);\ncout << \"n: \" << n << '\\\
  n';\nint m = get_int(2,300);\ncout << \"m: \" << m << '\\n';\n```\n\n但是，如果你想为 `get_int()`\
  \ 真的无法读取数字的情况（可能罕见）提供良好的错误信息，不要忘记在某处捕获异常。\n\n### 10.7.2 将对话与函数分离\n\n`get_int()`\
  \ 函数仍然将读取操作与向用户写入消息混合在了一起。这对于简单程序可能足够了，但在大型程序中，我们可能想要更改写入给用户的消息。我们可能想这样调用 `get_int()`：\n\
  \n点击此处查看代码图像\n\n```cpp\nint strength = get_int(1,10, \"enter strength\", \"Not in\
  \ range, try again\");\ncout << \"strength: \" << strength << '\\n';\nint altitude\
  \ = get_int(0,5000, \"Please enter altitude in feet\", \"Not in range, try again\"\
  );\ncout << \"altitude: \" << altitude << \"f above sea level\";\n```\n\n我们可以这样实现它：\n\
  \n点击此处查看代码图像\n\n```cpp\nint get_int(int low, int high, const string& greeting, const\
  \ string& sorry)\n{\n    cout << greeting << \": [\" << low << ':' << high << \"\
  ]\\n\";\n    while (true) {\n        int n = get_int();\n        if (low<=n && n<=high)\
  \ return n;\n        cout << sorry << \": [\" << low << ':' << high << \"]\\n\"\
  ;\n    }\n}\n```\n\n组合任意消息是很困难的，因此我们对消息进行了“样式化”。这通常是可以接受的，而组合出支持许多自然语言（例如阿拉伯语、孟加拉语、丹麦语、英语和法语）所需的、真正灵活的消息，并不是初学者的任务。\n\
  \n注意，我们的解决方案仍然不完整：没有范围的 `get_int()` 仍然在“喋喋”。这里更深层次的观点是，我们在程序许多部分使用的“实用程序函数”不应该将消息“硬编码”在它们内部。此外，用于许多程序的库函数不应该向用户写入内容——毕竟，库的编写者可能不知道运行该库的程序的机器上是否有人类在观察。这就是我们的\
  \ `error()` 函数不仅仅是写入错误消息的原因之一；通常情况下，我们不知道该写在哪里。\n\n### 10.8 用户定义的输出运算符\n\n为给定类型定义输出运算符\
  \ `<<` 通常是轻而易举的。主要的设计问题是不同的人可能偏好不同的输出样式，因此很难达成统一的格式。然而，即使没有一个单一的输出格式适用于所有用途，为用户定义的类型定义\
  \ `<<` 通常也是一个好主意。这样，我们至少可以在调试和早期开发期间简单地写出该类型的对象。稍后，我们可能会提供一个更复杂的 `<<`，允许用户提供格式化信息。此外，如果我们希望输出看起来与\
  \ `<<` 提供的不同，我们可以简单地跳过 `<<`，按照我们在应用程序中喜欢的方式输出用户定义类型的各个部分。\n\n这里有一个来自 9.8 的 `Date`\
  \ 简单输出运算符，它以括号分隔并在](part0015.html_ch09sec6）打印年、月、日：\n\n点击此处查看代码图像\n\n```cpp\nostream&\
  \ operator<<(ostream& os, const Date& d)\n{\n    return os << '(' << d.year() <<\
  \ ',' << d.day() << ')';\n}\n```\n\n这会将 August 8 月 30 日输出为 (2004,8,30)。除非我们有更好的想法或特定的需求，否则我们倾向于使用这种元素列表表示。\n\
  \n![Image](img/00005.jpeg)\n\n在 9.6，我们提到用户定义的运算符是通过调用其函数来处理的。在这里可以看到如何实现。给定 `Date`\
  \ 的 `<<` 定义，\n\n```cpp\ncout << d1;\n```\n\n其中 `d1` 是一个 `Date`这意味着调用\n\n```cpp\n\
  operator<<(cout,d1);\n```\n\n注意 `operator<<()` 如何获取 `ostream&` 作为第一个参数并将其作为值返回。这样流就可以传递，你可以“链式”操作。例如，我们可以输出两个日期：\n\
  \n```cpp\ncout << d1 << d2;\n```\n\n这将通过解析第一个 `<<` 然后是第二个来处理：\n\n点击此处查看代码图像\n\n\
  ```cpp\ncout << d1 << d2;\n```\n\n意味着 `operator<<(operator<<(cout,d1),d2)`。也就是说，先将\
  \ `d1` 输出到 `cout`，然后是 `d2`。\n\n### 10.9 用户定义的输入运算符\n\n为给定类型和格式定义输入运算符 `>>` 基本上是错误处理的练习。因此它可能是棘手的。这里有一个来自\
  \ 9.8 的 `Date` 简单输入运算符，它可以读取由上面的 `<<` 运算符写入日期：\n\n点击此处查看代码图像\n\n```cpp\nistream&\
  \ operator>>(istream& is, Date& dd)\n{\n    int y, m, d;\n    char ch1, ch2, ch3,\
  \ ch4;\n    is >> ch1 >> y >> ch2 >> m >> ch3 >> d >> ch4;\n    if (!is) return\
  \ is;\n    if (ch1!='(' || ch2!=',' || ch3!=',' || ch4!=')') { // 哎：格式错误\n     \
  \   is.clear(ios_base::failbit);\n        return is;\n    }\n    dd = Date{y,Date::Month(m),d};\
  \ // 更新 dd\n    return is;\n}\n```\n\n这个 `>>` 将读取像 (2004,8,20) 这样的项，并尝试根据这三个整数创建一个\
  \ Date。如既往一样，输入比输出更难处理。输入出现问题的情况往往比输出多。\n\n\n\n如果这个 `>>` 没有在 `( *integer*, *integer*,\
  \ *integer* )` 格式中找到任何内容，它将使流处于一个不佳的状态（fail, eof, 或 bad），并保持目标 `Date` 不变。`clear()`\
  \ 成员函数被用于设置 `istream` 的状态。显然，`ios_base::failbit` 会将流设置为 `fail()` 状态。在读取失败时保持目标 `Date`\
  \ 不变是理想的；这往往倾向于产生更整洁的代码。理想的情况是 `operator>>()` 不消耗（丢弃）任何它未使用的字符，但在这种情况下这太难了：在捕获到格式错误之前，我们可能已经读取了大量字符。例如，考虑\
  \ `(2004, 8, 30}`。只有当我们看到最后的 `}` 时，我们才知道自己遇到了格式错误，而且通常我们无法依赖于回退许多字符。`unget()` 回退一个字符是唯一在普遍范围内得到保证的。如果这个\
  \ `operator>>()` 读取了一个无效的 `Date`，例如 `(2004,8,32)`，`Date` 的构造函数将抛出异常，这将带我们离开这个 `operator>>()`。\n\
