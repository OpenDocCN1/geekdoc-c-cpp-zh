  \ 的定义在 §B.6.3。\n\n### B.5.5 集合算法\n\n这些算法将序列视为集合。\n\n![图像](img/00385.jpeg)\n\n###\
  \ B.5.6 堆\n\n堆是一个保持最高值元素的数据结构。\n\n![图像](img/00386.jpeg)\n\n### B.5.7 遍历排列\n\n排列用于生成序列的组合。例如，`abc`\
  \ 的排列是排列。\n\n### B.5.8 最小与最大\n\n值比较在许多上下文中非常有用。\n\n![图像](img/00388.jpeg)\n\n## B.6\
  \ STL 工具\n\n标准库提供了一些设施，以便于使用标准算法。\n\n### B.6.1 插入器\n\n通过迭代器向容器产生输出意味着迭代器指向的元素可能会被覆盖。这还意味着溢出以及随后的内存损坏的可能性。例如：点击此处查看代码图像\n\
  \n```cpp\nvoid f(vector<int>& vi)\n{\n    fill_n(vi.begin(), 200,7 );    //为 vi[0]..[199]\
  \ 赋值 7\n}\n```\n\n如果 vi 少于 200 个元素，我们就有麻烦了。\n\n在 `<iterator>` 中，标准库提供了三种迭代器，通过添加（插入）元素而不是覆盖旧元素来解决这个问题。提供了三个函数来生成那些插入迭代器：\n\
  \n![图像](img/00389.jpeg)\n\n对于 `inserter(c,p)`，p 必须是容器 c 的有效迭代器。自然，每当通过插入迭代器写入一个值时，容器就会增长一个元素。当写入时，插入器会使用\
  \ `push_back(x)`、`c.push_front()` 或 `insert()` 向序列中插入新元素，而不是覆盖现有元素。例如：点击此处查看代码图像\n\
  \n```cpp\nvoid g(vector<int>& vi)\n{\n```\n\n\n\n\n\n```cpp\nfill_n(back_inserter(vi),\
  \ 200, 7); // add 200 7s to the end of vi\n}\n```\n\n### B.6.2 函数对象 (Function objects)\n\
  \n许多标准算法接受函数对象（或函数）作为参数来控制它们的工作方式。常见的用途包括比较标准、谓词（返回 `bool` 的函数）以及算术操作。在 `<functional>`\
  \ 中，标准库提供了几个常用的函数对象。\n\n![Image](img/00390.jpeg)\n\n例如：\n\n点击此处代码图片\n\n```cpp\n\
  vector<int> v;\n// . . .\nsort(v.begin(), v.end(), greater<int>{}); // 降序排序 v\n\
  ```\n\n注意 `logical_and` 和 `logical_or` 总是会求值它们的两个参数（而 `&&` 和 `||` 则不会）。\n\n此外，lambda\
  \ 表达式 (§15.3.3) 经常是简单函数对象的替代方案：\n\n点击此处代码图片\n\n```cpp\nsort(v.begin(), v.end(),\
  \ [](int x, int y) { return x > y; }); // 降序排序 v\n```\n\n![Image](img/00391.jpeg)![Image](img/00392.jpeg)\n\
  \n注意 `function` 是一个模板，因此你可以定义类型为 `function<T>` 的变量并将可调用对象赋值给这些变量。例如：\n\n点击此处代码图片\n\
  \n```cpp\nint f1(double);\nfunction<int(double)> fct {f1}; // 初始化为 f1\nint x = fct(2.3);\
  \ // 调用 f1(2.3)\nfunction<int(double)> fun; // fun 可以持有任何 int(double)\nfun = f1;\n\
  ```\n\n### B.6.3 pair 和 tuple\n\n在 `<utility>` 中，标准库提供了几个“工具组件”，包括 `pair`：\n\n点击此处代码图片\n\
  \n```cpp\ntemplate <class T1, class T2>\nstruct pair {\n    typedef T1 first_type;\n\
  \    typedef T2 second_type;\n    T1 first;\n    T2 second;\n    // . . .拷贝和移动操作\
  \ . . .\n};\n\ntemplate <class T1, class T2>\nconstexpr pair<T1,T2> make_pair(T1\
  \ x, T2 y) { return pair<T1,T2>{x,y}; }\n```\n\n`make_pair()` 函数使得 `pair`的使用变得简单。例如，这里有一个返回值和错误指示的函数大纲：\n\
  \n点击此处代码图片\n\n```cpp\npair<double,error_indicator> my_fct(double d) {\n    errno\
  \ = 0; // 清空 C 风格的全局错误指示\n    // . . . 执行涉及 d 计算 x 的大量计算 . . .\n    error_indicator\
  \ ee = errno;\n    errno = 0; // 清空 C 风格的全局错误指示\n    return make_pair(x, ee);\n\
  }\n```\n\n这个实用惯用示例可以这样使用：\n\n点击此处代码图片\n\n```cpp\npair<int,error_indicator> res =\
  \ my_fct(23.456);\nif (res.second == 0) {\n    // . . . res.first . . .\n} else\
  \ {\n    // 哎呀\n}\n```\n\n当我们需要两个元素且不在意定义特定类型时，我们使用 `pair`。如果我们需要零或多个元素，可以使用 `tuple`：\n\
  \n点击此处代码图片\n\n```cpp\ntemplate <typename... Types>\nstruct tuple {\n    explicit\
  \ tuple(const Types&); // 从 N 个值构造\n    template<typename... A>\n    explicit tuple(const\
  \ A&&); // 从 N 个值构造\n    // . . . 拷贝和移动操作 . . .\n};\n\ntemplate <class... Types>\n\
  constexpr tuple<Types...> make_tuple(Types&&...); // 来自 N 个值\n```\n\n`tuple` 的实现使用了超出本书范围的特性：变长模板。这就是那些省略号（`.\
  \ .`）所指的内容。然而，我们可以像使用 `pair` 一样使用 `tuple`。例如：\n\n点击此处代码图片\n\n```cpp\nauto t0 = make_tuple();\
  \ // 无元素\nauto t1 = make_tuple(123.456); // 一个 double 类型元素\nauto t2 = make_tuple(123.456,\
  \ 'a'); // double 和 char 类型的两个元素\nauto t3 = make_tuple(12,'a',string{\"?\"}); //\
  \ int, char 和 string 类型的三个元素\n```\n\n`tuple` 可以有很多元素，因此我们不能仅用 `first` 和 `second`\
  \ 来访问它们。相反，可以使用函数 `get`：\n\n点击此处代码图片\n\n```cpp\nauto d = get<0>(t1); // 该 double\n\
  auto n = get<0>(t3); // 该 int\nauto c = get<1>(t3); // 该 char\nauto s = get<2>(t3);\
  \ // 该 string\n```\n\n`get` 使用下标下标。\n\n### B.6.4 initializer_list\n\n`initializer_list`\
  \ 提供提供相同类型值序列的方法。\n\n点击此处代码图片\n\n```cpp\ntemplate<class T>\nclass initializer_list\
  \ {\npublic:\n    initializer_list(const T* p, size_t n);\n    const T* begin()\
  \ const;\n    const T* end() const;\n    size_t size() const;\n};\n```\n\n`initializer_list`\
  \ 用于允许构造函数接收列表列表：\n\n```cpp\nvector<int> v = {1, 2, 3, 4, 5};\n```\n\n### B.6.5\
  \ 资源管理\n\n指针并不指示它是否拥有所指向的对象。资源管理指针 `unique_ptr` 和 `shared_ptr` 定义在 `<memory>` 中：\n\
  \n- `unique_ptr` 表示独占所有权；只有一个 `unique_ptr` 指向对象，并且当 `unique_ptr` 析毁时对象被删除。\n- `shared_ptr`\
  \ 表示共享所有权；可以有 `shared_ptr` 指向对象，并且当最后一个 `shared_ptr` 析毁时对象被删除。\n\n还有 `weak_ptr`\
  \ 用于打破 `shared_ptr` 循环。\n\n```cpp\nunique_ptr<int> p1(new int(10));\nshared_ptr<int>\
  \ s1(new int(20));\nshared_ptr<int> s2 = s1;\n```\n\n\n\n\n\n对于文件流，文件名是一个 C 风格的字符串。\n\
  \n你可以用以下几种模式之一打开文件：\n\n![Image](img/00400.jpeg)\n\n在每种情况下，打开文件的具体效果可能取决于操作系统。如果操作系统无法满足以特定方式打开文件的请求，结果将是一个不处于\
  \ `good()` 状态的流。\n\n示例代码：\n\n```cpp\nvoid my_code(ostream& os);               //\
  \ 我的代码可以使用任何 ostream\nostringstream os;                       // o 代表“output”（输出）\n\
  ofstream of(\"my_file\");\nif (!of) error(\"couldn't open 'my_file' for writing\"\
  );\nmy_code(os);                            // 使用字符串\nmy_code(of);             \
  \               // 使用文件\n```\n\n参阅 §11.3。\n\n## B.7.2 错误处理\n\n`iostream` 可以处于四种状态之一：\n\
  \n![Image](img/00401.jpeg)\n\n通过使用 `s.exceptions()`，程序员可以要求 `iostream` 在其从 `good()`\
  \ 变为其他状态时抛出异常（见 §10.6）。\n\n在不处于 `good()` 状态的流上尝试任何操作都没有效果；它是一个“无操作（no op）”。\n\n\
  `iostream` 可以用条件。在这种情况下，如果 `iostream` 的状态为 `good()`，则条件为真（成功）。这是读取值流的常用惯用法的基础：\n\
  \n```cpp\nfor (X buf; cin>>buf; ) {  // buf 是用于存储一个类型 X 值的“输入缓冲区”\n    // . . .\
  \ 对 buf 执行某些操作 . . .\n}\n 当 >> 无法从 cin 读取另一个 X 时，我们到达这里\n```\n\n## B.7.3 输入操作\n\n\
  输入操作位于 `<istream>` 中，但读取到字符串的操作除外；那些操作位于 `<string>` 中：\n\n![Image](img/00402.jpeg)\n\
  \n除非另有说明，`istream` 操作返回其自身 `istream` 的引用，以便我们可以“链式”操作，例如 `cin>>x>>y`。\n\n![Image](img/00403.jpeg)\n\
  \n`get()` 和 `getline()` 函数会在写入到 `p[0]` 的字符（如果有）末尾放置一个 0 . . .；`getline()` 如果从输入中移除终止符\
  \ `(t)`，而 `get()` 则不会。`read(p,n)` 不会在读取的字符后向数组写入 0。显然，格式化输入操作符比非格式化操作符更容易使用且不易出错。\n\
  \n## B.7.4 输出操作\n\n输出操作位于 `<ostream>` 中，但输出字符串的操作除外；那些操作位于 `<string>` 中：\n\n![Image](img/00404.jpeg)\n\
  \n除非另有说明，`ostream` 操作返回其自身 `ostream` 的引用，以便我们可以“链式”操作，例如 `cout << x<<y`。\n\n## B.7.5\
  \ 格式\n\n流 I/O 的格式由对象类型、流状态、区域设置信息（见 `<locale>`）和显式操作共同控制。第 10 章 和 第 11 章 解释了其中的大部分内容。在这里，我们只列出标准操纵符（修改流状态的操作），因为它们提供了修改格式的最直接的方法。\n\
  \n区域设置（Locales）超出本书的范围。\n\n## B.7.6 标准操纵符\n\n标准库提供了对应各种格式状态和状态变化的操纵符。标准操纵符定义在 `<ios>`,\
  \ `<istream>`, `<ostream>`, `<iostream>` 和 `<iomanip>`（带参数的操纵符）中：\n\n![Image](img/00405.jpeg)![Image](img/00406.jpeg)\n\
  \n这些操作中的每一个都返回其第一个（流）操作数 `s` 的引用。例如：\n\n```cpp\ncout << hex << ',' << oct << endl;\
  \ // 输出 hex,d,oct\ncout << setw(4) << fill('#') << 2 << \"\\n\"; // 输出 ##2\n```\n\
  显式设置浮点数的通用输出格式使用 `b.setf(ios_base::float, ios_base::field)`。见第 1 章。\n\n## B.8 字符串处理\n\
  \n标准库在 `<cctype>` 中提供了字符分类操作，在 `<string>` 中提供了关联操作字符串，在 `<regex>` 中提供了正则表达式匹配，并在\
  \ `<cstring>` 中提供了对 C 风格字符串的支持。\n\n### B.8.1 字符分类\n\n基础字符集中的字符可以这样分类：\n\n![Image](img/00407.jpeg)\n\
  \n此外，标准库提供了两个实用的函数来消除大小差异：\n\n![Image](img/00408.jpeg)\n\n支持扩展字符集（如 Unicode），但它们超本书的范围。\n\
  \n### B.8.2 字符串\n\n标准库类 `string` 是通用模板 `basic_string` 字符类型 `char` 的特化；也就是说，`string`\
  \ 是字符序列：\n\n![Image](img/00409.jpeg)![Image](img/00410.jpeg)\n\n### B.8.3 正则表达式匹配\n\
  \n正则表达式设施位于 `<regex>`。主要函数有：\n\n*   在字符串中搜索匹配正则表达式的 `regex_search()`\n*   与字符串匹配正则表达式的\
  \ `regex_match()`\n*   替换匹配项的 `regex_replace()`；未在书中描述\n\n`regex_search()` 或 `regex_match()`\
  \ 的结果是一个匹配项集合，通常表示为 `smatch`：\n\n```cpp\nregex row(\"\\\\w ]+(\\\\d+))(\\\\d+)$\
  \ // 数据\nwhile (getline(in,line)) { // 检查行\n    smatch matches;\n    if (regex_match(line,\
  \ matches, row)) {\n        // 检查行：\n        int field1 = matches[1];\n        int\
  \ field2 = matches[2];\n        int field3 = matches[3];\n    }```\n\n正则表达式的语法基于具有特殊含义的字符（第\
  \ 23 章）：\n\n![Image](img/00412.jpeg)![Image](img/00413.jpeg)![Image](img/00414.jpeg)\n\
  \n几种字符类支持缩写表示：\n\n![Image](img/00415.jpeg)\n\n## B.9 数字\n\nC++ 标准库为数学（科学、工程等）计算提供了最基本的构建模块。\n\
  \n### B.9.1 数值限制\n\n每个 C++ 实现都指定了内置类型的属性，以便程序员可以使用这些属性检查限制、设置哨兵值等。\n\n从 `<limits>`\
  \ 我们可以得到每个内置或库类型 `T` 的 `numeric_limits<T>`。此外，程序员可以为自定义数值类型 `X` 定义 `numeric_limits<X>`。例如：\n\
  \n```cpp\nclass numeric_limits<float> {\npublic:\n    static const bool is_specialized\
  \ = true;\n    static constexpr int radix = 2; // 指数基（在此情况下是二进制）\n    static constexpr\
  \ int digits = 24; // 尾数中的基位数\n    static constexpr int digits10 = 6; // 尾数中的十进制位数\n\
  \    static constexpr bool is_signed = true;\n    static constexpr bool is_integer\
  \ = false;\n    static constexpr bool is_exact = false;\n    static constexpr float\
  \ min() { return 1.17549435E–38F; } // 示例值\n    static constexpr float max() { return\
  \ 3.40282347E+38F; } // 示例值\n    static constexpr float lowest() { return -3.40282347E+38F;\
  \ } // 示例值\n    static constexpr float epsilon() { return 1.19209290E–07F; } //\
  \ 示例值\n};\n```\n\n\n\n\n`static constexpr float round_error() { return 0.5F; }`\
  \ // 值\n\n`static constexpr float infinity() { return /* some value */; }`\n\n`static\
  \ constexpr float quiet_NaN() { return /* some value */; }`\n\n`static constexpr\
  \ float signaling_NaN() { return /* some value */; }`\n\n`static constexpr float\
  \ denorm_min() { return min(); }`\n\n```cpp\n```\n\n从 `<limits.h>` 和 `<float.h>`，我们可以得到指定整数和浮点数关键属性的宏，包括：\n\
  \n![Image](img/00416.jpeg)\n\n### B.9.2 标准数学函数\n\n标准库提供了最常用的数学函数（定义在 `<cmath>` 和\
  \ `<complex>`）：\n\n![Image](img/00417.jpeg)\n\n存在接受 `float`、`double`、`long double`\
  \ 以及复数参数的版本。对于每个函数其返回类型与参数类型相同。\n\n如果某个标准数学函数无法产生一个有效的数学结果，它会设置变量 `errno`。\n\n###\
  \ B.9.3 复数 (Complex numbers)\n\n标准库提供了复数类型：它支持针对三种基础浮点类型的特化（`complex<float>`、`complex<double>`\
  \ 和 `complex<long double>`）。通常情况下可以通过这两个大括号语法：同时也存在一个通用的模板：`template<class Scalar>\n\
  class complex {\npublic:\n// ...\n};` \n但注意并非所有算数运算都支持非标量泛型的使用；这里提到它通常有效但不能保证可移植。点击此处查看代码以下是一个简化部分成员的示例：\n\
  ```\nconstexpression::possible ? cons·exactor(){}\n我们会移除这行。\n```\n\n此外除了重要的说明我们还进一步.\n\
