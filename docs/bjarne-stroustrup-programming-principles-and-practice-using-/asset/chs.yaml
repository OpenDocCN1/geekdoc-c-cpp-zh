  \ Notices》，第 28 卷第 3 期，1993 年。\n\n## Simula\n\nSimula 于 20 世纪 60 年代初至中期由挪威计算中心和奥斯陆大学的\
  \ Kristen Nygaard 与 Ole-Johan Dahl 开发。Simula 无疑是 Algol 家族的一员。事实上，Simula 几乎完全是 `Algol60`的超集。然而我们选择特别关注\
  \ Simular 是因为它是如今被称为“面向对象编程”的大多数基本思想的来源。它是最早提供继承和虚函数的语言。“class”（类）一词用于表示“用户定义类型”，而\
  \ _virtual_ （虚拟）一词则指代那些可被覆盖并通过基类接口调用的函数；这些术语都源自 SIMULA。\n\n![Image](img/00005.jpeg)\n\
  \nSIMUlA 的贡献不仅限于语言特性本身它还附带了一套基于代码对现实世界现象进行建模的明确的面向对象设计概念：\n\n•   将想法表示为类和类的对象。\n\
  •   将层次关系表示为类的层次结构（继承）。因此程序成为一组相互交互的对象而不是一个整体块！\n\n！[图像]！（Images\\\\00251,xjpeg）\n\
