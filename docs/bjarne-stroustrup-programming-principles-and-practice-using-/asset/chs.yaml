  \n输入和输出之所以是混乱的，是因为我们人类的审美和习惯没有遵循简单的表述规则和直观的数学规律。作为程序员，我们很少有能力要求用户违背自己的偏好；而当我们有这种能力时，通常不应该表现得傲慢，认为我们可以为长期以来形成的惯例提供一个简单的替代方案。因此，我们必须预期、接受并适应输入输出的某种混乱，同时仍努力让我们的程序尽可能简单——但不能更简单。\n\
