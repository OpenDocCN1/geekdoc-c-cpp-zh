  \n\n\n\n\n`accumulate()`的基本三参数版本执行加法操作。然而，我们可能希望对序列执行许多其他有用的运算，例如乘法和减法，因此 STL 提供了第二个四参数版本的`accumulate()`，可以在其中指定要使用的运算：\n\
  \n```\ntemplate<typename In, typename T, typename BinOp>\n          // requires\
  \ Input_iterator<In>() && Number<T>()\n          //        && Binary_operator<BinOp,Value_type<In>,T>()\n\
  T accumulate(In first, In last, T init, BinOp op)\n{\n          while (first!=last)\
  \ {\n                    init = op(init,*first);\n                    ++first;\n\
  \          }\n          return init;\n}\n```\n\n任何接受累加器类型两个参数的二元运算都可以在这里使用。例如：\n\
