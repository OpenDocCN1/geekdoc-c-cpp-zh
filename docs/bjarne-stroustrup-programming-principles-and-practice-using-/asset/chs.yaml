  \ negative\\n\";\n    }\n    else if (x>0) {\n        if (y<0)\n            cout\
  \ << \"very positive\\n\";\n        else\n            cout << \"somewhat positive\\\
  n\";\n    }\n}\n```\n\n这里最明显的错误是我们“忘记”了 `x` 为 `0` 的情况。在针对零进行测试（或针对正负值测试）时，零经常被忘记或归类到错误的分类中（例如被视为负数）。此外，这里隐藏着一个更微妙（但并不罕见）的错误：`(x>0\
  \ && y<0)` 和 `(x>0 && y>=0)` 的操作“由于某种方式”被反过了。这在复制粘贴编辑时经常发生。\n\n`if` 语句的使用越复杂，发生此类错误的概率越高。从测试者的角度来看，我们查看此类代码并试图确保每个分支都经过测试。对于\
  \ `do_branch1()`，显然的测试集是：\n\n```cpp\ndo_branch1(–1,–1);\ndo_branch1(–1, 1);\ndo_branch1(1,–1);\n\
  do_branch1(1,1);\ndo_branch1(–1,0);\ndo_branch1(0,–1);\ndo_branch1(1,0);\ndo_branch1(0,1);\n\
  do_branch1(0,0);\n```\n\n基本上，在我们注意到 `do_branch1()` 使用 `<` 和 `>` 对 `0` 进行测试后，这是一种穷举的“尝试所有替代方案”的方法。为了捕获\
  \ `x` 为正值的错误操作，我们必须将调用与其预期的输出结合。\n\n处理 `switch` 语句与处理 `if` 语句本质上是相似的。\n\n点击此处查看代码图像\n\
  \n```cpp\nvoid do_branch1(int x, int y)   // 混乱的函数\n        // 不规范的 switch 使用\n\
  {\n    if (y<0 && y<=3) {\n        switch (x) {\n            case 1:\n         \
  \       cout << \"one\\n\";\n                break;\n            case 2:\n     \
  \           cout << \"two\\n\";\n                break;\n            case 3:\n \
  \               cout << \"three\\n\";\n                break;\n        }\n    }\n\
  }\n```\n\n在这里我们犯了四个经典错误：\n- 我们检查了错误的变量（是 `y` 而不是 `x`）。\n- 我们忘记了 `break` 语句，导致 `x==2`\
  \ 时执行了错误的操作。\n- 我们忘记了 `default` 情况（心以为我们已经通过 `if` 语句处理了它）。\n- 我们写了 `y<0`，但本意是写 `0<y`。\n\
  \n![Image](img/00006.jpeg)\n\n作为测试者，我们总是寻找未被处理的情况。请注意，“仅仅修复问题”是不够的。当我们不留意时，问题可能会再次出现。作为测试者，我们想要编写能够系统性地捕获错误的测试。如果我们仅仅修复了这段简单的代码，我们很可能修复错误，导致它既没有解决问题，又引入了新的、不同的错误。查看代码的目的并不是真的为了发现错误（虽然这总是很有用的），而是为了设计一组合适的测试，以捕获所有错误（或者更现实地说，捕获许多错误）。\n\
  \n![Image](img/00005.jpeg)\n\n注意，循环有一个隐式的 `if`：它们测试我们是否到达了结尾。因此，循环也是分支语句。当我们查看包含分支的程序时，第一个问题总是：“我们是否覆盖（测试）了每一个分支？”\
  \ 令人惊讶的是，这在实际代码中并不总是可能的（因为在实际代码中，函数是由其他函数调用的，并不以所有可能的方式）。因此，测试者的一个常见问题是：“你的代码覆盖率是多少？”答案最好是：“我们测试了大多数分支”，然后解释为什么剩余的分支难以到达。100%\
  \ 的覆盖是理想状态。\n\n### 26.3.4 系统测试\n\n测试任何大型系统都是一项技术性工作。例如，控制电话系统的计算机的测试是在专门建造的房间内进行的，房间里装满了计算机，模拟着数万人的流量。此类系统耗资数百万美元，是资深工程师的工作。由于任何原因（包括电源故障、洪水和地震），主交换机被要求连续工作\
  \ 20 年，最多停机 20 分钟。我们不会在这里详细介绍——这就像教物理系学生计算火星探测器的轨道修正一样——但我们将提供一些对小型项目有用的想法。\n\n\
  ![Image](img/00006.jpeg)\n\n首先，请记住，测试的目的是发现错误，特别是潜在的频繁和严重的错误，而不仅仅是编写和运行尽可能多的测试。这意味着对被测试系统的某种理解是至关重要的。有效的系统测试比单元测试更依赖于应用知识（领域知识）。开发系统不仅需要编程语言问题和计算机知识，还需要理解领域以及使用这些系统的人。这对我们工作很有动力：我们可以看到有趣的应用程序和有趣的人。\n\
  \n![Image](img/00006.jpeg)\n\n为了对整个系统进行测试，它必须由其所有部分（单元）组成。这可能需要大量时间，因此许多系统测试每天运行一次（通常在开发者睡觉时），在完成单元测试后进行。回归测试是这里的关键组成部分。最可能发现错误的区域是新代码以及之前发现过错误的区域。因此，运行旧测试集（回归测试）是关重要的；没有这些测试，大型系统永远不会稳定。我们引入新\
  \ bug 的速度和移除旧 bug 的一样。\n\n![Image](img/00007.jpeg)\n\n注意，我们认为在修复几个错误时会无意中引入几个新错误。我们希望新\
  \ bug 的数量少于我们移除的旧 bug，并且新错误的后果不那么严重。然而，至少在我们重新运行回归测试并为新代码添加新测试之前，我们必须假设系统是损坏的（被我们的修复损坏了）。\n\
  \n### 26.3.5 寻找不成立的假设\n\n`binary_search` 的规范指出序列必须是排序的。这剥夺了我们许多进行巧妙单元测试的机会。但显然，编写糟糕代码的机会还有，我们还没有设计测试来检测（除了系统测试之外）。我们能否利用对系统“单元”（函数、类等）的理解来设计更好的测试？\n\
  \n\n\n\n\n遗憾的是，最简单的答案是“不能”。作为纯粹的测试人员，我们无法更改代码。但要检测接口需求（前置条件）是否被违反，必须在每次调用之前进行检查，或者将检查作为每个调用的实现的一部分（参见§\
  \ 5.5）。不过如果我们在测试自己的代码时是可以插入这类检查的。如果我们只是普通测试人员而编写代码的人员愿意听取我们的建议——这并不总是成立——我们可以告知他们这些未受检的需求并确保它们得到检验。\n\
