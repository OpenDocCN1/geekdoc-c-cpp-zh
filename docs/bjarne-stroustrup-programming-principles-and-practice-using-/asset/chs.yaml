  \n### 随机序列\n\n![图片](img/00005.jpeg)\n\n我们在选择用于测试的值时，试图智胜实现者（通常就是我们自己），并使用那些聚焦于错误隐藏区域的值（例如，复杂条件序列、序列末尾、循环）。然而，这在尝试编写或调试代码时也同样会发生；因此设计中的逻辑缺陷可能传播到测试设计中，导致遗漏问题——这也是让不同人员参与有助于通过诸如`randint()`来自§24./`std_lib_facilities.h`的随机值生成技术来缓解此类问题的另一个原因。\n\
  \n例如：\n\n```\nvoid make_test(const string& lab , int n , int base ,\n          \
  \     // 写入标记为'lab '的描述\n                 generate seq starting @base uniformly\
  \ distributed distances\n                  average between elements spread within\
  \ [0 :spread))\n{\n    cout << \"{\"<< lab<<\" \"<<n<<\"\\n\";\n   vector<int> v;\n\
  \     elem = base ;\n         i=0 ; while(++i){elem+= randint(spread);v.push_back(elem)}\n\
  \      val <- Base+Randint ((element -Base));found=False?VPrintCheckFoundElse...\n\
  }\n```\n\n注意虽然二进制搜索能验证正确性的随机化方法在此类错误检测中并不合适,但手工制作的几组试验已足够如下所示:\n\n```\nno_of_tests=RAN(Integer);\n\
  for tst cntr range loop do{stringLabel=”rand_”;call MakeTest(...)}`\n```\n\n随机的数据集尤其有助于累积交互检查,其中状态依赖于先前的响应(参见第\
