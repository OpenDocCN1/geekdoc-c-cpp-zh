  \n***\n\n## **23\\.6 REGEX 的相关理念**:模式匹配基础:\n\n核心目的 →定义能在文本中进行搜索的模式.\n\n示例 :美邮 ：\
  \ TX77845 格式：\n\n初步猜测: wwddddd (但不明确)→之后通过加反斜杠前缀改善:\\w\\wd\\d……太长了 。于是可通过花括号{}形式指示计数如下\
  \ :\n\n```\n\\w{2}\\d{5}-\\d{4}\n```\n\n可选的部分？利用圆括号()配合后缀‘?’ ，例如，\n\n\\[主\\]的可选四位数字带短线组\
  \ →\n\n结合空格的处理有相关用法 (`？`,0 或多次重复由 *表示)\n\n因此最终的表达是在限定场景下进行了阐释 。\n\n###原始字符串字面量 –规避转义的反引号版本\
  \   \n无需多重转义即可自然书写引用起始/结束标记所用到的圆括号 ^_^。\n\n```c++\nR\"(模式字符串)\"\n// ex 以上示列。\n```\n\
  \n---------\n# §用 RegExp 库进行搜素 \n按行查找文件内符合条件的内容；显示找到的行号和对应数值打印样本来自 ……以下为仅含少量包含语句等函数的样例程序因长度限制有所删减\
  \ :: ——下方展示片段——\n\n```cpp\n#include regex &lt;iostream&gt; string fstream … main\
  \ () { }\n//点击查看完整源码后省略....\n```\n\n\n\n\n```cpp\nifstream in {\"file.txt\"}; //\
  \ 输入文件\nif (!in) cerr << \"no file\\n\";\nregex pat {R\"(\\w{2}\\s*\\d{5}(–\\d{4})?)\"\
  }; // 邮编码模式\nint lineno = 0;\nfor (string line; getline(in,line); ) { // 将输入行读入缓冲区\n\
  \    ++lineno;\n    smatch matches; // 匹配到的字符串存储在这里\n    if (regex_search(line,\
  \ matches, pat))\n        cout << lineno << \": \" << matches[0] << '\\n';\n}\n\
  ```\n\n这需要一些详细的解释。我们在 `<regex>` 头文件中找到了标准库中的正则表达式。基于此，我们可以定义一个模式 `pat`：\n\n点击此处查看代码图片\n\
  \n```cpp\nregex pat {R\"(\\w{2}\\s*\\d{5}(–\\d{4})?)\"}; // 邮编码模式\n```\n\n![Image](img/00005.jpeg)\n\
  \n正则表达式模式是一种字符串，因此我们可以用字符串来初始化它。在这里，我们使用了原始字符串字面量（raw string literal）。然而，正则表达式并不`仅仅`是一个字符串，当你初始化正则表达式（或赋值给它）时创建的某某种较为复杂的模式匹配机制是隐藏的，并且超出了本书的讨论范围。但是，一旦我们用邮编码模式初始化了正则表达式，就可以将其应用于文件的中的每一行：\n\
  \n点击此处查看代码图片\n\n```cpp\nsmatch matches;\nif (regex_search(line, matches, pat))\n\
  \    cout << lineno << \": \" << matches[0] << '\\n';\n```\n\n![Image](img/00005.jpeg)\n\
  \n`regex_search(line, matches, pat)` 在该行中搜索与存储在 `pat` 中的正则表达式匹配的任何内容，如果找到了任何匹配项，就会将其存储在\
  \ `matches` 中。自然地，如果没有找到匹配项，`regex_search(line, matches, pat)` 返回 `false`。\n\n`matches`\
  \ 变量类型为 `smatch`。`s` 代表“sub”（子）或“string”（字符串）。基本上，`smatch` 是一个 `string` 类型子匹配项的向量。第一个元素（这里是\
  \ `matches[0]`）是完整匹配项。如果 `i<matches.size()`，我们可以将 `matches[i]` 视为字符串。因此，如果对于一个给定的正则表达式，子模式的最大数量是\
  \ `N`，我们发现 `matches.size()==N+1`。\n\n![Image](img/00005.jpeg)\n\n那么，什么是子模式（sub-pattern）？一个很好的答案是“模式中括号里的任何内容”。观察\
  \ `\\w{2}\\s*\\d{5}(–\\d{4})?`，我们看到邮政编码四位扩展部分周围有括号。这是我们看到的唯一子模式，所以我们猜测（正确地）`matches.size()==2`。我们还猜测可以轻松访问那最后四个数字。例如：\n\
  \n点击此处查看代码图片\n\n```cpp\nfor (string line; getline(in,line); ) {\n    smatch matches;\n\
  \    if (regex_search(line, matches, pat)) {\n        cout << lineno << \": \" <<\
  \ matches[0] << '\\n'; // 完整匹配\n        if (1<matches.size() && matches[1].matched)\n\
  \            cout  << \"\\t: \" << matches[1] << '\\n'; // 子匹配\n    }\n}\n```\n\n\
  严格来说，我们并不需要测试 `1<matches.size()`，因为我们已经仔细研究过模式了，但我们觉得还是得“疑症”一点（因为我们在 `pat` 中尝试了多种模式，而它们并不都只有一个子模式）。我们可以通过查看其\
  \ `matched` 成员来询问子匹配是否成功，在此处为 `matches[1].matched`。如果你感到好奇的话：当 `matches[i].matched`\
  \ 为 `false` 时，未匹配的子模式 `matches[i]` 将打印为空字符串。同样，不存在的子模式（例如上述模式的 `matches[17]`）会被视为未匹配的子模式。\n\
  \n我们用一个包含以下内容的的文件测试了这个程序：\n\n点击此处查看代码图片\n\naddress TX77845\nffff tx 77843 asasasaa\n\
  ggg TX3456–23456\nhowdy\nzzz TX23456–3456sss ggg TX33456–1234\ncvzcv TX77845–1234\
  \ sdsas\nxxxTx77845xxx\nTX12345–123456\n\n并得到了以下输出：\n\n点击此处查看代码图片\n\npattern: `\"\
  \\w{2}\\s*\\d{5}(–\\d{4})?\"`\n1: TX77845\n2: tx 77843\n5: TX23456–3456\n    : –3456\n\
  6: TX77845–1234\n    : –1234\n7: Tx77845\n8: TX12345–1234\n\n（注：此处后续重复的输出结果完全一致，已省略）\n\
  \n\n\n\n\n# Axx\n\nAxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\n如果你希望字符至少出现一次，请使用 `+` 而不是 `*`。例如，\n\
  \n`Ax+`\n\n匹配一个 `A` 后面跟上一个或多个 `x`，例如：\n\n点击此处查看代码图片\n\n`Ax`\n\n`Axx`\n\n`Axxxxxxxxxxxxxxxxxxxxxxxxxxxxx`\n\
  \n但不匹配\n\n`A`\n\n零次或一次出现的常见情况（“可选的”）用问号表示。例如，\n\n`\\d–?\\d`\n\n匹配两个数字，它们之间带有一个可选的破折号，例如：\n\
  \n`1–2`\n\n`12`\n\n但不匹配\n\n`1––2`\n\n要指定特定次数的出现或特定的次数范围，请使用大括号。例如：\n\n`\\w{2}–\\\
  d{4,5}`\n\n匹配恰好两个字母和一个破折号（–），后面跟上四个或五个数字，例如：\n\n`Ab–1234`\n\n`XX–54321`\n\n`22–54321`\n\
  \n但不匹配\n\n`Ab–123`\n\n`?b–1234`\n\n是的，数字是 `\\w` 字符。\n\n## 23.8.4 分组\n\n为了将正则表达式指定为子模式，我们使用括号对其进行分组。例如：\n\
  \n`(\\d*:)`\n\n这定义了一个零或多个数字后跟一个冒号的子模式。组可以作为更复杂模式的一部分。例如：\n\n`(\\d*:)?(\\d+)`\n\n\
  这指定了一个可选且可能为空的数字序列，后面跟着一个冒号，再是一个一个或多个数字的序列。难怪人们发明了这种简洁且精确的方式来表达这些内容！\n\n## 23.8.5\
  \ 选择\n\n“或”字符 (`|`) 用于指定备选方案。例如：\n\n`Subject: (FW:|Re:)?(.*)`\n\n这识别一个邮件主题行，其中包含可选的\
  \ `FW:` 或 `Re:`，后面跟上零或多个字符。例如：\n\n`Subject: FW: Hello, world!`\n\n`Subject: Re:`\n\
  \n`Subject: Norwegian Blue`\n\n但不匹配\n\n`SUBJECT: Re: Parrots`\n\n`Subject  FW: No\
  \ subject!`\n\n不允许空的备选方案：\n\n`(|def)` // \n\n然而，我们可以一次指定多个备选方案：\n\n`(bs|Bs|bS|BS)`\n\
  \n## 23.8.6 字符集和范围\n\n特殊字符为最常见的字符类提供了简写：数字 (`\\d`)；字母、数字和下划线 (`\\w`)；等（§23.7.2）。然而，定义我们自己的类既简单又通常有用。例如：\n\
  \n![Image](img/00271.jpeg)\n\n在字符类规范中，使用 `–`（破折号）来指定范围，例如 `[1–3]`（1, 2 或 3）和 `[w–z]`（w,\
  \ x, y 或 z）。请谨慎地使用此类范围：并非每种语言都有相同的字母，也并非所有的字母编码都有相同的顺序。如果你觉得需要任何不是英文字母表中最常见字母和数字子范围的范围，请查阅文档。\n\
  \n注意，我们可以在字符类规范中使用特殊字符，例如 `\\w`（意思是“任何单词字符”）。那么，我们如何在字符类中引入反斜杠 (`\\`) 呢？按照习惯，我们用反斜杠对其进行“转义”：`\\\
  \\`。\n\n![Image](img/00007.jpeg)\n\n当字符类规范的第一个字符是 `^` 时，该 `^` 意味着“否定”。例如：\n\n![Image](img/00272.jpeg)\n\
  \n在最后一个正则表达式中，`^` 不是 `[` 之后的第一个字符，所以它只是一个字符，而不是否定运算符。正则表达式可以是很微妙的。\n\n正则表达式的实现还提供了一组命名的字符类用于匹配。例如，如果你想匹配任何字母数字字符（即字母或数字：`a–z`\
  \ 或 `A–Z` 或 `0–9`），你可以通过正则表达式 `[[:alnum:]]` 来实现。在这里，`alnum` 是一组字符集合的名字（字母数字字符集）。一个非空带引号的字母数字字符字符串的模式为\
  \ `\"[[:alnum:]+\"`。要将该正则表达式放入普通的字符串字面量，我们必须对引号进行转义：\n\n```cpp\nstring s {\"\\\"\
  \ [[:alnum:]]+\\\"\"};\n```\n\n此外，为了将该字符串字面量放入正则，我们必须转义反斜杠：\n\n点击此处查看代码图片\n\n```cpp\n\
  regex s {\"\\\\\\\" [[:alnum:]]+\\\\\\\"\"};\n```\n\n使用原始字符串字面量（raw string literal）更简单：\n\
  \n点击此处查看代码图片\n\n```cpp\nregex s2 {R\"(\" [[:alnum:]']}\")\n```\n\n对于包含反斜杠或双引号的模式，优先使用原始字符串字面量。事实证明许多应用程序中的模式都是如此。\n\
  \n使用正则表达式会导致大量的符号约定。无论如何，这里有一个字符类的列表：\n\n![Image](img/00273.jpeg)\n\n正则表达式的实现可能会提供更多字符类，但如果你决定使用此处未列出的命名类，请确保它符合需求。\n\
