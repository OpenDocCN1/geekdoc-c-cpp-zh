  \ Stroustrup），写了这本书，并与 Lawrence “Pete” Petersen 一起利用本书的草稿设计并教授了与本书同步开发的大学级入门（一年级）课程。\n\
  \n### 比雅尼·斯特劳斯特普\n\n![Image](img/00008.jpeg)\n\n我是 `C++` 编程语言的设计者和最初的实现者。在过去的 40\
  \ 多年里，我使用该语言以及许多其他编程语言处理各种编程任务。我热爱在具有挑战性的应用（如机器人控制、图形、游戏、文本分析和网络）中使用优雅且高效的代码。我曾向几乎所有能力和兴趣层次的人教授过设计、编程和\
  \ `C++`。我是 ISO `C++` 标准委员会的创始成员，担任语言演进工作组的主席。\n\n这是我的第一本入门书籍。我的其他书籍，如《C++ 编程语言》和《C++\
  \ 的设计与演变》，是为经验丰富的程序员编写的。\n\n我出生于丹麦奥胡斯（Århus）的一个蓝领家庭，在故乡大学获得了数学与计算机科学硕士学位。我的计算机科学博士学位来自英国剑大学。我在\
  \ `AT&T` 工作了约 25 年，最初在著名的贝尔实验室计算机科学研究中心——`Unix`、`C`、`C++` 等许多发明都在那里诞生——后来在 `AT&T`\
  \ 研究中心工作。\n\n我是美国国家工程科学院院士、`ACM` 会员以及 `IEEE` Fellow 士。作为历史上首位计算机科学家，我获得了 `Sigma\
  \ Xi`（科学研究协会）颁发的 2005 年 William Procter 科学成就奖。2010 年，我获得了奥胡斯大学授予与校相关人士对科学贡献的最古老、最荣誉的荣誉——*Rigmor\
  \ og Carl Holst-Knudsens Videnskapspris* 。2013 年，我被俄罗斯圣彼得堡国立研究大学 `ITMO` 授予计算机科学荣誉博士学位。\n\
  \n工作之余也有生活。我结婚有两个孩子，一个是医生，一个是博士后研究员。我读很多书（包括历史、科幻、犯罪和时事），喜欢大多数类型的音乐（包括古典、摇滚、蓝调和乡村音乐）。和朋友一起享受美食是生活中必不可缺的一部分，我喜欢访问遍有趣的地方和人。为了享受美食，我跑步。\n\
  \n更多信息请访问我的主页：[www.stroustrup.com](http://www.stroustrup.com)。特别是，你可以在那里找到如何读我的名字。\n\
  \n### Lawrence “Pete” Petersen\n\n![Image](img/00009.jpeg)\n\n在 2006 年底，Pete 这样介绍自己：“我是一个老师。在近\
  \ 20 年的时间里，我在德克萨斯 A&M 大学教授编程语言。我五次获得学生评出的卓越教学奖，并在 1996 年获得工程学院校友协会颁发的卓越教学奖。我是 `Wakonse`\
  \ 卓越教学计划成员，也是教育工作者发展学院成员。\n\n“作为一名军官的儿子，我是随迁迁长大的。在华盛顿大学完成哲学学位后，我在军队服了 22 年役，担任野战兵官和作战测试研究分析师。1971\
  \ 年至 1973 年，我在俄克拉荷马州西尔堡垒（Fort Sill）的野战兵官高级课程任教。1979 年，我帮助组织了测试人员培训课程，并在 1978 年至\
  \ 1981 年以及 1985 年至 1989 年期间，在美国九个不同地点担任主讲师进行教学。\n\n1991 年，我成立了一家小型软件公司。我的妻子 Barbara\
  \ 住在德克萨斯州的布延（Bryan）。我们喜欢旅行、园艺和招待朋友；尽可能和儿子们及其家人在一起，特别是我们的孙辈们——Angelina、Carlos、Avery、Nicholas\
  \ 和 Jordan。”\n\n遗憾的是，Pete 于 2007 年因肺癌去世。没有他，这门课程不可能成功。\n\n# 1. 计算机、人与编程\n\n## 1.1\
  \ 引言\n\n在本章中，我们介绍了一些我们认为让编程变得重要、有趣且有趣的事情。我们还介绍了一些基本的理念和理想。我们希望破除几个关于编程和程序员的流行迷思。这一章你现在可以先略读，等以后当你深陷于某个编程问题并挣扎、怀疑这一切是否值得时，再回来看看。\n\
  \n\n\n\n\n和大多数学习一样，学习编程也是一个“鸡生还是蛋”的问题：我们想要开始，但又想知道我们即将学习的内容为什么重要。我们想学习一项实用的技能，但也要确保它不只是转瞬即逝的潮流。我们想知道自己不会浪费时间，但又不想被更多的炒作和道德说教搞得无味。现在，只需阅读本章中你觉得有趣的内容，等当你觉得需要复习一下“为什么技术细节在教室之外很重要”的记忆时，再回来这里。\n\
  \n本章是对我们认为的编程中有趣且重要之处的个人陈述。它解释了为什么在几十年后，我们仍动力在这个领域坚持下去。这一章让你对可能的终极目标有一个大致的概念，并了解程序员可能是一个什么样的人。一本初级技术书不可避免地包含许多非常基础的内容。在本章中，我们将目光从技术细节移开，考虑大局：为什么编程是一项值得的活动？编程在我们的文明中扮演着什么角色？程序员可以在哪里做出令自豪的贡献？编程在更广泛的软件开发、部署和维护世界中处于什么位置？当人们谈论“计算机科学”、“软件工程”、“信息技术”等时，编程在这一版图中处于什么位置？程序员是做什么的？一个优秀的程序员具备哪些技能？\n\
  \n对于学生来说，理解一个观点、一种技术或一个章节的最紧迫理由可能是为了以好通过通过——但学习绝不止于此！对于在软件行业工作的人来说，理解一个观点、一种技术或一个章节的最紧迫理由可能是找到可以帮助当前项目，且不会打扰那个掌握着下份薪水、晋升和解雇的老板的东西——但学习绝不止于此！当我们感到自己的工作在某种小程度上让人们的生存环境变得更美好时，我们工作得最好。对于我们执行数年的任务（即构成职业和事业生涯的“事情”），`理想`和更抽象的想法是关重要的。\n\
  \n![Image](img/00005.jpeg)\n\n我们的文明运行在软件之上。改进软件和发现软件的新用途是个人帮助许多人生活的两种方式。编程在其中起着至关重要的作用。\n\
  \n## 1.2 软件\n\n良好的软件是隐形的。你看不到它，感受不到它，称不动它，也敲不动它。`Software` 是运行在某些计算机上的程序集合。有时，我们可以看到计算机。通常情况下，我们只能看到包含计算机的物体，例如电话、相机、面包机、汽车或风力涡轮机。我们可以看到这些软件所的作用。如果它没有履行它应该做的事情，我们会感到恼火或受伤。如果它应该做的事情不符合我们的需求，我们也会感到恼火或受伤。\n\
  \n世界上有多少台计算机？我们不知道；至少有几十亿。世界上的计算机可能比人还要多。我们需要清点服务器、台式电脑、笔记本电脑、平板电脑、智能手机以及嵌入“小妙计”中的计算机。\n\
  \n你每天（多或少直接）使用多少台计算机？我的车里有 30 多台计算机，手机里两台，MP3 播放器有一台，相机有一台。然后是我的笔记本电脑（你正在阅读的页面就在上面编写）和我的台式机。抵挡夏季炎热和湿度的空调控制器是一台简单的计算机。有一台计算机控制计算机科学系的电梯。如果你使用现代电视，里面至少有一台计算机。上网一会儿，你就会通过一个由成千上万计算机组成的电信系统（电话交换机、路由器等）直接与几十个——可能是数百个——服务器接触。\n\
  \n不，我并没有在车后座放着 30 台笔记本电脑到处开！重点是，大多数计算机看起来不像大众印象中的计算机（带有屏幕、键盘、鼠标等）；它们是嵌入在我们使用的设备中的小型“零件”。所以，那辆车没有任何看起来像计算机的东西，甚至没有一个显示地图和行驶路线的屏幕（尽管这种设备在其他汽车上很流行）。然而，它的引擎包含了许多计算机，执行着燃料喷射控制和温度监控等任务。助力转向涉及至少一台计算机，收音机和安全系统包含一些，我们怀疑甚至窗户的开关控制也是计算机控制的。新款甚至拥有可以持续监测胎压的计算机。\n\
  \n你的一天工作依赖多少台计算机？你得吃饭；如果你住在现代城市，将食物送到你面前是一项巨大的工程，需要规划、运输和存储方面的微小奇迹。分配网络管理显然是计算机化的，将它们所有连接在一起的通信系统也是如此。现代农业是高度计算机化的；在牛舍旁边你会发现用于监控牛群（年龄、健康、产奶等）的计算机，农用设备日益计算机化，而政府各个部门要求的表格多到能让任何诚实的农民流泪。如果出了问题，你可以在报纸上读到所有细节；当然，那些报纸上的文章是在计算机上写的，由计算机排版，并且（如果你还在读“纸质版”的话）是由计算机化设备打印的——通常是在电子传输到印刷厂之后。书籍也是以同样的方式生产。如果你需要通勤，交通流量由计算机监控，试图（通常是徒劳地）避免交通拥堵。你倾向于坐火车吗？那列火车也是计算机化的；有些甚至可以自动驾驶，而且列车的子系统（如广播、刹车和票务）涉及大量的计算机。如今的娱乐业（音乐、电影、电视、舞台剧）是计算机最大的用户之一。即使是非动画电影也大量使用（计算机）动画；音乐和摄影在录制和传输方面也是数字化（即使用计算机）。如果你生病了，医生开的检查将涉及计算机，医疗记录通常是计算机化的，如果你被送往医院治疗，你遇到的大多数医疗设备都包含计算机。\n\
  \n\n\n\n最后，研究——科学本身——高度依赖计算机。那些探测遥远星辰秘密的望远镜如果没有计算机就无法进行设计、建造或运行，它们产生的海量数据如果没有计算机也无法被分析和理解。一个个人生物领域的研究人员可能没有过度依赖计算机化（除非，当然，使用了相机、数字录音机、电话等），但在实验室里，数据必须经过存储、分析、对照计算机模型进行检查，并与同事进行交流。现代化学和生物学——包括医学研究——使用计算机的程度在几年前是无法想象的，现在大多数人也无法想象。人类基因组是由计算机完成测序的。或者——让我们准确一点——人类基因组是人类利用计算机完成测序的。在所有这些例子中，我们看到计算机是某种使我们能够完成某些没有计算机将难以完成的事情的东西。\n\
  \n这些每台计算机都运行着软件。没有软件，它们只是昂贵的硅、金属和塑料堆块：门挡器、船锚和太空取暖器。这些软件的每一行代码都是由某个人编写的。每一行被实际执行的代码至少是合理的，如果说不是正确的话。这一切能够运行起来太不可惊了！我们谈论的是数百种编程语言中的数十亿行代码（程序文本）。让这一切运行起来付出了惊人的努力，并涉及到无法想象数量的技能。我们希望所依赖的每项服务和设备都能得到进一步改进。想想你依赖的任何一项服务或设备；你希望看到什么得到改进？至少，我们希望我们的服务和设备更小（或更大）、更快、更可靠、功能更多、更易于使用、容量更高、更好看且更便宜。很可能是，你所想到的改进需要一些编程工作。\n\
  \n## 1.3 人\n\n![Image](img/00005.jpeg)\n\n计算机是由人建造并供人使用的。计算机是一种非常通用的工具；它可以用于各种超出想象范围的任务。需要一个程序才能让它对某人有用。换句话说，在有人——某个程序员——编写代码让它做某些事情之前，计算机仅仅是一块硬件。我们经常忘记软件。更频繁的是，我们忘记了程序员。\n\
  \n好莱坞和类似的“流行文化”虚假信息来源给程序员贴上了很大程度上负面的形象。例如，我们都见过那种孤僻、肥胖、长丑、没有社交技巧、痴迷于视频游戏和破解他人电脑的电脑呆男。他（几乎总是男性）想要毁灭世界的概率与想要拯救世界的概率一样大。显然，现实生活中存在这种漫画化形象的较温和版本，但根据我们的经验，他们在软件开发人员中出现的频率并不比在律师、警察、汽车销售员、记者、艺术家或政治家出现的频率更高。\n\
  \n想想你从自己的生活中了解的计算机应用。它们是由一个坐在黑房间里的独行者完成的吗？当然不是；一个成功的软件、电子小设备或系统的创建涉及数十、数百或数千人执行着一系列令人眼花缭乱的角色：例如，程序员、（程序）设计人员、测试人员、动画师、焦点小组经理、实验心理学家、用户界面设计师、分析师、系统管理员、客户关系人员、音响工程师、项目经理、质量工程师、统计学家、硬件接口工程师、需求工程师、安全官、数学家、销售支持人员、故障排除者、网络设计者、方法论者、软件工具经理、软件图书管理员等。角色的范围巨大，并且由于不同组织之间的头衔不同而变得更加令人困惑：一个组织的“工程师”可能是另一个组织的“程序员”，而第三个组织的“开发人员”、“技术人员成员”或“架构师”。甚至有些组织让员工自己选择头衔。并不是所有这些角色都直接涉及编程。然而，我们亲身见过人们在阅读或编写代码作为其工作重要组成部分时，执行上述提到的每一个角色。此外，一个程序员（执行这些角色中的任何一个或更多）可能在短时间内与来自应用领域的各种人士互动，例如生物学家、发动机设计师、律师、汽车销售员、医学研究人员、历史学家、地质学家、宇航员、飞机工程师、木材场经理、火箭科学家、保龄球馆建造者、记者和动画师（是的，这是一份根据个人经验列出的列表）。某人可能是程序员，而在职业生涯的其他阶段担任非编程角色。\n\
  \n程序员是孤立的的神话仅仅如此：一个神话。喜欢独立工作的人会选择那里最可行的工作领域，并且通常对“中断”和会议的数量苦苦抱怨。更倾向于与他人互动的人过得更容易，因为现代软件开发是一项团队活动。这意味着社交和沟通能力是关重要的，其价值比刻板印象所暗示的要得多。在程序员极理想技能的短名单上（无论你如何现实地定义`程序员`），你会发现与来自各种背景的人进行良好沟通的能力——通过非正式场合、在会议中、通过书面形式以及在正式演示中。我们坚信，在在你完成一或两个团队项目之前，你根本不知道什么是编程，也不知道你是否真的喜欢它。在我们喜欢编程的特性中，还有我们遇到的所有友善且有趣的人，以及作为我们职业生活的一部分所访问的各种地方。\n\
  \n所有这一切的一个含义是，拥有广泛广泛技能、兴趣和工作习惯的人对于产生优秀的软件至关重要。我们的生活质量取决于那些人——有时甚至取决于我们的生命本身。没有人能充补我们这里提到的所有角色；没有理智的人会想要每一个角色。点在于，你拥有比你想象中更广泛的选择；而不是你必须做出任何特定的选择。作为个人，你会“漂向”符合你技能、才华和兴趣的工作领域。\n\
  \n我们谈论“程序员”和“编程”，但显然编程只是整体图景的一部分。设计船只或手机的人并不认为自己是程序员。编程是软件开发的重要部分，但并不是软件开发的全部。同样，对于大多数产品来说，软件开发是产品开发的重要部分，但并不是产品开发的全部。\n\
  \n![Image](img/00007.jpeg)\n\n\n\n\n我们并不假设你——我们的读者——想要成为一名专业程序员，并在职业生涯的余下时间里都用来写代码。即使是顶级的程序员——尤其是那些`best`程序员——大部分时间也`不是`在写代码。理解问题需要大量的时间，并且通常需要巨大的智力投入。这种智力上的挑战正是许多程序员在说“编程很有趣”时所指的。许多优秀的程序员还拥有某些通常不被视为计算机科学的学科学位。例如，如果你从事基因组研究软件的开发，了解一些分子生物学知识会让你的工作变得高效得多。如果你从事分析中世纪文学的程序，读读这类文学，甚至可能了解一门或多种相关的语言，会让你受益匪浅。特别是，一个抱有“我只关乎计算机和编程”态度的人，将无法与他非程序员的同事进行交流。这样的人不仅会错过人际互动中最美好的部分（即生活），还会成为一个糟糕的软件开发者。\n\
  \n那么，我们假设了什么呢？编程是一项具有智力挑战性的技能集合，是许多重要且有趣的技术学科的一部分。此外，编程是我们世界不可或缺的一部分，因此，不知道编程基础就像不知道物理、历史、生物或文学的基础一样。一个对编程一无所知的人会沦为迷信者，并在许多技术岗位上是危险的。如果你读过《呆伯》（`Dilbert`），请把那个尖头老板想象成你不想遇到或（更糟的是）不想成为的那种经理。此外，编程是可以很有有趣的。\n\
  \n但我们假设你可能会用编程做什么呢？也许你将把编程作为你进一步学习和工作的关键工具，而不成为一名专业程序员。也许你可能会在职业和个人生活中与他人互动，在这些情况下，编程基础知识将成为优势，例如作为设计师、作家、经理或科学家。也许你会在学习或工作过程中，进行专业水平的编程。即使你真的成为了一名专业程序员，也不可能只做编程工作。\n\
  \n你可能会成为一名专注于计算机的工程师或计算机科学家，但即便如此，你也不会“一直在编程”。编程是一种用代码呈现观点的方式——一种辅助解决问题的方法。除非你拥有值得呈现的想法和值得解决的问题，否则它就是无意义的——绝对完全是浪费时间。\n\
  \n这是一本关于编程的书，我们已经承诺帮助你学习如何编程，那么我们为什么还要强调非编程学科和编程的有限作用呢？一个好的程序员理解代码和编程技术在项目中的作用。一个好的程序员（在大多数时候）是一个良好的团队合作者，并努力理解代码及其生产如何最好地支持整个项目。例如，想象我正在开发一种新的`MP3`播放器（可能是作为智能手机或平板电脑的一部分），而我关心的只是代码的美感以及我能提供的整洁功能的数量。我可能会坚持使用最大、最强大的计算机来运行我的代码。我可能会鄙视声音编码理论，因为那“不是编程”。我会待在实验室里，而不是去见潜在的用户，而他们的音乐品味无疑很糟糕，而且不会欣赏`GUI`（图形用户界面）编程的最新进展。可能的结果对该项目来说是一场灾难。更大的计算机意味着`MP3`播放器的成本更高，且极可能导致电池寿命更短。编码是数字处理音乐的不可或缺的一部分，因此，未能关注编码技术的进步可能会导致每首歌的内存需求增加（对于相同质量的输出，编码差异可能高达\
  \ 100%）。对用户偏好的忽视——无论这些偏好在你看来多么奇怪或古老——通常会导致用户选择其他产品。编写一个好程序的关键部分是理解用户需求以及这些需求对实现（即代码）的限制。为了完成这个糟糕程序员的漫画形象，我们只需要加上一种倾向：由于对细节的执着导致交付延期，以及对轻度测试代码的正确性具有过度自信。我们鼓励你成为一名好的程序员，对生产良好软件的要素具备广阔的视野。这既是社会价值的所在，也是个人满足感的关键。\n\
  \n## 1.4 计算机科学\n\n即使按照最宽泛的定义，编程也最好被视为更宏大的事物的一部分。我们可以将其视为计算机科学、计算机工程、软件工程、信息技术或任何与其他软件相关的学科的子学科。我们将编程视为那些计算机和信息科学与工程领域的赋能技术，也视为物理、生物、医学、历史、文学以及任何其他学术或研究领域的赋能技术。\n\
  \n考虑计算机科学。1995 年美国政府的一本“蓝皮书”定义如下：“对计算系统和计算的系统性研究。该学科产生的知识体系包含了理解计算系统的理论和方法；设计方法论、算法和工具；概念测试的方法；分析和验证的方法；以及知识表示与实现。”正如我们预期的那样，维基百科的条目没那么正式：“计算机科学，或计算科学，是对信息和计算的理论基础及其在计算机系统中的实现和应用的研究。计算机科学有许多领域；某些强调特定结果的计算（如计算机图形学），而另一些（如计算复杂度理论）与计算问题的属性有关。还有一些则关注实现计算面临的挑战。例如，编程语言理论研究描述计算的方法，而计算机编程则应用特定的编程语言来解决特定的计算问题。”\n\
  \n![Image](img/00005.jpeg)\n\n编程是一种工具；它是表达基础性和实际问题解决方案的基础工具，以便它们能够被测试、通过实验改进并被使用。编程是想法与理论汇合的地方。这是计算机科学成为一门实验性学科而非纯理论，并影响世界的地方。在这种背景下，与其他许多领域一样，本质编程必须是良好实践与理论的结合。它不能退化为单纯的黑客行为：为了满足临时需求而用任何方式写代码。\n\
  \n## 1.5 计算机无处不在\n\n没有人知道关于计算机或软件的所有知识。这一节只是给你提供几个例子。也许你会发现你喜欢的东西。至少，你可能会确信计算机的使用范围——以及编程的范围——远比任何个人能完全理解的要。\n\
  \n大多数人认为计算机是连接到屏幕和键盘上的小灰盒子。这类计算机通常擅长游戏、消息传递、电子邮件以及播放音乐。其他被称为笔记本电脑的计算机被无聊的商人在飞机上用来查看电子表格、玩游戏和看视频。这种漫画式的形象只是冰山一角。大多数计算机在我们的视野之外工作，是维持我们文明运行系统的一部分。有些占据整个房间；有些甚至比硬币还小。许多最有趣的计算机并不通过键盘、鼠标或类似的设备与人类直接交互。\n\
  \n\n\n\n\n### 1.5.1 有屏幕与无屏幕\n\n将计算机认为是一个带有屏幕和键盘的大型矩形盒子的观点非常普遍，而且往往根深蒂固。然而，请考虑这两台计算机：\n\
  \n![Image](img/00010.jpeg)\n\n这两个“小妙设备”（恰好是手表）主要的都是计算机。事实上，我们推测它们本质上是同型号计算机，具有不同的\
  \ I/O（输入/输出）系统。左边的那个驱动一个小屏幕（与传统计算机的屏幕类似，但更小），右边的则驱动微小的电动机来控制传统的时针，以及一个用于显示日期的数字拨盘。它们的输入系统是四个按钮（在右侧手表上更容易看到）和一个无线电接收器，用于与高精度的“原子”钟进行同步。控制这两台计算机的大部分程序在它们之间是共享的。\n\
  \n### 1.5.2 运输\n\n这两张照片展示了一个大型海用柴油发动机和它可能驱动的巨型轮轮：\n\n![Image](img/00011.jpeg)\n\n\
  考虑计算机和软件在这里发挥关键作用的地方：\n\n*   **设计：** 显然，船只和发动机都是使用计算机设计的。其用途列表几乎是无限的，包括建筑和工程图纸、通用计算、空间和部件的可视化以及部件性能的仿真。\n\
  *   **建造：** 现代造船厂是高度计算机化的。船只的组装使用计算机精心计划，并由计算机引导工作。焊接由机器人完成。特别是，一艘现代双壳油油轮，如果没有微小的焊接机器人从船体之间的空间内部进行焊接是无法建造的。那里根本没有人类活动的空间。为船只切割钢板是世界上最早的\
  \ CAD/CAM（计算机辅助设计与辅助制造）应用之一。\n*   **发动机：** 发动机具有电子燃油喷射，并由几十台计算机控制。对于一台 10 万马力的发动机（如照片所示），这是一项非同凡的任务。例如，发动机管理计算机不断调整燃料混合比，以最大地减少因发动机调校不当导致的污染。与发动机（以及船的其他部分）关联的许多泵本身也是计算机化的。\n\
  *   **管理：** 船只在有货物需要取运和交付的地方航行。船队的调度是一个持续的过程（当然是计算机化的），以便路线能根据天气、供需以及港口的空间和装载能力发生变化。甚至有些网站可以随时查看主要商船的位置。照片中的船恰好是一艘集装箱船（世界上最大的此类之一；长\
  \ 397 米，宽 56 米），但其他大型现代船舶也以类似的方式管理。\n*   **监控：** 海洋船很大程度上是自主的；也就是说，其船员可以处理到达下一个港口之前可能出现的大意外。然而，他们也是全球网络的一部分。船员可以获得相当准确的天气信息（来自并通过计算机化的卫星）。他们拥有\
  \ GPS（全球定位系统）以及计算机控制和计算机增强的雷达。如果船员需要休息，大多数系统（包括发动机、雷达等）可以通过航运公司的控制室进行卫星监控。如果发现任何异常或连接中断，会通知船员。\n\
  \n考虑这段简要描述中明确提到或暗示的数百台计算机之一故障意味着什么。`第 25 章`（“嵌入式系统编程”）将稍稍详细地讨论这一点。为现代船只编写代码是一项熟练且有趣的活动。它也非常有用。海运的成本实际上低得惊人。当你购买非本地制造的物品时，你就会体会到。海运一直比陆运便宜；如今，原因之一就是计算机和信息的广泛使用。\n\
