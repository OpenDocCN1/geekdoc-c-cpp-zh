  \n## 9. 技术细节：类等\n\n“记住，事情是需要时间的。”\n\n—皮特·海因 (Piet Hein)\n\n在本章中，我们继续关注编程的主要工具：C++\
  \ 编程语言。我们介绍了语言细节，大部分与用户定义类型有关，即类和枚举。语言特征的很多介绍形式都是 `Date` 类型的逐步改进。这样，我们也有机会演示一些实用的类设计技术。\n\
  \n***\n\n## 9.1 用户定义类型\n\n## 9.2 类与成员\n\n## 9.3 接口与实现\n\n## 9.4 演进一个类\n\n### 9.4.1\
