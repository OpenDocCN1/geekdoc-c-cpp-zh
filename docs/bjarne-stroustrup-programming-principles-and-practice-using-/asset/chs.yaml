  \ {\n    }\n    void main() {\n        X a; a.f(2);\n    }\n};\n```\n\n难以阅读的代码通常隐藏着\
  \ bug。当你使用 IDE 时，它会尝试自动对你的代码进行正确缩进（根据对“正确”的某种定义），并且存在“`code beautifiers`”可以为你重新格式化源文件（通常提供多种格式选择）。然而，你的代码可读性的最终责任在于你。。\n\
  \n### 8.5 函数调用与返回\n\n![Image](img/00005.jpeg)\n\n函数是我们用来表示动作和计算的方式。每当我们想要做某些值得命名的事情时，我们就写一个函数。C++\
  \ 语言给了我们运算符（如 `+` 和 `*`），通过它们从表达式中的操作数产生新值，以及语句（如 `for` 和 `if`），通过它们控制执行顺序。为了组织由这些原语组成的代码，我们使用了函数。\n\
  \n为了完成工作，函数通常需要参数，并且许多函数会返回结果。本节重点关注于如何指定和传递参数。\n\n#### 8.5.1 声明参数和返回类型\n\n函数是我们在\
  \ C++ 中命名和表示计算与动作的工具。函数声明由一个返回类型组成，后面是函数名，然后是括号中的形式参数列表。例如：\n\n点击此处查看代码图像\n\n```cpp\n\
  double fct(int a, double d);                 // fct 的声明（无函数体）\ndouble fct(int a,\
  \ double d) { return a*d; }  // fct 的定义\n```\n\n定义包含函数体（调用时要执行的语句），而不是定义的声明以分号结尾。形式参数通常被称为\
  \ `parameters`（形参）。如果你不想让函数接受参数，直接留空形式参数即可。例如：\n\n```cpp\nint current_power(); //\
  \ current_power 不接受参数\n```\n\n如果你不想从函数返回值，请将 `void` 给出其返回类型。例如：\n\n```cpp\nvoid\
  \ increase_power(int level); // increase_power 不返回值\n```\n\n`void` 意味着“不返回数值”或“不返回任何内容”。在声明和定义中，你可以根据喜好为参数命名或不命名。例如：\n\
  \n```cpp\n// 在 vs 中搜索 s;\n// hint 可能是一个搜索的好起点位置\n// 返回匹配项的索引；-1 表示“未找到”\nint my_find(vector<string>\
  \ vs, string s, int hint); // 为参数命名\nint my_find(vector<string>, string, int); //\
  \ 不给参数命名\n```\n\n![Image](img/00005.jpeg)\n\n在声明中，形式参数名在逻辑上并不是必须的，只是对写注释很有用。从编译器的角度来看，`my_find()`\
  \ 的第二个声明和第一个一样好：它包含了调用 `my_find()` 需要的所有信息。\n\n通常，我们会在定义中命名所有参数。例如：\n\n```cpp\n\
  int my_find(vector<string> vs, string s, int hint) // 从 hint 开始搜索 vs \n{\n    if\
  \ (hint<0 || vs.size()<=hint) hint = 0;\n    for (int i = hint; i<vs.size(); ++i)\
  \ // 从 hint 开始\n        if (vs[i]==s) return i;\n    if (0<hint) { // 如果我们在 hint\
  \ 之前没有找到 s\n        for (int i = 0; i<hint; ++i)\n            if (vs[i]==s) return\
  \ i;\n    }\n    return –1;\n}\n```\n\n`hint` 让代码变得复杂了很多，但提供 `hint` 的假设是用户可以通由知道字符串在\
  \ vector 中的大致位置来有效地利用它。然而，想象一下，如果我们使用 `my_find()` 了一段时间后，发现调用者很少能用好 `hint`，所以它实际上损害了性能。现在我们不需要它了，但我们不需要重写\
