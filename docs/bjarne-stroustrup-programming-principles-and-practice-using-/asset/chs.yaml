  \ i) // 月份 [0:11]\n{\n    if (i<0 || i>=12) error(\"bad month\");\n    return month_print_tbl[i];\n\
  }\n```\n\n![images/0007.jpeg 所以，你真的读了所有代码和解释吗？还是说你的眼睛直接跳到了结尾？记住，我们所用的技术是简单的，但如果没有帮助并不容易发现。读取数据是基础。正确编写循环是基础。转换表示形式……你*会*学会这些。###\
