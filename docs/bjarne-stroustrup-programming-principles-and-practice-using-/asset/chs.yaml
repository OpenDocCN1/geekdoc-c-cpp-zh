  ]\n\n\n\n\n\n### 19.2.1 表示法\n\n在§19.1 中，我们展示了改变大小的最简单策略：只需为新数量的元素分配空间，并将旧元素复制到新空间中。然而，如果频繁调整大小，这样做效率很低。在实践中，如果我们一次改变了大小之后通常还会多次进行类似操作；尤其是很少只执行一次`push_back()`调用。因此我们可以通过预判这种尺寸变化来优化程序——事实上所有向量实现都会同时跟踪元素数量以及为“未来扩展”预留的“空闲空间”。例如：\n\
  \n```\nclass vector {\n    int sz;                 // number of elements\n    double*\
  \ elem;           // address of first element\n    int space;              // number\
  \ of elements plus “free space”/“slots”\n                            // for new\
  \ elements (“the current allocation”)\npublic:\n    // ...\n};\n```\n\n这段代码可以用下图表示：\n\
