  \ 留作练习。\n\n#### 10.1.3 更改表示形式\n\n为了让 `Month` 的 `>>` 操作工作，我们需要提供一种读取月份符号表示的方法。为了对称性，我们将提供一个匹配的符号符号表示写入操作。繁琐的方法是写一个\
  \ `if`语句：\n\n```cpp\nif (s==\"jan\") m = 1;\nelse if (s==\"feb\") m = 2...\n```\n\
  \n这不仅很繁琐，还将月份名称硬编码到了代码中。最好将这些内容放在表格中，这样当我们必须更改符号表示时，主程序可以保持不变。我们决定将输入表示表示为一个 `vector<string>`\
  \ 加上一个初始化函数和一个查找函数：\n\n![images/00006.jpeg](img/点击此处查看代码图片)\n\n```cpp\nvector<string>\
  \ month_input_tbl = {\n    \"jan\", \"feb\", \"mar\", \"apr\", \"may\", \"jun\"\
  , \"jul\",\n    \"aug\", \"sep\", \"oct\", \"nov\", \"dec\"\n};\n\nint month_to_int(string\
  \ s) // s 是否为月份的名称？如果是，返回它的索引 [0:11]，否则返回 -1\n{\n    for (int i=0; i<12; ++i) if\
  \ (month_input_tbl[i]==s) return i;\n    return -1;\n}\n```\n\n如果你好奇的话：C++ 标准库确实提供了一种更简单的方法来实现此。请参见\
  \ §21.6.1](#part0029.html_ch21lev2sec) 中的 `map<string,int>`。\n\n当我们想要产生输出时，遇到了相反的问题。我们有一个代表月份的\
  \ `int`，并希望打印符号表示。我们的解决方案从根本上相似，但不是使用表格从字符串转换为 `int`，而是使用一个从 `int` 转换为 `string`：\n\
  \n点击此处查看代码图片\n\n```cpp\nvector<string> month_print_tbl = {\n    \"January\", \"\
