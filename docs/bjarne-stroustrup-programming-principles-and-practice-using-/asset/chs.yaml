  \n```cpp\nenum Printer_flags {\n    acknowledge=1,\n    paper_empty=1<<1,\n    busy=1<<2,\n\
  \    out_of_black=1<<3,\n    out_of_color=1<<4,\n    // . . .\n};\n```\n\n这定义了每个枚举成员的值恰好等于其名称所指示的值：\n\
