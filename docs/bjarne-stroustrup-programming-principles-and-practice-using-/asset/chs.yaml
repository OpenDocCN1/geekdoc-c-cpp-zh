  \ 我们的目标\n\n让我们尝试一个简单的实验。编写一个二分查找算法。现在就做，不要等到本章结束，也不要等到下一节之后——亲自尝试非常重要，立刻行动！二分查找是在有序序列中从中间位置开始的搜索：\n\
  \n•   如果中间元素等于我们正在寻找的目标值，则搜索完成。\n•   如果中间元素小于我们正在寻找的目标值，则对右半部分进行二分查找。\n*   若 `middle`\
  \ > *target*（目标），向左转；若 `<`（小于）,向右转；结果指示成功并返回索引/指针/迭代器。\n\n使用小于号(`<`)作为比较准则;可采用任何数据结构或调用约定——请自行编写代码(避免使用类似标准库中的\
  \ `binary_search` / `equal_range)。你对正确性有多大把握？当规模扩大到约 20 万行编译器和操作系统乃至安全关键的航空电子系统时,你的推理是否会受到影响？\n\
  \n奇怪的是,大多数复杂软件仍然能正常运行 ——但不包括“游戏泛滥的消费级个人电脑”，后者并不算关键系统。安全关键型系统极少崩溃;银行不再严重混淆 0 美元的支票\
  \ ——但这些软件仍是由容易犯错的人类编写的...那么开发人员如何能够在首次尝试时难免存在缺陷的前提下获得可靠性呢?通过调试和测试消除错误后再借助能够从意外事件中恢复的设计方法从而打造出极其可靠的系纺\
  \ -尽管它们偶尔也会隐藏一些较小的故障但始终会提供最低限度的服务保障。\n\n####  26\\.1  注意事项\n各行业的测试差异巨大:视频游戏与航空标准的术语及工具相互矛盾；\n\
  将本章思路应用于个人项目并提供理想化指导方案→在遇到涉及多种工具体制和难以完整描述的组织架构的大型综合系统的实际测验时可参考本内容:\n\n##    证明 \
  \ \nEdsgerDijkstra 指出:“测仅指证存而非缺失”由此产生用数学方法验证程序正确的追求遗憾尚未实现现状突破目前受限领域存在于非平凡范畴外当然成立也可含有谬误本身已成为高级专题方向**据此我们将转而关注结构性自洽检测手段+结合后续章节幸存逻辑残差重建组织架构；\n\
  \n**注意**:保持严格规则即冒号和反引号需要适用于文本内提到的变量、类名以及命令就算没有格式化下划线也要绝对保留语义含义除本条注明处之外请在下方定界符间准确输出相同\
  \ markdown 修复格式的内容 [参照说明书];\n\n```markdown\n\n\n\n\n首先，让我们先考虑如何测试一个单元（例如函数、类、类层次结构或模板）。测试人员将白盒测试（你可以查看所测试内容的详细实现的测试）和黑盒测试（你只能查看所测试内容的接口的测试）区分开来。我们不会在这个区别上大费太多精力；请务必阅读你所测试内容的实现代码。但请记住，以后可能会有人来重写那段实现代码，因此尽量不要依赖于任何接口中没有保证的特性。事实上，在测试任何内容时，基本思想是向其接口输入我们能想到的任何东西，看看它的响应是否合理。\n\
  \n![Image](img/00005.jpeg)\n\n提到某人（可能是你自己）可能会在你测试之后更改代码，这引出了**回归测试**（regression\
  \ testing）。基本上，每当你做出更改时，都必须重新测试，以确保你没有破坏任何东西。所以，当你改进了一个单元时，重新运行它的单元测试；而在将完整系统交给他人之前（或你自己将其用于实际用途之前），要运行完整的系统测试。\n\
  \n对系统运行此类完整的测试，通常被称为回归测试，因为它通常包括运行之前发现过错误的测试，以查看这些错误是否仍然已修复。如果没有，程序就“退化”了，需要再次修复。\n\
  \n### 26.3.1 回归测试\n\n![Image](img/00006.jpeg)\n\n构建一个过去对发现错误非常有用的大型测试集，是为系统构建有效测试套件的主要部分。假设你有用户；他们会向你发送\
  \ bug。永远不要丢弃 bug 报告！人士使用 bug 跟踪系统来确保这一点。无论如何，bug 报告要么证明系统中存在错误，要么证明用户对系统的理解错误。无论是哪种情况，它都是有用的。\n\
  \n通常，bug 报告包含过多的无关信息，处理它的首要任务是生成能够重现所报告问题的最小程序。这通常涉及删掉提交的大部分代码：特别是，我们尝试消除不影响错误的库和应用程序代码的使用。找到这个最小测试程序通常有助于我们定位系统代码中的\
  \ bug，而这个最小程序就是被添加到回归测试套件中的内容。我们找到这个最小程序的方法是不断删除代码，直到错误消失——然后重新插入我们最后删除的那段代码。我们不断这样做，直到没有可以删除的候选代码为止。\n\
  \n仅仅运行成百上千（或数万）个由旧 bug 报告产生的测试可能看起来并不系统，但我们在这里实际上做的是系统地利用用户和开发者的经验。回归测试套件是开发者小组机构记忆的重要部分。对于一个大型系统，我们无法依赖原始开发者在场来解释设计和实现的细节。回归套件是确保系统不会偏离开发者和用户认为的正确行为的关键。\n\
  \n### 26.3.2 单元测试\n\n好了，话就说到这里！让我们尝试一个具体的例子：让我们测试一个二分查找。这里是来自 ISO 标准的规范（§25.3.3.4）：\n\
  \n```cpp\ntemplate<class ForwardIterator, class T>\nbool binary_search(ForwardIterator\
  \ first, ForwardIterator last, const T& value);\n\ntemplate<class ForwardIterator,\
  \ class T, class Compare>\nbool binary_search(ForwardIterator first, ForwardIterator\
  \ last, const T& value, Compare comp);\n```\n\n**要求**：`first,last)` 中的元素 `e` 相对于表达式\
  \ `e<value` 和 `!(value<e)` 或 `comp(e,value)` 和 `!comp(value,e)` 是分区的。此外，对于 `[first,last)`\
  \ 中的所有元素 `e`，`e<value` 意味着 `!(value<e)`，或 `comp(e,value)` 意味着 `!comp(value,e)`。\n\
  \n**返回值**：如果在范围 `[first,last)` 中存在满足相应条件的迭代器 `i`：`!(*i<value) && !(value<*i)` 或\
  \ `comp(*i,value)==false && comp(value,*i)==false`，则返回 true。\n\n**复杂度**：最多 `log(last–first)+2`\
  \ 次比较。\n\n没人说过正式规范对于初学者来说是容易读的。然而，如果你真的执行了我们在章节开头强烈建议的设计和实现二分查找的练习，你对二分查找的作用以及如何测试它就会有一个很好的理解。这个（标准）版本接受一对前向迭代器和一个值作为参数，如果该值在迭代器定义的范围内，则返回\
  \ true。迭代器必须定义一个有序序列。比较（排序）准则是 `<`。我们将第二个接受比较准则作为额外参数的 `binary_search` 版本留作练习题。\n\
  \n在这里，我们将只处理未被编译器捕的错误，所以像这样的示例是别人的问题：\n\n```cpp\nbinary_search(1,4,5); // 错误：int\
  \ 不是前向迭代器\nvector<int> v(10);\nbinary_search(v.begin(),v.end(),\"7\"); // 错误：无法搜索字符串\n\
  binary_search(v.begin(),v.end()); // 错误：忘记了值，在 int 向量中\n```\n\n![Image\n\n我们如何系统地测试\
  \ `binary_search()`？显然，我们不能为它尝试每一个可能的参数，因为每个可能的参数将意味着每种类型值的每种序列——那将是无限的！所以我们必须选择测试，而为了选择，我们需要一些原则：\n\
  \n- 测试可能的错误（发现最常见的错误）。\n- 测试糟糕的错误（发现后果最严重的错误）。\n\n我们所说的“糟糕”是指后果最严重的错误。通常来说，这是一个模糊的概念，但在特定程序中可以精确化。例如，对于孤立考虑的二分查找，所有的错误都是同样糟糕的，但如果我们在一个所有答案都经过仔细检查的程序中使用\
  \ `binary_search()`，那么得到一个错误答案可能比它进入无限循环而不返回要好得多。在这种情况下，花费更多精力欺骗 `binary_search()`\
  \ 进入无限（或长时间）循环，比尝试欺骗它给出错误答案更有值。注意我们在这里使用“欺骗”一词。测试在许多方面是运用创造性思维来解决“我们如何让这段代码表现异常”问题的练习。最好的测试人员不仅是系统性的，而且相当狡猾（当然，是为了正义）。\n\
  \n#### 26.3.2.1 测试策略\n\n我们如何破坏 `binary_search()`？我们首先从查看 `binary_search()` 的要求，即它对输入的假设。遗憾的是，从我们测试者的角度来看，标准中明确规定了\
  \ `[first,last)` 必须是一个有序序列；也就是说，这是调用者的责任来确保这一点，因此我们不能公平地通过提供无序输入或 `last<first` 的\
  \ `[first,last)` 来尝试破坏 `binary_search()`。注意，`binary_search()` 的要求并没有说明当我们提供不符合其要求的输入时它会发生什么。在标准的其他地方，它说在这种情况下可能会抛出异常，但并不是强制要求的。尽管如此，这些事实在我们测试\
  \ `binary_search()` 的使用时很有帮助，因为调用者未能建立函数的要求（如 `binary_search()`）是一个可能的错误来源。\n\n\
  我们可以想象 `binary_search()` 可能出现以下几类错误：\n\n- 不返回（例如：无限循环）\n- 崩溃（例如：非法引用、无限递归）\n\n\n\
  \n即使值在序列中，也可能找不到；  \n即使值不在序列中，也可能找到。\n\n此外，我们还需要注意以下常见的用户错误“机会”：\n\n- 序列未排序（例如 `{2,1,5,-7,2,10}`）。\n\
  - 不是有效的序列（例如 `binary_search(&a[100], &a[50],77)`）。\n\n对于简单的调用`binary_search(p1,p2,v)`，实现者可能会犯什么样的错误呢？（供测试人员发现）\
