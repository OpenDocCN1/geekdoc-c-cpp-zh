  点击此处查看代码图像\n\n```text\n\"欢迎使用我们的简单计算器。\n\n请使用浮点数输入表达式。\"\n```\n\n**5.** 通过提到可以使用哪些运算符以及如何打印和退出来改进那段问候语。\n\
