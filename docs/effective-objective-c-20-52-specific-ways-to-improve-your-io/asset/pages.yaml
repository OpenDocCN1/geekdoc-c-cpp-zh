  md: '# Item 4: Prefer Typed Constants to Preprocessor #define


    This is a preprocessor directive; whenever the string ANIMATION_DURATION is found
    in source code, it is replaced with 0.3. This might seem exactly what you want,
    but this definition has no type information. It is likely that something declared
    as a “duration” means the value is related to time, but it’s not made explicit.
    Also, the preprocessor will blindly replace all occurrences of ANIMATION_DURATION,
    so if that were declared in a header file, anything else that imported that header
    would see the replacement done.


    To solve these problems, you should make use of the compiler. There is always
    a better way to define a constant using a preprocessor define. For example, the
    following defines of a constant of type NSTimeInterval


    ```

    static const NSTimeInterval kAnimationDuration = 0.3;

    ```


    Note that with this style, there is type information, which clearly defines what
    the constant is. The type is NSTimeInterval, and so it helps to document the use
    of that variable. If you have a lot of constants to define, this will certainly
    help you and other people who read the code later.


    Also note how the constant is named. The usual convention for constants is to
    prefix with the letter k for constants that are local to a translation unit (implementation
    file). For constants that are exposed outside of a class, it is usual to prefix
    with the class name. Item 19 explains more about naming conventions.


    It is important where you define your constants. Sometimes, it is tempting to
    declare preprocessor defines in header files, but that is extremely bad practice,
    especially if the defines are not named in such a way that they''t clash. For
