- pgno: 171
  md: '# Chapter 5: Memory Management


    ![](img/72498492af77d8c75e17783675fe4432_171_0.png)


    **Figure 5.3** A retain cycle in an object graph


    # Retain Cycles


    A common scenario to be aware of with reference counting is what is known as a
    retain cycle, which occurs when multiple objects refer to another object cyclically.
    This leads to memory leaks because no object in the cycle will ever see its retain
    count drop to 0. Each object has at least one other object in the cycle maintaining
    a reference to it. In Figure 5.3, three objects all have a single reference to
    one of the other two objects. In this cycle, all retain counts are 1.


    In a garbage-collected environment, this situation would usually be picked up
    as a so-called island of isolation. In such a scenario, the collector would deallocate
    all three objects. This luxury is not available under the reference-counting architecture
    of Objective-C. The problem is usually solved by using weak references (see Item
    33) or an external influence causing one of the objects to relinquish its retain
    of another object. In either case, the retain cycle is broken, and memory is no
    longer leaked.


    # Things to Remember


    +   - Reference-counting memory management is based on a counter that is incremented
    and decremented. An object is created with a count of at least 1. An object with
    a positive retain count is alive. When the retain count drops to 0, the object
    is destroyed.


    +   - As it goes through its life cycle, an object is retained and released by
    other objects holding references to it. Retaining and releasing increments and
    decrements the retain count, respectively.'
  merge: -1
  img_proc: true
- pgno: 172
  md: "# Item 30: Use ARC to Make Reference Counting Easier\n\nReference counting\
    \ is a fairly easy concept to understand (see item 29). The semantics of where\
    \ retains and releases need to appear easily expressed. So with the Clang compiler\
    \ project came a static analyzer that is able to indicate the location of problems\
    \ with the reference counting. For example, consider the following snippet with\
    \ manual reference counting:\n\n```\nif ([self shouldLogMessage]) {\n    NSString\
    \ *message = [[NSString alloc] initWithFormat:@\"I am an object, %p\", self];\n\
    \    NSLog(\"message = %@\", message);\n}\n```\n\nThis code has a memory leak\
    \ because the message object is not released at the end of the statement. Since\
    \ it cannot be referenced outside the if statement, the object is leaked. The\
    \ rules governing why this is a leak are straightforward. The call to NSString\
    \ alloc method returns an object with a +1 retain count. But there is no release.\
    \ These rules are easy to count, and a computer could easily apply these rules\
    \ and tell us that the object has been leaked. That's exactly what the static\
    \ analyzer does one step further.\n\nSince it is able to tell you there are memory-management\
    \ problems, it should easily be able to go ahead and fix them by adding in the\
    \ required retain or release, right? That is the idea from which Automatic Reference\
    \ Counting (ARC) was born. ARC does exactly what it says in the name: makes reference\
    \ counting automatic. So in the preceding snippet, the message object would automatically\
    \ have a release added just before the end of the if statement scope, automatically\
    \ turning the code into the following:\n\n```\nif ([self shouldLogMessage]) {\n\
    \    NSString *message = [[NSString alloc] initWithFormat:@\"I am an object, %p\"\
    , self];\n    NSLog(\"message = %@\", message);\n    [message release]; /////\
    \ Added by ARC\n```\n\nThe important thing to remember with ARC is that reference\
    \ counting is still being performed. But ARC adds more than memory-management\
    \ semantics to methods that return objects, as you will see. It is these core\
    \ semantics, which have become standard throughout Objective-C, on which ARC is\
    \ built."
  merge: -1
  img_proc: true
- pgno: 173
  md: 'Because ARC adds retains, releases, and autoreleases for you, calling memory-management
    methods directly under ARC is illegal. Specifically, you cannot call the following
    methods:


    +   * retain


    +   * release


    +   * dealloc


    Calling any of these methods directly will result in a compiler error because
    doing so would interfere with ARC''s able to work out what memory-management calls
    are required. You have to put your trust in ARC to do the right thing, which can
    be daunting for developers using manual reference counting.


    In fact, ARC does not call these methods through the normal Objective-C message
    dispatch but instead calls lower-level C variants. This is optimal, since retains
    and releases are performed frequently, and so saving CPU cycles is a big win.
    For example, the equivalent for retain is objc_retain. This is also why it is
    illegal to override retain, release, or autorelease, as these methods are never
    called directly. For the rest of this item, I will usually talk about the equivalent
    Objective-C method rather than the lower-level C variants. This should help if
    your back-ground is with manual reference counting.


    # Naming Rules Applied by ARC


    The memory-management semantics dictated by method names have long been convention
    in Objective-C, but ARC has cemented them as hard rules. The rules are simple
    and relate to the method name. A method returning an object returns it owned by
    the caller if its method name begins with one of the following:


    +   * alloc


    +   * new


    +   * copy


    +   * mutableCopy


    "Owned by the caller" means that the code calling any of the four methods listed
    is responsible for releasing the returned object. That is to say, the object will
    have a positive retain count, where exactly 1 needs to be balanced by the calling
    code. The retain count may be greater than 1 if the object has been retained additionally
    and autoreleased, which is one reason why the retainCount method is not useful
    (see Item 36).'
