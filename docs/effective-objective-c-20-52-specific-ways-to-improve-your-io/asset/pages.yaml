    ```


    A much better method name is the following:


    ```

    - (id)initWith:(float)width andHeight:(float)height;

    ```


    This is verbose, but there is absolutely no ambiguity over what each variable
    is when it is used so:


    ```

    EOCRectangle *aRectangle =

    [[EOCRectangle alloc] initWithWidth:5.0f andHeight:10.0f];

    ```


    Newcomers to Objective-C often have difficulty getting used to the verbose naming
    of methods, although using verbose naming enhances the readability of code. Don''t
    be afraid to use long method names. Ensuring that method names are as long as
    they need to be that they do precisely what they say. But you shouldn''t have
    incredibly long names either. Your method names should be concise and precise.


    Take, for example, the EOCRectangle class. Well-named methods would include the
    following:


    +   - EOCRectangle*)unionRectangle:(EOCRectangle*) rectangle

    - (float)area


    However, badly named versions of these methods would include:


    +   - EOCRectangle*)union:(EOCRectangle*) rectangle // Unclear

    - (float)calculateArea // Too verbose


    Clearly named methods will read left to right just as if you were reading a passage
    of text. Following the many rules that define how methods should be named is not
    mandatory, but doing so will certainly make your code maintainable and more readable
    by others.


