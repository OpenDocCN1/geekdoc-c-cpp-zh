  md: "# Chapter 6: Blocks and Grand Central Dispatch\n\nspace as required to store\
    \ all the captured variables. Note that this does not mean that objects themselves\
    \ are copied but rather only the variables holding pointers. When the block is\
    \ run, the captured variables are read from this region of memory, which is why\
    \ the block needs to be passed as a parameter into the invoke function.\n\n# Global,\
    \ Stack, and Heap Blocks\n\nWhen blocks are defined, the region of memory they\
    \ occupy is allocated on the stack. This means that the block is valid only within\
    \ the scope in which it is defined. For example, the following code is dangerous:\n\
    \n```\nvoid (^block)();\nif (/* some condition */) {\n    block = ^{\n       \
    \ NSLog(\"@Block A\");\n    };\n} else {\n    block = ^{\n        NSLog(\"@Block\
    \ B\");\n    };\n}\nblock();\n```\n\nThe two blocks that are defined within the\
    \ if and else statements are allocated within stack memory. When it allocates\
    \ stack memory for each block, the compiler is free to overwrite this memory at\
    \ the end of the scope in which that memory was allocated. So each block is guaranteed\
    \ to be valid only within its respective if-statement section. The code would\
    \ compile without error but at runtime it may not function correctly. If it decided\
    \ to produce code that overwrite the chosen block, the code would run without\
    \ error, but if it did, a crash would certainly occur.\n\nTo solve this problem,\
    \ blocks can be copied by sending the block the copy message. In doing so the\
    \ block is copied from the stack to the heap. Once this has happened, the block\
    \ can be used outside the scope in which it was defined. Also, once it has been\
    \ copied to the heap, a block becomes a reference-counted object. Any subsequent\
    \ copies do not perform a copy but instead simply increment the block's reference\
    \ count. When a heap block is no longer referenced, it needs to be released automatically,\
    \ if using ARC, or through an explicit call to release, if using manual reference\
    \ counting. When the reference count drops to zero, the heap block is deallocated\
    \ just like any other object. A stack block does not need to be explicitly released,\
    \ as this"
