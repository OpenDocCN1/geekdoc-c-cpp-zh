    \ {\n    EOCPerson *personOne = [EOCPerson newPerson];\n    //\n\n    EOCPerson\
    \ *personTwo = [EOCPerson somePerson];\n    //\n```\n\n+   * At this point, 'personOne'\
    \ and 'personTwo' go out of scope, therefore ARC needs to clean them up as required.\n\
