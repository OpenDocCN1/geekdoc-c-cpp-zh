  md: '# Blocks and Grand Central Dispatch


    Multithreaded programming is something that every developer is going to need to
    think about with modern application development. Even if you don''t think that
    your application is multithreaded, it most probably is because system frameworks
    often use extra threads to get work done off the UI thread. There''s nothing worse
    than an application hangs because the UI thread is blocked. In Mac OS X, this
    results in the dreaded spinning beach ball; in iOS, your application may be terminated
    if it blocks for too long.


    Fortunately, Apple has thought about multithreading in a whole new way. The core
    features of modern multithreading are blocks and Grand Central Dispatch. Although
    distinct and separate technologies, they were introduced together. Blocks provide
    lexical closures to C, C++, and Objective-C and are incredibly useful, mainly
    because they provide a mechanism to pass around code as if it were an object,
    to be run in a different context. Crucially, though, blocks can use anything from
    the scope in which they were defined.


    GCD is the associated technology and provides an abstraction to threading, based
    on so-called dispatch queues. Blocks can be enqueued on these queues, and GCD
    handles all scheduling for you. It creates, reuses, and destroys background threads
    as it sees fit, based on system resources, to process each queue. Moreover, GCD
    provides easy-to-use solutions to common programming tasks, as thread-safe single-code
    execution and running the tasks in parallel, based on available system resources.


    Both blocks and GCD are a mainstay of modern Objective-C programming. Therefore,
    you need to understand how they work and what they provide.'
  merge: -1
  img_proc: true
