  md: '# Item 42: Prefer GCD to performSelector and Friends


    If you were to benchmark this, you would certainly find it quicker than using
    a serial queue. Note that you could also use a synchronous barrier in the setter,
    which may be more efficient for the same reason as explained before. It would
    be prudent to benchmark each approach and choose the one that is best for your
    specific scenario.


    # Things to Remember


    +   * Dispatch queues can be used to provide synchronization semantics and offer
    a simpler alternative to @synchronized blocks or NSLock objects.


    +   * Mixing synchronous and asynchronous dispatches can provide the same synchronized
    behavior as with normal locking but without blocking the calling thread in the
    asynchronous dispatches.


    +   * Concurrent queues and barrier blocks can be used to make synchronized behavior
    more efficient.


    # Item 42: Prefer GCD to performSelector and Friends


    Thanks to the extremely dynamic nature of Objective-C (see item 11), a few methods
    defined on NSObject allow you to call any method you wish. They allow delayed
    execution of a method call or specification of which thread it should run on.
    They were once a very useful feature; however, technologies such as Grand Central
    Dispatch and blocks are making their use less important. Although you will often
    see code using them, I encourage you to stay clear of them.


    The most basic method in this family is performSelector:. It takes a single argument,
    which is the selector to perform, with the following signature:


    +   - (id)performSelector:(SEL)selector


    This is equivalent to calling the selector directly. So the following lines of
    code are equivalent:


    ```

    [object performSelector:@selector(selectorName)];

    [object selectorName];

    ```


    It might seem as though this is redundant. It would be if this was the only way
    the method could be used. However, its real power comes from the fact that the
    selector can be decided at runtime. Such dynamic binding on top of dynamic binding
    means that you can do something like this:


    ![](img/72498492af77d8c75e17783675fe4432_232_0.png)'
