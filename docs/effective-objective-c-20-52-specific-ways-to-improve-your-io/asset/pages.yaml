  md: "# Item 46: Avoid dispatch_get_current_queue\n\nIn this example, two queues\
    \ are created. The target queue of queue\n is set to queue A, whose target queue\
    \ stays as the default priority\nglobal queue. Then a queue-specific value is\
    \ set on queue\nA, using the following function:\n\n```\nvoid dispatch_queue_set_specific(dispatch_queue_t\
    \ queue,\n                             const void *key,\n                    \
    \         void *context,\ndispatch_function_t destructor);\n```\n\nThis takes\
    \ the target queue to set the data on, followed by the key and\nt value. Both\
    \ the key and the value are opaque void pointers. For the\nkeys, the important\
    \ thing to remember is that they are compared by\nt pointer value, not by the\
    \ contents. Queue-specific data behaves\ndifferently from NSDictionary objects,\
    \ which compare object equality\nkeys. Queue-specific data behaves more like associated\
    \ references\n(see Item 10). Values (called context in the function prototype)\
    \ are\nalso void pointers. So they can be absolutely anything you\nwant. However,\
    \ you can perform any memory management you\nwant on the object. This makes it\
    \ very difficult to use Objective-C\nbjects as the value under ARC. In the example,\
    \ a CoreFoundation\nstring is used as the value because ARC does not take care\
    \ of mem-\noragement of any CoreFoundation object. Such objects there-\nfore make\
    \ for good queue-specific data because they can be toll-free\nbridged to their\
    \ Objective-C classes as required.\n\nThe final argument to the function, which\
    \ is the destructor function,nis run when the object held for a given key is removed\
    \ either\nbecause the queue is deallocated or a new value is set for that key.\n\
    The dispatch_function_t type is defined so:\n\n```\ntypedef void (*dispatch_function_t)(void*)\n\
    ```\n\nThe destructor must therefore be a function that takes a single pointer\n\
    as its only argument and returns void. In the example, CFRelease is\ngiven, although\
    \ it could also\nhave a user-defined function in turn called CFRelease to\nclean\
    \ up the value and perform any other necessary cleanup.\n\nQueue-specific data\
    \ therefore provides a simple-to-use mechanism to\naround one of the common pitfalls\
    \ of dispatch_get_current_queue.\nOther common uses of dispatch_get_queue might\
    \ include\ndebugging. In these circumstances, it is safe so long that code is\
    \ not compiled into release builds.\nA specific requirement for accessing the\
    \ current queue is not covered by\nother functions, it is best to file a feature\
    \ request with Apple."
