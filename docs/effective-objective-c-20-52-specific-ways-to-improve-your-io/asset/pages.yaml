  md: "# Item 37: Understand Blocks\n\nis handled by virtue of the fact that stack\
    \ memory is automatically reclaimed: the reason that the example code was dangerous.\n\
    \nWith this in mind, you can simply apply a couple of copy method calls to make\
    \ that code safe:\n\n```\nvoid (^block)();\nif ( */* some condition */ ) {\n \
    \   block = [^{\n        NSLog(\"@Block A\");\n    } copy];\n} else {\n    block\
    \ = [^{\n        NSLog(\"@Block B\");\n    } copy];\n}\nblock();\n```\n\nThis\
    \ code is now safe. If manual reference counting were used, the block too would\
    \ need to be released after it is finished with.\n\nGlobal blocks are another\
    \ category. along stack and heap blocks. Blocks that do not capture any state,\
    \ such as variables from the enclosing scope, do not need any state to run. The\
    \ entire region of memory these blocks use is known in full at compile time; so\
    \ global blocks are declared within global memory rather than being created on\
    \ the stack each time they are used. Also, it is a no-op to copy a global block,\
    \ and a global block is never deallocated. Such blocks are in effect, singletons.\
    \ The following is a global block:\n\n```\nvoid (^block)() = ^^{\n    NSLog(\"\
    @This is a block\");\n};\n```\n\nAll the information required to execute this\
    \ block is known at compile time: therefore, it can be a global block. This is\
    \ purely an optimization to reduce unnecessary work that might be done if simple\
    \ blocks were treated like more complex blocks that require work to be done when\
    \ they are copied and disposed of.\n\n# Things to Remember\n\n+   * Blocks are\
    \ lexical closures for C. C++, and Objective-C.\n* Blocks can optionally take\
    \ parameters and optionally return values.\n* Blocks can be stack allocated, heap\
    \ allocated, or global. A stack-allocated block can be copied onto the heap, at\
    \ which point it is reference-counted just like standard Objective-C objects."
