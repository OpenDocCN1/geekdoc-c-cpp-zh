    to. It simply needs to know that it can send the instance copy message.


    An example of using this idea of anonymous objects being used for objects returned
    from a library is where the library handles database connections. You may not
    want to leak the class that handles the connection, since it might be a different
    one for different databases. Without a same way for them to inherit from the same
    base class, you would be forced to return something of type id. However, you could
    create a protocol to define the common methods that all database connections have
    and declare that the object conforms to it. Such a protocol may look like this:


    ```

    @protocol EOCDatabaseConnection

    - (void)connect;

    - (void)disconnect;

    - (BOOL)isConnected;

    - (NSArray*)performQuery:(NSString*)query;

    @end

    ```


    Then you may have a database handler singleton that is used to provide database
    connections. Its interface may look like this:


    ```

    #import <Foundation/Foundation.h>

    ```


    ```

    @protocol EOCDatabaseConnection;

    @interface EOCDatabaseManager : NSObject

    +(id)sharedInstance;

    connectionWithIdentifier:(NSString*)identifier;

    @end

    ```


    By this way, the class that handles the database connections is not leaked, and
    different classes from potentially different frameworks can be returned by the
    same method. All the consumer of this API cares about is that the object returned
    can be connected and disconnected and queries performed. That last point is particularly
    important. In this example, the back-end code to handle database connections could
    be using many different third-party libraries to connect to each different'
