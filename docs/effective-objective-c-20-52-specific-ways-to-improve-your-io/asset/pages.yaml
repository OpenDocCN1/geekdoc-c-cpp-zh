  md: "# Chapter 3: Interface and API Design\n\nHowever, if the storage backing the\
    \ class had changed—for example, by using a structure to hold the width and height\
    \ together—the logic of how to set the data would have to be changed in both initializers.\
    \ This wouldn't be too bad in this simple example, but imagine a more complicated\
    \ class with many more initializers and more complicated data. It would be very\
    \ easy to forget to change one of the initializers and end up with inconsistencies.\n\
    \nNow that you want to subclass EOCRectangle and create a class called EOCquare.\
    \ It's clear that this hierarchy makes sense, but what should the initializer\
    \ be? Clearly, the width and height should be forced to be equal, since that's\
    \ what a square is! So you might decide to create an initializer like so:\n\n\
    ```\n#import \"EOCRectangle.h\"\n```\n\n```\n@interface EOCquare : EOCRectangle\n\
    - (id)initWithDimension:(float)dimension;\n@end\n```\n\n```\n@implementation EOCquare\n\
    - (id)initWithDimension:(float)dimension {\n  return [super initWithWidth:dimension\
    \ andHeight:dimension];\n}\n```\n\nThis would become EOCquare's designated initializer.\
    \ Note how it calls its superclass's designated initializer. If you look back\
    \ to the implementation of EOCRectangle, you'll see that it calls its superclass's\
    \ designated initializer. This chain of designated initializers is important to\
    \ maintain. However, it's still possible for callers to initialize an EOCquare\
    \ object by using either the initWith:andHeight: or init method. You don't really\
    \ want to allow this, since someone could end creating a square whose width and\
    \ height don't match. This illustrates an important point when subclassing. You\
    \ should always override the designated initializer of your superclass if you\
    \ have a designated initializer with a different name. In the case of EOCquare,\
    \ you could override EOCRectangle's designated initializer like so:\n\n```\n-\
    \ (id)initWithWidth:(float)width andHeight:(float)height {\n  float dimension\
    \ = MAX(width, height);\n  return [self initWithDimension:dimension];\n}\n```"
