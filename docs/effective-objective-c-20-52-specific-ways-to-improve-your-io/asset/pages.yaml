    # Block-Based Enumeration


    Block-based methods are the final type of enumeration available in modern Objective-C.
    The best method for enumerating an array is as follows, defined on NSArray:


    +   - (void)enumerateObjectsUsing:(id object, NSInteger idx, BOOL *stop))block


    The other methods in this family can take options to control the enumeration and
    are discussed later.


    For the array and the set, the block that is performed for each iteration takes
    the object at that iteration, the index into the iteration, and a pointer to a
    Boolean. The first two parameters are self-explanatory. The third provides a mechanism
    for halting the enumeration.


    For example, you can enumerate an array with this method as follows:


    ```

    NSArray *anArray = /* ... */;

    [anArray enumerateObjectsUsingBlock:(id object, NSInteger idx, BOOL *stop) {

    // Do something with ''object''

    if (shouldStop) {

    *stop = YES;

    }

    }];

    ```


    This syntax is slightly more verbose than fast enumeration but is clean, and you
    get the index of iteration and the object.'
