  md: '```

    @end

    ```


    ```

    // EOCPerson.m

    #import "EOCPerson.h"

    ```


    ```

    @implementation EOCPerson

    // Implementation of methods

    @end

    ```


    The importing of Foundation.h is required pretty much for all classes you will
    make in Objective-C. Either that, or you will import the base header file for
    the framework in which the class''s superclass lives. For example, if you were
    creating an IOS application, you would subclass ViewController often. These classes''
    header files will import UIKit.


    As stands, this class is fine. It imports the entirety of Foundation. but that
    doesn''t matter. Given that this class inherits from a class that''s part of Foundation,
    it''s likely that a large portion of it will be used by consumers of EOCPerson.
    The same goes for a class that inherits from ViewController. Its consumers will
    make use of most of UIKit.


    As time goes on, you may create a new class called EOCEmployee. Then you decide
    that an EOCPerson instance should have one of those. So you go ahead and add a
    property for it:


    ```

    // EOCPerson.h

    #import <Foundation/Foundation.h>

    ```


    ```

    @interface EOCPerson : NSObject

    @property (nonatomic, copy) NSString *firstName;

    @property (nonatomic, copy) NSString *lastName;

    @property (nonatomic, strong) EOCEmployee *employee;

    @end

    ```


    A problem with this, though, is that the EOCEmployee class is not vis-ible when
    compiling anything that imports EOCPerson.h. It would be wrong to mandate that
    anyone imports EOCPerson.h must also import EOCEmployee.h. So the common thing
    to do is to add the follow-ing at the top of EOCPerson:


    ```

    #import "EOCEmployee.h"

    ```


    This would work, but it''s bad practice. To compile anything that uses EOCPerson,
    you don''t need to know the full details about what an EOCPerson is. All you need
    to know is that a class called EOCEmployee exists. Fortunately, there is a way
    to tell the compiler this:'
