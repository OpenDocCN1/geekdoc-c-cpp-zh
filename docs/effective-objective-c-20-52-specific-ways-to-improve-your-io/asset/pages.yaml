- pgno: 58
  md: "# Item 8: Understand Object Equality\n\nThis approach is a middle ground between\
    \ efficiency and creating least some range of hashes. There will, of course, collisions\
    \ with hashes created using this algorithm, but at least multiple return values\
    \ are possible. The tradeoff between collision frequency and a computationally\
    \ intensive hash method is something that you should experiment with and see what\
    \ works for your object.\n\n# Class-Specific Equality Methods\n\nOther than NSString\
    \ as described earlier, classes that provide a specific equality method include\
    \ NSArray:(isEqualToArray:) and NSDictionary:(isEqualToDictionary:), both of which\
    \ will throw an exception if the object being compared is not an array or a dictionary.\
    \ Objective-C has no strong type checking at compile time, so you could easily\
    \ accidentally pass in an object of the wrong type. Therefore, you need to be\
    \ sure that the object you're passing is indeed of the correct type.\n\nYou may\
    \ decide to create your own equality method if equality is likely to be checked\
    \ frequently; therefore, the extra speed from not having to check types is significant.\
    \ Another reason for providing a specific method is purely cosmetic if you think\
    \ it looks better and is more readable, which is likely part of the motivation\
    \ for NSString'sisEqualTo:method. Code that uses this method is easier to read,\
    \ as you don't have to hunt for the types of the two objects being compared.\n\
    \nIf you create a specific method, you should override the isEqual: method also\
    \ pass through it if the class of the object being compared is the same as the\
    \ receiver. If it's not, passing through to the superclass implementation is common\
    \ practice. For example, the EOCPerson class could implement the following:\n\n\
    ```\n(BOOL)isEqualTo:(EOCPerson*)otherPerson {\n    if (self == object) return\
    \ YES;\n\n    if (_firstName isEqualToString:otherPerson.firstName)\n        return\
    \ NO;\n    if (_lastName isEqualToString:otherPerson.lastName)\n        return\
    \ NO;\n    if (_age != otherPerson.age)\n        return NO;\n    return YES;\n\
    }\n```"
  merge: -1
