  md: '# Chapter 1: Accustoming Yourself to Objective-C


    12


    # Limitations


    A minor limitation with the literal syntax is that with the exception of strings,
    the class of the created object must be the one from the Foundation framework.
    There''s no way to specify your own custom subclass that should be created instead.
    If you wanted to create an instance of your own custom subclass, you''d need to
    use the nonliteral syntax. However, since NSArray, NSDictionary, and Number class
    clusters are rarely subclassed, as it''s nontrivial to do so. Also, the standard
    implementations are usually good enough. Strings can use a custom class, but it
    must be changed through a compiler option. Use of this option is discouraged unless
    you know what you are doing, you will always want to use NSString anyway.


    Also, in the case of strings, arrays, and dictionaries, only immutable variants
    can be created with the literal syntax. If a mutable variant is required, a mutable
    copy must be taken, like so:


    ```

    NSMutableArray *mutableCopy = @[@1, @2, @3, @4, @5] mutableCopy;

    ```


    This adds an extra method call, and an extra object is created, but the benefits
    of using the literal syntax outweigh these disadvantages.


    # Things to Remember


    +   * Use the literal syntax to create strings, numbers, arrays, and dictionaries.
    It is clearer and more succinct than creating them using the normal object-creation
    methods.


    +   * Access indexes of an array or keys in a dictionary through the sub-scripting
    methods.


    +   * Attempting to insert nil into an array or dictionary with literal syntax
    will cause an exception to be thrown. Therefore, always ensure that such values
    cannot be nil.


