    Conversely, any object that is of type id will be assumed to respond to all messages.


    As you''ll know from Item 12, though, the compiler cannot actually know all the
    selectors a certain type understands, since they can be dynamically inserted at
    runtime. However, even if this technique is used, the compiler expects to see
    the method prototype defined in a header somewhere such that it can know the full
    method signature to be able to emit the correct code to perform the message dispatch.


    Inspecting the type of an object at runtime is known as introspection and is a
    powerful and useful feature baked into the Foundation framework as part of the
    NSObject protocol, which allows all objects that inherit from the common root
    classes (NSObject and NSObject) conform. Using these methods rather than directly
    comparing classes of objects is prudent, as I will explain. However, before looking
    at introspection techniques, there is some background as to what Objective-C object
    is.


    Every Objective-C object instance is a pointer to a blob of memory. That''s why
    you see the * next to the type when declaring a variable:

    NSString *pointerVariable = @"Some string";


    If you come from a C world of programming, you''ll understand exactly what this
    means. For the non-C programmers among you, this means that pointerVariable is
    a variable holding a memory address, where the data stored at that memory address
    is the NSString instance. The variable therefore "points to" the NSString instance.
    This is how all Objective-C objects are referred to; if you tried to allocate
    the memory for an object on the stack instead, you would receive an error from
    the compiler:


    ```

    NSString stackVariable = @"Some string";n// error: interface type cannot be statically
    allocated

    ```


    The generic object type, id, is already a pointer in itself, so you use it like
    so:


    ```

    id typedString = @"Some string";

    ```


    This definition is semantically the same as if the variable were of type NSString.
    The only difference with specifying the type fully is that the compiler can help
    help and warn if you attempt to call a method that doesn''t exist for instances
    of that class.


    The data structure behind every object is defined in the runtime headers along
    with the definition of the id type itself:'
