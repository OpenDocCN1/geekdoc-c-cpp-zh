    The bridge within the cast tells ARC what to do with the the Objective-C object
    that forms part of the cast. A bridge on its own means that ARC still has ownership
    of the Objective-C object. A _bridge_retained, conversely, means that ARC will
    hand over ownership of the object. If this were used in the preceding example,
    we would be responsible for adding a CFRelease(cCFArray) after the array has finished
    with it. Similarly, the opposite is done with _bridge_transfer. For example if
    a CFArrayRef is being cast to an NSArray* and you want ARC to take ownership of
    the object, you use this type of cast. These three types of casting are known
    bridges.


    But, may you be wondering, why would you want to use this feature in a purely
    Objective-C application? Well, Foundation''s Objective-C classes can do some things
    CoreFoundation''s C data structures cannot, and vice versa. One major problem
    that crops up with Foundation''s dictionary, for example, is that keys are copied
    and values are retained. These semantics cannot be altered unless you use the
