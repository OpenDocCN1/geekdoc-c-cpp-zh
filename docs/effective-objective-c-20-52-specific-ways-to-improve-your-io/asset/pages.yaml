  md: "# Chapter 3: Interface and API Design\n\nUIKit, the two UI frameworks from\
    \ Mac OS and iOS, respectively, to provide the ability for objects to be serialized\
    \ using an XML format called a NIB. These NIBs are usually used to store a view\
    \ controller's layout of its views. When loaded from a NIB, the view controller\
    \ goes through the unarchiving process.\n\nNSCoding protocol defines that the\
    \ following initializer method should be implemented:\n\n+   - (id)initWithCoder:(NSCoder*)decoder\n\
    \nThis method can't usually call through your main designated initializer, because\
    \ it has to do different work to unarchive the object through the decoder. Also,\
    \ if the superclass implements NSCoding as well, its initWithCoder: method needs\
    \ to be called. You would end up with two designated initializers in the strict\
    \ sense of the term, because more than one initializer calls through to a superclass\
    \ initializer.\n\nApplying this to EOCRectangle would give the following:\n\n\
    ```\n#import <Foundation/Foundation.h>\n\n@interface EOCRectangle : NSObject <NSCoding>\n\
    @property (nonatomic, assign, readonly) float width;\n@property (nonatomic, assign,\
    \ readonly) float height;\n-(id)initWithWidth:(float)width\n    andHeight:(float)height;\n\
    @end\n\n@implementation EOCRectangle\n\n// Designated initializer\n-(id)initWithWidth:(float)width\n\
    \    andHeight:(float)height\n{\n    if ((self = [super init])) {\n        _width\
    \ = width;\n        _height = height;\n    }\n    return self;\n}\n\n// Superclass's\
    \ designated initializer\n-(id)init {\n    return [self initWithWidth:5.0f maxHeight:10.0f];\n\
    }\n```"
