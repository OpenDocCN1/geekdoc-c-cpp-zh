    \  float width;\n  float height;\n};\n```\n\nIf you're not familiar with C++,\
    \ that doesn't matter. All you need to be aware of is this defines a class that\
    \ has two instance variables: width and height. It also has a single way to create\
    \ an instance of the class, called a constructor, that takes the dimensions. It\
    \ also has accessors for the dimensions. When using the class, you would create\n\
    \n```\nRectangle *aRectangle = new Rectangle(5.0f, 10.0f);\n```\n\nWhen you come\
