    server times out, this method is called handling an error representing what happened.
    This delegate method doesn''t have to be implemented, so it is up to the user
    of the NSURLConnection class to decide if it is necessary to know about the error.
    This is preferable to throwing an exception, since it''s left to the user to decide
    whether to be told about the error.


