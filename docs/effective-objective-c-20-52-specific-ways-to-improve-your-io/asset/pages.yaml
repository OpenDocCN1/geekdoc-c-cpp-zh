    # Item 33: Use Weak References to Avoid Retain Cycles


    A typical situation in an object graph is that a cycle of objects all reference
    each other in some way. When this happens in a reference-counting architecture
    such as the Objective-C memory-management model, a memory leak will usually occur
    at some point because even-tually, no object in the cycle of objects will be referenced
    by anything else. Therefore, none of the objects in the cycle can be accessed,
    but they won''t be deallocated either, since they are all keeping each other alive.


    In the most simple of all retain cycles, two objects reference each other. Figure
    5.4 shows an example.


    This sort of retain cycle is easy to understand and detect by looking at code:


    ```

    #import Foundation/Foundation.h


    @class EOCCA;

    @class EOCCB;


    @interface EOCCA : NSObject

    @property (nonatomic, strong) EOCCB *other;

    @end


    @interface EOCCB : NSObject

    @property (nonatomic, strong) EOCCA *other;

    @end

    ```'
