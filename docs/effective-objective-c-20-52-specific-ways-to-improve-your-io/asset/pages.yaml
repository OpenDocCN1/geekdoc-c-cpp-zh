  md: "# Item 41: Prefer Dispatch Queues to Locks for Synchronization\n\nSometimes\
    \ in Objective-C, you will come across code that you're having trouble with because\
    \ it's being accessed from multiple threads. This situation usually calls for\
    \ the application of some sort of synchronization. Before GCD, there were two\
    \ ways to achieve this, the first being the built-in synchronization block:\n\n\
    ```\n(void)synchronizedMethod {\n  @synchronized(self) {\n    // Safe\n  }\n}\n\
    ```\n\nThis construct automatically creates a lock based on the given object and\
    \ waits on that lock until it executes the code contained in the block. At the\
    \ end of the code block, the lock is released. In the example, the object being\
    \ synchronized against self. This construct is often a good choice, as it ensures\
    \ that each instance of the object can run its own synchronizedMethod independently.\
    \ However, overuse of @synchronized(self) can lead to inefficient code, as each\
    \ synchronized block will execute serially across all blocks. If you over-synchronize\
    \ against self, you can end up with waiting unnecessarily on a lock held by unrelated\
    \ code.\n\nThe other approach is to use the NSLock object directly:\n_lock = [[NSLock\
    \ alloc] init];\n\n```\n(void)synchronizedMethod {\n  _lock lock;\n  // Safe\n\
    \  _lock unlock;\n}\n```\n\nRecursive locks are also available through NSRecursiveLock,\
    \ allowing for one thread to take out the same lock multiple times without causing\
    \ a deadlock.\n\nBoth of these approaches are fine but come with their own drawbacks.\
    \ For example, synchronization blocks can suffer from deadlock under extreme circumstances\
    \ and are not necessarily efficient. Direct use of locks can be troublesome when\
    \ it comes to deadlocks.\n\nThe alternative is to use GCD, which can provide locking\
    \ in a much simpler and more efficient manner. Properties are a good example"
