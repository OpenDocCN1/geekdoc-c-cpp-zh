  md: '# 7


    # The System

    Frameworks


    Although it is possible to use Objective-C without using any of the system frameworks,
    doing so is extremely uncommon. Even the standard root class, NSObject, is part
    of the Foundation framework rather than part of the language itself. If you don''t
    want to use Foundation, you would have to write your own root class, as well as
    your own collections, event loops, and other useful classes. Furthermore, you
    cannot use Objective-C for developing Mac OS X and iOS applications without using
    the system frameworks. They are powerful but have come through years of development
    to where they are today. Therefore, you may find some parts that feel old and
    are awkward to work with, but you may also find hidden gems.


    # Item 47: Familiarize Yourself with the System

    Frameworks


    When writing an application in Objective-C, you will almost certainly use the
    system frameworks, which provide many of the common classes, such as collections,
    which you need to be able to write applications. If you don''t understand what
    the system frameworks provide, you may end up writing something that has already
    been written. When they upgrade their operating systems, users of your application
    obtain the latest versions of the system frameworks. So if you use classes from
    these frameworks, you benefit from any improvements made to them, without having
    to update your application.


    A framework is a set of code packaged as a dynamic library along header files
    describing its interface. Sometimes, a third-party framework built for iOS uses
    a static library, since iOS applications are not allowed to ship dynamic libraries
    with them. These are not true frameworks but are often referred to as such. However,
    all system frameworks use dynamic libraries on iOS still.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# Chapter 7: The System Frameworks


    If you''re developing a graphical application for Mac OS X or iOS, you will come
    across the framework called Cocoa, which is also referred to as Cocoa Touch for
    iOS. Cocoa is not a framework in itself but rather a collection of other frameworks
    commonly used when creating applications.


    The main framework you will come across is called Foundation, where classes such
    as NSObject, NSArray, and NSDictionary are found. The class prefix used throughout
    the Foundation framework is NS, which was first formulated when Objective-C was
    being used for work on the NEXTSTEP operating system. The Foundation framework
    truly is the foundation of all Objective-C applications; without it, most of this
    book would be irrelevant.


    Foundation provides not only core features that you would expect, such as collections,
    but also complex features, such as string processing. For example, NSLinguisticTagger
    provides the ability to parse string and find all the nouns, verbs, pronouns,
    and so on. In short, Foundation goes far beyond the basics.


    Alongside Foundation is another framework: CoreFoundation. Although not technically
    Objective-C, CoreFoundation is another important framework to be familiar with
    when writing Objective-C applications and is a C API that mirrors much of the
    functionality of the Foundation framework. The CoreFoundation and Foundation frameworks
    are closely linked more than name. A feature known as toll-free bridging allows
    seamless casting from the C data structures of CoreFoundation to the Objective-C
    objects of Foundation, and vice versa. For example, a string from Foundation is
    NSString, which can be cast to its equivalent in CoreFoundation: CFString. Toll-free
    bridging works through some rather intricate code that makes CoreFoundation objects
    appear to the runtime as though they are Objective-C objects. Unfortunately, toll-free
    bridging is very complex, so replicating yourself in your own code is tricky.
    This feature should be used, but only if you really know what you''re doing.


    Along with Foundation and CoreFoundation are many other system libraries. They
    include but are not limited to the following:


    +   * CFNetwork provides this C-level networking facilities for talking to networks
    through an easy-to-use abstraction over BSD sockets. Foundation wraps parts of
    this framework to provide an Objective-C interface for networking, such as NSUrlConnection
    for downloading data from a URL.


    +   * CoreAudio provides this C-level API for interfacing with audio hardware
    on a device. This is one of the harder frameworks to work'
