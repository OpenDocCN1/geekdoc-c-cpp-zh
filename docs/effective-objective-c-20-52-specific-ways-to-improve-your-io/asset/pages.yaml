  md: "# Item 37: Understand Blocks\n\n```\nint add = addBlock(2, 5); // add = 7\n\
    ```\n\nThe powerful feature that blocks allows capturing the scope in which they\
    \ are declared. This means that any variables available to the scope in which\
    \ the block is declared are also available inside the block. For example, you\
    \ could define a block that used another variable like this:\n\n```\nint additional\
    \ = 5;\nint (^addBlock)(int a, int b) = ^(int a, int b){\n  return a + b;\n}\n\
    int add = addBlock(2, 5); // add = 12\n```\n\nBy default, any captured variable\
    \ cannot be modified by the block. In the example, if the variable additional\
    \ was changed within the block, the compiler would issue an error. However, variables\
    \ can be declared as modifiable by giving them __block qualifier. For example,\
    \ a block can be used in array enumeration (item 48) to determine how many numbers\
    \ in an array are less than 2:\n\n```\nNSArray *array = @[0, @1, @2, @3, @4, @5];\n\
    __block NSInteger count = 0;\n[array enumerateObjectsUsingBlock:^(NSNumber *number,\
    \ NSInteger idx, BOOL *stop){\n  if ([number integerValue] == NSOrderedAscending)\
    \ {\n    count++;\n  }\n}];\n```\n\nThis example also shows the use of an inline\
    \ block. The block passed to enumerateObjectsUsing: method is not assigned to\
    \ a local variable but declared inline to the method call. This commonly used\
    \ coding pattern with blocks shows why they are useful. Before blocks became part\
    \ of the language, the preceding code would have to be done by passing a function\
    \ pointer or selector name that the enumeration method could call. State would\
    \ have to be passed in and out manually, usually through an opaque void pointer,\
    \ introducing additional code and splitting up the method somewhat. Declaring\
    \ a block inline means that the business logic is all in one place.\n\nWhen it\
    \ captures a variable of object type, a block implicitly retains it. It will be\
    \ released when the block itself is released. This leads to a point about blocks\
    \ that is important to understand. A block itself can be considered an object.\
    \ In fact, blocks respond to many selectors that other Objective-C objects do.\
    \ Most important to understand"
  merge: -1
