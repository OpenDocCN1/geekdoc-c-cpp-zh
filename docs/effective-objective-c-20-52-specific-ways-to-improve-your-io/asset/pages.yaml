  md: "# Item 30: Use ARC to Make Reference Counting Easier\n\nBut ARC does in fact\
    \ contain runtime behavior to detect the situa-tion of extraneous autorelease\
    \ plus immediate retain. It does this through a special function that is run when\
    \ an object is returned autoreleased. Instead of a plain call to the object's\
    \ autorelease method, it calls objc_autoreleaseReturnValue. This function inspects\
    \ the code that is going to be run immediately after returning from the current\
    \ method. If it is detected that this is going to be a retain of the returned\
    \ object, a flag is set within a global data structure (pro-cessor dependent)\
    \ instead of performing the autorelease. Similarly, the calling code that retains\
    \ an autoreleased object returned from a method uses a function called objc_retainAutoreleaseReturnValue\
    \ instead of calling retain directly. This function checks the flag and, if it\
    \ doesn't perform retain. This extra work to set and check flags is faster than\
    \ performing autorelease and retain.\n\nThe following code illustrates this optimization\
    \ by showing how ARC uses these special functions:\n\n```\n// Within EOCPerson\
    \ Class\n// (EOCPerson*)personWithName:(NSString*) name {\n    EOCPerson *person\
    \ = [[EOCPerson alloc] init];\n    person.name = name;\n    objc_autoreleaseReturnValue(person);\n\
    }\n```\n\n```\n// Using EOCPerson class\nEOCPerson *tmp = [EOCPerson personWithName:@\"\
    Matt Galloway\\];\nmyPerson = objc_retainAutoreleaseReturnValue(tmp);\n```\n\n\
    These special functions have processor-specific implementations to make use of\
    \ the most optimal solution. The following pseudocode implementations explain\
    \ what happens:\n\n```\nid objc_retainAutoreleasedReturnValue(id object) {\n \
    \   if (/* caller will retain object */) {\n        set_flag(object);\n      \
    \  return object; ///// No autorelease\n    } else {\n        return [object autorelease];\n\
    \    }\n}\n```\n\n```\nid objc_retainAutoreleasedReturnValue(id object) {\n  \
    \  if (get_flag(object)) {\n        clear_flag(object);\n        return object;\
    \ /////< No retain\n```"
