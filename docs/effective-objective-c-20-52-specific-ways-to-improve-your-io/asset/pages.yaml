  md: '# Item 22: Understand the NSCopying Protocol


    ![](img/72498492af77d8c75e17783675fe4432_132_0.png)


    **Figure 3.2** Shallow versus deep copy. The contents of a shallow copy point
    to the same objects as the original. The contents of a deep copy point to copies
    of the original contents.


    You could introspect (see Item 14) to determine what type of instance you have,
    but that would add complexity everywhere a copy is taken. So you would end up
    always using immutableCopy or mutableCopy to be on the safe side, in which case
    it''s back to having just copy and mutableCopy, which is exactly the same as having
    only copy and mutableCopy. The benefit of calling it copy instead of immutableCopy
    is that NSCopying is designed not only for classes with mutable and immutable
    variants but also for cases where there is not the distinction, so immutableCopy
    would be a badly named method.


    Another decision to make with your copying method is whether to perform a deep
    or a shallow copy. Deep copy copies all the backing data as well. Copying by default
    for all the collection classes in Foundation is shallow, meaning that only the
    container is copied, not the data stored within the container. This is mainly
    because objects within the container might not be able to be copied; also, it''s
    usually undesirable to copy every object. The difference between a deep and shallow
    copy is illustrated in Figure 3.2.


    Usually, you will want your classes to follow the same pattern as used in the
    system frameworks, with copyWithZone: performing a shallow copy. But if required,
    this method can be added to perform a deep copy. In the case of NSSet, this is
    provided through the following initializer method:


    +   - (id)initWithSet:(NSArray*)array copyItems:(BOOL)copyItems'
