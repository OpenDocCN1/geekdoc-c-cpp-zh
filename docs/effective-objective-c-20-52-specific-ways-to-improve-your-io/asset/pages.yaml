- pgno: 282
  md: '# Item 52: Remember that NSTimer Retains Its Target


    With this pattern, if the instance of ObjClass has its last reference to it from
    outside released, it will be deallocated. The invalidation of the timer during
    deallocation (check back to the original example) ensures that the timer will
    no longer run again. Using a weak reference ensures more safety; if the timer
    does run again for any reason, perhaps because you have forgotten to invalidate
    it during deallocation, weakSelf will be nil once in the block.


    # Things to Remember


    +   NSTimer object retains its target until the timer is invalidated either because
    it fires or through an explicit call to invalidate.


    +   Retain cycles are easy to introduce through the use of repeating timers and
    do so if the target of a timer retains the timer. This may happen directly or
    indirectly through other objects in the object graph.


    +   An extension to NSTimer to use blocks can be used to break the retain cycle.
    Until this is made part of the public NSTimer interface, the functionality must
    be added through a category.'
  merge: -1
  img_proc: true
