    However, these methods have become too constraining. For example, there is no
    method to perform a given selector that takes two arguments after a delay. The
    threading methods are not very generic, for the same reason. Code that wants to
    use of these methods often packs multiple arguments into a dictionary and unpacks
    in the called method, thereby adding overhead and the potential for bugs.


    All limitations are solved by one of the alternatives. The main alternative is
    using blocks (see item 37). Furthermore, using blocks with Grand Central Dispatch
    (GCD) enables you to achieve all the threading-related reasons for using one of
    the performSelector methods. Performing after a delay can be achieved with dispatch_after,
    and performing on another thread can be achieved with dispatch_sync and dispatch_async.


    For example, to perform a task after a delay, you should prefer the latter to
    the former:


    ```

    // Using performSelector:withObject:afterDelay:

    [self performSelector:@selector(doSomething)

    withObject:nil

    afterDelay:5.0];

    ```


    ```

    // Using dispatch_after

    dispatch_time_t time = dispatch_time(DISPATCH_TIME_NOW,

    (int64_t)(5.0 * NSEC_PER_SEC);

    dispatch_after(time, dispatch_get_main_queue(), ^{void{

    [self doSomething];});

    ```


    To perform a task on the main thread:


    ```

    // Using performSelectorOnMainThread:withObject:waitUntilDone:

    [self performSelectorOnMainThread:@selector(doSomething)

    withObject:nil

    waitUntilDone:NO];

    ```'
