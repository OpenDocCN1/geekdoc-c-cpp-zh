  md: '# Chapter 3: Interface and API Design


    even though it might be tempting to override copy, it''s copyWithZone:

    that needs to be implemented instead.


    To support copying, all you need to do is state that you implement the NSCopying
    protocol and implement the single method within it. For example, consider a class
    representing a person. In the interface definition, you would declare that you
    implement NSCopying:


    ```

    #import <Foundation/Foundation.h>

    ```


    ```

    @interface EOCPerson : NSObject <NSCopying>

    @property (nonatomic, copy, readonly) NSString *firstName;

    @property (nonatomic, copy, readonly) NSString *lastName;

    ```


    +   - (initWithFirstName:(NSString*)firstName

    andLastName:(NSString*)lastName;


    ```

    @end

    ```


    Then, you would implement the single required method of the protocol:


    +   - (copyWithZone:(NSZone*)zone {

    EOCPerson *copy = [[self class] allocWithZone:zone]

    initFirstName:_firstName

    andLastName:_lastName];


    return copy;

    }


    This example simply passes all work in initializing the copy to the designated
    initializer. Sometimes, you might need to perform further work on the copy, such
    as if other data structures within the class are not set up in the initializer:
    for example, if EOCPerson contained an array that was manipulated using a copy
    to befriend and unkind another EOCPerson. In that scenario, you''d also want to
    copy the array of friends. Following is a full example of how this would work:


    ```

    #import <Foundation/Foundation.h>

    ```


    ```

    @interface EOCPerson : NSObject <NSCopying>

    @property (nonatomic, copy, readonly) NSString *firstName;

    @property (nonatomic, copy, readonly) NSString *lastName;

    ```


    +   - (initWithFirstName:(NSString*)firstName

    andLastName:(NSString*)lastName;'
