    # Item 28: Use a Protocol to Provide Anonymous Objects


    Protocols define a set of methods that a conforming object should (or must if
    not optional) implement. They can therefore be used to hide implementation detail
    in your code''s API by returning objects that are typed as a plain id that conforms
    to a protocol. This way, the specific class name is not leaked in the API. This
    can be useful when you want to have many different classes behind the interface
    and don''t want to specify the full class. It might change, for example, or many
    different classes can be returned that don''t fit into a standard class hierarchy
    where you can supply the common base class as the type.


    This concept is often referred to as anonymous objects, which is not like the
    concept of anonymous objects in other languages. where it refers to the ability
    to create a class inline with no name. In Objective-C, this is not the case. In
    Item 23, where delegates and data sources are explained, the use of these anonymous
    objects can be seen. For example, a property definition for a delegate might look
    like like this:


    ```

    @property (nonatomic, weak) id <EOCDelegate> delegate;

    ```


    The type is id <EOCDelegate>, and the class of the object can therefore be absolutely
    anything; it doesn''t even have to derive from NSObject. It''s fine so long as
    it conforms to EOCDelegate. To the class that has this property, the delegate
    is anonymous. It could, if so desired, work out the class of the object at runtime
    (see Item 14). However, doing so would be seen as bad practice, since the contract
    dictated by the property type indicates that the class doesn''t matter.


    Another example of this concept in action is with NSDictionary. The standard memory-management
    semantics of the keys in a dictionary are that they are copied while the values
    are retained. In a mutable dictionary, therefore, the method signature to set
    a key-value pair is this:


    ```

    (void)setObject:(id)object forKey:(id<NSCopying>)key

    ```'
