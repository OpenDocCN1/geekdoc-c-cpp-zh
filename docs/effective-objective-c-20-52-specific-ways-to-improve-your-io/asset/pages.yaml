  md: '# Chapter 1: Accustoming Yourself to Objective-C


    @class EOCEmployee;

    This is called forward declaring the class. The resulting header file for EOCPerson
    would look like this:


    ```

    // EOCPerson.h

    #import <Foundation/Foundation.h>


    @class EOCEmployee;


    @interface EOCPerson : NSObject

    @property (nonatomic, copy) NSString *firstName;

    @property (nonatomic, copy) NSString *lastName;

    @property (nonatomic, strong) EOCEmployee *employee;

    @end

    ```


    The implementation file for EOCPerson would then need to import the header file
    of EOCEmployee, as it would need to know the full interface details of the class
    in order to use it. So the implementation file would end up looking like this:


    ```

    // EOCPerson.m

    #import "EOCPerson.h"

    #import "EOCEmployee.h"


    @implementation EOCPerson

    // Implementation of methods

    @end

    ```


    Deferring the import to where it is required enables you to limit the scope of
    what a consumer of your class needs to import. In the example, if EOCEmployee.h
    were imported in EOCPerson.h, anything importing EOCPerson.h would also import
    all of EOCEmployee.h. If the chain of importing continues, you could end up importing
    a lot more than you bargained for, which will certainly increase compile time.


    Using forward declaration alleviates the problem of both classes referring to
    each other. Consider what would happen if EOCEmployee had methods to add and remove
    employees, defined in this header file:


    +   - (void)addEmployee:(EOCEmployee*)person;

    - (void)removeEmployee:(EOCEmployee*)person;


    This time, the EOCPerson class needs to be visible to the compiler, for the same
    reasons as in the opposite case. However, achieving this by importing the other
    header in each header would create a chicken-and-egg situation. When one header
    is parsed, it imports the other.'
