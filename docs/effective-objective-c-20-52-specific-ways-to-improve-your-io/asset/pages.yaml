  md: "with such methods as retain, release, and autorelease. Even though this method\
    \ is officially deprecated, it is often misunderstood, and its use should be avoided.\
    \ If you are not using ARC, which you really should be, it's still possible to\
    \ use this method without getting a compiler error. So it is still important to\
    \ understand why this method is to be avoided.\n\nIt may seem as though this method\
    \ does a reasonable and useful job. It returns the retain count, after all, which\
    \ is clearly an important piece of information about every object. The problem\
    \ is, though, that the absolute retain count is often completely irrelevant and\
    \ not what you need to know. Even if you use this method only for debug purposes,\
    \ it's usually not at all helpful.\n\nThe first reason this method is not useful\
    \ is that its value is the retain count at a given time. This value does not include\
    \ any decrements that are going to happen during a subsequent autorelease pool\
    \ drain (see Item 34), the value is not necessarily a true representation of the\
    \ count. Therefore, the following code is very bad:\n\n```\nwhile ([object retainCount])\
    \ {\n  [object release];\n}\n```\n\nThe first reason this code is wrong is that\
    \ it will keep dropping the retain count until the object is deallocated, without\
    \ regard for any autoreleases that may be pending. If the object was also in an\
    \ autorelease pool at the time, when pool is drained, the object is further released,\
    \ and a crash will certainly occur.\n\nSecond, the code is dangerous because retainCount\
    \ will never return 0: an optimization within the release behavior of objects\
    \ means an object is deallocated when it is released if its retain count is 1.\
    \ Otherwise, the decrement happens. The retain count should never officially reach\
    \ 0. Unfortunately, this code sometimes works, largely through sheer luck rather\
    \ than judgment. Modern runtimes usually simply crash when the while loop iterates\
    \ after the object was eventually deallocated.\n\nSuch code could never be necessary.\
    \ Memory management should be done before this code ever need to be implemented.\
    \ There should never be unbalanced retains leaving objects with a positive retain\
    \ count when you thought they should be deallocated. In such a scenario, the problem\
    \ should be diagnosed by working out what is still retaining the object and why\
    \ it hasn't released it.\n\nYou may also try to use the retain count and wonder\
    \ why the value sometimes looks very large. For example, consider the following\
    \ code:"
