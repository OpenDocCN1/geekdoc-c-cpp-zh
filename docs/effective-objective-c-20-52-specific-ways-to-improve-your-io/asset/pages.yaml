  md: '# Chapter 3: Interface and API Design


    Another method to be aware of, also part of the NSObject protocol. is debugDescription,
    whose purpose is very similar to description. The difference is that debugDescription
    is the method called when you invoke the print-object command within the debugger.
    The default implementation within the NSObject class simply calls directly through
    description. For example, taking the EOCPerson class, running an application in
    the debugger (LLDB in this), and pausing at a breakpoint just after creating an
    instance like this:


    ```

    EOCPerson *person = [[EOCPerson alloc]

    initWithFirstName:@"Bob"

    lastName:@"Smith"];

    ```


    NSLog("@person = %@", person);

    // Breakpoint

    When the debug has been hit, the debug console will be to receive input. The command
    po LLDB will perform the print-object function, yielding the following:


    ```

    OCTest([640:c07] person = <EOCPerson: 0x712a4d0, "Bob Smith">

    (lld) po person

    (EOCPerson*) $1 = 0x0712a4d0 <EOCPerson: 0x712a4d0, "Bob Smith">

    ```


    Note that the (EOCPerson*) $1 = 0x712a4d0 is added by the debugger. The portion
    after that is what is returned from the debug-description method.


    You may decide to make the normal description of EOCPerson to be the person''s
    name and implement the debug-description method to provide the more thorough description.
    In that case, the two methods would look like this:


    ```

    (NSString*)description {

    return [NSString stringWithFormat:@"%@ %@",

    _firstName, _lastName];

    }

    ```


    ```

    (NSString*)debugDescription {

    return [NSString stringWithFormat:@"<%p, \@ %@@",

    [self class], self, _firstName, _lastName];

    }

    ```


    This time, running the same code as previously and using the print-object command
    will yield the following:

    OCTest([640:c07] person = Bob Smith

    (lld) po person

    (EOCPerson*) $1 = 0x07117fb0 <EOCPerson: 0x07117fb0, "Bob Smith">'
