    # Things to Remember


    +   * Consider NSCache in the place of NSDictionary objects being used as caches.
    Caches provide optimal pruning behavior, thread safety, and don''t copy keys,
    unlike a dictionary.


    +   * Use the count and cost limits to manipulate the metrics that define when
    objects are pruned from the cache. But never rely on those metrics to be hard
    limits; they are pure guidance for the cache.


    +   * NSPurgeableData objects with a cache to provide autopurging data that is
    also automatically removed from the cache when purged.


    +   * Caches will make your applications more responsive if used correctly. Cache
    only data that is expensive to recalculate, such as data that needs to be fetched
    from the network or read from disk.


    # Item 51: Keep initialize and load Implementations Lean


    Sometimes, a class needs to perform some initialization before it can be used
    successfully. In Objective-C, objects inheriting from the NSObject root class,
    which is the vast majority of classes, have a couple of methods available to them
    to perform this task.


    The first of these methods is called load, and its prototype is as follows:


    +   * (void)load


    It is called once and only once for every class and category that is added to
    the runtime. This happens when the library containing the class or category is
    loaded, generally at application launch, and it is certainly the case for any
    code written for iOS. Mac OS X applications are generally freer to use features
    such as dynamic loading, and it''s therefore possible that a library will be loaded
    after application launch. The load method for a category is always called after
    the class that the category is on.'
