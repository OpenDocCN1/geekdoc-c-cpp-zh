    \ consider the following code:\n\n```\n@interface EObjectClass : NSObject {\n\
    \    id _object;\n}\n```\n\n```\n@implementation EObjectClass\n- (void)setup {\n\
    \    _object = [EOOtherClass new];\n}\n@end\n```\n\n_object instance variable\
    \ does not automatically retain its value under manual reference counting but\
