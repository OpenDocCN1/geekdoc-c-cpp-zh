  md: "# Item 31: Release References and Clean Up Observation Only in dealloc\n\n\
    An object going through its life cycle eventually ends up being deallocated, which\
    \ is where the dealloc method enters. It is called exactly once during the life\
    \ cycle of an object when its retain count drops to zero. When exactly it gets\
    \ called is not guaranteed, though. Also, you may think that you know when it's\
    \ going to be called from manually seeing where retains and releases are. But\
    \ in practice, any library could be manipulating the object without your knowing,\
    \ causing deallocation to happen at another time. The runtime will call it at\
    \ exactly the right time for you. Also, after dealloc has been called on an object,\
    \ that object is no longer valid, and subsequent method calls are invalid.\n\n\
    So what should you do in dealloc then? The main thing to do is to release any\
    \ references that the object owns. This means releasing any Objective-C objects,\
    \ which ARC automatically adds for you into the dealloc method, through the .cxx_destruct\
    \ automatic method (see Item 30). Any non-Objective-C objects that the object\
    \ owns need releasing. For instance, CoreFoundation objects need to be explicitly\
    \ released, since they are C APIs.\n\nAnother useful thing to do in a dealloc\
    \ method is to clean up any observation behavior that has been set up. If NSCenter\
    \ has been used to register for certain notifications, this is a good place to\
    \ unregister for notifications so that they are not attempted to be sent to a\
    \ deallocated object, which would certainly cause an application to crash.\n\n\
    A dealloc method looks like this:\n\n```\n(void)dealloc {\n  CFRelease(coreFoundationObject);\n\
    \  [NSNotificationCenter defaultCenter] removeObserver:self];\n}\n```\n\nNote\
    \ that when using manual reference counting than ARC, [super dealloc] should be\
    \ the last thing you do. ARC automatically enforces this, which is another reason\
    \ why it is a lot easier and safer to use than manual reference counting. With\
    \ manual reference counting, you would also have to manually release every Objective-C\
    \ object owned by the object.\n\nThat said, you should certainly not free resources\
    \ that are potentially expensive or scarce within the system. Such resources are\
    \ file descriptors, sockets, or large blocks of memory. The dealloc method"
