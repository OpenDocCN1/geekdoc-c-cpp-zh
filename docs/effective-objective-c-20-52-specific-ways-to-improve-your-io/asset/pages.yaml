- pgno: 134
  md: '# # 4 Protocols and Categories


    Protocols are a language feature similar to interfaces in Java. Objective-C does
    not have multiple inheritance, so protocols provide a way to define a set of methods
    that a class should implement. Protocols are most often used in implementing the
    Delegate pattern (see Item 23), but there are other uses as well. Getting to know
    them and using them can make code a lot more maintainable, as they are a good
    way of documenting an interface to your code.


    Categories too are an important language feature of Objective-C. They provide
    a mechanism for adding methods to a class without having to subclass it as you
    would have to in other languages. This feature is made possible by the highly
    dynamic nature of the runtime but also comes with pitfalls that you should understand
    before using categories.


    # ## Item 23: Use Delegate and Data Source Protocols for Interobject Communication


    Objects will often need to talk to each other and can do so in many ways. One
    such programming pattern used extensively by Objective-C developers is known as
    the Delegate pattern, the essence of which is to define an interface that any
    object can conform to in order to become the delegate of another object. This
    object then talks back to the delegate to get some information or to inform the
    delegate when interesting things happen.


    Using this pattern enables the decoupling of data from business logic. For instance,
    view in a user interface to display a list of data should be responsible only
    for the logic of how data is displayed, not for deciding what data should be displayed
    or what happens in data interaction. The view object can have properties that
    contain objects responsible for the data and event handling. These are known as
    the data source and delegate, respectively.'
  merge: -1
  img_proc: true
