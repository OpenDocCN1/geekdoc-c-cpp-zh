- pgno: 131
  md: '# Chapter 3: Interface and API Design


    An interesting question is raised by this example: Why is a copy taken of the
    _friends instance variable? You could have just as easily not taken a copy, and
    each object would then share the mutable set. But that would mean if a friend
    was added to the original object, it would also magically become a friend of the
    copy. That''s clearly not what you want in this scenario. But if the set were
    immutable, you might have chosen not to take a copy, since the set cannot change,
    anyway. This would save having two identical sets lying around in memory.


    You should generally use the designated initializer to initialize the copy, just
    as in this example. But you wouldn''t want to do this when the designated initializer
    has a side effect that you would want to happen to the copy, as setting up complex
    internal data structures that you are immediately going to overwrite.


    If you look back up to the copyWith:method, you will see that the friends set
    is copied using the mutableCopy method. This comes from another protocol, called
    NSMutableCopying. It is similar to NSCopying but defines the following method
    instead:


    +   - (id)mutableCopyWithZone:(NSZone*)zone


    The mutableCopy helper is just like the copy helper and calls the preceding method
    with the default zone. You should implement NSMutableCopy if you have mutable
    and immutable variants of your class. When using this pattern, you should not
    override copyWithZone: in your mutable class return a mutable copy. Instead, if
    a mutable copy is required of either an immutable or a mutable instance, you should
    use mutableCopy. Similarly, if an immutable copy is required, you should use copy.


    The following holds true in the case of NSArray and NSMutableArrayArray:


    +   - [MutableArray copy] => NSArray

    - [NSArray mutableCopy] => NSMutableArray


    Note the subtlety with calling copy on a mutable object and being given an instance
    of another class, the immutable variant. This is done so that it is easy to switch
    between mutable and immutable variants. Another way this could have been achieved
    is with three methods: copy, immutableCopy, and mutableCopy, where copy always
    returns the same class, however, this would not be good if you don''t know which
    instance you have is immutable. You might decide to call copy on something you
    have been returned as an NSArray in fact it''s an NSMutableArray. In that case,
    you would assume that you have an immutable array returned, but instead it is
    a mutable one.'
