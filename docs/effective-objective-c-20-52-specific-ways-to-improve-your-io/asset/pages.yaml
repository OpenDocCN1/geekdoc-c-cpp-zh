    The fact that ARC generates deallocation means that usually, a

    dealloc method is not required. This often considerably reduces the

    size of a project''s source code and helps reduce boilerplate code.


    # Overriding the Memory-Management Methods


    Before ARC, it was possible to override the memory-management

    methods. For example, a singleton implementation often override

    lease to be a no-op, as a singleton cannot be released. This is now

    legful under ARC because doing so could interfere with ARC''s under-

    standing of an object''s lifetime. Because the methods are ile-

    gal call and override, ARC makes the optimization of not going

    through an Objective-C message dispatch (see item 11) when it needs

    to perform a retain, release, or autorelease. Instead, the optimization

    is implemented with C functions deep in the runtime. This is able to do optimizations
    such as the one described earlier

    when returning an autoreleased object that is immediately retained.


    # Things to Remember


    +   * Automatic Reference Counting (ARC) frees the developer from hav-

    ing to worry about most memory management. Using ARC reduces

    bilerplate code from classes.

    * ARC handles the object life cycle almost entirely by adding in retains

    and releases as it sees appropriate. Variable qualifiers can be used

    to indicate memory-management semantics: previously, retains and

    releases were manually arranged.

    * Method names have always been used to indicate memory-management

    semantics of returned objects. ARC has solidified these and made it

    impossible not to follow them.

    * ARC handles only Objective-C objects. In particular, this means

    that CoreFoundation objects are not handled, and the appropriate

    CFRetain/CFRelease calls must be applied.'
