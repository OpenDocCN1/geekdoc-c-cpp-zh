  md: "# Chapter 3: Interface and API Design\n\nare mutated. Therefore, I recommend\
    \ making objects only as mutable\nas they need to be.\n\nIn practice, this means\
    \ making properties only the data that needs to be exposed. For example, consider\
    \ a class to handle points of interest on a map where the data comes in from a\
    \ web service. You might start out with a class that looks like this:\n\n```\n\
    #import <Foundation/Foundation.h>\n\n@interface EOCPointOfInterest : NSObject\n\
    \n@property (nonatomic, copy) NSString *identifier;\n@property (nonatomic, copy)\
