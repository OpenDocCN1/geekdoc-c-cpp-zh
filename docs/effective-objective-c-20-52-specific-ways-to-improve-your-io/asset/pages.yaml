    This example should make it easy to see why it''s called the Delegate pattern,
    since the object is delegating responsibility for an action to another class.


    Protocols can also be used to provide an interface through which the data that
    a class requires is obtained. This other use of the Delegate pattern is referred
    to as the Data Source pattern because its aim is to provide data to the class.
    The flow of information is toward the class: with a normal delegate, the flow
    of information is away from the class. This flow is illustrated in Figure 4.3.


    For example, a list view object in a user interface framework might use a data
    source protocol to provide the data to show in the list. The list view may also
    have a delegate to handle user interaction with the list. The separation of the
    data source and delegate protocols provides a cleaner interface by separating
    distinct portions of logic. In addition, you could have one object be the data
    source and another be the delegate. However, the same object usually ends up being
    both.


    ![](img/72498492af77d8c75e17783675fe4432_139_0.png)


