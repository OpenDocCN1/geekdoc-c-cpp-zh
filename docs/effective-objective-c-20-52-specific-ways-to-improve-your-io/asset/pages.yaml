    \ the instructions. Consider now if that had been written like this:\n\n```\n\
    #import <stdio.h>\n\nvoid printHello() {\n    printf(\"Hello, world!\\n\");\n\
    }\nvoid printGoodbye() {\n    printf(\"Goodbye, world!\\n\");\n}\n```\n\n```\n\
