  md: 'category has been successfully loaded. Perhaps the method was of use historically,
    but it''s safe to say that any modern Objective-C code base does not need to be
    concerned with it.


    The other way to perform class initialization is by overriding the following-method:


    ```

    + (void)initialize

    ```


    This method is called on every class, once and only once, before the class is
    used. The method is called by the runtime and should never be invoked directly.
    It is similar to load but subtly different in a few ways. First, it is called
    lazily, meaning that it is called only before the class is used. Thus, a certain
    class''s initialize method will never be run if the class is never used. However,
    this means that there is no period when all implementations are run, unlike load,
    which blocks the application until all have finished.


    The second difference from load is that the runtime is in a normal state during
    execution and therefore it is safe to use and call any method on any class from
    a integrity point of view. Also, the runtime ensures that initialize is executed
    in a thread-safe environment, meaning that only the thread executing initialize
    is allowed to interact with the class or instances of the class. Other threads
    will block until initialize is completed.


    The final difference is that initialize is sent just like any other message; if
    a class doesn''t implement it but its superclass does, that implementation will
    be run. This might sound obvious, but it is often overlooked. Consider the following
    two classes:


    ```

    #import <Foundation/Foundation.h>

    ```


    ```

    @interface EOCBaseClass : NSObject

    @end

    ```


    ```

    @implementation EOCBaseClass

    +(void)initialize {

    NSLog(\("%@ at initialize", self);

    }

    @end

    ```


    ```

    @interface EOCSubClass : EOCBaseClass

    @end

    ```


    ```

    @implementation EOCSubClass

    @end

    ```'
