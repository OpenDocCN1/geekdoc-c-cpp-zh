    A CGRect is a C structure, defined like so:\n\n```\nstruct CGRect {\n    CGPoint\
    \ origin;\n    CGSize size;\n};\typedef struct CGRect CGRect;\n```\n\nThese types\
    \ of structures are used throughout the system frame-works, where the overhead\
    \ of using Objective-C objects could affect performance. Creating objects incurs\
    \ overhead that using structures does not, such as allocating and deallocating\
    \ heap memory. When nonempty types (int, float, double, char. etc.) are the only\
    \ data to be held, a structure, such as CGRect, is usually used.\n\nBefore embarking\
    \ on writing anything in Objective-C. I encourage you to read texts about the\
    \ C language and become familiar with the syntax. If you dive straight into Objective-C,\
    \ you may find certain parts of the syntax confusing.\n\n# Things to Remember\n\
    \n+   * Objective-C is a superset of C. adding object-oriented features. Objective-C\
    \ uses a messaging structure with dynamic binding, meaning that the type of an\
    \ object is discovered at runtime. The runtime, rather than the compiler, works\
    \ out what code to run for a given message.\n\n+   * Understanding the core concepts\
    \ of C will help you write effective Objective-C. In particular, you need to understand\
    \ the memory model and pointers.\n\n# Item 2: Minimize Importing Headers in Headers\n\
    \nObjective-C. just like C and C++, makes use of headers and implementation files.\
    \ When a class is written in Objective-C, the standard approach is to create one\
    \ of each of these files named after the class, suffixed with .h for the header\
    \ file and .m for the implementation file. When you create a class, it might end\
    \ up looking like this:\n\n```\n// EOCPerson.h\n#import <Foundation/Foundation.h>\n\
    \n@interface EOCPerson : NSObject\n@property (nonatomic, copy) NSString *firstName;\n\
    @property (nonatomic, copy) NSString *lastName;\n```"
