  md: '# Item 8: Understand Object Equality 41


    I explain why you should make objects immutable. This is a great

    example of such a reason.


    You can see this problem in action by testing with an NSMutableSet

    of a few NSMutableArrays. Start by adding one array to the set:


    ```

    NSMutableSet *set = [@NSMutableSet new];

    ```


    ```

    NSMutableArray *arrayA = [[@1, @2] mutableCopy];

    [set addObject:arrayA];

    NSLog("set = %@", set);

    // Output: set = {(1,2)}

    ```


    The set contains one object: an array with two objects in it. Now addnan array
    that contains equal objects in the same order, such that thenarray already in
    the set and the new one are equal:


    ```

    NSMutableArray *arrayB = [[@1, @2] mutableCopy];

    [set addObject:arrayB];

    NSLog("set = %@", set);

    // Output: set = {(1,2)}

    ```


    The set still contains just a single object, since the object added

    is equal to the object already there. Now we add to the set array

    that is not equal to the array already in the set:


    ```

    NSMutableArray *arrayC = [[@1, @2] mutableCopy];

    [set addObject:arrayC];

    NSLog("set = %@", set);

    // Output: set = {(1),(1,2)}

    ```


    As expected, the set now contains two arrays: the original one and

    t new one, since arrayC does not equal the one already in the set.

    Finally, we mutate arrayC to be equal to the other array already in the

    set:


    ```

    arrayC addObject:@2;

    NSLog("set = %@", set);

    // Output: set = {(1,2),(1,2)}

    ```


    Ah, dear now, two arrays in the set are equal to each other! A set

    is not meant to allow this, but it has been unable to maintain its

    semantics because we''ve mutated one of the objects that was already

    in the set. What''s even more awkward is if the set is then copied:


    ```

    NSSet *setB = [set copy];

    NSLog("setB = %@", setB);

    // Output: setB = {(1,2)}

    ```'
