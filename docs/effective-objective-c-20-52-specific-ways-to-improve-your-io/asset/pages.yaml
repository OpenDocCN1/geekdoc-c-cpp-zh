  md: "# Chapter 3: Interface and API Design\n\n+   * Avoid using abbreviations of\
    \ types in method names.\n\n+   * Most important, make sure that method names\
    \ are consistent with your own code or with that with which it is being integrated.\n\
    \n# ## Item 20: Prefix Private Method Names\n\nIt's extremely common for a class\
    \ to do much more than it appears on the outside. When writing a class implementation,\
    \ it is common to write methods that are used only internally. For such methods,\
    \ I suggest that you prefix their names with something. This helps with debugging\
    \ by clearly separating the public methods from the private ones.\n\nAnother reason\
    \ for using a marker for private methods arises when considering changing a method\
    \ name or signature. If the method is public, a change as this should be thought\
    \ about more carefully, since it might not be ideal to change the public API to\
    \ a class. Thus, consumers of the class would have update their code as well.\
    \ However, if the method is an internal one, only the class's own code would need\
    \ change. Using a marker to indicate private methods means that this distinction\
    \ is easy to see when making such a change.\n\nThe prefix to use depends on your\
    \ personal preference. Good choices of characters to include in a prefix are underscores\
    \ and the letter p. My preference is for the prefix to be p_, since the p indicates\
    \ \"private.\" and the underscore gives a visual gap before the start of the method\
    \ name. The method name then continues in the usual camel case, with a lowercase\
    \ first letter. For example, a class called EOCObject with private methods might\
    \ look like this:\n\n```\n@import <Foundation/Foundation.h>\n\n@interface EOCObject\
    \ : NSObject\n- (void)publicMethod;\n@end\n\n@implementation EOCObject\n- (void)publicMethod\
    \ {\n  /* ... */\n}\n- (void)p_privateMethod {\n  /* ... */\n}\n```"
