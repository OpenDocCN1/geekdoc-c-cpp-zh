  md: '# 2 Objects, Messaging, and the Runtime


    Objects are the building blocks of programming in an object-oriented language
    such as Objective-C, providing the means by which data is stored and moved around.
    Messaging is the process by which objects talk to each other to move data around
    and make things happen. A deep understanding of how both of these features work
    is crucial to building efficient and maintainable code.


    The Objective-C runtime is the code that powers the language once an application
    is running. The runtime provides the crucial functions that enable messaging between
    objects to work and all the logic behind how instances of classes are created.
    Understanding how this fits together makes you a better developer.


    # Item 6: Understand Properties


    Properties are an Objective-C feature providing encapsulation of the data an an
    object contains. Objects in Objective-C will usually contain a set of instance
    variables to store the data they need to work. Instance variables are usually
    accessed through accessor methods. A getter is used to read the variable, and
    a setter is used to write the variable. This was standardized and became part
    of the Objective-C 2.0 release through a feature called, properties, which allow
    the developer to tell the compiler to write accessor methods automatically. This
    feature introduced a new "dot syntax" to make accessing the data stored by classes
    less verbose. You have probably used properties already, but you may not know
    about all the options. Also, you may not be aware of some of the intricacies surrounding
    properties. Item 6 illustrates the background surrounding the problem solved by
    properties and points out their key features.


    A class to describe a person might store the person''s name, date of birth, address,
    and so on. You can declare instance variables in the public interface for a class
    as follows:'
