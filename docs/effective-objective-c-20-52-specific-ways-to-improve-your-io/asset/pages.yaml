- pgno: 20
  md: '# 1


    # Accustoming Yourself to Objective-C


    Objective-C brings object-oriented features to C through an entirely new syntax.
    Often described as verbose, Objective-C syntax makes use of a lot of square brackets
    and isn''t shy about using extremely long method names. The resulting source code
    is very readable but is often difficult for C++ or Java developers to master.


    Writing Objective-C can be learned quickly but has many intricacies to be aware
    of and features that are often overlooked. Similarly, some features are abused
    or not fully understood, yielding code that is difficult to maintain or to debug.
    This chapter covers fundamental topics; subsequent chapters cover specific areas
    of the language and associated frameworks.


    # Item 1: Familiarize Yourself with Objective-C’s Roots


    Objective-C is similar to other object-oriented languages, such as C++ and Java,
    but also differs in many ways. If you have experience in another object-oriented
    language, you''ll understand many of the paradigms and patterns used. However,
    the syntax may appear alien because it uses a messaging structure rather than
    function calling. Objective-C evolved from Smalltalk, the origin of messaging.
    The difference between messaging and function calling looks like this:


    ```

    // Messaging (Objective-C)

    Object *obj = [Object new];

    [obj performWith:parameter1 and:parameter2];

    ```


    ```

    // Function calling (C++)

    Object *obj = new Object;

    obj->perform(parameter1, parameter2);

    ```


    The key difference is that in the messaging structure, the runtime decides which
    code gets executed. With function calling, the compiler'
  merge: -1
  img_proc: true
- pgno: 21
  md: "# Chapter 1: Accustoming Yourself to Objective-C\n\ndecides which code will\
    \ be executed. When polymorphism is intro-duced to the function-calling example,\
    \ a form of runtime lookup is involved through what is known as a virtual table.\
    \ With messaging, the lookup is always at runtime. In fact, the compiler doesn't\
    \ care about the type of the object being messaged. It is looked up at runtime\
    \ as well, through a process known as dynamic binding, cov-ered in more detail\
    \ in item 11.\n\nThe Objective-C runtime component, rather than the compiler,\
    \ does most of the heavy lifting. The runtime contains all the data structures\
    \ and functions that are required for the object-oriented features of Objective-C\
    \ to work. For example, the runtime includes all the memory-management methods.\
    \ Essentially, the runtime is the set of code that glues together your code and\
    \ in the form of a dynamic library to your code is linked. Thus, whenever the\
    \ runtime is updated, your application benefits from the performance improvements.\
    \ A language that does more work at compile time needs to be recompiled to benefit\
    \ from such performance improvements.\n\nObjective-C is a superset of C, so all\
    \ the features in the C language are available when writing Objective-C. Therefore,\
    \ to write effective Objective-C, you need to understand the core concepts of\
    \ both C and Objective-C. In particular, understanding the memory model of C and\
    \ why reference counting works why it does. This involves understanding that a\
    \ pointer is used to denote an object in Objective-C. When you declare a variable\
    \ that is to hold a reference to an object, the syntax looks like this:\n\nThis\
    \ syntax, mostly lifted straight from C, declares a variable called someString\
    \ whose type is NSString. This means that it is a pointer to an NSString. All\
    \ Objective-C objects must be declared in this way because the memory for objects\
    \ is always allocated in heap space and never on the stack. It is illegal to declare\
    \ a stack-allocated Objective-C object:\n\n```\nNSString *stackString;\n\t\t\t\
    // error: interface type cannot be statically allocated\n```\n\nThe someString\
    \ variable points to some memory, allocated in the heap, containing an NSString\
    \ object. This means that creating another variable pointing to the same location\
    \ does not create a copy but rather yields two variables pointing to the same\
    \ object:\n\n```\nNSString *someString = \"@String\";\n\t\t\tNSString *anotherString\
    \ = someString;\n```"
