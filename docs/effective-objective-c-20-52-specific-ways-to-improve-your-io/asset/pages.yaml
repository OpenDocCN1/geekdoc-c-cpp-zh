    # ## Item 50: Use NSCache Instead of NSDictionary for Caches


    A common problem encountered when developing a Mac OS X or an iOS application
    that downloads images from the Internet is deciding what to do about caching them.
    A good first approach is to use a dictionary to store in memory images that have
    been downloaded, so they don''t need to be downloaded again if they are requested
    later. A naive developer will simply use an NSDictionary (or rather a mutable
    one) because that''s commonly used class. However, an even better class, NSCache,
    is also part of the Foundation framework and has been designed exactly for this
    task.


    The benefit of NSCache over NSDictionary is that as system memory becomes full,
    the cache is automatically pruned. When using a dictionary, you often end up having
    to write pruning code yourself by hooking into system notifications for low memory.
    However, NSCache offers this automatically; because it is part of the Foundation
    framework, it will be able to hook deeper into the system than you could yourself.
    Working with the code to prune this yourself with a dictionary would be quite
    complex.


    Also, NSCache does not copy keys but rather retains them. This is something that
    can be controlled on NSDictionary but requires more complex code (see Item 49).
    A cache usually would not copy the keys because often, the key will be an object
    that does not support copying. Since NSCache doesn''t copy keys by default, it
