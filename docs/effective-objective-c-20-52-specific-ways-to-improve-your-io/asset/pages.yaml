    The preceding stands only for certain messages. Additional functions are exposed
    by the Objective-C runtime to handle certain edge cases:


    +   * objc_msgSend_stret


    For sending messages that return a struct. This function can handle only messages
    that return a type that fits into CPU registers. If the return type doesn''t fit—if
    a struct is returned—another function is called to perform the dispatch. In this
    case, another function is called to handle returning the struct via a stack-allocated
    variable.


    +   * objc_msgSend_fpret


    For sending messages that return floating-point values. Some architectures require
    special handling of floating-point registers across function calls, meaning the
    standard objc_msgSend is not good enough. This function exists to handle such
    slightly odd cases that crop up for such architectures as x86.


    +   * objc_msgSendSuper


    For sending messages to the superclass, such as [super message:parameter]. There
    are also equivalents of objc_msgSend_stret and objc_msgSend_fpret for calling
    such a function.


    I alluded earlier to the fact that objc_msgSend and friends "jump to" the correct
    method implementation once it has been looked up. The way this works is that every
    method of an Objective-C object can be thought of as a simple C function, whose
