    # How Reference Counting Works


    Under reference-counting architectures, an object is assigned a counter to indicate
    how many things have an interest in keeping that alive. This is referred to as
    the retain count in Objective-C but can also be referred to as the reference count.
    The following three methods declared on the NSObject protocol can manipulate that
    counter to either Increment or decrement it:


    +   * retain Increment the retain count.


    +   * release Decrement the retain count later, when the autorelease pool is drained.
    (The autorelease pool is discussed further on page 150 and in Item 34.)


    A method to inspect the retain count, called retainCount, is generally not very
    useful, even when debugging, so I (and Apple) encourage you not to use it. See
    Item 36 for more information.


    An object is always created with a retain count of at least 1. Interest in keeping
    the object alive is indicated by invoking the retain method. When that has gone
    the object is no longer required by a certain portion of code, release or autorelease
    is called. When the retain count finally reaches 0, the object is deallocated,
    meaning that its memory is marked for reuse. Once this has happened, any references
    to that object are no longer valid.


    Figure 5.1 illustrates an object going through a retain, and then two releases.


    Many objects will be created throughout an application''s life cycle. These objects
    all become related to one another. For example, an object representing a person
    has a reference to string objects for the person''s name and might also have references
    to other person objects, such as in a set representing the friends of the person,
    thereby forming is known as an object graph. Objects are said to owe other objects
    if they hold a strong reference to them. This means that they have registered
    their interest in keeping them alive by retaining them. When they are finished
    with them, they release them.


    In the Figure 5.2 object graph, ObjectA is being referenced by both ObjectB and
    ObjectC. When both ObjectB and ObjectC have finished with ObjectA, its retain
    count drops to 0 and it can be destroyed. Both ObjectB and ObjectC are being kept
    alive by other objects, which in'
