    @selector(networkFetcher:didReceivedData:)) {

    [delegate networkFetcher:self didReceivedData:data];

    }

    ```


    The respondsTo method is used to determine whether the delegate has implemented
    that. If yes, it''s called; otherwise, nothing happens. In that way, the delegate
    method is truly optional, and nothing will break if it''s not implemented. If
    no delegate is set, it will still function perfectly well, since sending a message
    to nil will make the statement evaluate to false.


    Getting the name of your delegate methods correct is also important. The name
    should indicate exactly what is happening and why the delegate is being told something.
    In the example, the delegate method reads very clearly, saying that a certain
    network fetcher object has just received some data. You should always pass the
    instance that is delegating, just as in the example, so that the delegate method
    implementation can switch based on the specific instance. For example:


    ```

    (void)networkFetcher:(EOCNetworkFetcher*)fetcher

    didReceivedData:(NSData*)data

    if (fetcher == _myFetcherA) {

    /* Handle data */

    } else if (fetcher == _myFetcherB) {

    /* Handle data */

    }

    ```


    Here, the object being the delegate has two network fetchers and so must be told
    which network fetcher is telling it that data has been received. Without being
    told this information, the object would be able to use only one network fetcher
    at a time, which would not be ideal.


    The delegate methods can also be used to obtain information from the delegate.
