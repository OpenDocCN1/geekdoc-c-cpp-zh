  md: "Item 39: Use Handler Blocks to Reduce Code Separation\n\n# # Item 39: Use Handler\
    \ Blocks to Reduce Code Separation\n\nA common paradigm in programming a user\
    \ interface is to perform tasks asynchronously. In this way, the thread that services\
    \ user interface display and touches does not get blocked when long-running tasks\
    \ happen, as with I/O or network activity. This thread is often referred to as\
    \ the main thread. If such methods are synchronous, the user interface would be\
    \ unresponsive while the task was occurring. In some circumstances, an application\
    \ may be automatically terminated if it is unresponsive for a certain time. This\
    \ is true of iOS applications: the system watchdog will terminate an application\
    \ whose main thread is blocked for a certain period of time.\n\nAsynchronous methods\
    \ need a way to notify interested parties that they have finished. This can be\
    \ achieved in several ways. A commonly used technique is having a delegate protocol\
    \ (see Item 23) to which an object can conform. The object that the delegate can\
    \ be notified when pertinent things happen, such as completion of an asynchronous\
    \ task.\n\nConsider a class that fetches data from a URL. Using the Delegate pattern,\
    \ the class may look like this:\n\n```\n@import <Foundation/Foundation.h>\n\n\
    @class EOCNetworkFetcher;\n@protocol EOCNetworkFetcherDelegate <NSObject>\n  \
    \  -(void)networkFetcher:(EOCNetworkFetcher*)networkFetcher\n        didFinishWithData:(NSData*)data;\n\
    end\n```\n\n```\n@interface EOCNetworkFetcher : NSObject\n    @property (nonatomic,\
    \ weak)\n    id<EOCNetworkFetcherDelegate> delegate;\n    -(id)initWithURL:(NSURL*)url;\n\
    \    -(void)start;\n@end\n```\n\nA class might use this kind of API as follows:\n\
    \n```\n(void)fetchFooData {\n    NSURL *url = [[NSURL alloc] initWithWithString:@http://www.example.com/foo.data];\n\
    \    EOCNetworkFetcher *fetcher = \n        [[EOCNetworkFetcher alloc] initWithURL:url];\n\
    \    fetcher.delegate = self;\n```"
