    \ at all.\n\nIn order to make the EOCPointOfInterest class immutable, you would\
    \ add the readonly attribute to all the properties:\n\n```\n#import <Foundation/Foundation.h>\n\
    \n@interface EOCPointOfInterest : NSObject\n\n@property (nonatomic, copy, readonly)\
