    # Things to Remember


    +   * Enumerating collections can be achieved in four ways. For the loop is the
    most basic, followed by enumeration using NSEnumerator and fast enumeration. The
    most modern and advanced way is using the block-enumeration methods.


    +   * Block enumeration allows you to perform the enumeration concurrently, without
    any additional code, by making use of GCD. This cannot easily be achieved with
    the other enumeration techniques.


