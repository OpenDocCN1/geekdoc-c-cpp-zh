  md: '# 116 Chapter 4: Protocols and Categories


    In Objective-C, the usual way of achieving this pattern is to use the protocol
    language feature, which is used throughout the frameworks that make up Cocoa.
    If you use this feature yourself, you''ll find that your own code will fit appropriately.


    As an example, consider a class that is used to fetch data from the network. A
    class might do so to retrieve some data from a resource on a distant server. It
    might take a long time for the server to respond, and it would be bad practice
    to block while the data was being retrieved. So it''s common in this scenario
    to use the Delegate pattern, whereby the fetcher class has a delegate that it
    calls back once the data has been retrieved. Figure 4.1 illustrates this concept:
    the EOCDataModel object is the delegate of EOCNetworkFetcher. The EOCDataModel
    asks the EOCNetworkFetcher to perform a task asynchronously, and EOCNetworkFetcher
    tells its delegate, the EOCDataModel, when task has completed.


    ![](img/72498492af77d8c75e17783675fe4432_135_0.png)


    **Figure 4.1** A delegate callback. Note that the EOCDataModel instance doesn''t
    necessarily have to be the delegate but could be another object.'
