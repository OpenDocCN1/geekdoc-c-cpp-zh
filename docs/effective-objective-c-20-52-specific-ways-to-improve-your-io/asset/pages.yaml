  md: "# Chapter 6: Blocks and Grand Central Dispatch\n\n```\n+ (id)sharedInstance\
    \ {\n    static EOCClass *sharedInstance = nil;\n    static dispatch_once_t onceToken;\n\
    \    dispatch_once(&onceToken,^{n        sharedInstance = [[self alloc] init];\n\
    \    });\n    return sharedInstance;\n}\n```\n\ndispatch_once simplifies the code\
    \ and ensures thread safety entirely, you dont even have to think about locking\
    \ or synchronization. All that is handled in the depths of GCD. The token has\
    \ been declared static because it needs to be exactly the same token each time.\
    \ Defining the variable in static scope means that the compiler ensures that instead\
    \ of creating a new variable each time the sharedInstance method is run, only\
    \ a single variable is reused each time.\n\nFurthermore, dispatch_once is more\
    \ efficient. Instead of using a heavyweight synchronization mechanism, which acquires\
    \ a lock every time the code is run, it uses atomic access to the dispatch token\
    \ to indicate whether the code has been run. A simple benchmark on Mac OS X 10.8.2\
    \ machine, accessing the sharedInstance method using the @synchronized approach\
    \ versus the dispatch_once approach, showed an almost doubled speedup with dispatch_once.\n\
    \n# Things to Remember\n\n+   + Thread-safe single-code execution is a common\
    \ task. GCD provides an easy-to-use tool for this with the dispatch_once function.\n\
    \n+   + The token should be declared in static or global scope such that it is\
    \ the same token being passed in for each block that should be executed once.\n\
    \n# Item 46: Avoid dispatch_get_current_queue\n\nWhen using GCD and especially\
    \ when dispatching onto various queues, it is common to determine which queue\
    \ is currently being executed. For example, UI work in both Mac OS X and iOS needs\
    \ to be performed on the main thread, which equates to the main queue in GCD.\
    \ Sometimes, it is necessary to determine whether the current GCD code is executed\
    \ on the main queue. Reading through the documentation, you would come across\
    \ the following function:\n\n```\ndispatch_queue_t dispatch_get_current_queue();\n\
    ```"
