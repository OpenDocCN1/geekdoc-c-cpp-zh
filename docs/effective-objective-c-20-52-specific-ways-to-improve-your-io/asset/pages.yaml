    category. See Item 27 for more information.


    # Memory-Management Semantics


    Properties encapsulate data, and data needs to have concrete ownership semantics.
    This affects only the setter. For example, should the setter retain the new value
    or assign it to the underlying instance variable? When the compiler synthesizes
    the accessors, it uses these attributes to determine what code to write for you.
    If you create your own accessors, you must stick to what you specify for this
    attribute.


    +   - assign The setter is a simple assign operation used for scalar types, such
    as CGFloat or NSInteger.


    +   - strong This designates that the property defines an owning relationship.
    When a new value is set, it is first retained, the old value is released, and
    then the value is set.


    +   - weak This designates that the property defines a nonowning relationship.
    When a new value is set, it is not retained; nor is the old value released. This
    is similar to what assign does, but the value is also nilled out when the object
    pointed to by the property at any time is destroyed.


    +   - unsafe unretained This has the same semantics as assign but is used where
    the type is an object type to indicate a nonowning relationship (untained) that
    is not nil out (unsafe) when the target is destroyed, unlike weak.


    +   - copy This designates an owning relationship similar to strong; however,
    instead of retaining the value, it is copied. This is often used when the type
    is NSString* to preserve encapsulation, since the value passed into the setter
    might be an instance of the subclass NSMutableMutableString. If it''s this mutable
