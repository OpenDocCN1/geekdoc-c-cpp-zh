    static NSMutableArray *kSomeObjects = [NSMutableArray array new];\n```\n\nBear\
    \ these thoughts in mind if you find yourself writing a load or initialize method.\
    \ Keeping implementations lean can save hours of debugging. If you find yourself\
    \ wanting to do more than initialize global state, consider creating a method\
    \ that performs this, and mandate that consumers call it before they use the class.\
    \ Such examples be singleton classes that perform additional work when they are\
