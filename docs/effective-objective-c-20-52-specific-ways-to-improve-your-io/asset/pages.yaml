  md: '# Chapter 6: Blocks and Grand Central Dispatch


    Through the use of the NSBlockOperation or NSOperationQueue''s addOperationWithBlock:,
    the syntax of operation queues can look very similar to plain GCD. Here are some
    of the benefits of NSOperation and NSOperationQueue:


    +   + Cancelling operations


    With operation queues, this is simple. When run, the cancel method on NSOperation
    sets internal flags within the operation to tell it not to run, although it cannot
    cancel an operation that has already started. The other hand, GCD have no way
    of cancelling a block once it is scheduled. The architecture is very much "fire
    and forget.\ Implementing cancelling at the application level, would be possible
    but would require writing a lot of code that has already been written in the form
    of operations.


    +   + Operation dependencies


    An operation can have dependencies on as many other operations as it wishes. This
    enables you to create a hierarchy of operations dictating that certain operations
    can execute only after another operation has completed successfully. For example,
    you may have operations to download and process files from a server that requires
    a manifest file to be downloaded before others can be processed. The operation
    to download the manifest file first could be a dependency of the subsequent download
    operations. If the operation queue were set to allow concurrent execution, the
    subsequent downloads could execute in parallel but only after the dependent operation
    had completed.


    +   + Key-Value Observing of operation properties


    Operations have many properties that are appropriate for KVO, such asCancelled
    to determine whether it has been cancelled and isFinished to determine whether
    it has finished. Using KVO can be useful if you have code that wants to know when
    a certain task changes state and gives much finer-grained control than GCD over
    the tasks that are operating.


    +   + Operation priorities


    An operation has an associated priority that ranks it against other operations
    in a queue. Higher-priority operations are executed before lower-priority ones.
    The scheduling algorithm is opaque but most certainly will have been carefully
    thought out. GCD has no direct way of achieving the same thing. It does have priorities,
    but they set a priority for the entire queue rather than individual blocks. Writing
    your own scheduler on top of this is not'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# Item 43: Know When to Use GCD and When to Use Operation Queues 219


    something you really want to do. Priorities are therefore a useful feature of
    operations.


    Operations also have an associated thread priority, which determines at what priority
    the thread will execute when the operation runs. You could do this yourself with
    GCD, but operations make it as simple as setting a property.


    +   * Reuse of operations


    Unless you use one of the built-in concrete subclasses of NSOperation, such as
    NSBlockOperation, you must create your own subclass. This class, being a Objective-C
    object, can store whatever information you want. When it runs, it has full use
    of this information and any methods that have been defined on the class. This
    makes it much more powerful than a simple block that is queued on a dispatch queue.
    These operation classes can be reused throughout your code, thereby following
    the “Don’t Repeat Yourself” (DRY) principle of software development.


    As you can see, there are many good reasons to use operation queues over dispatch
    queues. Operation queues mostly provide instant solutions to many of the things
    you might want to do when executing tasks. Instead of writing complex schedulers,
    or cancel semantics or priorities yourself, you get them for free when using operation
    queues.


    One API that makes use of operation queues rather than dispatch queues is NSNotificationCenter,
    which has a method where you can register to observe a notification through a
    block instead of calling a selector. The method prototype looks like this:


    ```

    (id)addObserverName:(NSString*)name

    object:(id)object

    queue:(NSOperationQueue*)queue

    usingBlock:(void(^)(Notification*))block

    ```


    Instead of taking an operation queue, this method could have taken a dispatch
    queue on which to queue the notification-handler block. Clearly, the design decision
    was made to use one of the higher-level Objective-C API. In this case, there is
    little difference between the two in terms of efficiency. The decision was possibly
    made because using a dispatch queue would introduce an unnecessary dependency
    on GCD; remember that blocks are not GCD, so the block itself does not introduce
    this dependency. Or perhaps the developers wanted to keep it all in Objective-C.


    You will often hear that you should always use the highest-level API possible,
    dropping down only when truly necessary. I subscribe to this'
