- pgno: 12
  md: '# # Preface


    Objective-C is verbose. Objective-C is clunky. Objective-C is ugly. I have heard
    all these things said again about Objective-C. On the contrary, I find it elegant,
    flexible, and beautiful. However, to get it to be these things, you must understand
    not only the fundamentals but also the quirks, pitfalls, and intricacies: the
    topic of this book.


    # ## About This Book


    This book doesn''t teach you the syntax of Objective-C. It is assumed that you
    know this already. Instead, this book teaches you how to use the language to its
    full potential to write good code. Objective-C is extremely dynamic, thanks to
    having its roots in Smalltalk. Much of the work that''s usually done by a compiler
    in other languages ends up being done by the runtime in Objective-C. This leads
    to a potential for code to function fine during testing but to break in strange
    ways down the line in production, perhaps when processing invalid data. Avoiding
    these problems by writing good code in the first place is, of course, the best
    solution.


    Many of the topics are not, strictly speaking, related to core Objective-C. Reference
    is made to items found in system libraries, such as Grand Central Dispatch, which
    is part of libdispatch. Similarly, many classes from the Foundation framework
    are referred to, not least the root class, NSObject, because developing with modern
    Objective-C means developing for Mac OS X or iOS. When developing for either,
    you will undoubtedly be using the system frameworks, collectively known as Cocoa
    and Touch, respectively.


    Since the release of iOS, developers have been flocking to join the ranks of Objective-C
    development. Some of these developers are new to programming, some have come from
    Java or C++ backgrounds, and some have come from web-development backgrounds.
    In any case, all developers should take the time to learn how to use a language
    effectively.'
  merge: -1
  img_proc: true
