- pgno: 213
  md: "# Block 38: Create typedefs for Common Block Types\n\nBlocks have an inherent\
    \ type; that is, they can be assigned to an appropriately typed variable. The\
    \ type is made up of the parameters the block takes along with and the return\
    \ type of the block. For example, consider the following block:\n\n```\n^(BOOL\
    \ flag, int value){\n  if (flag) {\n    return value * 5;\n  } else {\n    return\
    \ value * 10;\n  }\n}\n```\n\nThis block takes two parameters of type BOOL and\
    \ int and returns a value of type int. If it were to be assigned to a variable,\
    \ this block would need to be appropriately typed. The type and assignment to\
    \ the variable would look like this:\n\n```\nint (^variableName)(BOOL flag, int\
    \ value) =\n^(BOOL flag, int value){\n  // Implementation\n  return someInt;\n\
    }\n```\n\nThis looks quite different from a normal type but should look familiar\
    \ if you're used to function pointers. The layout of the type is as follows:\n\
    return_type^(block_name)(parameters)\n\nA block-variable definition is different\
    \ from other types in that the variable name is in the middle of the type rather\
    \ than on the right. This makes it difficult to remember the syntax and to read.\
    \ For these reasons, it is a good idea to make type definitions for commonly used\
    \ block types, especially if you are shipping an API that you expect others to\
    \ use. However, it is possible to hide block types like this behind a name that\
    \ is easy to read and indicates what the block is meant to.\n\nTo hide the complicated\
    \ block type, you use a language feature of C called type definitions. The keyword\
    \ typedef allows you to define an easy-to-read name that becomes an alias for\
    \ another type. For example, to define a new type for the block that returns an\
    \ int and takes two parameters—a BOOL and an int—you would use the following type\
    \ definition:\n\n```\ntypedef int^(AEOCsomeBlock)(BOOL flag, int value);\n```"
  merge: -1
  img_proc: true
- pgno: 214
  md: "# Item 38: Create typedefs for Common Block Types\n\nJust as the variable name\
    \ of a block is in the middle prefixed by the caret, so too is the new type name.\
    \ This adds a new type, called EOCSomeBlock, to the type system. Instead of creating\
    \ a variable with a complicated type, you can simply use this new type:\n\n```\n\
    EOCSomeBlock block = ^(BOOL flag, int value);\n// Implementation\n;\n```\n\nThis\
    \ code is now much easier to read, as the variable definition is back to the left\
    \ and the variable name on the right, just like you're used to seeing with other\
    \ variables.\nUsing this feature can also make APIs that use blocks much easier\
    \ to use. Any class that takes a block as a parameter to a method—example, a completion\
    \ handler for an asynchronous task—can make use of this feature to make it easier\
    \ to read. Consider, for example, a class that has a start method that takes a\
    \ block as a handler to be run when the task finishes. Without using of a type\
    \ definition, the method signature may look like this:\n\n+   - (void)startWithCompletionHandler:\n\
    \  void(^)(NSData *data, NSError *error)completion;\n\nNote that the syntax for\
    \ a block is laid out different again from that for defining a variable. It's\
    \ much easier to read if the type in the method signature is a single word. So\
    \ you can define a type definition and use that instead:\n\n```\ntypedef void\
    \ (^EOCCompletionHandler)\n  (NSData *data, NSError *error);\n-(void)startWithCompletionHandler:\n\
    \  (EOCCompletionHandler)completion;\n```\n\nThis is now much simpler to read\
    \ and understand what the parameter is. Any good, modern Integrated Development\
    \ Environment (IDE) will automatically expand the type definition, making this\
    \ easy to use.\nUsing a type definition is also useful if you ever need to refactor\
    \ to change the block's type signature. For example, if you decide that the completion\
    \ handler block now needs to take an additional parameter to pass the time task\
    \ took, you can simply change the type definition:\n\n```\ntypedef void (^EOCCompletionHandler)\n\
    \  (NSData *data, NSTimeInterval duration, NSError *error);\n```"
