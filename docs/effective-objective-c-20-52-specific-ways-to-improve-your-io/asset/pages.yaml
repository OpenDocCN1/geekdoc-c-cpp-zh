- pgno: 59
  md: "# Chapter 2: Objects, Messaging, and the Runtime\n\n```\n- (BOOL)isEqualTo:(id)object\
    \ {\n  if ([self class] == [object class]) {\n    return [self isEqualPerson:(EOCPerson*)object];\n\
    \  } else {\n    return [super isEqual:object];\n  }\n}\n```\n\n# Deep versus\
    \ Shallow Equality\n\nWhen you create an equality method, you need to decide whether\
    \ to check the whole object for equality or simply a few fields. NSArray checks\
    \ whether the two arrays being contain the same number of objects and if so, iterates\
    \ through them and calls isEqual: on each. If all objects are equal, the two arrays\
    \ are deemed to be equal, known as deep equality. Sometimes, however, if you know\
    \ that only a selection of the data determines equality, it is valid to not check\
    \ every bit of data for equality.\n\nFor example, using the EOCPerson class, if\
    \ instances had come from a database, they might have another property added with\
    \ a unique identifier used as the primary key in the database:\n\n@property NSString\
    \ identifier;\n\nIn such a scenario, you may decide to check only that the identifiers\
    \ match, especially if the properties were declared readonly externally such that\
    \ if two objects have the same identifier, they are indeed representing the same\
    \ object and are therefore equal. This would save on having to check through every\
    \ bit of data that the EOCObject contains when you can assert that if the identifiers\
    \ match, so must the rest of the data, since it came from the same data source.\n\
    \nWhether or not check all fields in your equality method depends entirely on\
    \ the object in question. You can only know what it means for two instances of\
    \ your object to be equal.\n\n# Equality of Mutable Classes in Containers\n\n\
    An important scenario to consider is when mutable classes are put into containers.\
    \ Once you add an object to a collection, its hash should not change. Earlier,\
    \ I explained how objects are binned according to their hash. If their hash changes\
    \ once in a bin, the objects would be in the wrong bin. To get around this problem,\
    \ you can either ensure that the hash is not dependent on the mutable portions\
    \ of the object or simply not mutate objects they are in collections. In Item\
    \ 18."
