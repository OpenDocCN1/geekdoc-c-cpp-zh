  md: '# Item 29: Understand Reference Counting


    In this case, str is returned with a +1 retain count, since the call to alloc
    returns with a +1 count, and there is no balancing release. The meaning of +1
    here is that you the caller are responsible for one retain. This does not mean
    that the retain count is exactly 1, however. It might be more, but that is implementation
    detail within the method initWithFormat:: All you need to worry about is balancing
    that one retain.


    However, you cannot release str inside the method, because it would then immediately
    deallocated before being returned. So an autorelease is used to indicate that
    the object should be released sometime later but guaranteed to be long enough
    in the future the returned value can be retained by the caller if it needs to
    hold onto it. In other words, the object is guaranteed to be alive across the
    method call boundary. In fact, the release will happen when the outermost autorelease
    pool is drained (see Item 34), unless you have your own autorelease pool, which
    will be next time the current thread''s event loop. Applying this to the stringValue
    method gives the following:


    ```

    (NSString*)stringValue {

    NSString *str = [[NSString alloc]

    WithFormat:@"I am this: %@", self];

    return [str autorelease];

    }

    ```


    Now the returned NSString object will definitely be alive when it is returned
    to the caller. So the object can be used like this:


    ```

    NSString *str = [self stringValue];

    NSLog(@"The string is: %@", str);

    ```


    No extra memory management is required here, since the str is returned autoreleased
    and therefore is balanced. Since the release from being in the autorelease pool
    won''t happen until next time around the event loop, the object does not need
    to be explicitly retained to be in the log statement. However, if the object needs
    to be held onto, such as set to an instance variable, the object needs to be retained
    and subsequently released:


    ```

    _instanceVariable = [[self stringValue] retain];

    // ...

    [_instanceVariable release];

    ```


    So autorelease is a way of extending the lifetime of an object enough so that
    it can survive across method call boundaries.'
