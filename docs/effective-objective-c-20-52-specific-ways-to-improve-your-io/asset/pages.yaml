    Crucially, the memory the object lives in is not freed (through a call to free());,
    the memory will not be available for use again. Although this is leaking memory,
    this is a debugging tool only and would never be turned on for production-running
    applications, so it doesn''t matter.


    But why create a new class for each class that is turned into a zombie? This is
    done so that the original class can be determined when a message is sent to a
    zombie. If all zombies were class _NSZombie_, the original class name would be
    lost. Creating a new class is done by using the runtime''s function objc_duplicateClass(),
    which copies the entire class and gives it a new name. The superclass, instance
    variables, and methods of the duplicate class will be identical to the one being
    copied. Another way to achieve the same goal of maintaining the old class name
    would be to create inheriting from _NSZombie rather than copying it. However,
    the functions to do this are less efficient than performing a direct copy.


    The zombie class comes into action within the forwarding routines (see Item 12).
    The _NSZombie_ class (and therefore all its copies) do not implement any methods.
    The class does not have a superclass and is therefore a root class, just like
