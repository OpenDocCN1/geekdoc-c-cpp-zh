    retains and releases with reference counting.


    Another reason for cleaning up resources in another cleanup method is that the
    dealloc method is in fact not guaranteed to be run for every created object. There
    is the edge case of objects that are still around when an application terminates.
    These objects do not receive the dealloc message. Instead, they are destroyed
    by the fact that a terminated application''s resources are returned to the operating
    system. It is an optimization not to call the dealloc method but this means that
    it is always called for every object. Mac OS X and iOS both have within their
    application delegates a method that is called on application termination. This
    method can be used to run any cleanup methods on objects that need to be cleaned
