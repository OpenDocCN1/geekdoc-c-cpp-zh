    # Item 16: Have a Designated Initializer


    All objects need to be initialized. When initializing an object, sometimes don''t
    need to give it any information, but often you do. This is usually the case if
    the object cannot perform its action without knowing this information. An example
    from UIKit, the iOS UI framework, UITableViewCell, which requires being told its
    style and an identifier to group cells of different types, reuse efficient cell
    objects that are expensive to create. The term given to the initializer that gives
    the object the required amount of information to perform its task is the "designated
    initializer."


    If there is more than one way to create an instance of a class, the class may
    have more than one initializer. This is perfectly fine, but there should still
    be just the designated initializer through which all other initializers call.
    An example of this is NSDate which has the following initializers:


    +   - (init)

    - (initWith:(NSString*)string)

    - (initWithTimeIntervalSinceNow:(NSTimeInterval)seconds)

    - (initWithWithTimeInterval:(NSTimeInterval)seconds)

    - (initWithWithDate:(Date*)refDate)

    - (initWithTimeIntervalSinceReferenceDate:(NSTimeInterval)seconds)

    - (initWithWithTimeIntervalSince1970:(NSTimeInterval)seconds)


    The designated initializer in this case is initWithTimeIntervalSinceReferenceDate:.
    as explained in the documentation for the class. This means that all the other
    initializers call through this initializer. The designated initializer is the
    only place where internal data is stored. If the underlying data store is changed
    for any reason, only one place needs to be changed.


    For example, consider a class that represents a rectangle. The interface would
    look like this:


    ```

    #import <Foundation.h>


    @interface ROCectObject : NSObject

    @property (nonatomic, assign, readonly) float width;

    ```'
