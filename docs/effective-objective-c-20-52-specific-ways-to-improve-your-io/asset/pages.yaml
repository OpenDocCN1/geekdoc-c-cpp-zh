    \n+   * Provide methods to mutate collections held by objects rather than exposing\
    \ a mutable collection as a property.\n\n# Item 19: Use Clear and Consistent Naming\n\
    \nThe naming of classes, methods, variables, and so on is an important factor\
    \ in Objective-C. Newcomers often consider the language verbose because it uses\
    \ a syntax structure that ensures the code can be read like a sentence. Names\
    \ often include prepositions (\"in,\" \"for,\" \"with,\" etc.), whereas other\
    \ languages consider their use as somewhat superfluous. For example, consider\
    \ the following section of code:\n\n```\nNSString *text = @\"The quick brown fox\
    \ jumped over the lazy dog\"\nNSString *newText = \n    [text stringReplacingOccurrencesOfString:@\"\
    fox\"\n    withString:@\"cat\"]\n```\n\nThis code could be considered a long-winded\
    \ way to write what seems such a simple expression. After all the method to perform\
    \ the replacement is 48 characters long. But this definitely reads just like a\
    \ sentence:\n\n> \"Take text and give me a new string by replacing the occurrences\
    \ of the string \"fox\" with the string \"cat\".\"\n\nThat sentence perfectly\
    \ describes what is going on. In languages that are less verbose, a similar procedure\
    \ might look like this:\n\n```\nstring text = \"The quick brown fox jumped over\
    \ the lazy dog\"\nstring newText = text.replace(\"fox\", \"cat\");\n```\n\nBut\
    \ in which order are the parameters to text.replace()? Will \"fox\" be replaced\
    \ by \"cat\" or vice versa? Also, does the replace function all occurrences or\
    \ just the first one? It's not very clear. The Objective-C way of naming, however,\
    \ is completely clear at the expense of more verbosity.\n\nYou will also notice\
    \ the use of camel casing—with a lowercase first letter—in method and variable\
    \ names. Also, class names are always camel cased with an uppercase first letter\
    \ and are also usually fixed with two or three letters (see Item 15). This is\
    \ the style commonly used throughout Objective-C code. You could use your own\
    \ style if you wished, but using camel case will ensure that your names fit and\
    \ feel right in the Objective-C world."
