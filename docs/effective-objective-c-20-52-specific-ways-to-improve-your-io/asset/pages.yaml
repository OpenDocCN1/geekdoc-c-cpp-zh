- pgno: 246
  md: "# Item 46: Avoid dispatch_get_current_queue\n\nThis is documented to return\
    \ the current queue that is being executed. That is exactly what the function\
    \ does, but it should be treated with caution. In fact, it is now officially deprecated\
    \ in iOS as of version 6.0. But it is not deprecated in Mac OS X as of version\
    \ 10.8. Nevertheless, it should be avoided on Mac OS X.\n\nA typical antipattern\
    \ that has become a common use of this method is to check the current queue against\
    \ a specific queue to try to work around a deadlock that can occur if dispatching\
    \ synchronously. Consider the following accessor methods, which use a queue to\
    \ synchronize access to an instance variable (see Item 41):\n\n```\n(NSString*)someString\
    \ {\n    block NSString *localSomeString;\n    dispatch_sync(_syncQueue, ^{\n\
    \        localSomeString = _someString;\n    });\n    return localSomeString;\n\
    }\n```\n\n```\n(void)setSome(NSString*)someString {\n    dispatch_async(_syncQueue,\
    \ ^{\n        _someString = someString;\n    });\n}\n```\n\nA problem you may\
    \ encounter with this pattern is a deadlock in the getter. if the getter is called\
    \ from the same queue as the queue used for synchronization (_syncQueue in the\
    \ example), because dispatch_sync won't return until the block has executed in.\
    \ But if the target queue for the block is the current queue, the block will never\
    \ get a chance to run, because dispatch_sync will continue to block, waiting for\
    \ the queue to become available to run the target block. This is an example of\
    \ a method that is not reentrant.\n\nHaving read the documentation for dispatch_get_current_queue,\
    \ you may think that it would be safe to make the method reentrant by checking\
    \ whether the current queue is the synchronization queue and, if so, simply execute\
    \ the block directly rather than dispatching, as follows:\n\n```\n(NSString*)someString\
    \ {\n    block NSString *localSomeString;\n    dispatch_block_t accessorBlock\
    \ = ^{\n        localSomeString = _someString;\n    }\n```"
  merge: -1
  img_proc: true
- pgno: 247
  md: "# Chapter 6: Blocks and Grand Central Dispatch\n\n```\nif (dispatch_get_current_queue()\
    \ == _syncQueue) {\n    accessorBlock();\n} else {\n    dispatch_sync(_syncQueue,\
    \ accessorBlock);\n}\n\nreturn localSomeString();\n```\n\nThis would probably\
    \ work for you under simple circumstances. However, it is dangerous and can still\
    \ deadlock. To see why, consider the following scenario with two serial dispatch\
    \ queues:\n\n```\ndispatch_queue_t queueA = create(\"com.effectiveobjective.queueA\"\
    , NULLndispatch_queue_t queueB = create(\"com.effectiveobjective.queueB\", NULL);\n\
    ```\n\n```\ndispatch_sync(queueA, ^{\n    dispatch_sync(queueB, ^{\n        dispatch_sync(queueA,\
    \ ^{\n            // Deadlock\n        });\n    });\n});\n```\n\nThis will always\
    \ deadlock at the inner dispatch onto _queueA because it will wait for the outer\
    \ dispatch_sync to finish, which itself won't finish until the inner dispatch_sync\
    \ finishes: hence deadlock. Now consider putting in the same check using dispatch_get_current_queue:\n\
    \n```\ndispatch_sync(queueA, ^{\n    dispatch_sync(queueB, ^{\n        dispatch_block_t\
    \ block = ^^{ /* */ };\n        if (dispatch_get_current_queue() == queueA) {\n\
    \            block();\n        } else {\n            dispatch_sync(queueA, block);\n\
    \        }\n    });\n});\n```\n\nHowever, this too will deadlock, since dispatch_get_current_queue\
    \ returns the current queue, which in the preceding example will be _queueB. So\
    \ the synchronous dispatch onto _queueA will still be done, resulting in deadlock,\
    \ just as before."
