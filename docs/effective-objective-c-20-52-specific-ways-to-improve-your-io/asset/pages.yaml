  md: '# Chapter 1: Accustoming Yourself to Objective-C


    # Things to Remember


    +   * Always import headers at the very deepest point possible. This means forward
    declaring classes in a header and importing their corresponding headers in an
    implementation. Doing so avoids coupling classes together as much as possible.


    +   * Sometimes, forward declaration is not possible, as when declaring protocol
    conformance. In such cases, consider moving the protocol-conformance declaration
    to the class-continuation category, if possible. Otherwise, import a header that
    defines only the protocol.


    # Item 3: Prefer Literal Syntax over the Equivalent Methods


    Using Objective-C, you will come across a few classes all the time. They are all
    part of the Foundation framework. Although technically, you do not have to use
    Foundation to write Objective-C code, you usually do in practice. The classes
    are NSString, NSNumber, NSArray, and NSDictionary. The data structures that each
    represent are self-explanatory.


    Objective-C is well known for having a verbose syntax. That''s true. However,
    ever since Objective-C 1.0, there has been a very simple way to create an NSString
    object. It is known as a string literal and looks like this:


    ```

    NSString *someString = @"Effective Objective-C 2.0";

    ```


    Without this type of syntax, creating an NSString object would require allocating
    and initializing an NSString object in the usual alloc and init method call. Fortunately,
    this syntax, known as literals, has been extended in recent versions of the compiler
    to cover NSNumber, NSArray, and NSDictionary instances as well. Using the literal
    syntax reduces code size and makes it much easier to read.


    # Literal Numbers


    Sometimes, you need to wrap an integer. Floating-point, or Boolean value in an
    Objective-C object. You can do this by using the NSNumber class, which can handle
    a range of number types. Without literals, you create an instance like this:


    ```

    NSNumber *someNumber = [NSNumber numberWithWithInt:1];

    ```


    This creates a number that is set to the integer 1. However, using literals makes
    this cleaner:


    ```

    NSNumber *someNumber = @1;

    ```'
