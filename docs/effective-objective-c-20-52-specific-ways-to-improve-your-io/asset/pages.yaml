    # Item 8: Understand Object Equality


    Being able to compare objects for equality is extremely useful. However, comparing
    the == operator is usually not what you want to do, since doing so compares the
    pointers themselves rather than the objects to which they point. Instead, you
    should use the isEqual declared within the NSObject protocol to check any two
    objects for equality. Usually, two objects of a different class are always determined
    to be unequal. Some objects also provide equality-checking methods that you can
    use if you already know the two objects you are checking are of the same class.
    Take, for example, the following code:


    ```

    NSString *foo = @

    ```


    Here, you can see the difference between == and using equality methods. NSString
    is an example of a class that implements its own equality-checking method, called
    isEqualToString:. The object passed to this method must be an NSString; otherwise,
    the results are undefined. This method is designed to be faster than calling isEqual:,
    which has to do extra steps because it doesn''t know the class of the object being
    compared.


    The two methods at the head of equality checking the NSObject protocol are as
    follows:


    +   - (BOOL)isEqual:(id)object;

    - (NSInteger)hash;'
