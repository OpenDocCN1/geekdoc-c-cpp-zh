- pgno: 323
  md: '# Programming/Objective-C


    # Effective

    OBJECTIVE-C 2.0


    # Write Truly Great iOS and OS X Code with Objective-C 2.0!


    **Effective Objective-C 2.0** will help you harness all of Objective-C''s expressive
    power to write OS X or iOS code that works superbly well in production environments.
    Using the concise, scenario-driven style pioneered in Scott Myers'' best-selling
    *Effective C++*, Matt Galloway brings 52 Objective-C best practices, tips, shortcuts,
    and realistic code examples that are available nowhere else.


    Through real-world examples, Galloway uncovers little-known Objective-C quirks,
    pitfalls, and intricacies that powerfully impact code behavior and performance.
    You''ll learn how to choose the most efficient and effective way to accomplish
    key tasks when multiple options exist, and how to write code that''s easier to
    understand, maintain, and improve. Galloway goes beyond the core language, helping
    you integrate and leverage Foundation framework classes and modern system libraries,
    such as Grand Central Dispatch.


    Coverage includes


    +   - Optimizing interactions and relationships between Objective-C objects

    - Mastering interface and API design: writing classes that feel "right at home"

    - Using protocols and categories to write maintainable, bug-resistant code

    - Avoiding memory leaks that can occur even with Automatic Reference Counting
    (ARC)

    - Writing modular, powerful code with Blocks and Grand Central Dispatch

    - Leveraging differences between Objective-C protocols and multiple inheritance
    in other languages

    - Improving code by more effectively using arrays, dictionaries, and sets

    - Uncovering surprising power in the Cocoa and Cocoa Touch frameworks


    > **Matt Galloway** is a software engineer and programming enthusiast specializing
    in mobile app development. He studied engineering at the University of Cambridge,
    England, and graduated in 2007 specializing in electrical and information sciences.
    He owns a consultancy, Swipe Stack Ltd., and answers questions about Objective-C,
    iOS, and Mac programming on Stack Overflow (stackoverflow.com).


