  md: 'may incorrectly assume that it has changed because of your code rather than
    from deep within another library. Take, for example, the following code:


    ```

    id object = [self createObject];

    [opaqueObject doSomething:object];

    NSLog("retainCount = %lu", [object retainCount]);

    ```


    What is the retain count? It could be anything. The call to doSomethingObject:
    may have added the object to multiple collections, retaining it in the process.
    Or the call may have retained the object multiple times and autoreleased multiple
    times, some of which are still pending an autorelease pool drain. The retain count
    is therefore unlikely to be useful to you.


    When can you use retainCount? The best answer: never, especially given that Apple
    has officially deprecated it when using ARC.


    # Things to Remember


    +   * The retain count of an object might seem useful but usually is not, because
    the absolute retain count at any given time does not give a complete picture of
    an object''s lifetime.


    +   * When ARC came along, the retainCount method was deprecated, and using it
    causes a compiler error to be emitted.'
