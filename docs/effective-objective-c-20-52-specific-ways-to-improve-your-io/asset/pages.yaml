  md: '# Chapter 5: Memory Management


    instances into a special zombie object rather than deallocating them. The core
    memory where the object is located is not made available for reuse; therefore,
    nothing will ever overwrite. When it receives any message, a zombie object throws
    an exception exactly what message was sent and what the object used to be when
    it was still alive. Using zombies is the best way to debug memory-management problems.


    The feature is turned on by setting the ZombieEnabled environment variable to
    YES. For example, if you are using bash and running an application on Mac OS X,
    you would do something like this:


    ```

    export NSZombieEnabled="YES"

    /app

    ```


    When a message is sent to a zombie, a message will be printed to the console,
    and the application will terminate. The message will look like this:


    > ***-[CF respondsToSelector:] message sent to deallocated instance 0x7ff9e90c8e0


    It is also possible to turn on the option in Xcode when the environment variable
    is automatically set when the application is run from within Xcode. To do this,
    you edit the application''s scheme, select the Run configuration, then the Diagnostics
    tab, and finally turn on Enable Zombie Objects. Figure 5.7 shows the dialog that
    you should see in Xcode, with the option to enable zombies turned on.


    ![](img/72498492af77d8c75e17783675fe4432_197_0.png)


