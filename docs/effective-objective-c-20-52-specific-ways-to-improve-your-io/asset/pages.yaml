  md: "# Item 21: Understand the Objective-C Error Model\n\nThe first thing to note\
    \ is that Automatic Reference Counting (ARC, see Item 30) is not exception by\
    \ default. In practice, this means that any objects that should be released at\
    \ the end of a scope in which an exception is thrown will not be released. It\
    \ is possible to turn on a compiler flag to enable exception-safe code to be generated,\
    \ but it introduces extra code that has to be run for the scenario in which no\
    \ exception is thrown. The compiler flag that turns this on is -fobjc-arc-exceptions.\n\
    \nEven when not using ARC, it is difficult to write code that is safe against\
    \ memory leaks when exceptions are used. Suppose that a resource is created and\
    \ needs to be released once it is no longer needed. If an exception is thrown\
    \ before the resource has been released, that release will never be done:\n\n\
    ```\nid someResource = /* ... */;\nif ( /* check for error */ ) {\n@throw [NSException\
    \ exceptionWithName:@\"ExceptionName\"\n       reason:@\"There was an error\"\n\
    \       userInfo:nil];\n\n[someResource doSomething];\n[someResource release];\n\
    ```\n\nOf course, the way to solve this problem is to release someResource before\
    \ throwing; however, if there are many resources to release and more complicated\
    \ code paths, the code easily gets cluttered. Also, if something is added to such\
    \ code, it would be easy to forget to add releases before all times an exception\
    \ is thrown.\n\nObjective-C has taken the approach recently to save exceptions\
    \ for the rare scenario in which recovery should be avoided and an exception should\
    \ cause an application to exit. This means that complex exception-safe code does\
    \ not need to be involved.\n\nRemembering that exceptions are to be used for fatal\
    \ errors only. An example of a scenario in which you should consider throwing\
    \ an exception in your own classes when creating an abstract base class that should\
    \ be subclassed before being used. Objective-C has no language construct to say\
    \ that a class is abstract, unlike some other languages. The best way to achieve\
    \ a similar effect is to throw an exception in any method that must be overridden\
    \ in subclasses. Any-one who tries to create an instance of the abstract base\
    \ class and use it will get an exception:\n\n```\n(void)mustOverrideMethod {\n\
    NSString *reason = [NSString stringWithFormat:\n```"
