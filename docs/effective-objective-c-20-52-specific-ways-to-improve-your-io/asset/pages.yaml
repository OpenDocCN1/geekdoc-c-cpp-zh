    # Things to Remember


    +   * A message consists of a receiver, a selector, and parameters. Invoking a
    message is synonymous with calling a method on an object.

    * When invoked, all messages go through the dynamic message dispatch system where
    the implementation is looked up and then run.


    # Item 12: Understand Message Forwarding


    Item 11 explains why it''s important to understand the way messages are sent to
    objects. Item 12 explores why it''s important to understand what happens when
    a message is sent to an object that it doesn''t understand.


    A class can understand only messages that it has been programmed to understand,
    through implementing methods. But it''s not a compile-time error to send a message
    to a class that doesn''t understand, since methods can be added to classes at
    runtime so the compiler has no way of knowing whether a method implementation
    is going to exist. When it receives a method that it doesn''t understand, an object
    goes through message forwarding, a process designed to allow you as the developer
    to tell the message how to handle the unknown message.


    Even if you are unaware of it, you will very likely already encountered messages
    going through the message-forwarding path-ways. Every time you''ve seen a message
    such as the following in the console, it''s because you''ve sent a message to
    an object that it doesn''t understand and the default NSObject implementation
    of the forwarding-path has kicked in:


    ```

    - [NSNumber lowerCaseString]; unrecognized selector sent to instance 0x87

    ```'
