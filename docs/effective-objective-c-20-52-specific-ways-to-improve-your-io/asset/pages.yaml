  md: '# Item 46: Avoid dispatch_get_current_queue


    In this scenario, the correct solution is that the accessor does not need to be
    made reentrant. Rather, you should ensure that the queue used for synchronization
    never tries to access the property; never call someString. The queue should be
    used only for synchronization of the property. Dispatch queues are fairly lightweight,
    so it''s fine to create multiple queues to ensure that the synchronization queue
    is used solely for synchronization of one property.


    The preceding example may seem slightly contrived, but another thing to be aware
    of is with queues can make this problem occur when you didn''t think it would.
    Queues are arranged into a hierarchy, meaning that blocks enqueued on one queue
    are executed within their parent queue. The final queue in a hierarchy is always
    one of the global queues. To illustrate a simple hierarchy, see Figure 6.4.


    Blocks enqueued on either queue B or queue C are subsequently scheduled to run
    on serial A. So blocks enqueued on queue A, B, and C will be executed exclusively
    with respect to one another. However, blocks enqueued on queue D will run concurrently
    with those enqueued on queue A (and therefore B and C) because the target queue
    of A and D is a concurrent one. Concurrent queues execute blocks in parallel on
    multiple threads, if necessary, depending on system resources, such as the number
    of cores the CPU has.


    ![](img/72498492af77d8c75e17783675fe4432_248_0.png)


    Figure 6.4 Dispatch queue hierarchy'
