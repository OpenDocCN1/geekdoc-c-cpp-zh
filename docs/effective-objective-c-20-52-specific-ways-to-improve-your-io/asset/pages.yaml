  md: '# Chapter 4: Protocols and Categories


    Usually, a class-continuation category would be defined to expand the status of
    the two properties to read-write:


    ```

    @interface EOCPerson

    @property (nonatomic, copy, readwrite) NSString *firstName;

    @property (nonatomic, copy, readwrite) NSString *lastName;

    @end

    ```


    That is all that needs to be done. Now the implementation of EOCPerson is free
    to use the setter either by calling setFirstName: or setName: or by using the
    property syntax. Doing so can be a very useful way to keep your data internally
    publicly but still be able to manage the data as required. Therefore, the data
    encapsulated by the class is controlled by the instance itself rather than being
    able to be changed externally. See Item 18 for a potential for race conditions
    to be introduced with this approach if an observer reads a property at the same
    time as the property is written internally. Sensible use of synchronization (see
    Item 41) will mitigate this problem.


    Another good use of the class-continuation category is to declare private methods
    that are going to be used only inside the implementation of the class. This is
    useful because it documents the methods available inside the class implementation.
    It looks like this:


    ```

    @interface EOCPerson

    -(void)p_privateMethod;

    @end

    ```


    Here, the prefix idea from Item 20 is used to indicate a private method. You don''t
    strictly need to declare methods before using them in recent compiler versions.
    However, it is still often a good idea to do so in a class-continuation category
    like this, as it is a way to document what methods exist in one place. I often
    like to write the methods like this, before implementing the class. Then I go
    through and implement the methods. It is a great way to improve readability of
    a class.


    Finally, the class-continuation category is a good place to state that your objects
    conform to protocols that should be considered private. Often, you don''t want
    to leak information that you conform to a certain protocol in the public interface,
    maybe because the protocol is part of your private API. For example, consider
    that EOCPerson conforming to a protocol called EOCSecretDelegate. Using the public
    interface, it would look like this:


    ```

    #import <Foundation/Foundation.h>

    #import "EOCSecretDelegate.h"

    ```'
