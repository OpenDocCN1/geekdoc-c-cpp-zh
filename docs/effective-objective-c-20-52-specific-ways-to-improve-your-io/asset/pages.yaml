    \ in such a way that detection like this is possible.\n\nThis is just one such\
    \ optimization that is made by putting memory management in the hands of the compiler\
    \ and the runtime. It should help to illustrate why ARC is such a good idea. As\
    \ the compiler and runtime mature, I'm sure that other optimizations will be making\
    \ an appearance.\n\n# Memory-Management Semantics of Variables\n\nARC also handles\
    \ memory management of local variables and instance variables. By default, every\
    \ variable is said to hold a strong reference to the object. This is important\
    \ to understand, particularly with instance variables, since for certain code,\
