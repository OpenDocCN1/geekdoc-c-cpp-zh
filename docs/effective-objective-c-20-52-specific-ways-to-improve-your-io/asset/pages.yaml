    # Item 49: Use Toll-Free Bridging for Collections with Custom Memory-Management
    Semantics


    The collection classes that come with the Objective-C system libraries are arrays,
    dictionaries, and sets. The Foundation framework defines Objective-C classes for
    these and other types of collections. Similarly, the CoreFoundation framework
    defines C APIs for manipulating data structures that represent these and other
    types of collections. For example, NSArray is Foundation''s Objective-C class
    for an array, and CFArray is CoreFoundation''s equivalent. These two ways of creating
    an array may seem distinct, but a powerful feature toll-free bridging allows you
    to cast between the two classes seamlessly.


    Toll-free bridging allows you to cast between Objective-C classes defined in Foundation
    and C data structures defined in CoreFoundation and vice versa. I refer to the
    C-level APIs as structures rather than classes or objects because they are not
    the same as classes or objects from Objective-C. For example, CFArray is referred
    as CFArrayRef, which is a pointer to a struct __CFArray. This struct is manipulated
    by using functions as CFArrayGetCount to obtain the size of the array. This is
    distinct from its Objective-C counterpart, where you create an NSArray object
    and call methods, such as count, on that object to obtain the size of the array.


    A simple toll-free bridging example is as follows:'
