    \ used later. The problem is that once the completion handler has run, it no longer\
    \ needs to hold onto the block. So the simple fix is to change the following method:\n\
    \n```\n(void)p_requestCompleted {\n  _completionHandler{_downloadedData};\n  self.completionHandler\
    \ = nil;\n}\n```\n\nThe retain cycle is then broken once the request has completed,\
    \ and the fetcher object will deallocated as necessary. Note that this is a good\
    \ reason to pass the completion handler in the start method. If instead the completion\
    \ handler were exposed as a public property, you couldn't just go and clear it\
    \ when requested, as that would break the encapsulation semantics you have given\
    \ the consumer by saying that the completion handler is public. In this case,\
    \ the only way to break the retain cycle sensibly is by enforcing that the consumer\
    \ clear theHandler property in the handler itself. But that is not very sensible,\
    \ because you cannot assume that a consumer will do this and instead blame you\
    \ for the leaks.\n\nBoth of these scenarios are not uncommon. They are bugs that\
    \ are easy to creep in when using blocks; similarly, they are as easy to mitigate\
    \ if you are careful. The key is to think about what objects block may capture\
    \ and therefore retain. If any of these can be an object that retains the block,\
    \ either directly or indirectly, you will need to think about how to break the\
    \ retain cycle at the correct moment.\n\n# Things to Remember\n\n+   * Be aware\
    \ of the potential problem of retain cycles introduced by blocks that capture\
    \ objects that directly or indirectly retain the block.\n* Ensure that retain\
    \ cycles are broken at an opportune moment, but never leave responsibility to\
    \ the consumer of your API."
