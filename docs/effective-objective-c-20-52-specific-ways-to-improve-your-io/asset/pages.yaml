    \ *url = [[NSURL alloc] initWithString:\"@http://www.example.com/bar.dat\"];\n\
    \  _barFetcher = [[EOCNetworkFetcher alloc] initWithURL:url];\n  _barFetcher.delegate\
    \ = self;\n  [_barFetcher start];\n}\n```\n\n```\n(void)(EOCNetworkFetcher*)networkFetcher\
    \ didFinishWithData:(NSData*)data {\nif (networkFetcher == _fooFetcher) {\n  _fetchedFooData\
    \ = data;\n  _fooFetcher = nil;\n} else if (networkFetcher == _barFetcher) {\n\
    \  _fetchedBarData = data;\n  _barFetcher = nil;\n}\n// etc.\n}\n```\n\nIn addition\
    \ to making the delegate callback long, this code means that the network fetchers\
