    # Item 35: Use Zombies to Help Debug Memory-Management Problems


    Debugging memory-management issues are painful. Sending a message to a deallocated
    object is completely unsafe, as one would expect. But sometimes it works, and
    sometimes it doesn''t. It depends on whether the memory where the object used
    to reside has been overwritten. Whether or not the memory is reused is nondeterministic,
    so a crash may happen only occasionally. Other times, the memory will be only
    partially reused, so certain bits of the object are still valid. Other times,
    the memory will have been overwritten with another valid, live object. In these
    cases, the runtime will send the message to the new object, to which it may may
    not respond. If it does, the app won''t crash, but you''ll wonder why objects
    you didn''t expect to be receiving messages. If it doesn''t respond to that selector,
    the application will usually crash.


    Fortunately, Cocoa''s "zombies" feature can come in handy. When this debugging
    feature is enabled, the runtime turns all deallocated'
