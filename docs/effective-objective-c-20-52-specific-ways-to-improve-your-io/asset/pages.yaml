  md: "# Item 20: Avoid Properties in Categories\n\nwarning: property 'friends' requires\
    \ method 'setFriends': to be defined - use @dynamic or provide a method implementation\
    \ in this category [-Wobjc-property-implementation]\n\nThis cryptic warning means\
    \ that instance variables cannot be synthesized by a category, and therefore,\
    \ that the property needs to be the accessor methods implemented in the category.\
    \ Alternatively, the accessor methods can be declared @dynamic, meaning that you\
    \ are declaring that they will be available at runtime but cannot be seen by the\
    \ compiler. This might be the case if you are using the message-forwarding mechanism\
    \ (see Item 12) to intercept the methods and provide the implementation at runtime.\n\
    \nTo get around the problem of categories not being able to synthesize instance\
    \ variables, you can use associated objects (see Item 10). For the example, you\
    \ would need to implement the accessors within the category as follows:\n\n```\n\
    #import <objc/runtime.h>\n```\n\n```\nstatic const char *kFriendsPropertyKey =\
    \ \"kFriendsPropertyKey\";\n\n@implementation EOCPerson (Friendship)\n\n-(NSArray*)friends\
    \ {\n    return objc_getAssociatedObject(self, kFriendsPropertyKey);\n}\n\n-(void)setFriends:(NSArray*)friends\
    \ {\n    objc_setAssociatedObject(self,\n                              kFriendsPropertyKey,\n\
    \                              friends,\n                              OBJC_ASSOCIATION_RETAIN_NONATOMIC);\n\
    }\n\n@end\n```\n\nThis works, but it's less than ideal. It's a fair amount of\
    \ boilerplate and is prone to errors with memory management because it's easy\
    \ to forget that the property is implemented like this. For example, you may change\
    \ the memory-management semantics by changing the property attributes. You would\
    \ also need to remember to change the memory-management semantics of the associated\
    \ object in the setter. So although this is not a bad solution, it is not one\
    \ that I recommend."
