  md: 'If you''ve come from a language such as C++ or Java, you''re probably wondering
    why you have to do this rather than simply declaring the private method as private.
    In Objective-C, there is no way to mark a method as private. All objects are able
    to respond to all messages at runtime (see Item 12), and it''s possible to inspect
    an object at runtime to determine which messages it will respond to (see Item
    14). Method lookup for a given message is performed at runtime (see Item 11),
    and there is no mechanism for limiting the scope of who, what, or when a certain
    method can be invoked. It is left to naming conventions to dictate semantics such
    as private methods. Newcomers may not feel comfortable with this, embracing the
    dynamism of Objective-C unleashes its power. Taming the dynamism is crucial, though,
    and using naming conventions is how you achieve this.


