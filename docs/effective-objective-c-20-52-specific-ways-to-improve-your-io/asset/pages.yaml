    The category name within the backtrace can be extremely useful for pinpointing
    exactly functional area of the class method relates to, which is particularly
    useful when certain methods should be regarded as private. In that case, it might
    be useful to create a category Private that contains all these methods. Such categories''
    methods are generally used only internally to a class or framework and not exposed.
    If a user finds such a method—perhaps by reading a backtrace—the private in the
    name should help indicate that the method should not be used directly. In a way,
    it is a method of self-documenting code.


    The idea of a Private category is useful when creating a library that will be
    shared by other developers. Often, some methods should not form part of the public
    API but are nice to use within the library itself. In this scenario, creating
    a Private category is a good option, since its header can be imported wherever
    the methods need to be used within the library. If that category header is not
    released as part of the library''s release, consumers of the library would have
    no idea that those private methods exist.


    # Things to Remember


    +   * Use categories to split a class implementation into more manageable fragments.

    * Create a category called Private to hide implementation detail of methods that
    should be considered as private.


    # Item 25: Always Prefix Category Names on Third-Party Classes


    Categories are commonly used to add functionality to an existing class for which
    you don''t own the source code. This is an extremely powerful feature, but it
    is also very easy to overlook a problem that can arise when doing so. The problem
    stems from the fact that methods are added to the class as if they were part of
    the class itself. This happens at runtime when the category is loaded. The runtime
    goes through each method implemented by a category and adds it to the class''s
    method list. If a method in a category already exists, the category wins and becomes
    the implementation of that method. This overriding can happen over and over again
    in fact, so a method in one category can override a method in another'
