    # Property Attributes


    Another aspect of properties that you should be aware of is all the attributes
    that can be used to control the accessors generated by the compiler. An example
    using three attributes looks like this:


    @property (nonatomic, readwrite, copy) NSString *firstName;


    Four categories of attributes can be applied.


    # Atomicity


    By default, synthesized accessors include locking to make them atomic. If you
    supply the attribute nonatomic, no locking is used. Note that although there is
    no atomic attribute (atomic is assumed by the lack of the nonatomic attribute),
