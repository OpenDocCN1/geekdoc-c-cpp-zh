  md: '# Item 29: Understand Reference Counting


    As explained previously, this code won''t compile under ARC, owing to the explicit
    calls to release. In Objective-C, a call to alloc will result in the return of
    an object that is said to be owned by the caller. It is to say, the caller''s
    interest has already been registered because it used alloc. However, it is important
    to note that this does not mean the retain count is exactly 1. It might be more,
    since the implementation of either alloc or initWithWith: may mean that other
    retains have been made on the object. You are guaranteed, though that the retain
    count is at least 1. You should always think about retain count is, what only
    effect your actions have had on the retain count: whether that is incremented
    or decremented.


    The number object is then added to the array. In doing this, the array also registers
    it by calling retain on the number object within the addObject:number; At this
    point, the retain count is at least 2. Then, the number object is no longer required
    by this code, so it is released. Its retain count is now back down to at least
    1. At this point, the number variable can no longer be safely used. The call to
    release means that the object pointed to is no guaranteed to be alive. Of course,
    the code in this scenario makes obvious that it will be alive after the call to
    release, since the array is still referencing it. However, that should never be
    assumed, which means that you should not do anything like:


    ```

    NSNumber *number = [[NSNumber alloc] initWithWith:1337];

    [array addObject:number];

    [number release];

    NSLog("%@", number);

    ```


    Even though the code will work in this scenario, it is not good practice. If for
    any reason the number object was deallocated while calling release as its retain
    count dropped to zero, the call to NSLog would potentially crash. The reason I
    qualify with that is that when an object is deallocated, its memory is simply
    returned to the available pool. If the memory has not been overwritten by the
