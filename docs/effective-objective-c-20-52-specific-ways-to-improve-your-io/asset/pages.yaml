    # Item 52: Remember that NSTimer Retains Its Target


    Timers are a useful object to have at your disposal. The Foundation framework
    contains a class called NSTimer that can be scheduled to run either at an absolute
    date or after a given delay. Timers can repeat and therefore have an associated
    interval to define how frequently they should fire. You may use one to fire every
    5 seconds to handle polling of a resource, for example.


    Timers are associated with a run loop, and the run loop handles when it should
    fire. When a timer is created, it can either be prescheduled in the current run
    loop, or you can create it and schedule it yourself. Either way, the timer will
    fire only if it is scheduled in a timer that is prescheduled. For example, the
    method to create a NSTimerWithTimeInterval is as follows:


    ```

    (NSTimer *)scheduledTimerWithTimeInterval:

    (NSTimerInterval)seconds

    target:(id)target

    selector:(SEL)selector

    userInfo:(id)userInfo

    repeats:(BOOL)repeats

    ```


    This method can be used to create a timer that fires after a certain time interval.
    Optionally, it can repeat until it is manually stopped at a later time. The target
    and the selector specify which selector should be called on which object when
    the timer fires. The timer retains its target and will release it when the timer
    is invalidated. A timer is invalidated'
