- pgno: 249
  md: "# Chapter 6: Blocks and Grand Central Dispatch\n\nBecause of queue hierarchies,\
    \ the equality check of the current queue with the queue about to be dispatched\
    \ synchronously may not always work. A block enqueued on queue C, for instance,\
    \ will return queue C for the current queue, so it may think it can safely dispatch\
    \ asynchronously to queue A. In fact, this would result in a deadlock as before.\n\
    \nThis problem may occur if an API allows you to specify what queue to schedule\
    \ callback blocks on, but a serial synchronization queue is used internally, with\
    \ its target set to the callback queue. Code in the consumer of such API would\
    \ be incorrect to assume that the current queue, returned by dispatch_current_queue\
    \ in callback blocks, will always equal the queue it gave. In fact, the internal\
    \ synchronization queue would be returned instead.\n\nTo solve this problem, the\
    \ best approach is to use the queue-specific data functions of GCD, which allow\
    \ you to associate arbitrary data with a queue as a key-value pair. Most important,\
    \ if no data is associated for a certain key when retrieving data, the system\
    \ walks up the hierarchy until it finds data or the root is reached. It may not\
    \ be obvious how this can be used, so consider this example:\n\n```\ndispatch_queue_t\
    \ queueA =\n    dispatch_queue_create(\"com.objectivec.queueA\", NULL);\n    dispatch_queue_t\
    \ queueB =\n    dispatch_queue_create(\"com.objectivec.queueB\", NULL);\n    dispatch_queue_set_target_queue(queueB,\
    \ queueA);\n```\n\n```\nstatic int kQueueSpecific;\nCFString queueSpecificValue\
    \ = CFSTR(\"queueA\");\ndispatch_queue_set_specific(queueA,\n    &kQueueSpecific,\n\
    \    (void*)queueSpecificValue,\n    (dispatch_function_t)CFRelease);\ndispatch_sync(queueB,\
    \ {\n    dispatch_block_t block = ^{NSLog(\"@No deadlock!\")};\n    block();\n\
    ```\n\n```\nCFString retrievedValue =\n    dispatch_get_specific(&kQueueSpecific);\n\
    if (retrievedValue) {\n    block();\n} else {\n    dispatch_sync(queueA, block);\n\
    }\n});\n```"
  merge: -1
  img_proc: true
