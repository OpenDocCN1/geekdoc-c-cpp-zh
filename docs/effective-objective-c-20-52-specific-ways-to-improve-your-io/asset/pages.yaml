    # Full Forwarding Mechanism


    If the forwarding algorithm has come this far, the only thing left to do is to
    apply the full forwarding mechanism. This starts by creating an NSInvocation object
    to wrap up all the details about the message that is left unhandled. This object
    contains the selector, target, and arguments. An NSInvocation object can be invoked,
    which causes the message-dispatch system to whirl into action and dispatch the
    message to its target.


    The method that gets called to attempt forwarding this way is:


    +   - (void)forwardInvocation:(NSInvocation*)invocation


    A simple implementation would change the target of the invocation and invoke it.
    This would be equivalent to using the replacement receiver method, so such a simple
    implementation is rarely used. A more useful implementation would be to change
    the message in some way before invoking it, such as appending another argument
    or changing the selector.


    An implementation of this method should always call its superclass''s handle for
    invocations it doesn''t handle. This means that all selectors in the hierarchy
    have been given a chance to handle the invocation. NSObject''s implementation
    will be called. This invokes doesNotRecognizeSelector: to raise the unhandled
    selector exception.


    # The Full Picture


    The process through which forwarding is handled is described by a flow diagram
    like shown in Figure 2.2.


    At each step, the receiver is given a chance to handle the message. Each step
    is more expensive than the one before it. The best scenario is that the method
    is resolved at the first step, since the method that was resolved will end up
    being cached by the runtime such that forwarding does not have to kick in at all
    next time the same selector'
