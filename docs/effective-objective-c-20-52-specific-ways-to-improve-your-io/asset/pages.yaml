    \ a selector on a different thread are better replaced with certain Grand Central\
    \ Dispatch (GCD) calls using blocks.\n\n# Item 43: Know When to Use GCD and When\
    \ to Use Operation Queues\n\nGCD is a fantastic technology, but it is sometimes\
    \ better to use other tools that come as part of the standard system libraries.\
    \ Knowing when to use each tool is important; using the wrong tool can lead to\
    \ code that's difficult to maintain.\n\nThe synchronization mechanisms of GCD\
    \ (see Item 41) can hardly be rivaled. The same goes for single-time code execution\
    \ through the use of dispatch_once (see Item 45). However, GCD is not always the\
    \ best approach for executing tasks in the background. A separate but related\
    \ technology, NSOperationQueue, allows you to queue operations (subclasses of\
    \ NSOperation) that can optionally run concurrently. The similarity to GCD's dispatch\
    \ queues is not a coincidence. Operation queues came before GCD, but there is\
    \ no doubt that GCD is based on the principles made popular by operation queues.\
    \ In fact, from iOS 4 and Mac OS X 10.6 onward, operation queues use GCD under\
    \ the hood.\n\nThe first difference to note is that GCD is a pure C API, whereas\
    \ operation queues are Objective-C objects. In GCD, the task that is queued is\
    \ a block, which is a fairly lightweight data structure (see Item 37). Operations,\
    \ on the other hand, are Objective-C objects and are therefore more heavyweight.\
    \ That said, GCD is not always the approach of choice. Sometimes, this overhead\
    \ is minimal, and the benefits of using full objects far outweigh the downsides."
