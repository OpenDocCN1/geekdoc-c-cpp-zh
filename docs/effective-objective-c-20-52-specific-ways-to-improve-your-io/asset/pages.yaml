  md: '# Chapter 6: Blocks and Grand Central Dispatch


    Anywhere the type definition is used, such as method signatures, will now fail
    to compile in the same way, and you can go through and fix things. Without the
    type definition, you would find that you needed to change many types throughout
    your code. It would potentially be easy to miss one or two of these, leading to
    hard-to-find bugs.


    It is usually best to define these type definitions along with the class that
    uses them. It is also prudent to prefix the new type''s name with the class that
    uses the type definitions. This makes the block''s use clear. If multiple type
    definitions end up being created for the same block signature type, it''s better
    to have more types than fewer.


    An example of this point can be seen in the Accounts framework from Mac OS and
    iOS. This framework defines, among others, the following-block type definitions:


    ```

    typedef void(^ACAccountStoreSaveCompletionHandler) (BOOL success, NSError *error);

    typedef void(^ACAccountStoreRequestAccessCompletionHandler) (BOOL granted, NSError
    *error);

    ```


    These block types have the same signature but are used in distinct places. The
    name of the type and the name of the parameters in the signature make it easy
    for the developer to understand how the type is to be used. The developer could
    have defined a single type definition, perhaps called ACAccountStoreBooleanCompletionHandler,
    used in place of both of them. However, that would lose the clarity of how the
    block and parameters are used.


    Similarly, if you have a few classes that perform a similar but distinct asynchronous
    task that do not fit into a class hierarchy, each class should have its own completion
    handler type. The signature may be exactly the same for each, but it is better
    to use a type definition for each class rather than a single one. On the other
    hand, if the classes fit into a hierarchy, you could define the type definition
    along with the base class and have each subclass use it.


    # Things to Remember


    +   * Use type definitions to make it easier to use block variables.

    * Always follow the naming conventions when defining new types such that you do
    not clash with other types.

    * Don''t be afraid to define multiple types for the same block signature. You
    may want to refactor one place that uses a certain block type by changing the
    block signature but not another.'
