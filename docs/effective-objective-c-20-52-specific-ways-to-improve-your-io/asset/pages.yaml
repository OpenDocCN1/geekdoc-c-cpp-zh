    Even worse than not linking would be if one of the libraries that contained loaded
    at runtime. In this case, the dynamic loader would encounter the duplicate symbol
    error and most likely bring down the entire application.


    The only way to avoid this problem is to use a crude form of naming: prefixing
    all your names with a certain prefix. The prefix you choose should be relevant
    to your company, application, or both. For example, if your company were named
    Effective Widgets, you might decide to use the prefix EWS for code common to all
    your applications and EwB for code just for the application called Effective Browser.
    It''s still not impossible to have clashes when you prefix your names, but it
    is much less likely.


    If you are creating applications using Cocoa, it is important to note that Apple
    has reserves the right to use all two-letter prefixes, so you should definitely
    choose a three-letter prefix in this case. For example, an issue could have arisen
    by not following these guidelines and deciding to use the Tw prefix. When the
    iOS 5.0 SDK came out, it brought along the Twitter framework, which uses the Tw
    prefix, which has a class called TwRequest for making HTTP requests to the Twitter
    API. You could easily also have had a class called TwRequest if you had an API
    of your own, for a company called Tiny Widgets, for example.


