    This brings to light a common problem when switching to using literals. The following
    code creates two arrays, one in each syntax:


    ```

    id object1 = /** ... */;

    id object2 = /** ... */;

    id object3 = /** ... */;

    ```


    ```

    NSArray*arrayA = [NSArray object1, object2, object3, nil];

    NSArray*arrayB = @[object1, object2, object3];

    ```


    Now consider the scenario where object1 and object3 point to valid Objective-C
    objects, but object2 is nil. The literal array, arrayB will cause the exception
    to be thrown. However, arrayA will still be created but will contain only object1.
    The reason is that the arrayWithObjects method looks through the variadic arguments
    until it hits nil, which is sooner than expected.


    This subtle difference means literals are much safer. It''s much better than an
    exception is thrown, causing a probable application crash, rather than creating
    an array having fewer than the expected number of objects in it. A programmer
    error most likely caused nil to be inserted into the array, and the exception
    means that the bug can be found more easily.


