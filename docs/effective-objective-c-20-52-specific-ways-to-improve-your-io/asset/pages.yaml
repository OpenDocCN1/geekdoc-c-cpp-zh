- pgno: 56
  md: "# Item 8: Understand Object Equality\n\nThe default implementations of these\
    \ methods from the NSObject class itself work such that two objects are equal\
    \ if and only if their pointer values are exactly the same. To understand how\
    \ to override these for your own objects, it's important to understand the contract.\
    \ Any two objects determined to be equal using the isEqual: method must return\
    \ the same value from the hash method. However, two objects return the same value\
    \ from the hash method do not have to be equal according to the isEqual: method.\n\
    \nFor example, consider the following class:\n\n```\n@interface EOCPerson : NSObject\n\
    @property (nonatomic, copy) NSString *firstName\n@property (nonatomic, copy) NSString\
    \ *lastName\n@property (nonatomic, assign) NSUInteger age;\n@end\n```\n\nTwo EOCPerson\
    \ objects are equal if all the fields are equal. So the isEqual: method would\
    \ look like this:\n\n```\n- (BOOL)isEqual:(id)object {\n    if ([self class] !=\
    \ [object class]) return YES;\n    if ([_firstName isEqualToNSString:object*])\
    \ return NO;\n\n    EOCPerson *otherPerson = (EOCPerson*)object;\n    if (!_firstName\
    \ isEqualToString:otherPerson.firstName]) return NO;\n    if (!_lastName isEqualToString:otherPerson.lastName])\
    \ return NO;\n    if (_age != otherPerson.age) return NO;\n\n    return YES;\n\
    }\n```\n\nFirst, the object is checked for direct pointer equality to self. If\
    \ the pointers are equal, the objects must be equal, since they are the same object!\
    \ Next, the class of the two objects is compared. If the class is not the same,\
    \ the two objects cannot be equal. After all, an EOCPerson cannot be equal to\
    \ an ECod. Of course, you may want an instance of EOCPerson to be equal to an\
    \ instance of a subclass of it: for example, EOCSmithPerson. This illustrates\
    \ a common problem in inheritance hierarchies with equality. You should consider\
    \ this when implementing your isEqual: methods. Last, each property is checked\
    \ for equality. If any of them are not equal, the two objects are deemed unequal;\
    \ otherwise, they are equal."
  merge: -1
  img_proc: true
- pgno: 57
  md: "This leaves the hash method. Recall the contract whereby equal objects must\
    \ return the same hash, but objects with the same hash do not necessarily need\
    \ to be equal. Therefore, it is essential to override if you isEqual:. A perfectly\
    \ acceptable hash method would be the following:\n\n```\n(NSUInteger)hash {\n\
    \    return 1337;\n}\n```\n\nHowever, this could lead to performance problems\
    \ if you put these objects in a collection, since the hash is used as an index\
    \ within the hash tables that collections use. A set implementation might use\
    \ the hash to bin objects into different arrays. When an object is added to the\
    \ set, the array corresponding to its hash is enumerated to see whether objects\
    \ in that array are equal. If the object is already in the set. Therefore, if\
    \ you return the same hash value for every object and you add 1,000,000 objects\
    \ to the set, each further addition to the set has to scan each of those 1,000,000\
    \ objects.\n\nAnother implementation of the hash method might be:\n\n```\n(NSUInteger)hash\
    \ {\n    NSString *stringHash = [NSString stringWithFormat:@\"%@:%@:%i\", _firstName,\
    \ _lastName, _age];\n    return [stringHash hash];\n}\n```\n\nThis time, the algorithm\
    \ of NSString's hash method is piggybacked by creating a string and returning\
    \ the hash of that. Doing so adheres to the contract, since two ECOPerson objects\
    \ that are equal will always return the same hash. However, the downside of this\
    \ approach is that it is much slower than returning a single value, since you\
    \ have the overhead of creating a string. This can again cause performance issues\
    \ when adding the object to a collection, since the hash has to be calculated\
    \ for the object being added to the collection.\n\nA third and final approach\
    \ is to create a hash like this:\n\n```\n(NSUInteger)hash {\n    NSUInteger firstNameHash\
    \ = [_firstName];\n    NSUInteger lastNameHash = [_lastName];\n    NSUInteger\
    \ ageHash = _age;\n    return firstNameHash ^ lastNameHash ^ ageHash;\n}\n```"
