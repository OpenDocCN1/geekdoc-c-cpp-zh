    Key-Value Observation (KVO), and the observer may try to do some work, such as
    attempting to retain the object, using the object that is being deallocated. Doing
    so would cause the runtime to get in a completely inconsistent state, and strange
    crashes would likely result.


    # Things to Remember


    +   The dealloc method should be used only to release references to other objects
    and unregister anything that needs to be, such as Key-Value Observing (KVO) or
    NSNotificationCenter notifications.


    +   If an object holds onto system resources, as file descriptors, there should
    be a method for releasing these resources. It should be the contract with the
    consumer of such a class to close this method when finished using the resources.


    +   Method calls should be avoided in dealloc methods in case methods try to perform
    asynchronous work or end up assuming that the object is in a normal state, which
    it won''t.


    # Item 32: Beware of Memory Management with Exception-Safe Code


    Exceptions are a language feature offered by many modern languages. Exceptions
    do not exist in pure C but do in both C++ and Objective-C. In fact, in the modern
    runtime, C++ and Objective-C exceptions are compatible, meaning that an exception
    thrown from one language can be caught using a handler from the other language.


    Even though the error model of Objective-C (see Item 21) states that you should
    use exceptions only for fatal errors, you may still need code that catches and
    handles them. Examples are Objective-C code or code that interfaces with a third-party
    library such that you have no control over the exceptions being thrown. Also,
    some system libraries will still make use of exceptions, harking back to the days
    when exceptions were in common use. For example, Key-Value Observing (KVO) will
    throw an exception if you attempt to unregister an observer that was not already
    registered.'
