    \ count to drop to 0, and the object would be deallocated. The subsequent retain\
    \ would cause the application to crash. ARC makes this sort of mistake impossible.\
    \ The equivalent setter under ARC is:\n\n```\n(void)setObject:(id)object {\n \
    \   _object = object;\n}\n```\n\nARC performs a safe setting of the instance variable\
    \ by retaining the new value, then releasing the old one before finally setting\
