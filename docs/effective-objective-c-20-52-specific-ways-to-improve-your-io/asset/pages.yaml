    \ <__NSArrayI 0x71275b0>(\nEffective Objective-C 2.0,\n123,\n)\n```\n\n# Things\
    \ to Remember\n\n+   - Implement the description method to provide a meaningful\
    \ string description of instances.\n- If the object description could do with\
    \ more detail for use during debugging, implement debugDescription.\n\n# Item\
    \ 18: Prefer Immutable Objects\n\nWhen designing a class, you, ideally, making\
    \ good use of properties (see Item 6) to encapsulate data. When using properties,\
    \ you can limit the property to read-only. Keeping properties at the default,\
