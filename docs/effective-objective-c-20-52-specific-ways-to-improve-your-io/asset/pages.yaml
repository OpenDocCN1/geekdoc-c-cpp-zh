- pgno: 119
  md: '# Chapter 3: Interface and API Design


    +   * If the method returns a newly created value, the first word in the method
    name should be its type, unless a qualifier needs to go in front, such as with
    the localizedString methods. This excludes property accessors, as do not logically
    create a new object, even though they may return a copy of an internal object.
    These access should be named after the property they represent.


    +   * A parameter should be immediately preceded by a noun describing its type.


    +   * Methods that cause an action to happen on an object should contain a verb
    followed by a noun (or multiple nouns) if the method requires parameters to perform
    the action.


    +   * Avoid abbreviations, such as str, and instead use full names, such as string.


    +   * Prefix Boolean properties with is. Methods that return a Boolean but are
    not direct properties should be prefixed by either or is, depending on what makes
    sense for that method.


    +   * Reserve the prefix for use with methods that return values via an out-parameter,
    such as those that fall a C-style array.


    # Class and Protocol Naming


    Classes and protocols should be given a prefix to avoid namespace clashes (see
    Item 15) and be structured so that they read right, just like methods do. For
    example, in the class NSArray and its mutable counterpart subclass, NSMutableArray,
    mutable comes before array because it describes a specialization of the type.


    To illustrate the naming conventions, consider the following, taken from the iOS
    UI library, UIKit:


    ```

    UIView (class)

    ```


    This is a class from which all "views" inherit. They are the building blocks of
    the user interface and perform the drawing of buttons, text fields, and tables.
    The name of the class is self-explanatory and uses the UI prefix used throughout
    the UIKit framework.


    +   * UIViewController (class)


    A view (UIView) handles drawing views but is not responsible for controlling what
    is displayed within the view. That is the job of this class: a "view controller."
    It is named in such a way that maintains the left-to-right readability.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Item 19: Use Clear and Consistent Naming


    +   - UITableView (class)


    This is a specific type of view to display a list of items in a table. So it is
    named as the superclass prefixed with a qualifier to distinguish the kind of view
    it is. This prefixing of the superclass is a common theme throughout the naming
    conventions. It could be named simply UITableView, that would not be clear that
    it was a view. You would need to look up in the interface declaration to be sure
    what it was. If you were to create a specific table view designed to display images,
    for example. You could create a subclass called ECIUITableView, you always prepend
    your own prefix, rather than use the prefix of the superclass (UIKit''s UI prefix
    in this case). The reason is that you have no right to add something to another
    framework''s namespace, and the other framework may decide to make an identically
    named class in the future.


    +   - UITableView (class)


    Just as UITableView is a specific kind of view, this is a special kind of view
    controller designed specifically to control a table view. It is therefore named
    in a similar manner.


    +   - UITableViewDelegate (protocol)


    This protocol defines an interface through which a table view can communicate
    with another object and is named after the class for which it defines the delegate
    interface, which ensures left-to-right readability. (See Item 23 for more information
    on the Delegate pattern.)


    Above all, you should be consistent with your naming. Also, if you are subclassing
    within another framework, make sure to stick to its conventions. For example,
    if you create a custom view by subclassing UITableView, make sure the final word
    of the class name is View. Similarly, if you create your own delegate protocol,
    you should name it as the class it is a delegate for, followed by the word Delegate.
    Adhering to this naming structure will ensure that your code makes sense when
    you come back to it later or another person uses it.


    # Things to Remember


    +   - Follow the naming that has become standard in Objective-C to create interfaces
    that fit in and feel right.


    +   - Ensure that method names are concise but precise, and make their use read
    left to right just like a sentence.'
