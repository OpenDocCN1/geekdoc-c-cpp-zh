    \ assign) float longitude;\n```\n\n+   - (id)initWithIdentifier:(NSString*)identifier\n\
    \              title:(NSString*)title\n              latitude:(float)latitude\n\
    \              longitude:(float)longitude;\n\n@end\n\nAll values come from the\
    \ web service, and the identifier is to be used to refer to a point of interest\
    \ in communications with the service. Once a point of interest has been created\
    \ from a communication with the web service, it doesn't make any sense to be able\
    \ to change any of the values. In other languages, you would probably have created\
    \ the instance variables as private, whatever language construct were available,\
    \ and have only a get accessor for the variable. However, in using properties\
