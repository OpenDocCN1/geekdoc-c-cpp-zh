  md: "# Item 23: Use Delegate and Data Source Protocols for Interobject Communication\n\
    \nThis pattern is easy to implement using Objective-C through the use of a protocol.\
    \ In the case of Figure 4.1, the protocol might look like this:\n\n```\n@protocol\
    \ EOCNetworkFetcherDelegate\n  -(void)networkFetcher:(EOCNetworkFetcher*)fetch\n\
    \      didReceiveData:(NSData*)data;\n  -(void)networkFetcherWithError:(EOCNetworkFetcher*)fetch\n\
    \      didFailWithError:(NSError*)error;\n@end\n```\n\nA delegate protocol is\
    \ usually named as camel casing for the whole name followed by the word delegate.\
    \ Following this naming pattern will make your delegate protocol feel familiar\
    \ to anyone using it.\n\nThe protocol provides a property on the class that has\
    \ the delegate. In our example, this is the EOCNetworkFetcher class. Therefore,\
    \ the interface would look like this:\n\n```\n@interface EOCNetworkFetcher : NSObject\n\
    \  @property (nonatomic, weak)\n  id <EOCNetworkFetcherDelegate> delegate;\n@end\n\
    ```\n\nIt's important to make sure that the property is defined and not strong,\
    \ since it must be a nonowning relationship. Usually, the object that will be\
    \ the delegate will also hold onto the object. An object wanting to use an EOCNetworkFetcher,\
    \ for example, will keep hold of it until finished with relationship using the\
    \ strong attribute. a retain cycle would be introduced. For this reason, a delegate\
    \ property will always be defined using either the weak attribute to benefit from\
    \ autounilling (see Item 6) or unsafe_retained if autounilling is not required.\
    \ The owner-ship diagram shown in Figure 4.2 illustrates this.\n\nImplementing\
    \ the delegate is a matter of declaring that your class implements the delegate\
    \ protocol and then implementing any methods you want from the protocol. You can\
    \ declare that a class implements a protocol in either the interface or the class-continuation\
    \ category (see Item 27). Declaring it in the interface is useful if you want\
    \ to advertise to others that you implement that protocol; however, in the case\
    \ of delegate it's useful to care only about it internally. So it's common to\
    \ declare it in the class-continuation category like so:\n\n```\n@implementation\
    \ EOCDataModel () <EOCNetworkFetcherDelegate>\n@end\n```"
