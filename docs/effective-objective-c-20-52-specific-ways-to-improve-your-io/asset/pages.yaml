  md: "# Chapter 6: Blocks and Grand Central Dispatch\n\n# Item 37: Understand Blocks\n\
    \nBlocks provide closures. This language feature was added as an extension to\
    \ the GCC compiler and is available in all modern Clang versions (the compiler\
    \ project used for Mac OS X and iOS development). The runtime component required\
    \ for blocks to function is available in all versions of Mac OS X since 10.4 and\
    \ iOS since 4.0. The language feature is technically a C-level feature and therefore\
    \ can be used in C, C++, Objective-C, and Objective-C++ code compiled under a\
    \ supported compiler and run with the runtime present.\n\n# Block Basics\n\nA\
    \ block is similar to a function but is defined inline to another function and\
    \ shares the scope of that which within it is defined. The symbol used to denote\
    \ a block is the caret, followed by a scope block that contains the block's implementation.\
    \ For example, a simple block looks like:\n\n```\n^{\n  // Block implementation\
    \ here\n}\n```\n\nA block is simply another value and has an associated type.\
    \ Just like an int, float, or Objective-C object, a block can be assigned to a\
    \ variable and then used like any other variable. The syntax for a block type\
    \ is similar to that of a function pointer. Following is a simple example of a\
    \ block that takes no parameters and returns nothing:\n\n```\nvoid (^someBlock)()\
    \ = ^{\n  // Block implementation here\n};\n```\n\nThis block defines a variable\
    \ whose name is someBlock. This might look strange because the variable name is\
    \ right in the middle, but once you understand the syntax, it is easy to read.\
    \ The structure of the block type is as follows:\n\n```\nreturn_type (^block_name)(parameters)\n\
    ```\n\nTo define a block that returns an int and takes two ints as parameters,\
    \ you would use the following syntax:\n\n```\nint (^addBlock)(int a, int b) =\
    \ ^(int a, int b){\n  return a + b;\n};\n```\n\nA block can be used as if it were\
    \ a function. So, for example, the addBlock could be used like this:"
