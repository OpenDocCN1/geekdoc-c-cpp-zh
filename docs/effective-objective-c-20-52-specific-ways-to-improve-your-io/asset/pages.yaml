    \ value is alive across the method boundary. If it wants to ensure the object\
    \ stays alive longer, the calling code must retain it.\n\nARC automatically handles\
    \ all memory management required to maintain these rules, including the code for\
    \ returning objects autoreleased, as illustrated in the following code:\n\n```\n\
    + EOCPerson*)newPerson {\n    EOCPerson *person = [[EOCPerson alloc] init];\n\
    \    return person;\n    /**\n   * The method name begins with 'new', and since\
    \ 'person'\n   * already has an unbalanced +1 retain count from the\n   * 'alloc',\
    \ no retains, releases, or autoreleases are\n   * required when returning.\n \
    \  */\n}\n```\n\n```\n+ EOCPerson*)somePerson {\n    EOCPerson *person = [[EOCPerson\
    \ alloc] init];\n    return person;\n    /**\n   * The method name does not begin\
