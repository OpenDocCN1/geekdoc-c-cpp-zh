  md: "# Chapter 5: Memory Management\n\nWith regard to the cleanup method for objects\
    \ that manage resources, this should also be called in dealloc to mitigate the\
    \ case, in which the cleanup method was not called. If this happens, it is often\
    \ a good idea to output a log line to indicate that a programmer error has occurred.\
