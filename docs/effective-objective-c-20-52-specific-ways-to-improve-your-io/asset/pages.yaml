  md: '# Chapter 4: Protocols and Categories


    category that overrides a method in the main class implementation.

    The last category to be loaded wins.


    For example, suppose that you decide to add a category on NSString

    provide some helper methods for dealing with strings related to HTTP

    URLs. You may decide to define the category like this:


    ```

    @interface NSString (HTTP)


    // Encode a string with URL encoding

    - (NSString*)urlEncodedString;


    // Decode a URL encoded string

    - (NSString*)urlEncodedString;


    @end

    ```


    This reads absolutely fine here, but consider what might happen if

    another category is added that also adds methods to NSString.

    The second category might also add a method called urlEncodedString but\might
    implement it slightly differently and incorrectly for your purposes. If loaded
    after your category, the second category will win, and

    your code will be calling the implementation defined in that category.

    This may cause your code to not work properly, as it will get\unexpected results.
    This bug may be hard to track down, as you may

    not know that your implementation of urlEncodedString is not the

    code being running.


    A typical way to overcome this problem is to namespace the category

    name and the methods it defines. The only way within Objective-C to

    namespace is to prepend names with a common prefix. Just as you

    should do with classes (see Item 15), you should choose a prefix that

    sits the situation. Often, the prefix will be the same one used

    the rest of your application or library. Thus, the NSString category

    might become the following for a prefix of ABC:


    ```

    @interface NSString (ABC_HTTP)


    // Encode a string with URL encoding

    - (NSString*)abc_urlEncodedString;


    // Decode a URL encoded string

    - (NSString*)abc_urlDecodedString;


    @end

    ```'
  merge: -1
