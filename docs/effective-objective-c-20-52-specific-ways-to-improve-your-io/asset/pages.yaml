    # Item 27: Use the Class-Continuation Category to Hide Implementation Detail


    Often, you will want a class to contain more methods and instance variables than
    are exposed externally. You could expose them externally and document that they
    are private and shouldn''t be relied on. After all, no method or instance variable
    is truly private in Objective-C, owing to the dynamic messaging system works what
    needs to be exposed. So what do you do about methods and instance variables that
    should not be exposed publicly but whose existence you still want to document?
    That''s where a special category—the “class-continuation category”—can come in
    handy.


    The class-continuation category, unlike normal categories, must be defined in
    the implementation file of the class for which it is a continuation. Importantly,
    it is the only category that is allowed to declare extra instance variables. Also,
    this category doesn''t have a specific implementation. Any method defined within
    it is expected to appear in the main implementation of the class. Unlike other
    categories, a class-continuation category has no name. A class-continuation category
    for a class named EOCPerson would look like this:


    ```

    @interface EOCPerson ()

    // Methods here

    @end

    ```


