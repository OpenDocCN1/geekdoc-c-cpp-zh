- pgno: 190
  md: '# Item 33: Use Weak References to Avoid Retain Cycles


    The unsafe_retained property attribute is semantically equivalent to the assign
    attribute (see Item 6). However, assign is usually used only for integral types
    (int, float, structs, etc.), favoring unsafe_retained for object types. This is
    a form of self-documentation to make it clear that the property is potentially
    unsafe.


    Along with ARC came an Objective-C runtime feature that allows safe weak references:
    a new property attribute named weak, which works in exactly the same way as unsafe_retained.
    However, it automatically sets the property value to nil as soon as the value
    is deallocated. In the example, the other property of OCClassB is deallocated.
    could be changed to this:


    ```

    @property (nonatomic, weak) OCClassA *other;

    ```


    The difference between unsafe_retained and weak properties is illustrated in Figure
    5.6.


    When the reference to the instance of OCClassA is removed, the property unsafe_retained
    still points to the instance that is deallocated. With weak property, the property
    points to nil.


    However, using weak properties is not an excuse to be lazy. In the preceding example,
    it should be seen as an error that the instance of OCClassB is still alive when
    the referenced OCClassA object is deallocated. If it ever happens, it is a bug.
    You should still aim to ensure that such a situation does not arise. But using
    weak rather than unsafe_retained references makes code safe. Rather than crashing,
    an application may instead display incorrect data. The latter is certainly more
    desirable the problem be exhibited for end users. However, it is still a bug that
    the weak-referenced object was prematurely destroyed in the first place. An example
    of this would be a user interface element having a data source property that it
    queries to get the data to display. Such a property usually need to be a weak
    reference (see Item 23). If the data source object was deallocated before the
    element finished with it, a weak reference means it will not crash but won''t
    poln any data.


    The general rule is that if you don''t own an object, you should not retain it.
    One exception to that rule is collections, which often don''t directly own their
    contents but are retaining them on behalf of the object that owns the collection.
    An example of an object having a reference to something it doesn''t own is the
    Delegate pattern (see Item 23).


    # Things to Remember


    +   * Retain cycles can be avoided by making certain references weak.'
