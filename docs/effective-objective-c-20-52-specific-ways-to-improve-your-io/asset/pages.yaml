    # Things to Remember


    +   * Provide isEqual; and hash methods for objects that you want to check for
    equality.

    * Objects that are equal must have the same hash, but objects that have the same
    hash do not necessarily have to be equal.

    * Determine what is necessary to test for equality rather than bluntly testing
    every property.

    * Write hash methods that will be quick but provide a reasonably low level of
    collisions.


    # Item 9: Use the Class Cluster Pattern to Hide Implementation Detail


    A class cluster is a great way to hide implementation detail behind an abstract
    base class. This pattern is prevalent within the Objective-C system frameworks.
    An example from UIKit, the user interface framework for iOS, is UIButton. To create
    a button, you call the following class method:


    ```

    + (UIButton*)buttonWithType:(UIButtonType)type;

    ```


    The type of the object returned will depend on the button type passed in. However,
    all classes inherit from the same base class. UIButton. The point of doing this
    is that the consumer of the UIButton class does not care about the type of the
    button being created and the implementation detail behind how that button draws
    itself. All it needs to know is how to create a button: set attributes, such as
    the title; and add targets for touch actions.


    Going back to basics, this problem could be solved by having a single class that
    handles all button drawing and switches based on the type:'
