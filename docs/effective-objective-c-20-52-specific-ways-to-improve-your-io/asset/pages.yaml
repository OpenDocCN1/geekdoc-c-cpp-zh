    \  __weak E NSObject *weakSelf = self;\n  _pollTimer =\n[NSTimer eoc_scheduledTimerWithTimeInterval:5.0\n\
    block:^{\n    EObjectClass *strongSelf = weakSelf;\n    [strongSelf p_doPoll];\n\
    }\nrepeats:YES];}\n```\n\nThis code uses a useful pattern of defining a weak self\
    \ variable, which is captured by the block instead of the normal self variable.\
    \ This means that self won't be retained. However, when the block is executed,\
    \ a strong reference is immediately generated, which will ensure that the instance\
    \ is guaranteed to be alive for the duration of the block."
  merge: -1
