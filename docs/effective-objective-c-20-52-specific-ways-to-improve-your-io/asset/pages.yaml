  md: '# # 5

    Memory Management


    Memory management is an important concept in any object-oriented language, such
    as Objective-C. Understanding the specifics of any language''s memory-management
    model is vital to being able to write memory-efficient, bug-free code.


    Once you understand the rules, memory management in Objective-C is not complicated
    and was made easier when Automatic Reference Counting (ARC) came along. ARC diverts
    nearly all the memory-management decisions to the compiler, leaving you to concentrate
    on the business logic.


    # Item 29: Understand Reference Counting


    Objective-C uses reference counting for memory management, meaning that every
    object has a counter that is incremented and decremented. You increment the counter
    when you want to register your interest in keeping an object alive, and you decrement
    the counter when you have finished with it. When an object''s counter reaches
    zero, the object no longer has anything interested in it and is free to be destroyed.
    This is a brief overview: understanding the fully is crucial to writing good Objective-C
    code, even if you are going to be using ARC (see Item 30).


    The garbage collector for use with Objective-C code written for Mac OS X is officially
    deprecated as Mac OS X 10.8 and has never been available for iOS. Understanding
    reference counting is very important going forward as you can no longer rely on
    the garbage collector on Mac OS X and never never be able to, on iOS.


    If you already use ARC, you should switch off the part of your brain that tells
    you most of the code presented won''t compile. That''s true, in an ARC world.
    But this item is explaining reference counting from an Objective-C perspective,
    which is still going on with ARC, and'
