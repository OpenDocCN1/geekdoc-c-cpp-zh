    ```\n(void)fetchFooData {\n  NSURL *url = [[NSURL alloc] initWithString:\"@http://www.example.com/foo.dat\"\
    ];\n  _fooFetcher = [[EOCNetworkFetcher alloc] initWithURL:url];\n  _fooFetcher.delegate\
