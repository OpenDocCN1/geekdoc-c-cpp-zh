- pgno: 54
  md: "# Item 7: Access Instance Variables Directly When Accessing Them Internally\n\
    \n* Accessing through properties can make it easier to debug surrounding a property,\
    \ since you can add a breakpoint to the getter and/or setter to determine who\
    \ is accessing the properties and when.\n\nA good compromise is to write instance\
    \ variables using the setter and to read using direct access. Doing so has the\
    \ benefit of fast reading and not losing the control of writing via properties.\
    \ The most important reason for writing via the setter is that you will ensure\
    \ that the memory-management semantics are upheld. There are, however, a few caveats\
    \ to that approach.\n\nThe first caveat is when values are set within an initializer\
    \ method. Here, you should always use direct instance variable access, because\
    \ subclasses could override the setter. Consider that OCPerson has a subclass\
    \ OCSmithPerson that is designed to be used only for people whose name is \"Smith\"\
    . This subclass might override the setter for lastName like:\n\n```\n- (void)setName:(NSString*)lastName\
    \ {\n    if (![lastName isEqualToString:\"Smith\\]) {\n        [NSException raise\
    \ NSInvalidArgumentException format:\"Last name must be Smith\\];\n    }\n   \
    \ self.lastName = lastName;\n}\n```\n\nThe base class OCPerson might set the name\
    \ to the empty string in its default initializer. If it did this through the setter,\
    \ the subclass's setter would be called and throw an exception. However, there\
    \ are some cases in which you must use the setter in the initializer. This is\
    \ when the instance variable is declared in a superclass; you cannot access the\
    \ instance variable directly anyway, so you must use the setter.\n\nAnother caveat\
    \ is when the property uses lazy initialization. In this case, you have to go\
    \ via the getter; if you don't, the instance variable will never get a chance\
    \ to be initialized. For example, the OCPerson class might have a property to\
    \ get access to a complex object representing each person's brain. If this property\
    \ is infrequently accessed and expensive to set up, you might initialize it lazily\
    \ in the getter, like this:\n\n+   - (OCBrain*)brain {\n    if (_brain) {\n  \
    \      _brain = [Brain new];\n    }\n    return _brain;\n}"
