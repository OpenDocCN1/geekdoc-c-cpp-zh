  md: "# Item 51: Keep initialize and load Implementations Lean 255\n\nEven though\
    \ it does not implement initialize, EOCSubClass will still be sent the message.\
    \ All superclasses' initialize implementations are called first as well. So the\
    \ first time EOCSubClass is used, you would see the following output:\n\n```\n\
    EOCBaseClass initialize\nEOCSubClass initialize\n```\n\nThat may surprise you,\
    \ but it makes perfect sense. Normal inheritance rules apply to initialize just\
    \ like other methods (apart from load!), so the implementation from EOCBaseClass\
    \ is run once when again EOCSubClass is initialized, since EOCSubClass does not\
    \ override it. This is why it is common to see initialize implementations look\
    \ like this:\n\n```\n+ (void)initialize {\n    if (self == [EOCBaseClass class])\
    \ {\n        NSLog(\"%@ is initialized\", self);\n    }\n}\n```\n\nWith this check\
    \ in place, it is only when the desired class is initialized that the initialization\
    \ work is done. If this is applied to the earlier example, instead of two log\
    \ lines being printed, only one is:\n\n```\nEOCBaseClass initialize\n```\n\nAll\
    \ this leads on the main point about both load and initialize as hinted at earlier.\
    \ Implementations of both should be lean. They should be limited to setting up\
    \ state that is required for the class to operate correctly but not do any work\
    \ that may take a long time or take out locks. In the case of load, the reasons\
    \ are as covered earlier; the reasons for keeping initialize lean are similar.\
    \ First, nobody wants an application that hangs. A class will be initialized the\
    \ first time it is used and can be done from any thread. If this happens to be\
    \ the UI thread, that will block while the initialization is taking place, causing\
    \ an unresponsive application. It's sometimes hard to predict which thread will\
    \ use a class, and it's certainly not ideal to attempt to force a certain thread\
    \ to be the one that causes a class to be initialized.\n\nSecond, you do not control\
    \ when a class will be initialized. It is guaranteed to be before a class is used\
    \ for the first time, but relying on it being at any given time is dangerous.\
