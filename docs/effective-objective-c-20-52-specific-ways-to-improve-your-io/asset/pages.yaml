    # Things to Remember


    +   - When an object is deallocated, it can optionally be turned into a zombie
    instead of being deallocated. This feature is turned on by using the environment
    flag NSZombieEnabled

    - An object is turned into a zombie by manipulating its isa pointer to change
    the object''s class to a special zombie class. A zombie class responds to all
    selectors by aborting the application after printing a message to indicate what
    message was sent to what object.


    # Item 36: Avoid Using retainCount


    Objective-C uses reference counting for memory management (see Item 29). Each
    object has a counter that determines how many other things are interested in keeping
    it alive. When an object is created, the retain count is greater than zero. Retaining
    and releasing manipulate the count by incrementing and decrementing it, respectively.
    When the count reaches zero, the object is deallocated and destroyed.


    A method defined by the NSObject protocol allows you to obtain the current retain
    count for an object:


    +   - (NSInteger)retainCount


    However, ARC has deprecated this method. In fact, the compiler will throw an error
    if you try to call it when using ARC, just as it does'
