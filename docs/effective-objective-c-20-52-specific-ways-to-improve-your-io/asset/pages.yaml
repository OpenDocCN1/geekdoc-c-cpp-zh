  md: '# Item 2: Minimize Importing Headers in Headers


    which imports the first. The use of #import rather than #include does not end
    in an infinite loop but does mean that one of the classes won''t compile correctly.
    Try it for yourself if you don''t believe me!


    Sometimes, though, you need to import a header in a header. You must import the
    header that defines the superclass from which you are inheriting. Similarly, if
    you declare any protocols that your class conforms to, they have to be fully defined
    and not forward declared. The compiler needs to be able to see the methods the
    protocol defines rather than simply that a protocol does exist from a forward
    declaration.


    For example, suppose that a rectangle inherits from a shape class and conforms
    to a protocol allowing it to be drawn:


    ```

    // ERectangle.h

    #import "EOCShape.h"

    #import "EOCDrawable.h"

    ```


    The extra import is unavoidable. For such protocols, it is prudent to put them
    in their own header file for this reason. If the EOCDrawable protocol was part
    of a larger header file, you''d have to import all of that, by creating the same
    dependency and extra compilation-time problems as described before.


    That said, not all protocols, as delegate protocols (see Item 23), need to go
    in their own files. In such cases, the protocol makes sense only when defined
    alongside the class for which it is a delegate. In these cases, it is often best
    to declare that your class implements the delegate in the class-continuation category
    (see Item 27). This means that the import of the header containing the delegate
    protocol can go in the implementation file rather than in the public header.


    When writing an import into a header file, always ask yourself whether it''s really
    necessary. If the import can be forward declared, prefer that. If the import is
    for something used in a property, instance variable, or protocol conformance can
    be moved to the class-continuation category (see Item 27), prefer that. Doing
    so will keep compile time as low as possible and reduce interdependency, which
    can cause problems with maintenance or exposing only parts of your code in a public
    API should ever you want to do that.'
