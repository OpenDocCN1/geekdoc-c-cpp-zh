- pgno: 22
  md: '# Item 1: Familiarize Yourself with Objective-C''s Roots


    ![](img/72498492af77d8c75e17783675fe4432_22_0.png)


    Figure 1.1 Memory layout showing a heap-allocated NSString instance and two stack-allocated
    pointers to it


    There is only one NSString instance here, but two variables are pointing to the
    same instance. These two variables are of type NSString*, meaning that the current
    stack frame has allocated 2 bits of memory the size of a pointer (4 bytes for
    a 32-bit architecture, 8 bytes for a 64-bit architecture). These bits of memory
    will contain the same value: the memory address of the NSString instance.


    Figure 1.1 illustrates this layout. The data stored for the NSString instance
    includes the bytes needed to represent the actual string.


    The memory allocated in the heap has to be managed directly, whereas the stack-allocated
    memory to hold the variables is automatically cleaned up when the stack frame
    on which they are popped.


    Memory management of the heap memory is abstracted away by Objective-C. You do
    not need to use malloc and free to deallocate the memory for objects. The Objective-C
    runtime abstracts this out of the way through a memory-management architecture
    known as reference counting (see item 29).


    Sometimes in Objective-C, you will encounter variables that don''t have a * in
    the definition and might use stack space. These variables are not holding Objective-C
    objects. An example is CGRect from the CoreGraphics framework:


    ```

    CGRect frame;

    frame.origin.x = 0.0f;

    frame.origin.y = 10.0f;

    frame.size.width = 100.0f;

    ```'
  merge: -1
  img_proc: true
