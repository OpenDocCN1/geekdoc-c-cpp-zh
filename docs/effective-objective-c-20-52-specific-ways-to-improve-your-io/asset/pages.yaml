    API is NSNotificationCenter, which has a method whereby you can register to be
    notified of a certain notification by the notification center''s executing a certain
    block. It is possible, but not compulsory, to decide in which queue to schedule
    the block. If no queue is given, the default behavior is invoked, and the block
    is run on the thread that posted the notification. The method to add an observer
    looks like this:


    +   - (id)addObserverForName:(NSString*)name

    object:(id)object

    queue:(NSOperationQueue*)queue

    usingBlock:(void)(NSNotification*)block


    Here, an NSOperationQueue is passed to denote the queue that the block should
    be run when a notification is fired. Operation queues rather than the lower-level
    GCD queues are used, but the semantics are the same. (See item 43 for more about
    GCD queues versus other tools.)


    You could similarly design an API whereby an operation queue is passed in or even
    a GCD queue, if that is the level at which you want to pitch the API.


    # Things to Remember


    +   * Use a handler block when it will be useful to have the business logic of
    the handler be declared inline with the creation of the object.

    * Handler blocks have the benefit of being associated with an object directly
    rather than delegation, which often requires switching based rather on the object
    if multiple instances are being observed.

    * When designing an API that uses handler blocks, consider passing a queue as
    a parameter, to designate the queue on which the block should be enqueued.


    # Item 40: Avoid Retain Cycles Introduced by Blocks Referencing the Object Owning
    Them


    Blocks can very easily introduce retain cycles if they are not considered carefully.
    For example, the following class provides an interface for downloading a certain
    URL. A callback block, called a completion handler, can be set when the fetcher
    is started and is run when the download has finished. The completion handler needs
    to be stored in an instance variable in order to be available when the request-completion
    method is called.'
