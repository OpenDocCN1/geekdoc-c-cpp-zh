  md: '# The Guts of a Block


    Every object in Objective-C occupies a certain region of memory. This memory region
    is a different size for every object, depending on the number of instance variables
    and associated data contained. A block too is an object itself, since the first
    variable within the region of memory that a block is defined in is a pointer to
    a Class, called the isa pointer (see Item 14). The rest of the memory block uses
    the various bits of information it needs to function correctly. Figure 6.1 shows
    the layout of a block in detail.


    The most important thing to note in the layout is the variable called invoke,
    a function pointer to where the implementation of the block resides. The prototype
    of the function takes at least a void*, which is the block itself. Recall that
    blocks are a simple replacement for function pointers where state is passed using
    an opaque void pointer. The block is wrapping up what was previously done using
    standard C language features into a succinct and simple-to-use interface.


    The descriptor variable is a pointer to a structure that each block has, declaring
    the overall size of the block object and function pointers for copy and dispose
    helpers. These helpers are run when a block is copied and disposed of, for example,
    to perform any retaining or releasing, respectively, of captured objects.


    Finally, a block contains copies of all the variables it captures. The copies
    are stored after the descriptor variable and take up as much


    | Block | |

    | --- | --- |

    | void | isa |

    | int | flags |

    | int | reserved |


