  md: "is that a block is reference counted like other objects. When the last reference\
    \ to a block is removed, it is deallocated. In doing so, any objects that the\
    \ block captures are released to balance out the block's retain of them.\n\nIf\
    \ the block is defined in an instance method of an Objective-C class, the self\
    \ variable is available along with any instance variables of the class. Instance\
    \ variables are always retained and do not need to be explicitly declared with\
    \ __block. If an instance variable is captured by either reading or writing to\
    \ it, the self variable is implicitly captured also, because the instance relates\
    \ to that instance. For example, consider following block within a method on a\
    \ class called @interface EObjectClass\n\n```\n- (void)anInstanceMethod {\n  void\
    \ (^someBlock)() = ^{\n    _anInstanceVariable = @\"Something\"\n    NSLog(\"\
    @_anInstanceVariable = %@\", _anInstanceVariable);\n  };\nn\n```\n\nThe particular\
    \ instance of EObjectClass that had the anInstanceMethod method run on is referred\
    \ to as the self variable. It is easy to get that self is captured by this sort\
    \ of block because it is not used explicitly in the code. However, accessing an\
    \ instance variable is equivalent to the following:\n\n```\nself->anInstanceVariable\
    \ = @\"Something\";\n```\n\nThis is why the self variable is captured. More often\
    \ than not, properties (see Item 6) will be used to access instance variables,\
    \ and in this case, the self variable is explicit:\n\n```\nself.aProperty = @\"\
    Something\";\n```\n\nHowever, it is important to remember that self is an object\
    \ and is therefore retained when it is captured by the block. This situation can\
    \ often lead to retain cycles being introduced if the block is itself retained\
    \ by the same object to which self refers. See Item 40 for more information."
