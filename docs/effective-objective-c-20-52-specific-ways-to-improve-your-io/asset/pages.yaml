- pgno: 14
  md: '# Chapter 3: Interface and API Design


    Code is rarely written once and never reused. Even if it is not released to the
    wider community, you will likely use your code in more than one project. This
    chapter explains how to write classes that feel right at home in Objective-C.


    # Chapter 4: Protocols and Categories


    Protocols and categories are both important language features to master. Effective
    use of them can make your code much easier to read, more maintainable, and less
    prone to bugs. This chapter helps you achieve mastery.


    # Chapter 5: Memory Management


    Objective-C''s memory management model uses reference counting, which has long
    been a sticky point for beginners, especially if they have come from a background
    of a language that uses a garbage collector. The introduction of Automatic Reference
    Counting (ARC) has made life easier, but you need to be aware of a lot of important
    things to ensure that you have a correct object model that doesn''t suffer from
    leaks. This chapter fosters awareness of common memory-management pitfalls.


    # Chapter 6: Blocks and Grand Central Dispatch


    Blocks are lexical closures for C, introduced by Apple. Blocks are commonly used
    in Objective-C to achieve what we want to involve boilerplate code and introduced
    code separation. Grand Central Dispatch (GCD) provides a simple interface to threading.
    Blocks are GCD tasks that can be executed, perhaps in parallel, depending on system
    resources. This chapter enables you to make the most from these two core technologies.


    # Chapter 7: The System Frameworks


    You will be writing Objective-C code for Mac OS X or iOS. In those cases, you
    will have the full system frameworks stack at your disposal: Cocoa and Cocoa Touch,
    respectively. This chapter gives a brief overview of the frameworks and delves
    into some of their classes.


    If you have any questions, comments, or remarks about this book, I encourage you
    to contact me. You can find your full contact details on the web site for this
    book at www.effectiveobjectivec.com.'
