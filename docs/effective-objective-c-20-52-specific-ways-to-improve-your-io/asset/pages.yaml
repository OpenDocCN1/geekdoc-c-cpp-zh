  md: "# Item 26: Avoid Properties in Categories\n\nA property is a way of encapsulating\
    \ data (see Item 6). Although it is technically possible to declare a property\
    \ in a category, you should avoid doing so if possible. The reason is that it\
    \ is impossible for a category, except the class-continuation category (see Item\
    \ 27), to add instance variables to a class. Therefore, it is also impossible\
    \ for the category to synthesize an instance variable back to the property.\n\n\
    Suppose that reading Item 24, you have decided to use categories to split up distinct\
    \ fragments of your implementation of a class representing a person. You might\
    \ decide to have a friendship category for all the methods relating to manipulating\
    \ the list of friends associated with a person. Without knowing about the problem\
    \ described earlier, you may also put the property for the list of friends within\
    \ the friendship category, like so:\n\n```\n#import <Foundation/Foundation.h>\n\
    \n@interface EOCPerson : NSObject\n@property (nonatomic, copy, readonly) NSString\
    \ *firstName;\n@property (nonatomic, copy, readonly) NSString *lastName;\n\n-\
    \ (id)initWithFirstName:(NSString*)firstName\n   andLastName:(NSString*)lastName;\n\
    @end\n\n@implementation EOCPerson\n// Methods\n@end\n\n@interface EOCPerson (Friendship)\n\
    @property (nonatomic, strong) NSArray *friends;\n- (BOOL)isFriendWith:(EOCPerson*)person;\n\
    @end\n\n@implementation EOCPerson (Friendship)\n// Methods\n@end\n```\n\nIf you\
    \ compile this, however, you would end up with compiler warnings:\n\nwarning:\
