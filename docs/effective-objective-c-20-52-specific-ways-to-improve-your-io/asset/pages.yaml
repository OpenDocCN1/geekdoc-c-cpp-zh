  md: '# Chapter 2: Objects, Messaging, and the Runtime


    Dynamic binding is the mechanism by which methods in Objective-C are invoked when
    a message is passed to an object. All methods are plain old C functions under
    the hood, but which one is invoked for a given message is decided entirely at
    runtime and can even change throughout the course of an app running, making Objective-C
    truly dynamic.


    A message being called on an object looks like this:


    ```

    id returnValue = [someObject messageName:parameter];

    ```


    In this example, someObject is referred to as the receiver, and messageName is
    the selector. The selector combined with the parameters is known as the message.
    When it sees this message, the compiler turns it into a standard C call to the
    function at the heart of messaging, objc_msgSend, which has the following prototype:


    ```

    void objc_msgSend(id self, SEL cmd, ...)

    ```


    This is a variadic function that takes two or more parameters. The first parameter
    is the receiver, the second parameter is the selector (SEL is the type of the
    selector), and the remaining parameters are the message parameters in the order
    they appear. A selector is the name that refers to a method. The term selector
    is often used interchangeably with the term method. The preceding example message
    will be converted to the following:


    ```

    id returnValue = objc_msgSend(someObject

    ```


    The objc_msgSend calls the correct method, depending on the type of the receiver
    and the selector. In order to do this, the function looks through the list of
    methods implemented by the receiver''s class and, if it finds a method that matches
    the selector name, jumps to its implementation. If not, the function traverses
    the inheritance hierarchy to find the method to jump to. If no matching method
    is found, message forwarding kicks in. For further explanation on message forwarding,
    see Item 12.


    This may sound like a lot of work to go through whenever a method is invoked.
    Fortunately, objc_msgSend caches the result in a fast map, for each class, so
    future messages to the same class and selector combination are executed quickly.
    Even this path is slower than a statically bound function call but not by very
    much once the selector is cached; in reality, message dispatch is not the bottleneck
    in an application. If it were, you could drop down to'
