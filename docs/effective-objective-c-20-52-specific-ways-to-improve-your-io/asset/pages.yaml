  md: "# Item 9: Use the Class Cluster Pattern to Hide Implementation Detail\n\nfamily\
    \ method defined in the interface, which indicates that perhaps instances should\
    \ not be created directly. Another way to ensure that instances of the base class\
    \ are not used would be to throw an exception in doADWork in the base class. However,\
    \ this is quite extreme and usually unnecessary.\n\nIt is important to take care\
    \ when using objects that are members of a class cluster during introspection\
    \ (see Item 14). The reason is that even though you think you have created an\
    \ instance of one class, you have in fact created an instance of a subclass. In\
    \ the Employee example, you might have thought that calling [employeeMemberOfClass:\
    \ [Employee class]] would return YES, but it's not really an Employee that has\
    \ been returned, so this call would return NO.\n\n# Class Clusters in Cocoa\n\n\
    There are many class clusters in the system frameworks. Most of the collection\
    \ classes are class clusters, such as NSArray, and its mutable counterpart,. So,\
    \ in fact, there are two abstract classes: one for immutable arrays and one for\
    \ mutable arrays. It's still a class cluster with two public interfaces. The immutable\
    \ class defines the methods to all arrays, and the mutable class defines the methods\
    \ that are present only on mutable arrays. The fact that it is a class cluster\
    \ means it's easy to share code behind the scenes between the two array types\
    \ and support creating copies that change the mutability.\n\nIn the case of NSArray,\
    \ when an instance is allocated, it's an instance of another class that's allocated\
    \ (during a call to alloc), known as a placeholder array. This placeholder array\
    \ is then converted to an instance of another class, which is a concrete subclass\
    \ of NSArray. This is a pretty little dance but beyond the scope of this book\
    \ to explain fully.\n\nBeing aware that classes like NSArray (and most of the\
    \ other collection classes, for that matter) are class clusters is important because\
    \ otherwise, you might write the following code:\n\n```\nid maybeAnArray = /*\
    \ ... */;\nif ([maybeAnArray class] == [NSArray class]) {\n    // Will never be\
    \ hit\n}\n```\n\nKnowing that NSArray is a class cluster should make you understand\
    \ why this is incorrect and the if statement will never be true. The class returned\
    \ from [maybeAnArray class] will never be the NSArray class, since instances returned\
    \ from NSArray's initializers are instances of internal types behind the class\
    \ cluster public facade."
