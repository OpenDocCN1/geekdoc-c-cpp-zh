  md: '# Item 10: Use Associated Objects to Attach Custom Data to Existing Classes


    +   * Class clusters are commonly used in the system frameworks.


    +   * Care should be taken when subclassing a class cluster''s public abstract
    class, and documentation, if it exists, always should be read.


    # Item 10: Use Associated Objects to Attach Custom Data to Existing Classes


    Sometimes, you want to associate information with an object. Normally, you would
    do this by subclassing the object''s class and use that instead. However, you
    can''t always do this, since instances of the class might be created for you by
    some means and cannot tell it to create instances of your class instead. That''s
    where the powerful Objective-C feature Associated Objects comes in handy.


    Objects are associated with other objects, using a key to identify them. They
    are also designated a storage policy to govern memory-management semantics of
    the stored value. The storage policies are defined by the enumeration objc_AssociationPolicy,
    which contains the values shown in Table 2.1 against the @property attribute for
    the equivalent if the association were a property (see Item 6 for further information
    on properties).


    Management of associations is performed using the following methods:


    +   * void objc_setAssociatedObject(id object, void *key, id value, objc_AssociationPolicy
    policy)


    Sets up an association of object to value with the given key and policy.


    +   * void objc_getAssociatedObject(id object, void *key)


    Retrieves the value for the association on object with the given key.


    # Table 2.1 Object Association Types


    | Association Type | Equivalent @property attributes |

    |---|---|

    | OBJ_ASSOCIATION_ASSIGN | assign |

    | OBJ_ASSOCIATION_RETAIN_NONATOMIC | nonatomic, retain |

    | OBJ_ASSOCIATION_COPY_NONATOMIC | nonatomic, copy |

    | OBJ_ASSOCIATION_RETAIN | retain |

    | OBJ_ASSOCIATION_COPY | copy |'
