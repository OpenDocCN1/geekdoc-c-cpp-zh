  md: 'the data and the associated error. The completion handler can then determine
    the problem, handle it as appropriate, and may be able to do something useful
    with the part of the data that was successfully downloaded.


    Another good reason for putting success and failure in the same block is that
    sometimes when processing the data of an otherwise successful response, the consumer
    detects an error. Perhaps the data returned was too short, for example. This situation
    may need to be handled in the same way as the failure case from the network fetcher''s
    perspective. In that case, having a single block means that processing can be
    done and, if an error is found with the data, it can be handled along with the
    case in which a network fetcher error has been detected. If the success and failure
    cases are split into separate handlers, it becomes impossible to share the error-handling
    code of this scenario without deferring to a separate method, which defeats the
    point of using handler blocks to put business logic code all in one place.


    Overall, I suggest using a single handler block for success and failure, which
    is the approach Apple seems to be taking in its APIs. For example, TwRequest from
    the Twitter framework and MKLocalSearch both use the approach of a single handler
    block.


    Another reason to use handler blocks is for calling back at pertinent times. A
    consumer of the network fetcher may want to be told each progress is made with
    the download, for example. This could be done with a delegate. But continuing
    the theme of using handler blocks, you could add a progress-handler block type
    and a property:


    ```

    typedef void (^EOCNFetcherCompletionHandler)(float progress);

    @property (nonatomic, copy)

    EOCNFetcherProgressHandlerHandler;

    ```


    This is a good pattern to follow, as yet again allows all the business logic to
    be put in one place: where the network fetcher is created and the completion handler
    is defined.


    Another consideration when writing handler-based APIs stems from the fact that
