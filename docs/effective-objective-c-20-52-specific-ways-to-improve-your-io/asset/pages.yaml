  md: "# Item 51: Keep initialize and load Implementations Lean\n\nThe problem with\
    \ the load method is that the runtime is in a fragile state at the time it is\
    \ run. Superclasses' load methods are guaranteed to be run before those of any\
    \ class; also any load methods from classes in dependent libraries are guaranteed\
    \ to be run first. Within any given library, however, you cannot assume the order\
    \ in which classes are loaded. Therefore, it is unsafe to use another class in\
    \ a load method. For example, consider the following code:\n\n```\n#import <Foundation/Foundation.h>\n\
    #import \"EOCClassA.h\" // From the same library\n\n@interface EOCClassB : NSObject\n\
    @end\n\n@implementation EOCClassB\n+ (void)load {\n    NSLog(\"Loading EOCClassB\"\
    );\n    EOCClassA *object = [EOCClassA new];\n    // Use 'object'\n}\n@end\n```\n\
    \nIt is safe to use NSLog and the associated NSString that is being logged, since\
    \ we know that the Foundation framework has already loaded by the time the load\
    \ method is run. However, it is unsafe to use NSString from EOCClassB's load method,\
    \ since you cannot know deterministically whether EOCClassA has been loaded by\
    \ the time EOCClassB's load method is invoked. For all you know, in its own load\
    \ method, EOCClassA may perform some important work that must be done before an\
    \ instance can be used.\n\nAn important thing to note is that load does not follow\
    \ the normal inheritance rules for methods. A class that does not implement load\
    \ is not called, regardless of whether any of its superclasses do. Also, load\
    \ can appear in a category and the class itself. Both implementations will be\
    \ called, with the class's coming before the category's.\n\nYou should also make\
    \ sure that an implementation of load is lean, meaning that as little as possible\
    \ is done, because the entire application will be blocked while loading is taking\
    \ place. If a load method does some heavy lifting, the application will be unresponsive\
    \ for that period. You should not attempt to wait on any locks or call methods\
    \ that may themselves call calls. In essence, you should do very little. In fact,\
    \ load is almost never the right solution to perform tasks that have to happen\
    \ before a class is used. Its only real use is for debugging, perhaps when used\
    \ in a category you want to check that the"
