    # Read/Write


    +   - readwrite Both a getter and a setter are available. If the property is synthesized,
    the compiler will generate both methods.


    +   - readonly Only a getter is available, and the compiler will generate it only
    if the property is synthesized. You may want to use this if you expose a property
