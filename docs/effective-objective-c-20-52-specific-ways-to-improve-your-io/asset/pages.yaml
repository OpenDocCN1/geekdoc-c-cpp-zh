  md: '# Item 28: Use a Protocol to Provide Anonymous Objects


    The key parameter is typed as <id NSCopying>, since it needs to be any object
    type that conforms to NSCopying so the copy message can be sent to it successfully
    (see Item 22). The key can be thought of as being anonymous. Just as the delegate
