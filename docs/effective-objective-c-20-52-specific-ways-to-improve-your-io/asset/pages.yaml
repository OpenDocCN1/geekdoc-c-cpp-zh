- pgno: 148
  md: '# Item 25: Always Prefix Category Names on Third-Party Classes


    Technically, you don''t have to namespace the name of the category itself. Nothing
    goes wrong if you have two categories named the same. But it''s not good practice,
    and you will get a compiler warning that looks like this:


    warning: duplicate definition of category ''HTTP'' on interface

    NSString


    It is not impossible for another category to override your method, but it''s now
    much less likely, since another library is unlikely to use the same prefix. It
    also avoids the potential for the developer of the class to add in an update a
    method that clashes with your added method. For instance, if Apple were to add
    the method urlEncodedString to NSString, your method of the same name would override
    Apple''s, which is undesirable, since other users of NSString may be expecting
    the output from Apple''s implementation. Or Apple''s implementation may include
    side effects that your method does not provide and potentially produce inconsistencies
    internally, producing bugs that are hard to find.


    You also need to remember that methods added to a class in a category are available
    to every single instance of that class within your application. If you add methods
    to a system-supplied class, such as NSString, NSArray or NSNumber, for example,
    every instance of those classes will be able to call your added methods even if
    they are not created from your own code. If you accidentally override a method
    by using the category or clash with a category added by a third-party library,
    strange bugs can occur because you think it''s your code being executed when it''s
    not. Similarly, purposefully overriding methods in a category is bad practice.
    especially if your code will form a library used by other developers who might
    rely on the existing functionality. for instance. Worse still, another developer
    may override the same method, in which case the method winning in the overriding
    process is undefined. This is another example of why you should namespace method
    names in categories.


    # Things to Remember


    +   - Always prepend your naming prefix to the names of categories you add to
    classes that are not your own.


    +   - Always prepend your naming prefix to the method names within categories
    you add to classes that are not your own.'
