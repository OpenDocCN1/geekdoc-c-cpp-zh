  md: "Item 45: Use dispatch_once for Thread-Safe Single-Time Code Execution\n\n#\
    \ Item 45: Use dispatch once for Thread-Safe Single-Time Code Execution\n\nThe\
    \ Singleton design pattern—no stranger in the Objective-C world—is usually achieved\
    \ through a class method called something like sharedInstance, which returns the\
    \ singleton instance of a class instead of specifically allocating a new instance\
    \ each time. A common implementation of the shared-instance method for a class\
    \ called EOClass is the following:\n\n```\n@implementation EOClass\n\n+ (id)sharedInstance\
    \ {\n    static EOClass *sharedInstance = nil;\n    @synchronized(self) {\n  \
    \      if (!sharedInstance) {\n            sharedInstance = [[alloc] init];\n\
    \        }\n    return sharedInstance;\n}\n@end\n```\n\nI have found that the\
    \ Singleton pattern generates hot debate, especially in Objective-C. Thread safety\
    \ is the primary candidate for debate. The preceding code creates the singleton\
    \ instance enclosed in a synchronization block to make it thread safe. For better\
    \ or worse, the pattern is commonly used, and such code is commonplace.\n\nHowever,\
    \ GCD introduced a feature that makes singleton instances much easier to implement.\
    \ The function is as follows:\n\n```\nvoid dispatch_once(dispatch_once_t token,\
    \ dispatch_block_t block);\n```\n\nThis function takes a special dispatch_once_t\
    \ type, which I will call the \"token.\" and a block. The function ensures that\
    \ for a given token, the block is executed once and only once. The first time\
    \ and, most importantly, it is entirely thread safe. Note that the token passed\
    \ in-de needs to be exactly the same one for each block that should be executed\
    \ once. This usually means declaring the token variable in static or global scope.\n\
    \nRewriting the singleton shared-instance method with this function looks like\
    \ this:"
