    \ objects than that. It's more likely that you are going to know some more information\
    \ about the object.\n\nTo make the output more useful, all you need to do is override\
    \ description to return the string you want to represent your object. For example,\
    \ consider class to describe a person:\n\n```\n#import <Foundation/Foundation.h>\n\
    \n@interface EOCPerson : NSObject\n\n@property (nonatomic, copy, readonly) NSString\
    \ *firstName;\n@property (nonatomic, copy, readonly) NSString *lastName;\n\n-\
