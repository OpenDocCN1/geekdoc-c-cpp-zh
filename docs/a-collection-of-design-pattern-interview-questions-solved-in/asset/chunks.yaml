  trans: "\n对象池（Object pool）是一种用于缓存对象并避免昂贵的重复创建的模式。这种模式经常用于表示多个客户端共享的数据库连接对象。例如，该模式已用于实现\
    \ java JDBC 驱动[[3]](#part0000.html__ftn3)。\n\n在在这个简化的示例中，我们分配了一个包含三个对象的缓存，但决定采用一种非常幼稚的缓存策略，即始终返回缓存中的第一个对象。可以根据不同需求采用更复杂的分配策略。此外，在多线程环境下应该采用相应的锁策略。\n\
    \n### Code\n\n```cpp\nnamespace Object_Pool{\n   // 对象池用于管理对象缓存。\n   // 访问对象池的客户端可以通过直接向池\n\
    \   // 请求一个已经实例化的对象，来避免\n   // 创建新对象。\n  static  const int num_objects = 3;\n\n\
    \  class  Object_to_share{\n  public:\n    Object_to_share(){\n      std::cout\
    \ << \"\\tAn object to share\" << std::endl;\n    };\n  };\n\n  class  Pool{\n\
    \  public:\n    Object_to_share * getObject(void){\n      std::cout << \"\\tGetting\
    \ object\" << std::endl;\n      return &(objpool_[0]);\n    }\n  private:\n  \
    \  // 可以动态分配\n    Object_to_share objpool_[num_objects];\n  };\n}; // end ObjectPool\n\
    \nvoid testObjectPool(){\n  using namespace Creational_Patterns::Object_Pool;\n\
    \  Object_to_share o;\n  Pool p;\n  p.setObject(&o);\n  Object_to_share * ptr\
    \ = p.getObject();\n}\n```\n\n# 结构性模式\n\n结构性模式通过继承来组合接口。对象的组合允许创建新功能、简化接口、适配异构对象、提高性能并降低复杂度。\n\
    \n# 7. 实现适配器模式（Adapter pattern）\n\n## 解决方案\n\n适配器模式用于通过适当的包装器，允许具有不兼容接口的类之间进行操作。\n\
    \n在此示例中，适配器类公有地继承 `DesiredInterface` 并私有地继承 `LegacyInterface`。`DesiredInterface`\
    \ 根据一个纯虚方法实现，该方法由适配器实现，以使现有类在不修改其源代码的情况下与其他类协作。还提供了一种由模板而非私有继承驱动的替代且更现代的实现。\n\n\
    ### Code\n\n```cpp\nnamespace Adapter{\n  // 适配器模式允许通过将一个类的\n  // 转换为客户端预期的接口，\n\
    \  // 让原本不兼容的类共同工作。\n  class  DesiredInterface{\n  public:\n    virtual  void\
    \ make() = 0;\n  };\n\n  class  LegacyInterface{\n  public:\n    LegacyInterface()\
    \ {\n      std::cout << \"\\tCalled legacy\" << std::endl;\n    };\n  };\n\n \
    \ // 私有继承旧组件\n  class  adapter : public  DesiredInterface,\n  private  LegacyInterface{\n\
    \  public:\n    adapter() : LegacyInterface(){};\n    void make() {\n      std::cout\
    \ << \"\\tAdapter do something \" << std::endl;\n    }\n  };\n}; //end adapter\n\
    \nvoid testAdapter()\n{\n  using namespace Structural_Patterns::Adapter;\n  adapter\
    \ * a = new  adapter();\n  a->make();\n  delete a;\n}\n\ntemplate<typename  T>\n\
    struct  GenericVehicleAdapter : VehicleInterface {\n  GenericVehicleAdapter(T*\
    \ x) : m(x) { }\n  virtual  void Run() { return m->Run(); }\n  T* m;\n};\n\nvoid\
    \ testTemplateAdapter() {\n  Shuttle shuttle;\n  GenericAdapter<Shuttle> vehiclelike(&shuttle);\n\
    }\n```\n\n# 8. 实现桥接模式（Bridge pattern）\n\n## 解决方案\n\n桥接模式将抽象与其具体实现解耦。通过这种方式，它们可以独立演进。遵循该模式，类本身可以被视为一种特定的实现，而它更泛泛地被视为抽象。在\
    \ C++ 中，这种模式有时会与 PIMPL（私有实现）[[4]](#part0000.html__ftn4）混淆。然而它们之间存在差异。PIMPL 是隐藏实现的方法，目的是打破编译依赖。而桥接模式是支持多种实现的方法。\n\
    \n在此示例中，`bridge` 类有一个指针 `bridge_imp`，两个说明性的子类 `a` 和 `b` 通过 `a_imp` 和 `b_impi`\
    \ 类提供具体的实现。\n\n### Code\n\n```cpp\nnamespace Bridge{\n//// 将抽象与其实现解耦，以便\n// 者可以独立变化。这与\n\
    // 让无关类共同工作的适配器 模式不同。\n  class  BridgeImp{ // 解耦\n  public:\n    BridgeImp() {};\n\
    \  protected:\n    int my_data_;\n  };\n\n  class  Bridge{\n  public:\n    Bridge()\
    \ {};\n  protected:\n    BridgeImp * imp_;\n  };\n\n  class  AImp : public  BridgeImp{\
    \ // 实现\n  public:\n    AImp() { my_data_ = 1; }\n  };\n\n  class  A : public\
    \  Bridge{ // 层级结构\n  public:\n    A() {\n      imp_ = new AImp();\n      std::cout\
    \ << \"\\tcreated a\" << std::endl;\n    }\n    ~A() {\n      delete imp_;\n \
    \     std::cout << \"\\tdeleted a\" << std::endl;\n    }\n  };\n\n  class  BImp\
    \ : public  BridgeImp{ // 实现\n  public:\n    BImp() { my_data_ = 2; }\n  };\n\n\
    \  class  B : public  Bridge{ // 层级结构\n  public:\n    B() {\n      imp_ = new\
    \ BImp();\n      std::cout << \"\\tcreated b\" << std::endl;\n    }\n    ~B()\
    \ {\n      delete imp_;\n      std::cout << \"\\tdeleted b\" << std::endl;\n \
    \   }\n  };\n}; // end Bridge\n\nvoid testBridge()\n{\n  using namespace Structural_Patterns::Bridge;\n\
    \  A bridge;\n  B bridge;\n}\n```\n\n# 9. 实现组合模式（Composite pattern）\n\n## 解决方案\n\
    \n组合模式用于组合具有共同行为的对象，使其可以像单个对象一样被操作。在此示例中，`Component` 类由子类 `Leaf` 和 `Composite`\
    \ 实现。此外，`Composite` 维护了一个用于插入 `Components` 的向量。\n\n### Code\n\n```cpp\nnamespace\
    \ Composite{\n// 将对象组合成树结构以表示\n// 整个层结构。\n  class  Component{\n  public:\n   \
    \ virtual  void traverse() = 0; // 纯虚\n  };\n\n  class  Leaf : public  Component{\n\
    \  private:\n    int value_; // 这里是需要的\n  public:\n    Leaf(int val) : value_(val)\
    \ {};\n    void traverse() { std::cout << value_ << \" \"; }\n  };\n\n  class\
    \  Composite : public  Component{\n  private:\n    std::vector< Component * >\
    \ children_;\n    typedef std::vector< Component * >const__iterator comp_const_it;\n\
    \  public:\n    void add(Component * e) { children_.push_back(e); };\n    void\
    \ traverse() {\n      comp_const_it it = children_.begin();\n      comp_const_it\
    \ it_end = children_.end();\n      for (; it != it_end; ++it) {\n        (*it)->traverse();\n\
    \      }\n    }\n  };\n}; // end composite\n\nvoid testComposite(){\n  using namespace\
    \ Structural_Patterns::Composite;\n  Leaf l1(1);\n  Leaf l2(2);\n  Composite c;\n\
    \  c.add(&l1); c.add(&l2);\n  c.traverse();\n}\n```\n\n# 10. 实现装饰器模式（Decorator\
    \ pattern）\n\n## 解决方案 \n\n装饰器模式用于为对象已有的方法添加额外的行为。在某些情况下，现有的行为会被完全覆盖。这些额外的行为可以是永久的、瞬时的，或在运行时动态添加的。\n\
    \n在此示例中，类 `A_and_X`继承自 `A` 并相应地实现了虚方法 `make()`。\n\n### Code\n\n```cpp\nnamespace\
    \ Decorator{\n  // 动态地为对象附加额外的责任。\n  // 装饰器为扩展功能提供了比子类化更灵活的方案。\n  class  A{\n\
    \  public:\n    A() { std::cout << \"\\tA\" << std::endl; }\n    virtual  void\
    \ make(void) {\n      std::cout << \"\\t making A\" << std::endl;\n    }\n  };\n\
    \n  class  A_and_X : public A{\n  public:\n    A_and_X() : A() {};\n    void make(void)\
    \ override {\n      std::cout << \"\\t making X\" << std::endl;\n    }\n  };\n\
    }\n```\n"
- fmt: "\n```cpp\n      }\n\n };\n\n // the decoration is private;\n\n class A_and_X\
    \ : public A{\n\n public:\n\n  void make(void) {\n\n  A::make(); make_x();\n\n\
    \             };\n\n private:\n\n  void make_x() {\n\n std::cout << \"\\t making\
    \ X\" << std::endl;\n\n             };\n\n };\n\n}; // end Decorator\n```\n\n\
    # 11. Implementing the Façade pattern\n\n## Solution\n\nThe façade pattern is\
    \ used to provide a simplified interface to a large code segment so that the customers\
    \ can only focus on the needed functionalities. This pattern is frequently used\
    \ to reduce external code dependencies on the inner details of a library.\n\n\
    In this example three classes `A`, `B`, `C` are wrapped by one only class `façade`\
    \ which simplifies the access to all former classes.\n\n### Code\n\n```cpp\nnamespace\
    \ Facade{\n\n // \"facade\" object that provides a single, simplified\n\n // interface\
    \ to the many individual interfaces within\n\n // the subsystem.\n class A{\n\n\
    \ public:\n\n A() { std::cout << \"\\tInit A\" << std::endl; }\n\n  void make()\
    \ { std::cout << \"\\tmake A\" << std::endl; }\n\n };\n\n class B{\n\n public:\n\
    \n B() { std::cout << \"\\tInit B\" << std::endl; }\n\n  void make() { std::cout\
    \ << \"\\tmake B\" << std::endl; }\n\n };\n\n class C{\n\n public:\n\n C() { std::cout\
    \ << \"\\tInit C\" << std::endl; }\n\n  void make() { std::cout << \"\\tmake C\"\
    \ << std::endl; }\n\n };\n\n Class Facade{\n\n public:\n\n             Facade()\
    \ { a_.make(); b_.make(); c_.make(); }\n\n private:\n\n  A a_;\n\n  B b_;\n\n\
    \  C c_;\n\n };\n\n}; //end facade\nvoid testFacade(){\n\n using  namespace Structural_Patterns::Facade;\n\
    \n Facade f;\n\n}\n```\n\n# 12. Implementing the Flyweight pattern\n\n## Solution\n\
    \nThe flyweight pattern is used for reducing the costs of creating a large number\
    \ of similar objects. This is particularly important in those situations where\
    \ performance is critical.\n\nIn this example `Icon` is a lightweight class which\
    \ is stored in a vector contained within the `FlyweightFactory`. In this way a\
    \ specific icon is nothing but a pointer to a specific object shared by every\
    \ single instance of the same icon used by the windows system.\n\n### Code\n\n\
    ```cpp\nnamespace Flyweight{\n\n //The Flyweight pattern shares objects and reduce\
    \ costs\n\n // in terms of memory and increase performance\n\n //\n\n // Clients\
    \ should not instantiate Flyweights directly,\n\n // they should obtain them exclusively\
    \ from a\n\n // FlyweightFactory object to shar properly.\n class Icon { // don't\
    \ have a \"huge\" object for each Icon\n\n public:\n\n             Icon(unsigned\
    \  int  i) : shared_name_(i) {};\n\n  unsigned  int getName(){ return shared_name_;\
    \ }\n\n private:\n\n  unsigned  int shared_name_;\n\n };\n\n class FlyweightFactory{\n\
    \n public:\n\n  static  Icon * getIcon(unsigned  int  name)\n\n              \
    \ {\n\n                              std::vector<Icon *>::const_iterator it, it_end;\n\
    \n                              it = icons_.begin();\n\n                     \
    \         it_end = icons_.end();\n\n  for (; it != it_end; ++it){\n  if ((*it)->getName()\
    \ == name){\n\n                                            std::cout <<\n\n  \"\
