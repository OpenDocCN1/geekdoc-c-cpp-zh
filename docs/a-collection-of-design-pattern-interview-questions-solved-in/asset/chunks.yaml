    }\n```\n\n# 3. 实现工厂模式\n\n## 解决方案\n工厂方法使用工厂来创建对象，而不需要显式地识别将创建的对象的精确类型。通常，工厂模式利用继承机制，并将实际创建过程委托给子类。工厂经常用于避免代码重复和抽象通用功能。从这个意义上说，父类通过使用创建步骤纯虚拟占位符来指定通用行为。然后，父类将创建细节委托给客户端提供的子类。\n\
    \n工厂模式可以看作是抽象工厂模式的简化版。工厂方法负责创建属于某一个家族的产品，而抽象工厂模式处理多个家族的产品。例如，使用工厂方法，你可以生产某个特定接口（如\
    \ `IAutomobile`）的实现类（如 SUV、旅行车、敞篷车等..），而使用抽象工厂方法，你可以生产特定工厂接口的实现（例如给定一个车辆家族中的所有类型的汽车，包括汽车、卡车、房车等等等等）。\n\
    \n在这个示例中，我们有一个基类和两个派生类 A 和 B，可以根据特定需求选择它们来交换实现。与第 10 页提供的示例唯一的区别在于 `OSX_Button`\
    \ 和 `Windows_Button` 代表了通用按钮家族中针对特定操作系统的特定工厂接口。\n\n### 代码\n```cpp\nnamespace Factory_Method{\n\
    \ // 定义一个用于创建对象的接口，\n   // 但让子类决定实例化哪个类。\n   // 工厂方法允许类将实例化推迟给\n   // 子类。\n  \
    \ //\n   // 工厂方法可以多次返回同一个实例，\n   // 或者返回一个子类而不是该精确类型的对象。\n  class Base{\n  public:\n\
    \    virtual void what_to_do() = 0;\n  };\n\n  class A : public Base{\n  public:\n\
    \    A() { std::cout << \"\\tClass A\" << std::endl; }\n    void what_to_do()\
    \ { };\n  };\n\n  class B : public Base{\n  public:\n    B() { std::cout << \"\
    \\tClass B\" << std::endl; }\n    void what_to_do() { };\n  };\n}; // end Factory\
    \ Method\n\nvoid testFactoryMethod() {\n  using namespace Creational_Patterns::Factory_Method;\n\
    \  Base * b = new A();\n  b->what_to_do();\n  delete b;\n\n  b = new B();\n  b->what_to_do();\n\
    \  delete b;\n}\n```\n\n# 4. 实现原型模式\n\n## 解决方案\n原型模式创建一个原型实例并对其进行克隆。当克隆的成本低于创建新对象的成本时，这种模式非常有效。在例示例中，我们定义了一个抽象基类，它指定了一个受保护方法，并让子类注册自己。\n\
    \n### 代码\n```cpp\nnamespace Prototype{\n // 使用受保护方法指定\n // 要创建的对象类型，\n // 并维护一个静态数组。\n\
    \ class Base {\n public:\n  virtual Base* clone() = 0;\n  virtual void doSomething()\
    \ = 0;\n };\n\n class Factory {\n public:\n  static Base* makeBase(int choice);\n\
    \ private:\n  static Base* s_prototypes[];\n };\n\n class A : public Base {\n\
    \ public:\n  Base* clone() override { return new A(*this); }\n  void doSomething()\
    \ override { std::cout << \"A is doing\\n\"; }\n };\n\n class B : public Base\
    \ {\n public:\n  Base* clone() override { return new B(*this); }\n  void doSomething()\
    \ override { std::cout << \"B is doing\\n\"; }\n };\n\n Base* Factory::s_prototypes[]\
    \ = { new A(), new B() };\n\n Base* Factory::makeBase(int choice) {\n  return\
    \ s_prototypes[choice]->clone();\n }\n}; // end Prototype\n\nvoid testPrototype()\
    \ {\n  using namespace Prototype;\n  Base * b = Factory::makeBase(0);\n  b->doSomething();\n\
    \  delete b;\n\n  b = Factory::makeBase(1);\n  b->doSomething();\n  delete b;\n\
    }\n```\n\n# 5. 实现单例模式\n\n## 解决方案\n该模式将类的实例化限制为单个对象。在线程环境中，构造函数通常是私有的，并且只通过检查空为空来初始化一次静态实例。\n\
    \n### 代码\n```cpp\nnamespace Singleton{\n // 确保类只有一个实例，\n // 并为其提供一个全局访问点。\n class\
    \ Single{\n public:\n  static Single * getInstance(void) {\n  if (!instance_){\n\
    \  instance_ = new Single();\n  }\n  return instance_;\n  }\n\n\n\nprivate:\n\
    \  // 不能被调用\n  Single(){ std::cout << \"\\tSingle\" << std::endl; };\n  static\
    \ Single * instance_; // 一个单例实例\n}; // end Singleton\n\nvoid testSingleton() {\n\
    \  using namespace Singleton;\n  Single * s = Single::getInstance();\n  delete\
    \ s;\n}\n```\n\n## 解决方案 – 双重检查锁定模式 (DCLP)\n在多线程环境中，必须在访问单例实例之前获取 `lock()`，以避免在跨线程时产生冲突。这通过下面所示的代码片段实现：该解决方案始终是正确的，但它需要始终执行昂贵的锁。有时使用的优化方案是所谓的双重检查锁定模式\
    \ (DCLP)，它在尝试获取锁之前会测试值是否为空。\n\n### 代码\n```cpp\nSingleton* Singleton::instance()\
    \ {\nLock lock; // 获取锁 \n if (pInstance == 0) {\n pInstance = new Singleton;\n\
    \ }\n return pInstance;\n} // 释放锁（通过 Lock 析构函数）\n\nSingleton* Singleton::instance()\
    \ {\n if (pInstance == 0) { // 第一次测试\n Lock lock;\n  if (pInstance == 0) { //\
    \ 第二次测试\n pInstance = new Singleton;\n  }\n }\n return pInstance;\n}\n```\n\n\
    6. 实现对象池模式\n\n"
- fmt: "\nThe Object pool is a pattern used for caching objects and avoiding expensive\
    \ re-creations. This pattern is frequently used for objects representing the connection\
    \ to a database shared among multiple clients. For instance this pattern has been\
    \ used for implementing java JDBC drivers[[3]](#part0000.html__ftn3).\n\nIn this\
    \ simplified example we allocated a cache of three objects but decided to adopt\
    \ a very naïve cache policy which always returns the first object in the cache.\
    \ More sophisticate allocation strategies can be adopted according to different\
    \ needs. Also, locking strategies should be adopted in a multi-thread environment.\n\
    \n### Code\n\n```cpp\nnamespace Object_Pool{\n   // Object pools are used to manage\
    \ the object caching.\n   // A client with access to an Object pool can avoid\n\
    \   // creating a new Objects by simply asking the pool\n   // for one that has\
    \ already been instantiated instead.\n  static  const int num_objects = 3;\n\n\
    \  class  Object_to_share{\n  public:\n    Object_to_share(){\n      std::cout\
    \ << \"\\tAn object to share\" << std::endl;\n    };\n  };\n\n  class  Pool{\n\
    \  public:\n    Object_to_share * getObject(void){\n      std::cout << \"\\tGetting\
    \ object\" << std::endl;\n      return &(objpool_[0]);\n    }\n  private:\n  \
    \  // could allocate dynamically\n    Object_to_share objpool_[num_objects];\n\
    \  };\n}; // end ObjectPool\n\nvoid testObjectPool(){\n  using namespace Creational_Patterns::Object_Pool;\n\
    \  Object_to_share o;\n  Pool p;\n  p.setObject(&o);\n  Object_to_share * ptr\
    \ = p.getObject();\n}\n```\n\n# Structural Patterns\n\nStructural patterns compose\
    \ interfaces by leveraging inheritance. The composition of objects allows to create\
    \ new functionalities, simplify interfaces, adapt heterogeneous objects, improve\
    \ performances, and reduce complexity.\n\n# 7. Implementing the Adapter pattern\n\
    \n## Solution\n\nThe adapter patter is used to allow operations between classes\
    \ with incompatible interfaces by means of an appropriate wrapper.\n\nIn this\
    \ example the adapter class inherits publically a `DesiredInterface` and privately\
    \ a `LegacyInterface`. `DesiredInterface` is implemented according to a pure virtual\
    \ method which is implemented by the adapter to make the existing class work with\
    \ others without modifying their source code. An alternative and more modern implementation\
    \ driven by templates instead of private inheritance is also provided.\n\n###\
    \ Code\n\n```cpp\nnamespace Adapter{\n  // The Adapter pattern allows otherwise\
    \ incompatible\n  // classes to work together by converting the interface\n  //\
    \ of one class into an interface expected by the\n  // clients.\n  class  DesiredInterface{\n\
    \  public:\n    virtual  void make() = 0;\n  };\n\n  class  LegacyInterface{\n\
    \  public:\n    LegacyInterface() {\n      std::cout << \"\\tCalled legacy\" <<\
    \ std::endl;\n    };\n  };\n\n  // privately inherits the legacy component\n \
    \ class  adapter : public  DesiredInterface,\n  private  LegacyInterface{\n  public:\n\
    \    adapter() : LegacyInterface(){};\n    void make() {\n      std::cout << \"\
    \\tAdapter do something \" << std::endl;\n    }\n  };\n}; //end adapter\n\nvoid\
    \ testAdapter()\n{\n  using namespace Structural_Patterns::Adapter;\n  adapter\
    \ * a = new  adapter();\n  a->make();\n  delete a;\n}\n\ntemplate<typename  T>\n\
    struct  GenericVehicleAdapter : VehicleInterface {\n  GenericVehicleAdapter(T*\
    \ x) : m(x) { }\n  virtual  void Run() { return m->Run(); }\n  T* m;\n};\n\nvoid\
    \ testTemplateAdapter() {\n  Shuttle shuttle;\n  GenericAdapter<Shuttle> vehiclelike(&shuttle);\n\
    }\n```\n\n# 8. Implementing the Bridge pattern\n\n## Solution\n\nThe bridge pattern\
    \ decouples the abstraction from its concrete implementation. In this way they\
    \ can evolve independently. Following this patter the class itself can be considered\
    \ as on specific implementation, while it is more generically seen as an abstraction.\
    \ In C++ this pattern is sometime confused with the PIMPL (private implementation)[[4]](#part0000.html__ftn4).\
    \ However there are differences. PIMPL is a way of hiding the implementation.\
    \ This is in order to break compilation dependencies. The Bridge pattern on the\
    \ other hand is a way of supporting multiple implementations.\n\nIn this example\
    \ the class `bridge` has a pointer `bridge_imp` and the two illustrative subclasses\
    \ `a` and `b` provide specific implementation by means of the `a_imp` and `b_impi`\
    \ classes.\n\n### Code\n\n```cpp\nnamespace Bridge{\n//// Decouple an abstraction\
    \ from its implementation so that the\n// two can vary independently. This is\
    \ different from\n// Adapter which makes unrelated classes work together.\n  class\
    \  BridgeImp{ // de-couple\n  public:\n    BridgeImp() {};\n  protected:\n   \
    \ int my_data_;\n  };\n\n  class  Bridge{\n  public:\n    Bridge() {};\n  protected:\n\
    \    BridgeImp * imp_;\n  };\n\n  class  AImp : public  BridgeImp{ // implement\n\
    \  public:\n    AImp() { my_data_ = 1; }\n  };\n\n  class  A : public  Bridge{\
    \ // hierarchy\n  public:\n    A() {\n      imp_ = new AImp();\n      std::cout\
    \ << \"\\tcreated a\" << std::endl;\n    }\n    ~A() {\n      delete imp_;\n \
    \     std::cout << \"\\tdeleted a\" << std::endl;\n    }\n  };\n\n  class  BImp\
    \ : public  BridgeImp{ // implement\n  public:\n    BImp() { my_data_ = 2; }\n\
    \  };\n\n  class  B : public  Bridge{ // hierarchy\n  public:\n    B() {\n   \
    \   imp_ = new BImp();\n      std::cout << \"\\tcreated b\" << std::endl;\n  \
    \  }\n    ~B() {\n      delete imp_;\n      std::cout << \"\\tdeleted b\" << std::endl;\n\
    \    }\n  };\n}; // end Bridge\n\nvoid testBridge()\n{\n  using namespace Structural_Patterns::Bridge;\n\
    \  A bridge;\n  B bridge;\n}\n```\n\n# 9. Implementing the Composite pattern\n\
    \n## Solution\n\nThe composite pattern is used to compose multiple objects with\
    \ common behaviour in such a way they can be operated as one object. In this example\
    \ the `Component` class is implemented at its turn by the subclass `Leaf` and\
    \ the subclass `Composite`. In addition `Composite` maintains a vector where `Components`\
    \ are inserted.\n\n### Code\n\n```cpp\nnamespace Composite{\n// Compose objects\
    \ into tree structures to represent\n// whole hierarchies.\n  class  Component{\n\
    \  public:\n    virtual  void traverse() = 0; // pure virtual\n  };\n\n  class\
    \  Leaf : public  Component{\n  private:\n    int value_; // whatever you need\
    \ here\n  public:\n    Leaf(int val) : value_(val) {};\n    void traverse() {\
    \ std::cout << value_ << \" \"; }\n  };\n\n  class  Composite : public  Component{\n\
    \  private:\n    std::vector< Component * > children_;\n    typedef std::vector<\
    \ Component * >const__iterator_const_it;\n  public:\n    void add(Component *\
    \ e) { children_.push_back(e); };\n    void traverse() {\n      comp_const_it\
    \ it = children_.begin();\n      comp_const_it it_end = children_.end();\n   \
    \   for (; it != it_end; ++it) {\n        (*it)->traverse();\n      }\n    }\n\
    \  };\n}; // end composite\n\nvoid testComposite(){\n  using namespace Structural_Patterns::Composite;\n\
    \  Leaf l1(1);\n  Leaf l2(2);\n  Composite c;\n  c.add(&l1); c.add(&l2);\n  c.traverse();\n\
    }\n```\n\n# 10. Implementing the Decorator pattern\n\n## Solution\n\nThe decorator\
    \ pattern is used to add additional behaviours to a method that is already existing\
    \ for an object. In certain situations the existing behaviour is completely overridden.\
    \ Those additional behaviours can be either permanent, or transient, or dynamically\
    \ added at run-time.\n\nIn this example class `A_and_X` inherit from `A` and implements\
    \ the virtual method `make()` accordingly.\n\n### Code\n\n```cpp\nnamespace Decorator{\n\
    \  // Attach additional responsibilities to an object\n  // dynamically. Decorators\
    \ provide a flexible alternative\n  // to subclassing for extending functionality.\n\
    \  class  A{\n  public:\n    A() { std::cout << \"\\tA\" << std::endl; }\n   \
    \ virtual  void make(void) {\n      std::cout << \"\\t making A\" << std::endl;\n\
    \    }\n  };\n}\n```\n"
  raw: "The Object pool is a pattern used for caching objects and avoiding expensive\
    \ re-creations. This pattern is frequently used for objects representing the connection\
    \ to a database shared among multiple clients. For instance this pattern has been\
    \ used for implementing java JDBC drivers[[3]](#part0000.html__ftn3).\n\nIn this\
    \ simplified example we allocated a cache of three objects but decided to adopt\
    \ a very naïve cache policy which always returns the first object in the cache.\
    \ More sophisticate allocation strategies can be adopted according to different\
    \ needs. Also,  locking strategies should be adopted in a multi-thread environment.\n\
    \nCode\n\nnamespace Object_Pool{\n\n // Object pools are used to manage the object\
    \ caching.\n\n // A client with access to an Object pool can avoid\n\n // creating\
    \ a new Objects by simply asking the pool\n\n // for one that has already been\
    \ instantiated instead.\n\n static  const  int num_objects = 3;\n\n class  Object_to_share{\n\
    \n public:\n\n               Object_to_share(){\n\n std::cout << \"\\tAn object\
    \ to share\" << std::endl;\n\n               };\n\n };\n\n class  Pool{\n\n public:\n\
    \n  Object_to_share * getObject(void){\n\n std::cout << \"\\tGetting object\"\
    \ << std::endl;\n\n  return &(objpool_[0]);\n\n               }\n\n private:\n\
    \n  // could allocate dynamically\n\n  Object_to_share objpool_[num_objects];\n\
    \n };\n\n}; // end ObjectPool\n\nvoid testObjectPool(){\n\n using  namespace Creational_Patterns::Object_Pool;\n\
    \n Object_to_share o;\n\n Pool p;\n\n p.setObject(&o);\n\n Object_to_share * ptr\
    \ = p.getObject();\n\n}\n\n# Structural Patterns\n\nStructural patterns compose\
    \ interfaces by leveraging inheritance. The composition of objects allows to create\
    \ new functionalities, simplify interfaces, adapt heterogeneous objects, improve\
    \ performances, and reduce complexity.\n\n# 7. Implementing the Adapter pattern\n\
    \n## Solution\n\nThe adapter patter is used to allow operations between classes\
    \ with incompatible interfaces by means of an appropriate wrapper.\n\nIn this\
    \ example the adapter class inherits publically a DesideredInterface and privately\
    \ a LegacyInterface.  DesideredInterface is implemented according to a pure virtual\
    \ method which is implemented by the adapter to make the existing class work with\
    \ others without modifying their source code. An alternative and more modern implementation\
    \ driven by templates instead of private inheritance is also provided.\n\nCode\n\
    \nnamespace Adapter{\n\n // The Adapter pattern allows otherwise incompatible\n\
    \n // classes to work together by converting the interface\n\n // of one class\
    \ into an interface expected by the\n\n // clients.\n\n class  DesiredInterface{\n\
    \n public:\n\n  virtual  void make() = 0;\n\n };\n\n class  LegacyInterface{\n\
    \n public:\n\n               LegacyInterface() {\n\n std::cout << \"\\tCalled\
    \ legacy\" << std::endl;\n\n               };\n\n };\n\n // privately inherits\
    \ the legacy component\n\n class  adapter : public  DesiredInterface,\n\n  private\
    \  LegacyInterface{\n\n public:\n\n adapter() : LegacyInterface(){};\n\n  void\
    \ make() {\n\n std::cout << \"\\tAdapter do something \"\n\n<< std::endl;\n\n\
                                }\n\n };\n\n}; //end adapter\n\nvoid testAdapter()\n\
    \n{\n\n using  namespace Structural_Patterns::Adapter;\n\n adapter * a = new \
    \ adapter();\n\n a->make();\n\n delete a;\n\n}\n\ntemplate<typename  T>\n\nstruct\
    \  GenericVehicleAdapter : VehicleInterface {\n\n GenericVehicleAdapter(T* x)\
    \ : m(x) { }\n\n virtual  void Run() { return m->Run(); }\n\n T* m;\n\n};\n\n\
    void testTemplateAdapter() {\n\n Shuttle shuttle;\n\n GenericAdapter<Shuttle>\
    \ vehiclelike(&shuttle);\n\n}\n\n# 8. Implementing the Bridge pattern\n\n## Solution\n\
    \nThe bridge pattern decouples the abstraction from its concrete implementation.\
    \ In this way they can evolve independently. Following this patter the class itself\
    \ can be considered as on specific implementation, while it is more generically\
    \ seen as an abstraction. In C++ this pattern is sometime confused with the PIMPL\
    \ (private implementation)[[4]](#part0000.html__ftn4). However there are differences.\
    \ PIMPL is a way of hiding the implementation. This is in order to break compilation\
    \ dependencies. The Bridge pattern on the other hand is a way of supporting multiple\
    \ implementations.\n\nIn this example the class bridge has a pointer bridge_imp\
    \ and the two illustrative subclasses a and b provide specific implementation\
    \ by means of the a_imp and b_impi classes.\n\nCode\n\nnamespace Bridge{\n\n//\n\
    \n// Decouple an abstraction from its implementation so that the\n\n// two can\
    \ vary independently. This is different from\n\n// Adapter which makes unrelated\
    \ classes work together.\n\n class  BridgeImp{ // de-couple\n\n public:\n\n              \
    \ BridgeImp() {};\n\n protected:\n\n  int my_data_;\n\n };\n\n class  Bridge{\n\
    \n public:\n\n               Bridge() {};\n\n protected:\n\n  BridgeImp * imp_;\n\
    \n };\n\n class  AImp : public  BridgeImp{ // implementat. hierarchy\n\n public:\n\
    \n               AImp() { my_data_ = 1; }// what you need here\n\n};\n\nclass\
    \  A : public  Bridge{ // hierarchy\n\npublic:\n\n               A(){\n\n imp_\
    \ = new  AImp();\n\n std::cout << \"\\tcreated a\" << std::endl;\n\n              \
    \ };\n\n               ~A(){\n\n  delete imp_;\n\n std::cout << \"\\tdeleted a\"\
    \ << std::endl;\n\n               }\n\n};\n\nclass  BImp : public  BridgeImp{\
    \ // implement. hierarchy\n\npublic:\n\nBImp() { my_data_ = 2; }; // what you\
    \ need here\n\n};\n\nclass  B : public  Bridge{ // hierarchy\n\npublic:\n\n              \
    \ B() {\n\n imp_ = new  BImp();\n\n std::cout << \"\\tcreated b\" << std::endl;\n\
    \n               };\n\n               ~B(){\n\n  delete imp_;\n\n std::cout <<\
    \ \"\\tdeleted b\" << std::endl;\n\n               }\n\n};\n\n}; // end Bridge\n\
    \nvoid testBridge()\n\n{\n\n using  namespace Structural_Patterns::Bridge;\n\n\
    \ A bridgeA;\n\n B bridgeB;\n\n}\n\n# 9. Implementing the Composite pattern\n\n\
    ## Solution\n\nThe composite pattern is used to compose multiple objects with\
    \ common behaviour in such a way that they can be operated as one single object.\
    \ A typical use is with a tree-like object composition.\n\nIn this example the\
    \ Component class is implemented according to a pure virtual method traverse,\
    \ which is implemented at its turn by the subclass Leaf and by the subclass Composite.\
    \ In addition Composite maintains a vector of pointers where Components are inserted.\
    \ This vector is used to iterate the whole structure.\n\nCode\n\nnamespace Composite{\n\
    \n // Compose objects into tree structures to represent\n\n // whole-part hierarchies.\
    \ Recursive composition\n\n class  Component{\n\n public:\n\n  virtual  void traverse()\
    \ = 0; // pure virtual\n\n };\n\n class  Leaf : public  Component{\n\n private:\n\
    \n  int value_; // whatever you need here\n\n public:\n\n               Leaf(int\
    \  val) : value_(val) {};\n\n  void traverse() { std::cout << value_ << \" \"\
    ; }\n\n };\n\n class  Composite : public  Component{\n\n private:\n\n              \
    \ std::vector< Component * > children_;\n\n  typedef std::vector< Component *\
    \ >::const_iterator  comp_const_it;\n\n public:\n\n  void add(Component * e) {\
    \ children_.push_back(e); };\n\n void traverse()\n\n               {\n\n  comp_const_it\
    \ it = children_.begin();\n\n  comp_const_it it_end = children_.end();\n\n  for\
    \ (; it != it_end; ++it)\n\n                                           (*it)->traverse();\n\
    \n               }\n\n };\n\n}; // end composite\n\nvoid testComposite(){\n\n\
    \ using  namespace Structural_Patterns::Composite;\n\n Leaf l1(1);\n\n Leaf l2(2);\n\
    \n Composite c;\n\n c.add(&l1); c.add(&l2);\n\n c.traverse();\n\n}\n\n# 10.  Implementing\
    \ the Decorator pattern\n\n## Solution\n\nThe decorator pattern is used to add\
    \ additional behaviours to a method that is already existing for an object. In\
