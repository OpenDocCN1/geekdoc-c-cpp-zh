    \ © 2014 Antonio Gulli\n保留所有权利。\n\nISBN:\nISBN-13:\n\n《设计模式》是 25 章系列教程中的第四部分，该系列专注于算法、问题解决和\
    \ C++ 编程。\n\n## 献辞\n献给 Aurora，感谢她带来的生活的乐趣\n\n## 致谢\n感谢 Francesco Nidito 的代码审查\n\
    \n## 目录\n- [目录]\n- [设计模式]\n- [创建型模式]\n- [1. 实现抽象工厂模式]\n    - [解决方案]\n- [2. 实现建造器模式]\n\
    \    - [解决方案]\n- [3. 实现工厂模式]\n    - [解决方案]\n- [4. 实现原型模式（原型模式）]\n    - [解决方案]\n\
    - [5. 实现单例模式]\n    - [解决方案]\n    - [解决方案 – 双重检查锁定模式 (DCLP)]\n- [6. 实现对象池模式]\n\
    \    - [解决方案]\n- [结构型模式]\n- [7. 实现适配器模式]\n    - [解决方案]\n- [8. 实现桥接模式]\n    - [解决方案]\n\
    - [9. 实现组合模式]\n    - [解决方案]\n- [10. 实现装饰器模式]\n    - [解决方案]\n- [11. 实现外观模式]\n \
    \   - [解决方案]\n- [12. 实现享重量模式]\n    - [解决方案]\n- [13. 实现代理模式]\n    - [解决方案]\n- [行为型模式]\n\
    - [14. 实现责任链模式]\n    - [解决方案]\n- [15. 实现命令模式]\n    - [解决方案]\n- [16. 实现解释器模式]\n\
    \    - [解决方案]\n- [17. 实现迭代器模式]\n    - [解决方案]\n- [18. 实现中介者模式]\n    - [解决方案]\n\
    - [19. 实现备忘模式]\n    - [解决方案]\n- [20. 实现观察者模式]\n    - [解决方案]\n- [21. 实现状态模式]\n\
    \    - [解决方案]\n- [22. 实现策略模式]\n    - [解决方案]\n- [23. 实现模板方法模式]\n    - [解决方案]\n\
    - [24. 实现访问者模式]\n    - [解决方案]\n- [25. 实现命令模式]\n    - [解决方案]\n\n设计模式是一组用于解决软件设计中反复出现问题的模型。它们起源于所谓的“四人帮”（Gamma\
    \ 等）出版的《设计模式：可复用面向对象设计的基础》一书。\n\n设计模式分为三种类型：\n1) 创建型模式，涉及对象的创建机制。\n2) 结构型模式，涉及类和对象的组合结构。\n\
    3) 行为型模式，涉及对象之间的通信。\n\n## 创建型模式\n创建型模式代表他人创建对象，而不是直接实例化它们。它们使用了继承。\n\n### 1. 实现抽象工厂模式\n\
    #### 解决方案\n抽象工厂背后的直觉是封装一组具有共同接口的工厂。该模式允许在不指定具体类的情况下交换具体的实现。在这个示例中，`Widget` 类有一个纯虚方法。派生自该类的两个类实现了特定的\
    \ `draw()` 行为。\n\n```cpp\nnamespace Abstract_Factory{\n // 工厂模式建议在工厂\n // 基类中定义创建\n\
    \ // 服务，并并在每个独立的派生 \n // 类中实现每个“平台”。\n class Widget{\n public:\n  virtual  void\
    \ draw() = 0; // 设为纯虚函数\n};\n\n class OSX_Button : public Widget{\n public:\n\
    \  void draw() {\n    std::cout << \"OSX buttom\" << std::endl;\n  }\n};\n\n class\
    \ Windows_Button : public Widget{\n public:\n  void draw() {\n    std::cout <<\
    \ \"Windows buttom\" << std::endl;\n  }\n};\n\n}; // 抽象工厂结束\n\nvoid testAbstractFactory(){\n\
    \ using namespace Creational_Patterns::Abstract_Factory;\n Widget * w = new OSX_Button();\n\
    \ w->draw();\n delete w;\n}\n```\n\n### 2. 实现建造器模式\n#### 解决方案\n建造器模式的目标是将复杂对象的构建与其表示分离，使得相同的构建过程可以创建不同的表示。该模式没有使用不同的构造函数，而是定义了一个单一对象：建造器。该对象根据用户定义的配置参数逐步构建所需对象。\n\
    建造器与抽象工厂的不同之处在于，前者将实际对象的构建委托给特定的辅助类/对象，而后者使用继承。\n\n在这个示例中，`Builder` 类是一个纯虚方法 `configure()`\
    \ 实现的，该方法在每个子类中均被定义，用于设置驱动每个子类构建过程的参数。\n\n```cpp\nnamespace Builder{\n // 将复杂对象的构建与其\n\
    \ // 表示分离，以便相同的构建过程\n // 可以创建不同的表示。\n class Build{ base class\n public:\n  virtual\
    \  void configure() = 0;\n // 此处可以添加方法来查看内部状态\n protected:\n  int configuration_1_;\
    \ // 所有配置变量\n  int configuration_2_; // 所有配置变量\n```\n\n"
- fmt: "\n```cpp\nint configuration_n_; // all the confs variable\n};\n\nclass SimpleBuilder\
    \ : public Build { // a derived class\npublic:\n  SimpleBuilder() {\n    // here\
    \ you can add explicit tests on configuration\n    // parameters for driving the\
    \ ‘simple builder’\n    // creation steps\n    std::cout << \"\\tSimple Builder\"\
    \ << std::endl;\n  }\n\n  void configure() {\n    // here you can add additional\
    \ configuration steps\n  }\n};\n\nclass AdvancedBuilder : public Build { // a\
    \ derived class\npublic:\n  AdvancedBuilder() {\n    // here you can add explicit\
    \ tests on configuration\n    // parameters for driving the ‘advanced builder’\n\
    \    // creation steps\n    std::cout << \"\\tAdvanced Builder\" << std::endl;\n\
    \  }\n\n  void configure() {\n    // here you can add additional configuration\
    \ steps\n  }\n};\n\n// the class that use multiple builders\nclass ClientClass\
    \ {\npublic:\n  ClientClass(Build * builder) : builder_(builder){};\n\nprivate:\n\
    \  Build * builder_; // stores the specific builder\n};\n\n // end Builder\n\n\
    void testBuilder() {\n  using namespace Creational_Patterns::Builder;\n  Build\
    \ * builder = new AdvancedBuilder();\n  Client c(builder);\n  delete builder;\n\
    }\n```\n\n# 3. Implementing the Factory pattern\n\n## Solution\nThe factory method\
    \ uses factories for creating objects with no explicit need of identifying the\
    \ exact class of object that will be created. Typically the factory pattern leverages\
    \ the inheritance mechanism with the actual creation process delegated to subclasses.\
    \ Factory is frequently used for avoiding duplication of code and for abstracting\
    \ common functionalities. In this sense a superclass specifies generic behaviours\
    \ by using pure virtual placeholders for creation steps. Then the superclass delegates\
    \ the creation details to subclasses that are supplied by the client.\n\nFactory\
    \ patterns can be seen as a simplified version of an Abstract Factory pattern.\
    \ The Factory Method pattern is responsible of creating products that belong to\
    \ one family, while the Abstract Factory pattern deals with multiple families\
    \ of products. For example, with the Factory method you can produce implementations\
    \ (say SUV, Station Wagons, Convertibles, ..) of one specific interface (say `IAutomobile`),\
    \ while with the Abstract Factory method you can produce implementations of a\
    \ particular Factory interface (say all the type of automobiles given a family\
    \ of vehicles including cars, trucks, caravan, and so on and so forth).\n\nIn\
    \ this example we have one base class and two derived classes A and B which can\
    \ be selected for exchanging the implementation according to specific needs. The\
    \ only difference with the example provided at page 10 is that `OSX_Button` and\
    \ `Windows_Button` represent a particular Factory interface for the specific operative\
    \ system within the families of generic buttons.\n\n### Code\n```cpp\nnamespace\
    \ Factory_Method{\n // Define an interface for creating an object,\n   // but\
    \ let subclasses decide which class to instantiate.\n   // Factory Method lets\
    \ a class defer instantiation to\n   // subclasses.\n   //\n   // Factory Method\
    \ can return the same instance multiple\n   // times, or can return a subclass\
    \ rather than an object\n   // of that exact type.\n  class Base{\n  public:\n\
    \    virtual void what_to_do() = 0;\n  };\n\n  class A : public Base{\n  public:\n\
    \    A() { std::cout << \"\\tClass A\" << std::endl; }\n    void what_to_do()\
    \ { };\n  };\n\n  class B : public Base{\n  public:\n    B() { std::cout << \"\
    \\tClass B\" << std::endl; }\n    void what_to_do() { };\n  };\n}; // end Factory\
    \ Method\n\nvoid testFactoryMethod() {\n  using namespace Creational_Patterns::Factory_Method;\n\
    \  Base * b = new A();\n  b->what_to_do();\n  delete b;\n\n  b = new B();\n  b->what_to_do();\n\
    \  delete b;\n}\n```\n\n# 4. Implementing the Prototype pattern\n\n## Solution\n\
    The prototype pattern creates a prototypical instance which is cloned. This pattern\
    \ is very effective when the cost of cloning is less than creating a new object.\
    \ In this example we define an abstract base class that specifies a protected\
    \ method, and subclasses register themselves.\n\n### Code\n```cpp\nnamespace Prototype{\n\
    \ // Specify the kinds of objects to\n // create using a protected\n // method,\
    \ and maintains a static array.\n class Base {\n public:\n  virtual Base* clone()\
    \ = 0;\n  virtual void doSomething() = 0;\n };\n\n class Factory {\n public:\n\
    \  static Base* makeBase(int choice);\n private:\n  static Base* s_prototypes[];\n\
    \ };\n\n class A : public Base {\n public:\n  Base* clone() override { return\
    \ new A(*this); }\n  void doSomething() override { std::cout << \"A is doing\\\
    n\"; }\n };\n\n class B : public Base {\n public:\n  Base* clone() override {\
    \ return new B(*this); }\n  void doSomething() override { std::cout << \"B is\
    \ doing\\n\"; }\n };\n\n Base* Factory::s_prototypes[] = { new A(), new B() };\n\
    \n Base* Factory::makeBase(int choice) {\n  return s_prototypes[choice]->clone();\n\
    \ }\n}; // end Prototype\n\nvoid testPrototype() {\n  using namespace Prototype;\n\
    \  Base * b = Factory::makeBase(0);\n  b->doSomething();\n  delete b;\n\n  b =\
    \ Factory::makeBase(1);\n  b->doSomething();\n  delete b;\n}\n```\n\n# 5. Implementing\
    \ the Singleton pattern\n\n## Solution\nThis pattern restricts the instantiation\
    \ of a class to one single object. In a thread environment the constructor is\
    \ typically private and a static instance is initialized only once by checking\
    \ its nullness.\n\n### Code\n```cpp\nnamespace Singleton{\n // Ensure a class\
    \ has only one instance,\n // and provide a global point of access to it.\n class\
    \ Single{\n public:\n  static Single * getInstance(void) {\n  if (!instance_){\n\
    \  instance_ = new Single();\n  }\n  return instance_;\n  }\n\n\n\nprivate:\n\
    \  // cannot be invoked\n  Single(){ std::cout << \"\\tSingle\" << std::endl;\
    \ };\n  static Single * instance_; // a single instance\n}; // end Singleton\n\
    \nvoid testSingleton() {\n  using namespace Singleton;\n  Single * s = Single::getInstance();\n\
    \  delete s;\n}\n```\n\n## Solution – The double checked locked pattern (DCLP)\n\
    In a multi-threaded environment it is mandatory to acquire a `lock()` before accessing\
    \ the singleton instance for not incurring in conflicts across threads. This is\
    \ achieved by the first code snippet reported below: the solution is always correct\
    \ but it needs to always perform an expensive lock. An optimization sometimes\
    \ used is the so called double checked locked pattern (DCLP), which tests for\
    \ the value being null before trying to acquire a lock.\n\n### Code\n```cpp\n\
    Singleton* Singleton::instance() {\nLock lock; // acquire lock \n if (pInstance\
    \ == 0) {\n pInstance = new Singleton;\n }\n return pInstance;\n} // release lock\
    \ (via Lock destructor)\n\nSingleton* Singleton::instance() {\n if (pInstance\
    \ == 0) { // 1st test\n Lock lock;\n  if (pInstance == 0) { // 2nd test\n pInstance\
    \ = new Singleton;\n  }\n }\n return pInstance;\n}\n```\n\n6. Implementing the\
    \ Object pool pattern\n"
