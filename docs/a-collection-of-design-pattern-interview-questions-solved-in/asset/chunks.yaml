    ```\n\n# 18. 实现中者模式\n\n## 解决方案\n\n中者模式允许类之间实现松耦合。每个类不需要过多了解其他类，而是通过中者进行交互。在示例中，`list`\
    \ 充当了中者。\n\n### 代码\n\n```cpp\nnamespace Mediator{\n\n // 定义一个中介对象 // 对象。 示例列表是\n\
    class Node {\n\nprivate:\n  int v_;\n\npublic:\n  Node(int v) : v_(v){}\n  int\
    \ getValue() { return v_; }\n};\n\nclass List { // 中介节点\n\nprivate:\n  std::vector<Node\
    \ *> values_;\n  typedef std::vector<Node *>::const_iterator const_it;\n\npublic:\n\
    \  void add(Node *n){ values_.push_back(n); }\n  void traverse()\n  {\n  const_it\
    \ it1 = values_.begin();\n  const_it it2 = values_.end();\n  for ( it1 != it2;\
    \ it1++)\nstd::cout << \" \" << (*it1)->getValue();\n  }\n};\n\n}; // 结束 中者\n\n\
    void testMediator()\n{\n\n  using namespace Behavioural_Patterns::Mediator;\n\n\
    \  Node n1(1), n2(2), n3(3);\n  List l; l.add(&n1); l.add(&n2); l.add(&n3);\n\
    \  l.traverse();\n}\n```\n\n# 19. 实现备忘模式\n\n## 解决方案\n\n备忘模式是一种用于存储和恢复对象状态的模式。通常用于支持撤销操作、支持序列化或存储伪随机数生成器的种子。在示例中，`memento`\
    \ 类用于存储一个由类 client 保存并后续恢复的值。更复杂的实现可以使用 vector 存储多个值并支持“撤销”操作。\n\n### 代码\n\n```cpp\n\
    namespace Memento{\n\n // 客户端在需要对对象状态进行检查点记录时 // 向源对象请求备忘录\n // 如果客户端随后需要“回滚”\
    \ // 源对象的状态，它会将备忘录交还给源对象进行重新实例化。\nclass Memento{\n\npublic:\n  Memento(int val)\
    \ : value_(val){}\n  int getValue() { return value_; };\n\nprivate:\n  friend\
    \ class Client;\n  int value_;\n};\n\nclass Client{ // 客户端\n\npublic:\n  Client(int\
    \ value) : value_(value){}\n  void increment() { ++value_; } // 状态改变;\n  int get_value()\
    \ { return value_; }\n\n Memento * create_memento() {\n\n  return new Memento(value_);\n\
    }\n\n};\n```\n"
