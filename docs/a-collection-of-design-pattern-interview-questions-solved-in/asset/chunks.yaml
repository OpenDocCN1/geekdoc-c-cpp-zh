    - [25. Implementing the Command pattern]\n    - [Solution]\n\nDesign Patterns\
    \ are a collection of models used for solving recurrent problems in software design.\
    \ They started be after the publication of “Design Patterns: Elements of Reusable\
    \ Object-Oriented Software” by the so-called \"Gang of Four\" (Gamma et.).\n\n\
    Design Patterns are divided into three types:\n1) Creational patterns, which deal\
    \ with object creation mechanisms.\n2) Structural patterns, which deal with the\
    \ composition of classes and objects.\n3) Behavioural patterns, which deal with\
    \ communication between objects.\n\n## Creational Patterns\nCreational patterns\
    \ create objects on behalf rather than instantiating them directly. They use inheritance.\n\
    \n### 1. Implementing the Abstract factory pattern\n#### Solution\nThe intuition\
    \ behind an abstract factory is to encapsulate a group of factories that have\
    \ a common interface. This pattern allows to exchange concrete implementations\
    \ without specifying their classes. In this example the class `Widget` has a pure\
    \ virtual method. The two classes derived by it implement a specific `draw()`\
    \ behaviour.\n\n```cpp\nnamespace Abstract_Factory{\n // The Factory pattern suggests\
    \ defining a\n // creation services in a Factory\n // base class, and implementing\
    \ each \"platform\"\n // in a separate derived class.\n class Widget{\n public:\n\
    \  virtual  void draw() = 0; // make it pure virtual\n};\n\n class OSX_Button\
    \ : public Widget{\n public:\n  void draw() {\n    std::cout << \"OSX buttom\"\
    \ << std::endl;\n  }\n};\n\n class Windows_Button : public Widget{\n public:\n\
    \  void draw() {\n    std::cout << \"Windows buttom\" << std::endl;\n  }\n};\n\
    \n}; // end Abstract Factory\n\nvoid testAbstractFactory(){\n using namespace\
    \ Creational_Patterns::Abstract_Factory;\n Widget * w = new OSX_Button();\n w->draw();\n\
    \ delete w;\n}\n```\n\n### 2. Implementing the Builder pattern\n#### Solution\n\
    The builder aims at separating the construction of complex objects from their\
    \ representation so that the same construction process can create different representations.\
    \ Instead of using different constructors, the pattern defines a single object:\
    \ the builder. This object builds the desired object step-by-step according to\
    \ the configuration parameters defined by the user. The Builder is different from\
    \ the Abstract factory because the former delegates the construction of the actual\
    \ object to a specific auxiliary class/object, while the latter uses inheritance.\n\
    \nIn this example the class `Builder` is implemented according to a pure virtual\
    \ method `configure()` which is defined in each subclass for setting up the parameters\
    \ used to drive each subclass building process.\n\n```cpp\nnamespace Builder{\n\
    \ // Separate the construction of a complex object from its\n // representation\
    \ so that the same construction process\n // can create different representations.\n\
    \ class Build{ base class\n public:\n  virtual  void configure() = 0;\n // here\
    \ can add methods to see the internal state\n protected:\n  int configuration_1_;\
    \ // all the confs variable\n  int configuration_2_; // all the confs variable\n\
    ```\n"
