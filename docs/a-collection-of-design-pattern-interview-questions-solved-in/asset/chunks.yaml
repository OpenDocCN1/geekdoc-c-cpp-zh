    \  case ' ':\nstd::cout << ' ';\n  break;\n  case 'n':\nstd::cout << endl;\n \
    \ break;\n  default:\nstd::cout << \"Unknown command\";\n  }\n    }\n  } };\n\
    };\n```\n\n# 17. 实现迭代器模式\n\n## 解决方案\n\n迭代器模式用于在不暴露对象表示法的情况下访问对象的所有元素。这种模式常用于 STL\
    \ 等库，将对特定容器的访问与其具体实现解耦。在示例中，通过一个 `iterator` 访问 `stack` 类。\n\n```cpp\nnamespace\
    \ Iterator{\n\n // 像列表这样的聚合对象应该提供 // 一种访问其元素的方法，而不暴露其 // 内部结构。\nclass Stack\n\n\
