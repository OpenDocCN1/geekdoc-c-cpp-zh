    \n# 20. 实现观察者模式\n\n## 解决方案\n\n观察者模式实现了发布者/订阅者之间的交互，其中多个注册的观察者对象会收到发布者产生的事件通知。这种模式经常用于实现分布式事件处理系统和窗口系统。\n\
    \n在这个示例中，`Observer` 类根据纯虚方法 `update` 实现，而该方法又由子类 `a_observer` 和 `b_observer` 分别实现。`subject`\
