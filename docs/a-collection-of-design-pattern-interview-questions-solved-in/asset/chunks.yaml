    \n# 20. Implementing the Observer pattern\n\n## Solution\n\nThe Observer pattern\
    \ implements the publisher/subscriber interactions, where a number of registered\
    \ observer objects are informed about events produced by the publishers. This\
    \ pattern is frequently used for implementing a distributed event handling system\
    \ and for windows systems.\n\nIn this example the class `Observer` is implemented\
    \ according to a pure virtual method `update` which is itself implemented by subclasses\
    \ `a_observer` and `b_observer`. The class `subject` keeps a vector of observers\
    \ which are notified by calling the method `notify()`. Note that new observers\
    \ can be dynamically attached to existing lists.\n\n### Code\n\n```cpp\nnamespace\
    \ Observer{\n  // when one object changes state,\n  // all its dependents are\
    \ notified and\n  // updated automatically.\n  class Observ{\n  public:\n    virtual\
    \ void update(int value) = 0;\n  };\n\n  class AObserv : public Observ{\n  public:\n\
    \    void update(int value) {\n      std::cout << \"\\ta seeing \" << value <<\
    \ std::endl;\n    }\n  };\n\n  class BObserv : public Observ{\n  public:\n   \
    \ void update(int value) {\n      std::cout << \"\\tb seeing \" << value << std::endl;\n\
    \    }\n  };\n\n  class Subject{\n  private:\n    int value_;\n    std::vector<Observ\
    \ *> observers_;\n    typedef std::vector<Observ *>::const_iterator const_it;\n\
    \  public:\n    void set_value(int value) {\n      value_ = value; notify();\n\
    \    }\n    // attach the observers\n    void attach(Observ * o) {\n      observers_.push_back(o);\n\
    \    }\n    void notify() {\n      const_it it = observers_.begin(), it_end =\
    \ observers_.end();\n      for (; it != it_end; ++it)\n        (*it)->update(value_);\n\
    \    }\n  };\n}; // end observer\n\nvoid testObserver()\n{\n  using namespace\
    \ Behavioural_Patterns::Observer;\n  AObserv a;\n  BObserv b;\n  Subject s;\n\
    \  s.attach(&a); s.attach(&b);\n  s.set_value(3);\n}\n```\n\n# 21. Implementing\
    \ the State pattern\n\n## Solution\n\nThe State pattern is used to allow an object\
    \ to change his behaviour, when the internal state of the object itself is changing.\
    \ For instance this pattern can be used to change the state of an object at run-time.\n\
    \nIn this simple example the class `state` is implemented according to two virtual\
    \ methods `on(..)` and `off(..)` which are at their turn implemented in the class\
    \ `OFF()` and `ON()` respectively. The current state is maintained within class\
    \ `tool` as a pointer.\n\n### Code\n\n```cpp\nnamespace State {\n  // Allow an\
    \ object to alter its behavior when\n  // state changes. The object will appear\
    \ to change its class.\n  class tool{\n  private:\n    state * current_;\n  public:\n\
    \    void set_current(state * s) { current_ = s; }\n    void on();\n    void off();\n\
    \  };\n\n  class state{\n  public:\n    virtual void on(tool * t);\n    virtual\
    \ void off(tool * t);\n  };\n\n  void tool::on() {\n    std::cout << \"on is the\
    \ state\";\n    current_->on(this);\n  }\n  void tool::off() {\n    std::cout\
    \ << \"off is the state\";\n    current_->off(this);\n  }\n\n  class OFF : public\
    \ state{\n  public:\n    void on(tool * t);\n  };\n\n  class ON : public state{\n\
    \  public:\n    void off(tool * t) {\n      std::cout << \"\\tgoing to OFF\" <<\
    \ std::endl;\n      t->set_current(new OFF());\n      delete this;\n    }\n  };\n\
    \n  void OFF::on(tool * t) {\n    std::cout << \"\\tgoing to ON\" << std::endl;\n\
    \    t->set_current(new ON());\n    delete this;\n  }\n}; // end State\n\nvoid\
    \ testState()\n{\n  using namespace Behavioural_Patterns::State;\n  Tool * t =\
    \ new Tool();\n  ON * on = new ON();\n  t->set_current(on);\n  on->off(t);\n}\n\
    ```\n\n# 22. Implementing the Strategy pattern\n\n## Solution\n\nThe Strategy\
    \ pattern allows selection at run-time specific algorithms for implementing a\
    \ particular behaviour given a class of similar algorithms. In this example we\
    \ have two classes `algo1` and `algo2` derived by the superclass `strategy`.\n\
    \n### Code\n\n```cpp\nnamespace Strategy{\n  // Strategy lets the algorithm vary\
    \ independently from the clients that use it.\n  enum ALGO { ALGO1, ALGO2 };\n\
    \  class Strategic{\n  public:\n    virtual void do_it() = 0;\n  };\n\n  class\
    \ Algo1 : public Strategic{\n    void do_it() {\n      std::cout << \"\\tcalling\
