    \n}\n\n# 3. Implementing the Factory pattern\n\n## Solution\n\nThe factory method\
    \ uses factories for creating objects with no explicit need of identifying the\
    \ exact class of object that will be created. Typically the factory pattern leverages\
    \ the inheritance mechanism with the actual creation process delegated to subclasses.\
    \ Factory is frequently used for avoiding duplication of code and for abstracting\
    \ common functionalities. In this sense a superclass specifies generic behaviours\
    \ by using pure virtual placeholders for creation steps. Then the superclass delegates\
    \ the creation details to subclasses that are supplied by the client.\n\nFactory\
    \ patterns can be seen as a simplified version of an Abstract Factory pattern.\
    \ The Factory Method pattern is responsible of creating products that belong to\
    \ one family, while the Abstract Factory pattern deals with multiple families\
    \ of products.  For example, with the Factory method you can produce implementations\
    \ (say SUV, Station Wagons, Convertibles, ..) of one specific interface (say IAutomobile),\
    \ while with the Abstract Factory method you can produce implementations of a\
    \ particular Factory interface (say all the  type of automobiles given a family\
    \ of vehicles including cars, trucks, caravan, and so on and so forth).\n\nIn\
    \ this example we have one base class and two derived classes A and B which can\
    \ be selected for exchanging the implementation according to specific needs. \
    \ The only difference with the example provided at page 10 is that OSX_Button\
    \ and Windows_Button represent a particular Factory interface for the specific\
    \ operative system within the families of generic buttons.\n\nCode\n\nnamespace\
    \ Factory_Method{\n\n // Define an interface for creating an object,\n\n // but\
    \ let subclasses decide which class to instantiate.\n\n // Factory Method lets\
    \ a class defer instantiation to\n\n // subclasses.\n\n //\n\n // Factory Method\
    \ can return the same instance multiple\n\n // times, or can return a subclass\
    \ rather than an object\n\n // of that exact type.\n\n class  Base{\n\n public:\n\
    \n  virtual  void what_to_do() = 0;\n\n              };\n\n class  A : public\
    \  Base{\n\n public:\n\n A() { std::cout << \"\\tClass A\" << std::endl; }\n\n\
    \  void what_to_do() { };\n\n              };\n\n class  B : public  Base{\n\n\
    \ public:\n\n B() { std::cout << \"\\tClass B\" << std::endl; }\n\n  void what_to_do()\
    \ { };\n\n              };\n\n}; // end Factory Method\n\nvoid testFactoryMethod(){\n\
    \n using  namespace Creational_Patterns::Factory_Method;\n\n Base * b = new  A();\n\
    \n b->what_to_do();\n\n delete b;\n\n b = new  B();\n\n b->what_to_do();\n\n delete\
    \ b;\n\n}\n\n# 4. Implementing the Prototype pattern\n\n## Solution\n\nThe prototype\
    \ pattern creates a prototypical instance which is then cloned for producing new\
    \ objects. This pattern is very effective when the cost of cloning is less than\
    \ the cost of creating a new object.\n\nIn this example we define a class Proto\
    \ with a protected virtual method clone() which must be implemented by the subclasses.\
    \ Different prototypes are stored in a static array and the subclasses have to\
    \ register themselves.\n\nCode\n\nnamespace Prototype{\n\n // Specify the kinds\
    \ of objects to create using a\n\n // prototypical instance, and create new objects\n\
    \n // by copying this prototype.\n\n // Declare an abstract base class that specifies\
    \ a\n\n // pure virtual \"clone\" method, and, maintains a\n\n // dictionary of\
    \ all \"cloneable\" concrete derived\n\n // classes.\n\n class  Base {\n\n public:\n\
    \n  virtual  Base* clone() = 0;\n\n  virtual  void doSomething() = 0;\n\n };\n\
    \n class  Factory {\n\n public:\n\n  static  Base* makeBase(int choice);\n\n private:\n\
    \n  static  Base* s_prototypes[3];\n\n };\n\n class  A : public  Base{\n\n public:\n\
    \n  Base*   clone() { return  new  A; }\n\n  void doSomething() {\n\n std::cout\
    \ << \"A is now doing\\n\";\n\n               }\n\n };\n\n class  B : public \
    \ Base {\n\n public:\n\n  Base*   clone() { return  new  B; }\n\n  void doSomething()\
    \ {\n\n std::cout << \"B is now doing\\n\";\n\n               }\n\n };\n\n Base*\
    \ Factory::s_prototypes[] = {\n\n 0, new  A, new  B\n\n };\n\n Base* Factory::makeBase(int\
    \  choice) {\n\n  return s_prototypes[choice]->clone();\n\n }\n\n // end Protype\n\
    \n};\n\nvoid testPrototype(){\n\n using  namespace Creational_Patterns::Prototype;\n\
    \n Base * b = Factory::makeBase(1);\n\n b->doSomething();\n\n delete b;\n\n}\n\
    \n# 5. Implementing the Singleton pattern\n\n## Solution\n\nThis pattern restricts\
    \ the instantiation of a class to one single object. In a single thread environment\
    \ the constructor is typically private and a static instance is initialized only\
    \ once by checking its nullness.\n\nCode\n\nnamespace Singleton{\n\n // Ensure\
    \ a class has only one instance,\n\n // and provide a global point of access to\
    \ it.\n\n // The singleton pattern must be carefully constructed\n\n // in multi-threaded\
    \ applications.\n\n // The classic solution to this problem is to use mutual\n\
    \n // exclusion on the class that indicates that the object\n\n // is being instantiated.\n\
    \n class  Single{\n\n public:\n\n  static  Single * getInstance(void) {\n\n  if\
    \ (!instance_){\n\n instance_ = new  Single();\n\n                            \
    \ }\n\n  return instance_;\n\n               };\n\n private:\n\n  // cannot be\
    \ invoked\n\n Single(){ std::cout << \"\\tSingle\" << std::endl; };\n\n static\
    \  Single * instance_; // a single instance\n\n };\n\n Single *Single::instance_;\
    \ // force instantiation\n\n}; // end Singleton\n\nvoid testSingleton(){\n\n using\
    \  namespace Creational_Patterns::Singleton;\n\n Single * s = Single::getInstance();\n\
    \n delete s;\n\n}\n\n## Solution – The double checked locked pattern (DCLP)\n\n\
    In a multi-threaded environment it is mandatory to acquire a lock() before accessing\
    \ the singleton instance for not incurring in risks of conflicts across threads.\
    \ This is achieved by the first code snippet reported below: the solution is always\
    \ correct but it needs to always perform an expensive lock. An optimization sometimes\
    \ used is the so called double checked locked pattern (DCLP), which tests for\
    \ the value being null before trying to acquire a lock.[[2]](#part0000.html__ftn2)\n\
    \nCode\n\nSingleton* Singleton::instance() {\n\nLock lock; // acquire lock \n\n\
    \ if (pInstance == 0) {\n\n pInstance = new Singleton;\n\n }\n\n return pInstance;\n\
    \n} // release lock (via Lock destructor)\n\nSingleton* Singleton::instance()\
    \ {\n\n if (pInstance == 0) { // 1st test\n\n               Lock lock;\n\n  if\
    \ (pInstance == 0) { // 2nd test\n\n pInstance = new Singleton;\n\n              \
    \ }\n\n }\n\n return pInstance;\n\n}\n\n# 6. Implementing the Object pool pattern\n\
    \n## Solution"
