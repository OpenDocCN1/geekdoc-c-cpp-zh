    }\n```\n\n# 21. 实现状态模式\n\n## 解决方案\n\n状态模式允许对象在自身内部状态改变时改变其行为。例如，这种模式可以用于运行时更改对象的状态。\n\
    \n在这个简单的示例中，`state` 类根据两个虚方法 `on(..)` 和 `off(..)` 实现，而这两个方法反过来又分别在 `OFF()` 和 `ON()`\
    \ 类中实现。当前状态以指针的形式在 `tool` 类中维护。\n\n```cpp\nnamespace State {\n  // 允许对象在状态改变时改变其行为。\n\
    \  // 对象看起来像是改变了它的类。\n  class tool{\n  private:\n    state * current_;\n  public:\n\
    \    void set_current(state * s) { current_ = s; }\n    void on();\n    void off();\n\
    \  };\n\n  class state{\n  public:\n    virtual void on(tool * t);\n    virtual\
    \ void off(tool * t);\n  };\n\n  void tool::on() {\n    std::cout << \"on is the\
    \ state\";\n    current_->on(this);\n  }\n  void tool::off() {\n    std::cout\
    \ << \"off is the state\";\n    current_->off(this);\n  }\n\n  class OFF : public\
    \ state{\n  public:\n    void on(tool * t);\n  };\n\n  class ON : public state{\n\
    \  public:\n    void off(tool * t) {\n      std::cout << \"\\tgoing to OFF\" <<\
    \ std::endl;\n      t->set_current(new OFF());\n      delete this;\n    }\n  };\n\
    \n  void OFF::on(tool * t) {\n    std::cout << \"\\tgoing to ON\" << std::endl;\n\
    \    t->set_current(new ON());\n    delete this;\n  }\n}; // end State\n\nvoid\
    \ testState()\n{\n  using namespace Behavioural_Patterns::State;\n  Tool * t =\
    \ new Tool();\n  ON * on = new ON();\n  t->set_current(on);\n  on->off(t);\n}\n\
    ```\n\n# 22. 实现策略模式\n\n## 解决方案\n\n策略模式允许在给定一组相似算法的情况下，运行时选择实现特定行为的特定算法。在这个示例中，我们有两个由超类\
    \ `strategy` 派生的类 `algo1` 和 `algo2`。\n\n### 代码\n\n```cpp\nnamespace Strategy{\n\
    \  // 策略允许算法从使用它的客户端独立变化。\n  enum ALGO { ALGO1, ALGO2 };\n  class Strategic{\n\
    \  public:\n    virtual void do_it() = 0;\n  };\n\n  class Algo1 : public Strategic{\n\
    \    void do_it() {\n      std::cout << \"\\tcalling algo1\" << std::endl;\n \
    \   }\n  };\n\n  class Algo2 : public Strategic{\n    void do_it() {\n      std::cout\
    \ << \"\\tcalling algo2\" << std::endl;\n    }\n  };\n\n  class Testbed{\n  public:\n\
    \    Testbed() : strategy_(NULL) {};\n    void choose_strategy(unsigned int what)\
    \ {\n      Strategic * tmp;\n      switch (what){\n        default:\n        case\
    \ ALGO1:\n          tmp = new Algo1();\n          delete strategy_;\n        \
    \  strategy_ = tmp;\n          break;\n        case ALGO2:\n          tmp = new\
    \ Algo2();\n          delete strategy_;\n          strategy_ = tmp;\n        \
    \  break;\n      }\n    }\n    ~Testbed(){\n      if(strategy_) delete strategy_;\n\
    \    }\n  private:\n    Strategic * strategy_;\n  };\n} // end Strategy\n\nvoid\
    \ testStrategy()\n{\n  using namespace Behavioural_Patterns::Strategy;\n  Testbed\
    \ tb;\n  tb.choose_strategy(1);\n}\n```\n\n"
- fmt: "\n// A practical result of this separation is the ability to add new operations\
    \ to existing object structures without modifying those structures. In essence,\
    \ the visitor allows one to add new virtual functions to a family of classes without\
    \ modifying the classes themselves;\n\n```cpp\nclass A;\nclass B;\nclass C;\n\
    class Parent;\n\n// interface for visitor\nstruct parent_element_visitor {\n \
    \   virtual void visit(A &a) const = 0;\n    virtual void visit(B &b) const =\
    \ 0;\n    virtual void visit(C &c) const = 0;\n    virtual void visit(Parent &p)\
    \ const = 0;\n    virtual ~parent_element_visitor() {};\n};\n\n// interface for\
    \ a single element in hierarchy\nstruct parent_element {\n    virtual void accept(const\
    \ parent_element_visitor& visitor) = 0;\n    virtual ~parent_element() {};\n};\n\
    \n// class in hierarchy\nclass A : public parent_element {\npublic:\n    A() {\
    \ std::cout << \"\\tcalled A\" << std::endl; }\n    void accept(const parent_element_visitor\
    \ & v) {\n        v.visit(*this);\n    }\n};\n\n// class in hierarchy\nclass B\
    \ : public parent_element {\npublic:\n    B() { std::cout << \"\\tcalled B\" <<\
    \ std::endl; }\n    void accept(const parent_element_visitor & v) {\n        v.visit(*this);\n\
    \    }\n};\n\n// class in hierarchy\nclass C : public parent_element {\npublic:\n\
    \    C() { std::cout << \"\\tcalled C\" << std::endl; }\n    void accept(const\
    \ parent_element_visitor & v) {\n        v.visit(*this);\n    }\n};\n\n// container\
    \ of all the objects in hierarchy\nclass Parent {\npublic:\n    typedef std::vector<parent_element*>::const_iterator\
    \ const_parent_collection_it;\n    typedef std::vector<parent_element*> parent_collection;\n\
    \n    parent_collection& getElements() {\n        return elements_;\n    }\n\n\
    \    Parent() {\n        elements_.push_back(new A());\n        elements_.push_back(new\
    \ B());\n        elements_.push_back(new C());\n    }\n\n    ~Parent() {\n   \
    \     for (const_parent_collection_it it = elements_.begin(); it != elements_.end();\
    \ ++it) {\n            delete *it; // call the destructors\n        }\n    }\n\
    \nprivate:\n    parent_collection elements_;\n};\n\n// a concrete implementation\
    \ of visitor\nclass parent_model_one_visitor : public parent_element_visitor {\n\
    public:\n    void visit(A &a) const { std::cout << \"\\tvisit A, model one\" <<\
    \ std::endl; }\n    void visit(B &b) const { std::cout << \"\\tvisit B, model\
    \ one\" << std::endl; }\n    void visit(C &c) const { std::cout << \"\\tvisit\
    \ B, model one\" << std::endl; } // Note: original text had B\n    void visit(Parent\
    \ &p) const {\n        parent_collection& elements = p.getElements();\n      \
    \  for (Parent::const_parent_collection_it it = elements.begin(); it != elements.end();\
    \ ++it) {\n            // calling the visitor callback\n            (*it)->accept(*this);\n\
    \        }\n    }\n};\n\n// a second concrete implementation of visitor\nclass\
    \ parent_model_two_visitor : public parent_element_visitor {\npublic:\n    void\
    \ visit(A &a) const { std::cout << \"\\tvisit A, model two\" << std::endl; }\n\
    \    void visit(B &b) const { std::cout << \"\\tvisit B, model two\" << std::endl;\
    \ }\n    void visit(C &c) const { std::cout << \"\\tvisit B, model two\" << std::endl;\
    \ } // Note: original text had B\n    void visit(Parent &p) const {\n        parent_collection&\
    \ elements = p.getElements();\n        for (Parent::const_parent_collection_it\
    \ it = elements.begin(); it != elements.end(); ++it) {\n            (*it)->accept(*this);\n\
    \        }\n    }\n}; // end visitor\n\nvoid testVisitor() {\n    using namespace\
    \ Behavioural_Patterns;\n    Parent p;\n    parent_element_visitor * pv = new\
    \ parent_model_one_visitor();\n    pv->visit(p);\n    delete pv;\n\n    pv = new\
    \ parent_model_two_visitor();\n    pv->visit(p);\n    delete pv;\n}\n```\n\n###\
    \ ABOUT AUTHOR\nAn experienced data mining engineer, passionate about technology\
    \ and innovation in consumers’ space. Interested in search and machine learning\
    \ on massive dataset with a particular focus on query analysis, suggestions, entities,\
    \ freshness and universal ranking. Antonio Gullì has worked in small startups,\
    \ medium (Ask.com, Tiscali) and large corporations (Microsoft). His carrier path\
    \ is about mixing industry with academic experience.\n\n“Nowadays you must have\
    \ a great combination of research skills and a just-get-done attitude.”\n\n* *\
    \ *\n\n*   [[1](#part0000.html__ftnref1) Gamma, Erich; Richard Helm, Ralph Johnson,\
    \ and John Vlissides (1995). Design Patterns: Elements of Reusable Object-Oriented\
    \ Software. Addison-Wesley. ISBN 0-201-63361-2.\n*   [[2](#part0000.html__ftnref2)\
    \ Some architectures can implement code optimizations and break the correctness\
    \ of the solution. The interested reader can find more information in this paper\
    \ [http://www.aristeia.com/Papers/DDJ_Jul_Aug_2004_revised.pdf](http://www.aristeia.com/Papers/DDJ_Jul_Aug_2004_revised.pdf)\n\
    *   [[3](#part0000.html__ftnref3) [http://docs.oracle.com/cd/E13222_01/wls/docs81/ConsoleHelp/jdbc_connection_pools.html](http://docs.oracle.com/cd/E13222_01/wls/docs81/ConsoleHelp/jdbc_connection_pools.html)\n\
    *   [[4](#part0000.html__ftnref4) [http://en.wikipedia.org/wiki/Private_class_data_pattern](http://en.wikipedia.org/wiki/Private_class_data_pattern)\n"
  raw: " // A practical result of this separation is the ability\n\n // to add new\
    \ operations to existing object structures\n\n // without modifying those structures.\n\
    \n // In essence, the visitor allows one to add new\n\n // virtual functions to\
    \ a family of classes without\n\n // modifying the classes themselves;\n\n class\
    \  A;\n\n class  B;\n\n class  C;\n\n class  Parent;\n\n // an interface for visitor\n\
    \n struct  parent_element_visitor{\n\n virtual  void visit(A &a) const = 0;\n\n\
    \  virtual  void visit(B &b) const = 0;\n\n  virtual  void visit(C &c) const =\
    \ 0;\n\n  virtual  void visit(Parent &p) const = 0;\n\n  virtual ~parent_element_visitor()\
    \ {};\n\n };\n\n // interface for a single element in hierarchy\n\n struct  parent_element{\n\
    \n virtual  void accept(const  parent_element_visitor& visitor) = 0;\n\n  virtual\
    \ ~parent_element() {};\n\n };\n\n // class in hierarchy\n\n class  A : public\
    \  parent_element{\n\n public:\n\n A() { std::cout << \"\\tcalled A\" << std::endl;\
    \ }\n\n void accept(const  parent_element_visitor & v)\n\n               {\n\n\
    \  v.visit(*this);\n\n               }\n\n };\n\n // class in hierarchy\n\n class\
    \  B : public  parent_element{\n\n public:\n\n B() { std::cout << \"\\tcalled\
    \ B\" << std::endl; }\n\n void accept(const  parent_element_visitor & v)\n\n              \
    \ {\n\n  v.visit(*this);\n\n               }\n\n };\n\n // class in hierarchy\n\
    \n class  C : public  parent_element{\n\n public:\n\n C() { std::cout << \"\\\
    tcalled C\" << std::endl; }\n\n void accept(const  parent_element_visitor & v)\n\
    \n               {\n\n  v.visit(*this);\n\n               }\n\n };\n\n // container\
    \ of all the objects in hierarchy\n\n class  Parent{\n\n public:\n\n  typedef\
    \ std::vector<parent_element*>::const_iterator  const_parent_collection_it;\n\n\
    \  typedef std::vector<parent_element*> parent_collection;\n\n parent_collection&\
    \ getElements()\n\n               {\n\n  return elements_;\n\n               }\n\
    \n                            Parent()\n\n               {\n\n                            \
    \ elements_.push_back(new  A());\n\n                             elements_.push_back(new\
    \  B());\n\n                             elements_.push_back(new  C());\n\n              \
    \ }\n\n               ~Parent()\n\n               {\n\n  for (const_parent_collection_it\
    \ it = elements_.begin();\n\n                                           it !=\
    \ elements_.end(); ++it)\n\n                             {\n\n  delete *it;\n\n\
    \ } // call the destructors\n\n               }\n\n private:\n\n  parent_collection\
    \ elements_;\n\n };\n\n // a first concrete implementation of visitor\n\n class\
    \  parent_model_one_visitor : public  parent_element_visitor{\n\n public:\n\n\
    \  void visit(A &a) const {\n\n std::cout << \"\\tvisit A, model one\"\n\n              \
    \                             << std::endl;\n\n               }\n\n  void visit(B\
    \ &b) const {\n\n std::cout << \"\\tvisit B, model one\"\n\n                            \
    \               << std::endl;\n\n               }\n\n  void visit(C &c) const\
    \ {\n\n std::cout << \"\\tvisit B, model one\"\n\n                            \
    \               << std::endl;\n\n               }\n\n void visit(Parent &p) const\
    \ {\n\n Parent::parent_collection& elements =\n\np.getElements();\n\n  for (Parent::const_parent_collection_it\
    \ it =\n\n                                           elements.begin();\n\n              \
    \                             it != elements.end(); ++it){\n\n // calling the\
    \ visitor callback\n\n                                           (*it)->accept(*this);\n\
    \n                             };\n\n               }\n\n };\n\n // a second concrete\
    \ implementation of visitor\n\n class  parent_model_two_visitor :\n\n  public\
    \  parent_element_visitor{\n\n public:\n\n  void visit(A &a) const {\n\n std::cout\
    \ << \"\\tvisit A, model two\"\n\n                                           <<\
    \ std::endl;\n\n               }\n\n  void visit(B &b) const {\n\n std::cout <<\
    \ \"\\tvisit B, model two\"\n\n                                           << std::endl;\n\
    \n               }\n\n  void visit(C &c) const {\n\n std::cout << \"\\tvisit B,\
    \ model two\"\n\n                                           << std::endl;\n\n\
    \               }\n\n  void visit(Parent &p) const {\n\n Parent::parent_collection&\
    \ elements =\n\n  p.getElements();\n\n  for (Parent::const_parent_collection_it\
    \ it =\n\n                                           elements.begin();\n\n              \
    \                             it != elements.end(); ++it){\n\n // calling the\
    \ visitor callback\n\n                                           (*it)->accept(*this);\n\
    \n                             };\n\n               }\n\n };\n\n}; // end visitor\n\
    \nvoid testVisitor()\n\n{\n\n using  namespace Behavioural_Patterns::Visitor;\n\
    \n Parent p;\n\n parent_element_visitor * pv = new  parent_model_one_visitor();\n\
    \n pv->visit(p);\n\n delete pv;\n\n pv = new  parent_model_two_visitor();\n\n\
    \ pv->visit(p);\n\n delete pv;\n\n}\n\nABOUT THE AUTHOR\n\nAn experienced data\
