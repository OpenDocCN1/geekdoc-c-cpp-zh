  trans: "\n\n// 这种分离的实际结果是，可以在不修改现有对象结构的情况下添加新的操作。从本质上说，访问者（visitor）允许在不修改类本身的情况下向一组类添加新的虚函数；\n\
    \n```cpp\nclass A;\nclass B;\nclass C;\nclass Parent;\n\n// 访问者接口\nstruct parent_element_visitor\
    \ {\n    virtual void visit(A &a) const = 0;\n    virtual void visit(B &b) const\
    \ = 0;\n    virtual void visit(C &c) const = 0;\n    virtual void visit(Parent\
    \ &p) const = 0;\n    virtual ~parent_element_visitor() {};\n};\n\n// 层次结构中单个元素的接口\n\
    struct parent_element {\n    virtual void accept(const parent_element_visitor&\
    \ visitor) = 0;\n    virtual ~parent_element() {};\n};\n\n// 层次结构中的类\nclass A\
    \ : public parent_element {\npublic:\n    A() { std::cout << \"\\tcalled A\" <<\
    \ std::endl; }\n    void accept(const parent_element_visitor & v) {\n        v.visit(*this);\n\
    \    }\n};\n\n// 层次结构中的类\nclass B : public parent_element {\npublic:\n    B()\
    \ { std::cout << \"\\tcalled B\" << std::endl; }\n    void accept(const parent_element_visitor\
    \ & v) {\n        v.visit(*this);\n    }\n};\n\n// 层次结构中的类\nclass C : public parent_element\
    \ {\npublic:\n    C() { std::cout << \"\\tcalled C\" << std::endl; }\n    void\
    \ accept(const parent_element_visitor & v) {\n        v.visit(*this);\n    }\n\
    };\n\n// 层次结构中所有对象的容器\nclass Parent {\npublic:\n    typedef std::vector<parent_element*>::const_iterator\
    \ const_parent_collection_it;\n    typedef std::vector<parent_element*> parent_collection;\n\
    \n    parent_collection& getElements() {\n        return elements_;\n    }\n\n\
    \    Parent() {\n        elements_.push_back(new A());\n        elements_.push_back(new\
    \ B());\n        elements_.push_back(new C());\n    }\n\n    ~Parent() {\n   \
    \     for (const_parent_collection_it it = elements_.begin(); it != elements_.end();\
    \ ++it) {\n            delete *it; // 调用析构函数\n        }\n    }\n\nprivate:\n \
    \   parent_collection elements_;\n};\n\n// 访问者的具体实现\nclass parent_model_one_visitor\
    \ : public parent_element_visitor {\npublic:\n    void visit(A &a) const { std::cout\
    \ << \"\\tvisit A, model one\" << std::endl; }\n    void visit(B &b) const { std::cout\
    \ << \"\\tvisit B, model one\" << std::endl; }\n    void visit(C &c) const { std::cout\
    \ << \"\\tvisit B, model one\" << std::endl; } // 注意：原文此处是 B\n    void visit(Parent\
    \ &p) const {\n        parent_collection& elements = p.getElements();\n      \
    \  for (Parent::const_parent_collection_it it = elements.begin(); it != elements.end();\
    \ ++it) {\n            // 调用访问者回调\n            (*it)->accept(*this);\n       \
    \ }\n    }\n};\n\n// 第二个访问者的具体实现\nclass parent_model_two_visitor : public parent_element_visitor\
    \ {\npublic:\n    void visit(A &a) const { std::cout << \"\\tvisit A, model two\"\
    \ << std::endl; }\n    void visit(B &b) const { std::cout << \"\\tvisit B, model\
    \ two\" << std::endl; }\n    void visit(C &c) const { std::cout << \"\\tvisit\
    \ B, model two\" << std::endl; } // 注意：原文此处是 B\n    void visit(Parent &p) const\
    \ {\n        parent_collection& elements = p.getElements();\n        for (Parent::const_parent_collection_it\
    \ it = elements.begin(); it != elements.end(); ++it) {\n            (*it)->accept(*this);\n\
    \        }\n    }\n}; // 访问者结束\n\nvoid testVisitor() {\n    using namespace Behavioural_Patterns;\n\
    \    Parent p;\n    parent_element_visitor * pv = new parent_model_one_visitor();\n\
    \    pv->visit(p);\n    delete pv;\n\n    pv = new parent_model_two_visitor();\n\
    \    pv->visit(p);\n    delete pv;\n}\n```\n\n### 关于作者\n一位经验的数据挖掘工程师，对技术和消费者领域充满热情。对大规模数据集上的搜索和机器学习感兴趣，特别是查询分析、建议和通用排名。Antonio\
    \ Gull 曾在初创公司、中型企业（Ask.com, Tiscali）以及大型机构（微软）。他的职业生涯致力于工业界与学术界的结合。\n\n“如今，你必须具备研究能力和解决问题的态度。”\n\
    \n* * *\n\n*   [[1]] Gamma, Erich; Richard Helm, Ralph Johnson, John Vlissides\
    \ (1995). Design Patterns: Elements of Reusable Object-Oriented Software. Addison-Wesley.\
    \ ISBN 0-201-63361-2.\n*   [[2]]某些架构可以实现代码优化但破坏方案的正确性。感兴趣的读者可以在本文找到更多信息：[`www.aristeia.com/Papers/DDJ_Jul_Aug_2004_revised.pdf`](http://www.aristeia.com/Papers/DDJ_Jul_Aug_2004_revised.pdf)\n\
    *   [[3]] [`docs.oracle.com/cd/E13222_01/wls/docs81/ConsoleHelp/jdbc_connection_pools.html`](http://docs.oracle.com/cd/E13222_01/wls/docs81/ConsoleHelp/jdbc_connection_pools.html)\n\
    *   [[4]] [`en.wikipedia.org/wiki/Private_class_data_pattern`](http://en.wikipedia.org/wiki/Private_class_data_pattern)\n\
