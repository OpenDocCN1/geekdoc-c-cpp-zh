    \       case ALGO2:\n          tmp = new Algo2();\n          delete strategy_;\n\
    \          strategy_ = tmp;\n          break;\n      }\n    }\n    ~Testbed(){\n\
    \      if(strategy_) delete strategy_;\n    }\n  private:\n    Strategic * strategy_;\n\
    \  };\n} // end Strategy\n\nvoid testStrategy()\n{\n  using namespace Behavioural_Patterns::Strategy;\n\
    \  Testbed tb;\n  tb.choose_strategy(1);\n}\n```\n"
