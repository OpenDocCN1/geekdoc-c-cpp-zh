    \n s.set_value(3);\n\n}\n\n# 21.  Implementing the State pattern\n\n## Solution\n\
    \nThe State pattern is used to allow an object to change his behaviour, when the\
    \ internal state of the object itself is changing. For instance this pattern can\
    \ be used to change the state of an object at run-time.\n\nIn this simple example\
    \ the class state is implemented according to two virtual methods on(..) and off(..)\
    \ which are at their turn implemented in the class OFF() and ON() respectively.\
    \ The current state is maintained within the class tool as a pointer.\n\nCode\n\
    \nnamespace State {\n\n // Allow an object to alter its behavior when its\n\n\
    \ // internal state changes. The object will appear\n\n // to change its class.\n\
    \n class  tool{\n\n private:\n\n  class  state * current_;\n\n public:\n\n  void\
    \ set_current(state * s) { current_ = s; };\n\n  void on();\n\n  void off();\n\
    \n };\n\n class  state{\n\n public:\n\n  virtual  void on(tool * t){\n\n std::cout\
    \ << \" state on\\n\";\n\n               }\n\n  virtual  void off(tool *t){\n\n\
    \ std::cout << \" state off\\n\";\n\n               }\n\n };\n\n void  tool::on()\n\
    \n {\n\n std::cout << \"on is the state\";\n\n               current_->on(this);\n\
    \n }\n\n void  tool::off()\n\n {\n\n std::cout << \"off is the state\";\n\n              \
    \ current_->off(this);\n\n }\n\n class  OFF : public  state{ // changing state\
    \ OFF->on\n\n public:\n\n  void on(tool * t);\n\n };\n\n class  ON : public  state{\
    \ // changing state off->ON\n\n public:\n\n  void off(tool * t){\n\nstd::cout\
    \ << \"\\tgoing from ON to OFF\" <<   std::endl;\n\n  t->set_current(new  OFF());\n\
    \n  delete  this;    \n\n               }\n\n };\n\n void  OFF::on(tool * t){\n\
    \nstd::cout << \"\\tgoing from OFF to ON\" << std::endl;\n\n  t->set_current(new\
    \  ON());\n\n  delete  this;     \n\n }\n\n}; // end State\n\nvoid testState()\n\
    \n{\n\n using  namespace Behavioural_Patterns::State;\n\n Tool * t = new  Tool();\n\
    \n ON * on = new  ON();\n\n t->set_current(on);\n\n on->off(t);\n\n delete t;\n\
    \n}\n\n# 22.  Implementing the Strategy pattern\n\n## Solution\n\nThe Strategy\
    \ pattern allows selection at run-time on specific algorithms for implementing\
    \ a particular behaviour given a class of similar algorithms for that function.\n\
    \nIn this example we have two classes algo1 and algo2 derived by the superclass\
    \ strategy.\n\nCode\n\nnamespace Strategy{\n\n // Strategy lets the algorithm\
    \ vary independently\n\n // from the clients that use it.\n\n enum  ALGO { ALGO1,\
    \ ALGO2 };\n\n class  Strategic{\n\n public:\n\n  virtual  void do_it() = 0;\n\
    \n };\n\n class  Algo1 : public  Strategic{\n\n void do_it() {\n\n std::cout <<\
    \ \"\\tcalling algo1\" << std::endl;\n\n               }\n\n };\n\n class  Algo2\
    \ : public  Strategic{\n\n void do_it() {\n\n std::cout << \"\\tcalling algo2\"\
    \ << std::endl;\n\n               }\n\n };\n\n class  Testbed{\n\n public:\n\n\
                                Testbed() : strategy_(NULL) {};\n\n  void choose_strategy(unsigned\
    \  int  what)\n\n               {\n\n  Strategic * tmp;\n\n switch (what){\n\n\
    \  default:\n\n  case  ALGO1:\n\n tmp = new  Algo1();\n\n  delete strategy_;\n\
    \n                                           strategy_ = tmp;\n\n  break;\n\n\
    \  case  ALGO2:\n\n tmp = new  Algo2();\n\n  delete strategy_;\n\n              \
    \                             strategy_ = tmp;\n\n  break;\n\n                            \
    \ }\n\n                             strategy_->do_it();\n\n               }\n\n\
                                ~Testbed(){\n\n  if (strategy_)\n\n  delete strategy_;\n\
    \n               }\n\n private:\n\n  Strategic * strategy_;\n\n };\n\n} // end\
    \ Strategy\n\nvoid testStrategy()\n\n{\n\n using  namespace Behavioural_Patterns::Strategy;\n\
    \n Testbed tb;\n\n tb.choose_strategy(1);\n\n}\n\n# 23.  Implementing the Template\
    \ pattern\n\n## Solution\n\nThe template pattern allows the definition of  algorithms\
    \ skeleton as an abstract class, where subclasses have the responsibility of providing\
    \ its concrete behaviour. The word template is not related to C++ templates.\n\
    \nIn this example the class algorithm_base has 3 basic steps a(),  b(), and c()\
    \ and it is implemented according to two pure virtual methods X(), and Y() , which\
    \ are then appropriately implemented by the two derived classes.\n\nCode\n\nnamespace\
    \ Template{\n\n // Define the skeleton of an algorithm\n\n // deferring some steps\
    \ to client subclasses\n\n class  AlgorithmBase{\n\n void a() { std::cout << \"\
    \\tA\" << std::endl; }\n\n  void b() { std::cout << \"\\tB\" << std::endl; }\n\
    \n  void c() { std::cout << \"\\tC\" << std::endl; }\n\n  virtual  void X() =\
    \ 0;\n\n  virtual  void Y() = 0;\n\n public:\n\n void execute() { a(); X(); b(); \
    \ Y(); c(); }\n\n };\n\n class  AlgorithmRefinementFirstModel : public  AlgorithmBase{\n\
    \n void X() { std::cout << \"\\tX1\" << std::endl; }\n\n  void Y() { std::cout\
    \ << \"\\tY1\" << std::endl; }\n\n };\n\n class  AlgorithmRefinementSecondModel\
    \ :public  AlgorithmBase{\n\n void X() { std::cout << \"\\tX2\" << std::endl;\
    \ }\n\n  void Y() { std::cout << \"\\tY2\" << std::endl; }\n\n };\n\n} // end\
    \ Template\n\nvoid testTemplate()\n\n{\n\n using  namespace Behavioural_Patterns::Template;\n\
    \n AlgorithmBase * a = new  AlgorithmRefinementFirstModel();\n\n a->execute();\n\
    \n delete a;\n\n a = new  AlgorithmRefinementSecondModel();\n\n a->execute();\n\
    \n delete a;\n\n}\n\n# 24.  Implementing the Visitor pattern\n\n## Solution\n\n\
    The Visitor pattern allows to visit an object in a hierarchical way with no need\
