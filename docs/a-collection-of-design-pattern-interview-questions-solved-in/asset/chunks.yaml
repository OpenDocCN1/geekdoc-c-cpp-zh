    \n# Design Patterns\n\nDesign Patterns are a collection of logical models adopted\
    \ for solving recurrent problems which are observed during the process of software\
    \ development. Patterns are not dealing with core algorithms adopted by the programs\
    \ but are instead providing reusable  best practise solutions for a modern software\
    \ design.  For this reason algorithms are essential for computational efficiency,\
    \ and patterns are critical for building scalable architectural solutions.\n\n\
    In Object Oriented Programming Patterns typically show relationships and interactions\
    \ between classes and objects. In this book we will discuss three classes of Design\
    \ patterns:\n\n1) Creational patterns, which create objects on your behalf rather\
    \ than  instantiating them directly.\n\n2) Structural patterns, which compose\
    \ interfaces by leveraging inheritance. The composition of objects allows to create\
    \ new functionalities, simplify interfaces, adapt heterogeneous objects, improve\
    \ performances and reduce complexity.\n\n3) Behavioural patterns, which are used\
    \ to describe  interaction and communication among objects. Behavioural patterns\
    \ are also used to handle the internal state and the internal activities of each\
    \ object.\n\nDesign Patterns started to be adopted in Computer Science after the\
    \ publication of the book “[Design Patterns: Elements of Reusable Object-Oriented\
    \ Software](http://en.wikipedia.org/wiki/Design_Patterns_(book))” by the so-called\
    \ \"Gang of Four\" (Gamma et al.)[[1]](#part0000.html__ftn1)\n\n# Creational Patterns\n\
    \nCreational patterns create objects on your behalf rather than instantiating\
    \ them directly.\n\n# 1. Implementing the Abstract factory pattern\n\n## Solution\n\
    \nThe intuition behind an abstract factory pattern is to encapsulate a group of\
    \ factories that have a common behaviour with no need of specifying their classes.\
    \ This pattern allows to exchange concrete implementations with no need of changing\
    \ the code that uses those implementations. This is because the factory typically\
    \ returns an abstract pointer and the client does not care about internal details.\n\
    \nIn this example the class Widget has a pure virtual method. The two classes\
    \ derived by the Widget are implementing a specific draw() behaviour. In this\
    \ illustrative situation we just print a different text.\n\nCode\n\nnamespace\
    \ Abstract_Factory{\n\n // The Factory pattern suggests defining a\n\n // creation\
    \ services interface in a Factory\n\n // base class, and implementing each \"\
    platform\"\n\n // in a separate Factory derived class.\n\n class  Widget{\n\n\
    \ public:\n\n  virtual  void draw() = 0; // make it pure virtual\n\n};\n\n class\
    \  OSX_Button : public  Widget{\n\n public:\n\n  void draw() {\n\n std::cout <<\
    \ \"\\tOSX buttom\" << std::endl;\n\n               }\n\n };\n\n class  Windows_Button\
    \ : public  Widget{\n\n public:\n\n  void draw() {\n\n std::cout << \"\\tWindows\
    \ buttom\" << std::endl;\n\n               }\n\n };\n\n}; // end Abstract Factory\n\
    \nvoid testAbstractFactory(){\n\n using  namespace Creational_Patterns::Abstract_Factory;\n\
    \n Widget * w = new  OSX_Button();\n\n w->draw();\n\n delete w;\n\n}\n\n# 2. Implementing\
    \ the Builder pattern\n\n## Solution\n\nThe builder aims at separating the construction\
    \ of complex objects from their representation. Instead of using different constructors,\
    \ the pattern defines a single object: the builder. This object builds the desired\
    \ object step-by-step according to the configuration parameters defined by the\
    \ user. The Builder is different from the Abstract factory because the former\
    \ delegates the construction of the actual object to a specific auxiliary class/object,\
    \ while the latter uses inheritance for exchanging concrete implementations.\n\
    \nIn this example the class Builder is implemented according to a pure virtual\
    \ method configure which is defined in each subclass for setting up the parameters\
    \ used to drive  each subclass building process.  A set of specific tests based\
    \ on different conditions can be added to the skeleton code for driving the specific\
    \ action items taken by the ‘Simple Builder’ and by the ‘Advanced Builder’ respectively.\n\
    \nCode\n\nnamespace Builder{\n\n // Separate the construction of a complex object\
    \ from its\n\n // representation so that the same construction process\n\n //\
    \ can create different representations.\n\n class  Build{ // base class\n\n public:\n\
    \n  virtual  void configure() = 0;\n\n // here can add methods to see the internal\
    \ state\n\n protected:\n\n  int configuration_1_; // all the confs variable\n\n\
    \  int configuration_2_; // all the confs variable\n\n  //..."
