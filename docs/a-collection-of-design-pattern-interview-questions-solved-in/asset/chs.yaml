  \    - [解决方案]\n\n设计模式是一组用于解决软件设计中反复出现问题的模型。它们起源于所谓的“四人帮”（Gamma 等）出版的《设计模式：可复用面向对象设计的基础》一书。\n\
  \n设计模式分为三种类型：\n1) 创建型模式，涉及对象的创建机制。\n2) 结构型模式，涉及类和对象的组合结构。\n3) 行为型模式，涉及对象之间的通信。\n\
  \n## 创建型模式\n创建型模式代表他人创建对象，而不是直接实例化它们。它们使用了继承。\n\n### 1. 实现抽象工厂模式\n## 解决方案\n抽象工厂背后的直觉是封装一组具有共同接口的工厂。该模式允许在不指定具体类的情况下交换具体的实现。在这个示例中，`Widget`\
  \ 类有一个纯虚方法。派生自该类的两个类实现了特定的 `draw()` 行为。\n\n```cpp\nnamespace Abstract_Factory{\n\
  \ // 工厂模式建议在工厂\n // 基类中定义创建\n // 服务，并并在每个独立的派生 \n // 类中实现每个“平台”。\n class Widget{\n\
  \ public:\n  virtual  void draw() = 0; // 设为纯虚函数\n};\n\n class OSX_Button : public\
  \ Widget{\n public:\n  void draw() {\n    std::cout << \"OSX buttom\" << std::endl;\n\
  \  }\n};\n\n class Windows_Button : public Widget{\n public:\n  void draw() {\n\
  \    std::cout << \"Windows buttom\" << std::endl;\n  }\n};\n\n}; // 抽象工厂结束\n\n\
  void testAbstractFactory(){\n using namespace Creational_Patterns::Abstract_Factory;\n\
  \ Widget * w = new OSX_Button();\n w->draw();\n delete w;\n}\n```\n\n### 2. 实现建造器模式\n\
  ## 解决方案\n建造器模式的目标是将复杂对象的构建与其表示分离，使得相同的构建过程可以创建不同的表示。该模式没有使用不同的构造函数，而是定义了一个单一对象：建造器。该对象根据用户定义的配置参数逐步构建所需对象。\n\
  建造器与抽象工厂的不同之处在于，前者将实际对象的构建委托给特定的辅助类/对象，而后者使用继承。\n\n在这个示例中，`Builder` 类是一个纯虚方法 `configure()`\
  \ 实现的，该方法在每个子类中均被定义，用于设置驱动每个子类构建过程的参数。\n\n```cpp\nnamespace Builder{\n // 将复杂对象的构建与其\n\
  \ // 表示分离，以便相同的构建过程\n // 可以创建不同的表示。\n class Build{ base class\n public:\n  virtual\
  \  void configure() = 0;\n // 此处可以添加方法来查看内部状态\n protected:\n  int configuration_1_;\
  \ // 所有配置变量\n  int configuration_2_; // 所有配置变量\n```\n\n\n\n\n\n```cpp\nint configuration_n_;\
  \ // all the confs variable\n};\n\nclass SimpleBuilder : public Build { // a derived\
  \ class\npublic:\n  SimpleBuilder() {\n    // here you can add explicit tests on\
  \ configuration\n    // parameters for driving the ‘simple builder’\n    // creation\
  \ steps\n    std::cout << \"\\tSimple Builder\" << std::endl;\n  }\n\n  void configure()\
  \ {\n    // here you can add additional configuration steps\n  }\n};\n\nclass AdvancedBuilder\
  \ : public Build { // a derived class\npublic:\n  AdvancedBuilder() {\n    // here\
  \ you can add explicit tests on configuration\n    // parameters for driving the\
  \ ‘advanced builder’\n    // creation steps\n    std::cout << \"\\tAdvanced Builder\"\
  \ << std::endl;\n  }\n\n  void configure() {\n    // here you can add additional\
  \ configuration steps\n  }\n};\n\n// the class that use multiple builders\nclass\
  \ ClientClass {\npublic:\n  ClientClass(Build * builder) : builder_(builder){};\n\
  \nprivate:\n  Build * builder_; // stores the specific builder\n};\n\n // end Builder\n\
  \nvoid testBuilder() {\n  using namespace Creational_Patterns::Builder;\n  Build\
  \ * builder = new AdvancedBuilder();\n  Client c(builder);\n  delete builder;\n\
  }\n```\n\n### 3. 实现工厂模式\n\n## 解决方案\n工厂方法使用工厂来创建对象，而不需要显式地识别将创建的对象的精确类型。通常，工厂模式利用继承机制，并将实际创建过程委托给子类。工厂经常用于避免代码重复和抽象通用功能。从这个意义上说，父类通过使用创建步骤纯虚拟占位符来指定通用行为。然后，父类将创建细节委托给客户端提供的子类。\n\
  \n工厂模式可以看作是抽象工厂模式的简化版。工厂方法负责创建属于某一个家族的产品，而抽象工厂模式处理多个家族的产品。例如，使用工厂方法，你可以生产某个特定接口（如\
  \ `IAutomobile`）的实现类（如 SUV、旅行车、敞篷车等..），而使用抽象工厂方法，你可以生产特定工厂接口的实现（例如给定一个车辆家族中的所有类型的汽车，包括汽车、卡车、房车等等等等）。\n\
  \n在这个示例中，我们有一个基类和两个派生类 A 和 B，可以根据特定需求选择它们来交换实现。与第 10 页提供的示例唯一的区别在于 `OSX_Button`\
  \ 和 `Windows_Button` 代表了通用按钮家族中针对特定操作系统的特定工厂接口。\n\n### 代码\n```cpp\nnamespace Factory_Method{\n\
  \ // 定义一个用于创建对象的接口，\n   // 但让子类决定实例化哪个类。\n   // 工厂方法允许类将实例化推迟给\n   // 子类。\n   //\n\
  \   // 工厂方法可以多次返回同一个实例，\n   // 或者返回一个子类而不是该精确类型的对象。\n  class Base{\n  public:\n\
  \    virtual void what_to_do() = 0;\n  };\n\n  class A : public Base{\n  public:\n\
  \    A() { std::cout << \"\\tClass A\" << std::endl; }\n    void what_to_do() {\
  \ };\n  };\n\n  class B : public Base{\n  public:\n    B() { std::cout << \"\\tClass\
  \ B\" << std::endl; }\n    void what_to_do() { };\n  };\n}; // end Factory Method\n\
  \nvoid testFactoryMethod() {\n  using namespace Creational_Patterns::Factory_Method;\n\
  \  Base * b = new A();\n  b->what_to_do();\n  delete b;\n\n  b = new B();\n  b->what_to_do();\n\
  \  delete b;\n}\n```\n\n### 4. 实现原型模式\n\n## 解决方案\n原型模式创建一个原型实例并对其进行克隆。当克隆的成本低于创建新对象的成本时，这种模式非常有效。在例示例中，我们定义了一个抽象基类，它指定了一个受保护方法，并让子类注册自己。\n\
  \n### 代码\n```cpp\nnamespace Prototype{\n // 使用受保护方法指定\n // 要创建的对象类型，\n // 并维护一个静态数组。\n\
  \ class Base {\n public:\n  virtual Base* clone() = 0;\n  virtual void doSomething()\
  \ = 0;\n };\n\n class Factory {\n public:\n  static Base* makeBase(int choice);\n\
  \ private:\n  static Base* s_prototypes[];\n };\n\n class A : public Base {\n public:\n\
  \  Base* clone() override { return new A(*this); }\n  void doSomething() override\
  \ { std::cout << \"A is doing\\n\"; }\n };\n\n class B : public Base {\n public:\n\
  \  Base* clone() override { return new B(*this); }\n  void doSomething() override\
  \ { std::cout << \"B is doing\\n\"; }\n };\n\n Base* Factory::s_prototypes[] = {\
  \ new A(), new B() };\n\n Base* Factory::makeBase(int choice) {\n  return s_prototypes[choice]->clone();\n\
  \ }\n}; // end Prototype\n\nvoid testPrototype() {\n  using namespace Prototype;\n\
  \  Base * b = Factory::makeBase(0);\n  b->doSomething();\n  delete b;\n\n  b = Factory::makeBase(1);\n\
  \  b->doSomething();\n  delete b;\n}\n```\n\n### 5. 实现单例模式\n\n## 解决方案\n该模式将类的实例化限制为单个对象。在线程环境中，构造函数通常是私有的，并且只通过检查空为空来初始化一次静态实例。\n\
  \n### 代码\n```cpp\nnamespace Singleton{\n // 确保类只有一个实例，\n // 并为其提供一个全局访问点。\n class\
  \ Single{\n public:\n  static Single * getInstance(void) {\n  if (!instance_){\n\
  \  instance_ = new Single();\n  }\n  return instance_;\n  }\n\n\n\nprivate:\n  //\
  \ 不能被调用\n  Single(){ std::cout << \"\\tSingle\" << std::endl; };\n  static Single\
  \ * instance_; // 一个单例实例\n}; // end Singleton\n\nvoid testSingleton() {\n  using\
  \ namespace Singleton;\n  Single * s = Single::getInstance();\n  delete s;\n}\n\
  ```\n\n## 解决方案 – 双重检查锁定模式 (DCLP)\n在多线程环境中，必须在访问单例实例之前获取 `lock()`，以避免在跨线程时产生冲突。这通过下面所示的代码片段实现：该解决方案始终是正确的，但它需要始终执行昂贵的锁。有时使用的优化方案是所谓的双重检查锁定模式\
  \ (DCLP)，它在尝试获取锁之前会测试值是否为空。\n\n### 代码\n```cpp\nSingleton* Singleton::instance()\
  \ {\nLock lock; // 获取锁 \n if (pInstance == 0) {\n pInstance = new Singleton;\n }\n\
  \ return pInstance;\n} // 释放锁（通过 Lock 析构函数）\n\nSingleton* Singleton::instance()\
  \ {\n if (pInstance == 0) { // 第一次测试\n Lock lock;\n  if (pInstance == 0) { // 第二次测试\n\
  \ pInstance = new Singleton;\n  }\n }\n return pInstance;\n}\n```\n\n6. 实现对象池模式\n\
  \n\n\n\n对象池（Object pool）是一种用于缓存对象并避免昂贵的重复创建的模式。这种模式经常用于表示多个客户端共享的数据库连接对象。例如，该模式已用于实现\
  \ java JDBC 驱动[[3]](#part0000.html__ftn3)。\n\n在在这个简化的示例中，我们分配了一个包含三个对象的缓存，但决定采用一种非常幼稚的缓存策略，即始终返回缓存中的第一个对象。可以根据不同需求采用更复杂的分配策略。此外，在多线程环境下应该采用相应的锁策略。\n\
  \n### Code\n\n```cpp\nnamespace Object_Pool{\n   // 对象池用于管理对象缓存。\n   // 访问对象池的客户端可以通过直接向池\n\
  \   // 请求一个已经实例化的对象，来避免\n   // 创建新对象。\n  static  const int num_objects = 3;\n\n\
  \  class  Object_to_share{\n  public:\n    Object_to_share(){\n      std::cout <<\
  \ \"\\tAn object to share\" << std::endl;\n    };\n  };\n\n  class  Pool{\n  public:\n\
  \    Object_to_share * getObject(void){\n      std::cout << \"\\tGetting object\"\
  \ << std::endl;\n      return &(objpool_[0]);\n    }\n  private:\n    // 可以动态分配\n\
  \    Object_to_share objpool_[num_objects];\n  };\n}; // end ObjectPool\n\nvoid\
  \ testObjectPool(){\n  using namespace Creational_Patterns::Object_Pool;\n  Object_to_share\
  \ o;\n  Pool p;\n  p.setObject(&o);\n  Object_to_share * ptr = p.getObject();\n\
  }\n```\n\n### 结构性模式\n\n结构性模式通过继承来组合接口。对象的组合允许创建新功能、简化接口、适配异构对象、提高性能并降低复杂度。\n\n###\
  \ 7. 实现适配器模式（Adapter pattern）\n\n## 解决方案\n\n适配器模式用于通过适当的包装器，允许具有不兼容接口的类之间进行操作。\n\
  \n在此示例中，适配器类公有地继承 `DesiredInterface` 并私有地继承 `LegacyInterface`。`DesiredInterface`\
  \ 根据一个纯虚方法实现，该方法由适配器实现，以使现有类在不修改其源代码的情况下与其他类协作。还提供了一种由模板而非私有继承驱动的替代且更现代的实现。\n\n\
  ### Code\n\n```cpp\nnamespace Adapter{\n  // 适配器模式允许通过将一个类的\n  // 转换为客户端预期的接口，\n\
  \  // 让原本不兼容的类共同工作。\n  class  DesiredInterface{\n  public:\n    virtual  void make()\
  \ = 0;\n  };\n\n  class  LegacyInterface{\n  public:\n    LegacyInterface() {\n\
  \      std::cout << \"\\tCalled legacy\" << std::endl;\n    };\n  };\n\n  // 私有继承旧组件\n\
  \  class  adapter : public  DesiredInterface,\n  private  LegacyInterface{\n  public:\n\
  \    adapter() : LegacyInterface(){};\n    void make() {\n      std::cout << \"\\\
  tAdapter do something \" << std::endl;\n    }\n  };\n}; //end adapter\n\nvoid testAdapter()\n\
  {\n  using namespace Structural_Patterns::Adapter;\n  adapter * a = new  adapter();\n\
  \  a->make();\n  delete a;\n}\n\ntemplate<typename  T>\nstruct  GenericVehicleAdapter\
  \ : VehicleInterface {\n  GenericVehicleAdapter(T* x) : m(x) { }\n  virtual  void\
  \ Run() { return m->Run(); }\n  T* m;\n};\n\nvoid testTemplateAdapter() {\n  Shuttle\
  \ shuttle;\n  GenericAdapter<Shuttle> vehiclelike(&shuttle);\n}\n```\n\n### 8. 实现桥接模式（Bridge\
  \ pattern）\n\n## 解决方案\n\n桥接模式将抽象与其具体实现解耦。通过这种方式，它们可以独立演进。遵循该模式，类本身可以被视为一种特定的实现，而它更泛泛地被视为抽象。在\
  \ C++ 中，这种模式有时会与 PIMPL（私有实现）[[4]](#part0000.html__ftn4）混淆。然而它们之间存在差异。PIMPL 是隐藏实现的方法，目的是打破编译依赖。而桥接模式是支持多种实现的方法。\n\
  \n在此示例中，`bridge` 类有一个指针 `bridge_imp`，两个说明性的子类 `a` 和 `b` 通过 `a_imp` 和 `b_impi` 类提供具体的实现。\n\
  \n### Code\n\n```cpp\nnamespace Bridge{\n//// 将抽象与其实现解耦，以便\n// 者可以独立变化。这与\n// 让无关类共同工作的适配器\
  \ 模式不同。\n  class  BridgeImp{ // 解耦\n  public:\n    BridgeImp() {};\n  protected:\n\
  \    int my_data_;\n  };\n\n  class  Bridge{\n  public:\n    Bridge() {};\n  protected:\n\
  \    BridgeImp * imp_;\n  };\n\n  class  AImp : public  BridgeImp{ // 实现\n  public:\n\
  \    AImp() { my_data_ = 1; }\n  };\n\n  class  A : public  Bridge{ // 层级结构\n  public:\n\
  \    A() {\n      imp_ = new AImp();\n      std::cout << \"\\tcreated a\" << std::endl;\n\
  \    }\n    ~A() {\n      delete imp_;\n      std::cout << \"\\tdeleted a\" << std::endl;\n\
  \    }\n  };\n\n  class  BImp : public  BridgeImp{ // 实现\n  public:\n    BImp()\
  \ { my_data_ = 2; }\n  };\n\n  class  B : public  Bridge{ // 层级结构\n  public:\n \
  \   B() {\n      imp_ = new BImp();\n      std::cout << \"\\tcreated b\" << std::endl;\n\
  \    }\n    ~B() {\n      delete imp_;\n      std::cout << \"\\tdeleted b\" << std::endl;\n\
  \    }\n  };\n}; // end Bridge\n\nvoid testBridge()\n{\n  using namespace Structural_Patterns::Bridge;\n\
  \  A bridge;\n  B bridge;\n}\n```\n\n### 9. 实现组合模式（Composite pattern）\n\n## 解决方案\n\
  \n组合模式用于组合具有共同行为的对象，使其可以像单个对象一样被操作。在此示例中，`Component` 类由子类 `Leaf` 和 `Composite` 实现。此外，`Composite`\
  \ 维护了一个用于插入 `Components` 的向量。\n\n### Code\n\n```cpp\nnamespace Composite{\n// 将对象组合成树结构以表示\n\
  // 整个层结构。\n  class  Component{\n  public:\n    virtual  void traverse() = 0; //\
  \ 纯虚\n  };\n\n  class  Leaf : public  Component{\n  private:\n    int value_; //\
  \ 这里是需要的\n  public:\n    Leaf(int val) : value_(val) {};\n    void traverse() {\
  \ std::cout << value_ << \" \"; }\n  };\n\n  class  Composite : public  Component{\n\
  \  private:\n    std::vector< Component * > children_;\n    typedef std::vector<\
  \ Component * >const__iterator comp_const_it;\n  public:\n    void add(Component\
  \ * e) { children_.push_back(e); };\n    void traverse() {\n      comp_const_it\
  \ it = children_.begin();\n      comp_const_it it_end = children_.end();\n     \
  \ for (; it != it_end; ++it) {\n        (*it)->traverse();\n      }\n    }\n  };\n\
  }; // end composite\n\nvoid testComposite(){\n  using namespace Structural_Patterns::Composite;\n\
  \  Leaf l1(1);\n  Leaf l2(2);\n  Composite c;\n  c.add(&l1); c.add(&l2);\n  c.traverse();\n\
  }\n```\n\n### 10. 实现装饰器模式（Decorator pattern）\n\n## 解决方案 \n\n装饰器模式用于为对象已有的方法添加额外的行为。在某些情况下，现有的行为会被完全覆盖。这些额外的行为可以是永久的、瞬时的，或在运行时动态添加的。\n\
  \n在此示例中，类 `A_and_X`继承自 `A` 并相应地实现了虚方法 `make()`。\n\n### Code\n\n```cpp\nnamespace\
  \ Decorator{\n  // 动态地为对象附加额外的责任。\n  // 装饰器为扩展功能提供了比子类化更灵活的方案。\n  class  A{\n  public:\n\
  \    A() { std::cout << \"\\tA\" << std::endl; }\n    virtual  void make(void) {\n\
  \      std::cout << \"\\t making A\" << std::endl;\n    }\n  };\n\n  class  A_and_X\
  \ : public A{\n  public:\n    A_and_X() : A() {};\n    void make(void) override\
  \ {\n      std::cout << \"\\t making X\" << std::endl;\n    }\n  };\n}\n```\n\n\n\
  \n\n```cpp\n      }\n\n };\n\n // 装饰器是私有的；\n\n class A_and_X : public A{\n\n public:\n\
  \n  void make(void) {\n\n  A::make(); make_x();\n\n             };\n\n private:\n\
  \n  void make_x() {\n\n std::cout << \"\\t making X\" << std::endl;\n\n        \
  \     };\n\n };\n\n}; // 装饰器结束\n```\n\n### 11. 实现外观模式 (Façade pattern)\n\n## 解决方案\n\
  \n外观模式用于为大型代码段提供一个简化的接口，使得使用户只需要关注所需的功能。这种模式经常用于减少外部代码对库内部细节的依赖。\n\n在这个示例中，三个类 `A`、`B`、`C`\
  \ 被一个类 `façade` 封装，简化了对所有这些类的访问。\n\n### 代码\n\n```cpp\nnamespace Facade{\n\n // \"\
  facade\" 对象提供了一个单一、简化的\n\n // 接口，用于子系统内部的许多单独\n\n // 接口。\n class A{\n\n public:\n\
  \n A() { std::cout << \"\\tInit A\" << std::endl; }\n\n  void make() { std::cout\
  \ << \"\\tmake A\" << std::endl; }\n\n };\n\n class B{\n\n public:\n\n B() { std::cout\
  \ << \"\\tInit B\" << std::endl; }\n\n  void make() { std::cout << \"\\tmake B\"\
  \ << std::endl; }\n\n };\n\n class C{\n\n public:\n\n C() { std::cout << \"\\tInit\
  \ C\" << std::endl; }\n\n  void make() { std::cout << \"\\tmake C\" << std::endl;\
  \ }\n\n };\n\n Class Facade{\n\n public:\n\n             Facade() { a_.make(); b_.make();\
  \ c_.make(); }\n\n private:\n\n  A a_;\n\n  B b_;\n\n  C c_;\n\n };\n\n}; //end\
  \ facade\nvoid testFacade(){\n\n using  namespace Structural_Patterns::Facade;\n\
  \n Facade f;\n\n}\n```\n\n### 12. 实现享量化模式 (Flyweight pattern)\n\n## 解决方案\n\n享量化模式用于降低创建大量相似对象的成本。在那些性能至关重要的情况下，这尤为重要。\n\
  \n在这个示例中，`Icon` 是一个重量级类，存储在 `FlyweightFactory` 包含的 vector 中。通过这样，特定的图标只是指向特定对象的指针，该对象由窗口系统使用的每个相同图标的实例共享。\n\
  \n### 代码\n\n```cpp\nnamespace Flyweight{\n\n // 享量化模式通过共享对象降低内存\n\n // 方面的成本并提高性能\n\
  \n //\n\n // 客户端不应直接实例化享量化对象，\n\n // 应该专门从 FlyweightFactory\n\n // 对象中获取它们，以便正确共享。\n\
  \ class Icon { // 不要为每个 Icon 都拥有一个“巨大”的对象\n\n public:\n\n             Icon(unsigned\
  \  int  i) : shared_name_(i) {};\n\n  unsigned  int getName(){ return shared_name_;\
  \ }\n\n private:\n\n  unsigned  int shared_name_;\n\n };\n\n class FlyweightFactory{\n\
  \n public:\n\n  static  Icon * getIcon(unsigned  int  name)\n\n               {\n\
  \n                              std::vector<Icon *>::const_iterator it, it_end;\n\
  \n                              it = icons_.begin();\n\n                       \
  \       it_end = icons_.end();\n\n  for (; it != it_end; ++it){\n  if ((*it)->getName()\
  \ == name){\n\n                                            std::cout <<\n\n  \"\\\
  tFlyweight -> reusing an icon with name=\"\n\n << name << std::endl;\n\n  return\
  \ *it;\n\n                               }\n\n                             }\n\n\
  \                           icons_.push_back(new  Icon(name));\n\n             \
  \              std::cout <<\n  \"\\tCreated a new icon with name=\"\n\n << name\
  \ << std::endl;\n\n  return icons_.back(); }; 一个示例：获取一个分配的 Icon\n\n            \
  \ ~weightFactory()\n\n             {\n\n                              std::vector<Icon\
  \ *>::const_iterator it, it_end;\n\n                              it = icons_.begin();\n\
  \n                              it_end = icons_.end();\n\n  for (; it != it_end;\
  \ ++it){\n\n  delete *it;\n\n             }\n\n private:\n\n  static std::vector<Icon\
  \ *>\n\n };\n\n                                             std::vector<Icon *>\
  \ FlyweightFactory::icons_;\n\n// 强制分配\n}; // end Flyweight\nvoid testFlyweight(){\n\
  \n using  namespace Structural_Patterns::Flyweight;\n\n FlyFactory * fw = new  FlyweightFactory();\n\
  \n             fw->getIcon(0);\n\n fw->getIcon(0);\n\n delete fw;\n}\n```\n\n###\
  \ 13. 实现代理模式 (Proxy pattern)\n\n## 解决方案\n\n代理模式用于在需要额外功能的情况下调解对对象的访问。这些包括但不限于：访问控制、减少操作复杂度、网络访问、文件系统访问或对大内存块的访问，更一般的对资源的访问。\n\
  \n在这个示例中，`Proxy` 类用于访问需要额外功能的对象。\n\n### 代码\n\n```cpp\nnamespace Proxy{\n\n // 代理提供对对象的代理\n\
  \n // 示例：代理用于远程 // 文件系统。代理和装饰器有不同的用途 // 它们在请求发送者和接收者之间解耦\n\n // 它让多个对象有机会处理\n\n\
  \ // 请求。代理提供对对象的\n\n // 访问代理代理代理代理代理代理\n\n // 代理代理代理 // 代理。\n class ImageProxy{\n\
  \n private:\n\n  unsigned  int name_;\n\n public:\n\n             ImageProxy(unsigned\
  \  int  name) : name_(name)\n\n           {\n\nstd::cout << \"\\tCreating proxy\
  \ name=\"\n\n << name_ << std::endl;\n\n             }; ~ImageProxy()\n\n      \
  \       {\n\nstd::cout << \"\\tDeleting proxy name=\"\n\n << name_ << std::endl;\n\
  \n             };\n\n}; // end Proxy\n unsigned  int Image::name_ = 0;\nvoid testProxy()\n\
  \n{\n\n using  namespace Structural_Patterns::Proxy;\n\n ImageProxy img(Image::name_++);\n\
  ```\n```\n\n### 行为模式 (Behavioral Patterns)\n\n行为模式用于描述对象之间的交互和通信。行为模式还用于处理对象的内部状态和内部活动。\n\
  \n### 14. 实现责任链模式 (Chain of responsibility pattern)\n\n## 解决方案\n\n责任链模式将命令序列委托给处理链。对象可以动态地添加到列表中。\n\
  \n在这个示例中，`Base` 类维护了一个 `Base` 对象的列表。派生类可以注册自己，并且也可以提供详细信息的 `handle()`。\n\n### 代码\n\
  \n```cpp\nnamespace Chain_Of_Responsability{\n\n // 解耦请求发送者和其接收者\n\n // 它让多个对象有机会处理\n\
  \n // 请求\n class Base\n\n{\n\n public:\n\n             Base(unsigned  int  name)\
  \ : name_(name), next_(0) {};\n\n  void add(Base* n) // 添加到链中\n\n             {\n\
  \n  if (next_)\n  n->setPointer(next_);\nnext_ = n;\n\n             }\n\n  void\
  \ setPointer(Base * p) { next_ = p; }\n\n virtual  void handle(unsigned  int  who){\n\
  \ if (who == name_)\nstd::cout << \"\\t\" << name_ << \" is the one\"\n\n      \
  \                               << std::endl;\n\n  if (next_)\n\n              \
  \                             next_->handle(who);\n\n             }\n\n protected:\n\
  \n  unsigned  int name_;\n\n private:\n\n  Base * next_;\n\n };\n\n class H1 : public\
  \  Base{\n\n public:\n\n             H1(unsigned  int  name) : Base(name) {  };\n\
  \n void handle(unsigned  int  who){\n\nstd::cout << \"\\tHandler H1\" << std::endl;\n\
  \n  Base::handle(who);\n\n             }\n\n };\n\n class H2 : public  Base{\n\n\
  \ public:\n\n             H2(unsigned  int  name) : Base(name) {  };\n\n void handle(unsigned\
  \  int  who){\nstd::cout << \"\\tHandler H2\" << std::endl;\n\n  Base::handle(who);\n\
  \n             }\n\n };\n```\n\n\n\n\n\n```cpp\nstd::cout << \"\\tHandler H2\" <<\
  \ std::endl;\n\nBase::handle(who);\n\n}\n\n};\n\n}; // 结束 链责任链\n\nvoid testChainOfResponsability(){\n\
  \n  using namespace Behavioural_Patterns::Chain_Of_Responsability;\n\n  H2 h2(2);\n\
  \n  H1 h1(1);\n\n  Base b(0);\n\n  b.add(&h1);\n\n  b.add(&h2);\n\n  h2.handle(2);\n\
  }\n```\n\n### 15. 实现命令模式\n\n## 解决方案\n\n命令模式用于创建封装了行为和状态的对象。当我们想要委托一系列调用，而不需要显式地知道参数细节或涉及的特定方法时，经常需要这种模式。\n\
  \n在此示例中，`command` 类有一个构造函数，使用 `Person` 的名称和所使用的特定命令进行初始化，即 `talk()` 和 `listen()`。\n\
  \n### 代码\n\n```cpp\nnamespace Command{\n\n // Command 将调用操作的对象与 // 知道如何执行该操作的对象解耦。\n\
  \n class Person;\n\nclass Command\n\n{\n\nprivate:\n  Person *object_;\n  void(Person::\
  \ *method_)();\n\npublic:\n  Command(Person *o = 0, void(Person:: *m)() = 0) :\n\
  \    object_(o), method_(m)\n  { }\n  void execute()\n  {\n    (object_->*method_)();\n\
  \  }\n};\n\nclass Person\n\n{\n\nprivate:\n  std::string name_;\n  Command cmd_;\n\
  \npublic:\n  Person(std::string n, Command c) : name_(n), cmd_(c)\n  {}\n  void\
  \ talk()\n  {\nstd::cout << name_ << \" is talking\" << std::endl;\n\n    cmd_.execute();\n\
  \  }\n  void listen()\n  {\nstd::cout << name_ << \" is listening\" <<\nstd::endl;\n\
  \  }\n};\n\n}; // 结束 命令\n\nvoid testCommand()\n{\n\n  using namespace Behavioural_Patterns::Command;\n\
  \n  Person Angela(\"angela\", Command());\n\n  Person Willy(\"willy\", Command(&Angela,\
  \ &Person::listen));\n\n  Willy.talk();\n}\n```\n\n### 16. 实现解释器模式\n\n## 解决方案\n\n\
  解释器是一种用于实现特殊解释性语言的模式。其核心思想是为语中的每个符号创建一个类，用于定义解释器。\n\n在示例示例中，语言非常简单，输入是从字符流中获取的。\n\
  \n### 代码\n\n```cpp\nnamespace Interpreter{\n\nclass Interpreter\n\n{\n\npublic:\n\
  \  template<typename itr>\n  static void runInterpreter(itr from, itr to)\n  {\n\
  \  for (itr i = from; i != to; ++i)\n    {\n  switch (*i)\n    {\n  case 'h':\n\
  std::cout << \"Hello\";\n  break;\n  case 'w':\nstd::cout << \"world\";\n  break;\n\
  \  case ' ':\nstd::cout << ' ';\n  break;\n  case 'n':\nstd::cout << endl;\n  break;\n\
  \  default:\nstd::cout << \"Unknown command\";\n  }\n    }\n  } };\n};\n```\n\n\
  ### 17. 实现迭代器模式\n\n## 解决方案\n\n迭代器模式用于在不暴露对象表示法的情况下访问对象的所有元素。这种模式常用于 STL 等库，将对特定容器的访问与其具体实现解耦。在示例中，通过一个\
  \ `iterator` 访问 `stack` 类。\n\n```cpp\nnamespace Iterator{\n\n // 像列表这样的聚合对象应该提供\
  \ // 一种访问其元素的方法，而不暴露其 // 内部结构。\nclass Stack\n\n{\n\nprivate:\n  int items_[100];\
  \ // 应该是动态的\n  int sp_; // 当前项\n\npublic:\n  friend class Iterator; // 声明为友以访问迭代器\n\
  \  Stack() { sp_ = -1; }\nvoid push(int in) { items_[++sp_] = in; }\n  int pop()\
  \ { return items_[sp_--]; }\n  bool isEmpty() { return (sp_ == -1); }\n};\n\nclass\
  \ Iterator{\n\nprivate:\n  const Stack &stk_; // 访问结构\n  int index_;\n\npublic:\n\
  \  Iterator(const Stack &s) : stk_(s), index_(0)\n{} // 初始化迭代器\n  void operator++()\n\
  \  {\n    ++index_;\n  }\nbool operator()() // 获取结构末尾\n  {\n  return index_ != stk_.sp_\
  \ + 1;\n  }\n  int operator *()\n  {\n  return stk_.items_[index_];\n  }\n};\n\n\
  bool operator == (const Stack &s1,\n  const Stack &s2)\n{\n  Iterator it1(s1), it2(s2);\n\
  \  for (; it1(); ++it1, ++it2)\n  if (*it1 != *it2)\n  return false;\n return true;\n\
  }\n\n}; // 结束 迭代器\n\nvoid testIterator()\n{\n\n  using namespace Behavioural_Patterns::Iterator;\n\
  \n  Stack s;\n  Iterator it(s);\n  s.push(10);\n  s.push(20);\n  while (it())\n\
  \  {\nstd::cout << *it << ' ';\n\n    it++;\n  }\n}\n```\n\n值得注意的是，在 C++ 中迭代器通常通过使用指针语义结合解引用、递增等经典操作来实现。\n\
  \n```cpp\n// 这里的代码翻译逻辑：\nbool operator == (const Stack &s1,\n  const Stack &s2)\n\
  {\n  Iterator it1(s1), it2(s2);\n  for (; it1(); ++it1, ++it2)\n  if (*it1 != *it2)\n\
  \  return false;\n return true;\n}\n\n// ... (注：此处原文内容似乎出现了逻辑混乱或重复片段，已根据指令按“不要重复输出原文”原则进行清理处理)\n\
  ```\n\n### 18. 实现中者模式\n\n## 解决方案\n\n中者模式允许类之间实现松耦合。每个类不需要过多了解其他类，而是通过中者进行交互。在示例中，`list`\
  \ 充当了中者。\n\n### 代码\n\n```cpp\nnamespace Mediator{\n\n // 定义一个中介对象 // 对象。 示例列表是\n\
  class Node {\n\nprivate:\n  int v_;\n\npublic:\n  Node(int v) : v_(v){}\n  int getValue()\
  \ { return v_; }\n};\n\nclass List { // 中介节点\n\nprivate:\n  std::vector<Node *>\
  \ values_;\n  typedef std::vector<Node *>::const_iterator const_it;\n\npublic:\n\
  \  void add(Node *n){ values_.push_back(n); }\n  void traverse()\n  {\n  const_it\
  \ it1 = values_.begin();\n  const_it it2 = values_.end();\n  for ( it1 != it2; it1++)\n\
  std::cout << \" \" << (*it1)->getValue();\n  }\n};\n\n}; // 结束 中者\n\nvoid testMediator()\n\
  {\n\n  using namespace Behavioural_Patterns::Mediator;\n\n  Node n1(1), n2(2), n3(3);\n\
  \  List l; l.add(&n1); l.add(&n2); l.add(&n3);\n  l.traverse();\n}\n```\n\n### 19.\
  \ 实现备忘模式\n\n## 解决方案\n\n备忘模式是一种用于存储和恢复对象状态的模式。通常用于支持撤销操作、支持序列化或存储伪随机数生成器的种子。在示例中，`memento`\
  \ 类用于存储一个由类 client 保存并后续恢复的值。更复杂的实现可以使用 vector 存储多个值并支持“撤销”操作。\n\n### 代码\n\n```cpp\n\
  namespace Memento{\n\n // 客户端在需要对对象状态进行检查点记录时 // 向源对象请求备忘录\n // 如果客户端随后需要“回滚” //\
  \ 源对象的状态，它会将备忘录交还给源对象进行重新实例化。\nclass Memento{\n\npublic:\n  Memento(int val) : value_(val){}\n\
  \  int getValue() { return value_; };\n\nprivate:\n  friend class Client;\n  int\
  \ value_;\n};\n\nclass Client{ // 客户端\n\npublic:\n  Client(int value) : value_(value){}\n\
  \  void increment() { ++value_; } // 状态改变;\n  int get_value() { return value_; }\n\
  \n Memento * create_memento() {\n\n  return new Memento(value_);\n}\n\n};\n```\n\
  \n\n\n\n```cpp\n  void restore_from_memento(Memento * m) {\n    value_ = m->value_;\n\
  \  }\n\nprivate:\n  int value_;\n};\n}; // end memento\n\nvoid testMemento()\n{\n\
  \  using namespace Behavioural_Patterns::Memento;\n  Client c(20);\n  Memento *\
  \ m = c.create_memento();\n  std::cout << m->getValue();\n  delete m;\n}\n```\n\n\
  ### 20. 实现观察者模式\n\n## 解决方案\n\n观察者模式实现了发布者/订阅者之间的交互，其中多个注册的观察者对象会收到发布者产生的事件通知。这种模式经常用于实现分布式事件处理系统和窗口系统。\n\
  \n在这个示例中，`Observer` 类根据纯虚方法 `update` 实现，而该方法又由子类 `a_observer` 和 `b_observer` 分别实现。`subject`\
  \ 类维护了一个观察者向量（`vector`），通过调用 `notify()` 方法来通知它们。请注意，新的观察者可以动态地附加到现有列表中。\n\n### 代码\n\
  \n```cpp\nnamespace Observer{\n  // 当一个对象改变状态时\n  // 所有的依赖者都会收到通知\n  // 并自动更新。\n\
  \  class Observ{\n  public:\n    virtual void update(int value) = 0;\n  };\n\n \
  \ class AObserv : public Observ{\n  public:\n    void update(int value) {\n    \
  \  std::cout << \"\\ta seeing \" << value << std::endl;\n    }\n  };\n\n  class\
  \ BObserv : public Observ{\n  public:\n    void update(int value) {\n      std::cout\
  \ << \"\\tb seeing \" << value << std::endl;\n    }\n  };\n\n  class Subject{\n\
  \  private:\n    int value_;\n    std::vector<Observ *> observers_;\n    typedef\
  \ std::vector<Observ *>::const_iterator const_it;\n  public:\n    void set_value(int\
  \ value) {\n      value_ = value; notify();\n    }\n    // 附加观察者\n    void attach(Observ\
  \ * o) {\n      observers_.push_back(o);\n    }\n    void notify() {\n      const_it\
  \ it = observers_.begin(), it_end = observers_.end();\n      for (; it != it_end;\
  \ ++it)\n        (*it)->update(value_);\n    }\n  };\n}; // end observer\n\nvoid\
  \ testObserver()\n{\n  using namespace Behavioural_Patterns::Observer;\n  AObserv\
  \ a;\n  BObserv b;\n  Subject s;\n  s.attach(&a); s.attach(&b);\n  s.set_value(3);\n\
  }\n```\n\n### 21. 实现状态模式\n\n## 解决方案\n\n状态模式允许对象在自身内部状态改变时改变其行为。例如，这种模式可以用于运行时更改对象的状态。\n\
  \n在这个简单的示例中，`state` 类根据两个虚方法 `on(..)` 和 `off(..)` 实现，而这两个方法反过来又分别在 `OFF()` 和 `ON()`\
  \ 类中实现。当前状态以指针的形式在 `tool` 类中维护。\n\n```cpp\nnamespace State {\n  // 允许对象在状态改变时改变其行为。\n\
  \  // 对象看起来像是改变了它的类。\n  class tool{\n  private:\n    state * current_;\n  public:\n\
  \    void set_current(state * s) { current_ = s; }\n    void on();\n    void off();\n\
  \  };\n\n  class state{\n  public:\n    virtual void on(tool * t);\n    virtual\
  \ void off(tool * t);\n  };\n\n  void tool::on() {\n    std::cout << \"on is the\
  \ state\";\n    current_->on(this);\n  }\n  void tool::off() {\n    std::cout <<\
  \ \"off is the state\";\n    current_->off(this);\n  }\n\n  class OFF : public state{\n\
  \  public:\n    void on(tool * t);\n  };\n\n  class ON : public state{\n  public:\n\
  \    void off(tool * t) {\n      std::cout << \"\\tgoing to OFF\" << std::endl;\n\
  \      t->set_current(new OFF());\n      delete this;\n    }\n  };\n\n  void OFF::on(tool\
  \ * t) {\n    std::cout << \"\\tgoing to ON\" << std::endl;\n    t->set_current(new\
  \ ON());\n    delete this;\n  }\n}; // end State\n\nvoid testState()\n{\n  using\
  \ namespace Behavioural_Patterns::State;\n  Tool * t = new Tool();\n  ON * on =\
  \ new ON();\n  t->set_current(on);\n  on->off(t);\n}\n```\n\n### 22. 实现策略模式\n\n\
  ## 解决方案\n\n策略模式允许在给定一组相似算法的情况下，运行时选择实现特定行为的特定算法。在这个示例中，我们有两个由超类 `strategy` 派生的类\
  \ `algo1` 和 `algo2`。\n\n### 代码\n\n```cpp\nnamespace Strategy{\n  // 策略允许算法从使用它的客户端独立变化。\n\
  \  enum ALGO { ALGO1, ALGO2 };\n  class Strategic{\n  public:\n    virtual void\
  \ do_it() = 0;\n  };\n\n  class Algo1 : public Strategic{\n    void do_it() {\n\
  \      std::cout << \"\\tcalling algo1\" << std::endl;\n    }\n  };\n\n  class Algo2\
  \ : public Strategic{\n    void do_it() {\n      std::cout << \"\\tcalling algo2\"\
  \ << std::endl;\n    }\n  };\n\n  class Testbed{\n  public:\n    Testbed() : strategy_(NULL)\
  \ {};\n    void choose_strategy(unsigned int what) {\n      Strategic * tmp;\n \
  \     switch (what){\n        default:\n        case ALGO1:\n          tmp = new\
  \ Algo1();\n          delete strategy_;\n          strategy_ = tmp;\n          break;\n\
  \        case ALGO2:\n          tmp = new Algo2();\n          delete strategy_;\n\
  \          strategy_ = tmp;\n          break;\n      }\n    }\n    ~Testbed(){\n\
  \      if(strategy_) delete strategy_;\n    }\n  private:\n    Strategic * strategy_;\n\
  \  };\n} // end Strategy\n\nvoid testStrategy()\n{\n  using namespace Behavioural_Patterns::Strategy;\n\
  \  Testbed tb;\n  tb.choose_strategy(1);\n}\n```\n\n\n\n\n\n// 这种分离的实际结果是，可以在不修改现有对象结构的情况下添加新的操作。从本质上说，访问者（visitor）允许在不修改类本身的情况下向一组类添加新的虚函数；\n\
  \n```cpp\nclass A;\nclass B;\nclass C;\nclass Parent;\n\n// 访问者接口\nstruct parent_element_visitor\
  \ {\n    virtual void visit(A &a) const = 0;\n    virtual void visit(B &b) const\
  \ = 0;\n    virtual void visit(C &c) const = 0;\n    virtual void visit(Parent &p)\
  \ const = 0;\n    virtual ~parent_element_visitor() {};\n};\n\n// 层次结构中单个元素的接口\n\
  struct parent_element {\n    virtual void accept(const parent_element_visitor& visitor)\
  \ = 0;\n    virtual ~parent_element() {};\n};\n\n// 层次结构中的类\nclass A : public parent_element\
  \ {\npublic:\n    A() { std::cout << \"\\tcalled A\" << std::endl; }\n    void accept(const\
  \ parent_element_visitor & v) {\n        v.visit(*this);\n    }\n};\n\n// 层次结构中的类\n\
  class B : public parent_element {\npublic:\n    B() { std::cout << \"\\tcalled B\"\
  \ << std::endl; }\n    void accept(const parent_element_visitor & v) {\n       \
  \ v.visit(*this);\n    }\n};\n\n// 层次结构中的类\nclass C : public parent_element {\n\
  public:\n    C() { std::cout << \"\\tcalled C\" << std::endl; }\n    void accept(const\
  \ parent_element_visitor & v) {\n        v.visit(*this);\n    }\n};\n\n// 层次结构中所有对象的容器\n\
  class Parent {\npublic:\n    typedef std::vector<parent_element*>::const_iterator\
  \ const_parent_collection_it;\n    typedef std::vector<parent_element*> parent_collection;\n\
  \n    parent_collection& getElements() {\n        return elements_;\n    }\n\n \
  \   Parent() {\n        elements_.push_back(new A());\n        elements_.push_back(new\
  \ B());\n        elements_.push_back(new C());\n    }\n\n    ~Parent() {\n     \
  \   for (const_parent_collection_it it = elements_.begin(); it != elements_.end();\
  \ ++it) {\n            delete *it; // 调用析构函数\n        }\n    }\n\nprivate:\n   \
  \ parent_collection elements_;\n};\n\n// 访问者的具体实现\nclass parent_model_one_visitor\
  \ : public parent_element_visitor {\npublic:\n    void visit(A &a) const { std::cout\
  \ << \"\\tvisit A, model one\" << std::endl; }\n    void visit(B &b) const { std::cout\
  \ << \"\\tvisit B, model one\" << std::endl; }\n    void visit(C &c) const { std::cout\
  \ << \"\\tvisit B, model one\" << std::endl; } // 注意：原文此处是 B\n    void visit(Parent\
  \ &p) const {\n        parent_collection& elements = p.getElements();\n        for\
  \ (Parent::const_parent_collection_it it = elements.begin(); it != elements.end();\
  \ ++it) {\n            // 调用访问者回调\n            (*it)->accept(*this);\n        }\n\
  \    }\n};\n\n// 第二个访问者的具体实现\nclass parent_model_two_visitor : public parent_element_visitor\
  \ {\npublic:\n    void visit(A &a) const { std::cout << \"\\tvisit A, model two\"\
  \ << std::endl; }\n    void visit(B &b) const { std::cout << \"\\tvisit B, model\
  \ two\" << std::endl; }\n    void visit(C &c) const { std::cout << \"\\tvisit B,\
  \ model two\" << std::endl; } // 注意：原文此处是 B\n    void visit(Parent &p) const {\n\
  \        parent_collection& elements = p.getElements();\n        for (Parent::const_parent_collection_it\
  \ it = elements.begin(); it != elements.end(); ++it) {\n            (*it)->accept(*this);\n\
  \        }\n    }\n}; // 访问者结束\n\nvoid testVisitor() {\n    using namespace Behavioural_Patterns;\n\
  \    Parent p;\n    parent_element_visitor * pv = new parent_model_one_visitor();\n\
  \    pv->visit(p);\n    delete pv;\n\n    pv = new parent_model_two_visitor();\n\
  \    pv->visit(p);\n    delete pv;\n}\n```\n\n### 关于作者\n一位经验的数据挖掘工程师，对技术和消费者领域充满热情。对大规模数据集上的搜索和机器学习感兴趣，特别是查询分析、建议和通用排名。Antonio\
