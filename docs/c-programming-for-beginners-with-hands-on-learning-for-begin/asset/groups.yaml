    ### 3.2.7 外部引用与 extern 关键字


    - 讨论在函数和外部链接中使用 `extern` 关键字。

    - 解释当一个源文件中声明的函数在另一个源文件中使用时，如何使用 `extern`。


    ### 3.2.8 前向声明


