    ## Chapter 6. C Standard Library


    ### 6.1 Standard Input/Output Functions


    There are a number of functions in the C Standard Library that make input and
    output operations easier. The standard input/output functions, such as those for
    file operations, formatted output, and console input/output, will be covered in
    this section.


    #### 6.1.1 Overview of Common Input/Output


    - Define standard input and output as the default streams for reading from and
    writing to the console.

    - Talk about how standard I/O is important for C programming.


    #### 6.1.2 Uses in printf and sprintf


    - Introduce formatted console output using the printf function.

    - Talk about escape sequences, format specifiers, and several output formatting
    choices.

    - For formatted string output, introduce the sprintf function.


    #### 6.1.3 scanf and sscanf Uses


    - Describe the formatted console input function, scanf.

    - Talk about the use of format specifiers in input reading.

    - Describe how to read formatted data from strings using the sscanf function.


    #### 6.1.4 Functions for putchar and getchar


    - Describe the unformatted character input and output getchar and putchar routines.

    - Talk about how they are used while creating and reading individual characters.


    #### 6.1.5 File Input/Output (fprintf, fscanf, fopen, fclose, fgets, fputs, etc.)


    - Provide functions for file I/O so that you may operate with files.

    - Talk about the fopen, fclose, fgets, fputs, fprintf, and fscanf functions.

    - Examine instances of writing to and reading from files.


    #### 6.1.6 Conventional I/O Error Management (perror, feof, ferror)


    - Talk about how conventional I/O operations handle errors.

    - Add features such as perror to output error messages and feof and ferror to
    verify the state of files.


    #### 6.1.7 Streams: stdin, stdout, stderr


    - Describe the stdin, stdout, and stderr standard streams.

    - Talk about their function in error reporting and console I/O.


    #### 6.1.8 putc and getc Uses


    - Describe the unformatted character input and output getc and putc routines.

    - Talk about how they are similar to and different from putchar and getchar.


    #### 6.1.9 Functions for fgets and fputs


    - Talk about reading and writing strings using file I/O with fgets and fputs.

    - Take care of buffer overflows and newline character problems.


    #### 6.1.10 Width and Precision of Formatted I/O


    - ✓ Talk about the width and precision specifiers in formatted I/O routines.

    - ✓ Examine the options for adjusting the output''s field width, decimal places,
    and number of digits.


    #### 6.1.11 fseek and rewind Uses


    - ✓ Describe the file pointer repositioning functions, fseek and rewind.

    - ✓ Talk about situations when relocation is required and how to make use of these
    features.


    #### 6.1.12 Functions of ferror and feof


    - ✓ Talk about using the feof and ferror functions to verify that file I/O error
    conditions and end-of-file conditions are met.

    - ✓ Describe their function in file processing and error handling.


    #### 6.1.13 Binary I/O (fwrite, fread)


    - ✓ Introduce the fwrite and fread binary I/O functions, which are used to read
    and write raw binary data.

    - ✓ Talk about things to keep in mind while handling binary files.


    #### 6.1.14 fscanf and printf Format Specifications


    - ✓ Examine more printf and scanf format specifiers.

    - ✓ Talk about specifiers for strings, characters, floats, integers, and more.


    #### 6.1.15 The vscanf, vfprintf, and vprintf Features (Optional)


    - ✓ Give a brief introduction to the printf and scanf functions'' variable argument
