    ### 3.2.5 多个源文件


    - 研究将 C 代码划分为多个源文件的概念。

    - 研究不同头文件中的函数原型，以及它们如何促进多个源文件之间的协作。


    ### 3.2.6 静态函数


    - 描述与函数相关的 `static` 关键字。

