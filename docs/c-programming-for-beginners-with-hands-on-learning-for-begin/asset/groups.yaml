    C 程序。


    ### 3.2.1 函数原型是必要的


    - ✓ 描述函数原型如何帮助编译器在实际定义之前了解程序中使用了哪些函数。

    - ✓ 讨论在函数被声明之前就调用函数所面临的困难。


