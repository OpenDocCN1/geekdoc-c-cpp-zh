    ## 3.1 理解函数

    在 C 中，函数是执行特定操作的模块化代码段。它们对于将复杂程序分解为更小、更易管理的、可重复使用的部分至关重要。我们将在本节深入探讨其基础，检查函数的语法、使用和优点。


