    +   - Use descriptive and meaningful names for your variables to make them meaningful.
    Don''t use obscure or single-letter names. This makes the code simpler to read
    and understand, which will make it easier for you and others to understand in
    the future.

    +   - Clearly Named Functions: Select function names that express their purpose
    very well. The necessity for lengthy comments to describe a function''s purpose
    is eliminated by a well-named function. When a function returns a value or an
    object, use a noun; for functions that execute activities, use verbs.'
