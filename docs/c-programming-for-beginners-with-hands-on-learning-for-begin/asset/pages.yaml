  md: '# Chapter 1. Introduction to C Programming


    # 1.1 Overview of Programming Languages


    # 1.1 Programming Language Overview


    Computers may receive instructions from humans via programming languages. Every
    programming language is designed for a particular job or purpose and has its own
    syntax, semantics, and purpose. We''ll explore the wider world of programming
    languages in this part, then concentrate specifically on C.


    # 1.1.1 Language Evolution in Programming


    +   - Examine how programming languages have evolved historically, beginning with
    early assembly and machine code.

    +   - Talk about the need for higher-level languages to improve productivity and
    readability for humans.

    +   - Highlight important turning points in programming history, such the development
    of procedural languages and the use of Fortran, COBOL, and Lisp.


    # 1.1.2 Programming Language Types


    +   - Sort programming languages into imperative, object-oriented, functional,
    and declarative categories based on these paradigms.

    +   - Talk about each paradigm''s features and applications.

    +   - Describe the differences between high-level and low-level languages.


    # 1.1.3 The Classification of Programming Languages


    +   - Sort languages into categories such as general-purpose, scripting, systems
    programming, web development, etc. according on the applications they are used
    for.'
  merge: -1
  img_proc: true
