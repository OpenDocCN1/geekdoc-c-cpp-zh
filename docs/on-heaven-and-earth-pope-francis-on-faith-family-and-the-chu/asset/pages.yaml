  md: 'represented the longing for a reuniting of Argentineans. This scene aims to
    work to establish a “culture of encounter.” Many times I alluded to the difficulty
    that as Argentineans have to consolidate that “culture of encounter;” instead
    it seems that we are seduced into dispersion and the abysses that history has
    created. At times, we are better able to identify ourselves as builders of walls
    than as builders of bridges. We lack the embrace, weeping and the question about
    the father, for our matrimony, for the roots of our Fatherland. There is an absence
    of dialogue.


    Is it true that Argentineans do not want dialogue? I would not say that way. Rather
    I think that we succumb to attitudes that do not permit us to dialogue: domination,
    not knowing how to listen, annoyance in our speech, preconceived judgments and
    so many others.


    Dialogue is born from a respectful attitude toward the other person, from a conviction
    that the other person has something good to say. It supposes that we can make
    room in our heart for their point of view, their opinion and their proposals.
    Dialogue entails a warm reception and not a preemptive condemnation. To dialogue,
    one must know how to lower the defenses, to open the doors of one’s home and to
    offer warmth.


    There are many barriers in everyday life that impede dialogue: misinformation,
    gossip, prejudices, defamation, and slander. All of these realities make up'
