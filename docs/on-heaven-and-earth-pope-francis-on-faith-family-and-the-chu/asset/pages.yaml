    deny themselves many things in order to achieve success. The Christian life is
    also a sort of sport, a struggle, a race where one has to detach oneself from
    the things that separate us from God. Beyond this, I want to point out that the
    Devil is one thing. It is quite another matter to demonize things or people. Man
