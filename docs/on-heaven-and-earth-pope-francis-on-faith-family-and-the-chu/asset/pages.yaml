  md: '# 2. ON THE DEVIL


    BERGOGLIO: The Devil, theologically, a being that opted not to accept the plan
    of God. The masterpiece of the Lord is man; some angels did not accept it and
    they rebelled. The Devil is one of them. In the book of Job he is the tempter,
    the one that looks to destroy the work of God, he that brings us to self-sufficiency,
    pride. Jesus defines him as the Father of Lies, and the book of Wisdom says that
    sin entered the world through the Devil''s envy of God''s masterpiece. His fruits
    are always destruction: division, hate, and slander. And in my personal experience,
    I feel him every time that I am tempted to do something that is not what God wants
    for me. I believe the Devil exists. Maybe his greatest achievement in these times
    has been to make us believe that he does not exist, and that all can be fixed
    on a purely human level. Man''s life on'
