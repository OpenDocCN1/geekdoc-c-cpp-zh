  md: 'Jorge Mario Bergoglio was born in Buenos Aires in 1936. He was elected Archbishop
    of Buenos Aires in 1998 and was created cardinal by Pope John Paul II in 2001
    with the title of cardinal priest of San Roberto Bellarmino, a church served by
    Jesuits in Rome. He was elected the 266th Pope in March 2013.


    Rabbi Abraham Skorka was born in Buenos Aires in 1950. He is Rector of the Latin
    American Rabbinical Seminary and has published numerous articles in the fields
    of Talmudic and Biblical research.


