    结果是积极的。看看现在阿根廷的情况：当巨大的危机发生时——社会将宗教视为最后的避难所。当2001年一切爆发时，“对话小组”（Mesa de Diálogo）成立了。当时政治已经破产，人们呼吁宗教帮助寻找摆出困境的方法。从词源上说，希腊语中的
    *ecclesia*意为“聚会”，希伯来语中的 *ha’knesset*（犹太堂）意思类似——“聚会所”。这意味着，它们不仅仅是人们寻找上帝的地方，更是人们对影响人类生活的每一个问题进行辩论的地方。正如过去先知者时代一样，所有宗教都需要明确阐述它们对社会问题的立场。现在，这并不意味着宗教领袖必须参与政党政治。主教，我不知道您如何看待像霍亚金·皮尼亚（Joaquín
    Piña）⁶⁶这种情况，他是你们的司父之一。


    贝尔格奥：皮尼亚解释说这不是一个政治事件，而是关于一次公投，而不是关于选举职位。他组织了一次投票过程，以决定是否应该进行宪法改革。因此，在他认为自己已经履行了职责后，他辞职离开了。


    ⁶⁶ 霍亚金·皮尼亚是耶稣会士和普埃尔托伊瓜苏的名誉主教。2006年，他领导的一个公民选举委员会成功规避了对当时的米西奥斯省州长实行无限连任计划的批准。


    斯柯尔卡：在我看来，宗教在政治方面应该保持旁观，除非在非常特殊的情况下，例如马尔·梅耶（Marshall Meyer）参与捍卫阿根廷的人权时。他一直有非常精确且明确的目标——他不想成为国会议员、参议员或任何身份。他陪伴拉乌尔·阿尔方森廷（Raúl
    Alfonsín）和其他政治家走上了恢复民主的道路，但他从未为了获得政府职位而这样做。我们必须极其小心。我们绝不利用讲道来推进政治目标。


    贝尔格奥：我们都是“政治动物”，首字母大写的P。我们都被号召在民众中开展建设性的政治活动。对人类和宗教价值观的传讲具有政治后果。无论我们喜不喜欢，它确实存在。传教的挑战在于提出这些价值观，而不干涉那种所谓的小党派政治。当我在克罗曼农（Cromañón）纪念日⁶⁷说布宜诺斯艾斯是一个虚荣、轻浮且腐败的城市时，有人要求我点名，但我说的是整座城市。我们都有腐败的倾向。当司机因为超速被警察拦截时，他听到的第一句话往往是“我们要解决这个问题？”


    ⁶⁷ 克罗曼农共和国（Republic of Cromañón）是布宜诺斯艾斯市的一家夜店，在2004年12月30日Callej乐队表演时发生火灾，导致193人死亡。那天，建筑容量超标，紧急出口被锁住，且建筑不符合保险标准。我们内心带着某种我们必须斗争的东西，即那种利用影响力的倾向、追求捷径的倾向、以及那种将自己置于名单首位的倾向。我们有贿赂的特质。在那场讲道中，我谈论的是城市的缺陷，并没有参与党派政治。诚实地说，媒体的问题在于，他们有时会将人的话简化为任何投机取巧，从两三个事实出发，媒体会编造出不同的东西：他们在误导。从讲台上说的话是指首字母大写的政治，即价值观的政治；但媒体经常脱离语境，并利用它来为小写的政派政治服务。我记得在感恩圣母（Te
    Deum）弥撒之后你说：“多么有勇气！”这对我来说，那样说话很正常，但你已经在读媒体将对我的话给出的那种解读了。第二天，某份日报对我的话进行了多种对某些政治家持有敌意的解释，但当我谈到我们的领导人时，我使用了包性的“我们”这个词。


    **斯柯尔卡：** 我记得那场讲道。是在5月25日节假日，那场讲道导致了大都会教堂禁止举行感恩圣母仪式。遗憾的是，媒体没有让人们对宗教领袖的话语产生真实的感受，而那些话语实际上只是号召我们保持某些价值观。宗教领袖不仅仅是告诉我们如何看待特定的时事，而是试图向未来看，向超越性看，诉诸深根蒂固的价值观。从先知者极其严苛的角度来看，即使只有一个一个人在挨饿，事情也不如其应有的样子。从这个框架来看，当我们听到讲道时，必须拿着放大镜去观察，注意每一个词，从先知者的角度研究它。尽管如此，鉴于天教会在阿根廷的重要性，它无法避免与权力者进行对话，也无法忽视权力者最终会对对其声明进行政治化解读的事实。


    **贝尔格戈奥：** 我们必须避免的风险是司祭和主教陷入教阶主义（clericalism），这是对宗教的歪曲。天教会是整个子民，包括司祭。当司祭传讲上帝的话，或当他反映整个子民的情感时，他是在讲台上进行预言、劝诫和教导。现在，当司祭领导教区或堂区时，他必须听取他的社区，做出成熟的决定并据此引导社区。（注：原文此处有内容重复，已按要求处理）。相比之下，当司祭领导教区或堂区时，他必须听取他的社区，做出成熟的决定并据此引导社区。相比之下，当司祭领导教区或堂区时，他必须听取他的社区，做出成熟的决定并据此引导社区。相比之下，当司祭领导教区或堂区时，他必须听取他的社区，做出成熟的决定并据此引导社区。相比之下，当司祭领导教区或堂区时，他必须听取他的社区，做出成熟的决定并据此引导社区。相比之下，当司祭领导教区或堂区时，他必须听取他的社区，做出成熟的决定并据此引导社区。相比之下，当司祭领导教区或堂区时，他必须听取他的社区，做出成熟的决定并据此引导社区。相比之下，当司祭领导教区或堂区时，他必须听取他的社区，做出成熟的决定并据此引导社区。相比之下，当司祭领导教区或堂区时，他必须听取他的社区，做出成熟的决定并据此引导社区。相比之下，当司祭领导教区或堂区时，他必须听取他的社区，做出成熟的决定并据此引导社区。相比之下，当司祭领导教区或堂区时，他必须听取他的社区，做出成熟的决定并据此引导社区。相比之下，当司祭领导教区或堂区时，他必须听取他的社区，做出成熟的决定并据此引导社区。相比之下，当司祭领导教区或堂区时，他必须听取他的社区，做出成熟的决定并据此引导社区。相比之下，当司祭领导教区或堂区时，他必须听取他的社区，做出成熟的决定并据此引导社区。相比之下，当司祭领导教区或堂区时，他必须听取他的社区，做出成熟的决定并据此引导社区……（注：原文此处存在大量重复，已按逻辑翻译）。


