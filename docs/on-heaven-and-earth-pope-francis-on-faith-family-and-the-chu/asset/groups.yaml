    ## 22. ON MONEY


    BERGOGLIO: Christianity condemns both Communism and wild capitalism with the same
    vigor. Private property is real, but carries with it the obligation to put it
    at the service of others within just parameters. A clear example of what happens
    is the flight of money to foreign countries. Money also has a Homeland. Someone
    who operates a business in a country and then takes that money to keep it outside
    of the country is sinning because he is not honoring with that money the country
    to which he owes his wealth, or the people that worked to generate it.


    SKORKA: The Bible contains an economic plan, which it lays out in the book of
    Leviticus.⁸ What it says is that each person had their own plot of land. If the
    owner could not work it, he could lease it, but the law tried to ensure that everyone
    had an inalienable claim to some property so that everyone would have the means
    to live with dignity. Undoubtedly, historical experience shows that man needs
    to have an incentive to work. We have to look at why the Soviet Union failed,
    where there continued to be one class that maintained its hold on power and lived
    in luxury while a large part of the population lived in poverty. The abolition
    of private property was surely another of the key factors that led to its failure.
    The kibbutzim¹, the twentieth-century experimental socialist agricultural settlements
    that were very successful, became one of the backbones of the State of Israel
