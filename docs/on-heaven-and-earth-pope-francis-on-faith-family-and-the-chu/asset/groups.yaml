    Eva Perón）值得特别提及。当埃维塔提出一条从劳工部开始、后来在她的基金会开展社会承诺之路时，与慈善协会产生了冲突，因为她走得更远，带来了更多的社会整合。听着，拉比，最初教会并没有对抗佩隆，佩隆与神职人员成员关系亲近；佩隆希望利用教会社会学说中的元素，并将其中许多内容融入他的著作和提书中。为他提供这些元素的人之一是雷西斯塔的主教，德卡洛主教（Bishop
    De Carlo）。他是佩隆夫妇的好朋友，帮助他们撰写了一些社会类书籍。他与他们合作非常密切，以至于佩隆主义政府在雷西斯塔市入口附近的环岛为他建造了一座神学院。每当佩隆去那里，他会在神学院的阳台上向聚集在环岛的人们演讲。德卡洛被冷落，被指控过度参与新政治。他是一位伟大的牧者，他说他从未妥协自己的良心，事实确实。


    有一个有趣的轶闻：在访问雷西斯塔的其中一次，佩隆对听众说，他想澄清一点：“他们说德卡洛主教是佩隆主义者。这不是事实，佩隆是德卡里斯特派！”最初，有一些基督徒帮助佩隆解释他的社会道路。现在，与这一群体并存的是另一个更自由的派别，他们聚集了反佩隆主义思潮。这些人是加入激进公民联盟的，他们与保守党以及社会主义核心力量一起，在选举期间创建了民主联盟。起初，教会与佩隆政权联系在一起，甚至获得了宗教教育等利益；这是是坏是另一回事了。埃维塔去世后，疏远开始了。也许高层不知道如何好处理这种情况，冲突以''54年的对决结束。当我还是个男孩时，记得在日报上读过一篇文章：“丰宴桌上的绅士和主教们”。那是第一次攻击。从那时起，双方对抗持续进行，许多无辜的生命丧逝。军队内部的民族主义团体并不关心五月广场的平民，他们派出了飞机，飞机上写着令人置信的“基督得胜”字样。这让我感到恶心，让我非常愤怒；我感到愤慨，因为它为了纯粹的政治行为使用了宗教、政治和纯粹的民族主义混合在一起。无辜的人被冷杀。我不接受那是为了保卫国家的说法，因为你不能通过杀害人民来保护人民。说教会只支持或只反对佩隆是太简单。这种关系复杂得多，反复无常：起初有支持，后来一些领袖与他们勾结，最后出现了对抗。非常复杂，就像佩隆主义本身一样。我也想说明，通常在新闻中，当他们说“教会”时，指的是主教和神父，但教会是整个上帝之民。在那些日子，后来被称为“黑头”的人仍然是天主教徒和虔诚的佩隆主义者，尽管政府正试图烧死他们。


    # 27. 关于阿拉伯以冲突及其他冲突


    **SKORKA:** 当人们谈论阿拉伯以冲突时，他们通常是根据他们掌握的最新图像，而完全忽略了背后的历史。我认为，停止暴力升级至关重要。正如安瓦·萨达特访问以色列时所说：“我们将有很多讨论，但不会再有战争了？”武器需要沉默——我们必须找到一种和平共处的方法并为此努力。遗憾的是，有些利益集团从现状中获益，除了这些，我们还有国际市场，他们冷酷的计算将桶油的价值高于人类生命。此外，基础主义者也认为这有用，因为他们从冲突中生存并受冲突维持。伊朗需要这种冲突来通过真主党在叙利亚和黎巴嫩行使影响力，通过哈马斯在加沙行使影响力。他们梦想着重建“大帝国”，恢复什叶派的权力，并征服所有不同意亚图拉拉神权统治的人。以色列曾出现过一个巨大的运动。在希伯来语中，它被称为“现在和平”（Shalom
    Achshav）。遗憾的是，对方没有类似的组织。我从未见过有十万帕勒斯坦人聚在一起大喊“让我们实现和平吧！”当巴拉克与阿拉法特会面时——这是记录可查的——他授予了帕勒斯坦领袖要求的一切，包括耶路撒的一部分，这对于巴拉克来说风险极大，因为右翼以色列人和许多犹太人的感觉是耶路撒冷是永恒且不可分割的。阿拉伯人面向麦加祈祷，我们面向耶路撒冷祈祷。然而，以和平的名义，加沙地区处于凄惨的境地。

