    ## 6. ON THE DISCIPLES


    **BERGOGLIO:** A question that we should raise at this point is how we form and
    facilitate the growth of those that have decided to take up the religious path.
    Some believe that one, to be a priest, embraces the ecclesiastical career. Frankly,
    that expression is no-longer popular, because the word "career" gives the impression
    that there is a ladder, as if it were a business. Instead, everything is born
    from the fact that someone is called, summoned, touched by God. We base our formation
    on four pillars. The first is the spiritual life, where the aspirant enters into
    a dialogue with God, through the interior world. For that, the first year of formation
    is dedicated to understanding and putting into practice the life of prayer, the
    spiritual life. Afterwards, all of that continues, but with less intensity. The
    second pillar refers to community life; we do not even conceive of a solitary
    formation. It is essential to be “kneaded” and to grow in a community. Then a
    person will know how to guide it and how to direct it. To accomplish this, we
    have seminars. In any community, these competitions and jealousies will appear,
    and that helps to open the heart and learn to make room for others. Such things
    are revealed even in the seminarians'' soccer matches. Another pillar is the intellectual
    life; the seminarians are enrolled in the Theology Department, where there are
    six years of studies. Two are for philosophy, as a foundation for theology, and
    later there is dogmatic theology, developed by scholars: where God, the Trinity,
    Jesus, and the sacraments are explained. Furthermore, there are the biblical and
    moral theology courses. The fourth pillar is what we call apostolic life: the
    seminarians are assigned to a parish and go every weekend to help the pastor with
    ministerial issues. During the last year of formation, they live in a parish.
    We look at this final year of total dedication as an opportunity for both virtues
    and defects to emerge. In that moment things begin to emerge more clearly that
    need to be corrected as in their personality, their charisma. We say that those
    four pillars need to interact and influence one another.


    **SKORKA:** In Judaism, it is not easy to train someone to be a rabbi because
    the source texts that the students have to learn are in Hebrew or Aramaic, and
    the classes are in Hebrew. Moreover, as soon as the seminarians possess a considerable
    knowledge of the basics, they go to work as rabbis’ assistants due to a shortage
    of religious leaders. Of course, as part of our curriculum we also have subjects
    such as Philosophy, Bible, Talmud, History, and Biblical Criticism. Since the
    Seminario Rabín de Latinoamericano belongs to the Conservative movement, we deal
    with a very broad spectrum of knowledge and interpretation of the sources. We
    also study Hebrew literature from every era as well as other topics that have
    to do with pastoral work, such as Psychology, Sociology and Anthropology. Something
    that is very important to us is that everyone who comes to study at the seminary
    has graduated college or is working toward their degree.


    **BERGOGLIO:** It is not necessary to have a university degree to be a Catholic
    seminarian. The degree will be acquired in Theology or Philosophy, but in fact,
    it is increasingly common that there are university seminarians with a degree
    or with two or three years of work experience. We see that today, unlike before,
    older people are entering the seminary. The situation is much better because at
    the University of Buenos Aires you will get to know real life, the different points
    of view that exist, the different scientific approaches, a cosmopolitan perspective
    ... it is a way to have your feet on the ground.


    > 32 The Jewish Conservative current teaches that customs and laws given by the
    tradition must be kept; nevertheless, unlike the very Traditionalist current,
    it keeps a deep and very dynamic intellectual dialogue with scientific development.


    **SKORKA:** That is exactly why we demand it–so that the clerics have a sense
    of reality. It is ideal if their degree is in the humanities, but it is not a
    requirement. I myself have a doctorate in chemistry from the University of Buenos
    Aires. One can also know G-d through the perfection of His work. I saw myself
    becoming a researcher in any one of a variety of scientific fields, although I
    always liked Judaic studies. At some point, I threw myself into the teaching of
    Judaism. I had already officiated as a rabbi while studying for my doctorate.
    As Albert Einstein used to say, "I would love to have G-d’s blueprint for creating
    the universe." I do not believe there is a contradiction between science and religion.
    For me, the order that we have discovered in the world is a series of clues that
    G-d has given to man.


    **BERGOGLIO:** We accept in our seminary, approximately, only 40 percent of those
    that apply, so the vocation has to be discerned. For example, there is a psychological
    phenomenon: pathologies or neuroses that seek external securities. There are some
    that feel that by themselves they are not going to be successful in life and look
    for organizations that can protect them. One of those organizations is the clergy.
    In this respect, we keep our eyes open, we try to know those who demonstrate interest,
    we give them in-depth psychological tests before they enter the seminary. Later,
    in the year of community life before they enter, during weekend meetings, we can
    see and discern who has a vocation, and those who in reality are only seeking
    a refuge or were mistaken in their discernment of a vocation. Assuming all who
    enter have a vocation, there can also be infidelity to that call. In the case
    of Saul: he was called and he betrayed the Lord.³⁵ An example would be the case
    of worldliness. Throughout history, there have been both worldly priests and bishops.
    One might think that having a woman on the side is being worldly, but that is
    only one of the double lives that are usually mentioned. There are those that
    seek to compromise their faith for political alliances or for a worldly spirituality.
    One Catholic theologian, Henri de Lubac, says that the worst that can happen to
    those that are anointed and called to service is that they live with the criteria
    of the world instead of the criteria that the Lord commands from the tablets of
    the law and the Gospel. If this were to happen throughout the Church, the situation
    would be much worse than those embarrassing periods with libertine pastors. The
    worst that can happen in the priestly life is to be worldly, to be a “light” bishop
    or a “light” priest.


    **SKORKA:** The Jewish view also dictates that we should avoid being materialistic.
    A verse in the Talmud points out that the sages criticize those who seek to live
    life in the moment, for the here and now; those who belittle and ignore the afterlife
    and transcendence–the belief that everything we do now affects the future. Up
    to here we agree, but I would ask–and here we find one of the differences between
    the Jewish and Catholic views–how should we handle this? At some point, the Catholic
    Church decided to make the maximum demand–total devotion by renouncing marriage
    and family. It asks one to live in this world without getting involved with worldly
    things. Here Judaism differs. It says, “You have to accept the challenge of living
    in the world and struggling with all the difficulties that modern trends bring
    to your doorstep while continuing to hold on your values?” Nevertheless, within
    the Jewish community there are very observant people who enclose themselves in
    their ghettos and deal with the outside world only for their basic necessities.
    I on the other hand, belong to the Conservative movement–although traditionalist
    is a better name–that suggests that Jews keep one foot in this world and deal
    with its problems, while holding fast to the idea that it is wrong to be materialistic.
    It is difficult to do, and right now it is one of the biggest problems in Judaism.
    Today, we do not live in ghettos anymore; we have changed and become more cosmopolitan.
    The fight right now has become one of not getting caught up in what is trendy
    and sticking to the search for spirituality.


    ³⁵ Saul did not obey God’s precepts and commandments. See 1 Samuel 15:7–14; 15.

