    the world. When'
  - '[PAGE 251]


    the prophet Micah wanted to define what it meant to be a religious man, he said
    to “do justice and to love goodness, and to walk humbly with your G-d.”¹⁰⁸


    **BERGOGLIO:** I completely agree with the notion of humility. I also like to
    use the word meekness, which does not mean weakness. A religious leader can be
    very strong, very firm, but without exercising aggression. Jesus says that the
    one who rules must be like a servant. For me, that idea is valid for the religious
    person in any denomination. The true power of religious leadership comes from
    service. When the religious person stops serving, he begins to transform into
    a mere manager, into an NGO agent. The religious leader shares with, suffers with,
    and serves his brothers.


    **SKORKA:** Exactly. I do not know what religion will look like in the future,
    but I am convinced that it depends on what we do today as individuals. Benjamin
    once said, “I do not know if the book I am writing will have an impact today,
    but perhaps it will have an impact sometime in the next hundred years?


    **BERGOGLIO:** I know that for religions there were worse periods than the current
    one, and nevertheless, they resurfaced. Perhaps now we can point to a numeric
    shortage of religious, but there were times when there was a shortage of virtue.
    There were corrupt times in the Church. I think, for example, about the times
    when the birthright existed, in the scholastic


    ¹⁰⁸ Micah 6:8'
  - '[PAGE 252]


    benefits that some priests had, that secured their lives around instructing children
    from rich families. They did not do anything and they had become worldly. There
    were very difficult times, but religion bounced back. All of sudden figures like
    Mother Teresa of Calcutta appeared, and they stirred up the concept of the dignity
    of the human person, figures who wasted their time–because in some way the time
    was lost–in-helping people die. These actions generate mystique and rejuvenate
    religious fervor. In the history of the Catholic Church the true reformers are
    the saints. They are the true reformers, those that change, transform, carry forward
    and resurrect the spiritual path. In another case, Francis of Assisi contributed
    an entire concept about poverty to Christianity in the face of the wealth, pride
    and vanity of the civil and ecclesiastical powers of the time. He carried out
    a mysticism of poverty, of dispossession and he has changed history. In Judaism,
    how do these men appear?


    SKORKA: One example I would mention is some-one who was criticized widely throughout
    the Argentine Jewish community for many things, but undoubtedly marked a before
    and an after–Marshall Meyer. I cannot say that he was a saint because the concept
    of sainthood does not exist in Judaism; neither will I say that everything he
    did was perfect, nor do I agree absolutely with all of his points of view. But,
    if we take into account that the community began to flourish in the 1960s, it
    was thanks to him. Religion played


    231'
- md: '

    a very important role in Marshall’s character. No one can deny that there was
    a “before Marshall” and an “after Marshall,” not only because of what he represented
    in the struggle for human rights, but because he showed us a new way of dealing
    with our neighbors, and for his having shaken the spiritual foundation of the
    Argentine Jewish community. After he passed away and, more recently, say over
    the last twenty years, there has been another change. There has been return to
    more orthodox forms of the religion. Thirty or forty years ago the present scenario
    would have been unimaginable—a return to a stricter way of practicing that contains
    many aspects with which I do not agree. Zygmunt Bauman, the well-known European
    sociologist who coined the phrase “liquid modernity” describes precisely the times
    in which we are living. He spoke about the lack of certainty and commitment in
    the world. Orthodoxy fills the gaps that are created by these uncertainties. The
    truth is that things keep going from one extreme to another. Regarding the future
    of religion, I believe it is vital that we find the middle path. Certain truths
    are firmly established like “do not kill” and “do not steal.” On the other hand,
    change and freedom are part of life and one has to be able to think for oneself
    and distinguish from wrong because the paths our lives take are not set in stone.


    **BERGOGLIO:** There are sectors within every religion by highlighting the normative
    leave aside the human, they reduce religion to what that has to be prayed in the
    morning, during the afternoon and night and what is going to happen if one does
    not do it. There is a spiritual harassment of adherents and of many people weak
    in spirit, that can lead them to a lack of freedom. Another feature of these sectors
    is that they are always motivated by the search for power. Regarding Buenos Aires
    specifically, we can say that it is a pagan city, not in the deratory sense, but
    as a matter of fact. It has many gods it adores and, as a result of this paganization,
    it tends toward a phenomenon like the one that you mentioned. The authentic wants
    to be sought, when that means only the normative, fulfilling regulations, it falls
    into the other extreme, into a purism that is also not religious. It is true that
    the hedonistic, consumerist, and narcissistic cultures have infiltrated Catholicism.
    They infect us and in some way relativize the religious life, paganize it, and
    make it worldly. That is what causes the watering down of religion; it is what
    I most fear. I always maintain that Christianity is a small flock, like Jesus
    says in the Gospel. When the Christian community wants to make itself great and
    transform itself into a temporal power, it runs the risk of losing the religious
    essence. That is exactly what I fear. Perhaps today someone can say that there
    are fewer religious people, but there is a lot of restlessness, there is a serious
    religious search. There is also a search for God in popular movements of piety
    that are forms of living the religious experience in a popular manner. For example,
    the pilgrimage of the youth to Luján.¹ For many, the only time that they step
    into a church is when they make that procession: 60 percent go by themselves on
    that pilgrimage, they are not taken there by anyone from the parish. There is
    a spark of popular piety that summons them; it is a religious phenomenon that
    cannot be neglected. Maybe there are fewer people in the churches, but there is
    a purification of commitment. The religious search has not faded, it continues
    on strong, though somewhat disinterested outside the institutional structures.
    In my opinion, the biggest challenge that religious leaders have is in knowing
    how to guide that force. Evangelization is essential, but not proselytism; that
    today—thanks to God—is crossed out of the pastoral dictionary. Pope Benedict XVI
    has a very beautiful expression: “The Church is a proposal that is reached by
    attraction, not by proselytism.” It is about an attraction through testimony.


    **SKORKA:** Judaism has never proselytized, but today there is a trend that I
    would call internal proselytizing. It is not about getting someone who is not
    Jewish to convert to a religious Jewish lifestyle, but instead it is the Orthodox
    Jewish communities who are trying to bring their institutions to other Jews. But
    I want stop and go back to one of the things that you mentioned, Monsignor. Religious
    leaders ought to know how to handle each of those expressions of interest and
    how to guide those religious movements that appear spontaneously. It seems to
    me that that will be the function of religion in the future. I do not believe
    that a religious leader should have such a tight grip on his congregations, controlling
    them with an iron fist. That is only something G-d can do, who with a strong hand
    and an outstretched arm took the Children of Israel out of Egypt. Let us go back
    to the example of Marshall Meyer. When he was still with us, he was a very charismatic
    leader, but perhaps the Conservative Movement is now suffering due to the deep
    impact made by the centralization of our leadership. Maybe, due to the circumstances
    that marked his life, he had no no alternative but to carry the weight of all
    that he had built on his shoulders and push forward on his own. However, that
    also prevented his followers from developing their full potential. Today, Argentinean
    life is different. I do not like those leaders who are overly charismatic. To
    me, a religious leader is a teacher who should become immense whenever a serious
    and unequivocal response is required to confront injustice. If we are to speak
    of having religious feelings as being an intimate experience, a teacher should
    not just make broad pronouncements should have clear and concise words for each
    individual. I do not like egotism and selfishnessness, either in political leaders
    or religious ones. The use of mass instruction was an explicit part of recent
    religious movements that ended in huge massacres. That is why I think we have
    to be very careful when we are talking about new religious movements. When someone
    is bringing a new spiritual message, we have to treat it with the utmost respect,
    but at the same time it merits the attention of responsible organizations who
    should study what it is about. No movement''s spiritual requirements should lead
    to conflict with one’s family and it should not trap individuals inside any kind
    of web that is going to isolate them from their social or emotional network.


    **BERGOGLIO:** I am respectful of all new proposals, but they must be authentic
    and submit themselves to the passage of time, which will reveal if their message
    is temporary or will live on the generations. Surviving the passage of time is
    the major test of spiritual purity.


    ¹ Ed. Note: Luján, Our Lady of Luján, located in the small town of Lujan, approximately
    thirty miles west of Buenos Aires and is the most popular Marian Devotion in Argentina.
    The Archdiocese of Buenos Aires started a youth pilgrimage to this popular religious
    site in 1974. Each year, since then, more than 700,000 young people walk to the
    shrine in the month of October.

