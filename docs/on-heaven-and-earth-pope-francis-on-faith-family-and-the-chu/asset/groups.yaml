    # 6. ON THE DISCIPLES


    **BERGOGLIO:** A question that we should raise at this point is how we form and
    facilitate the growth of those that have decided to take up the religious path.
    Some believe that one, to be a priest, embraces the ecclesiastical career. Thankfully,
    that expression is no longer popular, because the word career_ gives the impression
    that there is a ladder, as if it were a business. Instead, everything is born
    from the fact that someone is called, summoned, touched by God. We base our formation
    on four pillars. The first is the spiritual life, where the aspirant enters into
    a dialogue with God, through the interior world. For that, the first year of formation
    is dedicated to understanding and putting into practice the life of prayer, the
    spiritual life. Afterwards, all of that continues, but with less intensity. The
    second pillar refers to community life; we do not even'
  - '[PAGE 63]


    conceive of a solitary formation. It is essential to be “kneaded” and to grow
    in a community. Then a person will know how to guide it and how to direct it.
    To accomplish this, we have seminars. In any community, these competitions and
    jealousies will appear, and that helps to open the heart and learn to make room
    for others. Such things are revealed even in the seminarians'' soccer matches.
    Another pillar is the intellectual life; the seminarians are enrolled in the Theology
    Departmentment, where there are six years of studies. Two are for philosophy,
    as a foundation for theology, and later there is dogmatic theology, developed
    by scholars-: where God, the Trinity, Jesus, and the sacraments are explained.
    Furthermore, there are the biblical and moral theology courses. The fourth pillar
    is what we call apostolic life: the seminarians are assigned to a parish and go
    every weekend to help the pastor with ministerial issues. During the last year
    of formation, they live in a parish. We look at this final year of total dedication
    as an opportunity for both virtues and defects to emerge. In that moment things
    begin to emerge more clearly that need to be corrected as in their personality,
    their charisma. We say that those four pillars need to interact and influence
    one another.


    SKORKA: In Judaism, it is not easy to train someone-to be a rabbi because the
    source texts that the students have to learn are in Hebrew or Aramaic, and the
    classes are in Hebrew. Moreover, as soon as the


    42'
  - '[PAGE 64]


    seminarians possess a considerable knowledge of the basics, they go to work as
    rabbis’ assistants due to a shortage of religious leaders. Of course, as part
    of our curriculum we also have subjects such as Philosophy, Bible, Talmud, History,
    and Biblical Criticism. Since the Seminario Rabín de Latinoamericano belongs to
    the Conservative52 movement, we deal with a very broad spectrum of knowledge and
    interpretation of the sources. We also study Hebrew literature from every era
    as well as other topics that have to do with pastoral work, such as Psychology,
    Sociology and Anthropology. Something that is very important to us is that everyone
    who comes to study at the seminary has graduated college or is working toward
    their degree.


    BERGOGLIO: It is not necessary to have a university degree to be a Catholic seminarian.
    The degree will be acquired in Theology or Philosophy, but in fact, it is increasingly
    common that there are university seminarians with a degree or with two or three
    years of work experience. We see that today, unlike before, older people are entering
    the seminary. The situation is much better because at the University of Buenos
    Aires you will get to know real life, the different points of view that exist,
    the different scientific approaches, a


    > 32 The Jewish Conservative current teaches that customs and laws given by the
    tradition must be kept; nevertheless, unlike the very Traditionalist current,
    it keeps a deep and very dynamic intellectual dialogue with scientific development.'
  - '[PAGE 65]


    cosmopolitan perspective ... it is a way to have your feet on the ground.


    **SKORKA:** That is exactly why we demand it–so that the clerics have a sense
    of reality. It is ideal if their degree is in the humanities, but it is not a
    requirement. I myself have a doctorate in chemistry from the University of Buenos
    Aires. One can also know G-d through the perfection of His work. I saw myself
    becoming a researcher in any one of a variety of scientific fields, although I
    always liked Judaic studies. At some point, I threw myself into the teaching of
    Judaism. I had already officiated as a rabbi while studying for my doctorate.
    As Albert Einstein used to say, I would love to have G-d’s blueprint for creating
    the universe. I do not believe there is a contradiction between science and religion.
    For me, the order that we have discovered in the world is a series of clues that
    G-d has given to man.


    **BERGOGLIO:** We accept in our seminary, approximately, only 40 percent of those
    that apply, so the vocation has to be discerned. For example, there is a psychological
    phenomenon: pathologies or neuroses that seek external securities. There are some
    that feel that by themselves they are not going to be successful in life and look
    for organizations that can protect them. One of those organizations is the clergy.
