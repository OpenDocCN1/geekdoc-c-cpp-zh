    ## 21. ON GLOBALIZATION


    **BERGOGLIO:** If we think of globalization as a uniform billiard ball, the richness
    of each culture is lost. The true globalization, that which we must defend, is
    like a polyhedron in which everyone is integrated but each maintains his particularities,
    which, at the same time, enrich the others.


    **SKORKA:** When I think of globalization, at first I tend to take a naïve view
    of things. For example, I think it is good that we can go to any airport in any
    country and not get lost since they use the same symbols. In that sense, I think
    globalization is fantastic. But what I have a hard time understanding is how,
    all of a sudden, groups from the United States can become all the rage in Budapest.
    Due to these circumstances, movements have arisen that stress personal identity,
    which has also had an effect on Judaism, Christianity and Islam. I do not think
    international deal-making between corporations is bad as long as there are rules
    and restrictions in place to ensure that society at large is excluded from its
    benefits. Global interaction is good, but only if there are certain standards
