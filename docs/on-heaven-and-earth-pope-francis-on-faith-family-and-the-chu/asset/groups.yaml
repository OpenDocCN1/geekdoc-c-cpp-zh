    because he confronted the Nazis. I do not know how he saved his own life; he was
    a very courageous bishop who from the beginning denounced how Nazism operated.
    Pius XI perfect German and in that language wrote an encyclical, if one reviews
    it today, has not lost its topicality. It is the one that starts, “It is with
    deep anxiety ...” Initially might have been bishops who were a little bit more
    naïve, who did not believe the situation was so grave. The same thing happened
    in our country, some went to complain immediately, others took longer, it was
    not so clear. When the Vatican realized it, they started to give passports to
    the Jews. When Pius XII died, Golda Meir sent a letter acknowledging he had saved
    many Jews. The Nunciature in Italy operates from a house in Rome, with a park
    that is a donation from a wealthy Jew in gratitude for the action of the Church
    on his behalf. Some survivors went later to thank the Pope. The Vatican has houses
    that are extra-territorial, in Italy, in which they hid many Jews. I am speaking
    about the positive side. On the other hand, I heard that the Church did not say
    all that it should have said. Some believe that, if it were to have done so, the
    reaction would have been much worse and it would have been unable to save anyone.
