    # 27. ON THE ARAB-ISRAELI CONFLICT AND OTHER CONFLICTS


    **SKORKA:** When people talk about the Arab-Israeli conflict, they generally do
    so based on the latest images they have seen, while completely ignoring the history
    behind them. I believe it is essential that the escalation of violence be put
    to a stop immediately. As Anwar Sadat¹² said when he visited Israel: “We will
    have plenty of discussions, but there will not be any more wars?” Weapons need
    to be silenced–we have to find a way to live together in peace and keep working
    at it. Unfortunately though, there are interests that benefit from the current
    situation, even as Israelis cry for their victims and so very many Palestinian
    people live in the Gaza


