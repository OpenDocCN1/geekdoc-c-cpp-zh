    # 17. 科学


    SKORK：在启蒙运动之前，宗教在广义上一直一直是文化的传播者。一个人对任何研究领域的任何知识都以某种方式与宗教联系在一起。这就是为什么我们发现有许多犹太拉比和天主教僧侣致力于各种科学研究。迈蒙罗尼德、哥白尼和孟德尔都是这一古老传统的晚期一些范例。顺带提一句，抄写员通常也是僧侣。《塔木德》中充满了与社会学、人类学和医学相关的思想。宗教是文化和语言清晰性的传递渠道。它为我之前提到的关于生命的根本问题提供了答案：人是什么？自然是什么？上帝是什么？直到今天，每当重要问题出现时，我们仍然会转向宗教——而这些问题极其重要。例如，为了进行器官移植，我们必须重新定义死亡。几个世纪以来，死亡被定义为心肺活动的停止。当拉比们被问及是否可以通过进行心脏移植（包括切除一个仍在跳动的器官）来救命时，他们发现《塔木德》中已经存在“脑死亡”的概念。人们可以说：“看看他们是多么有远见的人！”


    今天，我们对于人类生命的开始时刻存在争论。我们应该将处于发育初始阶段的受精卵视为人类吗？根据《塔木德》中一位圣者的标准，它已经获得了一个灵魂——神圣的呼吸。科学已经确定，合胎已经拥有发育成新人类所需的所有遗传信息；但这足以作为得出它应该被视为一个人类的论据吗？


    当科学达到其局限性时，人类会转向过去几个世纪的精神性经验。科学和宗教是两个并行的领域，它们应该相互交流。试图根据自己的研究来反驳宗教现象的科学家，与试图根据信仰来反驳科学的宗教人士是一样的——他们都是愚蠢的。只有通过从承认自身局限性开始的对话，两者之间才能展开辩论，而这对于人类在寻求基础伦理准则方面不断进步是绝对必要的。


    **BERGOGLIO：** 确实如此。一方面，正如拉比所说的，你提到了所有关于教育的内容，通过反思、通过托拉、通过福音所积累的所有古代智慧，并将其提供给全人类。还有另一有趣的事情：宗教真理不会改变，但它确实在发展和成长。这就像人类一样，我们在婴儿时期和老年时期是相同的，但在中间有一段漫长的旅程。这样，正如之前解释的那样，曾经被视为自然的东西，现在看起来就不是那样了。一个例子是死刑：它曾是基督教接受的惩罚之一，但今天道德良知已变得精炼，《教理问》说最好不要发生。


    人类的良知在道德命令方面变得精炼，在对它的理解上也在增长。奴隶制也是同样的情况：现在没有人会想到把一群人送上船并将他们送到海洋的彼岸。确实，今天还存在其他类型的奴隶制，例如来自多米尼共和国的人被带到这里遭受性交易，或者来到这里工作的无证件的玻利维亚人，他们被迫在不人道的条件下工作。


    SKORKA：很多当宗教机构犯错时，它们会承认，但有时它们会保持沉默或不愿谈论。直到今天，教会仍在伽利略的审判感到忏悔。正如一个宗教人士将其对圣经文本的特殊观点转化为绝对的科学真理会犯下愚蠢之罪一样，相信自己的知识是神圣且不可置疑的科学家则犯了智力盲目的罪。科学在不断更新，其持续的挑战是发现一个比现有理论更好或更全面的理论。正如您所说的，主教阁，我们对精神世界的认知已经有了发展，尽管精神本身是不变的。毫无疑问，这种发展过程应该包含宗教与科学之间的对话。并不是说一个需要为另一个留出空间。然而，当科学无法提供答案时，基于直觉的答案就会运而生，对我来说，这些答案出现时就会转化为“精神性”答案，因为它们源于一种不同于归纳或演绎推理的精神过程。


    另一件必须强调的——我们不能忘记这一点——是科学有其局限性。科学并不寻求发现事物存在的原因——它只寻找“如何”。一切的终极意义是我们不知道的。科学在上帝的命令中本质上是工具性的，当他说：“要生殖，要怎样；充满地，服它。”⁵⁹
    在其自主性范围内，科学将未教化的转化为文化，但要小心；当科学的自主性不对自己施加限制并向前发展时，它可能会失去对其自身创造物的控制，就像《弗兰肯斯坦》的故事中一样。它让我想起小时候在《El
    Tony》⁶⁰ 中读过的一个故事，名字叫《变异者》。由于过度狂热的科学，人们开始把自己变成东西。这些滥用行为的一个明显例子是对原子力的掌握，这可能导致人类的毁灭。当人变得傲慢时，他创造了一个失控的怪物。


    SKORKA：这就是歌莱姆故事的寓意。在布拉格，一位拉比创造了一个人偶，一个可以反击反犹太攻击的机器人。他在额头上刻上“emet”（真理），在它嘴里放入了四圣名，并命令歌莱姆为其服务。一个版本说在一个周五⁶¹安息日到来之前，傀儡能够脱困并开始破坏一切。拉比去掉了额头上单词的第一个字母，这就变成了“met”（死亡），他从它嘴里取出纸片，这时它变回了拉比制作它的粘土。当人类无法控制自己创造的事物时，这是一个原型。


    ⁵ 创世记 1:28

    ⁶⁰ 注释：*El Tony* 是阿根廷最流行的月刊漫画。

    ⁶¹ 犹太教中的神圣休息日。


