    犹太人逃离现场，试图拯救神圣的《托拉法》卷；惊恐的妇女儿童在逃跑。我一直说，在死亡营里，他们不仅杀杀了六百万犹太人，而且杀杀了耶稣六百万次。这是因为耶稣的许多思想和他的信息都是犹太的，因为他传递了先知者的信息。


    **BERGOGLIO：** 这是一个非常基督教的信仰：耶稣每一个受苦的人身上。我们在受苦中完成了基督受难中所缺失的部分。


    **SKORKA：** 这也存在于塔穆德的思想中。当我们研究《圣会德林》（Sanhedrin）文献中的死刑时，书中提到即使罪犯被处以死刑，上帝也与他一同受苦。80
    即使在执行刑时刻，上帝也和他在一起。我完全同意你的观点。


    **BERGOGLIO：** 在我刚才提到的那书中，我发现了一些可怕的事情。他们拔掉犹太人的牙，剪掉他们的头发，甚至极端到选择其他犹太人来承担这些任务。他们诱使这些人背教；这是将责任转嫁给他们的一种手段。一个撒旦式的细节：这不再是纳粹的错，而是犹太人自己的错。这一切背后的诡诈和仇恨令人震惊。


    **SKORKA：** 主教下，您认为教会当时的行为如何？


    ^89 《米什纳·圣会德林》6:5


    **BERGOGLIO：** 几年前，克莱门斯·奥古斯特·冯·加伦枢机被宣告，是因为他对抗了纳粹。我不知道他是如何救自己自己的；他是一位非常勇敢的主教，从一开始就谴责纳粹主义的运作方式。庇
    Pius十一世用完美的德语用那种语言撰写了一封通谕，如果今天回顾它，它并没有失去时代意义。那是篇以“带着深切忧虑……”开头的文章。最初可能是一些主教比较天真，没有意识到情况如此严重。在我们国家也发生了同样的事情，有些人立即去投诉，有些人花了更长时间，情况并不明确。当梵蒂意识到这一点时，他们开始给犹太人发放护照。当庇
    Pius十二世去世时，戈尔达·梅尔写了一封信，承认他救了许多犹太人。意大利的教廷代表位于罗马的一栋房子里，那里有一个公园是由富有的犹太人捐赠的，以感谢教会代表他采取的行动。一些幸存者后来去感谢教皇。梵蒂冈在意大利拥有领事馆建筑，在里面隐藏了许多犹太人。我是在说积极的一面。另一方面，我听到教会没有说出本该说的话。有些人认为，如果他们那样做了，反应会糟糕得多，而且将无法救助任何人。为了保护一些犹太人——他们说——声明变得更加谨慎。谁知道我们本是否可以多做些什么。最近，一些严肃的历史学家（其中还有一位耶稣会士）发表了详尽的研究，证明了教会行动的正当性。


    **SKORKA：** 主主教，问题就在于。可以做得更多吗？关于来自明斯德的德国主教冯·加伦，我有一个有趣的轶事可以分享。弗里茨·斯坦塔尔是我创立的会堂的拉比，他是一个德国人，在“水晶之夜”中幸存了下来，那是发生在
    1938 年 11 月 9 日至 10 日凌晨，当时纳粹摧毁了该国大部分的犹太会堂和企业。在回忆录中，这位拉比对冯·加伦以及在危及自己生命的情况下拯救犹太人的基督教神父表示感谢。现在，关于庇
    Pius十二世在犹太大屠杀（Shoah）期间的行为，很难形成结论性的意见，因为人们既有支持他的文章，也有反对他的文章。正如你提到的戈尔达·梅尔的信件一样，也有书籍声称他没有像他可以做的那样发声。世界犹太人大会要求梵蒂冈开放档案。我认为，如果我们彻彻调查发生过的每一个微小细节，并反复审查一切，直到发现错误是在哪里犯下的，这对所有相关人员都是有好处。这是确保此类事件不再发生的唯一途径。我相信，在确实需要的时候，自省是前进的唯一途径。我对于支持庇
    Pius十二世被封福的神学原因并不十分了解，我不怀疑他曾是一位非常重要的领导者。我问自己，他是否为教会付出了他能付出的最大风险。生命中某些时刻你必须采取特定行动，因为如果不这样做，你什么时候去做呢？这些是困扰着我的问题。


    **BERGOGLIO：** 我听多次提到过约翰十三颁发过出生证明，但我没有亲自证实过。


    **SKORKA：** 实际上，劳尔·瓦伦堡基金会（Raoul Wallenberg Foundation）拥有证明其真实的全部文件。该组织的使命之一是让公众意识到那些为了犹太人冒生命危险大使和其他重要人物的英雄行为。也许，为了更好地了解发生过，我们必须查看每位教皇的背景以及他们受过的教育。庇
    Pius十二世在梵蒂冈周边受教育，他的家族与圣座有联系。他属于一个群体，认为任何事情都可以通过外交实现，如果无法通过外交找到解决方案，就没有解决方案。伦兰尼（Roncalli），即约翰十三，出身于贫困家庭和小村庄，那里的人被教通过快速、务实的解决方案来互相照顾是多么重要——这与外交完全相反。这也许就是两位教皇之间产生差异的原因。

