    that God gives it to them, and that one cannot exempt oneself from progressing
    by using paradise as an excuse. One has to fight for progress in every area: moral,
    scientific, educational and labor. We need to fight to keep being drugged with
    opium.


    **SKORKA:** Like the book of Psalms says, “The highest heavens belong to the Lord,
    but the Earth he has given to mankind.”⁷² We have to try to live balanced lives.
    When we lose balance, we are lost.


    **BERGOGLIO:** We inherited from Judaism the same concept. The Jewish people did
    not wait weekly for their liberation from Egypt. They allowed themselves to be
    led by the Lord with shrewdness and warfare. The Jews took possession of all of
    Transjordan by war, and when the Hellenists wanted to repress them, the Maccabees
    launched a guerilla war. They achieved their liberation doing what they had to
    do, and at the same time, they prayed. On one occasion, when they had everything
    prepared, they were afraid of the inferiority of their troops, and the prophet
    said to them: “Do not fear . . for the battle is not yours but God’s.” There were
    very few occasions when they were supposed to fight, and God exempted them. But
    the common thing is for Him to say: “I am with you, but you must fight.” That
    was how Moses was, with both his hands up, interceding while the people were fighting.


    **SKA:** There is a teaching in the Talmud⁷⁴ that says that one hour of holding
    back and repenting, returning to G-d and doing good deeds in this world, is better
    than an entire life in the world. To sum up, they are both important. The same
    tractate of the Talmud⁷⁵ says, “The reward that the righteous receive for their
    labor will be given in future life.” It reminds me of, “Blessed are the poor in
