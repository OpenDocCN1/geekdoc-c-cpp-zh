    ……并爱良善，与你的神谦卑行事。”⁹


    毫无疑问，经历上帝是动态的，用一个我们在共同学习基础科学时学到的词来说¹⁰。然而，当我们发现如今关于上帝的观念是如此扭曲、亵渎且重要性被降低时，你认为我们能对人们说些什么呢？


    **贝尔戈利奥：** 每个人必须被告诉的一件事是向内审视。分心是一种内在的裂痕。它永远不会让一个人遇见自我，因为阻碍了他审视内心的镜子。收集自我是开始。对话也在那里开始。有时，人们认为自己拥有唯一的答案，但事实并非如此。我会告诉今天的人们，去寻求进入自己内心亲密世界的体验。去认识那种体验，认识上帝的面容。这就是为什么我喜欢约伯在经历了那艰难的遭遇以及那些对他毫无帮助的对话后说的话：“我从从听闻得过你，如今我亲眼看见了你。”¹¹
    我告诉人们的，不要仅仅通过听闻来认识上帝。活着的上帝是你可以通过内心的眼睛看见祂的。


    **斯尔卡：** 《约伯记》教给了我们伟大的教训，因为简而言之——它告诉我们永远无法知道上帝在特定情况下是如何启示自己的。约伯是一个公义、正直的人，他想知道为什么失去了一切，甚至失去了健康。他的朋友告诉他，上帝是因为他的罪孽而惩罚了他。他回答说，即使他得罪了，也没有那么糟糕。只有当上帝出现在他面前时，约伯才得到安慰。他的问题没有得到回答，但上帝临在的感觉却与他同存。我们可以从这个故事中发现几点塑造了我对上帝的个人认知。首先，约伯的朋友们通过支持“你得罪了，所以上帝惩罚了你”的理论，表现得既傲慢又荒谬，将上帝变成了某种计算奖赏或惩罚的计算机。在故事结束，上帝告诉约伯——这个曾对他造物主的不公行为大声控诉的人——应该为他的朋友代求并祈祷，因为他们关于祂说了谎话¹²
    那些在苦难中呼喊、要求上天正义的人，在上帝眼中是喜悦的。那些坚持对上帝本质持有简单观点的人被祂察觉了。据我理解，上帝是以微妙的方式向我们启示自己。我们现在的苦难可能是未来他人的答案。或者，我们本身就是过去某些事的回应。在犹教中，通过遵守祂启示的诫律来尊上帝。


    **贝尔戈利奥：** 正是。我们将受造物作为礼物接收。上帝赐给我们，但同时也给了我们一项任务：我们要征服地球。这是非文化的第一形式：人类接收到的、应当被征服以创造文化的原材料，就像被变成桌子的木头。但在这项任务中，人做得过头了；他变得过度热，失去了对自然的尊重。于是生态问题随之而生，比如全球变暖，这些是非文化的新形式。人在上帝面前和自己面前的工作必须在礼物与任务之间保持恒的平衡。当人只留下礼物而不工作时，他没有完成使命，保持着原始状态；当人对工作过度热时，他忘记了礼物，创造了一种构造主义伦理：他认为一切都是他劳动的果实，不存在礼物。这就是我所说的巴别综合症。


    **斯尔卡：** 在拉比文献中，有一个关于为什么上帝不喜欢巴别塔的问题。为什么祂通过让人说不同的语言来停止建设？在阅读文本时，最简单的解释是，试图建造一座通天高塔是异教宗教的一部分。这一行为是对上帝的傲慢的表现。米德拉希¹³
    指出，真正让上帝困扰的是，建造者更担心失去一块砖头，而不是担心失去一个可能从那么高的高度掉下来的人。同样的事情现在也在发生——礼物与工作之间存在着紧张关系。需要一种完美的平衡，因为人需要进步才能变得更有人性。尽管上帝是播种并创造一切的人，但人是物质世界的焦点，也是最伟的神圣杰作。我们今天的生活方式，唯一重要的是我们经济系统的成功，而最不重要的是人类的福祉。


    **贝尔戈利奥：** 你说得非常精彩。巴别综合症不仅是一种构造主义的姿态，还表现出语言混乱的表象。这在某些情况下非常典型：使命被夸大了，忽视了礼物，因为在这种情况下，纯粹的构造主义伴随着对话的缺失，同时也意味着侵略、虚假信息和恼怒…………
    当我们阅读马伊蒙尼德¹⁴ 和阿奎那的圣托马斯时，这两个几乎同时代的哲学家，我们看到他们总是通过将自己置于对手的立场来理解对方；他们从对方的角度进行对话。


    **斯尔卡：** 根据塔尔木德的解释，尼姆罗德是一个巴比伦独裁者，对一切都紧密控制，这就是为什么人们只说一种语言——他的语言。这个暴君命令建造一座通天高塔以留下自己的印记，并因此如此傲慢地假设自己在物理上更接近上帝。建造的目的并不是为了造福人类。人的完善在上帝眼中并不……


    ---

    9 弥西雅书6:8

    10 斯尔卡是化学家，贝尔戈利奥是化学专家。

