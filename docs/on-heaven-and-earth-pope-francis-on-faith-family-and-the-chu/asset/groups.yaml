    # 26. ON SOME HISTORICAL FACTS: THE CONQUEST, SOCIALISM, AND PERONISM


    **BERGOGLIO:** When we speak about the participation of the Church in the Spanish
    Conquest, we have to realize that the American continent was not a harmonic unity
    of native peoples, but rather the strongest empire ruled over the weakest, and
    they already lived in a state of war. This was a reality, there were peoples subjugated
    by the strongest, by the most advanced, for example, by the Incas. The historic
    interpretation has to be understood from the hermeneutic of that time; as long
    as we use extrapolated hermeneutics, we distort history and become unable to understand
    it. If we do not study cultural contexts, we make outdated reinterpretations that
    are out of place; just like what happens when we talk about the Crusades. Nowadays
    we do not understand the reasoning behind the Crusades,'
- md: '

    but there was a time when each side killed each other; the Turks were kicked out
    of the Holy Land of Jerusalem... When Catholics sacked and destroyed Constantinople,
    what theological explanation can you give? It is a major sin, but culturally,
    in that period, they did things like that. That indicates the brutality that we
    sometimes have inside. At that time, there was a concept of bringing the faith,
    that was linked to the sin of the conqueror: the faith was imposed even by cutting
    off heads. We cannot analyze history from an ethical purist point of view. History
    has always been like that, regrettably, with or without faith. This has to humble
    us. In that period, faith and sword went hand in hand. A historical analysis always
    has to be performed with its own hermeneutics from the period, not to justify
    the events, but rather to understand them. It is essential to analyze history
    in the cultural context of the moment in which the events occurred. Thinking according
    to how we live today, for example, Abraham’s sacrifice of his son, Isaac, would
    be incomprehensible. We have to study history according to the conceptions and
    practices of that period. Another important issue is to analyze historical processes
    in their entirety and not remain with a fragmented interpretation, because that
    fragment then becomes universalized, and takes the place of the entirety and it
    becomes a legend. Just as it has been pointed out how bad the Spanish were—evidently
    they came to conduct business in these lands, and to take away the gold—during
    the period of the Conquest there were men who were dedicated to preaching, to
    helping, like friar Bartolomé de las Casas, defender of the natives abused by
    the conquerors. Almost all of them were meek men and they became close to the
    natives and treated them with dignity. They had to have come into contact with
    different customs, like polygamy, human sacrifice, and alcoholism. In the missions,
    the Jesuits invented mate to help the natives pass from their addictions–to alcohol,
    to chicha99–over to something that was not harmful but would also give them some
    energy. There was a great advocacy effort that many men in the Church supported
    that did not want to entangle itself with the exploitative civil authorities.
    Roque González, for example, was a Jesuit saint; he fought with his brother, who
    was something like the governor of the city of Asunción, because he disagreed
    with the enslavement of the natives. The Church defended the natives; the Jesuit
    missionaries are an example of human advocacy.


    SKORKA: Regarding the era of the Spanish Conquest, there was no Jewish participation
    to speak of. The only thing that one could point to is the arrival of the crypto-Jews
    to the Rio de la Plata. We should not forget that it has been documented that
    in 1810 a petition arrived from the Inquisition Tribunal of Lima asking for the
    extradition of someone who was accused of being a crypto-Jew.


    99 Ed. Note: Chicha is a native alcoholic drink made out of fermented corn.


    All of this was researched by Boleslao Levin. However, there really was not any
    Jewish influence on a socio-political level until a large number of Jewish immigrants
    began to arrive in 1880 when the agricultural colonies in the interior of the
    country–Moisesville and Mauricio, among many others–were formed with the help
    of Baron Hirsch, which helped to fulfill the dream of Juan Bautista Alberdi, who
    wrote in his book, *Las Bases*, that one of the keys to Argentina’s growth would
    consist of attracting European immigration. Jewish participation in Argentine
    culture and in literature as represented by Alberto Gerchunoff, Bernardo Verbitsky
    and Cesar Tiempo as well as important doctors. Political participation did not
    begin until the second wave of immigration in the 1910s and ''20s, when people
    came from Turkey and Eastern Europe who brought their socialist ideas with them.
    That is why we see a Jewish presence in politics, particularly in the workers''
    movements, in the Socialist Party–such as the well-known Dickman brothers–and
    in the Communist Party. There were also anarchists like the famous Simon Radowitzky,
    who assassinated Chief of Police Ramon Falcon. Later on, the Jewish community
    became deeply involved in the fight against Nazism. Here I am talking about Jewish
    culture, because as you know, Judaism is a global outlook, a group of values,
    but not all of its adherents necessarily comply strictly with the rules of the
    religion. Back then, the engine of Jewish culture was based on the ideals that
    the immigrants brought over from Europe where they were organized into political
    groups, which they then brought over. Also at that time-we are talking about the
    ''20s and ''30s–there was a very important stream of Zionism that longed to bring
    its socialist ideology to the land of the Patriarchs. On the other hand there
    was another group, the Bundists, who were also socialists but thought that the
    Jewish community should participate in global affairs. In either case, explains
    why the Jewish community participated in Argentine politics with a socialist ideology.
    With regards to the Jewish view of Perón, speaking of something that deserves
    and continues to deserve a lot of scrutiny, what we can say for certain is that
    he let Nazi scientists and assassins continue with the country, while on the other
    hand he recognized the State of Israel at the beginning of 1949 and had a good
    relationship with the Jewish community. There was a rabbi–Amram Blum, who officiated
    at the Gran Templo on Calle Paso–who had close ties to Perón. For its part, the
    DAIA wanted to maintain its distance from the government. It was the only time
    that the community was divided in two as exemplified by the formation of the Organizacion
    Israelita Argentina, which aligned itself with Peronism. years, the 1930s and
    ''40s, were not easy times for the Jews. There were groups in the Church that
    came out against our community and made some very harsh pronouncements. There
    were very nationalistic and anti-Semitic groups–it was nothing at all like it
    is today.


    **BERGOGLIO:** It was a period of peak nationalism that was somehow unjustly fused
    with Catholicism. Even today there are magazines that publish the nationalists
    and in them they accuse me of having fallen into heresy because I dialogue with
    other sectors, but I want to highlight the social dimension that the European
    Jews brought with an anecdote: One day an elderly man came up to me. He presented
    himself and told me that he had come to on behalf of the retirees. It was Don
    Julio Liberman, the former director of the Guild of Tailors during the Perón period.
    He was a Communist, an Argentine, and a son of Polish parents. As a child he had
    returned to Poland, but he came back here to enlist and stayed. We started to
    talk and I found him very friendly and–over all–with a great attitude; every now
    and then we would chat. One time he told me me that he was going to be honest
    with me, he was not a believer. He belonged to that group of socialist Jews that
    you mentioned. He was ninety-two years old. He was a tough Jew, of the kind that
    when he left his union, because of his age, he continued to fight on behalf of
    the retirees. The social struggle that brought over those Jews was a lot of good,
    it stirred the social conscience of Argentina. I suspect that the majority were
    not believers, like Julio told me.


    SKORKA: No, he was not a believer. However, if we are honest and think about it,
    we know it is extremely difficult to arrive at an exact definition and dividing
    point as to faith ends and ideology begins. Some might say that all those Jews
    were socialists because they came from humble homes; they felt in their bones
    the pain of poverty and social injustice. But there were others who also lived
    under those same conditions and nevertheless did not up becoming socialist ideologues.
    At the same time, I wonder about those people who struggled with G-d and what
    weight the socialist ideas of the Bible had on them, given such forceful declarations
    by the prophets, especially Amos, Jeremiah and Isaiah, who relayed very clear
    messages in G-d''s name, calling on the conscience of the people to ensure social
    justice. This then gives rise to another doubt. Perhaps they were not fighting
    with G-d; maybe they were fighting against the religious structures.


    BERGOGLIO: That''s how it was, in the case of socialists from Catholic tradition
    who strayed away from religion and fought for the social cause; they generally
    had conflicts with the religious structure, with ways of living religiously where
    some believers-instead of being a bridge-become a wall. They become an impediment
    to their own faith because they use it for their own advantage, for their own
    ideology or merely to accommodate themselves. We can mention, as a defect, some
    worldly arrangements made by certain sectors.

