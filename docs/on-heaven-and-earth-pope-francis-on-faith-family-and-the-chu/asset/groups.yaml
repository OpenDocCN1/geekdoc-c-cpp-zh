    ## 10. ON DEATH


    **BERGOGLIO**: God always gives life. He gives it to you here and will give it
    to you in the next life. He is the God of life, not of death. In our theological
    reading there is the episode of sin. Evil entered the world through the cunning
    of the Devil that–as we have said–became jealous because God made man the perfect
    being. It is because of this that the Devil entered into the world. In our faith,
    death is a consequence of human freedom. We, by our sins, those who opted for
    death, which entered into the world because we made room for disobedience to God’s
    plan. Sin entered as pride before God’s plan, and with it, death.


    **SKORK**: In Judaism, there is a whole range of explanations for death. We do
    not have the concept of original sin; instead, we interpret the situation in the
    following way. There were two trees in the midst of Eden, one was the Tree of
    Knowledge of Evil and the other was the Tree of Life. Basically, they were regular
    trees. The Tree of Knowledge of Evil was not, as is often said, an apple tree;
    it was more likely a fig tree, and Adam and Eve wound up making clothing for themselves
    with its leaves⁴⁵ The same tree that prompted the transgression against the divine
    commandments also served to cover them⁴⁴ These were simple trees; they were reminders
    of what should not be done and man does not control everything. But man has a
    myriad of possible interpretations regarding sin–it is not an issue of dogma.
    Something was lost, but it is not all clear exactly what. Some part of man’s spirituality
    died, but death had already been established as part of nature. I believe that
    at the time G-d created man, He determined that people would have finite lives.
    Perhaps there is something positive about death. Everything that G-d made, He
    made for the good of the world. Death is not an easy topic. Paradoxically, it
    is life’s greatest mystery and we define what we do with our journey here on Earth
    based on how we resolve it. If we believe that absolutely everything comes to
    an end with death—that as the verse says, we return to dust⁴⁵—we are not going
    to struggle in search of transcendence; instead we will focus on the here and
    now by living a hedonistic, self-centered and egotistical lifestyle. Man, however,
    is actually similar to a tree. He must complete a cycle-giving of his fruit and
    afterwards letting new cycles emerge from the seeds that he plants himself. What
    life proves to us is that there is some kind of transcendence here in this world.
    The biblical text makes indications; it does not say precisely what happens to
    someone when they die. However, it does emphasize transcendence–what we do today
    will have an effect on our children. Throughout religious literature there are
    stories about curses that pass from parents to children and from one family to
    another. There is the example of Eli, the High Priest who took in and then taught
    Samuel. Since Eli’s own sons did not behave properly and he did not reprimand
    them, a curse was placed on his family that was passed on to succeeding generations.
    Jeremiah was the last one that we know of got stuck with this curse. The prophet
    did not marry, did not have children and did not build a home, as he said himself,
    he was a man of contention and strife;⁴⁶ the one who prophesied about the destruction
    of Jerusalem.


    ⁴³ Genesis 3:7

    ⁴⁴ Based on Berajot 40, a

    ⁴⁵ Genesis 3:19

    ⁴⁶ Jeremiah 15:10

