  mdcn: '

    反对像过去那样在公立学校进行宗教教育。


    **BERGOGLIO：** 我也不同意那些涉及对非天主教徒歧视的宗教课程，但是是的，我相信宗教必须成为学校教育的一部分，作为教室里提供的宽广范围中的一个元素。在我看来，如果不对宗教进行谈论，如果不能像教授其他科目那样教导关于生活和历史事件的宗教观点，这是具有歧视性的。


    **SKORKA：** 我同意你的观点——当我们剥夺了教孩子宗教的机会时，我们实际上剥夺了孩子很多东西。尽管如此，更详细的宗教教育仍需由他们的教区或堂会提供。犹太教的基础（后来也成为基督教和伊斯兰教的一部分）是推崇人作为一种能够克服自然本能而表现得更好的生物。宗教为教育增加的重要意义，是重新确认人类崇高地位的价值，以及每个人如何应对这种状态。国家的公立学校应该提供某种形式的宗教教育，因为它们的首要功能是传递价值观。一旦引入上帝的概念，人类中心主义就会被向旁边推一点。如果他们听不到关于上帝的话，孩子们就会产生一种现实是以人、以自身为中心的观念。一旦引入了宗教变量，人们就可以从不同的角度处理任何其他话题。什么是性教育？它仅仅是为了回答关于解剖和生理学的问题，还是关乎基本的价值观？当然，孩子们需要了解他们在解剖和生理上正在发生的情况，但这必须伴随着特定的价值观，以便他们更好地决定如何处理自己的性关系。性本应该是人类表现出源于坠入爱强烈情感的方式。在孩子获得这些信息时，我希望学校能说：“犹太教认为……”，随后同样介绍基督教或伊斯兰教的世界观，并强调它们之间的共同点。如果我们放弃了教育的责任，我们就会失去目标。唯一的焦点将变成我们现在如何生活，在此时、此地。在我们的宗教中，“**超越性**”的概念是至关重要的——它意味着我们现在所做的事情不仅仅结束于行为本身——它们对未来有影响。向我们今天所生活的物质主义世界传达这一点是具有根本性的。


    **BERGOGLIO：** 在《圣经》中，上帝本身作为教育者：他说：“我把你扛在我的肩上，我教你走路。”信徒的义务是培养后代。每个男人和每个女人都有权按照宗教价值观来教育他们的孩子。国家剥夺这一权利可能会导致像纳粹主义那样的案例，在那里孩子们被灌输了与其父母不同的价值观。全权主义者倾向于为自己的磨坊加水。


    **SKORKA：** 我们始终在向孩子们传递某种信息，无论是通过我们所说的或所做的，还是通过我们没说的或没做的。信息无处不在不在。我们为什么要把这项任务交给别人呢？宗教是给寻找生命意义的人的指导。这与哲学家发现一个他想要教导并与他人分享的真理是一样的。他必须与他人分享这个信息——想听的人会听，不想听的人不会听，但信息应该对所有人开放。这是每种宗教都至关重要的东西，没有它就不会有宗教机构。


    我想就犹太教的情况把话说清楚（尽管我认为这对基督教也是如此）——宗教不仅仅是在寺庙里崇拜和向上帝祈祷，仅此而已。为了接触上帝，我们只能通过同类人类。宗教人士应该通过对核心价值观的承诺来表达他们的情感，这些价值观反映了对超越性生活的信仰。在我看来，这些信息是学生应该学习的，使其成为他们未来整个学习过程中教育的基础部分。顺带一句——在犹太律法中，指示如何尊崇祖先的法律与反映我们应该如何尊重老师的法律并列。两者互不可缺。犹太教本质上是一种教育——它在不断教导我们什么。记住，“拉比”（rabbi）这个词的意思就是老师。

