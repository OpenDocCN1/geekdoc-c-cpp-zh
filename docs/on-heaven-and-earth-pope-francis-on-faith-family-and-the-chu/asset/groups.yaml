    prayed but did not act justly. You cannot do one thing and not the other–it is
    essential that we help our neighbors, feed the hungry and clothe the naked. Someone
    who has blood on his hands cannot move on and talk to G-d. The same holds true
    for anyone who has robbed or stolen from someone else. We need to work toward
    a world in which no one has to extend his or her hand for alms–that is the real
    challenge. Any society in which this needs is evidently infirm. To be sure, praying
    also means looking into another’s eyes and touching their hands in order to understand
    that those who are suffering are also our brothers and that our challenge is to
    eradicate poverty.


