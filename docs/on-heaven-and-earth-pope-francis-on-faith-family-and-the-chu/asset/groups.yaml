    他们虔诚，并非来自他处。有时，有人会将这种金钱的使用客体化，并赋予它魔力；有些人认为，由于捐款，他们可能会实现无法预知的结果，但这并非购买，而是一种正如你所说的那种的奉献。当某些宗教仪式出现“价格菜单”时，我感到非常不悦。两年前，布宜诺斯艾斯的一个教区根据周几收取洗礼费。或者有时，当一对夫妇想要结婚时，教区秘书会见到他们并给他们一份“价格菜单”：有红地毯多少，没有红地毯多少，以此类推。这让崇拜变成了生意。是我们导致了这种世俗化。


    在福音中，耶稣阐述了一个非常有趣的思考。他正与门徒一起观察圣殿的捐箱，看信徒们是如何投入钱的。富人投了很多钱，这时一个寡妇来了，投了一枚很小的硬币。于是，耶稣对门徒说：“这个女人投入的比所有人都要多。”他说，其他人投入的是剩余的，而她投入了她赖以生活的全部。这才是真正的施舍。它不是来自剩余，而是导致了匮乏。当你去忏解时，我问你是否施舍。通常情况下，人们告诉我是的，于是我问他们是否直视过受助者的眼睛。最常见的回答是“我不知道”。我继续追问：“你有没有握过接受施舍者、那个街上乞丐的手？”这时他们红了脸，不再回答。当施舍是为了邻居这样做时，它就是一种深刻的人性慷慨，这才是施舍的意义。它绝不是一种购买。


    斯考尔卡：先知们对人们最严厉的批评之一是，他们祈告却不行公。你不能只做一件事而不另一件事——帮助邻居、喂饱饥者、衣裸者对我们来说是关重要的。满手鲜血的人无法前进并与上帝交流。对于任何抢劫或偷窃他人的人来说也是如此。我们需要努力走向这样一个世界：在那里没有人必须伸手要施舍——这才是真正的挑战。任何有这种需求的社会显然都是病态的。诚然，祈告也意味着看着他人的眼睛并触摸他们的手，以理解受苦的人也是我们的兄弟，而我们的挑战是消除贫困。


    贝尔格格奥：在帮助邻居中变得具体的正义行为就是祈祷。否则，人就会陷入伪善的罪中，这就像灵魂的精神分裂症。如果一个人考虑到主就在我的兄弟心中，而我的兄弟正饥饿，他就会遭受这些功能失调的。如果一个人不照顾他的兄弟，他就无法与父亲、与上帝讨论他的兄弟。我们共同的传统总是考虑到这一点。我想提到的另一点是祈祷中悔改的价值：请求上帝怜悯我，因为我是一个罪人。耶稣讲了一个比喻^50，其中有一个富人在圣殿里祈祷，他感谢主，因为他不像别人；他履行了整个律法，并完成了被要求的事。在他身后是另一个人，一个负责收税交给罗马人的男人。他被宣告（倒在地上）；由于没有力量抬起头，他请求怜悯，因为他是一个罪人。第一个离开时和进来完全一样，但第二个离开时已被正义化。这就是悔改，将自己置于上帝面前，承认愚蠢、罪孽，并在祂面前谦卑。正因为如此，骄傲的人无法祈祷，自自足的人无法祈祷。


    斯考尔卡：任何犯过罪的人都可以回到上帝身边。我们欢迎任何想要回到主的人。此外，如果那些导致许多人死亡——无论是以某种意识形态的名义还是更糟糕的以上帝的名义——能真诚地悔罪，对人类将好处好处。这些可怕领袖的行为源于他们卑劣的、宗教式的享乐主义；他们感觉自己比造物主伟大。他们将自己的命令视为不可撤销的诫，应当按字面执行。


    贝尔格格奥：在那个时刻，大卫是一个知识分子杀手，尽管如此，我们仍尊崇他为圣人，因为他有勇气说“我得罪了”。他在上帝面前谦卑自己。人可以做可怕的事，但也可以意识到自己的错误并弥补所做的事。确实，在信徒中，有些人没有在智力或肉体上杀人，但也通过资源利用不当间接杀人。在公共场合，他们可能组成福利协会，但不给员工支付与其工作相符的工资，或者“私下”雇佣他们。那就是伪善，那就是我所提到的精神分裂。可以确定，我们知道他们的简历，知道他们假装成天主教徒，但他们拥有那些永不悔改者的卑鄙态度。这就是为什么，在某些情况下，我不亲自发放圣体；我退后一步让执事人员发放，因为我不想让那些人为了拍照的机会来到我这里。可以拒绝未悔改的罪人领圣体，但检查这些事情非常困难。领圣体意味着领主体，并意识到我们共同构成了一个共同体。但如果一个人没有将人们引导上帝，反而扭曲了许多人的生活，他就不能领圣体；这将是完全的矛盾。这种精神状况出现在许多躲在教会内部的人，他们没有按照上帝宣告的正义生活。他们也没有表现出悔改。这就是我们常说的双重生活。


    # 8. 罪疚


    贝尔格格奥：罪疚可以从两个意义上理解：作为一种越规和一种心理感受。后者不是宗教性的。此外，我敢说它甚至可以取代宗教情感；某种类似于内在的声音，指出我犯了错，我做错了事。有些人过度谨慎，因为他们需要与罪疚共处，但那种心理感受是不健康的。那么当我有这种罪疚感时，与上帝的慈慈达成和解要容易得多，因为我可以去忏解，这就是：主已经赐给我的。

