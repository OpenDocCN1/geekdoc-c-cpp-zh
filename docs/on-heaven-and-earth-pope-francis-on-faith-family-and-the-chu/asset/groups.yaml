    **SKORK**: Fundamentalism goes even further than that; it entails evaluating and
    judging others. Since that person does not live the way I believe G-d says they
    should, I can kill them. That is the type of extreme fundamentalism that leads
    to hatred. And of course, what you say is correct in that it is a form of opium
