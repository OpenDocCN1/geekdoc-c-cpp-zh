    耶路撒冷的行政本应由某种巴勒斯坦政府管理。然而，阿拉拉法特继续索要更多，结果一切都化为乌有。巴拉拉克回到以色列，由于未能达成和平协议而被迫辞职。另一方面，阿拉拉法特回了家并被像英雄一样欢迎。当然，必须有一个巴勒斯坦国家——总有人认同同巴勒斯坦民族。每当这种情况发生时，意味着以色列将找到一个可以谈判的真正伙伴——如果上帝希望它是一个民主国家的话。犹太人最珍视、最本质的渴望是和平。先知以赛亚书第19章的结尾非常有力量。它谈论了一个埃及、以色列和亚述之间将达成共识的时代——也许我们应该将其理解为指代叙利亚——以及这一契约将为整个世界带来祝福。我们必须改变讨论的术语；我们必须把我所谓的“廉耻的政治”转化为对伟大的渴望。宗教主题往往以一种扭曲的形式和最有害的方式被援用。已经有太多的人以上帝的名义被杀害、犯下暴行，这是我们在之前的很多谈话中都提到过的。正如你所说，人们在1955年的马约约广场被杀害。今天，在中东，人们不断以上帝的名义互相残杀。只有当双方都有超越自我的渴望时，局面才能扭转——当人们不再想从邻居那里夺走干面包皮，而其他人不再想因为邻居生活得更好而毁掉他们。为什么不把加沙带变成中东的香港呢？为什么不把它变成一个让那里的人可以过得很好的地方？重要的是每个人的生命，以及犹太人拥有与巴勒斯坦人同样的生存权；但巴勒斯坦人也必须理解，我指的不是街上的汉们，而是他们的领导者；那些认为通过毁灭他人就能成就伟业，并因此被永世记住的人。所有类型的极端主义都是坏的，任何认为自己应该统治世界的群体都是邪恶的。有时我在想上帝为什么要把地球造成圆形的，我想出的答案是地球上的每一点都是平等的。没有哪一点比其他一点更重要——它们都是平等的。


    **BERGOGLIO:** 你从对特定时刻的政治解释，转变为关于人际关系的智慧论述。我记得很久以前与一位正经历剧烈精神时刻的老年人谈过一次话，他以某种方式回顾自己的生活，告诉我他有一个无法解决的家庭问题。“这也许是我生活中的失败之一，因为我可能从未找到过方法，”他告诉我。这句话一直留在我的脑海里。有时候，如果有人帮助寻找方法，人际关系是可以解决的，因为当一个人有问题时，眼前只能看到一座山，什么也看不见。必须有人说：“如果你去那里会比较好，或者尝试一下那里。”当我我和某人产生问题时，拥有像基督教初期埃及僧侣们那样的态度对我很有帮助。他们责备自己，以便找到解决方案；他们把自己放在被告席上，以观察自己内在哪些事情运作得不好。我这样做是为了观察我内在哪些事情运作不畅。这种态度赋予我自由，在以后能够原谅他人的错误。他人的错误不需要太强调，因为我有自己的错误，我们双方都有失败。人与人之间的和谐是通过寻找方法达成的；拉比，这就是我想你在反思背后想要强调的观点。那是解决恩怨的方法。


    **SKORKA:** 从文化角度上说，我们生活在一个媒体影响巨大的时代。他们争论每一个话题，就像在看足球比赛一样。事情并不是非黑即白的——要复杂得多——但他们玩弄狂热，做出虚假和浅薄的论证。他们唯一渴望做的就是关注最新的头条新闻并制造感。另一方面，大多数政治或社会问题的发人性书籍是使用高度技术性的语言或超出人们理解能力的哲学术语编写的。还有很多非常有能力的人，利用他们的精明用充满激情的方式论证自己的立场，但真理只能通过谦卑获得，而他们缺乏必要的克制。媒体已经习惯了这种方式呈现以色列巴勒斯坦冲突。


    **BERGOGLIO:** 媒体这种非黑即白的处理问题方式是一种罪恶的倾向，总是有利于冲突而非统一。你提到了谦卑，这是为相遇铺平道路的东西；有利于冲突只会在道路上设置障碍，而上帝的灵就在这种平整中显现。乔治·赫尔（Georg
    Hel）在《弥赛亚》开头，用男音部结合以赛亚的文本优美地引入了这个问题：“每一个山谷都要抬高，每一座山和丘都要降低”，以便道路变得平坦，为救赎之路做准备。寻找方法是走向统一的预言。你关于媒体的观点，我想扩展到所有那些强调冲突的人、那些用非黑即白说话的人。今天，存在虚假信息是因为他们只说了部分真相，只选取了对他们方便且感兴趣的内容，这造成了很大伤害，因为这是有利于冲突的一种。如果我读五份报纸对比同一个故事，通常每份报纸都会根据自己的倾向，强调它最感兴趣的部分。


    **SKORKA:** 我直在思考冲突的问题……当我读弗洛伊德时，我喜欢他的一点是，人需要解决自己的冲突，而解决的方式决定了他实际上会做什么。如果医生不具备某种程度的攻击性，他们无法从事自己的职业，因为拿起手术刀——或者执行注射、抽血等简单行为——本质上是某种暴力的。发生的情况是医生将这种攻击性转化为积极的力量。研究每个人如何处理他们的攻击性和破坏倾向是重要的。我相信（这并不是弗洛伊德的发明，而是两千多年前就出现在太勒文献中的内容）——我们有善倾向和恶倾向，而想法是知道如何将这些恶倾向转化为积极的事物。如果冲突不以这种心态来解决，我们得到了今天所处的世界，因为缺乏谦卑的一面。摩西之所以成为最重要的先知，出于多种原因，但主要是因为他是最谦卑的人。


    **BERGOGLIO:** 冲突存在于圣经的前几页。我们看到了亚当和夏娃被逐出伊甸园的案例，还有因和与亚伯之间的戏剧，以及后来巴别塔的冲突，或者以撒与雅各的冲突。在耶稣生活期间，他的门徒一直在制造紧张。这意味着在通过所有人的美德来推进冲突解决时，既不消灭多元传统，也不陷入融合主义。每个人基于自己的认同，在和解中寻求真理的统一。

