    人们曾多次尝试重建古代伟大的帝国；但它们早晚还是崩溃并瓦解了，就像南斯拉戈维亚那样，它仍在不断分裂成更小的碎片。我理解我所说的这种“地方主义”（parochialism）是指每个人都回到自己的根源。现在，我们无法知道这种局面是否能让我们实现和平，或者至少进入一个不处于战争的状态。我们无法得知自私或隐藏的动机会占据主导。先知者告诉我们的——对此我深信不疑——如果我们进入一种对话优于狭隘利益的局面，宗教将会绽放，无论地方主义的程度如何。


    **BERGOGLIO：** 如果回顾历史，天主教的宗教形式有着显著的变化。例如，想想教皇国时期，那里世俗权力与精神权力合为一体。那是基督教的一种畸变，并不符合耶稣的愿望也不符合上帝的意愿。如果宗教在历史上演变如此，难道我们不认为它在未来会适应其时代的文化吗？文化与宗教之间的对话至关重要，正如梵蒂冈第二次会议所提出的那样。从一开始开始，教会就要求持续的转化——*Ecclesia
    semper reformanda*（教会永远要改革）——这种转型在不改变教义的情况下随时间进行。未来会有不同的调整方式，就像今天有不同于绝对主义的方式一样。拉比，你刚才提到了地方主义。这是一个关键：趋向小社区作为归属地的趋势。它回应了身份认同的需求，不仅是宗教身份认同，还有文化认同：我来自这个社区，来自这个俱乐部，来自这个家庭……所以我有一个归属地，我在身份中认出自己。基督教的起源是“地方性的”。当人们阅读《使徒行传》时，会注意到基督教在彼得洗礼了两千人之后（这些人后来组织成了小社区）经历经历了巨大的扩张。问题在于，当教区没有自己的生命并被吸收到更高层次时。赋予教区生命的是这种归属感。我记得，拉比，有一天我去犹太堂，你带我见了那些做社会工作的妇女，她们正在为贫困家庭准备包裹。犹太堂引导我们关爱弟兄，这些地方让宗教付诸行动。在这种情况下，它更多地是一种福利行为，但也有其他形式：教育、推广等。对于这类行动，按说它们不应该引起我们的兴趣。不久前，例如，我为人口贩卖的受害者举行了弥撒：血汗工厂里的奴隶、被剥削的毒品贩子、落入妓院的女孩。这变成了一场大型抗议，非天主教徒聚集在一起，他们虽然没有我的信仰，但有着对弟兄的爱。我不是在进入政治，我是为了那个被放在奴隶工厂的弟兄而进入的。确实，有些人利用此引入政治；这就是为什么辨别在这种情况下如何行动至关重要。


    **SKORKA：** 正如以赛亚所说，“不要背弃你的肉身。”¹⁶


    **BERGOGLIO：** 我使用的翻译是“不要对你的弟兄妹感到羞愧”。宗教关系涉及一种承诺，而非逃避。天主教灵修曾有一个时期被称为 *fuga mundi*（逃避世俗）¹⁷，现在这个概念完全不同了——有必要参与世界，但始终是从宗教经验出发。你最近提到，当一种现象在一种宗教中发生时，它也倾向于在另一种宗教中发生。当精神性被简化为意识形态时，问题就变得严重，宗教经验失去了力量并留下了真空，转向思想世界来填补自己。另一个风险是出于自身利益做慈善工作，作为一个非政府组织（NGO）而不是从宗教经验出发。


    ¹⁶ 以赛亚书58:7

    ¹⁷ 注：拉丁语，意为“逃离世界”或寻找完全孤立的神秘生活。


    有些宗教社区面临无意识中滑向 NGO 的风险。这不仅仅是做某某事来帮助邻居的问题。你将如何祈祷？你将如何帮助你的社区进入上帝的体验？这些都是本质的问题。


    **SKORKA：** 回顾过去，地方主义在大四十年前开始出现在犹太社区中。直到20世纪60年代末，还存在一个传承犹太文化的学校网络，也有犹太主义青年运动用希伯来语、历史和传统传授各种课程——但在精神性方面没有重大发展。正那时，阿根廷廷的保守派运动开始传播，一种想法开始萌芽：会堂可以可以是儿童活动的场所，也可以是祈祷的地方。这也是我们可以组织大型活动来帮助需要邻居的地方。我认为对我来说同样重要的一点是，为了在未来获得更深层次的宗教体验，我们的宗教领袖需要表现出更多的谦卑。所有人教导孩子时，都应该明确他们谈论的是自己的真理、自己的宗教信仰，并希望后代能够增强和完善它。贬低和否定他人的宗教，并认为只有自己的代表真理是绝对不妥的。如果我们能发展出真正谦逊的态度，我们就能改变世界。当先知米迦想要定义什么是一个宗教人时，他说要“行公义，存善心，与你的神存存行事。”¹⁸


    ¹⁸ 米迦书6:8


    **BERGOGLIO：** 我完全同意谦卑的观点。我也喜欢用“温顺”（meekness）这个词，它并不意味着软弱。宗教领袖可以非常强大、非常坚定，但不行使侵略。耶稣说，统治者必须像仆人。对我来说，这个观点对于任何教派的宗教人士都是有效的。宗教领导真正的力量来自服务。当宗教人士停止服务时，他就开始变成一个纯粹的经理，一个NGO代理。宗教领袖与他的弟兄分享、同受苦并服务他们。


    **SKORKA：** 正确。我不知道未来的宗教会是什么样子，但我坚信这取决于我们作为个人所做的。本雅明曾说：“我不知道我写的这本书今天是否会产生影响，但也许在几百年后会有影响。”


    **BERGOGLIO：** 我完全同意谦卑的概念。我知道宗教曾经历过比现在糟糕的时期，但它们仍然复苏了。也许现在我们可以指出数量上的匮乏，但曾有过美德匮乏的时代。教会有过腐败的时期。我想，例如那些世袭时期，某些牧师拥有的利益确保了他们的生活。他们什么都不做，变得世俗化了。曾经历过非常困难的时期，但宗教复苏了。突然出现了像加尔各母德这样的人物，她们唤醒了人类尊严的概念，这些人物浪费时间——在帮助人们死去。这些行动产生了神秘感并重振了宗教热情。在天主教历史上，真正的改革者是圣人。他们是真正的改革者，那些改变、转型、推动并复兴精神之路的人。在另一个例子中，方济各面对基督教世俗和教会权的财富、骄傲和虚荣，贡献了整个关于贫穷的概念。他实施了贫穷和剥离的神秘主义，他改变了历史。在犹太教中，这些人是如何出现的？


    **SKORKA：** 我想提到的一个例子是他在整个阿根廷犹太社区曾受到广泛批评，但无疑标记了以前和以后的人——马歇尔·梅耶（Marshall Meyer）。我不能说他是圣人，因为圣人的概念在犹太教中不存在；我不会说他所做的一切都是完美的，我也不完全同意他所有的观点。但，如果我们考虑到社区在60年代开始繁荣，那归功于他。宗教扮演了'
