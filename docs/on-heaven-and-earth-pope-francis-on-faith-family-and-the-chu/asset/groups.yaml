    # HOW WE EXPERIENCE DIALOGUE


    Abraham Skorka


    “And G-d said to them..” It’s the first recorded conversation we encounter in
    the Bible. Humans are the only creatures to whom the Creator speaks in this manner.
    In the same section of Genesis we are shown that each of us has a special capacity
    to relate to nature, to our fellow man, to ourselves and to G-d.


    Of course, these relationships which man is inclined to form are not like watertight
    compartments which are independent of one another. Our relationship with nature
    results from our observations and the detailed handiwork that we observe; relationships
    with our fellow man are based on our interests and life experiences; and our relationship
    with G-d, which comes from deep inside our being, is a result of self-


    1 Genesis 1:28'
  - '[PAGE 11]


    dialogue, and is nurtured by all the other relationships mentioned above.


    True dialogue is at the heart of the thinking man’s life and demands that each
    person tries to get to know and understand the person with whom they are conversing.
    As Ernesto Sabato expressed in his unique style in the prologue to his book One
    and the Universe,³One sets off for distant lands, or seeks the knowledge of man,
    or investigates nature, or searches for G-d; only afterwards does he realize that
    the phantom he was chasing was Himself.”


    When conversing with one’s fellow man, words are merely vehicles for communicating,
    although even in societies where everyone speaks the same language, the exact
    same words can take on somewhat different meanings. Each person adds their own
    nuance to many of the words they use, which then become part of the linguistic
    heritage. Dialogue requires that each participant become acquainted with the other
    person.


    > “G-d’s candle is man’s soul which reveals the-ermost parts of his being.”⁵ In
    its most profound sense, to have a conversation is to bring one’s soul nearer
    to another’s in order to reveal and illuminate his or her core.


    2 Uno y El Universo Edición definitiva, Seix Barral, Buenos Aires, 1995


    3 Proverbs 20:27'
  - '[PAGE 12]


    When a dialogue reaches this level of magnitude, one becomes aware of what he
    or she has in common with the other person. He or she each has the same persistent
    existential questions with their various interpretations. Each soul is a reflection
    of the other. The Divine Breath, which both possess, knows to unite the two and
    then form a link with Him that will never weaken, as it is written, “A cord of
    three strands is not quickly torn apart."+4


    There were many different opportunities which helped pave the long road of details
    and circumstances that brought Cardinal Bergoglio, and me closer and allowed us
    to get know each other better.


    One day we set a time and place so that we could just sit together and talk. The
    topic of discussion was life itself as seen through the prisms of local society,
    global concerns and the evidence of villainy and nobility that surround us. We
    spoke with complete intimacy, if you don''t count the presence of G-d. Although
    His name wasn''t brought up consistently (perhaps it should have been?), we felt
    that He was always present.


    The meetings became recurring events, with each one focused on a different topic.
    One time, our meeting took place at my office in the synagogue and I was commenting
    on some of the framed documents that


    4 Ecclesiastes 4:12'
  - '[PAGE 13]


    adorn the walls. I paused to focus on some pages from a manuscript written by
    the great thinker Rabbi-Abraham Joshua Heschel and some of the other texts as
    well. Regardless, my friend had stopped following me, having spotted a greeting
    that I had hung next to the Heschel documents. He had presented it at the synagogue
    years before on the occasion of the Jewish New Year. While I went about re-arranging
    some things in my constantly cluttered workspace, I saw that he continued to focus
    on those particular pages, which he himself had signed and dated.


    Curiosity seized me. What was going through his mind at that moment? What was
    so special about what I had done, above and beyond caring for displaying a document
    that I consider a valuable testimony of what interfaith dialogue can accomplish
    in our world? I did not ask him. Sometimes, there are moments of silence that,
    in themselves, constitute a sort of answer.


    Shortly thereafter, we chose the Archbishop’s office for one of our meetings.
    The conversation turned toward the presence of religious sentiment in Latin American
    poetry. I told him, “I have a two volume anthology on this that I would like to
    lend you, please stay here while I go to the library to find them.” I then found
    myself alone in his small study. I looked over the bookshelf and its accompanying
    photos and I imagined that these must be people he truly cares for—those who mean
    a lot to him. Suddenly, I noticed among them a framed picture that I had given
    to him'
