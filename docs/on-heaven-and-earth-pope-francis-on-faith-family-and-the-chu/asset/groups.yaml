    他让开了位，告诉上帝派一个人来取代他。权力在我们的传统中是由上帝赋予的：“你——上帝说——不是我选择了你，是我选择了你。”当我把手放在他们身上授职时，我告诉神父们，他们学习并不是毕业，这不是职业，不是他们选择了，而是被选择了。现在发生了什么？我们是人，是罪人，我们不是天使，正如你说的，拉比。人可能会陷入那些并非授职时赋予他的权力中，而是另一种权力。或者人可能会自视过高，或者强加一种上帝并不想要的世俗权力。


    教会发生的一件好事是失去了教皇国，因为显然教皇所拥有的只有三平方英里的土地。但当教皇既是世俗国王又是精神国王时，会有宫廷阴谋等所有这些杂在一起。现在他们不混杂了吗？我们是人，是罪人，我们不是天使，正如你说的，拉比。人可能会陷入那些并非授职时赋予他的权力中，而是另一种权力。或者人可能会自视过高，或者强加一种上帝并不想要的世俗权力。

