    她把这句话放在她小床头柜的玻璃罩下，每次睡觉时都会读一遍。七十年后我仍然没有忘记。还有另一句口溜是她告诉我的，那是她在一个意大利墓地读到的：“行走的人啊，停下来想想你的节奏、你的脚步、最后一步。”她给我留下了这种意识，即万物必有终结，一切都必须井井有序地留下。对于基督教生活而言，死亡必须在道路上陪伴着你。在我的情况下，例如，我每天都在想自己即将


