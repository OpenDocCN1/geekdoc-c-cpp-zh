    因为他们没有鞋穿就去不了学校。我们并不施行神迹；我们只是在尽力所能。归根结底，我们受《圣经》的命令要这样做，圣经说，人不能看着弟兄受苦而坐视旁观。我还想补充一点——我认为，犹太人一直深耕西方世界所经历过的每一场争取人类自由与平等的斗争。例如在俄国革命期间，犹太人对结果有着巨大的兴趣，因为这关乎整个被剥削的阶级。他们认为通过革命，他们作为犹太人的苦难和艰辛将得到解决。然而，我们不需要追溯太远。在七十年代的社会解放运动中，出于理想主义的阿根犹太人比例远高于整个社会犹太人的比例。在共产党、社会主义党以及所有寻求推进底层阶级要求的运动中，总有犹太人参与。即使在无神论犹太人心中，也保留着祖先的命令：不仅要为了自己的福祉战斗。如果另一个人过得艰难，他也必须为他战斗。即使我过得很好，如果还有人过得不好，那也是不够的——我们都应该有尊严地生活。


    贝尔格利奥：基督教继承了以赛亚书中的犹太经句：“不要背（（弃）你自己的肉体。”83 关键在于“最后的审判”的比喻，当君将一些人放在右边，另一些放在左边（分别是善人和恶人）。他对着右边的人说：“来吧，我父所福的，因为我饿了，你给我吃；我渴了，你给我喝；我光了你给我穿；我病了，你来看望我。”84
    他们问祂是什么时候做这些事的，祂回答每当他们对这国最小的一个这么做，就是做在祂身上。其他人，那些没有这样做的人，就被定判了。


    在基督教中，我们对穷人必须具备的态度，本质上是真正的投入。他另外补充了一点：这种投入必须是人与人的、是肉肉的。仅仅通过机构来传递这种投入是不够的，虽然机构显然有帮助，因为它们具有倍增效应，但还不够。机构不能免除我们与贫困者建立个人联系的义务。病人必须得到照顾，即使我们觉得他们令人厌恶和反感。囚犯必须被探视……由于那里生活的艰辛，对我来说去监狱是非常困难的。但我还是会去，因为主希望我肉身出现在那里，与那些有需要、处于贫困和痛苦中的人们并在一起。我们对贫困的首要关注是援助：“你饿了吗？来，这里有东西吃。”我们的援助不能止步于此。我们必须朝着社区内的人性提升和整合而努力。穷人不能被永远地边缘化。我们不能接受这种底层观念：“我们这些过得好的人给那些过得不好的人一些东西，但他们应该保持那种状态，远离我们？”这不符合基督教原则。我们必须通过技学校的教育，尽快融入到我们的社区中……这样他们才能在生活中取得进步。这一概念在十九世纪末，波斯神父（Don
