    **SKORK**: There is a book called *G-d''s Revenge* by Gilles Kepel, a very well-known
    French analyst. In it, the author reviews Islamic fundamentalism, but prior to
    that he mentions Jewish and Christian fundamentalism. He analyzes recent political
