    faiths and we should delve further into the subject that we have in the past.


    **BERGOGLIO:** I insist our opinion about the marriage between two people of the
    same sex is not based on religion, but rather on anthropology. When the head of
    the Government of the City of Buenos Aires, Mauricio Macri, did not appeal the
    judge’s opinion right away authorizing a [same-sex] wedding, I felt that I had
    something to say, to inform; I saw myself with'
  - '[PAGE 139]


    an obligation to state my opinion. It was the first time in eighteen years as
    bishop that I criticized a government official. If you analyze the two declarations
    that I formulated, at no time did I speak about homosexuals nor did I make any
    derogatory reference toward them. In the first declaration I said that the judge''s
    opinion was worrisome because it indicated a certain indifference toward the law,
    since a justice cannot alter the Civil Code in the first place, and she was altering
    it. At the same, I was alerting people to the fact that the head of the government,
    responsible for protecting the law, was prohibiting the appeal of this judgment.
    Macri told me that these were his convictions; I respected him for that, but the
    head of the Government does not have to transfer his personal convictions to law.
    In no moment did I speak disrespectfully about homosexuals, but yes I intervened
    and point out a legal issue.


    **SKORKA:** In a democracy, everything should be resolved through legal channels
    by way of a sincere, respectful and extensive debate. Each side should argue in
    a way that seeks common ground with their adversary, in order to arrive at a successful
    judgment based on mutual concessions. There were those involved in the debate
    prior to the passing of the law who invoked “natural law,” which presumes that
    nature contains rules that regulate human behavior; an undercurrent of this belief
    is the idea that G-d Himself incorporated this law into His Creation. But someone
    who is homosexual has every right to say'
  - '[PAGE 140]


    that it was either G-d or nature that made him the way he is. There are those
    who add that homosexual love is deeper since they know about feminine and masculine
    love, even though that does not mean that it is the way families are created.
    Everyone knows the role that masculine and feminine figures playing in the raising
    of a child and the problems that exist when these images are mixed up.


    **BERGOGLIO:** It is often argued that a child would be better cared for by a
    same-sex couple rather than in an orphanage or an institution. Those situations
    are not optimal. The problem is that the State does not do what it has to do.
    Just look at the cases of children who are in certain institutions, where the
    last thing that happens is recovery. There must be an NGO, churches, or other
    types of organizations that can take care of them. They should streamline the
    procedure of adoption, which are never-ending, so that these children can have
    a home. One failure of the State does not justify another failure of the State.
    The underlying issue must be addressed. More than a marriage law so that people
    of the same sex can adopt, we have to improve the adoption laws, which are excessively
    bureaucratic and, in their current implementation, encourage corruption.


    **SKORKA:** It is really necessary to reform the adoption laws. The sages of the
    Talmud say that adopting a child is a supremely important act. Any legislation
    should take speed and efficiency into account after'
  - '[PAGE 141]


    having analyzed the various stages of the adoption process. Returning to the topic
    of marriage, there is an element that we cannot leave out of the equation, as
    obvious as it is: love. There is a reason why the Bible uses the image of two
    lovers to represent the final stage in our search for G-d. As rational a man as
    Mai-mononides, a twelfth-century Aristotelian, defined the love between G-d and
    man in the same terms we use to describe the union of a man and a woman. Homosexuals
    love someone that they know, something that is similar. It is easy to know a man,
    being a man. To get to know a woman is a much more difficult challenge for men—she
    must be deciphered. A man can understand perfectly well what another man is feeling
    just as a woman understands what happens in the minds and bodies of other women.
    Conversely, discovering the “other” is a huge challenge.


    **BERGOGLIO**: Part of the great adventure, as you said, is to mutually decipher
    ourselves. There was a priest who said that God made us man and woman so that
    we would love one another and be needed by one another. In preaching on marriage
    I usually say to the groom that he has to make the bride more of a woman and to
    the bride that she has to make the groom more of a man.'
