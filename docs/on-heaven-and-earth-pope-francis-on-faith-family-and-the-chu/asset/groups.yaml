    尊重自杀者；他是一个无法克服自己生活中矛盾的人。我不拒绝他。我将他交由上帝仁慈之手。


    **SKORKA：** 在犹太教中，关于自杀有两种观点。第一种观点认为，自杀者应该被安葬在单独的地方，我们会省略某些惯例在纪念逝者时诵读的祷文。另一种观点是，也许那些自杀的人在最后的时刻，在他们已经“扣动扳机”之后，会对自己的所所为感到悔恨。对他们的审判应该像认为他们在最后一刻犯下了非自愿的行为，而这种行为是不受惩罚的。另一种看待方式是，这是一种注定他们他们死的传染病。每当我不得不处理自杀案件时，我对家属的解释是：死者患了疾病，他们当时非常混乱，不知道自己在做什么。这是由于身体和心理化学物质失衡导致的抑症最糟糕的结果。他们觉得需要离开这个世界；他们无法继续生活下去。当人们心碎地问我：“我对他/她来说这么微不足道吗，至于他们决定永远离开我？”我试着恢复他们爱人的地位和名誉。


    **BERGOGLIO：** 我喜欢这种对疾病的解释。总有一个时刻，人无法对自己所做出的每一个决定负责。我更倾向于这样解释自杀，而不是将其视为一种自私的行为，但我想回到安乐死；我深信现在看到的是隐性安乐死。在还有生命希望时，必须给患者一切必要且常规的东西以便其生存。对于末期病例，没有义务采取极端措施。此外，尽管有预期寿命，极端措施（例如插入气管让某人多活几天）并不是义务性的。


    **SKORKA：** 从《塔尔穆德》来说，我会说极端措施意味着不让某人死去。如果有什么事情、任何事情可以让他们活下去——不要停止它。但如果我们知道患者没有任何脑活动，并且严格遵循了规程以确保没有生命体征，就应该缓慢地、非常小心地开始关闭机器。我完全反对徒劳的生命维持。构成犹太法的规则——*哈拉比*（Halacha）说，如果一个人离开某就会去世，那么移除任何用于维持生命的东西都是允许的。也就是说，如果某人头下垫枕头是防止其死亡的唯一办法，那就把它拿走。如果舌下有盐，也把它拿走。辩论徒劳的生命维持与主动安乐死是完全不同的事情。当无能为力时，向某人泵入药物以人工维持其生命是不正确的。我深表尊重那些告诉我告诉我，他们真的可以做一些事情让患者维持完整的生活，在那个时刻一切都应该竭尽全力。然而，如果他们确定没有生存机会，他们需要让患者在剩余的时间里平静地生活。我们谈论的是疾病的晚期，当所有医生都说它是绝症时。如果一个垂死的人没有恢复的机会，进行输血或让他们连接呼吸机仅仅为了延长二十四小时生命是没有意义的。如果某人正在痛苦，应该给予他们止痛和让他们尽可能舒服的药物，但仅此而已。我们并不通过让患者处于痛苦来尊重生命。


    **BERGOGLIO：** 在天主教道德中，没有人有义务采取极端措施来治愈他人。并不是在已知生命不再存活时死抓住它。当存在扭转疾病的可能性时，一切都应该去做；但只有在有康复希望时，才使用极端方法。


    ## 12. 关于老年人


    **SKORKA：** 老年从不容易。我将从圣经中的一个场景开始，雅各告诉法老，他度过了简短而艰难的130年。老年是有问题的，因为我们不是看向未来，而是开始回顾过去。尽管如此，如果我们真的过得充实而热烈，这可能是我们生命中一段美好的时光，因为那时我们已经理解了生命的意义。然而，今天老年是一个是我们担心的问题，因为在现今的文化中，老年人被视为可弃的材料。现代生活并没有给人们更多时间去放松，反而让他们跑得越来越快。这不仅仅是物质财富的问题；去健身、旅行和其他活动已变成实际上是义务性的。根本没有时间来照顾老人了。为了让我们更好地感知事物，尝试去视觉化老年人如何孤独生活是非常重要的；是因为他们的朋友离世了，还是因为他们与孩子之间的代沟使得他们难以交流。老年人不是东西；他们是值得我们照顾的人。每当我们访问遍布布诺斯艾利斯市无数养老院时，我们都必须问自己：“这些生活条件体面吗？”今天，老年人被挤在一边。有一句圣经经文——“要在白发面前敬起，要尊敬老人。”生活是一场斗争，当那些带着尊严战斗过的人在晚年极度孤独时，这是艰难的。有时，养老院在医疗治疗方面是顶级的，但从精神角度来看，它们有许多不足……老年人需要爱、情感和交流。


    **BERGOGLIO：** 我想重申你关于“丢弃”的说法。以前，我们能够讨论社会中的压迫者和被压迫者。随着时间的推移，我们发现这种分类是不够的，还需要增加其他的：被包含的和被排除的。在这个消费主义、享乐主义和自恋的社会里，我们习惯于人是可以丢弃的观念，其中老年人占有一个特殊的地位。父母工作，不得不求助于养老院来照顾老人，但很多时候并不是工作忙的问题，而是纯粹的自私：老年人在家里很麻烦，气味难闻。他们最终被储存在养老院里，就像夏天挂在衣柜里的外套。有些家庭没有其他选择，每个周末都探望祖父母，或者把他们带回到家里；他们在家人身边得到照顾。这并不是丢弃；相反，这是一个非常沉痛的现实。但在许多情况下，当我访问养老院时，我询问老年人关于孩子，他们回答说因为工作不能去看；他们试图以此掩盖。有很多人遗弃了那些养过他们、教育过他们、为他们擦过屁的人。这让我痛苦；让我内心流泪。我们将不谈论我所谓的隐性安乐死：医院和医疗保险对老年人的极不关注，没有给予他们所需的药物和关注。老年人是故事的传递者，他们带给我们记忆，一个民族、一个国家、一个家庭、一种文化、一种宗教的记忆……他们经历了这么多，即使其中一些人很烦人，他们


