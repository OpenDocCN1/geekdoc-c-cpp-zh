    interesting anecdote to share regarding Von Galen, the German bishop from Munster.
    Fritz Steinthal, the rabbi that founded my congregation, was a German who survived
    Kristallnacht, which that took place in the early morning hours of November 9–10,
    1938, when the Nazis destroyed most of the country’s Jewish synagogues and businesses.
    In his memoirs, the rabbi noted his appreciation for Von Galen and other Christian
    priests who saved Jews while putting their own lives at risk. Now, with respect
    to the actions of Pope Pius XII during the Shoah, it is very difficult to form
    a conclusive opinion because people have written both for and against him. Just
