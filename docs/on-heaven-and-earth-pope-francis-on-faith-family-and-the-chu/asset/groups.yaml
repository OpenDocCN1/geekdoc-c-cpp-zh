    ## 28. ON INTERRELIGIOUS DIALOGUE


    **SKORKA:** A priest once pointed out to me in Mar del Plata that there were religions
    that had not been participating in our national celebrations, and although I began
    to see that it is a tradition, it could still be changed. That stuck in my mind.


    **BERGOGLIO:** I do not know if you remember, when I began the Te Deum Masses
    as Archbishop, I came down with the nuncio accompanying the president and we walked
    him to the door. All of you, representatives from other faiths, would remain in
    your place, like puppets in an exhibition. I changed that tradition: now the president
    goes up and greets all of the representatives of the other faiths. That was a
    step in the direction that you propose. Since the Te Deum in Salta in 2009, the
    ceremony is divided in two: not only is the traditional, classic, song performed,
    and the Eucharist, together with the homily and the Catholic prayer, but the representatives
    of other faiths also present their own prayers. Now there is greater participation.


    **SKORKA:** For me, these gestures mean a lot; it is a way of showing the importance
    of interfaith dialogue.


    **BERGOGLIO:** Your work in this area is very important; I did not forget how
    you invited me twice to pray and to speak in the synagogue, and I invited you
    to speak to my seminarians about values.


    **SKORKA:** Your attitude has also been important and courageous since there must
    have been people within the institution that did not think the same way.


    **BERGOGLIO:** The first time that the Evangelicals invited me to one of their
    meetings at Luna Park, the stadium was full. That day a Catholic priest and an
    Evangelical pastor spoke. They gave two talks each, interspersed, with a break
    to eat some sandwiches at noon. At one point the Evangelical pastor asked that
    everyone pray for me and for my ministry. He had asked me if I would accept that
    they would pray for me and I answered that of course I would. When they prayed,
    the first thing that occurred to me was to kneel down, a very Catholic gesture,
    to receive their prayer and the blessing of the seven thousand people that were
    there. The next week, a magazine headline stated: “Buenos Aires, sede vacante.
    The Archbishop commits the sin of apostasy.” For them, praying together with others
    was apostasy. Even with an agnostic, with his doubt, we can look up together to
    find transcendence; each one praying according to his tradition. What’s the problem?


    **SKORKA:** There is a book that was written by a very dear friend, a very special
    rabbi named Shmuel Avidor HaCohen. He was much older than I and was among the
    founding members of the Israeli pacifist movement Peace Now. He was a revolutionary
    in many respects. Shmuel wrote the biography of another legendary rabbi, Abraham
    Isaac HaCohen Kook, who in the first half of the twentieth century, said that
    all those designed and built the *kibbutzim*, despite their estrangement from
    tradition, performed a religious act because they returned to the Land of Israel
    when it was still occupied by the Turks and it was all swamp-land. For him, it
    was a religious act to recover the dignity that we come through working the land,
    something which had been denied to the Jews of Europe. That was like your kneeling
    at the Evangelical service–he was a man rowing against the current. That is why
    Shmuel called his book *Man Against the Current*. From that point of view, I appreciate
    the changes that you introduced at the Te Deum–that the president greets all of
    the religious dignitaries, and that some of them also give sermons. Changing those
    things within such an ancient organization is not easy. I congratulate you for
    trying to break old, vicious cycles. That is our work, and our challenge.


    ## 29. ON THE FUTURE OF RELIGION


    **SKORKA:** Religion will always have a future because it is an expression of
    the profound search for the meaning of life and a consequence of introspection
    and encounters with Him. As long as life continues to be a mystery and man wonders
    who created the natural order—while those questions, which I believe will be eternal,
    persist—the concept of religion will endure, as a manifestation of the urgent
    calling to understand who we are. As long as he does not have answers to these
    questions, man will desire to become closer to G-d, and that in essence, is mysticism.
    Now, as to what religion will look like in the future, that is another story.
    I have absolutely no doubt that man will retain his religious sensibilities. What
    we do not know is how they will be organized and what form they will take.


    The big restless questions are whether the religious institutions that we are
    currently familiar with will continue to exist and whether traditional religions
    will continue to develop. That is where other variables come into play.


    **BERGOGLIO:** Saint Augustine has a quote that goes in the direction of what
    you were saying, Rabbi. He says: “Lord, you have made us for yourself and our
    hearts are restless until they rest in you.” The most important part of this prayer
    is the word *restless*. If we are being honest with ourselves there is a feeling
    of profound restlessness behind our search for the transcendent, one that stirs
    us to an encounter with Him. As we live the encounter another search is initiated
    and so on and so forth, each time with more depth. We like to describe that restlessness
    like the breath of God that we carry inside of us, the mark that He left in us.
    Many times it is even in people who have not heard God speak or who have taken
    anti-religious stances in their life, or were immanentists, and all of a sudden,
    they encounter something that transcends them. While this restlessness continues
    to exist, religion will continue to exist, we will have ways to bond with God.
    However, when we work toward making the spiritual practical, motivating factors
    start to come into play and they become with our religious experiences. Many times,
    those factors overpower the purity and beauty of the encounter, and they end up
    distorting it. That is why to talk about the future of religion means talking
    about the future of mankind and of history; it is almost like making a political
    and sociological projection. I have heard some Christians mention a return to
    a type of parochialism, which is an idea I am in favor of. Instead of there being
    hierarchical mega-institutions, the idea is to return to smaller congregations
    that nurture their own spirituality. It would mean having more independent bodies.
    I do not know if you have heard any talk of this idea; I like the idea of not
