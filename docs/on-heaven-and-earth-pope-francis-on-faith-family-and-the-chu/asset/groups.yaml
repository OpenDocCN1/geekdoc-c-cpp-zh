    It is as if God were to say: “I have allowed that some sin, so that their faces
    might fill with shame.” Because then they will find the God of mercy. Otherwise,
    they are those Christians with good manners, but with bad habits in their hearts:
    the proud. Sometimes transgression makes us more humble in the presence of the
    Lord and brings us to ask for forgiveness.


    **SKORKA:** Once again, we agree. Sin exists to teach us that we are not perfect.
