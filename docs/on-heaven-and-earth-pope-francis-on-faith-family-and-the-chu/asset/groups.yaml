    # 论天地

    教皇方济额

    关于21世纪的信仰、家庭与教会


    ![](img/d13e6e03723eeae5ab672dc6e86f6262_0_0.png)


    豪尔赫·马里奥·贝尔格奥奥与亚伯拉罕·斯尔卡


    《论天地》是豪尔赫·马里奥·贝尔格奥奥与拉比比兼生物物理学家亚伯拉罕·斯尔卡之间一场开放且广阔的对话。在对话中，他们分享了对宗教、理性以及21世纪世界面临挑战的思考。多年来，贝尔格奥枢主教和斯尔卡拉比一直是信仰与理性的跨宗教对话的坚定推动者。他们都致力于在天主教、犹太教与整个世界之间建立桥梁。《论天地》汇集了这一系列对话，两人讨论了各种神学和世界问题，包括上帝、原教主义、无神论、堕胎、安乐死、同性婚姻和全球化。通过这些个人化且平易近人的对话，读者可以手了解这位现任全球12亿天主教徒教皇的真实面貌。


