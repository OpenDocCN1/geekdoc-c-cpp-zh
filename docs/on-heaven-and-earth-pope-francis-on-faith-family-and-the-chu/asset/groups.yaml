    platforms to aesthetic ideas. Today, image is more important than what is proposed.
    Plato said it in The Republic, rhetoric-which equates aesthetic-is to politics
    what cosmetics is to health. We have displaced the essential with the aesthetic;
    we have deified polling and marketing. Perhaps, that is why I am committing a
    sin against good citizenship: the last vote I cast was in the midterm election
    during the Frondizi Government.66 I still have residence in the province of Santa
    Fe, because I worked there as a professor. When I came to Buenos Aires, I did
    not change my residency and since I was more than 300 miles away I was not going
    to vote. When I finally registered as living in Buenos Aires, I changed my residency,
    but I continued showing up on the Santa Fe voter registry. After all that, I turned
    seventy and I do not have the obligation to vote any more.67 It is debatable if
    it is all right for me not to vote, but at the end of the day I am father of all
    and I cannot be wrapped in a political flag. I realize that it is difficult to
    disentangle myself from the electoral climate when elections approach, above all
    some come to beat down the door of the Archdiocese to say that they are the best.
    As a priest, before an election, I send the faithful to read the political platforms
    so long that they can choose. In the pulpit I take care of myself rather well,
    I stick to asking people to look for the values and nothing else.


    **SKORKA:** I also suggest that everyone read the party platforms and they use
    their analytical skills to differentiate between them. I do not hold a position
    that is as politically exposed as yours, Monsignor, but when I am invited to a
    politician’s event, as long as it does not have any connotation of election, I
    go. I believe that it is a good way to honor both politics and the country.


    **BERGOGLIO:** Of course, participating in political life is a way of honoring
    democracy.


    **SKORKA:** On occasion, when certain politically charged events occur here at
    home, we issue some kind of opinion, and that opinion might be critical. When
    there is a position that is incompatible with our values, we should criticize
    it–but with religious arguments, not political ones. Since we are talking about
    social values, it is often difficult to separate one from the other–there is no
    way around it. On a TV show called *God Is My Rest*$^{68}$ I insisted on the importance
    of democracy during the military regime. It was not the type of criticism a politician
    would have made. Instead, it was that of a rabbi issuing it from his religious
    platform.


    **BERGOGLIO:** There should be a distinction between politics with a capital P
    and politics with a lowercase p. Any act that a religious minister makes is a
    political act with a capital P, but there are some that would mix in politics
    with a lowercase p. The religious have the obligation to preach values, the lines
    of conduct, of education or to say a word, if requested, regarding a specific
    social situation. On December 30, 2009, I offered the Mass for the five-year anniversary
    of Cromañón. It was a social circumstance where I should say something. There
    are situations that call for that, when there is a serious deviation. It is not
    that one appears to the world through politics, but rather through the values
    that are at stake, through the tragedies that happen. The religious minister has
    the obligation to defend values; what happens is that the political world can
    become overly scrupulous: it listens to a pastor and they say that he is preaching
    against so and so. We do not preach against anyone; we refer to the value that
    is in danger and must be safeguarded. The media, which are sometimes infected
    with hepatitis, and I say this because of their yellow color, jump out and say:
    “Harsh rebuke to so and so!”


    **SKORKA:** Some politicians talk out of both sides of their mouths—on the one
    hand they ask that religious leaders do not give opinions, but during the campaign
    they want a religious minister''s blessing.


    **BERGOGLIO:** When I meet with politicians, some come with good intentions, and
    share a vision of the Social Doctrine of the Church, but others arrive only to
    seek political ties. My response is always the same: Their second obligation is
    to have an inner dialogue between themselves. The first is to be a guardian of
    the sovereignty of the Nation, of the Homeland. The country is the geographical
    dimension and the Nation is the constitutional or legal aspect that makes social
    relations viable. A country or a nation can fall into war or be torn apart and
    be remade. On the other hand, the Homeland is the patrimony of the founding fathers;
    it is what we have received from those who founded it. It is the set of values
    that they handed down to our care, but not to guard them in a tin can, but to
    make them grow and launch them toward a utopia responding to today''s challenges.


    Once the Homeland is lost, it cannot be recovered; the Homeland is our patrimony.
    There are two images that tell me a lot about the Homeland. One is biblical: when
    Abraham leaves his land, following the path of God, and he takes his father who
    is an idol maker. Even then, he does not cut off his tradition but purifies it
    with Revelation. The other image is more Western: when Troy is burned, Aeneas
    goes out to found Rome. The Homeland is carrying our fathers on our shoulders.
    With the inheritance that they have left us, we must negotiate the present, make
    it it grow and send it forward to the future. Today the politicians are in charge
    of preserving the Homeland, the theocracies have never been good at it. God gives
    man the responsibility of managing the progress of his country, his homeland and
    his nation. Religion marks the ethical and moral guidelines and opens the path
    to the transcendent.


    **SKORKA:** Monsignor, you used a key word–sincere and meaningful dialogue. Our
    country''s worst problems are cultural more than anything else. Argentinians are
    not doing very well, and evidence of this is a lack of dialogue. Like you said,
    a country is a territory; a nation is a legal, judicial structure that provides
    order, and a homeland is the legacy of the past. All of these need to be fueled
    by values. Argentina, with its merits and mistakes, was created based on a framework
    where religion was an important factor. Even though each religious tradition has
    a different worldview, we need to bring them all to the table in a dialogue with
    agnostics so we can focus on the good ideas and arrive at a consensus as to how
    to restructure the homeland. I understand what you are saying, Monsignor, that
    we have to bring along our forefathers, but as the famous rabbi of Kotzk stated,
    when one truth tries to imitate another, it is not the truth anymore. Through
    dialogue, we have to create our own truth that has its roots in the past and which
    should include religion. That should be the point of contact with the world of
    politics. I should also mention that we are lucky that there are few theocratic
    states because that leads to fundamentalism. Every country should have a democratic
    system of government. I include the State of Israel where traditional Jewish values
    are evident in everything it does, via a system of government that is completely
    democratic. It is not easy, and there are constantly clashes between the State
    and religious authorities. The rabbinate will have one opinion and the Supreme
    Court another, and the country has to try and convince the religious authorities,
    who are sometimes very strict and unyielding, that democracy is the right way.
    Through dialogue, democracy softens hardened positions.


    **BERGOGLIO:** Power is something that God gave to humanity. He told us: “Be fertile
    and multiply; fill the earth and subdue it.”60 It is a gift from God that allows
    people to participate in creation. I would question “power,” which at times that
    power is to impose my way, to push everyone in my line and to make them go on
    that path, I believe that it is wrong. Religion must not be like that. Now, if
    I understand power in an anthropological way, as a service to the community, that
    is another thing. Religion has a patrimony and puts it at the service of the people,
    but if it starts to mix itself in superficial politics and to impose things under
    the table, then yes it can become a bad form of power.


    66 Ed. Note: Arturo Frondizi was elected president of Argentina on May 1, 1958,
    and was overthrown by the military on March 29, 1962.

    67 Ed. Note: In Argentina voting is compulsory, which makes not voting an act
    subject to fines. However, at the age of seventy, voting becomes discretionary.

    68 Dios es mi descanso

