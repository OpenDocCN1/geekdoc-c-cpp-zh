    ……你的房子；他们认为所有新教徒都会去地狱；但我记得有一次我跟我祖母在一起，她是一位伟大的女性，当时两个来自救世军的女性刚路过。我那时大约五六岁了，我问她她们是不是修女，因为她们正戴着那种过去常戴的小帽子。她回答我说：“不，她们是新教徒，但她们是好人。”那就是真宗教的智慧。她们是行善事的好女人。而我所经历的这种感受，与清教徒的教育形成了鲜明对比。


    **SKORK**：有一本书是吉尔斯·凯佩尔（Gilles Kepel）写的《上帝的复仇》（*G-d''s Revenge*），他是一位非常著名的法国分析师。在书中，作者回顾了伊斯兰基础主义，但在那之前，他提到了犹太教和基督教基础主义。他分析了近期的政治事件，展示了基础主义是如何在危机时期产生的，例如20
    世纪 70 年代的石油危机。随后，他从社会学的角度处理了这一现象。他根据群体心理学理论为这一主题找到了某种逻辑解释。犹太教中也有基础主义的案例，以兹拉克·拉宾（Yitzhak
    Rabin）⁴¹被刺杀是最具破坏性的象征。我们必须通过自由和尊重他人来荣耀上帝。


    ⁴¹ 以兹拉克·拉宾曾两次担任以色列总理。1994年他与巴勒斯坦领袖亚赛尔·阿拉法特（Yasser Arafat）因在奥斯陆达成的和平协议共同获得诺贝尔和平奖。他在1995年被一名以色列极右犹太学生杀害。


    上帝说我们要像爱自己一样爱邻舍。当犹太人进行日常祷时，他们这样开头：“我们的上帝，我们祖先的上帝，亚伯拉罕的上帝，以撒的上帝，雅各的上帝……”我们为什么要在每一位祖长之前重复上帝的名字呢？因为他们每个人都以自己的方式与上帝联系。没有人可以武断地向他人强加“真理”。我们应该教育和引导人们，之后每个人都会根据自己的真诚感受，活出他们理解的真理。这些都是基础主义所排斥的。


    **BERGOGLIO**：这种复兴主义基础主义也是一种鸦片，因为它让你远离了鲜活的上帝。鸦片是一个让你疏离的偶像，就像任何偶像一样。它将上帝简化为一个你可以用处方去管理的存在：“如果我做了这个，一切都会好起来；如果我做了那个，我就不会缺少任何。”这是一种购买安慰、安宁、财富和幸福的形式，但它撇下了鲜活的上帝，即那个一路伴同你的人。


    **SKORK**：基础主义比这更进一步；它包含了对他人的评估和评判。既然那人的生活方式不像我相信上帝说的他们应该过的方式，我可以杀掉他们。这就是导致仇恨的极端基础主义。当然，你说得对，它是一种疏离人的鸦片形式。有多少富人去寻找神迹创造者、神秘主义者或卡巴拉学者，认为只要他们做了某些事，一切都会好起来。我想，这种情况在天主教教会和犹太教中也发生着同样的事情，那里有一些人向拉比捐赠巨额资金用于慈善事业——学校、孤儿院、营救儿童等，但这一切的底层逻辑是，他们给钱给拉比是认为这样他们就能接触到有利的交易，仿佛上帝是可以被买到的一样。我不知道天主教内部在发生什么……


    **BERGOGLIO**：宗教领域有时存在一种倾向，即为神圣的保护付费，购买上帝，或者更准确地说，试图操控祂。上帝不参与这种关系。这种态度的人的祷告仅仅是自言自语。


    **SKORK**：问题在于，贿赂就像跳探戈舞——一方给，一方收。这不仅仅是信徒的问题，也是参与其中的神祭司的问题。


    **BERGOGLIO**：有一次，在 *uno a uno* 期间（字面意思是“一比一”），政府官员来到总教区（Vicariate），说他们有钱用于 1991
    年 3 月在阿根廷通过的货币法。该法律规定阿根廷货币的价值始终与美元保持等值。


    ⁴² 注：*Uno a uno*（字面意思是“一比一”）是该货币的名称。


    在某些事情上我很天真，但在另一些事情上，我这次发挥了作用。我开始询问他们对这个项目有什么打算，他们最后告诉我他们只给一半。由于地区区主教没有银行账户，而我告诉他们必须直接将钱存入教区，他们就消失了。归结到底，机构是由人建立的。


    ## 10. 关于死亡


    **BERGOGLIO**：上帝赋予生命。祂在这里赐予你，在下辈子也会赐予你。祂是生命的上帝，而不是死亡的上帝。在我们的神学解读中，有一个罪的片段。恶通过魔鬼的狡诈进入世界，正如我们所说的，魔鬼变得嫉妒，因为上帝让人变成了完美的生物。正是因为如此，魔鬼进入了世界。在我们的信仰中，死亡是人类自由的后果。我们由于自己的罪，那些选择了死亡的人，死亡进入世界是因为我们为违背上帝的计划留了空间。罪的进入……


    **SKORK**：在犹太教中，死亡有很多种解释。我们没有原罪的概念，相反，我们这样解释这种情况：在伊甸有两棵树，一个是智慧树，另一棵是生命树。基本上，它们是普通的树。智慧树并不是人们常说的苹果树；它更可能是无无花树，亚当和夏娃用它的叶子遮住自己⁴⁵
    导致犯诫的树也起到了遮掩的作用⁴⁴ 这些树是提醒，人类无法控制一切。但人类对罪有无数可能的解释——这不是一个教义问题。某些东西丢失了，但并不清楚是什么。人类灵性的部分死去了，但死亡已作为一种规律存在。我相信上帝创造人时，祂决定了人是有期限的。也许死亡有积极的一面。上帝所造一切都是为了世界的好。死亡不是一个容易的话题。悖论的是，它是生命最大的谜团，我们根据如何解决它来定义自己在地球上的旅程。如果我们相信一切都会随着死亡而结束——正如经文所说，我们归尘土⁴⁵——我们就不会去追求超越了；相反，我们将通过过享乐主义、自我中心和自私的生活关注当下。然而，人实际上像树。他必须完成一个周期——结出果实，然后让自己种下的种子产生新的周期。


