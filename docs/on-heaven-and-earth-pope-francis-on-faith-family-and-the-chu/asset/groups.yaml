    我在圣菲尔省仍有居住地，因为我在那里担任过教授。当我来到布宜诺斯艾利斯时，没有更改居住地，由于离那里有300多英里，所以我不打算投票。当我终于注册居住在布宜诺斯艾利斯时，我更改了居住地，但我仍然继续出现在圣菲尔的选民登记册上。在经历了这一切之后，我年七十了，不再有投票的义务了。67
    我不投票是否合适还有争议，但归根结底，我是众人的父亲，我不能被包裹在政治旗帜下。我意识到，当选举临近时，很难让自己从选举氛围中抽离出来，尤其是某些人甚至冲撞大教区的门，声称他们是最好的。作为神父，在选举之前，我让信徒们阅读政治政纲，以便他们能够做出选择。在讲坛上，我把自己照顾得相当好，我坚持要求人们去寻找价值观，别无他求。


    **SKORKA：** 我也建议每个人阅读政党政纲，并利用他们的分析能力来区分它们。主教先生，我并不担任一个像您这样完全暴露在政治风险中的职位，但当我被邀请参加政治人物的活动时，只要不带有任何选举色彩，我就会去。我相信这是尊重政治和国家的一种好方法。


    **BERGOGLIO：** 当然，参与政治生活是尊重民主的一种方式。


    **SKORKA：** 有时当国内发生某些具有政治色彩的事件时，我们会发布某种意见，而这种意见可能是批判性的。当出现与我们的价值观不相容的立场时，我们应该批评它——但要用宗教论证，而不是政治论证。由于我们谈论的是社会价值观，通常很难将两者分开——这是无法避免的。在一个名为《上帝是我的休息》$^{68}$的电视节目中，我强调了军事政权时期民主的重要性。那不是政治家会做出的批评。相反，那是一个拉比从他的宗教立场发出的批评。


    **BERGOGLIO：** 大写 P 的政治（Politics）与小写 p 的政治（politics）之间应该有区别。宗教神职人员采取的任何行为都是大写
    P 的政治行为，但确实有些行为会与小写 p 的政治混合在一起。宗教人士有义务传授价值观、行为准则、教育，或者在被要求时就特定的社会情况发表意见。2009年12月30日，我为克罗马农剧（Cromañón）事故五周年举行了弥撒。那是我本该说些什么的社会情况。有些情况是需要这样的，当出现严重偏差时。这并不是人们通过政治呈现在世界面前，而是通过所涉及的价值观，通过发生的悲剧。宗教神职人员有义务维护价值观；发生的情况是政治世界可能变得过度敏感：他们听取了一个牧师的话，他们就说他正在反对某人或某事。我们并不反对任何人；我们指的是面临危险且必须维护的价值观。媒体有时感染了“肝炎”（我这么说是因为它们的颜色发黄），它们会跳出来说：“对某某人的严厉斥责！”


    **SKORKA：** 有些政治家口口异舌——一方面他们要求宗教领袖不要发表意见，但在竞选期间他们又想要宗教神职人员的祝福。


    **BERGOGLIO：** 当我与政治家会面时，有些人带着善意而来，分享教会社会学的愿景，但另一些人只是为了寻求政治联系。我的回答总是一样：他们的第二个义务是彼此之间进行内在对话。第一个义务是成为国家、祖国主权的守护者。国家是地理维度，而民族是使社会关系成为宪法或法律层面。一个国家或民族可能会陷入战争，或被撕裂并重建。另一方面，祖国是开国父辈的遗产；它是我们从创立它的人那里继承来的。它是他们交由我们照顾的一系列价值观，但不是为了把它们关在锡罐里守护，而是为了让它们成长，并将它们推向应对今日挑战的乌托邦。


    一旦失去了祖国，就无法找回；祖国是我们的家。。有两个图像让我对祖国有很多感悟。一个是圣经式的：当亚伯拉罕离开他的土地，遵循上帝的道路，带上他身为偶像制造者的父亲。即便如此，他也没有切断自己的传统，而是通过启示净化了它。另一个图像更具西方色彩：当特洛伊被焚毁时，埃涅阿斯出发去建立罗马。祖国是将我们的父辈扛在肩上。带着他们留给我们的遗产，我们必须谈判现在，让它成长并将其推向未来。今天，政治家负责保护祖国，神权政治从未在这方面做得好。上帝赋予人类管理其国家、家园和民族进步的责任。宗教标示了伦理和道德准则，并开启了通往超越的道路。


    **SKORKA：** 主教，您用了一个关键词——真诚且有意义的对话。我们的国家的问题比其他任何问题都更是文化性的。阿根廷表现糟糕是因为缺乏对话。正如您所说，国家是领土，民族是提供秩序的法律结构，而祖国是过去的遗产。这一切都需要价值观的驱动。阿根廷的优缺点都是建立在一个宗教的框架之上的。尽管每个宗教传统都有不同的世界观，我们需要将他们都带到桌面上，与无神论者一起带上祖先，但正如著名的科兹克拉比所说，当一种真理模仿另一种时，它就不再是真理了。通过对话，我们必须创造自己的真理。宗教应该是与世界的接触点。我应该提到，我们很幸运没有神权国家，因为那会导致极端主义。每个国家都应该拥有民主的政府制度。我包括以色列，那里传统的犹价值观无处可见，是通过一个完全民主的政府制度实现的。这不容易，国家与宗教权威之间经常发生冲突。拉比法会有一种意见，最高法院会有另一种，国家必须试图说服那些有时非常严格且顽固的宗教权威，民主是正确的道路。通过对话，民主可以化解僵化的立场。

