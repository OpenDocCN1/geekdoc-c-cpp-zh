    ## 23. ON POVERTY


    SKORKA: All religions have a complete obligation with fighting poverty. Various
    parts of the Torah contain rules telling us that it is imperative to help the
    needy. The call of the prophets–especially the ones we call “Prophets of the Book”—Hosea,
    Amos and Isaiah–shows that one of the main points of their sermons was an absolute
    commitment to the poor.

