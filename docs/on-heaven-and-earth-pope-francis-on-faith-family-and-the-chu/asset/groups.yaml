    共同的挑战是避免受到物质主义的影响，尽管我们有不同的方式来解决同一个根源问题。


    **贝尔格奥：** 我想澄清一下：天主教神父在西方传统中是不结婚的，但在东方传统中可以结婚。东方的司祭可以在受命前结婚，但如果他们已经受命，就不能结婚。生活在信仰全然中的天主教信徒走的是你所说的那条路。他深陷于世俗之中，但没有被世俗精神所左右，这非常困难。现在，对于我们这些圣职人员来说又是怎样的？我们太软弱了，总会有产生矛盾的诱惑。人总是既要又要，既想要圣职生活的优处，也想要世俗生活。在进入神学院之前，我曾处于那条路上。但后来，当一个人培养对宗教生活的选择时，他会在那个方向找到力量。至少我是这样生活的，这并不排除在某一个时刻遇到一个女性的可能性。当我还是神学院学生时，在叔叔的婚礼上被一位年轻女性迷住了。她的美貌、理智的清醒让我感到惊讶……然后，嗯，我让这个念头在脑海里打转了一段时间。婚礼结束后回到神学院后，我整周都无法祈祷，因为每当我准备祈祷时，那个女人就会出现在我的脑海里。我不得不回去思考我在做什么。我仍然是自由的，因为我只是一个神学院学生，我可以回家说“再见”。我必须重新思考我的选择。我再次选择了——或者说允许自己被宗教之路所选择。这类事情发生是不常的。当它们发生时，人必须重新发现自己的位置。他必须看自己是重申选择，还是说：“不，我感受到的真的很美，我我以后可能不会忠于我的承诺，我必须离开神学院。”当一个神学院学生这样想时，我会帮助他平静地离开，这样他就能成为一个好的基督徒，而不是一个糟糕的神父。在我所属的西方仪式中，神父不能娶天主教拜占庭、乌克兰或希腊仪式的人。在这些教会中，司祭可以结婚；但主教不能，他们必须保持独身。他们是非常优秀的司祭。有时我取他们开玩笑，告诉他们家里有个女人，但他们没有意识到自己也给自己得了一个岳母。在西方天主教教会，这个问题已被一些组织讨论过。目前，教会对独身律规定保持坚定。有些人以某种务实主义的态度说，我们错过了更多的人手。如果假设西方天主教教会在独身问题上发生变化，我相信那将出于文化原因（像东方教会那样），而不是作为一种普遍的选项。目前，我支持维持独身，尽管它有其优缺点，因为十世纪以来，成功的经验远多于失败。发生的情况是，丑闻会被立即看到。但传统具有分量和有效性。天主教神父一点点选择了独身。直到1100年，都有人选择，也有人不选择。后来，在东方教会中，他们继续将不独身作为个人选择，而在西方则是相反。这是一个纪律问题，而不是信仰问题。它是可以改变的。个人而言，我曾想过结婚，但也有特殊情况。想想巴拉圭总统费尔南多·卢戈，他是个才华横溢的人，但作为主教他倒了并放弃了他的教区。在这个选择上，他是诚实的。有时有些神父也会陷入这种境地。


    **斯尔卡：** 你的立场是什么？


    **贝尔格奥：** 如果我的一位神父来告诉我他让一个女人怀孕了，我会听他的，并帮助他找到平静，一点点地帮助他意识到自然法在他作为神父的权利之前。因此，他必须离开神职工作照顾他的孩子，即使他可能决定不和那个女人结婚。因为正如孩子有权拥有母亲，孩子也有权拥有父亲的面孔。我承诺在罗马办理所有的手续，但他必须离开一切。现在，如果一个神父告诉我他动情了，³⁴，或者他犯了失误，我会帮助他纠正它。有些神父是可以被纠正的，另一些则不能。遗憾的是，有些人甚至不向他们的主教提出这个问题。


    **斯尔卡：** 你说的“纠正”是指什么意思？


    **贝尔格奥：** 指的是他们悔改，维持他们的独身。双重生活对我们没有任何好处，我不喜欢；它意味着欺骗。有时我会告诉他们：“如果你处理不了，那就做决定吧。”


    **斯尔卡：** 我想在坠入爱河的神父和恋童之间做一个区分，后者是完全不同的事情。


    **贝尔格奥：** 是的，我赞佩本铎禄二世在这一点上的勇气和直率。最近在爱尔兰，现任教皇曾说：“对此零容忍。”


    ³⁴ 编辑注：他的意思是性意义上的动情。


    **斯尔卡：** 在犹太教中，我们没有像教会那样的宗教等级制度。因此，每个会众都要独立监督自己的领袖。塔勒德文学中⁵有一句格言说：“尊重每个人，但也怀疑他们。”每个人都必须与自己的情感斗争，并可能犯错；因此，会众必须有某种控制机制，让拉比监督他们的信徒，反之亦然。当一个拉比被发现行为不当时时，如果过错严重，他应该被撤职。在拉比神学院，我们看到了你之前提到的神职人员类似的情况；有些人加入拉比阶的愿望源于心理问题。这就是为什么我们在申请过程中也会建立保密的心理档案。我们必须非常小心，不要让被赋予权力并允许成为会众精神领袖的人犯错。在2世纪70年代，曾出现过针对马尔科·梅耶⁶的指控，他是拉比神学院和巴拉圭保守派运动的创始人。我在他仍经历这一切时认识过他。没有人能否认他在阿根廷犹太社区以及整个阿根廷社会引发了一场精神革命。他在独裁政权时期通过促进人权使自己陷入危险。他致力于这项事业——探视监狱中的政治犯，帮助隐藏人员，并在国际上谴责军事政府的罪行。


    ⁵ Dere Eretz Rabba

    ⁶ 马尔科·梅耶是一位出生于美国的拉比，在阿根廷生活了二十五年。他创立了阿根廷的犹太保守派运动，在军事独裁统治时期，他激烈反对镇压。他探视政治犯并争取了其中一些人的自由，并在国际上谴责军事政府的罪行。他被总统劳尔·阿尔方斯辛任命为国家失踪人员委员会的成员。他获得了“圣马丁解放者”勋章，这是阿根廷政府授予外国人的最高荣誉。

