    ## 6. 关于门徒


    **贝尔戈利奥：** 在此此刻，我们应该提出的问题是，我们如何培养并促进那些决定走宗教道路的人成长。有些人认为，成为神父就是拥有一份教会职业。坦率地说，这种表达已经不再流行了，因为“职业”一词给人一种有阶梯的感觉，就像在做生意一样。相反，一切都源于某人被上帝的召唤、呼唤和触碰。我们的培养建立在四个支柱之上。第一支柱是灵性生活，修士者通过内心世界与上帝进入对话。为此，培养的第一年致力于理解并付诸祈祷生活，即灵性生活。之后，这一切会持续，但强度会所降低。第二支柱是指社区生活；我们甚至无法想象一种孤立的培养。在社区中被“揉捏”并在群体中成长是至关重要的。这样，一个人才能知道如何引导和管理自己。为了实现这一点，我们举办了座讨会。在任何社区中，都会出现竞争和嫉妒，这有助于敞开心扉并学会为他人留出空间。这些事情甚至在神学生的足球赛中也会显现。另一支柱是智力生活；神学生注册在神学系，那里有六年的学习。两年是哲学，作为神学的基础；随后是学者们发展的教义神学：其中解释了上帝、三位一体、耶稣和圣事。此外，还有圣经和道德神学课程。第四支柱就是我们所说的事传生活：神学生被分配到一个堂区，每个周末去协助堂区助理处理事务。在培养的最后一年，他们住在堂区。我们将这最后一年完全奉献视为美德和缺陷显现的机会。在那个时刻，他们性格和魅力中需要修正的问题开始变得更加清晰。我们说这四个支柱需要相互作用并相互影响。


    **斯尔卡：** 在犹太教中，要训练一个人成为拉比很容易，因为学生必须学习的原始文本是希伯语或阿拉米亚语，课堂也用希伯语授。此外，一旦神学生掌握了相当数量的基础知识，由于宗教领者的短缺，他们就会去担任拉比助理工作。当然，在我们的课程中，我们也有哲学、圣经、塔勒德、历史和圣经批判等科目。由于拉丁美洲拉比学院（Seminario
    Rabín de Latinoamericano）属于保守派运动，我们处理非常广泛的知识范围和来源解释。我们还学习各个时代的希伯语文学，以及与牧灵工作相关的课题，如心理学、社会学人类学。对我们非常重要的一点是，每个来学院学习的人都已大学毕业或正在攻读。


    **贝尔戈利奥：** 成为天主教神学生不需要大学学位。学位将在神学或哲学领域获得，但事实上，大学神学生拥有学位或有两三年工作经验的情况变得越来越普遍。我们看到，今天与以前不同，老年人也进入了神学院。情况要好得多，因为在布宜诺斯艾利斯大学，你会接触真实的生活、存在的不同观点、不同的科学方法、一种国际化的视角……这是一种脚踏实地的方式。


    > 32 犹太保守派教导，传统给出的习俗和法律必须遵守；然而，与非常传统的流派不同，它与科学发展保持着深度且充满活力的智力对话。


    **斯尔卡：** 这正是我们要求它的原因——为了让神职人员具有现实感。如果他们的学位是在人文科学领域就理想了，但这不是强制要求。我自己拥有布宜诺斯艾利斯大学的化学博士学位。人也可以通过上帝工作的完美来认识祂。我看到自己通过工作的完美来认识上帝。正如爱因斯坦曾说，我不认为科学与宗教之间存在冲突。对于我来说，这是一种脚踏实地的方式。


