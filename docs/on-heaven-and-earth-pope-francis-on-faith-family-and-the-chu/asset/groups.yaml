    Nevertheless, Arafat kept asking for more, and it all fell apart. Barak returned
    to Israel and had to resign because he failed to reach a peace agreement. Arafat,
    on the other hand, went home and was greeted as a hero. Of course there has to
    be a Palestinian state–there are people who identify with the Palestinian nation.
