    非常密切，但这些关系没有结果。如果说有什么的话，它们结出了苦涩的果实。我认为需要对话，但要保持距离。如果友谊仅仅建立在双方互相利用的基础上，它就不可能存在。我们必须能够在出现问题时，给内阁成员或文化部长打电话，但需要划一条清晰的界限。我知道在天主教内部，曾有像克里斯蒂安·德·韦尼奇（Christian
