  mdcn: '

    关于这一问题的观点。我认为我们都必须与自己作斗争，努力压抑我们的本能。那些认为衣着端庄、行为保守有助于他们保持尊严的人，这是可以的。风险在于，这种处理问题的方法可能被用作伪装，来掩盖混乱的态度。我个人认为，这种对简朴生活的渴望是源于严肃的反省。我认为，当一个男人或女人正度过非常艰难的时期，并寻求或接受来自异异的强力拥抱或吻时，这是一种始于并结束于那个特定情境的善意行为。


    ## 14. 堕胎


    **BERGOGLIO:** 堕胎的道德问题具有前宗教的性质，因为人类的基因代码在受孕一刻就已经存在了。那里已经是一个人类了。我将堕胎问题与任何宗教概念离开来。这是一个科学问题。不允许一个已经拥有人类基因代码的生命继续发育是不符合道德的。生命权是首要的人权。堕胎是杀害一个无法自卫的人。


    **SKORKA:** 我们社会的问题在于，我们失去了对生命神圣性的极大尊重。第一个问题是，我们谈论堕胎就像它不是什么大事，就像是世界上最正常的事情一样。事实并非如此。即使只是一个细胞，我们讨论的仍然是一个人类。因此，这个问题值得在一个非常专门的论坛进行讨论。我们经常发现的是，每个人都有意见，尽管他们被误导了，或者对该主题一无所知。


    总的来说，犹太反对它，但在某些情况下它是被允许的；例如当母亲生命受到危险时。堕胎在各种情况下是被允许的。有趣的是，在分析《万民法》时，这在《塔尔木德》中将成为“国际法”（jus
    gentium），古代犹太圣人裁定，在其他社会中应被绝对禁止。我的解释是，由于他们知道罗马正在发生什么，他们想避免在这样一个对生命尊重程度极小的社会中讨论堕胎问题。在《塔尔木德》中，可以找到对死刑主题的详尽分析。尽管惩罚出现在《托拉法》中，但也有圣人认为其使用应该受到限制，使其永远不会被付诸实施。根据他们当时面临的情况，每一代新人的圣人将决定适用该刑罚的标准。


    关于堕胎的历史也是类似的。当然，犹太教拒绝并反对它，除非像《米什奈》中所解释的那样，母亲显然面临死亡危险。在这些情况下，她的生命优先于一切。其他基于强奸、严重出生缺陷等的情况，是每一代拉比都讨论过的话题。存在一些更严格的立场，另一些则较不严格。“圣洁”这一因素——被理解为对所有形式人类生命的最高尊重和考量——是根本性的，并且应该是我们分析和讨论这一问题的基础和起点。


    ## 15. 离婚


    **BERGOGLIO:** 离婚问题与同性恋之间的婚姻是不同的。教会总是反对离婚法，但事实是，在这种情况下有不同的的人类学记录。在20世纪80年代，这是一个更具宗教色彩的辩论，因为“婚姻直到死亡”在天主教中是一个非常强大的价值观。尽管如此，今天天主教教义提醒那些再婚的离婚成员，他们并没有被逐出——尽管他们生活的状态处于了婚姻不可破性与婚姻圣事所要求的边缘——并且他们被要求融入到堂区生活中。正教教会在离婚方面有更大的开放度。在那场辩论中存在反对意见，但带有细微差别。存在并非所有人都支持的极端立场。有人说，最好不要批准离婚，但也有另一些人从政治角度对对话持开放态度。


    **SKORKA:** 在犹太教中，存在离婚制度，并根据“哈拉比法”（Halacha，即拉比法）应用规则。不用说，这是一件大事。这不是一个信仰问题，不像天主教中那样，天主教的立场源于对福音书的解读，书中说耶稣对离婚采取了非常强硬的，这与《塔尔木德》所证实的山麦派（Shammai）所采取的相似。在犹太教中，当婚姻无法维持时，只有在调和双方分歧付出了巨大努力后，夫妻才会被协助正式办理离婚手续。我用这些术语来介绍这个问题，是因为犹太教的拉比或拉比法并不“宣布”或“判定”双方的新身份，他们只是监督解体过程，确保按照规则进行。男人和女性宣布并承担他们的新身份，就像他们结婚时一样。这是由那两个人执行的私下行为，在精通法律的人士监督下进行，以确保执行正确。这就是为什么在上述辩论中我们没有产生很多冲突。在关于辅助生殖的辩论中也发生了类似的情况。犹太教支持它，因为它是一种帮助上帝让女性成为母亲的方式，减轻了那个人的痛苦。这是一个比天主教更灵活的立场。


    天主教在这些话题上拥有更强且更具限制性的立场。然而，当我们在民主社会的中环境中提出这些问题时，我们必须尝试达成共识。第一个原则是生命是神圣的。每一方都有自己的解释，但我们不能只是玩弄它。我们必须对生命所应得到的尊重相互尊重。如果我们不达成一致，我们就无法前进。


    ## 16. 关于同性婚姻


    **SKORKA:** 我认为过去对待同性婚姻的方式缺乏其应有的深度分析。虽然事实上已经有很多同性伴侣生活在一起，并在退休福利、继承等问题上需要法律地位，但如果创建一个新身份将是。然而，将同性伴侣与异性伴侣平等完全是另一回事。这不仅是信仰的问题，而是意识到我们正在讨论的是构成社会的组成部分。对于这个主题，仍然缺乏分析和人类学研究。同时，当然，我们应该给予更多的空间，因为他们是文化的携带和塑造者。


    **BERGOGLIO:** 宗教有权发表意见，只要它是为了人民服务。如果有人寻求建议，我有权提供建议。宗教领袖有时会关注私人或公共生活的某些点，因为他是信徒的导师。然而，他没有权利强加于任何人的私人生活。如果上帝在创造时承担了让我们自由的风险，我凭什么去干涉呢？我们谴责精神骚扰，即领袖实施指令、行为和要求的方式剥夺了人的自由。人们必须非常清楚地讨论价值观、限制和戒律。


    **SKORKA:** 犹太教有许多不同的教派。极端正统派有过多的规则——他们要求信徒以某种方式生活。社区领袖说“就是这样”，而且没有讨论的空间，所以最终他们干涉了人们的生活。另一方面，其他教派的拉比仅以教师的身份履行职责，这并不具有侵略性。可能会说：“律法是这样的，尝试根据传统做正确的事，”但仅此而已。

    '
