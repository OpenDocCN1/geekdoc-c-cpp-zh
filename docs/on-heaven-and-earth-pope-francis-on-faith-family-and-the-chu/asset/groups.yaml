    **SKORKA:** 我百分之百赞同。一方面，是我们通过民间智慧的分析听到的，或者在那种引发负罪感的犹太母亲的刻板印象中看到的——但这些东西与犹太基督教核心的“罪疚”概念毫无关系，因为当一个人犯错时，是可以救赎自己的。人们必须改变态度，以便不再犯下同样的错误。仅仅说“我错了”是不够的，故事就此结束了。当然，说祷告或进行诚心的慈善捐款是有帮助的，但只有当这源于对改变的真实渴望时才有效。当人们说宗教在玩弄犹太基督教关于减轻罪疚的概念时，他们表现出极大的不理解，因为我们相信犯罪并不是世界末日。虽然任何人都可以做错事，但我们确实认为这种情况必须得到修补和纠正。但最重要的是，它不应该再次发生。


    **BERGOGLIO:** 罪疚本身属于偶像崇的世界。它只是另一种人力资源。没有赎罪的罪疚无法让我们成长。


    **SKORKA:** 我认为罪疚并非纯宗教的感觉——它也是一种文化元素。每当我们告诉某人“不要这样做”或“不要做那样”时，我们就在强化罪疚感。我们让孩子意识到对错的区别，这就是我们帮助他们理解内疚的含义的方式，这种模式将驱动他们对惩罚和正义的认知。我们还坚持这样一个观点：正义不仅是人类交付的东西，而且有一天将与上帝进行账目清算。毕竟，是祂向我们揭示了律法——“不要偷窃”、“不要杀人”等。罪疚的概念必须存在，以便让我们知道如果某人做了破坏性的行径，他们必须对自己的行为负责。


    **BERGOGLIO:** 以前，诉诸“鬼怪”（Bogey）来恐吓非常普遍。今天，你可以告诉孩子鬼怪来了，他们会对着你的脸大笑。但在我们的童年，人们确实会对我们谈论鬼怪。恐惧只是一种夸张，是一种糟糕的教育方法。清教徒体系经常陷入这种其中。挑战在于将违规行为表现为一种让你远离上帝的事。看看圣奥古斯丁在谈论救赎和对上帝的爱时的说法；他在提到亚当和夏娃的罪孽时，称之为“快乐的过错”，我信了他的话。这就好像上帝在说：“我允许某些罪恶的发生，以便他们的脸写满羞愧。”因为这样他们就会找到仁慈的上帝。否则，他们只是那些很有礼貌但内心却有坏习惯的基督徒：骄傲的人。有时，越界让我们在主面前变得更加谦卑，并引导我们寻求宽恕。


    **SKORKA:** 我们再次达成了一致。罪的存在是为了教导我们并不完美。即使是那些说想要完美的人也不可避免地会犯错。他们应该犯罪，以此意识到他们不能单独战斗，让他们无论他们多么谨慎和有善意，偶尔都会感到挫败。自给自足会毁灭生命。


    # 9. 基础主义


    **SKORKA:** 拉比和神父应该是教师——指引道路、引导、并试图让人类更贴近上帝。“拉比”（rabbi）一词与教师是同义词。天主教教中神父的角色是什么？


    **BERGOGLIO:** 它是三重一体的：教师、上帝子民的引导者以及礼仪集会的主持，那里有祈祷和崇拜的空间。


    **SKORKA:** 你让人们贴近上帝的方式和我们犹太教的一吗？我们说：“我会通过教你经文中是怎么说的来帮助，但你必须想学。”


    **BERGOGLIO:** 教学的一部分也包括这一点：不能取代另一个人的决定。采取只当老板态度的神父（像在基础主义团体那样），会抵消并削弱那些正在寻找上帝的人。神父在教师的角色中，负责进行教导、提议被揭示的真理，并给予伴同。尽管他可能不得不见证失败，但他依然伴同。一个取消了门徒决策能力的教师不是一个好神父；他是一个好独裁者，剥夺了其他人的宗教人格。


    **SKORKA:** 这是一个非常重要的点，因为确实有一些犹太社区追随具有魅力和影响力的宗教领袖，在这些社区中，如果老师说某事应该做，就没有其他选择只能服从，即使这涉及到一个人最私密的决定。在今天这样一个极不确定的世界里，一切每分钟都在变化，许多人渴望某种是“真实的”的东西，即使它只是表面的；在不断变化的现实中某种可以依靠的坚实东西。关于上帝的某些真理我们只能自己发现。在犹太教和其他其他宗教中，人们可以找到规定他人如何生活的领袖，否认了本应从每个人身上发的宗教情感。天主教又是怎样的？


    **BERGOGLIO:** 教师呈现上帝的真理并指引道路。但如果是真正的教师，他允许门徒自己行走，并在精神生活中伴同他。


    **SKORKA:** 有多少真正的教师？他们的人数最近增加了吗？


    **BERGOGLIO:** 是的，一些小的复兴派一直在继续增加；我称他们为基础主义者。正如你所说，在这一堆不确定面前，他们告诉年轻人：“这样做，那样”。所以，在这些不确定面前，他们告诉年轻人……诚实说，一个十七岁或十八岁的男孩或女孩由于他们感到兴奋并推着他们，他们并没有准备好应对各种危机。例如，这种僵化的虔徒心剥夺了人们的自由，让他们无法成长。许多人过双重生活。


    **SKORKA:** 再次，我们达成了一致。罪的存在是为了教导我们并不完美。即使是那些说想要完美的人也不可避免地会犯错。他们应该犯罪，以此意识到他们不能单独战斗，让他们无论他们多么谨慎和有善意，偶尔都会感到挫败。自给自足会毁灭生命。


