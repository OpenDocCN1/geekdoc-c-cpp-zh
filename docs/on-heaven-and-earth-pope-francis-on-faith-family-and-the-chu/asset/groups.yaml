    have increased tremendously. What we have is a sick Argentina. It pains my soul–our
    situation completely different. I am saying this without supporting any particular
    party and with the firm belief that at some point leaders will emerge that will
    be capable of changing the situation back to the ways used to be.


    **BERGOGLIO:** A few years ago, the French Bishops wrote a pastoral letter whose
    title was “Rehabilitating Politics.” They realized that they had to restore politics
    because it was losing all credibility, and I believe that the same is true for
    us. The loss of credibility in the political arena must be reversed because politics
    is a very elevated form of social charity. Social love is expressed in political
    activity for the common good. I was born in 1936, I was ten years old during the
    emergence of Perón, but my mother’s side of the family has roots in the radical
    party. My mother’s father was a carpenter, and once a week a man with a beard
    would come and sell him aniline dyes. He stayed for a while chatting on the patio
    while my grandmother served them a cup of tea with wine. One day my grandmother
    asked if I knew Don Elpidio, the aniline salesman, was. It turns out that he was
    Elpidio González and had once been the vice president of the nation. That image
    stuck with me that this ex-vice president earned his living as a salesman. It
    is an image of honesty. Something has happened to our politics, it is out of ideas,
    out of proposals . . . They have shifted ideas of political'
