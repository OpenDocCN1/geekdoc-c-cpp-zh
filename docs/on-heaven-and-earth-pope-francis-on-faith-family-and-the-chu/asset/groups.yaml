    # 23. ON POVERTY


    SKORKA: All religions have a complete and absolute obligation with regards to
    fighting poverty. Various parts of the Torah contain rules telling us that it
    is imperative to help the needy. The call of the prophets–especially the ones
    we call “Prophets of the Book”—Hosea, Amos, Micah and Isaiah–shows that one of
    the main points of their sermons was an absolute commitment to the poor. The way
    in which we honor G-d is by creating a just society, and that implies building
    a society where everyone can live with dignity. One of the basic theories that
    appears in sacred literature is that there cannot be a society, a town or a nation–and
    I would add a State–that lacks a strong ethical component and a commitment to
    people at every level of society. The obligation to help the widow and the orphan
    is repeated over and over again in biblical literature.'
  - '[PAGE 187]


    Jewish communities have a tradition of forming aid societies for those who need
    something to eat. In Argentina, the work of community assistance programs developed
    by the AMIA in conjunction with many other Jewish institutions is well-known.
    There has always been a commitment to help the needy. All the biblical writings
    regarding property rights try to guarantee that people do not accumulate vast
    estates—that each family has enough land to make a living and at the same time
    setting rules the land that protect it from overuse. According to the Torah, every
    plot should be farmed for six years and it should rest during the seventh in order
    for nutrients to be restored to the soil. With regards to Argentina specifically,
    the country has always reacted to the poor in times of crisis. Many sectors of
    our society have a deep-rooted custom of providing assistance to the poor. I remember
    when I was in elementary school there had been huge floods and I brought in blankets
    and boxes of clothes for the people who were affected by them. My family was very
    involved in helping out even though we were not very well-off. Our community has
    a history of providing assistance to both Jews and non-Jews. In my synagogue,
    Benei Tikva, we collect clothes to send to schools in Santiago del Estero and
    Pampa del Infierno in Chaco. It is heartbreaking to know that we are trying to
    help out while much of the rest of the country does nothing. It is not right that
    there are children who cannot go to'
- md: '

    school because they have no shoes to wear to get them there. We do not perform
    miracles; we are just trying to do what we can. After all, we are commanded to
    do so by the Bible, which says that a man cannot stand idly by while his brother
    suffers. I would also like to add something else—I would suggest that the Jewish
    people have been deeply committed to every struggle for human freedom and equality
    that the Western world has ever known. For example, during the Russian Revolution,
    the Jews had a huge interest in the outcome since it was all about an exploited
    class. They thought that through the revolution a solution would arrive for all
    of their suffering and hardship as Jews. We do not have to go far back in history
    though. The percentage of Argentinean Jews that acted out of idealism during the
    social liberation movement of the seventies was much higher than the percentage
    of Jews in society as a whole. There were always Jews involved in the Communist
    and Socialist parties as well as all the other movements that sought to advance
    the demands of the lower classes. Even in the atheist Jew there remains the ancestral
    command to fight not only for one''s own well-being. If another person is having
    a hard time, he also has to fight for him. Even if I am doing all right, it is
    not good enough if there are those who are not—we should all live with dignity.


    BERGOGLIO: Christianity inherited the Jewish verse from Isaiah: Do not “[turn]
    your back on your own flesh.”83 The key is to be found in the parable of the Final
    Judgment, when the king places some people on his right and some on his left (the
    good and the evil, respectively). To those on his right he says: “Come, blessed
    of my Father, for I was hungry and you fed me; I was thirsty and you gave me drink;
    I was naked and you clothed me; I was sick and you visited me.”84 They ask Him
    when it was that they did this and He answers that every time they did to the
    least of His kingdom, they did it to Him. The others, those who did not do so,
    are condemned.


    In Christianity, the attitude we must have toward the poor is, in its essence,
    that of true commitment. And He added something else: this commitment must be
    person to person, in the flesh. It is not enough to mediate this commitment through
    institutions, which obviously help because they have a multiplying effect, but
    that is not enough. They do not excuse us from our obligation of establishing
    personal contact with the needy. The sick must be cared for, even when we find
    them repulsive and repugnant. Those in prison must be visited . . . It is terribly
    difficult for me to go to a prison because of the harshness of life there. But
    I go anyway, because the Lord wants me to be there in the flesh, alongside those
    in need, in poverty, in pain. The first attention we pay to poverty is assistance:
    “Are you hungry? Here, here is something to eat.” Our aid cannot end there. We
    must build toward human promotion and integration in the community. The poor must
    not be perpetually marginalized. We cannot accept the underlying idea that “We
    who are doing well give something to those who are doing badly, but they should
    stay that way, far away from us?” That is not Christian. It’s indispensable that
    we integrate into our community as soon as possible, through education in technical
    schools . . . So that they may get ahead in life. This concept was dominant at
    the end of the nineteenth century in the schools created by Don Bosco for all
    of the destitute children he gathered into his oratory. Don Bosco thought that
    it made no sense to send them to public high school because it would not have
    helped them get ahead in life, so he created technical schools. Something similar
    is being done by the priests of the shantytowns of Buenos Aires. They seek to
    give kids, with a couple years of apprenticeship, the means they need to change
    their lives, to become electricians, cooks, tailors . . .


    We have to help them earn a living. What is degrading to the poor is not giving
    them the oil that anoints them with dignity: a job. A poor man must not be looked
    at with disgust; he must be looked at in the eyes. Sometimes it may be uncomfortable
    but we have to be up to the task. The great danger—or great temptation—when aiding
    the poor, is falling into an attitude of protective paternalism that, at the end
    of the day, does not allow them to grow. A Christian’s obligation is to integrate
    the most deprived into his community in whatever way possible, but definitely
    to integrate them.


    **SKORK**: After listening to what you have said, I would point out something
    else of interest—the idea of bringing people together is a reflection of the Torah’s
    message. Everyone needs to be included. We have also created schools for the purpose
    of helping people out. Russia gave birth to the ORT schools, which at first also
    happened to be focused on the arts and trade. When they were founded they were
    meant for the poor, although now things have changed a bit. Although perhaps today
    it is more for the middle class and not a school for everyone, the underlying
    message remains that work brings dignity—it provides one with a profession so
    that he is able to face life’s challenges.


    **BERGOGLIO**: Christian charity is the love of God and neighbor. It can begin
    with aid, but it cannot stop at fundraising events. There are things that are
    called works of charity. There are things that are called works of charity, but
    it cannot stop at fundraising events. There are things of charity that are not
    a good intention. There is no charity without love, and if vanity is part of the
    needy, there is no charity.


    **SKORK**: I define charity as assistance that is urgently needed. In the biblical
    lexicon however, there is another concept that makes reference to helping the—tzedakah.
    The rabbis interpreted it as a tax we should pay. It is a word that has the same
    root as tzedek, which means “justice.” This is where it seems that any society
    with people in need is intrinsically unjust and through tzedakah we can try to
    correct this failure, at least in part. Another concept that we find in Talmudic
    literature is gemilut hasadim, which can be translated as “acts of loving-kindness.”
    It refers to the assistance one gives to his fellow man, whether by giving money
    or through action, whether rich or poor, living or dead; for the latter, making
    sure they are properly buried. Every act of tzedakah should be performed with
    mercy. I believe that Christian charity combines both of these concepts in a similar
    way.


    83 Isaiah 58:7

    84 See Matthew 25:31–46

    85 See Luke 10:37

