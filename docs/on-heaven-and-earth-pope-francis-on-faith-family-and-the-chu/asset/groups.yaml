    但我也意识到并非所有的档案都经过审查。此外，你说得对：约翰二十三世直到去世前一刻，仍然是一个乡村农民。在临终前，他的姐姐在他头上敷上浸过醋的冷毛巾，就像他们在乡下所做的那样。


    **SKORKA:** 庇佑十二世对犹太-基督教对话并不感兴趣。事实上，他很反感这种对话。二战后，教会有一些成员努力改变这种态度。这种变化直到约翰二十三世成为教皇才开始。据说，当他收到世界犹太大会的代表团访问时，他张开双臂说：“我是你们兄弟约瑟。”这就是约瑟在与兄弟们和好时使用的那句话。显然，情况并非一直如此。由于各种原因，过去一直存在着某种敌意。有些书籍记录了过去二十世纪以来，不同基督教教派内部存在的反犹太情绪。曾有牧师反对反对我们，而也有牧师维持着真实且非常尊重的对话。历史上也曾出现这样的时刻，人们挥舞十字架，煽动当地民众进行屠杀和其他残暴行为。20
    世纪 20 年代和 30 年代，阿根廷有一些自称天主教的杂志，宣扬对犹太人的仇恨。


    至于现在，我认为我们正在进行的这种对话的意义在于打破这些恶性循环；开启一个全新的开始，并提醒我们共同的遗产。如果某些人认为耶稣是化身成肉的神，而我们说上帝不会这样做，因为没有人类能以肉体形式代表上帝，这种差异并不是产生仇恨或怨恨的理由。总有一天我们将知道真理，在此期间，我们可以也应该共同努力。我们的伦理基础有许多团结我们的共同点。


    人们可以很容易将福音书所说的与塔木德圣贤的观点联系起来。历史上的反犹太主义很大程度上是为了机会或政治原因而煽动的仇恨。例如，在俄罗斯，当亚历山大二世被杀时，犹太人被了罪，随后教会被出于政治目的煽动群众。这一点毫无疑问，是一个被证明的事实。现在的问题是，“我们如何重新开始？”如果两种宗教想要同样的东西——一个和平的世界，那么每个都必须采取自身传统中的优秀部分并与对方保持同步。我们可以帮助彼此建设。亚伯拉罕·耶胡达·赫舍尔在纽约联合神学学院（一家新教机构）发表的开学演讲被称为“没有一种宗教是孤岛”。我们不能像二战前那样被拆散分离。我们的信息必须是通用的，且为了所有人的利益；不是为了追求彼此身份的改变，而是为了拉近我们的距离，让我们彼此更加接近。


    **BERGOGLIO:** 第二次梵蒂冈会议有一句至关重要的话：它说上帝向所有人显现了自己，并首先拯救了选民。由于上帝对他的承诺是忠诚的，他没有拒绝这些承诺。教会正式承认以色列民族仍然是选民。没有任何地方写着：“你们输输了比赛，现在轮到我们了。”这是对以色列民族的认可。我认为，这是第二次梵蒂冈会议关于这一主题最勇敢的表态。此外，犹太人民不再被指控杀杀了上帝，他们过去很长一段时间内都是这样。当一个人阅读受难记时，这一点是很清楚的。这就像如果所有的阿根廷人都被归罪于特定的政府一样。


    **SKORKA:** 实际上，当时的政府甚至不在犹太人手中。本丢·彼拉和罗马人才是做政治决策的人。在耶稣被钉在十字架上方，他们写下了缩写 INRI，意为“犹太人的王”。如果他确实是犹太人的王，那意味着他正在破坏罗马权威的基础。此外，十字架并不是犹太人在判处死刑时采用的刑罚。而且在当时，公审会议已经停止判处死刑了。即使事实相反，他们也无法在逾越节期间执行。即使当时有一些著名的犹太人说耶稣不是上帝之子，那么在许多代人之后，任何人又有什么权利指责他们的后代呢？


    **BERGOGLIO:** 确实，你不能谈论一个杀了上帝的民族，但我不想跳过我们开始讨论的话题。你说在阿根廷也有——而且现在还有——教会的反犹太主义。我没有像若望二世那样的经历，他在学校里有一半的同学是犹太人，但我也有、并且一直有犹太朋友。也许其中某一个被称为“俄罗斯人”，正如我们小时候对[犹太人]称称那样。我从未和他们中的任何人都产生过任何问题。确实像过去一样，有反犹太的天主教徒，但并没有
