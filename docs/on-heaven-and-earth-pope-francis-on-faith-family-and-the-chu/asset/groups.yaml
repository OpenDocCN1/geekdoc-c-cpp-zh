    **SKORKA:** I agree 100 percent. One thing is what we hear analytically through
    folk wisdom or see in the stereotype of the guilt-inducing Jewish mother—but these
    things have nothing to do with the essential Judeo-Christian concept of guilt,
    because when one commits a sin it is possible to redeem oneself. People have to
    change their attitude so that they do not commit the same sin again. It is not
    enough to say, “I was wrong,” and that is the end of the story. Of course it helps
    to say a prayer, or make a heartfelt charitable donation, but only when it is
    the result of a sincere desire for change. When people say that religions play
    around with the Judeo-Christian concept of relieving guilt, they show an enormous
    lack of understanding, because we believe that committing a sin is not the end
    of the world. While anyone can do the wrong thing, we do believe the situation
    has to be fixed and put right. But most importantly, it should not happen again.


    **BERGOGLIO:** Guilt by itself belongs to the world of idolatry. It is just another
    human resource. Guilt, without atonement, does not allow us to grow.


    **SKORKA:** I do not believe that guilt is a feeling that is solely religious—it
    is a cultural element as well. We reinforce feelings of guilt anytime we tell
    someone “Do not do this” or “Do not do that.” We make children aware of the difference
    between right and wrong, and that is how we help them understand what it means
    to be guilty, a model that will drive their notions of punishment and justice.
    We also adhere to the idea that justice is not only something delivered by man,
    but that one day there will be a rendering of accounts with G-d. After all, He
    is the one who revealed the commands to us—“Do not steal,” “Do not murder,” etc.
    The concept of guilt needs to exist in order for us to know if someone does something
    destructive, they will have to account for their actions.


    **BERGOGLIO:** Previously, it was very common to resort to the Bogey. Today, you
    can tell a child that the Bogeyman is coming and they will laugh in your face.
    But in our childhood we spoke to us about the Bogeyman. Fear is only an exaggeration,
    a bad method of education. The Puritan system fell into this quite a lot. The
