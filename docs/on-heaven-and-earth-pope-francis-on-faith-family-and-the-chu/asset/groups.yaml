    Syria–and that this pact will be a blessing for the entire world. We have to change
    the terms of the discussion; we have to change what I call “disgraceful politics”
    into a desire for greatness. Religious themes are often invoked in a twisted form
    and in the most harmful way. There have already been so many people killed, and
    atrocities committed, in the name of G-d, something that we have mentioned in
    many of our previous talks. As you said, people were killed here in 1955 in the
    Plaza de Mayo. Today, in the Middle East, people are constantly killing each other
    in G-d’s name. This situation can only be turned around if both parties have a
    desire to rise above themselves–when people no longer want to take the crusts
    of stale bread away from their neighbors and others no longer want to destroy
    their neighbors because they live better. Why not transform the Gaza Strip into
    the Hong Kong of the Middle East? Why not convert it into a place where its people
    can live very well? What matters is the life of each individual and that a Jew
    has as much right to live as a Palestinian; but the Palestinian also has to understand
    that I am not talking about the men in the street, but their leaders; the ones
    who think that by destroying others they are doing a great deed by which they
    will be remembered for eternity. All types of extremism are bad and any group
    of people that thinks it should rule the world is evil. Sometimes I think about
    why G-d had to make the world round, and the answer I come up with is that every
    point on the globe is equivalent. There is no point more important than the other—they
    are all the same.


    **BERGOGLIO:** You moved from giving a political explanation about a particular
    juncture to a discourse full of wisdom about human relationships. I recall a conversation
    that I had a long time ago with an older person who was going through an intense
    spiritual moment, and reviewing his life in a certain way, he told me that he
    had a family problem that he had not been able to resolve. “It is one of the failures
    of my life maybe because I never found the way,” he told me. That phrase has stuck
    with me. Sometimes, human relationships can be resolved if there are people who
    help find the way, because when one has a problem only a mountain can be seen
    ahead and nothing else. Somebody has to say, “It would be better if you go over
    here, or try over there.” When I have a problem with someone, it helps me to have
    the same attitude that the Egyptian monks had at the beginning of Christianity.
    They accused themselves so they could find a solution; they put themselves in
    the defendant’s seat to see what things were not working well inside of themselves.
    I do it to observe how things are not working well inside of me. This attitude
    gives me the freedom to, later, be able to forgive the fault of the other person.
    The mistake of the other person does not need to be emphasized too much because
    I have my own mistakes and both of us have failures. The harmony between people
    is made by searching for ways; that is what I thought that you were underlining
    behind your reflection, Rabbi. That is the manner to resolve animosities.


    **SKORKA:** Culturally, we are living at a time when the media has a huge impact.
    They argue about every topic as if it were a soccer match. Things are not so black
    and white—they are much more complicated—but they deal in fanaticism and make
    false and superficial arguments. The only thing they aspire to do is focus on
    the latest headlines and create sensations. On the other hand, most thought-provoking
    books that deal with political or social issues are written using highly technical
    language or in philosophical terms that are over people’s heads. Then there are
    a lot of very capable people who use their shrewdness to argue their positions
    with lots of passion, but the truth can only be attained through humility and
    they lack the necessary restraint. The media has gotten accustomed to presenting
    the Israeli-Palestinian conflict this way.


    **BERGOGLIO:** the media’s way of putting things, in black and white, is a sinful
    tendency that always favors conflict over unity. You spoke of humility, which
    is what levels the paths for an encounter; favoring conflict only puts obstacles
    in the path, and the Spirit of God manifests itself in that leveling. Georg Hel
    beautifully took up that issue in the beginning of The Messiah, in the baritone
    with the text from Isaiah: "Every valley shall be lifted up, every mountain and
    hill made low" so that the path shall be flat, to prepare the path to salvation.
    To search for ways is a prophecy toward unity. What you said about the media,
    I would extend to all those that highlight conflict, to those that speak in black
    and white. Today, there is misinformation because only part of the truth is said,
    only what interests them is taken for their convenience, and that does a lot of
    damage because it is a way of favoring conflict. If I read five newspapers, comparing
    the same story, it is very often that each one will emphasize the part it are
    most interested in according to its inclination.


    **SKORKA:** I have been thinking about the issue of conflict... When I read Freud,
    what I like about it he says is that man needs to resolve his conflicts and the
    way in which he does then determines what he will actually do. A doctor could
    not practice his profession if he did not have some level of aggression, because
    to take up a scalpel-or perform the simple acts of giving an injection or taking
    blood-is somewhat violent by nature. What happens is that the doctor channels
    it into something positive. It is important to study what each person does with
    their aggression and destructive tendencies. I believe-and this is not Freud’s
    invention but something that already appeared in the rabbinical texts more than
    two thousand years ago-that we have good inclinations and evil inclinations, and
    the idea is to know how to take these evil inclinations and try to transform them
    into something positive. When conflicts are not resolved with this mind, we get
    the world we are living in today, because the aspect of humility is lacking. Moses
    got to be the most important prophet for various reasons, but principally it was
    because he was the most humble of men.


    **BERGOGLIO:** Conflict is present in the first few pages of the Bible. We have
    the case of Adam and Eve who are expelled from the Garden of Eden, and there is
    also the drama between Cain and Abel and later the conflict of the Tower of Babel
    or the conflict of Rebecca with Esau and Jacob. During Jesus’ life, his disciples
    created tension all the time. This means that in advancing the resolution of a
    conflict with the virtues of all, without nullifying the diverse traditions or
    falling into syncretism. Each one, from their identity, in reconciliation, and
    seeking the unity of truth.


    **SKORKA:** Man lives in conflict, wherein lies his greatness, and his possible
    downfall. There is a place in the Talmud that says that man has both angelic and
    animalistic traits. The angels are completely spiritual beings but they do not
    have free will as they simply comply with G-d’s commands. Man, on the other hand,
    does have free will, animal traits and spiritual traits. These characteristics
    are in constant conflict with each other.

