  - '[PAGE 247]


    have been various attempts to re-create the great empires of old, sooner or later
    they collapsed and fell apart like Yugoslavia, which continues to break itself
    up into smaller pieces. I understand the parochialism that I am talking about
    to mean that everyone goes back to their roots. Now, we cannot know if this new
    situation will allow us to achieve peace, or at least lead to a state of not being
    at war. There is no way to know if selfish or hidden motives are to prevail. What
    the prophets tell us—and of this I am sure—is if we can get to a situation where
    dialogue predominates over small-minded interests, religion will flower, regardless
    of the level of parochialism.


    BERGOGLIO: If one looks at history, the religious forms of Catholicism have varied
    notably. Let us think, for example, of the Papal States, where temporal power
    was united with spiritual power. It was a deformation of Christianity, it did
    not correspond to what Jesus wanted and what God wants. If, throughout history,
    religion evolved so much, why wouldn’t we think that in the future it will adjust
    to the culture of its time? The dialogue between culture and religion is essential,
    as it was proposed by Vatican II. From the beginning, the Church has asked for
    a continuous conversion—Ecclesia semper reformaanda—and that transformation takes
    on diverse throughout time, without altering dogma. In the future there will be
    different ways of adjusting to new periods, just as today there are different
    ways from the times of regalism, of jurisdiction-'
