    ## 28. 关于跨宗教对话


    **SKORKA：** 一位曾曾在马德尔普拉塔向我指出，有些宗教没有参加我们的国家庆典，尽管我开始意识到这是一种传统，但它仍然可以改变。这句话留在了我的脑海里。


    **BERGOGLIO：** 我不知道你是否记得，当我担任主教开始举行感恩圣弥（Te Deum Masses）时，我随总统公一同一同，我们送他到门口。你们所有人，作为其他信仰的代表，都会站在原地，像展览里的木偶一样。我改变了这一传统：现在总统走上去问候所有其他信仰的代表。这是向你所建议的方向迈出的一步。自2009年萨尔塔的感恩圣弥以来，仪式被分为两个部分：不仅举行了传统的、经典的歌曲和圣体仪式，以及讲道和天主教祈祷，其他信仰的代表也加入了自己的祈告。现在参与度更高了。


    **SKORKA：**对我来说，这些姿态意义重大；这是展示跨宗教对话性的一种。


    **BERGOGLIO：** 你在这个领域的工作非常重要；我没有忘记你曾两次邀请我去犹太教堂祈祷和演讲，我也邀请你向我的神学生们讲解价值观。


    **SKORKA：** 你的态度也非常重要且勇敢，因为机构内部一定有人并不认同你的这种观点。


    **BERGOGLIO：** 第一次福音派邀请我参加他们在卢纳公园（Luna Park）的一场会议时，体育场座无虚席。那天，一位天主教神父一位福音派牧师发表了演讲。他们各做了两次，穿插进行，中午期间休息了休息吃了一些三明治。在某一个时刻，福音派牧师请求大家为我和我的事工祈祷。他曾问过我是否愿意接受他们为我祈祷，我回答说当然愿意。当他们祈祷时，我脑中出现的第一个念头是跪下，这是一个非常天主教式的姿态，以接受他们的祈祷和现场七千人的祝福。下周，一家杂志的标题写道：“布宜诺斯艾利斯教位真空。主教犯了叛教之罪。”对他们来说，与他人一起祈祷就是叛教。即使面对一个无神论者，带着他的怀疑，我们也可以一起仰望寻找超越性；每个人按照自己的传统祈祷。这有什么问题呢？


