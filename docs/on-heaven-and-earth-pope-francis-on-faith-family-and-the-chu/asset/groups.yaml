    # 9. ON FUNDAMENTALISM


    **SKORKA:** Rabbis and priests should be teachers-pointing the way, leading, trying
    to bring man closer to G-d. The word *rabbi* is synonymous with teacher. What
    is the role of the priest in Catholicism?


    **BERGOGLIO:** It is threefold: teacher, guide of the people of God and president
    of the liturgical assembly, where there is a place for prayer and adoration.


    **SKORKA:** Is your way of bringing people closer to G-d the same as ours in Judaism?
    We say, “I will help by teaching you what it says in the texts, but you have to
    want to learn?


    **BERGOGLIO:** Part of teaching also includes this: One cannot replace another
    person’s decision. The priest who adopts an attitude of only being a boss, like
    in fundamentalist groups, nullifies and emasculates those who are searching for
    God. The priest, in'
  - '[PAGE 91]


    his as teacher, instructs, proposes the truth as it is revealed, and accompanies.
    Though he may have to witness failure, he accompanies. The teacher nullifies the
    decision-making for his disciple is not a good priest; he is a good dictator,
    denying others their religious personalities.


    SKORKA: That is a very important point because there are Jewish communities that
    follow charismatic and influential religious leaders wherein if a teacher says
    something should be done, there is no other alternative but to comply, even when
    it has to do with a person’s most intimate decisions. In today’s world where there
    is such terrible uncertainty, where everything changes from one minute to the
    next, many people crave something that is “true,” even if it is merely superficial;
    something solid to hold on to in in the midst of an ever-changing reality. There
    are certain truths with respect to G-d that we can only find by ourselves. In
    Judaism, as in other religions, one can find leaders that dictate how others should
    live, denying the religious feelings that are supposed to emanate from each person.
    What goes on in Catholicism?


    BERGOGLIO: The teacher presents the truth of God and shows the path. But if he
    is a true teacher, he allows the disciple to walk and he accompanies him in his
    spiritual life.


    SKORKA: How many authentic teachers are there? Have their numbers multiplied recently?


    BERGOGLIO: Yes, some small restorationist fac-'
