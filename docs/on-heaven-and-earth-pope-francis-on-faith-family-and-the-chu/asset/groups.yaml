    更糟糕的剥夺——我想强调这一点——比无法自食其力、比被剥夺工作的尊严更糟糕。有一个轶事可以帮助我们理解教会对这一问题的良知：在罗马的多次迫害之一中，一位名叫劳伦斯（Laurence）的执事奉皇帝命令交出教会的宝藏。在指定的日子，劳伦斯来到皇帝面前，带去了一群穷人。他说：“这些就是教会的宝藏。”这是我们必须保护的范式——无论作为一个大机构还是一个小社区，每当我们放下它时，我们都在否定自己的本质。我们为自己人的软弱感到自豪，为那些我们帮助他们取得进步的人感到自豪。穷人是教会的宝藏，我们必须照顾他们。如果我们失去了这种愿景，我们将拥有一个平庸、软弱且暗淡的教会。我们真正的力量必须是服务。如果我们的精神不包含贫困者，我们就无法崇拜上帝。我想我们在这上达成共识。


    SKORK：完全如此。当一个犹太人带着初果来到耶路撒冷的圣殿时，他在那里为此感谢神。正如《申命记》第26章所说，在那刻必须说：“我的父亲是一个流浪的亚兰人，不得不下埃及，”因为他饥饿了。⁸⁶
    这些话让我们我们思考贫困。今天，犹太人和基督徒共同分担帮助穷人的工作。在贫民窟工作的佩佩神父（Father Pepe）和阿夫鲁赫拉比（Rabbi Avruj）之间存在着伟大的合作精神。即使我们这些拉比在自己的会区中有很多工作要做，我们仍花部分时间来帮助那些敲门的贫困者。我们的人并不多，所以我们没有一个大型组织能让我们去寻找那些需要帮助的人，或在贫民窟和棚户区有更广泛的参与。当一个拉比去棚户区提供援助时，不仅仅是为了帮助犹太人。我们不进行传教；这是帮助我们同胞的真实承诺。由于我们是一个小社区，我们缺乏的是那些可以投入定期前往贫民窟提供更深入支持的人员。人口统计对我们能做的事情有很大影响。牧师监督一座新教堂的建设，而社区90%的人都是基督徒，这是一回事；而建造一座犹太会堂是另一回事，因为犹太人并没有如此大的规模。


    BERGOGLIO：从历史角度看，棚民窟神父们是阿根廷一个较新的现象。它可能始于四十年前，扎根非常困难，因为对于教会的层级结构来说它是新事物。它还必须从政治动机中纯化，因为有时宗教与政治被不当地结合，这导致了不信任。只要参与这项工作的神父能够通过大众虔诚更好地定义他们对教会的归属，他们就为高层带来了更加亲近和理解的态度。当时如何，布宜诺斯艾利斯主教被指控对棚民窟的神父们有优待。这不是一个新现象：在意大利，波斯神父（Don
    Bosco）与最谦卑的人一起工作，引发了主教们的不信任。更不用卡法索神父（Don Cafasso）和奥里翁神父（Don Orione）了。他们是援助工作的先锋。在某种程度上，他们迫使当局发生了改变。在这里，棚民窟的神父也引起了心态的改变和教会社区行为的改变。


