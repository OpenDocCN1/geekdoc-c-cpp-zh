    ## 14. ON ABORTION


    **BERGOGLIO:** The moral problem with abortion is of a pre-religious nature because
    the genetic code of the person is present at the moment of conception. There is
    already a human being. I separate the issue of abortion from any religious concept.
    It is a scientific problem. To not allow further progress in the development of
    a being that already has the genetic code of a human being is not ethical. The
    right to life is the first human right. Abortion is killing someone that cannot
    defend himself.


    **SKORKA:** The problem with our society is that we have lost a great deal of
    our respect for the sanctity of life. Problem number one is that we talk about
    abortion as if it were no big deal and the most normal thing in the world. It
    is not. Even if it is only a cell, we are still talking about a human being. Therefore,
    the issue merits a very special forum for discussion. What we often find is that
    everyone has an opinion, even though they are misinformed, or have no knowledge
    of the subject.


    In general, Judaism condemns it, but there are situations where it is permitted;
    when the mother''s life is in danger, for example. Abortion is allowed in various
    circumstances. What is interesting is that in analyzing the Law of Nations, that
    would become jus gentium in the Talmud, the ancient Jewish sages ruled that it
    should be absolutely prohibited in other societies. My interpretation is that
    since they knew what was being done in Rome, they wanted to avoid a discussion
    of abortion where Jews were living in a society with such little respect for life.
    In the Talmud one can find an exhaustive analysis on the topic of the death penalty.
    Even though the punishment appears in the Torah, there are also sages who opined
    that its use should be restricted that it would never actually be carried out.
    Depending on the situation they are faced with at the time, the sages of each
    new generation will decide the criteria for which the penalty is applied.


    The history regarding abortion is similar. Of course Judaism rejects and condemns
    it, with the exception of when the mother is clearly in danger of dying as explained
    in the Mishnah. In those cases, her life comes first. Other cases based on rape,
    serious birth defects, etc., are topics that have been debated by the rabbis of
    every generation. There are positions that are more restrictive and others others
    are less restrictive. The factor of holiness–understood as a supreme respect and
    consideration for human life in all its forms–is fundamental and should be the
    foundation and starting point from which we analyze and discuss this issue.


    ## 15. ON DIVORCE


    **BERGOGLIO:** The issue of divorce is different from the marriage between people
    of the same sex. The Church always condemns the Divorce Law, but it is true that
    there are different anthropological records in this case. In the 1980s, it was
    a much more religious debate, because marriage until death is a very strong value
    in Catholicism. Nevertheless, today Catholic Doctrine reminds their divorced members
    who have remarried that they are not excommunicated—even though they live in a
    situation on the margin of what indissolubility of marriage and the sacrament
    of marriage require of—and they are asked to integrate into the parish life. The
    Orthodox Churches have an even greater openness with respect to divorce. In that
    debate there was opposition, but with nuances. There were extreme positions that
    not everybody supported. Some said that it was better that they did not approve
    of divorce, but there were also others, who were open to a dialogue from a political
    standpoint.


    **SKORKA:** In the Jewish religion, the institution of divorce exists and rules
    are applied based on Halacha, the rabbinical law. Needless to say, it is a big
    deal. It is not a matter of faith, as it is in Catholicism, where its position
    comes from the reading of the Gospels that say that Jesus took a very hard line
    on divorce, similar to that adopted by the house of Shammai as the Talmud attests.
    In Judaism, when the marriage is not working out, the couple is assisted in formalizing
    an act of divorce only after a serious effort has been put into reconciling the
    two parties of their differences. I present the issue in those terms because Judaism
    neither rabbis nor rabbinical courts “declare” or “decree” the new status of the
    parties, they only supervise the dissolution so that it is done according to the
    rules. The man and the woman declare and assume their new status, as they did
    when they were married. It is a private action performed by those two people,
    under the supervision of someone knowledgeable in the law to make sure it is done
    correctly. That is why there has not been much conflict for us in the aforementioned
    debate. A similar situation occurred during the debate regarding assisted reproduction.
    Judaism is in favor of it because it is a way to help G-d so that a woman can
    become a mother, easing that person’s suffering. It is a more fluid position than
    that of Catholicism.


    Catholicism has stronger and more restrictive positions on these topics. However,
    when we pose these questions in the midst of a democratic society, we have to
    try to arrive at a consensus. The first principle needs to be life is sacred.
    Each side will have its own interpretation, but we cannot just play with it. We
    have to have a mutual respect for what life deserves. If we do not agree, we cannot
    move forward.


    ## 16. ON SAME-SEX MARRIAGE


    **SKORKA:** I believe that the way gay marriage was treated in the past lacked
    the depth of analysis it deserves. While it is true that there are already many
    same-sex couples who live together and deserve a legal status for issues such
    as retirement benefits, inheritances, etc., it would be best if a new status were
    created. However, to equate a homosexual couple with a heterosexual couple is
    something else entirely. It is not just a matter of beliefs, but of being conscious
    that we are talking about the building blocks that form our society. There is
    still a lack of analysis and anthropological study regarding this topic. At the
    same time, of course, we should have given more space since they are the carriers
    and shapers of our culture.


    **BERGOGLIO:** Religion has a right to give an opinion as long as it is in service
    to the people. If someone asks for advice, I have the right to give it to them.
    The religious minister, at times, draws attention to certain points of private
    or public life because he is the parishioners'' guide. However, he does not have
    the right to force anything on anyone’s private life. If God, in creation ran
    the risk of making us free, who am I to get involved? We condemn spiritual harassment
    that takes place when a minister imposes directives, conduct, and demands in such
    a way that it takes away the freedom of the other person. One has to speak very
    clearly about values, limits, commandments, but spiritual and pastoral harassment
    is not allowed.


    **SKORKA:** Judaism has many different branches. The extremely Orthodox have an
    excessive number of rules–they demand that their followers live a certain way.
    The leader of the community says “this is the way it is” and there is no room
    for discussion, so in the end they meddle in people’s lives. On the other hand,
    the rabbis in the other branches perform their roles solely in their capacity
    as teachers, which is not invasive. I might say, “The law says this, try to do
    the right thing according to the tradition,” but that is all.

