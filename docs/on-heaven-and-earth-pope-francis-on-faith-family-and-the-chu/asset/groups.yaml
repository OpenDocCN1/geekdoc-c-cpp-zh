    # THE FAÇADE AS A MIRROR

    Jorge Bergoglio


    Rabbi Abraham Skorka, in one of his earlier writings, made reference to the façade
    of the Metropolitan Cathedral that depicts the encounter between Joseph and his
    brothers. Decades of misunderstandings converge in that embrace. There is weeping
    among them and also an endearing question: Is my father still alive? During the
    times of national organization,5 this was the image they proposed, and not without
    reason. It


    5 Ed. Note: The national organization (organización nacional) marks a period in
    Argentina''s history between 1852 and 1880. During this time, a national constitution
    was approved that defined the federal nature of the government. Education and
    communications were also dramatically expanded. Although regarded as a time that
    forged Argentina''s strength and identity, it also came with social upheaval.'
