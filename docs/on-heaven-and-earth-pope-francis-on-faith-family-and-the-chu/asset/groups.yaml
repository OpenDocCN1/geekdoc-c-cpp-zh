    **BERGOGLIO**：当这些非凡的疗愈者出现时，即使出现了启示和幻象，我也会产生一种自然的不信任；这些事情让我处于防御状态。上帝不是那种不断发送信息的安德雷尼³¹。信徒说他感受到了什么，情况是不同的。尽管如此，人们必须承认在历史上预言一直存在并且持续存在。必须为上帝选定的先知的人留出一个位置，并让他们具有先知的特征。然而，这些人并不是通常那些声称带来上天信件的人。我不得不在布宜诺斯艾斯谴责过许多案例，因为它们比人们想象的要常见且频繁得多。认为你或我在祈祷时感受到的精神慰藉是对整个世界的预言或启示，将是非常天真的想法。有时，人们之所以感到某些，是因为解释不当或心理不稳定，某些人会将此误认为是预言。


    29 哈西迪教是18世纪诞生于东欧的犹太教运动。它拥有非常丰富的神秘主义内容，通过蜡烛、舞蹈和传统帮助其成员重振信仰。

    30 《巴比伦塔勒德》，《圣赫德林集》，97页，b

    31 编辑注：安德雷尼（Andreani）是阿根廷最大的特快公司。


    不久前，我在电话中接到一个女性，她说她对所有阿根廷人有一个信息，我必须授权她告诉所有人“为了我们所有人的救赎”。她把信息发给我，我发现其中有些地方不对，存在不准确之处和错误。我告诉她我不能授权。她坚持并不同意我的观点，甚至在没有我授权的情况下也打算私下传播这条信息。有些人感到自己拥有一种某种预言性的使命感。另一个更容易解释的问题是疗愈。通过科学研究，一些肿瘤学家认为心理对身体有影响，其中一些事情是可以解释的。此外还存在拉比或牧师的事事调解，他们为他人祈祷或请求健康，而愿望得到了。一个根据上帝法则进行疗愈的人，其信誉度来自于简单、谦卑和拒绝表演性。否则，疗愈可能会变成一门生意。


    **SKORKA**：我100%同意。如果有人利用他们的力量来娱乐，他们并不是真正的虔诚，而且是在编造谎言。有很多人追随潮流，向彼岸寻求解决他们生理和和社会问题的答案。人们必须意识到，当他们去看拉比时——我确定同样的情况也发生在牧师身上——他们将得到一个基于信仰的答案。这和医生的回答是不一样的。我们绝不应该自己标榜为医生。如果有人因为健康问题来找我，可以通过温和、安抚的话来帮助他们，但同时我会告诉他们，需要严格遵守医嘱进行药物治疗。


    **BERGOGLIO**：对于这一点，上帝赋予了我们工具。


    **SKORKA**：让我想起一个老故事。发生了一场洪水，一个男人被困在房顶上大声呼救。几乎立刻，有一个独划舟来救他，但他拒绝上去。“我说我要留在这里，因为上帝会帮助我的，”他对划船人说。后来，一艘消防员救生艇来救他，他再次拒绝上去。“不行的——我要留在这里，因为上帝会救我的，”他重复道。然后，一架警察直升机来救援，但他拒绝爬上去，说着同样的话，“上帝会救我的。”最后，那人死了，当他上天堂时，他向上帝抱怨：“你为什么不帮我？你让我死了！”这时，上帝对那个男人发了火。“你说我没帮你？我派了独划舟、一条救生艇和一架直升机，而你一个都没有坐！”


    **BERGOGLIO**：很好，拉比。我想再次讨论领导的问题。我很喜欢你刚才用的一个词：圣洁。在非政府组织（NGO）中，这个词并不适用。是的，但对于宗教来说，圣洁对领导者是不可避免的。


    **SKORKA**：毫无疑问，任何领导会众的人必须是一个正直的人，追求公正并据此行动。宗教领工作更具挑战性的方面之一是调解——介入人的事务以实现和平。在圣经中，这是通过代人向上帝祈求来实现。这就是亚伯拉罕为了拯救所多和蛾玛拉而与上帝讨价还价的做法。这种态度与对绝对和专断权力的健康渴望完全不同，我们在二十世纪的独裁政权中见过这种最糟糕的例子。关于人类行为和社会互动的一些研究认为，二十世纪的极权运动（如纳粹主义和共产主义）采用了宗教机构的某些特征，例如对符号和神秘主义的使用。大众梦想能够解决他们所有问题并缓解焦虑的救星。这些梦想被精明的邪恶分子利用和操纵，他们诱惑人心，最终人们可以随领导者的意愿而为。

