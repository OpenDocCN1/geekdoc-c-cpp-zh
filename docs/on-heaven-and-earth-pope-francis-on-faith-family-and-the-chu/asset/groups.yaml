    ## 13. ON WOMEN


    **BERGOGLIO:** In Catholicism, for example, many women lead a liturgy of the word,
    but do not exercise the priesthood, because in Christianity the High Priest is
    Jesus, a male. In the theologically grounded tradition the priesthood passes through
    man. The woman has another function in Christianity, reflected in the figure of
    Mary. It is the figure that embraces society, the figure that contains it, the
    mother of the community. The woman has the gift of maternity, of tenderness; if
    all these riches are not integrated, a religious community not only transforms
    into a chauvinist society, but also into one that is austere, hard and hardly
    sacred. The fact that a woman cannot exercise the priesthood does not make her
    less than the male. Moreover, in our understanding, the Virgin Mary is greater
    than the apostles. According to a monk from the second century, there are three
    feminine dimensions among Christians: Mary as Mother of the Lord, the Church and
    the Soul. The feminine presence in the Church has not been emphasized much, because
    the temptation of chauvinism has not allowed for the place that belongs to the
    women of the community to be made very visible.


    **SKORKA:** Christianity adopted the priest''s role from the Hebrew Bible, wherein
    the priesthood is patrilineal. However, matrilineal descent determines whether
    someone is Jewish—if the mother is Jewish, the child is Jewish. Based on our beliefs,
    the priestly rites also used to be performed by men. Today however, we have teachers⁵57
    instead of priests. Because of that, a woman with knowledge of the Torah can teach
    others and respond to questions about how to act in accordance with Jewish law.


    **BERGOGLIO:** Catholics, when we speak of the Church, we do so in feminine terms.
    Christ is betrothed to the Church, a woman. The place where it receives the most
    attacks, where it receives the most punches, is always the most important. The
    enemy of human nature—Satan—hits hardest where there is more salvation, more transmission
    of life, and the woman—as an existential place—has proven to be the most attacked
    in history. She has been the object of use, of profit, of slavery and has been
    relegated to the background; but in the Scriptures we have cases of heroic women
    that have transmitted to us what God thinks about them, like Ruth, Judith . .
    . What I would like to add is that feminism, as a unique philosophy, does not
    any favors to those that it claims to represent, for it puts women on the level
    of a vindictive battle, and a woman is much more than that. The feminist campaign
    of the ''20s achieved what they wanted and it is over, but a constant feminist
    philosophy does not give women the dignity that they deserve. As a caricature,
    I would say that it runs the risk of becoming chauvinism with skirts.


    **SKORKA:** Within the traditionalist (Masorti) movement, women’s religious role
    has changed. Rabbinical seminaries around the world grant women the title of Rabbi.
    The truth is that from a historical point of view, the law contains no direct
    prohibition against women teaching Torah, nor is there any real reason to deny
    them the title of Rabbi. When we look at the role and portrayals of women in both
    biblical and Talmudic literature, there are many attributes that correspond to
    what you just said. The Talmud contains the Marriage Contract, whose original
    idea was that the woman we are talking more than thousand years ago—would have
    a document that would prevent the man from divorcing her easily. That is to say
    that to do it would entail a great economic hardship on the man, making it a question
    of practicality. What was the point? It was to safeguard the woman and ensure
    that she lives with dignity.


    Throughout the Jewish people''s historical wanderings, there have been moments
    of spectacular greatness with respect to the consideration given to women. The
    Bible provides us with some great examples. David''s story to take one: he was
    the descendant of two women, Tamar and Ruth, who had enormous willpower and tremendous
    spirituality. However, there are other times when, for various reasons, there
    have been Jewish movements that have not treated women with generosity and respect,
    making them second class citizens. Why? We lived firmly entwined with other nations
    and male chauvinism was a constant feature throughout human history. There have
    been many cultures where men held more power than women and the Jewish people
    were not immune to these influences or committing vile acts of their own.


    On the other hand, I think it deserves mentioning that in the most observant Jewish
    communities they adopt rules regarding modesty that prevent a man from holding
