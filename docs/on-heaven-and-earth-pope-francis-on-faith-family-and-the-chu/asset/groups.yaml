  - '[PAGE 107]


    of death.53 It is written that He is afraid of what is to come. According to the
    Gospel accounts, he dies reciting Psalm 22: “My God, my God, why have you abandoned
    me?"54 From this no one is exempt. I trust in the mercy of God, that He will be
    benevolent. Let us say: there is no anesthesia for anguish, but there is the capacity
    to bear it.


    SKORKA: It is very stressful to know one’s time is limited and even more so not
    knowing where the limit is. It would be terrible to think that our life is nothing
    more than a meaningless accident of nature and everything ends inexorably in death.
    if that were the case, our lives would have no meaning; much less our sense of
    values or justice . . . anyway, that would be an extreme point of view. Two possibilities
    remain. For those who do not want to bother with the issue of G-d, human life
    has an intrinsic meaning—its message of generosity and justice passed on from
    generation to generation. And for those of us who do have faith in G-d, obviously
    we believe that His spark lies within us and that death is nothing more than a
    change in our situation.


    BERGOGLIO: A short time ago I read a writer from the second century who imagined
    Easter as a path in its entirety, and he applied it to this life. Somehow he


    53 Matthew 26:38

    54 Psalms 22:2'
  - '[PAGE 108]


    said:“Do not lose sight of where you are going, do not make the journey too entertaining,
    because then you may get carried away and forget the goal.” We have to take on
    the responsibility of our journey; in it will appear in all of our creativity,
    and our work to transform this world, but we must not forget that we are on a
    path toward a promise. To journey is the creative responsibility to fulfill the
    command of God: to grow, be fruitful and subdue the earth. The first Christians
    were united around the image of death with hope, and they used as a symbol the
    anchor. So, hope was the anchor that one had dug into the shore, and they held
    on to the rope in order to advance without losing their way. Salvation is in hope,
    that it will be fully revealed to us, but in the meantime we are holding on the
    rope and doing what we believe we have to do. Saint Paul tells us: “In hope we
    are saved.”


    SKORKA: Even though the Latin word also means “to wait”—to hope does not mean
    taking a passive approach with respect to our goals. One can be proactive as well.
    The Jewish people lived for two thousand years with the hope of returning to their
    land, and for a long time, that hope was reduced to praying to G-d. But there
    came a point when many Jews decided to leave Europe and went to live in Israel.
    That is the difference between hope and optimism, which is not a goal in itself,
    but is a way of looking at life.


    BERGOGLIO: Optimism is a more psychological'
  - '[PAGE 109]


    issue, an attitude toward life. There are people who always see the glass half
    full and others, on the contrary, who see the glass half empty. Hope, at its base,
    has something passive about it because it is a gift from God. The virtue of hope
    cannot be acquired by ourselves; it has to be given by the Lord. How you use it,
    how you administer it, how to assume it is a different thing...In our understanding,
    hope is one of the three theological virtues, together with faith and charity.
    We tend to give more importance to faith and charity. Nevertheless, hope is the
    one that frames the structure of the entire path. The danger is that to fall in
    love with the path and lose the vision of the goal; and another danger is quietism:
    to be looking at the goal and not to do anything on the way. Christianity had
    very strong periods of quietist movements that went against the command of God,
    which says that one has to work and transform the earth.


    SKORKA: Those who are imbued with a deep sense of faith face death in a different,
    calmer way. A man I knew from my congregation comes to mind. He was a Jew who
    was full of faith. One day his daughter called me to ask if I could go to see
    him because he was in bad shape and the doctor had told him that his days were
    numbered. Obviously, I said I would go. I went and figured that I would find a
    man on death''s doorstep. Instead, the man was completely aware of his surroundings—no
    one would have guessed that'
  - '[PAGE 110]


    he was about to die. I spoke with him as if he were a completely healthy man.
    However, since his daughter told me that he was terminally ill, I wanted to be
    very careful around him, so I said goodbye to him in a special way. In Hebrew,
    I told him, “Stay at peace?” He extended his hand to me and said, “Okay my dear
    rabbi we will see each other soon in the world to come.” This man had enormous
    faith and was completely at peace. He said goodbye to this life, with life. He
