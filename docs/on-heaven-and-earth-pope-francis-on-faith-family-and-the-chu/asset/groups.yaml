    26 注释：尼尼·马歇尔是玛丽娜·埃斯特·特拉韦索（1903–96）的艺名，被许多人认为是最著名的阿根廷女剧作家和喜剧演员。她最著名的角色之一是卡塔琳娜或“卡蒂塔”，一个经常议论朋友和邻居的意大利移民。'
