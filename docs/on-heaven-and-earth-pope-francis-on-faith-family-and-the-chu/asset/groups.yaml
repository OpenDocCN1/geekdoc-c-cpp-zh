    酷刑。像他的人在某种程度上支持了那些程序，因为他们提供的是赦免，而不是明确地告诉他们自己是杀手。


    **BERGOGLIO:** 那些参与那种情况的人是在通谋。


    **SKA:** 人永远不会仅仅是一个人而而已。我们不相信人是天使，只能够执行命令并以纯粹的奉诚这样做。而天使没有自由意志，人受其激情的影响。在某种程度上，想要领导宗教教会的人必须具有自信、高自尊和至少一点点自我意识。如果他们缺乏这些，就无法领导它。任何把自己推为教会首脑的人都需要他的自我意识得到肯定。总会有此类类的问题：“他将如何运用那股权力？”因为权力总是被用于某事。你还记得我在呼召选举新教皇时说的话吗？“我希望上帝启迪迪枢红们，让他们能选出正确的人。”在历史上，成为教皇意味着一个重要的声音，尽管总是受到批评，但它是每个人都关心的。我也希望他们能选出一个性格温和的人，因为那个人可能被要求去做非常重要的事情。问题在于，当一个人拥有如此巨大的权力时，他们是否仍然能保持诚实和谦卑，以及是否能够应对挑战。五十年前这种对话是不可能的，如果不是因为你，它仍然是不可能的。我们必须打破这种恶性循环。作为阿根廷教会的首脑，你利用你的权力做了一些事情。相比之下，我们不应该不断让平庸之辈进入权力位置。


