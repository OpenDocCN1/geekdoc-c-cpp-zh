    # 1. ON GOD


    **SKORK:** It has been many years since we first met and aly bond has been forged
    between us. While studying the books of the Talmud, I found one that says that
    friendship means sharing meals and spending time together, but in the end it points
    out that the sign of a real friendship is the ability to reveal what is in one''s
    heart to the other person. That is what happened over time with the two of us.
    I believe that undoubtedly the most important thing that brought us together was,
    and still is, G-d, who caused our paths to cross and allowed us to open our hearts
    to each other. Although we broached many topics during our regular conversations,
    we never spoke explicitly about G-d. Of course, it was always understood that
    He was present. It would be good to start this exchange, which we plan'
  - '[PAGE 23]


    to leave as a testimony of our dialogue, by discussing Him who is so important
    in our lives.


    **BERGOGLIO:** What a great word: path!* In my personal experience with God I
    cannot do without the path. I would say that one encounters God walking, moving,
    seeking Him and allowing oneself to be sought by Him. They are two paths that
    meet. On one hand, there is our path that seeks Him, driven by that instinct that
    flows from the heart; and, when we have encountered each other, we realize that
    He was the one who had been searching for us from the start. The initial religious
    experience is of walking: walk to the land that I am going to give you.⁷ It is
    a promise that God makes to Abraham. In that promise, in this, in this walking,
    an alliance is established that consolidates over time. Because of this I say
    that my experience with God takes place along the path, both in the search and
    in allowing myself to be sought, even if it may be by diverse paths—of pain, joy,
    of light, or darkness.


    **SKORKA:** What you have said reminds me of a few biblical verses. For example,
    when G-d tells Abraham: “Walk in my presence and be blameless?”⁸ Or when the prophet
    Micah needed to explain to the Israelites what G-d wanted from them, and he tells
    them to “do justice


    ⁷ Genesis 12:1

    ⁸ Genesis 17:1'
- md: '

    and to love goodness, and to walk humbly with your G-d.”⁹


    Without a doubt, experiencing G-d is dynamic, to use a word that we learn in our
    mutual study of basic science.¹⁰ However, what do you think we can say to people
    nowadays when we find the idea of G-d to be so mangled, profaned and diminished
    in importance?


    **BERGOGLIO:** What every person must be told is to look inside himself. Distraction
    is an interior fracture. It will never lead the person to encounter himself for
    it impedes him from looking into the mirror of his heart. Collecting oneself is
    the beginning. That is where the dialogue begins. At times, one believes He has
    the only answer, but that''s not the case. I would tell the people of today to
    seek the experience of entering into the intimacy of their hearts. To know the
    experience, the face of God. That is why I love what Job says after his difficult
    experience and the dialogues that did not help him in any way: “By hearsay I had
    heard of you, but now my eye has seen you.”¹¹ What I tell people is not to know
    God only by hearing. The Living God is He that you may see with your eyes within
    your heart.


    **SKORKA:** The Book of Job teaches us a great lesson because–in short–it says
    that we can never know how G-d reveals Himself in specific circumstances. Job,
    a just, upright man, wanted to know why he had lost everything, even his health.
    His friends told him that G-d had punished him for his sins. He responds by saying
    that even if he had sinned, he had not been that bad. Job is comforted only when
    G-d appears to him. His questions are not answered, but the touch of G-d’s presence
    stays with him. We can find several things in this story that shape my personal
    perception of G-d. First, Job’s friends show themselves to be arrogant and nonsensical
    by espousing the theory that “You have sinned, therefore G-d has punished you,”
    transforming G-d into some sort of computer that calculates reward or punishment.
    At the end of the story, G-d tells Job–who had railed so much against injustices
    of his Creator–that he should intercede and pray for his friends, because they
    had spoken falsely about Him.¹² Those who had cried out in suffering, demanding
    heavenly justice, were pleasing in G-d’s eyes. Those who insisted on a simplistic
    view of G-d’s nature were detected by Him. As I understand it, G-d reveals Himself
    to us subtly. Our current suffering might be an answer for others in the future.
    Or, perhaps we ourselves are the response to something from the past. In Judaism,
    G-d is honored by our compliance with the precepts that he revealed. As you mentioned,
    each person and each generation must find the path on which they can search for
    and feel His presence.


    **BERGOGLIO**: Exactly. We receive creation in our hands as a gift. God gives
    it us, but at the same time He gives us a task: that we subdue the Earth. This
    is the first form of non-culture: what man receives, the raw material that ought
    to be subdued to make culturelike the log that is transformed into a table. But
    there is a moment in which man goes too far in this task; he gets overly zealous
    and loses respect for nature. Then ecological problems arise, like global warming,
    which are new forms of non-culture. The work of man before God and before himself
    must maintain a constant balance between the gift and the task. When man keeps
    the gift alone and does not do the work, he does not complete his mission and
    remains primitive; when man becomes overly zealous with his work, he forgets about
    the gift, creating a constructivist ethic: he thinks that everything is the fruit
    of his labor and that there is no gift. It is what I call the Babel syndrome.


    **SKORK**: In rabbinic literature, there is a question as to why G-d did not like
    the Tower of Babel. Why did he halt construction by making people different languages?
    In reading the text, the simplest explanation is that the attempt to build a tower
    reaching Heaven was part of a pagan religion. The act was an expression of arrogance
    toward G-d. The Midrash¹³ states that what really bothered G-d that the builders
    were more concerned about losing a single brick than with losing a man who might
    fall from such a great height. The same thing happens now–there is a tension between
    the gift and the work. There needs to be a perfect equilibrium because man needs
    to progress so that he can become more human. Even though G-d is the one who planted
    and created everything, man is the focus of the material world and the greatest
    divine work. The way we are living today, the only thing that matters is the success
    of our economic system, and what is least important is the well-being of mankind.


    **BERGOGLIO:** What you said is brilliant. The Babel syndrome is not only a constructivist
    posture, but there is also the appearance of a confusion of languages. That is
    typical of situations in which there is an exaggeration of the mission, ignoring
    the gift, because in that case pure constructivism carries with it the lack of
    dialogue at that the same time entails aggression, misinformation, and annoyance
    . . When one reads Maimonides¹⁴ and Saint Thomas of Aquinas, two nearly contemporary
    philosophers, we see that they always start by putting themselves in the position
    of their adversary in order to understand them; they dialogue from the standpoint
    of the other.


    **SKORKA:** According to the Talmudic interpretation, Nimrod was a Babylonian
    dictator who held a tight grip on everything, and that is why the people spoke
    only one language—his. This tyrant ordered the construction of a tower that would
    reach Heaven in order to leave his mark, and thus, presumed rather arrogantly
    to be physically closer to G-d. The point of building was not to benefit mankind.
    The betterment of people''s lives held no importance. By building only for themselves
    while using one despotic language and not a universal language, each person and
    each generation must find the path on which they can search for and feel His presence.


    ---

    9 Micah 6:8

    10 Abraham Skorka is a doctor of chemistry, and Jorge Beroglio is a chemical technician.

    11 Job 42:5

    12 See Job 42:7–8

    13 The Midrash is a group of homiletic texts from wise men of the Talmud, presenting
    non-literal interpretations of the Bible.

    14 Ed. Note: Maimonides, born Moses ben Maimon (1138–1204), is regarded as the
    greatest Jewish philosopher and rabbi of the medieval period. He combined religious
    Jewish tradition with Aristotelian philosophy, especially in his masterpiece,
    *The Guide for the Perplexed*.


    ## 2. ON THE DEVIL


    **BERGOGLIO:** The Devil, theologically, a being that opted not to accept the
    plan of God. The masterpiece of the Lord is man; some angels did not accept it
    and they rebelled. The Devil is one of them. In the book of Job he is the tempter,
    the one that looks to destroy the work of God, Jesus defines him as the Father
    of Lies, and the book of Wisdom says that sin entered the world through the Devil.
    His fruits are always destruction: division, hate, and slander. And in my personal
    experience, I feel him every time that I am tempted to do something that is not
    God wants for me. I believe the Devil exists. Maybe his greatest achievement in
    these times has been to make us believe that he does exist, and that all can be
    fixed on a purely human level. Man''s life on Earth is warfare; Job says it meaning
    that people are constantly put to the test; that is to say, a test to overcome
    a situation and overcome oneself. Saint Paul took it and applied it to athletes
    that compete in an arena and who deny themselves many things in order to achieve
    success. The Christian life is also a sort of sport, a struggle, a race where
    one has to detach oneself from the things that separate us from God.


    **SKORKA:** There is a wide variety of opinions on this topic in Judaism. In Jewish
    mysticism there is what is called “the other power”—something that can be likened
    as evil forces. Although the well-known primal image of the snake that appears
    in the Bible can be interpreted as an evil force that incited man against G-d,
    in the case of Job’s Satan, as well as the one that appears to Baalam, it is more
    of a hypostasis of G-d. In Job’s case, Satan presents G-d with the doubts that
    surface in our own minds when we see an upstanding man thanking G-d when he lacks
    for nothing. If He blesses a man with everything, why would that person not be
    thankful to G-d? Would he likewise in a time of distress? In Baalam’s case, when
    he was hired by Balak to curse the Israelites,¹⁵ Satan placed himself in front
    of Balaam so that he would not disobey G-d.


    ¹5 Numbers 22:22

