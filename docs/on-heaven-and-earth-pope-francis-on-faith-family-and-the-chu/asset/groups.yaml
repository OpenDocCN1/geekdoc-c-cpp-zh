    command to deny the King of Moab''s request. When we talk about the manifestation
    of good and evil in creation, to me, the verse that explains it best appears in
    the book of Isaiah¹⁶ where it says G-d forms the light and creates darkness and
    that He makes peace and creates evil. It is a very complex verse, which I interpret
    to say that darkness does not exist in and of itself, but as the absence of light.
    Likewise, evil occurs when good is removed from a situation. It also cannot exist
    by itself. I prefer to talk about instincts rather than angels. For me, it is
    not about an external force so much as it is something within man that challenges
    the Lord.


    **BERGOGLIO:** In Catholic theology there is also an internal element that we
    can explain with the fall of nature after original sin. We agree on what you call
    instinct, in the sense that when someone does something inappropriate it is not
    always because the Devil encouraged it. Someone can do bad through his own nature,
    by “instinct,” which is encouraged by an external temptation. In the Gospels it
    is striking how Jesus starts his ministry with forty days of fasting and prayer
    in the desert, and it is in that moment Satan tempts him with stones that he can
    turn into bread, with the assurance that nothing would happen to him if he threw
    himself from the temple and promise that he would have anything he wanted if Jesus
    would just adore him. That is to say, the Devil uses the existential situation
    of fasting and proposes to Jesus an “omnipotent way out,” centered in himself
    (a satisfying, vain and prideful way out) that would take Jesus away from his
    mission and identity as Yahweh’s Servant.


    **SKORK:** In the end, accepting the general concept of evil is up to the free
    will of each individual. All the rest depends on our perceptions and interpretations
    of the texts that we consider sacred. What remains clear is that something exists,
    whether it is instinct or the Devil, which presents itself as a challenge for
    us to overcome so that we can uproot evil. We cannot be ruled by evil.


    **BERGOGLIO:** That is precisely man’s battle on Earth.


    # 3. ON ATHEISTS


    **BERGOGLIO:** When I speak with atheists, I will sometimes discuss social concerns,
    but I do not propose the problem of God as a starting point, except in the case
    that they propose it to me. If this occurs, I tell them why I believe. But that
    is human is so rich to share and to work at that very easily we can mutually complement
    our richness. As I am a believer, I know these riches are a gift from God. I also
    know that the other person, the atheist, does not know that. I do not approach
    the relationship in order to proselytize, or convert the atheist; I respect him
    and I show myself as I. Where there is knowledge, there begins to appear esteem,
    affection, and friendship. I do not have any type of reluctance, nor would I say
    that his life is condemned, because I am convinced that I do not have the right
    to make a judgment about the honesty of that person; even less, if he shows me
    those human virtues that exalt others and do me good. At any rate, I know more
    agnostic people than atheists; the first are more uncertain, the second are more
    convinced. We have to be coherent with the message that we receive from the Bible:
    every man is the image of God, whether he is a believer or not. For that reason
    alone everyone has a series of virtues, qualities, and a greatness of his own.
    If he has vileness, as I do, we can share that in order to mutually help one another
    and overcome it.


    **SKORK:** I agree with what you have said; the first step is respecting your
    fellow man. But I would add one more point of view. When a person says, “I am
    an atheist,” I believe he or she is taking an arrogant position. He who doubts
    has a more nuanced position. An agnostic thinks that he has not yet found the
    answer, but an atheist is 100 percent convinced that G-d does not exist. It is
    the same arrogance that leads some to assert that G-d definitely exists, just
    like the chair I am sitting on. Religious people are believers, but we do not
    know for certain that He exists. We can perceive Him in an extremely profound
    sense, but we never see Him. We receive subtle replies from Him. According to
    the Torah, Moses was the only person to have spoken directly, face to face, with
    G-d. As everyone else—Jacob, Isaac, etc.—the presence of G-d appeared to them
    in dreams or by some messenger. Even though I personally believe that G-d exists,
    it is arrogant to say that He exists as if it were just another certainty in life.
    I would not casually affirm His existence because I need to live the same humility
    I demand of the atheist. The right thing to do would be to point out—as Maimonides
    did in his thirteen principals of faith—that “I believe with complete faith that
    G-d is the Creator.” Following Maimonides’ line of thought, we can say what G-d
    is not, but we can never be sure of what G-d is. We can talk about His qualities
    and attributes, but in no way can we describe His form. I remind the atheist that
    the perfection of the natural world is sending us a message. We can gain an understanding
    of how it works, but not its essence.


    **BERGOGLIO:** The spiritual experience of encounter with God is not controllable.
    One feels that God is there, one has the certainty, but he cannot control God.
    We are made to subdue nature; that is what God commands. We cannot, however, subdue
    our Creator. As a result, in the experience of God there is always an unanswered
    question, an opportunity to be submerged in faith. Rabbi, you said one thing,
    which in part, is certain: we can say what God is not, we can speak of His attributes,
    but we cannot say what He is. That apophatic¹⁷ dimension, which reveals how I
    speak about


    ¹7 Ed. Note: *Apophatic* is a term that refers to an intellectual approach to
    God through what is known as “negative theology.” Through this way, one attempts
    to describe God by what He is not, not that is, what may not be said about his
    perfect goodness (“God is unknowable”). It stands in contrast with cataphatic
    or “positive” theology.


    God is critical to our theology. The English mystics speak a lot about this theme.
    There is a book by one of them, from the thirteenth century, The Cloud of Unknowing,
    that attempts again and again to describe God and always finishes pointing to
    what He is not. The mission of theology is to reflect and explain religious facts,
    and among them, God. I would also classify as arrogant theologies that not only
    attempted to define with certainty and exactness God’s attributes, but also the
    pretense of saying who He was. The book of Job is a continuous discussion about
    the definition of God. There are four wise men that elaborate this theological
    search and everything ends with Job’s expression:


    “By ears I had heard of you, but now my eye has seen you.”¹⁸ Job 42:5


    Job’s final image of God is different from his vision of God in the beginning.
    The intention of this story is that the notion that the four theologians have
    is not true, because God is always being sought and found. We are presented with
    this paradox: we seek Him to find Him and because we find Him, we seek Him. It
    is a very Augustinian game.


    **SKORK:** I believe with complete faith that G-d exists. As opposed to the atheist
    who is sure that He does not exist and does not entertain any doubts, I implicitly
    reveal a margin of uncertainty by using the word “faith.” At a minimum, I have
    to acknowledge what Sigmund Freud wrote: that we need the idea of G-d to temper
    our existential angst. Nevertheless, after having done an in-depth analysis of
    positions that negate the existence of G-d, I still believe. When my work was
    done, I still felt G-d''s presence. I retain a certain amount of doubt in any
    case since this is an existential problem and not a mathematical theory, although
    there is some room for doubt in mathematical theories as well. That said, when
    we think about G-d we have to do so with special terminology. Everyday logic does
    not apply. Maimonides put forth that idea long ago. Agnostic will continue to
    create their famous paradoxes. For example, if G-d is omnipotent, surely He could
    create a rock, that would mean He is not omnipotent. G-d is above and beyond any
    logic and its paradoxes. Maimonides explains that He knows everything in its complete
    form. We have only limited knowledge. If we had the same understanding that G-d
    has, we would be gods ourselves.

