    alism, of absolutism. You, Rabbi, also made an allusion to parochialization. That
    is a key, the trend toward a small community as a place of religious belonging.
    It responds to a need for identity, not only a religious identity, but also a
    cultural identity: I am from this neighborhood, from this club, from this family,
    I am from this religion . . . so I have a place of belonging, I recognize myself
    in an identity. The origin of Christianity was “parochial.” When one reads Saint
    Luke’s Acts of the Apostles, one notes that Christianity had a massive expansion;
    after Peter’s first sermons baptized two thousand people, who they later organized
    into small communities. The problem is when the parish does not have any life
    of its own and is absorbed into a higher level of the structure. What gives life
    to the parish is this sense of belonging. I remember, Rabbi, one day I went to
    chat with you at your community and you took me to meet the women that do the
    social work at the synagogue. They were preparing packets and bags for needy families.
    The synagogue or the parish leads us to care for our brothers, these places move
    religion to action. In this case it more of an act of welfare, but there are also
    other forms: educational, promotional, etc. For actions of this type, they accuse
    us of getting involved in things that, supposedly, should not interest us. A short
    time ago, for example, I celebrated a Mass in the Constitución station for the
    victims of human trafficking: slavery in sweatshops, exploited trash pickers,
    children used as


    227'
  - '[PAGE 249]


    drug pushers, and girls caught in prostitution. It ended up being a large protest,
    where non-Catholics gathered, who did not share my faith, but who shared the love
    for their brother. I am not entering into politics, I am entering the flesh of
    my brother, who was placed on the mincing machine, in a slave factory. It is true
    that some also take advantage of this to introduce politics; that is why it is
    important to discern how to act in those circumstances.


    **SKORKA:** As Isaiah said, Do not [turn] your back on your own flesh.¹106


    **BERGOGLIO:** The translation that I use is “Do not be ashamed of the flesh of
    your brother.” The religious relationship involves a commitment, not an escape.
    There was a period in Catholic Spirituality existed that was called *fuga mundi*¹107;
    now the concept is completely different–it is necessary to engage the world, but
    always from the religious experience. You recently mentioned that when a phenomenon
    occurs in one religion, it also tends to happen in another. The problem is serious
    when the spiritual is reduced to the ideological, and the religious experience
    loses strength and leaves an emptiness, turning to the world of ideas to fill
