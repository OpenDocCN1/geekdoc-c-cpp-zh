    the faithful and not from another place. Sometimes someone can objectify this
    use of money and give it a magical power; some think that thanks to a donation
    they might achieve who knows what, but it is not a purchase, rather it is an offering
    that goes along the line of what you said. I get very upset when there is a “menu
    of prices” for certain religious ceremonies. Two years ago, a parish in Buenos
    Aires had fee-based-baptisms according to the day of the week. Or sometimes, when
    a couple wants to get married, the parish secretary meets them and gives them
    a “menu of prices”: with a red carpet it costs this much, without the red carpet
    this this much, and so on. That makes a business out of worship. We are the ones
    who cause this world-liness.


    In the Gospel, Jesus formulates a very interesting reflection. He was looking
    together with the apostles at the donation box of the temple, and how the faith-ful
    were putting in their arms. The wealthy put in a lot of money and suddenly a widow
    arrived and put in a very small coin. So, Jesus said to the disciples: “This woman
    put in more than all of the others.” He said this the other people put in what
    what was left over, but she put in all that she had to live on. That is the true
    almsgiving. It is not from what is left over, but what causes privation. When
    you go to confession, I ask you if you give alms. In general, people tell me yes,
    so I ask them if they gaze into the eyes of those that re-ce it. The most common
    answer is “I do not know.” I continue interrogating: “And do you touch the hand
    of the one that offer alms, the beggar in the street?” There they turn red and
    do not respond. Almsgiving is a profound human generosity when it is done for
    a neighbor, which is the meaning of almsgiving. It is never a purchase.


