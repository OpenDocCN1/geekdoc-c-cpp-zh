  - '[PAGE 127]


    ion regarding this issue. I believe that we all have to struggle with ourselves
    to try and repress our natural instincts. It is fine that there are those who
    feel that dressing and acting modestly helps them to conduct themselves with dignity.
    The risk is that this way of dealing with things may be used as camouflage to
    cover up disordered attitudes. Personally, I believe that the desire to live modestly
    is something that comes from serious introspection. I think that when either a
    man or a woman is going through a very hard time and asks for or receives a strong
    hug or kiss from someone of the opposite sex, it is an act of kindness that begins
    and ends with that particular situation.'
  - '[PAGE 128]


    # 14. ON ABORTION


    **BERGOGLIO:** The moral problem with abortion is of a pre-religious nature because
    the genetic code of the person is present at the moment of conception. There is
    already a human being. I separate the issue of abortion from any religious concept.
    It is a scientific problem. To not allow further progress in the development of
    a being that already has the genetic code of a human being is not ethical. The
    right to life is the first human right. Abortion is killing someone that cannot
    defend himself.


    **SKORKA:** The problem with our society is that we have lost a great deal of
    our respect for the sanctity of life. Problem number one is that we talk about
    abortion as if it were no big deal and the most normal thing in the world. It
    is not. Even if it is only a cell, we are still talking about a human being. Therefore,
    the issue'
  - '[PAGE 129]


    merits a very special forum for discussion. What we often find is that everyone
    has an opinion, even though they are misinformed, or have no knowledge of the
    subject.


    In general, Judaism condemns it, but there are situations where it is permitted;
    when the mother''s life is in danger, for example. Abortion is allowed in various
    circumstances. What is interesting is that in analyzing the Law of Nations, that
    would become jus gentium in the Talmud, the ancient Jewish sages ruled that it
    should be absolutely prohibited in other societies. My interpretation is that
    since they knew what was being done in Rome, they wanted to avoid a discussion
    of abortion where Jews were living in a society with such little respect for life.
    In the Talmud one can find an exhaustive analysis on the topic of the death penalty.
    Even though the punishment appears in the Torah, there are also sages who opined
    that its use should be restricted that it would never actually be carried out.
    Depending on the situation they are faced with at the time, the sages of each
    new generation will decide the criteria for which the penalty is applied.


    The history regarding abortion is similar. Of course Judaism rejects and condemns
    it, with the exception of when the mother is clearly in danger of dying as explained
    in the Mishnah. In those cases, her life comes first. Other cases based on rape,
    serious birth defects,'
  - '[PAGE 130]


    etc., are topics that have been debated by the rabbis of every generation. There
    are positions that are more restrictive and others that are less restrictive.
    The factor of holiness–understood as a supreme respect and consideration for human
    life in all its forms–is fundamental and should be the foundation and starting
    point from which we analyze and discuss this issue.'
  - '[PAGE 131]


    # 15. ON DIVORCE


    BERGOGLIO: The issue of divorce is different from the marriage between people
    of the same sex. The Church always condemns the Divorce Law, but it is true that
    there are different anthropological records in this case. In the 1980s, it was
    a much more religious debate, because marriage until death is a very strong value
    in Catholicism. Nevertheless, today Catholic Doctrine reminds their divorced members
    who have remarried that they are not excommunicated—even though they live in a
    situation on the margin of what indissolubility of marriage and the sacrament
    of marriage require of—and they are asked to integrate into the parish life. The
    Orthodox Churches have an even greater openness with respect to divorce. In that
    debate there was opposition, but with nuances. There were extreme positions that
    not everybody supported.'
  - '[PAGE 132]


    Some said that it was better that they did not approve of divorce, but there were
    also others, who were open to a dialogue from a political standpoint.


    **SKORKA:** In the Jewish religion, the institution of divorce exists and rules
    are applied based on Halacha, the rabbinical law. Needless to say, it is a big
    deal. It is not a matter of faith, as it is in Catholicism, where its position
    comes from the reading of the Gospels that say that Jesus took a very hard line
    on divorce, similar to that adopted by the house of Shammai as the Talmud attests.
    In Judaism, when the marriage is not working out, the couple is assisted in formalizing
    an act of divorce only after a serious effort has been put into reconciling the
    two parties of their differences. I present the issue in those terms because Judaism
    neither rabbis nor rabbinical courts “declare” or “decree” the new status of the
    parties, they only supervise the dissolution so that it is done according to the
    rules. The man and the woman declare and assume their new status, as they did
    when they were married. It is a private action performed by those two people,
    under the supervision of someone knowledgeable in the law to make sure it is done
    correctly. That is why there has not been much conflict for us in the aforementioned
    debate. A similar situation occurred during the debate regarding assisted reproduction.
    Judaism is in favor of it because it is a way to help G-d so that a woman can
    become a mother, easing that person’s suffering. It is a more fluid position than
    that of Catholicism.'
  - '[PAGE 133]


    Catholicism has stronger and more restrictive positions on these topics. However,
    when we pose these questions in the midst of a democratic society, we have to
    try to arrive at a consensus. The first principle needs to be that life is sacred;
    we cannot just play with cells as if they were clay—something that is taught in
    Christianity as well as Judaismism. Both the religious and those who take a more
    liberal position have to come to an agreement—each side has to cede something.
    However, we can only give ground up to a point because life is sacred. Each side
    will have its own interpretation of what that means, but with a mutal understanding
    that life deserves the utmost respect. If we do not agree on that, we cannot move
    forward.'
  - '[PAGE 134]


    # 16. ON SAME-SEX MARRIAGE


    **SKORKA:** I believe that the way the topic of gay marriage was treated in the
    past lacked the depth of analysis that it deserves. While it is true that there
    are already many same-sex couples who live together and deserve a legal status
    to issues such as retirement benefits, inheritances, etc.,it would be best for
    them a new legal status were created. However, to equate a homosexual couple with
    a heterosexual couple is something else entirely. It is not just a matter of beliefs,
    but of being conscious that we are talking about one of the building blocks that
    form the foundation of our society. There is still a lack of analysis and anthropological
    study regarding this topic. At the same time, of course, we should have given
    more space for the various religions to provide information since they are the
    carriers and shapers of our culture. There should have'
  - '[PAGE 135]


    been organized debates at the heart of each faith, in-incorporating each of their
    various sects in order to form a complete range of opinions.


    **BERGOGLIO:** Religion has a right to give an opinion-as long as it is in service
    to the people. If someone asks me advice, I have the right to give it to them.
    The religious minster, at times, draws attention to certain points of private
    or public life because he is the parish-ioners’ guide. However, he does not have
    the right to force anything on anyone’s private life. If God, in-creation, ran
    the risk of making us free, who am I to get involved? We condemn spiritual harassment
    that takes place when a minister imposes directives, conduct, and demands in such
    a way that it takes away the free-dom of the other person. God left the freedom
    to sin in our hands. One has to speak very clearly about values, limits, commandments,
    but spiritual and pastoral ha-rassment is not allowed.


    **SKORKA:** Judaism has many different branches. The extremely Orthodox have an
    excessive number of rules–they demand that their followers live a certain way.
    The leader of the community says “this is the way it is” and there is no room
    for discussion, so in the end they meddle in people’s lives. On the other hand,
    the rabbis in the other branches perform their roles solely in their capacity
    as teachers, which is not invasive. I might say, “The law says this, try to do
    the right thing according to the tradition,” but that is all. There is a de-'
- md: '

    bate in the Talmud 58 about whether we should impose the right way of doing things
    or just try to convince people to follow them. I think that we should convince
    and not be invasive according to the following model–the parent who acts correctly
    and sets an example for their child. Paradoxically, it is also a way that beliefs
    are imposed, but through teaching and not through force or coercion.


    Getting back to the topic at hand, Judaism prohibits its sexual relations between
    two men. The exact words that the Bible uses are that men should not have relations
    together in the same way that men have them with women. That is the basis for
    any position taken on this issue. Since Genesis, the human ideal is the union
    of a man and a woman. Jewish law is clear–homosexuality is not allowed. On the
    other hand, I respect everyone as long as they are modest and keep their private
    lives to themselves. Upon respect to the new law, it does not make sense to me
    from an anthropological point of view. Upon re-reading Freud and Levi-Strauss,
    when they refer to the basic elements of what we call culture and the overriding
    importance they place on sexual ethics and the prohibition against incestuous
    relationships as part of the process of civilization–I worry about what will result
    from these changes to the core values of our society.


    58 Shabbat 88, a


    **BERGOGLIO:** I have the same exact opinion; in order to define it I would use
    the expression “anthropologic regression,” a weakening of the institution that
    is thousands of years old and that was forged according to nature and anthropology.
    Fifty years ago, concubinage, or co-habitation, was not very socially common like
    it is now. It was even a clearly derogatory word. Later, the whole thing changed.
    Today, living together before getting married, even though it is not right from
    a religious point of view, does not have the same negative connotation in society
    that it had fifty years ago. It is a sociological fact that co-habitation certainly
    does not have the fullness, or the greatness of marriage, which has thousands
    of years of value that deserves to be defended. It is because of this that we
    warn about its possible devaluation, and before modifying the law, one must reflect
    a lot about all that it will put in play.


    For us, what you just pointed out is also important, the foundation of Natural
    Law that appears in the Bible that speaks about the union between man and woman.
    There have always been homosexuals. The island of Lesbos was known because homosexual
    women lived there, but it never occurred historically that they would seek to
    give them the same status of marriage. They were tolerated or they were not, they
    were admired or they were not, but they were never put on the same level. We know
    that in times of momentous change the homosexual phenomenon grew, but in this
    period, it is the first time that the legal problem of assimilating it to marriage
    has arisen, and this I consider an anti-value and an anthropological regression.
    I say this because it transcends the religious issue, it is anthropological. If
    there is a union of a private nature, there is neither a third party nor society
    affected. Now, if the union is given the category of marriage and they are given
    adoption rights, there could be children affected. Every person needs a male father
    and a female mother that can help them shape their identity.


    **SKORKA:** When they modified the law to separate civil and religious marriage
    during the presidency of Raúl Alfonsín, I believed they did the right thing. Before
    that, in order to marry a couple, we had to have the civil marriage certificate
    in hand. It did not make sense to me that in a democratic society there should
    be a connection between the civil and religious ceremonies. I prefer that these
    two worlds do not mix. Nevertheless, referring to laws that deal with such sensitive
    issues on a human level, there should be more strenuous debate among the different
    faiths and we should delve further into the subject that we have in the past.


    **BERGOGLIO:** I insist our opinion about the marriage between two people of the
    same sex is not based on religion, but rather on anthropology. When the head of
    the Government of the City of Buenos Aires, Mauricio Macri, did not appeal the
    judge’s opinion right away authorizing a [same-sex] wedding, I felt that I had
    something to say, to inform; I saw myself with an obligation to state my opinion.
    It was the first time in eighteen years as bishop that I criticized a government
    official. If you analyze the two declarations that I formulated, at no time did
    I speak about homosexuals nor did I make any derogatory reference toward them.
    In the first declaration I said that the judge''s opinion was worrisome because
    it indicated a certain indifference toward the law, since a justice cannot alter
    the Civil Code in the first place, and she was altering it. At the same, I was
    alerting people to the fact that the head of the government, responsible for protecting
    the law, was prohibiting the appeal of this judgment. Macri told me that these
    were his convictions; I respected him for that, but the head of the Government
    does not have to transfer his personal convictions to law. In no moment did I
    speak disrespectfully about homosexuals, but yes I intervened and point out a
    legal issue.


    **SKORKA:** In a democracy, everything should be resolved through legal channels
    by way of a sincere, respectful and extensive debate. Each side should argue in
    a way that seeks common ground with their adversary, in order to arrive at a successful
    judgment based on mutual concessions. There were those involved in the debate
    prior to the passing of the law who invoked “natural law,” which presumes that
    nature contains rules that regulate human behavior; an undercurrent of this belief
    is the idea that G-d Himself incorporated this law into His Creation. But someone
    who is homosexual has every right to say that it was either G-d or nature that
    made him the way he is. There are those who add that homosexual love is deeper
    since they know about feminine and masculine love, even though that does not mean
    it is the way families are created.


    **BERGOGLIO:** Part of the great adventure, as you said, is to mutually decipher
    ourselves. There was a priest who said that God made us man and woman so that
    we would love one another and be needed by one another. In preaching on marriage
    I usually say to the groom that he has to make the bride more of a woman and to
    the bride that she has to make the groom more of a man.

