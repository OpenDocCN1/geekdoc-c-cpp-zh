    their lives at risk on behalf of the Jews. Perhaps, to get a better understanding
    of some of what happened, we have to look at each of the Popes'' backgrounds and
    the kinds of education they had. Pius XII was educated in the environs of the
    Vatican and his family was connected to the Holy See. He was part of a group that
    believed that anything could be achieved through diplomacy, and that if a solution
