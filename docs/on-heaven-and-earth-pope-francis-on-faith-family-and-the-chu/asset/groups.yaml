  mdcn: '


    塔勒德第 58 页讨论了我们是应该强加一种做事的正确方式，还是仅仅试图说服人们去遵循它们。我认为，我们应该采取说服而非侵入，这符合以下模型——即正确行为并为孩子树立榜样的的父母。悖论的是，这也是强加信仰的一种，但它是通过教学而不是力量或胁迫实现的。


    回到当前话题，犹太教禁止两个男性之间的性关系。圣经使用的确切文字是，男性不应像男性与女性之间那样发生关系。这是对这一问题任何立场的基础。从《创世记》以来，人类的理想是男女的结合。犹太法非常明确——不允许同性恋。另一方面，只要他们保持谦虚并保护私生活，我就尊重每个人。对于新法，从人类学的角度来看，对我来说没有意义。重新阅读弗洛伊德和列维-斯特劳斯，当他们提到我们所说的文化元素，以及他们对性伦理和禁止乱伦关系作为文明进程一部分的极端重视时——我担心这些社会核心价值观的变化将导致什么结果。


    58 Shabbat 88, a


    **贝尔戈廖：** 我有完全相同的观点；为了定义它，我会使用“人类学倒退”这一表达，这是对一个数千年历史、根据自然和人类学塑造的制度的削弱。五十年前，妾侍或同居并不像现在这样在社会上很普遍。它甚至是一个明确的贬义词。后来，整个情况变了。今天，在结婚前同居尽管从宗教角度来看是不正确的，但它在社会上的负面含义已不如五十年前那样了。这是一个社会学事实，同居确实没有婚姻的完整性或伟大性，婚姻拥有值得捍卫的数千年价值。正因如此，我们警告其可能导致的贬值，在修改法律之前，必须对它将引发的所有因素进行大量思考。


    对我们来说，你刚刚指出的点同样重要，圣经中关于男女结合的自然法基础。一直以来都有同性恋者。莱斯波斯岛因为那里住着同性恋女性而闻名，但在历史上从未出现过他们会寻求赋予她们同样的婚姻地位。他们要么被容忍，要么不被容忍；要么被崇拜，要么不被崇拜，但从未从未被放在同一个水平。我们知道在重大变革时期，同性恋现象增长了，但在这一时期，将其同化为婚姻的法律问题首次出现，我认为这是一种反价值和一种人类学倒退。我之所以这么说，是因为它超越了宗教问题，它是人类学的。如果这是一个私密性质的结合，既没有第三方也没有社会受影响。现在，如果这种结合被赋予婚姻的类别并被赋予收养权，可能会有孩子受到影响。每个人都需要一个父亲和一个母亲来帮助他们塑造身份。


    **斯尔卡：** 在拉乌尔·阿尔方辛总统期间，当他们修改法律将民事和宗教婚姻分开时，我认为他们做了正确的事。在那之前，为了让一对结婚，我们必须持有民事结婚证书。对我来说，在民主社会中，民事和宗教仪式之间存在联系没有意义。我倾向于这两个世界不要混合。尽管如此，对于涉及人类层面此类敏感问题的法律，不同信仰之间应该有更激烈的辩论，我们应该比过去更深入地探讨这个主题。


    **贝尔戈廖：** 我坚持认为，我们关于同性婚姻的观点并非基于宗教，而是基于人类学。当布宜诺斯艾利斯市市长毛里西奥·马克里没有立即对法官授权[同性]婚礼的意见上诉时，我觉得我有话要说，要告知；我觉得自己有义务发表我的意见。这是我担任主教十八年来第一次批评政府官员。如果你分析我制定的那两份声明，我没有在一次谈论过同性恋者，也没有对他们进行过任何贬义的引用。在第一份声明中，我说法官的意见令人担忧，因为它表明了对法律的某种漠视，因为法官首先不能更改《民法典》，而她正在更改它。同时，我提醒人们一个事实，负责保护法律的市长正在禁止对这一判决进行上诉。马克里告诉我说这是他的信念；我为此尊重他，但市长不必将他的个人信念转移到法律中。我没有在任何一刻对同性恋者发表过不尊重的话，但我确实干预了，并指出了一个法律问题。


    **斯尔卡：** 在民主国家中，一切都应该通过法律渠道，通过真诚、尊重和广泛的辩论来解决。每一方都应该以寻求与对手共同点的方式进行辩论，以便基于相互让步达成成功的判决。在法律通过之前，参与辩论的人中引用了“自然法”，这假定自然包含了调节人类行为的规则；这种信念的暗流是，上帝本人将这种法纳入了祂的创造物中。但任何同性恋者都有权说，要么是上帝要么是自然使他变成了现在的样子。还有人补充说，同性之爱更深层，因为他们了解女性爱和男性爱，尽管这并不意味着这就是家庭产生的方式。


    **贝尔戈廖：** 正如你所说，这场伟大冒险的一部分是相互解读我们。有一位牧师曾说，上帝造我们为男人和女人，是为了让我们彼此相爱彼此需要。在关于婚姻的讲道中，我通常告诉新郎要让妻子变得更像一个女人，告诉妻子要让新郎变得更像一个男人。


    '
