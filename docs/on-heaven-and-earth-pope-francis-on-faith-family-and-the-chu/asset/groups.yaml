    这是马歇尔性格中一个至关重要的角色。没有人能否认，存在着一个“马歇尔之前”和一个“马歇尔之后”，这不仅是因为他在人权斗争中所代表的意义，更因为他向我们展示了对待邻居的新方式，并因为他动摇了阿根廷犹太社区的精神基础。在他去世后，特别是最近的二十年里，发生了另一种变化。人们开始回归更正统的宗教形式。在三十四年前，现在的局面是不可想象的——回归一种更严格的修行方式，其中包含许多我不认同的方面。齐格蒙特·鲍曼（Zygmunt
    Bauman），这位创造“流动现代性”术说的著名欧洲社会学家准确地描述了我们所处的时代。他谈到了世界中缺乏确定性和承诺。正统填补了这些不确定性所留下的空白。事实是，事物从一个极端走向另一个极端。关于宗教的未来，我认为找到中道是至关重要的。某些真理是像“不可杀生”和“不可偷窃”那样稳固的。另一方面，变化和自由是生活的一部分，人必须能够独立思考并辨别是非，因为我们生活所道路并非一成不变的。


    **BERGOGLIO：** 每个宗教内部都存在某些领域，它们通过强调规范而忽视人性，将宗教简化为早晨、午后和晚上必须进行的祈祷，以及如果不这样做会发生什么。这对于信徒以及许多意志软弱的人是一种精神上的骚扰，可能导致他们缺乏自由。这些领域的另一个特征是，它们总是受到追求权力的驱动。具体到布宜诺斯艾斯，我们可以说它是一座异教城市，不是贬义意义上的，而是事实如此。它有许多崇拜的神，由于这种异教化的结果，它倾向于你提到的那种现象。当人们追求真实，而这种真实仅仅意味着规范和遵守规定时，它就陷入了另一个极端，陷入了一种同样并非宗教的纯洁主义。享乐主义、消费主义和自恋的文化确实渗透了天主教。它们感染了我们，并在某种程度上相对化了宗教生活，使其异教化、世俗化。这就是导致宗教淡化的原因；这也是我最担的。我始终认为基督教是一个小群，正如耶稣在福音中所说。当基督社区想要变得伟大并转变为世俗权力时，它就面临失去宗教本质的风险。这正是我所担心的。也许今天有人会说宗教的人变少了，但存在许多动不安，存在着严肃的宗教追求。在虔诚运动中也存在对上帝的寻找，这些是以通俗方式体验宗教体验的形式。例如，年轻人前往卢尚的朝圣。¹
    对于许多人来说，他们进入教堂唯一的时刻就是参加那场游行：60%的人是自己去朝圣的，并不是由教区的任何人带他们去的。有一种大众虔诚的火花召唤着他们；这是一个不容忽视的宗教现象。也许教堂里的人少了，但存在一种对承诺的净化。宗教追求没有消失，它仍在有力地继续，尽管在机构结构之外显得有些不功利。在我看来，宗教领袖面临的最大挑战在于知道如何引导这种力量。福音化是至关重要的，但不是传教；今天——多亏感谢主——传教已经从牧养词典中删除了。本笃迪十六世皇曾有一个非常优美的表达：“教会是一个通过吸引而非传教来达的建议。”这关乎一种通过见证带来的吸引。


    **SKORKA：** 犹太教从未传教过，但今天有一种我称之为“内部传教”的趋势。这并不是为了让非犹太人皈依宗教性的犹太生活方式，而是正统犹太社区试图将他们的机构带给其他犹太人。但我想停一下，回到你提到的其中一点，主教阁。宗教领袖应该知道如何处理这些兴趣的表达，以及如何引导那些自发出现的宗教运动。在我看来，这将是宗教未来的功能。我不认为宗教领袖应该对他的信徒有如此紧紧的控制，用铁拳统治他们。那是只有上帝能做的事，他用有力的手和伸出的手臂将以色列人带出埃及。让我们回到马歇尔·梅耶的例子。当他还在我们身边时，他是一位非常有魅力的领袖，但也许保守运动现在正因为我们领导层中心化带来的深远影响而遭受痛苦。也许由于标记他生活的经历，他别无选择，将他所建立的一切扛在肩上并独自向前。然而，这阻阻了他的追随者发挥他们的全部潜力。今天，阿根廷的生活不同了。我不喜欢那些过度魅力的领袖。对我来说，宗教领袖是一个老师，每当需要一个严肃且明确的回应来面对不公时，他就应该变得极其伟大。如果我们谈论拥有宗教情感是一种亲密的体验，老师不应该仅仅发表宽泛的声明，而应该对每个人都有清晰简洁的话语。我也不喜欢自大和自私，无论是政治领袖还是宗教领袖。大众教学的使用是近期宗教运动的一个明确部分，这些运动导致了大规模的屠杀。这就是为什么我认为我们在谈论新宗教运动时必须非常小心。当有人带来新的精神信息时，我们必须以最尊重的方式对待，但同时它值得负责组织的关注并研究其核心。任何运动的精神要求都不应导致与家庭的冲突，也不应该将个体禁在某种网中，使他们与社交或情感网络隔离。


    **BERGOGLIO：** 我尊重所有的新建议，但它们必须是真实的并接受时间的考验，时间将揭示它们的信息是暂时的还是会流传世的。经时间的考验是精神纯洁性的主要测试。


    ¹ 注：卢尚（Luján），卢尚圣母位于布宜诺斯艾斯西部约30英里的小镇，是阿根廷最受欢迎的玛利亚崇拜。布宜诺斯艾斯教区从1974年开始对这一流行圣地进行青少年朝圣。从那以后，每年都有超过70万年轻人于10月徒步前往圣地。


