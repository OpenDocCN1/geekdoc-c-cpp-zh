    In some things I am quite naïve, but in other things I have this time worked.
    I started to ask them what they had in mind for the project and they finished
    by telling me that they would give only half. Since regional vicars do not have
    bank accounts, and I told them that they would have to deposit the money directly
    to the diocese, they disappeared. When all is said and done, institutions are
