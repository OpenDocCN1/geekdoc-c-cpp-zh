    但曾有过双方互相残杀的时期；土耳其人被赶出了耶路撒冷这圣地……当天主教徒掠夺并摧毁君士坦丁堡时，你能给出什么样的神学解释？这是一项大罪，但在那个时代的文化背景下，他们做了那的事情。这表明了我们内心有时隐藏的残暴。在当时，有一种“传播信仰”的概念，这与征服者的罪孽联系在一起：信仰甚至是通过斩首的方式被强加的。我们不能从伦理纯主义的角度来分析历史。遗憾的是，历史一直都是如此，无论是否有信仰。这必须让我们保持谦卑。在那个时期，信仰与剑是并行的。历史分析必须根据那个时代自身的诠释学来进行，不是为了给事件辩护，而是为了理解它们。在事件发生当时的文化背景下分析历史至关重要。按照我们今天的生活方式来思考，例如亚伯拉罕献祭儿子以撒，，将是不可理解的。我们必须根据那个时期的观念和实践来研究历史。另一个重要问题是整体地分析历史过程，而不是停留在碎片化的解读上，因为碎片会被普遍化，取代整体并变成一个传说。正如人们所指出的西班牙人是糟糕——显然他们是来这些土地做生意并夺取黄金的——在征服时期，也有致力于传教和帮助他的人，比如巴托洛梅·德·拉斯卡萨斯（Bartolomé
