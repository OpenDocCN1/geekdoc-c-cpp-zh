  - '[PAGE 250]


    the religious experience. There are religious communities that run the risk of
    sliding unconsciously into an NGO. It is not only a question of doing such and
    such a thing to assist a neighbor. How will you pray? How will you help your community
    enter into the experience of God? Those are essential questions.


    **SKORKA:** Looking back in retrospect, parochialism began to appear in the Jewish
    community about forty years ago. Until the end of the 1960s, there was a network
    of schools that passed on Jewish culture, and there were Zionist youth movements
    that imparted all kinds of lessons in Hebrew, history and tradition—but there
    were no major new developments in spirituality. It was at that time that the Conservative
    Movement in Argentina began to spread and the idea began to grow that the temple
    could be a place for children''s activities as well as prayer. It is also where
    we could organize large campaigns to help neighbors in need. Another thing that
    I believe is important for me to add is that in order to achieve a deeper religious
    experience in the future, our religious leaders will need to show much more humility.
    All people, when they teach their children, should clarify that they are talking
    about their own truth, their own religious beliefs, and that they would like for
    their descendants to enhance and perfect it. It is also absolutely improper to
    devalue and dismiss another person''s religion and believe that only one''s own
