    ## 22. 关于金钱


    BERGOGLIO: 基督教以同样的力度谴责共产主义和野蛮的资本主义。私有财产是真实的，但它也带有一种义务，即在合理的范围内将其服务于他人。这种现象发生的一个典型例子就是资金流向国外。金钱也有祖国。一个人在一个国家经营业务，然后将这些钱带到该国之外，他就是在犯罪，因为他没有用这笔钱来报答他欠财富来源的国家，或者没有报答那些创造了这些财富的人。


    SKORKA: 圣经中包含一个经济计划，它在《利未记》一书中列出。⁸ 它说，每个人都有属于自己的耕地。如果所有者无法耕作，就可以将其租出去，但法律试图确保每个人对某些财产拥有不可剥夺的权利，以便每个人都能有尊严地生活的手段。无疑，历史经验表明，人需要工作的动力。我们必须审视苏联为什么会失败，那里仍然存在一个阶级维持权力并过着奢侈生活，而大部分人口生活在贫困中。废除私有财产无疑导致其失败的另一个关键因素。基布齐¹——二十世纪非常成功的实验性社会主义农业定居点——成为以色列国家的骨柱之一，并使以色列的建立和增长成为可能。然而，它们不再是驱动以色列经济的动力，他们正在寻找不同的经济和社会规划方法来生存。私有财产的概念，通过对财富的公平再分配来实现公平分配，似乎是正确的道路。这让我们回到了《利未记》中建议的法律和社会秩序。另一方面，当那些发展一个社会结构的人们眼中，唯一重要的事情是金钱之神和消费主义之神，并且他们未能将人类视为最终的、本质的受益者时，结果就是残酷的资本主义。只要资本被用于帮助人们，它是受欢迎的；但如果不是，则需要进行调整，目标是设计一个更公正的社会秩序。


    81 集体农


    **BERGOGLIO:** 从此我们理解了我们之间“社会债”这一概念的重要性。在每种用益物中都必须考虑社会债的维度。


    **SKORKA:** 我教我的学生，他们不需要对那些因为富有而傲慢、因为有钱就认为自己掌握局面的人表示尊重。当然，在组建教会时，为了建立它，你需要有资产的人，但这些钱必须是诚实获得的。“金钱没有名字”并不是事实。你不能用血钱来建立灵性。


    **BERGOGLIO:** 一位第一世纪传道者曾说过，巨大的财富背后总有犯罪。我不认为这总是真的。我同意你的观点，拉比：有些人认为通过捐款就洗清了良心。但在牧灵对话中，良心是通过另一种方式洗清的。正如我之前提到的，有时我会问忏悔的人是否给乞丐送钱。当他们说是时，我会继续问：“你直视他们的眼睛吗？你摸他们的手吗？”然后他们就开始胡扯，因为他们可能投了一枚硬币但转过脸去。这些是态度、手势。你要么与同胞团结生活，要么与你的不义之财生活。我们有第七诫：不可偷盗。然后，有些人有不义之财，想通过慈善行为还回去。如果行为没有改变或没有可证实的悔改，我绝不接受这种赔偿。否则，这个人只是洗清了良心，但行为依旧。曾有一位宗教主管被指控从毒毒贩那里收钱，他说他把这些钱用来行善，而不问来源。那是错误的。血钱是不被接受的。宗教与金钱之间的关系从未简单过。人们谈论梵蒂冈的黄金，但那是博物馆里的。而且，我们必须区分博物馆和宗教。宗教需要钱来管理其事务；这是通过银行进行的，是合法的。重要的是人们如何使用收到的舍捐或捐。梵蒂冈的财务是公开的；它一直处于亏字状态。捐款或参观博物馆的收入会流向麻风人医院、学校以及非洲、亚洲和拉丁美洲社区。


    SKORKA: 创建完美的机构是不可能的，即使是宗教机构也是如此，因为人是不完美的。每个人都是矛盾的。神父、牧师和拉比由于各种原因被宗教机构吸引。可能是为了自我完善，或者作为行使自控的一种，但在某些时刻他们会偏离轨道。并不是每个神职人员都表现得完美无缺，这不应该损害宗教的本质。仅仅因为一个人犯了错，并不意味着可以推断整件事都是虚伪的。我们需要做的是去芜存菁。事实是，对宗教的要求更高，因为它基于道德。任何谈论忠诚却做出与道德价值观不符之事的人都是双重错误，就像一个不公正判决的法官，破坏了他的公民对司法系统的信任。在独裁时期，那些负责打击游击队的人有双重罪责，因为他们完全偏离了轨道并忽视了正义。他们对阿根廷造成的破坏是可怕的，除了他们给许多家庭心灵造成的痛苦。同样的情况也可以适用于-


