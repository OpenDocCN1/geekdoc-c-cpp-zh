    教会与权力的关系。另一个缺陷在于慈善工作，就像来自《马菲尔达》（*Mafalda*）小苏珊，$100$就会做的那样：“我举办茶会筹款，准备了许多三明治、茶点和其他美食，就为了买到玉米糊、面条和那些穷人吃的垃圾吗？”这种慈善既不是基督教的，也不是社会的，它并非源于信仰。正如你所说，，拉比：如果今天一位神父宣讲阿司伯，并将其翻译成波特诺语$^{101}$以便让人们听懂，他们会将他判为共产分子、激进分子，并几乎要把他关进监狱。上帝的话在社会正义方面远比我们自己所能做的、能说的，或我们自己的社区愿意容忍的要强大得多。这令人印象深刻。在70年代，一切皆有，但社会参与非常繁荣。那时，神父不能从事像小苏珊那样的慈善，而是必须与贫困者并肩作战。发生的是，在某些情况下他们陷入了意识形态化的陷阱。有些神父后来离开了圣职，并且


