    作为一份礼物。照片是我们两个人的，是在我们其中一次会议上拍的。我惊讶得说不出话。我找到了之前问题的答案。


    正是在那次会议上，我们决定写这本书。


    尽管每位拉比在培训期间都会对上帝许下特殊的承诺，但一旦他开始担任律法教师的职业，他就有义务比任何其他犹太人更去树立榜样，向人们展示一个人如何履行他们对造物主的义务。正如先知们在独处经历精神升华时刻后所的那样，拉比应该回到群众中，根据这种获得的灵性来教导他们。毕竟，根据圣经教义，一个人通过自己获得的精神生活维度，只有在被用于帮助他人时才具有意义。


    尽管拉比们更频繁地使用口头交流，但始终存在着内在的挑战，如何捕捉并提炼这些思想，使其能够记录在纸上。语言会随着时间的推移而变得模糊或扭曲。书面思想则变成了永久的见证，让更多的人能够接触到它们。


    当我与贝尔格利奥主教在一起时，这两个教训就合而为一了。在我们的聊天中，主要的课题和关注点一直是、也将继续是个人以及他们的问题。我们让对话自然流淌，而不是遵循书面的议程。因此，将我们亲密的对话以书的形式表现出来，意味着我们彼此必须轮流加强我们之间的纽带。我们将对话转化成了一场群体对话，暴露了我们的灵魂。我们接受这其中包含的所有风险，但深信地认为，这是我们理解做人的意义、不断接近上帝的唯一途径。


    ## 如镜子般的立面

    豪尔赫·贝尔格利奥（Jorge Bergoglio）


    拉比亚伯拉罕·斯尔卡（Abraham Skorka）在他早期的著作之一中，提到了大大主教堂的立面，那里描绘了约瑟与他兄弟的相遇。几十年的误解汇聚在那个拥抱中。他们之中有哭泣，还有一个亲切的提问：我的父亲还活着吗？在国家组织时期，⁵，这是他们提出的形象，而且并非缘无故。它


    ⁵ 编者注：国家组织（organización nacional）标志着阿根廷历史上1852年至1880年间的一个时期。在此期间，通过了一部宪法，定义了政府的联邦性质。教育和通信也得到了极大扩张。尽管这被视为锻造了阿根廷力量和认同的时代，但它伴随着社会动荡。


    代表了阿根廷人对重聚的渴望。这一场景旨在建立一种“相遇文化”。我多次提到，作为阿根廷人，要巩固那种“相遇文化”是困难的；相反，我们似乎被诱向了分散和历史创造的深渊。有时，我们更愿意认同自己是围墙的建造者，而不是桥梁的建造者。我们缺乏那种拥抱、哭泣和对父亲的提问，为了我们的婚姻，为了我们祖祖的根基。对话是缺失的。


    阿根廷人真的想要对话吗？我不会那样说。相反，我认为我们屈服于某些让我们无法对话的姿态：统治、不知如何倾听、言语中的烦躁、先入为主的判断以及许多其他。


    对话源于对他人的尊重态度，源于对对方有良话可说的信念。它假设我们可以在自己的心中为他们的观点、意见和建议留出空间。对话意味着温暖的接纳，而不是先发制制的谴责。要对话，必须学会放下防御，打开家的大门并提供温暖。


    日常生活中有很多阻碍对话的障碍：错误信息、八卦、偏见、诽和诽谤。所有这些现实构成了某种文化煽情，淹没了对他人开放的任何可能。因此，对话和相遇停滞了。


    但大主教堂的立面依然在那里，像一个邀请。


    斯尔卡拉比和我能够进行对话，这让我们受益匪浅。我不记得对话是如何开始的，但那是自发性的。我曾开玩笑地问他，在河床队（River Plate）之后，我们是否会去“吃汤”（hen
    soup）？⁶。在独处时反思，我发现我们的对话是毫无障碍的。与斯尔卡拉比在一起，我从未放弃过我的天主教身份，正如他从未放弃他的犹太身份一样，这不仅由于我们彼此的尊重，也源于我们的跨宗教对话。


    > ⁶ 编者注：河床队（River Plate）是阿根廷最受欢迎的足球队之一。对手是博卡青年队（Boca Juniors）。“吃汤”（cazuela de
    pollo）等同于英语中的“eating crow”。


    这本书是对那条道路的见证。我将斯尔卡拉比视为兄弟和朋友；我相信，我们在上帝面前行走，并追求无瑕。


    ## 关于天与地


    ## 1. 关于上帝


    **斯尔卡**：我们相识多年了，我们之间已经建立了某种纽带。在学习塔姆德时，我发现一种观点认为，友谊意味着分享和共处，但最终它指的是向对方揭示内心的想法。这就是我们之间发生的情况。我相信，让我们聚在一起最重要的因素过去是、也将是上帝，祂让我们的道路交汇，并允许彼此敞开心扉。尽管我们在日常对话中涉及了许多话题，但我们从未明确讨论过上帝。当然，我们总是意识到祂的存在。最好从我们计划留留作为见证的对话开始，讨论那位在我们生活中如此重要的人。


    **贝尔格利奥**：“道路”这个词用得棒了！在与上帝的个人经验中，我无法离开道路。我认为遇到上帝是在行走、移动、寻找并允许自己被寻找的过程中。这是两条交汇的道路。一方面，是我们寻找祂的道路，受内心流出的本能驱动；而，当我们相遇时，我们意识到祂一直在寻找我们。最初的宗教经验是行走的：走向我要给你的土地。⁷
    它是上帝对亚伯拉罕许下的承诺。在那个承诺中，在此时，在行走中，建立了一种随时间巩固的联盟。正因如此，我说我与上帝的经验发生在道路上，无论是寻找还是允许自己被寻找，即使那是通过不同的路径——痛苦、快乐、光明或黑暗。


    ⁷ 创世记 12:1

    ⁸ 创世记 17:1


    **斯尔卡**：你所说的让我想起了几节圣经经文。例如，当上帝告诉亚伯拉罕：“在我面前行走，完全无缺吗？”⁸ 或者当先知米迦需要向以色列解释上帝想要什么时，他告诉他们“行公义”。


