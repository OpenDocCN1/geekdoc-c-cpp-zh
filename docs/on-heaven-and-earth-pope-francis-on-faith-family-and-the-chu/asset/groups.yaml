    # 12. ON THE ELDERLY


    SKORKA: Old age has never been easy. I will start off with the scene in the Bible
    where Jacob tells Pharaoh that he has lived a short, difficult 130 years. Old
    age is problematic because instead of looking toward the future, we begin to look
    back at the past. Still, it can be a wonderful time in our lives if we have really
    lived fully and with intensity, because by then we will have come to understand
    the meaning of life. However, today old age is something we worry about because
    in the present culture the elderly are treated as disposable material. Modern
    life, instead of allowing people a little more time to relax, has got them running
    faster and faster. It is not just a matter of material wealth; going to the gym,
    traveling and other activities have


