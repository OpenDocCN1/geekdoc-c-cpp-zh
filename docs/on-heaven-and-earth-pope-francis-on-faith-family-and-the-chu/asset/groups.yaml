    G-d says we have to respect neighbors as we ourselves. When Jews say their daily
    prayers, they begin this way: “Our G-d and G-d of our fathers, G-d of Abraham,
    G-d of Isaac and G-d of Jacob..” Why do we have to repeat the name of G-d prior
