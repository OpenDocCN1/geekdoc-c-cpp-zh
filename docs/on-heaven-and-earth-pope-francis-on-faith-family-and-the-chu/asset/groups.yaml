    ## HOW WE EXPERIENCE DIALOGUE\n\nAbraham Skorka\n\n“And G-d said to them..” It’s\
    \ the first recorded conversation we encounter in the Bible. Humans are the only\
    \ creatures to whom the Creator speaks in this manner. In the same section of\
    \ Genesis we are shown that each of us has a special capacity to relate to nature,\
    \ to our fellow man, to ourselves and to G-d.\n\nOf course, these relationships\
    \ which man is inclined to form are not like watertight compartments which are\
    \ independent of one another. Our relationship with nature results from our observations\
    \ and the detailed handiwork that we observe; relationships with our fellow man\
    \ are based on our interests and life experiences; and our relationship with G-d,\
    \ which comes from deep inside our being, is a result of self-dialogue, and is\
    \ nurtured by all the other relationships mentioned above.\n\n1 Genesis 1:28\n\
    \nTrue dialogue is at the heart of the thinking man’s life and demands that each\
    \ person tries to get to know and understand the person with whom they are conversing.\
    \ As Ernesto Sabato expressed in his unique style in the prologue to his book\
    \ One and the Universe,³One sets off for distant lands, or seeks the knowledge\
    \ of man, or investigates nature, or searches for G-d; only afterwards does he\
    \ realize that the phantom he was chasing was Himself.”\n\nWhen conversing with\
    \ one’s fellow man, words are merely vehicles for communicating, although even\
    \ in societies where everyone speaks the same language, the exact same words can\
    \ take on somewhat different meanings. Each person adds their own nuance to many\
    \ of the words they use, which then become part of the linguistic heritage. Dialogue\
    \ requires that each participant become acquainted with the other person.\n\n\
    > “G-d’s candle is man’s soul which reveals the innermost parts of his being.”⁵\
    \ In its most profound sense, to have a conversation is to bring one’s soul nearer\
    \ to another.\n\n2 Uno y El Universo Edición definitiva, Seix Barral, Buenos Aires,\
