    ## 7. ON PRAYER


    SKORKA: Prayer should serve to unite people because it is a time when we are all
    on the same page. What is more, according to our law, prayers become more powerful
    if they are recited together by at least ten Jews. Prayer also serves as an act
    of identity. We pray using the same terms, in the same way and seeking the same
    results as everyone does. Beyond all that, prayer has to be an act of profound
    introspection, when we need to look within ourselves, find our interior life,
    and start a conversation with G-d. It is not an easy thing to do so since we have
    to differentiate between our own voice and G-d''s. When someone studies the Bible
    in depth, they do so to find guidelines that make it easier to differentiate between
    the two. At its core, getting closer to G-d is the goal of every mystical experience;
    to feel Him in some way, which is an essential interior condition for prayer.
    The verb “to pray” in Hebrew is “Ihtpalel,” which means to judge oneself. Every
    time we want to get closer to G-d, the first thing we have to do is determine
    what our personal defects are.


    **BERGOGLIO:** Prayer is an act of freedom, but sometimes it emerges as an attempt
    at control, which is the same as wanting to control God. That has to do with a
    deformation, with an excessive ritualism or with many other attitudes of control.
    Prayer is talking and listening. There are moments of profound silence, adoration,
    waiting to see what will happen. In prayer, there coexists this reverent silence
    together with a sort of haggling, like when Abraham negotiated with God for the
    punished citizens of Sodom and Gomorra. Moses also bargains when he pleads for
    his people, he hopes to convince the Lord not to punish his people. This attitude
    of courage goes along with humility and adoration, which are essential for prayer.


    **SKORKA:** The worst thing that can happen to our relationship with G-d is not
    that we fight with Him, but that we become indifferent. A religious man, even
    in the worst of times, will continue talking to G-d, just as thousands of people
    did when they went into the gas chambers to die, shouting “Hear O Israel, The
    Lord is God, The Lord is One!” which is our declaration of faith. Despite everything,
    they continued believing in Him. For our Yom Kippur (Day of Atonement) prayer
    service, we have incorporated a story³8 about a document that was found in the
    ruins of the Warsaw Ghetto, in which the author relates that his wife and sons
    had died and that he is the only member of his family to have survived. He addresses
    G-d with a great deal of pain, yet there comes a part when he says that however
    much he is put to the test, he will continue to believe in Him. That is true faith.


    **BERGOGL:** The indifference has many forms. When liturgical acts slide into
    social events, they lose force. A good example is the celebration of a marriage,
    which in some cases might lead someone to ask what is religious about that ceremony,
    because the minister preaches values, but many people are tuned to a different
    frequency. They get married because they want God’s blessing, but that desire
    seems hidden and does not become visible. In some churches—and I do not know how
    to cure it, honestly—in the weddings there seems to be a fashion. This story was
    written by Zvi Kolitz, published in *Fondo de Cultura*, Buenos Aires, 1998.


    **SKORKA:** It is interesting how we arrived at the issue of indifference and
    money by starting with the issue of prayer. In Judaism, there is no separation
    between body and soul. Everything we do with money should be an expression of
    our feelings. Not everything having to do with money is bad; it depends on how
    it is used. It changes into something evil when it becomes an end in itself.

