    **SKORKA:** 和你一样，你必须为你生活的每个阶段做好准备，包括老年。从精神角度来说，学习如何作为一个老年人生活通常非常困难，因为有些人在时间到来时并没有准备好，所以他们让一生所有的挫折和偏见生长并溃化。当我们还是孩子时，有父母为我们树立榜样，试图提供教育以及我们应该如何生活的模式。在某个时刻，意识到我们的父母改变了是非常重要的。如果父母在老年仍能保持智力上的敏锐，那是极好的，因为那时你可以保持对话。我记得我的父亲晚年时比生活中其他任何时候都要明智。他离开世界的方式对我来说是一堂关于尊严的课，但情况并不总是如此。有时人们会退缩，社会面临的巨大挑战在于如何处理这些情况，使我们能够参与其中并维持关怀的关系。如果孝敬父母那么容易，就不需要神圣的诫命了。我们新兴的消费性社会导致了老年人由于我们的忽视而放弃。当我说“放弃”时，我指的是任何放弃生命的人，无论是通过安乐死还是自己的退缩。


    **BERGOGLIO:** 《申命记》26章一直给我留下深刻印象；我的灵魂从这一段话中受益良浅：“当你进入上帝赐给你父母的土地，当你住在你没有建造的房屋里，当你吃着你没有种的树上的果实时……”它继续列举许多并非人所造但却拥有的东西。看着老年人，就是承认人类规划了自己的道路。观察老年人是承认人类规划了他们的生命道路，上帝的整个计划始于祖先，一直到后代。当我们认为老年开始时，我们停止了尊重。经常，当我轻视老年人时，《申命记》的这一章让我意识到，我只是一个环节，我必须尊重那些在我之前的人，以及将跟随我的人。这是最强有力的行动之一。老年人无论有意识还是无意识，都必须留下一份生命的证言；他并没有明确这一点，但他那样生活。我很幸运能认识我的祖父母，当第一代人去世时，他们给了我很多，我记忆深刻。老年人的智慧帮助我很多，正因为如此，我们又一次倾向于尊崇他们。


    13. 关于女性


    **BERGOGLIO:** 在天主教中，例如，许多女性领导着字句的工作，但并不行使祭职，因为在基督教中，大祭司是男性。在神学传统上，祭职通过男性传递。女性在基督教中还有另一个功能，反映在玛利亚的身上。这种包容的形象是社区的母亲。女性拥有母性的慈爱；如果这些财富没有被整合，宗教社区不仅会变成男权主义的，而且变成一个严苛的。女性无法行使祭职这一事实并没有让她们比男性低。此外，在我们的理解中，圣女玛利亚比使徒更伟大。根据二世纪的文献，基督徒中有三个维度：女性在教会的存在没有被强调，因为男权主义的影响没有让社区的女性变得可见。


    **SKORKA:** 基督教采纳希伯来圣经中的祭职角色，其中是父系的。然而，母系决定了一个人是否是犹太人——如果母亲是犹太人，孩子就是犹太人。根据我们的信仰，祭礼过去也由男性执行。今天，拥有律拉法知识的女性可以教导他人并回答如何按照犹太律行动。


    **BERGOGLIO:** 天主教徒，当我们谈论教会时，我们是用女性的术语说的。基督与教会订婚，一个女性。受到最多攻击的地方、受到最多打击的地方，是最重要的。人性的敌人——撒旦——在更多救赎、更多生命传递的地方击得最重，而女性作为一个存在的地方，被证明是历史上受攻击最多的。她一直是利用、利润、奴隶的对象，并被边缘化；但在经书中，我们有英雄女性的，向我们传递了上帝对她们的想法，比如路得、朱迪特……我想补充的是，女权主义作为一种独特的哲学，并没有给它声称代表的人带来好处，因为它把女性置于报复性战斗的高度，而女性远比这得多。20世纪的女权运动实现了她们想要的，这已经结束了，但持续的女权哲学没有给予女性应有的尊严。作为一个漫画，我会说它面临变成裙中男权的风险。


    **SKORKA:** 在传统主义（Masorti）运动中，女性的宗教角色发生了变化。世界各地的拉比学院授予女性拉比头衔。事实是，从历史角度来看，法律并没有禁止女性教导律法，也没有任何理由拒绝她们拉比头衔。当我们观察圣经和塔木德文学中女性的角色和刻画时，有很多属性与你所说的相符。塔木德包含了婚姻契约，其原始思想是，我们所说的一千多年前的女性——有一份防止男性轻易离婚她的的文件。这意味着这样做会让男性面临巨大的经济困难，这是一个务实的问题。其意义是什么？是为了保护女性并确保她有尊严地生活。


