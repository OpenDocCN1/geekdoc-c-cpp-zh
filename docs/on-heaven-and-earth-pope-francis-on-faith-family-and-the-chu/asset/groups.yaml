    Cívica Radical）的领袖。


    53


    ## 7. 关于祈祷


    SKORKA：祈祷应当起到团结人们的作用，因为这是我们所有人达成共的时刻。此外，根据我们的法律，如果至少由十位犹太人共同诵读，祈祷会变得更加强大。祈祷也是一种身份的体现。我们使用相同的术语、相同的方式并寻求与所有人相同的结果来祈祷。除此之外，祈祷必须是一种深层内省的行为，我们需要审视内心，发现内在生活，并开始与上帝对话。这并非易事，因为我们必须将自己的声音与上帝的声音区分开。当有人深入研读圣经时，他们是为了寻找更容易区分这两者的准则。从核心上说，接近上帝是每种神秘体验的目标；以某种方式感受到祂，这是祈祷中必不可少的内在状态。希伯来语中，“祈祷”的动词是“Ihtpalel”，意为审判自己”。每当我们想要接近上帝时，要做的第一件事就是确定我们的个人缺陷是什么。


    **BERGOGLIO：**祈祷是自由的行为，但有时它会表现为一种控制的尝试，这等同于想要控制上帝。这与变形、过度的仪式主义或其他许多控制态度有关。祈祷是说话和倾听。那里有深沉的沉默、崇拜，以及等待结果的时刻。在祈祷中，这种敬畏的沉默与一种“讨价”并存，就像亚伯拉罕为所多玛和蛾摩拉受罚的公民与上帝谈判一样。摩西在为他的人民哀求时也在讨价，他希望说服主不要惩罚他的子民。这种勇气的态度与谦卑和崇拜并存，而这些是祈祷至关重要的。


    **SKORKA：**我们与上帝关系中最糟糕发生的事情不是我们与祂争吵，而是我们变得冷漠。一个宗教人士即使在最黑暗的时期也会继续与上帝交流，正如成千上万的人进入毒气室死亡时喊着“听啊，以色列，耶和华是主，耶和华独一！”这是我们的信仰宣言。尽管如此，他们仍然相信祂。在我们的赎罪日（Yom
    Kippur）祈祷仪式中，我们加入了一个故事³8，关于在华沙犹太区废墟中发现的一份文件，作者在讲述了他的妻子和儿子已经去世，他是家中唯一的幸存者。他带着巨大的痛苦面对上帝，但随后有一部分他说，无论受到多大的考验，他都会继续相信祂。那是真正的信仰。


    **BERGOGL：**冷漠有许多形式。当礼拜活动变成社交活动时，它们就失去了力量。一个很好的例子是婚礼庆典，在某些情况下可能导致人们质疑那个仪式有什么宗教意义，因为牧师传讲的是价值观，但许多人的频道不在那上。他们结婚是因为想要得到上帝的祝福，但这种愿望似乎是隐藏的，并没有变得可见。在一些教堂里——老实说，我不知道如何解决这个问题——婚礼似乎变成了一种时尚。这个故事由齐维·科利茨（Zvi
    Kolitz）撰写，于1998年于布宜诺斯艾利斯的文化基金（Fondo de Cultura）。


    **SKORKA：**从祈祷问题开始引出冷漠和钱的问题，这很有趣。在犹太教中，身体和灵魂没有分离。我们用金钱所做的一切应该是情感的表达。并不是所有与钱有关的都是坏的；它取决于如何使用。当它变成目的本身时，它就变成了邪恶。

