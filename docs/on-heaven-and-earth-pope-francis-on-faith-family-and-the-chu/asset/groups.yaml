    以某种方式，向他提议：“向你的百姓宣扬上帝的奇迹。”正因为如此，“召唤”（vocation）一词才至关重要。也存在对召唤或使命的拒绝或回避。在福音书中，最常见的经典例子是那个年轻人。耶稣同情地看着他，爱他，并告诉那个年轻人，如果他想更密切地跟随他，就必须卖掉自己所有的，全部给穷人，然后跟随他。那个年轻人变得非常忧伤，因为他富有，没有这样做。耶稣邀请他，呼唤他，但那个年轻人并没有被触采取那一步；这是一次被阻断的召唤。在福音书中，耶稣说：“不是你们选了我，而是我选了你们。”


    有必要有一个关键的初步辨别；这就是我们在基督教灵修中所谓的“正的意图”。换句话说，取决于你带着什么意图而来；这并不是说有人会像冒充者那样带着坏意来，而是存在一些无意识的动机，可能会变成狂热或其他事物。在成圣过程中，必须纯净正意图，因为没有人——即使是那些发现自己被召唤的人——能做出完全正直的回应；这种回应是混合的，因为我们都是罪人。


    **SKORKA：** 《申命记》²⁵中有一个非常有意思的章节，指导我们如何区分假预言者和真预言者。


    塔木德说，即使是假预言者也能产生超自然的迹作为其声称之事的证明。《申命记》中的那段话非常重要。它说，假预言者是那些想要引导你偏离上帝、公公义和尊重生命的道路的人，它描述了许多测试来判断情况是否如此。那么，当面对一个有时（无论是有意还是无意）利用包裹在宗教语言之中的巨大心理力量使他的社区走向毁灭的领导者时，会徒可以做什么？圣经中有不同的章节处理这个问题，其信息是人们要小心；远离那些会征服你的心并将你困入其掌中以控制你的思想和欲望的东西。回到我之前提到的《申命记》那段话——每个人都应该审视任何预言者信息的核心。如果它与正义、恩典和和平不和谐，他的信息就是虚假的，应该被拒绝。会徒判断某人想要限制他们的内在自由并奴役他们的方法之一，就是领导者以绝对确定的语气说话——“上帝告诉我这个和那个，这必须是这样。”对于那些表现得他们所说的一切都是绝对正确的老师也是如此。如果他们这样做，你就不能信任他们。信仰的教导是以谦卑传递的。必须总要留有怀疑的空间。在《耶利米亚书》第27章中，上帝告诉预言者，必须继续忍受尼布甲尼撒的轭，祂命令耶利米亚在自己肩上套上轭，作为给百姓的信号，说明他们不应该计划任何反叛。不久后，另一个预言者哈拿尼亚·本·阿苏尔出现了。他从耶利米亚肩上拿掉轭并折断。耶利米亚没有通过告诉他上帝说过要做些别的事来阻止他，他接受了哈拿尼亚的行为。耶利米亚随后转身回了他的私人生活，再次与上帝交谈，上帝再次确认了他最初说的话是正确的；百姓应该继续背负巴比伦帝国的轭。这向我们展示了两点。第一，上帝是动态的，可以改变祂的旨意。圣经说：“回到上帝那里，好让上帝改变祂定旨。”这就是《约拿书》的信息。我们不能用绝对的术语来论上帝和祂的信息；信仰的行为包含了对怀疑所提出的解释建议。这个故事教给我们的另一个概念与定义宗教领导者最重要的术语有关——律法中明确适用于摩西的唯一美德——谦卑。任何骄傲且缺乏谦卑、说话傲慢且用绝对化语气的宗教领导者都不是好的宗教领导者。一个傲慢、不知道如何与人相处、反复说“我是”的领导者不应该是一个宗教领导者。


    **BERGOGLIO：** 但有的，有的。“请告诉我，女士，”这是我那个时代卡蒂塔（由尼尼·马歇尔扮演的角色）说的。²⁶。我喜欢你关于怀疑的说法，因为这直接关系到任何想在上帝面前保持正直的人都会有的经历。上帝百姓的伟大领袖是那些留有怀疑空间的人。回到摩西，他是世上最谦卑的角色。在上帝面前，没有人比他更谦卑了，而且他想要成为上帝百姓的领导者必须给上帝留下空间；因此收缩、退回到内心，带着怀疑、带着黑暗的内在体验、带着不知如何所措，这一切最终是非常纯净的。坏的领导者是自负且固执的。坏领导者的特征之一是由于他的自负而过度规范化。


    **SKORKA：** 怀疑是信仰的必要要求。事实上，信仰产生于我们对怀疑的感觉。我感觉到上帝，我感受到祂，我与祂交过许多道，但对我们信仰至关重要的是我们继续寻找祂。我对祂有99.9%的确定，但永远不会是100%；我们用尽一生去寻找祂。对于犹太人来说，信仰正是通过这种怀疑创造的。在大屠杀之后，我们问自己上帝如何可能抛弃我们。如果祂代表完全的正义，为什么祂不干预呢？祂不是总是伴随着义人和受苦的人吗？这些是约伯在，当他问上帝为什么他的儿子死了，为什么他失去了健康，以及为什么他尽管是一个善良公义的人却失去了一切时同样的问题。在每种情况下，上帝的回应都是：“我有人类无法理解的理由，而怀疑将永远留于人那里？”


    **BERGOGLIO：** 我一直被约伯提到的那句话所吸引：“我从从中听见你，但现在我的眼看见你了。”²⁷. 经过考验后，谦卑在理解中增长。拿起宗教神职这一主题，谦卑是确保主在场的保证。当一个人自给自足时，当他对每个问题都有答案时，这证明上帝不在他身边。自给自足在每个假预言者身上显而易见，对于那些为了自我利益利用宗教的错误领导者也是如此。这是宗教伪君的姿态，因为他们谈论高于万物的神灵，但他们并不履行祂的命令。耶稣对信徒说，指代这样的人：“所以，凡他们叫你们做的，你们都要遵守，但不可效法他们的榜样。”²⁸。


    ---

