    Israelita Argentina）的成立，该组织与佩农主义立场。20世纪30和40年代对犹太人来说不是容易的时期。教会内部有一些反对我们社区的团体，发表了一些非常严厉的声明。存在极民族主义的反犹太团体——那与现在完全不同。


    **BERGOGLIO：** 这是一个民族主义巅峰时期，以某种不公正的方式与天主教融合在一起。即使在今天，也有杂志发表民族主义文章，并在其中指责我堕入异端，因为我与其他领域对话，但我想强调欧洲犹太人带来的社会维度，并分享一个轶事：有一天，一位老人走到了我面前。他介绍自己并告诉我他是代表退休人员来的。那是朱利奥·利伯曼先生（Don
    Julio Liberman），他是佩农时期裁缝工会的前任主任。他是一个共产主义者，阿根廷人，波兰父母的后代。他小时候回过波兰，但他回到这里入伍并留了下来。我们开始交谈，我发现他非常友好，而且总的来说态度非常好；我们偶尔会聊聊天。有一次他告诉我他对我诚实，他不是一个信徒。他属于你提到的那群社会主义犹太人。他当时92岁了。他是一个坚毅的犹太人，那种在因为年龄原因离开工会后，继续代表退休人员奋斗的人。那些那些犹太人带来的社会斗争产生了巨大的影响，它激发了阿根廷的社会良知。我怀疑大多数并不是信徒，正如朱利奥告诉我的那样。


    SKORKA：不，他不是信徒。然而，如果我们诚实地思考，我们知道很难对信仰结束和意识形态开始给出确切的定义和界限。有人可能会说那些犹太人都是社会主义者，因为他们出身寒门；他们骨子里感受到贫困和社会不公的痛苦。但也有人生活在同样的条件下，却没有变成社会主义意识形态学家。与此同时，我好奇那些与上帝抗争的人，圣经中的社会主义思想对他们到底有多大的影响，考虑到先知们特别是阿摩司、耶利米和以赛亚以神的名传递了非常清晰的信息，呼唤人们良知以确保社会公正。这引发了另一个疑问。也许他们并不是在与上帝战斗；可能是在反对宗教结构。


    BERGOGLIO：确实如此，对于来自天主教传统的社会主义者来说，他们背离宗教并为社会事业奋斗；他们通常与宗教结构发生冲突，在宗教生活方式上某些信徒——没有成为桥梁——反而变成了墙。他们成了自己信仰的障碍，因为他们为了自己的利益、自己的意识形态或仅仅为了适应自己而利用它。我们可以把某些领域所做的世俗安排视为一种缺陷。


