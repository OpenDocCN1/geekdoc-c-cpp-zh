    We complete in our suffering what is lacking in Christ''s Passion.


    **SKORKA:** It is also found in Talmudic thought. When we study the death penalty
    in the tractate of Sanhedrin, it says that even when a transgressor is punished
    with the death penalty, G-d suffers along with him.80 Even at the moment the punishment
    is met out, G-d is with him. I agree with you whole-heartedly.


    **BERGOGLIO:** In the book that I just mentioned, I discovered terrible things.
    They removed teeth from the Jews, they cut their hair and went to the extreme
    of choosing other Jews to take over these tasks. They led them to apostasy; it
    was a way to transfer the blame to them. One satanic detail: it was no longer
    the Nazis'' fault, but rather the Jews themselves. The subtlety and the hate that
    is behind all of this is stunning.


    **SKORKA:** Monsignor, what do you think how the Church acted at the time?


    ^89 Mishna Sanhedrin 6:5


