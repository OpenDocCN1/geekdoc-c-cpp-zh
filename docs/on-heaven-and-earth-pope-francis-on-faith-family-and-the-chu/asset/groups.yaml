    # 11. ON EUTHHANASIA


    **SKORKA:** Without a doubt, we have to support the medical sciences so that people
    can live better. But be careful! In no way should we support futile medical care.
    Artificially extending someone''s life by hooking them up to machines for the
    sole purpose of sustaining their heartbeat and breathing does not make the least
    bit of sense. It just creates added stress for the family members keeping vigil
    over terminally ill loved ones. Yes, we should prolong life, but only for those
    who are fully alive.


    **BERGOGLIO:** Our morality also says that one has to do what is necessary and
    ordinary, in those cases where the end is in foreseeable. Quality of life must
    be ensured. The strength of medicine, in terminal cases, is not so much about
    making someone live another three days or two months, but rather in making sure'
  - '[PAGE 113]


    the body suffers as little as possible. You are not obligated to conserve life
    with extraordinary methods. That can go against the dignity of the person. But
    active euthanasia is different; that is killing. I believe that today we covert
    euthanasia: our social security pays up until a certain amount of treatment and
    then says “may God help you.” The elderly are not taken care of like they should
    be, but rather they are treated as discarded material. Sometimes they are deprived
    of medicine and ordinary care, and that is what is killing them.


    **SKORKA:** We clearly agree that we should not allow any procedure that is an
    affront to human dignity. Euthanasia is a very difficult subject because there
    are people who are really living in horrendous conditions and are looking for
    whatever way they can to cut their life short. Active euthanasia sends a message
    that we are the sole owners of our bodies and our lives; for that same reason
    we do not approve of it. We believe that G-d is still the master of our existence,
    regardless of the fact that He gave us free will. When someone commits suicide,
    at that moment they are saying that their being belongs to themselves; they are
    the ones who decide matters of life and death. It is a serious rejection of G-d.


    **BERGOGLIO:** There was a time when they did not perform funerals for those that
    committed suicide because they had not continued toward the goal; they ended the
    path when they wanted to. But I still'
- md: '

    respect the one who commits suicide; he is a person who could not overcome the
    contradictions in his life. I do not reject him. I place him in the merciful hands
    of God.


    **SKORKA:** In Judaism there are two points of view respect to suicide. The first
    teaches that someone who commits suicide should be buried in a separate place
    and we omit certain prayers that are customarily recited in memory of the deceased.
    The other view is that perhaps people who kill themselves, at the very last moment,
    after they have already “pulled the trigger,” repent for what they have done.
    They should be judged as if in their final moment they had committed an involuntary
    act, which is something that does not get punished. Another way to look at it
    is that it is a contagious disease that condemned them to death. Each time I have
    had to deal with a suicide, my explanation to the family was that the deceased
    had an illness, that they were very confused and had no idea what they were doing.
    It is the worst possible effect of depression that results from a chemical imbalance
    in both the body and the mind. They feel that they need to depart from this life;
    that they cannot go living. When people ask me heartbrokenly, “Did I mean so little
    to him or her that they decided to leave me for forever?” I try to restore their
    loved one’s status and good name.


    **BERGOGLIO:** I like this interpretation of the sickness. There arrives a moment
    when someone cannot take responsibility for every decision that they make. I prefer
    to interpret suicide like this, and not as an act of pride, but I would like to
    go back to euthanasia; I am convinced that now we are seeing covert euthanasia.
    The patient must be given everything necessary and ordinary to be able to live
    there while there is hope for life. In terminal cases, it is not obligatory to
    do the extraordinary. Moreover, even though there is life expectancy, extraordinary
    measures, for example, the insertion of a breathing tube to give someone a few
    more days of life, are not obligatory.


    **SKORKA:** Speaking from the Talmud, I would say that using extraordinary measures
    means not letting someone die. If there is something, anything, that can keep
    them alive—do not stop it. But if we know that a patient does not have any cerebral
    activity, and a strict protocol has been followed to ensure that there are not
    any vital signs, they should slowly, very carefully, start turning off the machines.
    I am totally against futile efforts at life support. The rules that make up Jewish
    law, the *Halacha*, say that it is allowable to remove anything that is used to
    keep someone alive if they would otherwise die without it. That is to say that
    if the placement of a pillow under someone''s head is the only thing preventing
    someone from dying, then take it away. If it is salt under their tongue, take
    it away. Debating futile life support is something totally different than active
    euthanasia. When there is nothing that can be done, it is not right to pumping
    drugs into someone to artificially keep them alive. I respect profoundly those
    who tell me that they really can do something that will allow patients to maintain
    a full life, at which point everything should be done. However, if they are sure
    that there is no chance of survival, they need to let the patient live peacefully
    during the time they have left. We are talking about the advanced stages of a
    disease, when all the doctors say it is terminal. If a dying person has no chance
    of recovering, it does not make sense to do a blood transfusion or hook them up
    to a respirator just to prolong their life for another twenty-four hours. If someone
    is suffering they should be given painkillers and drugs that will make them as
    comfortable as possible, but no more than that. We do not respect life by keeping
    patients in agony.


    **BERGOGLIO:** In Catholic morality, no one is obligated to use extraordinary
    measures to cure others. It is not about clinging to a life when one knows that
    it is not alive any more. While there is the possibility of reversing the illness,
    everything should be done; but the extraordinary methods should be used only if
    there is hope of recuperation.


    ## 12. ON THE ELDERLY


    **SKORKA:** Old age has never been easy. I will start off with the scene in the
    Bible where Jacob tells Pharaoh that he has lived a short, difficult 130 years.
    Old age is problematic because instead of looking toward the future, we begin
    to look back at the past. Still, it can be a wonderful time in our lives if we
    have really lived fully and with intensity, because by then we will have come
    to understand the meaning of life. However, today old age is something we worry
    about because in the present culture the elderly are treated as disposable material.
    Modern life, instead of allowing people a little more time to relax, has got them
    running faster and faster. It is not just a matter of material wealth; going to
    the gym, traveling and other activities have become practically obligatory. There
    is just no time to take care of the elderly. For us to get a better sense of things,
    it is important that we try to visualize how the elderly live in solitude; whether
    it is because their friends are no longer around, or because the generational
    gap between them and their children makes it difficult for them to have a conversation.
    The elderly are not just things; they are human beings that deserve our care.
    Whenever we visit any of the countless old age homes throughout the city of Buenos
    Aires, we have to ask ourselves, “Are these decent living conditions?” Today the
    elderly are pushed aside. There is a biblical verse—“You shall rise up before
    a graying head, and honor the face of an old man.” Life is a struggle and it is
    very hard when those who have fought with dignity spend their final years terribly
    alone. Sometimes, the homes for the aged are top notch when it comes to medical
    treatment, but from a spiritual view they leave a lot to be desired . . the elderly
    need love, affection and conversation.


    **BERGOGLIO:** I would like to reiterate what you said about disposing. Before,
    we were able to speak of the oppressors and the oppressed in our society. Over
    time, we discovered that such a category is not sufficient, that it needed to
    have something else added: the included and the excluded. In this consumerist,
    hedonist and narcissistic society, we are accustomed to the idea that there are
    people that are disposable, and among them there a special place for the elderly.
    Parents work, and they have to resort to a nursing home to take care of the grandparents,
    but many times it is not an issue of being busy at work, but mere egoism: the
    elderly are bothersome in the house, they smell bad. They end up stored away in
    a nursing home like an overcoat that is hung up in the closet during the summer.
    There are families in which there is no other option, but every weekend they visit
    their grandparents or they bring them to their own homes; they are cared for amidst
    their loved ones. This is not disposing; on the contrary, it is a very costly
    reality. But in many cases, when I visit nursing homes, I ask the elderly about
    their children and they answer that they are not going to see them because they
    have to work; they try to cover for them. There are many who abandon those that
    fed them, who educated them, who wiped their bottoms. It hurts me; it makes me
    weep inside. We will not speak about what I call covert euthanasia: the poor attention
    to the elderly in hospitals and in health insurance that does not give them the
    medicine and attention they need. The elderly are transmitters of a story, they
    bring us memories, the memories of a people, of a nation, of a family, of a culture,
    of a religion... They have lived through so much and even if some of them were
