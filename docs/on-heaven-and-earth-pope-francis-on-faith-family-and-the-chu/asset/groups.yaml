    # 17. ON SCIENCE


    SKORK: Religion had served as a disseminator of culture in the broadest sense
    of the word until the Enlightenment. Whatever knowledge one had about any field
    of study was connected to religion in some way. That is why we find so many Jewish
    rabbis and Catholic monks who were dedicated to the various sciences. Maimonides,
    Copernicus and Mendel were some later examples of this ancient tradition. As an
    aside, scribes were typically monks as well. The Talmud is full of ideas related
    to sociology, anthropology and medicine. Religion was the channel through which
    culture and clarity of language were transmitted. It provided responses to the
    fundamental questions of life I mentioned earlier—What is Man? What is Nature?
    What is G-d? Even today, whenever important questions arise we still turn to religion—and
    these issues are tremendously important. For example, we had to redefine death
    in order to do organ transplants. Over the centuries, death was defined as the
    cessation of cardio-pulmonary activity. When the rabbis were asked if one could
    save a life by performing a heart transplant incorporating the removal of an organ
    that is still beating, they found that the concept of brain death already exists
    in the Talmud. One could say, “Look at what visionaries they were!”


    Today we have arguments about when human life begins. Should we treat the inseminated
    ovum in its first stages of development as a person? According to the criteria
    of one of the Talmud''s sages, it has already received a soul—the divine breath.
    Science has determined that a zygote already has all the necessary genetic information
    to develop into a new human being; but is that enough of an argument to conclude
    that it should be treated as a person?


    When science reaches its limits, man turns to the spiritual the experiences of
    centuries past. Science and religion are fields that work in parallel and should
    be talking to each other. The scientist who tries to refute religious phenomena
    based on their studies is the same as a religious person who tries to refute science
    based on their faith—they are both foolish. Only through dialogue that starts
    by recognizing their own limitations can debate develop between the two, which
    is absolutely necessary for humanity to move forward in its search for a base
    level of ethical conduct.


    **BERGOGLIO:** It is true. On the one hand, as you said Rabbi, there is everything
    that you mentioned about education, all the wisdom of the ages accumulated through
    reflection, by the Torah, by the Gospels, and it is offered to all of humanity.
    There is also another interesting thing: religious truth does not change, but
    it does develop and grow. It is like with the human being, we are the same as
    a baby and in old age, but in the middle there is a whole journey. In this way,
    as was explained before, something that was once seen as natural, is not seen
    like today. One example is the death penalty: once it was one of the punishments
    that Christianity accepted, but today the moral conscience has become much more
    refined and the Catechism says that it is better that it does not happen.


    Human conscience gets refined with respect to moral commands and it also grows
    in the understanding of it. The same happened with slavery: now it does not occur
    to anyone to put a bunch of people on a ship and send them to the other side of
    the ocean. It is true that today there are other types of slavery, like in the
    case of the people from the Dominican Republic who were brought here to be subjected
    to prostitution or the undocumented Bolivians who came to work here and were obligated
    to do so in inhumane conditions.


    SKORKA: Often times, when religious institutions make mistakes, they own up to
    them, but sometimes they are silent or are reluctant to speak about them. To this
    day, the Church repents of the trial of Galileo. Just as a religious person transforms
    their particular view of biblical texts into absolute scientific truth commits
    a sin of foolishness, the scientist who believes that his knowledge is sacred
    and indisputable commits the sin of intellectual blindness. Science is constantly
    being updated, the constant challenge being to discover a theory that is better
    or more comprehensive than the existing one. As you said, Monsignor, there has
    been development in what we know about the spiritual, even though the spirit remains
    immutable. Without a doubt this process of development ought to include a dialogue
    between religion and science. It is not that one needs to make room for the other.
    However, when science cannot provide an answer, answers based on intuition arise
    that, for me, they are then transformed into “spiritual” answers as they come
    from a spiritual process that is different from inductive or deductive reasoning.


    Another thing to emphasize—and we must not forget this—is that science has its
    limits. Science does not seek to find out why things are—it only looks for the
    “how.” The ultimate meaning of everything is something we do not know. To arrive
    at these answers we use our spiritual intuition. The “advantage” that science
    has with respect to religion is that one can go to the lab and prove the accuracy
    of the hypothesis, although there do exist some sciences, like psychology, where
    such a direct method of proof is not available.


    **BERGOGLIO:** Science has its autonomy that must be respected and encouraged.
    There is no reason to meddle with scientists’ autonomy, except when they overstep
    their field and get into the transcendent. Science is essentially instrumental
    in in God’s command when he says: "Be fertile and multiply; fill the earth and
    subdue it."59 Within its autonomy, science transforms the uncultured into culture,
    but be careful; when the autonomy of science does not put limits on itself and
    goes forward. It can lose control of its own creation just like in the story of
    Frankenstein. It makes me remember a story that I read as a child in *El Tony*60,
    that was called “The Mutants.” Because of an overzealous science, people started
    to transform themselves into things. One clear example of these abuses is the
    possession of atomic power that can cause the destruction of humanity. When man
    becomes proud, he creates a monster that gets out of hand.


    SKORKA: That’s the moral of the story of the Golem. In Prague, a rabbi created
    a doll, an automaton that could defend the Jews against anti-Semitic attacks.
    He engraved the word emet-Hebrew for truthon its forehead, put the Tetragrammaton
    in its mouth and ordered the Golem to serve him. A version of this legend says
    that one Friday,⁶¹ prior to the arrival of the Sabbath, the dummy was able to
    free itself and started destroying everything. The rabbi erased the first letter
    of the word on its forehead, which left it saying “met,” which means death, and
    he took the little paper out of its mouth, at which point it turned back into
    the clay that the rabbi had used to make it. It is an archetype of what happens
    when man cannot control what he creates with his intellect—when the product of
    his creation gets out of hand.


