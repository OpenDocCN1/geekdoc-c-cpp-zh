    另一方面，我认为值得提到的是，在最虔诚的犹太社区中，他们采取了关于端庄的规则，防止男性与非妻子握手或吻。女性还被要求戴假发、覆盖大部分身体的衣服等。这些规则与节制本能诱惑有关。在正统会太堂里，女性在楼上，不与男性一起祈祷。她们有一个独立的地方。


