    It was at that meeting that we decided to write this book.


    Although every rabbi makes a special commitment to G-d during his training, once
    he begins his work as a teacher of the Law he has the obligation to set an example,
    more than any other Jew, to show people how one must fulfill their obligations
    to the Creator. Just as the prophets had done after experiencing moments of spiritual
    elevation while alone, the rabbi should go back to the people and teach them based
    on this acquired spirituality. After all, the dimensions of spiritual life that
    one attains by oneself only acquire meaning, according to biblical teachings,
    when they are used to help uplift others.


    Regardless of the fact that rabbis communicate more frequently using the spoken
    word, there''s always an underlying challenge to capture and refine those ideas
    so that they can be put on paper. A spoken word can become blurred or distorted
    over time. Written ideas become permanent testimonies that allow more people to
    access them.


    When I''m with Cardinal Bergoglio, these two lessons become one. During our chats,
    the main topic and focus of concern was, and continues to be, individual people
    and their problems. We let the conversations flow spontaneously as opposed to
    following written agendas. As such, giving expression to our intimate conversations
    in book form meant that we each had to take turns strengthening the bonds between
    us. We have transformed our dialogue into a group conversation, exposing our souls.
    We accept all of the risks this implies, yet remain profoundly convinced that
    this is the only way for us to understand what it means to be a human being, moving
    ever closer to G-d.


    ## THE FAÇADE AS A MIRROR

    Jorge Bergoglio


    Rabbi Abraham Skorka, in one of his earlier writings, made reference to the façade
    of the Metropolitan Cathedral that depicts the encounter between Joseph and his
    brothers. Decades of misunderstandings converge in that embrace. There is weeping
    among them and also an endearing question: Is my father still alive? During the
    times of national organization,5 this was the image they proposed, and not without
    reason. It


    5 Ed. Note: The national organization (organización nacional) marks a period in
    Argentina''s history between 1852 and 1880. During this time, a national constitution
    was approved that defined the federal nature of the government. Education and
    communications were also dramatically expanded. Although regarded as a time that
    forged Argentina''s strength and identity, it also came with social upheaval.


    represented the longing for a reuniting of Argentineans. This scene aims to work
    to establish a “culture of encounter.” Many times I alluded to the difficulty
    that as Argentineans have to consolidate that “culture of encounter;” instead
    it seems that we are seduced into dispersion and the abysses that history has
    created. At times, we are better able to identify ourselves as builders of walls
    than as builders of bridges. We lack the embrace, weeping and the question about
    the father, for our matrimony, for the roots of our Fatherland. There is an absence
    of dialogue.


    Is it true that Argentineans do not want dialogue? I would not say that way. Rather
    I think that we succumb to attitudes that do not permit us to dialogue: domination,
    not knowing how to listen, annoyance in our speech, preconceived judgments and
    so many others.


    Dialogue is born from a respectful attitude toward the other person, from a conviction
    that the other person has something good to say. It supposes that we can make
    room in our heart for their point of view, their opinion and their proposals.
    Dialogue entails a warm reception and not a preemptive condemnation. To dialogue,
    one must know how to lower the defenses, to open the doors of one’s home and to
    offer warmth.


    There are many barriers in everyday life that impede dialogue: misinformation,
    gossip, prejudices, defamation, and slander. All of these realities make up a
    certain cultural sensationalism that drowns out any possibility of openness to
    others. Thus, dialogue and encounter falter.


    But the façade of the Cathedral is still there, like an invitation.


    Rabbi Skorka and I have been able to dialogue, and it has done us good. I do not
    remember how our dialogue started, but that there were no barriers or reservations.
    His simplicity was without pretense, and this facilitated things. I could even
    ask him jokingly, after River Plate, if that day he was going to eat “hen soup.”6


    When he proposed to me that we publish some of our dialogues, my “yes” was spontaneous.
    Reflecting later, in solitude, I thought that the explanation for this quick response
    was due to our experience of dialogue during quite a bit of time; a rich experience
    that consolidated a friendship and that would give testimony of our walk together
    from our distinct religious identities.


    With Rabbi Skorka I never had to compromise my Catholic identity, just like he
    never had to out of his Jewish identity, and this was not only out of the respect
    that we have for each other, but also because of how we understand interreligious
    dialogue.


    > 6 Ed. Note: River Plate is one of the most popular soccer teams in Argentina.
    Its rival is Boca Juniors. Eating “hen soup” (cazuela de pollo) is equivalent
    to the English expression “eating crow."


    The challenge consisted in walking the path of respect and affection, walking
    in the presence of God and striving to be faultless.


    This book is a testimony to that path. I consider Rabbi Skorka a brother and a
    friend; and I believe that both of us, through these reflections, never stopped
    looking with the eyes of our heart at the façade of the Cathedral, so eloquent
    and promising.


    ## On Heaven and Earth


    ## 1. ON GOD


    **SKORK:** It has been many years since we first met and a bond has been forged
    between us. While studying the books of the Talmud, I found one that says friendship
    means sharing meals and spending time together, but in the end it points out that
    the sign of a real friendship is the ability to reveal what is in one''s heart
    to the other. That is what happened over time with the two of us. I believe that
    undoubtedly the most important thing that brought us together was, and still is,
    G-d, who caused our paths to cross and allowed us to open our hearts to each other.
    Although we broached many topics during our regular conversations, we never spoke
    explicitly about G-d. Of course, it was always understood that He was present.
    It would be good to start this exchange, which we plan to leave as a testimony
    of our dialogue, by discussing Him who is so important in our lives.


    **BERGOGLIO:** What a great word: path! In my personal experience with God I cannot
    do without the path. I would say that one encounters God walking, moving, seeking
    Him and allowing oneself to be sought by Him. They are two paths that meet. On
    one hand, there is our path that seeks Him, driven by that instinct that flows
    from the heart; and, when we have encountered each other, we realize that He was
    the one had been searching for us from the start. The initial religious experience
    is of walking: walk to the land that I am going to give you.⁷ It is a promise
    that God makes to Abraham. In that promise, in this, in this walking, an alliance
    is established that consolidates over time. Because of this I say that my experience
    with God takes place along the path, both in the search and in allowing myself
    to be sought, even if it may be by diverse paths—of pain, joy, of light, or darkness.


    **SKORKA:** What you have said reminds me of a few biblical verses. For example,
    when G-d tells Abraham: “Walk in my presence and be blameless?”⁸ Or when the prophet
    Micah needed to explain to the Israelites what G-d wanted from them, and he tells
    them to “do justice


