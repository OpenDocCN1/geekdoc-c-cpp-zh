    Total Time: \" + totalTime);\nwrite(\"Score: \" + points);\nwrite(\"Your Score:\
    \ \" + points);\n```\n\n## Comments\n\nUse comments. It's a simple concept but\
    \ commenting your code saves many problems when you come to next. Over inserting\
