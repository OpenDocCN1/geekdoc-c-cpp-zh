    \ set up, the loop repeats itself until the condition becomes false.\n\n# LOOPY\
    \ LOOPS\n\nThe initialise stage of a for loop is executed only once and sets the\
    \ point reference for the loop. The condition is evaluated by the loop to see\
    \ if it's true or false and then the increment: the loop executes the second and\
    \ third stage.\n\n+   STEP 1 Create a new C++ file, with the standard headers:\n\
    \n```\n#include <iostream>\nusing namespace std;\nint main() {\n\n}\n```\n\n+\
