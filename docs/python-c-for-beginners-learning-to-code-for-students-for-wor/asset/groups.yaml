    \ IDE 是微软的 Visual Studio。然而，更好的 IDE 和编译器是 Code:Blocks，它每年发布两次新版本以保持更新。此外，Windows\
    \ 用户可以在 Notepad++ 中输入代码，然后像 Code:Blocks 那样使用 MinGW 对其编译。\n\n![](img/ba40fbc39febe9db9a35785516d323a7_88_1.png)\n\
    \n# RASPBERRY PI\n\n树莓派的操作系统是 Raspian，它是基于 Linux 的。因此，你可以使用文本编辑器编写代码，然后像在其他 Linux\
    \ 发行版中一样用 g++ 进行编译。\n\n![](img/ba40fbc39febe9db9a35785516d323a7_88_2.png)\n\n\
    # MAC\n\nMac 用户需要下载并安装 Xcode 才能能够原生编译他们的 C++ 代码。MacOS 的其他选项包括 Eclipse 或 Code:Blocks；注意：由于缺乏\
    \ Mac 开发者，最新的 Code:Blocks 不支持 Mac。\n\n![](img/ba40fbc39febe9db9a35785516d323a7_88_3.png)\n\
    \n# 如何在 Windows 中设置 C++\n\nWindows 用户在进行 C++ 编程时有丰富的选择。有很多 IDE 和编译器可用，包括微软的 Visual\
    \ Studio。然而，在我们看来，最适合入门的 C++ IDE 是 CodeBlocks。\n\n# CODE::BLOCKS\n\nCode:Blocks\
    \ 是一个免费的 C 和 Fortran IDE，功能丰富且易于插件扩展。它易于使用，自带编译器，并且背后有一个活跃的社区。\n\n- **第 1 步**\
