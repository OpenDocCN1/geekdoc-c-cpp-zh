    \n# Create Your Modules\nLarge programs can be much easier to manage if you break\
    \ them up into smaller parts and import the parts you need as modules. Learning\
    \ to build your own modules makes it easier to understand how they work.\n\n##\
    \ BUILDING MODULE\nModules are Python files, containing code that you save as\
    \ .py extension. These are then imported into Python using the import command.\n\
    \n### STEP 1 Create basic functions, multiplying a number by two, three or square\
    \ to raise a number to an exponent (power). Create a New File in the IDE and edit:\n\
    ```python\ndef timtwo(x):\n    return x * 2\n\ndef timethree(x):\n    return x\
    \ * 3\n\ndef square(x):\n    return x * x\n\ndef power(x,y):\n    return x **\
    \ y\n```\n\n### STEP 2 Under the above code, enter functions to call the code:\n\
    ```python\nprint(timtwo(2))\nprint(timethree(3))\nprint(square(4))\nprint(power(5,3))\n\
    ```\nSave the program as basic_math.py and execute it to get the results.\n\n\
    ### STEP 3 Now you're going to take the function definitions out of the program\
    \ and into a separate file. Highlight the function definitions and choose Edit\
    \ > Cut. Choose File > New File and Edit > Paste in the new window. You now have\
    \ separate files, one with the function definitions, the other with![](img/ba40fbc39febe9db9a35785516d323a7_81_0.png)\n\
    \n### STEP 4 If you now try and execute the basic_math.py code not defined be\
    \ displayed. The NameError: 'timtwo' is not defined is due to the code no longer\
    \ having access to the function definitions.\n```\nTraceback (most recent call\
    \ last):\nFile \"basic_math.py\", line 3, in <module>\n    print(timtwo(2))\n\
    NameError: name 'timtwo' is not defined\n```\n![](img/ba40fbc39febe9db9a35785516d323a7_81_1.png)\n\
    \n### STEP 5 Return to the newly created window containing the function definitions\
    \ and click File > Save As Name minimath.py and save it in the same location as\
    \ the basic_math.py program. Now close the minimath.py window is left open.![](img/ba40fbc39febe9db9a35785516d323a7_81_2.png)\n\
    \n## STEP 6 Back to the basic_math.py window, at the top of the code entry:\n\
    ```python\nfrom math import *\n```\nThis will import the functions as a module.\
    \ Press F5 to execute the program in it.\n\n### STEP 9 Finally, you can now create\
    \ a range of if statements to determine what to do with the number and the newly\
    \ created function definitions:\n```python\nif choice == '1':\n    print(timtwo(num))\n\
    elif choice == '2':\n    print(timethree(num))\nelif choice == '3':\n    print(square(num))\n\
    elif choice == '4':\n    num2 = input(\"Enter second number: \")\n    print(power(num,num2))\n\
    else:\n    print(\"Invalid\")\n```\n![](img/ba40fbc39febe9db9a35785516d323a7_82_0.png)\n\
    \n### STEP 7 You can now include the code further to make the created module to\
    \ fill itself using user interaction. By creating a base menu the user can choose\
    \ from:\n```python\nprint(\"Select operation.\\n\")\nprint(\"1.Times by two\"\
    )\nprint(\"2.Times by Three\")\nprint(\"3.Square\")\nprint(\"4.Power of\")\n\n\
    choice = input(\"nEnter choice (1/2/3/4):\")\n```\n![](img/ba40fbc39febe9db9a35785516d323a7_82_1.png)\n\
    \n### STEP 8 We can now add the user input to get the number code will work with:\n\
    ```python\nnum1 = int(input(\"nEnter number: \"))\n```\nThis will save the entered\
    \ variable as variable num1.\n\n### STEP 10 Note that for all options, we've added\
