  mdcn: "\n\n# C++ 初学者常见错误\n\n## 注释（再次）\n\n确实，在代码中添加任何注释的错误再次回归了。正如我们之前抱怨的那样，整个代码中缺乏可读的标识符，使得你和他人在回溯其工作原理时都非常困难。请多写注释。\n\
    \n```cpp\n# comment: avoid this\nint main() {\n  int x = 0; // comment, don't\
