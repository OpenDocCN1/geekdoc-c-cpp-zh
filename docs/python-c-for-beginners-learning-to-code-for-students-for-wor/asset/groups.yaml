    \ is a Linux-only IDE that features some of the advanced features you would normally\
    \ find in a powerful development studio. The GUI designer, source editor, app\
    \ wizard, interactive debugger and much more. Go to www.anjuta.org/ for more information.\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_96_0.png)\n\n### QT CREATOR\nThis cross-platform\
