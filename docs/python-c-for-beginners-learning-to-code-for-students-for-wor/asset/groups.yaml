    ## Polygon Circles


    Here''s a fun, mathematical, look at making a circle from straight lines. Using
    the Math module, in particular, sin and Pi, this will draw a series of straight
    lines using the Turtle module. The end result is quite remarkable and has plenty
    of scope for exploration.


    ### POLYGONCIRCLES.PY


    There''s lots of mathematics used here along with intricate manipulation with
    the Turtle module. Enter the code and execute it to see how it turns out.


    ```

    from turtle import*

    from math import sin, cos, pi

    inc=2*pi/100

    t=0

    for i in range(100):

    x1=sin(t);y1=cos(t)

    x2=sin(t+inc);y2=cos(t+inc)

    penup();goto(x1,y1)

    pend();goto(x2,y2)

    t+=inc

    ```


    ## Graphical Enhancements


    There are several ways in which you can improve this code to make it even more
    interesting. You can change colors, perhaps a different colour for every line
    and have the Turtle draw around in the circle. Let your imagination run wild and
    finish.


    Turtle''s graphics can take a while to map out and draw, depending on how big
    and how intricate it is. While the effect can be stunning, it is limited by the
    time it takes to display an image. Therefore it''s worth seeing if the function
    turtle.speed() will quicken things up.


    For example:


    ```

    for i in range(100):

    x1=sin(t);y1=cos(t)

    x2=sin(t+inc);y2=cos(t+inc)

    speed(''fastest'')

    up();goto(x1,y1)

    pend();goto(x2,y2)

    t+=inc

    ```


    This will run at the ''fastest'' speed possible for the Turtle. It makes a huge
    difference and is worth considering if you''re drawing Turtle images for games
    or presentations.


    turtle.speed() comes in values:


    - slowest

    - slow

    - normal

    - fast

    - fastest


    You can experiment with the various speeds by adding the function in the loop,
    just before the penup line.


    ```

    from turtle import *

    from math import sin, cos, pi

    inc=2*pi/100

    t=0

    for i in range(100):

    x1=sin(t);y1=cos(t)

    x2=sin(t+inc);y2=cos(t+inc)

    speed(''fastest'')

    up();goto(x1,y1)

    pend();goto(x2,y2)

    t+=inc

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_153_0.png)

    ![](img/ba40fbc39febe9db9a35785516d323a7_153_1.png)


    ## Random Number Generator


    User input and the ability to manipulate input are important elements with any
    programming language. It''s what separates a good program from a great one, that
    allows the user to interact and see the results of that interaction.


    ### RNDNMUMGEN.PY


    It might be simple but this piece of code will ask the user for two sets of numbers,
    a start and a finish. The code will then pluck a random number between the two
    sets and display it.


    ```

    from random import *


    print(">>>>Random Number Generator<<<<<<")

    nb1=int(input("Enter the start number: "))

    nb2=int(input("Enter the last number: "))


    x = randint(nb1, nb2)

    print(f"The random number between {nb1} and {nb2} is: {x}")

    print(x)

    ```


    ## More input


    While easy to follow, it could be more interesting if you prompt the user for
    input. You can provide this with addition, subtraction, multiplication elements
    with their numbers. If you''re feeling clever, you can pass the code through a
    Ticker window or the Eicker available on Page 128.


    Furthermore, the code from above could be used in a text adventure game, where
    the character fights things and their health, respectively, is reduced by a random
    number. This can be mixed with the previous code from Page 90 Guessing Game, where
    we define the stats for the adventure''s character.


    You can also include the Turtle module into the code and perhaps some defined
    rules for drawing a shape, or based on a user input value from a range of numbers.
    It takes a little working out but the effect is entirely interesting.


    For example, the code could be edited to:


    ```

    from random import *

    import turtle


    print(">>>>Random Turtle Image<<<<<<")

    nb1=int(input("Enter the start number: "))

    nb2=int(input("Enter the second number: "))

    nb3=int(input("Enter the third number: "))

    nb4=int(input("Enter the fourth number: "))


    ```

    turtle.forward(nb1)

    turtle.left(90)

    turtle.forward(nb2)

    turtle.left(90)

    turtle.forward(nb3)

    turtle.left(90)

    turtle.forward(nb4)

    turtle.left(90)

    ```


