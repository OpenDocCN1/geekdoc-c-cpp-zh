    >>> phonebook["David"] = "0987 654 321"

    ```


    # STEP 6


    You can also remove items from a dictionary by issuing the del command followed
    by the key, the value will be removed as well, both work as a process of data
    items:


    ```python

    del phonebook["David"]

    ```


    ```python

    Python 3.4.2

