    int main() {\n}\n```\n\n```cpp\n#include <iostream>\nusing namespace std;\nint\
    \ main() {\n    cout << \"Hello, \";\n}\n```\n\n- STEP 5 Insert a quote inside\
    \ cout\n- STEP 6 The table will\n- STEP 7 This is C++\n- STEP 8 It is\n\n# AY\
    \ CHART\n\nThere are numerous character literals, or escape sequence codes, to\
    \ choose from. We therefore thought it would be good for you to have a handy chart\
    \ available, for times when you need to insert a code.\n\n- UNICODE (UTF-8)\n\
    - UNICODE (UTF-16)\n\n# UNICODE CHARACTERS (UTF-8)\n\nUnicode characters are symbols\
    \ or characters that are standard across all platforms. For every symbol, that\
    \ can be entered via the keyboard by entering the Unicode code, followed by ALT+X.\
    \ In the case of the unicode sequence enter: 00A9 Alt+X. In C++ you would\n\n\
    ```cpp\n#include <iostream>\nusing namespace std;\n\nint main () {\n\n    cout\
    \ << \"\\u00A9\";\n}\n```\n\n# UNICODE\nCHARACTER TABLE\n\nA list of the available\
    \ Unicode characters can be found at www.unicode-table.com/en/. Hover your mouse\
    \ over to see the code to enter in C++. While it may be a little overwhelming\
    \ to look at again, bookmark the page as you will probably need to come back to\
    \ it for reference as you dig deeper into C++, and indeed character literals.\
    \ One thing, the table will also display characters from different languages,\
    \ such as Tibetan or Sudanese. This means your code can be truly universal.\n"
  mdcn: "\n\n# C++ 输入/输出\n\n![](img/ba40fbc39febe9db9a35785516d323a7_115_0.png)\n\n\
    # C++ 输入/输出\n\n当你编写一段代码，要求用户输入内容，然后使用这些输入来产生用户看到的结果时，会有一种非常有成就感。即使仅仅是询问某人的名字并显示一条个性化的欢迎信息，这也是的一大飞跃。\n\
    \n用户交互、字符字面量、定义常量以及文件输入/输出将在接下来的页面中进行介绍；所有这些都将帮助你更深入地理解 C++ 程序是如何运行的。\n\n> “最好的程序编写是为了让计算机能够快速运行它们，同时也让人类能够清晰地理解它们。”\n\
    \n> 唐纳德·E·克纳斯\n（计算机科学家、数学家、作家）\n\n| 116 | 用户交互 |\n| 118 | 字符字面量 |\n| 120 | 定义常量\
    \ |\n| 122 | 文件输入/输出 |\n\n![](img/ba40fbc39febe9db9a35785516d323a7_116_0.png)\n\
    \n# 用户交互\n\n没有什么比创建一个对你做出响应的程序更有成就感了。这种基础的用户交互是任何语言中最常教授的方面之一，通过它，你可以做比单纯按名字问候用户多得多。\n\
    \n# 你好，DAVE\n\n在之前的代码中你已经使用了 `cout`（即标准输出流）。现在你将使用 `cin`（即标准输入流）来编写响应程序。\n\n-\
    \ 你想让用户输入的任何内容都需要存储在系统内存的某处，以便被检索和使用。因此，任何内容必须首先声明为一个变量，以便准备供用户使用。从创建一个包含头文件的\
    \ C++ 文件开始。\n\n- `cin` 命令的工作方式与输出相反，如尖括号所示，向屏幕输出“你的年龄是几？”。`cin` 使用反向的尖括号 `>>`，表示输入。输入被放入整数尖括号中，并在第二次计数中调用。构建并运行代码。\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n    int age;\n\
    \    cout << \"What is your age: \";\n    cin >> age;\n    cout << \"You are \"\
    \ << age << \" years old.\\n\";\n    return 0;\n}\n```\n\n- 如果你在提问，你需要将输入存储为字符串；若要询问用户的名字，你会使用：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n    string\
    \ name;\n    cout << \"What is your name: \";\n    cin >> name;\n    cout << \"\
    Hello, \" << name << \" I hope you're well today!\\n\";\n    return 0;\n}\n```\n\
    \n变量的数据类型也与你想要从用户那里获得的输入类型匹配。例如，为了询问用户，你会像这样使用一个整数：\n\n# 用户交互\n\n第 5 步主要工作与之前的代码相同。用户的输入（name）被存储在字符串中，因为它包含多个字符，并在代码行中被检索。由于变量\
    \ 'name' 没有改变，你可以在代码中的任何时候回想它。\n\n第 8 步虽然 `cin` 适用于大多数输入，但它有一个局限性。它总是将空格视为多个单词之间的终止符。然而，`getline`\
    \ 以第一个参数接收，并将变量作为第二个参数：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main() {\nstring mystr;\ncout << \"Enter a sentence: \\n\";\ngetline(cin,\
    \ mystr);\ncout << \"Your sentence is: \" << mystr.size() << \" characters\\n\"\
    ;\n}\n```\n\n第 6 步你可以注入请求来打扰用户，但要确保你有一个变量来存储结果。假设用户输入两个数字：\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main() {\nint num1, num2;\ncout << \"\
    Enter two whole numbers: \\n\";\ncin >> num1 >> num2;\ncout << \"you entered \"\
    \ << num1 << \" and \" << num2 << \" numbers\\n\";\n}\n```\n\n| 1 | <iostream>\
    \ |\n| 2 | using namespace std |\n| 3 | int main() { |\n| 4 | int num1, num2;\
    \ |\n| 5 | cout << \"Enter two whole numbers: \\n\"; |\n| 6 | cin >> num1 >> num2;\
    \ |\n| 7 | cout << \"you entered \" << num1 << \" and \" << num2 << \" numbers\\\
    n\"; |\n| 8 | } |\n\n![](img/ba40fbc39febe9db9a35785516d323a7_118_0.png)\n\n第\
    \ 9 步构建并执行代码，然后输入一个带有空格的句子。如果你用 `cin >>` 完成了代码行，请重试，结果将显示到开头的字符数。\n\n同样，一旦你将输入存储在变量中，就可以对其进行处理。例如，询问并对以下进行一些数学运算：\n\
    \n第 10 步 `getline` 是一个命令，C++ 的空白符很烦人。如果你无法弄明白为什么它不起作用，最好的办法是在函数中使用 `getline(cin,\
    \ variable)`：\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
    \ {\nstring num1, num2;\ncout << \"Enter numbers: \\n\";\ngetline(cin, num1);\n\
    getline(cin, num2);\ncout << \"Sum is: \" << stoi(num1) + stoi(num2) << \"\\n\"\
    ;\n}\n```\n*(注：此处原文英文文本逻辑似乎在提供时略有断层，已根据语境调整翻译以保持逻辑连贯)*\n\n"
