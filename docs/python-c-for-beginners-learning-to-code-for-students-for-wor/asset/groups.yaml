    \n## C++ Fundamentals\n\n## C++ Maths\n\nProgramming is mathematical in nature\
    \ and as you might expect, there's plenty of built-in scope for implementing mathematical\
    \ models into their code. It can be extremely complex or relatively simple. However,\
    \ by using the C++ Math Library, you can also calculate square roots, powers,\
    \ and more. Basic operations follow the same patterns as taught in school, in\
    \ that multiplication and division take precedence over addition and subtraction.\
    \ You can also alter that.\n\n- STEP 1 For now, create a new file and enter:\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main () {\n    float\
    \ numbers = 100;\n    numbers = numbers + 10; // This adds 10 to the initial\n\
    \    cout << \"\\n\";\n    numbers = numbers - 10; // This subtracts 10 from the\
    \ new\n    cout << \"\\n\";\n}\n```\n\n- STEP 2 While, we get the old maths warmed\
    \ up. We used float because it can easily handle decimals. If you started to use\
    \ integers, you would need to change it to float, depending on accuracy. Run the\
    \ code and see the results.\n\n- STEP 3 Multiplication and division can be applied\
    \ as such:\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n\
    \    float numbers = 100;\n    numbers = numbers * 10; // This multiplies 100\
    \ by 10\n    cout << \"\\n\";\n    numbers = numbers / 10; // And divides 100\
    \ by 10\n    cout << \"\\n\";\n}\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_113_0.png)\n\
    \n- STEP 4 Again, the simple code and see the results. While not interesting,\
    \ it's a start in C++ maths. We used float, so you can play around with the code\
    \ and multiply by several decimals, as well as add and subtract.\n\nimg/ba40fbc39febe9db9a35785516d323a7_113_1.png)\n\
    \n## STEP 5\n\nThe interesting maths comes when you call upon the C++ Math Library.\
    \ This header contains dozens of mathematical functions. You can call the header\
    \ with:\n\n```cpp\n#include <iostream>\n#include <cmath>\nusing namespace std;\n\
    int main() {\n\n}\n```\n\n## STEP 8\n\nCalculating powers of numbers can be done\
    \ with:\n\n```cpp\n#include <iostream>\n#include <cmath>\nusing namespace std;\n\
    int main() {\n\tfloat number = 12;\n\tcout << \"the power of 2 is \" << pow(number,\
    \ 2) << \"\\n\";\n\tcout << \"the power of 3 is \" << pow(number, 3) << \"\\n\"\
    ;\n\tcout << \"the power of .08 is \" << pow(number, .08) << \"\\n\";\n}\n```\n\
    \n| Files | *Maths.cpp |\n|---|---|\n| 1 | #include <iostream> |\n| 2 | #include\
