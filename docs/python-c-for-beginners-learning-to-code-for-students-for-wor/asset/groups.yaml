    ## C++ 基础


    ![](img/ba40fbc39febe9db9a35785516d323a7_97_0.png)


    在本节中，你可以开始理解 C++ 代码的结构，并查看如何编译和执行这些代码。这些是 C++ 的核心基础，将教你基础知识，如使用注释、变量、数据类型、字符串以及如何使用
    C++ 数学。


    这些是 C++ 程序的构建块。通过它们，你可以构建自己的代码，产生屏幕输出并存储和检索数据。


    - 98 你的第一个 C++ 程序

    - 100 C++ 程序的结构

    - 102 编译与执行

    - 104 使用注释

    - 106 变量

    - 108 数据类型

    - 110 字符串

    - 112 C++ 数学


    > “控制复杂度是计算机编程的本质。”

    — Brian Kernighan（UNIX C 语言开发者及作者）


    ![](img/ba40fbc39febe9db9a35785516d323a7_98_0.png)


    ## # 你的第一个 C++ 程序


    你之前可能参考了 Mac 和 Linux 的示例，但从现在开始你将完全在 Windows 和 Code::Blocks 中工作。让我们从编写你的第一个 C++
    程序开始，向更大的编程世界迈出第一个小步。


    # HELLO, WORLD!


    在编程中，第一段代码向屏幕输出“Hello, World!”是一项传统。有趣的是，这可以追溯到 1968 年的一种名为 BCPL 的语言。


    - 步骤 1：如所述，书中后续的 C++ 代码你将看到 Windows 10 和最新版本的 Code::Blocks。启动 Code::Blocks。打开后，点击
    File > New > Empty File，或者在键盘上按下 `Ctrl+Shift+N`。


    - 步骤 3：目前看起来没什么特别的，甚至没什么意义，但我们将在课程中介绍这一点。现在点击 File > Save As。创建或找到 helloworld.cpp。点击
    Save as type 框并选择 C/C++ files。点击 Save 按钮。


    ![](img/ba40fbc39febe9db9a35785516d323a7_99_0.png)


    - 步骤 2：现在你可以看到一个空白屏幕，标签页显示为“Untitled1”，主窗口左上角的数字为：Code::Blocks。首先点击主窗口，光标出现在下一个光标旁边，并输入：

    ```cpp

    #include <iostream>

    ```


    - 步骤 4：你可以看到 Code::Blocks 现在已经更改了颜色编码，识别出该文件现在是 C++ 代码。这意味着代码可以从 Code::Blocks
    仓库中自动选择。删除 `#include <iostream>` 行并重新输入。你可以看到自动选择框出现。


    ![](img/ba40fbc39febe9db9a35785516d323a7_99_1.png)


    ## 你的第一个 C++ 程序


    ### 步骤 5


    命令的自动补全非常方便，并且可以避免潜在的拼写错误。按下 Return 键跳到第三行，然后输入：


    ```cpp

    int main()

    ```


    注意：括号之间没有空格。


    ![](img/ba40fbc39febe9db9a35785516d323a7_100_0.png)


    ### 步骤 8


    再次注意颜色编码的变化。在上一步的行末尾按下 Return 键，然后输入：


    ```cpp

    std::cout << "Hello, world!";

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_100_1.png)


    ### 步骤 6


    在 `main()` 下方的下一行输入一个大括号：

    {}


    在英式英国键盘上，可以通过按下 `Shift` 和 `P` 右侧的键来实现。


    ![](img/ba40fbc39febe9db9a35785516d323a7_100_2.png)


    ### 步骤 9


    和之前一样，Code-Blocks 会在你输入时自动为你补全代码，包括在行末尾添加分号。这是 C++ 程序最重要的元素之一，我们将在下一节中告诉你原因。现在，将光标移动到右括号并按下
    Return。


    ![](img/ba40fbc39febe9db9a35785516d323a7_100_3.png)


    ### 步骤 7


    注意 Code::Blocks 自动在 `a` 下方创建了对应的括号，将这对连接起来并保持微缩进。这是由于 C++ 的结构决定的，也是输入代码主体的地方。

    现在输入：


    ```cpp

    //My first C++ program

    ```


    ### 步骤 10


    目前你只需要做这些。这看起来可能非常吓，但 C++ 最好通过小块来吸收。在你需要观察 C++ 程序结构时，先不要执行代码，然后你可以构建并运行代码。现在，点击
    Save（软磁盘图标）。


    ![](img/ba40fbc39febe9db9a35785516d323a7_100_4.png)


