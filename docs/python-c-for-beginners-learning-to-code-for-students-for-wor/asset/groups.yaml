    \ move ov;\n// end marks our const for not falling out\nchar const x = orig +\
    \ 2 * (n - 4);\n\n// See if we're writing in 64 bit\nif (sizeof(long) == 8) {\n\
    }\nif (__defined(__amd64)) // defined\n```\n\n## Plan Ahead\n\nWhile it's great\
    \ to have one morning and decide to write a classic text example, it's not always\
    \ practical without a good plan. Snippets of code can be written without too much\
    \ planning but planning longer and more in depth requires a good working plan\
    \ to stick to and iron out the bugs.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_139_0.png)\n\
    \n## User Error\n\nUser input is often a paralysing mistake in code. For example,\
    \ the user is supposed to enter a number for their age and enter it in order.\
    \ Often a user can enter so much into an input that overflows internal buffer,\
    \ thus the code crashing. Watch those users and clearly state what is needed from\
    \ them.\n\n```\nEnter an integer number\nYou have entered wrong input\nYou have\
    \ entered wrong input\ny\nYou have entered wrong input\nsdf22123123\nYou have\
    \ entered wrong input\n12323n2923n9232\nThe number is 12\nProcess returned 0 (0x0)\
    \ execution time: 21.49 s\nPress any key to continue.\n```\n\n## Backups\n\nAlways\
    \ make a backup of your work, with a secondary backup for all changes you've made.\
