    # Dictionaries


    Lists are extremely useful but dictionaries in Python are by far the more technical
    way of dealing with data items. They can be tricky to get grips at first but you''ll
    be able to apply them to your own code.


    # KEY PAIRS


    A dictionary is like a list but instead each data item as pair, these are known
    as Key and Value. The Key part must be unique and can be a number or string whereas
    the Value can be any data item like.


    STEP 1 Let''s say you want to create a phonebook in Python. You would create the
    dictionary name and entry in curly brackets, separating the key and value by a
    colon Key:Value. For example:


