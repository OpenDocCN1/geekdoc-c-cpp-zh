    # Splitting and Joining Strings


    When dealing with data in Python, especially from a user''s input, you will undoubtedly
    come across long strings of strings. A useful skill to learn in Python programming
    is being able to split those strings for better readability.


    ## STRING THEORIES


    You''ve already looked at some functions, .insert, .remove, and .pop but there
    are also functions that can be applied to strings.


    - STEP 1 The main tool in the string function arsenal is .split(). With it you''re
    able to split apart a string of data, based on the argument which you fetch. For
    example, here''s a string with three items, each separated by a space:


    - STEP 3 Note that the text.split() part has the brackets, quotes followed by
    closing quotes. The space is the separator, indicating each list item is separated
    by a space. Likewise, CSV (Comma Separated Value) is separated by a comma, so
    you''d use text="January,February,March,April,June" months=text.split(",")


    ```

    Python 3.4.2 (default) Oct 19 2014, 13:31:11

    [SEC 4.9.1] on Linux

    >>> type="credit" or "license" for more information.

    >>> name="Daniel Hannah Emma"

    >>> name.split()

    [''Daniel'', ''Hannah'', ''Emma'']

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_51_0.png)


    ```

    Python 3.4.2 (default) Oct 19 2014, 13:31:11

    [SEC 4.9.1] on Linux

    >>> type="credit" or "license" for more information.

    >>> name="January,February,March,April,June"

    >>> name.split(",")

    [''January'', ''February'', ''March'', ''April'', ''June'']

    ```


    - STEP 2 Now let''s turn the string into a list and split the content adequately.
    names=text.split(", ") Then enter the new list, to see the three items.


    - STEP 4 You''ve previously seen how you can split a string into individual lists,
    each using a name: name="David"


    The returned value is [''D'', ''a'', ''v'', ''i'', ''d'']. It may seem useless
    under ordinary circumstances, but it could be hard for creating a spelling game
    for example.


    ```

    Python 3.4.2 (default) Oct 19 2014, 13:31:11

    [SEC 4.9.1] on Linux

    >>> type="credit" or "license" for more information.

    >>> name="David"

