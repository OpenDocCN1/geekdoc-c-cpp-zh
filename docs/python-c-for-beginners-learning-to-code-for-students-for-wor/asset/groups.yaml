    # THE RASPBERRY PI


    Why use a Raspberry Pi? The Raspberry Pi is a tiny computer that''s very cheap
    to purchase but offers the user a fantastic learning platform. Its main operating
    system, Raspian, comes preinstalled with the latest Python along with many modules
    and extras.


    # RASPBERRY PI


    The Raspberry Pi 3 is the latest version, incorporating a more powerful CPU, more
    memory, Wi-Fi and Bluetooth support. You can pick up a Pi for around £32 or as
    a part of kit for £50+, depending on the kit you''re interested in.


    ![](img/ba40fbc39febe9db9a35785516d323a7_10_0.png)


    # FUZE PROJECT


    The FUZE is a learning environment built on the latest model of the Raspberry
    Pi. You can purchase the workstations that come with an electronics kit and even
    a robot arm for to build and program. You can find more information on the FUZE
    at www.fuze.co.uk


    ![](img/ba40fbc39febe9db9a35785516d323a7_10_1.png)


    # Complete Raspberry Pi


    # BOOKS


    We have several great Raspberry Pi titles available via www.bdmpublications.com.
    Our Pi books will help you find Raspberry Pi, set it up and use; there are some
    great step-by-step examples and guides to get the most from the Raspberry Pi too.


    # RASPBIAN


    The Raspberry Pi''s main operating system is a Debian-based Linux distribution
    that contains everything you need in a simple to use package. It''s streamlined
    for the Pi and is an ideal platform for hardware and software projects, Python
    programming and even as a desktop computer.


    ![](img/ba40fbc39febe9db9a35785516d323a7_10_2.png)


    > Raspberry Pi Tricks, Hacks & Fixes Learn to get the most from the amazing Raspberry
    Pi


