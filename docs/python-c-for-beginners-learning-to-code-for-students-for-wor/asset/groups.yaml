  mdcn: "\n\n# 操作系统特定需求\n\nC++ 可以在任何操作系统上运行，但对于初学者来说，收集所有必要的组件可能会令人困惑。这里是一些针对 C++\
    \ 的操作系统特定相关说明。\n\n# LINUX\n\nLinux 用户很幸运，因为他们的操作系统中已经内置了编译器和文本编辑器。任何文本编辑器都可以让你编写\
    \ C++ 代码并以 .cpp 扩展名保存，然后使用 g++ 对其进行编译。\n\n```cpp\n#include <iostream>\nint main()\
    \ {\n    std::cout << \"Hello, World!\" << std::endl;\n    return 0;\n}\n```\n\
