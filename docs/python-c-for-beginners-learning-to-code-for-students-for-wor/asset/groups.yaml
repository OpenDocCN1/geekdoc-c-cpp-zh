- md: "\n## Loops and Decision Making\n\n![](img/ba40fbc39febe9db9a35785516d323a7_125_0.png)\n\
    \nLoops and repetition are one of the most important factors of any programming\
    \ language. Good use of a loop creates a program that does exactly what you want\
    \ it to, and delivers the desired outcome without issues or errors.\n\nWithout\
    \ loops and decision making events in the code, your program cannot offer the\
    \ user any choice. It's this understanding of choice that elevates your skills\
    \ as a programmer and makes for much better code.\n\n# The most important property\
    \ of a program is whether it accomplishes the intention of its user.\n\n> – C.A.R.\
    \ Hoare (Computer scientist, developer of Quicksort)\n\n| Page Number | Topic\
    \ |\n| :--- | :--- |\n| 126 | While Loop |\n| 128 | For Loop |\n| 130 | Do...\
    \ While Loop |\n| 132 | If Statement |\n| 134 | If... Else Statement |\n\n## While\
    \ Loop\n\nA while loop's function is to repeat a statement, or a group of statements,\
    \ while a certain condition remains true. When the while loop starts, it initializes\
    \ itself by testing the condition of the loop and the statements within, before\
    \ executing the rest of the loop.\n\n### TRUE OR FALSE?\n\nWhile loops are one\
    \ of the most popular form of C++ code looping. They repeatedly run the code contained\
    \ within the loop while the condition is true. Once it proves false, the code\
    \ continues as normal.\n\n- **STEP 1** Clear what've done so far and create a\
    \ new C++ file. There's no need for any extra headers as usual:\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n```\n\n- **STEP 2** Create\
    \ a simple loop. Enter the code, build and run (we've added comments to the screen):\n\
    \n```cpp\nint num = 1;\nwhile (num < 30) {\n\tcout << \"Number: \" << num << endl;\n\
    \tnum = num + 1;\n}\nreturn 0;\n```\n\n```cpp\nint num = 1; // create the condition\n\
    while (num < 30) // the condition remains true while num is less than 30\n{\n\t\
    cout << \"Number: \" << num << endl; // display the value of num\n\tnum = num\
    \ + 1; // close the code and finishes the program\n}\nreturn 0;\n```\n\n- **STEP\
    \ 3** First you need to create a condition, use a variable called num and give\
    \ it value 1. Now create the while loop, stating that as long as num is less than\
    \ 30, the loop is true. The loop value of num is displayed and until it's more\
    \ than 30.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_127_0.png)\n\nWe're introducing\
    \ a few new elements here. The first are the opening and closing braces for the\
    \ loop. Because our loop is a loop statement, meaning a group of statements; note,\
    \ there's no semicolon after the statement. You also return 0, which is a clear\
    \ and preferred way of ending the code.\n\n- **STEP 5** If you didn't need to\
    \ see the continually increasing value of num, you could have gone away with the\
    \ compound statement and just added num by itself until then is displayed:\n\n\
    ```cpp\nint num = 1;\nwhile (num < 30) {\n\tcout << \"Number: \" << num << endl;\n\
    \tnum++;\n}\nreturn 0;\n```\n\n## While Loop\n\n**STEP 6** It's important to remember\
    \ not to add a semicolon at the end of a while statement. Why? Well, as you know,\
    \ the semicolon represents the end of a C++ line of code. If you place one at\
    \ the end of a while statement, your loop will be permanently stuck until you\
    \ close the program.\n\n**STEP 9** You can expand the code to enable each word\
    \ of the poem to appear every second. So you do need to pull in a new line, <windows.h>.\
    \ This is a Windows only library and within you use it the Sleep() function:\n\
    \n```cpp\n#include <iostream>\n#include <fstream>\n#include <windows.h>\nusing\
    \ namespace std;\nint main() {\n    string word;\n    ifstream newfile(\"C:\\\
    users\\david\\Documents\\poem.txt\");\n    cout << \"C++, by Robert Howard: \"\
    \ << endl;\n    while (word) {\n        cout << word << endl;\n        Sleep(1000);\n\
    \    }\n    return 0;\n}\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_128_0.png)\n\
    \n**STEP 7** In our example, if we execute the code the value of num is 1, as\
    \ set by the statement the code hits 1 less than 30 is true, the semicolon closes,\
    \ so the loop repeats; but never adds 1 to continue through the compound statement.\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_128_1.png)\n\n![](img/ba40fbc39febe9db9a35785516d323a7_128_2.png)\n\
    \n```cpp\n#include <iostream>\n#include <fstream>\nusing namespace std;\nint main()\
    \ {\n    string word;\n    ifstream newfile(\"C:\\users\\david\\Documents\\poem.txt\"\
    );\n    cout << \"C++, by Robert Howard: \" << endl;\n    while (word) {\n   \
    \     cout << word << endl;\n        Sleep(1000);\n    }\n    return 0;\n}\n```\n\
    \n**STEP 8** You can manipulate the while statement to display different results\
    \ depending on what code lies within, for example read the poem by Robert Howard:\n\
    \n```cpp\n#include <iostream>\n#include <fstream>\nusing namespace std;\nint main()\
    \ {\n    string word;\n    ifstream newfile(\"C:\\users\\david\\Documents\\poem.txt\"\
    );\n    cout << \"C++, by Robert Howard: \" << endl;\n    while (word) {\n   \
    \     cout << word << endl;\n        Sleep(1000);\n    }\n    return 0;\n}\n```\n\
    \n**STEP 10** Sleep() runs in milliseconds, so Sleep(1000) is one second, ten\
    \ seconds is ten seconds and a while loop will help you come up with some countdown\
    \ code.\n\n```cpp\n#include <iostream>\n#include <windows.h>\nusing namespace\
    \ std;\nint main() {\n    int a = 10;\n    while (a != 0) {\n        cout << a\
    \ << endl;\n        a = a - 1;\n        Sleep(1000);\n    }\n    cout << \"\\\
    nBlast Off!\" << endl;\n    return 0;\n}\n```\n\n## For Loop\n\nIn some respects,\
    \ for works in a very similar way to a while loop, although its structure is different.\
    \ A loop is split into three stages: an initialise, a condition and an incremental\
    \ step. Once set up, the loop repeats itself until the condition becomes false.\n\
    \n## LOOPS\n\nThe initialise stage of for loop is executed only once and sets\
    \ the point for the loop. The condition is evaluated by the loop to see if it's\
    \ true or false and then the increment: the loop executes the second and third\
    \ stage.\n\n- **STEP 1** Create a new C++ file, with the standard headers:\n\n\
    ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n```\n\n- **STEP\
    \ 2** Start simple and create a loop that counts from 1 to 30, displaying the\
    \ value to the screen with each increment:\n\n```cpp\n// Loop Begins\nfor(int\
    \ num = 1; num < 30; num + 1) {\n\tcout << \"Number: \" << num << endl;\n\treturn\
    \ 0;\n}\n```\n\n- **STEP 4** After the loop, you created a compound statement\
    \ in braces (curly brackets), that displays the integer num. Every time the loop\
    \ repeats itself, the second and third stages of the loop adds 1 until the condition\
    \ <30 is false. The loop ends and the code continues, ending nearly with return\
    \ 0.\n\n```cpp\n// Loop Begins\nfor (int num = 1; num < 30; num + 1) {\n\tcout\
    \ << \"Number: \" << num << endl;\n\treturn 0;\n}\n```\n\n- **STEP 5** A for loop\
    \ is quite a neat package in C++, all within its brackets, while the other elements\
    \ of the loop are displayed below. If you want to create a 10-second condition,\
    \ you could use:\n\n```cpp\n#include <iostream>\n#include <windows.h>\nusing namespace\
    \ std;\nint main ()\n```\n\n- **STEP 3** Working through the process of the for\
    \ loop, by creating an integer counter and assigning it a value of 1. Set the\
    \ condition, in this case num being less than 30. The last stage is where the\
    \ loop increments; here it increments the value of num by 1.\n\n```cpp\n// Loop\
    \ Begins\nfor(int a = 10; a != 0; a = a - 1) {\n\tcout << a << endl;\n\tSleep(1000);\n\
    }\n```\n\n```cpp\n// Loop Begins\nfor(int num = 1; num < 30; num + 1)\ncout <<\
    \ \"\\nBlast Off!\" << endl;\nreturn 0;\n```\n\n- **STEP 6**\n\nWith the countdown\
    \ timer, don't forget to include the windows.h library, so you can use the Sleep\
    \ command. Build and run; in the console you can see the numbers 10 to 1 countdown\
    \ in one second increments, until it reaches zero and Blast off!\n\n```\nC:\\\
    Users\\Default\\Documents\\ForLoop.exe\nLast Off!\nprocess returned (0x0) execution\
    \ time : 10.084 s\nPress any key to continue.\n```\n\n- **STEP 9**\n\nHere's an\
    \ example of a for loop displaying the multiplication tables of a user inputted\
    \ number. Handy for students:\n\n```cpp\nint n;\ncout << \"Enter a number to view\
    \ its times table:\";\ncin >> n;\nfor (int i = 1; i <= 12; i++) {\ncout << n <<\
    \ \" x \" << i << \" = \" << n * i << endl;\n}\nreturn 0;\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_130_0.png)\n\
    \n- **STEP 7**\n\nNaturally you can include more content into the for loop, using\
    \ some input:\n\n```cpp\nint i, fact = 1;\ncout << \"Enter a number: \";\ncin\
    \ >> n;\nfor (i = 1; i <= n; i++) {\nfact *= i;\n}\ncout << \"nFactorial of \"\
    \ << n << \" = \" << fact << endl;\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_130_1.png)\n\
    \n- **STEP 10**\n\nThe value of the integer i can be expanded from 12 to whatever\
    \ you want, displaying a very large multiplication table in the for loop (or a\
    \ small one). As long as it works, it works.\n\n```cpp\nfor (float i = 0.00; i\
    \ < 100.0; i += 0.01) {\ncout << i << endl;\n}\nreturn 0;\n```\n\n- **STEP 8**\n\
    \nThe code from step 7, built and run, asks for a number through the loop. The\
    \ user's number is stored in the variable n, then the factorial of that number\
    \ is returned. This is used to check if the condition is true or false, adding\
    \ each time and comparing to the user's number.\n\n```\nC:\\Users\\Default\\Documents\\\
    ForLoop.exe\nEnter a number: 8\nfactorial of 8 = 40320\nprocess returned (0x0)\
