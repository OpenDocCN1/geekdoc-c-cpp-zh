- md: "\n# Do... While Loop\n\nA do... while loop differs slightly from that of a\
    \ for or even a while loop. Both for and while examine the condition at the start\
    \ of the loop, or the top of the loop if you prefer. However, a do... while loop\
    \ is similar to a while loop but instead checks the condition at the bottom of\
    \ the loop.\n\n# DO LOOPS\n\nThe good thing about a do... while loop is that it's\
    \ guaranteed to run at least once. Its structure is: do, followed by statements,\
    \ while. This is how it works.\n\n- STEP 1 Begin with a blank, C++ file and enter\
    \ the standard headers:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    \nint main() {\n\n```\n\n- STEP 2 Begin with a simple number count:\n\n```cpp\n\
    int num = 1;\ndo {\n    cout << \"Number: \" << num << endl;\n    num = num +\
    \ 1;\n}\nwhile (num < 30);\nreturn 0;\n```\n\n- STEP 3 Now, here's a look at the\
    \ structure of a do... while loop. First create an integer called num, with the\
    \ value of 1. Now the do... while begins. The code inside the body of the loop\
    \ is executed at least once, then the condition is checked for true or false.\n\
