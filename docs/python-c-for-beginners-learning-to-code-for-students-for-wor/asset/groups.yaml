- md: "\n## Defining Constants\n\nConstants are fixed values in your code. They can\
    \ be any basic data type but the name suggests their value remain throughout the\
    \ entire code. There are two separate ways to define a constant in C++, the #define\
    \ pre-processor and const.\n\n### #DEFINE\nThe pre-processors are instructions\
    \ to the compiler to pre-process the information before it goes ahead and compiles\
    \ the code. #include is a pre-processor as as #define.\n\n### STEP 1\nYou can\
    \ use the #define pre-processor to define any constants in our code. Start by\
    \ creating a new C++ file with the following headers:\n\n### STEP 3\nNote the\
    \ capitals for defined constants, it's considered good programming practise to\
    \ define all constants in capitals. Here, the assigned values are 50, 40 and 60,\
    \ so let's call them up:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main () {\n}\n```\n\n```cpp\n#include <iostream>\nusing namespace std;\n#define\
    \ LENGTH 50\n#define WIDTH 40\n#define HEIGHT 60\n```\n\n```cpp\nint main () {\n\
    \  cout << \"Length is: \" << LENGTH << \"\\n\";\n  cout << \"Width is: \" <<\
    \ WIDTH << \"\\n\";\n  cout << \"Height is: \" << HEIGHT << \"\\n\";\n}\n```\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_121_0.png)\n\n### STEP 2\nLet's assume\
    \ your code has three different constants: length, width and height. You can define\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n#define LENGTH 50\n#define\
    \ WIDTH 40\n#define HEIGHT 60\n```\n\n```cpp\nint main () {\n}\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_121_1.png)\n\
    \n### STEP 4\nBuild and run, just as expected, it displays values for each of\
    \ the constants. It's worth noting that you don't need a semicolon when you're\
    \ defining a constant with the #define keyword.\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n#define LENGTH 50\n#define WIDTH 40\n#define HEIGHT 60\n\
    ```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_121_1.png)\n\n![](img/ba40fbc39febe9db9a35785516d323a7_121_3.png)\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_121_4.png)\n\n### STEP 5\nYou can also\
    \ define other elements as a constant. For example, instead of using \\n for a\
    \ newline in the code statement, you define it at the start of the code:\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n#define LENGTH 50\n#define WIDTH 40\n\
    #define HEIGHT 60\n#define NEWLINE '\\n'\n\nint main() {\n    cout << \"Length:\
    \ \" << LENGTH << NEWLINE;\n    cout << \"Width: \" << WIDTH << NEWLINE;\n   \
    \ cout << \"Height: \" << HEIGHT << NEWLINE;\n    return 0;\n}\n```\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n#define LENGTH 50\n#define WIDTH 40\n\
    #define HEIGHT 60\n#define NEWLINE '\\n'\n\nint main() {\n    cout << \"Length:\
    \ \" << LENGTH << NEWLINE;\n    cout << \"Width: \" << WIDTH << NEWLINE;\n   \
    \ cout << \"Height: \" << HEIGHT << NEWLINE;\n    return 0;\n}\n```\n\n### STEP\
    \ 6\nThe code, when built and executed, does exactly the same as before, but now\
    \ we insert the NEWLINE constant. Inserting a newline isn't a good idea unless\
    \ you're making it harder than \\n or the end of the code\n\n![](img/ba40fbc39febe9db9a35785516d323a7_122_0.png)\n\
    \n### STEP 7\nDefining a constant is a good way of initializing your base values\
    \ at the start of your code. You can define it having three lines, or even using\
    \ the C++ method:\n\n```cpp\n#include <iostream>\nusing namespace std;\n#define\
    \ PI 3.14159\n\nint main() {\n    cout << \"The value of PI is: \" << PI << endl;\n\
    \    return 0;\n}\n```\n\n### STEP 8\nAnother method of defining a constant is\
    \ with the const keyword. Use together with a data type, const variable = value.\
    \ Using PI as an example:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main() {\n    const double PI = 3.14159;\n    cout << \"The value of PI is:\
    \ \" << PI << endl;\n    return 0;\n}\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_122_1.png)\n\
    \n### STEP 9\nBecause you're using const within the main block of code, you need\
    \ to finish the line with a semicolon, unlike #define. It's worth noting that\
    \ #define requires memory, so using const is best.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_122_2.png)\n\
    \n### STEP 10\nConst works in the same way as #define. You can create static integers\
    \ and even strings:\n\n```cpp\n#include <iostream>\nusing namespace std;\nint\
    \ main() {\n    const int LENGTH = 50;\n    const int WIDTH = 40;\n    const char\
    \ NEWLINE = '\\n';\n    int area = LENGTH * WIDTH;\n    cout << \"Area is: \"\
    \ << area << NEWLINE;\n    return 0;\n}\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_122_3.png)\n\
    \n## File Input/Output\n\nThe standard iostream library provides C++ coders with\
    \ the cin and cout input and output functionality. However, to be able to read\
    \ and write from a file, you need the fstream library.\n\n### fstream\nThe standard\
    \ fstream library provides C++ coders with the ifstream and ofstream input and\
    \ output functionality. However, to be able to read and write from a file, you\
    \ need the fstream library.\n\nThere are two types of fstream: ifstream and ofstream.\n\
    \n- ifstream: used for reading from a file.\n- ofstream: used for writing to a\
    \ file.\n\n### STEP 1\nTo write to a file, you can use the ofstream class. You\
    \ create an object of ofstream and then use the open() method.\n\n```cpp\n#include\
    \ <iostream>\n#include <fstream>\nusing namespace std;\n\nint main() {\n    ofstream\
    \ outFile;\n    outFile.open(\"test.txt\");\n    outFile << \"Hello World!\";\n\
    \    outFile.close();\n    return 0;\n}\n```\n\n### STEP 2\nTo read from a file,\
    \ you can use the ifstream class. You create an object of ifstream and then use\
    \ the open() method.\n\n```cpp\n#include <iostream>\n#include <fstream>\nusing\
    \ namespace std;\n\nint main() {\n    ifstream inFile;\n    inFile.open(\"test.txt\"\
    );\n    string line;\n    while (getline(inFile, line)) {\n        cout << line\
    \ << endl;\n    }\n    inFile.close();\n    return 0;\n}\n```\n\n### STEP 3\n\
    To read and write to a file, you can use both ifstream and ofstream.\n\n```cpp\n\
    #include <iostream>\n#include <fstream>\nusing namespace std;\n\nint main() {\n\
    \    ofstream outFile;\n    outFile.open(\"test.txt\");\n    outFile << \"Hello\
    \ World!\";\n    outFile.close();\n\n    ifstream inFile;\n    inFile.open(\"\
    test.txt\");\n    string line;\n    while (getline(inFile, line)) {\n        cout\
    \ << line << endl;\n    }\n    inFile.close();\n    return 0;\n}\n```\n"
  mdcn: "\n\n## 定义常量\n\n常量是代码中的固定值。它们可以是任何基本数据类型，但名称暗示了它们的值在整个代码中保持不变。在 C++ 中定义常量有两种不同的独立方式：`#define`\
    \ 预处理器和 `const`。\n\n### #DEFINE\n预处理器是给编译器的指令，用于在编译代码之前对信息进行预处理。`#include` 和 `#define`\
    \ 一样都是预处理器。\n\n### 步骤 1\n你可以使用 `#define` 预处理器来定义代码中的任何常量。首先创建一个包含以下头文件的新 C++ 文件：\n\
    \n### 步骤 3\n注意定义常量使用大写字母，将所有常量定义为大写被认为是一种良好的编程习惯。在这里，赋值的值为 50、40 和 60，让我们给它们起大写名字：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main () {\n}\n```\n\n\
    ```cpp\n#include <iostream>\nusing namespace std;\n#define LENGTH 50\n#define\
    \ WIDTH 40\n#define HEIGHT 60\n```\n\n```cpp\nint main () {\n  cout << \"Length\
    \ is: \" << LENGTH << \"\\n\";\n  cout << \"Width is: \" << WIDTH << \"\\n\";\n\
