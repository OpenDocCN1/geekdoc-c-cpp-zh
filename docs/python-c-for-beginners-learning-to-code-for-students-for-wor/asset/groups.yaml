- md: "\n# Getting Started with Python\n\n## Working with Variables\n\nWe've seen\
    \ some examples of variables in our Python code already but it's always worth\
    \ going through the way they operate and how Python creates and assigns values\
    \ to a variable.\n\n## VARIOUS VARIABLES\n\nYou'll be working with the Python\
    \ 3 IDLE Shell in this tutorial. If you haven't already, open Python 3 or close\
    \ the previous IDLE Shell to clear up any code.\n\n- **STEP 1** In some programming\
    \ languages you're required to use a dollar sign to denote a string, which is\
    \ a variable made up of multiple characters, such as a name of a person. In Python\
    \ this isn't necessary. In the Shell enter: `name=\"David\"` (or use your own\
    \ name, you're also called David Howard).\n\n- **STEP 2** You can choose the type\
    \ of variable in use by issuing the `type()` command, naming the name of the variable\
    \ inside the brackets. In our example, this will be: `type(name)`. Add a new variable:\
    \ `title=\"Descended from Vikings\"`.\n\n- **STEP 3** You've previously seen that\
    \ variables can be concatenated using the plus symbol between:\n\n![](img/ba40fbc39febe9db9a35785516d323a7_33_0.png)\n\
    \n| File Edit Shell Debug Options Windows help |\n|---|---|---|---|---|\n| Python\
    \ 3.4.2 (Default, Oct 19 2014, 13:31:11) | | | |\n| type=\"copyright\", \"credits\"\
    \ or \"license\" for more information. | | | |\n| name=\"David\" | | | |\n| print(name)\
    \ | | | |\n| David Howard | | | |\n\n- **STEP 4** You can also combine variables\
    \ within another variable. For example, to combine both name and title variables\
    \ into a new variable use:\n\n| File Edit Shell Debug Options Windows help |\n\
    |---|---|---|---|---|\n| Python 3.4.2 (Default, Oct 19 2014, 13:31:11) | | | |\n\
    | type=\"copyright\", \"credits\" or \"license\" for more information. | | | |\n\
    | name=\"David\" | | | |\n| print(name) | | | |\n| David Howard | | | |\n\n| File\
    \ Edit Shell Debug Options Windows help |\n|---|---|---|---|---|\n| Python 3.4.2\
    \ (Default, Oct 19 2014, 13:31:11) | | | |\n| [4.4.1] on linux | | | |\n| type=\"\
    copyright\", \"credits\" or \"license\" for more information. | | | |\n| name=\"\
    David\" | | | |\n| print(name) | | | |\n| David Howard | | | |\n| title=\"Descended\
    \ from Vikings\" | | | |\n| print(title) | | | |\n| Descended from Vikings | |\
    \ | |\n\n| File Edit Shell Debug Options Windows help |\n|---|---|---|---|---|\n\
    | Python 3.4.2 (Default, Oct 19 2014, 13:31:11) | | | |\n| type=\"copyright\"\
    , \"credits\" or \"license\" for more information. | | | |\n| name=\"David\" |\
    \ | | |\n| print(name) | | | |\n| David Howard | | | |\n| title=\"Descended from\
    \ Vikings\" | | | |\n| print(title) | | | |\n| Descended from Vikings | | | |\n\
    \n```python\ncharacter_name = name + \" \" + title\n```\n\nThen output the result\
    \ of the new variable as:\n\n```python\nprint(character_name)\n```\n(Note: OCR\
    \ error character-name corrected to character_name logic)\n\nNumbers are stored\
    \ as different variables:\n```python\nage = 44\ntype(age)\n```\nWhich are integers,\
    \ as we know.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_33_1.png)\n\nBDM's Definitive\
    \ Guide Series - Volume 3\n\n## Working with Variables\n\nSTEP 5 However, you\
    \ can't combine strings and integer type variables in the same command, as you\
    \ need to enter one into the other or versa. When you try to combine both, you\
    \ get an error message:\n\n```python\nPython 3.4.2 (default. Oct 19 2014, 13:38:11)\n\
    [GCC 4.8.0.1 Linux]\n>>> type(\"credits\" or \"license\") for more information.\n\
    >>> name = \"Howard\"\n>>> print(name)\nhoward\n>>> type(name)\n<class 'str'>\n\
    >>> character = \"Descended from Vikings\"\n>>> type(character)\n<class 'str'>\n\
    >>> age = 44\n>>> print(age + \" years\")\nTraceback (most recent call last):\n\
    \  File \"stdin\", line 1, in <module>\n    expression>\nTypeError: Can't convert\
    \ 'int' to object str implicitly\n```\n\nSTEP 8 This presents a bit of a problem\
    \ when you want to work with a variable that's been inputted by the user, as age\
    \ + 10 will be a string instead of an integer. In instance, you need to:\n\n```python\n\
    int(age) + 10\n```\nThis will Typecast the age into an integer that can be worked.\n\
    \nSTEP 6 This is a process called Typecasting. The Python code is:\n\n```python\n\
    print (character + \" is \" + str(age) + \" years old.\")\n```\n\nor you can use:\n\
    \n```python\nprint(character, \"is\", age, \"years old.\")\n```\n\nNotice that\
    \ in this case, you don't need to space the words between the quotes as commas\
    \ treat each argument to separate separately.\n\n```python\n>>> print (name, age)\n\
    Python 3.4.2 (default. Oct 19 2014, 13:38:11)\n[GCC 4.8.0.1 Linux]\n>>> type(age)\n\
    Traceback (most recent call last):\n  File \"stdin\", line 1, in <module>\n  \
    \  expression>\nTypeError: Can't convert 'int' to str implicitly\n>>> David =\
    \ \"Descended from Vikings\"\n>>> print(character, \"is\", age, \"years old.\"\
    )\nHoward is 44 years old.\n>>> David = \"Descended from Vikings\"\n```\n\nSTEP\
    \ 9 The use of Typecasting is also important when dealing with floating point\
    \ arithmetic; remember, for example:\n\n```python\nstring = 19.99\n```\nNow Python\
    \ will handle the number as a 'float', because the value contains a decimal.\n\
    \n```python\n>>> Python 3.4.2 (default. Oct 19 2014, 13:38:11)\n[GCC 4.8.0.1 Linux]\n\
    >>> type(string)\n<class 'float'>\n>>> age = input(\"How old are you? \")\n44\n\
    >>> type(age)\n<class 'str'>\n```\n\nSTEP 7 Another example of Typecasting is\
    \ when you use input from the user, as example:\n\n```python\nage = input(\"How\
    \ old are you? \")\n```\nAll data stored from the input command is a string variable.\n\
    \n```python\n>>> Python 3.4.2 (default. Oct 19 2014, 13:38:11)\n[GCC 4.8.0.1 Linux]\n\
    >>> type(age)\n<class 'str'>\n>>> string = 19.99\n>>> type(string)\n<class 'float'>\n\
    >>> int(age)\n```\n\nSTEP 10 When combining integers and floats Python will convert\
    \ the integer to a float, something worth mentioning that Python doesn't return\
    \ the exact value. When converting, Python will always round down to the nearest\
    \ integer, in instance 19.99 it becomes.\n\n## User Input\n\nWe've seen some basic\
    \ user interaction with the code a few examples, so now would be a good time to\
    \ focus solely on how you would get information from the user then present it.\n\
    \n## USER FRIENDLY\n\nThe type of input you want from the user will depend greatly\
    \ on the type of program you're coding. For example, a game may ask for a character\
    \ name, whereas a database can ask for personal details.\n\n- If it's not already,\
    \ open the Python 3 IDLE Shell, start a New File in the Editor. Let's begin with\
    \ something simple, enter:\n\n```python\nprint(\"Hello\")\nfirstname = input(\"\
    What is your name? \")\nprint(\"Thanks.\")\nsurname = input(\"What is your surname?\
    \ \")\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_35_0.png)\n\n- **STEP 2**\
    \ Save and execute the code, and as you already no doubt in the IDLE Shell the\
    \ program will ask for your first name, storing as the surname in its own variable\
    \ (surname);\n\n```python\nPython 3.4.2 Shell\nFile Edit Shell Debug Options Windows\
    \ help\nPython 3.4.2 (default, Oct 19 2014, 13:35:13)\n>>> print(\"Hello\")\n\
    Hello\n>>> firstname = input(\"What is your name? \")\nDavid\n>>> print(\"Thanks.\"\
    )\nThanks.\n>>> surname = input(\"What is your surname? \")\nHayward\n>>>\n```\n\
    \n- **STEP 4** Run the code and you can see a slight issue, the full stop after\
    \ the surname a blank space. To eliminate that you could add a plus sign in the\
    \ comma in the code:\n\n```python\nprint(\"Welcome \" + surname + \".\")\n```\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_35_1.png)\n\n- **STEP 5** You don't\
    \ always have to include quoted text within the input command. For example, you\
    \ can ask the user their name, and have the input in the line:\n\n```python\n\
    print(\"Hello. What's your name?\")\nname = input()\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_36_0.png)\n\
    \n```python\nprint(\"Hello. What's your name?\")\nname = input()\n```\n\n- **STEP\
    \ 8** What you've created is a condition, which will soon cover. In short, we're\
    \ using the input and measuring it against a condition. So, if the user enters\
    \ David as their name, the guard will allow them to pass unharmedly. Else, if\
    \ they enter another name than David, the guard challenges them to a fight.\n\n\
    ![](img/ba40fbc39febe9db9a35785516d323a7_36_1.png)\n\n- **STEP 6** The code from\
    \ the previous step is often regarded as being better than having a length in\
    \ the input, but it's not a rule that's set in stone, so do as you like in these\
    \ situations.\n\n```python\nprint(\"Wait! Who goes there?\")\nname = input()\n\
    ```\n\n- **STEP 9** Just as you learned previously, any input from a user is automatically\
    \ a string, so you need to Typecast or turn it into something. This creates interesting\
    \ additions to the input command. For example:\n\n# To calculate rate and distance\n\
    \n```python\nprint(\"A rate and distance\")\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_36_2.png)\n\
    \n```python\nprint(\"\"Wait! Who goes there?\")\nname = input()\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_36_3.png)\n\
    \n```python\nprint(\"A rate and distance\")\nrate = float(input(\"Rate: \"))\n\
    ```\n\n- **STEP 7** It's a good start to expand a text adventure game, perhaps?\
    \ Now you can expand on it and use the raw input to finish the game with a battle:\n\
    \n```python\nif name==\"David\":\n    print(\"Welcome, good sir. You may pass.\"\
    )\nelse:\n    print(\"I know you not. Prepare for battle!\")\n```\n\n- **STEP\
    \ 10** To finalise the rate and distance, we can add:\n\n```python\ndistance =\
    \ float(input(\"Distance: \"))\nprint(\"Time: \", (distance / rate))\n```\n\n\
    Save the code and enter some numbers. Using the float element, you can do anything\
    \ that is a floating number rather than a string.\n"
