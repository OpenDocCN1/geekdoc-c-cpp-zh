    \ outline, yellow in this case.\n\nSTEP 8 Now let's get the code by importing\
    \ the Pygame module:\n\n```python\nimport pygame\npygame.init()\nimg = pygame.image.load(\"\
    RPI.png\")\nwhite = (255, 255, 255)\nw = 900\nh = 450\nscreen = pygame.display.set_mode((w,h))\n\
    screen.fill((white))\nscreen.blit(img,(0,0))\npygame.display.flip()\n\nwhile:\n\
    \    for event in pygame.event.get():\n        if event.type == pygame.QUIT:\n\
    \            pygame.quit()\n```\n\nSTEP 6 You can see that the Turtle module can\
    \ draw some pretty shapes and more complex as you begin master the ways to do\
    \ it. This enters our example:\n\n```python\nfrom turtle import *\ncolor('red',\
    \ 'yellow')\nbegin_fill()\nwhile True:\n    forward(200)\n    left(170)\n    if\
    \ abs(pos()) < 1:\n        end_fill()\ndone()\n```\n\nIt's a different method,\
    \ but very effective.\n\nSTEP 9 In the previous step you imported, initiated\n\
    the pygame engine and initialized it to import our raspberry\nRaspberry Pi image\
    \ (as RPI.png). Next you define the\nbackground color of the window to display\
    \ the image and\nwindow size as per actual image dimensions. Finally you have\
    \ a\nloop to close the window.\n\n```python\nw = 900\nh = 450\nscreen = pygame.display.set_mode((w,\
    \ h))\nscreen.fill((white))\nscreen.blit(img,(0,0))\npygame.display.flip()\n\n\
    while:\n    for event in pygame.event.get():\n        if event.type == pygame.QUIT:\n\
    \            pygame.quit()\n```\n\nAnother way in which you can display graphics\n\
    using pygame can help you output graphics to the screen\nbut for now let's try\
    \ displaying a predefined image. Start by opening a browser and saving image,\
    \ then save it to the folder\nwhere you save your code. STEP 10 Press F5 to save\
    \ and execute the code\nimage will be displayed in a new window. Have\nround around\
    \ the colours, sizes and take some time to\nmany functions in the Pygame too.\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_64_0.png)\n\n![](img/ba40fbc39febe9db9a35785516d323a7_64_1.png)\n\
    \n“Good code is short, simple, and the challenge is figuring out how to get there.”\n\
    \nA Python module is simply a Python source file that contains the necessary code,\
