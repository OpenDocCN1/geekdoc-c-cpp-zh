    \ something goes wrong. It's much easier to start where you left off, rather than\
    \ starting from the beginning.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_140_0.png)\n\
    \n## Re-inventing Wheels\n\nYou can easily spend days to fathom out section of\
