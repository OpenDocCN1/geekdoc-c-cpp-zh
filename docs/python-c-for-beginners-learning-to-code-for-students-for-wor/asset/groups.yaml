    \    print('Directory Found')\n    else:\n        print('Directory Not Found')\n\
    ```\n\n- 5. List files in a directory\n- 6. Check file existence\n- 7. Move a\
    \ file\n- 8. Copy a file\n- 9. Create a directory\n- 10. Delete a directory\n\
    - 11. Open program\n- 12. Exit\n\n```python\nif dec=='1':\n    Read()\nif dec=='2':\n\
    \    Write()\nif dec=='3':\n    Add()\nif dec=='4':\n    Delete()\nif dec=='5':\n\
