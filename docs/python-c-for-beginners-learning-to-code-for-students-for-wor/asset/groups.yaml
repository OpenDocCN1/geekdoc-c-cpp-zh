    \ Python, simple addition and the like. Let's expand on that and see how powerful\
    \ Python is as a calculator. You can work within the IDLE Shell or in the Editor,\
    \ whichever you like.\n\n## IT'S ALL MATH, MAN\n\nYou can get some impressive\
    \ results with the mathematical powers of Python; and with most, if not all, programming\
    \ languages, maths is the driving behind the code.\n\n- STEP 1 Open up the current\
    \ version of Python 3, as mentioned above for the time being, you're going to\
    \ use the Shell or the Editor, which we believe is a small gland located at the\
    \ back of the brain (or not).\n\n```\nPython 3.4.2 Shell\n>>> Python 3.4.2 (default,\
    \ Oct 19 2014, 13:31:11)\n>>> (SCC 4.9.1) on Windows\n>>> 'copyright', 'credits'\
    \ or 'license' for more information.\n>>> \n```\n\n- STEP 2 In the Shell enter\
    \ the following:\n2*2\n54356+3455245\n9986734*2734684421\n\nYou can see that Python\
    \ can handle large numbers.\n\n- STEP 3 You can use all the mathematical operations:\
    \ divide, multiply, brackets and so on. Practise with a few, for example:\n\n\
    ```\n1/2\n2*3\n(1+2)+(3*4)\n```\n\n```\nPython 3.4.2 Shell\n>>> Python 3.4.2 (default,\
    \ Oct 19 2014, 13:31:11)\n>>> (SCC 4.9.1) on Windows\n>>> 'copyright', 'credits'\
    \ or 'license' for more information.\n>>> \n>>> 54356-3455245\n>>> 9986734*2734684421\n\
    >>> 2708210221178024\n>>> 6/2\n>>> 3.0\n>>> 15\n>>> 2*3\n>>> 6\n>>> (1+2)*(3*4)\n\
    >>> 15\n>>> 6/2\n>>> \n```\n\n- STEP 4 You've no doubt, division produces a decimal\
    \ number. These are called floats, or floating point arithmetic. However, if you\
    \ need an integer to a decimal, you can use a double slash:\n\n```\n1//2\n6//2\n\
    ```\n\nAnd so on.\n\n- STEP 5 You can also use an operation to see the remainder\
    \ left over division. For example:\n\n10/3\n\nWill display 3.333333333, which\
    \ is course 3.3-recurring. If you now enter:\n\nformat(3, \"b*\")\n\n10%3\n\n\
    This will display 1, which is the remainder left over from dividing 10 into 3.\n\
    \nThe Format converts a value, the number 3, to a formatted representation as\
    \ controlled by the format specification, the 'b' part.\n\n```\n>> 2**2\n4\n>>>\
    \ (1+2)*(3^4)\n243\n>>> 6/2\n3.0\n\n\n>>> 10/3\n3.3333333333333335\n>>> 2*3\n\
    6\n>>> 10**5\n100000\n>>> 0b11\n3\n>>> 0b101\n5\n```\n\n- STEP 6 Next we have\
    \ the power operator, or if you want to work out something exponential you can\
    \ use a double multiplication symbol on the keyboard.\n\n- STEP 7 Numbers and\
    \ expressions don't stop there. Python has built-in functions to work out sets\
    \ of mathematical values, complex numbers. To convert to a binary,\n\nbin(3)\n\
    \n- STEP 8 This will be displayed as '011', converting the integer into binary\
    \ and adding the prefix 0 to the front digit. If you want to use the prefix: bin(3)\n\
    \n- STEP 9 A Boolean statement is either true or false. We can use these to compare\
    \ data and see if it's less to, or greater than. This in a New file it's exactly\
    \ 2**3 but you're sure you know the basics. This is how you would work it out\
    \ in Python.\n\n```\na = 6\nb = 7\nprint(1, a == 6)\nprint(2, a == 7)\nprint(3,\
    \ a == 6)\nprint(4, a == 7)\nprint(5, a == 7)\nprint(6, a == 7)\nprint(7, a ==\
    \ 6)\nprint(8, a == 6)\n```\n\n```\n>> 6/2\n3.0\n>>> 2**3\n8\n>>> (1+2)*(3^4)\n\
    243\n>>> 10/3\n3.3333333333333335\n>>> 2*3\n6\n>>> 10**5\n100000\n>>> 0b11\n3\n\
    >>> 0b101\n5\n```\n\n- STEP 10 Execute the code from Step 9, and you can see the\
    \ result of the True or False statements, depending on values: 6 and 7! It's an\
    \ extension of what you looked out, and an important part of programming.\n\n\
    ```\nPython 3.4.2 (default, Oct 19 2014, 13:31:11)\n>>> (SCC 4.9.1) on Windows\n\
    >>> 'copyright', 'credits' or 'license' for more information.\n>>> 1\nTrue\n>>>\
    \ 2\nFalse\n>>> 3\nFalse\n>>> 4\nFalse\n>>> 5\nTrue\n>>> 6\nTrue\n>>> 7\nTrue\n\
    >>> 8\nFalse\n```\n\n# Using Comments\n\nWhen you write code, the flow, what each\
    \ variable does will operate and is all inside your head. Another programmer could\
    \ follow the code line by line but over time, it can become difficult to read.\n\
    \nComments! Programmers use a method of keeping their code readable by commenting\
    \ on certain sections. If a variable is used, the programmer comments on what\
    \ it's supposed to do, for example. It's just good practice:\n\n- STEP 1 Start\
    \ by creating a new instance of the IDLE Editor (File > New File) and create a\
    \ simple variable and print command.\n\n```\na=10\nprint(\"The value of A is\"\
    , a)\n```\n\nSave the file and execute.\n\n- STEP 2 Running the code will return\
    \ the line: The value of A is 10 into the IDLE Shell window, which is what we\
    \ expected. Now, add some of the comments you'd normally see inside:\n\n```\n\
