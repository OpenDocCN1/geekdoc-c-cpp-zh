    turtle.shape(\"turtle\")\n```\n\n你还可以使用命令 `turtle.begin_fill()` 和 `turtle.end_fill()`\
    \ 来用所选的颜色填充正方形：在这种情况下，是红色轮廓，黄色填充。\n\n第 8 步 现在让我们通过导入 Pygame 模块来获取代码：\n\n```python\n\
