    对于大多数语言，无论是计算机还是人类，核心都在于在正确的情况下应用正确的词。你并不是出生就知道这些词的，所以你需要学习它们。


    - 如果你关闭了 Python 3 IDLE，请在 Shell 中重新打开它，无论使用哪种操作系统。就像如下：


    ```python

    print("Hello")

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_23_0.png)


    - 第 3 步：你可以看到输出不是数字 4，而是你要求打印到屏幕上的 `2+2`。引号定义了输出到 IDLE Shell 的内容；要打印 2+2 的总和，你需要移除：


    ```python

    print(2+2)

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_23_1.png)


    - 第 2 步：正如预期的那样，单词 Hello 以蓝色文本的形式出现在 Shell 中，表示来自字符串的输出。它相当直接，不需要太多的解释。现在尝试：


    ```python

    print("2+2")

    ```


    - 第 4 步：你可以这样做，输出 `2+2`，并这样输出到 Shell。一种简单的方法是使用变量，这是我们稍后会深入讨论。现在，输入：


    ![](img/ba40fbc39febe9db9a35785516d323a7_23_2.png)


