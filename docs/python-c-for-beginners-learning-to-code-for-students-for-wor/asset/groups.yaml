- md: "\n## C++ Fundamentals\n\n## Strings\n\nStrings are objects that represent and\
    \ hold sequences of characters. For example, you could have a universal greeting\
    \ in your code 'Welcome' and assign that to a string to be called up wherever\
    \ you like in the program.\n\n## STRING THEORY\n\nThere are different ways in\
    \ which you can create a string of characters, which historically are all carried\
    \ over from the original C language, and are still supported by C++.\n\n- STEP\
    \ 1 To create a string you use the char function. Open a new C++ file and begin\
    \ with the usual header:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main () {\n\n}\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_111_0.png)\n\
    \nIt's easy to confuse a string with an array. Here's an array, which can be terminated\
    \ with a null character:\n\n- STEP 3 Build and run the code, and 'Welcome' appears\
    \ on the screen. While this is perfectly fine, it's not a string. A string is\
    \ a class, which defines objects that can be represented as a stream of characters\
    \ and doesn't need to be terminated like an array. The code can therefore be represented\
    \ as:\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main () {\nchar\
    \ greet[] = \"Welcome\";\ncout << greet << \"\\n\";\n}\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_111_1.png)\n\
    \n- STEP 4 In C++ there's also string function, which works in the same way. Using\
    \ the greeting code again,\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main () {\nstring greet = \"Welcome\";\ncout << greet << \"\\n\";\n}\n```\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main () {\nchar greet[]\
    \ = { 'W', 'e', 'l', 'c', 'o', 'm', 'e', '\\0' };\ncout << greet << \"\\n\";\n\
    }\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_111_2.png)\n\n## STEP 5\n\n\
    There are also many different operations that you can apply with the string function.\
    \ For instance, to get the length of a string you can use:\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main () {\n    string greet = \"Welcome\"\
    ;\n    cout << \"The length of the string is: \";\n    cout << greet.size() <<\
    \ \"\\n\";\n}\n```\n\n## STEP 8\n\nJust as you might expect, you can mix in an\
    \ integer and store something to do with the string. In this example, we created\
    \ length, which stores the result of string.size() and outputs it to the screen:\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main () {\n    int length;\n\
    \    string greet1 = \"Hello\";\n    string greet2 = \" world!\";\n    string\
    \ greet3 = greet1 + greet2;\n    length = greet3.size();\n    cout << \"The length\
    \ of the combined strings is: \" << length << \"\\n\";\n}\n```\n\n## STEP 6\n\n\
    You can see that we use string::size() to output the length, number of characters\
    \ there are, of the contents of the string. Naturally, if you call your something\
    \ other than get, you need change the method to it is always stringname. Build\
