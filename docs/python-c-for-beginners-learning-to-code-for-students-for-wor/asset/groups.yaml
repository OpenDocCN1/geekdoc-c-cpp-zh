    # OS Module


    The OS module allows you to interact directly with the built-in commands in your
    operating system. Commands vary depending on the OS you''re running, as some will
    work with Windows whereas others will work with Linux and macOS.


    #  INTO THE SYSTEM


    One of the primary features of the OS module is the ability to list, move, create,
    delete and otherwise interact with files stored on the system, making it the perfect
    module for backup code.


    +   STEP 1

    You can start the OS module with simple functions to see how it interacts with
    the operating system environment. If you''re using Python or the Raspberry Pi,
    try this:


    ```

    import os

    home=os.getcwd()

    print(home)

    ```


    +   STEP 3

    The Windows output is different than that''s the system; as you might suspect,
    the os.getcwd() function is asking Python to retrieve the Current Working Directory.
    Linux users will see something along the same lines as the Raspberry Pi, as will


    ![](img/ba40fbc39febe9db9a35785516d323a7_71_0.png)


    +   STEP 2

    The returned result from printing the variable home is the current user''s folder
    on the system. In our example that''s /home/pi; it will be depending on the user
    name you log in or the operating system you use. For example, Windows 10 will
    output: C:\Program Files (x86)\Python36-32.


    ```

    import os

    browser=os.system("/usr/bin/chromium-browser")

    ```


    ```

    import os

    home=os.getcwd()

    print(home)

    /home/pi

    ```


    +   STEP 4

    Yet another interesting aspect to the OS module, is its ability to launch programs
    that are installed in the host system. If you wanted to launch the Chrome browser
    from a Python program you can use the command:


    ![](img/ba40fbc39febe9db9a35785516d323a7_71_1.png)'
