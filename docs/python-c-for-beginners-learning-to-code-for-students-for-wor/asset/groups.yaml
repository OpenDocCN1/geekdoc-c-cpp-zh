    # STEP 6


    Interestingly, you can also use a function within the Random module to shuffle
    the items in the list, thus adding a little randomness to the equation:


    ```

    random.shuffle(lst)

    print(lst)

    ```


    This way, you can shuffle the list by displaying a random item from it.


    # STEP 9


    Let''s use an example of code which flips a virtual coin ten thousand times and
    counts how it lands on heads or tails:


    ```

    import random

    output={"Heads":0, "Tails":0}

    coin=list(output.keys())

    for i in range(10000):

    output[random.choice(coin)]+=1

    print("Heads:", output["Heads"])

    print("Tails:", output["Tails"]

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_74_0.png)


    # STEP 7


    Using shuffle, you can create an entirely random list of numbers. For example,
    within a given range:


    ```

    import random

    lst=[i for i in range(20)]

    random.shuffle(lst)

    print(lst)

    ```


    Keep shuffling the list and you can have different selections of items from 0
    to 20 every time.


    ![](img/ba40fbc39febe9db9a35785516d323a7_74_1.png)


