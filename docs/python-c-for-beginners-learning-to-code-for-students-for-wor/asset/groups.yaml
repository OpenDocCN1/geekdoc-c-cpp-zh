  mdcn: "\n\n# Python 模块\n\n我们之前提到过模块（如 Math 模块），但由于它们是充分利用 Python 性能的重要组成部分，我们值得花更多时间来研究它们。在本例中，我们使用的是\
    \ Windows 版本的 Python 3。\n\n## 精通模块\n\n将模块想象成导入到 Python 代码中的扩展，用于增强和扩展其功能。有无数模块可用，而且正如我们所看到的，你甚至可以创建自己的模块。\n\
    \n- **第 1 步** 尽管 Python 的内置函数很好，但它们是有限的。然而，使用模块允许我们编写更复杂的程序。如你所知，导入 Python 脚本的方式如\
    \ `import math`。\n\n- **第 2 步** 某些模块（特别是在树莓派上）是默认包含的，Math 模块就是一个很好的范例。遗憾的是，其他模块是不可用的。非树莓派平台上的一个例子是\
    \ Pygame，它包含了许多创建游戏的函数：`import pygame`。\n\n- **第 3 步** 结果是 IDLE Shell 报错，因为 Python\
    \ 中没有识别或安装 Pygame 模块。要安装模块，我们可以使用 PIP（Pip installs Packages）。关闭 IDLE Shell 并进入命令提示符（终端）。在管理员权限的命令提示符中输入：`pip\
    \ install pygame`。\n\n```\nEdit Shell Options Window Help\nPython 3.6.2 (V3.6.2:0653db3,\
    \ Jul 8 2017, 04:14:34) [MSC v.1900 32 bit (Intel)]\nType \"quote\", \"credit\"\
    \ or \"license\" for more information.\n>>> import math\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_41_0.png)\n\
    \n- **第 4 步** PIP 安装需要高权限，因为要在不同的位置安装组件。Windows 可以通过开始按钮搜索 CMD 并右键点击结果以“以管理员身份运行”，Linux\
    \ 和 Mac 可以使用 `sudo`，输入 `sudo pip install pygame`。\n\n```\nEdit Shell Options Window\
    \ Help\nPython 3.6.2 (V3.6.2:0653db3, Jul 8 2017, 04:14:34) [MSC v.1900 32 bit\
    \ (Intel)]\nType \"quote\", \"credit\" or \"license\" for more information.\n\
    >>> import pygame\n>>> pygame.init()\nTraceback (most recent call last):\n  File\
