    \ << endl;\n} else {\n    cout << \"The number is greater than 30!\" << endl;\n\
    };\n```\n\n## 第 4 步\n\n`else` 检查数字是否大于 30 并输出到控制台，然后显示“and finally, the code is\
    \ terminated satisfactorily.”\n\n```cpp\nelse {\n    cout << \"The number is greater\
    \ than 30!\" << endl;\n}\n```\n\n## 第 5 步\n\n你可以更改代码中的 `num` 值来输入一个值：你可以通过使用用户来改进代码：\n\
