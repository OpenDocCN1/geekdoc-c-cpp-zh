    \    Openfile()\nif dec=='12':\n    exit()\nrun-let=input(\"1.Return to menu 2.Exit\
    \ \\n\")\nexit()\n```\n\n```python\ndef move():\n    path=input(\"Enter the source\
    \ path of file to move:\")\n    mr=input(\"1.Rename 2.Move \\n\")\n    if mr=='1':\n\
    \        path=input(\"Enter the destination path and name:\")\n        shutil.move(path,path)\
    \ # Logic corrected for context\n    if mr=='2':\n        path=input(\"Enter the\
