    \ will now accept name, otherwise it prints. In the Shell, enter: name=\"Bob\"\
    , Hello(name). You can now pass functions through functions.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_38_4.png)\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_38_5.png)\n\n# Getting Started with\
    \ Python\n\n## Conditions and Loops\n\nConditions and loops are what makes a program\
    \ interesting; they can be simple or rather complex. How you use them depends\
    \ greatly on what the program is trying to achieve; they could be the number of\
    \ lives left in a game or just displaying a countdown.\n\nKeeping conditions simple\
    \ to begin learning program a more enjoyable experience. Let's start by checking\
    \ if something is true, then something else it isn't.\n\n- **STEP 1** Let's create\
    \ a new Python program that will ask the user to enter a word, then check to see\
    \ if it's a four-letter word or not. Start with File -> New, and begin with their\
    \ input:\n\n```python\nword_input=input(\"Enter a four-letter word: \")\n```\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_39_0.png)\n\n- **STEP 2** We now create\
    \ a new variable, then use the function and pass the word through it to get the\
    \ total number of letters the user has entered:\n\n```python\nword_input=input(\"\
    Enter a four-letter word: \")\nword_length=len(word_input)\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_39_2.png)\n\
    \n- **STEP 3** Now you can use an if statement to check if the word is four letters\
    \ and print a friendly confirmation if it follows the rule:\n\n```python\nword_input=input(\"\
    Enter a four-letter word: \")\nword_length=len(word_input)\nif word_length ==\
    \ 4:\n    print(\"is a four-letter word. Well done.\")\n```\n\nThe double equals\
    \ (==) means if something is equal to something.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_39_1.png)\n\
    \nThe colon at the end of if tells Python that this statement is true everything\
    \ after the colon: Next, move the cursor back to the beginning of the Editor:\n\
    \n```python\nword_input=input(\"Enter a four-letter word: \")\nword_length=len(word_input)\n\
    if word_length == 4:\n    print(\"is a four-letter word. Well done.\")\nelse:\n\
    \    print(\"is not a four-letter word.\")\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_39_3.png)\n\
    \n# Conditions and Loops\n\n- **STEP 5** Press F5 and save the code to execute.\
    \ Enter a four-letter word in the Shell, then you should have the returned message\
    \ that it's four letters. Now press F5 again and run the program until this becomes\
    \ a five-letter word. The Shell will display it's not a four-letter word.\n\n\
    - **STEP 6** Now expand the code to include other conditions. Eventually, it could\
    \ become quite complex. We've added a condition for three-letter words:\n\n```python\n\
    word=input(\"Enter a four-letter word: \")\nword_length=len(word)\nif word_length\
    \ == 4:\n    print(\"is a four-letter word. Well done.\")\nelif word_length ==\
    \ 3:\n    print(\"is a three-letter word. Try again.\")\nelse:\n    print(\"is\
