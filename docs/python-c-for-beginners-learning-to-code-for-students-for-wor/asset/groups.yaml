- md: "\n# C++ Fundamentals\n\n# Compile and Execute\n\nYou've created your first\
    \ C++ program and you now now understand the basics behind the structure of one.\
    \ Let's actually get things moving and compile and execute, or run if you prefer,\
    \ the program and see how it looks.\n\n# GREETINGS FROM C++\n\nCompiling and executing\
    \ C++ code from Code::Blocks is extraordinarily easy; just a matter of clicking\
    \ an icon and seeing the result. Here's how it is done.\n\n- STEP 1 Open Code::Blocks,\
    \ if you haven't already, and load up the saved Hello World code you created.\
    \ Ensure there are no visible errors, such as missing semicolons at the end of\
    \ the std::cout line.\n\n- STEP 2 If you are looking for the one in our screenshot,\
    \ look to the menu bar at the top of the screen. Under the Build entry in the\
    \ topmost menu you can see a group of icons: a yellow cog, green button and a\
    \ cog/play button. These are Build, Run, and Run functions.\n\n- STEP 3 Start\
    \ by clicking on the Build icon, the yellow cog. At this point, your code has\
    \ now run through the Code::Blocks compiler and checked for any errors. You can\
    \ see the results of the Build by looking to the bottom window pane. Any messages\
    \ regarding the quality of the code are displayed here.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_103_0.png)\n\
    ![](img/ba40fbc39febe9db9a35785516d323a7_103_1.png)\n![](img/ba40fbc39febe9db9a35785516d323a7_103_2.png)\n\
    ![](img/ba40fbc39febe9db9a35785516d323a7_103_3.png)\n\n# STEP 5\n\nPressing any\
    \ key in the command line closes it, slightly. Under the #include line, enter:\n\
    \nusing namespace std;\n\nThen, delete the std:: part of the code line; like so:\n\
    \ncout << \"Hello, world\\n\";\n\n```cpp\nhelloworld.cpp\n1 #include <iostream>\n\
    2 using namespace std;\n3 \n4 int main() {\n5 \n6 \n7 // My first C++ program\n\
    8 cout << \"Hello, world!\\n\"\n9 \n10 }\n```\n\n# STEP 8\n\nCreate a deliberate\
    \ error in the code. Remove the semicolon from the cut line, so it reads:\n\n\
    cout << \"Hello, world\\n\";\n\n```cpp\nhelloworld.cpp\n1 #include <iostream>\n\
    2 using namespace std;\n3 \n4 int main() {\n5 \n6 \n7 // My first C++ program\n\
    8 cout << \"Hello, world!\\n\"\n9 \n10 }\n```\n\n# STEP 6\n\nIn order to apply\
    \ the new changes to the code, you need to re-compile, build, and run it. You\
    \ can simply click the Build/Run icon, the combined yellow and green play button.\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_104_0.png)\n\nNow click the Build and\
    \ Run icon to apply the changes to the code. This code: Build refuses to execute\
    \ due to the error you put in. In the Log pane of the screen you are informed\
    \ about the error. In this case: Expected: 'before ]' token, indicating the missing\
    \ semicolon.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_104_1.png)\n\n# STEP\
    \ 7\n\nJust as we mentioned in the previous pages, you don't need to use std::cout\
    \ if you already declare using namespace std at the beginning of the code. We\
    \ could have easily clicked the Build/Run icon to build it but it's worth going\
    \ through the options. You can also see that by building and running, the file\
    \ has been saved.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_104_2.png)\n\n#\
    \ STEP 10\n\nReplace the semicolon and under the cut line, enter a new line to\
    \ the code:\n\ncout << \"And greetings from C++!\\n\";\n\nThe \\n adds a new line\
    \ under the last line of output text. Build and Run code, to display your handler.\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_104_3.png)\n\n# Using Comments\n\n\
    While comments may seem like a minor element to the many lines of code to make\
    \ a game, or even an entire operating system, in actual fact they're probably\
    \ one of the most important factors.\n\n## THE IMPORTANCE OF COMMENTING\n\nComments\
    \ inside code are basically human readable descriptions that detail what the code\
    \ is doing at that particular point. They aren't especially important but without\
    \ comments it is one of many frustrating areas of code unless you're a professional\
    \ or just starting out.\n\nIn short, code should be commented in a manner as to\
    \ effectively describe the purpose of a line, section, or individual elements.\
    \ You should get into the habit of commenting as much as possible so someone who\
    \ doesn't know anything about programming can understand what's going on.\n\n\
    In a professional environment, comments are vital to the success of code and ultimately\
    \ the company. In an organization, many programmers work in large teams, other\
    \ developers, analysts and so on. If you're part of the team that's writing software,\
    \ your comments help the team to succeed and another member has to pick up and\
    \ follow the trail to pinpoint the issue. Place yourself in the shoes of someone\
    \ else to understand what's wrong with your program. A program has excess of 80,000\
    \ lines of code, so spread across different modules, you might see the need for\
    \ little help from original programmers in the form of a good comment. The best\
    \ comments are those that link the code, detailing what happens when the program\
    \ hits this line or section. You don't need to comment every line. Something along\
    \ the lines doesn't require you to comment that's obvious to the reader. However,\
    \ if equaling is something that changes the program for the user, such as they've\
    \ run out of lives, it certainly needs to be commented. Even if you write comments\
    \ only for yourself, it is good practice.\n\n# C++ COMMENTS\n\nCommenting in C++\
    \ involves a double forward slash '/', or a forward slash and an asterisk, '/*'.\
    \ You've already seen brief examples but this is how they work.\n\nSTEP 1 Using\
    \ the Hello World code as an example, you can easily comment on different sections\
    \ of the code using the double slash:\n\n```cpp\n// My first C++ program\ncout\
    \ << \"Hello, world!\\n\";\n\n#include <iostream>\nusing namespace std;\n\nint\
    \ main() {\n    // My first C++ program\n    cout << \"Hello, world!\\n\";\n}\n\
    ```\n\nSTEP 4 Be careful when commenting, especially with block comments. It's\
    \ very easy to forget to add the closing asterisk and thus negate any code that\
    \ falls inside the comment block.\n\n```cpp\n// HelloWorld.cpp\n#include <iostream>\n\
    using namespace std;\nint main() {\n    cout << \"Hello, world!\\n\";\n    cout\
    \ << \"And greetings from C++\\n\";\n    // This comment can\n    cover several\
    \ lines\n    without the need to add more slashes\n    cout << \"This line is\
    \ now being ignored by the compiler!\\n\";\n}\n```\n\nSTEP 2 However, you can\
    \ add comments to the end of a line of code, or in a better way that going on:\n\
    \ncout << \"Hello, world!\\n\"; This line outputs the words 'Hello, world'. The\
    \ \\n denotes a new line.\n\nNote, you don't have to put a semicolon at the end\
    \ of a comment. This is because the line is then ignored by the compiler.\n\n\
    STEP 5 If you obviously try and add a comment out error, causing a missing bracket\
    \ ']' to finish off the block of code. If you made an error then, it can be time\
    \ to go back and rectify. The colour commenting in Code-Blocks identifies comments\
    \ from code:\n\n```cpp\n// HelloWorld.cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n    // My first C++ program\n    cout << \"Hello, world!\\\
    n\";\n    cout << \"And greetings from C++\\n\";\n}\n```\n\nSTEP 3 You can comment\
    \ several lines by using the double slash and asterisk:\n\n> /* This comment cover\
    \ several lines without the need to add more slashes */\n\nSTEP 6 If you're using\
    \ block comments, it's good practice in C++ to add an asterisk to each new line\
    \ of the comment block. This also helps you to remember the comment before continuing\
    \ the code:\n\n```cpp\nint main() {\n    // My first C++ program\n    cout <<\
    \ \"Hello, world!\\n\";\n    cout << \"And greetings from C++\\n\";\n    /* This\
    \ comment can\n    cover several lines\n    without the need to add more slashes\
    \ */\n    cout << \"This line is now being ignored by the compiler!\\n\";\n}\n\
    ```\n\nJust remember to finish the block comment with the opposite asterisk and\
    \ slash.\n"
