    \ stop, for instance, using the Math module, since you've just imported it into\
    \ Python, you utilize the square root function. To do so:\n\n```python\nmath.sqrt(16)\n\
    ```\n\nYou can see that the code is printed as module.function(data).\n\n![](img/ba40fbc39febe9db9a35785516d323a7_38_0.png)\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_38_1.png)\n\n## FORGING FUNCTIONS\n\
    \nThere are many functions you can import from other Python programmers and you\
    \ will undoubtedly see some excellent examples in the future; you can create your\
    \ own with the def.\n\n- **STEP 1** Choose File > New to enter the editor, let's\
