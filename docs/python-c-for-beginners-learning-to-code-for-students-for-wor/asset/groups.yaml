    ## Saving and Executing Your Code


    While working in the IDLE Shell is perfectly fine for small code snippets, it''s
    not designed for entering longer program lists. In this section you''re going
    to be introduced to the IDLE Editor, where you will be working from now on.


    ## EDITING CODE


    You will eventually reach a point where you have to move from inputting single
    lines of code into the Shell. Instead, the IDLE Editor will allow you to save
    and execute your Python code.


    - **STEP 1** First, open the Python IDLE Shell and click on File -> New File.
    This will open a new window with Untitled as its name. This is the Python IDLE
    Editor and you can enter the code to create your future programs.


    - **STEP 2** The IDLE Editor is, for all intents and purposes, a simple text editor
    with Python features, coding and so on; much in the same vein as Sublime Text.
    You enter the code as you would within the Shell, so taking an Example from your
    previous tutorial, enter:


    - **STEP 3** You can see that the same colour coding is in place in the IDLE Editor
    as it is in the Shell, enabling you to better understand what''s going on with
    your code. However, to execute the code you need to first save it. Press F5 and
    you get a Save... Check box open.


    ![](img/ba40fbc39febe9db9a35785516d323a7_25_0.png)


    - **STEP 4** Click on the OK button in the Save box and select a destination where
    you''ll save all your Python code. The destination can be a dedicated folder Python
    or you can just dump it wherever you like. Remember to keep a tidy drive however,
    you end out in the future.


    ```python

    print("Hello everyone!")

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_25_1.png)


    ![](img/ba40fbc39febe9db9a35785516d323a7_25_2.png)


    ## Saving and Executing Your Code


    STEP 5 Enter a name for your code, ''print hello'' for example, and click on the
    Save button. When your Python code is saved it executes and the output will be
    detailed in the IDLE Shell. In this case, words ''Hello everyone!''


    STEP 8 Let''s extend the code and enter a few examples from the previous tutorial:


    ```python

    a=2

    b=2

    name="David"

    surname="Hayward"

    print(name, surname)

    print(a+b)

    ```


    If you press F5 now you''ll be asked to save the file again, as it''s been modified
    before.


    ![](img/ba40fbc39febe9db9a35785516d323a7_26_0.png)


    STEP 6 This is how the vast majority of your Python code will be conducted. Enter
    it into the Shell, hit F5, save the code and look at the output in the Shell.
    Sometimes things will differ, depending on whether you''ve requested a specific
    window, but eventually that''s the process. The process we will use throughout
    this, unless otherwise stated.


    ![](img/ba40fbc39febe9db9a35785516d323a7_26_1.png)


    STEP 9 If you click the OK button, the file will be overwritten with the new code
    entries, and executed with the output in the Shell. It''s not a problem with these
    few lines, but if you want to edit a file, overwriting can become an issue. Use
    File > Save As from Editor to create a copy.


    ![](img/ba40fbc39febe9db9a35785516d323a7_26_2.png)


    STEP 7 If you open the file of the saved Python code, you can see it ends in a
    .py extension. This is the default Python filename. Any code you create will be
    whatever.py and any code you download from the Internet Python resources will
    be .py. Just ensure that code is written


    STEP 10 Create a new file. Click the Open, and open a new instance (File > New
    File from the Shell). Enter the following and save it hello:


    ```python

    a="Python"

    b=13

    c="cool!"

    print(a, b, c)

    ```


    You will use this code in the tutorial.


    ![](img/ba40fbc39febe9db9a35785516d323a7_26_3.png)


