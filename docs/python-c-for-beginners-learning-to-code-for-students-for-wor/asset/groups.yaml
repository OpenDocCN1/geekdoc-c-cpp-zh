    \ text:\")\n    file=open(path,'w')\n    file.write(text)\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_149_1.png)\n\
    \nThis part of the code imports the necessary modules. The OS and Subprocess modules\
    \ handle the operating system elements of the program.\n\nEach def() functions\
