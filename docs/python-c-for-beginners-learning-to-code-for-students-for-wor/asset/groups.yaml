    ## 如何在 Linux 上安装


    第 5 步 然而，如果你想获取最新版本，你需要从源码编译 Python。首先，在终端中输入这些命令：


    ```bash

    sudo apt-get install build-essential checkinstall

    sudo apt-get install libreadline-dev libsqlite3-dev libncursesw5-dev libncurses5-dev
    tk-dev

    libz1gm-dev libbz2-dev

    ```


    第 8 步 在 Python 文件夹内，输入：


    ```bash

    ./configure

    sudo make altinstall

    ```


    这取决于你电脑的速度，需要一些时间。完成后，运行 `python.3 --version` 来检查安装的版本。


    ![](img/ba40fbc39febe9db9a35785516d323a7_18_0.png)


    第 6 步 打开你的 Linux 浏览器并访问 Python 页面：https://www.python.org/downloads/。点击 Download
    Python 3.6.2（或你正在使用的版本）下载源码 3.6.2.tar.xz。


    第 9 步 对于 GUI，你需要在终端中输入以下命令：


    ```bash

    sudo apt-get install idle3

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_18_1.png)


    然后可以通过 `idle3` 启动 IDLE。注意，IDLE 运行的版本与你手动安装的版本不同。


    第 7 步 在终端中，进入 Python 源码包目录：`cd tar -xvf Python-3.6.2.xz`。现在进入新打开的文件夹：`cd Python-3.6.2`。


    第 10 步 现在你需要安装 PIP（Pip 包管理器），它可以帮助你安装更多模块和扩展功能。


    输入：如果 `pip3` 已安装，然后使用以下命令检查更新：


    ```bash

    pip3 --upgrade pip

    ```


    完成后，你可以在菜单中的“编程”（Programming）可以使用终端和 Python 3.x。


    ![](img/ba40fbc39febe9db9a35785516d323a7_18_2.png)


    ## Python 入门


    ![](img/ba40fbc39febe9db9a35785516d323a7_19_0.png)


    ## Python 入门


    刚开始 Python 可能看起来有些令畏，但这种语言的设计考虑了简单性。和大多数事情一样，你需要缓慢开始，学习如何获得结果以及如何从代码中得到你想要。


    在本节中，我们将涵盖核心概念：保存和执行你的代码、变量、数字和表达式、用户输入、条件和循环。


    - 22 首次启动 Python

    - 24 你的第一行代码

    - 26 保存并执行你的代码

    - 28 从命令行执行代码

    - 30 数字和表达式

    - 32 使用注释

    - 34 变量操作

    - 36 用户输入

    - 38 创建函数

    - 40 条件与循环

    - 42 Python 模块


    > “软件工程的目的是控制复杂度，而不是创造复杂性。”

    – Pamela Zave（开发者、科学家、电信专家）


    ## 首次启动 Python


    如前所述，我们使用树莓派（Raspberry Pi）作为 Python 硬件平台。最新版本的 Raspian 预装了 Python 3（版本 3.4.2）；所以只要你有一个版本
    3 的 Shell，我们所有的代码都可以运行。


    ## 启动 PYTHON


    我们不会详细介绍如何让树莓派运行，关于这个主题已经有大量可用资料。但是，一旦你准备就绪，启动你的树莓派并准备编码。


    - 第 1 步：加载树莓派桌面后，点击菜单，选择“Programming > Python 3 (IDLE)”。这将打开 Python 3 Shell。Windows
    和 Mac 用户可以通过 Windows 菜单或 Finder 找到 Python 3 Shell。


    - 第 3 步：例如在 shell 中：`2+2`。按下回车后，下一行将显示答案：`4`。基本上，Python 接收了“代码”并产生了相应的输出。


    ![](img/ba40fbc39febe9db9a35785516d323a7_21_0.png)


    ```python

    Python 3.4.2

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    >>> type(''copyright'', ''credits'' or ''license'') for more information.

    >>> 2+2

    4

    ```


    - 第 2 步：Shell 是你可以输入代码并查看编程到 Python 中的响应和输出的地方。这是一个沙盒，你可以在这里尝试一些简单的代码。


    - 第 4 步：Shell 的作用非常像计算器，因为代码是与它们的系列交互。整数（无限数字序列）可以很容易地进行加、减、乘、除。


    ```python

    Python 3.4.2

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    >>> type(''copyright'', ''credits'' or ''license'') for more information.

    >>> 2+2

    4

    >>> 2345*6452

    151352689430

    >>> 12345-12343

    2

    >>> 776289*4024

    36879333976

    >>> 5004728380

    ```


    ## 首次启动 Python


    第 5 步：虽然它很有趣，但并不是特别有趣。相反，尝试这个：


    ```python

    print("Hello everyone!")

    ```


    像你之前的步骤那样将其输入到 IDLE。


    ![](img/ba40fbc39febe9db9a35785516d323a7_22_0.png)


    第 8 步：Python IDLE 是一个可配置的环境，如果你不喜欢显示的颜色，可以通过 `Options > Configure` 并点击 `Highlighting`
    标签来更改它们。我们建议你看到的和我们一样。


    第 6 步：这更像一点，因为你刚刚产生了第一段代码。该命令显而易懂，但它需要括号和引号来输出到屏幕。


    ```python

    >>> print("Hello everyone!")

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_22_1.png)


    第 9 步：和大多数程序一样，无论什么种操作系统，都有许多快捷键。我们这里没有空间显示所有，但在 `Options > Configure` 的 `Keys`
    标签下，你可以看到当前的绑定。


    第 7 步：你可能已经注意到 Python IDLE 中的编码。颜色代表代码的不同元素。它们是：


    ## IDLE 编码


    | 颜色 | 用途 | 示例 |

    | :--- | :--- | :--- |

    | 黑色 | 数据与变量 | 23 area |

    | 紫色 | 字符串 | "Hello World" |

    | 橙色 | 关键字 | if for else |

    | 蓝色 | 用户函数 | get_area() |

    | 红色 | 注释 | #Variable |

    | 浅红色 | 错误信息 | SyntaxError: |


    第 10 步：Python IDLE 是一个强大的接口，是用 Python 编写的，所以如果你想知道 Shell 的许多输入输出，建议你花几分钟查看 www.python.com/idle.html，它详细介绍了许多内容。


    本质上，你已经使用上一个教程中的 `print(Hello everyone!)` 函数写了你的第一段代码，让我们扩展一下，看看输入自己的代码并尝试一些 Python
    示例。


