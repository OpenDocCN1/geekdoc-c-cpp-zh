  - '[PAGE 101]


    # Structure of a C++ Program


    C++ has a very defined structure and way of doing things. Miss something out,
    even as small as a semicolon, your entire program will fail to be compiled and
    executed. Many a professional programmer has fallen foul of sloppy structure.


    # #INCLUDE <C++ STRUCTURE>


    Learning the basics of programming, you begin to understand the structure of a
    program. The commands may differ from one language to the next, but you will start
    to see how the code works.


    | INCLUDE | *helloworld.cpp |

    | --- | --- |

    | 1 | <iostream> |

    | 2 | |

    | 3 | |

    | 4 | |

    | 5 | |

    | 6 | |


    C++ was invented by Danish Bjarne Stroustrup in 1979, as part of his Ph.D. thesis.
    Initially C++ was called C with Classes, which added features to the popular C
    language, making it an more user-friendly environment through a new structure.


    The structure of a C++ program is quite precise. Every C++ program begins with
    a directive. **#include** instructs the pre-processor to include a section of
    the C++ code. For example: **#include <iostream>** includes the header to support
    input/output operations.


    Bjarne Stroustrup, inventor of C++.


    | INT MAIN() | *helloworld.cpp |

    | --- | --- |

    | 1 | #include <iostream> |

    | 2 | |

    | 3 | int main() |

    | 4 | |

    | 5 | |

    | 6 | |


    int main() initiates the declaration of a function, which is a group of code-statements
    under the name ''main''. All C++ code begins at the main function, regardless
    of where it actually lies within the code.


    ![](img/ba40fbc39febe9db9a35785516d323a7_101_0.png)


    # BRACES


    The open brace (curly brackets) is something that may not have come before, especially
    if you''ve used Python. The open brace indicates the beginning of the main function
    and contains all the code that belongs to that function.


    | #include <iostream> |

    | --- | --- |

    | 1 | int main() |

    | 2 | |

    | 3 | { |

    | 4 | |

    | 5 | |

    | 6 | } |'
