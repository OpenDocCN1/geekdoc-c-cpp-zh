    ## C++ Fundamentals


    ![](img/ba40fbc39febe9db9a35785516d323a7_97_0.png)


    Within this section you can start to understand the structure of C++ code and
    see how to compile and execute that code. These are the core fundamentals of C++,
    that teach you the basics such as using comments, variables, data types, strings
    and how to use C++ mathematics.


    These are the building blocks of a C++ program. With them, you can form your own
    code, produce an output to the screen and store and retrieve data.


    - 98 Your First C++ Program

    - 100 Structure of a C++ Program

    - 102 Compile and Execute

    - 104 Using Comments

    - 106 Variables

    - 108 Data Types

    - 110 Strings

    - 112 C++ Maths


    > “Controlling complexity is the essence of computer programming.”

    — Brian Kernighan (C-developer of UNIX and author)


    ![](img/ba40fbc39febe9db9a35785516d323a7_98_0.png)


    ## # Your First C++ Program


    You may have followed the Mac and Linux examples previously but you''re going
    to be working exclusively in Windows and Code::Blocks from here on. Let''s begin
    by writing your first C++ program and taking the first small step into a larger
    coding world.


    # HELLO, WORLD!


    It''s traditional in programming for the first code to be emitted to the output
    ''Hello, World!'' to the screen. Interestingly, this dates back to 1968 using
    a language called BCPL.


    - STEP 1: As mentioned, you will see Windows 10 and the latest version of Code::Blocks
    for the rest of the C++ code in this book. By launching Code::Blocks. When open,
    click on File > New > Empty File or press Ctrl+Shift+N on the keyboard.


    - STEP 3: At the moment it doesn''t look like much, and it even makes less sense,
    but we''ll get to that in course. Now click on File > Save As. Create or find
    it helloworld.cpp. Click the Save as type box and select C/C++ files. Click the
    Save button.


    ![](img/ba40fbc39febe9db9a35785516d323a7_99_0.png)


    - STEP 2: Now you can see a blank screen, with the tab ''Untitled1'', and the
    number in the top left of the main window: Code::Blocks. Begin by clicking in
    the main window, the cursor is next to the next one, and entering:

    ```cpp

    #include <iostream>

    ```


    - STEP 4: You can see that Code::Blocks has now changed the colour coding, recognising
    that the file is now C++ code. This means that code can be auto-selected from
    the Code::Blocks repository. Delete the #include <iostream> line and re-enter
    it. You can see the auto-select boxes appearing.


    ![](img/ba40fbc39febe9db9a35785516d323a7_99_1.png)


    ## Your First C++ Program


    ### STEP 5


    Auto-selection of commands is extremely handy and cuts out potential mistyping.
    Press Return to get to line three, then enter:


    ```cpp

    int main()

    ```


    Note: there''s no space between the brackets.


    ![](img/ba40fbc39febe9db9a35785516d323a7_100_0.png)


    ### STEP 8


    Note again the colour coding change. Press Return at the end of the previous step''s
    line, then enter:


    ```cpp

    std::cout << "Hello, world!";

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_100_1.png)


    ### STEP 6


    On the next line below main(), enter a curly bracket:

    {}


    This can be done by pressing Shift and the key to the right of P on an English
    UK keyboard.


    ![](img/ba40fbc39febe9db9a35785516d323a7_100_2.png)


    ### STEP 9


    Just as before, Code-Blocks out automatically completes your code for you entering,
    including placing a semicolon at the end of the line. This is one of the most
    important elements to a C++ program and we''ll tell you why in the next section.
    Now, move the cursor to the closing bracket and press Return.


    ![](img/ba40fbc39febe9db9a35785516d323a7_100_3.png)


    ### STEP 7


    Notice that Code::Blocks has automatically created a corresponding bracket below
    a, linking the pair, as a slight indent. This is due to the structure of C++ and
    it is where the meat of the code is entered.

    Now enter:


    ```cpp

    //My first C++ program

    ```


    ### STEP 10


    That''s all you need to do for the moment. It may look terribly alarming but C++
    is best absorbed in small chunks. Don''t execute the code at the moment you need
    to look at how a C++ program is structured first, then you can build and run the
    code. For now, click Save, the floppy disk icon.


    ![](img/ba40fbc39febe9db9a35785516d323a7_100_4.png)

