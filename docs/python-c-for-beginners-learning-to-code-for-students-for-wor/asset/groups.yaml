    # STEP 7


    This taking a for, about creating a piece of code that will ask the user for the
    key and value items? Create a new editor instance and start by coding in a new
    dictionary:


    ```python

    phonebook={}

    ```


    # STEP 8


    Next, you need to define the user inputs and variables: for one person''s name,
    the other for phone number (let''s keep it simple to avoid messy code:


    ```python

    name=input("Enter name: ")

    number=input("Enter phone number: ")

    ```


    # STEP 9


    Note we kept the name as an integer of a string, even the value can be an integer
    or a string. You will need to add the user''s inputs to the variables to create
    blank dictionary. Using the same process in Step 5, you can


