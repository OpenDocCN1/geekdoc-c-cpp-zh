    # 向 Python 问好


    > “你为什么对计算机有这么多了解？”

    > “我不知道，那是第一个。”

    - 格蕾丝·霍普将将（先驱程序员）接受 David Letterman 采访时


    ![](img/ba40fbc39febe9db9a35785516d323a7_5_0.png)


    有很多不同的编程语言可以学习和使用。有些极其复杂且功能强大，而有些只是作为操作系统的微型工具。Python 处于中间位置，将易用性与强大的功能结合在一起，使用户不仅可以创建小型项目，还可以创建出色的游戏和性能密集型计算任务。


    然而，Python 的意义不仅仅是另一种编程语言。它拥有一个充满活力的社区，分享知识、代码、项目想法，以及未来版本的错误修复。正是归益了这个社区，这种语言才得以增长和繁荣；现在，轮到你投身学习如何用
    Python 编程了。


    书的前半部分帮助你入门 Python，并从那里引导你如何使用该语言一些常见且有趣的功能和特性。很快，你就能编写自己的实用系统工具、文字冒险游戏，甚至控制角色在屏幕上移动。


