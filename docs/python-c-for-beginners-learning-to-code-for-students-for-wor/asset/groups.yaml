    | Pygame Module | 76 |\n| Create Your Own Modules | 80 |\n\nBeyond the time, the\
    \ Calendar module can produce some interesting results when you actually display\
    \ the date in a Time-like format. However, if some reason it's not installed you\
    \ can add it using pip install calendar up the module and its inherent functions.\
    \ Once it's loaded into memory, start by entering:\n\n```python\nimport calendar\n\
    sep=calendar.Text(SUNDAY)\nprompt(2019, 9)\n```\n\nThere are numerous functions\
    \ within the Calendar module that may be of interest to you when forming your\
    \ code. For example, you can display the number of leap years between two specific\
    \ years:\n```python\nleaps=calendar.leapdays(1900, 2019)\nprint(leaps)\n```\n\n\
    You can see that the days of September 2019 are displayed in a wall calendar.\
    \ Naturally you can change the 2019 of the second line to any year and month,\
    \ a birthday for example (1973, 6). The first line configures Calendar to start\
    \ on Sundays, or any day if you prefer.\n\n```python\nimport calendar\nsep=calendar.Text(SUNDAY)\n\
    prompt(1973, 6)\n\nbirthday=calendar.Text(MONDAY)\nbirthday.prompt(1973, 6)\n\
    ```\n\n```python\nleaps=calendar.leapdays(1900, 2019)\nprint(leaps)\nprint(f\"\
    The leap years between 1900 and 2019 is {leaps}\")\n```\n\nSTEP 5 You can add\
    \ a new line to the square code to add some colour:\n```python\nturtle.color(\"\
    Red\")\n```\n\nThen you can change the character to an actual turtle by entering:\n\
    ```python\nturtle.shape(\"turtle\")\n```\n\nYou can also use the command turtle.begin_fill(),\
    \ and\nturtle.end_fill() to fill in the square with these chosen colours:\nred\
    \ outline, yellow in this case.\n\nSTEP 6 You can see that the Turtle module can\
    \ draw some pretty shapes and more complex as you begin master the ways to do\
    \ it. This enters our example:\n\n```python\nfrom turtle import *\ncolor('red',\
    \ 'yellow')\nbegin_fill()\nwhile True:\n    forward(200)\n    left(170)\n    if\
    \ abs(pos()) < 1:\n        end_fill()\ndone()\n```\n\nSTEP 7 You can see that\
    \ code produced some zeros at the\nweek, Sunday is due to the starting day of\
    \ the\nweek, so overlapping days from the previous\nmonth. So the count of days\
    \ will start on 1st June\n2019 and will total 30 as the output correctly displays.\n\
    \nSTEP 8 The calendar module also allows us to write\nfunctions in HTML, so that\
    \ you can display it on a\nwebsite. Let's start by creating a new file:\n\n```python\n\
    import calendar\ncal=open(\"cal.html\", \"w\")\nhtml=calendar.HTMLCalendar(SUNDAY)\n\
    cal.write(html.format(2019, 1))\n```\n\nThis code will create an HTML file called\
    \ cal.html, opened with a browser\nand displays the calendar for January 2019.\n\
    \nSTEP 9 Interingly we can list the number of days in a\nmonth by using a simple\
    \ loop:\n\n```python\nimport calendar\ncal=calendar.TextCalendar(SUNDAY)\nfor\
    \ i in cal.monthdays(2019, 6):\n    print(i)\n```\n\nSTEP 10 Of course, we show\
    \ how to display a given\nyear as a web calendar:\n\n```python\nimport calendar\n\
    year=int(input(\"Enter the year to display: \"))\nweb=open(\"cal.html\", \"w\"\
    )\nhtml=calendar.HTMLCalendar(MONDAY)\nweb.write(html.formatyear(year))\n```\n\
    \nThis code asks the user for a year, then creates the necessary\nwebpage. To\
    \ change your file destination.\n"
  mdcn: "\n\n# Python 图形\n\n在屏幕上处理文本（无论是作为游戏还是在程序中）是非常棒的，但总会有那么时刻，这时候图形化的表示会大为有用。Python\
