    \ \"The number is less than 30!\" << endl;\n    } else {\n        cout << \"The\
    \ number is greater than 30!\" << endl;\n    }\n    return 0;\n}\n```\n\n## 第\
    \ 3 步\n\n代码的第一行创建了一个名为 `num` 的整数并赋值为 `1`。如果语句检查 `num` 的值是否小于 30，如果是，则向控制台输出“The\
    \ number is less than 30”。\n\n```cpp\nif (num < 30) {\n    cout << \"The number\
