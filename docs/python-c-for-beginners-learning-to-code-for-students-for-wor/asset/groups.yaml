    ## How to Set Up Python on a Mac


    If you''re running an Apple Mac, then setup Python is incredibly easy. In fact,
    a version of Python is already installed. However, you should make sure you''re
    running the latest version.


    ### INSTALLING PYTHON


    Apple''s operating system comes with Python installed, so you don''t need to install
    it separately. However, Apple doesn''t update Python even if you''re running an
    older version. It makes sense to check and update first.


    - **STEP 1** Open a new Terminal window by clicking Go > Utilities, then double-click
    the Terminal icon. Now you will see Python "2.3.1" or even later, if Apple has
    updated the OS and Python installation. Either way, it''s best to check for the
    latest.


    - **STEP 2** Open Safari and head over to www.python.org/downloads. follow the
    procedure on the pages. Just as with the Windows setup you can see two download
    buttons: for Python 3.6.2, and the other for Python 2.7.13. Note that version
    numbers may be different from frequent releases of Python.


    - **STEP 3** Click on the latest version of Python 3.x, in case this is the button
    for Python 3.6.2. This will automatically download the latest version of Python
    and depending on how you''ve got your Mac configured, it automatically starts
    the installation.


    ![](img/ba40fbc39febe9db9a35785516d323a7_15_0.png)


    - **STEP 4** With the Python installation open, click on the Continue button to
    begin the installation. It''s worth a moment to read through Important Information
    section in case there is something that applies to your version of macOS. When
    you''re ready, just continue.


    ![](img/ba40fbc39febe9db9a35785516d323a7_15_0.png)


    ## How to Set Up Python on Mac


    STEP 5 The next section details the Software License Agreement, and while not
    particularly interesting to folks it''s probably worth a read. When you''re ready,
    click the Continue button.


    STEP 6 Finally you''re presented with the amount of space Python will take up
    on your system and Install button, which you need click to start the actual installation
    of Python 3.x on Mac. You may need to enter your password to authenticate the
    installation.


    STEP 8 There''s nothing left to do in the Python window so if you drop back into
    Sandbox and re-enter the command now: `python3 --version` then you can see the
    new version. To enter the command line version of Python, you need to enter: `python`.
    `exit()`.


    ![](img/ba40fbc39febe9db9a35785516d323a7_16_0.png)

    ![](img/ba40fbc39febe9db9a35785516d323a7_16_1.png)


    STEP 9 You need to search in Finder for Python IDLE; when you''ve found it, click
    to launch it and it should look similar to that of Windows previous. The only
    difference might be the Mac platform is running.


    ![](img/ba40fbc39febe9db9a35785516d323a7_16_2.png)

    ![](img/ba40fbc39febe9db9a35785516d323a7_16_3.png)


    STEP 7 The installation wasn''t too long; the Mac used in this section is a little
    slower than modern Mac machines and it took thirty seconds for Installation Successful
    to be displayed.


    STEP 10 Older Mac versions may have trouble with the newer versions of Python
    3.x, in which case you will need to revert to a previous Python 3.x build; as
    long as you''re using Python 3.x, this code will work for you.


    ![](img/ba40fbc39febe9db9a35785516d323a7_16_4.png)


    ```

    Python 3.1.2 (r312:79c094, Mar 24, 2010, 01:33:18)

    [GCC 4.0.1 (Apple Inc. Build 5493)] on darwin

    Type: "copyright", "credits" or "license" for more information.

    >>

    ```


    ## How to Set Up Python in Linux


    Python version 2.x is already installed in most Linux distributions but we''re
    going to be using Python 3.x, there''s a little work we need to do first to get
    hold of it. Frankly, it''s not too difficult.


    ### PYTHON PENGUIN


    Linux is such a versatile operating system that it''s often difficult to nail
    down one way of installing in different ways, so we will stick to Linux Mint 18.1
    for this particular tutorial.


    - **STEP 1** First you need to ascertain which version of Python is currently
    installed in your Linux system, we''re going to be using Linux Mint 18.1 for this
    section. As with macOS, drop into a terminal by pressing Ctrl+Alt+T.


    - **STEP 2** Next: `python --version` in the Terminal screen. You will have the
    output relating to 2.x of Python in our display. As you can see, below is 2.7.12.


    - **STEP 3** Some Linux distros will automatically update the installation of
    Python to the latest versions whenever the system is updated. To check, first
    do a system update and upgrade with:


    ```

    sudo apt-get update && sudo apt-get upgrade

    ```


    Enter your password and let the system do any updates.


    ```

    File Edit Search Terminal Help

    david@david-mint ~ $

    david@david-mint ~ $

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_17_0.png)


    - **STEP 4** Once the update is complete, you may need to answer ''Y'' to authorise
    any, enter: `python3 --version` to check if Python 3.x is updated or installed.
    In the case of Linux Mint, the version we have is 3.5.2, which is fine for ours.


    ```

    File Edit Search Terminal Help

    david@david-mint ~ $ python --version

    Python 2.7.12

    david@david-mint ~ $

    ```


