    \n# C++ 注释\n\n在 C++ 中注释涉及双斜杠 `//` 或者斜杠和星号 `/* ... */`。\n\n步骤 1 使用 Hello World\
    \ 代码示例，你可以通过双斜杠注释：\n\n```cpp\n// My first C++ program\ncout << \"Hello, world!\\\
    n\";\n\n#include <iostream>\nusing namespace std;\n\nint main() {\n    // My first\
    \ C++ program\n    cout << \"Hello, world!\\n\";\n}\n```\n\n步骤 4 在注释时要小心，特别是块注释。很容易忘记添加结束星号，从而忽略掉块内的代码。\n\
    \n```cpp\n/* This is a comment */\nint main() {\n    cout << \"Hello, world!\\\
    n\";\n    cout << \"And greetings from C++!\\n\";\n}\n```\n\n步骤 2 然而，你可以在代码行的末尾添加注释，或者使用更好的方式：\n\
    \ncout << \"Hello, world!\\n\"; 这一行输出“Hello, world!”。`\\n` 表示换行。\n\n注意，你不需要在注释末尾加分号。这是因为该行会被编译器忽略。\n\
    \n步骤 5 如果你显然尝试添加注释错误，会导致块结束时缺少 `]`。如果你犯了错误，可能是时候纠正了。Code-Blocks 的颜色注释可以识别代码中的注释：\n\
    \n```cpp\n// HelloWorld.cpp\n#include <iostream>\nusing namespace std;\nint main()\
