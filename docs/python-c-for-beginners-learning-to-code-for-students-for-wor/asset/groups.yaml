    \  int x;\n  string myself = \"This is a string!\\n\";\n  cout << \"What's the\
    \ value of x? \";\n  cin >> x;\n  cout << x;\n{\n  cout << \"\\n\\n\";\n  cout\
    \ << myself;\n}\n```\n\n## 引号\n\n缺少引号是每个级别用户都会犯的常见错误。记住，例如输出到屏幕或写入文件的字符串需要引号。大多数编译器都会因为代码中缺少引号而报错。\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_144_0.png)\n\n## 变量初始化\n\nC++ 变量默认不会初始化为零。这意味着如果你创建一个变量而不对其进行赋值，可能会得到一个从\
