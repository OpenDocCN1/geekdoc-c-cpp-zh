    # Tuples


    Tuples are very much identical to lists. However, where lists can be deleted,
    updated or changed in some, a tuple remains constant. This is called immutable
    and they''re perfect for storing fixed data items.


    ## THE IMMUTABLE TUPLE


    Reasons for having tuples vary depending on what the program is intended to do.
    In an adventure game, where non-playing character names are stored specially,
    they are also used for example,


    - **STEP 1** A tuple is created the same way as a list but in you use brackets
    instead of square brackets. For example:


    ```

    months=("January", "February", "March", "April", "May", "June")

    ```


    - **STEP 2** Just as with lists, the items within a named tuple can be indexed
    by their position in the data range:


    ```

    months[0]

    months[5]

    ```


    However, any attempt to append or delete a tuple will result in an error in the
    Shell.


    - **STEP 3** You can create grouped tuples into lists that contain multiple sets
    of data. For instance, here is a tuple called NPC (Non-Playable Characters) containing
    the character name and their combat rating for an adventure game:


    ```

    NPC=(("Conan", 100), ("Belit", 80), ("Valeria", 95))

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_47_0.png)

    ![](img/ba40fbc39febe9db9a35785516d323a7_47_1.png)


    - **STEP 4** Each of these data items can be accessed as a whole by entering NPC
    into the Shell; or they can be indexed their individual tuples within the NPC
    list:


    ```

    NPC[0]

    Will display 100.

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_47_2.png)

    ![](img/ba40fbc39febe9db9a35785516d323a7_47_3.png)


    # Tuples


    STEP 5 It''s worth noting when referencing multiple tuples within a list, the
    indexing is different from the norm. You would expect the 95 cap rating of the
    character Valeria to be NPC[4], but it''s not exactly:


    STEP 8 Now unpack the tuple into two corresponding variables:


    ```python

    (name,combat_rating)=NPC[2]

    ```


    You can check the values by entering name, combat_rating.


    ```python

    Python 3.4.2

    Edit Edit Debug Options Windows Help

    Python 3.4.2 (default, Oct 19 2014, 13:31:13)

    [GC 4.9] on linux

    Type "copyright", "credits" or "license" for more information.

    >>> NPC[2]=(''Conan'', 100), (''Belit'', 80), (''Valeria'', 95)

    >>> (name,combat_rating)=NPC[2]

    >>> name

    ''Conan''

    ```


    STEP 6 This means of count that the indexing follows:


    - 0 1

    - 0 2

    - 0 1

    - 1 0


    STEP 9 Remember, as lists, you can also index tuples using numbers which counts
    backwards from the data list. For our example, using the tuple with multiple data
    items, you can retrieve the Valeria with:


    ```

    NPC[2][0]

    ```


    Which you can imagine, a little confusing when you''ve got a lot of tuple data
    to deal with.


