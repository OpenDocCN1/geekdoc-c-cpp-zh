    # Dictionaries


    Lists are extremely useful but dictionaries in Python are far the more technical
    way of dealing with data items. They can be tricky to get at but you''ll be able
    to apply them to your own code.


    # KEY PAIRS


    A dictionary is like a list instead each data item as pair, these are known as
    Key and Value. Key part must be unique whereas the Value can be any data item.


    STEP 1 Let''s say you want to create a phonebook in Python. separating the key
    and value by a colon. For example:


    ```python

    phonebook={''Emma'': "1234", "Daniel": "3456", "Hannah": "6789"}

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_49_0.png)


    STEP 2 Just as with lists, tuples and so on, strings must be enclosed in quotes
    (single or double), which helps when the value can be either a string or an integer,
    you just need to enclose the value in quotes:


    ```python

    phonebook={''David'':654, ''Hannah'':6789}

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_49_1.png)


    STEP 3 As with lists and tuples, you can check the contents of a dictionary by
    giving the dictionary name, in this example. This will display the data items''
    version with now.


    STEP 4 The benefit of using a dictionary is that you can enter the key to index
    the value. Using the phonebook from the previous examples, you can enter:


    ```python

    phonebook[''Emma''] = "Emma"

    phonebook[''Hannah''] = "Hannah"

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_49_1.png)


    # STEP 5


    Adding to a dictionary is easy too. You can include a new data item entry by adding
    the new key and value items:


    ```python

    phonebook["David"] = "0987 654 321"

    ```


    ```python

    Python 3.4.2

