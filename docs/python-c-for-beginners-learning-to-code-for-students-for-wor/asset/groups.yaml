  mdcn: "\n\n## C++ 基础\n\n## 字符串\n\n字符串是表示和持有字符序列的对象。例如，你可以在代码中设置一个通用的问候 'Welcome'，并将其赋值给字符串，以便在程序的任何地方调用它。\n\
    \n## 字符串理论\n\n有多种方法可以创建字符字符串，这些方法在历史上都是继承自原始的 C 语言，并且仍然被 C++ 支持。\n\n- 步骤 1 要创建一个字符串，你使用\
    \ char 函数。打开一个新的 C++ 文件并从常用的头文件开始：\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main () {\n\n}\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_111_0.png)\n\
    \n很容易将字符串与数组混淆。这是一个数组，它可以用空字符终止：\n\n- 步骤 3 编译并运行代码，屏幕上显示了 'Welcome'。虽然这完全可行，但它不是字符串。字符串是一个类，它定义了可以表示为字符流的对象，并且不需要像数组那样终止。因此，代码可以表示为：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main () {\nchar greet[]\
    \ = \"Welcome\";\ncout << greet << \"\\n\";\n}\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_111_1.png)\n\
    \n- 步骤 4 在 C++ 中也有 string 函数，它的工作方式相同。再次使用问候代码，\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main () {\nstring greet = \"Welcome\";\ncout << greet\
    \ << \"\\n\";\n}\n```\n\n```cpp\n#include <iostream>\nusing namespace std;\nint\
    \ main () {\nchar greet[] = { 'W', 'e', 'l', 'c', 'o', 'm', 'e', '\\0' };\ncout\
    \ << greet << \"\\n\";\n}\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_111_2.png)\n\
    \n## 步骤 5\n\n还有许多可以使用 string 函数的不同操作。例如，要获取字符串的长度，你可以：\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main () {\n    string greet = \"Welcome\";\n    cout\
    \ << \"The length of the string is: \";\n    cout << greet.size() << \"\\n\";\n\
    }\n```\n\n## 步骤 8\n\n正如你所预期的，你可以混合一个整数并存储与字符串相关的内容。在这个示例中，我们创建了 length，它存储 string.size()\
    \ 的结果并将其输出到屏幕：\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main\
    \ () {\n    int length;\n    string greet1 = \"Hello\";\n    string greet2 = \"\
    \ world!\";\n    string greet3 = greet1 + greet2;\n    length = greet3.size();\n\
    \    cout << \"The length of the combined strings is: \" << length << \"\\n\"\
    ;\n}\n```\n\n## 步骤 6\n\n你可以看到我们使用 string::size() 来输出长度，即字符串内容的字符数量。自然地，如果你调用 get\
    \ 以外的任何东西，你需要修改方法，格式始终是 stringname。编译并运行代码以查看结果：\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main () {\n    string greet = \"Welcome\";\n    cout\
    \ << \"The length of the string is: \";\n    cout << greet.size() << \"\\n\";\n\
    }\n```\n\n## 步骤 9\n\n使用字符串自带的可用操作，你可以操作字符串来从字符串中删除字符：\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main () {\n    string str = \"Here is a long sentence\
    \ in a string.\";\n    cout << str << \"\\n\";\n    str.erase(10,5);\n    cout\
    \ << str << \"\\n\";\n    str.erase(str.begin()+8);\n    cout << str << \"\\n\"\
    ;\n    str.erase(str.begin()+9, str.end()-9);\n    cout << str << \"\\n\";\n}\n\
    ```\n\n## 步骤 7\n\n你可以将字符串相加，将它们组合成更长的字符串：\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\nint main () {\n    string greet1 = \"Hello\";\n    string greet2\
    \ = \" world!\";\n    string greet3 = greet1 + greet2;\n    cout << greet3 <<\
    \ \"\\n\";\n}\n```\n\n## 步骤 10\n\n值得花时间研究一下数字，它们是字符串中的字符位置。get对可能全碰运气，所以要多加练习。查看截图查看代码的结果：\n\
