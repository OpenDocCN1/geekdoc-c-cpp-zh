    ; |\n| 6 | getline(cin, name); |\n| 7 | cout << \"Hello, \" << name << \" \\n\"\
    ; |\n| 8 | } |\n\n# Character Literals\n\nIn C++ a literal is an object or variable\
    \ that once defined remains the same throughout the code. However, a character\
    \ literal is defined by a backslash, such as the \\n you've using at the end of\
    \ a cout statement to signify a new line.\n\n# ESCAPE SEQUENCE\n\nWhen used like\
    \ a cout statement, character literals are also called escape sequence codes.\
    \ They allow you to insert a quote, an alert,\n\n- STEP 1 Create a new file\n\
