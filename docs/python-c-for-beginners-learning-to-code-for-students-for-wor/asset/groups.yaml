  - '[PAGE 6]


    There are many different programming languages available to learn and use. Some
    are extremely complex and incredibly powerful, while some as minor utilities for
    the operating system. Python sits somewhere in the middle, combining ease of use
    with a generous helping of power, which allows the user to not only create small
    projects but also excellent games and performance heavy computational tasks.


    However, there''s more to Python than simply being another programming language.
    It has a vibrant and lively community that it shares knowledge, code and project
    ideas, as well as bug fixes for future releases. It''s thanks to this community
    that the language has grown and thrived; now, it''s your turn to take the plunge
    and learn how to program in Python.


    The first half of this book helps you get started with Python, and from there
    guides you on how to use some of the most common and interesting functions and
    features of the language. Before long, you will be able to code your own helpful
    system tools, text adventures and even control a character as they move around
    the screen.


    | 8 | Why Python? |

    | 10 | Equipment You Will Need |

    | 12 | Getting to Know Python |

    | 14 | How to Set Up Python in Windows |

    | 16 | How to Set Up Python on a Mac |

    | 18 | How to Set Up Python in Linux |


