  mdcn: "\n\n# 向 C++ 问好\n\n> “用代码行数来衡量编程进度，就像用重量来衡量飞机进度。”\n— 比尔·盖斯（微软联合创始人）\n\nC++\
    \ 是一种优秀的语言级编程语言，广泛应用于各种技术。从你喜欢的移动应用到控制台 PC 游戏，一切都是以 C++ 为核心开发的，并配合一套软件开发工具包和自定义库。\n\
    \nC++ 是你日常使用的大多数功能背后的驱动力，这使其成为一门复杂且极其强大的语言。在本节中，我们将介绍如何在你的计算机上安装 C++ IDE 和编译器。\n\
    \n| 84 | 为什么选择 C++？ |\n|---|---|\n| 86 | 所需设备 |\n| 88 | 如何在 Windows 中设置 C++ |\n\
    | 90 | 如何在 Mac 上设置 C++ |\n| 92 | 如何在 Linux 中设置 C++ |\n| 94 | 需要安装的其他 C++ IDE |\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_84_0.png)\n\n# 向 C++ 问好\n\n## 为什么选择\
    \ C++？\n\nC++ 是今天最流行的编程语言之一。它最初被称为“带有类的 C（C with Classes）”，在 1983 年更名为 C++。它是对原始\
    \ C 语言的扩展，是一个通用的面向对象（OOP）环境。\n\n## 所有领域\n\n由于该语言的复杂性以及其强大的功能和性能，C++ 通常用于开发游戏、程序、设备驱动程序甚至操作系统。\n\
    \nC++ 可以追溯到 1977 年（个人计算时代的开始），当时 C++ 或带有类的 C 是丹麦科学家比雅尼·斯特拉斯鲁普（Bjarne Stroustrup）在写博士论文期间的脑晶。斯特拉斯鲁普的目标是进一步完善自\
    \ 70 年代初以来一直被广泛使用的原始 C 语言。\n\n计算实验室以及无法访问互联网的普通人开发的应用程序、游戏甚至操作系统（如 Photoshop、InDesign\
    \ 等）都是用 C++ 开发的。你会发现你使用的浏览器是用 C++ 编写的，Windows 10、Microsoft Office 以及 Google 搜索引擎骨干也是如此。Apple\
    \ macOS 大部分是用 C++ 编写的（尽管包含其他）。\n\nC++ 证明在 80 年代的开发者中非常受欢迎，因为它是一个更容易上手的环境，更重要的是，它与原始\
    \ C 语言有 99% 的兼容性。这意味着可以在主流开发语言之外使用，NASA（美国航空航天局）、SpaceX（太空X）甚至 CERN（欧洲核子研究中心）的功能在各种应用程序、程序、控制和其他计算任务中使用了\
    \ C++。\n\nC++ 也极其高效，且在各个方面表现良好，甚至比核心 C 语言更易理解。相比 Python、BASIC 等语言，这种更高层次的性能使其成为现代计算的理想环境，因此公司倾向于广泛使用它。\n\
    \n虽然 Python 是一门非常棒的入门编程语言，但 C++ 让开发者进入了更广阔的代码世界。通过精通 C++，你可以发现自己在为微软、苹果等公司编写代码。通常，C++\
    \ 开发者的薪水比其他某些语言高，而且 C++ 程序员可以在不同的应用和公司之间移动而无需重新思考。Python 是一门更容易学习的语言，但我们建议你从 C++\
    \ 开始，花一些时间来掌握编程。\n\n- C++ 代码运行速度比 Python 快得多。\n\n```cpp\n#include<iostream>\n\
    using namespace std;\nvoid main() {\n    char c;\n    cout<<\"Enter a character\
    \ to check if it is vowel or not\";\n    switch (c) {\n        case 'a': case\
    \ 'A':\n            cout<<\"is a Vowel\";\n            break;\n        case 'e':\
    \ case 'E':\n            cout<<\"is a Vowel\";\n            break;\n        case\
    \ 'i': case 'I':\n            cout<<\"is a Vowel\";\n            break;\n    \
    \    case 'o': case 'O':\n            cout<<\"is a Vowel\";\n            break;\n\
    \        case 'u': case 'U':\n            cout<<\"is a Vowel\";\n            break;\n\
    \    }\n}\n```\n\n# 安装 - Visual Studio 2017 (15.0.2623.1)\n\n## 为什么选择 C++？\n\n\
    | 工作负载 | 独立组件 | 语言包 |\n|---|---|---|\n| **通用平台开发** | 使用 C# 或可选的 C++ 创建通用平台应用程序\
