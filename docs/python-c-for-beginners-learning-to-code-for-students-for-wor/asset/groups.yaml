    ## 保存并执行你的代码


    在 IDLE Shell 中工作对于短代码片段来说完全可以，但它并不是为输入较长的程序列表设计的。在本节中，你将接触 IDLE 编辑器，从现在起你将在那里工作。


    ## 编辑代码


    你最终会达到一个阶段，必须从在 Shell 中输入单行代码变为其他方式。IDLE 编辑器将允许你保存并执行 Python 代码。


    - **步骤 1** 首先，打开 Python IDLE Shell，点击 File（文件） -> New File（新建文件）。这将打开一个名为 Untitled（未命名）的新窗口。这就是
    Python IDLE 编辑器，你可以在这里输入代码来创建你未来的程序。


    - **步骤 2** 从意义上说，IDLE 编辑器就是一个具有 Python 特性、编码等功能的简单文本编辑器；它与 Sublime Text 非常相似。你输入代码的方式与在
    Shell 中一样，参考你上一个教程中的示例，输入：


    - **步骤 3** 你可以发现 IDLE 编辑器与 Shell 使用了相同的颜色编码，这让你能更好地理解代码的运行情况。然而，要执行代码，你首先需要保存它。按下
    F5，会弹出一个 Save...（保存）对话框。


    ![](img/ba40fbc39febe9db9a35785516d323a7_25_0.png)


    - **步骤 4** 点击保存框中的 OK 按钮，并选择你保存所有 Python 代码的位置。目标位置可以是专门的 Python 文件夹，你也可以随意地把它放在任何地方。记住，无论未来放在哪里，都要保持驱动器整洁。


    ```python

    print("Hello everyone!")

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_25_1.png)


    ![](img/ba40fbc39febe9db9a35785516d323a7_25_2.png)


    ## 保存并执行你的代码


    步骤 5 为你的代码输入名称，例如 ''print hello''，并点击 Save 按钮。当你的 Python 代码被保存时，它会执行，输出将在 IDLE
    Shell 中详细显示。在这种情况下，显示单词 ''Hello everyone!''。


    步骤 8 让我们扩展代码并输入上一个教程中的几个示例：


    ```python

    a=2

    b=2

    name="David"

    surname="Hayward"

    print(name, surname)

    print(a+b)

    ```


    如果你现在按下 F5，系统会要求再次保存文件，因为之前已经被修改过。


    ![](img/ba40fbc39febe9db9a35785516d323a7_26_0.png)


    步骤 6 你的绝大多数 Python 代码都将这样运行。将其输入到 Shell，按下 F5，保存代码并查看 Shell 中的输出。有时情况会有所不同，取决于你是否请求了特定的窗口，但最终这就是流程。除非另有说明，我们在整个过程中将使用这个流程。


    ![](img/ba40fbc39febe9db9a35785516d323a7_26_1.png)


    步骤 9 如果你点击 OK 按钮，文件将被新的代码条目覆盖，并在 Shell 中执行输出。对于这几行代码来说不是问题，但如果你想编辑一个文件，覆盖可能会变成问题。使用编辑器中的
    File > Save As（文件 > 存为）创建一个副本。


    ![](img/ba40fbc39febe9db9a35785516d323a7_26_2.png)


    步骤 7 如果你打开保存的 Python 代码文件，你可以看到它以 .py 扩展结尾。这是 Python 的默认文件名。你创建的任何代码都是任意.py，从互联网
    Python 资源下载的任何代码都是 .py。只需确保代码编写正确


    步骤 10 创建一个新文件。点击 Open（打开），打开一个新实例（从 Shell 点击 File > New File）。输入以下内容并保存为 hello：


    ```python

    a="Python"

    b=13

    c="cool!"

    print(a, b, c)

    ```


    你将在教程中使用这段代码。


    ![](img/ba40fbc39febe9db9a35785516d323a7_26_3.png)


    ## 从命令行执行代码


    虽然我们在本书中一直通过图形界面 IDLE 工作，但值得去看看 Python 的命令行处理。我们已经知道有一个命令行版本的 Python，它也用于执行代码。


    ## 命令行控制代码


    使用上一个教程中的代码（命名为 hello.py 的那个），让我们看看如何在命令行级别运行在图形界面中创建的代码。


    - **步骤 1** 在 Linux 中，Python 有两种通过命令行执行代码的方法。一种方法是使用 Python 2，另一种是使用 Python 3 库等。首先，进入你操作系统的命令行或
    Terminal（终端）。


    - **步骤 3** 如果你点击 OK 按钮，文件将被新的代码条目覆盖，并在 Shell 中执行输出。对于这几行代码来说不是问题，但如果你想编辑一个文件，覆盖可能会变成问题。使用编辑器的
    File > Save As（文件 > 存为）创建一个副本。


    - **步骤 1** 在 Linux 中，Python 有两种通过命令行执行代码的方法。一种方法是使用 Python 2，另一种是使用 Python 3 库等。首先，进入你操作系统的命令行或终端。


    - **步骤 3** 如果你点击 OK 按钮，文件将被新的代码条目覆盖，并在 Shell 中执行输出。对于这几行代码来说不是问题，但如果你想编辑一个文件，覆盖可能会变成问题。使用编辑器的
    File > Save As（文件 > 存为）创建一个副本。


    - **步骤 2** 如果你点击 OK 按钮，文件将被新的代码条目覆盖，并执行，Windows 用户需要启动。


    - **步骤 4** 如果你点击 OK 按钮，文件将被新的代码条目覆盖，并在 Shell 中执行输出。对于这几行代码来说不是问题，但如果你想编辑一个文件，覆盖可能会变成问题。使用编辑器的
    File > Save As（文件 > 存为）创建一个副本。


    - **步骤 5** 如果你点击 OK 按钮，文件将被新的代码条目覆盖，并在 Shell 中执行输出。对于这几行代码来说不是问题，但如果你想编辑一个文件，覆盖可能会变成问题。使用编辑器的
    File > Save As（文件 > 存为）创建一个副本。


