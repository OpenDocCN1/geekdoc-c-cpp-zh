    sudo apt-get install libreadline-dev libsqlite3-dev libncursesw5-dev libncurses5-dev
    tk-dev

    libz1gm-dev libbz2-dev

    ```


    STEP 8 Within the Python folder, enter:


    ```bash

    ./configure

    sudo make altinstall

    ```


    This could take a little depending on the speed of your computer. Once finished,
    run python.3 --version to check the installed version.


    ![](img/ba40fbc39febe9db9a35785516d323a7_18_0.png)


    STEP 6 Open your Linux web browser and go to the Python page: https://www.python.org/downloads/.
    Click on the Download Python 3.6.2 (or version it''s on you) to download the source
    3.6.2.tar.xz


    STEP 9 For the GUI, you need to enter the following command in the Terminal:


    ```bash

    sudo apt-get install idle3

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_18_1.png)


    The IDLE can then be started with: idle3. Note that IDLE runs from a different
    version than the one you installed from.


    STEP 7 In the Terminal, go to the contents of the Python source code: cd tar -xvf
    Python-3.6.2.xz. Now enter the newly opened folder with: cd Python-3.6.2


    STEP 10 Now you need to install PIP (Pip Packages) which is a help to you install
    more modules and extras.


    Enter: pip3 is installed, then check for the update with:


    ```bash

    pip3 --upgrade pip

    ```


    When complete, the Terminal and Python 3.x will be available by the Programming
    in your menu.


