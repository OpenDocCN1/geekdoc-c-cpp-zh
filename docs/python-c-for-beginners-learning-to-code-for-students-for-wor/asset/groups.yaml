    # Using Comments


    STEP 5 Whilst we know that the variable A is, and that the player has lost one,
    a casual viewer or someone checking the code. Imagine for a moment that the code
    is twenty thousand long, instead of just seven. You can see how handy comments
    work.


    STEP 8 Inline comments are comments that follow a section of code. Take our examples
    from above, instead of inserting the code as an example, we could use:


    ```

    a=10 Set the value of A to 10

    print("The value of A is," a) # Print the current value of

    a=0 Player lost a life!

    print("You''ve just lost a life!")

    print("You now have", a, "lives left!") # Inform player, and display current value
    of A (lives)

    ```


    ```

    Python 3.2

    Edit File Save Get Help Window 10:23:13

    (Python 3.2.1)

    [ClC on line to quit]

    Type help for details, ''credits'' or ''license'' for more information.

