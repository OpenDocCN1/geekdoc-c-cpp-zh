    # Python & C++ for Beginners


    > Most good programmers do programming not because they expect to get paid or
    get adulation by the public, because it is fun to program.

    > Linus Torvalds (developer of the Linux kernel)


    Having a basic knowledge of programming can open many doors for the newcomer to
    explore. You can understand how hardware and software work together, how your
    computer or device functions and how incredible open-world gaming environments
    are converted from ones and zeros to what''s on your monitor or TV.


    Technology is everywhere and it''s all connected through programming. Your TV,
    microwave, in-car entertainment and the internet are all reliant on good programming
    to make them work the way you want to.


    Within these pages are the building blocks to help you take your first steps into
    the world of programming. We''ve taken two of the most powerful and versatile
    programming languages available, Python and C++, and broken them down into bite-sized
    tutorials and guides to help you learn how they work, and how to make them work
    for you.


    Learn how to install them, print simple messages to the screen, ask for user input
    and manipulate the data to produce amazing results. By the end of this book you
    will understand how Python and C++ work, and what potential lies beyond.


    Ready? Let''s get programming!


