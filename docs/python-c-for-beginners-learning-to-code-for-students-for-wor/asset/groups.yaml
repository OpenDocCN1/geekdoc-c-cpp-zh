    \n![](img/ba40fbc39febe9db9a35785516d323a7_148_0.png)\n\n# Python File Manager\n\
    \nThis file manager program displays a list of options that allow you to read\
    \ a file, write to a file, append to a file, delete a file, list the contents\
    \ of a directory and more. It's remarkably easy to edit and insert into your own\
    \ code, or add to:\n\n## FILEMAN.PY\n\nCopy the code below into a New File and\
    \ save it as FileMan.py. Once executed it will display the program title, along\
    \ with the current time and date and the available options.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_149_0.png)\n\
    \n```python\nimport shutil\nimport os\nimport time\nimport subprocess\n```\n\n\
    ```python\ndef Read():\n    path=input(\"Enter the file path to read:\")\n   \
