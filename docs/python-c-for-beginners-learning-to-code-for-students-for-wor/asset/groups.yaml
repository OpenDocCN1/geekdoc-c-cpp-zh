- md: "\n# C++ Input/Output\n\n![](img/ba40fbc39febe9db9a35785516d323a7_115_0.png)\n\
    \n# C++ Input/Output\n\nThere's a satisfying feeling when you program code that\
    \ asks the user for input, then uses that input to produce something that the\
    \ user can see. Even if it's simply asking for someone's name and displaying a\
    \ personal welcome message, it's a big leap forward.\n\nUser interaction, character\
    \ literals, defining constants and file input and output are all covered on the\
    \ following pages; all of this helps you to gain a better understanding of how\
    \ a C++ program works.\n\n> \"The best programs are written so that computing\
    \ machines can perform them quickly, and so that human beings can understand them\
    \ clearly.\"\n\n> Donald E. Knuth\n(Computer scientist, mathematician and author)\n\
    \n| 116 | User Interaction |\n| 118 | Character Literals |\n| 120 | Defining Constants\
    \ |\n| 122 | File Input/Output |\n\n![](img/ba40fbc39febe9db9a35785516d323a7_116_0.png)\n\
    \n# User Interaction\n\nThere's nothing quite as satisfying as creating a program\
    \ that responds to you. This basic user interaction is one of the most taught\
    \ aspects of any language and with it you're able to do much more than simply\
    \ greet the user by name.\n\n# HELLO, DAVE\n\nYou have already used cout, the\
    \ standard output stream, throughout our code. Now you're going to be using cin,\
    \ the standard input stream, to program a response.\n\n- Anything that you want\
    \ the user to input the program needs to be stored somewhere in the system memory,\
    \ so it can be retrieved and used. Therefore, any must first be declared as a\
    \ variable, so it's ready to be used by the user. Start by creating a C++ file\
    \ with headers.\n\n- The cin command works in the opposite way as output 'What\
    \ is your age' to the screen, as indicated with the chevrons. Cin uses facing\
    \ chevrons, indicating an input. The input is put into the integer chevrons and\
    \ called up in the second count. Build and run the code.\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n    int age;\n    cout << \"What is your\
    \ age: \";\n    cin >> age;\n    cout << \"You are \" << age << \" years old.\\\
    n\";\n    return 0;\n}\n```\n\n- If you're asking a question, you need to store\
    \ the input as a string; to ask the user their name, you would use:\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main() {\n    string name;\n\
    \    cout << \"What is your name: \";\n    cin >> name;\n    cout << \"Hello,\
    \ \" << name << \" I hope you're well today!\\n\";\n    return 0;\n}\n```\n\n\
    The data type of the variable must also match the type of input you want from\
    \ the user. For example, to ask a user, you would use an integer like this:\n\n\
    # User Interaction\n\nSTEP 5 The principal works are the same as the previous\
    \ code. The user's input, name, is stored in a string because it contains multiple\
    \ characters, and retrieved in the code line. As using the variable 'name' doesn't\
    \ change, you can recall it whenever you like in your code.\n\nSTEP 8 While cin\
    \ works for most inputs, it has a limitation. Always considers spaces as the terminator\
    \ for not multiple words. However, getline takes as the first argument and the\
    \ variable as the second:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main() {\nstring mystr;\ncout << \"Enter a sentence: \\n\";\ngetline(cin,\
    \ mystr);\ncout << \"Your sentence is: \" << mystr.size() << \" characters\\n\"\
    ;\n}\n```\n\nSTEP 6 You can inject requests to bust the user but make sure you\
    \ have a variable to store the result. Let's assume the user to enter two numbers:\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\nint num1, num2;\n\
    cout << \"Enter two whole numbers: \\n\";\ncin >> num1 >> num2;\ncout << \"you\
    \ entered \" << num1 << \" and \" << num2 << \" numbers\\n\";\n}\n```\n\n| 1 |\
    \ <iostream> |\n| 2 | using namespace std |\n| 3 | int main() { |\n| 4 | int num1,\
    \ num2; |\n| 5 | cout << \"Enter two whole numbers: \\n\"; |\n| 6 | cin >> num1\
    \ >> num2; |\n| 7 | cout << \"you entered \" << num1 << \" and \" << num2 << \"\
    \ numbers\\n\"; |\n| 8 | } |\n\n![](img/ba40fbc39febe9db9a35785516d323a7_118_0.png)\n\
    \nSTEP 9 Build and execute the code, then enter a sentence with spaces. If you've\
    \ done the code line with cin >> try and again, the result displays the number\
    \ of characters to the start\n\nLikewise, input can be manipulated once you have\
