    \ random words from it.\")\nnds=input(\"\\nHow many words should I choose? \"\
    )\nwith open(\"home/pi/Downloads/words.txt\", \"rt\") as f:\n    words = f.readlines()\n\
    \    words = [w.strip() for w in words]\nprint(\"\\n-\")\nfor i in range(int(nds)):\n\
    \    print(random.choice(words))\nprint(\"\\n-\")\n```\n\n- STEP 8\nYou can select\
    \ a random number from a range in steps, using the start, stop, step loop:\n\n\
    ```python\nimport random\nfor i in range(10):\n    print(random.randrange(0, 200,\
    \ 7))\n```\n\nResults will give you a general idea of how it works.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_74_2.png)\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_74_3.png)\n"
