    # # C++ Fundamentals


    # # Strings


    Strings are objects that represent and hold sequences of characters. For example,
    you could have a universal greeting in your code ''Welcome'' and assign that to
    a string to be called up wherever you like in the program.


    # STRING THEORY


    There are different ways in which you can create a string of characters, which
    historically are all carried over from the original C language, and are still
    supported by C++.


    +   STEP 1 To create a string you use the char function. Open a new C++ file and
    begin with the usual header:


    ```

    #include <iostream>

    using namespace std;

    int main () {


    }

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_111_0.png)


    It''s easy to confuse a string with an array. Here''s an array, which can be terminated
    with a null character:


    +   STEP 3 Build and run the code, and ''Welcome'' appears on the screen. While
    this is perfectly fine, it''s not a string. A string is a class, which defines
    objects that can be represented as a stream of characters and doesn''t need to
    be terminated like an array. The code can therefore be represented as:


    ```

    #include <iostream>

    using namespace std;

    int main () {

    char greet[] = "Welcome";

    cout << greet << "\n";

    }

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_111_1.png)


    +   STEP 4 In C++ there''s also string function, which works in the same way.
    Using the greeting code again,


    ```

    #include <iostream>

    using namespace std;

    int main () {

    string greet = "Welcome";

    cout << greet << "\n";

    }

    ```


    ```

    #include <iostream>

    using namespace std;

    int main () {

    char greet[] = { ''W'', ''e'', ''l'', ''c'', ''o'', ''m'', ''e'', ''\0'' };

    cout << greet << "\n";

    }

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_111_2.png)


