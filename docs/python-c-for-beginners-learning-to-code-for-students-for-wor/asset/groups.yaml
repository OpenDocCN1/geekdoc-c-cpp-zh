    # 初学者 Python & C++


    > 大多数优秀的程序员编写程序并不是因为期待获得报酬或公众的赞誉，而是因为编程本身很有趣。

    > Linus Torvalds (Linux 内核开发者)


    拥有编程基础知识可以为新人的探索许多领域敞辟大门。你可以理解硬件和软件是如何协同工作的，你的电脑或设备是如何运行的，以及惊人的开放世界游戏环境是如何从 0
    和 1 转换为显示器或电视上的内容的。


    技术无处不在，而且它们都通过编程连接在一起。你的电视、微波炉、车载娱乐系统和互联网都依赖于良好的编程，以按照你想要的方式运行。


    这些页中包含了帮助你迈入编程世界第一步的基石。我们选择了两种最强大且多功能的编程语言——Python 和 C++，并把它们拆解为易于理解的教程和指南，帮助你学习它们的工作原理，以及如何让它们为你服务。


    学习如何安装它们、向屏幕上打印简单信息、获取用户输入并处理数据以产生惊人的结果。读完这本书后，你将理解 Python 和 C++ 的工作原理，以及背后隐藏着什么潜力。


    准备好了吗？让我们开始编程吧！


