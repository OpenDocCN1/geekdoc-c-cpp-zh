    \ that displays the integer num. Every time the loop repeats itself, the second\
    \ and third stages of the loop, it adds 1 until the condition <30 is false. The\
    \ loop ends and the code continues, ending nearly with return 0.\n\n```\n// Loop\
    \ Begins\nfor (int num = 1; num < 30; num = num + 1) {\n\tcout << \"Number: \"\
    \ << num << endl;\n\n\treturn 0;\n}\n```\n\n+   STEP 2 Start simple and create\
