    # Lists


    Lists are one of the most common types of data structures you will come across
    in Python. A list is simply a collection of items, or if you prefer, that can
    be accessed as a whole, or individually if wanted.


    # WORKING WITH LISTS


    Lists are extremely handy in Python. A list can be strings, integers and also
    variables. You can even include functions in lists, and within lists themselves.


    +   - A list is a sequence of data values called items. You create the name of
    your list by an equals sign, then use square brackets to separate the items by
    commas; note that strings use quotes.


    ```

    numbers = [1, 4, 7, 21, 98, 156]

    mystical_creatures = ["Unicorn", "Balrog", "Vampire", "Dragon", "Minotaur"]

    ```


    +   STEP 3 You can access, or index, the list in a list by using the minus sign
    before the list item [-1], or to the second item with [-2] and so on. Trying to
    reference an item that isn''t in the list, such as [10] will return an error:


    ```

    numbers[-1]

    mystical_creatures[--4]

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_45_0.png)


    +   STEP 4 Once you''ve defined your list you can call each by referencing its
    name, by a number. Lists start the first item entry as 0, followed by 1, 2, 3
    and so on. For example:


    numbers


    numbers[3]


    Slicing is similar to indexing but you can retrieve multiple items by separating
    item numbers with a colon. The items will then be returned as a list.


    numbers[1:3]


    Will output the 4 and 7, being item numbers 1 and 2. Note that the returned values
    will not include the second index (position) such as [3] to return 4 and 7.


    To call the third zero in the list (21 in this case).


    > type: "copyright" or "license" for more information.


    > type: "copyright" or "license" for more information.

    mystical_creatures = ["Unicorn", "Balrog", "Vampire", "Minotaur"]


