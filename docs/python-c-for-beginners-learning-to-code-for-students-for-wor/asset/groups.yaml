    \ value of A is\", a)\n```\n\n- STEP 3 Resave the code and execute it. You can\
    \ see that the output in the IDLE Shell is the same as before, despite the lines\
    \ being added. Simply put, the hash symbol (#) denotes a line of text the programmer\
    \ can insert to inform them, and others, of what's going on without the user being\
    \ aware.\n\n![](img/ba40fbc39fe9db9a35785516d323a7_31_0.png)\n\n- Let's assume\
    \ that the variable A we've created is the number of lines in a game. Every time\
    \ the player dies, the code is decreased by 1. The programmer insert a comment\
    \ along the lines of:\n\n```python\na-=1\n# print(\"You've just lost a life!\"\
    )\nprint(\"You now have\", a, \"lives left!\")\n```\n\n![](img/ba40fbc39fe9db9a35785516d323a7_31_1.png)\n\
    \n- STEP 5 Whilst we know that the variable A is, and that the player has lost\
