    int b = 5;

    cout << a;

    cout << "\n";

    cout << b;

    ```


    ### 第 4 步


    自然地你可以声明一个新变量，命名为 result 并输出一些算术结果：


    ```cpp

    int result;

    ```


    ```cpp

    result = a + b;

    cout << result;

    ```


