    ## Code Improvements


    Since this is a simple script to apply to a situation, there''s plenty of room
    to mess with it and make it more interesting. Perhaps you could include an option
    to add a score, reward the player for getting a ''hole'' in one corner on their
    first try.


    Moreover, the number guess code offers some room for implementing your code in
    a different manner. What we mean by this is, the code can be used to retrieve
    a random number from a range, which in turn can give you the start of a character
    created function within an adventure game.


    Imagine the start of a text adventure written in Python, where the player names
    change. The next step is to run the random dice to decide what character''s combat
    stats are which can then be carried into the game under a set of variables that
    can be reduced or increased depending on the circumstances the player encounters.


    For example, as the screenshot showed, you could use something along the lines
    of:


    The player can then decide to stick with their roll or try again for the hope
    of better values being picked. There''re always ways in which to implement this
    code into a basic adventure game.


    ![](img/ba40fbc39febe9db9a35785516d323a7_152_0.png)

    ![](img/ba40fbc39febe9db9a35785516d323a7_152_1.png)

