    # # Tuples


    Tuples are very much identical to lists. However, where lists can be deleted,
    updated or changed in some, a tuple remains constant. This is called immutable
    and they''re perfect for storing fixed data items.


    # ## THE IMMUTABLE TUPLE


    Reasons for having tuples vary depending on what the program is intended to do.
    In an adventure game, where non-playing character names are stored special by
    they''re also used for example,


    +   **STEP 1** A tuple is created the same way as a list but in you use brackets
    instead of square brackets. For example:


    ```

    months=(\January", "February", "March", "April",

    "May", "June")

    ```


    +   **STEP 3** You can create grouped tuples into lists that contain multiple
    sets of data. For instance, here is a tuple called NPC (Non-Playable Characters)
    containing the character name and their combat rating for an adventure game:


    ```

    NPC=("Conan", 100), ("Belit", 80), ("Valeria", 95))

