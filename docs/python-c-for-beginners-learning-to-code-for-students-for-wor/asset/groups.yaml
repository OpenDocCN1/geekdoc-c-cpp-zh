    ## 变量


    与 Python 相比，C++ 中的变量有所不同。在 Python 中，你可以简单地声明 ''a'' 等于 10 并赋值变量。然而，在 C++ 中，变量在使用之前必须先声明其类型。


    ## 变量的声明


    你可以通过代码中的语句来声明 C++ 变量。你可以声明几种不同类型的变量。以下是其工作原理。


    ### 第 1 步


    打开一个新的空白 C++ 文件并输入通常的代码头文件：


    ```cpp

    #include <iostream>

    using namespace std;

    int main()

    {

    ```


    ### 第 2 步


    从简单的开始，创建两个变量 a 和 b，其中一个值为 10，另一个值为 5。你可以使用数据类型来声明这些变量。使用大括号：


    ```cpp

    int a = 10;

    int b = 5;

    ```


    ### 第 3 步


    你可以构建并运行代码，但它除了将值 10 和 5 存储在整数 a 和 b 中之外没有其他作用。要输出变量的内容，添加：


    ```cpp

    cout << a;

    cout << "\n";

    cout << b;

    ```


    `cout << "\n";` 仅仅是在 10 和 5 的输出之间放置一个换行。


    ```cpp

    Variables.cpp

    #include <iostream>

    using namespace std;

    int main()

    {

