  - "[PAGE 143]\n\n# C++ Beginner’s Mistakes\n\nThere are many pitfalls the C++ developer\
    \ can encounter, especially as this is a more complex and often unforgiving language\
    \ to master. Beginners need to take C++ a step at a time and digest what they've\
    \ learned before moving on.\n\n# VOID(C++, MISTAKES)\n\nAdmittedly it's not just\
    \ C++ beginners who make the kinds of errors we outline on these pages, even hardened\
    \ coders are prone to the odd mistake here and there. Here are some common issues\
    \ to try and avoid.\n\n# UNDECLARED IDENTIFIERS\n\nA common C++ mistake, and to\
    \ be honest with most programming languages, is when you output a variable that\
    \ doesn't exist. Displaying the value of x off-screen is fine but not if you haven't\
    \ told the compiler what the value of x is to begin with.\n\n# STD NAMESPACE\n\
    \nReferencing the Standard Library is common for beginners throughout their code,\
    \ but if you miss the std::element of a statement, your code errors out when compiling.\
    \ You can combat this by adding\n\n```\nusing std;\n```\n\nUnder the #include\
    \ part and simply using std, and so on when\n\n```\n#include <iostream>\nusing\
    \ namespace std;\nint main() {\n    int a, b, c, d;\n    a=10;\n    b=20;\n  \
    \  c=30;\n    d=40;\n    cout << a, b, c, d;\n}\n```\n\n```\n#include <iostream>\n\
    int main() {\n    std::cout << x;\n}\n```\n\n# SEMICOLONS\n\nRemember that each\
    \ line of a C++ program must end with a semicolon. If it doesn't the compiler\
    \ will treat the line with missing semicolon as the next one. This creates manner\
    \ of problems when trying to compile, so don't forget your semicolons.\n\n```\n\
    #include <iostream>\n```\n\n```\nint main() {\n    int a, b, c, d;\n    a=10;\n\
    \    b=20;\n    c=30;\n    d=40;\n    std::cout << a, b, c, d;\n}\n```\n\n# GCC\
    \ OR G++\n\nIf you're compiling in Linux you will not doubt come across gcc and\
    \ g++. In short, gcc is the GNU Compiler (or GNU C Compiler as it is called to\
    \ be) and g++ is the Gnu (the C++ version of the compiler). If you're using C++\
    \ then you need to use g++, as correct compiler drivers will be\n\n```\ndavid-mate\
    \ ~/Documents $ gcc test.cpp -o test\n$ g++ test.cpp -o test\n$ g++ test.cpp -o\
    \ test undefined reference to std::cout\n$ test.cpp:(text=0xef): undefined reference\
