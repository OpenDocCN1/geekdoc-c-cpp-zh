    \ has been deleted\")\n    else:\n        print(\"File does not exist\")\n```\n\
    \n```python\ndef ListDir():\n    path=input(\"Enter the Directory path to display:\"\
    )\n    sortlist=sorted(os.listdir(path))\n    i=0\n    while(i<len(sortlist)):\n\
    \        print(sortlist[i])\n        i+=1\n```\n\n```python\ndef Check():\n  \
    \  fp=input(\"Enter Check existence of \\n1.File \\n2.Directory:\")\n    if fp=='1':\n\
