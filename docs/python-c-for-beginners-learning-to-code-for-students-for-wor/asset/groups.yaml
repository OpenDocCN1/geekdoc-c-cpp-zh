    This cross-platform IDE is designed to create C++ applications for desktop and
    mobile environments. It comes with a code editor and integrated tools for testing
    and debugging, and is an open source platform. It is free but there is a trial
    period on offer requiring purchase: www.qt.io/qt-features-libraries-apis-tools-and-ide/


    # MONODEVELOP


    This excellent IDE allows developers to write C++ for desktop and web applications
    across all the major platforms. There''s an advanced text editor, debugger and
