    \n![](img/ba40fbc39febe9db9a35785516d323a7_72_5.png)\n\n# Random Module\n\nThe\
    \ Random module is one you will likely use many times in your Python life; as\
    \ the name suggests, it is designed to create random numbers.\n\n## RANDOM NUMBERS\n\
    \nThere are numerous functions within the Random module which can create some\
    \ interesting and useful programs. Just as with other modules you need to import\
    \ random before you can use it we're going to look at this tutorial. Let's begin\
    \ by simply printing a random number from 1 to 5:\n\n```python\nimport random\n\
    print(random.randint(0,5))\n```\n\nHowever, the Random module isn't used exclusively\
    \ for numbers. You can use it to select an entry from a list, and that list can\
    \ contain:\n\n```python\nimport random\nlist=[\"Conan\", \"Valeria\", \"Bella\"\
    , \"Python\"]\nprint(random.choice(list))\n```\n\nThis will display the names\
    \ of adventurers at random, which is a great addition to a text game.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_73_0.png)\n\
    \nIn our example the number was returned. However, enter the print function few\
    \ times and will see different integer values from given to five. The example\
    \ shows how random is adequate for the average programmer to utilise in their\
    \ code.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_73_1.png)\n\nFor a bigger\
    \ set of numbers, including multiplication sign: you can extend the range by using\
    \ the\n\n```python\nimport random\nprint(random.randint(0,100))\n```\n\nYou can\
    \ extend the example somewhat by using random.choice(list) from a list of variables.\
    \ Instance:\n\n```python\nimport random\nlist=[\"44\", \"80\", \"Pi\", \"True\"\
    , \"34\", \"Python\"]\nprint(random.choice(list))\n```\n\nThis will display a\
    \ floating point between 0 and 100, to use the range around fifteen.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_73_2.png)\n\
    \n# STEP 6\nInterestingly, you can also use a function within the Random module\
    \ to shuffle the items in the list, thus adding a little randomness to the equation:\n\
    \n```python\nrandom.shuffle(lst)\nprint(lst)\n```\n\nThis way, you can shuffle\
    \ the list by displaying a random item from it.\n\n- STEP 9\nLet's use an example\
    \ of code which flips a virtual coin ten thousand times and counts how it lands\
    \ on heads or tails:\n\n```python\nimport random\noutput={\"Heads\":0, \"Tails\"\
    :0}\ncoin=list(output.keys())\nfor i in range(10000):\n    output[random.choice(coin)]+=1\n\
    print(\"Heads:\", output[\"Heads\"])\nprint(\"Tails:\", output[\"Tails\"])\n```\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_74_0.png)\n\n- STEP 7\nUsing shuffle,\
    \ you can create an entirely random list of numbers. For example, within a given\
    \ range:\n\n```python\nimport random\nlst=[i for i in range(20)]\nrandom.shuffle(lst)\n\
    print(lst)\n```\n\nKeep shuffling the list and you can have different selections\
    \ of items from 0 to 20 every time.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_74_1.png)\n\
    \n- STEP 10\nHere's an interesting piece of code. Using a text file containing\
    \ 460 words, you can pick random numbers of words from the file (text file at:\
    \ github.com/dwly/english-words):\n\n```python\nimport random\n\nprint(\"\\n>>>Random\
