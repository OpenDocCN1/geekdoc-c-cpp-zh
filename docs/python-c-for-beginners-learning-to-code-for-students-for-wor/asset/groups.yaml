    \ is what draws the circle on the screen, with 50 being the size. you can play\
    \ around the sizes if you like, going up to 100, 150 and beyond; you can draw\
    \ an arc by entering: `turtle.circle(50,180);` where the size is 50, but you're\
    \ telling Python to only draw 180° of the circle.\n\n```\nPython 3.4.2\nPython\
    \ 3.4.2 (default: Oct 19 2014, 13:31:11)\n>>> import turtle\n>>> type(\"credits\"\
    )\n\"copyright\" or \"license\" for more information.\n>>> turtle\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_63_0.png)\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_63_1.png)\n\n- **STEP 2** Let's begin\
    \ by drawing a simple circle. Start a New File, then enter the following code:\n\
    ```python\nimport turtle\nturtle.circle(50)\nturtle.mainloop()\n```\n\n- **STEP\
    \ 4** The last part of the circle tells Python to keep the window where the drawing\
    \ is taking place to remain open, so the user can click to do it. Now, let's make\
    \ a square:\n```python\nimport turtle\nprint(\"Drawing a square-\")\nfor t in\
    \ range(4):\n    turtle.forward(100)\n    turtle.left(90)\nturtle.screen().mainloop()\n\
    ```\n\nAs usual Press F5 to save the code and execute it. A new window will now\
    \ open up and the \"Turtle\" will draw a circle.\n\nYou can see that we've inserted\
    \ a loop to draw the sides of the square.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_63_2.png)\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_63_3.png)\n\nSTEP 5 You can add a new\
    \ line to the square code to add some colour:\n```python\nturtle.color(\"Red\"\
    )\n```\n\nThen you can change the character to an actual turtle by entering:\n\
    ```python\nturtle.shape(\"turtle\")\n```\n\nYou can also use the command turtle.begin_fill(),\
