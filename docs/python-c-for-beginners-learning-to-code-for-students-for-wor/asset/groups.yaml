    \n![](img/ba40fbc39febe9db9a35785516d323a7_40_1.png)\n\n# LOOPS\n\nA loop looks\
    \ quite similar to a condition but they are somewhat different in their operation.\
    \ A loop will run through the block of code a number of times, usually with the\
    \ support of a condition.\n\n- **STEP 1** Let's start with a While loop. If, this\
    \ will check if we see something, then run the indented code:\n\n```python\nx\
    \ = 1\nwhile x < 10:\n    print(x)\n    x = x + 1\n```\n\n- **STEP 3** The For\
    \ loop is another example. For is used to loop over a range of data, usually a\
    \ listed sort inside square brackets.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_40_2.png)\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_40_3.png)\n\n- **STEP 2** The difference\
