    \    path=input(\"Enter the directory name to make:\")\n    os.makedirs(path)\n\
    \    print('Directory Created')\n```\n\n```python\ndef removedir():\n    path=input(\"\
    Enter the path of directory:\")\n    td=input(\"1.Delete directory 2.Delete tree\
    \ 3.Exit \\n\")\n    if tdir=='1':\n        os.rmdir(path)\n        print('Directory\
    \ Deleted')\n    if tdir=='2':\n        shutil.rmtree(path)\n        print('Directory\
    \ Deleted')\n    if tdir=='3':\n        exit()\n```\n\n```python\ndef Openfile():\n\
    \    path=input(\"Enter the path of program:\")\n    try:\n        os.system(path)\n\
    \    except:\n        print('File not found')\n```\n\n```python\nrun=1\nwhile(run==1):\n\
    \    try:\n        os.system('cls')\n    except OSError:\n        os.system('clear')\n\
    \    print('<<< Python Manager >>>')\n    print('The current time and date is\
    \ '+time.asctime())\n    choice=input(\"Enter the option: \\n\")\n    if choice=='1':\n\
    \        # Write file\n    if choice=='2':\n        # Append to file\n    if choice=='3':\n\
    \        exit\n```\n\n# Imports\n\nThere are three modules to import here: shutil,\
    \ OS and Time. The first two deal with the operating system and file management;\
    \ the Time module simply displays the current time and date.\n\nNote how we've\
    \ included an except block to check if the user is running on Linux or Windows.\
    \ Windows uses cls to clear the screen, while Linux uses clear. The try block\
    \ should work, but it is a point of improvement over your system.\n\n# Number\
    \ Guessing Game\n\n# NUMBERGUESS.PY\n\nThis is a simple piece of code but it makes\
    \ good use of the Random module, print, and a loop. The number of guesses can\
    \ be increased from 5 and the random range can be easily altered.\n\nCopy the\
    \ code and see if you can beat the computer within five guesses. It's an interesting\
    \ bit of code that can be quite handy when you are implementing a Random module\
    \ alongside a loop.\n\n```python\nimport random\nguessed = 0\nname=input('Hello!\
    \ What is your name? ')\nnumber = random.randint(1, 30)\nprint('Sure, ' + name\
    \ + ', I\\'thinking of a number between 1 and 30')\nwhile guessed < 5:\n    guess\
    \ = int(input('Guess ' + str(guessed+1) + ': '))\n    guessed += 1\n    if guess\
    \ == number:\n        print('You guessed correctly!')\n        break\n    elif\
    \ guess > number:\n        print('Too high, try again.')\n    else:\n        print('Too\
    \ low, try again.')\nprint('Sorry, the number was ' + str(number))\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_151_0.png)\n\
    \nIf the player guesses the number, then 'well done', but how many guesses did\
    \ they get right? The output of guesses could be displayed instead, along with\
    \ revealing the random number chosen by the computer.\n\nThis code is easy to\
    \ program, but there are some elements to the code that I want to point out. How\
    \ we import the Random module, also by using random numbers within the code.\n\
    \nThis section of the code explains the variables of the code used, along with\
    \ the number of guesses, and if we wanted to set the random number selection from\
    \ 1 to 50, we would use `random.randint(1, 50)` instead of 30. If too high the\
    \ player will never be able to guess it. If the player guesses too low or high,\
    \ then the appropriate guess is asked and taken to try again. You can also increase\
    \ the number of guesses from 5 while using `guessed < 5`:\n\n![](img/ba40fbc39febe9db9a35785516d323a7_151_1.png)\n\
    \n```python\nguessed = 0\nname=input('Hello! What is your name? ')\nnumber = random.randint(1,\
    \ 30)\nprint('Sure, ' + name + ', I\\'thinking of a number between 1 and 30')\n\
    while guessed < 5:\n    guess = int(input('Guess ' + str(guessed+1) + ': '))\n\
    \    guessed += 1\n    if guess == number:\n        print('You guessed correctly!')\n\
    \        break\n    elif guess > number:\n        print('Too high, try again.')\n\
    \    else:\n        print('Too low, try again.')\nprint('Sorry, the number was\
    \ ' + str(number))\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_151_2.png)\n\
