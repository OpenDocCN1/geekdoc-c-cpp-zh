    \ back into Python.\n\n## WRITE AND CLOSE\n\nThe write() function is slightly\
    \ more complex than read(). Along with the filename you must also include an access\
    \ mode which determines whether the file in question is read or write mode.\n\n\
    - **STEP 1** Start opening IDE and the following:\n`t=open(\"/home/pi/Documents/text.txt\"\
    )`\n\nChange the destination from /home/pi/Documents to your own system. This\
    \ will create a text file in write mode using the variable 't'. If there's no\
    \ file of that name in the location, it will create one. If one already exists,\
    \ it will overwrite it, so be careful.\n\n- **STEP 3** However, the actual text\
    \ file is still blank (you can write the line of the file object but not committed\
    \ to the file. Part of the write() function is you need to commit the changes\
    \ to the file; `t.close()`\n\n![](img/ba40fbc39febe9db9a35785516d323a7_59_0.png)\n\
    \n- **STEP 4** You can now write to the text file using the write() function.\
    \ This opposes to read(), writing lines instead of them reading. Try this:\n\n\
    ```\nt.write(\"You awake in a small, square room. A single table stands to one\
    \ side, there is a locked door in front of you.\")\n```\n\nNote the 109 is the\
    \ number of characters you created.\n\n- If you now open the text file with a\
    \ text editor, you can see that the line you have created within the file. This\
    \ gives us for some interesting possibilities: the creation of your log file or\
    \ the beginning of an adventure.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_59_1.png)\n\
    \n# Writing to Files\n\nSTEP 5: To expand this code, you can reopen the file using\
    \ 'a', for access or append mode. This will add any text at the end of the inline\
    \ line of wipe and creating a new one.\n\nSTEP 8: You can pass variables to a\
    \ file that you've created in Python. You can call Pi from the Math module, create\
    \ a new file and pass the output of Pi into the new file:\n\n```\nt=open(\"home/pi/Documents/txt.txt\"\
    ,\"a\")\nt.write(\"n\")\nYou stand and survey your surroundings. On top of the\
    \ table is some meat, and a cup of water.\\n\")\n```\n\n```python\nimport math\n\
    print(\"Value of Pi is: {math.pi}\")\nt.write(\"writing to a file name...\\n\"\
    )\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_60_0.png)\n\nSTEP 6: You can\
    \ keep extending the text line by, ending with a new line (\\n). When you're done,\
    \ finish with the code() and open the file in the editor to see the result.\n\n\
    STEP 9: Now let's create a variable pi and assign it the value of Pi:\n\n```\n\
    t.write(\"The door is made of solid oak with iron strips. It's built from the\
    \ outside, locking you in. You are a prisoner!\\n\")\nt.close()\n```\n\npi=math.pi\n\
    You also need to create a new file in which write Pi:\n`t(\"home/pi/Documents/pi.txt\"\
    ,\"w\")`\nRemember to change your file location to using your system setup.\n\n\
    ![](img/ba40fbc39febe9db9a35785516d323a7_60_1.png)\n\nSTEP 7: There are various\
    \ types of file access to consider using the (open()) function. Each depends on\
    \ the hour and position of the cursor. For example, r opens a file in read mode\
    \ and writes at the start of the file.\n\nSTEP 10: To finish, use string formatting\
    \ to call the variable and write it to the file, then commit the changes and close\
    \ the file:\n\n```\nt.write(\"Value of Pi is: {pi}\")\nt.close()\n```\n\nYou can\
    \ see the results that you're able to pass any variable to\n\n![](img/ba40fbc39febe9db9a35785516d323a7_60_2.png)\n\
    \n# Exceptions\n\nWhen coding, you'll naturally come across some issues out of\
    \ your control. Let's assume you ask a user to divide two numbers and they try\
    \ to divide by zero. This will create an error and break your code.\n\n## OBJECTS\n\
    \nRather than stop the flow of your code, Python includes exception objects which\
    \ handle errors by catching conditions where exceptions may occur.\n\n- **STEP\
    \ 1** You can create an exception by simply trying to divide a number by zero.\
    \ With ZeroDivisionError: Division by zero message, as seen in the screenshot.\
    \ The ZeroDivisionError part is the exception of which are many.\n\n- **STEP 2**\
    \ Most exceptions are raised automatically when Python comes from something that's\
    \ inherently with the code. However you can create your own exceptions that are\
    \ designed to contain the potential error and react to it, as opposed to letting\
    \ the code fail.\n\n```python\ntry:\n    a=1\n    b=0\n    print(a/b)\nexcept\
    \ ZeroDivisionError:\n    print(\"Division by zero\")\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_61_0)\n\
    \n- **STEP 3** You can use the raise functions to create our own error handling\
    \ within Python. Let's assume your code is warping around too much results to\
    \ exiting, you can create a custom exception.\n\n```python\nraise Exception(\"\
    warp core\")\n```\nPython 3.4.2 (Default)\nTypeError: 'int' object is not callable\n\
    Traceback (most recent call last):\n  File \"input\", line 1, in <module>\nZeroDivisionError:\
    \ division by zero\n\n- **STEP 4** To trap any errors in the code you can enclose\
    \ the potential error within a block: this block consists of try, except, where\
    \ the code is held within; then if there's an exception do something.\n\n```python\n\
    try:\n    # Insert operations here\nexcept Exception:\n    # if there is another\
    \ exception do this\nelse:\n    # if there is no exception, do this\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_61_1.png)\n\
    \n# STEP 5\n\nFor example, use the division by zero. You can create an exception\
    \ where the code can handle the error without Python giving you the problem:\n\
    \n```python\ntry:\n    a=int(\"Enter the first number: \")\n    b=int(\"Enter\
    \ the second number: \")\n    print(a/b)\nexcept ZeroDivisionError:\n    print(\"\
    You tried to divide by zero!\")\nelse:\n    print(\"You did not divide by zero.\
    \ Well done!\")\n```\n\n# STEP 8\n\nNaturally, you can quickly fix the issue by\
    \ changing the \"r\" read only with a \"w\" for this. As you already know create\
    \ the file and write the content that changes to the file, in this case, a successful\
    \ execution of the code.\n\n```python\ntry:\n    f = open(\"testfile.txt\", \"\
    w\")\n    f.write(\"This is for information\")\n    f.close()\nexcept Exception\
    \ as e:\n    print(\"Error:\", e)\n\ntry:\n    f = open(\"testfile.txt\", \"r\"\
    )\n    print(f.read())\n    f.close()\nexcept Exception as e:\n    print(\"Error:\"\
    , e)\n```\n\n# STEP 6\n\nYou can use exceptions to handle a variety of useful\
    \ tasks. Using an example from our previous tutorials, let's open a file and write\
    \ to it:\n\n```python\ntry:\n    txt = open(\"/home/pi/Documents/testfile.txt\"\
    , \"w\")\n    txt.write(\"This is. Normal service will shortly resume!\")\nexcept\
    \ IOError:\n    print(\"Error: unable to write the file. Check permissions\")\n\
    else:\n    print(\"Content written to file successfully. Have a nice day.\")\n\
    \    txt.close()\n```\n\n# STEP 9\n\nYou can also use a finally: block, which\
    \ works in a similar fashion but you can also use it to. Our example from Step:\n\
    \n```python\ntry:\n    txt = open(\"/home/pi/Documents/testfile.txt\", \"r\")\n\
    \    txt.write(\"This is test. Normal service will shortly resume!\")\nexcept\
    \ IOError:\n    print(\"Error: unable to write the file\")\nfinally:\n    print(\"\
    Content written to file successfully. Have a nice day.\")\n    txt.close()\n```\n\
    (\"Error: unable to write the file. Check permissions\")\n\n# STEP 10\n\nObviously\
    \ this will not work due the file.txt being opened read only (the \"r\" part).\
    \ So Python telling you that you're doing something wrong, you've created an exception\
    \ using the IOError class informing you that the permissions are denied.:\n\n\
    As an error occur once you've used the \"r\" read only permission. If you change\
    \ it to a \"w\", the code would execute without the error displayed in the IDLE\
    \ Shell. Needless to say, that it can be a tricky exception when you get the hang\
    \ of it. Practice.\n"
  mdcn: "\n\n# 写入文件\n\n在 Python 中读取外部文件的能力非常有用，但写入文件更为强大。使用 `write()` 函数，你可以将程序的运行结果输出到文件中，然后通过\
    \ `read()` 将其重新读入 Python。\n\n## 写入与关闭\n\n`write()` 函数比 `read()` 稍微复杂一点。除了文件名，你还必须包含一个访问模式，该模式决定了目标文件是读取模式还是写入模式。\n\
    \n- **步骤 1** 启动 IDE 并输入以下内容：\n`t=open(\"/home/pi/Documents/text.txt\")`\n\n将目标路径从\
    \ `/home/pi/Documents` 更改为你自己的系统路径。这将使用变量 `t` 以写入模式创建一个文本文件。如果该位置没有同名的文件，它将创建一个。如果文件已存在，它将会覆盖该文件，所以请小心。\n\
    \n- **步骤 3** 然而，实际的文本文件仍然是空的（你可以向文件对象写入行，但内容尚未提交到文件中）。`write()` 函数的一个部分是需要将更改提交到文件中；`t.close()`\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_59_0.png)\n\n- **步骤 4** 现在你可以使用 `write()`\
    \ 函数向文本文件写入内容。这与 `read()` 相反，是写入行而不是读取。尝试一下：\n\n```\nt.write(\"你醒在一个狭小的正方形房间里。一侧放着一张桌子，你面前有一扇锁着的门。\"\
    )\n```\n\n注意，109 是你创建的字符数。\n\n- 如果你现在用文本编辑器打开该文件，就可以看到你在文件中创建的那行了。这为我们提供了一些有趣的可能性：创建你的日志文件或开始一段冒险。\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_59_1.png)\n\n# 写入文件\n\n步骤 5：为了扩展这段代码，你可以使用\
    \ `'a'`（即访问或追加模式）重新打开文件。这会在现有行的末尾添加任何文本，而不是创建一个新行。\n\n步骤 8：你可以将变量传递到你在 Python\
    \ 中创建的文件中。你可以从 `Math` 模块调用 Pi，创建一个新文件并将 Pi 的输出传递到新文件中：\n\n```\nt=open(\"home/pi/Documents/txt.txt\"\
    ,\"a\")\nt.write(\"n\")\n你站起来环顾四周。桌子上有一些肉和一杯水。\\n\")\n```\n\n```python\nimport\
    \ math\nprint(\"Value of Pi is: {math.pi}\")\nt.write(\"正在写入文件...\\n\")\n```\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_60_0.png)\n\n步骤 6：你可以通过以换行符（`\\n`）结尾来不断扩展文本行。完成后，使用\
    \ `close()` 结束，并在编辑器中打开文件查看结果。\n\n步骤 9：现在让我们创建一个变量 `pi` 并给它赋值 Pi 的值：\n\n```\n\
    t.write(\"大门是由实心橡木制成的，上面有铁条。它是从外面建造的，将你锁在里面。你是一个囚犯！\\n\")\nt.close()\n```\n\n\
    pi=math.pi\n你还需要创建一个新文件并写入 Pi：\n`t(\"home/pi/Documents/pi.txt\",\"w\")`\n记得将你的文件路径更改为你的系统设置。\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_60_1.png)\n\n步骤 7：在使用 `open()` 函数时，有多种文件访问类型可以考虑。每种模式都取决于光标的时间和位置。例如，`r`\
    \ 以读取模式打开文件并在文件开始处写入。\n\n步骤 10：最后，使用字符串格式化来调用变量并写入文件，然后提交更改并关闭文件：\n\n```\nt.write(\"\
    Value of Pi is: {pi}\")\nt.close()\n```\n\n你可以看到你能够传递任何变量的结果。\n\n![](img/ba40fbc39febe9db9a35785516d323a7_60_2.png)\n\
    \n# 异常\n\n在编写代码时，你不可避免会遇到一些无法控制的问题。假设你要求用户除以两个数，而他们尝试除以零。这将导致错误并破坏你的代码。\n\n##\
    \ 对象\n\nPython 并没有停止代码流，而是包含了异常对象，通过捕获可能发生异常的情况来处理错误。\n\n- **步骤 1** 你只需通过尝试将一个数除以零即可创建一个异常。如截图所示，会显示\
    \ `ZeroDivisionError: Division by zero`。`ZeroDivisionError` 部分是异常的一种（异常有很多种类）。\n\
    \n- **步骤 2** 当 Python 遇到代码中固有的问题时，大多数异常会自动抛出。然而，你可以创建自己的异常，设计用于包含潜在错误并做出反应，而不是让代码失败。\n\
    \n```python\ntry:\n    a=1\n    b=0\n    print(a/b)\nexcept ZeroDivisionError:\n\
    \    print(\"Division by zero\")\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_61_0)\n\
    \n- **步骤 3** 你可以使用 `raise` 函数在 Python 中创建我们自己的错误处理。假设你的代码逻辑过于复杂导致结果无法退出，你可以创建一个自定义异常。\n\
    \n```python\nraise Exception(\"warp core\")\n```\nPython 3.4.2 (Default)\nTypeError:\
    \ 'int' object is not callable\nTraceback (most recent call last):\n  File \"\
    input\", line 1, in <module>\nZeroDivisionError: division by zero\n\n- **步骤 4**\
    \ 为了捕获代码中的任何错误，可以将潜在错误封装在一个块中：此块由 `try` 和 `except` 组成，代码位于其中；如果发生异常，则执行某些操作。\n\
    \n```python\ntry:\n    # 在此处插入操作\nexcept Exception:\n    # 如果发生了另一个异常，执行此操作\n\
    else:\n    # 如果没有异常，执行此操作\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_61_1.png)\n\
    \n#  5\n\n例如，使用除以零。你可以通过捕获异常来处理这个问题：\n\n```python\ntry:\n    a=int(\"输入第一个数字:\
    \ \")\n    b=int(\"输入第二个数字: \")\n    print(a/b)\nexcept ZeroDivisionError:\n \
    \   print(\"你尝试除以零！\")\nelse:\n    print(\"你没有除以零！\")\n```\n\n# 步骤8\n\n当然，你可以通过将\
    \ `r` 只读更改为 `w` 来快速解决此问题。正如你所知，在这种情况下：\n\n```python\ntry:\n    f = open(\"testfile.txt\"\
    , \"w\")\n    f.write(\"写入信息\")\n    f.close()\nexcept Exception as e:\n    print(\"\
    错误:\", e)\n\ntry:\n    f = open(\"testfile.txt\", \"r\")\n    # 读取内容...\n```\n\
    \n# 步骤6\n\n你可以使用异常来处理各种实用任务。使用我们之前教程中的示例，让我们打开文件并写入内容：\n\n```python\ntry:\n  \
    \  txt = open(\"/home/pi/Documents/testfile.txt\", \"w\")\n    txt.write(\"这是。服务将很快恢复！\"\
    )\nexcept IOError:\n    print(\"错误：无法写入文件。请检查权限\")\nelse:\n    print(\"内容写入成功。祝你今天愉快。\"\
    )\n    txt.close()\n```\n\n# 步骤9\n\n你还可以使用 `finally:` 块，它的工作方式相似，但你也可以用它来。我们的示例来自：\n\
    \n```python\ntry:\n    txt = open(\"/home/pi/Documents/testfile.txt\", \"r\")\n\
    \    txt.write(\"这是测试。服务将很快恢复！\")\nexcept IOError:\n    print(\"错误：无法写入文件\")\n\
    finally:\n    print(\"内容写入成功。祝你今天愉快。\")\n    txt.close()\n```\n\n# 步骤10\n\n显然，由于\
    \ `testfile.txt` 以只读模式打开（`r` 部分），这无法运行。因此，当 Python 提示你做错了事时，你使用了 `IOError` 类创建异常，告知你权限被拒绝：\n\
    \n一旦你使用了 `r` 只读权限，错误就会发生。如果你将其更改为 `w`，代码将执行而不会在 IDLE Shell 中显示错误。不而喻之，当你掌握它时，这可能是一个棘手的异常。练习吧。\n\
    \n"
