    # # Using Comments


    While comments may seem like a minor element to the many lines of code to make
    a game, or even an entire operating system, in actual fact they''re probably one
    of the most important factors.


    # ## THE IMPORTANCE OF COMMENTING


    Comments inside code are basically human readable descriptions that detail what
    the code is doing at that particular point. They don''t especially important but
    without comments it is one of many frustrating areas of code unless you''re a
    professional or just starting out.


    In short, code should be commented in a manner as to effectively describe the
    purpose of a line, section, or individual elements. You should get into the habit
    of commenting as much as possible so someone who doesn''t know anything about
    programming can understand what it''s going by by reading your comments.


    In a professional environment, comments are vital to the success of code and ultimately,
    the company. In an organization, many programmers work in large teams, other developers,
    hardware analysts and so on. If you''re part of the team that''s writing software,
    your comments help a little team to succeed and another team member has to pick
    up and follow the trail to pinpoint the issue.


    Place yourself in the shoes of someone else who is to understand what''s wrong
    with your program. A program has excess of 800,000 lines of code, so spread across
    different modules. You might see the need for a little help from the original
    programmers in the form of a good comment.


    The best comments are those that link the code, detailing what happens when the
    program hits this line or section. You don''t need to comment on every line. Something
    along the lines of if=0 doesn''t require you to comment that if x equals zero
    then doing something; that''s going to be obvious to others


    The reader. However, if equaling zero is something that changes the program for
    the user, such as if they''ve run out of lives, it certainly needs to be commented.


    Even if you write comments as if you were only going to share it with others,
    this way you can return and always understand what you did or where you went wrong
    and what worked brilliantly.


