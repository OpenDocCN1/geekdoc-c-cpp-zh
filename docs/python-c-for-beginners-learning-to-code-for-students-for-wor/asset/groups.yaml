    words = [w.strip() for w in words]

    print("n-")

    for i in range(int(nds)):

    print(random.choice(words))

    print("n-")

    ```


    # STEP 8


    You can select a random number from a range in steps, using the start, stop, step
    loop:


    import random


    ```

    for i in range(10):

    print(random.randrange(0, 200, 7))

    ```


    Results will give you a general idea of how it works.


