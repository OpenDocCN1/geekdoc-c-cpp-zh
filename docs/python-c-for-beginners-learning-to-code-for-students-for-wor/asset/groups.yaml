    ## Getting Started with Python


    ![](img/ba40fbc39febe9db9a35785516d323a7_19_0.png)


    ## Getting Started with Python


    Getting started with Python may seem a little daunting at first but the language
    has been designed with simplicity in mind. Like most things, you need to start
    slowly and learn how to get a result and how to get what you want from the code.


    In this section, we cover the core concepts: saving and executing your code, variables,
    numbers and expressions, user input, conditions and loops.


    - 22 Starting Python for the First Time

    - 24 Your First Code

    - 26 Saving and Executing Your Code

    - 28 Executing Code from the Command Line

    - 30 Numbers and Expressions

    - 32 Using Comments

    - 34 Working with Variables

    - 36 User Input

    - 38 Creating Functions

    - 40 Conditions and Loops

    - 42 Python Modules


    > “The purpose of software engineering is to control complexity, not to create
    it.”

    – Pamela Zave (Developer, scientist and telecommunications expert)


    ## Starting Python for the First Time


    As previously mentioned we''re using Raspberry Pi as our Python hardware platform.
    The latest version of Raspian comes preinstalled with Python 3 (version 3.4.2);
    so as long as you have a version 3 Shell, all our code will work.


    ## STARTING PYTHON


    We won''t go into the details of getting the Raspberry Pi up and running, there''s
    plenty of material already available on that subject. However once you''re ready,
    fire up your PI and get ready for coding.


    - STEP 1: With the Raspberry desktop loaded, click on the Menu button followed
    by Programming > Python 3 (IDLE). This will open the Python 3 Shell. Windows and
    Mac users can find the Python 3 Shell from the Windows menu or via Finder.


    - STEP 3: For example, in the shell: 2+2. After pressing enter, the next line
    will display the answer: 4. Basically, Python has taken the ''code'' and produced
    the relevant output.


    ![](img/ba40fbc39febe9db9a35785516d323a7_21_0.png)


    ```python

    Python 3.4.2

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    >>> type(''copyright'', ''credits'' or ''license'') for more information.

    >>> 2+2

    4

    ```


    - STEP 2: The Shell is where you can enter code and see the responses and output
    of code you''ve programmed into Python. This is a kind of sandbox, where you are
    able to try some simple code and processes.


    - STEP 4: The Shell acts very much like a calculator, since code is a series of
    mathematical interactions with them. Integers, which are the infinite sequence
    of numbers can easily be added, subtracted, multiplied and divided by.


    ```python

    Python 3.4.2

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    >>> type(''copyright'', ''credits'' or ''license'') for more information.

    >>> 2+2

    4

    >>> 2345*64522

    1513526894390

    >>> 12345-12343

    2

    >>> 7762899*4024

    36879333976

    >>> 5004728380

    ```


    ## Starting Python for the First Time


    STEP 5: While it''s very interesting, it''s not particularly exciting. Instead,
    try this:


    ```python

    print("Hello everyone!")

    ```


    Enter it into the IDLE as you did in the previous steps.


    ![](img/ba40fbc39febe9db9a35785516d323a7_22_0.png)


    STEP 8: The Python IDLE is a configurable environment, if you don''t like the
    colours represented, you can then change them via Options > Configure and clicking
    on the Highlighting tab. We recommend that you''re not seeing the same as we do.


    STEP 6: This is a little more like it, since you''ve just produced your first
    bit of code. The command is fairly self-explanatory, but it requires the brackets
    as well as quotes to output to the screen.


    ```python

    >>> print("Hello everyone!")

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_22_1.png)


    STEP 9: Just like most programs, regardless of the operating system, there are
    numerous shortcuts. We don''t have room for all here but within Options > Configure
    and under the Keys tab, you can see one of the current bindings.


    STEP 7: You may have noticed the coding within the Python IDLE. The colours represent
    different elements of code. They are:


    ## IDLE Coding


    | Black | Use | Examples |

    | :--- | :--- | :--- |

    | Green | Data & variables | 23 area |

    | Purple | Strings | "Hello World" |

    | Orange | Keywords | if for else |

    | Blue | User functions | get_area() |

    | Red | Comments | #Variable |

    | Light red | Error messages | SyntaxError: |


    STEP 10: The Python IDLE is a power interface, and one that''s actually written
    in Python so if you want to know the many ins and outs for the Shell, we recommend
    you take a few moments to view www.python.com/idle.html, which details many of


    ## Your First Code


    Essentially, you''ve already written your first piece of code with the ''print(Hello
    everyone!)'' function from the previous tutorial, let''s expand and look at entering
    your own code and playing around with some Python examples.


    ## PLAYING WITH PYTHON


    With most languages, computer or human, it''s all about remembering and applying
    the right words to the right situation. You''re not born knowing those words so
    you need to learn them.


    - If you''ve closed Python 3 IDLE, reopen it in Shell, whichever operating system
    prefer. It''s all like following:


    ```python

    print("Hello")

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_23_0.png)


    - STEP 3: You can see that instead of the number 4, the output is the 2+2 you
    asked to be printed to the screen. The quotation marks are defining what is being
    outputted to the IDLE Shell; to print the total of 2+2 you need to remove


    ```python

    print(2+2)

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_23_1.png)


    - STEP 2: Just as predicted, the word Hello appears in the Shell as blue text,
    indicating output from a string. It''s fairly straightforward and doesn''t require
    too much explanation. Now try:


    ```python

    print("2+2")

    ```


    - STEP 4: You can continue as such, printing 2+2, 464+2343 and so on to the Shell.
    An easy way is to use a variable, which is something we will cover in more depth
    later. For now, enter:


    ![](img/ba40fbc39febe9db9a35785516d323a7_23_2.png)


    ## Your First Code


    STEP 5: What you have done here is assigning the letters a and b to values: 2
    and 2. These are now variables, which can be called upon Python to output, add,
    subtract, and so on for long as they stay in the memory.


    STEP 8: Let''s add a surname


    ```python

    print(a)

    print(b)

    surname="Hayward"

    print(surname)

    ```


    You have two variables a first name and a surname you can print them independently.


    ```python

    Python 3.4.2 Shell

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    >>> type(''copyright'', ''credits'' or ''license'') for more information.

    >>> a=2

    >>> b=2

    >>> print(a)

    2

    >>> print(b)

    2

    >>> surname="Hayward"

    >>> print(surname)

    Hayward

    ```


    STEP 6: The output of the last displays the values of a and b, individually. If
    you want to add them up, you can use:


    ```python

    print(a+b)

    ```


    This code simply takes the values of a and b, adds them and outputs the result.


    ```python

    print(a+b)

    ```


    STEP 7: You can play with different kinds of variables and the print function.
    For example, you could assign variables for your surname:


    ```python

    name="David"

    print(name)

    ```


    STEP 10: You can separate the two variables with a space, a comma:


    ```python

    name="David"

    print(name)


    print(name, surname)

    ```


    Alternatively, you can add the space yourselves:


    ```python

    print(name+" "+surname)

    ```


    The use of the comma makes it neater, as you see. Congratulations, you''ve just
    taken your first steps into the world of Python.

