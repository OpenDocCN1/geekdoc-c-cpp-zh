    can also be a comma, a hyphen or whatever you feel like:


    ```

    colors=["Red","Green","Blue"]

    col=",".join(colors)

    print(col)

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_52_0.png)


    - STEP 6 You can thereafter use .join() to the separated name you made in Step
    4, combining the letters again to name:


    name="".join(name)

    # You''ve joined the string back together, and returned the listed name through
    the join function.


    - STEP 9 There''s some interesting functions you can apply to a string, such as
    .capitalize() and .title(). For example:


    ```

    title="con the cimmerian"

    title.capitalize()

    title.title()

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_52_1.png)


