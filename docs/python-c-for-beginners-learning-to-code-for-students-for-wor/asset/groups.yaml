    # Formatting Strings


    When working with data, creating lists and objects you may often want to print
    out your results. Formatting strings with data is easily done with Python 3, as
    earlier versions tended to complicate matters.


    ## FORMATTING


    Since Python 3, string formatting has become a much neater process, using the
    .format() function with curly brackets. It''s a better approach than previous
    versions.


    ### STEP 1

    The basic formatting in Python is to call each variable into the string using
    curly brackets:


    ```

    name="Conan"

    print("the barbarian hero of Age is {}".format(name))

    ```


    ### STEP 2

    Remember to use the .format() function with two sets of brackets, as you include
    the variable in one, and print after. You can include multiple cases of string
    formatting in a single function:


    ```

    name="Conan"

    place="Cimmeria"

    print("hailed from the North land known as {}".format(name, place))

    ```


    ### STEP 3

    You can also include integers into the mix:


    ```

    number=10000

    print("{} {} was a mercenary, and thief once stole gold from a merchant.".format(name,
    number))

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_53_0.png)


    - STEP 5

    Interestingly you can reference a list using the string formatting function. You
    can also place an asterisk in front of the name:


    ![](img/ba40fbc39febe9db9a35785516d323a7_54_0.png)


    - STEP 8

    You can print out the content of a user''s input in the same fashion:


    ```

    name=input("''s your name?")

    print("Hello, {}".format(name))

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_54_1.png)


    - STEP 6

    With indexing in lists, the same applies to using string formatting. You can index
    each item by its position (from 0 to however many are present):


    ```

    numbers=[1, 4, 7]

    print("More numbers: {}, {}, {}".format(*numbers))

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_54_2.png)


    - STEP 9

    You can extend this simple code example to display the first list in a person''s
    entry:


    ```

    name=input("What''s your name?")

    print("Hello, {}".format(name))

    print("The first list of your name is a {}")

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_54_3.png)


    - STEP 7

    And as you suspect, you can mix strings and integers in a list to be called with
    the .format() function:


    ```

    characters=["Conan", "Belit", "Valeria", 19, 27, 20]

    print("{} is {} years old. Whereas {} is {} years old.".format(*characters))

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_54_4.png)


    - STEP 10

    You can call upon a pair of lists and reference them individually within the same
    print function. Looking back the code from Step 7, you can alter it with:


    ```

    names=["Conan", "Belit", "Valeria"]

    ages=[25, 21, 20]

    Creating lists. Now you can call each list, and individual items:

    print("{0[0]} is {1[0]} years old. Whereas {0[1]} is {1[1]} years old.".format(names,
    ages))

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_54_5.png)


    # Date and Time


    When working with data it often has access to the time. For example, you may want
    to time-stamp an entry or see at what time you logged into the system and for
    how long. Lucidly acquiring the date and time is easy, thanks to the Time module.


    ## TIME


    The Time module contains functions that help you retrieve the current system time,
    reads the date from strings, formats the time and date and more.


    - STEP 1

    If you need to import the Time module. It''s built-in to Python 3 so you don''t
    need to drop into a command prompt and install it. Once it''s imported, you can
    call the current date and time with a simple command:


    ```

    import time

    time.asctime()

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_55_0.png)


    - STEP 3

    You can see the structure of how time is presented by:


    ```

    time.local()

    The output is displayed as: *time_struct_tm(tm_year=2017, tm_mon=9, tm_day=7,
    tm_hour=9, tm_min=6, tm_sec=13, tm_wday=3, tm_yday=250, is_dst=0); obviously dependent
    on your current time as opposed to the time it was written.

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_55_1.png)


    - STEP 2

    The function is split into nine tuples, which are divided into indexed tuples,
    as with any other tuple, and shown in the screenshot below.


    - STEP 4

    There are numerous functions built into the Time module. One of the most common
    is .strftime(). With it, you''ll be able to present a wide range of arguments
    as it converts the time tuple into a string. For example, to display the current
    day of the week you can use:


    | Index | Field | Values |

    |---|---|---|

    | 0 | 4-digit year | 2016 |

    | 1 | Month | 1 to 12 |

    | 2 | Day | 1 to 31 |

    | 3 | Hour | 0 to 23 |

    | 4 | Minute | 0 to 59 |

    | 5 | Second | 0 to 61 (60 is leap seconds) |

    | 6 | Day of Week | 0 to 6 (0 is Monday) |

    | 7 | Day of year | 1 to 366 (Julian day) |

    | 8 | Daylight savings | -1, 0, 1, -1 means library defines DST |


