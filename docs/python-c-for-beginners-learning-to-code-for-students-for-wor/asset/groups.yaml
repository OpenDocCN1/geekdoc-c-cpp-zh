    \ . Framework 构建 Windows Forms 和控制台应用程序 | |\n| **ASP.NET Web开发** | 使用 ASP.NET\
    \ Core、HTML 和 C# 构建可扩展的 Web 应用程序 | |\n| **Azure 开发** | 构建并管理云应用资源 | |\n| **Node.js\
    \ 开发** | 使用 Node.js 异步事件驱动运行时构建可扩展的网络应用程序 | |\n| **数据存储和处理** | 使用 SQL、Azure Lake\
    \ 或 Azure ML 开发并测试解决方案 | |\n\n## 桌面开发\n\n- C++ 2017 工具集 (x86, x64)\n- C++ 分析工具\n\
    - Windows SDK (10.0.14763.0)\n- 用于移动的 C++\n- 通用平台工具集\n- 用于 Windows 的 C++\n- MFC\
    \ 和 ATL\n- C++ CMake 支持\n- 标准库\n\nVisual Studio 是一个学习 C++ 的**免费环境**。\n\n![](img/ba40fbc39febe9db9a35785516d323a7_86_0.png)\n\
