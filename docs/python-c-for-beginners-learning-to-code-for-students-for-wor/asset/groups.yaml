    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_51_1.png)


    # Splitting and Joining Strings


    - STEP 5 The opposite of .split is join, where you will have separate items in
    a string and can join them all together to a word or just a combination of items,
    depending on your requirement. For instance:


    ```

    alphabet="".join(["a","b","c","d","e"])

