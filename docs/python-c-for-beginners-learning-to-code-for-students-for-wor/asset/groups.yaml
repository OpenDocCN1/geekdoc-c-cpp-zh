    - 在哪里？\n\n## 常见编码错误\n\n当你开始学习新事物时，不可避免会犯错，这完全是因为缺乏经验，而这些错误是很好的老师。然而，即使是专家也会偶尔出错。关键是尽可能从中学习。\n\
    \n从这些基础的、常见的错误中学习有助于建立更好的基础。小块\n\n## 变量\n\n有意义的命名是消除编码错误的关键。使用字母表虽然可以，但当代码指出 `player1`\
    \ 等变量有问题时怎么办？\n\n```\nvar points = 102;\nvar lives = 5;\nvar totalTime = 45;\n\
    write(\"Points: \" + points);\nwrite(\"Lives: \" + lives);\nwrite(\"Total Time:\
    \ \" + totalTime);\nwrite(\"Score: \" + points);\nwrite(\"Your Score: \" + points);\n\
    ```\n\n## 注释\n\n使用注释。这是一个简单的概念，但注释代码可以节省很多问题。插入注释有助于你快速筛选导致问题的代码行；同时也使用它们来审查旧代码。\n\
    \n```cpp\n// int x = 2;\ntarget = 2;\n\n#endif\nif (n != 0) {\n    return;\n}\n\
    // 循环展开，这里是 ...\nif (n - (-3)) 是 while 循环中 4 的最大倍数，将移动\n// 结束标记我们的常量防止溢出\nchar\
    \ const x = orig + 2 * (n - 4);\n\n// 查看我们是否在写 64 位\nif (sizeof(long) == 8) {\n\
    }\nif (__defined(__amd64)) // 定义\n```\n\n## 提前计划\n\n虽然在一个早上决定写一个经典的文本示例是很棒的，但如果没有良好的计划，并不总是可行。代码片段不需要太多的规划就可以编写，但长期、深入的规划需要一个良好的工作计划来遵循并修复\
    \ Bug。\n\n![](img/ba40fbc39febe9db9a35785516d23a7_139_0.png)\n\n## 用户错误\n\n用户输入往往是代码中的一个致命错误。例如，用户应该输入他们的年龄并按顺序输入。通常用户向输入输入大量内容导致内部缓冲区溢出，从而导致代码崩溃。观察这些用户并明确说明他们需要什么。\n\
