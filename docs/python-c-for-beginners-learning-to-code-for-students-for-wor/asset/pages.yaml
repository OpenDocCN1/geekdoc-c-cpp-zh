  md: '# GOING MOBILE


    The mobile market is a great place to test your coding skills and present any
    games or apps you have created. If your app is good, then who knows, it could
    be the next great thing to appear on the app stores a shared learning experience
    nevertheless, and nothing worth considering.


    # PORTFOLIOS


    If you''ve learned how to code with an eye for a developer job in the future,
    it''s worth starting to build up an online portfolio of code. Look at job postings
    and see what skills require, then learn and code something with those skills and
    add it to your portfolio. When it comes to applying, include a link to the portfolio.


    ![](img/ba40fbc39febe9db9a35785516d323a7_146_0.png)


    # My Work


    Want to see more examples? Email me.


    # Chronicle.org


    Chronicle.org is a news site that uses open source software to provide transparency,
    quality, and accessibility to its readers. Learn how open source software can
    help you design a new page for your project.


    ![](img/ba40fbc39febe9db9a35785516d323a7_146_1.png)


    # ONLINE LEARNING


    Online courses are good examples of how to take your coding skills next, even
    if you start from the beginner level again. If an online course follows a strict
    coding convention, if you''re taught it then it might be worth seeing how others
    develop your code, and what''s considered acceptable.


    ![](img/ba40fbc39febe9db9a35785516d323a7_146_2.png)


    # TEACH CODE


    Can you teach? If your coding skills are spot on, consider approaching a college
    or university to see if they have need for a programming language teacher, perhaps
    part-time or even course. If not, then creating your own YouTube how code channel.


    ![](img/ba40fbc39febe9db9a35785516d323a7_146_3.png)


    # SHARE CODE


    Get sharing, even if you think your code isn''t very good. The criticism, advice
    and comments you receive back back you iron out any issues with your code, and
    you add them all to your checklist. Alternatively your code might be utterly amazing
    but yet you won''t know unless it is.


    # HARDWARE PROJECTS


    Contributing to hardware projects is a great resource for proving your code and
    learning from other communities. Many of the developer boasts has postings for
    coders to apply for hardware projects, using unique code to get the most from
    the hardware''s being designed.


    ![](img/ba40fbc39febe9db9a35785516d323a7_146_4.png)


