  md: "# # How to Set Up Python in Windows\n\nWindows users can easily install the\
    \ latest version of Python via the main Downloads page. While most seasoned Python\
    \ developers may shun Windows as the platform of choice for building their code,\
    \ it's still an ideal starting point for beginners.\n\n# ## INSTALLING PYTHON\
    \ 3.X\n\nMicrosoft Windows doesn't come with Python preinstalled as standard,\
    \ so you're going to have to install it yourself manually. Thankfully, it's an\
