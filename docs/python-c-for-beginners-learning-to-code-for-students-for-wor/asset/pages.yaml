  md: "# C++ Beginner's Mistakes\n\n# COMMENTS (AGAIN)\n\nIndeed the mistake of making\
    \ any comments on code is back once more. As we've previously bemoaned, the lack\
    \ of readable identifiers throughout the code makes it very difficult to look\
    \ back at how it works, for both you and someone else. Use more comments.\n\n\
    ```\n# comment: avoid this\nint main() {\n  int x = 0; // comment, don't do this\n\
    \  if (x != 0) {\n    printf(\"error\\n\");\n  } // comment: error return\n  int\
    \ code[] = {1,2,3}; // comment: use elements\n  reverse(code,3);\n  for (int i=0;\
    \ i<3; i++) {\n    printf(\"%d \", code[i]);\n  }\n  return 0;\n}\n```\n\n# TOO\
    \ MANY BRACES\n\nThe braces, or brackets, are beginning and ending around blocks\
    \ of code. So for every (you must have a). It's easy to include or miss one or\
    \ the other facing brace when writing code, especially when writing in a text\
    \ editor, an IDE adds them for you.\n\n```\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n  int x;\n  string myself = \"This is a string!\\n\";\n\
    \  cout << \"What's the value of x? \";\n  cin >> x;\n  cout << x;\n{\n  cout\
    \ << \"\\n\\n\";\n  cout << myself;\n}\n```\n\n# QUOTES\n\nMissing quotes is a\
    \ common mistake to make, for every level of user. Remember that you need quotes\
    \ for strings going out to the screen or into a file, for example. Most compilers\
    \ error due to missing quotes in the code.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_144_0.png)\n\
    \n# INITIALISE VARIABLES\n\nC++ variables aren't initialized to zero by default.\
    \ This means if you create a variable without it is possible to get a random number\
    \ from 0 to 18,466,744,073,709,511, which is difficult to handle in an equation.\
    \ When creating a variable, give it a value to begin with:\n\n```\n#include <iostream>\n\
    using namespace std;\nint main() {\n  int x;\n  x=0;\n  cout << x;\n}\n```\n\n\
    # EXTRA SEMICOLON\n\nWhile it's necessary to have a semicolon at the end of every\
    \ C++ line, there are exceptions to the rule. Semicolons need to be at the end\
    \ of every complete statement but some lines of code are not needed\n\n```\n#include\n\
    if lines\nswitches lines\n```\n\nIf it sounds doesn't worry, the compiler will\
    \ tell you where you went.\n\n```\n// Program to print positive number entered\
    \ by the user\n#include <iostream>\nint main() {\n  int number;\n  cout << \"\
    Enter an integer: \";\n  // checks if the number is positive\n  if (number > 0)\
    \ {\n    cout << number << \" entered a positive integer: \" << number << \"\\\
    n\";\n  }\n  cout << \"This statement is always correct.\\n\";\n  return 0;\n\
    }\n```\n\n# A.OUT\n\nA common mistake when compiling in Linux is forgetting to\
    \ name your C++ code post compiling. When you compile from the Terminal, it creates\
    \ an a.out by default.\n\n```\ng++ code.cpp\nThis compiles the file code.cpp and\
    \ create an a.out file that can be executed with ./a.out. If you already have\
    \ code in a.out then use it:\ng++ code.cpp -o nameofprogram\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_144_1.png)\n\
    \n```\nFile Edit View Search Terminal Help\ndavidmind-date- $ g++ test1.cpp -o\
    \ printzer\ndavidmind-date- $ ./printzer\n1. -Documents /a.out\ndavidmind-date-\
    \ $ ./test1.n\ndavidmind-date- $ \n```\n\nwww.bdummies.com Python & C++ for Beginners\
