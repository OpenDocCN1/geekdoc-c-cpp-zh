  md: "# STEP 5\n\nIf you want to add up input numbers until the user enters zero:\n\
    \n```\nfloat sum = 0.0;\ncout << \"**** Program to execute a Do-while loop continuously****\"\
    \ << endl;\n\ncout << \"\\nEnter 0 to stop and display the sum of all the numbers\
    \ entered\\n\"\" << endl;\ncout << \"\\n--\\n\" << endl;\ndo {\n    cout << \"\
    nPlease enter a number: \";\n    cin >> number;\n    sum += number;\n} while(number\
    \ != 0.0);\ncout << \"Total sum of all numbers: \" << sum << endl;\n```\n\n# STEP\
    \ 8\n\nFinally, the statement checks the condition of the variable number. If\
    \ the user enters zero, the loop terminates; if not it continues indefinitely.\
    \ When the user finally enters zero, the value of all the user's input is displayed.\
    \ The loop, then\n\n![](img/ba40fbc39febe9db9a35785516d323a7_132_0.png)\n\nUsing\
    \ the countdown and Blast Off! code used previously, a do... while loop would\
    \ look like:\n\n```\nint a = 10;\ndo {\n    cout << a << endl;\n    a -= 1;\n\
    } while (a != 0);\n```\n\n```\ncout << \"Blast Off!\" << endl;\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_132_1.png)\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_132_2.png)\n\n# STEP 6\n\nThe code\
    \ from Step 5 works as follows: first floating point variables are assigned, initialized\
    \ with the value of 0.0. There is a brief set of instructions for the user, then\
    \ the do... while loop begins.\n\n```\nfloat sum = 0.0;\ncout << \"**** Program\
    \ to execute a Do-while loop continuously****\" << endl;\ncout << \"\\nEnter 0\
    \ to stop and display the sum of all the numbers entered\\n\"\" << endl;\ncout\
    \ << \"\\n--\\n\" << endl;\n```\n\n# STEP 7\n\nThe do... while loop asks the user\
    \ to input a number, which is added to the variable. The calculation uses the\
    \ second floating point variable, which adds of value every time the user enters\
    \ a new value.\n\n```\ndo {\n    cout << \"\\nPlease enter a number: \";\n   \
    \ cin >> number;\n    sum += number;\n}\n```\n\n# STEP 10\n\nThe main advantage\
    \ of a do... while loop is that it is an entry-control loop; however, if you require\
    \ a loop needs to be executed at least once (for example, to count the number\
    \ of levels in a game), a do... while loop is perfect.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_132_3.png)"
