  md: "# For Loop\n\nIn some respects, a for works in a very similar way to that of\
    \ a while loop, although it's structure is different. A loop is split into three\
    \ stages: an initialiser, a condition and an incremental step. Once set up, the\
    \ loop repeats itself until the condition becomes false.\n\n# LOOPY LOOPS\n\n\
    The initialise stage of a for loop is executed only once and sets the point reference\
    \ for the loop. The condition is evaluated by the loop to see if it's true or\
    \ false and then the increment: the loop executes the second and third stage.\n\
    \n+   STEP 1 Create a new C++ file, with the standard headers:\n\n```\n#include\
    \ <iostream>\nusing namespace std;\nint main() {\n\n}\n```\n\n+   STEP 4 After\
    \ the loop, you created a compound statement in braces (curly brackets), that\
    \ displays the integer num. Every time the loop repeats itself, the second and\
    \ third stages of the loop, it adds 1 until the condition <30 is false. The loop\
    \ ends and the code continues, ending nearly with return 0.\n\n```\n// Loop Begins\n\
    for (int num = 1; num < 30; num = num + 1) {\n\tcout << \"Number: \" << num <<\
    \ endl;\n\n\treturn 0;\n}\n```\n\n+   STEP 2 Start simple and create a loop that\
    \ counts from 1 to 30, displaying the value to the screen with each increment:\n\
    \n```\n// Loop Begins\nfor(int num = 1; num < 30; num = num + 1) {\n\tcout <<\
    \ \"Number: \" << num << endl;\n\n\treturn 0;\n}\n```\n\n+   STEP 5 A for loop\
    \ is quite a neat package in C++, all within within its brackets, while the other\
    \ elements of the loop are displayed below. If you want to create a 10-second\
    \ condition, you could use:\n\n```\n#include <iostream>\n#include <windows.h>\n\
    using namespace std;\nint main ()\n```\n\n+   STEP 3 Working through the process\
    \ of the for loop, by creating an integer counter and assigning it a value of\
    \ 1. Set the condition, in this case a num being less than 30. The last stage\
    \ is where the loop increments; here it increments the value of num by 1.\n\n\
    ```\n// Loop Begins\nfor(int a = 10; a != 0; a = a - 1) {\n\tcout << a << endl;\n\
    \tSleep(1000);\n}\n```\n\n```\n// Loop Begins\nfor(int num = 1; num < 30; num\
    \ = num + 1)\n```\n\n```\ncout << \"\\nBlast Off!\" << endl;\nreturn 0;\n```"
