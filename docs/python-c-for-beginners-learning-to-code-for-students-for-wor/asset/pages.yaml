  md: "# Say Hello to C++\n\n# # Why C++?\n\nC++ is one of the most popular programming\
    \ languages available today.  Originally called C with Classes, the language was\
    \ renamed C++ in 1983. It's an extension of the original C language and is a general\
    \ purpose object-oriented OOP environment.\n\n# ## EVERYTHING\n\nDue to how complex\
    \ the language can be, and its power and performance, C++ is often used to develop\
    \ games, programs, device drivers and even operating systems.\n\nDating back to\
    \ 1977, the start of the era of home computing, C++, or with Classes was the brainchild\
    \ of Danish scientist Bjarne Stroustrup while working on his PhD thesis. Stroustrup's\
    \ goal was to further the original C language, which was widely used since the\
    \ early seventies.\n\ncomputing labs and by regular people who didn't have access\
    \ to the Internet, applications, games and even operating systems, such as Photoshop,\
    \ InDesign and so are developed in C++. You will find that the browser you use\
    \ is written in C++, as well as Windows 10, Microsoft Office and the backbone\
    \ to Google's search engine. Apple macOS is written largely in C++ (with some\n\
    \nC++ proved to be popular among the developers of the '80s, since it was a much\
    \ easier environment to get grips with and more importantly, it was 99% compatible\
    \ with the original C language. It meant that it could be used beyond the mainstream\n\
    \n+   - C++ code is much faster than Python.\n\n```\n#include<iostream>\nusing\
    \ namespace std;\nvoid main() {\n    char char;\n    cout<<\"Enter a character\
    \ to check if it is vowel or not\";\n    switch (char) {\n        case 'a': case\
    \ 'A':\n            cout<<\"is a Vowel\";\n            break;\n        case 'e':\
    \ case 'E':\n            cout<<\"is a Vowel\";\n            break;\n        case\
    \ 'i': case 'I':\n            cout<<\"is a Vowel\";\n            break;\n    \
    \    case 'o': case 'O':\n            cout<<\"is a Vowel\";\n            break;\n\
    \        case 'u': case 'U':\n            cout<<\"is a Vowel\";\n            break;\n\
    \    }\n}\n```\n\n84 BDM's Definitive Guide Series - Volume 33"
