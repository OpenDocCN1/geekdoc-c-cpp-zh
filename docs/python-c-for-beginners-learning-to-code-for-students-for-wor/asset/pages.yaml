    # STEP 8


    What you''ve created is a condition, which will soon cover. In short, we''re using
    the input and measuring it against a condition. So, if the user enters David as
    their name, the guard will allow them to pass unharmedish. Else, if they enter
    another name than David, the guard challenges them to a fight.


    ![](img/ba40fbc39febe9db9a35785516d323a7_36_1.png)


    # STEP 6


    The code from the previous step is often regarded as being a little better than
    having a length in the input command, but it''s not a rule that''s set in stone,
    so do as you like in these situations. Expanding on the code, try this:


    ```

    print("Wait! Who goes there?")

    name=input()

    ```


    # STEP 9


    Just as you learned previously, any input from a user is automatically a string,
    so you need to Typecast or turn it into something. This creates interesting additions
    to the input command. For example:


    # To calculate rate and distance


    ```

    print("A rate and a distance")

    rate=float(input("Rate: "))

    ```


