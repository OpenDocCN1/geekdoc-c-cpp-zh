  md: "# # Exceptions\n\nWhen coding, you'll naturally come across some issues that\
    \ are out of your control. Let's assume you ask a user to divide two numbers and\
    \ they try to divide by zero. This will will create an error and break your code.\n\
    \n# ## EXCEPTIONAL OBJECTS\n\nRather than stop the flow of your code, Python includes\
    \ exception objects which handle unexpected errors in the code. You can combat\
    \ errors by catching conditions where exceptions may occur.\n\n+   **STEP 1**\
    \ You can create an exception by simply trying to divide a number by zero. With\
    \ the ZeroDivisionError: Division by zero message, as seen in the screenshot.\
    \ The ZeroDivisionError part is the exception class, of which there are many.\n\
    \n+   **STEP 3** You can use the functions raise to create our own error handling\
    \ code within Python. Let's assume your code is warping around the cosmos, too\
    \ much results exiting to a warp core supernova, you can create a custom exception.\n\
    \n```\nraise:Exception(\"warp core breach\")\n```python\nPython 3.4.2 (Default,\
    \ Oct 19 2014, 13:31:17)\nTypeError: 'int' object is not callable\nTraceback (most\
    \ recent call last):\n  File \"input\", line 1, in <module>\nZeroDivisionError:\
    \ division by zero\n```\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_61_0.png)\n\
    \n+   **STEP 2** Most exceptions are raised automatically when Python comes from\
    \ something that's inherently with the code. However you can create your own exceptions\
    \ that are designed to contain the potential error and react to it, as opposed\
    \ to letting the code fail.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_61_1.png)\n\
    \n+   **STEP 4** To trap any errors in the code you can encase the potential error\
    \ within a block: this block consists of try, except, where the code is held within;\
    \ then if there's an exception do something, do something else.\n\n```\n```python\n\
    try:\n    Insert your operations here -->\n    if error == an exception do this\
    \ -->\n        # Exception\n    if there is another exception do this -->\n  \
    \      # Exception\nelse:\n    if there is no exception, then do this -->\n```\n\
    ```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_61_2.png)"
