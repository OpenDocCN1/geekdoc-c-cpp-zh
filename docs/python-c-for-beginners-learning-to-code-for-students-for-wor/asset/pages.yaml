  md: "# C++ Fundamentals\n\n# C++ Maths\n\nProgramming is mathematical in nature\
    \ and as you might expect, there's plenty of built-in scope for some intense maths.\
    \ C++ has a lot to offer someone who's implementing mathematical models into their\
    \ code. It can be extremely complex or relatively simple.\n\n# C++ = MC²\n\nThe\
    \ basic mathematical operations apply in C++ as they do in most other programming\
    \ languages. However, by using the C++ Math Library, you can also calculate square\
    \ roots, powers, trig and more.\n\n+   STEP 1 C++s mathematical operations follow\
    \ the same patterns as taught in school, in that multiplication and division take\
    \ precedence over addition and subtraction. You can also alter that. For now,\
    \ create a new file and enter:\n\n```\n#include <iostream>\nusing namespace std;\n\
    int main () {\n    float numbers = 100;\n    numbers = numbers + 10; // This adds\
    \ 10 to the initial\n    cout << \"\\n\";\n    numbers = numbers - 10; // This\
    \ subtracts 10 from the new\n    cout << \"\\n\";\n}\n```\n\n+   STEP 3 Multiplication\
    \ and division can be applied as such:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n    float numbers = 100;\n    numbers = numbers * 10; //\
    \ This multiplies 100 by 10\n    cout << \"\\n\";\n    numbers = numbers / 10;\
    \ // And divides 1000 by 10\n    cout << \"\\n\";\n}\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_113_0.png)\n\
    \n+   STEP 2 While, we get the old maths warmed up. We used a float because it\
    \ can easily handle an integer. If you started to use integers, you would need\
    \ to change it to a float, depending on the accuracy. Run the code and see the\
    \ results.\n\n+   STEP 4 Again, the simple code and see the results. While not\
    \ particularly interesting, it's a start in C++ maths. We used a float, so you\
    \ can play around with the code and multiply by several decimals, as well as add\
    \ and subtract.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_113_1.png)"
