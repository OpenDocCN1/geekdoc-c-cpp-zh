  md: "# Random Password Generator\n\nWe're always told that our passwords aren't\
    \ secure enough; well here's a solution for you to implement into your own future\
    \ programs. The random password generator code below will create a 12-letter string\
    \ of words (both cases) and numbers each time it is executed,\n\n# Secure Passwords\n\
    \nThere's plenty you can modify this code and improve it for further. For one,\
    \ you can increase the number of characters of the generated passwords and perhaps\
    \ include special characters and symbols. Then, you can output the chosen password\
    \ to a file, then replace the previous random password as a file and send it to\
    \ a user for their new password.\n\nAn interesting aspect of this code is to introduce\
    \ a loop and print any number of random passwords. Let's assume you have a list\
    \ of 50 users for a company and you are in charge of generating a random password\
    \ for each month.\n\n# RNDPASSWORD.PY\n\nCopy the code and run it; each time you'll\
    \ get a random string of characters that can be easily used as a secure password\
    \ which will be incredibly difficult for a password hacker to crack.\n\n```\n\
    import string\nimport random\n\ndef randompassword():\n    chars=string.ascii_uppercase\
    \ + string.ascii_lowercase + string.digits\n    size=8\n    return ''.join(random.choice(chars)\
    \ for x in range(size,20))\n\nprint(randompassword())\n```\n\nAdding a loop to\
    \ print a password fifty times is extremely easy, for example:\n\n```\nimport\
    \ string\nimport random\n\ndef randompassword():\n    chars=string.ascii_uppercase\
