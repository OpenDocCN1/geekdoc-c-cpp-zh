  md: '# Common Coding Mistakes


    When you start something new you''re inevitably going to make mistakes, this is
    purely down to inexperience and those mistakes are great teachers in themselves.
    However, even experts make the occasional mishap. Thing is, to learn from them
    as best as you can.


    # X=MISTAKE, PRINT Y


    There are many pitfalls for the programmer to be aware of, far too many to be
    listed here. Being able to recognize a mistake and fix it is when you start to
    move into more advanced territory, and become a better coder. Everyone makes mistakes,
    coders with thirty years'' experience. Learning from these basic, common mistakes
    help build a better coding foundation.


    # SMALL CHUNKS


    It would be wonderful to be able to work like Neo from The Matrix moves. Simply
    ask, your operator loads into your memory and you instantly know everything about
    the subject. Sadly we can''t do that. The major pitfalls is someone trying to
    learn too much, too quickly. So taking coding in small pieces and take your time.


    # EASY VARIABLES


    Meaningful naming for variables is a must to eliminate common coding mistakes.
    Having letters of the alphabet is fine but what when the code states the problem
    with x variable. It''s not too difficult to name lives money, player1 and so.


    ```

    var points = 1023;

    var lives = 5;

    var totalTime = 45;

    write("Points: " + points);

    nwrite("Lives: " + lives);\nwrite("Total Time: " + totalTime);\nwrite("Score:
    " + playerScore);

    write("Your Score: " + playerScore);

    ```


    # //COMMENTS


    Use comments. It''s a simple concept but commenting your code saves many problems
    when you come to next. Over inserting comments helps you quickly sift through
    lines of code that are causing problems; also use them to review an older piece
    of code.


    ```

