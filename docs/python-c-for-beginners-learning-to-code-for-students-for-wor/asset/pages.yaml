  md: "# # Working with Variables\n\nSTEP 5 However, you can't combine strings and\
    \ integer type variables in the same command, as you need to enter one into the\
    \ other or versa. When you try to combine both, you get an error message:\n\n\
    ```\nPython 3.4.2 (default. Oct 19 2014, 13:38:11)\n[GCC 4.8.0.1 Linux]\n>>> type(\"\
    credits\" or \"license\")n for more information.\n>>> name = \"Howard\"\n>>> print(name)\n\
    howard\n>>> type(name)\n<class 'str'>\n>>> character = \"Descended from Vikings\"\
    \n>>> type(character)\n<class 'str'>\n>>> age = 44\n>>> print(age + \" years\"\
    )\nTraceback (most recent call last):\n  File \"stdin\", line 1, in <module>\n\
    \    expression>\nTypeError: Can't convert 'int' to object str implicitly\n```\n\
    \nSTEP 8 This presents a bit of a problem when you want to work with a variable\
    \ that's been inputted by the user, as age + 10 will be a string instead of an\
    \ integer. In instance, you need to\n\n```\nint(age) + 10\nThis will Typecast\
    \ the age into an integer that can be worked.\n```\n\nSTEP 6 This is a process\
    \ called Typecasting. The Python code is:\n\n```\nprint (character + \" is \"\
    \ + str(age) + \" years old.\")\n```\n\nor you can use:\n\n```\nprint(character,\
    \ \"is\", age, \"years old.\")\n```\n\nNotice that in this case, you don't need\
    \ to space the words between the quotes as commas treat each argument to separate\
    \ separately.\n\n```\n>>> print (name, age)\nnPython 3.4.2 (default. Oct 19 2014,\
    \ 13:38:11)\n[GCC 4.8.0.1 Linux]\n>>> type(\"$\")\nTraceback (most recent call\
    \ last):\n  File \"stdin\", line 1, in <module>\n    expression>\nTypeError: Can't\
    \ convert 'int' to object str implicitly\n>>> David Howard = \"Descended from\
    \ Vikings\"\n>>> print(character, \"is\", age, \"years old.\")\nHoward is 44 years\
    \ old.\n>>> David Howard = \"Descended from Vikings\"\n```\n\nSTEP 9 The use of\
    \ Typecasting is also important when dealing with floating point arithmetic; remember,\
    \ for example:\n\n```\nstring-19.99\n```\n\nNow enter (shift) and yet Python will\
    \ handle the number as a 'float', because the value contains a decimal.\n\n```\n\
    Python 3.4.2 (default. Oct 19 2014, 13:38:11)\n[GCC 4.8.0.1 Linux]\n>>> type(\"\
    credits\" or \"license\")n for more information.\n>>> age = input(\"How old are\
    \ you ?\")\n44\n>>> type(age)\n<class 'str'>|\n```\n\nSTEP 7 Another example of\
    \ Typecasting is when you use input from the user, as for example,\n\n```\nenter:\n\
    age = input(\"How old are you ?\")\nAll data stored from the input command is\
    \ a string variable.\n```\n\n```\nPython 3.4.2 (default. Oct 19 2014, 13:38:11)\n\
    [GCC 4.8.0.1 Linux]\n>>> type(\"credits\" or \"license\")n for more information.\n\
    >>> How old are you ?\n44\n>>> type(age)\n<class 'str'>|\n```\n\nSTEP 10 When\
    \ combining integers and floats Python will convert the integer to a float, something\
    \ worth mentioning that Python doesn't return the exact value. When converting,\
    \ Python will always round down to the nearest integer, in instance of 19.99 it\
    \ becomes.\n\n```\nPython 3.4.2 (default. Oct 19 2014, 13:38:11)\n[GCC 4.8.0.1\
    \ Linux]\n>>> type(\"credits\" or \"license\")n for more information.\n>>> string=19.99\n\
    >>> type(string)\n<class 'float'>\n>>> int(age)|\n```"
