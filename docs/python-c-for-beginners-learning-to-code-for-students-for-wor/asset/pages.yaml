  md: "# If... Else Statement\n\nThere is a much better way to use an statement in\
    \ your code, if... else. else works in much the same way as a standard statement.\
    \ If the Boolean expression is true, the code with the braces is executed. else,\
    \ the code within the next set of braces is used instead.\n\n# IF YES, ELSE NO\n\
    \nThere are two sections of code that can be executed depending on the outcome\
    \ in an if... else statement. it's quite easy to visualise you need to use its\
    \ structure.\n\n# STEP 1\n\nBegin with a new C++ file and the standard headers:\n\
    \n```\n#include <iostream>\nusing namespace std;\n\nint main() {\n    int num\
    \ = 1;\n    if (num < 30) {\n        cout << \"The number is less than 30!\" <<\
    \ endl;\n    } else {\n        cout << \"The number is greater than 30!\" << endl;\n\
    \    }\n    return 0;\n}\n```\n\n# STEP 3\n\nThe first line in the code creates\
    \ the integer called num gives it a value of 1, If the statement checks to see\
    \ if the value of num is less than thirty and if it is outputs \"The number is\
    \ less than 30\" to the console.\n\n```\nif (num < 30) {\n    cout << \"The number\
    \ is less than 30!\" << endl;\n}\n```\n\n# STEP 2\n\nLet's expand the code from\
    \ If Statement on the previous page:\n\n```\nint num = 1;\nif (num < 30) {\n \
    \   cout << \"The number is less than 30!\" << endl;\n} else {\n    cout << \"\
    The number is greater than 30!\" << endl;\n};\n```\n\n# STEP 4\n\nThe else if\
    \ checks if the number is greater than 30 to the console, and then displays \"\
    and finally, the code is terminated satisfactorily.\n\n```\nelse {\n    cout <<\
    \ \"The number is greater than 30!\" << endl;\n}\n```\n\n# STEP 5\n\nYou can change\
    \ the value of num in the code to enter a value: you can improve the code by using\
    \ the user to\n\n```\nint num;\ncout << \"Enter a number: \"; >> num;\nif (num\
    \ < 30) {\n    cout << \"The number is less than 30!\" << endl;\n} else {\n  \
    \  cout << \"The number is greater than 30!\" << endl;\n}\nreturn 0;\n```\n\n\
