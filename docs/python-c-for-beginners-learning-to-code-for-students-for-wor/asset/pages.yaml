  md: '# # Using Comments


    When you write code, the flow, what each variable does will operate and is all
    inside your head. Another programmer could follow the code line by line but over
    time, it can become difficult to read.


    ## COMMENTS!\Programmers use a method of keeping their code readable by commenting
    on certain sections. If a variable is used, the programmer comments on what it''s
    supposed to do, for example. It''s just good practice:


    +   * STEP 1 Start by creating a new instance of the IDLE Editor (File > New File)
    and create a simple variable and print command.


    ```

    a=10

    print("The value of A is", a)

    ```


    Save the file and execute.


    +   * STEP 3 Resave the code and execute it. You can see that the output in the
    IDLE Shell is the same as before, despite the lines being added. Simply put, the
    hash symbol (#) denotes a line of text the programmer can insert to inform them,
    and others, of what''s going on without the user being aware.


    ![](img/ba40fbc39febe9db9a35785516d323a7_31_0.png)


    +   * STEP 2 Running the code will return the line: The value of A is 10 into
    the IDLE Shell window, which is what we expected. Now, add some of the comments
    you''d normally see inside:


    > # Set the value of A to 10

    a=10

    # Print the current value of A

    print("The value of A is", a)


    +   * Let''s assume that the variable A we''ve created is the number of lines
    in a game. Every time the player dies, the code is decreased by 1. The programmer
    insert a comment along the lines of:


    > a-=1

    # print("You''ve just lost a life!")

    print("You now have", a, "lives left!")


    ![](img/ba40fbc39febe9db9a35785516d323a7_31_1.png)'
