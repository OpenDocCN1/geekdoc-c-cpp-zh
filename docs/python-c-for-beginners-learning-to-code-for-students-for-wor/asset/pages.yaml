  md: "# # Tkinter Module\n\nWhile running your code from the command line, or Python\
    \ is capable of so much more. The Tkinter module enables the programmer to set\
    \ up Graphical User Interface to interact with the user, and it's surprisingly\
    \ powerful too.\n\n# ## GETTING GUI\n\nTkinter is easy to use but there's a lot\
    \ more you can do with it. Let's start seeing how it works and getting some code\
    \ into it. Before long you will discover how powerful this module really is.\n\
    \nTkinter is usually built into Python 3. However, if it is not available when\
    \ you enter: import tkinter, then the command prompt. We can start to import modules\
    \ differently than before, to save time and by importing all their contents:\n\
    \n```\nimport tkinter as tk\nfrom tkinter import *\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_75_0.png)\n\
    \n**STEP 3** The ideal approach is to add mainloop() into the code to control\
    \ the Tkinter event loop, but we'll get to that soon. You've created a Tkinter\
    \ widget and there are several more we can play with:\n\n```\nbtn=Button(root)\n\
    btn.pack()\nbtn[\"text\"]=\"Hello everyone!\"\n```\n\nThe first line focuses on\
    \ the newly created window. Click back into the Shell and continue the others.\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_75_1.png)\n\n**STEP 2** It's not recommended\
    \ to import everything from a module using the asterisk * because it won't do\
    \ anything normally. Let's begin by creating a basic GUI window, enter:\n\n```\n\
    root=Tkinter()\n```\n\nThis creates a small window. There's not much to do at\
    \ this point click the X in the corner to close the window.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_75_2.png)\n\
    \n**STEP 4** You can combine the above into a New File:\nfrom tkinter import *\n\
    \n```\nbtn=Button(root)\nbtn.pack()\nbtn[\"text\"]=\"Hello everyone!\"\n```\n\n\
    Then add some interactions:\n\n```\ndef click():\n    print(\"You just clicked\
    \ me!\")\nbtn[\"command\"]=click\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_75_3.png)"
