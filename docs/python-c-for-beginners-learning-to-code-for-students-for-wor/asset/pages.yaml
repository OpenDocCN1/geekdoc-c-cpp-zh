    \ |\n| \\r | Carriage Return |\n| \\t | Horizontal Tab |\n| \\v | Vertical Tab\
    \ |\n| \\0 | Null Character |\n| \\uxxxx | Unicode (UTF-8) |\n| \\xxxxxxxx | Unicode\
