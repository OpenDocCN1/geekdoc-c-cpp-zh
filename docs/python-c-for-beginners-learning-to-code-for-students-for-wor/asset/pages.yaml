    ;\n    string greet3 = greet1 + greet2;\n    length = greet3.size();\n    cout\
    \ << \"The length of the combined strings is: \" << length << \"\\n\";\n}\n```\n\
    \n# STEP 6\n\nYou can see that we use string::get() to output the length, number\
