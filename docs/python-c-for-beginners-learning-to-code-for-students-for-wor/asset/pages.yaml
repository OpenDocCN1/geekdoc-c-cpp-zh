  md: '# # Opening Files


    In Python you can read text and binary files in your programs. You can also write
    to files, which is something we will look at next. Reading and writing files enables
    you to output and store data from your programs.


    # ## OPEN, READ AND WRITE


    In Python you create a file object, similar to creating a variable, only pass
    in the file using the open() function. Files are usually categorised as text or
    binary.


    +   STEP 1 If you enter text into your system''s text editor it is best, not a
    word processor, as word processors include background formatting and other elements.
    In our example, we have the poem Cimmerian, by Robert E Howard. You need to save
    the file as poem.txt.


    +   STEP 3 If you enter poem into the Shell, you will get some information regarding
    the file you''ve asked to be opened. You can now use poem to read the contents
    of the file:


    ```

    poem_read()`

    ```


    Note that an entry in the text editor creates a new line, as you have seen.


    ![](img/ba40fbc39febe9db9a35785516d323a7_57_0.png)


    +   STEP 2 You use the open() function to pass the file into an object. As anything
    you like, but you will need to tell Python the file name and the location of the
    file you''re opening.


    ```

    poem=open("/home/pi/Documents/Poem.txt")

    ```


    +   STEP 4 If you enter poem a second time you will notice that the file has been
    removed from the file. You will need to: poem=open("/home/pi/Documents/Poem.txt")
    to recreate the file. This time, however:


    ```

    print(poem.read())

    ```


    This line, the entry is famous for new lines and you will see the text.


    ![](img/ba40fbc39febe9db9a35785516d323a7_57_1.png)'
