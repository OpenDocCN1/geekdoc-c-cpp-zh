  md: "# Defining Constants\n\nConstants are fixed values in your code. They can be\
    \ any basic data type but the name suggests their value remain throughout the\
    \ entire code. There are two separate ways to define a constant in C++, the #define\
    \ pre-processor and const.\n\n#DEFINE\nThe pre-processors are instructions to\
    \ the compiler to pre-process the information before it goes ahead and compiles\
    \ the code. #include is a pre-processor as #define.\n\nSTEP 1\nYou can use the\
    \ #define pre-processor to define any constants in our code. Start by creating\
    \ a new C++ file with the following headers:\n\nSTEP 3\nNote the capitals for\
    \ defined constants, it's considered good programming practise to define all constants\
    \ in capitals. Here, the assigned values are 50, 40 and 60, so let's call them\
    \ up:\n\n```\n#include <iostream>\nusing namespace std;\nint main () {\n}\n```\n\
    \n```\n#include <iostream>\nusing namespace std;\n#define LENGTH 50\n#define WIDTH\
    \ 40\n#define HEIGHT 60\n```\n\n```\nint main () {\n  cout << \"Length is: \"\
    \ << LENGTH << \"\\n\";\n  cout << \"Width is: \" << WIDTH << \"\\n\";\n  cout\
    \ << \"Height is: \" << HEIGHT << \"\\n\";\n}\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_121_0.png)\n\
    \nSTEP 2\nLet's assume your code has three different constants: length, width\
    \ and height. You can define\n\n```\n#include <iostream>\nusing namespace std;\n\
    #define LENGTH 50\n#define WIDTH 40\n#define HEIGHT 60\n```\n\n```\nint main ()\
    \ {\n}\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_121_1.png)\n\nSTEP 4\n\
    Build and run, just as expected, it displays values for each of the constants.\
    \ It's worth noting that you don't need a semicolon when you're defining a constant\
    \ with the #define keyword.\n\n```\n#include <iostream>\nusing namespace std;\n\
    #define LENGTH 50\n#define WIDTH 40\n#define HEIGHT 60\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_121_1.png)\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_121_3.png)\n\n![](img/ba40fbc39febe9db9a35785516d323a7_121_4.png)"
