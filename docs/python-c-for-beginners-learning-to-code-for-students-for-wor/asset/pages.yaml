  md: '# Getting Started with Python


    # # Creating Functions


    Now that you mastered the use of variables and user input, the next step is to
    tackle functions. You''ve already used a few functions, such as the print command
    but Python enables you to define your own functions.


    # ## FUNKY FUNCTIONS


    A function is a command that you enter into Python to do something. It''s a little
    piece of self-contained code that takes data, works on it and returns the result.


    +   **STEP 1** A function takes data,input). They can do all manner of useful
    things in Python, such as sort data, change items from one format to another and
    check the length or type of items. Basically, a function is a short word followed
    by brackets. For example, `len()`, `list()` or `type()`.


    ```

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    GCC 4.8.0) on linux

    >>> print("credits" or "license") for more information.

    credits

    license

    >>>


    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_37_0.png)


    +   **STEP 3** You can pass variables through functions in much the number of
    letters in a person''s surname, you could use the following code (the text editor
    for this example):

    ```python

    name=input("Enter your surname: ")

    Count=len(name)

    print("Your surname has", count, "letters in it")

    ```


    Press F5 and save the code to execute.


    +   **STEP 2** A function takes data, using a variable, works on depending on
    what the function is programmed to do and returns the result. The data given inside
    the brackets, so if you want to know how many letters are in the word `establishmentarianism`,
    then you''d enter: `len("establishmentarianism")` and the number 28 would return.


    Python has tens of functions built into it, far too many to get into the limited
    space available here. For Python 3 users, navigate to docs.python.org/3/library/functions.html.
    These are the predefined functions, but since users have created more, they''re
    not the only ones available


    ```

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    GCC 4.8.0) on linux

    >>> print("credits" or "license") for more information.

    credits

    license

    >>> name=input("Enter your surname: ")

    Hayward

    >>> count=len(name)

    >>> print("Your surname has", count, "letters in it")

    Your surname has 7 letters in it

    >>>


    ```


    BDM''s Definitive Guide Series - Volume 3'
