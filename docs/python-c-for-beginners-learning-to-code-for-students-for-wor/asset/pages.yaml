  md: "# Number Guessing Game\n\n# NUMBERGUESS.PY\n\nThis is a simple piece of code\
    \ but it makes good use of the Random module, print and input, and a loop. The\
    \ number of guesses can be increased from 5 and the random number range can be\
    \ easily altered.\n\nCopy the code and see if you can beat the computer within\
    \ five guesses. It's an interesting bit of code that can be quite handy when you\
    \ are implementing a Random module alongside a loop.\n\n```\nimport random\nnguessed\
    \ = 0\nname=input('Hello! What is your name? ')\nnumber = random.randint(1, 30)\n\
    print('Sure, ' + name + ', I\\'m thinking of a number between 1 and 30')\nwhile\
    \ guessed < 5:\n    guess = int(input('Guess ' + str(guessed+1) + ': '))\n   \
    \ nguessed += 1\n    if guess == number:\n        print('You guessed correctly!')\n\
    \    elif guess > number:\n        print('Too high, try again.')\n    else:\n\
    \        print('Too low, try again.')\nbreak\nprint('Sorry, the number was ' +\
    \ str(number))\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_151_0.png)\n\n\
    If the player guesses the number, then 'well done' out, but how many guesses did\
