  md: "# Create Your Own Modules\n\nLarge programs can be much easier to manage if\
    \ you break them up into smaller parts and import the parts you need as modules.\
    \ Learning to build your own modules makes it easier to understand how they work.\n\
    \n# BUILDING MODULES\n\nModules are Python files, containing code, that you save\
    \ as a .py extension. These are then imported into Python using the import command.\n\
    \n+   * STEP 1 Let's start by creating a set of basic mathematics functions, multiplying\
    \ a number by two, three or square to raise a number to an exponent (power). Create\
    \ a New File in the IDE and edit\n\n```\ndef timtwo(x):\n    return x * 2\n\n\
    def timethree(x):\n    return x * 3\n\ndef square(x):\n    return x * x\n\ndef\
    \ power(x,y):\n    return x ** y\n```\n\n+   * STEP 3 Now you're going to take\
    \ the function definitions out of the program and edit into a separate file. Highlight\
    \ the function definitions and choose Edit > Cut. Choose File > New File and Edit\
    \ > Paste in the new window. You now have separate files, one with the function\
    \ definitions, the other with\n\n![](img/ba40fbc39febe9db9a35785516d323a7_81_0.png)\n\
    \n+   * STEP 2 Under the above code, enter functions to call the code:\n\n```\n\
    print(timtwo(2))\nprint(timethree(3))\nprint(square(4))\nprint(power(5,3))\n```\n\
    \nSave the program as basic_math.py and execute it to get the results.\n\n+  \
    \ * STEP 4 If you now try and execute the basic_math.py code **not defined** will\
    \ be displayed. The NameError: 'timtwo' is not defined is due to the code no longer\
    \ having access to the function definitions.\n\n```\nTraceback (most recent call\
    \ last):\n  File \"basic_math.py\", line 3, in <module>\n    print(timtwo(2))\n\
    NameError: name 'timtwo' is not defined\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_81_1.png)\n\
    \n+   * STEP 5 Return to the newly created window containing the function definitions\
    \ and click File > Save As Name it **minimath.py** and save it in the same location\
    \ as the **basic_math.py** program. Now close the minimath.py window is left open.\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_81_2.png)"
