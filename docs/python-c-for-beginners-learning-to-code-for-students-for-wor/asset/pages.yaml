  md: '# Tkinter Module


    # STEP 5


    Save and execute the code from Step 5 and a window appears with ''Hello everyone!''
    If you click the Hello everyone button the Shell will output the text ''You clicked
    me!'' It''s simple but shows what can be achieved with a few lines of code.


    ```

    # Python 3.4.2 (default, Oct 19 2014, 10:31:11)

    # Use tkinter for more information.

    import tkinter as tk

    root = tk.Tk()

    root.title(''Hello'')

    print(''You clicked me'')

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_76_0.png)


    # STEP 8


    You can create radio buttons. Try:

    from tkinter import *


    ```

    root = Tk()

    v = IntVar()

    Label(root, root.title("Options"), text="Choose

    a preferred language:"\)

    justify=LEFT, padx=20).pack()

    Radiobutton(root,

    text="Python",npad=20,

    value=1).pack(anchor=W)

    Radiobutton(root,

    text="C",npad=20,

    variable=v,

    value=2).pack(anchor=W)

    mainloop()

    ```


    # STEP 6


    You can display both text and images within a Tkinter window. However, only GIF,
    PGM or PNG are supported. Find an image and convert it before using it. The example
    here uses the BDM Publishing:

    from tkinter import *


    ```

    root = Tk()

    logo = PhotoImage("file/home/pi/Downloads/BDM.png")

    label1 = Label(root,root.title("BDM Publications"),image=logo).pack(side="right")

    content = "From humble beginnings in 2004, the BDM brand grew from a single publication
    produced by one of the biggest national publishing houses into simple magazines.
    Our reason and commitment to deliver the very best product every while the company
    has with a portfolio of over 250 titles delivered by our dedicated staff, the
    foundation that has been built upon years, which is why we believe BDM isn''t
    just the first choice it''s the only choice for the smart consumer"

    w2 = Label(root,justify=LEFT,padx=10,text=content).pack(side="left")

    root.mainloop()

    ```


    # STEP 9


    You can create check boxes, with buttons and output to the Shell:

    from tkinter import *


    ```

    root = Tk()

    def def_vars():

    print("Choice: %d,\nName: %s %%s" % (var1.get(),var2.get()))

    var1 = IntVar()

    var2 = IntVar()

    Label(root,root.title("Adventure Game"),

    row=0,sticky=W,variable=var1)

    Button(root,text="Mage",variable=var2)

    row=1,sticky=W)

    Button(root,text="Quit",command=root.destroy)

    row=2,sticky=W,padx=4)

    Button(root,text="Show",command=def_vars)

    row=3,sticky=W,padx=4)

    def_vars()

    mainloop()

    ```


