    \ revealing the random number chosen by the computer.)\n\nThis code is easy to\
    \ program, but there are some elements to the code that I want to point out. For\
    \ how we import the Random module, also by using random numbers within the code.\n\
    \nThis section of the code explains the variables of the code used, along with\
    \ the number of the player, and if we wanted to set the random number selection\
