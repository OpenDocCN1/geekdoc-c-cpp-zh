    you can ask the user their name, and have the input in the line:


    ```

    print("Hello. What''s your name?")

    name=input()

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_36_0.png)


    ```

    print("Hello. What''s your name?")

    name=input()

