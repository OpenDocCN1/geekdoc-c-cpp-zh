  md: '# Dictionaries


    Lists are extremely useful but dictionaries in Python are by far the more technical
    way of dealing with data items. They can be tricky to get grips at first but you''ll
    be able to apply them to your own code.


    # KEY PAIRS


    A dictionary is like a list but instead each data item as pair, these are known
    as Key and Value. The Key part must be unique and can be a number or string whereas
    the Value can be any data item like.


    STEP 1 Let''s say you want to create a phonebook in Python. You would create the
    dictionary name and entry in curly brackets, separating the key and value by a
    colon Key:Value. For example:


    ```

    phonebook={''Emma": 1234, "Daniel": 3456, "Hannah": 6789}

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_49_0.png)


    STEP 2 Just as with lists, tuples and so on, strings must be enclosed in quotes
    (single or double), which helps when the value can be either a string or an integer,
    you just need to enclose the value in quotes:


    ```

    phonebook2={''David": 654, "Hannah": 6789}

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_49_1.png)


    STEP 3 As with lists and tuples, you can check the contents of a dictionary by
    giving the dictionary name: phonebook, in this example. This will display the
    data items'' version with now. No doubt however

    STEP 4 The benefit of using a dictionary is that you can enter the key to index
    the value. Using the phonebook from the previous examples, you can enter:

    phonebook[''Emma''] = "Emma"

    phonebook[''Hannah''] = "Hannah"


    ![](img/ba40fbc39febe9db9a35785516d323a7_49_1.png)'
