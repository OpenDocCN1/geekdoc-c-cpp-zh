  md: '# Using Modules


    A Python module is simply a Python created source file that contains the necessary
    and unique code for custom classes, functions and global modules. You can bind
    and reference modules to extend functionality and create even more spectacular
    Python programs.


    Want to see how to use these modules to add a little something extra to your code?
    Then read on and learn how they can be used to fashion fantastic code.


    | 68 | Calendar Module |

    | 70 | OS Module |

    | 72 | Random Module |

    | 74 | Tkinter Module |

    | 76 | Pygame Module |

    | 80 | Create Your Own Modules |


