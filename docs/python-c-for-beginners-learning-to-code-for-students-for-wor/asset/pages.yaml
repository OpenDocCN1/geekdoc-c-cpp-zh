    \ = \"Welcome\";\n    cout << \"The length of the string is: \";\n    cout <<\
    \ greet.size() << \"\\n\";\n}\n```\n\n# STEP 8\n\nJust as you might expect, you\
    \ can mix in an integer and store something to do with the string. In this example,\
