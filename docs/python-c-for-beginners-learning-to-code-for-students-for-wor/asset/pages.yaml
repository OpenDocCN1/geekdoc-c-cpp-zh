  md: '# Executing Code from the Command Line


    Although we''re working from the GUI IDLE throughout this book, it''s worth taking
    a look at Python''s command line handling. We already know there''s a command
    line version of Python but it''s also used to execute code.


    # COMMAND THE CODE


    Using the code in the previous tutorial, the one named hello.py, let''s see how
    you can run code that was made in the GUI at the command line level.


    +   - STEP 1 Python, in Linux, with two possible ways of executing code via the
    command line. One of the ways is with Python 2, while the other uses the Python
    3 libraries and so on. First though, drop into the command line or Terminal on
    your operating system.


    +   - STEP 3 Now you''re at the command line we can start python. For Python 3
    you need to enter the command python and press Enter. This will put you into the
    command line version of the Shell, with the three arrows facing as curs (->).


    ```

    pi@raspberrypi:~$ python3

    ```


    +   - STEP 2 Just as before, Raspberry Pi: Windows users will need to click the
    Start button and search for CMD click the Command line returned search; and macOS
    users get access to their command line by clicking Go > Utilities > Terminal.


    +   - STEP 4 From here you''re able to enter the code you''ve looked at previously,
    such as:


    ```

    pi@raspberrypi:~$ python3

    >>> print(''hello'')

    hello

    Oct 19 2014, 13:31:11

    Cython 3.4.9 (main, Linux)

    [Type help for help, license, or ''copyright'', ''credits'' or ''license'' for
    more information]

    >>> a = ''hello''

    >>> print(a)

    ```


    You can see that it works exactly the same.'
