  md: "# Keyboard Drawing Script\n\nThe Turtle module is an excellent resource for\
    \ the Python programmer. However, what makes it so interesting, is its ability\
    \ to enable the user to control the turtle on the screen. This piece of code does\
    \ exactly that, allowing the user to unleash their inner artist.\n\n# KEYBOARDRAW.PY\n\
    \nThere are two modules in this script: Turtle and Tkinter. The drawing, where\
    \ the turtle module displays the user controls.\n\n```\nAll movements and turns\
    \ are increments of 5.\nRight arrow key = move forward\nLeft arrow key = move\
    \ backward\nturn = right\nturn = left\npen = up\npen = down\ngo = home\nclear\
    \ = clear\n```\n\n```\nfrom tkinter import *\nroot = tk.root(\"Controls\",height=80,\
    \ width=600)\ntroot.insert(\"Right arrow key = move forward left arrow key\nroot.bind(\\\
    <Right\", lambda: forward(5), \"Right\")\nroot.bind(\"<Left\", lambda: backward(5),\
    \ \"Left\")\nroot.bind(\"<Up\", lambda: turn(left), \"Up\")\nroot.bind(\"<Down\"\
    , lambda: turn(right), \"Down\")\nroot.bind(\"u\", lambda: pen_up())\nroot.bind(\"\
    d\", lambda: pen_down())\n\nfrom turtle import *\n```\n\n```\ndef main():\nwidth(2)\n\
    speed(0)\npencolor(\"blue\")\nkeyup(\"u\")\nkeydown(\"d\")\nkeyclear(\"c\")\n\
    home(\"h\")\nkeyward(lambda: forward(5), \"Right\")\nkeyward(lambda: backward(5),\
    \ \"Left\")\nkeyward(lambda: right(5), \"r\")\nlisten()\nreturn \"Done!\"\n\n\
    if __name__ == \"__main__\":\n    main()\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_156_0.png)\n\
    \nJust with all code, there's always room for improvement somewhere. Here you\
    \ could change the colours or ask the user to start with which colour they want\
    \ the pen to draw then include a key in the controls to increase or decrease the\
    \ speed of the pen. You can also expand the controls heavily to include more details\
    \ and options.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_156_1.png)\n\n![](img/ba40fbc39febe9db9a35785516d323a7_156_2.png)\n\
    \nAn initial set of comments describes the controls, which can be implemented\
    \ as a separate window using tkinter and turtle.\n\nSetting up the tkinter window\
    \ displaying the controls and creating a function to define the width, speed and\
    \ color of the line being drawn; also setting up the onkey functions for the controls\
    \ of the pen.\n\nA neat way to finish the code and loop so you can continue drawing\
    \ with the pen.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_156_3.png)"
