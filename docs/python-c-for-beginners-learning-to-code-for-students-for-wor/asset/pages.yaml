  md: "# # While Loop\n\nA while loop's function is to repeat a statement, or a group\
    \ of statements, while a certain condition remains true. When the while loop starts,\
    \ it initializes itself by testing the condition of the loop and the statements\
    \ within, before executing the rest of the loop.\n\n# ## TRUE OR FALSE?\n\nWhile\
    \ loops are one of the most popular form of C++ code looping. They repeatedly\
    \ run the code contained within the loop while the condition is true. Once it\
    \ proves false, the code continues as normal.\n\n+   **STEP 1** Clear you've done\
    \ so far and create a new C++ file. There's no need for any extra headers as usual:\n\
    \n```\n#include <iostream>\nusing namespace std;\n\nint main() {\n\n```\n\n+ \
    \  **STEP 3** First you need to create a condition, use a variable called num\
    \ and give it value 1. Now create the while loop, stating that as long as num\
    \ is less than 30, the loop is true. The loop value of num is displayed and until\
    \ it's more than 30.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_127_0.png)\n\n\
    We're introducing a few new elements here. The first are the opening and closing\
    \ braces for the loop. Because our loop is a loop statement, meaning a group of\
    \ statements; note, there's no semicolon after the statement. You also return\
    \ 0, which is a clear and preferred way of ending the code.\n\n+   **STEP 2**\
    \ Create a simple loop. Enter the code, build and run (we've added comments to\
    \ the screen):\n\n```\nint num = 1;\nwhile (num < 30) {\n\tcout << \"Number: \"\
    \ << num << endl;\n\tnum = num + 1;\n}\nnreturn 0;\n```\n\n```\nint num = 1; //\
    \ create the condition\nwhile (num < 30) // the condition remains true while num\
    \ is less than 30\n{\n\tcout << \"Number: \" << num << endl; // display the value\
    \ of num\n\ttum = num + 1; // close the code and finishes the program\n}\nreturn\
    \ 0;\n```\n\n+   **STEP 5** If you didn't need to see the continually increasing\
    \ value of num, you could have gone away with the compound statement and just\
    \ added num by itself until then is displayed:\n\n```\nint num = 1;\nwhile (num\
    \ < 30) {\n\tcout << \"Number: \" << num << endl;\n\ttum++;\n}\nreturn 0;\n```"
