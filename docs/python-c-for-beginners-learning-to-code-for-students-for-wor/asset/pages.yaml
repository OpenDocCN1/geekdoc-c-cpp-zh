    n\";\n```\n\nSTEP 3 You can comment several lines by using the double slash and\
    \ asterisk:\n\n> /* This comment cover several lines without the need to add more\
    \ slashes */\n\nSTEP 6 If you're using block comments, it's good practice in C++\
    \ to add an asterisk to each new line of the comment block. This also helps you\
