  md: "# Python Beginner's Mistakes\n\n# COUNTING LOOPS\n\n# COLONS\n\nRemember that\
    \ in Python a loop doesn't count the last number you specify in a range. So you\
    \ wanted the loop to count from 1 to 10, then you would need to use:\n\n```\n\
    n = list(range(1, 11))\n```\n\nWhich will return 1 to 10.\n\nIt's common for beginners\
    \ to add a colon to the end of a structural statement, such as:\n\n```\nclass\
    \ Hangman:\ndef guess(self, letter):\n```\n\nAnd so on. The colon separates what\
    \ the code, and creates the indents to which the code belongs.\n\n```\nclass Hangman:\n\
    \    def __init__(self, word):\n        self.word = word\n        self.missed_letters\
    \ = []\n\n    def guess(self, letter):\n        if letter not in self.word:\n\
    \            self.missed_letters.append(letter)\n            return False\n  \
    \      else:\n            self.missed_letters.append(letter)\n            return\
    \ True\n\n    def won(self):\n        return len(self.word) - len(self.missed_letters)\
    \ == 0\n\n    def lose(self):\n        return len(self.missed_letters) >= 6\n\
    ```\n\n# CASE SENSITIVE\n\nPython is a case sensitive programming language, so\
    \ you will need to check any variables. For example, Lives10 is a different variable\
    \ to lives, calling the wrong variable in case can have unexpected results.\n\n\
    ```\nPython 3.6.2\nFile Edit Debug Options Window Help\nPython 3.6.2 (v3.6.2:5fd33b5,\
