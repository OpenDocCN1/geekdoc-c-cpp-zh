  md: "# Conditions and Loops\n\nSTEP 5 Press F5 and save the code to execute. Enter\
    \ a four-letter word in the Shell, then you should have the returned message that\
    \ it's word four letters. Now press F5 again and run the program until this becomes\
    \ a five-letter word. The Shell will display it's not a four-letter word.\n\n\
    STEP 6 Now expand the code to include other conditions. Eventually, it could become\
    \ quite complex. We've added a condition for three-letter words:\n\n```\nword=input(\"\
    Enter a four-letter word: \")\nword_length=len(word)\nif word_length == 4:\n \
    \   print(\"is a four-letter word. Well done.\")\nelif word_length == 3:\n   \
    \ print(\"is a three-letter word. Try again.\")\nelse:\n    print(\"is not a four-letter\
    \ word.\")\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_40_0.png)\n\n![](img/ba40fbc39febe9db9a35785516d323a7_40_1.png)\n\
    \n# LOOPS\n\nA loop looks quite similar to a condition but they are somewhat different\
    \ in their operation. A loop will run through the block of code a number of times,\
    \ usually with the support of a condition.\n\nSTEP 1 Let's start with a While\
    \ loop. If, this will check if we see something TRUE, then run the indented code:\n\
    \n```\nx = 1\nwhile x < 10:\n    print(x)\n    x = x + 1\n```\n\nSTEP 3 The For\
    \ loop is another example. For is used to loop over a range of data, usually a\
    \ listed sort inside square brackets.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_40_2.png)\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_40_3.png)\n\nSTEP 2 The difference\
    \ between if and while is loop gets to the end of the code, it goes back and checks\
    \ the statement. In our case, if x is less than 10. With each loop it prints the\
    \ current value of x, then adds one to that value. When x equals 10 it stops.\n\
    \nSTEP 4 The For loop can also be used in the countdown example by using the range\
    \ function:\n\n```\nfor x in range(1, 10):\n    print(x)\n# The x++1 isn't needed\
    \ here because the range function creates a list from the first and last numbers.\n\
    ```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_40_4.png)\n\n![](img/ba40fbc39febe9db9a35785516d323a7_40_5.png)"
