  md: "# OS Module\n\nSTEP 5 The os.system() function is allows interaction with external\
    \ programs; you can even call up Python programs using this method. You will obviously\
    \ need to know the full path and program file name for it to work successfully.\
    \ However, you can use the following:\n\nSTEP 8 The ability to manipulate directories,\
    \ or folders if you prefer, is one of the OS module's best features. For example,\
    \ to create a new directory you can use:\n\n```\nimport os\ns.system('start chrome\
    \ \"https://www.youtube.com/feed/music\"')\n```\n\n```\nimport os\ns.mkdir(\"\
    NEW\")\n```\n\nThis creates a new directory in the Current Working Directory,\
    \ named according to the mkdirdir function.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_72_0.png)\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_72_1.png)\n\nSTEP 9 You can rename\
    \ any directories you've created by entering:\n\n```\nimport os\ns.rename(\"NEW\"\
    , \"OLD\")\n```\n\nSTEP 6 For Step 5's example we used Windows, to show that the\
    \ OS module works roughly the same across all platforms. In that case, we opened\
    \ YouTube's music feed page, so it is therefore possible to open pages:\n\nTo\
    \ delete:\n\n```\nimport os\ns.rmdir(\"OLD\")\n```\n\n```\nimport os\ns.system('chromium-browser\
    \ \"http://bdpublications.com/\\')\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_72_2.png)\n\
    \nSTEP 10 Another module that goes with OS is shutil. When you use the shutil\
    \ module to create a time-stamped backup directory and copy files into it:\n\n\
    ![](img/ba40fbc39febe9db9a35785516d323a7_72_3.png)\n\n```\nimport os, shutil,\
    \ time\nroot_src_dir = r'/home/pi/Documents'\nroot_dst_dir = r'/home/pi/backup/'\
    \ + str(int(time.time()))\nfor src_dir, dirs, files in os.walk(root_src_dir):\n\
    \    dst_dir = os.path.join(root_dst_dir, os.path.relpath(src_dir, root_src_dir))\n\
    \    if not os.path.exists(dst_dir):\n        os.makedirs(dst_dir)\n    for file\
    \ in files:\n        src_file = os.path.join(src_dir, file)\n        dst_file\
    \ = os.path.join(dst_dir, file)\n        if not os.path.exists(dst_file):\n  \
    \          shutil.copy(src_file, dst_file)\nprint\")\n```\n\nSTEP 7 Note in the\
    \ previous step's example of using the entire command and launching Chrome, whereas\
    \ the double quotes open the specified page. You can use variables to call multiple\
    \ tabs in the browser:\n\n```\nimport os\na=(\\chromium-browser \"http://bdpublications.com//\"\
    )\")\n```\n\n```\nb=(\\chromium-browser \"http://www.google.co.uk/\")\nsos.system(a\
    \ + b)\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_72_4.png)\n\n![](img/ba40fbc39febe9db9a35785516d323a7_72_5.png)"
