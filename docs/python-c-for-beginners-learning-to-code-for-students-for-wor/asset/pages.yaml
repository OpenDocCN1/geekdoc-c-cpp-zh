  md: '# Splitting and Joining Strings


    STEP 5 The opposite of _split join, where you will have separate items in a string
    and can join them all together to a word or just a combination of items, depending
    on your requirement. For instance:


    ```

    alphabet="".join(["a","b","c","d","e"])

    nalphabet

    ```


    This will display ''abc'' in the Shell.


    STEP 8 As with the _split join, the separator doesn''t have to be a space, it
    can also be a comma, a hyphen or whatever you feel like:


    ```

    colors=["Red","Green","Blue"]

    col=",".join(colors)

    col

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_52_0.png)


    STEP 6 You can thereafter join. to the separated name you made in Step 4, combining
    the letters again to name:


    name="".join(name)

    ''ve joined the string back together, and returned the listed name through the
    join function.


    STEP 9 There''s some interesting functions you to apply to a string, such as .capitalize()
    and .title(). For example:


    ```

    title="Con the cimmerian"

    title.capitalize()

    title.title()

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_52_1.png)


    STEP 7 A good example of using the join function when you have a list of words
    that you want to combine into a


    ```

    list=["Conan","raised","his","mighty","sword",n"and","struck","the","demon"]

    text=".".join(list)

    ```


    Note the space between the quotes before the join function (where there were no
    quotes in Step 6).


    You can also use logic operators on strings, with the ''in'' and ''not in'' functions.
    These enable you to check if a string contains (or doesn''t contain) a sequence
    of characters.


    ```

    message="Have a nice day"

    "nice" in message

    "bad" not in message

    "day" not in message

    "mighty" in message

