  md: '# # Random Module


    The Random module is one you will likely across many times in your Python programming
    life; as the name suggests, it is designed to create random numbers or letters.
    However, it''s not exactly random but it will suffice for most needs.


    # ## RANDOM NUMBERS


    There are numerous functions within the Random module, which applied can create
    some interesting and very useful Python programs.


    Just as with other modules you need to import random before you can use it we''re
    going to look at this tutorial. Let''s begin by simply printing a random number
    from 1 to 5:


    ```

    import random

    print(randomrandint(0,5))

    ```


    However, the Random module isn''t used exclusively for numbers. You can use it
    to select an entry from a list, and that list can contain:


    ```

    import random

    random.choice(["Conan", "Valeria", "Belit"]

    ```


    This will display the names of our adventurers at random, which is a great addition
    to a text adventure game.


    ![](img/ba40fbc39febe9db9a35785516d323a7_73_0.png)


    In our example the number four was returned. However, enter the print function
    few more times and will see different integer values from given to five. The example
    shows how pseudandom is adequate for the average programmer to utilise in their
    code.


    ![](img/ba40fbc39febe9db9a35785516d323a7_73_1.png)


    For a bigger set of numbers, including multiplication sign: you can extend the
    range by using the


    ```

    import random

    print(random.randint(* 100))

    ```


    You can extend the example somewhat by using random.choice(list) from a list of
    variables. Instance:


    ```

    import random

    list=["44", "80M Publications", 3245.23, "Pi", "True", 34, "Python"]

    nd-random.choice(list)

    ```


    This will display a floating point between 0 and 100, to use the range of around
    fifteen닭.


    ![](img/ba40fbc39febe9db9a35785516d323a7_73_2.png)


    72 BDM''s Definitive Guide Series - Volume 33'
