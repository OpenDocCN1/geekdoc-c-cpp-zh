    \ standard output stream, throughout our code. Now you're going to be using cin,\
    \ the standard input stream, to program a response.\n\n+   - Anything that you\
    \ want the user to input the program needs to be stored somewhere in the system\
    \ memory, so it can be retrieved and used. Therefore, any must first be declared\
    \ as a variable, so its ready to be used by the user. Start by creating a C++\
    \ file with headers.\n\n+   - The cin command works in the opposite way as output\
