  md: "# # Getting to Know Python\n\nPython is the greatest computer language ever\
    \ created. It enables you to fully harness the power of a computer, in a language\
    \ that's clean and easy to understand.\n\n# ## WHAT IS PROGRAMMING?\n\nIt helps\
    \ to understand what a programming language is before you try to learn one, and\
    \ Python's not different. And how it relates to other languages.\n\n# PYTHON\n\
    \nA language is a list of instructions that a computer follows. These can be as\
    \ simple as displaying your name or playing a music file, or as complex as building\
    \ a virtual world. Python is a programming language conceived in the 1980s by\
    \ Guido Rossum at Centrum & Informatica (CWI) in the Netherlands as a successor\
    \ to the ABC language.\n\n**Guido Rossum, the Father of Python.**\n\n![](img/ba40fbc39febe9db9a35785516d323a7_11_0.png)\n\
    \n# ## PROGRAMMING RECIPES\n\nPrograms are like recipes for computers. A recipe\
    \ to bake a cake could go like this:\n\n+   - Put 100 grams of self-raising flour\
    \ in the bowl.\n- Add 20 of butter to the bowl.\n- Add 100 milliliters of milk.\n\
    - Bake for half an hour.\n\nPut 100 grams of self-raising flour in a bowl.\nAdd\
    \ 100 milliliters of butter to the bowl.\nBake for half an hour.\n\n# ## CODE\n\
    \nJust like a recipe, a program consists of instructions that you follow in an\
    \ order. A program that describes a cake might run like this:\n\n```\npython\n\
    bowl = {\nflour = 100\nbutter = 50\nmilk = 100\n}\nbowl.append((flour, butter,\
    \ milk))\ncake.cook(bowl)\n```\n\n```\nclass Cake(object):\n    def __init__(self,\
    \ ingredients):\n        self.ingredients = ingredients\n    def cook(self):\n\
    \        print('Baking cake...\\')\n\nbowl = {\nflour = 100\nbutter = 50\nmilk\
    \ = 100\n}\nbowl.append((flour, butter, milk))\ncake.cook(bowl)\n```\n\n# ## PROGRAM\
    \ COMMANDS\n\nYou might not know some of the Python commands, like append and\
    \ cake(bowl). The first is a list, the second; we'll look at both in this book.\
    \ The main thing to know is that it's easy to read commands in Python. Once you\
    \ learn what the commands do, it's easy to figure out how a program works.\n\n\
    ```\nPython 3.4.2 Shell\nType 3.4.2 (default, Oct 13 2015, 13:21:17) [GCC 5.4.0]\n\
    type('copyright', 'credits' and 'license') for more information.\n>>> \nclass\
    \ Cake(object):\n    def __init__(self, ingredients):\n        self.ingredients\
    \ = ingredients\n    def cook(self):\n        print('Baking cake...\\')\n>>> \n\
    bowl = {\nflour = 100\nbutter = 50\nmilk = 100\n}\n>>> bowl.append((flour, butter,\
    \ milk))\n>>> cake = Cake(bowl)\n>>> cake.cook()\n```"
