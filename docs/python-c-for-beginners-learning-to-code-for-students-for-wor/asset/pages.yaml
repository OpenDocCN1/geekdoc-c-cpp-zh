  md: "# C++ Fundamentals\n\n# Data Types\n\nVariables, as we've seen, store information\
    \ that the programmer can later call up, and manipulate if required. Variables\
    \ are simply reserved memory locations that store the values the programmer assigns,\
    \ depending on the data type used.\n\n# THE VALUE OF DATA\n\nThere are many different\
    \ data types for the programmer in C++, such as integer, floating point, Boolean,\
    \ character and so on. It is widely accepted that there are seven basic data types,\
    \ often called Primitive Built-ins; you can create your own data types the need\
    \ ever arise within your code.\n\nThe seven basic data types are:\n\n| TYPE |\
    \ COMMAND |\n|---|---|\n| Integer | Integer |\n| Floating Point | float |\n| Character\
    \ | char |\n| Boolean | bool |\n| Double Floating Point | double |\n| Wide Character\
    \ | wchar_t |\n| No Value | void |\n\nincredibly accurate numbers but those numbers\
    \ are only accurate up to fifteenth decimal place. There's also the problem when\
    \ displaying numbers using the cout function; in that it can be fixed by adding\
    \ a .precision() function and adding a value inside the brackets, then even you\
    \ will be limited by the accuracy of the double data type.\n\n```\n#include <iostream>\n\
    using namespace std;\nint main() {\n    double PI = 3.14159265358979238463;\n\
    \    cout << PI;\n}\n```\n\nThese basic types can also be extended using the following\
    \ modifiers: Long, Signed and Unsigned. This means the programmer can expand the\
    \ minimum and maximum range for each data type. For example, an int has a default\
    \ value range of -2147483648 to 2147483647, a fact you would agree.\n\nNow, if\
    \ you use one of them, the range changes:\nUnsigned int = 0 to 4294967295\nSigned\
    \ int = -2147483648 to 2147483647\nShort int = -32768 to 32767\nSigned short =\
    \ -32768 to 32767\nLong int = -2147483648 to 2147483647\nSigned long = -2147483648\
    \ to 2147483647\nUnsigned long = 0 to 4294967295\n\nNaturally you can get away\
    \ with any basic type without the modifier, as there's plenty of range for most\
    \ of your needs. However, using modifiers is good C++ programming practice to\
    \ use the them when possible.\n\nThere are issues when using the modifiers double.\
    \ Double represents a floating-point value, which you can\n\n| #include <iostream>\n\
    using namespace std;\ndouble PI = 3.14159265358979238463;\nint main() {\n    cout\
    \ << PI;\n}\n\nBuild and run the code and you will see the output is only 3.14159,\
    \ representing cout's limitations in accuracy.\n\nYou can also use the aforementioned\
    \ cout function for greater accuracy. Take precision all the way up to 22 decimal\
    \ places, with the following code:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\ndouble PI = 3.14159265358979238463;\nint main() {\n}\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_109_0.png)"
