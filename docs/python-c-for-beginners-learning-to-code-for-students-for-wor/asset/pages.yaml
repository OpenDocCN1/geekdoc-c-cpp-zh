  md: '# USER ERROR


    User input is often a paralysing mistake in code. For example, the user is supposed
    to enter a number for their age and enter it in order. Often a user can enter
    so much into an input that overflows internal buffer, thus the code crashing.
    Watch those users and clearly state what is needed from them.


    ```

    Enter an integer number

    You have entered wrong input

    You have entered wrong input

    y

    You have entered wrong input

    sdf221232123

    You have entered wrong input

    12323n2923n923n2

    The number is 12

    Process returned 0 (0x0) execution time: 21.49 s

    Press any key to continue.

    ```


    # BACKUPS


    Always make a backup of your work, with a secondary backup for all changes you''ve
    made. Mistakes can be rectified if there''s a good backup in place to return to
    when something goes wrong. It''s much easier to start where you left off, rather
    than starting from the beginning.


    ![](img/ba40fbc39febe9db9a35785516d323a7_140_0.png)


    # RE-INVENTING WHEHEELS


    You can easily spend days to fathom out section of code to achieve a given result
    and it''s frustrating and time-consuming. While it''s rewarding to solve the problem,
    often the same code is out there on the Internet. Don''t try and re-invent the
    wheel, look to see if someone else has done it.


    ![](img/ba40fbc39febe9db9a35785516d323a7_140_1.png)


    # SECURE DATA


    If you''re writing code to deal with usernames and passwords, or other sensitive
    data, how ensure the data isn''t in cleartext. How to create a function to encrypt
    sensitive data, prior to fitting into a routine that can transmit or store it
    may be able to get to you.


    ![](img/ba40fbc39febe9db9a35785516d323a7_140_2.png)


    # HELP!


    Asking for help is something much of us has struggled with in the past. Will people
    be laughing at us? Am I wasting everyone''s time? It''s a common mistake for someone
    to suffer in silence. As long as you have the correct method, asking any forum
    or will be polite, your question isn''t silly.


    # MATHS


    If your code makes multiple calculations then you need to ensure the maths is
    sound. There are thousands of instances where people have offered incorrect data
    based on poor mathematical coding which can have disastrous effects on what the
    code is set to do. In double, check your code equations.


