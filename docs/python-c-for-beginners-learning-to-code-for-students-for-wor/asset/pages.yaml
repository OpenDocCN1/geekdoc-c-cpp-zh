  md: '# Date and Time


    When working with data it''s often has access to the time. For example, you may
    want to time-stamp an entry or see at what time you logged into the system and
    for how long. Lucidly acquiring the date and time is easy, thanks to the Time
    module.


    # TIME LORDS


    The Time module contains functions that help you retrieve the current system time,
    reads the date from strings, formats the time and date and more.


    +   * STEP 1 If you need to import the Time module. It''s built-in to Python 3
    so you don''t need to drop into a command prompt and install it. Once it''s imported,
    you can call the current date and time with a simple command:


    ```

    import time

    time.asctime()

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_55_0.png)


    +   * STEP 3 You can see the structure of how time is presented by:


    ```

    time.local()

    The output is displayed as: *time_struct_tm(nyear=2017, tm_mon=9, tm_day=7, tm_hour=9,
    tm_min=6, tm_sec=13, tm_wday=3, tm_yday=250, isdst=0); obviously dependent on
    your current time as opposed to the time it was written.

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_55_1.png)


    +   * STEP 2 The function is split into nine tuples, which are divided into indexed
    tuples, as with any other tuple, and shown in the screenshot below.

    * STEP 4 There are numerous functions built into the Time module. One of the most
    common is .strftime(). With it, you''ll be able to present a wide range of arguments
    as it converts the time tuple into a string. For example, to display the current
    day of the week you can use:


    | Index | Field | Values |

    |---|---||

    | 0 | 4-digit year | 2016 |

    | 1 | Month | 1 to 12 |

    | 2 | Day | 1 to 31 |

    | 3 | Hour | 0 to 23 |

    | 4 | Minute | 0 to 59 |

    | 5 | Second | 0 to 61 (60 is leap seconds) |

    | 6 | Day of Week | 0 to 6 (0 is Monday) |

    | 7 | Day of year | 1 to 366 (Julian day) |

    | 8 | Daylight savings | -1, 0, 1, -1 means library defines DST |


    ![](img/ba40fbc39febe9db9a35785516d323a7_55_2.png)'
