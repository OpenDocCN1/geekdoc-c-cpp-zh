  md: '# # Writing to Files


    The ability to read external files within Python is certainly handy but writing
    to a file is better still. Using the write() function, you are able to output
    the results of a program to a file, that you can read() back into Python.


    # ## WRITE AND CLOSE


    The write() function is slightly more complex than read(). Along with the filename
    you must also include an access mode which determines whether the file in question
    is read or write mode.


    +   - **STEP 1** Start opening IDE and the following:

    `t=open("/home/pi/Documents/text.txt")`


    Change the destination from /home/pi/Documents to your own system. This will create
    a text file in write mode using the variable ''t''. If there''s no file of that
    name in the location, it will create one. If one already exists, it will overwrite
    it, so be careful.


    +   - **STEP 3** However, the actual text file is still blank (you can write the
    line of the file object but not committed to the file. Part of the write() function
    is you need to commit the changes to the file; `t.close()`


    ![](img/ba40fbc39febe9db9a35785516d323a7_59_0.png)


    +   - **STEP 4** You can now write to the text file using the write() function.
    This opposes to read(), writing lines instead of them reading. Try this:


    ```

    t.write("You awake in a small, square room. A single table stands to one side,
    there is a locked door in front of you.")

    ```


    Note the 109 is the number of characters you created.


    +   - If you now open the text file with a text editor, you can see that the line
    you have created within the file. This gives us for some interesting possibilities:
    the creation of your log file or the beginning of an adventure.


    ![](img/ba40fbc39febe9db9a35785516d323a7_59_1.png)'
