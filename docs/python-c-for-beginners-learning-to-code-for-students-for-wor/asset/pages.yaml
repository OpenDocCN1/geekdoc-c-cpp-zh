  md: "# # Getting Started with Python\n\n# # Conditions and Loops\n\nConditions and\
    \ loops are what makes a program interesting; they can be simple or rather complex.\
    \ How you use them depends greatly on what the program is trying to achieve; they\
    \ could be the number of lives left in a game or just displaying a countdown.\n\
    \n# ## TRUE CONDITIONS\n\nKeeping conditions simple to begin with learning to\
    \ program a more enjoyable experience. Let's start then by checking if something\
    \ is TRUE, then something else if it Isn't.\n\n+   * STEP 1  Let's create a new\
    \ Python program that will ask the user to enter a word, then check it to see\
    \ if It's a four-letter word or not. Start with File -> New, and begin with their\
    \ input:\n\n```\nword-input=input(\"Please enter a four-letter word: \")\n```\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_39_0.png)\n\n+   * STEP 3  Now you\
    \ can use an if statement to check if the word is four letters and print a friendly\
    \ confirmation if it follows the rule:\n\n```\nword-input=input(\"Please enter\
    \ a four-letter word: \")\nword-length=len(word)\nif word-length == 4:\n    print(\"\
    is a four-letter word. Well done.\")\n```\n\nThe double equals (==) means if something\
    \ is equal to something.\n\n![](img/ba40fbc39febe9db9a35785516d323a7_39_1.png)\n\
    \n+   * STEP 2  We now create a new variable, then use the function and pass the\
    \ word through it to get the total number of letters the user has entered:\n\n\
    ```\nword-input=input(\"Please enter a four-letter word: \")\nword-length=len(word)\n\
    ```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_39_2.png)\n\nThe colon at the\
    \ end of if tells Python that this statement is true everything after the colon:\
    \ Next, move the cursor back to the beginning of the Editor:\n\n```\nword-input=input(\"\
    Please enter a four-letter word: \")\nword-length=len(word)\nif word-length ==\
    \ 4:\n    print(\"is a four-letter word. Well done.\")\nelse:\n    print(\"is\
    \ not a four-letter word.\")\n```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_39_3.png)"
