    \ coming into programming, Python has two live versions of its language available\
    \ to download and use. There is Python 2.7 and Python 3.6.x. The 3.6.x is the\
    \ most recent, and the one we recommend starting. But, version 2.7 code doesn't\
    \ work well with 3.6 code and vice versa.\n\n# ### INDENTS, TABS AND SPACES\n\n\
    Python uses indentations when displaying its code. The indents mean that code\
    \ in this section is part of a previous statement, and not linked with another\
    \ part of the code. Use four spaces to create an indent, not Tab key.\n\n```\n\
    # indent = 11\n# spaces = 16\n# tabs = 8\n# use space from\nfont = pygame.Font.SysFont('valirs',\
    \ 50)\nrect = pygame.Rect(70, 120, 80, 30)\nrect play\n\ndef move_player(speed):\n\
    \    for i in range(10):\n        pygame.move(rect, (speed, 0))\n        pygame.time.delay(1000)\n\
    \ndef move_enemy():\n    pygame.move(rect, (0, 30))\n    pygame.time.delay(1000)\n\
    ```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_141_0.png)\n\n# ### THE INTERNET\n\
    \nEvery programmer has at some point on the Internet and copy code to insert into\
