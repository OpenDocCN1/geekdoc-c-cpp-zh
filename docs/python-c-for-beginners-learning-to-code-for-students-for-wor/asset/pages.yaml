  md: '# Say Hello to Python


    # # Equipment You Will Need


    You can learn Python with very little hardware or initial financial investment.
    You don''t need an incredibly powerful computer and any software that''s required
    is freely available.


    # ## WE’RE USING


    Thankfully, Python is a multi-platform programming language available for Windows,
    macOS, Linux, Raspberry Pi and more. If you have one of those systems, then you
    can easily start using Python.


    ![](img/ba40fbc39febe9db9a35785516d323a7_9_0.png)


    # ### COMPUTER


    Obviously you''re going to need a computer in order to learn how to program in
    Python and to test your code. You can use Windows (from XP onward) on either 32
    or 64-bit processor, an Apple Mac or Linux installed PC.


    # ### IDE


    An IDE (Integrated Developer Environment) is used to enter and execute Python
    code. It enables you to inspect your program code and the values within the code,
    as well as offering advanced features. There are many different IDEs available,
    so find the one that works for you and gives the best results.


    ![](img/ba40fbc39febe9db9a35785516d323a7_9_1.png)


    # ### PYTHON SOFTWARE


    macOS and Linux already come with Python preinstalled as part of the operating
    system, as the Raspberry Pi. You need to ensure that you''re running the latest
    version of Python. Users need to download and install Python, which''ll come shortly.


    ![](img/ba40fbc39febe9db9a35785516d323a7_9_2.png)


    # ### TEXT EDITOR


    A text editor is an ideal environment to enter code into, it''s not an absolute
    necessity. You can enter and execute code from the IDE but a text editor, such
    as Sublime Text or Notepad++, offers many advanced Features and colour coding
    when entering.


    # ### INTERNET ACCESS


    Python is an ever evolving environment and as new versions often introduce new
    concepts or change existing commands and code structure to make it more efficient
    language. Having access to the internet will keep you up-to-date, help you out
    when you get stuck and give access to Python''s immense number of modules.


    # ### TIME AND PATIENCE


    Despite what other books may lead you to believe, you won''t be a programmer in
    24 hours. Learning to code Python takes time, and patience. You may become stuck
    at times and other times the code will flow like water. Understand you''re learning
    something entirely new; and you will get there.


    BDM''s Definitive Guide Series - Volume 33'
