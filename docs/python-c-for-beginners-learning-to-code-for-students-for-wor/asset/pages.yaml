  md: "# C++ COMMENTS\n\nCommenting in C++ involves a double forward slash '/', or\
    \ a forward slash and an asterisk, '/*'. You've already seen brief examples but\
    \ this is how they work.\n\nSTEP 1 Using the Hello World code as an example, you\
    \ can easily comment on different sections of the code using the double slash:\n\
    \n```\n//My first C++ program\ncout << \"Hello, world!\\n\";\n\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n    // My first C++ program\n    cout <<\
    \ \"Hello, world!\\n\";\n}\n```\n\nSTEP 4 Be careful when commenting, especially\
    \ with block comments. It's very easy to forget to add the closing asterisk and\
    \ thus negate any code that falls inside the comment block.\n\n```\n// HelloWorld.cpp\n\
    #include <iostream>\nusing namespace std;\nint main() {\n    cout << \"Hello,\
    \ world!\\n\";\n    cout << \"And greetings from C++\\n\";\n    // This comment\
    \ can\n    cover several lines\n    without the need to add more slashes\n   \
    \ cout << \"This line is now being ignored by the compiler!\\n\";\n```\n\nSTEP\
    \ 2 However, you can add comments to the end of a line of code, or in a better\
    \ way that going on:\n\ncout << \"Hello, world!\\n\";This line outputs the words\
    \ 'Hello, world'. The \\n denotes a new line.\n\nNote, you don't have to put a\
    \ semicolon at the end of a comment. This is because the line is then ignored\
    \ by the compiler.\n\nSTEP 5 If you obviously try and add a comment out error,\
    \ causing a missing bracket ']' to finish off the block of code. If you made an\
    \ error then, it can be time to go back and rectify. The colour commenting in\
