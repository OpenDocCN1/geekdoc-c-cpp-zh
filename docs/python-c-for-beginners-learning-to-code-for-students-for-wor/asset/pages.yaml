    char const x = orig + 2 * (n - 4)


    // See if we''re writing in 64 bit

    if (sizeof(long) == 8) {

    }

    if (__defined(__amd64)) // defined

    ```


    # PLAN AHEAD


    While it''s great to have one morning and one decide to write a classic text example,
    it''s not always practical without a good plan. Snippets of code can be written
    without too much planning but planning longer and more-in depth requires a good
    working plan to stick to and iron out the bugs.


