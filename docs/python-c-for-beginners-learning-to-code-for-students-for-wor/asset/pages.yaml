  md: '# # Formatting Strings


    When you work with data, creating lists, dictionaries and objects you may often
    want to print out your results. Merging strings with data is easily done with
    Python 3, as earlier versions of Python tended to complicate matters.


    # ## STRING FORMATTING


    Since Python 3, string formatting has become a much neater process, using the
    .format function combined with curly brackets. It''s a more logical and better
    approach than previous versions.


    ### STEP 1

    The basic formatting in Python is to call each variable into the string using
    curly brackets:

    name="Conan"

    print("the barbarian hero of the Hyperborian Age is {}".format(name))


    ### STEP 3

    You can course also include integers into the mix:

    print("{number=10000} {} {} was a killed mercenary, and thief too. He once stole
    {} gold from a merchant.".format(name, place, number))


    ![](img/ba40fbc39febe9db9a35785516d323a7_53_0.png)


    ### STEP 2

    Remember to use the print function with two sets of brackets, as you''ve encased
    the variable in one, and print the function after. You can include multiple cases
    of string formatting in a single function:

    name="Conan"

    place="Cimmeria"

    print(" hailed from the North, in a cold land known as {}".format(name, place))


    There are many different ways to apply string formatting, which are quite simple,
    as we''ve shown you; here can be significantly more complex. A good place to reference
    frequently string formatting is the Python Docs webpage, found at https://docs.python.org/3.1/library/string.html.
    Here, you will find help.


    ![](img/ba40fbc39febe9db9a35785516d323a7_53_1.png)'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# STEP 5


    Interestingly you can reference a list using the string formatting function. You
    can also place an asterisk in front of the name:


    ![](img/ba40fbc39febe9db9a35785516d323a7_54_0.png)


    # STEP 8


    You can print out the content of a user''s input in the same fashion:


    ```

    name=input("What''s your name ?")

    print("Hello, {}".format(name))

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_54_1.png)


    # STEP 6


    With indexing in lists, the same applies to using list string formatting. You
    can index each item by its position (from 0 to however many are present):


    ```

    numbers=1, 4, 7, 9

    print("More numbers: {}, {}, {}, {}".format(numbers))

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_54_2.png)


    # STEP 9


    You can extend this simple code example to display the first list in a person''s
    entered:


    ```

    name=input("What''s your name ?")

    print("Hello, {}".format(name))

    print("The first list of your name is a {0}")

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_54_3.png)


    # STEP 7


    And as you suspect, you can mix strings and integers in a list to be called with
    .format function:


    ```

    characters=["Conan", "Belit", "Valeria", 19, 27, 20]

    print("{} is {3} years old. Whereas {} is {4} years old.".format(*characters))

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_54_4.png)


    # STEP 10


    You can call upon a pair of lists and reference them individually within the same
    print function. Looking back the code from Step 7, you can alter it with:


