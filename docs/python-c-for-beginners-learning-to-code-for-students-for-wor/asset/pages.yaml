  md: '# # Starting Python for the First Time


    As previously mentioned we''re using Raspberry Pi as our Python hardware platform.
    The latest version of Raspian comes preinstalled with Python 3 (version 3.4.2);
    so as long as you have a version 3 Shell, all our code will work.


    # ## STARTING PYTHON


    We won''t go into the details of getting the Raspberry Pi up and running, there''s
    plenty of material already available on that subject. However once you''re ready,
    fire up your PI and get ready for coding.


    +   - STEP 1 With the Raspberry desktop loaded, click on the Menu button followed
    by Programming > Python 3 (IDLE). This will open the Python 3 Shell. Windows and
    Mac users can find the Python 3 Shell from the Windows menu or via Finder.


    +   - STEP 3 For example, in the shell: 2+2 After pressing enter, the next line
    will display the answer: 4. Basically, Python has taken the ''code'' and produced
    the relevant output.


    ![](img/ba40fbc39febe9db9a35785516d323a7_21_0.png)


    ```

    Python 3.4.2

