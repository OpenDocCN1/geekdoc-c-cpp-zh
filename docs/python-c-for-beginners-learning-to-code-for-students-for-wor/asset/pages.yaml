  md: "# Python File Manager\n\nThis file manager program displays a list of options\
    \ that allow you to read a file, write to a file, append to a file, delete a file,\
    \ list the contents of a directory and more. It's remarkably easy to edit and\
    \ insert into your own code, or add to:\n\n# FILEMAN.PY\n\nCopy the code below\
    \ into a New File and save it as FileMan.py. Once executed it will display the\
    \ program title, along with the current time and date and the available options.\n\
    \n![](img/ba40fbc39febe9db9a35785516d323a7_149_0.png)\n\n```\nimport shutil\n\
    import os\nimport time\nimport subprocess\n```\n\n```\ndef Read():\n    path=input(\"\
    Enter the file path to read:\")\n    file=open(path,'r')\n    print(file.read())\n\
    \    file.close()\n```\n\n```\ndef Write():\n    path=input(\"Enter the path of\
    \ file to write or create:\")\n    if os.path.isfile(path):\n        print(\"\
    Updating the existing file\")\n    else:\n        print(\"Creating the new file\"\
    )\n    text=input(\"Enter the text:\")\n    file=open(path,'w')\n    file.write(text)\n\
    ```\n\n![](img/ba40fbc39febe9db9a35785516d323a7_149_1.png)\n\nThis part of the\
    \ code imports the necessary modules. The OS and Subprocess modules handle the\
    \ operating system elements of the program.\n\nEach def() functions store the\
    \ code for each of the menu's options. Once the code within the function completes\
    \ it returns to the main menu with other options.\n\nThis is part of the code\
    \ to see what the user is running. In Windows the cls clears the screen, in Linux\
    \ and macOS, the clear command wipes the screen. It is tried to run cls when using\
    \ in Linux or macOS, an error occurs, which prevents it to run the code instead.\n\
    \nThese are the options, from 1 to 12. Each executes the appropriate function\
    \ when the relevant number is entered.\n\n```\ndef Delete():\n    path=input(\"\
    Enter the path of file for deletion:\")\n    if os.path.exists(path):\n      \
    \  print(\"File Found\")\n        os.remove(path)\n        print(\"File has been\
    \ deleted\")\n    else:\n        print(\"File does not exist\")\n```\n\n```\n\
    def ListDir():\n    path=input(\"Enter the Directory path to display:\")\n   \
    \ sortlist=sorted(os.listdir(path))\n    while(i<len(sortlist)):\n        print(sortlist[i])\n\
    \        i+=1\n```\n\n```\ndef Check():\n    fp=input(\"Enter Check existence\
    \ of \\n1.File \\n2.Directory:\")\n    if fp==1:\n        path=input(\"Enter the\
    \ file path:\")\n        os.path.isfile(path)\n```"
