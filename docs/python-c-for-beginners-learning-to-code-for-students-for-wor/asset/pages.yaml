  md: '# # Google Script


    Using the OS and Urllib modules, this small snippet of code will display a window
    for the user''s input, then pass the input to a Google search in your browser.
    It''s really quite a handy script and one that''s easily introduced into your
    own code.


    # ## GOOGLESEARCH.PY


    You will need to pip install the urllib module, unless it''s already installed.
    It also uses Zenith, which is a Linux-based (GNOME) tool for creating dialog boxes.


    ```

    import os

    import urllib.parse

    google = os.popen(''zenith -entry --text="Enter your

    search query" --title="Google Search").read(1)

    google = urllib.parse.quote(google)

    os.system(''chromium-browser http://www.google.com/search?q='' + (google))

    ```


    # ## Searching For More


    We''ve used the Zenith command to create the dialog box, which we mentioned is
    only available to Linux machines (like Ubuntu, Raspberry Pi, Linux Mint and so
    on). If you want to execute it on Windows, you might find a Windows version of
    Zenith and pass the user''s query through it, or create a Tinker dialog box to
    pass the information.


    You can see that this particular code uses the Chrome browser which comes preinstalled
    on the Raspberry Pi, and some versions of Linux. You will need to change the command
    in the line of code to read Firefox, or whatever you use, to start your favourite
    browser in Windows, for example, with the Start command. one of the following:


    ```

    os.system(''start firefox http://www.google.com/search?q='' + (google))

    ```


    ```

    os.system(''start chrome http://www.google.com/search?q='' + (google))

    ```


    ```

    os.system(''start ieexplorer http://www.google.com/search?q='' + (google))

    ```


    The last two for Chrome and Internet Explorer.


    There is a Zenith for Windows, available on GitHub at github.com/ahquis/zenith-windows
    you will need to install it in a folder on your system where you won''t require
    administrator access to be able to run the Zenith program. When you have Zenith
    installed, you can modify the Windows version of this code in Python to read:


    ```

    import os

    import urllib.parse

    google = os.popen(''start C:\Temp\zenith.bin\zenith --entry="Enter your Google

    search query" --title="Google Search").read(1)

    google = urllib.parse.quote(google)

    os.system(''start firefox http://www.google.com/search?q='' + (google))

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_158_0.png)'
