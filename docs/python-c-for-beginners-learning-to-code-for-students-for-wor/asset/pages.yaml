  md: '# User Input


    We''ve seen some basic user interaction with the code from a few examples earlier,
    so now would be a good time to focus solely on how you would get information from
    the user then and present it.


    # USER FRIENDLY


    The type of input you want from the user will depend greatly on the type of program
    you''re coding. For example, a game may ask for a character name, whereas a database
    can ask for personal details.


    +   - If it''s not already, open the Python 3 IDLE Shell, start a New File in
    the Editor. Let''s begin with something simple, enter:


    ```

    print("Hello")

    firstname=input("What is your name?")

    print("Thanks.")

    surname=input("And what is your surname?"

    ```


    ![](img/ba40fbc39febe9db9a35785516d323a7_35_0.png)


    +   - STEP 2 Save and execute the code, and as you already no doubt suspect in
    the IDLE Shell the program will ask for your first name, storing as the surname
    in its own variable (surname);


    ```

    Python 3.4.2 Shell

    Edit Shell Debug Options Windows help

    Python 3.4.2 (default, Oct 19 2014, 13:35:13)

    >>> print("Hello")

    Hello

    >>> firstname=input("What is your name?")

    David

    >>> print("Thanks.")

    Thanks.

    >>> surname=input("And what is your surname?")

    Hayward

    >>>

    ```


    +   - STEP 4 Run the code and you can see a slight issue, the full stop after
    the surname a blank space. To eliminate that you could add a plus sign in the
    comma in the code:


    print("Welcome"


