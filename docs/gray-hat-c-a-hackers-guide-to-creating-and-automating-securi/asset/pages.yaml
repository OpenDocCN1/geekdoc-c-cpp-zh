  md: 'it will follow by setting --auto-redundant to 2. Doing makes Arachni follow
    URLs with the same parameters but with different parameter values up to twice
    before moving on to a new URL. Arachni can scan more quickly when a lot of links
    with the same parameters are available but all go to the same page.


    > For a full introduction to and documentation of the supported vulnerability
    checks in Arachni, visit the Arachni GitHub page detailing the command line arguments:
    https://www.github.com/Arachni/arachni/wiki/Command-line-user-interface#checks/


    Within just a few minutes (depending on your internet speed), Arachni should report
    back a handful of XSS and SQL injection vulnerabilities in the website. Don''t
    worry—they''re supposed to be there! This website was built to be vulnerable.
    Later in the chapter, when we testing our C# automation, you can use this list
    of XSS, SQL injection, and other vulnerabilities to ensure your automation is
    returning the correct results.


    But let''s say you want to automatically run Arachni against an arbitrary build
    of your web application as part of a secure development life cycle (SDLC). Running
    it by hand isn''t very efficient, but we can easily automate Arachni to kick off
    scan jobs so it can work with any continuous integration system to fail builds
    based on the results of the scans. That''s where the REST API comes in.


    # The Arachni REST API


    Recently, a REST API was introduced so that simple HTTP requests be used to drive
    Arachni. Listing 12-2 shows how to start this API.


    ```

    $ arachni_rest_server

    arachni - Web Application Security Scanner Framework v2.0dev

    Author: Tasos Zapotek Laskos <tasos.laskos@arachni-scanner.com>

    ```


