    This is the beginning of the very cool things you can drive the Metasploit Framework
    to, from discovery to exploitation. As mentioned earlier, Metasploit even has
    a place in post-exploitation with many modules for several operating systems.
    You can also drive discovery using the auxiliary scanner modules in auxiliary/scanner/*
    A neat exercise would be to take the crossplatform Metasploit payload we wrote
    in Chapter 4 and dynamically generate shellcode via the RPC and create dynamic
    payloads.


    # Conclusion


    In this chapter, you learned how to create a small set of classes to programmatically
    drive Metasploit via the RPC interface. Using basic HTTP libraries and a third-party
    MSGPACK library, we were able to exploit the Metasploitable 2 virtual machine
    with the Unreal IRCD backdoor and then run a command on the shelled machine to
    prove we had a root shell.


    We have only touched on the power of the Metasploit RPC in this chapter. I highly
    encourage you to dig deeper into the potential of building Metasploit into change
    management or software development life cycle processes in your corporate enterprises
    to ensure misconfigurations or vulnerable software is not reintroduced to a data
    center or network with automatic scanning. At home, you can easily automate new
    device discovery with the Nmap integration that Metasploit ships to find any new
    phones or gadgets your kids may not have told you about. The possibilities are
