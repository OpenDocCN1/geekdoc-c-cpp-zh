    # # Conclusion


    In this chapter, we discussed a few different ways to create custom payloads that
    are useful in a variety of circumstances.


    Payloads that utilize TCP can provide benefits when you are attacking a network,
    from getting a shell from an internal network to maintaining persistence. Using
    a connect-back technique, you can achieve a shell on a remote box, thus aiding
    in a phishing campaign, for example where a pentest is completely external from
    the network. A bind technique, on the other hand, can help you maintain persistence
    on boxes without having to exploit the vulnerability on the machine again when
    the network is available.


    Payloads that communicate over UDP can often get around poorly configured firewalls
    and might be able to bypass an intrusion detection system focused on TCP traffic.
    Although less reliable than TCP, UDP offers the speed and stealth that the heavily
    scrutinized TCP generally can''t provide. By using a UDP payload that listens
    for incoming broadcasts, attempts to execute the commands sent, and then broadcasts
    the results back you, your attacks can be a bit quieter and possibly stealthier
    at the expense of stability.


    Metasploit allows an attacker to create many types of payloads on the fly, and
    it''s easy to install and get running. Metasploit includes the msfvenom tool,
    which creates and encodes payloads for use in exploits. Using the tool you can
    build a small, cross-platform executable to detect and run shellcode for a variety
    of operating systems. This gives you great flexibility in the payloads that are
    run on a target''s box. It also makes use of one of the most powerful and useful
    Metasploit features available.'
