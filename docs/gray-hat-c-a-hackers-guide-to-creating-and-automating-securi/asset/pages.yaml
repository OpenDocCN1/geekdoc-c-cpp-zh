  md: '# 6

    # AUTOMATING NEXPOSE


    ![](img/059a0f6a8101e80261ab133380da85bd_139_0.png)


    Nexpose is a vulnerability scanner similar to Nessus but geared toward enterprise-level
    vulnerability management. This means not only helping system admins find which
    boxes need patches, but also helping them mitigate and prioritize the potential
    vulnerabilities over time. In this chapter, I show you how to use C# to automate
    Rapid7''s Nexpose vulnerability scanner in order to create a Nexpose site, scan
    that site, create a PDF report of the site''s vulnerabilities, and delete the
    site. Nexpose''s reporting is incredibly flexible and powerful, allowing you to
    automatically generate reports for a wide variety of audiences, from executives
    to technical admins.


    Like the Nessus scanner discussed in Chapter 5, Nexpose uses the HTTP protocol
    to expose its API, but it uses XML instead of JSON to format data. In Chapter
    5, we will write two classes: one to communicate with the Nexpose API (the session
    class) and another to drive the API (the manager class). Once we''ve written the
    classes, you''ll learn how to run a scan and view the results.


