    That''s, not very useful if you don''t know. Notice that the output code looks
    similar to x86 assembly. This is actually raw intermediate language (IL) which
    is kind of like bytecode in JAR files, and it can seem a bit arcane. You''ll likely
    find this most useful when using two versions of a library to see what was changed.


    It has other great features that aid in reverse engineering. For instance, you
    can run the GNU strings utility on an assembly to which strings are stored inside,
    but you always get ctrl you don''t want, as random byte sequences that just happen
    to be ASCII printable. On the other hand, if you pass the --strings argument to
    monodis, it will print any strings that are stored for use in the code, such as
    variable assignments or constants, as Listing 13-6 shows. Since monodis actually
    parses the assembly to determine what strings have been programmatically defined,
    it can produce cleaner results with higher signal to noise.


    ```

    $ monodis --userstrings~/projects/hello_world/bin/Debug/hello_world.exe

    00: ""

    01: "Hello World!"

    1b: " "

    ```


    Listing 13-6: Using the --userstrings with --strings (used for metadata and other
    things)


    You can also output all strings stored in the assembly that aren''t the random
    garbage GNU strings picks up. This is very useful when you look for encryption
    keys or credentials hardcoded in assembly.


    However, my favorite monodis flags are --manifest and --resources. The first,
    manifest, lists all the embedded resources in the assembly. These are usually
    images or configuration files, but sometimes you''ll find keys and other sensitive
    material. The second argument, --resources, saves each embedded resource to the
    current working directory. Listing 13-7 shows this in practice.'
