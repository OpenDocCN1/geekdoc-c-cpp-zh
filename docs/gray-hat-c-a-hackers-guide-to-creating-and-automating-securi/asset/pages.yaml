    # Parsing the WSDL


    WSDL XML documents are a bit complicated. Even a simple WSDL document like the
    one we will parse is not trivial. However, because C# has excellent classes for
    parsing and consuming XML files, getting the WSDL parsed correctly and into a
    state that lets us interact with the SOAP services in an object-oriented fashion
    is pretty bearable.'
