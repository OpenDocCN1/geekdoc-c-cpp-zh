  md: "# Creating the Execute() Method for HTTP Requests Interacting with MSGPACK\n\
    \nThe Execute() method shown in Listing 11-5 does the bulk of the work of the\
    \ RPC library, creating and sending HTTP requests and serializing the RPC methods\
    \ and arguments into MSGPACK.\n\n```\npublic Dictionary<object, object> Execute(string\
    \ method, object[] args)\n{\n    if (method=\"auth.login\" && string.IsNullOrEmptyOrEmpty(_token))\n\
    \        throw new Exception(\"Not authenticated.\");\n\n    HttpWebRequest request\
    \ = new (HttpWebRequest)request.Create(_host);\n    request.ContentType = \"binary/message-pack\"\
    ;\n    request.Method = \"POST\";\n    request.KeepAlive = true;\n\n    using\
    \ (Stream rstream = request.GetStream())\n    using (Packer mspackWriter = Packer.Create(rstream))\n\
    \    {\n        bool sendToken = (string.IsNullOrEmptyOrEmpty(_token)) && sendToken\
    \ != \"auth.login\";\n        mspackWriter.PackArrayHeader((sendToken ? 1 : 0)\
    \ + args.Length);\n        mspackWriter.Pack(method);\n\n        if (sendToken)\n\
    \            mspackWriter.Pack(_token);\n        foreach (object arg in args)\n\
    \            mspackWriter.Pack(arg);\n    }\n\n    using (MemoryStream mstream\
    \ = new MemoryStream())\n    {\n        using (WebResponse response = request.GetResponse())\n\
    \        using (Stream rstream = response.GetStream())\n            rstream.CopyTo(mstream);\n\
    \n        mstream.Position = 0;\n\n        MessagePackObject resp = Unpacking.UnpackObject(mstream).AsDictionary();\n\
    \        return MessagePackToDictionary(resp);\n    }\n```\n\n> Listing 11-5:\
    \ The MetasploSession class's Execute() method\n\nIn, we check whether auth.login\
    \ was passed as is the only RPC method that doesn't require authentication. If\
    \ the method is not auth.login and we have no authentication token, we throw an\
    \ exception because the command passed to be executed will fail without authentication."
