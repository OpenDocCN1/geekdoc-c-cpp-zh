  md: '# 13


    # DECOMPILING AND REVERSING

    MANAGED ASSEMBLIES


    ![](img/059a0f6a8101e80261ab133380da85bd_268_0.png)


    Mono and .NET use a VM much as Java does to run compiled executables.

    The executable format for .NET and Mono is written using a higher-level

    bytecode to native x86 or x86_64 assembly, called managed assembly. This

    is in contrast to the native, unmanaged executables from languages like C and

    ++. Because managed assemblies are written in a higher-level bytecode,

    decompiling them is fairly straightforward if you use a few libraries that are

    not a part of the standard library.


    In this chapter, we will write a source decompiler that accepts a managed

    assembly and writes the source code back to a specified folder. This is a very

    useful tool for malware researchers, reverse engineers, or anyone needing to

    perform binary diffing (comparing two compiled binaries or libraries for

    differences at the byte level) between two .NET libraries or applications. We

    will then briefly cover a program with Mono called monodis that is very

    useful for analyzing assemblies outside of source code analysis for potential

    backdoors and other nefarious code.


    # Decompiling Managed Assemblies


    A number of easy-to-use .NET decompilers exist. However, their UIs tend

    to use toolkits like WPF (Windows Presentation Foundation) that keep them

    from being cross-platform (and mainly only running on Windows). Many'
