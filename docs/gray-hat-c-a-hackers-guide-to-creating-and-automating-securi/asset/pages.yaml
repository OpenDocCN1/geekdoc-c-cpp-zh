    that the server''s SSL configurations are fully up-to-date SSL modes and then
    disable the weak modes (or disable the service altogether). Once finished, we
    can rerun our automated scan to ensure that Nessus no reports any weak SSL modes
    in use.


    # Conclusion


    This chapter has shown you how to automate various aspects of the Nessus API in
    order to complete an unauthenticated scan of a network-attached device. In order
    to achieve this, we needed to be able to send API requests to the Nessus HTTP
    server. To do so, we created the NessusSession class; then, once we were able
    to authenticate with Nessus, we created the NessusManager class to create, run,
    and report the results of a scan. We wrapped everything with code that used these
    classes to drive the Nessus API automatically based on user-provided information.


    This isn''t the extent of the features Nessus provides, and you''ll find more
    detail in the Nessus API documentation. Many organizations require performing
    authenticated scans against hosts on the network in order to get full patch listings
    to determine host health, and upgrading your automation to handle this would be
    a good exercise.'
