  md: '# Creating a Connect-Back Payload


    The first kind of payload we''ll write is a connect-back, which allows an attacker
    to listen for a connection back from the target. This type of payload is useful
    if you don''t have direct access to the machine that the payload is being run
    on. For example, if you are outside the network performing a phishing campaign
    with Metasploit Pro, this type of payload allows the targets to reach outside
    the network to connect with you. The alternative, which we will discuss shortly,
    is for the payload to listen for a connection from the attacker''s target''s machine.
    Binding payloads like these are most useful for maintaining persistence when you
    can get network access.


    # The Network Stream


    We''ll use the netcat utility available on most Unix-like operating systems to
    test our bind and connect-back payloads. Most Unix operating systems come with
    netcat preinstalled, but if you want to use it on Windows, you must download the
    utility with Cygwin or as an independent binary (or build from source!). First,
    set up netcat to listen for the connection back from our target, as shown in 4-1.


    ```

    $ nc -l 4444

    ```


    > Listing 4-1: Listening on port 4444 using netcat


    Our connect-back payload needs to create a network stream to read from and write
    to. As you can see in 4-2, the first lines of the payload''s Main() method create
    this stream for later use based on arguments passed to the payload.


    > Listing 4-2: Creating the stream class constructor takes two arguments: the
    host to connect to


    a string and the port to connect to the host as an int. Using the arguments passed
    to the payload, and assuming the first argument is the host to connect, we pass
    the arguments to the TcpClient constructor I. Since by default the arguments are
    strings, we don''t need to cast it to any special type, only the port.'
