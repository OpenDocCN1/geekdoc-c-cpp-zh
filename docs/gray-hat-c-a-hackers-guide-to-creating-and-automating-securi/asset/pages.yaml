  md: "# Creating a Session for sqlmap API\n\nNo authentication is required to use\
    \ the REST API, so we can easily use the session/manager pattern, which is a simple\
    \ pattern similar to the other API patterns in previous chapters. This pattern\
    \ allows us to separate the protocol's transport (how we talk to the API) from\
    \ the protocol's exposed functionality (what the API can do). We'll implement\
    \ SqlMapSession and SqlMapManager classes to drive the sqlmap API to automatically\
    \ find and exploit injections.\n\nWe'll be writing the SqlMapSession class. This\
    \ class, shown in Listing 9-11, requires only a constructor and two methods called\
    \ ExecuteGet and ExecutePost(). These methods will do most of the heavy lifting\
    \ of the two classes we'll write. They will make the HTTP requests (one for GET\
    \ requests and one for POST requests, respectively) that allow our classes to\
    \ talk with the sqlmap API.\n\n```\npublic class SqlMapSession : IDisposable\n\
    {\n    private string _host = string.Empty;\n    private int _port = 8775;//default\
