  md: '# 12

    AUTOMATING ARACHNI


    ![](img/059a0f6a8101e80261ab133380da85bd_250_0.png)


    Arachni is a powerful web application black-box security scanner written in Ruby.
    It features support for many types of web application vulnerabilities, including
    many of the OWASP Top 10 vulnerabilities (such as XSS and SQL injection); a highly
    scalable distributed architecture that allows you to spin up scanners in a cluster
    dynamically; and full automation through both a remote procedure call (RPC) interface
    and a representational state transfer (REST) interface. In this chapter, you''ll
    learn how to drive Arachni with its REST API and then with its RPC interface to
    scan a given URL for web application vulnerabilities.


    # Installing Arachni


    The Arachni website (http://www.arachni-scanner.com/) gives you the current download
    package for Arachni across multiple operating systems. You can use these installers
    to set up Arachni on your own system. Once you''ve downloaded it, you can test
    it by running Arachni against a server designed to test for web vulnerabilities,
    as shown in Listing 12-1. Although this command isn''t using the RPC to drive
    Arachni just yet, you can see what kind of output we will get when scanning for
    potential XSS or SQL injection vulnerabilities.


    ```

    $ arachni --checks xss,sql --scope-auto-redundant \

    "http://demo.testfire.net/default.aspx"

    ```


    Listing 12-1: Running Arachni against an intentionally vulnerable website


    This command uses Arachni to check for XSS and SQL vulnerabilities in the website
    http://demo.testfire.net/default.aspx. We limit the scope of the pages'
