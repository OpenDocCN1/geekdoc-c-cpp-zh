  md: '# 2

    FUZZING AND EXPLOITING XSS

    AND SQL INJECTION


    ![](img/059a0f6a8101e80261ab133380da85bd_34_0.png)


    In this chapter, you''ll learn how to write a short and sweet cross-site scripting
    (XSS) and SQL injection fuzzer for URLs that take HTTP parameters in GET and POST
    requests. A fuzzer is software that attempts to find errors in other software,
    such as that on servers, by sending bad or malformed data. The two general types
    of fuzzers are mutational and generational. A mutational fuzzer attempts to taint
    the data in a known-good input with bad data, without regard for the protocol
    or the structure of the data. In contrast, a generational fuzzer takes into account
    the nuances of the server''s communication protocol and uses these nuances to
    generate technically valid data that is sent to the server. With both types of
    fuzzers, the goal is to get the server to return an error to the fuzzer.


    We''ll write a mutational fuzzer that you can use when you have a known-good input
    in the form of a URL or HTTP request. (We''ll write a generational fuzzer in Chapter
    3.) Once you''re able to use a fuzzer to find XSS and SQL injection vulnerabilities,
    you''ll learn how to exploit the SQL injection vulnerabilities to retrieve usernames
    and password hashes from the database.


    In order to find and exploit XSS and SQL injection vulnerabilities, we''ll use
    the core HTTP libraries to build HTTP requests programmatically in C#. We''ll
    first write a simple fuzzer that parses a URL and fuzzing the HTTP parameters
    using GET and POST requests. Next, we''ll develop full exploits for the SQL injection
    vulnerabilities that use carefully crafted HTTP'
