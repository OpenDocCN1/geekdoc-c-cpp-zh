    The GetTasks() method will return either all of the current tasks or just a single
    task, depending on whether the taskID argument is passed. If the task ID passed
    is not null, we create a new XML element called get_tasks with a task_id attribute
    of the ID passed; then we send the get_tasks command to OpenVAS and return the
    response. If the ID is null, we use the XDocument.Parse() method to create a new
    get_tasks element without a specific ID; then we execute the command and return
    the result.


