    ClamAV is an open source antivirus solution that is used primarily for scanning
    emails and attachments on email servers to identify potential viruses before they
    reach and infect computers on the network. But that certainly isn''t its only
    use case. In this chapter, we''ll use ClamAV to create an automated virus scanner
    that we can use to scan files for malware and to identify viruses with the help
    of ClamAV''s database.


    You''ll learn to automate ClamAV in a couple of ways. One is to interface with
    libclamav, the native library that drives ClamAV''s command line utilities such
    as clamscan, a file scanner you may be familiar with. The second way is to interface
    with the clam daemon through sockets in order to perform scans on computers without
    ClamAV installed.


    # Installing ClamAV


    ClamAV is written in C, which creates some complications when automating with
    C#. It''s available for Linux through common package managers as yum and apt,
    as well as for Windows and OS X. Many modern Unix distributions include a ClamAV
    package, but that version might not be compatible with Mono and .NET.


