  md: '# 14

    READING OFFLINE REGISTRY

    HIVES


    ![](img/059a0f6a8101e80261ab133380da85bd_276_0.png)


    The Windows NT registry is a gold mine of information for useful data such as
    patch levels and password hashes. And that information isn''t just useful for
    offensive pentesters looking to exploit a network; it''s also useful for anyone
    in the incident response or data forensics area of information security.


    Say, for example, you''re handed the hard drive of a computer that has been breached
    and you need to find out what happened. What do you do? Being able to read key
    information from the hard drive regardless of whether Windows can run is imperative.
    The Windows registry is actually a collection of files on the disk, called registry
    hives, and learning your way around the registry hives will allow you to better
    use these hives that hold so much useful information. Registry hives are also
    a great introduction to parsing binary file formats, which are made to store data
    efficiently for computers but are not so great for human consumption.


    In this chapter, we discuss the Windows NT registry hive data structure, and we
    write a small library with a few classes to read offline hives from which we can
    extract useful information, such as the boot key. This is useful if you want to
    extract password hashes from the registry later.


    # The Registry Hive Structure


    At a high level, the registry hive is a tree of nodes. Each node may have'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'key/value pairs, and it may have child nodes. We''ll use the terms node key
    and value key to classify the two types of data in the registry hive create classes
    for both key types. Node keys contain information about the structure of the tree
    and its subkeys, whereas value keys hold value information that applications access.
    Visually, the tree looks a bit like Figure 14-1.


    ![](img/059a0f6a8101e80261ab133380da85bd_277_0.png)


    Figure 14-1: A visual representation of a simple registry tree with nodes, keys,
    and values


    Every node key has some specific metadata stored alongside it, such as the last
    time its value keys were modified and other system-level information. All of this
    data is stored very efficiently for a computer to read—but not for a human. While
    we implement our library, we will skip over some of this metadata in order to
    make the end result simpler, but I will call these instances out go.


    As you can see in Figure 14-1, after the registry header, the tree begins with
    the root node key. The root node has two child nodes, which in this example we
    call Foo and Bar. The Foo node key contains two value keys, Baz and Bat, which
    have values of true and "AHA", respectively. Bar, on the other hand, has only
    child node BarBuzz, which has a single value key. This example of a registry hive
    is very contrived and simple. The registry hives on your machine are more complex
    and likely have millions of keys!


    # Getting the Registry Hives


    During normal operation, Windows locks the registry hives to prevent tampering.
    Altering the Windows registry can have potentially devastating results, such as
    an unbootable computer, it''s not something to take lightly.'
