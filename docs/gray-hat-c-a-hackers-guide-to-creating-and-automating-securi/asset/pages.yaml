    \ the proprietary vulnerability scanners Nessus and Nexpose, respectively. While\
    \ OpenVAS has similar functionality, it's another great tool to have in your arsenal.\n\
    \nI show you how to drive OpenVAS to scan for and report on vulnerabilities for\
    \ hosts on your network using the core C# libraries and some custom classes. By\
    \ the time you've finished reading this chapter, you should be able to assess\
