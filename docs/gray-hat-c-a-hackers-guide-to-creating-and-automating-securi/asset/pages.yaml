  md: 'of APIs called REST APIs. REST (representational state transfer) is a way of
    accessing and interacting with resources (such as user accounts or vulnerability
    scans) on the server, usually over HTTP, using a variety of HTTP methods (GET,
    POST, DELETE, and PUT). HTTP methods describe our intent in making the HTTP request
    (for example, do we want to create a resource or modify a resource?), kind of
    CRUD (Create, Read, Update, Delete) operations in databases.


    For instance, take a look at the following example GET HTTP request, which is
    like a read operation for a database (like SELECT * FROM users WHERE id = 1):
    GET /users/1 HTTP/1.0 Host:192.168.0.1


    In this example, we''re requesting information for the user with an ID of 1. To
    get the for another user''s ID, you could replace the 1 at the end of the URI
    with that user''s ID.


    To update the information for the first user, the HTTP request might look like:
    POST /users/1 HTTP/1.0 Host:192.168.0.1 Content-Type: application/json Content-Length:
    24


    "name": "Brandon Perry"}


    In our hypothetical RESTful API, the preceding POST request would update the first
    user''s name to Brandon Perry. Commonly, POST requests are used to update a resource
    on the web server.


    To delete the account entirely, use DELETE, like so: DELETE /users/1 HTTP/1.0
    Host:192.168.0.1


    The Nessus API will behave similarly. When consuming the API, we''ll send JSON
