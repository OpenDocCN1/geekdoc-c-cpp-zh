    Nessus is preconfigured with a few different scan policies. We''ll sort through
    these policies using GetScanPolicies() and MakeRequest() ② retrieve a list of
    policies and their IDs from /editor/policy/templates URI. The first argument to
    CreateScan is the scan ID, and the second is the CIDR range to scan. You can also
    pass a newline-delimited string of IP addresses in this argument. The third and
    fourth arguments are to hold a name and description of the scan, respectively.
    We''ll use a unique Guid (globally unique ID, string of letters and numbers) for
    each name our scan is only for testing purposes, but as you build more sophisticated,
    you may want to adopt a system of naming scans in order to make them easier to
    track. We use the arguments passed to CreateScan() to create a new Object ④ containing
