  md: '# # Installing Metasploitable


    Metasploitable 2 has a specific vulnerability that is particularly simple to exploit:
    a backdoored Unreal IRC server. This is a great example of a vulnerability with
    a Metasploit module that we can cut our teeth on the Metasploit RPC. You can download
    Metasploitable 2 from Rapid7 at https://information.rapid7.com/metasploitable-download.html
    or VulnHub at https://www.vulnhub.com.


    Metasploitable is shipped as a VMDK image in a ZIP archive, so installing it into
    VirtualBox isn''t completely straightforward. After unzipping the Metasploitable
    VM and opening VirtualBox, follow these instructions:


    +   1. Click the **New** button in the top-left corner of VirtualBox to open the
    wizard.

    2. Create a VM named Metasploitable.

    3. Give it a Type of **Linux** and leave the Version as Ubuntu (64-bit); then
    click **continue** or **Next**.

    4. Allocate **512 MB** and **1 GB RAM** to the VM and click **continue** or **Next**.

    5. In the Hard Disk dialog, select the **Use an existing virtual hard disk file**
    option.

    6. Next to the hard disk drop-down is a small folder icon. Click this and navigate
    to the folder where you unzipped Metasploitable.

    7. Select the Metasploitable VMDK file and click **Open** in the bottom right
    of the dialog.

    8. In the Hard Disk dialog, click the **Create** button. This should close the
    VM wizard.

    9. Start the new VM by clicking the **Start** button at the top of the VirtualBox
    window.


    Once the virtual appliance has booted up, it needs its IP address. To get the
    IP, after the appliance has booted up, log in with the credentials msfadmin/msfadmin
    and enter **ifconfig** at the bash shell to have the IP configuration printed
    to the screen.


