    # Cross-Site Scripting


    Like SQL injection, cross-site scripting (XSS) attacks exploit vulnerabilities
    in code that crop up when programmers build HTML to be rendered in the web browser
    using data passed from the web to the server. Sometimes, the data supplied by
    an untrusted client, such as a web browser, can contain HTML code as JavaScript,
    allowing an attacker to potentially take over a website by stealing cookies or
    redirecting users to a malicious website with unsanitized HTML.


    For example, a blog that allows comments might send an HTTP request with the data
    in a comment form to a site''s server. If an attacker were to create a malicious
    comment with embedded HTML or JavaScript, the blog software trusted and therefore
    did not sanitize the data from the web browser submitting the “comment,” the attacker
    could use their loaded attack comment to deface the website with their own HTML
    code or redirect any of the blog''s visitors to the attacker''s own website. The
    attacker could potentially install malware on the visitors'' machines.


    Generally speaking, a quick way to detect code in a website that may be vulnerable
    to XSS attacks is to make a request to the site with a tainted parameter. If the
    tainted data appears in the response without alteration,'
