    this registry path, we save a copy of the system''s registry hive for the machine
    analysis later. This same technique can be used for HKLM\Sam (where usernames
    and hashes are stored) and HKLM\Software (where patch levels and other software
    information are stored). Remember, saving these nodes requires administrator access!

