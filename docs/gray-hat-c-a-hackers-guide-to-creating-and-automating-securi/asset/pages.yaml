  md: '# “Get ready for a wild ride developing offensive and defensive C#.” —Matt
    Graeber, Microsoft MVP


    Learn to use C#''s powerful set of core libraries to automate tedious important
    tasks like fuzzing, performing vulnerability scans, and analyzing malware. With
    some help from Mono, you''ll write your own practical security tools that will
    run on Windows, OS X, Linux, and even mobile devices.


    After a crash course in C# and some of its advanced features, you''ll learn how
    to: • Write fuzzers that use the HTTP and XML libraries to scan for SQL and X
    injections • Generate shellcheck in Metasploit to automate cross-platform and
    cross-architecture payloads • Automate Nessus, OpenVAS, and sqlmap to scan for
    vulnerabilities and exploit SQL injections • Write a .NET decompiler for OS X
    and Linux


    +    Parse and read offline registry hives to dump system information Automate
    the security tools Arachni and Metasploit using their MSGPACK RPCs Streamline
    and simplify your workday by making the most of C#''s extensive repertoire of
    powerful tools and libraries with Gray Hat C#.


    # About the Author


    Brandon Perry has been writing C# applications since the advent of the open source
    .NET implementation Mono. In his free time, he enjoys writing modules for the
    Metasploit framework, parsing binary files, and fuzzing things. He is the co-author
    of Wicked Cool Shell Scripts, 2nd Edition (No Starch Press). He manages his software
    and other projects https://volatileinds.net/


    ![](img/059a0f6a8101e80261ab133380da85bd_322_0.png)'
