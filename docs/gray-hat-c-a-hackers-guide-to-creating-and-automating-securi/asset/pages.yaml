  md: '# 3

    # FUZZING SOAP ENDPOINTS


    ![](img/059a0f6a8101e80261ab133380da85bd_76_0.png)


    As a penetration tester, you may run into applications or servers that offer programmatic
    API access via SOAP endpoints. SOAP, or Simple Object Access Protocol, is a common
    enterprise technology that enables languageagnostic access to programming APIs.
    Generally speaking, SOAP is used over the HTTP protocol, and it uses XML to organize
    the data sent to and from the SOAP server. The Web Service Description Language
    (WSDL) describes the methods and functionality exposed through SOAP endpoints.
    By default, SOAP endpoints expose WSDL XML documents that clients can easily parse
    so that they can interface with the SOAP endpoints, and C# has several classes
    that make this possible.


    This chapter builds on your knowledge of how to programmatically craft HTTP requests
    to detect XSS and SQL injection vulnerabilities, except that it focuses on SOAP
    XML instead. This chapter also shows how to write a small fuzzer to download and
    parse the WSDL file exposed by a SOAP endpoint and use the information in the
    WSDL file to generate HTTP requests for the SOAP service. Ultimately, you''ll
    be able to systematically and automatically look for possible SQL injection vulnerabilities
    in SOAP methods.


    # ## Setting Up the Vulnerable Endpoint


    For this chapter, you''ll use a vulnerable endpoint in a preconfigured virtual
    appliance called CsharpVulnSoap (which should have a file extension of .ova)'
