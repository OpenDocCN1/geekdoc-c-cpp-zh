  md: "```\nprivate XDocument ReadMessage(SslStream SslStream)\n{\n  using (var stream\
    \ = new MemoryStream())\n  {\n    int bytesRead = 0;\n    do {\n      byte[] buffer\
    \ = new byte[2048];\n      bytesRead = sslStream.Read(buffer, 0, buffer.Length);\n\
    \      stream.Write(buffer, 0, bytesRead);\n      if (bytesRead < buffer.Length)\n\
    \      {\n        try {\n          string xml = System.Encoding.ASCII.GetString(stream.ToArray());\n\
    \          return XDocument.Parse(xml);\n        }\n        catch {\n        \
    \  continue;\n        }\n      }\n    } while (bytesRead > 0);\n    return null;\n\
    \  }\n}\n```\n\nListing 7-6: The ReadMessage() method for OpenVAS\n\nThis method\
    \ reads an XML document from the TCP stream in chunks and returns the document\
    \ (or null). After parsing a sslStream to the method, we declare a MemoryStream\
    \ which allows us to dynamically store the data we receive from the server. We\
    \ then use a do/while loop to create a 2048-byte buffer to read the data into.\
    \ Next, we call Read on the sslStream to fill the buffer with the number of bytes\
    \ read from the stream, and then we copy the data coming from OpenVAS to the MemoryStream\
    \ using Write() so we can parse the data into XML.\n\nIf the server returns less\
    \ data than the buffer can contain, we need to check whether we have read a valid\
    \ XML document from the server. To do so, we use GetString() within a try/catch\
    \ block to convert the bytes stored in the MemoryStream into a string and attempt\
    \ to parse the XML, since parsing will throw an exception if the XML is invalid.\
    \ If no exception is thrown, we return the XML document. If an exception is thrown,\
    \ we know that we haven't finished reading the stream, so we call continue to\
    \ read more data. If we finish reading bytes from the stream and have to return\
    \ a valid XML document, we return null. This is a bit of defense, in case communication\
    \ with OpenVAS is lost in"
