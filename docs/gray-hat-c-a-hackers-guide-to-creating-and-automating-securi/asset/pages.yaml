    # # The ClamAV Native Library vs. the clamd Network Daemon


    We''ll start by automating ClamAV using the native libclamav. This allows us to
    use a local copy of ClamAV and its signatures to perform virus scanning; however,
    this requires that the ClamAV software and signatures be properly installed and
    updated on the system or device. The engine can be memory and CPU intensive, using
    disk space for antivirus signatures. Sometimes these requirements can take up
    more resources on a machine than a programmer might like, so, offloading the scanning
    to another machine makes sense.


    You may rather want to perform your antivirus scanning in a central spot—perhaps
    when an email server sends or receives an email—in which case you won''t be able
    to use libclam. Instead, you could use the clamd daemon to offload antivirus scanning
    from the email server to a dedicated virus-scanning server. You only need to keep
    one server’s antivirus signatures up-to-date, and you won''t run a risk of bogging
    your email server.


