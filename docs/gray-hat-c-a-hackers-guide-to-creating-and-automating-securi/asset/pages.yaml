  md: '# # 1

    # C# CRASH COURSE


    ![](img/059a0f6a8101e80261ab133380da85bd_20_0.png)


    Unlike other languages, such as Ruby, Python, and Perl, C# programs can be run
    by default on all modern Windows machines. In addition, running programs written
    in C# on a Linux system as Ubuntu, Fedora, or another flavor couldn''t be easier,
    especially since Mono can be installed by most Linux package managers like apt
    or yum. This puts C# in a better position to meet cross-platform needs than most
