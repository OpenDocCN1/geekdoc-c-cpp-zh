    # Exploiting Boolean-Blind SQL Vulnerabilities


    A blind SQL injection, also known as a Boolean-based blind injection, is one in
    which an attacker does not get direct information from a database but can extract
    information indirectly from the database, generally 1 byte at a time, by asking
    true-or-false questions.


    # How Blind SQL Injections Work


    Blind SQL injections require a bit more code than UNION exploits in order to efficiently
    exploit a SQL injection vulnerability, and they take much more time to complete
    so many HTTP requests are required. They are also noisier on the server’s side
    than something like the UNION exploit and may leave much more evidence in logs.


    When performing a blind SQL injection, you get no direct feedback from the web
    application; you rely instead on metadata, as behavior changes, in order to get
    information from a database. For instance, using the RLIKE MySQL keyword to match
