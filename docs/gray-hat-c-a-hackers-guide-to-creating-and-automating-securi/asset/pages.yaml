    in web applications, you learned how to exploit them. Using BadStore again, we
    wrote a UNION-based SQL injection exploit that could pull out the usernames and
    password hashes in the BadStore database with a single HTTP request. In order
    to efficiently pull the extracted data out of the HTML returned by the server,
    we used the regular expression classes Regex, Match, and MatchCollection.


    Once the simpler UNION exploit was complete, we wrote a Boolean-based blind SQL
    injection on the same HTTP request. Using the HttpRequest class, we determined
    injection payloads passed to the web application. When we knew how the web application
    would behave in response to true-or-false questions, we began asking the database
    true-or-false questions in order to glean information from 1 byte at a time. The
    Boolean-based blind exploit is more complicated than the UNION exploit and requires
    more time and HTTP requests to complete, it is particularly useful when a UNION
    isn’t possible.'
