  md: 'Once we know that we have the authentication necessary to make the API HTTP
    request, we set the ContentType to binary/message-pack ② so that the API knows
    we are sending it MSGPACK data in the HTTP body. We create a class by passing
    the HTTP request stream to the Packer::Create() method ③. The Packer class (defined
    in the MsgPack.Cli library) is a real time-saver that allows us to write our RPC
    method and arguments to the HTTP request stream. We''ll use the various packing
    methods in the Packer class to serialize and write the RPC methods and arguments
    to the request stream.


    We write the total number of pieces of information we are writing to the request
    stream using PackArrayHeader ④. For example, the authlogin method has three pieces
    of information: the method and the two arguments username and password. We would
    first write the number 3 onto the stream. We would write the strings authlogin,
    username, and password to the stream using Pack. We''ll use this general process
    of serializing and sending the API method and arguments as the HTTP body to send
    our API requests to the Metasploit RPC.


    Having written the RPC method to the request, we write the authentication token
    if necessary. We move on to packing the RPC arguments in a foreach loop ⑤ to finish
    the HTTP request making the API call.


    The rest of the Execute() method reads the HTTP response that is serialized with
    MSGPACK and converts it into C classes that we can use. We first read the response
    into a byte array using a MemoryStream() ⑥. We then deserialize the response with
    UnpackObject() ⑦, passing the byte array as the only argument and returning the
    object as a MSGPACK dictionary. This MSGPACK dictionary is not exactly what we
    want, The values contained in the dictionary—such as strings—all need to be converted
    to their C class counterparts so that we can easily use them. To do this, we pass
    the MSGPACK dictionary to the MessagePackToDictionary() method (discussed in the
    next section).


