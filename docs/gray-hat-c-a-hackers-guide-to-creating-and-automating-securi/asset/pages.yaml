    Listing 8-20: The Cuckoo Sandbox analysis JSON report


    The analysis report from Cuckoo Sandbox is huge. It contains highly detailed information
    about what happened on the Windows system while your executable was running. The
    listing shows the basic metadata about the analysis, as what machine ran the analysis
    ① and common hashes of the executable ②. When this report is dumped, we can begin
    to see what the malware did on an infected system and put together a plan for
    remediation and cleanup.


    Note that part of the report is included here. What is not shown is the immense
    number of Windows API and system calls that were made, the files on the filesystem
    that were touched, and other incredibly detailed system information that allows
    to more quickly determine what a malware sample may have done on a client''s machine.
    More information can be found on where exactly is reported and how to use it on
    the official Cuckoo Sandbox documentation site: http://docs.cuckoosandbox.org/en/latest/usage/results/.


    As an exercise, you can save the full report to a file instead of printing to
    the console screen, since an output file might be more desirable for future malware
    analysis!


    # Conclusion


    The Cuckoo Sandbox is a powerful framework for malware analysis, and with the
    API feature, it can be easily integrated into work processes, infrastructures
    such as email servers, or even incident response playbooks. With the ability to
    run both files and arbitrary websites within a sandboxed and contained environment,
    security professionals can easily and quickly determine whether an attacker may
    have breached the network with a payload or drive-by-exploit.


    In this chapter, we were able to drive this functionality of Cuckoo Sandbox programmatically
    using core C# classes and libraries. We created a handful of'
