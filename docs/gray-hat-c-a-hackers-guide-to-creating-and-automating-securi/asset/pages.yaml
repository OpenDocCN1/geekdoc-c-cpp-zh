  md: '# FOREWORD


    As an attacker or defender developing software, one obviously needs to decide
    which language makes the most sense to use. Ideally, a language won’t be chosen
    simply because it is what the developer is most comfortable with. Rather, a language
    should be chosen based on answering a series of questions such as the following:


    +   * What are my primary target execution environments?

    * What is the state of detection and logging for payloads written in this language?

    * To what level does my software need to maintain stealth (for example, memory
    residence)?

    * How well is the language supported for both the client and the server side?

    * Is there a sizable community developing in this language?

    * What is the learning curve and how maintainable is the language?


    C# has some compelling answers to these questions. As to the question about the
    target execution environment, .NET should be an obvious candidate for consideration
    in a Microsoft-heavy environment because it has been packaged with Windows for
    years. However, with the open-sourcing of .NET, C# is now a language that can
    drive a mature runtime on every operating system. Naturally, it should be considered
    an extremely efficient language for cross-platform support.


    C# has always been the lingua franca of .NET languages. As you will see in this
    book, you will get up and running with C# in no time thanks to its low barrier
    to entry and massive developer community. Additionally, with .NET being a managed,
    type-rich language, compiled assemblies lend themselves to being trivially decompiled
    to C#. Therefore, someone writing offensive C# not necessarily develop their capabilities
    in a vacuum. Rather, one can pull from a well of .NET malware samples, decompile
    them, read the equivalent of their source code, and “borrow” their capabilities.
    They could go so far as employ the .NET reflection API to load and execute existing
    .NET malware samples dynamically—assuming, of course, they’ve been reversed sufficiently
    to ensure they do nothing subversive.


    As someone who has spent years bringing offensive PowerShell into the mainstream,
    my efforts have brought about massive security improvements'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'and logging facilities in the wake of the surge of PowerShell malware. The
    latest version of PowerShell (v5 of this writing) implements more logging than
    any other scripting language in existence. From a defender''s perspective, this
    is fantastic. From a pentester, red teamer, or adversary''s perspective, this
    increases the noise of one''s attack significantly. For a book about C#, why do
    I mention this? Although I acknowledge that attackers stand to gain far more agility
    by developing their tools in C# rather than so strictly in PowerShell. Allow me
    to explain:


    +   - NET offers a rich reflection API that allows one to load and dynamically
    interact with a compiled C# assembly in memory with ease. With all the additional
    introspection performed on PowerShell payloads now, the reflection API enables
    an attacker to fly better under the radar by developing a PowerShell payload that
    only serves as a .NET assembly loader

    - As Casey Smith (@subTee) has demonstrated, there are many legitimate, Microsoft-signed
    binaries on a default installation of Windows that serve as a fantastic host process
    for C# payloads—msbuild.exe among the stealthiest. Using MS as a host process
    for C# malware embodies the “living off the land” methodology perfectly—the idea
    that attackers can blend into a target environment and introduce a minimal footprint
    will thrive for a longer period of time.

    - Antimalware vendors to date remain largely unaware of .NET assembly capabilities
    at runtime. There is still enough unmanaged code malware out there the focus hasn''t
    shifted to effectively hooking the .NET runtime to perform dynamic runtime introspection.

    - With powerful access to the massive .NET class library, those comfortable with
    PowerShell will find the transition to C# a relatively smooth one. Conversely,
    those comfortable with C# will have a lower barrier to entry in transferring their
    skills to other .NET languages such as PowerShell and F.

    - Like PowerShell, C# is a high-level language, which means developers do not
    have to worry about low-level coding and memory management paradigms. Sometimes,
    however, one needs to go “low level” (for example, interacting with the Win32
    API). Through its reflection API and P/Invoke and marshaling interface, C# allows
    one to get as low as needed.


    Everyone has a different motivation for learning C#. My motivation was the need
    to transition my PowerShell skills to become more agile with'
  merge: -1
  pgno: 13
- img_proc: true
  md: '.NET code across more platforms. You, the reader, may have been drawn to this
    book as a means to acquire an attacker’s mindset to supplement your existing C#
    skills. Conversely, you may want to apply your existing attacker’s mindset to
    a language embraced by many across multiple platforms. Whatever your motivation
    may be, get ready for a wild ride through Brandon’s head as he imparts his unique
    experience and wisdom in developing offensive and defensive C#.


    Matt Graeber

    Microsoft MVP'
