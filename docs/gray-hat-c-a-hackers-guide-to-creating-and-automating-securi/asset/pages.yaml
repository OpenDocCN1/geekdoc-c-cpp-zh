  md: '# 4

    WRITING CONNECT-BACK,

    BINDING, AND METASPLOIT

    PAYLOADS


    ![](img/059a0f6a8101e80261ab133380da85bd_105_0.png)


    As a penetration tester or a security engineer, it’s really useful to be able
    tonwrite and customize payloads on the fly. Often, corporate environments will
    differ drastically from one to the next, and “off-the-shelf” payloads by frameworks
    such as Metasploit are simply blocked by intrusion detection/prevention systems,
    network access controls, or other variables of the network. However, Windows machines
    on corporate networks almost always have the .NET framework installed, which makes
    C# a great language to write payloads in. The core libraries available to C# also
    have excellent networking classes that allow you to hit the ground running in
    any environment.


    The best testers know how to build custom payloads, tailored for particular environments,
    in order to stay under the radar longer, maintain persistence, or bypass an intrusion
    detection system or firewall. This chapter shows you how to write an assortment
    of payloads for use over TCP (Transmission Control Protocol) and UDP (User Datagram
    Protocol). We’ll create a cross-platform UDP connect-back payload to bypass weak
    firewall rules and discuss how to run arbitrary Metasploit assembly payloads to
    aid in antivirus evasion.'
