  md: "# Gathering initial information to build dynamic SOAP XML\n\nAs with the GET\
    \ and POST fuzzing methods, we need to collect some information about what we\
    \ are going to fuzz before we can do anything. We first grab the corresponding\
    \ SoapType from the _wsdl.PortTypes using LINQ; then we iterate over each operation\
    \ with a foreach loop. As we iterate, we print the current operation we are fuzzing\
    \ to the console. In order to send the correct XML to the server, we need to select\
    \ the SoapOperation and SoapMessage classes that correspond to the SoapBinding\
    \ class passed to the method. Using the SoapOperation and SoapMessage, we can\
    \ dynamically build the XML. To do this, we use LINQ to XML, which is a set of\
    \ built-in classes in the System.Xml namespace that lets us create, dynamic XML,\
    \ as in Listing 3-31.\n\n```\nXNamespace soapNS = \"http://schemas.xmlsoap.org/soap/envelope/\"\
    ;\nXNamespace xmlNS = soapAction.Replace(op.Name, string.Empty);\nXElement body\
    \ = new XElement(soapNS + \"Body\");\nXElement soapOperation = new XElement(xmlNS\
    \ + param.Name);\n```\n\n```\nsoapBody.Add(soapOperation);\n\nList<Guid> list\
    \ = new List<Guid>();\nSoapType type = _wsdl.Single(t => t.Name == input.Parts[0].Split('/')[1]);\n\
    foreach (SoapTypeParameter in type.Parameters)\n{\n    XElement soapParam = new\
    \ XElement(xmlNS + param.Name);\n    if (param.Type.EndsWith(\"string\"))\n  \
    \  {\n        Guid guid = Guid.NewGuid();\n        list.Add(guid);\n        soapParam.SetValue(guid.ToString());\n\
    \    }\n    soapOperation.Add(soapParam);\n}\n```\n\n> Listing 3-1: Building the\
    \ dynamic SOAP XML using LINQ to XML in the SOAP fuzzer\n\nWe create two XNamespace\
    \ instances when building the XML. The first XNamespace is the default SOAP namespace,\
    \ but the second XNamespace will change based on the current operation's SoapAction\
    \ property. After the namespaces are defined, we create two new XElement elements\
    \ using the XElement class. The first XElement (which will be called <body>) is\
    \ a standard XML element used in SOAP and will encapsulate the data for the current\
    \ SOAP operation. The second XElement will be named after the current operation.\
    \ The XElement instances use the default SOAP namespace and the SOAP operation\
    \ namespace, respectively. We then add the second XElement to the first using\
    \ the XElement Add method so that the SOAP <body> XML element will contain the\
    \ SOAP operation element."
