    # Anonymous Methods


    The methods we have used so far been class methods, but we can also use anonymous
    methods. This powerful feature of C# allows us to dynamically pass and assign
    methods using delegates. With a delegate, a delegate object is created that holds
    a reference to the method that will be called. We create this delegate in a parent
    class and then assign the delegate’s reference to anonymous methods in subclasses
    of the parent class. This way, we can dynamically assign a block of code to a
    subclass the instead of overriding the parent class’s method. To demonstrate how
    to use delegates and anonymous methods, we can build on the classes we have already
    created.


