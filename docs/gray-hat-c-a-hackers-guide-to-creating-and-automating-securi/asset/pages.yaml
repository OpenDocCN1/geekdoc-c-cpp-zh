  md: '# Automating with clamd


    The clamd daemon provides a great way to add virus scanning to an application
    that accepts file uploads from users or something similar. It operates over the
    TCP, but without SSL by default! It is also very lightweight, but it has to run
    on a server on your network, which results in some limitations. The clamd service
    allows you to have a long-lived process running for scanning files instead of
    managing and allocate the ClamAV engine in the previous automation. Because it''s
    a server version of ClamAV, you can use clamd to scan files for computers without
    installing the application. This can be convenient when you only want to manage
    virus definitions in one place or you have resource limitations and to offload
    the virus scanning to another machine, as discussed earlier. Getting automation
    working for clamd is exceedingly simple in C#. It requires two small classes:
    a session and a manager.


    # Installing the clamd Daemon


    On most platforms, installing ClamAV from the package manager might not install
    the clamd daemon. For instance, on Ubuntu, you will need to install the clamav-daemon
    separately with apt, as shown here: $ sudo apt-get install clamav-daemon On Red
    Hat or Fedora, you''d install a slightly different package name: $ sudo yum install
    clamd-server


    # Starting the clamd Daemon


    To use clamd after installing the daemon, you need to start the daemon, which
    listens on port 3310 and address 127.0.0.1 by default. You can do this with the
    clamd command, as shown in Listing 10-14.


    | $ clam Listing 10-14: Starting the clamd daemon |

    | NOTE |

    | If you install clamd with a package manager, it may be configured by default
    to listen on a local UNIX socket rather than a network interface. If you are having
    trouble connecting to the clamd daemon using a TCP socket, make sure that clamd
    is configured to listen on a network interface |


    You may not get any feedback when you run the command. No news is good news! If
    clamd starts with no messages, then you have successfully started'
