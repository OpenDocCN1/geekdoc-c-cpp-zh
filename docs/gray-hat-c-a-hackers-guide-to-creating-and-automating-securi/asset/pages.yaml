  md: '# 11

    AUTOMATING METASPLOIT


    ![](img/059a0f6a8101e80261ab133380da85bd_233_0.png)


    Metasploit is the de-facto de facto open source penetration-testing framework.
    Written in Ruby, Metasploit is both an exploit database and a framework for exploit
    development and penetration testing. But many of Metasploit''s most powerful features,
    such as its remote procedure call (RPC) API, are often overlooked.


    This chapter introduces you to the Metasploit RPC and shows how to use it to programmatically
    drive the Metasploit Framework. You''ll learn how to use the RPC to automate Metasploit
    to exploit Metasploitable 2, an intentionally vulnerable Linux machine designed
    for learning how to use Metasploit. Red teams or offensive security professionals
    should note that many pieces of tedious work can be automated, freeing up time
    to focus more on the intricate or nonobvious vulnerabilities. With an API-driven
    Metasploit Framework at your fingertips, you''ll be able to automate tedious tasks
    such as host discovery and even network exploitation in a scalable way.


    # Running the RPC Server


    Since we set up Metasploit in Chapter 4, I won''t go over how to set it up again
    here. Listing 11-1 shows what you need to enter in order to run the RPC server.


    ```

    $ msfprpc -U username -P password -S f Listing 11-1: Running the RPC server

    ```


    The -U and -P arguments stand for the username and password that authenticate
    the RPC. You can use whatever you want for the username or'
  merge: -1
  pgno: 233
- img_proc: true
  md: 'password, without we will need the credentials we write the C# code. The -s

    argument disables SSL. (Self-signed certificates make things a bit more

    complicated, we''ll ignore them for now.) Finally, -f tells the RPC interface

    to run in the foreground to make the RPC process easier to monitor.


    To use the RPC interface that is running, either start a new terminal or

    restart msfrpc without the -f option (which starts msfrpc in the background) and

    then use Metasploit''s msfrpc client to connect to the RPC listener that was just

    started and issuing calls. Be forewarned: the msfrpc client is rather

    cryptic—it''s difficult to read and has unintutive error messages. Listing 11-2

    shows the process of authenticating with the msfrpc server using the msfrpc client

    with Metasploit.


    ```

    $ msfrpc -U username -P password -S -a 127.0.0.1

    [*] The ''rpc'' object holds the RPC interface

    [*] Use rpc.call(''group, ''command'') to make RPC calls

    ```


    ```

    >> Rpc.call(''login'',''username'',''password'')

    => {"result":"success","token":"TEMPFZY3CFXwqBn9jfofOehbKxb"}

    ```


    Listing 11-2: Using the msfrpc client to authenticate with the msfrpc server


    To connect to the RPC listener with msfrpc, we pass a few arguments to

    msfrpc. The username and password are set with -U ① and -P ②, respectively. The
    -s argument ③

    tells msfrpc not to use SSL when connecting to the listener, and the -a argument
    ④

    is the IP address to which the listener connects. Since we started msfrpc

    instance without specifying an IP address to listen on, the default address of

    127.0.0.1 is used.


    Once connected to the RPC listener, we can use rpc.call() ⑤ to call all API

    methods that are available. We are going to test with the authlogin

    procedure method because it will use the same username and password

    passed as the arguments. When you call rpc.call(), the RPC method and

    arguments are packed into a serialized MSGPACK block that is sent to the RPC

    server using an HTTP POST request with a content type of binary/message-pack.

    These are important points to note because we need to do the same things in C

    to communicate with the RPC server.


    We already have a lot of experience with the HTTP libraries, but

    MSPACK serialization is certainly not a typical serialization format

    (you''re more likely to see XML or JSON). MSGPACK allows C# to read and

    respond with complex data from the Ruby RPC server very efficiently, just

    as using JSON or XML would have been a potential bridge for the two languages.

    as we work with MSGPACK, it should become clearer how MSGPACK

    serialization works.'
