    # Conclusion


    In this chapter, you saw how to wrap the functionality of the sqlmap API into
    easy-to-use C# classes to create a small application that starts basic sqlmap
    scans against URLs passed as an argument. After we created the basic application,
    we added sqlmap support to the SOAP fuzzer from Chapter 3 to make a tool that
    automatically exploits and reports on potentially vulnerable HTTP requests.


    The sqlmap API can use any argument that the command line—based sqlmap tool can,
    making it as powerful, if not more so. With sqlmap, you can use your C# skills
    to automatically retrieve password hashes and database users after verifying that
    a given URL or HTTP is indeed vulnerable. We’ve only scratched the surface of
    sqlmap’s power for offensive pentes or security-minded developers looking for
    more exposure to the tools hackers use. Hopefully, you can take the time to learn
    the more subtle nuances of sqlmap features to bring really flexible security practices
    to your work.'
