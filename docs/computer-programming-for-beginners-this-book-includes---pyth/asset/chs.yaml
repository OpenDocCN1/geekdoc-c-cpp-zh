  \n二进制字面量的类型为 `int`。它可以在任何接受常量字面量的地方使用。\n\n## 变量模板 (Variable Template)\n\n变量模板的预期目的是让编码更简单，并简化常量的定义和使用。变量模板本质上是一组变量的定义。\n\
