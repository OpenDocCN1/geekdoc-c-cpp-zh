  \ nutrients\n\ndef show_results(chicken=(0.0,100.0), pasta=(0.0,100.0), parmesan=(0.0,100.0)):\n\
  \    dish_content=[<<b>Total:>',0,0,0]]\n    dish_content.append(['chicken']+get_share('chicken\
