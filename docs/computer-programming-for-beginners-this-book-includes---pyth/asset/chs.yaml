  \ `get_share()` 计算的。\n\n最后，我们遍历创建的表格的列，通过累加每列的值来填充第一行的 `Total_values`。对 `dish_content`\
  \ 使用使用列表推导式（List comprehension）来获取每列的值列表，并使用标准库 `sum()` 函数对它们进行求和。列总和存储在表格的第一行。\n\
  \n然后，使用三种主要营养素的数值数值为菜肴内容创建一个饼图。来自 `matplotlib` 模块的 `pie` 函数接收碳水化合物、脂肪和蛋白质的量，并使用它们绘制饼图。参数、标签和颜色都是自言自懂的，它们定义了扇区的标签和颜色，而参数\
  \ `autopct` 定义了菜肴中每个成分百分比的格式字符串。这意味着百分比应该以浮点数的形式打印，小数点前至少一位数字，小数点后至少一位，后面跟一个 '%'。使用\
  \ `plt.show()` 在笔记本中显示图表。\n\n最后，`show_results()` 函数调用带有表头和行列表的 `make_table` 并返回\
  \ HTML 元素，这将确保表格显示在笔记本中。\n\n为了创建一个界面和一个自动调用 `show_results` 函数的事件循环，我们使用从 `ipywidgets`\
  \ 导入的 `interact` 函数，并传入用户更改任何控件时要调用的函数名：\n\n```python\ninteract(show_results)\n\
  ```\n\n以下是完整的代码：\n\n```python\nfrom IPython.display import HTML\nfrom ipywidgets\
  \ import interact\nimport matplotlib.pyplot as plt\n\n%matplotlib inline\n\ndata={}\
