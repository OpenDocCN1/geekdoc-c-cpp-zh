  \n# 第三章：Python 运算符\n\nPython 运算符帮助我们操作操作的值。示例：\n\n10 * 34 = 340\n\n在上面的示例中，值 10\
  \ 和 34 是操作数，而 `*` 是运算符。Python 支持不同类型的运算符。\n\n### 算术运算符\n\n这些用于执行基础数学运算的运算符。它们包括乘法（`*`）、加法（`+`）、减法（`-`）、除法（`/`）、取模（`%`）以及其他。示例：\n\
  \n```python\n#!/usr/bin/python3\n\nn1 = 6\nn2 = 5\nn3 = 0\nn3 = n1 + n2\nprint(\"\
  和的值是: \", n3)\n\nn3 = n1 - n2\nprint(\"减法的结果是: \", n3 )\n\nn3 = n1 * n2\nprint(\"\
  乘法的结果是:\", n3)\n\nn3 = n1 / n2\nprint (\"除法的结果是: \", n3 )\n\nn3 = n1 % n2\nprint\
  \ (\"除后的余数是: \", n3)\n\nn1 = 2\nn2 = 3\nn3 = n1**n2\nprint (\"指数值是: \", n3)\n\n\
  n1 = 20\nn2 = 4\nn3 = n1//n2 \nprint (\"取整法的结果是: \", n3)\n\n```\n\n### 赋值运算符\n\n\
  \n\n\n这些运算符是赋值运算符 `=` 与其他运算符的组合。赋值运算符的一个良好例子是 `+=`。表达式 `p+=q` 意味着 `p=p + q`。表达式\
  \ `p/=q` 意味着 `p=p / q`。赋值运算符涉及赋值运算符与其他运算符结合。\n\n示例：\n\n```python\n#!/usr/bin/python3\n\
  \nn1 = 6\nn2 = 5\nn3 = 0\nn3 = n1 + n2\nprint (\"The value of n3 is: \", n3)\nn3\
  \ += n1\nprint (\"The value of n3 is: \", n3 )\nn3 *= n1\nprint (\"The value of\
  \ n3 is: \", n3 )\nn3 /= n1\nprint (\"The value of n3 \", n3 )\nn3 = 2\nn3 %= n1\n\
  print (\"The value of n3 is: \", n3)\nn3 **= n1\nprint (\"The value of n3 is: \"\
  , n3)\nn3 //= n1\nprint (\"The value of n3 is: \", n3)\n```\n\n该代码执行后将打印以下内容：\n\n\
  语句 `n3 = n1 + n2` 非常直观，因为我们只是将 `n1` 的值加到 `n2` 上。在表达式 `n3 += n1` 中，我们将 `n3` 的值加到\
  \ `n1` 上，然后将结果赋值给 `n3`。但注意，在上一个语句中，在向 `n2` 添加 `n1` 后，`n3` 的值变为 `11`。因此我们得到 `11+6`，结果为\
  \ `17`。之后，变量 `n3` 的新值将 `17`。表达式 `n3 *= n1` 意味着 `n3= n3 * n1`。这将是 `17 * 6`，结果为 `102`。这就是这些运算符在\
  \ Python 中的工作方式！\n\n## 成员运算符\n\n这些运算符用于测试元素是否在特定的元素序列中。元素序列可以是字符串、列表或元组。两个成员运算符包括\
  \ `in` 和 `not in`。\n\n如果在序列中找到了你指定的值，`in` 运算符返回真。如果序列中没有找到指定的元素，`not in` 运算符将求真。\n\
  \n示例：\n\n```python\n#!/usr/bin/python3\n\nn1 = 7\nn2 = 21\nls =  [10, 20, 30, 40,\
  \ 50 ]\nif  ( n1 in ls ):\n print (\"n1 was found in the list\")\nelse:\n print\
  \ (\"n1 was not found in the list\")\nif  ( n2 not  in ls ):\n print (\"n2 was not\
  \ found in the list\")\nelse:\n print (\"n2 was found in the list\")\nn3=n2/n1\n\
  if  ( n3 in ls ):\n print (\"n1 was found in the list\")\nelse:\n print (\"n1 was\
  \ not found in the list\")\n```\n\n该代码执行后将打印以下内容：\n\n`num1` 的值是 `7`。这不在我们的列表的一部分，这就是为什么使用\
  \ `in` 运算符返回假。这导致 `else` 部分被执行。`n2` 的值是 `21`。这不在列表中。这个表达式返回真，并执行表达式下的第一部分。21 除以\
  \ 7 等于 3。这个值不在列表中。使用最后一个 `in` 运算符为假，这就是为什么其下方的 `else` 部分被执行。\n\n## 身份运算符\n\n这些运算符用于比较两个内存位置的值。Python\
  \ 有一个名为 `id()` 的方法，它可以返回对象的唯一标识符。Python 有两个身份运算符：\n\n- `is`: 如果运算符两边的变量指向相似的对象，则该运算符为真；否则，为假。\n\
  \n- `is not`: 如果运算符两边的变量指向相似的对象，则该运算符为假；否则，为真。\n\n示例：\n\n```python\n#!/usr/bin/python3\n\
  \nn1 = 45\nn2 = 45\nprint ('The initial values are','n1=',n1,':',id(n1), 'n2=',n2,':',id(n2))\n\
  if  ( n1 is n2 ):\n print (\"1\\. n1 and n2 share an identity\")\nelse:\n print\
  \ (\"2\\. n1 and n2 do not share identity\")\nif  ( id(n1)  == id(n2)  ):\n print\
  \ (\"3\\. n1 and n2 share an identity\")\nelse:\n print (\"4\\. n1 and n2 do not\
  \ share identity\")\nn2 = 100\nprint ('The variable values are','n1=',n1,':',id(n1),\
  \ 'n2=',n2,':',id(n2))\nif  ( n1 is  not n2 ):\n print (\"5\\. n1 and n2 do not\
  \ share identity\")\nelse:\n print (\"6\\. n1 and n2 share identity\")\n```\n\n\
  该代码执行后将打印以下内容：\n\n注意，我对一些打印语句进行了编号，以便于区分。在第一次情况下，变量 `n1` 和 `n2` 的值是相等的。输出的第一条语句显示了变量各自的值及其唯一标识符。注意\
  \ `id(n1) == id(n2)` 为真。\n\n\n\n\n请记住，这类算法最适用于处理复杂数据。为了说明它的用法，我们将再次使用 `Scikit-learn`\
  \ 来提取一个开源数据集。我们将使用 `MNIST` 数字数据集，它包含 60,000 张用于训练数据的图片和另外 10,000 张用于测试的图片。请记住 `Scikit`\
  \ 并不是必须的，因为该数据集是对所有人开放的，你可以在多个网站上找到它。然而，这个工具让一切变得简单得多。此外，我们不会使用整个数据集。对于一个旨在说明该算法实际用途的简单演示来说，它太大了。因此，我们只提取\
  \ 1,000 个样本。不要忘记，样本数量越多，系统处理和分析所有内容的时间就越长。现在，让我们导入所需的：\n\n```python\nfrom sklearn.utils\
  \ import shuffle\nfrom sklearn.datasets import \nfrom sklearn.cross_validation import\
  \ train_test_split\nimport pickle\n\nmnist = pickle.load(open( \"mnist.pickle\"\
  , \"rb\" ))\nmnist.data, mnist.target = shuffle(mnist.data, mnist.target)\n```\n\
  \n这些是我们的准备步骤。我们导入了 `Scikit-learn` 以及我们需要的数据集。此外，我们使用了 `pickle` 模块，它处理被称为“序列化（pickling）的内容”。此功能将向你介绍\
  \ Python 对象序列化。这意味着你可以取一个对象并转换为我们可以存储的数据类型。此外，对象序列化还允许你进行反向操作，将存储的数据恢复到其之前的状态。该功能的目的是允许你通过网络通信数据结构。\n\
  \n下一步是将数据集缩减到我们想要的样本数量。现在，我们导入了整个集合。输入以下几行：\n\n```python\nmnist.data = mnist.data[:1000]\n\
  mnist.target = mnist.target[:1000]\nX_train, X_test, y_train, y_test = train_test_split(mnist.data,\
  \ mnist.target, test_size=0.8, random_state=0)\n```\n\n```python\nfrom sklearn.neighbors\
  \ import KNeighborsClassifier\n# KNN: K=10, 默认欧几里得距离测量\nclf = KNeighborsClassifier(3)\n\
  clf.fit(X_train, y_train)\ny_pred = clf.predict(X_test)\n```\n\n在这个代码块中，我们简单地应用了上面解释的理论。请注意，作为\
  \ `K` 距离的指标，我们使用了欧几里得距离。还有其他我们可以使用的类型，但作为初学者，你现在不需要担心它们。下一步是检查算法的性能。这是通过输入以下代码调用的分类报告来实现的：\n\
  \n```python\nfrom sklearn.metrics import classification_report\nprint (classification_report(y_test,\
  \ y_pred))\n```\n\n结果应该看起来所示：\n\n```\nprecision     recall      f1-score      support\n\
  0.00.68          0.90             0.78             79\n1.0           0.66      \
  \    1.00             0.79             95\n2.0           0.83          0.50    \
  \         0.62             76\n3.0           0.59          0.64             0.61\
  \             85\n4.0           0.5           0.6             0.60             75\n\
  5.0           0.76          0.5             0.64             80\n6.0           0.89\
  \          0.69             0.77             70\n7.0           0.76          0.83\
  \             0.79             76\n8.0           0.91          0.56            \
  \ 0.69             77\n9.0           0.61          0.75             0.67       \
  \      87\navg / total   0.73          0.70             0.70             800\n```\n\
  \n我们没有获得最好的性能，但对于这次练习的目的来说足够了。请记住，为了达到 0.9 以上的准确率，你必须对数据进行更好的预处理，并使用额外的算法进一步改进结果。尽管如此，让我们看看训练速度，同时也通过以下几行查看训练速度：\n\
  \n```python\n%timeit clf.fit(X_train, y_train)\nOut: 1000 loops, best of 3: 1.67\
  \ ms per loop\n\n%timeit clf.predict(X_test)\nOut: 10 loops, best of 3: 181 ms per\
  \ loop\n```\n\n你会发现这个算法的速度实际上非常快。这是它提供的最大优势之一，即使性能有所牺牲。到目前为止，我们只关注监督机器学习；然而，当你处理真实数据集时，仅应用这些算法是不够的。\n\
  \n# 第 5 章：创建与访问你的 Python 字典\n\nPython 字典通常由大括号 `{ }` 包。然而，在访问和赋值值时，使用了方括号 `[ ]`。要创建你自己的字典，可以从键\
  \ `dict` 开始：\n\n```python\ndict{ }\ndict['filename'] = ['values']\n```\n\n## 创建与访问你的\
