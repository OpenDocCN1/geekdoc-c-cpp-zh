  \ | 148.0 |\n| sour cream | 1.0 | 5.0 | 1.0 | 60.0 | 30.0 |\n\n## 添加用户交互\n\n在探索数据时，交互式地调整几个参数以寻找最优值通常很有用。IPython\
  \ notebook 允许通过嵌入到 notebook 中的简单用户界面来实现这种交互。这个用户界面相对有限 - 你无法创建复杂的组件布局，而且出于安全原因，某些用户界面功能（如选择和打开文件）是不可用的。我们稍后将探索创建真实的图形用户界面\
  \ (GUI) 程序。现在，让我们为 notebook 添加一些交互式工具。\n\n我们将创建一个 IPython notebook，使用我们的配料表计算菜肴的营养和能量含量。这道菜将包含鸡胸肉、面条和帕玛士士。用户将使用滑块调整每种原料的克数。Notebook\
  \ 将计算主要营养成分的以及整道菜的能量值 - 在表格中显示这些信息，并显示一个显示主要营养成分相对比例的饼图。\n\n为此，我们需要从库中导入一些设施：\n\n\
  * `HTML` 用于显示 HTML 格式的表格\n* `interact` 用于创建滑块，允许用户调整原料的量\n* `pyplot` 允许创建图表\n\n\
  我们还将使用 IPython 的“魔术”命令，告诉它将图表嵌入 notebook 中\n\n```python\n%matplotlib inline\n```\n\
