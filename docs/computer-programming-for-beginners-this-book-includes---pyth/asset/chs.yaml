  \ (RPG)](https://en.wikipedia.org/wiki/Role-playing_video_game)\n  需要很多场景来实现最佳效果，且不需要在线。\n\
  \n- [质数序列](http://whatis.techtarget.com/definition/prime-number)\n  打印第 `n` 个质数，其中\
