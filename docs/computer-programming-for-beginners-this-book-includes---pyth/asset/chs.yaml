  \ `n` 个斐波那契数，其中 `n` 是输入的数字。\n\n- [二进制转换](https://www.mathsisfun.com/binary-number-system.html)\n\
  \  你也可以尝试三进制、四进制等。\n\n## 中期测试（答案）\n\n请清晰写写每个问题的答案。\n\n1. 写出结束语句的标记。\n   a. `;`\n\
