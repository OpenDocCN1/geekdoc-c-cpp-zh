  \ for n in fields[1:]]\n        data[food]=numbers # 将食物信息添加到数据列表\nprint(data)\n\
  \ndef make_table(header,data):\n    # 构建 HTML 表格\n    html_string='<table border=\"\
  1\">'\n    html_string+='<tr style=\"background: #ccc;\"><th>'\n    # 创建表头行\n  \
  \  html_string+=''''</th><th style=\"width: 7em; text-align:right;\">'''.join(header)+\"\
  </th></tr>\"\n    for food in data:\n        food_list=[str(a) for a in food]\n\
  \        # 创建数据行\n        html_string+=\"<tr><td>\"\n        html_string+='''</td><td\
  \ style=\"width: 7em; text-align:right;\">'''.join(food_list)\n        html_string+=\"\
  </td></tr>\"\n    html_string+=\"</table>\"\n    # 从字符串创建一个 HTML 对象\n    return\
  \ HTML(html_string)\n\ndef get_share(food, quantity):\n    serving=data[food][4]\n\
