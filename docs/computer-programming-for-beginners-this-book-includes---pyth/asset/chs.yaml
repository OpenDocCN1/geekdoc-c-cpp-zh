  \ 欺骗\n\n`email` 欺骗\n\n## 第 8 章：部分基本功能\n\n文件文件系统操作\n\n## 第 9 章：接管与控制\n\n使用 `pastebin`\
  \ 通道\n\n\n\n\n一份带有基础练习的学习必备指南：面向数据分析和初学者黑客的 Python 编程快速上手课程\n\n# 描述\n\n在选择你想使用的编程语言时，你有许多不同的选择。有些语言能为你提供强大的功能。有些是专门为特定的操作系统设计的。而另一些则在处理网站或在线任务时表现最佳。但如果你想学习一种能够帮助提升你的编程体验并帮助你完成许多不同编程应用的最佳语言之一，那么你必须学习如何使用\
  \ Python。\n\nPython 将是一门非常出色的编程语言，可以帮助你在许多在线应用以及你想制作的程序中真正做到出色。对于初学者来说，它非常易用，事实上，它的设计初衷就是让那些从未编写过代码的初学者，同时仍然具备处理某些更复杂应用（如你想要探索的机器学习）所需的强度。\n\
  \n使用 Python 语言有许多不同的优势，这也是为什么许多人喜欢花时间学习如何使用这种语言。当你决定学习用 Python 编码时，你将享受到一些好处。\n\n\
  你可以使用许多不同的支持库。对于你需要的任何功能，你都能找到与 Python 兼容的扩展和库。这些库非常适合为你提供完成任何所需的编码任务所需的算法、函数等。你可以仅使用\
  \ Python 原带的传统库，也可以根据你想要做的项目类型使用一些其他扩展和库。\n\n这种编程语言的另一个优势是所有各种不同的集成功能。Python 对程序员来说是一件好事，因为它能够整合所谓的“企业级应用集成”（Enterprise\
  \ Application Integration）。这将非常有用，因为可以确保你可以处理不同的操作系统、不同的编程语言等。几乎没有什么是 Python 无法帮助你的了，所以学习如何使用它是非常棒的。\n\
  \nPython 还会在过程中为你提供更高的生产力。该语言被设计为面向对象的语言，并包含了许多不同的支持库来帮助你完成工作。由于这些资源以及该语言的易用性，程序员能够在更短时间内完成更多工作。这甚至可以帮助程序员在使用\
  \ Python 以及其他不同编程语言时享受更高的生产力。\n\n本指南将重点关注以下内容：\n\n* 为什么选择 Python\n* 数据分析 Python\
  \ – 基础\n* Python 运算符\n* 监督学习算法\n* 创建与访问你的 Python 字典\n* 介绍变量\n* 命名规范与注释\n* 处理输入\n\
  * 使用条件语句\n* Python 语言中的异常处理\n* 函数、类和方法\n* 使用线性回归进行预测\n* 替换与纠正单词\n* 使用 Jupyter notebook\
  \ 进行用户交互\n* 正则表达式\n* 使用 Python 进行数据可视化……以及更多！！！\n\n# 引言\n\n在计算机上运行 Python 已经被证明是成功的。作为\
  \ Python 初学者，保持开放的心态去接触新事物是关键。上述内容是确保你的计算机顺畅运行 Python 的步骤。\n\n保持专注，因为你正处于学习编程的旅途中。你不会一夜之间变得伟大。看到一个程序员变成百万富翁，或者一个程序员在一天编程中改变成千上万人的生活，是一件很棒的事情。\n\
  \n最终，这本书编写的目标不仅仅是教你 Python，而是广义的编程。\n\n如果你正在阅读这本书，意味着你已经读到了书的最后。送你一句话？\n\n当你制定了一个清晰且现实的学习计划时，计划就会变得可行。学习将完全按照你自己的节奏进行第一步是你的兴趣，这种兴趣导致你阅读了这本书，然后——采取行动！每天用新任务挑战自己。编程并没有看起来那么难，也没有人们描述的那么难。只要你准备好付出，没有什么是困难的。从基础开始吧。\n\
  \n大多数初学编程并想要学习的人都使用 Python。尽管大多数程序员说它是一种容易学习的程序，但这完全取决于你。如果你想在这领域获得成功，你就需要付出额外的努力。向专家提问，并随时做好准备并渴望学习。谁知道呢？这可能可能是学习世界上所有编程语言的第一步。保持开放的心态，你不会发现这其中有任何困难。\n\
  \n用它来做些什么。你完全可以将这本书作为参考，但它的编写目的并不非是为了成为参考书——这本书是为了教你编程的精髓，以及你开始用 Python 编程所需的一切，以及你作为初学者必须学会如何使用的语言基本工具。\n\
  \n# 第 1 章：为什么选择 Python\n\n开发者在 Python 编程语言中进行联合处理时（特别是 `CPython`，即用 C 语言编写的 Python\
  \ 参考实现）所面临的困难之一是 `GIL`（全局解释器锁）。`GIL` 机制是一种死锁机制，用于保护对 Python 对象的访问，防止在多个线程中同时执行 Python\
  \ 字节码。这种锁定主要是因为 `CPython` 的内存管理不是线程安全的。`CPython` 使用引用计数来实现其内存管理。这导致多个线程可以同时访问并执行\
  \ Python 代码；这种情况是不可取的的，我们说这种内存管理方式不是面向多线程管理的。为了解决这个问题，引入了 `GIL`，正如其名称所示，是一种锁，只允许一个线程访问代码和\
  \ Python 对象。然而，这意味着为了在 `CPython` 中实现多线程程序，开发者必须意识到 `GIL` 的存在并回避它。这就是为什么许多人在 Python\
  \ 中实现协同处理系统时会遇到问题。\n\n\n\n\n此外，Python 在编程社区正变得越来越流行。得益于用户友好的语法和良好的可读性，越来越多的人认为在开发中使用\
  \ Python 是相对容易的，无论是学习新编程语言的初学者、具有中等训练水平并搜索可用现代 Python 功能的用户，还是使用 Python 解决复杂问题的资深程序员。据估计，Python\
  \ 代码的开发速度可以比 `C / C ++` 代码快 10 倍。\n\n大量使用 Python 的开发者的出现得益于一个强大且不断成长的社区。每天都有 Python\
  \ 库和包被开发和发布，为各种任务和技术提供支持。目前，Python 支持极其广泛的编程领域——即软件开发、GUI 工作站、视频游戏设计、Web 和 Internet\
  \ 开发，以及科学和数值计算。近年来，Python 也已成为数据科学、大数据和机器学习领域的顶尖工具之一，与该领域的长期竞争者 `R` 并肩。\n\nPython\
  \ 提供的丰富开发工具促使越来越多的开发者开始使用 Python 编程，这使得 Python 更加流行和易于使用；我称之为 Python 的“良性循环”。DataCamp\
  \ 的研究主管 David Robinson 写了一篇关于 Python 惊人增长的博客文章，并称其为最流行的编程语言。\n\n然而，Python 是慢的，至少比其他流行的编程语言慢。这是因为\
  \ Python 是一种动态类型语言，其解释时的值并不存储在紧凑的缓冲区中，而是存储在分散的对象中。这是 Python 可读性和易用性的直接结果。幸运的是，有多种选项可以让你的\
  \ Python 程序运行得更快，其中并发是最困难的之一；而这正是我们将在书中要精通的内容。\n\n## 定制你的 Python 环境\n\n在继续之前，让我们先回顾一些关于配置书中将使用的必要工具的描述。\n\
  \n### 通用安装\n\n让我们看看为你的系统获取特定 Python 分发版及相应开发环境的实际过程：\n\n所有都可以从 `https://www.python.org/downloads/`\
  \ 获取自己的 Python 分发。\n\n尽管 `Python 2` 和 `Python 3` 版本都受到支持和维护，但在本书中我们将使用 `Python 3`。\n\
  \n对于本书，一个灵活的选项是 `IDE`（集成开发环境）。虽然在技术上可以使用最小的文本编辑器（如 `Notepad` 或 `TextEdit`）开发 Python\
  \ 应用，但使用专门为 Python 开发的 IDE 来读取和编写代码通常要容易得多。它们包括：`IDLE`、`PyCharm`、`Sublime Text`\
  \ 和 `Atom`。\n\n### 示例代码下载\n\n为了获取书中一直使用的代码，你可以从 `GitHub` 下载仓库，其中包含了书中描述的所有示例和项目代码：\n\
  \n要开始，请访问 `https://github.com/PacktPublishing/Mastering-Concurrency-in-Python`。\n\
  \n要下载相应的仓库，只需点击窗口右上角的 `Clone` 或下载按钮。选择 `Download ZIP` 将必要的压缩仓库下载到你的计算机：\n\n点击 `Download\
  \ ZIP` 下载必要的仓库\n\n解压下载的文件，以创建我们寻找的文件夹。该文件夹的名称应为 `Mastering-Concurrency-in-Python`。\n\
  \n### 发现-\n\n现在你已经学习了联合（joint programming）和并行编程的基础概念。这一切都与命令和指令的设计及结构化编程有关，以便程序的不同部分能够以某种有效的方式执行，同时共享相同的资源。由于某些命令和指令同时执行，可以节省时间，与传统的顺序编程相比，并行编程显著改进了程序的执行时间。\n\
  \n然而，在设计并行程序时，应该考虑各种因素。虽然有些特殊任务可以很容易拆分为可以并行执行的独立部分（惊人的并行任务），但另一些任务需要现有程序命令之间进行不同类型的协调，以便这些共享资源能够正确且高效地应用。还有一些任务本质上具有顺序处理的特性，这些任务无法应用联合处理和并行性来获得程序加速。你应该意识到这些任务之间的这种根本差异，以便能够仔细设计你的协同处理程序。\n\
  \n最近，发生了一种范式转变，这促进了现有编程宇宙中大多数方面联合处理的实现。现在，联合处理随处可见：桌面和移动应用、视频游戏、Web 和 Internet 开发、AI\
  \ 等。协作处理仍在增长，并预计在未来将继续增长。因此，对于任何有经验的程序员来说，理解联合处理和相关概念，以及如何将这些概念整合到他们的应用程序中，是至关重要的。\n\
  \n另一方面，Python 是最流行（如果不是最流行的）编程语言之一。它在大多数编程子领域都提供了选项。将协作处理与 Python 结合起来是编程中需要学习和掌握的重要主题之一。\n\
  \n# 第 2 章：用于数据分析的 Python – 基础\n\n现在我们已经准备好了一切，可以开始习惯这种编程语言。因此，我们将详细介绍基础语法、流程控制块和内在特性。所有这些主题将作为对新用户的语言介绍，或者作为对已有知识读者的提醒。\n\
  \n## Python REPL\n\n一旦完成 Python 安装，我们就可以通过其读取-评估-打印循环（REPL）立即开始交互式使用它。它像一个动态脚本工作，在其中你可以创建和修改变量并看到即时结果。\n\
  \nREPL 的主要优势是你可以立即开始实验。因此，它是测试语言基础语法的很好的工具。如果任何代码在 REPL 中运行时间过长：\n\n### 启动 REPL\n\
  \n要运行它，你只需要搜索“Python”或在命令行中输入 `python`：\n\n```\npython\n```\n\n### 界面\n\n乍看起来像另一个\
  \ CLI。最初它显示安装的 Python 版本的基本信息。\n\n### 输入字段\n\n输入字段由三大于 `>` 符号表示，它是输入命令/脚本的地方。\n\n\
  ## Python 基础 - 数据类型和运算符\n\n现在，让我们熟悉语言的基础类型和操作。\n\n### 注释\n\n任何以 `#` 开头的命令都会被完全忽略。\n\
  \n### 基础数据类型\n\n与其他许多语言一样，Python 实现了所有标准数据类型。\n\n如果你想知道 Python 中任何对象的类型，只需使用 `type(object)`，将显示结果类型（它是\
  \ Python 中的一个类）。\n\n### 数值和布尔数据类型\n\n| 类型 |  | 示例 |\n| :--- | :--- | :--- |\n| int\
  \ | 整数类型 | 354, 56, -42 |\n| float | 浮点类型可以用科学计数法表示。1e3 = 1x103=1000。 | 8.5, 0.0,\
  \ -1.7e-5 |\n| bool | 布尔值 | True, False |\n\n### 字符串\n\nPython 中的字符串用双引号（“…”）或单引号（‘…’）表示。如果你想在字符串中使用引号，可以使用\
  \ `\\` 进行转义，或者在定义时使用不同的引号。\n\n\n\n\nPython 中的字符串由 `str` 类表示。与某些编程语言不同，Python 并没有字符类型。因此，单个字符也是一个字符串。此外，字符串具有许多内置方法，方便对其进行操作和转换。这些方法中的大部分将在书后的章节介绍。此外需要注意的是，字符串是不可变对象，因此它们的值不能被修改。如果你需要一个不同的字符串，应该创建一个新的。你可以使用\
  \ `str()` 函数将不同类型转换为字符串。\n\n### None 类型\n`None` 关键字代表 Python 中的 `NoneType`。这是一个表示“无值”的类型。通常，它用于表示一个函数没有产生任何值。\n\
  \n### 变量赋值\n赋值表示将名称绑定到值或表达式。与许多编程语言一样，变量赋值使用 `(=)` 运算符完成。变量名对大小写敏感，且语言的关键字不能作为变量名。你可以进行简单赋值、多赋值和相同值赋值。\n\
  \n### 算术运算符\n大多数算术运算符在数值值之间的工作方式与预期一致。\n\n| 运算符 | 描述 | 示例 |\n| :--- | :--- | :---\
  \ |\n| `+` | 两个值相加 | >>> `3 + 58` |\n| `-` | 数值相减 | >>> `8 - 44` |\n| `*` | 数值相乘\
  \ | >>> `21 * 242` |\n| `/` | 数值相除，返回值始终为浮点数。 | >>> `15 / 27.5` |\n| `//` | 整除，忽略结果中的任何小数部分\
  \ | >>> `15 / 27` |\n| `%` | 取模，返回除法的余数 | >>> `6 % 42` |\n| `**` | 幂运算 | >>> `2**8256`\
  \ |\n| `( )` | 决定运算优先级顺序 | >>> `(1 + 3) / 22.0` |\n\nOBS1.:`bool` 与 `int/float`\
  \ 之间的操作会自动转换为数值类型（`int/float`）。其中 `True` 为 1，`False` 为 0。\n\nOBS2.:`float` 与 `int`\
  \ 之间的操作会自动转换为 `float` 类型。\n\nOBS3.:运算符 `+` 和 `*` 对 `str` 类型有特殊效果。\n\n例如：\n如上面的示例所示，`str*int`\
  \ 操作会重复字符串字符串值多次，而 `str+str` 则会拼接字符串。\n\n### 优先级与结合性\n每个运算符在表达式中都有优先级。换句话说，某些操作先于其他操作执行。顺序如下所示：\n\
  \n| 顺序 | 运算符 | 描述 |\n| :--- | :--- | :--- |\n| 1 | `( )` | 括号 |\n| 2 | `**` | 幂\
  \ |\n| 3 | `-x, +x` | 一元负或加 |\n| 4 | `*, /, //, %` | 乘法、除法、整除、取模 |\n| 5 | `+, -`\
  \ | 加法、减法 |\n\n相同优先级的运算符根据其结合性顺序求解。\n\n| 结合性 | 运算符 | 示例 |\n| :--- | :--- | :---\
  \ |\n| 从左到右 | `( ), **, *, /, //, %, +, -` | >>> `5/2%20.5` |\n| 从右到左 | `**` | >>>\
  \ `2**2**3256` |\n\n这意味着任何表达式都遵循此顺序进行解析。首先是优先级表中的顺序，然后是结合性表中的顺序。\n\n### 自增自减\n经常需要增加变量的值。有一个小小的快捷方法可以使用之前见过的运算符来执行此操作。快捷操作及其表示形式如下所示。\n\
  \n| 运算符 | 示例 | 等价表示 |\n| :--- | :--- | :--- |\n| `+=` | `x += 2` | `x = x + 2` |\n\
  | `-=` | `x -= 3` | `x = x – 3` |\n| `*=` | `x *= 4` | `x = x * 4` |\n| `/=` | `x\
  \ /= 5` | `x = x / 5` |\n| %==` | `x %= 6` | `x = x % 6` |\n\n### 比较运算符\n在 Python\
  \ 中，可以使用比较运算符对值或表达式进行比较，该评估的结果为 `bool` 类型。\n\n| 运算符 | 含义 | 示例 |\n| :--- | :--- |\
  \ :--- |\n| `>, <` | 大于/小于 | >>> `3 > 2True` |\n| `>=, <=` | 大于或等于 | >>> `4 <= 2\
  \ + 2True` |\n| `==` | 等于 | >>> `6 == 2 * 3True` |\n| `!=` | 不等于 | >>> `3 != 3False`\
  \ |\n\nOBS.:你可以在 Python 中比较多个事物，但要小心比较的结果。例如，字符串可以进行比较，但结果是它们字符的 ASCII 值之间的比较。因此，在对非数值类型上使用这些运算符时要加小心。\n\
  \n### 布尔逻辑\n当你想要组合多个布尔逻辑操作时，可以使用 `and`、`or`、`not` 关键字。与布尔值一起使用时，运算符 `and` 仅在两者都为真时返回真，运算符\
  \ `or` 在至少一个为真时返回真，而 `not` 则反转布尔值。\n\n\n\n\n导航到脚本文件夹（`myscript.py` 文件所在）。\n\n3.\n\
  \n运行命令：\n\n脚本中的所有代码都将在当前终端窗口中执行。\n\n尝试运行下面的示例。将它们的代码粘贴到文本编辑器中，并保存为 `example1.py`\
  \ 和 `example2.py` 文件。然后按照上面的说明查看代码输出。\n\n![image](img/00001.jpeg)\n\n调用模块后，它们的指令将执行执行。\n\
  \nOBS.：在 Visual Studio Code 中，可以使用运行按钮直接在 IDE 中执行脚本。\n\n## 条件语句\n\n与其他语言一样，`if`\
  \ 语句下的代码仅在表达式被求值结果为 `True` 时才会执行。此外，可以使用可选的 `else` 关键字在语句为 `False` 时执行另一段代码。总体格式所示。\n\
