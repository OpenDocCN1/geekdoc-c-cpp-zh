  \n从 `pairplot` 中，我们可以快速推断出小费并不随着人数的增加而增加，考虑到最大的小费出现在人数为 3 的分组。这一推断可以通过观察图 2,3 和\
  \ 3,2（行、列）找到。\n\n你可能会想，我们是否也可以按类别查找数据集中的人口规模？嗯，`countplot` 在这方面非常有用。在像美国报告之类的文档中看到这种图表很常见。它基本上显示了一个条形图，高度对应于类别的人口数量。\n\
