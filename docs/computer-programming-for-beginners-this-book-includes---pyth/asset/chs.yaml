- "# 初学者计算机编程指南：本书包含 - Python、C++、Linux 入门指南以及 Kali Linux 黑客攻击。通过此合集循序渐进地学习编程\n\n\n\
  \n![](img/cover.jpeg)\n\n\n\n\n# 使用 KALI LINUX 进行黑客攻击\n\n# 描述\n\n## 简介\n\n## 第 1\
  \ 章：黑客攻击基础\n\n## 第 2 章：开始上手\n\n## 第 3 章：获取密码\n\n### 安装\n\n## 第 4 章：黑客指南\n\n### 第\
