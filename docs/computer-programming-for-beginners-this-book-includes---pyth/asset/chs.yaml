  \ for a in data[food][:4]]\n    return nutrients\n```\n\n首先，查找存储为最后一个元素的原料份量。然后，对碳水化合物、脂肪和热量的每份值使用列表推导式，将其乘以量，保留两位小数并返回结果。\n\
  \n接下来，我们需要创建一个在用户调整原料量时被调用的函数。该函数将使用交互组件作为参数。参数的默认值允许 IPython 猜测预期的值以及使用哪些组件。我们想要调整原料的克数，这些值应该是\
