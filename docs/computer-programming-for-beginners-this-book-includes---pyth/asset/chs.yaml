  10. `Math::Add()`\n\n# 第 15 章：C++ 中的多线程应用程序\n\n如果你是 C++ 编程专家 [截略]... 当你使用 C++ 创建跨平台软件时，经历过的最大挑战之一就是关于如何正确处理线程。由于许多系统有不同的多线程方法，你的源代码可能会因为所有定义每个平台行为的各种预处理器条件而变得混乱。C++\
  \ 有一种称为 `std::thread` 的东西。\n\n好处是，任何 C++ 编译器都可以实现这种线程。所以如果你被迫使用 Dev-C++，那么现在是时候考虑其他东西了。让我们假设现在\
  \ [...\n\n## 什么是线程？\n[截略]...\n\n### 消费，生产\n多线程最流行的例子之一是生产者消费者模型。换句话说，有一个线程释放值，另一个线程接收这些值。在这个例子中，你会意识到有三个相关的结构。这三个线程解释如下：\n\
  \n* `std::mutex`：代表单个互斥锁。它是一个访问给定区域的对象。\n* `std::lock_guard`：锁定作用域内的互斥锁。一旦它离开作用域，就会被移除。\n\
  * `std::thread`：显示单个线程。\n\n[截略]...\n\n### 两个任务：一个进程\n如果你正在编写并行软件怎么办？所使用的示例需要并行构建两个独立值的独立函数。这是使用\
  \ `Future` 对象来完成异步计算的最佳情况。\n\n`future` 是一个确保正确值存在的对象（取决于计算类型）。这个对象类似于一个占位符值。它帮助程序员启动计算并确认已产生的结果。\n\
  \n准确来说，异步结果生成了 future 对象。`std::promise`、`std::async` 和 `std::packaged` 代表了允许实现 `get_future()`\
  \ 方法的接口。\n\n* `std::async`：这是一种高级方法，它为未来提供值并产生最少的灵活性。\n* `std::promise`：它向未来呈现值。\n\
  * `std::packaged_tasks`：它是人们交付未来值的最佳方式之一。\n\n# 第 16 章：与 bug 的作战\n\n\n\n\n## 开发清晰且一致的编码风格\n\
  \n通过选择一致且清晰的方式编写 `C++` 程序，不仅可以提高其他程序员阅读你程序的易用性，还能减少编码错误。\n\n因此，当你阅读到遵循既定风格的整洁且清晰的代码时，你只需要花一点的时间来解析\
  \ `C++` 语句的语法。这能让你留出大量的精力来决定你的程序将执行什么以及如何执行。一个良好的编码风格应该具有以下特征：\n\n1.  根据其名称理解 `function`（函数）、`class`（类）和\
  \ `object`（对象）是如何使用的。\n2.  区分对象名、函数名和类名。\n3.  区分预处理器符号与 `C++` 符号。\n4.  在查找代码块时，应保持在同一层级内进行搜索。\n\
  \n此外，你必须为你的模块头开发一种标准格式，并提供与 `classes`（类）、`functions`（函数）、作者-日期以及关于修改历史的信息。\n\n###\
  \ 提示\n所有参与单人项目的程序员都应该使用相同的编码风格。用不同编码风格编写的程序会让人困惑并显得不专业。\n\n## 开启警告和错误信息\n\n`C++`\
  \ 语言的语法提供了检查错误的能力。当编译器遇到难以解析的结构时，它除了显示消息外别无可做。它会尝试同步并备份源代码。有时这个过程是成功的，但它不会创建可执行文件。这将迫使程序员处理所有的错误信息。\n\
  \n尽管如此，一旦 `C++` 程序发现一个它可以运行但看起来很奇怪的结构，它会直接发送一条警告信息。之所以这样做是因为 `C++` 语言完全清楚你想要什么，因此它会继续并构建一个可执行文件，帮助你忽略警告。然而，如果你不想被骚扰，可以禁用警告。\n\
  \n### 提示\n禁用警告是一个非常糟糕的主意。这就像是断开汽车上的发动机故障检查指示器。记住，忽视问题不是解决方案。\n\n## 对代码进行注释\n\n当人们对代码进行注释时，可以防止错误。养成在编写代码时注释的习惯，而不是等程序运行正常后再回来注释。注释是帮助你理解自己正在尝试做什么的极佳方法。在修改程序时，简短的注释更好。\n\
  \n## 有限的可见性\n\n减少 `class` 内部成员对外部世界的访问性是面向对象编程的关键部分。`class` 必须考虑它的成员。如果 `class`\
  \ 出现任何问题，那就是程序员的责任。\n\n有限的可见性要求数据成员保护 `class` 之外的访问。简而言之，数据成员应该被保护。此外，所有应用程序软件不应感知的成员函数都必须被保护。\n\
  \n## 监控堆内存\n\n忘记监控 `heap`（堆）`memory`（内存）是许多发布程序致命错误的主要来源之一。这又是人们跟踪的最困难的问题之一，因为这类错误难以定位和删除。大多数情况下，它们存在于你购买的程序中。这需要你运行程序许多小时后问题才会开始出现。根据一般原则，程序员需要分配和释放\
  \ `heap` 内存。\n\n## 使用异常修复错误\n\n为了处理 `C++` 语言中的错误，引入了异常机制。通常情况下，发送错误指示器比返回错误标志要好。\n\
  \n### 提示\n对于真实的错误使用异常。从一个发送了某事未工作的指示器的 `function` 中抛出异常是无关的。\n\n## 在删除所指向的内容后移除指针\n\
  \n确保在删除指针所指向的内容后移除 `pointers`（指针）。你通过为 `pointers` 分配 `nullptr` 值来实现这一点。你很快就会学到这一点。你可能会很容易发现自己在使用返回的内存块。\n\
