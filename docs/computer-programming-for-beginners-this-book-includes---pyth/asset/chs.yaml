  \n[content]\n\n| [0] | [1] | [2] | [3] | [4] |\n| :--- | :--- | :--- | :--- | :---\
  \ |\n| `myarray` | `[0]` | | | |\n| `[1]` | | `y` | | |\n| `[2]` | | `x` | | |\n\
  \n标记为 ‘x’ 的元素是 `myarray[2][1]`，而标记为 ‘y’ 的元素是 `myarray[1][2]`。\n\n在应用方面，数组对于创建结构化数据以及表示二维字段（例如扫雷游戏、国际象棋盘和井字跳棋的棋盘）非常有效。\n\
  \n## 将数组传递给其他函数\n\n在 C++ 语言中，没有办法将整个数组传递给另一个函数并将其作为参数。然而，函数参数可以接受数组的地址，这意味着它可以从源访问本地值。这在本质上是相同的过程，并且实际上通过消除了保存新一组数据的需求来节省了内存。\n\
  \n为了实现这一点，可以在函数的参数中声明数组类型——但只能带有未定义的索引。换句话说，这意味着函数参数可以接受发送给它的任何数组，无论其索引大小如何。然而，要发送的数组的数据类型必须与函数参数的数据类型匹配。\n\
  \n例如，你可以使用以下语法初始化函数：\n\n```cpp\nvoid arrayfunction (int array[])\n```\n\n例如，你可以使用语法从单独的函数初始化数组：\n\
  \n```cpp\nint arraytopass [] = {1, 2, 3};\n```\n\n接下来，你可以使用语句将这些值传递给 `arrayfunction`：\n\
  \n```cpp\narrayfunction (arraytopass);\n```\n\n这里是一个示例程序，其中一个函数从 `main` 函数打印数组的元素：\n\
  \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nvoid arrayfunction (int\
  \ myarray[], int sequence) {\n    for (int n = 0; n < sequence; ++n)\n        cout\
  \ << myarray[n] << \" \";\n    cout << \"\\n\";\n}\n\nint main () {\n    int arraytopass[]\
  \ = {1, 2, 3, 4, 5};\n    arrayfunction (arraytopass, 5);\n}\n```\n\n在这个特定的示例中，来自\
  \ `main` 函数的数组 `arraytopass[]` 被传递给了 `arrayfunction`，同时传递了一个匹配的整数值 `sequence`。为了解释这些表达式的相关性，请查看\
  \ `arrayfunction`。以下是对语句的进一步观察：\n\n```cpp\narrayfunction (int myarray[], int sequence)\n\
  ```\n\n在初始化 `arrayfunction` 时，使用了参数 `myarray[]` 和 `sequence`。`sequence` 值非常重要，因为函数使用了一个根据元素数量运行的循环。由于元素的数量将从另一个函数（在本例中为\
  \ `main` 函数）决定，在初始化 `arrayfunction` 时，变量 `sequence` 的值被留空。因此，它可以接收来自另一个函数的任何整数值。\n\
  \n```cpp\nint arraytopass[] = {1, 2, 3, 4, 5};\narrayfunction (arraytopass, 5);\n\
  ```\n\n在 `main` 函数中，数组 `arraytopass[]` 与它的元素一起被初始化。注意数组初始化语句随后的语句。这就是调用 `arrayfunction`\
  \ 的地方。这也是从 `main` 函数传递与 `arrayfunction` 中的参数匹配的表达式的地方。请看下面的图表：\n\n![00001.jpeg](img/00002.jpeg)\n\
  \n```cpp\nvoid arrayfunction (int myarray[], int sequence)\narrayfunction (arraytopass,\
  \ 5);\n```\n\n最后，`sequence` 的值对应于 `arraytopass[]` 中的元素数量。这是因为函数利用了一个基础循环，按顺序输出数组中的每个元素。在这个特定的示例中，你应该将\
  \ `sequence` 的值设置为 5，因为数组中总共有 5 个元素。\n\n# 第 9 章：常量与字面量\n\n常量指的是一个不能改变的值。字面量是最常见的常量类型。这些被用于指定字面量的类型。有不同类型的字面量，分类如下所示。整数字面量可以是十进制、八进制或十六进制。整数字面量还可以带有后缀\
  \ `U` 和 `L`，分别表示无符号和长型。\n\n### 下面程序用于展示我们定义常量的方法。\n\n```cpp\n#include <iostream>\n\
  int main() {\n    const float f=3.14; // 这用于定义一个浮点常量\n    const int i=3;     //\
  \ 这用于定义一个整数常量\n    std::cout << \"The value of the floating constant is \" << f\
  \ << std::endl;\n    std::cout << \"The value of the integer constant is \" << i\
  \ << std::endl;\n    // f=4.15;\n    // i=4;\n    return 0;\n}\n```\n\n通过此程序，输出如下：\n\
  The value of the floating constant is 3.14\nThe value of the integer constant is\
  \ 3\n\n现在让我们来看另一个例子，可以证实我们对常量的理解。\n\n### 下面程序用于展示使用常量时的错误。\n\n```cpp\n#include <iostream>\n\
  int main() {\n    const float f=3.14;\n    const int i=3;\n    std::cout << \"The\
  \ value of the floating constant is \" << f << std::endl;\n    std::cout << \"The\
  \ value of the integer constant is \" << i << std::endl;\n    f=4.15;\n    i=4;\n\
  }\n```\n*(注：由于原文文本中存在大量重复段落，此处翻译已遵循“不要重复输出原文”的原则，仅对提供的文本内容进行翻译。若原文本身存在重复，翻译将按行逐一对应。由于篇幅，我将处理原文中出现的重复部分以确保逻辑的完整性。)*\n\
  \n\n\n\n\n# 字符字面量\n\n字符字面量包含在单引号内。此外，除了定义普通字符外，你还可以定义转义序列。例如，如果你想要一个换行字符，可以将该字符定义为\
  \ `\\n`。\n\n下面是各种转义序列的表格。\n\n### 转义序列\n\n| 转义序列 | 含义 |\n| :--- | :--- |\n| `\\\\\
  ` | 定义了 `\\` 字符 |\n| `\\'` | 定义了 `'` 字符 |\n| `\\\"` | 定义了 `”` 字符 |\n| `\\?` | 定义了\
  \ `?` 字符 |\n| `\\a` | 定义了警报或铃声 |\n| `\\b` | 定义了退格字符 |\n| `\\f` | 定义了分页符 |\n| `\\\
  n` | 定义了换行字符 |\n| `\\r` | 定义了回车字符 |\n| `\\t` | 定义了水平制表符 |\n| `\\v` | 定义了垂直制表符 |\n\
  \n以下程序用于演示字符字面量。\n\n```cpp\n#include <iostream>\nint main() {\n    //这用于定义一个字符字面量\n\
  \    char c='B';\n    std::cout << \"The value of the floating constant is \" <<\
  \ c << std::endl;\n    std::cout << \"An example of the tab and new line escape\
  \ sequence\\tis\\nshown below\";\n    return 0;\n}\n```\n\n运行此程序，输出如下：\n\nThe value\
  \ of the floating constant is B\n\nAn example of the tab and new line escape sequence\
  \      is\nshown below\n\n# 字符串字面量\n\n字符串字面量无非是一系列字符。\n\n### 以下程序用于演示字符串字面量。\n\n\
  ```cpp\n#include <iostream>\nint main() {\n    std::cout << \"An example of a string\
  \ literal \\tis\\nshown below\";\n    return 0;\n}\n```\n\n# 第 10 章：有符号与无符号\n\n\
  ## 数据类型\n\n对于某些数据类型，如 `char` 和 `integer`，你还有进一步的分类：\n\n* 一种是将将整数拆分为短整数和长整数。\n* 另一种是能够为值添加符号，以指示它是有符号值还是无符号值。\n\
  \n### 短、长、有符号和无符号的数据类型范围\n\n| 类型 | 范围 |\n| :--- | :--- |\n| `char` | -128 到 127\
  \ 或 0 到 255 |\n| `unsigned char` | 0 to 255 |\n| `signed char` | -128 to 127 |\n\
  | `int` | -2147483648 to 2147483647 |\n| `unsigned int` | 0 to 4294967295 |\n| `signed\
  \ int` | -2147483648 to 2147483647 |\n| `short int` | -32768 to 32767 |\n| `unsigned\
  \ short int` | 0 to 65,535 |\n| `signed short int` | -32768 to 32767 |\n| `long\
  \ int` | -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807 |\n| `signed long\
  \ int` | -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807 |\n| `unsigned\
  \ long int` | 0 to 18,446,744,073,709,551,615 |\n| `float` | +/- 3.4e +/- 38 |\n\
  | `double` | +/- 1.7e +/- 308 |\n\n### 以下程序用于演示如何在 C++ 中定义无符号和有符号值。\n\n```cpp\n\
  #include <iostream>\nint main() {\n    unsigned char c1=244;\n    signed char c2=-100;\n\
  \    unsigned int i1=1;\n    signed int i2=-11;\n    std::cout << \"An example of\
  \ an unsigned character value is \" << int(c1) << std::endl;\n    std::cout << \"\
  An example of a signed character value is \" << int(c2) << std::endl;\n    std::cout\
  \ << \"An example of an unsigned integer value is \" << i1 << std::endl;\n    std::cout\
  \ << \"An example of a signed integer value is \" << i2 << std::endl;\n    return\
  \ 0;\n}\n```\n\n运行此程序，输出如下：\n\nAn example of an unsigned character value is 244\n\
  \nAn example of a signed character value is -100\n\nAn example of an unsigned integer\
  \ value is 1\n\nAn example of a signed integer value is -11\n\n### 以下程序用于演示如何在 C++\
  \ 程序中使用短整数和长整数。\n\n```cpp\n#include <iostream>\nint main() {\n    short int i1=1;\n\
  \    long int i2=110000000;\n    std::cout << \"An example of a short integer is\
  \ \" << i1 << std::endl;\n    std::cout << \"An example of a long integer is \"\
  \ << i2 << std::endl;\n    return 0;\n}\n```\n\n# 第 11 章：类\n\n类是面向对象编程的核心。类就像是一个蓝图，定义了对象将具有的属性和行为。在\
  \ C++ 中，我们使用 `class` 关键字来定义类。类可以包含变量（属性）和函数（方法）。\n\n下面是一个简单的类示例：\n\n```cpp\nclass\
  \ Animal {\npublic:\n    string name;\n    void speak() {\n        std::cout <<\
  \ name << \" says woof! Woof!\" << std::endl;\n    }\n};\n\nint main() {\n    Animal\
  \ myDog;\n    myDog.name = \"Buddy\";\n    myDog.speak();\n    return 0;\n}\n```\n\
  \n在这个例子中，`Animal` 是一个类，`myDog` 是该类的一个实例（对象）。`name` 是类的属性，而 `speak()` 是类的方法。`public`\
  \ 是一个访问修饰符，意味着这些成员可以从类外部访问。\n\n## 访问修饰符\n\n访问修饰符决定了类成员的访问权限。C++ 中主要的访问修饰符有：\n\n\
  *   `public`：成员可以从类的任何地方访问。\n*   `private`：成员只能在类内部访问。这是类默认的访问权限。\n*   `protected`：成员可以在类内部以及其派生类中访问。\n\
  \n```cpp\nclass Secret {\nprivate:\n    int secretNumber;\npublic:\n    void setSecret(int\
  \ s) {\n        secretNumber = s;\n    }\n    int getSecret() {\n        return\
  \ secretNumber;\n    }\n};\n```\n\n在这个例子中，`secretNumber` 是私有的，因此不能在 `main` 函数中直接访问。我们需要通过公共的\
  \ `setSecret` 和 `getSecret` 方法来操作它。\n\n## 继承\n\n继承允许一个类（派生类）获得另一个类（基类）的属性和方法。这有助于代码复用。\n\
  \n```cpp\nclass Animal {\npublic:\n    void eat() {\n        std::cout << \"I am\
  \ eating...\" << std::endl;\n    }\n};\n\nclass Dog : public Animal {\npublic:\n\
  \    void bark() {\n        std::cout << \"I am barking!\" << std::endl;\n    }\n\
  };\n\nint main() {\n    Dog myDog;\n    myDog.eat(); // 调用继承自基类的方法\n    myDog.bark();\n\
  \    return 0;\n}\n```\n\n在这个例子中，`Dog` 继承自 `Animal`。\n\n## 多态\n\n多态允许我们通过基类指针或引用具有相同接口但不同实现的类对象。这通常通过虚函数来实现。\n\
  \n```cpp\nclass Shape {\npublic:\n    virtual void draw() {\n        std::cout <<\
  \ \"Drawing a shape\" << std::endl;\n    }\n};\n\nclass Circle : public Shape {\n\
  public:\n    void draw() override {\n        std::cout << \"Drawing a circle\" <<\
  \ std::endl;\n    }\n};\n\nclass Rectangle : public Shape {\npublic:\n    void draw()\
  \ override {\n        std::cout << \"Drawing a rectangle\" << std::endl;\n    }\n\
  };\n\nint main() {\n    Shape* shape1 = new Circle();\n    Shape* shape2 = new Rectangle();\n\
  \n    shape1->draw(); // 输出 Drawing a circle\n    shape2->draw(); // 输出 Drawing\
  \ a rectangle\n\n    delete shape1;\n    delete shape2;\n    return 0;\n}\n```\n\
  \n\n\n\n\n这通常被认为是一种坏习惯，所以我们将像这样重写该类：\n\n```cpp\nclass animal {\n    private:\n \
  \       string name;\n}\n```\n\n修改类内值的最佳实践方法是使用 get/set 方法。如果你实现了 get/set 方法，该类看起来将如下所示：\n\
  \n```cpp\nclass animal {\n    private:\n        string name;\n    public:\n    \
  \    string getName() {\n            return this->name;\n        }\n        void\
  \ setName(string name) {\n            this->name = name;\n        }\n}\n```\n\n\
  现在，在你的 `main` 方法中，在声明了任何 `animal` 实例后，不要直接修改它的名称，而是应该使用下面的 get/set 方法（假设你的 `animal`\
  \ 实例名为 `dog`）：\n\n```cpp\ndog.setName(\"dog\");\n```\n\n然后，你可以通过在 `main` 方法中打印名称来测试这一点：\n\
  \n```cpp\ncout << \"The name of my favorite animal is: \" << dog.getName() << \"\
  \\n\";\n```\n\n这些方法的工作原理是通过类内部的方法返回或设置变量的值。`this->` 被称为 `this` 指针，它指向类给定实例的变量。每个对象都可以访问自己的变量，并可以通过\
  \ `this` 指针直接修改它们。\n\n无论如何，你的代码应该运行得非常完美。但如果你不想为每个类的每个实例都通过 get/set 方法呢？那么，你可以使用所谓的初始化函数。修改你的类，使其看起来如下所示：\n\
  \n```cpp\nclass animal {\n    private:\n        string name;\n    public:\n    \
  \    animal(string name) {\n            this->name = name;\n        }\n        string\
  \ getName() {\n            return this->name;\n        }\n        void setName(string\
  \ name) {\n            this->name = name;\n        }\n}\n```\n\n现在，在你的 `main` 函数中，删掉原来的\
  \ `animal x` 后面跟着 `x.setName(\"name\")` 函数的代码块。当你创建一个初始化函数时，你可以从一开始就设置某些变量。例如，由于你的初始化函数接收参数\
  \ `name`，你可以在声明变量时对其进行声明，从而规避 `setName` 操作。看这个示例代码：\n\n```cpp\nanimal dog(\"dog\"\
  );\nanimal elephant(\"elephant\");\nanimal bird(\"bird\");\n```\n\n这些都是类 `animal`\
  \ 的独立实例，得益于函数初始化，它们的名称在没有使用 set 函数的情况下就已经设置了。它可以接受你需要的任意数量的参数。这使得创建新对象变得极其简单，整个过程也非常精简。\n\
  \n现在我们已经简单说了一下关于声明对象之类的内容，让我们更多地谈谈对它们可以做的具体操作。这里的对象 `animal` 显然代表动物。我们可以为整个类设置一组它们可以执行的方法。让我们思考一下每种动物都会做什么。每种动物都会睡觉、进和喝水，对吧？所以，将这些包含在我们的类中并不太突兀，这样\
  \ `animal` 类的每个成员对象都能执行这些方法。\n\n假设我们有两种特定类型的食物：肉类和植物，它们也都由各自对应的对象表示。我们可以为它们创建两个不同的函数：\n\
  \n```cpp\neat(plant p) {\n    // code\n}\neat(meat m) {\n    // code\n}\n```\n\n\
  尽管它们共享同一个名称，但你可以根据放入函数调用中的对象的类型来调用其中任何一个，并且它们都会对你包含的参数执行各自的代码。这就是函数重载。这是面向对象编程中的一项基本技术，将帮助你创建出功能强大且清晰的代码集，便于人们使用。因为在我们学习学习类时，创建大量类型是很繁琐的，让我们就将\
  \ `eat` 写成一个不接受参数的 `void` 函数吧。你的代码看起来应该是这样的：\n\n```cpp\nclass animal {\n    private:\n\
  \        string name;\n    public:\n        animal(string name) {\n            this->name\
  \ = name;\n        }\n        string getName() {\n            return this->name;\n\
  \        }\n        void setName(string name) {\n            this->name = name;\n\
  \        }\n        void eat() {\n            // code\n        }\n}\n```\n\n# 第\
  \ 12 章：深层概念\n\n当 Bjarne Stroustrup 将 C++ 设计为一种语言时，它实际上是带有类的 C。结果，人们可以做一个并不大胆的假设\
  \ C 拥有丰富的特性。这是 100% 正确的。我们应该考虑继承。这是一个允许类从父类中提取特征的概念。例如，`dog` 类可以继承 `animal` 类。\n\
  \n为了实现继承，我们必须执行以下操作：\n\n```cpp\nclass dog : public animal {\n    // code\n};\n```\n\
  \n现在，让我们尝试周围的一些操作。首先，在 `animal` 类上方，创建一个不接受参数的构造函数，并将 `this->name` 设置为空字符串。然后回到\
  \ `dog` 类并创建一个模拟构造函数，但在这里，将 `this->name` 设置为 \"dog\"。不要忘记让你的构造函数为公有（public）。\n\n\
  完美。从技术上说，这正是我要求你做的。但是，如果你尝试编译它，它是不起作用的。你会收到提示说 `animal::name` 是私有的，这些变量是无法修改的。这意味着在我们的\
  \ `animal` 类代码中，我们需要做这一关键更改：\n\n```cpp\nclass animal {\n    private:\n        string\
  \ name;\n    [...]\n```\n\n需要变为\n\n```cpp\nclass animal {\n    protected:\n    \
  \    string name;\n    [...]\n```\n\n\n\n\n这是因为为了让子对象能够访问该变量，我们必须将父类函数中该变量的访问修饰符设置为\
  \ `protected`。现在，子类可以访问并修改该变量，但程序中的其他任何函数无法访问。\n\n由于所有的狗都是动物，但并不是所有动物都是狗，我们可以在这里定义特定的函数，狗会执行这些函数，而其他动物显然不会。\n\
  \n回到你的 `dog` 类，在 `public` 访问修饰符下创建一个名为 `bark` 的函数。\n\n```cpp\npublic:\n    void\
  \ bark() {\n        cout << \"\\nBark!\\n\"\n    }\n```\n\n现在进入你的 `main` 方法并声明一个\
  \ `dog` 实例。为了方便示例，我的实例将命名为 `d`。之后，创建一个 `animal` 类的实例。\n\n尝试从这两个类调用 `bark()`。\n\n\
  ```cpp\nint main() {\n    dog d;\n    animal a;\n    dog.bark();\n    animal.bark();\n\
  }\n```\n\n如果你尝试编译，应该会得到错误“‘class animal’没有名为‘bark’的成员”。太好了！这正是应该发生的情况。因为 `dog` 是\
  \ `animal` 的派生类，你可以在其中定义狗可以使用但广义定义为动物的东西无法使用的函数——例如，汪叫。\n\n删除 `a.bark()`，然后编译并运行。它应该可以完美运行。\n\
  \n但等一下！我知道你在想什么。“狗也有不同的类型。而且，并不是每只狗都会汪叫，小狗会吱吱叫，天才。”我很清楚。别担心——我们也可以从派生类派生派生类！\n\n\
  在你的 `dog` 类下方，添加一个继承自 `dog` 的类 `smallDog`。\n\n```cpp\nclass smallDog : public dog\
  \ {\n    public:\n    smallDog() {\n        this->name = \"small dog\";\n    }\n\
  };\n```\n\n现在如果我们在 `main` 函数中创建一个名为 `sd` 的 `smallDog` 实例，并在 `dog` 汪叫之后声明 `bark`，我们将有两个汪叫。但你是对的——小狗不汪叫。我们该如何处理？这就是函数重写（function\
  \ overriding）发挥作用的地方。要重写一个函数，你只需要重写它（除非它是 `virtual` 函数，在这种情况下它需要 `override` 指定符）。\n\
  \n在 `smallDog` 类中：\n\n```cpp\nvoid bark() {\n    cout << \"\\nY!\\n\";\n```\n\n\
  现在，在你的代码中，`sd.bark()` 输出“yip”，而 `d.bark()` 输出“bark”。这就是 C++ 中函数重写的本质。函数重写是名为 `polymorphism`（多态）的面向对象概念中不可或缺的一部分。这意味着事物可以根据上下文的不同有不同的含义。继承和多态是面向对象编程的两个核心概念。\n\
  \n另一个重要概念是 `abstraction`（抽象）。抽象的理念是，让编程的用户层面尽可能无错误且易于维护，通常通过提供函数来对类本身防止用户级访问的变量执行操作。另一个重要的面向对象概念是\
  \ `encapsulation`（封装），它是一种将数据和函数放在一起的机制。封装和抽象是相辅相成的，通过隐藏可能导致错误的数据，转而提供访问和操作这些数据的方法。\n\
  \n无论如何，离开这些宽泛的概念，涵盖 `virtual` 虚函数的主题是非常重要的。解释为什么 `virtual` 函数很重要有点困难，但我将尝试，因为它们确实非常重要。\n\
  \n最简单的解释方法是：假设你有两个类，基类和一个派生类。我们可以回到动物/狗的例子。动物吃普通食物，而狗当然会吃狗粮。如果它们都有一个名为 `isEating()`\
  \ 的函数并输出它们正在吃，那么 `animal` 对象将输出“generic food”，而 `dog` 对象将输出“dog food”。这对于 `main`\
  \ 函数的目的来说没问题，但如果它们必须通过一个中间函数，就会失效了。例如，如果在 `main` 函数中引用另一个名为 `makeAnimalsEat(animal\
  \ &a)` 的函数，并且引用的 `a` 调用了 `.isEating()`，那么所有派生自 `animal` 类的对象都将使用 `animal` 版本的函数\
  \ `isEating`而不是而不是重写版本。\n\n乍一看，解决方案似乎是重载 `makeAnimalsEat(animal &a)` 函数，增加另一个专门接受派生类\
  \ `dog` 的函数，例如 `makeAnimalsEat(dog &d)`。但再深思考一下——世界上有很多动物。非常，非常多。我们真的要为了让它适用于 `animal`\
  \ 类的每一个可能的派生类而反复重载同一个函数吗？当然不，那太荒谬了。答案是将基类的 `isEating()` 函数制为 `virtual` 函数，如下所示：\n\
  \n```cpp\nvirtual void isEating() {\n    cout << \"generic food\";\n}\n```\n\n要在派生类中重写此函数，你在函数名后输入\
  \ `override` 关键字，如下：\n\n```cpp\nvoid isEating() override {\n    cout << \"dog food\"\
  ;\n}\n```\n\n这有效地解决了最初存在的问题。类中要涵盖的最后一个主要概念（至少就本书的范围内）是运算符重载（operator overloading）的概念。描述这一点有一个非常简单的方法。\n\
  \n假设有两个整数 `a` 为 5，`b` 为 3。那么方程：\n\n`a + b`\n\n结果将是 8。对吧？这是因为它们有显式的值。\n\n然而，如果我们有两个名为\
  \ `cube` 的类的成员，这个类有 `length`、`height` 和 `width` 属性。如果你有两个命名为 `a` 和 `b` 的 `cube`\
  \ 对象并尝试相加它们，这没有内在含义。编译器不知道以何种方式相加这两个对象。创建一个名为 `overloading` 的新项目并删除 `main.cpp` 的内容。创建你的\
  \ `main` 方法并创建一个 `cube` 类。它应该拥有 `private` 变量 `length`、`height` 和 `width`，以及 `public`\
  \ 方法来设置这些值并返回体积（`length * width * height`），以及一个类和一个空构造函数。你的代码最终应该像这样：\n\n```cpp\n\
  class cube {\npublic:\n    int getV() {\n        return length * width * height;\n\
  \    }\n    void setL() {}\n    void setW() {}\n    void setH() {}\n    cube() {\n\
  \        length = 0;\n        width = 0;\n        height = 0;\n    }\n    cube(int\
  \ length, int width, int height) {\n        this->length = length;\n        this->width\
  \ = width;\n        this->height = height;\n    }\n}\nprivate:\n    int length,\
  \ width, height;\n};\n```\n\n\n\n幸运的是，你实际上可以在 C++ 中重载现有的数学运算符，为你的类赋予它们新的功能。\n\n\
  以下是在这种情况下我们将如何操作。\n\n首先，在你的 `cube` 类代码的 `public` 部分，你将像创建构造函数一样，声明对象本身。\n\n```cpp\n\
  cube\n```\n\n然后，你使用 `operator` 关键字，并指定你想要重载的运算符——在这种情况下，是加法运算符，后面跟着参数括号和函数括号。\n\n\
  ```cpp\ncube operator+(cube &add) {\n```\n\n由于我们传递的是另一个对象，我们实际上需要传入次要变量的引用地址。这行代码发生的作用是，你正在重载加法运算符\
  \ `+`，并指定当 `cube` 对象与运算符以及参数中的对象结合时会发生什么。所以基本上，当这个 `cube` 实例 `cube` 与另一个 `cube`（在这里被称为称为\
  \ `add`）相加时，会发生什么？在括号内，我们需要指定正在发生的情况。\n\n在括号中，我们需要声明 `cube c`。\n\n现在，我们需要说明 `cube\
  \ c` 的长度等于第一个 `cube` 实例（`this->`）的长度加上函数参数中定义的第二个 `cube` 实例（`add`）的长度。\n\n```cpp\n\
  c.length = this->length + add.length;\n```\n\n然后对宽度和高度进行相同的操作。\n\n最后，你的代码理想情况下看起来应该是：\n\
  \n```cpp\ncube operator+(cube &add) {\n    cube c;\n    c.length = this->length\
  \ + add.length;\n    c.width = this->width + add.width;\n    c.height = this->height\
  \ + add.height;\n    return c;\n}\n```\n\n如果你想让代码更加安全，实际上可以将参数中的变量设为常量。\n\n```cpp\n\
  cube operator+(const cube &add) {\n```\n\n现在我们来谈论如何拆分你的代码使其具有极高的可读性并更容易使用。\n\n#\
  \ 第 13 章：面向对象编程\n\n## 对象与类\n\nC++ 与 C 语言的不同之处在于增加了面向对象编程（OOP）。在 OOP 中，程序被分为对象，对象是将数据和处理该数据的函数封装在一起的数据结构。\n\
  \n在自顶向下的设计中，你的程序是一组函数，由 `main` 函数驱动整个程序。相比之下，在面向对象的设计中，你首先考虑问题中的数据（变量），然后将数据与使用这些数据的函数封装成对象。\n\
  \n要创建一个对象，首先你需要写一个类，类是一个在其中既包含数据又包含函数的数据结构。当你设计一个类时，你实际上创建了一个新的数据类型。例如，你可能会写一个名为\
  \ `Student` 的类，它包含所有关于学生的数据，如他们的姓名、`id`、`gpa` 等，以及允许你输入、输出和更改这些数据的函数。然后，你声明类型为这种新数据类型的对象变量。例如，你可以声明\
  \ `student1`、`student2`、`student3`，或者一个全类型为 `Student` 的 `student` 对象数组。\n\n编写面向对象程序有\
  \ 3 个步骤：\n\n1. 确定共享数据变量（也称为成员或实例变量），并在类中将这些变量声明为 `private`（它们不能在类外部访问）。\n2. 编写类内部处理共享变量的\
  \ `public` 函数。\n3. 编写一个 `main` 函数来创建该类的对象并测试这些函数。\n\n以下是在 C++ 中编写名为 `Student` 的新类的方法：\n\
  \n```cpp\nclass Student {\nprivate:  // 数据（称为成员、实例或共享变量）\n    string name;\n   \
  \ long int id;\n    double gpa;\n\npublic: // 成员函数\n    void inputData() {\n   \
  \     cout << “Please enter the student’s name: \";\n        cin >> name;  // 有权访问上面的共享变量\n\
  \        cout << “Please enter the student’s id: ```\n        cin >> id;\n    }\
  \   \n\n    void calculateGPA() {\n        ....\n    }\n}; // 注意结束类定义的分号\n```\n\n\
  然后，你可以写一个 `main` 函数，通过创建 3 个 `Student` 对象 `s1`、`s2`、`s3` 来测试新类，并使用 `.` 运算符调用它们的公共函数（可以读作\
  \ 's，例如 `s1` 的 `inputData()` 函数将填充 `s1` 的数据）：\n\n```cpp\nint main() {\n    Student\
  \ s1, s2, s3; \n    s1.inputData();\n    s2.inputData();\n    s1.calculateGPA();\n\
  }\n```\n\n面向对象编程还遵循数据封装和信息隐藏的原则。它通过将数据设为 `private` 来保护数据，并提供 `public` 函数来安全地访问数据。`private`\
  \ 修饰符意味着成员变量仅在类内部可见——它们被类内部的函数共享并访问。类中的所有共享变量都应该声明在 `private` 下。`public` 修饰符意味着可以在任何地方（类内部和外部）访问它。函数通常被设为\
  \ `public`。\n\n大多数现代编程语言现在都是面向对象的了，因为这种类型具有某些优势。以下是 OOP 的一些优势：\n\n- 它保护了数据。除了你的类之外，没有人可以更改它们。\n\
  - 函数倾向于更短且设计更好。因为它们共享私有数据。\n- 更容易扩展类并创建新类，促进代码复用。\n\n## 类内部的成员函数\n\n大多数类内部都有一些标准函数：\n\
  \n- 访问器/修改器函数（get/set）：设置共享变量的值并返回（获取）共享变量。\n- 输入/输出函数：向用户请求变量的值并打印它们。\n- 构造函数：初始化共享变量。\n\
  - 特殊函数（例如 `BankAccount` 类中的 `deposit/withdraw`）。\n\n例如，这里是带有 `get/set` 函数的 `Student`\
  \ 类：\n\n```cpp\nclass Student {\nprivate: \n    string name;\n    long int id;\n\
  \npublic:\n    void setName(string n) {\n        name = n;\n    }\n    string getName()\
  \ {\n        return name;\n    }\n    void inputData() {\n        cout << “Please\
  \ enter the student’s name: \";\n        cin >> name;\n        cout << “Please enter\
  \ the student’s id: \";\n        cin >> id;\n    }\n    void outputData() {\n  \
  \      cout << name << endl;\n        cout << id << endl;\n    }\n}; // 类结束\n```\n\
  \nOOP 中的一种特殊函数类型是构造函数，它将所有共享变量初始化为值。构造函数必须与类同相同且没有返回类型。当你创建对象时，它们会被调用。这里有一个默认构造函数\
  \ `Student()`，当你声明类对象时它会被调用：例如 `Student s1;`。\n\n```cpp\nStudent() {\n    name =\
  \ \"\"; // 将所有共享变量初始化为默认值\n    id = 0;\n    gpa = 0;\n}\n```\n\n构造函数也可以接受参数并拷贝到成员变量：\n\
  \n```cpp\npublic Student(string n, long int i) {\n    name = n;\n    id = i;\n}\n\
  // 在 main() 中调用：Student s1(“Chris”, 12345);\n```\n\n`this` 关键字有时在成员函数内部用于引用调用对象，例如\
  \ `s1`。所以当我们在上面的 `Student` 构造函数中使用 `name` 时，我们指的是这个对象，即 `s1` 的，并且可以写成 `this.name`。\n\
  \n\n\n对象通常被放入数组或更复杂的数据结构（如 `vector`）中。例如，在程序中，我们通常需要的不仅仅是学生对象。我们可能需要跟踪整个教室甚至整所学校的所有学生，这需要数百或数千名学生。我们创建的新类类型可以用任何使用简单数据类型的地方。因此，我们可以像声明整数数组一样轻松地声明\
  \ `Student` 对象数组：\n\n```cpp\nStudent studentArray[100];  // 包含 100 个 Student 对象\n\
  ```\n\n或者我们可以声明一个学生的动态数组：\n\n```cpp\nVector students<Student>;\n```\n\n我们可以使用循环来遍历数组并调用每个学生的函数：\n\
  \n```cpp\nfor(int i=0; i < 100; i++)\n    studentArray[i].inputData(); // 调用学生 i\
  \ 的 inputData() 函数\n```\n\n我们还可以将整个数组传递给函数。例如：\n\n```cpp\nvoid inputArray(Student\
  \ studentArrayarray[ ] ) {\n    for(int i=0; i < 100; i++)\n    studentArray[i].inputData();\n\
  }\n```\n\n幸运的是，在 C++ 中，数组名始终充当其地址，因此数组地址会自动传递给函数，而不是复制整个数组，并且会修改原始数组。\n\n## 项目\n\
  \n1. 创建一个 `Date` 类，包含月、日、年，并带有设置/获取和输入/输出函数，以及一个将日期设置为当前日期的默认构造函数。在 `main` 函数中对其测试。\n\
  2. 创建一个 `BankAccount` 类，包含银行账户信息（所有者、余额等）以及标准函数，以及 `withdraw()`（取款）和 `deposit()`（存款）函数。\n\
  3. 创建一个 `Student` 对象数组，并使用循环填充数据。然后，找到 GPA 最高的学生。\n\n# 第 14 章：进阶技巧\n\n## 结构体\n\n\
  结构体（Structs）源于 C 语言，源于类编程时代。然而，它们仍然有用，并且可以用在类被认为大材小用的地方。\n\n使用结构体的一个很好的例子是记录信息，例如，如果你需要跟踪球队中的足球运动员，你需要存储：\n\
  \n* 姓名\n* 球衣号码\n* 薪水\n* 最擅长的脚\n* 等\n\n如果不需要为这些信息添加功能，那么结构体非常适合这种情况。一个存储这些信息的结构体定义如下：\n\
  \n```cpp\nstruct FootballPlayer\n{\n    string Name;\n    int KitNumber;\n    double\
  \ Wage;\n    string StrongestFoot;\n};\n```\n\n该结构体包含了所有相关值，这将为相似信息提供一个相关的容器。\n\n\
  结构体的新实例定义如下：\n\n```cpp\nFootballPlayer player1;\nplayer1.Name = \"Messi\";\nplayer1.KitNumber\
  \ = 10;\nplayer1.Wage = 1000000;\nplayer1.StrongestFoot = \"Both\";\n```\n\n这段代码将创建一个\
  \ `FootballPlayer` 并为其所有成员变量赋值。\n\n结构体的现实世界用法倾向于“简单”用法，即它们只需要存储像上面示例那样微不足的数据；当需要功能和封装时，请使用类。这被称为\
  \ POD（纯旧数据）封装。\n\n注意：结构体变量的默认访问权限是公共（public），而类默认是私有（private）。\n\n## 枚举\n\nEnums\
  \ 是枚举类型（Enumerated Type）的缩写，它的作用类似于布尔值，但具有无限数量的用户定义类型，它可以用于像“HOME_SCREEN”或“SETTING_SCREEN”这类情况的标记。\n\
  \n枚举定义如下：\n\n```cpp\nenum CurrentScreen\n{\n    HOME,\n    SETTINGS,\n    CONTACTS,\n\
  \    CALCULATOR\n};\n```\n\n括号中的每个单词都是枚举可以设置的状态。枚举实例的创建如下：\n\n```cpp\nint main()\n\
  {\n    CurrentScreen phone1;\n    phone1 = HOME;\n}\n```\n\n上面的代码创建了一个新枚举并将其赋值为“HOME”。现在你可以使用枚举来检查它处于什么状态，下面的示例将使用\
  \ `switch-case` 语句：\n\n```cpp\n#include \"stdafx.h\"\n#include <iostream>\nusing\
  \ namespace std;\n\nenum CurrentScreen\n{\n    HOME,\n    SETTINGS,\n    CONTACTS,\n\
  \    CALCULATOR\n};\n\nint main()\n{\n    CurrentScreen phone1;\n    // 修改这里\n \
  \   phone1 = HOME;\n    switch (phone1)\n    {\n        case HOME:\n           \
  \ cout <<  \"You're on the home page\" << endl;\n            break;\n        case\
  \ SETTINGS:\n            cout <<  \"You're on the settings page\" << endl;\n   \
  \         break;\n        case CONTACTS:\n            cout <<  \"You're on the contacts\
  \ page\" << endl;\n            break;\n        case CALCULATOR:\n            cout\
  \ <<  \"You're on the calculator page\" << endl;\n            break;\n        default:\n\
  \            break;\n    }\n}\n```\n\n输出：\n>You’re on the home page\n\n这段代码向你展示了如何结合条件结构和枚举来轻松创建一个良好的分支结构。尝试修改注释的“Change\
  \ me”枚举定义，看看输出如何变化。\n\n## 联合体（Unions）\n\n联合体是为提供高效内存利用而设计的数据结构，它们可以包含其所需的任意数量的成员变量，但每次只能存储单个变量的数据。因此，整个结构只占用最大成员变量的内存。\n\
  \n联合体必须谨慎使用，因为当需要功能和封装时，应使用类。\n\n联合体的定义如下：\n\n```cpp\nunion Example\n{\n    int\
  \ i;\n    int x;\n    int y;\n};\n```\n\n联合体的实例创建并赋值如下：\n\n```cpp\nExample e;\n\
  e.i = 4;\n```\n\n为了显示发生了什么，下面的代码工作：\n\n```cpp\n#include \"stdafx.h\"\n#include <iostream>\n\
  using namespace std;\n\nunion Example\n{\n    int i;\n    int x;\n    int y;\n};\n\
  \nvoid Print_Union(Example e)\n{\n    cout << \"i: \" << e.i << endl;\n    cout\
  \ << \"x: \" << e.x << endl;\n    cout << \"y: \" << e.y << endl;\n}\n\nint main()\n\
  {\n    Example e;\n    cout << \"1\" << endl;\n    e.i = 4;\n    Print_Union(e);\n\
  \    cout << \"2\" << endl;\n    e.y = 3;\n    Print_Union(e);\n    cout << \"3\"\
  \ << endl;\n    e.x = 1;\n    Print_Union(e);\n}\n```\n\n输出：\n>1\n>i: 4\n>x: 4\n\
  >y: 4\n>2\n>i: 3\n>x: 3\n>y: 3\n>3\n>i: 1\n>x: 1\n>y: 1\n\n你可以看出，当你更改一个值时，它们都等于相同的值，这是因为所有值共享同一个内存位置，因此一个改变时全部改变。\n\
  \n## 可变参数列表\n\n可变参数列表允许无限参数。之前我们遇到过具有固定数量参数的函数（传递给方法的变量），例如：\n\n```cpp\nint Add(int\
  \ i, int y)\n{}\n```\n\n有两个参数整数 `i` 和整数 `y`。这被称为变变函数或具有无限元数的函数（参数数量，因此上面的 `Add`\
  \ 元数为为 2）。\n\n变量存储在一个名为 `va_list` 的变量中，它的工作与其他任何变量一样，但它持有传递的变量列表。变变函数的定义如下：\n\n\
  ```cpp\nvoid Add(int numberOfVariables, ...)\n{}\n```\n\n其中 `numberOfVariables`\
  \ 是传递的额外参数的数量，注意这不包括变量本身。这是必要的，因为 `va_list` 并不知道变量的总数，也不跟踪它在列表中的位置。\n\n使用 `va_list`\
  \ 需要使用几个函数：\n\n* `va_start(va_list, numberOfVariables)`\n  获取传递的变量并将第二个参数指定的数字分配给第一个参数\n\
  * `va_arg(va_list, type)`\n  从第一个参数指定的列表中获取下一个变量并创建一个由 `type` 指定的变量\n\n\n\n\n\n\
  *   `va_end(va_list)`\n    *   清理指定的列表\n\n我们现在可以使用这些函数来创建一个可运行的变长参数函数：\n\n```cpp\n\
  #include \"stdafx.h\"\n\n#include <cstdarg>\n\n#include <iostream>\n\nusing namespace\
  \ std;\n\nvoid Add(int numberOfVariables, ...)\n{\n    // 变量列表\n    va_list arg;\n\
  \    // 获取列表\n    va_start(arg, numberOfVariables);\n    int total = 0;\n    for\
  \ (int i = 0; i < numberOfVariables; i++)\n    {\n        // 获取下一个变量\n        total\
  \ += va_arg(arg, int);\n    }\n    // 清理\n    va_end(arg);\n    cout << \"Total\
  \ is: \" << total << endl;\n}\n\nint main()\n{\n    // 4 个参数\n    Add(4, 1, 2, 3,\
  \ 4);\n    // 10 个参数\n    Add(10, 6, 9, 5, 11, 22, 1, 3, 56, 90, 63);\n}\n```\n\n\
  输出\n>Total is: 10\n>Total is: 266\n\n变量列表过程的每个部分都已标记，此函数会加上它接收到的所有参数。这提供了一种非常动态的方式，可以创建一个能够处理几乎无限参数列表的函数。\n\
  \n## 练习\n创建一个函数，乘以所有给参数并返回一个值，打印出该值。注意：需要此 #include：\n\n```cpp\n#include <cstdarg>\n\
  ```\n\n### 方案\n类似如下的代码：\n\n```cpp\n#include \"stdafx.h\"\n\n#include <cstdarg>\n\
  \n#include <iostream>\n\nusing namespace std;\n\nint Multi(int numberOfVariables,\
  \ ...)\n{\n    va_list arg;\n    va_start(arg, numberOfVariables);\n    int total\
  \ = 1;\n    for (int i = 0; i < numberOfVariables; i++)\n    {\n        // 获取下一个变量\n\
  \        total *= va_arg(arg, int);\n    }\n    va_end(arg);\n    return total;\n\
  }\n\nint main()\n{\n    cout << \"The total is: \" << Multi(3, 56, 90, 63) << endl;\n\
  }\n```\n\n### 命名空间\n命名空间用于防止同名的变量和函数混淆，例如 `Run()` 函数可能适用于许多情况，因此需要一种方法来区分不同的 `Run()`\
  \ 函数，这正是可以使用命名空间的地方。\n\n它们的定义方式如下，大括号中的所有函数和变量都是该命名空间的一部分：\n\n```cpp\nnamespace\
  \ NamespaceName\n{\n\n}\n```\n\n下面的示例展示了如何使用它们：\n定义了如下两个具有相同函数名的命名空间：\n\n```cpp\n\
  namespace Proccesing\n{\n    void Run()\n    {\n        cout << \"Processing!\"\
  \ << endl;\n    }\n}\n\nnamespace Initialisation\n{\n    void Run()\n    {\n   \
  \     cout <<  \"Initialisation started!\"  << endl;\n    }\n}\n```\n\n这为程序员提供了机会，通过只需指定命名空间来选择执行哪个\
  \ `Run()`：\n`Proccesing::Run();`\n和\n`Initialisation::Run();`\n并且它们可以一起运行：\n\n```cpp\n\
  int main()\n{\n    Initialisation::Run(); \n    Proccesing::Run();\n}\n```\n\n输出\n\
  > Initialisation started!\n> Processing!\n\n因此，命名空间提供了一种整洁划分代码的方式，并通过提供一种几乎可以标记代码块的方法提高了代码的可读性。\n\
