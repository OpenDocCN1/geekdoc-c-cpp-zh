  \n# 第 19 章项目：日程 (Agenda)\n\n在这个项目中，我们将模拟一个电话日程，就像你家里的那种，并用它记录所有需要的重要号码，但我们将使用 C++\
  \ 来实现。对于每个联系人，将存储他们的姓名和电话（尽管你可以添加任意数量的字段）。此外，我们将使用 C++ 标准模板库中一个新颖且非常强大的特性：`vector`。\n\
  \n## 使用 vector\n\n想象这个电话日程将拥有超过 100 个电话号码。你会为这些号码声明 100 个变量吗？再为名字声明 100 个吗？当然不会。这正是\
  \ `vector` 大用用场。通过 `vector`，你可以插入任意数量的元素。在 C++ 中使用 `vector`，我们必须在代码中添加库 `<vector>`。我们还需要\
  \ `iostream` 和 `string`。\n\n所以，我们的库将是：\n\n```cpp\n#include <iostream>\n#include\
  \ <string>\n#include <vector>\nusing namespace std;\n```\n\n在命名空间 `std` 之后，我们将声明我们的\
  \ vector。它们将放在 `main` 函数外部。在 `main`（或任何函数）之外声明任何变量意味着该变量是全局的。换句话说，任何人都可以对其进行读写。仔细观察语法：\n\
  \n```cpp\nvector<string> Names;\nvector<string> Phones;\n```\n\n`vector` 这个词显然表示这些变量将是\
  \ vector，但现在看括号内部。有 `string` 单词。通过它，我们告诉 C++ 我们的 vector 将只包含字符串。我们只能拥有 `ints`、`string`\
  \ 或任意类型的 vector。你不能在单个 vector 中混合数据类型。现在，我们将编写 `main` 函数。由于程序的性质，我们需要能够穿梭于它的各个部分。程序将分为三个部分：添加联系人、使用\
  \ ID 搜索联系人以及使用姓名搜索联系人。为了实现这一点，我们将使用一个菜单，提供这三个选项以及一个退出程序的选项。\n\n`main` 函数的代码将如下：\n\
  \n```cpp\nint main()\n{\n    int sel = 0;\n    while(true)\n    {\n        cout\
  \ << \"My Agenda++\\n\\n\";\n        cout << \"Choose a number to execute an option\\\
  n\\n\";\n        cout << \"[1] New Contact\\n\";\n        cout << \"[2] Search by\
  \ ID\\n\";\n        cout << \"[3] Search by Name\\n\";\n        cout << \"[4] Exit\\\
  n\";\n        cout << \"Your choice: \";\n        cin >> sel;\n\n        switch(sel)\n\
  \        {\n            case 1:\n                NewContact();\n               \
  \ break;\n            case 2:\n                SearchByID();\n                break;\n\
  \            case 3:\n                SearchByName();\n                break;\n\
  \            case 4:\n                return 0;\n        }\n    }\n    return 0;\n\
  }\n```\n\n\n\n\n在这个示例中，我们将用户输入的值添加到名称向量（name vector）的末尾。电话（phones）也是如此。现在，我们在向量中就同时包含了这两个值。\n\
  \n既然我们已经有了插入值的函数，现在就需要从存储中检索它们了。\n\n这就是实现搜索函数的地方。\n\n对于 ID，我们的函数将如下所示：\n\n```cpp\n\
  void SearchByID()\n{\nint value;\ncout << \"\\n\\Enter the ID of the contact to\
  \ search: \";\ncin >> value;\nif(value >= Names.size())\n{\ncout << \"This ID does\
  \ not exist\\n\\n\";\nreturn;\n}\ncout << \"Information for contact \" << value\
  \ << \"\\n\";\ncout << \"Name: \" << Names[value] << \"\\n\";\ncout << \"Phone:\
  \ \" << Phones[value] << \"\\n\";\n}\n```\n\n同样，首先我们写函数名，在这种情况下将是 `SearchByID`。之后，变量\
  \ `value` 将包含用户想要搜索的值。在进行任何搜索之前，我们必须确保该变量在我们向量的范围内。这意味着什么呢？假设我们有一个包含 5 个元素的向量，而用户输入了数字\
  \ 8。我们应该怎么办？\n\n我们已经知道向量的长度为 5 个元素，所以，如果用户在搜索中输入的数字等于或大于我们向量的大小，那么它就会超出范围。\n\n这是通过函数中显示的\
  \ `if` 实现的。如果发生了这个特定条件，程序将显示一条消息说“This ID does not exist”，紧接着是 `return` 关键字。\n\n\
  `return` 函数的作用是终止函数。为了**不**执行任何搜索，我们必须在到达后续代码之前退出函数。因此，添加了 `return` 关键字，在条件语句内部的\
  \ `cout` 之后，函数立即结束并返回主函数。\n\n如果用户输入的值是有效的，那么它将找到相关信息。注意在最后两个 `cout` 中我们使用了 `[]`\
  \ 操作符。这被称为索引（index），用于区分向量内部的值。它的范围从 0 到 `size() - 1`。\n\n假设用户输入的名称的值为：John, Michael,\
  \ Sean。输入的电话的值为：111111, 333333, 555555。那么，我们的向量将如下：\n\nNames = John, Michael, Sean\n\
  Phones: 111111,333333,555555\n\n如果我们想检索信息，`Names[0]` 将是 John；`Names[1]` 是 Michael；`Names[2]`\
  \ 是 Sean。电话的情况也是如此。在这里，我们使用给定的 ID 来检索这些数据并将其显示在屏幕上。\n\n最后，我们将进入搜索函数，但这次按我们要查找的联系人进行进行。该函数的代码如下：\n\
  \n```cpp\nvoid SearchByName()\n{\nbool found = false;\nstring name;\ncout << \"\\\
  n\\Enter the name to search: \";\ncin >> name;\nfor(int i = 0; i != Names.size();\
  \ i++)\n{\nif(Names[i] == name)\n{\ncout << \"Name: \" << Names[i] << \"\\n\";\n\
  cout << \"Phone: \" << Phones[i] << \"\\n\";\nfound = true;\n}\n}\nif(!found)\n\
  {\ncout << \"No contact was found with this name!\\n\\n\";\n}\n}\n```\n\n在这里我们声明了两个变量，`found`\
  \ 和 `name`。`Name` 是我们要查找的字符串，`found` 是数据类型为 `BOOL`（只有真或假）的变量，并将告诉我们搜索是成功还是失败。\n\n\
  首先，我们要求用户输入要搜索的名称，之后，我们将使用 `for` 循环遍历所有元素。累加器像通常一样从零开始。现在，注意我们的条件发生了变化：`i != Names.size()`\n\
  \n多亏于这个名为 `size()` 的小函数，我们的 `for` 循环将遍历所有元素直到到达结尾。通过这个 `size()` 函数，我们可以完全确保不会越出向量的边界。如果不使用\
  \ `size()`，那么你可能会面临循环遍历向量的风险。如果发生这种错误，它将在运行时发生，编译器不会警告你，所以使用 `size` 函数更安全。\n\n循环的每次迭代，都会将向量中\
  \ `i` 位置的字符串与用户输入的字符串进行比较。如果两个字符串相等，它将向用户显示该联系人的名称和电话电话。同时，它会将 `found` 的状态更改为 `true`。\n\
  \n退出循环后，它将检查变量 `found` 是否为 `false`。变量开头的感叹号表示否定（NOT），所以，如果 `found` 为 `false`，则执行流将进入\
  \ `if` 的代码块并向用户显示消息“No contact was found with this name”。\n\n在验证状态后，函数结束，程序流返回主函数。\n\
  \n# 结论\n\n你学到了很多内容。C++ 是 C 语言的升级。C++ 拥有与 C 语言相似的优势，但具有更多特性。你已经看到 C++ 支持面向对象编程。类（Classes）用于定义对象。C++\
  \ 的通用格式从头文件开始。通过使用 `#Include` 关键字，可以使用这些文件并允许程序访问定义的类和函数。接下来是全局变量。到此为止，你已经理解了 C++\
  \ 的概念。尽管这本书试图涵盖所有内容，但仍有一些主题缺失。然而，这不应该是你最后的一本书。要成为一名专家，你需要阅读大量的书籍。\n\nLinux 初学者教程\n\
  \n一个简单直观的系统（基础命令，安装）。\n\n# 描述\n\nLinux 拥有长期的变革和创新历史，这使其成为想要定制系统的程序员的创意平台。人们接触 Linux\
  \ 时充满了赞美，因为放弃 Linux 并不是罕见现象。\n\n命令行界面起初可能会有些令人压力压力。有时，记住最基础的命令及其工作方式是很困难的。然而，虽然需要记忆很多命令，但你有很多不同的工具可以减轻负担，并对你在终端中做的任何操作提供巨大的帮助。你需要花费一些时间来了解系统。如果你有管理员，就不必担心，因为他们会处理大多数问题。如果不是如此，系统本身将提供很多帮助，如果还不够，你可以向社区寻求帮助，他们通常会尝试提供支持。\n\
  \n\n\n一些你可能在 Windows 中需要的程序已经为 Linux 重新编写了，或者更简单、更令人印象深刻的是，运行这些程序的系统部分已被重写以兼容 Linux\
  \ 代码。在某种程度上，Linux 可以替代任何其他操作系统。虽然它在程序应用的多样性或运行速度上可能不如 Windows，但它能够以较低的预算很好地模拟后者。Windows\
  \ 软件的更新频率相当频繁，而 Linux 的更新频率相对较低，但每次更新对系统来说都是重大的。Linux 总是倾向于尽可能与竞争对手匹配，这为自我改进铺平了一条笔直且无止境的道路。在市场、社区以及管理员的共同推动下，Linux\
  \ 不断进步。这意味着每个发行版的质量大多是保持一致的。\n\n本指南将重点关注以下内容：\n\n*   Linux 入门\n*   选择 Linux 发行版系统\n\
  *   使用 Linux 连接网络\n*   基础 Linux 命令\n*   Linux 可用功能\n*   磁盘存储管理\n*   Linux 中的命令重定向\n\
  *   用户与用户组管理\n*   初学者的命令与函数\n*   使用 Linux 文本编辑器\n*   在 Linux 上编程\n*   使用 Python\
  \ 在 Linux 上编程……以及更多！！！\n\n# 引言\n\nLinux 是一款非常推荐的软件，能够满足尽可能多人的需求。它会与你一起学习和成长。虽然它是一个脆弱的系统，但它本身就是一件艺术品。无数的人时和数行代码成就了\
  \ Linux 的今天。内核本身是一件令人惊叹的作品，因为它绝不可能由一个人完成，这不仅是因为它的复杂性，还因为一个人完成所有这些工作所需的工作量。从财务角度来看，创建原始内核将花费某人数十亿美元。加上所有现有发行版以及额外的程序，这个数字最终会变成一个巨大的数字。这再次告诉我们，Linux\
  \ 比起任何东西都是团结的象征。世界上有许多人仅仅因为想要创造出对所有人都有用的东西而联系在一起，一次又一次地聚集在一起，将操作系统的质量推向新的高度。Linux\
  \ 的原始想法确实非常野心勃勃，但它绝无法希望达到今天的成就。\n\n许多怀疑者很快就会否定 Linux，将其与 Windows 和 macOS 等更大、更有影响力的系统进行比较，称它运行更慢、更丑。他们还喜欢说它不友好，即使对于那些编程能力最强的人来说也很难使用。虽然\
  \ Linux 在视觉吸引力和易用性方面确实逊于许多其他系统，但 Linux 的初衷绝非如此。虽然许多其他操作系统用华丽的选择和应用程序让你眼花，但 Linux\
  \ 选择保持其直简单的方法，并以极简单的方式交付结果。Linux 的诞生是为了让人们能够相对容易地学习编程领域更高级的知识，并且已经为此工作多年。让 Linux\
  \ 与其他操作系统区别开来的是它在大多数方面都是如此真正独特。这是一项全社区的努力，因此没有想要通过他人的汗水获利的“鲨子”。每个人都尽力所为，我们拥有的资源都是相同的。让你的\
  \ Linux 系统与其他任何系统不同的是你如何选择使用它。该系统非常直观，虽然有点难以掌握，但精通任何事情都需要辛勤和奉献。维护系统也不是问题。用于这些工作的命令都非常直观且准确，这意味着即使在维护巨大的服务器系统时，你也极少需要专业人士的帮助。关于\
  \ Linux，真的没有什么坏处是不会被其他优点所抵消的。随着 Linux 取得的稳步进展，它已开始成为与更知名公司制造的操作系统的激烈竞争对手。\n\n# 第\
  \ 1 章：Linux 入门\n\n关于磁盘空间的准备，这是整个安装 Linux 过程中最关键的时刻。事实是，如果你在一个硬盘已经有任何数据的计算机上安装系统，那么在这里你应该小心不要意外丢失这些数据。如果你在一个“干净”的计算机上或至少在一个没有数据的新硬盘上安装\
  \ Linux 系统，那么一切都会简单得多。\n\n### 为什么你不能在已经有（例如 Windows）的分区中安装 Linux，即使有足够的可用空间？\n\n\
  事实上，Windows 使用 `FAT32` 文件系统（旧版本中为 `FAT16`）或 `NTFS`（Windows NT / 2000 中），而在 Linux\
  \ 中，使用的是完全不同的系统，称为“扩展文件系统 2”（`ext2fs`，最新版本中为带日志的 `extfs`）。这些文件系统只能位于硬盘的不同分区上。\n\n\
  注意，在 Linux 中，物理硬盘被称为第一个为 `hda`，第二个为 `hdb`，第三个为 `hdc`，以此此类推（`hdd`、`hde`、`hdf`……）。\n\
  \n有时在系统的安装程序中你可以看到磁盘的全名——`/dev/hda` 而不是 `hda`，`/dev/hdb` 而不是 `hdb`，以此此类推——这对我们现在来说是一样的。每个磁盘的逻辑分区都是编号的。所以，在\
  \ `hda` 物理磁盘上，有 `hda1`、`hda2` 等，`hdb` 可以是 `hdb1`、`hdb2` 等。不要被这些数字有时连排出现的事实所困扰。这对我们没有影响。\n\
  \n### 如何从磁盘启动安装 Linux\n\n要开始安装 Linux，将系统光盘插入驱动器并重启计算机以从光盘启动。如果你计划在 Windows 之上安装\
  \ Linux，那么可以直接从那里运行安装程序。\n\n此外，如果你运行的是 Windows 95/98，安装将立即开始；如果是从更强大的系统（例如 Windows\
  \ 2000、XP、Vista、Seven），仍然需要重启光盘。\n\n你的计算机可能已经配置为从光盘启动。如果没有从光盘启动，在重启计算机时进入 BIOS 设置。在大多数系统上，在开机或重启后立即按下\
  \ `Delete` 键或 `F11`。\n\n\n\n\n# 如何从 U 盘安装 Linux？\n\n经常会出现这样的情况：当你想要安装操作系统时，会发现自己的驱动器损坏了或缺失。这个问题在笔记本电脑所有者中尤为常见。但请不要沮丧，因为还有一种替代方案：从\
  \ Linux U 盘安装。要做到这一点，你不需要精通编程知识，因为有特殊的程序可以像刻光盘一样将 Linux 镜像“刻”到你的 USB 闪盘中。你只需要启动安装过程即可。\n\
  \n因此，在从 U 盘安装 Linux 之前，你需要一个已经写入了镜像的 U 盘。\n\n## 为安装准备 BIOS\n\n首先，你应该为安装准备 BIOS。\n\
  \n以安装 Linux Mint 发行版为例。为了开始从 U 盘到本地硬盘上安装 Linux Mint，你需要配置启动参数。\n\n我们将 USB 闪盘插入电脑，在最开始开机时（当屏幕显示黑屏并出现大量文本时），按下\
  \ `F2` 键。根据 BIOS 版本和电脑的不同，也可能是另一个键——`F10`、`Delete` 或 `Esc`。\n\n进入设置菜单后，我们需要找到“Boot”（启动）项。同样，在不同版本的\
  \ BIOS 中，它的名称可能不同，请根据这个词进行引导。找到自动运行菜单后，一个优先级列表会出现在我们面前。它包含：硬盘、磁盘驱动器、可移动硬盘、USB 输入口等。我们的任务是在此列表中找到\
  \ U 闪盘并将其设置为优先级第 1。\n\n操作方法如下：使用方向键指向名称（例如：“USB 40GB DEVICE”），并通过按下 `F5` 和 `F6`\
  \ 键移动它，直到 USB 闪盘排在第一位。\n\n现在系统将首先启动 U 闪盘。按下 `F10`，通过输入 `Y`（Yes）键并按下 `Enter` 键确认输出。\n\
  \n重启电脑。\n\n## 开始安装过程\n\n之后，你就应该启动安装过程。\n\n电脑重启后，你将看到启动菜单。它通常装饰有各种图像，所以你完全完全清楚它是什么。按下\
  \ `Enter`。\n\n如果没有任何变化或出现某些错误，请重启电脑并阅读菜单列表以获取详情。录制的镜像中不仅包含 Linux 安装程序，可能包含各种程序。\n\
  \n然后，你应该从 Linux U 盘进行安装。所有的折腾都结束了！在安装初期，你就会遇到友好的俄语界面。首先选择一种语言。选择你偏好的语言。\n\n接下来，你需要确保电脑有足够的硬盘空间、已连接电源并连接了互联网。你可以立即同意在安装期间自动下载最新更新。\n\
  \n点击“Next”（下一步）。我们进入硬盘选择菜单。在其中，你可以根据需要格式化和划分分区。指定你想安装操作系统的分区（磁盘）并点击“Install Now”（立即安装）按钮。\n\
  \n在这里你可以增加内存、更改文件系统类型、格式化分区并指定挂载点。使用 `Ext4` 文件系统并将挂载点设置为 `/`。如果硬盘上重要信息，建议格式化分区。点击“Install\
  \ Now”。\n\n现在选择居住的国家和城市，以便系统根据你的个人需要设置时间和其他指标。还要指定键盘布局。只需为电脑输入所需的名称、用户名和密码（可选）。点击“Next”并开始安装过程。\n\
  \n安装完成后，重启电脑，拔掉 USB 闪盘并等待 Linux#\n\n# 如何为 Linux 制作可启动的 U 闪盘\n\n今天，操作系统变得越来越流行。你可能已经从朋友或熟人那里听过关于这种安装有多简单的故事。显然，为\
  \ Linux 制作可启动 U 闪盘是驱动器损坏或缺失的电脑、笔记本电脑或上网电脑重新安装操作系统的极方法。让我们更好地了解这种安装方法！\n\n## 下载 Linux\
  \ 镜像\n\n首先，你需要找到并下载 Linux 操作系统镜像。在互联网上寻找不同版本的 Linux 镜像非常简单，因为它是“免费软件”且完全免费发行。在我们的网站、官方网站或种子站下载所需的镜像。\n\
  \n可启动的 Linux U 闪盘需要一个普通的闪盘。它的容量应该是 1GB 或更高。\n\n## 使用 Unetbootin\n\n接下来，你需要下载 `Unetbootin`\
  \ 程序。这个程序将帮助我们制作可启动的 Linux U 闪盘。你可以从 `unetbootin.sourceforge.net` 页面下载。网站顶部有三个发行版的按钮——Windows、Linux\
  \ 和 Mac OS。如果你现在用的是 Windows，请点击 Windows 按钮。\n\n下载完成后，程序会立即打开，你不需要安装它。如果启动时遇到问题（Windows\
  \ 7），请“以管理员身份运行”。\n\n最初，程序勾选的是“Distribution”（发行版），但我们需要将其切换到“Disk Image”（磁盘镜像）。我们还要指定这是一个\
  \ ISO 镜像。接下来，点击 `...` 按钮并选择我们之前从网上下载的镜像。\n\n如果你的 U 闪盘容量足够，建议在文件存储空间中分配空间。100 MB\
  \ 就足够了。\n\n在程序窗口的最底部，选择你想要刻录的 U 闪盘。例如——“Type: USB drive; Media: E: ”如果电脑只插入了一个闪盘，程序会自动识别，无需任何选择。\n\
  \n最后只需点击 `OK` 按钮并等待程序完成镜像刻录。这需要 5-10 分钟。这就是关于如何将 Linux 刻到 U 闪盘的所有知识。刻录完成后，你必须重启电脑或将\
  \ U 闪盘插入想要安装 Linux 操作系统的电脑中。\n\n## 如何选择安装的程序\n\n现在，最关键的时刻——硬盘布局——已经过去。现在安装程序进入下一个阶段，在该阶段它将提供选择所需的程序。你可以简单地选择软件包安装选项之一（家庭电脑、办公电脑、连接局域网的工作站等）。或者，通过手动开启软件包选择开关进入软件选择窗口。\n\
  \n\n\n\n安装程序需要一个检查依赖关系的复选框，以便自动检查所选某些程序是否使用了未勾选安装的包。在完成此类检查后，安装程序将为您提供这些包的列表，并建议也安装它们。我们应该同意这一点，否则某些程序将无法运行。\n\
  \n## 配置设备和图形界面\n\n在您同意安装必要的软件包后，将开始将必要文件复制到硬盘。这个过程非常漫，所以你可以利用这段时间去喝杯咖啡，至少可以五到十分钟。但是，如果你的发行版记录在两张或更多光盘上，安装程序会经常要求你将必要的光盘插入驱动器。\n\
  \n然后将开始配置额外设备和图形界面。这里有一个微妙之处。事实上，由于某些原因，大多数安装程序都会错误地处理鼠标信息。因此，在此阶段，关于你使用的是哪种鼠标的问题，只需回答简单的双键或简单的三键即可。不要在厂家、型号等列表中查找。\n\
  \n安装系统后，如果鼠标的额外功能（例如滚轮操作）没有正常工作，可以单独启用。\n\n## 安装引导加载程序\n\n完成上述所有操作后，新安装的系统就准备好运行了。然而，安装程序会要求你回答最后一个问题：是否应该安装引导加载程序，以及在大多数情况下，安装哪一个？\n\
  \n如果 Linux 是你计算机上唯一的操作系统，那么你不需要引导加载程序。在这种情况下，只需重启电脑并移除启动光盘即可。\n\n如果你特意更改了 BIOS 设置以允许计算机从光盘或软盘启动，那么现在安装完系统后，你可以重新配置计算机仅从硬盘启动。要这样做，请返回\
  \ BIOS 设置并更改启动顺序。然而，如果你指定了“通用”启动顺序——软盘、CDROM、IDEO，你就无法再更改它，只需确保在开机和重启电脑时，没有插入启动软盘或光盘，除非需要从这些设备启动。\n\
  \n# 第 2 章：选择 Linux 发行版\n\n### 你应该选择哪种发行版？\n\n寻找适合你的发行版取决于对以下问题的回答：\n\n* 你使用电脑的经验如何？\n\
  * 你喜欢什么——传统的还是现代的桌面界面？\n* 桌面还是服务器？\n\n如果你具备中等的计算机技能，那么最新且易于使用的发行版如 `Deepin`、`Ubuntu`\
  \ 和 `Linux Mint` 是最佳选择。对于所有拥有中上等计算机技能的人来说，`Fedora` 或 `Debian` 是最好的选择。`Gentoo` 发行版适用于那些精通计算机并熟悉系统管理的人。\n\
  \n你正在寻找一种仅用于服务器的发行版吗？如果是这样，你必须决定是只需要桌面界面，还是想通过命令行操作。`Ubuntu server` 不安装 GUI 界面。这意味着你需要对\
  \ Linux 操作系统有深入的理解。使用命令 `sudo apt-get install ubuntu-desktop`，你可以在 `Ubuntu Server`\
  \ 上安装 GUI。你是否倾向于一个提供服务器所需所有内容的发行版？`CentOS` 是这种情况的完美选择。或者，你更倾向于桌面发行版，然后根据喜好和需求添加内容？`Ubuntu\
  \ Linux` 或 ` Debian` 可能是正确的选择。\n\n以下是优秀的 Linux 发行版为新用户提供的功能列表：\n\n#### 用户友好\n\n\
  这是一个可以永远争论下去的问题。因此，应该这样做的是，新用户应该选择一个发行版并开始使用，不需要大量的解释。如果需要提供详细解释，那么该发行版显然不用户友好。例如，任何没有经过指导的人都可以开始使用\
  \ Windows 7 桌面。这是每个 Linux 桌面都应该考虑的。\n\n#### 应用商店\n\n人们现在太依赖移动版了，他们也需要习惯家里的电脑应用商店。\n\
  \n#### 应用程序\n\n基础必需品应该预装，用户不需要单独安装它们。那么现在的必需品是什么呢，因为它们经常变化？\n\n* 电子邮件\n* 音乐播放器\n\
  * 办公套件\n* 浏览器\n\n要安装的应用程序列表取决于个人的需求。\n\n#### 现代界面\n\n有许多吸引人的移动景观，因此桌面现在需要通过现代、独特且简单的界面来吸引用户的注意力。\n\
  \n`Ubuntu`、`Linux Mint` 和 `Linux Deepin` 是最受欢迎的发行版，以下是根据功能对它们进行的排名：\n\n**用户友好性**\n\
  * 排名 1 - Linux Mint\n* 排名 2 - Ubuntu Linux\n* 排名 3 - Linux Deepin\n\n**应用商店**\n\
  * 排名 1 - Linux Deepin\n* 排名 2 - Linux Mint\n* 排名 3 - Ubuntu Linux\n\n**应用程序**\n\
  * 排名 1 - Linux Mint\n* 排名 2 - Ubuntu Linux\n* 排名 3 - Linux Deepin\n\n**现代界面**\n\
  * 排名 1 - Linux Deepin\n* 排名 2 - Ubuntu Linux\n* 排名 3 - Linux Mint（等等，文中说是 Linux\
  \ Mint）\n\n根据你的偏好和需求，你可以选择 Linux 发行版。\n\n## 获取 Linux 发行版\n\n在提供专业级且稳定的 Linux 系统的同时，这些发行版还提供了\
  \ `KDE` 和 `GNOME` 界面、省心易于使用的配置工具、各种互联网服务、一系列多媒体应用程序以及无数类型的 Linux 应用程序。关于不同发行版的信息可以在各自的网站上找到。可以从这些网站下载\
  \ CD 和 DVD。\n\n\n\n包管理器或包管理系统通过提供一组软件工具，帮助你一致地维护计算机程序的安装、升级、配置和卸载。这是区分不同发行版的最显著的特征之一。`APT`\
  \ 是 Ubuntu 的包管理器，同样的系统也适用于 Mint、Debian 等其他发行版。然而，某些发行版有它们自己的包管理器。例如，`Yum` 管理器（用于\
  \ Fedora）与 `APT` 相比，通过命令行使用更容易。不过，它有时速度会较慢。\n\n在易用性至关重要时，也应该考虑特定包管理可用可用。Fedora 不像使用\
  \ `APT` 的其他发行版那样流行，因此你可能很难找到你需要的精确应用程序。你可能需要从源码编译它，而不是直接从存储库获取。虽然从源码编译较容易，但当新版本发布时你无法自动更新时，你就会陷入困境。因此，你必须同时考虑包管理器的易用性和可访问性。\n\
  \n# 桌面环境\n\n我们已经看到了不同的桌面环境、它们的区别以及它们对 Linux 系统整体运行有多么重要。在选择合适的发行版时，应该考虑桌面环境。这里可以回顾一些关于桌面环境的重要要点，以理解它如何影响你对合适发行版的选择。\n\
  \n这些包括：\n\n* 窗口、菜单和桌面的整体外观和感受以及整体的可定制性。\n* 资源的使用。\n* 你的发行版图形偏好中提供的不同选项（例如更改要在菜单中显示的项目或重新映射某些键）。\n\
  * 不同程序与你桌面的整体集成情况。\n\n虽然可以安装独立的桌面环境，但在选择发行版时，没有人否认它的重要性。如果默认桌面环境接近你的需求，你将节省时间，无需单独安装。它与其它程序的配合运行也会更好。\n\
  \n# 稳定性 vs. 前沿性\n\n发行版有特定的发布和更新周期。某些发行版不断更新并提供应用程序和软件包的最新版本，而另一些则推迟升级过程以确保稳定性。Fedora\
  \ 通过提供最新、强大的版本来提供卓越体验，而 Debian 会故意延迟某些更新的发布，以确保一切运行良好。因此，你可以根据自己的喜好进行选择。如果你喜欢 Firefox\
  \ 或任何其他应用程序的最新版本，可以选择 Fedora。如果稳定性是你的首要任务，那么坚持 Debian 是最佳选择。\n\n# 硬件兼容性\n\n不同的发行版对驱动程序的打包方式不同，这意味着打印机的兼容性将取决于你选择的发行版。某些打印机在一个发行版上可用，但在另一个发行版上不可。尽管你可以为打印机单独安装驱动程序，但通过寻找支持你打印机的发行版可以节省精力和精力。Wi-Fi、声音和显卡等其他内容应该通过发行版的硬件兼容性页面检查兼容性。如果你在上面找到了，那么就可以用了，否则你将不得不花额外的精力来安装驱动程序。\n\
  \n# 社区支持\n\n社区支持已成为我所在领域的一个重要方面。通过这些论坛轻松找到正确答案可以解决你的问题，你不再需要为自己无法解决的问题感到苦恼。Linux\
  \ 也一样，社区支持对 Linux 用户是巨大的帮助。在选择合适的发行版时，你应该检查围绕它的社区。故障排除帮助、应用支持，甚至是通用信息对于初学者来说都是关重要的。正是这一方面让\
  \ Ubuntu 成为一个流行的发行版。你可以搜索不同发行版的论坛，并选择你认为最有帮助且提供良好支持的一个。\n\n# 必用发行版推荐\n\n在了解构成你发行版选择的因素后，下一步是探索选项。“DistroWatch”\
  \ 是寻找不同发行版的绝佳资源。发行版的数量数以百计，你可能会发现信息量过大。以下是汇总的一些最流行的发行版的列表，但你可以自由探索其他选项。虽然这些发行版提供了多种桌面环境，但我们将坚持默认版本以保持简单。\n\
  \n## Ubuntu (标准版)\n\nUbuntu 是一个非常适合初学者的发行版。它的目标是让普通人更容易地使用 Linux —— 而它已经实现了这一目标。它每六月更新一次，且极易使用。它有自己的\
  \ `Unity` 界面，提供了独特的功能，如替代任务栏的 dock，且包管理器以类似应用 Store 的界面和仪表板的形式呈现，使得搜索过程更加简单。尽管大多数人都喜欢它，但如果你喜欢，你始终可以选择切换回\
  \ `GNOME` 界面。Ubuntu 自带的标准应用程序包括 `Firefox`、`Empathy`（即时消息）、`Thunderbird` 以及其他用于下载种子文件的\
  \ `Transmission` 等程序。你不需要从源码编译，因为 Ubuntu 具有良好的硬件兼容性。Ubuntu 的社区支持是最好的，所以如果你在寻找一个无忧的选项，Ubuntu\
  \ 应该是你的首选。\n\n## Linux Mint (为初学者设计)\n\n虽然 Linux Mint 基于 Ubuntu，但它获得了独立的流行，特别是在\
  \ Ubuntu 引入 `Unity` 界面之后。Mint Linux 的目的是让不熟悉 Linux 的人们操作过程尽可能简单。菜单易于使用，安装过程也省力。许多应用程序如\
  \ `Adobe Flash`、MP3 支持和其他硬件驱动程序都是预装的，你不需要像其他发行版那样单独安装它们。默认或预装应用程序与 Ubuntu 类似（用 `Pidgin`\
  \ 代替了 `Empathy` 用于即时消息）。它遵循的包管理器与 Ubuntu 相同，这让你能够方便访问存储库中的不同程序。社区支持非常丰富，因为新手大多使用这个发行版。如果你从未用过\
  \ Linux，强烈推荐 Linux Mint。\n\n## Fedora (前沿用户)\n\nFedora 以其最新和前沿的软件闻名。更新通常在六个月后发布，与\
  \ Ubuntu 类似，但与 Ubuntu 不同，这些更新的支持周期较短。用户被期望尽快更新。如果 Mozilla 发布了 `Firefox` 的更新，Fedora\
  \ 会立即更新，而 Ubuntu 在发布更新之前会对程序进行特定修改。这种频繁的更新可能会导致某些不稳定，但喜欢最新版本的用户并不在意。它是最流行的 Linux\
  \ 发行版，可以轻松更新到 `GNOME`。Ubuntu 和 Mint 的 `APT` 与较慢但易于使用的 `Yum` 包管理器相比，使用起来稍微困难一些。软件的可用性没有\
  \ Ubuntu 或 Mint 那么广泛，但你仍然可以通过存储库获取大多数软件。Fedora 的企业和安全特性使其在专业环境中非常受欢迎。严肃的 Linux 用户会非常偏好\
  \ Fedora。\n\n## Debian (谨慎且稳定)\n\n\n\n\n\nDebian 在许多方面与 Fedora 相反。它的目标是尽可能保持稳定——而且在这方面做得非常出色。缺点是，大多数时候，你的系统并不是最新状态。新版本每隔\
  \ 1 到 3 年发布一次，但如果你并不在意拥有最新版本，并且满足于稳定性，那么 Debian 就是适合你的正确选择。Debian 使用的包管理系统与 Ubuntu\
  \ 和 Mint 相同，这意味着你可以获得大部分程序，而不需要四处寻找仓库。如果你有一个老旧或冷门的编译版本，你会喜欢 Debian 的，因为它支持许多处理器架构。\n\
  \n## OpenSUSE（为极客打造）\n\nOpenSUSE 拥有一个非常热心的社区，并且是一个通用的 Linux 发行版。它所提供的的配置的灵活性使其在其他发行版中脱颖而出。虽然\
  \ KDE 是默认桌面，但你可以在安装时选择选择从 KDE、GNOME、XFCE 和 LXDE 等不同的桌面中进行挑选。OpenSUSE 的额外优点是拥有出色的系统管理工具和包管理器（`YaST`），以及通过社区轻松访问文档。选择\
  \ KDE 和 OpenSUSE 意味着它可能会消耗大量资源，因此在做出决定之前，你需要确保你有足够的的资源。如果你想要选择的自由，可以通过选择 OpenSUSE\
  \ 来获得，因为它提供了许多配置选项，而且你不需要深究命令行。\n\n## Arch Linux（给执着者）\n\nArch Linux 要求你从零开始。它没有许多自己的特性，一切都由你亲手完成。当你开始时，拥有的只有命令行。从这里，你构建自己的桌面环境、喜欢的应用程序、驱动程序以及过程中需要的所有其他东西。你正在创建一个定制的\
  \ Arch Linux 发行版。这需要大量的工作和精力，但结果对你来说才是重要的。你将在过程中学到很多知识。这是一个极佳的学习体验，因为你能够在出错时弄清楚（在社区的帮助下，这通常非常有帮助）。\n\
  \nArch 使用 `Pacman` 包管理器，它非常强大。你始终可以保持到最新版本。Arch 用户仓库 (AUR) 是一个很棒平台，社区构建了所有程序的可安装版本。虽然它不是一个官方平台，但你可以通过\
  \ AUR 助手安装你可能需要的所有程序，就像仓库中的普通包一样。\n\n还有许多其他 Linux 发行版，比如 Slackware 或 CentOS。这些基础发行版也有变体，例如启用了\
  \ LXDE 的 Lubuntu（顾其名它是基于 Ubuntu 的）。你可以从基础版本开始，但建议尝试不同的发行版，因为这不仅能帮助你学习很多 Linux 知识，还能让你更好地理解自己的需求。\n\
  \n# 第 3 章：使用 Linux 连接互联网\n\n连接到互联网是通过你的计算机与提供商服务器之间的物理通道完成的。\n\n组织物理连接主要三种方法：\n\n\
  * 无线网络；\n* 本地网络；\n* 通过交换 `PPP` 数据的调制调器。\n\n在第一种情况下，需要一个无线接入点。只有在可用的情况下，才能建立连接互联网的无线网络。\n\
  \n第二种方法用于你的计算机连接到局域网的情况，其中有一个用于访问全球网的服务器。在这种情况下，你不需要花精力在组织连接上——局域网管理员将为你完成所有需要的工作只需启动浏览器，输入你感兴趣的\
  \ `URL` 即可访问。\n\n第三种方法是拨号调制调器连接。在这种情况下，管理员不会帮助你，所以你必须自己完成一切。出于这些原因，我们决定详细考虑这种方法。\n\
  \n首先，自然地，你应该有一个调制调器和一个电话。接下来，你需要决定提供接入服务的服务商，并从那里获取电话号码，你的 PC 将通过该号码连接到服务商的调制调器池，当然，还有访问全球网络的用户名和密码。\n\
  \n接下来，你需要配置 `PPP` 协议。这可以手动完成，也可以使用配置程序。手动配置相当复杂，需要编辑文件和编写脚本。因此，对于初学者来说，最好使用一个可以自动化整个接入设置过程的特殊程序。\n\
  \n这个程序被称为 `kppp`，最初包含在 KDE 图形化环境中。这个工具使得设置连接变得简单得多，在大多数情况下，它只需要你正确指定账户信息。\n\n# 第\
  \ 4 章：基础 Linux 命令\n\n在本章中，我们将解释基础 Linux 命令，这些命令将帮助你处理文件和目录、文本处理命令、用户和组、进程管理、网络以及帮助系统。\n\
  \n## 文件与目录\n\n### touch\n\n`touch` 命令用于更新文件的访问日期或修改日期，它有两种工作方式：如果文件已存在，文件的访问和修改时间戳将被设置为当前时间戳。如果文件还不存在，将创建一个具有当前时间戳的空文件（见下图）。\n\
  \n使用 `touch` 命令来设置文件的时间戳，并判断你是否有相应的权限写入目录或整个文件系统。\n\n### ls\n\n`ls` 命令列出目录条目。下图显示了两种常用方式：不带任何选项，以及带有选项\
  \ `-la`（`-l -a` 的缩写，意味着长格式显示所有）。第一个输出只显示普通文件的条目名称，而第二个输出则列出普通文件和隐藏条目。上面的输出显示了条目类型、权限、所有者、大小、访问日期和条目名称。\n\
  \n为了只列出目录，请使用选项 `-d`（目录）。\n\n### mkdir\n\n`mkdir` 命令用于创建目录（制作目录）。下面的示例在当前目录下创建一个名为\
  \ `training` 的新目录：\n\n```\nmkdir training\n```\n\n### rmdir\n\n`rmdir` 命令用于删除空目录（移除目录）。下面的示例删除当前目录下名为\
  \ `training` 的空目录：\n\n```\nrmdir training\n```\n\n### rm\n\n`rm` 命令代表 remove，用于删除文件和目录。为了删除当前目录下所有以\
  \ `.txt` 结尾的文件，执行以下命令：\n\n```\nrm *.txt\n```\n\n为了在删除文件和目录时安全见，请结合使用 `-i`（或 `--interactive`）和\
  \ `-v`（详细模式）。在删除文件之前 `rm` 将请求你的显式确认，并打印状态消息：\n\n```bash\nrm -iv invoice156.txt\n\
  rm: remove regular file \"invoice156.txt\"? y\n\"invoice156.txt\" was deleted\n\
  ```\n\n### cp\n\n`cp` 命令复制文件。为了正常运行，它需要两个名称：文件名和副本名。接下来的示例为 `calendar` 文件创建一个名为\
  \ `calendar-2018` 的副本：\n\n```\ncp calendar calendar-2018\n```\n\n原始文件不会被触动。副本与原始文件具有相同的内容，但具有当前时间戳。使用选项\
  \ `-i`（或 `--interactive`）防止覆盖现有文件。\n\n### mv\n\n`mv` 命令代表 move，用于移动和重命名文件及目录。它需要两个名称：原始文件名和它的新名称。下面的示例将\
  \ `calendar` 文件重命名为 `calendar-2018`：\n\n```\nmv calendar calendar-2018\n```\n\n\n\
  \n\n\n原始文件将被删除，新条目将接收当前时间戳。使用 `-i`（或 `--interactive`）选项可以防止覆盖现有文件。\n\n### cd\n\n\
  `cd`（更改目录）命令允许你在系统中移动。要进入子目录“work”，请使用此命令：\n\n```bash\ncd work\n```\n\n### file\n\
  \n`file` 命令用于确定文件系统中条目的类型。该命令会按照以下顺序执行三组测试：文件系统测试、魔数位测试（magic tests）和语言测试。第一个成功的测试将打印出文件类型。如下图所示，“Music”被归类为目录，“testfile”被归类为空文件，而\
  \ `/etc/passwd` 被归类为文本文件。此命令还能检测 PDF 文件以及各种图像格式。\n\n### du and df\n\n这两个非常相似的命令可以告诉你更多关于已磁盘空间的信息，`du`\
  \ 是“disk usage”（磁盘使用）的缩写，`df` 意味着“disk free”（磁盘剩余）。\n\n`du` 计算目录占用的磁盘空间。默认输出会列出每个条目的值，可能会让人感到困惑。为了获取目录的摘要，可以在命令行调用中添加三个参数\
  \ `-s`、`-c` 和 `-h`。`-s` 代表“summary”（摘要），`-c` 代表“total”（总计），`-h` 以人类可读的格式输出值。下图显示了你主目录的磁盘使用情况。\n\
  \n相反，`df` 命令显示设备上剩余的空间。下图显示了系统的可用磁盘空间。从左到右，列分别涵盖文件系统、磁盘大小、已用空间、可用空间以及挂载到该目录的设备。\n\
  \n### 输出与文本处理\n\n#### echo\n\n`echo` 是一个内置 shell 命令，用于输出文本：\n\n```bash\necho helphelp\n\
  ```\n\n下一个示例打印 shell 变量 `$HOME` 的值，它代表你的家目录。\n\n```bash\necho $HOME/home/user\n\
  ```\n\n#### cat and tac\n\n这两个命令逐打印文件。`cat` 从第一行开始到最后一行，而 `tac` 从最后一行开始到第一行。下一个示例使用了一个名为“places”的简单纯文本文件，其中每行包含一个城市名称。对于\
  \ `cat`，Amsterdam 排在前面；对于 `tac`，则是 Cape Town 在前面。\n\n```bash\ncat placesAmsterdamBerlinBernCape\
  \ Town\ntac placesCape TownBernBerlinAmsterdam own\n```\n\n#### grep\n\n该命令是描述“global\
  \ regular expression print”（全局正则表达式打印）的缩写。该命令充当过滤器，只打印匹配给定模式的文本行。`grep` 需要数据进行处理，并结合要查找的模式。\n\
  \n根据上面为 `cat` 和 `tac` 使用的示例，以下命令行调用仅输出文件中包含字符字符串“Ber”的行。记住，`grep` 过滤器是区分大小写的，即它寻找的是以大写“B”开头后跟两个小写字母“e”和“r”的字符串。模式位于文本的开头、中间还是结尾都没有影响。\n\
  \n```bash\ngrep Ber placesBerlinBern\n```\n\n在模式方面，`grep` 支持字符字符串和正则表达式（RegEx）。要找到所有以字母“n”结尾的字符串，请使用\
  \ `-E`（或 `--extended-regexp`）选项，后接模式“n$”，如下：\n\n```bash\ngrep -E \"n$\" placesBerlinBernCape\
  \ Town\n```\n\n#### head and tail\n\n`head` 输出文件的前几行。如果不带额外参数调用，它将输出前十行。相比之下，`tail`\
  \ 执行相同的操作，但从文件末尾开始。要输出前两行，请添加 `-n 2` 选项：\n\n```bash\nhead -n 2 placesAmsterdamBerlin\n\
  ```\n\n要输出最后两行，同样使用 `tail` 命令。与 `tac` 不同，`tail` 不会改变输出顺序。\n\n```bash\ntail -n 2\
  \ placesBernCape Town\n```\n\n#### nl\n\n`nl` 与 `cat` 类似，但在输出的每行开头添加行号。\n\n```bash\n\
  nl places 1 Amsterdam 2 Berlin 3 Bern 4 Cape Town\n```\n\n#### wc\n\n`wc` 命令是“word\
  \ count”（单词计数）的缩写，用于统计输入数据的行、单词和单个字符。除非另有指定，否则会打印所有三个值：\n\n```bash\nwc places 4\
  \ 5 32 places\n```\n\nwc wc 还提供了以下选项来限制输出：\n- `-l`: 只输出行数，后跟文件名\n- `-w`: 只输出单词数，后跟文件名\n\
  - `-c`: 只输出字符数，后跟文件名\n\n此示例显示了如何仅统计文件的行数：\n\n```bash\nwc -l places 4 places\n```\n\
  \n### 用户与组\n\n这些命令处理各种操作，以管理你 Linux 系统的用户和组。除非明确说明，否则这些命令可以作为普通用户运行。\n\n#### whoami\n\
  \n此命令按如下方式返回当前的用户 ID：\n\n```bash\nwhoamiuser\n```\n\n# 第 5 章：Linux 的可用功能\n\nLinux\
  \ 的优势在于内核。通过理解 Linux 内核，你可以修改操作系统以包含你想要的功能。过去，许多人曾专门根据自己的需求修改内核，而这些功能已成为许多 Linux\
  \ 发行版的重要组成部分。\n\n### 多用户\n\n虽然 Windows 也可以有多用户，但缺乏同时登录的能力。在 Linux 中，多个用户可以同时在系统上工作，每个用户都可以根据需要自定义自己的工作环境。每个用户都有自己的存储目录、带有图标、菜单和应用程序的桌面。当然，你可以为这些账户设置密码以保护应用程序和数据，并控制谁可以访问它们。\n\
  \n### 硬件支持\n\n连接计算机的硬件有很多。这包括软磁盘（如果你还有的话）、CD、DVD、USB、声卡、外部带设备以及基本上任何兼容计算机的设备。然而，Linux\
  \ 社区通常会在短时间内编写出驱动程序以兼容你的发行版。\n\n### 应用支持\n\n由于 Linux 兼容 POSIX，以及许多其他应用程序编程接口（API），Linux\
  \ 有海量的免费软件和共享软件可用。虽然可能需要一些精简和调整，但你能够运行自由软件基金提供的 GNU 软件。由于这个原因，Linux 的功能是是无限。如果你需要\
  \ Linux 执行特定功能，你可以修改软件甚至创建你自己的发行版。虽然并不是每个人都有这种技能，但这是可能的，而且很可能你寻找的功能是可以下载的。\n\n###\
  \ 无间谍软件\n\n间谍软件已成为许多 Windows 用户面临的难题。一旦下载了包含间谍软件的程序，它就会开始运行。用户可能完全不知道后台有程序正在收集用户信息并将其发送给第三方，这些第三方可能会利用这些数据窃取身份，或将信息出售给营销公司。这些应用程序还可以更改计算机解释信息的方式。更好的是，无需花钱购买和升级杀病毒软件，或支付昂贵的系统恢复费用。\n\
  \n### 无碎片整理\n\nLinux 拥有非常先进且高效的文件系统，不需要进行碎片整理。在普通的 Windows 计算机中，这些文件系统可能会产生碎片，导致系统崩溃、运行缓慢和内存丢失。\n\
  \n\n\n\n如果你有一台 Windows 电脑，那么你对从不给出原因的随机崩溃并不陌生。例如，如果你正在运行 Windows 且浏览器崩溃了，整个操作系统都可能随之崩溃，因为系统与图形用户界面是连接的。这种情况几乎在每个\
  \ Windows 用户身上都发生过，而且当丢失数据或中断重要任务时，这会让人非常沮丧。在 Linux 中，你不会遇到这些崩溃情况，因为 Linux 核心操作系统（`kernel`）与\
  \ `X Window` 中的图形用户界面分离的，并且与你使用的如 `OpenOffice.org` 等应用程序分离的。如果某个应用程序由于任何原因（如文件损坏）而崩溃，核心操作系统仍保持运行。\n\
  \n## 无需频繁重新安装\n你会发现，解决 Windows 问题的理想解决方案之一就是重新安装整个操作系统并从头开始。当 Windows 崩溃且没有办法恢复已丢失的数据时，这可能会非常困难。如果你使用系统运行业务，这会对你的业务运营造成极其高昂的成本和损害。另一方面，Linux\
  \ 不会以同样的方式崩溃，这意味着当你遇到任何问题时，你的数据是安全且可恢复的，而在 Linux 中，这类问题非常罕见。你实际上可以将数据与操作系统分开存储，这样即使你选择重新安装操作系统，任何个人用户偏好也能存储。这可以通过创建一个新分区来实现，这将保留你的\
  \ `home directory`。同样，在 Windows 中，如果进行了任何更改（例如安装新硬件或软件），你会被要求重启系统以重新配置系统。而在 Linux\
  \ 中，无需这样做。\n\n## 许多文件系统\nWindows 自带两个文件系统。而 Linux 带来了数百个文件系统，这对于那些需要在多台电脑之间工作、将硬件从一个系统交换到另一个系统的用户有用。\n\
  \n## 强大的命令行\n我们已经探索了一些使用命令行或 shell 环境的基础知识。在 Windows 中，命令行无法走得远，尤其是对于基础用户来说。通过 Linux\
  \ 命令行，你可以为 Linux 编写整个程序，这意味着你可以通过自动化消除重复性任务。一个例子就是备份系统。这通常是一项极其辛苦的任务；想象一下，运行一个简单的程序，点击一下就能完成整个过程。这以及许多其他简化在\
  \ Linux 命令行中都是可能的。\n\n## 供应商独立性\n在 Windows 中，如果你想保持系统更新，就被锁定在单一供应商身上。对于许多不想不断花钱来保持系统安全的人来说，这可能是一个缺乏动力。在\
  \ Linux 中，你永远不会被锁定在单一供应商身上，因为社区提供了大量的供应商，每个供应商都提供自己的发行版并提供支持。如果你觉得某个供应商在支持方面让你失望了，或者你遇到了一个不符合你预期的发行版，你可以转向社区寻求进一步支持，或者完全采用一个新供应商。你不需要从头开始，也不必觉得受困于一个似乎并不考虑你利益的供应商。更棒的是，如果某个供应商偶然放弃了他们的发行版，你并不被强制选择新的供应商或发行版，而是可以转向不断发展的社区继续发布你的发行版。请记住，Linux\
  \ 方面不涉及任何许可协议，这意味着你可以随心意愿下载、修改和重新打包。\n\n## 无注册表\n如果你在 Windows 上使用过注册表，就会知道它可能是一场噩梦。你不仅需要特定的工具来打开和修改文件，如果任何数据损坏，管理起来将极其令人沮丧。在\
  \ Linux 中，大多数配置都存储在纯文本文件中。这允许你轻松管理、备份并在系统之间传输这些文件。这比使用注册表要简单得多。\n\n## 高度文档化\n你是否遇到过简单无法找到解决方案的问题？你查阅手册却一无而归，你在论坛和搜索引擎中搜索答案，但根本没有记录其他人其他人遇到过相同的问题。这种情况在\
  \ Linux 问题上几乎不会发生。Linux 是文档最详尽的操作系统之一，而且几乎所有这些文档都是免费的。这些文档不是任何人胡凑在一起的 PDF，而是编写良好的文档，详细说明了许多有助于解释\
  \ Linux 内部工作原理的概念。这可能是 Linux 社区最大的优势之一，该社区由位于几乎每个国家、城市和城镇的在线论坛、文章和小组组成。这意味着，如果你希望有人面对面帮助你处理系统运行，你离另一个\
  \ Linux 用户并不远。\n\n你会发现，这个社区的行为就像一个家庭一样，因为在改进和开发开源操作系统方面，每个人都有共同的目标和目标。当你加入这个社区并为其他成员提供价值时，最好的\
  \ Linux 体验就会被开启，他们一定会报答你的。\n\n## 软件包管理\nLinux 提供的优秀软件包管理允许用户访问可以简化安装和升级应用程序过程的工具。此外，如果你升级当前的\
  \ Linux 发行版，这实际上非常简单。此外，如果你是一个开发者，你可以访问随包一起提供的大系列开发工具、库和编译器。对于 Java 开发者或使用 `PHP`/`Perl`/`Ruby`\
  \ 或 `C` 和 `C++` 编码的 Web 开发者，使用 Linux 时可以大显身手。这赋予了开发者随心意愿使用 Linux 的自由，甚至向社区、朋友和家人分享他们自己的\
  \ Linux 版本。\n\n## 无开放端口\nWindows 电脑的一个主要问题是未使用的端口一直处于开放状态。这可能导致黑客攻击，禁用并控制你的电脑，或将你的电脑作为一种攻击僵尸进行进一步攻击。Linux\
  \ 不留任何开放端口，这意味着你的数据是非常安全的，并受到不受授权入侵的保护。\n\n## 更快的发布周期\nLinux 发行版的补丁编写时间在几小时内，而不是其他操作系统的几天或几周。这意味着如果系统存在已知问题或安全威胁，提供保护的补丁创建会快得多。此外，许多\
  \ Linux 发行版设置为每 6 个月发布一次，使其轻松获取最新的应用程序更新、补丁和错误修复，以及对集成到系统中的新硬件的改进和支持。另一方面，Windows\
  \ 的发布周期不稳定。有时可能需要几年才能出一个可靠的发布版本，而且某些版本非常糟糕且充满了漏洞，真的不值得升级。\n\n## 完全控制\n\n\n\n\n使用\
  \ Windows 有时感觉就像坐在一辆失控的火车上。你会有许多正在运行的应用和进程，但你对它们了解甚少。有时你甚至不知道一个程序是什么，或者它正在对你的电脑做什么。这不仅让你感到困惑，还会占用本该分配给你想要和需要的程序的贵的内存。通过\
  \ Linux，你对哪些应用程序正在运行和更新拥有更强的控制权，也可以控制它们何时进行操作。在程序打开之前，你需要赋予权限，这样你就能确切知道电脑上发生了什么。\n\
  \n你还对运行在系统上的图形用户界面（GUI）拥有完全控制权。如果你想更改 Windows 中使用的 GUI 类型，将无法做到，因为你只有一个默认 GUI。Linux\
  \ 提供了极其丰富的 GUI，它们（讽刺的是）被称为窗口管理器（Window Managers）。你可以选择一个你认为最符合你使用习惯的 GUI。这里几十种选择，从精美且视觉效果丰富的\
  \ GUI 到快速、精简的选择应有。\n\n### 软件包 (Bundles)\nWindows 通常避免与操作系统捆绑应用程序，除了简单的文本编辑器、一个图像编辑应用以及其他几个之外。许多值得关注的应用程序都需要外部下载和安装，而且通常价格不菲。Linux\
  \ 在发行版中捆绑了许多不同的应用程序。这些范围从像 Office 套件和照片编辑软件等一些知名程序，到对你来说可能是全新的开源应用程序。优点是，这些应用程序将随你的发行版免费提供。它们在不需要额外费用的情况下提升了你的电脑体验。其中一些开源程序可以在\
  \ Windows 系统上下载和使用，但这需要下载和安装时间，而在 Linux 中，它们已经是默认可用的。这些软件包可能是庞大的，包含数千个应用程序，有些甚至号称拥有超过\
  \ 20,000 个。\n\n对于那些确实需要下载到系统中的应用程序，可以通过内置的应用商店进行。在 Ubuntu 中，内置的商店商店有数千个应用程序，只需点击一下即可轻松下载。\n\
  \n### 浏览优势 (Browsing Benefits)\n大多数 Linux 发行版都捆绑了 Mozilla Firefox，你们大多数人对此都很熟悉。Firefox\
  \ 是一个强大的浏览器，具有许多内置功能，如广告拦截、弹出窗口限制，以及与 Windows 自带的标准浏览器相比的许多其他优势。由于 Linux 改进了网络能力可以节省带宽并确保稳定的互联网连接，Linux\
  \ 还让浏览变得更加简单快速。\n\n### 无自动更新 (No Automatic Updates)\n自动更新经常被作为 Windows Windows 的优点，但这个过程不仅可能令人讨厌，而且对你使用系统的方式产生危害。大多数人可能不知道实际上更新了哪些文件。在\
  \ Linux 中，你可以选择点击并应用更新，而不是让它在未经你同意的情况下发生。如果你愿意，欢迎设置自己的自动更新，但你不必盲目接受它们。在 Linux 中，你对电脑何时、如何以及更新什么拥有完全的控制权。\n\
  \n### 3D 桌面 (3-D Desktop)\nLinux 允许用户通过 `Compiz` 利用先进的 3D 桌面，允许你同时切换和查看多个桌面。这个功能在创建时被认为非常先进，领先\
  \ Windows 许多。即使是现在，`Compiz` 也是最精简的 3D 桌面之一，占用显卡内存很少。\n\n# 第 6 章：磁盘存储管理 (Disk Storage\
  \ Management)\n\n在本章中，我们将介绍如何处理存储设备和文件系统，这包括设备命名、分区类型和方案，以及分区的挂载和卸载。\n\n## 设备命名\
  \ (Naming the Devices)\nLinux 中的一切皆文件，目录是文件，设备也是文件。系统上的每个驱动器都表示为 `/dev` 文件夹内的块设备。当系统启动时，会运行\
  \ `udev` 服务，它检测 `/dev` 中的所有设备并相应地挂载它们。\n\n在 `/dev` 内部，IDE 驱动器的名称从 `hda`、`hdb` 直到\
  \ `hdp`。其他设备类型如 SCSI、USB、SATA 和 PATA 表示为 `sda`、`sdb` 直到 `sdp`。CD 或 DVD 驱动器接收标签如\
  \ `cdrom` 或 `dvd`，而 SD 卡通常标记为 `mmcblk`。\n\n每个驱动器要在系统中运行至少有一个分区。一个驱动器最多可以有 16 个分区，每个分区都有自己的文件系统。在每个设备内部，设备\
  \ `/dev/sda` 的分区标记为 `sda1`、`sda2` 直到 `sda16`。Linux 的限制是每个驱动器十六个分区。\n\n## 主、扩展和逻辑分区\
  \ (Primary, Extended, and Logical Partitions)\n每个驱动器可以多有四个主分区，或者三个主分区和一个扩展分区。此外，一个扩展分区可以包含多达十六个逻辑分区。如果系统只包含四个主分区，它们被编号为\
  \ `sda1` 到 `sda4`，如下：\n\n| /dev/sda1/dev/sda2/dev/sda3/dev/sda4 |\n\n如果系统包含三个主分区和一个扩展分区（扩展分区包含逻辑分区），主分区\
  \ `sda4` 将消失并被逻辑分区 `sda5`、`sda6`、`sda7` 等替换：\n\n| /dev/sda1/dev/sda2/dev/sda3/dev/sda5/dev/sda6/dev/sda7\
  \ |\n\n第一个逻辑分区始终编号为 `sda5`。因此，即使主分区少于三个，它们也被编号如下：\n\n| /dev/sda1/dev/sda5/dev/sda6\
  \ |\n\n为了查看分区结构，来自 `util-linux` 软件包的 `lsblk` 命令非常有帮助。`lsblk` 是“列出块设备”。`lsblk` 可以输出所有使用的设备（见第一图）以及未使用的设备（见第二图）。\n\
  \n这六列代表以下信息：\n- `NAME`: 设备名称。\n- `MAJ:MIN`: 设备的主设备号和次设备号。\n- `RM`: 0 表示固定设备，1 表示设备可移除。\n\
  - `SIZE`: 人类可读的设备大小。\n- `TYPE`: 设备类型。`Loop` 代表循环设备，`disk` 指硬盘，`part` 指分区，`lvm` 是逻辑卷管理\
  \ (LVM) 分区，`rom` 指 CD/DVD ROM。\n- `MOUNTPOINT`: 设备挂载的目录\n\n要列出挂载的文件系统，可以使用 `mount`\
  \ 命令或 `findmnt` 命令。这两个命令都是 `mount` 软件包的一部分。在不调用进一步选项的情况下，`findmnt` 输出所有挂载的文件系统。这个列表可能很长。为了只选择\
  \ `ext4` 文件系统，可以使用选项 `-t ext4`（`--type ext4` 的缩写）。\n\n四个输出列包含以下信息：\n- `TARGET`:\
  \ 挂载点，即系统中设备所在的目录。\n- `SOURCE`: 设备名称。\n- `FSTYPE`: 文件系统类型。\n- `OPTIONS`: 挂载设备时使用的选项。\n\
  \n### udev 和 df\n`udev` 是“userspace /dev”的缩写，是 Linux 内核的设备管理器。一旦 `udev` 运行，它找到的驱动器将显示在\
  \ `/dev/disk` 目录中。它包含若干所示的符号链接子目录。注意，目录的数量取决于特定的 Linux 版本，并取决于 Linux 内核的版本。每当 Linux\
  \ 系统识别磁盘时，信息就会在这里显示。我们可以利用这些信息找到哪些挂载点在使用。\n\n`/dev/disk/by-id`\n显示 Linux 看到的分区名称以及哪些挂载点指向它们。\n\
  \n|| ls -al /dev/disk/by-id |\n\n`/dev/disk/by-path`\n显示底层硬件定义以及哪些挂载点挂载到它们上。\n\n\
  || ls -al /dev/disk/by-path |\n\n`/dev/disk/by-label`\n\n\n\n\n\n这显示了哪些标签应用于哪些挂载点。\n\
  \n```bash\n# ls -al /dev/disk/by-label\n```\n\n`/dev/disk/by-uuid`\n\n这显示了每个挂载点的\
  \ UUID 标签。\n\n```bash\n# ls -al /dev/disk/by-uuid\n```\n\n`/dev/disk/by-partuuid`\
  \ 是 GUID 分区表 (GPT) 的组件，用于与主引导记录 (MBR)磁盘磁盘分区替代方案。\n\n### df\n\n要查看哪些文件系统已挂载，以及使用了多少块和可用块，请调用\
  \ `df` 命令。`df` 是“disk free”（磁盘空）的缩写。该命令提供了多种选项：\n\n- `df -h`: 以人类可读的格式列出。\n- `df\
  \ -k`: 以 KB 为单位列出。\n- `df -m`: 以 MB 为单位列出。\n- `df`: 以默认块大小列出。有时会使用 500KB，可能会引起混淆。\n\
  \n## 挂载文件系统\n\n在使用文件系统之前，必须将其作为目录树的一部分进行挂载。大多数情况下，这在启动时自动完成，但也可以手动完成。\n\n为了演示，我们将第二个\
  \ SCSI 磁盘的第一个分区(`/dev/sdb1`) 挂载为 `/space`。首先，为了挂载文件系统，你必须是 root 用户。接下来，如果目录 `/space`\
  \ 尚不存在，使用 `mkdir` 如下创建它：\n\n```bash\n# mkdir /space\n```\n\n然后运行 `mount` 命令包含此目录：\n\
  \n```bash\n# mount /dev/sdb1 /space\n```\n\n大多数情况下 Linux 会自动检测文件系统类型。如果不是如此且没有自动检测到类型，请使用\
  \ `-t` 参数（`type` 的缩写）后跟文件系统类型的名称强制指定。此步骤假设相关文件系统类型已安装并被 Linux 内核识别。要列出 Linux 内核支持的所有文件系统，可以使用命令\
  \ `cat`、`awk`、`sed`、`ls` 和 `sort` 的组合：\n\n```bash\n$ (cat /proc/filesystems | awk\
  \ '{print $NF}' | sed '/^$/d'; ls -1 /lib/modules/$(uname -r)/kernel/fs) | sort\
  \ -u\n```\n\n以下命令扩展了上述命令，以便使用 `ext3` 文件系统 [ext3] 将第二个 SCSI 磁盘的第一个分区(`/dev/sdb1`)\
  \ 挂载为 `/space`：\n\n```bash\n# mount -t ext3 /dev/sdb1 /space\n```\n\n## 卸载文件系统\n\
  \n如果文件系统正忙或在使用，则无法卸载。要找到哪些程序正在使用该文件系统，来自“lsof”包的 `lsof` 命令派上了用场。`lsof` 是“list of\
  \ open files”（打开文件列表）的缩写。下图演示了如何使用该命令，并显示了目录 `/home/user/Music`的情况。\n\n这将提供使用该目录的程序列表。如果用户在该目录下工作，这也算作，你必须使用\
  \ `cd` 命令切换目录。接下来，通过调用命令 `lsof /space` 测试是否有其他程序在使用 `/space`。如果有程序正在运行，停止它们并重试。此外，确保没有终端\
  \ `cd` 进入 `/space` 中。\n\n```bash\n$ suPassword:# lsof /space...\n```\n\n然后输入 `umount\
  \ /space`。如果你没有收到错误消息，则 `/space` 已成功卸载。或者，运行带有 `-v` 参数（`verbose` 的缩写）的 `umount`\
  \ 命令以查看事务消息。最后，输入 `df -k` 查看新的分区状态。\n\n```bash\n...# umount /space# exit$\n```\n\
  \n## 自动挂载点\n\n要在 Linux 系统启动期间自动挂载挂载点，请在配置文件 `/etc/fstab` 中添加条目。`fstab` 是“file system\
  \ table”（文件系统表）的缩写。下图显示了配置的内容。\n\n`/etc/fstab` 文件中的列（字段）为：\n\n- `filesystem`: 指定文件系统的\
  \ UUID (`UUID=xxxxx`)、名称 (`/dev/sdb1`) 或标签 (`LABEL=home`)。\n- `mount point`: 定义文件系统挂载的目录。\n\
  - `type`: 允许的文件系统的逗号分隔列表。\n- `options`: 选项的逗号分隔列表。\n- `dump`: 文件转储信息，0 =关闭，1 = 。\n\
  - `pass`: 文件系统检查的顺序，从 1 开始。0 表示最后。\n\n请记住单列之间由制表符分隔，空格无法正常工作。提示：要找到挂载点的 UUID，请查看\
  \ `/dev/disk/by-uuid`。\n\n要自动挂载一个设备，只需通过添加一行来扩展 `/etc/fstab` 文件。为了在启动时使用 `ext3`\
  \ 文件系统将分区 `/dev/sdb1` 挂载为 `/space`，在较旧系统上添加此行：\n\n```text\n/dev/sdb1 /space ext3\
  \ defaults 0 0\n```\n\n在支持 UUID 的现代系统上，使用以下行。注意将“7ca005b2-a7ff-4757-bfdf-81004d4072ef”的值替换为分区的实际\
  \ UUID：\n\n```text\nUUID=7ca005b2-a7ff-4757-bfdf-81004d4072ef /space ext3 defaults\
  \ 0 0\n```\n\n## 设置分区\n\n`fdisk` 及其对应物 `cfdisk` 和 `gparted` 的理念是查看、添加、删除或编辑分区。`cfdisk`\
  \ 和 `gparted` 需要单独安装。\n\n要使用 `fdisk`，作为 root 用户输入 `fdisk` 后跟磁盘名称。下面的示例显示了第一个磁盘：\n\
  \n```bash\n# fdisk /sda\n```\n\n这将打开一个屏幕。在命令提示符处按 `p` 输出分区：\n\n要获取可用命令列表，输入 `m`，将显示屏幕。使用\
  \ `q` 退出 fdisk。\n\n# 创建分区\n\n对于第二个 SCSI 磁盘，如下启动 fdisk：\n\n```bash\n# fdisk /sdb\n\
  ```\n\n要创建新分区 `n`，首先 `fdisk` 询问你想创建主分区还是扩展分区。我们选择 `p` 创建主分区。然后 `fdisk` 询问我们要分区号。我们选择\
  \ `1` 作为第一个分区。接下来它询问大小。默认情况下 `fdisk` 会填充整个磁盘并使用所有可用空间。我们选择 `+4GB` 作为 4GB 分区。然后输入\
  \ `p` 输出结果，可以看到分区 `/dev/sdb1` 已创建。\n\n现在让我们添加一个扩展分区。再次输入 `n` 创建新分区。这次从菜单中选择 `e`\
  \ 创建扩展分区，并对默认设置（分区 2 和填充剩余空间）按回车。然后输入 `p` 输出结果，可以看到扩展分区 `/dev/sdb2` 已创建。\n\n现在创建一个交换空间。再次输入\
  \ `n` 创建新分区。这次没有更多空间创建主分区，所以我们只能创建逻辑分区。我们使用默认的起始扇区并选择 `+1G` 作为结束扇区，回车接受默认值。输入 `p`\
  \ 查看结果，可以看到逻辑分区 `/dev/sdb5` 已创建。\n\n最后创建一个使用所有剩余空间的分区。我们与上一个分区的操作相同，但这次我们选择了所有的默认选项。此后输入\
  \ `p` 显示分区 `/dev/sdb6` 已创建。\n\n\n\n\n现在我们将分区 `/dev/sdb5` 更改为交换空间（swap space）。为此，在\
  \ `fdisk` 中输入 `t` 来更改分区类型。分区号我们选择 `5`，然后输入 `l` 列出可用类型。我们需要的类型是 `Linux swap / Solaris`。输入\
  \ `p` 显示分区类型已更改。\n\n到为止，还没有内容被写入磁盘。要完成这一点，我们需要通过输入 `w` 写入磁盘来保存并同步磁盘。现在输入 `q` 退出\
  \ `fdisk`。输入 `ls -al /dev/disk/by-id` 查看新创建的分区。下一步，我们将使用新创建的分区来挂载文件系统。\n\n## 创建新文件系统\n\
  \n到目前为止，我们只有空分区。这些分区需要填充适当的文件系统。我们将按照以下方式挂载新文件系统：\n\n| `/dev/sdb1` | `/mnt/root`\
  \ | `ext2` | `/dev/sdb5` | `swap` | `/dev/sdb6` | `/mnt/home` | `ext4` |\n\n要完成这一操作，我们首先创建需要的挂载点：\n\
  \n```bash\n# mkdir /mnt/root\n# mkdir /mnt/home\n```\n\n然后为了添加文件系统，我们执行以下命令：\n\n\
  ```bash\n# mkfs /dev/sdb1\n# mkfs.ext4 /dev/sdb6\n```\n\n接下来，我们必须将 `/dev/sdb5` 设置为交换分区。`mkswap`\
  \ 创建交换文件系统，而 `swapon` 激活分区作为交换空间。\n\n```bash\n# mkswap /dev/sdb5\n# swapon /dev/sdb5\n\
  ```\n\n给每个分区自己的标签是一个好主意。为此，我们使用 `tune2fs` 并配合其选项 `-L`。分区 `/dev/sdb1` 与目录 `/root`\
  \ 关联，分区 `/dev/sdb6` 与目录 `/home` 关联。\n\n```bash\n# tune2fs -L root /dev/sdb1\n# tune2fs\
  \ -L home /dev/sdb6\n```\n\n现在我们可以挂载新分区了。输入 `df` 查看结果。\n\n最后一步，让我们向配置文件 `/etc/fstab`\
  \ 中添加条目，以便在启动时自动挂载这些文件系统。首先将 `/etc/fstab` 复制为 `/etc/fstab.bak`：\n\n```bash\n# cp\
  \ /etc/fstab /etc/fstab.bak\n```\n\n然后为了获取新分区的块 ID，输入 `lsblk -f`。选项 `-f`（`--fs`\
  \ 的缩写）扩展输出包含额外的文件系统信息。\n\n现在编辑配置文件 `/etc/fstab` 并按下图所示添加最后两行。\n\n然后使用 `reboot` 使用新分区重启系统，并调用\
  \ `df` 查看新创建的分区。\n\n# 第 7 章：Linux 中的命令重定向\n\n然而，这不是命令演示输出的唯一方法。许多命令行操作系统（如 Linux）都有更改命令输出传递给用户方式的能力。\n\
  \n这被称为输入/输出重定向（input/output redirection），用于将许多命令的结果重定向到文件、设备，有时甚至是额外命令的输入。在本章中，你将对这些命令进行简要介绍，以及它们如何在\
  \ Linux 中使用以帮助你获得更好的结果。\n\n## 标准输入\n\nLinux 命令通常只接受键盘的输入，也称为标准输入（Standard input）。然而，你可以将此输入重定向到文件，然后该文件可以作为命令的输入而不是键盘。要做到这一点，如下利用了\
  \ `<` 符号：\n\n```bash\n[me@mylinux me]$ sort < file_list.txt\n```\n\n在此例中，`sort`\
  \ 命令正在处理 `file_list.txt` 文件中包含的数据。\n\n### 标准输出\n\n上述重定向输入的结果将显示在屏幕上，这也标记为标准输出（standard\
  \ output）。然而，与标准输入一样，标准输出也可以被重定向，通常重定向到特定的文件。这是通过如下使用 `>` 符号实现的：\n\n```bash\n[me@mylinux\
  \ me]$ ls > name_list.txt\n```\n\n示例中的 `ls` 命令将像通常一样成功执行，但此命令的输出将不会预期那样显示在显示器上，而是会被重定向到文件\
  \ `name_list.txt`。\n\n注意的是，每当执行上述命令时，它都会覆盖原始的 `name_list.txt` 文件并创建一个全新的文件。然而，如果你想继续向文件中添加而不是每次从头开始覆盖，则应该像下面的示例一样使用符号\
  \ `>>`：\n\n```bash\n[me@mylinux me]$ ls >> name_list.txt\n```\n\n当运行此命令时，它会将新结果添加到文件末尾，使其每次执行时变得更大、更长。如果你尝试执行此命令而目标文件尚未创建，Linux\
  \ 将为你创建它。\n\n在某些情况下，标准输入和标准输出需要重定向。与许多其他命令行程序不同，在 Linux 中编写这些命令的顺序并不重要，只要用于重定向输入和输出的字符（`<`\
  \ 和 `>`）位于命令行的选项之后即可。\n\n\n\n\n第一个实例包含一个文件（正如你可能从名称猜出的那样），其格式非常糟糕。应用于它的管道（pipeline）不仅可以帮助格式化文件，还能通过以下方式将其打印出来：\n\
  \n- `cat` 用于读取文件。其输出将成为 `fmt` 的输入。\n- `fmt` 用于格式化文件。这种格式化通常限于创建段落，然后这些段落成为 `pr`\
  \ 的输入。\n- `pr` 获取已读取并格式化的文本文件，并根据文件内容创建页面。其输出随后发送到 `lpr`。\n- `lpr` 获取现在已格式化的文件并将其发送到打印机进行最终输出。\n\
  \n第二个示例非常相似，文本文件在发送到打印机之前需要以某种方式进行格式化。在这种情况下，文本文件中包含的列表在打印之前需要进行排序。通过检查命令行，我们可以看到是如何实现的：\n\
  \n- `cat` 用于读取文本文件。与第一个插图一样，其结果被转换为 `sort` 的输入。\n- `sort` 用于正确排序列表。排序完成后，文件被发送到\
  \ `uniq`。\n- `uniq` 用于删除文本文件中可能出现的任何重复信息。该结果随后发送到 `pr`。\n- `pr` 创建整洁、有序的页面，与第一个示例一样，结果被发送到\
  \ `lpr`。\n- `lpr` 将现在已排序、分页的文本文件发送到打印机进行最终输出。\n\n### 过滤器 (Filters)\n\n你可能在上述两个示例中注意到你可能不熟悉的几个命令，例如\
  \ `uniq`、`fmt` 和 `pr`。这些是管道中常用的使用的程序，用于对标准输入执行某些任务并将结果发送到标准输出。以下是几个最常用的过滤器及其用途：\n\
  \n1. `awk` – 这是一个非常强大的编程语言，专门为构建过滤器而创建的。\n2. `grep` – 该程序接收输入的每行数据，对其进行分析，并仅输出符合特定字符模式的数据。\n\
  3. `fmt` – 该程序获取未格式化的文本并输出相同内容的格式化版本。\n4. `sort` – 一个读取未排序数据并输出排序结果程序。\n5. `tr`\
  \ – 翻译不同的字符，例如，如果你想将一个单词从小写字母改为大写字母。\n6. `sed` – 这是 `tr` 的高级版本，能够执行更复杂的文本翻译。\n\n\
  # 第 8 章：用户和组管理\n\n在本章中，我们将学习 Linux 中的用户和组，以及如何管理它们并为这些用户管理密码策略。在本章结束时，你将熟练 Linux\
  \ 系统中用户和组的作用，以及操作系统如何解释它们。你将学习创建、修改、锁定和删除本地创建的用户和组账户。你还将学习如何通过在 shadow 密码文件中强制密码年龄策略来手动锁定账户。\n\
  \n## 用户和组\n\n在本节中，我们将理解用户和组是什么，以及它们与操作系统的关系。\n\n### 谁是用户？\n\n操作系统上的每个进程或运行的程序都以用户身份运行。每个文件的所有权都属于系统中的一个用户。用户限制了对文件或目录的访问。因此，如果一个进程以用户身份运行，那么该用户将决定该进程可以访问的文件和目录。\n\
  \n你可以使用 `id` 命令查看当前登录的用户。如果你将另一个用户作为参数传递给 `id` 命令，你也可以检索该其他用户的基本信息。\n\n如果你想知道与文件或目录关联的用户，可以使用\
  \ `ls -l` 命令，输出中的第三列显示用户名。\n\n你还可以通过 `ps` 命令查看与进程相关的信息。该命令的默认输出将显示在当前 shell 中运行的进程。如果你在命令中使用\
  \ `ps a` 选项，你将看到跨终端的所有进程。如果你想知道与命令关联的用户，可以向 `ps` 命令传递 `u` 选项，输出的第一列将显示用户。\n\n用户名使用系统中的数据库映射为数字。`/etc/passwd`\
  \ 处存储着一个平面文件，存储了所有用户的信息。该文件中每个用户有七个字段。\n\n`username: password:UID:GID:GECOS:/home/dir:shell`\n\
  \n- **username**: 用户名简单地将用户 ID `UID` 映射到一个名称，以便人类更好地记忆。\n- **password**: 此字段过去是保存用户密码的地方，但现在它们存储在位于\
  \ `/etc/shadow` 的不同文件中。\n- **UID**: 用户 ID，是一个数字，用于在系统最基础的层面上标识用户。\n- **GID**: 这是用户的主组编号。我们稍后会讨论组。\n\
  - **GECOS**: 这是一个使用任意文本的字段，通常是用户的全。\n- **/home/dir**: 这是用户主目录的位置，用户在此处拥有个人数据和其他配置。\n\
  - **shell**: 这是用户登录后运行的程序。对于普通用户，这将是给用户提供命令行程序。\n\n### 什么是组？\n\n就像用户一样，组也有关联的名称和组\
  \ ID `GID`。本地组信息可以在 `/etc/group` 中找到。\n\n组有两种类型：主组和补充组。让我们了解每种组。\n\n#### 主组 (Primary\
  \ Group)\n\n- 每个用户只有一个主组。\n- 本地用户的主组由 `/etc/passwd` 文件中的第四字段定义，该字段列出了组号。\n- 用户创建的新文件由主组所有。\n\
  - 用户的主组默认名称与用户名相同。这是一个用户专用组 (UPG)，用户是该组的唯一成员。\n\n#### 补充组 (Supplementary Group)\n\
  \n- 用户可以是零或多个补充组的成员。\n- 本地用户的主组由 `/etc/group` 文件的最后一个字段定义。对于本地组，用户成员通过逗号分隔的用户列表识别，列表位于组条目的最后一个字段。\n\
  `groupname: password: GID:list, of, users, in, this, group`\n\n- 补充组的概念是为了让用户能够属于更多组，从而访问系统中属于其他组的资源和服务。\n\
  \n## 获取超级用户权限 (Getting Superuser Access)\n\n在本节中，我们将学习什么是 root 用户，以及你如何成为 root 或超级用户并获得对系统的完全访问。\n\
  \n### root 用户\n\n每个操作系统都有一个被称为超级用户的用户，它拥有该系统的所有访问权限和权利。在 Windows 操作系统中，你可能听说过被称为管理员的超级用户。在\
  \ Linux 操作系统中，这个超级用户被称为 root 用户。root 用户具有覆盖文件系统中任何普通权限的权力，通常用于管理和维护系统。\n\n\n\n\n\
  操作系统上的大多数设备只能由 root 用户控制，但也有少数例外。普通用户可以控制如 USB 驱动器等可移动式设备。因此，一个非 root 用户可以管理和删除可移动式设备上的文件，但如果你想对固定式硬盘进行修改，那么只有\
  \ root 用户才能做到。\n\n但正如我们所听过的，能力越大，责任越大。鉴于 root 用户拥有的无限权限，这些权限也可能被破坏系统。root 用户可以删除文件和目录、删除或修改用户账户、在系统中创建后门等。如果\
  \ root 用户账户被攻破，其他人就可以获得对系统的完全控制权。因此，始终建议你以普通用户身份登录，并仅在绝对必要时才将权限提升到 root 用户。\n\n\
  在 Linux 中，以普通用户身份登录，然后使用工具获取 root 账户的某些权限是一项惯做法。\n\n## 使用 su 切换用户\n\n在 Linux 中，你可以使用\
  \ `su` 命令切换到不同的用户账户。如果你没有向 `su` 命令传递用户名作为参数，则隐含地表示你想切换到 root 用户账户。如果你以普通用户身份调用该命令，系统将提示你输入想要切换到的账户的密码。然而，如果你以\
  \ root 用户身份调用该命令，则不需要输入你正在切换到的账户的密码。\n\n```\nsu - <username>\n```\n\n```\n[student@desktop\
  \ ~]$ su -\n\nPassord: rootpassword\n\n[root@desktop ~]#\n```\n\n如果你使用命令 `su username`，它将在非登录\
  \ shell（non-login shell）中启动会话。但如果你使用命令 `su - username`，将为用户启动一个登录 shell（login shell）。这意味着使用\
  \ `su - username` 为新用户设置了一个全新的干净的登录，而仅使用 `su username` 则会保留当前 shell 的所有设置。通常，为了获取新用户的默认设置，管理员通常会使用\
  \ `su -` 命令。\n\n### sudo 和 root\n\nLinux 操作系统为用户实现了一种非常严格的模型。root 用户拥有执行任何事情的权力，而其他用户无法执行任何与系统相关的操作。过去遵循的常用解决方案是允许普通用户通过\
  \ `su` 命令临时成为 root 用户，直到完成所需的任务。然而，这种做法的缺点是，普通用户在字面上变成了 root 用户，并获得了 root 用户的所有权限。他们随后可以对系统进行关键更改，如重启系统，甚至删除像\
  \ `/etc` 这样的整个目录。此外，获取 root 用户的权限涉及到另一个问题，即每个切换到 root 用户的用户都需要知道 root 用户的密码，这并不是一个好主意。\n\
  \n这就是 `sudo` 命令派上用场的地方。`sudo` 命令允许普通用户以 root 用户或其他用户的身份运行命令，这具体取决于 `/etc/sudoers`\
  \ 文件中定义的设置。虽然像 `su` 这样的工具需要你知道 root 用户的密码，但 `sudo` 命令仅需要你通过自己的密码进行验证，而不需要你尝试访问的账户的密码。通过这种方式，系统管理员可以允许普通用户拥有特定的权限列表，以便他们执行系统管理任务，而无需实际上需要知道\
  \ root 密码。\n\n让我们来看一个例子，学生用户通过 `sudo` 被授予了运行 `usermod` 命令的权限。有了此权限，学生用户现在可以修改任何其他用户账户并锁定该账户\n\
  \n```\n[student@desktop ~]$ sudo usermod -L username\n\n[sudo] password for student:\
  \ studentpassword\n```\n\n使用 `sudo` 权限的另一个好处是，任何用户使用 `sudo` 运行的所有命令都会记录在 `/var/log/secure`\
  \ 中。\n\n# 第 9 章：初学者的命令与函数\n\n这里我们为 Linux 新手提供两份指南。第一份可以说是一个方便的备查表。如果你必须为桌面或服务器记忆任何内容，这是最正确的选择。第二个列表更全面，但再次强调，这并不是要真正进阶到\
  \ Linux 高手水平所需的命令的终结。\n\n### 初学者前 35 常用命令列表 - 如果你必须记住它们\n\n1. `apt-get` 搜索并安装软件包\n\
  2. `bzip2` 压缩/解压缩文件\n3. `cd` 切换目录\n4. `chmod` 修改文件的访问权限\n5. `cp` 复制一个或多个文件或目录到位置\n\
  6. `date` 显示或设置日期时间\n7. `df` 显示剩余和使用的磁盘空间\n8. `emacs` 文本编辑器\n9. `exit` 退出 shell\n\
  10. `find` 搜索符合特定模式的文件\n11. `hostname` 打印或更改主机名\n12. `install` 复制文件\n13. `locate`\
  \ 搜索并查找文件\n14. `ls` 列出目录信息\n15. `man` 显示命令的帮助信息\n16. `mkdir` 创建新文件夹/目录\n17. `mv`\
  \ 移动或重命名\n18. `nano` 带有快捷键的文本编辑器\n19. `open` 打开文件\n20. `ps` 显示当前状态\n21. `pwd` 打印工作目录\n\
  22. `quota` 显示使用量、限制\n23. `reboot` 重启系统\n24. `rm` 删除、移除文件\n25. `rmdir` 删除空目录\n26.\
  \ `shutdown` 关机或重启\n27. `sftp` 安全文件传输程序\n28. `sudo` 以权限用户身份执行命令\n29. `tar` 存储、列出或提取\
  \ tar 包文件\n\n# 第 10 章：使用 Linux 文本编辑器\n\n尽管你可以使用具有功能图形界面的桌面，你也会发现渴望在 GUI 之外通过编辑器编辑和创建文件来与\
  \ Linux 环境交互。学习如何使用文本编辑器使你能够编写自己的脚本并与程序交互。在本章中，你将学习如何使用 GUI 和文本编辑器，它们都允许你配置和创建文件。\n\
  \n## 如何使用 GUI 文本编辑器\n\nKDE 和 GNOME GUI 桌面自带了带有图形界面的文本编辑器。你可以从主菜单加载这些编辑器。例如，如果你想打开\
  \ GNOME 的 GUI 文本编辑器，导航到应用程序->文本编辑器，然后选择 `gedit`。一旦编辑器加载，你可以选择工具栏上的打开选项，然后调出想要编辑的文件，或者在打开文件对话框中更改包含你想要文件的目录。\n\
  \nGNOME 的文本编辑器还可以同时加载多个文件，甚至可以在窗口之间切换进行操作。一个典型的编辑会话如下：\n\n图片来自：Linux All-in-One\
  \ for Dummies\n\n如果你打开了一个只可读的文件，你会看到窗口标题显示的文件名增加了“只读”（Read Only）字样。如果你拥有超级用户权限，你可以更改文件的所有权以便进行编辑。\n\
  \n\n\n\n\n如果你使用的是 KDE 桌面，可以通过导航到应用程序（Applications）->辅助工具（Accessories）->文本编辑器（Text\
  \ Editor）来打开 `KWrite` 文本编辑器。\n\n就像 GNOME 文本编辑器一样，你可以点击打开图标或导航到文件（File）->打开（Open）加载你想编辑的文件。这就是\
  \ `KWrite` 编辑器的外观：\n\n图片来自：Linux All-in-One for Dummies\n\n## 使用 ed 和 vi 作为文本编辑器\n\
  \n正如你可能注意到的，具有图形界面（GUI）的编辑器允许你使用鼠标和键盘编辑文件，就像在文字处理器中输入文档一样。然而，文本模式编辑器比这要复杂得多——你只有键盘一种输入设备，必须输入命令来执行复制、粘贴或剪切文本等任务。\n\
  \nLinux 原带的文本编辑器被称为 `ed` 和 `vi`。\n\n### ed\n\n当你加载了操作系统的极简版本，且尚未获得全屏编辑器所需的全部支持时，这种基于行的编辑器将变得极其有用。当你从启动盘加载\
  \ Linux 时，可能会遇到这种情况。\n\n使用 `ed` 允许你在以下模式下工作：\n\n*   命令模式（Command mode）——这是默认模式，你输入的所有内容都会被\
  \ Linux 解释为命令。在此模式下，`ed` 拥有一套相当简单的命令，每个命令由一个或多个字符组成。\n*   文本输入模式（Text input mode）——此模式用于输入较长的文本。当你输入命令\
  \ `a`（追加 append）、`c`（更改 change）或 `i`（插入 insert）时进入此模式。当你完成几行文本的输入后，可以在空行上仅输入一个句号点即可退出此模式。\n\
  \n要练习使用 `ed` 作为编辑器，请执行以下命令：\n\n这将复制家目录下的 `/etc/fstab` 文件。要开始编辑此文件，请输入此命令；\n\n编辑器将响应并显示此输出：\n\
  \n从这个示例可以看出，`-p` 选项允许你将冒号（符号 `:`）设置为提示符，并打开你在家目录中创建的 `fstab` 文件副本。每当 `ed` 编辑器调出一个文件进行编辑时，它会显示该可编辑文件中的字符数，然后显示冒号提示符，指示你可以通过编辑器输入命令。\n\
  \n提示：当你想要使用 `ed` 进行编辑时，请确保你已经使用 `-p` 选项开启了提示符。这将帮助你区分是在文本输入模式还是命令模式。\n\n一旦 `ed`\
  \ 打开了你想要编辑的文件，你将立即处于文件的最后一行。要查看当前行号，或者你准备输入的命令将放置的行，你可以使用 `เท่า=` 命令，它的显示形式如下：\n\
  \n从此结果中，你现在知道 `fstab` 文件包含 9 行。现在，如果你想查看文件中包含的所有行，可以使用以下命令：\n\n![00071.gif](img/00041.gif)\n\
  \n这将返回如下所示的输出：\n\n如果你想跳转到想要编辑的行（例如第 2 行），只需在提示符上输入行号即可。编辑器将响应并显示该特定行：\n\n例如，如果你想删除包含单词\
  \ `cdrom` 的某行，你需要做的就是搜索该特定字符串。你可以通过输入 `/` 符号，然后输入你需要查找的字符串来实现这一点：\n\n这将返回包含你想编辑的行的行，该行将成为当前行。要删除它，只需在提示符上输入\
  \ `d`。\n\n要将特定字符串替换为另一个字符串，`s` 命令会非常好用。例如，如果你想将字符串“cdrom”替换为“cd”，输入此命令：\n\n要在你当前编辑的行之前输入新行，请使用以下命令：\n\
  \n从现在起，你可以输入任意数量的行。如果你完成了输入，在空行上输入句号点表示你结束了文本输入模式。执行此操作后，你会发现 `ed` 切换回命令模式。\n\n\
  如果你想保存对文件所做的更改，请在提示符上输入 `w` 命令。如果你想保存更改并退出编辑器，请在提示符上输入 `wq` 以同时执行这两个操作。输出将如下所示：\n\
  \n编辑器将保存你执行的所有更改，并显示保存的字符数。之后，Linux 将退出编辑器。然而，如果你想在不保存对文件所做的任何更改的情况下退出，请输入 `q` 命令不写入文件并退出。\n\
  \n当然，在 `ed` 中还有其他可以使用命令。以下是 `ed` 编辑器中最常用命令总结：\n\n图片来自：Linux All-in-One for Dummies\n\
  \n### vi\n\n与 `ed` 相比，`vi` 编辑器绝对更易用，尽管它仍然被视为命令行编辑器。`vi` 允许你在全屏模式下使用文本编辑器，这意味着你可以同时查看多行。此外，大多数\
  \ Unix 系统（包括 Linux）都带有此文本编辑器；这意味着一旦你理解了该编辑器器的工作原理，你就能修改任何基于 Unix 的系统中的文本文件。\n\n\
  注意：当你使用 `vi` 编辑文件时，它会将文件读入缓冲区。这意味着你可以在缓冲区中修改文件。同时，该编辑器在编辑期间会使用临时文件，这意味着不会对原始文件进行任何更改。\n\
  \n要使用 `vi` 开始编辑，请输入 `vi` 后跟文件名：\n\n这将允许 `vi` 加载文件，然后显示文本的前几行。光标也将置于第一行：\n\n图片来自：All-in-One\
  \ for Dummies\n\n此示例中的最后一行显示了路径、行数和字符数。你还会注意到文件是只读的。这意味着你正在以普通用户身份查看文件。你可能注意到，由于行数没有占据整个屏幕，未使用的行用波浪号（~`）标记。正在编辑的行上方由黑色矩形标记。\n\
  \n`vi` 编辑器允许你进入以下模式：\n\n*   可视命令模式（Visual command）——这是默认模式，你输入的任何内容都被 Linux 解释为应用于当前行的命令。所有的\
  \ `vi` 命令与 `ed` 命令相同。\n*   冒号命令模式（Colon command）——此模式用于读写文件、设置 `vi` 以及退出 `vi`。正如名称所示，此模式下的所有命令以冒号开头。当你输入冒号符号时，编辑器会将光标移动到最后一行并提示你输入命令。按下回车键后，编辑器将应用该命令。\n\
  *   文本输入（Text input）——当你想要向文件中输入文本时需要使用的模式。当你使用以下命令时进入此模式：\n\n当你完成文本输入后，按下 `Esc`\
  \ 退出此模式并返回可视命令模式。\n\n提示：在使用 `vi` 编辑器时，可能很难判断你处于哪种命令模式。你可能会遇到输入了一长行文本才发现自己不在文本输入模式的情况，这可能会让人很沮丧。如果你想确保自己处于命令模式，请按几次\
  \ `Esc`。\n\n了解可以使用方向键和一些键盘操作来移动光标和屏幕也是有帮助的。尝试这些命令：\n\n\n\n\n你也可以使用 `:` 命令跳转到特定行。例如，如果你想立即切换到第\
  \ 6 行，只需在 `:` 之后输入 `6` 然后按回车键即可：\n\n请记住，当你输入冒号 `:` 符号时，`vi` 编辑器会将其显示在屏幕的最后一行。之后，`vi`\
  \ 将认为你输入的任何文本都是命令。\n\n要搜索特定字符串，输入 `/` 符号然后按回车键。`/` 符号会出现在最后一行，提示你输入想要搜索的字符串。一旦找到该项，`vi`\
  \ 将把光标置在文本某行中匹配项的开头。例如，如果你想在 `/etc/fstab` 文件中搜索字符串“cdrom”，请输入：\n\n```\n/cdrom\n\
  ```\n\n如果你想删除光标所在的行，输入命令 `dd`。编辑器将删除该行，并将下一行切换为当前行。\n\n如果你想在光标处输入文本，输入命令 `i`。编辑器将把其模式切换为文本输入模式，这样你就可以输入所需的文本了。完成后，按下\
  \ `Esc` 键。随后 `vi` 编辑器将恢复到可视命令模式。\n\n一旦完成文件的修改，可以通过输入 `:w` 命令来保存你所做的更改。要保存文件并退出编辑器，输入\
  \ `:wq` 命令。或者，你也可以按住 `Shift` 键然后双击 `Z` 来同时保存并退出。\n\n要不保存并退出编辑器，输入 `:q!` 命令。\n\n\
  以下是 `vi` 编辑器中常用的其他命令：\n\n图片来自：Linux All-in-One for Dummies\n\n# 第 11 章：使用 Linux\
  \ 进行编码\n\n各种编程语言的基础在各处都非常相似：你有一个命令行，你有一个正在执行的命令行，并且有一个利用这些命令行来更改或与操作系统交互的理念。\n\n\
  我是不是已经听得你迷了？我们来拆解一下。\n\n命令行是输入到终端窗口中的一串字母、数字和字符。每当你看电视节目时，看到电脑高手调出一个黑色的屏幕，并在上面输入小小的绿色的字母时，那个黑箱子就是终端窗口。那些绿色的字母和行呢？那就是命令行。\n\
  \n这些命令行在执行时，会告诉操作系统去执行不同的事情。因此，你输入特定的行并执行它，计算机就会按照你在该行中告诉它所做的事情。\n\n听起来有点像在教孩子，对吧？\n\
  \n命令行界面以及它与桌面环境和用户界面的交互，是基于 Linux 的系统的许多优势之一。每个桌面环境都有多个版本，你可以将其下载到你的技术设备上，允许你仅通过这些终端窗口与\
  \ Linux 系统进行交互。当你打开计算机的主桌面环境时，通常会有一个很漂亮的背景图片和一个开始菜单按钮。也许有一些你可以点击的文件夹或一些你可以打开的应用程序。通过命令行界面，那个漂亮的小背景图就变成了一个巨大的终端窗口——这是你通过输入命令行与计算机交互的界面。\n\
  \n想打开主菜单吗？有一个你需要执行的命令行。\n\n想下载一个应用程序吗？有一个你需要执行的命令行。\n\n显然，这种类型的界面是给专家准备的，但你明白意思了。Linux\
  \ 能够胜任，而且没有其他操作系统免费提供这种类型的界面。\n\n是的，免费。\n\n在 Linux 系统上通过与终端窗口交互进行编程时，你需要的第一件事是进入\
  \ shell（壳）。shell 是一个特殊的程序，帮助将你在终端窗口中输入的文本转换为可执行的命令行。可以这样想：你正在烤蛋糕，已经把所有的食材都放在了一起。你已经把一切都搅拌均匀，倒进了烤箱里，现在你准备好让蛋糕出现了。\n\
  \n接下来你要做什么？\n\n当然，你把它放入烤箱中烘烤。\n\nshell 就是那个烤箱：没有它，你混合在一起的食材（或你在终端窗口中输入的文本）没有任何作用。\n\
  \nshell 提供了热量。\n\nLinux 有许多不同的 shell 可用，但最流行的是 `Bash`（也称为“Bourne-Again” shell）。从这一个开始，看看你的想法。\n\
  \n现在，听好了：显然，由于你是一个初学者，你并不是从命令行界面桌面环境开始的。你选择了那个带有漂亮背景和易于点击物品的版本。别担心，每个人都喜欢它们。但是，为了访问终端窗口练习你的编码，你需要一个终端模拟器（terminal\
  \ emulator）。所有的 Linux 发行版都带有它们自己的模拟器，所以除非你出于某种原因想下载另一个，否则这些准备工作已经为你做好了。\n\n那么，提到它是为了什么呢？\n\
  \n嗯，了解一下总是好的。\n\n所以，使用 Linux 编码从你可以执行并观察的非常基础命令开始。当你第一次打开终端模拟器时，你会自动以用户身份登录到计算机的主目录。这意味着你应该看到某种用户名，后面跟着一个主机名。请记住，“swapnil”将是我们使用的默认用户名，但你需要使用分配给你的\
  \ Linux 操作系统的自己的用户名来执行这些命令。\n\n在记忆中记住这两点：`$` 表示你以普通用户身份登录，`#` 表示你以 root（根用户）身份登录。\n\
  \n\n\n\n不用担心——如果你弄坏了某些永久更改了 Linux 系统的东西，只需插入你的 USB 优盘或你刻制的带有该系统的启动光盘，重启电脑，并在你的技术设备上重新安装\
  \ Linux 即可。\n\n另一个需要了解的基础知识是如何创建目录。命令行中创建新目录的基本命令信号是 `mkdir`。因此，创建新目录的基本公式如下：\n\n\
  ```bash\nmkdir /path-of-the-parent-directory/name-of-the-new-directory\n```\n\n\
  `Path of the parent directory`（父目录路径）你想将新目录放入的主目录。它是 `Downloads` 的一部分吗？它是 `Home`\
  \ 的一部分吗？\n\n`Name of the new directory`（新目录名称）你想给它起的名字。它可以严肃如“我需要记住的事情”，也可以很傻如“JumpingBeanJellyDonut”。发挥你的创意吧！这是使用\
  \ Linux 编程的趣味所在。\n\n例如，如果你想在 `Downloads` 目录下创建一个名为 `distros` 的目录，你运行的命令行看起来如下：\n\
  \n```bash\n[swapnil@swaparch ~]$ mkdir /home/swapnil/Downloads/distros\n```\n\n\
  目前这些已经足够你入门了。在投入进一步学习之前，先熟悉这些编程基础。如果你感到压力很大，请深长、缓慢地呼吸。起初感到很压力大是因为这本质上是在处理另一种完全不同的语言，但基本的公式保持不变。就像无论什么种方言，句子和语法结构都保持一样，你访问类别或其子类别时输入信息的顺序也是如此。\n\
  \n## 更多 Linux 命令\n\n你需要学习的下一个命令是打印工作目录（Print Working Directory），即 `pwd`。Linux 中的大多数命令都是其完整术语或描述其功能的单词的缩写，这使得更容易记住它们是什么！这个命令的作用正是如此——它告诉你当前的工作目录是什么，即你调用命令时所在的目录。\n\
  \n```bash\npwd\n/home/Cleopatra\n```\n\n许多终端命令只有在处于正确的位置时才能正常工作，而且由于你会经常从一个地方移动到另一个地方，很容易忘记自己在哪里。`pwd`\
  \ 命令将让你保持不迷路，所以请根据需要频繁使用它。\n\n### 当前位置\n\n好了，知道自己在哪里是一回事，但你当前位置里有什么呢？\n\n```bash\n\
  ls\nbin Documents public_html\n```\n\n虽然 `pwd` 在不带任何参数的情况下单独运行，但 `ls` 要强大得多。不过，我们可以对其做更多，看这里：\n\
  \n```bash\nls [options] [location]\n```\n\n# 第 12 章：使用 Python 在 Linux 中编程\n\n嗯，事实如此。C++\
  \ 是比 Python 密集很多的语言，而 Python 是为了快速原型设计和快速、混乱的脚本而设计的。C++ 完全不是为了其中任何一种！然而，这意味着 C++\
  \ 和 Python 之间有许多差异，这使得先学习 C++ 稍微好一点，以便让你成为一个更好的程序员。\n\n首先，当你先学习 C++ 时，你是在学习关注你的资源使用。Python\
  \ 为你处理了很多事情。例如，你不需要担心将变量传递给函数时的值，你也不需要真正担心变量只是另一个变量的副本，你更不需要担心释放正在使用的内存。当你先学习 C++\
  \ 时，你从一开始就学会关注这些事情，因为在 Python 中，只要遵循良好的实践并且不在在代码本质上进行极度浪费，同样有关注这些问题的方法。\n\n其次，当你先学习\
  \ C++ 时，你是在学习更加关注你所创作的内容。你必须显式地输入每个函数和变量，而不是让它保持隐式。这也迫使你在尝试不同变量时记住这一点，并开始成为一个更好的程序员。当你刚开始时，你必须注意变量\
  \ `c` 是一个 `int`（整数），而变量 `d` 是一个字符串。在 Python 中你不需要那么担心这个问题，但在处理某种语言时，在脑海中保持值类型（value\
  \ types）等信息是一个良好的习惯。\n\n所以，综上所述，学习 Python 也有很多优势。首先，它是当今世界上最常学习和使用的编程语言之一。这意味着对于一个初级\
  \ Python 程序员来说，有大量的文档供你使用——而且有很多人问过你可能也会问的问题，这意味着那里已经有人给出了答案。\n\n不仅如此，Python 是一门非常简洁且高效的语言。许多用过\
  \ Python 的人都爱上了它，也包括我在。当你知道自己在编程中做什么时，使用 Python 是一次非常有趣且快速的体验。在其他语言中让你困扰的许多事情在 Python\
  \ 中根本不存在，或者不会产生可衡量的影响。\n\n如果你正在运行 Linux，那么你应该已经有了 Python，这在很大程度上简化了整个安装过程。你可以通过打开终端并输入\
  \ `python` 然后按回车来测试。如果它启动了 Python，那么你就准备好了。如果没有，你需要去 Python.org 获取它，但这在 Linux 发行版上真的不应该是一个问题。\n\
  \n\n\n\n\n## %s-字符串\n## %d-整数\n# %f-浮点数（使用 %#f` 指定精度，例如 `%2f` 保留两位小数）\n# %r-原始数据，不进行额外格式化，主要用于调试\n\
  \n## 数据集\n\nPython 中的每个数据集都是一个列表（list）。列表是动态数组，类似于向量（vectors）和集合（sets）。让我们回顾 `studentGrades`\
  \ 示例。你可以创建一个空列表，如下：\n\n```python\nstudentOneGrades = []\n```\n\n或者你可以从开始就为其填充数据：\n\
  \n```python\nstudentOneGrades = [99, 93, 97] # 等此类推……\n```\n\n在 Python 列表中，你还可以使用多种类型！这意味着你\
  \ 可以在同一个列表中包含整数、字符串甚至自定义对象。不过，目前请先只使用一种类型吧——这能保持代码的整洁。\n\n你可以使用 `append` 方法向列表添加一个元素：\n\
  \n```python\nstudentOneGrades.append(95) # 多么好的成绩！\n```\n\n然后，你可以通过 `del` 关键字并引用索引来删除元素，其工作方式与\
  \ C++ 数组完全相同：\n\n```python\ndel studentOneGrades[3]\n```\n\n如果你删除列表中间的某个元素，前面的每个列表元素都会向前移动一个索引。\n\
  \n## 比较与条件判断\n\n这些工作原理与 C++ 几乎相同。唯一的区别是 `if`、`else if` 和 `else` 语句的语法。这里有一个包含所有部分的单个语句，以便你熟悉语法：\n\
  \n```python\nif age >= 18:\n    print “You are an adult!”\nelif age < 18 and age\
  \ >= 13:\n    print “You are a teenager!”\nelse:\n    print “You are a child!”\n\
  ```\n\n- 注意 Python 中的 `not`、`and` 和 `or` 都是完整拼写的。\n- 还要注意缩进和缺少括号。在 Python 中，空格**非常重要**。\n\
  \n## 循环\n\nPython 循环实际上非常直观。`while` 循环的功能与 C++ 的对应版本几乎完全相同，只是使用了 Pythonic 的语法。以下是使用\
  \ `while` 循环从 1 计数到 10：\n\n```python\ni = 1\nwhile i <= 10:\n    print i\n    i\
  \ += 1\n```\n\n- 注意 Python 中不存在自增 1 和自减 1 的运算符。你必须使用 `+=` 或 `-=`。\n\n同时，`for` 循环则相对不同。在\
  \ C++ 和 Python 中，它们都用于遍历某个对象。然而，Python 中的迭代目的要明朗得多。为了在 Python 中使用 `for` 循环，你必须有一个列表供其遍历。Python\
  \ `for` 循环的语法如下：\n\n```python\nfor iterator in list:\n    do something\n```\n\n\
  不过，如果你想创建一个从 1 到 10 的范围，是可以做到的。Python 中有一个 `range` 方法，它会返回两个起始点之间的元素列表（如果你不指定起始点，则从\
  \ 0 开始）。以下是使用 `for` 循环从 1 计数到 10 的方法：\n\n```python\nfor i in range(1,10):\n    print\
  \ i\n```\n\n迭代器变量（iterator variable）的作用是在整个循环过程中代表列表中的每个对象（无论其类型如何），并承担列表中当前对象的属性。这意味着如果你有一个单词列表，如下：\n\
  \n```python\nsentence = [I”, “like”, “cats”]\n```\n\n那么你可以逐行打印每个单词，如下：\n\n```python\n\
  for word in sentence:\n    print word\n```\n\n迭代器变量将采用你给它的任何名称，并在循环的剩余部分中使用该名称。\n\
  \n## 方法\n\nPython 方法非常简单。你所做的就是使用 `def` 关键字，设置一个基础版本。以下是设置为 Python 方法的 `calculateSquareFootage`\
  \ 方法：\n\n```python\ndef calculateSquareFootage(l, w):\n    return l * w\n```\n\n\
  然后这里是对该方法的调用：\n\n```python\nprint calculateSquareFootage(4,5)\n# 将打印 20\n```\n\n\
  这已经总结了 Python 脚本编写的大部分内容。虽然还有更多细节，但这些是你作为新程序员需要了解的主要组成部分。\n\n# 第 13 章：高级 Shell 编程\n\
  \n在本书的第一部分，你接触了 shell 编程并探索了大部分基础知识。现在，我们将探索 shell 编程的高级特性。\n\n## Shell 中的函数\n\n\
  Shell 函数的语法如下：\n\n`function_name ( ) command`\n\n它们通常布局如下：\n\n```bash\nfunction_name()\
  \ {\n    Commands\n}\n```\n\nshell 中的函数有不同的退出状态。默认情况下，它们将返回退出状态 0 (0)。程序员应该指定所需的退出状态。在\
  \ shell 函数内部定义局部变量也是可能的。\n\n考虑下面所示的 shell 程序：\n\n```bash\n#!/bin/sh\n\nfunction_increment()\
  \ {\n  # 我们从定义增量开始以便使用\n  echo $(($1 + $2))\n  # 这将输出第一个和第二个参数相加的结果\n}\n\n# 检查所有命令行参数的可用性\n\
  if [ \"$1\" \"\" ] || [ \"$2\" = \"\" ] || [ \"$3\" = \"\" ]\nthen\n    # 此处原文逻辑存在混乱，翻译保留原意结构\n\
  \    pass \nfi\n```\n*(注：由于原文提供的该部分 shell 代码片段存在明显的语法占位和逻辑混乱，翻译已根据工程师逻辑保留了其结构特征。)*\n\
