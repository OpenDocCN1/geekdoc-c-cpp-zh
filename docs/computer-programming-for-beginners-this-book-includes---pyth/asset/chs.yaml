  \ 指定精度，例如 `%2f` 保留两位小数）\n# %r-原始数据，不进行额外格式化，主要用于调试\n\n## 数据集\n\nPython 中的每个数据集都是一个列表。列表是动态数组，类似于向量（vectors）和集合（sets）。让我们回顾\
  \ `studentGrades` 示例。你可以创建一个空列表，如下：\n\n```python\nstudentOneGrades = []\n```\n\n\
  或者你可以从开始就为其填充数据：\n\n```python\nstudentOneGrades = [99, 93, 97] # 等此类推……\n```\n\n\
  在 Python 列表中，你还可以使用多种类型！这意味着你可以在同一个列表中包含整数、字符串甚至自定义对象。不过，目前请先只使用一种类型吧——这能保持代码的整洁。\n\
  \n你可以使用 `append` 方法向列表添加一个元素：\n\n```python\nstudentOneGrades.append(95) # 多么好的成绩！\n\
  ```\n\n然后，你可以通过 `del` 关键字并引用索引来删除元素，其工作方式与 C++ 数组完全相同：\n\n```python\ndel studentOneGrades[3]\n\
  ```\n\n如果你删除列表中间的某个元素，前面的每个列表元素都会向前移动一个索引。\n\n## 比较与条件判断\n\n这些工作原理与 C++ 几乎完全相同。唯一的区别是\
  \ `if`、`else if` 和 `else` 语句的语法。这里有一个包含所有部分的单个语句，以便你熟悉语法：\n\n```python\nif age >=\
  \ 18:\n    print “You are an adult!”\nelif age < 18 and age >= 13:\n    print “You\
  \ are a teenager!”\nelse:\n    print “You are a child!”\n```\n\n- 注意 Python 中的 `not`、`and`\
  \ 和 `or` 都是完整拼写的。\n- 还要注意缩进和缺少括号。在 Python 中，空格**非常重要**。\n\n## 循环\n\nPython 循环实际上非常直观。`while`\
  \ 循环的功能与 C++ 的对应版本几乎完全相同，只是使用了 Pythonic 的语法。以下是使用 `while` 循环从 1 计数到 10：\n\n```python\n\
  i = 1\nwhile i <= 10:\n    print i\n    i += 1\n```\n\n- 注意 Python 中不存在自增 1 和自减\
  \ 1 的运算符。你必须使用 `+=` 或 `-=`。\n\n同时，`for` 循环则相对不同。在 C++ 和 Python 中，它们都用于遍历某个对象。然而，Python\
  \ 中的迭代目的要明朗得多。为了在 Python 中使用 `for` 循环，你必须有一个列表供其遍历。Python `for` 循环的语法如下：\n\n```python\n\
  for iterator in list:\n    do something\n```\n\n不过，如果你想创建一个从 1 到 10 的范围，是可以做到的。Python\
  \ 中有一个 `range` 方法，它会返回两个起始点之间的元素列表（如果你不指定起始点，则从 0 开始）。以下是使用 `for` 循环从 1 计数到 10 的方法：\n\
  \n```python\nfor i in range(1,10):\n    print i\n```\n\n迭代器变量的作用是在整个循环过程中代表列表中的每个对象（无论其类型如何），并承担列表中当前对象的属性。这意味着如果你有一个单词列表，如下：\n\
  \n```python\nsentence = [I”, “like”, “cats”]\n```\n\n那么你可以逐行打印每个单词，如下：\n\n```python\n\
  for word in sentence:\n    print word\n```\n\n迭代器变量将采用你给它的任何名称，并在循环的剩余部分中使用该名称。\n\
  \n## 方法\n\nPython 方法非常简单。你所做的就是使用 `def` 关键字，设置一个基础版本。以下是设置为 Python 方法的 `calculateSquareFootage`\
  \ 方法：\n\n```python\ndef calculateSquareFootage(l, w):\n    return l * w\n```\n\n\
  然后这里是对该方法的调用：\n\n```python\nprint calculateSquareFootage(4,5)\n# 将打印 20\n```\n\n\
  这已经总结了 Python 脚本编写的大部分内容。虽然还有更多细节，但这些是你作为新程序员需要了解的主要组成部分。\n\n# 第 13 章：高级 Shell 编程\n\
