  \n### 访问和更新字符串\n\n你也可以使用键 `join` 来组合字符串。\n\n\n\n嗯，如果你回想一下高中的数学课，你可能还记得那时候用过变量。而\
  \ Python 中的变量工作原理完全一样。\n\n本质上，变量是一个容器或一个代号。它是一个代表数字的单词或字母。这个数字可以改变，但你可以在数学题的任何地方写下这个字母或单词来代表它。你几乎可以把它想象一个盒子，每当你告诉代码查看盒子内部时，它都会找到你存放在里面的信息。这意味着你可以定期更改信息（通过更改\
  \ `variable` 的值），但 Python 始终知道去哪里找！\n\n所以，如果你把思绪回回到你在校园学数学的日子，你可能记得见过像下面这样的写法：\n\
  \n`10 + x = 13`\n\n求出 `x`。\n\n在这种情况下，`x` 实际上是 `3`。\n\n这在 Python 中的工作方式完全一样，只不过没有“寻找”\
  \ `x`。相反，我们是在告诉 Python `x` 是什么，然后在以后引用它。那么我们该怎么做呢？其实非常简单：\n\n```\nx = 3\n```\n\n\
  我们也可以说：\n\n```\nMyVariable = 3\n```\n\n让我们打开脚本模式，尝试在一个小程序的部分使用它。只需输入：\n\n```\nMyVariable\
  \ = 3\nprint(MyVariable)\n```\n\n现在保存程序并运行它。当你这样做时，你会发现它简单地输出了 `variable` 的值——在一种情况下是“3”。\n\
  \n我们还没有真正解释 `print` 的作用，但到目前你应该已经推断出来了。这只是一个向屏幕上写入文本的命令，你可以像我们之前写“Hello World”时那样使用引号让它变成你想要的任何内容。\n\
  \n但你可能注意到，在使用 `variable` 时我们不需要使用引号。那是因为引号的作用仅仅是“原封地写入这段文本”。\n\n## 整数、字符串和浮点数，天哪！\n\
  \n变量 `MyVariable` 包含数字 `3` 且没有小数位。因此我们称其为**整数**（integer）。换句话说，我们根据变量所包含的数据为变量命名。既然数字‘3.72’是一个**浮点数**（float），我们将包含该数字的变量也称为浮点数！\n\
  \n到目前为止都很简单……但情况将变得复杂得多，因为变量的类型多得多，至少熟悉大多数类型将是有价值的……\n\n整数和浮点数都被认为是“数字变量”。这意味着它们包含数值数据。\n\
  \n实际上，还有两种类型的变量。这些是“**长整数**”（long）和“**复数**”（complex）。你使用这两个类型会少一些，但本质上，当你需要非常长的数字时使用长整数，当你需要非常复杂的数字时使用复数。\n\
  \n所以你不需要担心那个。但在你的编程之旅中，你绝对会遇到“**字符串**（string）”。字符串是另一种类型的变量，但它不是数值型的。相反，字符串包含字母或单词。所以一个字符串可以是‘a’，也可以是‘Adam’。如果我们说：\n\
  \n```\nMyString = “Hello World!”\nprint(MyString)\n```\n\n那么程序就会像之前一样简单地打印字符串‘Hello\
  \ World!’。现在我们可以更改 `MyString` 的值，输出也会随之改变。当我们要在很多地方使用同一个字符串但可能需要更改它时，这非常有帮助。例如，如果我们想在应用中通过名称引用用户，我们可以使用字符串。我们可以在程序启动时将名称分配给字符串，然后在其他地方轻松地使用该名称引用他们。\n\
  \n我们到目前为止看过的所有变量都有一个共同点——它们持有一个数据项或单一值。然而，还有其他类型的变量包含多个数据项。所以如果我们把字符串、整数和浮点数比作盒子，那么这些变量更像文件柜、文件夹或书架。\n\
  \n使用 Python 时可用的标准数据类型有：\n\n- 数字 (Numbers)\n    - 整数 (Integers)\n    - 浮点数 (Floats)\n\
  \    - 长整数 (Longs)\n    - 复数 (Complexes)\n- 字符串 (Strings)\n- 列表 (Lists)\n- 元组 (Tuples)\n\
  - 字典 (Dictionaries)\n\n目前你不需要学习列表、元组和字典，但如果你等不及了，可以直接跳到所谓的“高级变量”部分。\n\n## 在变量上执行操作\n\
  \n还记得我们说过变量允许我们的程序发生变化吗？因为我们可以在代码中的任何时候随时更改 `variable` 的值。\n\n正如我们已经看到的，我们可以在代码开始处简单地设置变量的值，如下：\n\
  \n```\nMyNumber = 3\n```\n\n但如果我们稍后想更改数字的值，只需在后面再次更改它即可。例如：\n\n```\nMyNumber = 3\n\
  print(MyNumber)\nMyNumber = 4\nprint(MyNumber)\n```\n\n如果你运行这个程序，它将简单地输出‘3’然后是‘4’。如下：\n\
  \n同样，我们也可以使用我们在第 4 步中完全相同的操作来更改变量。例如：\n\n```\nMyNumber1 = 3\nMyNumber2 = 4\nMyNumber3\
  \ = MyNumber1 + MyNumber2\nprint(MyNumber3)\n```\n\n你能猜到它会输出什么吗？\n\n或者这个：\n\n```\n\
  MyNumber1 = 3 * 2\nMyNumber2 = 4\nMyNumber1 = MyNumber2 – 3\nMyNumber3 = MyNumber1\
  \ + MyNumber2\nprint(MyNumber3)\n```\n\n你能猜到这会输出什么吗？\n\n你甚至可以让变量引用自己。例如，你认为这行代码是做什么的：\n\
  \n```\nMyNumber1 = MyNumber1 + 1\n```\n\n本质上，这让 `MyNumber1` 增加了 1。\n\n现在这可能看起来有点奇怪，但当我们学习\
  \ Python 中可以使用的不同命令时，它应该会变得更有意义！\n\n你可能想的下一个问题是，是否也可以对字符串这样做？好消息是，你可以这样做！当然，你不能用字符串乘以字符串（因为那没有任何意义！）但你可以做的是将两个字符串相加创建一个新的。例如：\n\
  \n```\nFirstName = “Bill”\nLastName = “Gates”\nFullName = FirstName + LastName\n\
  print(FullName)\n```\n\n你很快就会看到为什么这一切很重要了！\n\n（实际上，我说不能乘以字符串时并没有完全诚实。事实上，编写 `FirstName\
  \ = “Bill” * 10` 会创建一个值为“BillBillBill...”的字符串！）\n\n# 命名规范与注释\n\n变量是编程中最常见的元素之一，因为它们允许事物以受控的方式变化——从而允许随时间或响应输入变化的动态程序。\n\
  \n但变量与其他语言的不同之处在于，它们必须先定义。在 Python 中，我们可以简单地说：\n\n```\nx = 3\n```\n\n在程序的任何位置，然后\
  \ `x` 将被创建并赋值为 3。但在 Java（另一种流行的编程语言）中，`x` 必须先通过这样的语句创建：\n\n```\nInt x;\nx = 3;\n\
  ```\n\n部分原因是其他编程语言使用了更广泛的变量——例如“布尔值”（Booleans），它们只能等于 1 或 0。因为 Python 只有几种变量类型，所以它不需要那么多结构。\n\
  \n同样重要的是在命名变量时要仔细考虑。这里的目标是以逻辑化且优雅的方式编写代码，让完全陌生的人也能立即知道它是做什么的——如果你以后需要协作项目，或者回到你写的旧代码，这将非常有帮助。\n\
  \n在 Python 中使用变量时，使用驼峰命名法是一个好主意。我们已经看到像 `print` 这样的命令通常是小写，所以如果我们对变量使用驼峰法，那么它们在阅读时会非常显眼。\n\
  \n所以，如果你使用字符串来引用用户名，你应该称它为什么什么？一个很好的选择是 `UserName` 或 `Name`。这比你叫它 `Rabbit1112` 要让生活轻松得多……\n\
  \n\n\n另一个技巧是尝试选择变量，让它们在插入代码中时读起来就像是用英文编写的一样。我们将来还会更多地讨论这一点。\n\n## 使用注释\n\n为了让查找代码路径变得稍微简单一点，请注意你也可以使用注释。“注释”是你插入到代码中的纯英文文本行。当在你运行程序时，编译器会忽略这些行，但这意味着你可以为自己或团队的其他成员添加说明、备记和参考内容。\n\
  \n要插入注释，只需在你的行前面加一个 `#` 符号即可。注释将一直延伸到物理行的末尾。如果你使用 IDLE 编写代码，那么当你写对注释时，它会立即变为红色字体：\n\
  \n在编写程序时要提前考虑，因为现在花一点时间保持代码整洁，可以让你以后省去很多烦恼！\n\n# 第 8 章：处理输入\n\n目前，我们编写的所有程序都只是输出信息。正如你可以想象的……这没什么用处！如果你以前从未写过代码，你可能甚至在想这些有什么关系。毕竟，如果你想说“Hello\
  \ World”，你只需要在纸上写下来就行了……\n\n为了解决这个问题，我们需要开始邀请用户加入，并实际上与我们编写的软件交互。我们可以实现这一点的方法是使用\
  \ `input` 命令。好消息是，`input` 实际上非常容易使用！本质上，这只是让用户给变量赋值。\n\n所以，与其说：\n\n`UserName = “Bill\"\
  `\n\n你不如说：\n\n`UserName = input(“Please enter your name: ”)`\n\n现在这意味着程序将添加一个提示，要求用户输入姓名：\n\
  \n一旦用户同意我们的请求，`UserName` 将等于他们所说的内容。这意味着我们可以说：\n\n`UserName = input(“Please enter\
  \ your name: ”)`\n`print(“Hello “ + UserName)`\n\n现在，无论用户说他们的名字是什么，我们都可以用它来问候他们！恭喜你：你创建了自己的第一个交互式程序！\n\
  \n（注意，如果你使用的是 Python 2，你需要使用 `raw_input` 而不是 `input`。这是我们第一个关于 Python 2 和 Python\
  \ 3 差异的示例——但这并不大！）\n\n那么我们还能用它做些什么呢？当然，我们还可以使用 `input` 命令来获取并设置其他类型的数据。例如整数！\n\n\
  例如：\n\n`UserAge = input(“Please enter your age: ”)`\n`print(“You are “, int(UserAge))`\n\
  \n在这个例子中，还有其他几件事发生，但你可能已经推导出其中的一些。\n\n首先，我们正在创建一个名为 `UserAge` 的字符串，就像我们之前做的那样。“提示”是在询问年龄，而\
  \ `input` 将自动转换为字符串。\n\n从那里开始，我们打印输出。注意，当把字符串加到整数时，我们不能使用 `+`，因此我们只是使用一个常用的逗号来连续列出这两个值。\n\
  \n接下来，我们通过 `int(UserAge)` 这一行将用户给我们的值转换为字符串。你也可以通过说 `str(Number)` 将整数转换为字符串。通过这种方式，你可以将\
  \ 4 转换为“4”。\n\n让我们增加一点趣味，看看用这些信息和一点数学计算能做些什么……\n\n```python\nUserAge = input(\"\
  How old are you? \")\nprint(int(UserAge), \"is sooo old!\")\nYearsTo100 = 100 -\
  \ int(UserAge)\nprint(\"In \", YearsTo100, \"years, you'll be a hundred!!\")\n```\n\
  \n现在你有了一个基本上对你的年龄非常无礼的程序，并告诉你离 100 岁还有多少年。真不错！\n\n或者，如果我们更进一步一步呢？\n\n```python\n\
  UserAge = input(\"How old are you? \")\nprint(int(UserAge), \"is sooo old!\")\n\
  YearsTo100 = 100 - int(UserAge)\nprint(\"In \", YearsTo100, \"years, you'll be a\
  \ hundred!!\")\nprint(\"That is \", int(UserAge) * 360, \" days! Or \", (int(UserAge)\
  \ * 360) * 24, \" hours. Man...\")\n```\n\n这一额外意味着它现在可以告诉我们活了多少小时和多少天。我 28 岁，据说是\
  \ 10,080 天或 241,920 小时。\n\n这个程序可能有点冒犯……但它也开始整合我们学到的许多不同内容了！到目前，我们能够接受输入来创建新变量，然后对这些变量进行操作并在屏幕上显示答案！\n\
  \n## 循环\n\n输入是你开始编程时会发现自己最实用的操作之一。但随着你学习越来越多的 Python，这仍然只是你能够做的事情的一山角。\n\n例如，另一个强大的工具是使用循环。循环本质上允许一段代码持续运行并重复自身。有两种不同类型的循环，根据不同的条件运行。例如，循环最常见的示例之一是\
  \ `While` 循环。关于这个循环如何工作的线索很大程度上体现在名字里。基本上，`while` 循环在条件为真时运行。\n\n例如，我们可以说：\n\n```python\n\
  Number = 0\nwhile Number < 100:\n    Number = Number + 1\n    print(\"Counted to\"\
  , Number)\n```\n\n这一切所做的就是打印从 0 到 100 的数字。`while` 命令后面跟着一个条件语句（`Number < 100`），冒号之后的所有缩进后的内容都将在循环运行时发生。如果我们去掉缩进，那么这种标记就意味着我们已经到达了循环的结束。\n\
  \n```python\nNumber = 0\nwhile Number < 100:\nNumber = Number + 1\nprint(\"Counted\
  \ to\", Number)\nprint(\"Finished and counted to 100\")\n```\n\n在行与行之间留空格没有区别，这是另一个需要小心格式和规划时变得非常重要的情况。只需按退格键并不小心删除了缩进，就足以防止代码正常工作！这与其他类型的代码（如\
  \ `java` 或 `C#`）非常不同，在其中循环包含在大括号 `{}` 内部。\n\n注意，如果我们没有包含 `Number = Number + 1` 这一行，那么循环将永远运行！\n\
  \n我们可以使用的另一种类型的循环是 `For` 循环。`For` 本质上执行某种计数工作，并在工作完成后结束。例如，这个：\n\n```python\nfor\
  \ Counting in range(100):\n    print(Counting)\n```\n\n做了与之前的循环所做相同的事情——数到一百！但我们也可以做一些有趣的事情——例如我们可以这样做：\n\
  \n```python\nfor Counting in range(10, 100):\n    print(Counting)\n```\n\n并因此从 10\
  \ 数到 100！这是另一个看起来毫无意义的例子。当你有其他方法时，你为什么要用这样数到 100 呢？嗯，一个例子可能是遍历列表项。\n\n我们还能用循环做些什么？嗯，一个选项是\
  \ `break` 循环。这只是提前终止循环并继续执行程序的其余部分。这可以用 `while` 和 `for` 循环，并且我们以后会遇到的东西……\n\n另一个派用的是\
  \ `continue`。它的工作原理与 `break` 语句相似，不同在于它只是从开始重新开始循环。如果你是 `For` 循环，那么你测试的条件也会重置。\n\
  \n# 第 9 章：使用条件语句\n\n\n\n\n在你编写 Python 程序时，总会有那么一些时候，你需要程序能够为你做出某些决定，而不需要你时刻在场告诉它如何回答收到的每一个响应。你可以通过设置需要满足的条件来帮助实现，但当允许用户添加他们想要的任何输入时，会存在很多不确定性，而条件语句将帮助你学习如何做到这一点。由于你无法处理或猜测用户可能给出的所有答案或输入，因此这些条件语句将帮助你完成任务。你会发现，这些条件语句与你习惯的略有不同，但它们可以应用于你尝试编写许多不同的程序。它们非常简单，但很容易在它们的基础上添加内容和更改，以便你能够完成更多工作，并处理用户决定要使用的任何答案。\n\
  \n在处理这些条件语句时，你有三个选项可以使用。这些分别是 `if` 语句、`elif` 语句和 `if else` 语句。这三者都非常重要，但它们的工作方式略有不同，以帮助你实现想要完成的代码。让我们探索一下这些语句在你自己的代码中是如何工作的。\n\
  \n### 从 if 语句开始\n\n在所有条件语句中，三个中最基础的、也是我们首先要关注的是 `if` 语句。`if` 语句是一种基础条件语句，有时看起来由于过于简单而无法在日常中使用。事实上，在这一领域，你更常见的操作是使用\
  \ `if else` 语句或 `elif` 语句，但学习如何使用 `if` 语句仍然很重要，这样我们就能掌握这种条件语句的一些基础知识。\n\n你可能已经猜到这会导致大多数代码出现一些问题，但了解如何使用这些语句仍然很重要。你可以用于这些条件语句的几段简单代码包括：\n\
  \n```python\nage = int(input(“输入你的年龄:”))\n\nif (age <=18):\n    print(“你没有投票资格，请参加下一次选举！”)\n\
  \    print(“程序结束”)\n```\n\n这段代码中会有几点需要注意。如果用户运行该程序并声明他们的年龄小于 18 岁，那么程序将运行并显示列出的消息。用户可以阅读此消息然后直接在那里结束程序。\n\
  \n现在这里需要注意的一点是，当你编写这类代码时，可能会出现情况不符合计划的情况。如果用户想输入一个 18 岁或以上的年龄，那么代码目前还没有设置好处理这个问题。目前，程序只会在用户输入年龄小于\
  \ 18 岁时列出你设置好的消息。但如果他们写的年龄更大，那么它将无法满足你设置的条件，结果什么都不会发生。\n\n当然，我们不希望代码中只有一个答案是正确的，至少目前对于程序使用者的年龄是如此。他们希望能够输入当时的真实年龄，而这可能低于\
  \ 18 岁，也可能不低于。你想要确保你的程序按照你想要的方式运行，这就是我们将转向 `if else` 语句的原因。\n\n### 转向 if else 语句\n\
  \n虽然 `if` 语句是编写自己的 Python 代码时进行练习的好地方，但在编程中，并没有很多时候是你想要使用使用它们的。你可能不想让屏幕空空如也，什么都没有留给用户看到。这就是为什么我们想要学习如何使用\
  \ `if else` 语句来处理上述问题。\n\n`if else` 语句将我们在 `if` 语句中查看的内容，但将它们向前推进了另一个步骤，使其更符合逻辑并能处理更多情况。在我们之前处理过的示例中，如果用户输入任何小于\
  \ 18 岁的年龄，他们将看到我们之前的消息。但这又进了一步，因为如果用户大于 18 岁，它也会为我们提供一条消息。这个 `if else` 语句将确保用户无论在当时向系统输入什么年龄，都能得到某种消息。\n\
  \n使用我们上面的投票示例，你可以实现以下代码来创建一个 `if else` 语句：\n\n```python\nage = int(input(“输入你的年龄:”))\n\
  \nif (age <=18):\n    print(“你没有投票资格，请参加下一次选举！”)\nelse:\n    print(“恭喜你！你有投票资格。请查看你的当地投票站以获取更多信息！”)\n\
  \nprint(“程序结束”)\n```\n\n通过这个选项，你添加了 `else` 语句，它将涵盖所有不低于 18 岁的年龄。这样，如果用户确实列出了他们的年龄，屏幕上仍然会为他们显示某些内容。这可以让你在编写代码时拥有更多的自由度，你甚至可以在此基础上添加更多层次。如果你想将其分成四个或五个年龄组，并且每个组都获得相应的响应，你只需要添加更多的\
  \ `if` 语句来实现。这可以让你在编写代码时拥有更多的自由度，你甚至可以在此基础上添加更多层次。如果你想将其分成四个或五个年龄组，并且每个组都获得相应的响应，你只需要添加更多的\
  \ `if` 语句来实现。我们可以进一步探讨一下，看看情况是如何运行的。假设我们想使用 `if else` 语句来询问用户喜欢的颜色。你会根据喜欢的颜色继续使用\
  \ `if` 语句。你无法列出所有的颜色，因为那会花费很长时间且难以处理，但你可以选择五种颜色并赋予它们 `if` 语句。然后，如果用户没有选择这五种颜色中的一种，也会被\
  \ `else` 语句捕获。这确保了所有答案都能捕获并响应，而无需列出所有的可能性。\n\n### 使用 elif 语句结束\n\n现在我们已经花了一些时间探索了\
  \ `if` 语句和 `if else` 语句，是时候看看 `elif` 语句有何相同或不同之处，以及你如何在代码中使用它了。你会发现，这些语句为你编写的代码添加了不同层级，但它们仍然易于使用。\n\
  \n你可以在代码中编写任意数量的 `elif` 语句，然后你还需要添加 `else` 语句（正如我们在上面使用 `if else` 语句时所样），以处理任何需要处理的其他决策。你可以将\
  \ `elif` 语句想象成某些老游戏，那些带有选项菜单并允许用户从中选择的游戏。这与我们如何设置 `elif` 语句的方法非常相似。\n\n当你处理这些 `elif`\
  \ 语句时，你可以根据需要添加任意数量的不同选项来完成。有时，你可能只添加一个、两个或三个，但你并不受此限制，可以根据需要添加任意数量。但请记住，在代码中添加的\
  \ `elif` 语句越多，代码就越杂乱，你需要编写的内容也越多。为了查看 `elif` 语句将如何工作，请务必查看以下代码：\n\n```python\nprint(“让我们享受比萨吧！好的，让我们进入比萨饼店！”\n\
  \nprint(“服务员，请从菜单中选择你喜欢的比萨”)\n\npizzachoice = int(input(“请输入你选择的比萨编号:”))\n\nif pizzachoice\
  \ == 1:\n```\n\n\n\n\n```python\nprint('I want to enjoy a pizza napoletana')\n\n\
  elif pizzachoice == 2:\n    print('I want to enjoy a pizza rustica')\n\nelif pizzachoice\
  \ == 3:\n    print('I want to enjoy a pizza capricciosa')\n\nelse:\n    print(\"\
  Sorry, I do not want any of the listed pizza’s, please bring a Coca Cola for me.\"\
  )\n```\n\n通过这种选项，用户可以选择他们想要享用的披萨类型，但你也可以在代码中需要的任何地方使用相同的语法。如果用户在代码中输入数字 `2`，他们将得到一个意式乡村披萨（pizza\
  \ Rustica）。如果他们不喜欢任何一个选项，他们就会告诉程序他们只想喝点东西，在这种情况下，是一瓶可口可乐。\n\n这是一个使用 `elif` 语句为用户提供一组选择的简单方法。在其他选项中，用户可以添加他们想要的任何选择，但在\
  \ `elif` 语句中，他们要么选择你提供的选项之一，要么必须接受最后的默认选项。这对于你可能想要制作的许多游戏、某些在线测试，以及其他你想要限制用户在代码中选择范围范围的程序都非常有效。\n\
  \n正如你所看到的，在处理这些条件语句时，你可以做很多不同的事情。你可以选择想要设置的条件，然后确保程序在整个过程中始终以正确的方式运行。你可以选择 `if`\
  \ 语句、`if else` 语句或 `elif` 语句哪个适合你，然后将这些添加到你正在编写的代码中。\n\n# 第 10 章：Python 语言中的异常处理\n\
  \n本指南中，我们需要花时间探索的下一个主题是异常处理的概念。在某些时候，你的代码可能会在你正在执行的代码中显示出错误或其他问题，这就是异常发生的地方。了解何时识别这些异常、如何处理它们，甚至如何创建一些你自己的异常，对于你编写\
  \ Python 代码的优劣将产生巨大影响。\n\n这些异常会在很多情况下由编译器抛出，有时，它们看起来就像你以前在自己的电脑上可能过的简单错误信息。仔细阅读代码中出现的任何此类异常是非常关重要的，通过阅读它们，你就可以了解它们是关于什么的，同时学习如何妥善地处理它们。这并不是为了吓唬你，但你可以采取一些措施来处理这些异常，并确保你能够正确的方式处理它们。\n\
  \n现在，在你使用的 Python 库中已经有几个被识别的异常。如果你想在代码中编写它们，或者如果你发现用户正在尝试进行一些不符合你程序的操作，那么编译器将发送关于此的异常以使其停止。在某些情况下，你编写的程序可能需要额外的限制来处理，你可以在创建后抛出自己的异常。\n\
  \n编译器会自动抛出异常的一个很好的例子是你或用户尝试将除以零。编译器随后会识别出这是用户无法执行的操作，并发送该异常作为警报。如果你作为程序员尝试调用一个函数，但名称拼写不正确，导致没有匹配项可以调出，也会发生这种情况。\n\
  \n在你的 Python 库中可以自动找到几种不同的异常。花时间查看它们并识别这些异常是一个好主意，这样你以后就能识别出它们。你需要关注的一些最常见的异常包括：\n\
  \n-   **Finally**——这是你希望用于执行清理操作的动作，无论是否发生异常。\n-   **Assert**——此条件将触发代码内部的异常。\n\
  -   **Raise**——`raise` 命令将在代码内部手动触发异常。 \n-   **Try/except**——当你尝试运行一段代码，并且由于你或 Python\
  \ 代码抛出的异常而得以恢复时使用。\n\n## 抛出异常\n\n在我们对这些异常及其含义有了更多了解后，现在首先需要查看的是如何编写它们，以及如果其中一个异常出现在你自己的代码中，你可以使用的一些步骤。如果你在编写代码的过程中，开始注意到将抛出异常，要知道解决方案通常是简单的。但作为程序员，你需要花时间来修复它。为了帮助我们开始，让我们来看看抛出异常的代码语法是关于什么的。\n\
  \n```python\nx = 10\ny = 10\nresult = x/y #尝试除以零\nprint(result)\n```\n\n当你尝试让解释器通过这段代码时，你得到的输出是：\n\
  \n```\n>>>\nTraceback (most recent call last):\nFile “D: \\Python34\\t.py”, line\
  \ 3, in <module>\nresult = x/y\nZeroDivisionError: division by zero\n>>>\n```\n\n\
  当我们观察我们所看到的示例时，可以看到程序会向我们抛出一个异常，主要是因为我们尝试将数字除以零，这是不被允许的。如果你决定在此处不进行任何更改并直接运行程序，你可能会得到一个让用户困惑的信息。\n\
  \n通过我们上面处理的示例，你有一些选择。你可以选择留下那个对你来说很困惑的信息，也可以添加一个更容易阅读的新消息。它不会有许多只有写过代码的人才能理解的数字和字母，这使得整个过程更加用户友好。你用于控制用户看到的信息的语法包括：\n\
  \n```python\nx = 10\ny = 0\nresult = 0\n\ntry:\n    result = x/y\n    print(result)\n\
  except ZeroDivisionError:\n    print(\"你正在尝试除以零。\")\n```\n\n观察上面的两个代码。我们刚刚做的和上面的看起来非常相似，但这个包含了一个消息。这个消息会在用户触发这个特定异常时显示。你将不会得到那些没有意义的字母数字字符串，通过这个，用户将确切知道发生了什么。\n\
  \n## 我可以定义自己的异常吗？\n\n在上面的示例中，我们花时间定义并处理了编译器提供的、已经在 Python 库中存在的异常。现在是时候更进一步，学习如何在我们编写的任何代码中抛出一些我们自己的异常了。也许你正在编写一个只允许用户进行少数选择的代码，一个只允许他们选择某些数字的代码，或者一个只允许他们有一定尝试机会的代码。这些是我们在处理游戏程序时常见的现象，但在你设计的其他程序中也同样有效。\n\
  \n\n\n\n当你创建此类异常处理时，必须告诉编译器正在抛出异常，因为编译器无法看到代码的这部分有任何错误。程序员必须介入并让编译器知道需要遵循哪些规则，以及在处理过程中需要抛出哪些异常。下面是一个你可以用于在自己的代码中实现这一点的良好语法示例：\n\
  \n```\nclass CustomException(Exception):\n    def __init__(self, value):\n     \
  \   self.parameter = value\n\n    def __str__(self):\n        return repr(self.parameter)\n\
  \ntry:\n    raise CustomException(\"This is a CustomError!\")\nexcept CustomException\
  \ as ex:\n    print(\"Caught:\", ex.parameter)\n```\n\n在这段代码中，你已经成功设置了自定义的异常，每当用户抛出这些异常之一时，屏幕上就会显示“Caught:\
  \ This is a CustomError!”的消息。这是向用户展示你已经在程序中添加了自定义异常的最佳方法，特别是当该异常是你专门为这部分代码创建的，而不是编译器能够自动识别的异常时。\n\
  \n就像我们之前学过的其他示例一样，我们使用了一些通用的表述仅仅是为了展示异常是如何工作的。你可以轻松地检查并进行修改，以便为你编写的代码获得一个独特的消息，并在用户看到错误消息出现时向他们解释发生了什么。\n\
  \n学习如何处理代码中可能出现的某些异常，是确保你的代码按照你想要的方式运行、用户会喜欢运行你的程序以及一切都能正常进行并达到你预期的最佳方法之一。花时间练习这些示例，看看它们如何帮助你处理代码中出现的任何异常。\n\
  \n# 第 11 章：函数、类和方法\n\n这种方法论允许我们创建包含数据的对象，以及描述该数据或对其执行操作的各种属性和方法。因此，可以说 Python 对象无非数据类型和某些描述它们或赋予它们额外参数的集合。\n\
  \n在本章中，你将接触面向对象编程的概念。你将学习该方法论背后的基础，并学习如何定义类和方法。\n\n## OOP 简介\n\n对象被构建在类中，然后我们应用许多会影响属于该类的东西的方法。理论听起来可能有点困惑，因为我们开始探索稍微高级的编程概念，但可以这样想：\n\
  \n想象你有一辆特定的汽车并将其定义为一个类。汽车就像类一样，有许多描述的属性和行为。对于你的车来说，这些属性将是品牌、型号、燃料类型、颜色、座椅数量、年份等。行为是由属于该类的方法描述的。由于这是一辆汽车，你可能至少有一个启动（start）、加速（accelerate）和停止（stop）方法。现在汽车类定义好了，我们可以构建许多具有所有共同属性和方法的对象。假设你有一辆奔驰作为你的第一个对象，它的属性将描述它使用柴油运行以及它是在\
  \ 2017 年制造的的事实。由于奔驰是一辆汽车，它将与汽车类共享相同的方法。它可以启动、加速和停止。接下来，你可以创建另一个共享相同信息的汽车对象。如你所见，面向对象编程使得用更少的代码创建变得变得容易。你不需要反复定义一切。你只需要类的蓝图，然后创建与父类共享各种特征的派生对象。\n\
  \n现在，在付诸实践之前，让我们回到更多的理论。请记住，面向对象编程是你最终必须掌握的，因为没有它，你就无法创建强大且高效的应用程序。尽管如此，OOP 背后有四个主要原则：\n\
  \n1. **封装 (Encapsulation)**：这一概念指的是将对象锁定在一个私有类中。类是私有的意味着其他对象将不再能够访问特定类内部的对象。封装主要用于安全目的，以便在处理其他公共对象时，你不会故意或意外地更改敏感对象。\n\
  2. **抽象 (Abstraction)**：维护复杂的程序始终需要程序员甚至几名程序员的巨大投入。然而，通过遵循抽象规则，我们可以让一切变得更简单。关于对象的信息通常是被密封的，因为它们被认为是不必要的。你不需要为了执行操作而了解所有的细节。这意味着为了代码维护的目的，你只想访问与对象（或如果相关则与多个对象）相关的部分。例如，抽象让你只能访问如何驾驶你的汽车。你不需要了解引擎和其他机械组件处理的所有内部机制。\n\
  3. **继承 (Inheritance)**：这是最强大的概念之一，这也是为什么面向对象编程成为软件开发标准的原因。假设你创建了大量对象。其中某些对象注定共享一些共同属性和方法，即使它们并不完全相同。与其反复编写相同的方法，你可以从其中一个对象中提取它们并应用到另一个对象上。此外，你可以使用其他类来创建新类。例如，你可以有一个父类，许多子类派自它并共享各种特征。所有这些可以形成一个层次结构，其中子类将使用父类提供的基础逻辑，加上你为子类创建任何新功能。这样你就可以复用代码而不是多次编写。\n\
  4. **多态 (Polymorphism)**：多次输入相同的代码不是好主意。你会浪费时间和资源。这正是多态的作用。你可以创建一个以多种形式存在的对象。然后你可以让\
  \ Python 根据多个参数决定执行哪一个版本。这个概念允许你编写简洁、干净且高效的代码。\n\n面向对象编程是标准开发周期的核心。你可能是一个初学者，目前还没有从这种方法中受益，但你需要探索并学习它以精通\
  \ Python 编程\n\n## 函数\n\n在学习定义基本类和方法之前，你应该学习如何使用函数。函数并不一定属于面向对象编程范式，但它们确实解决了许多初学者的问题和错误，你应该在构建类之前学习如何使用它们。\n\
  \n在同一个程序或脚本多次编写相同的代码块没有真正的规定。它运行得完全正常。但是，你会有更多的代码需要处理，而且你的程序可能需要更多的时间和资源来处理一切。因此，通常认为如果你需要编写相同的代码超过两次，你就应该回去将一切转换为函数。\n\
  \n函数允许你只需编写一次所需的任何语句和指令。然后你给该代码块起一个名字并将其转换为函数。每当你再次需要使用该代码时，只需通过函数名调用函数，而不是再次编写所有语句。以下是编写基础函数的方法：\n\
  \n```\ndef myfunction():\n    print(\"This is my function!\")\n```\n\n\n\n\n函数通过使用\
  \ `def` 关键字定义，其后是函数名和两个括号，括号内可以包含数量数量参数。一旦定义了函数，你就可以这样调用它：\n\n```\nmyFunction()\n\
  ```\n\n你可以根据需要频繁调用它。现在，我们提到了参数。在函数的括号内，你可以建立一些信息。参数简单来说就是成为函数定义一部分的变量。这是一个示例：\n\n\
  ```python\ndef myName(firstname):\n    print(firstname + “ Smith”)\n\nmyName(“John”)\n\
  myName(“James”)\nmyName(“Jonah”)\n```\n\n如你所见，我们向函数传递了一个参数。当我们进行函数调用时，它会将参数与任何其他内容一起打印出来。记住，函数可以有一个参数、多个参数或没有参数。如果你定义了多个参数，只需用逗号将它们分隔开。接下来，让我们为函数创建一个带有默认参数的设置，如果我们不使用任何其他参数，它始终会被调用。在代码中看起来是这样的：\n\
  \n```python\ndef myFunction(country = “Germany”):\n    print (“I am from “ + country)\n\
  \nmyFunction(“China”)\nmyFunction(“France”)\nmyFunction()\nmyFunction(“Italy”)\n\
  ```\n\n结果应该看起来像这样：\n\n```\nI am from China\nI am from France\nI am from Germany\n\
  I am from Italy\n```\n\n注意，我们第三次单独调用函数时，没有提到任何参数。在这种情况下，使用了我们在最初定义的默认参数。\n\n你到目前为止创建的函数并没有为我们在程序中创建任何可以使用的值。它们所做的只是我们指令它们执行的事情。你很少、甚至不会使用此类函数。你需要值来将它们赋值给变量，然后使用该变量进行其他操作。让我们使用\
  \ `return` 关键字定义一个函数并返回一个值：\n\n```python\ndef myFunction(x):\n    return 10 * x\n\
  \nprint(myFunction(2))\nprint(myFunction(5))\n```\n\n现在你已经掌握了基础知识，可以使用函数来简化你的代码并编写更少令人困惑的代码。接下来，你将学习如何使用类和方法来进一步完善你的代码。\n\
  \n### 如何定义类\n\n类是面向对象编程的核心。让我们看看语法，然后进行讨论：\n\n```python\nclass Person:\n    def\
  \ _init_(self, name, tel):\n        self.name = name\n        self.tel = tel\n```\n\
  \n在这个示例中，我们只是定义了一个内部不包含任何对象的类。然而，请注意，我们在类的定义期间使用了一个构造器方法。该方法通过在定义中添加 `_init_` 属性来使用。它的目的是在我们创建类的不同实例时使用。\n\
  \n在下一行中，我们有另一个 Python 特有的重要关键字。当我们在类内部创建一个方法时，都需要 `self` 关键字。如果你熟悉其他编程语言，你会发现这个概念与使用关键字\
  \ `this` 相似。在我们的示例中，该关键字的目的是声明一个可以被属于同一类的任何对象使用的变量。现在，让我们为我们的类创建一个实例：\n\n```python\n\
  p = Person (“Smith”, “123321”)\np.name\n```\n\n现在我们有一个名为 Smith 的新对象，它属于 person 类。就是这样。尽管这是一个基础示例，但你现在可以创建简单的类和类的变体，然后在整个代码中根据需要调用它们。它们在某种意义上与函数相似。一旦你声明了关于类的所有细节，你只需要在想要对它执行操作时，在代码的后部分调用它即可。\n\
  \n### 如何定义方法\n\n方法本质上是附加到类或属于类的对象的函数。只有当我们调用它时它才能应用于它们，而且它与类之外的任何其他数据都是隔离的。例如，你可以拥有相同名称的方法，但如果它们附加到相互隔离的不同类，那么它们之间就不会有冲突。\n\
  \n这是一个简单的示例：\n\n```python\nclass Pet (object):\n    def my_method(self):\n     \
  \   print (“This is a dog”)\n\ndog = Pet()\ndog.my_method()\n```\n\n我们在这里有一个包含一个狗对象的\
  \ pet 类。你会注意到，我们在最后一行中通过指定它对对象的附加来调用该方法。\n\n# 第 12 章：使用线性回归进行预测\n\n线性回归必须是最常见的统计技术之一，它是对变量之间加法和线性关系的研究。许多不同的行业都使用线性回归来创建模型以帮助他们的业务。以零售业为例。有多个影响产品销售的因素，例如价格、季节、促销等。\n\
  \n使用线性回归可以帮助业务理解这些因素如何影响销售，并计算基准销售额——即在没有外部因素的情况下会有多少产品销售。在本章中，你将创建一个简单的线性回归模型和一个多元回归模型。\n\
  \n## 简单线性回归\n\n简单线性回归只有一个变量，我们可以通过以下公式描述它：\n\n`y = A + Bx`\n\n独立变量是 `x`，因变量是 `y`，截距是\
  \ `A`（x 的 0 次方），系数是 `B`。使用的数据集将包含有关样本男性的公斤（KG）体重和厘米（cm）高度的信息：\n\n```python\nimport\
  \ numpy as np\nimport pandas as pd\nfrom scipy import stats\nimport matplotlib.pyplot\
  \ as plt\n\n# 假设 sl_data 已加载\nsl_data = pd.read_csv('Mens_height_weight.csv')\n\
  fig, ax = plt.subplots(1, 1)\nax.scatter(sl_data['Height'],sl_data['Weight'])\n\
  ax.set_xlabel('Height')\nax.set_ylabel('Weight')\nplt.show()\n```\n\n从结果图中，你可以看到高度和重量之间的线性关系是显而易见的。\n\
  \n我们可以这样查看变量之间的相关性：\n\n```python\nsl_data.corr()\n```\n\n由此产生的相关矩阵如下：\n\n```\n \
  \     HeightWeight\nHeight1.0000000.942603\nWeight0.9426031.000000\n```\n\n从这里我们可以看到高度和重量之间的相关性基于\
  \ 0.94 的系数，皮尔逊相关系数范围为 -1 到 +1；数值越正，变量共同增加的关系越强。如果是负值，关系仍然很强但方向相反。\n\n使用重量作为因变量并将\
  \ `x` 作为独立变量，我们可以生成一个线性回归模型：\n\n```python\nfrom sklearn import linear_model\n# 创建线性回归对象\n\
  lm = linear_model.LinearRegression()\n# 使用训练集训练模型\nlm.fit(sl_data.Height[:,np.newaxis],\
  \ sl_data.Weight)\nprint('Intercept is ' + str(lm.intercept_) + '\\n')\nprint('Coefficient\
  \ value of height is ' + str(lm.coef_) + '\\n')\nprint pd.DataFrame(zip(sl_data.columns,lm.coef_),\
  \ columns=['features', 'estimatedCoefficients']))\n```\n\n结果应该是：\n-99.2772096063\n\
  1.00092142\n\n\n\n多元线性回归是指使用两个或多个独立变量来预测因变量：\n\n`Y'=a+b1x1+b2x2+ ….. +bnxn`\n\n\
  将此公式分解来看，因变量是 `Y`，截距为 `a`，系数为 `b1` 和 `b2`，独立变量为 `x1` 和 `x2`。同时注意，当因变量被平方时，它仍然是线性的；如果系数平方，它就变成了非线性的。\n\
  \n我们将使用 NBA 篮球数据集构建多元线性回归模型，用于预测每场平均得分。列描述如下：\n\n* `height` – 身高（英尺）\n* `weight`\
  \ – 体重（磅）\n* `success_field_goals` – 每 100 次尝试中投篮命中率 ( (%)\n* `success_free_throws`\
  \ – 每 100 次尝试中罚球命中率 (%)\n* `avg_points_scored` – 每场平均得分\n\n以下代码读取这些数据，并使用 `DataFrame`\
  \ 的 `describe()` 方法来获取每个字段的单变量指标：\n\n```python\n>>> b_data = pd.read_csv('Data/basketball.csv')\n\
  >>> b_data.describe()\n```\n\n输出结果如下：\n\n```\nheightweight             success_field_goals\
  \   success_free_throws       avg_points_scored\ncount54.00000054.000000      54.000000\
  \      54.000000               54.000000\nmean6.587037209.907407      0.449111 \
  \              0.741852               11.790741\nstd0.45889430.265036      0.056551\
  \      0.100146               5.899257\nmin5.700000105.000000      0.291000    \
  \  0.244000               2.800000\n25%6.225000185.000000      0.415250      0.713000\
  \               8.150000\n50%6.650000212.500000      0.443500      0.753500    \
  \           10.750000\n75%6.900000235.000000      0.483500      0.795250       \
  \        13.600000\nmax7.600000263.000000      0.599000      0.900000          \
  \     27.400000\n```\n\n该表让我们更更好地了解了数据，并能够做出以下观察：\n\n* 平均而言，篮球运动员的身高约为 6 英尺 5 寸\n\
  * 最矮的球员身高 5 英尺 7 寸\n* 最高的球员身高 7 英尺 7 寸\n* 最轻的球员体重为 105 磅\n* 最重的球员体重为 263 磅\n* 最佳个人投篮命中率为\
  \ 60%\n* 最差的个人投篮命中率为 29%\n* 平均投篮命中率为 45%，但标准差较小，这说明大多数球员的命中率在 40% 到 50% 之间\n* 在罚球方面，一名球员的罚率为\
  \ 0.75%\n* 罚球最好的球员命中率为 90%\n* 大多数球员的罚球命中率在 70% 到 80% 之间\n* 球员单场最高得 27 分\n* 最低得 3\
  \ 分\n* 每个球员平均得 12 分\n\n查看变量相关性：\n\n```python\n>>> b_data.corr()\n              \
  \ heightweight  success_field_goals  success_free_throws  avg_points_scored\nheight\
  \         1.000000  0.834324              0.495546             -0.259271       \
  \    -0.068906\nweight         0.834324  1.000000              0.516021        \
  \     -0.290159            0.009844\nsuccess_field_goals 0.495546  0.516021    \
  \          1.000000              0.018570            0.338760\nsuccess_free_throws\
  \ -0.259271 -0.290159             0.018570              1.000000           0.244852\n\
  avg_points_scored  -0.068906 0.009844              0.338760             0.244852\
  \            1.000000\n```\n\n从该表中我们可以推断出：\n\n* 身高和体重之间存在高度相关\n* 投篮命中率在体重和身高方面表现出弱的正相关\n\
  \n\n\n\n```python\nmyString = \"This &is [a] string? {with} many. punctuation.?\
  \ marks!!!!\"\n\noutput = myString.translate(string.maketrans(\"\",\"\"), string.punctuation)\n\
  \nprint(output)\n```\n\n该代码将移除字符串中所有的标点符号。\n\n## 去除空格\n\n你可能希望处理没有开头和结尾空格的文本。你可以通过\
  \ `strip()` 方法从文本中消除这些空格。以下是一个示例：\n\n```python\nmyString = \" \\t a sample string\\\
  t \"\n\nstr = myString.strip()\n\nprint(str)\n```\n\n我们定义了一个字符串并将其赋值给变量 `myString`。这个字符串包含由\
  \ `\\t` 选项（制表符）产生的一些空白字符。然后，我们在字符串上调用了 `strip()` 函数，并将输出赋值给变量 `str`。最后，我们在控制台上打印了该变量的值。代码给出了以下结果：\n\
  \n## 词性标注 (POS)\n\n`POS` 的目标是为提供文本中的每个单词分配不同的词性，如名词、形容词、动词等。这通常是基于定义和上下文完成的。\n\n\
  有许多工具可以为我们提供 `POS` 标注器，包括 `NLTK`、`TextBlob` 等。在这种情况下，我们将使用 `TextBlob` 来演示。要安装此库，请在操作系统的终端上运行以下命令：\n\
  \n```bash\npip3 install textblob\n```\n\n这应该会安装库。由于你已经安装了 `NLTK`，它的运行速度会很快。之后，运行以下代码演示如何进行词性标注：\n\
  \n```python\nfrom textblob import TextBlob\nimport nltk\n\nnltk.download('averaged_perceptron_tagger')\n\
  \nmyString = \"Parts of speech: an article, to run, fascinating, quickly, and, of\"\
  \n\noutput = TextBlob(myString)\n\nprint(output.tags)\n```\n\n代码将返回以下输出：\n\n正如你所注意到的，文本中的每个单词都被分配了正确的标签。这是因为我们调用了\
  \ `TextBlob()` 函数并将我们的字符串名称传递给它。随后，输出被打印在控制台上。\n\n## 命名实体识别\n\n`NLP` 中命名实体识别的目的是识别一组文本中的命名实体，并将它们分配到预定义的类别中，如地点、组织、个人姓名等。\n\
  \n让我们演示如何使用 `nltk` 包来实现这一功能：\n\n```python\nimport nltk\nfrom nltk import word_tokenize,\
  \ pos_tag, ne_chunk\n\nnltk.download('maxent_ne_chunker')\nnltk.download('words')\n\
  \nmyString = \"He worked for Microsoft and attended a conference in Italy\"\n\n\
  print(ne_chunk(pos_tag(word_tokenize(myString))))\n```\n\n代码在执行后将给出下面的结果：\n\n我们首先导入了\
  \ `nltk` 库以及该库中的多个函数。命名实体识别所需的必要包（在这种情况下）已经下载完成。我们创建了一个名为 `myString` 的变量并给它赋值了一个字符串。随后，在字符串上调用了这些函数。代码在执行后将返回下面的结果：\n\
  \n## 词语提取\n\n词语是指共同出现频率远高于偶然发生概率的词汇。词语的示例包括“free time”、“break the rules”、“by the\
  \ way”、“keep in mind”、“get ready”等。以下代码演示了如何使用 `ICE` 识别这些词语。\n\n要安装此模块，请运行以下命令：\n\
  \n```bash\npip3 install ICE\n```\n\n该命令应该能成功安装该包。现在运行以下命令：\n\n```python\nimport\
  \ ICE\nimport CollocationExtractor\n\ninput=[\"she and Charlse duel with all keys\
  \ on the line.\"]\n\nextractor = CollocationExtractor.with_collocation_pipeline(\"\
  T1\" , bing_key = \"Temp\",pos_check = False)\n\nprint(extractor.get_collocations_of_length(input,\
  \ length = 3))\n```\n\n## 寻找同义词\n\n我们将使用 `wordnet`，它是一个 `NLTK` 语料库读取，英语词汇数据库。我们可以用它来确定单词的含义、反义词或同义词。它可以被定义为一个面向语义的英语字典。\n\
  \n为了从 `nltk` 语料库将其导入我们的工作空间，运行以下命令：\n\n```python\nfrom nltk.corpus import wordnet\
  \ \n```\n\n`Synset` 是 `wordnet` 提供的之一。它仅仅是同义词集合。考虑下面的示例：\n\n```python\nfrom nltk.corpus\
  \ import wordnet\n\nsyn = wordnet.synsets(\"cat\")\n\nprint(syn)\n```\n\n代码在执行后给出以下结果：\n\
  \n在上面的示例中，我们调用了 `synsets()` 函数来获取单词 `cat` 的同义词。我们将输出赋值给名为 `syn` 的变量。随后，我们在控制台上打印了该变量的值。\n\
  \n`Wordnet` 还有一个被称为词汇关系的功能，它是一组互惠的语义关系。让我们创建一个程序，来帮助我们寻找某个单词的同义词和反义词：\n\n```python\n\
  from nltk.corpus import wordnet\n\nsynonyms = []\nantonyms = []\n\nfor s in wordnet.synsets(\"\
  passive\"):\n    for lemm in s.lemmas():\n        synonyms.append(lemm.name())\n\
  \        if lemm.antonyms():\n            antonyms.append(lemm.antonyms()[0].name())\n\
  \            print(set(synonyms))\n```\n\n\n\n\n\n`final_word = spelling(word_wlf)`\
  \ \n\n`print(final_word)`\n\n我们首先删除了重复的字符。这是通过定义一个名为 `remove_lengthening` 的函数实现的。在这个方法中，我们定义了单词的字符长度不能超过\
  \ 2。当我们将单词 `acccctiiiive` 传递给函数时，它返回了 `acctiive`。然而，这个单词仍然不正确。我们需要对单词进行拼写检查。这就是为什么我们调用了从\
  \ `pattern.en` 导入的 `spelling()` 函数，并将去重长处理后的结果传递给它。这将返回单词的正确拼写，即 `active`。\n\n#\
  \ 第 14 章：使用 Jupyter notebook 进行用户交互\n\n## 在 IPython notebook 中显示表格化数据\n\n在 IPython\
