  \        dish_content[0][column]=round(column_sum,2)\n        plt.pie(dish_content[0][1:4],\
  \ autopct='%1.1f%%', labels=('carbs','fat','protein'), colors=('palegreen','gold','salmon'))\n\
  \    plt.show()\n    return make_table(header[:-1],dish_content)\n\ninteract(show_results)\n\
  ```\n\n如果你觉得计算非常耗时，可能可以考虑另一个函数 `interact_manual`。它在界面上添加了一个按钮，其目标函数只有在按下按钮时才会被调用。因此，你可以在不需要等待必要的计算的情况下调整多个控件。\n\
  \n`Interact` 还提供了其他类型的控件：复选框、文本输入框、下拉列表。控件类型是根据目标函数的默认参数推断的。以下代码段将创建一个由复选框、文本输入框、下拉列表和一个“运行”按钮组成的界面，你需要按下该按钮来调用目标函数，并打印它接收到的参数。\n\
  \n```python\nfrom ipywidgets import interact_manual\ndef target(a=True, b='abc',\
  \ c=['one', 'two', 'three'], d={'apple':1, 'pear':2, 'orange':3}):\n    print(a,b,c,d)\n\
  \    return\ni=interact_manual(target)\n```\n\n另一种，交互函数可以用于创建一个作为多个控件父对象的控件。这些控件可以通过显式调用来构造。此外，控件的状态可以在程序内部进行更改。更多信息请参考\
  \ IPython 文档。\n\n# 第 15 章：正则表达式\n\n我们需要在这里稍微绕一下，深入探讨一下在使用正则表达式时我们能够做什么。在 Python\
  \ 语言中，你会喜欢的这一点之一是，你可以使用一种被称为正则表达式的工具，它能够处理你想要的任何类型的任务。\n\n你也将发现，这些正则表达式在 Python\
  \ 中非常好用，因为它们可以帮助我们处理各种文本，包括你可能喜欢的字符串，并且可以使用这些正则表达式来检查代码中的字符串或文本是否符合预期方式。\n\n这些正则表达式实际上非常好用，而且当你想要使用它们时，你可能需要使用相同的表达式，即使你正在与其他编程语言一起进行工作。假设你正在进行某项工作，不仅使用\
  \ Python，还使用 C++ 或 Java 等语言。你仍然可以使用正则表达式，并保持你熟悉的语法。\n\n\n\n\n每当你想要使用这些正则表达式时，重要的一点是先进入\
  \ Python 的标准库，然后导入它们那里已有的正则表达式。在开始进一步深入学习之前，现在就得这样做，否则以后再做这项工作可能会面临挑战。想一下在任何项目开始时你需要的各种不同的库和扩展，然后将它们一并添加进来。\n\
  \n当你尝试编写自己的代码时，你将可以使用几种不同类型的正则表达式。通常，这些表达式会与语句一起出现，你必须能够处理好它们，以便让表达式按照你想要的方式运行。不过，为了确保它们正常工作，我们需要花些时间了解一下将会出现的背景和基础知识。那么，让我们开始学习更多关于这些正则表达式是如何工作的吧。\n\
  \n## 基础模式\n\n程序员在开始接触表达式时会发现现象之一是，这些表达式不仅指定了你想在代码中使用的固定字符。事实上，在某些情况下，可以将它们提取出来，并用它们来查找代码中出现的所有模式。你的语句中以及\
  \ Python 代码其他部分需要出现的一些不同模式包括：\n\n1. **普通字符**。这些是与自身精确匹配的字符。使用其中一些字符时要小心，因为它们在 Python\
  \ 内部具有特殊含义。你需要留意的字符包括 `[]`、`*`、`^`、$`\n2. **句号**——它将匹配除换行符 `\\n` 之外的任何单个字符。\n3.\
  \ `\\w`——这是小写的 w，用于匹配“单词”字符。它可以是字母、数字或下划线。请记住，这是一个助记符，它匹配的是单个单词字符，而不是整个单词。\n4. `\\\
  b`——这是非单词与单词之间的边界。\n5. `\\s`——这将匹配单个空白字符，包括换格符、制表符、回车、换行，甚至是空格。如果你使用 `\\S`，你指的是任何非空白字符的字符。\n\
  6. `^` = 开始，`$` = 结束——这些将匹配字符串的开头或结尾。\n7. `\\t`、`\\n`、`\\r`——这些代表制表符、换行符和回车。\n8.\
  \ `\\d`——这是 0 到 9 之间所有数字的进制。一些旧的正则表达式工具不支持此项，因此在使用它时要小心。\n9. `\\` --这会抑制字符的特殊性。如果你不确定某个字符是否具有特殊含义，你可以使用它来确保该字符像普通字符一样被处理。\n\
  \n你可以使用这些正则表达式的方法之一是帮助你完成所需的查询。虽然还有其他任务，但我们将重点放在使用查询来完成任务这一想法上。我们将关注的使用正则表达式进行查询的三种方法是\
  \ `re.findall()`、`re.search()` 和 `re.match()` 函数。让我们来看看这些函数能做什么，以及我们何时可以在代码中使用它们。\n\
  \n列表上的第一个是**搜索（search）方法**。要使用它，语法将包含 `search()` 函数。这种方法允许你匹配字符串中任何位置出现的内容。在我们处理这一项时，你不需要担心会有某些限制条件，这使得它变得更简单。\n\
  \n通过 `search` 方法，你获得了检查字符串中是否找到了某种匹配的能力。有时，根据你提出的查询和代码中的内容，会有匹配项，而有时则没有。如果字符串中没有匹配项，你将无法得到任何结果。但如果你执行了查询且程序在字符串内找到了匹配项（无论它在什么位置），都会返回结果。对于这种方法，它只会返回一次信息。即使该项目列出了十次，它也只会向你显示它存在，以及出现了几次。你可以配合此方法的代码语法包括：\n\
  \n```python\nimport re\n\nstring = ‘apple, orange, mango, orange’\n\nmatch = re.search(r’orange’,\
  \ string)\n\nprint(match.group(0))\n```\n\n你可以此的第二件事是**匹配（match）方法**。你可以在之前类似的类型代码中使用此选项，但它会遍历并检查序列中的第一个单词是否与你的搜索内容匹配。如果术语是序列中的第一个单词，它就会显示出来。如果不是，你就无法获取所需的术语。\n\
  \n在上面的示例中，我们正在寻找 orange 并看看是否能找到与之匹配的项。但由于 orange 没有被列为序列中的第一个单词，即使 orange 单词存在，我们也无法获得匹配项。要让这个方法生效，我们需要它恰好匹配在第一个项上。\n\
  \n我们这里可以处理的第三件事是**查找所有（findall）方法**。如果你想执行某些工作并确定一个单词出现的次数，那么这就是你需要使用的方法类型。\n\n\
  所以，为了保持这种方法的简单并确保其正确运行，你只需要使用上面提到的语法，并将 `re.search()` 部分替换为 `re.findall()`。然后你将得到一个新的结果。对于这一项，由于我们正在查看\
  \ orange，我们最终将得到“orange, orange”的结果。这是因为该方法将告诉我们是否存在模式。如果你在上面的代码中将该单词放入五次，那么 findall\
  \ 方法将列出该单词五次。\n\n正如你看到的，这三种正则表达式将以不同的方式工作，帮助你处理你想要的代码。每种方法都将帮助你找到所需的信息，检查信息中是否存在模式，并可以提供很多帮助。花时间练习这些方法，看看它们如何帮助你完成更多工作。\n\
  \n\n\n\n\n在 `matplotlib` 中绘制数据图基本上有两种方法：分别是函数式（Functional）方法和面向对象（OO）方法。当你与程序员或其他编程语言进行交互时，你可能会反复遇到这两个术语，但它们只是两种略有不同的编程方法。在这里，我们只考虑函数式方法，因为它对初学者来说易于理解，而且需要的代码行更少。然而，面向对象的方法提供了对图表更多的控制力，代价是需要编写更多的代码。\n\
  \n首先，让我们使用函数式方法创建一个简单的余弦图。\n\n首先，让我们导入相关的库并创建绘图数据：\n\nIn []:\n```python\nimport\
  \ matplotlib.pyplot as plt\nimport numpy as np\n%matplotlib inline\n\n# 创建绘图值\n\
  x = np.linspace(0,10) # x 轴/时间刻度\ny = np.cos(x) # 对应的余弦值\n```\n\n代码中的 `%matplotlib\
  \ inline` 确保了我们在运行每个单元格时，所有的图表都会显示。如果你运行在不同的 Python 控制台中，可以在代码末尾加上 `plt.show()`\
  \ 来显示你的图表。`plt.show()` 相当于于用于 matplotlib 图表的 `print()` 函数。\n\n## 函数方法\n\n# 函数式绘图\n\
  \nIn []:\n```python\nplt.plot(x,y)\n```\nOut[]: `<matplotlib.lines.Line2D at 0x25108cf27f0>`\n\
  \n注意我们得到了一个 `Out[]` 语句。这是因为我们没有使用 `plt.show()` 打印结果。虽然如果你在使用 Jupyter，这并不重要，但在其他控制台中可能是必须的。\n\
  \n我们还可以在一个图表中绘制多个函数。\n\nIn []:\n```python\nz = np.sin(x) # 添加一个额外的绘图变量\nplt.plot(x,y,x,z);plt.show()\n\
  ```\n\n要打印多个图表，只需将每个参数传递给 plot 语句，并用逗号分隔各个图表。\n\n为了让我们的图表更有意义，我们可以为轴添加标签并给图表添加标题。\n\
  \nIn []:\n```python\nplt.plot(x,y,x,z)\nplt.xlabel('Time axis') # 为 x 轴标记\nplt.ylabel('Magnitude')\
  \ # 为 y 轴标记\nplt.title('Sine and Cosine waves') # 图表标题\nplt.show() # 打印\n```\nOutput:\n\
  \n现在，这是一个更好的图表。由于我们添加了多个图表，有一个名为 `legend`（图例）的额外功能可以区分不同的图表。\n\n`legend` 函数接受两个参数。第一个通常是字符串参数，用于顺序标记图表。第二个是用于额外功能，例如图例应该所在的位置。`location`\
  \ 参数通过 `loc=value` 指定。对于 `value = 1`，表示右上角；`2` 表示左上角；`3` 表示左下角；`4` 表示右下角。然而，如果你愿意让\
  \ matplotlib 决定最佳位置，请使用 `value=0`。\n\nIn []:\n```python\nplt.plot(x,y,x,z)\nplt.xlabel('Time\
  \ axis')\nplt.ylabel('Magnitude')\nplt.title('Sine and Cosine waves')\nplt.legend(['y','z'],loc=0)\
  \ # loc=0 意味着最佳位置\nplt.show()\n```\nOutput:\n\n假设我们希望绘制上述余弦波和正弦波，但是并排显示。\n\n我们可以使用\
  \ `subplot` 命令来实现这一点。将 `subplot` 想象成图形的数组，并指定行数和列数。因此，如果我们只想要两个并排在一起的图表，可以将其看作 1\
  \ 行 2 列的数组。\n\nIn []:# 子图绘制\n\n```python\nplt.subplot(1,2,1) # 图 1\nplt.plot(x,y)\n\
  plt.title('Cosine plot')\nplt.subplot(1,2,2) # 图 2\nplt.plot(x,z)\nplt.title('Sine\
  \ plot')\nplt.tight_layout() # 避免图表重叠\nplt.show()\n```\n提示：`tight_layout()` 行确保了所有子图之间的间距良好。在绘制子图时，始终使用此行以使你的图表更漂亮。尝试删除该行并比较输出结果！\n\
  \nOutput:\n\n解释 subplot 行，即 `subplot(1,2,1)` 和 `subplot(1,2,2)`：前两个值是子图的行数和列数。如上面的结果所示，图表位于一行两列。最后一个值指定了图表的顺序；因此\
  \ `(1,2,1)` 翻译为在两个列中的第一行第一列绘制该图形。\n\n我们可以指定图表中的线条颜色以及线条样式。这些是作为字符串在绘图参数之后传递的。由于所有的绘图选项（包括标记样式等）与\
  \ Matlab 完全相同，这里有一个 Matlab 绘图文档的链接，可以探索所有你可以迁移到 matplotlib 图表中的额外自定义功能：https://www.mathworks.com/help/matlab/ref/plot.html#btzpndl-1\n\
  \n让我们更改子图中的颜色和字体来演示这一点。\n\nIn []:\n```python\nplt.subplot(1,2,1) # 图 1\nplt.plot(x,y,'r-x')\
  \ # 带有 -x 标记的红色线条\nplt.title('Cosine plot')\nplt.subplot(1,2,2) # 图 2\nplt.plot(x,z,'g-o')\
  \ # 带有 -o 标记的绿色线条\nplt.title('Sine plot')\nplt.tight_layout()\nplt.show()\n```\n\
  Output:\n\n练习：现在你已经学习了如何使用函数式方法进行绘图，请测试一下。Seaborn 是另一个数据可视化库，它扩展了 matplotlib 库的图形范围。matplotlib\
  \ 中的许多方法都可以用于自定义图表。然而，它用更少的代码行生成高质量、动态的图表。\n\nSeaborn 对数据集的绘图进行了更多优化，我们将使用这个库探索一个数据集。由于\
  \ Seaborn 预装了几个数据集（它可以从其在线仓库中调用并加载某些数据集），我们只需为示例加载其中一个即可。\n\n示例：加载一个 seaborn 数据集\n\
  \n与其他包一样，我们必须使用标准变量名 `sns` 导入 seaborn。\n\nIn []:# 导入 seaborn\n```python\nimport\
  \ seaborn as sns\n%matplotlib inline\n```\n接下来，我们将从 Seaborn 加载流行的 `tips` 数据集。该数据集包含关于餐厅的信息、给服务员的小费、小费金额、客户群规模（例如\
  \ 3 人的小组）等信息。\n\nIn []:# 从 seaborn 加载数据集\n```python\ntips_dataset = sns.load_dataset('tips')\n\
  tips_dataset.head()\n```\nOut[]:\n\n|  | total_bill | tip | sex | smoker | day |\
  \ time | size |\n| 0 | 16.99 | 1.01 | Female | No | Sun | 2 |\n| 1 | 10.34 | 1.66\
  \ | Male | No | Sun | 3 |\n| 2 | 21.01 | 3.50 | Male | No | Sun | 3 |\n| 3 | 23.68\
  \ | 3.31 | Male | No | Sun | 2 |\n| 4 | 24.59 | 3.61 | Female | No | Sun | 4 |\n\
  \n接下来，我们可以使用不同类型的图表来发现数据中的趋势。让我们使用 `dist_plot`（分布图）来观察 `total_bill` 在数据集中分布情况。\n\
  \nIn []:# 使用 distplot\n```python\nsns.distplot(tips_dataset['total_bill'],bins=30,kde=False)\n\
  ```\nOut[]:<matplotlib.axes._subplots.AxesSubplot at 0x28d3867d6d8>\n\n\n\n\n\n\
  `distplot` 显示了数据中某些趋势的分布。根据上面的图表，我们可以推断大多数账单都在 $10 - $20 之间，因为它们在分布中具有最高的箱状体（bins）。你可能会注意到\
  \ `distplot` 代码中的一些额外参数，`bins` 参数控制群体中显示的直方图数量。值越高，直方图越多。尽管有时较高的值会让数据读取不那么直观，因此找到一个平衡点是很重要的。下一个参数是\
  \ `kde`，意为核密度估计（kernel density estimate）。有时比直方图更受青，或者与直方图结合使用以对数据进行更准确的解释。它大部分是对分布内任何变量概率密度函数的估计，更像直方图但更平滑。你可以阅读相关内容以获得这些内容的更深入的统计背景。\n\
  \n另一个实用的图表是 `relplot`，它显示了 `data_set` 中两个变量之间的关系。它有助于比较，并根据数据中的类别（例如 `sex`、`age`\
  \ 等）对结果进行排序。\n\n让我们演示 `total_bill` 如何与估计的 `tip` 相关，并按类别 `male/female` 排序。\n\n###\
  \ 根据 total_bill 估计 tip\n\n```python\nsns.relplot(x =\"total_bill\", y=\"tip\", data\
  \ = tips_dataset)\n```\n\n这是一个没有类别参数的基础图表。它告诉我们小费通常随总账单的增加而增加。较高的账单对应更高的小费，较低的账单对应较低的小费。添加类别让数据更有趣，因为我们可以看到哪些类别的小费更多或更少。\n\
  \n```python\nsns.relplot(x =\"total_bill\", y=\"tip\", data = tips_dataset, hue\
  \ = 'sex')\n```\n\nOut: `<seaborn.axisgrid.FacetGrid at 0x28d3b9cedd8>`\n\n看这个数据包含了更多信息。它告诉我们男性客户平均每笔总账单的小费比女性高。\n\
  \n现在，这个想法可以扩展并应用于更高级的数据上。你可以通过此链接进一步探索 `relplot` 的各种绘图选项：www.seaborn.pydata.org/tutorial/relational.html\n\
  \n`relplot` 还通过 `pairplot` 选项进行了扩展，它可以在一张图中关联数据集中的所有内容。这是快速获取数据内部重要趋势概述的好方法。\n\n\
  ```python\nsns.pairplot(tips_dataset,hue = 'sex', palette = 'coolwarm')\n```\n\n\
  Out: `<seaborn.axisgrid.PairGrid at 0x28d412f2e48>`\n\n看观察数据中三个主要参数（`total_bill`、`tip`\
