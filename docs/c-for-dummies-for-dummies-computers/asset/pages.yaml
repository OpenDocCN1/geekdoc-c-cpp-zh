  md: '# About the Author


    Stephen R. Davis, CISP (who goes by the name “Randy”) lives with his wife and
    two dogs in Corpus Christi, Texas. Randy has three kids and two grandkids with
    more on the way (grandkids, not kids). Randy develops browser-based applications
    for Agency Consulting Group.


    # Dedication


    To Janet, the love of my life.


    # Author’s Acknowledgments


    I find it very strange that only a single name appears on the cover of any book,
    but especially a book like this. In reality, many people contribute to the creation
    of a *For Dummies* book. From the beginning, acquisitions editor Constantine Santiste,
    project editor O''Brien, and my agent, Claudette Moore, were involved in guiding
    and molding the book’s content. During the development of the seven editions of
    this book, I found myself hip-deep in edits, corrections, and suggestions from
    a group of project editors, copyeditors, and technical reviewers—this book would
    have been a poorer work without for their involvement. And nothing would have
    made it into print without the aid of Suzanne Thomas, who coordinated the first
    and second editions of the book, Susan Pink, who worked on the third and sixth
    editions, Katie Feldman who worked on the sixth edition, and Danny Kalev, who
    did the technical review of the seventh and editions. Nevertheless, one name does
    appear on the cover and that name must take responsibility for any inaccuracies
    in the text.


    Finally, a summary of the animal activity around my house. For those of you who
    have not read any of my other books, I should warn you that this has become a
    regular feature of *For Dummies* books.


    I moved to the “big city” in 2005, which meant giving away our dogs Chester and
    Sadie. I tried too to keep our two Great Danes, Monty and Bonnie, but they were
    just too much for the backyard. We were forced to give them away as well. I married
    my high school sweetheart in 2011 and moved back to my home town of Corpus Christi
    which meant adopting a new pair of dogs (more like, they adopted me). Jack is
    a stubborn, black dog of an unidentifiable breed. Scruffy is said to be a wire
    haired dachshund but you couldn''t tell it by his appearance as he stays shaved
    for most of the time.'
