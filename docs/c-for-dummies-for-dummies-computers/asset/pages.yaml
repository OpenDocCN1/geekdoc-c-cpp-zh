  md: '# Chapter 7: Storing Sequences in Arrays


    The function displayString() is simpler to use than its displayCharArray() because
    it is no longer necessary to pass along the length of the character array. This
    secret handshake of terminating a character array with a null is so convenient
    that it is used throughout the C++ language. C++ even gives such a special name.


    ![](img/c6a7aed193f785f4098546695e53f585_130_0.png)


    A string of characters is a null-terminated character array. It is officially
    known as a null-terminated byte string, or NTBS. The simpler C-string is also
    used to differentiate from the C++ type string.


    The choice of "0" as the terminating character was not random. Remember that 0
    is the only numeric value that converts to false; all other values translate to
    true. Meaning that the loop could be (and usually is) written as


    ```

    for(int i = 0; stringArray[i]; i++)

    ```


    This whole business of null-terminated character strings is so ingrained in C++
    lately that C uses a string of characters surrounded by double quotes automatically
    terminated with a ''\0'' character. The following are identical declarations:


    ```

    char szMyName[] = "Stephen";

    char szAlsMyName[] = {''S'', ''t'', ''e'', ''p'', ''h'', ''e'', ''n'', ''\0''};

    ```


    The naming convention used here is exactly that, a convention. C++ does not care.
    The prefix sz stands for zero-terminated string.


    The string is eight characters long and not seven—the null character after the
    n is assumed. The string "" is one character, consisting of just the null character.


