  md: "# 128 Part II: Becoming a Functional C++ Programmer\n\nIn this case, the address\
    \ of $n$ is passed to the function $fn()$ rather than the value of $n$. The significance\
    \ of this difference is apparent when you consider the assignment within $fn()$.\n\
    \nSuppose $n$ is located at address 0x100. Rather than the value 10, the call\
    \ $fn(&n)$ passes the value 0x100. Within $fn()$, the assignment $*pnArg = 10$\
    \ stores the value 10 in the *int* variable located at location 0x100, thereby\
    \ overwriting the value 0. Upon returning to $parent()$, the value of $n$ is 10\
    \ because $n$ is just another name for 0x100.\n\n# Passing by reference\n\nC++\
    \ provides a shorthand for passing arguments by address — a shorthand that enables\
    \ you to avoid hassle with pointers. The following declaration creates a variable\
    \ $n1$ and a second reference to the same $n1$ but with a new name, $nRef$:\n\n\
    ```\nint n1;                   // declare an int variable\nint& nRef = n1;   \
    \   // declare a second reference to n1\nnRef = 1;             // now accessing\
    \ the reference\n                             // has the same effect as assigning\
    \ n1;\n                             // n1 is now equal to 1\n```\n\nA reference\
    \ variable like $nRef$ must be initialized when it is declared because every time\
    \ its name is used, C++ will ensure that you mean the variable that $nRef$ refers\
    \ to.\n\nReference variables find their primary application in function calls:\n\
    \n```\nvoid fn(int& rnArg) // declare reference argument\n{\n    rnArg = 10; \
    \         // change the value of the variable...\n                         //\
    \ ...that rnArg refers to\n}\nvoid parent(void)\n{\n    int n1 = 0;          //\
    \ pass a reference to n1\n    fn(n1);              // here the value of n1 is\
    \ 10\n}\n```\n\nThis is called *passing* by reference. The declaration $int\\\
    &$ $rmArg$ declares $rnArg$ to be a reference to an integer argument. The $fn()$\
    \ function stores the value 10 into the int location referenced by $rnArg$.\n\n\
    Passing by reference is the same as passing the address of a variable. The syntax\
    \ puts the onus on C++ to apply the \"address of\" operator to the reference rather\
    \ than requiring the programmer to do so.\n\n![](img/c6a7aed193f785f4098546695e53f585_143_0.png)"
