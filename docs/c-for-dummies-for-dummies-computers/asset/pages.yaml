  md: "# Part III: Introduction to Classes\n\nIn the call `s.addCourse()`, we say\
    \ that `addCourse()` operates on the object s or, said another way, \"s is the\
    \ student to whom the course is to be added.\" You can't fetch the number of semester\
    \ hours without knowing from student to fetch those hours—you can't add a student\
    \ to a course without knowing which to add. Calling a member function without\
    \ an object makes no more sense than referencing a data member without an object.\n\
    \n# Accessing other members from a member function\n\nI can see it clearly: You\
    \ repeat to yourself, \"Accessing a member without an object makes no sense. Accessing\
    \ a member without an object makes no sense...\" Just about the time you've accepted\
    \ this, you look at the member function `Student::addCourse()` and Wham! It hits\
    \ you: `addCourse()` accesses class members without reference to object. So how\
    \ do they do?\n\nOkay, if it is, or you can't? Believe me, you can't. When you\
    \ reference a member of `Student` from `addCourse()`, that reference is against\
    \ the `Student` object with which the call to `addCourse()` was made. Go back\
    \ to the `CallMemberFunction` example. A stripped-down version appears here:\n\
    \n```\nint main(int NnumberOfArgs, char* psz[]) {\n    Student s;\n    s.semesterHours\
    \ = 10;\n    s.gpa = 3.0;\n    s.addCourse(3, 4.0); // call the member function\n\
    \n    Student t;\n    t.semesterHours = 6;\n    t.gpa = 1.0; // not doing so good\n\
    \    t.addCourse(3, 1.5); // things aren't getting\n    much better\n\n    return\
    \ 0;\n}\n```\n\nWhen `addCourse()` is invoked with the object s, all of the otherwise\
    \ unqualified member references in `addCourse()` refer to s as well. Thus, the\
    \ reference to `semesterHours` in `addCourse()` refers to `s.semesterHours`, and\
    \ `gpa` refers to `s.gpa`. But when `addCourse()` is invoked with the `Student`\
    \ object t, these references are to `t.semesterHours` and `t.gpa` instead.\n\n\
    The object with which the member function was invoked is the \"current\" object,\
    \ and all unqualified references to class members refer to this object. Another\
    \ way, references to class members made from an object function are always against\
    \ the current object.\n\n![](img/c6a7aed193f785f4098546695e53f585_197_0.png)"
