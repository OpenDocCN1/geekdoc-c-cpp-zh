  md: '# Chapter 28: Writing Hacker-Code 391


    The program is stopped at the beginning of the call to getString() (which you
    can tell by the yellow arrows in Figure 28-2, both in the right view that shows
    only the C++ source and the 80x86 assembly language that was generated.) Note
    on the left of the instruction after the CALL to getString() is 0x004AA6C. The
    CPU Registers window shows the value of the ESP is 0x0028FDBC.


    Figure 28-3 shows the same windows immediately after the call to getString().
    Notice that the ESP has been decremented by 4 bytes (the size of a return address)
    to 0x0028FDBC and that ESP now points to the value 0x004AA6C, the address of the
    next instruction after the CALL. This is called the return address.


    What you can see on the stack in Figure 28-3 is 6CAA-46-00. This is because the
    80x86 processor stores all values with the least significant byte at the smallest
    address. This is called Little Endian.


    ![](img/c6a7aed193f785f4098546695e53f585_406_0.png)


