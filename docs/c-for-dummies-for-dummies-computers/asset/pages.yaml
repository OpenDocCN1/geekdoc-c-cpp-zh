  md: '# 28 Part I: Getting Started with C++ Programming


    C++ comment begins with a double slash (/) and ends with a newline. You can put
    any character you want in a comment. A comment may be as long as you want, but
    it is customary to keep comment lines to no more than 80 characters across. Back
    in the old days — "old" is relative here — screens were limited to 80 characters
    in width. Some printers default to 80 characters when printing text. These days,
    keeping a single line to fewer than 80 characters is just a good practical (easier
    to read; less likely to eyestrain; the usual).


    A newline was with a carriage return back in the days of typewriters — when the
    act of entering characters into a machine was called typing and not keyboard.
    A newline is the character that terminates a comment line.


    C++ allows a second form of comment in everything appearing after a /* and before
    a */ is ignored; however, this form of comment isn''t normally used in C++.


    ![](img/c6a7aed193f785f4098546695e53f585_43_0.png)


    It may seem odd to have a command in C++ (or any other programming language) specifically
    identified by the computer. It''s critical that all programmers have some version
    of the comment. The programmer explain what was going through her mind when she
    wrote the code. A programmer''s thoughts might not be obvious to the next colleague
    who tries to use or modify her program. In fact, the programmer herself may forget
    what her meant if she looks at it months after writing the original code and has
    left no clue.


    # Basing programs on C++ statements


    All C++ programs are based on what are known as C++ statements. This section reviews
    the statements that make up the program framework used by the Conversion program.


    A statement is a single set of commands. Almost all C++ statements other than
    comments end in a semicolon. You may see one other exception in Chapter 10.) Program
    execution begins with the first C++ statement after the open brace and continues
    through the listing, one statement at a time.


    As you look through the program, you can see that spaces, tabs, and newlines appear
    throughout the program. In fact, I place a newline after every statement in this
    program. These characters are collectively known as whitespace because you can''
    see them on the monitor.


    You may add whitespace anywhere you like in your program to enhance readability
    — except in the middle of a word:


    ![](img/c6a7aed193f785f4098546695e53f585_43_1.png)


    ```

    See wha t I mean?

    ```'
