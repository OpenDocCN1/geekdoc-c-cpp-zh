  md: "# 412 Part VI: The Part of Tens\n\nThe function data(int) allows the application\
    \ software to read data out of Array. This function is too trusting; it assumes\
    \ that the index provided is within the data range. What if the index is not?\
    \ The function data(int, int) is even worse because it overwrites an unknown location.\n\
    \nWhat's needed is a check to make sure that the index is in range. In the following,\
    \ only the data(int) function is shown for brevity:\n\n```\nint data(unsigned\
    \ int index)\n  if (index >= size)\n{\n    throw Exception(\"Array index out of\
    \ range\");\n  }\n  return pData[index];\n```\n\nNow an out-of-range index will\
    \ be caught by the check. (Making index unsigned precludes the necessity of adding\
    \ a check for negative index values.)\n\n# Comment Your Code While You Write It\n\
    \nYou can avoid errors if you comment your code while you write it rather than\
    \ wait until everything works and go back and add comments. I can understand not\
    \ taking the time to write voluminous headers and function descriptions until\
    \ later, but you always have time to add short comments while writing the code.\n\
    \nShort comments should be enlightening. If they're not, they aren't worth much.\
    \ You need all the enlightenment you get when you're trying to make your program\
    \ work. When you look at a piece of code you wrote a few days ago, comments that\
    \ are short, descriptive, and to the point can make a dramatic contribution to\
    \ helping you figure out exactly what it was trying to do.\n\nIn addition, consistent\
    \ code indentation and naming conventions make the code easier to understand.\
    \ It's all very nice when the code is easy to read after you're finished with\
    \ it, but it's just as important that the code is easy to read while you're writing\
    \ it. That's when you need the help."
