    An assignment operator is a binary operator that changes the value of its left
    argument. The simple assignment operator (=), is an absolute necessity in any
    programming language. This operator puts the value of the right-hand argument
    into the left-hand argument. The other assignment operators are odd enough that
    they seem to be someone''s whim.'
