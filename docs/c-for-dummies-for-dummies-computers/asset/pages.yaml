    \ the strange notation ps->gpa, in the next section of this chapter.\n\n# Dereferencing\
    \ an object pointer\n\nBy analogy of pointers to simple variables, you might think\
    \ that the following refers to the GPA of student s:\n\n```\nint main(int argc,\
