    of the more useful families of containers.


    The STL list container retains objects by linking them like Lego blocks (Chapter
    13 shows a simplistic implementation of a linked list.) Objects can be snapped
    apart and snapped back together in any order. This makes the list ideal for inserting
    objects and sorting, merging, and otherwise rearranging objects. Table 27-2 shows
    some of the methods of the list containers.


    | Table 27-2 | Major Methods of the list Template Class |

    | Method | Meaning |

    | list<T>() | Creates an empty list of objects of class T. |

    | ~list<T>() | Destructs the list, invoking the destructor on any T objects remaining
    in the list. |

    | list operator=(const list<T>& l) | Replaces the contents of the current list
    with copies of the objects in list l. |

    | bool operator==(const list<T>& l, const l) | Performs a lexicographic comparison
    between each element in the two lists. |

    | list<T>::iterator begin() | Returns an iterator that points to the first element
    in the current list. |

    | void clear() | Removes and destructs every object in the current list. |

    | bool empty() | Returns true if the current list is empty. |

    | list<T>::iterator end() | Returns an iterator that points to the next entry
    beyond the end of the current list. |

    | list<T>::iterator insert(const T& object) | Adds object to the list at the position
    pointed by the iterator loc. Returns an iterator that points to the added object.
    |

    | void pop_back() / void pop_front() | Removes the last or first object from the
    current list. |


