  md: "This for loop has two small problems. First, it's destructive — not in the\
    \ sense of what my puppy does to a slipper, but in the sense that it changes the\
    \ value of nloopcount, \"destroying\" the original value. Second, this for loop\
    \ counts backward from large values down to smaller values. These two problems\
    \ are addressed by adding a dedicated counting variable to the for loop.\nHere's\
    \ what it looks like:\n\n```\n// Demo2 - input a loop count. Loop while\n// outputting\
    \ arg number of times.\n#include <stdio>\n#include <iostream>\nusing namespace\
    \ std;\n\nint main(int NumberofArgs, char* pszArgs[])\n{\n    // input the loop\
    \ count\n    int nLoopCount;\n    cout << \"Enter loop count: \";\n    cin >>\
    \ nLoopCount;\n\n    // count up to the loop count limit\n    for (int i = 1;\
    \ i <= nLoopCount; i++)\n    {\n        cout << \"We've finished \" << i << \"\
    \ loops\" << endl;\n    }\n\n    // wait until user is ready before terminating\
    \ the program\n    // to allow the user to see the program results\n    cout <<\
    \ \"Press Enter to continue...\" << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n\
    \    return 0;\n}\n```\n\nThis modified version of ForDemo loops as it did before.\
    \ Instead of modifying the value of nLoopCount, however, this ForDemo2 uses a\
    \ new counter variable.\n\nThis for loop declares a counter i and initializes\
    \ it to 0. It compares this counter variable to nLoopCount. If i is less than\
    \ nLoopCount, control passes to the output statement within the body of the for\
    \ loop. Once the body has completed executing, control passes to the increment\
    \ clause where i is incremented and compared to nLoopCount again, and so it goes."
