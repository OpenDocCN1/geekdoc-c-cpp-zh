  md: "# 216 Part III: Introduction to Classes\n\nDifferent types of objects are created\
    \ at different times. Global objects are created when the program first begins\
    \ execution. Local objects are created when the program encounters their declaration.\n\
    \nA global object is one that is declared outside a function. A local object is\
    \ one that is declared within a function and is, therefore, local to the function.\
    \ In the following example, the variable me is global, and the variable notMe\
    \ is local to the function pickOne():\n\n![](img/c6a7aed193f785f4098546695e53f585_231_0.png)\n\
    \n```\nint me = 0;\nvoid pickOne()\n{\n    int notMe;\n}\n```\n\nAccording to\
    \ the rules, global objects are initialized to all zeros when the program starts\
    \ execution. Objects declared local to a function have no particular initial value.\
    \ Having all data members have a random state may not be a valid condition for\
    \ all classes.\n\nC++ allows the class to define a special member function that\
    \ is invoked automatically when an object of that class is created. This member\
    \ function, called the constructor, initializes the object to a valid initial\
    \ state. In addition, the class can define a destructor to handle the destruction\
    \ of the object. These two functions are the topics of this chapter.\n\n![](img/c6a7aed193f785f4098546695e53f585_231_1.png)\n\
    \n# Using Constructors\n\nThe constructor is a member function that is called\
    \ automatically when an object is created. Its primary job is to initialize the\
    \ object to a legal initial value for the class. (It's the job of the remaining\
    \ member functions to ensure the state of the object stays legal.)\n\nThe constructor\
    \ carries the same name as the class to differentiate it from the other members\
    \ of the class. The designers of C++ could have made up a different rule, such\
    \ as: \"The constructor must be called init().\" It wouldn't have made any difference,\
    \ as long as the compiler can recognize the constructor. In addition, the constructor\
    \ has no return type, not even void, because it is called only automatically —\
    \ if the constructor did return something, there would be no place to put it.\
    \ A constructor cannot be invoked manually."
