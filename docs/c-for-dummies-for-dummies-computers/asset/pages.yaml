  md: "# Part IV: Inheritance\n\nYou need to declare the function virtual only in\
    \ the base class. The \"virtual-ness\" is carried down to the subclass automatically.\
    \ In this book, however, I follow the coding standard of declaring the function\
    \ virtual everywhere (virtually).\n\n![](img/c6a7aed193f785f4098546695e53f585_301_0.png)\n\
    \n# When Is a Virtual Function?\n\nJust because you think that a particular function\
    \ call is bound late doesn't mean that it is. If not declared with the same arguments\
    \ in the subclasses, the member functions are not overridden morphically, whether\
    \ or not they are declared virtual.\n\nOne exception to the identical declaration\
    \ rule is that if the member function in the base class returns a pointer or reference\
    \ to a base class object, an overridden member function in a subclass may return\
    \ a pointer or reference to an object of the subclass. In other words, the function\
    \ makeACopy() is polymorphic, even though return type of the two functions differ:\n\
    \n```\nclass Base {\n  public:\n  // return a copy of the current object\n  Base*\
    \ makeACopy();\n}\nclass SubClass : public Base {\n  public:\n  // return a copy\
    \ of the current object\n  SubClass* makeACopy();\n}\nvoid fn(Base& bc) {\n  Base*\
    \ pCopy = bc.makeACopy();\n  // proceed on on...\n}\n```\n\n![](img/c6a7aed193f785f4098546695e53f585_301_1.png)\n\
    \nIn practice, this is quite natural. A makeACopy() function should return an\
    \ object of type SubClass, even if it might override BaseClass::makeACopy().\n\
    \nThis business of silently deciding when a function is overridden and is not\
    \ a source of error in C++; so much that the 2011 standard introduced the descriptor\
    \ override the programmer to indicate her intent to override a base class function.\
    \ C++ generates a compiler error if a function is declared override but does not,\
    \ in fact, override a base class function for reason (such as a mismatched argument)\
    \ in the following example:"
