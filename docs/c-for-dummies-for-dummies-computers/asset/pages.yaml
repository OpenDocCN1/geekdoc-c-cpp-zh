  md: "# 256 Part III: Introduction to Classes\n\n# It's a Long Way to Temporaries\n\
    \nPassing arguments by value to functions is the most obvious but not the only\
    \ example of the use of the copy constructor. C++ creates a copy of an object\
    \ under other conditions as well.\n\nConsider a function that returns an object\
    \ by value. In this case, C++ must create a copy using the copy constructor. This\
    \ situation is demonstrated in the following code snippet:\n\n```\nStudent fn();\
    \ // returns object by value\nint main(int argc, char* pArgs[])\n{\n    Student\
