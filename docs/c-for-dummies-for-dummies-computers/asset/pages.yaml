  md: '# Chapter 23: Using Stream I/O 319


    The destructor for the file stream classes automatically close the associated
    file. In my simple example, the MyName.txt file was closed when the object went
    out of scope upon returning from main(). Global objects are closed as part of
    program termination.


    # Open modes


    Table 23-2 shows the different modes that are possible when opening a file. However,
    you need to answer three basic questions every time you open a file:


    +   - Do you want to read from the file or write to it? Use ifstream to read and
    ofstream for writing. If you intend to both write and read from the same file,
    use the ifstream and set mode to inout, but good luck — it''s much better to write
    to a file completely and close and reopen it for reading as a separate object


    +   - If you are writing to the file and it already exists, you do want to add
    the existing contents (in which case, open with ate set) or truncate the file
    and start over (in which case use trunc)


    +   - Are you reading or writing binary data? Both ifstream and ofstream default
    to text mode. Use binary mode if you are reading or writing raw, non-text data.


    The primary difference between binary and text mode lies in the way that newlines
    are handled. The Unix operating system was written in the days when typewriters
    were still fashionable (it was called “typing” instead of “keyboarding”). Unix
    ended sentences with a linefeed followed by a carriage-return.


    Subsequent systems saw no reason to continue using two characters to a sentence,
    but they couldn''t agree on which character to use. Some use the carriage return,
    others used the linefeed, renamed newline. The C++ standard is simple newline.


    When a file is opened in text mode, the C++ library converts the new line character
    into what is appropriate for your operating system out, whether it''s a carriage
    return plus linefeed, a single carriage return, a linefeed, or something else
    entirely. It performs the opposite while reading a file. The C++ library does
    no such conversions for a file opened in binary mode


    ![](img/c6a7aed193f785f4098546695e53f585_334_0.png)


    Use binary mode when manipulating a file that''s not in human-readable format.
    Otherwise, if a byte in the data stream just happens to be the same as a carriage
    return or a linefeed, the file I/O library will modify it.'
