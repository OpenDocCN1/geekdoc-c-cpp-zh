  md: "# 210 Part III: Introduction to Classes\n\n# Making an Argument for Using Protected\
    \ Members\n\nNow that you know a little more about how to use protected members\
    \ in an actual class, I can replay the arguments for using protected members.\n\
    \n# Protecting the internal state of the class\n\nMaking the gpa member protected\
    \ precludes the application from setting the grade point average to some arbitrary\
    \ value. The application can add courses, but it cannot change the grade point\
    \ directly.\n\nIf the application has a legitimate need to set the grade point\
    \ average directly, the class can provide a member function for that purpose,\n\
    \n```\nclass Student {\n  public:\n    // same as before\n    double grade() {\
    \ return gpa; }\n    // here we allow the grade to be changed\n    double grade(double\
    \ newGPA)\n    {\n      double oldGPA = gpa;\n      // only if the new value is\
    \ valid\n      if (newGPA > 0 && newGPA <= 4.0)\n      {\n        gpa = newGPA;\n\
    \      }\n      return oldGPA;\n    }\n    // other stuff is the same including\
    \ the data\n  members:\n  protected:\n    int semesterHours; // hours earned toward\
    \ graduation\n    double gpa;\n}\n```\n\nThe addition of the member function grade(double)\
    \ allows the application to set the gpa. Notice, that the class still has not\
    \ given up control completely. The application cannot set gpa to any old value,\
    \ only a gpa in the legal range of values (from 0 through 4.0) is accepted.\n\n\
    Thus, the Student class has provided access to an internal data member without\
    \ abdicating its responsibility to make sure that the internal state of the class\
    \ is valid."
