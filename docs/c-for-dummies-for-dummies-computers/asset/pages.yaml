  md: "# Part III: Introduction to Classes\n\n# Placing Too Many Demands on the Carpenter:\
    \ Overloading the Constructor\n\nI can draw one more parallel between constructors\
    \ and other normal member functions in this chapter: Constructors can be overloaded.\n\
    \nOverloading a function means to define two functions with the same short name\
    \ but with different types of arguments. See Chapter 6 for the latest news on\
    \ function overloading.\n\n![](img/c6a7aed193f785f4098546695e53f585_243_0.png)\n\
    \nC++ chooses the proper constructor based on the arguments in the declaration\
    \ of the object. For example, the class Student can have three constructors in\
    \ the following snippet at the same time:\n\n```\n// OverloadConstructor provide\
    \ ways to create objects overloading the constructor\n//\n#include <stdio>\n#include\
    \ <stdlib>\n#include <iostream>\n#include <string.h>\n\nusing namespace std;\n\
    {\npublic:\n    Student ()\n{\n        cout << \"constructing student No Name\"\
    \ << endl;\n        name = \"No Name\";\n        semesterHours = 0;\n        gpa\
    \ = 0.0;\n    }\n    Student(const char *pName)\n{\n        cout << \"constructing\
    \ student \" << pName << endl;\n        name = pName;\n        semesterHours =\
    \ 0;\n        gpa = 0;\n    }\n    Student(const char *pName, int xfrHours, float\
    \ xfrGPA)\n{\n        cout << \"constructing student \" << pName << endl;\n  \
    \      name = pName;\n        semesterHours = xfrHours;\n        gpa = xfrGPA;\n\
    \    }\n```"
