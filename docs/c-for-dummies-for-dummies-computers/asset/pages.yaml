  md: '# Chapter 9: Taking a Look at C++ Pointers


    # Strings have me constantly confused


    You may noticed that I slipped a const declaration into the earlier DisplayString
    example program. This was necessary to account for differences between an array
    and a pointer. A string such as "this is a string" is considered a constant address
    of a string constant. In other words, neither the address of the string nor the
    characters themselves can be changed. Why is that?


    One problem is that you don''t know how C++ stores its local strings nor how many
    times it reuses the same string. C++ stores constant strings in the same memory
    locations as source code, and it often uses the same string in several places
    in the program. For this reason, C++ often marks constants as uint


    The initialization of a pointer variable is similar to initializing any other
    variable:


    ```

    int i = 1;

    const char* pString = "this is a string";

    ```


    Both declarations initialize the variable on the left with the constant value
    on the right. However, since pString points directly to the immutable string "this
    is a string" it''s important that pString declared const char, a pointer to constant
    characters.


    The equivalent array is more complicated than it appears first:


    ```

    char sChars[] = "this is a string"; // declare and init array

    ```


    This declares allocates memory for an array sChars and then copies the initialization
    string into it. Thus, the letter t that is the first character in sChars is not
    the same letter t that makes up the immutable string.


    In fact, the preceding is shorthand for the longer-winded description


    ```

    char sChars[17];nstrcpy(sChars, "this is a string"); // ...then initialize it

    ```


    Remember that strcpy copies the string of characters represented by the second
    argument into the array pointed at by the first argument. And also remember to
    allocate space for the terminating null.


    The expression pArray[10] is syntactically equivalent to charArray[10], but pArray
    has not been initialized so pArray[10] references some random (garbage) location.


    The mistake of referencing memory with an uninitialized pointer variable is generally
    caught by the CPU when the program executes, resulting in the dreaded segmentation
    error that from time to time haunts your favorite applications your favorite,
    or not-so-favorite, operating system. This problem is not generally the fault
    of the processor or the operating system, but of the application.


    Another implication of this difference is that you can use a range-based loop
    on an array where the size of the array is known but not on a pointer where the
    number of elements is not known:


    ![](img/c6a7aed193f785f4098546695e53f585_158_0.png)'
