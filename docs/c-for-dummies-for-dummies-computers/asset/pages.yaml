    call to fn2() using the copy constructor. The function fn2() does nothing more
    than return a copy of this object to main(); however, this copy is just a temporary
    object that fn1() returns to main(). Rather use the copy constructor to create
    a "Copy of Scruffy", C++11 invokes the move constructor to create the contents
    of the temporary object. When this temporary is subsequently destructed, it is
    a "null object" because its pName has been taken away and reassigned.


