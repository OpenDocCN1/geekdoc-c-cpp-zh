  md: "# Part II: Becoming a Functional C++ Programmer\n\nYou can see that this approach\
    \ can't handle sequences involving more than just a few numbers. Besides, it's\
    \ ugly. What we need is some type of structure that has a name like a variable\
    \ but can store more than one value. May I present to you, Ms. A. Ray.\n\nAn array\
    \ solves the problem of sequences nicely. For example, the following snippet declares\
    \ an array valueArray that has storage up to 128 int values. It populates the\
    \ array with the numbers entered from the keyboard:\n\n```\nint nValue;\n// declare\
    \ an array capable of holding up to 128 ints\nint nArray[128];\n\n// define an\
    \ index used to access subsequent members\n// of the array; don't exceed the 128\
    \ int limit\nfor (int i = 0; i < 128; i++)\n{\n    cin >> nValue;\n    // exit\
    \ the loop when the user enters a negative\n    // number\n    if (nValue < 0)\n\
    \    {\n        break;\n    }\n    nArray[i] = nValue;\n}\n```\n\nThe second line\
    \ of this snippet declares an array nValueArray. Array declaration begins with\
    \ the type of the array members: in this case, int. This is followed by the name\
    \ of the array. The last elements of declaration are closed brackets containing\
    \ the maximum number of elements that the array can hold. In this snippet, nValueArray\
    \ can store up to 128 integers.\n\nThe size of an array must be a constant expression\
    \ — this means an expression that C++ can calculate when it builds.\n\nThe 2014\
    \ standards allow the program to declare the size of an array with any expression\
    \ as long as its value is known when the declaration is encountered. However,\
    \ once declared, the size of the array is fixed.\n\nThis snippet reads a number\
    \ from the keyboard and stores it into each element of an array nValueArray. You\
    \ access an individual element of an array by providing the name of the array\
    \ followed by brackets containing index. The first integer in the array is nValueArray[0],\
    \ the second is nValueArray[1], and so on.\n\nIn, nValueArray[i] represents the\
    \ ith element in the array. The index variable i must be a counting variable —\
    \ that is, i must be a char, an int, or a long. If nValueArray is an array of\
