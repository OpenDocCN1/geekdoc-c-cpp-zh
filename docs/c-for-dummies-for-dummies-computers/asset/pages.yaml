  md: "# Chapter 13: Point and Stare at Objects\n\nIn this example, C++ passes a reference\
    \ to s rather than a copy. The output\nfrom this version is identical to the PassObjPtr\
    \ program — changes made in\nsomeFn() are retained in main().\n\n# # Why bother\
    \ with Pointers or References?\n\nOkay, so both pointers and references provide\
    \ relative advantages, but why\nbother with either one? Why not just pass the\
    \ object? I mentioned one\nobvious answer earlier in this chapter: You can't modify\
    \ the object from a\nfunction that gets nothing but a copy of the structure object.\n\
    \nHere's a second reason: Some objects are large — I mean really large. An\nobject\
    \ representing a screen image be many megabytes in length. Passing\nsuch an object\
    \ by value means copying the entire thing into the function's\nmemory.\n\nThe\
    \ object will need to be copied again should that function call another, and\n\
    so on. After a while, you will end up with dozens of copies of this object. That\n\
    consumes memory, and copying all the objects can make execution of your\nprogram\
    \ slower booting up Windows.\n\n![](img/c6a7aed193f785f4098546695e53f585_214_0.png)\n\
    \nThe problem of copying objects gets worse. You see in Chapter 17 that making\n\
    a copy of an object can be even more painful than simply copying some\nmemory\
    \ around.\n\nPassing a pointer (or a reference) is very fast. A pointer is 4 bytes,\
    \ no matter\nhow big the object is being pointed at.\n\n# # Returning to the Heap\n\
    \nThe problems that exist for simple types of pointers plague class object\npointers\
    \ as well. In particular, you must make sure that the pointer you're\nactually\
    \ using points to a valid object. For example, don't return a reference\nto an\
    \ object defined local to the function:\n\n```\nMyClass* myFunc() {\n    // the\
    \ following does not work\n    MyClass mc;\n    MyClass* pMC = &mc;\n    return\
    \ pMC;\n}\n```"
