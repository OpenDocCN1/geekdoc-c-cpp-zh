    # What''s up with endl?


    Most programs in this book terminate an output stream by inserting the object
    endl. However, some programs include \n within the text to output a newline. What''s
    the deal?


    The \n is, in fact, the newline character. In the expression cout << "First line\nSecond;
    outputs two lines. The endl object outputs a newline, but continues one step.


    Disks are slow devices. Writing to more often than necessary will slow down your
    program considerably. To avoid this, the ofstream collects output into an internal
    buffer known as a cache (pronounced like "cash"). The class writes the contents
    to disk when the buffer is full (this is known as flush-cache). The endl object
    outputs a newline and then flushes the output cache. The member function flush()
    flushes the output cache without taking a newline onto the end.


    Note that the error object cerr does not buffer output.


    # Positioning the pointer within a file


    The istream maintains a read pointer that is the location within the file of the
    next byte to read. This is measured as "number of bytes from the beginning of
    the file." You can retrieve this using the tellg() method.'
