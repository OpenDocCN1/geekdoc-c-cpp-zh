  md: '# 206 Part III: Introduction to Classes


    main() adds each object returned from getData() to the beginning of the linked
    list pointed at by the global variable pHead. Control exits the initial loop while
    getData() returns a null. main() then enters a second section that iterates through
    the completed list, displaying each object.


    This time I used a for that is functionally equivalent to the earlier while loop.
    The loop initializes the pointer pter to point to the first element in the list
    by the assignment pter = pHead. It checks to see if pter is null, which will be
    the case when the list is exhausted. It then enters the loop. On each round trip
    through the for loop, the third clause moves pter from one object to the next
    with the assignment pter = pter->pNext before repeating the test and the body
    of the loop. This pattern is commonly followed for all list types.


