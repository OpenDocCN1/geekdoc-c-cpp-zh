  md: '# 284 Part IV: Inheritance


    The type that you''ve been accustomed to until now is called the static, compile-time,
    type. The compile-time type of x is Student in both cases because that''s what
    the declaration in fn() says. The other kind is the dynamic, or run-time, type.
    In the case of the example function fn(), the run-time type of x is Student when
    fn() is called with s and GraduateStudent when fn() is. Are you having fun?


    The capability of deciding at runtime which of overloaded member functions to
    call based on the run-time type is called polymorphism, or late binding. Deciding
    which overloaded function to call at compile-time is called early binding because
    that sounds like the opposite of late binding.


    Overloading a base class function polymorphically is called overriding the base
    class. This new name is used to differentiate this more complicated from the normal
    order case.


    # Why You Need Polymorphism


    Polymorphism is key to the power of object-oriented programming. It''s so important
    that languages that don''t support polymorphism can''t advertise themselves as
    OO languages. (I think it''s a government regulation — you can''t label a OO if
    it doesn''t support polymorphism unless you add a disclaimer from the Surgeon
    General, or something like that.)


    Without polymorphism, inheritance has little meaning. Remember how I made nachos
    in the oven? In this sense, I was acting as the late binder. The recipe had: Heat
    the nachos in the oven. It didn''t read: If the type of oven is microwave, do
    this; if the type of oven is conventional, do this; if the type of oven. The recipe
    (the code) relied on the (late binder) to decide what the action (member function)
    heat means when applied to the oven (the particular instance of class Oven) or
    any of its variations (subclasses), such as a microwave oven (Microwave). This
    is what people think, and designing a language along the lines of the way think
    allows the programming model to more accurately describe the world in which people
    live.


    # How Polymorphism Works


    Any given language can support either early or late binding based upon the whims
    of its developers. Older languages like C tend to support early binding alone.
    Recent languages like Java and C# support only late binding. As a fence straddler,
    C++ supports both early and late binding.'
