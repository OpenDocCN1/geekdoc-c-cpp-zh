  md: "# Chapter 10: The C++ Preprocessor\n\nTake the following simple example. Suppose\
    \ I had created a library that contains the trigonometric functions sin(), cos(),\
    \ tan(), and a whole lot more. I would likely create an include file mytrig with\
    \ the following contents to go along with my standard library:\n\n```\n// include\
    \ prototype declarations for my library\ndouble sin(double x)\ndouble cos(double\
    \ x)\ndouble tan(double x)\n// ...more prototype declarations\n```\n\nAny program\
    \ that wanted to use one of these math functions would #include that file, enclosing\
    \ the name of the include file either in brackets or quotes as\n\n```\n#include\
    \ <mytrig>\n```\n\n```\n#include \"mytrig\"\n```\n\nThe difference between the\
    \ two forms of #include is a matter of directory and where the preprocessor goes\
    \ to look for the mytrig file. When the file is enclosed in quotes, the preprocessor\
    \ assumes the file is locally grown, so it starts looking for the file in the\
    \ same directory in which it found the source file. If it doesn't find the file,\
    \ it starts looking in its own include directories. The preprocessor assumes that\
    \ include files in brackets are from the C++ library and goes straight to the\
    \ standard library it skips looking in the source file folders. Use quotes for\
    \ any include file that you create and angle brackets for C++ library files.\n\
    \nThus, you might write a source file like the following:\n\n```\n// MyProgram\
    \ - is very intelligent\n#include \"mytrig\"\nint main(int argc, char* pArguments[])\n\
    {\n\tcout << \"The sin of .5 is \" << sin(0.5) << endl;\n\treturn 0;\n}\n```\n\
    \n![](img/c6a7aed193f785f4098546695e53f585_170_0.png)"
