  md: "# 226 Part III: Introduction to Classes\n\n# Using a constructor\n\nConceptually,\
    \ the idea of adding an argument is simple. A constructor is a member function,\
    \ and member functions can have arguments. Therefore, constructors can have arguments.\n\
    \nRemember, though, that you don't call the constructor like a normal function.\
    \ Therefore, the only time to pass arguments to the constructor is when the object\
    \ is created. For example, the following program creates an object of the class\
    \ Student by calling the Student(const char*) constructor. The object s is destroyed\
    \ when the function main() returns.\n\n```\n// ConstructorWarg - a class may pass\
    \ along arguments\n// to the members' constructors\n\n#include <stdio>\n#include\
    \ <iostream>\nusing namespace std;\n\nclass Student {\npublic:\n    Student(const\
    \ char* pName)\n    {\n        cout << \"constructing Student \" << pName << endl;\n\
    \        name = pName;\n        semesterHours = 0;\n        gpa = 0.0;\n    }\n\
    \n    // ...other public members...\nprotected:\n    string name;\n    int semesterHours;\n\
    \    double gpa;\n};\n\nint main(int argc, char* pArgs[])n{\n    // create a student\
    \ locally and one off of the heap\n    Student s1(\"Jack\");\n    Student* pS2\
