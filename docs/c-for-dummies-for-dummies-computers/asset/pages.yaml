  md: '# 410 Part VI: The Part of Tens


    Disabling warning and error messages is a bit like unplugging the Check light
    on your car dashboard because it bothers you: Ignoring the problem doesn''t make
    it away. If your compiler has a Syntax Check from Hell mode, enable it.


    Don''t start debugging your code until you remove or at least understand warnings
    generated during compilation. Enabling all warning messages if you ignore them
    does you no good. If you don''t understand the warning, look it up. What you don''t
    know will hurt you.


    # Adopt a Clear and Consistent Coding Style


    Coding in a clear and consistent style not only enhances the readability of your
    program but also results in fewer coding mistakes. Remember, the less brain power
    you have to deciphering C++ syntax, the more you have left over for thinking about
    the logic of the program at hand. A good coding style enables you to do the following
    with ease:


    +   - Differentiate class names, object names, and function names.

    - Know something about the object based on its name.

    - Differentiate preprocessor symbols from C++ symbols (that is, #defined objects
    should stand out).

    - Identify blocks of C++ code at the same level (this is the result of consistent
    indentation).


    In addition, you need to establish a standard module header that provides information
    about the functions or classes in the module, the author (preferably that''s you),
    the date, the version of the compiler you are using, and a modification history.


    Finally, all programmers involved in a single project should use the same style.
    Trying to decipher a program with a patchwork of different coding styles is confusing.


    You can let Code::Blocks maintain your source code style for you. Select Settings:Editor
    and select Source Formatter on the menu from the right, you can select your preferred
    source code style. Now select Plugins:Source Code Formatter to completely reformat
    your modules.


    ![](img/c6a7aed193f785f4098546695e53f585_425_0.png)'
