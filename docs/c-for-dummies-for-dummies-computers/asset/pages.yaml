  md: "# Chapter 7: Storing Sequences in Arrays\n\nUnfortunately for the programmer,\
    \ C++ does not check to see whether the index you are using is within the range\
    \ of the array. C++ is perfectly happy giving you access to integerArray[200].\
    \ Our integerArray yard is 128 integers long — 200 is integers into someone else's\
    \ yard. No one tells you where and what he's storing at that location. Reading\
    \ from integerArray[200] will return unknown and unpredictable value. Writing\
    \ to that generates unpredictable results. If you do nothing—the house may be\
    \ abandoned and unused. On the other hand, it might overwrite some data, thereby\
    \ causing the neighbor problem in a seemingly random fashion. Or it might crash\
    \ the program.\n\n![](img/c6a7aed193f785f4098546695e53f585_126_0.png)\n\nThe most\
    \ common way to access an array is to read or write location integerArray[128].\
    \ Although it's only one element beyond the end of the array, reading or writing\
    \ this location is just as dangerous as any other incorrect address.\n\n![](img/c6a7aed193f785f4098546695e53f585_126_1.png)\n\
    \n# Array-based range for loops\n\nYou can access the elements of an array using\
    \ a range-based for loop in some cases. The following for loop initializes all\
    \ the members of nArray to 0:\n\n```\nint nArray[128];nfor(int &n: nArray)\n{\n\
    \    n = 0;\n}\n```\n\nThis for loop assigns the variable n to be a reference\
    \ to each element of nArray in turn. A 0 is assigned to each element in nArray\
    \ through the reference n.\n\nThe range-based for loop has no effect:\n\n![](img/c6a7aed193f785f4098546695e53f585_126_2.png)\n\
    \n```\nint nArray[128];nfor(int n: nArray)\n{\n    n = 0;\n}\n```\n\nUsing the\
    \ ampersand (&), n is assigned the value of each element of nArray in turn. The\
    \ unchanged n is then overwritten with a 0, leaving the value of nArray unchanged.\
    \ Compare this to passing arguments to functions by value versus passing by reference,\
    \ as described in Chapter 6."
