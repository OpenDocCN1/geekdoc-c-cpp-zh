    \ run of this program appears identical to that generated by the NestedDemo program.\n\
    \n# Understanding the Details of Functions\n\nFunctions are so fundamental to\
    \ creating C++ programs that getting a handle on the details of defining, creating,\
    \ and testing them is critical. Armed with the example FunctionDemo program, consider\
    \ the following definition of function: A function is a logically separated block\
    \ of C code.\n\nThe function construct has this form:\n\n```\n<return type> name(<arguments\
    \ to the function)>\n{\n    // ...\n    return <expression>;\n}\n```\n\nThe arguments\
    \ to a function are values that can be passed to the function used as input information.\
    \ The return value is a value that the function returns. For example, in the call\
