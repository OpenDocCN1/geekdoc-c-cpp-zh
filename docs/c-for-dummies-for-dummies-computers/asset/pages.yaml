  md: "# 202 Part III: Introduction to Classes\n\nNot every class can be used to create\
    \ a linked list. You declare a linkable class as follows:\n\n```\nclass LinkableClass\
    \ {\n  public:\n    LinkableClass* pNext;\n    // other members of the class\n\
    };\n```\n\nThe key to a linkable class is the pNext pointer. At first blush, this\
    \ seems odd indeed—a class contains a pointer to itself! Actually, pNext is not\
    \ a pointer to itself but to another, different object of the same type.\n\nA\
    \ linked list is similar to a chain of school children crossing the street. The\
    \ pNext pointer corresponds to a child's arm reaching out and grabbing the child\
    \ next to.\n\nSomewhere outside the linked list is a pointer to the first element\
    \ of the list, the head pointer. The head pointer is simply a pointer of type\
    \ LinkableClass*, sort of like the teacher holding onto the kid in the chain.\n\
    \n![](img/c6a7aed193f785f4098546695e53f585_217_0.png)\n\nAlways initialize any\
    \ pointer to nullptr, the pointer that doesn't point to anything, the non-pointer.\n\
    \n```\nLinkableClass* pHead = nullptr;\n```\n\nFor C++ compilers prior to the\
    \ '1' standard that don't implement nullptr, a hardcoded 0 or an equivalent #define\
    \ instead:#define nullptr 0.\n\n```\nLinkableClass* pHead = NULLPTR;\n```\n\n\
    To see how linked lists work in practice, consider the following function, which\
    \ adds the argument it passed to the beginning of a list:\n\n```\nvoid addHead(LinkableClass*\
    \ PLC) {\n  PLC->pNext = pHead;\n  pHead = PLC;\n}\n```\n\nHere the pNext pointer\
    \ of the object is set to point the first member of the list. For one instruction,\
    \ both you and the teacher have hold of this first kid in the chain. The second\
    \ line points the head pointer to the object, sort of like having the teacher\
    \ let go of the kid you're holding onto and grabbing you. That makes you the kid\
    \ in the chain."
