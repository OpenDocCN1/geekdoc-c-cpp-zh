  md: "# 222 Part III: Introduction to Classes\n\n```\n-Student() {\n  // ...whatever\
    \ assets are returned here...\n  protected:\n    int semesterHours;\n    double\
    \ gpa;\n}\n```\n\nThe destructor is invoked automatically when an object is destroyed,\
    \ or in C++, when an object is destructed. That sounds sort of circular (\"the\
    \ destructor is invoked when an object is destroyed”), so I've avoided the term\
    \ until now. For non-heap memory, you can also say, \"when the object goes out\
    \ of scope.\" A local object goes out of scope when the function returns. A global\
    \ or static object goes out of scope when the program terminates.\n\nBut what\
    \ about heap memory? An object that has been allocated off the heap is destructed\
    \ when it's returned to the heap using the delete command. This is demonstrated\
    \ in the following Destructor program:\n\n```\n// DestructMembers - this program\
    \ both constructs and\n// destructs a set of data members\n#include <stdio>\n\
    #include <cstdlib>\n#include <iostream>\nusing namespace std;\n\nclass Course\
    \ {\n  public:\n  Course() { cout << \"constructing course\" << endl; }\n  ~Course()\
    \ { cout << \"destructing course\" << endl; }\n}\n\nclass Student {\n  public:\n\
    \  Student() { cout << \"constructing student\" << endl; }\n  ~Student() { cout\
    \ << \"destructing student\" << endl; }\n}\nclass Teacher {\n  public:\n  Teacher()\
    \ {\n    cout << \"constructing teacher\" << endl;\n  }\n  pC = new Course;\n\
    }\n```"
