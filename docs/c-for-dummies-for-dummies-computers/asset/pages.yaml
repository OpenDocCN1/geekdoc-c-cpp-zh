  md: '# Part II: Becoming a Functional C++ Programmer


    # Defining our first function


    The statement void displayExplanation(void) is known as a function declaration
    — it introduces the function definition that immediately follows. A function declaration
    always starts with the name of the function preceded by the type of value the
    function returns followed by a pair of open and closed parentheses containing
    any arguments to the function.


    The return type void displayExplanation() does not return a value. The void within
    the argument list means that it doesn''t take any arguments either. (We''ll get
    to what that means very soon.) The body of the function is contained in the braces
    immediately following the function declaration.


    Function names are normally written as a multiword description with all the words
    rammed together. I start function names with lowercase but capitalize intermediate
    words. Function names almost always appear followed by an open and close parenthesis.


    ![](img/c6a7aed193f785f4098546695e53f585_107_0.png)


    A function doesn''t do anything until it is invoked. Our program starts execution
    with the first line in main() just like always. The first non-comment line in
    main is the call to displayExplanation():


    ```

    displayExplanation();

    ```


    This passes program control to the first line in the displayExplanation() function.
    The computer continues to execute until it reaches the return statement at the
    end of displayExplanation() or until control reaches the closed brace at the end
    of the function.


    # Defining the sumSequence () function


    The declaration int sumSequence(void) begins the definition of the sumSequence()
    function. This declaration says that the function does not expect any arguments
    but returns a value of int to the caller. The body of this function contains the
    same code previously found in the inner loop of the NestedDemo example.


    The sumSequence() function also contains a return statement to exit the program.
    This is not optional since it contains the value to be returned, accumulator.
    The type of value returned must match the type of the function in the declaration,
    in this case int.


    # Calling the function sumSequence ()


    Return back to the main() function in FunctionDemo again. This section of code
    looks similar to the outer loop in NestedDemo.'
