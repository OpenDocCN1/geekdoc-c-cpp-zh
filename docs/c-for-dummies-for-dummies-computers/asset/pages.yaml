  md: "# Keeping Member Function after Class\n\nFor larger functions, putting the\
    \ code directly in the class definition can lead to some large, unwieldy class\
    \ definitions. To prevent this, C++ lets you define member functions outside the\
    \ class.\n\nA function that is defined outside the class is said to be an outline\
    \ function. This term is meant to be the opposite of an inline function that has\
    \ been defined within the class. Your basic functions such as those we have defined\
    \ since Chapter 5 are also outline functions.\n\n![](img/c6a7aed193f785f4098546695e53f585_202_0.png)\n\
    \nWhen written outside the class declaration, the Savings.h file declares the\
    \ deposit() function without defining it as:\n\n```\n// Savings define a class\
    \ that includes the ability\n// to make a deposit\nclass Savings\n{\npublic:\n\
    \    // declare but don't define member function\n    double deposit(double amount);\n\
    \    unsigned int accountNumber;\n    double balance;\n}\n```\n\nThe definition\
    \ of the deposit() function must be included in one of the source files that make\
    \ up the program. For simplicity, I defined it within main.cpp.\n\nYou would not\
    \ normally combine the member function with the rest of your program. It is more\
    \ convenient to collect the outlined member functions into a source file with\
    \ an appropriate name (such as Savings.cpp). This source file is combined with\
    \ other source files as part of building the executable. I describe this in Chapter\
    \ 21.\n\n![](img/c6a7aed193f785f4098546695e53f585_202_1.png)\n\n```\n// SavingsOutline\
    \ - invoke a member function that's\n// declared within a class but\n// defined\
    \ in a separate file\n\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\
    \nusing namespace std;\n#include \"Savings.h\"\n\n// define the member function\
    \ Savings::deposit()\n// (normally this is contained in a separate file that\n\
    // then combined with a different file that is combined)\ndouble Savings::deposit(double\
    \ amount)\n```"
