    1 In this chapter, I look at several ways to minimize errors, as well as ways
    to make debugging the errors that are introduced earlier.


    # Enable All Warnings and Error Messages


    The syntax of C++ allows for a lot of error checking. When the compiler encounters
    a construct that it can''t decipher, it has no choice but to generate an error
    message. Although the compiler attempts to sync back up with the next statement,
    it does not attempt to generate an executable program.'
