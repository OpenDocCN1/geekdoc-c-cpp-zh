  md: '# 158 Part II: Becoming a Functional C++ Programmer


    TIP

    In usage, you pronounce the # sign as "pound", so you say "pound-define a constant"
    to distinguish from defining a constant in some other way.


    ```

    #define TWO_PI 6.2831852

    ```


    This makes the following statement much easier to understand:


    ```

    double diameter = TWO_PI * radius;

    ```


    than the equivalent expression, which is actually what the C++ compiler sees after
    the preprocessor has replaced TWO_PI with its definition:


    ```

    double diameter = 6.2831852 * radius;

    ```


    Another advantage is the ability to #define a constant in one place and use it
    everywhere. For MAX_EXAMPLE, I might include the following #define in an include
    file:


    ```

    #define MAX_NAME_LENGTH 512

    ```


    Throughout the program, I can truncate the names that I read from the board to
    a common and consistent MAX_NAME_LENGTH. Not only is this easier to read, but
    it also provides a single place in the program to change should I want to increase
    or decrease the maximum name length that I choose to process.


    The preprocessor also allows the program to #define function-like macros with
    arguments that are expanded when the definition is used:


    ```

    #define SQUARE(X) X * X

    ```


    In usage, such macro definitions look a lot like functions:


    ```

    // calculate the area of a circle

