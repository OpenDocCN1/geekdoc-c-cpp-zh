  md: "# Part IV: Inheritance\n\n# Having a HAS_A Relationship\n\nNotice that the\
    \ class Student includes the members of class Student and Advisor, but in a different\
    \ way. By defining a data member of class Advisor, you know that a Student has\
    \ all the data members of Advisor within it. However, you can't say that a GraduateStudent\
    \ is an Advisor — instead you say that a GraduateStudent HAS_A Advisor. What's\
    \ the difference between this and inheritance?\n\nUse a car as an example. You\
    \ could logically define a car as a subclass of vehicle, so it has the properties\
    \ of other vehicles. At the same time, a car has a motor. If you buy a car, you\
    \ could logically assume that you are buying a motor as well. (Unless you go the\
    \ used-car where I got my last heap.)\n\nIf friends ask you to show up at a rally\
    \ on Saturday with your vehicle of choice and you go in your car, they can't complain\
    \ (even if someone else shows up you on a bicycle) because a car IS_A Vehicle.\
    \ But, if you appear on foot carrying a motor, your friends will have reason to\
    \ laugh at you because a motor is not a vehicle. A motor missing certain critical\
    \ properties that all vehicles share — such as a place to ride.\n\nFrom a programming\
    \ standpoint, the HAS_A relationship is just as straight-forward. Consider the\
    \ following:\n\n```\nclass Vehicle {};nclass Motor {};\nclass Car : public Vehicle\n\
    {\n    public:\n        Motor motor;\n};\n\nvoid VehicleFn(Vehicle& v);\nvoid\
    \ MotorFn(Motor& m);\n\nint main(int nnumberOfArgs, char* pszArgs[])\n{\n    Car\
    \ car;\n    VehicleFn(car);    // this is allowed\n    MotorFn(car);      // this\
    \ is not allowed\n    MotorFn(car.motor);// this is allowed\n    return 0;\n}\n\
    ```\n\nThe call VehicleFn(car) is allowed because car IS_A vehicle. The call MotorFn(car)\
    \ is not because car is not a Motor even though it contains a Motor. If the intention\
    \ was to pass the Motor portion of car to the function"
