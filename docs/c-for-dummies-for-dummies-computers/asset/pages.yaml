  md: "# Creating Shallow Copies versus Deep Copies\n\nPerforming a member-member\
    \ copy seems the obvious thing to do in a copy constructor. Other than adding\
    \ the capability to tack on silly things such as Copy of to the front of students'\
    \ names, when would you ever want to do anything but a member-member copy?\n\n\
    Consider what happens if the copy constructor allocates an asset, as memory off\
    \ the heap. If the copy constructor simply makes a copy of that asset without\
    \ allocating its own asset, you end up with a troublesome situation: objects thinking\
    \ they have exclusive access to the same asset. This becomes nastier when the\
    \ destructor is invoked for both objects and they both try to put the same asset\
    \ back. To make this more concrete, consider the following example:\n\n```\n//\
    \ ShallowCopy performing a byte-by-byte (shallow) copy\n// is not correct when\
    \ the class holds assets\n//\n#include <cstdio>\n#include <cstdlib>\n#include\
    \ <iostream>\nusing namespace std;\n\nclass Person {\npublic:\n    Person(const\
    \ char *pN) {\n        cout << \"Constructing \" << pN << endl;\n        pName\
    \ = new string(pN);\n    }\n    ~Person() {\n        cout << \"Destructing \"\
    \ << pName\n             << \" (\" << *pName << \")\" << endl;\n        *pName\
    \ = \"already destroyed memory\";\n        // delete pName;\n    }\nprotected:\n\
    \    string *pName;\n};\n\nvoid fn() {\n    // create a new object\n    Person\
    \ p1(\"This_is_a_very_long_name\");\n```"
