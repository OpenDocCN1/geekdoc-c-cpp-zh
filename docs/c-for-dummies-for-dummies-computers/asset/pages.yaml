  md: "# Part II: Becoming a Functional C++ Programmer\n\nBoth the arguments and the\
    \ return value are optional. If either is absent, the keyword void is used instead.\
    \ That is, if a function has a void argument list, the function does not take\
    \ any arguments when called (this was the case with the FunctionDemo program).\
    \ If the return value is void, the function does not return a value to the caller.\n\
    \n![](img/c6a7aed193f785f4098546695e53f585_109_0.png)\n\nThe default argument\
    \ type to a function is void, meaning that it takes no arguments. A function int\
    \ fn(void) may be declared as int().\n\n# Understanding simple functions\n\nThe\
    \ simple function sumSequence() returns an integer value that it calculates. Functions\
    \ may return any of the intrinsic variable types described in Chapter 2. For example,\
    \ a function might return a double or a char. If a function returns no value,\
    \ the return type of the function is void.\n\n![](img/c6a7aed193f785f4098546695e53f585_109_1.png)\n\
    \nA function may be labeled by its return type — for example, a function that\
    \ returns an int is often known as an integer function. A function that returns\
    \ no value is known as a void function.\n\nFor example, the following void function\
    \ performs an operation but returns no value:\n\n```\nvoid echoSquare() {\n  \
    \  int value;\n    cout << \"Enter a value:\";\n    cin >> value;\n    cout <<\
    \ \"\\nThe square is: \" << (value * value) << \"\\n\";\n    return;\n}\n```\n\
    \nControl begins at the open brace and continues to the return statement. The\
    \ return statement in a void function is not followed by a value. The return statement\
    \ in a void function is optional. If it isn't present, execution returns to the\
    \ calling function when control encounters the close brace.\n\n# Understanding\
    \ functions with arguments\n\nFunctions without arguments are of limited use because\
    \ the communication from such functions is one-way — through the return value.\
    \ Two-way communication is through function arguments."
