  md: '# 392 Part V: Security


    Figure 28-4 shows the situation immediately after a successful return from getString().
    The small arrow in the disassembly shows that the pointer is pointing to the instruction
    immediately after the CALL and the ESP has returned to its value of 0x0028FDC0.


    That''s very nice, but so what? Well, C++ also stores defined variables on the
    stack. For example, the 64-byte buffer in getString() is stored on the stack.
    As the program writes only 64 bytes (or less) than buffer, everything is fine;
    but if the program tries to write more data into buffer than it can hold, the
    remaining data spills over and overwrites other data. If the program writes enough
