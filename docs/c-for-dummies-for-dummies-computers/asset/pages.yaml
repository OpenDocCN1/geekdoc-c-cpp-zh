    # Be careful performing logical operations on floating-point variables


    Round-off errors in floating-point computation can create havoc with logical operations.
    Consider the following example:


    ```

    float f1 = 10.0;

    float f2 = f1 / 3;

    bool b1 = (f1 == (f2 * 3.0)); // are these two equal?

    ```


    Even though it''s true to use that f1 is equal to f2 times 3, the resulting value
    of b1 is not necessarily true. A floating-point variable cannot hold an unlimited
    number of significant digits. Thus, $f2$ is not equal to the number we''d call
    "three-and-a-third," but rather to 3.3333..., stopping after some decimal places.'
