  md: "# Chapter 13: Point and Stare at Objects 201\n\n# When memory is allocated\
    \ for you\n\nMany classes (particularly the containers described in Chapter 27)\
    \ manage heap memory for you. For example, the string class maintains a character\
    \ string in memory that it allocates off of the heap. The authors of these classes\
    \ are careful to return heap memory in all the right places so that it's safe\
    \ to write a function like the following:\n\n```\nstring myFunc() {\n  string\
    \ localString;\n  localString << cin;\n  return localString;\n}\n```\n\nThe object\
    \ localString allocates heap memory when it is created carefully returns said\
    \ memory when it goes out of scope at the end of the function. (You will see in\
    \ Chapters 16 and 17 how this magic is performed.)\n\n# Linking Up with Linked\
    \ Lists\n\nThe second most common structure after the array is called a list.\
    \ Lists come in different sizes and types; however, the most common one is the\
    \ linked list. In linked list, each object points to the next member in a sort\
    \ of chain that extends through memory. The program can simply point the last\
    \ element in the list to add it to the list. This means that the user doesn't\
    \ to declare the size of the linked list at the beginning of the program — you\
    \ can add and remove objects from the list by unlinking them. In addition, you\
    \ can change the members of a linked list — without moving data objects — by changing\
    \ the links.\n\nThe cost of such flexibility is speed of access. You can just\
    \ reach in and grab the tenth element, for example, like you would in the case\
    \ of an array. Instead, you have to start at the beginning of the list and link\
    \ ten times one to the next.\n\nA linked list has one feature besides its runtime\
    \ expandability (that's good) and its difficulty in accessing an object at random\
    \ (that's bad): A linked makes significant use of pointers. This makes linked\
    \ lists a great tool for giving you experience manipulating pointer variables\
    \ (that's very good).\n\n![](img/c6a7aed193f785f4098546695e53f585_216_0.png)\n\
    \nThe C++ standard library offers a number of different types of lists. You can\
    \ see them in action in Chapter 27; however, it's always good to implement your\
    \ first linked list yourself to get practice in manipulating pointers."
  merge: -1
