  md: "# Creating Shallow Copies\nIs a Deep Problem\n\nNo matter what anyone may think\
    \ of operator overloading, you'll need to overload the assignment operator for\
    \ many classes that you generate. C++ provides a default definition for operator=()\
    \ for all classes. This default definition performs a member-by-member copy. This\
    \ works great for an intrinsic type like an int where the only \"member\" is the\
    \ integer value.\n\n```\nint i;\ni = 10; // \"member by member\" copy\n```\n\n\
    This same default definition is applied to user-defined classes. In the following\
    \ example, each member of source is copied over the corresponding destination:\n\
    \n```\nvoid fn() {\n    MyStruct source, destination;\n    destination = source;\n\
    }\n```\n\nThe assignment operator works for most classes; however, it is not correct\
    \ for classes that allocate resources, such as heap memory. The programmer must\
    \ overload operator= to handle the transfer of resources.\n\nThe assignment operator\
    \ is much like the copy constructor (see Chapter 17). In, the two look identical:\n\
    \n```\nvoid fn(MyClass& mc) {\n    MyClass newMC(mc); //of course, this uses the\n\
    \                      //copy constructor\n    MyClass newerMC = mc;//less obvious,\
    \ this also invokes\n                         //the copy constructor\n    MyClass\
    \ newestMC; //this creates a default object\n    newestMC = mc; //and then overwrites\
    \ it with\n                   //the argument passed\n}\n```\n\nThe creation of\
    \ newerMC follows the standard pattern of creating a new object as a mirror image\
    \ of the original using the copy constructor MyClass(const MyClass&). Not so obvious\
    \ is that newerMC is also created using the copy constructor. MyClass a = b is\
    \ just another way of writing MyClass a(b) — in particular, this declaration does\
    \ not involve the assignment operator despite its appearance. However, newestMC\
    \ is created using the default constructor and overwritten by mc using the assignment\
    \ operator."
