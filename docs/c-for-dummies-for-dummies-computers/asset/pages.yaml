    | == | Equality; true if the left-hand argument has the same value as the right
    |

    | != | Inequality; opposite of equality |

    | >, < | Greater than, less than; true if the left-hand argument is greater than
    or less than the right-hand argument |

    | >=, <= | Greater or equal to, less or equal to; true if either > or == is true,
    or < or == is true |

    | AND | AND; true if both the left- and right-hand arguments are true |

    | OR | OR; true if either the left- or right-hand argument is true |

    | ! | NOT; true if its argument is false; otherwise, false |


    The six entries in Table 4-1 are comparison operators. The equality operator is
    used to compare two numbers. For example, the following is true if the value of
    n is 0, and false if is otherwise:


    ```

    n = 0;

