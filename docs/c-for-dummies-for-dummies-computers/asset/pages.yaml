  md: "# 420 Part VI: The Part of Tens\n\nThis is just an example. Every program will\
    \ need some type of log function. Whether or not it's actually called log() is\
    \ immaterial.\n\nThis call writes the string User extended legal password, where\
    \ .xxx is replaced by the name contained in the variable sUser to the log file\
    \ when the system is in Debug mode. When the program is not in Debug mode, this\
    \ call does nothing—this is to avoid a performance penalty for logging too much\
    \ information when everything is going smoothly.\n\nSystem logs usually support\
    \ anywhere up to two levels of severity that dictate whether log messages get\
    \ written out or not. There are some failures that are always written to the log\
    \ file:\n\n```\nif (validate(sUser, sPassword)) == true {\n  log(DEBUG, \"User\
    \ %s entered legal password\", sUser);\n} else {\n  log(ALWAYS, \"User %s entered\
    \ illegal password\", sUser);\n}\n```\n\nThe program logs a valid user password\
    \ only when the system is in Debug mode, but it logs an invalid user password\
    \ just in case this represents an attempt by someone to break into the system\
    \ by guessing passwords.\n\nLog files must be maintained. Generally, that running\
    \ a job at midnight or some other time of decreased usage closes the current log\
    \ file, moves it into a separate directory with the day's date, and opens a new\
    \ file. This keeps a single log file from getting too big and unwieldy. It makes\
    \ it lot easier to go back to log files to find a particular event.\n\nIn addition,\
    \ reviewing log files is a boring, thankless, and therefore error-prone job. This\
    \ is a job best performed by computers. Most systems have special programs that\
    \ scan the log file for anomalies that may indicate a problem. For example, one\
    \ or two invalid passwords per hour is probably nothing to worry about—fat-fingering\
    \ passwords all the time. A few thousand invalid passwords in an hour is probably\
    \ worth getting excited about. This might be an attempt at forced entry by brute-force\
    \ guessing a password.\n\nAn For Dummies book could be written on this topic log\
    \ file maintenance. There is more to this topic than I can cover here. Log files\
    \ must be backed up daily and cleaned out periodically lest they grow forever.\
    \ In addition, someone or some program needs to monitor these logs to detect problems\
    \ such as repeated attempts to guess someone's password."
