  md: "# 132 Part II: Becoming a Functional C++ Programmer\n\nThe function main()\
    \ immediately invokes parent(). The first thing that the processor sees in parent()\
    \ is the declaration of intParent. At that point, intParent goes into scope —\
    \ that is, intParent is defined and available for the remainder of the function().\n\
    \nThe second statement in parent() is the call to child(). Once again, the function\
    \ child() declares a local variable, this intChild. The scope of the variable\
    \ intChild is limited to the scope of child(). Technically, intParent is not defined\
    \ within the scope of child() because child() doesn't have access to intParent;\
    \ however, the variable intParent continues to exist while child() is executing.\n\
    \nWhen child() exits, the variable intChild goes out of scope. Not is it longer\
    \ accessible, it no longer exists (The memory occupied by intChild is returned\
    \ to the pool to be used for other things).\n\nAs parent() continues executing,\
    \ the variable intLater goes into scope at the declaration. The point that parent()\
    \ returns to main(), both intParent and intLater go out of scope.\n\nBecause intGlobal\
    \ is declared globally in this example, it is available to all three functions\
    \ and remains available for the life of the program.\n\n# Examining the scope\
    \ problem\n\nThe following code segment compiles without error but doesn't work\
    \ (don't you hate that?)\n\n```\ndouble* child(void)\n{\n    double dLocalVariable;\n\
    \    return &dLocalVariable;\n}\n\nvoid* parent(void)\n{\n    double* pdLocal;\n\
    \    pdLocal = child();\n    *pdLocal = 1.0;\n}\n```\n\nThe problem with this\
    \ function is that dLocalVariable is defined only within the scope of the function\
    \ child(). Thus, by the time the memory address of dLocalVariable is returned\
    \ from child(), it refers to a variable that no longer exists. The memory that\
    \ dLocalVariable formerly occupied is probably used for something else."
