  md: "# Chapter 6: Creating Functions 103\n\nYou may be surprised to find out that\
    \ this example prints out n = 1.\n\nLet's go through the example one step at a\
    \ time:\n\n+   1. The main program declares the variable n and initializes it\
    \ to 1.\n2. The program passes the value of n (1) to the function multiplyByTwo\
    \ and calls m.\n3. The function multiplies the value passed by it and stores the\
    \ result in the local variable\n4. multiplyByTwo() discards m upon returning.\n\
    5. The main program displays the unchanged value of n (1).\n\n![](img/c6a7aed193f785f4098546695e53f585_118_0.png)\n\
    \nThis is called pass value — the alternative is called by reference.\n\nYou can\
    \ tell C++ that you want to not pass the value of a variable but a reference to\
    \ it by adding an ampersand (&) to the type, as in the following snippet:\n\n\
    ```\nvoid multiplyByTwo(int& m) // referential argument\n  m *= 2;\n}\n\nint n\
    \ = 1;\nmultiplyByTwo(n);\n\ncout << \"n = \" << n << endl;\n```\n\nThis example\
    \ does the following:\n\n+   1. The main program declares the variable n and initializes\
    \ it to 1.\n2. The program passes a reference to n to the function multiplyByTwo\
    \ which calls that m.\n3. The function multiplies the two value referred by m\
    \ and saves the results back into the variable referred by m (in other words,\
    \ the variable n).\n4. The main program displays the changed value of n (2).\n\
    \n![](img/c6a7aed193f785f4098546695e53f585_118_1.png)\n\nArrays (which I introduce\
    \ in the next chapter) are always passed by reference for reasons that I will\
    \ explain in Chapter 8.\n\nI will have a lot more to say about reference arguments\
    \ in Chapter 8."
