  md: '# Chapter 30: Ten Ways to Protect Your Programs from Hackers


    laced with malware. Most download Web sites are pretty careful about checking
    applications for malware. Another approach is to calculate a secure checksum and
    include it with the download file. The user can then recalculate checksum on the
    file he downloads. If the number calculates doesn''t match the number that you
    uploaded, the executable file may been tampered with and the user shouldn''t install
    the program. Although this approach is secure, very few users bother.


    # Authenticate Users Securely


    User authentication should be straightforward: The user provides an account name
    and a password, and your program looks the account name in a table and compares
    the passwords. If the password matches, the user is authenticated. But when it
    comes to antihacking, nothing is simple.


    First, never store the passwords themselves in the database. This is called storing
    them in the clear and is considered very bad form. It is far too easy for a hacker
    to get his hands on the password file. Instead, save a secure transform of the
    password.


    This is known as a secure hash, and there are several algorithms defined; the
    most common are MD5, SHA1, and SHA256. All of these hash functions share common
    properties: It is very unlikely that two passwords will generate the same hash
    value, it is virtually impossible to figure out the original password from the
    hashed value, and even a small change in the password results in a wildly different
    hash.


    ![](img/c6a7aed193f785f4098546695e53f585_438_0.png)


    Unfortunately no hash function is included in the standard C++ library, but there
    are standard implementations of the most common algorithms in open source libraries.
    In addition, the algorithms, with sample code for each, is available on Wikipedia.


    In practice, these hash functions work as follows:


    +   1. The user creates a password when he registers with the application.

    2. The application appends a random string (known as a salt) to either the front
    or the end of the password the user enters.

    3. The application runs the resulting through one of the secure hash algorithms.


    For example, the SHA256 algorithm generates a 64-digit hexadecimalnumber (256-bit)
    result. The application stores this result and the salt string in a database table
    along with the user''s name.'
  merge: -1
