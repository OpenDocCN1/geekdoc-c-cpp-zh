    Given the relative simplicity of the NoBufferOverflow3 compared with the other
    two, why wouldn''t a programmer always use the string class and its associated
    functions? In a way, the answer is, "You should." But you need to keep in mind
    that internally this program is bit as complicated as the vector-based NoBufferOverflow2
    version. The getline() function is calling a variable-size container as vector
    for you. Even though you may not be making all these extra calls, the calls are
    being made, and the performance of the function reflects that. The versions of
    getString() that rely on fixed-size buffers are considerably faster than those
    that use variable-size structures.'
