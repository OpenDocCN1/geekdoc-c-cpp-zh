  md: "# Chapter 16: Making Constructive Arguments 231\n\n```\nStudent() : Student(\"\
    No Name\", 0, 0.0) {\nStudent(const char *pName) : Student(pName, 0, 0.0) {\n\n\
    protected:\n  string name;\n  int semesterHours;\n  double gpa;\n//...rest is\
    \ the same as before...\n```\n\nThe declaration Student noName invokes the no\
    \ constructor which turns around and calls the generic constructor, providing\
    \ default arguments. The Student freshman declaration invokes the Student(const\
    \ char*)\n\nThis is more flexible because you can default arguments other than\
    \ the last one. In addition, you have more control over how arguments are defaulted.\
    \ For example, it makes no sense to construct a student with semester hours but\
    \ no GPA. This version would not allow such an object to be constructed since\
    \ Student(const char*, int) is provided.\n\n![](img/c6a7aed193f785f4098546695e53f585_246_0.png)\n\
    \n> TIP The somewhat bizarre syntax will seem a lot more reasonable by the time\
    \ you reach the end of this chapter.\n\n# Defaulting Default Constructors\n\n\
    As far as C++ is concerned, every class must have a constructor; otherwise, you\
    \ can't create objects of that class. If you don't provide a constructor for your\
    \ class, C++ should probably generate an error, but it doesn't. To provide compatibility\
    \ with existing C, which knows nothing about constructors, C++ automatically provides\
    \ a default constructor (sort of a default constructor).\n\nIf you define a constructor\
    \ for your class, C++ doesn't provide the automatic default constructor on its\
    \ own. By creating a constructor, the author is in telling C++ that the default\
    \ constructor is not good enough.\n\nThe following code snippets help demonstrate\
    \ this point. This is legal:\n\n```\nclass Student {\n  string name;\n}\n\nint\
    \ main(int argcs, char* pArgs[])\n```"
