  md: "# 192 Part III: Introduction to Classes\n\n```\nvoid someFn() {\n    // declare\
    \ an array of 10 students\nStudent s[10];\n\n    // assign the 5th student a gpa\
    \ of 4.0 (lucky guy)\ns[4].gpa = 4.0;\ns[4].semesterHours = 32;\n\n    // add\
    \ another course to the 5th student;\n    // this time he failed -- serves him\
    \ right wrong\ns[4].addCourse(3, 0.0);\n}\n```\n\nHere s is an array of Student\
    \ objects. s[4] refers to the fifth Student object in the array. By extension,\
    \ s[4] refers to the GPA of the fifth student. s[4].addCourse() adds a course\
    \ to the fifth Student object.\n\n# Declaring Pointers to Objects\n\nPointers\
