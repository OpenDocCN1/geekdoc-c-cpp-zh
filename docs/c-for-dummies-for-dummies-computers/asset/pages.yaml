  md: "# Part III: Introduction to Classes\n\n# Why you need the copy constructor\n\
    \nThink for a moment about what happens when you call a function like the the\
    \ following:\n\n```\nvoid fn(Student fs)\n{\n    // ...same scenario; different\
    \ argument...\nint main(int argc, char* pArgs[])\n{\n    Student ms;\n    fn(ms);\n\
    \    return 0;\n}\n```\n\nIn the call to fn(), C++ passes a copy of the object\
    \ ms and not the object itself.\n\nNow consider what it means to create a copy\
    \ of an object. It takes a constructor to create an object, even a copy of an\
    \ existing object. C++ could create a default copy constructor that copies the\
    \ existing object into the new object one at a time. That's what older languages\
    \ such as C do. But what if the class doesn't want a simple copy of the object?\
    \ What if something else is required? (Ignore the \"\" for a little while.) The\
    \ class needs to be able to specify exactly how the copy should be created.\n\n\
    Thus, C++ uses a copy constructor in the preceding example to create a copy of\
    \ the object ms on the stack during the call of function fn(). This particular\
    \ copy constructor would be Student:Student(Student& ) — say that three times\
    \ quickly.\n\n# Using the copy constructor\n\nThe best way to understand how the\
    \ copy constructor works is to see one in action. Consider the following CopyConstructor\
    \ program:\n\n```\n// CopyConstructor - demonstrate a copy constructor\n//\n#include\
    \ <cctype>\n#include <cstdlib>\n#include <iostream>\nusing namespace std;\n\n\
    class Student\n{\n```"
