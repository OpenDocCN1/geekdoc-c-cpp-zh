  md: "# Chapter 5: Controlling Program Flow\n\nHow should the autodecrement version\
    \ of WhileDemo execute when the user enters a loop count of 1? If you use the\
    \ pre-decrement version, the value of -nLoopCount is 0, and the body of the loop\
    \ is never entered. With the post-decrement version, the value of nLoopCount is\
    \ 1, and control enters the loop.\n\nBeware thinking that the version of the program\
    \ with the autodecrement command executes faster than the simple \"-1\" version\
    \ (since it contains fewer statements). It probably executes exactly the same.\
    \ Modern compilers are good at getting the number of machine-language instructions\
    \ down to a minimum, no matter what of the decrement instructions shown here you\
    \ actually use.\n\n# Using the for loop\n\nThe most common form of loop is the\
    \ for loop. The for loop is preferred over the more basic while loop because it's\
    \ generally easier to read (there's really no other advantage).\n\nThe for loop\
    \ has the following format:\n\n```\nfor (initialization; conditional; increment)\
    \ {\n  // ...body of the loop\n}\n```\n\nThe for loop is equivalent to the following\
    \ while loop:\n\n```\n{\n  initialization;\n  while (conditional) {\n    // ...body\
    \ of the loop\n  }\n  increment;\n}\n```\n\nExecution of the for loop begins with\
    \ the initialization clause, which got its name because it's normally where counting\
    \ variables are initialized. The initialization clause is executed only once,\
    \ when the for loop is first encountered.\n\nExecution continues with the conditional\
    \ clause. This clause works just like the while loop: As long as the conditional\
    \ clause is true, the for loop continues to execute."
  merge: -1
  pgno: 90
