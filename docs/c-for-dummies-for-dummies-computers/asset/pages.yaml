  md: "# Chapter 16\n\n# Making Constructive Arguments\n\nIn This Chapter\n\n+   -\
    \ Making argumentative constructors\n- Overloading the constructor\n- Creating\
    \ objects by using constructors\n- Invoking member constructors\n- Constructing\
    \ the order of construction and destruction\n\nA class represents a type of object\
    \ in the real world. For example, in earlier chapters, I use the Student to represent\
    \ the properties of a student. Just like students, classes are autonomous. Unlike\
    \ a student, a class is responsible for its own care and feeding — a class must\
    \ keep itself in a valid state at all times.\n\nThe default constructor presented\
    \ in Chapter 15 isn't always enough. For example, a default constructor can initialize\
    \ the student ID to 0 so that it doesn't contain a random value; however, a Student\
    \ ID of 0 is probably not valid.\n\nC++ programmers require a constructor that\
    \ accepts some type of argument to initialize an object to other than its default\
    \ value. This chapter examines constructors with arguments.\n\n# Outfitting Constructors\
    \ with Arguments\n\nC++ enables programmers to define a constructor with arguments,\
    \ as shown here:\n\n```\nclass Student\n{\npublic:\n    Student(const char *pName);\n\
    \n    // ...class continues...\n};\n```"
