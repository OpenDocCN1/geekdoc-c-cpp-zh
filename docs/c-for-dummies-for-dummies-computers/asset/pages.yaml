    # How does a call stack up?


    This entire section is fairly technical. You can skip it if you’re not into the
    details of computer memory.


    Consider how computer memory is laid out: There are variables known as global
    variables that are accessible to all functions. These variables reside at fixed
    memory locations so that everyone can find them. But most variables


    ![](img/c6a7aed193f785f4098546695e53f585_404_1.png)'
  merge: -1
  pgno: 404
- img_proc: true
  md: '# 390 Part V: Security


    are declared within the scope of a single function. The memory for these variables
    is allocated when the function is called and deallocated when the function returns.
    Computers do this through a mechanism known as the stack.


    The stack pointer (in assembly language normally carries the name ESP) points
    to the next available location on the stack. A function can invoke a PUSH instruction
    to save a value in a register on the stack. This automatically decrements the
    ESP so that the memory isn''t used for something else. A corresponding POP instruction
    returns the value to the register and increments the ESP back to its pre-PUSH
    location.


    Another value that gets pushed onto the stack is the return address after every
    function is called. The 0x8E86 instruction pushes the next address onto the stack
    and jumps to the address of the getString() function. This is shown graphically
    as by using interesting capture from the Code:Debugger in Figure 28.


    ![](img/c6a7aed193f785f4098546695e53f585_405_0.png)


    Figure 28: The ESP and the stack memory immediately before the call to getString().'
