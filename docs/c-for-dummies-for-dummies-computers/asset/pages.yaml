  md: '# Chapter 30: Ten Ways to Protect Your Programs from Hackers 425


    Once you''ve authenticated a user, your application should assign that user a
    role that specifies the types of things that he is allowed to do in the application.
    Consider a weekly status report application. A normal user should only be able
    to edit entries that he creates. He may or not be able to read other users'' entries.
    A person assigned the role of supervisor may be able to edit other users'' entries.
    Only the few users assigned the role of administrators should be able to edit
    the tables, register new users, or change the rules of other users.


    By keeping the number of administrators to a minimum, you reduce the number of
    vulnerabilities that your application exposes. For example, if a hacker breaks
    into a normal user''s account, he can do more than edit that user''s information.
    But certainly not a disaster.


    And, finally, your application should keep statistics on user log-ins. You should
    consider deactivating the accounts of users that haven''t used the system in a
    long time. In addition, the application should react automatically to attempts
    to log in with the wrong password by either permanently, or at least temporarily,
    locking out the account. This will make it much difficult for a computer on the
    other end of a connection to run through thousands or millions of possible passwords
    attempting to brute-force guess.


    # Manage Remote Sessions


    You can make certain assumptions when all of your application runs on a single
    computer. For one thing, the user has authenticated, you don''t need to worry
    about him being transformed into a different person (unless your application is
    intended to run at Hogwarts Academy of Witchcraft and Wizardry). Applications
    that communicate with a remote server can''t make this assumption — a hacker who
    is listening on the line can wait until the user authenticates himself and hijack
    the session.


    What can the security-minded programmer do to avoid this situation? You don''t
    want to repeatedly ask the user for his password just to make sure that the connection
    hasn''t been hijacked. The alternative solution is to establish and maintain a
    session. You do this by having the server sending the remote application cookie
    once the user has successfully authenticated.


    The term cookie is not very descriptive. It is actually a string of digits or
    characters. A cookie can be a file on the hard disk, or it can be held in RAM.
    Session cookies are generally held in RAM for extra security. Modern browsers
    include support for cookies.


    A cookie may include information such as a hash of the user''s password and the
    time that the session started. The server periodically challenges the remote application
    for a copy of the cookie. As long


