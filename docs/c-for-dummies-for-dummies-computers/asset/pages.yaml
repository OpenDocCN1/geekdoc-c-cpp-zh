  md: "# Overloading Function Names\n\nC++ must have a way of telling functions apart.\
    \ Thus, two functions cannot share the same name and argument list, known as the\
    \ extended name or the signature. The following extended function names are all\
    \ different and can reside in the same program:\n\n```\nvoid someFunction(void)\n\
    {\n    // ...perform some function\n}\nvoid someFunction(int n)\n{\n    // ...perform\
    \ some different function\n}\nvoid someFunction(double d)\n{\n    // ...perform\
    \ very different function\n}\nvoid someFunction(int n1, int n2)\n{\n    // ...do\
    \ something different yet\n}\n```\n\nC++ knows that the functions someFunction(void),\
    \ someFunction(int), someFunction(double), and someFunction(int, int) are not\
    \ the same.\n\nThis multiple use of names is known as function overloading.\n\n\
    Programmers often refer to functions by their shorthand name, which is the name\
    \ of the function without its arguments, such as someFunction(), in the same way\
    \ that they the shorthand name Stephen (actually, my nickname is Randy, but work\
    \ with me on this). But if there's any doubt, I can be differentiated from other\
