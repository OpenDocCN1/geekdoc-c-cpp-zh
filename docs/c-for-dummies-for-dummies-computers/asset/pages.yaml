  md: '# Chapter 19


    # Inheriting a Class


    In This Chapter


    +   - Defining inheritance

    - Inheriting a base class

    - Constructing the base class

    - Exploring meaningful relationships: The IS_A versus the HAS_A relationship


    This chapter discusses inheritance, the ability of one class to inherit capabilities
    or properties from another class.


    Inheritance is a common concept. I am a human (except when I first wake up in
    the morning). I inherit certain properties from the class Human, such as my ability
    to converse (more or less) intelligently and my dependence on air, water, and
    carbohydrate-based nourishment (a little too dependent on the latter, I''m afraid).
    These properties are not unique to humans. The class Human inherits the dependencies
    on air, water, and nourishment from the class Animal.


    The capability of passing down properties is a powerful one. It enables you to
    describe things in an economical way. For example, if my son asks, "What a duck?"
    says, "It''s a bird that goes quack." Despite what you may think, that answer
    conveys a considerable amount of information. He knows what a bird is, and he
    knows all those things about a duck plus the duck''s additional property of "quackness."
    (Refer to Chapter 11 for a further discussion of this and other observations.)


    Object-oriented (OO) languages express this relationship by allowing one class
    to inherit from another. OO languages can generate a model that''s closer to the
    real world (remember that real-world stuff!) than the model generated by languages
    that don''t support inheritance.'
