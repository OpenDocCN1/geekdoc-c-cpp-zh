    it:


    +   1. Enter the following commands from a command prompt:


    ```

    sudo apt-get update

    sudo apt-get upgrade

    sudo apt-get install g++

    ```


    The standard Ubuntu Linux distribution includes a GNU C++ compiler, but it does
    not include the C++ extensions and, in particular, not the C++ 2011 standard extensions.
    The first two commands update and upgrade the tools you already have. The third
    command installs C++.


    +   2. Enter the following command from a command prompt:


    ```

    gcc --version

    ```


    Your Ubuntu 13.04 downloaded GNU C++ version 4.7.3. You''ll be fine with version
    4.7.1 or later. If you have an earlier version, some of the C++ 2011 features
    may not work properly, otherwise, it should be okay.'
