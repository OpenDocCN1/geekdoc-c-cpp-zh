  md: '# 366 Part V: Security


    Second, a class template does not consume memory. Therefore, there is no penalty
    for creating class templates if they are never instantiated. On the other hand,
    a class template uses memory every time it is instantiated (except as noted in
    the next section). Thus, the code for Array<Student> consumes memory even if Array<int>
    already exists.


    Finally, a class template cannot be compiled and checked for errors until it is
    converted into a real class. Thus, a program that references the class template
    Array<T> might compile even though Array<T> contains obvious syntax errors. The
    errors will not appear until a class such as Array<int> is created.


    # External Template Instantiations


    ![](img/c6a7aed193f785f4098546695e53f585_381_0.png)


    The TemplateVector example program instantiated TemplateVector twice: once for
    integers and for Name objects. Once instantiated, other functions within main.cpp
    could refer to TemplateVector-int- without incurring any penalty. Suppose that
    my program included a second module; say, secondModule.cpp. Now suppose secondModule.cpp
    also used some of TemplateVector-int-. This module would instantiate its own copy
    of TemplateVector. For large programs, meaning recompiling dozens of copies of
    the same code could mean a lot of overhead both in compile time and in the size
    of the result code.


    The 2011 standard adds the keyword extern to avoid this overhead. In this example,
    the programmer would include the following declaration somewhere near the beginning
    of secondModule.cpp.


    ```

    extern template class TemplateVector<int>;

    ```


    This says, "don''t instantiate another copy of TemplateVector-int> because some
    other module has already instantiated one that you can use.


