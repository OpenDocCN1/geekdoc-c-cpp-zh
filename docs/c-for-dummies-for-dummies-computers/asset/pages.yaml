    operator (=). Not only is this a common mistake, but it''s a mistake that the
    C++ compiler cannot catch—that makes it twice as bad. The following statement
    does not initialize n to 0; it compares the current value of n with 0 and then
    does nothing with the results of that comparison:


    ```

    n == 0; // programmer meant to say n = 0

    ```'
