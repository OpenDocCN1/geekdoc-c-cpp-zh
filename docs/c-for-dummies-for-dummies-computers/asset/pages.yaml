    # Short circuits and C++


    The logical && and logical OR || operators perform what is called short-circuit
    evaluation. Consider the following:


    ```

    condition1 && condition2

    ```


    If condition1 is not true, the overall result is not true, no matter what the
    value of condition2 is.(For example, condition2 could be true or false without
    changing the result.) The same situation occurs in the following:


    ```

    condition1 || condition2

    ```


    If condition1 is true, the result is true, no matter what the value of condition2
    is.


    To save time, C++ doesn''t evaluate condition2 if it doesn''t need to. For example,
    in the expression condition1 && condition2, C++ doesn''t evaluate condition1 if
    condition1 is false. Likewise, in the expression condition1 || condition2, C++
    doesn''t evaluate condition2 if condition1 is true. This is known as short-circuit
    evaluation.'
