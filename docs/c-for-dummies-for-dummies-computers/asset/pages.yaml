  md: "# 74 Part I: Getting Started with C++ Programming\n\n# Using the autoincrement/autodecrement\
    \ feature\n\nProgrammers very often use the autoincrement ++ or the autodecrement\
    \ -- operators with loops that count something. Notice from the following snippet\
    \ extracted from the WhileDemo example that the program decrements the loop count\
    \ by using assignment and subtraction statements, like this:\n\n```\n// now loop\
    \ that many times\nwhile (nLoopCount > 0)\n{\n    nLoopCount = nLoopCount - 1;\n\
    \    cout << \"Only \" << nLoopCount\n    << \" loops to go\" << endl;\n}\n```\n\
    \nA more compact version uses the autodecrement feature, which does what you might\
    \ imagine:\n\n```\nwhile (nLoopCount > 0)\n{\n    nLoopCount--;\n    cout << \"\
    Only \" << nLoopCount\n    << \" loops to go\" << endl;\n}\n```\n\nThe logic in\
    \ this version is the same as in the original. The only difference is the way\
    \ that nLoopCount is decremented.\n\nBecause the autodecrement decrements its\
    \ argument and returns its value, the decrement operation can be combined with\
    \ the while loop. In particular, the following version is the smallest yet:\n\n\
    ```\nwhile (nLoopCount-- > 0)\n{\n    cout << \"Only \" << nLoopCount\n    <<\
    \ \" loops to go\" << endl;\n}\n```\n\nBelieve it or not, nLoopCount-- > 0 is\
    \ the version that many C++ programmers would use. It's not that C++ programmers\
    \ like being cute (although they do). In fact, the more compact version (which\
    \ embeds the autoincrement or autodecrement feature in the logical comparison)\
    \ is easier to read, especially as you gain experience.\n\nBoth nLoopCount-- and\
    \ -nLoopCount expressions decrement nLoopCount. The former expression, however,\
    \ returns the value of nLoopCount before being decremented, the latter expression\
    \ does so after being decremented.\n\n![](img/c6a7aed193f785f4098546695e53f585_89_0.png)"
