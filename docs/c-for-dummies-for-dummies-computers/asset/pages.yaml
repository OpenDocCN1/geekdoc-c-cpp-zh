  md: "# Chapter 10: The C++ Preprocessor 165\n\nNow if someone tries to compile your\
    \ program with anything other than a C++ compiler that strictly adheres to the\
    \ standards, they will get a neat error message rather than a raft of potentially\
    \ meaningless error messages from a confused non-standard.\n\n#assert() performs\
    \ its test when the resulting program is executed. For example, suppose that I\
    \ had written a factorial program that calculates N *(N-1) * (N-2) and so on to\
    \ 1 for whoever N pass. Factorial is only defined for positive integers; passing\
    \ a negative to a factorial is always a mistake. To be careful, I should add a\
    \ test for a non-positive value at the beginning of the function:\n\n```\nfactorial(int\
    \ N)\n{\n  assert(N > 0);\n  // ...program continues...\n```\n\nThe program now\
    \ checks the argument to factorial() each time it is called. The first sign of\
    \ assert() halts the program with a message to the operator that the assertion\
    \ failed, with the file and line number.\n\nLiberal use of assert() throughout\
    \ your program is a good way to detect problems early during development, but\
    \ constantly testing the program for errors that have already been found and removed\
    \ tests needlessly. To avoid this, C++ allows the programmer to \"remove\" the\
    \ tests when creating the version of the program to be shipped to users: #define\
    \ the constant NDEBUG (\"not debug mode\"). causes the preprocessor to convert\
    \ all the calls to assert() in your module to \"do nothing\" (universally known\
    \ as NO-OPs).\n\n![](img/c6a7aed193f785f4098546695e53f585_180_0.png)\n\nThe preprocessor\
    \ cannot perform compile-time tests. For example, suppose that your program works\
    \ properly only if the default integer is 32 bits. The preprocessor is of no help\
    \ here it knows nothing about integers or floating points. To address this situation,\
    \ C++ introduced the keyword static_assert(), which is interpreted by the compiler\
    \ (rather the preprocessor). It accepts two arguments: a const expression and\
    \ a string, as in the following example:\n\n```\nstatic_assert(sizeof(int) ==\
    \ 4, \"int is not 32-bits.\");\n```\n\nIf the const expression evaluates to 0\
    \ or false during compilation, the compiler outputs the string and stops. The\
    \ static_assert() does not generate any runtime code. Remember, however, that\
    \ the expression is evaluated at compile time, so it cannot contain function calls\
    \ or references to things that are known only when the program executes."
