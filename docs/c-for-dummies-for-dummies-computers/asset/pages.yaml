    The bitwise operators are used much like any other binary arithmetic operators.
    The NOT operator is the easiest to understand. To NOT a bit that makes up a number
    (and to a programmer, makes perfect sense — honest). Consider this example:


    ```

    0110₂ (0x6)

    1001₂ (0x9)

    ```


    Thus we say that *0x6* equals *0x9* (pronounced “NOT 6 equals 9”).


    The following calculation demonstrates the & operator:


    ```

    0110₂

    &

    0011₂

    0010₂

    ```


    Beginning with the most significant bit, 0 AND 0 is 0. In the next bit, 1 AND
    0 is 0. In bit 3, 1 AND 1 is 1. In the least significant bit, 0 AND 1 is 0. Expressed
    in hexadecimal, the same expression appears as follows:


    ```

    0x6 0110₂

    & &

    0x3 0011₂

    0x2 0010₂

    ```


    In shorthand, we say that *0x6* & *0x3* equals *0x2* (pronounced “6 AND 3 equals
    2”)'
