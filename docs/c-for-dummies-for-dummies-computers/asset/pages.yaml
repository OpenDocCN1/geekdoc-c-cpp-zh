  md: "# Chapter 14: Protecting Members: Do Not Disturb 211\n\n# Using a class with\
    \ a limited interface\n\nA class provides a limited interface. To use a class,\
    \ you need to know only its public members as well as what they do and their arguments.\
    \ This can drastically reduce the number of things you need to master and remember\
    \ to use the class.\n\nAs conditions change or as bugs are found, you want be\
    \ be change the internal workings of a class. Changes to those details are less\
    \ likely to require changes in the external application code if you can find the\
    \ internal workings of the class.\n\nA second, perhaps more important, reason\
    \ lies in the limited ability of humans (I can't speak for dogs and cats) to keep\
    \ a large number of things in their minds at any given instant. Using a strictly\
    \ defined class interface allows the programmer to forget the details that go\
    \ behind it. Likewise, a programmer building the class need not concentrate to\
    \ the same degree on exactly each of the functions is being used.\n\n# Giving\
    \ Non-member Functions Access to Protected Members\n\nOccasionally, you want a\
    \ non-member function to have access to the protected members of a class. You\
    \ do so by declaring the function to be a friend of the class by using the keyword\
    \ *friend*.\n\nThe friend declaration appears in the class that contains the protected\
    \ member. The friend declaration is a prototype declaration that it includes the\
    \ extended name and the return type. In the following, the function initialize()\
    \ can now access anything it wants in *Student*:\n\n```\nclass Student {\n   \
    \ public:\n        friend void initialize(Student*);\n        // same public members\
    \ as before...\n        int semesterHours; // hours earned toward graduation\n\
    \        double gpa;\n        // the following function is a friend of Student\n\
    \        // so it can access the protected members\n        void initialize(Student*\
    \ pS) {\n            pS->gpa = 0; // this is now legal...\n            pS->semesterHours\
    \ = 0; // ...when it wasn't before\n        }\n}\n```"
  merge: -1
  pgno: 226
- img_proc: true
  md: "# 212 Part III: Introduction to Classes\n\nA single function can be declared\
    \ a friend of two classes at the same time. Although this can be convenient, it\
    \ tends to bind the two classes together. This binding of classes is normally\
    \ considered bad because it makes one class dependent on the other. If the two\
    \ classes naturally belong together, it's not all bad, as shown here:\n\n```\n\
    class Student; // forward declaration\nclass Teacher\n{\n    friend void registration(Teacher&\
    \ t, Student& s);\npublic:\n    void assignGrades();\nprotected:\n    int noStudents;\n\
    \    Student *pList[100];\n};\nclass Student\n{\n    friend void registration(Teacher&\
    \ t, Student& s);\npublic:\n    // same public members as before...\nprotected:\n\
    \    Teacher *pT;\n    int semesterHours; // hours earned toward graduation\n\
    \    double gpa;\n};\nvoid registration(Teacher& t, Student& s)\n{\n    // initialize\
    \ the Student object\n    s.semesterHours = 0;\n    s.gpa = 0;\n\n    // if there's\
    \ no room...\n    if (t.noStudents < 100)\n    {\n        // ...add it onto the\
    \ end of the list\n        t.pList[t.noStudents] = &s;\n        t.noStudents++;\n\
    \    }\n}\n```\n\nIn this example, the registration() function can reach into\
    \ both the Student and Teacher to tie them together at registration time, without\
    \ being a member function of either one.\n\nThe first line in the example declares\
    \ the class Student, but none of its members. This is called a forward declaration\
    \ and just defines the name of the class so that other classes, such as Teacher,\
    \ can define a pointer to it. Forward declarations are necessary when two classes\
    \ refer to each other.\n\n![](img/c6a7aed193f785f4098546695e53f585_227_0.png)"
  merge: -1
