  md: '# Chapter 28: Writing Hacker-Proof Code


    # 383


    # A bot-what?


    The term botnet is a contract of "robot network," meaning a network of roboted
    (also called zombie) computers. A zombied computer runs along like normal as long
    as it''s not needed. It can run spreadsheets and Code:Blocks and whatever else,
    but sitting deep in the background is a backdoor that''s open to the person with
    the proper program and the passwords — the bot master.


    Goetherders, and you want to bring down their BAG site so that no one can read
    their lines. You try to swap the site with requests from your computer, but you
    can''t because the BAG''s computer is just as fast as yours. You buy four or five
    computers and have all of them their Web on site. That works for a few minutes,
    but it doesn''t long to figure out that all these requests are coming from a few
    IP addresses, the system administrator for the Brotherhood (very unfairly) blocks
    requests from your PCs!


    When the bot master decides he needs the zombie computer, he sends commands to
    his slave and it starts carrying out the master''s instructions. The owner of
    the computer may not even notice that there is anything wrong, other than the
    fact that computer runs kind of slow.


    But if you could rent the services of a botnet army consisting of thousands of
    PCs all over the world? Each computer has to generate only a few requests per
    second in order to bring the BAG completely to its knees. And what can the system
    administrator do about it? He can''t block every PC without blocking legitimate
    users of the site. The BAG might as well just give up and close the site down.


    Botters can do things, but one of their best tricks is to swap legitimate Web
    sites with bogus requests in another form of Denial of Service attack. Suppose,
    for example, that you don''t like the Brotherhood of Aryan


    The most common hacker tricks that you must deal with in your code are injection
    and buffer overflow.


    # Understanding Code Injection


    Code injection occurs when the user enters your program to execute some piece
    of user-created code. "What? My program would never do that!" you say. Consider
    the most common and, for us, the easiest to understand variant of this scam: SQL
    injection.


    # Examining an example SQL injection


    Let me start with a few facts about SQL:


    +   - SQL (often pronounced "sequel") stands for Structured Query Language.


    +   - SQL is the most common language for accessing databases.'
