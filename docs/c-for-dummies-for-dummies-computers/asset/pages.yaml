  md: "# 194 Part III: Introduction to Classes\n\n```\n// access the gpa member of\
    \ the obj pointed at by ps\n// (this works as expected)\n(*pS).gpa = 3.5;\n\n\
    return 0;\n```\n\n*pS evaluates the pointer's Student object pointed at by pS.\
    \ The .gpa refers to the gpa member of that object.\n\n# Pointing toward arrow\
    \ pointers\n\nUsing the asterisk operator together with parentheses works just\
    \ fine for dereferencing pointers to objects; however, even the most hardened\
    \ techies would admit that this mixing of asterisks and parentheses is a bit tortured.\n\
    \nC++ offers a more convenient operator for accessing members of an object to\
    \ avoid clumsy object pointer expressions. The -> operator is defined as follows:\n\
    \n```\nps->gpa is equivalent to (*pS).gpa\n```\n\nThis leads to the following:\n\
    \n```\nint main(int argc, char* pArgs[])\n{\n  Student s;\n  Student* pS = &s;\
    \ // create a pointer to s\n\n  // access the gpa member of the obj pointed at\
    \ by ps\n  ps->gpa = 3.5;\n\n  return 0;\n}\n```\n\nThe arrow operator is used\
    \ almost exclusively because it is easier to read; however, the two forms are\
    \ completely equivalent.\n\n# Passing Objects to Functions\n\nPassing pointers\
    \ to functions is just one of the many ways to entertain yourself with pointer\
    \ variables."
