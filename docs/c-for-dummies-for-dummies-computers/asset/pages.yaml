    Sometimes, I''ll tell you to use menu commands, such as File; Open. This notation
    means to use the keyboard or mouse to open the File menu and then choose the option.


    Use of gender is always a tricky subject when writing a how-to book. I don''t
    want to appear be telling gentlemen how ignorant they are giving the ladies a
    pass by using *he* and *him* all the time. In this book, I use the pronouns *she*
    and *her* when referring to the programmer *he* and *him* when referring to the
    user of the program, she writes a program that can use.


    Each new feature is introduced by answering the following three questions:


    +   * What is this new feature?

    * Why was it introduced into the language?

    * How does it work?


    Small pieces of code are sprinkled liberally throughout the chapters. Each demonstrates
    some newly introduced feature or highlights some brilliant point I''m making.
    However, *every concept is demonstrated in at least one functional program* that
    you can execute and play with your own computer.


    A real-world program can take up lots of pages. However, seeing such a program
    is an important didactic tool for any reader. I''ve included a series of programs
