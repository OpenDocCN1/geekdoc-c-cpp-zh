  md: '# Part V: Security


    ![](img/c6a7aed193f785f4098546695e53f585_371_0.png)


    Here you can see that a SleeperSofa inherits Furniture, and then Bed minus the
    Furniture part, followed by Sofa minus the Furniture part. Bringing up the rear
    are the members unique to SleeperSofa. (Note that this may not be the order of
    the elements in memory, but that''s not important for the purpose of this discussion.)


    Now the reference in In(O) to weight is not ambiguous because a SleeperSofa contains
    only one copy of Furniture. By inheriting Furniture virtually, you get the desired
    inheritance relationship as expressed in Figure 25-5.


    If virtual solves this problem so nicely, why isn''t the norm? The first reason
    is that virtually inherited base classes are handled internally much differently
    than normally inherited base classes, and these differences involve extra overhead.
    The second reason is that sometimes you want two copies of the base class.


    As an example of the latter, consider a TeacherAssistant who is both a Student
    and a Teacher, both of which are subclasses of Academician. If the university
    gives its teaching assistants two IDs — a student ID and a separate teacher ID
    — the class TeacherAssistant will need to contain two copies of class Academician.


    # Constructing the Objects of Multiple Inheritance


    The rules for constructing objects needs to be expanded to handle multiple inheritance.
    The constructors are invoked in the following order:


    +   1. First, the constructor for any virtual base classes is called in the order
    in which the classes are inherited.


    +   2. Then the constructor for all non-virtual base classes is called in the
    order in which the classes are inherited.'
  merge: -1
  pgno: 371
- img_proc: true
  md: '# Chapter 25: Inheriting Multiple Inheritance


    +   3. Next, the constructor for all member objects is called in the order in
    which the member objects appear in the class.

    4. Finally, the constructor for the class itself is called.


    Notice that base classes are constructed in the order in which they are inherited
    and not in the order in which they appear on the constructor line.


    # Voicing A Contrary Opinion


    I should point out that not all object-oriented practitioners think that multiple
    inheritance is a good idea. In addition, many object-oriented languages don''t
    support multiple inheritance.


    Multiple inheritance is not an easy thing for the language to implement. This
    is mostly the compiler''s problem (or the compiler writer''s). But multiple inheritance
    adds overhead to the code when compared to single inheritance, and this overhead
    can become the programmer''s problem.


    More importantly, multiple inheritance opens the door to additional errors. First,
    ambiguities such as those mentioned in the section "Straightening Out Inheritance
    Ambiguities" pop up. Second, in the presence of multiple inheritance, casting
    a pointer from a subclass to a base class involves changing the value of the pointer
    in sophisticated and mysterious ways. Let me leave the details to the language
    lawyers and compiler writers.


    Third, the way in which constructors are invoked can be a little mystery. Notice
    in the Virtualinheritance example that SleeperSofa must invoke the Furniture constructor
    directly. The SleeperSofa cannot initialize through either the Bed or the Sofa
    constructors.


    I suggest that you avoid using multiple inheritance until you''re comfortable
    with C++. Single inheritance provides enough power to get used to.


    One exception is that it''s fairly safe to multiply inherit a class that contains
    only pure virtual methods and no data members. This is, in effect, C++s implementation
    of what other languages such as Java and C# call an interface. The topic of interfaces
    is a bit beyond the scope of this book as it''s not really a part of C++.


