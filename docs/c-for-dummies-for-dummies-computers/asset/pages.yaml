  md: "# Chapter 13: Point and Stare at Objects 203\n\n# Performing other operations\
    \ on a linked list\n\nAdding an object to the head of a list is the simplest operation\
    \ on a linked list. Moving through the elements in a list gives you a better idea\
    \ about how a linked list works:\n\n```\n// navigate through a linked list\nLinkableClass*\
    \ pL = pHead;\nwhile (pL) {\n    // perform some operation here\n    // get the\
    \ next entry\n    pL = pL->pNext;\n}\n```\n\nThe program initializes the pL pointer\
    \ to the first object of a list of LinkableClass objects through the pointer pHead.\
    \ (Grab the kid's hand.) The program then enters the while loop. If the pL pointer\
    \ is non-null, it points to some LinkableClass object. Control the loop, where\
    \ the program can perform whatever it wants on the object pointed by pL.\n\nThe\
    \ assignment pL = pL->pNext \"moves\" the pL pointer over the next kid in the\
    \ list of objects. The program checks to see if pL is null, meaning that we've\
    \ exhausted the list... I run out of kids, not exhausted all the kids.\n\n# Hooking\
    \ up with a LinkedListData program\n\nThe LinkedList program shown here implements\
    \ a linked list of objects containing a person's name. The program could easily\
    \ contain whatever data you might like, such as Social Security number, grade\
    \ point average, height, weight, and bank account balance. I've limited the information\
    \ to just to keep the program as simple as possible.\n\n```\n// LinkedListData\
    \ - store data in a linked list of objects\n#include <iostream>\n#include <cstdlib>\n\
    #include <iostream>\n\nusing namespace std;\n\n// NameDataSet - stores a person's\
    \ name (these objects\ncould easily store any other information)\n//\n```"
