    | 1 (true) & 0 (false) | is 0 (false) |


    It''s a similar situation for the OR operator:


    | 1 (true) | 0 (false) | is 1 (true) |

    | 0 (false) | 0 (false) | is 0 (false) |


    The definition of the AND operator appears in Table 4-3. Read one argument as
    the column head and the other argument as the row head — the result is the intersection.
    Thus, 1 AND is 1. 0 AND 1 is 0.


    | Table 4-3 | Truth Table for the AND Operator |

    | AND | 1 | 0 |

    | 1 | 1 | 0 |

    | 0 | 0 | 0 |


    You read Table 4-3 as the column corresponding to the value of the arguments while
    the row corresponds to the other. Thus, 1 & 0 is 0. (Column 1 and row 0.) The
    only combination that returns anything other than 0 is 1 & 1. (This is known as
    a truth table.)


    Similarly, the truth table for the OR operator is shown in Table 4-4.


    | Table 4-4 | Truth Table for the OR Operator |

    | OR | 1 | 0 |

    | 1 | 1 | 1 |

    | 0 | 0 | 0 |'
