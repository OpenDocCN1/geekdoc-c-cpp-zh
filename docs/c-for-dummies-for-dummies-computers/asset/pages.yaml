  md: '# Chapter 1


    # Writing Your First C++ Program


    In This Chapter


    +   - Finding out about C++

    - Installing Code::Blocks on Windows, Ubuntu Linux, or Macintosh OS

    - Creating your first C++ program

    - Executing your program


    Okay, so here we are: No one but just you and me. Nothing left to but started.
    Might as well lay out a few fundamental concepts.


    A computer is an amazingly fast but incredibly stupid machine. A computer can
    do anything you tell it (within reason), but it does exactly what it''s told —
    nothing more and nothing less.


    Perhaps unfortunately for us, computers don''t understand any reasonable human
    language — they don''t speak English either. Okay, I know what you''re going to
    say: "I see computers that could understand English." What you really saw was
    a computer executing a program that could meaningfully understand English.


    Computers understand a language widely known as computer language or machine language.
    It''s possible but extremely difficult for humans to speak machine language. Therefore,
    computers and humans have agreed to sort of the middle, using intermediate languages
    such as C++. Humans can speak C++ (sort of), and C++ can be converted into machine
    language for the computer to understand.


    # Grasping C++ Concepts


    A C++ program is a text file containing a sequence of C++ commands put together
    according to the laws of C++ grammar. This text file is known as the source file
    (probably because it''s the source of all frustration). A C++ source file normally
    carries the extension .CPP just as an Adobe Acrobat file ends in .PDF or an MS-DOS
    (remember that?) batch file ends in ..'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# 10 Part I: Getting Started with C++ Programming


    The point of programming in C++ is to write a sequence of commands that can be
    converted into a machine-language program that actually does what we want. This
    conversion is called compiling and is the job of the compiler. The machine code
    that you wrote must be combined with some setup and teardown instructions and
    some standard library routines in a process known as linking. Together, compiling
    and linking are known as building. The resulting machine-executable files carry
    the extension .EXE in Windows. They don''t carry any particular extension in Linux
    or Macintosh.


    That sounds easy enough — so what''s the big deal? Keep going.


    To program, you need two specialized computer programs. One (an editor) is what
    you use to write your code as you build .CPP source file. The other (a compiler)
    converts your source code into a machine-executable file that carries your real-world
    commands (open spreadsheet, make rules, deflect incoming asteroids, whatever).


    Nowadays, top developers generally combine compiler and editor into a single package
    — a development environment. After you finish the commands that make your program,
    you need only click a button to build the executable file.


    Fortunately, there are public-domain C++ environments. I use one of them in this
    book — the Code:Blocks environment. This editor will work with a lot of different
    compilers, but the version of Code:Blocks combined with the gcc compiler used
    to write this book is available for download for Windows, Macintosh, and various
    versions of Linux, as described in the chapter.


    Although Code:Blocks is public domain, you''re encouraged to pay some small fee
    to support its further development. You don''t have to pay to Code:Blocks, but
    you can contribute to the cause if you like. See the Code:Blocks website for details.


    I have tested the programs in this book with Code:Blocks 13.12 which comes bundled
    with gcc version 4.7.1. This version of gcc implements most of the C++ 2011 standard.


    You can use different versions of C++ or even different compilers if you prefer,
    but they may not implement the ''11 standard. For reason, 2011 extensions are
    marked with the ''11 icon you see here.


    The gcc compiler does not implement any of the extensions added in the C++ 2014
    standard as of this writing, but I included them, where applicable, because some
    day it will.


    Okay, I admit it: This book is somewhat Windows-centric, I have tested all of
    the programs in this book on Windows 2000/XP/Vista/7/8, Ubuntu Linux, and Macintosh
    OS X. I flag any differences between operating systems in the text.


    ![](img/c6a7aed193f785f4098546695e53f585_25_0.png)


    ![](img/c6a7aed193f785f4098546695e53f585_25_1.png)'
