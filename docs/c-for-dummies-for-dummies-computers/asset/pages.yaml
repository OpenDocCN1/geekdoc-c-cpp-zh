  md: '# Chapter 20: Examining Virtual Member Functions: Are they Real?


    C++ adds an additional, hidden pointer — not one pointer per virtual function,
    just one pointer if the class has any virtual functions. A class that has no virtual
    functions (and does not inherit any virtual functions from base classes) does
    not have this pointer.


    Now, one pointer doesn''t sound like much, and it isn''t unless the following
    two conditions are true:


    +   - The class doesn''t have data members (so that one pointer represents a lot
    compared to what''s there already).

    - You intend to create a list of objects of this class (otherwise, the overhead
    doesn''t make any difference).


    If these two conditions are met and your class doesn''t already have virtual member
    functions, you may not want to declare the destructor virtual.


    Except for this case, always declare destructors to be virtual, even if a class
