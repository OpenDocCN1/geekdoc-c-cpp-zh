  md: "# 176 Part III: Introduction to Classes\n\n# The Format of a Class\n\nA class\
    \ consists of the keyword class followed by a name and an open and closed brace.\
    \ A class used to describe a savings account including account number and balance\
    \ might appear as follows:\n\n```\nclass SavingsAccount {\n  public:\n    unsigned\
    \ accountNumber;\n    double balance;\n}\n```\n\nThe statement after the open\
    \ brace is the keyword public. (Hold off asking the meaning of the public keyword.\
    \ I'll make its meaning public a little later.)\n\nThe alternative keyword struct\
    \ can be used in place of class. The two keywords are identical that the public\
    \ declaration is assumed in the struct and can be omitted. You should stick with\
    \ class for most programs for reasons that will become later in this chapter.\n\
    \nFollowing the public keyword are the entries it takes to describe the object.\
    \ The SavingsAccount class contains two elements: an unsigned integer accountNumber\
    \ and the account balance. We can also say that accountNumber and balance are\
    \ members or properties of the class SavingsAccount.\n\nTo create an actual savings\
    \ account object, I type something like the following:\n\n```\nSavingsAccount\
    \ mySavingsAccount;\n```\n\nWe say that mySavingsAccount is an instance of the\
