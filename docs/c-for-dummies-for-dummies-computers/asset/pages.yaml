    # Sign Your Code With a Digital Certificate


    Code signing works by generating a secure hash of the executable code and combining
    it with a certificate issued by a valid certificate authority. The process works
    like this: The company creating the program must first register itself with one
    of the certificate authorities. Let''s use the example of my great retirement
    hope, My Company, Inc. must first convince the commercially available certificate
    authorities that My Company, Inc., is in fact a real company and not just some
    of thieves or fiction of my. I do this by revealing its address, phone numbers,
    the names and addresses of its officers, the URL of its Web site, and so on. I
    may be asked to produce My Company''s tax filings for the past few years to prove
    that this isnt some bogus claim.


    Once the certificate authority is convinced that My Company is a valid software
    entity, it issues a certificate. It is a long number that anyone can use to verify
    that the holder of this certificate is the famous My Company of San Antonio.


    Executables generated by My Company can then be signed with this certificate.
    Signing an executable does two things:


    +   - It creates a secure hash that would make it very difficult (as close as
    possible) for a hacker to modify the executable without being detected by the
    user''s computer.

    - It ensures the user that this program was created by a legitimate software-development
    company.


    When a user runs my program for the first time, the application presents its certificate
    and secure combination to the operating system. The OS first calculates a hash
    of the executable and compares it to the hash presented. If these match, then
    the OS is reasonably certain that the executable is the same one that My Company
    shipped out its doors. The OS then validates the certificate to make sure that
    it is valid and hasn''t been revoked. If that matches, the OS presents a dialog
    box to the user to state that this application is a valid executable from My Company,
    Inc., and asks whether it should continue it.


    # Use Secure Encryption Wherever Necessary


    Like any good warning, this admonition has several parts. First, "Use encryption
    wherever necessary." This tends to bring to mind thoughts of communicating bank
    account information over the Internet, but you should think more'
  merge: -1
  pgno: 444
- img_proc: true
  md: '# 430 Part VI: The Part of Tens


    general than that. Data that is being communicated, whether over the Internet
    or over some smaller range, is known generally as Data in Motion. Data in Motion
    should be encrypted unless it would be of no use to a hacker.


    Data stored on the disk is known as Data at Rest. Data should also be encrypted
    if there is a chance of the disk being lost, stolen, or copied. Businesses routinely
    encrypt the hard disks on their company laptops in a case gets stolen by the security
    scanner in the airport or left in a taxi somewhere. Small portable storage devices
    as thumb drives are especially susceptible to being lost — data on these devices
    are encrypted.


    Encryption is not limited to data — the entire communication session should be
    encrypted if a hacker could coax your application into revealing secrets by spoofing
    either the remote application or the server.


    But this section says “Use Secure Encryption.” Don''t make up your own encryption
    scheme or try to improve upon existing schemes because the results won''t be secure.
    Encryption go through years of testing and evaluation by experts before they are
    adopted by the public. Don''t think that you can improve them on your own. You
    are likely to just mess them up.


    A good example of this lies in the Wi-Fi in your phone, tablet, or laptop. The
    original definition for Wi-Fi (known as 802.11b) used a remarkably secure algorithm
    for securing the packets of information sent over the airwaves. It called this
    WEP (Wired Equivalent Protocol, Wireless Encryption Protocol). Unfortunately,
    the designers of 802.11b didn''t implement the protocol correctly, which left
    802.11b hopelessly vulnerable to hacking. In 2004, programs were available on
    the Web that crack WEP-encrypted data in three minutes or less. This flaw was
    recognized fairly quickly, and subsequent standards replaced WEP with the more
    secure WPA2 (Wi-Fi Protected Access).


    When the holes in WEP were first discovered, the Wi-Fi Alliance, keepers of the
    802.11 standard, knew they had a problem. The replacement standard they wanted
    could not be implemented on the existing Wi-Fi Access Points that were built to
    support WEP. Therefore, the Wi-Fi Alliance decided to release an intermediate
    standard known as WPA1. This protocol implemented the original encryption algorithm
    it should have been implemented in the first place. Since it was so similar to
    WEP, WPA1 could be implemented on existing hardware with relatively minor changes
    to the firmware. Nevertheless, the fixes resulted in a significant increase in
    security over the flawed WEP implementation. However, WPA1 was never intended
    to be anything than a stop-gap. The completely new WPA2 standard was introduced
    in 2004 and required on all devices built after 2006. Secure applications no longer
    allow the use of WEP. For example, the Payment Card Industry outlaw its use in
    2006. Though I saw for WPA1 as late as 2010, WPA2 is the state of the art as this
    is writing.


