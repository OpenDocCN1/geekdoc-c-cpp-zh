    \    Savings s;\n    s.accountNumber = 123456;\n    s.balance = 0.0;\n\n    //\
    \ now add something to the account\n    cout << \"Depositing 10 to account \"\
    \ << s.accountNumber << endl;\n    s.deposit(10);\n    cout << \"Balance is \"\
    \ << s.balance << endl;\n```"
