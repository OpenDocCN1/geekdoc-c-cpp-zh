  md: "# Chapter 29: Ten Ways to Avoid Adding Bugs to Your Program 411\n\n# Limit\
    \ the Visibility\n\nLimiting the visibility of class internals to the outside\
    \ world is a cornerstone of object-oriented programming. The class is responsible\
    \ for its own internals; the application is responsible for using the class to\
    \ solve the problem at hand.\n\nSpecifically, limited visibility means that data\
    \ members should not be accessible outside the class — that is, they should be\
    \ marked as *protected*. (Another storage class, *private*, is not discussed in\
    \ this book.) In addition, member functions that the application software does\
    \ not need to know about should also be marked *protected*. Don't expose any more\
    \ of the class internals than necessary.\n\nA related rule is that public member\
    \ functions should trust application code as little as possible. Any argument\
    \ passed to a public member function should be treated as though it might cause\
    \ bugs until it is proven safe. A function such as the following is an accident\
    \ waiting to happen:\n\n```\nclass Array {\npublic:\n    explicit Array(int s)\
    \ {\n        size = 0;\n        // new throws exception if memory not available\n\
    \        pData = new int[s];\n    }\n    ~Array() {\n        delete[] pData;\n\
    \        size = 0;\n        pData = nullptr;\n    }\n    // return or set the\
    \ array data\n    int data(int index) {\n        return pData[index];\n    }\n\
    \    int data(int index, int newValue) {\n        int oldValue = pData[index];\n\
    \        pData[index] = newValue;\n        return oldValue;\n    }\nprotected:\n\
    \    int size;\n    int *pData;\n}\n```"
