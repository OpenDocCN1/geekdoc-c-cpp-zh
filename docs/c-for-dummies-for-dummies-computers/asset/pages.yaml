  md: '# Part II: Becoming a Functional C++ Programmer


    # Okay, how about not #defining things?


    The sometimes unexpected results from the preprocessor have created heartburn
    for the fathers (and mothers) of C++ almost from the beginning. C++ has included
    features over the years to make sure most uses of #define unnecessary.


    For example, C++ defines the inline function to replace the macro. This just like
    any other function declaration with the addition of the keyword inline tacked
    to the front:


    ```

    inline int SQUARE(int x) { return x * x; }

    ```


    This inline definition looks much like the previous macro definition for SQUARE()
    (I have written this definition on one to highlight the similarities). However,
    an inline function is processed by the C++ compiler rather than by the preprocessor.
    Definition of SQUARE() does not suffer from any of the strange effects noted previously.


    ![](img/c6a7aed193f785f4098546695e53f585_175_0.png)


    The keyword is supposed to suggest to the compiler that it "expand the function
    inline" rather than generate a call to some code somewhere for operation. This
    was to satisfy the speed freaks, who wanted to avoid the overhead of performing
    a function call to a macro definition that generates no call. The best that can
    be said is inline functions may be expanded in place, but again, they may not.
    There''s no way to be sure without performing detailed timing analysis or examining
    the machine code output by the compiler.


    C++ allows programmers to use a variable declared const to take the place of a
    #define constant so the value of the constant is spelled out at compile time:


    ```

    const int MAX_NAME_LENGTH = 512;

    int szName[MAX_NAME_LENGTH];

    ```


    The ''11 standard goes so far as to allow you to declare a function to be constexpr.


    ```

    constexpr int square(int n1, int n2)

    {return n1 * n1 + n2 * n2};

    ```


    This makes a declaration like the following legal:


    ```

    int matrix[square(5)];

    ```


    However, ''11 puts a lot of significant restrictions on what can go into a const
    expression. For example, such a function is pretty limited to a single line.'
