  md: '# 404 Part V: Security


    This difference is not noticeable if the program calls getString() only once or
    even only a thousand times, but it can be considerable if this function were being
    called in the middle of a very time critical loop.


    Thus, the string or vector versions of getString() are the way to go for general
    use, but there may be conditions that justify the use of fixed-size buffers.


    There is no measurable difference in performance between the version of getString()
    that does not check for buffer overflow and the one that does. There is no justification
    for leaving yourself exposed to hacking by buffer overflow if you''re trying to
    shave a few instructions off the execution time.


    ![](img/c6a7aed193f785f4098546695e53f585_419_0.png)


    # Let the operating system help


    CPU manufacturers and operating system vendors have combined to devise ways to
    avoid buffer overflows. Two of the most common are Address Layout Randomization
    (ASLR) and Data Execution Prevention (DEP).


    One of the Achilles heels of the hacking is that the head had hard code the address
    on the stack. I could do this because my version of Windows loads that particular
    program, BufferOverflow exe the same. But what if it were very a bit thing it
    executed the program? What if the operating system added some constant to the
    stack pointer before executing the program time? It would make no difference to
    the program, but it would make it impossible for the hacker to know what value
    to overwrite the return address since the size of buffer would be differently
    every time the program is executed. Memory around is Address Space Layout Randomization
    (ASLR).


    Another vulnerability of this hack is the fact that at least for a small period
    of time the processor was being asked to execute machine


    instructions that were stored in an area reserved for data (the machine code that
    got loaded into buffer). Most x86 processors have the ability known as Data Execution
    Prevention (DEP) to mark segments where code is stored as executable or not (using
    a flag like NX flag). Operating systems that support DEP memory segments where
    areas intended for only data, such as the stack where buffer is stored as executable.
    This buffer overflow would have been trapped by the processor as soon as controlled
    to the beginning of buffer: The CPU throw an exception that was executing instructions
    stored in non-executable memory — a no-no of the first.


    In Windows Vista and later, DEP is enabled for most Windows kernel processes and
    many applications to avoid hackers from gaining administrator privileges but is
    often not enabled for user code. The Task Manager will show you'
