  md: "# Chapter 14: Protecting Members: Do Not Disturb\n\nSuppose you have a class\
    \ Student. In this example, the following capabilities are all that a fully functional,\
    \ upstanding Student needs (notice the absence of spendMoney() and drinkBeer())\
    \ — this is a highly stylized student:\n\n```\naddCourse(int hours, double grade)\
    \ — adds a course\ngrade() — returns the current grade point average\nhours()\
    \ — returns the number of hours earned toward graduation\n```\n\nThe remaining\
    \ members of Student can be declared protected to keep other functions' trying\
    \ expressions out of Student's business.\n\n```\nclass Student {\n    public:\n\
    \        // grade - return the current grade point average\n        double grade()\
    \ { return gpa; }\n\n        // hours - return the number of semester hours\n\
    \        int hours() { return semesterHours; }\n        // addCourse - add a course\
    \ to the student's record\n        double addCourse(int hours, double grade);\n\
    \n        // the following members are off-limits to others\n    protected:\n\
    \        int semesterHours; // hours earned toward graduation\n        double\
    \ gpa; // grade point average\n}\n```\n\nNow the members gpa are accessible only\
    \ to other members of Student. Thus, the following doesn't work:\n\n```\nStudent\
    \ s;\nint main(int argc, char* pArgs[]) {\n    // raise my grade (don't make it\
    \ too high; otherwise,\n    // one would believe it)\n    s.gpa = 3.5; // <- generates\
    \ compiler error\n    double gpa = s.grade(); // <- this public function reads\n\
    \    // a copy of the value, but you\n    // can't change it from here\n    return\
    \ 0;\n}\n```\n\nThe application's attempt to change the value of gpa is flagged\
    \ with a compiler error.\n\nA class member can also be protected by declaring\
    \ it. In this book, I use the protected keyword exclusively. The difference between\
    \ private and protected has to do with inheritance, which is presented in Chapter\
    \ 19.\n\n![](img/c6a7aed193f785f4098546695e53f585_224_0.png)"
