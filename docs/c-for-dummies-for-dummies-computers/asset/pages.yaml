    \ program is available online at www.dummies.com/extras/cplusplus).\n\n```\nclass\
    \ Tutor {\npublic:\n    Tutor(Student& s)\n    : student(s), id(0)\n    cout <<\
    \ \"Constructing Tutor object\" << endl;\nprotected:\n    Student student;\n \
    \   int id;\n};\n\nvoid fn(Tutor tutor) {\n    cout << \"In function fn()\" <<\
    \ endl;\n}\n\nint main(int argcs, char* pArgs[]) {\n    Student scruffy(\"Scruffy\"\
    );\n    Tutor tutor(scruffy);\n};\n```"
