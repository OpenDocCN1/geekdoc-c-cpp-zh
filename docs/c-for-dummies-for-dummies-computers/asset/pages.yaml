    \ you could use a lowly int variable to keep track of the number of Student objects.\
    \ The problem with this solution, however, is that global variables are outside\
    \ the class. It's like putting the voltage regulator for my microwave outside\
    \ the enclosure. Sure, I could do it, and it would work fine — the only problem\
    \ is I wouldn't be happy if my dog got onto the wires and I had to peel him off\
    \ the ceiling (the dog would be thrilled about that, either).\n\nIf a class is\
    \ going to be held responsible for its own state, objects such as global variables\
    \ must be brought inside the class, just as the voltage regulator must be inside\
    \ the microwave lid, away from prying paws. This is the idea behind members.\n\
    \nYou may have static members referred to as class members; this is because all\
    \ objects in the class share them. By comparison, normal members are referred\
    \ to as instance members, or object members, because each object receives its\
    \ own copy of these members.\n\n![](img/c6a7aed193f785f4098546695e53f585_277_0.png)\n\
    \n# Using static members\n\nA static data member is one that has been declared\
    \ with the static storage class, as shown here:\n\n```\nclass Student {\n  public:\n\
