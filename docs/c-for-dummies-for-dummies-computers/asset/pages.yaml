  md: "# 76 Part I: Getting Started with C++ Programming\n\nAfter the code in the\
    \ body of the loop finishes executing, control passes to the increment clause\
    \ before returning to check the conditional clause — thereby repeating the process.\
    \ The increment clause normally handles the autoincrement or autodement statements\
    \ used to update the counting variables.\n\nThe for loop is best understood by\
    \ example. ForDemo1 programming is nothing more than the WhileDemo converted to\
    \ the for loop construct:\n\n```\n// ForDemo - input a loop. Loop while\noutputting\
    \ asring arg number of times.\n#include <stdio>\n#include <cstdlib>\n#include\
    \ <iostream>\nusing namespace std;\n\nint main(int nNumberOfArgs, char* pszArgs[])\
    \ {\n    // input the loop count\n    int nLoopCount;\n    cout << \"Enter loop\
    \ count: \";\n    cin >> nLoopCount;\n\n    // count up to the loop count limit\n\
    \    for (nLoopCount > 0) {\n        nLoopCount = nLoopCount - 1;\n        cout\
    \ << \"Only \" << nLoopCount << \" loops to go\" << endl;\n    }\n\n    // wait\
    \ until user is ready before terminating program\n    // to allow the User to\
    \ see the program results\n    cout << \"Press Enter to continue...\" << endl;\n\
    \    cin.ignore(10, '\\n');\n    cin.get();\n    return 0;\n}\n```\n\nThe for\
    \ loop reads a value from the keyboard into the variable nLoopCount. The for starts\
    \ comparing nLoopCount to 0. Control passes to the for loop if nLoopCount is greater\
    \ than 0. Inside the for loop, the program increments nloopCount and displays\
    \ the result. Done, the program returns to the for loop control. Control skips\
    \ to the next line after the for loop as soon as nloopCount has been decremented\
    \ to 0.\n\nAll sections of a for loop can be empty. An initialization section\
    \ does nothing. An empty comparison section is treated like a comparison that\
    \ returns true.\n\n![](img/c6a7aed193f785f4098546695e53f585_91_0.png)"
