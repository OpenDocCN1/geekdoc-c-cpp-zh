  md: '# Chapter 10: The C++ Preprocessor


    However, the following lines


    ```

    int nSQ = SQUARE(1 + 2);

    out << "SQUARE(1 + 2) = " << nSQ << endl;

    ```


    generate the surprising result


    ```

    SQUARE(1 + 2) = 5

    ```


    The preprocessor since replaced X in the macro definition with I + 2. What the
    C++ compiler actually sees


    ```

    int nSQ = 1 + 2 * 1 + 2;

    ```


    Since multiplication has precedence over addition, this is turned into 1 + 2 *
    2 which, of course, is 5. This confusion can be solved by liberal use of parentheses
    in macro definition:


    ```

    #define SQUARE(X) ((X) * (X))

    ```


    This version generates expects


    ```

    SQUARE(1 + 2) -> ((1 + 2) * (1 + 2)) -> 9

    ```


    However, some unexpected results cannot be fixed by matter how hard you try. Consider
    the following snippet:


    ```

    int i = 2;

    out << "i = " << i << endl;

    int nSQ = SQUARE(i++);

    out << "SQUARE(i++) = " << nSQ << i << endl;

    cout << "now i = " << i << endl;

    ```


    This generates the following:


    ```

    i = 3;

    SQUARE(i++) = 9

    now i = 5

    ```


    The value generated by SQUARE is correct, but the variable i has incremented twice.
    The reason is obvious when you consider the expanded macro:


    ```

    int i = 3;

    nSQ = i++ * i++;

    ```


    Since addition has precedence, the i++ operations are performed first. Both return
    the current value of i, which is 3. These two values are multiplied together to
    return the expected value of 9. However, i is incremented twice to generate a
    resulting value of 5.'
