  md: "# Chapter 16: Making Constructive Arguments 237\n\nNotice in particular the\
    \ first line of the constructor. Here's something you haven't seen before. The\
    \ : means what follows are calls to the constructors of data members of the current\
    \ class. To the C++ compiler, this line reads \"Construct the members name and\
    \ id using the arguments pName and sId, respectively, of the Student constructor.\
    \ Whatever data members are not called out in this fashion are constructed using\
    \ their default constructor.\"\n\n![](img/c6a7aed193f785f4098546695e53f585_252_0.png)\n\
    \nThe string type is a conventionally class defined in an include file which is\
