  md: '# 26 Part I: Getting Started with C++ Programming


    To execute the Conversion program on Windows Code::Blocks, choose Build::Build
    and Run, or press F9. This rebuilds the program if anything has changed and executes
    the program if the build is successful.


    A dialog box opens immediately, requesting a temperature in Celsius. Enter a known
    temperature, such as 100 degrees. After you press Enter, the program returns with
    the equivalent Celsius of 212 degrees Fahrenheit as follows:


    ```

    Enter the temperature in Celsius:100

    Fahrenheit value:212

    Press Enter to continue . . .

    ```


    The message Press Enter to continue gives you the opportunity to read what you''ve
    entered before it goes away. Press Enter, and the dialog box (along with its contents)
    disappears. Congratulations! You just entered, and executed your C++ program.


    Notice that Code::Blocks is not truly intended for developing windowed programs
    like those used in Windows. In theory, you can write a Windows application using
    Code::Blocks, but it isn''t easy. (Building windowed applications is so much easier
    in Visual Studio.)


    Windows programs show the user a visually oriented output, all nicely arranged
    on onscreen windows. Conversion.exe is a 32-bit program that executes under Windows,
    but it''s not a Windows program in the visual sense.


    If you don''t know what 32-bit program means, don''t worry about it. As I said,
    this book isn''t about writing Windows programs. The C++ programs you write in
    this book have a command line interface executing within MS-DOS box.


    Budding Windows programmers shouldn''t despair — you don''t waste your energy.
    Learning C++ is a prerequisite for writing Windows programs. I think that they
    should be mastered separately: C++ first, Windows seconds.


    # Reviewing the Annotated Program


    Entering data in someone''else program is as exciting as watching someone else
    drive a car. You really need to get behind the wheel yourself. Programs are like
    bit cars, as well. All are basically the same with small differences and additions
    — okay, French cars are a lot different than other cars, but the point is still
    valid. Cars follow the same pattern — steering wheel in front of you, seat below
    you, roof above you, and stuff like that.


    Similarly, all C++ programs follow a common pattern. This pattern is already present
    in your very first program. We can review the Conversion program by looking for
    the elements that are common to all programs.'
