  md: "# 240 Part III: Introduction to Classes\n\nA static variable is a variable\
    \ that is local to a function but retains its value from one function invocation\
    \ to the next. A global variable is a variable declared outside a function.\n\n\
    Now we'll consider each of the preceding rules in turn.\n\n# Local objects construct\
    \ in order\n\nLocal objects are constructed in the order in which the program\
    \ encounters their declaration. Normally, this is the same as the order in which\
    \ the objects appear in the function, unless the function jumps around particular\
    \ declarations. (By the way, jumping around declarations is a bad thing. It confuses\
    \ the reader and the compiler.)\n\n# Static objects construct only once\n\nStatic\
    \ objects are similar to local variables, except that they are constructed only\
    \ once. C++ waits until the first time control passes through the static's declaration\
    \ before constructing the object. Consider the following trivial ConstructStatic\
    \ program:\n\n```\n// ConstructStatic - demonstrate that statics are only\n//\
    \ constructed once\n\n#include <stdio>\n#include <stdlib>\n#include <iostream>\n\
    using namespace std;\n\nclass DoNothing {\npublic:\n\tDoNothing(int initial) :\
    \ nValue(initial) {\n\t\tcout << \"DoNothing constructed with a value of \" \n\
    \t\tinitial << endl;\n}\n\t~DoNothing() {\n\t\tcout << \"DoNothing object destroyed\"\
    \ << endl;\n\t}\n\tint nValue;\n};\nvoid fn(int i)\n\n```"
  merge: -1
  pgno: 255
- img_proc: true
  md: "# Chapter 16: Making Constructive Arguments\n\n```\ncout << \"Function fn passed\
    \ a value of \" << i << endl;\nstatic DoNothing dn(i);\n}\nint main(int argcs,\
    \ char* pArgs[]) {\n    fn(10);\n    fn(20);\n    cout << \"Press Enter to continue...\"\
    \ << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n    return 0;\n}\n```\n\
    \nExecuting program generates the following results:\n\n```\nFunction fn passed\
    \ a value of 10\nDoNothing constructed with a value of 10\nFunction fn passed\
    \ a value of 20\nPress Enter to continue...\nDoNothing object destructed\n```\n\
    \nNotice the message from the function fn() appears twice, but the message for\
    \ DoNothing appears only the first time fn() is called. This indicates that the\
    \ object is constructed the first time that fn() is called but not thereafter.\
    \ Also notice that the destructor is not invoked until the program returns from\
    \ main() as part of the program shutdown process.\n\n# All global objects construct\
    \ before main ()\n\nAll global variables go into scope as the program starts.\
    \ Thus, all global objects are constructed before control is passed to main().\n\
    \nInitializing global variables can cause real debugging headaches. Some debuggers\
    \ try to execute up to main() as soon as the program is loaded and hand over control\
    \ to the user. This can be a problem because the constructor for all global objects\
    \ has already been executed by the time you have control of them. If one of these\
    \ constructors you never get a chance to find the problem. In this case, the program\
    \ appears to die before it even starts!\n\nThe best way I've found to detect this\
    \ type of problem is to set a breakpoint in every constructor that you even remotely\
    \ suspect as well the first statement in main(). You will hit a breakpoint for\
    \ each global object declared as soon as you start the program. Press Continue\
    \ after each breakpoint until the program crashes — now you know that you pressed\
    \ Continue once too often.\n\n![](img/c6a7aed193f785f4098546695e53f585_256_0.png)"
  merge: -1
