  md: "# Defining a Member Function in the Class\n\nA member function can be defined\
    \ either in the class or separately. When defined in the class definition, the\
    \ function looks like the following, which is contained in the file Savings.h.\n\
    \n```\n// Savings - define a class that includes the ability\n// to make a deposit\n\
    class Savings\n{\npublic:\n    // define a member function deposit()\n    double\
    \ deposit(double amount)\n    {\n        balance += amount;\n        return balance;\n\
    \    }\n    unsigned int accountNumber;\n    double balance;\n};\n```\n\nUsing\
    \ inline like this is pretty slick. Now a program can include the class definition\
    \ (along the definition for the member function), as follows in the venerable\
    \ SavingsClass_inline program:\n\n```\n// SavingsClassInline - invoke a member\
    \ function that's\n// both declared and defined within\n// the class Student\n\
    \n#include <cstd>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace\
