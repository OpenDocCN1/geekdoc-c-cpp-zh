    A Debug and a Release version should be created, as shown in Figure 30-1. The
    only real difference between these two is the compiler switches: The Debug version
    includes the -g switch, which tells the compiler to include symbol table information
    in the executable file. This symbol information tells the debugger where each
    line of code is located in the executable and where each variable is stored. This
    information is necessary in order to set breakpoints and display the value of
    variables. But if this information is available in the version distributed to
    customers, the hacker will be given a blue print to your source code.


