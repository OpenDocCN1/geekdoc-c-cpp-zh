  md: '# Chapter 30

    Ten Ways to Protect Your Programs from Hackers


    +   In This Chapter

    - Protecting yourself from user input

    - Handling failures in your code

    - Maintaining a program log

    - Following good development process

    - Practicing good version control

    - Authenticating users securely

    - Managing your sessions

    - Obfuscating your code

    - Signing your code

    - Using encryption securely


    Chapter 28 describes things you should do in your code to avoid writing programs
    that are vulnerable to hackers. It also describes features you can enable if your
    operating system supports them, such as Address Space Layout Randomization (ASLR)
    and Data Execution Prevention (DEP). This chapter describes further steps you
    can take as part of the software development process to defend yourself from the
    “hackerata.”


    # Don’t Make Assumptions about User Input


    The programmer has a frame of mind when writing a program. She’s thinking about
    the problem that she’s trying to solve. Given that a person can keep only so many
    things in her mind at one time, she’s probably not thinking much beyond the immediate
    problem.'
  merge: -1
  pgno: 432
- img_proc: true
  md: '# 418 Part VI: The Part of Tens


    Programmer''s tunnel vision is okay during the early development phase. At some
    point, however, the programmer (or, better yet, some other programmer who had
    nothing to do with the development of the code) needs to sit back and forget about
    the immediate problem. She needs to ask herself, “How will this program react
    to illegal input?”


    For example, in the field for the username, suppose someone enters several thousand
    characters. Will the program react? Ideally, you want the program to respond with
    an error message like: “What heck are these several thousand characters doing
    in the place where I expected a name?” Barring that, a simple “I don''t understand
    what you mean” is fine.


    In fact, any short of crashing or corrupting data is acceptable. This is because
    a crash indicates a possible intrusion vector that a hacker can exploit your program
    to do something that you don''t want it to do.


    Not every crash is exploitable, but many crashes are. In fact, throwing lots of
    garbage input into a program and looking for the crashes is *fuzzing the program*
    and is often the first step to finding exploits in deployed applications.


    Here are some of the rules for checking input:


    +   - Make no assumptions about the length of the input.

    - Don''t accept more input than you have room for your fixed-length buffers (or
    used variable-size buffers).

    - Check the range of every numerical value to make sure that makes sense.

    - Check for and filter out special characters that may be used by a hacker to
    inject code.

    - Don''t pass raw input onto another service, such as a database service.


    And perform all of the same checks on the values returned from remote services.
    The hacker may not be on the input side, he may be on the response side.


    # Handle Failures Gracefully


    By this, I don''t mean “Don''t be a sore loser.” What I mean is your program should
    respond reasonably to failures that occur within the program. For example, if
    your call to a library function returns a `nullptr`, the program should detect
    this and do something reasonable.


    Reasonable here is to be understood fairly liberally. It not necessarily mean
    that the program needs to sniff around to figure out exactly why the function
    didn''t return a reasonable address. It could be that the request for


    ![](img/c6a7aed193f785f4098546695e53f585_433_0.png)'
  merge: -1
  pgno: 433
- img_proc: true
  md: '# Chapter 30: Ten Ways to Protect Your Programs from Hackers 419


    way too much memory due to unreasonable input. Or it could be that the constructor
    detected some type of illegal input. It doesn''t matter. The point is that the
    program should restore its state as best it can and set up for the next bit of
    input without crashing or corrupting existing data structures as the heap.


    In general this means the following:


    +   - Check for illegal input to interface functions and throw an exception when
    you detect it.


    +   - Catch and handle exceptions at the proper points.


    ![](img/c6a7aed193f785f4098546695e53f585_434_0.png)


    Some programmers are good at checking for illegal input and throwing exceptions
    when problems occur, but they''re not so good at catching exceptions and handling
    them properly. I would give this type of programmer a B– At least their programs
    are hard to exploit, they''re easy to crash, making them vulnerable to the relatively
    less dangerous Denial of Service attacks.


    Another rule of thumb is to fail secure. For example, if you are trying to check
    someone''s password and the user inputs 2000 characters with embedded SQL statements,
    not only is it necessary to reject this garbage, but you must not approve this
    nonsense as if it were a valid password. Whenever you catch an exception, you
    should not assume anything about the state of the system (like the fact that the
    user has been properly identified and credentialed) that may not be true. It is
    far better to require the user to reenter their credentials after a major failure
    than would be to assume that an invalid user has already approved.


    # Maintain a Program Log


    Create and maintain runtime logs that allow someone to reconstruct what happened
    in the event of a security failure. (Actually, this is as true in the event of
    any type of failure.) For example, you probably want to log every time someone
    enters or out of your system. You''ll want to know who was logged into your system
    when a security event occurred— this is the group''s most at risk of security
    loss and who are most suspicious when looking for culprits. In addition, you''ll
    want to log any system errors which would include most exceptions.


    A real-world production program contains a large number of calls that look something
    like this:


    ```

    log(DEBUG, "User %s entered legal password", sUser);

    ```'
