  md: "# 296 Part IV: Inheritance\n\nThe problem is that the question doesn't make\
    \ sense. There's no such thing as \"just an account.\" All accounts (in this example)\
    \ are either checking accounts or savings accounts. The concept of an account\
    \ is an abstract that factors properties common to the two concrete classes. It\
    \ is incomplete because it lacks the critical property withdrawal(). (After you\
    \ get further into the details, you may find other properties that a simple account\
    \ lacks.)\n\nAn abstract class is one that exists only in subclasses. A concrete\
    \ class is a class that is not abstract.\n\n# Describing the abstract class concept\n\
    \nAn abstract class is a class with one or more pure functions. Oh, great! That\
    \ helps a lot.\n\nOkay, a pure virtual function is a virtual member function that\
    \ is marked as having no implementation. Most likely it has no implementation\
    \ because implementation is possible with the information provided in the class,\
    \ including any base classes. A conventional, run-of-the-mill non-pure virtual\
    \ function is known as a concrete function (note that a concrete function may\
    \ be virtual—unfortunately, C++ uses this term to mean polymorphic. See Chapter\
    \ 20.)\n\nThe syntax for declaring a pure virtual is demonstrated in the following\
    \ class Account:\n\n```\n// Account - this class is an abstract class\nclass Account\
    \ {\npublic:\n    Account (unsigned accNo, double initialBalance = 0.0);\n\n \
    \   // access functions\n    unsigned int accNo();\n    double acctBalance();\n\
    \    static int noAccounts()();\n\n    // transaction functions\n    void deposit(double\
    \ amount);\n\n    // the following is a pure virtual function\n    virtual void\
    \ withdrawal(double amount) = 0;\n```"
