  md: "# Chapter 16: Making Constructive Arguments\n\n# Constructors as a Form of\
    \ Conversion\n\nC++ views constructors with a single argument as a way of converting\
    \ from one type to another. Consider a user-defined Complex designed to represent\
    \ complex numbers. Without getting too technical (for me, not you), there is a\
    \ natural conversion between real numbers and complex numbers just like the conversion\
    \ from integers to real numbers, in the following example:\n\n```\ndouble d =\
    \ 1; // this is legal\nComplex c = d; // this should be allowed as well\n```\n\
    \nIn fact, C looks for ways to make sense out of statements like this. If the\
    \ class Complex has a constructor that takes its as argument a double. C++ will\
    \ use that constructor as a form of conversion, as if the preceding statement\
    \ had been written as:\n\n```\ndouble d = 1;\nComplex c(d);\n```\n\nConstructor-introduced\
    \ conversions do not make sense. For example, you may not want C++ to convert\
    \ an integer into a Student just because a Student(int) constructor exists. Unexpected\
    \ conversions can lead to strange run-time errors when C++ tries to make sense\
    \ out of simple coding mistakes.\n\nThe programmer can use the keyword explicit\
    \ to avoid creating unexpected and unintended conversion paths. A marked explicit\
    \ cannot be used as an implicit conversion path:\n\n![](img/c6a7aed193f785f4098546695e53f585_260_0.png)\n\
    \n```\nclass Student {\n  public:\n    // the following \"No Name\" constructor\
    \ cannot be used\n    // as an implicit conversion path from int to Student\n\
    \    explicit Student(int nStudentID);\n}\n```\n\n```\nStudent s = 1; // generates\
    \ compiler error\nStudent t(123456); // this is still allowed\n```\n\nThe declaration\
    \ of s does not implicitly invoke the Student(int) constructor since it is flagged\
    \ as \"explicitly invokable only.\" The explicit invoking of the constructor to\
    \ create the object t is still okay.\n\nA complete TypeConversion program to demonstrate\
    \ this principle is included with the online material at www.dummies.com/extras/cplusplus."
