  md: "The moral to this story is that the member initializer (that's the StudentId\
    \ id = nextStudentId++) is ignored if the member is constructed in the class constructor.\n\
    \n# Constructing a constant data member\n\nArgument construction solves a similar\
    \ problem with const data members as shown in the following example:\n\n```\n\
    class Mammal {\npublic:\n    Mammal(int nof) : numberOfFeet(nof) {}\nprotected:\n\
    \    const int numberOfFeet;\n}\n```\n\nOstensibly, a given Mammal has a fixed\
    \ number of feet (barring amputation). The number of feet can, be, declared const.\
    \ This constructor definition assigns a value to the variable numberOfFeet when\
    \ the object is created. The numberOfFeet cannot be modified once it's declared\
    \ and initialized.\n\n# Reconstructing the Order of Construction\n\nWhen there\
    \ are multiple objects, all with constructors, programmers usually don't care\
    \ about the order in which things are built. If one or more of the constructors\
    \ have side effects, however, the order can make a difference.\n\nThe rules for\
    \ the order of construction are as follows:\n\n+   - Local and static objects\
    \ are constructed in the order in their declarations are invoked.\n- Static objects\
    \ are constructed only once.\n- All global objects are constructed before main().\n\
    - Global objects are constructed in no particular order.\n- Members are destruct\
    \ in the order in which they are declared in the class within a given access type\
    \ (that is, all the public members are declared in order and all the protected\
    \ members in the order they're declared)\n- Objects are destructed in the opposite\
    \ order in which they were constructed."
  merge: -1
  pgno: 254
