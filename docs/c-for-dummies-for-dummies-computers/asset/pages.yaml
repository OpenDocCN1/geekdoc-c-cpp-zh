  md: '# Chapter 7: Storing Sequences in Arrays


    The program declares an array inputValues[] to be used to store the values input
    by the user. The main program passes this array to readArray(), along with the
    length of the array — readArray() cannot read more than 128 values if the user
    does not enter a negative number since that''s all the room allocated in the inputValues[]
    array.


    ![](img/c6a7aed193f785f4098546695e53f585_124_0.png)


    The array inputValues is declared as 128 integers. If you''re thinking that this
    must be more than, don''t count on it. No matter how large you make the array,
    always put a check to make sure you do not exceed the limits of the array. Writing
    more data than an array can cause your program to perform erratically and to crash.
    This is discussed in detail in Chapter 28.


    The main function calls displayArray() to print the contents of the array. Finally,
    the function calls sumArray() to add the elements in the array.


    The readArray() function takes two arguments: the integerArray[] which to store
    the values it reads and maxNumberOf, the maximum number of integer values where
    there is room at the inn. The function begins with a loop that reads integer values.
    Every non-negative value that the function is saved into integerArray[1]. The
    first element goes into integerArray[0], the second into integerArray[1], and
    so forth.


    Once the user enters a negative number, the program breaks out of the loop and
    returns the total NumberOfValues


    The displayArray() function also uses a for to traverse the elements of the array,
    starting at 0 and continuing to the last element, which is numElements-1. The
    final function, sumArray(), also iterates through the array but sums the elements
    stored there into accumulator, which returns to the caller.


    Notice, again, that the index in the displayArray() and sumArray() functions are
    initialized to 0 and not to 1. In addition, notice how the for loop terminates
    as soon as i reaches numElements. The output from a sample run appears as:


    ```

    This program sums values entered by the user

    Terminate the loop by entering a negative number


