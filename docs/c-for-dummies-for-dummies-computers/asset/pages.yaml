  md: "# 184 Part III: Introduction to Classes\n\nafter the colons is like the first\
    \ name — the order is similar to a Chinese\nname, family name first.\n\nYou use\
    \ :: operator to describe a non-member function by using a null class\nname. The\
    \ non-member function addCourse, for example, can be referred to\nas ::addCourse(int,\
    \ double), if you prefer. This is a function without a home.\n\nNormally the ::\
    \ operator is optional, but there are a few occasions when\nthis is not so, as\
    \ illustrated here:\n\n```\n// addCourse combine the hours and grade into\n//\
    \ a weighted grade\ndouble addCourse(int hours, double grade)\n{\n    return hours\
    \ * grade;\n}\nclass Student {\n    public:\n    // add a completed course to\
    \ the record\n    double addCourse(int hours, double grade)\n    {\n        //\
    \ call some external function to calculate the\n        // weighted grade\n  \
    \      double weightedGPA::addCourse(semesterHours,gpa);\n\n        // now add\
    \ in the new course\n        semesterHours += hours;\n\n        // use the same\
    \ function to calculate the weighted\n        // grade of this new course\n  \
    \      weightedGPA += ::addCourse(hours, grade);\n        gpa = weightedGPA /\
    \ semesterHours;\n\n        // return the new gpa\n        return gpa;\n    }\n\
    \    int semesterHours;\n    double gpa;\n};\n```\n\nHere, I want the function\
    \ Student::addCourse() to call the non-member\nfunction::addCourse(). Without\
    \ the :: operator, however, a call to addCourse()\nfrom Student refers to Student::addCourse().\
    \ This would result in the function\ncalling itself."
