    of these languages. UTF-8 uses a mixture of 8-, 16-, and 32-bit characters to
    implement almost every kanji or hieroglyph you can think of or remain compatible
    with simple 8-bit ASCII. UTF-16 uses a mixture of 16 and 32-bit characters to
    achieve an expanded character set, and UTF-32 uses for all characters.


