  md: "# 340 Part V: Security\n\n# Examining the Exception Mechanism\n\nTake a closer\
    \ look at the steps that the code goes through to handle an exception. When the\
    \ throw occurs, C++ copies the thrown object to some neutral place. It begins\
    \ looking for the end of the current try block.\n\nIf a try block is not found\
    \ in the current function, control passes to the calling function. A search is\
    \ then made of that function. If no try block is found, control passes to the\
    \ function that called it, and so on up the stack of functions. This process is\
    \ called unwinding the stack.\n\nAn important feature of stack unwinding is that\
    \ each stack is unwound, objects that go out of scope are destroyed just as though\
    \ the function had executed a return statement. This keeps the program from leaving\
    \ assets dangling.\n\nWhen the encased try block is found, the code searches for\
    \ the catch phrase immediately following the closing brace of the catch block.\
    \ If the thrown object matches the type of argument in the catch statement, control\
    \ passes to that catch phrase. If not, a check is made of the next catch phrase.\
    \ If no matching phrases are found, the code searches for the next level try block\
    \ in an ever-outward spiral until an appropriate catch can be found. If no catch\
