  md: "# Chapter 12: Adding Class to C++\n\n# Naming the current object\n\nHow does\
    \ the member function know what the current object is? It's not magic — the address\n\
    of the object is passed to the member function as an implicit and hidden first\
    \ argument. In other\nwords, the following conversion is taking place:\n\n```\n\
    s.addCourse(3, 2.5)\n```\n\nis like\n\n```\nStudent::addCourse(&s, 3, 2. 5)\n\
    ```\n\n(Note that you can't actually use the explicit syntax, this is just the\
    \ way C++ sees.)\nInside the function, this implicit pointer to the current object\
    \ has a name, in case you need to refer\nto it, this as in \"Which object? This\
    \ object.\" Get it? The type of this is always a pointer\nto an object of the\
    \ appropriate class.\n\nAnytime a member function refers to another member of\
    \ the same class without providing an\nobject explicitly, C++ assumes that the\
    \ programmer meant this. You can also refer to this explicitly,\nof you like.\
    \ I could have written Student:addCourse() as follows:\n\n```\ndouble Student::addCourse(int\
    \ hours, double grade)\n{\ndouble weightedGPA;\n    weightedGPA = this->semesterHours\
    \ * this->gpa;\n\n// now add in the new course\n    this->semesterHours += hours;\n\
    \    weightedGPA += hours * grade;\n    this->gpa = weightedGPA / this->semesterHours;\n\
    \nreturn this->gpa;\n}\n```\n\nThe effect is the same whether you explicitly include\
    \ this, in the preceding example, or leave it\nimplicit, as you did before.\n\n\
    # Scope Resolution (And I Don't Mean\nWell Your Telescope Works)\n\nThe :: between\
    \ a member and its class name is called the scope resolution\noperator because\
    \ it indicates the class a member belongs to. The class\nname before the colon\
    \ is like the family last name, but the function name"
