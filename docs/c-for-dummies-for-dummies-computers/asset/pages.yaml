  md: "# Chapter 20: Examining Virtual Member Functions: Are they for Real?\n\nYou\
    \ may be surprised that the default for C++ is early binding. The output of the\
    \ OverloadOverride program the way it appears is as follows:\n\n```\nWe're in\
    \ Student::calcTution\nWe're in Student::calcTution\nPress Enter to continue...\n\
    ```\n\nThe reason is simple, if a little dated. First, C++ has to act as much\
    \ C by default to retain upward compatibility with its predecessor. Second, polymorphism\
    \ adds a small amount of overhead to every function call in terms of data storage\
    \ and code needed to perform the call. The founders of C++ were concerned that\
    \ any additional overhead would be used as a reason not to adopt C++, as the system's\
    \ language of choice, so they made the more efficient binding the default.\n\n\
    To make a member polymorphic, the programmer must flag the function with the C++\
    \ keyword virtual, as shown in the following modification to the declaration in\
    \ the OverloadOverride program:\n\n```\nStudent {\npublic:\n    virtual void calcTution()\n\
    \    cout << \"We're in Student::calcTution\" << endl;\n}\n```\n\nThe keyword\
    \ virtual tells C++ that calcTution() is a polymorphic member function. It is\
    \ to say, declaring calcTution() virtual means that calls to it will be bound\
    \ late if there is any doubt as to the run-time type of the object with calcTution()\
    \ is called.\n\nExecuting the OverloadOverride program with calcTution() declared\
    \ virtual generates the following:\n\n```\nWe're in Student::calcTution\nWe're\
    \ in GraduateStudent::calcTution\nPress Enter to continue...\n```\n\nIf you're\
    \ comfortable with the debugger that comes with your C++ environment, you should\
    \ really single-step through this example. It is so cool to see the program single-step\
    \ into Student::calcTution() the first time that In() is called into GraduateStudent::calcTution()\
    \ on the second call. I don't think you can truly appreciate polymorphism until\
    \ you've tried it.\n\n![](img/c6a7aed193f785f4098546695e53f585_300_0.png)"
