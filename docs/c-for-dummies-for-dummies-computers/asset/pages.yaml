  md: "# Chapter 5: Controlling Program Flow\n\nThe value of expression must be an\
    \ integer (int, long, or char). The case values must be constants.\n\nAs of the\
    \ '14 standard, they can also be a constant expression. I don't describe constant\
    \ expressions until Chapter 10.\n\nWhen the switch statement is encountered, the\
    \ expression is evaluated and compared to the various case statements. Control\
    \ branches to the case that matches. If none of the case matches, control passes\
    \ to the default clause.\n\nConsider the following example snippet:\n\n```\nint\
    \ choice;\ncout << \"Enter a 1, 2 or 3\";\ncin >> choice;\n\nswitch(choice)\n\
    {\n    case 1:\n    // do \"1\" processing\n    break;\n\n    case 2:\n    //\
    \ do \"2\" processing\n    break;\n\n    case 3:\n    // do \"3\" processing\n\
    \    break;\n\n    default:\n    cout << \"You didn't enter a 1, 2 or 3\\n\";n}\n\
    ```\n\nOnce again, the switch statement has an equivalent; in this case, multiple\
    \ if statements. However, when there are more than two or three cases, the switch\
    \ structure is easier to understand.\n\nThe break statements are necessary to\
    \ exit the switch command. Without the break statements, control falls through\
    \ from one case to the next. (Look out below!)"
