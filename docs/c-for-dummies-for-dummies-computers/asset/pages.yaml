  md: '# Chapter 30: Ten Ways to Protect Your Programs from Hackers


    Maintaining a system log gives the system administrator the raw material that
    she needs to reconstruct what happened in the event that the unthinkable-happens
    and a hacker makes it into the system.


    # Follow a Good Development Process


    Every program should follow a well thought out, formal development process. This
    process should include at least the following steps:


    +   * Collect and document requirements, including security requirements.

    * Review design.

    * Adhere to a coding standard.

    * Undergo unit test.

    * Conduct formal acceptance tests that are based on the original requirements.


    In addition, peer reviews should be conducted at key points to verify that the
    requirements, code, and test procedures are high quality and meet company standards.


    I am not against New Age development techniques as recursive and agile development.
    Agile is not a synonym for sloppy — just because you are using an agile development
    process does not mean that you can skip any of the preceding steps.


    ![](img/c6a7aed193f785f4098546695e53f585_436_0.png)


    I am also not Process Nazi. The preceding steps do not need to be formal or drawn
    out for a small program involving one or two developers as would be for a project
    that employs dozens of systems analysts, developers, and testers. However, even
    small programs can contain hackable security flaws, it takes only one for your
    computer to become somebody''s bot.


    # Implement Good Version Control


    Version control is a strange thing. It''s natural to worry about version when
    you''re under the gun to get version 1.0 out the door and into the waiting users''
    outstretched hands. However, version control is an important topic that must be
    addressed early because it must be built into the program''s initial design and
    not bolted on later.'
