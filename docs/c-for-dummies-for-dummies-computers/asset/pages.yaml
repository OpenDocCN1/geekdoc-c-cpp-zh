    The neighborhood memory model is useful to explain how pointer arithmetic works.
    Consider a city block in which all houses are numbered sequentially. The house
    at 123 Main Street has 122 Main Street on one side and 124 Main Street on the
    other.


    Now it''s pretty clear that the house four down from 123 Main Street must be 127
    Main Street; thus, you can say `123 Main + 4 = 127 Main`. Similarly, if I were
    to ask how many houses are there from 123 Main to 127 Main, the answer would be
    `127 Main - 123 Main = 4`. (Just as an aside, a house is zero from itself: `123
    Main - 123 Main = 0).


    But it makes no sense to ask how far away from 123 Main Street is 4 or what the
    sum of 123 Main and 127 Main is. In similar fashion, you can''t add two addresses.
    Nor can you multiply an address, divide an address, square or take the square
    root — you get the idea. You can perform any operation that can be converted to
    addition or subtraction. For example, if you increment a pointer to 123 Main Street,
    it now points to the next door (124 Main, of course!).


