  md: "# Chapter 14: Protecting Members: Do Not Disturb 213\n\nA member function of\
    \ one class may be declared a friend of another class, as shown here:\n\n```\n\
    class Teacher {\n    // ...other members as well...\n    public:\n        void\
    \ assignGrades();\n}\nclass Student {\n    friend void Teacher::assignGrades();\n\
    \    public:\n        // same public members as before...\n    protected:\n  \
    \      int semesterHours; // hours earned toward graduation\n        double gpa;\n\
    \    void Teacher::assignGrades() {\n        // can access protected members of\
    \ Teacher from here\n    }\n```\n\nUnlike the non-member example, the member function\
    \ assignGrades() must be declared before the class Student can declare it to be\
    \ a friend.\n\nAn entire class can be named a friend of another. This has the\
    \ effect of making every member function of the class a friend:\n\n```\nclass\
    \ Student; // forward declaration\nclass Teacher {\n    protected:\n        int\
    \ noStudents;\n        Student *pList[100];\n    public:\n        void assignGrades();\n\
    }\nclass Student {\n    friend class Teacher; // make entire class a friend\n\
    \    public:\n        // same public members as before...\n    protected:\n  \
    \      int semesterHours; // hours earned toward graduation\n        double gpa;\n\
    }\n```\n\nNow, every member function of Teacher has access to the protected members\
    \ of Student. Declaring one class a friend of the other inseparably binds the\
    \ two classes together."
