    \ loop known as the do... while appears identical except the condition is not\
    \ tested until the bottom of the loop:\n\n```\ndo {\n //...the inside of the loop\n\
    \ } while (condition);\n```\n\nBecause the condition isn't tested until the end,\
    \ the body of the do... while is always executed at least once.\n\nThe condition\
    \ is checked only at the beginning of the while loop or at the end of the do...\
    \ while loop. If the condition ceases to be true during the execution of the loop,\
    \ control does not exit the loop until the condition is retested.\n\n![](img/c6a7aed193f785f4098546695e53f585_88_0.png)"
