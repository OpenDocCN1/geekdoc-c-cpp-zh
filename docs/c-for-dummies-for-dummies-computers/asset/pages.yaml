  md: "The answer is \"both.\" SleeperSofa inherits a member Bed::weight and a separate-member\
    \ Sofa::weight. Because they have the same name, unqualified references to weight\
    \ are now ambiguous. This is demonstrated in the following snippet, which generates\
    \ a compile-time error:\n\n```\n#include <iostream>\nvoid fn() {\n    SleeperSofa\
    \ ss;\n    cout << \"weight\" = \"\n    << ss.weight // illegal - which weight?\n\
    \    << \"\\n\";\n}\n```\n\nThe program must now indicate one of the two weights\
    \ by specifying the desired base class. The following code snippet is:\n\n```\n\
    #include <iostream>\nvoid fn() {\n    SleeperSofa ss;\n    cout << \"sofa:weight\
    \ = \"\n    << ss.Sofa::weight // specify which weight\n    << \"\\n\";}\n```\n\
    \nThis solution corrects the problem, specifying the base class in the application\
    \ function isn't desirable because it forces class information to leak outside\
    \ into application code. In this case, fn() has to know that SleeperSofa inherits\
    \ from Sofa. These types of so-called name collisions weren't possible with single\
    \ inheritance but are a constant danger with multiple inheritance.\n\n# Adding\
    \ Virtual Inheritance\n\nIn the case of SleeperSofa, the name collision on weight\
    \ was more than a accident. A SleeperSofa doesn't have a bed weight separate from\
