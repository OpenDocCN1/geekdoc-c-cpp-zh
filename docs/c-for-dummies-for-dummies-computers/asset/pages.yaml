  md: "# Making an honest class out of an abstract class\n\nThe subclass of an abstract\
    \ class remains abstract until pure virtual functions have been overridden. The\
    \ class Savings is not abstract because overrides the pure virtual function withdrawal()\
    \ with a perfectly good definition. The class Savings knows how to perform withdrawal()\
    \ when called on to do so. So does the class Checking, even if the answer is different.\
    \ Neither class is virtual because the function withdrawal() overrides the pure\
    \ virtual function in the base class.\n\n# Passing abstract classes\n\nBecause\
    \ you cant instantiate an abstract class, it might sound odd that it's possible\
    \ to declare a pointer or a reference to an abstract class. With polymorphism,\
    \ however, this isn't as crazy as it sounds. Consider the following code snippet:\n\
    \n```\nvoid fn(*pAccount);    // this is legal\nvoid otherFn()\n{\n    Savings\
    \ s; Checking c;\n\n    // this is legitimate Savings IS_A Account\n    fn(&s);\n\
    \    // same here\n    fn(&c);\n}\n```\n\nAccount is declared as a pointer to\
    \ an Account. However, it's understood that when the function is called, it will\
    \ be passed the address of some non-abstract subclass object such as Savings or\
    \ Checking.\n\nAll objects received by fn() will be of either class Savings or\
    \ class Checking (or some future equally non-abstract subclass of Account). The\
    \ function is assured that you will never pass an actual object of class Account\
    \ because you could never create one to pass in the first place."
