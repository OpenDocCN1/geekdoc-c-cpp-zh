  md: "# Avoiding code injection\n\nThe first rule of avoiding code inject is never,\
    \ ever, allow user input to be processed by a general-purpose language interpreter.\
    \ The error with the SQL-injection example was that the program accepted user\
    \ input as if it were always a date and inserted it into a SQL query that it then\
    \ shipped off to the database engine for processing.\n\nThe safest and most user-friendly\
    \ approach would have been to provide the user a calendar graphic from which he\
    \ could select the start and end dates. The program would then create a date based\
    \ on what the user clicked. If this is not possible, the program should have carefully\
    \ checked the input to make sure that the input was in the proper format for a\
    \ date, in which case yyyy/mm/dd — in other words, four digits followed by a slash\
    \ by two digits and a slash followed by two more digits. Nothing should be considered\
    \ acceptable input.\n\nSometimes you cannot be specific about the format. If you\
    \ must allow the user to enter flexible text, then you can at least avoid special\
    \ characters. For example, it's pretty impossible to do SQL injection without\
    \ either a single or double quote. You cannot insert HTML tags without using a\
    \ less (<) and greater than (>). Or you could take the approach that anything\
    \ other than ASCII text will not be tolerated:\n\n```\n// check some string 's'\
    \ to make sure it's straight ASCII\nsize_type off = s.find_first_not_of(\"abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789*\"\
    );\nif (off < npos) {\n  cerr << \"Error\";\n}\n```\n\nThis code searches the\
    \ string s for a character that is not one of the characters A through Z, a through\
    \ z, 0 through 9, or underscore. If it finds a character, the program rejects\
    \ the input.\n\nIf you allow only the Latin characters shown here, your application\
    \ will be usable in many foreign markets such as those that do not English character\
    \ sets (such as Arabic, Chinese, Hebrew, or Russian, to just a few). You may have\
    \ to take the opposite approach and look for the bad characters.\n\n![](img/c6a7aed193f785f4098546695e53f585_401_0.png)\n\
    \n# Overflowing Buffers for Fun and Profit\n\nThe second common hacker method\
    \ that I present is the dreaded buffer overflow. First you'll see a very small\
    \ program with a very big vulnerability. You'll see how this vulnerability comes\
    \ about and it can be exploited by hacker. Then you'll see a number of different\
    \ ways to mitigate the vulnerability."
