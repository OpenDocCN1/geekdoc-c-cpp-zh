  md: "# 242 Part III: Introduction to Classes\n\nRestart the program and repeat the\
    \ process, but stop on the constructor that caused the program to crash. You can\
    \ now single-step through the constructor until you find the problem. If you make\
    \ it all the way to the breakpoint in main(), the program did not crash while\
    \ constructing global objects.\n\n# Global objects construct in no particular\
    \ order\n\nFiguring out the order of construction of local objects is easy. An\
    \ order is implied by the flow of control. With globals, no such flow is available\
    \ to give order. All globals go into scope simultaneously — remember? Okay, you\
    \ argue, why can't the compiler start at the top of the file and work its way\
    \ down the list of global objects?\n\nThat would work for a single file (and I\
    \ presume that's what most compilers do). Programs in the real world consist of\
    \ several files that are compiled and then linked. Because the compiler has no\
    \ control over the order in which these files are linked, it cannot affect the\
    \ order in which global objects are constructed from file to file.\n\nMost of\
    \ the time, the order of global construction is pretty ho-hum stuff. Once in a\
    \ while, though global variables generate bugs that are extremely difficult to\
    \ track down. (It happens just often enough to make it worth mentioning in a book.)\n\
    \nConsider the following example:\n\n```\nclass Student {\npublic:\n    Student(int\
    \ id) : studentId(id) {\n    const int studentId;\n}\n\nclass Tutor {\npublic:\n\
    \    Tutor(Student& s) : tutoredId(s.studentId) {}\n    int tutoredId;\n}\n\n\
    // set up a student\nStudent randy(12344);\n\n// assign that student a tutor\n\
    Tutor janet(randy);\n```"
  merge: -1
  pgno: 257
- img_proc: true
  md: "# Chapter 16: Making Constructive Arguments\n\nHere the constructor for Student\
    \ assigns a student ID. The constructor for Tutor records the ID of the student\
    \ to help. The program declares a student randy and then assigns that student\
    \ janet.\n\nThe problem is that the program makes the implicit assumption that\
    \ randy is constructed before janet. Suppose it were the other way around. Then\
    \ Janet would be constructed with a block of memory that had not yet been turned\
    \ into a Student object and, therefore, garbage for a student ID.\n\nThe preceding\
    \ example is not too difficult to figure out and more than a little contrived.\
    \ Nevertheless, problems deriving from global objects being constructed in no\
    \ particular order can appear in subtle ways. To avoid this problem, don't allow\
    \ the constructor for one global object to refer to the contents of another global\
    \ object.\n\n![](img/c6a7aed193f785f4098546695e53f585_258_0.png)\n\n# Members\
    \ construct in the order in which they are declared\n\nMembers of a class are\
    \ constructed according to the order in which they're declared within the class.\
    \ This isn't quite as obvious as it may sound. Consider the following example:\n\
    \n```\nclass Student\n{\npublic:\n    Student (int id, int age) : nAge(age), nID(id)\n\
    \    const int nID;\n    const int nAge;\n    double dAverage = 0.0;\n};\n```\n\
    \nIn this example, nld is constructed before nAge, even though nld appears in\
    \ the second constructor's initialization list. The data member dAverage is constructed\
    \ last for the same reason. The only time you might detect a difference in the\
    \ construction order is when both members are an instance of a class that has\
    \ a constructor that has some mutual side effect.\n\n# Destructors destruct in\
    \ the reverse order of the constructors\n\nFinally, no matter in what order the\
    \ constructors kick off, you can be assured that the destructors are invoked in\
    \ the reverse order. (It's nice to know that at least one rule in C++ has no ifs,\
    \ ands, or buts.)"
