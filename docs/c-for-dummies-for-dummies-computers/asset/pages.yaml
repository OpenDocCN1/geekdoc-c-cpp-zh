  md: "# 244 Part III: Introduction to Classes\n\n# # Constructing Arrays\n\nWhen\
    \ you declare an array, each element of the array must be constructed. For example,\
    \ the following declaration calls the default Student constructor five times,\
    \ for each member of the array:\n\n```\nStudent s[5];\n```\n\nThe 2011 standard\
    \ allows you to invoke a constructor other than the default constructor using\
    \ an initializer list, as shown in this truncated example program (the full program\
    \ is available in the online material at www.dummies.com/extras/cplusplus):\n\n\
    ![](img/c6a7aed193f785f4098546695e53f585_259_0.png)\n\n```\n// ConstructArray\
    \ - construct an array of objects\n\n// ...same Student class with overloaded\
    \ constructors...\nint main(int argc, char* argv[]) {\n    // the following invokes\
    \ three different constructors\n    Student s[][\"Marian Haste\", \"Pikup Andropov\"\
    ];\n    Student t[]{{\"Jack\", 0, 0.0}, {\"Scruffy\", 12, 2.5]];\n\n    // wait\
    \ until user is ready before terminating program\n    cout << \"Press Enter to\
    \ continue...\" << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n    return\
    \ 0;\n}\n```\n\nThe array s is created with two members by calling the Student(const\
    \ char*) twice. The array i is constructed with the Student(const char*, int,\
    \ double). The output of this program appears follows:\n\n```\nconstructing freshman\
    \ Marian Haste\nconstructing Pickup Andropov\nconstructing transfer Jack\nconstructing\
    \ transfer Scruffy\nPress Enter to continue...\n```\n\n![](img/c6a7aed193f785f4098546695e53f585_259_1.png)\n\
    \nA string of objects contained within braces is known as an initializer list."
