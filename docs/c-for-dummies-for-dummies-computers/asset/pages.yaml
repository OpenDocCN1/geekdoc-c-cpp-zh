  md: "# Simulating real-world objects\n\nReal-world accounts have data-type properties\
    \ such as account numbers and balances, the same as the Savings class. This makes\
    \ Savings a good starting point for describing a real account. But real-world\
    \ accounts do things. Savings accounts accumulate interest; CDs charge a substantial\
    \ penalty for early withdrawal — stuff like that.\n\nFunctional programs \"do\
    \ things\" through functions. A C++ program might call strcmp() to compare two\
    \ character strings or max() to return the maximum of two values. In fact, Chapter\
    \ 23 explains that even stream I/O (cin >>) is a special form of function call.\n\
    \nThe Savings class needs active properties of its own if it's to do a good job\
    \ of representing a concept:\n\n```\nclass Savings {\npublic:\n    double deposit(double\
    \ amount)\n    {\n        balance += amount;\n        return balance;\n    }\n\
    \    unsigned accountNumber;\n    double balance;\n}\n```\n\nIn addition to the\
    \ account number and balance, this version of Savings includes the function deposit().).\
    \ This gives Savings the ability to control its own future. The class Savings\
    \ needs a function accumulateInterest(), and the class CD a function to penalizeForEarlyWithdrawal().\n\
    \nFunctions defined in a class are member functions.\n\n# Why bother with member\
    \ functions?\n\nWhy should you bother with member functions? What's wrong with\
    \ the good old' days of functional programming?\n\nI'm using the term \"functional\
    \ programming\" synonymously with \"procedural programming\", the way programming\
    \ was done before object-oriented programming came along.\n\n![](img/c6a7aed193f785f4098546695e53f585_193_0.png)"
