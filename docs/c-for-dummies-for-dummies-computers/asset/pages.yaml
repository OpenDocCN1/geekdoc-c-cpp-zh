  md: '# Chapter 24: Handling Errors — Exceptions


    ![](img/c6a7aed193f785f4098546695e53f585_354_0.png)


    Through a not-clever feature called an exception specification, you can add the
    type of objects that factorial() throws to its declaration. At one time, someone
    thought this would be a good idea, but times changes. Exception specifications
    were never mandatory and have been deprecated in the 2011 standard. Exception
    specifications are not presented in this book.


    # Justifying a New Error Mechanism?


    What''s wrong with error returns like FORTRAN used to make? Factorials cannot
    be negative, so I could have said something “Okay, if factorial() detects a negative
    number, it returns the actual value indicates the source of the problem. What''s
    wrong with that? That''s how it was done for ages ("If it was not good enough
    for grandpa.. ”)


    Unfortunately, several problems arise. First, although it''s true that the result
    of a factorial can''t be negative, other functions aren''t so lucky. For example,
    you can''t take the log of a negative number either, logarithms can be either
    negative or positive. There''s no value that a logarithm can return.


    Second, there''s so much information that you can store in an integer. Maybe you
    have -1 for “argument is negative” and -2 for “argument is too large”. But, if
    the error is too large, you want to know what the argument is because information
    might help you debug the problem. There''s no place to store that type of information.


    Third, the processing of error returns is optional. Suppose someone writes factorial()
    so that it fulfills the argument and returns a negative number if it is out of
    range. If a function that calls factorial() doesn''t check the error, returning
    an error value doesn''t do any good. You can make all kinds of menacing threats,
    such as “You will check your error returns or else,” the programmer may have the
    best of intentions, you all know that people get lazy and return to their old,
    non-checking ways.


    Even if you do the error return from factorial() or any other function, what can
    the function do with the error? It can probably do nothing than output an error
    message of its own and return another error indication to the caller, who probably
    does the same. Pretty soon, there''s more error detection than “real” code and
    it''s all mixed together.


    The exception addresses these problems by removing the error path from the normal
    code path. Furthermore, exceptions make error handling obligatory. If your function
    doesn''t handle the exception, control passes the chain of called functions until
    C++ finds a function to handle the error. This also gives you the flexibility
    to ignore errors that you can''t do about anyway. The functions that can actually
    handle the problem need to catch the exception.'
