  md: '# 274 Part IV: Inheritance


    C++ allows one class to inherit another class as follows:


    ```

    class Student

    {\};

    class GraduateStudent : public Student

    {\};

    ```


    Here, a GraduateStudent inherits all the members of Student. Thus, a GraduateStudent
    IS_A_Student. (The capitalization of IS_A stresses the importance of this relationship.)
    If course, GraduateStudent may also contain other members that are unique to a
    GraduateStudent.


    # Do I Need My Inheritance?


    Inheritance was introduced into C++ for several reasons. Of course, the major
    reason is the capability of expressing the inheritance relationship. (ll return
