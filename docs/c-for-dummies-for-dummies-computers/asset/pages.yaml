    # Tips for Using Templates


    You should remember a few things when using templates. First, no code is generated
    for a template. (Code is generated after the template is converted into a concrete
    class or function.) This implies that a cpp source file is almost never associated
    with a class template. The entire class template definition, including all the
    member functions, are usually contained in an include file so that it can be available
    for the compiler to expand.'
