    # Counting


    You cannot use floating-point variables in applications where counting is important.
    It includes C++ constructs that count. C++ can verify which number value is meant
    by a given floating-point number.


    For example, it is clear to you and me that 1.0 is 1 but not so clear to C+. What
    about 0.9 or 1.1? Should these also be considered as 1? C++ avoids the problem
    by insisting on using int when counting is involved.


    # Calculation speed


    Historically, a computer processor can process integer arithmetic faster than
    floating-point arithmetic. While, a processor can add 1 million integer numbers
    in a given amount of time, the same processor may be able to perform only 200,000
    floating-point calculations during the period.


    Calculation speed is becoming less of a problem as microprocessors get faster.
    In addition, today''s general-purpose microprocessors include special floating-point
    circuit to increase the performance of these operations. However, arithmetic on
    integer values is just a hell lot easier and faster than performing the same operation
