  md: "# Part I: Getting Started with C++ Programming\n\n# Looping while a condition\
    \ is true\n\nThe simplest form of looping statement is the while loop. Here's\
    \ what the while loop looks like:\n\n```\nwhile(condition)\n    // repeatedly\
    \ executed as long as condition is true\n```\n\nThe condition is tested. This\
    \ condition could be if var > 10 or if var == var2 or any other example you might\
    \ think of as it returns a value of true or false. If the condition is true, the\
    \ statements within the braces are executed. Upon encountering the closed brace,\
    \ C++ returns control to the beginning, and the process starts over. If the condition\
    \ is false, control passes to the first statement after the closed brace. The\
    \ effect is that the C++ code within the braces is executed as long as the condition\
    \ is true. (Kind of reminds me of how I get to walk the yard with my dog until\
    \ she...well, until we're done.)\n\nIf the condition were the first time, what\
    \ would make it be false in the future? Consider the following example program:\n\
    \n```\n// WhileDemo    input a loop count. Loop while\n//             outputting\
    \ astring arg number of times.\n#include <cstdio>\n#include <cctype>\n#include\
    \ <iostream>\nusing namespace std;\n\nint main(int nNumberofArgs, char* pszArgs[])\
    \ {\n    // input the loop count\n    int nLoopCount;\n    cout << \"Enter loop\
    \ count: \";\n    cin >> nLoopCount;\n\n    // now loop that many times\n    while\
    \ (nLoopCount > 0) {\n        nLoopCount = nLoopCount - 1;\n        cout << \"\
    Only \" << nLoopCount\n             << \" loops to go\" << endl;\n    }\n}\n```"
