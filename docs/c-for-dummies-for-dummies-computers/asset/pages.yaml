    \ C++ gives it the name this. this is a keyword in every object method \"the current\
    \ name.\" This is illustrated in the following code snippet:\n\n```\nclass SC\
    \ {\npublic:\n    void dyn(int a); // like SC::dyn(SC *this, int a)\n    static\
    \ void stat(int a); // like SC::stat(int a)\n\nvoid fn(SC& s {\n    s.dyn(10);\
    \ //-converts to-> SC::dyn(&s, 10)\n    s.stat(10); //-converts to-> SC::stat(10)\n\
    ```\n\nThat is, the function dyn() is interpreted almost as though it were declared\
    \ void SC::dyn(*this, int a). The call to dyn() is converted by the compiler as\
    \ shown, with the address of s passed as the first argument. (You can't actually\
    \ write the call with this, but this is what the compiler is doing.)\n\nReferences\
