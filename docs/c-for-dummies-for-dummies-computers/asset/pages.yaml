  md: '# 322 Part V: Security


    TIP


    Don''t forget to delete the pFileStream object if the open fails. These are the
    sneaky guys memory leaks creep in.


    The program reads integer values from the object referenced by fileStream until
    either fail() or the program reaches the end-of-file as indicated by the member
    function eof().


    TIP


    Let me warn you one time: Not is nothing returned from reading an input stream
    that has an error, but also the buffer comes unchanged. This program can easily
    cause the false conclusion that it has just read the same value previously read.
    Furthermore, eof() will never return a true on an input stream that has an error.


    ![](img/c6a7aed193f785f4098546695e53f585_337_0.png)


    # Don''t overflow that buffer!


    If you look closely at the open() method in the StreamInput example, you''ll see
    another way to make sure that the operator doesn''t overflow the buffer. Let''s
    review. I could have used something like the following:


    ```

    char fileName[80]; // any array size is possible

    cin >> fileName; // input the name of the file to open

    ```


    You can probably find code like this in the early chapters of this book (when
    you were still using C+ wheels). The problem with this is that nothing the extractor
    that the buffer is only 80 characters long — it will continue to read until it
    sees a newline, which might be thousands of characters long.


    Well,  buffer is a bit small. How about we increase the buffer size to 256 characters?
    That sorts of misses; the implicit assumption you are making with this type of
    approach is that buffer overflow is the result of an honest mistake (and a very
    long filename!). More and more is not the case. Malicious users find ways to overflow
    these fixed size buffers all the time. Major worms have been launched on the backs
    of buffer overflow attacks (I will explain buffer overflows in Chapter 28).


    One approach to avoiding buffer overflow that you have seen in early chapters
    is to use the get-line() method to limit the size of the buffer to the number
    of characters that the program will:


    ```

    char fileName[80]; // read more than 80 chars

    cin.getline(fileName, 80);

    ```


    This code reads a line of input (up to the next newline character) but not more
    than 80 characters that''s the size of the buffer. Any characters are not left
    for the next call to getline().


    Another approach is to make the buffer size fit the number of available characters.
    The string class is smart enough to dynamically resize the buffer to fit the available
    data:


    ```

    string fileName;

    cin >> fileName; // string sizes buffer to fit amount of data

    input

    ```'
