  md: '# 34 Part I: Getting Started with C++ Programming


    Any reader who''s algebra realizes right off that the mathematician has introduced
    the variables x and y. But C++ isn''t smart. (Computers may be fast, but they''re
    stupid).


    You have to announce each variable to C++ before you can use it. You have to say
    something something like this:


    ```

    int x;

    x = 10;


    int y;

    y = 5;

    ```


    These lines of code declare that a variable x exists, is of type int, and has
    the value 10; and that variable y of type int also exists with the value 5. (The
    next section discusses variables.) You can declare variables (almost) anywhere
    you want in your program — as long as you declare the variable before you use
    it.


    # Declaring Different Types of Variables


    If you''re on terms with math (and who isn''t?), you probably think of a variable
    in mathematics as an amorphous box capable of holding whatever you might choose
    to store in it. You might easily write something like the following:


    ```

    x = 1

    x = 2.3

    x = "this is a sentence"

    ```


    Alas, C++ is not flexible. (On the other hand, C++ can do things that people can''t,
    such as adding a billion numbers or so in a second, let''s not get too picky.)
    To C++, there are different types of variables as there are different types of
    storage bins. Some storage bins are so small that they can hold only a single
    number. It takes a larger bin to handle a sentence.


    ![](img/c6a7aed193f785f4098546695e53f585_49_0.png)


    Some computers try harder to accommodate the programmer by allowing to place different
    types of data in the same variable. These languages are called weakly typed languages.
    C++ is a strongly typed language — it requires the programmer to specifically
    declare each variable along with its exact type.


    The variable type int is the C++ equivalent of an integer — a number that has
    no fractional part. (Integers are also known as counting numbers or whole numbers.)'
