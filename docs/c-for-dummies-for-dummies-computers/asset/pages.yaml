  md: '# Chapter 11: Examining Object-Oriented Programming 173


    The remaining chapters in this part demonstrate how the object-oriented language
    features of C++ address these problems.


    ![](img/c6a7aed193f785f4098546695e53f585_188_0.png)


    In real life, it isn''t quite pure as I make it sound here. I can''t spend the
