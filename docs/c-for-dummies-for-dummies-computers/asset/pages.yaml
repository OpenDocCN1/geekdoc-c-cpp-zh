  md: '# Chapter 1: Writing Your First C++ Program


    Although C++ may ignore whitespace, it doesn''t ignore case. In fact, C++ is case
    sensitive to the point of obsession. The variable fullspeed and the variable Fullspeed
    have nothing to do with each other. The command int is completely understandable,
    C++ has no idea what INT means. See what I mean about fast but stupid compilers?


    # Variable declarations


    The line int celcius; is a declaration statement. A declaration is a statement
    that defines a variable. A variable is a "holding tank" for a value of type. A
    variable contains a value, such as a number or a character.


    The term variable stems from algebra formulas of the following type:


    | x = 10 |

    | y = 3 * x |


    In the second expression, y is set equal to 3 times x, but what is x? The variable-x
    acts as a holding tank for a value. In this case, the value of x is 10, but we
    could have just well set the value of x to 20 or 30 or -1. The second formula
    makes no matter what the value of x is.


    In algebra, you''re allowed but not required to begin with a statement such as
    x = 10. In C++, the programmer must define the variablex before she can use it.


    In C++, a variable has a type and a name. The variable defined on line 11 is celcius
    and declared to hold an integer. (Why they couldn''t have just said integer instead
    of int, I''ll never know. It''s just one of those you live with.)


    The name of a variable has no particular significance to C++. A variable may begin
    with the letters A through Z, the letters a through z, or an underscore (_). All
    subsequent characters must be a letter, a digit 0 through 9, or an underscore.
    Variable names can be as long as you want to make them.


    > TIP Variable names begin with a lowercase letter. Each new word within a variable
    begins with a capital letter, as in myVariable.


    > TIP To make variable names short but descriptive. Avoid names such as x because
    x has no particular meaning. A variable name such as lengthOfLine Segment is much
    more descriptive.'
