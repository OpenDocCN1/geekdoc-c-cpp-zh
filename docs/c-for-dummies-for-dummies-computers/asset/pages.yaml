    \ the argument type is flagged with the & property (see Chapter 8). However, by\
    \ default, C++ passes arguments to functions by value. (You can check Chapter\
    \ 6 on this, if you interest.)\n\nComplex, user-defined classes are passed the\
    \ same as simple int values, as shown in the following PassObjVal program:\n\n\
    ```\n// PassObjVal attempts to change the value of an object in a function fail\
