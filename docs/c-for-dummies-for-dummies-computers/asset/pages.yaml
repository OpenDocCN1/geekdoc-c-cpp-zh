    Here the operator is saying "Execute MyProgram" but read standard input from InputFile.txt
    instead of the keyboard and send what would otherwise go to the standard output
    to the DefaultOut.txt.


    Rerouting input and output comes from the DOS prompt and under all versions of
    Unix and Linux. It''s the easiest way to perform file input/output when you''re
    trying to write something quick and dirty.


    By default, the cerr objects output to the display just like cout, except it is
    rerouted — rerouting cout-type default output to a file does not reroute cerr
    output. This allows a program to display error messages to the operator even when
    cerr has been rerouted.


    Error messages should be sent to cerr rather than cout in case the operator has
    rerouted output.


    The wcin, wcout, and wcerr are wide version of standard input, output, and error,
    respectively. These are designed to handle Unicode symbols:


    ```

    cout << "this is narrow output" << endl;

    wcout << "LThis is wide output" << endl;

    ```


    # Stream Input/Output


    The classes istream and ostream defined in the file ifstream are subclasses of
    istream and ostream designed to perform stream input and output to disk files.
    You can use the same extractors and inserters as istream and ostream objects that
    you''ve been using on cin and cout.


    The istream is actually an instantiation of the template class basic_istream<T>
    with T set to char. I discuss template classes in Chapter 26. The basic_istream<T>
    template class is instantiated with other types to provide different types of
    input classes. For example, the wide stream class wistream is based on the same
    basic_istream<T> with T set to wchar_t. The ostream is the same as basic_ostream<char>.


    The classes istream and ostream provide constructors used to open a file for input
    and output, respectively:


    ```

    iostream::istream(const char *pszFileName,

    ios_base::openmode mode = ios_base::in);

    ostream::ostream(const char *pszFileName,

    ios_base::openmode mode = ios_base::out|ios_base::trunc);

    ```'
