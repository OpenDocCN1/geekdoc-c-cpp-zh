    \ an array\n- Using the most common type of array — the character string\n\nAn\
    \ array is a sequence of variables that shares the same name and that is referenced\
    \ using an index. Arrays are useful little critters that allow you to store a\
    \ large number of values of the same type that are related in some way — for example,\
    \ the batting averages of all the players on the same team might be a good candidate\
    \ for storage within an array. Arrays can be multi-dimensional, too, allowing\
