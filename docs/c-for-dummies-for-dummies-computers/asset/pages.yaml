  md: '# # Chapter 11


    # # Examining Object-Oriented Programming


    **In This Chapter**


    +   - Making nachos

    - Reviewing object-oriented programming

    - Introducing abstraction and classification

    - Discovering why object-oriented programming is important


    What, exactly, is object-oriented programming? Object-oriented programming, or
    OOP as those in the know prefer to call it, relies on two principles you learned
    before you got out of Pampers: abstraction and classification. To explain, let
    me tell you a little story.


    # # Abstracting Microwave Ovens


    Sometimes when my son is and I am watching football (which only happens when my
    wife can''t find the switcher), I whip up a terribly unhealthy bath of nachos.
    I dump some chips on a plate, throw some beans, cheese, and lots of jalapeños,
    and nuke the whole mess in the microwave oven for five minutes. To use my microwave,
    I open the door, throw the stuff in, and punch a few buttons. After a few minutes,
    the nachos are done.


    Now for a minute about all the things I don''t do to use my microwave:


    +   - I don''t rewrite or change anything inside the microwave to get it to work.
    The microwave has an interface — the front panel with all the buttons and the
    little time display — lets me do everything I need to do.

    - I don''t have to reprogram the software used to drive the little processor inside
    my microwave, even if I cooked a different dish the last time I used the microwave.'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# 170 Part III: Introduction to Classes


    +   - I don''t look inside my microwave''s case.


    +   - Even if I were a microwave designer and knew all about the inner workings
    of a microwave, including its software, I would still use the same way to heat
    my nachos without thinking about all that inside.


    These are not profound observations. You can deal with only so much stress in
    your life. To reduce the number of things that you deal with, I work at a certain
    level of detail.


    ![](img/c6a7aed193f785f4098546695e53f585_185_0.png)


    In-oriented (OO) computerese, the level of detail at which you work is called
    the level of abstraction. To introduce another OO term while I have the chance,
    abstract away the details of the microwave''s innards.


    When I''m working on nachos, I view my microwave oven as a box. (I can''t worry
    about the innards of the microwave oven and still follow the Cowboys (the tube.)
    As long as I operate the microwave only through its interface (the keypad), there
    should be nothing I can do


    +   - Cause the microwave to enter an inconsistent state and crash.


    +   - Turn my nachos into a blackened, flaming mass.


    +   - Make the microwave (along with the surrounding house) burst into flames!


    # Preparing functional nachos


    Suppose I was to ask my son to write an algorithm for how make nachos. After he
    understood what I wanted, he would probably write "an open of beans, grate some
    cheese, the jalapeños," and so on. When it comes to the part about the microwave
    concoction, he would write something like "cook in the microwave for five minutes."


    That description is straightforward and complete. But it''s not the way a functional
    programmer would code a program to make nachos. Functional programmers live in
    a world of objects such as microwave ovens and other appliances. They tend to
    worry about flow charts with their myriad functional paths. In a functional solution
    to the nachos problem, the flow of control would pass my finger to the front panel
    and then to the internals of microwave. Pretty soon, flow would be winding around
    complex logic paths about how long to turn on the microwave tube and whether to
    sound the "come and get it" tone.


    In a world like this, it''s difficult to think in terms of levels of abstraction.
    There are no objects, no abstractions behind which to hide inherent complexity.'
