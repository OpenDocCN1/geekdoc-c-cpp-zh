  md: '# Chapter 11: Examining Object-Oriented Programming


    # Preparing object-oriented nachos


    In an object-oriented approach to making nachos, I would first identify the types
    of objects in the problem: chips, beans, cheese, and an oven. Then I would begin
    the task of modeling these objects in software, without regard to the details
    of how they will be used in the final program.


    While I am doing this, I''m said to be working (and thinking) at the level of
    the basic objects. I need to think about making a useful oven, but I don''t have
    to think about the logical process of making nachos yet. After all, the microwave
    designers didn''t think about the specific problem of making a snack. Rather,
    they set the problem of designing and building a useful microwave


    After the objects I have been successfully coded and tested, I can ratchet up
    to the next level of abstraction. I can start thinking at the nachos-making level,
    rather than the microwave-making level. At this point, I can pretty translate
    my son''s instructions directly into C++.


    # Classifying Microwave Ovens


    The answers my son gave to my questions from his understanding of our particular
    microwave as an example of the type of things called microwave ovens. In addition,
    my son sees microwaves as just a special type of oven, which itself is just a
    special type of kitchen appliance.


    In-oriented computer, the microwave in my kitchen is an instance of the class
    microwave. The class microwave is a subclass of the class oven, and the oven is
    a subclass of the class appliances. We say microwaves inherit their cooking properties
    from oven.


    ![](img/c6a7aed193f785f4098546695e53f585_186_0.png)


    Humans classify. Everything about our world is ordered into taxonomies. We do
    this to reduce the number of things we have to remember. For example, the first
    time you saw a hybrid car. The advertisement probably called the hybrid "unique,
    the likes of which have never been seen." But you and I know that that isn''t
    just so. I like hybrids and I will grant you that they have a lot of differences
    under the hood, but hey, a hybrid is still a car. As such, it'
  merge: -1
