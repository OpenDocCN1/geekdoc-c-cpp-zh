  md: "# Part I: Getting Started with C++ Programming\n\nIn C++, the branch statement\
    \ is implemented using the if statement:\n\n```\nif (m > n) {\n    // Path 1\n\
    \    // ...instructions to be executed if\n    // m is greater than n\n} else\
    \ {\n    // Path 2\n    // ...instructions to be executed if not\n}\n```\n\nThe\
    \ logical expression m > n is evaluated. If the result of the expression is true,\
    \ control passes down the marked Path 1 in the previous snippet. If the expression\
    \ is false, control passes to Path 2. The else clause is optional. If it is not\
    \ present, C++ acts as if it is present empty.\n\nActually, braces are not required\
    \ if there's only one statement to execute as part of the if. Originally, braces\
    \ were used only if there were two or more statements that you wanted to treat\
    \ as one. However, people quickly realized that it was cleaner and less error\
    \ prone if you used braces every time, no how many statements there are.\n\n![](img/c6a7aed193f785f4098546695e53f585_85_0.png)\n\
    \nThe following program demonstrates the if statement (note all the lovely braces):\n\
    \n```\n// BranchDemo - input numbers. Go down one path of the\n// program if the\
    \ first argument is greater\n// than the first or the other path if not\n#include\
    \ <ctime>\n#include <cstdlib>\n#include <iostream>\nusing namespace std;\n\nint\
    \ main(int nnumberOfArgs, char* pszArgs[]) {\n    // input the first argument...\n\
    \    int nArg1;\n    cout << \"Enter arg1: \";\n    cin >> nArg1;\n\n    // ...and\
    \ the second\n    int nArg2;\n    cout << \"Enter arg2: \";\n    cin >> nArg2;\n\
    \n    // now decide what to do:\n    if (nArg1 > nArg2)\n```"
