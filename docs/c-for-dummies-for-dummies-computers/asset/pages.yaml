- img_proc: true
  md: '# 422 Part VI: The Part of Tens


    One most trivial aspect of version control is knowing which version of the program
    you is using. Now this sounds kind of stupid, but believe me, it''s not. When
    a user calls up and says, "It does this when I click on that," the help desk really
    needs to know which version of the program the user is using. He could be describing
    a problem in his version that''s already fixed in the current version.


    A program should have an overall version number that either gets displayed when
    the program starts or is easily retrieveable by the user (or both). Usually the
    version number is displayed as part of the help system. In the code, this can
    be as simple as maintaining a global variable with the version number that gets
    displayed when the user selects HelpAbout. The programmer is responsible for updating
    this version number whenever a new version gets pushed out to production. This
    window should also display the version of any Web services that the program uses,
    if possible.


    A more pernicious aspect of version control is to roll new versions of the application
    to users. This includes both the code itself and changes to the data structures,
    such as database tables, that the application may access.


    The code-roll problem is trivial with browser-based Web applications — you simply
    load a new version onto the server, and the next time the user clicks on your
    page, he gets the new version. However, this problem is much more difficult for
    applications that install onto the user''s computer. The problem is that this
    is a great opportunity for hackers to exploit your application.


    Suppose for example that you have devised a really cool feature in your application.
    The user clicks on Update Now, and the application goes back to the server and
    checks for a new version. If a new version is available, the application automatically
    downloads the update and installs it.


    If a hacker figures out the protocol that your application uses for updating and
    if that protocol is not sufficiently secured, a hacker can convince your application
    on other people''s computers to download a modified version that she''s created,
    complete with malware of her own creation. Soon your entire user base is infected
    with some type of malware that you know about.


    I''m not saying that automatic updates can''t be done securely — obviously they
    can, or like Microsoft and Apple wouldn''t do them. I''m saying that if you choose
    the automatic-update route, you need to be very careful about how you implement
    security.


    Even if you go the old fashioned route and the user downloads a new MyApplication_Setup.exe
    that installs the new application, you need to worry about whether some hacker
    may have uploaded a version of your program'
