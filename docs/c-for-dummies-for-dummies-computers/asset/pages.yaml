  md: "# 384 Part V: Security\n\n+   - SQL is used almost universally in accessing\
    \ relational databases.\n- SQL is not the subject of this book.\n\nThis bullet\
    \ is important because I have no intent of teaching SQL just so you can follow\
    \ the examples presented here. If you don't already know SQL, it's sufficient\
    \ to say that SQL is interpreted at runtime. Very often, C++ statements will send\
    \ an SQL query to a separate database server and then process and display whatever\
    \ the server sends back. A typical SQL query might look like the following:\n\n\
    ```\nchar* query = \"SELECT FROM transactions WHERE\n    accountID='123456789';\n\
    results = submit(query);\n```\n\nThis code says SELECT all of the fields FROM\
    \ the transactions table WHERE accountID (presumably one of the fields in the\
    \ transaction) is equal to 123456789 (the user's id). The \"Submit\" library function\
    \ might send this query off to the database server. The database server would\
    \ respond with all the data it has on every transaction that the user has made\
    \ on this account, which would get stored into the collection results. The program\
    \ would iterate through results, probably displaying the transactions in a table\
    \ with each transaction on a separate row.\n\nThe user probably doesn't need much\
    \ data. Maybe just those transactions between startDate and endDate, two variables\
    \ that the program reads from the user's page. This more selective C++ program\
    \ might contain a statement like the following:\n\n```\nchar* query = \"SELECT\
    \ FROM transactions WHERE\n    accountID='123456789'\n    AND date > '\" + startDate\
    \ + \"' AND date < '\" + \n    endDate + \"'\\';\";\n```\n\nIf the user enters\
    \ 2013/10/1 for a startDate and 2013/11/1 for endDate, then the resulting query\
    \ that gets to the database is the following:\n\n```\nSELECT * FROM transactions\
    \ WHERE accountID='123456789' AND\n    date > '2013/10/1' AND date < '2013/11/1';\n\
    ```\n\nIn other words, all the transactions made in the month of October 2013.\
    \ That makes sense. What's the problem?\n\nThe problem arises if the program accepts\
    \ whatever the user enters as start and end dates and plugs them into the query.\
    \ It doesn't do any checking to make sure the user is entering just a date and\
