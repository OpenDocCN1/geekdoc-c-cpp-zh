  md: '# 316 Part V: Security


    ```

    //for output we have:

    ostream& operator<< (ostream& dest, char *pSource);

    ostream& operator<< (ostream& dest, string &sDest);

    ostream& operator<< (ostream& dest, int source);

    ostream& operator<< (ostream& dest, double source);

    //...and so it goes.

    ```


    When overloaded to process I/O, operator() is called the extractor and operator()
    is called the inserter. The class istream is the basic class for input from a
    file or a device such as the keyboard. C++ opens the istream object when the program
    starts. Similarly, istream is the basis for output. The prototypes are for inserters
    and extractors for pointers to null terminated character strings (like “Name”),
    for string objects, for ints, and for doubles.


    # Default stream objects


    C++ adds a chunk of code to the front of your program that executes before main()
    gets control. Among other things, this code creates the default input/output objects
    shown in Table 23-1.


    | Table 23-1 Standard Stream I/O Objects |

    | Object | Class | Purpose |

    | cin | istream | Standard char input |

    | wcin | wstream | Standard wchar_t“wide char” input |

    | cout | istream | Standard char output |

    | wcout | wstream | Standard wchar_t“wide char” output |

    | cerr | istream | Standard error output |

    | wcerr | wstream | Standard error wchar_t“wide char” output |

    | clog | istream | Standard log |

    | wlog | istream | Standard wchar_t“wide char” log |


    You''ve seen cin and cout as they read input from the keyboard and output to the
    display, respectively. The user can reroute standard input and standard output
    to a file when he executes a program as follows:


    ```

    C:>MyProgram <InputFile.txt >DefaultOut.txt

    ```'
