  md: "# 312 Part V: Security\n\n# # The Move Constructor and Move Operator\n\n![](img/c6a7aed193f785f4098546695e53f585_327_0.png)\n\
    \nThis entire subject is new to C++'11.\n\nCopy constructors and copy assignment\
    \ operators are neat for retaining simple semantics for classes that you create.\
    \ However, since their inception, C++ programmers have not been happy with the\
    \ inefficiencies that they can create. Consider the following example:\n\n```\n\
    MyContainer fn(int size)\n{\n  MyContainer localMC(size);\n  return mc;\n}\nMyContainer\
    \ mc(fn());\n```\n\nIn this case, the function fn() creates a MyContainer object\
    \ localMC and returns it to the caller by value. This simple call could result\
    \ in the same MyContainer object being copied not once but twice:\n\n+   1. As\
    \ part of the return, C++ must make a temporary copy of the localMC object onto\
    \ the return stack to the caller.\n2. The subsequent call to the copy constructor\
    \ copies the contents of the temporary object into the local mc object.\n\nThe\
    \ second copy is unnecessary. Since the temporary object is about to be destroyed\
    \ away, the copy constructor could just \"take\" the assets from the temporary\
    \ object rather than go through the hassle of making a copy of something that's\
    \ about to be put back on the heap away. This is the essence of the move constructor.\n\
    \nThe move constructor looks like a copy constructor except for two things:\n\n\
    +   * A move constructor takes the resources from the source and gives them to\
    \ the target rather than copying.\n* The argument of the move constructor is of\
    \ type MyContainer&&, the double ampersand meaning \"only for temporary values.\"\
    \n\nThe following example program shows both the move constructor and move assignment\
    \ operator in action:"
