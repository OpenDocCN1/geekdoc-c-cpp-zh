  md: "# 200 Part III: Introduction to Classes\n\nUpon return from myFunc(), the mc\
    \ object goes out of scope. The pointer returned by myFunc() is not valid in the\
    \ calling function.\n\nThe problem of returning memory that's about to go out\
    \ of scope is discussed in Chapter 9.\n\nAllocating the object off the heap solves\
    \ the problem:\n\n```\nMyClass* myFunc()\n  MyClass* pMC = new MyClass;\n  return\
    \ pMC;\n\n```\n\nThe memory allocated off the heap is not returned when the variable\
    \ pMC goes out of scope.\n\nProgrammers allocate memory from the heap if they\
    \ don't want the memory to be lost when any particular variable goes out of scope.\
    \ The programmer is responsible for both allocating and returning heap memory.\n\
    \n# Allocating heaps of objects\n\nIt is also possible to allocate an array of\
    \ objects off the heap using the following syntax:\n\n```\nclass MyClass\n  public:\n\
    \    int nValue;\n  void fn(){\n    MyClass* pMC = new MyClass[5]\n\n    // return\
    \ individual members like any array\n    for (int i = 0; i < 5; i++)\n      pMC[i].nValue\
    \ = i;\n\n    // uses a different delete keyword to return memory\n    // to the\
    \ heap\n    delete[] pMC;\n  }\n\n```\n\nNotice that once allocated, pMC can be\
    \ used like any other array, with pMC[i] referring to the i-th object of type\
    \ MyClass. Notice also that you use the slightly different keyword delete[] to\
    \ return arrays of class objects to the heap."
  merge: -1
