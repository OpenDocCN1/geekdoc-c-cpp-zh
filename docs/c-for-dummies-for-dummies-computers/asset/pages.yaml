    This message from main\nPress Enter to continue...\n```\n\n![](img/c6a7aed193f785f4098546695e53f585_252_1.png)\n\
    \nNow you can see the syntax for invoking one constructor from another came from!\n\
    \n# Combining with this member initialization\n\nSo what happens when a constructor\
