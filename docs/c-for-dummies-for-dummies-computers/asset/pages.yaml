  md: "# Chapter 8: Taking a First Look at C++ Pointers\n\nJust as it is possible\
    \ to pass a pointer to a function, it is possible for a function to return a pointer.\
    \ A function that returns the address of a double is declared as follows:\n\n\
    ```\ndouble* fn(void);\n```\n\nHowever, you must be very careful when returning\
    \ a pointer. To understand the dangers, you must know something about variable\
    \ scope. (No, I don’t mean a variable rifle scope.)\n\n# Limited scope\n\nBesides\
    \ being a mouthwash, scope is the range over which a variable is defined. Consider\
    \ the following code snippet:\n\n```\n// the following variable is accessible\
    \ to\n// all functions and defined as long as the\n// program is running (global\
    \ scope)\nint intGlobal;\n\n// the following variable intChild is accessible\n\
    // only to the function and is defined only\n// as long as C++ is executing child()\
    \ or a\n// function which child() calls (function scope)\nvoid child(void)\n{\n\
    \    int intChild;\n}\n\n// the following variable intParent has function\n//\
    \ scope\nvoid parent(void)\n{\n    int intParent = 0;\n    child();\n\n    int\
    \ intLater = 0;\n    intParent = intLater;\n}\n\nint main(int nArgs, char* pArgs[])\n\
    {\n    parent();\n}\n```\n\nThis program starts with the declaration of a variable\
    \ intGlobal. The variable exists from the time the program begins executing until\
    \ it terminates. We say that intGlobal \"has program scope.\" We also say that\
    \ the variable \"goes into scope\" even before the function main() is called."
