  md: '# 172 Part III: Introduction to Classes


    shares all of (or at least most of) the properties of other cars. It has a steering
    wheel, seats, a motor, brakes, and so on. I bet I could even drive one without
    first reading the owner''s manual.


    I don''t have to clutter my limited storage with all the things that a hybrid
    has in common with other cars. All I have to remember "hybrid is a car that..."
    and tack on those few things that are unique to a hybrid (like the price tag).
    I can go further. Cars are a subclass of wheeled vehicles along other members,
    such as trucks and pickups. Maybe wheeled vehicles are a subclass of vehicles,
    which includes boats and planes. And so and on.


    # Why Classify?


    Why do we classify? It sounds like a lot of trouble. Besides, people have been
    using the functional approach for so long, why change now?


    It may seem easier to design and build a microwave oven specifically for this
    problem, rather than build a separate, more generic object. Subject, for example,
    that I want to build a microwave to cook nachos and nachos only. I wouldn''t need
    to put a front panel on it, other than a Start button. I always cook nachos the
    same amount of time, so I could dispense with all that Frost and Temp Cook nonsense.
    My nachos-only microwave would hold only one flat plate. Three cubic feet of space
    would be wasted on nachos.


    For that matter, I can dispense with the concept of "microwave oven" altogether.
    All I really is the gusts of the oven. In the recipe, I put the instructions to
    make it: "Put nachos in the box. Connect the red wire to the black wire. Bring
    the radar tube up to about 3,000 volts. Notice a slight hum. Try not to stand
    close if you intend to have children." Like like that.


    The functional approach has some problems:


    +   Too complex: I don''t want the details of oven building mixed into the details
    of nach building. If I can''t define the objects and pull them out of the morass
    of details to deal separately, I must deal with all the complexities of the problem
    at the same time.


    +   Not flexible: Someday I may need to replace the microwave oven with some other
    type of oven. I should be able to do so as its interface is the same. Without
    being clearly delineated and developed separately, becomes impossible to completely
    remove an object type and replace it with another.


    +   Not reusable: Ovens are used to make lots of different dishes. I don''t want
    to create a new oven every time I encounter a new recipe. Having solved a problem
    once, it would be nice to be able to reuse the solution in future programs.'
