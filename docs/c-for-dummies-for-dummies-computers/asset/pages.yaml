  md: '# Chapter 21: Factoring Classes


    How does building a new account solve the problems? First, creating a new Account
    class is a more accurate description of the real world (whatever that is). In
    our concept of things (or at least in mine), there really is something known as
    an account. Savings and checking accounts are special cases of this more fundamental
    concept.


    In addition, the class Savings is insulated from changes to the class Checking
    (and vice versa). If the bank introduces a fundamental change to all accounts,
    you can modify it, and all subclasses will automatically inherit the change. But
    if the bank changes its policy only for checking accounts, you can modify just
    the Checking account class without affecting Savings.


    This process of pulling common properties from similar classes is the essence
    of class factoring.


    ![](img/c6a7aed193f785f4098546695e53f585_310_0.png)


    Factoring is legitimate if the inheritance relationship corresponds to reality.
    Factoring together a class Mouse and Joystick because they''re both hardware powering
    devices is legitimate. Factoring together a class Mouse and Display because they
    both make low-level operating system calls is not.


    # Implementing Abstract Classes


    As intellectually satisfying as factoring, it introduces a problem of its own.
    Return one more time to the bank account classes, specifically the common base
    class Account. Think for a minute about how you might go about defining the member
    functions defined in Account.


    Most Account member functions are no problem because both account types implement
    them in the same way. Implementing those common functions with Account:withdrawal()
    is different, however. The rules for withdrawing from a savings account are different
    than those for withdrawing from a checking account. You will have to implement
    Savings:withdrawal() differently than you do: Checking:withdrawal(). But how are
    you supposed to implement Account:withdrawal()?


    Let''s ask the bank manager for help. I imagine the conversation going


    +   “What are the rules for making a withdrawal from an account?” you ask.


    +   “What type of account? Savings or checking?” comes the reply.


    +   “From an account,” you say. “Just an account.”


    Blank look. (One might say a “blank bank look” . . . then again, maybe not.)'
