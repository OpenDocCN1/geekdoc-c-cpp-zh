  md: "# Chapter 8: Taking a First Look at C++ Pointers 127\n\n# # Passing by value\n\
    \nBy default, arguments are passed to functions by value. This has the-what surprising\
    \ result that changing the value of a variable in a function does not normally\
    \ change its value in the calling function. Consider the following example segment:\n\
    \n```\nvoid fn(int nArg) {\n  nArg = 10;\n  // value of nArg at this point is\
    \ 10\n}\nvoid parent(void) {\n  int n1 = 0;\n  fn(n1);\n  // value of n1 at this\
    \ point is still 0\n}\n```\n\nThe parent() function initializes the integer variable\
    \ n1 to 0. The value of n1 is then passed to fn(). Upon entering the function,\
    \ nArg is equal to 0, the value passed. *fn()* changes the value of nArg to 10\
    \ before returning to parent(). Upon returning to parent(), the value of n1 is\
    \ still 0.\n\nThe reason for this behavior is C++ doesn't pass a variable to a\
    \ function. (I'm not even sure what that would mean.) Instead, C++ passes the\
    \ value contained in the variable at the time of call. That is, the expression\
    \ is evaluated, even if it is just a variable name, and the result is passed.\n\
    \nIn the example, the value of n1, which is 0, is passed to fn(). What the function\
    \ does with that value has no effect on n1.\n\n# # Passing pointer values\n\n\
    Like any other intrinsic type, a pointer may be passed as an argument to a function:\n\
    \n```\nvoid fn(int* pnArg) {\n  *pnArg = 10;\n}\nnvoid parent(void) {\n  int n\
    \ = 0;\n  fn(&n); // this passes the address of i\n  // now the value of n is\
    \ 10\n}\n```"
