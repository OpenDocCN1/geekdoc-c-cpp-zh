  md: '# Part II: Becoming a Functional C++ Programmer


    Range-based for loops can be used only when C++ knows the size of the array at
    build time. A range-based for loop would not work within the displayArray() function,
    for example. This function is built to handle arrays of any size. You get really
    strange build time error messages when you use range-based loops on arrays where
    the size is not known. I have to say more about this in Chapter 26.


    # Defining and using arrays of arrays


    Arrays are adept at storing sequences of numbers. Some applications require sequences
    of sequences. A classic example of this matrix configuration is the spreadsheet.
    Lait out a chessboard, each element in the spreadsheet has both an x and a y offset.


    C++ implements the matrix as follows:


    ```

    int intMatrix[10] [5];

    ```


    This is 10 elements in one dimension and 5 in another, for a total of 50 elements.
    In other words, intMatrix is a 10-element array, each element of which is a 5-int
    array. As you might, one corner of the matrix is in intMatrix[0][0], while the
    other corner is intMatrix[9][4].


    Whether you consider intMatrix to be 10 elements in the x dimension or in the
    y dimension is a matter of taste. A matrix can be initialized in the same way
    that your array is:


    ```

    int intMatrix[2][3] = {{1, 2, 3}, {4, 5, 6}};

    ```


    This line initializes the 3-element array intMatrix[0] to 1, 2, 3; and the 3-element
    array intMatrix[1] to 4, 5, and 6.


    # Using Arrays of Characters


