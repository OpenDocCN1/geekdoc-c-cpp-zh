  md: '# 382 Part V: Security


    Then you get called to the Department Vice President''s office. Seems that hackers
    have found a way to get into your program from its interface to the Internet and
    transferred money from other peoples'' accounts into their own. Millions have
    been lost. Disaster! No promotion. Nobody will sit with you in the cafeteria.
    Your kids get bullied on the playground. You''ll have to keep your program now
    greatly reduced job.


    The point of this story is that real programs often have many interfaces unlike
    the simple programs in this book. For example, any program that reads a port or
    connects to a database is susceptible to being hacked.


    What is the hacker after:


    +   If you''re lucky, the hacker is doing nothing than exploiting some flaw in
    your program''s logic to cause it to crash. As long as the program is crashed,
    no one else use it. This is called a Denial of Service (DoS) attack because it
    denies the service provided by your program to every-one.


    +   DoS attacks can be expensive because they can cost your company revenue from
    business that doesnt get conducted or customers who give in frustration because
    your program is not taking calls right now. And this doesn''t even include the
    cost of someone going into the code and find the susceptibility


    +   Some hackers are trying to get access to information that your program has
    access to but which the user has no right. A good example of this would be identity.


    The loss of information is more embarrassing as a good hacker may be able to use
    this information to turn around and steal. For example, armed with the proper
    credentials, the hacker can then call up a bank teller on the phone and order
    sums of money be transferred from our hacked customers'' accounts to one where
    he can subsequently-with the draws. This is commonly the case with SQL injection
    attacks, which I describe in the following section.


    +   Finally, hackers are after remote control of your computer. If your program
    opens a connection to the Internet and a hacker can get your program to execute
    the proper system calls, that hacker can turn your program into a remote terminal
    into your system. From there, the hacker can download his own program onto your
    machine, and from on you are said to be owned.


    Perhaps the hacker wants access to your accounts, where he can steal money, or
    maybe he just wants your itself. This is the case with groups of owned computers
    that what is known as a botnet.


    But does this work? Your bank program has a very limited interface. It asks you
    for his account number, his name, and the amount of his deposit. Nowhere does
    it say, "Would you like to take over this computer?" or "What extra code would
    you like this computer to execute?


