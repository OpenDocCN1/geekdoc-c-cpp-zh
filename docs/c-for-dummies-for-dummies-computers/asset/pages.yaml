  md: "# 156 Part II: Becoming a Functional C++ Programmer\n\n# Playing in your own\
    \ name sandbox\n\n(This is truly technical, feel free to skip this sidebar and\
    \ come back to later.) The authors of the C++ standard worry a lot about name\
    \ collisions. For example, besides my mathematical function log(x) that returns\
    \ the logarithm of x, suppose in another context I have written a function log(x)\
    \ that writes status to a system log. Clearly, two different functions with the\
    \ same arguments can coexist in one program. This is known as a name collision.\n\
    \nTo avoid this, C++ allows the programmer to bundle declarations into a namespace\
    \ using the keyword of the name:\n\n```\nnamespace Mathematics\n{\n    double\
    \ log(double x)\n    {\n        // ...the definition of the function...\n    }\n\
    }\nnamespace SystemLog\n{\n    int log(double x)\n    {\n        // ...log the\
    \ value to file...\n    }\n}\n```\n\nThe namespace becomes part of the extended\
    \ name of the function. Thus, the following code snippet actually logs the logarithm\
    \ of a value:\n\n```\nvoid myFunc(double x)\n{\n    // invoke the logarithm function...\n\
    \    double dl = Mathematics::log(x);\n\n    // now log it to disk\n    SystemLog::log(dl);\n\
    }\n```\n\nFortunately, you don't have to specify the namespace every single time.\
    \ The keyword allows the programmer to specify a default namespace for a given\
    \ function:\n\n```\nusing double Mathematics::log(double)\nvoid myFunc(double\
    \ x)\n{\n    // the default is the mathematics version...\n    double dl = log(x);\n\
    \n    // however, the other version is still accessible by\n    // explicitly\
    \ specifying the namespace\n    SystemLog::log(dl);\n}\n```"
