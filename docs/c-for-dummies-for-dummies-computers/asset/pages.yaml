    123₁₀ = 0 * 2⁷ + 1 * 2⁶ + 1 * 2⁵ + 1 * 2⁴ + 0 * 2³ + 1 * 2¹ + 1 * 2⁰

    123₁₀ = 0 * 2⁷ + 1 * 2⁶ + 1 * 2⁵ + 1 * 2⁴ + 1 * 2³ + 0 * 2¹ + 1 * 2⁰ = 0111011₂

