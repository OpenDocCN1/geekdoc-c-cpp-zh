    # The Automatic Copy Constructor\n\nLike the default constructor, the copy constructor\
    \ is important; important that C++ thinks no class should be without one. If you\
    \ don't provide your own copy constructor, C++ generates one for you. (This differs\
    \ from the default constructor that C++ provides unless your class has constructors\
    \ defined for it.)\n\nThe copy constructor provided by C++ performs a member-by-member\
    \ copy of each data member. You can see this in the following DefaultCopyConstructor\
    \ program. (I left out the definition of the Student class to save space — it's\
