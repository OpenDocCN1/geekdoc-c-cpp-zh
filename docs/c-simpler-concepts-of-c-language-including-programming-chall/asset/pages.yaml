- pgno: 234
  md: '# 15

    CHAPTER Coding Guidelines


    # 15.1. CODING STANDARDS - THE DEFINITION


    A coding standard is a set of rules describing how your code should look, which
    features of the programming language you will use and how possibly tools should
    be used to write the code. It can of course be as specific as you want it to.


    Obviously, different programming environments mean insurmountable differences.
    You can use your coding conventions to describe these differences. Especially
    if your team is already familiar with an environment, it is useful to describe
    duplicate behaviour that might not be available in the new environment. For example,
    if your team is new to Java, you could describe how to achieve constructs familiar
    to C++ programmers like conditional compilation or assertions.


    With rapid technological changes it is often difficult for development teams to
    identify the features that exist in newer versions and the pitfalls of using certain
    constructs. Languages like C++ and Java offer powerful constructs such as throwable
    exceptions or garbage collection. These techniques might be new to some members
    of your team. Although these new techniques usually make programs easier to understand,
    they can also have a major influence on the memory usage and general performance
    of your applications. Your coding conventions should warn about the possible abuse
    of these techniques.


    Coding conventions are only useful if they are in tune with the work your your
    team is currently doing. To ensure that they do not become obsolete, they have
    to be constantly updated and adapted to the latest technologies used by your team.


    # 15.2. THE PURPOSE


    The goal of these guidelines is to create uniform coding habits among software
    personnel in the engineering department so that reading, checking, and maintaining
    code written by different people becomes easier. The intent of these standards
    is to define a natural style and consistency, yet to leave to the authors of the
    engineering department source code, the freedom to practice their craft without
    unnecessary burden.


    When a project adheres to common standards many good things happen:


    +   - Programmers can go into any code and figure out what''s going on, so maintainability,
    readability, and reusability are increased. Code walk through becomes less painful.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# 224 C-SIMPLER


    +   - New people can get up to speed quickly.

    - People new to a language are spared the need to develop a personal style and
    defend it to death.

    - People new to a language are spared making the same mistakes over and again,
    so reliability is increased.

    - People make fewer mistakes in consistent environments.

    - Idiosyncratic styles and college-learned behaviors are replaced with an emphasis
    on business concerns - high productivity, maintainability, shared authorship,
    etc.


    Experience over many projects points to the conclusion that coding standards help
    the project to run smoothly. They aren''t necessary for success, but they help.


    A mixed coding style is harder to maintain than a bad coding style. So it''s important
    to apply a consistent coding style across a project. When maintaining code, it''s
    better to conform to the style of the existing code rather than blindly follow
    this document or your own coding style.


    Since a very large portion of project scope is after-delivery maintenance or enhancement,
    coding standards reduce the cost of a project by easing the learning or re-learning
    task when code needs to be addressed by people other than the author, or by the
    author after a long absence. Coding standards ensure that the author need not
    be present for the maintenance and enhancement phase.


    # 15.3. THE LIMITATIONS


    One problem with coding standards is that there is no ISO, ANSI, or W3 standard.
    Therefore, every organization or group of programmers has to come up with its
    own set of coding standards. The objective of this document is to define coding
    standards and guidelines while coding for different technologies.


    # 15.4. COMMON PROGRAMMING STANDARDS


    In this section, we cover the coding standards in different sections in a broader
    sense. The following subsections cover the following generic topics:


    +   - Modularization

    - Data typing

    - Names

    - Organizing control structures

    - Program layout

    - Comments and (program) documentation


    # 15.4.1. Modularization


    A module is a collection of objects that are logically related. Those objects
    may include constants, data types, variables, and program units (e.g., functions,
    procedures, etc.). Note that objects in a module need not be physically related.
    For example, it is possible to construct a module using several different source
    files. Likewise, it is quite'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# CODING GUIDELINES


    to have several different modules in the same source file. However, the best modules
    are physically related as well as logically related; that is, all the objects
    associated with a module exist in a single source file (or directory if the source
    file would be too large) and nothing else is present.


    Modules contain several different objects including constants, types, variables,
    and program units (routines). Modules share many of the attributes with routines;
    this is not surprising that routines are the major component of a typical module.
    However, modules have some additional attributes of their own. The following sections
    describe the attributes of a well-written module.


    # Module Attributes


    A module is a generic type that describes a set of program related objects (routines
    as well as data and type objects) that are somehow coupled. Good modules share
    many of the same attributes as good routines as well the ability to hide details
    from outside the module. Good modules exhibit cohesion. That is, a module should
    offer a (small) group of services that are logically related. For example, a "printer"
    module might provide all the services one would expect from a printer. The individual
    routines within the module would provide the individual services.


    Good modules exhibit loose coupling. That is, there are only a few, well-defined
    (visible) interfaces between the module and the outside world. Most data is private,
    accessible only through existing functions (such information hiding). Furthermore,
    the interface should be flexible. Good modules exhibit information hiding. Outside
    code should only have access to the module through a small set of public routines.
    All data should be private to the module.


    # 15.4.2. Data typing, declarations, variables and other objects


    Most languages'' built-in data types are abstractions of the underlying machine
    organization and rarely does the language define the types in terms of exact machine
    representations. For example, an integer variable may be a 16-bit two''s complement
    value on one machine, a 32-bit value on another, or a 64-bit value. Clearly, a
    program to write 32 or 64 bit integers will malfunction on a machine (or compiler)
    that only supports 16-bit integers. The reverse can be true.


    One supposed advantage of a high level is that it abstracts the machine dependencies
    in exist types. In theory, an integer is an integer ... in practice; there are
    short integers, integers, and long integers. Common sizes include eight, thirty-two,
    and sixty-four bits, with many on the way. Unfortunately, the abstraction the
    high level language provides destroy the ability to port a program from one to
    another.


    Most high level language provides programmers with the ability to define new data
    types as isomorphism (synonyms) of existing types. Using this facility, it is
    possible to define a data type that provides precise definitions for most data
    types. For example, you could define the int16 and int32 data types that use 16
    or 32 bits, respectively. By doing so, you can easily guarantee that your programs
    can easily port between most systems (and their compilers) by simply changing
    the definition of the int16 and int32 types on the new machine. Consider the C/C++
    example:'
