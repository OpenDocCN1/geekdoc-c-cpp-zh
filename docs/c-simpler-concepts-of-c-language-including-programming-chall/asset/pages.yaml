- pgno: 12
  md: "# CHAPTER 1\n\n# Introduction to C Programming\n\n# 1.1. HISTORY – HOW DID\
    \ C GROW?\n\nC is basically derived from two earlier programming languages. They\
    \ are BPCL and B language. BPCL is Basic Combined Programming Language and was\
    \ created initiated by Martin Richards in 1967. With the traces being used from\
    \ BPCL, B was developed in 1970s. Ken Thomson. Then led it. B was the mind and\
    \ brain behind this utilized to create early versions of UNIX operating system.\
    \ C led the way to new and most commonly utilized programming language. Dennis\
    \ Ritchie had his extra-ordinary hard work and brain behind this programming revolution.\
    \ UNIX operating system is considered to be one of the most robust and secured\
    \ operating systems. C was used to write it, So C is very efficient that it can\
    \ be used to create an OS which rules the world.\n\nNote: UNIX is not UNIX, it\
    \ is UNICS. Unplexed Information and Computing System.\n\nSince C was growing\
    \ enormously and utilization was more for the same, ANSI (American National Standards\
    \ Institute) defined a standard for C and it is being used today. It is named\
    \ as ANSI – C. International Standards Organization (ISO) also approved this version\
    \ of C. This book will discuss on ANSI – C, fully.\n\n# 1.2. CHARACTERISTICS OF\
    \ C LANGUAGE\n\nC language has many unique characteristics which has made it popular\
    \ in the market and the industry. They are listed as follows in a brief:\n\n+\
    \   - It is simple to learn, which makes the learner to understand faster.\n-\
    \ It is a general purpose, high level programming language.\n  - So why it is\
    \ used to create other software and even operating systems.\n  - C compilers can\
    \ be written with C programming.\n- It is a structured programming language.\n\
    - High flexibility means a function can be written and be used so many times at\
    \ so places. It increases the modularity.\n- Rich set of library support.\n- Support\
    \ of operators and expressions.\n- There is specific format for writing a C program.\
    \ Any number of statements can be written in one line.\n- One can access internal\
    \ registers with C program.\n- Very less number of reserved words.\n- Pointer\
    \ support (reader may wonder, if it is easier, then it is easier.)"
  merge: -1
  img_proc: true
