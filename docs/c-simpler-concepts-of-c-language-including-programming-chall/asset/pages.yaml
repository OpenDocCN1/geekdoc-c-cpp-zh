    # 11.5. DOUBLY LINKED LISTS


    One step ahead in linked list is doubly linked lists. The properties of doubly
    linked lists are similar to that of singly linked lists, in the fact that unlike
    linked lists which have only next pointer, doubly linked lists have two pointers,
    next and previous, or left right pointers.


    Pictorial representation is as follows.


    | Left Data Right | Left Data Right | Left Data Right |


    ![](img/5bbdccabcf90cef7ee48b1b48eaa187d_192_0.png)


    Figure Doubly linked list


    As each node has pointers to its left and right nodes, doubly linked lists become
    flexible in accessing the nodes in the backward direction also! The implementation
    part is given in Program 11.5. Care should be taken during insertion and deletion
    to set the left and right pointers, failing which, the connectivity might be weird
    to handle.'
