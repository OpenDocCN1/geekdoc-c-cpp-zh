    if

    there is only one statement associated with the if. This allows the programmer
    to easily

    add statements to the then-clause of the if without having any additional

    syntactical elements later.


    The principle tool for creating good layout is whitespace (or the lack thereof),

    nis, grouping objects). The following paragraphs summarize McConnell''s finding
    on the

    subject:


    Grouping: Related statements should be grouped together. Statements that logically

    belong together should contain no arbitrary interleaving whitespace (blank lines
    or

    unnecessary indentation).


    Blank lines: Blank lines should separate declarations from the start of code,
    logically

    related statements from unrelated statements, and blocks of comments from blocks
    of code.


    Alignment: Align objects that belong together. Examples include type names in
    a

    declaration section, assignment operators in a sequence of related assigned

    statements, and columns of initialized data.


    Indentation: Indenting statements inside block statements improves readability;
    see

