  md: '# FILE HANDLING IN C


    | Mode | Meaning |

    | "r" | Opens file for only reading |

    | "w" | Creates file for only writing (Overwrites previously saved) |

    | "a" | Creates/opens file for updating the end |

    | "r+" | To open a file for both reading and writing (Overwrites previously saved)
    |

    | "w+" | Creates/opens file for updating at the end |

    | [any_mode]b | Denotes the file dealt with is binary; (Eg. "wb","r+b") |


    Table 10.1 File Modes


    If the fopen() is executed successfully, (i.e.) the <filename> mentioned already
    exists or created successfully, it returns a stream. Or else, it will return a
    NULL. Stream is nothing but the file pointer. Once a file is opened, 3 streams
    are opened automatically, which are stdin (the keyboard), stdout (the monitor),
    stderr. Streams serve as the source or destination for the data. (i.e.) inputting
    the file or reading from the file will be accompanied by reading from input and
    output streams.


    # 10.3.2 Reading from file


    Reading from the file can reading a character from the file or reading a word
    from the file or it may be reading a number from the numeric file.


    # 10.3.2.1. int fgetc(<file pointer>)


    For reading a character from the file. If the reading is successful, this function
    returns the character (converted to int) that was read. Once the end of the file
    is reached, it returns EOF.


    # 10.3.2.2. char * fgets(*word, int n, file pointer>)


    This function reads ''n-1'' characters into the ''word''. It stops reading when
    it encounters a newline. On successful execution, this function returns the word
    read, or NULL if end of file is reached or on some error in reading occurrences.


    # 10.3.2.3. int getw(<file pointer>)


    Sometimes there may arise to store only numeric values. In such situation, this
    function can be used, which writes the ASCII equivalent of the number being written
    to the file mentioned by the file pointer. (Performs automatic conversion to integer
    before writing to the file if the character being written is float or double.)


    # 10.3.2.4. int fscanf(file pointer, control strings...), (variables...))


    If there arises a need to read from the file which has a well defined structure,
    instance, a file with the following fields'
