  md: '# OPERATORS


    | operator | Name of the operator | associativity | rank |

    | | | Bitwise OR | L->R | 10 |

    | && | Logical AND | L->R | 11 |

    | || | Logical OR | L->R | 12 |

    | ?: | Ternary operator | R->L | 13 |

    | =, +=, -=, *= /=, %, |= &=, <<= >= | Assignment operators | R->L | 14 |

    | , | Comma operator | L->R | 15 |


    Table 4.5 Precedence of operators part II


    Apart these operators, there are two more operators that aren''t covered in this
    chapter.

    1. -> (arrow operator)

    2. . (dot operator).


    They also share the first rank with parenthesis and array reference operator.

    These operators will be discussed in Chapter 8.

    It is the prime responsibility of the reader to memorize this table for evaluating
    expressions perfectly!!


    > POINTS TO REMEMBERPR


    +   * Operators are those which act upon operands.

    * There are 3 kinds of operators. Unary, Binary and ternary.

    * An expression acts upon various kinds of operators.

    * +, *, % are five arithmetic operators.

    * Operators acting on bits are called bitwise operators.

    * Operators based on truth values are called Logical operators.

    * When operands are of different types, casting is performed.

    * Precedence of operator and associativity rules are used while evaluating the
    expressions.

    * Unary operators have only one operand. They have the highest precedence all.

    * Increment and decrement operators can be used as post/pre operations.

    * Conditional operator can replace if-else statements.

    * Comma operator has the least precedence.

    * Modulo operation cannot be performed on real operands.'
