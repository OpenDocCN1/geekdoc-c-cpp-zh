    printf("Enter the file name with extension...");

    canf("%s",&file_name);

    out=fopen("file_test.txt","w");

    if(fptr=fopen=fopen(file_name,"r"))

    {

    printf("File contents are. \n\n");

    while((c=fgets(fptr))!=EOF)

    {

    printf("%%%c",c);

    }

    }

    ```'
