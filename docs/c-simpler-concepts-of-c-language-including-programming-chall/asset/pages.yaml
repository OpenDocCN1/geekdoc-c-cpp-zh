- pgno: 4
  md: '# PREFACE TO THE FIRST EDITION


    C- Simpler, the title of the book itself talks about the nature of the contents
    of this book. This book explains of C language in a form that is well suited for
    the beginners. Each and every, though very simple, has been programmatically explained.
    After going through the programs, the reader will be mentally prepared to face
    programming challenges. This book will also serve as a guide for those who are
    heading towards the campus interviews, since this book covers the minutes about
    the constructs of C language. The readers will be able to visualize tricky concepts
    through the diagrams used and then in this book. This book was developed with
    the notion that, after reading every chapter, the reader should be able to apply
    the constructs that they studied.


    Here goes the brief discussion of chapters. First chapter covers all the elementary
    things. Chapter 2 talks on learning constructs followed by the discussion of arrays
    in chapter 3. Chapter 4 takes the reader through different kinds of operators
    available in ''C''. From chapter 5, reader will be taken through the rough and
    touches of the language. Chapter 5 discusses the most important function concepts,
    followed by storage qualifiers in chapter 6. Chapter 7, deals with the most significant
    concept in ''C'', the ''Pointers'', that are explained in the simplest way. Structures
    and unions are discussed in chapter 8. Chapter 9 deals with the so easy-to-learn
    concepts, the ''strings''. File handling concepts have been covered in chapter
    10, followed by the very useful data structures which actually show the applicability
    of ''C'', in chapter 11. Chapter 12 is meant to deal with command line arguments.
    This chapter is written in such a way that, the reader will voluntarily start
    answering questions on command line arguments. Chapter 13 is unique and quite
    helpful for those who work on Linux/Unix platform. It discusses the utilization
    of ''C'' constructs in Linux/Unix platform. Chapter 14 discusses the most interesting
    pre-directors. But not the last, chapter 15 is meant to empower the programmers
    with some basic, yet powerful guidelines.


    At the end of every chapter, the brain squeezing quizzes are given to check the
    level of understanding. The critics are the most valuable gift to you. It is also
    for us.


    We wish to thank Sunandhini, Palanisamy T and Vimalraj for helping us out in this
    book to a nice shape.


    The readers are encouraged to raise anything that comes up in your minds, be a
    doubt, or any concern, or any suggestion, please mail to vrsuba@gmail.com, Shriramkv@gmail.com.
    All the best for the readers for a bright future!


    Dr. D.P. Kothari

    Er Subhash V

    Er. Shriram K Vasudevan


