    What is the miracle?\n\nThe reason is that the compiler will align member variables\
    \ to a multiple of the pack size or a multiple of the type size, whichever is\
    \ smallest.\n\nDefault pack size is usually 8 bytes.\n\nPictorial representation\
    \ of the memory occupancy is shown in Fig 8.2.\n\n![](img/5bbdccabcf90cef7ee48b1b48eaa187d_137_0.png)\n\
    \nFig. 8.2 Memory layout\n\nSo, obviously there is wastage of memory slots.\n\n\
    How to overcome this?\n\nPragmatic directive does this for us. It programmatically\
    \ controls the packing during the compile time.\n\n```\n#pragma pack(push,1)\n\
    &&\\n#pragma pack(pop)\n```\n\nConstructs are used for this purpose.\nRefer to\
    \ the following program Program 8.4 for clarity."
