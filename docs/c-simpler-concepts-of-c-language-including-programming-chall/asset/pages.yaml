  md: "# 94 C-SIMPLER\n\nThe auto specifier indicates that the memory location of\
    \ a variable is temporary. To be precise, a variable's reserved space in the memory\
    \ can be erased or relocated when the variable is out of its scope. Only variables\
    \ with block scope can be declared with the auto specifier. To put in better words,\
    \ the scope of the auto variables is within a block of code or a function.\n\n\
    To prove the above concept a simple and elegant piece of code has been presented\
    \ below program 6.2. Here in this program function add ( ) will be called 10 times\
    \ and it is expected to increment the sum accordingly.\n\nBut since scope of an\
    \ auto variable is within the block of the code, it will die when the compiler\
    \ goes out of the function. When the function add ( ) for the second, or third\
    \ or tenth, it will be initialized again with ten and increment once. So the result,\
    \ return value will remain 11.\n\n```\n#include <stdio.h>\nmain() {\n    int i,\
    \ ret;\n    for (i=1; i<=10; i++)\n    {\n        ret = add();\n    }\n}\nint\
    \ add() {\n    auto int sum = 0;\n    sum++;\n    printf(\"\\nSum is %d\", sum);\n\
    }\n```\n\n# Execution Result\n\nSum is 11\nSum is 11\nSum is 11\nSum is 11\nSum\
    \ is 11\nSum is 11\nSum is 11\nSum is 11\nSum is 11\n\n# Program 6.2 Scope of\
    \ auto variables.\n\n# 6.1.2. static\n\nstatic the default storage class for global\
    \ variables. Static variables can be declared even within a block of code. The\
    \ major difference between static and auto variable is, values of the static variables\
    \ are retained and will not be re-initialized.\n\n0 is stored by default for static\
    \ variables. To check this program 6.3 has been written and the same is presented\
    \ with execution result."
