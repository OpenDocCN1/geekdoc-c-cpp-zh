- pgno: 24
  md: '# INTRODUCTION TO C PROGRAMMING


    Now to compile the program written, some steps need to be followed. Before that
    would be better to know the internal happenings when a file is compiled. When
    compilation is on, firstly if there is no compilation or syntax errors the object
    file will be formed and it will be created with the extension .o. Then the object
    file will be made as an executable after process of linking with the library files.
    The executable file can be run to get the above statement mentioned in C code
    printed.


    All these in a sequence and here are the commands presented for the same.


    ```

    $ gcc -c prog1.c

    ```


    In the above command, gcc is the compiler being used, expanded as GNU CCCompiler
    which will compile the code and get the object files. Object file will be generated
    with the same name as file name, it is prog1.o."o" is to just say it an object
    file.


    After the process is over, one should get an executable file for the above generated
    object. It can be carried out with the following command.


    ```

    $ gcc -o execfile prog1.o

    ```


    Above command will convert the object file to an executable file after linking
    the file with necessary library files. To complete the execution step has to be
    followed.


    ```

    $ ./execfile

    ```


    Immediately, the screen should get ''Welcome to the Kingdom of programming'' printed
    which was the motto of the code written. By now reader would have got idea of
    the flow. But again a diagrammatic representation would be helpful; a representation
    presented in Fig 1.2 as:


    ![](img/5bbdccabcf90cef7ee48b1b48eaa187d_24_0.png)


    Figure 1.2: Flow representation of the compilation process


    Well, the process can be made simpler much now. Without having necessity to generate
    the object files explicitly, one can generate the executable with the command


    ```

    $ gcc -o execfile prog1.c

    ```


    This will get the executable file generated right away and will be named as a.out.


    When this is run as ./a.out the program will be executed and results will be available
    on the screen.


    There can be a question raised, if a same directory, so many files are to be executed
    how a.out file will be formed? It will be a over writing of a.out if multiple
    files are to be executed there can''t be multiple.a out kept for the purpose.


    So to avoid this problem naming the executable file is allowed and it can be done
    simply with following command,


    ```

    $ gcc -o execfile prog1.c

    ```'
