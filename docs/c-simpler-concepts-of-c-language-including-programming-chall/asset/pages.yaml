    # 15.4.6. Comments and (program) documentation


    Almost everyone agrees that a program should have good comments. Unfortunately,
    few people agree on the definition of a good comment. Some, in frustration, feel
    that minimal comments are the best. Others feel that line should have two or three
    comments attached to it. Everyone else wishes they had good comments in their
    program but never see the time to put them in.


    It is rather difficult to characterize a "good comment." In fact, it is much easier
    to give examples of bad comments than is to discuss comments. The following list
    describes some of the worst possible comments you can put in a program:


    +   The absolute worst comment you can put into a program is an incorrect comment.
    Consider the following Pascal statement:

    o A := 10; { Set ''A'' to 11 }


    +   It is amazing how many programmers will automatically assume the comment is
    correct and tries to figure out how this code manages to set the variable "A"
    to the value 11 when the code obviously sets it to 10.


    +   The second worst comment you can place in a program is a comment that explains
    what a statement is saying. The typical example is like "A := 10; {Set ''A'' to
    10}". Unlike the previous example, this is correct. But it is still worse than
    no comment at all it is redundant and forces the reader to spend additional time
    reading the code (reading time is directly proportional to reading difficulty).
    This also makes it harder to maintain since slight changes to the code (e.g.,
    "A := 9") require modifications to the comment that would not be required.


    +   The third worst comment in a program is an irrelevant one. Telling a joke,
    for example, may seem cute, but does little to improve the readability of a program;
    indeed, it offers a distraction that breaks concentration.


    +   The fourth worst comment is no comment at all.


    +   The fifth worst comment is a comment that is obsolete or out of date (though
    incorrect). For example, comments at the beginning of the file may describe the
    current version of a module and who last worked on it. If the last programmer
    to modify the file did not update the comments, the comments are out of date.


    Steve McConnell provides a long list of suggestions for high-quality code. His
    suggestions include:


    Using comments that don''t break down or discourage modification. Essentially,
    he''s saying a comment style that isn''t so much people refuse to use it. He gives
    an example of a block of comments surrounded by asterisks as being hard to maintain.
    This is a poor example since modern text editors will automatically "outline"
    the comments for you. Nevertheless, the basic idea is sound.'
