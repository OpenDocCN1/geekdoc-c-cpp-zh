    # 8.2.1. Accessing union fields


    To access the fields of a union, we use the dot operator(.) just as we would for
    a structure. When a value is assigned to one member, the other member(s) gets
    wiped out since they share the same memory.


    Program 8.13 explains Union Concept.


    ```

    #include <stdio.h>

    union data {

    char a;

    int x;

    float f;

    } myData;

    void main() {

    int mode = 1;

    myData.a = ''A'';

    printf("Here is the Data: %c\n%d\n%f\n", myData.a, myData.x, myData.f);

    mode = 2;

    printf("Here is the Data: %c\n%d\n%f\n", myData.a, myData.x, myData.f);

    if (mode == 1) {

    printf("The float is being used\n");

    } else if (mode == 2) {

    printf("The int is being used\n");

    } else if (mode == 3) {

    printf("The char is being used\n");

    }

    getch();

    }

    ```


    > Union has 3 variables. Of which only one can be in memory at a time


