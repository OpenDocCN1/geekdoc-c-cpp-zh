  md: '# 10

    CHAPTER File Handling in C


    # 10.1. THE NEED


    Suppose you own a grocery shop. You want to log the sales details to a place from
    where you can refer to any particular sale, or you can find the total sales, etc.
    In this case, handling the operations using structures, or some other like arrays
    won''t be flexible. Instead, it will be cumbersome. In such situations, using
    ''files'' will pacify the crisis. They are simple to deal with. There is a greater
    flexibility in handling files.


    # 10.2. PROPERTIES


    +   File handling allows us to,

    - create new files

    - open the files

    - read existing files

    - write to a newly created file

    - modify existing files

    - overwrite file content

    - append the existing file

    - rename the existing file

    - delete a file

    - randomly access the file


    These are the most widely used functions of file handling. In the upcoming sections,
    all the above mentioned properties will be put into programming area.


    # 10.3. BASIC FILE OPERATIONS


    In this section, the basic operations including, opening a file, reading from
    the file, writing to a file, closing a file. The following are the built-in functions
    available for all these purpose.(The reader''s job is to simply learn how to make
    use of them 😊)


    # 10.3.1. File creation and opening


    Before going to the library functions, the reader is expected to know about file
    pointer.

    Opening a file return a pointer to the object FILE. So, before proceeding with
    opening a file, the programmers have to declare a variable of type FILE. For instance
    FILE *fptr.


    ```

    10.3.1. FILE* fopen(<filename>,<mode>)

    ```


    filename → name of the file to be opened. If there is no file in the name given
    by <filename>, new file with that name will be created. Mode → denotes whether
    the file needs to be opened for reading or writing or both. Table 10.1 shows the
    possible modes.'
