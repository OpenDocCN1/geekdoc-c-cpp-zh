- pgno: 45
  md: '# # CHAPTER 3 Arrays


    Most of the time, the programs are supposed to deal with many values of same type.
    For instance, roll numbers of students of a class, their marks, their names, their
    average marks, etc. In such situations, it is undesirable to have a variable for
    each student.


    For example, while dealing with roll numbers, having variables roll1, roll2, roll3,
    roll4......etc., would waste memory as well as it is a tedious process, and handling
    them is difficult too. So what''s the remedy? It''s an array which would overcome
    aforementioned pitfalls.


    # ## 3.1. DEFINITION


    Grouping the data items that have coinciding properties, characteristics under
    a common name.


    In the above roll number example,


    We can have an array named ''roll_numbers'' of type int/long int.


    # ### 3.1.1. Properties


    +   * It comes under the derived data types family.

    * An array variable is any other variable with its size mentioned during declaration
    as follows, int roll_numbers[10]; -> int is the storage class/data type of the
    array. Array name roll_numbers, size is 10. (Note that the size is mentioned in
    square brackets).

    * If the array is initialized with values during declaration itself, (discussed
    in Section 3.2) size may be left unspecified.

    * Declaring an integer array would reserve 2/4 bytes normally. Similarly, declaring
    an integer array would reserve 2/4*(size_of_array) number of bytes.

    * The first element''s (in array) address is called the base address.

    * Bytes for array are reserved consecutively from that base without any gap.

    * Array''s elements are accessed with an index, generally called ''subscripts''.
    For example, accessing the 3rd element in roll_numbers is done as, roll_numbers[2],
    and 4th by, roll_numbers[3], where [2] and [3] are subscripts. (Note that the
    index generally starts from 0 and hence, 3rd element is accessed with the subscript[2]
    4th with index[3] and so on).

    * Subscripts and size of array should be positive integers.

    * Compiler of C language will not check for ''out-of-bounds'' error in arrays.
    So, trying to print an array whose index is larger than the maximum size of the
    array would end up in printing ''junk'' values instead of flashing an error! Hence,
    care should be taken by the programmer.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# ARRAYS 35


    +   - Size of the arrays can be defined as pre-processor directive and used later
    during declaration as follows,

    #define SIZE 10 -> pre-processor directive

    main()

    {

    int array [SIZE]; // perfectly alright

    }


    +   - Mentioning the storage class is not mandatory. Leaving it would declare
    the array as an automatic array.

    - Automatic arrays cannot be initialized.


    # 3.2. DECLARING AN ARRAY


    Types of arrays

    Generally,


    +   - 1 dimensional array (1-D)

    - 2 dimensional array (2-D)

    - Multi-dimensional array (n-D)


    are used. In this section, the syntax for declaring each of the above types of
    arrays will be discussed.

    An array can be declared to any other variable, and declared before used by a
    program. But a ‘size’ of the array has to be mentioned during declaration so that,
    the compiler will make appropriate reservation of bytes in the memory. 1-D arrays
    2-D arrays have 2 subscripts and n-D arrays have n subscripts.


    Syntax

    <data type>array_name[Size][size];

    Examples for 1-D arrays


    int a[10];

    float b[10];

    char c[10];

    The above declarations can be visualized as shown in Figure 3.1.


    ![](img/5bbdccabcf90cef7ee48b1b48eaa187d_46_0.png)'
