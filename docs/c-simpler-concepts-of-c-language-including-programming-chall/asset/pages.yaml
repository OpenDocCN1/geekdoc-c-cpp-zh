    # 4.2.4. Bitwise operators


    As everybody is aware of the fact that the computer treats everything as 0s and
    1s. They are called bits (short form of Binary digits). ‘C’, being a high level
    program is no exception with the above fact. It has operators to deal with bits.
    There are 6 operators in this category.


    +   - Bitwise AND (&)

    - Bitwise OR (|)

    - Bitwise XOR (^)

    - Left Shift (<<)

    - Right Shift (>>)

    - One’s complement (~)'
