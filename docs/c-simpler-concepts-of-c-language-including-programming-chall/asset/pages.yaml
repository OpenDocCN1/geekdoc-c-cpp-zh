    It is evident from the Figure 11.4 that the structure of all the nodes remains
    the same. So, it is enough to declare a structure with 2 fields, data and a self
    referential next pointer. Consider the following structure declaration.


    In this declaration, a structure named ‘queue’ with two fields as mentioned above
    declared with two more pointers for pointing to front and rear of the queue. The
    pointer next is to make use of self referential structures.


