    # 8.2. UNIONS


    Yet another User defined data type is Union! Syntactically there’s no big difference
    between these and Structures. But with respect to memory allocations, there is
    a huge difference to be noted.


    We can store information in one field at a time in a Union data type. We can leave
    it as such imagine unions as a chunk of memory Once a new value is written into
    it, the old value will be wiped out or erased completely.


    The major difference between structures and unions is given in Table 8.1


    | Structures | Unions |

    | Size of a Structure is equal to Sum of the sizes of its individual variables.
    | The size of a union is equal to the size of its largest data member. |

    | Example, | Example, |

    | struct s | union s |

    | { | { |

    | int a; | int a; |

    | char b; | char b; |

    | }; | }; |

    | Size = 5 bytes (Theoretically) | Size = 4 bytes (Size of integer variable) |


    Table 8.1 Difference between structures and unions


    # Union Declaration:


    It is similar to the structure declaration except the keyword union.


    union <union-name>


    ```

    {

    --- Member variables declaration;---

    ```'
