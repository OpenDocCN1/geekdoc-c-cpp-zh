  md: '# 72 C-SIMPLER


    # 4.3. PRECEDENCE OF OPERATORS


    When the compiler encounters an expression like ''a+b*(c-d)+(e%f)-g'', it will
    have to apply some rules based on the importance @ precedence of operators for
    evaluating the expression correctly. Following the rules will avoid conflicts
    in expression evaluation.


    When talking about expression evaluation, ''associativity'' comes into the picture.
    When a particular operator occurs more than once in an expression, the compiler
    will decide on which direction to execute the operators. Whether to proceed from
    left or right. The Table 4.5 describes the precedence associativity details.


    | operator | Name of the operator | associativity | rank |

    |---|---|---|--|

    | () | Parenthesis | L->R | 1 |

    | [] | Array reference op. | | |

    | + | Unary Plus | R->R | |

    | | Unary Minus | | 2 |

    | ++ | Increment | | |

    | -- | Decrement | | |

    | ! | Logical NOT | | |

    | * | 1''s complement | | |

    | ~ | indirection | | |

    | & | address | | |

    | sizeof(type) | size of an object casting operator | | |

    | * | Multiplication | L->R | 3 |

    | / | Division | | |

    | % | Modulus | | |

    | + | Addition | L->R | 4 |

    | | Subtraction | | |

    | << | Left Shift | L->R | 5 |

    | >> | Right Shift | | |\| < | Less than | | |

    | <= | Less than or equal to | L->R | 6 |

    | > | Greater than | | |

    | >= | Greater than or equal to | | |

    | == | Equal to | L->R | 7 |

    | != | Not equal to | | |

    | & | Bitwise AND | L->R | 8 |

    | ^ | Bitwise XOR | L->R | 9 |


    Table 4.5 Precedence of operators part I'
