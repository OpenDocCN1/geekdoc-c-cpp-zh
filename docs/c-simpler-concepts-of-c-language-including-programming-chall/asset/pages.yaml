- pgno: 87
  md: 'As we observe, the objective of the above program is to swap the contents of
    the arrays. The following steps are needed.


    +   1. Get the size of the array (Size of both the arrays would be the same)

    2. Get the Array1''s values

    3. Get the Array2''s values

    4. Print the initial contents of the arrays

    5. Perform the swap operation

    6. Print the contents of the arrays after swapping


    The program above 5.1 gives the input (Array2''s values), processes (swap), and
    prints the output (Array2''s values).


    Number of lines of the program=36.

    naturally, we tend to repeat some of the statements as the program grow. For instance,
    same set of statements for getting the input for 2 arrays, printing the contents
    of two arrays.


    **As a result of repetition, length of the program increases.**


    This being a simple program, needs less operations. Assume a program installed
    in a real time scenario like an online course registration which would have numerous
    lines with many operations. In such cases, having the code length larger would
    pose the following threats.


    +   1. Readability of the program gets reduced.

    2. Debugging capability gets harder.

    3. No benefit can be obtained by the reusability factor!

    So, what is the strategy to tackle the above threats?

    Using Function(s) would be the solution.


    # 5.1.1. Types of functions


    +   1. Built-in

    2. User defined


    Built-in functions are already written and compiled for the programmers to use
    directly without having to write on their own.


    Examples,

    sin(x) → a built-in function to find the sine value of x.

    sqrt(x) → to find the square root of x.

    abs(x) → to find the absolute value of x.


    User functions are those we are going to deal with in this chapter.


    **Note:** Functions are interchangeably called as "methods/modules". The process
    of splitting the length and complex programs into smaller units/functions is called
    ''modularization''. Programming with such an approach is known as modular programming.


    # Benefits of using functions


    +   Improves modularity and thereby the reusability

    The advantageous characteristic of functions is that, if a set of instructions
    are to be reused, enclosing them as a function, whenever the need arises, the
    programmer need not write those set of instructions again and again. Instead,
    a simple call to them would do! This promotes reusability and reduces the developer''s
    time as well as storage space.'
