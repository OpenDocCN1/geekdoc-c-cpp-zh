    # 13.3.3. Write ( ) system call


    The system call needs a file created already with write permissions. File creation
    can be done with create as discussed above. Opened file can be written into write
    system call. The file descriptor of the created file (to which the programmer
    writes) has to be passed as an argument to the write with the text to be written.
    The text can be kept in a char array, which is named as buffer here in the following
    code. Now that buffer along with size of the same also needs to be passed as arguments.


    It will serve the purpose and writing it will be over. The file can be opened
    after execution and it will have "hello" written into it.


    ```

    #include <stdio.h>

    #include <fcntl.h>

    #include <unistd.h>


    int main ()

    {

    char buffer[5]="hello";

    // hello is written into buffer, char array.

    int fdl, ret;


    fdl = create("txt1.txt", 0777);

    // Create to create new file with RWX permissions.

    ret = write(fdl, buffer,sizeof(buffer));

    // Write has been performed here.


    }}

    ```'
