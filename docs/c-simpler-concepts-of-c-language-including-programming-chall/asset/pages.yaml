- pgno: 180
  md: '![](img/5bbdccabcf90cef7ee48b1b48eaa187d_180_0.png)


    # Figure 11.2. The stack


    As the figure shows, Stack has a pointer TOS (Top of Stack) which indicates the
    top most element (which was recently added). At the start, TOS will be pointing
    to the index ‘-1’. Every push increases the pointer by one. Once it reaches an
    upper bound MAX, no element can be added. Every pop reduces the pointer value
    by one. There is an index much like an array''s, which helps to access the elements
    of array.


    # Pushing, Popping


    There are two major operations performed using stacks. 1. Push 2. Pop. The process
    of inserting an element into the stack is called Push operation. The reverse operation,
    taking an element out the stack is known as popping.


    Stack used to follow Last In First Principle (LIFO) principle. This principle
    pops the element at TOS. (i.e.) Most recently added item is popped.


    # Queues


    This data structure is much like real life one could find in reservation counters
    at railway stations and other places, where (First In First Out) FIFO principle
    will be followed. One who came first will leave the queue first. It can be visualized
    as shown in Figure 11.3.


    ![](img/5bbdccabcf90cef7ee48b1b48eaa187d_180_1.png)


    # Figure 11.3. The queue'
