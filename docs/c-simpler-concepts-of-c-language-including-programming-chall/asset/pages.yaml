  md: "# 226 C-SIMPLER\n\nOn a 16-bit machine:\n\n```\ntypedef int int16;\ntype long\
    \ int32;\n```\n\nOn a 32-bit machine:\n\n```\ntypedef short int16;\ntypedef int\
    \ int32;\n```\n\nDon't redefine existing types. This may seem like a contradiction\
    \ to the guideline above, but it isn't. This statement says that if you have an\
    \ existing type that uses the name \"integer\" you should not create a new type\
    \ named \"integer.\" Doing so would create confusion. Another programmer, reading\
    \ your code, may confuse the other \"integer\" every time s/he sees a variable\
    \ of type integer. This applies to existing user types as well as predefined types.\
    \ Since it is possible to declare symbols at different points in a program, different\
    \ programmers have developed conventions concern the position of their declarations.\
    \ The two most popular conventions are the:\n\n+   - Declare all symbols in the\
    \ beginning of the associated program unit (function, procedure, ...)\n- Declare\
    \ all variables as close as possible to their use.\n\nLogically, the second approach\
    \ would seem to be the best. However, it has one major drawback – although typically\
    \ have only a single definition, the program may use them in several different\
    \ locations. But those who absolutely desire to put their definitions as close\
    \ as possible for the for-loop can always do something like the following:\n//\
    \ Previous statements in this code:\n\n```\n* {\n i;\nfor (i=start; i <= end;\
    \ ++k)...\n}\n```\n\n// Additional statements in this code.\n\n# 15.4.3 Names\n\
    \nAccording to studies, the use of high-quality identifiers in a program contributes\
    \ more to the readability of program than any other single factor, including high-quality\
    \ comments. The quality of your identifiers can make or break your program; program\
    \ with high-quality identifiers can be very easy to read, programs with poor quality\
    \ identifiers will be very difficult to read. There are few \"tricks\" to developing\
    \ high quality names; most of the rules are nothing more than plain old-fashioned\
    \ common sense. Unfortunately, programmers (specifically C/C++ programmers) have\
    \ developed many arcane conventions that ignore common sense. The biggest obstacle\
    \ most programmers have to learn how to create good names is an unwillingness\
    \ to abandon existing conventions. Yet their only defence when questioned why\
    \ they adhere to (existing) bad conventions seems to be \"because that's the way\
    \ I've always done it and that's the way everyone does it.\""
