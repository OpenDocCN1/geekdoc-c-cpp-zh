  md: '# OPERATORS


    # Examples


    ```

    int a=10,b=20;

    printf("%d", a+b); -> outputs 30

    printf("%f", a+5.0); -> outputs 15.000000

    printf("%d", a+a''); -> outputs 107

    printf("%d", a-(-10)); -> outputs 7

    printf("%d",a+10-b); -> outputs 40

    ```


    Note that, when we add a character constant with another numeric, the ASCII value
    of the character is added up. Hence the result ''107'' in the third example.


    # Subtraction operator


    This operator subtracts the second operand from the first. If the first operand
    is greater than the second, the operator returns a positive value; else, it gives
    a negative answer.


    # Examples


    ```

    int a=10,b=20;

    printf("%d", a-b); -> outputs -10

    printf("%f", a-5.0); -> outputs 5.000000

    printf("%d", a-''a''); -> outputs 87

    printf("%d", a-(-3)); -> outputs 13

    printf("%d",a+10-b); -> outputs 0

    ```


    # Multiplication operator


    This operator gives the product of two numbers. Like addition and subtraction
    operators, it can operate on int, float and char operands.


    # Examples


    ```

    int a=10,b=20;

    printf("%d", a*b); -> outputs 200

    printf("%f", a*5.0); -> outputs 50.000000

    printf("%d", a*''a''); -> outputs 970

    printf("%d", a*(-3)); -> outputs -30

    printf("%d",a*10-b); -> outputs 2000

    ```


    # Division operator


    This operator divides the first operand by second operand and gives the quotient
    as the value. Like traditional mathematics, the denominator should not be equal
    to zero.(The Divide By Zero exception!)


    # Examples


    ```

    int a=20,b=10;

    printf("%d", a/b); -> outputs 2

    printf("%f", 20/10.0); -> outputs 2.000000

    printf("%d",194/''a''); -> outputs 2

    printf("%f",10/20.0); -> outputs 0.500000

    ```


    # Modulo operator


    This operator returns the remainder after dividing the first operand by second.

    The result will be positive if any of the operands is negative. There is one exception'
