- pgno: 238
  md: "# CODING GUIDELINES\n\nNaming conventions represent one area in Computer Science\
    \ where there are far too divergent views (program layout is the other principle\
    \ area). The primary purpose of an object's name in a programming language is\
    \ to describe the use and/or contents of that. A secondary consideration may be\
    \ to describe the type of the object. Programmers use different mechanisms to\
    \ handle these objectives. Unfortunately, there are far many 'conventions' in\
    \ place; it would be asking much to expect any programmer to follow several different\
    \ standards. Therefore, this standard will apply across all languages as much\
    \ as possible.\n\nThe vast majority of programmers know only one language - English.\
    \ Some programmers may not be familiar with a common non-English phrase that is\
    \ not in their language (e.g., rendezvous). Since English is the common language\
    \ of most programmers, all identifiers use easily recognizable English words and\
    \ phrases.\n\n# 15.4.4. Organizing control structures\n\nAlthough the control\
    \ structures in modern languages trace their roots back to Algol-60, there is\
    \ a surprising number of subtle variations between the control structures found\
    \ in common programming languages used today. This paper will describe a mechanism\
    \ to unify the various control structures the programming languages we use in\
    \ an attempt to make it possible for a Visual BASIC programmer to easily understand\
    \ code written in Pascal or C++ as well as make it possible for C++ programmers\
    \ to read BASIC and Pascal programs, etc.\n\nTypical programming languages contain\
    \ eight flow-of-control statements: two conditional statements (if..thenelse and\
    \ case/switch), four loops (while, repeat.., until/do..while, for, and loop),\
    \ a program unit invocation (i.e., procedure call), and a sequence. There are\
    \ other less common control structures include processes/co routines, for loops\
    \ (iterators), and generators, but this paper will focus only on the most common\
    \ control mechanisms.\n\nControl structures typically come in two forms: those\
    \ that act on a single statement as an operand and those that act on a sequence\
    \ of statements. For example, the if..then statement in Pascal operates on a single\
    \ statement:\n\n> if (expression) then Statement;\n\nOf course it is possible\
    \ to apply Pascal's statement to a list of statements, that involves creating\
