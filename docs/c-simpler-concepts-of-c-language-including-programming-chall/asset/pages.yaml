  md: "# POINTERS\n\n# Accessing the pointer variable's contents\n\nA normal variable\
    \ can be directly accessed with its name itself. Pointer variables are accessed\
    \ with an asterisk in front. For instance, (considering the declaration int *p)\
    \ printf(\"%u\",p); -> this statement prints the contents of the pointer variable\
    \ p, since p is a pointer variable, it is supposed to have an address in it. While\
    \ printing addresses, the address specifier \"%u\" (for unsigned int) can be used.\n\
    \nNote: To print the contents of pointer variable, use '*'. To print the address\
    \ of any variable, use '&' ' is also known as value of operator, and '&', the\
    \ address of operator.\n\nThe following program demonstrates the above mentioned\
    \ concept of pointers. Following the program is the output of the Program 7.1.\n\
    \n```\n#include<stdio.h>\nvoid main(){\n    int var=20;\n    int *p=NULL;//to\
    \ nothing; the 'NULL' pointer\n    char *c=0;\n    float *f=NULL;//points to var\n\
    \    p=&var;\n    printf(\"%d (directly printing)\",var);\n    printf(\"n%d (printing\
    \ using pointer)\",*p);\n    printf(\"naddress of var is %u\",&var);\n    printf(\"\
    naddress of pointer p is %u\",&p);\n    printf(\"naddress of pointer c is %u\"\
    ,&c);\n    printf(\"naddress of pointer f is %u\",&f);\n    getch();}\n```\n\n\
    # Program 7.1 Usage of indirection and reference operators\n\n```\nvar=20 (directly\
    \ printing)\nvar=20 (printing using pointer)\naddress of var is 2686784\naddress\
    \ of pointer p is 2686784\naddress of pointer c is 2686780\naddress of pointer\
    \ f is 2686776\n```\n\n# Output 7.1\n\nIt can be observed from the Output 7.1,\
    \ the differences in the addresses of pointer variables is 4:This is because,\
    \ any type of pointer variable occupies only 4 bytes. Be it char, int or float\
    \ or double, this holds good.\n\n# 7.2. MULTIPLE INDIRECTION\n\nOne can apply\
    \ any operator number of times, based on the pointer type. If it is simply a pointer,\
    \ then only one indirection operator can be used. There are some other types of\
    \ pointers such as,\n\n+   * Pointer to a pointer (2 levels)"
