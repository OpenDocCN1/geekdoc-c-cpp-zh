    \ 4.5 Casting need\n\nAs the above program shows, the operation (i/j) will produce\
    \ the answer 0.5. But since both the operands are int, the result will be 0 (truncating\
    \ the fractional part). When the program is executed, the following output is\
    \ obtained.\n\n(10/20) is 0.000000\n\n# Output 4.5\n\nIn order to obtain the accurate\
    \ result, the help of casting operator will be expected. How to perform casting?\
    \ It's simple. Just append (float) before (i/j). Refer to the following Program\
    \ 4.6.\n\n```\n#include<stdio.h>\nvoid main()\n{\n    int i,j;\n    float f;\n\
    \    i=10;\n    j=20;\n    f=(float)i/j;\n    printf(\"%d/%d is %f\",i,j,f);\n\
    \    getch();\n}\n```\n\n# Program 4.6 Casting example\n\nWhen the program is\
    \ executed, the following result is obtained. Now, the result is accurate.\n\n\
    (10/20) is 0.500000_\n\nThe point to be noted in Program 4.6 is, when we cast\
    \ one of the operands, the other operand is also converted to float. And hence\
    \ the output! So, in general, the following rules are proved for type conversions.\n\
    \n+   - If either operand is long double, convert the other to long double.\n\
    - Otherwise, if either operand is double, convert the other to double.\n- Otherwise,\
    \ if either operand is float, convert the other to float.\n- Otherwise, convert\
    \ char and short to int.\n- Then, if either operand is long, convert the other\
    \ to long.\n\nAlso, beware of the fact that type conversions can't be performed\
    \ on the left hand side of the assignment operator!"
