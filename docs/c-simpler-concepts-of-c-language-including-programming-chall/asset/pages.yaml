  md: '# 234


    # C-SIMPLER


    Comment as you go along. If you put off until the last moment, then it seems like
    another task in the software development process and management is likely to discourage
    the completion of the commenting task in hopes of meeting new deadlines.


    Avoid self-indulgent comments. Also, you should avoid sexist, profane, or other
    insulting remarks in your comments. Always remember, someone else eventually read
    your code.


    Avoid putting comments on the same physical line as the statement they describe.
    Such comments are very hard to maintain since there is very little room. McConnell
    suggests that endline comments are okay for variable declarations. For some this
    might be true but many variable declarations may require explanation that simply
    won''t fit at the end of a line. One exception to this rule is "maintenance comments."
    Comments that refer to a defect tracking entry in the database are okay (note
    that the CodeWright editor provides a much better solution for this -- buttons
    that can bring an external file). Endline comments are also useful for marking
    the end of a control structure (e.g., "endif;")


    Write comments that describe blocks of statements rather than individual statements.
    Comments covering single statements to discuss the mechanics of that statement
    rather than discussing what the program is doing.


    Focus paragraph comments on the why rather than the how. Code should explain what
    the program is doing and why the programmer chose to do that way rather explain
    each individual statement is doing.


    Use comments to prepare the reader for what is to follow. Someone reading the
    comments should be able to have a good idea of what the following code does without
    actually looking at the code. Note that this rule also suggests that comments
    should always precede the code to they apply.


    When you need to restore to some tricky code, make sure you fully document what
    you''ve done.


    Avoid abbreviations. While there may be an argument for abbreviating identifiers
    that appear in a program, no way does this apply to comments.


    Keep comments close to the code they describe. The prologue to a program unit
    should give its name, describe the parameters, and provide a short description
    of the program. It should not go into details about the operation of the module
    itself. Internal comments should to that.


    Comments should explain the parameters, to a function, assertions about these
    parameters, whether they are input, or in/out parameters.


    Comments should describe a routine''s limitations, assumptions, and any side effects.


