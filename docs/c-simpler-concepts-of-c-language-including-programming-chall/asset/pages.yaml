    # 13.3. BASIC SYSTEM CALLS


    There are many / Linux system calls available inbuilt for the Users. What is a
    system call? Is it as good as in C programming. It can be compared with Printf
    in C programming. Why is this called system call and not functions? Functions
    are specific to the programming language. System calls are specific to the operating
    systems. The system calls that are going to be discussed will be available only
    with Linux and not with windows. Since these are OS, system calls will be the
    apt name for. Reader will be exposed to few important system calls and Inter Process
    Communication methodologies will be discussed.


    It would be to always from the simplest to the greatest best understanding.


    # 13.3.1. Creat system call: (creat and not create)


    This is used for creation of files. Creat will need file name to be specified,
    along with the permissions. Every function / system call will have a return value.
    Same is the story for create. When this system call is invoked, it will return
    an integer value and that is called as file descriptor. As already discussed,
    standard input (keyboard) is represented with the file descriptor (fd) as 0, standard
    output (monitor) is represented with 1, and when a new file is created, it will
    standard error is denoted with 2 as file descriptor. So when a new file is created,
    it will the file descriptor allotted as fd. Successive files will gets the successive
    numbers as 4, 5, etc.'
