  md: 'Apart from remove() and rename(), there is a function fflush(file pointer)
    which is meant for writing buffered unwritten data to the file pointed to by the
    file pointer.

    (Note: If the file pointer is an input stream, there is no effect!) Also, fflush(NULL)
    will flush all the output streams.


    # POINTS TO REMEMBER


    +   * fopen() will return a pointer to the FILE object.

    * Files with extensions .doc, .docx, .txt, .dat can be created.

    * Read, write, append are the mostly performed operations on files.

    * If the opening pointer fails, NULL will be returned.

    * EOF denotes the end of the whole integer equivalent is -1.

    * fclose() should be used after every file operation for file handling.

    * putw() writes the ASCII equivalent of the character being written.

    * fseek() moves the file pointer forward or backward based on the offset value
    mentioned.

    * ftell() tells the current position of the file pointer.

    * rewind() moves back the file pointer to the previous position before fseek()
    executed.

    * remove() cannot be applied on files that are opened.


    # Example Program


    The following program will check the file contents, if there are more than 2 vowels
    in the same line, the line will be written to another file. Else the will be skipped.


    ```

    #include<stdio.h>

