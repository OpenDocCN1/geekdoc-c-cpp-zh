  md: '# 4

    CHAPTER

    Operators


    # 4.1. INTRODUCTION


    The ultimate aim of learning any programming language would be using the constructs

    The ultimate aim of learning any programming language would be using the constructs
    for performing operations. Operations are performed with the help of operators.
    For instance, suppose a student wants to find out the total marks obtained from
    6 subjects. He will have to use ''addition operator (+)'' for performing the operation
    as follows. lang1_mark + lang2_mark + phy_mark + cs_mark + maths_mark. So, in
    the real world, there is a need for operators almost every second. Why to delay
    learning them? Let''s discuss the operators in ''C'' in this chapter.


    # 4.2. TYPES OF OPERATORS


    There is a need to perform different kinds of operations in the real world. To
    satisfy all the needs, there exists so many kinds of operators. They include,


    +   - Arithmetic operators

    - Assignment operator

    - Logical operators

    - Bitwise operators

    - Relational operators

    - Unary operators

    - Conditional operator

    - Comma operator


    Let''s discuss everything in detail in the following sections.


    # 4.2.1. Arithmetic operators


    These are the basic operators one could find in almost all the programs discussed
    far.


    The arithmetic operators are as follows,


    +   + (Addition operator)

    - (Subtraction operator)

    -* (Multiplication operator)

    - / (Division operator)

    - % (Modulo operator)


    # Addition operator


    It is meant for adding two numbers. Be the operands integer numbers or floating
    point numbers or combination of both or character constants, it returns the sum
    of left operand and right operand.'
