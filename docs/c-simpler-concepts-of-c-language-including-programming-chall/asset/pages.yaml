- pgno: 14
  md: "# INTRODUCTION TO PROGRAMMING\n\n# 1.4. C KEYWORDS AND IDENTIFIERS\n\nThere\
    \ are few words already reserved and they are called as Keywords. They have a\
    \ predefined meaning and can't be changed at any cost. There are a standard set\
    \ of keywords defined and reserved they are listed in the following table 1.2.\
    \ Most important thing to remember is, all the keywords are to be written in lower\
    \ case letters.\n\n| auto | break | case | char | const | continue | default |\
    \ do |\n| double | else | enum | extern | float | for | goto | if |\n| int | long\
    \ | register | return | short | signed | sizeof | static |\n| struct | switch\
    \ | typedef | union | unsigned | void | volatile | while |\n\nTable 1.2 C Programming\
    \ keywords.\n\nThere are a few compilers who also supports following keywords\
    \ as shown in table 1.3.\n\n| ada | far | near | entry |\n| asm | pascal | fortran\
    \ | huge |\n\nTable 1.3 C Programming keywords – Few more.\n\n# 1.4.1. Identifiers\n\
    \nAs the name, it is used to refer every word of a C program. It is short used\
    \ to refer each and every element of a C program like a variable, function or\
    \ an array. Identifiers can have letters, digits and symbols. There are few rules\
    \ to be remembered when naming an identifier. They are\n\n+   a. First character\
    \ must be an alphabet (be lower case or upper case) or an underscore\nb. Upper\
    \ case and lower case letters are different. X is not x.\nc. Most importantly,\
    \ keywords can never be used as identifier.\nd. Two underscores cannot be used\
    \ in succession.\n\nSome of the sample identifiers are presented here in table\
    \ 1.4.\n\n| X_Identifier | y_123 | degree_celcius | _fahrenheit |\n| Name_C |\
    \ ProGRaM_c | name | sum |\n\nTable 1.4 Identifiers – Few examples.\n\n# 1.5.\
    \ TOKENS IN C\n\nThe smallest unit of a C program can be referred to as a unit.\
    \ Six types of tokens are specified in C programming language. They are listed\
    \ as follows:\n\n+   a. Keywords $\rightarrow$ break, case, etc.\nb. Identifiers\
    \ $\rightarrow$ name, a_b\nc. Constants $\rightarrow$ 67, -98\nd. Strings $\r\
    ightarrow$ “C PROGRAMMING”, ”test\"\ne. Operators $\rightarrow$ +, -, *, etc.\n\
    e. Special symbols $\rightarrow$ [ ]"
  merge: -1
  img_proc: true
- pgno: 15
  md: '# 4


    # 1.6. C VARIABLES


    In C programming a variable must be declared before it is being used. Variables
    can be declared at the start of any block of code. Most local variables are created
    when the function is called, and are destroyed on return from that function.


    A declaration begins with the type, followed by the name of one or more variables.
    For example,


    ```

    int top, bottom;

    ```


    Variables can be initialised when they are declared, this is done by adding an
    equals sign and the required value after the declaration.


    ```

    int top = 100;      /* Maximum Temperature */

    int bottom = -20;     /* Minimum Temperature * /

    ```


    C provides a wide range of types. All the types are going to be discussed in the
    forth topics.


    # 1.7. C DATA TYPES


    C supports many types of data. Each data type will occupy different amount of
    memory space. There are three major classifications of the data types in C. It
    is represented in the figure 1.1.


    ![](img/5bbdccabcf90cef7ee48b1b48eaa187d_15_0.png)


    Figure 1.1 Data types supported in C programming


    # 1.7.1. Primary (built in) data types


    They are the basic data types and there are four built in data types available
    in C programming.


    They are listed as follows:


    +   a. Integer

    b. Floating point representation (Real)

    c. Double precision real number

    d. Character representation and

    e. Void


    A table 1.5 has the description and memory requirements for the data types specified
    above.


    | Type (Keyword) | Description | Size (bytes) |

    |---|---|---|n| Integer (int) | Used to represent integer quantity | 2 bytes (May
    vary from compiler to compiler) |

    | Floating point (float) | Used to represent floating point number (a number with
    a decimal point) | 4 bytes (1 word) |'
  merge: -1
  img_proc: true
