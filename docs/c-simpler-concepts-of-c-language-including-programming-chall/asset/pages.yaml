  md: "# C PROGRAMMING IN UNIX/LINUX\n\nFrom the picture one can understand 0 is fd\
    \ for standard input (key board), 1 is for standard output (monitor) and 2 is\
    \ the number allotted for standard error message. Since 0,1 and 2 are allotted\
    \ already newly created file will get number 2. For an instance if a file is created\
    \ it will get 3 as the file descriptor and next file will created 4. Theoretically\
    \ discussing would not be sufficient.\n\nWriting a small C in Linux with C programming\
    \ will help the reader to understand the concept in a great way. The following\
    \ C code aims in creating 2 files. After creation one can manually check the file\
    \ descriptor table easily and check if the files have been allotted with numbers\
    \ as expected. GNU tool kit in Linux helps to compile and execute C programs with\
    \ GCC compilers. GCC is expanded as Gnu Compiler. The following C file prog1.c\
    \ simply creates 2 files txt1.txt and txt2.txt.\n\n```\n// prog1.c - C code for\
    \ creating 2 files.\n// create is the system call used to create new files through\
    \ code.\n// While loop in code will execute the code continuously so that user\
    \ can check\n// /proc file system.\n\n#include <stdio.h>\nint main ( {\n    int\
