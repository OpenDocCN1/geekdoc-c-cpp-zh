    Looping constructs are very much advantageous when the user needs to repeat certain
    statements many times.


    For example, if the user needs to print his/her name 100 times, it is evident
    to write 100 print'' continuously, which absolutely consumes much of the user''s
    time. Loops'' benefits are admirable in this kind of situation.


    Instead of keeping on writing the same print 100 times, looping constructs can
    be made use of, since they,


    +   1. Consume less time.

    2. Reduce the length of the program.

    3. Readability is improved.


    The following sections will explain the usage of looping constructs.


