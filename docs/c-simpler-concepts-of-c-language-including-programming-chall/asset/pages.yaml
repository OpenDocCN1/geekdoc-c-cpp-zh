    +   The data types are all dealt in detail int: This is a keyword used to refer
    integer number. An integer is some sequence of numbers that has no decimal points
    in between. Based on word length of the computers the range of int can be defined.
    If an 8 bit computer is used the range can be calculated with the following formula:


    ```

    $$-2^{8-1}$ to $2^{8-1} - 1$

    ```


    This will give the range as -128 to +127. Same is the case with 16 bit computer.
    There when used with the same scenario as one will get,


    ```

    $$-2^{16-1}$ to $2^{16-1} - 1$

    ```


    This will now set the range as -32,768 to +32,767. Similarly one can calculate
    the range for a 32 or 64 bit computer.


    For the better understanding of reader, some of the valid and invalid integer
    representations are presented in 1.6.


    | Valid Integer Representations | Invalid Integer Representations |

    |---|---|

    | -232 | 3,098 (Comma is used, which is not allowed) |

    | 13565 | -676.0 (Decimal points not allowed) |

    | 0 | +898,765 (Comma and decimal points not allowed) |

    | +1878 | 9999989898889898 (out of range) |


    # Table 1.6 Valid and invalid integer representations


    Integer is further divided to few more classes. They are named as data type modifiers


    +   a. int

    b. signed int

    c. unsigned int

    d. short int

    e. long int.



    A table with details of the above classifications for all other data types are
    presented in 1.9.


    +   b. float: Floating point numbers are represented with float keyword. Whichever
    number has a decimal point and numbers after it (i.e. 120.989). These numbers
    can be represented either in decimal or scientific notation. Scientific notation
    is called as Mantissa — Exponent notation. When the representation provided by
    float is not sufficient one can use double. It provides precision of up to 14
    digits. Some compilers permit the usage of long double. A table with valid and
    invalid float representations are presented below.'
