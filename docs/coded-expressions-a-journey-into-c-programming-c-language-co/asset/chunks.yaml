- fmt: "\n# Overview\n\n## Stacks\nA stack is a linear data structure that follows\
    \ the Last In, First Out (LIFO) principle. It supports two primary operations:\
    \ `push` (to add an element to the top) and `pop` (to remove an element from the\
    \ top).\n\n## Queues\nA queue is a linear data structure that follows the First\
    \ In, First Out (FIFO) principle. It supports two primary operations: `enqueue`\
    \ (to add an element to the rear) and `dequeue` (to remove an element from the\
    \ front).\n\n# Day 32: Trees (Binary Trees, Binary Search Trees)\n\n## Binary\
    \ Trees\nA binary tree is a hierarchical data structure consisting of nodes, where\
    \ each node has at most two children: left child and right child.\n\n## Binary\
    \ Search Trees (BST)\nA binary search tree is a binary tree where the value of\
    \ each node's left child is less than the node's value, and the value of each\
    \ node's right child is greater than the node's value. It supports efficient search,\
    \ insertion, and deletion operations.\n\n# Day 33: Graphs (Basic Concepts)\n\n\
    ## Graphs\nA graph is a non-linear data structure consisting of a finite set of\
    \ vertices (nodes) and a collection of edges (connections) between those vertices.\
    \ Graphs are widely used to model relationships between objects.\n\n## Basic Concepts\n\
    Graphs can be directed or undirected, weighted or unweighted. Common representations\
    \ include adjacency matrix and adjacency list.\n\n# Day 34: Sorting Algorithms\
    \ (Selection Sort, Bubble Sort)\n\n## Selection Sort\nSelection sort is a simple\
    \ sorting algorithm that repeatedly selects the minimum element from an unsorted\
    \ portion of the array and places it at the beginning.\n\n## Bubble Sort\nBubble\
    \ sort is a basic sorting algorithm that repeatedly steps through the list, compares\
    \ adjacent elements, and swaps them if they are in the wrong order.\n\n# Day 35:\
    \ Project Work: Implementing a Small Application or Project Using C\n\nStudents\
    \ are tasked with implementing a small application or project using the concepts\
    \ and techniques learned throughout the course. This could involve creating a\
    \ simple game, a utility tool, or any other software application that demonstrates\
    \ their understanding of C programming fundamentals and advanced topics.\n\nImplementing\
    \ a project allows students to apply their knowledge in a practical context, reinforce\
    \ their learning, and gain hands-on experience with real-world problem-solving.\
    \ It also provides an opportunity for creativity and innovation, fostering a deeper\
    \ understanding of the language and its capabilities.\n\n# Week 8: Review and\
    \ Practice\n\n## Day 36-40: Review of Concepts, Solving Exercises, and Practice\
    \ Problems\n\n### Concept Review\nStudents revisit key concepts covered in the\
    \ course, including basic syntax, control structures, functions, arrays, pointers,\
    \ file handling, data structures, and algorithms.\n\n### Solving Exercises\nStudents\
    \ are provided with a variety of exercises and problems covering different aspects\
    \ of C programming. These exercises range from simple to complex and are designed\
    \ to reinforce understanding and problem-solving skills.\n\n### Practice Problems\n\
    Practice problems focus on applying the learned concepts to solve real-world programming\
    \ challenges. They encourage students to think critically, write efficient code,\
    \ and debug any errors.\n\n## Day 41-45: Mini-Projects, Assignments, and Assessments\
    \ to Reinforce Learning\n\n### Mini-Projects\nStudents work on mini-projects that\
    \ require them to apply multiple concepts learned throughout the course. These\
    \ projects may involve implementing algorithms, building data structures, or creating\
    \ small applications.\n\n### Assignments\nAssignments are given to students to\
    \ assess their understanding of specific topics. They may involve writing code,\
    \ answering theoretical questions, or solving programming problems.\n\n### Assessments\n\
    Assessments are conducted to evaluate students' overall comprehension of C programming.\
    \ They may include quizzes, tests, or practical exams covering various aspects\
    \ of the course curriculum.\n\n### Benefits of Review and Practice\n- **Consolidate\
    \ Learning**: Reviewing concepts and solving exercises help solidify the understanding\
    \ of fundamental principles.\n- **Reinforce Problem-Solving Skills**: Practice\
    \ problems and mini-projects challenge students to apply their knowledge to solve\
    \ real-world problems.\n- **Identify Weaknesses**: Through assessments and assignments,\
    \ students can identify areas where they need further improvement.\n- **Encourage\
    \ Creativity**: Mini-projects allow students to explore their creativity and apply\
    \ their knowledge in innovative ways.\n- **Build Confidence**: Successfully completing\
    \ exercises, assignments, and projects boosts students' confidence in their programming\
    \ abilities.\n\nOverall, Week 8 serves as a culmination of the course, providing\
    \ students with an opportunity to review, practice, and assess their understanding\
    \ of C programming concepts before moving on to more advanced topics or projects.\n\
    \n# Basic structure of a C program\n\n```c\n#include <stdio.h>\n\n// Function\
    \ prototypes (if any)\n\nint main() {\n    // Variable declarations\n    // Statements\n\
    \    return 0;\n}\n\n// Function definitions (if any)\n```\n\n### Let's break\
    \ down each part:\n\n- `#include <stdio.h>`: This line includes the standard input-output\
    \ library in the program, which allows you to use functions like `printf()` and\
    \ `scanf()`.\n- **Function Prototypes**: These are declarations of functions used\
    \ in the program, placed before the `main()` function. They specify the function's\
    \ name, return type, and parameter list (if any).\n- `main()` Function: Every\
    \ C program must have a `main()` function, which serves as the entry point of\
    \ the program. Execution of the program starts from this function.\n- **Variable\
    \ Declarations**: This is where you declare variables that will be used in the\
    \ program. Variables should be declared before they are used in the program.\n\
    - **Statements**: These are the actual instructions or operations that the program\
    \ performs. They can include assignments, function calls, control flow statements,\
    \ etc.\n- `return 0;`: This line indicates the end of the `main()` function and\
    \ the successful termination of the program. The value `0` indicates that the\
    \ program executed successfully. Other non-zero values can be returned to indicate\
    \ different types of errors.\n- **Function Definitions**: These are the implementations\
    \ of functions declared earlier in the program. They contain the actual code that\
    \ defines what each function does.\n\n# Here's an overview of variables and data\
    \ types in C\n\n## Variables\n- **Naming Convention**: Variable names in C must\
    \ begin with a letter (A-Z, a-z) or an underscore (`_`), followed by letters,\
    \ digits (0-9), or underscores.\n- **Declaration**: Variables must be declared\
    \ before they can be used. The declaration specifies the variable's name and data\
    \ type.\n- **Initialization**: Variables can be initialized (assigned an initial\
    \ value) at the time of declaration or later in the program.\n- **Scope**: The\
    \ scope of a variable determines where in the program it can be accessed. Variables\
    \ can have either local scope (defined within a block or function) or global scope\
    \ (defined outside of any function).\n\n## Data Types\nC supports several basic\
    \ data types, which can be classified into four categories:\n\n### Basic Data\
    \ Types\n- `int`: Integer data type, used to store whole numbers.\n- `char`: Character\
    \ data type, used to store single characters.\n- `float`: Floating-point data\
    \ type, used to store decimal numbers with single precision.\n- `double`: Double\
    \ precision floating-point data type, used to store decimal numbers with double\
    \ precision.\n\n### Derived Data Types\n- `array`: A collection of elements of\
    \ the same data type, stored in contiguous memory locations.\n- `pointer`: A variable\
    \ that stores the memory address of another variable.\n- `structure`: A user-defined\
    \ data type that groups together variables of different types under a single name.\n\
    \n### Enumerated Data Type\n- `enum`: A user-defined data type used to define\
    \ a set of named constants (enumerators).\n\n### Void Data Type\n- `void`: Represents\
    \ the absence of a type.\n"
