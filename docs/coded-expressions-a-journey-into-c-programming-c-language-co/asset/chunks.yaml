    String literals provide a convenient way to work with strings without managing
    memory manually.


    Example:


    c


    Copy code


    #include <stdio.h>


    int main() {


    char *str = "Hello"; // Declaration of a string literal


    printf("String literal: %s\n", str);


    return 0;


    }


    Comparison:


    Both character arrays and string literals can be used to represent strings.


    Character arrays offer more flexibility and can be modified, whereas string literals
    are read-only.


    String literals are automatically null-terminated, while you need to explicitly
    null-terminate character arrays.


    String literals are more convenient for simple string operations, while character
    arrays are useful for more complex scenarios where dynamic memory management is
    required.


    Understanding the differences between character arrays and string literals helps
    in choosing the appropriate approach based on the requirements of your program.


    Pointers and Memory


    In C, pointers are variables that store memory addresses. They are powerful tools
    for working with memory and data structures. Here''s an overview of pointers and
    memory in C:


    Pointers:


    A pointer is a variable that holds the memory address of another variable.


    You can declare a pointer using the asterisk (*) symbol followed by the variable
    name.


    You can obtain the memory address of a variable using the address-of operator
    (&).


    You can access the value stored at the memory address pointed to by a pointer
    using the dereference operator (*).


    c


    Copy code


    #include <stdio.h>


    int main() {


    int num = 10;


    int *ptr; // Pointer declaration


    ptr = &num; // Assigning address of num to ptr


    printf("Value of num: %d\n", *ptr); // Dereferencing ptr to access num''s value


    return 0;


    }


    Memory Management:


    C provides functions like malloc(), calloc(), realloc(), and free() for dynamic
    memory allocation and deallocation.


    malloc() allocates memory block of specified size and returns a pointer to the
    first byte of the block.


    calloc() allocates memory block for an array of elements and initializes all bytes
    to zero.


    realloc() changes the size of previously allocated memory block.


    free() deallocates memory previously allocated by malloc(), calloc(), or realloc().


    c


    Copy code


    #include <stdio.h>


    #include <stdlib.h>


    int main() {


    int *ptr;


    ptr = (int *)malloc(5 * sizeof(int)); // Allocate memory for 5 integers


    if (ptr == NULL) {


    printf("Memory allocation failed\n");


    return 1;


    }


    // Use ptr to access the allocated memory


    ptr[0] = 10;


    ptr[1] = 20;


    ptr[2] = 30;


    // Deallocate the allocated memory


    free(ptr);


    return 0;


    }


    Pointers and Arrays:


    Arrays and pointers are closely related in C.


    An array name can be treated as a pointer to the first element of the array.


    Pointer arithmetic can be used to access array elements and navigate through the
    array.


    c


    Copy code


    #include <stdio.h>


    int main() {


    int arr[] = {10, 20, 30};


    int *ptr = arr; // Pointer to the first element of the array


    printf("Value at index 0: %d\n", *ptr);


    printf("Value at index 1: %d\n", *(ptr + 1)); // Accessing next element using
    pointer arithmetic


    return 0;


    }


    Understanding pointers and memory management is essential for efficient memory
    usage and building complex data structures in C. However, it also requires careful
    handling to avoid memory leaks and segmentation faults.


    Defining a Structure:


    You can define a structure using the struct keyword followed by the structure
    name and a list of members inside curly braces.


    c


    Copy code


    #include <stdio.h>


    // Define a structure named ''Person''


    struct Person {


    char name[50];


    int age;


    float height;


    };


    Declaring Structure Variables:


    After defining a structure, you can declare variables of that structure type.


    c


    Copy code


    int main() {


    // Declare variables of structure type ''Person''


    struct Person person1, person2;


    return 0;


    }


    Accessing Structure Members:


    You can access structure members using the dot (.) operator.


    c


    Copy code


    int main() {


    struct Person person1;


    // Assign values to structure members


    strcpy(person1.name, "John");


    person1.age = 30;


    person1.height = 5.9;


    // Access and print structure members


    printf("Name: %s\n", person1.name);


    printf("Age: %d\n", person1.age);


    printf("Height: %.2f\n", person1.height);


    return 0;


    }


    Initializing Structure Variables:


    You can initialize structure variables at the time of declaration.


    c


    Copy code


    int main() {


    // Initialize structure variable at the time of declaration


    struct Person person1 = {"Alice", 25, 5.5};


    return 0;


    }


    Nested Structures:


    You can nest structures inside other structures to create more complex data structures.


    c


    Copy code


    #include <stdio.h>


    // Define a structure named ''Address''


    struct Address {


    char city[50];


    char state[50];


    };


    // Define a structure named ''Person'' with a nested structure ''Address''


    struct Person {


    char name[50];


    int age;


    struct Address address;


    };


    int main() {


    struct Person person1;


    // Assign values to structure members


    strcpy(person1.name, "Alice");


    person1.age = 25;


    strcpy(person1.address.city, "New York");


    strcpy(person1.address.state, "NY");


    // Access and print structure members


    printf("Name: %s\n", person1.name);


    printf("Age: %d\n", person1.age);


    printf("City: %s\n", person1.address.city);


    printf("State: %s\n", person1.address.state);


    return 0;


    }


    Structures provide a way to organize and manage related data in a program. They
    are commonly used in C to represent complex data structures and objects.


    File handling in C involves operations such as opening, reading, writing, and
    closing files. Here''s how you can perform file handling operations in C:


    Opening a File:


    To open a file, you can use the fopen() function. It takes two parameters: the
    file path and the mode (read, write, append, etc.).


    c


    Copy code


    #include <stdio.h>


    int main() {


    FILE *file;


    file = fopen("example.txt", "r"); // Open file in read mode


    if (file == NULL) {


    printf("File open failed\n");


    return 1;


    }


    // File operations...


    fclose(file); // Close the file


    return 0;


    }


