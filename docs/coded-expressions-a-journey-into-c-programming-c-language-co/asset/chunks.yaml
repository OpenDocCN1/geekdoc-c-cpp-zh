- fmt: "\nThe `switch` keyword indicates the start of the `switch-case` block.\n\n\
    The choice variable (expression) is evaluated, and its value determines which\
    \ `case` block is executed.\n\nEach `case` label specifies a possible value of\
    \ the expression.\n\nIf the value of `choice` matches a `case` label, the corresponding\
    \ block of code is executed.\n\nThe `break` statement is used to exit the `switch`\
    \ block after executing the corresponding `case`. Without `break`, execution will\
    \ continue to the next `case`.\n\nThe `default` case is optional and is executed\
    \ when none of the `case` values match the expression's value.\n\nThe `switch-case`\
    \ statement provides a convenient way to handle multiple alternatives based on\
    \ the value of an expression. It is often used when you have a fixed set of possible\
    \ values for the expression.\n\n# Control Flow\n\nCertainly! The `break` and `continue`\
    \ statements are control flow statements used within loops (such as `for`, `while`,\
    \ and `do-while`) to alter the flow of execution. Here's how you can use them\
    \ in C:\n\n## break Statement\nThe `break` statement is used to exit a loop prematurely,\
    \ without executing the remaining iterations of the loop.\n\n```c\n#include <stdio.h>\n\
    \nint main() {\n    // Print numbers from 1 to 10, but exit the loop when reaching\
    \ 5\n    for (int i = 1; i <= 10; i++) {\n        if (i == 5) {\n            break;\
    \ // Exit the loop when i is 5\n        }\n        printf(\"%d \", i);\n    }\n\
    \    return 0;\n}\n```\n\n## continue Statement\nThe `continue` statement is used\
    \ to skip the current iteration of a loop and proceed to the next iteration.\n\
    \n```c\n#include <stdio.h>\n\nint main() {\n    // Print odd numbers from 1 to\
    \ 10, skipping even numbers\n    for (int i = 1; i <= 10; i++) {\n        if (i\
    \ % 2 == 0) {\n            continue; // Skip even numbers\n        }\n       \
    \ printf(\"%d \", i);\n    }\n    return 0;\n}\n```\n\n### Comparison\nIn both\
    \ examples:\n- The `break` and `continue` statements are used within a `for` loop\
    \ to control the flow of execution.\n- When the `break` statement is encountered,\
    \ the loop is terminated immediately, and the program continues executing the\
    \ code after the loop.\n- When the `continue` statement is encountered, the current\
    \ iteration of the loop is terminated, and the loop proceeds to the next iteration.\n\
    \nThese statements provide flexibility and control over loop execution, allowing\
    \ you to handle special cases or conditions within the loop.\n\n# Arrays and Strings\n\
    \n## Arrays\nAn array is a collection of elements of the same data type, stored\
    \ in contiguous memory locations. Here's how you can declare, initialize, and\
    \ access elements of an array:\n\n```c\n#include <stdio.h>\n\nint main() {\n \
    \   // Declaration and initialization of an array\n    int numbers[5] = {10, 20,\
    \ 30, 40, 50};\n    // Accessing elements of the array\n    printf(\"Element at\
    \ index 0: %d\\n\", numbers[0]);\n    printf(\"Element at index 1: %d\\n\", numbers[1]);\n\
    \    // Modifying elements of the array\n    numbers[2] = 35;\n    printf(\"Modified\
    \ element at index 2: %d\\n\", numbers[2]);\n    return 0;\n}\n```\n\n## Strings\n\
    In C, strings are represented as arrays of characters terminated by a null character\
    \ (`'\\0'`). Here's how you can declare, initialize, and manipulate strings:\n\
    \n```c\n#include <stdio.h>\n\nint main() {\n    // Declaration and initialization\
    \ of a string\n    char greeting[] = \"Hello, world!\";\n    // Accessing characters\
    \ of the string\n    printf(\"First character: %c\\n\", greeting[0]);\n    printf(\"\
    Second character: %c\\n\", greeting[1]);\n    // Modifying characters of the string\n\
    \    greeting[7] = 'W'; // Change 'w' to 'W'\n    printf(\"Modified string: %s\\\
    n\", greeting);\n    // Iterating over the string\n    for (int i = 0; greeting[i]\
    \ != '\\0'; i++) {\n        printf(\"%c\", greeting[i]);\n    }\n    printf(\"\
    \\n\");\n    return 0;\n}\n```\n\nIn the example above:\n- We declare and initialize\
    \ a string `greeting` using an array of characters.\n- We access and modify individual\
    \ characters of the string using array indexing.\n- We iterate over the string\
    \ using a `for` loop until we encounter the null character `'\\0'` indicating\
    \ the end of the string.\n- It's important to ensure that strings are null-terminated\
    \ to avoid undefined behavior when manipulating or printing them.\n\n## Multidimensional\
    \ Arrays\nMultidimensional arrays are arrays of arrays, allowing you to represent\
    \ data in multiple dimensions, such as rows and columns in a matrix. Here's how\
    \ you can declare, initialize, and access elements of a multidimensional array\
    \ in C:\n\n```c\n#include <stdio.h>\n\nint main() {\n    // Declaration and initialization\
    \ of a 2D array (3x3)\n    int matrix[3][3] = {\n        {1, 2, 3},\n        {4,\
    \ 5, 6},\n        {7, 8, 9}\n    };\n    // Accessing elements of the 2D array\n\
    \    printf(\"Element at row 1, column 1: %d\\n\", matrix[0][0]);\n    printf(\"\
    Element at row 2, column 3: %d\\n\", matrix[1][2]);\n    // Modifying elements\
    \ of the 2D array\n    matrix[1][1] = 10;\n    printf(\"Modified element at row\
    \ 2, column 2: %d\\n\", matrix[1][1]);\n    // Iterating over the 2D array\n \
    \   printf(\"Elements of the 2D array:\\n\");\n    for (int i = 0; i < 3; i++)\
    \ {\n        for (int j = 0; j < 3; j++) {\n            printf(\"%d \", matrix[i][j]);\n\
    \        }\n        printf(\"\\n\");\n    }\n    return 0;\n}\n```\n\nIn the example\
    \ above:\n- We declare and initialize a 2D array `matrix`.\n- We access and modify\
    \ elements of the 2D array using indices.\n- We iterate over the 2D array using\
    \ nested `for` loops.\n"
