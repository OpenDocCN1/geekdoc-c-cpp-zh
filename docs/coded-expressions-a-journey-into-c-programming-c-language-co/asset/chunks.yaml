    concepts enables developers to handle complex data structures, optimize memory
    usage, and write more efficient and flexible code.


    # Week 5: Structures, File Handling, and Advanced Topics


    ## Day 21: Introduction to Structures, Defining and Accessing Structure Members


    Introduction to Structures: Structures (`structs`) in C allow you to group together
    variables of different data types under a single name. They provide a way to represent
    complex data structures.


    Defining Structures: Structures are defined using the `struct` keyword followed
    by the structure name and a list of member variables enclosed in curly braces
    `{}`.


    ```c

    struct Person {

    char name[50];

    int age;

    float salary;

    };

    ```


    Accessing Structure Members: Structure members are accessed using the dot (`.`)
    operator, followed by the member name.


    ```c

    struct Person p1;

    strcpy(p1.name, "John");

    p1.age = 30;

    p1.salary = 50000.0;

    ```


    ## Day 22: Nested Structures, Arrays of Structures


    Nested Structures: Structures can be nested within other structures to represent
    hierarchical data structures.


    ```c

    struct Date {

    int day;

    int month;

    int year;

    };


    struct Employee {

    char name[50];

    struct Date dob;

    float salary;

    };

    ```


    Arrays of Structures: Arrays of structures allow for the creation of collections
    of structured data.


    ```c

    struct Employee employees[100]; // Array of 100 Employee structures

    employees[0].salary = 50000.0; // Accessing salary of the first employee

    ```


    ## Day 23: File Handling in C (Opening, Reading, Writing, Closing Files)


    File Handling Basics: File handling in C involves operations like opening files,
    reading data from files, writing data to files, and closing files.


    Opening Files: Files are opened using the `fopen()` function, which returns a
    file pointer.


    ```c

    FILE *file_ptr = fopen("file.txt", "r"); // Open file.txt in read mode

    ```


    Reading from Files: Data can be read from files using functions like `fscanf()`
    and `fgets()`.


    Writing to Files: Data can be written to files using functions like `fprintf()`
    and `fputs()`.


    Closing Files: Files should be closed using the `fclose()` function after reading
    from or writing to them.


    ```c

    fclose(file_ptr); // Close the file

    ```


    ## Day 24: File Operations (fseek, ftell, rewind)


    File Positioning: File positioning functions allow you to move the file pointer
    to a specific position within a file.


    `fseek()`: Moves the file pointer to a specified byte offset from a reference
    point.


    `ftell()`: Returns the current position of the file pointer in bytes relative
    to the beginning of the file.


    `rewind()`: Moves the file pointer to the beginning of the file.


    ## Day 25: Error Handling and File Manipulation


    Error Handling: Error handling in file operations involves checking for errors
    after performing file-related operations and handling them appropriately.


    File Manipulation: File manipulation involves various operations such as copying
    files, renaming files, deleting files, and checking file existence.


    Understanding structures and file handling in C is crucial for working with complex
    data structures and performing input/output operations on files. Mastery of these
    concepts enables developers to manipulate data effectively and build applications
    that interact with external data sources such as files.


    # Week 6: Advanced Concepts


    ## Day 26: Enumerations and Typedef


    Enumerations: Enumerations (`enums`) allow you to define a set of named constants,
    called enumerators, which represent a set of integer values.


    ```c

    enum Weekday {Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday};

    enum Weekday today = Wednesday;

    ```


    Typedef: `typedef` allows you to create an alias or new name for existing data
    types, making the code more readable and manageable.


    ```c

    typedef int Age; // Define Age as an alias for int

    Age my_age = 30; // Use Age alias

    ```


    ## Day 27: Preprocessor Directives (#define, #include, #ifdef)


    `#define`: The `#define` directive is used to define macros, which are preprocessor
    directives that define symbolic constants or simple functions.


    ```c

    #define PI 3.14159

    ```


    `#include`: The `#include` directive is used to include the contents of another
    file (header file) in the current source file.


    ```c

    #include <stdio.h>

    ```


    `#ifdef`: The `#ifdef` directive checks whether a macro has been defined. If the
    macro is defined, the code block is compiled.


    ```c

    #ifdef DEBUG

    printf("Debug mode enabled\n");

    #endif

    ```


    ## Day 28: Bitwise Operators


    Bitwise Operators: Bitwise operators perform operations on individual bits of
    integer operands.


    `&` (AND): Performs a bitwise AND operation.


    `|` (OR): Performs a bitwise OR operation.


    `^` (XOR): Performs a bitwise XOR (exclusive OR) operation.


    `~` (NOT): Performs a bitwise NOT (complement) operation.


    `<<` (Left Shift): Shifts bits to the left.


    `>>` (Right Shift): Shifts bits to the right.


    ## Day 29: Introduction to Recursion


    Recursion: Recursion is a programming technique where a function calls itself
    directly or indirectly to solve a problem.


    ```c

    int factorial(int n) {

    if (n == 0 || n == 1)

    return 1;

    else

    return n * factorial(n - 1);

    }

    ```


    Base Case: Recursion involves breaking down the problem into smaller instances
    until a base case is reached, which is a condition that does not require further
    recursion.


    ## Day 30: Introduction to Data Structures (Linked Lists)


    Linked Lists: Linked lists are linear data structures composed of nodes, where
    each node contains data and a pointer to the next node in the sequence.


    Types of Linked Lists:


    Singly Linked List: Each node contains data and a pointer to the next node.


    Doubly Linked List: Each node contains data, a pointer to the next node, and a
    pointer to the previous node.


    Circular Linked List: The last node points back to the first node, forming a circular
    structure.


    Advantages of Linked Lists:


    Dynamic size.


    Efficient insertion and deletion operations.


    Disadvantages of Linked Lists:


    Requires extra memory for pointers.


    Traversal can be slower compared to arrays.


    Understanding advanced concepts like enumerations, typedef, preprocessor directives,
    bitwise operators, recursion, and data structures like linked lists is essential
    for writing efficient and complex C programs. These concepts provide powerful
    tools for solving a wide range of programming problems and optimizing code performance.


