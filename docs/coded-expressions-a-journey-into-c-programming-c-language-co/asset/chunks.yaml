    // Structure to represent bank account

    struct Account {

    int accountNumber;

    char name[50];

    float balance;

    };


    // Function to create a new account

    void createAccount() {

    FILE *file = fopen("accounts.txt", "a");

    if (file == NULL) {

    printf("Error: Cannot open file.\n");

    return;

    }


    struct Account newAccount;

    printf("Enter account number: ");

    scanf("%d", &newAccount.accountNumber);

    printf("Enter name: ");

    scanf("%s", &newAccount.name);

    printf("Enter initial balance: ");

    scanf("%f", &newAccount.balance);

    fprintf(file, "%d %s %.2f\n", newAccount.accountNumber, newAccount.name, newAccount.balance);

    fclose(file);

    printf("Account created successfully.\n");

    }


    // Function to deposit money into an account

    void deposit() {

    int accountNumber;

    float amount;

    printf("Enter account number: ");

    scanf("%d", &accountNumber);

    printf("Enter amount to deposit: ");

    scanf("%f", &amount);


    FILE *file = fopen("accounts.txt", "r+");

    if (file == NULL) {

    printf("Error: Cannot open file.\n");

    return;

    }


    struct Account currentAccount;

    while (fscanf(file, "%d %s %f", &currentAccount.accountNumber, currentAccount.name,
    &currentAccount.balance) != EOF) {

    if (currentAccount.accountNumber == accountNumber) {

    currentAccount.balance += amount;

    fseek(file, -sizeof(struct Account), SEEK_CUR);

    fprintf(file, "%d %s %.2f\n", currentAccount.accountNumber, currentAccount.name,
    currentAccount.balance);

    fclose(file);

    printf("Deposit successful. Current balance: %.2f\n", currentAccount.balance);

    return;

    }

    }

    fclose(file);

    printf("Account not found.\n");

    }


    // Function to withdraw money from an account

    void withdraw() {

    int accountNumber;

    float amount;

    printf("Enter account number: ");

    scanf("%d", &accountNumber);

    printf("Enter amount to withdraw: ");

    scanf("%f", &amount);


    FILE *file = fopen("accounts.txt", "r+");

    if (file == NULL) {

    printf("Error: Cannot open file.\n");

    return;

    }


    struct Account currentAccount;

    while (fscanf(file, "%d %s %f", &currentAccount.accountNumber, currentAccount.name,
    &currentAccount.balance) != EOF) {

    if (currentAccount.accountNumber == accountNumber) {

    if (currentAccount.balance >= amount) {

    currentAccount.balance -= amount;

    fseek(file, -sizeof(struct Account), SEEK_CUR);

    fprintf(file, "%d %s %.2f\n", currentAccount.accountNumber, currentAccount.name,
    currentAccount.balance);

    fclose(file);

    printf("Withdrawal successful. Current balance: %.2f\n", currentAccount.balance);

    return;

    } else {

    fclose(file);

    printf("Insufficient balance.\n");

    return;

    }

    }

    }

    fclose(file);

    printf("Account not found.\n");

    }


