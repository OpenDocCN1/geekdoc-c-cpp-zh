    Advanced data structures in C go beyond basic structures like arrays and linked
    lists and include more complex structures such as trees, graphs, heaps, and hash
    tables. Here''s an overview of some advanced data structures along with examples:


    Trees:


    Trees are hierarchical data structures consisting of nodes connected by edges.
    Binary trees, binary search trees, and AVL trees are common types of trees.


    Binary Search Tree (BST):


    A binary search tree is a binary tree in which the left child of a node contains
    only nodes with keys less than the node''s key, and the right child contains only
    nodes with keys greater than the node''s key.


    c


    Copy code


    #include <stdio.h>


    #include <stdlib.h>


    struct TreeNode {


    int data;


    struct TreeNode* left;


    struct TreeNode* right;


    };


    struct TreeNode* createNode(int data) {


    struct TreeNode* newNode = (struct TreeNode*)malloc(sizeof(struct TreeNode));


    newNode->data = data;


    newNode->left = NULL;


    newNode->right = NULL;


    return newNode;


    }


    struct TreeNode* insert(struct TreeNode* root, int data) {


    if (root == NULL)


    return createNode(data);


    if (data < root->data)


    root->left = insert(root->left, data);


