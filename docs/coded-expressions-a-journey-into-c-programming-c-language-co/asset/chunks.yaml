    FILE *file = fopen("accounts.txt", "r");

    if (file == NULL) {

    printf("Error: Cannot open file.\n");

    return;

    }


    FILE *tempFile = fopen("temp.txt", "w");

    if (tempFile == NULL) {

    printf("Error: Cannot create file.\n");

    fclose(file);

    return;

    }


    struct Account currentAccount;

    int found = 0;

    while (fscanf(file, "%d %s %f", &currentAccount.accountNumber, currentAccount.name,
    &currentAccount.balance) != EOF) {

    if (currentAccount.accountNumber != accountNumber) {

    fprintf(tempFile, "%d %s %.2f\n", currentAccount.accountNumber, currentAccount.name,
    currentAccount.balance);

    } else {

    found = 1;

    }

    }

    fclose(file);

    fclose(tempFile);

    rename("temp.txt", "accounts.txt");


    if (found) {

    printf("Account closed successfully.\n");

    } else {

    printf("Account not found.\n");

    }

    }

