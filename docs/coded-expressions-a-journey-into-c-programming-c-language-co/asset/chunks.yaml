    - 在 `scanf()` 中，变量名名前使用 `&` 运算符来传递其地址，指示输入值应该存储的位置。\n- 使用 `scanf()` 时始终确保进行适当的错误处理，以处理用户输入意外内容的情况。\n\
    \n运算符和表达式是 C 编程的基础组件，允许你对数据执行各种操作。以下是 C 语言中运算符和表达式的概述：\n\n#### 算术运算符：\n\n算术运算符用于对操作数执行数学运算。\n\
    \n```c\nint a = 10, b = 5;\nint sum = a + b;    // 加法\nint difference = a - b;\
    \ // 减法\nint product = a * b; // 乘法\nfloat division = a / (float)b; // 除法（强制类型转换为\
