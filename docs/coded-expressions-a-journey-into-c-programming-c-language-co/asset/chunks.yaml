    \ functions in C. The `<string.h>` library provides many other useful functions\
    \ for working with strings, such as `strcpy()`, `strcat()`, `strcmp()`, `strlen()`,\
    \ etc.\n\nIn C, character arrays and string literals are both used to represent\
