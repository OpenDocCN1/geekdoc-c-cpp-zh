  \n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\n// 表示银行账户的结构体\n\
  struct Account {\nint accountNumber;\nchar name[50];\nfloat balance;\n};\n\n// 创建新账户的函数\n\
