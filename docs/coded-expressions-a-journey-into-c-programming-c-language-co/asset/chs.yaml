  printf(\"Insufficient balance.\\n\");\nreturn;\n}\n}\n}\nfclose(file);\nprintf(\"\
  Account not found.\\n\");\n}\n\n// 查询账户余额的函数\nvoid balanceInquiry() {\nint accountNumber;\n\
  printf(\"Enter account number: \");\nscanf(\"%d\", &accountNumber);\n\nFILE *file\
  \ = fopen(\"accounts.txt\", \"r\");\nif (file == NULL) {\nprintf(\"Error: Cannot\
  \ open file.\\n\");\nreturn;\n}\n\nstruct Account currentAccount;\nwhile (fscanf(file,\
  \ \"%d %s %f\", &currentAccount.accountNumber, currentAccount.name, &currentAccount.balance)\
  \ != EOF) {\nif (currentAccount.accountNumber == accountNumber) {\nfclose(file);\n\
  printf(\"Account balance: %.2f\\n\", currentAccount.balance);\nreturn;\n}\n}\nfclose(file);\n\
  printf(\"Account not found.\\n\");\n}\n\n// 销户的函数\nvoid closeAccount() {\nint accountNumber;\n\
  printf(\"Enter account number to close: \");\nscanf(\"%d\", &accountNumber);\n\n\
  FILE *file = fopen(\"accounts.txt\", \"r\");\nif (file == NULL) {\nprintf(\"Error:\
  \ Cannot open file.\\n\");\nreturn;\n}\n\nFILE *tempFile = fopen(\"temp.txt\", \"\
