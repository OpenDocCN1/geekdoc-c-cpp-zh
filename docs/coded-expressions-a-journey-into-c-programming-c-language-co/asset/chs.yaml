  \ {\ncurrentAccount.balance += amount;\nfseek(file, -sizeof(struct Account), SEEK_CUR);\n\
  fprintf(file, \"%d %s %.2f\\n\", currentAccount.accountNumber, currentAccount.name,\
  \ currentAccount.balance);\nfclose(file);\nprintf(\"Deposit successful. Current\
  \ balance: %.2f\\n\", currentAccount.balance);\nreturn;\n}\n}\nfclose(file);\nprintf(\"\
  Account not found.\\n\");\n}\n\n// 从账户取款的函数\nvoid withdraw() {\nint accountNumber;\n\
  float amount;\nprintf(\"Enter account number: \");\nscanf(\"%d\", &accountNumber);\n\
  printf(\"Enter amount to withdraw: \");\nscanf(\"%f\", &amount);\n\nFILE *file =\
  \ fopen(\"accounts.txt\", \"r+\");\nif (file == NULL) {\nprintf(\"Error: Cannot\
