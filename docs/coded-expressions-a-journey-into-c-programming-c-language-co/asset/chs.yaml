  printf(\"Enter name: \");\nscanf(\"%s\", &newAccount.name);\nprintf(\"Enter initial\
  \ balance: \");\nscanf(\"%f\", &newAccount.balance);\nfprintf(file, \"%d %s %.2f\\\
  n\", newAccount.accountNumber, newAccount.name, newAccount.balance);\nfclose(file);\n\
  printf(\"Account created successfully.\\n\");\n}\n\n// 向账户存款的函数\nvoid deposit()\
  \ {\nint accountNumber;\nfloat amount;\nprintf(\"Enter account number: \");\nscanf(\"\
