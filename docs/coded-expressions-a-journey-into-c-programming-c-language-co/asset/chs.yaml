  \ \"%d %s %.2f\\n\", currentAccount.accountNumber, currentAccount.name, currentAccount.balance);\n\
  } else {\nfound = 1;\n}\n}\nfclose(file);\nfclose(tempFile);\nrename(\"temp.txt\"\
