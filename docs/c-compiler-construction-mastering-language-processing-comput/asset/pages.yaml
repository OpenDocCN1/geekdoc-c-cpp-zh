  md: '# Resolving External References


    Resolving external references is a critical aspect of the linking process, ensuring
    all symbols referenced in a program are correctly bound to their corresponding
    definitions. Linkers use symbol tables and relocation information to resolve external
    references, matching symbol references in one object file with symbol definitions
    in other object files or libraries. Symbol resolution can be performed statically
    or dynamically, depending on the linking method used. Static symbol resolution
    occurs at compile time, while dynamic symbol resolution occurs at runtime. By
    resolving external references accurately, linkers produce executable programs
    that execute correctly and efficiently.


    # Link-Time Optimization


    Link-time optimization (LTO) is a technique that performs optimization across
    multiple translation units during the linking process, enabling more comprehensive
    and effective optimizations compared to traditional translation-unit optimization.
    LTO works by merging intermediate representations (IRs) from individual translation
    units into a single, unified IR, which is optimized as a whole. This allows the
    compiler to perform optimizations that require cross-unit analysis and information,
    such as function inlining, intercedural optimization, and dead code elimination.
    By leveraging LTO, compilers produce executable programs with improved performance
    and reduced code size, without sacrificing compilation speed or flexibility.


