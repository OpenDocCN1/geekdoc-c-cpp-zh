    to analyze the compiler source code during the build process. The analyzer checks
    for potential issues and generates reports highlighting any detected defects or
    vulnerabilities.


    # 2. Dynamic Analysis Tools:


    Dynamic analysis tools, also known as runtime analyzers, monitor program behavior
    during execution to detect runtime errors, memory leaks, and performance bottlenecks.
    Tools like Valgrind, AddressSanitizer (ASan), and ThreadSanitizer (TSan) are commonly'
  merge: -1
