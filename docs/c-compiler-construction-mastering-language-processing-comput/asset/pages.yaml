    # 4. Bison and Flex:


    Bison and Flex are tools used for generating parsers and lexical analyzers, respectively.
    Bison generates LALR(1) parsers from grammar specifications, while Flex generates
    lexical analyzers based on regular expressions. These tools are commonly used
    in combination to create the frontend of compilers, parsing source code and converting
    it into abstract syntax trees (ASTs) for further processing.


    ```

    bison -d parser.y

    flex lex.l

    gcc -o compiler parser.tab.c lex.yy

    ```


