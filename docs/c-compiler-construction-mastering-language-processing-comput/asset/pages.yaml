- img_proc: true
  md: "Boundary value analysis involves selecting test cases at near the boundaries\
    \ of input domains to ensure the compiler handles edge cases correctly. For example,\
    \ when testing integer inputs, test cases are selected to cover minimum, maximum,\
    \ and boundary values. This technique helps identify potential issues related\
    \ to boundary conditions and ensures robustness in handling input extremes.\n\n\
    Example Code:\n\n```\n// Boundary value analysis for integer addition\nTEST(BoundaryTest,\
    \ IntegerAddition) {\n    int result1 = add(INT_MIN, 1); // Test with minimum\
    \ integer value\n    int result2 = add(INT_MAX, -1); // Test with maximum integer\
    \ value\n    ASSERT_EQ(result1, INT_MIN + 1);\n    ASSERT_EQ(result2, INT_MAX\
    \ - 1);\n}\n```\n\nIn this example, we boundary value analysis to test an integer\
    \ function. We select test cases with minimum and maximum integer values to ensure\
    \ correct behavior near the boundaries.\n\n# 2. Equivalence Partitioning:\n\n\
    Equivalence partitioning divides the input domain into equivalence classes, where\
    \ each class represents a set of input values that should produce the same output\
    \ behavior. Test cases are then selected from each equivalence class to ensure\
    \ adequate coverage of input variations. This technique helps reduce redundancy\
    \ in test cases and improves test coverage.\n\nExample Code:\n\n```\n// Equivalence\
    \ partitioning for sorting algorithm\nTEST(SortingTest, EquivalencePartitioning)\
    \ {\n    std::vector<int> input1 = {3, 1, 2}; // Unsorted input\n    std::vector<int>\
    \ input2 = {1, 2, 3}; // Sorted input\n    std::vector<int> input3 = {3, 2, 1};\
    \ // Reverse sorted input\n    sort(input1.begin(), input1.end());\n    sort(input3.begin(),\
    \ input3.end());\n    ASSERT_EQ(input1, input2);\n    ASSERT_EQ(input3, input2);\n\
    }\n```"
