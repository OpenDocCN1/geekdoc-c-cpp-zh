    parsers analyze the input stream from left to right, constructing the parse tree
    in a bottom-up fashion using a shift-reduce approach. Leveraging efficient parsing
    algorithms such as SLR (Simple LR), LALR (Look-Ahead LR), and LR(1), compilers
