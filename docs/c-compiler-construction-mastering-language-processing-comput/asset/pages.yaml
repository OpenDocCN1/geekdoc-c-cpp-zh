    \    ret = PAPI_create_event(&EventSet);\n    ret = PAPI_add_event(EventSet, PAPI_L1_DCM);\n\
    \n    ret = PAPI_start(EventSet);\n    // Run compilation process here\n    ret\
    \ = PAPI_stop(EventSet, values);\n\n    printf(\"L1 Data Cache Misses: %lld\\\
