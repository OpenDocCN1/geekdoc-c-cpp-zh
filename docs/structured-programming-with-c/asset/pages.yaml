  md: '# # 4 Arrays


    # ## 4.1 Introduction


    In this chapter you will learn what an array is, namely a method of storing many
    values under a single variable name, instead of using a specific variable for
    each value. We will begin by declaring an array and assign values to it.


    In connection with arrays you will have great use for loops, by means of which
    you can efficiently search for a value in the array and sort the values.


    Arrays is a fundamental concept within programming which will frequently be used
    in the future.


    # ## 4.2 Why Arrays


    An array is, as already mentioned, a method of storing many values of the same
    data type and usage under a single variable name. Suppose you want to store temperatures
    measured per day during a month:


    +   12.5

    10.7

    13.1

    11.4

    12.1

    ..


    If you didn''t know about arrays, you would need 30 different variable names,
    for instance:


    ```

    tempa = 12.5

    tempb = 10.7

    tempc = 13.1

    tempd = 11.4

    tempe = 12.1

    ```


    This is a bad option, especially if you want to calculate the average temperature
    or anything else. Then you would need to write a huge program statement for the
    sum of the 30 variables.


    Instead, we use an array, i.e. one single variable name followed by an index within
    square brackets that defines which of the temperatures in the array that is meant:


    ```

    temp[1] = 12.5

    temp[2] = 10.7

    temp[3] = 13.1

    temp[4] = 11.4

    temp[5] = 12.1

    ```


