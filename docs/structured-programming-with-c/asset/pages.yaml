    # 3.21 Equation


    We will now solve a math problem, namely to solve an equation of 2nd degree. To
    simplify, we assume that the equation has only integer roots. The equation is:


    ```

    x^2 - 6x + 8 = 0

    ```


    Since it is of the 2nd degree it has two roots.


    Finding the solution to an equation means to find x values such that the left
    part (LP) equals the right part (RP), i.e. equal to 0 in our equation.


    We create a loop in which turn tests the values 1, 2, 3 ... up to 100. The test
    procedure is to replace x by 1 in LP and calculate if LP equals 0. Then we replace
    x by 2 and repeat the process until we find two values that match the equation
    or until 100 has been reached.


    First, we create a JSP graph:


    ![](img/76b5a908064445a4a3a85a788cb00a96_66_0.png)


    The variable iNo is used to count the number of roots to the equation that we
    have got. The variable iRoot is the x value in the equation in which each loop
    turn is used to calculate LP. The value of iRoot starts with 1 and is increased
    by 1 for each loop turn. If the value of LP = 0, we increase the value of iNo
    and print the root (x value).'
