    and perc2 are the different percentages used for the fee.


    The array is declared to contain 100 items with the index 0-99. Here, salesman
    no.1 will correspond to index 0, salesman no.2 index 1 etc.


    The variable dAmount is used for entry of sales numbers and the variable dFee
    for fee calculation. The variable i is used as loop counter and the variable nr
    to entry numbers.


    Then the sales array is initialized, where we set all items to 0.


    Entry of salesman numbers and amounts is done in a while statement. If entry is
    successful, the loop continues. If you however press Ctrl-Z, the condition is
    false and the entry loop is interrupted, enabling the program to continue with
    the next statement.


    Inside the loop the program checks if the salesman number is less than 1 or greater
    than 100. This is for safety reason to guarantee that we dont go outside the index
    interval of the array, since the salesman number gives the index value of the
    array. In addition, the program also checks if the sales amount is less than 0.
    If any of these conditions are true, the text "Input error" is printed and the
    user can enter new values. Note that we decrease the salesman number by 1 to get
    the correct item in the array.


    At loop completion (Ctrl-Z), the program goes on with printing the summary heading.


    Then the last loop will calculate the fee and print one line per salesman. First
