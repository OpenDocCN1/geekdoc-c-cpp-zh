  md: '# Structured Programming with C++


    # Functions


    The variable x has the value 5 stored in a memory location. When func1() is called,
    value is copied to another memory location used by the function. If a statement
    in a function would change the value to 6, the memory location of the function
    is affected, but not the original value of x:


    ```

    x=5;

    func1(x);

    ```


    | 5 |

    |---|n| 6 |

    |   |


    Sometimes this is good, but sometimes you also want the original value to be changed.


    Another disadvantage is when lot of data is to be transferred to the function,
    e.g. at object programming when an object consisting of many Mbyte of data is
    to be transferred to a function. A lot of memory is then consumed and it takes
    time to copy huge amounts of data.


    The solution is to use a reference parameter. No copying of data is then made,
    but the original actual parameter and the function''s formal parameter point to
    the same memory location:


    ![](img/76b5a908064445a4a3a85a788cb00a96_145_0.png)


