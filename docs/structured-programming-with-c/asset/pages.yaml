  md: '# Structured Programming with C++


    # Functions


    We must call the function.


    Calling a function means three things:


    +   - Write the function name

    - Supply input to the function

    - Receive the return value


    The following statement calls the function dAverage:


    ```

    dAvg = dAverage(dNo1, dNo2);

    ```


    This statement implies that the dAverage is initiated and the values contained
    by the variables dNo1 and dNo2 are supplied as input to the function. A prerequisite
    for this course is the variables dNo1 and dNo2 have been assigned values to call
    the function. The variables dNo1 and dNo2 are called **actual parameters**, since
    they contain actual values.


    The execution is now passed over the function. The function header:


    ```

    double dAverage(double x1, double x2);

    ```


    tells us that are two formal parameters x1 and x2. The actual parameter values
    are copied to the formal parameters in the specified sequence. x1 will get the
    value of dNo1 and x2 the value of dNo2. Now the formal parameters have got their
    values the statements of the function body are meaningful and can be executed.


