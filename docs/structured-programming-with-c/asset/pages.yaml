  md: '# 8.6 cout and char Pointers


    The print function has some peculiarities you ought to know when printing strings.
    The statement:


    ```

    cout << pName;

    ```


    should actually print the address in hexadecimal format of pName. But cout performs
    a reinterpretation. It takes the content in the memory location pointed to pName,
    i.e. the character ''J'', and prints character by character until the null character
    is found. This means that the entire name ''John Smith'' is printed. The statement:


    ```

    cout << cName;

    ```


    which gives the same result, which we discussed in the Strings chapter.


    The statement:


    ```

    cout << *pName;

    ```


    correctly prints the content of the memory location pointed to by pName, but it
    only takes that character. This means that only ''J'' is printed.


    The statement:


    ```

    cout << &pName;

    ```


    prints the address of the memory location in which pName is stored.


    The statement


    ```

    cout << &cName;

    ```


    prints the address of the memory location where the name ''John Smith'' is stored.


