  md: '# Structured Programming with C++


    # Arrays


    The name of the array is temp. The different values in the array are called **elements.**


    In this way we use a loop, the loop variable represents the index, and do a repeated
    calculation on each of the

    temperatures:


    ```

    for (i=1; i<=30; i++)

    {

    //Do something with temp[i];

    }

    ```


    The loop variable goes from 1 to 30. In the first turn of the loop i has the value
    1, which means temp[i] represents

    temp[1], i.e. the first temperature. In the second turn of the loop i has the
    value 2 and temp[i] represents the second

    tperature.


    By using a loop of code will not increase with the number of temperatures to handle.
    The only thing

    to be modified is the number of turns that the for loop must execute.


    In the code below we calculate the average of all the temperatures:


    ```

    iSum = 0;

    for (i=1; i<=30; i++)

    {

    niSum += temp[i];

    }

    dAvg = iSum / 30;

    cout << dAvg;

    ```


    The variable iSum is set to 0 since it later not be increased by one temperature
    at a time. The loop goes from 1 to 30,

    i.e. equal to the number of elements in the array. In the loop body variable iSum
    is increased by one temperature at

    a time. When the loop has completed, all temperatures have been accumulated in
    iSum. Finally we divide by 30 to get

    a average, which is printed.


    # 4.3 Declaring an Array


    Like for all variables, an array must be declared. Below we declare the array
    temp:


    ```

    double temp[31];

    ```


    The within square brackets indicates how many items the array can hold, 31 in
    our example. 31 positions will be

    created in the primary memory of each which can store a double value. The indices
    will automatically counted from 0.

    Means that the last index is 30. If you need temperatures for the month April,
    which has 30 days, you have two options:


    +   - Declare temp[30], which means the index goes from 0 to 29. 1st of April
    will correspond to index 0,

    2nd of April to index 1 etc. 30th of April will correspond to index 29. The index
    lies consequently one step

    after the actual date.

    - Declare temp[31]. Then 1st of April can correspond to index 1, 2nd of April
    to index 2. 30th of April will

    correspond to index 30. The date and index are here equal all the time. This means
    that the item temp[0] is

    created "vain" and will never be used.


