  md: "# Structured Programming with C++\n\n```\ndouble dAvg(double x1, double x2)\n\
    {\n    return (x1 + x2)/2;\n}\nmain()\n{\n  //...\n  mv = dAvg(no1, no2);\n  //...\n\
    }\n```\n\nHere, the function dAvg() calculates the average of the two numbers\
    \ sent to the function. In main() we call dAvg() with the actual parameters no1\
    \ and no2, which we assume to have been assigned previously in the program.\n\n\
    An alternative is to write only the function declaration before main() and let\
    \ the definition of the function appear after main():\n\n```\ndouble dAvg(double\
    \ x1, double x2);\nmain()\n{\n  //...\n  mv = dAvg(no1, no2);\n  //...\n}\ndouble\
    \ dAvg(double x1, double x2)\n{\n    return (x1 + x2)/2;\n}\n```\n\nThe first\
    \ line declares the function dAvg(). It is exactly identical to the function header,\
    \ followed by a semicolon. Having declared the function, the compiler knows about\
    \ it and is recogized when called from main().\n\nThe definition of the function,\
    \ i.e. the function header plus the body, can be positioned anywhere in the program.\
    \ If you have several functions before main(), you can write the function declarations\
    \ in any order after main().\n\nThis way of first declaring functions and placing\
    \ the definitions afterwards is common by programmers and provides the advantage\
    \ of having main() first, which is logical since the execution starts there.\n\
    \nYou can declare a function in an abbreviated:\n\n```\ndouble dAvg(double, double);\n\
    ```\n\nHere we exclude the formal parameter names and specify only their data\
    \ types. However, the function header of the function definition must be complete\
    \ with formal parameter names."
