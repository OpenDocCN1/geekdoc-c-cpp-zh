  md: "# Structured Programming with C++\n\n# Strings\n\n# 5.10 Upper/Lower Case\n\
    \nWe have previously mentioned that the character codes for the letters-A start\
    \ with 65 and go upwards. This applies to the upper case characters. Lower case\
    \ letters a-z have the same pattern starting with 97, i.c. 32 greater than the\
    \ upper case letters. An upper case is successfully achieved by subtracting 32\
    \ from the character code of the lower case character.\n\nWe will now create a\
    \ program that reads a text in lower case and converts it to upper case and prints\
    \ it:\n\n```\n#include <iostream.h>\n#include <string.h>\nvoid main()\n{\n   \
    \ int i;\n    char cName[30];\n    cout << \"Enter your name in lower case: \"\
    ;\n    cin >> cName;\n    int iLen = strlen(cName);\n    for (i=0; i<iLen; i++)\n\
    \        cout << (char)(cName[i] - 32);\n    cout << endl;\n}\n```\n\nAs usual\
    \ in string handling we must include the header file string.h.\nDeclare the variable\
    \ i to use as loop counter, and a string array cName with space for 29 characters.\
    \ The user is then prompted for his name in lower case, which is stored in the\
    \ array cName.\n\nWe then calculate the length of the input string, which is stored\
    \ in the variable iLen. This value is used as loop limit in the subsequent loop,\
    \ which performs as many turns as there are characters in the input string.\n\n\
    Inside the for-loop we take the ith character from the string cName[i] and decrease\
    \ it by 32. Since this is a math operation, the program understands that it is\
    \ the character code for the ith character that is decreased by 32. This value\
    \ is then cast to char by placing char in parenthesis of the subtraction. Then\
    \ the program understands that it is the corresponding character to be printed.\n\
