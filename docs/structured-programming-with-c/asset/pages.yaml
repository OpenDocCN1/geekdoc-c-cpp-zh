  md: '# 6 Functions


    # 6.1 Introduction


    When working with bigger programs, or functions performing many different tasks,
    it is important to divide the code into small pieces, which makes it easier to
    grasp and maintain. Functions are used for this purpose. A function is a part
    of the program well marked off performs a particular task. A function can be reused
    several times in a program or in many different programs.


    A function, when completed and tested, is like a black box that always works as
    expected. You don''t need to bother about what is inside. You give it a number
    of input values, and it does its job.


    Think for instance of a car driver who wants to increase the speed. He pushes
    the accelerator and the car accelerates. He doesn''t have to bother about fuel
    injection, gear ratio, engine compression and the like. He knows that same thing
    always happens when pushing the accelerator. It is the same with functions. The
    programmer initiates the function from his code and the function performs the
    same task without having to bother the details.


    To summarize, the advantages of functions are:


    +   * Small well marked off program sections

    * Well-structured programs

    * Easy to debug and maintain

    * Reusage of code


    In this chapter we will learn to write functions, supply input values (parameters)
    and receive the result from a function. We will learn how to declare and define
    functions and we will study how to use header files in connection with functions.
    We will also learn about reference parameters – an efficient tool to save memory
    and improve program performance. We will also get in touch with recursive functions,
    i.e. functions calling themselves.


    # 6.2 What Is a Function


    A function is written to perform a specific task. It might need input values and
    it returns the result from the task being performed:


    ![](img/76b5a908064445a4a3a85a788cb00a96_122_0.png)


    The programmer to make the function perform its task must supply required input
    and receive the supplied output.

    Examples of function tasks are:


    +   * Calculate average – here you will have to supply the detailed values for
    the average calculation, and receive the average value delivered by the function.

    * Sort an array – here the function must know which array to sort. It returns
    the sorted array.


