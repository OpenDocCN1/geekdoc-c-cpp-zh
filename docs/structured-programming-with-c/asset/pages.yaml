    # # 7 Files


    # ## 7.1 Introduction


    You have possibly noticed when running our programs during the course so far,
    each run has started from the same origin as previous run. The data entered into
    the program is gone when rumning the program the next time. This is of course
    unacceptable. We must have the possibility to save data entered or calculated
    during one run, so we can continue where we stopped last time. The solution to
    this is to save the data on disk files.


    In this chapter we will go through the basic concepts about file management and
    how to read and write to files in C++.


    In professional programming relational databases of some kind are mostly used
    for data storage. A lot of special code is however required in C++ to do that,
    which is outside the scope of this course. Here, we will only store data in the
    simplest format, namely text files which can be read and updated with a simple
    text editor like the Notepad pad.


    To be able to handle files in C++ we need some knowledge about streams, which
    we will first go through in this chapter. We will then show how to declare a file,
    open it, save data in it, read from it and close it.


    You should normally open the file as late as possible in the program and close
    it as early as possible, since you want to minimize the risk for loss of data
    by keeping the files open as short time as possible. If the system would break
    down while a file is open, the result might be a corrupt file not possible to
    read from. You will then have to return to the last backup of the file.


