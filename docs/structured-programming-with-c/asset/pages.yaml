  md: '# Structured Programming with C++


    # Variables


    Here the dTaxpercent gets the value 0.25, the variable iNo the value 5 and the
    variable dUnitprice the value 12. The equal character (=) is used as an assignment
    operator. Suppose that the next statement is:


    ```

    dTotal = iNo * dUnitprice;

    ```


    In this statement variableNo represents the value 5 and dUnitprice the value 12.
    The right part is first calculated as 5*12=60. This value is assigned to the variableTotal.
    Note that this is not the question of equality in normal math like in the equation
    x=60, where x has the value 60. In programming the equal sign means that something
    happens, namely that the right part is first calculated, and then the variable
    is left assigned that value.


    C++ performs the operations in correct order. In the statement:


    ```

    dToBePaid = dTotal + dTotal * dTaxpercent;

    ```


    the multiplication dTotal * dTaxpercent will be performed first, when 60 * 0.25=15.
    The value 15 will then be added to dTotal which makes 60+15=75. The value 75 will
    finally be assigned to the variable dToBePaid.


    If C++ performs the operations in the stated order, we would get the erroneous
    60 + 60, which makes 120, multiplied by 0.25, which makes 30.


    If you need to perform an addition before a multiplication, you must use parentheses:


    ```

    dToBePaid = dTotal * (1 + dTaxpercent);

    ```


    Here the parenthesis is calculated, which gives 1.25. This is then multiplied
    by 60, which gives the correct value 75.


    Priority rules:


    +   (*)

    */

    +-


    # 2.5 Initiating Variables


    It is possible to initialize a variable, i give it a start value, in the declaration:


    ```

    double dTaxpercent = 0.25;

    ```


    Here we declare the variable dTaxpercent and simultaneously specify it to get
    the value 0.25.


    You can mix initiations and declarations in the same statement:


    ```

    double dTaxpercent = 0.25, dTotal, dToBePaid;

    ```


