    Many times we cannot advance in predict the number of items needed for the array,
    for instance when reading a number of product ids from an array from a file, where
    the number of products is unknown.


    The solution to this problem is to use dynamic memory. The dynamic memory area
    is capable of assigning space during the execution of the program and not at the
    compilation. Different amounts of memory might be needed at different execution
    occasions. A disadvantage is however that the program cannot guarantee the requested
    amount of memory is available. Therefore, you must in the code insert a check
