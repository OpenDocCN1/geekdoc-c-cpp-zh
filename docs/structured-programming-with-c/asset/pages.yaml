  md: '# # 1 Introduction to Programming


    1.1 What Does It Mean to Program


    1.1.1 Algorithm


    Programming is not only coding. Primarily it implies structuring of the solution
    to a problem and then refine the solution step by step. When refined to a level
    depth, you have created an **algorithm**. Then it is time to translate each step
    of the algorithm to program code.


    Suppose you have a problem that needs to be solved. Then you begin with a sequence
    of operations at an overview level that needs to be performed to solve the problem.
    You then start from the beginning again and focus on one operation at a time and
    find out whether the operation needs to be refined to more detailed steps. You
    then proceeded to the next level and refine further. This refinement process goes
    on until you arrive at a level depth to start coding.


    Creating an algorithm to solve a problem is in general the most laborious task
    of the programming work. Many people do the mistake of starting code at once,
    which makes you focus on code details and forget the actual problem to be solved.
    That with we use an unstructured and inefficient code to understand and maintain.


    That''s why we emphasize that you structure your logic train of thought and construct
    a good algorithm before starting to code.


    1.2 JSP


    A JSP graph is a tool to create an algorithm. JSP is an abbreviation for Jackson
    Structured Programming and is a commonly used instrument for logic structuring.
    Let''s take an example.


    You are supposed to create a program that calculates the price of a product to
    be bought by a customer. The customer specifies the product id and the requested
    quantity. The program should then calculate the relevant discount, add tax and
    show the customer price. A JSP graph could look as follows:


    ![](img/76b5a908064445a4a3a85a788cb00a96_12_0.png)


    The upper box is the name of the program. We have split the solution into four
    steps at an overview level. You read the steps from left to right. As you probably
    realize the algorithm is too rough to be able to write code. So we proceed by
    refining the solution to the next level:'
