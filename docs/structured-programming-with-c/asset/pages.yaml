  md: '# 2.3 Declaring Variables


    The purpose of declaring a variable is to tell the program to allocate space in
    the working memory for the variable. The

    claration:


    ```

    int iNo;

    ```


    tells that we have a variable with the name iNo and is of integer type (int).
    You must always specify the data type to

    allocate the correct memory space. An integer might require 4 bytes while a decimal
    value might require 16

    bytes. How many bytes to allocate depends on the operating system. Different operating
    systems use different amounts

    of for the different data types.


    The variable name should tell something about the usage of the variable. Also,
    a standard used by many people is to

    allocate 1-3 leading characters to denote the data type (i for integer).


    Note that each program statement is ended by a semicolon.


    Below we declare a variable of decimal type:


    ```

    double dUnitPrice;

    ```


    double means decimal number with decimal precision. Compare to float which has
    single precision. Since double

    requires twice as many bytes, a double variable can course store many more decimals,
    which might be wise in

    technical calculations require high precision.


    The most common data types:


    short | integer | Usually 2 bytes |

    |---|---|--|

    | int | integer | Usually 4 bytes |

    | float | decimal | Usually 4 bytes |

    | double | decimal | Usually 8 bytes |

    | bool | true or false | Usually 1 byte |


    You can declare several variables of the same type in one statement:


    ```

    double dUnitPrice, dTotal, dToBePaid;

    ```


    The variables are separated by commas.


    Note that C++ is case sensitive, i.e. a ''B'' and ''b'' are considered different
    characters. Therefore the variables:


    ```

    dToBpaid

    dToBePaid

    ```


    are two different variables.


    # 2.4 Assignment


    Now we have explained how to declare the variables, but how do the variables get
    their values? Look at the following code:


    ```

    dTaxpercent = 0.25;

    iNo = 5;

    ```


