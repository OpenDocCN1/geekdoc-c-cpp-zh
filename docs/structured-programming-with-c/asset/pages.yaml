  md: '# Structured Programming with C++ Variables


    It can be hard to remember in which direction to write the stream operator. You
    can regard it as an arrow directed towards the console, i.e. the characters are
    streamed out to the console.


    The next program statement (cin statement) implies that the program wants something
    from the console (cin =). The program stops and waits for the user to enter a
    value and press Enter. The value is stored in the variable iNo. The stream operator
    >> is here in the opposite direction and indicates that the entered value is streamed
    the other way, i.e. to the program.


