  md: '# Structured Programming with C++


    ```

    char cName[30];

    is.getline(cName, 29);

    ```


    The statement reads up to 29 characters from the instream, the null character
    is put after the last read character.

    The read operation continues until the end line character is reached. Suppose
    the data in the stream is linewise for instance data has been entered using Notepad
    and Enter has been pressed after each line. Then one line at a time is read.


    If there are fewer characters than 29 at the current line in the file, for instance
    17 characters, the null character is stored in the 18th position.


    If there are more than 29 characters at the line in the file, the input is interrupted
    after 29 characters.


    Thus, the programmer must carefully check how data is stored in the file, so as
    not to loosing important information.


    # 7.4 Writing to a Stream


    Writing data to an outcast can also be done in two ways:


    **Formatted output** is done with statements like:


    ```

    os << cName;

    ```


    Here we assume that an outcast has been created and connected to a specific disk
    file. The statement implies that the characters in the variable cName are written
    to the outcast.


    Formatted output also implies that you have the opportunity to control the layout
    of the data, for instance with the function width(). Compare the ''Variables''
    chapter, which we discussed formatted output.


    **Unformatted output** means that the characters in the variable are written to
    the outcast exactly in the format they are stored in the file, for instance:


    ```

    os.put(c);

    os.write(cName, 30);

    ```


    The ''put()'' function prints a character, namely the character represented by
    the variable c, to the outcast. The write() function writes 30 characters from
    the variable cName to the outcast os.


    # 7.5 Attaching a File to a Stream


    Before being able to use an outcast or outcast, it must be declared and attached
    to a disk file. The statement:


    ```

    ifstream infile("address.txt");

    ```


    declares the infile and attaches it to the disk file named address.txt.


    istream is short for ''input file stream''. You can regard it as a data type similarly
    to integer or double. But actually, istream is a class from which we derive an
    object of the istream type with the object name infile.


    When this statement has been executed the outcast is ready for read operations.


