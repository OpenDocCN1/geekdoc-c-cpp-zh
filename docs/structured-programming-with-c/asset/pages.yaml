  md: 'Structured Programming with C++


    # 9.8 Pointer to Structure


    You can declare pointers to structures in the same way as declaring pointers to
    other data types:


    ```

    Prod *pProd;

    ```


    To instade the pointer to the structure variable prodOne we write:


    ```

    Prod* pProd = &prodOne;

    ```


    This means that pProd equals the address to prodOne.


    The advantage is to be able to use pointer arithmetic to step through the different
    structure variables:


    ```

    pProd++;

    ```


    This statement moves to the next structure variable.


    With a pointer to a structure you are not allowed to use the period (.) as delimiter
    between the variable and member. You must use the -> characters:


    ```

    pProd->iNo = 25;

    ```


    For instance, to print the information for the structure pointed to by pProd,
    we can use the following statement:


    ```

    cout << pProd->cName endl <<

    pProd->iId endl <<

    pProd->dPrice endl <<

    pProd->iNo endl <<

    pProd->cSupp;

    ```


