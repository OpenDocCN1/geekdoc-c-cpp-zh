    As you can see the tree we has eleven branches and two ''X''s to the trunk. We
    therefore need an outer loop that runs eleven times, where each turn prints a
    branch. Each branch consists of a number of ''X''s, different depending on which
    branch being printed. Furthermore we will have to print a suitable number of blanks
    before the ''X''s, so that the branches are centered symmetrically around the
    middle trunk. We therefore need two inner loops, one that prints the leading blanks
