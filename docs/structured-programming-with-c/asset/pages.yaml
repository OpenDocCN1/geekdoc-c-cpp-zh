  md: '# About the Book and the Course


    This book is intended as course material for the course Structured Programming
    with C/C++ at university level. It contains eight chapters, for each lecture of
    the course. The chapters are:


    +   1. Introduction to programming. Here we go through general principles about
    what programming means. We will be introduced to the development tool Microsoft
    Visual C++ and build your first programs.

    2. Variables. Here we start from the beginning and explaining all details in the
    first programs. You will learn how variables are and how they are used for storing
    of values in the program.

    3. Selections and loops. This chapter will teach you to include intelligence into
    the programs, which will be capable of doing different things under given conditions.
    The programs will also be able to repeat any number of times.

    4. Arrays. Arrays are very useful tools for storing of and working with information
    items of the same kind, like for instance measurement values, products with prices,
    or customer data.

    5. Strings. Texts (strings) are handled in a special and tricky way in C++. Because
    of a special chapter is dedicated to this subject.

    6. Functions. In this chapter, when our programs are getting to some size, we
    divide the code into subroutines or functions.

    7. Files. Data may need to be stored or accessed. We will learn the basics of
    file management.

    8. Pointers. This chapter goes deeper into the more advanced aspects of C++ programming
    and implies a springboard to professional level.

    9. Structures. Data is often organized into structures, which makes easier input
    and output of data structures. Here we also use pointers together with structures.


    Each chapter contains theoretical programs and examples. At the end of each chapter
    you will find solutions to the exercises. Remember, though, that each problem
    could be solved in different ways, and maybe your own solution is as good as,
    or even better than the one presented. Therefore, my recommendation is that you
    as far as possible try to manage without the solutions.


    The purpose of the course Structured Programming with C/C++ is primarily to teach
    how to "think programming" and secondly to teach C++ code. Therefore, I will emphasize
    how to focus on the problem solution and preparing the code.

    JSP (Jackson Structured Programming) is a common tool within programming and is
    used to structure a problem. We will learn how to use JSP to build your solution.
    **Flow charts** is an alternate to JSP, which we will also make some notice to.


    Primarily, this is a beginner''s course in C, but we will use C++ tools for input
    and output.

    Learning to program is not made in short time. It requires long-term and patient
    work with reading, coding, testing and debugging. There is no shortcut, but if
    you work with endurance, you will have many times of inspiration and nice experiences.


    I would like to stress that, when you write your programs, you will make many
    mistakes. No programmer writes the correct code alone from the beginning. Error
    tracing and correction is a natural ingredient of the development process.


