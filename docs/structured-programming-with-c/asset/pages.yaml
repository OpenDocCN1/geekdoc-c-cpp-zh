  md: '# Structured Programming with C++


    # Introduction to Programming


    +   * Selection – the program selects one of several operations depending on the
    prerequisites. The program makes a selection based on some condition.

    * Iteration – the program repeats a series of instructions a certain number of
    times.


    The logic principles can also be combined. For instance, a sequence of instructions
    can be repeated a number of times if a specific condition is satisfied, otherwise
    another sequence of instructions should be performed a specific number of times.


    All programming use these three logic principles. If you have built your algorithm
    in a correct way, it is only a question of selecting a programming language when
    the coding is to place. The price calculation algorithm above should consequently
    give the same result irrespective of whether the code is written in C++, Java
    or VisualBasic.


    In the JSP graph the box "Calculate gross price" is refined in a sequence of three
    operations, from left to right:


    +   * Look for the product in product file

    * Pick the product''s price

    * Multiply by quantity


    The discount calculation in the price program above could imply a more differentiated
    situation:


    +   * If the price is between 100- and 500: the customer will get 5% discount.

    * If the price is between 500- and 1000: the customer will get 8% discount.

    * If the price is above 1000-: the customer will get 10% discount.


    Here the program must do a selection.


    # 1.2 Coding


    When you have refined your algorithm to a level detailed enough, it is time to
    write code. This written code is called source code. The code must follow the
    rules in execution for the programming language, it must follow the syntax. Each
    programming language has its own rules.


    You can use any word processor or text editor you like, such as the Notepad, Wordpad
    or Word. If you use word processors like Word or Wordpad, you must save the file
    as pure text (.txt).


    It is however recommended to use the text editor in the program development package
    you are using. The advantage is that you will get some support when coding. Microsoft
    Visual C++, which is the program development used in this course, contains an
    editor:


    +   * Shows keywords in C++ in blue colour and comments in green colour,

    * IntelliSense, i.e. proposes code alternatives in certain situations,

    * Supports context help, i.e. shows an explanation of a certain item if you put
    the cursor on the item and press F1,

    * Provides support debugging by allowing you to execute the code up to a breakpoint,
    where you can examine variable values at this particular position.


    There are other tools for C++ like Borland and Dev C++. The tools do somewhat
    as concerns details of the code. The important thing is that you learn to "think"
    structured programming. In this course we have used Microsoft Visual C++ 2008,
    and all program examples are tested in this environment.


