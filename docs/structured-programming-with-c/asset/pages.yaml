    |---|---|

    | dTaxpercent | 0.25 |


    Here we have the name ''dTaxpercent'' to hold the value 0.25. In can principle
    you use any variable name, but it is recommended to use a name that corresponds
    to the use of the variable. When the variable name appears in a calculation the
    value will automatically be used, for example:


    ```

