    # 9.11 Summary


    In this chapter we have learnt what a structure is, namely a tool to handle items
    of different information that in some way belong together, for instance data for
    a customer, all data for a product etc. We have learnt to define structures and
    declare structure variables and fill the structure with values.


    We have also seen how to use arrays with structures and pointers to structures.
    When unable to predict the number of items to be created by the array, we have
    stored it in the dynamic memory area with a new keyword.


    Finally you have learnt how to send structures as parameters to functions, either
    as reference parameters, array parameters or pointer parameters.


    You will now try your new knowledge in a number of exercises.


