  md: '# Structured Programming with C++


    Compare with the following code:


    ```

    double dNumerator = 7;

    int iDenominator = 3;

    cout << dNumerator / iDenominator;

    ```


    Here the number of double type, and the compiler understands that it should perform
    a normal division and include the decimals. The output will in this case be 2.333.


    Many times you have declared variables as int, but still want a division with
    the decimals kept. The solution is to do a type conversion (type cast) to double
    for the numerator before the division is executed:


    ```

    int iNumerator = 7, iDenominator = 3;

    cout << (double)iNumerator / iDenominator;

    ```


    Type cast is performed by specifying the new data type in parentheses immediately
    before the variable. We have put down within parentheses before the variable,
    which makes a decimal division to be performed with the result 2.333.


    # 2.15 The Random Number Generator


    In situations where an unpredictable number is required, the random number generator
    is used. Examples of such situations are games, programs, dice rolling etc.


    The random number generator provides random numbers in the interval 0-32768. Why
    just 32768? It has to do with the binary storage of numbers. Two bytes can contain
    65536 different numbers (2^16). Half of these are dedicated for negative numbers
    and half to positive = 32768.


    The function rand() gives a number in the interval 0-32768. rand is an abbreviation
    of random. We use this number with the modulus operator: rand() %6 which gives
    the remainder at integer division with 6, i.e. a number in the interval 0-5. The
    reason why it can''t be greater is, if the remainder had been 7, then 6 could
    be divided once more and the remainder had 1.


    Now we add 1:


    ```

    rand() % 6 + 1

    ```


    which gives an integer in the interval 1-6, i.e. a random dice roll.


    Each time you run a program using random numbers, it will start from the same
    "location", you will always get the same series of numbers. It is of course not
    acceptable. Therefore you must tell the generator to start at a random position,
    which you do with the function:


    ```

    srand(time(0))

    ```


    srand means "start". The function uses the system clock (time) as origin for the
    calculation. The system clock contains the number of milliseconds since Jan 1st
    1990 (different for different processors). We can predict the millisecond to be
    used when the generator gets its starting point.


    To make this work, you must include the header files stdlib.h och time.h. Note
    that these files require ''h''.


