  md: "# Structured Programming with C++\n\n# Selections and Loops\n\nThe first statement\
    \ in the loop body calculates the value of the left part (LP). This is the actual\
    \ definition of the equation (x^2- 6x + 8). If this value is 0, we increase InNo\
    \ by 1 and the root is printed.\n\nThen we increase the root value by 1.\n\n#\
    \ 3.22 Interrupting a Loop - break\n\nMany times you don't want to set an upper\
    \ limit on the number of loop turns. Then you can use a condition for the loop\
    \ which is always true, for example:\n\n```\nwhile (1==1)\n```\n\n1 is always\
    \ equal to 1, so the loop will run an infinite number of turns. Therefore we need\
    \ a possibility to, from inside the loop body, interrupt it, i.e. jump out of\
    \ it and continue with the first statement after the loop. That is accomplished\
    \ with the keyword:\n\n```\nbreak;\n```\n\nWe will give a program example of this.\
    \ We will write a program where the user repeatedly is prompted for a number,\
    \ and the program will display the square root of the number. Since we cannot\
