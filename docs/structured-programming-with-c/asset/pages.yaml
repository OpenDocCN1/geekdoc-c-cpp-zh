  md: '# Structured Programming with C++


    # Introduction to Programming


    C++ is a very extensive language that can be used both within structured programming
    and object oriented programming. Furthermore, windows programming in the graphic
    Windows environment is supported. C++ has, thanks to its level of detail, its
    strength in digging deeply into the most obscure corners of the computer, controlling
    the system, communicate with hardware, circuit boards and external equipment like
    measurement units and communication devices. In this, however, we will stick to
    basic structured programming.


    C++ is a compact language with many symbols having their own meanings. Means that
    C++ code looks complicated to the novice. On the other hand it provides many tools
    for efficient coding. Programs in C++ are very rapid due to the fact that the
    compiler optimizes them to each processor type. That is the reason why you mostly
    use C++ in situations where performance and runtime are ultimate.


    # 1.3 Compiling and linking


    When you have written the code of your program, it should be compiled, i.e. translate
    it to machine code consisting of 1s and 0s. The latter is understood by the processor.
    Before reaching this level, there is an interim level of code, called object code.
    Thus the compilation is made in two steps, first from source code to object code,
    and then from object code to machine code. In Microsoft Visual C++ you don''t
    have to bother about these two steps, because the compilation from source code
    to machine code is taken care of by just clicking a button.


    When writing a program, you split the code into several files of source code.
    The different files contain references to each other. When all source code has
    been compiled the different parts of the program must be linked to one single
    executable program (exe file). In some environments the linking must be initiated
    manually. In Visual C++ the linking is taken care of automatically directly after
    the compilation.


