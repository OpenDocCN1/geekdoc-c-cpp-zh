    ```

    cout << "Enter your name: ";

    cin >> cName;

    ```


    Let''s say the user enters ''John''. These four characters are stored in the cName
    array, where the first item cName[0] contains the character ''J'', the second
    item cName[1] the character ''o'', cName[2] the character ''h'' and cName[3] the
    character ''n''.


    In addition, an extra character is always stored as the last of character string.
    It is the so-called null character ''\0'', which is stored in the fifth position
    in the array cName[4].


    The program should now print what the user entered:


    ```

    cout << "Your name is " << cName;

    ```


    In our case the text "Your name is John" will be printed. Note that when an entire
    string array is printed, you don''t need to specify any indeces in the cout statement.
    The procedure by cout is to print one character after the other in the string
    array from the first position until the null character is found.


    Suppose the user in the program section above enters his own name ''John Smith''.
    When the cout statement is executed, only the text ''Your name is John'' is printed.
    The reason for this is when text is entered from the keyboard, only characters
    up to the first blank will be stored in the array. This is a limitation of the
    cin statement.


    A solution to this problem is to use another input function instead of cin:


    ```

    char cName[30];

    cout << "Enter your name: ";

    cin.getline(cName,29);

    ```


