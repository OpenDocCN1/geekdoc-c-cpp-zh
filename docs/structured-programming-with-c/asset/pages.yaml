    # 2.11 Formatted Output


    When programming for a DOS window, which we have done so far and will during the
    rest of the course, there are very limited possibilities for a nice layout of
    printed information, especially if you compare to common Windows environment.
    C++ offers a few functions for improved control of printed information. We will
    discuss the following:


    +   - Fixed / floating decimal point. When printing large numbers, for instance
    the number 9 560 000 000 (fixed) might be printed as 9.56E+9, which is interpreted
    as 9.56 x 10^ (floating decimal point). C++ itself controls when to use either
    of these representations. Many times we want to control this ourselves.

    - Number of decimals for numeric data.

    - Number of screen positions allocated for data.


    To be able to use these possibilities we will have to include the file iomanip.h.


    # 2.11.1 Fixed Decimal Point


    To instruct the program to output values with fixed decimal points the function
    setiosflags() is used. It must reside in a cout statement:


    ```

    cout << setflags(ios::fixed);

    ```


    The characters in setiosflags represent input/output. A flag is a setting that
    can be switched on or off (0 or 1). The double colon :: is a class operator and
    is used to refer to a value defined in a certain class. "fixed" is such a value.
    We will not go further into classes in this course, but it does not hurt to have
    basic knowledge about classes.


