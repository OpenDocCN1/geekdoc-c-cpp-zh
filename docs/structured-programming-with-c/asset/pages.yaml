    # 4.4 Initiating an Array


    You can assign values to an array already at the declaration, e.g:


    ```

    int iN0[5] = {23, 12, 15, 19, 21};

    ```


    Here the array iN0 will hold 5 items, where the first item with index 0 gets the
    value 23, the second item with index 1 the value 12.


    The enumeration of the values must be within curly brackets, separated by commas.

    As a matter of fact it is redundant information to specify the number of items
    to 5 in the declaration above, since the number of enumerated values is 5. Therefore
    you could as write:


    ```

    int iN0[5] = {23, 12, 15, 19, 21};

