  md: '# 8 Pointers


    # 8.1 Introduction


    A pointer is a special kind of variable which contains a memory address to instance
    a number instead of directly refer to the number. That implies a detour to the
    value via the memory address.


    This might sound unnecessarily complicated, implies a number of advantages like
    for instance more efficient program code, faster execution and memory saving.
    Especially in object oriented programming you get these advantages when copying
    objects or sending objects to functions. Object oriented programming is however
    beyond the scope of this course.


    The pointer concept is unique for C++. It is for instance not present in the programming
    languages Visual Basic or Java. As a consequence C++ might be felt more complicated
    than other languages.


    In this chapter we will acquire basic knowledge about pointers. We will learn
    how to use pointers to different data types, how to declare pointers and assign
    values. We will examine the analogy between pointers and arrays and how to use
    pointers as parameters to functions.


    Finally we will touch the subject dynamic memory allocation, which actually does
    not closely relate to pointers, but still is used in connection with pointers.


    # 8.2 What Is a Pointer


    A pointer is a variable of a special kind which can only contain a memory address
    of the primary memory. This memory location in turn contains a value of some kind.'
