    # 5.16 Substring


    Sometimes you will need to extract a number of characters from a string. Then
    we will get use of the strncpy() function, which copies a given number of characters
    from one string to another. Example:


    ```

    strncpy(cStr1, cStr2, iNo);

    ```


    This statement copies the number of characters given by the variable iNo counted
    from the beginning of the string cStr2 and stores this in cStr1.


    If you want to copy a number of characters from a given position and not from
    the beginning of cStr2, use this variant:


    ```

    strncpy(cStr1, cStr2 + i, iNo);

    ```


    This statement copies the number of characters given by the variable iNo counted
    from cStr2 and stores this substring in cStr1.


    Here we the first time to get touch with the similarity between strings and pointers.
    A pointer is a variable that points to a memory address. When we write cStr2,
    it is interpreted as a pointer that points to the string starting with the first
    character of cStr2, i.e with index=0. If we write cStr2+1, it is interpreted as
    a pointer that points to the character with index=1 in cStr2. If we write cStr2+i,
    it is interpreted as a pointer that points to the character with index=i of cStr2.
    Enough with pointers for this.


    We will get use of this function in subsequent program examples.


