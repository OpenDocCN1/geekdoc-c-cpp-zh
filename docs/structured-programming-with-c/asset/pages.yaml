  md: '# Structured Programming with C++


    # Arrays


    The items of the array are not yet sorted. We want to write a program that sorts
    them by size. The problem is that a computer is not capable of, like the human
    eye, scan the values and instantly sort. We have to write code that systematically
    compares two values in turn and interchange their positions in the array.


    We will use two variables, l and r, which are indeces of the array to two items.
    l means "left" and r "right". These items are compared in pairs, and if the right
    item is less than the left, they will interchange their positions in the array:


    | 0 | 1 | 2 | 3 | 4 | 5 |

    | 5 | 3 | 9 | 8 | 2 | 7 |


    The indices of the array have the interval 0-5. The variable l has from the beginning
    value 0 and r the value 1, i.e. point on the first two items of the array. Since
    the right item is less than the left (3 is less than 5), they are interchanged:


    | 0 | 1 | 2 | 3 | 4 | 5 |

    | 3 | 5 | 9 | 8 | 2 | 7 |


    We increase r by 1, so that it points to the value 9, while l remains 1. 9 is
    not less than 3, so no interchange is made. r is increased by 1:


    | 0 | 1 | 2 | 3 | 4 | 5 |

    | 3 | 5 | 9 | 8 | 2 | 7 |


    Neither this there is no interchange, since l is greater than 3. We increase r
    by 1. Then r points to the value 2, which is less than 3, so the items are interchanged:


    | 0 | 1 | 2 | 3 | 4 | 5 |

    | 2 | 5 | 9 | 8 | 3 | 7 |


    We increase r by 1. 7 is greater than 2, so the items remain:


    | 0 | 1 | 2 | 3 | 4 | 5 |

    | 2 | 5 | 9 | 8 | 3 | 7 |


    Now r has gone through all values, and as result we have got the least item on
    index position 0 in the array. We have performed a series of comparisons.


    Now we increase l by 1 and perform a new series of comparisons, where r goes from
    index position 2 to 5:


    | 0 | 1 | 2 | 3 | 4 | 5 |

    | 2 | 5 | 9 | 8 | 3 | 7 |


