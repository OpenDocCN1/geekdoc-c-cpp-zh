  md: "# Structured Programming with C++\n\n# Arrays\n\nWe will use a more refined\
    \ method, namely halve the index interval repeatedly. We go in to the middle item\
    \ of the array and check if the searched value is to left or right. When selected\
    \ which half to continue with, we halve part again. This is repeated until we\
    \ find the searched value. The execution time will be reduced considerably.\n\n\
    Suppose we have an array with 31 items (index 0-30)\n\n| 0 | 1 | 2 | ... | 15\
    \ | ... | 30 |\n|---|---|---|---|---|---|---|n| 2314 | 2345 | 3123 | | 4526 |\
    \ | 6745 |\n\nThe index values are shown above the product ids.\n\nSuppose we\
    \ are searching for product id 5321. We begin with checking whether 5231 is less\
    \ than the middle item with index position 15, namely 4526. If we so on with the\
    \ left interval, otherwise the right. In our case we use the right interval, we\
    \ halve and get index position 22 (index must always be an integer). We check\
    \ whether the searched product 5231 is greater or less than the product id on\
    \ position 22, etc.\n\nWhen divided the interval enough number of times, we will\
    \ have found the searched item, or otherwise it does not exist in the array.\n\
    \nWe will now doc the code for this. We first declare some variables:\n\n```\n\
    int l=0, r=30, iFound=0, iPos, iSrch;\n```\n\nThe variables l and r are index\
    \ positions of the array. l is the left end point of the interval, which from\
    \ the beginning is 0. r is the right from which the beginning is 30.\n\nThe variable\
    \ iFound is used to indicate whether or not the searched product id has been found.\
    \ The value 0 means not yet found, and the value 1 means that it has found.\n\n\
    The variable iPos is the index for the found product id. The variable iSrch is\
