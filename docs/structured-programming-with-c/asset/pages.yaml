  md: 'Structured Programming with C++


    Pointers


    We have declared the array iNos to contain six items. Suppose an integer takes
    4 bytes in the working memory. If the first integer (5) is stored in memory address
    2000, then the next integer (12) will be stored in memory address 2004, and the
    third in 2008.


    Now we declare an pointer to point to the first item of the array:


    ```

    int* pNos = iNos;

    ```


    pNos now has the value 2000 (the address of the first item in the array).


    We can now perform the pointer arithmetic:


    ```

    pNos++;

    ```


    which means that pNos is increased by 1. You might be fooled to believe that pNos
    now has the value 2001. But that is not the case. Since we have declared pNos
    as a pointer to integer, the system knows that each integer requires four bytes,
    and pNos is consequently increased by 4 making the new value of pNos be 2004.
    This implies that pNos now points to the second item of the array.


    If the array would have been declared as double and pNos declared as a pointer
    to double, the system knows that each double number takes 16 bytes, and a stepwise
    increase would add 16 to pNos.


    As a consequence the data type pointed to by a pointer is of ultimate importance
    when using pointer armetics.


    ![](img/76b5a908064445a4a3a85a788cb00a96_179_0.png)'
