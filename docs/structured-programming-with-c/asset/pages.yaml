  md: '# 9 Structures


    # 9.1 Introduction


    When working with data from files and databases it is often convenient to process
    big portions of data in one lump, for instance an entire customer record in a
    customer file. A good tool for this is the structure concept. A structure is a
    set of data that in some way has an intermediary relation.


    In connection with structures we will be using pointers and pointer arithmetics
    that we learnt in the previous chapter.


    Structures are a pre-state to classes within object oriented programming. Therefore,
    this chapter is a bridge to the next step of your programming education, object
    oriented programming.


    In this chapter we will learn how to define structures, handle information stored
    in structures, with arrays of structures and files in connection we will learn
    how to use pointers to structures, how to send structures to a function and store
    structures in the dynamic memory.


    # 9.2 What Is a Structure


    Think of a customer record in a customer file that contains name, address, telephone,
    email, discount profile, terms of delivery, terms of payment and so forth. All
    this information is stored for each customer in the customer file.


    When reading, processing and saving this information to a file or database it
    is convenient to be able to handle all data for a customer in a uniform way. It
    is then gathered into a structure, which provides better organization of the program
    code.


    You can create an array of structure items, where each item of the array is a
    structure with all information per customer. The array will contain all information
    for all customers.


    # 9.3 Defining a Structure


    First we will learn to define a structure template, i.e. specify the shape of
    the structure, the structure members and suppose we want to work with a product
    file like:


    +   * Product name

    * Product id

    * Price

    * Quantity in stock

    * Supplier


    This means that each product in the file will contain these five members.'
