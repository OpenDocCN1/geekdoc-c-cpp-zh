    # 2.11.3 Number of Positions


    An efficient way of having numeric data in columns with the 1 unit digit straight
    below each other, is to use the

    setw() . ''w'' represents width. Example:


    ```

    cout << setw(8) << dAverage;

    ```


    This statement allocates eight positions for the value of the variable dAverage,
    and the value is printed right-aligned

    within this space.


    Remember that setw() only applies to the new value, which that it must be repeated
    for each value to be printed.

    Example:


    ```

    cout << setw(8) << dValue << endl;

    cout << setw(8) << dValue2 << endl;

    cout << setw(8) << dAverage << endl;

    ```


    The three variable values will be printed before each other right aligned when
    screen positions, which implies

    a nice column with the 1 unit digits right below each other.


