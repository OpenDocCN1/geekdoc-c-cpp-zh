  md: "# Structured Programming with C++ Arrays\n\nHere 9 is not less than 5, we increase\
    \ r by 1 and so forth. When r arrives at index 4, the right item (3) is less than\
    \ the left t (5), we interchange them.\n\nWhen two series of comparisons have\
    \ been completed, we have got the two least items on the two first positions:\n\
    \n| 0 | 1 | 2 | 3 | 4 | 5 |\n|---|---|---|---|---|---|n| 2 | 3 | | | 5 | 7 |\n\
    \nOnce again we increase l by 1 and r go from the item immediately to the right\
    \ of l to the last item of the array. This is repeated until we compare the two\
    \ last items of the array:\n\n| 0 | 1 | 2 | 3 | 4 | 5 |\n|---|---|---|---|---|---|n|\
    \ 2 | 3 | 5 | 7 | 8 | 9 |\n\n1 r\n\nAfter completion of the last comparison, the\
    \ entire array is sorted.\n\nTo summarize, l goes from 0 to the next last position\
    \ of array, while r goes from the position to the right of l to the last position\
    \ of array. We use an outer loop for the l-values and an inner for the r-values:\n\
    \n```\nfor (l=0; l<=4; l++)\n{\n  for (r=l+1; r<=5; r++)\n    //Check if right\
    \ is less than left\n    //and in that case interchange\n  }\n}\n```\n\nl goes\
    \ from 0 (first position of the array) to 4 (next last position), while r goes\
    \ from l+1 (the position to the right of l) to 5 (last position).\n\nThe check\
    \ whether the right is less than the left is made by an if statement:\n\n```\n\
    if (iNos[r] < iNos[l])\n```\n\nThe interchange is a tricky thing. We cannot directly\
    \ let two variables change values. We must use an intermediary storage, a temporary\
    \ variable that stores one of the values:\n\n```\ntemp = iNos[1];\niNos[l] = iNos[r];\n\
    iNos[r] = temp;\n```\n\nHere we let the variable temp get the value of the left\
    \ item, then we let the left item get the value of the right item, and finally\
    \ we let the right item get the value of the temporary variable, i.e. the old\
    \ value. This triangular exchange has the effect that the two array items interchange\
    \ their values. After the triangular exchange the value of temp is of no concern.\n\
