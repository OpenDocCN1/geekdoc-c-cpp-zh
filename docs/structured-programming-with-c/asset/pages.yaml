  md: "# Structured Programming with C++\n\n# Strings\n\n```\n#include <iostream.h>\n\
    void main()\n{\n    int i, j;\n    char x = 'X', blank = ' ';\n    for (i=10;\
    \ i>=0; i--) //first outer for-loop\n    {\n        for (j=0; j<i; j++) //first\
    \ inner for-loop\n            cout << blank;\n        cout << x;\n        for\
    \ (j=0; j<10-i; j++) //second inner for-loop\n            cout << x << x;\n  \
    \      cout << endl;\n    }\n    for (i=0; i<2; i++) //second outer for-loop\n\
    \    {\n        for (j=0; j<10; j++) //inner for-loop\n            cout << blank;\n\
    \        cout << x << endl;\n    }\n}\n```\n\nWe declare a variable named x that\
    \ correspond to the 'X', and a variable name corresponding to the blank character.\n\
    The first outer for-loop has an i loop counter and goes from 10 to 0 (11 turns).\
    \ We selected to let the runs backwards to the subsequent math easier. i is consequently\
    \ a line counter for the branches of the tree.\nThe first inner for-loop has a\
    \ j loop counter and goes from 0 to i. It prints the correct number of blanks\
    \ for each branch. Since i is reversed, the number of blanks will decrease for\
    \ each branch. And since two turn of for-loop prints one blank.\nCompletion of\
    \ the loops for a branch, first 'X' is printed. Since the number of 'X's at each\
    \ branch is odd, the remaining number of 'X's to be printed is.\nThe second inner\
    \ for-loop prints 'X's with two 'X's for each turn of the loop. We use j loop\
    \ counter, which goes from 0 to 10-i. This means that the number of 'X's increases.\
    \ Since two 'X's are printed for each turn of the loop, there will always be an\
    \ even number of 'X's.\nThe second outer for-loop, which builds the trunk of the\
    \ tree, has i loop counter and goes from 0 to 1 (two turns). For each of the two\
    \ turns, there is an inner for-loop that goes from 0 to 9 and prints 10 lines.\
    \ After the inner loop, an 'X' is printed.\nThis complex algorithm probably requires\
    \ some thinking. You could preferably a scheme of how i and j change their values,\
