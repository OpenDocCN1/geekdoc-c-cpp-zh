  md: '# 2 Variables


    # 2.1 Introduction


    In this chapter you will learn what a variable is, how to declare a variable,
    i.e. tell the computer that there is a variable in the program, and how to assign
    values to variables. You will also learn how to perform simple mathematic calculations,
    how to read values from the keyboard, how to display information on the screen
