  md: '# 7.2 Streams


    When files are processed in C++ the communication goes between hard disk file
    and program via a stream:


    ![](img/76b5a908064445a4a3a85a788cb00a96_153_0.png)


    When data is to be read from a disk file (infile) to a program, it goes via an
    intermediary store (instream) which works as a buffer between the hard disk and
    the program, where data is queued to be read to the program.


    Similarly, when data is to be written from the program to a disk file (outfile),
    it is first stored in an intermediary store (outstream) before it is finally written
    to the file.


    As programmer you only have to bother about reading from the instream and writing
    to the ofstream. The operating system takes care of the physical reading and writing
    to the disk file.


    # 7.3 Reading from a Stream


    So far, you have read data from the keyboard with statements like:


    ```

    cin >> cName;

    ```


    We have said that cin stands for ''console'', i.e. reading from the keyboard.
    But actually, the data has been transferred via an instream called cin.


    The same applies to reading from an instream. Suppose that we have an instream
    called and that it is connected to a particular disk file. Then we read data from
    the instream with statements like:


    ```

    is >> cName;

    is >> dAmount;

    ```


    Reading data from an instream with the >> operator is ''formatted input'', because
