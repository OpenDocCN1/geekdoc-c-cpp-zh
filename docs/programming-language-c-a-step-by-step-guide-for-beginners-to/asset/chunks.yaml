  trans: "\n\n# 3. 函数声明、函数调用与函数定义\n\n### A) 当函数名后跟着分号时，该函数被调用。例如：\n```c\nInt main\
    \ (){Argentina();}\n```\n\n### B) 当函数名后跟着一对大括号且括号内包含一个或多个语句时，该函数被定义。例如：\n```c\n\
    Void argentina(){\n    Statements 1;\n    Statements 2;\n    Statements 3;\n}\n\
    ```\n\n### C) 任何函数都可以从其他函数调用。即使是 `main()` 也可以从其他函数调用。例如：\n```c\n#include<stdio.h>\n\
    Void message()\nInt main (){\n    Message();\n    Return0;\n}\nVoid message(){\n\
    \    Printf(“\\n can not imagine without c”);\n    Main();}\n}\n```### D) 函数可以被调用多次。例如：\n\
    ```c\n#include<stdio.h>\nVoid message(){\n    Message();\n    Message();\n   \
    \ Return0;\n}\nVoid message(){\n    Printf(“\\n jewel thief”);\n}\n```\n\n###\
    \ E) 函数基本上分为两种：\n- **库函数**：`printf()`, `scanf()` 等等。\n- **用户定义函数**：`argentina()`,\
    \ `brazil()` 等等。\n\n---\n\n## C 函数简单示例程序\n\n* 如你所知，在 C 语言程序中，函数在调用之前应该进行声明和定义。\n\
    * 在下面的程序中，从 `main` 函数调用了函数 `square`。\n*  `m` 的值作为参数传递给函数 `square`。在该函数中，该值与其相乘，并将结果\
    \ `p` 从 `square` 函数返回给 `main` 函数。\n\n```c\n#include<stdio.h>\n// function prototype,也称为函数声明\n\
    float square ( float x );                 \n\n// main function,程序从这里开始\nint main(\
    \ )\n{\n    float m, n ;\n    printf ( \"\\nEnter some number for finding square\
    \ \\n\");\n    scanf ( \"%f\", &m )// function call\n    n = square ( m ) ;  \
    \                \n    printf ( \"\\nSquare of the given number %f is %f\",m,n\
    \ );\n}\nfloat square ( float x )   // function definition\n{\n    float p ;\n\
    \    p = x * x ;\n    return ( p ) ;\n}\n```\n\n**输出:**\n| 输入一个数字以计算平方 2 数字 2.000000\
    \ 的平方是 4.000000 |\n\n---\n\n## 使用库函数：示例：\n```c\n#include<stdio.h>\n#include<math.h>\n\
    Int main(){\n    Float a=0.5;\n    Float w, x y,z;\n    W=sin(a);\n    X=cos(a);\n\
    \    Y=tan(a);\n    Z=pow(a,2);\n    Printf(“\\n%f%f%f%f”,w,x,y,z);\n    Return0;\n\
    }\n```\n\n---\n\n## 函数的高级特性：\na) 函数的返回值\nb) 按值或按引用调用函数\nc) 递归\n\n### 函数的返回值：\n\
    ```c\n#include<stdio.h>\nFloat square (float);\nInt main(){\n    Float a,b;\n\
    \    Printf(“\\n enter any number”);\n    Scanf(“\\n%f”,&a);\n    B= square(a);\n\
    \    Printf(“\\n square of %f is %f”, a,b);\n    Return 0;\n}\nFloat square (float\
    \ x){\n    Float y;\n    Y= x*x;\n    Return(y);\n}\n```\n**输出:**\n- 输入任意数字 33\
    \ 的平方是 9.000000\n输入任意数字 1. 51.5 的平方是 2.250000\n输入任意数字 2.52.5 的平方是 6.250000\n\n\
    ---\n\n## 按值调用\n\n* 在按值调用的方法中，变量的值被作为参数传递给函数。\n* 实参的值不能通过形参进行修改。\n* 实参和形参会分配不同的内存。因为，实参的值被复制到了形参中。\n\
    \n**注意：**\n* **实参** – 指在函数调用中使用的参数。\n* **形参** – 指在函数定义中使用的参数。\n\n### C 函数示例程序（使用按值调用）：\n\
    * 在此程序中，变量 `m` 和 `n` 的值被传递给函数 `swap`。\n* 这些值被复制到 `swap` 函数的形参 `a` 和 `b` 中并使用。\n\
    \n```c\n#include<stdio.h>\n// function prototype,也称为函数声明\nvoid swap(int a, int\
    \ b);             \n\nint main(){\n    int m = 22, n = 44;\n    // 按值调用 swap 函数\n\
    \    printf(\" values before swap  m = %d \\nand n = %d\", m, n);\n    swap(m,\
    \ n);                  \n}\nvoid swap(int a, int b){\n    int tmp;\n    tmp =\
    \ a;\n    a = b;\n    b = tmp;\n}\n```\n**输出:**\n| 交换前的值 m = 22 \\and n = 44 |\n\
    \n---\n\n## 2. 按引用调用\n\n* 在按引用的方法的方法，变量的地址被作为参数传递给函数。\n* 实参的值可以被形参修改。\n* 实参和形参不需要分配额外的内存。\n\
    \n### C 函数示例程序（使用按引用调用）：\n```c\n#include<stdio.h>\n// function prototype,也称为函数声明\n\
    void swap(int *a, int *b);\nint main(){\n    int m = 22, n = 44;\n    // 按引用调用\
    \ swap 函数\n    printf(\" values before swap  m = %d \\and n = %d\", m, n);\n \
    \   swap(&m, &n);                  \n}\nvoid swap(int *a, int *b){\n    int tmp;\n\
    \    tmp = *a;\n    *a = *b;\n    *b = tmp;\n}\n```\n**输出:**\n| 交换前的值 m = 22 \\\
    and n = 44 |\n| 交换后的值 m = 44 and n = 22 |\n\n---\n\n## 3. 递归\n\n在 C 语言中，函数可以调用自身。如果函数体内的语句调用了自身，则该函数被称为递归。以下是计算阶乘的递归版本函数。\n\
    \n```c\n#include<stdio.h>\nInt main(){\n    Float a,fact;\n    Printf(“\\ enter\
    \ any value”);\n    Scanf(“%d”,a);\n    Fact=rec(a);\n    Printf(“\\n factorial\
    \ value= %d”,fact);\n    Return0;\n}\nInt rec (int x){\n    Float f;\n    If(x==1)\n\
    \    Return(1);\n    ElseF=x*rec(x-1);\n    Return (f);\n}\n```\n**输出:**\n- 输入任意数字\
    \ 1 1\n- 输入任意数字 2 阶乘值 =2\n- 输入任意数字 3 阶乘值 =3\n- 输入任意数字 5 阶乘值 =120\n\n"
- fmt: "\n## 1. With Arguments and Return Value\n\n```c\n#include<stdio.h>\n#include<string.h>\n\
    int function(int, int[], char[]);\nint main(){\n    int i, a = 20;\n    int arr[5]\
    \ = {10,20,30,40,50};\n    char str[30] = \"\\\"fresh2refresh\\\"\";\n    printf(\"\
    \    ***values before modification***\\n\");\n    printf(\"value of a is %d\\\
    n\",a);\n    for (i=0;i<5;i++){\n        // Accessing each variable\n        printf(\"\
    value of arr[%d] is %d\\n\",i,arr[i]);\n    }\n    printf(\"value of str is %s\\\
    n\",str);\n    printf(\"\\n    ***values after modification***\\n\");\n    a=\
    \ function(a, &arr[0], &str[0]);\n    printf(\"value of a is %d\\n\",a);\n   \
    \ for (i=0;i<5;i++){\n        // Accessing each variable\n        printf(\"value\
    \ of arr[%d] is %d\\n\",i,arr[i]);\n    }\n    printf(\"value of str is %s\\n\"\
    ,str);\n    return 0;\n}\nint function(int a, int *arr, char *str){\n    int i;\n\
    \    a = a+20;\n    arr[0] = arr[0]+50;\n    arr[1] = arr[1]+50;\n    arr[2] =\
    \ arr[2]+50;\n    arr[3] = arr[3]+50;\n    arr[4] = arr[4]+50;\n    strcpy(str,\"\
    \\\"modified string\\\"\");\n    return a;\n}\n```\n\n**OUTPUT:**\n```\n***values\
    \ before modification***\nvalue of a is 20\nvalue of arr[0] is 10\nvalue of arr[1]\
    \ is 20\nvalue of arr[2] is 30\nvalue of arr[3] is 40\nvalue of arr[4] is 50\n\
    value of str is \"fresh2refresh\"\n\n***values after modification***\nvalue of\
    \ a is 40\nvalue of arr[0] is 60\nvalue of arr[1] is 70\nvalue of arr[2] is 80\n\
    value of arr[3] is 90\nvalue of arr[4] is 100\nvalue of str is \"modified string\"\
    \n```\n\n### b) EXAMPLE PROGRAM FOR WITH ARGUMENTS & WITHOUT RETURN VALUE\nIn\
    \ this program, integer, array and string are passed as arguments to the function.\
    \ The return type of this function is `void` and no values can be returned from\
    \ the function. All values of integer, array and string are manipulated and displayed\
    \ inside the function itself.\n\n```c\n#include<stdio.h>\nvoid function(int, int[],\
    \ char[]);\nint main(){\n    int a = 20;\n    int arr[5] = {10,20,30,40,50};\n\
    \    char str[30] = \"\\\"fresh2refresh\\\"\";\n    function(a, &arr[0], &str[0]);\n\
    \    return 0;\n}\nvoid function(int a, int *arr, char *str){\n    int i;\n  \
    \  printf(\"value of a is %d\\n\\n\",a);\n    for (i=0;i<5;i++){\n        // Accessing\
    \ each variable\n        printf(\"value of arr[%d] is %d\\n\",i,arr[i]);\n   \
    \ }\n    printf(\"\\nvalue of str is %s\\n\",str);\n}\n```\n\n**OUTPUT:**\n```\n\
    value of a is 20\nvalue of arr[0] is 10\nvalue of arr[1] is 20\nvalue of arr[2]\
    \ is 30\nvalue of arr[3] is 40\nvalue of arr[4] is 50\nvalue of str is \"fresh2refresh\"\
    \n```\n\n### 3. EXAMPLE PROGRAM FOR WITHOUT ARGUMENTS & WITHOUT RETURN VALUE\n\
    In this program, no values are passed to the function `test` and no values are\
    \ returned from this function to main function.\n\n```c\n#include<stdio.h>\nvoid\
    \ test();\nint main(){\n    test();\n    return 0;\n}\nvoid test() {\n    int\
    \ a = 50, b = 80;\n    printf(\"\\nvalues : a = %d and b = %d\", a, b);\n}\n```\n\
    \n**OUTPUT:**\n```\nvalues : a = 50 and b = 80\n```\n\n### c) EXAMPLE PROGRAM\
    \ FOR WITHOUT ARGUMENTS & WITH RETURN VALUE\nIn this program, no arguments are\
    \ passed to the function `sum`. But, values are returned from this function to\
    \ main function. Values of variable `a` and `b` are summed up in the function\
    \ `sum` and the sum of these values is returned to the main function.\n\n```c\n\
    #include<stdio.h>\nint sum();\nint main(){\n    int addition;\n    addition =\
    \ sum();\n    printf(\"\\nSum of two given values = %d\", addition);\n    return\
    \ 0;\n}\nint sum() {\n    int a = 50, b = 80, sum;\n    sum = a + b;\n    return\
    \ sum;\n}\n```\n\n**OUTPUT:**\n```\nSum of two given values = 130\n```\n\n## DO\
    \ YOU KNOW HOW MANY VALUES CAN RETURN FROM FUNCTIONS?\n- Always, only one value\
    \ can be returned from a function.\n- If you try to return more than one value\
    \ from a function, only one value will be returned at the right place of the return\
    \ statement.\n- For example, if you use `return a,b,c` in your function, value\
    \ `c` will be returned and `a`, `b` won’t be returned.\n- In case, if you want\
    \ to return more than one value, pointers can be used to directly change values\
    \ in address instead of returning those values.\n\n## Library functions\n- Library\
    \ functions in C language are inbuilt functions which are grouped together and\
    \ placed in a common place called library.\n- Each library function performs specific\
    \ operation.\n- We can use these library functions to get pre-defined output instead\
    \ of writing our own code.\n- These library functions are created by C compilers.\n\
    - All standard library functions are declared in many header files saved as `filename.h`.\n\
    - Actually, function declaration and macros are given in all header files.\n-\
    \ We include these header files in our C program using `#include <filename.h>`\
    \ to make use of functions declared in the header files.\n- When we include header\
    \ files in our C program using `#include <filename.h>`, all C code of header files\
    \ are included. Then this C program is compiled by compiler.\n- If you want to\
    \ check source code for all header files, you can check inside `include` directory\
    \ after C compiler is installed in your machine.\n- For example, if you install\
    \ DevC++ compiler in your machine, `C:\\DevCpp\\include` is the path where all\
    \ header files will be available.\n\n## LIST OF MOST USED HEADER FILES IN PROGRAMMING\n\
    \n| Header file | Description |\n| :--- | :--- |\n| `stdio.h` | This is standard\
