  trans: "\n\n## 代码示例\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\nint main(){\n\
    \    setenv(\"DIR\", \"/usr/bin/example/\", 50);\n    printf(\"Directory name\
    \ before modifying = %s\\n\", getenv(\"DIR\"));\n    putenv(\"DIR=/usr/home/\"\
    );\n    printf(\"Directory name after modifying = %s\\n\", getenv(\"DIR\"));\n\
    \    return 0;\n}\n```\n\n**输出：**\n`Directory name before modifying = /usr/bin/example/\
    \ Directory name after modifying = /usr/home/`\n\n## C 语言变量声明与定义的区别\n\n| 变量声明\
    \ | 变量定义 |\n| :--- | :--- |\n| 声明告诉编译器关于变量的数据类型和大小。 | 定义为变量分配内存。 |\n| 变量在程序中可以被声明多次。\
    \ | 在程序中一个变量定义只能发生一次。 |\n| 给变量分配属性和标识符。 | 为变量分配存储空间。 |\n\n## C 关键字\n\n关键字不能用作变量名，因为如果我们这样做，就正尝试给关键字赋予新的含义，这是计算机不允许的。某些\
    \ C 编译器允许你构建与关键字完全相同的变量名。然而，更安全的做法是不混淆变量名和关键字。关键字也被称为保留字。C 语言中只有 32 个关键字。\n\n\
    **可用关键字：**\n`auto`, `double`, `break`, `else`, `case`, `enum`, `char`, `extern`,\
    \ `const`, `float`, `continue`, `default`, `for`, `goto`, `if`, `int`, `struct`,\
    \ `switch`, `register`, `typedef`, `union`, `unsigned`, `signed`, `void`, `volatile`,\
    \ `volatile`, `while`.\n\n## 第一个 C 程序\n\na) C 程序中的每条指令都写为一个独立的语句。因此，一个完整的 C 程序由一系列语句组成。\n\
    b) 程序中的语句必须按照我们希望它们执行的顺序出现，除非问题的逻辑要求跳转或将控制转移到顺序之外的语句。\nc) 在两个单词之间可以插入空格以提高语句的可读性。然而，在变量、常量或关键字内部不允许有空格。\n\
    d) 所有的语句都用小写输入。\ne) C 语言对语句编写的位置没有特殊规定。这就是为什么它通常被称为自由格式语言。\nf) 每条 C 语句必须以 `;`\
    \ 结尾，因此 `;` 充当语句终止符。\n\n```c\n#include<stdio.h>\nmain(){\n    int total;\n   \
    \ printf(\"\\n enter marks in exam\");\n    scanf(\"%d\",&total);\n    if (total>=100)\n\
    \        printf(\"\\n passed\");\n    else\n        printf(\"\\n failed\");\n\
    }\n```\n\n**此程序的输出：**\nEnter marks in exam\n200\npassed\n\n## 程序解释\n\na) 程序开头有必要使用\
    \ `#include<stdio.h>`。`#include` 是一个预处理器指令。\nb) `main()` 是一个函数。函数无非是一组语句。在 C C\
    \ 程序中可以有多个函数。首先，我们将只关注一个函数。这个函数的名称必须是 `main()`，不能是其他任何。所有属于 `main()` 的语句都包含在一对括号\
    \ `{}` 中，如下所示：\n\n```c\nint main(){\n    Statement 1\n    Statement 2\n    Statement\
    \ 3\n}\n```\nc) C 语言的输出可以使用 `printf()` 函数实现。`printf()` 的通用形式是：\n- `%f` 用于打印实数\n\
    - `%d` 用于打印整数\n- `%c` 用于打印字符\nd) C 语言的输入可以使用 `scanf()` 函数实现。`scanf()` 的通用形式是：\n\
    - 格式字符串 `variable` \n- `%d` 用于 `int`\n- `%f` 用于 `float`\n\n## 示例程序\n\n```c\n#include<stdio.h>\n\
    main(){\n    float f,c;\n    printf(\"\\n celcius\");\n    scanf(\"%d\",&c);\n\
    \    f=(9*c)/5;\n    printf(\"%f\");\n}\n```\n**此程序的输出：**\ncelcius\n68.000000\n\
    \n## 指令\n\nC 语言中基本上三种类型的指令：\n\nA) **声明指令**：用于声明 C 程序中使用的变量类型。\nB) **算术指令**：用于对常量和变量进行算术运算。\n\
    C) **控制指令**：用于控制各种语句的执行顺序。\n\n## 编写 C 程序的基础\n\n以下是编写简单 C 程序时使用的一些命令和语法。让我们逐行查看。\n\
    \n| C 基础命令 | 解释 |\n| :--- | :--- |\n| `#include <stdio.h>` | 这是一个预处理器命令，在编译程序之前从\
    \ C 库包含输入输出头文件 (stdio.h)。 |\n| `int main()` | 这是主函数，任何 C 程序的执行从这里开始。 |\n| `{`\
    \ | 表示主函数的开始。 |\n| `/*某些注释*/` | 任何 C 程序 `/* */` 命令内部给的内容都不会被考虑编译和执行。 |\n| `printf(\"\
    Hello World! \")` | `printf` 命令将输出到屏幕上。 |\n| `getch()` | 该命令等待键盘的任何字符输入。 |\n|\
    \ `return 0;` | 该命令终止 C 程序（主函数）并返回 0。 |\n| `}` | 表示主函数的结束。 |\n\n"
- fmt: "\n* Once C compiler is installed in your machine, you can create, compile\
    \ and execute C programs as shown in below link.\n* If you don’t want to install\
    \ `C/C++` compilers in your machine, you can refer online compilers which will\
    \ compile and execute `C/C++` and many other programming languages online and\
    \ display outputs on the screen. Please search for online `C/C++` compilers in\
    \ Google for more details.\n\n# BASIC STRUCTURE OF A C PROGRAM\n\nStructure of\
    \ C program is defined by set of rules called protocol, to be followed by programmer\
    \ while writing C program. All C programs are having sections/parts which are\
    \ mentioned below.\n\n1. Documentation section\n2. Link Section\n3. Definition\
    \ Section\n4. Global declaration section\n5. Function prototype declaration section\n\
    6. Main function\n7. User defined function definition section\n\n## EXAMPLE C\
    \ PROGRAM TO COMPARE ALL THE SECTIONS:\nYou can compare all the sections of a\
    \ C program with the below C program.\n\n```c\n#include <stdio.h>\nint total =\
    \ 0;\nint sum (int, int);\nint main () {\n    printf (\"This is a C basic program\
    \ \\n\");\n    total = sum (1, 1);\n    printf (\"Sum of two numbers : %d \\n\"\
    , total);\n    return 0;\n}\nint sum (int a, int b) {\n    return a + b;\n}\n\
    ```\n\n**OUTPUT:**\n```\nThis is a C basic program\nSum of two numbers : 2\n```\n\
    \n## DESCRIPTION FOR EACH SECTION OF THE C PROGRAM:\n\n* Let us see about each\
    \ section of a C basic program in detail below.\n* Please note that a C program\
    \ mayn’t have all below mentioned sections except `main` function and link sections.\n\
    * Also, a C program structure mayn’t be in below mentioned order.\n\n| Sections\
    \ | Description |\n| :--- | :--- |\n| Documentation section | We can give comments\
    \ about the program, creation or modified date, author name etc in this section.\
    \ The characters or words or anything which are given between `/*` and `*/`, won’t\
    \ be considered by C compiler for compilation process. These will be ignored by\
    \ C compiler during compilation. |\n| Link Section | Header files that are required\
    \ to execute a C program are included in this section |\n| Definition Section\
    \ | In this section, variables are defined and values are set to these variables.\
    \ |\n| Global declaration section | Global variables are defined in this section.\
    \ When a variable is to be used throughout the program, can be defined in this\
    \ section. |\n| Function prototype declaration section | Function prototype gives\
    \ many information about a function like return type, parameter names used inside\
    \ the function. |\n| Main function | Every C program is started from `main` function\
    \ and this function contains two major sections called declaration section and\
    \ executable section. |\n| User defined function section | User can define their\
    \ own functions in this section which perform particular task as per the user\
    \ requirement. |\n\n## KEY POINTS TO REMEMBER IN C PROGRAMMING BASICS:\n\n1. C\
    \ programming is a case sensitive programming language.\n2. Each C programming\
    \ statement is ended with semicolon (`;`) which are referred as statement terminator.\n\
    3. `printf()` command is used to print the output onto the screen.\n4. C programs\
    \ are compiled using C compilers and displays output when executed.\n\n# DATA\
    \ TYPES\n\nC data types are defined as the data storage format that a variable\
    \ can store a data to perform a specific operation. Data types are used to define\
    \ a variable before to use in a program. Size of variable, constant and array\
    \ are determined by data types.\n\n## C – DATA TYPES:\nThere are four data types\
    \ in C language. They are,\n\n| Types | Data Types |\n| :--- | :--- |\n| Basic\
    \ data types | `int`, `char`, `float`, `double` |\n| Enumeration data type | `enum`\
    \ |\n| Derived data type | `pointer`, `array`, `structure`, `union` |\n| Void\
    \ data type | `void` |\n\n## BASIC DATA TYPES IN C LANGUAGE:\n\n### 1.1. INTEGER\
    \ DATA TYPE:\n\n* Integer data type allows a variable to store numeric values.\n\
    * `int` keyword is used to refer integer data type.\n* The storage size of `int`\
    \ data type is 2 or 4 or 8 byte.\n* It varies depend upon the processor in the\
    \ CPU that we use. If we are using 16 bit processor, 2 byte (16 bit) of memory\
    \ will be allocated for `int` data type.\n* Likewise, 4 byte (32 bit) of memory\
    \ for 32 bit processor and 8 byte (64 bit) of memory for 64 bit processor is allocated\
    \ for `int` datatype.\n* `int` (2 byte) can store values from -32,768 to +32,767.\n\
    * `int` (4 byte) can store values from -2,147,483,648 to +2,147,483,647.\n* If\
    \ you want to use the integer value that crosses the above limit, you can go for\
    \ `long int` and `long long int` for which the limits are very high.\n\n**Note:**\n\
    * We can’t store decimal values using `int` data type.\n* If we use `int` data\
    \ type to store decimal values, decimal values will be truncated and we will get\
    \ only whole number.\n* In this case, `float` data type can be used to store decimal\
    \ values in a variable.\n\n### CHARACTER DATA TYPE:\n\n* Character data type allows\
    \ a variable to store characters.\n* `char` keyword is used to refer character\
    \ data type.\n* The storage size of `char` data type is 1 byte.\n* `char` allows\
    \ a variable to store a single character.\n\n### 1.2. FLOATING POINT TYPE:\n\n\
    * Float data type allows a variable to store decimal values.\n* `float` keyword\
    \ is used to refer float data type.\n* The storage size of `float` data type is\
    \ 4 bytes.\n\n### 1.3. DOUBLE:\n\n* Double data type allows a variable to store\
    \ decimal values with higher precision.\n* `double` keyword is used to refer double\
    \ data type.\n* The storage size of `double` data type is 8 bytes.\n\n## SIZ()\
    \ FUNCTION IN C LANGUAGE:\n\n`sizeof()` function is used to find the memory space\
    \ allocated for each variable.\n\n```c\n#include <stdio.h>\nint main() {\n   \
    \ int a;\n    char b;\n    float c;\n    double d;\n    printf(\"Storage size\
    \ for int: %zu\\n\", sizeof(a));\n    printf(\"Storage size for char: %zu\\n\"\
    , sizeof(b));\n    printf(\"Storage size for float: %zu\\n\", sizeof(c));\n  \
    \  printf(\"Storage size for double: %zu\\n\", sizeof(d));\n    return 0;\n}\n\
    ```\n\n# MODIFIERS IN C LANGUAGE:\n\n* The amount of memory space to be allocated\
    \ for a variable is derived by modifiers.\n* Modifiers are prefixed with basic\
    \ data types to modify (either increase or decrease) the amount of storage.\n\
    * For example, storage space for `int` is 4 byte for 32 bit. We can increase the\
    \ range using `long int` which is 8 byte. We can decrease the range using `short\
    \ int` which is 2 byte.\n\nThere are 5 modifiers available in C language. They\
    \ are:\n1. `short`\n2. `long`\n3. `signed`\n4. `unsigned`\n5. `long long`\n\n\
    Below table gives the detail about the storage size of each C data type in 16\
    \ bit processor. Please keep in mind that storage size and range for `int` and\
    \ `float` datatype will vary depend on the CPU (8, 16, 32 and 64 bit).\n\n| C\
    \ Data types / storage Size | Range |\n| :--- | :--- |\n| `char` / 1 | –128 to\
    \ 127 |\n| `int` / 2 | –32,768 to 32,767 |\n| `float` / 4 | 1.175494e-38 to 3.402823e+38\
    \ |\n| `double` / 8 | 2.225074e-308 to 1.797693e+308 |\n| `long double` / 10 |\
    \ 3.4022e-4932 to 1.1897e+4932 |\n| `long int` / 4 | –2,147,483,648 to 2,147,483,647\
    \ |\n| `short int` / 2 | –32,768 to 32,767 |\n| `unsigned short int` / 2 | 0 to\
    \ 65,535 |\n| `signed short int` / 2 | –32,768 to 32,767 |\n| `long long int`\
    \ / 8 | –9,223372036854775808 to 9,223372036854775807 |\n| `signed long int` /\
    \ 4 | –2,147,483,648 to 2,147,483,647 |\n| `unsigned long int` / 4 | 0 to 4,294,967,295\
    \ |\n"
