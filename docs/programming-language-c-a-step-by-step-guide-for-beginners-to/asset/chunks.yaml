    \ or underscore.\n2. Succeeding characters might be digits or letter.\n3. Punctuation\
    \ and special characters aren’t allowed except underscore.\n4. Identifiers should\
    \ not be keywords.\n\n### KEYWORDS IN C LANGUAGE\n\n- Keywords are pre-defined\
