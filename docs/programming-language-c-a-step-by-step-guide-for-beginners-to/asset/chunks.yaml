    DO YOU KNOW HOW MANY VALUES CAN BE RETURN FROM C FUNCTIONS?


    *   Always, Only one value can be returned from a function.


    *   If you try to return more than one values from a function, only one value
    will be returned that appears at the right most place of the return statement.


    *   For example, if you use “return a,b,c” in your function, value for c only
    will be returned and values a, b won’t be returned to the program.


    *   In case, if you want to return more than one values, pointers can be used
    to directly change the values in address instead of returning those values to
    the function.


    Library functions


    *   Library functions in C language are inbuilt functions which are grouped together
    and placed in a common place called library.


    *   Each library function in C performs specific operation.


    *   We can make use of these library functions to get the pre-defined output instead
    of writing our own code to get those outputs.


    *   These library functions are created by the persons who designed and created
    C compilers.


    *   All C standard library functions are declared in many header files which are
    saved as file_name.h.


    *   Actually, function declaration, definition for macros are given in all header
    files.


    *   We are including these header files in our C program using “#include<file_name.h>”
    command to make use of the functions those are declared in the header files.


    *   When we include header files in our C program using “#include<filename.h>”
    command, all C code of the header files are included in C program. Then, this
    C program is compiled by compiler and executed.


    *   If you want to check source code for all header files, you can check inside
    “include” directory after C compiler is installed in your machine.


    *   For example, if you install DevC++ compiler in C directory in your machine,
    “C:\Dev-Cpp\include” is the path where all header files will be available.


