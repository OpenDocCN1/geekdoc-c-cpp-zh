    Function,   C functions are basic building blocks in a program. All C programs
    are written using functions to improve re-usability, understand ability and to
    keep track on them. You can learn below concepts of C functions in this section
    in detail.1\. WHAT IS C FUNCTION?A large C program is divided into basic building
    blocks called C function. C function contains set of instructions enclosed by
    “{  }” which performs specific operation in a C program. Actually, Collection
    of these functions creates a C program.2\. USES OF C FUNCTIONS:


    *   C functions are used to avoid rewriting same logic/code again and again in
    a program.


    *   There is no limit in calling C functions to make use of same functionality
    wherever required.


    *   We can call functions any number of times in a program and from any place
    in a program.


    *   A large C program can easily be tracked when it is divided into functions.


    *   The core concept of C functions are, re-usability, dividing a big task into
    small pieces to achieve the functionality and to improve understand ability of
    very large C programs.'
