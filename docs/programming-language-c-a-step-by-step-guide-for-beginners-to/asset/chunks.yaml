  trans: "\n\n* 一旦在机器上安装了 C 编译器，你就可以按照下方链接所示创建、编译和执行 C 程序。\n* 如果你不想在机器上安装 `C/C++`\
    \ 编译器，可以参考在线编译器，它们可以在线编译并执行 `C/C++` 以及许多其他编程语言，并在屏幕上显示输出。有关更多信息，请在 Google 中搜索在线\
    \ `C/C++` 编译器。\n\n# C 程序的基本结构\n\nC 程序的结构由一组被称为协议（protocol）的规则定义，程序员在编写 C 程序时必须遵守这些规则。所有的\
    \ C 程序都包含下面提到的各个部分/区域。\n\n1. 文档部分\n2. 链接部分\n3. 定义部分\n4. 全局声明部分\n5. 函数原型声明部分\n\
    6. 主函数\n7. 用户定义函数部分\n\n## 用于比较所有部分的 C 程序示例：\n你可以通过下面的 C 程序与 C 程序的所有部分进行比较。\n\n\
    ```c\n#include <stdio.h>\nint total = 0;\nint sum (int, int);\nint main () {\n\
    \    printf (\"This is a C basic program \\n\");\n    total = sum (1, 1);\n  \
    \  printf (\"Sum of two numbers : %d \\n\", total);\n    return 0;\n}\nint sum\
    \ (int a, int b) {\n    return a + b;\n}\n```\n\n**输出：**\n```\nThis is a C basic\
    \ program\nSum of two numbers : 2\n```\n\n## C 程序每个部分的描述：\n\n* 让我们在下面详细查看 C 基础程序的每个部分。\n\
    * 请注意，除了 `main` 函数和链接部分外，C 程序可能不包含下面提到的所有部分。\n* 此外，C 程序的结构可能并不按照下面提到的顺序。\n\n|\
    \ 部分 | 描述 |\n| :--- | :--- |\n| 文档部分 | 我们可以在此部分提供关于程序、创建或修改日期、作者名称等注释。位于 `/*`\
    \ 和 `*/` 之间的字符、单词或任何内容，C 编译器在编译过程中都不会考虑。这些内容将在编译期间被 C 编译器忽略。 |\n| 链接部分 | 执行 C\
    \ 程序所需的头文件包含在此部分。 |\n| 定义部分 | 在此部分中定义变量并为这些变量设置值。 |\n| 全局声明部分 | 全局变量在此部分定义。当一个变量要在整个程序中使用时，可以在此部分定义。\
    \ |\n| 函数原型声明部分 | 函数原型提供了关于函数的许多信息，如返回类型、函数内部使用的参数名。 |\n| 主函数 | 每一个 C 程序都从 `main`\
    \ 函数开始，该函数包含两个主要部分：声明部分和执行部分。 |\n| 用户定义函数部分 | 用户可以在此部分定义自己的函数，根据用户需求执行特定任务。 |\n\
    \n## C 语言基础中的记忆要点：\n\n1. C 编程是一种区分大小写的编程语言。\n2. 每条 C 编程语句都以分号（`;`）结束，分称为语句终止符。\n\
    3. `printf()` 命令用于将输出打印到屏幕上。\n4. C 程序使用 C 编译器编译，并在执行时显示输出。\n\n# 数据类型\n\nC 数据类型被定义为变量可以存储的以执行特定操作的数据存储格式。数据类型用于在程序中使用变量之前定义变量。变量、常量和数组的大小由数据类型决定。\n\
    \n## C – 数据类型：\nC 语言中有四种数据类型。它们是：\n\n| 类型 | 数据类型 |\n| :--- | :--- |\n| 基本数据类型\
    \ | `int`, `char`, `float`, `double` |\n| 枚举数据类型 | `enum` |\n| 派生数据类型 | `pointer`,\
    \ `array`, `structure`, `union` |\n| 空数据类型 | `void` |\n\n## C 语言中的基本数据类型：\n\n\
    ### 1.1 数据 数据类型：\n\n* 整数数据类型允许变量存储数值。\n* `int` 关键字用于引用整数数据类型。\n* `int` 数据类型的存储大小为\
    \ 2 或 4 或 8 字节。\n* 它取决于我们所使用的 CPU 处理器。如果我们使用 16 位处理器，则将为 `int` 数据类型分配 2 字节（16\
    \ 位）的内存。\n* 同样，32 位处理器分配 4 字节（32 位）的内存，64 位处理器分配 8 字节（64 位）的内存给 `int` 数据类型。\n\
    * `int`（2 字节）可以存储从 -32,768 到 +32,767 的值。\n* `int`（4 字节）可以存储从 -2,147,483,648 到\
    \ +2,147,483,647 的值。\n* 如果你想使用超过上述限制的整数值，可以使用 `long int` 和 `long long int`，它们的限制非常高。\n\
    \n**注意：**\n* 我们无法使用 `int` 数据类型存储小数。\n* 如果我们使用 `int` 数据类型存储小数，小数将被截断，我们只得到整数部分。\n\
    * 在这种情况下，可以使用 `float` 数据类型在变量中存储小数。\n\n### 字符数据类型：\n\n* 字符数据类型允许变量存储字符。\n* `char`\
    \ 关键字用于引用字符数据类型。\n* `char` 数据类型的存储大小为 1 字节。\n* `char` 允许变量存储单个字符。\n\n### 1.2 浮点类型（FLOATING\
    \ POINT）：\n\n* 浮点数据类型允许变量存储小数。\n* `float` 关键字用于引用浮点数据类型。\n* `float` 存储大小为 4 字节。\n\
    \n### 1.3 双精度（DOUBLE）：\n\n* 双精度数据类型允许变量存储高精度的数值。\n* `double` 关键字用于引用双精度类型。\n*\
    \ `double` 的存储大小为 8 字节。\n\n## C 语言中的 SIZ() 函数：\n\n`sizeof()` 函数用于查找变量分配的内存空间。\n\
    \n```c\n#include <stdio.h>\nint main() {\n    int a;\n    char b;\n    float c;\n\
    \    double d;\n    printf(\"Storage size for int: %zu\\n\", sizeof(a));\n   \
    \ printf(\"Storage size for char: %zu\\n\", sizeof(b));\n    printf(\"Storage\
    \ size for float: %zu\\n\", sizeof(c));\n    printf(\"Storage size for double:\
    \ %zu\\n\", sizeof(d));\n    return 0;\n}\n```\n\n# C 语言中的修饰符（MODIFIERS）：\n\n\
    * 修饰符用于分配内存。\n* 修饰符基本数据类型以增加或减少范围。\n* 例如，`int` 的存储空间为 4 字节（32 位），使用 `long int`\
    \ 可以将其范围增加到 8 字节。使用 `short int` 可以将其范围减少到 2 字节。\n\nC 语言中有 5 种修饰符。它们是：\n1. `short`\n\
    2. `long`\n3. `signed`\n4. `unsigned`\n5. `long long`\n\n下表给出了 16 位处理器上每种 C 数据类型的存储大小。请记住，`int`\
    \ 和 `float` 数据类型的存储大小和范围取决于 CPU（8、16、32 和 64 位）。\n\n| C 数据类型 / 存储大小 | 范围 |\n|\
    \ :--- | :--- |\n| `char` / 1 | –128 to 127 |\n| `int` / 2 | –32,768 to 32,767\
    \ |\n| `float` / 4 | 1.175494e-38 to 3.402823e+38 |\n| `double` / 8 | 2.225074e-308\
    \ to 1.797693e+308 |\n| `long double` / 10 | 3.4022e-4932 to 1.1897e+4932 |\n\
    | `long int` / 4 | –2,147,483,648 to 2,147,483,647 |\n| `short int` / 2 | –32,768\
