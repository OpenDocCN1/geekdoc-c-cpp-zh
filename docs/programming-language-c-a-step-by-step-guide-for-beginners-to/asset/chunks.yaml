    \n\n***修改后的值***\nvalue of a is 40\nvalue of arr[0] is 60\nvalue of arr[1] is 70\n\
    value of arr[2] is 80\nvalue of arr[3] is 90\nvalue of arr[4] is 100\nvalue of\
    \ str is \"modified string\"\n```\n\n### b) 带参数且无返回值的示例程序\n在此程序中，整数、数组和字符串被作为参数传递给函数。该函数的返回类型为\
    \ `void`，且无法从函数返回任何值。整数、数组和字符串的所有值都在函数内部进行处理和显示。\n\n```c\n#include<stdio.h>\n\
    void function(int, int[], char[]);\nint main(){\n    int a = 20;\n    int arr[5]\
