  trans: "\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\nint main(int argc, char\
    \ *argv[]) { // 命令行参数\n    if (argc != 5) {\n        printf(\"Arguments passed\
    \ through command line not equal to 5\");\n        return 1;\n    }\n    printf(\"\
    \\n Program name  : %s \\n\", argv[0]);\n    printf(\"1st arg  : %s \\n\", argv[1]);\
    \ argv[1]);\n    printf(\"2nd arg  : %s \\n\", argv[2]);\n    printf(\"3rd arg\
    \  : %s \\n\", argv[3]);\n    printf(\"4th arg  : %s \\n\", argv[4]);\n    printf(\"\
    5th arg  : %s \\n\", argv[5]);\n    return 0;\n}\n```\n**OUTPUT:**\n```\nProgram\
    \ name : test\n1st arg : this\n2nd arg : is\n3rd arg : a\n4th arg : program\n\
    5th arg : (null)\n```\n\n## 可变长度参数\n\n- 可变长度参数是 C 语言中由 `c99` 标准提供的一种高级概念。在 `c89`\
    \ 标准中，只能向函数传递固定参数。\n- 当函数接收到的参数数量在运行时变化时，可以使用可变长度参数。\n- 它表示为 `...`。\n- 需要包含 `stdarg.h`\
    \ 头文件来使用可变长度参数。\n\n### 可变长度参数示例程序：\n\n```c\n#include <stdio.h>\n#include <stdarg.h>\n\
    int add(int num,...);\nint main(){\n    printf(\"The value from first call = %d\\\
    n\", add(2,2,3));\n    printf(\"The value from second call= %d \\n\", add(4,2,3,4,5));\n\
    \    return 0;\n}\nint add(int num,...){\n    va_list valist;\n    int sum = 0;\n\
    \    int i;\n    va_start(valist, num);\n    for (i = 0; i < num; i++){\n    \
    \    sum += va_arg(valist, int);\n    }\n    va_end(valist);\n    return sum;\n\
    }\n```\n**OUTPUT:**\n```\nThe value from first call = 5\nThe value from second\
    \ call= 14\n```\n\n## C 语言中的指针\n\nC 语言中的指针是存储另一个变量地址的变量。指针用于动态分配内存。指针可以是任何数据类型，如\
    \ `int`、`float`、`char`、`double` 等。\n\n- **指针语法**: `data_type *var_name;` 示例：`int\
    \ *p;` `char *p;` 其中 `*` 用于表示指针变量而不是普通变量。\n\n### 关于 C 指针的关键点：\n\n- 普通变量存储值，而指针变量存储地址。\n\
    - `&` 符号用于获取变量的地址。\n- `*` 符号用于获取变量的值。\n- 如果指针初始化为 `NULL`，意味着它没有指向任何地方。\n- 两个指针相减可以知道之间有多少个元素。\n\
    - 但不允许进行指针加、乘、除法。\n\n### 指针示例程序：\n\n```c\n#include <stdio.h>\nint main(){\n  \
    \  int *ptr, q;\n    q = 50;\n    /* q 的地址赋值给 ptr */\n    ptr = &q;/* 显示 q 的值\
    \ */\n    printf(\"%d\", *ptr);\n    return 0;\n}\n```\n**OUTPUT:**\n```\n50\n\
    ```\n\n因此对指针可以执行以下操作：\na) **指针加数字**: `int i=4,j,k; J=&i; J=j+1; K=j+3;`\nb) **指针减去数字**\n\
    c) **一个指针减去另一个指针**:\n```c\n#include<stdio.h>\nint main(){\n    int arr[] = { 10,20,30,45,67,56,74};\n\
    \    int * i,j;\n    i=&arr[1];\n    j=&arr[5];\n    printf(\"\\n %d\", j-i);\n\
    }\n```\nd) **指针变量比较**:\n```c\n#include<stdio.h>\nint main(){\n    int arr[] =\
    \ {10,20,36,72,45,36};\n    int *j,*k;\n    j=&arr[4];\n    k=(arr+4);\n    if(j==k)\n\
    \        printf(\"\\n 两个指针指向同一个位置\");\n    else\n        printf(\"\\n 两个指针没有指向同一个位置\"\
    );\n    return 0;\n}\n```\n\n## 数组\n\n数组是属于相同类型的变量集合。你可以在数组中存储一组相同类型的数据。数组示例：\n\
    ```c\n#include<stdio.h>\nint main (){\n    int x;\n    x=5;\n    printf(\"\\n%d\"\
    ,x);\n    return 0;\n}\n```\na) **数组声明**: `int marks[30]`\nb) **向数组输入数据**:\n```c\n\
    for(i=0;i<30;i++){\n    printf(\"\\n enter marks\");\n    scanf(\"%d\",&marks[i]);\n\
    }\n```\nc) **从数组读取数据**:\n```c\nfor(i=0;i<30;i++){\n    sum=sum+marks[i];\n}\n\
    avg=sum/30;\nprintf(\"\\n average =%d\", avg);\n```\nd) **数组初始化**:\n```c\nint\
    \ num[6]={2,4,12,5,45};\nfloat[]={12.3,34.2,-23.4,-11.3};\n```\ne) **边界检查**: 在\
    \ C 中，没有检查用于数组的下标是否超过了数组的大小。\n```c\n#include<stdio.h>\nint main(){\n    int num\
    \ [40],i;\n    for(i=0;i<40;++i)\n        num[i]=i;\n    return 0;\n}\n```\n\n\
    我们学习了数组：\na) 数组是相似元素的集合\nb) 数组中的第一个元素编号为 0，所以最后一个元素的索引小于数组的大小。\nc) 数组也称为下标变量。\n\
    d) 在使用数组之前，必须声明其类型和维度。\ne) 无论数组多大，其元素始终存储在连续内存中。\n\n### 数组的类型\n\n数组有几种类型：\n1.\
    \ 一维数组\n2. 二维数组\n3. 三维数组\n4. 多维数组等\n\n#### 1. 一维数组\n语法：`data_type array_name[size];`\
    \ 示例：`int a[5];` `char str[10];`\n\n**一维数组示例程序：**\n```c\n#include <stdio.h>\n\
    int main(){\n    int a[5] = {10, 20, 30, 40, 50};\n    int i;\n    for(i=0; i<5;\
    \ i++){\n        printf(\"%d \", a[i]);\n    }\n    return 0;\n}\n```\n\n####\
    \ 2. 二维数组\n语法：`data_type array_name[rows][columns];` 示例：`int arr[2][3];`\n\n**二维数组示例程序：**\n\
    ```c\n#include <stdio.h>\nint main(){\n    int arr[2][3] = {{1, 2, 3}, {4, 5,\
    \ 6}};\n    int i, j;\n    for(i=0; i<2; i++){\n        for(j=0; j<3; j++){\n\
    \            printf(\"%d \", arr[i][j]);\n        }\n        printf(\"\\n\");\n\
    \    }\n    return 0;\n}\n```\n\n#### 3. 字符串\n字符串是以空字符（`\\0`）终止的字符数组。语法：`char\
    \ string_name[];` 示例：`char str[] = \"Hello\";`\n\n**字符串示例程序：**\n```c\n#include\
    \ <stdio.h>\nint main(){\n    char str[] = \"Hello\";\n    printf(\"%s\", str);\n\
    \    return 0;\n}\n```\n"
- fmt: "\nThe `%s` used in `printf()` is a format specification for printing out a\
    \ string. The same specification can be used to receive a string from the keyword,\
    \ as shown below:\n\n```c\n#include<stdio.h>\nint name(){\n    char name[25];\n\
    \    printf(\\n enter your name”);\n    scanf(“%s”,name);\n    printf(“ hello\
    \  %s !\\n”, name);\n    return 0;\n}\n```\nOutput:\nEnter your name  Debnath\n\
    Hello Debnath\n\n**Note :-** While entering the string using `scanf()`, we must\
    \ be cautious about two things:\nA) The length of the string should not exceed\
    \ the dimension of the character array. This is because the C compiler does not\
    \ perform bounds checking on character arrays.\nB) `scanf()` is not capable of\
    \ receiving multi-word strings. Therefore, names such as ‘Debnath’ would be un-acceptable.\n\
    \nThe way to get around this limitation is by using the function `gets()`. The\
    \ usage of functions `gets()` and its counterpart `puts()` is shown below:\n\n\
    ```c\n#include <stdio.h>\nint main (){\n    Char name[25];\n    Printf(\\n enter\
    \ your full name “);\n    Gets( name);\n    Puts(“hello”);\n    Puts(name)\n \
    \   Return 0;\n}\n```\nOutput:\nEnter your full name  Deb nath Roy\nHello !Debnath\
    \ Roy\n\n### Pointers to strings\nWhereas we can assign a `char` pointer to another\
    \ `char` pointer Example:\n\n```c\n#include<stdio.h>\nint main(){\n    char str[]=\
    \ “hello”;\n    char str2[10];\n    char *s=”good morning”;\n    char *q;\n  \
    \  str2=str1;/*error*/\n    q=s;/*works*/\n    return 0;\n}\n```\n\n### Standard\
    \ library string function\nWith every C compiler, a large set of useful string\
    \ handling library function are provided. Lists the more commonly used function\
    \ along with their purpose:\n\n| Function | Use |\n| :--- | :--- |\n| `strlen()`\
    \ | finds length of a string |\n| `strlower()` | converts a string to lowercase\
    \ |\n| `strupper()` | converting a string to uppercase |\n| `strcat()` | appends\
    \ one string at the end of another |\n| `strcpy()` | copies a string into another\
    \ |\n| `strcmp()` | compares two strings |\n| `strrev()` | reverses string |\n"
