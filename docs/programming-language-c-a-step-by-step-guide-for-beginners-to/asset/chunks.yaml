    ## 关于本书

    `C 编程语言`向你介绍了最常用的编程语言，多年来，它一直是许多其他版本语言的基础。这是一本非常好的书，不仅适合初学者，也适合那些希望在操作各种计算机程序时，了解其后台运行机制的计算机用户。


    在本书书中，你将学习`C 编程语言`包含的内容，学习如何编写条件、表达式、语句甚至是命令，以便该语言能够高效地执行其功能。你还将学习如何组织相关的表达式，以便在编译和执行后，计算机返回的是有用的结果而不是错误信息。此外，本书还详细介绍了`C
    语言`中所需的数据类型以及如何表示这些数据类型。


    简单来说，这是一本为程序员、修读其他计算机课程的学习者，以及其他想要精通最流行的计算机语言`C`工作原理的计算机用户编写的教程。


    书籍内容如下：

    - 什么是 C

    - 编程基础

    - 数据类型

    - 标记与关键字

    - 决策控制语句

    - C 语言中逻辑运算符的使用

    - 循环控制语句

    - 分支控制语句

