- fmt: "\n# HOW TO USE CONSTANTS IN A C PROGRAM?\n\nWe can define constants in a C\
    \ program in the following ways.\n\n1. By `const` keyword\n2. By `#define` preprocessor\
    \ directive\n\nPlease note that when you try to change constant values after defining\
    \ in C program, it will through error.\n\n## EXAMPLE PROGRAM USING CONST KEYWORD\
    \ IN C:\n\n```c\n#include <stdio.h>\nvoid main() {\n    const int height = 100;\
    \ /*int constant*/\n    const float number = 3.14; /*Real constant*/\n    const\
    \ char letter = 'A'; /*char constant*/\n    const char letter_sequence[10] = \"\
    ABC\"; /*string constant*/\n    const char backslash_char = '\\?'; /*special char\
    \ cnst*/\n    printf(\"value of height :%d \\n\", height );\n    printf(\"value\
    \ of number : %f \\n\", number );\n    printf(\"value of letter : %c \\n\", letter\
    \ );\n    printf(\"value of letter_sequence : %s \\n\", letter_sequence);\n  \
    \  printf(\"value of backslash_char : %c \\n\", backslash_char);\n}\n```\n\n**OUTPUT:**\n\
    ```\nvalue of height : 100\nvalue of number : 3.140000\nvalue of letter : A\n\
    value of letter_sequence : ABC\nvalue of backslash_char : ?\n```\n\n## EXAMPLE\
    \ PROGRAM USING #DEFINE PREPROCESSOR DIRECTIVE IN C:\n\n```c\n#include <stdio.h>\n\
    #define height 100\n#define number 3.14\n#define letter 'A'\n#define letter_sequence\
    \ \"ABC\"\n#define backslash_char '\\?'\nvoid main() {\n    printf(\"value of\
    \ height : %d \\n\", height );\n    printf(\"value of number : %f \\n\", number\
    \ );\n    printf(\"value of letter : %c \\n\", letter );\n    printf(\"value of\
    \ letter_sequence : %s \\n\", letter_sequence);\n    printf(\"value of backslash_char\
    \ : %c \\n\", backslash_char);\n}\n```\n\n**OUTPUT:**\n```\nvalue of height :\
    \ 100\nvalue of number : 3.140000\nvalue of letter : A\nvalue of letter_sequence\
    \ : ABC\nvalue of backslash_char : ?\n```\n\n## Rules for constructing integer\
    \ constants\n\na) An integer constant must have at least one digits.\nb) It must\
    \ not have a decimal point.\nc) It can be either positive or negative.\nd) If\
    \ no sign precedes an integer constant, it is assumed to be positive.\ne) No commas\
    \ or blanks are allowed within an integer constant.\nf) The allowable range for\
    \ integer constant is `-2147483648` to `+2147483647`.\nEx- `-426`, `+782`, `-8000`,\
    \ `-7605`\n\n## Rules for constructing real constants\n\nReal constant are often\
    \ called floating point constants. The real constants could be written in two\
    \ forms: Fractional form, and Exponential form.\n\na) A real constant must have\
    \ at least one digits.\nb) It must have a decimal point.\nc) It could be either\
    \ positive or negative.\nd) Default sign is positive.\ne) No commas or blanks\
    \ are allowed within a real constant.\nEx:- `+325.34`, `426.0`, `-48.5789`\n\n\
    ## Rules for constructing character constants\n\na) A character constant is a\
    \ single alphabet, a single digits or a single special symbol enclosed within\
    \ single inverted commas. Both the inverted commas should point to the left. for\
    \ example `'a'` is a valid character constant whereas `a` is not.\nb) The maximum\
    \ length of a character constant can be 1 character.\nEx:- `'A'`, `'T'`, `'S'`\n\
    \n## Types of c variables\n\nAn entity that may vary during program execution\
    \ is called a variable. Variable names are given to location in memory. These\
    \ locations can contain integer, real or character constant. In any language the\
    \ types of variables that it can support depends on the types of constant that\
    \ it can handle. This is because a particular type of variable can hold only an\
    \ integer constant, a real variable can hold only a real constant and a character\
    \ variable can hold only a character constant.\n\nThree types of C variables:\
    \ \na) integer `x, y, z;`\nb) float `z;`\nc) char `st-name[20];`\n\n## Rules for\
    \ constructing variable names\n\na) A variable name is any combination of 1 to\
    \ 30 alphabets, digits or underscores. Some compilers allow variable names whose\
    \ length could be up to 247 character. Still it would be safer.\nb) The variable\
    \ name must start with an alphabet or underscore.\nc) No commas or blanks are\
    \ allowed within a variable name.\nd) Reserved keywords cannot be used as variable\
    \ names.\n"
