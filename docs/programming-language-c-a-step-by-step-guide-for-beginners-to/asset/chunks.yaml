    a character variable can hold only a character constant.Three types of C variables 
      : _ a) integer   x ,y, z ;     b) float   z;          c) char st- name[20] :Rules
    for constructing variable namesa)       A variable name is any combination of
    1 to  30 alphabets, digits or underscores. Some compilers allow variable names
    whose length could be up to 247 character. Still it would be safer to stick to
    the rule of 31 character. Do not create unnecessarily long variable names as it
    adds to your typing effort.b)        The first character in the variable name
    must be an alphabet or underscore.c)         No commas or blanks are allowed within
    a variable name.d)        No special symbol other than an underscore.Ex:- si...int, 
    m-hra, pop-e-78THERE ARE THREE TYPES OF VARIABLES IN C PROGRAM THEY ARE,


    1.  Local variable


    2.  Global variable


    3.  Environment variable


    1. EXAMPLE PROGRAM FOR LOCAL VARIABLE IN C:


    *   The scope of local variables will be within the function only.


    *   These variables are declared within the function and can’t be accessed outside
    the function.


    *   In the below example, m and n variables are having scope within the main function
    only. These are not visible to test function.


    *   Like wise, a and b variables are having scope within the test function only.
    These are not visible to main function.


    | #include<stdio.h>void test();int main(){int m = 22, n = 44;// m, n are local
    variables of main function/*m and n variables are having scopewithin this main
    function only.These are not visible to test funtion.*//* If you try to access
    a and b in this function,you will get ''a'' undeclared and ''b'' undeclared error
    */printf("\nvalues : m = %d and n = %d", m, n);test();}void test(){int a = 50,
    b = 80;// a, b are local variables of test function/*a and b variables are having
    scopewithin this test function only.These are not visible to main function.*//*
    If you try to access m and n in this function,you will get ''m'' undeclared and
    ''n'' undeclarederror */printf("\nvalues : a = %d and b = %d", a, b);} |


    OUTPUT:


    | values : m = 22 and n = 44values : a = 50 and b = 80 |


    EXAMPLE PROGRAM FOR GLOBAL VARIABLE IN C:


    *   The scope of global variables will be throughout the program. These variables
    can be accessed from anywhere in the program.


    *   This variable is defined outside the main function. So that, this variable
    is visible to main function and all other sub functions.


    | 1234567891011121314151617 | #include<stdio.h>void test();int m = 22, n = 44;int
    a = 50, b = 80;int main(){printf("All variables are accessed from main function");printf("\nvalues:
    m=%d:n=%d:a=%d:b=%d", m,n,a,b);test();}void test(){printf("\n\nAll variables are
    accessed from" \" test function");printf("\nvalues: m=%d:n=%d:a=%d:b=%d", m,n,a,b);}
    |


    OUTPUT:


    | All variables are accessed from main function values : m = 22 : n = 44 : a =
    50 : b = 80


    All variables are accessed from test function


    values : m = 22 : n = 44 : a = 50 : b = 80 |


    ENVIRONMENT VARIABLES IN C:


    *   Environment variable is a variable that will be available for all C  applications
    and C programs.


    *   We can access these variables from anywhere in a C program without declaring
    and initializing in an application or C program.


    *   The inbuilt functions which are used to access, modify and set these environment
    variables are called environment functions.


    *   There are 3 functions which are used to access, modify and assign an environment
    variable in C. They are,


    EXAMPLE PROGRAM FOR GETENV() FUNCTION IN C:This function gets the current value
    of the environment variable. Let us assume that environment variable DIR is assigned
    to “/usr/bin/test/”.


    | 12345678 | #include <stdio.h>#include <stdlib.h>int main(){printf("Directory
    = %s\n",getenv("DIR"));return 0;} |


    OUTPUT:


    | /usr/bin/test/ |


    EXAMPLE PROGRAM FOR SETENV() FUNCTION IN C:This function sets the value for environment
    variable. Let us assume that environment variable “FILE” is to be assigned “/usr/bin/example.c”


    | 123456789 | #include <stdio.h>#include <stdlib.h>int main(){setenv("FILE", "/usr/bin/example.c",50);printf("File
    = %s\n", getenv("FILE"));return 0;} |


    OUTPUT:


    | File = /usr/bin/example.c |


    EXAMPLE PROGRAM FOR PUTENV() FUNCTION IN C:This function modifies the value for environment
    variable. Below example program shows that how to modify an existing environment
    variable value.'
