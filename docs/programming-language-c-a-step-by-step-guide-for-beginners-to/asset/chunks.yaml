  trans: "\n\n| `unsigned long long int / 8` | 2(power)64 –1 |\n\n## 举型示例程序\n\n```c\n\
    #include <stdio.h>\nint main(){\n    enum MONTH { Jan = 0, Feb, Mar };\n    enum\
    \ MONTH month = Mar;\n    if(month == 0)printf(\"Value of Jan\");\n    else if(month\
    \ == 1)printf(\"Month is Feb\");\n    if(month == 2)printf(\"Month is Mar\");\n\
    }\n```\n\n**输出：**\n```\nMonth is March\n```\n\n## C 语言中的派生类型\n\n- 数组、指针、结构体和联合在\
    \ C 语言中被称为派生类型。\n- 要了解更多关于派生类型的信息，请访问本教程中的 [C – 数组](http://fresh2refresh.com/c/c-array/)\
    \ 、“ [C – 指针](http://fresh2refresh.com/c/c-pointer/) 、“ [C – 结构体](http://fresh2refresh.com/c/c-structures/)\
    \ ” 和 “ [C – 联合](http://fresh2refresh.com/c/c-union/) ” 主题。\n\n## C 语言中的 void\
    \ 类型\n\n- Void 是一个空数据类型，没有值。\n- 它可以用于函数和指针。\n- 请访问 “ [C – 函数](http://fresh2refresh.com/c/c-function/)\
    \ ”，通过简单的值传递和引用传递调用示例程序来了解如何在函数中使用 void 类型。\n\n## 标记（TOKENS）与关键字\n\nC 标记、标识符和关键字是\
    \ C 程序的基础。本页将通过定义和简单的示例程序解释所有这些内容。\n\n### C 标记\n\n- C 标记是 C 语言中基本的构建块，它们组合在一起以编写一个\
    \ C 程序。\n- C 程序中的每一个最小的独立单元都被称为 C 标记。\n- C 标记共有六类。它们是：\n\n### 标记示例程序\n\n```c\n\
    #include<stdio.h>\nint main(){\n    int x, y, total;\n    x = 10, y = 20;\n  \
    \  total = x + y;\n    printf (\"Total = %d \\n\", total)\n}\n```\n\n### C 语言中的标识符\n\
    \n- C 程序中的每个程序元素都被赋予一个称为标识符的名称。\n- 用于标识变量、函数和数组的名称是标识符的示例。例如，`x` 是上述程序中赋予整数变量的名字。\n\
    \n#### C 语言中构造标识符名称的规则\n\n1. 第一个字符应该是字母或下划线。\n2. 随后的字符可以是数字或字母。\n3. 除了下划线外，不允许使用标点符号和特殊字符。\n\
    4. 标识符不应该是关键字。\n\n### C 语言中的关键字\n\n- 关键字是 C 编译器中预定义的单词。\n- 每个关键字都用于在 C 程序中执行特定的功能。\n\
    - 由于关键字是编译器的引用名称，因此不能用作变量名。\n\n## 决策控制语句\n\n默认情况下，程序中的指令是按顺序执行的。然而，在实际的编程场景中，我们很少希望指令按顺序执行。很多时候，我们希望在某种特定情况下执行一组指令，而在另一种情况下执行另一组完全不同的指令。这种情况在\
    \ C 程序中通过决策控制语句来处理。正如前面提到的，C 语言可以实现决策控制语句，主要有三种决策控制语句：\n\na) `if` 语句\nb) `if-else`\
    \ 语句\nc) 条件运算符\n\n### `if` 语句\n\n与大多数语言一样，C 使用关键字 `if` 来实现决策控制语句。关键字 `if` 告诉编译器后面的是一个决策控制语句。无论条件如何，如果为真（true），则不执行该语句，而是程序将跳过它。但我们如何在\
    \ C 中表示条件本身呢？我们如何评估它的真假？根据一般规则，我们使用 C 的关系运算符来表示条件。关系运算符允许我们比较两个值，以查看它们是否相等、不相等，或者一个是否大于另一个。以下是它们在\
    \ C 中的外观以及评估方式。\n\n| 此表达式 | 结果 |\n| :--- | :--- |\n| `x == y` | 为真 |\n| `x !=\
    \ y` | `x` 等于 `y` |\n| `x < y` | `x` 不等于 `y` |\n| `x > y` | `x` 小于 `y` |\n| `x\
    \ <= y` | `x` 大于 `y` |\n| `x >= y` | `x` 小于或等于 `y` |\n\n"
- fmt: "\n# Relational Operators\n\nThe relational operators should be familiar to\
    \ you except for the equality operators `==` and the inequality operators `!=`.\
    \ Note that `=` is used for assignment, whereas `==` is used for comparison of\
    \ two quantities.\n\nHere is a simple program, which demonstrates the use of `if`\
    \ and the relational operators.\n\n### a)\n```c\n#include<stdio.h>\nmain(){\n\
    \    int a,b,c,big;\n    printf(\"enter the value of a,b and c\");\n    scanf(\"\
    %d%d%d\",&a,&b,&c);\n    big=a;\n    if(b>big)\n        big=b;\n    if(c>big)\n\
    \        big=c;\n    printf(\"largest number=%d\",big);\n}\n```\nOutput of this\
    \ program are as below:\n```\nenter the value of a,b and c100 200 500\nLargest\
    \ number = 500\n```\nOn execution of this program, if you type `enter the value\
    \ of a,b and c`, you get a message on the screen through `printf()`. The largest\
    \ number..\n\nTo make you comfortable with the decision control instruction, one\
    \ more example has been given below. Study it carefully before reading further.\n\
    \n### b)\n```c\n#include<stdio.h>\nmain(){\n    int a,b,c,small;\n    printf(\"\
    Enter the value of a,b and c\");\n    scanf(\"%d%d%d\",&a,&b,&c);\n    small=a;\n\
    \    if(b<small)\n        small=b;\n    if(c<small)\n        small=c;\n    printf(\"\
    smallest no=%d\",small);\n}\n```\nOutput of this program are as follow below:\n\
    ```\nEnter the value of a,b and c50 100 150\nSmallest no = 50\n```\nOn execution\
    \ of this program, if you type `enter the value of a,b and c`, you get a message\
    \ on the screen through `printf()`. The smallest number.\n\n# The if-else statement\n\
    \nThe `if` statement by itself will execute a single statement, or a group of\
    \ statement, when the expression following `if` evaluates to true. It does nothing\
    \ when the expression evaluates to false. Can we execute one group of statements\
    \ if the expression evaluates to true and another group of statement if the expression\
    \ evaluates to false? Of course! This is what the purpose of the `else` statement\
    \ that is demonstrated in the following example:\n\n### A)\n```c\n#include<stdio.h>\n\
    main(){\n    int total;\n    float percentage;\n    printf(\"\\n enter the total\
    \ marks in exam\");\n    scanf(\"%d\",& total);\n    percentage= total/8;\n  \
    \  printf(\" percentage =%f\",percentage);\n    if(percentage>=90)\n        printf(\"\
    \\n1st divisioin \");\n    if( percentage>=70)\n        printf(\"\\n 2nd division\"\
    );\n    if ( percentage>=50)\n        printf( \\n third division\");\n    else\n\
    \        printf( \"\\n failed\");\n}\n```\nOutput of this program are as follows\
    \ below:\n```\nenter the total marks in exam580\nPercentage = 72.000002\n2nd division\n\
    ```\n\n### B)\n```c\n#include<stdio.h>\nmain(){\n    int total;\n    printf(\"\
    \\n enter total marks in exam\");\n    scanf(\"%d\",&total);\n    if (total>=100)\n\
    \        printf(\"\\n passed\");\n    else\n        printf(\"\\n failed\");\n\
    }\n```\nOutput of this program:\n```\nenter total marks in exam:500\npassed\n\
    ```\n\n# A few points worth nothing\n\nA) The group of statements after the `if`\
    \ up to and not including the `else` is called an `if` block, similarly, the statements\
    \ after the `else` form the `else` block.\n\nB) Notice that the `else` is written\
    \ exactly below the `if`. The statements in the `if` block and those in the `else`\
    \ block have been indented to the right. This formatting convention is followed\
    \ the book to enable you to understand the working of the program better.\n\n\
    C) Had there been only one statement to be executed in the `if` block and one\
    \ statement in the `else` block we could have dropped the pair of braces.\n\n\
    D) As with the `if` statement, the default, the default scope of `else` is also\
    \ the statement immediately after the `else`. To override this default scope,\
    \ a pair of braces, as shown in the above example, must be used.\n\n# Nested if-else\n\
    \nIt is perfectly all right if we write an entire `if-else` construct within either\
    \ the body of the `if` statement or the body of an `else` statement. This is called\
    \ nesting of ifs. This is shown in the following program:\n\n### a)\n```c\n#include\
    \ <stdio.h>\nint main(){\n    int i ;\n    printf(\" enter either 1 or 2 \");\n\
    \    scanf(\"%d\", &i);\n    if (i==1)\n        printf(\" you would go to heaven\
    \ \\n\");\n    else{\n        if (i==2)\n            printf(\"\\n hell was created\
    \ with you in mind \");\n        else\n            printf(\"\\n how was mother\
    \ earth\");\n    }\n    return 0;\n}\n```\nNote that: the second `if-else` construct\
    \ is nested in the first `else` statement. If the condition in the first `if`\
    \ statement is false, then the condition in the second `if` statement checked.\
    \ If it is false as well, then final `else` statement is executed.\n\nYou can\
    \ see in the program how each time a `if-else` construct is nested within another\
    \ `if-else` construct, it is also indented to add clarity to the program. Inculcate\
    \ this habit of indentation, otherwise, you would end up writing programs which\
    \ nobody can understand easily at a later date. Note that whether we indent or\
    \ not indent the program, it does not alter the flow of execution of instructions\
    \ in the program.\n\n# Use of logical operator in C\n\nThese operators are used\
    \ to perform logical operation on the given expression C allows usage of three\
    \ logical operators, namely, `&&`, `||`, and `!`. These are to be read as AND,\
    \ OR, and NOT respectively.\n\n| Operators | Description |\n| :--- | :--- |\n\
    | `&&` | AND - returns true if both operands true |\n| `||` | OR - returns true\
    \ if at least one operand true |\n| `!` | NOT - inverts the logical state |\n\n\
    # Arithmetic Operators\n\nArithmetic operators are used to perform mathematical\
    \ calculations like addition, subtraction, multiplication, division, and modulus.\n\
    \n| Operators | Example |\n| :--- | :--- |\n| `+` | addition |\n| `-` | subtraction\
    \ |\n| `*` | multiplication |\n| `/` | division |\n| `%` | modulus |\n\n# Assignment\
    \ Operators\n\nIn c program, values are assigned using assignment operators. There\
    \ are 2 categories of assignment operators:\n\n### Simple assignment operators\n\
    `=` - example: `sum=10;` (10 is assigned to variable sum)\n\n### Compound assignment\
    \ operators\n`+=`, `-=`, `*=`, `/=`, `%=`, `&=`, `^=`\n\n| Operators | Example\
    \ |\n| :--- | :--- |\n| `+=` | `sum+=10` (is same as `sum = sum +10`) |\n| `-=`\
    \ | `sum-=10` (is same as `sum = sum -10`) |\n| `*=` | `sum*=10` (is same as `sum\
    \ = sum *10`) |\n| `/=` | `sum/=10` (is same as `sum = sum /10`) |\n| `%=` | `sum%=10`\
    \ (is same as `sum = sum%10`) |\n| `&=` | `sum&=10` (is same as `sum = sum &10`)\
    \ |\n| `^=` | `sum^=10` (is same as `sum = sum ^10`) |\n"
