    StructureC Structure is a collection of different data types which are grouped
    together and each element in a C structure is called member.


    *   If you want to access structure members in C, structure variable should be
    declared.


    *   Many structure variables can be declared for same structure and memory will
    be allocated for each separately.


    *   It is a best practice to initialize a structure to null while declaring, if
    we don’t assign any values to structure members.


    DIFFERENCE BETWEEN C VARIABLE, C ARRAY AND C STRUCTURE:


    *   A normal C variable can hold only one data of one data type at a time.


    *   An array can hold group of data of same data type.


    *   A structure can hold group of data of different data types and Data types
    can be int, char, float, double and long double etc.


    C Structure:


    | Syntax | struct student {


    int a;


    char b[10];


    } |


    | Example | a = 10; b = “Hello”; |


    C Variable:


    | int | Syntax: int a; Example: a = 20; |


    | char | Syntax: char b; Example: b=’Z’; |


    C Array:


    | int | Syntax: int a[3]; Example:


    a[0] = 10;


    a[1] = 20;


    a[2] = 30;


    a[3] = ‘\0’; |


    | char | Syntax: char b[10]; Example:


    b=”Hello”; |'
