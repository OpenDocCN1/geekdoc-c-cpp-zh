  trans: "\n\n# 如何在 C 程序中使用常量？\n\n我们可以通过以下方式在 C 程序中定义常量：\n\n1. 通过 `const` 关键字\n2.\
    \ 通过 `#define` 预处理器指令\n\n请注意，当你在 C 程序中尝试在定义常量后修改常量值时，程序将会报错。\n\n## C 语言中使用 CONST\
    \ 关键字的示例程序：\n\n```c\n#include <stdio.h>\nvoid main() {\n    const int height =\
    \ 100; /*整常量*/\n    const float number = 3.14; /*实数常量*/\n    const char letter\
    \ = 'A'; /*字符常量*/\n    const char letter_sequence[10] = \"ABC\"; /*字符串常量*/\n \
    \   const char backslash_char = '\\?'; /*特殊字符常量*/\n    printf(\"value of height\
    \ :%d \\n\", height );\n    printf(\"value of number : %f \\n\", number );\n \
    \   printf(\"value of letter : %c \\n\", letter );\n    printf(\"value of letter_sequence\
    \ : %s \\n\", letter_sequence);\n    printf(\"value of backslash_char : %c \\\
    n\", backslash_char);\n}\n```\n\n**输出：**\n```\nvalue of height : 100\nvalue of\
    \ number : 3.140000\nvalue of letter : A\nvalue of letter_sequence : ABC\nvalue\
    \ of backslash_char : ?\n```\n\n## C 语言中使用 #DEFINE 预处理器指令的示例程序：\n\n```c\n#include\
    \ <stdio.h>\n#define height 100\n#define number 3.14\n#define letter 'A'\n#define\
    \ letter_sequence \"ABC\"\n#define backslash_char '\\?'\nvoid main() {\n    printf(\"\
    value of height : %d \\n\", height );\n    printf(\"value of number : %f \\n\"\
    , number );\n    printf(\"value of letter : %c \\n\", letter );\n    printf(\"\
    value of letter_sequence : %s \\n\", letter_sequence);\n    printf(\"value of\
    \ backslash_char : %c \\n\", backslash_char);\n}\n```\n\n**输出：**\n```\nvalue of\
    \ height : 100\nvalue of number : 3.140000\nvalue of letter : A\nvalue of letter_sequence\
    \ : ABC\nvalue of backslash_char : ?\n```\n\n## 整数常量构造规则\n\na) 整数常量至少包含一个数字。\n\
    b) 它不能包含小数点。\nc) 它可以是正数也可以是负数。\nd) 如果整数常量前面没有符号，假设为正数。\ne) 整数常量内部不允许出现逗号或空格。\n\
    f) 整数量的允许范围为 `-2147483648` 到 `+2147483647`。\n示例：`-426`, `+782`, `-8000`, `-7605`\n\
    \n## 实数常量构造规则\n\n实数常量通常称为浮点常量。实数有两种的形式：小数形式和指数形式。\n\na) 实数常量至少包含一个数字。\nb) 它必须包含小数点。\n\
    c) 它可以是正数也可以是负数。\nd) 默认符号为正数。\ne) 实数常量内部不允许出现逗号或空格。\n示例：`+325.34`, `426.0`, `-48.5789`\n\
    \n## 字符常量构造规则\n\na) 字符常量是包含在单引号内的单个字母、单个数字或单个特殊符号。两个单引号都应向左对齐。例如，`'a'` 是有效的字符常量，而\
    \ `a` 不是。\nb) 字符常量的最大长度为 1 个字符。\n示例：`'A'`, `'T'`, `'S'`\n\n## C 变量类型\n\n在程序执行过程中可能会变化的实体被称为变量。变量名是被赋予内存位置的。这些位置可以包含整数、实数或字符常量。在任何语言中，支持的变量类型取决于它能处理的常量类型。这是因为特定类型的变量只能存储整数常量，实数变量只能存储实数常量，而字符变量只能存储字符常量。\n\
    \n三种 C 变量：\na) 整数 `x, y, z;`\nb) 浮点 `z;`\nc) 字符 `st-name[20];`\n\n## 变量名构造规则\n\
    \na) 变量名是 1 到 30 个字母、数字或下划线的任意组合。某些编译器允许变量名长度可达 247 个字符。尽管这样更安全。\nb) 变量名必须以字母或下划线开头。\n\
    c) 变量名内部不允许出现逗号或空格。\nd) 保留关键字不能作为变量名。\n\n"
- fmt: "\n## Code Example\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\nint main(){\n\
    \    setenv(\"DIR\", \"/usr/bin/example/\", 50);\n    printf(\"Directory name\
    \ before modifying = %s\\n\", getenv(\"DIR\"));\n    putenv(\"DIR=/usr/home/\"\
    );\n    printf(\"Directory name after modifying = %s\\n\", getenv(\"DIR\"));\n\
    \    return 0;\n}\n```\n\n**OUTPUT:**\n`Directory name before modifying = /usr/bin/example/\
    \ Directory name after modifying = /usr/home/`\n\n## DIFFERENCE BETWEEN VARIABLE\
    \ DECLARATION & DEFINITION IN C\n\n| Variable declaration | Variable definition\
    \ |\n| :--- | :--- |\n| Declaration tells the compiler about data type and size\
    \ of the variable. | Definition allocates memory for the variable. |\n| Variable\
    \ can be declared many times in a program. | It can happen only one time for a\
    \ variable in a program. |\n| The assignment of properties and identification\
    \ to a variable. | Assignments of storage space to a variable. |\n\n## C Keywords\n\
    \nThe keywords cannot be used as variable names because if we do so, we are trying\
    \ to assign a new meaning to the keyword, which is not allowed by the computer.\
    \ Some c compilers allow you to construct variable names that exactly resemble\
    \ the keywords. However, it would be safer not to mix up the variable names and\
    \ the keywords. The keywords are also called reserved words. There are only 32\
    \ keywords available in c.\n\n**Available Keywords:**\n`auto`, `double`, `break`,\
    \ `else`, `case`, `enum`, `char`, `extern`, `const`, `float`, `continue`, `default`,\
    \ `for`, `goto`, `if`, `int`, `struct`, `switch`, `register`, `typedef`, `union`,\
    \ `unsigned`, `signed`, `void`, `volatile`, `volatile`, `while`.\n\n## First C\
    \ Program\n\na) Each instruction in a c program is written as a separate statement.\
    \ Therefore a complete c program would comprise a series of statement.\nb) The\
    \ statements in a program must appear in the same order in which we wish them\
    \ to be executed unless of course the logic of the problems demands a jump or\
    \ transfer of control to statement which is out of sequence.\nc) Blank spaces\
    \ may be inserted between two words to improve the readability of the statement.\
    \ However, no blank spaces allowed within variable constant or keyword.\nd) All\
    \ statements are entered in small letters.\ne) C has no specific rules for the\
    \ position at which statement is to be written. That’s why it is often called\
    \ free form language.\nf) Every c statement must end with `;` thus `;` acts as\
    \ statement terminator.\n\n```c\n#include<stdio.h>\nmain(){\n    int total;\n\
    \    printf(\"\\n enter marks in exam\");\n    scanf(\"%d\",&total);\n    if (total>=100)\n\
    \        printf(\"\\n passed\");\n    else\n        printf(\"\\n failed\");\n\
    }\n```\n\n**Output of this program:**\nEnter marks in exam\n200\npassed\n\n##\
    \ Program Explanation\n\na) it is necessary to use `#include<stdio.h>` at the\
    \ beginning of the program. `#include` is a pre-processor directive.\nb) `main()`\
    \ is a function. A function is nothing but a set of statements. in a c program\
    \ there can be multiple functions. To begin with, we would concentrate only one\
    \ function. The name of this function has to be `main()`, it cannot be anything\
    \ else. All statements that belong to `main()` are enclosed within a pair of braces\
    \ `{}` as shown below:\n\n```c\nint main(){\n    Statement 1\n    Statement 2\n\
    \    Statement 3\n}\n```\nc) Output in C can be achieved using `printf()` function.\
    \ The general form of `printf()` is:\n- `%f` for printing real values\n- `%d`\
    \ for printing integer values\n- `%c` for printing character values\nD) Inputs\
    \ in C can be achieved using `scanf()` function. The general form of `scanf()`\
    \ is:\n- Format string `variable`\n- `%d` for `int`\n- `%f` for `float`\n\n##\
    \ Example Program\n\n```c\n#include<stdio.h>\nmain(){\n    float f,c;\n    printf(\"\
    \\n celcius\");\n    scanf(\"%d\",&c);\n    f=(9*c)/5;\n    printf(\"%f\");\n\
    }\n```\n**Output of this program:**\nEnter celcius\n68.000000\n\n## Instructions\n\
    \nThere are basically three types of instruction in C:\n\nA) **Declaration instruction:**\
    \ this instruction is used to declare the types of variables used in C program.\n\
    B) **Arithmetic instruction:** this instruction is used to perform arithmetic\
    \ operations on constants and variables.\nC) **Control instruction:** this instruction\
    \ is used to control the sequence of execution of various statements.\n\n## Programming\
    \ Basics to Write a C Program\n\nBelow are few commands and syntax used in C to\
    \ write a simple program. Let’s see all sections line by line.\n\n| C Basic commands\
    \ | Explanation |\n| :--- | :--- |\n| `#include <stdio.h>` | This is a preprocessor\
    \ command that standard input output header file(stdio.h) from the C library before\
    \ compiling A program. |\n| `int main()` | This is the main function from where\
    \ execution of any C program begins. |\n| `{` | This indicates the beginning of\
    \ the main function. |\n| `/*some comments*/` | whatever is given inside the command\
    \ `/* */` in any C program, won’t be considered for compilation and execution.\
    \ |\n| `printf(\"Hello World! \")` | `printf` command prints the output onto the\
    \ screen. |\n| `getch()` | This command waits for any character input from keyboard.\
    \ |\n| `return 0;` | This command terminates C program (main function) and returns\
    \ 0. |\n| `}` | This indicates the end of the main function. |\n"
