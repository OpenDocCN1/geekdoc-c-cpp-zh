    \ = 130\n```\n\n## 你知道函数可以返回多少个值吗？\nC 函数可以返回多少个值？\n- 通常情况下，函数返回一个值。\n- 如果你想让函数返回多个值，你可以使用结构体（struct）或指针。\n\
    - 在 C99 标准中，可以使用块表达式（block expressions）来返回多个值。\n\n"
- fmt: "\n```c\n#include <stdio.h>\n#include <stdlib.h>\nint main(int argc, char *argv[])\
    \ { // command line arguments\n    if (argc != 5) {\n        printf(\"Arguments\
    \ passed through command line not equal to 5\");\n        return 1;\n    }\n \
    \   printf(\"\\n Program name  : %s \\n\", argv[0]);\n    printf(\"1st arg  :\
    \ %s \\n\", argv[1]);\n    printf(\"2nd arg  : %s \\n\", argv[2]);\n    printf(\"\
    3rd arg  : %s \\n\", argv[3]);\n    printf(\"4th arg  : %s \\n\", argv[4]);\n\
    \    printf(\"5th arg  : %s \\n\", argv[5]);\n    return 0;\n}\n```\n**OUTPUT:**\n\
    ```\nProgram name : test\n1st arg : this\n2nd arg : is\n3rd arg : a\n4th arg :\
    \ program\n5th arg : (null)\n```\n\n## Variable length argument\n\n- Variable\
    \ length arguments is an advanced concept in C language offered by `c99` standard.\
    \ In `c89` standard, fixed arguments only can be passed to the functions.\n- When\
    \ a function gets number of arguments that changes at run time, we can go for\
    \ variable length arguments.\n- It is denoted as `...` (3 dots).\n- `stdarg.h`\
    \ header file should be included to make use of variable length argument functions.\n\
    \n### EXAMPLE PROGRAM FOR VARIABLE LENGTH ARGUMENTS IN C:\n\n```c\n#include <stdio.h>\n\
    #include <stdarg.h>\nint add(int num,...);\nint main(){\n    printf(\"The value\
    \ from first function call = %d\\n\", add(2,2,3));\n    printf(\"The value from\
    \ second function call= %d \\n\", add(4,2,3,4,5));\n    /*Note - In function add(2,2,3),first\
    \ 2 is total number of arguments 2,3 are variable length arguments \n       In\
    \ function add(4,2,3,4,5),4 is total number of arguments 2,3,4,5 are variable\
    \ length arguments*/\n    return 0;\n}\nint add(int num,...){\n    va_list valist;\n\
    \    int sum = 0;\n    int i;\n    va_start(valist, num);\n    for (i = 0; i <\
    \ num; i++){\n        sum += va_arg(valist, int);\n    }\n    va_end(valist);\n\
    \    return sum;\n}\n```\n**OUTPUT:**\n```\nThe value from first function call\
    \ = 5\nThe value from second function call= 14\n```\n\nIn the above program, function\
    \ `add` is called twice. But, number of arguments passed to the function gets\
    \ varies for each. So, 3 dots (`...`) are mentioned for function `add` that indicates\
    \ that this function will get any number of arguments at run time.\n\n## Pointers\
    \ in C language\n\nPointers in C language is a variable that stores/points the\
    \ address of another variable. A Pointer in C is used to allocate memory dynamically\
    \ i.e. at run time. The pointer variable might be belonging to any of the data\
    \ type such as `int`, `float`, `char`, `double`, `short` etc.\n\n- **Pointer Syntax**:\
    \ `data_type *var_name;` Example : `int *p;` `char *p;`\n- Where, `*` is used\
    \ to denote that `p` is pointer variable and not a normal variable.\n\n### KEY\
    \ POINTS TO REMEMBER ABOUT POINTERS IN C:\n\n- Normal variable stores the value\
    \ whereas pointer variable stores the address of the variable.\n- The content\
    \ of the C pointer always be a whole number i.e. address.\n- Always C pointer\
    \ is initialized to null, i.e. `int *p = null;`.\n- The value of null pointer\
    \ is 0.\n- `&` symbol is used to get the address of the variable.\n- `*` symbol\
    \ is used to get the value of the variable that the pointer is pointing to.\n\
    - If a pointer in C is assigned to `NULL`, it means it is pointing to nothing.\n\
    - Two pointers can be subtracted to know how many elements are available between\
    \ these two pointers.\n- But, Pointer addition, multiplication, division are not\
    \ allowed.\n- The size of any pointer is 2 byte (for 16 bit compiler).\n\n###\
    \ EXAMPLE PROGRAM FOR POINTERS IN C:\n\n```c\n#include <stdio.h>\nint main(){\n\
    \    int *ptr, q;\n    q = 50;\n/* address of q is assigned to ptr */\n    ptr\
    \ = &q;/* display q's value using ptr variable */\n    printf(\"%d\", *ptr);\n\
    \    return 0;\n}\n```\n**OUTPUT:**\n```\n50\n```\n\nThus the following operations\
    \ can be performed on a pointer:\na) **Addition of a number to a pointer**: `int\
    \ i=4,j,k; J=&i; J=j+1; J=j+9; K=j+3;`\nb) **Subtraction of a number from a pointer**\n\
    c) **Subtraction of one pointer from another**:\n```c\n#include<stdio.h>\nint\
    \ main(){\n    int arr[] = { 10,20,30,45,67,56,74};\n    int * i,j;\n    i=&arr[1];\n\
    \    j=&arr[5];\n    printf(\"\\n %d\", j-i);\n}\n```\nd) **comparison of two\
    \ pointer variables**:\n```c\n#include<stdio.h>\nint main(){\n    int arr[] =\
    \ {10,20,36,72,45,36};\n    int *j,*k;\n    j=&arr[4];\n    k=(arr+4);\n    if(j==k)\n\
    \        printf(\"\\n the two pointer to same location\");\n    else\n       \
    \ printf(\"\\n the two pointer do not point to same location\");\n    return 0;\n\
    }\n```\n\n## Array\n\nArray is collection of variables belongings to the same\
    \ data type. You can store group of data same data type in an array. example of\
    \ array:\n```c\n#include<stdio.h>\nint main (){\n    int x;\n    x=5;\n    printf(\"\
    \\n%d\",x);\n    return 0;\n}\n```\na) **Array declaration**: `int marks[30]`\n\
    b) **Entering data into an array**:\n```c\nfor(i=0;i<30;i++){\n    printf(\"\\\
    n enter marks\");\n    scanf(\"%d\",&marks[i]);\n}\n```\nc) **Reading data from\
    \ an array**:\n```c\nfor(i=0;i<30;i++){\n    sum=sum+marks[i];\n}\navg=sum/30;\n\
    printf(\"\\n average =%d\", avg);\n```\nd) **Array initialisation**:\n```c\nint\
    \ num[6]={2,4,12,5,45};\nfloat[]={12.3,34.2,-23.4,-11.3};\n```\ne) **Bounds checking**:\
    \ in c, there is no check to see if subscript used for an array exceeds the size\
    \ of the array.\n```c\n#include<stdio.h>\nint main(){\n    int num [40],i;\n \
    \   for(i=0;i<40;++i)\n        num[i]=i;\n    return 0;\n}\n```\n\nWe have learnt\
    \ about arrays:\na) An array is collection of similar elements\nb) The first element\
    \ in the array is numbered 0, so the last element is less than the size of the\
    \ array.\nc) An array is also known as subscripted variable.\nd) Before using\
    \ an array, its type and dimension must be declared.\ne) However big array, its\
    \ element are always stored in contiguous memory locations.\n\n### TYPES OF C\
    \ ARRAYS\n\nThere are 2 types of C arrays. They are,\n1. One dimensional array\n\
    2. Multi dimensional array\n    - Two dimensional array\n    - Three dimensional\
    \ array\n    - four dimensional array etc…\n\n#### 1. ONE DIMENSIONAL ARRAY IN\
    \ C\nSyntax: `data-type arr_name[array_size];`\n\n**EXAMPLE PROGRAM FOR ONE DIMENSIONAL\
    \ ARRAY IN C:**\n```c\n#include<stdio.h>\nint main(){\n    int i;\n    int arr[5]\
    \ = {10,20,30,40,50}; // declaring and Initializing array in C\n    // To initialize\
    \ all array elements to 0, use int arr[5]={0};\n    /* Above array can be initialized\
    \ as below \n       arr[0] = 10;\n       arr[1] = 20;\n       arr[2] = 30;\n \
    \      arr[3] = 40;\n       arr[4] = 50; */\n    for (i=0;i<5;i++){\n        //\
    \ Accessing each variable\n        printf(\"value of arr[%d] is %d \\n\", i, arr[i]);\n\
    \    }\n}\n```\n**OUTPUT:**\n```\nvalue of arr[0] is 10\nvalue of arr[1] is 20\n\
    value of arr[2] is 30\nvalue of arr[3] is 40\nvalue of arr[4] is 50\n```\n\n####\
    \ 2. TWO DIMENSIONAL ARRAY IN C\nsyntax: `data_type array_name[num_of_rows][num_of_column];`\n\
    \n**EXAMPLE PROGRAM FOR TWO DIMENSIONAL ARRAY IN C:**\n```c\n#include<stdio.h>\n\
    int main(){\n    int i,j;\n    // declaring and Initializing array\n    int arr[2][2]\
    \ = {10,20,30,40};\n    /* Above array can be initialized as below \n       arr[0][0]\
    \ = 10; // Initializing array\n       arr[0][1] = 20;\n       arr[1][0] = 30;\n\
