  trans: "\n\n`printf()` 中使用的 `%s` 是用于打印字符串的格式说明符。相同的说明符也可以用于从关键字接收字符串，如下：\n\n```c\n\
    #include<stdio.h>\nint name(){\n    char name[25];\n    printf(\\n enter your\
    \ name”);\n    scanf(“%s”,name);\n    printf(“ hello  %s !\\n”, name);\n    return\
    \ 0;\n}\n```\n输出：\nEnter your name  Debnath\nHello Debnath\n\n**注意：** 使用 `scanf()`\
    \ 输入字符串时，我们必须注意以下两点：\nA) 字符串的长度不应超过字符数组的维度。这是因为 C 编译器不会对字符数组进行边界检查。\nB) `scanf()`\
    \ 无法接收多单词的字符串。因此，像 ‘Debnath’ 这样的名字是不被接受的。\n\n解决这一局限制的方法是使用 `gets()` 函数。`gets()`\
    \ 函数及其对应的 `puts()` 函数的用法所示：\n\n```c\n#include <stdio.h>\nint main (){\n    Char\
    \ name[25];\n    Printf(\\n enter your full name “);\n    Gets( name);\n    Puts(“hello”);\n\
    \    Puts(name)\n    Return 0;\n}\n```\n输出：\nEnter your full name  Deb nath Roy\n\
    Hello !Debnath Roy\n\n### 字符串指针\n我们可以将一个 `char` 指针赋值给另一个 `char` 指针，例如：\n\n```c\n\
    #include<stdio.h>\nint main(){\n    char str[]= “hello”;\n    char str2[10];\n\
    \    char *s=”good morning”;\n    char *q;\n    str2=str1;/*error*/\n    q=s;/*works*/\n\
    \    return 0;\n}\n```\n\n### 标准库字符串函数\n每个 C 编译器都提供了一系列实用的字符串处理库函数。列出更常用的函数及其用途：\n\
    \n| 函数 | 用途 |\n| :--- | :--- |\n| `strlen()` | 查找字符串长度 |\n| `strlower()` | 将字符串转换为小写\
    \ |\n| `strupper()` | 将字符串转换为大写 |\n| `strcat()` | 将一个字符串附加到另一个字符串末尾 |\n| `strcpy()`\
    \ | 将一个字符串复制到另一个字符串 |\n| `strcmp()` | 比较两个字符串 |\n| `strrev()` | 反转字符串 |\n\n"
- fmt: "\n# Declaring a structure\n\nExample:\n```c\nExampleStruct book{\n    Char\
    \ name;\n    Float price;\n    Int pages;\n};\n```\n\n**Note:**\na) The closing\
    \ brace in the structure type declaration must be followed by a semicolon.\nb)\
    \ It is important to understand that a structure type declaration does not tell\
    \ the compiler to reserve any space in memory. all a structure declaration does\
    \ is, it defines the form of the structure.\nc) Usually structure type declaration\
    \ appears at the top of the source code file, before any variables or functions\
    \ are defined.\nd) If a structure variables is initiated to a value `{0}`, then\
    \ all its elements are set to value 0,. This is a handy way of initializing structure\
    \ variables.\n\n# Accessing structure elements\n\nHaving declared the structure\
    \ type and the structure variables, let us see how the elements of the structure\
    \ can be accessed. They use a dot (`.`) operator. So to refer `pages` of the structure\
    \ defined in our sample program, we have to use `B1.pages`. Similarly, to refer\
    \ to `price`, we would use `B1.price`.\n\n## How structure elements are stored\n\
    \nExample:\n```c\n#include<stdio.h>\nint main(){\n    struct book{\n        Char\
    \ name;\n        Float price;\n        Int pages;\n    };\n    struct book b1={'B',130.00,550};\n\
    \    printf(\"\\n address of name=%u\",&b1.name);\n    printf(\"\\n address of\
    \ price =%u\", & b1.price);\n    printf(\"\\n address of pages =%u\",&b1.pages);\n\
    \    return 0;\n}\n```\n**Output:**\n```\nAddress of name =65518\nAddress of price=65519\n\
    Address of pages =65523\n```\nThe structure elements are stored in memory as shown\
    \ in below:\n`b1.name` | `b1.price` | `b1.pages`\n`'b'` | `130.00` | `550`\n`65518`\
    \ | `65519` | `65523`\n\n## Array of structure\n\nExample:\n```c\n#include<stdio.h>\n\
    void link float();\nint main (){\n    struct book{\n        char name;\n     \
    \   float price;\n        int pages;\n    };\n    struct book b[100];\n    int\
    \ i;\n    for(i=0;i<=99;i++){\n        printf (\\n enter names, price, and pages\"\
    );\n        fflush(stdin);\n        scanf(\" %c%f%d\",&b[i].name,&b[i].price,&b[i].pages);\n\
    \    }\n    for(i=0;i<=99;i++)\n        printf(\"\\n %C%f%d\",b[i].name,b[i].price,b[i].pages);\n\
    \    return 0;\n}\nvoid link float(){\n    float a=0,*b;\n    b=&a;\n    a=*b\n\
    }\n```\n\n**Note:**\na) how the array of structures is declared:\n`struct book\
    \ b[100];`\nThese provides space in memory for 100 structures of the types `struct\
    \ book`.\nb) The syntax we use to reference each element of the array `b` is similar\
    \ to the syntax used for arrays of ints and chars.\nc) Even using structures,\
    \ programming convenience could not be achieved, because a lot of variables(`b1`\
    \ to `b100` foe storing data about hundred books) needed to be handled. Therefore\
    \ he allowed us to to create an array of structure.\nd) In an array of structures,\
    \ all elements of the array are stored in adjacent memory locations.\ne) What\
    \ is the function `linkfloat()` doing here?\nIt forces linking of the floating-point\
    \ emulator into an application. There is no need to call this function, just define\
    \ it anywhere in your program.\n\n# Additional feature of structure\n\n- The value\
    \ of a structure variables can be assigned to another structure variables of the\
    \ same type using assignment operators.\n\n## Assignment operators to piece-meal\
    \ copying\n\nExample:\n```c\n#include<stdio.h>\n#include<string.h>\nint main(){\n\
    \    struct employee{\n        char name[10];\n        int age;\n        float\
    \ salary;\n    };\n    struct employee e1={\"sanjay\",30,5500.50};\n    struct\
    \ employee e2,e3;\n    /*Piece-meal copeing*/\n    strcpy(e2.name,e1.name);  \
    \  /*e2.name=e1.name is wrong*/\n    e2.age=e1.age;\n    e2.salary=e1.salary;\n\
    \    /*copy all elements at one go*/\n    e3=e2;\n    printf(\"\\n %s %d %f\"\
    , e1.name,e1.age,e1.salary);\n    printf(\"\\n %s %d %f \", e2.name,e2.age,e2.salary);\n\
    \    printf(\"\\n %s %d %f \", e3.name,e3.age,e3.salary);\n    return 0;\n}\n\
    ```\n**Output:**\n```\nSanjay 30 5500.500000\nSanjay 30 5500.500000\nSanjay 30\
    \ 5500.500000\n```\n\n## Nested structure\n\nExample:\n```c\n#include<stdio.h>\n\
    int main(){\n    struct address{\n        char phone[15];\n        char city[25];\n\
    \        Int pin;\n    };\n    struct emp{\n        char name[25];\n        struct\
    \ address a;\n    };\n    struct emp e= {\"jeru\", \"5311046\",\"nagpur\",10};\n\
    \    printf(\"name=%s phone=%s \\n\",e.name,e.a.phone);\n    printf(\"\\n city=%s\
    \ pin=%d\\n\",e.a.city,e.a.pin);\n    return 0;\n}\n```\n**Output:**\n```\nName=jeru\
    \ phone=5311046\nCity=Nagpur pin =10\n```\n\n## structure variables passed to\
    \ a function\n\nExample:\n```c\n#include<stdio.h>\nvoid display(char*,char*,int);\n\
    int main(){\n    struct book{\n        char name[25];\n        char author[25];\n\
    \        Int callno;\n    };\n    struct book b1={\"let us\", \"YPK\",101};\n\
    \    display(b1.name,b1.author,b1.callno);\n    return 0;\n}\nvoid display(char*s,\
    \ char*t,int n){\n    printf(\"%s %s %d \\n\", s, t, n);\n}\n```\n**Output:**\n\
    ```\nLet us YPK 101\n```\n\n## Pointer to function\n\nExample:\n```c\n#include<stdio.h>\n\
    struct emp{\n    int a;\n    char ch;\n    float s;\n};\nint main(){\n    struct\
    \ emp e;\n    printf(\"\\n %u %u %u \", &e.ch,&e.s);\n    return 0;\n}\n```\n\
    **Output:**\n- Using `TC/TC++` compiler we get the address as: `65518`, `65520`\n\
    - Using Visual std then the output to be: `242044`, `245052`\n\n# printf()\n\n\
    **Note:** `printf()` can not only print values of variables, it can also print\
    \ the result of an expression. An expression is nothing but a valid combination\
    \ of constant, variables and operators. Thus, `3`, `3+2`, `c` and `a+b*c` all\
    \ are valid expression. The result of these expression can be printed as below.\n\
    \n```c\nprintf(\"\\n %d%d%d\", 3,3+2,c,a+b*c);\n```\n\n**Example:**\n```c\n#include\
    \ <stdio.h>\nint main(){\n    char ch = 'A';\n    char str[20];\n    float flt\
    \ = 10.234;\n    int no = 150;\n    double dbl = 20.123456;\n    printf(\"Character\
    \ is %c \\n\", ch);\n    printf(\"String is %s \\n\", str);\n    printf(\"Float\
    \ value is %f \\n\", flt);\n    printf(\"Integer value is %d\\n\", no);\n    printf(\"\
    Double value is %lf \\n\", dbl);\n    printf(\"Octal value is %o \\n\", no);\n\
    \    printf(\"Hexadecimal value is %x \\n\", no);\n    return 0;\n}\n```\n**Output:**\n\
    ```\nCharacter is A\nFloat value is 10.234000\nInteger value is 150\nDouble value\
    \ is 20.123456\nOctal value is 226\nHexadecimal value is 96\n```\nYou can see\
    \ the output with the same data which are placed within the double quotes of `printf`\
    \ statement in the program.\n\n# scanf()\n\nTo make the program general, the program\
    \ itself should ask the user to supply the values of `p`, `n`, `r`, through the\
    \ keyboard during execution. This can be achived using a function called `scanf()`.\n\
    \nExample:\n```c\n#include <stdio.h>\nint main(){\n    char ch;\n    char str[100];\n\
    \    printf(\"Enter any character \\n\");\n    scanf(\"%c\", &ch);\n    printf(\"\
    Entered character is %c \\n\", ch);\n    printf(\"Enter any string ( upto 100\
    \ character ) \\n\");\n    scanf(\"%s\", &str);\n    printf(\"Entered string is\
    \ %s \\n\", str);\n}\n```\n**Output:**\n```\nEnter any character a\nEntered character\
    \ is a\nEnter any string ( upto 100 character ) hai\nEntered string is hai\n```\n\
    **Note:**\n- The format specifier `%d` is used in `scanf()` statement. So that,\
    \ the value entered is received as an integer and `%s` for string.\n- Ampersand\
    \ is used before variable name `ch` in `scanf()` statement as `&ch`.\n- It is\
    \ just like in a pointer which is used to point to the variable.\n\nFor more information\
    \ about how pointer works:\n- `printf()` is used to display the output and `scanf()`\
    \ is used to read the inputs.\n- `printf()` and `scanf()` functions are declared\
    \ in `stdio.h` header file in C library.\n- All syntax in C language including\
    \ `printf()` and `scanf()` functions are case sensitive.\n\n# Preprocessor directives\n\
    \nBefore a C program is compiled in a compiler, source code is processed by a\
    \ program called preprocessor. This process is called preprocessing.\n- Commands\
    \ used in preprocessor are called preprocessor directives and they begin with\
    \ `#` symbol.\n\n**Features of c pre-processor:**\na) macro expansion\nb) file\
    \ inclusion\nc) conditional compilation\nd) miscellaneous directive\n\nThere are\
    \ 4 regions of memory which are created by a compiled C program. They are:\n1.\
    \ **First region** – This is the memory region which holds the executable code\
    \ of the program.\n2. **2 nd region** – In this memory region, global variables\
    \ are stored.\n3. **3 rd region** – stack\n4. **4 th region** – heap\n\nDO YOU\
    \ KNOW DIFFERENCE BETWEEN STACK & HEAP MEMORY IN C LANGUAGE?\n\n| Stack | Heap\
    \ |\n| :--- | --- |\n| Stack is a memory region where “local variables”, “return\
    \ addresses of function calls\" and \"arguments to functions\" are hold while\
    \ C program is executed. | Heap is a memory region which is used by dynamic memory\
    \ allocation functions at run time. |\n"
