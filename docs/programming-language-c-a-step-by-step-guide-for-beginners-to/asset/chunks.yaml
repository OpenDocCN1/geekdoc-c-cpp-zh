    int a,b,c,big;​ printf("enter the value of a,b and c");​ scanf("%d%d%d",&a,&b,&c);​
    big=a;​ if(b>big)​ big=b;​ if(c>big)​ big=c;​ printf("largest number=%d",big);}Output
    of this program are as belowenter the value of a,b and c 100200500Largest number
    = 500On execution of this program , if you type enter the value of a,b and c 
    , you get a message on the screen through printf(). The largest number..To make
    you comfortable with the decision control instruction, one more example has been
    given below.Study it carefully  before reading further.b)#include<stdio.h>main(){​
    int a,b,c,small;​ printf("Enter the value of a,b and c");​ scanf("%d%d%d",&a,&b,&c);​
    small=a;​ if(b<small)​ small=b;​ if(c<small)​ small=c;​ printf("smallest no=%d",small);}Output
    of this program are as follow belowEnter the value of a,b and c50100150Smallest
    no = 50On execution of this program , if you type enter the value of a,b and c 
    , you get a message on the screen through printf(). The smallest number.The  if
    – else statementThe if statement by itself will execute a single statement, or
    a group of statement, when the expression following if evaluates to true. It does
    nothing when the expression evaluates to false. Can we execute one group of statements
    if the expression evaluates to true and another group of statement if the expression
    evaluates to  false? Of course!This is what is the purpose of the else statement
    that is demonstrated in the following example:A)#include<stdio.h>main(){​ int  total;​
    float percentage;​ printf("\n enter the total marks in exam");​ scanf("%d",& total);​
    percentage= total/8;​ printf(" percentage =%f",percentage);​ if(percentage>=90)​
    printf("\n1st divisioin ");​ if( percentage>=70)​ printf("\n 2nd division");​
    if ( percentage>=50)​ printf( " \n third division");​ else​ printf( "\n failed");}Output
    of this program are as follows belowenter the total marks in exam580Percentage
    = 72.000002nd divisionB)#include<stdio.h>main(){​ int total;​ printf("\n enter
    total marks in exam");​ scanf("%d",&total);​ if (total>=100)​ printf("\n passed");​
    else​ printf("\n failed");}Output of this programenter total marks in exam:500passedA
    few points worth nothingA)       The group of statements after the if upto and
    not including the else is called an if block, similarly, the statements after
    the else form the else block.B)       Notice that the else is written exactly
    below the if. Ihe statements in the if block and those in the else block have
    been indented to the right. This formatting convention is  followed the book to
    enable you to understand the working of the  program better.C)       Had there
    been only one statement to be executed in the if block and one statement in the
    else block we could have dropped the pair of braces.D)       As with the if statement,
    the default, the default scope of else is also the statement immediately after
    the else. To override this default scope, a pair of braes, as shown in the above
    example, must be used.Nested if – elsesIt is perfectly all right if we write an
    entire if-else construct within either the body of the if statement or thebody
    of an else statement. This is called nesting of ifs. This is shown in the following
    program:a)#include <stdio.h>Int main(){Int i ;Printf(“ enter either 1 or 2 “);Scanf(“%d”,
    &i);If (i==1)Printf(“ you would go to heaven \n”);Else{If (i==2);Printf(“\n hell
    was created with you in mind “);ElsePrintf(“\n how was mother earth”);}Return
    0;}Note that :_the second if- else construct is nested in the first else statement.
    If the condition in the first if statement is false, then the condition in the
    second if statement checked. If  it is false as well, then final else statement
    is executed.  You can see in the program how each time a if –else construct is
    nested within another if- else construct, it is also indented to add clarity to
    the program. Inculcate this habit of indentation, otherwise, you would end up
    writing programs which nobody can understand easily at a later date. Note that
    whether we indent or do not indent the program, it does not alter the flow of
    execution of instructions in the program.Use of logical operator in CThese operators
    are used to perform logical operation on the given expressionC allows usage of
    three logical operators, namely, &&,  ||,and. !, These are to be read as AND ,
    OR  and NOT respectively.


    | Operators | Example/ description |


    | && (logical AND) | ( X>5)&&(Y<5)IT RETURNS TRUE WHEN BOTH CONDITION ARE TRUE
    |


    | &#124;&#124; ( logical OR) | (X>=10)&#124;&#124;(Y>=10)IT RETURNS TRUE WHEN
    AT LEAST ONE OF THECONDITION IN TRUE |


    | ! (  logical NOT) | !((X>5)&&(Y<5))IT REVERSES THE STATE OF THE OPERAND“((X>5)&&(Y<5))” 
    IF “((X>5)&&(Y<5))” IS TRUE,LOGICAL,  NOT, OPERATOR MAKES IS FALSE |


    A)         Write a program to find  year ia a leap year or not.#include<stdio.h>main(){​
    int n;​ printf("Enter any year");​ scanf("%d",&n);​ if(((n%100==0)&&(n%400==0))||((n%100!=0)&&(n%4==0)))​
    printf("year is a leap year");​ else​ printf("yearis not a leap year");}Output
    of this program :Enter any year2000Year is a leap yearARITHMETIC OPERATORS IN
    CC arithmetic operators are used to perform mathematical calculations like   
    addition,  subtraction,  multiplication, division, and modulus in c program.


    | Arithmetic operators/ operation | Example |


    | +( addition) | A+B |


    | -( subtraction) | A-B |


    | *( multiplication) | A*B |


    | /( division) | A/B |


    | %( modulus) | A%B |


    A)        WRITE A PROGRAM TO ADDITION A NUMBER#include<stdio.h>main(){​ int a,b,c,add;​
    printf( "\nEnter three number",a,b,c);​ scanf("%d %d %d",&a, &b, &c);​ add=(a+b+c);​
    printf("\n =%d",add);}C ASSIGNMENT OPERATORSIn c program , values for the variables
    are assigned using assignment operators.A)        For example, if the value   10,
    is to be assigned for the variable  sum,  it can be assigned as  , sum=10;B)       
    There are 2 categories of assignment operators in c  language, they areC)       
    Simple assignment operators ( example : =)D)        Compound assignment operators
    ( example : +=,-=,*=,/=,%=,&=,^=)


    | operators | Example/ description |


    | = | Sum=10; 10 is assigned to variable sum |


    | += | Sum+=10; this is same as sum = sum +10 |


    | -= | Sum-=10; this is same as sum = sum -10 |


    | *= | Sum *=10; this is same as sum = sum *10 |


    | /= | Sum/=10; this is same as sum = sum /10 |


    | %= | Sum %=10; this is same as sum = sum%10 |


    | &= | Sum&=10; this is same as sum = sum &10 |


    | ^= | Sum^=10; this is same as sum = sum ^10 |


    a)       In this program, values from o-9, are summed up and total ,45, is displayed
    as output.b)       Assignment operators such as =,  +=, are used in this program
    to assign the values and to sum up the values.a)#include<stdio.h>int main (){​
    int total=0,i;​ for (i=0;i<10;i++)​ {​ total+=i;//this is same as total = total
    +i​ }​ printf("\ntotal=%d,total");}OutputTotal=45C  relational operatorsRelational
    operators are used to find the relation between two variables, i.e  to  compare
    the values of  two variables in a c  program.


    | Operators | Example/ description |


    | > | x>y, ( x is greater than y) |


    | < | X<y, ( x is less than y) |


    | >= | X>=y, ( x is greater than or equal to y). |


    | <= | X<=y, ( x is less than or equal to y ) |


    | == | X==y, ( x is equal to y) |


    | != | X !=y, ( x is not equal to y) |'
