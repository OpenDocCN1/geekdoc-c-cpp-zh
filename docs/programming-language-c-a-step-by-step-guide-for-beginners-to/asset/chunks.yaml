    \ in c having major three decision control instructions:\n\na) The `if` statement\n\
    b) The `if-else` statement\nc) The conditional operators\n\n### The `if` statement\n\
    \nLike most languages, c uses the keyword `if` to implement the decision control\
    \ instruction. The keyword `if` tells the compiler that what follows is a decision\
    \ control instruction. If the condition whatever it is, is true, then the statement\
    \ is not executed, instead the program skips past it. But how do we express the\
    \ condition itself in c? And how do we evaluate its truth or falsity? As a general\
    \ rule, we express a condition using c’s relational operators. The relational\
    \ operators allow us to compare two values to see whether they are equal to each\
    \ other, unequal, or whether one is greather than the other. Here is how they\
    \ look and how they are evaluated in C.\n\n| This expression | Result |\n| :---\
    \ | :--- |\n| `x == y` | is true |\n| `x != y` | `x` is equal to `y` |\n| `x <\
    \ y` | `x` is not equal to `y` |\n| `x > y` | `x` is less than `y` |\n| `x <=\
    \ y` | `x` is greater than `y` |\n| `x >= y` | `x` is less than or equal to `y`\
    \ |\n"
