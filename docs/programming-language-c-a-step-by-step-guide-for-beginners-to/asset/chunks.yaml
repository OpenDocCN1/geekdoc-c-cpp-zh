  trans: "\n\n# C 语言示例程序（DO WHILE 循环）\n\n在 `do..while` 循环控制语句中，`while` 循环无论条件如何都会执行一次。从第二次开始，循环将一直执行，直到条件变为假。\n\
    \n```c\n#include <stdio.h>\nint main(){\n    int i=1;\n    do{\n        printf(\"\
    Value of i is %d\\n\",i);\n        i++;\n    }while(i<=4 && i>=2);\n    }\n```\n\
    \n**输出：**\n\n| Value of i is 1 |\n| Value of i is 2 |\n| Value of i is 3 |\n|\
    \ Value of i is 4 |\n\n# 分支语句\n\n用于在系列语句块中执行特定语句块的语句称为分支语句。C 语言中有 4 种分支语句。它们是：\n\
    \n1. `switch`\n2. `break`\n3. `continue`\n4. `goto`\n\n## 1. C 语言中的 SWITCH CASE\
    \ 语句：\n\n允许我们从多个选择中做出决策的控制语句被称为 `switch`，或者更准确地说是 `switch case default`，因为这三个关键字共同组成了控制语句。\n\
    \n**语法：**\n```c\n_switch ( integer expression){\n    case constant 1;do this;\n\
    \    case constant 2;do this;\n    case constant 3;do this;\n    default;do this;\n\
    }\n```\n\n### 1) C 语言 SWITCH..CASE 语句的示例程序：\n\n```c\n#include <stdio.h>\nint main\
    \ (){\n    int value = 3;\n    switch(value){\n        case 1:printf(“Value is\
    \ 1 \\n” );break;\n        case 2:printf(“Value is 2 \\n” );break;\n        case\
    \ 3:printf(“Value is 3 \\n” );break;\n        case 4:printf(“Value is 4 \\n” );break;\n\
    \        default :printf(“Value is other than 1,2,3,4 \\n” );\n    }\n    return\
    \ 0;\n}\n```\n\n**输出：**\n\n| Value is 3 |\n\n## 2. C 语言中的 BREAK 语句：\n\n我们经常遇到这样的情况：我们想要立即跳出循环，而不需要等待返回条件测试。`break`\
    \ 允许我们这样做。当在任何循环内部遇到 `break` 时，控制会自动传递到循环后的第一个语句。`break` 通常与 `if` 关联使用。\n\n###\
    \ 2) C 语言 BREAK 语句的示例程序：\n\n```c\n#include <stdio.h>\nint main(){\n    int i;\n\
    \    for(i=0;i<10;i++){\n        if(i==5){\n            printf(\"\\nComing out\
    \ of for loop when i = 5\");\n            break;\n        }\n        printf(\"\
    %d \",i);\n    }\n}\n```\n\n**输出：**\n\n| 0 1 2 3 4 Coming out of for loop when\
    \ i = 5 |\n\n## 3. C 语言中的 CONTINUE 语句：\n\n在某些编程情况下，我们希望将控制权回到循环开头，跳过循环内部尚未执行的语句。`continue`\
    \ 关键字允许我们这样做。当在任何循环内部遇到 `continue` 时，控制会自动传递到循环的开头。\n\n### C 语言 CONTINUE 语句的示例程序：\n\
    \n```c\n#include <stdio.h>\nint main(){\n    int i;\n    for(i=0;i<10;i++){\n\
    \        if(i==5 || i==6){\n            printf(\"\\nSkipping %d from display using\
    \ \\\"continue \\n\",i);\n            continue;\n        }\n        printf(\"\
    %d \",i);\n    }\n}\n```\n\n**输出：**\n\n| 0 1 2 3 4 Skipping 5 from display using\
    \ continue |\n| Skipping 6 from display using continue 7 8 9 |\n\n## 4. C 语言中的\
    \ GOTO 语句：\n\n在复杂的编程情况下，使用 `goto` 将控制权带到你想去的地方似乎简单。然而，几乎总是存在更优雅的方法通过 `if`、`while`\
    \ 和 `switch` 编写相同的程序。这些结构更具逻辑性且易于理解。\n\n### C 语言 GOTO 语句的示例程序：\n\n```c\n#include\
    \ <stdio.h>\nint main(){\n    int i;\n    for(i=0;i<10;i++){\n        if(i==5){\n\
    \            printf(\"\\n are using goto statement when i = 5\");\n          \
    \  goto HAI;\n        }\n        printf(\"%d \",i);\n    }\n    HAI: printf(\"\
    \\nNow we are inside label \\\"hai\\\" \\n\");\n}\n```\n\n**输出：**\n\n| 0 1 2 3\
    \ 4 We are using goto statement when i = 5 Now, we are inside label “hai” |\n\n\
    # 存储类\n\n变量的存储类告诉我们：\n\n**A)** 变量存储在何处。\n**B)** 如果没有专门指定初始值，变量的初始值是什么（即默认初始值）。\n\
    **C)** 变量的作用域是什么；即变量的值在哪个函数中可用可用。\n**D)** 变量的生命周期是什么；即变量存在多久。\n\n## C 语言中的存储类说明符类型：\n\
    \nC 语言中有 4 种可用的存储类说明符。它们是：\n\n1. `Automatic`（自动）\n2. `Register`（寄存器）\n3. `Static`（静态）\n\
    4. `External`（外部）\n\n*   **Automatic 存储类**：存储在内存中，初始值是不可预测的（垃圾值），作用域在函数内部，生命周期在函数执行结束。\n\
    *   **Register 存储类**：存储在 寄存器中，初始值是不可预测的，作用域在函数内部，生命周期在函数执行结束。\n*   **Static 存储类**：存储在内存中，初始值为\
    \ 0，作用域在函数内部，生命周期贯穿整个程序执行期间。\n*   **External 存储类**：存储在内存中，初始值为 0，作用域是全局，生命周期贯穿整个程序。\n\
    \n### 1. AUTO 变量示例程序：\n\n`auto` 变量的作用域在函数内部。它等于局部变量。所有局部变量默认都是 `auto` 变量。\n\n\
    ```c\n#include<stdio.h>\nvoid increment(void);\nint main(){\n    increment();\n\
    \    increment();\n    increment();\n    increment();\n    return 0;\n}\nvoid\
    \ increment(void){\n    auto int i = 0 ;\n    printf ( \"%d \", i )\n    i++;\n\
    }\n```\n\n**输出：**\n\n| 0 0 0 0 |\n\n### 2. STATIC 变量示例程序：\n\n静态变量在不同函数调用之间保留值。\n\
    \n```c\n//C static example\n#include<stdio.h>\nvoid increment(void);\nint main(){\n\
    \    increment();\n    increment();\n    increment();\n    increment();\n    return\
    \ 0;\n}\nvoid increment(void){\n    static int i = 0 ;\n    printf ( \"%d \",\
    \ i )\n    i++;\n}\n```\n\n**输出：**\n\n| 0 1 2 3 |\n\n### 3. EXTERNAL 变量示例程序：\n\
    \n`extern` 变量的作用域贯穿主程序。它等于全局变量。外部变量的定义可能在 C 的任何地方。\n\n```c\n#include<stdio.h>\n\
    int x = 10;\nint main(){\n    printf(\"Value of x is %d\", x);\n    return 0;\n\
    }\n```\n\n**输出：**\n\n| Value of x is 10 |\n\n### 4. REGISTER 变量示例程序：\n\n`register`\
    \ 变量的作用域在函数内部。它等于局部变量。所有局部变量默认都是 `register` 变量。\n\n```c\n#include <stdio.h>\n\
    int main(){\n    register int i;\n    for(i=1; i<=5; i++){\n        printf(\"\
    Value of i is %d\\n\", i);\n    }\n    return 0;\n}\n```\n\n**输出：**\n\n| Value\
    \ of i is 1 |\n| Value of i is 2 |\n| Value of i is 3 |\n| Value of i is 4 |\n\
    | Value of i is 5 |\n\n"
- fmt: "\n# 3. FUNCTION DECLARATION, FUNCTION CALL AND FUNCTION DEFINITION\n\n###\
    \ A) a function gets called when the function name is followed by a semicolon\
    \ . for example:\n```c\nInt main (){Argentina();}\n```\n\n### B) a function is\
    \ defined when function name is followed by a pair of braces in which one or more\
    \ statements may be present. for example:\n```c\nVoid argentina(){\n    Statements\
    \ 1;\n    Statements 2;\n    Statements 3;\n}\n```\n\n### C) any function can\
    \ be called from any other function. even `main()` can be called from other function.\
    \ for example:\n```c\n#include<stdio.h>\nVoid message()\nInt main (){\n    Message();\n\
    \    Return0;\n}\nVoid message(){\n    Printf(“\\n can not imagine without c”);\n\
    \    Main();}\n}\n```\n\n### D) A function can be called any number of times.\
    \ For example:\n```c\n#include<stdio.h>\nVoid message(){\n    Message();\n   \
    \ Message();\n    Return0;\n}\nVoid message(){\n    Printf(“\\n jewel thief”);\n\
    }\n```\n\n### E) there are basically two types of functions;\n- **Library function**:\
    \ `printf()`, `scanf()`, etc.\n- **User-defined function**: `argentina()`, `brazil()`,\
    \ etc.\n\n---\n\n## SIMPLE EXAMPLE PROGRAM FOR C FUNCTION\n\n* As you know, functions\
    \ should be declared and defined before calling in a C program.\n* In the below\
    \ program, function `square` is called from `main` function.\n* The value of `m`\
    \ is passed as argument to the function `square`. This value is multiplied by\
    \ itself in this function and multiplied value `p` is returned to main function\
    \ from function `square`.\n\n```c\n#include<stdio.h>\n// function prototype, also\
    \ called function declaration\nfloat square ( float x );                 \n\n\
    // main function, program starts from here\nint main( )\n{\n    float m, n ;\n\
    \    printf ( \"\\nEnter some number for finding square \\n\");\n    scanf ( \"\
    %f\", &m )// function call\n    n = square ( m ) ;                  \n    printf\
    \ ( \"\\nSquare of the given number %f is %f\",m,n );\n}\nfloat square ( float\
    \ x )   // function definition\n{\n    float p ;\n    p = x * x ;\n    return\
    \ ( p ) ;\n}\n```\n\n**OUTPUT:**\n| Enter some number for finding square 2Square\
    \ of the given number 2.000000 is 4.000000 |\n\n---\n\n## using library function:\
    \ Example:\n```c\n#include<stdio.h>\n#include<math.h>\nInt main(){\n    Float\
    \ a=0.5;\n    Float w, x y,z;\n    W=sin(a);\n    X=cos(a);\n    Y=tan(a);\n \
    \   Z=pow(a,2);\n    Printf(“\\n%f%f%f%f”,w,x,y,z);\n    Return0;\n}\n```\n\n\
    ---\n\n## advanced features of function:\na) Return type of function\nb) Calling\
    \ function by value or by reference\nc) Recursion\n\n### Return type of function:\n\
    ```c\n#include<stdio.h>\nFloat square (float);\nInt main(){\n    Float a,b;\n\
    \    Printf(“\\n enter any number”);\n    Scanf(“\\n%f”,&a);\n    B= square(a);\n\
    \    Printf(“\\n square of %f is %f”, a,b);\n    Return 0;\n}\nFloat square (float\
    \ x){\n    Float y;\n    Y= x*x;\n    Return(y);\n}\n```\n**Output:**\n- Enter\
    \ any number 3Square of 3 is 9.000000\nEnter any number 1. 5Square of 1.5 is 2.250000\n\
    Enter any number 2.5Square of 2.5 is 6.250000\n\n---\n\n## CALL BY VALUE\n\n*\
    \ In call by value method, the value of the variable is passed to the function\
    \ as parameter.\n* The value of the actual parameter can not be modified by formal\
    \ parameter.\n* Different Memory is allocated for both actual and formal parameters.\
    \ Because, value of actual parameter is copied to formal parameter.\n\n**Note:**\n\
    * **Actual parameter** – This is the argument which is used in function call.\n\
    * **Formal parameter** – This is the argument which is used in function definition\n\
    \n### EXAMPLE PROGRAM FOR C FUNCTIONS (USING CALL BY VALUE):\n* In this program,\
    \ the values of the variables `m` and `n` are passed to the function `swap`.\n\
    * These values are copied to formal parameters `a` and `b` in `swap` function\
    \ and used.\n\n```c\n#include<stdio.h>\n// function prototype, also called function\
    \ declaration\nvoid swap(int a, int b);             \n\nint main(){\n    int m\
    \ = 22, n = 44;\n    // calling swap function by value\n    printf(\" values before\
    \ swap  m = %d \\nand n = %d\", m, n);\n    swap(m, n);                  \n}\n\
    void swap(int a, int b){\n    int tmp;\n    tmp = a;\n    a = b;\n    b = tmp;\n\
    }\n```\n**OUTPUT:**\n| values before swap m = 22 \\and n = 44 |\n\n---\n\n## 2.\
    \ CALL BY REFERENCE\n\n* In call by reference method, the address of the variable\
    \ is passed to the function as parameter.\n* The value of the actual parameter\
    \ can be modified by formal parameter.\n* No extra memory is allocated for both\
    \ actual and formal parameters.\n\n### EXAMPLE PROGRAM FOR C FUNCTIONS (USING\
    \ CALL BY REFERENCE):\n```c\n#include<stdio.h>\n// function prototype, also called\
    \ function declaration\nvoid swap(int *a, int *b);\nint main(){\n    int m = 22,\
    \ n = 44;\n    // calling swap function by reference\n    printf(\" values before\
    \ swap  m = %d \\nand n = %d\", m, n);\n    swap(&m, &n);                  \n\
    }\nvoid swap(int *a, int *b){\n    int tmp;\n    tmp = *a;\n    *a = *b;\n   \
    \ *b = tmp;\n}\n```\n**OUTPUT:**\n| values before swap m = 22 \\and n = 44 |\n\
    | values after swap m = 44 and n = 22 |\n\n---\n\n## 3. Recursion\n\nIn, c it\
    \ is possible for the functions to call themselves. A function is called recursive,\
    \ if statements within the body of function calls the same function. Following\
    \ are the recursive version of functions to calculate the factorial.\n\n```c\n\
    #include<stdio.h>\nInt main(){\n    Float a,fact;\n    Printf(“\\ enter any value”);\n\
    \    Scanf(“%d”,a);\n    Fact=rec(a);\n    Printf(“\\n factorial value= %d”,fact);\n\
    \    Return0;\n}\nInt rec (int x){\n    Float f;\n    If(x==1)\n    Return(1);\n\
    \    ElseF=x*rec(x-1);\n    Return (f);\n}\n```\n**Output:**\n- Enter any number\
    \ 1 1\n- Enter any number 2Factorial value =2\n- Enter any number 3Factorial value\
    \ =3\n- Enter any number 5Factorial value =120\n"
