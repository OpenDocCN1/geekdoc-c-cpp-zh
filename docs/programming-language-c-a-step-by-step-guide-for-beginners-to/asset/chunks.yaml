    \ reads the entire source code of the program and converts it into binary code.\
    \ This process is called compilation. Binary code is also referred as machine\
    \ code, executable, and object code. | Interpreter reads the program source code\
    \ one line at a time and executing that line. This process is called interpretation.\
    \ |\n| Program speed is fast. | Program speed is slow. |\n| One time execution.\
    \ Example: C, C++ | Interpretation occurs at every line of the program. Example:\
    \ BASIC |\n\n## Macro Expansion\n\n### Example: \n```c\n#include<stdio.h>\n#define\
    \ UPPER 25\nint main((){\n    int i;\n    for(i=1;i<=UPPER;i++)\n        printf(\"\
    %d\\n\");\n    return 0;\n}\n```\nThis statement is called macro definition or\
    \ more commonly, just a ‘macro’, what purpose does it serve? during preprocessing\
    \ replaces every occurrence of `UPPER` in the program with `25`.\n\n### Macros\
    \ with arguments\nthe macros that we have used so far are called simple macros.\
    \ macros can have arguments, just as functioncan. here is an example:\n```c\n\
    #include<stdio.h>\n#define AREA(x) (3.14*x*x)\nint main(){\n    float ri =60,r2=2.5,a;\n\
    \    a=AREA(r1);\n    printf(\"AREA of circle=%f\\n\",a);\n    a=AREA(r2);\n \
    \   printf(\" AREA of circle=%f\\n\",a);\n    return 0;\n}\n```\n**OUTPUT:**\n\
    Area of circle=1220.656250\nArea of circle= 19.625000\n\n**NOTE:**\n- **A)** Be\
    \ careful not to leave a blank between the macro template and its argument while\
    \ definning the macroexample: there should be no blank between `area` and `(x)`\
    \ in the definition , `#define AREA(x) (3.14*x*x)`\n- **B)** The entire macro\
    \ expansion should be enclosed within parentheses.\n- **C)** Macros can be split\
    \ into multiple lines, with a ‘\\’(back slash) present at the end of each line.\n\
    - **D)** If for any reason, you are unable to debug a macro, then you should view\
    \ the expanded code of the program to see how the macros are getting expanded.\n\
    \n## File Inclusion\n\nthe second preprocessor directive we will explore in this\
    \ chapter is file inclusion. this directives causes one file to be included in\
    \ another.\n`#include\"filename\"`\n\n### When and why this feature is used?\n\
    it can be used in two cases:\n- **A)** It is a good programming practice to keep\
    \ diffrent sections of a large program separate. these files are #included at\
    \ the beginning of main program file.\n- **B)** There are some functions and some\
    \ macro definitions that we need almost in all programs we write. these commonly\
    \ needed functions and macro definitions can be stored in a file, and that can\
    \ be included in every program we write.\n- **C)** When creating our own library\
    \ of functions which we wish to distribute to others. in this situation the functions\
    \ are defined in a ”.c” file and their corresponding prototype declarations and\
    \ macros are declared in a “.h” file.\n\n## Conditional Compilation\n\n### EXAMPLE\
    \ PROGRAM FOR #DEFINE, #INCLUDE PREPROCESSORS IN C LANGUAGE:\n\n- `#define` –\
    \ This macro defines constant value and can be any of the basic data types.\n\
    - `#include <file_name>` – The source code of the file “file_name” is included\
    \ in the main C program where `#include <file_name>` is mentioned.\n\n```c\n#include\
    \ <stdio.h>\n#define height 100\n#define number 3.14\n#define letter 'A'\n#define\
    \ letter_sequence \"ABC\"\n#define backslash_char '\\?'\nvoid main(){\n    printf(\"\
    value of height     : %d \\n\", height );\n    printf(\"value of number : %f \\\
    n\", number );\n    printf(\"value of letter : %c \\n\", letter );\n    printf(\"\
    value of letter_sequence : %s \\n\", letter_sequence);\n    printf(\"value of\
    \ backslash_char  : %c \\n\", backslash_char);\n}\n```\n**OUTPUT:**\n| value of\
    \ height : 100 | value of number : 3.140000 | value of letter : A | value of letter_sequence\
    \ : ABC | value of backslash_char : ? |\n\n### EXAMPLE PROGRAM FOR CONDITIONAL\
    \ COMPILATION DIRECTIVES:\n\n#### A) EXAMPLE PROGRAM FOR #IFDEF, #ELSE AND #ENDIF\
    \ IN C:\n\n- “#ifdef” directive checks whether particular macro is defined or\
    \ not. If it is defined, “If” clause statements are included in source file.\n\
    - Otherwise, “else” clause statements are included in source file for compilation\
    \ and execution.\n\n```c\n#include <stdio.h>\n#define RAJU 100\nint main(){\n\
    #ifdef RAJU\n    printf(\"RAJU is defined. So, this line will be added in \" \\\
    \"this C file\\n\");\n#else\n    printf(\"RAJU is not defined\\n\");\n#endif\n\
    \    return 0;\n}\n```\n**OUTPUT:**\n| RAJU is defined. So, this line will be\
    \ added in this C file |\n\n#### EXAMPLE PROGRAM FOR #IFNDEF AND #ENDIF IN C:\n\
    \n- `#ifndef` exactly acts as reverse as `#ifdef` directive. If particular macro\
    \ is not defined, “If” clause statements are included in source file.\n- Otherwise,\
    \ else clause statements are included in source file for compilation and execution.\n\
    \n```c\n#include <stdio.h>\n#define ROHIT 100\nint main(){\n#ifndef SELVA\n  \
    \  printf(\"SELVA is not defined. So, now we are going to \" \\\"define here\"\
    );\n#endif\n    return 0;\n}\n```\n**OUTPUT:**\n| SELVA is not defined. So, now\
    \ we are going to define here |\n\n### EXAMPLE PROGRAM FOR #IF, #ELSE AND #ENDIF\
    \ IN C:\n\n- “#if” directive checks whether particular macro is defined or not.\
    \ If it is defined, “If” clause statements are included in source file.\n- Otherwise,\
    \ “else” clause statements are included in source file for compilation and execution.\n\
    \n```c\n#include <stdio.h>\n#define RAJU 100\nint main(){\n#ifdef RAJU\n    printf(\"\
    RAJU is defined. So, this line will be added in \" \\\"this C file\\n\");\n#else\n\
    \    printf(\"RAJU is not defined\\n\");\n#endif\n    return 0;\n}\n```\n**OUTPUT:**\n\
    | RAJU is defined. So, this line will be added in this C file |\n\n## Miscellaneous\
    \ Directive\n\n### A) #undef\nOn some occasions, it may be desirable to cause\
    \ a defined name to become ‘undefined’. This can be accomplished means of `#undef`\
    \ directive.\n\nEXAMPLE PROGRAM FOR UNDEF IN C:\n```c\n#include <stdio.h>\n#define\
    \ height 100\nvoid main(){\n    printf(\"First defined value for height :%d\\\
    n\",height);\n    #undef height\n    // redefining the same for new value\n  \
    \  #define height 600\n    printf(\"value of height after redefine:%d\",height);\n\
    }\n```\n**OUTPUT:**\nFirst defined value for height :100\nWait, checking logic\
    \ above.\n\n### B) #pragma\nThis directive is another special purpose directive\
    \ that you can use to turn on or off certain features. Plasmas vary from one compiler\
    \ to one.\n\n- **a) #pragma startup and #pragma exit**: These directives allow\
    \ us to specify functions that are called upon program startup ( before main()\
    \ ) or program exit ( just before the program terminates).\n- **b) #pragma warn**:on\
    \ compilation the compiler reports errors and warning in the program\n\nEXAMPLE\
    \ PROGRAM FOR PRAGMA IN C LANGUAGE:\n```c\n#include <stdio.h>\nvoid function1(\
    \ );\nvoid function2( );\n#pragma startup function1\n#pragma exit function2\n\
    int main( ){\n    printf ( \"\\n Now we are in main function\" ) ;\n    return\
    \ 0;\n}\nvoid function1( ){\n    printf(\"\\nFunction1 is called before main function\"\
    );\n}\nvoid function2( ){\n    printf ( \"\\nFunction2 is called just before end\
    \ of \" \\\"main function\" ) ;\n}\n```\n**OUTPUT:**\nFunction1 is called before\
    \ main function\nNow we are in main function\nFunction2 is called just before\
    \ end of main function\n\n## File Handling\n\nWHAT IS FILE?\nFile is a collection\
    \ of bytes that is stored on secondary storage devices like disk. There are two\
    \ kinds of files in a system. They are,\n\n1.  Text files (ASCII)\n2.  Binary\
    \ files\n\n*   Text files contain ASCII codes of digits, alphabetic and symbols.\n\
    *   Binary file contains collection of bytes (0’s and 1’s). Binary files are compiled\
    \ version of text files .\n\nBASIC FILE OPERATIONS IN C PROGRAMMING:\nThere are\
    \ 4�basic operations that can be performed on any�files in C programming language.\
    \ They are,\n\n1.  Opening/Creating a file\n2.  Closing a file\n3.  Reading a\
    \ file\n4.  Writing in a file\n"
