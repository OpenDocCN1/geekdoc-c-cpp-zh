    | 1234567891011121314151617181920212223 | #include <stdio.h>int main (){FILE *fp;int
    i=1, j=2, k=3, num;fp = fopen ("test.c","w");putw(i,fp);putw(j,fp);putw(k,fp);fclose(fp);fp
    = fopen ("test.c","r");while(getw(fp)!=EOF){num= getw(fp);printf(“Data in test.c
    file is %d \n”, num);}fclose(fp);return 0;} |


    OUTPUT:


    | Data in test.c file is 1


    2


    3 |


    EXAMPLE PROGRAM FOR FGETC() FUNCTION IN C PROGRAMMING LANGUAGE:This file handling
    C program illustrates how to read the contents of a file. Assume that, a file
    called “test.c” contains the following data “Hi, How are you?”. Let’s read this
    data using following C program using fgetc() function .


    | 1234567891011121314151617181920212223242526 | /* Open, Read and close a file:
    Reading char by char */# include <stdio.h>int main( ){FILE *fp ;char c ;printf(
    "Opening the file test.c in read mode" ) ;fp = fopen ( "test.c", "r" ) ; // opening
    an existing fileif ( fp == NULL ){printf ( "Could not open file test.c" ) ;return
    1;}printf( "Reading the file test.c" ) ;while ( 1 ){c = fgetc ( fp ) ; // reading
    the fileif ( c == EOF )break ;printf ( "%c", c ) ;}printf("Closing the file test.c")
    ;fclose ( fp ) ; // Closing the filereturn 0;} |


    OUTPUT:


    | Opening the file test.c in read modeReading the file test.cHi, How are you?Closing
    the file test.c |


    OTHER INBUILT FILE HANDLING FUNCTIONS IN C PROGRAMMING LANGUAGE:C programming
    language offers many other inbuilt functions for handling files. They are given
    below. Please click on each function name below to know more details, example
    programs, output for the respective file handling function.C – Typedef, C – UnionEXAMPLE
    PROGRAM FOR C TYPEDEF:


    | 1234567891011121314151617181920212223 | // Structure using typedef:#include
    <stdio.h>#include <string.h>typedef struct student{int id;char name[20];float
    percentage;} status;int main(){status record;record.id=1;strcpy(record.name, "Binod");record.percentage
    = 86.5;printf(" Id is: %d \n", record.id);printf(" Name is: %s \n", record.name);printf("
    Percentage is: %f \n", record.percentage);return 0;} |


    OUTPUT:


    | Id is: 1 Name is: Binod


    Percentage is: 86.500000 |


    *   Typedef can be used to simplify the real commands as per our need.


    *   For example, consider below statement.


    typedef long long int LLI;


    *   In above statement, LLI is the type definition for the real C command “long
    long int”. We can use type definition LLI instead of using full command “long
    long int” in a C program once it is defined.


    ANOTHER EXAMPLE PROGRAM FOR C TYPEDEF :


    | 123456789101112 | #include <stdio.h>#include <limits.h>int main(){typedef long
    long int LLI;printf("Storage size for long long int data " \"type  : %ld \n",
    sizeof(LLI));return 0;} |


    OUTPUT:


    | Storage size for long long int data type : 8 |


    C – Union


    *   Union and structure in C  are same in concepts, except allocating memory for
    their members.


    *   Structure allocates storage space for all its members separately.


    *   Whereas, Union allocates one common storage space for all its members


    *   We can access only one member of union at a time. We can’t access all member
    values at the same time in union. But, structure can access all member values
    at the same time. This is because, Union allocates one common storage space for
    all its members. Wher e  as Structure allocates storage space for all its members
    separately.


    *   Many union variables can be created in a program and memory will be allocated
    for each union variable separately.


    *   Below table will help you how to form a C union, declare a union, initializing
    and accessing the members of the union.


    EXAMPLE PROGRAM FOR C UNION:


    | 12345678910111213141516171819202122232425262728293031323334353637 | #include
    <stdio.h>#include <string.h>union student{char name[20];char subject[20];float
    percentage;};int main(){union student record1;union student record2;// assigning
    values to record1 union variablestrcpy(record1.name, "Amir");strcpy(record1.subject,
    "Maths");record1.percentage = 86.50;printf("Union record1 values example\n");printf("
    Name       : %s \n", record1.name);printf(" Subject    : %s \n", record1.subject);printf("
    Percentage : %f \n\n", record1.percentage);// assigning values to record2 union
    variableprintf("Union record2 values example\n");strcpy(record2.name, "Mani");printf("
    Name       : %s \n", record2.name);strcpy(record2.subject, "Physics");printf("
    Subject    : %s \n", record2.subject);record2.percentage = 99.50;printf(" Percentage
    : %f \n", record2.percentage);return 0;} |


    OUTPUT:


    | Union record1 values example Name : Amir


    Subject : Maths


    Percentage : 86.500000;


    Union record2 values example


    Name : Mani


    Subject : Physics


    Percentage : 99.500000 |


    EXPLANATION FOR ABOVE C UNION PROGRAM:Record1 union variable:


    *   “Amir” is assigned to union member “record1.name” . The memory location name
    is “record1.name” and the value stored in this location is “Amir”.'
