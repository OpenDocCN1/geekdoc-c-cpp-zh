  trans: "\n\n| CPU 的当前状态保存在栈内存中 | 链表是使用堆内存的一个示例。 |\n\n# 你知道 C 语言中编译器与解释器之间的区别吗？\n\
    \n| 编译器 (Compilers) | 解释器 (Interpreters) |\n| :--- | :--- |\n| 编译器读取程序的完整源代码并转换为二进制代码。这个过程被称为编译。二进制代码也被机器码、可执行文件和对象代码。\
    \ | 解释器逐一行读取程序源代码并执行该行。这个过程被称为解释。 |\n| 程序运行速度快。 | 程序运行速度慢。 |\n| 执行一次。例如：C, C++\
    \ | 解释发生在程序的每一行。例如：BASIC |\n\n## 宏展开 (Macro Expansion)\n\n### 示例：\n```c\n#include<stdio.h>\n\
    #define UPPER 25\nint main((){\n    int i;\n    for(i=1;i<=UPPER;i++)\n      \
    \  printf(\"%d\\n\");\n    return 0;\n}\n```\n这条语句被称为宏定义，或者通称为“宏”，它的作用是什么？在预处理期间，它会将程序中每个\
    \ `UPPER` 出现的地方替换为 `25`。\n\n### 带参数的宏\n我们目前为止使用的宏被称为简单宏。宏可以有参数，就像函数可以一样。这里有一个示例：\n\
    ```c\n#include<stdio.h>\n#define AREA(x) (3.14*x*x)\nint main(){\n    float ri\
    \ =60,r2=2.5,a;\n    a=AREA(r1);\n    printf(\"AREA of circle=%f\\n\",a);\n  \
    \  a=AREA(r2);\n    printf(\" AREA of circle=%f\\n\",a);\n    return 0;\n}\n```\n\
    **输出：**\nArea of circle=1220.656250\nArea of circle= 19.625000\n\n**注意：**\n- **A)**\
    \ 在定义宏时，注意不要在宏模板和它的参数之间留空格，例如：在定义中 `area` 和 `(x)` 之间不应有空格，`#define AREA(x) (3.14*x*x)`\n\
    - **B)** 整个宏展开应该包含在括号内。\n- **C)** 宏可以分成多行，在每行的末尾有一个反斜杠 `\\` `。\n- **D)** 如果由于任何原因，你无法调试宏，那么你应该查看程序的展开代码，以查看宏是如何被展开的。\n\
    \n## 文件包含 (File Inclusion)\n\n我们在本章中将探索的第二个预处理器指令是文件包含。该指令导致一个文件被包含在另一个文件中。\n\
    `#include\"filename\"`\n\n### 何时以及为什么要使用此功能？\n它可以用于以下两种情况：\n- **A)** 将大型程序的不同部分分开是一项良好的编程习惯。这些文件在主程序文件的开头被\
    \ `#included`。\n- **B)** 有些函数和某些宏定义，在我们编写的几乎每个程序中都需要它们。这些常用的函数和宏定义可以存储在一个文件中，并包含在我们编写的每个程序。\n\
    - **C)** 当我们创建想要分发给他人的函数库时。在这种情况下，函数定义在 “.c” 文件中，相应的原型声明和宏定义在 “.h” 文件中声明。\n\n\
    ## 条件编译 (Conditional Compilation)\n\n### C 语言中 #DEFINE, #INCLUDE 预处理器的示例程序：\n\n\
    - `#define` – 此宏定义常量值，并可以是任何基本数据类型之一。\n- `#include <file_name>` – 文件“file_name”的源代码被包含在提到\
    \ `#include <file_name>` 的主 C 程序中。\n\n```c\n#include <stdio.h>\n#define height\
    \ 100\n#define number 3.14\n#define letter 'A'\n#define letter_sequence \"ABC\"\
    \n#define backslash_char '\\?'\nvoid main(){\n    printf(\"value of height   \
    \  : %d \\n\", height );\n    printf(\"value of number : %f \\n\", number );\n\
    \    printf(\"value of letter : %c \\n\", letter );\n    printf(\"value of letter_sequence\
    \ : %s \\n\", letter_sequence);\n    printf(\"value of backslash_char  : %c \\\
    n\", backslash_char);\n}\n```\n**输出：**\n| value of height : 100 | value of number\
    \ : 3.140000 | value of letter : A | value of letter_sequence : ABC | value of\
    \ backslash_char : ? |\n\n### 条件编译指令的示例程序：\n\n#### A) C 语言中 #IFDEF, #ELSE 和 #ENDIF\
    \ 的示例程序：\n\n- “#ifdef” 指令检查特定宏是否已定义。如果已定义，则“If”句语句包含在源文件中。\n- 否则，“else”句语句被包含在源文件中进行编译和执行。\n\
    \n```c\n#include <stdio.h>\n#define RAJU 100\nint main(){\n#ifdef RAJU\n    printf(\"\
    RAJU is defined. So, this line will be added in \" \\\"this C file\\n\");\n#else\n\
    \    printf(\"RAJU is not defined\\n\");\n#endif\n    return 0;\n}\n```\n**输出：**\n\
    | RAJU is defined. So, this line will be added in this C file |\n\n#### C 语言中\
    \ #IFNDEF 和 #ENDIF 的示例程序：\n\n- `#ifndef` 的作用恰好与 `#ifdef` 指令相反。如果特定宏未定义，则“If”句语句包含在源文件中。\n\
    - 否则，“else”句语句被包含在源文件中进行编译和执行。\n\n```c\n#include <stdio.h>\n#define ROHIT 100\n\
    int main(){\n#ifndef SELVA\n    printf(\"SELVA is not defined. So, now we are\
    \ going to \" \\\"define here\");\n#endif\n    return 0;\n}\n```\n**输出：**\n| SELVA\
    \ is not defined. So, now we are going to define here |\n\n### C 语言中 #IF, #ELSE\
    \ AND #ENDIF 的示例程序：\n\n- “#if” 指令检查特定宏是否已定义。如果已定义，则“If”句语句包含在源文件中。\n- 否则，“else”句语句被包含在源文件中进行编译和执行。\n\
    \n```c\n#include <stdio.h>\n#define RAJU 100\nint main(){\n#ifdef RAJU\n    printf(\"\
    RAJU is defined. So, this line will be added in \" \\\"this C file\\n\");\n#else\n\
    \    printf(\"RAJU is not defined\\n\");\n#endif\n    return 0;\n}\n```\n（注：此处原文代码中误用了\
    \ #ifdef 而非 #if，翻译保留原样逻辑）\n\n## 杂项指令 (Miscellaneous Directive)\n\n### A) #undef\n\
    在某些情况下，可能希望一个定义的名称变为“未定义”。这可以通过 `#undef` 指令来实现。\n\nC 语言中 UNDEF 的示例程序：\n```c\n\
    #include <stdio.h>\n#define height 100\nvoid main(){\n    printf(\"First defined\
    \ value for height :%d\\n\",height);\n    #undef height\n    //重新定义值\n    #define\
    \ height 600\n    printf(\"value of height after redefine:\",height);\n}\n```\n\
    **输出：**\n（注：此处逻辑输出结果）\n\n### B) #pragma\n这是另一个特殊目的指令，你可以用它开启或关闭某些功能。Pragma 随编译器而异。\n\
    \n- **a) #pragma startup 和 #pragma exit**: 这些指令允许我们指定在程序启动（main() 之前）或程序退出（程序终止之前）调用的函数。\n\
    - **b) #pragma warn**:编译时编译器报告程序中的错误和警告。\n\nC 语言中 PRAGMA 的示例程序：\n```c\n#include\
    \ <stdio.h>\nvoid function1( );\nvoid function2( );\n#pragma startup function1\n\
    #pragma exit function2\nint main( ){\n    printf ( \"\\n Now we are in main function\"\
    \ ) ;\n    return 0;\n}\nvoid function1( ){\n    printf(\"\\nFunction1 is called\
    \ before main function\");\n}\nvoid function2( ){\n    printf ( \"\\nFunction2\
    \ is called just before end of \" \\\"main function\" ) ;\n}\n```\n\n## 文件处理 (File\
    \ Handling)\n\n什么是文件 (FILE)?\n文件是存储在磁盘等辅助存储设备上的字节集合。系统中有两种文件。它们是，\n\n1.  文本文件\
    \ (ASCII)\n2.  二进制文件\n\n*   文本文件包含数字、字母和符号的 ASCII 码。\n*   二进制文件包含字节集合（0 和 1）。二进制文件是文本文件的编译后版本。\n\
    \nC 编程中的基本文件操作：\n在 C 编程语言中，可以对任何文件执行 4 种基本操作。它们是，\n\n1.  打开/创建文件\n2.  关闭文件\n3.\
    \  读取文件\n4.  向文件中写入\n\n"
- fmt: "\n# MODE OF OPERATIONS PERFORMED ON A FILE IN C LANGUAGE\n\nThere are many\
    \ modes in opening a file. Based on the mode of file, it can be opened for reading\
    \ or writing or appending the texts. They are listed below.\n\n## EXAMPLE PROGRAM\
    \ FOR FILE OPEN, FILE WRITE AND FILE CLOSE IN C LANGUAGE\n\n```c\n/* * Open, write\
    \ and close a file : */\n# include <stdio.h>\n#include <string.h>\nint main( ){\n\
    \    FILE *fp ;\n    char data[50];\n    // opening an existing file\n    printf(\
    \ \"Opening the file test.c in write mode\" ) ;\n    fp = fopen(\"test.c\", \"\
    w\") ;\n    if ( fp == NULL ){\n        printf( \"Could not open file test.c\"\
    \ )\n        return 1;\n    }\n    printf( \"\\n Enter some text from keyboard\
    \ to write in the file test.c\" ) ;\n    // getting input from user\n    while\
    \ ( strlen ( gets( data ) ) > 0 ){\n        // writing in the file\n        fputs(data,\
    \ fp) ;\n        fputs(\"\\n\", fp) ;\n    }\n    // closing the file\n    printf(\"\
    Closing the file test.c\") ;\n    fclose(fp) ;\n    return 0;\n}\n```\n\n**OUTPUT:**\n\
    ```\nOpening the file test.c in write mode\nEnter some text from keyboard to write\
    \ in the file test.c\nHai, How are you?\nClosing the file test.c\n```\n\n## EXAMPLE\
    \ PROGRAM FOR FILE OPEN, FILE READ AND FILE CLOSE IN C LANGUAGE\n\nThis file handling\
    \ C program illustrates how to read the contents of a file. Assume that, a file\
    \ called “test.c” contains the following data “Hai, How are you?”. Let’s read\
    \ this data using following C program .\n\n```c\n/* Open, Read and close a file:\
    \ reading string by string */\n# include <stdio.h>\nint main( ){\n    FILE *fp\
    \ ;\n    char data[50] ;\n    printf( \"Opening the file test.c in read mode\"\
    \ ) ;\n    fp = fopen( \"test.c\", \"r\" ) ;\n    if ( fp == NULL ){\n       \
    \ printf( \"Could not open file test.c\" )\n        return 1;\n    }\n    printf(\
    \ \"Reading the file test.c\" ) ;\n    while( fgets ( data, 50, fp ) != NULL )\n\
    \        printf( \"%s\" , data ) ;\n    printf(\"Closing the file test.c\") ;\n\
    \    fclose(fp) ;\n    return 0;\n}\n```\n\n**OUTPUT:**\n```\nOpening the file\
    \ test.c in read mode\nReading the file test.c\nHai, How are you?\nClosing the\
    \ file test.c\n```\n\n## EXAMPLE PROGRAM FOR FOPEN(), FCLOSE(), GETS() AND FPUTS()\
    \ FUNCTIONS IN C PROGRAMMING LANGUAGE\n\n```c\n/* * Open, write and close a file\
    \ : */\n# include <stdio.h>\n#include <string.h>\nint main( ){\n    FILE *fp ;\n\
    \    char data[50];\n    // opening an existing file\n    printf( \"Opening the\
    \ file test.c in write mode\" ) ;\n    fp = fopen(\"test.c\", \"w\") ;\n    if\
    \ ( fp == NULL ){\n        printf( \"Could not open file test.c\" )\n        return\
    \ 1;\n    }\n    printf( \"\\n Enter some text from keyboard to write in the file\
    \ test.c\" ) ;\n    // getting input from user\n    while ( strlen ( gets( data\
    \ ) ) > 0 ){\n        // writing in the file\n        fputs(data, fp) ;\n    \
    \    fputs(\"\\n\", fp) ;\n    }\n    // closing the file\n    printf(\"Closing\
    \ the file test.c\") ;\n    fclose(fp) ;\n    return 0;\n}\n```\n\n**OUTPUT:**\n\
    ```\nOpening the file test.c in write mode\nEnter some text from keyboard to write\
    \ in the file test.c\nHai, How are you?\nClosing the file test.c\n```\n\n## EXAMPLE\
    \ PROGRAM FOR PUTW(), GETW() FUNCTION IN C PROGRAMMING LANGUAGE\n\nThis file handling\
    \ C program illustrates how to write into a file using `putw()` function and how\
    \ to read the same file using `getw()` function.\n\n```c\n#include <stdio.h>\n\
    int main (){\n    FILE *fp;\n    int i=1, j=2, k=3, num;\n    fp = fopen (\"test.c\"\
    ,\"w\");\n    putw(i,fp);\n    putw(j,fp);\n    putw(k,fp);\n    fclose(fp);\n\
    \    fp = fopen (\"test.c\",\"r\");\n    while(getw(fp)!=EOF){\n        num= getw(fp);\n\
    \        printf(“Data in test.c file is %d \\n”, num);\n    }\n    fclose(fp);\n\
    \    return 0;\n}\n```\n\n**OUTPUT:**\n```\nData in test.c file is 1\n2\n3\n```\n\
    \n## EXAMPLE PROGRAM FOR FGETC() FUNCTION IN C PROGRAMMING LANGUAGE\n\nThis file\
    \ handling C program illustrates how to read the contents of a file. Assume that,\
    \ a file called “test.c” contains the following data “Hi, How are you?”. Let’s\
    \ read this data using following C program using `fgetc()` function .\n\n```c\n\
    /* Open, Read and close a file: reading string by string */\n# include <stdio.h>\n\
    int main( ){\n    FILE *fp ;\n    char data[50];\n    printf( \"Opening the file\
    \ test.c in read mode\" ) ;\n    fp = fopen( \"test.c\", \"r\" ) ;\n    if ( fp\
    \ == NULL ){\n        printf( \"Could not open file test.c\" )\n        return\
    \ 1;\n    }\n    printf( \"Reading the file test.c\" ) ;\n    while( fgets ( data,\
    \ 50, fp ) != NULL )\n        printf( \"%s\" , data ) ;\n    printf(\"Closing\
    \ the file test.c\") ;\n    fclose(fp) ;\n    return 0;\n}\n```\n\n**OUTPUT:**\n\
    ```\nOpening the file test.c in read mode\nReading the file test.c\nHi, How are\
    \ you?\nClosing the file test.c\n```\n\n## OTHER BUILT FILE FUNCTIONS IN C\n\n\
    C programming offers many other inbuilt functions for handling. They are given\
    \ below.\n\n### EXAMPLE PROGRAM FOR TYPEDEF\n\n```c\n#include <stdio.h>\n#include\
    \ <string.h>\ntypedef struct {\n    int id;\n    char name[20];\n    float percentage;\n\
    } status;\nint main(){\n    status record;\n    record.id=1;\n    strcpy(record.name,\
    \ \"Binod\");\n    record.percentage=86.5;\n    printf(\"Id: %d \\n\", record.id);\n\
    \    printf(\"Name: %s \\n\", record.name);\n    printf(\"Percentage: %f \\n\"\
    , record.percentage);\n    return 0;\n}\n```\n\n**OUTPUT:**\n```\nId: 1\nName:\
    \ Binod\nPercentage: 86.500000\n```\n\n### ANOTHER EXAMPLE PROGRAM FOR C TYEDEF\n\
    \n```c\n#include <stdio.h>\n#include <limits.h>\nint main()\n    long long LLI;\n\
    \    printf(\"Storage size: %ld \\n\", sizeof(LLI));\n    return 0;\n}\n```\n\n\
    **OUTPUT:**\n```\nStorage size: 8\n```\n\n## UNION VS STRUCTURE\n\n*   Union and\
    \ structure are same except memory allocation.\n*   Structure allocates space\
    \ for all members separately.\n*   Whereas, Union allocates only one member of\
    \ union at a time. Structure can access all member values.\n\n### EXAMPLE PROGRAM\
    \ FOR C UNION\n\n```c\n#include <stdio.h>\n#include <string.h>\nunion student\
    \ {\n    char name[20];\n    char subject[20];\n    float percentage;\n};\nint\
    \ main(){\n    union student record1;\n    union student record2;\n    // assigning\
    \ values to record1 union\n    strcpy(record1.name, \"Amir\");\n    strcpy(record1.subject,\
    \ \"Maths\");\n    record1.percentage = 86.50;\n    printf(\"Union record1 example\\\
    n\");\n    printf(\" Name: %s \\n\", record1.name);\n    printf(\" Subject: %s\
    \ \\n\", record1.subject);\n    printf(\" Percentage: %f \\n\", record1.percentage);\n\
    \n    // assigning values to record2 union\n    printf(\"Union record2 example\\\
    n\");\n    strcpy(record2.name, \"Mani\");\n    printf(\" Name: %s \\n\", record2.name);\n\
    \    strcpy(record2.subject, \"Physics\");\n    record2.percentage = 99.50;\n\
    \    printf(\" Percentage: %f \\n\", record2.percentage);\n    return 0;\n}\n\
    ```\n\n**EXPLANATION FOR ABOVE C UNION PROGRAM:**\nRecord1 union variable:\n\n\
    *   “Amir” is assigned to union member `record1.name` . The memory location name\
    \ is `record1.name` and the value stored in this location is “Amir”.\n"
