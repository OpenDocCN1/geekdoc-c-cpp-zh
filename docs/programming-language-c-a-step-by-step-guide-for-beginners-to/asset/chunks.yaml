    File HandlingWHAT IS FILE?File is a collection of bytes that is stored on secondary
    storage devices like disk. There are two kinds of files in a system. They are,


    1.  Text files (ASCII)


    2.  Binary files


    *   Text files contain ASCII codes of digits, alphabetic and symbols.


    *   Binary file contains collection of bytes (0’s and 1’s). Binary files are compiled
    version of text files .


    BASIC FILE OPERATIONS IN C PROGRAMMING:There are 4 basic operations that can be
    performed on any files in C programming language. They are,


    1.  Opening/Creating a file


    2.  Closing a file


    3.  Reading a file


    4.  Writing in a file'
