  trans: "\n\n# C 语言中对文件执行的操作模式\n\n打开文件有很多模式。根据文件的模式，可以以读取、写入或追加文本的方式打开。它们列举如下。\n\n\
    ## C 语言打开文件、写入文件和关闭文件的示例程序\n\n```c\n/* * Open, write and close a file : */\n#\
    \ include <stdio.h>\n#include <string.h>\nint main( ){\n    FILE *fp ;\n    char\
    \ data[50];\n    // opening an existing file\n    printf( \"Opening the file test.c\
    \ in write mode\" ) ;\n    fp = fopen(\"test.c\", \"w\") ;\n    if ( fp == NULL\
    \ ){\n        printf( \"Could not open file test.c\" )\n        return 1;\n  \
    \  }\n    printf( \"\\n Enter some text from keyboard to write in the file test.c\"\
    \ ) ;\n    // getting input from user\n    while ( strlen ( gets( data ) ) > 0\
    \ ){\n        // writing in the file\n        fputs(data, fp) ;\n        fputs(\"\
    \\n\", fp) ;\n    }\n    // closing the file\n    printf(\"Closing the file test.c\"\
    ) ;\n    fclose(fp) ;\n    return 0;\n}\n```\n\n**输出:**\n```\nOpening the file\
    \ test.c in write mode\nEnter some text from keyboard to write in the file test.c\n\
    Hai, How are you?\nClosing the file test.c\n```\n\n## C 语言打开文件、读取文件和关闭文件的示例程序\n\
    \n这个文件处理 C 语言程序说明了如何读取文件内容。假设一个名为“test.c”的文件包含以下数据“Hai, How are you?”。让我们使用下面的\
    \ C 程序读取这些数据。\n\n```c\n/* Open, Read and close a file: reading string by string\
    \ */\n# include <stdio.h>\nint main( ){\n    FILE *fp ;\n    char data[50] ;\n\
    \    printf( \"Opening the file test.c in read mode\" ) ;\n    fp = fopen( \"\
    test.c\", \"r\" ) ;\n    if ( fp == NULL ){\n        printf( \"Could not open\
    \ file test.c\" )\n        return 1;\n    }\n    printf( \"Reading the file test.c\"\
    \ ) ;\n    while( fgets ( data, 50, fp ) != NULL )\n        printf( \"%s\" , data\
    \ ) ;\n    printf(\"Closing the file test.c\") ;\n    fclose(fp) ;\n    return\
    \ 0;\n}\n```\n\n**输出:**\n```\nOpening the file test.c in read mode\nReading the\
    \ file test.c\nHai, How are you?\nClosing the file test.c\n```\n\n## C 语言编程中 FOPEN(),\
    \ FCLOSE(), GETS() 和 FPUTS() 函数的示例程序\n\n```c\n/* * Open, write and close a file\
    \ : */\n# include <stdio.h>\n#include <string.h>\nint main( ){\n    FILE *fp ;\n\
    \    char data[50];\n    // opening an existing file\n    printf( \"Opening the\
    \ file test.c in write mode\" ) ;\n    fp = fopen(\"test.c\", \"w\") ;\n    if\
    \ ( fp == NULL ){\n        printf( \"Could not open file test.c\" )\n        return\
    \ 1;\n    }\n    printf( \"\\n Enter some text from keyboard to write in the file\
    \ test.c\" ) ;\n    // getting input from user\n    while ( strlen ( gets( data\
    \ ) ) > 0 ){\n        // writing in the file\n        fputs(data, fp) ;\n    \
    \    fputs(\"\\n\", fp) ;\n    }\n    // closing the file\n    printf(\"Closing\
    \ the file test.c\") ;\n    fclose(fp) ;\n    return 0;\n}\n```\n\n**输出:**\n```\n\
    Opening the file test.c in write mode\nEnter some text from keyboard to write\
    \ in the file test.c\nHai, How are you?\nClosing the file test.c\n```\n\n## C\
    \ 语言编程中 PUTW(), GETW() 函数的示例程序\n\n这个文件处理 C 语言程序说明了如何使用 `putw()` 函数写入文件，以及如何使用\
    \ `getw()` 函数读取同一文件。\n\n```c\n#include <stdio.h>\nint main (){\n    FILE *fp;\n\
    \    int i=1, j=2, k=3, num;\n    fp = fopen (\"test.c\",\"w\");\n    putw(i,fp);\n\
    \    putw(j,fp);\n    putw(k,fp);\n    fclose(fp);\n    fp = fopen (\"test.c\"\
    ,\"r\");\n    while(getw(fp)!=EOF){\n        num= getw(fp);\n        printf(“Data\
    \ in test.c file is %d \\n”, num);\n    }\n    fclose(fp);\n    return 0;\n}\n\
    ```\n\n**输出:**\n```\nData in test.c file is 1\n2\n3\n```\n\n## C 语言编程中 FGETC()\
    \ 函数的示例程序\n\n这个文件处理 C 语言程序说明了如何读取文件内容。假设一个名为“test.c”的文件包含以下数据“Hi, How are you?”。让我们使用\
    \ `fgetc()` 函数通过下面的 C 程序读取这些数据。\n\n```c\n/* Open, Read and close a file: reading\
    \ string by string */\n# include <stdio.h>\nint main( ){\n    FILE *fp ;\n   \
    \ char data[50];\n    printf( \"Opening the file test.c in read mode\" ) ;\n \
    \   fp = fopen( \"test.c\", \"r\" ) ;\n    if ( fp == NULL ){\n        printf(\
    \ \"Could not open file test.c\" )\n        return 1;\n    }\n    printf( \"Reading\
    \ the file test.c\" ) ;\n    while( fgets ( data, 50, fp ) != NULL )\n       \
    \ printf( \"%s\" , data ) ;\n    printf(\"Closing the file test.c\") ;\n    fclose(fp)\
    \ ;\n    return 0;\n}\n```\n\n**输出:**\n```\nOpening the file test.c in read mode\n\
    Reading the file test.c\nHi, How are you?\nClosing the file test.c\n```\n\n##\
    \ C 语言其他内置文件函数\n\nC 语言提供了许多其他内置函数用于处理。它们列举如下。\n\n### TYPEDEF 的示例程序\n\n```c\n#include\
    \ <stdio.h>\n#include <string.h>\ntypedef struct {\n    int id;\n    char name[20];\n\
    \    float percentage;\n} status;\nint main(){\n    status record;\n    record.id=1;\n\
    \    strcpy(record.name, \"Binod\");\n    record.percentage=86.5;\n    printf(\"\
    %d \\n\", record.id);\n    printf(\"%s \\n\", record.name);\n    printf(\"%f \\\
    n\", record.percentage);\n    return 0;\n}\n```\n\n**输出:**\n```\n1\nBinod\n86.500000\n\
    ```\n\n### C TYEDEF 的另一个示例程序\n\n```c\n#include <stdio.h>\n#include <limits.h>\n\
    int main() {\n    long long LLI;\n    printf(\"Storage size: %ld \\n\", sizeof(LLI));\n\
    \    return 0;\n}\n```\n\n**输出:**\n```\n8\n```\n\n## 联合体 (UNION) 比 结构体 (STRUCTURE)\n\
    \n*   联合体和结构体的区别在于内存分配。\n*   结构体为所有成员单独分配空间。\n*   而联合体一次只分配一个成员的空间。结构体可以访问所有成员值。\n\
    \n### C 联合体的示例程序\n\n```c\n#include <stdio.h>\n#include <string.h>\nunion student\
    \ {\n    char name[20];\n    char subject[20];\n    float percentage;\n};\nint\
    \ main(){\n    union student record1;\n    union student record2;\n    // 为 record1\
    \ 联合体赋值\n    strcpy(record1.name, \"Amir\");\n    strcpy(record1.subject, \"Maths\"\
    );\n    record1.percentage = 86.50;\n    printf(\"Union record1 example\\n\");\n\
    \    printf(\" Name: %s \\n\", record1.name);\n    printf(\" Subject: %s \\n\"\
    , record1.subject);\n    printf(\" Percentage: %f \\n\", record1.percentage);\n\
    \n    // 为 record2 联合体赋值\n    printf(\"Union record2 example\\n\");\n    strcpy(record2.name,\
    \ \"Mani\");\n    printf(\" Name: %s \\n\", record2.name);\n    strcpy(record2.subject,\
    \ \"Physics\");\n    record2.percentage = 99.50;\n    printf(\" Percentage: %f\
    \ \\n\", record2.percentage);\n    return 0;\n}\n```\n\n**输出:**\n```\nUnion record1\
    \ example\n Name: Amir\n Subject: Maths\n Percentage: 86.500000\nUnion record2\
    \ example\n Name: Mani\n Percentage: 99.500000\n```\n\n**上述 C 联合体程序的解释:**\nRecord1\
    \ 联合体变量：\n\n*   “Amir” 被赋值给联合体成员 `record1.name` 。内存位置名称为 `record1.name`，存储在该位置的值为“Amir”。\n\
    \n"
- fmt: "\n* Then, “Maths” is assigned to union member `record1.subject`. Now, memory\
    \ location name is changed to `record1.subject` with the value “Maths” (Union\
    \ can hold only one member at a time).\n* Then, “86.50” is assigned to union member\
    \ `record1.percentage`. Now, memory location name is changed to `record1.percentage`\
    \ with value “86.50”.\n* Like this, name and value of union member is replaced\
    \ every time on the common storage space.\n* So, we can always access only one\
    \ union member for which value is assigned at last. We can’t access other member\
    \ values.\n* So, only `record1.percentage` value is displayed in output. `record1.name`\
    \ and `record1.percentage` are empty.\n* If we want to access all member values\
    \ using union, we have to access the member before assigning values to other members\
    \ as shown in `record2` union variable in this program.\n* Each union members\
    \ are accessed in `record2` example immediately after assigning values to them.\n\
    * If we don’t access them before assigning values to other member, member name\
    \ and value will be over written by other member as all members are using same\
    \ memory.\n* We can’t access all members in union at same time but structure can\
    \ do that.\n\n### EXAMPLE PROGRAM – ANOTHER WAY OF DECLARING C UNION:\n\n```c\n\
    #include <stdio.h>\n#include <string.h>\nunion student{\n    char name[20];\n\
    \    char subject[20];\n    float percentage;\n}record;\nint main(){\n    strcpy(record.name,\
    \ \"Rajib\");\n    strcpy(record.subject, \"Maths\");\n    record.percentage =\
    \ 86.50;\n    printf(\" Name       : %s \\n\", record.name);\n    printf(\" Subject\
    \    : %s \\n\", record.subject);\n    printf(\" Percentage : %f \\n\", record.percentage);\n\
    \    return 0;\n}\n```\n\n### OUTPUT:\n```\nName :Rajib\nSubject :Maths\nPercentage\
    \ : 86.500000\n```\n\n### NOTE:\n* We can access only one member of union at a\
    \ time. We can’t access all member values at the same time in union.\n* But, structure\
    \ can access all member values at the same time. This is because, `Union` allocates\
    \ one common storage space for all its members. Whereas `Structure` allocates\
    \ storage space for all its members separately.\n\n### DIFFERENCE BETWEEN STRUCTURE\
    \ AND UNION IN C:\n\n| C Structure | C Union |\n| :--- | :--- |\n| Structure allocates\
    \ storage space for all its members separately. | Union allocates one common storage\
    \ space for all its members. Union finds that which of its member needs high storage\
    \ space over other members and allocates that much space |\n| Structure occupies\
    \ higher memory space. | Union occupies lower memory space over structure. |\n\
    | We can access all members of structure at a time. | We can access only one member\
    \ of union at a time. |\n| Structure example: `struct student { int mark; char\
    \ name[6]; double average; };` | Union example: `union student { int mark; char\
    \ name[6]; double average; };` |\n| For above structure, memory allocation will\
    \ be like below. `int mark` – 2B, `char name[6]` – 6B, `double average` – 8B.\
    \ Total memory allocation = 2+6+8 = 16 Bytes | For above union, only 8 bytes of\
    \ memory will be allocated since `double` data type will occupy maximum space\
    \ of memory over other data types. Total memory allocation = 8 |\n\n### About\
    \ The Author\nSusanta Bouri\nM.Tech in computer science\nMaulana Abul Kalam Azad\
    \ University Of Technology,\nwest Bengal,(India)\n"
