    RULES FOR CONSTRUCTING C CONSTANT:1\. INTEGER CONSTANTS IN C:


    *   An integer constant must have at least one digit.


    *   It must not have a decimal point.


    *   It can either be positive or negative.


    *   No commas or blanks are allowed within an integer constant.


    *   If no sign precedes an integer constant, it is assumed to be positive.


    *   The allowable range for integer constants is -32768 to 32767.


    2. REAL CONSTANTS IN C:


    *   A real constant must have at least one digit


    *   It must have a decimal point


    *   It could be either positive or negative


    *   If no sign precedes an integer constant, it is assumed to be positive.


    *   No commas or blanks are allowed within a real constant.


    3. CHARACTER AND STRING CONSTANTS IN C:


    *   A character constant is a single alphabet, a single digit or a single special
    symbol enclosed within single quotes.


    *   The maximum length of a character constant is 1 character.


    *   String constants are  enclosed within double quotes.


    4. BACKSLASH CHARACTER CONSTANTS IN C:


    *   There are some characters which have special meaning in C language.


    *   They should be preceded by backslash symbol to make use of special function
    of them.


    *   Given below is the list of special characters and their purpose.


    | Backslash _ character | Meaning |


    | \b | Backspace |


    | \f | Form feed |


    | \n | New line |


    | \r | Carriage return |


    | \t | Horizontal tab |


    | \” | Double quote |


    | \’ | Single quote |


    | \\ | Backslash |


    | \v | Vertical tab |


    | \a | Alert or bell |


    | \? | Question mark |


    | \N | Octal constant (N is an octal constant) |


    | \XN | Hexadecimal constant (N – hex.dcml cnst) |'
