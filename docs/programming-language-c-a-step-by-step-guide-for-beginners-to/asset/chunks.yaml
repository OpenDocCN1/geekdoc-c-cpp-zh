  trans: "\n\n# 声明结构\n\n示例：\n```c\nExampleStruct book{\n    Char name;\n    Float\
    \ price;\n    Int pages;\n};\n```\n\n**注意：**\na) 结构类型声明中的结束大括号后面必须跟一个分号。\nb) 重要的是，结构类型声明并没有告诉编译器在内存中预留任何空间。结构声明的作用仅仅是定义结构体的形式。\n\
    c) 通常，结构类型声明出现在源代码文件的顶部，在定义任何变量或函数之前。\nd) 如果结构体变量初始化为值 `{0}`，则它的所有元素都被设置为 0。这是初始化结构体变量的一种方便方法。\n\
    \n# 访问结构元素\n\n在声明了结构类型和结构体变量后，让我们看看如何访问结构体的元素。它们使用点 (`.`) 运算符。因此，要引用示例程序中定义的结构\
    \ `pages`，我们必须使用 `B1.pages`。同样地，要引用 `price`，我们将使用 `B1.price`。\n\n## 结构元素是如何存储的\n\
    \n示例：\n```c\n#include<stdio.h>\nint main(){\n    struct book{\n        Char name;\n\
    \        Float price;\n        Int pages;\n    };\n    struct book b1={'B',130.00,550};\n\
    \    printf(\"\\n address of name=%u\",&b1.name);\n    printf(\"\\n address of\
    \ price =%u\", & b1.price);\n    printf(\"\\n address of pages =%u\",&b1.pages);\n\
    \    return 0;\n}\n```\n**输出：**\n```\nAddress of name =65518\nAddress of price=65519\n\
    Address of pages =65523\n```\n结构元素在内存中的存储所示：\n`b1.name` | `b1.price` | `b1.pages`\n\
    `'b'` | `130.00` | `550`\n`65518` | `65519` | `65523`\n\n## 结构体数组\n\n示例：\n```c\n\
    #include<stdio.h>\nvoid link float();\nint main (){\n    struct book{\n      \
    \  char name;\n        float price;\n        int pages;\n    };\n    struct book\
    \ b[100];\n    int i;\n    for(i=0;i<=99;i++){\n        printf (\\n enter names,\
    \ price, and pages\");\n        fflush(stdin);\n        scanf(\" %c%f%d\",&b[i].name,&b[i].price,&b[i].pages);\n\
    \    }\n    for(i=0;i<=99;i++)\n        printf(\"\\n %C%f%d\",b[i].name,b[i].price,b[i].pages);\n\
    \    return 0;\n}\nvoid link float(){\n    float a=0,*b;\n    b=&a;\n    a=*b\n\
    }\n```\n\n**注意：**\na) 结构体数组的声明方式：\n`struct book b[100];`\n这在内存中为 100 个 `struct\
    \ book` 类型的结构体提供了空间。\nb) 我们引用数组 `b` 中每个元素的语法与用于整型和字符型数组的语法相似。\nc) 即使使用了结构体，也无法实现编程的便利性，因为需要处理大量的变量（用于存储百本书数据的\
    \ `b1` 到 `b100`）。因此，它允许我们创建一个结构体数组。\nd) 在结构体数组中，数组的所有元素都存储在相邻的内存位置上。\ne) `linkfloat()`\
    \ 函数在这里的作用是什么？\n它强制将浮点模拟器链接到应用程序中。没有必要调用此函数，只需在程序的任何地方定义它即可。\n\n# 结构的附加功能\n\n\
    - 结构体变量的值可以使用赋值运算符赋予另一个相同类型的结构体变量。\n\n## 赋值运算符用于逐个拷贝\n\n示例：\n```c\n#include<stdio.h>\n\
    #include<string.h>\nint main(){\n    struct employee{\n        char name[10];\n\
    \        int age;\n        float salary;\n    };\n    struct employee e1={\"sanjay\"\
    ,30,5500.50};\n    struct employee e2,e3;\n    /*逐个拷贝*/\n    strcpy(e2.name,e1.name);\
    \    /*e2.name=e1.name 是错误的*/\n    e2.age=e1.age;\n    e2.salary=e1.salary;\n\
    \    /*一次性拷贝所有元素*/\n    e3=e2;\n    printf(\"\\n %s %d %f\", e1.name,e1.age,e1.salary);\n\
    \    printf(\"\\n %s %d %f \", e2.name,e2.age,e2.salary);\n    printf(\"\\n %s\
    \ %d %f \", e3.name,e3.age,e3.salary);\n    return 0;\n}\n```\n**输出：**\n```\n\
    Sanjay 30 5500.500000\nSanjay 30 5500.500000\nSanjay 30 5500.500000\n```\n\n##\
    \ 嵌套结构\n\n示例：\n```c\n#include<stdio.h>\nint main(){\n    struct address{\n   \
    \     char phone[15];\n        char city[25];\n        Int pin;\n    };\n    struct\
    \ emp{\n        char name[25];\n        struct address a;\n    };\n    struct\
    \ emp e={\"jeru\", {\"531046\",\"nagpur\",10}};\n    printf(\"name=%s phone=%s\
    \ \\n\",e.name,e.a.phone);\n    printf(\"\\n city=%s pin=%d\",e.a.city,e.a.pin);\n\
    \    return 0;\n}\n```\n**输出：**\n```\nName=jeru phone=531046\nCity=Nagpur pin\
    \ =10\n```\n\n## 结构体变量传递函数\n\n示例：\n```c\n#include<stdio.h>\nvoid display(char*,char*,int);\n\
    int main(){\n    struct book{\n        char name[25];\n        char author[25];\n\
    \        Int callno;\n    };\n    struct book b1={\"let us\", \"YPK\",101};\n\
    \    display(b1.name,b1.author,b1.callno);\n    return 0;\n}\nvoid display(char*s,\
    \ char*t,int n){\n    printf(\"%s %s %d \\n\", s, t, n);\n}\n```\n**输出：**\n```\n\
    Let us YPK 101\n```\n\n## 指向函数\n\n示例：\n```c\n#include<stdio.h>\nstruct emp{\n\
    \    int a;\n    char ch;\n    float s;\n};\nint main(){\n    struct emp e;\n\
    \    printf(\"\\n %u %u \", &e.ch,&e.s);\n    return 0;\n}\n```\n**输出：**\n- 使用\
    \ `TC/TC++` 编译器得到的地址为：`65518`, `65520`\n- 使用 std 输出为：`242044`, `24502`\n\n# printf()\n\
    \n**注意：** `printf()` 不仅可以打印变量的值，还可以打印表达式的结果。表达式就是常量、变量和运算符的有效组合。因此，`3`、`3+2`、`c`\
    \ 和 `a+b*c` 都是有效的表达式。这些表达式的结果如下所示打印。\n\n```c\nprintf(\"\\n %d%d%d\", 3,3+2,c,a+b*c);\n\
    ```\n\n**示例：**\n```c\n#include <stdio.h>\nint main(){\n    char ch = 'A';\n  \
    \  char str[20];\n    float flt = 10.234;\n    int no = 150;\n    double dbl =\
    \ 20.123456;\n    printf(\"Character is %c \\n\", ch);\n    printf(\"String is\
    \ %s \\n\", str);\n    printf(\"Float value is %f \\n\", flt);\n    printf(\"\
    Integer value is %d\\n\", no);\n    printf(\"Double value is %lf \\n\", dbl);\n\
    \    printf(\"Octal value is %o \\n\", no);\n    printf(\"Hexadecimal value is\
    \ %x \\n\", no);\n    return 0;\n}\n```\n**输出：**\n```\nCharacter is A\nFloat value\
    \ is 10.234000\nInteger value is 150\nDouble value is 20.123456\nOctal value is\
    \ 226\nHexadecimal value is 96\n```\n你可以看到输出与程序中 `printf` 语句双引号内放置的数据相同。\n\n#\
    \ scanf()\n\n为了使程序通用化，程序本身在执行期间应该要求用户通过键盘提供 `p`、`n`、`r` 值。这可以通过名为 `scanf()` 的函数来实现。\n\
    \n示例：\n```c\n#include <stdio.h>\nint main(){\n    char ch;\n    char str[100];\n\
    \    printf(\"Enter any character \\n\");\n    scanf(\"%c\", &ch);\n    printf(\"\
    Entered character is %c \\n\", ch);\n    printf(\"Enter any string ( upto 100\
    \ character ) \\n\");\n    scanf(\"%s\", str);\n    printf(\"Entered string is\
    \ %s \\n\", str);\n}\n```\n**输出：**\n```\nEnter any character a\nEntered character\
    \ is a\nEnter any string ( upto 100 character ) hai\nEntered string is hai\n```\n\
    **注意：**\n- `scanf()` 语句中使用格式说明符 `%d`。这样输入的值就被作为整数接收，`%s` 用于字符串。\n- 在 `scanf()`\
    \ 语句中，变量名 `ch` 之前使用了取地址符 `&`。\n- 这就像在指针中一样，用于指向变量。\n\n关于指针如何运作的更多信息：\n- `printf()`\
    \ 用于显示输出，`scanf()` 用于读取输入。\n- `printf()` 和 `scanf()` 函数在 C 库的 `stdio.h` 头文件中声明。\n\
    - C 语言中的所有语法（包括 `printf()` 和 `scanf()` 函数）都是大小写敏感的。\n\n# 预处理器指令\n\n在 C 程序被编译器编译之前，源代码会由一个名为预处理器的程序进行处理。这个过程被称为预处理。\n\
    - 预处理器中使用的命令称为预处理器指令，它们以 `#` 符号开头。\n\n**c 预处理器的特性：**\na) 宏展开\nb) 文件包含\nc) 条件编译\n\
    d) 杂杂指令\n\n编译后的 C 程序创建了 4 个内存区域。它们是：\n1. **第一个区域** —— 这是存储程序执行代码的内存区域。\n2. **第二个区域**\
    \ —— 全局变量存储在这个内存区域中。\n3. **第三个区域** —— 栈 (stack)\n4. **第四个区域** —— 堆 (heap)\n\n\
    你知道 C 语言中栈内存和堆内存的区别吗？\n\n| 栈 | 堆 |\n| :--- | --- |\n| 栈是在 C 程序执行期间存储“局部变量”、“函数调用返回地址”和“函数参数”的内存区域。\
    \ | 堆是运行时由动态内存分配函数使用的内存区域。 |\n\n"
