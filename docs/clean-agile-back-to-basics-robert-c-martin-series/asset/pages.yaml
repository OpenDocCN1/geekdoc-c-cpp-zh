- pgno: 169
  md: 'This role typically rotates from one team member to the next on an informal
    schedule and based on need. A mature team working steadily along does not require
    a coach. On the other hand, a team under some kind of stress—whether it be schedule,
    business, or interpersonal—may decide to ask someone to fill the role temporarily.


    The coach is not a manager. The coach is not responsible for budget or schedule.
    The coach does not direct the team nor does she represent the team’s interests
    to management. The coach is not the liaison between the customers and the developers.
    The role of the coach is strictly internal to the team. Neither the managers nor
    the customers know who the coach is, nor even whether there currently is a coach.


    # SCRUM MASTERS


    In Scrum, the coach is called a *Scrum Master*. The invention of this term, and
    the sequence of events that followed it, were among the best and worst things
    that happened to the Agile community. The certification programs attracted large
    numbers of project managers. This influx increased the popularity of Agile in
    the early days but eventually led to the role of the coach to be conflated with
    the role of the project manager.


    Nowadays, it is all too frequent that we see Scrum Masters who are not coaches
    at all but are simply project managers doing what project managers always did.
    Unfortunately, the title and certification tend to give them undue influence over
    the Agile team.


    # CERTIFICATION


    The Agile certifications that exist are a complete joke and an utter absurdity.
    Do not take the certifications seriously. The training that accompanies the certification
    programs is often worthwhile; however, that training should not be focused on
    a particular role, it should be for everyone on the team.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'For example, the fact that someone is “certified” a Scrum Master is a worthless
    certification. The certifiers are not guaranteeing anything other than that the
    person paid the fee for, and possibly attended, a two-day course. The certifiers
    are specifically not guaranteeing that the newly minted Scrum Master will do a
    good job as a coach. The absurd implication of the certification is that there
    is something special about a “Certified Scrum Master,” which of course flies in
    the face of the notion of a coach. An Agile coach is not specially trained to
    be an Agile coach.


    Again, there’s often nothing wrong with the training programs that go along with
    these certifications. However, it is foolish to train just one special person.
    Every member of an Agile team needs to understand the values and techniques of
    Agile. Therefore, if one member of the team is trained, all members of the team
    should be trained.


    # ## Real Certification


    What would a real Agile certification program look like? It would be a semester-long
    course, complete with Agile training and the supervised development of a small
    Agile project. The course would be graded and the students held to a high bar.
    The certifier would guarantee that the students understood Agile values and showed
    proficiency in executing Agile disciplines.


    # ## Agile in the Large


    The Agile movement began in the late ’80s. It was quickly recognized as a means
    for organizing a small team of between 4 and 12 software developers. Those numbers
    are soft and were seldom articulated, but everyone understood that Agile (or whatever
    we called it before 2001) was not appropriate for a massive team of thousands
    of developers. That was not the problem we were trying to solve.'
