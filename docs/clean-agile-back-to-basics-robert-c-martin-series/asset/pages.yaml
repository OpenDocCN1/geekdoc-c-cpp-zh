  md: '![](img/8facf878fd02eafcdb1e1193ad5963b0_110_0.png)


    **Figure 3.4** Punched card decks in a box


    The owner of that program kept the deck in a drawer or a cabinet. If someone wanted
    to check out the source code, he literally checked out the source code from the
    drawer or cabinet, with the permission of the owner.


    If you had the source code checked out, you were the only one who could change
    that source code because you had physical possession of it. Nobody else could
    touch it. When you were done, you gave the deck back to the owner, who put it
    back in the drawer or cabinet.


    The cycle time for that program was the amount of time that a programmer kept
    possession of it. That time could be days, weeks, or months.'
