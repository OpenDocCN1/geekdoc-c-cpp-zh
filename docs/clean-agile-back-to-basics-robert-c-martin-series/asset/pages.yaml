- pgno: 167
  md: 'It is not uncommon to see small organizations transition completely to Agile.
    They have no middle management, and the values of the executives and developers
    are strongly aligned.


    # ## Individual Success and Migration


    Finally, sometimes only certain individuals within an organization adopt the Agile
    values. Individuals who make this transition do not fare well within organizations
    or teams who do not. The difference in values generally leads to a separation
    of some kind. In the best case, the individuals who make the transition will join
    or form new Agile teams that manage to hide from middle management. If that’s
    not possible, they will likely seek (and find) employment at a company that shares
    their values.


    Indeed, over the last twenty years, we have seen this migration of values taking
    place in the industry. New companies that embrace the Agile values have been formed,
    and programmers who desire to work in an Agile manner flock to those companies.


    # ## Creating Agile Organizations


    Can large organizations be created that allow Agile teams to prosper within them?
    Certainly! However, note that the word is *created* not *transformed*.


    When IBM decided to build the PC, the company’s executives realized that the values
    of the organization would not allow the kind of quick innovation and risk-taking
    that would be required. So, they *created* an organization with a different value
    structure.^3


    Have we seen this happen in the software world? Have older, large organizations
    *created* smaller software organizations for the purpose of adopting Agile? I’ve
    seen hints of this, but I cannot bring to mind any overt examples. We have certainly
    seen many startups adopt Agile. We have also seen many Agile consulting companies
    being used by large non-Agile


    3. The birth of the IBM PC. Accessed at https://www.ibm.com/ibm/history/exhibits/pc25/pc25_birth.html.'
