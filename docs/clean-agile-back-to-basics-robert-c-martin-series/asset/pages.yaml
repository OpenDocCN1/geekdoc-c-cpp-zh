- pgno: 175
  md: '+   - Continuous integration/build tools (Jenkins, TeamCity, GoCD, etc.)

    +   - Deployment/server management tools (Docker, Kubernetes, Ansible, Chef, Puppet,
    etc.)

    +   - Communication tools: email, Slack, the English language (!)

    +   - Testing tools (unit testing frameworks, Cucumber, Selenium, etc.)


    These categories of tools are essential to building software. Without them, it
    is impossible to deliver anything in today’s world. In a sense, they represent
    the programmer’s toolbox of “hand tools.”


    Many of these tools demand hard-earned expertise for effective use. The landscape
    meanwhile changes constantly, making tool mastery even more challenging. The savvy
    developer finds the path of least resistance and highest value through all the
    tools involved: what gives the biggest bang for the buck?


    # ### What Makes for an Effective Tool?


    The tool landscape changes rapidly because we are always learning more effective
    ways to accomplish our goals. Witness the wide variety of source repository tools
    introduced in the past few decades: PVCS, ClearCase, Microsoft Visual SourceSafe,
    StarTeam, Perforce, CVS, Subversion, and Mercurial, to name a few. All suffered
    problems—too flaky, too proprietary or closed, too slow, too invasive, too scary,
    too complex. A winner eventually emerged, one that managed to overcome most objections:
    Git.


    One of the most empowering aspects of Git is its ability to make you feel safe.
    If you were around long enough to have used one of the other tools, you likely
    felt a little nervous from time to time. You needed a live network connection
    to the server, or your work was at risk. The CVS repository would get corrupted
    occasionally, requiring you to muck around in its attic to hopefully uncorrupt
    things. The repository server crashed sometimes; even if it was backed up, you
    risked losing half a day’s work. Some proprietary tools suffered repository corruption,
    meaning you’d be on the phone for hours with support while soliciting donations
    for the king’s ransom needed to pay for uncorrupting it. With Subversion, you’d
    fear doing much branching'
