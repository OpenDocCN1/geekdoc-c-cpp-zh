  md: '*Login* is a concrete operation. On the other hand, a story like *Usable* is
    not testable. It’s also not estimable. Indeed, the E and T go together pretty
    closely.


    # STORY ESTIMATION


    There are a number of schemes for estimating stories. Most of them are variations
    on the old Wideband Delphi⁵ approach.


    One of the simplest is called *Flying Fingers*. Developers sit around a table,
    read a story, and discuss it with stakeholders if necessary. Then the developers
    put one hand behind their back, out of sight, and hold up the number of fingers
    that corresponds to the number of points they think the story deserves. Then someone
    counts one…two…three… and then all the fingers come flying out at once.


    If everyone is holding the same number of fingers, or if the deviation is small
    and has an obvious mean, then that number is written on the story card, and the
    team moves on to the next story. If, however, there is substantial disagreement
    between the fingers, then the developers discuss the reasons why, and then repeat
    the process until agreement is reached.


    A reasonable range for stories is *Shirt Sizes*: small, medium, and large. If
    you want to use all five fingers, go ahead. On the other hand, more than a handful
    of rankings is almost certainly absurd. Remember, we want to be accurate, but
    no more precise than necessary.


    *Planning Poker*⁶ is a similar technique, but it involves cards. There are many
    popular Planning Poker card decks out there. Most use some kind of Fibonacci series.
    One popular deck contains the cards: ?, 0, ½, 1, 2, 3, 5, 8, 13, 20, 40, 100,
    and ∞. If you use such a deck, my advice to you would be to remove most of those
    cards.


    ⁵ https://en.wikipedia.org/wiki/Wideband_delphi


    ⁶ Grenning, J. W. 2002. Planning Poker or how to avoid analysis paralysis while
    release planning. Accessed at https://wingman-sw.com/articles/planning-poker.'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'A benefit of the Fibonacci series is that it allows the team to estimate larger
    stories. For example, you could choose 1, 2, 3, 5, and 8, which gives you an 8X
    range in size.


    You may also wish to include 0, ∞, and ?. In *Flying Fingers*, you can use thumbs
    down, thumbs up, and an open hand for these symbols. Zero means, “Too trivial
    to estimate.” Be careful with those! You may wish to merge a few of them into
    a bigger story. Infinity (∞) represents too big to estimate, and therefore the
    story should be split. And (?) means you simply don’t know, meaning that you’ll
    need a *spike*.


    # Splitting, Merging, and Spiking


    Merging stories is simple. You can clip the cards together and treat the merged
    stories as one. Just add up all the points. If any have zero points, use your
    best judgment in summing them. After all, fives zeros probably does not add up
    to zero.


    Splitting stories is a bit more interesting because you need to maintain INVEST.
    As a simple example of splitting a story, consider *Login*. If we wanted to split
    it into smaller stories, we could create *Login with No Password*, *Login with
    Single Password Attempt*, *Allow Multiple Password Attempts*, and *Forgot Password*.


    It is rare to find a story that cannot be split. This is especially true of those
    that are big enough to need splitting. Remember, it is the job of a programmer
    to split stories all the way down into individual lines of code. So splitting
    is almost always possible. The challenge is maintaining INVEST.


    A *spike* is a meta-story, or rather, a story for estimating a story. It is called
    a *spike* because it often requires us to develop a long but very thin slice through
    all the layers of the system.


    Let’s say there’s a story that you cannot estimate. Let’s call it *Print PDF*.
    Why don’t you know how to estimate it? Because you’ve never used the PDF library
    before and you aren’t sure how it works. So you write a new story called *Estimate
    Print PDF*. Now you estimate *that* story, which is easier to estimate.'
