- pgno: 108
  md: 'The purpose of estimating the iteration during the IPM is simply so that the
    stakeholders know how many stories *might* get done. This helps the stakeholders
    choose the stories and helps them to plan. But that estimate is not a promise,
    and the team has not failed if the actual velocity is lower.


    Remember, the only failing iteration is an iteration that fails to produce data.


    # Falling Velocity


    If the velocity chart shows a consistent negative slope, then the most likely
    cause is the quality of the code. The team is likely not refactoring enough and
    they are probably allowing the code to rot. One reason that teams fail to refactor
    enough is that they don’t write enough unit tests, so they fear that refactoring
    will break something that used to work. Managing this fear of change is a major
    goal of team management, and it all comes down to the testing discipline. We’ll
    have much more to say about that later.


    As velocity falls, pressure on the team builds. This causes the points to inflate.
    That inflation can hide the falling velocity.


    # The Golden Story


    One way to avoid inflation is to constantly compare story estimates back to the
    original *Golden Story*, the standard against which other stories will be measured.
    Remember that *Login* was our original *Golden Story*, and it was estimated as
    3. If a new story such as *Fix Spelling Error in Menu Item* has an estimate of
    10, you know that some inflationary force is at work.


    # SMALL RELEASES


    The practice of *Small Releases* suggests that a development team should release
    their software as often as possible. Back in the late ’90s, in the early days
    of Agile, we thought that this meant a release every “month or two.” Nowadays,
    however, we’ve set the goal to be much, much, shorter. Indeed,'
