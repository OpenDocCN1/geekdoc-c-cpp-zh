    by which the business and development team manage the project.


    +   - The *Planning Game* practice plays the central role of this ring. It tells
    us how to break down a project into features, stories, and tasks. It provides
    guidance for the estimation, prioritization, and scheduling of those features,
    stories, and tasks.

    +   - *Small Releases* guides the team to work in bite-sized chunks.

    +   - *Acceptance Tests* provide the definition of “done” for features, stories,
    and tasks. It shows the team how to lay down unambiguous completion criteria.

    +   - *Whole Team* conveys the notion that a software development team is composed
    of many different functions, including programmers, testers, and managers, who
    all work together toward the same goal.


    The middle ring of the Circle of Life presents the team-facing practices. These
    practices provide the framework and principles by which the development team communicates
    with, and manages, itself.


    +   - *Sustainable Pace* is the practice that keeps a development team from burning
    their resources too quickly and running out of steam before the finish line.

    +   - *Collective Ownership* ensures that the team does not divide the project
    into a set of knowledge silos.

    +   - *Continuous Integration* keeps the team focused on closing the feedback
    loop frequently enough to know where they are at all times.

    +   - *Metaphor* is the practice that creates and promulgates the vocabulary and
    language that the team and the business use to communicate about the system.


