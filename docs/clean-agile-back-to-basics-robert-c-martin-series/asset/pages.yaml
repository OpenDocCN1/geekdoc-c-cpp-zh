- pgno: 207
  md: 'The Software Craftsmanship mindset is an inspiration for many developers. It
    gives them a sense of purpose, a sense of pride, and an innate willingness to
    do things well. Most developers, as people in general, are keen to learn and do
    things well—they just need support and an environment where they can thrive. Companies
    embracing Craftsmanship often see internal communities of practice flourish. Developers
    organize internal sessions where they code together, practice TDD, and improve
    their software design skills. They become interested in learning new technologies
    and modernizing the systems they work on. They discuss better ways to improve
    the codebase and eliminate technical debt. Software Craftsmanship promotes a culture
    of learning, making companies more innovative and responsive.


    # CRAFTSMANSHIP AND AGILE


    Some of the triggers for the creation of the Software Craftsmanship movement were
    related to the frustration that many developers felt with the direction Agile
    had taken. Because of that, some people felt that Craftsmanship and Agile were
    at odds with each other. People in the Craftsmanship movement who had also been
    part of the Agile movement criticized Agile for their excessive focus on process
    and lack of focus on engineering. People in the Agile movement criticized Craftsmanship
    for its narrow focus or lack of focus on real business and people problems.


    Although there were some valid concerns coming from both sides, most of the disagreements
    were more related to tribalism than actual fundamental divergence of opinions.
    Essentially, both movements want to achieve very similar things. They both want
    customer satisfaction, they both desire close collaboration, and they both value
    short feedback loops. Both want to deliver high-quality, valuable work, and both
    want professionalism. In order to achieve business agility, companies need not
    only collaborative and iterative processes, but also good engineering skills.
    Combining Agile and Craftsmanship is the perfect way to achieve that.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# CONCLUSION


    At the Snowbird meeting in 2001, Kent Beck said that Agile was about the healing
    of the divide between development and business. Unfortunately, as the project
    managers flooded into the Agile community, the developers—who had created the
    Agile community in the first place—felt dispossessed and undervalued. So, they
    left to form the Craftsmanship movement. Thus, the ancient distrust continues.


    And yet the values of Agile and the values of Craftsmanship are strongly aligned.
    These two movements should not be separate. One hopes that, one day, they’ll come
    together again.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '![](img/8facf878fd02eafcdb1e1193ad5963b0_209_0.png)


    # # CONCLUSION


    So, that’s it. Those are my memories, my opinions, and my rantings and ravings
    about Agile. I hope you enjoyed them and maybe even learned a thing or two.


    Agile may be the most significant, and most persistent, of all the revolutions
    we have seen about software processes and methods. That significance and persistence
    are evidence that those 17 folks who went to Snowbird, Utah, during February 2001
    started a snowball rolling down a very long hill. Riding that snowball, watching
    it gather size and speed, and seeing it hit boulders and trees has been a load
    of fun for me.


    I wrote this book because I thought it was time for someone to stand up and yell
    about what Agile was and what Agile still ought to be. I thought it was time to
    remember the basics.


    Those basics were, are, and will be the disciplines in Ron Jeffries’ Circle of
    Life. Those basics are the values, principles, and disciplines of Kent Beck’s
    *Extreme Programming Explained.*¹ Those basics are the motivations, techniques,
    and disciplines in Martin Fowler’s *Refactoring.*² Those basics were stated by
    Booch, DeMarco, Yourdon, Constantine, Page-Jones, and Lister.


    ¹ Beck, K. 2000. *Extreme Programming Explained: Embrace Change.* Boston, MA:
    Addison-Wesley.


    ² Fowler, M. 2002. *Refactoring: Improving the Design of Existing Code,* 2nd ed.
    Boston, MA: Addison-Wesley.'
