    Finally, never, ever, ever, ask for permission to pair. Or test. Or refactor.
    Or… You are the expert. You decide.


    # Conclusion


    The technical practices of Agile are the most essential ingredient of any Agile
    effort. Any attempt to employ Agile practices without the technical practices
    is doomed to fail. The reason for this is simply that Agile is an efficient mechanism
    for making a big mess in a big hurry. Without the technical practices to keep
    the technical quality high, the productivity of the team will quickly falter and
    begin an inexorable death spiral.'
