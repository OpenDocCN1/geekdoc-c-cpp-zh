  md: '# Losing the Tests at the End


    Moving QA to the beginning and automating the tests solves another huge problem.
    When QA operates manually at the end, they are the bottleneck. They must finish
    their work before the system can be deployed. Impatient managers and stakeholders
    lean on QA to finish up so that the system can be deployed.


    When QA comes at the end, all upstream delays fall on QA. If the developers are
    late delivering to QA, does the delivery date change? Often the delivery date
    was chosen for very good business reasons, and delaying it would be costly, or
    even catastrophic. QA is left holding the bag.


    How should QA test the system when they have no time left in the schedule to test
    it? How can QA go faster? That’s easy: don’t test everything. Just test the things
    that changed. Do an impact analysis based on new and changed features, and only
    test the impacted things. Don’t waste time testing things that haven’t changed.


    So you lose the tests. Under pressure, QA simply bypasses all the regression tests.
    They hope that they can run them next time. Often, “next time” never comes.


    # The QA Disease


    However, that’s not the worst problem that happens because QA is at the end of
    the process. When QA is at the end, how does the organization know they are doing
    their jobs well? By their defect count, of course. If QA is finding lots of defects,
    they are clearly doing their job well. QA managers can tout the number of defects
    found as clear evidence that they are performing their function.


    Thus, defects are considered a *good thing*.


    Who else can benefit from defects? There’s a saying among older programmers: “I
    can meet any deadline you set for me, as long as the software doesn’t have to
    work properly.” So who else benefits from defects? Developers who need to meet
    schedule deadlines.'
  merge: -1
