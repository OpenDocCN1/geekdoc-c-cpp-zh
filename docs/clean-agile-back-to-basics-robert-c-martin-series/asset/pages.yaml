- pgno: 64
  md: 'Before we dive into the details of Agile development, I want to explain what’s
    at stake. Agile development is important, not just to software development, but
    to our industry, our society, and ultimately our civilization.


    Developers and managers are often attracted to Agile development for transient
    reasons. They might try it because it just somehow feels right to them, or perhaps
    they fell for the promises of speed and quality. These reasons are intangible,
    indistinct, and easily thwarted. Many people have dropped Agile development simply
    because they didn’t immediately experience the outcome they thought were promised.


    These evanescent reasons are not why Agile development is important. Agile development
    is important for much deeper philosophical and ethical reasons. Those reasons
    have to do with professionalism and the reasonable expectations of our customers.


    # PROFESSIONALISM


    What drew me to Agile in the first place was the high commitment to discipline
    over ceremony. To do Agile right, you had to work in pairs, write tests first,
    refactor, and commit to simple designs. You had to work in short cycles, producing
    executable output in each. You had to communicate with business on a regular and
    continuous basis.


    Look back at the Circle of Life and view each one of those practices as a *promise*,
    a *commitment*, and you’ll see where I am coming from. For me, Agile development
    is a commitment to up my game—to be a professional, and to promote professional
    behavior throughout the industry of software development.


    We in this industry sorely need to increase our professionalism. We fail too often.
    We ship too much crap. We accept too many defects. We make terrible trade-offs.
    Too often, we behave like unruly teenagers with a new credit card. In simpler
    times, these behaviors were tolerable because the stakes were relatively low.
    In the ’70s and ’80s and even into the ’90s, the cost of software failure, though
    high, was limited and containable.'
