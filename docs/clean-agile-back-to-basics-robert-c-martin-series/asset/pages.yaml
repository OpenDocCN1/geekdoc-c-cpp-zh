    # # Agile Overview


    How do you manage a software project? There have been many approaches over the
    years—most of them pretty bad. Hope and prayer are popular among those managers
    who believe that there are gods who govern the fate of software projects. Those
    who don’t have such faith often fall back on motivational techniques such as enforcing
    dates with whips, chains, boiling oil, and pictures of people climbing rocks and
    seagulls flying over the ocean.


    These approaches almost universally lead to the characteristic symptoms of software
    mismanagement: Development teams who are always late despite working too much
    overtime. Teams who produce products of obviously poor quality that do not come
    close to meeting the needs of the customer.'
