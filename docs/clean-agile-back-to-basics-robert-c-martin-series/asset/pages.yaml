- pgno: 166
  md: 'middle management. So long as middle management is satisfied that their procedures
    and standards are being followed, they may leave the development teams to their
    own devices.


    This is what Booch and Parnas called “faking it.”² The team does Agile under the
    covers, while providing everything that satisfies the middle-management layer.
    Rather than fighting a futile battle with the middle managers, these teams put
    a layer on top of Agile that makes Agile look safe and conformant to the middle
    managers.


    For example, the middle managers may want an analysis document produced in the
    early phases of the project. The Agile team provides this document by writing
    much of the early code of the system using all the normal Agile disciplines, and
    then produces the analysis document by scheduling a sequence of documentation
    stories.


    This makes sense because the first few coding iterations are heavily focused on
    requirements analysis. The fact that this analysis is being done by actually writing
    code is not something that the middle managers need to know. Nor should they care.


    Unfortunately, I have seen organizations who are so dysfunctional that when middle
    managers smell that a team is “faking it,” they assume subterfuge and quickly
    move to expunge the Agile disciplines. This is a deep shame because those teams
    were actually giving the middle managers what they needed.


    # SUCCESS IN SMALLER ORGANIZATIONS


    I have seen some medium-sized organizations adopt Agile. They had thin middle-management
    layers composed of folks who came up through the ranks and still retained the
    direct, risk-taking mindset.


    ² Booch, G. 1994. *Object-Oriented Analysis and Design with Applications*, 2nd
    ed. Reading, MA: Addison-Wesley, p. 233–34.'
