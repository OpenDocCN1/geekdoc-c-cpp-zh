- pgno: 202
  md: 'better practices are discovered. But that does not mean that the international
    Craftsmanship community does not advocate any practices. On the contrary, since
    its creation in 2008, the Software Craftsmanship community considers XP the best
    set of Agile development practices currently available. TDD, Refactoring, Simple
    Design, Continuous Integration, and Pair Programming are heavily advocated by
    the Software Craftsmanship community—but they are XP practices, not Craftsmanship
    practices. And they are not the only practices. Craftsmanship also promotes Clean
    Code and SOLID principles. It promotes small commits, small releases, and Continuous
    Delivery. It promotes modularity in software design and any type of automation
    that removes manual and repetitive work. And it promotes any practices that improve
    productivity, reduce risk, and help to produce valuable, robust, and flexible
    software.


    Craftsmanship is not only about technical practices, engineering, and self-improvement.
    It is also about professionalism and enabling clients to achieve their business
    goals. And this is an area where Agile, Lean, and Craftsmanship are in perfect
    alignment. All three have similar goals but tackle the problem from different
    but equally important and complementary perspectives.


    # ## FOCUS ON THE VALUE, NOT THE PRACTICE


    A common mistake in the Agile and Craftsmanship communities is to promote practices
    instead of the value they provide. Let’s take TDD as an example. One of the most
    common questions asked inside the Craftsmanship communities is “How do I convince
    my manager/colleague/team to do TDD?” That is the wrong question. The problem
    here is that we are offering a solution before agreeing on the problem. People
    will not change the way they work if they do not see the value.


    Instead of pushing TDD, maybe we could start agreeing on the value of reducing
    the time it takes to test our entire system. How long does it take today? Two
    hours? Two days? Two weeks? How many people are involved? What if we could reduce
    it to 20 minutes? Two minutes? Maybe even'
  merge: -1
  img_proc: true
- pgno: 203
  md: '2 seconds? And what if we could do that at any time just by pressing a button?
    Would that give us a good return on investment? Would that make our lives easier?
    Would we be able to release reliable software faster?


    If we agree that the answer is yes, then we can start talking about practices
    which could help us achieve that. TDD would be a natural choice here. For those
    who are not so keen on TDD, we should ask what practice they would prefer. What
    practice can they suggest that could bring the same or higher value according
    to the agreed-upon goals?


    Agreeing first on the goals to be achieved is essential when discussing practices.
    The only thing that should not be acceptable is to reject a practice without providing
    a better alternative.


    # Discussing Practices


    The discussion around practices should be done at the right level and with the
    right people. If we want to adopt practices that improve the collaboration between
    business and technology, people from business and technology should be involved
    in the discussion. If developers are discussing practices that would enable them
    to build systems in a better way, there is no reason to involve businesspeople.
    Business should only be involved when there is a significant impact in the cost
    or duration of the project.


    There is a difference between re-architecting a whole monolith system into microservices
    and doing TDD. The former has a very significant impact on the cost and duration
    of the project; the latter doesn’t, as long as developers are comfortable with
    the technique. Whether or not developers automate their tests should not be relevant
    to the business. It should be even less relevant whether the automated tests are
    written before or after the production code. What business should care about is
    that the lead time from business ideas to software in production is gradually
    reduced. Reducing the amount of money and time spent on rework (bugs, manual processes
    like testing, deployment, and production monitoring) is also a business concern
    that should be addressed by the development teams. Reducing the cost of'
