  md: '# ## Developer Bill of Rights


    The developer bill of rights includes the following:


    +   - You have the right to know what is needed with clear declarations of priority.

    +   - You have the right to produce high-quality work at all times.

    +   - You have the right to ask for and receive help from peers, managers, and
    customers.

    +   - You have the right to make and update your own estimates.

    +   - You have the right to accept your responsibilities instead of having them
    assigned to you.


    These are extremely powerful statements. We should consider each in turn.


    # ## Customers


    The word “customer” in this context refers to businesspeople in general. This
    includes true customers, managers, executives, project leaders, and anyone else
    who might carry responsibility for schedule and budget or who will pay for and
    benefit from the execution of the system.


    > > Customers have the right to an overall plan and to know what can be accomplished
    when and at what cost.


    Many people have claimed that up-front planning is not part of Agile development.
    The very first customer right belies that claim. Of course the business needs
    a plan. Of course that plan must include schedule and cost. And, of course that
    plan should be as accurate and precise as practical.


    It is in that last clause that we often get into trouble because the only way
    to be both accurate and precise is to actually develop the project. Being both
    accurate and precise by doing anything less is impossible. So what we developers
    must do to guarantee this right is to make sure that our plans, estimates, and
    schedules properly describe the level of our uncertainty and define the means
    by which that uncertainty can be mitigated.'
