- pgno: 205
  md: 'normally say something like “*I work for* company X,” or “*I work as a* software
    developer.” But a person with a profession would generally say, “*I am a* software
    developer.” A profession is something we invest in. It’s something we want to
    get better at. We want to gain more skills and have a long-lasting and fulfilling
    career.


    That does not mean we would not spend time with our families or that we would
    not have other interests in life. Rather, it means that we would find a way to
    balance all our commitments and interests such that we can live a single, well-balanced,
    and happy life. There are times when we want to give more attention to our family,
    our profession, or a hobby we might have. And that is totally OK. We have different
    needs at different times. But going to work should not be a chore when we have
    a profession. It is just another thing we do that gives us pleasure and fulfills
    us as individuals. A profession gives meaning to our lives.


    # CRAFTSMANSHIP IMPACT ON OUR INDUSTRY


    Since 2008, a growing number of Software Craftsmanship communities and conferences
    are being organized all over the world, attracting tens of thousands of developers.
    While Agile communities have an emphasis on the people and process side of software
    projects, the Craftsmanship communities focus more on the technical side. They
    have been key in promoting XP, and many other technical practices to many developers
    and companies around the world. It is through Software Craftsmanship communities
    that many developers are learning TDD, Continuous Integration, Pair Programming,
    Simple Design, SOLID principles, Clean Code, and Refactoring. They are also learning
    how to architect systems using microservices, how to automate their deployment
    pipelines, and how to migrate their systems to the cloud. They are learning different
    programming languages and paradigms. They are learning new technologies and different
    ways to test and maintain their applications. Developers in the Craftsmanship
    community are creating safe and friendly spaces where they can meet like-minded
    people and talk about their profession.'
