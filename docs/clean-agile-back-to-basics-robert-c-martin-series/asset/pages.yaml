- pgno: 130
  md: 'The year was 1995. My first book was scheduled to go to press the next day,
    and I was on the hook to deliver page proofs. It was 6 p.m. and I had them all
    ready to go. All I needed to do was to FTP them to my publisher.


    But then, by sheer accident, I stumbled across a way to *double* the resolution
    of the hundreds of diagrams in that book. Jim and Jennifer were helping me get
    the page proofs ready, and we were just about to execute the FTP when I showed
    an example of the improved resolution to them.


    We all looked at each other, heaved a great sigh, and Jim said, “We have to redo
    them all.” It wasn’t a question. It was a statement of fact. The three of us looked
    at each other, at the clock, back at each other, and then we buckled down and
    got to work.


    But when we were done with that all-nighter, we were *done*. The book shipped.
    And we slept.


    # SLEEP


    The most precious ingredient in the life of a programmer is sufficient sleep.
    I do well on seven hours. I can tolerate a day or two of six hours. Anything less,
    and my productivity plummets. Make sure you know how many hours of sleep your
    body needs, and then prioritize those hours. Those hours will more than pay themselves
    back. My rule of thumb is that the first hour of insufficient sleep costs me two
    hours of daytime work. The second hour of insufficient sleep costs me another
    four hours of productive work. And, of course, there’s no productive work at all
    if I’m three hours behind on my sleep.


    # COLLECTIVE OWNERSHIP


    No one owns the code in an Agile project. The code is owned by the team as a whole.
    Any member of the team can check out and improve any module in the project at
    any time. The team owns the code *collectively*.'
