- pgno: 168
  md: 'companies that want to get certain software projects done more quickly and
    reliably.


    That’s my prediction. We will eventually see larger companies create new divisions
    that use Agile for their software development. We will also see Agile consulting
    companies used more and more by larger organizations that have been unable to
    transform their existing development staff.


    # COACHING


    Does an Agile team need a coach? The short answer is “No.” The longer answer is
    “Sometimes.”


    First, we need to differentiate between Agile trainers and Agile coaches. An Agile
    trainer teaches a team how to conduct themselves in an Agile way. They are often
    hired from outside the company or are internal trainers from outside the team.
    Their goal is to inculcate the Agile values and teach the Agile disciplines. Their
    tenure should be short. Each team of a dozen or so developers should require no
    more than one or two weeks of training. Everything else they need to learn they’re
    going to learn by themselves no matter what the Agile trainer says or does.


    Early in the transition of a team, a trainer may temporarily fill the role of
    the coach, but this is a temporary situation. That role should be filled from
    within the team as soon as possible.


    In general, Agile coaches are not trainers. They are members of the team whose
    role is to defend the process within the team. In the heat of development, developers
    may be tempted to go off process. Perhaps they inadvertently stop pairing, stop
    refactoring, or ignore failures in the continuous build. It is the coach’s job
    to see this and point it out to the team. The coach acts as the team’s conscience,
    always reminding the team of the promises they made to themselves and the values
    they agreed to hold.'
