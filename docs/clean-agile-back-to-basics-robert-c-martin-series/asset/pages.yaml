  md: '# The Three Rules of TDD


    TDD can be described with three simple rules.


    +   - Do not write any production code until you have first written a test that
    fails due to the lack of that code.

    +   - Do not write more of a test than is sufficient to fail—and failing to compile
    counts as a failure.

    +   - Do not write more production code than is sufficient to pass the currently
    failing test.


    A programmer with more than a few months’ experience will likely consider these
    rules to be outlandish, if not downright stupid. They imply a cycle of programming
    that is perhaps five seconds long. The programmer begins by writing some test
    code for production code that does not yet exist. This test fails to compile almost
    immediately because it mentions elements of the production code that have not
    yet been written. The programmer must stop writing the test and start writing
    production code. But after only a few keystrokes, the test that failed to compile
    now compiles properly. This forces the programmer to return to the test and continue
    to add to it.


    This oscillation between the test and the production code is just a few seconds
    long, and the programmers are trapped within this cycle. The programmers will
    never again be able to write an entire function, or even a simple if statement
    or while loop, without interrupting themselves by writing the complimentary test
    code.


    Most programmers initially view this as a disruption of their thought processes.
    This continual interruption imposed by the Three Rules prevents them from properly
    thinking through the code that they are writing. They often feel that the Three
    Rules create an intolerable distraction.


    However, imagine a group of programmers following these Three Rules. Choose any
    one of those programmers you like, at any time. Everything that programmer was
    working on executed and passed all its tests less than a'
