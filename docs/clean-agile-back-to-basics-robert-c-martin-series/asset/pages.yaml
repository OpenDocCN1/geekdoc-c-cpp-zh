- pgno: 136
  md: '# The Cost of Cheating


    There have been teams who, under the pressure of a deadline, have allowed the
    continuous build to remain in a failed state. This is a suicidal move. What happens
    is that everyone gets tired of the continuous barrage of failure emails from the
    continuous build server, so they remove the failing tests with the promise that
    they’ll go back and fix them “later.”


    Of course, this causes the continuous build server to start sending success emails
    again. Everyone relaxes. The build is passing. And everyone forgets about the
    pile of failing tests that they set aside to be fixed “later.” And so a broken
    system gets deployed.


    # Standup Meetings


    Over the years, there has been a great deal of confusion about “The Daily Scrum”
    or the “Standup Meeting.” Let me cut through all that confusion now.


    The following are true of the Standup Meeting:


    +   - This meeting is optional. Many teams get by just fine without one.

    +   - It can be less often than daily. Pick the schedule that makes sense to you.

    +   - It should take ~10 minutes, even for large teams.

    +   - This meeting follows a simple formula.


    The basic idea is that the team members stand⁹ in a circle and answer three questions:


    +   1. What did I do since the last meeting?

    +   2. What will I do until the next meeting?

    +   3. What is in my way?


    ⁹. This is why it’s called a “standup” meeting.'
  merge: -1
  img_proc: true
