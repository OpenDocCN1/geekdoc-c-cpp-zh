- pgno: 172
  md: 'The problem that was not solved back in the late ’80s when the Agile movement
    began was the problem of *small software teams*. We did not know how to effectively
    organize a relatively small group of programmers to be effective. And it was *this*
    problem that Agile solved.


    It’s important to understand that this was a *software* problem, not a small team
    problem. The problem of small teams had been solved millennia before by military
    and industrial organizations around the world. The Romans could not have conquered
    Europe if they had not solved the problem of organizing small squads.


    Agile is the set of disciplines by which we organize small software teams. Why
    do we need a special technique for this? Because software is unique. There are
    very few tasks like it. The cost/benefit and risk/reward trade-offs in software
    are different from just about every other kind of work. Software is like building,
    except nothing physical gets built. Software is like mathematics, except that
    nothing can be proven. Software is as empirical as science, but there are no physical
    laws to be discovered. Software is like accounting, except it describes time-ordered
    behavior instead of numerical facts.


    Software is really like nothing else. So in order to organize a small team of
    software developers, we need a special set of disciplines that are tuned to the
    unique aspects of software.


    Look back through the disciplines and practices that we’ve been talking about
    in this book. You’ll note that each one of them, almost without exception, is
    tweaked and tuned specifically for the unique aspects of software. This ranges
    from the obvious practices like Test Driven Development and Refactoring to the
    more subtle implications of The Planning Game.


    The bottom line here is that *Agile* is *about software*. In particular, it is
    about *small software teams*. I am always frustrated when people ask me how to'
