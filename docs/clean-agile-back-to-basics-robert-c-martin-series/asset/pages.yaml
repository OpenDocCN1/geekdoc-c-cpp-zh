  md: 'This rejection of detail is a *discipline*. And it’s hard. Everyone on the
    team will feel the need to capture all the details discussed in one way or another.
    Resist this urge!


    I once worked with a project manager who absolutely insisted on writing down every
    detail about each and every story on the story card. The story cards were filled
    with paragraphs and paragraphs in tiny little print. They became impenetrable
    and unusable. They had so much detail on them they could not be estimated. They
    could not be scheduled. They were useless. Worse, there was so much effort invested
    into each story card that they could not be discarded.


    What makes a story manageable, schedulable, and estimable is the temporary lack
    of detail. Stories must start out cheap because a lot of them are going to be
    modified, split, merged, or even discarded. Just keep reminding yourself that
    they are placeholders, not requirements.


    Now we have a batch of story cards created in Iteration Zero. Others will be created
    later as new features and new ideas are encountered. In fact, the process of story
    creation never ends. Stories are always being written, changed, discarded, and
    (most importantly) developed over the course of the project.


    # Estimating the Stories


    Imagine that these cards are on the table in front of you, and sitting around
    the table are other developers, testers, and stakeholders. You have all met in
    order to *estimate* these cards. There will be many meetings like this. They will
    be convened any time new stories are added or something new has been learned about
    old stories. Expect such meetings to be an informal but regular event in each
    iteration.


    However, it’s still early in Iteration Zero, and this estimation meeting is the
    first. None of the stories has yet been estimated.


    So, we pick a story from the batch that we consider to be of average complexity.
    Perhaps it is the *Login* story. Many of us were there when the'
