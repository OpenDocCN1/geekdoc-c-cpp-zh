- pgno: 87
  md: 'In any case, the right to accept comes with a cost. Acceptance implies responsibility.
    The accepting developer becomes responsible for the quality and execution of the
    task, for continually updating the estimate so that the schedule can be managed,
    for communicating status to the whole team, and for asking for help when help
    is needed.


    Programming on a team involves working closely together with juniors and seniors.
    The team has the right to collaboratively decide who will do what. A technical
    leader might ask a developer to take a task but has no right to force a task on
    anyone.


    # # Conclusion


    Agile is a framework of disciplines that support professional software development.
    Those who profess these disciplines accept and conform to the reasonable expectations
    of managers, stakeholders, and customers. They also enjoy and abide by the rights
    that Agile confers to developers and customers. This mutual acceptance and conference
    of rights and expectations—this profession of disciplines—is the foundation of
    an ethical standard for software.


    Agile is not a process. Agile is not a fad. Agile is not merely a set of rules.
    Rather, Agile is a set of rights, expectations, and disciplines of the kind that
    form the basis of an ethical profession.'
