    And they have a point, don’t they?


    # ## The Death March Phase


    So now we enter the Death March Phase of the project. Customers are angry. Stakeholders
    are angry. The pressure mounts. Overtime soars. People quit. It’s hell.


    Sometime in March, we deliver some limping thing that sort of half does what the
    customers want. Everybody is upset. Everybody is demotivated. And we promise ourselves
    that we will never do another project like this. Next time we’ll do it right!
    Next time we’ll do more analysis and more design.


    I call this *Runaway Process Inflation*. We’re going to do the thing that didn’t
    work, and do a lot more of it.'
