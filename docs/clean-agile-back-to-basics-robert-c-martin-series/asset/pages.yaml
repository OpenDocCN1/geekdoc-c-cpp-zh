  md: 'story was written, so we heard the kinds of details that the stakeholders imagined
    would be part of this story. We will likely ask the stakeholders to review those
    details now, just so that we all have the proper context.


    Then, we choose a number of points for the story. The *Login* story will cost
    3 points of development effort (Figure 3.1). Why 3? Why not? *Login* is an average
    story, and so we give it an average cost. Three is average if our stories range
    in cost from 1 to 6.


    ![](img/8facf878fd02eafcdb1e1193ad5963b0_95_0.png)


    **Figure 3.1** The Login story gets assigned three points


    *Login* is now our *Golden Story*. It is the standard against which all other
    stories will be compared. So, for example, logging out is a lot simpler than logging
    in. We’ll give the *Logout* story 1 point. *Withdrawal* is perhaps twice as hard
    as *Login*, so we’ll say it’s a 6. *Deposit* is similar to *Withdrawal* but perhaps
    not quite as hard, so we’ll give it a 5. Finally, *Transfer* is about the same
    as *Login*, so we’ll give it a 3.


    We write these numbers up in one corner of each story card that we estimate. It’ll
    talk much more about the estimation process later. For now, let’s just say that
    we now have a batch of story cards with estimates on them that range from 1 to
    6. Why 1 to 6? Why not? There are many schemes for assigning cost. The simpler
    ones are usually better.


    At this point, you may be wondering what these points are really measuring. Perhaps
    you think they are hours, days, weeks, or some other unit of time.'
