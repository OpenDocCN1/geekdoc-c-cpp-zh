  md: 'For example, you may not know how long something will take, but you can compare
    one task to another in relative terms. You may not know how long it will take
    to build the *Login* page, but you might be able to tell me that the *Change Password*
    page will take about half the time as *Login*. Relative estimates like that are
    immensely valuable, as we will see in a later chapter.


    Or, instead of estimating in relative terms, you may be able to give me a range
    of probabilities. For example, you might tell me that the *Login* page will take
    anywhere from 5 to 15 days to complete with an average completion time of 12 days.
    Such estimates combine what you do and don’t know into an honest probability for
    managers to manage.


    The Agile practices of the Planning Game and Whole Team support this expectation.


    # You Need to Say “No”


    While it is important to strive to find solutions to problems, I expect you to
    say “no” when no such solution can be found. You need to realize that you were
    hired more for your ability to say “no” than for your ability to code. You, programmers,
    are the ones who know whether something is possible. As your CTO, I am counting
    on you to inform us when we are headed off a cliff. I expect that, no matter how
    much schedule pressure you feel, no matter how many managers are demanding results,
    you will say “no” when the answer really is “no.”


    The Agile practice of Whole Team supports this expectation.


    # Continuous Aggressive Learning


    As CTO, I expect you to keep learning. Our industry changes quickly. We must be
    able to change with it. So learn, learn, learn! Sometimes the company can afford
    to send you to courses and conferences. Sometimes the company can afford to buy
    books and training videos. But if not, then you must find ways to continue learning
    without the company’s help.


    The Agile practice of Whole Team supports this expectation.'
