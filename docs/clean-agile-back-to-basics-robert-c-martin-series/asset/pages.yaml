  md: 'and trust them to get the job done.” In support of this, the Agile community
    has a whole host of scaling patterns that are compatible with the values and principles
    of the Agile Manifesto. I am not referring to frameworks here, but rather the
    individual practices from which all of the frameworks are built.


    All of the frameworks are basically “ready-made” recipes composed of individual
    Agile practices. Rather than implementing one of these recipes, consider using
    Agile and coaching to discover and implement a custom recipe that is tailor-made
    to your specific circumstances. If, in the end, that recipe ends up being SAFe,
    Nexus, LeSS, or Scrum@Scale, that’s great!


    Here is an overview of how the most successful enterprise Agile coaches combine
    Agile and coaching to discover and implement Agile in a way that is perfect for
    the organization. The essence of coaching at the individual level is helping people
    solve problems on their own. Coaching at the team and organizational levels means
    helping teams achieve their goals on their own. First, the coach thinks of everyone
    affected by the Agile adoption as “the customers.” Then, using retrospectives,
    open-space events, and similar techniques, they discover what the customers see
    as the challenges and opportunities. This becomes the organization’s Agile adoption
    backlog. Next, using group decision-making tools such as dot voting, the coach
    determines the top of the backlog. They then assist the organization to implement
    a handful of the top backlog items. Finally, they retrospect and repeat. Of course,
    for many of the people involved, this will be their first Agile adoption. Coaching
    alone is not enough; teaching and mentoring will also come into play so that people
    will be able to make informed decisions.


