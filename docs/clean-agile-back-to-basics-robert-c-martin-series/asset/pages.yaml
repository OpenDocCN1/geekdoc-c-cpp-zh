    **Figure 1.8** The Circle of Life


    I have chosen the practices of XP for this book because, of all the Agile processes,
    XP is the best defined, the most complete, and the least muddled. Virtually all
    other Agile processes are a subset of or a variation on XP. This is not to say
    that these other Agile processes should be discounted. You may, in fact, find
    them valuable for various projects. But if you want to understand what Agile is
    really all about, there is no better way than to study XP. XP is the prototype,
    and the best representative, of the essential core of Agile.


    Kent Beck is the father of XP, and Ward Cunningham is the grandfather. The two
    of them, working together at Tektronix in the mid ’80s, explored many of the ideas
    that eventually became XP. Kent later refined those ideas into the concrete form
    that became XP, circa 1996. In 2000, Beck published the definitive work: *Extreme
    Programming Explained: Embrace Change.*²³


