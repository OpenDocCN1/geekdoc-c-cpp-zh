- pgno: 43
  md: 'Figure 1.3 is called a *burn-down chart*. It shows how many points remain until
    the next major milestone. Notice how it declines each week. Note that it declines
    less than the number of points in the velocity chart. This is because there is
    a constant background of new requirements and issues being discovered during development.


    Notice that the burn-down chart has a slope that predicts when the milestone will
    probably be reached. Virtually anyone can walk into the room, look at these two
    charts, and come to the conclusion that the milestone will be reached in June
    at a rate of 45 points per week.


    Note that there is a glitch on the burn-down chart. The week of February 17 lost
    ground somehow. This might have been due to the addition of a new feature or some
    other major change to the requirements. Or it might have been the result of the
    developers re-estimating the remaining work. In either case, we want to know the
    effect on the schedule so that the project can be properly managed.


    It is a critical goal of Agile to get those two charts on the wall. One of the
    driving motivations for Agile software development is to provide the data that
    managers need to decide how to set the coefficients on the Iron Cross and drive
    the project to the best possible outcome.


    Many people would disagree with that last paragraph. After all, the charts aren’t
    mentioned in the Agile Manifesto, nor do all Agile teams use such charts. And,
    to be fair, it’s not actually the charts that matter. What matters is the data.


    Agile development is first and foremost a feedback-driven approach. Each week,
    each day, each hour, and even each minute is driven by looking at the results
    of the previous week, day, hour, and minute, and then making the appropriate adjustments.
    This applies to individual programmers, and it also applies to the management
    of the entire team. Without data, the project cannot be managed.¹⁹


