    # Here Endeth the Overview


    What you have just read is the 20,000 foot view of Agile. A lot of details are
    missing, but this is the gist of it. Agile is a process wherein a project is subdivided
    into iterations. The output of each iteration is measured and used to continuously
    evaluate the schedule. Features are implemented in the order of business value
    so that the most valuable things are implemented first. Quality is kept as high
    as possible. The schedule is primarily managed by manipulating scope.


    That’s Agile.


