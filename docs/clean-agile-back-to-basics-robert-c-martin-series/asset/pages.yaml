- pgno: 46
  md: 'If you read books on software analysis you’ll find that there are as many definitions
    of analysis as there are authors. There is no real consensus on just what analysis
    is. It might be creating the work breakdown structure of the requirements. It
    might be the discovery and elaboration of the requirements. It might be the creation
    of the underlying data model, or object model, or… The best definition of analysis
    is: It’s what analysts do.


    Of course, some things are obvious. We should be sizing the project and doing
    basic feasibility and human resources projections. We should be ensuring that
    the schedule is achievable. That is the least that our business would be expecting
    of us. Whatever this thing called analysis is, it’s what we are going to be doing
    for the next two months.


    This is the honeymoon phase of the project. Everyone is happily surfing the web,
    doing a little day-trading, meeting with customers, meeting with users, drawing
    nice diagrams, and in general having a great time.


    Then, on July 1, a miracle happens. We’re done with analysis.


    Why are we done with analysis? Because it’s July 1. The schedule said we were
    supposed to be done on July 1, so we’re done on July 1. Why be late?


    So we have a little party, with balloons and speeches, to celebrate our passage
    through the phase gate and our entry into the Design Phase.


    # The Design Phase


    So now what are we doing? We are designing, of course. But just what is *designing?*


    We have a bit more resolution about software design. Software design is where
    we split the project up into modules and design the interfaces between those modules.
    It’s also where we consider how many teams we need and what the connections between
    those teams ought to be. In general, we are expected to refine the schedule in
    order to produce a realistically achievable implementation plan.'
