- pgno: 28
  md: 'In February 2001, a group of 17 software experts gathered in Snowbird, Utah,
    to talk over the deplorable state of software development. At that time, most
    software was created using ineffective, heavyweight, high-ritual processes like
    Waterfall and overstuffed instances of the Rational Unified Process (RUP). The
    goal of these 17 experts was to create a manifesto that introduced a more effective,
    lighter-weight, approach.


    This was no mean feat. The 17 were people of varied experience and strong divergent
    opinions. Expecting such a group to come to consensus was a long shot. And yet,
    against all odds, consensus was reached, the Agile Manifesto was written, and
    one of the most potent and long-lived movements in the software field was born.


    Movements in software follow a predictable path. At first there is a minority
    of enthusiastic supporters, another minority of enthusiastic detractors, and a
    vast majority of those who don’t care. Many movements die in, or at least never
    leave, that phase. Think of aspect-oriented programming, or logic programming,
    or CRC cards. Some, however, cross the chasm and become extraordinarily popular
    and controversial. Some even manage to leave the controversy behind and simply
    become part of the mainstream body of thought. Object Orientation (OO) is an example
    of the latter. And so is Agile.


    Unfortunately, once a movement becomes popular, the name of that movement gets
    blurred through misunderstanding and usurpation. Products and methods having nothing
    to do with the actual movement will borrow the name to cash in on the name’s popularity
    and significance. And so it has been with Agile.


    The purpose of this book, written nearly two decades after the Snowbird event,
    is to set the record straight. This book is an attempt to be as pragmatic as possible,
    describing Agile without nonsense and in no uncertain terms.


    Presented here are the fundamentals of Agile. Many have embellished and extended
    these ideas—and there is nothing wrong with that. However, those extensions and
    embellishments are not Agile. They are Agile plus something else. What you will
    read here is what Agile is, what Agile was, and what Agile will inevitably always
    be.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# HISTORY OF AGILE


    When did Agile begin? Probably more than 50,000 years ago when humans first decided
    to collaborate on a common goal. The idea of choosing small intermediate goals
    and measuring the progress after each is just too intuitive, and too human, to
    be considered any kind of a revolution.


    When did Agile begin in modern industry? It’s hard to say. I imagine the first
    steam engine, the first mill, the first internal combustion engine, and the first
    airplane were produced by techniques that we would now call Agile. The reason
    for that is that taking small measured steps is just too natural and human for
    it to have happened any other way.


    So when did Agile begin in software? I wish I could have been a fly on the wall
    when Alan Turing was writing his 1936 paper.¹ My guess is that the many “programs”
    he wrote in that book were developed in small steps with plenty of desk checking.
    I also imagine that the first code he wrote for the Automatic Computing Engine,
    in 1946, was written in small steps, with lots of desk checking, and even some
    real testing.


    The early days of software are loaded with examples of behavior that we would
    now describe as Agile. For example, the programmers who wrote the control software
    for the Mercury space capsule worked in half-day steps that were punctuated by
    unit tests.


    Much has been written elsewhere about this period. Craig Larman and Vic Basili
    wrote a history that is summarized on Ward Cunningham’s wiki,² and also in Larman’s
    book, *Agile & Iterative Development: A Manager’s Guide*.³


    +   1. Turing, A. M. 1936. On computable numbers, with an application to the Entscheidungsproblem
    [proof]. *Proceedings of the London Mathematical Society*, 2 (published 1937),
    42(1):230–65. The best way to understand this paper is to read Charles Petzold’s
    masterpiece: Petzold, C. 2008. *The Annotated Turing: A Guided Tour through Alan
    Turing’s Historic Paper on Computability and the Turing Machine*. Indianapolis,
    IN: Wiley.

    +   2. Ward’s wiki, t2.com, is the original wiki—the first ever to have appeared
    in the Internet. Long may it be served.

    +   3. Larman, C. 2004. *Agile & Iterative Development: A Manager’s Guide*. Boston,
    MA: Addison-Wesley.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'But Agile was not the only game in town. Indeed, there was a competing methodology
    that had enjoyed considerable success in manufacturing and industry at large:
    Scientific Management.


    Scientific Management is a top-down, command-and-control approach. Managers use
    scientific techniques to ascertain the best procedures for accomplishing a goal
    and then direct all subordinates to follow their plan to the letter. In other
    words, there is big up-front planning followed by careful detailed implementation.


    Scientific Management is probably as old as the pyramids, Stonehenge, or any of
    the other great works of ancient times, because it is impossible to believe that
    such works could have been created without it. Again, the idea of repeating a
    successful process is just too intuitive, and human, to be considered some kind
    of a revolution.


    Scientific Management got its name from the works of Frederick Winslow Taylor
    in the 1880s. Taylor formalized and commercialized the approach and made his fortune
    as a management consultant. The technique was wildly successful and led to massive
    increases in efficiency and productivity during the decades that followed.


    And so it was that in 1970 the software world was at the crossroads of these two
    opposing techniques. Pre-Agile (Agile before it was called “Agile”) took short
    reactive steps that were measured and refined in order to stagger, in a directed
    random walk, toward a good outcome. Scientific Management deferred action until
    a thorough analysis and a resulting detailed plan had been created. Pre-Agile
    worked well for projects that enjoyed a low cost of change and solved partially
    defined problems with informally specified goals. Scientific Management worked
    best for projects that suffered a high cost of change and solved very well-defined
    problems with extremely specific goals.


    The question was, what kinds of projects were software projects? Were they high
    cost of change and well defined with specific goals, or were they low cost of
    change and partially defined with informal goals?'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Don’t read too much into that last paragraph. Nobody, to my knowledge, actually
    asked that question. Ironically, the path we chose in the 1970s appears to have
    been driven more by accident than intent.


    In 1970, Winston Royce wrote a paper⁴ that described his ideas for managing large-scale
    software projects. The paper contained a diagram (Figure 1.1) that depicted his
    plan. Royce was not the originator of this diagram, nor was he advocating it as
    a plan. Indeed, the diagram was set up as a straw man for him to knock down in
    the subsequent pages of his paper.


    ![](img/8facf878fd02eafcdb1e1193ad5963b0_31_0.png)


    **Figure 1.1** Winston Royce’s diagram that inspired Waterfall development


    Nevertheless, the prominent placing of the diagram, and the tendency for people
    to infer the content of a paper from the diagram on the first or second page,
    led to a dramatic shift in the software industry.


    4. Royce, W. W. 1970. Managing the development of large software systems. *Proceedings,
    IEEE WESCON*, August: 1–9. Accessed at http://www-scf.usc.edu/~csci201/lectures/Lecture11/royce1970.pdf.'
