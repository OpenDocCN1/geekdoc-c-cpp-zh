  md: 'touching it?” Because you know if you touch it, you will break it; and if you
    break it, it will become yours. So you back away from the one thing that might
    improve the code: cleaning it.


    This is a fearful reaction. You fear the code, and this fear forces you to behave
    incompetently. You are incompetent to do the necessary cleaning because you fear
    the outcome. You have allowed this code, which you created, to go so far out of
    your control that you fear any action to improve it. This is irresponsible in
    the extreme.


    Customers, users, and managers expect *fearless competence*. They expect that
    if you see something wrong or dirty, you will fix and clean it. They don’t expect
    you to allow problems to fester and grow; they expect you to stay on top of the
    code, keeping it as clean and clear as possible.


    So how do you eliminate that fear? Imagine that you own a button that controls
    two lights: one red, the other green. Imagine that when you push this button,
    the green light is lit if the system works, and the red light is lit if the system
    is broken. Imagine that pushing that button and getting the result takes just
    a few seconds. How often would you push that button? You’d never stop. You’d push
    that button all the time. Whenever you made any change to the code, you’d push
    that button to make sure you hadn’t broken anything.


    Now imagine that you are looking at some ugly code on your screen. Your first
    thought is, “I should clean it.” And then you simply start to clean it, pushing
    the button after each small change to make sure you haven’t broken anything.


    The fear is gone. You can clean the code. You can use the Agile practices of Refactoring,
    Pairing, and Simple Design to improve the system.


    How do you get that button? The Agile practice of TDD provides that button for
    you. If you follow that practice with discipline and determination, you will have
    that button, and you will be fearlessly competent.'
