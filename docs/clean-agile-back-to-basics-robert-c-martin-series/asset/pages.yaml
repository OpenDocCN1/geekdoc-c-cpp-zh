  md: '# COMPLETENESS


    Now let’s return to after-the-fact tests. You somehow feel obligated to write
    these tests even though you’ve tested the system manually, and you already know
    it works. You proceed from test to test being unsurprised by the fact that the
    tests pass.


    Inevitably, you will come to a test that’s hard to write. It’s hard to write because
    when you wrote the code you weren’t thinking about testability, and you did not
    design it to be testable. To write a test for this code, you are going to have
    to change the structure by breaking some couplings, adding some abstractions,
    and/or rerouting some function calls and arguments. This feels like a lot of effort,
    especially because you already know the code works.


    The schedule is tight, and you know you have more pressing things to do. So, you
    set that test aside. You convince yourself either that it is unnecessary or that
    you’ll go back and write it later. Thus, you leave a hole in the test suite.


    And since you have left holes in the test suite, you suspect everyone else has,
    too. When you execute the test suite and see it pass, you laugh, smirk, or derisively
    wave your hand because you know that the passing of the suite doesn’t mean that
    the system works.


    When such a test suite passes, there is no decision you can make. The only information
    that the passing tests give you is that nothing *tested* is broken. The incompleteness
    of the test suite leaves you with no options. However, if you follow the Three
    Rules, then every line of production code was written in order to make a test
    pass. Therefore, the test suite is very complete. When it passes, you can make
    a decision. That decision is to *deploy*.


    That’s the goal. We want to create a suite of automated tests that tells us that
    it is safe to deploy the system.'
