  md: '# What About the Cost?


    It is hard to measure the cost of pairing. The most direct cost is that there
    are two people working on a single problem. It should be obvious that this does
    not double the effort to solve the problem; however, it does likely cost something.
    Various studies have indicated that the direct cost might be about 15%. In other
    words, it would require 115 pairing programmers to do the same work of 100 individuals
    (without code reviews).


    A naive calculation would suggest that a team that pairs 50% of the time would
    suffer something less than 8% in productivity. On the other hand, if the practice
    of pairing replaces code reviews, then there is likely no reduction in productivity
    at all.


    Then we must consider the benefits of the cross-training knowledge exchange and
    intense collaboration. These benefits are not easily quantifiable, but they are
    also likely significant.


    My experience and the experience of many others is that pairing, when done informally
    and at the programmers’ discretion, is quite beneficial to the whole team.


    # Just Two?


    The word “pair” implies that there are just two programmers involved in a pairing
    session. While this is typically true, it is not a rule. Sometimes three, four,
    or more will decide to work together on a given problem. (Again, this is at the
    programmers’ discretion.) This is sometimes known as “mob programming.”⁵,⁶


    # Management


    Programmers often fear that managers will frown upon pairing and might even demand
    that pairs break up and stop wasting time. I’ve never seen this


