- pgno: 75
  md: 'Customers and managers don’t expect software teams to slow down with time.
    Rather, they expect that a feature similar to one that took two weeks at the start
    of a project will take two weeks a year later. They expect productivity to be
    stable over time.


    Developers should expect no less. By continuously keeping the architecture, design,
    and code as clean as possible, they can keep their productivity high and prevent
    the otherwise inevitable spiral into low productivity and redesign.


    As we will show, the Agile practices of Testing, Pairing, Refactoring, and Simple
    Design are the technical keys to breaking that spiral. And the Planning Game is
    the antidote to the schedule pressure that drives that spiral.


    # INEXPENSIVE ADAPTABILITY


    Software is a compound word. The word “ware” means “product.” The word “soft”
    means easy to change. Therefore, software is a product that is easy to change.
    Software was invented because we wanted a way to quickly and easily change the
    behavior of our machines. Had we wanted that behavior to be hard to change, we
    would have called it hardware.


    Developers often complain about changing requirements. I have often heard statements
    like, “That change completely thwarts our architecture.” I’ve got some news for
    you, sunshine. If a change to the requirements breaks your architecture, then
    your architecture sucks.


    We developers should celebrate change because that’s why we are here. Changing
    requirements is the name of the whole game. Those changes are the justification
    for our careers and our salaries. Our jobs depend on our ability to accept and
    engineer changing requirements and to make those changes relatively inexpensive.


    To the extent that a team’s software is hard to change, that team has thwarted
    the very reason for that software’s existence. Customers, users, and managers
    expect that software systems will be easy to change and that the cost of such
    changes will be small and proportionate.'
