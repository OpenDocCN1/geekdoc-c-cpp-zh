    # ## Behavior-Driven Development


    After the turn of the millennium, Dan North began working on a redefinition of
    TDD that he called *Behavior-Driven Development* (BDD). His goal was to remove
    the techie jargon from the tests and make the tests appear more like specifications
    that businesspeople would appreciate.


    At first, this was just another attempt at formalizing the language of testing,
    in this case using three special adverbs: *Given*, *When*, and *Then*. Several
    tools were created or modified to support this language. Among them are JBehave,
    Cucumber, and FitNesse. But over time, the emphasis changed from tools and tests
    to requirements and specification.


    The proponents of BDD suggest that businesses can derive great value by specifying
    their systems in a formal scenario-based language like Given-When-Then, regardless
    of whether they actually automate those requirements as tests.


    This relieves the businesspeople from conforming to the technical requirements
    involved with writing truly executable tests, while at the same time allowing
    them to be formal and precise.


    # ## The Practice


    Despite all the controversy and confusion described above, the practice of *Acceptance
    Testing* is actually quite simple. The business writes formal tests describing
    the behavior of each user story, and developers automate those tests.


    The tests are written by business analysts and QA before the first half of the
    iteration in which the stories they test are to be developed. The developers'
