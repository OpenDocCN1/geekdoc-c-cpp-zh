  md: '# What Is Pairing?


    Pairing is the act of two people working together on a single programming problem.
    The pair may work together at the same workstation, sharing the screen, keyboard,
    and mouse. Or they may work on two connected workstations so long as they see
    and manipulate the same code. The latter option works nicely with popular screen-sharing
    software. That software also allows the partners to be remote from each other,
    so long as they have a good data and voice link.


    Pairing programmers sometimes adopt different roles. One may be the driver and
    the other the navigator. The driver has the keyboard and mouse; the navigator
    takes a longer view and makes recommendations. Another role option is for one
    programmer to write a test, and the other to make it pass and write the next test
    for the first programmer to pass. This is sometimes called *Ping-Pong*.


    Most often, however, there are no roles at all. The programmers are simply co-equal
    authors sharing the mouse and keyboard in a cooperative manner.


    Pairs are not scheduled. They form and break up according to the programmers’
    preference. Managers should not try to create pairing schedules or pairing matrices.


    Pairs are generally short-lived. A pairing session can last as long as a day,
    but more often they last no more than an hour or two. Even pairings as short as
    15 to 30 minutes can be beneficial.


    Stories are not assigned to pairs. Individual programmers, and not pairs, are
    responsible for completing stories. The duration of a story is generally much
    longer than a single pairing.


    Over the course of a week, each programmer will spend about half of their pairing
    time on their own tasks, recruiting the help of several others. The other half
    of their pairing time will be spent helping others with their tasks.'
