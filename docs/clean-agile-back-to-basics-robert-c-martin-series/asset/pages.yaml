- pgno: 148
  md: 'Imagine that you are looking at some old code on your screen, and it’s a mess.
    You think to yourself, “I should clean this up.” But your next thought is, “I’m
    not touching it!” Because you know if you touch it, you will break it; and if
    you break it, it becomes yours. So you back away from the code, leaving the mess
    to fester and rot.


    This is a fear reaction. You fear the code. You fear touching it. You fear what
    will happen to you if you break it. So, you fail to do the one thing that could
    improve the code—you fail to clean it.


    If everyone on the team behaves this way, then the code must rot. No one will
    clean it. No one will improve it. Every feature added will be added in such a
    way as to minimize the immediate risk to the programmers. Couplings and duplications
    will be added because they minimize the immediate risk, even though they corrupt
    the design and integrity of the code.


    Eventually the code will become such a horrible mass of unmaintainable spaghetti
    that little to no progress can be made with it. Estimates will grow exponentially.
    Managers will become desperate. More and more programmers will be hired in the
    hopes of increasing productivity, but that increase will not be realized.


    Finally, in utter desperation, the managers will agree to the programmers’ demands
    that the whole system should be rewritten from scratch, and the cycle will begin
    again.


    Imagine a different scenario. Go back to that screen with the messy code. Your
    first thought was to clean it. What if you had a test suite that was so complete
    that you trusted it when it passed? What if that test suite ran quickly? What
    would your next thought be? It would be something like this:


    > *Gosh, I think I’ll change the name of that variable. Ah, the tests still pass.
    OK, now I’ll split that big function into two smaller functions… Good, the tests
    still pass…. OK, now I think I can move one of those new functions over into a
    different class. Whoops! The tests failed. Put it back… Ah, I see, I needed to
    move that variable as well. Yes, the tests still pass…*'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'When you have a complete test suite, you lose your fear of changing the code.
    You lose your fear of *cleaning* the code. So, you will *clean* the code. You
    will keep the system neat and orderly. You will keep the design of the system
    intact. You will *not* create the festering mass of spaghetti that would drag
    the team into the doldrums of low productivity and eventual failure.


    That is why we practice TDD. We practice it because it gives us the courage to
    keep the code clean and orderly. It gives us the courage to act like professionals.


    # # Refactoring


    *Refactoring* is another one of those topics that requires a book to describe.
    Fortunately, Martin Fowler has done a superb job with just such a book.³ In this
    chapter I’ll simply discuss the discipline, not the specific techniques. Again,
    this chapter contains no code.


    Refactoring is the practice of *improving* the structure of the code without altering
    the behavior, as defined by the tests. In other words, we make changes to the
    names, the classes, the functions, and the expressions without breaking any of
    the tests. We improve the structure of the system, without affecting the behavior.


    Of course, this practice couples strongly with TDD. To fearlessly refactor the
    code, we need a test suite that gives us very high confidence that we aren’t breaking
    anything.


    The kinds of changes made during refactoring range from trivial cosmetics to deep
    restructurings. The changes might be simple name changes or complex reshufflings
    of switch statements to polymorphic dispatches. Large functions will be split
    into smaller, better-named, functions. Argument lists will be changed into objects.
    Classes with many methods will be split into many


    ³. Fowler, M. 2019. *Refactoring: Improving the Design of Existing Code*, 2nd
    ed. Boston, MA: Addison-Wesley.'
