  md: '# Changing the Schedule


    Let’s start with the schedule. Let’s ask the stakeholders if we can delay the
    project from November 1 to March 1. These conversations usually don’t go well.
    Remember, the date was chosen for good business reasons. Those business reasons
    probably haven’t changed. So a delay often means that the business is going to
    take a significant hit of some kind.


    On the other hand, there are times when the business simply chooses the date for
    convenience. For example, maybe there is a trade show in November where they want
    to show off the project. Perhaps there’s another trade show in March that would
    be just as good. Remember, it’s still early. We’re only a few iterations into
    this project. We want to tell the stakeholders that our delivery date will be
    March *before* they buy the booth space at the November show.


    Many years ago, I managed a group of software developers working on a project
    for a telephone company. In the midst of the project, it became clear that we
    were going to miss the expected delivery date by six months. We confronted the
    telephone company executives about this as early as we could. These executives
    had never had a software team tell them, early, that the schedule would be delayed.
    They stood up and gave us a standing ovation.


    You should not expect this. But it did happen to us. Once.


    # Adding Staff


    In general, the business is simply not willing to change the schedule. The date
    was chosen for good business reasons, and those reasons still hold. So let’s try
    to add staff. Everyone knows we can go twice as fast by doubling the staff.


    Actually, this is exactly the opposite of the case. Brooks’ law² states: *Adding
    manpower to a late project makes it later.*


    ²². Brooks, Jr., F. P. 1995 [1975]. *The Mythical Man-Month*. Reading, MA: Addison-Wesley.
    https://en.wikipedia.org/wiki/Brooks%27s_law'
