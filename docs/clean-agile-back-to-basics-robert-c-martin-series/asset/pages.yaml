  md: 'In short, we cannot agree to deliver fixed scopes on hard dates. Either the
    scopes or the dates must be soft. We represent that softness with probability
    curve. For example, we estimate that there is a 95% probability that we can get
    the first ten stories done by the date. A 50% chance that we can get the next
    five done by the date. And a 5% chance that the five after that might get done
    by the date.


    Customers have the right to this kind of probability-based plan because they cannot
    manage their business without it.


    > *Customers have the right to get the most possible value out of every iteration.*


    Agile breaks up the development effort into fixed time boxes called *iterations*.
    The business has the right to expect that the developers will work on the most
    important things at any given time, and that each iteration will provide them
    the maximum possible *usable* business value. This priority of value is specified
    by the customer during the planning sessions at the beginning of each iteration.
    The customers choose the stories that give them the highest return on investment
    and that can fit within the developer’s estimation for the iteration.


    > *Customers have the right to see progress in a running system, proven to work
    by passing repeatable tests that they specify.*


    This seems obvious when you think about it from the customer’s point of view.
    Of course they have the right to see incremental progress. Of course they have
    the right to specify the criteria for accepting that progress. Of course they
    have the right to quickly and repeatedly see proof that their acceptance criteria
    have been met.


    > *Customers have the right to change their minds, to substitute functionality,
    and to change priorities without paying exorbitant costs.*


    After all, this is software. The whole point of software is to be able to easily
