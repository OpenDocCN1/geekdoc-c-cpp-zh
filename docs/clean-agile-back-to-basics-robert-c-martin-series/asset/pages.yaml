  md: 'been given to the *Metaphor* practice. What the team needs is a model of the
    problem domain, which is described by a vocabulary that everyone agrees on. And
    I mean *everyone*—the programmers, QA, managers, customers, users… *everyone.*


    In the 1970s, Tom DeMarco called such models *Data Dictionaries.*³ They were simple
    representations of the data manipulated by the application and the processes that
    manipulated that data. Evans greatly amplified the simple idea into a discipline
    of modeling the domain. Both DeMarco and Evans use those models as vehicles to
    communicate with all of the stakeholders.


    As a simple example, I recently wrote a video game called SpaceWar. The data elements
    were things like Ship, Klingon, Romulan, Shot, Hit, Explosion, Base, Transport,
    etc. I was careful to isolate each of these concepts into their own models and
    to use those names exclusively throughout the application. Those names were my
    Ubiquitous Language.


    The Ubiquitous Language is used in all parts of the project. The business uses
