    # QA and Acceptance Tests


    If QA has not already begun to write the automated acceptance tests, they

    should start as soon as the IPM ends. The tests for stories that are scheduled

    for early completion should be done early. We don’t want completed stories

    waiting for acceptance tests to be written.


    Acceptance test writing should go quickly. We expect them to all be written

    before the midpoint of the iteration. If not all the acceptance tests are ready

    by the midpoint, then some of the developers should stop working on stories

    and start working on acceptance tests.


    This will likely mean that not all the stories will be completed in this

    iteration, but a story cannot be completed without the acceptance tests

    anyway. Just be sure that the programmers working on a story are not also

    writing the acceptance tests for that story. If QA continues to miss the

    midpoint deadline, one iteration after another, then the ratio of QA engineers

    to developers is likely wrong.'
