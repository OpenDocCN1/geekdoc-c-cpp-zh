    language. That sounds like a job for programmers. So programmers should write
    the automated tests, right?


    But wait! If programmers write the tests, they won’t be written from the business’
    point of view. They’ll be technical tests full of details that only programmers
    understand. They won’t reflect the item’s business value. So the business should
    write the automated tests. Right?


    But wait! If the business writes the automated tests then they’ll be written in
    a way that doesn’t match the technology we’re using. The programmers will just
    have to rewrite them, right?


    You can see why this practice has been so confusing for so many people.


    # ## Tools and Methodologies


    It’s worse than that because the practice has been inundated with tools and methodologies.


    In an attempt to make it easier for business people to write automated tests,
    programmers have written a plethora of tools to “help.” These tools include things
    like FitNesse, JBehave, SpecFlow, and Cucumber. Each of these tools creates a
    formalism that attempts to separate the technical and business sides of an automated
    test. The working hypothesis is that the business can write the business side
    of the automated tests, and the programmers can write the glue code that binds
    those tests to the system being tested.


    This seems like a good idea, and the tools do a decent job of this separation.
    Yet businesses have been reluctant to engage. The businesspeople who are responsible
    for specification are wary of formal languages. They typically want to use a human
    language, like English, to write their specifications.


    In response to this reluctance, programmers have stepped in and written the acceptance
    tests for the businesspeople, in the hopes that the businesspeople will at least
    read the formal documents. But this hasn’t worked out all that'
