    The level to which the Waterfall mindset dominated us can be seen in the language
    of the day. When Dijkstra came up with Structured Programming in 1968, Structured
    Analysis⁷ and Structured Design⁸ were not far behind. When Object-Oriented Programming
    (OOP) started to become popular in 1988, Object-Oriented Analysis⁹ and Object-Oriented
    Design¹⁰ (OOD) were also not far behind. This triplet of memes, this triumvirate
    of phases, had us in its thrall. We simply could not conceive of a different way
    to work.


    And then, suddenly, we could.


    The beginnings of the Agile reformation began in the late 1980s or early 1990s.
    The Smalltalk community began showing signs of it in the ’80s. There were hints
    of it in Booch’s 1991 book on OOD.¹⁰ More resolution showed up in Cockburn’s Crystal
    Methods in 1991. The Design Patterns community started to discuss it in 1994,
    spurred by a paper written by James Coplien.¹¹


    By 1995 Beedle,¹² Devos, Sharon, Schwaber, and Sutherland had written their famous
    paper on Scrum.¹³ And the floodgates were opened. The bastion of Waterfall had
    been breached, and there was no turning back.


    This, once again, is where I come into the story. What follows is from my memory,
    and I have not tried to verify it with the others involved. You should therefore
    assume that this recollection of mine has many omissions and


