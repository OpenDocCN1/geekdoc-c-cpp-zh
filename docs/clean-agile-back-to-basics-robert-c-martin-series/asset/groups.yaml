    When I first learned about XP, I thought, “What could be easier? Just follow a
    few simple disciplines and practices. Nothing to it.”


    However, based upon the number of organizations that try—and fail—to become Agile,
    becoming Agile must be very, very difficult. Perhaps the reason for all that failure
    is that so many organizations think Agile is something that it’s not.


    ## Agile Values


    Kent Beck named the four values of Agile long ago. They are courage, communication,
    feedback, and simplicity.


    ### Courage


    The first value is courage—or, in other words, a reasonable degree of risk-taking.
    The members of an Agile team are not so focused upon political safety that they
    sacrifice quality and opportunity. They realize that the best way to manage a
    software project over the long term is with a certain degree of aggression.


    There is a difference between courage and recklessness. It requires courage to
    deploy a minimum feature set. It also requires courage to maintain high code quality
    and maintain high-quality disciplines. However, it is reckless to deploy code
    that you are not highly confident in or that has an unsustainable design. It is
    reckless to conform to a schedule by sacrificing quality.


    The belief that quality and discipline *increase* speed is a courageous belief
    because it will constantly be challenged by powerful but naive folks who are in
    a hurry.


    ### Communication


    We value direct and frequent communication that crosses channels. Agile team members
    want to talk with one another. The programmers, customers, testers, and managers
    want to sit near each other and interact with each other frequently, and not just
    in the context of meetings. Not just through emails, chat, and memos. Rather,
    they value face-to-face, informal, interpersonal conversation.


    This is how teams gel. It is within the rapid, chaotic, informal firestorm of
    frequent interaction that light bulbs go off and insight is gained. A team that
    sits together and communicates frequently can work miracles.


    ### Feedback


    The Agile disciplines we have studied are virtually all geared toward providing
    rapid feedback to the folks who make important decisions. *Planning Game, Refactoring,
    Test Driven Development, Continuous Integration, Small Releases, Collective Ownership,
    Whole Team,* etc. maximize the frequency and quantity of feedback. They allow
    us to determine when things are going wrong early enough to correct them. They
    provide massive education about the consequences of earlier decisions. Agile teams
    *thrive* on feedback. Feedback is what makes the team work so effectively and
    what drives a project to a beneficial outcome.


    ### Simplicity


    The next Agile value is simplicity—in other words, *being direct*. It has often
    been said that every problem in software can be solved by adding another layer
    of indirection. But the values of courage, communication, and feedback are there
    to ensure that the number of problems is reduced to a minimum. Therefore, indirection
    can be kept to a minimum. Solutions can be simple.


    This applies to the software, but it also applies to the team. Passive aggression
    is indirection. When you recognize a problem but silently allow it to pass to
    someone else, you are engaging in indirection. When you accede to the demands
    of a manager or customer knowing that the consequences will be dire, you are being
    indirect.


    ## Transformation


    The transition from non-Agile to Agile is a transition in values. The values of
    Agile development include risk-taking, rapid-feedback, intense, high-bandwidth
    communication between people that ignores barriers and command structures. They
    also focus on moving in straight and direct lines rather than mapping out and
    negotiating the landscape. These values are diametrically opposed to the values
    of large organizations who have invested heavily in middle-management structures
    that value safety, consistency, command-and-control, and plan execution.


    Is it possible to transform such an organization to Agile? Frankly, this is not
    something I have had a lot of success with, nor have I seen much success from
    others. I have seen plenty of effort and money expended, but I have not seen many
    organizations that truly make the transition. The value structures are just too
    different for the middle-management layer to accept.


    What *I have* seen is the transition of teams and individuals, because teams and
    individuals are often directed by values that are aligned with Agile.


    Ironically, executives are also often driven by the risk-taking, direct, communicative
    values of Agile. This is one of the reasons they try to transition their organizations.


    The barrier is the management layer in the middle. These folks were hired to *not*
    take risks, to *avoid* directness, to *follow* and *enforce* the chain of command
    with a *minimum* of communication. This is the organizational dilemma. The tops
    and bottoms of the organization value the Agile mindset, but the middle layer
    opposes it. I don’t know that I have ever seen that middle layer make the change.
    Indeed, how could they? Their job is to *oppose* such a change.


    To drive this point home, let me tell you a few stories.


    ### Weeping


    This last story is second hand. I wasn’t there to witness the critical moment.
    It was reported to me by my employees at the time.


    In 2003, my company participated in an Agile Transition at a well-known stock
    brokerage firm. All was proceeding well. We trained the executives, the middle
    managers, and the developers. They were cooking along. Everything was going great.


    Then came the final assessment. The executives, middle managers, and developers
    all met in a big auditorium. Their goal was to assess the progress and success
    of the Agile Transition. The executives asked the question, “How’s it going?”


    The answer came from the various participants: “It’s going very well.”


    Then there was a moment of silence in the room, which was suddenly punctuated
    by the sound of someone in the back of the room, weeping. And that’s when the
    emotional supports crumbled, and the positive mood in the room collapsed. “This
    is just too hard.” People were heard to say. “We just can’t keep this up.”


    And so, the executives killed the transition.


    ### Moral


    I suppose the moral of all these stories is “Expect something weird to happen.”


    ### Faking It


    Can Agile teams exist in an organization with a strong middle-management layer
    that opposes Agile? I have seen this happen upon occasion. Some software development
    teams quietly use Agile values to drive their development, while also conforming
    to the rigors imposed upon them by middle management. So long as middle management
    is satisfied that their procedures and standards are being followed, they may
    leave the development teams to their own devices.


    This is what Booch and Parnas called “faking it.”² The team does Agile under the
    covers, while providing everything that satisfies the middle-management layer.
    Rather than fighting a futile battle with the middle managers, these teams put
    a layer on top of Agile that makes Agile look safe and conformant to the middle
    managers.


    For example, the middle managers may want an analysis document produced in the
    early phases of the project. The Agile team provides this document by writing
    much of the early code of the system using all the normal Agile disciplines, and
    then produces the analysis document by scheduling a sequence of documentation
    stories.


    This makes sense because the first few coding iterations are heavily focused on
    requirements analysis. The fact that this analysis is being done by actually writing
    code is not something that the middle managers need to know. Nor should they care.


    Unfortunately, I have seen organizations who are so dysfunctional that when middle
    managers smell that a team is “faking it,” they assume subterfuge and quickly
    move to expunge the Agile disciplines. This is a deep shame because those teams
    were actually giving the middle managers what they needed.


    ### Success in Smaller Organizations


    I have seen some medium-sized organizations adopt Agile. They had thin middle-management
    layers composed of folks who came up through the ranks and still retained the
    direct, risk-taking mindset.


    ² Booch, G. 1994. *Object-Oriented Analysis and Design with Applications*, 2nd
    ed. Reading, MA: Addison-Wesley, p. 233–34.

