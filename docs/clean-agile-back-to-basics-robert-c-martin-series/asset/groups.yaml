    # ## The First Thing You Know


    What is the first thing you know about a project? Before you know the name of
    the project or any of the requirements, there is one piece of data that precedes
    all others. *The Date*, of course. And once *The Date* is chosen, *The Date* is
    frozen. There’s no point trying to negotiate *The Date*, because *The Date* was
    chosen for good business reasons. If *The Date* is September, it’s because there’s
    a trade show in September, or there’s a shareholders’ meeting in September, or
    our funding runs out in September. Whatever the reason, it’s a good *business*
    reason, and it’s not going to change just because some developers think they might
    not be able to make it.


    At the same time, the requirements are wildly in flux and can never be frozen.
    This is because the customers don’t really know what they want. They sort of know
    what problem they want to *solve*, but translating that into the requirements
    of a system is never trivial. So the requirements are constantly being re-evaluated
    and re-thought. New features are added. Old features are removed. The UI changes
    form on a weekly if not daily basis.


    This is the world of software development team. It’s a world in which dates are
    frozen and requirements are continuously changing. And somehow in that context,
    the development team must drive the project to a good outcome.


