    When he finally tried to check in and integrate his changes, he found that so
    many other changes had accumulated that the merge took him a long time to get
    working. While he was struggling with that merge, the other programmers continued
    to make 15-minute checkins. When he finally got his merge working and tried to
    check in his code, he found he had another merge to do.


    He was so frustrated by this that he stood up in the middle of class and loudly
    proclaimed, “XP doesn’t work.” Then he stormed out of the classroom and went to
    the hotel bar.


    And then a miracle happened. The pair partner that he had rejected went after
    him to talk him down. The other two pairs reprioritized their work, finished the
    merge, and got the project back on track. Thirty minutes later the student, now
    much calmer, came back in the room, apologized, and resumed his work—including
    pairing. He subsequently became an enthusiastic advocate for Agile development.


    The point is that Continuous Integration only works if you integrate continuously.


    # Then Came Continuous Build


    In 2001, ThoughtWorks changed the game significantly. They created *CruiseControl*,<sup>7</sup>
    the first *continuous build* tool. I remember Mike Two<sup>8</sup> giving a late-night
    lecture about this at a 2001 XP Immersion. There’s no recording of that speech,
    but the story went something like this:


    > > *CruiseControl allows the checkin time to shrink down to a few minutes. Even
    the most minor change is quickly integrated into the mainline. CruiseControl watches
    the source code repository and kicks off a build every time any change is checked
    in. As part of the build, CruiseControl runs the majority of the automated tests
    for the system and then sends email to everyone on the team with the results.*

    > >

    > > “Bob, broke the build.”


    7. https://en.wikipedia.org/wiki/CruiseControl

    8. http://wiki.c2.com/?MikeTwo'
  - '[PAGE 135]


    <!-- no content -->'
  - '[PAGE 136]


    # The Cost of Cheating


    There have been teams who, under the pressure of a deadline, have allowed the
    continuous build to remain in a failed state. This is a suicidal move. What happens
    is that everyone gets tired of the continuous barrage of failure emails from the
    continuous build server, so they remove the failing tests with the promise that
    they’ll go back and fix them “later.”


    Of course, this causes the continuous build server to start sending success emails
    again. Everyone relaxes. The build is passing. And everyone forgets about the
    pile of failing tests that they set aside to be fixed “later.” And so a broken
    system gets deployed.


    # Standup Meetings


    Over the years, there has been a great deal of confusion about “The Daily Scrum”
    or the “Standup Meeting.” Let me cut through all that confusion now.


    The following are true of the Standup Meeting:


    +   - This meeting is optional. Many teams get by just fine without one.

    +   - It can be less often than daily. Pick the schedule that makes sense to you.

    +   - It should take ~10 minutes, even for large teams.

    +   - This meeting follows a simple formula.


    The basic idea is that the team members stand⁹ in a circle and answer three questions:


    +   1. What did I do since the last meeting?

    +   2. What will I do until the next meeting?

    +   3. What is in my way?


    ⁹. This is why it’s called a “standup” meeting.'
