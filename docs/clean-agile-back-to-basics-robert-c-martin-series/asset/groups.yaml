    # OVERTIME


    You’d think that I would have learned my lesson from that experience. But, of
    course, I did not. Over the next 20 years, I continued to work long hours for
    my employers. I continued to fall for the *important project* meme. Oh, I didn’t
    work the crazy hours I worked when I was 18. My average weekly hours dropped to
    more like 50. All-nighters became pretty rare—but, as we shall see, not entirely
    absent.


    As I matured, I realized that my worst technical mistakes were made during those
    periods of frenetic late-night energy. I realized that those mistakes were huge
    impediments that I had to constantly work around during my truly wakeful hours.


    Then came the event that made me reconsider my ways. My future business partner,
    Jim Newkirk, and I were pulling an all-nighter. Sometime around 2 a.m., we were
    trying to figure out how to get a piece of data from a low-level part of our system
    to another part that was much higher up the execution chain. Returning this data
    up the stack was not an option.


    We had built a “mail” transport system within our product. We used it to send
    information *between* processes. We suddenly realized, at 2 a.m., with caffeine
    roaring through our veins and all our faculties operating at peak efficiency,
    that we could have the low-level part of the process mail that piece of data to
    itself where the high-level part could fetch it.


    Even today, more than three decades later, whenever Jim and I want to describe
    someone else’s unfortunate decision, we say: “Uh-oh. They just mailed it to themselves.”


    I won’t bore you with all the horrible, nitty-gritty details about why that decision
    was so awful. Suffice it to say, it cost us many times the effort that we thought
    we were saving. And of course, the solution became too entrenched to reverse,
    so we were stuck with it.


    5. This was a decade before I would learn about TDD. Had Jim and I been practicing
    TDD back then, we could have easily backed out of that change.'
