    # ACKNOWLEDGMENTS


    My first acknowledgment goes to a pair of intrepid programmers who joyously discovered
    (or rediscovered) the practices contained herein: Ward Cunningham and Kent Beck.


    Next in line is Martin Fowler, without whose steadying hand, in those earliest
    of days, the Agile revolution would likely have been stillborn.


    Ken Schwaber deserves a special mention for the indomitable energy he applied
    toward the promotion and adoption of Agile.


    Mary Poppendieck also deserves special mention for the selfless and inexhaustible
    energy she put into the Agile movement and her shepherding of the Agile Alliance.


    In my view, Ron Jeffries, through his talks, articles, blogs, and the persistent
    warmth of his character, acted as the conscience of the early Agile movement.


    Mike Beedle fought the good fight for Agile but was senselessly murdered by a
    homeless person on the streets of Chicago.'
  - '[PAGE 22]


