    从那时起直到2001年左右，我无意中在践行敏捷。我只在小型跨职能团队中编码，大多有内部客户，专注于现在所谓的用户故事，而且我们只做小规模、频繁的发布。但后来在AccuRev，我们的主要发布间隔越来越长，在2005年达到18个月的顶峰。有四年时间，我无意中在做瀑布开发。那很糟糕，我不知道为什么。而且，我还被视为“流程专家”。抛开细节不谈，这是很多人都熟悉的故事。


    ## 从流程专家到敏捷专家


