    To understand just how severe this problem is, consider the shutdown of the Air
    Traffic Control network over Los Angeles due to the rollover of a 32-bit clock.
    Or the shutdown of all the power generators on board the Boeing 787 for the same
    reason. Or the hundreds of people killed by the 737 Max MCAS software.


    Or how about my own experience with the early days of healthcare.gov? After initial
    login, like so many systems nowadays, it asked for a set of security questions.
    One of those was “A memorable date.” I entered 7/21/73, my wedding anniversary.
    The system responded with `Invalid Entry`.


    I’m a programmer. I know how programmers think. So I tried many different date
    formats: `07/21/1973`, `07-21-1973`, `21 July, 1973`, `07211973`, etc. All gave
    me the same result. `Invalid Entry`. This was frustrating. What date format did
    the blasted thing want?


    Then it occurred to me. The programmer who wrote this didn’t know what questions
    would be asked. He or she was just pulling the questions from a database and storing
    the answers. That programmer was probably also disallowing special characters
    and numbers in those answers. So I typed: `Wedding Anniversary`. This was accepted.


    I think it’s fair to say that any system that requires its users to think like
    programmers in order to enter data in the expected format is crap.


    I could fill this section with anecdotes about crappy software like this. But
    others have done this far better than I could. If you want to get a much better
    idea of the scope of this issue, read Gojko Adzic’s *Humans vs. Computers*[^3]
    and Matt Parker’s *Humble Pi*.[^4]


    It is perfectly reasonable for our managers, customers, and users to expect that
    we will provide systems for them that are high in quality and low in defect. Nobody
    expects to be handed crap—especially when they pay good money for it.


    Note that Agile’s emphasis on Testing, Refactoring, Simple Design, and customer
    feedback is the obvious remedy for shipping bad code.


    ## CONTINUOUS TECHNICAL READINESS


    The last thing that customers and managers expect is that we, programmers, will
    create artificial delays to shipping the system. But such artificial delays are
    common in software teams. The cause of such delays is often the attempt to build
    all features simultaneously instead of the most important features first. So long
    as there are features that are half done, or half tested, or half documented,
    the system cannot be deployed.


    Another source of artificial delays is the notion of stabilization. Teams will
    frequently set aside a period of continuous testing during which they watch the
    system to see if it fails. If no failures are detected after X days, the developers
    feel safe to recommend the system for deployment.


    Agile resolves these issues with the simple rule that the system should be *technically
    deployable* at the end of every iteration. Technically deployable means that from
    the developers’ points of view the system is technically solid enough to be deployed.
    The code is clean and the tests all pass.


    This means that the work completed in the iteration includes all the coding, all
    the testing, all the documentation, and all the stabilization for the stories
    implemented in that iteration.


    If the system is *technically* ready to deploy at the end of every iteration,
    then deployment is a *business decision*, not a technical decision. The business
    may decide there aren’t enough features to deploy, or they may decide to delay
    deployment for market reasons or training reasons. In any case, the system quality
    meets the *technical* bar for deployability.


    Is it possible for the system to be technically deployable every week or two?
    Of course it is. The team simply has to pick a batch of stories that is small
    enough to allow them to complete all the deployment readiness tasks before the
    end of the iteration. They’d better be automating the vast majority of their testing,
    too.


    From the point of view of the business and the customers, continuous technical
    readiness is simply expected. When the business sees a feature work, they expect
    that feature is done. They don’t expect to be told that they have to wait a month
    for QA stabilization. They don’t expect that the feature only worked because the
    programmers driving the demo bypassed all the parts that don’t work.


    ## Stable Productivity


    You may have noticed that programming teams can often go very fast in the first
    few months of a greenfield project. When there’s no existing code base to slow
    you down, you can get a lot of code working in a short time.


    Unfortunately, as time passes, the messes in the code can accumulate. If that
    code is not kept clean and orderly, it will put a back pressure on the team that
    slows progress. The bigger the mess, the higher the back pressure, and the slower
    the team. The slower the team, the greater the schedule pressure, and the greater
    the incentive to make an even bigger mess. That positive-feedback loop can drive
    a team to near immobility.


    Managers, puzzled by this slowdown, may finally decide to add human resources
    to the team in order to increase productivity. But as we saw in the previous chapter,
    adding personnel actually slows down the team for a few weeks.


    The hope is that after those weeks the new people will come up to speed and help
    to increase the velocity. But who is training the new people? The people who made
    the mess in the first place. The new people will certainly emulate that established
    behavior.


    From where does the Tiger Team get their requirements? Is there an up-to-date
    requirements document? Yes. It’s the old code. The old code is the only document
    that accurately describes what the redesigned system should do.


    So now the Tiger Team is poring over the old code trying to figure out just what
    it does and what the new design ought to be. Meanwhile the rest of us are changing
    that old code, fixing bugs and adding new features.


    Thus, we are in a race. The Tiger Team is trying to hit a moving target. And,
    as Zeno showed in the parable of Achilles and the tortoise, trying to catch up
    to a moving target can be a challenge. Every time the Tiger Team gets to where
    the old system was, the old system has moved on to a new position.


    It requires calculus to prove that Achilles will eventually pass the tortoise.
    In software, however, that math doesn’t always work. I worked at a company where
    ten years later the new system had not yet been deployed. The customers had been
    promised a new system eight years before. But the new system never had enough
    features for those customers; the old system always did more than the new system.
    So the customers refused to take the new system.


    After a few years, customers simply ignored the promise of the new system. From
    their point of view that system didn’t exist, and it never would.


    Meanwhile, the company was paying for two development teams: the Tiger Team and
    the maintenance team. Eventually, management got so frustrated that they told
    their customers they were deploying the new system despite their objections. The
    customers threw a fit over this, but it was nothing compared to the fit thrown
    by the developers on the Tiger Team—or, should I say, the remnants of the Tiger
    Team. The original developers had all been promoted and gone off to management
    positions. The current members of the team stood up in unison and said, “You can’t
    ship this, it’s crap. It needs to be redesigned.”


    OK, yes, another hyperbolic story told by Uncle Bob. The story is based on truth,
    but I did embellish it for effect. Still, the underlying message is entirely true.
    Big redesigns are horrifically expensive and seldom are deployed.


