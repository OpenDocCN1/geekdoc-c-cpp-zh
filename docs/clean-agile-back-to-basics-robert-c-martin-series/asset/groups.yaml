    # STORIES AND POINTS


    The story point technique deals with accuracy and precision by using a very tight
    feedback loop that iteratively calibrates and recalibrates estimates against reality.
    Imprecision is high at first, but within a few cycles it is reduced to manageable
    levels. But before we get into that, we need to talk a bit about stories.


    A *user story* is an abbreviated description of a feature of the system, told
    from the point of view of a user. So, for example:


    > As the driver of a car, in order to increase my velocity, I will press my foot
    harder on the accelerator pedal.


    This is one of the more common forms of a user story. Some people like it. Others
    prefer the more abbreviated form: *Accelerate.* Both work pretty well. Both are
    simply placeholders for a much larger conversation.


    Much of that conversation has not happened yet. It will happen when the developers
    are on the verge of developing the feature. The conversation was begun, however,
    at the moment that the story was written. At that time, the developers and stakeholders
    talked over some of the possible details of the story and then chose a simple
    wording to write down.


    The wording is simple, and the details are omitted because it is too early to
    count on those details. We want to delay the specification of those details as
    long as possible, right up to the point where the story is developed. So we leave
    the story in abbreviated form as a promise for a future conversation.


    Typically, we write the story on an index card. I know, I know. Why in the world
    would we use such ancient and primitive tools when we have computers and iPads
    and...? It turns out that being able to hold those cards in your hands, pass them
    across a table to each other, scribble on them, and otherwise *handle* them is
    immensely valuable.


