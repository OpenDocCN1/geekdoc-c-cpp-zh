    # HISTORY OF AGILE


    When did Agile begin? Probably more than 50,000 years ago when humans first decided
    to collaborate on a common goal. The idea of choosing small intermediate goals
    and measuring the progress after each is just too intuitive, and too human, to
    be considered any kind of a revolution.


    When did Agile begin in modern industry? It’s hard to say. I imagine the first
    steam engine, the first mill, the first internal combustion engine, and the first
    airplane were produced by techniques that we would now call Agile. The reason
    for that is that taking small measured steps is just too natural and human for
    it to have happened any other way.


    So when did Agile begin in software? I wish I could have been a fly on the wall
    when Alan Turing was writing his 1936 paper.¹ My guess is that the many “programs”
    he wrote in that book were developed in small steps with plenty of desk checking.
    I also imagine that the first code he wrote for the Automatic Computing Engine,
    in 1946, was written in small steps, with lots of desk checking, and even some
    real testing.


    The early days of software are loaded with examples of behavior that we would
    now describe as Agile. For example, the programmers who wrote the control software
    for the Mercury space capsule worked in half-day steps that were punctuated by
    unit tests.


    Much has been written elsewhere about this period. Craig Larman and Vic Basili
    wrote a history that is summarized on Ward Cunningham’s wiki,² and also in Larman’s
    book, *Agile & Iterative Development: A Manager’s Guide*.³


    +   1. Turing, A. M. 1936. On computable numbers, with an application to the Entscheidungsproblem
    [proof]. *Proceedings of the London Mathematical Society*, 2 (published 1937),
    42(1):230–65. The best way to understand this paper is to read Charles Petzold’s
    masterpiece: Petzold, C. 2008. *The Annotated Turing: A Guided Tour through Alan
    Turing’s Historic Paper on Computability and the Turing Machine*. Indianapolis,
    IN: Wiley.

    +   2. Ward’s wiki, t2.com, is the original wiki—the first ever to have appeared
    in the Internet. Long may it be served.

    +   3. Larman, C. 2004. *Agile & Iterative Development: A Manager’s Guide*. Boston,
    MA: Addison-Wesley.'
