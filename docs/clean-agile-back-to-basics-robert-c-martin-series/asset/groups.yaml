  mdcn: "\n这种对细节的拒绝是一种*纪律*，而且很难。团队中的每个人都会觉得有必要以某种方式记录下所讨论的所有细节。抵制这种冲动！\n\n我曾与一位项目经理共事，他坚决要求把每个故事卡上关于每个故事的每一个细节都写下来。故事卡上写满了密密麻麻的小字段落。这些卡片变得难以理解也无法使用。上面有太多细节，导致无法估算，无法排期。它们毫无用处。更糟糕的是，每张故事卡都投入了太多精力，以至于无法丢弃。\n\
    \n让故事可管理、可排期、可估算的，正是暂时的细节缺失。故事必须一开始保持低成本，因为其中很多会被修改、拆分、合并甚至丢弃。不断提醒自己：它们是占位符，而不是需求。\n\
    \n现在我们在第零迭代中创建了一批故事卡。随着遇到新特性和新想法，稍后还会创建更多。事实上，故事创建的过程永无止境。在项目过程中，故事总在被编写、更改、丢弃，以及（最重要的是）被开发。\n\
    \n## 估算故事\n\n想象一下，这些卡片就在你面前的桌上，围桌而坐的是其他开发人员、测试人员和利益相关者。你们聚在一起是为了*估算*这些卡片。这样的会议会有很多次。每当新增故事或对旧故事有了新的了解，就会召集会议。可以预期，这类会议在每次迭代中都会是非正式但定期的活动。\n\
    \n然而，现在还是第零迭代的早期，这是第一次估算会议。还没有任何一个故事被估算过。\n\n于是，我们从这批故事中挑出一个我们认为复杂度适中的故事。也许就是*登录*这个故事。写这个故事时我们很多人都在场，所以听到了利益相关者想象中这个故事应包含的各种细节。我们可能会请利益相关者现在再回顾一下这些细节，以便我们都有合适的上下文。\n\
    \n然后，我们为这个故事选择一个点数。*登录*故事将花费 3 点开发工作量（图 3.1）。为什么是 3？为什么不呢？*登录*是个平均的故事，所以我们给它一个平均的成本。如果我们的故事成本范围是\
    \ 1 到 6，那么 3 就是平均。\n\n![](img/8facf878fd02eafcdb1e1193ad5963b0_95_0.png)\n\n**图\
    \ 3.1** 登录故事被分配了三点\n\n*登录*现在成了我们的*黄金故事*。它是所有其他故事比较的标准。例如，登出比登录简单得多。我们将给*登出*故事\
    \ 1 点。*取款*可能比*登录*难两倍，所以我们说它是 6。*存款*与*取款*类似，但可能没那么难，所以我们给它 5。最后，*转账*与*登录*差不多，所以我们给它\
    \ 3。\n\n我们把这些数字写在每张被估算的故事卡的一个角落里。稍后我会更详细地讨论估算过程。现在，我们只说我们现在有了一批带有估算值的故事卡，范围从 1\
    \ 到 6。为什么是 1 到 6？为什么不呢？分配成本的方法有很多。越简单通常越好。\n\n此时，你可能想知道这些点到底在衡量什么。也许你认为它们是小时、天、周或其他某种时间单位。\n\
    \n所以在 IPM 上，利益相关者选择了总计 18 点的故事。但这一次，在中期评审时，发生了一些奇怪的事情。已完成 12 点。我们该告诉他们吗？\n\n我们不必说。他们自己能看出来。于是利益相关者又给计划增加了六点，使计划总数达到\
    \ 24。\n\n当然，团队实际上只完成了 22。因此下一次迭代将选择 22。\n\n## 项目的结束\n\n事情就这样一直进行下去。每次迭代完成后，完成的速率会被添加到速率图上，这样每个人都能看到团队进展有多快。\n\
    \n现在想象这个过程持续下去，一个迭代接一个迭代，一个月接一个月。那一叠故事卡发生了什么？把迭代周期想象成一台从卡片堆中抽出投资回报率（ROI）的泵。把对需求的持续探索想象成一台将\
    \ ROI 泵回卡片堆的泵。只要流入的 ROI 超过流出的 ROI，项目就会继续。\n\n然而，探索中发现的新特性数量可能会逐渐降到零。当这种情况发生时，卡片堆中剩余的\
    \ ROI 再过几个迭代就会被耗尽。总有一天，在 IPM 上，利益相关者扫视卡片堆寻找值得做的事情，却什么也没找到。项目就此结束。\n\n项目并不是在所有故事都实现后结束。项目是在卡片堆中再也没有值得实现的故事时结束。\n\
    \n项目结束后卡片堆中还剩下什么，有时令人惊讶。我曾参与过一个为期一年的项目，其中最早写下的故事，也就是赋予项目名称的那个故事，从未被选中实现。那个故事当时很重要，但有更多更紧急的故事需要实现。等到所有紧急故事都解决时，最初那个故事的重要性早已烟消云散。\n\
    \n## 故事\n\n用户故事是我们用来提醒功能点的简单陈述。在编写故事时，我们尽量不记录太多细节，因为我们知道这些细节很可能会改变。细节稍后会被记录下来，但以验收测试的形式，我们稍后会讨论。\n\
    \n故事遵循一套简单的指导原则，我们用首字母缩写*INVEST*来记忆。\n\n- **I：独立。** 用户故事彼此独立。这意味着它们不需要按任何特定顺序实现。*登录*不需要在*登出*之前实现。\n\
    \n  这是一个软性要求，因为很可能有些故事依赖于其他故事先被实现。例如，如果我们定义的*登录*不包含忘记密码恢复功能，那么显然*密码恢复*在一定程度上依赖于*登录*。尽管如此，我们还是尽量分离故事，使依赖尽可能少。这样我们就可以按照业务价值的顺序来实现故事。\n\
    \n- **N：可协商。** 这也是我们不写下所有细节的另一个原因。我们希望这些细节可以在开发人员和业务方之间协商。\n\n  例如，业务方可能要求为某个功能提供一个花哨的拖放界面。开发人员可以推荐一个更简单的复选框风格，并解释说这样开发成本会低得多。这样的协商很重要，因为这是业务方了解管理软件开发成本的少数几种方式之一。\n\
    \n- **V：有价值。** 故事必须对业务方具有清晰且可量化的价值。\n\n  重构永远不是故事。架构永远不是故事。代码清理永远不是故事。故事总是业务方看重的东西。别担心，我们会处理重构、架构和清理——但不是用故事的形式。\n\
    \n*登录*是一个具体操作。另一方面，像*可用*这样的故事不可测试，也不可估算。事实上，E 和 T 紧密相连。\n\n## 故事估算\n\n估算故事的方法有很多。大多数都是古老的宽带德尔菲⁵方法的变体。\n\
    \n最简单的一种叫做*飞指*。开发人员围坐在桌旁，阅读故事，如有必要与利益相关者讨论。然后开发人员把一只手藏在背后，不让别人看到，伸出与他们认为该故事应得点数相同数量的手指。然后有人数一…二…三…，随即所有手指同时飞出来。\n\
    \n如果每个人伸出的手指数量相同，或者偏差很小且有明显的平均值，就把这个数字写在故事卡上，团队继续下一个故事。然而，如果手指显示的数字分歧很大，开发人员就讨论原因，然后重复这个过程，直到达成一致。\n\
    \n一个合理的故事范围是*衬衫尺码*：小、中、大。如果你想用全部五根手指，也行。另一方面，超过五个等级几乎肯定是荒谬的。记住，我们想要准确，但不要超出必要地精确。\n\
    \n*计划扑克*⁶是一种类似的技术，但它使用卡片。市面上有很多流行的计划扑克牌组。大多数使用某种斐波那契数列。一种流行的牌组包含以下卡片：?、0、½、1、2、3、5、8、13、20、40、100\
    \ 和 ∞。如果你使用这样的牌组，我的建议是去掉其中大部分卡片。\n\n⁵ https://en.wikipedia.org/wiki/Wideband_delphi\n\
    ⁶ Grenning, J. W. 2002. 计划扑克，或如何在发布计划时避免分析瘫痪。访问于 https://wingman-sw.com/articles/planning-poker.\n"
