  mdcn: "\n\n## 前言\n\n敏捷开发到底是什么？它是如何起源的？又是如何演变的？\n\n在这本书中，鲍勃大叔对这些问题给出了深思熟虑的答案。他还指出了敏捷开发在许多方面被误解或扭曲的方式。他的观点切中要害，因为他是这一主题的权威，亲身参与了敏捷开发的诞生。\n\
    \n鲍勃和我已经做了多年朋友。我们第一次见面是在1979年，当时我加入了泰瑞达的电信部门。作为一名电气工程师，我负责安装和支持产品；后来，我成为了一名硬件设计师。\n\
    \n大约在我入职一年后，公司开始寻求新的产品创意。1981年，鲍勃和我提出了一个电子电话接待员——本质上是一个带有呼叫路由功能的语音信箱系统。公司很喜欢这个概念，我们很快就开始开发“E.R.—电子接待员”。我们的原型是当时最先进的。它在英特尔8086处理器上运行MP/M操作系统。语音信息存储在一块5兆字节的希捷ST-506硬盘上。我设计了语音端口硬件，而鲍勃开始编写应用程序。当我完成设计后，我也开始编写应用程序代码，从此以后我一直是一名开发者。\n\
    \n大约在1985年或1986年，泰瑞达突然叫停了E.R.的开发，并在我们不知情的情况下撤回了专利申请。这是一个公司很快就后悔的商业决策，至今仍困扰着鲍勃和我。\n\
    \n最终，我们俩都离开了泰瑞达去寻求其他机会。鲍勃在芝加哥地区创办了一家咨询公司。我则成为了一名软件承包商和讲师。尽管我搬到了另一个州，我们仍然保持着联系。\n\
    \n到了2000年，我在Learning Tree International教授面向对象的分析与设计。这门课程涵盖了UML和统一软件开发过程（USDP）。我对这些技术非常精通，但对Scrum、极限编程或类似的方法论并不熟悉。\n\
    \n2001年2月，敏捷宣言发布了。和许多开发者一样，我的第一反应是“敏捷什么？”我所知道的唯一宣言来自卡尔·马克思，他是一名热忱的共产主义者。这个敏捷的东西是要号召战斗吗？该死的软件激进分子！\n\
    \n宣言确实引发了某种反叛。它旨在通过协作、自适应、反馈驱动的方法，激励人们开发精益、整洁的代码。它为瀑布模型和USDP这样的“重型”过程提供了一种替代方案。\n\
    \n敏捷宣言发布至今已有18年。因此，对今天的大多数开发者来说，它已经是古老的历史了。正因为如此，你对敏捷开发的理解可能与它的创始人的意图并不一致。\n\n\
    这本书旨在澄清事实。它提供了一个历史视角，让你更全面、更准确地看待敏捷开发。鲍勃是我认识的最聪明的人之一，他对编程有着无穷的热情。如果有人能揭开敏捷开发的神秘面纱，那一定是他。\n\
    \n——杰里·菲茨帕特里克  \n软件复兴公司  \n2019年3月\n\n许多小团队做许多小事情。这正是20世纪50年代和60年代的程序员们本能懂得的道理。而在20世纪70年代，这一点却被遗忘了。\n\
    \n为什么会被遗忘？我怀疑是因为一次断层。20世纪70年代，世界上的程序员数量开始爆炸式增长。在此之前，全世界只有几千名程序员。在此之后，有了几十万人。如今，这个数字正接近一亿。\n\
    \n20世纪50年代和60年代的第一批程序员并不是年轻人。他们在30多岁、40多岁和50多岁时才开始编程。到了20世纪70年代，正当程序员群体开始爆炸式增长时，那些老前辈们却开始退休了。因此，必要的传承从未发生。就在经验丰富的人离开之际，一群年轻得难以置信的20多岁的人进入了职场，而前人的经验没有得到有效传递。\n\
    \n有些人会说，这一事件开启了编程领域的一段黑暗时代。30年来，我们一直纠结于“应该用大团队做大事”的念头，却从不知道秘诀是用许多小团队做许多小事情。\n\n\
    到了90年代中期，我们开始意识到我们失去了什么。小团队的想法开始萌芽并成长。这个想法在软件开发者的社区中传播开来，势头渐盛。2000年，我们意识到需要一次全行业的重新启动。我们需要被提醒那些前辈们本能就知道的道理。我们需要再一次认识到，大事是由许多协作的小团队做小事情完成的。\n\
    \n为了推广这个理念，我们给它起了一个名字。我们称之为“敏捷”。\n\n我在2019年初写下这篇序言。距离2000年的重启已经将近20年了，在我看来，是时候再来一次了。为什么？因为敏捷这个简单而微小的信息在过去的这些年里变得混乱了。它被与精益、看板、LeSS、SAFe、Modern、Skilled等众多概念混在了一起。这些其他的想法并不坏，但它们不是最初的敏捷信息。\n\
