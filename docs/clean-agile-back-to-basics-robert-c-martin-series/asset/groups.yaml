    Agile is a set of principles, practices, and disciplines that help small teams
    build small software projects. The practices described in this chapter are those
    that help those small teams behave like true teams. They help the teams set the
    language they use to communicate, as well as the expectations for how the team
    members will behave toward each other and toward the project they are building.


