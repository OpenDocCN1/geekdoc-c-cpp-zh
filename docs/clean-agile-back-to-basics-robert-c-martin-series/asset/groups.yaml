    Don’t get me wrong. When team members work from home, there is still a significant
    loss of nonverbal communication. Serendipitous conversations are much rarer. No
    matter how electronically connected the team is, they are still not together in
    the same space. This puts the people working from home at a distinct disadvantage.
    There are always conversations and impromptu meetings that they miss. Despite
    the vast data bandwidth they may enjoy, they are still communicating through a
    peephole compared to those who are co-located.


    A team that is mostly co-located but has a member or two who work from home one
    or two days per week will likely not notice any significant impediment, especially
    if they have invested in some good, high-bandwidth remote-communication tools.


    On the other hand, a team composed of people who work almost entirely from home
    will never work as well as a team that is co-located.


    Don’t get me wrong. In the early ’90s, my partner Jim Newkirk and I successfully
    managed a team that had no co-location at all. Everyone worked entirely from home.
    We met in person twice per year at most, and some of us lived in different time
    zones. On the other hand, we all spoke the same language, shared the same culture,
    and our time zones were never more than two hours apart. We made it work. We made
    it work very well. But it would have worked even better if we’d been together
    in the same room.


    # Conclusion


    At the Snowbird meeting in 2000, Kent Beck said that one of our goals was to heal
    the divide between business and development. The business-facing practices play
    a big role in satisfying that goal. By following these practices, business and
    development have a simple and unambiguous way to communicate. That communication
    breeds trust.'
