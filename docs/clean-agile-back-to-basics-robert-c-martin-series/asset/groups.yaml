    It is the first of May. The big boss calls us all into a conference room.


    “We’ve got a new project,” the big boss says. “It’s got to be done November first.
    We don’t have any requirements yet. We’ll get them to you in the next couple of
    weeks.”


    “Now, how long will it take you to do the analysis?”


    We look at each other out of the corner of our eyes. No one is willing to speak.
    How do you answer a question like that? One of us murmurs: “But we don’t have
    any requirements yet.”


    “Pretend you have the requirements!” hollers the big boss. “You know how this
    works. You’re all professionals. I don’t need an exact date. I just need something
    to put in the schedule. Keep in mind if it takes any more than two months we might
    as well not do this project.”


    The words “Two months?” burble out of someone’s mouth, but the big boss takes
    it as an affirmation. “Good! That’s what I thought too. Now, how long will it
    take you to do the design?”


    Again, astonished silence fills the room. You do the math. You realize that there
    are six months to November first. The conclusion is obvious. “Two months?” you
    say.


    “Precisely!” the Big Boss beams. “Exactly what I thought. And that leaves us two
    months for the implementation. Thank you for coming to my meeting.”


    Many of you reading this have been to that meeting. Those of you who haven’t,
    consider yourselves lucky.


    # ## The Analysis Phase


    So we all leave the conference room and return to our offices. What are we doing?
    This is the start of the Analysis Phase, so we must be analyzing. But just what
    is this thing called *analysis*?'
  - '[PAGE 46]


    If you read books on software analysis you’ll find that there are as many definitions
    of analysis as there are authors. There is no real consensus on just what analysis
    is. It might be creating the work breakdown structure of the requirements. It
    might be the discovery and elaboration of the requirements. It might be the creation
    of the underlying data model, or object model, or… The best definition of analysis
    is: It’s what analysts do.


    Of course, some things are obvious. We should be sizing the project and doing
    basic feasibility and human resources projections. We should be ensuring that
    the schedule is achievable. That is the least that our business would be expecting
    of us. Whatever this thing called analysis is, it’s what we are going to be doing
    for the next two months.


    This is the honeymoon phase of the project. Everyone is happily surfing the web,
    doing a little day-trading, meeting with customers, meeting with users, drawing
    nice diagrams, and in general having a great time.


    Then, on July 1, a miracle happens. We’re done with analysis.


    Why are we done with analysis? Because it’s July 1. The schedule said we were
    supposed to be done on July 1, so we’re done on July 1. Why be late?


    So we have a little party, with balloons and speeches, to celebrate our passage
    through the phase gate and our entry into the Design Phase.


    # The Design Phase


    So now what are we doing? We are designing, of course. But just what is *designing?*


    We have a bit more resolution about software design. Software design is where
    we split the project up into modules and design the interfaces between those modules.
    It’s also where we consider how many teams we need and what the connections between
    those teams ought to be. In general, we are expected to refine the schedule in
    order to produce a realistically achievable implementation plan.'
  - '[PAGE 47]


    Of course, things change unexpectedly during this phase. New features are added.
    Old features are removed or changed. And we’d love to go back and re-analyze these
    changes; but time is short. So we just sort of hack these changes into the design.


    And then another miracle happens. It’s September 1, and we are done with the design.
    Why are we done with the design? Because it’s September 1. The schedule says we
    are supposed to be done, so why be late?


    So: another party. Balloons and speeches. And we blast through the phase gate
    into the Implementation Phase.


    If only we could pull this off one more time. If only we could just say we were
    done with implementation. But we can’t, because the thing about implementation
    is that is actually has to be done. Analysis and design are not *binary deliverables*.
    They do not have unambiguous completion criteria. There’s no real way to know
    that you are done with them. So we might as well be done on time.


    # # THE IMPLEMENTATION PHASE


    Implementation, on the other hand, has definite completion criteria. There’s no
    way to successfully pretend that it’s done.<sup>20</sup>


    It’s completely unambiguous what we are doing during the Implementation Phase.
    We’re coding. And we’d better be coding like mad banshees too, because we’ve already
    blown four months of this project.


    Meanwhile, the requirements are still changing on us. New features are being added.
    Old features are being removed or changed. We’d love to go back and re-analyze
    and re-design these changes, but we’ve only got weeks left. And so we hack, hack,
    hack these changes into the code.


    As we look at the code and compare it to the design, we realize that we must have
    been smoking some pretty special stuff when we did that design because the code
    sure isn’t coming out anything like those nice pretty diagrams that


    <sup>20</sup>. Though the developers of healthcare.gov certainly tried.'
  - '[PAGE 48]


    we drew. But we don’t have time to worry about that because the clock is ticking
    and the overtime hours are mounting.


    Then, sometime around October 15, someone says: “Hey, what’s the date? When is
    this due?” That’s the moment that we realize that there are only two weeks left
    and we’re never going to get this done by November 1. This is also the first time
    that the stakeholders are told that there might be a small problem with this project.


    You can imagine the stakeholders’ angst. “Couldn’t you have told us this in the
    Analysis Phase? Isn’t that when you were supposed to be sizing the project and
    proving the feasibility of the schedule? Couldn’t you have told us this during
    the Design Phase? Isn’t that when you were supposed to be breaking up the design
    into modules, assigning those modules to teams, and doing the human resources
    projections? Why’d you have to tell us just two weeks before the deadline?”


    And they have a point, don’t they?


    # ## The Death March Phase


    So now we enter the Death March Phase of the project. Customers are angry. Stakeholders
    are angry. The pressure mounts. Overtime soars. People quit. It’s hell.


    Sometime in March, we deliver some limping thing that sort of half does what the
    customers want. Everybody is upset. Everybody is demotivated. And we promise ourselves
    that we will never do another project like this. Next time we’ll do it right!
    Next time we’ll do more analysis and more design.


    I call this *Runaway Process Inflation*. We’re going to do the thing that didn’t
    work, and do a lot more of it.'
  - '[PAGE 49]


