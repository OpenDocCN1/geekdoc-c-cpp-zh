    be run at a moment’s notice that *proves* with a high degree of certainty that
    when you put your foot on the brake pedal, the car will actually stop?


    How many people have been killed because the software in their cars failed to
    heed the pressure of the driver’s foot on the brake pedal? We don’t know for sure,
    but the answer is *many*. In one 2013 case Toyota paid millions in damages because
    the software contained “possible bit flips, task deaths that would disable the
    fail-safes, memory corruption, single-point failures, inadequate protections against
    stack overflow and buffer overflow, single-fault containment regions, [and] thousands
    of global variables” all within “spaghetti code.”¹


    Our software is now killing people. You and I probably didn’t get into this business
    to kill people. Many of us are programmers because, as kids, we wrote an infinite
    loop that printed our name on the screen, and we just thought that was so cool.
    But now our actions are putting lives and fortunes at stake. And with every passing
    day, more and more code puts more and more lives and fortunes at stake.


    # THE DISASTER


    The day will come, if it hasn’t already by the time you read this, when some poor
    programmer is going to do some dumb thing and kill ten thousand people in a single
    moment of carelessness. Think about that for a minute. It’s not hard to imagine
    half a dozen scenarios. And when that happens, politicians of the world will rise
    up in righteous indignation (as they should) and point their fingers squarely
    at us.


    You might think that those fingers would point at our bosses, or the executives
    in our companies, but we saw what happened when those fingers pointed to the CEO
    of Volkswagen, North America, as he testified before Congress. The politicians
    asked him why Volkswagen had put software in their cars that purposely detected
    and defeated the emissions testing hardware


