    enjoy would be impossible.


    And who writes all that software? You and I. We, programmers, rule the world.


    Other people think they rule the world, but then they hand the rules they’ve made
    to us and *we* write the actual rules that run in the machines that monitor and
    control virtually every activity of modern life.


    We, programmers, rule the world.


    And we are doing a pretty poor job of it.


