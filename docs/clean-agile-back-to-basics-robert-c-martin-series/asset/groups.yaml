  - '[PAGE 167]


    It is not uncommon to see small organizations transition completely to Agile.
    They have no middle management, and the values of the executives and developers
    are strongly aligned.


    # ## Individual Success and Migration


    Finally, sometimes only certain individuals within an organization adopt the Agile
    values. Individuals who make this transition do not fare well within organizations
    or teams who do not. The difference in values generally leads to a separation
    of some kind. In the best case, the individuals who make the transition will join
    or form new Agile teams that manage to hide from middle management. If that’s
    not possible, they will likely seek (and find) employment at a company that shares
    their values.


    Indeed, over the last twenty years, we have seen this migration of values taking
    place in the industry. New companies that embrace the Agile values have been formed,
    and programmers who desire to work in an Agile manner flock to those companies.


    # ## Creating Agile Organizations


    Can large organizations be created that allow Agile teams to prosper within them?
    Certainly! However, note that the word is *created* not *transformed*.


    When IBM decided to build the PC, the company’s executives realized that the values
    of the organization would not allow the kind of quick innovation and risk-taking
    that would be required. So, they *created* an organization with a different value
    structure.^3


    Have we seen this happen in the software world? Have older, large organizations
    *created* smaller software organizations for the purpose of adopting Agile? I’ve
    seen hints of this, but I cannot bring to mind any overt examples. We have certainly
    seen many startups adopt Agile. We have also seen many Agile consulting companies
    being used by large non-Agile


    3. The birth of the IBM PC. Accessed at https://www.ibm.com/ibm/history/exhibits/pc25/pc25_birth.html.'
  - '[PAGE 168]


    companies that want to get certain software projects done more quickly and reliably.


    That’s my prediction. We will eventually see larger companies create new divisions
    that use Agile for their software development. We will also see Agile consulting
    companies used more and more by larger organizations that have been unable to
    transform their existing development staff.


    # COACHING


    Does an Agile team need a coach? The short answer is “No.” The longer answer is
    “Sometimes.”


    First, we need to differentiate between Agile trainers and Agile coaches. An Agile
    trainer teaches a team how to conduct themselves in an Agile way. They are often
    hired from outside the company or are internal trainers from outside the team.
    Their goal is to inculcate the Agile values and teach the Agile disciplines. Their
    tenure should be short. Each team of a dozen or so developers should require no
    more than one or two weeks of training. Everything else they need to learn they’re
    going to learn by themselves no matter what the Agile trainer says or does.


    Early in the transition of a team, a trainer may temporarily fill the role of
    the coach, but this is a temporary situation. That role should be filled from
    within the team as soon as possible.


    In general, Agile coaches are not trainers. They are members of the team whose
    role is to defend the process within the team. In the heat of development, developers
    may be tempted to go off process. Perhaps they inadvertently stop pairing, stop
    refactoring, or ignore failures in the continuous build. It is the coach’s job
    to see this and point it out to the team. The coach acts as the team’s conscience,
    always reminding the team of the promises they made to themselves and the values
    they agreed to hold.'
  - '[PAGE 169]


    This role typically rotates from one team member to the next on an informal schedule
    and based on need. A mature team working steadily along does not require a coach.
    On the other hand, a team under some kind of stress—whether it be schedule, business,
    or interpersonal—may decide to ask someone to fill the role temporarily.


    The coach is not a manager. The coach is not responsible for budget or schedule.
    The coach does not direct the team nor does she represent the team’s interests
    to management. The coach is not the liaison between the customers and the developers.
    The role of the coach is strictly internal to the team. Neither the managers nor
    the customers know who the coach is, nor even whether there currently is a coach.


    # SCRUM MASTERS


    In Scrum, the coach is called a *Scrum Master*. The invention of this term, and
    the sequence of events that followed it, were among the best and worst things
    that happened to the Agile community. The certification programs attracted large
    numbers of project managers. This influx increased the popularity of Agile in
    the early days but eventually led to the role of the coach to be conflated with
    the role of the project manager.


    Nowadays, it is all too frequent that we see Scrum Masters who are not coaches
    at all but are simply project managers doing what project managers always did.
    Unfortunately, the title and certification tend to give them undue influence over
    the Agile team.


    # CERTIFICATION


    The Agile certifications that exist are a complete joke and an utter absurdity.
    Do not take the certifications seriously. The training that accompanies the certification
    programs is often worthwhile; however, that training should not be focused on
    a particular role, it should be for everyone on the team.'
  - '[PAGE 170]


    For example, the fact that someone is “certified” a Scrum Master is a worthless
    certification. The certifiers are not guaranteeing anything other than that the
    person paid the fee for, and possibly attended, a two-day course. The certifiers
    are specifically not guaranteeing that the newly minted Scrum Master will do a
    good job as a coach. The absurd implication of the certification is that there
    is something special about a “Certified Scrum Master,” which of course flies in
    the face of the notion of a coach. An Agile coach is not specially trained to
    be an Agile coach.


    Again, there’s often nothing wrong with the training programs that go along with
    these certifications. However, it is foolish to train just one special person.
    Every member of an Agile team needs to understand the values and techniques of
    Agile. Therefore, if one member of the team is trained, all members of the team
    should be trained.


    # ## Real Certification


    What would a real Agile certification program look like? It would be a semester-long
    course, complete with Agile training and the supervised development of a small
    Agile project. The course would be graded and the students held to a high bar.
    The certifier would guarantee that the students understood Agile values and showed
    proficiency in executing Agile disciplines.


    # ## Agile in the Large


    The Agile movement began in the late ’80s. It was quickly recognized as a means
    for organizing a small team of between 4 and 12 software developers. Those numbers
    are soft and were seldom articulated, but everyone understood that Agile (or whatever
    we called it before 2001) was not appropriate for a massive team of thousands
    of developers. That was not the problem we were trying to solve.'
