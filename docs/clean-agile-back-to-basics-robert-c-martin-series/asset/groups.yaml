    ## Conclusion


    Agile is a framework of disciplines that support professional software development.
    Those who profess these disciplines accept and conform to the reasonable expectations
    of managers, stakeholders, and customers. They also enjoy and abide by the rights
    that Agile confers to developers and customers. This mutual acceptance and conferral
    of rights and expectations—this profession of disciplines—is the foundation of
    an ethical standard for software.


    Agile is not a process. Agile is not a fad. Agile is not merely a set of rules.
    Rather, Agile is a set of rights, expectations, and disciplines of the kind that
    form the basis of an ethical profession.


    There are a host of business-facing practices that development must follow in
    order to succeed. These include Planning, Small Releases, Acceptance Tests, and
    Whole Team.


    ## PLANNING


    How do you estimate a project? The simple answer is that you break it down into
    its constituent pieces and then estimate those pieces. This is a fine approach;
    but what if the pieces themselves are too big to estimate with any accuracy? You
    simply break down those pieces into smaller pieces and estimate them. I’m sure
    you can all smell the recursive descent.


    How far down can you carry this procedure? You can carry it right down to individual
    lines of code. In fact, this is what programmers do. A programmer is someone who
    is skilled at breaking down a task into individual lines of code.


    If you would like an accurate and precise estimate of a project, then break it
    down into individual lines of code. The time it takes you to do this will give
    you a *very* accurate and precise measure of how long it took you to build the
    project—because you just built it.


    Of course, that misses the point of an *estimate*. An estimate is a guess; we
    want some idea of how long the project will take without actually *building* the
    project. We want the cost of estimation to be low. Therefore an estimate is, by
    definition, *imprecise*. The imprecision allows us to shorten the time necessary
    to create the estimate. The more imprecision, the less time the estimate will
    take.


    This is not to say that an estimate should be *inaccurate*. Estimates should be
    as accurate as possible, but only as precise as necessary to keep the cost of
    estimation low. An example may help. I estimate the moment of my death to be sometime
    within the next thousand years. This is completely accurate, but very imprecise.
    It took me virtually no time at all to create this accurate estimate.


    ## STORIES AND POINTS


    The story point technique deals with accuracy and precision by using a very tight
    feedback loop that iteratively calibrates and recalibrates estimates against reality.
    Imprecision is high at first, but within a few cycles it is reduced to manageable
    levels. But before we get into that, we need to talk a bit about stories.


    A *user story*[^2] is an abbreviated description of a feature of the system, told
    from the point of view of a user. So, for example:


    > As the driver of a car, in order to increase my velocity, I will press my foot
    harder on the accelerator pedal.


    This is one of the more common forms of a user story. Some people like it. Others
    prefer the more abbreviated form: *Accelerate.* Both work pretty well. Both are
    simply placeholders for a much larger conversation.


    Much of that conversation has not happened yet. It will happen when the developers
    are on the verge of developing the feature. The conversation was begun, however,
    at the moment that the story was written. At that time, the developers and stakeholders
    talked over some of the possible details of the story and then chose a simple
    wording to write down.


    The wording is simple, and the details are omitted because it is too early to
    count on those details. We want to delay the specification of those details as
    long as possible, right up to the point where the story is developed. So we leave
    the story in abbreviated form as a promise for a future conversation.


    Typically, we write the story on an index card. I know, I know. Why in the world
    would we use such ancient and primitive tools when we have computers and iPads
    and...? It turns out that being able to hold those cards in your hands, pass them
    across a table to each other, scribble on them, and otherwise *handle* them is
    immensely valuable.


    Automated tools do sometimes have their place, and I’ll talk about them in another
    chapter. For the moment, however, think of the stories as index cards.


    Please remember: World War II was managed[^3] on index cards, so I think the technique
    scales.


    ### ATM Stories


    Imagine that it is Iteration Zero, and we are on a team writing the stories for
    an automated teller machine (ATM). What are these stories? The first few are pretty
    easy to figure out: *Withdrawal*, *Deposit*, and *Transfer*. Of course, you also
    have to identify yourself to the ATM. We might call that *Login*. And that implies
    that there is a way to *Logout*.


    Now we have five cards. There will almost certainly be more once we start really
    getting into the behavior of the machine. We could imagine auditing tasks, loan
    payment tasks, and all kinds of other things. But let’s stick with those first
    five for now.


    What’s on those cards? Just the words mentioned: *Login*, *Logout*, *Withdrawal*,
    *Deposit*, and *Transfer*. Of course, those aren’t the only words that were *spoken*
    during our exploration. We talked about many details during that meeting. We mentioned
    how the user logs in by inserting her card in a slot and entering a PIN. We discussed
    a deposit consisting of an envelope that is inserted into a slot and on which
    we print identifying marks. We talked about how cash is dispensed, and what to
    do if the cash jams or if we run out. We worked through many of those details.


    But we don’t trust those details yet, so we don’t write them down. What we write
    down are just the words. There’s nothing wrong with making a few notes on the
    card if you want some reminders of the issues, but these aren’t requirements.
