    The practice of *Small Releases* suggests that a development team should release
    their software as often as possible. Back in the late ’90s, in the early days
    of Agile, we thought that this meant a release every “month or two.” Nowadays,
    however, we’ve set the goal to be much, much shorter.


    ![](img/8facf878fd02eafcdb1e1193ad5963b0_110_0.png)


