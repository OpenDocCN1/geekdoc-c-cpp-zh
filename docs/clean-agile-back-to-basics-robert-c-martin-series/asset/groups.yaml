  - '[PAGE 72]


    Is it possible for the system to be technically deployable every week or two?
    Of course it is. The team simply has to pick a batch of stories that is small
    enough to allow them to complete all the deployment readiness tasks before the
    end of the iteration. They’d better be automating the vast majority of their testing,
    too.


    From the point of view of the business and the customers, continuous technical
    readiness is simply expected. When the business sees a feature work, they expect
    that feature is done. They don’t expect to be told that they have to wait a month
    for QA stabilization. They don’t expect that the feature only worked because the
    programmers driving the demo bypassed all the parts that don’t work.


    # Stable Productivity


    You may have noticed that programming teams can often go very fast in the first
    few months of a greenfield project. When there’s no existing code base to slow
    you down, you can get a lot of code working in a short time.


    Unfortunately, as time passes, the messes in the code can accumulate. If that
    code is not kept clean and orderly, it will put a back pressure on the team that
    slows progress. The bigger the mess, the higher the back pressure, and the slower
    the team. The slower the team, the greater the schedule pressure, and the greater
    the incentive to make an even bigger mess. That positive-feedback loop can drive
    a team to near immobility.


    Managers, puzzled by this slowdown, may finally decide to add human resources
    to the team in order to increase productivity. But as we saw in the previous chapter,
    adding personnel actually slows down the team for a few weeks.


    The hope is that after those weeks the new people will come up to speed and help
    to increase the velocity. But who is training the new people? The people who made
    the mess in the first place. The new people will certainly emulate that established
    behavior.'
