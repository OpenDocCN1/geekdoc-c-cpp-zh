  - '[PAGE 113]


    # Git and Tests


    Nowadays we use Git. Checkout time using Git has shrunk to zero. The concept doesn’t
    exist. Rather, any alteration to a module can be committed at any time. Conflicts
    among these commits are resolved as and when the programmers desire. Tiny decoupled
    modules and rapid commit frequency result in cycle times that can be as small
    as minutes. Add to this the ability to create a comprehensive, fast-running test
    suite that tests almost *everything*, and you have the makings of *Continuous
    Delivery*.


    # Historical Inertia


    Unfortunately, it is difficult for organizations to shake off the behaviors of
    the past. The cycle time of days, weeks, and months is deeply ingrained in the
    culture of many teams and has spread to QA, to management, and to the expectations
    of the stakeholders. From the vantage of such a culture, the notion of *Continuous
    Delivery* can seem ludicrous.


    # Small Releases


    Agile attempts to break that historical inertia by driving the team to shorter
    and shorter release cycles. If you are releasing every six months, try every three
    months, then try every month, then try every week. Keep shortening the release
    cycle in an asymptotic approach to zero.


    To do this, the organization will need to break the coupling between release and
    deployment. The term “release” means that the software is technically ready to
    be deployed. The decision to deploy becomes solely a business decision.


    You may have noticed that this is the same language we used to describe iterations.
    Iterations are technically deployable. If our iterations are two weeks long, but
    we want to release more often than that, we’ll have to shorten our iterations.


    Can iterations be shortened asymptotically toward zero? Yes, they can. But that’s
    a topic for another section.'
