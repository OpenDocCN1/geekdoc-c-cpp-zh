    A benefit of the Fibonacci series is that it allows the team to estimate larger
    stories. For example, you could choose 1, 2, 3, 5, and 8, which gives you an 8×
    range in size.


    You may also wish to include 0, ∞, and ?. In *Flying Fingers*, you can use thumbs
    down, thumbs up, and an open hand for these symbols. Zero means “Too trivial to
    estimate.” Be careful with those! You may wish to merge a few of them into a bigger
    story. Infinity (∞) represents too big to estimate, and therefore the story should
    be split. And (?) means you simply don’t know, meaning that you’ll need a *spike*.


    ## Splitting, Merging, and Spiking


    Merging stories is simple. You can clip the cards together and treat the merged
    stories as one. Just add up all the points. If any have zero points, use your
    best judgment in summing them. After all, five zeros probably do not add up to
    zero.


    Splitting stories is a bit more interesting because you need to maintain INVEST.
    As a simple example of splitting a story, consider *Login*. If we wanted to split
    it into smaller stories, we could create *Login with No Password*, *Login with
    Single Password Attempt*, *Allow Multiple Password Attempts*, and *Forgot Password*.


    It is rare to find a story that cannot be split. This is especially true of those
    that are big enough to need splitting. Remember, it is the job of a programmer
    to split stories all the way down into individual lines of code. So splitting
    is almost always possible. The challenge is maintaining INVEST.


    A *spike* is a meta-story, or rather, a story for estimating a story. It is called
    a *spike* because it often requires us to develop a long but very thin slice through
    all the layers of the system.


    Let’s say there’s a story that you cannot estimate. Let’s call it *Print PDF*.
    Why don’t you know how to estimate it? Because you’ve never used the PDF library
    before and you aren’t sure how it works. So you write a new story called *Estimate
    Print PDF*. Now you estimate *that* story, which is easier to estimate.


    After all, you know what you’ll have to do to figure out how the PDF library works.
    Both stories go in the deck.


    In a future IPM, the stakeholders may decide to play the *Print PDF* card, but
    they can’t because of the spike. They have to play the spike card instead. That
    will allow the developers to do the work necessary to estimate the original story,
    which can be implemented in a future iteration.


    ## Managing the Iteration


    The goal of each iteration is to produce data by getting stories done. The team
    should focus on stories rather than tasks within stories. It is far better to
    get 80% of the stories done than it is to get each story 80% done. Focus on driving
    the stories to completion.


    As soon as the planning meeting ends, the programmers should choose the stories
    for which they will each individually be responsible. Some teams choose the first
    stories and leave the rest in a pile to be chosen later as stories are completed.
    Either way, stories are chosen by, and belong to, individual programmers.


    Managers and leads will be tempted to assign stories to programmers. This should
    be avoided. It is far better to let the programmers negotiate amongst themselves.


    For example:


    > *Jerry (Journeyman):* If nobody minds, I’ll take Login and Logout. It makes
    sense to do them together.

    >

    > *Jasmine (Journeyman):* I don’t have a problem with that, but why don’t you
    pair with Alphonse on the database part. He’s been asking about our event-sourcing
    style, and Login would be a gentle introduction. Alphonse?

    >

    > *Alphonse (Apprentice):* That sounds great to me. Once I’ve seen that, I should
    be able to work on Withdraw.

    >

    > *Alexis (Lead programmer):* Why don’t I take Withdraw, Alphonse. You can pair
    with me on that, too. Then you can take Transfer.

    >

    > *Alphonse:* Aw, OK. That probably makes more sense. Small steps, right?

    >

    > *Jasmine:* Right, Al. And that leaves Deposit. I’ll take that one. Alexis, you
    and I should put our heads together on the UIs because they’re likely similar.
    We might be able to share some code.


    In this example, you can see how the lead programmer guides the new, ambitious
    apprentice away from biting off more than he can chew, and how the team generally
    collaborates on choosing the stories.


    ## QA and Acceptance Tests


    If QA has not already begun to write the automated acceptance tests, they should
    start as soon as the IPM ends. The tests for stories that are scheduled for early
    completion should be done early. We don’t want completed stories waiting for acceptance
    tests to be written.


    Acceptance test writing should go quickly. We expect them to all be written before
    the midpoint of the iteration. If not all the acceptance tests are ready by the
    midpoint, then some of the developers should stop working on stories and start
    working on acceptance tests.


    This will likely mean that not all the stories will be completed in this iteration,
    but a story cannot be completed without the acceptance tests anyway. Just be sure
    that the programmers working on a story are not also writing the acceptance tests
    for that story. If QA continues to miss the midpoint deadline, one iteration after
    another, then the ratio of QA engineers to developers is likely wrong.


    The purpose of estimating the iteration during the IPM is simply so that the stakeholders
    know how many stories *might* get done. This helps the stakeholders choose the
    stories and helps them to plan. But that estimate is not a promise, and the team
    has not failed if the actual velocity is lower.


    Remember, the only failing iteration is an iteration that fails to produce data.


    ## Falling Velocity


    If the velocity chart shows a consistent negative slope, then the most likely
    cause is the quality of the code. The team is likely not refactoring enough and
    they are probably allowing the code to rot. One reason that teams fail to refactor
    enough is that they don’t write enough unit tests, so they fear that refactoring
    will break something that used to work. Managing this fear of change is a major
    goal of team management, and it all comes down to the testing discipline. We’ll
    have much more to say about that later.


    As velocity falls, pressure on the team builds. This causes the points to inflate.
    That inflation can hide the falling velocity.


    ## The Golden Story


    One way to avoid inflation is to constantly compare story estimates back to the
    original *Golden Story*, the standard against which other stories will be measured.
    Remember that *Login* was our original *Golden Story*, and it was estimated as
    3. If a new story such as *Fix Spelling Error in Menu Item* has an estimate of
    10, you know that some inflationary force is at work.


