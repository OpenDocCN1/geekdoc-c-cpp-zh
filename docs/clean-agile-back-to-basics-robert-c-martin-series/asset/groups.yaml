    - 9. 科德，P.，和E. 约当。1990.《面向对象分析》。新泽西州恩格尔伍德克利夫斯：Yourdon出版社。

    - 10. 布奇，G. 1991.《面向对象设计及其应用》。加州雷德伍德城：本杰明-卡明斯出版公司。

