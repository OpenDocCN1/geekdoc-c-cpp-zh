    There’s no reason ALMs can’t be great tools someday. But if you only need to manage
    a card wall and must use software, adopt a general-purpose tool like Trello.<sup>8</sup>
    It’s easy, immediate, cheap, extensible, and won’t make you queasy.


    Our ways of working constantly change. We evolved from SCCS to RCS to CVS to Subversion
    to Git over the years, tracking a sea change in the ways we managed source code.
    We have similar evolution in testing tools, deployment tools, and the like (not
    listed here). We are likely to see a similar progression in automated ALM tools.


    Given the current state of most ALM tools, it may be safer and smarter to begin
    with physical tools. Later, you can *consider* using an ALM tool. Make sure that
    it’s quick to learn, transparent in daily use, easy to adapt, and within your
    means to acquire and run. Most importantly, ensure that it supports the way your
    team works and provides a positive return on your investment.


