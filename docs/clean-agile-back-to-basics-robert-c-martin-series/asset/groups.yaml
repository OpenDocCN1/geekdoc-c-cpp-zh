  - '[PAGE 99]


    So at the IPM, the stakeholders select stories that add up to 18 points. But this
    time, at the midpoint review, something strange has happened. There are 12 points
    done. Should we tell them?


    We don’t have to. They can see it for themselves. So the stakeholders add six
    more points to the plan, for a planned total of 24.


    Of course, the team really only completes 22. So 22 will be chosen for the next
    iteration.


    # The End of the Project


    And on it goes like this. As each iteration completes, the completed velocity
    is added to the velocity chart, so that everyone can see how fast the team is
    going.


    Now imagine that this process continues, iteration after iteration, month after
    month. What is happening to that deck of story cards? Think of the iteration cycle
    as a pump that pumps the ROI out of that deck. Think of the continuous exploration
    of the requirements as a pump that pumps ROI back into the deck. As long as incoming
    ROI outpaces the outgoing ROI, the project will continue.


    However, it may happen that the number of new features discovered in exploration
    gradually sinks to zero. When that happens, the remaining ROI in the deck will
    be exhausted after just a few more iterations. The day will come when, at the
    IPM, the stakeholders scan the deck for something worth doing and find nothing.
    The project is over.


    The project is not over when all the stories are implemented. The project is over
    when there are no more stories in the deck worth implementing.


    It is sometimes amazing what is left in the deck after the project is over. I
    once worked on a year-long project where the very first story written, the story
    that gave the project its name, was never chosen for implementation. That story
    was important at the time, but there were many more urgent stories to implement.
    By the time all those urgent stories were resolved, the importance of the original
    story had evaporated.'
  - '[PAGE 100]


    # Stories


    User stories are simple statements that we use as reminders of features. We try
    not to record too much detail when we write the story because we know that those
    details will likely change. The details are recorded later, but as acceptance
    tests, which we’ll discuss later.


    Stories follow a simple set of guidelines that we remember with the acronym *INVEST*.


    +   - **I: Independent.** User stories are independent of each other. This means
    that they do not need to be implemented in any particular order. *Login* does
    not need to be implemented before *Logout*.


    This is a soft requirement because there may well be stories that depend on other
    stories being implemented first. For example, if we define *Login* without any
    forgotten password recovery, then clearly *Password Recovery* depends, to some
    extent, upon *Login*. Still, we try to separate the stories so that there is as
    little dependence as possible. This allows us to implement the stories in the
    order of business value.


    +   - **N: Negotiable.** This is another reason why we don’t write down all the
    details. We want those details to be negotiable between the developers and the
    business.


    For example, the business might ask for a fancy drag-and-drop interface to some
    feature. The developers could recommend a simpler checkbox style by saying that
    it would be much less expensive to develop. Negotiations like that are important
    because it is one of the few ways that the business gains insight into ways of
    managing the cost of developing software.


    +   - **V: Valuable.** The story must have clear and quantifiable value to the
    business.


    Refactoring is never a story. Architecture is never a story. Code cleanup is never
    a story. A story is always something that the business values. Don’t worry, we
    will deal with refactoring, architecture, and cleanup—but not with stories.'
  - '[PAGE 101]


