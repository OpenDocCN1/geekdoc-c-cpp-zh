    ## Changing the Schedule


    Let’s start with the schedule. Let’s ask the stakeholders if we can delay the
    project from November 1 to March 1. These conversations usually don’t go well.
    Remember, the date was chosen for good business reasons. Those business reasons
    probably haven’t changed. So a delay often means that the business is going to
    take a significant hit of some kind.


    On the other hand, there are times when the business simply chooses the date for
    convenience. For example, maybe there is a trade show in November where they want
    to show off the project. Perhaps there’s another trade show in March that would
    be just as good. Remember, it’s still early. We’re only a few iterations into
    this project. We want to tell the stakeholders that our delivery date will be
    March *before* they buy the booth space at the November show.


    Many years ago, I managed a group of software developers working on a project
    for a telephone company. In the midst of the project, it became clear that we
    were going to miss the expected delivery date by six months. We confronted the
    telephone company executives about this as early as we could. These executives
    had never had a software team tell them, early, that the schedule would be delayed.
    They stood up and gave us a standing ovation.


    You should not expect this. But it did happen to us. Once.


    ## Adding Staff


    In general, the business is simply not willing to change the schedule. The date
    was chosen for good business reasons, and those reasons still hold. So let’s try
    to add staff. Everyone knows we can go twice as fast by doubling the staff.


    Actually, this is exactly the opposite of the case. Brooks’ law[^2] states: *Adding
    manpower to a late project makes it later.*


    I’m sure you know that I’m going to tell you this is futile. Producing crap does
    *not* make you go faster, it makes you go slower. This is the lesson you learn
    after you’ve been a programmer for 20 or 30 years. There is no such thing as quick
    and dirty. Anything dirty is slow.


    > *The only way to go fast, is to go well.*


    So we’re going to take that quality knob and turn it up to 11. If we want to shorten
    our schedule, the only option is to *increase* quality.


    ## Changing Scope


    That leaves one last thing to change. Maybe, just maybe, some of the planned features
    don’t really need to be done by November 1. Let’s ask the stakeholders.


    > “Stakeholders, if you need all these features then it’s going to be March. If
    you absolutely have to have something by November then you’re going to have to
    take some features out.”


    > “*We’re not taking anything out; we have to have it all! And we have to have
    it all by November first.*”


    > “Ah, but you don’t understand. If you need it all, it’s going to take us till
    March to do it.”


    > “*We need it all, and we need it all by November?*”


    This little argument will continue for a while because no one ever wants to give
    ground. But although the stakeholders have the moral high ground in this argument,
    the programmers have the data. And in any rational organization, the data will
    win.


    If the organization is rational, then the stakeholders eventually bow their heads
    in acceptance and begin to scrutinize the plan. One by one, they will identify
    the features that they don’t absolutely need by November. This hurts, but what
    real choice does the rational organization have? And so the plan is adjusted.
    Some features are delayed.


    ## Business Value Order


    Of course, inevitably the stakeholders will find a feature that we have already
    implemented and then say, “It’s a real shame you did that one, we sure don’t need
    it.”


    We never want to hear that again! So from now on, at the beginning of each iteration,
    we are going to ask the stakeholders which features to implement next. Yes, there
    are dependencies between the features, but we are programmers, we can deal with
    dependencies. One way or another we will implement the features in the order that
    the stakeholders ask.


    ## Here Endeth the Overview


    What you have just read is the 20,000 foot view of Agile. A lot of details are
    missing, but this is the gist of it. Agile is a process wherein a project is subdivided
    into iterations. The output of each iteration is measured and used to continuously
    evaluate the schedule. Features are implemented in the order of business value
    so that the most valuable things are implemented first. Quality is kept as high
    as possible. The schedule is primarily managed by manipulating scope.


    That’s Agile.


    ## Circle of Life


    Figure 1.8 is Ron Jeffries’ diagram describing the practices of XP. This diagram
    is affectionately known as the *Circle of Life*.


    ![](img/8facf878fd02eafcdb1e1193ad5963b0_58_0.png)


    **Figure 1.8** The Circle of Life


    I have chosen the practices of XP for this book because, of all the Agile processes,
    XP is the best defined, the most complete, and the least muddled. Virtually all
    other Agile processes are a subset of or a variation on XP. This is not to say
    that these other Agile processes should be discounted. You may, in fact, find
    them valuable for various projects. But if you want to understand what Agile is
    really all about, there is no better way than to study XP. XP is the prototype,
    and the best representative, of the essential core of Agile.


    Kent Beck is the father of XP, and Ward Cunningham is the grandfather. The two
    of them, working together at Tektronix in the mid ’80s, explored many of the ideas
    that eventually became XP. Kent later refined those ideas into the concrete form
    that became XP, circa 1996. In 2000, Beck published the definitive work: *Extreme
    Programming Explained: Embrace Change.*[^23]


    The Circle of Life is subdivided into three rings. The outer ring shows the business-facing
    practices of XP. This ring is essentially the equivalent of the Scrum[^24] process.
    These practices provide the framework for the way the software development team
    communicates with the business and the principles by which the business and development
    team manage the project.


    - The *Planning Game* practice plays the central role of this ring. It tells us
    how to break down a project into features, stories, and tasks. It provides guidance
    for the estimation, prioritization, and scheduling of those features, stories,
    and tasks.

    - *Small Releases* guides the team to work in bite-sized chunks.

    - *Acceptance Tests* provide the definition of “done” for features, stories, and
    tasks. It shows the team how to lay down unambiguous completion criteria.

    - *Whole Team* conveys the notion that a software development team is composed
    of many different functions, including programmers, testers, and managers, who
    all work together toward the same goal.


    The middle ring of the Circle of Life presents the team-facing practices. These
    practices provide the framework and principles by which the development team communicates
    with, and manages, itself.


    - *Sustainable Pace* is the practice that keeps a development team from burning
    their resources too quickly and running out of steam before the finish line.

    - *Collective Ownership* ensures that the team does not divide the project into
    a set of knowledge silos.

    - *Continuous Integration* keeps the team focused on closing the feedback loop
    frequently enough to know where they are at all times.

    - *Metaphor* is the practice that creates and promulgates the vocabulary and language
    that the team and the business use to communicate about the system.


    [^2]: Brooks, Jr., F. P. 1995 [1975]. *The Mythical Man-Month*. Reading, MA: Addison-Wesley.
    https://en.wikipedia.org/wiki/Brooks%27s_law


    [^23]: Beck, K. 2000. *Extreme Programming Explained: Embrace Change.* Boston,
    MA: Addison-Wesley. There is a second edition with a 2005 copyright, but the first
    edition is my favorite and is the version that I consider to be definitive. Kent
    may disagree.


    [^24]: Or at least as Scrum was originally conceived. Nowadays, Scrum has absorbed
    many more of the XP practices.

    '
