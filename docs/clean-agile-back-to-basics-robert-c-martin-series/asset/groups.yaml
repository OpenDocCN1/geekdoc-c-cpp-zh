    To understand just how severe this problem is, consider the shutdown of the Air
    Traffic Control network over Los Angeles due to the rollover of a 32-bit clock.
    Or the shutdown of all the power generators on board the Boeing 787 for the same
    reason. Or the hundreds of people killed by the 737 Max MCAS software.


    Or how about my own experience with the early days of healthcare.gov? After initial
    login, like so many systems nowadays, it asked for a set of security questions.
    One of those was “A memorable date.” I entered 7/21/73, my wedding anniversary.
    The system responded with `Invalid Entry`.


    I’m a programmer. I know how programmers think. So I tried many different date
    formats: `07/21/1973`, `07–21–1973`, `21 July, 1973`, `07211973`, etc. All gave
    me the same result. `Invalid Entry`. This was frustrating. What date format did
    the blasted thing want?


    Then it occurred to me. The programmer who wrote this didn’t know what questions
    would be asked. He or she was just pulling the questions from a database and storing
    the answers. That programmer was probably also disallowing special characters
    and numbers in those answers. So I typed: `Wedding Anniversary`. This was accepted.


    I think it’s fair to say that any system that requires its users to think like
    programmers in order to enter data in the expected format is crap.


