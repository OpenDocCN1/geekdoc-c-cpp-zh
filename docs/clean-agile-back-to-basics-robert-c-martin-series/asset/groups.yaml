    所有框架基本上都是由个体敏捷实践组成的“现成”配方。与其实施这些配方之一，不如考虑使用敏捷和教练来发现并实施一种针对你的具体环境量身定制的自定义配方。如果最终这个配方是SAFe、Nexus、LeSS或Scrum@Scale，那就太好了！


    以下是最成功的企业敏捷教练如何结合敏捷和教练，以最适合组织的方式发现并实施敏捷的概述。在个体层面，教练的本质是帮助人们自己解决问题。在团队和组织层面，教练意味着帮助团队自己实现目标。首先，教练将所有受敏捷采用影响的人视为“客户”。然后，利用回顾会议、开放空间活动及类似技术，他们发现客户所看到的挑战和机遇。这成为组织的敏捷采用待办列表。接下来，使用诸如点投票之类的群体决策工具，教练确定待办列表的顶部事项。然后，他们协助组织实施若干项最高优先级的待办事项。最后，他们进行回顾并重复。当然，对于许多参与者来说，这将是他们第一次采用敏捷。仅靠教练是不够的；教学和指导也会发挥作用，以便人们能够做出明智的决定。


