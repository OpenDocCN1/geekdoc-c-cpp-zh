    # The Iron Cross


    The reason that these techniques fail so spectacularly is that the managers who
    use them do not understand the fundamental physics of software projects. This
    physics constrains all projects to obey an unassailable trade-off called the *Iron
    Cross* of project management. Good, fast, cheap, done: Pick any three you like.
    You can’t have the fourth. You can have a project that is good, fast, and cheap,
    but it won’t get done. You can have a project that is done, cheap, and fast, but
    it won’t be any good.


    The reality is that a good project manager understands that these four attributes
    have coefficients. A good manager drives a project to be good enough, fast enough,
    cheap enough, and done as much as necessary. A good manager manages the coefficients
    on these attributes rather than demanding that all those coefficients are 100%.
    It is this kind of management that Agile strives to enable.


    At this point I want to be sure that you understand that Agile is a framework
    that *helps* developers and managers execute this kind of pragmatic project management.
    However, such management is not made automatic, and there is no guarantee that
    managers will make appropriate decisions. Indeed, it is entirely possible to work
    within the Agile framework and still completely mismanage the project and drive
    it to failure.


    # Charts on the Wall


    So how does Agile aid this kind of management? *Agile provides data.* An Agile
    development team produces just the kinds of data that managers need in order to
    make good decisions.


