    That’s all. No discussion. No posturing. No deep explanations. No cold houses
    nor dark thoughts. No complaints about Jean and Joan and who knows who. Everybody
    gets 30 seconds or so to answer those three questions. Then the meeting is over
    and everyone returns to work. Done. Finito. Capisce?


    Perhaps the best description of the standup meeting is on Ward’s wiki: http://wiki.c2.com/?StandUpMeeting.


    ## Pigs and Chickens?


    I won’t repeat the ham-and-eggs story here. You can look it up in the footnote<sup>10</sup>
    if you are interested. The gist is that only developers should speak at the standup.
    Managers and other folks may listen in but should not interject.


    From my point of view, I don’t care who speaks so long as everyone follows the
    same three-question format and the meeting is kept to about 10 minutes.


    ## Shout-out


    One modification that I have enjoyed is to add an optional fourth question:


    - Whom do you want to thank?


    This is just a quick acknowledgment of someone who helped you or who did something
    you believe deserves recognition.


