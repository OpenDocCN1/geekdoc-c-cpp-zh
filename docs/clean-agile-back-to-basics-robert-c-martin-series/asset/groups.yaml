    The level to which the Waterfall mindset dominated us can be seen in the language
    of the day. When Dijkstra came up with Structured Programming in 1968, Structured
    Analysis<sup>7</sup> and Structured Design<sup>8</sup> were not far behind. When
    Object-Oriented Programming (OOP) started to become popular in 1988, Object-Oriented
    Analysis<sup>9</sup> and Object-Oriented Design<sup>10</sup> (OOD) were also not
    far behind. This triplet of memes, this triumvirate of phases, had us in its thrall.
    We simply could not conceive of a different way to work.


    And then, suddenly, we could.


    The beginnings of the Agile reformation began in the late 1980s or early 1990s.
    The Smalltalk community began showing signs of it in the ’80s. There were hints
    of it in Booch’s 1991 book on OOD.<sup>10</sup> More resolution showed up in Cockburn’s
    Crystal Methods in 1991. The Design Patterns community started to discuss it in
    1994, spurred by a paper written by James Coplien.<sup>11</sup>


    By 1995 Beedle,<sup>12</sup> Devos, Sharon, Schwaber, and Sutherland had written
    their famous paper on Scrum.<sup>13</sup> And the floodgates were opened. The
    bastion of Waterfall had been breached, and there was no turning back.


    This, once again, is where I come into the story. What follows is from my memory,
    and I have not tried to verify it with the others involved. You should therefore
    assume that this recollection of mine has many omissions and contains much that
    is apocryphal, or at least wildly inaccurate. But Don’t Panic, because I’ve at
    least tried to keep it a bit entertaining.


    I first met Kent Beck at that 1994 PLOP,<sup>14</sup> where Coplien’s paper was
    presented. It was a casual meeting, and nothing much came of it. I met him next
    in February 1999 at the OOP conference in Munich. But by then I knew a lot more
    about him.


    At the time, I was a C++ and OOD consultant, flying hither and yon helping folks
    to design and implement applications in C++ using OOD techniques. My customers
    began to ask me about process. They had heard that Waterfall didn’t mix with OO,
    and they wanted my advice. I agreed<sup>15</sup> about the mixing of OO and Waterfall
    and had been giving this idea a lot of thought myself. I had even thought I might
    write my own OO process. Fortunately, I abandoned that effort early on because
    I had stumbled across Kent Beck’s writings on Extreme Programming (XP).


    The more I read about XP, the more fascinated I was. The ideas were revolutionary
    (or so I thought at the time). They made sense, especially in an OO context (again,
    so I thought at the time). And so I was eager to learn more.


    To my surprise, at that OOP conference in Munich, I found myself teaching across
    the hall from Kent Beck. I bumped into him during a break and said that we should
    meet for lunch to discuss XP. That lunch set the stage for a significant partnership.
    My discussions with him led me to fly out to his home in Medford, Oregon, to work
    with him to design a course about XP. During that visit, I got my first taste
    of Test-Driven Development (TDD) and was hooked.


    At the time, I was running a company named Object Mentor. We partnered with Kent
    to offer a five-day boot camp course on XP that we called *XP Immersion*. From
    late 1999 until September 11, 2001,<sup>16</sup> they were a big hit! We trained
    hundreds of folks.


    Agneta Jacobson had been invited but could not attend. And, after all, the vast
    majority of senior programmers in the world, at the time, were middle-aged white
    men—the reasons why this was the case is a story for a different time, and a different
    book.


    The 17 of us represented quite a few different viewpoints, including 5 different
    lightweight processes. The largest cohort was the XP team: Kent Beck, myself,
    James Grenning, Ward Cunningham, and Ron Jeffries. Next came the Scrum team: Ken
    Schwaber, Mike Beedle, and Jeff Sutherland. Jon Kern represented Feature-Driven
    Development, and Arie van Bennekum represented the Dynamic Systems Development
    Method (DSDM). Finally, Alistair Cockburn represented his Crystal family of processes.


    The rest of the folks were relatively unaffiliated. Andy Hunt and Dave Thomas
    were the Pragmatic Programmers. Brian Marick was a testing consultant. Jim Highsmith
    was a software management consultant. Steve Mellor was there to keep us honest
    because he was representing the Model-Driven philosophy, of which many of the
    rest of us were suspicious. And finally came Martin Fowler, who although he had
    close personal connections to the XP team, was skeptical of any kind of branded
    process and sympathetic to all.


    I don’t remember much about the two days that we met. Others who were there remember
    it differently than I do.<sup>17</sup> So, I’ll just tell you what I remember,
    and I’ll advise you to take it as the nearly two-decade-old recollection of a
    65-year-old man. I might miss a few details, but the gist is probably correct.


    It was agreed, somehow, that I would kick off the meeting. I thanked everyone
    for coming and suggested that our mission should be the creation of a manifesto
    that described what we believed to be in common about all these alterations and
    suggestions, but it was clear that we were done. There was this feeling of closure
    in the room. No disagreement. No argument. Not even any real discussion of alternatives.
    Those four lines were it.


    - Individuals and interactions over processes and tools.

    - Working software over comprehensive documentation.

    - Customer collaboration over contract negotiation.

    - Responding to change over following a plan.


    Did I say we were done? It felt like it. But of course, there were lots of details
    to figure out. For one thing, what were we going to call this thing that we had
    identified?


    The name “Agile” was not a slam dunk. There were many different contenders. I
    happened to like “Light Weight,” but nobody else did. They thought it implied
    “inconsequential.” Others liked the word “Adaptive.” The word “Agile” was mentioned,
    and one person commented that it was currently a hot buzzword in the military.
    In the end, though nobody really loved the word “Agile,” it was just the best
    of a bunch of bad alternatives.


    As the second day drew to a close, Ward volunteered to put up the agilemanifesto.org
    website. I believe it was his idea to have people sign it.


    ## AFTER SNOWBIRD


    The following two weeks were not nearly so romantic or eventful as those two days
    in Snowbird. They were mostly dominated by the hard work of hammering out the
    principles document that Ward eventually added to the website.


    The idea to write this document was something we all agreed was necessary in order
    to explain and direct the four values. After all, the four values are the kinds
    of statements that everyone can agree with without actually changing


