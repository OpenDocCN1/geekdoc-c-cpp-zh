    # MARATHON


    That was the moment that I learned that a software project is a marathon, not
    a sprint, nor a sequence of sprints. In order to win, you must pace yourself.
    If you leap out of the blocks and run at full speed, you’ll run out of energy
    long before you cross the finish line.


    Thus, you must run at a pace that you can sustain over the long haul. You must
    run at a *Sustainable Pace*. If you try to run faster than the pace you can sustain,
    you will have to slow down and rest before you reach the finish line, and your
    average speed will be slower than the Sustainable Pace. When you are close to
    the finish line, if you have a bit of spare energy, you can sprint. But you must
    not sprint before that.


    Managers may ask you to run faster than you should. You must not comply. It is
    your job to husband your resources to ensure that you endure to the end.


    # DEDICATION


    Working overtime is not a way to show your dedication to your employer. What it
    shows is that you are a bad planner, that you agree to deadlines to which you
    shouldn’t agree, that you make promises you shouldn’t make, that you are a manipulable
    laborer and not a professional.


    This is not to say that all overtime is bad, nor that you should never work overtime.
    There are extenuating circumstances for which the only option is to work overtime.
    But they should be extremely rare. And you must be very *aware* that the cost
    of that overtime will likely be greater than the time you save on the schedule.


    That all-nighter that I pulled with Jim all those decades ago was not the last
    all-nighter I was to pull—it was the second to last. The last all-nighter I pulled
    was one of those extenuating circumstances over which I had no control.'
