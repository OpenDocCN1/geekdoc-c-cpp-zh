    ## 敏捷工具


    作者：蒂姆·奥廷格（Tim Ottinger）和杰夫·朗格尔（Jeff Langr），2019年4月16日


    工匠精通他们的工具。木匠在职业生涯的起步阶段就会熟练使用锤子、卷尺、锯子、凿子、刨子和水平仪——这些都是廉价的工具。随着需求增长，木匠会学习并使用更强大的工具（通常也更昂贵）：例如电钻、射钉枪、车床、路由器、CAD
    和 CNC。


    然而，木匠大师并不会放弃手工工具；他们会为工作选择正确的工具。仅使用手工工具，技艺精湛的工匠也能制造出质量更高的木制品，有时甚至比使用电动工具还快。因此，明智的木匠会在转向更复杂的工具之前，先精通他们的手工工具。他们了解手工工具的局限，以便知道何时该拿起电动工具。


    无论使用手工工具还是电动工具，木匠总是力求精通他们为工具箱选择的每一件工具。这种精通使他们能够专注于工艺本身——例如，精心打造一件高品质家具——而不是工具。如果没有精通，工具就会成为交付的障碍，而使用不当的工具甚至可能对项目及其操作者造成伤害。


    ### 软件工具


    软件开发人员必须掌握许多核心工具：


    - 至少一种编程语言，通常更多

    - 集成开发环境或程序员编辑器（vim、Emacs 等）

    - 各种数据格式（JSON、XML、YAML 等）和标记语言（包括 HTML）

    - 与操作系统的命令行和脚本交互

    - 源代码仓库工具（Git。还有其他选择吗？）


    *经许可使用。*


    - 持续集成/构建工具（Jenkins、TeamCity、GoCD 等）

    - 部署/服务器管理工具（Docker、Kubernetes、Ansible、Chef、Puppet 等）

    - 沟通工具：电子邮件、Slack、英语（！）

    - 测试工具（单元测试框架、Cucumber、Selenium 等）


    这些类别的工具对于构建软件至关重要。没有它们，在当今世界不可能交付任何东西。从某种意义上说，它们代表了程序员工具箱中的“手工工具”。


    其中许多工具需要长期积累的专业知识才能有效使用。与此同时，技术格局不断变化，使得掌握工具更具挑战性。精明的开发者在所有相关工具中找到阻力最小、价值最高的路径：什么能带来最大的性价比？


    #### 什么构成有效工具？


    工具格局变化迅速，因为我们总是在学习实现目标的更有效方法。看看过去几十年中引入的各种源代码仓库工具：PVCS、ClearCase、Microsoft Visual
    SourceSafe、StarTeam、Perforce、CVS、Subversion 和 Mercurial 等等。它们都存在这样或那样的问题——太不稳定、太专有或封闭、太慢、太具侵入性、太可怕、太复杂。最终出现了一个赢家，一个成功克服了大多数问题的工具：Git。


    Git 最强大的方面之一是它让你感到安全。如果你入行足够久，用过其他工具，你很可能时常感到有点紧张。你需要与服务器保持实时网络连接，否则你的工作就有风险。CVS
    仓库偶尔会损坏，需要你在其“阁楼”里翻找，希望能修复损坏。仓库服务器有时会崩溃；即使有备份，你也有丢失半天工作的风险。一些专有工具会遇到仓库损坏的问题，这意味着你得和客服通几个小时电话，同时为支付修复费用而筹集赎金。使用
    Subversion 时，你会害怕做太多分支操作，因为涉及的源文件越多，切换分支时等待的时间就越长（这里说的是好几分钟）。


    一个好的工具应该让你用得舒心，不会因害怕使用而感到不安。Git 速度快，它允许你在本地提交而不仅仅是提交到服务器，它允许你在没有网络连接的情况下从本地仓库工作，它善于处理多个仓库和多个分支，并且能娴熟地支持合并。


    Git 的界面相当简洁直接。因此，一旦你足够好地学会了 Git，你就不太会去考虑工具本身。相反，你专注于实际需求：源代码版本的安全存储、集成和管理。这个工具已经变得*透明*。


    Git 是一个强大而复杂的工具，那么“足够好”地学会它究竟意味着什么？幸运的是，80/20 法则适用：Git 能力的一小部分——也许 20%——就能满足你
    80% 以上的日常源代码管理需求。你可以在几分钟内学会大部分所需内容。其余的可以在网上找到。


    Git 的简单和有效导致了思考如何构建软件的全新且完全出乎意料的方式。林纳斯·托瓦兹（Linus Torvalds）可能会认为使用 Git 作为快速丢弃代码片段的工具是疯狂的，但这正是
    Mikado 方法⁶ 和 TCR（Test && Commit || Revert）⁷ 支持者所提倡的。尽管 Git 的一个关键强大方面是它能够非常有效地处理分支，但无数团队在使用
    Git 时几乎只进行主干开发。这个工具被*拓展使用*（以创始者未曾预料的方式有效地使用）。


    伟大的工具具有以下特点：


    - 帮助人们实现目标

    - 可以快速“足够好”地学会


    ⁶ Ellnestam, O., 和 D. Broland. 2014. *Mikado 方法*. 谢尔特岛，纽约：Manning Publications.

    ⁷ Beck, K. 2018. *Test && commit || revert*. 访问于 https://medium.com/@kentbeck_7670/test-commit-revert-870bbd756864.


    - 对用户透明

    - 允许适应和拓展使用

    - 价格实惠


    我们在这里以 Git 为例，说明一个伟大的工具……截至 2019 年。你可能在未来的某一年读到这篇文章，所以请记住，格局是会变化的。


    ### 实体敏捷工具


    敏捷实践者以使用白板、胶带、索引卡、记号笔和各种尺寸的便利贴（小的和挂图纸大小的）来可视化管理工作而闻名。这些简单的“手工器具”具备伟大工具的所有品质：


    - 它们有助于让进行中的工作可见且可管理。

    - 它们直观——无需培训！

    - 它们所需的认知开销几乎可以忽略不计。你可以一边专注于其他任务，一边轻松使用它们。

    - 它们容易被拓展使用。这些工具没有一个是专门为管理软件开发而设计的。

    - 它们具有适应性。你可以将胶带或粘性腻子与它们一起使用，夹上图片或图标，贴上额外的指示物，并通过创新使用自定义颜色和图标来添加细微的含义。

    - 它们都价格低廉且易于获得。


    同一地点的团队仅使用这些简单廉价的实体工具就能轻松管理庞大而复杂的项目。你可以将挂图纸贴在墙上，向四周辐射关键信息。这种*信息辐射器*为团队成员和赞助者同样总结重要的趋势和事实。你可以利用这些信息辐射器随时设计并呈现新的信息类型。灵活性几乎是无限的。


    每种工具都有其局限性。实体工具的一个关键局限性是它们对分布式团队不太有效，只对视程范围内的人有效。实体工具也不会自动维护历史记录——你只能看到当前状态。


    没有理由认为 ALM 工具未来不能成为伟大的工具。但如果你只需要管理一面卡片墙并且必须使用软件，那就采用像 Trello 这样的通用工具。<sup>8</sup>
    它简单、即时、便宜、可扩展，而且不会让你感到不安。


    <sup>8</sup> 同样，截至 2019 年。格局是会变化的。


    我们的工作方式不断变化。多年来，我们从 SCCS 到 RCS 到 CVS 到 Subversion 再到 Git，见证了源代码管理方式的巨变。在测试工具、部署工具等方面也有类似的演变（这里未列出）。我们很可能会在自动化
    ALM 工具中看到类似的进展。


    鉴于大多数 ALM 工具的当前状态，从实体工具开始可能更安全、更明智。之后，你可以*考虑*使用 ALM 工具。确保它能快速学习、日常使用透明、易于调整，并且你能够负担得起获取和运行的成本。最重要的是，确保它支持你团队的工作方式，并为你的投资提供正回报。


    ## 教练——另一种视角


    作者：达蒙·普尔（Damon Poole），2019年5月14日<sup>9</sup>


    > *达蒙·普尔是我的一位朋友，他在许多事情上与我意见相左。敏捷教练只是其中之一。所以，我想他会是一个很好的选择，能为你提供不同的观点。*

    >

    > —— UB


    ### 通往敏捷的众多路径


    通往敏捷的路径有很多。事实上，我们中的许多人都是无意中走上这条路的。有人可能会说，敏捷宣言的产生是因为作者们注意到他们都在相似的旅程上，于是决定将其描述出来，以便其他人可以选择加入他们的旅程。我的敏捷之路始于
    1977 年走进一家恰好出售 TRS-80 的电器商店。作为一个完全的新手，我帮助一位


    <sup>9</sup> 经许可使用。


