  md: '# Chapter 17 Graphics and UI: Examples


    The UI pulls data from the model when it is ready and the data is needed, compared
    to Apple''s take on MVC that features controllers pushing data to the UI from
    the model.


    Leaving the UI in change to update itself when it is ready has always been a fundamental
    tenet of MVC that largely ignored by current ViewController programming practice,
    but it becomes more crucial when coordinating with asynchronous operations adding
    more data while those animations are running. Trying to coordinate this in a push
    model becomes almost impossible and has led to complex solutions such as FRP and
    React, but good old MVC always had the answer: just notify the UI (without pushing
    data) and let it decide when to update itself.


    In our case, UI elements are parameterized with the URIs of the objects they are
    supposed to represent. They can then obtain the most up-to-date version of objects
    from the memory store by sending the objectsReference: message with that URI.


    That URI is used in updated notifications. We use the basic Cocoa NotificationCenter
    approach and parametrize it with the URI in question. The UI element can then
    compare the URI to the one it is responsible for figure out whether it needs to
    update itself.


    As we said earlier, URIs can be related to one another, for example if a list
    task:`container/2/id/3` is modified, a list view showing the list task:`container/2`
    can also update itself.


    We use the WLRESTOperation objects to decode the UI from model changes that can
    happen on any thread. When the model changes a particular object, it posts the
    URI of the queue that is set up to deliver “model change” Notifications to the
    default NotificationCenter on the UI.


    The coalescing behavior of these queues nearly resolve the problem of keeping
    update latencies as low as possible for single changes at the same time when those
    occur, but also not missing any updates.


    For the UI, we actually had one more feature: auto-coalescing. In normal operations,
    we want every element to be updated individually and immediately. As load increases,
    this makes less and less sense. When you are getting hundreds of new list tasks
    send to your device, making each one in place is not just useless, but it becomes
    daunting annoying and confusing.


    The auto-coalescing works by monitoring the depth of the queue. When the queue
    gets, the coalescing level is increased, bringing more and more elements from
    the back of the URIs entered into the queue. With coalescing to its default, a
    URI:`container/2/id/3` is entered into the queue as is, and coalescing will only
    affect that specific task.


    If auto-coalescing bumps the coalescing level to 1, one element is removed from
    the back of the URI, leaving only the center task:`container/2`. This has two
    effects: on one hand, the entire list will be refreshed in the UI, instead of
    just the specific task. On the other hand, coalescing will now merge all updates'
