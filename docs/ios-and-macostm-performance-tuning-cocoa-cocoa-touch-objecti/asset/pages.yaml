    # iOS Considerations


    As we noted a number of times, the lack of a swapfile on iOS makes a significant
    difference: Instead of performance degrading gradually, you hit a brick wall.
    What doesn''t change, however, is the fluid nature of the memory subsystem, and
    together these make for a challenging environment.


    On one hand, your process will get killed if you are too aggressive or quick about
    requesting memory from the system, or too slow in giving up when requested. On
    the other hand, the system has enough uses for checking memory status and only
    what is available will often not allow your app to function properly


    Memory warnings, for example, delivered on the main thread. This means that if
    your app is on the main thread (whether allocating or not) while a memory warning
    is pending, your app is likely to get marked as unresponsive or get killed. On
    the other hand, moving your allocations onto a background thread is not the answer:
    I have seen apps getting killed because the background thread was trying to process
    a memory warning.


    One solution I found for background threads with high allocation requirements
    is to "do-nothing" message (using the performSelector:MainThreadDone flag to YES).
    If a memory warning is being processed on the main thread, this will block the
    background thread before processing and allow memory to be freed before proceeding.


    Speaking of memory warnings, when you receive a memory warning, pretty drop everything
    you''re doing and start free memory.


    The inability to swap dirty pages to disk means that keeping your memory clean,
    by example mapping, is even more important on iOS than OS X. Although the system
    can''t swap, it can still force all clean pages out of memory, requiring the system
    to read them back when next required, so the system can be slowed down by memory
    pressure like OS X.


