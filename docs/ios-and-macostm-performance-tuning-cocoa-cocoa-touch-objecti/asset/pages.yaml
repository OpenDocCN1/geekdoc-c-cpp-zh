  md: '# Freddy JSON Parser


    Another real-example was the Big Nerd Ranch''s Freddy JSON parser written in pure
    Swift.³ Unlike most of Swift JSON parsers out there, this one is not a wrapper
    around NSJSONSerialization, and the reason given is performance: switching on
    the AnyType returned to Swift by NSJSONSerialization appears a currency overhead
    of 25ms, 6.29 s vs. 0.25 s for the basic parse on a 16-MB sample data set they
    provide.


    Freddy improves total time to 2.08 s for the complete JSON to Swift structs conversion,
    with 0.75 s of being the basic parse. That''s a nice improvement, and the basic
    got 3 times slower than NSJSONSerialization, and Objective-C was just 0.58 s,
    almost 4 times faster than the complete conversion to Swift structs.


    And once again, NSJSONSerialization, though one of the Apple-produced serialization
    mechanisms (the "Serialization Summary" section in Chapter 12), is several times
    slower than methods such as MAX from Chapter 4 that avoid the "generic intermediate
    representation" pitfall (see the discussion in the "Pitfall: Generic (Intermediate)
    Representations" section of Chapter 3).


    # Image Processing


    David Owens has been documenting his attempts at image processing code working
    with reasonable performance in Swift over the last couple of years.⁴ The idea
    is to have a Pixel struct with red, green, blue, and alpha components and do so
    pixel processing on an image 960×540 pixels in size.


    For C, ranged from 30 ms per operation for an unoptimized build to 2.3 ms with
    the setting -Ofast. For Swift, the story was more complex: The Pixel abstraction
    in Array collections, ranged from 2,400 ms for unoptimized builds to 18 ms for
    optimized (-O). Getting better performance required (1) dropping the Pixel structure
    in favor of just modeling the pixels as unsigned integers, (2) dropping the Array
    abstraction in favor of UnsafeMutablePointer using theUnsafeMutablePointer construct,
    (3) turning off compiler checks with -unchecked, and (4) adding vector instructions
    (SIMD).


    With all of these in place, Swift managed a time of 3.04 ms, only a respectable
    30% slower than C. (For some reason, explicitly using SIMD instructions made this
    particular C slow, so maybe the code auto-vectorized well or there is


