  md: "# I/O: Measurement and Tools\n\nMeasuring I/O is even harder than measuring\
    \ memory consumption. Most of the time, interesting events will be where nothing\
    \ is happening; the system is simply waiting for some external event as the hard\
    \ disk head moving to the right location. In addition, the whole operating system\
    \ is designed purposely to make I/O measurement nonrepeatable—er, I mean, to optimize\
    \ I/O, with lots of global shared state as caches and disk layout. Even, while\
    \ there are techniques for controlling these variables, they usually lead to nonrepresentative\
    \ measurements because the optimizations are absolutely necessary for normal operations.\n\
    \nTo illustrate, we will use the short program from Example 11.1 that just reads\
    \ a file into NSData and computes a checksum of the bytes in the file.\n\n11.1\
    \ datamapping program: reads a file and computes an xor-checksum\n\n```\n#import\
    \ <Foundation/Foundation.h>\n\nint main(int argc, char *argv[]) {\n    NSURL *url=[NSURL\
    \ fileURLWithPath:argv[1]]\\n    NSData *d=[NSData dataContentsOfURL:url options:0\
    \ error:nil];\n    char result=0;\n    const char *bytes=[d length];\n    const\
    \ char *end=bytes+[d length];\n    for (const char *cur=bytes; cur < end; cur++)\
    \ {\n        result ^= cur;\n    }\n    printf(\"result: %x\\n\",result);\n  \
    \  }\n```\n\nExample 11.1 does a computation on the file contents and prints those\
    \ results to make sure data is actually read and the printf ensures the compiler\
    \ can't just optimize the computation away as dead code."
