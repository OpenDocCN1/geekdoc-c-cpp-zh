  md: 'flate compression should work well quite. Despite this, there really isn''t
    a good reason for the alpha channel being PNG, and for us it was a serious limitation
    because it would mean that one fourth of the data would have to be downsampled
    from highest resolution after all.


    Instead, we decided to update the JPNG format so that it would also use a (grayscale)
    image for the alpha channel. In addition, we modified the library''s APIs to allow
    selection of image resolution/size, as well as the implementation using CImageSourceCreateThumbnailAtIndex(i)
    in order for the extraction of lower-resolution images to work.¹


    # A Beautiful Launch


    In the end, we pulled off the impossible task we set ourselves at the start. The
    app stayed within the 100-MB limit, supported all the new devices, and the designers
    were happy with all the new graphics and animations they could add. And the users?
    They love it, with app garnering 4.5+ star ratings on both the U.S. and German
    App Stores, and frequent reports of the app being the right pick-me-up in the
    morning.


    One final benefit of our JPEG subsetting mechanism is that on very old and slow
    devices, we can very quickly load a significantly reduced-resolution image (one
    fourth or even eight resolution) the user sees resembling the final scene while
    the high-resolution artwork is loading.


    There is still more we could do. We integrated software JPEG decoding, so all
    decoding can funnel through the hardware decoder. This is obvious from the CPU
    profiles, which show CPU utilization substantially below 100%. Even if the hardware
    is generally faster, adding two software decoders seems like it could at least
    double throughput, especially if we manage to sort the images so that larger images
    are preferentially decoded by hardware and smaller images decoded by software.
    We could also add a few images in PVRTC format that would work well with compression,
    and may decode a few of the animation sequences from MPEG movies. The idea is
    to utilize as many of the available hardware resources possible, as long as they
    don''t start stepping on each other.


    But that is for later.


