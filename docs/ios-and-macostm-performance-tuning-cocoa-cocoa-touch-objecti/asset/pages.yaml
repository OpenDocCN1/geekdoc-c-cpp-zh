    # # Compression


    Compression is an obvious space-saving measure, and many of the techniques for
    saving memory, as the bit-field discussed above, can be viewed as specialized
    forms of compression.


    These types of compression have the feature that they are directly usable in their
    compressed state. General-purpose compression algorithms tend not to have this
    characteristic, so the data needs to be decompressed before it can be used. Means
    that both the uncompressed and the compressed representation are in memory, with
    at least the uncompressed version being dirty. An uncompressed representation
    can therefore paradoxically be both faster and more efficient than one that is
    compressed.


    # # Purgeable Memory


    One way of alleviating the memory pressure of dirty decompressed versions of data,
    or any other data that can be computed from a more compact representation, purgeable
    memory. Marking memory pressure indicates to the operating system that when there
    is memory pressure, it can discard this memory just like clean memory despite
    the fact that it is known to be dirty, instead of having to swap it to.


    Apple provides both a low-level interface using flags to the `map() ` system call,
    as well as the higher-level and more convenient NSPurgeableDataData class, which
    wraps an NSMutableData compatible interface around purgeable data and also implements
    the NSDiscardableContent protocol.


    The beginContentAccess and endContentAccess methods of the protocol must be used
    to lock and unlock the contents, respectively; data can only be accessed while
    locked and only purged when unlocked. The discardContentMessage will purge the
    data unless it is currently locked, and can also be done by the system if there
    is memory pressure. Once the data has been purged, beginContentAccess returns
    “NO” and access methods like bytes or mutableBytes will fail without a successful
    lock using beginContentAccess. It is important not to keep pointers to the data
    around, accessing data via these pointers will cause the process to be killed
    if the data has been purged.


