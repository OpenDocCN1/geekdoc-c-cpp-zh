  md: "# Testing\n\nOnce you have automated performance measurement in place, you\
    \ can also use it in unit tests in order to make performance requirements testable\
    \ and to make deviation from those requirements detectable automatically.\n\n\
    Unit tests are also crucial in ensuring that your code keeps working as you optimize.\
    \ Having the safety of unit tests gives you the freedom to experiment with faster\
    \ implementations.\n\nFast unit tests are also important because they allow unit\
    \ tests to run continuously with every build. (My full unit test suite of currently\
    \ lightly over 1,000 tests runs in 1 to 2 secs, which is a bit on the slow side\
    \ but still acceptable.)\n\nXcode now includes performance tests as part of the\
    \ XCTest framework. So far, I have not found these performance tests very useful.\
    \ First, they use Xcode interface magic that is not transparent to store the results.\
    \ I prefer my tests to be self-contained and fully specified in code and not rely\
    \ on outside context, especially machine—or user-specific context. Second, these\
    \ performance tests can only be used to guard against performance regressions,\
    \ not drive performance improvements in a test-first style.\n\nOf course, there\
    \ is a reason for asking existing performance levels in a performance test, and\
    \ then storing on a post-host basis: Absolute performance levels are a machine\
    \ dependent, and a test that succeeds on a high-spec Mac Pro might fail on a MacBook\
    \ Air. The answer to this conundrum is on relative performance tests as shown\
    \ in Example 2.2. Instead of codifying a specific time in which the test must\
    \ be completed, we specify a ratio between a slow method and the faster method.\n\
    \n# 2.2 Unit testPerformanceOfNewFastShouldBeTwiceOfOldSlow\n\n```\n- (void)testPerformanceOfNewFastShouldBeTwiceOfOldSlow{\n\
    \  long slowtime=-usemicros();\n  .. old slow implementation\n  slowtime+=usemicros();\n\
    \  long realtime=-usemicros();\n  .. new fast implementation\n  realtime+=usemicros();\n\
    double improvement = (double)slowtime /(double)realtime;\nXCTAssertGreaterThan(improvement,\
    \ 2.0, @\"should be faster\")\n}\n```\n\nThis way, we can also codify performance\
    \ improvements that we would like to see into our tests and then use those failing\
    \ test cases to drive the performance tests until the test succeeds, just like\
    \ we do features in test-driven development."
