    # A Sufficiently Smart Compiler


    In essence, the Swift compiler is claiming to be building the sufficiently smart
    compiler (SSC), a compiler that can see perfectly through arbitrary layers of
    abstraction in order to find optimal implementations for those abstractions. The
    Swift marketing team, of course, is claiming that they have already succeeded.


    The problem with the SSC is that it is a legend, a myth that has been floating
    around in computer science circles for decades, although the name was coined around
    2003 or 2004 by C2 wi. No such compilers exist, and people have been trying (and
    claiming success!) for a long time.


    Optimizers can be pretty smart, they aren''t as smart as the SSC we would like
    to be, and in optimization technology is also on the slow side. Whereas Moore''s
    Law has given us a doubling of hardware performance every 18 months, Proebsting''s
    Law gives us a doubling of performance every 18 years. More recent research has
    shown that, if anything, Proebsting rose on the side of optimization; actual progress
    has been somewhat slower.


