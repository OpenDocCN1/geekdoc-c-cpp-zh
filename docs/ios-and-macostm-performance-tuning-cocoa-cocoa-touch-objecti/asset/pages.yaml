  md: '# Table 3.1 Primitive operations in 32- and 64-bit architectures


    | Operation add multiply divide -intVal NS(int) CF(float) NS(float) |

    | 64-bit (ns) | 0.67 | 0.79 | 14 | 15 | 44 | 169 | 190 |

    | 32-bit (ns) | 0.72 | 0.76 | 7.8 | 22 | 232 | 182 | 211 |


    Division is slower than the other arithmetic operations because divisors in CPUs
    usually handle only a few at a time, rather than a full word, which explains why
    64-bit division is significantly slower than 32-division.


    Compared to others that can be stored in registers and manipulated in a single
    cycle (or on less complex designs), any object representation has excessive overhead,
    and Objective-C''s fairly heavyweight objects are double so. Foundation and CoreFoundation
    make this overhead even worse by providing only immutable objects, meaning any
    manipulation must create new objects. Scalars, like numbers and characters to
    be at the leaves of every object graph and are therefore the most numerous entities
    in a program, with every object containing at one but many instances of them.


    On the flip side, there is little variation or private data that would benefit
    from the encapsulation and polymorphism that are made by an object representation,
    and number objects are in many ways less capable than primitive types, by not
    providing any arithmetic capabilities. This could change the future if Foundation
    or any other framework provided a number and magnitudes hierarchy similar to that
    of Smalltalk or LISP, where small integers automatically morph into infinite integers,
    floating point, or even complex numbers as needed. Foundation provides none of
    these capabilities, the introduction of tagged integers in the 64-bit runtime
    on OS X 10.7 with the addition of number literals in 10.8 could be a sign of improvements
    in the future.


    Of course, there are when an object is required by some other interface, for example,
    when adding content to an NSArray or NSDictionary. In this case, you must use
    NSNumber or an equivalent provide alternatives to these—an option we will explore
    more in the chapter.


    One wrinkle of Table 3.1 is that although most times are similar between 32 and
    64 bits, two numbers are different. The division result is as slow as 64 bits,
    whereas the creation of NSNumber objects is six times faster. The division result
    is easily explained by the fact that the integer division hardware on the particular
    CPU processed a fixed number of bits per cycle, and 64–bit operands simply have
    twice as many bits as multiply. The multiply and add circuits, on the other hand,
    operate on full 64-bit words at once.'
