  md: '# Data Points to JPEG


    In the end, there were a lot of options on the table, and it wasn''t clear at
    all the right choice might be. We needed data, so I started running experiments,
    starting with the common JPEG and PNG image formats.


    Surprisingly, the JPEG format files came ahead in size, with the 49 MB of assets
    compressing down to 87 MB at very conservative 0.7 quality setting with no loss
    in quality. A bit more surprising was that despite Apple''s recommendation of
    Xcode--"optimized" PNGs as the default format, JPEG compressed files decoded much
    more quickly, after on the Mac which I was running the tests.


    We looked at JPEG decoding, the more news flooded--using TurboJPEG library improved
    speeds by another 20% to 200%. While, the CGImageSourceCreateThumbnailIndex()
    turned out to be completely useless for our needs in the "How Definitely Not to
    Draw Thumbnails" section of Chapter 16 actually did the fast extract of lower-resolution
    images we were hoping to get out of JPEG 2000!


    # A Measuring Hiccup


    Of course, I made the cardinal mistake of not actually running these tests on
    the device, and when we actually did the tests on devices there was a huge down:
    the performance was much worse, relative to PNG, which now turned to be faster
    after! The relative performance difference didn''t make sense to me because the
    CPUs are sufficiently alike that if one is slower, relative performance differences
    between the two codecs would not be as large as we were measuring. The plot thickened
    when I compiled a version the Independent JPEG Group''s libjpeg software, the
    official reference implementation for JPEG, and got better results than the Apple
    libraries.


    The answer lies in the fact that Apple has JPEG hardware on the iPhone system
    on a chip (SOC). This decoder hardware can actually be slower than software, but
    uses less power, PNG prefers it when it is slower. There is also some constant
    overhead in talking to the hardware, which sits behind a Mac IPC.


    Fortunately, it turned out that these overlays are fixed and I was measuring fairly
    small images. Figures 17.3 through 17.5 show more representative set of measurements
    with images of different sizes and at different subsampling settings.


    For larger images, the fixed overhead are amortized over more data being decoded,
    and Apple JPEG easily beats the alternatives, with TurboJPEG coming in a good
    second and PNG just unacceptable slow. Furthermore, PNG gets substantially slower
    when subsampling, whereas the JPEG decoders are really able to get generous speedups
    by doing only partial decoding.


    In the end, while the relative degradation of small images is significant, the
    absolute slowdown is not that much because the images are small.'
