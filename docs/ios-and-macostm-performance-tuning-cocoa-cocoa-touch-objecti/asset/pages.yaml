- img_proc: true
  md: '# Chapter 14 Graphics and UI: Principles


    hierarchy in AppKit or UIKit, there is no need to involve client code to repaint
    revealed sections, and therefore window manipulation is always smooth, even if
    a process is unresponsive.


    Quartz Extreme, introduced with Mac OS X 10.2, took advantage of this architecture
    to adapt at least some level of hardware-accelerated graphics to the system. Every
    window in the system was turned into an OpenGL rectangle and the window''s contents
    (provided by Quartz or other graphics API) into an OpenGL texture that is mapped
    onto that rectangle. Each window''s contents are drawn with whatever API is deemed
    appropriate, and the bitmap window contents are composed together using OpenGL
    and the graphics hardware.


    This change not takes advantage of the hardware support in the graphics card for
    better performance, many operations it removes the load from the CPU almost completely:
    in order to move a window, the Window Server just to change the coordinates of
    the rectangle, and in order to bring a window to front or back it just adjusts
    the rectangle''s z-value.


    Core Animation builds this architecture from the WindowServer to the client processes.
    Instead of drawing into a backing store, each CALayer maintains its raster image,
    and these images are then composed by a separate process (the render server on
    iOS) with hardware support. In essence, each CALayer acts like a window under
    Quartz Extreme, and so changes to the layer''s location, transparency or rotation,
    and so on, can be handled by adjusting the geometry of the OpenGL primitive it
    is mapped to, off-loading the actual bitmap compositing to the graphics hardware.


    Figure 14 shows the development from the first, non-hardware-accelerated window
    server via Quartz Extreme to Core Animation. As you can see, the increase in hardware
    acceleration corresponds with an increase in raster buffering in this graphics
    architecture. In the extreme case of graphical assets, there is no software rendering
    at all apart from decoding these assets; the entire rest of the pipeline is hardware
    accelerated. The cost is memory, the resolution-dependent nature of those assets,
    and the decoding time of image assets, which can also be significant.


    Just like the WindowServer process window manipulation smoothness, this architecture
    makes animations smooth regardless of the client. Once all the layers have been
    set up, the animations run independently of the calling program, in a separate
    process with hardware support.


    This is a highly non-obvious approach to performance optimization because its
    basis is the most expensive primitive, the raster image. Raster images take significant
    amounts of memory and prodigious amounts of memory bandwidth as those images are
    composed into the final result. All other things being equal, the Core Animation
    architecture would make things much slower, but all things are not equal because
    these operations can easily benefit from the graphics hardware.


    In addition, we gain gains in simplicity and corresponding predictability, making
    it possible to hand off the operations to a separate process, which just sends
    small instruction streams to the graphics hardware.'
