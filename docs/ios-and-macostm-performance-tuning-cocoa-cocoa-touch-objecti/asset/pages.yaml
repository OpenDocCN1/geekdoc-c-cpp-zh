  md: '# Chapter 3 CPU: Pitfalls and Techniques


    Taking into account Amdahl''s Law, your task should probably take at least around
    1 ms before you parallelizing, and you should probably consider other optimization
    first.


    Example 3.22 Creating new threads using threads, Cocoa NThread, and convenience
    messages


    ```

    pthread_create(&thread, attrs, my_computation, arg;);

    [NThread detachThreadSelector:selector(myComputation:)

    toTarget:self]

    [self performSelectorInBackground:selector(myComputation:)

    withObject:arg];

    ```


    So, similar to the balancing of OOP vs. C, getting good thread performance finding
    independent tasks that are sufficiently coarse-grained to be worth off-loading
    into a thread, but at the same time sufficiently fine-grained or uniformly sized
    that there are sufficient tasks to keep cores busy.


    In addition to the overhead of thread creation, there is also the overhead of
    synchronization across shared mutable state, or ensuring that state is not shared—at
    least, if you get right. If you get wrong, you will have crashes, inconsistent
    and corrupted data, deadlocks. One of the cheapest ways to ensure thread-safe
    is actually thread-local variables, accessing to such a variable via pthread_getspecific()
    is slightly cheaper than a message sent. This is obviously only an option if you
    want to have multiple separate values, instead of sharing a single value between
    threads.


    In case data needs to be shared, that data needs to be protected with pthread_mutex_lock()
    (43 ns) or more conveniently and with Objective-C @synchronized section, which
    also protects against dangling locks and thus deadlocks by handling exceptions
    inside the @synchronized section. Atomic functions can be used relatively cheaply
    (at 8 ns, 10 times slower than a simple addition in the uncontended case) increment
    simple variables or build more complex lock-free or wait-free structures.


    # Work Queues


    Just like the problem of thread creation is, to the problem of object-allocation
    overhead, so queue threads are to object caches as a solution to the problem:
    they reuse the thread to work on multiple work items, which are inserted into
    and fetched from work queues.


    Whereas Cocoa''s NSOperations take slightly longer to create and execute a pthread
    (8 µs, 7 µs), dispatching a work item using GCD introduced in Snow Leopard is
    really 10 times faster than a pthread, at 700 ns per item for a simple static
    block, and around 1.8 µs for a slightly more complex block with arguments like
    the one in Example 3.23.'
