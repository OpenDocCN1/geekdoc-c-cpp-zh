    # Fun with Property Lists


    Just in case you thought I was kidding when I wrote that the message is not "just
    use C," we’re now going to look at making things fast by recasting C to Objective-C.


    Although StringTable from the previous sections solves the problem the original
    poster was having, it is a bit of one-trick pony, only handling the case of a
    list of strings. I was reminded of the need for a more general solution in one
    of my performance courses. He had several iPhone apps that were basically viewers
    for static, pre-loaded information. At any one time, at most a dozen items would
    be visible, but loading the entire data set took just too long on start-up and
    the data was a little more than a list of strings.


    For the static data to be loaded, the student had chosen a property list, which
    was quite sufficient for encoding his data structure. In theory, the property
    list should also be fast enough for completely interactive performance. The previous
    chapter decoding speeds of 300K objects per second on OS X, even assuming a performance
    penalty of 10 times for iPhone hardware, we would still be able to do the 30 objects
    at any one time in 1 ms, 16 times faster than required for 60 Hz animation (and
    that’s still a very conservative measure as we wouldn’t need to swap out objects
    on every frame).


    The obvious problem is that despite needing a maximum of 30 objects at a time,
    we have to read the entire list before we can display even a single item. If you
    have a large data set, this can quickly become prohibitive. Although CoreData
    might be an option in this case, which would be rejected by the original poster
    and might be too complex for the applications at hand, I would agree with it.


    The obvious solution to the obvious problem is a lazy-loading property list, so
    only the elements that accessed are decoded. A good place would be the decoding
    of arrays; instead of decoding the array immediately, return an object that decodes
    its elements on-demand. With an actual object-oriented implementation of a property
    list we could probably override the implementation of -decodeArray or some equivalent
    method, but Apple’s Foundation implements property list retaining in Core C API,
    so there are no extension points. You get whatever CFPropertyListCreateWithData()
    gives you, and you will like it.


