    \ a C macro\n\n```\n#define REDUCE_METHOD name, operator ) \\\\\n- (float)name\\\
    n{\\n    float *my_reals=[self reals],result=my_reals[0];\\n    for ( long i=1,max=[self\
    \ count]; i<max;i++) {\\n        result=operator my_reals[i];\\n    }\\n    return\
