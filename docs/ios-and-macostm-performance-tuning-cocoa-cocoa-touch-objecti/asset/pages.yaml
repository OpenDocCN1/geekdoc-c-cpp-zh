    not the optimization aspects.


    # Summary


    Early editions of Aaron Hillegass''s seminal book Cocoa Programming for Mac OS
    X included a chapter on the Cocoa-Java bridge. It consisted of a single sentence
    that basically read, "Don''t use it." As you can probably tell, that is the chapter
    I would have wanted to write on Swift performance. Due to the success of Apple''s
    marketing campaign regarding Swift''s performance, that sentence would not have
    elicited the same chuckle as Aaron''s chapter-sentence did, but I hope to have
    shown why I think it is equally justified.


    Swift is not extremely slow to compile but also slow to execute and, worst of
    all for modern performance, quite unpredictable and hard to control. Don''t use
    it for performance-intensive code. In fact, it can be incredibly slow that even
    using it for code that appears noncritical can suddenly have a noticeable performance
    impact.


    Instead, code your performance-sensitive code in Objective-C using the techniques
    discussed here, and use code from Swift. It''s what Apple does, and it''s what
    IBM does.


    If you have no choice, there is not all much advice I can give; you are mostly
