  md: '![](img/29111a88ed1326b01d04057a653fdbec_134_0.png)


    Figure 5.10 Creating a retain cycle


    However, since they point to each other, their reference counts remain at 1, and
    therefore reference counting doesn''t detect that they should be freed.


    The fact that reference counting is implemented using normal message sends allows
    optimizations such as the object cache described earlier, where we check for a
    reference count of 1 to indicate whether to evict an object from the cache. It
    even allows the programmer to elicit edge-reference-counting operations altogether
    in performance-critical sections if it can be proved that the operations are balanced
    and there is an external reference keeping the object alive for the duration.
    The fact that reference counting is precise allows piggybacked on the existing
    mechanism, although care must be taken to make sure object lifetimes are not unnecessarily
    extended.


    # Tracing GC


    As reference counting by itself doesn''t deal with cyclical references, those
    early collectors mentioned were frequently augmented with a tracing mark-and-sweep
    collector, which only runs from time to time. In the mark phase, it traces all
    the object references from one or more well-known root objects, and in the sweep
    phase it deallocates all the objects that were not found to be in the mark-phase,
    the garbage.


    While mark and sweep can also be used by itself, the full heap is quite expensive
    and also difficult to do concurrently with the program, leading to the phenomenon
    of garbage collection pauses, where the running program is halted while'
  merge: -1
