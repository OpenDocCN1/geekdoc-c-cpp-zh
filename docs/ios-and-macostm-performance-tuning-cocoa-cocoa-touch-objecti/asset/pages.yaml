    # Language Characteristics


    Although Apple hasnt given us any solid evidence of Swift''s performance, it has
    given

    asons for amazing Swift performance.


    +   - Swift''s design is much more static than Objective-C''s, meaning there is
    much

    more information available at compile time for the compiler to use

    optimization.

    - Specifically, dynamic dispatch is drastically reduced, with most “native” Swift

    methods being dispatched statically.


    Objective-C''s dynamic dispatch is an absolute barrier to compiler awareness,

    which was always a thorn in the side of the compiler and runtime team.

    Just-in-time (JIT) compilers can resolve this at runtime, but there are many

