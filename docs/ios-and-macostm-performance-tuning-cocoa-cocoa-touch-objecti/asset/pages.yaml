    # JPG AND JPGIP


    There was one final hurdle: many of our assets were composed together to form
    the final scenes, and so used a lot of transparency, but JPEG doesn''t support
    transparency. Again, we were fortunate that someone else had been before and solved
    that particular problem: Nick Lockwood came up with the JPEG file format, which
    combines a JPEG and a PNG into a single file, with the JPEG providing the color
    information and the PNG alpha mask.


    At first, using a PNG for the alpha channel seems a little oxymoron. Yes, PNG
    supports alpha, but we are not encoding an image in alpha, and we are encoding
    just a simple grayscale image that acts like an alpha channel for a different
    image. On the other hand, alpha channels are usually much blocky than images,
    and so even'
