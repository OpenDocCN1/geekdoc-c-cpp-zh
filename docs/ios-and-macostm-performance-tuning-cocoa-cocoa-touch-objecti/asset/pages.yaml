    APIs in the previous chapter, we''ll now look at some practical examples of making
    I/O faster. Significantly faster.


    We start out with a simple word list for a game and work our way through Apple''s
    binary list format, which we speed up significantly for many practical purposes.
    Finally, we throw in some fast comma-separated value (CSV) parsing and design
    a compact file format for public transport data that beats CoreData by orders
    of magnitude.


