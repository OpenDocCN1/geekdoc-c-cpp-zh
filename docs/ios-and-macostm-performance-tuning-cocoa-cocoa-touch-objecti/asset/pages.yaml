  md: '# Memory: Principles


    Memory use is one of the trickiest and least understood areas of performance tuning,
    but it is arguably also one of the most important. At first glance, it doesn''t
    seem to be an area for performance at all: either the program fits into memory,
    or it does not. In fact, that was pretty exactly how it worked on computers CPUs
    were directly connected to memory, before they acquired multilevel memory hierarchies
    from virtual memory to various caches.


    These days, memory is a much more fluid concept. On one hand, virtual memory presents
    isolated address spaces that are multiplexed onto real memory. On the other hand,
    the CPU can operate at full speed only when accessing a tiny amount of memory
    that is built into the CPU itself, with data constantly and much transparently
    flowing between disk, memory, and the various CPU caches.


    # The Memory Hierarchy


    System architectures like current Mac hardware or the various iOS devices have
    several kinds of memory of different sizes and (vastly) different performance
    characteristics. Figure 5.1 is a simplified block diagram of this system, Intel
    Core i7-2677M your MacBook Air. It shows the CPU with two cores and main memory.
    Graphics memory will be examined more closely in Chapter 14.

    Each core has Level 1 caches, with instructions and data, for each, with 32-KB
    capacity. In addition, each core has a unified Level 2 cache with 256-KB capacity
    and a single Level 3 cache on the CPU with 4 MB of memory that is shared by both
    cores. The latencies for the caches are 3 cycles for the L1, 8 cycles and 21 cycles
    for the L3 cache.

