  md: 'The time limit is useful for creating consistent, repeatable, and thus comparable
    profiles, for example profiling an application for 2 s from launch and comparing
    what happens in those 2 s with different optimizations. It can also be convenient
    to simply have to hit the stop button.


    The window limit has two main use-cases that I am aware of: first, it allows you
    to capture a profile of a specific activity that requires long setup in an application
    without capturing the long setup in the profile. A related but possibly more significant
    case is if the window is indeterminate: let''s say you have an event you want
    to profile, but that you can''t reproduce deterministically. With window set to
    10 s you can just Instruments run continuously, and when you see the behavior
    you are targeting, hit the stop button. Your trace will contain the 10 s before
    you stop, hopefully including the event you are interested in.


    Although there will be some impact having Instruments running, the fact that we
    have multiple CPUs means your target app can often run mostly unimpeded by the
    profiling. Use of the window limit means memory doesn''t fill up, which will otherwise
    happen very quickly.


    Setting a window limit will automatically activate the Defer flag, which means
    you can''t interact with Instruments after profiling is done, or to minimize interference
    with the program being profiled. You can also set this without the window option.


    I prefer always having at least a time limit set, or to prevent runaway sessions.


    Finally, you can configure the Instrument(s) being used. In the case of Time Profiler
    instrument, the choices roughly correspond to the real, user, and systems reported
    by the command-line time command; by default, Time Profiler reports user time,
    meaning time spent running on the CPU of the user program. Selecting Recording
    Writing Threads corresponds to the real component, meaning well-clock time, so
    tracking waiting for I/O is also included. This can be useful at times, but will
    usually require some sophisticated data mining for interactive programs or order
    to remove the time spent waiting for the user. Finally, you can look at time and
    call stacks in the kernel, corresponding to the sys component. I''ve used this
    once or twice in my career. Other instruments will offer different configuration
    options.


    # Basic Analysis


    Unlike earlier tools, Instruments allows you to start analyzing while the profile
    is still being gathered. This can be convenient, but beware that such interactions
    can negatively affect the program if it''s running on the same machine, and there
    can also be a negative impact on the quality of the data you are gathering. Figure
    2.5 shows a CPU trace during profiling: The record button has been replaced by
    a stop button, the timeline is starting to fill (with a fairly uninterangular
    graph because the sumintsm program is purely CPU bound), and therefore the details
    pane is starting to show functions.'
