  md: '# Relational and Other Databases


    These somewhat timid results for SQLite and CoreData run contrary to the common
    perception of relational databases as the pinnacle of I/O optimization and performance,
    but this perception was never well founded historically, theoretically, or practically.


    In my personal experience, relational databases have typically around an order
    of magnitude slower than even simplistic nonrelational storage and query strategies.
    For example, when I was conducting my investigation into Mail.app performance,
    I was stunned to find out that querying the metadata of a mailbox approximately
    20K messages took SQLite well over a second, whereas doing a simple brute-force
    linear search of an index format (essentially a concatenation of all messages
    in a single file) using the grep command-line utility took a few milliseconds.
    The so naive brute-force algorithm was orders of magnitude faster than a sophisticated
    SQL database!


    Jamie Zawinski tells a similar story about the Netscape mailbox files: Netscape
    versions 2.0 and 3 used a custom binary format that had 2% space overhead and
    were able to open a mailbox with 15K messages in under a second on a Pentium machine
    (roughly the same amount of data and performance as Mail.app on a 2.5-GHz PowerMac
    G). A rewrite dropped in "proper" database, increasing space overhead by more
    than an order of magnitude to 30% and dropping performance by an order of magnitude.


    One reason, of course, that relational databases are general-purpose tools that
    were never designed with performance as their primary goal. Instead, they were
    meant to allow multiple clients access to normalized enterprise data sets and
    permit ad-hoc queries. It took many years of engineering work in the 1970s to
    1980s for relational database management systems to catch up with performance
    the hardware limitations of the times, such as on-disk B-Trees, multi-threading
    to hide disk latency, and explicit buffer management dont improve performance
    by an order of magnitude or more.


    In fact, Turing Award winner and general database Michael Stonebreaker (Ingres,
    Postgres) has published a series of papers, first declaring the end of the "size
    fits all" use of relational databases for specialized applications, and later
    the "end of an era," casting doubt even on the use of traditional databases in
    their core application of online transaction processing (OLTP).


