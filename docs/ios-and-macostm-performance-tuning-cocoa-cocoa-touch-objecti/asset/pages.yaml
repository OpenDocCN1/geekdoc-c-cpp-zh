  md: '# Event Posting


    One interesting alternative to (relational) databases is an architectural pattern
    known as Event Poster,¹⁵ instead of modifying a persistent store, you store deltas
    that are added to an in-memory representation of data. Coming back to our example
    of saving Moby Dick on every keystroke, imagine just writing the list of keystrokes
    of (a) storing the entire file or (b) trying to modify the file in-place as it
    is edited.


    It should be obvious that this approach can work very efficiently for saving data:
    Instead of writing O(n) items on every save as we would as we write O(1). Updating
    an on-disk data structure as a B-Tree would make O(log n) for each update, that
    likely increases the relative cost because the operations would tend to be expensive
    seeks and possibly moves, whereas events can be efficiently appended to a file
    sequentially. For n operations, that makes the complexity O(n²) for the full save,
    O(log n) for update-in-place, and O(n) for event posting.


    In the pure form of the pattern, the event log is the only storage, the in-memory
    state is reconstructed by replaying the event log. This can be a surprisingly
    and effective strategy, as I discovered when implementing the replacement¹⁶ for
    the problematic BBC feeds processing application mentioned before. Once we rebuilt
    the feed index, we noticed that all we needed for persistence was to remove the
    code that deleted incoming feeds (which we already wanted to do for auditing purposes).
    Having a well-optimized ingest processor could simplify the rest of the system:
    Performance begets simplicity performs, a virtuous cycle that has numerous times.


    # Hybrid Forms


    Issues with the pure Event Poster pattern are that it requires all data to fit
    in memory and the event log can get very large, potentially growing without bounds,
    irrespective of the size of the currently active data (think of rewriting every
    sentence in Moby Dick then the log will be larger than the size of the book hardly
    changed). For this reason, the Event Poster is usually not applied in its pure
    form, but instead combined with other forms of storage.


    One hybrid is a checkpoint of the current state: write the state of the system
    at specific checkpoints, for example, using a fast memory dump. On reads, attempt
    to read the checkpoint file, replaying the log if the checkpoint file does not
    read correctly. This was the strategy we used with the feeds processing system,
    in occasionally pruning entries that were no longer relevant, for example, because
    they were overwritten by later entries (this needs to be done carefully if you
    want to keep the log for audit purposes).'
