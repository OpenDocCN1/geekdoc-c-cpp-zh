  md: '# Garbage Collection


    Fortunately, the problem of determining the lifetime of a reference in nontrivial
    environments has a long history, with many solutions dating back to at least the
    early LISP implementations of the 1950s.


    There are principally two techniques for garbage collection: tracing the heap
    to using reference counting to find dead objects. As shown in the 2004 OOPLA paper
    A Unified Theory of Garbage Collection by Bacon, Cheng, and Rajan, these approaches
    (tracing garbage collection and reference-counting collection) are duals of each
    other, and optimized versions of each type of collector take on characteristics
    from the other type.


    Early garbage collectors use reference counting, each time a new reference to
    an object is created, a count inside the object is increased, and each time a
    reference is discarded the count is decreased, all automatically by the runtime
    system. When the reference count reaches zero, the object can be reclaimed because
    there are no more references to it.


    # Foundation Object Ownership


    When OPENSTEP introduced the new Foundation classes still familiar today (NSArray,
    NSString, NSDictionary, NSNumber, etc.), it also introduced a garbage collection
    scheme based on reference counting to replace the fully manual resource management
    scheme of NextStep versions.


    Although not integrated into the language reference-counting collectors, this
    mechanism is capable of coexisting with a low-level language like C. Since the
    reference counting system does not have special access to object internals, it
    is relatively slow as systems go. This is compensated by the fact that it does
    not track references in local variables, with the ownership rules only applying
    to references held in instance variables. This drastically reduces the number
    of reference-counting operations.


    Foundation''s ownership-based reference-counting scheme is often referred to as
    "manual reference counting" (MRC). This is incorrect; reference counting can be,
    and is automatically generated, by the use of access, by property definitions.
    In fact, property definitions in MRC, ARC, and even the tracing collector are
    essentially indistinguishable.


    Figure5.10 illustrates how reference counts work. The root has a reference to
    object a, which therefore has a reference count of 1. Object has a reference to
    object b, which also has a reference count of 1. If we add a back pointer to object
    b to object, a''s reference count increases to 2, with all other reference counts
    remaining the same.


    If the reference from root to object a goes away, object a''s reference count
    drops back to 1. This example also illustrates a reference cycle: objects a and
    b are no longer referenced from the rest of the program; they should therefore
    be freed.'
