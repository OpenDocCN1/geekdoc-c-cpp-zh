- img_proc: true
  md: 'Another hybrid form is utilized by the LevelDB key-value store, an open-source
    rewrite of Google''s BigTable data store. Its basic store comprises Sorted String
    Tables, which are read-only lists of strings with an index. Writability is provided
    using a Log Structured Merge Tree; all changes are appended to a log, which is
    kept in memory and on disk. Reads are satisfied from the first recent changes
    stored in memory and then from the sorted read-only tables on disk, for example,
    by having those tables mapped into memory. This means that writes are always fast
    and reads always, with the cost of having to occasionally rewrite the sorted tables
    from the log, operations that can be performed using large batches, and sequential
    reads and writes.


    LevelDB still provides a classic Read Update Delete (CRUD) interface to the data,
    but oftentimes the applications themselves exhibit the characteristics of an Event
    Poster, RSS feeds, chat or social networking applications, and even e-mail. Such
    systems can easily take advantage of the (time-based) structure of their data:
    e-mail messages received the last day are usually more frequently accessed than
    those last week, which are in turn more frequently accessed than those of the
    last month, and so. On the other hand, many people, myself included, never actually
    delete mail. A relational database like SQLite treats all elements in a table
    equally, over time performance deteriorates for all messages, even though the
    actual set remains the.


    If I were to write a storage back for e-mail, I would structure it in a way similar
    to LevelDB: keep the most recent changes in memory and in a local store that is
    quick to access and quick to modify. Every once in a while, I would write older
    messages to read-only chunks (maybe per-month) with extensive summary, indexing,
    threading, and other metadata information so that operations would only ever have
    to look at the summaries. This way accessing the working would remain the same
    speed regardless of the size of the mailbox, with older storage only accessed
    for searches and then in large batches at optimal access speeds. However, I would
    not actually use LevelDB, because its limitation to only strings and no indexes
    would be too restrictive.


    # # Segregated Stores


    The store I just described is really an example of a segregated store. The idea
    of a segregated store is to keep pieces of data with different sizes, access requirements,
    and life cycles from each other—for example, old messages from new messages.


    One of this idea standing in for other media-rich applications is Apple’s Keynote
    presentation program. In this ''13 file format, all object layout was contained
    in a single XML file called index.apxl, either in a directory wrapper or in a
    zip file. Media data such as images or movies are keep from this index file, so
    presentations with up to 100 pages and a total size of over 1 Gigabyte by index.apxl
    file size of less than 2 MB.


    In addition, the contents of the index.apxl file change effectively with every
    edit, whereas the media files are immutable once they are imported; they only
    change if a new version of the media file is imported.'
