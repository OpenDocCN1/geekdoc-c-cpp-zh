  md: '# From Quartz Extreme to Core Animation


    CPU is effectively idle, waiting for those commands to finish. Both cases also
    feature low-powered CPUs by modern standards.


    In addition to benefiting special-purpose hardware, GPUs can also take advantage
    of the massive parallelism in graphics workloads and the huge numbers of transistors
    available on current technology dies to exploit that parallelism. CPUs have similar
    transistor budgets, but simply do not have nearly the parallelism available in
    their workloads.


    So whereas CPUs designers have to resort to more elaborate schemes in order to
    squeeze every performance out of their largely serial instruction streams, additional
    hardware resources thrown at GPU workloads translate almost linearly to increases
    in performance. This is the main reason that GPU performance is not just much
    larger than CPU performance (for applicable workloads), but the performance improvement
    curve is much steeper, meaning the gap that widens with every year.


    # From Quartz Extreme to Core Animation


    Exploiting the performance potential of modern GPUs for system-wide graphics rendering
    rather than for OpenGL-based games has been a driving force in the evolution of
    Mac OS and iOS graphics APIs, starting with pure Quartz-based rendering and slowly
    adding accelerated components as Quartz Extreme, Quartz GL, and most recently
    Core Animation.


    The most obvious of leveraging GPUs for Quartz drawing is to map the Quartz primitives
    to GPU commands. The problem with this approach is that the graphics hardware
    implements OpenGL-compatible primitives, and OpenGL primitives do not match the
    Quartz primitives. OpenGL does not have filled paths; it has strokes or quadrilateral
    polygon, meshes. While mapping these primitives is, for example, tessellation
    for filled paths to polygons, translation is expensive. In addition, OpenGL has
    a loosely defined rendering model, meaning that hardware has significant leeway
    in interpreting commands in a way that is efficient. This looseness is in conflict
    with Quartz''s strictly defined imaging model and Apple''s requirements in terms
    of graphics fidelity.


    However, there is one primitive that translates rarely: raster images. And there
    is a (hidden) subsystem the Window Manager, multiplexes the single physical screen
    between windows owned by a different process so that every process can draw into
    its windows without worrying about what other processes are doing.


    Via the Window Manager, every graphics API on Mac OS X, whether immediate or retained,
    in fact becomes a retained API with the window bitmaps the retained state, with
    all the advantages of a retained-mode API: Windows can be moved around and the
    consequences of content becoming visible entirely within the Window Manager. Unlike
    many earlier windowing systems, and unlike the view'
  merge: -1
