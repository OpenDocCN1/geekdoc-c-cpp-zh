    # Observations


    Finally, the benchmark game shows Swift programs benchmarking consistently 5 to

    30 times slower than equivalent Programs. Just to be certain that these results
    were

    outliers, I cross-checked by comparing Swift with Java. Here, Swift was typically

    5 times slower than Java, with the range being 20% to 8% slower.


    Although any one of these results is easy to dismiss as an outlier, the pattern
    is

    really consistent for that: 3 to 10 times slower with “reasonable” code. Heroic

    manual optimizations and a bit of luck are required to take that to somewhere

    between 3 times slower and almost parity, depending on the type of code in question.

    With Swift evolving as quickly as it does, all of these specific timings will
    probably be

    obsolete the time this book is in print, but again the overall pattern seems hard
    to

    break.


    Conversely, when I see claims of Swift beating C/Objective-C in performance,

