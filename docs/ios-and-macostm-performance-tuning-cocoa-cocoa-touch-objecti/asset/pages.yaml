  md: '# Command-Line Tools 21


    +   1. A header giving various bits of metadata about the process being signed.
    I usually ignore and for it

    2. The call graph, which is the meat of the information gathered.

    3. A sorted list of the most expensive/most used leaf functions.

    4. A trailer showing an overview of the code/libraries included in the running
    process, which I also usually ignore.


    Sample output contains a lot of information, not all of which is necessarily useful
    at any particular time. In particular, the wealth of output can obscure the actually
    relevant information. The **Call graph** section, for example, is to convey the
    call hierarchy, and children of a particular node are sorted so that the heaviest
    subset is shown first. We can easily see that allocating `NSNumber` objects using
    `_CFRuntimeCreateInstances` takes approximately one third of the time spent. However,
    the other two thirds of the time is a bit trickier instead of other functions
    at that level we get to see the implementation details of `_CFRuntimeCreateInstances`
    that are potentially interesting tidbits, but not actually pieces of information.

    The fact that sample output is textual opens the possibility to a wide variety
    of ad-hoc processing using Unix tools from the command line. A simple example
    using grep and head to remove unwanted detail cuts off the call graph at a specified
    depth and allows us to see all the direct descendants responsible for our *main
    function*. It achieves this by removing lines that start with a specific number
    (in this case 14) of non-numeric characters. As specific entries are indented
    and start with the number of samples encountered, this filters out all entries
    that are more deeply nested.


    ```

