    # Analysis


    Apple plenty of some other recommendations for optimizing CoreData: tweak the
    data model to use external storage for large binary blobs (this is a good idea;
    see also the "Segregated Stores" section in this chapter), de-normalize your data
    model to avoid cross-relationship fetches, experiment with batch sizes in data
    import tasks, put numeric predicates in fetch specifications, which evaluate more
    quickly, and so on.


    However, all of these recommendations are indicative of overcoming a weakness
    than showing a strength. If CoreData has great performance, why do I have to spend
    so much effort, getting my fetch specifications to be just the right size, not
    too large, not too small? These recommendations would make a lot more sense if
    we had the client/server model that CoreData is patterned after, because minimizing
    traffic across the network is always a good idea. When the "server" is not just
    on the same machine, but actually a library sitting in the same process just a
    function call away, preserving communications bandwidth to that server does not
    have the same weight.


    # SQLite


    If CoreData doesn''t work for you and you also don''t want to hold the entire
    graph in memory as required by the serialization techniques presented thus far,
    another option is talking directly to some sort of database. SQLite is popular
    for this application on OS X and iOS it comes as a library that is embedded in
    your application rather than a separate database application. SQLite also ships
    with OES and is widely used by Apple themselves, not least in CoreData.


    The SQLite C API is somewhat verbose, so I use the lightweight fmdb wrapper.¹10
    Unlike CoreData, fmdb doesn''t handle relationships automatically, so we have
