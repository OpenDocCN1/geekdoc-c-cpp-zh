    \ - )\\nREDUCE_METHOD( sum, + )\n```\n\nSwift has no preprocessor, so the way\
    \ to implement a generic operation like this is to use higher-order functions\
    \ as we did. There are many advantages to this approach, but you don't control\
    \ over the code that is generated, or how it is transformed by the optimizer.\
