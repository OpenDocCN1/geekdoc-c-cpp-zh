  md: '# Summary


    In this chapter, we looked at graphics performance and overall responsiveness.
    Although low-level drawing performance is more easily measurable and a frequent
    topic for developer discussions, I find that architectural patterns and domain-specific
    optimizations usually have a far larger impact. In fact, architectural restrictions
    of ostensibly faster low-level techniques that prevent high-level optimizations
    often have a far larger impact than the benefits of the low-level optimizations.
    One particularly significant point is model-to-view communication, which has become
    much more relevant in our network-connected devices because the model can change
    rapidly without user input. We will look at a more comprehensive solution to this
    problem in the next chapter.'
