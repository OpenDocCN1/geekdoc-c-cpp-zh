    # Memory Instruments


    As Instruments has slowly gobbled up all other GUI performance tools, it is no
    surprise that it also has a number of instruments for dealing with memory. While
    somewhat more heavyweight than the command-line tools, it does feature additional
    capabilities such as tracking usage time and richer data-analysis. It also has
    the ability to run multiple instruments simultaneously, which is useful for capturing
    the multiple facets of memory. Finally, it is pretty your only option for iOS
    devices.


