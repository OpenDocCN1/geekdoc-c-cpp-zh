    cathode ray tubes (CRTs). In an immediate-mode API, the client sends drawing commands,
    and they are executed and leave some effect, be it on a display or a piece of
    paper. In a retained-mode API, the API creates objects of some sort or that are
    maintained by the API and can, for example, be moved.

    Figure 14.2 illustrates the difference with three geometric shapes. In the retained-mode
    API on top, the client creates these three shapes and then are maintained by the
    API in a data structure or database of some sort. To change the position of the
    rectangle, the client must render the object. The API is responsible for refreshing
    the scene. With the immediate-mode API at the bottom, the scene is drawn twice,
    once with the rectangle having the old coordinates and once with the new.

    The primary graphics APIs Quartz and OpenGL are both immediate-mode APIs; you
    issue drawing commands and they are executed. OpenGL distinguishes between its
    own immediate and retained modes, but these are both immediate in the general
    sense. SceneKit and SpriteKit on the other hand are retained-mode APIs; you create
    nodes that are added to some sort of scene and then maintained by the API.

    Retained-mode APIs at first appear simpler, especially if the graphical object
    hierarchy matches what the application needs. In many cases, a simple graphical
