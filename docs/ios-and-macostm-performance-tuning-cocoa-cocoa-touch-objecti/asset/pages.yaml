    \ parse it:\n   a. Get offset of encoded object via offset table.\n   b. Decode\
    \ object at offset.\n   c. For any embedded object with index $m$, read object\
    \ at this index.\n   d. Return parsed object.\n\nThe `parseObjectAtIndex` method\
    \ that encodes the core of this algorithm is shown in Example 13.5. It reads the\
