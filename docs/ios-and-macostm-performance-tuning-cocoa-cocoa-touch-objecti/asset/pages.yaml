  md: '# # Memory: Measurement and Tools


    Memory has many different facets, with no one being primary. Even the seemingly
    simple question “How much memory is my program using?” does not have a single
    obviously correct answer. There is the amount of memory your program has obtained
    from the system via malloc and the amount of the process (including malloc) has
    obtained from the operating system. Both of these is the question of how much
    of address space is backed by real memory. In addition, you have mapped files
    and lots of address space and memory that is shared between processes, mostly
    by the system.


    Furthermore, the operating system is trying its best to optimize memory usage
    given the current set of running programs, so getting averages is sometimes more
    akin to outwitting a skilled opponent rather than simply taking a measurement.


    In addition, tools that analyze memory consumption generally have to chew through
    a lot more data than CPU samples, the impact on the running program is much greater.


    # ## Xcode Gauges


    Xcode’s “always” on lightweight profiling also includes an overview of memory
    consumption. Figure 6.1 shows the basic visualizations: circular gauges showing
    both instantaneous process-specific and overall system usage statistics, as well
    as a timeline showing the process’s memory usage over time. While not going into
    great detail, these do give you a basic overview of what’s going on, including
    a heads up if something is awry. I personally find the CPU gauge more useful.'
  merge: -1
