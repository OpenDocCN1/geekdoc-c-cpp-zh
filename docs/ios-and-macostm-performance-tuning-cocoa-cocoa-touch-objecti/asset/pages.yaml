  md: '# Graphics Hardware and Acceleration 301


    Although drawing is immediate mode, OpenGL supports uploading resources such as
    textures or vertex arrays to the graphics hardware that can be referenced multiple
    times. In OpenGL terminology, this is retained mode, to distinguish from a separate
    mode where all data is specified incrementally.


    One issue with OpenGL is that it provides a procedural/call-return API, which
    is not a good match for the actual interface to modern graphics hardware, which
    is more batch oriented. The mismatch means that code that looks “natural” for
    the API is very inefficient, whereas efficient code is extremely unnatural and
    hard to get.


    # Metal


    The Metal API is Apple’s answer to the mismatch between the OpenGL API and actual
    hardware. Like the similar Vulkan API from the Khronos group, Metal is a lower-level
    API that does not try to hide the underlying hardware.


    Instead of a call to the API corresponding to some specific state or drawing command,
    the application manages command buffers that it sends to the GPU.


    # Graphics Hardware and Acceleration


    Although some terms in computer graphics as “Display List” recall the days when
    we still had vector displays (where an electron beam was moved to specific points
    on a CRT to draw lines), virtually all displays today are raster displays. A raster
    display defines a rectangular grid of picture elements (pixels), just like a raster
    image depends on the input side.


    With modern solid-state displays such as LCDs, OLEDs or plasma screens, the actual
    pixel grid is also predefined by the hardware: there are actual pixel elements
    represented in the frame buffer.


    One result of this is that there is a fairly stable environment in terms of the
    actual number of pixels that we have to provide, at least once we take the jump
    to retina into account. An iPhone screen is going to be between 700K and 2M pixels,
    an iPad in 3M pixels, and an iPad Pro or a laptop up to the maximum number of
    pixels you have to modify change the entire screen on every refresh. In Big-O
    notation, the complexity is O(k).


    Despite the number of pixels being constant, and therefore negligible in terms
    of algorithmic complexity, this is actually quite large and therefore anything
    but negligible. In many cases, producing graphics is the most computationally
    intensive task in modern non-server computers.


    Over time, this has led to different configurations of hardware support for graphics
    operations, some of the most common of which are shown in Figure 14.4. The simplest
    configuration (1) is that there is no extra hardware support; it is just the CPU
    drawing into main memory, and main memory is also used as the frame buffer to
    refresh the screen.'
