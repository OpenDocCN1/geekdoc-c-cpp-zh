  md: '# Chapter 16 Graphics and UI: Pitfalls and Techniques


    In OS 10.9 and iOS 7, Apple introduced explicit support for reporting progress
    of long running tasks with the Progress class and NSProgressReporting protocol.
    The basic idea is to have objects report on progress of individual activities
    and combine those individual reports to obtain the overall progress. Having implemented
    a very similar system back in the late 1990s, I can say that this is very well
    done.


    As, Apple completely dropped the ball, or maybe been, when it came to actually
    reporting progress. The recommended technique for actually reporting progress
    to the UI is to observe the percentCompleted property of the top-level NSObject.
    That doesn''t solve any of the problems we''ve seen, and it adds the problem that
    the KVO notification is going to be delivered on the same background thread that
    changes the progress status.


    In fact, Apple admonishes us: "Don''t update completedUnitCount in a tight loop,"
    so they are aware of the problem, and they realize haven''t actually solved.


    # Overwhelming an iPhone


    A couple of years ago, I was asked to help out with a newspaper app that was managing
    a number of items in RSS-like feeds, displayed using the ubiquitous UITableView.
    Every item had ID indicating the different states it could be in: not yielded,
    all metadata received, or without audio, and so on. In addition, it would indicate
    incremental progress while downloading audio data because those files could take
    a significant time to download.


    This all worked fine as long as we were working with a single feed of up to 10
    items, but once we went into production we started experiencing significant problems.
    We tried obvious optimizations, for example, moving long-running operations as
    thumbnail generation onto a background thread and refraining from doing unnecessary
    work while synchronizing the entire database for every state of every item, but
    to no avail.


    The symptom was that the UI would freeze, for a significant amount of time, before
    the app could use again. This happened especially on first launch of the app,
    as it had to do an initial fetch/update of all the items in the feeds. Subsequent
    launches tended not to have as much of a problem data was already cached, but
    there was a bad user experience to contend with.


    Profiling showed that the time was being spent in UIKit drawing code (text drawing,
    table layout). The Cell reuse mechanism advocated by Apple was being used and
    working as expected, with no particular overhead from Cell creation. Not much
    to do there, right?


    Wrong! The problem turned out to be the code in Example 16.2.'
