  md: '# Chapter 15 Graphics and UI: Measurement and Tools


    The times were measured: 11.1 ms, PNG 3.89 ms, JPG 0.51 ms, so it’s a clear case
    for prerendering and storing as JPG, right? We can also superficially explain
    the figures as we saw in Chapter 14, Core Animation is bitmap based, so drawing
    is an extra step, where images are loaded and stored more directly as the layer’s
    backing storage.


    Not fast!


    It turns out that timings come from measuring on the simulator (the numbers are
    suspiciously low). Also, what’s with JPG being 8 times faster than PNG? It’s all
    a bit weird.


    First, I used my trusty Instruments to get a rough idea of what was going on,
    and there was no image decoding going on method -drawImageDrawingLoading. Instead,
    I saw a bit of PNG decoding going on, during actual drawing of these views. I
    did not see any JPEG decoding; it was too quick. This confirms what we know about
    image loading and decoding on iOS: It is extremely lazy, only loading/decoding
    images when it is absolutely necessary, such as when drawing.


    Running the code on an actual device (iPhone 5) yielded the following numbers:
    Drawing 3.26 ms, PNG 67.2 ms, JPG 49.1 ms. The roles are reversed, with drawing
    being more than 20 times faster than PNG decoding and However, the result is also
    puzzling—since iOS isn’t actually decoding the images here (which no instrument
    run confirms), what is it doing?


    If you look closely using Instruments, it turns out that the times for JPG and
    PNG “decoding” are just one-time initialization costs of the respective decoders.
    “loading” a second copy of the image is many times faster: Drawing 3.50 ms, PNG
    2.54 ms, JPG 1.91 ms. But of course those still are not the times for actually
    decoding the image; the images are just reading some metadata for the disk from
    and preparing it for future decoding.


    In order to force decoding separately from drawing the image in a view (where
    it is difficult to disentangle), we need to “draw” the image in a bitmap context,
    and using this we get the following times: Drawing 3.41 ms, PNG 7.19 ms, JPG 8.39
    ms. That is the closest we get to the true, though it is still not correct because
    we have combine decoding and drawing. Apple claims this is essentially the same
    thing as a pure decode, but we can’t be 100% certain of it.


    Another anomaly was that although we now clearly identify the PNG decoding codes
    in a CPU Profile Instrument with the “Record Waiting Threads” option shows that
    the JPEG decoding is sitting in mach_msg_trap (), that is, waiting for another
    process that doesn’t show any CPU activity. Answer, of course, is that iPhones
    have a hardware JPEG decoder, use of which doesnt show up as CPU activity.'
