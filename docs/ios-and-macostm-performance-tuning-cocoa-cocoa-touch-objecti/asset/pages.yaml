    easy as that. We added a UIView, moving the drawing code, added some utilities
    for changing rectangles from sets of time, and only invalidated the rectangles
    for a specific frame. The effect was dramatic: Where before we barely reached
    3 to 4 frames per second by pegging the CPU, we were now effortlessly reaching
    60 frames per second, with CPU usage rarely exceeding the 2% to 3% range, largely
    independent of the overall complexity of the page. Even better, the UI animation
    was now achieved by pulling from the UI, rather than being pushed from the audio,
