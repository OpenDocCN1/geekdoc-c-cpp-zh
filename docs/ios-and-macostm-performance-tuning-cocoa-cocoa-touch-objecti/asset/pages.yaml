    # Whole-Module Optimization


    When you think about it, the generics specialization mechanism discussed in the
    previous section is quite a feat. It reaches compilation units to extract a definition
    from a previously compiled file and instantiate the definition in the current
    compilation unit, apply arguments, and compile the result.


    In the C/Objective-C/C++ world, this simply isn''t possible. The only way to access
    definitions from another file is to physically include the source text of those
    definitions into the currently compiling unit using. That included file can contain
    other definitions, inline functions, or C++ templates.

    -module optimization takes this concept step further by completely eliminating
    the idea of separate compilation. All of the program files are compiled together
    at once, with all definitions and uses visible to the compiler.


