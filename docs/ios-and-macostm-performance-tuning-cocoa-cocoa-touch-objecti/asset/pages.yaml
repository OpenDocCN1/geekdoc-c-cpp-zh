  md: '# Introduction


    Performance is one of the most important qualities of software programs. You can''t
    have world-beating software without world-beating performance. For a long time,
    hardware improvements meant that worrying about software performance seemed a
    waste of time, whereas with Moore''s Law no longer automatically providing significant
    automatic performance improvements, performance optimization is coming back to
    the forefront of both computer science and engineering.


    In addition, for end users we have gotten only marginally better, whereas the
    performance of the underlying hardware has improved by many orders of magnitude.
    Bill Gates quipped that "the speed of software halves every 18 months," whereas
    Wirth''s law in A Plea for Lean Software becomes faster.*Wirth''s Law in A Plea
    for Lean Software states, "Software is getting slower more rapidly than hardware
    becomes."


    We are used to this sorry state of affairs that industry veterans were surprised
    by the original iPad''s fluid UI, despite having a CPU with "only" 1 GHz. That''s
    1000 faster than my Apple II, and 40 times faster than my NeXT cube had a larger
    screen to deal with. If anything, the surprise should have been that it wasn''t
    faster, especially when considering it also had a GPU to handle the screen.


    General themes will include latency bandwidth, and transaction costs (overhead)
    versus actual work done, which are universal and manifest themselves in different
    forms at every level of the hardware and software stack.


    What you will notice is that the speed of our machines, any single operation is,
    in fact, always more than fast enough, so the crucial question is items * cost.
    Most optimization is about reducing one or both of the parts of that formula,
    usually by breaking it up first.


    > 1. Nikolaus Wirth, A Plea for Lean Software (Los Alamitos, CA: IEEE Computer
    Society Press, 1995), pp. 64–68. http://dx.org/10.1109/2.348001'
  merge: -1
  pgno: 18
- img_proc: true
  md: "# Introduction\n\nOne frequent method for reducing cost is to realize that\
    \ cost is actually composed of two separate costs, $cost_1$ and $cost_2$, and\
    \ only one of these needs to be applied to all items: $items \\times (cost_1 +\
    \ cost_2) \rightarrow cost_1 + items \\times cost_2$. I would probably call this\
    \ the fundamental optimization equation; a large part of the optimization techniques\
    \ fall into this category, and it is also fundamental to the organization of most\
    \ of the hardware/software stack we deal with every day.\n\nThis book has a very\
    \ regular structure, with four basic areas of performance discussed in turn:\n\
    \n+   1. CPU performance\n2. Memory\n3. I/O\n4. Graphics and responsiveness\n\n\
    Although an effort has been made to keep the treatment of each subject area independent,\
    \ there is a logical progression, so at least a passing familiarity with earlier\
    \ topics helps with later topics.\n\nWithin each of these broad topics, there\
    \ are again four specific areas of interest:\n\n+   1. Principles\n2. Measurement\
    \ and tools\n3. Pitfalls and techniques\n4. Larger real-world examples of applying\
    \ the techniques\n\nAgain, there is a logical structure: You need to have some\
    \ idea about the principles and know how to measure before you can meaningfully\
    \ think about actual performance optimization techniques, but, you should also\
    \ be able to dip into areas of interest if you have a passing familiarity with\
    \ earlier topics.\n\nThis structure yields a total of $4 \\times 4 = 16$ chapters,\
    \ with a special chapter on Swift used throughout the book where appropriate,\
    \ but it deserves a chapter of its own due to its unique performance characteristics.\n\
    \nFor me, software performance is a passion and a calling that has been a common\
    \ thread throughout my career. I have learned that performance is something you\
    \ can automate, nor can you leave it until the last minute. On the other hand,\
    \ there are many times when you shouldn't worry about performance in order to\
    \ have the capacity to concentrate on performance where it is really needed. If\
    \ that weren't paradoxical enough, having excellent base performance performance\
    \ levels is often what makes it possible to get to that stage of not having to\
    \ worry about performance most of the time.\n\nIn short, this book is about making\
    \ software that performs beautifully."
  merge: -1
