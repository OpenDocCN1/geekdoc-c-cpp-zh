  md: "# Dtrace\n\ndtrace can be regarded as a combination of external and internal\
    \ measurement devices on kernels, with cull support and full scriptable tracing\
    \ facilities. In short, it can do almost anything, but power comes at the price\
    \ of simple tasks requiring significant know-how and effort. In my personal experience,\
    \ the vast majority of performance-measurement tasks are fairly straightforward\
    \ and already covered by existing tools.\n\n# Optimization Beyond the Call of\
    \ Duty\n\nSoon after starting to work at one particular company, I was asked to\
    \ help a colleague who had been tasked with an optimization problem; there was\
    \ some problem with mail indexing being slow. My brief was that he had been working\
    \ at this problem for a month without any visible progress, and concern was spreading\
    \ throughout groups.\n\nMy inquiry about the status of the investigation revealed\
    \ that the developer in question had been doing impressive work on string searching\
    \ algorithms, with comparative statistical analyses of several advanced variants\
    \ of Boyer-Moore-type strings to find which one would squeeze out the last percent\
    \ of performance for the types of data sets in question.\n\nAll good stuff, but\
    \ 10 minutes of sampling and code review revealed that the original program was\
    \ using code that essentially looked like Example 2.3, except that the function\
    \ pointer passed into the function in question.\n\nExample 2.3 Inefficient string\
    \ search\n\n```\ncomparisonFunc=isSensitive ? strncmp : strcasecmp\nint len=strlen(target)\n\
    int max=strlen(source)-len;\nfor ( i=0; i<max; i++) {\n if ( comparisonFunc(source+i,\
    \ target, len )) {\n // success\n}\n```\n\nThis is perfectly workable code, but\
    \ it is slower than necessary for one and possibly two reasons: First, we are\
    \ calling the full string comparison function for every single character of the\
    \ potentially large input string, and second we are calling that function through\
    \ a pointer function.\n\nThe first problem is the crucial one. Although we will\
    \ need to call the comparison function to determine whether there is a full string\
    \ match at a particular location in the source, the vast majority of locations\
    \ will not match, so the bulk of the work is rejecting candidate locations, not\
    \ matching them. With that insight, it becomes clear"
