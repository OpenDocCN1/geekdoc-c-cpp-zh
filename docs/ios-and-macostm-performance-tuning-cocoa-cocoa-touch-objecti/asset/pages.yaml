    disciplines a 12% improvement, always obtained, remains marginal; and I believe
    this viewpoint should prevail in software engineering. Or I wouldn''t bother making
    such optimizations on a one-shot job, but when it''s a question of preparing quality
    programs, I don''t want to restrict myself to tools that deny me such efficiencies.


    > "Structured Programming with Go To Statements," Knith, 1974.


    The quote is embedded in the paper "Structured Programming with Go To Statements"
    from 1974, which is largely about achieving better performance via the use of
    statements. It is in fact, large an advocacy piece for optimization, not against
    it, containing such gems as the idea that engineers in other disciplines would
    be excluded from practicing their profession if they give up performance as reliably.


    What makes Objective-C so powerful is that once you have the information as what
    needs optimization, you can really, smash-bits, and exploit all the hardware has
    to give. But until point and for the parts that don''t need it, you can enjoy
    the remarkable productivity of a highly dynamic object-oriented language.


    Swift takes a different approach: make everything more static up-front and while
    superbly sound, this approach inverts Knuth''s dictum by making microperformance
    a deciding factor in not just application, language design. In addition to the
    approach being questionable in principle, it currently doesn''t work: Swift is
    not just slower than optimized Objective-C, it is often significantly slower than
    non-optimized Objective-C, without any further recourse than waiting for the compiler
    to get better or rewriting your code in S.


    That said, a little of structural foresight and planning is extremely helpful
    in order to enjoy the benefits of the late optimization: You should have an order
    of magnitude of data you are dealing with (one, a thousand, a million?), operations
    you need to support, and whether the machine you are targeting can handle this
    amount of data, at least in principle.


