    # The Death of Optimizing Compilers


    The type of performance model underlying the query for the SSC was useful when
    computers were generally slower and we wanted them to be a bit faster (or a lot
    faster—but rarely worked out, per Probsting''s Law).


    Today, compilers are generally fast, and large parts of most programs are not
    performance critical. Performance-critical code (20%) of the code accounts for
    80% of the performance and vice versa) had already moved to a 97-3 rule in 1974
    when Knuth made his famous remarks about small efficiencies, and nowadays it is
    even more skewed.


    The overwhelming majority of code in most programs, and especially in interactive
    programs, is not just hot, but it is cold. Therefore, its performance is largely
    irrelevant. At least unless you have factors of a thousand and more involved:
    code that is used 1% of the time becomes a significant factor if it runs 1000
    times over!


    I think the Cocoa at ARC code provide ample evidence that this is true. Just look
    at our own at the "Optimizing ARC" section of Chapter 7: the code in non-optimized
    debug builds was an order of magnitude slower than yesterday, yet we not. I am
    pretty sure that the same goes for most Swift code used in iOS or Mac development.
    Yes, it is being compiled in debug mode (no optimization), and yes, it is an order
    of magnitude or slower than release mode (optimized), and yes, by no, nobody.
    This also explains Swift''s reputation for speed that is strongly contradicted
    by just every bit of empirical data I could find.


    As a consequence, one might think that performance is increasingly irrelevant,
    but that out to be an incorrect conclusion. Performance is actually getting more
    important, not less. As computers become faster, users are using them to process
    more data, often dramatically. With more data, the innermost loops of our programs
    are becoming significantly performance relevant, not less, even as the rest of
    the program becomes less and less relevant.


