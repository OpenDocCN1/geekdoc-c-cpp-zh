- img_proc: true
  md: '# Graphics and UI: Measurement and Tools


    Just as with other areas of performance, optimizing graphics is usually pointless
    without knowing what is slow, and most importantly, knowing whether you just helped
    or hurt performance.


    Measuring graphics performance and responsiveness is in many ways more difficult
    than other forms of performance measurement. Typically, the action is happening
    deep inside opaque system libraries, separate processes you don''t necessarily
    have access to even separate pieces of hardware that or may not be introspective.


    What’s more, when it comes to graphics performance, you really start to care about
    the timing of individual events, down to the level of tens of milliseconds. In
    previous chapters, we cheated a bit by measuring a large number of individual
    events and then dividing to get the “timing” for the individual event. This is
    not entirely correct; what we got was the average timing.


    As we saw in Chapter 14, averages are only marginally useful in graphics timing:
    Having all frames of a sequence of animation delivered in less than 16.6 ms is
    not at all the same as having 50 frames delivered in 1 ms and the remaining 10
    frames take 90 ms each. Even though the second version is slightly faster on average,
    it will look unably jerky, whereas the slower first variant is perfectly smooth.


    Fortunately, there are mitigating factors. The system and the tools have a much
    better idea of what you are trying to do, and therefore can give you much better
    insight into whether you are accomplishing this goal effectively. As an example,
    if you are overdrawing a pixel with the same value, this effective no-op can be
    flagged.


    This chapter will look at some of those specialized instruments and the specific
    aspects of the graphics pipeline they are designed to report on, as well as how
    to use these tools with the more general tools and techniques we have seen earlier.'
  merge: -1
  pgno: 328
