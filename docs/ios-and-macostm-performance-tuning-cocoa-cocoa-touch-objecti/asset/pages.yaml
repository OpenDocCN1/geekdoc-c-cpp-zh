    The Apple II''s ProDrive had a transfer speed of 5 MBit/s, which was actually
    faster than Apple''s 6502 processor could handle at 1-MHz clock speed and several
    orders in. It could transfer the 5-MByte capacity in 10 s, not counting seconds.
    Today''s hard drives transfer around 100 MByte/s, or around 10 ns per byte. In
    10 ns, our laptop CPU can execute over 30 instructions, if it isn''t blocked by
    memory. The contents of a typical consumer drive with 1-terabyte capacity would
    take 10,000 s, or almost 3 hours to transfer.


    If weren''t enough bad news, access times, while also getting slightly faster
    over time, are getting faster at an even slower than transfer speeds. Access speeds
    are determined by the seeking head and rotational delays. But are large questions
    of physics; those physics haven''t changed and are not going to change, with engineering
    advances in moving and stopping these masses coming much more slowly. In addition,
    moving masses quickly is associated with noise, so demand for quieter disk drives
    has actually led to decreases in seek performance.


    The ever-increasing spread between transfer speed and seek performance has led
    to the phrase "Disk is the new tape."


    # Solid-State Disks


    SSDs lift many of the physically induced limitations of rotating disks, due to
    the fact that they have no moving parts. The initial access times ("seek") are
    much improved, but as we saw in the last chapter, they still are slow compared
    to memory. There are also physical limitations, for example, increases in capacity
    such as multilevel cells have their trade-off not just decreased reliability,
    but also slower read and write speeds.


    Writing in general is problematic, an even section of flash has to be bulk-eraser
    (which takes some time) before any information can be written. Becoming becomes
    even more important than on hard drives lot of small writes will not only be slow;
    but will also wear out the cells ahead of time.


    So while SSDs represent an improvement, and are the easiest easiest way to improve
    things like application performance or server-side databases (especially if read-mostly),
    they are not a panacea. In fact, a 2012 study¹ of Web-browser performance found
    that it was not limited by processor speeds or even slow cellular networks, but
    instead by the combination of SQLite and slow flash memory?


