    palette images and even reducing the color palette further than 8 bit, sacrificing
    color resolution for spatial resolution.


    Sacrificing color resolution is a good idea in principle because human vision
    has much higher resolution for brightness changes than for color changes, but
    the effort was probed by the method used: The images were examined in an interactive
    tool at several times the original size, and parameters adjusted until a minimum
    size was achieved that still "LOOKED OK." The problem with this approach is that,
    due to the fact that images are magnified, spatial defects are emphasized over
    color defects. The solution was to be also "magnify" color resolution, but I am
    not aware of a way of doing this.


    The way the prototype app attempted to avoid multiple versions of the assets for
    each device was also problematic—save a version optimized for the particular device
    in question (in essence, downsampled to the appropriate resolution). In order
    not to impact the existing rendering code, this subsampling and saving before
    resulted in horrific first launch experience: The app would sit for several minutes
    with a loading screen and spinner, unable to interact, and the device would get
    hot.


    In addition, iOS''s PNG writing code does not feature the optimization mechanisms
    of external tools, so the images saved were 32-bit RGBA, significantly larger
    than the originals despite being lower resolution.


    # Brainstorming


    To me, it seemed obvious that the use of PNG format "as-is" would have to be least
    considered. My first ideas revolved around a pyramidal encoding scheme similar
    to or directly using wavelet encodings as JPEG 2000. The beauty of a pyramidal
    encoding scheme is that the image is compressed by extracting lower resolution
    versions of an image and storing only the differences between those versions.
    This means that the act of decompression automatically extracts lower-resolution
    versions, and therefore multiple resolutions can be provided with just one image
    file.


    Also, JPEG 2000 support on both iOS and Mac OS X is quite slow, JPEG 2000 itself
    was not an option. There is also a bit of evidence that this lack of performance
    is not due to the format and the technique. This approach seemed quite daunting,
    even though our needs have allowed for a simpler implementation with fewer levels
    in the pyramid, and possibly using other compression mechanisms for encoding those
    base images.


    We also looked at alternative to the Flate method used in PNG. Flate compression
    is a very good-purpose lossless compressor, but our requirements aren''t general
    purpose, they are very specific. For example, we only compress images, and we
    care much less about compression speed than decompression speed (flate is intentionally
    pretty symmetric). One alternative we looked at was LZ4, which boasts decompression
    speeds at 10 times faster than flate with slightly worse compression ratios.'
