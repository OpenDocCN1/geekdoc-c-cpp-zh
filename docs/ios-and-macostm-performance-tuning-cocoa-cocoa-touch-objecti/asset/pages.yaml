    # Quartz Debug


    For Mac OS X, a specialized tool for debugging graphics problems is the aptly
    named Quartz Debug. Figure 15.3 shows its option windows and the framerate meter.
    Quartz Debug enables debugging parameters in Mac OS X''s graphics stack, it won''t
    affect your project, but all running processes, including Quartz Debug itself,
    so it is best to quit at or hide all other except the one test.


    The option I find most useful is Flash screen updates, pretty much in the middle
    of the options windows. With this option, Quartz flashes a red rectangle around
    the area of the screen that was updated with identical content, meaning that the
    drawing was completely redundant and should be eliminated. There is really no
    good reason to draw identical content.


    Next is the Flash screen updates setting, which is similar to the previous option
    except that it flashes a yellow rectangle on all updates, not redundant ones.
    This option allows you to identify drawing that, while different, may not have
    to be refreshed as often as it. Enabling this option can produce a lot of clutter.'
