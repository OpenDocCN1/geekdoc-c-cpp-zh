    # Object Interaction


    The 2nd access highlights another aspect of CoreData performance that is sometimes
    neglected: the overhead of retrieving data from NSManagedObject subclass or a
    dictionary once it has been fetched. The overhead for the former appears to be
    around 6x compared to a plain object, the latter 10x. We already saw the overhead
    for writing attributes, which is several orders of magnitude higher. Although
    CoreData uses special dictionaries and highly optimized dictionary-like access
    methods for NSManagedObject instances, the cost of interacting with attributes
    is still times greater than that of interacting with regular objects.


    # Subsetting


    Where CoreData shines in dealing with subsets of a large data set, when connected
    to SQLite, it is capable of querying subsets, modifying subsets, and without them
    having to deal with the rest of the data that wasn''t touched. While cost per
    element is high (one or more orders of magnitude higher than the simple brute-force
    techniques we looked at earlier), we can achieve good or at least reasonable performance
    for overall performance (number * cost) if we push the number of elements down.


    Reading and writing a single object or small subset that can be retrieved via
    index will be quick with CoreData, with the serialization mechanisms we looked
    at earlier we have to load the entire object graph if we only need one object,
    and save the entire object graph if we modified a single object.


    This ability to deal with subsets is offset by the fact that subsetting is also
    a hard requirement: You absolutely must sufficiently subset your data, or performance
    will blow up in your face. As we saw, CoreData simply adequately deal with large
    data sets, so you need to make sure your working set is always sufficiently small.


    For example, adjusting the query to only fetch 1000 objects instead of the whole
    reduces the fetch time to 10 ms, which is sufficient for many applications but
    does not require fetching relationships and having an index on the key that we''re
    fetching. Without it, SQLite has to do a table scan and times increase to around
    1.5 s for this data set, which will be at the very least a noticeable delay. Modifying
    those 1,000 objects in memory takes 31 ms and saving 144 ms, which is at the edge
    of interactive performance. For reference, our 1,000 objects are 1/1,000th of
    the 46 MB total file size, so 46 KB, giving us a data rate of 4.4 MB/s'
