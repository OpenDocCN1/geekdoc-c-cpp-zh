  md: '# 17


    # Graphics and UI: Examples


    His chapter will look at two concrete examples of tuning larger applications in
    their totality: a highly image-centric weather app and the Wunderlist 3 task manager.


    # Beautiful Weather App


    A couple of years ago, I was approached by a young Berlin start-up that had hititherto
    worked primarily on puzzle apps and had been very successful with that. Their
    goal was to build the most beautiful weather app on the planet, and now that they
    were almost doing it beautiful (see Figure 17.1) they hit some sn making it shippable.


    The app was so heavy that it would routinely crash out of memory errors. In addition,
    there were performance problems. I''ve already discussed some of the lessons learned
    in earlier chapters, but one of the most remarkable is the nasty interaction between
    memory warnings and threading: If you run your memory consumer on the main thread,
    your process will be blocked from receiving and acting on memory warnings and
    will likely get killed, even if you could in principle do something about it.
    On the other hand, if your memory consumer runs on a background thread, it is
    likely that it will continue to consume memory while the main thread is trying
    to do something about the memory warning, leading to the process killed.


    The solution was to have the background thread occasionally “check in” with the
    main thread by sending a message to the main thread and waiting for the result,
    especially before large allocations. The result would be to give the main thread
    a chance to react to any memory warnings and stall the background thread if processing
    was taking place.


    # An Update


    The main task described in this chapter, however, is the work done for an update
    of the application. By this time, iOS device screen sizes and resolutions had
    multiplied, and a mix of old and new devices meant that there was a vast gulf
    in capabilities'
