  md: '# Assessing Swift Performance


    frequently allow you to have and keep your modeling cake while simultaneously
    munching down on some delicious performance chow, but they have been either curtailed
    or eliminated outright in Swift.


    Instead, the programmer is supposed to structure her programs in such a way as
    to give as much information to the compiler as possible. That is it easy for the
    compiler to understand the whole program and then rely on the optimizer to actually
    figure out how to most efficiently map the high-level abstractions to efficient/optimal
    machine implementations.


    I call this approach compiler-oriented development (COD) because it seems to be
    more focused on making easy life for the compiler rather than the developer.


    It is very different from the hybrid model represented by Objective-C that we
    talked about in a bit "The Power of Hybrids" section in Chapter 1: The compiler
    mostly gets out of the way, and the language provides simple and understandable
    abstractions. It is the developer''s job to spot hotspots and fix them using the
    many tools provided.


    # Benchmarks


    This is a short section. While Apple has provided slides and headline comparison
    numbers, it hasn''t provided the benchmarks those numbers are on or even just
    detailed results. Requests to provide the source code to those benchmarks were
