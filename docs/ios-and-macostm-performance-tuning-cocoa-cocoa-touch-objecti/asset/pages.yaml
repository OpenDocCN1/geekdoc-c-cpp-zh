    # Cost of Operations


    At its heart, optimization is the art of balancing cost with outcomes, ideally
    achieving the best outcome at minimal cost. Balancing costs is hard without knowing
    what those costs are, so it is important to really familiarize yourself with the
    costs of common operations that are important for your application areas (and
    of course measure, measure, measure, which we will cover in Chapter 2).


    Tables 1.2 through 1.6 show the cost of common CPU–oriented operations on pieces
    of hardware. These costs are shown both in absolute terms and relative to each
    other, which is why the tables are 2D, with specific operations listed both in
    rows and columns. If you want to find how much one operation costs in terms of
    another, just check the intersection of the column of one operation with the row
    of the other.


    All basic operations are individually incredibly fast on modern CPUs, but the
    absolute times of these operations are so far from the scales that a human being
    cannot intuitively grasp as to be nearly meaningless; this was illustrated by
    the student from Bentley''s Programming Pearls who gave the running time of an
    algorithm as 1.83, but not really sure whether it was milliseconds or microseconds.


    Table 1.2 focuses on relative cost, so you can see that a message is sent as costly
    as an integer division, and one object allocation costs the same as 45 message
    sends. If we are wrapping an integer division in a message send, our overhead
    is 100%, which is somewhat questionable but may be acceptable depending on your
    circumstances. Wrapping an addition in a way that requires an object allocation,
    on the other hand, would cause our relative overhead to be a factor of 1,000,
    so is 1,000 times slower than it needs to be in that area.


