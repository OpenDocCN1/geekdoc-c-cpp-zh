- img_proc: true
  md: 'Directory wrappers are ideal for this sort of situation because they allow
    you to store the large, infrequently changing data separately from the frequently
    changing smaller data. When saving, make sure you keep a reference to the original
    data on disk, possibly via its NSFileWrapper. Cocoa will only write out the bits
    that have changed, even performing hard links to unchanged bits if you use the
    atomic version of the file wrapper methods.


    The zip file versions of the iWork format diminish the advantages of this setup
    a little because the different components end up in the same zip. However, just
    copying bits from one file to a new file is still much quicker than serializing
    the data anew, as we saw earlier.


    In the current version of the iWork file formats, Apple added another dimension
    to keeping data separate: each page is a separate entry in the zip file. For saving
    to this disk probably makes very little difference; instead, it is probably a
    feature of keeping changes isolated in order to make iCloud syncing work.


    # Summary


    In this chapter, we looked first at basic disk and network I/O, and then at higher-level
    strategies for serialization, including the built-in serializers, databases, and
    CoreData and alternative strategies such as XML and the Event Poster pattern.


    Alas, we have also seen a lot of pitfalls, many of which involve problems we have
    encountered before such as overuse of dictionaries and verbose intermediate representations.
    In short, Cocoa and Objective-C don''t have a really good data persistence option,
    only a bunch of marginally useful ones.'
