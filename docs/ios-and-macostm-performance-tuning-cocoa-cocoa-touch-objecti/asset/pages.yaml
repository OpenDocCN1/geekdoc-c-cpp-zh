    stroked paths, which have to be expensively tessellated to turn them into the
    shaded triangles used by the graphics hardware and exposed by the APIs. If they
    are shaped, that translation cost would be easier to amortize over many uses,
    but the APIs don''t provide for that.


    # Too Much Communication Slows Down Installation


    One investigation that had an unexpected result was looking into the mysterious
    slowdown of an installer in a new Mac OS X version. The installer was installing
    several thousand small files and previously had performed as expected. With the
    new version, the installer had slowed down sevenfold, almost an order of magnitude.
    I/O rates were much slower than the disk subsystem could support and CPU usage
    was negligible, so there did not seem to be any bottleneck to explain the drop
    in performance.


    # The Display Throttle


    After each head-scratching and tool usage, the culprit was found to be the status
    updates the installer was providing. By displaying the name of every single file
    it installed, and in order to make sure the user had a chance to see every single
    one of those filenames, it was drawing to screen after every name. This eagerness
    to keep the user abreast of its progress fell af of a throttling mechanism inside
    the Mac OS X graphics subsystem that limits graphics updates to the screen refresh
    rate, nowadays somewhat arbitrarily at 60 Hz. Trying to flush the screen more
    often will simply block your program, as illustrated by Example 16.1.'
