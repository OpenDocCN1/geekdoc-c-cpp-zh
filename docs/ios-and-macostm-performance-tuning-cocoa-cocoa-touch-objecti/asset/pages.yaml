    When I started this exploration into binary list encoding, I had no idea where
    it would go, and frankly I wasn''t expecting much. After all, the format has been
    in use for over a decade and is an Apple workhorse, has been optimized heavily
    during the time. I have to admit that I am very happy with the way it turned out.
    Not only does this example the principles and techniques I discussed earlier at
    work, but it has tangible results that can be applied immediately. With lazy loading,
    property lists can now be used for very large data sets, potentially simplifying
    a class of applications that need lots of data. Using direct reading/writing removes
    80% of the time and over 99% of the memory overhead.


    The magnitude of these results were not obtained by looking and removing hotspots,
    but by looking at architectural issues such as the non-overridable API and the
    call/return semantics requiring a fully formed.


    That said, more code performance could be improved further by optimizing the handling
    of objects or even allowing them to be eliminated by adding inline objects for
    primitive types. The same API could be extended to also cover XML and JSON property
    lists.


    In addition, you might noticed that the API is now close to keyed archiving. Adding
    to the fact that binary property lists can actually handle at least acyclic object
    graphs, and you see that the only thing missing from a keyed archive is a way
    to encode object classes for dictionaries, for example, in a section after the
    object table, the format has room for it. Alternately, it seems likely that the
    performance overhead of keyed archiving would be significantly reduced if the
    additional nested dictionaries were not materialized in memory.'
