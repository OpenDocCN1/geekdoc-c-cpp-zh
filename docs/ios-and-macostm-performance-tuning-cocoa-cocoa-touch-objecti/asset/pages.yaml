    # Mach Virtual Memory


    Although the memory hierarchy contains hardware of vastly different types and
    characteristics, the operating system makes it all appear uniform to the usland
    developer. The Mach microkernel that OS X is based on does this by separating
    the concepts of address space and memory, with the user interacting primarily
    with address space and the operating system and hardware cooperating to back that
    address space with different kinds of resources.


    Irrespective of the physical memory organization discussed in the previous section,
    the address space of processes on most modern operating systems is organized into
    fixed-size pages, currently 4096 bytes on iOS and OS X. When you determine the
    size yourself using the program in Example 5.3. When your program tries to access
    memory, it uses a virtual address. This address is translated by the CPU to a
    physical address by shifting it 12 bits to get a page number. Page number is translated
    to a physical page using page tables maintained by the operating system (with
    a small cache inside the CPU, the translation lookaside buffer, is one of the
    busiest pieces of hardware on a CPU) and the low 12 bits are then used to access
    memory within the page.'
