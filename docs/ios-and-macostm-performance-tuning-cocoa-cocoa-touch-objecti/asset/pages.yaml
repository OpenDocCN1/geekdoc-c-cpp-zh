  md: '# CPU: Principles


    The interaction between CPU performance and Objective-C has a history going back
    to the beginnings of Objective-C in the early 1980s and the first public release
    of Smalltalk. Smalltalk is a dynamic object-oriented language and environment
    implemented on top of a byte-coded virtual machine with garbage collection and
    complemented by the first integrated bit-mapped graphical user interface (GUI).
    It was this environment Steve Jobs saw during his famous visit to Xerox PAR and
    decided to popularize with the Lisa and Macintosh computers.


    Although it provided amazing capabilities for the time, the Smalltalk environment
    proved too much for the emerging workstation-microprocessors such as the Motorola
    MC 68000, which was to be at the heart of both the Mac and Lisa, and handle with
    acceptable performance.


    Three approaches emerged to tackle this performance problem—two at the extremes
    and one a compromise somewhere in the middle.


    +   The first approach is represented by the Macintosh Toolbox and original MacOS.
    The Macintosh completely dropped the expressiveness of Smalltalk''s dynamic object-oriented
    approach and instead retained just the GUI, which was reimplemented in MC 68000
    assembly language. This made it possible to populate the GUI, but left the software
    engineering and environmental advantages of Smalltalk behind.

    In fact, Steve Jobs said that he was so enthral with the GUI that he missed the
    more important pieces of the PARC magic: object-oriented programming and networking.

    On the other end of the spectrum, the Smalltalk community decided to innovate
    in technologies to close the performance gap. This led to important innovations
    such as just-in-time compilation and scavenging garbage collection that dramatically
    increased performance.

    Moore''s Law turned out to be an even bigger contributor, though. Even a naive
    Smalltalk-80-style bytecode interpreter on today''s hardware is roughly 100 times
    faster than assembly language on MC 68000 class machines even for basic'
  merge: -1
  pgno: 20
- img_proc: true
  md: "integer operations directly supported by the CPU hardware, and such integer\
    \ computation represents pretty much a worst-case for Smalltalk.\n\n+   3. The\
    \ middle-ground approach is the one taken by Objective-C, a hybrid language that\
    \ integrates a Smalltalk-like dynamic object-runtime on top of the C programming\
    \ language. Objective-C emerged around the same time as the original Macintosh\
    \ on comparable computational power. Instead of discarding object techniques completely\
    \ like the original Mac, or relying purely on technological advances to make them,\
    \ Objective-C makes both sets of techniques easily available at all times and\
    \ leaves it to developers to apply those technological options appropriately.\n\
    \nWith the right set of decisions, this third approach—Objective-C—makes it possible\
    \ to achieve best-of-breed performance and high levels of expressiveness and productivity.\
    \ However, with great power come great responsibility: Used wisely, it is also\
    \ possible to achieve expressiveness worse than C combined with speed faster than\
    \ Smalltalk. This book will give you the techniques to avoid the latter and the\
    \ former.\n\n# A Simple Example\n\nBut enough theory, let's see some actual code!\
    \ The task will be simple and purely CPU-bound: summing the integers from 1 to\
    \ 1,000. We will implement two Objective-C examples demonstrating the range of\
    \ styles and covering performance characteristics available with Objective-C and\
    \ Cocoa. In addition, we will look at the same example implemented in some programming\
    \ languages, which we'll use as reference points for the different Objective-C\
    \ styles.\n\nNote that this is not a method for computing the first $n$ integers.\
    \ In case, we would use the formula discovered by Gauss: $n(n+1)/2$.\n\nThe first\
    \ thing you notice when you look at the Objective-C program shown in Example 1.1\
    \ is that it looks like C. That's OK; Objective-C is a pure superset of C and\
    \ therefore any C program is also an Objective-C program. Type in the code shown\
    \ in Example 1.1 and save the file as `sumint_ex1.m`.\n\nExample 1.1 Sum integers\
    \ in Objective-C primitive types\n\n```\n#include <stdio.h>\n\nint main(int argc,\
    \ char *argv[])\n{\n    int i,sum;\n    sum=0;\n    for (i=1;i<=1000; i++) {\n\
    \        sum=i;\n    }\n```"
  merge: -1
  pgno: 21
- img_proc: true
  md: "```\n}\nreturn 0;\n}\n```\n\nWhen you compile the code in Example 1.1 using\
    \ cc -Os -Wall -o sumintc_excl sumintc_excl.m and then run it with time ./sumintc_excl,\
    \ you will notice that the runtimes are really fast, on the couple of milliseconds.\
    \ This is also to be expected, modern CPUs are extremely fast at simple integer\
    \ arithmetic, and the C program as translates directly to CPU instructions.\n\n\
    # The Perils of (Micro-)Benchmarking\n\nHowever, let's run a sanity check to see\
    \ if we're actually measuring something real. When you compile and run Example\
    \ 1.2, the program displays approximately the same time as Example 1.1.\n\nExample\
    \ 1.2 sanity check: an empty test program\n\n```\nint main(int argc, char *argv[])\
    \ {\n  return 0;\n}\n```\n\nWhat's going on here? There are actually several problems.\n\
    \n+   1. A modern optimizer notices that the result of the computation is not\
    \ used and that there are no side effects of the computation itself, and therefore\
    \ discards the computation.\n2. If it weren't able to discard the result, the\
    \ optimizer and will actually compute the result for this computation statically,\
    \ instead of generating code for the loop it just generates for the result.\n\
    3. The number of iterations is small enough, and CPUs fast enough, that total\
    \ running time is dominated by process start-up time; the actual running time\
    \ doesn't matter.\n\nIn order to get measurable results, we need to make a couple\
    \ of changes: First, we need to make the task larger so that we are actually measuring\
    \ it not process start-up overhead. We can do this by including an outer loop\
    \ that simply runs the actual loop we want to run a (large) number of times. Second,\
    \ we use the result, for example, by printing it to stdout. Note that both of\
    \ these requirements combine in a way that seems nonsensical at first: We reset\
    \ the sum variable to 0 every time\n\n* are the letters capital O and lowercase\
    \ s."
