  md: '# 212 Chapter 10 I/O: Principles


    Although this separation between virtual memory and (wired) buffers for file I/O
    initially seemed sensible, it had a number of drawbacks. First, the buffer cache
    size was usually fixed, so as main memories got larger you frequently had large
    amounts of unused RAM that could have been used for disk buffering. Second, with
    the introduction of the mmap() system call for mapping files directly into a process''s
    address space without read(), the distinction that was so clear before became
    blurrier. Moving data from the buffer cache to virtual memory not just incurred
    an extra copy, it could also lead to the same data residing in multiple caches,
    leading to more wasted space and extra copy operations.


    The solution arrived at all Unix distributions was the UBC, shown in Figure 10.3
    along the old pre-UBC state.


    With the UBC, the distinction between virtual memory operations and file I/O is
    erased. With buffered file I/O, both via mmap() and read() and write() goes via
    the virtual subsystem: first, the kernel creates a mapping from the filesystem
    object (usually a disk file) to a set of virtual memory pages. This set of pages
    is either mapped directly into the address space of the process in question in
    case of mmap(), with actual I/O operations initiated when pages are accessed,
    or in case of read() the kernel immediately initiates I/O and copies the data
    into the calling process''s address space it arrives.


    The advantages of the UBC are that it can and does all available RAM for buffering
    file I/O, and it eliminates duplicate copies in the case of memory-mapped files.
    These benefits are usually transparent, but the unified nature of the cache can
    cause problems at times. Since the UBC doesn''t really distinguish between file
    I/O and application paging, heavy file activity can cause the system to start


