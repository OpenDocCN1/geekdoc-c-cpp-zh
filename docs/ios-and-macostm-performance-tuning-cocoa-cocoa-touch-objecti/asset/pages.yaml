    A pen is a physical object moved by a hand; it can only move so far in a given
    amount of time. In 1/60th of a second, the time for one smooth animation, it can''t
    move very far at all. So only a small region of the screen can possibly change
    between frames, and only that small region needs to be redrawn.


    Our focus on CoreAnimation prevented us from seeing this issue because CoreAnimation
    only replaces the entire bitmap of a layer to be replaced at once. Both AppKit
