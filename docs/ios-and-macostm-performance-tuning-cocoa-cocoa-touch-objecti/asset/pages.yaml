    # Larger Examples


    The examples in the previous section are obviously microbenchmarks that may or
    not be indicative of real-world performance projects. With the language being
    young and still-in-flux as it is, the number of real-world projects with performance
    numbers is limited. At work, we''ve only had one Swift project so far, which we
    had to rewrite in Objective-C due to compatibility restrictions. For these reasons,
    I have to rely on outside sources for larger examples of Swift projects that actually
    measured performance.


    # nginx HTTP Parser


    One project was a port of the C HTTP parser included in the popular nginx HTTP
    server to Swift by Helge Hess, another former Apple employee. Despite the fact
    that performance was not the main purpose of the port, I expressed curiosity as
    to how the performance of the Swift port compared to the original to the fact
    that performance is nginx''s main selling point.


    Helge had as straightforward and as a 1:1 transliteration of the code as possible,
    though various features as macros and goto statements could not be mapped directly.
    Our expectation was that performance would be similar.


    Some fairly heavy-handed optimization @inline(_always) and UnsafeMutablePointer
    instead of Array improved performance to “only” 3 times slower, with most of the
    due to inlining, and most of the problems (both original and remaining) to ARC.


    This was using Swift 2.x; the 3.0 Swift betas were significantly slower.


    > 2. https://github.com/helge5/http-c-vs-swift'
