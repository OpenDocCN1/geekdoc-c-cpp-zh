    user interface. A high-level overview of the graphics APIs is shown in Figure
    14.1.


    The high-level toolkits provide a fairly large number of widgets such as checkboxes,
    tables, and editors. With few exceptions, the widgets are both sufficiently self-contained
    and sufficiently fast for responding within the thresholds discussed earlier,
    so performance is not a problem.


