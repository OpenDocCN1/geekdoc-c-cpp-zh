    # # Command-Line Tools


    As with CPU performance, the command line offers a number of performance tools
    that give quick and reasonably detailed information without much overhead or set-up
    work. Simple scripts also allow you to combine multiple commands in order to capture
    facets at the same time.


    # top


    We already presented top in the “top” section of Chapter 2 for CPU measurement
    and the many of the benefits are also true for its use in memory analysis. It
    gives you a continuously updated view of the system as well as some summary information
    for specific processes.


    The summary information that interests is me the most is the PhysMem line. It
    shows you how physical memory is actually being used at the system level, with
    parts wired, active, inactive, and free. Wired memory is memory that is in the
    kernel and cannot be swapped to disk; it resides permanently in real memory.


    Figure 6.1 Xcode built-in memory profiling'
