    Although Data and raw I/O are good for moving bytes between memory and devices,
    Objective-C applications will typically want to load and save objects or other
    structured data that is represented in memory as Objective-C. In principle, there
    are two options for accomplishing this: you can simply dump and load the internal
    representation, or you can serialize the internal representation into an external
    format. You can either serialize the data you want, or use one of the mechanisms
    built into Cocoa: property serialization or object archiving.


