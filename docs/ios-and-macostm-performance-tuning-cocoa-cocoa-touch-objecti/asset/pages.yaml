    # Arrays and Bulk Processing


    When dealing with a collection of entities accessed by index numbers, Foundation
    NSArray improves on C arrays (array[index]) with a number of convenient services:
    automatic handling of memory management (retain / release), automatic growth,
    sorting, searching, subarray generation, and a model that allows efficient addition
    and removal of objects at both ends of the array.


    What’s missing is a set of primitives such as float, double, or int with similar
    sets of values, as it should be clear now that wrapping the scalar values in NSNumber
    objects and sticking those in an NSArray will not perform particularly well. A
    wrapper is easy to write, and a number of them exist; for the author’s MPWRealArray,
    the arrays in FScript, or SMgleVector.


    As Figure 3.1 shows, the performance benefits of having a homogenous collection
    of scalars are overlapping: Summing the values in an array filled with 10000 is
    5 times faster than summing Numbers in an NSArray even if the individual numbers
    are accessed via a messages send, and 17 times faster than the array is asked
    to perform the operation in bulk.


    The differences are even more pronounced for creating such an array and filling
    it with the values from 1 to 10,000: The homogenous array is 20 times faster than
    creating the values as an NSArray of NSNumber, even when every real value is added
    inefficiently using a separate message send. Moving to bulk operations, where
    the loop is executed inside the array, takes the difference to a factor of 270.


    Better yet, processing the numbers as a C array of floats allows us to use the
    vector processing tools built into OS X such as vDSP. Using vDSP functions, summing
    the MPWRealArray code in Example 3.1 becomes another 10 times faster than the
    bulk processing, bringing the performance relative to the NSArray + NSNumber combination
    to 1.3 μs.'
