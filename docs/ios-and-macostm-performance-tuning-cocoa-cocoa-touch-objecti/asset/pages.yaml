    # Assessing Swift Performance


    With Apple not forthcoming on Swift''s actual performance characteristics, we
    have to take a look ourselves, tuning without at least some idea of what characteristics
    are in meaning. In the following, I will give an overview and an analysis of the
    current state of Swift performance and look at the highly compiler-centric model
    of optimization championed.


    # Basic Performance Characteristics


    We already saw some Swift performance characteristics in Chapter 1, for, the integer
    summation code in Examples 1.5 and 1.6.


    Performance when compiling with primitives and basic control flow is not too dissimilar
    to Objective-C, with an approximate 50% performance penalty, rising to roughly
    300% when objects were involved. To find out what the cause of this penalty was,
