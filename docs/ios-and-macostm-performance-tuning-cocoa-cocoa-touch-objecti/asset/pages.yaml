    # Graphics and UI: Pitfalls and Techniques


    Fast graphics programming is, in effect, an entire industry unto itself with many
    books of techniques and much more lore passed around online, so we can''t possibly
    cover it exhaustively nor even do it justice. For example, we will be taking a
    cursory glance at OpenGL. What we can look at techniques that work for non-game
    end-user applications using the regular graphics stacks.


    # Pitfalls


    For responsiveness, one of the biggest pitfalls is to perform long or unpredictable
    operations on the main thread. This includes all I/O, as we saw in the previous
    sections, even the smallest I/O operation can potentially take a long time. On
    the other hand, putting operations in the background without actually making the
    I/O responsive is even worse, and this is something I''ve quite seen a bit of:
    there is no spinning cursor and all the UIs operational, but nothing happens.
    In this case, being on the main thread is preferable as at least triggers the
    system-busy cursor, giving the user an indication of what is going on.


    For graphics, one of the biggest and most visible blunders is delivering graphics:
    having your assets prerendered and delivered as bitmaps. The likely most extreme
    example of this technique was the magazine apps were created using certain Adobe
    publishing tools for delivery on the iPad, with every page of the magazine rendered
    as a full-page bitmap, once for portrait and once for landscape. With I/O being
    the slowest part of the modern computer experience, over the (cellular) wireless
    and from disk, even if solid state, this was not exactly a stellar user experience.
    And when Retina displays came out, everything looked even more fuzzy instead of
    better.


    With the advent of high-resolution retina displays, anything that is artwork,
    so digitally generated, should probably be available as vector artwork, if it
    isn''t drawn'
