    is an instance of NSString, a CF variant of NSString. Creating a mutable copy
    creates a new object, whereas creating a copy of that creates a tagged pointer
    string because the string is only 5 characters long. All of this is implementation
    dependent, but the differences are relevant when looking at NSDictionary lookup
