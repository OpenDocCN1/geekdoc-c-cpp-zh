    # The Network Stack


    The main network stack on OS X and iOS deals with TCP/IP, the Transmission

    Control Protocol/Internet Protocol. Basic IP is packet oriented like most of the

    network hardware, but the widely used TCP provides the “stream of bytes"

    abstraction used throughout the rest of the Unix kernel. Most of the high-level

    protocols we use over the Internet today as HTTP and FTP are built on top of

    TCP’s stream abstraction, with the packet-oriented, unreliable User Datagram

    Protocol more widely used for broadcast and media applications.


    A naive implementation of a reliable, stream-oriented transport would be

    performance limited by the latency of the network, because receipt of packets
    has to

    be acknowledged. Fortunately, TCP is a very sophisticated protocol paired with

    eally sophisticated implementations. Significant amounts of buffering, sliding

    receipt windows, flow control, out-of-order retransmission, and so on, help TCP

    achieve throughput close to the available bandwidth in many situations without
    much

    help from the application programmer.


    However, establishing TCP connections is limited by network latency, and actually

    several round-trips, so care should be taken to minimize the number of'
