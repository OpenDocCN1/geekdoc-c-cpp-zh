    # The Power of Hybrids


    When Brad Cox created Objective-C, the choice of a hybrid language was very deliberate.
    In needing more performance than a pure Smalltalk could provide, two different
    purposes: one is implementing components (called “Software-ICs”) efficiently,
    largely in C, and the other is connecting those components together using dynamic
    message sending. This hybrid pattern can often be seen where high performance
    meets dynamic flexibility. One great example is the Unix shell, where filter components
    are written in C but hooked up dynamically using the shell. NumPy is popular for
    controlling numerical array processing written in C or C++ from Python, and at
    the high end, supercomputing centers use the string-binding language TC (generally
    slower than Ruby) to “steer” computations in their clusters.


    When performance problems occur in Objective-C, it is almost invariably because
    this hybrid pattern disregarded and Objective-C was treated as pure object-oriented
    language. As Table 1.1 shows, Objective-C is a very bad object-oriented language:
    It is slower than the pure object-oriented languages, with high rates of object
    creation, while delivering fewer features, being less crash resistant and a far
    less interactive programming environment.


    Objective-C is an awesome hybrid language, great for connecting grain objects
    with very fast and dynamic message passing. In addition to allowing the typical
    hybrid pattern of pre-fab components in a fast/static language connected by a
    flexible slower language, Objective-C also allows a more gradual approach that
    doesnt presuppose the bottlenecks will be. You may have noticed at some odd choice
    PostScript in the selection of languages to compare. The reason for this choice
    is that the particular PostScript interpreter is actually written in Objective-C.
    And not only is it written in Objective-C, it is written in a pure object-oriented
    fashion, with all PostScript objects (stacks, strings, matrices) mapped straight
    to Objective-C objects. Despite apparently creating the hybrid pattern and using
    a more pure object-oriented approach, it outperforms the industry-standard PostScript
    interpreter shipped with Mac OS X, which is written in straight C.


    The contradiction is only superficial. While Objective-C is a hybrid, it is a
    single hybrid language, with both parts reasonably well integrated. That means
    although you can take an approach in which you write your core in C or C++ and
    then layer it in Objective-C wrappers, you can actually take a more productive'
