    # NSCache and libcache


    A different type of cache was introduced by Apple in Snow Leopard, with the Cocoa
    NSCache class and the lower-level libcache library it is built on. NSCache is
    a key-value store similar to NSMutableDictionary, except that contents may be
    evicted from this dictionary if the system detects memory pressure. NSCache allows
    you to aggressively use as much available memory as possible for caching, while
    minimizing the chance of degrading system performance with that memory use—for
    example, causing undue memory pressure or in the worst case paging the caches
    to and from slow secondary storage.


    > Note that evicted means just that the object is removed from the cache (sent
    a release), not that the object is deallocated. This happens according to the
    normal memory management rules, so the object will only be deallocated if NSCache
    was holding the last reference—in essence, if no one else was using it.


    With a few minor caveats, you can use NSCache just like a NSMutableDictionary.
    Since objects can disappear, you need to retain the object until you''re done
    with it, perhaps by stashing it in an instance variable with a proper accessor.
    Conversely, just because an object is removed from an NSCache does not mean it
    will be released as it may be retained elsewhere.


    Since the eviction occurs asynchronously after the time you requested it before
    you can store it, the object is protected in transit using the retain + autorelease
    combination known from atomic read accessors. Unlike NSMutableDictionary, NSCache
    is safe and doesn''t copy its keys.


    Although you can use NSCache as a simple drop-in, it also allows you to exercise
    more control over your objects, if you can specify a maximum cost of the cache
    (for example, bytes used). If your cost is "1", you can limit the number of objects
    in cache.


    NSCache can also interact with its contents objects via the NSDiscardableContent
    protocol (as implemented by the NSPurgeData we discussed earlier), essentially
    a separate reference counting protocol that was probably necessary to make NSCache
    work with the tracing collector that was also introduced with version 10.6.


