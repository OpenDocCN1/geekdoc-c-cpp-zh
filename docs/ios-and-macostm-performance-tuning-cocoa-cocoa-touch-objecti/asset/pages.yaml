    is only 4 bytes, an 8-fold expansion. Similar numbers apply to the other primitive
    wrappers. An exception is NSNumber or CFNumber representing integers on the 64-bit
    runtime, as we explored in the "Primitive Types" section of Chapter 3. These are
    encoded in the object pointer and so don''t take up extra space.


