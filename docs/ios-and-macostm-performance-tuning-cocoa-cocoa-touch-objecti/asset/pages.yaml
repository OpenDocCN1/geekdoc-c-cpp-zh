    The reason for this memory growth is not an implementation flaw in the call-and-return
    architectural style. In this style, you call a function or method and it returns
    a result.³ Since that is the entire interaction, the result that has been returned
    is complete; there is no real concept of a partial result.


    When we need to compose these intermediate results into a final result, we need
    to first allocate enough memory to hold the combined results, then copy the partial
    results into the final result. Repeat this at each nesting level and you get a
    total complexity of O(m x n), where m is the nesting depth and n is the total
    size. In the (admittedly pathological) example given that the nesting depth equal
    the total size (m = n), that gives us the n² result that we measured.


    Fortunately, there is a fairly solution using a streaming approach, similar to
    what we saw with SAX for XML parsing, but simpler because we are generating instead
    of parsing. Instead of constructing complete partial results, we accumulate partial
    results into a shared buffer allocated at the start, passing that buffer in our
    methods of returning the result from the methods. The describeOn: method in Example
    7.6 implements this accumulator-based streaming design for NSArray. The remainder
    of the code it integrates with the current description protocol and exposes fastDescription
    which encapsulates setting up the accumulator.


