  md: "# More Integer Summing\n\nTo check the other end of the Objective-C performance\
    \ envelope, we maintain the sum as a Foundation object, \"NSNumber,\" as shown\
    \ in Example 1.4. The loop and loop counter are still plain, because Objective-C\
    \ does not have pure-oriented loops. We also decrease the outermost loop counter\
    \ by a factor of 100 for reasons that will soon become apparent.\n\nExample 1.4\
    \ Sum integers using objects to represent numbers\n\n```\n#import <Foundation/Foundation.h>\n\
    \nint main(int argc, char *argv[])\n{\n    int i,k;\n    NSNumber* sum = nil;\n\
    \    for (k=0;k<10000; k++) {\n        sum=@(0);\n        for (i=1;i<1000; i++)\
    \ {\n            sum=[sum intValue]+i];\n        }\n    }\n    NSLog(\"%@\",sum);\n\
    \    return 0;\n}\n```\n\nHow this program runs crucially depends on the runtime\
    \ selected using compiler flags. First, we need to add -framework Foundation in\
    \ order to compile and link against the Foundation framework that provides the\
    \ definition of the NSNumber class and the NSLog() function: cc -Wall -Os -m32\
    \ -o example1.4.m -framework Foundation. Selecting the 32-bit runtime using -m32\
