    # Summary


    This chapter began with the trivial example of making a word list parser, but
    we then picked up some speed and extended that to a lazy and flexible property
    list, finishing with an ultra-fast parser for comma-separated files and memory-mapped
    binary representation for public transportation.


    Very similar to what we saw in earlier chapters, we found that primitive data
    can be much more efficiently represented by C types rather than Foundation objects.
    On the other hand, messaging provides flexibility that is not easily achievable
    with C structures and function calls. This flexibility makes it possible for the
    object-oriented property list to cooperate with its client to directly target
    objects, avoiding costly temporary representations and making the architecture
    more oriented. The improvements are around 4x in memory and CPU time for both
    parsing and generation.


    Having an object-oriented parser also made it possible to create a subclass of
    the parser that creates arrays lazy. Lazy loading does not actually increase speed,
    but it makes possible to use property lists with almost arbitrarily large data
    sets without having to load the entire property list at once.


    Finally, the public transportation example made good on our claim Chapter 12 that
    binary representations can be mapped into memory are the tool of choice if you
    want to go fast. How? Over thousand times faster than an equivalent CoreData-based
    program for both querying and generating the data, with a roughly 10 times smaller
    on-disk footprint.


    Although these examples are obviously not applicable everywhere, and may be overkill,
    they should certainly be a good starting point for getting your I/O into shape.'
