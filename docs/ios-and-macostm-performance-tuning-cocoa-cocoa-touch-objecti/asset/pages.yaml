  md: "# Chapter 1 CPU: Principles\n\nthrough the inner loop, but then output the\
    \ value outside the outer loop. This is because we want to print the output just\
    \ once, but also don't want to change the nature of the task (such as summing\
    \ to a larger target value). Third, we make the parameters unavailable at compile\
    \ time, in this case by passing them in on the command line, and so we get the\
    \ slightly more verbose program shown in Example 1.3.\n\n# Example 1.3 Sum integers\
    \ avoiding benchmark removal by the optimizer\n\n```\n#include <stdio.h>\n#include\
    \ <stdlib.h>\n\nint main(int argc, char *argv[]) {\n    int i, k, sum;\n    int\
    \ limit=argc > 1 ? atoi(argv[1]) : 1000;\n    int step=argc > 2 ? atoi(argv[2])\
    \ : 1;\n    for (k=0;k<1000000; k++) {\n        sum=0;\n        for (i=1;i<= limit;i+=step)\
    \ {\n            sum+=i;\n        }\n    }\n    printf(\"%d\\n\", sum);\n    return\
    \ 0;\n}\n```\n\nOn my current machine, a Mid 2015 MacBook Pro 15-Inch with a 2.8-GHz\
    \ Intel Core i7 processor, yields a much more reasonable execution time of 0.238\
    \ s. As we scaled the result by doing 1 million iterations of the basic task,\
    \ we know it took 0.238 μs to execute. The one-time overhead that was completely\
    \ drowning out the task is not less than approximately 3% of the total execution\
    \ time and no longer significant. Increasing the loop counts by a factor of 10\
    \ as a cross-check results in execution times that are 10 times longer, so we\
    \ can now be reasonably confident we are measuring the right. That is not a one-time\
    \ thing; for example a future optimizer might figure out that the inner loop always\
    \ computes the result, and therefore it may only do one iteration of the outer\
    \ loop.\n\nAnother option would have been to compile without optimization using\
    \ the -O0 flag, but that would have been unrepresentative as most production code\
    \ will have optimizations on and turning them off this code around 6 times slower.\n\
    \n+   2. Capital O and number zero."
