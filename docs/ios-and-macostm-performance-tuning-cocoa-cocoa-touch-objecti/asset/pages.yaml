    ```

    task://container/2/id/3

    list://id/2/

    task://container/2/

    task://id/3

    ```


    URIs are structured. For example, the first URI in Example 17.2 refers to the
    task with the id 3 within the list with id 2. The second URI is the list object
    with id 2. The URI refers to just the task with id 3, without giving a list id.
    In our current implementation, that requires searching for that task in all lists.


    Storage is organized as a series of objects that act like little Web servers,
    except that they don''t use the HTTP protocol to communicate, but the ordinary
    Objective-C message protocol shown in Example 17.3. As you can see, the message'
