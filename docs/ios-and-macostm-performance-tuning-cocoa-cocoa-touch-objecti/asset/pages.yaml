    # Wunderlist 2


    Version 2 of Wunderlist was in many ways a wonderful product, and users generally
    loved it, but performance and stability were not its strong points. After I downloaded
    and launched it for the first time, it crashed immediately and consistently for
    a couple of times before finally stabilizing.


    The Mac and iOS clients used CoreData for their data model as well as for connecting
    UI components. We saw in Chapter 12, CoreData is OK for small amounts of data
    and simple use-cases with lax performance requirements. High performance with
    medium to large data sets is at challenging, and the team found they had to create
    even more elaborate and fragile workarounds to keep CoreData from blocking the
    main thread with I/O.


    # Overall Architecture


    The overall architecture of the Wunderlist 3 Objective-C clients is shown in Figure
    17.6. There is really not much special about this architecture. It has an in-memory
    model, which is initialized from a persistent (disk) store at start-up. The memory
    model is kept in sync with the UI (bi-directionally) and with the back end (also
    bi-directionally). We also keep the disk store in sync with the memory model,
    but there is no need to go in the other direction because the disk store is private
    to the application.


    However, it is exactly this simplicity that makes excellent performance possible:
    The boundaries between the different subsystems are clearly delineated and the
    division of responsibility is obvious. For example, neither the model objects
    not the


