    \ () or wrap it in anData for writing with one of the writeBytes... methods, making\
    \ sure to use the non-copying initializer (initWithBytesCopy...).\n\nThis technique\
    \ used to be popular. The early Microsoft Office formats such as .doc and .xls\
    \ were effectively dumps of the (fairy complicated) internal data structures.\
    \ This was great for performance, but is somewhat less than for interoperability,\
    \ you would need to either have or reverse-engineer Microsoft's internal data\
    \ structures in order to read and write the file format. It becomes tricky as\
    \ internal data representation changes, for example, due to different padding,\
    \ endianness, and the move from 16 to 32 to 64 bits\n\nThe Squeak system I earlier\
    \ solves most of these issues. It uses an image as primary storage, which is simply\
    \ a memory dump of the internal object. Memory is kept contiguous by the copying\
    \ garbage collector, the address of a saved image is stored, and it tries to use\
    \ the same address or adjusts all pointers in the image if it cannot allocate\
    \ memory at the same address. Endianness is reversed if necessary.\n\nThe results\
    \ are quite dear. The default Squeak image has around 1.2 million objects, it\
    \ only takes 200 ms to save those to a 23-MB image file, and adding our 1 million\
    \ SampleObject instances increases the space to 46 MB and the time to 500 ms.\n\
    \nHowever, the only problem they've solved is interoperability. Only other Squeak\
    \ systems can interpret image files, and an image has to save as a whole, so I\
    \ can save only my SampleObject instances by saving the entire image containing\
    \ those objects.\n\n# A Simple XML Format\n\nOne of the things we can do is create\
    \ our own format, and following in the steps of the new Office (MS and Open) and\
    \ iWork format, let's make it XML. A trivial example of the format can be seen\
