    # Summary


    This chapter introduced some of the major tools for measuring I/O performance.

    Unlike CPU and memory tools, however, they tend to not be enough to pinpoint

    exact locations of I/O performance problems, never mind root causes. Fortunately,

    they don''t have to; all we need is evidence that I/O is causing problems and
    enough

    information to form a usable working hypothesis.


    With a working hypothesis, we can create an experiment (i.e., make a code

    change) and then verify or reject the hypothesis by measuring the running time
    of

    the modified program. Rinse and repeat. We will see that method in action in the

    next chapter.'
