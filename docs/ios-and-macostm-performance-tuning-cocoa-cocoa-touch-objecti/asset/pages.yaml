  md: '# CPU: Pitfalls and Techniques


    Having had a look at the parameters driving performance and techniques for identifying
    slow code, let''s now turn to actual techniques for making code run fast. We will
    look at efficient object representations and ways for objects to communicate and
    access data. We will also examine streamlining computation. In all this, the objective
    will be to effectively combine the “Objective” and the “C” parts of Objective-C
    to achieve the desired balance between performance and encapsulation.


    In general, the basic idea is for objects to have C on the inside and messages
    on the outside, and for the objects themselves to be fairly coarse-grained, static
    entities. When following these principles, it is possible to start with a fully
    object-oriented implementation without worries, but with the knowledge that it
    will be possible to optimize away any inefficiencies. It is my experience that
    it is possible to achieve the performance of plain C, and sometimes even beyond.


    However, there are pitfalls that not only make an Objective-C program slow (slower
    than so-called scripting languages), but even can be obstacles to later optimization
    efforts. These pitfalls usually lie in library constructs that are easy to use
    but have hidden performance costs, that are not localized within a single object
    where they could be eliminated, but present in interfaces and therefore spread
    throughout the system and much harder to expose.


    The following will show different options for data representation, communication,
    and computation, along with their respective trade-offs in terms of coupling,
    cohesion, and performance.


    # Representation


    One of the primary tasks of a program, especially an object-oriented program,
    is to represent data. Due to the hybrid nature of the language, an Objective-C
    programmer has many options available for this task.


    Without any claims of completeness, structured data can be represented using a
    C struct, Objective-C object, or various forms of key-value stores, most prominently'
