  md: '# Network


    Physics also plays a large factor in network I/O, largely in the form of the speed
    of light, which determines the minimum time for a round-trip. This speed is not
    expected to change anytime soon, and we are already close enough to those limits
    that we can''t change much. In addition, network protocols such as TCP require
    several round-trips to negotiate a connection.


    So we are able to increase bandwidth, with Ethernet having gone from 10 Mbit/s
    to 10 GBit/s; latencies are going to remain constant. Additionally, we now have
    cellular networks to deal with, with much reduced bandwidth and also high latencies,
    sometimes in the millisecond range.


    # Operating System


    The operating system always plays an important role in allocating the resources
    that programs wish to use. However, whereas in the case of CPU and memory, the
    OS is involved in parceling out resource and lets the program go about its business.
    With I/O, every access is mediated via the OS. So although fundamental hardware
    capabilities are well, fundamental, the OS plays a much larger role.


    One of the functions of the OS is to provide a uniform interface for diverse hardware.
    For example, it simply doesn''t matter to the application program whether a "disk"
    is an actual rotating magnetic platter, several platters stacked on top of each
    other, a RAID array of devices, or solid-state flash memory—apart from the performance
    characteristics, that is. In addition to providing a uniform interface, the OS
    tries to provide I/O performance, primarily by caching, buffering, and batching
    I/O requests. Finally, it extends the uniform interface to interprocess communication
    such as networking using TCP/IP protocol.


    # Abstraction: Byte Streams


    The abstraction that the Unix operating system Mac OS is based on is a stream
    of bytes. This abstraction is usually not exactly what the program needs, which
    may deal with database records, lists of texts, or rows of pixels, to name file,
    nor is it the hardware products, for accessing these streams of bytes are will
    often be disk sectors or network packets.


    The basic methods for accessing these streams of bytes are the read() and write()
    system calls, which use file descriptors to identify the particular byte stream
    to access. File descriptors for disks or devices are obtained using the open()
    system call, for interprocess communication using the pipe() system call, and
    for network communications using some combination of the socket(), accept(), bind(),
    and connect() calls.


    The services and abstractions of the operating system come at a cost; for example,
    the user-space/kernel transition, Example 10.1 is a case in point.'
