  md: '# 10


    # I/O: Principles


    When Apple introduced the PowerMac G4, it was billed as the world’s first desktop
    supercomputer. Ken Bacheter once quipped that “a device for turning compute-bound
    problems into I/O-bound problems.” In a sense, all computers are supercomputers
    now, with today’s iPhones vastly outpacing a PowerMac G4, and with compute performance
    vastly outpacing I/O performance. In addition, the difference between access times
    (latency) and transfer speeds (bandwidth) that we saw with memory access is even
    more pronounced with I/O devices. Whereas the difference between latency and throughput
    is around 1:100 and more with I/O devices.


    # Hardware


    The fundamental performance characteristics of different types of I/O hardware
    are both significant and not something that can be abstracted away, unlike different
    access mechanisms, which are hidden behind uniform APIs. Storage needs to be provided
    either by rotating magnetic disk drives or solid-state flash disks, which connectivity
    is provided by different types of networks, from high-speed switched Ethernet
    to packet switched radio.


    # Disk Drives


    Although solid-state disks (SSD) are becoming increasingly popular, rotating media
    still has a large role in providing persistent storage for computer systems. A
    schematic of a disk is shown in Figure 10.1: a round platter is divided into concentric
    circles called tracks, which are in turn divided into sectors.


    A disk head is positioned over a particular track in order to read or write the
    data on that track. Transfer speed is a simple function of the rotational speed
    of the disk and the density of the recorded information, so in order to speed
    up a disk’s transfer speed, you either need to spin it faster or increase the
    recording density so that more information gets written or read during a revolution.'
