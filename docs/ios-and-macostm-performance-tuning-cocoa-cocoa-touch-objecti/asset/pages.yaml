    exists—for examples. Following this is a number indicating the operation took,
    in seconds. The number of digits after the decimal is so that digits show microseconds
    (0.000025 = 25 microseconds). If the process has been scheduled out, the time
    is followed by the letter W, otherwise there is a blank. Scheduling out means
    that the process was no longer running. For actual I/O to be performed data was
    not in the cache, and the process was put to sleep until the I/O completed. Finally,
    the last column is the process name, which in this case is always datamapping.

