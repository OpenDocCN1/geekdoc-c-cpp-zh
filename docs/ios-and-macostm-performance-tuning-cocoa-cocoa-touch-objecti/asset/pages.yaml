    # URIs and In-Process REST


    The underlying architectural model for the REST-model and the persistence store
    is In-Process REST, an adaptation of the REST architectural style for use within
    an application. All the entities are referred to via identifier that take on the
    role of URIs; in Wunderlist these are instances of the WObject class that encode
    an entity type, a container id, and object id. A container is the id of an enclosing
    object, for example, the id of the list that a task belongs to. Not all objects
    have an explicit container; for example, lists or the logged-in user are directly
    root objects. Example 17.2 shows a couple of WObjectReferences represented as
    string URIs.


