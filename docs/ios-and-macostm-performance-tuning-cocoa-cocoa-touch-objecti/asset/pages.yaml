    Although NSStrings are expensive, this is an expense well spent when the subject
    matter is human-readable text. Implementing Unicode handling is complex, error
    prone, and inherently expensive. In addition, the option of having multiple representations
    with a common interface is valuable, allowing string representations for different
    usage scenarios to be used interchangeably. For example, literal strings are represented
    by the NSString class that stores 8-characters, whereas the NSCFString class (backed
    by CFStringFoundation objects) stores 16-bit unchars internally. Subclasses could
    also introduce more sophisticated implementations as ropes, which store the string
    as a binary of smaller strings and can efficiently insert/delete into large strings.


    Starting with OS X 10.1, string objects on the 64-bit runtime also use the tagged
    pointer treatment for integers. This may seem odd, as strings are variable-length
    data structures, arrays of characters. However, 64 is quite a lot of bits, to
    store seven-bit characters and some additional identifying information as the
    length. In fact, when I first proposed pointer strings back in 2007, I also wanted
    7-bit ASCII strings, or an even tighter packing that governs most of control and
    special characters to use only 6 bits and have room for 9 characters. I don''t
    know if any of those are implemented.


