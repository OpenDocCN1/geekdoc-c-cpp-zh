  md: 'This hardware decoder is very fast for large images, but for small images the
    overhead is sufficiently high even that the fairly slow zlib/flate decompressor
    used for PNG is faster overall, and specialized software JPEG libraries like TurboJPEG
    can be several times faster.


    # Summary


    I hope this chapter demonstrated just how intricate measuring graphics performance
    can be. Apart from the complexities due to the number of subsystems involved,
    latencies of individual operations actually matter. We can''t just average lots
    of operations and get a meaningful result.


    However, there is also some hope—for example, the Mark 1 eyeball is a very good
    detection mechanism, particularly when coupled with a good electronic stopwatch
    (one with large mechanical buttons, not an iPhone). We actually used manual measurements
    as a crucial part of performance evaluation at Apple and successfully diagnosed
    problems down to one tenth of a second.


    In the next chapter, we will take a look at what to do when we find a problem.'
