  md: '# Chapter 5 Memory: Principles


    In addition, there is a size limit. For example, on my machine the main thread
    has a limit of 8 MB (see ulimit -a for the value on your machine), subsequent
    threads created by pthreads (including NSThread) are limited to a 512-KB stack.
    These are current values, no guarantees, with the upshot that large arrays or
    buffers should not be allocated on the stack.


    In fact, there is another reason for not allocating on the stack: When you return
    a call or a structure, the compiler copies you the calling function. Not so for
    arrays. When an array is represented in C, it doesn''t actually refer to the contents
    of the array. So if you return an array from a function, you are actually returning
    a pointer to the duplicated stack frame! Swift switches something differently:
    All collections are actually allocated on the heap, always, with a struct referencing
    the heap-allocated contents.


    Stack allocation is closely related to value semantics: The actual value or structure
    is allocated and manipulated. When a value is passed to another function, returned
    from a function, or inside another structure, the actual bits of that variable
    are copied to the new location.


    # Heap Allocation with malloc()


    Heap allocation, on the other hand, is manual: A function or method (in Swift
    constructor) must be called to allocate, and a different function is called to
    deallocate (there are different ways to automate this, see the “Resource Management”
    section in this chapter). Heap allocation is necessary if an allocation is to
    survive the scope of the function that created it. Heap allocation implies pointers
    and reference semantics, so you can have more than one reference to it. Objective-C
    and Swift objects have reference semantics and are allocated.


    User programs do not obtain memory (address space) directly from the operating
    system because a system call for any allocation would be too slow and the smallest
    allocation is a 4-KB OS page. The malloc package requests larger (multi-page)
    pools of memory from the OS and dems them to the user in smaller pieces using
    the functions malloc, calloc, and realloc. It is the user''s job to return memory
    to those pools using free.


