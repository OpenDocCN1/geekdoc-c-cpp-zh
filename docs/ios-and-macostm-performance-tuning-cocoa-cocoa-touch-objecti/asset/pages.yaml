    # Temporary Allocations and Object Caching


    As we see here and in the "Object Creation and Caching" section of Chapter 3,
    temporary objects can be a serious challenge for Objective-C programs. The buildup
    of temporary objects is both expensive in itself and can lead to considerable
    high growth, even if we''ve taken care to build n algorithms.


    Heap count can be controlled with nested autorelease pools or with the new @autoreleasepool
    compiler directive. The describeOn: method in Example 7.6 demonstrates this by
    wrapping every iteration of the loop that describes the contents of the array
