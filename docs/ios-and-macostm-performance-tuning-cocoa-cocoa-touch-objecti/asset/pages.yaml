    In fact, we find that after six simultaneous requests, the cumulative latency
    starts to slowly increase, whereas it held steady. The cumulative latency is the
    sum of the times of all the individual requests, so that individual requests are
    starting to take longer, even if the total time is still decreasing slightly.
    This is a sign that the network between the client and server has filled to capacity
    and is now congested, with all individual requests competing for bandwidth.


    Figure 12.9 demonstrates how piling more simultaneous transfers on a saturated
    channel only serves to lengthen the individual request times. An application tends
    to be more responsive when 10% of its requests have completed than all of its
    requests are at 10% complete.


    In addition, bombarding a server with many simultaneous transfers ties up per-request
    resources on the server, potentially causing resource starvation, dropped requests,
    or resource exhaustion and crashes on the server. On a slow network, you can also
    run into connection timeouts.


