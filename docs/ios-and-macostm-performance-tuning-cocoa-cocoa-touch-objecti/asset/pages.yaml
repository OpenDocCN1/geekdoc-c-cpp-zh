    # Serialization Summary


    Figure 12.15 summarizes how the different serialization mechanisms performed:
    of the Apple-provided mechanisms, the old-style archiver did the best, closely
    followed by all the property list-based mechanisms, with the new JSON (de-)serializer
    leading the pack, trailed by the keyed archiver. However, all except the old-style
    archiver were beaten badly by our little XML serializer, and none of them came
    close to matching the hardware.


    Figure 12.16 shows the sizes of the serialized representations, with the peak
    memory usage during serialization. The difference in memory consumption between
    the different serialization methods is even more pronounced than just the timings,
    whereas the on-disk size differs by around a factor of 2 at most.


    When dealing with large data sets, especially large numbers of objects, Apple
    currently does not have an adequate serialization mechanism, and the mechanism
    that Apple recommends most for large data sets is actually the one that is least
    suitable both in terms of time and memory used. The discrepancy is bad for deserialization
    than it is for serialization, with the argument that files are read lot more than
    they are written. With auto-save and versions, this may no longer be the case.


    It should be noted that Apple do not use any of these standard mechanisms for
    their Apple Productivity Apps Pages, Numbers, and Keynote (formerly known as iWork).
    Previous versions used an XML format via libxml2, but since iWork 13 the format
    switched to Google protocol buffers via a private framework.


