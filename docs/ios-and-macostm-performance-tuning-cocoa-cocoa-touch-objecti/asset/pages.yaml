    \ quickly. It also means adding extra code with potential bugs to the project,\
    \ whereas external tools keep the original code clean.\n\nIf your applications\
    \ log significant events using NSLog(), you are already doing some measurement\
    \ the logs produced by NSLog() have a millisecond-precision timestamp pre-pended.\
    \ If you have a log of application activity, you already know how long it took\
    \ to get from one of these significant events to another, in real (not CPU time).\
    \ Due to the coarse nature, lack of precision, and high overhead of this method,\
    \ in addition to the counter it might produce in the logs, it should not be used\
    \ for any performance monitoring. However, it can be extremely useful when all\
    \ you have a customer figsize.\n\nMore sophisticated measurement involves the\
    \ getrusage() system call to get actual CPU usage information from the operating\
    \ system, containing the same information used by the time and top commands, but\
    \ without the overhead of starting up a process example. Example 2.1 is a version\
    \ of the integer summation program from Chapter 1 amended with self-timing capabilities\
    \ via getrusage().\n\n# Example 2.1 Adding self-timing to the integer summer\n\
    \n```\n#import <Foundation/Foundation.h>\n\nlong long usmicros() {\n    struct\
    \ usage usage;\n    getrusage(RUSAGE_SELF, &usage);\n    return usage.ru_utime.tv_sec\
    \ * 1000000 + usage.ru_utime.tv_usec;\n}\n\nint main(int argc, char *argv[]) {\n\
    \    int i,k;\n    long start=usmicros();\n    NSNumber*sum=nil;\n    for (k=0;\
