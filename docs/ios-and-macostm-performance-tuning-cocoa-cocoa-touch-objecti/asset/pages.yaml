  md: '# Chapter 17 Graphics and UI: Examples


    The simplicity of the data store is helped by the fact that our back end consists
    of a loose federation of microservices that at best eventual consistency between
    different entities. This means that our consistency requirements are no more than
    the canonical store, so keeping the individual files consistent by passing YES
    to the NSD method writeFile:atomically is quite sufficient.


    All writes are asynchronous from the main thread; however, they are executed synchronously
    in a loop from a background thread responsible for the disk. The main thread just
    sends the URIs of objects it wishes to save to the background thread via a queue.
    When the background writer gets to the particular URI, it fetches the current
    up-to-date entry from the memory store and serializes it to disk.


    Since the disk writer always saves the most current version, multiple write requests
    can be coalesced by simply discarding duplicate write URIs from the queue. This
    helps minimize the load on the disk subsystem.


    # RESTOperation Queues


    In the previous section, I mentioned that write requests to the file writer are
    sent via a queue. This queue is a WLRESTOperationQueue, instances of which we
    use throughout the system to connect to asynchronously acting threads. They are,
    so to speak, the secret for keeping Wunderlist responsive at the same time interacting
    with the network and maintaining persistence.


    As the name suggests, a WLRESTOperationQueue consists of a Queue of REST operations,
    of which each is a WObjectReference coupled with a REST verb (GET, PUT, DELETE)
    that tells the target what it should do with the reference. What operation depends
    on the specific target. For the disk store, receiving a PUT means the objects
    specified by the URI should be saved to disk; for the Web interface it means to
    send an HTTP PUT to the back end.


    Each queue can be added to any thread and maintains its own worker thread that''s
    different from the service thread; for example, the main thread can optionally
    deliver results to a specified target thread. Compared to GCD, having a single
    worker thread per queue drastically reduces the number of threads with their corresponding
    resource consumption.


    WLRESTOperationQueue objects support coalescing by automatically rejecting duplicate
    entries. Getting this right depends on the entries in the queue only being present.
    It took some time to figure this out, with the WLRESTOperationQueue in its present
    form only appearing after a year of development.


    All the variants we tried with object pointers led to undesirable results (here
    with the example of writing to disk):


    +   Writing mutable objects to the queue and mutating them after they''ve been
    written has the object potentially being modified as it is being saved. That''s
    a'
