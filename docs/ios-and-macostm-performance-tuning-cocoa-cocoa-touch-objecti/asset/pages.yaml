  md: 'Resources that managed by the kernel, including processes, threads, file descriptors,
    or virtual memory pages themselves take some amount of wired kernel memory for
    the bookkeeping information maintained by the kernel, in addition to any memory
    used by the resources.


    Free memory is just that, currently unused and immediately available. The kernel
    usually tries to minimize the free memory in the system, from a small reserve,
    because free memory means an expensive resource is not being utilized.


    The active process is also easy; this memory is actively allocated to processes
    and, well, active use. It is with inactive memory that the kernel manages to minimize
    free memory: These are old mappings of files and caches and buffers that the kernel
    keeps around in case they may be needed again, but can free up in case active
    memory is required by the processes in the system.


    Another number to keep an eye on the paging rate in the VM, particularly the pageouts.
    If none inside the processes is nonzero, your system is currently swapping to
    disk. If you have sustained paging activity, you will typically get a noticeable
    slowdown in system and the disk activity, if you have a spinning disk drive rather
    than a solid-state drive.


    In the per-process lines, find the RPVVT and PRVVT lines most useful. RPVVT, the
    resident memory, is the actual amount of real memory in your process, and in most
    real-world situations most closely answer the question “How much memory is my
    program using?” previously discussed. That, until your process starts swapping,
    at which point RPVVT obviously becomes arbitrarily smaller and thus is no longer
    good for tracking your memory consumption.


    SIZE shows the amount of address space privately allocated to your process and
    is a good analog of memory when swapping. It does not seem to take into account
    freshly (zero-filled) address space or unmapped memory files, however. SIZE caches
    both of these, but also captures a lot of system-shared address space, which it
    is generally only useful as a relative metric


    Figure 6.2 shows the object-allocating version of the integer program from Chapter
    1 cours into its run. By using 254 MB of real, private memory within 266 MB of
    virtual address space. But we still have over 2 GB of physical memory available,
    so there is no danger of swapping (and pageouts are zero).


    Figure 6.3 shows how the program 12 s into it; real memory consumption is now
    734 MB, and it still tracks virtual memory, which has increased to 748 MB. We
    still have free memory, and both pageout counters are zero. So in all, we have
    a program that is rapidly consuming memory, but within the bounds of the system
    it is being run on.


