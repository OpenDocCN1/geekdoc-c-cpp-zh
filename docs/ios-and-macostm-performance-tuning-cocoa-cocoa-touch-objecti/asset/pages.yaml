    We''ve touched on streaming approaches before, for example, when looking at the
    effects of memory mapping or when comparing DOM-based XML parsers to those based
    on MAX.

    In the preceding chapter, we showed how to drastically lower memory consumption
    by changing the description method that returns an NSString to a streaming describeOn:
    method that updates NSMutableString passed into it as an argument.

    However, having the argument be NSMutableString seems to somewhat contradict our
    aim of having semantically rich objects, and also doesn''t solve the initial problem
    of infinite recursion causing a crash. It shouldn''t come as a surprise. In fact,
    we will briefly introduce an entire hierarchy of FilterStreams, which combine
    aspects of the Unix pipes-filters architectural style with object-oriented concepts
    such as polymorphism, incidentally solving the problem of infinite recursion in
    description.


    # Unix Pipes and Filters


    The Unix pipes and filters architecture is probably the best known architecture.
    It has at least two desirable properties: the filter components are interchangeable
    and can be processed incrementally, reading initial inputs and writing output
    units until processing is complete, as long as the semantics of the operation
    make it possible. It is also concurrent, with each filter processing data in its
    own process, highly optimized and untyped (which is a stream of bytes). A graphical
    representation of a two-stage pipeline is shown in Figure 8.1: the output from
    Filter 1 is connected to the input of Filter 2. In addition, the whole pipeline
    again has one input and one output, the meaning composed pipeline can act as a
    filter in another pipeline.


    However, the data operated on Unix filters are characters, which have to be parsed
    into meaningful units on input and regenerated from any internal'
