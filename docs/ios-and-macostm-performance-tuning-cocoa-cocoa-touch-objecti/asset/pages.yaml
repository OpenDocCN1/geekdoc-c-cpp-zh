    Table 3.5 shows the general cost of dictionary access, which is around 80 ns per
    read if you don''t hash collisions (when two or more keys map onto the same lot
    in the hash table). A single collision adds another 20 ns or so. The only time
    that deviates from the roughly 80 ns standard is when you have constant strings
    as the keys of the dictionary and the key to lookup. In this case, the lookup
    can be more than twice as fast, probably due to the fact that constant strings
    can be compared for equality using pointer equality instead of being.


    For small keys up to 7 characters, the tagged pointer optimization introduced
    in OS X 10.10 also helps. As with strings, pointer comparison is sufficient where
    the value is stored in the pointer, but only if both are of the same type, either
    tagged pointers or constant strings. Table 3.6 shows this effect: When the class
    match, constant strings and tagged pointer strings take around 22 ns for a single
    lookup, but there is no benefit if the classes do not match.


    In order to get optimized dictionary performance, you need to make sure that the
    class of the key used to store the value into the dictionary and the class of
    the key used to retrieve the value match. If a string literal ("key") was used
    to store the value, it is best to use another literal to retrieve.


