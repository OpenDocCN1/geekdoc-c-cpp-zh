  md: 'Due to the pretty amazing single-core performance of today’s CPUs, it turns
    out that the vast majority of CPU performance problems are not, in fact, due to
    limits of the CPU, but rather due to suboptimal organization.⁵ I hope the factors
    3 to 4, 10 to 20, and 100 to 1,000 of easily attainable performance improvements
    I have presented so far will convince you to at least give the code-tuning option
    consideration before joining multithreading, which at best can achieve a speedup
    to the number of cores in the system—and this is only for perfectly parallelizable,
    so-called "embarrassingly parallel" problems.


    ```

    S(N) = \frac{P}{(1-P) + \frac{P}{N}} \quad (3.1)

    ```


    Amdahl’s Law (Equation 3.1), relating the potential speedup $S$ due to parallelization
    with $N$ cores $(S(N))$ to the fraction of the program that can be parallelized
    $(P)$ that the benefit of newer cores gets over quickly when there are even small
    parts of the program that cannot be parallelized. So even with a very 90% parallelizable
    program, going from 2 to 4 cores gives 70% speedup, but going from 8 to 12 cores
    only another 21%. The maximum speedup with infinite number of cores is factor
    10. For a program that is 50% parallelizable, speedup with 2 cores is 33%, 4 cores
    60% and 12 cores 80%, approaching the limit of 2.


    While I cannot possibly do this topic here, it is worthy of at least a whole book
    by itself, I give some pointers on the specifics of the various multithreading
    mechanisms that have become available over the years, from `threads` via `NSThread`
    and `NSOperationQueue` all over to the most recent addition, Grand Central Dispatch
    (GCD).


    # Threads


    Threading on OS X is essentially built on a kernel-level implementation of POSIX
    threads (`threads`). These kernel threads are relatively expensive entities to
    manage, somewhat similar to Objective-C objects, which much more so. Running a
    function `my_computation(arg)` on a new POSIX thread via `pthread_create`, as
    in Example 3.22, turns around 7 $\mu$s to the overhead on my machine in addition
    to the cost of running `my_computation()` by itself, your computation needs to
    at least 7 $\mu$s to break even, and at least 70 $\mu$s to have a chance of getting
    the 90% parallelization (assuming we have a perfect distribution of tasks for
    all cores).


    Creating a new thread in Cocoa’s `NSThread` class method `+detachThreadSelector:`
    adds more than an order of magnitude of overhead to the task at, as does the `NSObject`
    convenience method `-performSelectorInBackground:`... (also Example 3.22).


