  md: '# Core Animation Instrument


    Probably the primary tool is the Core Animation instrument that''s part of Instruments,
    rather than a stand-alone tool like Quartz Debug. This integration can be extremely
    helpful because you can combine multiple instruments to correlate problems with
    possible root causes.


    15.4 shows a problem we saw with animation performance while developing Wunderlist
    3.


    The trace is for an iPhone 5; the dip in animation performance was far more noticeable
    on an A4. By focusing on the area with the dip in animation performance and switching
    to the CPU instrument, we were able to figure out what was happening—one of our
    routines performing a computation that was repeatedly calling valueForKeyPath
    to compute some counts. As you may recall from Chapter 3, using keyed accessing
    is orders slower than direct access or a message thread.


