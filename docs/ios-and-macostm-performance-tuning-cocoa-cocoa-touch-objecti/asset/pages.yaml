  md: "# Chapter 3 CPU: Pitfalls and Techniques\n\nFoundation's NSDictionary and CoreFoundation's\
    \ CF, which are both getting more and more use. Simple scalars can be represented\
    \ as C float, double, or int and their multitude of variations, Foundation NSInteger\
    \ and CoreGraphics CGFloat typedefs, and finally Foundation CFNumber objects.\
    \ Note that the naming conventions are a bit confusing: the names NSInteger and\
    \ NSNumber strongly suggest that these two types are related—but they are completely\
    \ unrelated. NSInteger being a specific subclass of NSNumber resolves to a 32-bit\
    \ int on 32-bit architectures and a 64-bit long on 64-bit architectures, whereas\
    \ int is 32 bits in both cases. Similar with CGFloat, which turns into a 32-bit\
    \ float on 32-bit architectures and a 64-bit double on 64-bit architectures. Example\
    \ 3.1 shows a few of the possible number representations.\n\n# Example 3.1 Numbers\
    \ as primitives and objects\n\n```\n#import <Foundation/Foundation.h>\n\nint main()\
    \ {\n    int a=1;\n    float b=2.0;\n    NSNumber *c=[NSNumber numberWithInt:3];\n\
    \    CFNumberRef d=CFNumberCreate(kCFAllocatorDefault,\n                     \
    \            CFNumberFloatType, (const void*)&b);\n\n    NSNumber *e=@0;\n   \
    \ NSLog(\"%a=%d %g c@ d@=% e@\",a,b,c,d,e\");\n    return 0;\n}\n```\n\nIn order\
    \ to get a good solution, the programmer must weigh trade-offs between decoupling\
    \ and encapsulation on one hand and performance on the other hand, ideally getting\
    \ as decoupling and encapsulation without compromising performance, or conversely\
    \ maximizing performance while minimizing coupling.\n\n# Primitive Types\n\nPossibly\
    \ the easiest to make is in the representation of simple scalar types like characters/bytes,\
    \ integers, and floating point numbers: use the built-in C primitives whenever\
    \ possible, and avoid objects whenever possible.\n\nWith the language supporting\
    \ them natively, scalars are convenient to use and perform anywhere from 10 to\
    \ 100 times better than their corresponding Foundation object NSNumber or its\
    \ CoreFoundation equivalent CFNumber.\n\nTable 3.1 gives the first three columns\
    \ are times for different arithmetic operations on scalar types. The differences\
    \ in timings for 32- and 64-bit addition and"
