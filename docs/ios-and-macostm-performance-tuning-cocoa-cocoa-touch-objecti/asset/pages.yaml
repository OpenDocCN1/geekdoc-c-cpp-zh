    # Methods


    Objective-C methods generally fall into two rough categories: lean and mean C
    data

    manipulation on one hand and high-level coordination using message sends on the

    other.


    For the data-manipulation operations, all the usual tricks in the C repertoire:

    moving operations out of loops (if there is no loop, how is the method

    taking?), strength reduction, use of optimized primitives such as the built-in

    memory copy functions or libraries like vdsort, and finding semantically

    equ cheaper replacements. Frankly, the compiler will help most of

    this optimization turned on. However, instead compiling the end-results of the

    loops, LLVM/clang managed to optimize away most of the simple loops from our

    benchmark programs unless we specified it.


    In order to keep data manipulation methods lean and mean, it is important to

    design the messaging interface appropriately, for example, passing all the data
    required

    to into the method in question, rather than having the method data in

    other sources.


    High-level coordination methods should generally not be executed very often and

    there do not require any optimization. In fact, I''ve had excellent

    performance results implementing such methods in interpreted scripting

    languages. A method triggering an animation last half second, for example, will

    take less than 0.2% of available time even if it takes a full millisecond to

    execute, which simply won''t be worth worrying about.


