    # Working with the Display Throttle


    While there are ways of working around the display throttle, games using OpenGL
    can get much higher rates, and it is better to actually take its fundamental lesson
    to heart: Status updates can happen more frequently than the users care to know
    about. For example, I measured NSUrlSessionTask its delegate methods, and it gave
    me status updates 273 times a second when downloading via a 6-MB/s DSL line.


    Not only am I confident that users don''t care about knowing their exact status
    273 times a second—certainly don''t often—actually you won''t be able to read
    a byte count that refreshed that often. For the byte count, a second is plenty,
    whereas progress bars might be slightly smoother if updated at a higher rate,
    around 10 times per second.


    I have far three techniques to avoid excessive UI refreshes, two of actually work.
    The first technique to be very good for essentially continuous progress monitoring,
    for example, of drawing or disk progress. It uses a timer running at 10 Hz that
    queries the progress and updates the display. Apart from smoothing and limiting
    progress display, this technique avoids model -> view communication, which is
    desirable from an architectural point of view. The drawback of the timer check
    is that the timers are to be started and stopped independently of the underlying
    operation.


    The second technique, update-request batching, although introducing explicit timers,
    does not manage to implement update-request batching is to store the update and
    then send a message to deliver the updates at a point in time, for example, 0.1
    s, a technique we demonstrated in Example 16.4 in the next section.


    The third technique I thought was being clever with performSelector:afterDelay:
    and canceling previous requests, and in fact I have seen this technique used many
    times. Alas, it doesn'' actually work, at least if there is enough load for the
    intervals to be shorter than the delay. In that case, we just keeping the cancelling
    of the update message until the updates stop coming.


