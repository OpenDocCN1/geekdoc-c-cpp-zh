  md: "# 156 Case Study: Data Structure Selection\n\nHow should you choose? The first\
    \ step is to think about the operations you will need to implement for each data\
    \ structure. For the prefixes, we need to be able to remove words from the beginning\
    \ and add to the end. For example, if the current prefix is \"Half a,\" and the\
    \ next word is \"bee,\" you need to be able to form the next prefix, \"a bee.\"\
    \n\nYour first choice might be a list, if not, it is easy to add and remove elements,\
    \ but we also need to be able to use the prefixes as keys in a dictionary, so\
    \ that rules out lists. With tuples, you can't append or remove, but you can use\
    \ the addition operator to form a new tuple:\n\n```\ndef shift(prefix, word):\n\
    \    return prefix[1:] + (word,)\n```\n\nshift takes a tuple of words, prefix,\
    \ and a string, and forms a new tuple that has all the words in prefix except\
    \ the first, and word added to the end.\n\nFor the collection of suffixes, the\
    \ operations we need to perform include adding a new suffix (increasing the frequency\
    \ of an existing one) and choosing a random suffix.\n\nAdding a new suffix is\
    \ equally easy for the list implementation or the histogram. Choosing a random\
    \ element from a list is easy; choosing from a histogram is harder to do efficiently\
    \ (see Exercise 13.7).\n\nSo far we have been talking about ease of implementation,\
    \ but there are other factors to consider in choosing data structures. One is\
    \ a runtime. Sometimes there is a theoretical reason to expect one data structure\
    \ to be faster than others; for example, I mentioned that the in operator will\
    \ be faster for dictionaries than for lists, at least when the number of elements\
    \ is large.\n\nBut often you don't know ahead of time which implementation will\
    \ be faster. One option is to implement both of them and see which is better.\
    \ benchmarking approach the data structure that is easiest to implement and see\
    \ if it is fast enough for the intended application. If so, there is no need to\
    \ go on. If not, there are tools, the profile module, that can identify the places\
    \ in a program that take the most time.\n\nThe other factor to consider is storage\
    \ space. For example, using a histogram for the collection of suffixes might take\
    \ less space because you only have to store each word once, no matter how many\
    \ times it appears in the text. In some cases, saving space can also make your\
    \ program run faster, and in the extreme, your program might not run at all if\
    \ you run out of memory. But for many applications, space is a secondary consideration\
    \ after runtime.\n\nOne final thought: in this discussion, I have implied that\
    \ we should use one data structure for both analysis and generation. But since\
    \ these are separate phases, it would also be possible to use one structure for\
    \ analysis and then convert to another"
