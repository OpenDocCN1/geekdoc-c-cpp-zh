  md: '# Python for Software Design


    Python for Software Design is a concise introduction to software design using
    the Python programming language. Intended for people with no programming experience,
    this book starts with the most basic concepts and gradually adds new material.
    Some of the students find most challenging, recursion and object-oriented programming,
    are divided into a sequence of smaller steps and introduced over the course of
    several chapters. The focus is on the programming process, with special emphasis
    on debugging. The book includes a wide range of exercises, from short examples
    to substantial projects, so that students have ample opportunity to practice each
    new concept.


    Exercise solutions and code examples along with Swampy, a suite of Python programs
    that is used in some of the exercises, are available from thinkpython.com.


    Allen B. Downey, Ph.D., is an Associate Professor of Computer Science at the Olin
    College of Engineering in Needham, Massachusetts. He has taught at Wellesley College,
    Colby College, and UC Berkeley. He has a doctorate in computer science from UC
    Berkeley and a master’s degree from MIT. Professor Downey is the author of a previous
    version of this book, titled *How to Think Like a Computer Scientist: Learning
    with Python*, which he self-published in 2001.'
