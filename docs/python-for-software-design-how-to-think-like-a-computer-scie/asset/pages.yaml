  md: "# Classes and Functions\n\nHere is a function that converts Times to integers:\n\
    \n```\ndef time_to_int(time):\n    minutes = time.hour * 60 + time.minute\n  \
    \  seconds = minutes * 60 + time.second\n    return seconds\n```\n\nAnd here is\
    \ the function that converts integers to Times (recall that divmod divides the\
    \ first argument by the second and returns the quotient and remainder as a tuple).\n\
    \n```\ndef int_to_time(seconds):\n    time = Time()\n    minutes, time.second\
    \ = divmod(seconds, 60)\n    time.hour, time.minute = divmod(minutes, 60)\n  \
    \  return time\n```\n\nYou might have to think a bit, and run some tests, to convince\
    \ yourself that these functions are correct. One way to test them is to check\
    \ that time_to_int(int_to_time(x)) == x for many values of x. This is an example\
    \ of a consistency check.\n\nOnce you are convinced they are correct, you can\
    \ use them to rewrite add_time:\n\n```\ndef add_time(t1, t2):\n    seconds = time_to_int(t1)\
    \ + time_to_int(t2)\n    return int_to_int(seconds)\n```\n\nThis version is shorter\
    \ than the original, and easier to verify.\n\n# Exercise 16.5\n\nRewrite increment\
    \ using time_to_int and int_to_time.\n\nIn some ways, converting from base 60\
    \ to base 10 and back is harder than just dealing with times. Base conversion\
    \ is more abstract; our intuition for dealing with time values is better.\n\n\
    But if we have the insight to treat times as base 60 and make the investment of\
    \ writing the conversion functions (time_to_int and int_to_time), we get a program\
    \ that is shorter, easier to read and debug, and more reliable.\n\nIt is also\
    \ easier to add features later. For example, imagine subtracting Times to find\
    \ the duration between them. The naive approach would be to implement subtraction\
    \ by borrowing. Using the conversion functions would be easier and more likely\
    \ to be correct."
