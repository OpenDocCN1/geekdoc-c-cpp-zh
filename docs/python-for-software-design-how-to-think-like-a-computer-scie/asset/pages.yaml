    # 1.2 WHAT IS A PROGRAM?


    A program is a sequence of instructions that specifies how to perform a computation.
    The computation might be mathematical, such as solving a system of equations or
    finding the roots of a polynomial, but it can also be a symbolic computation,
    such as searching for and replacing text in a document or (strangely enough) compiling
    a program.


    The details look different in different languages, but a few basic instructions
    appear in just every language:


    ```

    input: Get data from the keyboard, a file, or some other device.

    out: Display data on the screen or send data to a file or other device.

    math: Perform basic mathematical operations like addition and multiplication.

    conditional execution: Check for certain conditions and execute the appropriate
    sequence of statements.

    petition: Perform some action repeated, usually with some variation.

    ```


    Believe it or not, that''s pretty much all there is to it. Every program you''ve
    ever used, no matter how complicated, is made up of instructions that look pretty
    like these. So you can think of programming as the process of breaking a large,
    complex task into smaller and smaller subtasks until the subtasks are simple enough
    to be performed with one of these basic instructions.


    That may be a little vague, but we will come back to this topic when we talk about
    algorithms.


    # 1.3 WHAT IS DEBUGGING?


    Programming is error-prone. For whimsical reasons, programming errors are called
    bugs and the process of tracking them is called debugging.


    Three kinds of errors can occur in a program: syntax errors, runtime errors, and
    semantic errors. It is useful to distinguish between them in order to track them
    more quickly.


    # 1.3.1 Syntax Errors


    Python can only execute a program if the syntax is correct; otherwise, the interpreter
    displays an error message. Syntax refers to the structure of a program and the
    rules about that structure. For example, parentheses have to come in matching
    pairs, so (1 + 2) is legal, but 8) is a syntax error.


    In English, readers can tolerate most syntax errors, which is why we can read
    the poetry of e. e. cummings without spewing error messages. Python is not so
    forgiving.'
