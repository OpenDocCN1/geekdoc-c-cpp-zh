  md: '# Preface


    # THE STRANGE HISTORY OF THIS BOOK


    In January 1999, I was preparing to teach an introductory programming class in
    Java. I had taught three times and I was getting frustrated. The failure rate
    in the class was too high, and even for students who succeeded, the overall level
    of achievement was too low.


    One of the problems I saw was the books. I had tried three different books (and
    had a dozen more), and they all had the same problems. They were too big, with
    too much unnecessary detail about Java and not enough high-level guidance about
    how to program. And they all suffered from the trap door effect: they would start
    out easy, proceed gradually, and then somewhere around Chapter 4 the bottom would
    fall out. The students would get too much new material, too fast, and I would
    spend the rest of the semester picking up the pieces.


    Two weeks before the first day of classes, I decided to write my own book. I wrote
    one 10-page chapter a day for 13 days. I made some revisions on Day 14 and sent
    it out to be photocopied.


    My goals:


    +   - Keep it short. It is better for students to read 10 pages than not 50 pages.

    - Be careful with vocabulary. I tried to minimize the jargon and define each term
    at use.

    - Build gradually. To avoid trap doors, I took the most difficult topics and split
    them into a series of small steps.

    - Focus on programming, not the programming language. I included the minimum useful
    subset of Java and left out the rest.


    I needed a title, so on a whim I chose How to Think Like a Computer Scientist.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# xii Preface


    My first version was rough, but it worked. Students did the reading, and they
    understood enough that I could spend class time on the hard topics, the interesting
    topics, and (most important) letting the students practice.


    I released the book using the GNU Free Documentation License, which allows users
    to copy, modify, and distribute the book.


    What happened next is the cool part. Jeff Elkner, a high school teacher in Virginia,
    adopted my book and translated it into Python. He sent me a copy of his translation,
    and I had the unusual experience of learning Python by reading my own book.


    Jeff and I revised the book, incorporated a case study by Chris Myers, and in
    2001 we released How to Think Like a Computer Scientist: Learning with Python,
    also under the GNU Free Documentation License. As Green Tea Press, I published
    the book and selling hard copies through Amazon.com and college book stores. Other
    books from Green Tea are at greenteapress.com.


    In 2003, I started teaching at Olin College, and I went to teach Python for the
    first time. The contrast with Java was striking. Students struggled, learned more,
    worked on more interesting projects, and generally had a lot more fun.


    Over the last five years I have continued to develop the book, correcting errors,
    improving some of the examples, and adding material, especially exercises. In
    2008, I started work on a major revision of the book – at the same time, I was
    contacted by an editor at Cambridge University Press who was interested in publishing
    the next edition. Good timing!


    The result is this book, now with the last grandiose title Python for Software
    Design. Some of the changes are:


    +   - I added a section about debugging at the end of each chapter. These sections
    present general techniques for finding and avoiding bugs, and warnings about Python
    pitfalls.

    - I removed the material in the last few chapters about the implementation of
    lists and trees. I still love those topics, but I thought they were incongruent
    with the rest of the book.

    - I added more exercises, ranging from short tests of understanding to a few substantial
    projects.

    - I added a series of case studies – longer examples with exercises, solutions,
    and discussion. Some of them are based on Swampy, a suite of Python programs I
    wrote for in my classes. Swampy, code examples, and some solutions are available
    from thinkpython.com.

    - I expanded the discussion of program development plans and basic design patterns.

    - The use of Python is more idiomatic. The book is still about programming, not
    now I I think the book gets more leverage from the language.'
  merge: -1
