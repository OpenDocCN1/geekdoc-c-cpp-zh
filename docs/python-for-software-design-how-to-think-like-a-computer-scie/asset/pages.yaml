  md: "# 5.9 STACK DIAGRAMS FOR RECURSIVE FUNCTIONS\n\nIn Section 3.10, we used a\
    \ stack diagram to represent the state of a program during a function call. The\
    \ same kind of diagram can help interpret a recursive function.\n\nEvery time\
    \ a function gets called, Python creates a new function frame, which contains\
    \ the function's local variables and parameters. For a recursive function, there\
    \ might be more than one frame on the stack at the same time.\n\nThis figure shows\
    \ a stack diagram for countdown called with n=3:\n\n![](img/44821c0ec5bdef0746487da5f8ce59a6_71_0.png)\n\
    \nAs the usual, the top of the stack is the frame for __main__ . It is empty because\
    \ we did not create any variables in __main__ or pass any arguments to it.\n\n\
    The four countdown frames have different values for the parameter n. The bottom\
    \ of the stack, where n=0, is called the base case. It does not make a recursive\
    \ call, so there are no more frames.\n\n> A stack diagram for print_n called with\
    \ s = 'Hello' and n=2.\n\nWrite a function called do_n that takes a function object\
    \ and a number, n, as arguments, and that calls the given function n times.\n\n\
    # 5.10 INFINITE RECURSION\n\nIf a recursion never reaches a base case, it is on\
    \ making recursive calls forever, and the program never terminates. This is known\
    \ as infinite recursion, and it is generally not a good idea. There is a minimal\
    \ program with an infinite recursion:\n\n```\ndef recurse():\n    recurse()\n\
    ```\n\nIn most programming environments, a program with infinite recursion does\
    \ not really run forever. Python reports an error message when the maximum recursion\
    \ depth is reached:"
