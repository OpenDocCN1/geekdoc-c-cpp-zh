    # 13.10 DEBUGGING


    When you are debugging a program, especially if you are working on a hard bug,
    there are four things to try:


    +   * *reading*: Examine your code, read it back to yourself, and check that it
    says what you want to say.

    * *running*: Experiment by making changes and running different versions. Often
    if you display the right thing at the right place in the program, the problem
    becomes obvious, but sometimes you have to spend some time to build scaffolding.

    * *ruminating*: Take some time to think! What kind of error is it: syntax, runtime,
    semantic? What information can you get from the error messages, or from the output
    of the program? What kind of error could cause the problem you''re seeing? What
    did you change last, before the problem appeared?

    * *retreating*: At some point, the best thing to do is back off, undoing recent
    changes, until you get back to a program that works and you you understand. Then
    you can starting rebuilding.


    Beginning programmers sometimes get stuck on one of these activities and forget
    the others. Each activity comes with its own failure mode.


    For example, reading your code might help if the problem is a typographical error,
    but not if the problem is a misunderstanding. If you don''t understand what your
    program does, you can read it 100 times and never see the error, because the error
    is in your head.


    Running experiments can help, especially if you run small, simple tests. But if
    you run experiments without thinking or reading your code, you might fall into
    a pattern I call "random walk programming," which is the process of making random
    changes until the program does the right thing. Needless to say, random walk programming
    can take a long time.


    You have to take time to think. Debugging is like an experimental science. You
    should at least one hypothesis about what the problem is. If there are two or
    more possibilities, try to think of a test that would eliminate one of them.


    Taking a break helps with the thinking. Some do talking. If you explain the problem
    to someone else (or even yourself), you will sometimes find the answer before
    you finish the question.


    But even the debugging techniques will fail if there are too many errors, or if
    the code you are trying to fix is too big and complicated. Sometimes the best
    option is to retreat, simplifying the program until you get to something that
    works and you understand.'
