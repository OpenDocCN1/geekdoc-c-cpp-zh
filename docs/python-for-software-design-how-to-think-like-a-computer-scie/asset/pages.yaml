  md: '# The Way of the Program


    For example, when you hear the sentence “The penny dropped,” you understand that
    “the penny” is the subject and “dropped” is the predicate. Once you parsed a sentence,
    you can figure out what it means, or the semantics of the sentence. Assuming that
    you know what a penny is and what it means to drop, you will understand the general
    implication of this sentence.


    Although formal and natural languages have many features in common – tokens, structure,
    syntax, and semantics – there are some differences:


    +   * ambiguity: Natural languages are full of ambiguity, which people deal with
    by using contextual clues and other information. Formal languages are designed
    to be nearly or completely unambiguous, which means that any statement has exactly
    one meaning, regardless of context.

    * redundancy: In order to make for ambiguity and reduce misunderstandings, natural
    languages employ lot of redundancy. As a result, they are often verbose. Formal
    languages are less redundant and more concise.

    * literalness: Natural languages are full of idiom and metaphor. If I say, “The
    penny dropped,” there is probably no penny and nothing dropping.” Formal languages
    mean exactly what they say.


    People who grow up speaking a natural language – everyone – often have a hard
    time adjusting to formal languages. In some ways, the difference between formal
    and natural language is like the difference between poetry and prose, but more
    so:


    +   Poetry: Words are used for their sounds as well as their meaning, and the
    whole poem together creates an effect or emotional response. Ambiguity is not
    only common but often deliberate.

    Prose: The literal meaning of words is more important, and the structure contributes
    more meaning. Prose is more amenable to analysis than poetry but often ambiguous.

    Programs: The meaning of a computer program is unambiguous and literal, and it
    can be understood entirely by analysis of the tokens and structure.


    Here are some suggestions for reading programs (and other formal languages). First,
    remember that formal languages are much more dense than natural languages, so
    it takes longer to read them. Also, the structure is very important, so it is
    usually not a good idea to read from top to bottom, left to right. Instead, learn
    to parse the program in your head, identifying the tokens and interpreting the
    structure. Finally, the details matter. Small errors in spelling and punctuation,
    which you can get away with in natural languages, can make a big difference in
    a formal language.


