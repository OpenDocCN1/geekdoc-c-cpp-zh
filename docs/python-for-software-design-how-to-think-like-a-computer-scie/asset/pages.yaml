  md: "# 4.10 Debugging 43\n\nThis process has some drawbacks – we will see alternatives\
    \ later – but it can be useful if you don't know ahead of time how to divide the\
    \ program into functions. This approach lets you design as you go.\n\n# 4.9 DOCSTRING\n\
    \nA docstring is a string at the beginning of a function that explains the interface\
    \ (“doc”) is short for “documentation”). Here is an example:\n\n```\npolyline(t,\
    \ length, n, angle):\n    \"\"\"Draw line segments with the given length and\n\
    \    angle (in degrees) between them.  t is a turtle.\n    \"\"\"\n\nfor i in\
    \ range(n):\n    fd(t, length)\n    lt(t, angle)\n```\n\nThis docstring is a triple-quoted\
    \ string, also known as a multiline string because the triple quotes allow the\
    \ string to span than one line.\n\nIt is terse, but it contains the essential\
    \ information someone would need to use this function. It concisely explains what\
    \ the function does (without getting into the details of how it does). It explains\
    \ what each parameter has on the behavior of the function and what type each parameter\
    \ should be (if it is not obvious).\n\nWriting this kind of documentation is an\
    \ important part of interface design. A well-designed interface should be simple\
    \ to explain; if you are having a hard time explaining one of your functions,\
    \ that might be a sign that the interface could be improved.\n\n# 4.10 DEBUGGING\n\
    \nAn interface is like a contract between a function and a caller. The caller\
    \ agrees to provide parameters and the function agrees to do certain work.\n\n\
    For example, polyline requires four arguments. The first has to be a Turtle (or\
    \ some other object with fd and lt). The second has to be a number, and it should\
    \ probably be positive, although it turns out the works even if it isn't. The\
    \ third argument should be an integer; range complains otherwise (depending on\
    \ which version of Python you are using). The fourth has to be a number, which\
    \ is understood to be in degrees.\n\nThese requirements are called preconditions\
    \ because they are supposed to be true before the function starts executing. conditions\
    \ at the end of the function are preconditions. Preconditions include the intended\
    \ effect of the function (like drawing line segments) and any side effects (like\
    \ moving the Turtle or making changes in the World)."
