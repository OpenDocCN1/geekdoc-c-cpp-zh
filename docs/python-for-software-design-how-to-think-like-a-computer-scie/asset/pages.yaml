    # 10.2 LISTS ARE MUTABLE


    The syntax for accessing the elements of a list is the same as for accessing the
    char-acters of a string - the bracket operator. The expression inside the brackets
    specifies the index. Remember that the indices start at 0:


    ```

    >>> print cheeses[0]

    Cheddar

    ```


    Unlike strings, lists are mutable. When the bracket operator appears on the left
    side of an assignment, it identifies the element of the list that will be assigned.


    ```

    >>> numbers = [17, 123]

    >>> numbers[1] = 5

    >>> print numbers

    [17, 5]

    ```


    The one-eth element of numbers, which used to be 123, is now 5.


    You can think of a list as a relationship between indices and elements. This relation-ship
    is called a mapping; each index "maps to" one of the elements. Here is a state
    diagram showing cheeses, numbers and empty:


    ![](img/44821c0ec5bdef0746487da5f8ce59a6_123_0.png)


    Lists are represented by boxes with the word "list" outside and the elements of
    the list inside. cheeses refers to a list with three elements indexed 0, 1, and
    2. numbers contains two elements; the diagram shows the value of the second element
    has been reassigned from 123 to 5. empty refers to a list with no elements.'
