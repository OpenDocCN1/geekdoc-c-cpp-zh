  md: '# 5.13 Glossary 55


    where the problem was discovered, but the actual error might be earlier in the
    code, sometimes on a previous line.


    The same is true of runtime errors. Suppose you are trying to compute a signal-to-noise
    ratio in decibels. The formula is $SNR_{db} = 10 \log_{10}(P_{signal}/P_{noise})$.
    In Python, you might write something like this:


    ```

    import math

    signal_power = 9

    noise_power = 10

    ratio = signal_power / noise_power

    decibels = 10 * math.log10(ratio)

    print decibels

    ```


    But when you run it, you get an error message:


    ```

    Traceback (most recent call last):

    File "snr.py", line 5, in =

    decibels = 10 * math.log10(ratio)

    OverflowError: math range error

    ```


    The error message indicates line 5, but there is nothing wrong with that line.
    To find the real error, it might be useful to print the value of ratio, which
    turns out to be 0. The problem is in line 4, dividing two integers does floor
    division. The solution is to represent signal power and noise power with floating-point
    values.


    In general, error messages tell you where the problem was discovered, but that
    is often not where it was caused.


    # 5.13 GLOSSARY


    +   **base case**: A conditional branch in a recursive function that does not
    make a recursive call.


    +   **body**: The sequence of statements within a compound statement.


    +   **boolean expression**: An expression whose value is either True or False.


    +   **branch**: One of the alternative sequences of statements in a conditional
    statement.


    +   **chained conditional**: A conditional statement with a series of alternative
    branches.


    +   **comparison operator**: One of the operators that compares its operands:
    ==, !=, <, >, and <=.


    +   **compound statement**: A statement that consists of a header and a body.
    The header ends with a colon (:). The body is indented relative to the header.


    +   **condition**: The boolean expression in a conditional statement that determines
    which branch is executed.'
