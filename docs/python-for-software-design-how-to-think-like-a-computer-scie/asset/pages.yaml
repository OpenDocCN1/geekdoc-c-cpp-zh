    # 1.4 FORMAL AND NATURAL LANGUAGES


    Natural languages are the languages people speak, such as English, Spanish, and
    French. They were not designed by people (although people try to impose some order
    on them); they evolved naturally.


    Formal languages are languages that are designed by people for specific applications.
    For example, the notation that mathematicians use a formal language that is particularly
    good at denoting relationships between numbers and symbols. Chemists use a formal
    language to represent the chemical structure of molecules. And most importantly:


    Programming languages are formal languages that have been designed to express
    computations.


    Formal languages tend to have strict rules about syntax. For example, 3+3=6 is
    a syntactically correct mathematical statement, 3+3=6 is not. H2O is a syntactically
    correct chemical formula, but 2Zz is not.


    Syntax rules come in two flavors, pertaining to tokens and structure. Tokens are
    the basic elements of the language, such as words, numbers, and chemical elements.
    One of the problems with 3+=3=6 is that $ is not a legal token in mathematics
    (at least far as I know). Similarly, 2Zz is not legal because there is no element
    with the abbreviation Zr.


    The second type of syntax error pertains to the structure of a statement, that
    is, the tokens are arranged. The statement 3+=36 is illegal even though + and
    = are legal tokens, you can''t have one right after the other. Similarly, in a
    chemical formula the subscript comes after the element name, not before.


    # Exercise 1.1


    Write a well-structured English sentence with invalid tokens in it. Then write
    another with all valid tokens but invalid structure.


    When you read a sentence in English or in a formal language, you have to figure
    out what the structure of the sentence is (although in a natural language you
    do this subconsciously). This process is parsing.'
