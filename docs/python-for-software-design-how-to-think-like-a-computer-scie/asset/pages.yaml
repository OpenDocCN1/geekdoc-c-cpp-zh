  md: "# 7.3 The while Statement\n\nUpdating a variable by adding 1 is called an increment;\
    \ subtracting 1 is called a decrement.\n\n# 7.3 THE while STATEMENT\n\nComputers\
    \ are often used to automate repetitive tasks. Repeating identical or similar\
    \ tasks without making errors is something computers do well and people poorly.\n\
    \nWe have seen two programs, countdown and print_n, that use recursion to perform\
    \ repetition, which is also called iteration. Because iteration is so common,\
    \ Python provides several language features to make it easier. One is the for\
    \ statement we saw in Section 4.2. We’ll get back to that later.\n\nAnother is\
    \ the while statement. Here is a version of countdown that uses a while statement:\n\
    \n```\ndef countdown(n):\n    while n > 0:\n        print n\n        n = n-1\n\
    \    print 'Blastoff!'\n```\n\nYou can almost read the while statement as if it\
    \ were English. It means, “While n is greater than 0, display the value of n and\
    \ then reduce the value of n by 1. When you get to 0, display the word Blastoff!”\n\
    \nMore formally, this is the flow of execution for a while statement:\n\n+   (i)\
    \ Evaluate the condition, yielding True or False.\n(ii) If the condition is false,\
    \ exit the while statement and continue execution at the next statement.\n(iii)\
    \ If the condition is true, execute the body and then go back to step 1.\n\nThis\
    \ type of flow is called a loop because the third step loops back to the top.\n\
    The body of the loop should change the value of one or more variables so that\
    \ eventually the condition becomes false and the loop terminates. Otherwise the\
    \ loop will repeat forever, which is called an infinite loop. An endless source\
    \ of amusement for computer scientists is the observation that the directions\
    \ on shampoo, “Lather, rinse, repeat,” are an infinite loop.\n\nIn the case of\
    \ countdown, we can prove that the loop terminates because we know that the value\
    \ of n is finite, and we can see the value of n gets smaller each time through\
    \ the loop, so eventually we have to get to 0. In other cases, it is not so easy"
