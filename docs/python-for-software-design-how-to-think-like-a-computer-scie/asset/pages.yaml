  md: '# Classes and Objects


    The operator indicates that p1 and p2 are not the same object, which is what we
    expected. But you might have expected == to yield True because these points contain
    the same data. In that case, you will be disappointed to learn that for instances,
    the default behavior of the == operator is the same as the is operator; it checks
    object identity, not object equivalence. This behavior can be changed – we will
    see how later.


    If you use copy. to duplicate a Rectangle, you will find that it copies the Rectangle
    object but not the embedded Point.


    ```

    >>> box2 = copy.copy(box)

    >>> box2 is box

    False

    >>> box2.corner is box.corner

    True

    ```


    Here is what the object diagram looks like:


    ![](img/44821c0ec5bdef0746487da5f8ce59a6_197_0.png)


    This operation is called a shallow copy because it copies the object and any references
    it contains, but not the embedded objects.


    For most applications, this is not what you want. In this example, invoking grow_rectangle
    on one of the Rectangles would not affect the other, but invoking move_rectangle
    on either would affect both! This behavior is confusing and error-prone.


    Fortunately, the copy module contains a method named deepcopy that copies not
    only the object but also the objects it refers to, and the objects they refer,
    and so on. You will not be surprised to learn that this operation is called a
    deep copy.


    ```

    >>> box3 = copy.deepcopy(box)

    >>> box3 is box

    False

    >>> box3.corner is box.corner

    False

    ```


    box3 and box are completely separate objects.


    # Exercise 15.3


    Write a version of move_rectangle that creates and returns a new Rectangle instead
    of modifying the old one.'
