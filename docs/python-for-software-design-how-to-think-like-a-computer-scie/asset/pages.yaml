  md: '# 12.9 Debugging


    Lists are more common than tuples, mostly because they are mutable. But there
    are a few cases where you might prefer tuples:


    +   (i) In some contexts, like a return statement, it is syntactically simpler
    to create a tuple than a list. In other contexts, you might prefer a list.

    (ii) If you want to use a sequence as a dictionary key, you have to use an immutable
    type like a tuple or string.

    (iii) If you are passing a sequence as an argument to a function, using tuples
    reduces the potential for unexpected behavior due aliasing.


    Because tuples are immutable, they don''t provide methods like sort and reverse,
    which modify existing lists. But Python provides the built-in sorted and reversed,
    which take any sequence as a parameter and return a new list with the same elements
    in a different order.


    # 12.9 DEBUGGING


    Lists, dictionaries, and tuples are known generically as data structures; in this
    chapter we are starting to couple data structures, like lists of tuples, and dictionaries
    that contain tuples as keys and values. Compound data structures are useful, but
    they are prone to what I call shape errors; that is, errors caused when a data
    structure has the wrong type, size, or composition. For example, if you are expecting
    a list with one integer and I give you a plain old integer (not in a list), it
    won''t work.


    To help debug these kinds of errors, I have written a module called structshape
    that provides a function, also called structshape, that takes any kind of data
    structure as an argument and returns a string that summarizes its shape. You can
    download it from thinkpython.com/structshape.py


    Here''s the result for a simple list:


    ```

    >>> from structshape import structshape

    >>> t = [1,2,3]

    >>> print structshape(t)

    list of 3 int

    ```


    A fancier program might write "list of 3 ints," but it was not easier to deal
    with plurals. Here''s a list of lists:


    ```

    >>> t2 = [[1,2], [3,4], [5,6]]

    >>> print structshape(t2)

    list of 3 list of 2 int

    ```'
