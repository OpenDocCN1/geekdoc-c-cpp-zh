  md: "# 4.7 Refactoring\n\nRather than clutter the interface, it is better to choose\
    \ an appropriate value of n depending on circumference:\n\n```\ndef circle(t,\
    \ r):\n    circumference = 2 * math.pi * r\n    n = int(circumference / 3) + 1\n\
    \    length = circumference / n\n    polygon(t, n, length)\n```\n\nNow the number\
    \ of segments is (approximately) circumference / 3, so the length of each segment\
    \ is (approximately) 3, which is small enough that the circles look good, but\
    \ big enough to be efficient, and appropriate for any size circle.\n\n# 4.7 REFACTORING\n\
    \nWhen I wrote circle, I was able to re-use polygon because a many-sided polygon\
    \ is a good approximation of a circle. But arc is not cooperative: we can't use\
    \ polygon or circle to draw an arc.\n\nOne alternative is to start with a copy\
    \ of polygon and transform it into arc. The result might look like this:\n\n```\n\
    def arc(t, r, angle):\n    arc_length = 2 * math.pi * r * angle / 360\n    n =\
    \ int(arc_length / 3) + 1\n    step_length = arc_length / n\n    step_angle =\
    \ float(angle) / n\n```\n\n```\nfor i in range(n):\n    fd(t, step_length)\n \
    \   lt(t, step_angle)\n```\n\nThe second half of this function looks like polygon,\
    \ but we can't re-use polygon without changing the interface. We could generalize\
    \ polygon to take an angle as a third argument, but then polygon would no longer\
    \ be an appropriate name! Instead, let's call the more general function polyline:\n\
    \n```\ndef polyline(t, n, length, angle):\n    for i in range(n):\n        fd(t,\
    \ length)\n        lt(t, angle)\n```"
