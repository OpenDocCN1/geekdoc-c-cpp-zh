  md: "# A.2 Runtime Errors 25\n\nThe first step is to examine the place in the program\
    \ where the error occurred and see if you can figure out what happened. These\
    \ are some of the most common runtime\nerrors:\n\nNameError: You are trying to\
    \ use a variable that doesn't exist in the current environment. Remember that\
    \ local variables are local. You cannot refer to them from outside the function\
    \ where they are defined.\nTypeError: There are several possible causes:\n\n+\
    \   - You are trying to use a value improperly. Example: indexing a string, list,\
    \ or tuple with something other than an integer.\n- There is a mismatch between\
    \ the items in a format string and the items passed for conversion. This can happen\
    \ if either the number of items does not match or an invalid conversion is called\
    \ for.\n- You are passing the wrong number of arguments to a function or method.\
    \ For methods, look at the method definition and check that the first parameter\
    \ is self. Then look at the method invocation; make sure you are invoking the\
    \ method on an object with the right type and providing the other arguments correctly.\n\
    \nKeyError: You are trying to access an element of a dictionary using a key that\
    \ the dictionary does not contain.\nAttributeError: You are trying to access an\
    \ attribute or method that does not exist. Check the spelling! You can use dir\
    \ to list the attributes that exist.\n AttributeError indicates that an object\
    \ has NoneType, that means it is None. One common cause is forgetting to return\
    \ a value from a function; if you get to the end of a function without having\
    \ a return statement, it returns None. Another common cause is using the result\
    \ from a list method, like sort, returns None.\n\nIndexError: The index you are\
    \ using to access a list, string, or tuple is greater than its length minus one.\
    \ Immediately before the site of the error, add a print statement to display the\
    \ value of the index and the length of the array. Is the index right?\n\nThe Python\
    \ debugger (pdb) is useful for tracking down Exceptions which allows you to examine\
    \ the state of the program immediately before the error. You can read about at\
    \ docs.python.org/lib/module-pdb.html.\n\n# A.2.4 I Added so many print I Get\
    \ Inundated with Output\n\nOne of the problems with using print statements for\
    \ debugging is that you can end buried in output. There are two ways to proceed:\
    \ simplify the output or simplify the program.\n\nTo simplify the program, you\
    \ can remove or comment print statements that aren't helping, or combine them,\
    \ or format the output so it is easier to understand.\n\nTo simplify the program,\
    \ there are several things you can do. First, scale down the problem the program\
    \ is working on. For example, if you are searching a list, search"
