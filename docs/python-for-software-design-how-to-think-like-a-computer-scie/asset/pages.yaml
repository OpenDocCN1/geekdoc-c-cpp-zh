  md: "# 6.6 LEAP OF FAITH\n\nFollowing the flow of execution is one way to read programs,\
    \ but it can quickly become labyrinthine. An alternative is what I call the “leap\
    \ of faith.” When you come to a function call, instead of following the flow of\
    \ execution, *assume* the function works correctly and returns the result.\n\n\
    In fact, you are already practicing this leap of faith when you use built-in functions.\
    \ When you call `cos` or `exp`, you do not examine the bodies of those functions.\
    \ You just assume that they work because the people who wrote the built-in functions\
    \ were good programmers.\n\nThe same is true when you call one of your own functions.\
    \ For example, in Section 6.4, we wrote a function `is_divisible` that determines\
    \ whether one number is divisible by another. Once we have convincedced ourselves\
    \ that this function is correct – by examining the code and testing – we can use\
    \ the function without looking at the body again.\n\nThe same is true of recursive\
    \ programs. When you get to the recursive call, instead of following the flow\
    \ of execution, you should assume that the recursive call (yields the result)\
    \ and ask yourself, “Assuming that I can find the factorial of $n-1$, can I compute\
    \ the factorial of $n$?” In this case, it is clear that you can, by multiplying\
    \ by $n$.\n\nOf course, it’s a bit strange to assume that the function works correctly\
    \ when you haven't finished writing it, that’s why it’s a leap of faith!\n\n#\
    \ 6.7 ONE MORE EXAMPLE\n\nAfter factorial, the most common example of a recursively\
    \ defined mathematical function is fibonacci, which has the following definition:*\n\
    \n+   - fibonacci(0) = 0\nfibonacci(1) = 1\nfibonacci(n) = fibonacci(n-1) + fibonacci(n-2);\n\
    \nTranslated into Python, it likes like:\n\n```\ndef fibonacci(n):\n  if n ==\
    \ 0:\n    return 0\n  elif n == 1:\n    return 1\n  else:\n    return fibonacci(n-1)\
    \ + fibonacci(n-2)\n```\n\n> * See wikipedia.org/wiki/Fibonacci_number."
