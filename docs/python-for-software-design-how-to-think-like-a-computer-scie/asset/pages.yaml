  md: "# 5.8 Recursion 51\n\nThe execution of countdown begins with n = 3, and since\
    \ n is greater than 0, it outputs the value 3, and then calls itself...\n\nThe\
    \ execution of countdown begins with n = 2, and since n is greater than 0, it\
    \ outputs the value 2, and then calls itself...\n\nThe execution of countdown\
    \ begins with n = 1, and since n is greater than 0, it outputs the value 1, and\
    \ then calls itself...\n\nThe execution of countdown begins with n = 0, and since\
    \ n is not greater than 0, it outputs the word, “Blastoff!” and then returns.\n\
    \nThe countdown that got n = 1 returns.\n\nThe countdown that got n = 2 returns.\n\
    \nThe countdown that got n = 3 returns.\n\nAnd then you're back in __main__. So,\
    \ the total output looks like this:\n\n```\n3\n2\n1\nBlastoff!\n```\n\nA function\
    \ that calls itself is recursive; the process is called recursion.\n\nAs another\
    \ example, we can write a function that prints a string n times.\n\n```\ndef print_n(s,\
    \ n):\n    if n <= 0:\n        return\n    print s\n    print_n(s, n-1)\n```\n\
    \nIf n<=0 the return statement exits the function. The flow of execution immediately\
    \ returns to the caller, and the remaining lines of the function are not executed.\n\
    \nThe rest of the function is similar to countdown: if n is greater than 0, it\
    \ displays s and then calls itself to display s n−1 additional times. So the number\
    \ of lines of output is 1 + (n−1), which adds up to n.\n\nFor simple examples\
    \ like this, it is probably easier to use a for loop. But we will see examples\
    \ later that are hard to write with a for loop and easy to write with recursion,\
    \ so it is good to start early."
