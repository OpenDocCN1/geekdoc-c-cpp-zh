    # 13.8 MARKOV ANALYSIS


    If you choose words from the book at random, you can get a sense of the vocabulary,
    but you probably won''t get a sentence:


    > the small regard harriet which knightley''s it most things


    A series of random words seldom makes sense because there is no relationship between
    successive words. For example, in a real sentence you would expect an article
    like “the” to be followed by an adjective or a noun, and probably not a verb or
    adverb.


    One way to measure these kinds of relationships is Markov analysis, which characterizes,
    for a given sequence of words, the probability of the word that comes next. For
    example, the sample Eric, the Half Bee begins:


    > Half a, philosophically,

    Must, ipso facto, not half be.

    But half the bee has got to be

    Vis a, its entity. D''you see


    > But can a bee be said to

    Or to be an entire bee

    When the bee is not a bee

    Due to some ancient injury?


    In this text, the phrase “half the” is always followed by the word “bee,” but
    the phrase “bee” may be followed by “has” or “is.”


    The result of Markov analysis is a mapping from each prefix (like “half the” and
    “the bee”) to all possible suffixes (like “has” and “is”).'
