  md: '# 16.4 Prototyping Versus Planning


    The first line performs the basic operation; the remainder deals with the special
    cases we saw before.


    Is this function correct? What happens if the parameter seconds is much greater
    than sixty?


    In that case, it is not enough to carry once; we have to keep doing it until time.second
    is less than sixty. One solution is to replace the if statements with while statements.
    That would make the function correct, but not very efficient.


    # Exercise 16.3


    Write a correct version of increment that doesn’t contain any loops.


    Anything that can be done with modifiers can also be done with pure functions.
    In fact, some programming languages only allow pure functions. There is some evidence
    that programs that use pure functions are faster to develop and less error-prone
    than programs that use modifiers. But modifiers are convenient at times, and functional
    programs tend to be less efficient.


    In general I recommend you write pure functions whenever it is reasonable and
    resort to modifiers only if there is a compelling advantage. This approach might
    be called a functional programming style.


    # Exercise 16.4


    Write a "pure" version of increment that creates and returns a new Time object
    rather than modifying the parameter.


    # 16.4 PROTOTYPING VERSUS PLANNING


    The development plan I am demonstrating is called "prototype and patch." For each
    function, I write a prototype that performed the basic calculation and tested
    it, patching errors along the way.


    This approach can be effective, especially if you don''t have a deep understanding
    of the problem. But incremental corrections can generate code that is unnecessarily
    complicated – since it deals with many special cases – and unreliable – since
    it is hard to know if you have found all the errors.


    An alternative is planned development, in which high-level insight into the problem
    can make the programming much easier. In this case, the insight is that a Time
    object is really a three-digit number in base 60 (see wikipedia.org/wiki/Sexagesimal!).
    The second attribute is the "ones column," the minute attribute is the "sixty
    column," and the hour attribute is the "thirty-six hundreds column."


    When we add_time and increment, we were effectively adding in in base 60, which
    is why we had to carry from one column to the next.


    This observation suggests another approach to the whole problem – we can convert
    Time objects to integers and take advantage of the fact that the computer knows
    to do integer arithmetic.'
