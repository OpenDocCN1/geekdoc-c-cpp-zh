    It is not easy to define an algorithm. It might help to start with something that
    is not an algorithm. When you learned to multiply single-digit numbers, you probably
    memorized the multiplication table. In effect, you memorized 100 specific solutions.
    That kind of knowledge is not algorithmic.


    But if you were “lazy,” you probably cheated by learning a few tricks. For example,
    to find the product of n and 9, you can write n–1 as the first and 10–n as the
    second. This is a general solution for multiplying any single-digit number by
    9. That is an algorithm!


    Similarly, the techniques you learned for adding, subtraction with borrowing,
    and long division are all algorithms. One of the characteristics of algorithms
    is that they do not require any intelligence to carry out. They are mechanical
    processes in which each step follows from the last to a simple set of rules.


    In my opinion, it is embarrassing that humans spend so much time in school learning
    to execute algorithms that, quite literally, require no intelligence.


    On the other hand, the process of designing algorithms is interesting, intellectually
    challenging, and a central part of what we call programming.


    Some of the things people do naturally, without difficulty or conscious thought,
    are the hardest to express algorithmic. Understanding natural language is a good
    example. We do it, but so far no one has been able to explain how we do it, at
    least not in the form of an algorithm.


    # 7.7 DEBUGGING


    As you start writing bigger programs, you might find yourself spending more time
    debugging. More code means more chances to make an error and more places for bugs
    to hide.


    One way to cut your debugging time is “debugging by bisection.” For example, if
    there are 100 lines in your program and you check them one at a time, it would
    take 100 steps.'
