  md: '# Dictionaries


    The L at the end indicates that the result is a long integer,† or type long.


    Values with type int have a limited range; long integers can be arbitrarily big,
    as they get bigger they consume more space and time.


    The mathematical operators work on long integers, and the functions in the math
    module do, too, so in any code that works with int will also work with long.


    Any time the result of a computation is too big to be represented with an integer,
    Python converts the result as a long integer:


    ```

    >>> 1000 * 1000

    1000000

    >>> 100000 * 100000

    1000000000000L

    ```


    In the first case the result has type int; in the second case it is long.


    # Exercise 11.7


    Exponentiation of large integers is the basis of common algorithms for public-key
    encryption. Read the Wikipedia page on the RSA algorithm† and write functions
    to encode and decode messages.


    # 11.8 DEBUGGING


    As you work with bigger datasets it can become unwieldy to debug by printing and
    checking data by hand. Here are some suggestions for debugging large datasets:


    +   Scale down the input: For example if the program reads a text file, start
    with just the first 10 lines, or with the smallest example you can find. You can
    either edit the files themselves, or (better) modify the program so it only reads
    the n lines

    If there is an error you can reduce n to the smallest value that manifests the
    error, and then increase it as you find and correct errors.

    Check summaries and types: Instead of printing and checking the entire dataset,
    consider printing summaries of the data: for example, the number of items in a
    dictionary or the total of a list of numbers.

    A common cause of runtime errors is a value that is not the right type. For debugging
    this kind of error, it is often enough to print the type of a value.

    Self-checks: Sometimes you can write code to check for errors automatically. For
    example, if you are computing the average of a list of numbers, you could check
    that the result is not greater than the largest element in the list or less than
    the smallest. This is called a “sanity check” because it detects results that
    are “insane.”


    > † Python 3.0, type long is gone; all integers, even big ones, are type int.

    † wikipedia.org/wiki/RSA'
