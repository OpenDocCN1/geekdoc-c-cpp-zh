    \ can write this more concisely using tuple comparison:\n\n```\n# inside class\
    \ Card:\n    def __cmp__(self, other):\n        t1 = self.suit, self.rank\n  \
    \      t2 = other.suit, other.rank\n        return cmp(t1, t2)\n```"
