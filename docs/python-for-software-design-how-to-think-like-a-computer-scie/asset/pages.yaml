  md: "# 11.5 Memos 127\n\nTo understand why, consider this call graph for fibonacci\
    \ with n = 4:\n\n![](img/44821c0ec5bdef0746487da5f8ce59a6_146_0.png)\n\nA call\
    \ graph shows a set of function frames, with lines connecting each frame to the\
    \ frames of the functions it calls. At the top of the graph, fibonacci with n=4\
    \ calls fibonacci with n=3 and n=2. In turn, fibonacci with n=3 fibonacci with\
    \ n=2 and n=1. And so on.\n\nCount how times fibonacci(0) and fibonacci(1) are\
    \ called. This is an inefficient solution to the problem, and it gets worse as\
    \ the argument gets bigger.\n\nOne solution is to keep track of values that have\
    \ already been computed by storing them in a dictionary. A previously computed\
    \ value that stored for later use is called a memo. Here is an implementation\
    \ of fibonacci using memos:\n\n```\nknown = {0:0, 1:1}\n\ndef fibonacci(n):\n\
    \    if n in known:\n        return known[n]\n\nres = fibonacci(n-1) + fibonacci(n-2)\n\
    known[n] = res\nreturn res\n```\n\nknown is a dictionary that keeps track of the\
    \ Fibonacci numbers we already know. It starts with two items: 0 maps to 0 and\
    \ 1 maps to 1.\n\nWhenever fibonacci is called, it checks known. If the result\
    \ is already there, it can return immediately. Otherwise it has to compute the\
    \ new value, add it to the dictionary, and return it.\n\n> * Sec wikipedia.org/wiki/Memoization"
