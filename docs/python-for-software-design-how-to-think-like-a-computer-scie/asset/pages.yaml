    Write a Deck called deal_hands that takes two parameters, the number of hands
    and the number of cards per hand, and creates new Hand objects, deals the appropriate
    number of cards per hand, and returns a list of Hand objects.


    Inheritance is a useful feature. Some programs would be repetitive without inheritance
    can be written more elegantly with it. Inheritance can facilitate code reuse,
    you can customize the behavior of parent classes without having to modify them.
    In some cases, the inheritance structure reflects the natural structure of the
    problem, which makes the program easier to understand.


    On the other hand, inheritance can make programs difficult to read. When a method
    is invoked, it is not clear where to find its definition. The relevant code may
    be scattered among several modules. Also, many of the things that can be done
    using inheritance can be done as well or better without it.


    # 18.8 CLASS DIAGRAMS


    So far we have seen stack diagrams, which show the state of a program, and object
    diagrams, which show the attributes of an object and their values. These diagrams
    represent a snapshot in the execution of a program, so they change as the program
    runs.


    They are also highly detailed; for some purposes, too detailed. A class diagrams
    is a more abstract representation of the structure of a program. Instead of showing
    individual objects, it shows classes and the relationships between them.


    There are several kinds of relationship between classes:


    +   - Objects in one class may contain references to objects in another class.
    For example, each Rectangle contains a reference to a Point, and each Deck references
    to many Cards. This kind of relationship is HAS-A, as in, "a Rectangle has a Point."

    - One class may inherit from another. This relationship is IS-A, as in, "a Hand
    is a kind of the Deck."

    - One class may depend on another in the sense that changes in one class would
    require changes in the other.


    A class diagram is a graphical representation of these relationships.† For example,
    this diagram shows the relationships between Card, Deck, and Hand.


    > † The diagrams I am using here are similar to UML (see wikipedia.org/wiki/Unified_Modeling_Language),
    with a few simplifications.'
