  md: '# 222 Case Study Tkinter


    endrow ends this row of widgets, so subsequent widgets are packed in the column
    Frame. Gui.py keeps a stack of Frames:


    +   - When we use row, col, or gr to create a Frame, it goes on top of stack and
    becomes the current Frame.

    - When we use endow, endcol, or endgr to close a Frame, it gets popped off the
    stack and the previous Frame on the stack becomes the current Frame.


    The method run_file reads the contents of the Entry, it uses it as a filename,
    reads the contents and passes it to run_code. self.inter is an Interpreter object
    that knows how to take a string and execute it as Python code.


    ```

    def run_file(self):

    filename = self.en_file.get()

    fp = open(filename)

    source = fp.read()

    self.inter.run_code(source, filename)

    ```


    The last two widgets are a Text widget and a Button:


    ```

    self.te_code = self.te(width=25, height=10)

    self.te_code.insert(END, ''world.clear()\n'')

    self.te_code.insert(END, ''bob = Turtle(world)\n'')

    ```


    ```

    self.bu(text=''Run code'', command=self.run_text)

    ```


    run_text is similar to run_file except that it takes the code from the Text widget
    instead of a file:


    ```

    def run_text(self):

    source = self.te_code.get(1.0, END)

    self.inter.run_code(source, ''<user-provided code>'')

    ```


    Unfortunately, the details of widget layout are different in other languages,
    and in different Python modules. Tkinter alone provides three mechanisms for arranging
    widgets. These mechanisms are called geometry managers. The one I demonstrated
    in this section is the “grid” geometry manager; the others are called “pack” and
    “place.”


    Fortunately, most of the concepts in this section apply to other GUI modules and
    other languages.'
