  md: "# 17.2 Printing Objects\n\nNow there are two ways to call print_time. The first\
    \ (and less common) way is to use function syntax:\n\n```\n>>> Time.print_time(start)\n\
    09:45:00\n```\n\nIn this use of dot notation, Time is the name of the class, and\
    \ print_time is the name of the method. start is passed as a parameter.\n\nThe\
    \ second (and more concise) way is to use method syntax:\n\n```\n>>> start.print_time()\n\
    09:45:00\n```\n\nIn this use of dot notation, print_time is the name of the method\
    \ (again), and start is the method is invoked on, which is called the subject.\
    \ Just as the subject of a sentence is what the sentence is about, the subject\
    \ of a method invocation is what the method is about.\n\nInside the method, the\
    \ subject is assigned to the first parameter, so in this case is assigned to time.\n\
    \nBy convention, the first parameter of a method is called self, so it would be\
    \ common to write print_time like this:\n\n```\nclass Time(object):\n    def print_time(self):\n\
    \        print '%.2d:%2d:%2d%%' % (self.hour, self.minute, self.second)\n```\n\
    \nThe reason for this convention is an implicit metaphor:\n\n+   - The syntax\
    \ for a function call, print_time(start), suggests that the function is the active\
    \ agent. It says something, \"Hey print_time! Here's an object for you to print.\"\
    \n- Object-oriented programming, the objects are the active agents. A method invocation\
    \ like start.print_time() says \"Hey start! Please print yourself.\"\n\nThis change\
    \ in perspective might be polite, but it is not obvious that it is useful. In\
    \ the examples we have seen so far, it may not be. But sometimes shifting responsibility\
    \ from the functions onto the objects makes possible to write more versatile functions,\
    \ and makes it easier to maintain and reuse code."
