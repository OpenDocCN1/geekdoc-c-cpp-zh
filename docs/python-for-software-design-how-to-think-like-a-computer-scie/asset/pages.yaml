  md: "# Classes and Methods\n\nMethods are semantically the same as functions, but\
    \ there are two syntactic differences:\n\n+   - Methods are defined inside a class\
    \ definition in order to make the relationship between the class and the method\
    \ explicit.\n\n+   - The syntax for invoking a method is different from the syntax\
    \ for calling a function.\n\nIn the next sections, we will take the functions\
    \ from the previous chapters and transform them into methods. This transformation\
    \ is purely mechanical; you can do it simply by following a sequence of steps.\
    \ If you are comfortable converting from one form to another, you will be able\
    \ to choose the best form for whatever you are.\n\n# 17.2 PRINTING OBJECTS\n\n\
    In Chapter 16, we defined a class named Time and in Exercise 16.1, you wrote a\
    \ function named print_time:\n\n```\ndef print_time(time):\n    print '%.2d:%.2d:%.2d'\
    \ % (time.hour, time.minute, time.second)\n```\n\nTo call this function, you have\
    \ to pass a Time object as an argument:\n\n```\n>>> start = Time()\n>>> start.hour\
    \ = 9\n>>> start.minute = 45\n>>> start.second = 00\n>>> print_time(start)\n09:45:00\n\
    ```\n\nTo make print_time a method, all we have to do is move the function definition\
    \ inside the class definition. Notice the change in indentation.\n\n```\nclass\
    \ Time(object):\n    def print_time(time):\n        print '%.2d:%.2d:%.2d' % (time.hour,\
    \ time.minute, time.second)\n```"
