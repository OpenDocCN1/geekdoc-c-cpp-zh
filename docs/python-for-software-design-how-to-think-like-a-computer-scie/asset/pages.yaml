  md: '# 198 Classes and Methods


    This function also works for lists, tuples, and even dictionaries, as long as
    the elements of s are hashable, so they can be used as keys in d.


    ```

    >>> t = [''spam'', ''egg'', ''spam'', ''spam'', ''bacon'', ''spam'']

    >>> histogram(t)

    ''bacon'': 1, ''egg'': 1, ''spam'': 4

    ```


    Functions that can work with several types are called polymorphic. Polymorphism
    can facilitate code reuse. For example, the built-in function sum, which adds
    the elements of a sequence, as long as the elements of the sequence support addition.


    Since Time objects provide an add method, which they work with:


    ```

    >>> t1 = Time(7, 43)

    >>> t2 = Time(7, 41)

    >>> t3 = Time(7, 37)

    >>> total = sum([t1, t2, t3])

    >>> print total

    23:01:00

    ```


    In general, if all of the operations inside a function work with a given type,
    then the function works with that type.


    The best kind of polymorphism is the unintentional kind, where you discover that
    a function you already wrote can be applied to a type you never planned for.


    # 17.10 DEBUGGING


    It is legal to add attributes to objects at any point in the execution of a program,
    if you are a stickler for type theory, it is a dubious practice to have objects
    of the same type with different attribute sets. It is usually a good idea to initialize
    all of an object''s attributes in the init method.


    If you are not sure whether an object has a particular attribute, you can use
    the built-in function hasattr(see Section 15.7).


    Another way to access the attributes of an object is through the special attribute
    __dict__, which is a dictionary that maps attribute names (as strings) and values:


    ```

    >>> p = Point(3, 4)

    >>> print p.__dict__

    {''y'': 4, ''x'': 3}

    ```'
