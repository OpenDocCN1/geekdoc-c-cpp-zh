    # 12.10 GLOSSARY


    **data structure**: A collection of related values, often organized in lists,
    dictionaries,

    tu, etc.

    **DSU**: Abbreviation of “decorate-sort-underscore.,” a pattern that involves
    building

    a list of tuples, sorting, and extracting part of the result.

    **gather**: The operation of assembling a variable-length argument tuple.

    **scatter**: The operation of treating a sequence as a list of arguments.

    **shape (of a data structure)**: A summary of the type, size, and composition
    of a data

    structure.

    **tuple**: An immutable sequence of elements.

    **tuple assignment**: An assignment with a sequence on the right side and a tuple
    of

    variables on the left. The right side is evaluated and then its elements are assigned

    to the variables on the left.'
