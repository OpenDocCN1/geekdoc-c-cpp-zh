  md: "# Conditionals and Recursion\n\nThe outer conditional contains two branches.\
    \ The first branch contains a simple statement. The second branch contains another\
    \ if statement, which has two branches of its own. Those branches are both simple\
    \ statements, although they could have been conditional statements as well.\n\n\
    Although the indentation of the statements makes the structure apparent, nested\
    \ conditionals become quite difficult to read very quickly. In general, it is\
    \ a good idea to avoid them when you can.\n\nLogical operators often provide a\
    \ way to simplify nested conditional statements. For example, we can rewrite the\
    \ following code using a single conditional:\n\n```\nif 0 < x:\n    if x < 10:\n\
    \        print 'x is a positive single-digit number.'\n```\n\nThe print statement\
    \ is executed only if we make it past both conditionals, so we get the same effect\
    \ with the and operator:\n\n```\nif 0 < x and x < 10:\n    print 'x is a positive\
    \ single-digit number.'\n```\n\n# 5.8 RECURSION\n\nIt is legal for one function\
    \ to call another; it is also legal for a function to call itself. It may not\
    \ be obvious why that is a good thing, but it turns out to be one of the magical\
    \ things a program can do. For example, look at the following function:\n\n```\n\
    def countdown(n):\n    if n <= 0:\n        print 'Blastoff!'\n    else:\n    \
    \    print n\n        countdown(n-1)\n```\n\nIf n is 0 or negative, it outputs\
    \ the word, \"Blastoff!\" Otherwise, it outputs n and then calls a function named\
    \ countdown – itself – passing n - 1 as an argument.\n\nWhat happens if we call\
    \ this function like this?\n\n```\n>>> countdown(3)\n```"
