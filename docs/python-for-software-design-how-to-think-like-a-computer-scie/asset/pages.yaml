  md: '# The Way of the Program


    The goal of this book is to teach you to think like a computer scientist. This
    way of thinking combines some of the best features of mathematics, engineering,
    and natural science. Like mathematicians, computer scientists use formal languages
    to denote ideas (specifically computations). Like engineers, they design things,
    assembling components into systems and evaluating tradeoffs among alternatives.
    Like scientists, they observe the behavior of complex systems, and test predictions.


    The single most important skill for a computer scientist is **problem solving**.
    Problem solving means the ability to formulate problems, think creatively about
    solutions, and express a solution clearly and accurately. As it turns out, the
    process of learning to program is an excellent opportunity to practice problem-solving
    skills. That’s why this chapter is called “The way of the program.”


    On one level, you will be learning to program, a useful skill by itself. On another
    level, you will use programming as a means to an end. As we go along, that end
    will become clearer.


    # 1.1 THE PYTHON PROGRAMMING LANGUAGE


    The programming language you will learn is Python. Python is an example of a **high-level
    language**; other high-level languages you might have heard of C, C++, Perl, and
    Java.


    There are also **low-level languages**, sometimes referred to as “machine languages”
    or “assembly languages.” Loosely speaking, computers can only execute programs
    written in low-level languages. Programs written in a high-level language have
    to be processed before they can run. This extra processing takes some time, which
    is a small disadvantage of high-level languages.


    The advantages are enormous, however. First, it is much easier to program in a
    high-level language. Programs written in a high-level language take less time
    to write,'
