  md: 'This output format is also an input format. For example, you can create a new
    dictionary with three items:


    ```

    >>> eng2sp = {''one'': ''uno'', ''two'': ''dos'', ''three'': ''tres''}

    ```


    But if you print eng2sp, you might be surprised:


    ```

    >>> print eng2sp

    {''one'': ''uno'', ''three'': ''tres'', ''two'': ''dos''}

    ```


    The order of the key-value pairs is not the same. In fact, if you type the same
    example on your computer, you might get a different result. In general, the order
    of items in a dictionary is unpredictable.


    But that''s not a problem because the elements of a dictionary are never indexed
    by integer indices. Instead, use the keys to look up the corresponding values:


    ```

    >>> print eng2sp[''two'']

    ''dos''

    ```


    The key ''two'' always maps to the value ''dos'' so the order of the items doesn''t
    matter.


    If the key isn''t in the dictionary, you get an exception:


    ```

    >>> print eng2sp[''four'']

    KeyError: ''four''

    ```


    The len function works on dictionaries; it returns the number of key-value pairs:


    ```

    >>> len(eng2sp)

    3

    ```


    The in operator works on dictionaries; it tells you whether something appears
    as a key in the dictionary (appearing) as a value is not good enough.


    ```

    >>> ''one'' in eng2sp

    True

    >>> ''uno'' in eng2sp

    False

    ```'
