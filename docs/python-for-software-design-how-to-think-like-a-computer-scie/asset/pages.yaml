    it creates an empty tuple:


    ```

    >>> t = tuple()

    >>> print t

    ()

    ```


    If the argument is a sequence (string, list, or tuple), the result is a tuple
    with the elements of the sequence:


    ```

    >>> t = tuple(''lupins'')

    >>> print t

    (''l'', ''u'', ''p'', ''i'', ''n'', ''s'')

    ```


    Because tuple is the name of a built-in function, you should avoid using it as
    a variable name.

    Most list operators work on tuples. The bracket operator indexes an element:


    ```

    >>> t = (''a'', ''b'', ''c'', ''d'', ''e'')

    >>> print t[0]

    ''a''

    ```


    And the slice operator selects a range of elements.


    ```

    >>> print t[1:3]

    (''b'', ''c'')

    ```


    If you try to modify one of the elements of the tuple, you get an error:


    ```

    >>> t[0] = ''A''

    TypeError: object doesn''t support item assignment

    ```


    You can''t modify the elements of a tuple, but you can replace one tuple with
    another:


    ```

    >>> t = (''A'',) + t[1:]

    >>> print t

    (''A'', ''b'', ''c'', ''d'', ''e'')

