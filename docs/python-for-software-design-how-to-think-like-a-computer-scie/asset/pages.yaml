  md: "# 60 Fruitful Functions\n\nOn the other hand, temporary variables like temp\
    \ often make debugging easier. Sometimes it is useful to have multiple return\
    \ statements, one in each branch of a conditional:\n\n```\ndef absolute_value(x):\n\
    \    if x < 0:\n        return -x\n    else:\n        return x\n```\n\nSince these\
    \ return statements are in an alternative conditional, only one will be executed.\n\
    \nAs soon as a return statement executes, the function terminates without executing\
    \ any subsequent statements. Code that appears after a return statement, or any\
    \ other place the flow of execution can never be reached, is dead code.\n\nIn\
    \ a fruitful function, it is a good idea to ensure that every possible path through\
    \ the program hits a return statement. For example:\n\n```\ndef absolute_value(x):\n\
    \    if x < 0:\n        return -x\n    if x > 0:\n        return x\n```\n\nThis\
    \ function is incorrect if x happens to be 0, neither condition is true, and the\
    \ function ends without hitting a return statement. If the flow of execution gets\
    \ to the end of a function, the return value is None, which is not the absolute\
    \ value of 0.\n\n```\n>>> print absolute_value(0)\nNone\n```\n\nBy the way, Python\
    \ provides a built-in function called abs that computes absolute values.\n\n#\
