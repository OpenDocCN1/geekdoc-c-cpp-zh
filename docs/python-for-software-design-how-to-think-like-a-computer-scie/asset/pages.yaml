    # 10.4 LIST OPERATIONS


    The + operator concatenates lists:


    ```

    >>> a = [1, 2, 3]

    >>> b = [4, 5, 6]

    >>> c = a + b

    >>> print c

    [1, 2, 3, 4, 5, 6]

    ```


    Similarly, the * operator repeats a list a given number of times:


    ```

    >>> [0] * 4

    [0, 0, 0, 0]

    >>> [1, 2, 3] * 3

    [1, 2, 3, 1, 2, 3, 1, 2, 3]

    ```


    The first example repeats [0] four times. The second example repeats the list
    [2, 3] three times.


    # 10.5 LIST SLICES


    The slice operator also works on lists:


    ```

    >>> t = [''a'', ''b'', ''c'', ''d'', ''e'', ''f'']

    >>> t[1:3]

    [''b'', ''c'']

    >>> t[:4]

    [''a'', ''b'', ''c'']

    >>> t[3:]

    [''d'', ''e'', ''f'']

    ```


    If you omit the first index, the slice starts at the beginning. If you omit the
    second, the slice goes to the end. If you omit both, the slice is a copy of the
    whole list.'
