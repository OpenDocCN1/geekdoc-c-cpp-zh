    \ is to use recursion:\n\n```\ndef is_abecedarian(word):\n    if len(word) <=\
    \ 1:\n        return True\n    if word[0] > word[1]:\n        return False\n \
    \   return is_abecedarian(word[1:])\n```\n\nAnother option is to use a while loop:\n\
    \n```\ndef is_abecedarian(word):\n    i = 0\n    while i < len(word)-1:\n    \
    \    if word[i+1] < word[i]:\n            return False\n        i = i+1\nreturn\
    \ True\n```\n\nThe loop starts at i=0 and ends when i=len(word)-1. Each time through\
    \ the loop, it compares the ith character (which you can think of as the current\
    \ character) to the i+1th character (which you can think of as the next)."
