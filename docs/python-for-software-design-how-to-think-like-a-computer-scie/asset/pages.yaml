  md: "# Fruitful Functions\n\nIf you try to follow the flow of execution here, even\
    \ for fairly small values of n, your head explodes. But according to the leap\
    \ of faith, if you assume that the two recursive calls work correctly, then it\
    \ is clear that you get the right result by adding them together.\n\n# 6.8 CHECKING\
    \ TYPES\n\nWhat happens if we call factorial and give it 1.5 as an argument?\n\
    \n```\n>>> factorial(1.5)\nRuntimeError: Maximum recursion depth exceeded\n```\n\
    \nIt looks like an infinite recursion. But how can that be? There is a base case\
    \ – when n=0. But if n is not an integer, we can miss the base case and recurse\
    \ forever.\n\nIn the first recursive call, the value of n is 0.5. In the next,\
    \ it is –0.5. From there, it gets smaller (more negative), but it will never be\
    \ 0.\n\nWe have two choices. We can try to generalize the factorial function to\
    \ work with floating-point numbers, or we can make factorial check the type of\
    \ its argument. The first option is called the gamma function† and it's a little\
    \ below the scope of this book. So we will go for the second.\n\nWe can use the\
    \ built-in function instanceance to verify the type of the argument. While we're\
    \ at it, we can also make sure the argument is positive:\n\n```\ndef factorial\
