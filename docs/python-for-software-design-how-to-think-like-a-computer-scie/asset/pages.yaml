  md: "avoids is a more general version of has_no_e but it has the same structure:\n\
    \n```\ndef avoids(word, forbidden):\n    for letter in word:\n        if letter\
    \ in forbidden:\n            return False\nreturn True\n```\n\nWe can return False\
    \ as soon as we find a forbidden letter; if we get to the end of the loop, we\
    \ return True.\nuses_only is similar except that the sense of the condition is\
    \ reversed:\n\n```\ndef uses_only(word, available):\n    for letter in word:\n\
    \        if letter not in available:\n            return False\n```\n\nInstead\
    \ of a list of forbidden words, we have a list of available words. If we find\
    \ a letter that is not in available, we can return False.\nuses_all is similar\
    \ except that we reverse the role of the word and the string of letters:\n\n```\n\
    def uses_all(word, required):\n    for letter in required:\n        if letter\
    \ not in word:\n            return False\n```\n\nInstead of traversing the letters\
    \ in word, the loop traverses the required letters. If any of the required letters\
    \ do not appear in the word, we can return False.\nIf you were really thinking\
    \ like a computer scientist, you would have recognized that uses_all was an instance\
    \ of a previously solved problem, and you would have written as:\n\n```\ndef uses_all(word,\
    \ required):\n    return uses_only(required, word)\n```"
