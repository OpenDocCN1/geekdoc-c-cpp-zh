  md: "# Case Study: Interface Design\n\nThis draws a 7-sided polygon with side length\
    \ 70. If you have more than a few numeric arguments, it is easy to forget what\
    \ they are, or what order they should be in. It is legal, and sometimes helpful,\
    \ to include the names of the parameters in the argument list:\n\n```\npolygon(bob,\
    \ n=7, length=70)\n```\n\nThese are called keyword arguments because they include\
    \ the parameter names “keywords” (not to be confused with Python keywords like\
    \ while and def).\nThis syntax makes the program more readable. It is also a reminder\
    \ about how arguments and parameters work: when you call a function, the arguments\
    \ are assigned to the parameters.\n\n# 4.6 INTERFACE DESIGN\n\nThe next step is\
    \ to write circle, which takes a radius, r, as a parameter. Here is a simple solution\
    \ that uses polygon to draw a 50-sided polygon:\n\n```\ndef circle(t, r):\n  \
    \  circumference = 2 * math.pi * r\n    n = 50\n    length = circumference / n\n\
    \    polygon(t, n, length)\n```\n\nThe first line computes the circumference of\
    \ a circle with radius r using the formula 2π. Since we use math.pi, we have to\
    \ import math. By convention, statements are usually at the beginning of the script.\n\
    \nn is the number of line segments in our approximation of a circle, so length\
    \ is the length of each segment. Thus, polygon draws a 50-sided polygon that approximates\
    \ a circle with radius r.\n\nOne limitation of this solution is that n is a constant,\
    \ which means that for very big circles, the line segments are too long, and for\
    \ small segments, we waste time drawing very small segments. One solution would\
    \ be to generalize the function by taking n as a parameter. This would give the\
    \ user (whoever calls circle) more control, but the interface would be less clean.\n\
    \nThe interface of a function is a summary of how it is used: what are the parameters?\
    \ What does the function do? And what is the return value? An interface is “clean”\
    \ if it is “as simple as possible, but not simpler (Einstein).”\n\nIn this example,\
    \ r belongs in the interface because it specifies the circle to be drawn. n is\
    \ less appropriate because it pertains to the details of how the circle should\
    \ be rendered."
