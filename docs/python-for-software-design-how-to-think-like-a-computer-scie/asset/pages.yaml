  md: '# Classes and Methods


    # 17.1 OBJECT-ORIENTED FEATURES


    Python is an object-oriented programming language, which means that it provides
    features that support object-oriented programming.


    It is not easy to define object-oriented programming, but we have already seen
    some of its characteristics:


    +   - Programs are made up of object definitions and function definitions, and
    most of the computation is expressed in terms of operations on objects.

    - Each object definition corresponds to some object or concept in the real world,
    and the functions that operate on that object correspond to the ways real-world
    objects interact.


    For example, the Time class defined in Chapter 16 corresponds to the ways people
    record the time of day, and the functions we defined correspond to the kinds of
    things people do with times. Similarly, the Point and Rectangle classes correspond
    to the mathematical concepts of a point and a rectangle.


    So far, we have not taken advantage of the features Python provides to support
    object-oriented programming. These features are not strictly necessary; most of
    them provide alternative syntax for things we have already done. But in many cases,
    the alternative is more concise and more accurately conveys the structure of the
    program.


    For example, in the Time program, there is no obvious connection between the class
    definition and the function definitions that follow. With some examination, it
    is apparent that every function takes at least one Time object as an argument.


    This observation is the motivation for methods; a method is a function that is
    associated with a particular class. We have seen methods for strings, lists, dictionaries,
    and tuples. In this chapter, we will define methods for user-defined types.'
