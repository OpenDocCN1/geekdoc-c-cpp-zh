    # 5.11 KEYBOARD INPUT


    The programs we have written so far are a bit rude in the sense that they accept
    no input from the user. They just do the same thing every time.

    Python has a built-in function called raw_input that gets input from the keyboard.*
    When this function is called, the program stops and waits for the user to type
    something. When the user presses Return or Enter, the program resumes and raw_input
    returns the user typed as a string.


    ```

    >>> input = raw_input()

    What are you waiting for?

    >>> print input

    What are you waiting for?

    ```


    Before getting input from the user, it is a good idea to print a prompt telling
    the user what to input. raw_input can take a prompt as an argument:


    ```

    >>> name = raw_input(''What...is your name?\\n'')

    What...is your name?

    Arthur, King of the Britons!

    >>> print name

    Arthur, King of the Britons!

    ```


    The sequence \n at the end of the prompt represents a newline, which is a special
    character that causes a line break. That''s why the user''s input appears below
    the prompt.


    * In Python 3.0, this function is named input.'
