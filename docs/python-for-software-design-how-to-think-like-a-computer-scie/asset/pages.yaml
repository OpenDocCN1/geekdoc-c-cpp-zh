  md: 'Furthermore, in mathematics, a statement of equality is either true or false,
    for all time. If $a = b$ now, then $a$ will always equal $b$. In Python, an assignment
    statement can make two variables equal, but they do not have to stay that way:


    ```

    a = 5

    b = a

    # a and b are now equal

    a = 3

    # a and b are no longer equal

    ```


    The third line changes the value of a but does not change the value of b, so they
    are no longer equal.


    Although multiple assignment is frequently helpful, you should use it with caution.

    If the values of variables change frequently, it can make the code difficult to
    read and debug.


    # 7.2 UPDATING VARIABLES


    One of the most common forms of multiple assignment is an update, where the new
    value of the variable depends on the old.


    ```

    x = x+1

    ```


    This means “get the current value of x, add one, and then update x with the new
    value.”


    If you try to update a variable that doesn''t exist, you get an error, because
    Python evaluates the right side before it assigns a value to x:


    ```

    >>> x = x+1

    NameError: name ''x'' is not defined

    ```


    Before you can update a variable, you have to initialize it, usually with a simple
    assignment:


    ```

    >>> x = 0

    >>> x = x+1

    ```'
