    # 3.10 STACK DIAGRAMS


    Keep track of which variables can be used where, it is sometimes useful to draw
    a stack diagram. Like state diagrams, stack diagrams show the value of each variable,
    but they also show the function each variable belongs to.


    Each function is represented by a frame. A frame is a box with the name of a function
    beside it and the parameters and variables of the function inside it. The stack
    diagram for the previous example looks like:


    | __main__ | line1 -> ''Bing tiddle'' |

    | | line2 -> ''tiddle bang.'' |

    | cat_twice | part1 -> ''Bing tiddle'' |

    | | part2 -> ''tiddle bang.'' |

    | | cat -> ''Bing tiddle bang.'' |

    | print_twice | bruce -> ''Bing tiddle bang.'' |


    The frames are arranged in a stack that indicates which function called which,
    and so on. In example, print_twice was called by cat_twice, and cat_twice was
    called by __main__, which is a special name for the topmost frame. When you create
    a variable outside of any function, it belongs to __main__.


    Each parameter refers to the value as its corresponding argument. So, part1 and
    part2 have the same value as line2, and bruce has the same value as cat.


    If an error occurs during a function call, Python prints the name of the function,
    and the name of the function that called it, and the name of the function that
    called that, all the way back to __main__.'
