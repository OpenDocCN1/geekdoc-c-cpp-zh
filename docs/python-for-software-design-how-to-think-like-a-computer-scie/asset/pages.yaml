    # 7.5 SQUARE ROOTS


    Loops are often used in programs that compute numerical results by starting with
    an approximate answer and iteratively improving it.


    For example, one of computing square roots is Newton’s method. Suppose that you
    want to know the square root of $a$. If you start with any estimate, $x$, you
    can compute a better estimate with the following formula:


    ```

    y = \frac{x + a/x}{2}

    ```


    For example, if $a$ is 4 and $x$ is 3:


    ```

    >>> a = 4.0

    >>> x = 3.0

    >>> y = (x + a/x) / 2

