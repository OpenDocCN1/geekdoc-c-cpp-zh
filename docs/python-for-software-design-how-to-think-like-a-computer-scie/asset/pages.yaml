  md: '# 11.1 Dictionary as a Set of Counters


    To see whether something appears as a value in a dictionary, you can use the method
    values, which returns the values as a list, and then use the in operator:


    ```

    >>> vals = eng2sp.values ()

    >>> ''uno'' in vals

    True

    ```


    The in operator uses different algorithms for lists and dictionaries. For lists,
    it uses a search algorithm, as in Section 8.6. As the list gets longer, the search
    time gets longer in direct proportion. For dictionaries, Python uses an algorithm
    called a hasht that has a remarkable property: the in operator takes about the
    same amount of time no matter how many items are in a dictionary. I won''t explain
    how''s possible, but you can read more about it at wikipedia.org/Hash_table.


    # Exercise 11.1


    Write a function that reads the words in words.txt and stores them as keys in
    a dictionary. it doesn''t matter what the values are. Then you can use the in
    operator as a fast way to check whether a string is in the dictionary.


    If you did Exercise 10.8, you can compare the speed of this implementation with
    the list in operator and the bijection search.


    # 11.1 DICTIONARY AS A SET OF COUNTERS


    Suppose you are a string and you want to count how many times each letter appears.
    There are several ways you could do it:


    +   (i) You could create 26 variables, for each letter of the alphabet. Then you
    could traverse the string and, for each character, increment the corresponding
    counter, probably using a chained conditional.

    (ii) You could create a list with 26 elements. Then you could convert each character
    to a number (using the built-in function ord()), use the number as an index into
    the list, and increment the appropriate counter.

    (iii) You could create a dictionary with characters as keys and counters as the
    corresponding values. The first time you see a character, you would add an item
    to the dictionary. After that you would increment the value of an existing item.


    Each of these options performs the same computation, but each of them implements
    computation in a different way.


    An implementation is a way of performing a computation; some implementations are
    better than others. For advantage of the dictionary implementation is that we
    don''t have to know ahead of time which letters appear in the string and we only
    have to make room for the letters that do appear.'
