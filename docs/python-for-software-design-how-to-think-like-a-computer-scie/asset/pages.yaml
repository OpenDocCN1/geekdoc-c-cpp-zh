  md: '# Tuples


    # 12.1UPLES ARE IMMUTABLE


    A tuple is a sequence of values. The values can be any type, and they are indexed
    by integers, so in that respect tuples are a like lists. The important difference
    is that tuples are immutable.


    Syntactically, a tuple is a comma-separated list of values:


    ```

    >>> t = ''a'', ''b'', ''c'', ''d'', ''e''

    ```


    Although it is not necessary, it is common to enclose tuples in parentheses:


    ```

    >>> t = (''a'', ''b'', ''c'', ''d'', ''e'')

    ```


    To create a tuple with a single element, you have to include the final comma:


    ```

    >>> t1 = (''a'')

    >>> type(t1)

    <type ''tuple''>

    ```


    Without the comma, Python treats (''a'') as a string in parentheses:


    ```

    >>> t2 = (''a'')

    >>> type(t2)

    <type ''str''>

    ```'
