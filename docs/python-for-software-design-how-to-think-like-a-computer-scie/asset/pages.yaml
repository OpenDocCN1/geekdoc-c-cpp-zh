  md: "# Fruitful Functions\n\nOtherwise, and this is the interesting part, we have\
    \ to make a recursive call to find the factorial of $n - 1$ and then multiply\
    \ it by $n$:\n\n```\ndef factorial(n):\n    if n == 0:\n      return 1\n    else:\n\
    \      recurse = factorial(n-1)\n      result = n * recurse\n      return result\n\
    ```\n\nThe flow of execution for this program is similar to the flow of countdown\
    \ in Section 5.8. If we call factorial with the value 3:\n\nSince 3 is not 0,\
    \ we take the second branch and calculate the factorial of $n - 1$ ...\nSince\
    \ 2 is not 0, we take the second branch and calculate the factorial of $n - 1$\
    \ ...\nSince 1 is not 0, we take the second branch and calculate the factorial\
    \ of $n - 1$ ...\nSince 0 is 0, we take the first branch and return 1 without\
    \ making any recursive calls.\n\nThe return value (1) is multiplied by $n$, which\
    \ is 1, and the result is returned.\nThe return value (1) is multiplied by $n$,\
    \ which is 2, and the result is returned.\n\nThe return value (2) is multiplied\
    \ by $n$, which is 3, and the result, 6, becomes the return value of the function\
    \ call that started the whole process.\n\nHere is what the stack diagram looks\
    \ like for this sequence of function calls:\n\n![](img/44821c0ec5bdef0746487da5f8ce59a6_85_0.png)\n\
    \nThe return values are shown being passed back up the stack. In each frame, the\
    \ return value is the value of result, which is the product of $n$ and recurse.\n\
    \nIn the last frame, the local variables recurse and result do not exist, because\
    \ the branch that creates them does not execute."
