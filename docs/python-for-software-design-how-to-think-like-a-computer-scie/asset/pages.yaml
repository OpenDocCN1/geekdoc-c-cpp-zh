    # 14.3 FORMAT OPERATOR


    The argument of write has to be a string, so if we want to put other values in
    a file, we have to convert them to strings. The easiest way to do that is with
    str:


    ```

    >>> x = 52

    >>> f.write(str(x))

    ```


    An alternative is to use the format operator, %. When applied to integers, % is
    the modulus operator. But when the first operand is a string, % is the format
    operator.


    The first operand is the format string, which contains one or more format sequences,
    which specify how the second operand is formatted. The result is a string,


    For example, the format sequence ''%d'' means that the second operand should be
    formatted as an integer (d stands for "decimal"):


    ```

    >>> camels = 42

    >>> ''%d'' % camels

    ''42''

    ```


    The result is the string ''42'', which is not to be confused with the integer
    value 42.'
