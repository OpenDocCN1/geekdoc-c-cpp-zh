  md: "# Case Study: Interface Design\n\nNow we can rewrite polygon and arc to use\
    \ polyline:\n\n```\ndef polygon(t, n, length):\n    angle = 360.0 / n\n    polyline(t,\
    \ n, length, angle)\n```\n\n```\ndef arc(t, r):\n    arc_length = 2 * math.pi\
    \ * r * angle / 360\n    n = int(arc_length / 3) + 1\n    step_length = arc_length\
    \ / n\n    step_angle = float(angle) / n\n    polyline(t, n, step_length, step_angle)\n\
    ```\n\nFinally, we can rewrite circle to use arc:\n\n```\ndef circle(t, r):\n\
    \    arc(t, r, 360)\n```\n\nThis process – rearranging a program to improve function\
    \ interfaces and facilitate code re-use – is called refactoring. In this case,\
    \ we noticed that there was similar code in arc and polygon, so we “factored it\
    \ out” into polyline.\n\nIf we had planned ahead, we might have written polyline\
    \ first and avoided refactoring, but often you don't know enough at the beginning\
    \ of a project to design all the interfaces. Once you start coding, you understand\
    \ the problem better. Sometimes refactoring is a sign that you have learned something.\n\
    \n# 4.8 A DEVELOPMENT PLAN\n\nA development plan is a process for writing programs.\
    \ The process we used in this case study is “encapsulation and generalization.”\
    \ The steps of this process are:\n\n+   (i) Start by writing a small program with\
    \ no function definitions.\n(ii) Once you get the program working, encapsulate\
    \ it in a function and give it a name.\n(iii) Generalize the function by adding\
    \ appropriate parameters.\n(iv) Repeat steps 1–3 until you have a set of working\
    \ functions. Copy and paste working code to avoid retyping and re-debugging).\n\
    (v) Look for opportunities to improve the program by refactoring. For example,\
    \ if you have similar code in several places, consider factoring it into an appropriately\
    \ general function."
