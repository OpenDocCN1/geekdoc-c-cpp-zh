    Next we compute the sum of squares of dx and dy:


    ```

    def distance(x1, y1, x2, y2):

    dx = x2 - x1

    dy = y2 - y1

    dsquared = dx**2 + dy**2

    print(''dsquared is:'', dsquared)

    return 0.0

