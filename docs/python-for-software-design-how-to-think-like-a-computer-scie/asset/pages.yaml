    # 14.8 PIPES


    Most operating systems provide a command-line interface, also known as a shell.
    Shells usually provide commands to navigate the file system and launch applications.
    For example, in Unix, you can change directories with cd, display the contents
    of a directory with ls, and launch a web browser by typing (for example) firefox.


    Any program that can be launched from the shell can also be launched from Python
    using a pipe. A pipe is an object that represents a running process.


    For example, the Unix ls -l normally displays the contents of the directory (in
    long format). You can launch ls with os.popen:


    ```

    >>> cmd = ''ls -l''

    >>> fp = os.popen(cmd)

    ```


    The argument is a string that contains a shell command. The return value is a
    file pointer that behaves just like an open file. You can read the output from
    the ls process one line at time with readline or get the whole thing at once with
    read:


    ```

    >>> res = fp.read()

    ```


    When you are done, you close the pipe like a file:


    The return value is the final status of the ls process; None means that it ended
    normally (with no errors).


    A common use of pipes is to read a compressed file incrementally; that is, without
    uncompressing the whole thing at once. The following function takes the name of
    a compressed file as a parameter and returns a pipe that uses gunzip to decompress'
