  md: '# 15.7 DEBUGGING


    When you start working with objects, you are likely to encounter some new exceptions.
    If you try to access an attribute that doesn''t exist, you get an AttributeError:


    ```

    >>> p = Point()

    >>> print p.z

    AttributeError: Point instance has no attribute ''z''

    ```


    If you are not sure what type an object is, you can ask:


    ```

    >>> type(p)

    <type ''__main__.Point''>

    ```


    If you are not sure whether an object has a particular attribute, you can use
    the built-in function hasattr:


    ```

    >>> hasattr(p, ''x'')

    True

    >>> hasattr(p, ''z'')

    False

    ```


    The first argument can be any object; the second argument is a string that contains
    the name of the attribute.


    # 15.8 GLOSSARY


    **attribute**: One of the values associated with an object.

    **class**: A user-defined type. A class definition creates a new class object.

    **class object**: An object that contains information about a user-defined type.
    The class object can be used to create instances of the type.

    **deep copy**: To copy the contents of an object as well as any embedded objects,
    and any objects embedded in them, and so on; implemented by the deepcopy function
    in the copy module.

    **embedded (object)**: An object that is stored as an attribute of another object.

    **instance**: An object that belongs to a class.

    **object diagram**: A diagram that shows objects, their attributes, and the values
    of the attributes.

    **shallow copy**: To copy the contents of an object, including any references
    to embedded objects; implemented by the copy function in the copy module.'
