    **global variable:** A variable defined outside a function. Global variables can
    be accessed from any function.

    **hashable:** A type that has a hash function. Immutable types like integers,
    floats, and strings are hashable; mutable types like lists and dictionaries are
    not.

    **hash function:** The function used by a hashtable to compute the location for
    a key.

    **hashtable:** The algorithm used to implement Python dictionaries.

    **histogram:** A set of counters.

    **implementation:** A way of performing a computation.

    **item:** Another name for a key-value pair.

    **key:** An object that appears in a dictionary as the first part of a key-value
