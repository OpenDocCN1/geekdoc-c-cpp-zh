  md: '# Iteration


    Instead, try to break the problem in half. Look at the middle of the program,
    or near, for an intermediate value you can check. Add a print statement (or something
    else that has a verifiable effect) and run the program.


    If the mid-point check is incorrect, the problem must be in the first half of
    the program. If it is correct, the problem is in the second half.


    Every time you perform a check like this, you halve the number of lines you have
    to search. After six steps (which is much less than 100), you would be down to
    one or two lines of code, at least in theory.


    In practice it is not always clear what the “middle of the program” is and not
    always possible to check. It doesn''t make sense to count lines and find the exact
    midpoint. Instead, think about places in the program where there might be errors
    and places where it is easy to put a check. Choose a spot where you think the
    chances about that the bug is before or after the check.


