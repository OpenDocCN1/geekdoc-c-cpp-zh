    # 8.4 STRING SLICES


    A segment of a string is called a slice. Selecting a slice is similar to selecting
    a character:


    ```

    >>> s = ''Monty Python''

    >>> print s[0:5]

    Monty

    >>> print s[6:13]

    Python

    ```


    The operator [n:m] returns the position of the string from the “n-eth” character
    to the “m-eth” character, including the first but excluding the last. This behavior
    is counterintuitive, but it might help to imagine the indices pointing between
    the characters, as in the following diagram:


    ![](img/44821c0ec5bdef0746487da5f8ce59a6_104_0.png)


    If you omit the first index (before the colon), the slice starts at the beginning
    of the string. If you omit the second index, the slice goes to the end of the
    string:


    ```

    >>> fruit = ''banana''

    >>> fruit[:3]

    ''ban''

    >>> fruit[3:]

    ''ana''

    ```


    If the first index is greater than or equal to the second the result is an empty
    string, represented by two quotation marks:


    ```

    >>> fruit = ''banana''

    >>> fruit[3:3]

    ''''

    ```'
