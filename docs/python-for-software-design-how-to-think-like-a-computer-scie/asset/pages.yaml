    ```


    Which is closer to the correct answer $(\sqrt{4} = 2)$. If we repeat the process
    with the new estimate, it gets even closer:


    ```

    >>> x = y

    >>> y = (x + a/x) / 2

    >>> print y

    2.00641025641

    ```'
