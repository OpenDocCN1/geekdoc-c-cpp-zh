    The association of a variable with an object is called **reference**. In this
    example,

    here are two references to the same object.


    An object with more than one reference has more than one name, so we say that
    the

    object is **aliased**.


    If the aliased object is mutable, changes made with one alias affect the other:


    ```

    >>> b[0] = 17

    >>> print a

    [17, 2, 3]

    ```


    Although this behavior can be useful, it is error-prone. In general, it is safer
    to avoid

    aliasing when you are working with mutable objects.


    For immutable objects like strings, aliasing is not much of a problem. In the

    example:


    ```

    a = ''banana''

    b = ''banana''

    ```


    It almost never makes a difference whether a and b refer to the same string or
    not.


