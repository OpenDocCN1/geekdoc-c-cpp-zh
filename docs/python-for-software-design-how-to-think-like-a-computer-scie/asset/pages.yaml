    ```\nif choice == 'a':\n    draw_a()\nelif choice == 'b':\n    draw_b()\nelif\
    \ choice == 'c':\n    draw_c()\n```\n\nEach condition is checked in order. If\
    \ the first is false, the next is checked, and so on. If one of them is true,\
    \ the corresponding branch executes, and the statement executes. Even if more\
    \ one condition is true, only the first true branch executes.\n\n# 5.7 NESTED\
