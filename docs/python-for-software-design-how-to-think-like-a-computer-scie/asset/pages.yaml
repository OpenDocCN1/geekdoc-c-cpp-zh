  md: '# 112 Lists


    We know that a and b both refer to a string, but we don''t know whether they refer
    to the same string. There are two possible states:


    ![](img/44821c0ec5bdef0746487da5f8ce59a6_131_0.png)


    In one case, a and b refer to different objects that have the same value. In the
    second case, they refer to the same object.

    To check whether two variables refer to the same object, you can use the is operator.


    ```

    >>> a = ''banana''

    >>> b = ''banana''

    >>> a is b

    True

    ```


    In this example, Python only created one string object, and both a and b refer
    to it.\But when you create two lists, you get two objects:


    ```

    >>> a = [1, 2, 3]

    >>> b = [1, 2, 3]

    >>> a is b

    False

    ```


    So the state diagram looks like this:


    ![](img/44821c0ec5bdef0746487da5f8ce59a6_131_1.png)


    In this we would say that the lists are equivalent, because they have the same
    elements, but not identical, because they are not the same object. If two objects
    are identical, they are also equivalent, but if they are equivalent, they are
    not necessarily identical.


    Until now, we have been using "object" and "value" interchangeably, but it is
    more precise to say that an object has a value. If you execute a = [1, 2, 3],
    a refers to a list object whose value is a particular sequence of elements. If
    another list has the same elements, we would say it has the same value.'
