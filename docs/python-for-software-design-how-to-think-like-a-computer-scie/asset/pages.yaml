  md: '# The Way of the Program


    If there is a single syntax error anywhere in your program, Python will display
    an error message and quit, and you will not be able to run your program. During
    the first few weeks of your programming career, you will probably spend a lot
    of time tracking down syntax errors. As you gain experience, you will make fewer
    errors and find them.


    # 1.3.2 Runtime Errors


    The second type of error is a runtime error, so called because the error does
    not appear until after the program has started running. These errors are also
    called exceptions because they usually indicate that something exceptional (and
    bad) has happened.


    Runtime errors are rare in the simple programs you will see in the first few chapters,
    so it might be a while before you encounter one.


    # 1.3.3 Semantic Errors


    The third type of error is the semantic error. If there is a semantic error in
    your program, it will run successfully in the sense that the computer will not
    generate any error messages, but it will not do the right thing. Specifically,
    it will do what you told it to do.


    The problem is that the program you write is not the program you want to write.
    The meaning of the program (its semantics) is wrong. Identifying semantic errors
    can be tricky because it requires you to work backward by looking at the output
    of the program and trying to figure out what it is doing.


    # 1.3.4 Experimental Debugging


    One of the most important skills you will acquire is debugging. Although it can
    be frustrating, debugging is one of the intellectually rich, challenging, and
    interesting parts of programming.


    In some ways, debugging is like detective work. You are confronted with clues,
    and you have to infer the processes and events that led to the results you see.


    Debugging is also like an experimental science. Once you have an idea about what
    is going wrong, modify your program and try again. If your hypothesis was correct,
    then you can predict the result of the modification, and you take a step closer
    to a working program. If your hypothesis was wrong, you have to come up with a
    new one. As Sherlock Holmes pointed out,“When you have eliminated the impossible,
