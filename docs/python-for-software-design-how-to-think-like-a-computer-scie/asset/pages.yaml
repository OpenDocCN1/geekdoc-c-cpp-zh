  md: '# Appendix


    # Debugging


    Different kinds of errors can occur in a program, and it is useful to distinguish
    among them in order to track them down more quickly:


    +   - Syntax errors are produced by Python when it is translating the source code
    into byte code. They usually indicate that there is something wrong with the syntax
    of the program. Example: Omitting the colon at the end of a def statement yields
    the somewhat redundant message SyntaxError: invalid syntax.

    - Runtime errors are produced by the interpreter if something goes wrong while
    the program is running. Most runtime error messages include information about
    where the error occurred and what functions were executing. Example: An infinite
    recursion causes the runtime error “maximum recursion depth exceeded.\n- Semantic
    errors are problems with a program that runs without producing error messages
    but doesn''t do the right thing. Example: An expression may not be evaluated in
    the order you expect, yielding an incorrect result.


    The first step in debugging is to figure out what kind of error you are dealing
    with. Although the following sections are organized by error type, some techniques
    are applicable in more than one situation.


    # A.1 SYNTAX ERRORS


    Syntax errors are usually easy to fix once you figure out what they are. Unfortunately,
    the error messages are often not helpful. The most common messages are SyntaxError:
    invalid syntax and SyntaxError: invalid token, neither of which is very informative.


    On the other hand, the message does tell you where in the program the problem
    occurred. Actually, it tells you where Python noticed a problem, which is not
    necessarily the error is. Sometimes the error is prior to the location of the
    error message, often on the preceding line.'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'If you are building the program incrementally, you should have a good idea
    about where the error is. It will be in the last line you added.


    If you are copying code from a book, start by comparing your code to the book''s
    code carefully. Check every character. At the same time, remember that the book
    might be wrong, if you see something that looks like a syntax error, it might
    be.


    Here are some ways to avoid the most common errors:


    +   (i) Make sure you are not using a Python keyword for a variable name.

    (ii) Check that you have a colon at the end of the header of every compound statement,
    including for, while, and def statements.

    (iii) Make sure that any strings in the code matching quotation marks.

    (iv) If you have multiline lines with triple quotes (single or double), make sure
    you have terminated the string properly. An unterterminated string may cause an
    invalid token error at the end of your program, or it may treat the following
    part of the program as a string until it comes to the next string. In the second
    case, it might not produce an error message at all!

    (v) An unmatched operator (, or [ – Python continue with the next line as part
    of the current statement. Generally, an error occurs almost immediately in the
    next line.

    (vi) Check for the case = == inside a conditional.

    (vii) Check the indentation to make sure it lines up the way it is supposed to.
    Python can handle space and tabs, but if you mix them it can cause problems. The
    best way to avoid this problem is to use a text editor that knows about Python
    and generates consistent indentation.


    If nothing works, move to the next section ...


    # A.1.1 Keep Making Changes and It Makes No Difference


    If the interpreter says there is an error and you don''t see it, that might be
    because you and the interpreter are not looking at the same code. Check your programming
    environment to make sure that the program you are editing is the one Python is
    trying to run.


    If you are not sure, try putting an obvious syntax error at the beginning of the
    program. Now run it. If the interpreter doesn''t find the new error, you are not
    running the code.


    There are a few likely culprits:


    +   - You edited the file and forgot to save the changes before running again.
    Some programming environments do this for you, but some don''t.

    - You changed the name of the file, but you are still running the old name.

    - Something in your development environment is configured incorrectly.

    - If you are writing a module and using import, make sure you don''t give your
    module the same name as one of the standard Python modules.'
  merge: -1
  pgno: 251
- img_proc: true
  md: 'If are using import to read a module, remember that you have to restart the
    interpreter or use reload to read a modified file. If you import the module again,
    it doesn''t do anything.


    If you get stuck and you can''t figure out what is going on, one approach is to
    start again with a new program like "Hello, World," and make sure you can get
    a program to run. Then gradually add the pieces of the original program to the
    new one.


    # A.2 RUNTIME ERRORS


    Once your program is syntactically correct, Python can compile it and at least
    running it. What could possibly go wrong?


    # A.2.1 My Program Does Absolutely Nothing


    This problem is most common when your file consists of functions and classes but
    does not actually invoke anything to start execution. This may be intentional
    if you only plan to import this module to supply classes and functions.


    If it is not intentional, make sure that you are invoking a function to start
    execution, or execute one from the interactive prompt. Also see the "Flow of Execution"
    section below.


    # A.2.2 My Program Hangs


    If a program stops and seems to be doing nothing, it is "hanging." Often means
    that it is caught in an infinite loop or infinite recursion.


    +   - If there is a particular loop that you suspect is the problem, add a print
    statement immediately before the loop that says "entering the loop" and another
    immediately after says "exiting the loop."

    - Run the program. If you get the first message and not the second, you have got
    an infinite loop. Go to the "Infinite Loop" section below.

    - Most of the time, an infinite recursion will cause the program to run for a
    while and then produce a "RuntimeError: Maximum recursion depth exceeded" error.
    If that happens, go to the "Infinite Recursion" section below.

    - If you are not getting this error but suspect there is a problem with a recursive
    method or function, you can still use the techniques in "Infinite Recursion" section.

    - If neither of those steps works, start testing other loops and recursive functions
    and methods.

    - If that doesn''t work, it is possible that you don''t understand the flow of
    execution in your program. Go to the "Flow of Execution" section below.


    # A.2.2.1 Infinite Loop


    If you think you have an infinite loop and you think know what loop is causing
    the problem, add a print statement at the end of the loop that prints the values
    of the variables in the condition and the value of the condition.'
