  md: 'Another challenge of GUI programming is that you don''t have control of the
    flow of execution. Which parts of the program execute and their order are determined
    by user actions. That means you have to design your program to work correctly
    for any possible sequence of events.


    For example, the GUI in Exercise 19.3 has two widgets: one creates a Circle item
    and the other changes the color of the Circle. If the user creates the circle
    and changes its color, there''s no problem. But what if the user changes the color
    of a circle that doesn''t exist yet? Or creates more than one circle?


    As the number of widgets grows, it is increasingly difficult to imagine all possible
    sequences of events. One way to manage this complexity is to encapsulate the state
    of the system in an object and consider:


    +   * What are the possible states? In the Circle example, we might consider two
    states: before and after the user creates the first circle.

    * In each state, what events occur? In the example, the user can press either
    of the buttons, or quit.

    * For each state-event pair, what is the desired outcome? Since there are two
    states and two buttons, there are four state-event pairs to consider.

    * What can cause a transition from one state to another? In this case, there is
    a transition when the user creates the first circle.


    You might also find it useful to define, and check, invariants that should hold
    regardless of the sequence of events.


    This approach to GUI programming can help you write correct code without testing
    every possible sequence of user events!


    # 19.10 GLOSSARY


    **binding:** An association between a widget, an event, and an event handler.
    The event handler is called when the event occurs in the widget.


    **bound method:** A method associated with a particular instance.


    **bounding box:** A rectangle that encloses a set of items, usually specified
    by two opposing corners.


    **callback:** A function associated with a widget that is called when the user
    performs an action.


    **event:** A user action, a mouse click or key press, that causes a GUI to respond.


    **event-driven programming:** A style of programming in which the flow of execution
    is determined by user actions.


    **event loop:** An infinite loop that waits for user actions and responds.


    **geometry manager:** A system for packing widgets.


    **GUI:** A graphical user interface.


    **item:** A graphical element on a Canvas widget.


    **keyword:** An argument that indicates the parameter name as part of the function
    call.'
