  md: '# Preface


    I hope you enjoy working with this book, and that it helps you learn to program
    and think, at least a little bit, like a computer scientist.


    # ACKNOWLEDGMENTS


    First and most importantly, I thank Jeff Elkner, who translated my Java book into
    Python, which got this project started and introduced me to what has turned out
    to be my favorite language.


    I also think Chris Meyers, who contributed several sections to How to Think Like
    a Computer Scientist.


    And I thank the Free Software Foundation for developing the GNU Free Documentation
    License, which helped make my collaboration with Jeff and Chris possible.


    I also thank the editors at Lulu who worked on How to Think Like a Computer Scientist
    and the editors at Cambridge Press who worked on this edition.


    I thank all the students who worked with earlier versions of this book and all
    the contributors (listed below) who sent in corrections and suggestions.


    And I thank my wife, Lisa, for her work on this book, and Green Tea Press, and
    everything else, too.


    # CONTRIBUTOR LIST


    More than 100 sharp-eyed and thoughtful readers have sent in suggestions and corrections
    over the past few years. Their contributions, and enthusiasm for this project,
    have been a huge help.


    If you have a suggestion or correction, please send email to feedback@thinkpython.com.
    If I make a change based on your feedback, I will add you to the contributor list
    (unless you ask to be omitted)


    If you include at least part of the sentence error appears in, it will be easier
    for me to search for it. Page and section numbers are fine, too, but not quite
    as easy to work with. Thanks!


    +   - Lloyd Allen sent in a correction to Section 8.4.

    - Yvon Boulianne sent in a correction of a semantic error in Chapter 5.

    - Fred Bremer submitted a correction in Section 2.1.

    - Jonah Cohen wrote the Perl script to convert the LaTeX source for this beautiful
