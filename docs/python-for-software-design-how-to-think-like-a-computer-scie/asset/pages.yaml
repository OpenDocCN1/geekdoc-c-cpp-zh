- img_proc: true
  md: '# 236 Debugging


    a small list. If the program takes input from the user, give it the simplest input
    that causes the problem.


    Second, clean up the program. Remove dead code and reorganize the program to make
    it as easy to read as possible. For example, if you suspect the problem is in
    a deeply nested part of the program, try rewriting that part with simpler structure.
    If you suspect a large function, splitting it into smaller functions and testing
    them separately.


    Often the process of finding the minimal test case leads you the bug. If you find
    that a program works in one situation but not in another, that gives you a clue
    about what is going on.


    Similarly, rewriting a piece of code can help you find subtle bugs. If you make
    a change that you shouldn''t affect the program, and it does, that can tip you
    off.


    # A.3 SEMANTIC ERRORS


    In some ways, semantic errors are the hardest to debug, because the interpreter
    provides no information about what is wrong. Only you know what the program is
    supposed to do.


    The first step is to make a connection between the program text and the behavior
    you are seeing. You need a hypothesis about what the program is actually doing.
    One of the things that makes hard is that computers run so fast.


    You will wish that you could slow the program down to human speed, and with some
    debuggers you can. But the time it takes to insert a few well-placed print statements
    is often short compared to setting up the debugger, inserting and removing breakpoints,
    and “stepping” the program to where the error is occurring.


    # A.3.1 My Program Does not Work


    You should ask yourself these questions:


    +   - Is something the program was supposed to do but which doesn''t seem to be
    happening? Find the section of the code that performs that function and make sure
    it is executing when you think it should.

    - Is something happening that shouldn''t? Find code in your program that performs
    that function and see if it is executing when it shouldn''t.

    - Is a section of code producing an effect that is not what you expected? Make
    sure that you understand the code in question, especially if it involves invocations
    to functions or methods in other Python modules. Read the documentation for the
    functions you invoke. Try them out by writing simple test cases and checking the
    results.


    In order to program, you need to have a mental model of how programs work. If
    you write a program that doesn''t do what you expect, very often the problem is
    not in the program; it''s in your mental model.'
  merge: -1
  pgno: 255
- img_proc: true
  md: 'The best way to correct your mental model is to break the program into its
    components (usually the functions and methods) and test each component independently.
    Once you find the discrepancy between your model and reality, you can solve the
    problem.


    Of course, you should be building and testing components as you develop the program.
    If you encounter a problem, there should be only a small amount of new code that
    is not known to be correct.


    # A.3.2 I''ve Got A Bairy Expression and It Doesn''t Do What I Expect


    Writing expressions is fine as long as they are readable, but they can be hard
    to debug. It is often a good idea to break a complex expression into a series
    of assignments to temporary variables.


    For example:


    ```

    self.hands[i].addCard(self.hands[self.findNeighbor(i)].popCard())

    ```


    This can be rewritten as:


    ```

    neighbor = self.findNeighbor(i)

    pickedCard = self.hands[neighbor].popCard()

    self.hands[i].addCard(pickedCard)

    ```


    The explicit version is easier to read because the variable names provide additional
    documentation, and it is easier to debug because you can check the types of the
    intermediate variables and display their values.


    Another problem that can occur with big expressions is that the order of evaluation
    may not be what you expect. For example, if you are translating the expression
    $\frac{x}{2π}$ into Python, you might write:


    ```

    y = x / 2 * math.pi

    ```


    That is not correct because multiplication and division have the same precedence
    and are evaluated from left to right. So this expression computes $x\pi/2$.


    A good way to debug expressions is to add parentheses to $\pi$ to mark the order
    of evaluation explicit:


    ```

    y = x / (2 * math.pi)

    ```


    Whenever you are not sure of the order of evaluation, use parentheses. Not only
    will the program be correct (in the sense of doing what you intended), it will
    also be more readable for other people who haven''t memorized the rules of precedence.'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# A.3.3 I''ve Got a Function or Method That Doesn''t Return What I Expect


    If you have a return statement with a complex expression, you don''t have a chance
    to print the return value before returning. Again, you can use a temporary variable.
    For example, instead of:


    ```

    return self.hands[i].removeMatches()

    ```


    you could write:


    ```

    count = self.hands[i].removeMatches()

    return count

    ```


    Now you have the opportunity to display the value of count before returning.


    # A.3.4 I''m Really, Really Stuck and I Need Help


    First, try getting away from the computer for a few minutes. Computers emit waves
    that affect the brain, causing these symptoms:


    +   - Frustration and rage.

    - Superstitious beliefs (“the computer hates me”) and magical thinking (“the program
    only works when I wear my hat backward”).

    - Random walk programming (the attempt to program by writing every program and
    choosing the one that does the right thing).


    If you find yourself suffering from any of these symptoms, get up and go for a
    walk. When you are calm, think about the program. What is it doing? What are some
    possible causes of that behavior? When was the last time you had a working program,
    and what did you do next?


    Sometimes it takes time to find a bug. I often find bugs when I am away from the
    computer and let your mind wander. Some of the best places to find bugs are trains,
    showers, and in bed, before you fall asleep.


    # A.3.5 No, I Really Need Help


    It happens. Even the best programmers occasionally get stuck. Sometimes you work
    on a program so long that you can''t see the error. A fresh pair of eyes is just
    the thing.


    Before you bring someone else in, make sure you are prepared. Your program should
    be as simple as possible, and you should be working on the smallest input that
    causes the error. You should have print statements in the appropriate places (and
    the output you produce should behensible). You should understand the problem well
    enough to describe it concisely.'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# A.3 Semantic Errors 239


    When you bring someone in help, be sure to give them the information they need:


    +   - If there is an error message, what is it and what part of the program does
    it indicate?


    +   - What was the last thing you did before this error occurred? What were the
    last lines of code that you wrote, or what is the new test case that fails?


    +   - What have you tried so far, and what have you learned?


    When you find the bug, take a second to think about what you could have done to
    find it faster. Next time you see something similar, you will be able to find
    the bug more quickly.


    Remember, the goal is not just to make the program work. The goal is to learn
    how to make the program work.'
