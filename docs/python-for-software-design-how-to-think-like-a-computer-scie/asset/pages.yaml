    # Exercise 19.4


    For this exercise, you will write an image viewer. Here is a simple example:


    ```

    g = Gui()

    canvas = g.ca(width=300)

    photo = PhotoImage(file=''danger.gif'')

    canvas.image([0,0], image=photo)

    g.mainloop()

    ```


    PhotoImage reads a file and returns a PhotoImage object that Tkinter can display.
    Canvas.image puts the image on the canvas, centered on the given coordinates.
    You can also put images on labels, buttons, and some other widgets:


    ```

    g.la(image=photo)

    g.bu(image=photo)

    ```


    PhotoImage can only handle a few image formats, like GIF and PPM, but we can use
    the Python Imaging Library (PIL) to read other files.


    The name of the PIL module is Image, but Tkinter defines an object with the same
    name. To avoid the conflict, you can import . . . as this:


    ```

    import Image as PIL

    import ImageTk

    ```


    The first line imports Image and gives it the local name PIL. The second line
    imports ImageTk, which can translate a PIL image into a Tkinter PhotoImage. Here''s
    an example:


    ```

    image = PIL.open(''allen.png'')

    photo2 = ImageTk.PhotoImage(image)

    g.la(image=photo2)

    ```'
