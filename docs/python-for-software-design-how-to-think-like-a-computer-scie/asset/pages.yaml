    As it turns out, there is a string method named find that is remarkably similar
    to the function we use:


    ```

    >>> word = ''banana''

    >>> index = word.find(''a'')

    >>> print index

    1

    ```


    In this example, we invoke find on word and pass the letter we are looking for
    as a parameter.


    Actually, the find method is more general than our function; it can find substrings,
    not just characters:


    ```

    >>> word.find(''na'')

    2

    ```


    It can take as a second argument the index where it should start:


    ```

    >>> word.find(''na'', 3)

    4

    ```


    And as a third argument the index where it should stop:


    ```

    >>> name = ''bob''

    >>> name.find(''b'', 1, 2)

    -1

    ```'
