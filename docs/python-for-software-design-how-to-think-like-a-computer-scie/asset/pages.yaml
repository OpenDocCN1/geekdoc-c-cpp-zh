  md: "# Dictionaries\n\nA dictionary is represented as a box with the type dict above\
    \ it and the key-value pairs inside. If the values are integers, floats, or strings,\
    \ I usually draw them inside the box, but I usually draw lists outside the box,\
    \ just to keep the diagram simple.\n\nLists can be values in a dictionary, as\
    \ this example shows, but they cannot be keys. Here's what happens if you try:\n\
    \n```\n>>> t = [1, 2, 3]\n>>> d = dict()\n>>> d[t] = 'oops'\nTraceback (most recent\
    \ call last):\n  File \"stdin>\", line 1, in ?\nTypeError: list objects are unhashable\n\
    ```\n\nI mentioned earlier that a dictionary is implemented using a hashtable\
    \ and means that the keys have to be **hashable**.\n\nA **hash** is a function\
    \ that takes a value (of any kind) and returns an integer. Dictionaries use these\
    \ integers, called hash values, to store and look up key-value pairs.\n\nThis\
    \ system works fine if the keys are immutable. But if the keys are mutable, like\
    \ lists, bad things happen. For example, when you create a key-pair value, Python\
    \ hashes the key and stores it in the corresponding location. If you modify the\
    \ key and then hash again, it would go to a different location. In that case you\
    \ might have two entries for the same key, or you might not be able to find a\
    \ key. Either way, the dictionary would not work correctly.\n\nThat's why the\
