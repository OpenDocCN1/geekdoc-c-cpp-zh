  md: "# Debugging\n\nFor example:\n\n```\nwhile x > 0 and y < 0 :\n    # do something\
    \ to x\n    # do something to y\n\nprint \"x: \\ x\nprint \"y: \\ y\nprint \"\
    condition: \\ (x > 0 and y < 0)\n```\n\nNow when you run the program, you will\
    \ see three lines of output for each time through the loop. The last time through\
    \ the loop, the condition should be false. If the loop keeps going, you will be\
    \ able to see the values of x and y, and you might figure out why they are not\
    \ being updated correctly.\n\n# A.2.2.2 Infinite Recursion\n\nMost of the time,\
    \ an infinite recursion will cause the program to run for a while and then produce\
    \ a Maximum recursion depth exceeded error.\n\nIf you suspect that function or\
    \ method is causing an infinite recursion, start by checking to make sure there\
    \ is a base case. In other words, there should be some condition that will the\
    \ function or method to return without making a recursive invocation. If not,\
    \ then you need to rethink the algorithm and identify a base case.\n\nIf there\
    \ is a base case but the program doesn't seem to be reaching it, add a print statement\
    \ at the beginning of the function or method that prints the parameters. Now when\
    \ you run the program, you will see a few lines of output every time the function\
    \ or method is invoked, and you will see the parameters. If the parameters are\
    \ not moving towards the base case, you will get some ideas about why not.\n\n\
    # A.2.2.3 Flow of Execution\n\nIf you are not sure how the flow of execution is\
    \ moving through your program, add print statements to the beginning of each function\
    \ with a message like \"entering foo.\" where foo is the name of the function.\n\
    \nNow when you run the program, it will print a trace of each function as it is\
    \ invoked.\n\n# A.2.3 When I Run the Program I Get an Exception\n\nIf something\
    \ goes wrong during runtime, Python prints a message that includes the name of\
    \ the exception, the line of the program where the problem occurred, and a traceback.\n\
    \nThe traceback identifies the function that is currently running, and then the\
    \ function that invoked *that*, and so on. In other words, it traces the sequence\
    \ of function invocations that got you to where you are. It also includes the\
    \ line number in your file where each of these calls occurs."
