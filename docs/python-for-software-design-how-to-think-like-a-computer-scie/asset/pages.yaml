  md: '# Iteration


    # 7.1 MULTIPLE ASSIGNMENT


    As you may have discovered, it is legal to make more than one assignment to the
    same variable. A new assignment makes an existing variable refer to a new value
    (and stop referring to the old value).


    ```

    bruce = 5

    print bruce,

    bruce = 7

    print bruce

    ```


    The output of this program is 5 7, because the first time bruce is printed, its
    value is 5, and the second time, it is 7. The comma at the end of the first print
    statement suppresses the newline, which is why both outputs appear on the same
    line.


    Here is what multiple assignment looks like in a state diagram:


    ![](img/44821c0ec5bdef0746487da5f8ce59a6_92_0.png)


    With multiple assignment it is especially important to distinguish between an
    assignment operation and a statement of equality. Because Python uses the equal
    sign (=) for assignment, it is tempting to interpret a statement like a=b as a
    statement of equality. It is not!


    First, equality is a symmetric relation and assignment is not. For example, in
    mathematics, if a = 7 then 7 = a. But in Python, the statement a=7 is legal and
    7 =a is not.'
