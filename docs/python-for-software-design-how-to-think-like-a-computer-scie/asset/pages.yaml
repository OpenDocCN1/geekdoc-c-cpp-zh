  md: "# Conditionals and Recursion\n\n```\n>>> 17 and True\nTrue\n```\n\nThis flexibility\
    \ can be useful, but there are some subtleties to it that might be confusing.\
    \ You might want to avoid it (unless you know what you are doing).\n\n# 5.4 CONDITIONAL\
    \ EXECUTION\n\nIn order to write useful programs, we almost always need the ability\
    \ to check conditions and change the behavior of the program accordingly. Conditional\
    \ statements give us this ability. The simplest form is the if statement:\n\n\
    ```\nif x < 0:\n    print 'x is positive'\n```\n\nThe boolean expression after\
    \ the if statement is called the condition. If it is true, then the indented statement\
    \ executed. If not, nothing happens.\n\nif statements have the same structure\
    \ as function definitions: a header followed by an indented block. Statements\
    \ like this are called compound statements.\n\nThere is no limit on the number\
    \ of statements that can appear in the body, but there has to be at least one.\
    \ Occasionally, it is useful to have a body with no statements (usually as a place\
