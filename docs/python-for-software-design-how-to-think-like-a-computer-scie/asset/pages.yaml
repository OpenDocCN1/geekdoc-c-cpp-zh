  md: '# Case Study: Interface Design


    Preconditions are the responsibility of the caller. If the caller violates a (properly
    documented!) precondition and the function doesn''t work correctly, the bug is
    in the caller, not the function. However, for purposes of debugging it is often
    a good idea for functions to check their preconditions rather than assume they
    are true. If every function checks its preconditions before starting, then if
    something goes wrong, you will know which function to blame.


    # 4.11 GLOSSARY


    **development plan:** A process for writing programs.


    **docstring:** A string that appears in a function definition to document the
    function''s interface.


    **encapsulation:** The process of transforming a sequence of statements into a
    function definition.


    **generalization:** The process of replacing something unnecessarily specific
    (like a number) with appropriately general (like a variable or parameter).


    **instance:** A member of a set. The TurtleWorld in this chapter is a member of
    the Turtle Worlds.


    **interface:** A description of how to use a function, including the name and
    descriptions of the arguments and return value.


    **keyword argument:** An argument that includes the name of the parameter as a
    "keyword."


    **loop:** A part of a program that can execute repeatedly.


    **postcondition:** A requirement that should be satisfied by the function before
    it ends.


    **precondition:** A requirement that should be satisfied by the caller before
    it starts.


