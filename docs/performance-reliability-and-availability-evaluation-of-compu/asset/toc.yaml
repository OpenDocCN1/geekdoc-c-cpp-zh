  - $t_i$ 展示了服务器按顺序排列的失效时间。列 $\hat{R}(t_i), \hat{F}(t_i), \hat{f}(t_i)$ 和 $\hat{\lambda}(t_i)$
    分别描述了可靠性、累计分布和 $t_i$ 处的失效率。在本特定研究中，采用了函数 25.2.10、25.2.9、25.2.11 和 25.2.12。从表中，$2022h$
    处的可靠性为 $\hat{R}(2022h) = 0.2917$.同样，$\hat{F}(t), \hat{f}(t)$ 和 $\hat{\lambda}(t)$
    也得到了估计。估计的失效时间为 MTTF =134.85h。采用自助法估计了 MTTF 的置信区间。得到的 MTTF 95% 置信区间为 $(1016.57h,
