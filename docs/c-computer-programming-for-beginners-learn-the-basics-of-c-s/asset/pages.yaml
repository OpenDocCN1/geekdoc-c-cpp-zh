  md: '# CHAPTER 8: GET INTRODUCED TO ENCAPSULATION


    There are four fundamental concepts in object oriented programming. They are an
    inheritance, abstraction, polymorphism, and encapsulation. As a result, you are
    certain to come across encapsulation when programming in C#. So, let us learn
    it now so that the advanced courses become easier when you opt for them.


    # What Is Encapsulation?


    Encapsulation can be explained as the process of which one or more items can be
    enclosed inside a physical or a logical package. In OOP methodology, encapsulation
    can prevent access to the implementation details.


    In object oriented programming, encapsulation and abstraction are related features.
    With abstraction, it is possible to make the relevant information visible. On
    the other hand, encapsulation will allow the user to implement abstraction at
    the level desired.


    Access specifiers are used in order to implement encapsulation. Access specifiers
    will be defining the scope and the visibility of the class member. In C#, support
    for the given access specifiers will be provided.


    +   - Public

    - Protected

    - Private

    - Internal

    - Protected internal


    We will be taking a look at each of these access specifiers in turn.


    Public Access Specifier


    This specifier will allow a class to expose the member functions and member variables
    to the other functions as well as objects. It is possible to access any public
    member from the outside of its class.


    Take a look at the following example for getting a better grasp over public access'
