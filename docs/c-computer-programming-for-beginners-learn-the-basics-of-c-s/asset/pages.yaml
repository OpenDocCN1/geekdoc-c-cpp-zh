    get a complete documentation of the program along with it. On installing this
    kit, you will be able to compile and execute your source code in C#. This is made
    possible by the Command Line Compiler that has been built into the kit along with
    the runtime Just in Time Compiler. If you have dabbled in Java previously, you
    can recognize them as being similar to the Java Compiler and the Java Interpreter,
    which is'
