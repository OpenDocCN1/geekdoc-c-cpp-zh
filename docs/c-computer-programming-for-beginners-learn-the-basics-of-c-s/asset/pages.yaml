- pgno: 16
  md: '| C# | C++ |

    |---|---|

    | It is a high level language that is component oriented. | It is a low level
    and platform neutral programming language. |

    | When compiled, the C# code is converted into intermediate language code. The
    intermediate code is then converted into executable code through the process called
    just-in compilation. | When compiled, C++ code is converted into assembly language
    code. |

    | The memory management in C# is automatically handled by garbage collector. |
    The memory that is allocated in the heap dynamically has to be explicitly deleted.
    |

    | In the Switch statement, the test variable can be a string. | In the C++ switch
    statement, test variable cannot be a string. |

    | In the switch statement, when break statement is not given, the fall through
    will not happen to the next case statement if the current case statement has any
    code. | The switch statement in C++, when break statement is not given, the fall
    through will happen to the next case statement even if the current case statement
    has any code.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '| In addition to do...while, while and for, C# has another flow control statement
    called foreach. | There is no foreach statement in C++ | |

    | The C# structs can contain only value types. The structs is sealed and it cannot
    have a default-argument constructor. | In C++, structs behave like classes except
    that the default access is public instead of private. |

    | In C#, events, properties and delegates can also be specified as class members
    | Only constructors, variables, functions, destructors and operator overloads
    can be class members in C++. Delegates, events and properties cannot be specified
    as class members. |

    | The end of the class definition has a closing brace alone. | The end of the
    class definition has a closing brace followed by a semicolon. |

    | In C#, the access modifiers are private, public, internal, protected internal
    and protected. | In C++, the access modifiers are private, public, protected.
    There are no protected internal and internal access modifiers in C++. |


    | It has a finally block in exception handling mechanism. The code statements
    in the finally block will be executed once irrespective of exception occurrence.
    | The C++ language does not have a finally block in exception handling mechanism.
    |

    | In C#, the exception can only throw a class that is derived from the System.Exception
    class. | Exception in C++ can throw any class. |

    | There is no concept of function pointers. It has a similar concept called Delegates.
    | It has the concept of function pointers. |'
  merge: -1
  img_proc: true
