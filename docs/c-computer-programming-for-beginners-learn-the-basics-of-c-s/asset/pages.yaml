- pgno: 10
  md: '# INTRODUCTION


    First of all, thank you for buying this book, “Programming: Computer Programming
    for Beginners: Learn the Basics of C#”. C# was developed by Microsoft under its.NET
    initiative.


    C# or C Sharp as it is pronounced is a programming language. It is a multi-paradigm
    programming language as it supports a variety of programming paradigms such as
    the object oriented discipline. As a result you gain an enormous amount of flexibility
    in choosing a programming style for the task at hand. Moreover, C# is considered
    to be an easy language for beginners looking to take the first step into the huge
    world of computer programming.


    Learning C# opens up a plethora of opportunities to you. From C#, you can take
    a step back and learn the incredible language of C and then C++. Knowledge of
    C# also enables you to pick the skills necessary for web development through the
    .NET platform. Additionally, this language is also helpful if you are planning
    to develop products for the Microsoft ecosystem down the line.


    Are you feeling overwhelmed with all of this? It might be a lot to take in for
    a beginner. However, you shouldn''t worry too much. This book will help you get
    the fundamental knowledge you need to become a C# programmer. You will learn some
    cool new terms and even a few programs. You will come across some of the terms
    and functions used in this language. In short, you will be prepared thoroughly
    so that you can start advanced courses and become a top notch programmer.


    Let us now get started on learning C#!'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# CHAPTER 1: INTRODUCTION TO C#


    C# (pronounced as See-Sharp) was created by a team of people at Microsoft led
    by Anders Hejlsberg. When .NET framework was originally being developed by Microsoft,
    and the programmers had to write the class libraries with the help of Simple Managed
    C, a managed code compiler system. However, there were a few issues with using
    C. As a result; C# was developed as a new language to overcome these problems.


    It is a powerful and flexible programming language. Like other programming languages,
    C# can be used to create a variety of applications. The language does not place
    constraints on what you can do. It has been used for projects as diverse as dynamic
    Web sites, development tools, and compilers. (Jones, 2001)


    C# has been specifically designed to be simple and modern. It is an object-oriented
    and general purpose programming language. If you are already familiar with programming,
    you will easily recognize that C# borrows a range of key concepts for a variety
    of other programming languages, the most notable of which is Java.


    Let us now look at some important features of this language and why it should
    be used by programmers.


    +   1. Simple – C# removes some of the pitfalls and complexities of languages
    such as C++ and Java. As we mentioned earlier that it is familiar in many aspects
    to C++ as; statements, operators, expressions, and other functions are taken directly
    from C and C++. But the improvements made the language simpler.


    +   2. Modern – Features such as garbage collection, exception handling, extensible
    data types and code security makes a language modern and C# consists of all these.


    +   3. Object-Oriented- The keys to object-oriented language are the inheritance,
    encapsulation and polymorphism. C# supports all of these. Inheritance is a structured
    way of extending functionality and existing code into new packages and programs.
    Polymorphism is the capability of adapting to what needs to'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'done.


    +   4. Powerful and flexible- As mentioned earlier C# places no constraints on
    what can be done. You can create graphics, spreadsheets, compilers for other languages
    and word processors.


    +   5. The language of few words – C# uses a limited number of words and contains
    only handful of terms, called *keywords* (they have been explained in the next
    chapter). These keywords serve as the base on which the language''s functionality
    is built. You will learn about the keywords in the basic syntax chapter. (Alexx)


    +   6. Modular – C# is a modular language, its code can be written in chunks called
    classes. These classes contain routines called as member methods. These methods
    and classes can be reused in such a way that can be used from any of the other
    programs or applications. By passing pieces of information to the methods and
    classes, you can create useful and reusable code.


    # The Importance of the .NET Framework


    The .Net framework is a revolutionary platform that helps a programmer to write
    applications such as; windows applications, web applications, and web services.
    It has been designed in such a way that it can be used from any of the following
    languages: C++, C#, Jscript, COBOL, Visual Basic, etc. These languages can access
    the framework as well as communicate with each other.


    Theoretically speaking


    The .NET framework is compatible with a large range of programming languages.
    However, it is C# which is most commonly associated with this framework. It is
    even known as ‘THE .NET language’ in some circles. This is probably due to the
    fact that the development of the framework and the language took (IDE) took place
    at the same time.


    # Integrated Development Environment (IDE) for C#'
