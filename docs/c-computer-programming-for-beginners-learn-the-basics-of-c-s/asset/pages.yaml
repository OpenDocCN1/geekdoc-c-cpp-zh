  md: '# CHAPTER 2: BASIC SYNTAX OF C#


    As we know that C# is an object-oriented programming and in object-oriented programming
    methodology, a program consists of various objects that interact with each other
    by means of actions. These actions which are taken by an object are called as
    methods. The objects of the same kind are said to be in the same class or have
    the same type.


    Let us now understand the basics of C# syntax -


    +   1. The first statement in any C# program is using System;


    This keyword is used for including the namespaces in the program. A program can
    include multiple using statements.


    +   1. The class keyword is used for declaring a class.


    +   2. The comments in C# are used for explaining code. The compilers ignore the
    comment entries. The multiline comments in C# programs start with /* and end with
    the characters *//. The single line comments are indicated by ''//'' symbol


    +   3. The member variables are data members or attributes of a class, used for
    storing data.


    +   4. The member functions are set of statements that perform a specific task.
    The functions of a class are declared within the class.


    +   5. Instantiating a class – the main() method instantiates a class in a C#
    program.


    +   6. The identifier is a name used to identify a class, function, variable or
    any other user-defined item. Basic rules for naming classes in C# are as mentioned
    below:


    +   a) A name must begin with a letter that could be followed by a sequence of
    letters, underscore or digits (0-9). The first character in an identifier cannot
    be a digit.'
  merge: -1
  img_proc: true
