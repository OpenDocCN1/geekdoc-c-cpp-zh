    # Using delegates with events


    Events are user actions such as clicks, key press, mouse movements or some

    occurrence such as system generated notifications. The events are used for inter-

    process communication.


    Events are raised and declared in class and associated with the event handlers
    using

    delegates within the same class or some other class. The class containing the
    event is

    used to publish the event and is called as the publisher class, whereas, some
    other

    class that accepts this event is called the subscriber class.


    A publisher is an object that contains the definition of the event and the delegate.
    A

    publisher object invokes the event and it is notified to other objects. The

    other hand, subscriber is an object that accepts the event and provides an event

    handler.


    To declare an event inside a class, first delegate type for the event must be
