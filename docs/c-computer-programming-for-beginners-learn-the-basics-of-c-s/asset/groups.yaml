    # Loop control statements


    The loop control statements change execution from its normal sequence. When execution
    leaves a scope, all automatic objects that were created in that scope are destroyed.
    Following control statements are provided in C#


    +   1. Break statement –


    +   a) When a break statement is encountered inside a loop, the loop is immediately
    terminated and program control resumes at the next statement following the loop.


    +   b) This statement can also be used to terminate a case in the switch statement.


    In case you are using the nested loops, the execution of the innermost loop is
    stopped by the break statement and start executing the next line of code after
    the block.


    Syntax–


    ```

    break;

    ```


    (Tutorials Point)


    +   2. Continue statement –


    In C#, the continue statement somewhat work like break statement. It continue
    forces the next iteration of the loop to take place by skipping any code in between,
    instead of forcing termination.


    In case of for loop, continue statement causes the increment portions of the loop
    and the conditional test to execute. For the do...while and while loops; continue
    statements causes the program control passes to the conditional tests.


    Syntax –


    ```

    continue;

    ```'
