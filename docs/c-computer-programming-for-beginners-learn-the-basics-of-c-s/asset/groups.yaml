    These are the methods that only have the body, but no name. You need to specify
    the return type in an anonymous method; it is inferred from the return statement
    inside the method body.


    The anonymous methods are declared with the creation of the delegate instance,
    with a delegate keyword. Example for anonymous method is as follows –


    ```

    delegate void NumberChanger(int n);

