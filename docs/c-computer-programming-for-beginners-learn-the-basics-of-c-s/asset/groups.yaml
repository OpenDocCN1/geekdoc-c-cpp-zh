    \ used is known as print debugging. Although it is the most basic kind of debugging,\
    \ it is often used by advanced programmers due to its effectiveness in certain\
    \ situations.\n\nIn print debugging, the application is made to print a number\
    \ or text. This allows you to find out which sections of the code have been executed\
    \ and what are contained in the variables. In C#, the Console.Write() method can\
    \ be used for printing a status message or for displaying the contents of a specific\
    \ variable on the console.\n\nFor a few situations, this will be enough. On the\
    \ other hand, you will have much better tools to use when you are using a good\
    \ IDE such as Visual Studio or even the Express versions. The good thing is that\
    \ they are quite easy to use once you know the basic principles.\n\n# Introduction\
    \ to the Breakpoint\n\nThe breakpoint is the first thing that you need to learn\
    \ debugging. As the name suggests, a breakpoint marks a specific point in the\
    \ code where its execution will be taking a break. The application will not be\
    \ rendered useless. Instead, the breakpoint simply pause the execution of the\
    \ application.\n\nIf you are using Visual Studio or even the Express version,\
    \ it is quite easy to implement breakpoints. In those IDEs, you will notice that\
    \ there is a gray area located on the left hand side of the code. This is known\
    \ as the gutter, and a left click on this area will cause a red circle to appear.\
    \ This will be the breakpoint, and the debugger will stop the execution of the\
    \ application at this point.\n\nThese are just the basics of debugging. As you\
    \ advance as a C# programmer, you will automatically come to know the various\
    \ other kinds of debugging tools and methods apart from the most complicated aspects.\n\
    \n# CHAPTER 18: TIPS FOR C# BEGINNERS\n\nLike all programming languages, C# has\
    \ its own nuances and features. As a result, it is easy for a beginner to feel\
    \ overwhelmed by the language. For this reason, here are a few tips that can help\
    \ you overcome the problems you face as a beginner and take the next step into\
    \ becoming a full-fledged C# programmer.\n\n# Keep Practicing\n\nNobody becomes\
    \ an expert in anything overnight. This is most certainly true of computer programming.\
    \ It will certainly take a lot of time to develop the skills and procure the knowledge\
    \ required for calling yourself an expert. As such, you should remain patient\
    \ and keep practicing C#. At the same time, you should keep practicing a variety\
    \ of tasks within C#.\n\n# Don’t Get Hang Up\n\nThis is quite a common problem\
    \ with programmers, even those at the advanced level. The fact is there rarely\
    \ one best way of doing things in an object programming language like C#. Therefore,\
    \ you should not get fixed on a particular process or technique. It is certainly\
    \ possible that there are other processes which work better.\n\n# Strengthen Your\
    \ Base\n\nYou may learn to write code, but you must also know how each concept\
    \ or function comes together to make the code work. In other words, you need to\
    \ understand the fundamentals and the basics thoroughly. This will enable you\
    \ to understand why a piece of code works in what it does and what possible bugs\
    \ are leading to the problem in the execution. Therefore, you will become a better\
    \ developer.\n\n# Learn Some Advanced Ideas Extensively\n\nOf course, you shouldn’t\
    \ expect to master all the advanced techniques and ideas in C# within a few months\
    \ of starting it. However, it will help you progress if you take the time to learn\
    \ a few concepts in detail. You should become really good in working with those\
    \ few concepts. You are free to choose which concepts you want to\n"
  mdcn: "\n图形功能\n\n+ 16. System.Reflection – 此命名空间包含了允许开发者存储、创建和管理应用程序的类型。\n\n+ 17.\
    \ System.Timers – 此命名空间提供了计时器组件，允许你在指定的间隔上引发事件。\n\n+ 18. System.XML – 此命名空间包含了用于处理\
    \ XML 的类型。它支持如 XML 1.0、Schemas、XML 1.1 以及 XSL 标准。它还包含了读者和写入，用于快速读取和写入 XML 流。（Microsoft）\n\
    \n一旦你理解了这些库，与其他库一起将会变得简单得多。\n\n本章结束了 C# 各种特性的介绍。\n\n# 第 16 章：C# 中的异常处理（EXCEPTIONS）\n\
    \n程序执行过程中的问题被称为异常。异常提供了一种将控制从程序的一部分转移到另一个部分的方法。在 C# 中，异常处理基于四个关键字：`catch`、`try`、`throw`\
    \ 和 `finally`。\n\n- Catch – 异常处理器在你想处理的地方捕获异常。`catch` 关键字表示异常的捕获。\n- Try – 用于可能发生异常的代码块，由\
    \ `try` 块标识。它后面跟着一个或多个 `catch` 块。\n- Throw – 当程序抛出异常时，使用 `throw` 关键字完成。\n- Finally\
    \ – 无论异常是否抛出，都执行一组特定的语句。例如，如果打开了一个文件，那么无论是否发生异常，必须关闭它。\n\n# 语法\n\n让我们假设使用 `catch`\
    \ 和 `try` 关键字的组合来捕获异常。`catch/try` 块放置在可能生成异常的代码周围，其语法如下：\n\n```cs\ntry\n{\n  \
    \  // 异常的语句\n}\ncatch (Exception e1)\n{\n    // 异常处理代码\n}\ncatch (Exception e2)\n\
    {\n  // 异常处理代码\n}\ncatch (Exception eN)\n{\n  // 异常处理代码\n}\nfinally\n{\n  // 执行的语句\n\
    }\n```\n\n在 `try` 块引发异常的情况下，可以使用多个 `catch` 语句来处理不同的异常。\n\n# 异常类\n\nC# 中的异常由类表示。直接或间接派自\
    \ `System.Exception` 类的异常类。`System.Exception` 类是所有预定义异常的基类，而 `System.ApplicationException`\
    \ 类支持由应用程序生成的异常。因此，程序员应该了解以下派自 `System.Exception` 类的某些预定义类：\n\n1. System.IO.IOException\
    \ – 处理 I/O 错误。\n2. System.IndexOutOfRangeException – 处理数组索引超出范围生成的错误。\n3. System.NullReferenceException\
    \ – 处理引用空对象生成的错误。\n4. System.ArrayTypeMismatchException – 处理数组类型不匹配生成的错误。\n5.\
    \ System.DivideByZeroException – 处理除以零生成的错误。\n6. System.OutOfMemoryException –\
    \ 处理内存不足生成的错误。\n7. System.InvalidCastException – 处理类型转换期间生成的错误。\n8. System.StackOverflowException\
    \ – 处理栈溢出生成的错误。\n\nC# 提供了以 `catch` 和 `try` 块形式处理异常的结构化解决方案。通过这些块并使用 `catch`、`try`、`throw`\
    \ 和 `finally` 关键字来实现错误处理。在 C# 中，你也可以定义自己的异常。这些被称为自定义异常。自定义异常类派生自 `Exception` 类。（Tutorials\
    \ Point）\n\n# 第 17 章：学习调试的基础\n\n即使你对计算机编程略有了解，也应该听说过调试。这是所有软件和应用程序编程至关重要的过程。你会发现程序中存在错误。这些错误可能是简单的拼写错误或错误的语句。它们都被称为\
    \ bug（错误），并且会阻止你的程序正确执行。因此，这些 bug 需要通过调试来消除。\n\n当你编写书中所示的几个简单应用程序时，识别错误是非常的。你只需运行程序即可发现\
    \ bug。然而，随着时间的推移，你一定会开始编写数百行充满复杂语句的代码。由于涉及的高复杂度，确定 bug 将变得非常困难。\n\n在这种情况下，调试变成了一个非常有用的工具。因此，你必须花时间理解这个工具以成为一名更好的程序员。没有它，几乎无法纠正复杂代码中发现\
    \ bug。\n\n# 理解打印调试\n\n最常用的调试类型被称为打印调试（print debugging）。尽管它是最基本的调试，但在某些情况下，高级程序员经常使用它。\n\
    \n在打印调试中，让应用程序打印数字或文本。这允许你发现哪些代码部分已经执行以及变量中包含什么。在 C# 中，可以使用 `Console.Write()`\
    \ 方法打印状态消息或在控制台上显示特定变量的内容。\n\n对于某些情况，这就足够了。另一方面，当你使用如 Visual Studio 甚至 Express\
    \ 版本的良好 IDE 时，会有更好的工具可以使用。好处是，一旦你了解了基本原理，它们就非常好用。\n\n# 断点简介\n\n断点是你学习调试需要的第一件事。正如名称所示，断点标记了代码中的一个特定点，其执行将在此处中断。应用程序不会变得毫无用，相反，断点只是暂停应用程序的执行。\n\
    \n如果你使用的是 Visual Studio 甚至 Express 版本，实现断点是非常容易的。在这些 IDE 中，你会注意到代码左侧有一个灰色区域。这个区域被称为行槽（gutter），在该区域左键单击将会出现一个红圈。这将是断点，调试器将在此处停止应用程序的执行。\n\
    \n这些只是调试的基础。随着你作为 C# 程序员的进步，你将自动了解除复杂方面之外的各种调试工具和方法。\n\n# 第 18 章：给 C# 初学者的提示\n\
    \n与其他编程语言一样，C# 有它自己的细微差别和特征。因此，初学者可能会感到无所从。。由于，这里有一些提示可以帮助你克服作为初学者面临的问题，并迈向成为一名真正的\
    \ C# 程序员的一步。\n\n# 持续练习\n\n没有任何领域能一夜之间成为专家。对于计算机编程也是如此。这需要大量的时间来开发技能并获取被称为专家所需的知识。因此，你应该保持耐心并继续练习\
    \ C#。同时，你应该继续在 C# 中练习各种任务。\n"
