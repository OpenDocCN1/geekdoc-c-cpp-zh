    # Getting to Know Arrays


    An array will store a collection of different elements. The collection will have
    a fixed size, and all the elements will be of the same type. They are used for
    storing a collection of data. However, a better way of defining them would be
    to say that they are a collection of variables kept at contiguous memory locations.


    Array saves the trouble of declaring multiple individual variables. Instead, we
    just need to declare a single array variable and place the values required for
    them. Therefore, we do not have to create a list of variables as a0, a1, a2 and
    so on. Instead, we create an array and use a[0], a[1] and a[2] and so on.


    Remember that a specific element present in the array is accessible by means of
    an index. In C#, all arrays will have contiguous memory locations. The lowest
    address will correspond to the first element of the array while the highest address
    belongs to the last element.


    # Declaring Arrays


    In C#, if you wish to declare an array, you will have to make use of the following
    syntax.


    ```

    datatype[] arrayName;

    ```


