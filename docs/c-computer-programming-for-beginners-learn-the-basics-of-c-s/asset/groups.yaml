    The preprocessor directives give instruction to the compiler to preprocess the
    information before the actual compilation starts. The preprocessor directives
    with #, and only white-space characters may appear before a preprocessor directive
    on a line. One should keep in mind that these directives are not statements; therefore
    they do not end with a semicolon. (Weber, 2016)


    C# compiler does not have a separate preprocessor, but the directives are processed
    as if there was one. The preprocessor directives in C# are used to help in conditional
    compilation. A preprocessor directive must be the only instruction on a line.


