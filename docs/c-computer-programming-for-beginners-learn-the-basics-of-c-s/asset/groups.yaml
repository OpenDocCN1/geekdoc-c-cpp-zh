    **Char:** This data type represents 16-bit Unicode character, and it is used for
    storing only one character.


    **String:** This can be said to be an upgraded version of the char data type as
    it can be used for storing text. That is, it can store multiple chars instead
    of a single one. In C#, this data type is immutable. In other words, after the
    creation of a string, they are never changed. If you use methods which change
    a string, a new string is actually returned. The original one is not changed.


    # An Introduction to Variables


    Variables are crucial to programming. In any programming language, a variable
    is actually a storage location which has been associated name (referred to an
    identifier) and it contains some quantity of information which may be unknown
    or known. This information is referred to as the value. The identifier is used
    for referencing the stored value. During runtime, the identifier can be linked
    to a value, but this value may change as the program is executed.


    In C#, each variable has a specific type, which determines the size and layout
    of the variable''s memory range of values that can be stored within that memory
    and the set of operations that can be applied to the variable. (Tutorials Point)


