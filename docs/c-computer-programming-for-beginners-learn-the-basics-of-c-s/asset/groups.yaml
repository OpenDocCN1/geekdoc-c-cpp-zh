    data types. As C# is a strongly typed programming language, it is necessary for
    you to tell the compiler what data types you are going to use every time you want
    to declare a variable. Of course, variables are critical to any programming language.


    # Introduction to Data Types


    In C#, data types can be broadly classified into three types. They are discussed
    as follows.


    +   - Value Type: These data types can be directly assigned a value, and they
    are derived from the System.Value class. As this case, they contain the data directly.
    Some examples of data types are char, Int, and Bool.


    +   - Reference Type: These data types do not have the actual data kept in a variable.
    Instead, they have a reference to the variables. That means they actually refer
    to a specific memory location. It is possible to use multiple variables to refer
    to a specific memory location. In this case, if one variable changes the data
    present in the memory location, the other variables will automatically reflect
    the change. Some examples of reference types include string, dynamic, and object.


    +   - Pointer Type: These data types actually store the memory address of some
    other type. If you are familiar with C++ or C, you will understand that the pointer
    types in C# will have the same capabilities as that of the pointer types in those
    programming languages.


    # The Common Data Types


    There are a wide variety of data types used in C#. Of course, some of them will
    be used more often than other when you start programming in earnest. As a result,
    it will benefit you greatly if you start learning about the most widely used data
    types. Here are some of them to help you get started.


    Bool: This is one of simplest data types available as it represents Boolean value.'
