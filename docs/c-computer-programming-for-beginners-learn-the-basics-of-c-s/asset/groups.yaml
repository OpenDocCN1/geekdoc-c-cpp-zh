  mdcn: '

    专注于。它们可能是你在工作中经常遇到的内容，也可能是你非常感兴趣的内容。尝试精通少数几种技术比尝试掌握所有技术要容易得多。


    ## 看看资深程序员编写的代码


    学习 C# 概念和技巧的最佳方法之一是查看经验更丰富的程序员编写的代码。如果你在某个地方工作，可以轻松请求资深程序员向你展示他们的代码。不要忘记理解他们为什么要使用某种技术以及他们是如何使用的。或者，你也可以浏览在线上的开源项目。他们不一定是顶尖的程序员，但你仍然可以学到很多。当然，你必须避免盲目模仿他人的做法。只需理解其核心思想并尝试在自己的代码中使用它即可。


    ## 结语


    本书到此已结束。你现在已经掌握了被称为 C# 的面向对象编程语言的基础知识。你还学习了如何用这种语言编写一些基础程序，以及开始编写程序所需的准备工作。


    你现在可以在代码中使用一些基础语句和方法了。当然，你已经已经学习了如何声明和定义变量。更重要的是，你知道如何创建类，甚至在类中实现继承以创建代码块的层次结构。如果你愿意，还可以开始在代码中实现条件逻辑，使其更高级一些，特别是在循环和多个类的帮助下。


    你从书中汲取到的信息足够帮助你开始 C# 编程了。当然，还有很多内容需要了解和学习。作为一种流行的编程语言，它会定期进行更新。因此，总会有新颖且有趣的内容等待学习。在精通这门编程语言后，你可以轻松开始学习其他了的语言，如
    C 甚至 Java 和 Ruby。你甚至可以进入 Web 开发，因为 C# 是 .NET 框架的一部分。


    衷心感谢你选择这本书，希望它对你有所帮助。我也希望你已经建立起坚实的基础，可以将 C# 作为你的职业或爱好。祝你在 C# 的学习和未来发展中一切顺利！


