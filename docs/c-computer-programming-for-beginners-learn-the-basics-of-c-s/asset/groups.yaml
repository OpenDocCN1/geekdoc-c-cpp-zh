  mdcn: "\n\n(Krishnavanshi)\n\n对于具有一定编程经验的人来说，从 C++ 过渡到 C# 会相当容易。然而，对于初学者，C# 并不是一种难以学习的语言。使用\
    \ C# 有趣的部分在于探索新的公共语言运行时（CLR）库，它提供了许多以前必须手动编写的功能。.NET 框架为 Web 应用程序开发、多线程、窗口应用程序开发等提供了广泛的支持。\n\
    \n## 第 2 章：C# 基础语法\n\n众所周知 C# 是一种面向对象的编程语言，在面向对象的编程方法中，程序由各种对象组成，这些对象通过动作相互作用。对象执行的动作被称为方法（methods）。相同类型的对象被称为处于同一个类或具有相同的类型。\n\
    \n现在让我们理解 C# 语法的基础——\n\n- 1. 任何 C# 程序的第一个语句都是 `using System;` \n\n此关键字用于在程序中包含命名空间。程序可以包含多个\
    \ `using` 语句。\n\n- 1. `class` 关键字用于声明一个类。\n\n- 2. C# 中的注释用于解释代码。编译器会忽略注释内容。C#\
    \ 程序中的多行注释以 `/*` 开始，以 `*/` 结束。单行注释用 `//` 符号表示。\n\n- 3. 成员变量（member variables）是类的数据成员或属性，用于存储数据。\n\
    \n- 4. 成员函数（member functions）是执行特定任务的语句组。类的函数在类内部声明。\n\n- 5. 类实例化——`main()` 方法在\
    \ C# 程序中实例化类。\n\n- 6. 标识符（identifier）是用于标识类、函数、变量或任何用户定义项目的名称。C# 中类命名的基本规则如下所示：\n\
    \n- a) 名字必须以字母开头，后面可以跟一系列字母、下划线或数字 (0-9)。标识符的第一个字符不能是数字。\n\n- b) 不应包含嵌入的空格或符号，如\
    \ `- + ? & @ # * ( ) { } [ ]; : / ' . \\ \\ 和 `\"`。然而，可以使用下划线。\n\n- c) 最重要的是，它不应该是\
    \ C# 关键字。\n\n(Tutorials Point)\n\n## C# 关键字\n\n预定义给 C# 编译器的保留字称为关键字（keywords）。这些关键字不能用作标识符。然而，在必须将其用作标识符的情况下，你需要在前面加上\
    \ `@` 字符。C# 中的某些标识符在代码环境中具有特殊含义，被称为上下文关键字（contextual keywords）。下表列出了 C# 语言中的保留关键字上下文关键字。\n\
    \n## 保留关键字\n\n| as | abstract | bool | base | byte | case | break |\n| char |\
    \ catch | class | checked | continue | decimal | const |\n| delegate | default\
    \ | double | do | event | else | enum |\n| extern | explicit | finally | false\
    \ | float | for | fixed |\n| goto | foreach | implicit | if | in (generic modifier)\
    \ | int |\n| internal | interface | lock | long | is | new | namespace |\n| object\
    \ | null | out | operator | params | out (generic modifier) | override |\n| protected\
    \ | public | private | ref | sbyte | return | readonly |\n| short | sealed | stackalloc\
    \ | sizeof | struct | static | string |\n| this | throw | switch | try | unitof\
    \ | typeof | true |\n| unchecked | unsafe | ushort | long | void | virtual | using\
    \ |\n| while | volatile | | | | | | |\n\n## 上下文关键字\n\n| alias | add | descending\
    \ | ascending | get | form | dynamic |\n|---|---|---|---|---|---|---|\n| group\
    \ | into | global | let | join | partial (type) | orderby |\n| remove | partial\
    \ (method) | set | | select | | |\n\n## C# 中每个保留关键字的含义\n\n- 1. Abstract – 它表示被修改的内容具有不完整或缺失的实现。`abstract`\
    \ 修饰符可以用于方法、类、属性、事件和索引器。\n\n- 2. As – 此关键字将对象转换为不同的类型。如果对象类型不兼容，则该关键字返回 `null`。\n\
    \n- 3. Base – 它描述你想要引用基类获取请求的信息，而不是在当前实例类中。\n\n- 4. Bool – 它用于字段、属性、方法和变量声明，以及在\
    \ `typeof` 和转换操作中，作为 .NET 框架结构 `System.Boolean` 的别名，即代表 True 或 False。\n\n方法（Methods）——这些是包含代码的类成员。它们可能包含参数列表、返回值以及泛型声明。它们可以是静态的（static）或实例的（instance）。\n\
    \n属性（Property）——这些是使用字段语法暴露方法功能的类成员。像方法一样，它们可以是静态的或实例的。\n\n- 5. Break – 此关键字用于退出循环或\
    \ `switch` 块。\n\n- 6. Byte – 此关键字用于字段、属性、方法和变量声明，以及在 `typeof` 和转换操作中，作为 .NET 框架结构\
    \ `System.Byte` 的别名，即代表 8 位无符号整数，取值范围在 0-255 之间。\n\n- 7. Case – 此关键字通常用于 `switch`\
    \ 语句。\n\n- 8. Catch – 它用于识别执行的语句或语句块。如果在封闭 `try` 块体中发生异常，则 `catch` 子句位于 `try`\
    \ 子句之前。可选地可以跟一个 `finally` 子句。\n\n- 9. Char – 此关键字用于字段、属性、方法和变量声明，以及在 `typeof`\
    \ 和转换操作中，作为 .NET 框架 `System.Char` 的别名，即代表 Unicode 字符，其取值范围在 0-65,535 之间。\n\n-\
    \ 10. Checked and Unchecked – 这些运算符用于控制整型算术转换和操作的溢出检查上下文。\n\n- 11. Class – 此关键字用于声明类。\n\
    \n- 12. Const – 此关键字用于字段和局部变量声明，使变量成为常量。因此，它与其声明的程序集或类关联，而不是与类的实例或方法调用。\n\n- 13.\
    \ Continue – 它可以用于方法中的任何循环内部。此关键字的目的是结束当前循环迭代并进入下一次迭代。\n\n- 14. Decimal – 此关键字用于字段、属性、方法和变量声明，以及在\
    \ `typeof` 和转换操作中，作为 .NET 框架 `System.Decimal` 的别名，即代表有符号 128 位小数。\n\n- 15. Default\
    \ – 此关键字可以用于泛型代码或 `switch` 语句。\n\n- 16. Delegate – 它用于声明委托。用于获取类方法的可调用引用的编程结构被称为委托（delegate）。\n\
    \n- 17. Do – 它用于识别 `do` 循环的开始。\n\n- 18. Double – 它用于字段、属性、方法和变量声明，以及在 `typeof`\
    \ 和转换操作中，作为 .NET 框架 `System.Double` 的别名。\n\n- 19. Else – 它识别 `if` 语句的 `else` 子句。\n\
    \n- 20. Enum – 它识别枚举。枚举是一种数据类型，通过为每个项目分配一个名称（标识符）来枚举一组项目，同时暴露用于排序元素的基类型。枚举声明如下\
    \ =\n\n```\nenum weekday { Monday, Tuesday, Wednesday, Thursday, Friday, Saturday,\
    \ Sunday }\n```\n\n- 21. Event – 此关键字用于声明事件。C# 中的事件是向客户端发布通知的类成员。它们只被触发，不被赋值。\n\
    \n- 22. Explicit – 此关键字用于创建只有通过显式类型转换才能使用的类型转换运算符。\n\n- 23. Extern – 此关键字表示所调用的方法存在\
    \ DLL（动态链接库）中。\n\n- 24. False – 此关键字是布尔常量值。布尔在 C# 中是自己的类型，不能转换为其他原始类型。\n\n- 25.\
    \ Finally – 它用于识别 `try-catch` 块之后执行的语句或语句块。无论关联的 `try` 块是否遇到异常，它都会在 `return` 语句之后执行。为了执行清理活动，使用\
    \ `finally` 块。\n\n- 26. Fixed – 此关键字用于防止垃圾回收器重定位变量。\n\n"
