    # 第 4 章：理解数据类型和变量


    每当你使用编程语言时，你都会遇到数据类型。由于 C# 是一种强类型编程语言，每当你想要声明变量时，都有必要告诉编译器你将使用什么数据类型。当然，变量对任何编程语言都是至关重要的。


    ## 数据类型简介


    在 C# 中，数据类型大致可以分为三类。讨论如下：


    - 值类型（Value Type）：这些数据类型可以直接赋值，它们派生自 `System.Value` 类。在这种情况下，它们直接包含数据。数据类型的示例包括
    `char`、`Int` 和 `Bool`。


    - 引用类型（Reference Type）：这些数据类型在变量中没有实际数据。相反，它们拥有变量的引用。这意味着它们实际上引用特定的内存位置。可以使用多个变量引用特定的内存位置。在这种情况下，如果一个变量了内存位置中的数据，其他变量将自动反映该变化。引用类型的示例包括
    `string`、`dynamic` 和 `object`。


    - 指针类型（Pointer Type）：这些数据类型实际上存储其他类型的内存地址。如果你熟悉 C++ 或 C，你将理解 C# 中的指针类型将与这些编程语言中的指针类型相同的能力。


    ## 常用数据类型


    C# 中使用了多种数据类型。当然，当你开始认真编程时，其中某些会比其他更频繁地。因此，如果你开始学习最广泛使用的数据类型，将大有裨益。以下是一些帮助你入门的类型。


    Bool：这是可用的最简单的数据类型之一，因为它代表布尔值，例如，它只有两个值：true 或 false。理解这种类型很重要，特别是在使用逻辑运算符（如 `if`
    语句）时。默认情况下，它的值为 `false`。


    **Byte：** 这种数据类型表示一个 8 位无符号整数。在存储数字时，它的范围是 0 到 255。默认情况下，该数据类型的值为 0。


    **Int：** 这实际上是 integer 的缩写，是一种用于存储不带小数数字的数据类型，类似于 `byte` 类型。但与 `byte` 不同，`Int`
    的范围是 -2,147,483,648 到 2,147,483,647。如果你正在处理数字，你很可能会使用这种类型。


    **Char：** 这种数据类型表示 16 位 Unicode 字符，仅用于存储单个字符。


    **String：** 这可以被认为是 `char` 数据类型的升级版，因为它可以用于存储文本。也就是说，它可以存储多个 `char` 而不是单个。在 C#
    中，这种数据类型是不可变的。换句话说，在创建字符串后，它们永远不会被改变。如果你使用更改字符串的方法，实际上会返回一个新字符串。原始字符串不会被改变。


    ## 变量引论


    变量对编程至关重要。在任何编程语言中，变量实际上是一个关联了名称（称为标识符 identifier）的存储位置，它包含某些未知或已知的信息。这些信息被称为值（value）。标识符用于引用所存储的值。在运行时，标识符可以链接到一个值，但这个值可能会随着程序的执行而改变。


    在 C# 中，每个变量都有特定的类型，该类型决定了变量内存范围的大小和布局、在该内存中可以存储的值范围，以及可以应用于变量的操作set。(Tutorials
    Point)


    下表显示了 C# 中基本值类型的分类：


    | 类型 | 示例 |

    |---|---|

    | 浮点类型 | Float and double |

    | 整数类型 | Sbyte, short, byte, int, ushort, unit, ulong, long and char |

    | 布尔类型 | 按分配的 true 或 false 值 |

    | 小进制类型 | Decimal |

    | 可空类型 | Nullable types |


