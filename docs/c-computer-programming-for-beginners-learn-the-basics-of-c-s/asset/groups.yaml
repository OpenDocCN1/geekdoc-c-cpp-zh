    \ following parts –\n\n- 1. Assembly manifest i.e. name, version and language\n\
    - 2. CIL code (logic part)\n- 3. Type Information (Datatype)\n- 4. Resources\n\
    \nAssembly versioning is a feature introduced in .Net recently. It allows two\
    \ versions of the same component that exists in a single folder side-by-side and\
    \ in a single machine. A version number is provided by the programmer and is not\
    \ controlled by .Net software.\n\nThere are two types of assemblies –\n\n- 1.\
    \ Private assembly (.exe) - it can be used in a single application.\n- 2. Shared\
    \ assembly (or class library) (.dll) – it can be used in multiple applications.\n\
    \n## Preprocessor Directives\n\nThe preprocessor directives give instruction to\
    \ the compiler to preprocess the information before the actual compilation starts.\
    \ The preprocessor directives with #, and only white-space characters may appear\
    \ before a preprocessor directive on a line. One should keep in mind that these\
    \ directives are not statements; therefore they do not end with a semicolon. (Weber,\
    \ 2016)\n\nC# compiler does not have a separate preprocessor, but the directives\
    \ are processed as if there was one. The preprocessor directives in C# are used\
    \ to help in conditional compilation. A preprocessor directive must be the only\
    \ instruction on a line.\n\nFollowing table lists all the preprocessor directives\
    \ in C#\n\n| #undef | It allows you to understand-define a symbol. |\n| #define\
    \ | It defines a sequence of characters, called symbol. |\n| #else | It allows\
    \ to create a compound conditional |\n| #if | It allows testing a symbol or symbols\
    \ to see if they evaluate to true. |\n| #elif | It allows creating a compound\
    \ conditional directive |\n| #line | It lets you modify the compiler's line number\
    \ and the file name output for errors and warnings. |\n| #endif | Specifies the\
    \ end of conditional directive. |\n| #error | It allows generating an error from\
    \ a specific location in your code. |\n| #region | It lets you specify a block\
    \ of code that you can collapse or expand when using the outlining feature of\
    \ the Visual studio Code Editor. |\n| #warning | It allows generating a level\
    \ one warning from a specific location in your code. |\n| #endregion | It marks\
    \ the end of the #region block |\n\n(Weber, 2016)\n\n## Conditional Directives\n\
    \nThe conditional directives are useful for testing a symbol or symbols to check\
    \ if they evaluate to true. You can use #if directive to create a conditional\
    \ directive. If they do evaluate to true, the compiler evaluates all code between\
    \ #if and the next directive.\n\nSyntax –\n\n#if symbol [operator symbol]....\n\
    \nHere, symbol is the name of the symbol which you want to test. You can also\
    \ prepend symbol or false with the negation operator. The operator symbol is used\
    \ for evaluating the symbol. The operators could be either of the following –\n\
    \n* Equality (==)\n* Inequality (!)\n* And (&&)\n\nOperators with parentheses\
    \ can be used to group symbols.\n\nThese directives are used for compiling code\
    \ for a debug build or when compiling for a specific configuration. A conditional\
    \ directive beginning with #if must explicitly be terminated with a #endif directive.\
    \ (Weber, 2016)\n\n## Regular Expressions\n\nA pattern that can be matched against\
    \ an input text is called a regular expression. The .Net framework provides a\
    \ regular expression engine that allows such matching. A pattern consists of one\
    \ or more operators, character literals, or constructs. (Tutorials Point)\n\n\
    ### Regex class\n\nThe Regex class is used for representing a regular expression.\
    \ The following methods are commonly used –\n\n- public bool IsMatch(string input)-\
    \ it indicates whether the regular expression specified in the Regex constructor\
    \ finds a match in a specified input string.\n- public bool IsMatch(string input,\
    \ int start)- it indicates whether the regular expression specified in the Regex\
    \ constructor finds a match in the specified input string, beginning at the specified\
    \ starting position in the strong.\n- public static bool IsMatch(string input,\
    \ string pattern)- it indict whether the specified regular expression finds a\
    \ match in the specified input string.\n- public string Replace(string input,\
    \ string replacement)- it replaces all strings that match a regular expression\
    \ pattern with a specific replacement string, in a specified input string.\n-\
    \ public MatchCollection Matches(string input)- it searches the specified input\
    \ string for all occurrences of a regular expression.\n- public string[ ] Split(string\
    \ input)- splits an input into an array of substrings at the positions defined\
    \ by a regular expression pattern specified in the Regex constructor.\n\n# Attributes\n\
    \nA declarative tag is used to convey information to runtime about the behaviors\
    \ of\n"
  mdcn: "\n\n```c\npublic delegate string MyDel(string str);\n```\n\n事件本身使用 `event`\
    \ 关键字进行声明。\n\nevent MyDel MyEvent;\n\n## 易用泛型\n\nC# 泛型允许推迟方法或类中编程元素的数据类型规范，直到其在程序中被实际使用。这意味着泛型允许你编写可以与任何数据类型工作的方法或类。方法或类的规范使用替代数据类型的占位参数来编写。当编译器遇到方法或类的函数调用的构造函数时，它会生成处理特定数据类型的代码。\n\
    \n### 泛型的特征\n\n泛型通过以下方式丰富你的程序：-\n\n- 1. 泛型可以帮助你最大化重用性、性能和类型安全。\n- 2. 它允许你创建泛型集合类。.NET\
    \ 框架类库在 `System.Collections.Generic` 命名空间包含了几个新的泛型集合类。\n- 3. 它允许你创建自己的泛型接口、方法、类、委托和事件。\n\
    - 4. 你可以创建带有约束的泛型类，以便访问针对特定数据类型的方法。\n- 5. 通过反射，你可以在运行时获取泛型数据类型中所使用的类型信息。\n\n##\
    \ 理解简单多线程\n\n线程被定义为程序的执行路径。它定义了唯一的控制流。如果你的应用程序涉及复杂且耗时的操作，那么设置不同的执行路径或线程将很有帮助，每个线程执行一项特定的任务。线程使用的一个常见示例是现代操作系统对并发编程的实现。线程的使用提高了应用程序的效率并减少了\
    \ CPU 周期的浪费。\n\n为了让程序同时执行多个任务，可以将其分为更小的线程。\n\n## 线程生命周期\n\n线程的生命周期从创建 `System.Threading.Thread`\
    \ 类对象开始，到线程完成执行或终止时结束。线程生命周期中的各种状态为——\n\n- a) 未启动状态（Unstarted state）——线程实例已创建但未调用\
    \ `Start` 方法的情况。\n- b) 就绪状态（Ready state）——线程准备好运行并正在等待 CPU 周期的情况。\n- c) 不可运行状态（Not\
    \ Runable State）——在以下情况下线程不可执行：\n    - 调用了 `Wait` 方法\n    - 调用了 `Sleep` 方法\n \
    \   - 被 I/O 操作阻塞\n- d) 死亡状态（Dead state）——线程完成执行或被中止的情况。\n\n## 主线程\n\n`System.Threading.Thread`\
    \ 类用于在 C# 中处理线程。它允许在多线程应用程序中访问和创建单个线程。进程中第一个执行的线程被称为主线程。当 C# 程序开始执行时，会自动创建主线程。使用\
    \ `Thread` 类的线程被称为主线程的子线程。可以使用线程类的 `CurrentThread` 属性访问线程。\n\n创建线程——线程通过扩展 `Thread`\
    \ 类来创建。扩展后的类类调用 `Start()` 方法开始子线程执行。例如——\n\n```csharp\nusing System;\nusing System.Threading;\n\
    \    public static void CallToChildThread()\n{\n    Console.WriteLine(\"Child\
    \ thread starts\");\n}\n    static void Main(string[] args)\n{\n    ThreadStart\
    \ childref = new ThreadStart(CallToChildThread);\n    Console.WriteLine(\"In Main:\
    \ Creating the child thread\");\n    Thread childThread = new Thread(childref);\n\
    \    childThread.start();\n    Console.ReadKey();\n}\n```\n\n```csharp\nnamespace\
    \ MultithreadingApplication\n{\n    class ThreadCreationProgram\n    {\n    }\n\
    }\n```\n\n执行上述代码后——\nIn Main: Creating the Child thread\nChild thread starts\n\
    \n(Tutorial Point)\n\n## 程序集版本控制\n\n程序集（Assembly）也被称为 .Net 应用程序的构建。它是应用程序部署和版本控制的基本单元。程序集可以是\
    \ `.exe` 或 `.dll` 文件。程序集结构由以下部分组成——\n\n- 1. 程序集清单（Assembly manifest），即名称、版本和语言\n\
    - 2. CIL 代码（逻辑部分）\n- 3. 类型信息（数据类型）\n- 4. 资源\n\n程序集版本控制是 .Net 最近引入的一项功能。它允许同一个组件的两个版本在同一个文件夹和同一机器上并存。版本号由程序员提供，不受\
    \ .Net 软件控制。\n\n程序集有两种类型——\n\n- 1. 私有程序集（.exe）——可以在单个应用程序中使用。\n- 2. 共享程序集（或类库）（.dll）——可以在多个应用程序中使用。\n\
    \n## 预处理器指令\n\n预处理器指令指示编译器在实际编译开始之前对信息进行预处理。在以 `#` 开头的预处理器指令之前，行中只能出现空白字符。应该记住，这些指令不是语句；因此它们不以分号结束。（Weber,\
    \ 2016）\n\nC# 编译器没有单独的预处理器，但指令的处理方式就像存在一个预处理器一样。C# 中的预处理器指令用于帮助条件编译。一个预处理器指令必须是行中的唯一指令。\n\
    \n下表列出了 C# 中所有的预处理器指令\n\n| #undef | 它允许你取消定义（undefine）一个符号。 |\n| #define | 它定义了一个称为符号的字符序列。\
    \ |\n| #else | 它允许创建一个复合条件。 |\n| #if | 它允许测试一个符号或多个符号以查看它们的值是否为真。 |\n| #elif |\
    \ 它允许创建复合条件指令。 |\n| #line | 它允许你修改编译器用于错误和警告的输出的行号和文件名。 |\n| #endif | 指明条件指令的结束。\
    \ |\n| #error | 它允许从代码中的特定位置生成错误。 |\n| #region | 它允许你指定一个代码块，当在使用 Visual Studio\
    \ 代码编辑器的大纲功能时，可以对其进行折叠或展开。 |\n| #warning | 它允许从代码中的特定位置生成一级警告。 |\n| #endregion\
    \ | 它标记 #region 块的结束。 |\n\n(Weber, 2016)\n\n## 条件指令\n\n条件指令用于测试一个符号或多个符号，以检查它们的值是否为真。你可以使用\
    \ `#if` 指令来创建条件指令。如果它们的值为真，编译器将评估 `#if` 到下一个指令之间的所有代码。\n\n语法——\n\n`#if symbol\
    \ [operator symbol]....`\n\n在这里，`symbol` 是你想要测试的符号名称。你也可以在否定运算符后前加上 `symbol` 或\
    \ `false`。`operator symbol` 用于评估符号。运算符可以是以下任意一种——\n\n* 等 (==)\n* 不等 (!)\n* 与 (&&)\n\
    \n可以使用括号组合符号。\n\n这些指令用于为调试构建编译代码，或为特定配置进行编译。以 `#if` 开头的条件指令必须显式用 `#endif` 指令终止。（Weber,\
    \ 2016）\n\n## 正则表达式\n\n与输入文本匹配的模式被称为正则表达式。.Net 框架提供了一个正则表达式引擎允许这种匹配。模式由一个或多个运算符、字符字面量或构造组成。（Tutorials\
    \ Point）\n\n### Regex 类\n\n`Regex` 类用于表示正则表达式。常用的方法有——\n\n- public bool IsMatch(string\
    \ input)-它指示 Regex 构造函数中指定的正则表达式是否在指定的输入字符串中找到匹配。\n- public bool IsMatch(string\
    \ input, int start)-它指示 Regex 构造函数中指定的正则表达式是否在指定的输入字符串中从指定的起始位置开始找到匹配。\n- public\
    \ static bool IsMatch(string input, string pattern)-它指示指定的正则表达式是否在指定的输入字符串中找到匹配。\n\
    - public string Replace(string input, string replacement)-它将输入字符串中所有匹配正则表达式模式的字符串替换为指定的替换字符串。\n\
    - public MatchCollection Matches(string input)-它在指定的输入字符串中搜索正则表达式的所有出现项。\n- public\
    \ string[ ] Split(string input)-根据 Regex 构造函数中指定的正则表达式模式，将输入分割为子字符串数组。\n\n# 属性\n\
    \n声明式标签用于向运行时提供有关行为的信息\n\n"
