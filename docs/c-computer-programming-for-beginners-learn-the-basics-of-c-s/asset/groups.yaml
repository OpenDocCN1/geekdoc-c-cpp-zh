    \ the address of another variable, which means the direct address of the memory\
    \ location. Like any variable or constant, you must declare a pointer before you\
    \ can use it to store any variable address. The typical form to declare a pointer\
    \ is:\n\n`type*var-name;`\n\nYou can retrieve the data stored at the located referenced\
    \ by the pointer variable, by using the `ToString()` method.\n\n(Yogesh Joshi,\
    \ 2016)\n\n### Accessing array elements using a pointer\n\nAn array name and a\
    \ pointer to a data type same as the array data, are not the same variable type\
    \ in C#. Example – `int[] jp` and `int *p` are not same type. Here, you can increment\
    \ the pointer variable p because it is not fixed in memory, but an array address\
    \ is fixed in memory, therefore you cannot increment that.\n\nIn order to access\
    \ data using pointer variable, you need to fix the pointer using the fixed keyword.\
    \ (Tutorials Point)\n\n# C# Class library\n\nThe .Net framework is a huge library\
    \ made of various classes, value types, interfaces that provide access to system\
    \ functionality. It is the foundation on which .Net framework components, applications\
    \ and controls are built. Most Visual C# development projects use the .Net Class\
    \ library extensively for everything from file system access and string manipulation\
    \ to Windows forms and XML parsing.\n\nWe are listing some commonly used namespaces\
    \ and namespace categories in the class library here -\n\n- 1. System - this namespace\
    \ contains fundamental classes and base classes that define commonly-used value\
    \ and reference data types, interfaces, event handlers, attributes and processing\
    \ exceptions.\n- 2. System.Activities – it contains all classes which are necessary\
    \ to create and work with Windows Workflow Foundation.\n- 3. System.Directory\
    \ – this namespace contains types that provide access to Active Directory.\n-\
    \ 4. System.Collections – it contains types that define various specialized, standard\
    \ and generic collection objects.\n- 5. System.Diagnostics – it defines types\
    \ that provide the ability to diagnose application. This includes performance\
    \ counters, event logging, tracing and interaction with system processes.\n- 6.\
    \ System.AddIn – this namespace contain types used to identify, register, activate\
    \ and control add-ins. It also allows to communicate with a host application.\n\
    - 7. System.Globalization – it defines types that define culture-related information,\
    \ including country, region, language, calendars, currency, dates, numbers and\
    \ sort order for strings.\n- 8. System.CodeDom – this namespace contains classes\
    \ that represent elements of a source code document. This supports the generation\
    \ and compilation of source code in supported programming languages.\n- 9. System.Security\
    \ – it contains classes that represent the .Net framework security system and\
    \ permissions.\n- 10. System.IO – this namespace contains types that support input\
    \ and output. It also includes the ability to read and write data to streams,\
    \ compress data in streams, create and use isolated stores, map files to an application’s\
    \ logical address space, control multiple data objects in a single container,\
    \ communicate using anonymous or named pipes, implement custom logging and to\
    \ handle the flow of data.\n- 11. System.Threading – it defines types that enable\
    \ multithreading programming. A child namespace provides types that simplify the\
    \ work of writing concurrent and asynchronous code.\n- 12. System.Text – it defines\
    \ types that support various regular expressions, character encodings and a more\
    \ efficient mechanism for manipulating strings.\n- 13. System.Configuration –\
    \ this namespace contains types for handling configuration data, such as data\
    \ in application configuration files or machine.\n- 14. System.Data – this namespace\
    \ contains classes for accessing and managing data from diverse sources.\n- 15.\
    \ System.Drawing – this namespace contains types that support basic GDI+\n"
  mdcn: "\n程序中的各种元素，如方法、类、枚举器、结构体、程序集等被称为属性（attribute）。通过使用属性，你可以为程序添加声明性信息。声明性标签通过放置在所用元素上方的方括号（[[]]）来表示。\n\
    \n属性用于向程序添加元数据、编译器指令以及其他信息，如描述、注释、类、方法等.Net 框架提供了两种类型的属性：\n\n- 预定义属性（Pre-defined\
    \ attribute）\n- 自定义属性（Custom built attribute）\n\n指定属性的语法如下：\n\n```\n[attribute(positional_parameters,\
    \ name_parameter=value, ...)]\n```\n\n### 元素 (Element)\n\n属性的值及其名称指定在方括号内，位于应用于该元素之前。名称参数指定可选信息，而位置参数指定基本信息。\n\
    \n有三个预定义属性：\n\n- a) 属性用法 (Attribute usage) - 它描述了如何使用自定义属性类。Attribute usage 指定了属性可以应用于哪些项类型。\n\
    - b) 条件 (Conditional) – 它标记了一个条件方法，该方法的执行取决于指定的预处理标识符。它会根据指定的值（如 Trace 或 debug）导致方法调用的条件编译。示例\
    \ – 在调试时显示变量的值。\n- c) 废弃 (Obsolete) – 它标记了一个不应使用的程序实体。此预定义属性允许你通知编译器丢弃特定的目标元素。例如\
    \ – 当类中使用新方法但你仍想保留该类中的旧方法时，可以通过显示一条“应使用新方法代替旧方法”的消息来将其标记为废弃。\n\n创建自定义属性 – .Net\
    \ 框架允许创建自定义属性，这些属性可以存储在运行时检索的声明性信息。根据设计标准和应用需求，信息可以与任何目标元素相关。（Tutorials Point）\n\
    \n# C# 中的匿名方法 (The Anonymous methods in C#)\n\n如之前，委托（delegates）用于引用与委托签名相同的方法。这意味着你可以使用委托对象调用可以被委托引用的方法。\n\
    \n匿名方法提供了一种将代码块作为委托参数传递的技术。这些方法只有方法体而没有名称。你需要在匿名方法中指定返回类型；该返回类型是从方法体内的 `return`\
    \ 语句推断出来的。\n\n匿名方法在创建委托实例时使用 `delegate` 关键字进行声明。匿名方法的示例如下：\n\n```\ndelegate void\
    \ NumberChanger(int n);\n```\n\n```\nNumberChanger nc = delegate(int x)\n{\n \
    \   Console.WriteLine(\"Anonymous Method: {0}\", x);\n};\n```\n\n在这里，代码块 `Console.WriteLine(\"\
    Anonymous Method: {0}\", x);` 是匿名方法的体。\n\nC# 的编程特性之一是 Lambda 表达式。Lambda 表达式是一种匿名方法，你可以用它创建表达式或委托树类型。通过使用这种表达式，你可以编写可以作为参数传递或作为函数返回值的局部函数。Lambda\
    \ 表达式对于编写 LINQ（语言集成查询）表达式特别有帮助。“语言集成”意味着 LINQ 是编程语言语法的一部分，而“查询”解释了 LINQ 的作用，即\
    \ LINQ 用于查询数据，且 C# 具有 LINQ 能力。LINQ 可以查询不同类型的数据，包括关系型、XML 甚至对象。\n\n要创建 Lambda 表达式，你需要在\
    \ lambda 运算符 `=>` 的左侧指定输入参数（如果有）。语句块或表达式放在另一侧。示例 -\n\n```\nx => x *\n```\n\n此\
    \ Lambda 表达式指定了一个名为 x 的参数，并返回 x 的平方值。\n\n（Tutorials Point）\n\n# 不安全代码 (The Unsafe\
    \ Codes)\n\n在 C# 中，当函数或代码块被 `unsafe` 修饰符标记时，允许在其中使用指针变量。不安全或未托管代码是使用指针变量的代码块。\n\
    \n### 什么是指针？(What is a pointer?)\n\n指针是一个变量，其值为另一个变量的地址，这意味着内存位置的直接地址。像任何变量或常量一样，你必须在使用它存储任何变量地址之前对其进行声明。声明指针的典型形式为：\n\
    \n`type*var-name;`\n\n你可以通过使用 `ToString()` 方法获取由指针变量引用的位置处存储的数据。\n\n（Yogesh Joshi,\
    \ 2016）\n\n### 使用指针访问数组元素 (Accessing array elements using a pointer)\n\n在 C# 中，数组名和指向与数组数据相同的数据类型的指针不是同一种变量类型。示例\
    \ – `int[] jp` 和 `int *p` 不是同一类型。在这里，你可以递增指针变量 p，因为因为它在内存中不是固定的，但数组地址在内存中是固定的，因此你不能对其进行递增。\n\
    \n为了使用指针变量访问数据，你需要使用 `fixed` 关键字固定指针。（Tutorials Point）\n\n# C# 类库 (C# Class library)\n\
    \n.Net 框架是一个由各种类、值类型、接口组成的巨大库，这些内容提供了对系统功能的访问。它是 .Net 框架组件、应用程序和控件的基础。大多数 C# 项目广泛使用类库来实现从文件系统访问、字符串处理到\
    \ Windows 表单和 XML 解析的所有功能。\n\n这里列出了一些常用的命名空间和空间分类：\n\n1. System – 该命名空间包含定义基础类和引用类型、接口、事件处理器和属性。\n\
    2. System.Activities – 它包含创建和使用 Windows Foundation 所需的所有类。\n3. System.Directory\
    \ – 该命名空间包含提供访问 Active Directory 的类型。\n4. System.Collections – 它包含定义各种专用、标准和泛型对象的类型。\n\
    5. System.Diagnostics – 它定义了提供诊断能力的类型，包括性能计数器、事件日志、跟踪以及与系统的交互。\n6. System.AddIn\
    \ – 该命名空间包含用于识别、注册、激活和控制插件（add-ins）的类型。它还允许与主机应用程序通信。\n7. System.Globalization\
    \ – 它定义了文化相关信息，包括国家、地区、语言、日历、货币、日期、数字和字符串排序顺序。\n8. System.CodeDom – 该命名空间包含表示源码元素的类。它支持支持的语言的源码生成和编译。\n\
    9. System.Security – 它包含表示 .Net 框架安全系统和权限的类。\n10. System.IO – 该命名空间包含支持输入输出的类型。它包括对流进行读写、压缩流数据、创建和使用隔离存储、将文件映射到应用程序逻辑地址空间、使用匿名或命名管道通信、实现自定义日志以及处理数据流。\n\
    11. System.Threading – 它定义了多线程编程的类型。子命名空间提供了简化并发和异步代码编写工作的类型。\n12. System.Text\
    \ – 它定义了支持各种正则表达式、编码以及更高效字符串处理机制的类型。\n13. System.Configuration – 该命名空间包含处理配置数据的类型，例如应用程序配置文件或机器配置。\n\
    14. System.Data – 该命名空间包含从各种源访问和管理数据的类。\n15. System.Drawing – 该命名空间包含支持基本 GDI+\
    \ 的类型。\n\n"
