  md: '# 8.1.1 Batch Operation


    For those few unfamiliar with the term, *batch operation* of any program is simply
    the execution of the program, from beginning to end, without interaction from
    the user once the program is launched. Most desktop programs do not run in batch
    mode. However, batch operation is still very important in many branches of programming,
    such as scientific computing. Perhaps of greater interest, for those of you employed
    by large corporations, your payroll is probably run by a program operating in
    batch mode.


    Let’s be honest. Batch operation for pdCalc, other than maybe for testing, is
    not a very useful extension. I’ve included it mainly because it demonstrates how
    trivially a well-designed CLI can be extended to add a batch mode.


    Recall from Chapter 5 that pdCalc’s CLI has'
