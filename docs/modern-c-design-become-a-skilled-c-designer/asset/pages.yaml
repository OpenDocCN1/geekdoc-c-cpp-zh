- pgno: 545
  md: 'pluginsTest . While I like to believe that I have been diligent in testing
    pdCalc thoroughly, I am certain of two things: I could have tested the code more,
    and bugs will be found after publication. I now detail the contents of each of
    the directories undertest.


    # The testDriver Directory


    The testDriver directory contains a single source file,main.cpp. This file sets
    up the Qt Test environment and registers all of the individual test modules.main.cpp
    compiles into thetestPdCalc executable (testPdCale.exe in Windows), which is responsible
    for running all of the unit tests.


    # The utilitiesTest Directory


    TheutilitiesTest directory contains the files necessary for testing the utilities
    module. The files contained in this directory are listed in Table B-4.'
  merge: -1
