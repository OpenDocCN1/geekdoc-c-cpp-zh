  md: known as the non-virtual interface (NVI) pattern. The NVI pattern states that
    polymorphic interfaces should always be defined using non-virtual public functions
    that forward calls to private virtual functions. The reasoning behind this pattern
    is quite simple. Since a base class with virtual functions acts as an interface
    class, clients should be accessing derived class functionality only through the
    base class’s interface via polymorphism. By making the public interface nonvirtual,
    the base class implementer reserves the ability to intercept virtual function
    calls before dispatch in order to add preconditions or postconditions to the execution
    of all derived class implementations. Making the virtual functions private forces
    consumers to use the non-virtual interface. In the trivial case where no precondition
    or postcondition is needed, the implementation of the non-virtual function reduces
    to a forwarding call to the virtual function. The additional verbosity of insisting
    on the NVI pattern even in the trivial case is warranted because it preserves
    design flexibility for future expansion at zero
