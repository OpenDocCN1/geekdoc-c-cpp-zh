  md: 'of a detriment to development as overly concrete code. Often, it is easier
    to simply rewrite inflexible code if the need arises than it is to maintain highly
    flexible code for no reason. In practice, we seek to strike a balance for code
    to be both simple and maintainable yet somewhat extensible.


    In this chapter, we’ll explore modifying our code to implement features beyond
