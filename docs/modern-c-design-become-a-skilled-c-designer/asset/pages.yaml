    approach to design. In a strictly top-down approach, we would probably start with
    the CommandDispatcher, the class that receives and interprets command requests,
    and work our way down to the commands themselves. However, in this bottom-up approach,
    we will begin by studying the design of the commands themselves. We begin with
    the abstraction known as the command pattern.


    # The Command Pattern


    The command pattern is a simple, but very powerful, behavioral pattern that encapsulates
    a request in the form of an object. Structurally, the pattern is implemented as
    an abstract command base class that provides an interface for executing a request.
    Concrete commands simply implement the interface. In the most trivial case, the
    abstract interface consists solely of a command to execute the'
  merge: -1
