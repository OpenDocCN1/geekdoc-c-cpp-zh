  md: '# Handling Event Data


    In describing the observer pattern, I mentioned that two distinct paradigms exist
    for handling event data: pull and push semantics. In pull semantics, the observer
    is simply notified that an event has occurred. The observer then has the additional
    responsibility of acquiring any additional data that might be required. The implementation
    is quite simple. The observer maintains a reference to any object from which it
    might need to acquire state information, and the observer calls member functions
    to acquire this state in response to the event.


    Pull semantics have several advantages. First, the observer can choose at the
    time of handling the event exactly what state it wants to acquire. Second, no
    unnecessary resources are consumed in passing potentially unused arguments to
    observers. Third, pull semantics are easy to implement because events do not need
    to carry data. However, pull semantics also have disadvantages. First, pull semantics
    increase coupling because observers need to'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'hold references to and understand the state acquisition interfaces of publishers.
    Second, observers only have access to the public interfaces of publishers. This
    access restriction precludes observers from obtaining private data from publishers.


    In contrast to pull semantics, push semantics are implemented by having the publisher
    send state data relevant to an event when that event is raised. Observers then
    receive this state data as the arguments to the notify callback. The interface
    enforces push semantics by making the notify function pure virtual in the abstractObserver
    base class.


    Push semantics for event handling also have both advantages and disadvantages.
    The first advantage is that push semantics decrease coupling. Neither publishers
    nor observers need to know about each others’ interfaces. They need only obey
    the abstract eventing interface. Second, the publisher can send private information
    to the observers when it pushes state. Third, the publisher, as the object raising
    the event, can send precisely'
