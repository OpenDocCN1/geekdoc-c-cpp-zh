- pgno: 31
  md: '# CHAPTER 2


    # Decomposition


    Software is complex, one of the most complex endeavors humankind has ever undertaken.
    When you first read the requirements document for a large-scale programming project,
    you may feel overwhelmed. That’s expected; the task is overwhelming! For this
    reason, largescale programming projects typically begin with analysis.


    The analysis phase of a project consists of the time spent exploring the problem
    domain in order to understand the problem completely, clarify the requirements,
    and resolve any ambiguities between the client’s and developer’s domains. Without
    fully understanding the problem, you, as the architect or developer, have absolutely
    no chance of developing a maintainable design. For the case study chosen for this
    book,'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'however, the domain should be familiar (if not, you may wish to pause here
    and partake in an analysis exercise). Therefore, we will skip a formal, separate
    analysis phase. That said, aspects of analysis can never be skipped entirely,
    and we will explore several analysis techniques during the construction of our
    design. This intentional coupling of analysis and design emphasizes the interplay
    between these two activities to demonstrate that even for the simplest of problem
    domains, producing a good design requires some formal techniques for analyzing
    the problem.


    One of the most important techniques we have as software designers for addressing
    inherent problem complexity is hierarchical decomposition. Most people tend to
    decompose a problem in one of two ways: top down or bottom up. A top-down approach
    starts by looking at the whole picture and subsequently subdividing the problem
    until reaching the bottom-most level. In software design, the absolute bottom-most
    level is individual function implementations. However, a top-down design might
    stop short'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'of implementation and conclude by designing objects and their public interfaces.
    A bottom-up approach would start at the individual function or object level and
    combine components repeatedly until eventually encompassing the entire design.


    For our case study, both top-down and bottom-up approaches will be used at various
    stages of the design. I find it practical to begin decomposition in a top-down
    fashion until bulk modules and their interfaces are defined, and then actually
    design these modules from the bottom up. Before tackling the decomposition of
    our calculator, let’s first begin by examining the elements of a good decomposition.


    # The Elements of a Good Decomposition


    What makes a decomposition good? Obviously, we could just randomly split functionality
    into different modules and group completely unconnected components.'
  merge: -1
  img_proc: true
- pgno: 34
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 35
  md: 'once would be difficult, implementing an independently functioning stack is
    quite reasonable. Second, once components are split into distinct modules, unit
    tests can be defined that validate individual modules instead of requiring the
    entire program to be completed before testing commences. Third, for large projects,
    if modules with clear boundaries and interfaces are defined, the development effort
    can be divided between multiple programmers, preventing them from constantly interfering
    with each others’ progress by needing to modify the same source files.


    The remaining principles of good design, encapsulation, cohesion, and low coupling
    all describe characteristics that modules should possess. Basically, they prevent
    spaghetti code. Encapsulation, or information hiding, refers to the idea that
    once a module is defined, its internal implementation (data structures and algorithms)
    remains hidden from other modules. Correspondingly, a module should not make use
    of the private implementation of any other module. That is'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'not to say that modules should not interact with each other. Rather, encapsulation
    insists that modules interact with each other only through clearly defined, and,
    preferably, limited interfaces. This distinct separation ensures that internal
    module implementation can be independently modified without concern for breaking
    external, dependent code, provided the interfaces remain fixed and the contracts
    guaranteed by the interfaces are met.


    Cohesion refers to the idea that the code inside a module should be self-consistent
    or, as the name implies, cohesive. That is, all of the code within a module should
    logically fit together. Returning to our example of a poor calculator design,
    a module mixing arithmetic code with user interface code would lack cohesion.
    No logical ties bind the two concepts together (other than that they are both
    components of a calculator). While a small code, like our calculator, would not
    be completely impenetrable if it lacked cohesion, in general, a large, noncohesive
    code base is very difficult to understand,'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'maintain, and extend.


    Poor cohesion can manifest in one of two ways: either code that should not be
    together is crammed together or code that should be together is split apart. In
    the first instance, code functionality is almost impossible to decompose into
    mentally manageable abstractions because no clear boundaries exist between logical
    subcomponents. In the latter situation, reading or debugging unfamiliar code (especially
    for the first time) can be very frustrating because a typical execution path through
    the code jumps from file to file in a seemingly random fashion. Either manifestation
    is counterproductive, and I thus prefer cohesive code.


    Finally, we’ll examine coupling. Coupling represents the interconnectedness of
    components, be it functional coupling or data coupling. Functional coupling occurs
    when the logical flow of one module requires calling another module to complete
    its action. Conversely, data coupling is when data is shared between individual
    modules either via'
  merge: -1
  img_proc: true
- pgno: 38
  md: direct sharing (e.g., one or more modules point to some set of shared data)
    or via passing of data (e.g., one module returning a pointer to an internal data
    structure to another module). To argue for zero coupling is clearly absurd because
    this state would imply that no module could communicate in any way with any other
    module. However, in good design, we do strive for low coupling. How low should
    low be? The glib answer is as low as possible while still maintaining the ability
    to function as necessary. The reality is that minimizing coupling without detrimentally
    complicating code is a skill acquired with experience. As with encapsulation,
    low coupling is enabled by ensuring that modules communicate with each other only
    through cleanly defined, limited interfaces. Code that is highly coupled is difficult
    to maintain because small changes in one module’s design may lead to many unforeseen,
    cascading changes through seemingly unrelated modules. Note that whereas encapsulation
    protects module A from internal implementation changes to module B, low coupling
    protects module A from
  merge: -1
  img_proc: true
- pgno: 39
  md: 'changes to the interface of module B.


    # Selecting an Architecture


    Although it is now tempting to follow the above guidelines and simply start decomposing
    our calculator into what seem like sensible constituent components, it’s best
    to first see if someone else has already solved our problem. Because similar problems
    tend to arise frequently in programming, software architects have created a catalog
    of templates for solving these problems; these archetypes are called patterns.
    Patterns typically come in multiple varieties. Two categories of patterns that
    will be examined in this book are design patterns [6] and architectural patterns.


    Design patterns are conceptual templates used to solve similar problems that arise
    during software design; they are typically applied to local decisions. We will
    encounter design patterns repeatedly throughout this book during the detailed
    design of our calculator. Our first top level of'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'decomposition, however, requires a pattern of global scope that will define
    the overarching design strategy, or, software architecture. Such patterns are
    naturally referred to as architectural patterns.


    Architectural patterns are conceptually similar to design patterns; the two differ
    primarily in their domains of applicability. Whereas design patterns are typically
    applied to particular classes or sets of related classes, architectural patterns
    typically outline the design for an entire software system. Note that I refer
    to a software system rather than a program because architectural patterns can
    extend beyond simple program boundaries to include interfaces to hardware or the
    coupling of multiple independent programs. Two architectural patterns of particular
    interest for our case study are the multi-tiered architecture and the model-view-controller
    (MVC) architecture. We’ll examine each of these two patterns in the abstract before
    applying them to pdCalc. The successful application of an architectural pattern
    to our case study will represent the first level of'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'decomposition for the calculator.


    # Multi-Tiered Architecture


    In a multi-tiered, or n-tiered, architecture, components are arranged sequentially
    in tiers. Communication is bidirectional via adjacent tiers, but nonadjacent tiers
    are not permitted to communicate directly. An n-tiered architecture is depicted
    in Figure 2-1.


    +   Tier 1

    +   Tier 2

    +   Tier n


    Figure 2-1. A multi-tiered architecture with arrows indicating communication


    The most common form of the multi-tiered architecture is the three-tiered architecture.
    The first tier is the presentation layer, which consists of all of the user interface
    code. The second tier is the logic layer, which captures the so-called “business
    logic” of the application. The third tier is the data layer, which, as the name
    implies, encapsulates the data for the system. Very often, the three-'
