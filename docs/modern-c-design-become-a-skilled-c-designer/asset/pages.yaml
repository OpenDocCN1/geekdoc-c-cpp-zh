    it also increases cohesion since a unique class can be created for each unique
    command the system must implement. Second, because requests are now encapsulated
    in command objects with a lifetime distinct from the lifetime of the action, commands
    can be both delayed in time (for example, queuing commands) and undone. The undo
    operation is made possible because already executed commands can be retained with
    sufficient data to restore the state to the instant before the command was executed.
    Of course, combining the queuing ability with the undo ability permits the creation
    of an unlimited undo/redo for all requests implementing the command pattern.


