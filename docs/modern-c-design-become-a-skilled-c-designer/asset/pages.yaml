  md: '# 7.6.2 Source Code Dependency Inversion


    Surprisingly, the above class declaration for HyperbolicLnPlugin is indeed the
    complete interface to the plugin. I say surprisingly because, at first glance,
    one might be surprised that the plugin’s interface bears no relationship on the
    functionality the plugin provides. Of course, this situation is exactly as it
    should be. The calculator functionality that the plugin provides is indeed merely
    an implementation detail and can be contained entirely within the plugin’s implementation
    file.


    The above subtlety, namely that pdCalc knows only the interface to a plugin and
    nothing about the functionality itself, should not be overlooked. As a matter
    of fact, this source code dependency inversion is the entire point of plugin design.
    What exactly is source code dependency inversion and why is it important? To answer
    this question, we must first embark on a short history lesson.'
  merge: -1
  img_proc: true
- pgno: 446
  md: Traditionally (think 1970s Fortran), code was extended by simply writing new
    functions and subroutines. The primary design problem with this approach was that
    requiring the main program to call new functions bound the main program to the
    concrete interface of any extension. Thus, the main program became dependent on
    interface changes defined by the whims of extension authors. That is, every new
    extension defined a new interface to which the main program had to conform. This
    setup was extremely brittle because the main program required constant modification
    to keep pace with the changes to its extensions’ interfaces. Since each new extension
    required unique modifications to the main program’s source code, the complexity
    of the main program’s code for handling extensions grew linearly with the number
    of extensions. If that wasn’t bad enough, adding new functionality always required
    recompiling and relinking the main program. In concrete terms, imagine a design
    for pdCalc that would require modifying, recompiling, and relinking pdCalc’s source
    code every time a new plugin command was
  merge: -1
  img_proc: true
- pgno: 447
  md: 'added.


    The above problem can be solved without object-oriented programming via function
    pointers and callbacks, albeit in a somewhat inelegant and cumbersome fashion.
    However, with the rise of object-oriented programming, specifically inheritance
    and polymorphism, the solution to the dependency problem was solved in a type-safe
    manner with language support. These techniques enabled the popularization of source
    code dependency inversion. Specifically, source code dependency inversion states
    that the main program defines an interface (e.g., the plugin interface we’ve studied
    in this chapter) to which all extensions must conform. Under this strategy, the
    extensions become subservient to the main program’s interface rather than the
    reverse. Hence, the main program can be extended via plugins without modifying,
    recompiling, or relinking the main program’s source code. More importantly, however,
    the interface for extensibility is dictated by the application rather than its
    plugins. In concrete terms, pdCalc provides'
  merge: -1
  img_proc: true
- pgno: 448
