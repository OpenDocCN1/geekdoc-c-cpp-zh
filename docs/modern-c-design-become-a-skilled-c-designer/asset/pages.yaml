    # A Trivial Extension: Numeric Constants


    Once we’ve established the mechanics for storing user-defined variables, we can
    make a trivial extension to provide user-defined constants. Constants are simply
    variables that cannot be altered once set. Constants could be hard coded in pdCalc,
    added at program launch through reading a constants file, or added dynamically
    during calculator execution.


    Obviously, in order to store a constant, we will need to add a new command; let’s
    call it cstore. cstore works identically to store except that the command informs
    the symbol table that the variable being stored cannot be changed. We have two
    obvious options for implementation. First, inside the SymbolTable class, we add
    a second map that indicates whether a given name represents a'
  merge: -1
  img_proc: true
- pgno: 512
  md: 'variable or a constant. The advantage of this approach is that adding an additional
    map will require minimal implementation changes to the existing code. The disadvantage
    is that this approach requires two independent lookups for each call to the symbol
    table. The better approach is to modify the original map to store the value type
    as an Entry instead of a double, where an Entry is defined as


    ```

    struct Entry

    {

    double val; bool isConst;

    };

    ```


    Of course, to avoid hard coding the double type, we could, of course, template
    both SymbolTable and Entry.


