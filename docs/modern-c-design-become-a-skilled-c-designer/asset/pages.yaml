  md: '# The Stack as an Event Publisher


    The final step in constructing the Stack is simply to put all of the pieces together.
    Listing 3-1 shows theStack as a singleton. In order to implement events, we simply
    modify this code to inherit from thePublisher base class. We now must ask ourselves,
    should this inheritance be public or private?


    Typically, in object-oriented programming, one uses public inheritance to indicate
    the is-a relationship. That is, public inheritance expresses the relationship
    that a derived class is a type of or specialization of a base class. More precisely,
    the is-a relationship obeys the Liskov Substitutability Principle (LSP) [29],
    which states that (via polymorphism) a function that takes a base class pointer
    (reference) as an argument must be able to accept a derived class pointer (reference)
    without knowing it. Succinctly, a derived class must be usable wherever a base
    class can be used, interchangeably. When people refer to inheritance, they are
    generally referring to public inheritance.'
  merge: -1
  img_proc: true
