    # The cliTest Directory


    The cliTest directory contains the source code files necessary for testing the
    command line interface. The two source files in this directory are CliTest.h and
    CliTest.cpp. In addition to the source files, the cliTest directory contains a
    subdirectory, testCases. The testCases directory contains input files and output
    baselines used in testing the command line interface.'
