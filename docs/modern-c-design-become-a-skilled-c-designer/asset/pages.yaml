    introduced to handle user events generated by the views and to manipulate the
    data in the model.


    At first glance, MVC seems no different than the three-tiered architecture with
    the model replacing the data layer, the view replacing the presentation layer,
    and the controller replacing the business logic layer. The two architectural patterns
