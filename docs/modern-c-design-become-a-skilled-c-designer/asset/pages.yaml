  md: '# 6.2.1 Building GUIs in IDEs


    If all you need is a simple GUI, then, certainly, designing and building your
    GUI in an IDE is the easier route. Most IDEs have a graphical interface for laying
    out visual elements onto a canvas, which, for example, might represent a dialog
    box or a widget. Once a new canvas is set up, the user visually builds the GUI
    by dragging and dropping existing widgets onto the canvas. Existing widgets consist
    of the built-in graphical elements of the GUI toolkit (e.g., a push button) as
    well as custom widgets that have been enabled for drag-and-drop in the IDE framework.
    Once the layout is complete, actions can be tied together either graphically or
    with a little bit of code. Ultimately, the IDE creates code corresponding to the
    graphically laid out GUI, and this IDE-created code is compiled with the rest
    of your source code.


    Building a GUI using an IDE has both advantages and disadvantages. Some of the
    advantages are as follows. First, because the'
