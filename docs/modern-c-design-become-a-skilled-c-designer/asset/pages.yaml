  md: 'The technique that I have termed implicit hiding is nothing more than hiding
    the interface by not documenting it. What does this mean in practice? Since the
    C++ language does not directly support modules, implicit hiding simply draws a
    logical construct around a group of classes and functions, and declares those
    classes to compose a module. The language allows any public function of any class
