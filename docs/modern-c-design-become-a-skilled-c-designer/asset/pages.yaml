    # 8.2.2.3 The Symbol Table


    At its core, a symbol table is merely a data structure that allows symbolic lookup
    by pairing a key to a value (an associative array). In this case, the name of
    the variable serves as the key and the numeric value serves as the value. The
    C++ standard library provides this service directly through either a map or an
    unordered_map, depending on the desired'
  merge: -1
  img_proc: true
- pgno: 510
  md: 'underlying data structure. However, as in Chapter 3, I highly recommend against
    directly using a standard library container as an external facing interface within
    a program. Instead, one should employee the adapter pattern to encapsulate the
    library container behind an interface defined by the application itself. This
    pattern adds no restrictions to the users of a class, but it does permit the designer
    to restrict, expand, or later modify the component’s interface independently of
    the interface of the underlying library container.


    Therefore, the recommended design for a symbol table is to create a SymbolTable
    class to wrap an unordered_map<string, double>. This underlying hash table provides
    a storage type to map between the variable name as a string and the underlying
    numeric value. The public interface for the SymbolTable class provides member
    functions for adding and, optionally (we did not specify a command for clearing
    variables), removing variables from the symbol table. The SymbolTable should probably
    be implemented as a singleton since'
  merge: -1
  img_proc: true
