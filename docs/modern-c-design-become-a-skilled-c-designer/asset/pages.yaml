    is shown in Figure 4-1.


    ![](img/7aac03e344e518d9d0db5131f6619db9_144_0.png)


    Figure 4-1. The simplest hierarchy for the command pattern


    Essentially, the pattern does two things. First, it decouples the requester of
    a command from the dispatcher of the command. Second, it encapsulates the request
    for an action, which might otherwise be implemented by a function call, into an
    object. This object can carry state and posses an extended lifetime beyond the
    immediate lifetime of the request itself.


    Practically, what do these two features give us? First, because the requester
    is decoupled from the dispatcher, the logic for executing a command does not need
    to reside in the same class or even the same module as the class'
