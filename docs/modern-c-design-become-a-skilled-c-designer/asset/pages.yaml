    # Model-View-Controller (MVC) Architecture


    In the Model-View-Controller architecture, components are decomposed into three
    distinct elements aptly named the model, the view, and the controller. The model
    abstracts the domain data, the view abstracts the user interface, and the controller
    manages the interaction between the model and the view. Often, the MVC pattern
    is applied locally to individual GUI widgets at the framework level where the
    design goal is to separate the data from the user interface in situations where
    multiple distinct views may be associated with the same data. For example, consider
    a scheduling application with the requirement that the application must be able
    to store dates and times for appointments, but the user may view these appointments
    in a calendar that can be viewed by day, week, or'
