  md: '# CHAPTER 8


    # New Requirements


    It’s a beautiful Monday morning, and you just stepped into work after a relaxing
    weekend. After all, you just finished pdCalc on Friday, and now you are ready
    to ship. Before you can sit down and have your morning cup of coffee, your project
    manager steps into your office and says, “We’re not done. The client requested
    some new features.”


    The above scenario is all too common in software development. While new features
    probably won’t be requested on the go live date, new features will almost inevitably
    be requested well after you have completed large parts of both your design and
    your implementation. Therefore, one should develop as defensively as practical
    to anticipate extensibility. I say as *defensively as practical* rather than as
    *defensively as possible* because overly abstract code can be as much'
  merge: -1
  img_proc: true
