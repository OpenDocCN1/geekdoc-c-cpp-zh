  md: Why are we bothering with the proxy pattern here? This strategy has several
    distinct advantages. First, it increases clarity in the target class’s public
    interface by replacing a generically named notify() function with a descriptively
    named event handling function. Second, an otherwise unnecessary inheritance from
    the Observer class is removed. Eliminating this dependency reduces coupling, increases
    cohesion, and facilitates reuse of the target in a setting where it is not an
    observer. Third, using a proxy class eliminates the ambiguity that arises for
    a target class that needs to listen to multiple events. Without using proxy classes,
    an observer would be required to disambiguate events in its single notify() function.
    Using an individual proxy for each event enables each event to call a unique handler
    function in the target object. The main disadvantage of implementing the observer
    pattern using a proxy is the slight cost of one extra indirection for handling
    each event. However, in situations where using the observer pattern is appropriate,
    the cost of an extra indirection is negligible.
