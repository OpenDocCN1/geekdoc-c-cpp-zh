    # ### C. Dot File Graph


    The computation API used to generate the extended PDFG as a directed graph. Loop
    nests are expressed using a modified version of polyhedral scheduling. Polly is
    a top down recursive algorithm for generating code for set of iteration statements.
    Our modified version of polyhedral uses the same approach but generates nodes
    of polyhedral graph and generates clusters for statements within the same loop.


    # ### IV. OPERATIONS ON COMPUTATIONS


    Computations are composed of IEGen Sets and relations. IEGEN''s functionality
    is used to directly manage the Computations'' components. The core operations
    performed in IEGenLib include inversion, compose, and related supporting functions.
    Using these operations we are able to perform inlining and loop transformations
    within the Computation class.


    # ### A. Inlining


    Inlining handles the complexity of creating the SPF representation of functions
    that can call others.


    Computations in inline to be reusable in the same way that functions are reusable.


    Each function in the original source code is represented as a Computation. When
    a function call is first encountered in the source, a Computation is created and
    inserted (inline) the contents of Computation are inlined. If the same function
    is called multiple times, the Computation that has been generated for it will
    be reused. The inlining process can continue to any nesting depth, if the function
    call also calls functions.


    The inlining is responsible for:


    +   - avoiding naming conflicts between the caller and callee

    - generating assignment statements for function parameters

    - providing call return values to the caller and updating iteration counts, execution
    schedules and dependencies in the inlined statements.


    Before inlining, the data spaces and integers in the callee are prefixed with
    a unique string to avoid collisions with the other data spaces, or with others
    within the same scope. The change is reflected in the stored source code of the
    statement, as well as other parts of inlining represent those names.


    To keep things simple, the values and arguments to an inlined function are restricted
    to either data spaces or integers. To a more complex expression into an inline,
    it must first be assigned to an argument variable which can be passed. To preserve
    the calling semantics of the program, when arguments are presented to a function,
    statements are generated to declare each of parameters equal to the value passed.
    No equivalent occurs with return values, because they could potentially be used
    in a large variety of contexts (nested to multiple or ignored entirely). Therefore,
    the inlining process returns the values that are returned by the inlined function,
    as strings, to be used by the caller uses'
