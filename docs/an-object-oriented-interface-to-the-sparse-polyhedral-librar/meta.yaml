- md: "\n# Composable Transformations\n\n![](img/b0ca35141f95bc94154f92e4981fe911_2_0.png)\n\
    \nFig. 1: Optimization Pipeline Overview\n\n## Dense matrix vector multiply\n\n\
    ```\nfor (int i = 0; i < N; i++) {\n  for (int j = 0; j < M; j++) {\n    y[i]\
    \ += A[i][j] * x[j];\n  }\n}\n```\n\nUninterpreted functions cannot have expressions\
    \ as parameters. Code generation overcomes this by limiting uninterpreted functions\
    \ in IEGenLib to Omega compliant, while storing a mapping of the uninterpreted\
    \ function to its modified uninterpreted function. The separation of representations\
    \ for transformations and code generation allows precise operations during transformations\
    \ while still leveraging the flexibility of CodeGen+ for polyhedral scanning.\n\
    \nFig. 2: Dense Matrix Vector Multiply\n\n## CSR matrix vector multiply\n\n```\n\
    for (int i = 0; i < N; i++) {\n  for (int k = rowptr[i]; k < rowptr[i+1]; k++)\
    \ {\n    int j = col[k];\n    y[i] += A[k] * x[j];\n  }\n}\n```\n\nFigure 5 shows\
    \ the code generation for the sparse matrix vector multiplication computation\
    \ defined in Figure 4. Line 2 of Figure 5 defines a mapping for the statement\
    \ i0; Lines 9-13 remap the Omega compliant uninterpreted function back to its\
    \ original. Lines 15-20 are a direct result of polyhedral scanning from CodeGen+.\
    \ The computation implementation provides all the supporting definitions for full\
    \ functional code.\n\nFig. 3: CSR Matrix Vector Multiply\n\n{i, j} -> [0, i, j,\
    \ 0], the position of i before j signifies that the corresponding statement is\
    \ within a loop over j, which is within a loop over i. In a lexicographical ordering,\
    \ all instances of the statement with i = 1 will precede all instances with i\
    \ = 2, regardless of the value of j.\n\n```\n// 3rd parameter float to the Stmt\
    \ counter /\n// dense\n// [[i,j]] -> [0, i, j, 0]\n// sparse\n// [[i,k,j]] ->\
    \ [0, i, k, j, 0]\n```\n\n## III. VISUAL COMPUTATION ON A GRAPH\n\nVisualizing\
    \ the data flow gives experts a suitable view to reason about transformations\
    \ for optimization opportunities. This diff PDFG ensures regular computations\
    \ using a combination of the polyhedral model and data graphs. The graphs represent\
    \ each loop body, loop dependencies are not represented, and imperfect loops are\
    \ not supported. This section describes how transformations are implemented, the\
    \ creation of PDFGs using the SPIR IR is integrated with the Computation API.\
    \ After a computation is constructed like the one in Figure 4 a function can output\
    \ the PDFG as a file.\n\nFigure 4 shows the complete specification of two computation\
    \ followed by sparse matrix vector multiply.\n\nIn the original order, rectangular\
    \ boxes represent data space and inverted triangles represent statements. In the\
    \ extended PDFG, rectangular boxes represent data space and rounded boxes represent\
    \ statements. Edges represent reads and writes in both the original and extended\
    \ PDFG. The extended PDFG does not currently represent the type and size of data\
    \ spaces in a computation.\n\n## E. Code Generation\n\nThe computation interfaces\
    \ with CodeGen+ for code generation. CodeGen uses sets and relations for polyhedral\
    \ scanning. Omega uses sets and relations in the presence of uninterpreted functions.\
    \ Uninterpreted functions are limited by the prefix rule. This rule states that\
    \ an uninterpreted function must be a part of the declaration.\n\nLoop dependencies\
    \ and imperfect loops are important when deciding which optimizations to apply.\
    \ Loop carried dependencies refer to loop patterns where one iteration of a loop\
    \ writes data by another iteration of the same loop. An imperfect\n\n## Full dense\
    \ Specification\n\n```\n// dense mvm\nComputation += dsComp Computation();\n\n\
    // add data spaces\ndsComp->addDataSpace(\"$ys\");\ndsComp->addDataSpace(\"$sas\"\
    );\ndsComp->addDataSpace(\"$xs\");\n\n// Stmt ds0 = Stmt(0);\n// source code\n\
    *Si(i) = SAS(i,j) + Sxs(j);\n// iter domain\nfor (int i = 0; i < N && j < M; j++)\
    \ {\n  // scheduling function\n  for ([i,j] = {0,0}; i,j < {N,M}; i,j++) {\n \
    \   for ([y,x] = {[i,j]-1}; [y,x] >= {0,0}; y,x--) {\n      *Sy(y,x) = Si([i,j]-1);\n\
    \    }\n  }\n}\n// add data writes\nfor ([y,x] = {[i,j]-1}; ...) {\n}\ndsComp->addStmt(ds0);\n\
    \n// sparse mvm\nppsComp = new Computation();\n\n// add data spaces\nppsComp->addDataSpace(\"\
    $ys\");\nppsComp->addDataSpace(\"$sas\");\nppsComp->addDataSpace(\"$xs\");\n```\n\
    \n```\n# dense s0\n# dense s0(x0, i2, k, x4, j)\n# (I + A) * k(j)\n```\n\n```\n\
    # undefined col(t0)\n# dense col_0(t0, tv1, tv2, tv3)\n# undefined rowptr_1(t0,\
    \ tv1)\n# dense rowptr_2(t0, tv2)\n# dense col(t0)\n# dense col_0(t0, tv1, tv2,\
    \ tv3)\n# undefined rowptr(t0)\n# dense rowptr_1(t0, tv1)\n# dense rowptr_2(t0,\
    \ tv2) +\n```\nfor (int t2 = 0; t2 <= N-1; t2++) {\n  for (int t4 = rowptr_1(t1,t2);\
    \ t4 <= rowptr_2(t1,t2); t4++) {\n    col_t0(t1,t2,t3,t4);\n    s0(0,0,t2,t4,t6,t0);\n\
    \  }\n}\n```\n```\n# undefined s0\n# undefined col(t0)\n# dense col_0(t0, tv1,\
    \ tv2, tv3)\n# undefined rowptr(t0)\n# dense rowptr_1(t0, tv1)\n# dense rowptr_2(t0,\
    \ tv2)\n```\nFig. 5: SPMV dense\n\n```\n// Stmt ds0 = new Stmt(0);\n*Si(i,j) =\
    \ C * i + N * rowptr(i) <= j (rowptr(i) <= j < rowptr(i+1) && j < M)\nfor ([i,j]\
    \ = {0,0}; i,j < {N,M}; i,j++) {\n  for ([y,x] = {[i,j]-1}; [y,x] >= {0,0}; y,x--)\
    \ {\n    *Sy(y,x) = Si([i,j]-1);\n    *Ay(y,x) = Aj([i,j]-1);\n    *Mx(y,x) =\
    \ Sj([i,j]-1);\n  }\n}\nspspComp->addStmt(ds0);\n```\n\n## The forward solve example\n\
    \n```\nfor (int i = 0; i < N; i++) {\n  S0: tmp(i) = f(i);\n  for (int j = 0;\
    \ j < i; j++) {\n    S1: tmp(i) -= A(i,j) * u(j);\n  }\n  S2: u(i) = tmp(i)/A(i,i);\n\
    }\n```\nFig. 6: Forward Solve\n\nFig. 4: Computation API for dense and sparse\
    \ matrix vector\n\nFigure 7 shows the extended PDFG. From the data node i to the\
    \ j-loop. The incoming edge from the statement node S1 shows read access from\
    \ statement node S2 to the data node u and shows the write access in the i-loop.\
    \ This loop carried dependency over i.\n\nloop nest i has statements at multiple\
    \ levels as shown in Figure 6.\n\n## A. Loop Dependencies\n\nThe existing representation\
    \ is not capable of visualizing the loop carried dependency. Figure 8 shows the\
    \ PDFG for the forward solve example. In the example, the code shows a loop carried\
    \ dependency for the data space u in statements S1 and S2. However, the original\
    \ PDFG in figure 8 does not visualize the loop carried dependency\n\n## B. Imperfect\
    \ loop nest\n\nThe forward solve example also exhibits an imperfect loop nest\
    \ pattern: statements S0 and S2 are in the outer-loop while statement S1 is in\
    \ the inner j loop. The original PDFG in figure 8 does not exhibit this pattern.\
    \ The updated design in the extended PDFG in Figure 7 visualizes the imperfect\
    \ loop pattern.\n\n![](img/b0ca35141f95bc94154f92e4981fe911_4_0.png)\n![](img/b0ca35141f95bc94154f92e4981fe911_4_1.png)\n\
    \n## C. Dot File Graph\n\nThe computation API used to generate the extended PDFG\
    \ as a directed graph. Loop nests are expressed using a modified version of polyhedral\
    \ scheduling. Polly is a top down recursive algorithm for generating code for\
    \ set of iteration statements. Our modified version of polyhedral uses the same\
    \ approach but generates nodes of polyhedral graph and generates clusters for\
    \ statements within the same loop.\n\n## IV. OPERATIONS ON COMPUTATIONS\n\nComputations\
    \ are composed of IEGen Sets and relations. IEGEN's functionality is used to directly\
    \ manage the Computations' components. The core operations performed in IEGenLib\
    \ include inversion, compose, and related supporting functions. Using these operations\
    \ we are able to perform inlining and loop transformations within the Computation\
    \ class.\n\n## A. Inlining\n\nInlining handles the complexity of creating the\
    \ representation of functions that can call others.\n\nComputations in inline\
    \ to be reusable the same way that functions are.\n\nEach function in the source\
    \ code is represented as a Computation. When a function call is first encountered\
    \ in the source, a Computation is created and inserted (inline) the contents of\
    \ Computation. If the same function is called multiple times, the Computation\
    \ that has been generated for it will be reused.\n\nThe inlining is responsible\
    \ for:\n\n- avoiding naming conflicts between the caller and callee\n- generating\
    \ assignment statements for function parameters\n- providing call return values\
    \ to the caller and updating iteration counts, execution schedules and dependencies\
    \ in the statements\n\nTo keep things simple, the values and arguments to an inlined\
    \ function are restricted to either data spaces or integers. To a more complex\
    \ expression into an inline, it must first be assigned to an argument variable\
    \ which can be passed. To preserve the calling semantics of the program, when\
    \ arguments are presented to a function, statements are generated to declare each\
    \ of parameters equal to the value passed. No equivalent occurs with return values,\
    \ because they could potentially be used in a large variety of contexts (nested\
    \ to multiple or ignored entirely). Therefore, the inlining process returns the\
    \ values that are returned by the inlined function, as strings, to be used by\
    \ the caller uses\n"
