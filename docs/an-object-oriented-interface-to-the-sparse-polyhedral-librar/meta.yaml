    \ {\n    S1: tmp(i) -= A(i,j) * u(j);\n  }\n  S2: u(i) = tmp(i)/A(i,i);\n}\n```\n\
    图 6：前向求解\n\n图 4：用于稠密和稀疏矩阵向量的 Computation API\n\n图 7 显示了扩展的 PDFG。从数据节点 i 到 j 循环。来自语句节点\
    \ S1 的入边显示了从语句节点 S2 到数据节点 u 的读访问，并显示了 i 循环中的写访问。这是跨越 i 的循环携带依赖。\n\n如图 6 所示，循环嵌套具有多个级别的语句。\n\
    \n## A. 循环依赖\n\n现有的表示无法可视化循环携带依赖。图 8 显示了前向求解示例的 PDFG。在示例中，代码显示了语句 S1 和 S2 中数据空间\
    \ u 的循环携带依赖。然而，图 8 中的原始 PDFG 未可视化该循环携带依赖\n\n## B. 不完整的循环嵌套\n\n前向求解示例还展示了不完整的循环嵌套模式：语句\
    \ S0 和 S2 在外层循环中，而语句 S1 在内部 j 循环中。图 8 中的原始 PDFG 没有显示这种模式。图 7 中扩展 PDFG 的更新设计可视化了这种不完整的循环模式。\n\
    \n![](img/b0ca35141f95bc94154f92e4981fe911_4_0.png)\n![](img/b0ca35141f95bc94154f92e4981fe911_4_1.png)\n\
    \n## C. Dot 文件图\n\n计算 API 用于生成扩展 PDFG 作为有向图。循环嵌套使用修改后的 polyhedron 进行调度。Polly 是一种用于生成集合代码的自顶递归算法。我们的修改版本使用相同的方法，但生成的是语句内部的簇。\n\
