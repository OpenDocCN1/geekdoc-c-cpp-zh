    # B. Loop Transformations as Graph Operations


    In this work, we model fuse and reschedule operations on the graphs. The graph
    translates transformations performed by our interface API to manage the SPF components.


    +   1. Fusion: This is a transformation that joins statements from loops into
    a single loop. There are many categories of fusion, including reduction fusion
    and producer-consumer fusion. Reduction fusion fuses loops that read from the
    same memory location before consumer fusion merges loops where one variable is
    read by the second loop.


    Graph operation for fusing statements together at a particular level of the graph
    is denoted as fuse(S1,S2). In our IR, S1 and S2 are the statements to be fused
    and fuse indicates the depth to fuse to. Fusion allows for more flexibility in
    a fusion operation. After fusion, S2 will be immediately after S1.


    +   2. Reschedule: The reschedule operation involves moving a statement to a new
    location in the graph and changing its execution schedule. Reschedule by is not
    optimal, but it exposes opportunities. The reschedule operation is denoted as
    reschedule(S1,S2) in our IR. This will call statement S1 to be rescheduled before
    S2.


    Plato [9] is a fully automatic source transformation tool that optimizes for parallelism
    and locality. Pluto uses linear programming to determine optimal code using parallelism
    and locality as part of its cost functions. Loop, is a tool that allows the programmer
    to describe transformation at high level and verify the correctness. Loop is implemented
    in LLVM. isL [13] is a tool for mapping sets and relations in the polyhedral model.
    This tool forms the basis for transformations used in all the tools discussed
    in this paper [12], [9], [101].


    # B. Program Dependence Graphs


    PDFGs are based on a line of research by Ferrante, [14], with work on program
    dependence graphs. Polyhedral optimizations are performed in the work Data Flow
    Representations (DFGR) [16]. Our work is closely related to this, but polyhedral
    graphs are views of the polyhedral representation rather than a separation.


    # C. Polyhedral Model Tools


    This work takes a slightly different approach than CHILL [18]. In CHILL the performer
    writes a representation derived from the code. The script can include several
    operations or are the compilation of abstract syntax and polyhedral transformations.
    Our work provides


    Our work differs from other work using the polyhedral model because of its lack
    of support for irregular applications. We present views of the Omega [1], [6],
    and polyhedral framework [7]. This interface provides a mechanism to optimize
    applications using the polyhedral framework and generate fully code incrementally
    within a scientific application. The structure of the Computation API lays groundwork
    for mapping data spaces, including memory layout in the future.


    This work presents an object API to serve the polyhedral library. The API provides
    a standard interface to fully specify a computation in the Polyhedral framework
    from a single entry point. The entry point is built by integration with IGenLib,
    CodeGen, and others. PDGs have been explored for affine loop bounds, inner loop
    nests, and nest dependencies. The API does not currently support exits, where
    loops are bounded within the loop nests, and loops without bounds such as while.
    In the future we explore techniques such as those from [19] to overcome limitations
    of unbounded loops and predicates.


    # VI. CONCLUSION


    # A. Polyhedral Model Tools


    Tools such as Pluto [9], Loopy [10], Polyage [11] use the polyhedral model to
    transform legacy code. Poly automatically detects and transforms input code sections
    in the LLVM IR, breaking the limitations of most tools limited to a single source
    language. Polyage is a polyhedral library that enables the generation of efficient
