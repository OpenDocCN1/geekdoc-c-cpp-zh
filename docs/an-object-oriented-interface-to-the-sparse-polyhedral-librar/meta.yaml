    \ loops, and loop carried dependencies\n- Translations between PDFG operations\
    \ and SPF relations\n- Integration between CodeGen and IGenLib\n- Support for\
    \ inlining computations\n- Peripheral support for generated code\n\nAll statements\
    \ have an iteration associated with them. This iteration domain contains every\
    \ instance of the statement and has no particular order. It is typically expressed\
    \ as the iterators that the statement runs over, subject to the constraints of\
    \ their iteration (loop bounds). The following code shows how to create a statement\
    \ using the Compilation API. A statement is written as a string and the names\
    \ of the data are identified with $ symbols, such as $D and $S for dense and sparse\
    \ respectively. The iteration domain is set using the IGenLib syntax, with the\
    \ deallocation of all data with $S, with this deallocation on lines 3 and 6\n\n\
    # II. COMPUTATION: A C++ Class\n\nThe interface to SPF is implemented as a C++\
    \ class in IGenLib. The compilation class contains all of the information required\
    \ to create a computation or computations. This includes: data spaces, statements,\
    \ data dependencies, and execution schedules. This section describes the design\
    \ and interface for each of these elements. Matrix multiplication is used as a\
    \ running example throughout the rest of this paper. Figures 2 & 3 show the dense\
    \ and sparse\n\n# A. Data Spaces\n\nA data space represents a collection of unique\
    \ memory addresses. Each address is defined by a scalar choice of data space name\
    \ and index. For example, $D(i)$, for each unique tuple $i$ there will be a unique\
    \ location, and during the lifetime of $D$ its locations will not overlap with\
    \ any other data space memory locations. By default all data spaces are dense.\
    \ If we use sparse $S$, the data space can be written only once but read from\
    \ any number of times. The exception to this rule is for accumulation operations\
    \ when a single data location within a space can be written multiple times ($+\
    \ = x, \\dots, max$).\n\nThe data space represented in the matrix vector multiplies\
    \ $x$, $y$, and $z$. In the sparse version the attributes $row$ and $col$ are\
    \ also considered data spaces. Even though they are used within the loop bounds\
    \ and into another data space must be constant for the duration of this computation.\
    \ Therefore, they are not required as part of the Computation's definition.\n\n\
    ```\n// Stmt ds = new Stmt(\n  $($i=0; i < $S; i++) $S($i);\n  $($j=0; j < $N\
    \ && j < $M); j)\n```\n\n```\n// Stmt ss = new Stmt(\n  $($i,k,j) <= i < $N &&\
    \ rowptr(i) <= k < rowptr(i+1) && j < $M); j,k\n)\n```\n\nData dependencies exist\
    \ between statements. They are encoded using relations between iteration domains\
    \ and data vectors. Calculating a closure provides the dependency relations between\
    \ statements and a partial ordering over them. In our running example the data\
    \ results which can be written as follows:\n\n```\n// dense\nComputation* dsComp\
    \ = new Computation();\nddsComp->addDataSpace($Y);\ndsComp->addDataSpace($X);\n\
    dsComp->addDataSpace($Z);\n```\n\n```\n// sparse\n// reads\n$($i,k,j) -> [$($i);\n\
    $($i,k,j) -> [$($k);\n$($i,k,j) -> [$($j);\n```\n\n```\n// writes\n$($i,k,j) ->\
    \ [$($j);\n```\n\n# D. Execution Schedules\n\nExecution schedules are determined\
    \ by scheduling functions that require to respect the data dependence relations.\
    \ Scheduling functions take as input the iterators that apply to the current statement,\
    \ and output it as an integer tuple that may be lexicographically ordered with\
    \ others to determine the execution order of statements. Iterators are commonly\
    \ used to represent the values of iterators affecting the order of the statement.\
    \ For example, in the scheduling function\n\n# B. Statements\n\nStatements perform\
    \ read and write operations on data spaces. We restrict the definition of statements\
    \ to be blocks. There is a single and a single exit from each block of code."
