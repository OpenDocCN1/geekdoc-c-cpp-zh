- md: "\n## An Object-Oriented Interface to the Sparse Polyhedral Library\n\nTobi\
    \ Popoola¹ Ravi Shankar² Anna Rift³ Shivani Singh⁴ Eddie C. Davis⁵\nMichelle Mills\
    \ Strout⁶ and Catherine Olechanowski⁷\n\nEmail: {tobipopoola¹|ravishankar²|shivanishingh⁴@u.boisestate.edu,catherineolechanowski@biosestate.edu}\n\
    ⁵Vulcan Inc., Seattle, USA\n⁶Department of Computer Science, Boise State University,\
    \ Boise USA\n⁷mtros@cs.urtison.edu\n\n**Abstract—** Many applications, including\
    \ learning, molecular dynamics, and fluid dynamics, use sparse data where non-affine\
    \ loop bounds hinder the use of the polyhedral model for code transformation.\
    \ The Sparse Polyhedral Framework (SPF) addresses limitations of polyhedral modeling\
    \ by representing non-affine constraints in relations and using functions. We\
    \ contribute an API that wraps the SPF intermediate representation (IR) and the\
    \ Inspector/Executor Polyhedral Library and for preprocessing to result in a well-specified\
    \ definition of a full computation using the SPF.\n\nare symbolic constructs that\
    \ represent structures such as the index arrays in sparse data. The SPF provides\
    \ much of the functionality as traditional polyhedral tools: code generation with\
    \ CodeGen[1] built on Omega[2] and preset and set relations in the presence of\
    \ uninterpreted functions with EigenLib[3]. These tools are not tightly integrated\
    \ and have their own low-level APIs, making individual use difficult.\n\n*Index\
    \ Terms:* intermediate representation, sparse polyhedral framework, polyhedral\
    \ dataflow\n\nThe contribution of this work is the Computation API. This API provides\
    \ a precise specification of how to combine the individual functions of the SPF\
    \ to create an intermediate representation. It can directly produce Polyhedral\
    \ Dataflow Graphs (PDFGs)[4] and generate options for PDFs into relations used\
    \ by EigenLib to perform transformations. In this work, we extend the PDFG to\
    \ handle non-affine loops with imperfect nesting and carry dependencies.\n\n#\
    \ I. INTRODUCTION\n\nMany applications including machine learning, molecular dynamics\
    \ and computational fluid dynamics use sparse data. To save memory, sparse data\
    \ is compressed by storing only the non-zero values. Arrays are used to map the\
    \ non-zero value coordinates to the dense space. These arrays are used in loop\
    \ bounds while iterating the iteration space. These non-affine loop bounds complicate\
    \ the use of compiler transformation for performance optimization.\n\nFigure 1\
    \ shows an overview of our iteration process where the computation API fits in\
    \ in process. The highlighted region in the figure is the part that translates\
    \ transformations to our API, which is currently under development. In this work\
    \ we focus on mapping original source code to the computation API. The IR itself\
    \ supports transformations by virtue of the sparse polyhedral framework. Graph\
    \ operations on the PDFG generate transformations and are presented in the IR.\n\
    \nThe polyhedral model is an effective optimization for applications with affine\
    \ loop bounds. Iterations are represented as sets and data dependencies using\
    \ relations. This combination of iteration space and data provides a partial ordering\
    \ for the target computation. Within the partial ordering, the order of execution\
    \ can be altered by applying relations to the iteration space. These relations\
    \ are referred to transformations. A limitation to the polyhedral model is that\
    \ the constraints within iteration spaces must be affine.\n\nOur work addresses\
    \ limitations of previous approaches through a tight integration between CodeGen,\
    \ Omega, and EigenLib. CHILL [5] provides a script interface for the SPF and supports\
    \ non-affine transformations using integration. Omega focuses on the precision\
    \ of operations involving uninterpreted functions, as well as restrictions on\
    \ how they are expressed. Our computation API depends on EigenLib[3] for set and\
    \ relation operations, which over the precision limitations.\n\nThe polyhedral\
    \ framework extends the polyhedral model by supporting non-affine iteration spaces\
    \ and transformations using uninterpreted functions. Uninterpreted functions\n\
    \nThe contributions of this paper include:\n\n- A unified interface to specify\
    \ a computation in the SPF\n- Integration with PDFGs\n- Extensions to PDFs to\
    \ support non-affine loop bounds, perfectly nested loops, and loop carried dependencies\n\
    - Translations between PDFG operations and SPF relations\n- Integration between\
    \ CodeGen and IGenLib\n- Support for inlining computations\n- Peripheral support\
    \ for generated code\n\nAll statements have an iteration associated with them.\
    \ This iteration domain contains every instance of the statement and has no particular\
    \ order. It is typically expressed as the iterators that the statement runs over,\
    \ subject to the constraints of their iteration (loop bounds). The following code\
    \ shows how to create a statement using the Compilation API. A statement is written\
    \ as a string and the names of the data are identified with $ symbols, such as\
    \ $D and $S for dense and sparse respectively. The iteration domain is set using\
    \ the IGenLib syntax, with the deallocation of all data with $S, with this deallocation\
    \ on lines 3 and 6\n\n# II. COMPUTATION: A C++ Class\n\nThe interface to SPF is\
    \ implemented as a C++ class in IGenLib. The compilation class contains all of\
    \ the information required to create a computation or computations. This includes:\
    \ data spaces, statements, data dependencies, and execution schedules. This section\
    \ describes the design and interface for each of these elements. Matrix multiplication\
    \ is used as a running example throughout the rest of this paper. Figures 2 &\
    \ 3 show the dense and sparse\n\n# A. Data Spaces\n\nA data space represents a\
    \ collection of unique memory addresses. Each address is defined by a scalar choice\
    \ of data space name and index. For example, $D(i)$, for each unique tuple $i$\
    \ there will be a unique location, and during the lifetime of $D$ its locations\
    \ will not overlap with any other data space memory locations. By default all\
    \ data spaces are dense. If we use sparse $S$, the data space can be written only\
    \ once but read from any number of times. The exception to this rule is for accumulation\
    \ operations when a single data location within a space can be written multiple\
    \ times ($+ = x, \\dots, max).\n\nThe data space represented in the matrix vector\
    \ multiplies $x$, $y$, and $z$. In the sparse version the attributes $row$ and\
    \ $col$ are also considered data spaces. Even though they are used within the\
    \ loop bounds and into another data space must be constant for the duration of\
    \ this computation. Therefore, they are not required as part of the Computation's\
    \ definition.\n\n```\n// Stmt ds = new Stmt(\n  $($i=0; i < $S; i++) $S($i);\n\
    \  $($j=0; j < $N && j < $M); j)\n```\n\n```\n// Stmt ss = new Stmt(\n  $($i,k,j)\
    \ <= i < $N && rowptr(i) <= k < rowptr(i+1) && j < $M); j,k\n)\n```\n\nData dependencies\
    \ exist between statements. They are encoded using relations between iteration\
    \ domains and data vectors. Calculating a closure provides the dependency relations\
    \ between statements and a partial ordering over them. In our running example\
    \ the data results which can be written as follows:\n\n```\n// dense\nComputation*\
    \ dsComp = new Computation();\nddsComp->addDataSpace($Y);\ndsComp->addDataSpace($X);\n\
    dsComp->addDataSpace($Z);\n```\n\n```\n// sparse\n// reads\n$($i,k,j) -> [$($i);\n\
    $($i,k,j) -> [$($k);\n$($i,k,j) -> [$($j);\n```\n\n```\n// writes\n$($i,k,j) ->\
    \ [$($j);\n```\n\n# D. Execution Schedules\n\nExecution schedules are determined\
    \ by scheduling functions that require to respect the data dependence relations.\
    \ Scheduling functions take as input the iterators that apply to the current statement,\
    \ and output it as an integer tuple that may be lexicographically ordered with\
    \ others to determine the execution order of statements. Iterators are commonly\
    \ used to represent the values of iterators affecting the order of the statement.\
    \ For example, in the scheduling function\n\n# B. Statements\n\nStatements perform\
    \ read and write operations on data spaces. We restrict the definition of statements\
    \ to be blocks. There is a single and a single exit from each block of code.\n"
  mdcn: "\n\n## 面向稀疏多面体库的对象化接口\n\nTobi Popoola¹ Ravi Shankar² Anna Rift³ Shivani Singh⁴\
    \ Eddie C. Davis⁵\nMichelle Mills Strout⁶ 和 Catherine Olechanowski⁷\n\nEmail:\
    \ {tobipopoola¹|ravishankar²|shivanishingh⁴@u.boisestate.edu,catherineolechanowski@biosestate.edu}\n\
    ⁵Vulcan Inc., Seattle, USA\n⁶博西州大学计算机科学系, Boise USA\n⁷mtros@cs.urtison.edu\n\n\
    **摘要—** 许多应用（包括学习、分子动力学和流体动力学）使用稀疏数据，其中非线性循环边界阻碍了使用多面模型进行代码变换。稀疏多面体框架 (SPF) 通过在关系和函数表示非线性约束，解决了多面体建模的局限性。我们贡献了一个\
    \ API，用于封装 SPF 中间表示 (IR) 和检查/执行器多面体库，并用于预处理，从而使用 SPF 生成对完整计算的良好定义。\n\n是符号构造结构，用于表示稀疏数据中的索引数组等结构。SPF\
    \ 提供了许多传统多面体工具的功能：基于 Omega[2] 构建的 CodeGen[1] 代码生成，以及在存在未解释函数时带有 EigenLib[3] 的预设和集合关系。这些工具之间没有紧密集成，并且有自己的低级\
    \ API，使得单独使用变得困难。\n\n*术语：* 中间表示，稀疏多面体框架，多面体数据流\n\n本文的贡献是计算 API。该 API 提供了关于如何结合\
    \ SPF 的各个函数来创建中间表示的精确规范。它可以直接生成多面体数据流图 (PDFGs)[4]，并为 PDF 生成用于 EigenLib 执行变换的 PDF\
    \ 关系中的选项。在这项工作中，我们扩展了 PDFG 以处理具有完美嵌套和携带依赖的非线性循环。\n\n# I. 引言\n\n许多包括机器学习、分子动力学和计算流体力学在内的应用使用稀疏数据。为了节省内存，稀疏数据通过仅存储非零值进行压缩。使用数组来将非零值坐标映射到稠密空间。这些数组在迭代迭代空间时用于循环边界。这些非线性循环边界增加了使用编译器变换进行性能优化的复杂度。\n\
    \n图 1 显示了我们迭代过程的概述，其中计算 API 符合该过程。图中高亮的区域是将变换翻译到我们 API 的部分，目前正在开发中。在这项工作中，我们专注于将原始源代码映射到计算\
    \ API。IR 本身通过稀疏多面体框架支持变换。PDFG 上的图操作生成变换并现在 IR 中。\n\n多面体模型对于具有线性循环边界的应用是一种有效优化。迭代表示为集合，数据依赖使用关系表示。这种迭代空间和数据的结合为目标计算提供了一个偏序。在偏序中，可以通过将关系应用到迭代空间上来改变执行顺序。这些关系被称为变换。多面体模型的局限性是迭代空间内的约束必须是线性的。\n\
    \n我们的工作通过 CodeGen、Omega 和 EigenLib 之间的紧密集成解决了以往方法的局限性。CHILL [5] 为 SPF 提供了脚本接口，并通过集成支持非线性变换。Omega\
    \ 侧于涉及未解释函数的操作精度，以及对它们表达方式的限制。我们的计算 API 依赖 EigenLib[3] 进行集合和关系操作，这克服了精度的局限。\n\n\
    多面体框架通过使用未解释函数支持非线性迭代空间和变换，扩展了多面体模型。未解释函数\n\n本文的贡献包括：\n\n- 用于在 SPF 中指定计算的统一接口\n\
    - 与 PDFGs 的集成\n- 扩展 PDF 以支持非线性循环边界、完美嵌套循环和循环依赖\n- PDFG 操作与 SPF 关系之间的翻译\n- CodeGen\
    \ 与 IGenLib 之间的集成\n- 对内内的支持\n- 对生成代码的辅助支持\n\n所有陈述都与一个迭代相关。该迭代域包含语句的每个实例且没有特定顺序。它通常被表示为语句运行的迭代器，受其迭代（循环边界）约束的影响。以下代码显示了如何使用编译\
    \ API 创建语句。语句被写为字符串，数据名称用 $ 符号识别，例如 $D$ 和 $S$ 分别代表稠密和稀疏。迭代域使用 IGenLib 语法设置，并对所有带有\
    \ $S 的数据进行释放，该释放操作位于第 3 行和第 6 行。\n\n# II. 计算：一个 C++ 类\n\nSPF 的接口在 IGenLib 中以 C++\
    \ 类的形式实现。编译类包含创建一个或多个计算所需的所有信息。这包括：数据空间、语句、数据依赖和执行调度。本节描述这些元素元素的设计和接口。矩阵乘法在本文其余部分将作为示例。图\
    \ 2 和 3 显示了稠密和稀疏\n\n# A. 数据空间\n\n数据空间表示唯一内存地址的集合。每个地址由数据空间名称和索引的标量选择定义。例如，对于每个唯一的元组\
    \ $i$，$D(i)$。对于每个唯一的元组，将有一个唯一的位置，且在 $D$ 的生命周期内，其位置不会与任何其他数据空间重叠。默认情况下，所有数据空间都是稠密的。如果我们使用稀疏\
    \ $S$，数据空间只能写入一次，但可以读取多次。此规则的例外是累加操作，此时单个空间内的位置可以被写入多次（$+ = x, \\dots, max$）。矩阵乘以\
    \ $x, y$ 和 $z$。在稀疏版本中属性 $row$ 和 $col$ 也被视为数据空间。尽管它们在循环边界内使用，但在计算期间必须是常量。因此，它们不是计算定义的一部分。\n\
    \n```\n// Stmt ds = new Stmt(\n  $($i=0; i < $S; i++) $S($i);\n  $($j=0; j < $N\
    \ && j < $M); j)\n```\n\n```\n// Stmt ss = new Stmt(\n  $($i,k,j) <= i < $N &&\
    \ rowptr(i) <= k < rowptr(i+1) && j < $M); j,k\n)\n```\n\n语句之间存在数据依赖。它们使用迭代域和数据向量之间的关系编码。计算闭提供了语句之间的依赖关系以及对它们的偏序。在我们的示例中，数据结果可以如下所示：\n\
    \n```cpp\n// dense\nComputation* dsComp = new Computation();\ndsComp->addDataSpace($Y);\n\
    dsComp->addDataSpace($X);\ndsComp->addDataSpace($Z);\n```\n\n```cpp\n// sparse\n\
    // reads\n$($i,k,j) -> [$($i);\n$($i,k,j) -> [$($k);\n$($i,k,j) -> [$($j);\n```\n\
    \n```cpp\n// writes\n$($i,k,j) -> [$($j);\n```\n\n# D. 执行调度\n\n执行调度由需要遵守数据依赖关系的调度函数决定。调度函数将当前语句的迭代器作为输入，并输出一个整数元组，可以与其他与其他进行字典序排序以确定语句的执行顺序。迭代器通常用于表示影响语句顺序的迭代器值。例如，在调度函数\n\
    \n# B. 语句\n\n语句在数据空间上执行读写操作。我们将语句的定义限制为块。每个代码块只有一个入口和一个出口。\n\n"
