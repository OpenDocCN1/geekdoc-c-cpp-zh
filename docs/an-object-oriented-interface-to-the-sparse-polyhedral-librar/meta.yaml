    ## A. Polyhedral Model Tools


    Tools such as Pluto [9], Loopy [10], Polyage [11] use the polyhedral model to
    transform legacy code. Poly automatically detects and transforms input code sections
    in the LLVM IR, breaking the limitations of most tools limited to a single source
    language. Polyage is a polyhedral library that enables the generation of efficient
    implementations of image processing pipelines. Halide [12] is another compiler
