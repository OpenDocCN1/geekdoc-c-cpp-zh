    **Abstract—** Many applications, including learning, molecular dynamics, and fluid
    dynamics, use sparse data where non-affine loop bounds hinder the use of the polyhedral
    model for code transformation. The Sparse Polyhedral Framework (SPF) addresses
    limitations of polyhedral modeling by representing non-affine constraints in relations
    and using functions. We contribute an API that wraps the SPF intermediate representation
    (IR) and the Inspector/Executor Polyhedral Library and for preprocessing to result
    in a well-specified definition of a full computation using the SPF.


    are symbolic constructs that represent structures such as the index arrays in
    sparse data. The SPF provides much of the functionality as traditional polyhedral
    tools: code generation with CodeGen[1] built on Omega[2] and preset and set relations
    in the presence of uninterpreted functions with EigenLib[3]. These tools are not
    tightly integrated and have their own low-level APIs, making individual use difficult.


    *Index Terms:* intermediate representation, sparse polyhedral framework, polyhedral
    dataflow


    The contribution of this work is the Computation API. This API provides a precise
    specification of how to combine the individual functions of the SPF to create
    an intermediate representation. It can directly produce Polyhedral Dataflow Graphs
    (PDFGs)[4] and generate options for PDFs into relations used by EigenLib to perform
    transformations. In this work, we extend the PDFG to handle non-affine loops with
    imperfect nesting and carry dependencies.


    # I. INTRODUCTION


    Many applications including machine learning, molecular dynamics and computational
    fluid dynamics use sparse data. To save memory, sparse data is compressed by storing
    only the non-zero values. Arrays are used to map the non-zero value coordinates
    to the dense space. These arrays are used in loop bounds while iterating the iteration
    space. These non-affine loop bounds complicate the use of compiler transformation
    for performance optimization.


    Figure 1 shows an overview of our iteration process where the computation API
    fits in the process. The highlighted region in the figure is the part that translates
    transformations to our API, which is currently under development. In this work
    we focus on mapping original source code to the computation API. The IR itself
    supports transformations by virtue of the sparse polyhedral framework. Graph operations
    on the PDFG generate transformations and are presented in the IR.


    The polyhedral model is an effective optimization for applications with affine
    loop bounds. Iterations are represented as sets and data dependencies using relations.
    This combination of iteration space and data provides a partial ordering for the
    target computation. Within the partial ordering, the order of execution can be
    altered by applying relations to the iteration space. These relations are referred
    to transformations. A limitation to the polyhedral model is that the constraints
    within iteration spaces must be affine.


    Our work addresses limitations of previous approaches through a tight integration
    between CodeGen, Omega, and EigenLib. CHILL [5] provides a script interface for
    the SPF and supports non-affine transformations using integration. Omega focuses
    on the precision of operations involving uninterpreted functions, as well as restrictions
    on how they are expressed. Our computation API depends on EigenLib[3] for set
    and relation operations, which over the precision limitations.


    The polyhedral framework extends the polyhedral model by supporting non-affine
    iteration spaces and transformations using uninterpreted functions. Uninterpreted
    functions


    The contributions of this paper include:


    +   • A unified interface to specify a computation in the SPF


    +   • Integration with PDFGs'
