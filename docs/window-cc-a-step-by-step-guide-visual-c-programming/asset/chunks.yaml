- fmt: "\n# Window C/C++ Step by Step Guide: visual C++ Programming\nBy Theo Jackson\n\
    \n## Contents\n\n### Materials for Mandatory Reading\nBefore exploring the features\
    \ offered by Microsoft Windows, let's take a look at how they handle error handling.\
    \ When you call a Windows function, it checks the parameters passed to it and\
    \ then tries to do its job. If you passed an invalid parameter, or if the operation\
    \ cannot be performed for some other reason, it returns a value indicating an\
    \ error. Table 1-1 shows the data types for the return values of most Windows\
    \ functions.\n\n### Tab 1-1. Standard Value Types Returned by Windows Functions\n\
    When an error occurs, you should figure out why the call to this function failed.\
    \ Each error has its own code - a 32-bit number.\n\nWhen a Windows function detects\
    \ an error, it uses the thread's local memory mechanism to map the corresponding\
    \ error code to the calling thread. (Thread local memory is discussed in Chapter\
    \ 21) This allows threads to work independently of each other without interfering\
    \ with other people's errors. When the function returns control to you, its return\
    \ value will indicate that some kind of error has occurred. You can find out which\
    \ one by calling the `GetLastError` function.\n\n```cpp\nDWORD GetLastError ();\n\
    ```\n\nIt simply returns a 32-bit error code for the given stream.\n\nNow that\
    \ you have an error code, you need to exchange it for something more readable.\
    \ For a list of error codes defined by Microsoft, see the `WinError.h` header\
    \ file. I'll give you a small part of it here to give you an idea of what it looks\
    \ like:\n\n```cpp\n// MessageId: ERROR_SUCCESS\n// MessageText\n// The operation\
    \ completed successfully.\n#define ERROR_SUCCESS 0L\n#define NO_ERROR 0L // error\n\
    #define SEC_E_OK ((HRESULT) 0x0000000L)\n\n// MessageId: ERROR_INVALID_FUNCTION\n\
    // MessageText\n// Incorrect function.\n#define ERROR_INVALID_FUNCTION 1L\n\n\
    // MessageId: ERROR_FILE_NOT_FOUND\n// MessageText\n// The system cannot find\
    \ the file specified.\n#define ERROR_FILE_NOT_FOUND 2L\n\n// MessageId: ERROR_PATH_NOT_FOUND\n\
    // MessageText\n// The system cannot find the path specified.\n#define ERROR_PATH_NOT_FOUND\
    \ 3L\n\n// MessageId: ERROR_TOO_MANY_OPEN_FILES\n// MessageText\n// The system\
    \ cannot open the file.\n#define ERROR_TOO_MANY_OPEN_FILES 4L\n\n// MessageId:\
    \ ERROR_ACCESS_DENIED\n// MessageText\n// Access is denied.\n#define ERROR_ACCESS_DENIED\
    \ 5L\n```\n\nAs you can see, each error is associated with a message ID (which\
    \ can be used in the source code to compare with the value returned by `GetLastError`),\
    \ a message text (a description of the error in normal language), and a number\
    \ (it is better to use an ID instead). Note that I've only shown a tiny portion\
    \ of the `WinError.h` file; it actually has over 39,000 lines!\n\nThe `GetLastError`\
    \ function must be called immediately after a failed Windows function call, otherwise\
    \ the error code may be lost (overwritten by the error code of another function\
    \ or `ERROR_SUCCESS` in case of successful completion of the function).\n\nSome\
    \ Windows functions always complete successfully, but for different reasons. For\
    \ example, an attempt to create an “event” kernel object with a specific name\
    \ might succeed either because you actually created it, or because such an object\
    \ already exists. But sometimes you need to know the reason for success. Microsoft\
    \ has chosen to use the last error code setting mechanism to return this information.\
    \ So even if some functions are successful, you can call `GetLastError` and get\
    \ additional information. These functions include, for example, `CreateEvent`.\
    \ For information on other functions and examples of returning `ERROR_ALREADY_EXISTS`\
    \ when a named event exists, see the Platform SDK.\n\nIn my opinion, it is especially\
    \ useful to track the code of the last error during the debugging process. By\
    \ the way, the debugger in Microsoft Visual Studio allows you to customize the\
    \ Watch window so that it always shows the code and description of the last error\
    \ in the current thread. To do this, select a line in the Watch window and enter\
    \ `@ err, hr`. Now look at fig. 1-1. See, I called the `CreateFile` function.\
    \ She returned `INVALID_HANDLE_VALUE` (-1) of type `HANDLE`, indicating that she\
    \ was unable to open the specified file. But the Watch window shows us the last\
    \ error code (which the `GetLastError` function would return if I called it),\
    \ equal to `0x00000002`, and the description \"The system cannot find the file\
    \ specified\". It is this line that is defined in the `WinError.h` header file\
    \ for error code 2.\n\n*Fig 1-1 ... Using \"@ err, hr\" in the Watch window of\
    \ Visual Studio, you can view the code of the last error in the current thread*\n\
    \nVisual Studio comes with a small utility `Error Lookup`, which allows you to\
    \ get a description of an error by its code. If an application detects an error,\
    \ it usually notifies the user about it by displaying its description on the screen.\
    \ In Windows, there is a special function for this that \"converts\" the error\
    \ code into its description - `FormatMessage`:\n\n```cpp\nDWORD FormatMessage\
    \ (DWORD dwFlags, LPCVOID pSource, DWORD MessageId, DWORD LanguageId, PTSTR pszBuffer,\
    \ DWORD nSize, va_list *Arguments);\n```\n\n`FormatMessage` - a very rich function\
    \ in its capabilities, and it is desirable to use it in the formation of all lines\
    \ shown to the user. The point is that it makes easy to work with many languages.\
    \ `FormatMessage` determines which language is selected in the system (this parameter\
    \ is set via Regional Settings in the Control Panel), and returns the text in\
    \ the corresponding language. Of course, you must first translate the strings\
    \ into the required languages and embed this into your EXE or DLL, then the function\
    \ will automatically select the required language.\n\nFrom time to time, someone\
    \ asks me if Microsoft will compile a complete list of error codes for every possible\
    \ feature. Answer: alas, no. I will say more, there will never be such a list\
    \ - it is too difficult to compile and maintain for more and more versions of\
    \ the system. The problem with such a list is also that you call one API function,\
    \ and any of these functions can fail (for various reasons). Sometimes a higher-level\
    \ function will itself deal with error in one of the functions it calls and ultimately\
    \ do what you want to. In general, to create such a list, Microsoft would have\
    \ to trace the call chains in each function, which is very difficult. And with\
    \ the advent of a new version of the system, these chains would have to be revised\
    \ again.\n\nI showed you how Windows functions report errors. Microsoft allows\
    \ you to use this mechanism in your own functions. Let's say you are writing a\
    \ function that will be accessed by other programs. This function call may fail\
    \ for whatever reason, and you also need to report errors. To this end, you simply\
    \ set the code of the last error and return `FALSE`, `INVALID_HANDLE_VALUE`, `NULL`,\
    \ or whatever is more appropriate in your case. To set the last error on a stream,\
    \ you call `SetLastError(DWORD ErrCode)` and pass it the required 32-bit number.\
    \ I try to use the codes already defined in `WinError.h`, provided they match\
    \ the errors my functions might report. If you think that none of the codes in\
    \ `WinError.h` are good enough for a possible error in your function, define your\
    \ code. This 32-bit value is broken down into the fields shown in the following\
    \ table (I discuss these fields in more detail in Chapter 24). At the moment,\
    \ the only field you care about is bit 2. Microsoft promises that all error codes\
    \ generated by its functions will contain 0 in this bit. If you define your own\
    \ error code, write down 1 here. Then you have the assurance that your error code\
    \ will not conflict with the code defined by Microsoft - now or in the future.\
    \ Note that `Facility` code can take 4096 possible values, of which the first\
    \ 256 are reserved by Microsoft for its own use, and the rest are available for\
    \ use by applications who wish.\n\n### ErrorShow Sample Program\nThe program `01\
    \ ErrorShow.exe` (see listing in Figure 1-2) demonstrates how to get a textual\
    \ description of an error from its code. The source code and resource files of\
    \ the program are located in the `01-ErrorShow` directory on the CD attached to\
    \ the book, as well as on the website http://wintellect.com/Books.aspx... The\
    \ `ErrorShow` program is mainly designed to show you how the debugger's Watch\
    \ window and the `Error Lookup` utility work. After launching `ErrorShow`, the\
    \ following window opens. Any error code can be entered in the Error field. When\
    \ you click the Look Up button, a text describing the error will appear in a scrollable\
    \ window at the bottom. The only interesting thing about the program is how it\
    \ calls the `FormatMessage` function. I use this function like this:\n\n```cpp\n\
    // get the error code\nDWORD dwError = GetDlgItemInt (hwnd, IDC_ERRORCODE, NULL,\
    \ FALSE);\nHLOCAL hlocal = NULL; // buffer for line with error description\n//\
    \ We are looking for Windows messages, so we use the system\n// locale by default\n\
    // Note. This MAKELANGID combination is 0\nDWORD systemLocale = MAKELANGID (LANG_NEUTRAL,\
    \ SUBLANG_NEUTRAL);\n// get error description by code\nBOOL fOk = FormatMessage\
    \ (FORMAT_MESSAGE_FROM_SYSTEM | FORMAT_MESSAGE_IGNORE_INSERTS | FORMAT_MESSAGE_ALLOCATE_BUFFER,\
    \ NULL, dwError, systemLocale, (PTSTR) & hlocal, 0, NULL);\nif (! fOk) {\n   \
    \ // Is this a networking error?\n    HMODULE hDll = LoadLibraryEx (TEXT (\"netmsg.dll\"\
    ), NULL, DONT_RESOLVE_DLL_REFERENCES);\n    if (hDll != NULL) {\n        fOk =\
    \ FormatMessage (FORMAT_MESSAGE_FROM_MODULE | FORMAT_MESSAGE_IGNORE_INSERTS |\
    \ FORMAT_MESSAGE_ALLOCATE_BUFFER, hDll, dwError, systemLocale, (PTSTR) & hlocal,\
    \ 0, NULL);\n        FreeLibrary (hDll);\n    }\n}\nif (fOk && (hlocal != NULL))\
    \ {\n    SetDlgItemText (hwnd, IDC_ERRORTEXT, (LPSTR) hlocal);\n    LocalFree\
    \ (hlocal);\n} else {\n    SetDlgItemText (hwnd, IDC_ERRORTEXT, TEXT (\"No text\
    \ found for this error\"));\n}\n```\n"
