  trans: "\n\n所有的 i/o 流都至少有一个输入流指针。`ifstream` 与 `istream` 一样，有一个名为 `get pointer`（获取指针）的指针，它用于指示在后续信息操作中要读取的组件。\n\
    \n- 如果读取或组合操作失败，则返回 `true`。例如，当我们尝试连接一个未以写入模式打开的文档，或者我们尝试写入的设备没有足够留空间时。\n- 在与\
    \ `bad()` 相同的情况下返回 `valid`；此外，在发生格式错误时也会返回，例如当尝试读取一个数字时遇到一个顺序字符时。\n- 如果用于读取的记录到达末尾，则返回\
    \ `true`。\n\n它是最非排他的状态标志位：在调用任何一个之前的成员会返回真（true）的情况下，它会返回 `false`。\n\n`ofstream`\
    \ 与 `ostream` 一样，有一个名为 `put pointer`（输出指针）的指针，它用于指示后续组件必须写入的区域。最后，`fstream` 从\
    \ `iostream` 继承了 `get` 和 `put` 指针（而 `iostream` 本身是由 `istream` 和 `ostream` 决定的）。这些指示流内部读取或写入区域的内部流指针可以通过相应的函数进行控制：\n\
    \n`tellg()` 和 `tellp()`\n\n这两个函数没有参数，并返回一个 `pos_type` 类型的值，这是一种整数数据类型，指示 `get\
    \ stream pointer`（对应 `tellg`）或 `put stream pointer`（对应 `tellp`）当前的位置。\n\n`seekg()`\
    \ 和 `seekp()`\n\n这些函数允许我们更改 `get` 流指针和 `put` 流指针的位置。它们都针对两个不同的模型进行了重载。主要的模型是：\n\
    \n```cpp\nseekg ( position );\nseekp ( position );\n```\n\n利用此模型，流指针将被明确地更改到指定的位置（从记录的最早开始点计算）。该参数的类型与\
    \ `tellg` 和 `tellp` 返回的类型相同：`pos_type` 类型，即整数值。\n\n这些成员的另一个模型是：\n\n```cpp\nseekg\
    \ ( balance, heading );\nseekp ( balance, heading );\n```\n\n利用此模型，`get` 或 `put`\
    \ 指针的位置将被设置为相对于参数 `course` 控制的某个特定点的偏移值。`balance` 的类型为 `off_type`，也是一个数字。此外，`heading`\
    \ 的类型是 `seekdir`，这是一个枚举类型（enum），决定了从哪个点开始计算偏移量，它可以取以下任何一个属性：\n\n随后的情况利用了我们最近看到的成员来获取文档的大小：\n\
    \n- `ios::beg` - 从流的最早开始点计算偏移\n- `ios::curoffset` - 从流指针当前的位置计算\n- `ios::end`\
    \ - 从流的末尾计算偏移\n\n## 二进制文件\n\n在二进制记录中，使用提取和插入运算符（`<<` 和 `>>`）以及 `getline` 等函数进行输入输出信息是无效，因为我们不需要组织任何信息，且信息可能不会使用文本文档用于独立组件的分隔代码。记录流包含两个专门用于连续输出输出信息的函数：`write`\
    \ 和 `read`。\n\n语法：\n\n```cpp\nwrite ( memoryBlock, size );\nread ( memoryBlock,\
    \ size );\n```\n\n`memoryBlock` 的类型是“字符指针”（`char*`），指示一个字节簇的位置，读取的信息组件存于此处，或要写入的信息组件从此处取出。`size`\
    \ 参数是一个整数，指示从/到内存块中读取或写入的字符数量。\n\n示例：\n\n```cpp\n#include <fstream>\n#include\
    \ <iostream>\n\nusing namespace std;\n\nchar * memoryBlock;\nifstream::pos_type\
    \ size;\n\nint main () {\n    ifstream newFile (\"sample.bin\", ios::in|ios::binary|ios::ate);\n\
    \    if (myFile.is_open())\n    {\n        mySize = newFile.tellg();\n       \
    \ memoryBlock = new char [size];\n        newFile.seekg (0, ios::beg);\n     \
    \   newFile.read (memblock, size);\n        newFile.close();\n        cout <<\
    \ \"the complete document substance is in memory\"; delete[] memoryBlock;\n  \
    \  }\n    else\n        cout << \"Not able to open document\";\n    return 0;\n\
    }\n```\n\n在此示例中，整个文档被读取并存储在内存中。\n\n## 缓冲区与同步\n\n当我们处理文档流时，它们涉及到 `streambuf` 类型的内部支持。该缓冲区是一个内存块，是流和物理记录之间的介质。缓冲器的刷新（flushing）强制在流为输出流时将其上所有可用数据写入物理内存，并在流为输入流时释放内存。这一过程被称为同步。可以通过调用函数\
    \ `sync()` 或借助借助操纵符（manipulators）显式执行。\n\n## 附录\n\n保留关键字列表如下：\n\n- `auto`\n- `asm`\n\
    - `break`\n- `bool`\n- `catch`\n- `case`\n- `class`\n- `char`\n- `const_cast`\n\
    - `const`\n- `default`\n- `continue`\n- `do`\n- `delete`\n- `dynamic_cast`\n-\
    \ `double`\n- `enum`\n- `else`\n- `export`\n- `explicit`\n- `false`\n- `extern`\n\
    - `for`\n- `float`\n- `goto`\n- `friend`\n- `inline`\n- `if`\n- `long`\n- `int`\n\
    - `namespace`\n- `mutable`\n- `operator`\n- `new`\n- `protected`\n- `private`\n\
    - `register`\n- `public`\n- `return`, `short`\n- `reinterpret_cast`\n- `sizeof`\n\
    - `signed`\n- `static_cast`\n- `static`\n- `switch`\n- `struct`\n- `this`\n- `template`\n\
    - `true`\n- `throw`\n- `typedef`\n- `try`\n- `typename`\n- `typeid`\n- `unsigned`\n\
    - `union`\n- `virtual`\n- `using`\n- `volatile`\n- `void`\n- `while`\n- `wchar_t`\n\
    \n除了上述之外，还有一些运算符在特殊条件下也被保留。这些包括：\n\n- `and_eq`\n- `and`\n- `bitor`\n- `bitand`\n\
    - `not`\n- `compl`\n- `or`\n- `not_eq`\n- `xor`\n- `or_eq`\n- `xor_eq`\n\n某些编译器可能还有一些额外的保留关键字。你可以阅读编译器文档以获取更多信息。\n\
    \n## Scott Sanderson 的其他书籍：\n\n- [jQuery, JavaScript, and HTML5: A Simple Start\
    \ to jQuery, JavaScript, and HTML5 (由软件工程师编写)](http://www.amazon.com/gp/product/B00M8AYI1C/ref=as_li_qf_sp_asin_il_tl?ie=UTF8&camp=1789&creative=9325&creativeASIN=B00M8AYI1C&linkCode=as2&tag=wwwglobaliz07-20&linkId=GZB47V50)\n\
    \n"
