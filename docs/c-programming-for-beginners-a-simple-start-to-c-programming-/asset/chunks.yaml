  trans: "\n\n`switch` 构造的语法有点特殊。它的目标是针对解释对几个可能的值进行检查。这类似于我们在在本节开始时链接几个 `if` 和 `else\
    \ if` 指令所做的操作。该构造的语法如下：\n\n```cpp\nswitch (<要监控的整数>)\n{\ncase value1:\n    //code\n\
    \    break;\ncase value2:\n    //code\n    break;\n.\n.\ndefault:\n    //code\n\
    \    break;\n}\n```\n\n考虑到 `switch` 构造并不使用块（blocks），它在 C++ 方言中显得有些特殊。相反，它使用标签（labels）。这使得我们能够在针对特定条件需要执行的相关行之后放置\
    \ `break` 代码。\n\n### 示例实现：\n\n```cpp\nint a;\ncin >> a;\nswitch (a)\n{\ncase 0:\n\
    \    cout <<”Entered value is 0”;\n    break;\ncase 1:\n    cout << “Entered value\
    \ is 1”;\n    break;\ndefault:\n    cout << “Value other than 0 and 1 entered\
    \ by the user”;\n    break;\n}\n```\n\n这段代码要求用户输入一个整数。如果输入的值为 `0`，则执行 `case 0`\
    \ 代码。然而，如果用户输入 `1`，则执行 `case 1`。如果用户输入一个随机值，`switch-case` 将跳过所有情况并执行 `default`\
    \ 情况。惯例上用 `break` 语句为 `default` 情况结束标记。\n\n此外，请注意，如果你跳过了 `break` 语句，系统将执行真值情况之后的所有情况。例如，如果你在上述代码中跳过了\
    \ `break` 语句且用户输入了 `0`，系统将执行所有情况。因此，所有三个语句都将被打印。\n\n# 函数\n\n你可以使用函数来组织你的代码，这允许你充分利用\
    \ C++ 中组织化编程所能为你提供的所有潜力。函数是语句的集合，当从项目的某个位置调用时就会执行。其结构如下：\n\n```cpp\n<data type>\
    \ <function identifier> (<parameter1>, <parameter2>, ...)\n{\n    //code\n}\n\
    ```\n\n这里：\n- **数据类型（Data type）** 是函数返回的信息的数据类型。\n- **函数标识符（Function identifier）**\
    \ 是调用该函数时的标识符。\n- **参数（Parameters）**（数量与要求相同）：每个参数由数据类型和标识符组合组成。参数的声明方式与普通变量的相同。它们允许在调用函数时将值从调用函数传递到函数。这些参数通常用逗号分隔。\n\
    - **代码语句（Code statements）** 构成函数体。它是包含在大括号中的部分声明。\n\n## 变量作用域\n\n在函数或其他内部方块内声明的变量范围仅限于其函数或代码块，且不能在外部使用。考虑以下示例以更好地理解作用域概念。\n\
    \n```cpp\nvoid func1()\n{\n    int a;\n    //code\n}\n\nvoid func2()\n{\n    int\
    \ b;\n    //code\n}\n```\n\n在上面的示例代码中，变量 `a` 仅在 `func1()` 内部可用，变量 `b` 仅在 `func2()`\
    \ 内部可用。因此，附近变量的范围限制在它们声明的块级别。考虑到所有因素，我们同样有机会具有全局作用域的变量。这在代码的任何位置（函数内部和外部）都是显而易见的。如果有声明全局变量的特定目标，你只需要在任何块或函数之外声明变量即可。然而，该位置必须在项目的汇范围内。\n\
    \n## 带有 void 返回值的函数\n\n如果你回到函数的声明语法，你会发现数据类型声明了函数返回的值的数据类型。然而，某些函数可能不返回任何内容，在这种情况下，你将数据类型指定为\
    \ `void`。\n\n假设我们需要创建一个功能函数来在屏幕上显示消息。我们不需要担心提供返回值。对于这种情况，我们应该对函数使用 `void` 数据类型。这是一个表示“无类型”的非空指定符。\n\
    \n`void` 也可以用于函数的参数列表，以明确指出我们希望函数在被调用时不接受实际参数。\n\n## 按引用传递和按值传递的值\n\n在调用带有参数的函数时，进入函数的是它们值的副本。变量本身从未被发送。在函数内部对变量值进行的任何更改都不会反映在原始变量上。另一方面，如果向函数发送变量的引用，函数内部对变量的更改将原样反映在原始变量上。\n\
    \n## 参数中的默认值\n\n在声明函数时，我们可以为每个参数定义默认值。当在调用函数时留空相关内容时，该属性将被使用。要做到这一点，我们基本上需要在函数声明中使用赋值运算符并为变量指定一个值。如果在调用函数时没有传递该参数的值，则使用默认值。然而，如果定义了该值，则该默认属性将被忽略并使用传递的值。\n\
    \n## 重载函数\n\n在 C++ 中，如果两个函数的参数类型或数量不同，则它们可以具有相同的名称。这意味着只要它们具有不同数量的参数或不同的参数数据类型，你就可以给多个函数赋予相同的名称。\n\
    \n所示是一个示例实现：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nfloat processnum\
    \ (float x, float y)\n{\n  return (x/y);\n}\n\nint processnum (int x, int y)\n\
    {\n    return (x+y);\n}\n\nint main () {\n  int a=2, b=2;\n  float c=4.0,m=4.0;\n\
    \  cout << processnum (a, b)<<endl;\n  cout << processnum (c, d)<<endl;\n  return\
    \ 0;\n}\n```\n\n在这种情况下，我们声明并定义了两个具有相同名称 `processnum` 的函数。其中一个接受两个 `int` 类型的参数，另一个接受两个\
    \ `float` 类型的参数。编译器通过分析调用函数时作为值传递的数据，知道在每种情况下应该引入哪一个。如果用两个 `ints` 作为参数调用它，它将调用声明中具有两个\
    \ `int` 参数的函数。另一方面，如果用两个 `floats` 调用它，它将调用模型中具有两个 `float` 参数的特定用例。\n\n在第一次调用 `processnum()`\
    \ 时，传递的两个参数是 `int` 类型。随后，调用了第二个声明的函数，它将两个值相加并返回结果。然而，第二次调用传递了两个 `float` 类型的参数。因此，调用了具有第一个模型的函数。这个函数具有不同的行为，将一个参数除以另一个参数。因此，函数调用的行为取决于所传递参数的类型，因为函数已经被重载了。\n\
    \n重要重要的是，函数还可以以其他方式进行重载，且至少有一个参数必须具有不同的数据类型。\n\n## 内联函数\n\n`inline` 指定符向编译器表示对相关函数进行内联替换。这不会改变函数本身的行为。然而，它用于建议编译器将函数体产生的代码必须在函数被调用的地方嵌入，而不是仅嵌入一次并对其进行通用调用，后者在大多数情况下会产生运行时的某些额外开销。\n\
    \n标准语法：\n\n```cpp\ninline <data type> <identifier> ( <parameters with their data\
    \ types> )\n{\n    //Code\n}\n```\n\n"
