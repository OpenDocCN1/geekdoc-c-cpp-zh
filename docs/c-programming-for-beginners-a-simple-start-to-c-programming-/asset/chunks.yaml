    `#line` 指令允许我们控制两个内容：代码文档内部的行号，以及当发生错误时需要显示的记录名称。其语法为：


    `#line number "filename"`


    在这里，`number` 是分配给后续代码行的新行号。从这里开始，后续各行的行号将逐一递增。


    `"filename"` 是一个可选参数，允许重新定义将展示的文档名称。例如：


    ### 文件包含


    该指令在本次练习的不同部分中也一直被勤奋地使用。当预处理器找到 `#include` 指令时，它会将其替换为定义记录的完整内容确定确定包含记录的方法有两种。


    这两种表示方式的主要区别在于编译器搜索记录的位置（索引）。在第一种情况下，如果文档名被包含在引号之间，编译器首先在包含该指令的相同目录中查找记录。如果那里没有，编译器将在用于搜索标准头记录的默认索引中查找该文档。


    如果文档名被包含在尖括号 `<>` 之间，编译器将直接在配置为搜索标准头文件的地方查找记录。因此，标准头文件通常被包含在尖括号中，而其他特定的头文件则使用引号包含。


    ### Pragma 指令


    该指令用于为编译器定义各种选项。这些选项取决于你所使用的阶段和编译器。请查阅你的编译器的手册或参考资料，获取更多关于可以使用 `#pragma` 定义的可能参数的信息。如果编译器不支持某个
    `#pragma` 选项，它将被忽略——且不会产生错误。


    ### C++ 标准库 – 文件的输入/输出


    C++ 提供了以下类来执行字符到记录或从记录的输出和输入：


    * `ofstream`: 用于编辑文档的流类。

    * `ifstream`: 用于从文档读取的流类。

    * `fstream`: 同时用于对文档进行读取和编辑的流类。


    这些类直接或间接地地从 `ostream` 和 `istream` 类推导出来。我们已经有效地使用了类型为这些类的对象：`cin` 是 `istream`
    类的对象，`cout` 是 `ostream` 类的对象。


    因此，我们现在一直在使用与记录流关联的类。此外，确实我们可以像现在使用 `cin` 和 `cout` 那样使用我们的文档流，主要的区别在于我们需要将这些流与物理记录关联。


    示例：


    ```cpp

    #include <iostream>

    #include <fstream>


    using namespace std;


    int main () {

    ofstream newFile;

    newFile.open ("sample.txt");

    newFile << "Editing this file.\n";

    newFile.close();

    return 0;

    }

    ```


    ### 写入文档


    这段代码创建一个名为 `sample.txt` 的文档，并像我们习惯使用 `cout` 那样向其中添加一个句子，但使用的是记录流 `newFile`。


    ### 打开文件


    在这些类之一的对象上执行的大多数操作是将其与真实的记录关联。这种系统被称为打开文档。打开的文档在系统内部通过流（这些类之一的实例化，在之前的示例中是 `myFile`）来指称，在该流对象上执行的任何操作都将与其相关的物理记录相关。


    为了使用流对象打开记录特定记录，我们使用它的 `open()` 函数：


    `open (filename, mode)`


    在这里，`filename` 是文件名。下面是供参考的模式：


    * `ios::out` - 以输出操作打开。

    * `ios::in` - 以数据操作打开。

    * `ios::ate` - 将起始位置设置在文件末尾。

    * `ios::binary` - 以二进制模式打开。

    * `ios::trunc` - 如果为输出操作打开的文档在最近过去存在，则其原有内容将被删除并被新内容取代。

    * `ios::app` - 所有输出操作都在文档末尾执行。


    所有这些标记都可以使用位逻辑“或”运算符 (`|`) 合并。例如，如果我们需要以二进制模式打开 `example.bin` 记录以包含信息，我们可以通过以下
    `open()` 调用：


    `ifstream`、`ofstream` 和 `fstream` 类的每个 `open()` 函数都有一个默认模式，如果在打开文档时没有第二个运算符则使用它。对于
    `ofstream` 和 `ifstream` 类，`ios::out` 和 `ios::in` 自然地分别独立被接受，无论是否将一个排除它们的模式作为第二个参数传递给
    `open()` 函数。


    如果在调用函数时没有指定 `mode` 参数的任何属性，则仅连接默认值。如果在调用函数时该参数中带有任何值，则默认模式将被覆盖，而不是合并。


    以双重模式打开的文档流可以不受任何配置参数限制地执行输出和输入操作。非二进制记录被称为内容文档，由于某些特殊字符（如换行符和回车符）的设置可能会发生一些解释。


    由于在文档流对象上执行的第一个任务大多数是打开记录，这三个类都包含一个构造函数，该函数随后调用 `open()` 函数并具有与此部分完全相同的参数。因此，我们也可以通过组合声明之前的
    `myfile` 过程并在之前的案例中引导相同的打开操作：


    `ofstream myfile ("example.bin", ios::out | ios::app | ios::binary);`


    在单个语句中结合对象开发和流打开。这两种打开文档的结构都是合法且合理的。要检查记录流是否成功打开文档，你可以通过调用不带参数的 `is_open()` 来实现。该函数返回一个
    `bool` 值，如果流对象无疑连接到已打开的记录，则返回 true，否则返回 false：


    ### 关闭文件


    当我们完成对记录的操作时，应该关闭它，以便其资源再次变得可用。为了这样做，我们需要调用流的 `close()` 函数。该函数不接受参数，它的作用是刷新相关的句柄并关闭文档：


    `newFile.close();`


    当调用此函数时，流对象可以被用于打开另一个记录，该文档再次可以通过不同的方法打开。如果对象在析构时仍连接到已打开的文档，析构函数自然会调用 `close()`。


    ### 文本文件


    内容文档流是指在打开模式中排除 `ios::binary` 要求的流。这些记录旨在存储内容，因此我们输入或从从中输出的所有值都可以经历一些设计更改，这些更改与它们严格的二进制值没有本质区别。


    除了 `eof()`（检查是否已到达文档末尾）外，还有其他函数可以检查流的状态（每一个都返回一个 `bool` 值）。此外，还有 `bad()`、`good()`
    和 `eof()` 等其他可用函数。


    为了重置由任何这些函数之一检查的状态标志的特定目标，我们最近看到可以使用 `clear()`，它不接受参数。


