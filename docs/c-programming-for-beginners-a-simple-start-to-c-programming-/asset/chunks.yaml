    \ 是推断类的名称，`base_class_name` 是其所基于的基类的名称。`public` 修饰符可以被任何其他访问修饰符 `protected` 或\
    \ `private` 替换。该访问修饰符描述了继承自基类的部分的基类访问级别。\n\n```cpp\n#include <iostream>\nusing\
