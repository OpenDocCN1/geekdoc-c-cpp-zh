    }\n```\n\n### 关键字 this\n\n`this` 单词表示一个指向始终执行该类成员函数的对象的指针。它是指向对象本身的指针。\n\n它还经常作为\
    \ `operator=` 函数的一部分，该函数通过引用返回对象（避免使用临时对象）。接上之前的向量示例，我们可以编写一个像这样的这样的 `operator=`\
    \ 能力。\n\n实际上，这个能力与编译器为该类自动创建的代码非常相似，前提是我们没有排除用于复制该类对象的 `operator=` 部分函数。\n\n###\
    \ 静态成员\n\n类可以包含静态部分，可以是数据或函数。类的静态数据通常被称为“类变量”，因为对于该类的所有对象来说都有独特的值。它们的内容在该类的一个对象和另一个对象之间是不相同的。\n\
    \n## 友函数\n\n从根本上说，类的私有成员无法从声明它们的类外部访问。然而，这一标准并不影响友函数。\n\n如果我们需要声明一个外部函数为类的友元，从而允许该功能访问此类类的私有和保护成员，我们通过在类内部声明该外部函数的模型，并在其前面放置\
    \ `friend` 关键字来实现。\n\n示例：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
    \nclass myRectangle {\nint x, y;\npublic:\nvoid setValues (int, int);\nint func\
    \ () {return (x * y);} friend myRectangle copy (myRectangle);\n};\n\nvoid myRectangle\
    \ :: setValues (int a, int b) {\n  x = a;\n  y = b;\n}\n\nmyRectangle copy (myRectangle\
    \ rectParam) {\n  myRectangle rects;\n  rects.x = rectParam.x*2;\n  rects.y =\
    \ rectParam.y*2;\n  return (rects);\n}\n\nint main () {\n  myRectangle rectx,\
    \ recty;\n  rectx.setValues (2,3);\n  recty = copy (rectx);\n  cout << recty.func();\n\
    \  return 0;\n}\n```\n\n`copy` 函数是 `myRectangle` 的友函数。在该函数内部，我们拥有了访问类私有成员 `x`\
    \ 和 `y` 的能力。注意，在 `copy()` 的语句中或其后在 `func()` 中的使用中，我们都没有将 `copy` 视为 `myRectangle`\
    \ 类的一部分。它不是的！它本质上在不作为类的一部分的情况下进入了它的私有和保护成员。\n\n友函数可以用于，例如指导两个独立类之间的操作。大多数情况下，友函数的使用超出了面向对象的编程技术，因此在任何可能的情况下，最好使用同一类的部分来执行它们的操作。\n\
    \n## 友类\n\n通常正如我们可以声明友函数能力一样，我们也可以将一个类声明为另一个类的友，允许该类访问后者的私有和保护成员。\n\n示例：\n\n```cpp\n\
    #include <iostream>\n\nusing namespace std;\n\nclass mySquare;\n\nclass myRectangle\
    \ {\nint x, y;\npublic:\nint myArea () {return (x * y);}\nvoid convert (mySquare\
    \ a);\n};\n\nclass mySquare {\nprivate:\nint x;\npublic:\nvoid setSide (int a)\n\
    {side=a;}\nfriend class myRectangle;\n};\n\nvoid myRectangle::convert (mySquare\
    \ a) {\n  x = a.x;\n  y = a.x;\n}\n\nint main () {\n  mySquare sqr;\n  myRectangle\
    \ rect;\n  sqr.setSide(4);\n  rect.convert(sqr);\n  cout << rect.myArea();\n \
    \ return 0;\n}\n```\n\n在这个示例中，我们将 `myRectangle` 声明为 `mySquare` 的友，以便 `myRectangle`\
    \ 函数能够访问 `mySquare` 的私有和保护成员，特别是 `mySquare::x`。\n\n## 类之间的继承\n\nC++ 类的一项关键特性是继承，它允许你创建自不同类的类。因此，除了它们自身的之外，它们自然地包含了“父类”的部分成员。\n\
    \n继承自其他类继承了基类的所有可用部分。这意味着如果基类包含部分 A 并且我们确定到一个具有部分 B 的另一个类，那么派生类将包含部分 A 和 B。\n\n"
