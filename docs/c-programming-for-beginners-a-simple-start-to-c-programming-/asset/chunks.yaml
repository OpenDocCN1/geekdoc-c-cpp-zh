    # C++ 基础


    C++ 是一种面向对象的语言，其大部分特性和基础结构都源于 C。这可能就是为什么 C++ 被称为 C 的“超集”的原因。任何用 C 语言编写的程序在法律和语法上都是一个
    ANSI C++ 程序。然而，这一陈述的反面并不成立。在不纠结于过多理论的情况下，让我们直接进入编程，这无疑是学习任何编程语言的最好方式。


    ### 基础基础 C++ 程序


    最简单的入门程序是在屏幕上打印“Hello World!”。该程序的代码如下：


    代码：


    ```cpp

    //Simple C++ Program


    #include <iostream>


    using namespace std;


    int main ()

    {


    cout << "Hello World!";


    return 0;

    }

    ```


    输出：

    Hello World!


    在继续深入之前，让我们逐行分析这个程序。第一行是注释行。这一行不包含在机器运行的实际代码中。它仅供开发者日后参考，并使代码更容易理解。在 C++ 中有两种编写注释的方法。其中一种方法是在文本前使用
    `//`，另一种方法是在文本前使用 `/*` 并在结束处使用 `*/`。


    第二行使用 `#include` 并向代码中包含了 `iostream` 库。该库方便了输入/输出操作，并允许用户使用控制台进行输入和获取输出。第三条语句指定代码正在使用
    `std` 命名空间。`std` 命名空间包含了 C++ 包中所有的内置库。因此，如果你希望使用这些任何一个库，包含此语句对你来说是关重要的。


    打印“Hello World!”的程序从第四条语句开始。`main()` 函数是 C++ 编程语言执行开始的函数。`main()` 必须返回一个整数值。函数的作用域使用大括号
    `{` 和 `}` 来描述。


    函数体包含两个语句。第一条语句使用标准 I/O 操作 `cout`，用于在屏幕上打印指定的输出。类似的函数 `cin` 用于从控制台获取输入。而 `cout`
    操作使用 `<<` 运算符，`cin` 操作则使用 `>>` 运算符。下一条语句返回一个整数值，如前所述。


    这两个语句都以分号（`;`）结束，这是 C++ 的标准。然而，此规则不适用于像 `include` 这样的指令。。 C++ 并不是特定格式的。如果你在 Windows
    上，可以使用 Dev-C++；在 Unix/Linux 上可以使用 GCC。


    # 数据类型、变量与常量


    虽然上一章所示的程序相当简单且用处存疑，但它应该为开始 C++ 编程奠定必要的基础。显而易见，编程不仅仅是在控制台上打印文本。当我们深入这门编程语言的复杂性时，首先要看的是变量。


    当你还是孩子学习加法和减法时，你的老师或父母一定要求过你在记忆中记住一个数字，然后记住第二个数字。一旦你有了这两个数字，就必须将它们相加并记住结果。当我们提到“记住”这个操作时，我们实际上指的是变量。


    因此，变量可以简单地描述为保存定义值的内存单元。例如，如果你回到加法的示例，可以假设有两个单元 `a` 和 `b`，它们包含要加的值。一个名为 `result`
    的结果将包含相加的值。因此，`a`、`b` 和 `result` 都是变量。


    ### 标识符


    记住内存单元地址并在每次想要对其执行操作时引用它们是非常的。为了解决这个问题，引入了标识符的概念。标识符是给具有定义值的内存单元的名称，是在其声明时指定的。对该内存单元值的任何更改都通过关联的标识符进行。在之前的的示例中，名称
    `a`、`b` 和 `result` 就是标识符。


    用作变量名称的标识符也应该是有效的。有几个决定标识符是否有效的准则，如下：


    1. 应该是字母、数字和下划线（`_`）的序列。

    2. 不应包含空格、符号或标点符号。

    3. 应以下划线或字母开头。

    4. 不应以数字开头。

    5. 不应该是保留关键字。在本章末的附录 I 中提供了保留关键字列表。


    '
