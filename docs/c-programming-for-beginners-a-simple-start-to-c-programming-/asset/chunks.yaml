    你可以使用 `const` 关键字在同一路径中以特定类型声明常量，就像声明变量一样。在这里，`tabulator` 和 `pathwidth` 是两个已定义的常量。它们的处理方式与标准变量非常相似，区别在于它们的属性在定义后无法被修改。


    # 运算符


    当我们知道变量和常量的存在时，就可以开始使用它们了。为了方便处理这些变量和常量，C++ 编程语言提供了运算符。与许多编程语言（其运算符本质上是基本的单词）不同，C++
    的运算符大部分由符号组成，这些符号不在字母表中，但在所有控制台中都是可用的。这使得 C++ 代码更短、更具通用性，因为它对英语单词的依赖较少，但在初期需要付出一些学习精力。


    ## 赋值 (=)


    此运算符将一个值分配给变量。


    语法：


    `<variable identifier> = <value>`


    示例：


    ```

    x = 0;

    ```


    此条语句将数值 5 赋值给变量 `a`。运算符（`=`）左侧的部分称为 `rvalue`（右值），右侧称为 `lvalue`（左值）。尽管 `rvalue`
    可以是常量、变量或这些者的任何组合，但 `lvalue` 必须是一个变量。分配时最重要的原则是从右到左操作，即操作可靠地从右向左执行，而绝不是反过来。


    语法：


    `<lvalue> = <rvalue>;`


    示例：


    ```

    x = y;

    ```


    此语句将变量 `y` (`rvalue`) 中包含的值分配给变量 `x` (`lvalue`)。C++ 相比其他编程语言的一个特性是，任务操作可以作为另一个任务操作的
    `rvalue`（或 `rvalue` 的）。


    示例：


    ```

    x = 7 + (y = 0);

    ```


    在示例语句中，`0` 被分配给变量 `y`，然后在该值的基础上加上 `7`。结果被赋值给 `x`。


    以下语句在 C++ 中也是合法的：


    ```

    x = y = z = 0;

    ```


    它将 0 赋值给三个变量：`x`、`y` 和 `z`。


    C++ 语言支持的五种算术运算是：加（`+`）、减（`-`）、乘（`*`）、除（`/`）和取模（`%`）。其中你可能不太熟悉的运算符是取模。该运算符将除法的余数作为结果。例如，如果你执行以下操作：


    ```

    a = 21 % 4;

    ```


    `21` 除以 `4` 的余数为 `1`。这就是该操作的输出。


    ## 复合赋值


    复合运算符包括减（`-=`）、加（`+=`）、除（`/=`）、乘（`*=`）、`>>=`、`<<=` 和取模（`%=`）。此外，还可以使用位逻辑运算符。当我们需要通过对变量的当前值进行操作来调整其估计时，可以使用复合赋值。


    语法：


    `<variable identifier><operator> = <value>`


    示例：


    ```

    x += 1

    ```


    在上面的示例中，`x` 的值增加了 `1`。


    ## 递增递减 (++, --)


    为了减少使用的语句数量，提供了递增和减操作。这些语句分别等同于 `+=1` 和 `-=1`。


    在早期的 C 编译器中，三种表述方式可能根据使用的不同而产生不同的可执行代码。如今，这种代码优化由编译器完成，因此这三种解释应该产生完全相同的可执行代码。


    该操作的一个特性是它既可以作为前缀使用，也可以作为后置使用。这意味着它可以位于变量标识符之前（`++a`），也可以之后（`a++`）。尽管在 `a++` 或
    `++a` 等基础语句中，两者的重要性完全相同。然而，在不同的声明中，如果构建或减少操作的结果在外部解释中被评估为一个值，那么它们的意义可能会有显著区别。


    如果递增操作作为前缀使用（`++a`），则值在语句结果被评估之前增加，随后扩展后的值在外部流流中被考虑。如果它作为后置使用（`a++`），则值在评估之后增加，因此在外部表示中评估的是增加操作之前保存的值。


    ## 关系和相等运算符


    这些运算符包括不等于（`!=`）、等于（`==`）、小于（`<`）、小于等于（`<=`）、大于（`>`）和大于等于（`>=`）。


    为了评估两个解释之间的之间的关系，我们可以使用关系和对应操作。关系操作的结果是一个布尔值。该结果可以是两个值之一：`false` 或 `true`。


    我们可能需要查看两个解释，例如判断它们是否等价，或者一个是否比另一个大。以下是 C++ 中可以使用的运算符列表：


    示例：


    ```

    (7 == 3) // 此表达式的结果为 false

    (6 > 5) // 此表达式的结果为 true

    (3 != 4) // 此表达式的结果为 true

    (6 >= 6) // 此表达式的结果为 true

    (5 < 5) // 此表达式的结果为 false

    ```


    ## 逻辑运算符


    C++ 编程语言支持三种逻辑操作，即：非（`!`）、和（`&&`）和或（`||`）。


    运算符 `not`（`!`）是 C++ 执行布尔操作 NOT 的运算符。它只有一个操作数，其主要功能是反转它的值。如果操作数的值为 `true`，则它会被转换为
    `false`。相反，如果值为 `false`，则被转换为 `true`。本质上，它提供了与其操作数评估结果相关的布尔结果。


    另外两个操作 `&&` 和 `||` 使用两个变量。操作 `&&` 对应布尔操作 AND。当且仅当两个操作数都为 `true` 时，该操作结果为 `true`。相反，操作
    `||` 与布尔操作 OR，如果至少有一个操作数为 `true`，则结果为真值。


    ## 条件运算符 (?)


    此运算符评估一个声明，如果该流为真则返回一个值，如果语句被评估为假则返回另一个。


    语法：


    `conditionForTesting ? resultIfTrue : resultIfFalse`


    如果 `conditionForTesting` 为 `true`，语句将返回 `resultIfTrue`。但如果 `conditionForTesting`
    为 `false`，它将返回 `resultIfFalse`。


    ## 逗号运算符 (,)


    逗号操作（`,`）用于在通常是独立语句的地方两个或多个独立流。当一组声明必须被评估为一个值时，只考虑最右边的表达式。


    ## 位运算符


    位运算包括位与（`&`）、位或（`|`）、`~`、`^`、`>>` 和 `<<`。这些运算符根据代表它们所存储属性的位设计来调整变量。


    ## 显式类型转换运算符


    此运算符允许将数据从一种指定的类型转换为另一种。在 C++ 中有几种方法可以实现这一点。最简单的方法继承自 C 语言，是在要转换的声明之前将新类型封装在括号
    `()` 之间。


    示例


    ```

    int i;

    float f;

    i = int ( f );

    ```


    上述代码声明了两个变量 `i` 和 `f`。虽然 `i` 是整数，但 `f` 是浮点数。直接将 `f` 赋值给 `i` 将引发警告。因此，你需要对其进行类型转换。第三条语句将浮点变量的值转换为整数，并将相同的值赋予整数变量。


    ## 运算符优先级


    你可能需要创建复杂的表达式。然而，这可能会引发一些问题。我们可能对先评估哪个操作数后评估哪个产生疑问。例如，在这个表示中：


    ```

    x = 5 – 4 + 3;

    ```

