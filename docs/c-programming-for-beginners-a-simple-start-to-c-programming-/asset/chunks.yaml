    # C++ Basics


    C++ is an object-oriented language, which derives most of its features and base
    constructs from C. This is perhaps the reason why C++ is known as a ‘superset’
    of C. Any program written in the C programming language is legally and syntactically
    an ANSI C++ program. However, the reverse of this statement is not true. Without
    dwelling into a lot of theory, let us directly move on to programming, which is
    certainly the best way to learn any programming language.


    ### A Basic C++ Program


    The simplest program to start with is one that prints ‘Hello World’ on the screen.
    The code for this program is given below:


    Code:


    ```cpp

    //Simple C++ Program


    #include <iostream>


    using namespace std;


    int main ()

    {


    cout << "Hello World!";


    return 0;

    }

    ```


    Output:

    Hello World!


    Before moving any further, let us analyze this program line-by-line. The first
    line is the comments line. This line is not included in the actual code, which
    is run by the machine. It is only for developers to reference at a later time
    and make understanding of the code easier. There are two ways of writing comments
    in C++. One of these methods uses `//` before the text and the other one uses
    `/*` before the text and `*/` at the terminating end.


    The second line uses a `#include` and includes `iostream` library to the code.
    This library facilitates input-output operations and allows the user to use console
    for giving input and getting output. The third statement specifies that the code
    is using the namespace `std`. The `std` namespace contains all the inbuilt libraries
    of the C++ package. Therefore, if you are hoping to use any these libraries, then
    it is essential for you to include this statement.


    The program for printing ‘Hello World!’ begins with the fourth statement. The
    function, `main()` is the function from where execution begins in C++ programming
    language. It is mandatory for the `main()` to return an integer value. The scope
    of the function is described using curly braces, `{` and `}`.


    The body of the function contains two statements. The first statement uses a standard
    I/O operation `cout`, which is used for printing the specified output on the screen.
    A similar function, `cin`, is used for taking input from the console. While, the
    operation, `cout`, uses `<<` operator, `cin` operation uses `>>` operator. The
    next statement returns an integer value, as previously mentioned.


    Both the statements are terminated with a semicolon (`;`), which is a C++ standard.
    However, this rule does not apply to directives like `include`. It is important
    to note that C++ is not format specific. You may use Dev-C++ or Turbo C if you
    are using Windows and GCC for Unix/Linux.


    # Data Types, Variables and Constants


    While the program illustrated in the previous chapter is rather simple and with
    questionable usefulness, it should have laid the required foundation to get started
    with C++ programming. Quite obviously, programming is not just printing texts
    on the console. As we dwell into the complexities of this programming language,
    the first thing to look at is variables.


    As a kid, when you learned addition and subtraction, your teacher or parents must
    have asked you to keep one number in your memory, and then memorize the second
    number. Once you have the two numbers, you must add them and memorize the result.
    When we mention the operation ‘memorize’, we are actually referring to a variable.


    Therefore, a variable can simply be described as a memory cell that saves a defined
    value. For example, if you go back to the example of addition, then you can assume
    two cells, `a` and `b`, which contain the values to be added. A result called
    `result` shall contain the added value. Therefore, `a`, `b` and `result` are variables.


    ### Identifiers


    It is difficult to memorize memory cell addresses and refer to them every time
    you wish to perform an operation on the same. In order to solve this issue, the
    concept of identifiers was introduced. An identifier is a name given to the memory
    cell with the defined value, while it is declared. Any changes made to the value
    of this memory cell, are performed using the associated identifier. In the previous
    example, the names, `a`, `b` and `result` are identifiers.


    The identifiers used as names for variables should also be valid. There are several
    guidelines that determine if an identifier is valid or not, which are as follows:


    1. Should be a sequence of letter, numbers and underscores (`_`).

    2. Should not contain spaces, symbols or punctuation marks.

    3. Should begin with an underscore or letter.

    4. Should not start with a number.

    5. Should not be a reserved keyword. A list of reserved keywords is provided at
    the end of the chapter in Appendix I.

