    Please note that some compilers may not support keywords starting with underscore.
    They are reserved for usage by the compiler itself. Also, C++ is case-sensitive.
    Therefore, `x` and `X` are two different variables. So, be careful!


    # Fundamental Data Types


    Gong back to the example of addition, you inherently know that you are memorizing
    two integers. This is not the case with the computer as you need to explicitly
    declare everything before any processing can take place. Therefore, you need to
    tell the computer which type of data you are going to store in the variable concerned.
    It is only after this declaration that the computer assigns memory to the variable.


    The table given below shows the fundamental data types, their memory requirements
    and a brief description of what they entail. However, please note that the memory
    size is machine and system dependent. The values given in the table are true for
    a standard 32-bit machine.


    | Data Type | Memory Required | Descriptions |

    | :--- | :--- | :--- |

    | char | 1 byte | Any character |

    | short intorshort | 2 bytes | Short Integer |

    | int | 4 bytes | Standard integer |

    | long intorlong | 4 bytes | Long integer |

    | float | 4 bytes | Floating point number |

    | double | 8 bytes | Double precision floating point number |

    | long double | 8 bytes | Long double precision floating point number |

    | bool | 1 byte | Boolean |

    | wchar_t | 2 bytes/4 bytes | Wide character |


    # Declaration of Variables


    A variable can be declared using the following statement:


    `<data type> <identifier>`


    Example:


    ```

    int a;

    ```


    This statement declares that the variable `a` will contain integer values. There
    can be several variations of this statement. You can define the variable in the
    following manner using the same statement.


    ```cpp

    int a = 0;

    ```


    This declaration assigns the value `0` to the variable `a`.


    In addition, you can also declare several variables using the same statement.
    An example is given below:


    ```cpp

    int a, b, c;

    ```


    In this case, all the variables, `a`, `b` and `c`, are declared to be integers.


    Integers (`int`, `short` and `long`) can be declared as signed or unsigned. You
    need to use the keywords `signed` and `unsigned` in the statement in the following
    manner:


    ```cpp

    signed int a;

    ```


    or


    ```cpp

    unsigned int a;

    ```


    In the absence of the keyword, the system assumed that the variable is signed
    in nature. You can also use the keywords `signed` and `unsigned` with `char`.
    If you use `unsigned char`, then you can only store characters in the variable.
    However, if you use `signed char`, you can store integers, one byte long, in the
    variable.


    # Scope of Variables


    As a rule, you can use a variable only after you have declared it. In addition
    to this, there exists a concept of ‘scope’. Scope is of two types: global and
    local. A variable is said to have global scope if the variable is declared outside
    the body of the code. As a result, this variable is available to all the functions
    of the program.


    Any variable declared inside the body of the code is inevitably local in nature
    and has local scope. The scope limitation of the variable is the block in which
    the variable is present, which is defined by enclosed braces, `{` and `}`.


    # Initialization of Variables


    When you declare a variable, it contains garbage value. In other words, the value
    of the variable cannot be predicted. In order to make the variable usable and
    useful, you need to define it by assigning a value to the same. Initialization
    of a variable can be done via two methods.


    According to the first method, the variable must be defined at the time of its
    declaration.


    Standard format:


    `<type identifier> <variable> = <value>`


    Sample implementation:


    ```cpp

    int a = 0;

    ```


    The other type of initialization makes use of the constructor method.


    Standard format:


    `<type identifier> <variable>(value)`


    Sample implementation:


    ```cpp

    int a(0);

    ```


    # Strings


    Strings are a data type, which is used to store non-numerical values. The length
    and number of values is equal to or greater than 1\. The C++ standard library
    supports ‘Strings’ data type. However, in order to use the functionality included
    in the library, you must include the header file, `string`, in the following manner.


    ```cpp

    #include<string>

    ```


    Strings can be declared and defined in the following manner:


    ```cpp

    string name = “John”;

    ```


    An alternate method for accomplishing the same task is:


    ```cpp

    string name;

    name = “John”

    ```


    # Constants


    Expressions that contain a fixed value are called constants.


    ## Literals


    Literals are used to denote concrete values inside the source code. For instance,
    `1871`.


    ## Integer Numerals


    They are numerical constants that distinguish between decimal values. Recognize,
    in the previous example, we don''t need to use any quotes. There are several types
    of literal, which are described in the section to follow.


    ## Floating Point Literals


    These literals express numbers in the form of exponents. They can incorporate
    a decimal point, an `e` character (symbolic of exponent), where a number occurs
    after the `e` character.


    Examples:


    `3.14159`

    `6.02e23`

    `1.6e-19`


    In the preceding examples, it can be seen how floating-point numbers are written.
    The first illustration uses decimal point while the last two numbers use `e` to
    indicate a `10x`, where x is the degree of exponentiation. ‘Double’ is the default
    type, used for floating point representation.


    ## Character and String Literals


    Non-numerical constants also exist in C++. While a character is a single `char`,
    a string represents a string of characters. Recognize that to speak of a solitary
    character, we wall it in the middle of single quotes `''''`. On the other hand,
    to express a string (which for the most part comprises more than one character),
    we wall it in the middle of double quotes `"`.


    ## Boolean Literals


    There are just two legitimate Boolean literals: `false` and `true`. These could
    be communicated in C++ as estimations of type `bool` by utilizing the Boolean
    literals `false` and `true`.


    ## Defined Constants (#define)


    You can characterize your names for constants that you utilize all the time without
    needing to depend on memory- ending variables, just by utilizing the `#define`
    preprocessor order.


    The syntax for the same is as follows:


    `#define <identifier> <value>`


    Example:


