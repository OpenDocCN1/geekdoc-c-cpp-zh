    \    }\n};\n\nclass myTri: public myPol {\npublic:\n    int myArea ()\n    {\n\
    \        return (x * y/ 2);\n    }\n};\n\nint main () {\n    myRect rect;\n  \
    \  myTri trgl;\n    rect.setValues (4,5);\n    trgl.setValues (4,5);\n    cout\
    \ << rect.myArea() << endl;\n    cout << trgl.myArea() << endl;\n    return 0;\n\
    }\n```\n\n类 `myRectangle` 和 `myTriangle` 的对象各包含继承自 `myPolygon` 的成员。这些成员是：`x`、`y`\
    \ 和 `setValues()`。\n\n`protected` 访问修饰符类似于 `private`。它的不同之处实际上发生在继承中。当一个类继承自另一个类时，被继承类的部分可以访问继承自基类的\
    \ `protected` 成员，但不能访问其 `private` 成员。\n\n由于我们需要让推断类 `myRectangle` 和 `myTriangle`\
    \ 的部分将 `x` 和 `y` 设为公开，而不仅仅是 `myPolygon` 的内部部分，因此我们使用了 `protected` 而不是 `private`。\n\
    \n# 从基类继承了什么\n\n从基础层面上说，继承类继承基类的每个成员，但以下除外：\n* 构造函数\n* 析构函数\n* `Operator=()` 成员\n\
    * 友元\n\n尽管基类的析构函数和构造函数本身没有被继承，但在创建或销毁继承类的对象时，析构函数和默认构造函数会被调用。如果基类没有默认构造函数，或者你需要在创建另一个继承对象时调用重载构造函数，你可以在推断类的每个构造函数定义中详细说明：\n\
    \n```cpp\n<derived constructor name> (<parameters>) : <base constructor name>\
    \ (<parameters>) {\n//Code\n}\n```\n\n## 多重继承\n\nC++ 中规定了一个类可以继承自多个类。这可以通过在类声明中使用逗号分隔基类来实现。例如，如果我们有一个用于在屏幕上打印的特定类（`myOutput`），并且我们需要我们的类\
    \ `myRectangle` 和 `myTriangle` 同样继承它的成员（尽管它们已经继承了 `myPolygon`），我们可以相应地进行组合。\n\n\
    # 实现多态\n\n在进入这一部分之前，建议你对指针和类继承有正确的理解。如果下方的任何解释对你来说看起来很陌生，你应该检查展示的代码段：\n\n### 指向基类的指针\n\
    \n继承类的一个关键特性是，指向推断类的指针与指向其基类的指针是兼容的。多态是利用这种简单但强大且灵活的特性的技巧，这种特性将面向对象的方法发挥到了最大优势。\n\
    \n### 虚拟成员\n\n类中可以在其推断类中被重新分类的部分被称为**虚拟成员**（virtual member）。为了实现将类的一部分声明为虚拟的特定目标，我们必须在它的语句之前放置\
    \ `virtual` 关键字。\n\n`virtual` 关键字的作用是允许推断类中与基类中具有同名的部分能够通过指针被正确调用，更准确地说，当指针类型是指向基类的指针但它指向一个推断类对象时也是如此。\n\
    \n### 抽象基类\n\n抽象基类和普通多态类之间的根本区别在于，由于抽象基类中至少有一个部分需要被使用，因此我们无法为它创建实例（对象）。尽管如此，一个无法实例化对象的类并不是完全没用的。我们可以创建它的指针并利用它所有的多态能力。\n\
    \n虚拟成员和动态类为 C++ 赋予了多态特性，这使得面向对象的编程在大型活动中成为一种非常有用的工具。显然，我们已经看到了这些特性的非常简单的应用，但这些特性可以与对象的展示或渐进分配的对象相结合。\n\
    \n# 函数模板和类模板\n\n函数模板是用于处理非特定数据类型的唯一函数。这允许我们创建一个函数布局，其实用性可以调整到多种类型或类，而无需为每种类型重新编写整个代码。\n\
    \n在 C++ 中，可以通过模板参数来实现。模板参数是一种特殊的参数，可以用于将类型作为参数传递：就像普通参数用于将值传递给函数一样，格式参数允许向函数传递类型。这些模板可以像使用其他普通数据类型一样使用这些参数。\n\
    \n使用的语法如下：\n\n```cpp\ntemplate <typename identifier> function_declaration;\ntemplate\
    \ <class identifier> function_declaration;\n```\n\n上述两个语句具有相同的含义和效果。唯一的区别在于关键字\
    \ `typename` 或 `class` 的使用。\n\n## 示例：\n\n为了说明函数模板的概念，让我们创建一个返回其所提供的两个参数中较大值的模板。\n\
    \n```cpp\ntemplate <class eType>\neType GetMaxVal (eType x, eType y)\n{\n    return\
    \ (x > y) ? x : y;\n}\n\nint a, b;\nGetMaxVal<int>(a, b);\n```\n\n在这个示例中，使用了 `eType`，它代表尚未指定的类型类型。为了调用此函数，你需要执行：\n\
    \n`<函数名> <数据类型> (<参数>)`\n\n \n\n例如，如果你想为 `int` 调用 `GetMaxVal`，那么你可以进行如下调用：`GetMaxVal<int>(a,\
    \ b)`。在这里，`a` 和 `b` 是任何整数。\n\n### 示例代码：\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\ntemplate <class X>\nX GetMaxVal (X a, X b)\n{\n    X result;\n\
    \    result = (a > b) ? a : b;\n    return (result);\n}\n\nint main () {\n   \
    \ int x = 1, y = 2, z;\n    long i = 21, j = 10, k;\n    z = GetMaxVal<int>(x,\
    \ y);\n    k = GetMaxVal<long>(i, j);\n    cout << z << endl;\n    cout << k <<\
    \ endl;\n    return 0;\n}\n```\n\n在这个示例中，`X` 被用作数据类型。然而，你可以使用你喜欢的名称。对 `GetMaxVal`\
    \ 的两次函数调用针对不同的数据类型：`int` 和 `long`。事实上，它也被用作创建新对象的数据类型。函数的输出是调用该函数时对应的数据类型。\n\n\
    在上面的示例中，如果你使用参数 `x` 和 `y` 调用函数，编译器将隐式地使用 `int` 调用该模板函数。然而，如果你使用 `long` 参数调用函数，编译器将为\
    \ `long` 调用该模板函数。在这些情况下，不需要指定 `<int>` 或 `<long>`，因为用于调用模板函数的参数已经声明过了。因此，接下来的函数调用就足够：`GetMaxVal(x,\
    \ y);`\n\n然而，请注意，你不能在函数调用中使用不同类型的参数。如果你需要执行此类操作，那么你必须在模板函数中定义两个如 `X` 不同的数据类型。\n\
    \n"
- fmt: "\nJust like function templates, you can also choose to write class templates.\
    \ The members of this class can use the user-defined type as parameters.\n\n```cpp\n\
    template <class myType>\nclass myNums {\n    myType vals [2];\n    public:\n \
    \   myNums (myType one, myType two)\n    {\n        vals[0]=first; vals[1]=second;\
    \ \n    }\n};\n```\n\nClass templates use members with data types, which are defined\
    \ by the user. The template class illustrated above creates an object, which can\
    \ store two numbers. These two numbers can be of any data type. The user-defined\
    \ data type `myType` is used to indicate this type. The class template can be\
    \ used for creating object pairs of different types in the following manner:\n\
    \n```cpp\nmyNums<int> myintnum (334, 45);\nmyNums<double> myintfloat (1.0, 4.25);\n\
    ```\n\n### Sample Code:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    \ntemplate <class myType>\nclass myNum {\nmyType x, y;\n\n public:\n myNums (myType\
    \ one, myType two)\n{x=one; y=two;}\n myType getMaxVal ();\n};\n\ntemplate <class\
    \ myType>\nmyType myNums<myType>::getMaxVal ()\n{\n    T retValue;\n    retValue\
    \ = x>y? x : y;\n    return retValue;\n}\n\nint main () {\nmyNums <int> myOb (125,\
    \ 27);\ncout << myOb.getMaxVal();\nreturn 0;\n}\n```\n\n# Namespaces\n\nNamespaces\
    \ permit you to club elements like classes, functions and objects under a name.\
    \ Thusly the worldwide extension could be separated in \"sub-scopes\", every unified\
    \ with its name.\n\nSyntax for namespace:\n\n```cpp\nnamespace <identifier name>\n\
    {\n    //elements\n}\n```\n\nWhere `identifier` is any substantial identifier\
    \ and `elements` is the situated of classes, functions and objects that are incorporated\
    \ inside the namespace. The usefulness of namespaces is particularly helpful in\
    \ the case that there is plausibility that a global function or object utilizes\
    \ the same identifier as another, bringing about redefinition blunders.\n\n###\
    \ Example:\n\n```cpp\nnamespace eNamespace\n{\n    int x, y;\n}\neNamespace::x\n\
    eNamespace::y\n```\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nnamespace\
    \ sample1\n{\n    double myvar = 5;\n}\n\nnamespace sample2\n{\n    double myvar\
    \ = 3.1416;\n}\n\nint main () {\n    cout << sample1::var;\n    cout<<\"\\n\"\
    ;\n    cout << sample2::var;\n    cout<<\"\\n\"; \n    return 0;\n}\n```\n\nFor\
    \ this situation, there are two variables with the same name: `myvar`. One is\
    \ defined inside the namespace `sample1` and the other one in `sample2`. No redefinition\
    \ blunders happen because of namespaces.\n\n# The using Keyword\n\nThe word `using`\
    \ is utilized to present a name from a namespace to interfere with another of\
    \ the same name in another namespace.\n\n### Example:\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nnamespace sample1\n{\n    double x = 0.1;\n    double\
    \ y = 1.5;\n}\n\nnamespace sample2\n{\n    double x = 1.1123;\n    double y =\
    \ 5.645;\n}\n\nint main () {\n    using sample1::x;\n    using sample2::y;\n \
    \   cout << x;\n    cout<<\"\\n\";\n    cout << y;\n    cout<<\"\\n\"; \n    cout\
    \ << sample1::y;\n    cout<<\"\\n\"; \n    cout << sample2::x;\n    cout<<\"\\\
    n\"; \n    return 0;\n}\n```\n\nRecognize how in this code, `x` (without any name\
    \ qualifier) alludes to `sample1::x` while `y` alludes to `sample2::y`, precisely\
    \ as our utilizing assertions have defined. In any case we have admittance to\
    \ `sample1::y` and `sample2::x` utilizing their completely qualified names. The\
    \ keyword can likewise be utilized as an order to present a whole namespace:\n\
    \n### Example:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nnamespace\
    \ sample1\n{\n    int x = 56;\n    int y = 70;\n}\n\nnamespace sample2\n{\n  \
    \  double x = 1.1125;\n    double y = 5.5567;\n}\n\nint main () {\n    using namespace\
    \ sample1;\n    cout << x;\n    cout<<\"\\n\"; \n    cout << y;\n    cout<<\"\\\
    n\"; \n    cout << sample2::x;\n    cout<<\"\\n\"; \n    cout << sample2::y;\n\
    \    cout<<\"\\n\"; \n    return 0;\n}\n```\n\nThis will print the `sample1` values\
    \ followed by the `sample2` values.\n\nNamespaces are valid only within the blocks\
    \ that they are declared. Case in point, in the event that we had the proposition\
    \ to first utilize the objects of one namespace and afterward those of another,\
    \ we could do something like:\n\n### Example:\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nnamespace sample1\n{\n    double x = 0;\n}\n\nnamespace\
    \ sample2\n{\n    double x = 1.1216;\n}\n\nint main () {\n    {\n        using\
    \ namespace sample1;\n        cout << x\n        cout<<\"\\n\";\n    }\n    {\n\
    \        using namespace sample2;\n        cout << x\n        cout<<\"\\n\";\n\
    \    }\n    return 0;\n}\n```\n\nThis code will print the `x` value for `sample1`\
    \ and then print the `x` value for `sample2`.\n\n# Namespace Aliasing\n\nWe can\
    \ declare alias names for existing namespaces as per the accompanying configuration:\n\
    \n`namespace newName = presentName;`\n\n### Namespace std\n\nAll the documents\
    \ in the C++ standard library proclaim every last bit of its elements inside the\
    \ `std` namespace. That is the reason why all programs have the statement that\
    \ specifies that the code is using namespace `std` at the beginning of the program.\n\
    \n# Exceptions Handling\n\nException handling gives an approach to respond to\
    \ extraordinary circumstances (like runtime blunders) in our system by exchanging\
    \ control to unique capacities called handlers. However, in order to handle exceptions,\
    \ you are required to put your code in the exception inspection.\n\nAt the point\
    \ when an uncommon situation emerges inside that block, an exemption is tossed\
    \ that exchanges the control to the special case handler. In the event that no\
    \ special case is tossed, the code proceeds with regularly and all handlers are\
    \ overlooked.\n\nAn exception is thrown by utilizing the `throw` keyword from\
    \ inside the attempt piece. Handlers are declared with the keyword `catch`, which\
    \ must be put promptly after the `try` block:\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main () {\n    try\n    {\n        throw 0;\n    }\n\
    \    catch (int e)\n    {\n        cout << \"Catch Block Entered!\"\n        cout\
    \ << \"Exception ID:\" << e;\n        cout<<\"\\n\";\n    }\n    return 0;\n}\n\
    ```\n\nThis code output the statement in the `cout` along with the exception ID.\n\
    \nThe exception handler is announced with the `catch` keyword. As should be obvious,\
    \ it starts after the `try` square. The `catch` arrangement is like a consistent\
    \ function that dependably has no less one parameter. The sort of this parameter\
    \ is extremely imperative, since the kind of the contention passed by the `throw`\
    \ outflow is checked against it, and just in the case they match, the exception\
    \ is gotten.\n\nWe can chain different handlers (try outflows), every unified\
    \ with an alternate parameter sort. Just the handler that matches its write with\
    \ the contention tagged in the `throw` proclamation is executed.\n\nAfter a special\
    \ case has been taken of the project execution continues after the `try-catch`,\
    \ not after the `throw`!\n\n# Specifications of Exceptions\n\nAt the point when\
    \ declaring a function, we can restrict the exception type. It may specifically\
    \ or by implication throw by affixing a `throw` addition to the function declaration.\n\
    \n`float myFunction (char myParam) throw (int);`\n\nThis declares a function `myFunction`,\
    \ which takes one argument and returns a float. The main exception that this capacity\
    \ may throw is a special case of int. In the event that it throws a special case\
    \ with an alternate sort, either specifically or in a roundabout way, then an\
    \ `int`-type handler cannot catch the same.\n\nIn the event that this `throw`\
    \ specifier is left vacant with no type, this implies the function is not permitted\
    \ to throw exceptions. Functions with no specifier are permitted to throw special\
    \ cases of any type.\n\n# Standard Exceptions\n\nThe C++ Standard library gives\
    \ a base class particularly intended to declare objects that are thrown as exceptions.\
    \ These are present in the header file, `<exception>`.\n\nIt is prescribed to\
    \ incorporate all dynamic memory designations inside a `try` obstruct that gets\
    \ this kind of exception to perform a cleaning activity rather than an irregular\
    \ end, which is the thing that happens when this type of special case is thrown\
    \ and not caught.\n\n# Typecasting\n\nChanging over an interpretation of a given\
    \ data type into an alternate data type is known as type casting. We have as of\
    \ now seen a few approaches to type cast.\n\n## Implicit Conversion\n"
