  trans: "\n就像函数模板一样，你也可以选择编写类模板。该类的成员可以使用用户定义的类型作为参数。\n\n```cpp\ntemplate <class\
    \ myType>\nclass myNums {\n    myType vals [2];\n    public:\n    myNums (myType\
    \ one, myType two)\n    {\n        vals[0]=first; vals[1]=second; \n    }\n};\n\
    ```\n\n类模板使用由用户定义的数据类型的成员。上述示例的模板类创建了一个对象，该对象可以存储两个数字。这两个数字可以是任何数据类型。用户定义的数据类型\
    \ `myType` 用于指示这种类型。类模板可以用以下方式创建不同类型的对象对：\n\n```cpp\nmyNums<int> myintnum (334,\
    \ 45);\nmyNums<double> myintfloat (1.0, 4.25);\n```\n\n### 示例代码：\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\ntemplate <class myType>\nclass myNum {\n\
    myType x, y;\n\n public:\n myNums (myType one, myType two)\n{x=one; y=two;}\n\
    \ myType getMaxVal ();\n};\n\ntemplate <class myType>\nmyType myNums<myType>::getMaxVal\
    \ ()\n{\n    T retValue;\n    retValue = x>y? x : y;\n    return retValue;\n}\n\
    \nint main () {\nmyNums <int> myOb (125, 27);\ncout << myOb.getMaxVal();\nreturn\
    \ 0;\n}\n```\n\n# 命名空间\n\n命名空间（Namespaces）允许你将类、函数和对象等元素归到一个名称下。因此，全局扩展可以被分为“子作用域”，每个作用域都有自己的名称。\n\
    \n命名空间的语法：\n\n```cpp\nnamespace <identifier name>\n{\n    //elements\n}\n```\n\
    \n其中 `identifier` 是任何实质性的标识符，而 `elements` 是包含在命名空间内的类、函数和对象的集合。命名空间的用处特别适用于当可能有一个全局函数或对象与另一个使用了相同的标识符时，这会导致重定义错误。\n\
    \n### 示例：\n\n```cpp\nnamespace eNamespace\n{\n    int x, y;\n}\neNamespace::x\n\
    eNamespace::y\n```\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nnamespace\
    \ sample1\n{\n    double myvar = 5;\n}\n\nnamespace sample2\n{\n    double myvar\
    \ = 3.1416;\n}\n\nint main () {\n    cout << sample1::var;\n    cout<<\"\\n\"\
    ;\n    cout << sample2::var;\n    cout<<\"\\n\"; \n    return 0;\n}\n```\n\n在这种情况下，有两个同名的变量：`myvar`。其中一个定义在命名空间\
    \ `sample1` 中，另一个定义在 `sample2` 中。由于使用了命名空间，没有发生重定义错误。\n\n# using 关键字\n\n`using`\
    \ 单词用于将命名空间中的名称引入，以便干扰另一个命名空间中的同名名称。\n\n### 示例：\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nnamespace sample1\n{\n    double x = 0.1;\n    double\
    \ y = 1.5;\n}\n\nnamespace sample2\n{\n    double x = 1.1123;\n    double y =\
    \ 5.645;\n}\n\nint main () {\n    using sample1::x;\n    using sample2::y;\n \
    \   cout << x;\n    cout<<\"\\n\";\n    cout << y;\n    cout<<\"\\n\"; \n    cout\
    \ << sample1::y;\n    cout<<\"\\n\"; \n    cout << sample2::x;\n    cout<<\"\\\
    n\"; \n    return 0;\n}\n```\n\n识别一下在此代码中，`x`（不带任何名称限定符）指的是 `sample1::x`，而 `y`指的是\
    \ `sample2::y`，正如我们使用的引言定义的那样。在任何情况下，我们都可以通过完全限定名访问 `sample1::y` 和 `sample2::x`。该关键字也可以作为指令来引入整个命名空间：\n\
    \n### 示例：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nnamespace sample1\n\
    {\n    int x = 56;\n    int y = 70;\n}\n\nnamespace sample2\n{\n    double x =\
    \ 1.1125;\n    double y = 5.5567;\n}\n\nint main () {\n    using namespace sample1;\n\
    \    cout << x;\n    cout<<\"\\n\"; \n    cout << y;\n    cout<<\"\\n\"; \n  \
    \  cout << sample2::x;\n    cout<<\"\\n\"; \n    cout << sample2::y;\n    cout<<\"\
    \\n\"; \n    return 0;\n}\n```\n\n这将先打印 `sample1` 的值，然后打印 `sample2` 的值。\n\n命名空间仅在其声明的块内有效。例如，如果我们打算先使用一个命名空间的对象，随后使用另一个命名空间的对象，我们可以像这样做：\n\
    \n### 示例：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nnamespace sample1\n\
    {\n    double x = 0;\n}\n\nnamespace sample2\n{\n    double x = 1.1216;\n}\n\n\
    int main () {\n    {\n        using namespace sample1;\n        cout << x\n  \
    \      cout<<\"\\n\";\n    }\n    {\n        using namespace sample2;\n      \
    \  cout << x\n        cout<<\"\\n\";\n    }\n    return 0;\n}\n```\n\n这段代码将打印\
    \ `sample1` 的 `x` 值，然后打印 `sample2` 的 `x` 值。\n\n# 命名空间别名\n\n我们可以根据相应的配置为现有命名空间声明别名：\n\
    \n`namespace newName = presentName;`\n\n### std 命名空间\n\nC++ 标准库中的所有文档都在 `std`\
    \ 命名空间内声明了每一个元素。这就是为什么所有程序在开头都有一个指定代码使用 `std` 命名空间的语句。\n\n# 异常处理\n\n异常处理提供了一种应对系统中异常情况（如运行时错误）的方法，通过将控制权转移到称为处理器（handlers）的特殊函数来实现。然而，为了处理异常，你需要将代码放在异常检查块中。\n\
    \n当该块内部出现异常情况时，会抛出一个异常，并将控制权转移到特殊的特殊情况处理器。如果没有抛出特殊情况，代码将正常继续，所有的处理器都被忽略。\n\n通过在\
    \ `try` 块内部使用 `throw` 关键字抛出异常。处理器用 `catch` 关键字声明，它必须必须紧跟在 `try` 块之后：\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\nint main () {\n    try\n    {\n   \
    \     throw 0;\n    }\n    catch (int e)\n    {\n        cout << \"Catch Block\
    \ Entered!\"\n        cout << \"Exception ID:\" << e;\n        cout<<\"\\n\";\n\
    \    }\n    return 0;\n}\n```\n\n这段代码输出了 `cout` 中的语句以及异常 ID。\n\n异常处理器用 `catch`\
    \ 关键字声明。显而易见，它位于 `try` 语句块之后。`catch` 语句就像一个函数，它可靠地至少有一个参数。该参数的类型至关重要，因为 `throw`\
    \ 输出传递的异常类型将与其进行比对，只有当它们匹配时，异常才会被获取。\n\n我们可以链联不同的处理器（`try` 输出），每个处理器都关联一个不同的参数类型。只有与其在\
    \ `throw` 声明中标记的异常相匹配的处理器会被执行。\n\n在处理完特殊情况后，程序执行将在 `try-catch` 之后继续，而不是 `throw`\
    \ 之后！\n\n# 异常规范\n\n在声明函数时，我们可以限制异常类型。它可以通过特定或隐式地通过向函数声明中添加 `throw` 附加项来抛出。\n\n\
    `float myFunction (char myParam) throw (int);`\n\n这声明了一个函数 `myFunction`，它接受一个参数并返回一个\
    \ `float`。该函数可能抛出的主要异常是 `int` 的特殊情况。如果它抛出了另一种类型的特殊情况（无论是特定的还是间接的），那么 `int` 类型的处理器将无法捕获。\n\
    \n如果此 `throw` 指定符为空且没有类型，则意味着该函数不允许抛出异常。没有指定器的函数允许抛出任何类型的特殊情况。\n\n# 标准异常\n\nC++\
    \ 标准库提供了一个基类，专门用于声明作为异常抛出的对象。这些存在于头文件 `<exception>` 中。\n\n建议将所有动态内存分配放在 `try`\
    \ 块中，以获取这种异常来执行清理工作，而不是异常终止（这是当这种特殊情况被抛出且未被捕获时发生的情况）。\n\n# 类型转换\n\n将给定数据类型的某种解释转换为另一种数据类型称为类型转换。我们到为止已经看到了一些类型转换的方法。\n\
    \n## 隐式转换\n"
