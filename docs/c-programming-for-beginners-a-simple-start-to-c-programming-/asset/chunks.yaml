    \ 分配内存的指针，或者是空指针（对于空指针，`delete` 不产生任何影响）。\n\n# 面向对象编程简介：类\n\n类是信息结构的扩展概念，而不仅仅是持有信息。它可以同时包含函数和数据。相反，对象是类的实例化。对于变量来说，类是类型，而对象是变量。\n\
    \n类通常使用关键字 `class` 声明，其语法如下：\n\n```cpp\nclass <className> {\naccessSpecifier_1:\n\
    \    memberData;\n    memberFunction;\naccess_specifier_2:\n    memberData;\n\
    \    memberFunction;\n} <objectName>;\n```\n\n其中 `className` 是类的标识符，`objectName`\
    \ 是该类对象的可选名称标识符。展示的内容可以包含部分，这些部分可以是数据成员或函数语句，并且可以带有指定符。\n\n示例：\n\n```\nint a;\n\
    ```\n\n在这里，`a` 是 `int` 类的一个对象。\n\n## 访问修符\n\n这与信息结构的语句本质上相同，只是我们现在可以额外包含函数和数据部分，以及这种称为访问修符的新事物。访问权限或访问修符包括以下三个关键字之一：`private`、`public`\
    \ 或 `protected`。这些修符改变了对其作用范围内的成员的访问权限。\n\n- **Private (私有)**：类的此类成员仅从同类的其他成员或其伴侣内部访问。\n\
    - **Protected (受保护)**：此类成员可以从同类成员及其伴侣访问，还可以从其派生类的部分访问。\n- **Public (公有)**：此类成员可以在对象可见的任何地方访问。\n\
    \n默认情况下，类的所有成员对于其所有成员来说都是私有的。\n\n示例：\n\n```cpp\nclass myRectangle {\n    double\
    \ a, b;\npublic:\n    void setValues (double, double);\n    double func (void);\n\
    } myRect;\n```\n\n在这个示例中，`a` 和 `b` 是私有的，而函数 `setValues()` 和 `func()` 是公有的。\n\n\
    ## 构造函数和析构函数\n\n你大多数时候需要在创建过程中引入变量或分配动态内存，以清理内存并避免在程序执行期间返回意外值。\n\n考虑之前的示例，如果你在没有初始化它们的情况下将\
    \ `a` 和 `b` 作为参数传递给函数，那么函数获得的值将是垃圾值。你的代码可能会给出错误的结果或突然崩溃。\n\n考虑到避免这种情况的目标，类可以包含一个名为\
    \ `constructor`（构造函数）的特殊函数，该函数在此类的另一个对象被创建时会被自然调用。这个构造函数的名称必须与类名相同，并且不能有任何返回类型。\n\
    \n示例：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nclass myRectangle\
    \ {\n    double x, y;\npublic:\n    myRectangle (double, double);\n    double\
    \ areaRect () {return (x*y);}\n};\n\nmyRectangle :: myRectangle (double a, double\
    \ b) {\n  x = a;\n  y = b;\n}\n\nint main () {\n    myRectangle rectx (1,2);\n\
    \    cout << \"rect area: \" << rectx.areaRect() << endl;\n    return 0;\n}\n\
    ```\n\n`main()` 中的第一条语句实例化类 `myRectangle`。创建对象时传递的参数调用了构造函数，并将矩形的尺寸初始化为 1 和 2。因此，当调用\
    \ `areaRect()` 时，函数返回正确的面积值 2。\n\n构造函数不能像普通函数那样显式地调用。它们只在创建类的另一个对象时执行。你同样注意到构造函数（类内部）和最后的构造函数定义都没有包含返回值，甚至没有\
    \ `void`。\n\n析构函数实现相反的作用。当对象需要被销毁时会被调用，可能是因为它的生存周期已结束（例如，它被定义为函数内部的局部变量且函数关闭了），或者它是一个显式分配的对象并使用\
    \ `delete` 运算符释放。\n\n"
