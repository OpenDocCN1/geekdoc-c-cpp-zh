    \n## Liskov substitution principle is a pattern of coding that will help to prevent\
    \ unintended functionality from being introduced into the code when you extend\
    \ classes via inheritance.\n\nHowever, certain language features may give experienced\
    \ developers an impression that it's OK to write code in violation of this principle.\
    \ For example, virtual keyword in C# may seem like it's even encouraging people\
    \ to ignore this principle. And sure enough, when an abstract method is overridden,\
    \ nothing will break, as the original method didn't have any implementation details.\
    \ But a virtual method would have already had some logic inside it; therefore\
    \ overriding it will change the behavior and would probably violate Liskov substitution\
    \ principle.\n\nThe important thing to note, however, is that a principle is not\
    \ the same as a law. While a law is something that should always be applied, a\
    \ principle should be applied in the majority of cases. And sometimes there are\
    \ situations where violating a certain principle makes sense.\n\n## Conclusion\n\
    \nLiskov substitution principle is a pattern of coding that will help to prevent\
    \ unintended functionality from being introduced into the code when you extend\
    \ classes via inheritance.\n\nHowever, certain language features may give experienced\
    \ developers an impression that it's OK to write code in violation of this principle.\
    \ For example, virtual keyword in C# may seem like it's even encouraging people\
    \ to ignore this principle.\n\nSo, whenever you need to decide whether or not\
    \ to override a virtual method in C#, use common sense. If you are confident that\
    \ none of the components that rely on the base functionality will be broken, then\
    \ go ahead and override the method, especially if it seems to be the most convenient\
    \ thing to do. But try to apply the Liskov substitution principle as as much as\
    \ you can.\n"
