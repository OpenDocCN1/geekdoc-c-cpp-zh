    # Benefits of using Observer


    The key benefits of using the Observer design pattern are as follows:


    +   - The relationships between objects can be established and removed at runtime.

    - Each object has its own pre-defined role, so the single responsibility principle
    is well maintained.


    Now let''s have a look at the caveats of using the Observer design pattern that
    you should be familiar with.


    # Caveats of using Observer


    Perhaps the only caveat of the Observer design pattern is that the subscribed
    objects don''t get updated at the same time and there is no guarantee in what
    order they will be updated. In most of the cases, it''s not a problem. But it
    might be an issue in some scenarios.

    Also, if you are building a real-life distributed application, having a proper
    publisher/subscription (pub/sub) system might be more appropriate than using the
    Observer design pattern. But still, if you do use such a system, being familiar
    with how the Observer'
