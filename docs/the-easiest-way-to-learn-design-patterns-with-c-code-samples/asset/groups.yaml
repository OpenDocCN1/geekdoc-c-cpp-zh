    \n```csharp\nusing Visitor_Demo;\nvar mdText = @\"This is **first** paragraph.\\\
    nThis is *second* paragraph.\\nThis is ~~third~~ paragraph.\";\nvar htmlText =\
    \ @\"<p>This is <strong>first</strong> paragraph\\nhtml</p><p>This is <em>second</em></p><p>This\
    \ is <del>third</del></p>\";\nvar visitor = new MdConverterVisitor();\nvar textToHtmlConverter\
    \ = new TextToHtmlConverter();\nvar htmlToTextConverter = new HtmlToTextConverter();\n\
    \nConsole.WriteLine(\"MD to HTML:\");\nConsole.WriteLine(textToHtmlConverter.Accept(visitor,\
    \ mdText));\n\nConsole.WriteLine(\"HTML to MD:\");\nConsole.WriteLine(htmlToTextConverter.Accept(visitor,\
    \ htmlText));\n```\n\n*(注：由于原文后续存在大量重复内容，此处已按要求去重处理。)*\n"
