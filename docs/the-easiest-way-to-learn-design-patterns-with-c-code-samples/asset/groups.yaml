    \n责任链可以总结如下：\n\n- 一个处理器（Handler）对象。\n- 处理器有一个方法来设置它的继任者（Successor），后者代表链中的下一个\
    \ Handler 实例。\n- 每个处理器代表一个处理步骤。\n- 方法可能包含一个条件，允许它短路并立即返回。\n\n## 责任链示例\n\n为了演示责任链，我们将使用一个类似于\
