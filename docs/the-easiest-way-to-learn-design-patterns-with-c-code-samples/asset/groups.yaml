    We check which operating system we are running the program on. If it''s either
    Linux or Windows, we set the appropriate Strategy implementation inside our Context.
    And then we execute the action on our Context, which triggers the behavior specific
    to the current Strategy implementation.


    And this concludes the overview of the Strategy design pattern. Let''s now summarize
    its benefits.


    # Benefits of using Strategy


    The main benefits of using the Strategy design pattern are as follows:


    +   - It reduces complex conditional logic from the code, as each type of behavior
    is handled by its own strategy.

    - You can easily swap algorithms during runtime.

    - Because the Context retains its Strategy, you don''t have to execute conditional
    logic every time you need to execute the action.

    - Both the single responsibility principle and the open-closed principle are well
    maintained.


    But, as good as the Strategy pattern is, it might still be not appro- in some
    situations. Let''s examine why.'
  - '[PAGE 315]


    # Caveats of using Strategy


    As with the State design pattern, using Strategy might overcomplicate things in
    scenarios where the conditional logic isn''t too complicated to begin with. In
    these situations, it might be more appropriate to just apply the conditional logic
    directly.


    Likewise, all modern programming languages, including C#, have components that
    allow you to provide method templates (delegates, anonymous actions, etc.) without
    having to have interfaces and implementations. And in some situations, it would
    be more appropriate to use these language features instead of having a whole bunch
    of extra classes and interfaces.


    Otherwise, Strategy is still a useful design pattern and there are many scenarios
    where it will prove helpful.'
  - '[PAGE 316]


    # 44. Template Method


    Template Method design pattern is all about using a combination of concrete and
    abstract logic inside an abstract class to create multiple concrete instances
    of it. Template Method would be defined inside an abstract class, so it cannot
    be used directly. It will have to be overridden by a concrete implementation of
    such a class.


    It''s not to be confused with interfaces or pure abstract classes. What makes
    the Template Method unique is that some pieces of logic inside of it are already
    concrete. Typically, this is by having a concrete public method that calls various
    protected methods. However, some or all of these protected methods would be abstract,
    which makes the behavior of the class unique to each of its implementations.


    Template Method design pattern can be summarized as follows:


    +   - There is an abstract class with a non-abstract public method that calls
    one or more abstract protected methods.

    - Any concrete implementation of this class will need to override the abstract
    protected methods, giving them implementation-specific behavior.

    - As a result, the overall behavior of the public method that calls those abstract
    methods will be unique based on implementation.


    We will now go through an example implementation of Template Method. The complete
    solution can be found via the link below:


    https://github.com/fiodarsazazanavets/design-patterns-in-csharp/tree/main/Behavioral_Patterns/Template-Method'
