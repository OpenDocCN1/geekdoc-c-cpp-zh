    \ The results of using Mediator\n\n# Benefits of using Mediator\n\nThe main benefits\
    \ of using the Mediator pattern are follows:\n\n- It significantly reduces coupling\
    \ between objects, as none of the Participants call each other directly.\n- Both\
    \ the single responsibility principle and open-closed principle are well enforced.\n\
    \n# Caveats of using Mediator\n\nThe main danger with the Mediator pattern is\
    \ that, you have to deal with many Participant types, your Mediator object can\
    \ easily evolve into God object.\n\n# 40. Memento\n\nMemento is a design pattern\
    \ that is used specifically for storing intermediate states of some data, so the\
    \ actions can be undone and the state can be reverted.\n\nMemento design pattern\
    \ can be summarized as follows:\n\n- There is an Originator object, which acts\
    \ as the origin of the data that can change its state at.\n- There is a Memento\
    \ object, which represents a single-snapshot of the data.\n- Originator object\
    \ can generate a new instance of Memento when some action is performed, or accept\
    \ an instance of Memento to reset its data.\n- There’s also a Caretaker object,\
    \ which stores a collection of Memento objects in a stack. This stack represents\
    \ the history of changes.\n- The Caretaker object coordinates the history of changes\
    \ with the Originator and allows the consumer to undo the actions.\n\nWe will\
    \ now go through an example implementation of Memento. The complete solution can\
