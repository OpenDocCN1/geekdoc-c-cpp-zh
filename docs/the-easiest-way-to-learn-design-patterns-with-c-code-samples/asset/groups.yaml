- md: "\n## 4. Interface segregation principle\n\n```csharp\npublic string ConvertMdText(string\
    \ inputText)\n{\n    throw new NotImplementedException();\n}\n```\n\nAnd that\
    \ introduces a problem. We have ended up with a method that we will never use.\
    \ And if we would want to create other derived classes that are designed to deal\
    \ with text formats other than MD? We will then have to expand our interface and\
    \ keep adding new methods to every class that implements it.\n\nSo, we can implement\
    \ the following solution. Our base interface will only have a single method that\
    \ the base class will use:\n\n```csharp\nnamespace TextToHtmlConverter;\npublic\
    \ interface ITextProcessor\n{\n    string ConvertText(string inputText);\n}\n\
    ```\n\nThe good news is, in C#, we can use inheritance for interfaces, just like\
    \ we can use it for classes. So, we can create another interface that will be\
    \ relevant to those classes that are specific to processing MD-formatted text:\n\
    \n```csharp\nnamespace TextToHtmlConverter;\npublic interface IMdTextProcessor\
    \ : ITextProcessor\n{\n    string ConvertMdText(string inputText);\n}\n```\n\n\
    And so, we would implement the interface by the base class without having to add\
    \ any new methods:\n\n```csharp\nusing System.Text;\nusing System.Text.RegularExpressions;\n\
    \nnamespace TextToHtmlConverter\n{\n    public class TextProcessor : ITextProcessor\n\
    \    {\n        public virtual string ConvertText(string inputText)\n        {\n\
    \            var paragraphs = Regex.Split(inputText, @\"(\\r\\n?|\\n)\").Where(p\
    \ => p.Any(char.IsOrDigit));\n            var sb = new StringBuilder();\n    \
    \        foreach (var paragraph in paragraphs)\n            {\n              \
    \  if (paragraph.Length == 0)\n                {\n                    continue;\n\
    \                }\n                sb.Append($\"<p>{paragraph}</p>\");\n    \
    \        }\n            sb.Append(\"<br/>\");\n            return sb.ToString();\n\
    \        }\n    }\n}\n```\n\nAnd our derived class will remain clean too:\n\n\
    ```csharp\nnamespace TextToHtmlConverter;\npublic class MdTextProcessor : TextProcessor,\
    \ IMdTextProcessor\n{\n    private readonly Dictionary<string, (string, string)>\
    \ tagsToReplace;\n    public MdTextProcessor(Dictionary<string, (string, string)>\
    \ tagsToReplace\n    {\n        this.tagsToReplace = tagsToReplace;\n    }\n \
    \   public string ConvertMdText(string inputText)\n    {\n        var processedText\
    \ = base.ConvertText(inputText);\n        foreach (var key in tagsToReplace.Keys)\n\
    \        {\n            var replacementTags = tagsToReplace[key];\n          \
    \  if (CountStringOccurrences(processedText, key) % 2 == 0)\n            {\n \
    \               processedText = ApplyTagReplacement(processedText, key, replacementTags.Item1,\
    \ replacementTags.Item2);\n            }\n        }\n        return processedText;\n\
    \    }\n    private int CountStringOccurrences(string text, string pattern)\n\
    \    {\n        int count = 0;\n        int currentIndex = 0;\n        while ((currentIndex\
    \ = text.IndexOf(pattern, currentIndex)) != -1)\n        {\n            currentIndex\
    \ += pattern.Length;\n            count++;\n        }\n        return count;\n\
    \    }\n\n    private string ApplyTagReplacement(string text, string inputTag,\
    \ string outputOpeningTag, string outputClosingTag)\n    {\n        int count\
    \ = 0;\n        int currentIndex = 0;\n        while ((currentIndex = text.IndexOf(inputTag,\
    \ currentIndex)) != -1)\n        {\n            count++;\n            if (count\
    \ % 2 != 0)\n            {\n                var prepend = outputOpeningTag;\n\
    \                text = text.Insert(currentIndex, prepend);\n                currentIndex\
    \ += prepend.Length + inputTag.Length;\n            }\n            else\n    \
    \        {\n                var append = outputClosingTag;\n                text\
    \ = text.Insert(currentIndex, append);\n                currentIndex += append.Length\
    \ + inputTag.Length;\n            }\n        }\n        return text.Replace(inputTag,\
    \ string.Empty);\n    }\n}\n```\n\n## When NotImplementedException is appropriate\n\
    \nIn C#, NotImplementedException is an error type that is specifically designed\
    \ to be thrown from the members that implement the interface, but aren't intended\
    \ to be used. And it comes directly from the core system library of C#.\n\nAt\
    \ the first glance, it may seem that with this feature in place, the language\
    \ was designed to violate interface segregation principle. However, there are\
    \ situations where leaving unused interface methods in your class would be appropriate\
    \ without necessarily violating this principle.\n\nOne situation where throwing\
    \ NotImplementedException will be appropriate if your class is a work in progress\
    \ and this has been put there temporarily. You may decide all the essential members\
    \ for your class ahead of time and create the interface immediately, before you\
    \ forget what you intended to do.\n\nHowever, creating the class may take a relatively\
    \ long time and may not be able to do it all in one. Despite this, you will already\
    \ have to implement every interface member. Otherwise your code would not compile.\
    \ This is precisely where NotImplementedException serves its purpose. You can\
    \ populate all members at your convenience.\n\n## 4. Interface segregation principle\n\
    \nAnd, because every interface member is intended to be implemented and is required\
    \ for the finished product, this will not violate segregation principle.\n\nThe\
    \ other case is when you want to write an interface to enable easy testing of\
    \ your code. You may have an original class that is intended to be placed in production.\
    \ This class may have various pieces of logic that you will not be able to replicate\
    \ on a development machine. For example, it may be sending requests to a server\
    \ or reading messages from a certain queue. And in that class, every method and\
    \ property is absolutely required to be there.\n\n## 5. Dependency inversion principle\n\
    \nFinally, we've reached the last of the SOLID principles - dependency inversion\
    \ principle.\n\nThe full solution demonstrated in this chapter is available via\
    \ the following link:\n\nhttps://github.com/fiodarsazanavets/Dotnet-CSharp-SOLID-demo/master/5-dependency-inversion-principle\n\
    \n## What is dependency inversion principle\n\nDependency inversion principle\
    \ states that a higher-level object should never depend on a concrete implementation\
    \ of a lower-level object. Both should depend on abstractions. But what does it\
    \ actually mean, you may ask?\n\nAny object oriented language will have a way\
    \ of specifying a contract to which any class or module should adhere. Usually,\
    \ this is known as an interface.\n\nInterface is something that defines the signature\
    \ of all the public members that the class must have, unlike a class, an interface\
    \ doesnt have any logic inside those members. It doesn't even allow you to define\
    \ a method body to put the logic in.\n\nBut as well as being a contract that defines\
    \ the accessible surface area of a class, an interface can be used as a data type\
    \ in variables.\n"
