    # 40. Memento


    Memento is a design pattern that is used specifically for storing intermediate
    states of some data, so the actions can be undone and the state can be reverted.


    Memento design pattern can be summarized as follows:


    +   - There is an Originator object, which acts as the origin of the data that
    can change its state at will.

    - There is a Memento object, which represents a single snap-shot of the data.

    - Originator object can generate a new instance of Memento when some action is
    performed, or accept an instance of Memento to reset its data.

    - There’s also a Caretaker object, which stores a collection of Memento objects
    in a stack. This stack represents the history of changes.

    - The Caretaker object coordinates the history of changes with the Originator
    and allows the consumer to undo the actions.


    We will now go through an example implementation of Memento. The complete solution
    can be found via the link below:


    https://github.com/fiodarsazanavets/design-patterns-in-csharp/tree/main/Behavioral_Patterns/Memento


