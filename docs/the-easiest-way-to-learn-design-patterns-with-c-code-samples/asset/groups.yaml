    \nThis concluded the overview of the Observer design pattern. Let's now summarize\
    \ its main benefits.\n\n# Benefits of using Observer\n\nThe key benefits of using\
    \ the Observer design pattern are as follows:\n\n- The relationships between objects\
    \ can be established and removed at runtime.\n- Each object has its own pre-defined\
    \ role, so the single responsibility principle is well maintained.\n\nNow let's\
    \ have a look at the caveats of using the Observer design pattern that you should\
    \ be familiar with.\n\n# Caveats of using Observer\n\nPerhaps the only caveat\
    \ of the Observer design pattern is that the subscribed objects don't get updated\
    \ at the same time and there is no guarantee in what order they will be updated.\
    \ In most of the cases, it's not a problem. But it might be an issue in some scenarios.\n\
    Also, if you are building a real-life distributed application, having a proper\
    \ publisher/subscription (pub/sub) system might be more appropriate than using\
    \ the Observer design pattern. But still, if you do use such a system, being familiar\
    \ with how the Observer design pattern works will automatically make you understand\
    \ the key principles behind any pub/sub system.\n\n# 42. State\n\nState is a design\
    \ pattern that allows developers to change behavior of an object depending on\
    \ what state the object is in. The public interface of the object, however, remains\
    \ the same.\n\nYou can think of it as being analogous to a smartphone. When the\
    \ phone is in a locked state, pressing the same button brings up a prompt for\
    \ the unlock PIN. However, if the phone is already unlocked, pressing the same\
    \ button takes you to the home screen. It's the same button. But it behaves differently\
    \ if your device is in a different state. And the same thing can be done in the\
    \ code.\n\nState design pattern can be summarized as follows:\n\n- There is a\
    \ Context object, which contains the State interface.\n- State interface would\
    \ have multiple implementations, each with its own behavior.\n- The role of Context\
    \ object is to trigger specific public methods in the current State implementation\
    \ and to allow State implementation to be changed.\n- State implementations are\
    \ never manipulated directly by external client. Only Context object is called\
    \ directly by outer client.\n- However, the outer code instructs the Context to\
    \ change the concrete implementation of State inside itself.\n\nWe will now go\
    \ through an example implementation of State. The complete solution can be found\
    \ via the link below:\n\nhttps://github.com/fiodarsazanavets/design-patterns-in-csharp/tree/main/Behavioral_Patterns/State\n\
    \n# Prerequisites\n\nIn order to be able to implement the code samples below,\
    \ you need the following installed on your machine:\n\n- .NET 6 SDK (or newer)\n\
    - A suitable IDE or a code editor (Visual Studio, Visual Studio Code, JetBrains\
    \ Rider)\n\n# State implementation example\n\nWe will create a console application\
    \ project, which will mimic the basic operation of a smartphone. All we need for\
    \ the demonstration purposes is to show how the smartphone's Home button behaves\
    \ differently when its state changes.\n\nFirst, we will need to add the following\
    \ interface for its State. Regardless of what state the phone is in, the user\
    \ will still be able to press the Home button. And the interface reflects this.\n\
    \n```csharp\nnamespace State_Demo;\n\ninternal interface IMobileState\n{\n   \
    \ void PressHomeButton();\n}\n```\n\nNext, we will add a concrete implementation\
    \ of the State. In this implementation, pressing the Home button brings up the\
    \ screen unlock prompt.\n\n42. State\n\n```csharp\nnamespace State_Demo;\ninternal\
    \ class LockedScreenState : IMobileState\n{\n    public void PressHomeButton()\n\
    \    {\n        Console.WriteLine(\"Please enter screen PIN\");\n    }\n}\n```\n\
    \nAfter this, we will add another State implementation. In this case, pressing\
    \ the Home button opens the screen.\n\n```csharp\nnamespace State_Demo;\ninternal\
    \ class UnlockedScreenState : IMobileState\n{\n    public void PressHomeButton()\n\
    \    {\n        Console.WriteLine(\"Home screen has opened.\");\n    }\n}\n```\n\
    \nNext, we will add our Context object. This object holds one State implementation\
    \ at a time. The clients of this object can change the State and trigger PressHomeButton\
    \ on the State.\n\n```csharp\nnamespace State_Demo;\n\ninternal class MobilePhoneContext\n\
    {\n    IMobileState state;\n\n    public MobilePhoneContext()\n    {\n       \
    \ state = new LockedScreenState();\n    }\n\n    public void ChangeState(IMobileState\
    \ state)\n    {\n        this.state = state;\n    }\n\n    public void PressHomeButton()\n\
    \    {\n        state.PressHomeButton();\n    }\n}\n```\n\nNow, we will bring\
    \ it all together to see how the behavior changes when we change the State. To\
    \ do so, we will replace the content of Program.cs with the following:\n\n```csharp\n\
    using State_Demo;\n\nvar phone = new MobilePhoneContext();\n\nConsole.WriteLine(\"\
    Pressing home button.\");\nphone.PressHomeButton();\n\nConsole.WriteLine(\"Changing\
    \ phone state to unlocked.\");\nphone.ChangeState(new UnlockedScreenState());\n\
    Console.WriteLine(\"Pressing home button.\");\nphone.PressHomeButton();\nConsole.ReadKey();\n\
    ```\n\nAnd here is the output of this program:\n\n![](img/ddd2bfe3763461951a0219d12d42e08d_307_0.png)\n\
    \nFigure 42.1 - Demonstration of changed behavior due to changed State\n\nWe will\
    \ now summarize the benefits of using the State pattern.\n\n# Benefits of using\
    \ State\n\nSo, the key benefits of using the State design pattern can be summarized\
    \ as follows:\n\n- There is a clear separation between the types of the behavior\
    \ that should occur in different scenarios, so the single responsibility principle\
    \ is well maintained.\n- The open-closed principle is well implemented, as you\
    \ can easily add new behaviors to the existing functionality by simply adding\
    \ new states.\n- Complex conditions are eliminated from the code.\n\nNow, let's\
    \ have a look at the situations where the State design pattern wouldn’t perhaps\
    \ be the best solution.\n\n# Caveats of using State\n\nIf you are working with\
    \ some objects where the state can change, but these changes occur infrequently\
    \ and don't require complex conditional logic, then perhaps the State design pattern\
    \ will only overcom things without adding a lot of value. If you can still write\
    \ clean code that can be easily maintained and tested without using this design\
    \ pattern, then it might be an indication that this design pattern is needed.\n\
    \nHowever, if you are working with objects where the state is expected to change\
    \ fairly frequently and/or such change would require relatively complex code,\
    \ then it is indeed an ideal scenario for using the State design pattern.\n"
