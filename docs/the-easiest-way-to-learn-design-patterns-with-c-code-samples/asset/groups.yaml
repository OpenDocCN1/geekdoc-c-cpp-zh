    \ ?? string.Empty;\nplayerFactory.CreatePlayer().Play(filePath);\n\nConsole.ReadKey();\n\
    ```\n\nSo, as we can see, we are using inbuilt operating system detector to conditionally\
    \ choose the concrete implementation of the Factory. Then, we type a path to the\
    \ file that we want to play and the software will play it. User doesn't need to\
    \ care what operating system the software is on. It will work exactly the same.\n\
    \nAnd this concludes our example of Factory Method implementation. Let's now have\
    \ a look at the specific benefits we gain from using this design pattern.\n\n\
    ## Benefits of using Factory Method\n\nWhy do we not need to bother with different\
    \ implementations of **Target Object**? Why can't we just conditionally apply\
    \ the functionality that object encapsulates? Well, here are the reasons why:\n\
    \n- Factory Method enforces the single responsibility principle by separating\
    \ conditional logic from implementation of the logic inside each condition.\n\
    - This allows us to easily maintain the code and write automated tests for it.\
    \ There won't be any complex and barely readable tests assessing complex conditional\
    \ logic. Instead, a couple of simple scenarios will assess the correct implementations\
    \ of **Target Object** and **Factory** is picked up for each condition. Then,\
    \ separate sets of scenarios can be applied to each separate **Target Object**\
    \ and **Factory** implementation.\n- Factory Method allows you to execute a particular\
    \ condition once. Because all implementations of **Target Object** use a common\
    \ abstraction, a concrete implementation of it can be created once and then just\
    \ re-used throughout the code.\n\nBut this design pattern comes with some obvious\
    \ caveats too. And this is what we'll have a look at next.\n\n## Caveats of using\
    \ Factory Method\n\nEven with all its benefits in place, you may still question\
    \ this design pattern. Why do we even need a **Factory**? Why can't we just conditionally\
    \ select a concrete implementation of **Target Object** directly? Won't it achieve\
    \ the same benefits with less complexity?\n\nWell, if you have this question,\
    \ you are right to an extent. If you have a single Factory Method in your **Creator**\
    \ that returns only one type of a concrete implementation of the **Target Object**,\
    \ you will gain no benefits of using a **Creator**. But the benefits of Factory\
    \ Method become really apparent if you have more than one Factory Method in your\
    \ **Creator** and you are able to return multiple related objects.\n\nUsing Factory\
    \ Method this way turns it into another design pattern, known as Abstract Factory.\
    \ And this is what we will have a look at next.\n\n## 25. Abstract Factory\n\n\
    Abstract Factory is closely related to Factory Method. In fact, it is the Factory\
    \ class that hosts the so-called Factory Method. But as Factory Method refers\
    \ to a specific method inside a Creator or a Factory class, Abstract Factory can\
    \ have a number of such methods.\n\nAbstract Factory, along with its Factory Methods,\
    \ is used for creating concrete implementations of abstract types or interfaces.\
    \ This design pattern is applied when a concrete implementation of an object needs\
    \ to be chosen conditionally. But because Abstract Factory can host multiple Factory\
    \ Methods, it can be used to create concrete implementations of multiple related\
    \ objects.\n\nAbstract Factory can be summarized as follows:\n\n- There are some\
    \ interfaces or abstract classes, each having multiple concrete implementations.\
    \ They represent the objects that need to be created (let them call Target Objects).\n\
    - There is an abstract object (or an interface), known as a Creator, or a Factory\
    \ that returns abstract versions of Target Objects. Each of these Target Object\
    \ types has a creation method inside the Factory associated with it.\n- There\
    \ are multiple concrete implementations of the Factory, each returning a specific\
    \ set of the Target Object implementations.\n- When we need to return a specific\
    \ set of the Target Object implementations, we initialize a specific implementation\
    \ of the Factory and call the creation methods on it.\n\nWe will now go through\
    \ an example implementation of Abstract Factory. The complete solution can be\
    \ found via the link below:\n\nhttps://github.com/fiodarsanavets/design-patterns-in-csharp/tree/main/Creational_Patterns/Abstract-Factory\n\
    \n## Prerequisites\n\nIn order to be able to implement the code samples below,\
    \ you need the following installed on your machine:\n\n- .NET 6 SDK (or newer)\n\
    - A suitable IDE or a code editor (Visual Studio, Visual Studio Code, JetBrains\
    \ Rider)\n\n## Abstract Factory implementation example\n\nIn this example, we\
    \ will be creating an audio player application that will be able to play audios\
    \ on either Windows or Linux. It is similar to what we have done when we had a\
    \ look at an implementation of Factory Method. However, there will be some crucial\
    \ differences.\n\nIn the example that we have used to demonstrate Factory Method,\
    \ we have been returning a concrete OS-specific implementation of an audio player\
