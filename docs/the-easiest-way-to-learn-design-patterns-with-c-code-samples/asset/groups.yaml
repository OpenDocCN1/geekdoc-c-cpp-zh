    \n## 什么是里基夫替换原则\n\n里基夫替换原则最初由美国计算机科学家 Barbara Liskov 在1987年提出。该原则指出，如果用子类替换其任何一个派生类（derived\
    \ classes），程序的行为不应该改变。\n\n该原则的引入专门专门考虑了继承，而继承是面向对象编程的一项核心特性。继承允许你扩展类或模块的功能（取决于你使用的编程语言）。所以，如果你需要一个具有与你在另一个类中已有的功能紧密相关的新功能的类，你只需要继承现有类，而不是创建一个完全新的类。\n\
    \n当应用继承时，任何面向对象的编程语言都允许你将一个派生类作为数据类型的对象插入到期望子类对象的变量或参数中。例如，如果你有一个基类 `Car`，你可以创建另一个继承自它的类并命名为\
