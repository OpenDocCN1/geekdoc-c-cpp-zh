    # 24. Factory Method


    Factory Method is used for creating a concrete implementation of a particular
    abstract type or an interface. This design pattern is applied when a concrete
    implementation of an object needs to be chosen conditionally.


    Factory Method can be summarized as follows:


    +   - There is an interface or an abstract class with multiple concrete implementations.
    It represent an object that needs to be created (let''s call it Target Object).

    - There is an abstract object (or an interface), known as a Creator, or a Factory
    that returns an abstract version of Target Object.

    - There is a concrete implementation of the Factory per each concrete implementation
    of the Target Object.

    - When we need to return a specific implementation of the Target Object, we initialize
    a specific implementation of the Factory and call the creation method on it.


    We will now go through an example implementation of Factory Method. The complete
    solution can be found via the link below:


    https://github.com/fiodarsazanavets/design-patterns-in-csharp/tree/main/Creational_Patterns/Factory_Method


    # Prerequisites


    In order to be able to implement the code samples below, you need the following
