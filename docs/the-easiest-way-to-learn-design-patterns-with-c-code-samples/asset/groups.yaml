    \n其次，这种结构让那些还不了解模式的人方便查找合适的设计模式。如果你作为一个程序员，在工作中面临一个具有挑战性的问题，你最不想做的就是遍历所有设计模式的描述并试图找出哪些可以帮助你解决当前的问题。你想做的是找到你所面临问题的那个描述，然后利用它来查找合适的设计模式。如果有多个，你会想要\n\
    \n"
