    # 28. Singleton


    Singleton design pattern allows you to use a single instance of a particular object
    throughout your application. This is achieved with the help of a private constructor
    and a static method that can call this constructor from the outside.


    Singleton can be summarized as follows:


    +   - A Singleton class that is meant to be used as a single instance that is
    shared throughout an application has a private constructor, so it can only be
    created inside of the class itself.

    - The class holds a private static field containing its own data type.

    - To instantiate the class from the outside, the class has a static method that
    returns the same data type as the class itself.

    - This method will create an instance of the class via the private constructor
    and populate the private static field with this instance. Then this instance would
    be returned to the caller.

    - Any subsequent calls will just return the object instance that was already created.


    We will now go through an example implementation of Singleton. The complete solution
    can be found via the link below:


    https://github.com/fiodarsanavenets/design-patterns-in-csharp/tree/main/Creational_Patterns/Singleton


    # Prerequisites


    In order to be able to implement the code samples below, you need the following
    installed on your machine:'
