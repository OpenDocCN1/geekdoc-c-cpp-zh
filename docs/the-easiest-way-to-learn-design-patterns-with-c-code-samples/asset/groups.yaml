    \ text);\n    }\n\n    public string ProcessParagraphs(string text)\n    {\n \
    \       return text\n            .Replace(\"<p>\", \"\")\n            .Replace(\"\
    </p>\", \"\\n\")\n            .Replace(\"<br/>\", \"\");\n    }\n}\n```\n\n而 `TextToHtmlConverter`\
