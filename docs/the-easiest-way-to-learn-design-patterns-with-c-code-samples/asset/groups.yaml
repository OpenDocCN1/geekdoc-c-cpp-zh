    We will now summarize the benefits of using the State design pattern.


    # Benefits of using State


    So, the key benefits of using the State design pattern can be summarized as follows:


    +   - There is a clear separation between the types of the behavior that should
    occur in different scenarios, so the single responsibility principle is well maintained.

    - The open-closed principle is well implemented, as you can easily add new behaviors
    to the existing functionality by simply adding new states.

    - Complex conditions are eliminated from the code.


    Now, let''s have a look at the situations where the State design pattern wouldn’t
    perhaps be the best solution.'
  - '[PAGE 308]


    # Caveats of using State


    If you are working with some objects where the state can change, but these changes
    occur infrequently and don''t require complex conditional logic, then perhaps
    the State design pattern will only overcom things without adding a lot of value.
    If you can still write clean code that can be easily maintained and tested without
    using this design pattern, then it might be an indication that this design pattern
    is needed.


    However, if you are working with objects where the state is expected to change
    fairly frequently and/or such change would require relatively complex code, then
    it is indeed an ideal scenario for using the State design pattern.'
- md: "\n## 43. Strategy\n\nStrategy design pattern allows you to write maintainable\
    \ code in situations where conditional logic needs to be applied. Instead of placing\
    \ a specific piece of logic under a specific condition in the code, you would\
    \ move each of these pieces of logic into its own class. All of these classes\
    \ would implement exactly the same interface. So, all you would have to do in\
    \ your if or switch statement is to pick up a specific implementation of this\
    \ interface that is appropriate to a specific condition. Then, all you have to\
    \ do is just execute the action method to trigger this logic.\n\nBelow, we will\
    \ examine some clear benefits of this approach. But for now, let's summarize the\
    \ Strategy design pattern:\n\n- There is a Strategy interface that defines the\
    \ action method that may or not return some data.\n- There are multiple Concrete\
    \ Strategy implementations.\n- There is a Context object, which encapsulates the\
    \ Strategy interface.\n- The Context object allows the calling code to set its\
    \ internal Strategy field to a Concrete Strategy implementation.\n- The Context\
    \ object allows the calling code to execute the action method on the current implementation\
    \ of Strategy.\n- The Concrete Strategy implementation is set on the Context based\
    \ on some conditional logic.\n\nWe will now go through an example implementation\
    \ of Strategy. The complete solution can be found via the link below:\n\nhttps://github.com/fiodarsazanavets/design-patterns-in-csharp/tree/main/Behavioral_Patterns/Strategy\n\
    \n### Prerequisites\n\nIn order to be able to implement the code samples below,\
    \ you need the following installed on your machine:\n\n- .NET 6 SDK (or newer)\n\
    - A suitable IDE or a code editor (Visual Studio, Visual Studio Code, JetBrains\
    \ Rider)\n\n### Strategy implementation example\n\nWe will be building an application\
    \ that is able to play audio on both Linux and Windows operating systems. It will\
    \ be similar to the application that we have built while looking at the Factory\
    \ Method design pattern. This time, instead of conditionally returning an appropriate\
    \ player, we will conditionally trigger a one-off playback.\n\nAnd this demonstrates\
    \ the fundamental difference between the Strategy and the Factory Method design\
    \ patterns, as it's not uncommon for people to confuse the two. The intention\
    \ behind the Factory Method is to return a long-lived object that can be then\
    \ reused. The intention behind the Strategy is to execute a one-off action there\
    \ and then.\n\nWe will start by creating a console application project. Then,\
    \ we will add the following interface, which will represent our Strategy.\n\n\
    ```csharp\nnamespace Strategy_Demo;\n\ninternal interface IPlayerStrategy\n{\n\
    \    Task Play(string fileName);\n}\n```\n\nWe will then add a concrete implementation\
    \ of this interface that is capable of playing audio on Linux machines:\n\n```csharp\n\
    using System.Diagnostics;\nnamespace Strategy_Demo;\n\npublic class LinuxPlayerStrategy\
    \ : IPlayerStrategy\n{\n    public Task Play(string fileName)\n    {\n       \
    \ StartBashProcess(\"mpg123 -q '{fileName}'\");\n        return Task.CompletedTask;\n\
    \    }\n\n    private void StartBashProcess(string command)\n    {\n        var\
    \ escapedArgs = command.Replace(\"\\\\\", \"\\\\\\\\\");\n        var process\
    \ = new Process()\n        {\n            StartInfo = new ProcessStartInfo()\n\
    \            {\n                FileName = \"/bin/bash\",\n                Arguments\
    \ = \"-c {escapedArgs}\",\n                RedirectStandardOutput = true,\n  \
    \              RedirectStandardInput = true,\n                UseShellExecute\
    \ = false,\n                CreateNoWindow = true\n            }\n        };\n\
    \        process.Start();\n    }\n}\n```\n\nAnd then we will add the following\
    \ implementation that will allow us to play audio on Windows:\n\n```csharp\nusing\
    \ System.Runtime.InteropServices;\nusing System.Text;\n\nnamespace Strategy_Demo\n\
    {\n    internal class WindowsPlayerStrategy : IPlayerStrategy\n    {\n       \
    \ [DllImport(\"winmm.dll\")]\n        private static extern int mciSendString(string\
    \ command, StringBuilder stringReturn, int returnLength, IntPtr hWndCallback);\n\
    \n        public Task Play(string fileName)\n        {\n            var sb = new\
    \ StringBuilder();\n            var result = mciSendString(\"Play {fileName}\"\
    , sb, 1024 * 1024, IntPtr.Zero);\n            Console.WriteLine(result);\n   \
    \         return Task.CompletedTask;\n        }\n    }\n}\n```\n\nNow, we will\
    \ add our Context object, which will be as follows:\n\n```csharp\nnamespace Strategy_Demo;\n\
    \ninternal class PlayerContext\n{\n    private IPlayerStrategy strategy;\n   \
    \ public void SetStrategy(IPlayerStrategy strategy)\n    {\n        this.strategy\
    \ = strategy;\n    }\n    public Task Play(string fileName)\n    {\n        return\
    \ strategy.Play(fileName);\n    }\n}\n```\n\nAnd now, we will replace the content\
    \ of Program.cs class with the following:\n\n```csharp\nusing System.Runtime.InteropServices;\n\
    using Strategy_Demo;\n\nvar context = new PlayerContext();\nif (RuntimeInformation.IsOSPlatform(OSPlatform.Windows))\n\
    {\n    context.SetStrategy(new WindowsPlayerStrategy());\n} else if (RuntimeInformation.IsOSPlatform(OSPlatform.Linux))\n\
    {\n    context.SetStrategy(new LinuxPlayerStrategy());\n} else\n{\n    throw new\
    \ Exception(\"Only Linux and Windows operating systems are supported.\");\n}\n\
    \nConsole.WriteLine(\"Please specify the path to the file:\");\nvar filePath =\
    \ Console.ReadLine() ?? \"\";\nif (!string.IsNullOrEmpty(filePath))\n{\n    await\
    \ context.Play(filePath);\n}\n```\n\nAnd this concludes the overview of Strategy.\
    \ Let's now summarize its benefits.\n\n### Benefits of using Strategy\n\nThe main\
    \ benefits of using Strategy are as follows:\n\n- It reduces complex logic as\
    \ each type of behavior is handled by its own strategy.\n- You can easily swap\
    \ algorithms during runtime.\n- Because the Context retains its Strategy, you\
    \ don't have to execute conditional logic.\n- Both single responsibility principle\
    \ and open-closed principle are well maintained.\n\nBut, as good as the Strategy\
    \ pattern is, it might still be inappropriate in some situations.\n\n### Caveats\
    \ of using Strategy\n\nAs with the State pattern, using Strategy might overcomplicate\
    \ things where the conditional logic isn't too complicated to begin with. In these\
    \ situations, it might be more appropriate to just apply the conditional logic\
    \ directly.\n\nLikewise, all modern programming languages, including C#, have\
    \ components that allow you to provide method templates (delegates, anonymous\
    \ actions, etc.) without having to have interfaces and implementations.\n\nOtherwise,\
    \ Strategy is still a useful design pattern and there are many scenarios where\
    \ it will prove helpful.\n\n## 44. Template Method\n\nTemplate Method design pattern\
    \ is all about using a combination of concrete and abstract logic inside an abstract\
    \ class to create multiple concrete instances of it. Template Method would be\
    \ defined inside an abstract class, so it cannot be used directly. It will have\
    \ to be overridden by a concrete implementation of such a class.\n"
  mdcn: "\n\n## 43. 策略模式 (Strategy)\n\n策略模式允许你在需要应用条件逻辑的情况下编写可维护的代码。你不需要在代码的特定条件条件下放置特定的逻辑片段，而是将这些逻辑片段分别移动到各自的类中。所有这些类都实现完全相同的接口。因此，在\
    \ `if` 或 `switch` 语句中，你只需要做的就是根据特定条件选择该接口的特定实现即可。然后，你只需要执行动作方法来触发该逻辑即可。\n\n下面，我们将探讨这种方法的一些明显优势。但现在，让我们先总结一下策略模式：\n\
    \n- 有一个策略接口（Strategy interface），定义了动作方法，该方法可能也可能返回某些数据。\n- 有多个具体的策略（Concrete Strategy）实现。\n\
    - 有一个上下文对象（Context object），它封装了策略接口。\n- 上下文对象允许调用代码将其内部的策略字段设置为具体的策略实现。\n- 上下文对象允许调用代码在当前策略实现上执行动作方法。\n\
    - 根据某些条件逻辑在上下文对象上设置具体的策略实现。\n\n我们现在将通过一个策略模式的示例实现。完整的解决方案可以通过下面的链接找到：\n\nhttps://github.com/fiodarsazanavets/design-patterns-in-csharp/tree/main/Behavioral_Patterns/Strategy\n\
    \n### 环境准备\n\n为了能够实现下面的代码示例，你需要在机器上安装以下内容：\n\n- .NET 6 SDK（或更高版本）\n- 合适的 IDE 或代码编辑器（Visual\
    \ Studio, Visual Studio Code, JetBrains Rider）\n\n### 策略模式实现示例\n\n我们将构建一个能够在 Linux\
    \ 和 Windows 操作系统上播放音频的应用程序。它将与我们在查看工厂方法设计模式时构建的应用程序类似。这一次，我们不是根据条件返回适当的播放器，而是根据条件触发一次性播放。\n\
    \n这展示了策略模式和工厂方法设计模式之间的根本区别，因为人们混淆两者并不罕见。工厂方法的意图是返回一个可以随后复用的长周期对象。而策略的意图是在此处执行一次性动作。\n\
    \n我们将从创建一个控制台项目开始。然后，我们将添加以下接口，它代表我们的策略。\n\n```csharp\nnamespace Strategy_Demo;\n\
    \ninternal interface IPlayerStrategy\n{\n    Task Play(string fileName);\n}\n\
    ```\n\n然后，我们将添加该接口的一个具体实现，它能够在 Linux 机器上播放音频：\n\n```csharp\nusing System.Diagnostics;\n\
    namespace Strategy_Demo;\n\npublic class LinuxPlayerStrategy : IPlayerStrategy\n\
    {\n    public Task Play(string fileName)\n    {\n        StartBashProcess(\"mpg123\
    \ -q '{fileName}'\");\n        return Task.CompletedTask;\n    }\n\n    private\
    \ void StartBashProcess(string command)\n    {\n        var escapedArgs = command.Replace(\"\
    \\\\\", \"\\\\\\\\\");\n        var process = new Process()\n        {\n     \
    \       StartInfo = new ProcessStartInfo()\n            {\n                FileName\
    \ = \"/bin/bash\",\n                Arguments = \"-c {escapedArgs}\",\n      \
    \          RedirectStandardOutput = true,\n                RedirectStandardInput\
    \ = true,\n                UseShellExecute = false,\n                CreateNoWindow\
    \ = true\n            }\n        };\n        process.Start();\n    }\n}\n```\n\
    \n然后，我们将添加以下实现，它允许我们在 Windows 上播放音频：\n\n```csharp\nusing System.Runtime.InteropServices;\n\
    using System.Text;\n\nnamespace Strategy_Demo\n{\n    internal class WindowsPlayerStrategy\
    \ : IPlayerStrategy\n    {\n        [DllImport(\"winmm.dll\")]\n        private\
    \ static extern int mciSendString(string command, StringBuilder stringReturn,\
    \ int returnLength, IntPtr hWndCallback);\n\n        public Task Play(string fileName)\n\
    \        {\n            var sb = new StringBuilder();\n            var result\
    \ = mciSendString(\"Play {fileName}\", sb, 1024 * 1024, IntPtr.Zero);\n      \
    \      Console.WriteLine(result);\n            return Task.CompletedTask;\n  \
    \      }\n    }\n}\n```\n\n现在，我们将添加我们的上下文对象，如下如下：\n\n```csharp\nnamespace Strategy_Demo;\n\
    \ninternal class PlayerContext\n{\n    private IPlayerStrategy strategy;\n   \
    \ public void SetStrategy(IPlayerStrategy strategy)\n    {\n        this.strategy\
    \ = strategy;\n    }\n    public Task Play(string fileName)\n    {\n        return\
    \ strategy.Play(fileName);\n    }\n}\n```\n\n现在，我们将用以下内容替换 Program.cs 类的内容：\n\n\
    ```csharp\nusing System.Runtime.InteropServices;\nusing Strategy_Demo;\n\nvar\
    \ context = new PlayerContext();\nif (RuntimeInformation.IsOSPlatform(OSPlatform.Windows))\n\
    {\n    context.SetStrategy(new WindowsPlayerStrategy());\n} else if (RuntimeInformation.IsOSPlatform(OSPlatform.Linux))\n\
    {\n    context.SetStrategy(new LinuxPlayerStrategy());\n} else\n{\n    throw new\
    \ Exception(\"Only Linux and Windows operating systems are supported.\");\n}\n\
    \nConsole.WriteLine(\"Please specify the path to the file:\");\nvar filePath =\
    \ Console.ReadLine() ?? \"\";\nif (!string.IsNullOrEmpty(filePath))\n{\n    await\
    \ context.Play(filePath);\n}\n```\n\n策略模式的概述到此结束。现在让我们总结一下它的优势。\n\n### 使用策略模式的优势\n\
    \n使用策略模式的主要优势如下：\n\n- 它减少了复杂逻辑，因为每种类型的行为都由其自己的策略处理。\n- 你可以在运行时轻松切换算法。\n- 因为上下文保留了策略，所以你不需要执行条件逻辑。\n\
    - 良好地维护了单一职责原则和开放原则。\n\n但是，尽管策略模式非常优秀，在某些情况下它仍然是不适当的。\n\n### 使用策略模式的注意事项\n\n与状态模式一样，在条件逻辑本身并不复杂的情况下，使用策略模式可能会使问题复杂化。在这种情况下，直接应用条件逻辑可能更合适。\n\
    \n同样，所有现代编程语言（包括 C#）都拥有允许你提供方法模板（委托、匿名操作等）的组件，而无需接口和实现。\n\n此外，策略仍然是一个实用的设计模式，在许多场景下它都证明是很有用的。\n\
    \n## 44. 模板方法 (Template Method)\n\n模板方法设计模式的核心是在抽象类中使用具体和抽象逻辑的组合来创建该类的多个具体实例。模板方法定义在抽象类中，因此不能直接使用。它必须由此类类的具体实现类进行重写。\n\
    \n"
