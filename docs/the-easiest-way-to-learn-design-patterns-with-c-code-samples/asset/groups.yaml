    \     if (paragraph.Length == 0)\n                {\n                    continue;\n\
    \                }\n                sb.Append($\"<p>{paragraph}</p>\");\n    \
    \        }\n\n            sb.AppendLine(\"<br/>\");\n            return sb.ToString();\n\
    \        }\n    }\n}\n```\n\n我们有一个派自它的类，称为 `MdTextProcessor`。它通过覆盖处理步骤Text `ConvertText`\
