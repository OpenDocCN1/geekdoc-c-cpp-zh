    16. Multiple object instances of different types need to be able to communicate
    with each other 118


    An analogy would be an air traffic control. Airplanes that take off and land at
    an airport do not communicate directly with each other. But air traffic control
    sees them all and issues appropriate instructions to each of them based on what
    other airplanes are doing.


    In the example with the user interface, the background layout may act as a mediator.
    Once any of the controls on it emits a specific type of event, the layout class
    will decide whether this event is something that any other element needs to be
    aware of and it will notify that element accordingly.


    So, none of the elements care about what happens after the event has been emitted.
    Deciding what to do with the event is a sole responsibility of a single Mediator
    class. And if any other elements are affected, the Mediator will issue instructions
    to them accordingly.


    ## Why would you use Mediator


    - The sole responsibility of facilitating communication between different objects
    is taken up by a single class.

    - Individual components are much easier to re-use.

    - Open-closed principle is easy to enforce.


    ## Observer


    Observer design pattern utilizes the concept of publishing and subscribing. Basically,
    any elements that emit a specific event are publishers and any elements that need
    to react to the event are subscribers.


    So, if you want a specific object to be affected by specific event types or events
    with specific data values, you can subscribe that object to those events. If you
    no longer need to get that object to react to those events, you can unsubscribe.


    And an object doesn''t have to be restricted to either a publisher or a subscriber.
    It can be both. Likewise, an object can be a publisher and/or a subscriber for
    more than one event type.


    ## Why would you use Observer


    - You can easily establish relationships between objects at runtime.

    - Easy to enforce open-closed principle.

    - You can implement it across application boundaries.


    ## 17. Multiple stages of processing are needed


    Imagine that you need to implement a logic that requires stages of processing,
    possibly involving conditional logic.


    One example of this would be a validation of HTTP request. First, you may want
    to see whether the incoming request matches any allowed paths in your application.
    Then, you may want to check whether the user is authenticated. After that, you
    may want to check whether the user is allowed to access the particular resource
    that the request was made for. And so on.


    In this situation, you may want to short-circuit this flow as soon as you encounter
    a condition that wouldn''t allow the request to proceed any further. For example,
    if the request was made to a path that doesn''t exist, there is no point in checking
    the user''s credentials. Returning 404 page would be sufficient.


    ## Suitable design patterns


    ### Chain of Responsibility


    This design pattern was specifically developed to deal with this problem.


    Basically, your logic is arranged into a chain of individual components. Each
    component has a condition that decides whether to move on to the next component
    or short-circuit the logic then and there.


    A good example of this would be an ASP.NET Core middleware pipeline which was
    designed specifically for the request validation that was described in the example
    above.


    ### Why would you use Chain of Responsibility


    - You can control the order of multi-stage processing.

    - You can stop the process at any time if moving doesn''t make sense any longer.

    - Each component in the chain is responsible for a specific stage of processing,
    so the single responsibility principle is easy to enforce.

    - Suitable for scenarios where a one-off logical flow needs to be executed.


    ### Builder


    Builder design pattern was already mentioned in chapter 6. Although it''s not
    designed for the specific request validation example outlined in the problem description,
    builder is suitable for other types of situations where you need to execute multiple
    processing stages.


    The whole purpose behind Builder is to allow you to build some sort of object
    step-by-step. So, if you put a Builder implementation via a multi-stage conditional
    logic, you would end up with a different product for each unique combination of
    conditions.


    Unlike Chain of Responsibility, however, Builder doesn''t have to work with specific
    steps done in a specific order. For example, if we are to use StringBuilder from
    C# to build a string, we can apply any arbitrary logic to do it. We can perform
    as many manipulations with it as we want.


    ## Why would you use Builder instead of Chain of Responsibility


    - Easier to implement when the order of the processing steps doesn''t need to
    be exact.

    - Suitable for scenarios where a reusable object needs to be built.


    ## 18. The system is controlled by complex combinations of inputs


    Some internal components of your system need to accept requests with instructions
    to do some actions.


    Over time, the structure of the requests is becoming more and more complicated.
    For example, there may be different objects in your system that end executing
    a very similar action, while having a completely different sets of inputs.


    This may start causing issues in your code by making it less readable. For example,
    if different object types end executing the same action, you may put this action
