    to make it work with an Adapter object. Also, translation functionality itself
    may have to be very complex. Yes, the above example is fairly trivial. But in
    a real-life situation, you may have to do some truly complex data transformation
    inside an Adapter object.'
  - '[PAGE 203]


    This is why, if you can, it''s better to just change the incompatible service
    and make it compatible instead of using Adapter design pattern. Use Adapter only
    if the service that you need to access is either a third-party service that cannot
    be changed, or if too many other components depend on the existing API, which
    makes it too expensive to change.'
  - '[PAGE 204]


    # #30. Bridge


    Bridge design pattern allows you to separate the business logic from a software
    component that controls or triggers this business logic. For example, you may
    have a user interface that has multiple buttons. Each of these buttons triggers
    some logic in the back-end. Bridge design pattern allows you to separate the user
    face with the buttons from the component that contains the actual business logic.


    The main benefit of the Bridge design pattern would be that it allows two separate
    teams to work independently on two application components. One team would be responsible
    for the user interface and the other team would be responsible for the implementation
    of the business logic in the back-end. The teams can work independently as long
    as they have specified a shared interface definition.


    Bridge can be summarized as follows:


    +   - There are two objects: **Interface** and **Implementation**. There are not
    to be confused with interfaces and classes. In this context, the object playing
    the role of **Interface** is actually a concrete class.

    - **Implementation** object contains the main business logic, while **Interface**
    object is design to interact with all endpoints of **Implementation** object.

    - **Implementation** object depends on an interface (in the normal sense of object-oriented
    programming), so it can be easily mocked when **Interface** object needs to be
    tested.


    We will now go through an example implementation of Bridge. The complete solution
    can be found via the link below:


    https://github.com/fiodarsazananavets/design-patterns-in-sharp/tree/main/Structural_Patterns/Bridge'
