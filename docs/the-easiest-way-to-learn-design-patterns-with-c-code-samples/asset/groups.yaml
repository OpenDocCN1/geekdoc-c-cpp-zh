    \n# 第二部分：设计模式旨在解决的问题\n\n本书的这一部分列出了软件开发人员面临的常见软件问题类型。对于这些每个问题都列出了适当的设计模式。\n\n在本书的这一部分，我们没有详细介绍每个设计模式。我们对它的结构、功能以及为什么能解决特定类型的问题进行了简要描述。然后，在该部分的最后，我们总结了所涵盖的所有问题，并对于每个问题，总结了可以解决它的每个设计模式的优缺点。\n\
