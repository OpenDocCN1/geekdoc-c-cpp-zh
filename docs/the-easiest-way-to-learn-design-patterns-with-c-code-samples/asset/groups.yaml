    2. Open-closed principle


    25


    having to alter your existing code is often seen as an unnecessary overhead that
    doesn''t provide any benefits.


    And the way the software is written has moved on by quite a bit since 1988. If
    back then the process of deploying a new software version was tedious, long and
    expensive, many systems of today take minutes to deploy. And the whole process
    can be done on demand with a click of a mouse.


    And with agile software development practices being adopted everywhere in the
    industry, requirements change all the time. Quite often, the changes are radical.
    Whole sections of code get removed and replaced on regular bases. So, why design
    for an adherence to open-close principle if the component that you are writing
    is quite likely to be ditched very soon?


    Although these objections are valid, the open-closed principle still provides
    its benefits. Here is an example.


