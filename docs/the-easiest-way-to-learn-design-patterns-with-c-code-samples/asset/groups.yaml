    \n<p>This is <strong>first</strong></p><p>This is <em>second</em></p><p>This is\
    \ <del>third</del></p>\n\n|Figure 45.1 - The outcome of using Visitors\n\nThe\
    \ overview of Visitor pattern is now complete. Let's summarize the value it gives.\n\
    \n## Benefits of Visitor\n\n- New functionality can be added to existing objects\
    \ without modifying their logic.\n- Open-closed principle is well maintained,\
    \ as the existing objects remain close to modification.\n\nAnd now let's get familiar\
    \ with the things that you need to watch out for using Visitor.\n\n## Caveats\
    \ of Visitor\n\nSo, the main caveat of using Visitor is that Visitor object doesn't\
    \ have access to private and protected members of Component. And this makes it\
    \ unsuitable for certain scenarios where some new functionality needs to be added\
    \ to an existing object.\n\nAnother caveat of using Visitor is that there are\
    \ times where the Component object would be modified. As a developer, you need\
    \ to watch out for, so you can either update your corresponding Visitor or retire\
    \ it.\n\nFinally, because Visitor object may contain many methods, each corresponding\
    \ to a specific Component implementation, you need to watch out for having too\
    \ many such methods. Otherwise, you may end up with a God object.\n\n## Epilogue\n\
    \nIn this book, you have learned most of the key design patterns. I call them\
    \ foundational, because these are the classic design patterns that inspired all\
    \ the other design patterns that you may encounter.\n\nAnd there was a great value\
    \ in learning these design patterns. Maybe some of them are almost obsolete. For\
    \ example, real-life situations where using the classic version of the Singleton\
    \ design pattern are extremely rare. But the principles behind each of these design\
    \ patterns still live on.\n\nYou may no longer be able to find an appropriate\
    \ scenario to use the Bridge design pattern in its classic form. But still, this\
    \ pattern made other modern design patterns possible. For example, both Model-View-Controller\
    \ and Model-View-ViewModel design patterns are based on Bridge. Likewise, Bridge\
    \ has inspired the modern architecture of distributed applications, where the\
    \ UI and the back-end API are represented by different applications.\n\nAnd that's\
    \ a good example of why I call these design patterns \"foundational\". Knowing\
    \ them makes it easy to learn any other design patterns. And it makes it easy\
    \ to understand many of the modern-day architectural practices.\n\nSo, don't be\
    \ put off by the fact that you haven't seen Model-View-Presenter or Repository\
    \ in this book. There are many design patterns out there and it's just impossible\
    \ to cover all in a single book. But now, since you know the most fundamental\
    \ ones of them all, you will have absolutely no problem learning other design\
    \ patterns that have been invented more recently.\n\nThere is only one classic\
    \ design pattern that we have't included in this book. And it's called Iterator.\
    \ But there was a good reason\n"
