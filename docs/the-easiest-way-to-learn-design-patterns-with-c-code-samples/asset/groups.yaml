    \ 对象有一个需要调用的方法来生成 **Target Object**。\n- 可能存在一个 **Director** 对象，它使用 **Builder**\
    \ 的特定实现并负责操作 **Builder**。但 **Director** 对象并不是严格要求的。\n\n也许一个值得的构建器模式实现示例是 System.Text\
