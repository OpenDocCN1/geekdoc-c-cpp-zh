    # About the author and his mission


    ![](img/ddd2bfe3763461951a0219d12d42e08d_18_0.png)


    My name is Fiodar Sazanavets. I am a senior full-stack software engineer with
    over a decade of experience. I know how hard it is to become a competent software
    developer. I''ve been through this process myself. And I''m passionate about helping
    other people, so the journey would be easier for them than it was for me.


    Design patterns was the subject that I found quite difficult to comprehend when
    I was a mid-level developer. At that point in time, I had heard about the design
    patterns. I kind of knew that they would make code cleaner and more maintainable.
    But there was one problem. I found them to be hard to learn.


    No, there wasn''t a lack of documentation. On the contrary, there are plenty of
    books and blog posts that describe what design patterns are and provide code samples
    of their implementations. But the problem with all of this material is that the
    way design patterns are usually taught makes them really hard to understand,'
  - '[PAGE 19]


    # About the author and his mission


    especially for those developers that have never used them before. If you are a
    novice and you examine any of the design patterns outside the context that it''s
    used under, it will probably look like the code was over-complicated without any
    obvious reason. And that''s precisely what made it so hard for me to learn the
    patterns. After all, I have been coding happily without using any of them. So
    I have abandoned my attempts to learn.


    But it all changed one day when I had a technical interview at one of the major
    IT companies in London. The company was great and the position that I was interviewing
    for was paying above the market rate. But I ended up not getting this job. And
    my lack of knowledge of the design patterns was to blame.


    During the technical interview, I was presented with a problem that one of the
    design patterns could have solved in. In fact, this problem was specifically designed
    to assess whether or not a candidate knows design patterns. Because I didn''t
    know them, it was taking me a long time to come up with the solution. And I didn''t
    manage to fully implement the solution within the allocated time. So, essentially,
    I failed for two reasons:


    +   1. I didn''t solve the problem quickly enough

    2. I didn''t know design patterns


    Later, I found out that this wasn''t just an isolated case. There are plenty of
    good IT companies that won''t hire you if you don''t know design patterns. So
    I got back to trying to learn them.


    They were still hard to learn. I had to brute-force my way through them. But I
    managed to learn them all. Then I started to use them in my job. And when I realized
    how underappreciated they are.


    Design patterns aren''t needed to get your foot into the door of a good IT company.
    A lot of problems that you encounter as a software developer can be solved relatively
    quickly if you know'
