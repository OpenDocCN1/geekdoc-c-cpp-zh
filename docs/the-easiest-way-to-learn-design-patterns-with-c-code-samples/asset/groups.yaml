    \ providing some C# examples.\n\n## The importance of single responsibility principle\n\
    \nFor those who are not familiar with C#, this course will give you a basic introduction.\
    \ Those who are familiar with the language will recognize that every C# application\
    \ has a class that serves as an entry point, which is usually called Program.\n\
