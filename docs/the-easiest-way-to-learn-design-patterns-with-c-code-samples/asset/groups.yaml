    Please enter screen PIN\");\n    }\n}\n```\n\n之后，我们将再添加另一个 State 实现。在这种情况下，按下\
    \ Home 键会打开屏幕。\n\n```csharp\nnamespace State_Demo;\ninternal class UnlockedScreenState\
