    # 5. Dependency inversion principle


    Finally, we''ve reached the last of the SOLID principles - dependency inversion
    principle.


    The full solution demonstrated in this chapter is available via the following
    link:


    https://github.com/fiodarsazanavets/Dotnet-CSharp-SOLID-demo/master/5-dependency-inversion-principle


    # What is dependency inversion principle


    Dependency inversion principle states that a higher-level object should never
    depend on a concrete implementation of a lower-level object. Both should depend
    on abstractions. But what does it actually mean, you may ask?


    Any object oriented language will have a way of specifying a contract to which
    any class or module should adhere. Usually, this is known as an interface.


    Interface is something that defines the signature of all the public members that
    the class must have, unlike a class, an interface doesnt have any logic inside
    those members. It doesn''t even allow you to define a method body to put the logic
    in.


    But as well as being a contract that defines the accessible surface area of a
    class, an interface can be used as a data type in variables'
