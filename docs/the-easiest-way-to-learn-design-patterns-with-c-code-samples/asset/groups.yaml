    # # 29. Adapter


    Adapter design pattern is used when need to access some endpoint that is not compatible
    with the rest of your application, but you have no means of changing the endpoint.
    It has many real-life analogies.


    Different regions of the world have different electric sockets. For example, a
    socket somewhere in continental Europe works with a plug that has two pins, while
    a British socket works with a triple-plug. So, if you bought some electric appliance
    in Britain and then traveled to continental Europe with it, you won''t be able
    to plug it directly into a socket. You will need to get a socket adapter. This
    adapter will have two pins, which will allow it to be connected to a European
    socket, but it will also have a socket of its own, which will accept a British
    plug.


    Adapter can be summarized as follows:


    +   - There is a service that is routinely accessed by an application (we will
    call it Service Implementation).

    - This service implements some interface (which we will call Service Interface).

    - There is an endpoint that needs to be accessed by the same part of the application
    that isn''t compatible with the Service Interface.

    - To solve this problem, there is an Adapter class, which implements the Service
    Interface, but has some internal translation functionality to be able to access
    this incompatible endpoint.


    For example, your application might be dealing with JSON data, but there''s still
    an endpoint that deals with XML. And this endpoint'
  - '[PAGE 196]


    cannot be changed, as many other services depend on it. So, if you want to be
    able to use this endpoint in the JSON-based part of your application, you need
    an Adapter that will translate between XML and JSON.


    We will now go through an example implementation of Adapter. The complete solution
    can be found via the link below:


    https://github.com/fiodarsazananavets/design-patterns-in-csharp/tree/main/Structural_Patterns/Adapter


    # Prerequisites


    In order to be able to implement the code samples below, you need the following
    installed on your machine:


    +   - .NET 6 SDK (or newer)

    - A suitable IDE or a code editor (Visual Studio, Visual Studio Code, JetBrains
    Rider)


