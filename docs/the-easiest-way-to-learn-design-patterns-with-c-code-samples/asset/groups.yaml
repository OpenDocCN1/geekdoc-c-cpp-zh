    internal class Gun : IGun {\n    private int ammo = 0;\n\n    public void Reload()\
    \ {\n        ammo = 6;\n    }\n\n    public bool Shoot() {\n        if (ammo >\
    \ 0) {\n            Console.WriteLine(\"Shot fired.\");\n            ammo--;\n\
    \            return true;\n        }\n\n        Console.WriteLine(\"Out of ammo.\"\
    );\n        return false;\n    }\n}\n```\n\nSo, we have an integer that represents\
    \ how much ammo we have left. Every time we reload, the integer gets reset to\
    \ 6. Every time we shoot, the ammo decremented by one. And if there was any ammo\
    \ at the beginning of the shot, true is returned. Otherwise, if the ammo counter\
    \ was zero, false is returned. In either situation, the outcome is printed in\
    \ the console.\n\nNow we will start adding some Decorator objects. To demonstrate\
    \ how multiple decorators can be applied, we will create two of them. And to help\
    \ us with this, we will create an abstract class that both of them will implement.\
