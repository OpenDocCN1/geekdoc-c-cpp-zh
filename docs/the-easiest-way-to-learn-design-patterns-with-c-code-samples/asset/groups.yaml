    19. Ability to undo an action that has been applied


    needed, the state of the originator can be restored from the history inside the
    memento.


    # Why would you use Memento


    - Allows to store a full history of changes, so any of the snapshots can be restored
    easily.

    - Object oriented encapsulation is used well.


    # Command


    Command design pattern that we had a look at in chapter 18 is also suitable for
    undoing and re-doing actions. To use it in such a way, you would just need to
    create a history of Command objects and, for each one of them, add the ability
    to roll it back.


    Unlike Memento, Command doesn''t manage internal states of the objects. So, it
    won''t be suitable when private fields need to get their values changed while
    undoing an action. However, commands can be changed in such a way that you save
    the instructions, but don''t save previous states. This way, you don''t restore
    previous actions. You merely revert previous actions by executing the opposite
    actions. This allows you to use the memory more efficiently.


    # Why would you use Command instead of Memento


    - More efficient use of memory, as you don''t have to store each individual snapshot.

    - The actual steps are easier to trace.


    ## 20. Ability to traverse a collection without knowing its underlying structure


    You have a fairly complex data structure due to various constraints that you have
    to overcome. Perhaps, you need to arrange the data into a binary tree to enable
    an efficient search algorithm. Or perhaps it''s a linked list, as each item in
    the collection needs to know about the next item.


    In any case, the client class that will be using your library would not care about
    what algorithm you used and how your data is structured. All it cares about is
    that it can work with the data in your collection.


    # Suitable design patterns


    ## Iterator


    Iterator is a design pattern that hides implementation details of a collection-manipulating
    algorithm and only exposes some basic methods that enable any external object
    to work with the collection, such as MoveNext and HasMore.


    So, as far as your client is concerned, the collection you are dealing with consists
    of sequential flat data, just like an array would. However, internally, the data
    structure can be anything but.


    20. Ability to traverse a collection without knowing its underlying structure


    These days, you will rarely have to implement Iterator yourself, as core system
    libraries in all major programming languages already have a whole range of collection
    types that implement iterators. But there are still some scenarios where you need
    to write a special type of collection yourself. And this is where Iterator would
    be very useful.


    # Why would you use Iterator


    - Abstracts away complex implementation details of collection management.

    - Simplifies the view of the collection to the client.


    ## 21. Creating a family of related algorithms


    Imagine that you need to create a family of related algorithms. Each of them will
    have the same parameter types, the same output object type, but would be composed
    of completely different internal logic. You can just create many similar methods,
    but design patterns allow you to achieve your goal in a better way.


    ## Suitable design patterns


    ### Template Method


    Template Method is, perhaps, the simplest way of achieving the goal of defining
    a family of related algorithms. In a nutshell, Template Method is just a fairly
    standard usage of a standard object oriented feature of inheritance. You define
    either a skeleton method without implementation or a method with a default algorithm
    implementation in your base class. And then, you inherit it from this class and
    modify the algorithm steps as needed.


    There is a caveat though. This design pattern is only suitable for very similar
    algorithms. Otherwise, if you alter an algorithm behavior significantly, you may
    be violating Liskov substitution principle.


    ## Why would use Template Method


    - The easiest way of creating several related algorithms.


    21. Creating a family of related algorithms


    - You can get the clients to only override specific parts of the default algorithm.

    - You can store a bulk of your code in the base class.


    # Visitor


    Visitor is a design pattern that allows you to separate algorithms from the objects
    they operate on. So, you can add new behavior to an object without having to change
    the object itself.


    Visitor is a class that operates on an object but is separate from it. Therefore
    because your Visitor is separate from your object, you can define a number of
    different Visitors if you want to apply different algorithms to your object.


    In order for a Visitor to work, a visitor class needs to be “visit” the object.
    And then it can just call and modify the values of any accessible members of the
    objects. The only components that the Visitor will not have access to are private
    variables and methods.


    # Why would you want to use Visitor


    - Separating algorithms from the objects they operate on, which enforces the single
    responsibility principle.

    - Can add any new behavior to an object without having to change the object.

    - Can have different sets of behaviors that can be applied to objects.

    - Visitor class can accumulate a lot of useful information about an object by
    visiting it.


    # State


    State is a design pattern that makes an object change its behavior when its internal
    state changes.


    For example, think of your mobile phone. If your phone is in a locked state, a
    particular button would unlock it. However, when the phone is in an unlocked state,
    the behavior of the same button would be different. Perhaps, it would take you
    to the homepage.

    This design pattern can also include state transition logic, which would be able
    to undo and redo actions. This is how State can be used in conjunction with Memento.


    # Why would use State


    - Separating behaviors from the object, which would enforce the single responsibility
    principle.

    - Allows you to implement a state transition logic.

    - Allows you to introduce new behaviors to an object without violating the open-closed
    principle.


    # Strategy


    Strategy, as described in chapter 6 was intended to be used inside a specific
    set of logic, so, by definition, it is also a way of defining a series of related
    algorithms.


    After all, all strategy objects within the same set will implement exactly the
    same interface, making this design pattern a suitable solution for this problem.


    ## 22. Summary of the problems design patterns are intended to solve


    This chapter summarizes which design patterns can be used to solve any specific
    type of a software development problem. It’s intended to be a reference guide
    to help you find the right design pattern quickly.


    All problem categories that we have discussed in this section are listed here.
    For each one of them, all suitable design patterns are provided. If there are
    multiple design patterns that can solve a problem of a particular type, a one-sentence
    summary will be provided next to each to help you decide which of them is more
    suitable to your specific situation.


    # Not knowing what object implementations you''ll need ahead of time


    - Factory Method: if an object needs to be instantiated in one go

    - Abstract Factory: if multiple object needs to be instantiated in one go

    - Builder: if an object needs to be built step-by-step


    # - Decorator


    # Accessing complex back-end logic from the presentation layer


    - Facade: simplifies the access interface to the complex logic

    - Proxy: caches the result of expensive operations


    # User interface and business logic developed separately


    - Bridge: suitable when front-end and back-end can be designed together up-front

    - Facade: suitable when back-end services is hosted by a third party or cannot
    be designed alongside the user interface up-front

    - Proxy: prevents services outage during back-end redeployment


    # Building a complex object hierarchy


    - Composite


    # Implementing complex conditional logic


    - Strategy: facilitates a conditional one-off action

    - Factory Method: facilitates a conditional creation of a long-lived object

    - Abstract Factory: facilitates a conditional creation of multiple long-lived
    objects

