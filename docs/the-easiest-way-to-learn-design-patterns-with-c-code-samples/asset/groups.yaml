    \ objects\n- State - allows you to change the behavior of an entire object in\
    \ one go by changing the mode (state) that the object is in\n- Strategy - suitable\
    \ when algorithms are selected by conditional logic\n\n## Part 3: Design patterns\
    \ demonstrated in C#\n\nThe third and final part of the book will teach you each\
