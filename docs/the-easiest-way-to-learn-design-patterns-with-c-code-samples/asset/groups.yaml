- md: "\nsibility principle.\n\n-   This allows us to easily maintain the code and\
    \ write automated tests for it. As each method in a Builder object plays a very\
    \ specific role, it's easy to come up with test cases for it.\n-   If Director\
    \ object is applied, Builder design pattern allows you to build different representations\
    \ of the same object.\n\nHowever, Builder design pattern comes with an important\
    \ caveat that developers need to be aware of.\n\n## Caveats of using Builder\n\
    \nBoth our Abstract Factory and Builder examples produced a solution that is identical\
    \ in functionality from the user's perspective. However, if you have a look at\
    \ the code, you will notice how much more complex Builder implementation is. And\
    \ this is the main disadvantage of using Builder. It increases the complexity\
    \ of your code.\n\nThis is why, unless you need to build an object step-by-step,\
    \ Abstract Factory would be a better choice than Builder. If you can create an\
    \ entire object in one go, you aren't really getting any advantage from using\
    \ Builder. But you are paying an additional price by making your code more complex.\n\
    \n## 27. Prototype\n\nPrototype is a design pattern that allows you to easily\
    \ clone existing objects. Instead of copying all the data from one object to another\
    \ field-by-field, you just have a method to clone the object inside the object\
    \ itself.\n\nThis has two core advantages. Firstly, all of your code of copying\
    \ an object resides in a single place in your code base, which enforces **don't\
    \ repeat yourself** (DRY) principle. Secondly, it allows you to copy private fields\
    \ into the new object, which you wouldn't have been able to do at all if you just\
    \ did a field-by-field copying.\n\nPrototype can be summarized as follows:\n\n\
    -   * A class has a method that returns an exact copy of the instance of the class.\n\
    -   This method may be called `Clone` or `Copy`.\n-   This method performs field-by-field\
    \ copy of the class, including its private fields.\n-   But even though the object\
    \ that this method returns the same values in all of its fields as the original\
    \ object, it's a completely different object reference, so modifying it will not\
    \ change the original object.\n\nWe will now go through an example implementation\
    \ of Prototype. The complete solution can be found via the link below:\n\nhttps://github.com/fiodarsazanavets/design-patterns-in-sharp/tree/main/Creational_Patterns/Prototype\n\
    \n# Prerequisites\n\nIn order to be able to implement the code samples below,\
    \ you need the following installed on your machine:\n\n-   .NET 6 SDK (or newer)\n\
    -   A suitable IDE or a code editor (Visual Studio, Visual Studio Code, JetBrains\
    \ Rider)\n\n# Prototype implementation example\n\nTo demonstrate Prototype design\
    \ pattern, we will create a .NET console application project.\n\nWhen using Prototype,\
    \ it would be a good practice to create an interface that you would want any cloneable\
    \ class to implement. This will make all cloneable types behave consistently.\
    \ So, we will add ICloneable.cs file with the following interface definition:\n\
    \n```csharp\nnamespace Prototype_Demo;\ninternal interface ICloneable\n{\n   \
    \ ICloneable Clone();\n}\n```\n\nThen, we will create the actual cloneable object.\
    \ It will be added as CloneableObject.cs file and its code will be as follows:\n\
    \n```csharp\nnamespace Prototype_Demo;\n\ninternal class CloneableObject : ICloneable\n\
    {\n    private readonly int internalData;\n    private readonly string internalTitle;\n\
    \n    public CloneableObject(string title) {\n        var random = new Random();\n\
    \        internalData = random.Next();\n\n        internalTitle = title;\n   \
    \ }\n\n    public int Data => internalData;\n    public string Title => internalTitle;\n\
    \n    public ICloneable Clone() {\n        return (CloneableObject)MemberwiseClone();\n\
    \    }\n}\n```\n\nSo, in our class, we have two public readonly properties: Data\
    \ and Title. None of them can be changed once the object has been created. But\
    \ we have the Clone method that returns a copy of our object by calling the MemberwiseClone\
    \ method of the base object data type. This method will perform field-by-field\
    \ copying of our object. And this will include the private fields.\n\nLet’s now\
    \ see if our Clone method behaves as we have intended. To do so, we will replace\
    \ the content of Program.cs file with the following:\n\n## 27. Prototype\n\n```csharp\n\
    using Prototype_Demo;\nvar object1 = new CloneableObject(\"Title 1\");\nConsole.WriteLine($\"\
    Object 1 title: {object1.Title}\");\nConsole.WriteLine($\"Object 1 data: {object1.Data}\"\
    );\nvar object2 = (CloneableObject)object1.Clone();\nConsole.WriteLine($\"Object\
    \ 2 title: {object2.Title}\");\nConsole.WriteLine($\"Object 2 data: {object2.Data}\"\
    );\nConsole.ReadKey();\n```\n\nIn here, we create an object and give it a specific\
    \ title. Its Data property will be populated with a random integer when the object\
    \ is created. We output both the Title and Data properties into the console. Then\
    \ we create another instance of this object by cloning our initial object instance.\
    \ And we, once again, output its Title and Data properties into the console to\
    \ verify that they have the same values as in our first object.\n\nAnd, as this\
    \ figure demonstrates, the values of the properties are the same. This proves\
    \ that the cloning process works.\n\n## 27. Prototype\n\n![](img/ddd2bfe3763461951a0219d12d42e08d)\n\
    \nThis concludes our overview of the Prototype pattern. Let's now go through the\
    \ summary of its main benefits.\n\n## Benefits of using Prototype\n\nThe main\
    \ benefits of using Prototype can be summarized as follows:\n\n-   If you need\
    \ to copy an object, the logic of copying will be present in a single place in\
    \ the entire codebase, which enforces DRY principle.\n-   Because cloning of an\
    \ object is performed inside the object itself, private fields can be copied too.\n\
    \nLet's now have a look at caveats that you need to be familiar with while using\
    \ the Prototype pattern (although there aren't many).\n\n## Caveats of using Prototype\n\
    \nOne thing that you need to be aware of while using Prototype is the difference\
    \ between shallow and deep copying. When you perform a shallow copy, which is\
    \ exactly what we had a look at in our example, only the values of the fields\
    \ with basic data types get copied. So, the fields containing string, int, double,\
    \ etc. will be copied, but the fields containing custom data types, such as classes,\
    \ won't.\n\nDeep copy is when you copy everything, including any custom data types\
    \ that your object contains and any data type fields those custom data types contain.\
    \ Therefore, to ensure that you can perform a deep copy, you need to either make\
    \ the other data types cloneable or perform manual field-by-field copying inside\
    \ your method.\n\nOther than that, there are no caveats of using Prototype. It\
    \ is the best way to copy objects.\n\n## 28. Singleton\n\nSingleton design pattern\
    \ allows you to use a single instance of a particular object throughout your application.\
    \ This is achieved with the help of a private constructor and a static method\
    \ that can call this constructor from the outside.\n\nSingleton can be summarized\
    \ as follows:\n\n-   A Singleton class that is meant to be used as a single instance\
    \ that is shared throughout an application has a private constructor, so it can\
    \ only be created inside of the class itself.\n-   The class holds a private static\
    \ field containing its own data type.\n-   To instantiate the class from the outside,\
    \ the class has a static method that returns the same data type as the class itself.\n\
    -   This method will create an instance of the class via the private constructor\
    \ and populate the private static field with this instance. Then this instance\
    \ would be returned to the caller.\n-   Any subsequent calls will just return\
    \ the object instance that was already created.\n"
  mdcn: "\n单一职责。\n\n-   这允许我们轻松地维护代码并为其编写自动化测试。由于 Builder 对象中的每个方法都承担着非常特定的角色，很容易为它们编写测试用例。\n\
    -   如果应用了 Director 对象，Builder 设计模式允许你构建同一对象的不同表示。\n\n然而，Builder 设计模式带有一个开发者需要注意的重要局限性。\n\
    \n## 使用 Builder 的注意事项\n\n我们的抽象工厂和 Builder 示例产生的解决方案从用户的角度来看功能上是完全相同的。然而，如果你查看代码，你会发现\
    \ Builder 的实现要复杂得多。这就是使用 Builder 的主要缺点。它增加了你代码的复杂性。\n\n这就是为什么，除非你需要分步地构建一个对象，否则抽象工厂是比\
    \ Builder 更好的选择。如果你能一次性创建整个对象，你实际上并没有从使用 Builder 中获得任何优势，但你却通过让代码变得更复杂而付出了额外代价。\n\
    \n## 27. 原型模式 (Prototype)\n\n原型模式是一种允许你轻松克隆现有对象的设计模式。你不需要逐字段地从一个对象复制所有数据到另一个对象，只需要在对象内部拥有一个方法来克隆该对象。\n\
    \n这有两个核心优势。首先，你所有复制对象的代码都位于代码库中的同一个位置，这强制了**不要重复自己**（DRY）原则。其次，它允许你将私有字段复制到新对象中，而如果你只是进行逐字段复制，这是完全无法做到的。\n\
    \n原型模式可以总结如下：\n\n-   一个类有一个方法，可以返回该类实例的精确副本。\n-   该方法可能被命名为 `Clone` 或 `Copy`。\n\
    -   该方法对类的字段进行逐字段复制，包括它的私有字段。\n-   尽管该方法返回的对象在所有字段上的值与原始对象相同，但它是一个完全不同的对象引用，因此修改它不会改变原始对象。\n\
    \n我们现在将过的原型模式的示例实现。完整的解决方案可以通过下面的链接找到：\n\nhttps://github.com/fiodarsazanavets/design-patterns-in-sharp/tree/main/Creational_Patterns/Prototype\n\
    \n# 前提条件\n\n为了能够实现下面的代码示例，你需要在机器上安装以下内容：\n\n-   .NET 6 SDK（或更高版本）\n-   一个合适的 IDE\
    \ 或代码编辑器（Visual Studio, Visual Studio Code, JetBrains Rider）\n\n# 原型模式实现示例\n\n\
    为了演示原型设计模式，我们将创建一个 .NET 控制台应用程序项目。\n\n在使用原型模式时，良好的做法是创建一个你希望任何可克隆类都实现的接口。这将使得所有可克隆类型的行为保持一致。因此，我们将添加一个带有以下接口定义的\
    \ `ICloneable.cs` 文件：\n\n```csharp\nnamespace Prototype_Demo;\ninternal interface\
    \ ICloneable\n{\n    ICloneable Clone();\n}\n```\n\n然后，我们将创建实际的可克隆对象。它将作为 `CloneableObject.cs`\
    \ 文件添加，代码如下：\n\n```csharp\nnamespace Prototype_Demo;\n\ninternal class CloneableObject\
    \ : ICloneable\n{\n    private readonly int internalData;\n    private readonly\
    \ string internalTitle;\n\n    public CloneableObject(string title) {\n      \
    \  var random = new Random();\n        internalData = random.Next();\n\n     \
    \   internalTitle = title;\n    }\n\n    public int Data => internalData;\n  \
    \  public string Title => internalTitle;\n\n    public ICloneable Clone() {\n\
    \        return (CloneableObject)MemberwiseClone();\n    }\n}\n```\n\n因此，在我们的类中，有两个公共的只读属性：Data\
    \ 和 Title。一旦对象创建，任何一个都无法更改。但我们有一个 `Clone` 方法，它通过调用基对象数据类型的 `MemberwiseClone` 方法来返回对象的副本。该方法将执行对我们对象的逐字段复制。这其中包括了私有字段。\n\
    \n现在让我们看看我们的 `Clone` 方法的行为是否符合我们的预期。为此，我们将把 `Program.cs` 文件的内容替换为以下内容：\n\n## 27.\
    \ 原型模式\n\n```csharp\nusing Prototype_Demo;\nvar object1 = new CloneableObject(\"\
    Title 1\");\nConsole.WriteLine($\"Object 1 title: {object1.Title}\");\nConsole.WriteLine($\"\
    Object 1 data: {object1.Data}\");\nvar object2 = (CloneableObject)object1.Clone();\n\
    Console.WriteLine($\"Object 2 title: {object2.Title}\");\nConsole.WriteLine($\"\
    Object 2 data: {object2.Data}\");\nConsole.ReadKey();\n```\n\n在这里，我们创建了一个对象并给它一个特定的标题。当对象创建时，其\
    \ `Data` 属性将填充一个随机整数。我们将 Title 和 Data 属性输出到控制台。然后，我们通过克隆初始对象实例来创建该对象的另一个实例。我们再次将其\
    \ Title 和 Data 属性输出到控制台，以验证它们的值与我们的第一个对象的值相同。\n\n而且，正如如图所示，属性的值是相同的。这证明了克隆过程是有效的。\n\
    \n## 27. 原型模式\n\n![](img/ddd2bfe3763461951a0219d12d42e08d)\n\n这结束了我们对原型模式的概述。现在让我们来看看其主要优势的总结。\n\
    \n## 使用原型模式的优势\n\n使用原型模式的主要优势可以总结如下：\n\n-   如果你需要复制对象，复制逻辑将位于整个代码库的同一个位置，强制了 DRY\
    \ 原则。\n-   因为对象的克隆是在对象内部执行的，所以私有字段也可以被复制。\n\n现在让我们来看看在使用原型模式时需要熟悉的局限性（尽管并不多）。\n\
    \n## 使用原型模式的注意事项\n\n在使用原型模式时，你需要注意的一点是浅拷贝和深拷贝的区别。当你执行浅拷贝时（正如我们在示例中查看的那样），只有基本数据类型的字段会被复制。因此，包含\
    \ string、int、double 等字段会被复制，但包含自定义数据类型（如类）的字段则不会。\n\n深拷贝是指复制所有内容，包括你的对象包含的任何自定义类型以及这些自定义类型包含的任何数据类型字段。因此，为了确保能够执行深拷贝，你需要让其他数据类型变为可克隆，或者在你的方法内部执行手动的逐字段复制。\n\
    \n除此之外，使用原型模式没有局限性。它是复制对象的最佳方法。\n\n## 28. 单例模式 (Singleton)\n\n单例模式允许你在整个应用程序中使用特定对象的唯一实例。这是通过私有构造函数和一个可以从外部调用该构造函数的静态方法实现的。\n\
    \n单例模式可以总结如下：\n\n-   旨在作为整个应用程序共享的唯一实例使用的单例类具有私有构造函数，因此它只能在类内部创建。\n-   该类持有一个包含其自身类型的私有静态字段。\n\
    -   为了从外部实例化该类，该类有一个返回与类本身相同数据类型的静态方法。\n-   该方法将通过私有构造函数创建类的实例，并将该实例填充到私有静态字段中。然后，该实例将返回给调用者。\n\
    -   任何后续调用将直接返回已经创建的对象实例。\n"
