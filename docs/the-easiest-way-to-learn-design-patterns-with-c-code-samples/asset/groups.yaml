  - '[PAGE 279]


    +   • Because you can create more than one Iterator from each Aggregate, you can
    iterate through the same collection in parallel.


    And now let''s examine some things that you should watch out for while using the
    Iterator pattern.


    # Caveats of using Iterator


    If we go back to our ListAggregate, you will see that we have hardly added any
    value to it. The object merely encapsulates an inbuilt List data type. And this
    data type has its own Iterator, which, in the language of C# system library is
    called Enumerator.


    And this demonstrates the first problem with using the Iterator design pattern.
    If you are dealing with simple collections, it would be better to deal with them
    directly. If you apply Iterator design pattern in such a situation, you will only
    make your code complicated without adding any value at all. So, you should only
    reserve this design pattern for complex collection types.


    But even while dealing with complex collection types, it is worth checking whether
    it wouldn''t be more efficient to just traverse the collection directly. Even
    though the Iterator design pattern allows you to provide a convenient interface
    that enables the consuming client to traverse the collection in one direction,
    it could be that for certain collection types traversing it in one direction wouldn''t
    be the most appropriate or the most efficient thing to do.'
  - '[PAGE 280]


    # 39. Mediator


    Mediator is a design pattern where one object facilitates communication between
    multiple other objects. It''s analogous to air traffic control, which acts as
    a mediator between different flights. Planes can talk to the air traffic control,
    which then delivers relevant information to other planes. But planes don''t talk
    to each other directly.


    Mediator design pattern can be summarized as follows:


    +   - There is a Mediator object, the role of which is to hold a list of Participants
    and facilitate communication between them.

    - There are multiple Participant objects, which can be of completely different
    types.

    - When a Participant wants to send a message to another Participant, it sends
    the message to Mediator.

    - Based on some parameter that identifies the recipient, Mediator sends the message
    to an appropriate Participant.


    We will now go through an example implementation of Mediator. The complete solution
    can be found via the link below:


    https://github.com/fiodarsanazavets/design-patterns-in-csharp/tree/main/Behavioral_Patterns/Mediator


    # Prerequisites


    In order to be able to implement the code samples below, you need the following
    installed on your machine:


    +   - .NET 6 SDK (or newer)'
