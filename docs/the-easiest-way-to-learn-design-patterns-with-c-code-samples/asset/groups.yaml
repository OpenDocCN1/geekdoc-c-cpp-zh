    \ to be aware of. Other than that, there is no better way to build complex hierarchies\
    \ than the Composite design pattern.\n\n```csharp\nnamespace Decorator_Demo;\n\
    internal class Silencer : GunDecorator {\n    public override bool Shoot() {\n\
    \        if (base.Shoot()) {\n            Console.WriteLine(\"Shot has been silenced.\"\
    );\n            return true;\n        }\n        return false;\n    }\n}\n```\n\
