    \ true;\n            }\n            Console.WriteLine(\"Out of magazine ammo.\"\
    );\n        }\n        return false;\n    }\n}\n```\n\n现在让我们看看这些装饰器是如何协同工作的。为了这一点，我们将\
    \ `Program.cs` 的内容替换为如下：\n\n```csharp\nusing Decorator_Demo;\nvar gun = new Gun();\n\
