    Figure 45.1 - The outcome of using different Visitors


    The overview of the Visitor design pattern is now complete. Let''s summarize the
    value it gives us.


    # Benefits of using Visitor


    Visitor design pattern has the following key benefits:


    +   - A new functionality can be added to existing objects without modifying their
    existing logic.

    - Open-closed principle is well maintained, as the existing objects remain close
    to modification.


    And now let''s get familiar with the things that you need to watch out for while
    using Visitor.


    # Caveats of using Visitor


    So, the main caveat of using the Visitor design pattern is that Visitor object
    doesn''t have access to private and protected members of'
  - '[PAGE 333]


    Component. And this makes it unsuitable for certain scenarios where some new functionality
    needs to be added to an existing object.


    Another caveat of using Visitor is that there are times where the Component object
    would be modified. As a developer, you need to watch out for, so you can either
    update your corresponding Visitor or retire it altogther.


    Finally, because a Visitor object may contain many methods, each corresponding
    to a specific Component implementation, you need to watch out for having too many
    of such methods on a single Visitor. Otherwise, you may end up with a God object.'
  - '[PAGE 334]


    # Epilogue


    In this book, you have learned most of the key foundational design patterns. I.
    call them foundational, because these are the classic design patterns that inspired
    all the other design patterns that you may encounter.


    And there was a great value in learning these design patterns. Maybe some of them
    are almost obsolete. For example, real-life situations where using the classic
    version of the Singleton design pattern are extremely rare. But the principles
    behind each of these design patterns still live on.


    You may no longer be able to find an appropriate scenario to use the Bridge design
    pattern in its classic form. But still, this pattern made, other modern design
    patterns possible. For example, both Model-View-Controller and Model-View-ViewModel
    design patterns are based on Bridge. Likewise, Bridge has inspired the modern
    architecture of distributed applications, where the UI and the back-end API are
    represented by different applications.


    And that''s a good example of why I call these design patterns "foundational”.
    Knowing them makes it easy to learn any other design patterns. And it makes it
    easy to understand many of the modern-day architectural practices.


    So, don''t be put off by the fact that you haven''t seen things like Model-View-Presenter
    or Repository in this book. There are many design patterns out there and it''s
    just impossible to cover all in a single book. But now, since you know the most
    fundamental ones of them all, you will have absolutely no problem learning other
    design patterns that have been invented more recently.


    There is only one classic design pattern that we have''t included in this book.
    And it''s called Iterator. But there was a good reason'
