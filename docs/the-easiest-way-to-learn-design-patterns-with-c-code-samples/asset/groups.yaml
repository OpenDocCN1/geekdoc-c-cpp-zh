    # 36. Chain of Responsibility


    Chain of Responsibility is a design pattern that allows you to apply multiple
    processing steps to an action. Any step of the process may have a condition added
    to it, which will allow it to exit the process immediately and not execute any
    further steps.


    Perhaps, the best-known example of Chain of Responsibility design pattern in .NET
    is ASP.NET Core middleware². This is where you can apply multiple stages of processing
    to incoming HTTP requests. The request will not get to its destination until it
    goes through all the steps, which you, as an application developer, can add or
    remove at will. For example, you can add a step that will verify whether or the
    user is not authorized. Then, if so, the request will proceed to the next stage
    of processing. If not, the response will be returned immediately with an appropriate
    response code.


    Chain of Responsibility can be summarized as follows:


    +   - a Handler object.

    - The Handler has a method to set its Successor, which would be another instance
    of the Handler object.

    - The Handler would also have the definition of the actual method that represents
    the processing step.

    - Each concrete implementation of a Handler would have its own logic inside this
    method, which, after performing its own processing, would call the same method
    on the Successor (if one is set).


    > ²https://docs.microsoft.com/en-us/aspnet/core/fundamentals/middleware/'
