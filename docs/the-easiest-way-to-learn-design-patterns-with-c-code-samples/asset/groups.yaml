    \n# 先决条件\n\n为了能够实现下面的代码示例，你需要在你的机器上安装以下内容：\n\n- .NET 6 SDK（或更高版本）\n- 适当的 IDE 或代码编辑器（Visual\
    \ Studio, Visual Studio Code, JetBrains Rider）\n\n# State 实现示例\n\n我们将创建一个控制台应用程序项目，模拟智能手机的基本操作。为了演示目的，我们只需要显示智能手机\
    \ Home 键在状态变化时表现有何不同。\n\n首先，我们需要为它的状态添加以下接口。无论手机处于什么状态，用户仍然能够按下 Home 键。该接口反映了这一点。\n\
    \n```csharp\nnamespace State_Demo;\n\ninternal interface IMobileState\n{\n   \
