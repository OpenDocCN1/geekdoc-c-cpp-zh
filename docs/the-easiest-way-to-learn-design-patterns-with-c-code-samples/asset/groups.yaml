    extendedMag.Shoot();\nextendedMag.Shoot();\nextendedMag.Shoot();\nextendedMag.Shoot();\n\
    Console.ReadKey();\n```\n\n在这里，我们创建了 `Gun` 类的实例，装填它并进行了一些射击。然后我们为它应用了 `Silencer`\
