    \ each of the developers is only familiar with his own set of changes and isn't\
    \ aware how to resolve the conflict with the changes made by another developer.\n\
    \nSingle responsibility principle exists precisely to eliminate these kinds of\
    \ problems. In our example, we can apply the single responsibility principle by\
