- md: "\n## 1. Single responsibility principle\n\n## The concept of class cohesion\n\
    \nIn our example, it was very clear where the responsibilities should be split,\
    \ and in most of the cases, the decision will be based on the same factor we have\
    \ used – splitting responsibility based on atomic functional areas. In our case,\
    \ the application was mainly responsible for two things – processing text and\
    \ managing files; therefore we have two functional areas within it and ended up\
    \ with a separate class responsible for each of these.\n\nHowever, there will\
    \ be situations where a clear-cut functional areas would be difficult to establish.\
    \ Different functionalities sometimes have very fuzzy boundaries. This is where\
    \ the concept of class cohesion comes into play to help decide which classes to\
    \ split and which ones to leave as they are.\n\nClass cohesion is a measure of\
    \ how different public components of a given class are inter-related. If all public\
    \ members are inter-related, then the class has the maximal cohesion, while a\
    \ class that doesn't have any inter-related public members has no cohesion. And\
    \ the best way to determine the degree of cohesion within a class is to check\
    \ whether all private class-level variables are used by all public members.\n\n\
    If every private class-level variable is used by every public member, then the\
    \ class is known to have maximal cohesion. This is a very clear indicator that\
    \ the class is atomic and shouldn't be split. The exception would be when the\
    \ class can be refactored in an obvious way and the process of refactoring eliminates\
    \ some or all of the cohesion within the class.\n\nIf every public member inside\
    \ the class uses at least one of the private class-level variables, while the\
    \ variables themselves are inter-dependent and are used in combination inside\
    \ some of the public methods, the class has less cohesion, but would probably\
    \ still not be in violation of single responsibility principle.\n\n## 1. Single\
    \ responsibility principle\n\nIf, however, there are some private class-level\
    \ variables that are only used by some of the public members, while other private\
    \ class-level variables are only ever used by a different subset of public members,\
    \ the class has low cohesion. This is a good indicator that the class should probably\
    \ be split into two separate classes.\n\nFinally, if every public member is completely\
    \ independent from any other public member, the class has zero cohesion. This\
    \ would probably mean that every public method should go into its own separate\
    \ class.\n\nLet's have a look at TextProcessor class, which we have only one method,\
    \ ConvertText. So, we don't have to look at the cohesion. It has maximal cohesion\
    \ already.\n\nIn our FileProcessor class, we have two methods, ReadAllText and\
    \ WriteToFile. Both of these methods use the fullFilePath variable, which is initialized\
    \ in the class constructor. The class also has the maximal cohesion and therefore\
    \ is atomic.\n\n## God Object – the opposite of single responsibility\n\nSo, you\
    \ now know what single responsibility principle is and how it benefits you as\
    \ a developer. What you may be interested to know is that this principle has the\
    \ opposite, which is known as God Object.\n\nIn software development, a method\
    \ of doing things that is opposite to what best practices prescribe known as anti-pattern;\
    \ therefore God Object is a type of an anti-pattern. It is just as important to\
    \ name bad practices as it is to name good practices. If something has a name,\
    \ it becomes easy to conceptualize and remember, and it is crucially important\
    \ for software developers to remember what not to do.\n\n## 1. Single responsibility\
    \ principle\n\nIn this case, the name perfectly describes what this object is.\
    \ As you may have guessed, a God Object is a type of class that is attempting\
    \ to do everything. Just like God, it is omnipotent, omniscient and omnipresent.\n\
    \nIn our example, the first iteration of our code had Program.cs file containing\
    \ the entire application logic, therefore it was just a God Object in the context\
    \ of our application. But this was just a simplistic example. In a real-life scenario,\
    \ a God Object may span thousands of lines of code.\n\nSo, I don't care whether\
    \ you are religious or not. Everyone is entitled to worship deity in the privacy\
    \ of their own home. Just make sure you don't put God into your code. And remember\
    \ to always use the single responsibility principle.\n\n## Conclusion\n\nIn this\
    \ chapter, we have covered the first and arguably the most important SOLID principle\
    \ of object-oriented software development. In the next chapter, we will have a\
    \ look at how to use Open-closed principle in the context of C#.\n\n## 2. Open-closed\
    \ principle\n\nIn this chapter, we will cover the second principle from the SOLID\
    \ acronym – open-closed principle. We will do so by looking at some examples in\
    \ C#. However, the general concepts will be applicable to any other object-oriented\
    \ language.\n\nThe full solution demonstrated in this chapter is available via\
    \ the following link:\n\nhttps://github.com/fiodarsazanavets/Dotnet-CSharp-SOLID-demo/tree/master/2-open-closed-principle\n\
    \n## What is open-closed principle\n\nOpen-closed principle states that every\
    \ atomic unit of code, such as class, module or function, should be open for extension,\
    \ but closed for modification. The principle was coined in 1988 by Bertrand Meyer.\n\
    \nEssentially, what it means is that, once written, the unit of code should be\
    \ unchanged, unless some errors are detected in it. However, it should also be\
    \ written in such a way that additional functionality can be attached to it in\
    \ the future if requirements are changed or expanded. This can be achieved by\
    \ common features of object oriented programming, such as inheritance and abstraction.\n\
    \nUnlike single responsibility principle which almost everyone agrees, with the\
    \ open-closed principle has its critics. It's always obvious how the single responsibility\
    \ principle can be implemented and what benefits it will provide. However, trying\
    \ to foresee where the requirements may change in the future and designing your\
    \ classes in such a way that most of them would be without having to alter your\
    \ existing code is often seen as unnecessary overhead that doesn't provide any\
    \ benefits.\n\nAnd the way the software is written has moved on by quite bit since\
    \ 1988. If back then the process of deploying a new software version was tedious,\
    \ long and expensive, many systems of today take minutes to deploy. And the whole\
    \ process can be done on demand with a click of a mouse.\n\nAnd with agile software\
    \ development practices being adopted everywhere in the industry, requirements\
    \ change all the time. Quite often, the changes are radical. Whole sections of\
    \ code get removed and replaced on regular bases. So, why design for an adherence\
    \ to open-close principle if the component that you are writing is quite likely\
    \ to be ditched very soon?\n\nAlthough these objections are valid, the open-closed\
    \ principle still provides its benefits. Here is an example.\n\n## Implementing\
    \ the open-closed principle in C#\n\nIn the previous chapter, we had a C# example\
    \ of single responsibility principle. We have written an application that reads\
    \ the text from any text file and converts it into HTML by enclosing every p tags.\n\
    \nAfter all of the refactoring, we have ended up with three classes, which are\
    \ as follows. FileProcessor class that reads the input file and saves the output\
    \ into a HTML file:\n\n```\nnamespace TextToHtmlConverter;\npublic class FileProcessor\n\
    {\n    private readonly string fullFilePath;\n\n    public FileProcessor(string\
    \ filePath)\n    {\n        this.fullFilePath = filePath;\n    }\n\n    public\
    \ string ReadAllText()\n    {\n        return System.Web.Utility.HtmlEncode(File.ReadAllText(fullFilePath));\n\
    \    }\n\n    public void WriteToFile(string text)\n    {\n        var outputFile\
    \ = Path.GetDirectoryName(fullFilePath) + Path.DirectorySeparatorChar + Path.GetFileNameWithoutExtension(fullFilePath)\
    \ + \".html\";\n        using var file = new StreamWriter(outputFile);\n     \
    \   file.Write(text);\n    }\n}\n```\n\nTextProcessor class that processes the\
    \ text from the input file:\n"
  mdcn: "\n\n## 1. 单一职责原则\n\n## 类内聚性的概念\n\n在我们的示例中，职责应该如何拆分是非常清晰的，在大多数情况下，该决策将基于我们所使用的相同因素——基于原子功能区域拆分职责。在我们的案例中，应用程序主要负责两件事：处理文本和管理文件；因此，我们在其中有两个功能区域，并最终为其中的每一个区域都创建了单独的类。\n\
    \n然而，在某些情况下，很难建立明确的功能区域。不同功能之间的边界有时非常模糊。这时，类内聚性的概念派上用场了，它可以帮助决定哪些类应该拆分，哪些类应该保持现状。\n\
    \n类内聚性是一个类的不同公共组件之间相互关联程度的指标。如果所有公共成员都相互关联，那么该类具有最大内聚性；而没有任何相互关联公共成员的类则没有内聚性。确定类内部内聚程度的最好方法是检查所有的私有类级变量是否被所有公共成员使用。\n\
    \n如果每个私有类级变量都被每个公共成员使用，则该类具有最大内聚性。这是一个非常明确的指标，表明该类是原子的，不应该被拆分。例外是该类可以以明显的方式进行重构，且重构过程消除了类中的部分或全部内聚性。\n\
    \n如果类内部的每个公共成员至少使用一个私有类级变量，而这些变量本身是相互依赖的，并在某些公共方法中组合使用，那么该类的内聚性较低，但可能仍然没有违反单一职责原则。\n\
    \n## 1. 单一职责原则\n\n然而，如果某些私有类级变量只被部分公共成员使用，而另一些私有类级变量又只被另一组公共成员子集使用，那么该类的内聚性就很低。这是一个很好的指标，表明该类可能应该被拆分成两个独立的类。\n\
    \n最后，如果每个公共成员都与其他任何公共成员完全独立，那么该类的内聚性为零。这可能意味着每个公共方法都应该进入它自己的独立类中。\n\n让我们来看 `TextProcessor`\
    \ 类，它只有一个方法 `ConvertText`。所以，我们不需要考虑内聚性。它已经具有最大内聚性了。\n\n在我们的 `FileProcessor` 类中，有两个方法：`ReadAllText`\
    \ 和 `WriteToFile`。这两个方法都使用了 `fullFilePath` 变量，该变量是在类的构造函数初始化的。该类也具有最大内聚性，因此是原子的。\n\
    \n## 神对象——单一职责原则的对立面\n\n现在你已经知道什么是单一职责原则，以及它是如何让你作为开发者受益的。你可能想知道的是，这个原则有一个反面，被称为“神对象”（God\
    \ Object）。\n\n在软件开发中，与最佳实践建议相反的办事方法被称为“反模式”（anti-pattern）；因此，神对象是反模式的一种。为坏实践命名与为好实践命名同样重要。如果某个东西有一个名字，它就变得容易概念化和记忆，对于软件开发人员来说，记住不该做什么至关重要。\n\
    \n## 1. 单一职责原则\n\n在这种情况下，这个名字完美地描述了这个对象是什么。正如你可能猜的那样，神对象是一种试图做一切的类。就像神一样，它是全能、全知且无处不在的。\n\
    \n在我们的示例中，代码的第一次迭代有一个 `Program.cs` 文件包含了整个应用程序的逻辑，因此在我们的应用程序语境下，它就是一个神对象。但这只是一个简单的例子。在现实场景中，神对象可能跨越数千行代码。\n\
    \n所以，我不在乎你是否有宗教信仰。每个人都有权在自己的私家里崇拜神灵。只需确保不要把神放进你的代码里即可。记住始终使用单一职责原则。\n\n## 结论\n\
    \n在本章中，我们涵盖了面向对象开发最重要的原则。在下一章中，我们将查看如何在 C# 中使用该原则。\n\n## 2. 开闭原则\n\n在本章中，我们将涵盖\
    \ SOLID 缩写中的第二个原则——开闭原则。我们将通过查看 C# 的示例来实现。然而，这些概念适用于任何面向对象的语言。\n\n本章演示的完整解决方案可以通过链接获取：\n\
    \nhttps://github.com/fiodarsazanav/Dotnet-SOLID-demo/tree/master\n\n## 什么是开闭原则\n\
    \n开闭原则规定，每个原子代码单元（如类、模块或函数）应该是开放的，但对修改关闭的。该原则由伯特兰·迈耶（Bertrand Meyer）在1988年提出。\n\
    \n本质上，它的意思是一旦编写，除非检测到错误，否则未来可以为其添加功能。这可以通过面向对象编程的特性实现，例如继承和抽象。\n\n与几乎所有人都会同意的单一职责原则不同，开闭原则也有其批评者。单一职责原则如何实现以及它将提供什么益处是明显的。然而预测未来的需求变化并以这种方式设计类而不修改现有代码，通常被认为是不提供任何收益的额外开销。\n\
    \n软件的编写方式自1988年以来有了很大进步。那时部署新软件版本是繁琐且昂贵的，而现在的许多系统只需要几分钟即可部署。而且整个过程可以根据需要点击完成。\n\
    \n随着敏捷软件开发实践在整个行业被采用，需求不断变化。经常，整个代码段会被删除和替换。所以，如果你编写的组件很可能被丢弃，为什么还要遵循开闭原则进行设计呢？\n\
    \n尽管这些反对意见有效，开闭原则仍然提供其益处。这是一个示例。\n\n## 在 C# 中实现开闭原则\n\n在上一章中，我们有一个单一职责原则的 C# 示例。我们编写了一个应用程序，从任何文本文件读取文本并将其转换为\
    \ HTML，包裹每个 `p` 标签。\n\n在所有的重构之后，我们最终得到了三个类，如下。`FileProcessor` 类读取输入文件并将输出保存到 HTML\
    \ 文件：\n\n```\nnamespace TextToHtmlConverter;\npublic class FileProcessor\n{\n\
    \    private readonly string fullFilePath;\n\n    public FileProcessor(string\
    \ filePath)\n    {\n        this.fullFilePath = filePath;\n    }\n\n    public\
    \ string ReadAllText()\n    {\n        return System.Web.Utility.HtmlEncode(File.ReadAllText(fullFilePath));\n\
    \    }\n\n    public void WriteToFile(string text)\n    {\n        var outputFile\
    \ = Path.GetDirectoryName(fullFilePath) + Path.DirectorySeparatorChar + Path.GetFileNameWithoutExtension(fullFilePath)\
    \ + \".html\";\n        using var file = new StreamWriter(outputFile);\n     \
    \   file.Write(text);\n    }\n}\n```\n\n`TextProcessor` 类处理来自输入文件的文本：\n\n"
