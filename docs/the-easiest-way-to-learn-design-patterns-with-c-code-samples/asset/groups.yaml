    - There are multiple concrete implementations of the Factory, each returning a
    specific set of the Target Object implementations.

    - When we need to return a specific set of the Target Object implementations,
    we initialize a specific implementation of the Factory and call the creation methods
    on it.


    We will now go through an example implementation of Abstract Factory. The complete
    solution can be found via the link below:


