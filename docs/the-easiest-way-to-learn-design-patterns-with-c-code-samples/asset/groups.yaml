    the functionality of the output object and not violate open-closed principle.

    - Easy to write unit tests, as Creational logic will be separated from the conditional
    logic.


    # Abstract Factory


    Abstract Factory inside a design pattern that uses multiple Factory Methods inside
    of the Creator object, so you can create a whole family of related objects based
    on a particular condition instead of just one object.


    Let''s change the above example slightly. Imagine that our app needs to be able
    to play audio or video, so you will need to implement two separate interfaces
    - IAudioPlayer and IVideoPlayer. Again, it must work on either Linux or Windows.


    In this case, your Abstract Factory will have a separate method to return an implementation
    of IAudioPlayer and a separate method to return an implementation of IVideoPlayer.
    You will have a version of the Factory that is specific to Windows and another
    version that is specific to Linux.


    It''s known as Abstract Factory because it either implements an interface or extends
    an abstract class. Then it is up to the concrete implementation of the Factory
    to create concrete implementations of the output objects that are both relevant
    to a specific condition.


    # Builder


    Builder design pattern is similar to Factory Method, but instead of just returning
    a concrete implementation of an object all at once, it builds the object step-by-step.'
