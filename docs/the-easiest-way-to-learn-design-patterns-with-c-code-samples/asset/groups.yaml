    # 26. Builder


    Builder is a design pattern that is used for building an object in multiple steps.
    It''s especially useful when each part of the object, rather than the entire object,
    needs to be built conditionally. Another situation where Builder design pattern
    is suitable is when you can''t know ahead of time specific part you need to add
    to your object.


    Builder can be summarized as follows:


    +   - There is a **Builder** class that creates a specific type of object and
    adds various parts to it. We will refer to the output object as **Target Object**.

    - **Builder** object has various methods to modify the **Target Object** while
    keeping the implementation of **Target Object** inaccessible.

    - **Builder** object has a method that needs to be called to produce **Target
    Object** once sufficient modifications have been applied to it and it''s ready
    to be used.

    - There may also be a **Director** object, which uses a specific implementation
    of **Builder** and is solely responsible for manipulating **Builder**. But **Director**
    object is not strictly required.


    Perhaps noteworthy example of a Builder design pattern implementation is `StringBuilder`
    class from System.Text namespace of C#.


    We will now go through an example implementation of Builder. The complete solution
    can be found via the link below:


    > ^https://docs.microsoft.com/en-us/dotnet/api/system.text.stringbuilder'
