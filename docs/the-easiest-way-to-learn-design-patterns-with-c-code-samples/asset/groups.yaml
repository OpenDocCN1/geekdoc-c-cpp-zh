    # Benefits of using Memento


    Memento design pattern gives you the following key benefits:


    +   - Because snapshot Memento objects are separate from the internal state of
    the Originator, you can get them to store only as much or as little information
    as possible.

    - The history of changes is easy to construct and revert.

    - Because there is a separate Caretaker object involved, the single responsibility
    principle is well maintained.


    But, as effective as Memento design pattern is for enabling undo action, there
    are some things to look out for while using it. And this is what we will have
    a look at next.


    # Caveats of using Memento


    The main thing to look out for while using Memento design pattern is that your
    Memento stack doesn''t consume too much memory,'
