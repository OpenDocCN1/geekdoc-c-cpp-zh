    \ all components defined by the interface as its public members.\n\nInterface\
    \ segregation principle states that if any particular interface member is not\
    \ intended to be implemented by any of the classes that implement the interface,\
    \ it must not be in the interface. It is closely related to single responsibility\
    \ principle by making sure that only the absolutely essential functionality is\
    \ covered by the interface and the class that implements it.\n\nAnd now, we will\
    \ see why interface segregation is important.\n\n## Importance of interface segregation\n\
    \nWe will continue with the same code that we have ended up after we have implemented\
    \ the Liskov substitution principle in the previous article.\n\nSo, we have a\
    \ base class called TextProcessor that converts paragraphs in the input text into\
    \ HTML paragraphs by applying relevant-tags to them.\n\n```csharp\nusing System.Text;\n\
    using System.Text.RegularExpressions;\n\nnamespace TextToHtmlConverter;\n\npublic\
    \ class TextProcessor\n{\n    public virtual string ConvertText(string inputText)\n\
    \    {\n        var paragraphs = Regex.Split(inputText, @\"(\\r\\n?|\\n)\")\n\
    \            .Where(p => p.Any(char.IsLetterOrDigit));\n\n        var sb = new\
    \ StringBuilder();\n        foreach (var paragraph in paragraphs)\n        {\n\
    \            if (paragraph.Length == 0)\n                continue;\n         \
    \   sb.AppendLine($\"<p>{paragraph}</p>\");\n        }\n        sb.AppendLine(\"\
    <br/>\");\n        return sb.ToString();\n    }\n}\n```\n\nWe also have a derived\
    \ class, MdTextProcessor, that adds a new processing capability – the ability\
    \ to detect specific Markdown symbols and convert them into corresponding HTML\
    \ tags. Make sure that any places in the code that accept the original TextProcessor\
    \ class don't behave differently if an instance of MdTextProcessor is passed instead,\
    \ the additional functionality is implemented via a new method – ConvertMdText.\n\
    \n```csharp\nnamespace TextToHtmlConverter;\n\npublic class MdTextProcessor :\
    \ TextProcessor\n{\n    private readonly Dictionary<string, (string, string)>\
    \ tagsToReplace;\n\n    public MdTextProcessor(Dictionary<string, (string, string)>)\
    \ tagsToReplace)\n    {\n        this.tagsToReplace = tagsToReplace;\n    }\n\n\
    \    public string ConvertMdText(string inputText)\n    {\n        var processedText\
    \ = base.ConvertText(inputText);\n        foreach (var key in tagsToReplace.Keys)\n\
    \        {\n            var replacementTags = tagsToReplace[key];\n          \
    \  if (CountStringOccurrences(processedText, key) == 0)\n            {\n     \
    \           processedText = ApplyTagReplacement(processedText, key, replacementTags.Item1,\
    \ replacementTags.Item2);\n            }\n        }\n        return processedText;\n\
    \    }\n\n    private int CountStringOccurrences(string text, string pattern)\n\
