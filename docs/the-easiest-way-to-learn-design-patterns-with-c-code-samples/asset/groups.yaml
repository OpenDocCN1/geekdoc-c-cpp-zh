    \ cam belt is there only to synchronize the rotation of the crankshaft and the\
    \ camshafts and so on.\n\n## 1. Single responsibility principle\n\nEach of these\
    \ components is atomic (unsplittable), self-contained and can be easily replaced.\
    \ So should be each of your classes.\n\nClean Code, a book that every developer\
