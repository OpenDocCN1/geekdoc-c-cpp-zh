    not trying to memorize things. Effective learning is about building associations
    with the stuff you already know and the new information you are trying to internalize.
    Therefore it would be hard to learn design patterns if you just start looking
    at them without the sufficient knowledge of the context that they are used under.


    Without the context, you won''t be able to build mental associations. You won''t
    be able to fully understand what each of the design patterns used for. So you
