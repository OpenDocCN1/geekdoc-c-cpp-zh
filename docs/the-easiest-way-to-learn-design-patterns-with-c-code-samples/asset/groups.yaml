    In this case, your configuration file may contain all shared connection parameters.
    And you will only have to go through the configuration to create the prototype
    object. After that, to create any new connection objects, all''ll have to do clone
    the existing one and change the port number accordingly.


    To gain performance benefits, Prototype can be combined with Object Pool. Prototype
    is especially useful when the objects in the Object Pool are complex.'
- md: '

    # Why would you use Prototype alongside Object Pool


    - The objects in the Pool are much easier to instantiate, as they can now be cloned.


    # 9. Using the same single instance of an object throughout the application


    Imagine that you have a requirement to use exactly the same instance throughout
    your entire application, regardless of whether the classes that use it can communicate
    directly with each other or not.


    One thing you can do is instantiate it in one place and pass the instance to every
    class that uses it, especially if a developer that uses it, but it''s less than
    desirable. It means that you will have to write a lot of extra code that will
    be hard to read and maintain.


    Plus, there is nothing that would stop passing a different object reference into
    a class that uses it, especially if a developer that is currently working on the
    code doesn''t know that the original intention was to keep the reference across
    the board. This will probably introduce some bugs.


    # Suitable design patterns


    # Singleton


    With this design pattern, the class that you want to have a single instance of
    will have a static method that will return an instance of this class. Behind the
    scenes, this method will call a private constructor the first time you call it,
    so the class will be instantiated only once. If you call this method again, then
    the same instance will be returned as was instantiated before.


    Otherwise, the class will have no public constructor, so it will not be possible
    to create a new instance of it by any external code. This will guarantee that,
    no matter where you are calling the static method from, exactly the same instance
    of the class will be returned.


    # Why would you want to use Singleton


    - Being able to use the same instance of an object in any part of your application
    without explicitly passing an instantiated object.

    - It will prevent you from creating more than one instance of a particular type.


    # Object Pool


    We have already covered Object Pool in chapter 8 as a design pattern primarily
    intended for managing multiple instances of the same object type without incurring
    much of performance penalty. However, in order to be accessible throughout the
    application, Object Pool also needs to be a singleton.


    So, in the nutshell, to make the most of Object Pool, the class that acts as an
    Object Pool must also implement the Singleton design pattern.


    # Why would you use Object Pool as Singleton


    - Your entire application shares the same pool of the objects.

    - You don''t have to instantiate more object instances than strictly needed.


    # 10. Third party components aren’t directly compatible with your code


    Imagine that you are working with a third party library that returns data in a
    specific format. The problem is, however, that this is not the data format that
    the rest of your application works with.


    For example, your code may only be working with JSON, while the third party library
    only delivers data as XML. In this situation, the last thing you want to do is
    rewrite the rest of your code to make it compatible with XML, especially if you
    don''t expect anything other than this library to use XML.


    There is also another variety of this problem that you may encounter. Once again,
    you are dealing with a third party library, but this time, its accessible interface
    is written differently from how the set of related functionality is written in
    your application. If this third party library is meant to be able to replace your
    own components, ideally it should use the same signatures on accessible members
    as your classes are using. Once again, the last thing you want to do is include
    special cases into what was meant to be generic code.


    It doesn''t necessarily have to be a third party library though. It could be your
    own legacy code that was written a while ago, when either a different philosophy
    was implemented or modern best practices weren''t properly followed. In this case,
    you cannot just change the legacy components, as it has already been extensively
    tested and many other components within the system rely on it.


    All these examples have one thing in common – you need to work with something
    that is structurally different from the rest of your code, but making changes
    to your own code is not desirable.


    # Suitable design patterns


    # Adapter


    You can think of Adapter as a wrapper class for whatever component you would want
    to use in your code that is currently incompatible with it. The Adapter class
    will be accessible by using exactly the same interfaces that are normally used
    in your code, internally it will be calling methods on the external component.
    If it needs to transfer the data, it will do so in a format that is compatible
    with the rest of your code.


    Basically, Adapter class is analogous to a real-life physical adapter, such as
    an electric plug adapter. As you may know, the US, UK and continental Europe use
    different electric sockets. So if you are traveling with your electronic devices
    in. You will have to get an adapter that has the same input configuration as a
    wall socket in the US, but has the same output pin configuration as European socket
    plug.


    # Why would you use Adapter


    - Adapter allows you to isolate interface conversion functionality to only a single
    place in your code.

    - Open-closed principle is enforced

    - The access point into the immutable external component is standardized along
    with the rest of your code.


    # 11. Adding new functionality to existing objects that cannot be modified


    Imagine that you have the following situation. There is either some third party
    library, or your own legacy code that you need to use. And you need to make some
    changes to its functionality. You would either need to modify the existing behavior,
    or add some new behavior. But you can''t change the components that you are about
    to use. This is because you either don''t have access to the internal code of
    those components, or simply aren''t allowed to make this change.


    Or maybe the external component is not fully compatible with your code, so you
    will need to make both compatible and extend it. However, making the component
    compatible with your code is a different problem that we have already covered.
    The specific problem that we are looking at now is the ability to extend the behavior
    of the objects that you can''t modify directly.


    # Suitable design patterns


    # Decorator


    Decorator is a design pattern that is similar to Adapter. Just like with Adapter,
    the Decorator class acts as a wrapper around the original object. However, instead
    of changing the interface of the original object, it uses the same interface as
    the existing object.


    You can think of a silencer on a pistol to be analogous to the Decorator design
    pattern. The original pistol already has a specific configuration that you cannot
    change. By attaching a silencer to it makes it behave differently. While the silencer
    is attached, however, the original pistol remains intact. The silencer can be
    removed at any point.


    So, when you apply the Decorator design pattern, anything in your code that could
    previously use the original object would still be able to use the Decorator class
    in its place. And this is precisely because the original structure of the interface
    was left intact.


    # Why would you use Decorator


    - It will give you the ability to easily add functionality to those objects that
    you can''t modify directly.

    - Open-closed principle is enforced.

    - You can use it recursively by applying additional decorators on top of the existing
    ones.

    - You can dynamically add responsibilities to an object at runtime.

    - Single responsibility principle is applied well, as each decorator can be made
    responsible for only a single enhanced functionality.

    '
