    Home screen has opened.\");\n    }\n}\n```\n\n接下来，我们将添加我们的 Context 对象。此对象一次持有一个\
    \ State 实现。此对象的客户端可以更改 State 并触发 HomeButton。\n\n```csharp\nnamespace State_Demo;\n\
    \ninternal class MobilePhoneContext\n{\n    IMobileState state;\n\n    public\
    \ MobilePhoneContext()\n    {\n        state = new LockedScreenState();\n    }\n\
    \n    public void ChangeState(IMobileState state)\n    {\n        this.state =\
