    \n# 中介者实现示例\n\n与所有其他示例一样，我们将创建一个控制台应用程序项目。在这个示例中，我们将构建一个代表对等点计算机网络的系统。网络中的每个设备都将是一个参与者（Participant）。代表网络的对象将充当中介者（Mediator）。\n\
