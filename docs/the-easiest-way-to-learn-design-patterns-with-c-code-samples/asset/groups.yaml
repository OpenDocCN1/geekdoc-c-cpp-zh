    - A suitable IDE or a code editor (Visual Studio, Visual Studio Code, JetBrains\
    \ Rider)\n\n# Memento implementation example\n\nAfter creating a project based\
    \ on a console application template, we will add the following interface to it,\
    \ which will represent the public methods available on the Memento object:\n\n\
    ```csharp\nnamespace Mediator_Demo;\ninternal interface IMemento\n{\n    string\
    \ GetState();\n    DateTimeOffset GetCreatedDate();\n}\n```\n\nThe concrete Memento\
    \ implementation will look as follows:\n\n```csharp\nnamespace Mediator_Demo;\n\
    internal class TextEditorMemento : IMemento\n{\n    private readonly string state;\n\
    \    private readonly DateTimeOffset created;\n    public TextEditorMemento(string\
    \ state)\n    {\n        this.state = state;\n        created = DateTimeOffset.Now;\n\
    \    }\n}\n```\n"
