    running on and applies an OS-specific implementation of the Factory object. Then,
    calling any of the methods on the Factory implementation will return OS-specific
    implementation of the functionality that the method is responsible for creating.


    And this concludes our overview of Abstract Factory. Let''s summarize what its
    benefits are.


    # Benefits of using Abstract Factory


    The benefits of using Abstract Factory are the same as that of using Factory Method.
    Let''s recap what those are:


    +   * Abstract Factory enforces the single responsibility principle by separating
    conditional logic from implementation of the logic inside each condition.

    * This allows us to easily maintain the code and write automated tests for it.
    There won''t be any complex and barely readable tests assessing complex conditional
    logic. Instead, a couple of simple scenarios will assess the correct implementations
    of Target Objects and Factory is picked up for each condition. Then, separate
    sets of scenarios can be applied to each separate Target Object and Factory implementation.

    * Abstract Factory allows you to execute a particular condition once. Because
    all implementations of each Target Object type use a common abstraction, a concrete
    implementation of it can be created and then just re-used throughout the code.


    In addition to these, Abstract Factory has the following major benefit:


    +   * Abstract Factory allows you to create a whole family of related objects
    in one go.'
