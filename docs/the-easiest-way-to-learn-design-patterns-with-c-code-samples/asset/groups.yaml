    And we still have our code structured in accordance with the single responsibility
    principle, as the method is purely responsible for converting text and nothing
    else. And we still have 100% saturation, as the new method fully relies on the
    existing functionality from the base class, so our inheritance wasn''t pointless.


    We are still acting in accordance with the open-closed principle, but we no longer
    violate the Liskov substitution principle. Every instance of derived class will
    have the base class functionality inherited, but all of the existing functionality
    will work exactly like it did in the base class. So, using objects made from derived
    classes will not break any existing functionality that relies on the base class.


    # # Conclusion


    Liskov substitution principle is a pattern of coding that will help to prevent
    unintended functionality from being introduced into the code when you extend existing
    classes via inheritance.


    However, certain language features may give less experienced developers an impression
    that it''s OK to write code in violation of this principle. For example, virtual
    keyword in C# may seem like it''s even encouraging people to ignore this principle.
    And sure enough, when an abstract method is overridden, nothing will break, as
    the original method didn''t have any implementation details. But a virtual method
    would have already had some logic inside it; therefore overriding it will change
    the behavior and would probably violate Liskov substitution principle.


    The important thing to note, however, is that a principle is not the same as a
    law. While a law is something that should always be'
  - '[PAGE 58]


    applied, a principle should be applied in the majority of cases. And sometimes
    there are situations where violating a certain principle makes sense.


    Also, overriding virtual methods in C# won''t necessarily violate Liskov substitution
    principle. The principle will only be violated if the output behavior of the overridden
    method changes. Otherwise, if the override merely changes the class variables
    that are used in other methods that are only relevant to the derived class, Liskov
    substitution principle will not be violated.


    So, whenever you need to decide whether or not to override a virtual method in
    C#, use common sense. If you are confident that none of the components that rely
    on the base functionality will be broken, then go ahead and override the method,
    especially if it seems to be the most convenient thing to do. But try to apply
    the Liskov substitution principle as as much as you can.'
