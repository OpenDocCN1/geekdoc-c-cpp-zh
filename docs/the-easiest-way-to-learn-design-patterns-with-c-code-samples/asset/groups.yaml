    \ has been silenced.\nShot fired.\nShot has been silenced.\nOut of ammo.\nShot\
    \ fired from the magazine.\nOut of ammo.\nShot fired from the magazine.\n\nAnd\
    \ this concludes our Decorator example. Let's now summarize the main benefits\
    \ of using this design pattern.\n\n# Benefits of using Decorator\n\n- This design\
    \ pattern allows you to modify the behavior of objects without having access to\
