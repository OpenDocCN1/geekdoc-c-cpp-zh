    In the example with the user interface, the background layout may act as a mediator.
    Once any of the controls on it emits a specific type of event, the layout class
    will decide whether this event is something that any other element needs to be
    aware of and it will notify that element accordingly.


    So, none of the elements care about what happens after the event has been emitted.
    Deciding what to do with the event is a sole responsibility of a single Mediator
    class. And if any other elements are affected, the Mediator will issue instructions
    to them accordingly.


    # Why would you use Mediator


    +   - The sole responsibility of facilitating communication between different
    objects is taken up by a single class.

    - Individual components are much easier to re-use.

    - Open-closed principle is easy to enforce.


    # Observer


    Observer design pattern utilizes the concept of publishing and subscribing. Basically,
    any elements that emit a specific event are publishers and any elements that need
    to react to the event are subscribers.


    So, if you want a specific object to be affected by specific event types or events
    with specific data values, you can subscribe that object to those events. If you
    no longer need to get that object to react to those events, you can unsubscribe.'
