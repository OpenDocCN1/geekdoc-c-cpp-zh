    \n# 42. State模式\n\n状态是一种设计模式，允许开发者根据对象所处的状态来改变其行为。然而，对象的公共接口保持不变。\n\n你可以将其类比为智能手机。当手机处于锁定状态时，按下同一个按钮会弹出解锁\
