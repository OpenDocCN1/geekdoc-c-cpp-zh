    Let’s go back to our OS-independent app that plays audio. In the Factory Method
    example, we had a concrete implementation of the IPlayer interface for each operating
    system. However, if we wished to use Builder instead of a Factory Method, we would
    have a single concrete implementation of the interface that would act as a shell
    object. Let''s call it Player. It will be this type that gets produced in all
    scenarios, but the concrete parameters and dependencies will be injected into
    it based on what kind of operating system it''s running on.


    For example, both Linux and Windows allow you to play audio and manipulate its
    volume via the command line. On Linux, it will be Bash Terminal. On Windows, it
    will be either cmd or PowerShell.


    The principles are similar. In both cases, you would be typing commands. But the
    exact commands will be completely different. Plus there are likely to be separate
    commands for playing audio files and for manipulating audio volumes.


    So, in this case, our Player class will simply delegate the playback of audios
    to operating system components that are accessible via a command line interface.
    It''s only the actual commands that will be different. And this is where a Builder
    design pattern comes into play.


    Builder consists of two main components – Builder and Director. Builder is a class
    that returns a specific object type. But it also has a number of methods that
    modify this object type before it gets returned. Director is a class that accepts
    a Builder class, calls methods on it with a specific set of parameters and gets
    the Builder to return the finished object.


    So, in our case, imagine our Builder class for the Player object (which we will
    call PlayerBuilder) has the following methods: SetPlaybackInterface(that accepts
