    \ . . . . . . . . . . . 324\n\n# Introduction\n\nDesign patterns are something\
    \ that you will need to get familiar with as a programmer who works with object\
    \ oriented languages. And this is primarily because they represent well-defined\
    \ solutions to common software development problems. So, instead of thinking through\
    \ all the details of your solution, you can simply check if any of the existing\
    \ design patterns can be used. You won't have to reinvent the wheel.\n\nAs a software\
    \ developer, you would be familiar with reusable software components, such as\
    \ methods, functions, public classes, libraries, etc. Well, you can think of design\
    \ patterns as reusable solutions to common software problems.\n\n# What design\
    \ patterns are\n\nDesign patterns are prescribed ways of implementing solutions\
    \ to common problems. While every specific implementation of them will be bespoke\
    \ and only relevant to a specific codebase, they still determine how your code\
    \ should be structured. A design pattern\n"
