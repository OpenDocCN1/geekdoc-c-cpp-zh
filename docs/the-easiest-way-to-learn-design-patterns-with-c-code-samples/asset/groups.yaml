    Shot has been silenced.\");\n            return true;\n        }\n        return\
    \ false;\n    }\n}\n```\n\n```csharp\nnamespace Decorator_Demo;\ninternal class\
    \ ExtendedMagazine : GunDecorator {\n    private int extraAmmo = 0;\n\n    public\
    \ override void Reload() {\n        base.Reload();\n        extraAmmo = 6;\n \
    \   }\n\n    public override bool Shoot() {\n        if (base.Shoot()) {\n   \
    \         if (extraAmmo > 0) {\n                Console.WriteLine(\"Shot fired\
