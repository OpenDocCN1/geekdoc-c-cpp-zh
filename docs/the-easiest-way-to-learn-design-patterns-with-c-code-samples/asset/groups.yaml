    # 37. Command


    Command is a design pattern that isolates an operation in its own object. This
    makes such an operation reusable, so you don’t have to construct a brand new logic
    every time you need to perform an operation.


    The most popular way of using Command is in database operations. A Command object
    will contain all necessary information to perform some action that would modify
    the data (insertion, update, deletion, etc.). Then, if you need to perform such
    an operation on a particular database table, all you have to do is just reuse
    this object and maybe modify some of its parameters. You won’t have to write any
    complex logic involving object-relationship mappers or direct database queries.


    Command can be summarized as follows:


    +   - There is a Command interface that describes the behavior that each command
    should have. Usually, it only has one method, which executes the action.

    - If multiple related commands are needed, it makes sense to add Command abstract
    class with the shared functionality.

    - Each Concrete Command accepts parameters in its constructor and implements the
    method that executes the action.

    - Because Command accepts constructor parameters, it’s intended to be a single-use
    object.

    - Optionally, there could be an Invoker object, the role of which is to decide
    which commands to execute.


    We will go through an example implementation of Command. The complete solution
    can be found via the link below:


    https://github.com/fiodarsazanavets/design-patterns-in-sharp/tree/main/Behavioral_Patterns/Command'
