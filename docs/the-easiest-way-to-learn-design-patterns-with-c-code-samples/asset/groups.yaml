    \n接下来，我们将添加以下中介者的实现：\n\n# 39. 中介者\n\n```csharp\nnamespace Mediator_Demo;\n\ninternal\
    \ class NetworkMediator : IMediator\n{\n    private Dictionary<string, IParticipant>\
    \ participants;\n\n    public NetworkMediator()\n    {\n        participants =\
