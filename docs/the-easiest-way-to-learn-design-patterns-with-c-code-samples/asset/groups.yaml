    # # Benefits of using Prototype


    The main benefits of using the Prototype design pattern can be summarized as follows:


    +   - If you need to copy an object, the logic of copying it will be present in
    a single place in the entire codebase, which enforces DRY principle.

    - Because cloning of an object is performed inside the object itself, private
    fields can be copied too.


    Let''s now have a look at caveats that you need to be familiar with while using
    the Prototype design pattern (although there aren''t many of them).'
  - '[PAGE 187]


    # Caveats of using Prototype


    One thing that you need to be aware of while using Prototype is the difference
    between shallow and deep copying. When you perform a shallow copy, which is exactly
    what we had a look at in our example, only the values of the fields with basic
    data types get copied. So, the fields containing string, int, double, bool, etc.
    will be copied, but the fields containing custom data types, such as classes,
    won''t be.


    Deep copy is when you copy everything, including any custom data types that your
    object contains and any custom data type fields that those custom data types contain.
    Therefore, to ensure that you can perform a deep copy, you need to either make
    the other data types cloneable or perform manual field-by-field copying inside
    of your method.


    Other than that, there are no caveats of using Prototype design pattern. It is
    the best way to copy objects.'
