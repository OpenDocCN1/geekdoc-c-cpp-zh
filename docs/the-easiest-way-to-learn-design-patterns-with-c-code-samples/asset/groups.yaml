    # 38. Iterator


    Iterator is a design pattern that allows a developer to encapsulate a collection
    of any complexity inside an object with a very simple interface. The consumers
    of this interface would be able to iterate through each individual item of this
    collection without knowing any of its implementation details.


    In C#, pretty much any collection data types that can be traversed inside a for
    loop are based on the Iterator design pattern. For example, they expose methods
    such as MoveNext, which are commonly used by this design pattern.


    Iterator design pattern can be summarized as follows:


    +   - There is an object either as an Aggregate or a Collection. This object stores
    the actual collection of objects. This collection can be of any structure and
    any complexity (trees, stacks, arrays, etc.).

    - There is an object called Iterator, the role of which is to read the items from
    the Aggregate and expose them to the outside world by one.

    - Iterator object reads items in a specific order and keeps track of the current
    item.


    We will now go through an example implementation of Iterator. The complete solution
    can be found via the link below:


    https://github.com/fiodarsazanavets/design-patterns-in-sharp/tree/main/Behavioral_Patterns/Iterator'
