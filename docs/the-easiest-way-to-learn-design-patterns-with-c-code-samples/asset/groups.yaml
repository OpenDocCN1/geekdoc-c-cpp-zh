    pattern to decide what the object will be if you have to adjust its properties
    one by one by multiple steps of a conditional logic.


    You can reuse the same code for different representations of the final object.


    ## 7. Making several exact copies of a complex object


    Imagine that you have an object that you need to copy multiple times. Because
    it''s not a primitive type, you cannot just copy the value of the whole thing
    into a new variable of the same type. Instead, you would need to instantiate a
    new object of this type and then copy the value of every field from the original
    object instance.


    That would be fine for simple objects with a relatively small number of fields
    that contain primitive types, such as integers and Booleans. But what if you are
    dealing with complex objects with many fields, some of which contain other objects?
    And what if such an object contains private fields that you also want to be copied,
    but can''t access?


    In this case, you would need to write a complex code to make a copy of an object.
    For private fields in particular, you may also need to run additional logic to
    instantiate them. This way of doing things adds complexity–it makes the code less
    readable and vulnerable to errors. Plus, as you will have no direct access to
    private members of the object, you may not necessarily end up with an exact copy
    and suffer some undesirable side-effects as the result.


    ## Suitable design patterns


    ### Prototype


    Prototype is a design pattern that was created specifically for this problem.


    If you have a complex object that is meant to be copied often, you can make it
    cloneable. And this is exactly what this design pattern enables you to do.


    You would have an interface with a method that produces an instance of this interface.
    Usually, such a method will be called clone. And, if you want to make your object
    cloneable, this time, you will only have a single place in which you define the
    object type.


    Inside this method, you will still need to copy the value of every field into
    the output object. However, this time, you will only have a single place in the
    entire code base to do it in - the object itself. So, it will be easier to have
    a close look at it and consider all edge cases. Likewise, you will have full access
    to the private members of the object, so your copy will be exact.


    ### Why would you want to use Prototype


    - All code to copy complex objects is located in one place.

    - You can copy private members of the object.

    - Any code that needs to generate a copy of the object will only need to call
    the clone method without having to worry about the details of the cloning process.


    ## 8. Using many instances of an object while keeping code running smoothly


    Imagine that you have a requirement to use many similar objects in your application.
    Perhaps, you are building a distributed application based on microservices architecture
    and each of these objects represents a unique connection to one of your service
    instances. Or maybe you are interacting with multiple database entries, and for
    each one of them, you need an object that represents a database connection.


    In this situation, purely using inbuilt language features will probably be problematic.
    You will need to instantiate every single one of these objects. Once the object
    is out of scope, your runtime will need to get rid of it to free up the memory.
    Once you need a similar object again, you will instantiate it again. And so on.


    If you follow this approach, you will probably experience a performance hit. Instantiating
    a new object each time you need to use it is a relatively expensive process. The
    runtime will need to allocate memory for it and populate those chunks of memory
    with new values.


    If you are using similar objects in different parts of the application, you will
    be required to allocate sufficient memory to each instance of the object. And
    that may become quite a lot of memory if you need to use many of such instances.


    Likewise, when you are instantiating a new object, there is always a cost associated
    with running the constructor of the object''s data type. The more complex constructor
    logic is, the bigger performance you will get.


    Finally, when you are no longer using an instance of the object and it gets out
    of scope, there will be a performance cost associated with garbage collection.
    Remember that the memory will not be freed straight away. It will still be occupied
    until the garbage collector has found your object and identified that it is no
    longer being referenced anywhere.


    The latter, of course, doesn''t apply to the languages that don''t have an in-built
    garbage collector. However, in this case, you will have to free the memory yourself
    if you don''t want to introduce a memory leak. So, if you are using one of such
    languages, like C++ or Rust, you will have an additional issue in your code to
    worry about.


    ## Suitable design patterns


    ### Object Pool


    Object pool is a pattern that allows you to reuse the object instances, so you
    won''t have to keep instantiating new objects every time.


    You have a single Pool object that stores multiple instances of instantiated objects
    of a specific type. If any of these objects aren''t being used, they are stored
    inside the Pool. Once something in the code requests an object, it becomes unavailable
    to any other parts of the code. Once the caller has finished with the object,
    it gets returned to the Pool, so it can be reused by other callers.


    Initially, you will still need to instantiate objects in the Pool. However, when
    your Pool grows to a reasonable size, you will be instantiating new objects less
    and less, as there will be a greater chance of finding objects in it that have
    already been released by their respective callers.


    To ensure that the Pool doesn''t grow too big, a mechanism inside it will determine
    which instances to get rid of and which ones to keep. For example, you may have
    a thousand instances than you ever expect.


    ### Why would you want to use Object Pool


    - Objects are being reused, so you will not get any penalty with instantiating
    new objects.

    - Object pool maintains its size as needed, so you will not end up with way more
    instances than you use.


    ### Flyweight


    This design pattern allows multiple objects to share parts of their state. So,
    for example, if you have thousand objects all of which have the same values in
    some attributes, this set of attributes will be moved to a separate object and
    all thousand instances will be referring to the same instance of it.


    This allows you to store way more objects in memory than otherwise. In the case
    above, instead of having thousand instances of a particular object with all property
    values in each, you would have thousand skeleton objects, each occupying a tiny
    amount of space. The remaining properties of these objects will be stored in memory
    only once.


    One disadvantage of flyweight, however, is that it makes your code complicated.
    You will need to decide which parts of the state are shared and which aren''t.
    Also, you will need to do some thinking on the best way of changing the state
    once it becomes irrelevant to any specific instance.


    Based on this, it''s recommended to use only flyweight if you absolutely must
    support systems where the performance of your code would very noticeably decrease
    otherwise.


    #### Why you would want to use Flyweight


    - Squeezing way more information into memory than would have been able to otherwise.


    ### Prototype


    Prototype, which we have already covered in chapter 7, can also help to solve
    this problem. However, unlike Object Pool, it will not give you any performance
    benefits.


    What Prototype will give you in this situation is the ability to create many similar
    objects without having to go through a complex process of defining their field
    values each time.


    For example, you may have a service that communicates with several instances of
    the same microservice and each of these instances is presented by an object in
    the code. Let''s say that all microservices are accessed by the same IP address,
    but a different port. And the rest of the connection parameters are also identical.


    In this case, your configuration file may contain all shared connection parameters.
    And you will only have to go through the configuration to create the prototype
    object. After that, to create any new connection objects, all''ll have to clone
    the existing one and change the port number accordingly.


    To gain performance benefits, Prototype can be combined with Object Pool. Prototype
    is especially useful when the objects in the Object Pool are complex.

