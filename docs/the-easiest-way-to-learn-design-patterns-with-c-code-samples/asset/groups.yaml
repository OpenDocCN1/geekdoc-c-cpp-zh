    This experience was what inspired me to write this book. My mission is to help
    as many people as possible with the process of learning design patterns. But I
    don''t want them to brute-force their way through them, like I once did. I wanted
    to make the process of learning them as smooth as possible for the reader.


    I''m doing it by providing sufficient content before showing the implementation
