    # When NotImplementedException is appropriate


    In C#, NotImplementedException is an error type that is specifically designed
    to be thrown from the members that implement the interface, but aren''t intended
    to be used. And it comes directly from the core system library of C#.


    At the first glance, it may seem that with this feature in place, the language
    was designed to violate interface segregation principle. However, there are situations
    where leaving unused interface methods in your class would be appropriate without
    necessarily violating this principle.


    One situation where throwing NotImplementedException will be appropriate if your
    class is a work in progress and this has been put there temporarily. You may decide
    all the essential members for your class ahead of time and create the interface
    immediately, before you forget what you intended to do.


    However, creating the class may take a relatively long time and may not be able
    to do it all in one. Despite this, you will already have to implement every interface
    member. Otherwise your code would not compile. And Gradually, you will populate
    every member with some valid logic.


    This is precisely how Visual Studio populates all auto-generated members with
    NotImplementedException if you want to auto-implement the interface. Clicking
    the action button will ensure that your code will compile immediately, while you
    can populate all the members with whatever logic you want at your own convenience.'
  - '[PAGE 72]


    # 4. Interface segregation principle


    And, because every interface member is intended to eventually be implemented and
    is absolutely required for the finished product, this will not violate interface
    segregation principle.


    The other case is when you want to write an interface implementation to enable
    easy testing of your code. You may have an original class that is intended to
    be placed in production. This class may have various pieces of logic that you
    will not be able to replicate on a development machine. For example, it may be
    sending requests to a certain server or reading messages from a certain queue.
    And in that class, every method and property is absolutely required to be there.


    However, there may be some pieces of functionality in the class that you would
    be to run anywhere. So, you may have a version of the class that only contains
    those components, which will allow you to easily run tests on any machine.


    And this is where NotImplementedException serves its purpose. In this context,
    it is there to notify the developer that, although this method or property is
    an absolutely essential member of the class under normal circumstances, it is
    not relevant in this specific context.


    The alternative would be to mock those methods up. But doing so would give them
    logic that is completely different from how the production class behaves. Therefore,
    the behavior you will see in your tests will not be representative of the actual
    behavior of the deployed software and the tests may be pointless. The methods
    that are testable, however, will behave exactly as they would in production.'
