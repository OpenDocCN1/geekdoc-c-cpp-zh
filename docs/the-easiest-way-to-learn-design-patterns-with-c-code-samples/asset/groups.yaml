    internal abstract class GunDecorator : IGun {\n    private IGun? gun;\n\n    public\
    \ void SetGun(IGun gun) {\n        this.gun = gun;\n    }\n\n    public virtual\
    \ void Reload() {\n        if (gun is not null) {\n            gun.Reload();\n\
    \        }\n    }\n\n    public virtual bool Shoot() {\n        if (gun is not\
