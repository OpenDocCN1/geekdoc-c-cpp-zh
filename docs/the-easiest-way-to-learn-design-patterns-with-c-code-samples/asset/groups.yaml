    \ of the patterns. And then you will be provided with an example of its implementation.\n\
    \nAll code samples are provided in C#. We use the .NET 6 template style.\n\nNone\
    \ of the code is copyrighted, so please feel free to use it and modify it as you\
    \ please.\n\n## 23. Design pattern categories\n\nThe classic design patterns can\
    \ be split into three distinct categories: **Creational, Structural, and Behavioral.**\
    \ And the design patterns in each category do exactly what the name of the category\
    \ suggests.\n\nCreational design patterns define the ways of creating objects.\
    \ The following patterns belong in this category:\n\n- Factory Method\n- Abstract\
    \ Factory\n- Builder\n- Prototype\n- Singleton\n\nStructural design patterns prescribe\
    \ how to structure your objects. These are the patterns that belong in this category:\n\
    \n- Adapter\n- Bridge\n- Composite\n- Decorator\n- Facade\n- Flyweight\n- Proxy\n\
    \nBehavioral design patterns tell us how objects are supposed to behave. This\
    \ category consists of the following patterns:\n\n- Chain of Responsibility\n\
    - Command\n- Iterator\n- Mediator\n- Memento\n- Observer\n- State\n- Strategy\n\
    - Template Method\n\nThis section of the book is split into sub-sections. Each\
    \ of these covers a specific category of design patterns.\n\n## Creational design\
    \ patterns\n\nCreational design patterns tell us how objects should be created\
    \ in particular situations. This section covers the following patterns:\n\n- Factory\
    \ Method\n- Abstract Factory\n- Builder\n- Prototype\n- Singleton\n\n## 24. Factory\
    \ Method\n\nFactory Method is used for creating a concrete implementation of a\
    \ particular abstract type or an interface. This design pattern is applied when\
    \ a concrete implementation of an object needs to be chosen conditionally.\n\n\
    Factory Method can be summarized as follows:\n\n- There is an interface or an\
    \ abstract class with multiple concrete implementations. It represent an object\
    \ that needs to be created (let's call it Target Object).\n- There is an abstract\
    \ object (or an interface), known as a Creator, or a Factory that returns an abstract\
    \ version of Target Object.\n- There is a concrete implementation of the Factory\
    \ per each concrete implementation of the Target Object.\n- When we need to return\
    \ a specific implementation of the Target Object, we initialize a specific implementation\
    \ of the Factory and call the creation method on it.\n\nWe will now go through\
    \ an example implementation of Factory Method. The complete solution can be found\
    \ via the link below:\n\nhttps://github.com/fiodarsazanavets/design-patterns-in-csharp/tree/main/Creational_Patterns/Factory_Method\n\
    \n### Prerequisites\n\nIn order to be able to implement the code samples below,\
    \ you need the following installed on your machine:\n\n24. Factory Method 142\n\
    \n- .NET 6 SDK (or newer)\n- A suitable IDE or a code editor (Visual Studio, Visual\
    \ Studio Code, JetBrains Rider)\n\n## Factory Method implementation example\n\n\
    In our example, we will be building an application capable of playing audio on\
    \ either Windows or Linux platforms. However, these two operating systems have\
    \ completely different APIs; therefore they require different code. But our application\
    \ needs to be able to work on either of them.\n\nTo enable this, we need two distinct\
    \ implementations of audio functionality. We need a separate implementation for\
    \ Windows and a separate one for Linux. And this is a scenario that Factory Method\
    \ is perfect for.\n\nFor the demonstration purposes, we will create a console\
    \ project. Inside this project, we will add Player.cs file with the following\
    \ content:\n\n```assembly\nnamespace Factory_Method_Demo;\ninternal abstract class\
    \ Player\n{\n    public abstract Task Play(string fileName);\n}\n```\n\nThis will\
    \ be the abstract Target Object.\nThen, we will create an abstract Factory object.\
    \ To do so, we will add PlayerCreator.cs file with the following content:\n\n\
    ## 24. Factory Method\n\n```\nnamespace Factory_Method_Demo;\ninternal abstract\
    \ class PlayerCreator\n{\n    public abstract Player CreatePlayer();\n}\n```\n\
    \nAs you can see, we have the CreatePlayer method, which will return an implementation\
    \ of Player, the abstract class we've created.\n\nLet's add concrete implementations.\
    \ We will first add Linux-specific implementation of Player. To do so, we will\
    \ create LinuxPlayer.cs and populate it with the following:\n\n```cs\nusing System.Diagnostics;\n\
    namespace Factory_Method_Demo;\ninternal class LinuxPlayer : Player\n{\n    public\
    \ override Task Play(string fileName)\n    {\n        StartProcess(\"$mpg23 -q\
    \ '{fileName}'\");\n        return Task.CompletedTask;\n    }\n    private void\
    \ StartProcess(string command)\n    {\n        var escapedArgs = command.Replace(\"\
    \\\\\", \"\\\\\\\\\");\n        var process = new Process()\n        {\n     \
    \       StartInfo = new ProcessStartInfo\n```\n\n## 24. Factory Method\n\nThen,\
    \ we will add a Windows-specific implementation of Player. \nWe will call the\
    \ file WindowsPlayer.cs and add the following content to it:\n\n```cs\nusing System.Runtime.InteropServices;\n\
    using System.Text;\n\nnamespace Factory_Method_Demo;\ninternal class WindowsPlayer\
    \ : Player\n{\n    [DllImport(\"winmm.dll\")]\n    private static extern int mciSendString(string\
    \ command, StringBuilder stringReturn, int returnLength, IntPtr hWnd, StringCallback\
    \ Callback);\n\n    public override Task Play(string fileName)\n    {\n      \
    \  var sb = new StringBuilder();\n        var result = mciSendString(\"$Play {fileName}\"\
    , sb, 1024 * 1024, IntPtr.Zero);\n        Console.WriteLine(result);\n    }\n\
    }\n```\n\nAs you can see, these two audio player implementations are completely\
    \ different. Because they implement the same abstract class, we will be able to\
    \ apply any implementation that we need. To do so, we will need to create a concrete\
    \ Factory implementation per each of these types. We will first add LinuxPlayer\
    \ file with the following content:\n\n```cs\nnamespace Factory_Method_Demo;\n\
    internal class LinuxPlayerCreator : PlayerCreator\n{\n    public override Player\
    \ CreatePlayer()\n    {\n        return new LinuxPlayer();\n    }\n}\n```\n\n\
    Then, we will add WindowsPlayerCreator.cs file with the following content:\n\n\
    ```cs\nnamespace Factory_Method_Demo;\ninternal class WindowsPlayerCreator : PlayerCreator\n\
    {\n    public override Player CreatePlayer()\n    {\n        return new WindowsPlayer();\n\
    \    }\n}\n```\n"
  mdcn: "\n\n# 不同类型的多个对象实例需要相互通信\n\n- 中间者模式 (Mediator) - 当不同对象之间的通信逻辑预计不会改变时，更容易实现。\n\
