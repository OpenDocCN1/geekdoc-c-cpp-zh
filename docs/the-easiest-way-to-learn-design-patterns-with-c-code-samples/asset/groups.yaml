  mdcn: "\n了解每种方法的优缺点，以评估哪一个更适合你的特定情况。只有这样，你才需要知道如何实现它。而这正是本书大部分内容提供的帮助。\n\n因此，请将本书的这一部分作为学习指南和参考源。\n\
    \n# 6. 预先不知道需要的对象实现\n\n假设你有一段使用特定对象类型的代码。使用该对象的代码只需要知道对象可访问方法和属性的签名。它并不关心实现细节。因此，使用一个表示对象的接口而不是实际对象的具体实现是理想的。\n\
    \n如果你预先知道应用程序将要使用的具体实现，你可以简单地应用依赖倒置原则并结合一些简单的依赖注入。在这种情况下，你将知道在整个工作代码中始终使用的是接口的某个特定实现，你只需要在单元测试时将其替换为\
    \  的对象（mocked objects）即可。但如果接口的具体实现需要根据运行时条件动态选择呢？或者如果对象的形状需要根据对象将使用的实际位置的输入参数来定义呢？在上述两种情况下，依赖注入方法都不起作用。\n\
    \n让我们来看一个例子。假设你正在构建一个可以播放音频的应用程序。该程序应该能够在 Windows 和 Linux 上运行。在程序内部，你有一个名为 IPlayer\
    \ 的接口，它拥有音频播放器具备的标准方法，如 Play（播放）、Pause（暂停）和 Stop（停止）。实际上与操作系统交互并播放音频的是该接口的实现。\n\
    \n问题是 Windows 和 Linux 具有完全不同的音频架构；因此，你不能仅仅有一个可以在两个操作系统上运行的 IPlayer 接口的具体实现。而且你预先不知道应用程序将在哪个操作系统上运行。\n\
    \n## 适当的设计模式\n\n### 工厂方法 (Factory Method)\n\n工厂方法是一种实现特定接口的对象类型。这种方法属于创建者（Creator）对象，该对象负责管理要返回对象的生命周期。\n\
    \n通常，你会有创建对象的多个变体，每个变体都返回你想要的对象的特定实现。你会根据特定条件实例化创建对象的特定变体，然后调用工厂方法来获取实际对象的实现。\n\
    \n在我们上面的示例中，你将有一个版本的创建者对象返回 Windows 版本的 IPlayer，另一个版本返回其 Linux 实现。创建者对象还将负责初始化你的\
    \ IPlayer 实现所需的所有依赖。应用程序中的某些代码块将检查运行在什么操作系统上，并初始化相应的创建对象版本。\n\n## 为什么你想使用工厂方法\n\
    \n如果可以直接初始化任何对象，为什么还要费心使用工厂方法呢？原因如下：\n\n- 良好地单一责任原则。创建者对象仅负责创建终端对象的某种特定实现类型，而不负责其他任何事情。\n\
    - 该模式的规定使得易于扩展输出对象的功能，且不违反开闭原则。\n- 易于编写单元测试，因为创建逻辑将与条件逻辑分离开。\n\n### 抽象工厂 (Abstract\
    \ Factory)\n\n抽象工厂是设计模式中的一种，它在创建者对象内部使用多个工厂方法，因此你可以根据特定条件创建整系列相关对象，而不仅仅是一个对象。\n\
    \n让我们稍微修改一下上面的示例。假设我们的应用需要能够播放音频或视频，因此你需要实现两个独立的接口 - IAudioPlayer 和 IVideoPlayer。同样，它们必须在\
    \ Linux 或 Windows 上都能运行。\n\n在这种情况下，你的抽象工厂将有一个独立的方法来返回 IAudioPlayer 的实现，以及另一个独立的方法来返回\
    \ IVideoPlayer 的实现。你有一个专门针对 Windows 的工厂版本和另一个专门针对 Linux 的版本。\n\n之所以被称为抽象工厂，因为它要么实现了一个接口，要么扩展了一个抽象类。然后，取决于工厂的具体实现来创建与特定条件均相关的输出对象的具体实现。\n\
    \n 构建器 (Builder)\n\n构建器模式与工厂方法类似，但它不是一次性返回对象的具体实现，而是逐步构建对象。\n\n让我们回到那个播放音频的与操作系统相关的应用程序。在工厂方法的示例中，我们为每个操作系统都有一个\
    \ IPlayer 接口的具体实现。然而，如果我们想使用构建器而不是工厂方法，我们将有一个作为外壳对象的接口具体实现。我们称其为 Player。在所有情况下生产的都是这种类型，但具体的参数和依赖将根据它运行的操作系统类型注入到其中。\n\
    \n例如，Linux 和 Windows 都允许你通过命令行播放音频并操纵音量。在 Linux 上，是 Bash 终端；在 Windows 上，将是 cmd\
    \ 或 PowerShell。\n\n原理是相似的。在两种情况下，你都在输入命令。但具体的命令将完全不同。此外，可能还有单独的命令用于播放音频文件和操纵音量。\n\
    \n因此，在这种情况下，我们的 Player 类将简单将音频播放委托给通过命令行界面访问的操作系统组件。仅仅是实际命令会不同。这就是构建器模式发挥作用的地方。\n\
    \n构建器由两个主要部分组成：构建器（Builder）和导演（Director）。构建器是一个返回特定对象的类。但它也有许多修改该对象的方法。导演是一个接受构建器的类，用一组特定的参数调用其上的方法，并让构建器返回完成的对象。\n\
    \n所以，在我们的案例中，假设我们的 Player 对象的构建器类（我们将命名为 PlayerBuilder）具有以下方法：SetPlaybackInterface（接受播放接口实例）、SetVolumeInterface（接受音量接口实例）以及\
    \ BuildPlayer（不接受任何参数）。当我们实例化构建器类时，我们在内部实例化 Player 类的私有实例。然后，通过执行 SetPlaybackInterface\
    \ SetVolumeInterface 方法，动态地为实例添加所需的依赖。最后，通过执行 BuildPlayer 方法，我们返回一个完整的 Player\
    \ 对象实例。\n\n在这种情况下，我们的导演类将有两个方法，都接受 PlayerBuilder 作为参数：BuildWindowsPlayer 和 BuildlinuxPlayer。这两个方法将按相同的顺序调用\
    \ PlayerBuilder 类的所有方法，并返回 Player 类的实例。但在第一种情况下，调用的是 Windows 特定的命令行界面抽象；Linux\
    \ 特定的抽象将被注入到 Player 实例中。\n\n然而，与抽象工厂或工厂方法不同，构建器不仅用于构建实现细节仅在运行时才知道的对象。它还用于逐渐构建复杂对象。\n\
    \n例如，.NET 在其核心 System 库中内置了 StringBuilder 类。该类用于从多个字符串构建字符串，这样你就不必在同一个变量中不断替换不可变字符串。\n\
    \n## 为什么你想使用构建器\n\n- 良好地单一责任原则。每个构建器方法都有其特定的角色，且导演类对每个条件都有对应的方法。\n- 易于编写单元测试。这通过单一责任原则得以实现。\n\
    - 如果某些实现细节在不同情况下可能会变化，则不需要拥有该类的多个版本。\n\n由于对象可以逐步构建，因此它是最好的设计。\n\n"
