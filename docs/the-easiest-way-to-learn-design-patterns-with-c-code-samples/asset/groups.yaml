- md: '

    ## 12. Accessing complex back-end logic from the presentation layer


    Imagine that you are dealing with a whole range of complex classes, all of which
    you would need to access from a single layer of your application. It could be,
    for example, code that has been auto-generated from a WSDL definition. Or it could
    be some manually written code, where different classes retrieve data from different
    data sources.


    Because you will need to access all of these classes from the same layer within
    your application, using these classes directly would probably not be the most
    optimal thing to do. You would need to refer to all of these classes from the
    other system components that need to access them.


    This is especially problematic with auto-generated classes, as you won''t be able
    to easily create abstractions for them. So, you will either have to manually edit
    auto-generated code (which isn''t a good idea), or pass the concrete classes into
    the components that need them (which is also a bad idea and a clear violation
    of dependency inversion principle).


    The problem will become even more apparent if those complex classes are meant
    to be updated fairly frequently. In this case, you will have to keep updating
    all the references to them.


    Another problem associated with complex logic are operations that are expensive
    to run. But what if you need to access the results of such operations frequently?
    Well, luckily, there are design patterns that can help you solve this problem.


    ## Suitable design patterns


    ### Facade


    Facade is a class that controls access to a set of complex objects and makes it
    simple. Most often, just like an Adapter, it would change the access interface
    into these classes. However, unlike Adapter, it will usually be a wrapper around
    several of such classes. Or it may be responsible for a diverse set of interactions
    between a number of moving system parts rather than just converting one type of
    a call to another type.


    Direct interaction with those complex classes is happening only inside the Facade
    class, so the other system components are completely shielded away from it. All
    that the client class will be concerned about calling the specific methods on
    the Facade. Client doesn''t care how Facade delivers what it needs. It only cares
    that Facade does the job that is expected of it.


    And when any of the above-mentioned components needs to be updated, the update
    in the logic will only need to happen inside the Facade, which will prevent the
    other parts of the system from having bugs unintentionally introduced into them
    by forgetting to update the logic.


    ### Why would you use Facade


    - A convenient way of simplifying access to a complex subset of the system.

    - All other application components are shielded away from having to interact with
    a complex logic.

    - Since all the code that interacts with a complex subsystem is located in one
    place, it’s easier not to miss updates to the logic if any of the subsystem components
    get updated.


    ### Proxy


    Proxy is not suitable for wrapping a complex logic into a simple accessible interface,
    but it''s still suitable for dealing with subsystem components that are not easy
    to work with directly.


    For example, you may be in a situation where you would only need data from a particular
    service on rare occasions. If this data takes a long time to obtain and it rarely
    changes, a proxy can be used to access this data and store it in memory until
    it changes.


    Or you may have a situation where you would need to restrict access to a particular
    service based either on a specific outcome of business logic or the rules that
    the user is assigned to. In this case, the proxy would conduct this check before
    the actual service is accessed.


    So, essentially, proxy is nothing other than a wrapper around a class that has
    the same access interface as the original class, so both classes are interchangeable.
    Proxy class is there to restrict access to the original class. It can also be
    used to implement any pre-processing of the request if it''s needed before the
    original class can be accessed. Proxy can implement additional access rules that
    cannot be added to the original class directly.


    ### Why would you use Proxy


    - You can abstract away all complex implementation details of accessing a particular
    class.

    - You can apply additional request validation before you access a particular class.

    - You can get it to only access the actual class when it''s necessary, which would
    positively affect the performance.


    ## 13. User interface and business logic are developed separately


    You have two separate teams working on the application. One team consists of front-end
    specialists, who are capable of making a really beautiful user interface. The
    other team isn''t as good at building user interfaces, but it''s really good at
    writing business logic.


    Also, what you intend to do is make the user interface compatible with several
    different types of back-end. Perhaps, the user interface is built by using a technology
    that can run on any operating system, such as Electron, while there are different
    versions of back-end components available for different operating systems.


    ## Suitable design patterns


    ### Bridge


    Bridge is the design pattern that was developed specifically to solve this problem.
    It is a way of developing two parts of an application independently of each other.


    When bridge is used, the UI part of the application is known as interface, while
    the back-end business logic part of the application is known as implementation.
    This is not to be confused with interface and implementation as object oriented
    programming concepts. In this case, both the user interface and the back end would
    have various interfaces and concrete classes that implement them. So, what is
    known as interface doesn''t only consist of interfaces and what is known as implementation
    doesn''t exclusively consist of concrete classes.


    Usually, bridge is designed up-front and developers agree to communicate with
    one another. After that, both of these components can be developed independently.
    One team will focus on business logic, while another team will focus on usability.
    With this design, as long as the access points of the implementation are what
    the interface expect to be, any implementation can be swapped. Using different
    implementations for different operating systems or data technologies is one of
    the examples. However, you can also develop a very simple implementation with
    faked data for the sole purpose of testing the user interface.


    ### Why would you use Bridge


    - You can develop user interface and business logic independently.

    - You can easily plug the user interface into different back-ends with the same
    access signatures.

    - Those who are working on the user interface don''t have to know the implementation
    details of the business logic.

    - Open-closed principle is enforced.

    - Single responsibility principle is well implemented.


    ### Facade


    Facade, which we had a look at chapter 12, can be used in certain circumstances,
    although it''s often less suitable than Bridge. For example, imagine that you
    have to access the back-end of the app via WSDL, which would have some auto-generated
    code associated with it. This is where a Facade class would be helpful, as it
    will abstract away complex implementation details of this communication mechanism.


    This is applicable to scenarios where the business logic layer is hosted by a
    third party. But likewise, if for whatever reason the business logic and the UI
    applications cannot be designed up front, it might also be a suitable scenario
    to use Facade. This is especially true when the back-end business logic application
    has a complex access API.


    But if you don''t have to deal with the complex contracts between front-end and
    back-end components, then facade is not the most useful design pattern to solve
    this specific problem.


    ### Why would you use Facade instead of Bridge


    - Easier to implement when the service with the business logic is hosted by a
    third party.

    - Easier to implement when the interface and the implementation cannot be designed
    up front.


    ### Proxy


    Proxy design pattern that we had a look at chapter 12 is useful if your application
    is relatively simple. Essentially, you may have some back-end classes and their
    simplified representations that the UI components interact with. In this case,
    you may have interchangeable implementations of back-end classes that the same
    proxies can deal with.


    As Proxy delivers results without necessarily relying on the object it is providing
    an abstraction for, it’s especially useful in situations where the back-end service
    with the business logic is expected to be modified and re-deployed frequently.
    This way, the UI would still be fully operational even when the back-end is being
    re-deployed.

