    Figure 34.1 - Using flyweight objects to build an army


    This code demonstrates obvious benefits of using Flyweight design pattern. Even
    though we are storing many objects representing soldiers in the memory, we are
    only reserving a small amount of memory for each soldier. This is because each
    of the items representing a soldier refers to one of three instances of a Flyweight
    object that represents a bulk of its functionality. And because we have a parametrized
    Eliminate method on our Flyweight object, we can still perform some behavior that
    is specific to an individual soldier.


    # Benefits of using Flyweight


    So, the core benefits of using Flyweight design pattern are as follows:


    +   * It allows you to use memory very efficiently by sharing large chunks of
    the state between objects.

    * It allows you to still perform functionality that is specific to a particular
    item instance.


    To use Flyweight effectively, one needs to be aware of the caveats. And this is
    what we will have a look at next.'
  - '[PAGE 241]


    # Caveats of using Flyweight


    Perhaps the main caveat of using Flyweight is that it can make the code complicated
    and difficult to read. Therefore sometimes there needs to be a trade-off between
    code maintainability and the efficient use of RAM.


    Another disadvantage of using flyweight is that, although it will save your memory,
    it might actually increase the CPU usage. Imagine many objects making a parametrized
    call to a specific instance of a Flyweight object. Even if this instance is shared
    between many objects, your CPU would still be doing a lot of work in this situation.'
  - '[PAGE 242]


    # 35. Proxy


    Proxy design pattern allows you to cache the results of computationally expensive
    operations. With this design pattern, you don''t have to run such an operation
    every single time you need the results. On subsequent requests, the results are
    simply retrieved from the cache.


    It’s analogous to how the cache in a browser works. When you visit a web page
    for the first time, the browser will retrieve it from the server. But it will
    then store a copy of this page in its cache. So when you visit the page next time,
    it will be retrieved from the local cache. In this situation, the browser is acting
    as a proxy for the server.


    Proxy can be summarized as follows:


    +   * There is a Main Service object that is computationally expensive to run.

    * There is a Proxy object that implements exactly the same interface as the Main
    Service.

    * All requests to the Main Service are performed via the Proxy

    * Proxy only runs the expensive operation on the Main Service when it needs to
    and then it caches the results.

    * Under any other circumstances, Proxy returns the results from its cache without
    contacting the Main Service.


    We will now go through an example implementation of Proxy. The complete solution
    can be found via the link below:


    https://github.com/fiodarsazanavets/design-patterns-insharp/tree/main/Structural_Patterns/Proxy'
- md: "\n## Prerequisites\n\nIn order to be able to implement the code samples below,\
    \ you need the following installed on your machine:\n\n- .NET 6 SDK (or newer)\n\
    - A suitable IDE or a code editor (Visual Studio, Visual Studio Code, JetBrains\
    \ Rider)\n\n## Proxy implementation example\n\nLet’s imagine that we have some\
    \ back-end service that we can retrieve data from and submit new data to. But\
    \ retrieving the data happens to be a long and computationally expensive process.\
    \ And this is what we will simulate to demonstrate how the Proxy design pattern\
    \ can be applied to solve such a problem.\n\nWe will create a new .NET console\
    \ application and we will add IDataService interface to it, which will look as\
    \ follows:\n\n```csharp\nnamespace Proxy_Demo;\ninternal interface IDataService\n\
    {\n    Task<List<string>> GetData();\n    void InsertData(string item);\n}\n```\n\
    \nThen we will add an implementation of this interface that represents our Main\
    \ Service. It will be represented by DataService class with the following content:\n\
    \n```csharp\nnamespace Proxy_Demo;\n\ninternal class DataService : IDataService\n\
    {\n    private readonly List<string> data;\n\n    public DataService()\n    {\n\
    \        data = new();\n    }\n\n    public async Task<List<string>> GetData()\n\
    \    {\n        // Simulate long-running process\n        await Task.Delay(3000);\n\
    \        return data;\n    }\n\n    public void InsertData(string item)\n    {\n\
    \        data.Add(item);\n    }\n}\n```\n\nSo, we are simulating a long-running\
    \ data retrieval process by adding a three second delay to the GetData method.\n\
    \nNext, we will add a Proxy implementation of the same interface. The class will\
    \ be called DataServiceProxy and it will look as follows:\n\nThis proxy acts as\
    \ a middleware between the actual service implementation and the caller. It maintains\
    \ its own cache, which is instantiated as null and gets reset to null every time\
    \ data is inserted via the Main Service. But once it has retrieved the Main Service,\
    \ the proxy propagates its own cache with it. And while the cache has any items\
    \ in, any subsequent call to GetData method will use the cache and wont't call\
    \ the Main Service.\n\nTo make the benefits of using Proxy pattern design obvious,\
    \ we can replace the content of the Program.cs file with the following:\n\nIn\
    \ here, we are initially inserting three items via the Proxy. Then, we retrieve\
    \ this twice, comparing the time it took for the data to be retrieved.\n\nAs the\
    \ following screenshot demonstrates, the data took three seconds to arrive on\
    \ the first run. But its retrieval was almost instant on the second run. And this\
    \ is because, on the first run, the Proxy ran an expensive operation on the Main\
    \ Service, while on the second run it used its own cache.\n\n```\n22/02/2022 08:56:48\
    \ - Started data query.\n22/02/2022 08:56:51 - Data has been retrieved.\nItems\
    \ retrieved: 3\n22/02/2022 08:56:51 - Started data query.\n22/02/2022 08:56:51\
    \ - Data has been retrieved.\nItems retrieved: 3\n```\n\nFigure 35.1 - Performance\
    \ improvements by using Proxy\n\nAnd this concludes the overview of Proxy design\
    \ pattern. Let's summarize its main benefits.\n\n## Benefits of using Proxy\n\n\
    The benefits of using Proxy can be summarized as follows:\n\n- This design pattern\
    \ allows you not to run expensive operations every time you need to obtain the\
    \ results of these operations.\n- Because the Proxy object uses the same interface\
    \ as the Main Service, Proxy object can be used in any place in the code where\
    \ the Main Service is normally used.\n\nBut, as any design patterns, there are\
    \ still some caveats to be aware of while making a decision on whether or not\
    \ to use Proxy.\n\n## Caveats of using Proxy\n\nWhile using Proxy, you have to\
    \ strike a good balance between performance and accuracy. You need to put some\
    \ logic in place to make sure your cache is not refreshed too often. But at the\
    \ same time, you need to ensure the cache is reasonably accurate. If the cache\
    \ refreshes too often, you may lose the benefits of using Proxy. If it doesn't\
    \ refresh enough, it may become outdated quickly. So, when making design decisions,\
    \ you need to consider this trade-off.\n\nOther than that, using the Proxy design\
    \ pattern will make your code more complicated. And if you are dealing with complex\
    \ logic, this may make your code harder to read and maintain. So the tradeoff\
    \ between the performance and readability might be another point to consider while\
    \ using Proxy.\n\n## Behavioral design patterns\n\nBehavioral design patterns\
    \ tell us how objects are supposed to behave. This section covers the following\
    \ patterns:\n\n- Chain of Responsibility\n- Command\n- Iterator\n- Mediator\n\
    - Memento\n- Observer\n- State\n- Strategy\n- Template Method\n\n## 37. Command\n\
    \nCommand is a design pattern that isolates an operation in its own object. This\
    \ makes such operation reusable, so you don’t have to construct a brand new logic\
    \ every time you need to perform an operation.\n\nThe most popular way of using\
    \ Command is in database operations. A Command object will contain all necessary\
    \ information to perform some action that would modify the data (insertion, update,\
    \ deletion, etc.). Then, if you need to perform such an operation on a particular\
    \ table, Command can be summarized as follows:\n\n- There is a Command interface\
    \ that describes the behavior each command should have.\n- If multiple commands\
    \ are needed, it makes sense to add Command abstract class with shared functionality.\n\
    - Each Concrete Command accepts parameters in its constructor and implements the\
    \ method that executes.\n- Optionally, there could be Invoker object, the role\
    \ of which is to decide which commands to execute.\n\nWe will go through an example\
    \ of Command. The complete solution can be found via the link below:\n\nhttps://github.com/fiodarsazanets/design-patterns-in-sharp/tree/Behavioral_Patterns/Command\n\
    \n## Prerequisites\n\nIn order to be able to implement the code samples below,\
    \ you need the following installed on your machine:\n\n- .NET 6 SDK (or newer)\n\
    - A suitable IDE or a code editor (Visual Studio, Visual Studio Code, JetBrains\
    \ Rider)\n\n## Command implementation example\n\nAs in all other examples, we\
    \ will create a console application project. And the first thing we will do in\
    \ this project is the interface for our Command object, which will be as follows:\n\
    \n```csharp\nnamespace Command_Demo;\n\ninternal interface ICommand\n{\n    void\
    \ Execute();\n}\n```\n\nAs you can see, the only method we have is Execute. In\
    \ our example, it's blocking void. But it could be an asynchronous Task where\
    \ appropriate. Command is meant to execute something rather than return data.\
    \ This is why there is no return value in our example.\n\nNext, we will add DataReceiver.cs\
    \ file with the following content:\n\n```csharp\nnamespace Command_Demo;\n\ninternal\
    \ class DataReceiver\n{\n    private readonly Dictionary<string, string> data;\n\
    \n    public DataReceiver()\n    {\n        data = new Dictionary<string, string>();\n\
    \    }\n\n    public void Upsert(string key, string value)\n    {\n        data[key]\
    \ = value;\n        Console.WriteLine($\"Upserted: {key} - {value}\");\n    }\n\
    \n    public void Delete(string key)\n    {\n        if (data.ContainsKey(key))\n\
    \        {\n            data.Remove(key);\n            Console.WriteLine($\"Removed:\
    \ {key}\");\n        }\n    }\n}\n```\n\nThis file mimics a database access access\
    \ layer. You can imagine that, instead of dealing with in-memory Dictionary, you\
    \ are working with a database table.\n\nNext, we will add the following abstract\
    \ class. We will need this, because all of our commands will depend on DataReceiver\
    \ we've created earlier. So we put it into the constructor.\n"
  mdcn: "\n\n## 前提条件\n\n为了能够下面的代码示例，你需要在机器上安装以下内容：\n\n- .NET 6 SDK（或更高版本）\n- 合适的 IDE\
    \ 或代码编辑器（Visual Studio, Visual Studio Code, JetBrains Rider）\n\n## 代理实现示例\n\n\
    让我们假设有一个后端服务，我们可以从从中获取数据并向其提交新数据。但获取数据的过程是一个耗时且计算密集型的过程。我们将通过模拟这一过程来演示代理（Proxy）设计模式如何解决此类问题。\n\
    \n我们将创建一个新的 .NET 控制台应用程序并向其中添加 `IDataService` 接口，如下所示：\n\n```csharp\nnamespace\
    \ Proxy_Demo;\ninternal interface IDataService\n{\n    Task<List<string>> GetData();\n\
    \    void InsertData(string item);\n}\n```\n\n然后，我们将添加该接口的实现，代表我们的主服务（Main Service）。它将由\
    \ `DataService` 类表示，内容如下：\n\n```csharp\nnamespace Proxy_Demo;\n\ninternal class\
    \ DataService : IDataService\n{\n    private readonly List<string> data;\n\n \
    \   public DataService()\n    {\n        data = new();\n    }\n\n    public async\
    \ Task<List<string>> GetData()\n    {\n        // 模拟耗时过程\n        await Task.Delay(3000);\n\
    \        return data;\n    }\n\n    public void InsertData(string item)\n    {\n\
    \        data.Add(item);\n    }\n}\n```\n\n因此，我们通过向 `GetData` 方法添加三秒延迟来模拟一个耗时的数据检索过程。\n\
    \n接下来，我们将添加相同接口的代理实现。该类将命名为 `DataServiceProxy`，如下所示：\n\n此代理充当实际服务实现与调用者之间的中间件。它维护自己的缓存，该缓存初始化为\
    \ `null`，并且每当通过主服务插入数据时，它会被重置为 `null`。但一旦获取了主服务，代理就会将其自己的缓存一起传播。只要缓存中有任何项，任何对\
    \ `GetData` 方法的后续调用都将使用缓存而不会调用主服务。\n\n为了使使用代理模式的优势显而易见，我们可以将 `Program.cs` 文件内容替换为以下内容：\n\
    \n在这里，我们最初通过代理插入了三个项目。然后我们检索了两次，比较获取数据所需的时间。\n\n正如下面的截图所示，数据在第一次运行时需要三秒钟到达。但在第二次运行中，它的检索几乎是瞬时的。这是因为在第一次运行中，代理在主服务上执行了一个昂贵的操作，而在第二次运行中它使用了自己的缓存。\n\
    \n```\n22/02/2022 08:56:48 - Started data query.\n22/02/2022 08:56:51 - Data has\
    \ been retrieved.\nItems retrieved: 3\n22/02/2022 08:56:51 - Started data query.\n\
    22/02/2022 08:56:51 - Data has been retrieved.\nItems retrieved: 3\n```\n\n图 35.1\
    \ - 使用代理带来的性能提升\n\n代理设计模式的概述此结束。让我们总结一下它的主要优势。\n\n## 使用代理的优势\n\n使用代理的优势可以总结如下：\n\
    \n- 此设计模式允许你不需要每次需要获取这些操作的结果时都运行昂贵的操作。\n- 因为代理对象使用与主服务相同的接口，因此代理对象可以用于代码中通常使用主服务的任何地方。\n\
    \n但是，像任何设计模式一样，在决定是否使用代理时，仍然需要注意一些注意事项。\n\n## 使用代理的注意事项\n\n在使用代理时，你必须在性能和准确性之间取得良好的平衡。你需要建立一些逻辑来确保缓存不会刷新得频繁。但同时，你需要确保缓存足够准确。如果缓存刷新太频繁，你可能会丢失使用代理的优势；如果刷新得不够，它可能会迅速过期。因此，在做设计决策时，你需要考虑这种权衡。\n\
    \n此外，使用代理设计模式会使你的代码变得复杂。如果你正在处理复杂的逻辑，这可能会让代码更难以阅读和维护。因此，在使用代理时，性能和可读性之间的权衡可能是另一个考虑点。\n\
    \n## 行为设计模式\n\n行为设计模式告诉我们对象应该如何行为。本节涵盖了以下模式：\n\n- 责任链 (Chain of Responsibility)\n\
    - 命令 (Command)\n- 迭代器 (Iterator)\n- 中介者 (Mediator)\n- 备忘录 (Memento)\n- 观察者 (Observer)\n\
    - 状态 (State)\n- 策略 (Strategy)\n- 模板方法 (Template Method)\n\n## 37. 命令\n\n命令是一种将操作封装在自己的对象中的设计模式。这使得该操作是可重用的，因此你不需要每次需要执行操作时都构建一个全新的逻辑。\n\
    \n命令最常用的方式是在数据库操作中。命令对象将包含执行某些修改数据操作（插入、更新、删除等）的所有必要信息。然后，如果你需要在特定表上执行此类操作，命令可以总结如下：\n\
    \n- 有一个 `Command` 接口，描述了每个命令应该具有的行为。\n 如果 如果需要多个命令，添加一个带有共享功能的 `Command` 抽象类是有意义的。\n\
    - 每个具体命令（Concrete Command）在构造函数中接受参数并实现执行方法。\n- 可选，可以有一个调用者（Invoker）对象，其角色是决定执行哪些命令。\n\
    \n我们将通过一个命令的示例。完整的解决方案可以通过下面的链接找到：\n\nhttps://github.com/fiodarsazanets/design-patterns-in-sharp/tree/Behavioral_Patterns/Command\n\
    \n## 前提条件\n\n为了能够下面的代码示例，你需要在机器上安装以下内容：\n\n- .NET 6 SDK（或更高版本）\n- 合适的 IDE 或代码编辑器（Visual\
    \ Studio, Visual Studio Code, JetBrains Rider）\n\n## 命令实现示例\n\n与所有其他示例一样，我们将创建一个控制台应用程序项目。我们在项目中做的的第一件事是为我们的命令对象创建接口，如下：\n\
    \n```csharp\nnamespace Command_Demo;\n\ninternal interface ICommand\n{\n    void\
    \ Execute();\n}\n```\n\n如你所见，我们唯一的方法是 `Execute`。在我们的示例中，它是阻塞的 `void`。但在适当的情况下，它可以是一个异步的\
    \ `Task`。命令的目的是执行某些操作而不是返回数据。这就是为什么我们的示例中没有返回值。\n\n接下来，我们将添加包含以下内容的 `DataReceiver.cs`\
    \ 文件：\n\n```csharp\nnamespace Command_Demo;\n\ninternal class DataReceiver\n{\n\
    \    private readonly Dictionary<string, string> data;\n\n    public DataReceiver()\n\
    \    {\n        data = new Dictionary<string, string>();\n    }\n\n    public\
    \ void Upsert(string key, string value)\n    {\n        data[key] = value;\n \
    \       Console.WriteLine($\"Upserted: {key} - {value}\");\n    }\n\n    public\
    \ void Delete(string key)\n    {\n        if (data.ContainsKey(key))\n       \
    \ {\n            data.Remove(key);\n            Console.WriteLine($\"Removed:\
    \ {key}\");\n        }\n    }\n}\n```\n\n此文件模拟了一个数据库访问层。你可以想象你不是在处理内存中的 `Dictionary`，而是在与一个数据库表工作。\n\
    \n接下来，我们将添加以下抽象类。我们需要它，因为我们所有的命令都依赖于我们之前创建的 `DataReceiver`。所以我们将其放入构造函数中。\n\n"
