    # # 41. Observer


    Observer is a design pattern that facilitates communication between objects via
    publication and subscription model. When using this pattern, objects can subscribe
    to each other, so they would get notified when specific events are triggered.
    They can also unsubscribe from each other at any point.


    Observer design pattern can be summarized as follows:


    +   * **Subject or Publisher** is an object that emits some events

    * **Observer or Subscriber** is an object that can subscribe to the **Subject**,
    so it can receive notifications when a specific event occurs.

    * **Subject** exposes methods that allows **Observer** objects to subscribe to
    or unsubscribe from it.

    * **Subject** maintains internal list of all **Observer** objects that are subscribed
    to it.


    We will now go through an example implementation of Observer. The complete solution
    can be found via the link below:


    https://github.com/fiodarsazazanavets/design-patterns-in-csharp/tree/main/Behavioral_Patterns/Observer


    # # Prerequisites


    In order to be able to implement the code samples below, you need the following
    installed on your machine:


    +   * .NET 6 SDK (or newer)

    * A suitable IDE or a code editor (Visual Studio, Visual Studio Code, JetBrains
    Rider)'
