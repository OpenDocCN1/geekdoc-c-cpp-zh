    # ## Caveats of using Mediator


    The main danger with using the Mediator design pattern is that, you have to deal
    with many different Participant types, your Mediator object can easily evolve
    into a God object - the antipattern that is opposite to the single responsibility
    principle. Therefore, while using Mediator, it''s often worth applying other design
    patterns inside the Mediator object to ensure that each individual piece of logic
    is handled by its own component.'
