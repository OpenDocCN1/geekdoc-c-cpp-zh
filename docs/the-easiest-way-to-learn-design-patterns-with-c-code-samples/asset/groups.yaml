    \n## 31. 组合\n\n组合模式（Composite pattern）允许你高效地创建树形结构。这种能力在许多情况下都很有用。例如，如果你需要编写管理计算机文件系统的软件，你会希望能够创建文件夹和文件。此外，每个文件夹可能包含零或多个其他文件夹。而这使得文件系统成为组合模式旨在创建的树形结构的良好示例。\n\
