    \n# 系统由复杂的输入组合控制\n\n- 命令 (Command)\n\n# 撤销已执行操作的能力\n\n- 备忘录 (Memento) - 允许你存储状态的精确快照。\n\
    - 命令 (Command) - 允许通过执行相反的操作来撤销。\n\n22. 设计模式旨在解决的问题总结 136\n\n# 在不知道其底层结构的情况下遍历集合\n\
    \n- 迭代器 (Iterator)\n\n# 创建一组相关的算法\n\n- 模板方法 (Template Method) - 易实现，但可能违反里氏夫替换原则。\n\
