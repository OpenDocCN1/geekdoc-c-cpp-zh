    pattern. Let''s now summarize its benefits.


    # Benefits of using Template Method


    The main benefits of using Template Method are as follows:


    +   - It''s easy to define a structure for related algorithms.

    - Open-closed principle is well maintained, as the original class doesn''t have
    to change.

    - You can reuse code in related algorithms without having to write similar steps.


    And now we will have a look at the things to watch out for while using Template
    Method.


    # Caveats of using Template Method


    One thing you need to be mindful of while using Template Method is making sure
    that you don''t violate the Liskov substitution principle, as it''s an easy principle
    to accidentally violate while using this design pattern.


    Also, you need to make sure that the process inside the Template Method doesn''t
    have too many steps. Otherwise you will be violating the single responsibility
    principle and perhaps even making your code more difficult to maintain overall.'
