    Design patterns was the subject that I found quite difficult to comprehend when
    I was a mid-level developer. At that point in time, I had heard about the design
    patterns. I kind of knew that they would make code cleaner and more maintainable.
    But there was one problem. I found them to be hard to learn.


    No, there wasn''t a lack of documentation. On the contrary, there are plenty of
    books and blog posts that describe what design patterns are and provide code samples
    of their implementations. But the problem with all of this material is that the
    way design patterns are usually taught makes them really hard to understand, especially
    for those developers that have never used them before. If you are a novice and
    you examine any of the design patterns outside the context that it''s used under,
    it will probably look like the code was over-complicated without any obvious reason.
    And that''s precisely what made it so hard for me to learn the patterns. After
    all, I have been coding happily without using any of them. So I have abandoned
    my attempts to learn.


    But it all changed one day when I had a technical interview at one of the major
    IT companies in London. The company was great and the position that I was interviewing
    for was paying above the market rate. But I ended up not getting this job. And
    my lack of knowledge of the design patterns was to blame.


