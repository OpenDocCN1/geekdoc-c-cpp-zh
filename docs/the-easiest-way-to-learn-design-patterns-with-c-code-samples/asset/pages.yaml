  md: '# 8. Using many instances of an object while keeping code running smoothly


    Imagine that you have a requirement to use many similar objects in your application.
    Perhaps, you are building a distributed application based on microservices architecture
    and each of these objects represents a unique connection to one of your service
    instances. Or maybe you are interacting with multiple database entries, and for
    each one of them, you need an object that represents a database connection.


    In this situation, purely using inbuilt language features will probably be problematic.
    You will need to instantiate every single one of these objects. Once the object
    is out of scope, your runtime will need to get rid of it to free up the memory.
    Once you need a similar object again, you will instantiate it again. And so on.


    If you follow this approach, you will probably experience a performance hit. Instantiating
    a new object each time you need to use it is a relatively expensive process. The
    runtime will need to allocate memory for it and populate those chunks of memory
    with new values.


    If you are using similar objects in different parts of the application, you will
    be required to allocate sufficient memory to each instance of the object. And
    that may become quite a lot of memory if you need to use many of such instances.


    Likewise, when you are instantiating a new object, there is always'
  merge: -1
