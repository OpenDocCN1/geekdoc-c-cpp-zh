  md: '# 25. Abstract Factory


    Abstract Factory is closely related to Factory Method. In fact, it is the Factory
    class that hosts the so-called Factory Method. But as Factory Method refers to
    a specific method inside a Creator or a Factory class, Abstract Factory can have
    a number of such methods.


    Abstract Factory, along with its Factory Methods, is used for creating concrete
    implementations of abstract types or interfaces. This design pattern is applied
    when a concrete implementation of an object needs to be chosen conditionally.
    But because Abstract Factory can host multiple Factory Methods, it can be used
    to create concrete implementations of multiple related objects.


    Abstract Factory can be summarized as follows:


    +   - There are some interfaces or abstract classes, each having multiple concrete
    implementations. They represent the objects that need to be created (let them
    call Target Objects).

    - There is an abstract object (or an interface), known as a Creator, or a Factory
    that returns abstract versions of Target Objects. Each of these Target Object
    types has a creation method inside the Factory associated with it.

    - There are multiple concrete implementations of the Factory, each returning a
    specific set of the Target Object implementations.

    - When we need to return a specific set of the Target Object implementations,
    we initialize a specific implementation of the Factory and call the creation methods
    on it.


    We will now go through an example implementation of Abstract Factory. The complete
    solution can be found via the link below:


    https://github.com/fiodarsanavets/design-patterns-in-csharp/tree/main/Creational_Patterns/Abstract-Factory'
  merge: -1
