  md: '# 6. Not knowing what object implementations you''ll need ahead of time


    Imagine that you have a code that uses a particular object type. The code that
    uses this object only needs to know the signatures of accessible methods and properties
    of the object. It doesn''t care about the implementation details. Therefore, using
    an interface that represents the object rather than a concrete implementation
    of the actual object is desirable.


    If you know concrete implementation your application will be using ahead of time,
    you can simply apply dependency inversion principle along with some simple dependency
    injection. In this case, you will know that it''s always a particular implementation
    of the interface that will be used throughout your working code and you will only
    replace it with mocked objects for unit testing. But what if the concrete implementation
    of the interface needs to be chosen dynamically based on runtime conditions? Or
    what if the shape of the object needs to be defined based on input parameters
    in the actual place where the object is about to be used? In either of these cases,
    the dependency injection approach wouldn''t work.


    Let''s look at an example of this. Imagine that you are building an application
    that can play audio. The application should be able to work on both Windows and
    Linux. And inside of it, you have an interface called IPlayer that has standard
    methods that an audio player would have, such as Play, Pause and Stop. It is the
    implementation of this interface that actually interacts with the operating system
    and plays the audio.


    The problem is that Windows and Linux have completely differ-'
