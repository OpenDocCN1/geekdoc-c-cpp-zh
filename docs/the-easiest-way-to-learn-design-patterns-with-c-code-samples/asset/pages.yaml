  md: '# 39. Mediator


    Mediator is a design pattern where one object facilitates communication between
    multiple other objects. It''s analogous to air traffic control, which acts as
    a mediator between different flights. Planes can talk to the air traffic control,
    which then delivers relevant information to other planes. But planes don''t talk
    to each other directly.


    Mediator design pattern can be summarized as follows:


    +   - There is a Mediator object, the role of which is to hold a list of Participants
    and facilitate communication between them.

    - There are multiple Participant objects, which can be of completely different
    types.

    - When a Participant wants to send a message to another Participant, it sends
    the message to Mediator.

    - Based on some parameter that identifies the recipient, Mediator sends the message
    to an appropriate Participant.


    We will now go through an example implementation of Mediator. The complete solution
    can be found via the link below:


    https://github.com/fiodarsanazavets/design-patterns-in-csharp/tree/main/Behavioral_Patterns/Mediator


    # Prerequisites


    In order to be able to implement the code samples below, you need the following
    installed on your machine:


    +   - .NET 6 SDK (or newer)'
