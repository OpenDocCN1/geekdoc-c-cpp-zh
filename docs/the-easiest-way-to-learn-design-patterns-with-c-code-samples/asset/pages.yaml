  md: '# Suitable design patterns


    # Prototype


    Prototype is a design pattern that was created specifically for this problem.


    If you have a complex object that is meant to be copied often, you can make it
    cloneable. And this is exactly what this design pattern enables you to do.


    You would have an interface with a method that produces an instance of this interface.
    Usually, such a method will be called clone. And, if you want to make your object
    cloneable, this time, you will only have a single place in which you define the
    object type.


    Inside this method, you will still need to copy the value of every field into
    the output object. However, this time, you will only have a single place in the
    entire code base to do it in - the object itself. So, it will be easier to have
    a close look at it and consider all edge cases. Likewise, you will have full access
    to the private members of the object, so your copy will be exact.


    # Why would you want to use Prototype


    +   * All code to copy complex objects is located in one place.

    * You can copy private members of the object.

    * Any code that needs to generate a copy of the object will only need to call
    the clone method without having to worry about the details of the cloning process.'
