    # Suitable design patterns


    # Factory Method


    Factory Method is a type of object that implements a particular interface. This
    method belongs in a Creator object that manages the lifecycle of the object that
    is to be returned.


    Normally, you would have several variations of the Creator object, each returning
    a specific implementation of the object that you want. You would instantiate a
    specific variation of the Creator object based on a specific condition and would
    then call Factory Method to obtain the implementation of the actual object.


    In our example above, you would have one version of the Creator object that returns
    a Windows implementation of IPlayer and another version that returns its Linux
    implementation. The Creator object will also be responsible for initializing all
    dependencies that your IPlayer implementation needs. Some code block in your application
    will check which operating system it runs on and initialize the corresponding
    version of the Creator object.


    # Why would you want to use Factory Method


    Why bother using Factory Method, if you can just initialize any objects directly?
    Here, is why:


    +   - Good of use single responsibility principle. The Creator object is solely
    responsible for creating only one specific implementation type of the end-object
    and nothing else.'
