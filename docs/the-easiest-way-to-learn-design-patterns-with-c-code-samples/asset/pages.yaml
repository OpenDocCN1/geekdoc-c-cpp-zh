  md: '# Part 2: The problems that design patterns are intended to solve


    This part of the book lists common types of software problems that software developers
    face. For each of these problems, any suitable design patterns are listed.


    In this part of the book, we don''t go into each design pattern in detail. There
    is a brief description of how it''s structured, what it does, and why it can solve
    a specific type of a problem. Then, at the end of this part, we summarize all
    the problems that we have covered, and for each of them, we summarize the pros
    and cons of each design pattern that can solve.


    This part of the book serves two purposes. Firstly, it''s much easier to learn
    by association. Software problems are something that every software developer
    can easily imagine. Some of these problems would be something that they are personally
    familiar with. Design patterns, on the other hand, are something that won''t make
    a lot of sense right away if you are new to them. This is why we start with the
    descriptions of the problems first before we learn the actual design patterns.


    Secondly, this structure makes it easy to look up suitable design patterns for
    those who don''t know them yet. If you, as a programmer, are facing a challenging
    problem at work, the last thing that you would want to do is go through the descriptions
    of all design patterns and try to figure out which ones can help you to solve
    the problem at hand. What you would want to do is find the description of the
    problem that you are facing and then use it to look up suitable design patterns.
    If there are more than one, you would want'
