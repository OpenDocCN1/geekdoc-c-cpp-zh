  md: '# 34. Flyweight


    Flyweight design pattern makes it possible to cram large quantities of objects
    into the memory without using too much memory. This is made possible by sharing
    some part of the state between the objects.


    For example, imagine a real-time strategy game where you can build huge armies.
    Each unit is a separate object. But units can have certain states that make them
    behave differently. For example, a shielded unit behaves differently from a unit
    without a shield. So, instead of giving the full set of possible behaviors to
    each unit, why not simply create two instances of an object representing the behavior
    - shielded and unshielded, and then simply link each unit to one of those instances?


    Flyweight can be summarized as follows:


    +   - Flyweight object represents a set of some properties.

    - Flyweight Factory allows you to select a specific instance of the Flyweight
    object.

    - Objects that are intended to be multiplied can access a specific instance of
    the Flyweight via the Flyweight Factory.


    We will now go through an example implementation of Flyweight.

    The complete solution can be found via the link below:


    https://github.com/fiodarsanavets/design-patterns-in-csharp/tree/main/Structural_Patterns/Flyweight


    # Prerequisites


    In order to be able to implement the code samples below, you neednthe following
    installed on your machine:'
