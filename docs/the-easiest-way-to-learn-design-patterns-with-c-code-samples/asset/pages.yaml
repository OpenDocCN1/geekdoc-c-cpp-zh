  md: '# 35. Proxy


    Proxy design pattern allows you to cache the results of computationally expensive
    operations. With this design pattern, you don''t have to run such an operation
    every single time you need the results. On subsequent requests, the results are
    simply retrieved from the cache.


    It’s analogous to how the cache in a browser works. When you visit a web page
    for the first time, the browser will retrieve it from the server. But it will
    then store a copy of this page in its cache. So when you visit the page next time,
    it will be retrieved from the local cache. In this situation, the browser is acting
    as a proxy for the server.


    Proxy can be summarized as follows:


    +   * There is a Main Service object that is computationally expensive to run.

    * There is a Proxy object that implements exactly the same interface as the Main
    Service.

    * All requests to the Main Service are performed via the Proxy

    * Proxy only runs the expensive operation on the Main Service when it needs to
    and then it caches the results.

    * Under any other circumstances, Proxy returns the results from its cache without
    contacting the Main Service.


    We will now go through an example implementation of Proxy. The complete solution
    can be found via the link below:


    https://github.com/fiodarsazanavets/design-patterns-insharp/tree/main/Structural_Patterns/Proxy'
  merge: -1
