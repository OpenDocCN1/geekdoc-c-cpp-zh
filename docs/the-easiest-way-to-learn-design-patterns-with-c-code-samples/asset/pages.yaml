  md: '# # 1. Single responsibility principle


    In this chapter, we will focus on the first of these principles – single responsibility
    principle. I will explain its importance and provide some examples of its usage
    in C# code.


    Incidentally, as well as being the first principle in the abbreviation, it is
    also the one that is the easiest to grasp, the easiest to implement and the easiest
    to explain. Arguably, it is also the most important principle from the list. So,
    let''s go ahead and find out what it is and why you, as a developer, absolutely
    must know it.


    The full solution demonstrated in this chapter is available via the following
    link:


    https://github.com/fiodarsanazavets/Dotnet-CSharp-SOLID-demo/tree/master/1-single-responsibility-principle


    # ## What is single responsibility principle


    Single responsibility principle states that, for every self-contained unit of
    code (which is, usually, a class), there should be one and only one reason to
    change. In simple language, this means that any given class should be responsible
    for only one specific functionality.


    Basically, your code should be structured like a car engine. Even though the whole
    engine acts as a single unit, it consists of many components, each playing a specific
    role. A spark plug exists only to synchronize the fuel vapors. A cam belt is there
    only to synchronize the rotation of the crankshaft and the camshafts and so on.'
