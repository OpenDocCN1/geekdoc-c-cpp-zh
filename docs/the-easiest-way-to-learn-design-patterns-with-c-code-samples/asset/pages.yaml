  md: '# Benefits of using Factory Method


    Why do we not need to bother with different implementations of **Target Object**?
    Why can''t we just conditionally apply the functionality that object encapsulates?
    Well, here are the reasons why:


    +   - Factory Method enforces the single responsibility principle by separating
    conditional logic from implementation of the logic inside each condition.

    - This allows us to easily maintain the code and write automated tests for it.
    There won''t be any complex and barely readable tests assessing complex conditional
    logic. Instead, a couple of simple scenarios will assess the correct implementations
    of **Target Object** and **Factory** is picked up for each condition. Then, separate
    sets of scenarios can be applied to each separate **Target Object** and **Factory**
    implementation.

    - Factory Method allows you to execute a particular condition once. Because all
    implementations of **Target Object** use a common abstraction, a concrete implementation
    of it can be created once and then just re-used throughout the code.


    But this design pattern comes with some obvious caveats too. And this is what
    we''ll have a look at next.


    # Caveats of using Factory Method


    Even with all its benefits in place, you may still question this design pattern.
    Why do we even need a **Factory**? Why can''t we just conditionally select a concrete
    implementation of **Target Object** directly? Won''t it achieve the same benefits
    with less complexity?


    Well, if you have this question, you are right to an extent. If you have a single
    Factory Method in your **Creator** that returns only'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'one type of a concrete implementation of the **Target Object**, you will gain
    no benefits of using a **Creator**. But the benefits of Factory Method become
    really apparent if you have more than one Factory Method in your **Creator** and
    you are able to return multiple related objects.


    Using Factory Method this way turns it into another design pattern, known as Abstract
    Factory. And this is what we will have a look at next.'
