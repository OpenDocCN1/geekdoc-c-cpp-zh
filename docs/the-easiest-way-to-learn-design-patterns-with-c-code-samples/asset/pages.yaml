  md: 'design patterns, such as Model-View-Controller (MVC) and Model-View-ViewModel
    (MVVM). These design patterns are very similar to Bridge, but are more the context-specific.
    Therefore it makes them more useful in many situations than classic Bridge.


    The principles of Bridge design pattern have also inspired architectural best
    practices of distributed software. For example, gRPC is, pretty much, a distributed
    implementation of the Bridge design pattern. Protobuf definitions that clients
    and servers share can be thought of as the shared Bridge interface. In this context,
    a gRPC client can be thought of as an Interface object and a server-side gRPC
    service can be considered to be an Implementation.


    So, even if you don''t intend to use Bridge in its classic form, it''s still worth
    being familiar with it to understand the good practices of modern software architecture.'
