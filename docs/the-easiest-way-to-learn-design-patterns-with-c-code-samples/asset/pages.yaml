    This concludes our overview of Adapter. Let''s summarize its main benefits.


    # Benefits of using Adapter


    Adapter design pattern has the following benefits:


    +   - It allows you to make your application work with incompatible services without
    changing overall application logic.

    - Any translation between an incompatible API and the rest of the application
    are confined to a single place, which makes the code easy to maintain.

    - It works well when an incompatible API cannot be changed for any reason (it’s
    maintained by a third party, many other services depend on it, etc.).


    But, just like any other design pattern, Adapter has its caveats


    # Caveats of using Adapter


    Perhaps the main disadvantage of using Adapter is that it makes code more complicated.
    You need to add a suitable Service Interface, which may have to be more complex
    to make it work with an Adapter object. Also, translation functionality itself
    may have to be very complex. Yes, the above example is fairly trivial. But in
    a real-life situation, you may have to do some truly complex data transformation
    inside an Adapter object.'
  merge: -1
  pgno: 202
- img_proc: true
  md: This is why, if you can, it's better to just change the incompatible service
    and make it compatible instead of using Adapter design pattern. Use Adapter only
    if the service that you need to access is either a third-party service that cannot
    be changed, or if too many other components depend on the existing API, which
    makes it too expensive to change.
