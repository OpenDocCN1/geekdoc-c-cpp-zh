  md: '# 31. Composite


    Composite design pattern allows you to efficiently create tree-like structures.
    This ability can be useful in many situations. For example, if you need to write
    software that manages the file system of a computer, you would want to be able
    to create folders and files. Also, every folder may contain zero or more other
    folders. And this is what makes a file system a good example of a tree-like structure
    that the Composite design pattern was intended to create.


    Composite can be summarized as follows:


    +   - There is a Leaf object, which cannot contain other objects.

    - There is a Composite object, which may contain either Leaf objects or other
    Composite objects.

    - There is a Component interface that both the Composite and the Leaf objects
    implement.

    - The children of a Composite object are of the Component type, which makes it
    possible to add either Leaf or Composite-objects to it.

    - It is relatively easy to navigate through the object hierarchy and manipulate
    it.


    So, if we would use the file system as an example, a folder would be a Composite
    object, while a file would be a Leaf object.


    We will now go through an example implementation of Composite. The complete solution
    can be found via the link below:


    https://github.com/fiodarsazanavets/design-patterns-in-csharp/tree/main/Structural_Patterns/Composite'
