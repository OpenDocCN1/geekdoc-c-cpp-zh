    parameter. Implementation represents a concrete class that implement this interface
    will actually be injected into the constructors. It is an example of dependency
    inversion principle that was described in chapter 5.


    This way, you will be able to easily mock your objects, so writing tests becomes
    easy. You no longer have to maintain private constructors and static methods,
    so you can maintain single responsibility principle. Also, this allows you to
