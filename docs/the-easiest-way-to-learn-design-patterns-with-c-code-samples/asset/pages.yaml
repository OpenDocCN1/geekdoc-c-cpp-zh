    # Benefits of using Decorator


    The benefits of using Decorator are as follows:


    +   * This design pattern allows you to modify the behavior of objects without
    having access to internal functionality of those objects.

    * It strongly enforces the open-closed principle, so nothing uses the original
    objects will have to be modified.

    * It enforces single responsibility principle, as each Decorator implementation
    is responsible for a specific functionality.'
