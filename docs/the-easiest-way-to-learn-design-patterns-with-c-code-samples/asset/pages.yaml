- img_proc: true
  md: 'Component. And this makes it unsuitable for certain scenarios where some new
    functionality needs to be added to an existing object.


    Another caveat of using Visitor is that there are times where the Component object
    would be modified. As a developer, you need to watch out for, so you can either
    update your corresponding Visitor or retire it altogther.


    Finally, because a Visitor object may contain many methods, each corresponding
    to a specific Component implementation, you need to watch out for having too many
    of such methods on a single Visitor. Otherwise, you may end up with a God object.'
