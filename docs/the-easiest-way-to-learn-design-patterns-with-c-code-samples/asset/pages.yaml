  md: '1. Single responsibility principle


    # The concept of class cohesion


    In our example, it was very clear where the responsibilities should be split,
    and in most of the cases, the decision will be based on the same factor we have
    used – splitting responsibility based on atomic functional areas. In our case,
    the application was mainly responsible for two things – processing text and managing
    files; therefore we have two functional areas within it and ended up with a separate
    class responsible for each of these.


    However, there will be situations where a clear-cut functional areas would be
    difficult to establish. Different functionalities sometimes have very fuzzy boundaries.
    This is where the concept of class cohesion comes into play to help decide which
    classes to split and which ones to leave as they are.


    Class cohesion is a measure of how different public components of a given class
    are inter-related. If all public members are inter-related, then the class has
    the maximal cohesion, while a class that doesn''t have any inter-related public
    members has no cohesion. And the best way to determine the degree of cohesion
    within a class is to check whether all private class-level variables are used
    by all public members.


    If every private class-level variable is used by every public member, then the
    class is known to have maximal cohesion. This is a very clear indicator that the
    class is atomic and shouldn''t be split. The exception would be when the class
    can be refactored in an obvious way and the process of refactoring eliminates
    some or all of the cohesion within the class.


    If every public member inside the class uses at least one of the private class-level
    variables, while the variables themselves are inter-dependent and are used in
    combination inside some of the public methods, the class has less cohesion, but
    would probably still not be in violation of single responsibility principle.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# 1. Single responsibility principle


    If, however, there are some private class-level variables that are only used by
    some of the public members, while other private class-level variables are only
    ever used by a different subset of public members, the class has low cohesion.
    This is a good indicator that the class should probably be split into two separate
    classes.


    Finally, if every public member is completely independent from any other public
    member, the class has zero cohesion. This would probably mean that every public
    method should go into its own separate class.


    Let''s have a look at TextProcessor class, which we have only one method, ConvertText.
    So, we don''t have to look at the cohesion. It has maximal cohesion already.


    In our FileProcessor class, we have two methods, ReadAllText and WriteToFile.
    Both of these methods use the fullFilePath variable, which is initialized in the
    class constructor. The class also has the maximal cohesion and therefore is atomic.


    # God Object – the opposite of single responsibility


    So, you now know what single responsibility principle is and how it benefits you
    as a developer. What you may be interested to know is that this principle has
    the opposite, which is known as God Object.


    In software development, a method of doing things that is opposite to what best
    practices prescribe known as anti-pattern; therefore God Object is a type of an
    anti-pattern. It is just as important to name bad practices as it is to name good
    practices. If something has a name, it becomes easy to conceptualize and remember,
    and it is crucially important for software developers to remember what not to
    do.'
