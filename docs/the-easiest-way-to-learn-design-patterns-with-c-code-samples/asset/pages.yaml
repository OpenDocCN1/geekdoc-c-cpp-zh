    https://github.com/fiodarsazanavets/Dotnet-CSharp-SOLID-demo/tree/master/2-open-closed-principle


    # What is open-closed principle


    Open-closed principle states that every atomic unit of code, such as class, module
    or function, should be open for extension, but closed for modification. The principle
    was coined in 1988 by Bertrand Meyer.


    Essentially, what it means is that, once written, the unit of code should be unchanged,
    unless some errors are detected in it. However, it should also be written in such
    a way that additional functionality can be attached to it in the future if requirements
    are changed or expanded. This can be achieved by common features of object oriented
    programming, such as inheritance and abstraction.


    Unlike single responsibility principle which almost everyone agrees, with the
    open-closed principle has its critics. It''s always obvious how the single responsibility
    principle can be implemented and what benefits it will provide. However, trying
    to foresee where the requirements may change in the future and designing your
    classes in such a way that most of them would be without'
