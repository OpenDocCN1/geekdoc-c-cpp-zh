- img_proc: true
  md: '8. Using many instances of an object while keeping code running smoothly 94


    a cost associated with running the constructor of the object''s data type. The
    more complex constructor logic is, the bigger performance you will get.


    Finally, when you are no longer using an instance of the object and it gets out
    of scope, there will be a performance cost associated with garbage collection.
    Remember that the memory will not be freed straight away. It will still be occupied
    until the garbage collector has found your object and identified that it is no
    longer being referenced anywhere.


    The latter, of course, doesn''t apply to the languages that don''t have an in-built
    garbage collector. However, in this case, you will have to free the memory yourself
    if you don''t want to introduce a memory leak. So, if you are using one of such
    languages, like C++ or Rust, you will have an additional issue in your code to
    worry about.


    # Suitable design patterns


    # Object Pool


    Object pool is a pattern that allows you to reuse the object instances, so you
    won''t have to keep instantiating new objects every time.


    You have a single Pool object that stores multiple instances of instantiated objects
    of a specific type. If any of these objects aren''t being used, they are stored
    inside the Pool. Once something in the code requests an object, it becomes unavailable
    to any other parts of the code. Once the caller has finished with the object,
    it gets returned to the Pool, so it can be reused by other callers.


    Initially, you will still need to instantiate objects in the Pool. However, when
    your Pool grows to a reasonable size, you will be instantiating new objects less
    and less, as there will be a greater chance of finding objects in it that have
    already been released by their respective callers.'
