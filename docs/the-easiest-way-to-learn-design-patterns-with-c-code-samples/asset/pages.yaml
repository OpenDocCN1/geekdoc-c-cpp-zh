  md: '# 45. Visitor


    Visitor is a design pattern that allows you to modify the behavior of existing
    objects when you cannot modify these objects directly. Essentially, you allow
    these objects to be “visited” by an external object. This object would call one
    of the public methods on the original object. Either before or after the call,
    it will perform some additional actions.


    Visitor design pattern can be summarized as follows:


    +   - The original object is known as Component.

    - Visitor object has a method that would call a specific method on a specific
    implementation of Component while performing some additional actions.

    - Component implementation has been extended to accept a Visitor object.

    - When a Visitor object is accepted by a Component object, the specific method
    on Visitor object gets triggered.


    We will now go through an example implementation of Visitor. The complete solution
    can be found via the link below:


    https://github.com/fiodarsazanavets/design-patterns-in-csharp/tree/main/Behavioral_Patterns/Visitor


    # Prerequisites


    In order to be able to implement the code samples, you need the following installed
    on your machine:


    +   - .NET 6 SDK (or newer)'
  merge: -1
