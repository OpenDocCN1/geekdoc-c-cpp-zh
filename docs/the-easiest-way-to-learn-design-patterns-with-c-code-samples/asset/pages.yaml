  md: '# 7. Making several exact copies of a complex object


    Imagine that you have an object that you need to copy multiple times. Because
    it''s not a primitive type, you cannot just copy the value of the whole thing
    into a new variable of the same type. Instead, you would need to instantiate a
    new object of this type and then copy the value of every field from the original
    object instance.


    That would be fine for simple objects with a relatively small number of fields
    that contain primitive types, such as integers and Booleans. But what if you are
    dealing with complex objects with many fields, some of which contain other objects?
    And what if such an object contains private fields that you also want to be copied,
    but can''t access?


    In this case, you would need to write a complex code to make a copy of an object.
    For private fields in particular, you may also need to run additional logic to
    instantiate them. This way of doing things adds complexity\u2013\u214 it makes
    the code less readable and vulnerable to errors. Plus, as you will have no direct
    access to private members of the object, you may not necessarily end up with an
    exact copy and suffer some undesirable side-effects as the result.'
  merge: -1
