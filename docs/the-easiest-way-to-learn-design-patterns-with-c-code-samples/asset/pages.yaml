    # Benefits of using Bridge


    The benefits of using Bridge design pattern can be summarized as follows:


    +   * The main benefit of separating Interface from Implementation that separate
    teams can work on these two components without interfering with each other.

    * Because of such structure, it enforces the single responsibility principle.

    * Interface can easily be tested even when Implementation is not ready. Due to
    dependency inversion principle, Implementation can be easily mocked.


    Let’s now have a look at the caveats of using Bridge.


    # Caveats of using Bridge


    Although Bridge is a very useful design pattern, the classic version of it is
    rarely used these days. But it’s not because of its ineffectiveness. It’s because
    Bridge has inspired the creation of some other'
