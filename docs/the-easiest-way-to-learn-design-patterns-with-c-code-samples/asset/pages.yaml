    You need to put some logic in place to make sure your cache is not refreshed too
    often. But at the same time, you need to ensure the cache is reasonably accurate.
    If the cache refreshes too often, you may lose the benefits of using Proxy. If
    it doesn''t refresh enough, it may become outdated'
