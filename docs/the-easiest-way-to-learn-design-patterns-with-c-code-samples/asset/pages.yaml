    # # What is interface segregation principle


    In object-oriented programming, interfaces are used to define signatures of methods
    and properties without specifying the exact logic inside them. Essentially, they
    act as a contract that a class must adhere to. If class implements any particular
    interface, it must contain all components defined by the interface as its public
    members.


    Interface segregation principle states that if any particular interface member
    is not intended to be implemented by any of the classes that implement the interface,
    it must not be in the interface. It is closely related to single responsibility
    principle by making sure that only the absolutely essential functionality is covered
    by the interface and the class that implements it.


    And now, we will see why interface segregation is important.'
