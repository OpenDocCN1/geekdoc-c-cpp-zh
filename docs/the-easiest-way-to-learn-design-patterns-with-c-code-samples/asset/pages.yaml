  md: '# Caveats of using Command


    Perhaps the main thing you have to look out for while using Command is that you
    can accidentally make your code too complicated if you are not careful enough.


    First of all, you may end up with too many Command objects that will become hard
    to manage. However, it might be that not every operation that you need to perform
    warrants the use of Command. For example, if an operation is definitely neither
    customizable nor reusable, it may not be needed to be isolated into its own Command
    object.


    Secondly, if you make any particular Command implementation too customizable,
    you may end up with a badly written object that is trying to do too many things
    at once and violates single responsibility principle as the result. So, it''s
    OK to have some customization in a Command implementation. But make sure it''s
    only some relatively minor customization.


    Remember that Command, just like any other design patterns, is meant to make your
    code more maintainable and not less maintainable.'
