  md: '# 42. State


    State is a design pattern that allows developers to change behavior of an object
    depending on what state the object is in. The public interface of the object,
    however, remains the same.


    You can think of it as being analogous to a smartphone. When the phone is in a
    locked state, pressing the same button brings up a prompt for the unlock PIN.
    However, if the phone is already unlocked, pressing the same button takes you
    to the home screen. It''s the same button. But it behaves differently if your
    device is in a different state. And the same thing can be done in the code.


    State design pattern can be summarized as follows:


    +   - There is a Context object, which contains the State interface.

    - State interface would have multiple implementations, each with its own behavior.

    - The role of Context object is to trigger specific public methods in the current
    State implementation and to allow State implementation to be changed.

    - State implementations are never manipulated directly by external client. Only
    Context object is called directly by outer client.

    - However, the outer code instructs the Context to change the concrete implementation
    of State inside itself.


    We will now go through an example implementation of State. The complete solution
    can be found via the link below:


    https://github.com/fiodarsazanavets/design-patterns-in-csharp/tree/main/Behavioral_Patterns/State'
  merge: -1
