- img_proc: true
  md: '+   It’s easy to write automated tests against Decorator implementations because
    they are very specific and focused.


    But, despite all of its benefits, Decorator has some caveats. And this is what
    we will have a look at next.


    # Caveats of using Composite


    It’s a good thing that Decorator allows you to apply multiple layers of modified
    functionality to your Original Object. But when you have too many of them in the
    stack, it can become hard to manage the functionality. Removal and replacement
    of Decorator instances becomes especially problematic. So you need to watch out
    for that.


    In the above example, I have intentionally demonstrated another problem you while
    using Decorator. We have added a silencer to our gun, which added silencing functionality
    to our shots. So far so good. Then we added an extended magazine on top of the
    silencer. And this combination worked too. That was until we ran out of ammo from
    the original gun. We could still make shots from the additional ammo reserve,
    but those were not silenced, making our silencer ineffective in this scenario.


    So exposes a problem. Decorator implementations need to be designed in such a
    way that they don’t interfere with each other’s functionality.


    Finally, there’s not always a possibility to use the Decorator pattern when you
    want to modify the behavior of the objects you can’t modify from the inside. Or,
    at least, you can’t modify it in a specific way. And this is where Adapter will
    be more appropriate.'
