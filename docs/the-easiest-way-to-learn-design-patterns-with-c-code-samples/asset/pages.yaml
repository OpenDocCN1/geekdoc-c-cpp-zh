    # Benefits of using Proxy


    The benefits of using Proxy can be summarized as follows:


    +   - This design pattern allows you not to run expensive operations every time
    you need to obtain the results of these operations.

    - Because the Proxy object uses the same interface as the Main Service, Proxy
    object can be used in any place in the code where the Main Service is normally
    used.


