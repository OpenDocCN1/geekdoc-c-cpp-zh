    # Benefits of using Singleton


    The key benefits of using Singleton are as follows:


    +   - The object is only initialized once - the first time you retrieve it.

    - The design pattern enforces the use of the same instance of the object throughout
    the application.

    - The design pattern is easy to understand and set up.


    However, just like any other design pattern, Singleton has its caveats. And this
    is what we will have a look at next.


    # Caveats of using Singleton


    Arguably, Singleton design pattern violates the single responsibility principle,
    as the Singleton object is responsible for both maintaining an instance of itself
    and performing the actual functionality the object was designed for.'
