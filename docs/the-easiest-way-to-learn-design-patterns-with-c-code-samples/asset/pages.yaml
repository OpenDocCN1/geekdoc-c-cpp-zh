  md: '# 33. Facade


    Facade design pattern is all about building a simple interface to abstract away
    the complexity of using multiple complex interfaces. If, for example, your application
    needs to access multiple services and perform some complex logic of coordinating
    the responses from those services, Facade design pattern would allow you to isolate
    such functionality in one place. This will then be accessible by the rest of the
    application via a simple interface.


    A real-life analogy could be a food delivery system. All you do is go to a website
    and select the items to order. And then those items will get delivered to you.
    As a consumer, this is all you care about. But behind the scenes, you place an
    order, you trigger a whole complex system. The food needs to be prepared. The
    preparation of different items needs to be coordinated. The delivery driver needs
    to be assigned. The delivery route needs to be planned. And so on.


    Facade can be summarized as follows:


    +   - There are several Endpoint Interfaces.

    - Either the calls to the Endpoint Interfaces need to be coordinated or the responses
    from them need to be aggregated in some way.

    - There is a Facade object that performs all of such coordination.

    - The Facade object is accessible by the rest of the application via a simple
    interface.


    We will now go through an example implementation of Facade. The complete solution
    can be found via the link below:


    https://github.com/fiodarsazanavenets/design-patterns-in-csharp/tree/main/Structural_Patterns/Facade'
  merge: -1
