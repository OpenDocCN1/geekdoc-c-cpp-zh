  md: '# 28. Singleton 182


    Another disadvantage of using Singleton is that it may not behave as intended
    in a multi-threaded application. It could be that each thread would create its
    own instance of a Singleton object.


    Also, Singleton object isn''t necessarily the easiest object to write tests against.
    Especially, it will be difficult to mock, as static methods cannot be mocked by
    conventional methods.


    Finally, there is no flexibility in how the object is used. A Singleton object
    can only ever be used as Singleton. It cannot be used as an instance dependency
    under a different context.


