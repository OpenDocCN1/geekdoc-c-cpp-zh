    # ## What is Liskov substitution principle


    Liskov substitution principle was initially introduced by Barbara Liskov, an American
    computer scientist, in 1987. The principle states that if you substitute a sub-class
    with any of its derived classes, the behavior of the program should not change.


    This principle was introduced specifically with inheritance in mind, which is
    an integral feature of object oriented programming. Inheritance allows you to
    extend the functionality of classes or modules (depending on what programming
    language you use). So, if you need a class with some new functionality that is
    closely related to what you already have in a different class, you can just inherit
    from the existing class instead of creating a completely new one.


    When inheritance is applied, any object oriented programming language will allow
    you to insert an object that has the derived class as its data type into a variable
    or parameter that expects an object of the subclass. For example, if you have
    a base class Car, you could create another class that inherits from it and is
    called'
