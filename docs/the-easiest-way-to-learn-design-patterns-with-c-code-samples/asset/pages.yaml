  md: '# Suitable design patterns


    # Facade


    Facade is a class that controls access to a set of complex objects and makes it
    simple. Most often, just like an Adapter, it would change the access interface
    into these classes. However, unlike Adapter, it will usually be a wrapper around
    several of such classes. Or it may be responsible for a diverse set of interactions
    between a number of moving system parts rather than just converting one type of
    a call to another type.


    Direct interaction with those complex classes is happening only inside the Facade
    class, so the other system components are completely shielded away from it. All
    that the client class will be concerned about calling the specific methods on
    the Facade. Client doesn''t care how Facade delivers what it needs. It only cares
    that Facade does the job that is expected of it.


    And when any of the above-mentioned components needs to be updated, the update
    in the logic will only need to happen inside the Facade, which will prevent the
    other parts of the system from having bugs unintentionally introduced into them
    by forgetting to update the logic.


    # Why would you use Facade


    +   * A convenient way of simplifying access to a complex subset of the system.

    * All other application components are shielded away from having to interact with
    a complex logic.

    * Since all the code that interacts with a complex subsystem is located in one
    place, it’s easier not to miss updates to the logic if any of the subsystem components
    get updated.'
