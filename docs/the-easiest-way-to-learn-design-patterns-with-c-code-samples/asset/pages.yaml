  md: '# Caveats of using Flyweight


    Perhaps the main caveat of using Flyweight is that it can make the code complicated
    and difficult to read. Therefore sometimes there needs to be a trade-off between
    code maintainability and the efficient use of RAM.


    Another disadvantage of using flyweight is that, although it will save your memory,
    it might actually increase the CPU usage. Imagine many objects making a parametrized
    call to a specific instance of a Flyweight object. Even if this instance is shared
    between many objects, your CPU would still be doing a lot of work in this situation.'
