  md: '# Introduction


    Design patterns are something that you will need to get familiar with as a programmer
    who works with object oriented languages. And this is primarily because they represent
    well-defined solutions to common software development problems. So, instead of
    thinking through all the details of your solution, you can simply check if any
    of the existing design patterns can be used. You won''t have to reinvent the wheel.


    As a software developer, you would be familiar with reusable software components,
    such as methods, functions, public classes, libraries, etc. Well, you can think
    of design patterns as reusable solutions to common software problems. If you are
    familiar with which design patterns can solve a specific type of a problem, you
    will no longer have to come up with a bespoke solution, which could have taken
    you a significant amount of time to design and implement. All you''ll have to
    do is just pick the mostly suitable design pattern and apply it in a specific
    way to solve this specific problem. The solution is already there. The time taken
    to implement it would not be much greater than the time it takes you to type the
    code.


    If you are new to design patterns, let''s go through a quick overview of what
    they are.


    # What design patterns are


    Design patterns are prescribed ways of implementing solutions to common problems.
    While every specific implementation of them will be bespoke and only relevant
    to a specific codebase, they still determine how your code should be structured.
    A design pattern'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Introduction


    would tell you how different object types in your code should interact with one
    another. Specific objects would have specific roles, which are prescribed by a
    specific design pattern. But a specific implementation of those objects would
    still be relevant only to a specific problem.


    If you will, you can compare the concept of design patterns with Agile Principles.
    For example, if you follow Scrum, you would go through all of the relevant ceremonies
    (daily standups, sprint reviews, etc.). You would have specific roles (Scrum master,
    product owner and Scrum team members). You would work in sprints of a specific
    length. But the problems that you will be solving during your sprints will be
    very specific to your organization. The actual implementation of Scrum methodology
    will be bespoke.


    Design patterns have been used in object oriented programming for some time. But
    in 1994, they have been officially classified and described in a book *Design
    Patterns: Elements of Reusable Object-Oriented Software*, which was written by
    Erich Gamma, Richard Helm, Ralph Johnson and John Vlissides, who are collectively
    known as *The Gang of Four*


    So, in a nutshell, each design pattern prescribes how the objects in your code
    should be structured and how they should behave. For solutions where multiple
    objects are involved, it prescribes the role for each object.


    Let''s have a look at a design pattern called *Strategy* for our example. This
    pattern is commonly used to make your code easily maintainable and testable in
    situations where you have complex conditional logic. In this pattern, you have
    a class with the role of *Strategy*. This class stores an interface, which has
    a role of *Context*. There are several classes that implement this interface,
    each performing a specific behavior. Then, all you do inside your conditional
    logic is assign a specific *Context* implementation to the *Strategy*. And, then
    once all conditions have been examined, you just execute some method on the *Context*
    object which Strategy'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Introduction 3


    class encapsulates. This will execute the behavior that was specific to a particular
    condition, as a specific implementation of Context was assigned to Strategy when
    a specific condition was hit.


    So, the design patterns prescribes roles to objects and how these objects should
    interact with one another. We have one object with the role of Strategy and several
    implementations of an object with the role of Context. But what the design pattern
    doesn''t prescribe what specific behavior should the implementation perform or
    what data type(s) it return, if any. It''s up to you to decide.


    Some design patterns don''t even involve multiple objects with different roles.
    Singleton and Prototype patterns, for example how to apply internal logic to an
    object of and what public members should this object have for other objects to
    access.


    So, why would you use design patterns? Why not provide a bespoke solution to every
    problem you face? Well, there are some good reasons why design patterns are better.
    The reasons why you would want to learn them beyond the fact that design patterns
    merely provide a better solution.


    # Why would you want to learn design patterns


    Design patterns will indeed make you more effective at solving problems. When
    you have used them for a while, you will intuitively know where to apply them.
    So, you will not have to spend much time thinking of the solution. You will be
    able to apply one right away.


    Not only will you be able to solve the problem quicker, but your code will be
    cleaner. It will be more readable, easier to test, and easier to maintain.


    Let''s go back to our example of Strategy pattern. You can, of course,'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'Introduction


    just use a complex conditional logic in a single method of your code. But then
    imagine how hard it might be to test the logic. Also, if the logic is complex,
    it might not necessarily be the most readable code.


    When Strategy pattern is implemented, it solves the problem. But beyond that,
    it makes your code clean. The original method that contains the conditional logic
    only selects which Strategy to implement. It doesn''t do anything beyond that.
    Easy to read. Easy to test. Each Strategy implementation only contains an atomic
    piece of logic that is responsible for only one action. Easy. Easy to test.


    But the benefits of knowing design patterns go beyond them being good solutions
    to common problems. Many reputable organizations ask questions about them during
    job interviews. The major IT giants almost certainly do. So, not knowing design
    patterns might prevent you from getting a job in the company of your dreams.


    The main problem with design patterns is that they are not easily to learn. Let''s
    examine why that is.


    # Why design patterns are hard to learn


    Many developers, especially the ones who don''t have a lot of software-building
    experience, struggle with design patterns. But if you do struggle with them, it
    may prevent you from getting a programming job at a reputable organization. After
    all, recruiting managers often ask questions about design patterns. Otherwise,
    not knowing design patterns will make you less effective as a software developer,
    which will slow down your career progress.


    The main reason why design patterns are so hard to learn is because of the way
    they are normally taught. Usually, if you pick pretty much any book on design
    patterns or open pretty any online'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'article about them, it would provide a collection of design patterns that you
    would need to go through. You would then have to go through each of them, try
    your best to understand the principles behind it and only then try to figure out
    how to apply it in a real-life situation.


    It’s a tedious process that doesn’t always bring about the right results. It’s
    not uncommon for software developers to memorize just a handful of design patterns
    that they have been using in their own projects. The remaining ones have been
    forgotten as soon as they’ve been learned. And it’s hard to figure out which design
    pattern applies in which situation if you only remember a handful of them.


    # The goal of this book


    This book provides a different approach. It uses a methodology that makes it easy
    to learn design patterns. So, you no longer have to brute-force your way through
    them. The process of effective learning is not about memorization. It’s about
    associations. You learn new things easily when you can clearly see how new facts
    relate to your existing knowledge. And this is precisely the method that this
    book is built around.


    You won’t have to brute-force your way into design patterns. In fact, you won’t
    even start with the design patterns. First, we will go through a list of common
    problems that software developers are required to solve. These are the things
    that every software developer can associate with. Even if you haven’t faced a
    particular type of a problem yet, you will still be able to easily understand
    its description. For each of these problems, you will go through the design patterns
    that can solve it. And for each one of them, you will go through its core principle
    and the description of how it can solve this type of a problem. Only then will
    you be invited to examine'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'Introduction


    6


    this particular design pattern in detail, so you can understand how to implement
    it in your own code.


    This structure of the book also makes it valuable as a reference book. Even when
    you don''t know or remember design patterns, looking them up becomes easy. What
    you need to find is a description of the type of problem you are trying to solve.
    And then you will be able to follow it to find the actual design patterns that
    you can apply to it.


