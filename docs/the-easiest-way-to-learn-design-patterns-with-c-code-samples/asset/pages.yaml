  md: '8. Using many instances of an object while keeping code running smoothly


    To ensure that the Pool doesn''t grow too big, there will be a property that will
    limit its size. Likewise, a mechanism inside of it will determine which object
    instances to get rid of and which ones to keep. For example, you don''t need an
    object pool with 1,000 object instances if your application will ever use 10.


    # Why would you want to use Object Pool


    +   - Objects are being reused, so you will not get any performance penalty associated
    with instantiating new objects.

    - Object pool maintains its size as needed, so you will not end up with way more
    object instances than you would ever expect to use.


    # Flyweight


    This design pattern allows multiple objects to share parts of their state. So,
    for example, if you have a thousand objects, all of which currently have the same
    values in some of their attributes, this set of attributes will be moved to a
    separate object and all thousand instances will be referring to the same instance
    of it.


    This allows you to store way more objects in the memory than would have been able
    to otherwise. In the case above, instead of having a thousand instances of a particular
    object type with all their property values in each, you would have thousand basic
    skeleton objects, each of occupying only a tiny amount of space in memory. The
    remaining properties of these objects will be stored in memory only once.


    One disadvantage of flyweight, however, is that it makes your code complicated.
    You will need to decide which parts of the state are shared and which aren''t.
    Also, you will need to do some thinking on the best way of changing the state
    once it becomes irrelevant to any specific instance of an object.'
