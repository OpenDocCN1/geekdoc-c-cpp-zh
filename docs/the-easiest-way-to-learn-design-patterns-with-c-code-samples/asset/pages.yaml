  md: 'And Abstract Factory doesn’t have the same caveats as Factory Method has on
    its own. Because you are creating a family of related objects rather than just
    a specific implementation of a single object, Creator object plays an important
    role and actually makes things easier.


    But Abstract Factory still has some minor caveats. And this is what we will examine
    next.


    # Caveats of using Abstract Factory


    Because Abstract Factory was designed to create a family of related objects in
    one go, it’s not suitable for situations where creating an object step-by-step
    would be more appropriate. Builder pattern is more suitable for these types of
    situations. And this is what we will have a look at next.'
