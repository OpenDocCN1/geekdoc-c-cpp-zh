  md: '# # 43. Strategy


    Strategy design pattern allows you to write maintainable code in situations where
    conditional logic needs to be applied. Instead of placing a specific piece of
    logic under a specific condition in the code, you would move each of these pieces
    of logic into its own class. All of these classes would implement exactly the
    same interface. So, all you would have to do in your if or switch statement is
    pick up to a specific implementation of this interface that is appropriate to
    a specific condition. Then, all you have to do is just execute the action method
    to trigger this logic.


    Below, we will examine some clear benefits of this approach. But for now, let''s
    summarize the Strategy design pattern:


    +   - There is a Strategy interface that defines the action method that may or
    not return some data.

    - There are multiple Concrete Strategy implementations.

    - There is a Context object, which encapsulates Strategy interface.

    - The Context object allows the calling code to set its internal Strategy field
    to a Concrete Strategy implementation.

    - The Context object allows the calling code to execute the action method on the
    current implementation of Strategy.

    - The Concrete Strategy implementation is set on the Context based on some conditional
    logic.


    We will now go through an example implementation of Strategy. The complete solution
    can be found via the link below:


    https://github.com/fiodarsazanavets/design-patterns-in-csharp/tree/main/Behavioral_Patterns/Strategy'
  merge: -1
  pgno: 309
