  md: '# 32. Decorator


    Decorator design pattern allows developers to modify the functionality of existing
    objects without modifying the objects themselves. Just like Adapter pattern, Decorator
    provides a wrapper for an existing object. However, unlike Adapter, it implements
    exactly the same interface as the original object. This allows you to apply additional
    processing steps to the original API without modifying its behavior.


    Decorator can be summarized as follows:


    +   - There is a class, which we will refer to as the Original Object.

    - The Original Object implements Service Interface.

    - There is a Decorator class that also implements Service Interface.

    - Because Decorator class acts as a wrapper for Service Interface, any implementation
    of this Service Interface can be used, including another Decorator.

    - Decorator can add additional functionality to any public members of its internal
    Service Interface implementation, such as pre-processing or post-processing steps.


    We will now go through an example implementation of Decorator. The complete solution
    can be found via the link below:


    https://github.com/fiodarsazazanavets/design-patterns-in-sharp/tree/main/Structural_Patterns/Decorator


    # Prerequisites


    In order to be able to implement the code samples below, you need the following
    installed on your machine:'
  merge: -1
