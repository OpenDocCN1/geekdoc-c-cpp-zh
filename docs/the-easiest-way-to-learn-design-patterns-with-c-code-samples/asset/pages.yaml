  md: '# 27. Prototype


    Prototype is a design pattern that allows you to easily clone existing objects.
    Instead of copying all the data from one object to another field-by-field, you
    just have a method to clone the object inside the object itself.


    This has two core advantages. Firstly, all of your code of copying an object resides
    in a single place in your code base, which enforces **don''t repeat yourself**
    (DRY) principle. Secondly, it allows you to copy private fields into the new object,
    which you wouldn''t have been able to do at all if you just did a field-by-field
    copying.


    Prototype can be summarized as follows:


    +   * A class has a method that returns an exact copy of the instance of the class.

    * This method may be called `Clone` or `Copy`.

    * This method performs field-by-field copy of the class, including its private
    fields.

    * But even though the object that this method returns the same values in all of
    its fields as the original object, it''s a completely different object reference,
    so modifying it will not change the original object.


    We will now go through an example implementation of Prototype. The complete solution
    can be found via the link below:


    https://github.com/fiodarsazanavets/design-patterns-insharp/tree/main/Creational_Patterns/Prototype'
