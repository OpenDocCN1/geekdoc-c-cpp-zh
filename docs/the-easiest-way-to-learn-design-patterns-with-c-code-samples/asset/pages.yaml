    create a history of Command objects and, for each one of them, add the ability
    to roll it back.


    Unlike Memento, Command doesn''t manage internal states of the objects. So, it
    won''t be suitable when private fields need to get their values changed while
    undoing an action. However, commands can be changed in such a way that you save
    the instructions, but don''t save previous states. This way, you don''t restore
    previous actions. You merely revert previous actions by executing the opposite
    actions. This allows you to use the memory more efficiently.


    # Why would you use Command instead of Memento


    +   - More efficient use of memory, as you don''t have to store each individual
    snapshot.

    - The actual steps are easier to trace.'
