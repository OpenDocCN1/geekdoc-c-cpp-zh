  - '[PAGE 189]


    # A64 CPU Registers


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_189_0.png)


    +   * X0-X28, W0-W28

    * X16 (XIP0), X17 (XIP1)

    * Stack: SP, X29 (FP)

    * Next instruction: PC

    * Link register: X30 (LR)

    * Zero register: XZR, WZR


    There are 31 general registers from X0 and X30, with some delegated to specific
    tasks such as intra-procedure calls (X16, XIP0, and X17, XIP1), addressing stack
    frames (Frame Pointer, FP, X29) and return addresses, the so-called Link Register
    (LR, X30). When you call a function, the return address of a caller is saved in
    LR, not on the stack in Intel/AMD x64. The return instruction in a callee uses
    the address in LR to assign it to PC and resume execution. But if a callee calls
    other functions, the current LR needs to be manually saved somewhere, usually
    on the stack. There’s Stack Pointer, SP, of course. To get zero values, there’s
    the so-called Zero Register, XZR. All X registers are 64-bit, and 32-bit lower
    parts are addressed via the W prefix. Next, we briefly look at some aspects related
    to our exercises.'
- md: "\n# A64 Instructions and Registers\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_190_0.png)\n\
    \nOpcode DST, SRC, SRC2\n\nExamples:\n\n```\nmov   x0, #16          // X0 ← 16\
    \ (0x10)\nmov   x29, sp           // X29 ← SP\nadd   x1, x2, #16       // X1 ←\
    \ X2+16 (0x10)\nmul   x1, x2, x3         // X1 ← X2*X3\nblr  x8              \
    \   // X8 already contains\n                      // the address of func (&func)\n\
    \                      // LR ← PC+4; PC &func\n                      // SP ← SP-48\
    \ (-0x30)\nsub   sp, sp, #48       // make room for local variables\n```\n\nThis\
    \ slide shows a few examples of CPU instructions that involve operations with\
    \ registers, for example, moving a value and doing arithmetic. The direction of\
    \ operands is the same as in the Intel x64 disassembly flavor if you are accustomed\
    \ to WinDbg on Windows. It is equivalent to an assignment. BLR is a call of some\
    \ function whose address is in the register. BL means Branch and Link.\n\n# A64\
    \ Memory and Stack Addressing\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_191_0.png)\n\
    \nBefore we look at operations with memory, let's look at a graphical representation\
    \ of memory addressing. A thread stack is just any other memory region, so instead\
    \ of SP and X29 (FP), any other register can be used. Please note that the stack\
    \ grows towards lower addresses, so to access the previously pushed values, you\
    \ need to use positive offsets from SP.\n\n# A64 Memory Load Instructions\n\n\
    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_192_0.png)\n\n- Opcode DST, DST_, [SRC],\
    \ Offset\n- Opcode DST, DST_, [SRC], Offset // Postincrement\n- Examples:\n\n\
    ```\nldr x0, [sp] // value at address SP+0\nldr x0, [x29, -8] // value at address\
    \ X29-0x8\nldp x29, x30, [sp, #16] // X29 + value at address SP+32 (0x20)\nldp\
    \ x29, x30, [sp] // X30 + value at address SP+0\n// SP -> SP+16 (0x10)\n```\n\n\
    Constants are encoded in instructions, but if we need arbitrary values, we must\
    \ get them from memory. Square brackets show memory access relative to an address\
    \ stored in some register. There’s also an option to adjust the value of the register\
    \ after load, the so-called Postincrement, which can be negative.\n\n# A64 Memory\
    \ Store Instructions\n\n- Opcode SRC, SRC2, [DST, Offset]\n- Opcode SRC, SRC2,\
    \ [DST, Offset] // Preincrement\n- Examples:\n\n```\nstr x0, [sp, #16]       \
    \       // x0 -> value at address SP+16 (0x10)\nstr x0, [x29, #-8]           //\
    \ x0 -> value at address SP+32\nstp x29, x30, [sp, #32]           // x29 -> value\
    \ at address SP+40 (0x28)\nst x29, x30, [sp, #-16]!          // SP -> SP-16 (-0x10)\n\
    \                                     // x29 -> set value at address SP\n    \
    \                                 // x29 -> set value at address SP+8\n```\n\n\
    Storing operand order goes in the other direction compared to other instructions.\
    \ There’s a possibility to Preincrement the destination register before storing\
    \ values.\n\n# A64 Flow Instructions\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_194_0.png)\n\
    \n- Opcode DST, SRC\n- Examples:\n\n```\nadrp x0, 0x420000          // x0 ← 0x420000\n\
    b      0x10493fc1c          // PC ← 0x10493fc1c\n                      // (goto\
    \ 0x10493fc1c)\nbr     x17                  // PC ← the value of X17\n0x10493fc14:\\\
    \              // PC == 0x10493fc14\nbl     0x10493ff74       // LR ← PC+4 (0x10493fc18)\n\
    \                      // PC ← 0x10493ff74\n                      // (goto 0x10493ff74)\n\
    ```\n\nBecause the size of every instruction is 4 bytes (32 bits), it is only\
    \ possible to encode a part of a large 4GB address range, either as a relative\
    \ offset to the current PC or via ADRP instruction. Goto (an unconditional branch)\
    \ is implemented via the B instruction. Function calls are implemented via the\
    \ BL (Branch and Link) instruction.\n\n# A64 Function Parameters\n\nOn the ARM64\
    \ Linux platform, the first eight parameters are passed in registers (X0-X7),\
    \ and the rest via stack locations.\n\n# A64 Struct Function Parameters\n\nWhen\
    \ a static member function is called, the first parameter is implicit and passed\
    \ via X0. The rest of the parameters are passed as usual.\n\n# Function Objects\
    \ vs. Lambdas\n\nLambdas are internally implemented as function objects. The code\
    \ example:\n\n```cpp\nstruct MyStruct {\n    int a;\n    int foo(int i, MyStruct*\
    \ this) {\n        return a + i + this->a;\n    }\n};\n```\n\nWait, more accurately:\n\
    ```cpp\nstruct lambda_0 {\n    auto operator()(int x) const { return -x; }\n};\n\
    auto negate = [](int x) { return -x; };\n```\n\n# A64 Lambda Example\n\n```cpp\n\
    struct lambda_0 {\n    auto operator()(int x) const { return -x; }\n} negate;\n\
    auto negate = []() { return -x; };\n```\n\n# Captures and Closures\n\nInside lambda\
    \ code, it is possible to use local objects from the outer scope either by copy\
    \ or reference.\n\n```cpp\n{\n    int b;\n    auto negate1 = [](int x) { return\
    \ b - x; };\n    auto negate2 = [](int x) { return - x; };\n    auto negate4 =\
    \ [&](int x) { return - x; };\n    auto negate5 = [&](int x) { return b - x; };\
    \ negate5(10);\n    auto negate6 = [&](int x) { return b - x; }; negate6(10);\n\
    }\n```\n"
  mdcn: "\n\n# A64 指令与寄存器\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_190_0.png)\n\
    \n操作码 DST, SRC, SRC2\n\n示例：\n\n```\nmov   x0, #16          // X0 ← 16 (0x10)\n\
    mov   x29, sp           // X29 ← SP\nadd   x1, x2, #16       // X1 ← X2+16 (0x10)\n\
    mul   x1, x2, x3         // X1 ← X2*X3\nblr  x8                 // X8 已经包含\n \
    \                     // 函数地址 (&func)\n                      // LR ← PC+4; PC\
    \ &func\n                      // SP ← SP-48 (-0x30)\nsub   sp, sp, #48      \
    \ // 为局部变量留出空间\n```\n\n这张幻灯片展示了几个涉及寄存器操作的 CPU 指令示例，例如移动值和进行算术运算。如果你习惯 Windows\
    \ 上的 WinDbg，那么操作数的方向与 Intel x64 反汇编格式相同。它等同于赋值。BLR 是对某个寄存器中地址的函数的调用。BL 代表 Branch\
    \ and Link（跳转并链接）。\n\n# A64 内存与栈寻址\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_191_0.png)\n\
    \n在查看内存操作之前，让我们来看内存寻址的图形化表示。线程栈只是其他内存区域之一，因此可以使用除 SP 和 X29 (FP) 以外的任何寄存器。请注意，栈向低地址方向增长，因此要访问之前压入的值，需要使用\
    \ SP 的正偏移量。\n\n# A64 内存加载指令\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_192_0.png)\n\
    \n- 操作码 DST, DST_, [SRC], Offset\n- 操作码 DST, DST_, [SRC], Offset // 后增位 (Postincrement)\n\
    - 示例：\n\n```\nldr x0, [sp] // 地址 SP+0 处的值\nldr x0, [x29, -8] // 地址 X29-0x8 处的值\n\
    ldp x29, x30, [sp, #16] // X29 + 地址 SP+32 (0x20) 处的值\nldp x29, x30, [sp] // X30\
    \ + 地址 SP+0 处的值\n// SP -> SP+16 (0x10)\n```\n\n常量编码在指令中，但我们需要任意值，必须从内存中获取。方括号表示相对于存储在某个寄存器中的地址的内存访问。还有在加载后调整寄存器值的选项，称为“后增位”，该值可以是负数。\n\
    \n# A64 内存存储指令\n\n- 操作码 SRC, SRC2, [DST, Offset]\n- 操作码 SRC, SRC2, [DST, Offset]\
    \ // 前增位 (Preincrement)\n- 示例：\n\n```\nstr x0, [sp, #16]              // x0 ->\
    \ 地址 SP+16 (0x10) 处的值\nstr x0, [x29, #-8]           // x0 -> 地址 SP+32 处的值\nstp\
    \ x29, x30, [sp, #32]           // x29 -> 地址 SP+40 (0x28) 处的值\nst x29, x30, [sp,\
    \ #-16]!          // SP -> SP-16 (-0x10)\n                                   \
    \  // x29 -> 设置地址 SP 处的值\n                                     // x29 -> 设置地址\
    \ SP+8 处的值\n```\n\n存储操作数的顺序与其他指令相反。存在在存储前增位寄存器值的可能性。\n\n# A64 流指令\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_194_0.png)\n\
    \n- 操作码 DST, SRC\n- 示例：\n\n```\nadrp x0, 0x42000          // x0 ← 0x42000\nb \
    \     0x1049fc1          // (goto 0x1049fc1)\nbr     x17               // PC ←\
    \ x17\nbl     0x1049fc4          // goto 0x1049fc4)\n```\n\n由于每条指令的大小为 4 字节（32\
    \ 位），因此只能编码 4GB 地址范围的一部分，可以通过相对于当前 PC 的偏移或通过 ADRP 指令来实现。跳转（无条件分支）通过 B 指令实现。函数调用通过\
    \ BL（跳转并链接）指令实现。\n\n# A64 参数\n\n在 ARM64 Linux 平台上，前八个参数通过寄存器（X0-X7）传递，其余通过栈位置传递。\n\
    \n# 结构体参数\n\n调用静态成员函数时，第一个参数是隐式的并通过 X0 传递。其余参数按常传递。\n\n# 函数对象与 Lambda\n\nLambda\
    \ 在内部实现为函数对象。代码示例：\n\n```cpp\nstruct MyStruct {\n    int a;\n    int foo(int i,\
    \ MyStruct* this) {\n        return a + i + this->a;\n    }\n};\n```\n\n等等，更准确的：\n\
    ```cpp\nstruct lambda_0 {\n    auto operator()(int x) const { return -x; }\n};\n\
    auto negate = [](int x) { return -x; };\n```\n\n# Lambda 示例\n\n```cpp\nstruct\
    \ lambda_0 {\n    auto operator()(int x) const { return -x; }\n} negate;\nauto\
    \ negate = []() { return -x; };\n```\n\n# 捕获与闭包\n\n在 Lambda 代码内部，可以通过拷贝或引用使用外部作用域内的局部对象。\n\
    \n```cpp\n{\n    int b;\n    auto negate1 = [](int x) { return b - x; };\n   \
    \ auto negate2 = [](int x) { return - x; };\n    auto negate4 = [&](int x) { return\
    \ - x; };\n    auto negate5 = [&](int x) { return b - x; }; negate5(10);\n   \
    \ auto negate6 = [&](int x) { return b - x; }; negate6(10);\n}\n```\n\n"
