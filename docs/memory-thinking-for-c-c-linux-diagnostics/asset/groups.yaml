    # Preface


    This full-color reference book is a part of the Accelerated C & C++ for Linux
    Diagnostics training course organized by Software Diagnostics Services (www.patterndiagnostics.com).
    The text contains slides, brief notes highlighting particular points, and replicated
    source code fragments that are easy to copy into your favorite IDE. The book''s
    detailed Table of Contents makes the usual Index redundant. We hope this reference
    is helpful for the following audiences:


    - C and C++ developers who want to deepen their knowledge;

    - Software engineers developing and maintaining products on Linux platforms;

    - Technical support, escalation, DevSecOps, cloud and site reliability engineers
    dealing with complex software issues;

    - Quality assurance engineers who test software on Linux platforms;

    - Security and vulnerability researchers, reverse engineers, malware and memory
    forensics analysts.


