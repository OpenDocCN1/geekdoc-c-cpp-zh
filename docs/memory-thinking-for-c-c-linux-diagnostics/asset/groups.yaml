    Finally, the RAII idiom is specifically about managing resources, including memory,'
  - "[PAGE 247]\n\n# RAII Definition\n\n```\nstruct Resource {\n  Resource Acquisition\
    \ Is Initialization\n  Resource() {\n    // acquire resource, e.g., new\n    //\
    \ initialize resource, e.g., set memory values to 0\n  }\n  ~Resource() {\n  \
    \  // release resource, e.g., delete\n  }\n}\n```\n\nAn RAII structure encapsulates\
    \ simultaneous “atomic” resource acquisition and initialization in its constructors\
    \ and includes resource release logic in its destructor.\n\nThe code example:\n\
    \n```\nstruct Resource {\n  Resource() {\n    // acquire resource, e.g., new\n\
    \    // initialize resource, e.g., set memory values to 0\n  }\n  ~Resource()\
    \ {\n    // release resource, e.g., delete\n  }\\}\n```"
- md: "\n# RAII Advantages\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_248_0.png)\n\
    \nThere are several advantages to using the RAII idiom. When going out of scope,\
    \ it automatically releases a resource due to a called destructor:\n\n```cpp\n\
    void foo() { Resource r; }\n```\n\nIn the presence of exceptions, the destructor\
    \ releases the acquired resource automatically. All these contribute to the predictable\
    \ resource life cycle.\n\n```cpp\n{\n    Resource r;\n    throw -1;\n} catch (...)\
    \ {\n}\n```\n\n# File Descriptor RAII\n\n```cpp\nFile Descriptor RAII\nstruct\
    \ RAII_FD : FD {\n  int fd;\n  RAII_FD(int _fd) : FD(&fd, fdDeleter), fd(_fd)\
    \ {};\n  void operator=(int _fd) { FD::reset(); fd = _fd;\n    FD::reset(&fd);\
    \ }\n  operator int() const { return fd; }\n  private:\n  int fd;\n};\n\nint foo\
    \ () \n{\n  RAII_FD fd = ::open(...);\n  if (fd == -1)\n    // ...\n    return\
    \ -1;\n  return 0;\n}\n```\n\nThe code example of encapsulating file descriptors\
    \ using the RAII idiom. We reuse the FD type from the previous Descriptors as\
    \ Unique Pointers slide:\n\n```cpp\nstruct RAII_FD : FD {\n  int fd;\n  RAII_FD(int\
    \ _fd) : FD(&fd, fdDeleter), fd(_fd) {};\n  void operator=(int _fd) { FD::reset();\
    \ fd = _fd;\n    FD::reset(&fd); }\n  operator int() const { return fd; }\n  private:\n\
    \  int fd;\n};\n\nint foo () \n{\n  RAII_FD fd = ::open(...);\n  if (fd == -1)\n\
    \    // ...\n    return -1;\n  return 0;\n}\n```\n\n# Threads and Synchronization\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_250_0.png)\n\nOur final section in\
    \ this edition is about threads and synchronization in C++.\n\n# Threads in C/C++\n\
    \n```cpp\nvoid *thread_proc (void *arg)\n{\n    sleep((unsigned long)arg);\n \
    \   return 0;\n}\n\nvoid foo()\n{\n    pthread_t tid;\n\n    pthread_create(&tid,\
    \ NULL, thread_proc, (void *));\n}\n```\n\nTraditional C/C++ threading using raw\
    \ pthread API is limited. Passing any parameter type and casting it is error-prone.\n\
    \nThe code example:\n\n```cpp\nvoid *thread_proc (void *arg)\n{\n    sleep((unsigned\
    \ long)arg);\n    return 0;\n}\n\nvoid foo()\n{\n    pthread_t tid;\n    pthread_create\
    \ (&tid, NULL, thread_proc, (void*)5);\n}\n```\n\n# Threads in C++ Proper\n\n\
    ```cpp\n// functions, function objects, lambdas\nvoid threadProcCpp(int param,\
    \ std::string msg)\n{\n    std::sleep(param);\n    std::cout <<\n        \"New\
    \ Thread Created!\" + msg << std::endl;\n}\n\nvoid foo()\n{\n    std::thread threadProcCpp(threadProcCpp,\
    \ 6, \"Hello\");\n    //...\n    threadProcCpp.join();\n    // std::jthread threadProcCpp(threadProcCpp,\
    \ 6, \"Hello\");\n}\n```\n\nThe proper C++ standard library thread allows the\
    \ utilization of the power of modern C++ abstractions. Please also note the existence\
    \ of jthread that combines both thread creation and join:\n\n```cpp\n// functions,\
    \ function objects, lambdas\nvoid threadProcCpp(int param, std::string msg)\n\
    {\n    std::sleep(param);\n    std::cout <<\n        \"New Thread Created!\" +\
    \ msg << std::endl;\n}\n\nvoid foo()\n{\n    std::thread threadProcCpp(threadProcCpp,\
    \ 6, \"Hello\");\n    //...\n    threadProcCpp.join();\n    // std::jthread threadProcCpp(threadProcCpp,\
    \ 6, \"Hello\");\n}\n```\n\n# Synchronization Problems\n\n```cpp\nlong counter{0};\n\
    \nvoid threadProcCpp(std::string msg)\n{\n    while (true)\n    {\n        std::cout\
    \ << msg << \" \" << ++counter << std::endl;\n    }\n}\n\nvoid foo()\n{\n    std::jthread\
    \ thread1(threadProcCpp, \"Hello1\");\n    std::jthread thread2(threadProcCpp,\
    \ \"Hello2\");\n}\n\n// Hello2: 1694\n// : 1695\n```\n\nIn the code example, the\
    \ output from << operators from different threads is mixed and looks like garbage:\n\
    \n```cpp\nlong counter{0};\n\nvoid threadProcCpp(std::string msg)\n{\n    while\
    \ (true)\n    {\n        std::cout << msg << \" \" << ++counter << std::endl;\n\
    \    }\n}\n\nvoid foo()\n{\n    std::jthread thread1(threadProcCpp, \"Hello1\"\
    );\n    std::jthread thread2(threadProcCpp, \"Hello2\");\n}\n\n// Hello2: 1694\n\
    // : 1695\n```\n\n# Synchronization Solution\n\n```cpp\nSynchronization Solution\n\
    std::atomic<long> counter{0};\nstd::mutex m;\n\nvoid threadProcCpp(std::string\
    \ msg)\n{\n    while (true)\n    {\n        std::scoped_lock lock(m);\n      \
    \  std::cout << msg << \" \" << ++counter << std::endl;\n    }\n}\n\nvoid foo()\n\
    {\n    std::jthread thread1(threadProcCpp, \"Hello1\");\n    std::jthread thread2(threadProcCpp,\
    \ \"Hello2\");\n}\n```\n\nThe following code example solves the data race problem\
    \ by guarding access via scoped_lock that is implemented using mutex:\n\n```cpp\n\
    std::atomic<long> counter{0};\nstd::mutex m;\n\nvoid threadProcCpp(std::string\
    \ msg)\n{\n    while (true)\n    {\n        std::scoped_lock lock(m);\n      \
    \  std::cout << msg << \" \" << ++counter << std::endl;\n    }\n}\n\nvoid foo()\n\
    {\n    std::jthread thread1(threadProcCpp, \"Hello1\");\n    std::jthread thread2(threadProcCpp,\
    \ \"Hello2\");\n}\n```\n\n# Resources\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_255_0.png)\n\
    \nNow, I have a few slides about references and resources for further reading.\n\
