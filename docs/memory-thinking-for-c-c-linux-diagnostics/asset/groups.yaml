  - '[PAGE 70]


    # Size


    ```

    Size


    * sizeof operator


    * size_t size = sizeof(int);


    * int i; size = sizeof i;


    * size = sizeof(1 + 1);

    ```


    The sizeof operator can evaluate the size of types, variables, and target result
    types of expressions (without expression evaluation).


    The code example:


    ```

    size_t size = sizeof(int);


    int i;


    size = sizeof i;

    size = sizeof(1 + 1);

    ```'
  - '[PAGE 71]


    # Alignment


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_71_0.png)


    Variables are usually aligned in memory at offsets divisible by their type size
    value in bytes. You can get default alignment values using the alignof operator
    and change the default alignment using the alignas specifier.


    The code example:


    ```

    size_t align = alignof(long)

    alignas(4096) long l = 1;

    ```'
  - '[PAGE 72]


    # LP64


    ```

    sizeof(int) == 4

    sizeof(int *) == 8

    sizeof(long) == 8

    sizeof(long long) == 8

    ```


    markdown": "Linux uses the so-called LP64 data model, where long integers and
    pointers are 64-bit.'
  - '[PAGE 73]


    # Nothing and Anything


    ```

    void foo(void);

    void *p;

    ```


    Two distinct types correspond to the concepts of Nothing and Anything can find
    in other programming languages: void and void *. The latter is a pointer to any
    type.


    The code example:


    ```

    void foo(void);

    void *p;

    ```'
- md: "\n# Automatic Type Inference\n\n```cpp\nauto a = \"Hello\";\n\nauto func(decltype(\"\
    Hello\") cstr) {\n    return cstr;\n}\n```\n\nC++11 added automatic type specification,\
    \ so the type is deduced from the initializing expression.\n\nThe code example:\n\
    \n```cpp\nauto a = \"Hello\";\nauto func(decltype(\"Hello\") cstr) {\n    return\
    \ cstr;\n}\n```\n\n# Entity Conversion\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_75_0.png)\n\
    \nAs you anticipate, the same memory cell addresses and their values are the basis\
    \ of conversion between different entity types. So, let's look at some examples.\n\
    \n# Pointer Conversion (C-Style)\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_76_0.png)\n\
    \n| 2ab1000 | 12 | 2ab1216 | 2ab1000 |\n|---|---|---|---|\n| 2ab1001 | 34 | unsigned\
    \ char b; int i; | |\n| 2ab1002 | 56 | unsigned char *pb; // pb == 2ab1000 | |\n\
    | 2ab1003 | 78 | // 2ab1216 b = *pb; // b == 12 | |\n| 2ab1004 | ab | int *pi\
    \ = (int *)pb; // pi == 2ab1000 | |\n| 2ab1005 | cd | &pi; // != 2ab1216 i = *pi;\
    \ // i == 0x78563412 // | |\n\nPointers can be converted to each other freely\
    \ because their value is just a memory address. However, when we dereference them,\
    \ we get the value based on underlying memory contents, which don't change as\
    \ illustrated here. Please also note that due to the least significant endian\
    \ convention, the integer value we get differs from the memory layout byte order.\n\
    \nThe code example corresponding to the memory diagram:\n\n```\nunsigned char\
    \ b; int i;\nunsigned char *pb; // pb == 2ab1000\n&pb; // 2ab1216\nb = *pb; //\
    \ b == 12\nint *pi = (int *)pb; // pi == 2ab1000\n&pi; // != 2ab1216\ni = *pi;\
    \ // i == 0x78563412\n// Intel LSB endian\n```\n\n# Numeric Promotion/Conversion\n\
    \n```cpp\nNumeric Promotion/Conversion\n\nchar c = 'a'; int n = c;\n\nshort s\
    \ = c;\n\nint n = 0x1234; char c = n;\n```\n\nValues from the lesser range of\
    \ values can be automatically promoted to types with a wider range of values.\
    \ The opposite automatic conversion can lose some bits of information and should\
    \ be carefully reviewed.\n\nThe code example:\n\n```\nchar c = 'a';\nint n = c;\n\
    short s = c;\nint n = 0x1234;\nchar c = n;\n```\n\n# Numeric Conversion\n\n```cpp\n\
    (type)(expr) // C-Style\n```\n\n```cpp\nstatic_cast<type>(expr)\n```\n\n```cpp\n\
    for (unsigned i = 0xffff; (int)i >= 0; --i)\n{}\n```\n\n```cpp\nfor (unsigned\
    \ i = 0xffff; static_cast<int>(i) >= 0; --i)\n{}\n```\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_78_0.png)\n\
    \nIn the absence of automatic conversion for compatible types, we can use C-style\
    \ casts or explicit, specific C++ casts.\n\nThe following code examples solve\
    \ the problem with the infinite loop:\n\n```\nfor (unsigned i = 0xffff; (int)i\
    \ >= 0; --i)\n{}\n```\n\n```\nfor (unsigned i = 0xffff; static_cast<int>(i) >=\
    \ 0; --i)\n{}\n```\n\n# Incompatible Types\n\n```\nIncompatible Types\n* (type)(expr)\
    \ // C-Style\n* reinterpret_cast<type>(expr)\nint *p = (int *)1;\np = reinterpret_cast<int\
    \ *>(1);\n```\n\nWhen types are incompatible, for example, integers and pointers\
    \ to them, we can use either C-style casts or the specific C++ type reinterpretation\
    \ cast.\n\nThe code example:\n\n```\nint *p = (int *)1;\np = reinterpret_cast<int\
    \ *>(1);\n```\n\n# Forcing\n\n```cpp\nstruct A\n{\n    unsigned int u1;\n    unsigned\
    \ int u2;\n};\nstruct B\n{\n    unsigned long ul;\n} b;\n\nA a = *(reinterpret_cast<A*>(&b));\n\
    a = *(reinterpret_cast<A*>(&b));\n```\n\nDifferent structures are even more incompatible\
    \ with the failing direct C++ reinterpretation cast. However, we can force reinterpretation\
    \ of structures by reinterpreting a pointer to a source structure as a pointer\
    \ to a target structure and then dereferencing it. In such case, the underlying\
    \ memory cells are reinterpreted as the target structure values. You can review\
    \ the code example after studying the next sections on structures and memory:\n\
    \n```\nstruct A\n{\n    unsigned int u1;\n    unsigned int u2;\n};\nstruct B\n\
    {\n    unsigned long ul;\n} b;\n```\n\n```cpp\nA a = reinterpret_cast<A*>(&b);\n\
    a = *reinterpret_cast<A*>(&b);\n```\n\n# Structures, Classes, and Objects\n\n\
    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_82_0.png)\n\nNow, we cover structures,\
    \ classes, and their objects.\n\n# Structures\n\n```cpp\nstruct MyStruct {\n \
    \   int field;\n    // ...\n}\nstruct MyStruct myStruct;\nMyStruct my2;\nstruct\
    \ MyStruct *pMyStruct;\nMyStruct *pStruct2;\nstruct {\n    int field;\n    //\
    \ ...\n} myOtherStruct;\nstruct {\n    int field;\n    // ...\n} *pOtherStruct;\n\
    ```\n\nWe can view structures as collections of fields laid out in memory. Structures\
    \ may have names or can be anonymous on the right.\n\nThe code example:\n\n```cpp\n\
    struct MyStruct {\n    int field;\n    // ...\n}\nstruct MyStruct myStruct;\n\
    MyStruct my2;\nstruct MyStruct *pMyStruct;\nMyStruct *pMyStruct2;\nstruct {\n\
    \    int field;\n    // ...\n} myOtherStruct;\nstruct {\n    int field;\n    //\
    \ ...\n} *pOtherStruct;\n```\n\n# Access Level\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_84_0.png)\n\
    \n```cpp\nstruct MyStruct {\n  public:\n  int field1;\n  private:\n  int field2;\n\
    } myStruct;\n\nmyStruct.field1 = 1;\nmyStruct.field2 = 2;\n```\n\nFields with\
    \ the private access specifier cannot be referenced from the outside.\n\nThe code\
    \ example:\n\n```cpp\nstruct MyStruct {\n  public:\n  int field1;\n  private:\n\
    \  int field2;\n} myStruct;\n\nmyStruct.field1 = 1;\n// myStruct.field2 = 2\n\
    ```\n\n# Classes and Objects\n\n```cpp\nclass MyClass {\n    int field;\n    //\
    \ ...\n}\n\nclass MyClass MyClass;\nMyClass my2;\n\nclass MyClass *pMyClass;\n\
    MyClass *pMyClass2;\nclass {\n    int field;\n    // ...\n} myOtherClass;\n```\n\
    \nClasses have the same structure.\n\nThe code example:\n\n```cpp\nclass MyClass\
    \ {\n    int field;\n    // ...\n}\n\nclass MyClass MyClass;\nMyClass my2;\nclass\
    \ MyClass *pMyClass;\nMyClass *pMyClass2;\nclass {\n    int field;\n    // ...\n\
    } myOtherClass;\nclass {\n    int field;\n    // ...\n} *pOtherClass;\n```\n\n\
    # Structures and Classes\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_86_0.png)\n\
    \nBoth structures and classes are completely the same in C++ and can be used interchangeably.\
    \ This is why you can always see struct in good modern C++ books. The only difference\
    \ (if we ignore inheritance for now) is the field access, which is public by default\
    \ in structures and private in classes.\n\nThe code example:\n\n```cpp\nstruct\
    \ tagStruct {\n// public:\nint field;\n// ...\n};\nclass tagClass {\npublic: //\
    \ (private: by:)\nint field;\n// ...\n};\n```\n\n# Pointer to Structure\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_87_0.png)\n\
    \nHere, we go again through our conceptual philosophy of pointers pictures and\
    \ annotate them with C and C++ code.\n\nThe code example:\n\n```cpp\nMyStruct\
    \ *pMyStruct = &myStruct;\n```\n\n# Pointer to Structure Dereference\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_88_0.png)\n\
    \nHere, we dereference a pointer to some structure. We get the structure value\
    \ and copy-assign it to the myStruct variable.\n\nThe code example:\n\n```cpp\n\
    MyStruct myStruct = *pMyStruct;\n```\n\n# Many Pointers to One Structure\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_89_0.png)\n\
    \nHere, we assign the value of one pointer to another, and both now point to the\
    \ same structure.\n\nThe code example:\n\n```cpp\nMyStruct *pMyStruct = &myStruct;\n\
    MyStruct *pMyStruct2 = pMyStruct;\n```\n\n# Many to One Dereference\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_90_0.png)\n\
    \nIf we dereference both, we get the same value with the same address.\n\nThe\
    \ code example:\n\n```cpp\nassert(&pMyStruct == &pMyStruct2);\n```\n\n# Invalid\
    \ Pointer to Structure\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_91_0.png)\n\
    \nHere, we depict an uninitialized pointer that, depending on the memory storage\
    \ type, can be a NULL pointer or some random value.\n\nThe code example:\n\n```cpp\n\
    MyStruct *pMyStruct;\n```\n\n# Invalid Pointer Dereference\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_92_0.png)\n\
    \nDereferencing an uninitialized pointer can have undefined behavior, most likely\
    \ an access violation leading to a crash.\n\nThe code example:\n\n```cpp\nMyStruct\
    \ *pMyStruct;\nMyStruct myStruct = *pMyStruct;\n```\n"
  mdcn: "\n\n# 自动类型推导\n\n```cpp\nauto a = \"Hello\";\n\nauto func(decltype(\"Hello\"\
    ) cstr) {\n    return cstr;\n}\n```\n\nC++11 增加了自动类型规格，因此类型是从初始化表达式中推导出的。\n\n\
    代码示例：\n\n```cpp\nauto a = \"Hello\";\nauto func(decltype(\"Hello\") cstr) {\n\
    \    return cstr;\n}\n```\n\n# 实体转换\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_75_0.png)\n\
    \n正如你所预期的，相同的内存单元地址及其值是不同实体类型之间转换的基础。现在，让我们来看一些示例。\n\n# 指针转换（C 风格）\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_76_0.png)\n\
    \n| 2ab1000 | 12 | 2ab1216 | 2ab1000 |\n|---|---|---|---|\n| 2ab1001 | 34 | unsigned\
    \ char b; int i; | |\n| 2ab1002 | 56 | unsigned char *pb; // pb == 2ab1000 | |\n\
    | 2ab1003 | 78 | // 2ab1216 b = *pb; // b == 12 | |\n| 2ab1004 | ab | int *pi\
    \ = (int *)pb; // pi == 2ab1000 | |\n| 2ab1005 | cd | &pi; // != 2ab1216 i = *pi;\
    \ // i == 0x78563412 // | |\n\n指针可以自由转换，因为它们的值只是内存地址。然而，当我们对它们进行解引用时，我们得到的是基于内存内容的值，如此处所示，这些内容不会改变。请注意，由于低位优先字节序约定，我们得到的整数值与内存布局的字节顺序不同。\n\
    \n与内存图对应的代码示例：\n\n```\nunsigned char b; int i;\nunsigned char *pb; // pb == 2ab1000\n\
    &pb; // 2ab1216\nb = *pb; // b == 12\nint *pi = (int *)pb; // pi == 2ab1000\n\
    &pi; // != 2ab1216\ni = *pi; // i == 0x78563412\n// Intel LSB endian\n```\n\n\
    # 数值提升/转换\n\n```cpp\nNumeric Promotion/Conversion\n\nchar c = 'a'; int n = c;\n\
    \nshort s = c;\n\nint n = 0x1234; char c = n;\n```\n\n来自较小范围的值可以自动提升为范围更宽的类型。相反的自动转换可能会丢失某些信息，应该经过仔细检查。\n\
    \n代码示例：\n\n```\nchar c = 'a';\nint n = c;\nshort s = c;\nint n = 0x1234;\nchar\
    \ c = n;\n```\n\n# 数值转换\n\n```cpp\n(type)(expr) // C 风格\n```\n\n```cpp\nstatic_cast<type>(expr)\n\
    ```\n\n```cpp\nfor (unsigned i = 0xffff; (int)i >= 0; --i)\n{}\n```\n\n```cpp\n\
    for (unsigned i = 0xffff; static_cast<int>(i) >= 0; --i)\n{}\n```\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_78_0.png)\n\
    \n在兼容类型没有自动转换的情况下，我们可以使用 C 风格强制转换或显式的、特定的 C++ 强制转换。\n\n以下代码示例解决了无限循环的问题：\n\n```\n\
    for (unsigned i = 0xffff; (int)i >= 0; --i)\n{}\n```\n\n```\nfor (unsigned i =\
    \ 0xffff; static_cast<int>(i) >= 0; --i)\n{}\n```\n\n# 不兼容类型\n\n```\nIncompatible\
    \ Types\n* (type)(expr) // C 风格\n* reinterpret_cast<type>(expr)\nint *p = (int\
    \ *)1;\np = reinterpret_cast<int *>(1);\n```\n\n当类型不兼容时（例如整数和指向它们的指针），我们可以使用 C\
    \ 风格强制转换或特定的 C++ 类型重新解释转换。\n\n代码示例：\n\n```cpp\nint *p = (int *)1;\np = reinterpret_cast<int\
    \ *>(1);\n```\n\n# 强制（转换）\n\n```cpp\nstruct A\n{\n    unsigned int u1;\n    unsigned\
    \ int u2;\n};\nstruct B\n{\n    unsigned long ul;\n} b;\n\nA a = *(reinterpret_cast<A*>(&b));\n\
    a = *(reinterpret_cast<A*>(&b));\n```\n\n不同的结构更加不兼容，直接的 C++ 重新解释转换会失败。然而，我们可以通过将指向源结构的指针重新解释为指向目标结构的指针并对其进行解引用，强制重新解释结构。在这种情况下，底层内存单元被重新解释为目标结构的值。在学习了关于结构和内存的后续章节后，你可以查看代码示例：\n\
    \n```\nstruct A\n{\n    unsigned int u1;\n    unsigned int u2;\n};\nstruct B\n\
    {\n    unsigned long ul;\n} b;\n```\n\n```cpp\nA a = *(reinterpret_\n<A*>(&b));\n\
    a = *(reinterpret_cast<A*>(&b));\n```\n\n# 结构、类和对象\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_82_0.png)\n\
    \n现在，我们涵盖结构、类和它们的对象。\n\n# 结构\n\n```cpp\nstruct MyStruct {\n    int field;\n  \
    \  // ...\n}\nstruct MyStruct myStruct;\nMyStruct my2;\nstruct MyStruct *pMyStruct;\n\
    MyStruct *pStruct2;\nstruct {\n    int field;\n    // ...\n} myOtherStruct;\n\
    struct {\n    int field;\n    // ...\n```\n\n我们可以将结构视为内存中布局的字段集合。结构可以有名称，也可以是匿名的。\n\
    \n代码示例：\n\n```cpp\nstruct MyStruct {\n    int field;\n    // ...\n}\nstruct MyStruct\
    \ myStruct;\nMyStruct my2;\nstruct MyStruct *pMyStruct;\nMyStruct *pStruct2;\n\
    struct {\n    int field;\n    // ...\n} myOtherStruct;\nstruct {\n    int field;\n\
    \    // ...\n} *pOtherStruct;\n```\n\n# 访问级别\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_84_0.png)\n\
    \n```cpp\nstruct MyStruct {\n  public:\n  int field1;\n  private:\n  int field2;\n\
    } myStruct;\n\nmyStruct.field1 = 1;\n// myStruct.field2 = 2\n```\n\n带有 `private`\
    \ 访问符的字段无法从外部引用。\n\n代码示例：\n\n```cpp\nstruct MyStruct {\n  public:\n  int field1;\n\
    \  private:\n  int field2;\n} myStruct;\n\nmyStruct.field1 = 1;\n// myStruct.field2\
    \ = 2\n```\n\n# 类和对象\n\n```cpp\nclass MyClass {\n    int field;\n    // ...\n\
    }\n\nclass MyClass MyClass;\nMyClass my2;\n\nclass MyClass *pMyClass;\nclass MyClass\
    \ *pClass2;\nclass {\n    int field;\n    // ...\n} myOtherClass;\nclass {\n \
    \   int field;\n    // ...\n} *pOtherClass;\n```\n\n类具有相同的结构。\n\n代码示例：\n\n```cpp\n\
    class MyClass {\n    int field;\n    // ...\n}\n\nclass MyClass MyClass;\nMyClass\
    \ my2;\n\nclass MyClass *pMyClass;\nclass MyClass *pClass2;\nclass {\n    int\
    \ field;\n    // ...\n} myOtherClass;\nclass {\n    int field;\n    // ...\n}\
    \ *pOtherClass;\n```\n\n# 结构和类\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_86_0.png)\n\
    \n结构和类在 C++ 中是完全相同的，可以交叉使用。这就是为什么你可以在良好的 C++ 书中总是看到 `struct`。唯一的区别（如果我们现在忽略继承的话）是字段访问，结构中默认是\
    \ `public` 的，而类中是 `private` 的。\n\n代码示例：\n\n```cpp\nstruct tagStruct {\n// public:\n\
    int field;\n// ...\n};\nclass tagClass {\npublic: // (private: by:)\nint field;\n\
    // ...\n};\n```\n\n# 指向结构\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_87_0.png)\n\
    \n在这里，我们再次通过指针的概念图，并用 C 和 C++ 代码对其进行注释。\n\n代码示例：\n\n```cpp\nMyStruct *pMyStruct\
    \ = &myStruct;\n```\n\n# 指向结构解引用\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_88_0.png)\n\
    \n在这里，我们对某些结构的指针进行解引用。我们得到结构的值并将其赋值给 `myStruct` 变量。\n\n代码示例：\n\n```cpp\nMyStruct\
    \ myStruct = *pMyStruct;\n```\n\n# 指向结构的多个指针\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_89_0.png)\n\
    \n在这里，我们将一个指针的值赋值给另一个指针，它们现在都指向同一个结构。\n\n代码示例：\n\n```cpp\nMyStruct *pMyStruct\
    \ = &myStruct;\nMyStruct *pMyStruct2 = pMyStruct;\n```\n\n# 多对一解引用\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_90_0.png)\n\
    \n如果我们对两者都解引用，我们将得到相同地址的相同。\n\n代码示例：\n\n```cpp\nassert(&pMyStruct == &pMyStruct2);\n\
    ```\n\n# 无效结构指针\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_91_0.png)\n\n在这里，我们描述了一个未定义的指针，根据内存存储类型，它可以是一个\
    \ NULL 指针或某些随机值。\n\n代码示例：\n\n```cpp\nMyStruct *pMyStruct;\n```\n\n# 无效指针解引用\n\n\
    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_92_0.png)\n\n对未定义的指针进行解引用会导致未定义行为，最可能导致访问违规并崩溃。\n\
    \n代码示例：\n\n```cpp\nMyStruct *pMyStruct;\nMyStruct myStruct = *pMyStruct;\n```\n"
