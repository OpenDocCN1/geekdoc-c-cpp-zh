    \n## Lambda 表达式\n\n- 间插：必要的 x64 和 A64 反汇编\n- 无名函数对象\n- 一个函数参数\n- 可选捕获上下文\n- 返回值\n\
    \n在讨论 C++11 引入的 lambda 及其内部机制之前，我们先简单回顾基础的 x64 和 A64 反汇编。\n\n## x64 CPU 寄存器\n\n\
    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_181_0.png)\n\n有熟悉的 32 位 CPU 寄存器名称，例如\
    \ EAX，它们被扩展为 64 位名称，如 RAX。它们大多数在传统上是专门的，例如 ALU（算术逻辑单元）、计数器和内存复制寄存器。尽管现在它们都可以作为通用寄存器使用。当然，还有一个栈指针\
    \ RSP，此外还有一个帧指针 RBP，用于寻址局部变量和保存的参数。在某些编译器代码生成实现中，RBP 也用作通用寄存器，而 RSP 承担帧指针的角色。指令指针\
