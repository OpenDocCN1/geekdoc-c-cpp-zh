    \ *pms) {\n  pms->field = 0;\n}\n\nfunc(&MyStruct);\n```\n\n```\nvoid func(int\
    \ &ri) {\n  ri = 0;\n}\n\nint i{0};\nfunc(i);\n```\n\nIf we want efficiency for\
    \ structures and also preserve changes to original values, we need to pass by\
