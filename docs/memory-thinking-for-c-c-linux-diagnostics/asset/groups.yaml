    \n```\nint foo (int i)\n{\n// ...\nreturn 0;\n}\n```\n\nIt is possible to have\
    \ pointers and references to functions:\n\n```\nint (*pf) (int) {foo};\npf = &foo;\n\
    int (*rf) (int) {*pf};\n```\n\nWhen having a pointer or reference to a function,\
    \ it is possible to call the function with or without using the dereferencing\
    \ syntax (*):\n\n```\npf(10);\n(*pf)(10);\nrf(10);\n```\n\n# Function Pointer\
    \ Types\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_152_0.png)\n\nFunction pointer\
    \ type declarations can be done using the classic typedef syntax or via the more\
    \ modern using type alias.\n\nThe code examples:\n\n```\ntypedef int (*PF)(int);\n\
    using PF = int (*)(int);\nPF func{foo}; func(10);\n```\n\n# Reading Declarations\n\
    \n- * Right → Left. []<sub>right</sub> or ()<sub>right</sub> → Right\n\n- * Examples:\n\
    \n```\nconst int* const* * [10];\n\nint (*difficult)(int (*) (int, int))(int);\n\
    using DF = (*)( int);\nDF difficult2{difficult};\n```\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_153_0.png)\n\
    \nIt is worth knowing the rules of reading declarations since function pointer\
    \ types can be quite complicated. The first example reads as an array of 10 elements,\
    \ with each element a pointer to a pointer of constant pointers to constant integers.\
    \ The next example is a pointer to a function that accepts a pointer to a function\
    \ that accepts an integer and returns an integer, and accepts another integer,\
    \ and returns a pointer to a function that accepts an integer and returns an integer.\
    \ It can be simplified by using the common subtype PF. We can verify the compatibility\
    \ of the two descriptions by initialization. GPT-4 is very good at deciphering\
    \ such types.\n\n```\nconst int* const*arr[10];\n```\n\n```\nint (*difficult)(int\
    \ (*) (int, int))(int);\nusing DF = PF (*) (PF, int);\nDF difficult2{difficult};\n\
    ```\n\n# Structure Function Fields\n\n```\nstruct\n{\n    int field;\n    PF pFunc;\n\
    } myStruct {0, Foo};\nmyStruct.pFunc(0);\n```\n\nStructures may contain fields\
    \ that are pointers to functions: the obvious way to implement OOP in C.\n\nThe\
    \ code example:\n\n```\nstruct\n{\n    int field;\n    PF pFunc;\n} myStruct {0,\
    \ foo};\n```\n\nmyStruct.pFunc(0);\n\n# Structure Methods\n\n```\nstruct MyStruct\
    \ {\n  int field;\n  PF pFunc;\n  int method (int i);\n} myStruct{0, foo};\n\n\
    int MyStruct::method(int i) { return i; }\n\nmyStruct pFunc(0);\nmyStruct.method(0);\n\
    ```\n\nC++ introduced structure or class methods. They can be defined either inside\
    \ the structure definition (next slide) or outside with the structure name qualification.\n\
    \nThe code example:\n\n```cpp\nstruct MyStruct {\n  int field;\n  PF pFunc;\n\
    \  int method (int i);\n} myStruct{0, foo};\n\nint MyStruct::method(int i) { return\
    \ i; }\n\nmyStruct pFunc(0);\nmyStruct.method(0);\n```\n\n# Structure Methods\
    \ (Inlined)\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_156_0.png)\n\nThis is\
    \ an alternative way to define functions, although it exposes implementation details.\n\
    \nThe code example:\n\n```cpp\nstruct MyStruct\n{\n    int field;\n    PF pFunc;\n\
    \    int method (int i) { return i; }\n} myStruct {0, foo};\n\nmyStruct pFunc(0);\n\
    myStruct.method(0);\n```\n\n# Structure Methods (Inheritance)\n\n```cpp\nstruct\
    \ Base\n{\n    int method (int i) { return i; }\n};\nstruct Derived : Base\n{\n\
    \    int method (int i) { return ++i; }\n} myDerived;\n```\n\nThe previous problem\
    \ is solved by introducing type-independent virtual methods. In the case of inheritance,\
    \ like fields, the derived structure hides methods with the same name in the base\
    \ type unless explicit base type qualification is used. However, when we have\
    \ a pointer to a base type, the base method is called even if the actual object\
    \ belongs to the derived type:\n\n```cpp\nstruct Base\n{\n    int method (int\
    \ i) { return i; }\n};\nstruct Derived : Base\n{\n    int method (int i) { return\
    \ ++i; }\n} myDerived;\n\nmyDerived.method(0);\nmyDerived.Base::method(0);\n\n\
    Base *pBase = &myDerived;\npBase->method(0);\n```\n\n# Structure Virtual Methods\n\
    \n```cpp\nstruct Base\n{\n    int method (int i) { return i; }\n    virtual int\
    \ vmethod (int i) { return i; }\n};\nstruct Derived : Base\n{\n    int method\
    \ (int i) { return ++i; }\n    virtual int vmethod (int i) override { return ++i;\
    \ }\n} myDerived;\n```\n\nBase *pBase = &myDerived;\npBase->method(0);\npBase->Base::method(0);\n\
    \n# Structure Pure Virtual Methods\n\n```cpp\nstruct Base\n{\n    int method (int\
    \ i) { return i; }\n    virtual int vmethod (int i) = 0;\n};\nstruct Derived :\
    \ Base\n{\n    int method (int i) { return ++i; }\n    virtual int vmethod (int\
    \ i) override { return ++i; }\n} myDerived;\n```\n\nBase *pBase = &myDerived;\n\
    pBase->vmethod(0);\n\nIf we want to make sure we never define objects of the base\
    \ type and make sure we override all virtual methods in the derived type, we can\
    \ make the virtual functions **pure** by using `= 0`.\n\nThe code example:\n\n\
    ```cpp\nstruct Base\n{\n    int method (int i) { return i; }\n    virtual int\
    \ vmethod (int i) = 0;\n};\n\nstruct Derived : Base\n{\n    int method (int i)\
    \ { return ++i; }\n    virtual int vmethod (int i) override { return ++i; }\n\
    } myDerived;\n\nBase *pBase = &myDerived;\npBase->vmethod(0);\n```\n\n# Structure\
    \ as Interface\n\n```cpp\nstruct {\n    virtual int (int i) = 0;\n    virtual\
    \ int (int i) = 0;\n}\nstruct Implementer : {\n    virtual int vmethod1 (int i)\
    \ override { return ++i; }\n    virtual int vmethod2 (int i) override { return\
    \ ++i; }\n}\nmyObject;\n*pIFace = &myObject;\npIFace->vmethod1(0);\n```\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_162_0.png)\n\
    \nPure virtual functions allow specifying abstract interfaces for the derived\
    \ types to implement.\n\nThe code example:\n\n```cpp\nstruct Interface {\n   \
    \ virtual int vmethod1 (int i) = 0;\n    virtual int vmethod2 (int i) = 0;\n}\n\
    struct Implementer : {\n    virtual int vmethod1 (int i) override { return ++i;\
    \ }\n    virtual int vmethod2 (int i) override { return ++i; }\n}\nmyObject;\n\
    ```\n\nInterface *pIFace = &myObject;\npIFace->vmethod1(0);\n\n# Function Structure\n\
    \n```cpp\nstruct MyFunction\n{\n    int field{1};\n    int operator() { return\
    \ field; }\n} myFunction;\n\nmyFunction();\n```\n\nFunctions may also encapsulate\
    \ state. The best way to do it is via structures that implement function call\
    \ operators.\n\nThe code example:\n\n```cpp\nstruct MyFunction\n{\n    int field{1};\n\
    \    int operator() { return field; }\n} myFunction;\n\n```\n\nmyFunction();\n"
