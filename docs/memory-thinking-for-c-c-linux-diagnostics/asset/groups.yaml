- md: "\n# Structure Constructors\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_164_0.png)\n\
    \nNow, we come to traditional OOP topics in classic C++. Constructors are methods\
    \ with or without arguments for structure initialization with custom initialization\
    \ logic inside, for example, acquiring required resources.\n\nThe code example:\n\
    \n```cpp\nstruct MyFunction {\n    MyFunction(): field{1} { }\n    MyFunction(int\
    \ _field): field{_field} { }\n    int field;\n    int operator() { return field;\
    \ }\n};\nMyFunction myFunction, myFunction2(2);\n\nmyFunction();\nmyFunction2();\n\
    ```\n\n# Structure Copy Constructor\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_165_0.png)\n\
    \nWhen we copy objects but need complex copying logic or nontrivial memory management\
    \ copy methods are quite handy. We pass the source object reference as if we don't\
    \ plan to modify it.\n\nThe code example:\n\n```cpp\nstruct MyFunction\n{\n  \
    \  MyFunction(): field{1} { }\n    MyFunction(int _field): field{_field} { }\n\
    \    MyFunction(const MyFunction& src)\n        : field(src.field) { ++field;\
    \ }\n    int field;\n    int operator() { return field; }\n};\nMyFunction myFunction;\n\
    \nMyFunction myFunction2(myFunction);\nMyFunction myFunction3 = myFunction;\n\
    ```\n\n# Structure Copy Assignment\n\n```cpp\nstruct MyFunction\n{\n    MyFunction():\
    \ field{1} {}\n    MyFunction(int _field): field(_field) {}\n    MyFunction(const\
    \ MyFunction& src)\n        : field(src.field) { ++field; } \n    MyFunction&\
    \ operator=(const MyFunction& src) {\n        if (this != &src) ++(field = src.field);\n\
    \        return *this;\n    }\n\n    int field;\n    int operator() { return field;\
    \ }\n};\n```\n\nMyFunction myFunction2;\nmyFunction = myFunction;\n\nIn the case\
    \ of nontrivial assignments, we can implement an assignment operator. We, however,\
    \ should be careful not to copy to itself (this), and we return the non-const\
    \ reference to itself (*this) to allow chained copies.\n\n```cpp\nstruct MyFunction\n\
    {\n    MyFunction(): field{1} {}\n    MyFunction(int _field): field(_field) {}\n\
    \    MyFunction(const MyFunction& src)\n        : field(src.field) { ++field;\
    \ } \n    MyFunction& operator=(const MyFunction& src) {\n        if (this !=\
    \ &src) ++(field = src.field);\n        return *this;\n    }\n\n    int field;\n\
    \    int operator() { return field; }\n};\n\nMyFunction myFunction2;\nmyFunction\
    \ = myFunction;\n\n# Structure Destructor\n\n```cpp\nstruct MyFunction {\n  MyFunction():\
    \ field{1} { }\n  ~MyFunction() { /* close resources */ }\n  MyFunction(int _field):\
    \ field{field} { }\n  MyFunction(const MyFunction& src)\n    : field(src.field)\
    \ { ++field; }\n  MyFunction&operator=(const MyFunction& src) {\n    if (this\
    \ != &src) ++field = src.field; \n    return *this;\n  }\n  int field;\n  int\
    \ operator() { return field; }\n};\n\n{ MyFunction myFunction; }\n```\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_167_0.png)\n\
    \nWhat if we want some complex logic, for example, releasing resources when the\
    \ local object goes out of scope, or we delete it? Destructor is a method that\
    \ is called automatically in such a case.\n\n```cpp\nstruct MyFunction {\n  MyFunction():\
    \ field{1} { }\n  ~MyFunction() { /* close resources */ }\n  MyFunction(int _field):\
    \ field{field} { }\n  MyFunction(const MyFunction& src)\n    : field(src.field)\
    \ { ++field; }\n  MyFunction&operator=(const MyFunction& src) {\n    if (this\
    \ != &src) ++field = src.field; \n    return *this;\n  }\n  int field;\n  int\
    \ operator() { return field; }\n};\n\n{ MyFunction myFunction; }\n```\n\n# Structure\
    \ Destructor Hierarchy\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_168_0.png)\n\
    \n```cpp\nstruct IFunction\n{\n    ~IFunction() {}\n    virtual int operator()()\
    \ = 0;\n};\nstruct MyFunction : IFunction\n{\n    ~MyFunction() { /* close resources*/}\n\
    \    int field;\n    int operator()() override { return field; }\n};\nIFunction\
    \ *pIFunction = new MyFunction;\npIFunction->operator()();\n(*pIFunction)();\n\
    delete pIFunction; // ~IFunction()\n```\n\nConceptually, destructors are just\
    \ like a normal method, so the wrong one may be called when we have a pointer\
    \ of base type to an object of a derived type.\n\n```cpp\nstruct IFunction\n{\n\
    \    ~IFunction() {}\n    virtual int operator()() = 0;\n}\nstruct MyFunction\
    \ : IFunction\n{\n    ~MyFunction() { /* close resources*/}\n    int field;\n\
    \    int operator()() override { return field; }\n};\nIFunction *pIFunction =\
    \ new MyFunction;\npIFunction->operator()();\n(*pIFunction)();\ndelete pIFunction;\
    \ // ~IFunction()\n```\n\n# Virtual Destructor\n\n```cpp\nstruct IFunction\n{\n\
    \    ~IFunction() {}\n    virtual int operator()() = 0;\n}\nstruct MyFunction\
    \ : IFunction\n{\n    ~MyFunction() { /* close resources*/}\n    int field;\n\
    \    int operator()() override { return field; }\n};\nIFunction *pIFunction =\
    \ new MyFunction;\npIFunction->operator()();\n(*pIFunction)();\ndelete pIFunction;\
    \ // ~IFunction()\n```\n\n# Virtual Destructor\n\n```cpp\nstruct IFunction\n{\n\
    \    ~IFunction() {}\n    virtual int operator()() = 0;\n}\nstruct MyFunction\
    \ : IFunction\n{\n    ~MyFunction() { /* close resources*/}\n    int field;\n\
    \    int operator()() override { return field; }\n};\nIFunction *pIFunction =\
    \ new MyFunction;\npIFunction->operator()();\n(*pIFunction)();\ndelete pIFunction;\
    \ // ~IFunction()\n```\n"
  mdcn: "\n\n# 结构构造函数\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_164_0.png)\n\n现在，我们来看经典\
    \ C++ 中传统的 OOP 主题。构造函数是带有或不带参数的方法，用于结构初始化，内部包含自定义的初始化逻辑，例如获取所需的资源。\n\n代码示例：\n\n\
    ```cpp\nstruct MyFunction {\n    MyFunction(): field{1} { }\n    MyFunction(int\
    \ _field): field{_field} { }\n    int field;\n    int operator() { return field;\
    \ }\n};\nMyFunction myFunction, myFunction2(2);\n\nmyFunction();\nmyFunction2();\n\
    ```\n\n# 结构拷贝构造函数\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_165_0.png)\n\n当我们复制对象但需要复杂的复制逻辑或非平凡的内存管理时，拷贝构造函数非常有用。我们传递源对象的引用，仿佛我们没有打算对其修改它。\n\
    \n代码示例：\n\n```cpp\nstruct MyFunction\n{\n    MyFunction(): field{1} { }\n    MyFunction(int\
    \ _field): field{_field} { }\n    MyFunction(const MyFunction& src)\n        :\
    \ field(src.field) { ++field; }\n    int field;\n    int operator() { return field;\
    \ }\n};\nMyFunction myFunction;\n\nMyFunction myFunction2(myFunction);\nMyFunction\
    \ myFunction3 = myFunction;\n```\n\n# 结构拷贝赋值\n\n```cpp\nstruct MyFunction\n{\n\
    \    MyFunction(): field{1} {}\n    MyFunction(int _field): field(_field) {}\n\
    \    MyFunction(const MyFunction& src)\n        : field(src.field) { ++field;\
    \ } \n    MyFunction& operator=(const MyFunction& src) {\n        if (this !=\
    \ &src) ++(field = src.field);\n        return *this;\n    }\n\n    int field;\n\
    \    int operator() { return field; }\n};\n```\n\nMyFunction myFunction2;\nmyFunction\
    \ = myFunction;\n\n在非平凡赋值的情况下，我们可以实现赋值运算符。然而，我们应该注意不要赋值到自身（this），并返回指向自身的非const引用（*this）以允许链拷贝。\n\
    \n```cpp\nstruct MyFunction\n{\n    MyFunction(): field{1} {}\n    MyFunction(int\
    \ _field): field(_field) {}\n    MyFunction(const MyFunction& src)\n        :\
    \ field(src.field) { ++field; } \n    MyFunction& operator=(const MyFunction&\
    \ src) {\n        if (this != &src) ++(field = src.field);\n        return *this;\n\
    \    }\n\n    int field;\n    int operator() { return field; }\n};\n\nMyFunction\
    \ myFunction2;\nmyFunction = myFunction;\n\n# 结构析构函数\n\n```cpp\nstruct MyFunction\
    \ {\n  MyFunction(): field{1} { }\n  ~MyFunction() { /* close resources */ }\n\
    \  MyFunction(int _field): field{field} { }\n  MyFunction(const MyFunction& src)\n\
    \    : field(src.field) { ++field; }\n  MyFunction&operator=(const MyFunction&\
    \ src) {\n    if (this != &src) ++field = src.field; \n    return *this;\n  }\n\
    \  int field;\n  int operator() { return field; }\n};\n\n{ MyFunction myFunction;\
    \ }\n```\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_167_0.png)\n\n如果我们需要一些复杂的逻辑，例如在局部对象超出作用域时释放资源，或者我们删除了它，怎么办？析构函数在这种情况下会被调用的方法。\n\
    \n```cpp\nstruct MyFunction {\n  MyFunction(): field{1} { }\n  ~MyFunction() {\
    \ /* close resources */ }\n  MyFunction(int _field): field{field} { }\n  MyFunction(const\
    \ MyFunction& src)\n    : field(src.field) { ++field; }\n  MyFunction&operator=(const\
    \ MyFunction& src) {\n    if (this != &src) ++field = src.field; \n    return\
    \ *this;\n  }\n  int field;\n  int operator() { return field; }\n};\n\n{ MyFunction\
    \ myFunction; }\n```\n\n# 结构析构函数层次结构\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_168_0.png)\n\
    \n```cpp\nstruct IFunction\n{\n    ~IFunction() {}\n    virtual int operator()()\
    \ = 0;\n};\nstruct MyFunction : IFunction\n{\n    ~MyFunction() { /* close resources*/}\n\
    \    int field;\n    int operator()() override { return field; }\n};\nIFunction\
    \ *pIFunction = new MyFunction;\npIFunction->operator()();\n(*pIFunction)();\n\
    delete pIFunction; // ~IFunction()\n```\n\n从概念上说，析构函数就像普通方法，因此当我们有一个基类指针指向派生类对象时，可能会调用错误的析构函数。\n\
    \n```cpp\nstruct IFunction\n{\n    ~IFunction() {}\n    virtual int operator()()\
    \ = 0;\n}\nstruct MyFunction : IFunction\n{\n    ~MyFunction() { /* close resources*/}\n\
    \    int field;\n    int operator()() override { return field; }\n};\nIFunction\
    \ *pIFunction = new MyFunction;\npIFunction->operator()();\n(*pIFunction)();\n\
    delete pIFunction; // ~IFunction()\n```\n\n# 虚拟析构函数\n\n```cpp\nstruct IFunction\n\
    {\n    ~IFunction() {}\n    virtual int operator()() = 0;\n}\nstruct MyFunction\
    \ : IFunction\n{\n    ~MyFunction() { /* close resources*/}\n    int field;\n\
    \    int operator()() override { return field; }\n};\nIFunction *pIFunction =\
    \ new MyFunction;\npIFunction->operator()();\n(*pIFunction)();\ndelete pIFunction;\
    \ // ~IFunction()\n```\n\n# 虚拟析构函数\n\n```cpp\nstruct IFunction\n{\n    ~IFunction()\
    \ {}\n    virtual int operator()() = 0;\n}\nstruct MyFunction : IFunction\n{\n\
    \    ~MyFunction() { /* close resources*/}\n    int field;\n    int operator()()\
    \ override { return field; }\n};\nIFunction *pIFunction = new MyFunction;\npIFunction->operator()();\n\
    (*pIFunction)();\ndelete pIFunction; // ~IFunction()\n```\n\n"
