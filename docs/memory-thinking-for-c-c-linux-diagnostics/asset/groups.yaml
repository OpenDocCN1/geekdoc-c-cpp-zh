  mdcn: "\n\n# RAII 优势\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_248_0.png)\n\n\
    使用 RAII 范式有几个优点。当离开作用域时，由于析构函数的调用，它会自动释放资源：\n\n```cpp\nvoid foo() { Resource r;\
    \ }\n```\n\n在存在异常的情况下，析构函数会自动释放已获取的资源。这些共同贡献了可预测的资源生命周期。\n\n```cpp\n{\n    Resource\
    \ r;\n    throw -1;\n} catch (...) {\n}\n```\n\n# 文件描述符 RAII\n\n```cpp\nFile Descriptor\
    \ RAII\nstruct RAII_FD : FD {\n  int fd;\n  RAII_FD(int _fd) : FD(&fd, fdDeleter),\
    \ fd(_fd) {};\n  void operator=(int _fd) { FD::reset(); fd = _fd;\n    FD::reset(&fd);\
    \ }\n  operator int() const { return fd; }\n  private:\n  int fd;\n};\n\nint foo\
    \ () \n{\n  RAII_FD fd = ::open(...);\n  if (fd == -1)\n    // ...\n    return\
    \ -1;\n  return 0;\n}\n```\n\n使用 RAII 范式封装文件描述符的代码示例。我们复用了之前 Descriptors 里的 FD\
    \ 类型，就像 Unique Pointers 的滑动移动一样：\n\n```cpp\nstruct RAII_FD : FD {\n  int fd;\n\
    \  RAII_FD(int _fd) : FD(&fd, fdDeleter), fd(_fd) {};\n  void operator=(int _fd)\
    \ { FD::reset(); fd = _fd;\n    FD::reset(&fd); }\n  operator int() const { return\
    \ fd; }\n  private:\n  int fd;\n};\n\nint foo () \n{\n  RAII_FD fd = ::open(...);\n\
    \  if (fd == -1)\n    // ...\n    return -1;\n  return 0;\n}\n```\n\n# 线程与同步\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_250_0.png)\n\n本版的最后一部分是关于 C++ 中的线程和同步。\n\
    \n# C/C++ 中的线程\n\n```cpp\nvoid *thread_proc (void *arg)\n{\n    sleep((unsigned\
    \ long)arg);\n    return 0;\n}\n\nvoid foo()\n{\n    pthread_t tid;\n\n    pthread_create(&tid,\
    \ NULL, thread_proc, (void *));\n}\n```\n\n使用原始 pthread API 的传统 C/C++ 线程是有限的。传递任何参数类型并对其强制转换很容易出错。\n\
    \n代码示例：\n\n```cpp\nvoid *thread_proc (void *arg)\n{\n    sleep((unsigned long)arg);\n\
    \    return 0;\n}\n\nvoid foo()\n{\n    pthread_t tid;\n    pthread_create (&tid,\
    \ NULL, thread_proc, (void*)5);\n}\n```\n\n# 真正的 C++ 线程\n\n```cpp\n// 函数、函数对象、lambdas\n\
    void threadProcCpp(int param, std::string msg)\n{\n    std::sleep(param);\n  \
    \  std::cout <<\n        \"New Thread Created!\" + msg << std::endl;\n}\n\nvoid\
    \ foo()\n{\n    std::thread threadProcCpp(threadProcCpp, 6, \"Hello\");\n    //...\n\
    \    threadProcCpp.join();\n    // std::jthread threadProcCpp(threadProcCpp, 6,\
    \ \"Hello\");\n}\n```\n\n正确的 C++ 标准库线程允许利用现代 C++ 抽象的力量。请也注意 jthread 的存在，它结合了线程创建和连接：\n\
    \n```cpp\n// 函数、函数对象、lambdas\nvoid threadProcCpp(int param, std::string msg)\n\
    {\n    std::sleep(param);\n    std::cout <<\n        \"New Thread Created!\" +\
    \ msg << std::endl;\n}\n\nvoid foo()\n{\n    std::thread threadProcCpp(threadProcCpp,\
    \ 6, \"Hello\");\n    //...\n    threadProcCpp.join();\n    // std::jthread threadProcCpp(threadProcCpp,\
    \ 6, \"Hello\");\n}\n```\n\n"
