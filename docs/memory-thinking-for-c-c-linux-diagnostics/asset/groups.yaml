    \n## Virtual Function Call\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_218_0.png)\n\
    \nThis section provides an overview of virtual function calls in C++.\n\n## VTBL\
    \ Memory Layout\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_219_0.png)\n\nThese\
    \ virtual function calls are implemented uniformly by having a specific virtual\
    \ function table (vtbl) for each structure where addresses of base structure methods\
    \ are replaced with those of derived structure.\n\nThe code examples corresponding\
    \ to memory diagram:\n\n```\nstruct Base {\n  virtual void method1() {}\n  virtual\
    \ void method2() {}\n} Base;\n\nstruct Derived : Base {\n  int field;\n  void\
    \ method2() override {}\n} Derived;\n```\n\n## VPTR and Struct Memory Layout\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_220_0.png)\n\nEvery object whose virtual\
    \ methods has an implicit function table pointer (vptr) as its first member containing\
    \ an address of the corresponding structure functions table. Therefore, each virtual\
    \ function call from base structure pointer is a type-independent call where target\
    \ function address is easily calculated based on the address of virtual table\
    \ and offset.\n\nThe code examples corresponding to memory diagram:\n\n```\nBase\
    \ *pBase = &Base;\npBase->method1();\n```\n\n```\npBase = &Derived;\npBase->method2();\n\
    ```\n\n## Templates: A Introduction\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_221_0.png)\n\
    \nC++ templates and template metaprogramming are a vast universe. We only cover\
    \ this introduction.\n\n## Why Templates?\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_222_0.png)\n\
    \nIn the following slides, we briefly cover \"why\" aspects.\n\n## Reusability\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_223_0.png)\n\nTemplates allow us to\
    \ write less code with higher abstractions, delegating implementation details\
    \ to compiler. The compiler checks that template arguments are compatible, for\
    \ example, that they implement the required operations and methods.\n\nThe code\
    \ example:\n\n```\ntemplate<typename T>\nadd (const T& op1, const T& op2)\n{\n\
    \    return op1 + op2;\n}\nvoid foo()\n{\n    add<int>(1, 2);\n    add<struct\
    \ S>(struct S(1), struct S(2));\n}\n```\n\n```\nstruct S\n{\n    S(int _val) :\
    \ val(_val) {}\n    S operator+(const S& s) const\n    {\n        return S(val\
    \ + s.val);\n    }\n    int val;\n};\n// S operator+(const S& s1, const S& s2)\n\
    // {\n//     return S(s1.val + s2.val);\n// }\n```\n\n## Types of Templates\n\n\
    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_225_0.png)\n\nThe following code provides\
    \ examples for struct, function, and variable template categories:\n\n```\ntemplate\
    \ <typename T> struct TStruct { T data; }\nstruct TStruct<int> ts;\n\nstruct FStruct\
    \ {\n    template <typename T> T zero() { return T(0); }\n} fs;\nfs.zero<int>();\n\
    \ntemplate <typename T> T zero{};\nauto z = zero<int>;\n```\n\n## Types of Template\
    \ Parameters\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_226_0.png)\n\nThere are\
    \ two categories of template parameters: type and non-type.\n\nThe code example\
    \ and the corresponding assembly language:\n\n```\ntemplate <int c> decltype(c)\
    \ constant() { return c; }\nconstant<1>():\n```\n\nNon-type template parameters\
    \ allow the generation of very compact code with a distinct purpose, as shown\
    \ in x64 and ARM64 disassembly:\n\n```\ncall <constant<1>>() // Clang and GCC\n\
    ...\nconstant<1>():\npush  %rbp\nmov   %rsp,%rbp\nmov   $0x1,%eax\npop   %rbp\n\
    retq\n```\n\n```\nbl <constant<1>()\n... constant<1>():\nmov w0, #0x1\nret\n```\n\
    \n## Type Safety\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_228_0.png)\n\n```\n\
    template <typename T>\nT add(const T& op1, const T& op2) \n{\n    return op1 +\
    \ op2;\n}\n\nvoid foo() {\n    add(struct M(1), struct M(2));\n}\n```\n\n```\n\
    struct S\n{\n    S(int _val) : val(_val) {}\n    S operator+(const S& s) const\
    \ {\n        return S(val + s.val);\n    }\n    int val;\n};\n```\n\nCompared\
    \ to pointer casting, the general template enforces type safety by checking the\
    \ required operations and methods.\n\nThe code example:\n\n```\nstruct S {\n \
    \   S(int _val) : val(_val) {}\n    S operator+(const S& s) const {\n        return\
    \ S(val + s.val);\n    }\n    int val;\n};\n\nstruct M {\n    M(int _val) : val(_val)\
    \ {}\n    int val;\n};\n```\n\n```cpp\ntemplate <typename T>\nT add(const T& op1,\
    \ const T& op2) \n{\n    return op1 + op2;\n}\nvoid foo()\n{\n    add(struct M(1),\
    \ struct M(2));\n}\n```\n\n## Flexibility\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_230_0.png)\n\
    \nIt is also possible to specialize template definitions for specific types for\
    \ performance and other reasons.\n\nThe code example:\n\n```cpp\ntemplate<>\n\
    struct M add<struct M> (const struct M& op1,\n    const struct M& op2)\n{\n  \
    \  return op1.val + op2.val;\n}\nvoid foo()\n{\n    add<struct M>(struct S(1),\
    \ struct S(2));\n}\n\ntemplate<> decltype(13) constant<13>() { return 14; }\n\
    ```\n\n## Metafunctions\n\n```\nMetafunctions\n\n// f: Value -> Value\n// mf:\
    \ Type -> Type\n\ntemplate <typename T>\nstruct Pointer\n{\n    // typedef T*\
    \ type;\n    using type = T;\n}\n\nPointer<int>::type pInt; // int *pInt\nPointer<int\
    \ *>::type ppInt; // int **ppInt\nPointer<struct M>::type pM; // struct M *pM;\n\
    ```\n\nMetafunctions transform type: they take types as parameters and return\
    \ types as output.\n\nThe code example:\n\n```cpp\n// f: Value -> Value\n// mf:\
    \ Type -> Type\ntemplate <typename T>\nstruct Pointer\n{\n    // typedef T* type;\n\
    \    using type = T;\n}\n```\n"
