- md: "\n# Dynamic Allocation (C++)\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_126_0.png)\n\
    \nC++ has its own implementation of dynamic memory that is often implemented by\
    \ underlying C-style calls and Linux API. However, these high-level allocation\
    \ facilities are more flexible and customizable to the needs of structure designers.\
    \ It provides replaceable operators for global allocations for chunks of memory\
    \ and structure-specific allocations.\n\n# Memory Operators\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_127_0.png)\n\
    \nWhen freeing globally allocated memory, always pay attention to whether it was\
    \ allocated in the array form to avoid memory leaks, crashes, and other undefined\
    \ behavior. Also, never check the allocated memory address for nullptr as done\
    \ in the C-style allocations: C++ allocation operators throw an exception instead.\n\
    \n# Memory Expressions\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_128_0.png)\n\
    \nMemory allocation expressions are used for allocating memory for values, structures,\
    \ and their arrays. Internally, they may use memory operators. The same advice\
    \ for non-array/array deallocation and checking return addresses is applicable\
    \ here.\n\n# Local Pointers (Manual)\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_129_0.png)\n\
    \nWhen allocating memory dynamically and assigning the memory address to a local\
    \ variable, we must not forget to free/delete memory before returning from the\
    \ function to avoid a memory leak.\n\nThe code example corresponding to the memory\
    \ diagram:\n\n# foo();\n\nWhen we enter the foo function, the allocated stack\
    \ frame includes the local variables:\n\n```cpp\nvoid foo()\n{\n  ...\n}\n```\n\
    \nThe local variable p contains the address of the allocated memory for an integer\
    \ value:\n\n```cpp\nvoid foo()\n{\n    int *p = new int;\n...\n}\n```\n\nHowever,\
    \ before exiting the function, we must free the memory; otherwise, there is a\
    \ memory leak. Please note that neither delete nor free changes the value of the\
    \ variable p. It becomes a dangling pointer but it is ok because it goes out of\
    \ scope here and is not reused for dereferencing unless saved somewhere else.\n\
    \n```cpp\nvoid foo()\n{\n    int *p = new int;\n...\n    delete p;\n}\n```\n\n\
    # In-place Allocation\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_131_0.png)\n\
    \n```cpp\nchar buf[sizeof(int)];\nint *pi = new(buf) int;\n*pi = 1;\n\nchar *pbuf\
    \ = new char[sizeof(int)];\npi = new(pbuf) int;\n*pi = 2;\ndelete[] pbuf;\n```\n\
    \nIf we want to reuse existing memory buffers, we can use placement new.\n\nThe\
    \ code examples corresponding to the memory diagrams:\n\n```cpp\nchar buf[sizeof(int)];\n\
    int *pi = new(buf) int;\n*pi = 1;\n\nchar *pbuf = new char[sizeof(int)];\npi =\
    \ new(pbuf) int;\n*pi = 2;\ndelete[] pbuf;\n```\n\n# Source Code Organisation\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_132_0.png)\n\nWe now discuss C and\
    \ C++ source code organization.\n\n# Logical Layer (Translation Units)\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_133_0.png)\n\
    \nFrom a compiler perspective, it works with a translation unit as a whole and\
    \ converts the source code of a translation unit to an object file. Several object\
    \ files are combined by a linker into an executable file.\n\n# Physical Layer\
    \ (Source Files)\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_134_0.png)\n\nAlthough\
    \ one physical source code file corresponds to one translation unit, it is passed\
    \ through a preprocessor, which, among other things, looks for special directives\
    \ to include other files, and those files may also contain directives to include\
    \ other files. You can also see, as in the case of the common.h file, by transitivity\
    \ of inclusion, that the same file may be included many times.\n\n# Inter-TU Sharing\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_135_0.png)\n\nVariables in different\
    \ translation units having the same name may conflict during the linkage phase.\n\
    \nThe code examples corresponding to the diagrams:\n\n```cpp\n// TU A\nint counter;\n\
    ```\n\n```cpp\n// TU B\nextern int counter;\nint counter;\n```\n\n# Classic Static\
    \ TU Isolation\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_136_0.png)\n\nTo avoid\
    \ name conflicts during linkage, C and C++ suggest using the static specifier.\n\
    \nThe code examples corresponding to the diagrams:\n\n```cpp\n// TU A\nstatic\
    \ int counter;\n```\n\n```cpp\n// TU B\nextern int counter;\nint counter;\n```\n\
    \n# Namespace Isolation\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_137_0.png)\n\
    \nModern C++ suggests using namespaces.\n\nThe code examples corresponding to\
    \ the diagrams:\n\n```cpp\n// TU A\nnamespace\n{\n    int counter;\n}\n```\n\n\
    ```cpp\n// TU B\nextern int counter;\nint counter;\n```\n\n# Declaration and Definition\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_138_0.png)\n\nIn C and C++, when reasoning\
    \ about compilation, it is useful to consider the distinction between declaration\
    \ and definition. The rule of thumb is that the latter describes memory layout.\
    \ Please note that a definition is also a declaration.\n\n# TU Definition Conflicts\n\
    \n```cpp\nstruct S { }; // thirdparty.h\nstruct S { }; //...\nS s;\n```\n\nMultiple\
    \ declarations of the same entity are allowed, but only one definition is allowed,\
    \ the essence of ODR (One Definition Rule).\n\nThe code example:\n\n```cpp\nstruct\
    \ S { }; // thirdparty.h\nstruct S { }; //...\nS s;\n```\n\n# Fine-grained TU\
    \ Scope Isolation\n\n- Named namespaces\n- Example:\n```cpp\nstruct S { }; //\
    \ thirdparty.h\nnamespace mycode { struct S { }; // ...\nmycode::S;\nusing namespace\
    \ mycode;\nS2; // ambiguous\n```\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_140_0.png)\n\
    \nNamed namespaces allow fine-grained scope.\n\nThe code example:\n\n```cpp\n\
    struct S { }; // thirdparty.h\nnamespace mycode { struct S { }; // ...\nmycode::S;\n\
    using namespace mycode;\nS2; // ambiguous\n```\n\n# Conceptual Layer (Design)\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_141_0.png)\n\nIn the design layer,\
    \ we may want to separate implementation details.\n\n# Incomplete Types\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_142_0.png)\n\
    \nSuch separation is achieved via incomplete types and the so-called Pimpl (Pointer\
    \ to Implementation) idiom.\n\n```cpp\nstruct MyStruct; // declaration\nstruct\
    \ MyStruct *pMyStruct; // (declaration and definition)\n// Pimpl (Pointer to Implementation)\
    \ idiom\nstruct Instrument // (declaration and definition)\n{\n    int getMeasurement();\
    \ // declaration\nprivate:\n    struct InstrumentImpl; // declaration\n    struct\
    \ InstrumentImpl *pImpl; // definition\n};\n```\n\n# References\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_143_0.png)\n\
    \nNow, a slide for C++ references. We plan to extend this section in the second\
    \ edition.\n\n# Type& vs. Type*\n\n```cpp\nType& vs. Type*\n\n* The same from\
    \ a memory perspective\n* Definition: int& ref{val}; int *ptr{&val};\n* Dereference:\
    \ ref; *ptr;\n* Field access: rStruct.field; pStruct->field; (*pStruct).field;\n\
    ```\n\nFrom the memory perspective, references and pointers are the same thing.\
    \ The only difference is that you cannot have a dangling reference; it must be\
    \ initialized.\n\n# Value Categories\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_145_0.png)\n\
    \nLet’s now briefly discuss various categories of values. These are what is stored\
    \ in memory. A pointer value is also a value that is interpreted as a memory address\
    \ pointing to some other value elsewhere.\n\n# Value Categories\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_146_0.png)\n\
    \nWhen reading serious C++ documentation, you frequently see the so-called lvalues\
    \ and rvalues mentioned. Crudely, you can think about them as left and right values\
    \ in expressions, where the right value can be temporary, and the left value has\
    \ to be backed up by some memory.\n\n# Classification\n\nhttps://en.cppreference.com/w/cpp/language/value_category\n\
    \n# Constant Values\n\n```cpp\nConstant Values\n\nconst int cv{1}; int v;\n\n\
    const int *pc;\nint * const cp&v;\nconst int * const cpc{cp};\n\nconst int& rc{v};\
    \ int& r{v};\n```\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_147_0.png)\n\nThe\
    \ values can also be constant, facilitating functional programming and code security.\
    \ Please note that there can be pointers and references to constant values, constant\
    \ pointers to mutable variables, and both. The way to read such declarations is\
    \ from right to left.\n\nThe code examples:\n\n```cpp\nconst int cv{1}; int v;\n\
    const int *pc;\nint * const cp&v;\nconst int * const cpc{cp};\nconst int& rc{v};\
    \ int& r{v};\n```\n"
  mdcn: "\n\n# 动态分配 (C++)\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_126_0.png)\n\
    \nC++ 有其自己的动态内存实现，这些实现通常通过底层的 C 风格调用和 Linux API 完成。然而，这些高级分配设施对于结构设计者的需求更具灵活性和定制性。它为全局内存块分配和特定结构分配提供了可替换的运算符。\n\
    \n# 内存运算符\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_127_0.png)\n\n在释放全局分配的内存时，务必注意是否是以数组形式分配的，以避免内存泄漏、崩溃和其他未定义行为。此外，永远像\
    \ C 风格分配那样检查分配的内存地址是否为 `nullptr`：C++ 分配运算符会抛出异常。\n\n# 内存表达式\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_128_0.png)\n\
    \n内存分配表达式用于为值、结构及其数组分配内存。在内部，它们可能会使用内存运算符。对于非数组/数组释放和检查返回地址的建议也适用于这里。\n\n# 局部指针（手动）\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_129_0.png)\n\n在动态分配内存并将内存地址赋值给局部变量时，我们不能忘记在从函数返回之前释放/删除内存，以避免内存泄漏。\n\
    \n与内存图对应的代码示例：\n\n# foo();\n\n当我们进入 `foo` 函数时，分配的栈帧包含了局部变量：\n\n```cpp\nvoid foo()\n\
    {\n  ...\n}\n```\n\n局部变量 `p` 包含分配的整数值内存的地址：\n\n```cpp\nvoid foo()\n{\n    int\
    \ *p = new int;\n...\n}\n```\n\n然而，在退出函数之前，我们必须释放内存；否则会导致内存泄漏。请注意，`delete` 或 `free`\
    \ 都不会改变变量 `p` 的值。它变成了一个悬空指针，但没关系，因为它在这里超出了作用域，除非被保存到其他地方，否则不会被用于解引用。\n\n```cpp\n\
    void foo()\n{\n    int *p = new int;\n...\n    delete p;\n}\n```\n\n# 原地分配\n\n\
    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_131_0.png)\n\n```cpp\nchar buf[sizeof(int)];\n\
    int *pi = new(buf) int;\n*pi = 1;\n\nchar *pbuf = new char[sizeof(int)];\npi =\
    \ new(pbuf) int;\n*pi = 2;\ndelete[] pbuf;\n```\n\n如果我们想重用现有的内存缓冲区，可以使用定位 new（placement\
    \ new）。\n\n与内存图对应的代码示例：\n\n```cpp\nchar buf[sizeof(int)];\nint *pi = new(buf)\
    \ int;\n*pi = 1;\n\nchar *pbuf = new char[sizeof(int)];\npi = new(pbuf) int;\n\
    *pi = 2;\ndelete[] pbuf;\n```\n\n# 源代码组织\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_132_0.png)\n\
    \n我们现在讨论 C 和 C++ 的源代码组织。\n\n# 逻辑层（编译单元）\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_133_0.png)\n\
    \n从编译器的角度来看，它以整个编译单元的形式工作并将编译单元的源码转换为目标文件。多个目标文件由链接器合并为执行文件。\n\n# 物理层（源文件）\n\n\
    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_134_)\n\n尽管一个物理源文件对应一个编译单元，但它通过预处理器处理，预处理器会查找包含其他文件的指令，而这些文件也可能包含其他文件。从\
    \ `common.h` 文件的情况可以看出，同一个文件可能被包含多次。\n\n# 跨 TU 共享\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_135_))\n\
    \n不同编译单元中具有相同的变量在链接阶段可能会冲突。\n\n与图对应的代码示例：\n\n```cpp\n// TU A\nint counter;\n```\n\
    \n```cpp\n// TU B\nextern int counter;\nint counter;\n```\n\n# 经典的静态 TU 隔离\n\n\
    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_136_))\n\n为了避免链接期间命名冲突，C 和 C++ 建议使用 `static`\
    \ 限定符。\n\n与图对应的代码示例：\n\n```cpp\n// TU A\nstatic int counter;\n```\n\n```cpp\n\
    // TU B\nextern int counter;\nint counter;\n```\n\n# 命名空间隔离\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_137_))\n\
    \n现代 C++ 建议使用命名空间。\n\n与图对应的代码示例：\n\n```cpp\n// TU A\nnamespace\n{\n    int counter;\n\
    }\n```\n\n```cpp\n// TU B\nextern int counter;\nint counter;\n```\n\n# 声明与定义\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_138_))\n\n在 C 和 C++ 中，在编译时考虑声明和定义的区别是有用的。经验法则是后者描述了内存布局。请注意，定义也是一种声明。\n\
    \n# TU 定义冲突\n\n```cpp\nstruct S { }; // thirdparty.h\nstruct S { }; //...\nS s;\n\
    ```\n\n允许对同一实体进行多个声明，但只允许一个定义，这是 ODR（单一定义规则）的精髓。\n\n代码示例：\n\n```cpp\nstruct S\
    \ { }; // thirdparty.h\nstruct S { }; //...\nS s;\n```\n\n# 细粒度 TU 作用域\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_140_)\n\
    \n命名空间允许细粒度的作用域。\n\n代码示例：\n\n```cpp\nstruct S { }; // thirdparty.h\nnamespace\
    \ mycode { struct S { }; // ...\nmycode::S;\nusing namespace mycode;\nS2; // ambiguous\n\
    ```\n\n# 概念层（设计）\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_141_)\n\n在设计层，我们可能希望分离实现细节。\n\
    \n# 不完整类型\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_142_)\n\n这种分离通过不完整类型和所谓的\
    \ Pimpl（指向实现的指针）用法实现。\n\n```cpp\nstruct MyStruct; // 声明\nstruct MyStruct *pMyStruct;\
    \ // (声明和定义)\n// Pimpl（指向实现的指针）用法\nstruct Instrument // (声明和定义)\n{\n    int getMeasurement();\
    \ // 声明\nprivate:\n    struct InstrumentImpl; // 声明\n    struct InstrumentImpl\
    \ *pImpl; // 定义\n};\n```\n\n# 引用\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_143_)\n\
    \n现在是关于 C++ 引用的幻灯片。我们计划在第二版中扩展这部分。\n\n# Type& vs. Type*\n\n```cpp\nType& vs. Type*\n\
    \n* 从内存角度来看是相同的\n* 定义: int& ref{val}; int *ptr{&val};\n* 解引用: ref; *ptr;\n* 字段访问:\
    \ rStruct.field; pStruct->field; (*pStruct).field;\n```\n\n从内存角度来看，引用和指针是同一件事。唯一的区别是你不能拥有悬空引用；它必须被初始化。\n\
    \n# 值类别\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_145_)\n\n现在让我们简要讨论各种类别的值。这些是存储在内存中的内容。指针值也是一个解释为指向某处其他值的内存地址的值。\n\
    \n# 值类别\n\n5d1315bb9d30_146_)\n\n在阅读严肃的 C++ 文档时，你经常看到所谓的左值（lvalues）和右值（rvalues）。粗略地说，你可以把它们理解为表达式中的左值和右值，其中右值可以是临时的，而左值必须有内存支持。\n\
    \n# 分类\n\nhttps://en.cppreference.com/w/cpp/language/value_category\n\n# 常量值\n\
    \n```cpp\nConstant Values\n\nconst int cv{1}; int v;\n\nconst int *pc;\nint *\
    \ const cp&v;\nconst int * const cpc{cp};\n\nconst int& rc{v}; int& r{v};\n```\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_147_)\n\n值也可以是常量的，有助于函数式编程和代码安全。请注意，可以指向常量值的指针和引用、指向可变变量的常量指针，以及兼者。读取此类声明的方法是从右向左的。\n\
    \n代码示例：\n\n```cpp\nconst int cv{1}; int v;\nconst int *pc;\nint * const cp&v;\n\
    const int * const cpc{cp};\nconst int& rc{v}; int& r{v};\n```\n\n"
