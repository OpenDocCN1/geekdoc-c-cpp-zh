- md: "\nthat time. C++03 didn't have major changes compared to C++98, and this is\
    \ why I included it with C++98 for the year 2001. In 2003, things turned out unexpectedly\
    \ as I moved from full-time development using C++ to full-time memory dump analysis\
    \ of C++ programs with Mac OS X core dump analysis of user space (BSD) in 2012\
    \ and Linux user space core dump analysis in 2015. I continued using C++03 for\
    \ writing diagnostic tools, though. In 2016, I learned that the language completely\
    \ changed to C++11/14. I came back to full-time C++ programming in late 2017,\
    \ where I also started using language features from C++17. In 2020, I moved to\
    \ functional programming in Scala, which also influenced my C++ coding for new\
    \ projects. Now, I have started using C++20 - a bit late since C++23 is already\
    \ available, and I am switching from Scala to Rust.\n\n# Zinc\n\nhttps://en.wikipedia.org/wiki/Zinc_Application_Framework\n\
    \n# Old CV\n\nhttps://opentask.com/Vostokov/CV.htm\n\n# C and C++ Mastery Process\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_32_0.png)\n\nDespite high-level features\
    \ in C++, there’s still much low-level overlap with C, and when I program in C\
    \ and C++, I mentally compile to memory. This helps when I have a doubt about\
    \ whether this or that construct is safe. I also believe that looking at how C\
    \ and C++ constructs are implemented in memory greatly helps in learning these\
    \ languages.\n\n# Thought Process\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_33_0.png)\n\
    \nThis slide about a thought process when using a programming language is perhaps\
    \ controversial. With C and C++, we think about memory; with Scala/FP, we think\
    \ about functions; and with Python, we think about data.\n\n# Philosophy of Pointers\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_34_0.png)\n\nWe start with pointers,\
    \ the most important concept in C and also in C++. I originally created this approach\
    \ in 2015 but now extended it for this training.\n\n# Pointer\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_35_0.png)\n\
    \nConceptually, a pointer is an entity that refers (or points) to some other entity.\
    \ We say entity, not an object, so as not to confuse it with objects in C++ or\
    \ objects in object-oriented programming. This can be my finger, for example,\
    \ pointing to an apple.\n\n# Pointer Dereference\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_36_0.png)\n\
    \nA pointer dereference is an act of getting the entity it references for further\
    \ inspection or usage. Imagine I point to an apple, and you grab it to eat.\n\n\
    # Many to One\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_37_0.png)\n\nSeveral\
    \ pointers can refer (or point) to the same entity. For example, two people are\
    \ pointing to the same apple. So, conceptually, pointers are distinct from entities\
    \ they point to. Should we call the latter pointees?\n\n# Many to One Dereference\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_38_0.png)\n\nOf course, if you dereference\
    \ the same object, you get the same object. If someone else grabs an apple, I\
    \ point to, at the same time as you do, both get the same apple.\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_39_0.png)\n\
    \nSome pointers may be invalid; for example, I may point to an imaginary apple.\n\
    \n# Invalid Dereference\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_40_0.png)\n\
    \nWhen you dereference an invalid pointer, you get a problem; for example, you\
    \ fail to get an imaginary apple.\n\n# Wild (Dangling) Pointer\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_41_0.png)\n\
    \nSome pointers are called dangling – they used to point to valid entities some\
    \ time ago, but not anymore, so a dereference fails. You’re reaching for an apple\
    \ that I point to, but someone snatched it seconds ago.\n\n# Pointer to Pointer\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_42_0.png)\n\nSince a pointer is also\
    \ an entity that can be pointed to, there can be a chain of pointers. You point\
    \ to me; I point to an apple.\n\n# Pointer to Pointer Dereference\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_43_0.png)\n\
    \nWhen we dereference the first pointer, we get an entity, another pointer, which\
    \ we can also dereference to get the underlying entity. You point to me, but another\
    \ takes the apple.\n\n# Naming Pointers and Entities\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_44_0.png)\n\
    \nNames are distinct from entities. Names can be programming language identifiers\
    \ or just unique numbers or IDs.\n\n# Names as Pointer Content\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_45_0.png)\n\
    \nPointers, as entities, may contain names, and these names may be names of pointers,\
    \ too. If a pointer contains only a name, we say the pointer value is the name.\
    \ So, the pointer value can be another pointer value, and the latter pointer value\
    \ is the name of some other entity.\n\n# Pointers as Entities\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_46_0.png)\n\
    \nPointer dereference is an act. If we put aside aside, pointers are just entities\
    \ with some content that can be interpreted as a name if necessary. All these\
    \ dereferences happen only at runtime. The pointer content (its value) may be\
    \ invalid without any problem until we use it.\n\n# Memory and Pointers\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_47_0.png)\n\
    \nNow, we look at the memory representation of pointers and entities they point\
    \ to.\n\n# Mental Exercise\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_48_0.png)\n\
    \nHere, in this picture, entities are the so-called memory cells. Memory cells\
    \ have addresses that start from 0 and are usually incremented by the so-called\
    \ pointer size, which is 4 on 32-bit systems and 8 on 64-bit systems. Here, for\
    \ visual clarity, we use memory cells from a 32-bit system.\n\n# Debugger Memory\
    \ Layout\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_49_0.png)\n\nWhen we use\
    \ a debugger, it prints memory cell addresses and their contents in a certain\
    \ layout shown on this slide. Some debugger commands, such as x in GDB, use 2-column\
    \ and some n-column layouts to print memory.\n\n# Memory Dereference Layout\n\n\
    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_50_0.png)\n\nFor a 2-column format, some\
    \ debuggers and their commands may interpret the second column as a pointer. In\
    \ such a case, the third column is a value from a pointer dereference. Also, notice\
    \ a case when a pointer points to itself. For GDB, it is possible to emulate such\
    \ behavior using a custom script:\n\n```\ndefine dpp\n  set $si = 0\n  set $p\
    \ = $arg0\n  while $si < $arg1\n    printf \"%p: %s\", $p\n    x/gx *(long *)$p\n\
    \    set $si = $si + 1\n    set $p = $p + 8\nend\n```\n\n# Names as Addresses\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_51_0.png)\n\nTo repeat, for memory\
    \ layout, names are interpreted as addresses, and memory cell content (cell value)\
    \ can also be interpreted as a memory address.\n\n# Addresses and Entities\n\n\
    # Addresses and Entities\n\n| 2ab1000: | 2ab1008 | 2ab1000: | 2ab1008 |\n| 2ab1004:\
    \ | fffffff | 2ab1004: | fffffff |\n| 2ab1008: | 2ab1010 | 2ab1008: | 2ab1010\
    \ |\n| 2ab100c: | | |\n| 2ab1010: | 00000000 | 2ab1010: | 00000000 |\n| 2ab1014:\
    \ | 00002000 | 2ab1014: | 00002000 |\n\nEntities can be either single cells or\
    \ multicells. Each part of a multicell can be interpreted as a memory address,\
    \ if necessary, even if it wasn't meant to be a memory address.\n\n# Addresses\
    \ and Structures\n\n| | |\n|---|---|\n| 2ab1000: | 2ab1008 |\n| 2ab1004: | fffffff\
    \ |\n| 2ab1008: | 2ab1010<br>2ab100c |\n| 2ab1010: | 00000000 |\n| 2ab1014: |\
    \ 00002000 |\n\nA structure in memory is a sequential collection of memory cells;\
    \ some may be multicell and themselves substructures. Each part of a structure,\
    \ its member, or structure field has its own address as well, in addition to the\
    \ overall address of the structure.\n\n# Pointers to Structures\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_54_0.png)\n\
    \nA structure has its address. A pointer to a structure is a memory cell that\
    \ contains that address. It has its own address.\n\n# Arrays\n\n# Arrays\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_55_0.png)\n\
    \nAn array is a contiguous sequence of n-cells in memory called array elements.\
    \ Each array element has its own address. Since the size of each array element\
    \ is fixed and the same, addressing the random element is fast.\n"
  mdcn: "\n那个时候。C++03 与 C++98 相比没有重大变化，这就是为什么我在 2001 年将其与 C++98 包含在一起。2003 年，情况发生了出乎意料的发展，我从全职\
    \ C++ 开发转向了在 2012 年通过 Mac OS X 核心转储分析进行用户空间（BSD）C++ 程序内存转储分析，以及2015 年的 Linux 用户空间核心转储分析。尽管如此，我继续使用\
    \ C++03 编写诊断工具。2016 年，我了解到该语言已完全变为 C++11/14。我在 2017 年底回归了全职 C++ 编程，并开始开始使用 C++17\
    \ 的语言特性。2020 年，我转向了 Scala 函数式编程，这也影响了我对新项目的 C++ 代码编写。现在，我开始使用 C++20 —— 晚了一点，因为\
    \ C++23 已经发布了，并且正在从 Scala 切换到 Rust。\n\n# Zinc\n\nhttps://en.wikipedia.org/wiki/Zinc_Application_Framework\n\
    \n# 旧简历\n\nhttps://opentask.com/Vostokov/CV.htm\n\n# C 和 C++ 精通之路\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_32_0.png)\n\
    \n尽管 C++ 拥有高级特性，但它与 C 之间仍有很多底层重叠，当我用 C 和 C++ 编程时，我会在脑中将其编译为内存。这在我怀疑某个构造是否安全时很有帮助。我认为，观察\
    \ C 和 C++ 构造在内存中是如何实现的，极大有助于学习这些语言。\n\n# 思维过程\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_33_0.png)\n\
    \n这张关于使用编程语言时思维过程的幻灯片可能存在争议。使用 C 和 C++ 时，我们考虑内存；使用 Scala/FP 时，我们考虑函数；使用 Python\
    \ 时，我们考虑数据。\n\n# 指针哲学\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_34_0.png)\n\n\
    我们从指针开始，这是 C 以及 C++ 中最重要的概念。我最初在 2015 年创建了这种方法，但现在为了这次培训对其进行了扩展。\n\n# 指针\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_35_0.png)\n\
    \n从概念上说，指针是一个引用（或指向）另一个实体的实体（entity）。我们称之为实体而不是对象（object），以免与 C++ 中的对象或面向对象编程中的对象混淆。例如，这可以是我的手指，指向一个苹果。\n\
    \n# 指针解引用\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_36_0.png)\n\n指针解引用是获取其所引实体以便进一步检查或使用的行为。想象我指向一个苹果，而你抓起它来吃。\n\
    \n# 多对一\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_37_0.png)\n\n多个指针可以引用（或指向）同一个实体。例如，两个人指向同一个苹果。所以，从概念上说，指针与它们所指向的实体是分离的。我们应该把后者称为“被指实体”（pointees）吗？\n\
    \n# 多对一解引用\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_38_0.png)\n\n当然，如果你解引用同一个对象，你就会得到同一个对象。如果另一个人和你同时指向一个苹果，你们得到同一个苹果。\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_39_0.png)\n\n某些指针可能是的；例如，我可能指向一个虚幻的苹果。\n\
    \n# 无效解引用\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_40_0.png)\n\n当你解引用无效指针时，会出现问题；例如，你无法得到那个虚幻的苹果。\n\
    \n# 野指针（悬空指针）\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_41_0.png)\n\n某些指针被称为悬空指针\
    \ ——它们曾经指向某些实体，但现在不再了，所以解引用失败。你伸手去拿我指向的苹果，但它在几秒前被夺走了。\n\n# 指向指针的指针\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_42_0.png)\n\
    \n由于指针也是可以被指向的实体，因此可以存在指针链。你指向我；我指向一个苹果。\n\n# 指向指针的指针解引用\n\n![](img/c36cc1b69ac7baa75db9d30_43_0.png)\n\
    \n当我们解引用第一个指针时，我们得到一个实体（另一个指针），我们可以再次解引用它获取底层实体。你指向我，另一个人拿到苹果。\n\n# 命名指针与实体\n\n\
    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_44_0.png)\n\n名称与实体是不同的。名称可以是编程语言的标识符，或只是数字或\
    \ ID。\n\n# 作为内容的名称\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_45_0.png)\n\n作为实体的指针可能包含名称，这些名称也可以是指针。如果指针只包含名称，我们就说指针值为名称。因此，指针值可以是另一个指针值，而后者指针值是另一个实体的名称。\n\
    \n# 作为实体的指针\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_46_0.png)\n\n指针解引用是一种行为。如果需要，指针只是带有可以被解释为名称内容的实体。所有这些解引用只发生在运行时。在使用它之前，指针内容（其值）可能是无效的。\n\
    \n# 内存与指针\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_47_0.png)\n\n现在，我们来看指针及其指向的实体的内存表示。\n\
    \n# 心理练习\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_48_0.png)\n\n在这张图中，实体是所谓的内存单元。内存单元的地址从\
    \ 0 开始，通常按所谓的指针大小递增（32 位系统上为 4，64 位系统上为 8）。为了视觉清晰，这里使用 32 位系统的内存单元。\n\n# 调试器内存布局\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_49_0.png)\n\n当我们使用调试器时，它按照此幻灯片所示的布局打印内存单元地址及其内容。某些调试器命令（如\
    \ GDB 中的 `x`）使用 2 列和 n 列布局来打印内存。\n\n# 内存解引用布局\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_50_0.png)\n\
    \n对于 2 列格式，某些调试器和其命令可能会将第二列解释为指针。在这种情况下，第三列是指针解引用的值。还要注意指针指向自身的情况。对于 GDB，可以使用自定义脚本模拟这种行为：\n\
    \n```\ndefine dpp\n  set $si = 0\n  set $p = $arg0\n  while $si < $arg1\n    printf\
    \ \"%p: %s\", $p\n    x/gx *(long *)$p\n    set $si = $si + 1\n    set $p = $p\
    \ + 8\nend\n```\n\n# 作为地址的名称\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_51_0.png)\n\
    \n重复一遍，对于内存布局，名称被解释为地址，内存单元内容（单元值）也可以解释为内存地址。\n\n# 地址与实体\n\n# 地址与实体\n\n| 2ab1000:\
    \ | 2ab1008 | 2ab1000: | 2ab1008 |\n| 2ab1004: | fffffff | 2ab1004: | fffffff\
    \ |\n| 2ab1008: | 2ab1010 | 2ab1008: | 2ab1010 |\n| 2ab100c: | |\n| 2ab1010: |\
    \ 00000000 | 2ab1010: | 00000000 |\n| 2ab1014: | 00002000 | 2ab1014: | 00002000\
    \ |\n\n实体可以是单单元或多单元。多单元的每个部分在必要时都可以解释为内存地址，即使它原本并不是内存地址。\n\n# 地址与结构\n\n| | |\n\
    |---|---|\n| 2ab1000: | 2ab1008 |\n| 2ab1004: | fffffff |\n| 2ab1008: | 2ab1010<br>2ab100c\
    \ |\n| 2ab1010: | 00000000 |\n| 2ab1014: | 00002000 |\n\n内存中的结构是内存单元的顺序集合；某些可能是多单元且本身是子结构。除了结构的整体地址外，结构的每个部分、其成员或结构字段也有自己的地址。\n\
    \n# 指向结构的指针\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_54_0.png)\n\n结构有其地址。指向结构的指针是包含该地址的内存单元。它有自己的地址。\n\
    \n# 数组\n\n# 数组\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_55_0.png)\n\n数组是内存中连续的\
    \ n 单元序列，称为数组元素。每个数组元素都有自己的地址。由于每个数组元素的大小固定且相同，访问随机元素非常快。\n"
