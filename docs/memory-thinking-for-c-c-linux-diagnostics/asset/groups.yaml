- md: "\n# Static Structure Fields\n\n```\nStatic Structure Fields\nstruct MyStruct\
    \ {\n    int field;\n    static unsigned shared_field;\n} myStruct1, myStruct2;\n\
    \nunsigned MyStruct::shared_field = 123;\nmyStruct1.field = 0;\nmyStruct1.shared_field\
    \ = 123;\nmyStruct2.field = 1;\n\n(gdb) ptype /o MyStruct {\n    /* offset   \
    \ size */\n    0          4\n    int field;\n    static unsigned int shared_field;\n\
    /* total size (bytes): 4 */\n}\n\n(gdb) x &MyStruct::shared_field:\n0x402b8 <MyStruct::shared_field>:\
    \ 0x0000007b\n```\n\nStatic structure field values are shared between the different\
    \ objects of the same type. They occupy uniquely separate memory cells from the\
    \ objects' memory.\n\nThe code example corresponding to the GDB output:\n\n```\n\
    struct MyStruct {\n    int field;\n    static unsigned shared_field;\n} myStruct1,\
    \ myStruct2;\n\nunsigned MyStruct::shared_field = 123;\nmyStruct1.field = 0;\n\
    myStruct1.shared_field = 123;\nmyStruct2.field = 1;\n```\n\n# Uniform Initialization\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_108_0.png)\n\nThroughout C++ history,\
    \ there were several ways to initialize variables. Finally, there is some uniform\
    \ way to do it consistently.\n\n# Old Initialization Ways\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_109_0.png)\n\
    \n```\nOuterStruct *pMyStruct;\nOuterStruct *pMyStruct = NULL;\nOuterStruct *pMyStruct(NULL);\n\
    OuterStruct *pMyStruct = nullptr;\n```\n\nWhen we omit an initialization value,\
    \ a variable is considered uninitialized if its memory belongs to certain memory\
    \ classes, such as stack. For static memory, it may be default-initialized with\
    \ zero memory values.\n\nThe code example:\n\n```\nOuterStruct *pMyStruct;\nOuterStruct\
    \ *pMyStruct = NULL;\nOuterStruct *pMyStruct(NULL);\nOuterStruct *pMyStruct =\
    \ nullptr;\n```\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_110_0.png)\n\nWhen\
    \ we use the new way of initialization in modern C++, we can use empty {} to signal\
    \ default initialization even for stack memory.\n\nThe code example:\n\n```\n\
    OuterStruct *pMyStruct{}\nOuterStruct *pMyStruct{NULL};\nOuterStruct *pMyStruct{nullptr};\n\
    OuterStruct *pMyStruct{&myStruct};\n```\n\n# Uniform Structure Initialization\n\
    \n```\nUniform Structure Initialization\n\nstruct OuterStruct\n{\n    int field1;\n\
    \    struct InnerStruct1\n    {\n        int field1;\n        int field2;\n  \
    \  } field2;\n    struct InnerStruct2\n    {\n        int field;\n    } field3;\n\
    } myStructA {1, {2, 3}, {4}};\n\nstruct OuterStruct\n{\n    int field1{1};\n \
    \   struct InnerStruct1\n    {\n        int field1{2};\n        int field2{3};\n\
    \    } field2;\n    struct InnerStruct2\n    {\n        int field{4};\n    } field3;\n\
    } myStructB;\n```\n\nIt is possible to uniformly initialize the structure outside\
    \ or provide default field initializers in the structure definition.\n\nThe code\
    \ example:\n\n```struct\nstruct OuterStruct\n{\n    int field1;\n    struct InnerStruct1\n\
    \    {\n        int field1;\n        int field2;\n    } field2;\n    struct InnerStruct2\n\
    \    {\n        int field;\n    } field3;\n} myStructA {1, {2, 3}, {4}};\n\nstruct\
    \ OuterStruct\n{\n    int field1{1};\n    struct InnerStruct1\n    {\n       \
    \ int field1{2};\n        int field2{3};\n    } field2;\n    struct InnerStruct2\n\
    \    {\n        int field{4};\n    } field3;\n} myStructB;\n```\n\n# Static Field\
    \ Initialization\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_112_0.png)\n\nThe\
    \ latest C++ standards allow static field initialization inside the structure\
    \ definition instead of the classic C++ ways of outside initialization (shown\
    \ in comments).\n\nThe code example:\n\n```cpp\nstruct MyStruct{\n  int field;\n\
    \  inline static unsigned shared_field{123};\n} myStruct1, myStruct2;\n\n// unsigned\
    \ MyStruct::shared_field = 123;\n\nmyStruct1.field = 0;\nmyStruct1.shared_field\
    \ = 123;\nmyStruct2.field = 1;\n```\n\n# Macros, Types, and Synonyms\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_113_0.png)\n\
    \nType names may be long or inconvenient. There are some ways to construct easier\
    \ names.\n\n# Macros\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_114_0.png)\n\n\
    The code example:\n\n```cpp\n#define TRUE 1\n#define byte_t unsigned char\n#define\
    \ p_byte_t unsigned char *\n#define p_MyStruct MyStruct *\n```\n\n# Old Way\n\n\
    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_115_0.png)\n\nThe code example:\n\n```cpp\n\
    typedef unsigned char byte_t;\ntypedef unsigned char *p_byte_t;\ntypedef struct\
    \ MyStruct *p_MyStruct;\n```\n\n# New Way\n\n```cpp\nusing byte_t = unsigned char;\n\
    using p_byte_t = unsigned char *;\nusing MyStruct;\n```\n\nThe code example:\n\
    \n```cpp\nusing byte_t = unsigned char;\nusing p_byte_t = unsigned char *;\nusing\
    \ MyStruct = {};\n```\n\n# Memory Storage\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_117_0.png)\n\
    \nWhat memory storage is used to store values ultimately influences program behavior\
    \ and possible defects.\n\n# Overview\n\n- Global\n- Static\n- Function static\n\
    - Local (stack)\n- Dynamic (heap)\n- Local-dynamic (stack → heap)\n- Polymorphic-ator\n\
    \nHere, we show the list of different storage types and talk about them later.\
    \ We cover polymorphic allocators in the next edition.\n\n# Thread Stack\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_119_0.png)\n\
    \nWhen a function is called, a stack frame is allocated in the thread stack region\
    \ to hold local variables' values.\n\n# Local Variable Lifecycle\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_120_0.png)\n\
    \nSince the stack frame memory can be overwritten by the return from the function\
    \ by subsequent calls, local variable values have definite values only during\
    \ the function call where they were initialized.\n\nThe code examples corresponding\
    \ to the memory diagrams:\n\nBefore calling the foo function, the memory values\
    \ before the current stack frame are undefined:\n\n```cpp\nint *p = foo();\nint\
    \ i = *p;\nbar();\nint j = *p;\n```\n\nWhen we enter the foo function, the corresponding\
    \ stack frame is created. The function code also initializes the local variable\
    \ a with 0. The function also returns the stack address of that local variable:\n\
    \n```cpp\nint *foo()\n{\n    int a = 0;\n    return &a;\n}\n```\n\nIn the caller,\
    \ we save that value at that address in the i variable. Then we call the bar function:\n\
    \n```cpp\nint *p = foo();\nint i = *p;\nbar();\nint j = *p;\n```\n\nWhen we enter\
    \ the bar function, the corresponding stack frame is created. The function code\
    \ also initializes the local variable a with 1. Coincidentally, the variable a\
    \ occupies the same stack memory location as the local variable a in the previous\
    \ foo function call:\n\n```cpp\nvoid bar()\n{\n    int a = 1;\n}\n```\n\nUpon\
    \ the return from the bar function, we dereference the same p address but get\
    \ a different value:\n\n```cpp\nint *p = foo();\nint i = *p;\nbar();\nassert(i\
    \ == j);\n```\n\n# Stack Allocation Pitfalls\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_122_0.png)\n\
    \nPlease don't forget that stack frame memory for all function local variables\
    \ is allocated at the entrance of the function, but individual variables may be\
    \ initialized at a later time.\n\nThe code example corresponding to the memory\
    \ diagram:\n\n# foo(1);\n\nWhen we enter the foo function, the allocated stack\
    \ frame includes the local variable c, which is initially uninitialized:\n\n```cpp\n\
    void foo(int i)\n{\n  ...\n}\n```\n\nIf the value of the i function parameter\
    \ is positive, the initialization of the local variable c is skipped, and the\
    \ assertion is failed:\n\n```cpp\nvoid foo(int i)\n{\n    int a = 0;\n    {\n\
    \        int b = 0;\n    }\n    if (i)\n        goto end;\n    int c = 0x78563412;\n\
    end:\n    assert(c == 0x78563412);\n}\n```\n\n# Explicit Local Allocation\n\n\
    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_124_0.png)\n\nIt is possible to explicitly\
    \ allocate memory on the thread stack, for example, for some variable-length array\
    \ storage. However, be aware of the possible stack overflow.\n\n# Dynamic Allocation\
    \ (C-style)\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_125_0.png)\n\nThere are\
    \ some advantages to a dynamic memory allocation compared to a local stack allocation.\
    \ The allocated memory and its values persist across function calls. Since allocations\
    \ are implemented by library calls, they can be replaced with other libraries\
    \ and custom code that provides debugging capabilities for tracking memory allocations\
    \ and deallocations, as well as other checks.\n"
