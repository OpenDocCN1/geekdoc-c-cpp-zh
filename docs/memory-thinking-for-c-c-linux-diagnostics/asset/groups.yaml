    # Uniform Initialization


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_108_0.png)


    Throughout C++ history, there were several ways to initialize variables. Finally,
    there is some uniform way to do it consistently.'
  - '[PAGE 109]


    # Old Initialization Ways


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_109_0.png)


    ```

    OuterStruct *pMyStruct;

    OuterStruct *pMyStruct = NULL;

    OuterStruct *pMyStruct(NULL);

    OuterStruct *pMyStruct = nullptr;

    ```


    When we omit an initialization value, a variable is considered uninitialized if
    its memory belongs to certain memory classes, such as stack. For static memory,
    it may be default-initialized with zero memory values.


    The code example:


    ```

    OuterStruct *pMyStruct;

    OuterStruct *pMyStruct = NULL;

    OuterStruct *pMyStruct(NULL);

    OuterStruct *pMyStruct = nullptr;

    ```'
  - '[PAGE 110]


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_110_0.png)


    When we use the new way of initialization in modern C++, we can use empty {} to
    signal default initialization even for stack memory.


    The code example:


    ```

    OuterStruct *pMyStruct{}

    OuterStruct *pMyStruct{NULL};

    OuterStruct *pMyStruct{nullptr};

    OuterStruct *pMyStruct{&myStruct};

    ```'
