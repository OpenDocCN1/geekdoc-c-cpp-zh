    # Arrays


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_55_0.png)


    An array is a contiguous sequence of n-cells in memory called array elements.
    Each array element has its own address. Since the size of each array element is
    fixed and the same, addressing the random element is fast.'
- md: "\n# Arrays and Pointers to Arrays\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_56_0.png)\n\
    \nThe array address is the address of its first element. But a pointer to an array\
    \ is a different memory cell that contains the array address. This is similar\
    \ to structures and pointers to structures. An array can be considered as a structure\
    \ as well.\n\n# Strings and Pointers to Strings\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_57_0.png)\n\
    \nWhat about strings? An ASCII string is a zero-terminated array of one-byte memory\
    \ cells. The address of a string is the address of its first byte. Similar to\
    \ arrays, a pointer to a string is a memory cell that contains the address of\
    \ the string, the address of its first element – its first character.\n\n# Basic\
    \ Types\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_58_0.png)\n\nNow, we look\
    \ at a few fundamental basic types.\n\n# ASCII Characters and Pointers\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_59_0.png)\n\
    \n```\n2ab1000:   'H'               2ab1216: 2ab1000\n2ab1001:   'e'         \
    \    char c;           // pstr == 2ab1000\n2ab1002:   '1'               char *pstr;\
    \      // 2ab1216\n2ab1003:   '1'               c = *pstr;       // c == 'H'\n\
    \                               ++pstr;\n2ab1004:   'o'               c = *pstr;\
    \        // c == 'e'\n2ab1005:   00                c = *(pstr+1);   // c == 'l'\n\
    ```\n\nWe have already looked at ASCII zero-terminated strings and pointers conceptually\
    \ using memory diagrams. Here, we look at some idiomatic C code.\n\nThe code example\
    \ corresponding to the memory diagram:\n\n```\nchar c;               // pstr ==\
    \ 2ab1000\nchar *pstr;          // 2ab1216\n&pstr;                // c == 'H'\n\
    c = *pstr;            // 2ab1001\n++pstr;\nc = *pstr;            // c == 'e'\n\
    c = *(pstr+1);        // c == 'l'\n```\n\n# Bytes and Pointers\n\n```\n2ab1000:\
    \ 12          2ab1216: 2ab1000\n2ab1001: 34          unsigned char b;\n2ab1002:\
    \ 56          unsigned char *pb; // pb == 2ab1000\n                        &pb;\
    \ // 2ab1216\n2ab1003: 78          b = *pb; // b == 12\n                     \
    \   ++pb; // 2ab1001\n2ab1004: ab           b = *pb; // b == 34\n            \
    \            b = *(pb+1); // b == 56\n2ab1005: cd\n```\n\nCharacters are signed\
    \ with small integer values from -128 to 127. But if we\nwant to work with bytes\
    \ with unsigned values from 0 to 255, we need to use\nunsigned characters. Later,\
    \ we see what other types are available to work\nwith bytes.\n\nThe code example\
    \ corresponding to the memory diagram:\n\n```\nunsigned char b;\nunsigned char\
    \ *pb; // pb == 2ab1000\n&pb; // 2ab1216\nb = *pb; // b == 12\n++pb; // 2ab1001\n\
    b = *pb; // b == 34\nb = *(pb+1); // b == 56\n```\n\n# Wide Characters and Pointers\n\
    \n```\n2ab1000:   'H'               2ab1216:    2ab1000\n               0    \
    \                             wchar_t wc;\n2ab1002:   'e'               wchar_t\
    \ *pwstr; // pwstr == 2ab1000\n                                 // 2ab1216\n \
    \                              wc = *pwstr;     // wc == L'H'\n              \
    \                 ++pwstr;          // 2ab1216\n2ab1004:   00                c\
    \ = *pwstr;      // c == L'e'\n                                 c = *(pwstr+1);\
    \   // c == L'\\0'\n```\n\nIf you want to use UNICODE, it is natural to use wide\
    \ characters that occupy two bytes each.\n\nThe code example corresponding to\
    \ the memory diagram:\n\n```\nwchar_t wc;\nwchar_t *pwstr; // pwstr == 2ab1000\n\
    &pwstr;          // 2ab1216\nwc = *pwstr;      // wc == L'H'\n++pwstr;       \
    \   // 2ab1002\nc = *pwstr;      // c == L'e'\nc = *(pwstr+1);   // c == L'\\\
    0'\n```\n\n# Integers\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_62_0.png)\n\n\
    The second type we look at now is integers, which occupy 4 bytes.\n\nThe code\
    \ example corresponding to the memory diagram:\n\n```\nint i; // 2ab1000\n*pi;\
    \ // 2ab1216\n&pi; // i == 0x2ab1008\ni = *pi; // 2ab1004\n++pi;\ni = *pi; //\
    \ i == 0xffffffff\n// i = -1\ni = *(pi+1); // i == 0x2ab1010\n```\n\n# Little-Endian\
    \ System\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_63_0.png)\n\nWhen converting\
    \ between byte sequences and numbers, we need to consider the little-endian system\
    \ where the least significant digits reside at the lowest addresses.\n\nThe code\
    \ example corresponding to the memory diagram:\n\n```\nchar ba[4]; // { 1, 2,\
    \ 3, 4 }\nint i; // 0x403021\n```\n\n# Short Integers\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_64_0.png)\n\
    \nShort integers occupy 2 bytes.\n\nThe code example corresponding to the memory\
    \ diagram:\n\n```\nshort s; // 2ab1000\nshort *ps; // 2ab1216\n&ps; // s = 0x1008\n\
    s = *ps; // s = 2ab\n++ps;\ns = *ps; // s = 0xffff\ns = *(ps+1); // s =\n```\n\
    \n# Long and Long Long Integers\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_65_0.png)\n\
    \n| Address | Value | Address | Value |\n|---|---|---|---|\n| 2ab1000 | 2ab1008\
    \ | 2ab1216 | 2ab1000 |\n| 2ab1004 | ffffffff | | |\n| 2ab1008 | 2ab1010 | | |\n\
    | 2ab100c | 2ab10c | | |\n| 2ab1010 | 00000000 | | |\n| 2ab1014 | 00002000 | |\
    \ |\n\n```\nlong l; // long long\nlong *pl; // 2ab1000\n&pl; // 2ab1216\nl = *pl;\
    \ // ll == 0xffffffff2ab1010\n++pl; // 2ab1008\nl = *pl; // ll == 0x2ab10c2ab1010\n\
    l = *(pl+1); // ll == 0x20000000\n```\n\nIf we want 8-byte integers, we need to\
    \ use long or long long for portability.\n\nThe code example corresponding to\
    \ the memory diagram:\n\n```\n\n# Signed and Unsigned Integers\n\n- (signed) short\
    \ / unsigned short\n- (signed) int / unsigned int\n- (signed) long (int) / unsigned\
    \ long (int)\n- (signed) long long (int) / unsigned long long (int)\n\nWe need\
    \ to be careful to use unsigned variables in classic loops. The following code\
    \ loops indefinitely since the loop variable is always positive:\n\n```\nfor (unsigned\
    \ i = 0xffff; i >= 0; --i)\n{\n    // ...\n}\n```\n\nhttps://www.dumpanalysis.org/blog/index.php/2015/12/14/crash-dump-analysis-part-14-linux/\n\
    \n# Fixed Size Integers\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_67_0.png)\n\
    \nIt is also possible to be precise and use portable fixed-size types.\n\nThe\
    \ code example:\n\n```\nuint8_t b;\nuint32_t dw;\nuint64_t qw;\nuintptr_t p;\n\
    ```\n\n# Booleans\n\n```bool b;\nb = true;\nb = false;\n```\n\nC++ also includes\
    \ a native type for boolean variables. If you want to use it in pure C, you need\
    \ to include the `stdbool.h` header.\n\nThe code example:\n\n```bool b;\nb = true;\n\
    b = false;\n```\n\n# Bytes\n\n```std::byte b;\n```\n\n- Not a character\n- Not\
    \ an integer\n\nThe latest C++ standards also include a distinct type for bytes.\n\
    \nThe code example:\n\n```std::byte b;\n```\n\n# Size\n\n- `sizeof` operator\n\
    - size_t size = sizeof(int);\n- int i; size = sizeof i;\n- size = sizeof(1 + 1);\n\
    \nThe `sizeof` operator can evaluate the size of types, variables, and target\
    \ result types of expressions (without expression evaluation).\n\nThe code example:\n\
    \n```\nsize_t size = sizeof(int);\n\nint i;\n\nsize = sizeof i;\nsize = sizeof(1\
    \ + 1);\n```\n\n# Alignment\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_71_0.png)\n\
    \nVariables are usually aligned in memory at offsets divisible by their type size\
    \ in bytes. You can get default alignment values using the `alignof` operator\
    \ and change the default alignment using the `alignas` specifier.\n\nThe code\
    \ example:\n\n```\nsize_t align = alignof(long)\nalignas(4096) long l = 1;\n```\n\
    \n# LP64\n\n```\nsizeof(int) == 4\nsizeof(int *) == 8\nsizeof(long) == 8\nsizeof(long\
    \ long) == 8\n```\n\nLinux uses the so-called LP64 data model, where long integers\
    \ and pointers are 64-bit.\n\n# Nothing and Anything\n\n```c\nvoid foo(void);\n\
    void *p;\n```\n\nTwo distinct types correspond to the concepts of Nothing and\
    \ Anything can find in other programming languages: void and void *. The latter\
    \ is a pointer to any type.\n\nThe code example:\n\n```c\nvoid foo(void);\nvoid\
    \ *p;\n```\n"
  mdcn: "\n\n# 数组与数组指针\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_56_0.png)\n\n数组地址是其第一个元素的地址。但指向数组的指针是一个不同的内存单元，它包含了数组的地址。这与结构体和指向结构体的指针相似。数组也可以被视为一种结构体。\n\
    \n# 字符串与字符串指针\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_57_0.png)\n\n字符串又是呢？ASCII\
    \ 字符串是一个零终止的单字节内存单元数组。字符串的地址是其第一个字节的地址。与数组类似，字符串的指针是一个内存单元，它包含了字符串的地址，即其第一个元素的地址——它的第一个字符。\n\
    \n# 基础类型\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_58_0.png)\n\n现在，我们来看几个基础基础类型。\n\
    \n# ASCII 字符与指针\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_59_0.png)\n\n```\n\
    2ab1000:   'H'               2ab1216: 2ab1000\n2ab1001:   'e'             char\
    \ c;           // pstr == 2ab1000\n2ab1002:   '1'               char *pstr;  \
    \    // 2ab1216\n2ab1003:   '1'               c = *pstr;       // c == 'H'\n \
    \                              ++pstr;\n2ab1004:   'o'               c = *pstr;\
    \        // c == 'e'\n2ab1005:   00                c = *(pstr+1);   // c == 'l'\n\
    ```\n\n我们已经通过内存图在概念上看过了 ASCII 零终止字符串和指针。在这里，我们来看一些惯用的 C 代码。\n\n与内存图对应的代码示例：\n\n\
    ```\nchar c;               // pstr == 2ab1000\nchar *pstr;          // 2ab1216\n\
    &pstr;                // c == 'H'\nc = *pstr;            // 2ab1001\n++pstr;\n\
    c = *pstr;            // c == 'e'\nc = *(pstr+1);        // c == 'l'\n```\n\n\
    # 字节与指针\n\n```\n2ab1000: 12          2ab1216: 2ab1000\n2ab1001: 34          unsigned\
    \ char b;\n2ab1002: 56          unsigned char *pb; // pb == 2ab1000\n        \
    \                &pb; // 2ab1216\n2ab1003: 78          b = *pb; // b == 12\n \
    \                       ++pb; // 2ab1001\n2ab1004: ab           b = *pb; // b\
    \ == 34\n                        b = *(pb+1); // b == 56\n2ab1005: cd\n```\n\n\
    字符是用带有 -128 到 127 的小整数值符号的。但如果我们想处理范围从 0 到 255 的无符号字节，我们需要使用 `unsigned char`。稍后，我们将看到还有其他类型可以处理字节。\n\
    \n与内存图对应的代码示例：\n\n```\nunsigned char b;\nunsigned char *pb; // pb == 2ab1000\n\
    &pb; // 2ab1216\nb = *pb; // b == 12\n++pb; // 2ab1001\nb = *pb; // b == 34\n\
    b = *(pb+1); // b == 56\n```\n\n# 宽字符与指针\n\n```\n2ab1000:   'H'              \
    \ 2ab1216:    2ab1000\n               0                                 wchar_t\
    \ wc;\n2ab1002:   'e'               wchar_t *pwstr; // pwstr == 2ab1000\n    \
    \                             // 2ab1216\n                               wc =\
    \ *pwstr;     // wc == L'H'\n                               ++pwstr;         \
    \ // 2ab1216\n2ab1004:   00                c = *pwstr;      // c == L'e'\n   \
    \                              c = *(pwstr+1);   // c == L'\\0'\n```\n\n如果你想使用\
    \ UNICODE，使用每个占用两个字节的宽字符是自然的选择。\n\n与内存图对应的代码示例：\n\n```\nwchar_t wc;\nwchar_t *pwstr;\
    \ // pwstr == 2ab1000\n&pwstr;          // 2ab1216\nwc = *pwstr;      // wc ==\
    \ L'H'\n++pwstr;          // 2ab1002\nc = *pwstr;      // c == L'e'\nc = *(pwstr+1);\
    \   // c == L'\\0'\n```\n\n# 整数\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_52_0.png)\n\
    \n我们现在来看第二种占用 4 字节的整数。\n\n与内存图对应的代码示例：\n\n```\nint i; // 2ab1000\n&pi; // 2ab1116\n\
    i;\ni = 0ffffffffffff // i = -1\ni = *(pi+1); // i == 0ab1010\n```\n\n# 小端序系统\n\
    \n![](img/c36cc1b69ac7baa75db5d1315bbd30_63_0.png)\n\n在字节序列和数字之间转换时，需要考虑低位字节位于最低地址的小端序系统。\n\
    \n与内存图对应的代码示例：\n\n```\nchar ba[4]; // { 1, 2, 3, 4 }\nint i; // 0x40301\n```\n\
    \n# 短整数\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_64_0.png)\n\n短整数占用 2 字节。\n\
    \n与内存图对应的代码示例：\n\n```\nshort s; // 2ab1000\nshort *ps; // 2ab1216\n&ps; // s =\
    \ 0x1008\ns = *ps; // s = 2ab\n++ps;\ns = *ps; // s = 0xffff\ns = *(ps+1); //\
    \ s =\n```\n\n# 长整数与长长整数\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_65_0.png)\n\
    \n| 地址 | 值 | 地址 | 值 |\n|---|---|---|---|\n| 2ab1000 | 2ab1008 | 2ab1216 | 2ab1000\
    \ |\n| 2ab1004 | ffffffff | | |\n| 2ab1008 | 2ab1010 | | |\n| 2ab100c | 2ab10c\
    \ | | |\n| 2ab1010 | 00000000 | | |\n| 2ab1014 | 00002000 | | |\n\n```\nlong l;\
    \ // long long\nlong *pl; // 2ab1000\n&pl; // 2ab1216\nl = *pl; // ll == 0xffffffff2ab1010\n\
    ++pl; // 2ab1008\nl = *pl; // ll == 0x2ab10c2ab100\nl = *(pl+1); // ll == 0x20000000\n\
    ```\n\n我们需要 8 字节整数，需要使用 `long` 或 `long long` 来保证移植性。\n\n# 有符号整数\n\n- (有符号) short\
    \ / 无符号 short\n- (有符号) int / 无符号 int\n- (有符号) long (int) / 无符号 long (int)\n- (有符号)\
    \ long long (int) / 无符号 long long (int)\n\n在经典循环中使用无符号变量需要小心。以下代码会无限循环，因为循环变量始终为正：\n\
    \n```\nfor (unsigned i = 0xffff; i >= 0; --i)\n{\n    // ...\n}\n```\n\nhttps://www.dumpanalysis.org/blog/index.php/2015/12/14/crash-dump-analysis-part-14-linux/\n\
    \n# 固定大小整数\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_67_0.png)\n\n也可以精确地使用可移植的固定大小类型。\n\
    \n代码示例：\n\n```\nuint8_t b;\nuint32_t dw;\nuint64_t qw;\nuintptr_t p;\n```\n\n\
    # 布尔值\n\n```\nbool b;\nb = true;\nb = false;\n```\n\nC++ 也包含布尔变量的原生类型。如果你想在纯 C\
    \ 中使用它，需要包含 `stdbool.h` 头文件。\n\n代码示例：\n\n```\nbool b;\nb = true;\nb = false;\n\
    ```\n\n# 字节\n\n```cpp\nstd::byte b;\n```\n\n- 不是字符\n- 不是整数\n\n最新的 C++ 标准也包含一种专门的字节类型。\n\
    \n代码示例：\n\n```cpp\nstd::byte b;\n```\n\n# 大小\n\n- `sizeof` 运算符\n- `size_t size\
    \ = sizeof(int);\n- int i; size = sizeof i;\n- size = sizeof(1 + 1);\n\n`sizeof`\
    \ 运算符可以评估类型、变量以及表达式的结果类型的大小（而不进行表达式求值）。\n\n代码示例：\n\n```\nsize_t size = sizeof(int);\n\
    \nint i;\n\nsize = sizeof i;\nsize = sizeof(1 + 1);\n```\n\n"
