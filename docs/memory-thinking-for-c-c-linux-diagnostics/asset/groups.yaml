- md: '

    # About the Author


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_16_0.png)


    Dmitry Vostikov is an internationally recognized expert, speaker, educator, scientist,
    inventor, and author. He founded the pattern-oriented software diagnostics, forensics,
    and prognosis discipline (Systematic Software Diagnostics) and Software Diagnostics
    Institute (DA+TA:DumpAnalysis.org + TraceAnalysis.org). Vostikov has also authored
    50 books on software diagnostics, anomaly detection and analysis, software and
    memory forensics, root cause analysis and problem solving, memory dump analysis,
    software trace and log analysis, reverse engineering, and malware analysis. He
    has over 25 years of experience in software architecture, design, development,
    and maintenance in various industries, including leadership, technical, and people
    management roles. Dmitry also found Systematix.io, BieTrace, DiaThings, Loglett,
    OpenTask Iterative and Incremental Publishing (OpenTask.com), Software Diagnostics
    Technology and Services (former Memory Dump Analysis Services) PatternDiagnostics.com,
    and Software Prognostics. In his spare time, he presents various topics on on
    Debugging.TV and explores Software Narratology, its further development as Narratology
    of Things and Diagnostics of Things (DoT), Software Pathology, and Quantum Software
    Diagnostics. His current interest areas are theoretical software diagnostics and
    its mathematical and computer science foundations, application of formal logic,
    artificial intelligence, machine learning and data mining to diagnostics and anomaly
    detection, software diagnostics engineering and diagnostics-driven development,
    diagnostics workflow and interaction. Recent interest areas also include cloud
    native computing, security, automation, functional programming, applications of
    category theory to software development and big data, and diagnostics of artificial
    intelligence.


    # Introduction


    Original Training Course Name


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_17_0.png)


    # Prerequisites


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_18_0.png)


    To get most of this training, you are expected to have basic development experience
    in a programming language other than C or C++ and optional basic memory dump analysis
    experience. I also included the necessary x64 and A64 disassembly reviews for
    some topics.


    ## Training Goals


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_19_0.png)


    Our primary goal is to learn C and C++ and its internals in an accelerated fashion.
    First, we review common C and C++ fundamentals necessary for software diagnostics.
    Then, we learn various C++ features with a focus on memory and internals. We also
    see examples of how the knowledge of C and C++ helps in diagnostics and debugging.


    ## Training Principles


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_20_0.png)


    There were many training formats to consider, and I decided that the best way
    is to concentrate on slides and code examples you can verify.


    ## Schedule


    ```

    std::vector<Session> sessions;

    assert(sessions.size() == 5);

    assert(sessions.capacity() > 5);

    ```


    I plan the training to have only 5 two-hour sessions, but I may extend it to more
    sessions if necessary to fit all necessary material in sufficient detail.


    ## Training Idea


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_22_0.png)


    After I created a similar Windows-based training, it was natural to port it to
    Linux. Also, attendees of core dump analysis and reversing training courses asked
    questions related to C and C++, and I realized that they would have also benefited
    if they had this training. This training may also fill some gaps between these
    courses. Finally, I recently developed the Accelerated Linux API training course
    (see the References section at the end of the book), where solid knowledge of
    classic and C++ is assumed, and the current C and C++ course may provide such
    knowledge.


    ## General C & C++ Aspects


    The general C and C++ aspects that we discuss in this course:


    - Philosophy of pointers

    - Structures, classes, and objects

    - Promotions and conversions

    - Macros, types, and synonyms

    - Source code organization, Pimpl

    - Pointer dereference walkthrough

    - Functions and function pointers

    - Inheritance

    - Operators, function objects

    - Destructors, virtual destructors

    - Local stack variables and values

    - Memory operators and expressions

    - Alignment

    - Slicing

    - Iterators as pointers

    - Lambdas and their internals

    - Threads and synchronization

    - Memory and pointers

    - Basic types

    - Memory and structures

    - Uniform initialization

    - Memory storage

    - References

    - Values, iters, values

    - Constant values and expressions

    - Namespaces

    - Constructors, copy, assignment

    - Virtual functions, pure methods

    - VTBL and VPTR

    - Access levels

    - Overloading, overriding

    - Templates

    - Memory ownership, RII

    - Smart pointers


    ## What We Do Not Cover


    We promise to include these in the second edition:


    - Enumerations

    - Move constructors and assignment

    - Deleted members

    - Universal references

    - Concepts

    - Coroutines

    - Modules

    - Tasks

    - Ranges

    - Container semantics and pragmatics

    - Container allocators


    ## Linux C++ Aspects


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_26_0.png)


    In addition, we discuss Linux-specific:


    - Macros

    - x64

    - A64

    - Parameter passing


    ## Why C & C++?


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_27_0.png)


    In this training, we look at:


    - Interfacing

    - Vulnerability

    - Reversing

    - Debugging

    - Monitoring

    - Secure coding

    - Static analysis

    - Trace and log


    ## Which C and C++?


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_29_0.png)


    We also look at:


    - Memory dump

    - Intersection

    - Presentation

    - Differences

    - System programming

    - Standards


    ## My History of C & C++


    | Year | Event/Topic |

    |---|---|

    | 1987 | C |

    | 1989 | C++ |

    | 1991 | C++ as a better C |

    | 1994-1995 | Implicit design patterns |

    | 2000 | C++ as proper C++ |

    | 2001 | C+/98/03/STL |

    | 2012 | BSD dump analysis |

    | 2015 | Linux core dump analysis |

    | 2016 | C++11/14 |

    | 2017 | C++17 |

    | 2020 | Functional programming |

    | 2022 | Linux system programming |

    | 2023 | C++20 |


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_30_0.png)


    My history slide is only about C and C++ languages. Despite many years, it is
    still easy to recall when I started learning C. It was shortly after I started
    my university education. And although my first programming language was FORTRAN,
    I read the classic K&R book in a library. C++ is harder to recall, but most likely
    it was in 1989, at least according to my old CV, which is the source of truth.
    I definitely using C++ in commercial projects around 1991 but as a better C, and
    there was no standard template library (STL) at that time. I recall some fascinating
    C++ GUI frameworks for MS-DOS, like Zinc. In 1994-1995, I designed a word processor,
    and in the process, I implicitly used many design patterns I later discovered
    in the GOF book in 2000. The authors also use a word processor for illustration.
    I understand C as C++ in 2000 when I read a book about CORBA distributed object
    technology used C++. I continued learning C++ by reading many books of that time
    and learned the merits of STL and also how to use it effectively. In 2001, I joined
    a company that developed C++ static analysis tools, and this greatly improved
    my C++ knowledge to the expert level at.

    '
  mdcn: '

    # 关于作者


    ![](img/c36cc1b69ac7baa75db5d1335bb9d30_16.png)


    Dmitry Vostikov 是一位国际认可的专家、演讲者、教育者、科学家和作者。他创立了面向模式的软件诊断 (Systematic Diagnostics)
    和软件取证学院 (Forensics Institute)。Vostikov 还编写了 50 多本关于软件诊断、异常检测、软件取证、根因分析、内存转储分析、软件跟踪、逆向工程和恶意软件分析的书。他在软件架构、设计、开发以及多个行业的维护方面拥有
    25 年以上的经验，担任过领导和技术管理角色。在空闲时间，他针对各种主题进行演讲，并探索 C++ 机制及其进一步发展。他目前的兴趣领域包括理论软件诊断以及计算机科学基础、形式逻辑、人工智能、机器学习、数据挖掘、诊断驱动的开发以及交互。最近的兴趣领域还包括云原生计算、安全、自动化、函数式编程、范畴论应用于开发和大数据以及人工智能。


    # 引言


    原始课程名称


    ![](img/c36cc1b69ac7baa75db5d1335bb9d30_17.png)


    # 前提条件


    ![](img/c36cc1b69ac7baa75db5d1335bb9d30_18.png)


    为了完成大部分培训，预计你具备 C 或 C++ 以外的编程语言基础开发经验，以及可选的内存转储分析经验。我还包含了某些主题的 x64 和 A64 反汇编回顾。


    ## 培训目标


    ![](img/c36cc1b69ac7baa75db5d1335bb9d30_19.png)


    我们的主要目标是以快速方式学习 C 和 C++ 及其内部机制。首先，我们将回顾软件诊断所需的 C 和 C++ 基础。然后，我们将重点关注内存和内部机制学习各种
    C++ 特性。我们还将查看 C 和 C++ 知识如何帮助诊断和调试。


    ## 培训原则


    ![](img/c36cc1b69ac7baa75db5d1335bb9d30_20.png)


    有很多种培训格式可以考虑，我决定最好的方法是集中在幻灯片和你可以验证的代码示例上。


    ## 课程安排


    ```

    std::vector<Session> sessions;

    assert(sessions.size() == 5);

    assert(sessions.capacity() > 5);

    ```


    我计划培训仅包含 5 节每两小时的课程，但如果有必要，我可以扩展到更多课程，以详细涵盖所有必要的材料。


    ## 培训理念


    ![](img/c36cc1b69ac7baa75db5d1335bb9d30_22.png)


    在创建了类似的 Windows 培训后，将其移植到 Linux 是自然而然的。此外，转储分析和逆向工程课程的参与者也提出了关于 C 和 C++ 的问题，我意识到如果他们参加这项培训，也将受益。这项培训也可以填补这些课程之间的某些空白。最后，我最近开发了快速
    Linux API 培训课程（参见书末的参考文献部分），该课程假设学员具备经典 C 和 C++ 的坚实知识，而当前的 C 和 C++ 课程可能提供此类知识。


    ## 通用 C & C++ 方面


    我们在课程中讨论的通用 C 和 C++ 方面：


    - 指针哲学

    - 结构体、类和对象

    - 提升与转换

    - 宏、类型和别名

    - 源码组织、Pimpl

    - 指针解引用详述

    - 函数和函数指针

    - 继承

    - 运算符、函数对象

    - 析构函数、虚析构函数

    - 局部栈变量和值

    - 内存运算符和表达式

    - 对齐

    - 切片 (Slicing)

    - 迭代器指针

    - Lambda 及其内部机制

    - 线程与同步

    - 内存和指针

    - 基础类型

    - 内存和结构体

    - 统一初始化

    - 内存存储

    - 引用

    - 值、迭代器、值

    - 常量值和表达式

    - 命名空间

    - 构造函数、拷贝、赋值

    - 虚函数、纯方法

    - VTBL 和 VPTR

    - 访问级别

    - 重载、重写

    - 模板


    ## 我们不涵盖的内容


    我们承诺在第二版中包含：


    - 枚举

    - 移动构造函数和赋值

    - 删除成员

    - 概念 (Concepts)

    - 协程

    - 模块 (Modules)

    - 范围 (Ranges)

    - 容器语义

    - 分配器


    ## Linux Aspects


    ![](img/c36cc1b69ac7baa75db5d1335bb9d30_26.png)


    此外，我们将讨论特定的：


    - 宏

    - x64

    - A64


    ## 为什么是 C & C++？


    ![](img/c36cc1b69ac7baa75db5d1335bb9d30_27.png)


    在培训中，我们将：


    - 接口

    - 漏洞

    - 调试

    - 监控

    - 安全编码

    - 静态分析


    ## 哪些 C 和 C++?


    ![](img/c36cc1b69ac7baa75db5d1335bb9d30_29.png)


    我们还将查看：


    - 内存转储

    - 演示

    - 差异

    - 系统编程

    - 标准


    '
