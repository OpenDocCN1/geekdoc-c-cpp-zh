  - '[PAGE 120]


    # Local Variable Value Lifecycle


    # Local Variable Value Lifecycle


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_120_0.png)


    Since the stack frame memory values can be overwritten by the return from the
    function by subsequent function calls, local variable values have definite values
    only during the function call where they were initialized.


    The code examples corresponding to the memory diagrams.


    Before calling the foo function, the memory values before the current stack frame
    are undefined:


    ```

    int *p = foo();

    int i = *p;

    bar();

    int j = *p;

    ```


    When we enter the foo function, the corresponding stack frame is created. The
    function code also initializes the local variable a with 0 value. The function
    also returns the stack address of that local variable:'
  - "[PAGE 121]\n\n```\nint *foo()\n{\n    int a = 0;\n    return &a;\n}\n```\n\n\
    In the caller, we save that value at that address in the i variable. Then we call\
    \ the bar function:\n\n```\nint *p = foo();\nint i = *p;\nbar();\nint j = *p;\n\
    ```\n\nWhen we enter the bar function, the corresponding stack frame is created.\
    \ The function code also initializes the local variable a with 1. Coincidentally,\
    \ the variable a occupies the same stack memory location as the local variable\
    \ a in the previous foo function call:\n\n```\nvoid bar()\n{\n    int a = 1;\n\
    }\n```\n\nUpon the return from the bar function, we dereference the same p address\
    \ but get a different value:\n\n```\nint *p = foo();\nint i = *p;\nbar();\nassert(i\
    \ == j);\n```"
