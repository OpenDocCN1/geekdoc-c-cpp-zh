- md: "\n## Wild (Dangling) Pointer\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_93_0.png)\n\
    \nMemory for a structure can be dynamically allocated and then deallocated, but\
    \ if a pointer is not reset to some value easy to check, such as 0, then we have\
    \ a dangling pointer with its dereferencing resulting in undefined behavior that\
    \ could lead to further corruption.\n\nThe code example:\n\n```\nMyStruct *pMyStruct\
    \ = new MyStruct;\ndelete pMyStruct;\n```\n\nMyStruct myStruct = *pMyStruct;\n\
    \n## Pointer to Pointer to Structure\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_94_0.png)\n\
    \nWe can also have pointers to pointers to structures and so on, with double and\
    \ more dereferences needed to get the value. We'll see why we need double-pointers\
    \ later when we discuss passing parameters to functions.\n\nThe code example:\n\
    \n```\nMyStruct *pMyStruct = &myStruct;\nMyStruct **ppMyStruct = &myStruct;\n\
    ```\n\n## Pointer to Pointer Dereference\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_95_0.png)\n\
    \nHere, we have double dereference illustrated.\n\nThe code example:\n\n```\n\
    MyStruct *pMyStruct = *ppMyStruct;\nMyStruct myStruct = *pMyStruct;\nmyStruct\
    \ = **ppMyStruct;\n```\n\n## Memory and Structures\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_96_0.png)\n\
    \nNow, we look at the memory representation of structures.\n\n## Addresses and\
    \ Structures\n\n```\nstruct OuterStruct {\n    int field1;\n    struct InnerStruct\
    \ {\n        int field1;\n        int field2;\n    } field2;\n    struct InnerStruct\
    \ {\n        int field;\n    } field3;\n    } myStruct;\n```\n\n| 2ab1000 | 2ab1008\
    \ |\n|--- | --- |\n| 2ab1004 | ffffffff |\n| 2ab1008 | 2ab1010 |\n| 2ab1008 |\
    \ 2ab100c |\n| 2ab1010 | 00000000 |\n| 2ab1014 | 00002000 |\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_97_0.png)\n\
    \nA structure in memory is a sequential collection of memory cells; some be multicell\
    \ and themselves substructures. Each part of its, member, or structure field has\
    \ its own address as well, in addition to the overall address of the structure.\n\
    \nThe code example corresponding to the memory diagram:\n\n```\nstruct OuterStruct\
    \ {\n    int field1;\n    struct InnerStruct {\n        int field1;\n        int\
    \ field2;\n    } field2;\n    struct InnerStruct {\n        int field;\n    }\
    \ field3;\n    } myStruct;\n```\n\n## Structure Field Access\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_98_0.png)\n\
    \n```\n&myStruct; // 2ab1004\nmyStruct.field1; // 2ab1004\nmyStruct.field1; //\
    \ fffffff\nmyStruct.field2; // 2ab1008\n&myStruct.field2; // 2ab1008\nmyStruct.field2.field1;\
    \ // 2ab1010\nmyStruct.field2.field2; // 2ab100c\nmyStruct.field2.field2; // 2ab100c\n\
    &myStruct.field3; // 2ab1010\nmyStruct.field3.field; // 2ab1010\nmyStruct.field3.field;\
    \ // 0\n```\n\nThis example shows field addresses and access when we have a structure\
    \ value.\n\nThe code example corresponding to the memory diagram:\n\n```\n&myStruct;\
    \ // 2ab1004\nmyStruct.field1; // 2ab1004\nmyStruct.field1; // fffffff\nmyStruct.field2;\
    \ // 2ab1008\n&myStruct.field2; // 2ab1008\nmyStruct.field2.field1; // 2ab1010\n\
    myStruct.field2.field1; // 2ab1010\nmyStruct.field2.field2; // 2ab100c\nmyStruct.field2.field2;\
    \ // 2ab100c\n&myStruct.field3; // 2ab1010\nmyStruct.field3.field; // 2ab1010\n\
    myStruct.field3.field; // 0\n```\n\n## Pointers to Structures\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_99_0.png)\n\
    \nA structure has its address. A pointer to a structure is a memory cell that\
    \ contains that address. It has its own address.\n\nThe code example corresponding\
    \ to the memory diagram:\n\n```\nOuterStruct *pMyStruct = &myStruct;\n&myStruct;\
    \ // 2ab1004\npMyStruct; // 2ab1004\n&pMyStruct; // 2ab126\n```\n\n## Pointers\
    \ to Structure Fields\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_100_0.png)\n\
    \nThis example shows field addresses and access when we have a pointer to a structure.\n\
    \nThe code example corresponding to the memory diagram:\n\n```\npMyStruct; //\
    \ 2ab1004\npMyStruct->field1; // 2ab1004\npMyStruct->field1; // fffffff\npMyStruct->field2;\
    \ // 2ab1008\n&pMyStruct->field2; // 2ab1008\npMyStruct->field2.field1; // 2ab1010\n\
    pMyStruct->field2.field2; // 2ab100c\npMyStruct->field2.field2; // 2ab100c\n&pMyStruct->field3;\
    \ // 2ab1010\npMyStruct->field3.field; // 2ab1010\npMyStruct->field3.field; //\
    \ 0\n```\n\n## Structure Inheritance\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_101_0.png)\n\
    \nStructures can inherit fields from other structures. In case of same field names,\
    \ the derived structure hides the base structure fields, but they can be accessed\
    \ by explicit qualification:\n\n```\nstruct Base {\n  int field;\n};\nstruct Derived\
    \ : Base {\n  int field;\n  int field2;\n} myDerived;\nmyDerived.field;\nmyDerived.Base::field;\n\
    Base *pMyBase = &myDerived;\npMyBase->field;\n```\n\n## Structure Slicing\n\n\
    ```\nstruct Base {\n    int field;\n};\nstruct Derived : Base {\n    int field2;\n\
    \    myDerived { 0 };\n};\n\nBase myBase = myDerived;\nmyBase = static_cast<Base>(myBase);\n\
    \nBase *pMyBase = &myDerived;\nDerived *pMyBase = pMyBase;\n\nDerived *pMyBase\
    \ = static_cast<Derived *>(pMyBase);\n```\n\nIt is possible to copy a derived\
    \ structure to a base variable, but in this case, the former are sliced since\
    \ the base structure occupies less memory. The other way around, from the base\
    \ structure, is forbidden by default because the compiler doesn't know how to\
    \ fill the derived fields. However, this can be forced with a static cast where\
    \ the derived fields are filled with the existing memory content, which can be\
    \ completely random. The same downcast can be done between pointers, but when\
    \ we try to dereference a target pointer to the derived structure later, we may\
    \ get random data.\n\nThe code example:\n\n```\nstruct Base {\n    int field;\n\
    };\n```\n\n```\nstruct Derived : Base\n{\n    int field2;\n} myDerived { 0 };\n\
    \nBase myBase = myDerived;\nmyBase = static_cast<Base>(myBase);\n\nBase *pMyBase\
    \ = &myDerived;\nDerived *pMyBase = pMyBase;\nDerived *pMyBase = static_cast<Derived*>(pMyBase);\n\
    ```\n\n## Inheritance Access Level\n\n```\nstruct Base {\n  int field;\n};\n\n\
    struct Derived : private Base {\n  int field;\n  int field2;\n} myDerived;\n\n\
    myDerived.field;\nmyDerived.Base::field;\n\nBase *pMyBase = &myDerived;\npMyBase->field;\n\
    ```\n\nIt is possible to inherit privately. In such a case, the base structure\
    \ fields are inaccessible from the outside, even with the explicit qualification.\n\
    \nThe code example:\n\n```\nstruct Base {\n  int field;\n};\n\nstruct Derived\
    \ : private Base {\n  int field;\n  int field2;\n} myDerived;\n\nmyDerived.field;\n\
    myDerived.Base::field;\n\nBase *pMyBase = &myDerived;\npMyBase->field;\n```\n\n\
    ## Structures and Classes II\n\n```\nstruct class\n\nstruct Base Base {\n  //\
    \ public:\n  int field;\n};\nstruct Derived : Base (public) {\n  // ...\n};\n\
    class Derived : public Base (private) {\n  // ...\n};\n```\n\nAgain, structures\
    \ and classes are almost equivalent except for the default inheritance access\
    \ (and field access), which is, by default, public for structures and private\
    \ for classes. Public access needs to be specified explicitly for classes. We\
    \ do not discuss protected access in this training, which is not really relevant\
    \ for memory thinking when looking at built code.\n\nThe code example:\n\n```\n\
    struct Base Base {\n  // public:\n  int field;\n};\nstruct Derived : Base (public)\
    \ {\n  // ...\n};\nclass Derived : public Base (private) {\n  // ...\n};\n```"
  mdcn: "\n\n## 野指针（悬空指针）\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_93_0.png)\n\n\
    结构体的内存可以被动态分配然后释放，但如果指针没有重置为某个易于检查的值（例如 0），那么我们就会得到一个悬空指针，对其进行解引用会导致未定义行为，并可能导致进一步的损坏。\n\
    \n代码示例：\n\n```\nMyStruct *pMyStruct = new MyStruct;\ndelete pMyStruct;\n```\n\n\
    MyStruct myStruct = *pMyStruct;\n\n## 指向结构体的指针指针\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_94_0.png)\n\
    \n我们也可以拥有指向结构体的指针，以此类推，需要两次或多次解引用才能获取该值。稍后在讨论向函数传递参数时，我们将看到为什么我们需要双指针。\n\n代码示例：\n\
