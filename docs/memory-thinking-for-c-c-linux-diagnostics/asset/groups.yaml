  - '[PAGE 76]


    # Pointer Conversion (C-Style)


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_76_0.png)


    | 2ab1000 | 12 | 2ab1216 | 2ab1000 |

    |---|---|---|--|

    | 2ab1001 | 34 | unsigned char b; int i; |

    | 2ab1002 | 56 | unsigned char *pb; // pb == 2ab1000 |

    | 2ab1003 | 78 | // 2ab1216 b = *pb; // b == 12 |

    | 2ab1004 | ab | int *pi = (int *)pb; // pi == 2ab1000 |

    | 2ab1005 | cd | &pi; // != 2ab1216 i = *pi; // i == 0x78563412 // Intel LSB endian
    |


    Pointers can be converted to each other freely because their value is just a memory
    address. However, when we dereference them, we get the value based on underlying
    memory contents, which don''t change as illustrated here. Please also note that
    due to the least significant endian convention, the integer value we get differs
    from the memory layout byte order.


    The code example corresponding to the memory diagram:


    ```

    unsigned char b; int i;

    unsigned char *pb; // pb == 2ab1000

    &pb; // 2ab1216

    b = *pb; // b == 12

    int *pi = (int *)pb; // pi == 2ab1000

    &pi; // != 2ab1216

    i = *pi; // i == 0x78563412

    // Intel LSB endian

    ```'
