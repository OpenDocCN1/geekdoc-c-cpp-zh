  - '[PAGE 62]


    # Integers


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_62_0.png)


    The second type we look at now is integers, which occupy 4 bytes.


    The code example corresponding to the memory diagram:


    ```

    int i; // 2ab1000

    *pi; // 2ab1216

    &pi; // i == 0x2ab1008

    i = *pi; // 2ab1004

    ++pi;

    i = *pi; // i == 0xffffffff

    // i = -1

    i = *(pi+1); // i == 0x2ab1010

    ```'
  - '[PAGE 63]


    # Little-Endian System


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_63_0.png)


    When converting between byte sequences and number values, we need to consider
    the little-endian system where the least significant digits reside at the lowest
    memory addresses.


    The code example corresponding to the memory diagram:


    ```

    char ba[4]; // { 1, 2, 3, 4 }

    int i; // 0x4030201

    ```'
  - '[PAGE 64]


    # Short Integers


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_64_0.png)


    Short integers occupy 2 bytes.


    The code example corresponding to the memory diagram:


    ```

    short s; // 2ab1000

    short *ps; // 2ab1216

    &ps; // s = 0x1008

    s = *ps; // s = 2ab1002

    ++ps;

    s = *ps; // s = 0x2ab

    s = *(ps+1); // s = 0xffff

    ```'
  - '[PAGE 65]


    # Long and Long Long Integers


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_65_0.png)


    | 2ab1000 | 2ab1008 | 2ab1216 | 2ab1000 |

    |---|---|---|--|

    | 2ab1004 | ffffffff | | |

    | 2ab1008 | 2ab1010 | | |

    | 2ab100c | 2ab100c | | |

    | 2ab1010 | 00000000 | | |

    | 2ab1014 | 00002000 | | |


    ```

    long l; // long long ll;

    long *pl; // 2ab1000

    &pl; // 2ab1216

    l = *pl;

    // ll == 0xffffffff`02ab1010

    ++pl; // 2ab1008

    l = *pl;

    // ll == 0x2ab100c`02ab1010

    l = *(pl+1);

    // ll == 0x2000`00000000`

    ```


    If we want 8-byte 64-bit integers, we need to use long or long long for portability.


    The code example corresponding to the memory diagram:


    ```

    long l; // long long ll;

    long *pl; // 2ab1000

    &pl; // 2ab1216

    l = *pl; // ll == 0xffffffff`02ab1010

    ++pl; // 2ab1008

    l = *pl; // ll == 0x2ab100c`02ab1010

    l = *(pl+1); // ll == 0x2000`00000000`

    ```'
