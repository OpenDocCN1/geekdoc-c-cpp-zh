    ```\n\n```\nvoid func(int &ri) {\n  ri = 0;\n}\n\nint i{0};\nfunc(i);\n```"
- md: "\n## Parameters by Ptr/Ref to Const\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_175_0.png)\n\
    \nIf we only want efficiency for structures, we need to pass by reference to const.\
    \ In such a case, we also cannot modify the original values.\n\nThe code examples:\n\
    \n```\nvoid func(const MyStruct *pms)\n  { pms->field = 0; }\nfunc(&MyStruct{});\n\
    \nvoid func(const int& ri)\n  { ri = 0; }\nfunc(int(0));\n```\n\n## Possible Mistake\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_176_0.png)\n\n```\nvoid func(const\
    \ MyStruct ms)\n  { ms.field = 0; }\n\nfunc(myStruct);\nvoid func(const MyStruct&\
    \ ms)\n  { ms.field = 0; }\n\nfunc(myStruct);\n```\n\nIf you come from languages\
    \ that use implicit references, you may omit & by mistake:\n\n```\nvoid func(const\
    \ MyStruct ms)\n  { ms.field = 0; }\n\nfunc(myStruct);\nvoid func(const MyStruct&\
    \ ms)\n  { ms.field = 0; }\n\nfunc(myStruct);\n```\n\n## Function Overloading\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_177_0.png)\n\nFunction overloading\
    \ allows reusing the same function names for functions with different numbers\
    \ and types of parameters.\n\nThe code example:\n\n```\nint funco(int i);\nint\
    \ funco(int i, int j);\nint funco(long &rl);\n```\n\n## Immutable Objects\n\n\
    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_178_0.png)\n\nIf you have const objects,\
    \ you are only allowed to call methods that have the const specifier in their\
    \ definition.\n\nThe code example:\n\n```\nstruct MyStruct {\n  MyStruct(int _field)\
    \ : field{_field} { }\n  int get() const { return field; }\n  void set(int newval)\
    \ { field = newval; }\n  private:\n    int field;\n}; myStruct(1);\nconst MyStruct&\
    \ myCStruct{myStruct};\nmyCStruct.get();\nmyCStruct.set(2);\n```\n\n## Static\
    \ Structure Functions\n\n```cpp\n// multithreading issues are ignored here\nstruct\
    \ MyStruct\n{\n    MyStruct(int _field) : field{field} { ++count; }\n    int get()\
    \ const { return field; }\n    void set(int newval) { field = newval; }\n    static\
    \ auto get_count()\n    {\n        field++;\n        return count;\n    };\nprivate:\n\
    \    int field;\n    inline static unsigned count{0};\n} myStruct1(1), myStruct2(2);\n\
    MyStruct::get_count();\nassert(myStruct1.get_count() == myStruct2.get_count());\n\
    ```\n\nStatic structure functions are only allowed to access static structure\
    \ fields shared among objects.\n\n## Lambdas\n\n- Interlude: necessary x64 and\
    \ A64 disassembly\n- Unnamed function objects\n- A function parameter\n- Optionally\
    \ captures context\n- A return value\n\nBefore discussing lambdas introduced in\
    \ C++11 and their internals, we take a brief tour of basic x64 and A64 disassembly.\n\
    \n## x64 CPU Registers\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_181_0.png)\n\
    \nThere are familiar 32-bit CPU register names, such as EAX, that are extended\
    \ to 64-bit names, such as RAX. Most of them are traditionally specialized, such\
    \ as ALU, counter, and memory copy registers. Although, now they all can be used\
    \ as general-purpose registers. There is, of course, a stack pointer RSP, and,\
    \ additionally, a frame pointer, RBP, which is used to address local variables\
    \ and saved parameters. In some compiler code generation implementations, RBP\
    \ is also used as a general-purpose register, with RSP taking the role of a frame\
    \ pointer. An instruction pointer RIP is saved in the stack memory region with\
    \ every function call, then restored on return from the called function. In addition,\
    \ the x64 platform features another eight general-purpose registers, from R8 to\
    \ R15.\n\n## x64 Instructions and Registers\n\n- Opcode SRC, DST = default AT&T\n\
    - Examples:\n\n```\nmov $10, %rax          # 0x10 -> RAX\nmov %rbp           \
    \    # RSP -> RSP\nadd $10, %r10          # R10 + 0x10\nimul %ecx, %edx      \
    \ # ECX * EDX\ncall %rdx             # RDX already contains the address of (func)\n\
    push RIP               # RSP -> RIP\nsub $30, %rsp          # make room for local\
    \ variables\n```\n\nThis slide shows a few examples of CPU instructions involving\
    \ registers, such as moving a value and doing arithmetic. The direction of operands\
    \ is opposite to the Intel x64 disassembly if you are accustomed to Winbg on Windows.\
    \ It is possible to use the Intel disassembly in GDB, but we opted for the default\
    \ AT&T flavor in our Linux.\n\n## x64 Memory and Stack\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_183_0.png)\n\
    \nBefore we look at operations with memory, let's look at a graphical representation\
    \ of memory addressing. The stack is just another memory region, so instead of\
    \ RSP and RBP, any other register can be used. Please note that the stack grows\
    \ towards lower addresses, so to access the previously pushed values you need\
    \ to use positive offsets from RSP.\n\n## x64 Load Instructions\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_184_0.png)\n\
    \n- Opcode Offset(SRC), DST\n- Examples:\n\n```\nmov 10(%rsp), %rax      # value\
    \ at RSP+0x10 -> RAX\nmov -10(%rbp), %rcx      # value at RBP-0x10 -> RCX\nadd\
    \ (%rax), %rdx        # RDX + value at RAX -> RDX\npop %rdi                # value\
    \ at RSP -> RDI\nlea 20(%rbp), %rb8       # RSP + 8 -> R8\n                  \
    \             # address RBP+0x20 -> R8\n```\n\nConstants are encoded in instructions,\
    \ but if we need arbitrary values we must get them from memory. brackets show\
    \ memory access relative to an address stored in some register.\n\n## x64 Store\
    \ Instructions\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_185_0.png)\n\nStoring\
    \ is similar to loading.\n\n## x64 Flow Instructions\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_186_0.png)\n\
    \n- Opcode DST\n- Examples:\n\n```\njmpq 0x1049fc1c      # 0x1049fc1c -> RIP\n\
    \                      # (goto 0x1049fc1c)\n\njmpq *0x100(%rip)     # value at\
    \ RIP+0x100 -> RIP\n\ncallq 0x1049ff74    # RSP - 8 -> RSP\n0x1049fc14:      \
    \   # value at RSP\n                      # 0x1049ff74 -> RIP\n              \
    \        # (goto 0x1049ff74)\n```\n\nGoto (an unconditional jump) is implemented\
    \ via the JMP instruction. Function calls are implemented via CALL instruction.\
    \ For conditional branches, look at the official Intel documentation.\n\n## x64\
    \ Function Parameters\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_187_0.png)\n\
    \nOn the x64 Linux platform, the first six C and C++ function parameters from\
    \ left to right are moved to CPU registers, and the rest are passed via stack\
    \ locations.\n\n## x64 Struct Function Parameters\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_188_0.png)\n\
    \nWhen an struct nonstatic member function is called, the first parameter is implicit\
    \ and, on the x64 Linux platform, is passed via **RDI**. It is an object address\
    \ to help methods differentiate between objects of the same structure type and\
    \ reference correct fields' memory. The rest of the parameters are passed as usual.\n\
    \n## A64 CPU Registers\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_189_0.png)\n\
    \n- X0-X28, W0-W28\n- X16 (XIP0), X17 (XIP1)\n- Stack: SP, X29 (FP)\n- Next instruction:\
    \ PC\n- Link register: X30 (LR)\n- Zero register: XZR, WZR\n"
