    func(1); |


    When we pass parameters by values, any modifications inside functions are lost
    once we return. Passing basic types by value is efficient, but passing structures
    are not unless they are very simple: various functions may be called, for example,
    copy constructors and destructors unless optimized by a compiler. There is also
    a possibility of slicing when inheritance is used.


    The code examples:


    | void func(MyStruct ms)

    { ms.field = 0; }


    func(MyStruct); | void func(int i)

    { i = 0; }


    func(1); |'
