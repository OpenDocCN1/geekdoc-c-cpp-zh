    Here, in this picture, entities are the so-called memory cells. Memory cells have
    addresses that start from 0 and are usually incremented by the so-called pointer
    size, which is 4 on 32-bit systems and 8 on 64-bit systems. Here, for visual clarity,
    we use memory cells from a 32-bit system.'
  - '[PAGE 49]


    # Debugger Memory Layout


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_49_0.png)


    When we use a debugger, it prints memory cell addresses and their contents in
    a certain layout shown on this slide. Some debugger commands, such as x in GDB,
    use 2-column and some n-column layouts to print memory.'
  - "[PAGE 50]\n\n# Memory Dereference Layout\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_50_0.png)\n\
    \nFor a 2-column format, some debuggers and their commands may interpret the second\
    \ column as a pointer. In such a case, the third column is a value from a pointer\
    \ dereference. Also, notice a case when a pointer points to itself. For GDB, it\
    \ is possible to emulate such behavior using a custom script:\n\n```\ndefine dpp\n\
    \  set $si = 0\n  set $p = $arg0\n  while $si < $arg1\n    printf \"%p: %s\",\
    \ $p\n    x/gx *(long *)$p\n    set $si = $si + 1\n    set $p = $p + 8\nend\n\
    ```"
  - '[PAGE 51]


    # Names as Addresses


    ![](img/c36cc1b69ac7baa75db5d13135bb9d30_51_0.png)


    To repeat, for memory layout, names are interpreted as addresses, and memory cell
    content (cell value) can also be interpreted as a memory address.'
  - '[PAGE 52]


    # Addresses and Entities


    # Addresses and Entities


    | 2ab1000: | 2ab1008 | 2ab1000: | 2ab1008 |

    | 2ab1004: | ffffffff | 2ab1004: | ffffffff |

    | 2ab1008: | 2ab1010 | 2ab1008: | 2ab1010 |

    | 2ab100c: | 2ab100c | | |

    | 2ab1010: | 00000000 | | 00000000 |

    | 2ab1014: | 00002000 | 2ab1014: | 00002000 |


    Entities can be either single cells or multicells. Each part of a multicell can
    be interpreted as a memory address, if necessary, even if it wasn''t meant to
    be a memory address.'
  - '[PAGE 53]


    # Addresses and Structures


    | | |

    |---|---|

    | 2ab1000: | 2ab1008 |

    | 2ab1004: | fffffff |

    | 2ab1008: | 2ab1010<br>2ab100c |

    | 2ab1010: | 00000000 |

    | 2ab1014: | 00002000 |


    A structure in memory is a sequential collection of memory cells; some may be
    multicell and themselves substructures. Each part of a structure, its member,
    or structure field has its own address as well, in addition to the overall address
