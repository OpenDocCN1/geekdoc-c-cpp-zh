    \ 上的 Winbg，那么操作数的方向与 Intel x64 反汇编相反。在 GDB 中可以使用 Intel 反汇编格式，但我们在 Linux 环境中选择了默认的\
    \ AT&T 格式。\n\n## x64 内存与栈\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_183_0.png)\n\
    \n在查看内存操作之前，让我们看看内存的图形表示。栈只是另一个内存区域，而不是 RSP 和 RBP。请注意栈是向低地址增长的，访问值需要使用 的偏移量。\n\
