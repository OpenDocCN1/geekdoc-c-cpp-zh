    \    4(%rsp),%rax\n}\nsallq getFunc(int):$0:operator()(int) const {\n    add \
    \   $16,%rsp\n    pop    %rbp\n    ret\n}\n```\n\n返回 lambda 从而模拟函数式编程中所谓的“柯里”特性。\n\
    \n代码示例以及对应的 Clang x64 汇编语言：\n\n```\nauto getFunc(int par) {\n    return [par](int\
    \ x) { return x - par; };\n}\n\nvoid foo() {\n    getFunc(200)(16);\n}\n```\n\n\
    反汇编显示我们返回了底层的函数对象：\n\n```\n// Clang\n-foo():\npush    %rbp\nmov     %rsp,%rbp\n\
    sub     $0xc8,%edi\ncallq   <getFunc(int)>\nmov     %eax,-0x8(%rbp)\nlea     -0x8(%rbp),%rdi\n\
    mov     $0x10,%esi\ncallq   <getFunc(int):$__0::operator()(int) const>\nmov  \
    \   %eax,-0xc(%rbp)\nadd     $0x10,%rsp\npop     %rbp\nretq\n```\n\n## 虚拟函数调用\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_218_0.png)\n\n本节提供了 C++ 中虚拟函数调用的概述。\n\
    \n## VTBL 内存布局\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_219_0.png)\n\n这些虚拟函数调用通过为每个结构体设置特定的虚函数表（vtbl）来实现，其中基结构体的方法地址替换为派生结构体的方法。\n\
    \n与内存图对应的代码示例：\n\n```\nstruct Base {\n  virtual void method1() {}\n  virtual void\
    \ method2() {}\n} Base;\n\nstruct Derived : Base {\n  int field;\n  void method2()\
    \ override {}\n} Derived;\n```\n\n## VPTR 和结构布局\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_220_png)\n\
    \n每个拥有虚方法的对象都有一个隐式的函数表指针（vptr），包含对应函数表的地址。因此，通过基结构体指针进行的虚函数调用是根据虚表偏移计算的目标函数。\n\
    \n与内存图对应的代码示例：\n\n```\nBase *pBase = &Base;\npBase->method1();\n```\n\n```\npBase\
    \ = &Derived;\npBase->method2();\n```\n\n## 模板：简介\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_221_0.png)\n\
    \nC++ 模板和元编程是一个巨大的领域。我们只介绍一下。\n\n## 为什么用模板？\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_222_0.png)\n\
    \n在接下来的幻灯片中，我们将简要介绍“为什么”的问题。\n\n## 可重用性\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_223_0.png)\n\
    \n模板允许我们通过更高的抽象性编写更少的代码，将实现交给编译器。编译器检查模板参数是否实现了所需的运算和方法。\n\n代码示例：\n\n```cpp\n\
    template<typename T>\nadd (const T& op1, const T& op2)\n{\n    return op1 + op2;\n\
    }\nvoid foo()\n{\n    add<int>(1, 2);\n    add<struct S>(struct S(1), struct S(2));\n\
    }\n```\n\n```cpp\nstruct S\n{\n    S(int _val) : val(_val) {}\n    S operator+(const\
    \ S& s) const\n    {\n        return S(val + s.val);\n    }\n    int val;\n};\n\
    // S operator+(const S& s1, const S& s2)\n// {\n//     return S(s1.val + s2.val);\n\
    // }\n```\n\n## 模板类型\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_225_0.png)\n\n\
    以下代码提供了结构体、函数和变量模板类的示例：\n\n```cpp\ntemplate <typename T> struct TStruct { T data;\
    \ }\nTStruct<int> ts;\n\nstruct FStruct {\n    template <typename T> T zero()\
    \ { return T(0); }\n} fs;\nfs.zero<int>();\n\ntemplate <typename T> T zero{};\n\
    auto z = zero<int>;\n```\n\n## 模板参数类型\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_226_0.png)\n\
    \n模板参数有两种：类型和非类型。\n\n代码示例以及对应的汇编语言：\n\n```\ntemplate <int c> decltype(c) constant()\
    \ { return c; }\nconstant<1>():\n```\n\n非类型模板参数允许生成具有特定目的的紧凑代码，如 x64 和 ARM64 反汇编所示：\n\
    \n```\ncall <constant<1>>() // Clang and GCC\n...\nconstant<1>():\npush  %rbp\n\
    mov   %rsp,%rbp\nmov   $1,%eax\npop   %rbp\nretq\n```\n\n```\nbl <constant<1>()\n\
    ... constant<1>():\nmov w0, #0x1\nret\n```\n\n## 类型安全\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_228_0.png)\n\
    \n```cpp\ntemplate <typename T>\nT add(const T& op1, const T& op2) \n{\n    return\
    \ op1 + op2;\n}\n\nvoid foo() {\n    add(struct M(1), struct M(2));\n}\n```\n\n\
    ```\nstruct S\n{\n    S(int _val) : val(_val) {}\n    S operator+(const S& s)\
    \ const {\n        return S(val + s.val);\n    }\n    int val;\n};\n```\n\n与指针转换相比，通用模板通过检查所需的运算和方法来强制类型安全。\n\
    \n代码示例：\n\n```cpp\nstruct S {\n    S(int _val) : val(_val) {}\n    S operator+(const\
    \ S& s) const {\n        return S(val + s.val);\n    }\n    int val;\n};\n\nstruct\
    \ M {\n    M(int _val) : val(_val) {}\n    int val;\n};\n```\n\n```cpp\ntemplate\
    \ <typename T>\nT add(const T& op1, const T& op2) \n{\n    return op1 + op2;\n\
    }\nvoid foo()\n{\n    add(struct M(1), struct M(2));\n}\n```\n\n## 灵活性\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_230_0.png)\n\
    \n也可以为了性能等原因对特定类型进行模板特化。\n\n代码示例：\n\n```cpp\ntemplate<>\nstruct M add<struct M>\
    \ (const struct M& op1,\n    const struct M& op2)\n{\n    return op1.val + op2.val;\n\
    }\nvoid foo()\n{\n    add<struct S>(struct S(1), struct S(2));\n}\n\ntemplate<>\
    \ decltype(13) constant<13>() { return 14; }\n```\n\n"
