  - "[PAGE 101]\n\n# Structure Inheritance\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_101_0.png)\n\
    \nStructures can inherit fields from other structures. In case of the same field\
    \ names, the derived structure hides the base structure fields, but they can be\
    \ accessed by explicit base name qualification:\n\n```\nstruct Base {\n  int field;\n\
    };\nstruct Derived : Base {\n  int field;\n  int field2;\n} myDerived;\nmyDerived.field;\n\
    myDerived.Base::field;\nBase *pMyBase = &myDerived;\npMyBase->field;\n```"
  - "[PAGE 102]\n\n# Structure Slicing\n\n```\nstruct Base {\n    int field;\n};\n\
    struct Derived : Base {\n    int field2;\n    myDerived { 0 };\n};\n\nmyBase =\
    \ myDerived;\nmyDerived = myBase;\nmyDerived = static_cast<Derived>(myBase);\n\
    \n    *pMyBase = &myDerived;\nDerived *pMyDerived = pMyBase;\n\nDerived *pMyDerived\
    \ = static_cast<Derived *>(pMyBase);\n```\n\nIt is possible to copy a derived\
    \ structure to a base variable, but in this case, the former contents are sliced\
    \ since the base structure occupies less memory. The other way around, from the\
    \ base structure, is forbidden by default because the compiler doesn't know how\
    \ to fill the new-derived-fields. However, this can be forced with a static cast\
    \ where the derived fields are filled with the existing adjacent memory content,\
    \ which can be completely random. The same downcast can be done between pointers,\
    \ but when we try to dereference a target pointer to the derived structure later,\
    \ we may get random data.\n\nThe code example:\n\n```\nstruct Base {\n    int\
    \ field;\n};\n```"
  - "[PAGE 103]\n\n```\nstruct Derived : Base\n{\n    int field2;\n} myDerived { 0\
    \ };\n\nBase myBase = myDerived;\nmyDerived = myBase;\nmyDerived = static_cast<Derived>(myBase);\n\
    \nBase *pMyBase = &myDerived;\nDerived *pMyDerived = pMyBase;\nDerived *pMyDerived\
    \ = static_cast<Derived*>(pMyBase);\n```"
  - "[PAGE 104]\n\n# Inheritance Access Level\n\n```\nstruct Base {\n  int field;\n\
    };\n\nstruct Derived : private Base {\n  int field;\n  int field2;\n} myDerived;\n\
    \nmyDerived.field;\nmyDerived.Base::field;\n\nBase *pMyBase = &myDerived;\npMyBase->field;\n\
    ```\n\nIt is possible to inherit privately. In such a case, the base structure\
    \ fields are inaccessible from the outside, even with the explicit qualification.\n\
    \nThe code example:\n\n```\nstruct Base {\n  int field;\n};\n\nstruct Derived\
    \ : private Base {\n  int field;\n  int field2;\n} myDerived;\n\nmyDerived.field;\n\
    myDerived.Base::field;\n\nBase *pMyBase = &myDerived;\npMyBase->field;\n```"
  - "[PAGE 105]\n\n# Structures and Classes II\n\n# Structures and Classes II\n\n\
    ```\nstruct ==* class\n\nstruct Base class Base {\n  // public:\n  int field;\n\
    };\nstruct Derived : Base // (public) {\n  // ...\n};\nclass Derived : public\
    \ Base // (private) {\n  // ...\n};\n```\n\nAgain, structures and classes are\
