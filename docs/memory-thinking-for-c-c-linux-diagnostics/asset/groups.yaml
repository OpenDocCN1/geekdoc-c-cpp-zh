- md: "\n# Iterators as Pointers\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_232_0.png)\n\
    \nNow, we take a bird's eye view of standard library containers, iterators, and\
    \ algorithms from a pointer perspective.\n\n# Containers\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_233_0.png)\n\
    \nThere are many container types in the standard C++ library (formerly called\
    \ STL, Standard Template Library). In this course edition, we don't delve into\
    \ their specifics. We hope the names intuitively suggest their semantics.\n\n\
    # Iterators\n\n```cpp\nstd::vector<int> v{1, 2, 3, 4, 5};\nstd::vector<int>::iterator\
    \ it = v.begin();\n\nwhile (it != v.end())\n{\n    std::cout << *it;\n    ++it;\n\
    }\n\nint a[5]{1, 2, 3, 4, 5};\nint *pa = &a[0];\n\nwhile (pa != &a[5])\n{\n  \
    \  std::cout << *pa;\n    ++pa;\n}\n```\n\nAn iterator is a pointer abstraction.\
    \ You can move it (depending on container semantics) like a pointer increment/decrement,\
    \ and you can dereference it like a pointer to get a value:\n\n```cpp\nstd::vector<int>\
    \ v{1, 2, 3, 4, 5};\nstd::vector<int>::iterator it = v.begin();\n\nwhile (it !=\
    \ v.end())\n{\n    std::cout << *it;\n    ++it;\n}\n\nint a[5]{1, 2, 3, 4, 5};\n\
    int *pa = &a[0];\n\nwhile (pa != &a[5])\n{\n    std::cout << *pa;\n    ++pa;\n\
    }\n```\n\n# Constant Iterators\n\n```cpp\nstd::vector<int> v1{1, 2, 3, 4, 5};\n\
    std::vector<int>::const_iterator cit = v1.cbegin();\n\nwhile (cit != v1.end())\n\
    {\n    std::cout << *cit;\n    ++cit;\n}\nint a[5]{1, 2, 3, 4, 5};\nconst int\
    \ *cpa = &a[0];\n\nwhile (cpa != &a[5])\n{\n    std::cout << *cpa;\n    ++cpa;\n\
    }\n```\n\nLike a pointer to constant values, there are constant iterators:\n\n\
    ```cpp\nstd::vector<int> v{1, 2, 3, 4, 5};\nstd::vector<int>::const_iterator cit\
    \ = v.cbegin();\n\nwhile (cit != v.end())\n{\n    std::cout << *cit;\n    ++cit;\n\
    }\nint a[5]{1, 2, 3, 4, 5};\nconst int *cpa = &a[0];\n\nwhile (cpa != &a[5])\n\
    {\n    std::cout << *cpa;\n    ++cpa;\n}\n```\n\n# Pointers as Iterators\n\n```cpp\n\
    int a[5]{ 1, 2, 3, 4, 5 };\nint *itarr = std::begin(a);\n// auto itarr = std::begin(a);\n\
    while (itarr != std::end(a))\n{\n    std::cout << *itarr;\n    ++itarr;\n}\nconst\
    \ int *citarr = std::cbegin(a);\nwhile (citarr != std::cend(a))\n{\n    std::cout\
    \ << *citarr;\n    ++citarr;\n}\n```\n\nPointers can also be considered as iterators:\n\
    \n```cpp\nint a[5]{ 1, 2, 3, 4, 5 };\nint *itarr = std::begin(a);\n\n// auto itarr\
    \ = std::begin(a);\nwhile (itarr != std::end(a))\n{\n    std::cout << *itarr;\n\
    \    ++itarr;\n}\nconst int *citarr = std::cbegin(a);\nwhile (citarr != std::cend(a))\n\
    {\n    std::cout << *citarr;\n    ++citarr;\n}\n```\n\n# Algorithms\n\n```cpp\n\
    std::vector<int> v{1, 2, 3, 4, 5};\nstd::sort(v.begin(), v.end());\n\nint arr[5]{\
    \ 2, 1, 3, 4, 5 };\nstd::sort(std::begin(arr), std::end(arr));\n```\n\nBoth iterators\
    \ and containers and pointers as iterators and arrays can be used with the standard\
    \ library algorithms.\n\n# Memory Ownership\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_238_0.png)\n\
    \nWe now look at common ownership problems and see how they are resolved in modern\
    \ C++.\n\n# Pointers as Owners\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_239_0.png)\n\
    \nPointers can be considered owners of dynamically allocated memory since they\
    \ contain the address, and that memory can be accessed through them.\n\n# Problems\
    \ with Pointer Owners\n\n- Shared ownership after copying a pointer\n- Leak: overwriting\
    \ the address without release\n- Dangling pointers pointing to already released\
    \ memory\n- Leak: no release before going of scope\n\nHowever manual pointer usage\
    \ is prone to errors due to shared ownership, crashes due to multiple releases,\
    \ and memory leaks due to dangling pointers and going out of scope.\n\n# Smart\
    \ Pointers\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_241_0.png)\n\nTo solve\
    \ ownership problems, modern C++ included several kinds of smart pointers in its\
    \ standard library.\n\n# Basic Design\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_242_0.png)\n\
    \nA smart pointer should include functionality similar to raw pointers for seamless\
    \ use during the refactoring of legacy code and simultaneously eliminate most,\
    \ if not all, problems with raw pointer usage.\n\n# Unique Pointers\n\n```cpp\n\
    std::unique_ptr<int> fooU(std::unique_ptr<int> pInt)\n{\n    std::unique_ptr<int>\
    \ p(pInt.release());\n    assert(pInt == nullptr);\n    if (p)\n        int n\
    \ = *p; // *p.get()\n    return p;\n}\n\nvoid barU() {\n    std::unique_ptr<int>\
    \ pInt(new int(0));\n    std::unique_ptr<int> pRes;\n    assert(pRes == nullptr);\n\
    \    pRes = fooU(std::move(pInt));\n    assert(pInt == nullptr && pRes != nullptr);\n\
    }\n```\n\nFor smart pointers without sharing functionality, the `unique_ptr` should\
    \ be used. Copying must transfer ownership, making the source `nullptr`.\n\n#\
    \ Descriptors as Unique Pointers\n\n```cpp\n// int fd = open(...);\n// close(fd);\n\
    \nauto fdDeleter = \n    [](auto pfd) \n    {\n        if (pfd && (*pfd != -1))\n\
    \            ::close(pfd);\n    };\n\nusing FD = std::unique_ptr<int, decltype(fdDeleter)>;\n\
    ```\n\nFile descriptors are good candidates for unique pointers, but they should\
    \ be supplied with a custom deletion mechanism.\n\n# Shared Pointers\n\n# Shared\
    \ Pointers\n\n```cpp\nstd::shared_ptr<int> fooS(std::shared_ptr<int> pInt)\n{\n\
    \    std::shared_ptr<int> p(pInt.get());\n    assert(pInt == nullptr);\n    if\
    \ (p)\n        int n = *p;\n    return p;\n}\n\nvoid barS() {\n    std::shared_ptr<int>\
    \ pInt(new int(0));\n    std::shared_ptr<int> pRes;\n    assert(pRes == nullptr);\n\
    \    pRes = fooS(pInt);\n    assert(pInt == nullptr && pRes != nullptr);\n}\n\
    ```\n\nIf we want to freely copy pointers pointing to the same memory, then the\
    \ `shared_ptr` is our choice.\n"
  mdcn: "\n\n# 作为指针的迭代器\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_232_0.png)\n\n\
    现在，我们从指针的角度对标准库容器、迭代器和算法进行全局观察。\n\n# 容器\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_233_0.png)\n\
    \n标准 C++ 库中有许多容器类型（以前称为 STL，标准模板库）。在本课程版本中，我们不会深入探讨它们的细节。我们希望这些名称能够直观地体现出它们的语义。\n\
    \n# 迭代器\n\n```cpp\nstd::vector<int> v{1, 2, 3, 4, 5};\nstd::vector<int>::iterator\
    \ it = v.begin();\n\nwhile (it != v.end())\n{\n    std::cout << *it;\n    ++it;\n\
    }\n\nint a[5]{1, 2, 3, 4, 5};\nint *pa = &a[0];\n\nwhile (pa != &a[5])\n{\n  \
    \  std::cout << *pa;\n    ++pa;\n}\n```\n\n迭代器是指针的抽象。你可以根据容器的语义像指针递//减一样移动它，并且可以像指针一样解引用它来获取值：\n\
    \n```cpp\nstd::vector<int> v{1, 2, 3, 4, 5};\nstd::vector<int>::iterator it =\
    \ v.begin();\n\nwhile (it != v.end())\n{\n    std::cout << *it;\n    ++it;\n}\n\
    \nint a[5]{1, 2, 3, 4, 5};\nint *pa = &a[0];\n\nwhile (pa != &a[5])\n{\n    std::cout\
    \ << *pa;\n    ++pa;\n}\n```\n\n# 常量迭代器\n\n```cpp\nstd::vector<int> v1{1, 2, 3,\
    \ 4, 5};\nstd::vector<int>::const_iterator cit = v1.cbegin();\n\nwhile (cit !=\
    \ v1.end())\n{\n    std::cout << *cit;\n    ++cit;\n}\nint a[5]{1, 2, 3, 4, 5};\n\
    const int *cpa = &a[0];\n\nwhile (cpa != &a[5])\n{\n    std::cout << *cpa;\n \
    \   ++cpa;\n}\n```\n\n就像指向常量值的指针一样，还有常量迭代器：\n\n```cpp\nstd::vector<int> v{1, 2,\
    \ 3, 4, 5};\nstd::vector<int>::const_iterator cit = v.cbegin();\n\nwhile (cit\
    \ != v.end())\n{\n    std::cout << *cit;\n    ++cit;\n}\nint a[5]{1, 2, 3, 4,\
    \ 5};\nconst int *cpa = &a[0];\n\nwhile (cpa != &a[5])\n{\n    std::cout << *cpa;\n\
    \    ++cpa;\n}\n```\n\n# 作为迭代器的指针\n\n```cpp\nint a[5]{ 1, 2, 3, 4, 5 };\nint *itarr\
    \ = std::begin(a);\n// auto itarr = std::begin(a);\nwhile (itarr != std::end(a))\n\
    {\n    std::cout << *itarr;\n    ++itarr;\n}\nconst int *citarr = std::cbegin(a);\n\
    while (citarr != std::cend(a))\n{\n    std::cout << *citarr;\n    ++citarr;\n\
    }\n```\n\n指针也可以被视为迭代器：\n\n```cpp\nint a[5]{ 1, 2, 3, 4, 5 };\nint *itarr = std::begin(a);\n\
    \n// auto itarr = std::begin(a);\nwhile (itarr != std::end(a))\n{\n    std::cout\
    \ << *itarr;\n    ++itarr;\n}\nconst int *citarr = std::cbegin(a);\nwhile (citarr\
    \ != std::cend(a))\n{\n    std::cout << *citarr;\n    ++citarr;\n}\n```\n\n# 算法\n\
    \n```cpp\nstd::vector<int> v{1, 2, 3, 4, 5};\nstd::sort(v.begin(), v.end());\n\
    \nint arr[5]{ 2, 1, 3, 4, 5 };\nstd::sort(std::begin(arr), std::end(arr));\n```\n\
    \n迭代器、容器以及作为迭代器的指针和数组都可以与标准库算法配合。\n\n# 内存所有权\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_238_0.png)\n\
    \n我们现在来看常见的所有权问题，以及它们在现代 C++ 中是如何解决的。\n\n# 作为所有者的指针\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_239_0.png)\n\
    \n指针可以认为是动态分配内存的所有者，因为它们包含了地址，可以通过它们访问该内存。\n\n# 指针所有者的问题\n\n- 拷贝后的共享所有权\n- 覆盖地址导致的内存泄漏\n\
    - 指向已释放内存的悬空指针\n- 作用域结束前的内存泄漏\n\n然而，手动使用指针容易出现共享所有权、崩溃、内存泄漏以及悬空指针的问题。\n\n# 智能指针\n\
    \n![](img/c36cc1b69ac7baa75db5d13135bb9d30_241_0.png)\n\n为了解决所有权问题，现代 C++ 在标准库中引入了几种智能指针。\n\
    \n# 基本设计\n\n![](img/c36cc1b69ac7baa75db5d13135bb9d30_242_0.png)\n\n智能指针应该包含与原始指针类似的功能，以便在重构代码时无缝使用，并消除大部分在使用原始指针使用的问题。\n\
    \n# 唯一指针\n\n```cpp\nstd::unique_ptr<int> fooU(std::unique_ptr<int> pInt)\n{\n\
    \    std::unique_ptr<int> p(pInt.release());\n    assert(pInt == nullptr);\n \
    \   if (p)\n        int n = *p; // p.get()\n    return p;\n}\n\nvoid barU() {\n\
    \    std::unique_ptr<int> pInt(new int(0));\n    std::unique_ptr<int> pRes;\n\
    \    assert(pRes == nullptr);\n    pRes = fooU(std::move(pInt));\n    assert(pInt\
    \ == nullptr && pRes != nullptr);\n}\n```\n\n对于不需要共享功能的智能指针，应该使用 `unique_ptr`。拷贝必须转移所有权，使源变为\
    \ `nullptr`。\n\n# 作为唯一指针的描述符\n\n```cpp\n// int fd = open(...);\n// close(fd);\n\
    \nauto fdDeleter = \n    [](auto pfd) \n    {\n        if (pfd && (*pfd != -1))\n\
    \            ::close(pfd);\n    };\n\nusing FD = std::unique_ptr<int, decltype(fdDeleter)>;\n\
    ```\n\n文件描述符是唯一指针的良好候选者，但它们应该提供自定义的删除机制。\n\n# 共享指针\n\n# 共享指针\n\n```cpp\nstd::shared_ptr<int>\
    \ fooS(std::shared_ptr<int> pInt)\n{\n    std::shared_ptr<int> p(pInt.get());\n\
    \    assert(pInt == nullptr);\n    if (p)\n        int n = *p;\n    return p;\n\
    }\n\nvoid barS() {\n    std::shared_ptr<int> pInt(new int(0));\n    std::shared_ptr<int>\
    \ pRes;\n    assert(pRes == nullptr);\n    pRes = fooS(pInt);\n    assert(pInt\
    \ == nullptr && pRes != nullptr);\n}\n```\n\n如果我们想要自由地拷贝指向同一内存的指针，那么 `shared_ptr`\
    \ 是我们的选择。\n\n"
