  md: '# CHAPTER TWENTY

    BOOLE LOGIC


    “Logic” refers to actions, behavior and thinking that makes sense. When speaking
    about computers, logic is the rules that form the foundation for a computer in
    performing certain tasks. Computer logic is the guidelines for the computer uses
    when making decisions.


    Logical operators like "and," "or," and "not" are used to evaluate whether expression
    is true or false.


    George Bool was an English mathematician that developed Boolean logic. "Boolean
    logic" is a form of logic in which the only possible results of a decision are
    "true" and "false". There aren''t any vague or "almost" answers to a calculation
    or decision – black or white, no gray.


    ![](img/33a81fac26246d29975692e5ecda6e53_84_0.png)


    An example of Boolean logic would be answering questions with only "yes" or "no".


    Boolean logic is especially important for the construction and operation of digital
    computers because it is relatively easy to create a machine where the result of
    an operation is either "true" or "false".


    This is done by comparing two or more items – items that can only be "true" or
    "false".


    Some common examples of such Boolean comparisons are "AND" and "OR".


    With the Boolean comparison called "AND", the comparison is true only if all of
    the involved comparisons are true.


    Let''s look at some examples to show how this works:'
  merge: -1
  pgno: 84
- img_proc: true
  md: 'In the following AND comparison, the result is true:


    5 is more than 3 AND 10 is more than 5


    Let''s break it down.


    There are three comparisons happening here:


    +   1. Comparing 5 and 3 to see if 5 is larger than 3 (is 5 larger than 3?)


    +   2. Comparing 10 and 5 to see if 10 is larger than 5 (is 10 larger than 5)?


    +   3. Comparing the results of those two comparisons, using the Boolean comparison
    "AND" (are both comparisons true?)


    This is the overall comparison.


    It is true that 5 is greater than 3, so the first comparison is true.


    It is also true that 10 is greater than 5 – so the second comparison is true as
    well.


    A Boolean AND comparison is true if the other comparisons are all true – so in
    this example, the overall comparison is true, since the first comparison is true
    and the second comparison is true.


    In this next example, the result is false (not true):


    5 is more than 7 AND 10 is more than 5


    Even though 10 is more than 5, 5 is not more than 7 – so the overall comparison
    is not true.


    A "condition" is an item that must be before something else occurs. In the AND
    comparison above, these are the two conditions checked for:


    +   1. 5 is more than 7


    +   2. 10 is more than 5


    They’re conditions because the outcome is conditional upon (dependant on) these
    two comparisons.'
