  md: '# CHAPTER TWO

    COMPUTERS


    Computers were created to do a simple thing: they take in data

    (information), change the data in some way, and send out data. That''s all.


    ![](img/33a81fac26246d29975692e5ecda6e53_12_0.png)


    There are certain truths regarding computers:


    +   1. They are only machines. They are not people.


    +   2. They were created by people and can only act if a person tells them to.
    Even

    then, they can only perform actions that a person thought of ahead of time and

    built into them.


    Computers do not have a soul. They cannot think. Everything ever done by

    a computer was predetermined by humans. So-called “artificial intelligence"

    (computer systems that are able to perform actions that require human

    intelligence, like being able to recognize sounds and images), or computers that
    can

    “learn,” only have these abilities because we designed them that way.


    As machines, some of the characteristics of computers include the following:


    +   * They handle data. Data is information – such as words, symbols (something

    written that represents an amount, idea or word), pictures, etc.


    +   * They obey instructions (commands entered into them that perform certain

    tasks).


    +   * They automate (perform actions without human interaction) tasks that would

    either take too long for a person to do or be too boring. Keep in mind that these

    automatic actions were designed by a person.


    +   * They process data. “Process” means to handle something through use of

    established (and usually routine) set of procedures. When a computer displays

    t word “processing,” it is saying, “Hold on while I perform some

    pre-established procedures.” Processing refers to “taking actions with data”.

    Searching through words to locate typos would be an example of “processing

    data”.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'When data is being processed by a computer, you sometimes see a “progress bar”
    (a symbol that shows how far along something is) like this:


    # Processing...


    Or you may see this symbol when data is processed:


    # Processing


    This circular symbol is called a “thber” due to the fact that they originally
    expanded and contracted in size – i.e., the symbol “throbbed”.


    The purpose of computers is to take in data, process it and send it out.


    When computers perform actions, it is referred to as “executing” or “running”.
    For example, you can run a search on the internet by clicking the search button
    or you could execute an instruction by pressing enter on your keyboard.


    It is important to understand that machines are not life forms. Even though they
    can perform seemingly miraculous operations, the true source of their products
    is humankind.


    ![](img/33a81fac26246d29975692e5ecda6e53_13_0.png)


    Computers aren’t very useful without programs – so let’s go over what programs
    are exactly.'
