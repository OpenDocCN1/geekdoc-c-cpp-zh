- img_proc: true
  md: 'An interpreter is a special program that converts high-level language instructions
    into low-level language instructions. An interpreter converts code one instruction
    at a time rather than converting the entire set of instructions in the program
    prior to execution.


    In other words, the interpreter will read an instruction, convert it to the language
    the computer can understand, have the computer execute that instruction, then
    go on to the next instruction in the program and repeat.


    Interpreted programming languages (like JavaScript) use interpreters.


    # RUNTIME


    Run means to start or execute something.


    To understand runtime, you must first understand what a “compiler” is.


    Runtime means the time when something is in the computer is running. Runtime is
    exactly what it means – the time when the program is run. You can say something
    happens at runtime or it happens at compile time.


    The term “runtime” also describes software or instructions that are executed while
    your program is running, especially those instructions that you did not write
    explicitly, but are necessary for the proper execution of your code. This is actually
    a “runtime library,” but is often shortened to simply “runtime.”


    A library is a collection of pre-made resources to create computer programs. Most
    often, these take the form of a package of code with built-in functions that all
    relate to a specific area. They are usually used by adding them to a software
    project already being created, and then coding in that project make use of the
    various functions in the library.


    In computer programming, a runtime library is a special program library used by
    a compiler to implement functions built into a programming language during the
    runtime (execution) of a computer program.


    For example, you can design videos to load during runtime or if they were loaded
    during runtime, then you would have to wait for it to load after you clicked on
    it. If they were loaded prior to runtime, the videos would have loaded when you
    originally opened the program (set of instructions entered into a computer that
    performs exact functions) and so the program would take longer to load up when
    started.'
