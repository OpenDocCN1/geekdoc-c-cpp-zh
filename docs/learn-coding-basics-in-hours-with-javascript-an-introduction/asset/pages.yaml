    # HIGH-LEVEL


    Machine language that we discussed earlier (1s and 0s) is considered a "low-level
    language." This is due to the fact that it directly represents the on or off states
    used in both the hardware of the computer in that it directly represents the computer
    instructions and the data the computer operates on.


    The opposite of a low-level language is a high-level language – code written in
    a way that is easier to read and write because it is somewhat resembles English,
    such as:


    Print "Hello";'
