  md: 'A Boolean OR comparison checks for whether one or both conditions are true.
    Here is an example:


    4 is less than 9 OR 8 is less than 7


    The result would be true because at least one of the comparisons is true (4 is
    a smaller number 9).


    In the following example, the result would be false since neither is true:


    8 is less than 4 OR 9 is less than 3


    And in this example, the result would be true because one or both (in this both)
    are true:


    7 is less than 8 OR 2 is less than 5


    As a reminder, in writing instructions for a computer, we would use the greater
    and lesser symbols (> and < respectively). For example: 7 > 3 means "seven is
    greater than three", and 4 < 9 means "four is less than nine".


    So, for example, instead of 10 is greater than 2, we would write:


    ```

    10 > 2

    ```


    And, again, if we wanted to say "greater than or equal to", we could use the symbol
    >=.


    For example:


    ```

    10 >= 8

    ```


    This would be true.


    Like virtually all other programming languages, the Boolean values in JavaScript
    are true and false.'
