  md: '# Notice that there are no data types specified. Notice, as well, that the
    variable “HoursWork” has a value of “ten” – a word, not a number.


    If we wanted to perform the same math as above example, we might create the same
    computer instruction:


    ```

    Paycheck = HoursWorked x PayRate

    ```


    This makes math operations a bit different. The computer takes the value of the
    variable PayRate, 35.00, and tries to multiply it by the value of the variable
    HoursWorked, “ten”.


    This doesn’t work at first glance, of course – you can’t multiply a number by
    a word! But untyped languages have a predetermined system that is used to infer
    (determine something based on the available information) the type of data that
    the variable represents. Here, the language can work out that the word “ten” can
    mean the number 10 – and since the instruction is a math operation, the language
    interprets the variable in that manner and multiplies 35.00 by 10 to get 350.


    JavaScript is an untyped programming language in that you aren’t required to define
    the type of a variable.


    # INTERPRETED


    A compiler is a special program that converts the code that looks nearly English
    into a form that the computer can understand and operate off of. The product of
    a compiler would be a set of instructions for the computer to execute that would
    end up doing what “nearly English” code described.


    For example, if you typed this instruction within a computer program:


    ```

    if age > 18, print “You are an adult”

    (the symbol > means greater than)

    ```


    A compiler would take what you wrote, change it and relay that command to the
    computer so it can be executed (i.e., machine language–a long series of Is and
    0s).


    One important aspect of how a compiler works is that it takes all of the instructions
    in the program and turns them into language the computer can understand before
    actually executing the program. There are other methods of converting high-level
    languages to computer-readable form that don’t involve converting the entire program
    before it is executed. Instead, each instruction is converted and executed one
    at a time. This is not how a compiler works, however.


    A compiled programming language uses a compiler.'
  merge: -1
