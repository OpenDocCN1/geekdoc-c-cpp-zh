  md: "# CHAPTER TWENTY SIX\nCONDITIONAL STATEMENTS\n\n“If statements” are a type\
    \ of conditional statement that specifies a section of code to be executed if\
    \ a condition is true.\n\nWrite this code:\n\n```\n<!DOCTYPE HTML>\n<html>\n<body>\n\
    \  <script>\n    if (1 < 2) {\n      document.write(\"The left number is smaller\
    \ than the right number.\");\n    }\n  </script>\n</body>\n</html>\n```\n\nSave\
    \ and execute your code. Since 1 is smaller than 2, the string is displayed.\n\
    \nThe Date().getHours() method returns the hour in the specified date according\
    \ to the local time, and the hours are listed as integers between 0 and 23. For\
    \ example: 18 is equal to 60 p.m., 12 is noon.\n\nWe can get creative with “if”\
    \ statements. Write this code:\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n  <p id=\"\
    Greeting\">How are you this evening?</p>\n  <script>\n    if (new Date().getHours()\
    \ < 18) {\n      document.getElementById(\"Greeting\").innerHTML = \"How are you\
    \ today?\";\n    }\n  </script>\n</body>\n</html>\n```\n\nSave and execute your\
    \ code. In this program, we said, “If it is later than (greater than) 6:00 p.m.\
    \ when I ran my code, display ‘How are you this evening?’ If it is earlier than\
    \ 6:00 p.m. when I ran my code, ‘How are you today?’ will display.”\n\nSo, what\
    \ if we want more choices?\n\n# ELSE STATEMENTS\n\nThe else statement specifies\
    \ a block of code that will be executed if the condition is false (opposite of\
    \ the if statement)."
