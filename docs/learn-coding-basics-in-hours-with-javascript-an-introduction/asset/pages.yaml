    \ an operator is a symbol used to carry out a computation (that act of figuring\
    \ out the amount of something using math). There are several different kinds of\
    \ operators. Arithmetic operators, such as:\n\n+   - (add)\n- (subtract)\n- (divide)\n\
    * (multiply)\nare used to perform math operations.\n\n# ASSIGNMENT OPERATOR\n\n\
    In JavaScript, the assignment operator is \"=\"; it is used to assign value to\
    \ a variable.\n\nFor example, to say that x = 10 in JavaScript, we are assigning\
    \ the variable \"X\" the value \"10.\"\n\nLet's assign a variable in JavaScript.\
    \ Delete your old code and write the following:\n\n```\n<DOCTYPE html>\n<html>\n\
    <body>\n<script>\n  var X = \"Hello, world!\";\n  document.write(X);\n</script>\n\
    </body>\n</html>\n```\n\nSave and execute this code. We assigned variable X to\
    \ the string value \"Hello, world!\"\n\n# CREATING A STRING\n\nThere are some\
    \ characters and functions that cannot easily be put within quotes when writing\
    \ strings in JavaScript."
