  md: '# CHAPTER FIFTEEN

    EXPRESSIONS AND STATEMENTS


    Expressions are numbers, symbols, and operators grouped together that show the
    amount of something. Basically, an expression is a written math problem.


    In computers, an expression is a combination of values that are computed by the
    computer. There are different ways to write out expressions, depending on which
    language you are programming in.


    For example, Name = "what person types in the name box" could be an expression.
    Also, x + 5 is an expression.


    As a reminder, statements are computer instructions. These are the instructions
    used by people as they create computer programs. The simplest of these things
    might be like "print", "delete", "add", "multiply", etc.


    For example, the "print" statement tells your computer to print whatever text
    you typed as part of the command.


    In JavaScript, expressions and statements are different things. An expression
    results in a value, while a statement performs a task – a program is basically
    a series of statements.


    There are basically two types of expressions:


    +   1) Ones that have a value (or result in a value), and

    2) Those that assign a value to a variable.


    The following JavaScript code is an expression:


    ```

    3 + 3

    ```


    Now, consider the following:


    ```

    Document.write(3 + 3);

    ```


    This is a statement. Within this statement, the expression 3 + 3 is contained.'
