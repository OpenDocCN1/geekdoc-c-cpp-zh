  md: 'For example, what if you wanted to display: Sally said, “I don’t want to go”?
    You not only have additional quotation marks around Sally’s statement, you also
    have the single quote (apostrophe) within “don’t”.


    The solution to this problem is to add a backslash (\) – this is referred to as
    escaping’ the character and tells the computer that the character that follows
    has a special meaning. For example: \'' or \" means that the quote mark(s) following
