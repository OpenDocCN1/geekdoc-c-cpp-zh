  md: '# # CHAPTER FIVE

    MACHINE LANGUAGE


    You may have heard the concept that computers operate on 1s and 0s. How this works
    exactly is beyond the scope of this book, but a simplified explanation is that
    computers are made up of billions of tiny parts that can be either or off. 1 represents
    on, 0 represents off. You can instruct computers to turn these parts on and off
    by entering 1 and 0 into the computer. These 1s and 0s are called machine language.
    Commands written in machine language are called machine instructions.


    As an example, "10010100 01010111 01010111 01011010" could instruct the computer
    to *Delete the file Vacation.doc.* The "10010100 01101011 01010111 01010110" is
    a machine instruction.


    It is difficult for people to read and write in machine language, since the languages
    we created are just unique patterns of ones and zeroes. That is why programming
    languages were created. The computer converts (translates) the code written by
    developers into machine instructions.


    It works like this:


    ![](img/33a81fac26246d29975692e5ecda6e53_19_0.png)


    One of the main uses of computers is the internet. So, what is the internet and
    how does JavaScript relate to it?'
