    # SUBPROGRAMS


    The main series of instructions in a program is called the "main program."


    It is sometimes valuable to create another program that can be used by

    main program as needed. This is called a subplot. It is no different from any

    other program – it is made up of the same elements (entrance point, variables,

    control and branching statements, and exit point).'
