  md: '# CHAPTER ELEVEN


    # HTML AND CSS


    JavaScript is one of three of the main technologies utilized to create content
    on the world wide web (HTML and CSS being the other).


    # HTML


    HyperText Markup Language is the markup language that makes up the webpages on
    the World Wide Web. It was created by Tim Berners-Lee (the inventor of the web)
    in 1990. Hypertext is a system for linking electronic documents. In an HTML document,
    hypertext is words, images, videos, etc. that link to other HTML documents. When
    a user selects the hypertext, the document is retrieved and displayed on the computer
    screen. HTML is used to create webpages.


    A computer programmer uses HTML to put markup instructions before and after the
    content of a webpage. Markup instructions give the data about the elements of
    the document – text, images, video, etc. When the document is actually displayed
    on a screen, markup instructions aren''t displayed on the screen – instead, they
    are used to control how the actual content of the document is displayed. As of
    2020, HTML5 is the newest version of HTML. Here is an example of an HTML website
    from the 1990s:


    ![](img/33a81fac26246d29975692e5ecda6e53_45_0.png)


    # CSS


    Cascading Style Sheets was created in 1996 and is used to control the appearance
    of the text, images, videos, etc., on those webpages. A style sheet is a tool
    used to design the format of a webpage. Style sheets are a central place to store
    data about how that page will appear and how it will behave. They can be used
    to store information about how to display colors, pictures, text, etc. A style
    sheet is a sheet that handles the style of the website.'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'Styling is not concerned with the content of a page; rather, it is concerned
    with the appearance of that content. Cascading is a term that comes from the idea
    of water dropping down a series of drops in height. Think of it as a series of
    small waterfalls. Information can cascade, meaning it can be stored at one central,
    most important location and then be applied to other locations that are considered
    to be lower than, or derived from, that more important central location. For web
    pages, that means you can set style information in one high-level web page, and
    that same styling information can "cascade" to other, lower pages without any
    further work. CSS is usually used in conjunction with HTML to upgrade the appearance
    and functionality of HTML websites. As of 2020, CSS3 was the newest version of
    CSS.


    ![](img/33a81fac26246d29975692e5ecda6e53_46_0.png)


    HTML, CSS, and JavaScript are commonly used in conjunction with each to create
    dynamic websites. In this book, we will teach you some basic JavaScript, and to
    do so, we will use HTML occasionally.


    # HISTORY OF JAVASCRIPT


    A browser is a program that you use to look at webpages on the internet. In order
    to look at information on the web, you use a web browser. The most common activity
    people use browsers for finding and viewing websites – more particularly, the
    webpages on websites. Google Chrome is the most used browser.


    The difference between a browser and search engine is: a browser is used to visit
    and display websites, while a search engine is used to search for websites. For
    example, you could use the browser Internet Explorer to search on Yahoo''s search
    engine.


    In the mid-1990s, there was no Google, and so, prior to Google Chrome, the most
    popular browser was Netscape Navigator. JavaScript was created by Brendan Eich
    in 1995 who worked for Netscape at the time.


    Java was a popular programming language at the time, and still is – and was one
    of the inspirations for JavaScript. But to be clear, Java and JavaScript are two
    completely different programming languages. Since Java was being heavily marketed
    at the time, Netscape named the new scripting language JavaScript.'
  merge: -1
  pgno: 46
