  md: "# CONSTRUCTORS\n\nA \"constructor\" is a special part of a class (a template\
    \ for defining an object item with state and behavior).\n\nThe constructor is\
    \ a special part of the class that describes the default state of any new instance\
    \ of the class that gets created. In other words, it gives default values for\
    \ the properties of the class.\n\nFor example, let's say you had a class called\
    \ \"Customer.\" The computer code to create the \"customer\" class might look\
    \ something like this:\n\n```\nclass Customer\n{\n    string FullName;\n    Boolean\
    \ Active;\n}\n```\n\nNow let's say that whenever you created a new instance of\
    \ the \"customer\" class, you wanted it to be an active customer – in other words,\
    \ you wanted the property \"Active\" to be set to \"true\".\n\nTo do this, you\
    \ would make a constructor for the \"customer\" class. It would be a small subparagraph,\
    \ inside the class, that would be used every time an instance of the \"customer\"\
    \ class was created.\n\nThe constructor might look something like this:\n\n```\n\
    Customer(string name) {\n    Fullname = name;\n    Active = true;\n}\n```\n\n\
    The entire class would look like this:\n\n```\nclass Customer\n{\n    string FullName;\n\
    \    Boolean Active;\n    Customer(string name) {\n        Fullname = name;\n\
    \        Active = true;\n    }\n}\n```"
