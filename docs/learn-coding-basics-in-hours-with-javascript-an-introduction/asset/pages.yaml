- img_proc: true
  md: 'IDEs are the most common programs used by developers to write their code.


    2) Text editor: A text editor is a program used to write and edit text. Text editors
    are very basic - meaning, the text is typically plain with no effects. This is
    technically different from a word processor, which is a program on a computer
    that allows you to create, format (design the style and layout), modify, and print
    documents. While text editors be used to write code, word processors cannot. Instead,
    word processors have more functionality (ability to perform a wider range of actions)
    than text editors.


    As an example of each, Microsoft Word (on the left) is a word processor, while
    Notepad (on the right) is a text editor.


    ![](img/33a81fac26246d29975692e5ecda6e53_17_0.png)


    Out of the three programs listed here used to write code within, text editors
    are the least popular and least recommended.


    3) Code editor: As the name states, this is a program that can be used to write/edit
    your code. Code editors are in between IDEs and text editors in terms of features
    (functions built into an application) – they have fewer features than an IDE but
    more than a text editor. One of the most popular code editors is Notepad++ (plus
    plus).


    As an example, the popular IDE Visual Studio has a feature called “LiveShare,”
    which allows developers to share their code with others as it is being written.
    Other developers can use LiveShare within Visual Studio to access and edit your
    code from a separate computer! This feature is not included in the code editor
    Notepad++.


    On the other hand, Notepad++ has a cool feature “auto-completion” that suggests
    various options for completing the code you are typing for you. For example, when
    you type pr, auto-completion may suggest print. This feature does not exist in
    the text editor Notepad.'
