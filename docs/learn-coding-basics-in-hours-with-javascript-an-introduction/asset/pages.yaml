  md: '# CHAPTER FOUR

    PROGRAMMING LANGUAGES


    Languages are communication systems that allow you to transfer ideas in written
    and spoken words. Similar to spoken languages that people use (like Spanish and
    English), there are different languages that can be used to write (create) computer
    programs — these are called programming languages or computer languages. Programming
    languages are organized systems of words, phrases and symbols that let you create
    programs.


    There are many different types of programming languages, each of which was created
    to fill a specific purpose. Usually a language is created in order to make the
    creation of certain types of computer programs.


    As an example, Python is a popular programming language. This is how you would
    tell a computer to display the words “Hello, world!” on the screen, using the
    computer language Python:


    ```

    print("Hello

    ```


    This is code. All software/applications/programs are made up of code. As a user
    (the person using something), you don''t see the code. The three most common types
    of programs that developers use to write their code in are:


    +   1) Integrated development environment (IDE). An IDE is a set of programming
    tools for writing software programs. IDEs are a great aid to computer program
    creation. An IDE often combines many available tools into one place. Essentially,
    an IDE is software that helps you make software.


    For example, Visual Studio, available from the technology company Microsoft, is
    one of the many IDEs available for software developers.


    ![](img/33a81fac26246d29975692e5ecda6e53_16_0.png)'
