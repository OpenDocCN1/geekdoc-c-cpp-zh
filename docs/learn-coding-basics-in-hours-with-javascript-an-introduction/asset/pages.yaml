  md: '# CHAPTER ONE

    WELCOME


    Welcome to The Tech Academy''s Learn Coding Basics in Hours with JavaScript

    book!


    Now, we''re sure you want to dive right into coding but there''s some information
    we are going to cover first to ensure you are well prepared. In fact, you won''t
    write any code until the 13th chapter of this book.


    It may seem like a lot of reading before we get down to business but it''s worth
    it. Let''s compare this to another subject: how hard would it be to drive a car
    if you couldn''t define the important terms – as steering wheel, gas pedal or
    brake pedal? So, please bear with us and take some time learning some fundamental
    data that will set you up well for the adventure that lies ahead.


    We have attempted to define all technical terms used in this book if you come
    across any one that you don''t understand, look up them in The Tech Academy''s
    Technology Basics Dictionary (available for purchase on Amazon).


    The Tech Academy is a technology school headquartered in Portland, Oregon, with
    multiple campuses around the world. We specialize in coding camps (intensive training
    programs at preparing graduates for entry-level technology positions, that can
    be completed in a few months). We also offer custom training for companies, and
    have published several books.


    While we would love to tell you everything about computers and technology in this
    book, we are only going to cover the absolutely necessary data. If you are interested
    in learning how computers work exactly, we recommend reading our book You Are
    Not Stupid – Computers and Tech Simplified, which can be purchased on Amazon.


    Our educational philosophy is to *assume no prior knowledge on the part of the
    student*. What this means is that our training content, including this book, is
    written for absolute beginners. We operate on the assumption that you''ve never
    written code before and that you don''t know basic technical terms – this ensures
    nothing is over your head and that you aren''t lost while reading.


    You''re about to experience The Tech Academy''s approach to education first hand:
    we are going to start our book by defining the technical words used in the title
    of our book!


    # CODING


    Coding refers to the act of entering instructions into computers to make them
    perform specified actions. A computer is a special type of machine.'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'Machines are devices (equipment with a purpose; tools) made by humans to get
    work done. They are usually made out of durable materials like wood, plastic and
    metal. Normally they have some parts that move and some parts that don''t; sometimes
    they have no moving parts at all. They receive some kind of energy that they use
    to do their work.


    One of the traits that makes people different from animals is their ability to
    create complex machines.


    Usually people create machines because there is some work they want to do that
    the machine could help them with. The help the machine provides could be to get
    the work done faster, to do the work with less chance of errors, or to do the
    work nearly continuously, without the need to stop for food or sleep. There are
    other reasons people make machines, but it usually comes down to getting more
    work done in a given amount of time with fewer errors.


    As time goes on, machines often get improved or changed to make them more effective
    or to respond to changes in the area of society where they are used.


    Cars, planes, telephones and ovens are all machines.


    Again, a computer is just another machine – it’s a device made by people to get
    work done.


    ![](img/33a81fac26246d29975692e5ecda6e53_11_0.png)


    ![](img/33a81fac26246d29975692e5ecda6e53_11_1.png)


    ![](img/33a81fac26246d29975692e5ecda6e53_11_2.png)


    ![](img/33a81fac26246d29975692e5ecda6e53_11_3.png)


    Let’s take a closer look at computers.'
