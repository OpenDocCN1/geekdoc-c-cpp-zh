    \ of. Usually the “=” symbol is used to set the VALUE of a variable.\n\nIn math,\
    \ a value is a numeric amount, quantity, or number – like this: X = 10\n\nHere\
    \ we are saying that the name “X” holds the value of “10.”\n\nIn coding, a value\
    \ is any sort of characteristic or attribute. We could assign the value like this:\
    \ \n\n```\nX = Happy\n```\n\nThis means we are saying the name X is assigned the\
    \ value Happy. We could later tell the computer:\n\n```\nPrint X\n```\n\nThe computer\
    \ would then display:\n\n```\nHappy\n```\n\nThe things the computer is keeping\
