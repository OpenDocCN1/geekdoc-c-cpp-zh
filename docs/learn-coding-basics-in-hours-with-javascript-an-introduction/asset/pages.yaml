  md: "# CHAPTER TWENTY SEVEN\nSTRING METHODS\n\nJavaScript has string methods that\
    \ allow you to perform tasks with strings.\n\nAs covered earlier, programming\
    \ languages have certain data types built into them. These built-in data types\
    \ are the most basic data types in the programming language and are referred to\
    \ as primitive data types. One of the key traits of a primitive data type is that\
    \ it cannot be simplified any further. A primitive data type of data that is built\
    \ into the language.\n\nThere are five primitive data types in JavaScript – these\
    \ are:\n\n+   1) String,\n2) Number,\n3) Boolean,\n4) Null, and\n5) Undefined.\n\
    \nEverything else (non-primitive data types) are objects. Objects are created\
    \ by the programmer, not predefined and built into the programming language.\n\
    \n# CONCAT() METHOD\n\nThe concat() method concatenates (connects) two or more\
    \ strings. Write this code:\n\n```\n<DOCTYPE html>\n<html>\n<body>\n  <p id=\"\
    Concatenate\"></p>\n  <script>\n    var part_1 = \";\n    var part_2 = \";\n \
    \   var part_3 = \";\n    var part_4 = \"sentence.\";\n    var whole_sentence\
    \ = part_1.concat(part_2, part_3, part_4);\n    document.getElementById(\"Concatenate\"\
    ).innerHTML = whole_sentence;\n  </script>\n</body>\n</html>\n```\n\nSave and\
    \ execute your code. It displays the sentence as a whole!\n\n# SLICE() METHOD\n\
    \nThe slice() method is a string method that extracts a section of a string and\
    \ returns the extracted section in a new string."
  merge: -1
