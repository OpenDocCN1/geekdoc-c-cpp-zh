  md: '# CHAPTER TWENTY FIVE

    IDENTIFIERS AND LITERALS


    An “identifier” is a name for something. In JavaScript, identifiers are the names
    of variables, functions, keywords, and labels. In the following code, “X” is the
    identifier:


    ```

    var X = 10

    ```


    In contrast to an identifier, a literal is something that represents a value within
    source code. Source code is the version of a computer program as it is originally
    written (i.e., typed into a computer in some programming language) by the designer
    of the program. Normally, when the programmer is done convert the code she wrote
    the program in (the “source code”) to another format that is easier and faster
    to use. In that new format, the program can’t be easily understood by people –
    but it is very useful to the computer. It also can’t be modified by other programmers
    at that point.


    Look at this code:


    ```

    var X = 10

    var Y = “Charlie”

    ```


    The 10 is the integer (whole number) literal, Charlie is the string literal, “X”
    and “Y” are the identifiers.


    A literal is the data exactly as it is meant to be processed. Whereas an identifier
    is a name, the literal is the value itself.


    # NESTED FUNCTIONS


    Nested refers to something contained within something else. This can be a program
    within a program or a set of instructions inside another set of instructions.


    Sometimes the subprogram needs some information from the main program in order
    to perform its tasks. When the subprogram is created, its description might include
    this information. That information is called the “parameters” of the subprogram.


    The parameters of the nested entity are explained within the larger (and enveloping)
    entity. It''s nested because it is placed inside something else.


    For example, a nested procedure would be a set of commands that is contained within
    a larger procedure.'
  merge: -1
  pgno: 101
- img_proc: true
  md: "In JavaScript functions have access to the functions that are above them in\
    \ the code. A nested function is a function under another function that is connected\
    \ somehow.\n\nTo see this in action, write this code:\n\n```\n<!DOCTYPE html>\n\
    <html>\n<body>\n<p id=\"Counting\"></p>\n<script>\ndocument.getElementById(\"\
    Counting\").innerHTML = Count();\nfunction Count() {\n  var Starting_point = 9;\n\
    \  function Plus_one() {\n    Starting_point += 1;\n    Plus_one();\n  }\n  return\
    \ Starting_point;\n}\n</script>\n</body>\n</html>\n```\n\nSave and execute this\
    \ code. \"10\" should be displayed. In our code, the Plus_one() function was the\
    \ nested function.\n\n# SCOPE\n\nIn programming, code can have \"scope.\" Simply\
    \ put, the scope is the functions, variables, and objects you have access to.\
    \ Scope can be limited. Variables have scope in that they can be accessed by one,\
    \ more than one, or all functions in a program. The scope of variables is either\
    \ \"local\" or \"global\".\n\nIn JavaScript, a global variable can be accessed\
    \ from any function within the program, whereas a local variable is only outside\
    \ of the function it is assigned to.\n\nGlobal variables are declared outside\
    \ of functions, and local variables are declared inside of functions."
  merge: -1
  pgno: 102
- img_proc: true
  md: "A global variable would be written as follows (write this code):\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n  <script>\n    var X = 10;\n    function Add_numbers_1()\
    \ {\n      document.write(20 + X + \"<br>\");\n    }\n    function Add_numbers_2()\
    \ {\n      document.write(X + 100);\n    }\n    Add_numbers_1();\n    Add_numbers_2();\n\
    \  </script>\n</body>\n</html>\n```\n\nSave and execute your code. It should return\
    \ \"30\" and \"110.\" The variable X was assigned the value 10 outside of our\
    \ function, but we still accessed it. Therefore, the above is an example of a\
    \ global variable. As a reminder, <br> is the break tag and creates a line break\
    \ in text (like pressing enter on your keyboard).\n\nNow, let's try a local variable.\
    \ Write this code:\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n  <script>\n    function\
    \ Add_numbers_1() {\n      var X = 10;\n      document.write(20 + X + \"<br>\"\
    );\n    }\n    function Add_numbers_2() {\n      document.write(X + 100);\n  \
    \  }\n    Add_numbers_1();\n    Add_numbers_2();\n  </script>\n</body>\n</html>\n\
    ```\n\nSave and execute your code. This time, it only returns \"30\" because the\
    \ variable was local — meaning it was written within the function Add_numbers_1\
    \ and couldn't be accessed outside of it."
  merge: -1
