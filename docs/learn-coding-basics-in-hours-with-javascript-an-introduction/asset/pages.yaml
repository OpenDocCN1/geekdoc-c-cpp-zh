- img_proc: true
  md: 'An incorrect algorithm would be:


    +   1. Start an amount of 1

    2. Add 1 to that amount

    3. Go to step 2


    The computer would count 0, 1, 2, 3, 4, forever.


    For example, “Count from 1 to 10, then print a message that says, ‘I counted from
    1-10,’ would be a correct algorithm because it contains a finite amount of steps.


    # WELL-ORDERED


    Well-ordered: listed out in the correct sequence and in an organized fashion.
    Computers can only execute an algorithm if it is well-ordered. If it is put out
    of sequence or no sequence is specified, etc., the computer cannot process the
    algorithm.


    For example, this is an incorrect algorithm because it is not well-ordered:


    +   1. Close the program

    2. Print “I am here” inside the program

    3. Save your work in the program

    4. Open the program


    # EFFECTIVELY COMPUTABLE OPERATIONS


    Effectively computable operations: this refers to a command that can be processed
    successfully by a computer. The phrase literally means an operation that can be
    computed in an effective way.


    In algorithms, all of the parts of the algorithm must be possible to execute.


    For example, a non-effectively computable operation could be: “multiply green
    by red” – the computer cannot process this because it isn''t computable. Operations
    contained in algorithms must be effectively computable, such as, “2 + 2 =”.


    # UNAMBIGUOUS


    Unambiguous: ambiguous means unclear, confusing, not specified. Un = not. Something
    that is unambiguous means that it is clear and defined.'
