  md: "# CHAPTER TWENTY NINE\nFINAL CHALLENGE\n\nTo conclude this book, we're going\
    \ to put it all together by creating a timer that will countdown by seconds. Here\
    \ go we go!\n\nFirst, replace any existing code in your editor with the following:\n\
    \n```\n<!DOCTYPE html>\n<html>\n  <body>\n    <p>How many seconds would you like\
    \ to set your alarm for?</p>\n    <input id=\"seconds\" value=\"\" />\n    <button\
    \ onclick=\"countdown()\">Click here</button>\n    <p id=\"timer\"></p>\n  </body>\n\
    </html>\n```\n\nThe idea here is that the user will be asked how many seconds\
    \ he/she like to set the timer. There is an input box available where a value\
    \ may be entered. A button is also created so that when clicked, it will send\
    \ the value out to be processed. The result will be a displayed countdown timer.\n\
    \nRemember that the input tag deals with information that the user enters. The\
    \ id \"minutes\" and the value \"\" are associated with the JavaScript code that\
    \ we'll see shortly.\n\nThe \"button\" tag will create a button that, when clicked,\
    \ will look in the JavaScript code for the \"countdown()\" function. The result\
    \ that the countdown function produces depend upon what the user submitted when\
    \ he/she clicked the button we made.\n\nThe tag with the id \"timer\" wants to\
    \ know the result of the countdown function so that it can display a timer for\
    \ the user to see. It will retrieve information from the associated JavaScript."
  merge: -1
  pgno: 111
- img_proc: true
  md: "So, let's take a look at the HTML code again, this time, with the addition\
    \ of the JavaScript code:\n\n```\n<DOCTYPE html>\n<html>\n  <body>\n  <p>How many\
    \ seconds would you like to set your alarm?</p>\n  <input id=\"seconds\" value=\"\
    \" />\n  <button onclick=\"countdown()\">Click here</button>\n  <p id=\"timer\"\
    ></p>\n  <script>\n    function countdown() {\n      var seconds = document.getElementById(\"\
    seconds\").value;\n\n    function tick() {\n      seconds = seconds - 1;\n   \
    \   timer.innerHTML = seconds;\n      setTimeout(tick, 1000);\n      if(seconds\
    \ == -1) {\n        alert(\"Time's up!\");\n      }\n    }\n      tick();\n  \
    \  }\n  </script>\n  </body>\n</html>\n```\n\nYou'll notice right away that there\
    \ are two separate functions in our JavaScript code. In fact, the \"tick\" function\
    \ is sitting inside of the \"countdown\" function! As a reminder, this is called\
    \ \"nesting functions.\"\n\nThe countdown function is called just one time, and\
    \ it does only two things:\n\n+   1. It sets a variable named \"seconds\" to the\
    \ value that the user inputs.\n2. It creates and runs the tick function.\n\nThe\
    \ tick function, on the other hand, has several steps to execute and will end\
    \ up repeating multiple times.\n\nImmediately after the countdown function has\
    \ received the input value from the user, the tick function begins laying out\
    \ its instructions. It's important to recognize that the tick function is not\
    \ actually being executed yet. It is simply letting its instructions be made known\
    \ in case the ever actually needs to be used. Once the interpreter reads the tick\
    \ function, it finds out and sees the \"tick()\" instruction. Upon seeing this\
    \ function, the Interpreter knows to immediately go back through the tick function.\
    \ However, this time, instead of simply reading the function, it is actually going\
    \ to run the function."
  merge: -1
  pgno: 112
- img_proc: true
  md: 'Take a look at the variable "seconds" within the tick function. It is taking
    the value "seconds" from the countdown and subtracting 1 from it. The reason that
    this value needs to be subtracted by 1 is that each time this function runs, it
    will last just one second (as we will see), and we need the variable "seconds"
    to subtract 1 each time a second goes by.


    Right after 1 is subtracted from the user''s input the first time through the
    tick function, that same number has been subtracted by 1 will be displayed for
    the user to see. This happens because the timer.innerHTML is being assigned to
    the user. Remember how we put "id=timer" in one of our HTML tags? That now holds
    this number that we assigned.


    The statement "setTimeout(tick, 1000);" simply means that the program is pausing
    for 1,000 milliseconds (i.e., 1 second). This is important because this function
    is going to potentially repeat multiple times – and every time it repeats, it
    needs to do so for a duration of exactly one second.


    We have here a conditional statement. What it''s telling us is that if the user''s
    input counts all the way down to -1, stop everything and run the alert box. You
    may be asking yourself, Why -1 instead of 0? The reason is that the interpreter
    sees -1, it hasn''t actually displayed it to the user. The user is still seeing
    a 0, therefore before the -1 is displayed, the alert box will show up, preventing
    any other code from running. As a note, if the user clicks the OK button on the
    alert box, he/she will see the timer continue to count down into the negatives.


    Now, if the user''s input does not equal -1, the interpreter will simply step
    out of the function like before. But wait; it''s going to run into "tick()" statement
    again! Exactly. Do you see how our function will continue to repeat now? That
    is, until our conditional statement is met – wherein the alert box is displayed.


    Try it out for yourself and don''t worry if you have to read the code through
    several times before it really begins to sink in!


    # FINAL CHALLENGE


    Here is your final assignment:


    Through online research, find out how to end the program (i.e, stop the countdown)
    when a user clicks the OK button on the alert box.'
  merge: -1
