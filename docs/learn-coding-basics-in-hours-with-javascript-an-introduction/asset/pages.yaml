  md: '# CHAPTER NINETEEN

    FLOATING POINT


    It''s time to get mathematical!


    Factors are numbers that can multiply together to get another number. For example,
    4 and 5 are factors of 20 because $4 \times 5 = 20$


    ![](img/33a81fac26246d29975692e5ecda6e53_80_0.png)


    Superscripts are smaller characters typically displayed toward the upper right
    of another number - like this: $4^{12}$


    Superscripts usually indicate "power." Power refers to how many times a number
    is multiplied by itself. For example, $10^4$ means 10 to the fourth power—which
    is 10,000 (10 multiplied by 10 multiplied by 10 multiplied by 10).


    A notation is a symbol or symbols used to represent numbers or amounts—such as
    an $E$ placed at the end of a number. This notation means "10 to a given exponent."
    An "exponent" is the power to which a number is multiplied. In the $10^4$ example
    given above, 4 is the exponent.


    ![](img/33a81fac26246d29975692e5ecda6e53_80_1.png)


    A floating point is a specific way of representing large numbers. Instead of writing
    out the entire number, you can write the first part of it and then a factor to
    multiply it by. This makes it so that by performing the multiplication, you get
    essentially the same number you would have by writing it out in full. When you
    do this, you move the decimal point in the number; hence the name "floating point."'
  merge: -1
  pgno: 80
- img_proc: true
  md: "For example, take the number three thousand, four hundred twenty-five. Written\
    \ normally it would be: 3425 – written in floating point notation, it could be:\
    \ $3.425 \\times 10^3$. Since $10^3$ is 1000, this means $3.425 \\times 1000 =\
    \ 3425$.\n\nA \"float\" is a type of data used by computers. The \"float\" type\
    \ is used to store numbers with a very high degree of accuracy. It is primarily\
    \ used for mathematical purposes.\n\nLet's say we want a shorter way to write\
    \ 100,000. We could write 10E 4.\n\n10E 4 means 10 X $10^4$ (10 multiplied by\
    \ four times).\n\nIn JavaScript, all numbers are floating point numbers, and the\
    \ limit of floating point numbers is $1.797693134862315\\times 10^{308}$ (meaning\
    \ JavaScript can handle a much larger floating point number). Any number that\
    \ is larger than $1.797693134862315\\times 10^{308}$ is considered \"infinity.\"\
    \ As a note, this is a massive number far beyond the capability of most calculators\
    \ and would take an excessive amount of lines to display.\n\n# OTHER NUMBERS\n\
    \nIn JavaScript, there are three unique values that are considered numbers but\
    \ actually do not act in the same way. They are:\n\n+   - NaN (short for \"Not\
    \ a Number\")\n- Infinity (positive infinity)\n- -Infinity (negative infinity)\n\
    \nThe best way to understand these is to put them into action. Here's an example:\
    \ in a *new* Notepad++ document, write this code:\n\n```\n<!DOCTYPE html>\n<html>\n\
    <body>\n  <p id=\"Not_a_Number\"></p>\n  <script>\n    document.getElementById(\"\
    Not_a_Number\").innerHTML = 0/0;\n  </script>\n</body>\n</html>\n```\n\nSave your\
    \ file as an .html document with a name of your choosing. Execute your code. The\
    \ result is NaN because you can't divide 0 by 0."
