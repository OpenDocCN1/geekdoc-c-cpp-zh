  md: '# VALUE TYPES


    Nearly every programming language comes with certain data types built in and allows
    for the creation of other types of data by computer programmers. In JavaScript,
    these various types of data are called "values."


    There are six value types in JavaScript:


    +   1. Strings (data that represent text or a series of text)

    2. Numbers

    3. Booleans (true or false statements)

    4. Objects (things with state and behavior)

    5. Functions (a block of organized, reusable computer code used to perform a single,
    related action – also called a subprogram or subroutine)

    6. Values that are undefined


    You will learn how to utilize these value types in this book.


    We are really close to writing code! Let''s go over some tips to help you through
    this book.'
