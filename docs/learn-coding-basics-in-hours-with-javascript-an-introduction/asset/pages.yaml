  md: '# CHAPTER SIX

    THE INTERNET AND WORLD WIDE WEB


    JavaScript is a programming language that is able to work on most computers. It
    was created in 1995 by an American named Brendan Eich and is particularly useful
    in making websites.


    The World Wide Web (abbreviated "www" or the "web") is a collection of linked
    electronic documents, organized into groups called websites.


    A website is composed of one or more individual webpages, where a "page" is an
    organized, separate document containing text, images, video and other elements.


    ![](img/33a81fac26246d29975692e5ecda6e53_20_0.png)


    # THE INTERNET


    A network is a system where two or more computers are connected to each other.
    The computers can be connected by a cable (i.e., a wired connection) or connected
    wirelessly (through the air). Network is the word used to describe the link between
    things that are working together and is used in many different ways with computers.
    Information can be shared from computer to computer through the use of a network.


    ![](img/33a81fac26246d29975692e5ecda6e53_20_1.png)'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'Internet is a combination of the words “interconnected” and “network."


    The internet is an interconnected network of many computers around the world.
    It is the largest network in existence and allows computers to pass data to one
    another.


    There are lots of different types of data that can be sent back and forth between
    computers connected to the internet – like electronic messages, electronic documents,
    healthcare records, etc.


    ![](img/33a81fac26246d29975692e5ecda6e53_21_0.png)


    In addition to referring to the connection between computers on this network,
    internet also means the set of agreements, or protocols, for how to transfer different
    types of data between those computers.


    A “protocol” is an official procedure. In technology, it is a formal description
    of how a certain type of information will be formatted and handled. Basically,
    it’s an agreement that the various people who work with that type of information
    all adhere to. Protocols are usually described in written documents, and are very
    precise. They are usually created by experts in the applicable industry.


    An example of a type of data where a protocol would be valuable is healthcare
    information. If various organizations in the healthcare industry were to transfer
    healthcare data back and forth between computers as they perform their work, it
    would be important that they all agree about things like the exact format of the
    information, how to keep private data safe, etc. All of that would be laid down
    in a written protocol. Several such protocols exist in the healthcare industry.


    One or more protocols have been created for each type of data that can be transferred
    around on the internet. Violation of these protocols results in an error and the
    data will not be sent properly or at all.'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'So to recap: the internet is an interconnected network of many computers around
    the world, and a set of agreements, or protocols, for transferring different types
    of data between those computers.


    # INTERNET VS. WORLD WIDE WEB


    So, what''s the difference between the internet and the World Wide Web? The internet
    is the hardware and protocols that data is sent across, over the internet. whereas
    the web is a collection of linked electronic documents called webpages.


    The internet is the infrastructure (physical framework) while the web is the code
    that is transmitted and displayed. In a way, the internet is the hardware and
    the web is the software.


    ![](img/33a81fac26246d29975692e5ecda6e53_22_0.png)


    Dynamic refers to actions that take place the moment they are needed, rather than
    in advance. For example, a restaurant that prepares your food to your specifications
    when you order, would be dynamic. The opposite of dynamic is "static", which literally
    means, "unchanging." A static restaurant would have food pre-cooked and waiting
    before you order – the food doesn''t change in regards to time or circumstance.


    In coding, dynamic means the computer processes your request right when you ask
    it to – it does not have a predetermined result ahead of time.


    Dynamic relates to the internet by describing websites that have content changes
    while the website is being viewed.


    These are mouse pointers:


    As an example, a dynamic picture on a website could be one that has an effect
    (movement or change) when you hover over it with a mouse (hovering with a mouse
    refers to holding the pointer over a particular object).'
