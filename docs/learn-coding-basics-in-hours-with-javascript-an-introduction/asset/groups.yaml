    # CHAPTER TWENTY FOUR

    OBJECT-ORIENTED PROGRAMMING


    As we covered earlier, objects are items within computer programs that have both
    state and behavior. The state of an object could be the weight, color, height,
    etc. While the behavior of an object would be what the object does – the actions
    it takes – such as jump, run, sit, etc.


    Object-oriented is an approach to programming that focuses on objects and data
    (as opposed to consecutive actions or some other approach).


    You create objects by creating what are called “classes,” using one of the many
    specialized computer programming languages. Classes are used to describe one or
    more objects. This would be created by creating (or “declaring”) a class called
    a “Customer” class. It is important to know that when you first create this class,
    you are describing the POTENTIAL characteristics and behavior of TYPE of thing.
    You will still need to create an actual one of those things. That process is called
    “creating an INSTANCE” of the class, where “instance” means “an actual one” of
    the things described when you declared the class. When you do this, the data that
    makes up the object is kept in the computer’s memory.


    For example, in a computer program designed to track pay records for all employees,
    you could have a class called “Employee.” Each program element representing an
    actual employee (John Smith, Sally Jackson, etc.) would be an instance of the
    “Employee” class. You would have one instance for each employee you entered into
    computer. Each time you created an “employee” object, the computer would first
    find the “employee” class, then use the definition of that class in creating that
    particular “employee” instance using the data for the actual employee.


    # CLASS

    OBJECTS


