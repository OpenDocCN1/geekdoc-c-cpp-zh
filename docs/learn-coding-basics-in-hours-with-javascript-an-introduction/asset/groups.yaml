    \ `document.write()` 显示你选择的文本。\n\n# 第十四章\n## 变量与字符串\n\n编码中的一种常见操作是赋值变量。变量是每种编程语言中的关键。我们之前定义过这个术语，简单来说：它是一个根据条件或传递给程序的数据而可以更改的值。\n\
    \n在数学中，运算符是用于执行计算的符号（即使用数学计算某物体数量的行为）。有几种种不同的运算符。算术运算符，例如：\n\n- +（加法）\n- -（减法）\n\
    - /（除法）\n*（乘法）\n\n被用于执行数学运算。\n\n## 赋值运算符\n\n在 JavaScript 中，赋值运算符是 `=`；它用于给变量赋值。\n\
    \n例如，在 JavaScript 中表示 `x = 10`，意味着我们正在给变量 \"X\" 赋值值 \"10\"。\n\n让我们在 JavaScript\
    \ 中分配一个变量。删除你的旧代码并编写以下内容：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n\
    \  var X = \"Hello, world!\";\n  document.write(X);\n</script>\n</body>\n</html>\n\
    ```\n\n保存并执行此代码。我们将变量 X 赋值为字符串值 \"Hello, world!\"。\n\n## 创建字符串\n\n在 JavaScript\
    \ 中编写字符串时，有些字符和函数不能轻易放在引号内。\n\n例如，如果你想显示：Sally said, “I don’t want to go”？你不仅在\
    \ Sally 的语句周围有额外的引号，在 “don’t” 内部还有一个单引号（撇号）。\n\n这个问题的解决方案是添加一个反斜杠 (`\\`)——这被称为字符转义（escaping），它告诉计算机紧随其后的字符具有特殊含义。例如：`\\\
    '` 或 `\\\"` 意味着反斜杠后的引号不会结束字符串，而是打印在屏幕上。\n\n此外，如果你想开始新行，可以使用 HTML `<br>` 标签，它就像按下\
    \ Enter 键。这意味着“换行”字面上创建了新的一行文本——再次就像按下键盘上的 Return/Enter 键一样。\n\n让我们试一下。删除你之前的\
    \ HTML/JavaScript 代码并编写这个：\n\n```html\n<!DOCTYPE HTML>\n<html>\n<body>\n<script>\n\
    document.write(\"\\\")\n</script>\n</body>\n</html>\n```\n\n保存并执行你的代码。我们成功显示了引号和撇号！\n\
    \n等一下……如果你需要在代码中显示反斜杠，该怎么办？很简单。\n\n## 字符串拼接\n\n拼接（Concatenate）意味着将项目连接在一起，就像链条上的链接一样。它意味着获取一段数据并将其粘贴另一段数据的末尾。例如，拼接字符串\
    \ “dev” 和字符串 “ices”会生成文本 “devices.”\n\n在 JavaScript 中拼接字符串，你使用 `+` 运算符。\n\n删除你的\
    \ JavaScript 代码并编写以下内容：\n\n```html\n<!DOCTYPE HTML>\n<html>\n<body>\n<script>\n\
    document.write(\"Be who you are and say what you feel.\" + \"because...\");\n\
    ```\n\n保存并执行你的代码。有点不对……在 \"feel,\" 和 \"because\" 之间缺少一个空格。\n\n要修复这个问题，只需在 \"because\"\
    \ 之前添加一个空格如下：\n\n> \"because those who mind and those who matter don't mind.\"\
    \n\n保存并执行你的代码。现在显示正确了！\n\n## 多变量赋值\n\n你可以在一个语句中分配多个变量。编写这段代码：\n\n```html\n<!DOCTYPE\
    \ HTML>\n<html>\n<body>\n<script>\nvar Family = \"The Arezzinis\", Dad = \"Jeremiah\"\
    ,\nMom = \"Hermoine\", Daughter = \"Penny\", Son = \"Zorro\";\ndocument.write(Dad);\n\
    </script>\n</body>\n</html>\n```\n\n保存并执行你的代码。你分配了多个变量并显示了其中一个。\n\n## STR.FONTCOLOR(\"\
    \")\n\n我们对字符串的一个酷炫功能是使用 `str.fontcolor` 方法更改字体颜色。\n\n打开 Notepad++ 文档并编写这段代码：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n  var blues = \"I have the\
    \ blues\";\n  var blues = blues.fontcolor(\"blue\");\n  document.write(blues);\n\
    </script>\n</body>\n</html>\n```\n\n（注：由于提供的原始文本存在大量重复，以上译文已根据提供的逻辑流进行了合并和去重。）\n"
