    <html>\n<body>\n  <script>\n    document.write(\"Hello, world!\");\n  </script>\n\
    </body>\n</html>\n```\n\n正如你所见的，在编程中执行操作有多种方法——问题有多种解决方案！\n\n## 第四章末尾挑战\n\n编写一个包含以下内容的程序：\n\
