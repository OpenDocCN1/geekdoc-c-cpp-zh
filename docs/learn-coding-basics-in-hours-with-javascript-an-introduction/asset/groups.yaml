    # CHAPTER ONE WELCOME


    Welcome to The Tech Academy''s Learn Coding Basics in Hours with JavaScript!


    Now, we''re sure you want to dive into coding but there''s some information we
    are going to cover first to ensure you are well prepared. In fact, it may seem
    like a lot of reading before we get down to business but it''s worth it. Let''s
    compare this to another subject: how hard would it be to drive a car without steering
    wheel or brake pedal? So, please bear with us and take some time learning some
    fundamentals that will set you up for the adventure that ahead.


    We have attempted to define all technical terms used in this book if you come
    across any you don''t understand, look them up in The Tech Academy''s Dictionary
    (available for purchase).


    The Tech Academy is a school headquartered in Portland, Oregon, with multiple
    campuses around the world. We specialize in coding—intensive training programs
    preparing graduates for entry-level positions that can be completed in a few months.
    We also offer custom training and have published several books.


    While we would love to tell you everything about computers in this book, we are
    only going to cover the absolutely necessary. If you are interested in learning
    how computers work exactly, we recommend reading our book You Not Stupid – Computers
    Simplified, which can be purchased on Amazon.


    Our educational philosophy is to assume no prior knowledge on the part of the
    student. What this means is our content, including this book, is written for beginners.
    We operate on the assumption that you''ve never written code before and you don''t
    know basic terms—this ensures nothing is over your head and that you aren''t lost
    while reading. You''re about to experience The Tech Academy''s approach to education
    first: we are going to start our book by defining the words used in the title
    of our book!


    # CODING


    Coding refers to the act of entering instructions into computers to make them
    perform specified actions. A computer is a special type of machine Machines are
    devices (equipment with a purpose; tools) made by humans to get work done. They
    are usually made of durable materials like wood, plastic and metal. Normally they
    have some parts that move and some parts that don''t; sometimes they have no moving
    parts at all. They receive some kind of energy that they use to do their work.
    One of the traits that makes people different from animals is their ability to
    create complex machines. Usually people create machines because there is some
    work they want to do that the machine could help them with. The help the machine
    provides could be to get the work done faster, to do the work with less chance
    of errors, or to do the work continuously without the need to stop for food or
    sleep. There are other reasons people make machines, but it usually comes down
    to getting more work done in a given amount of time with errors. As time goes
    on, machines often get improved or changed to make them more effective or to respond
    to changes in the area of society where they are used. Cars, planes, telephones
    and ovens are all machines. Again, a computer is just another machine–it’s a device
    made by people to get work done.![](img/33a81fac26246d29975692e5ecda6e53_11_0.png)

    ![](img/33a81fac26246d29975692e5ecda6e53_11_1.png)

    ![](img/33a81fac26246d29975692e5ecda6e53_11_2.png)

    ![](img/33a81fac26246d29975692e5ecda6e53_11_3.png)


    Let’s take a closer look at computers.


    # CHAPTER TWO COMPUTERS


    Computers were created to do a simple thing: they take in data (information),
    change the data in some way, and send out data. That''s all.![](img/33a81fac26246d29975692e5ecda6e53_12_0.png)


    There are certain truths regarding computers:


    - 1. They are only machines. They are not people.

    - 2. They were created by people and can only act if a person tells them to. Even
    then, they can only perform actions that a person thought of ahead of time and
    built into them.


    Computers do not have a soul. They cannot think. Everything ever done by a computer
    was predetermined by humans. So-called “artificial intelligence" (computer systems
    that are able to perform actions that require human intelligence, like being able
    to recognize sounds and images), or computers that can “learn,” only have these
    abilities because we designed them that way.


    As machines, some of the characteristics of computers include the following:


    - They handle data. Data is information–such as words, symbols (something written
    that represents an amount, idea or word), pictures, etc.

    - They obey instructions (commands entered into them that perform certain tasks).

    - They automate (perform actions without human interaction) tasks that would either
    take too long for a person to do or be too boring. Keep in mind that these automatic
    actions were designed by a person.

    - They process data. “Process” means to handle something through use of established
    (and usually routine) set of procedures. When a computer displays the word “processing,”
    it is saying, “Hold on while I perform some preestablished procedures.” Processing
    refers to “taking actions with data”. Searching through words to locate typos
    would be an example of “processing data”.

