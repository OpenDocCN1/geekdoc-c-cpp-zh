    # CHAPTER EIGHTEEN

    JAVASCRIPT OBJECTS


    We talked about objects earlier. Objects are items that can be represented in
    a computer program. They are often meant to represent real-world things.


    You are surrounded by objects – your dog, the TV, etc. Objects have state

    and behavior. The state of an object would be its size, color, etc. The behavior
    of an

    object would be what the object does – the actions it takes.


    A race car could be an object. Characteristics that it could be:

    engine type, engine horsepower, wheel size, gas tank capacity, etc. Characteristics

    describe its behavior could be: accelerate, decelerate, turn right, turn left,
    etc.

    In computers, objects are parts of computer programs and share a similarity to

    real objects: they have a state and behavior.


    Let’s look at a further example: an application might work with a

    “Customer" object. Again, the state of an object would be the characteristics
    and

    attributes of the object. The behavior would be what the object could do. In our

    example, the “Customer" object could have states like “active" or "deleted."

    have behavior like "Upgrade Rewards Level" or "Add to Family Account."


    Objects are one of the first subjects you think about designing a

    program. An object is something on a computer that you can click on, interact

    with, move around, etc. It can also be something behind the scenes that is made
    up

    of data and procedures used to manipulate data. An object is what actually runs
    in the

    computer.


    As another example, let’s say you wanted to make two different types of cars

    a a computer; each car would be an object. Each object (car) would have its own

    size, shape, color, speed, distance it could travel without needing more gas,
    etc.


    # DICTIONARIES


    In computer programming, dictionaries are a specialized type of list. The

    first item is the key, and the second item is the value. Together, they are a

    "key-value pair."


    Key-value pair is abbreviated "KVP." A KVP is a set of two linked data items

    that consists of: a key (a unique identifier for some item of data), and the value
    (the

    data that is identified by the key). The key is the unique name, and the value
    is the

    content.


    Collections of KVPs (i.e., dictionaries) are often used in computer programs.'
