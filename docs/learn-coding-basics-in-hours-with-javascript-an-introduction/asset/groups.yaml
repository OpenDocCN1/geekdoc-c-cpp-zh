    你可以看到这里有两种可能的“路径”。路径是“根据决策而产生的可能行动方案”。把它想象成当你来到一个十字路口时所发生的情况。你必须决定一个行动方案——你走哪条路？这也被称为分支（branch）。


    除了最简单的计算机程序外，所有程序都需要执行相同的事情。也就是说，它们必须检查某段数据的条件，并根据该数据的条件来执行不同的计算机指令集。


    为了实现这一点，程序将使用一种称为“控制”指令的特殊计算机指令。这些指令只是告诉计算机在做决策时查看什么，然后告诉计算机对于每种可能的决策应该做什么。最基本的控制语句是“if”。它的用法如下下例所示：


    ```

    IF [要检查的条件] THEN [要执行的计算机指令分支]

    ```


    在这里，“IF”是控制语句；“THEN”是分支指令，如果控制语句为真，它将指向要执行的程序路径。


    ## 变量 (VARIABLES)


    正如我们之前介绍过的，变量是计算机程序使用的一种数据，用于跟踪在程序执行过程中可能发生变化的值。


    回顾一下，变量是计算机程序使用的一种数据，用于跟踪在程序执行过程中可能发生变化的值。这可能是类似于“刚刚批改的学生试卷分数”或“生产线线上下一辆汽车使用的油漆颜色”。


    变量是任何计算机程序至关重要的部分，因为它们使得计算机程序能够用于单一的、预定义的集合之外。你可以想象，如果“生产线线上下一辆汽车使用的油漆颜色”只能是“蓝色”，那么使用该数据的计算机程序将非常有用。如果让计算机程序能够为每辆要喷漆的汽车更改该值，其意义就小得多。


    当你在计算机程序中编写变量时，通常以如下方式编写：


    ```

    [变量名] = [变量值]

    ```


    例如，你可能会有这样的代码：


    ```

    color = "red"

    ```


    让我们来看“老师批改一叠卷子”的例子。在这里，我们可以有一个名为“分数”（Paper Grade）的变量，它每当老师批改一张卷子时就会改变一次。你还可以为卷子上的题目总数（“总题”Total
    Questions）、学生回答正确的题目数（“正确题”Correct Questions）以及卷面设置变量。


    上面的文字描述：


    - 1. 从“待批改”堆的最上方取下一张学生卷子。

    - 2. 批改卷子。

    - 3. 将分数写在卷子上。

    - 4. 如果分数是 70% 或以上，将卷子放入“通过”堆中。

    - 5. 如果分数低于 70%，将卷子放入“未通过”堆中。


    在计算机语言中，该过程可能看起来像：


    - 1. 获取下一张卷子 (Retrieve Next Paper)

    - 2. 设置 总题 = [当前卷子中的总题数]

    - 3. 批改卷子 (Grade Paper)

    - 4. 设置 正确题 = [回答正确的题目数]

    - 5. 设置 分数 >= [正确题数/总题数]

    - 6. 如果 (分数 >= 70%) 则 卷子状态 =“通过” (passed)

    - 7. 如果 (分数 < 70%) 则 卷子状态 =“未通过” (failed)


    这是一个简单的计算机程序。


    例如：5 >= 4


    这意味着“检查 5 是否大于或等于 4”。由于 5 确实大于 4，答案是“真”（true）。


    另一个例子：3 >= 6


    这意味着“检查 3 是否大于或等于 6”。答案是“假”（false）。


    最后一个例子：6 >= 6


    这意味着“检查 6 是否大于或等于 6”。答案是“真”（true）。


    >= 的反向（相反）符号是 <=，它检查符号左侧的数据是否少于/或等于符号右侧的数据。


    每当计算机运行之前列出的七步程序时，程序中的每个变量都可能有不同的值，这取决于所批改的卷子有多少道题，以及学生正确回答了其中几道。


    例如，假设卷子有 100 道题，学生正确回答了其中 82 道。程序运行后，结果如下：


    总题: 100

    正确题: 82

    分数: 82%

    卷子状态: 通过


    另一个例子，假设卷子有 50 道题，学生正确回答了其中 30 道。程序运行后，结果如下：


    总题: 50

    正确题: 30

    分数: 60%

    卷子状态: 未通过


    为了澄清变量的必要性：假设在创建计算机程序时，学校所有的卷子都有 100 道题，老师告诉程序员，让题目数量始终被假设为 100。在这种情况下，程序员就不会使用名为“总题”的变量。


    相反，他们可以让程序看起来像这样：


    - 1. 获取下一张卷子

    - 2. 批改卷子

    - 3. 设置 正确题 = [回答正确的题目数]

    - 4. 设置 分数 = [正确题数/总题数]

    - 5. 如果 (分数 >= 70%) 则 卷子状态 =“通过”

    - 6. 如果 (分数 < 70%) 则 卷子状态 =“未通过”


    现在，假设卷子有 100 道题，学生正确回答了 82 道。程序运行后，结果如下：


    总题: 100

