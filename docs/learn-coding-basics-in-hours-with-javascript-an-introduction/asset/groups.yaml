    # SUBPROGRAMS


    The main series of instructions in a program is called the "main program."


    It is sometimes valuable to create another program that can be used by

    main program as needed. This is called a subplot. It is no different from any

    other program – it is made up of the same elements (entrance point, variables,

    control and branching statements, and exit point).'
  - '[PAGE 42]


    However, a subprogram isn''t used by itself. Instead, the main program can execute,
    and the subprogram starts executing. When the subprogram is done executing, the
    main program continues on where it left off.




    This is referred to as "calling" the subprogram – that is, the main program calls
    the subprogram, starts and stops, and the main program continues on where it left
    off before calling the subprogram.


    This is useful in creating programs because the computer programmer doesn''t have
    to enter the instructions of the subprogram over and over. You only type them
    in one, and when you need that subprogram to be called by the main program, you
    only have to type in one instruction – the instruction to call the subprogram.
    This lets you reuse the instructions you entered in for the subprogram rather
    than rewriting them.


    # EXIT


    Every program must have an instruction that tells the computer that the program
    is no longer running. Much like the Entrance, the exact instruction for this varies
    based on the computer language used, but all computer languages will have this
    type of instruction.


    # SUMMARY


    The fundamental elements of any computer program are:


    +   1) An entrance point – the first instruction to be performed.


    +   2) Control and branching statements – to control what is done and in what
    order.


    +   3) Variables – changeable items, held in computer memory, for the program
    to use it as operates.


    +   4) Subprograms – repeatable sets of computer instructions that act mini-programs.
    The main program can use them as needed.


    +   5) An exit point – the last instruction to be completed, so the computer knows
    the program isn''t operating anymore.


    Next we will discuss types of programming languages.'
  - '[PAGE 43]


    # CHAPTER TEN

    TYPES OF PROGRAMMING LANGUAGES


    As we covered earlier in this book, programming languages are organized systems
    of words, phrases and symbols that let you create programs. They''re also called
    computer languages.


    There are many different types of programming languages, each of which was created
    to fill a specific purpose. Usually a language is created in order to make the
    creation of certain types of computer programs easier.


    "Markup" is the action of adding instructions to a document to control the format,
    style and appearance of the content of the document. This applies to physical
    printed documents, as well as to electronic documents that are displayed on a
    computer screen (like websites).


    A markup language is a type of programming language that is used to specify markup
    instructions for the data in a document. In other words, markup instructions aren''t
    the data in the document; they are data *about* the data in the document.


    There are several types of markup languages. Usually they were created for commonly-used
    types of documents that have exact specifications as far as their structure. Often,
    these specifications as to document structure are well-known around the world
    and available to anyone who wants to create documents of type.


    A script is a list of commands the computer performs automatically without your
    involvement. A scripting language is a computer language used to make scripts.


    Often the tasks these scripts accomplish are valuable to automate — so that the
    task steps don''t have to be entered into the computer again every time you want
    to do those tasks.


    The origin of the term is similar to its meaning in "a movie script tells actors
    what to do"; a scripting language controls the operation of a computer, giving
    it a sequence of work to do all in one. For instance, one could put a series of
    editing commands in a file, and tell an editor to run that "script" as if commands
    had been typed by hand.'
  - '[PAGE 44]


    As an example, if you wanted to make it so that every night at midnight, a list
    of all the people who signed up for your school classes was printed, you could
    use a scripting language to make a script that did this work.


    JavaScript can be used to create scripts and is a scripting language.


    There are a couple of languages used with JavaScript – let''s go over what those
    are.'
