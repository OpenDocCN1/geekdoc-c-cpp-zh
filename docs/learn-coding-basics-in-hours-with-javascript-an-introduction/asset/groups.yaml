    Now, if the user''s input does not equal -1, the interpreter will simply step
    out of the function like before. But wait; it''s going to run into "tick()" statement
    again! Exactly. Do you see how our function will continue to repeat now? That
    is, until our conditional statement is met – wherein the alert box is displayed.


    Try it out for yourself and don''t worry if you have to read the code through
    several times before it really begins to sink in!


    # FINAL CHALLENGE


    Here is your final assignment:


    Through online research, find out how to end the program (i.e, stop the countdown)
    when a user clicks the OK button on the alert box.'
