    data types like:


    - Numbers,

    - Letters,

    - Dates,

    - True or false, etc.


    When information is used in a computer, that information will have a "data type."
    This is two things:


    1. What kind of information is this?

    2. What kind of things can we do with this data?


    Different data types can be used in different ways.


    When data is stored in a computer, its type is also stored – that way the computer
    knows how to work with that particular piece of data.


    The various different things you can do with data are called operations. Not all
    data types have the same operations available to them.


    For example, a "decimal number" (0-9) is a data type. Typical operations you could
    do with decimal number data are addition, subtraction, multiplication, etc.


