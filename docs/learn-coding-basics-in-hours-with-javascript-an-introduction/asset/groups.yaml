    FUNCTIONS


    A JavaScript function is a repeatable block of code that executes certain actions
    and performs tasks. You execute a function by calling it. This is also called
    “invoking” the function.


    “Invoke” literally means to request or ask for something. In coding, it causes
    something to be carried out (performed).


    In JavaScript, a keyword identifies actions to be performed. There is a function
    keyword.


    Every spoken language has a general set of rules for how words and sentences should
    be structured. These rules are known as the syntax of that particular language.
    In programming languages, syntax serves the same purpose. Syntax is the rules
    you must follow when talking to a computer and telling it what to do. There are
    many languages you can use to program a computer. Each language has its own syntax.
    Failing to use the syntax of a particular language correctly can mean whatever
    you are designing will not work at all.


    Syntax is the arrangement of words and phrases to create well-formed sentences
    in a language. In computer science, it is the language that allows the user to
    write out the program and the rules about how to write code properly.


    The syntax for writing a JavaScript function is: the keyword, then the name, then
    parentheses.


    Functions are valuable because of code reuse — you can invoke functions over and
    over. Since functions in JavaScript contain properties (state) and methods (behavior),
    they are basically objects.


    Functions are so useful so you don’t have to keep retyping code; you can simply
    invoke the function whenever needed.


