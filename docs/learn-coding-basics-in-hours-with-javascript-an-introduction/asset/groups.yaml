- md: "\n# CHAPTER TWENTY ONE\nCOMPARISON OPERATORS\n\nIn JavaScript, we can utilize\
    \ double and triple equal signs.\n\n== (double equal sign) is a symbol used to\
    \ show that a comparison should be made. Specifically, this \"==\" symbol is an\
    \ instruction to check whether the data on the left side of the symbol is equal\
    \ to the data on the right side. The answer to this comparison is an answer of\
    \ \"true\" or \"false\".\n\nWhen the \"==\" symbol is used to check for equality,\
    \ usually it is used like this: [first item to compare] == [second item to compare]\n\
    \nFor example: (10 + 5) == 15\n\nIn this example, we are asking the computer to\
    \ check whether the result of adding 5 and 10 is equal to 15.\n\nWhen the \"==\"\
    \ symbol is used in this manner, we are asking the computer to give a response\
    \ after checking for equality. Usually, this is result in a \"true\" or \"false\"\
    \ manner. Here, the response would be \"true\", since (10 + 5) is equal to 15.\n\
    \nAnother example: (10 + 6) == 15\n\nHere, the computer respond with \"false\"\
    , since (10 + 6) is not equal to 15.\n\n=== (triple equal sign) is used to show\
    \ that a comparison should be made. Specifically, this \"==\" symbol is an instruction\
    \ to check whether the data on the left side of the symbol is equal to the data\
    \ on the right side, and that it is the same type of data (data type) as that\
    \ on the right. The answer to this comparison is an answer of \"true\" or \"false\"\
    .\n\nFor example, let's say you want to check whether two birth dates are equal.\
    \ You have two pieces of data in the computer that represent these two birth dates:\n\
    \n- 1. DateOfBirth1 is of type \"Date\", and the value of the data is \"1/1/1970.\"\
    \n- 2. DateOfBirth2 is of type \"Date\", and the value of the data is \"1/1/1970.\"\
    \n\nYou would use the \"===\" like this:\n\n```\nDateOfBirth1 === DateOfBirth2\n\
    ```\n\nThis tells the computer to check whether the two pieces of data are equal\
    \ in both VALUE and TYPE. Since they are in this case, the computer responds with\
    \ \"true\".\n\nLike all code, it's understood by writing it! Now, let's use a\
    \ separate HTML document and JavaScript document again. First, open up an HTML\
    \ file (if you don't have one, just make a new one) and write the following code:\n\
    \n```\n<!DOCTYPE html>\n<html>\n<body>\n  <script src=\"Test_1.js\">\n  </script>\n\
    </body>\n</html>\n```\n\nEnsure this file is saved as HTML.html (or .html). Then\
    \ open up your JavaScript code file (entitled Test_1.js - if you don't have this\
    \ file, create a new file) and type the following code:\n\n```\ndocument.write(10\
    \ == 10);\n```\n\nAgain, ensure this is saved as Test_1.js. Then run your HTML.html\
    \ code. It should return “true” (because 10 is equal to 10). To make it return\
    \ “false,” simply change a number in your JavaScript, such as:\n\n```\ndocument.write(5\
    \ == 10);\n```\n\nNow, let's use ===. Write the following in your JavaScript code:\n\
    \n```\nX = 0\nY = 1\ndocument.write(X === Y);\n```\n\nSave it and run the HTML\
    \ code. This returns “true” because they are both variables and both have the\
    \ value 10. You can make this false by changing it to:\n\n```\nX = 1\nY = 1\n\
    document.write(X === Y);\n```\n\nSave it and then run the HTML code – it returns\
    \ “false.” Even though are both variables, the values are different. We can also\
    \ return false by writing the following JavaScript code:\n\n```\nX = \"Ten\"\n\
    document.write(X === 10);\n```\n\nWrite a program that includes the following:\n\
    \n- Double equal signs (==) and type coercion (i.e., use a variable and a value)\
    \ and get a \"true\" result displayed.\n- Triple equal signs (===) to produce\
    \ \"true\" and \"false.\"\n\n# CHAPTER TWENTY TWO\nLOGICAL OPERATORS\n\nIn JavaScript,\
    \ there are three Boolean logical operators:\n\n- 1. AND written: &&\n- 2. OR\
    \ written: ||\n- 3. NOT written: !\n\nThe && operator determines the logic between\
    \ values and variables, such as verifying that ____ and ____ are true (both must\
    \ be true to return “true.” If one or both is false, the code will return (“false”).\n\
    \nWrite this code:\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n  <script>\n    document.write(5\
    \ > 2 && 10 > 4);\n  </script>\n</body>\n</html>\n```\n\nOur code returns “true”\
    \ because five is greater than two, and ten is greater than four. We can make\
    \ our code return “false” by changing one or both of the comparisons, such as:\n\
    \n```\n<!DOCTYPE html>\n<html>\n<body>\n  <script>\n    document.write(5 > 10\
    \ && 10 > 4);\n  </script>\n</body>\n</html>\n```\n\nWrite, save and execute this\
    \ code and it will return false.\n\nThe || (or) operator means what it sounds\
    \ like and is best described utilization. Write this code:\n\n```\n<!DOCTYPE html>\n\
    <html>\n<body>\n  <script>\n    document.write(5 > 10 || 10 > 4);\n  </script>\n\
    </body>\n</html>\n```\n\nSave and execute your code. It returned \"true\" because\
    \ while 5 is not greater 10, 10 is greater than 4. We can make it return \"false\"\
    \ with the following code since neither is true:\n\n```\n<!DOCTYPE html>\n<html>\n\
    <body>\n  <script>\n    document.write(5 > 10 || 10 > 20);\n  </script>\n</body>\n\
    </html>\n```\n\nThe ! (not) operator checks whether not something is true. If\
    \ __ is present, \"true\" will be returned. Write this code:\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n  <p id=\"Not\"></p>\n  <script>\n    document.getElementById(\"\
    Not\").innerHTML = !(5 > 10);\n  </script>\n</body>\n</html>\n```\n\nSave and\
    \ run your code. The result is \"true\" because 5 is not greater than 10. And\
    \ of course, if you want a “double negative,” write this code:\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n  <p id=\"Not\"></p>\n  <script>\n    document.getElementById(\"\
    Not\").innerHTML = !!(5 > 10);\n  </script>\n</body>\n</html>\n```\n\nSave and\
    \ execute your code. We are saying that 20 is not greater than 10.\n\n# CHAPTER\
    \ TWENTY THREE\nTERNARY OPERATORS\n\nTernary means “made up of three parts.” A\
    \ ternary operator operates on three values. It can be used to assign a value\
    \ to a variable based on a condition. This is also referred to as a conditional\
    \ operator in that it assigns a value to a variable based on a condition. The\
    \ syntax of this is:\n\nName_of_variable = (condition) ? Value_1 : Value_2\n\n\
    The ternary operator is ?. Write this code:\n\n```\n<!DOCTYPE html>\n<html>\n\
    <body>\n  <script>\n    document.write(Bigger = (5 > 1) ? \"The number on the\
    \ left is bigger.\" : \"The number on the right is bigger.\");\n  </script>\n\
    </body>\n</html>\n```\n\nSave and execute your code. In this code, we said, \"\
    If it is true that 5 is bigger than 1, display The number on the left is bigger.'\
    \ If you change the numbers or flip the symbol to <, you can change the outcome\
    \ of your code.\n\nInput is a command that has the user data. It allows users\
    \ to type in information within your program.\n\nBelow is something more elaborate\
    \ that we can do with ternary operators:\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n\
    \  <p>Riders must be at least 52 centimeters tall to ride.</p>\n  <input id=\"\
    Height\" value=\"52\" />\n  <button onclick=\"Ride_Function()\">Click here</button>\n\
    \  <p id=\"Ride\"></p>\n  <script>\n    function Ride_Function() {\n      var\
    \ Height = document.getElementById(\"Height\").value;\n      var Can_ride = (Height\
    \ < 52) ? \"You are too short;\" : \"You are tall enough;\";\n      document.getElementById(\"\
    Ride\").innerHTML = Can_ride + \" to ride.\";\n    }\n  </script>\n</body>\n</html>\n\
    ```\n\nSave and execute your code.\n\n# END OF CHAPTER CHALLENGE\n\nWrite a program\
    \ that includes the following:\n\n- A ternary operator, and\n- The input command.\n\
    \n# CHAPTER TWENTY FOUR\nOBJECT-ORIENTED PROGRAMMING\n\nAs we covered earlier,\
    \ objects are items within computer programs that have both state and behavior.\
    \ The state of an object could be the weight, color, height, etc. While the behavior\
    \ of an object would be what the object does – the actions it takes – such as\
    \ jump, run, sit, etc.\n\nObject-oriented is an approach to programming that focuses\
    \ on objects and data (as opposed to consecutive actions or some other approach).\n\
    \nYou create objects by creating what are called “classes,” using one of the many\
    \ specialized computer programming languages. Classes are used to describe one\
    \ or more objects. This would be created by creating (or “declaring”) a class\
    \ called a “Customer” class. It is important to know that when you first create\
    \ this class, you are describing the POTENTIAL characteristics and behavior of\
    \ TYPE thing. You will still need to create an actual one of those things. That\
    \ process is called “creating an INSTANCE” of the class, where “instance” means\
    \ “an actual one” of the things described when you declared the class. When you\
    \ do this, the data that makes up the object is kept in the computer’s memory.\n\
    \nFor example, in a computer program designed to track pay records for all employees,\
    \ you could have a class called “Employee.” Each program element representing\
    \ an actual employee (John Smith, Sally Jackson, etc.) would be an instance of\
    \ the “Employee” class. You would have one instance for each employee you entered\
    \ into computer. Each time you created an “employee” object, the computer would\
    \ first find the “employee” class, then use the definition of that class in creating\
    \ that particular “employee” instance using the data for the actual employee.\n\
    \n# CLASS OBJECTS\n\n![](img/33a81fac26246d29975692e5ecda6e53_97_0.png)\n"
  mdcn: "\n\n# 第二十一章\n比较运算符\n\n在 JavaScript 中，我们可以利用双等号和三等号。\n\n==（双等号）是一个符号，用于表示应该进行比较的符号。具体来说，这个\
    \ \"==\" 符号是一个指令，用于检查符号左侧的数据与右侧的数据是否相等。该比较的结果是“true”（真）或“false”（假）。\n\n当使用 \"\
    ==\" 符号来检查相等性时，通常用法如下：[第一个要比较的项] == [第二个要比较的项]\n\n例如：(10 + 5) == 15\n\n在这个示例中，我们是在要求计算机检查\
    \ 5 和 10 相加的结果是否等于 15。\n\n当像这样使用 \"==\" 符号时，我们要求计算机在检查相等性后给出响应。通常，结果会以“true”或“false”的形式呈现。在这里，响应将是“true”，因为\
    \ (10 + 5) 等于 15。\n\n另一个示例：(10 + 6) == 15\n\n在这里，计算机响应为“false”，因为 (10 + 6) 不等于\
    \ 15。\n\n===（三等号）用于表示应该进行比较的符号。具体来说，这个 \"===\" 符号是一个指令，用于检查符号左侧的数据与右侧的数据是否相等，并且它们是否为相同类型的数据（数据类型）。该比较的结果同样是“true”或“false”。\n\
    \n例如，假设你想检查两个出生日期是否相等。你在计算机中有两段数据代表这两个出生日期：\n\n- 1. DateOfBirth1 的类型为 \"Date\"\
    ，数据值为 \"1/1/1970。\"\n- 2. DateOfBirth2 的类型为 \"Date\"，数据值为 \"1/1/1970。\"\n\n你会这样使用\
    \ \"===\"：\n\n```\nDateOfBirth1 === DateOfBirth2\n```\n\n这告诉计算机检查这两段数据在**值**（VALUE）和**类型**（TYPE）上是否相等。在这种情况下它们是相等，计算机响应为“true”。\n\
    \n就像所有代码一样，通过编写它们就能被理解了！现在，让我们再次使用独立的 HTML 文档和 JavaScript 文档。首先，打开一个 HTML 文件（如果没有就新建一个），并编写以下代码：\n\
    \n```\n<!DOCTYPE html>\n<html>\n<body>\n  <script src=\"Test_1.js\">\n  </script>\n\
    </body>\n</html>\n```\n\n确保此文件保存为 HTML.html（或 .html）。然后打开你的 JavaScript 代码文件（命名为\
    \ Test_1.js - 如果没有此文件就创建一个），并输入以下代码：\n\n```\ndocument.write(10 == 10);\n```\n\n\
    再次确保将其保存为 Test_1.js。然后运行你的 HTML.html 代码。它应该返回“true”（因为 10 等于 10）。要让它返回“false”，只需更改你\
    \ JavaScript 中的其中一个数字，例如：\n\n```\ndocument.write(5 == 10);\n```\n\n现在，让我们使用 ===。在你的\
    \ JavaScript 代码中编写以下内容：\n\n```\nX = 0\nY = 1\ndocument.write(X === Y);\n```\n\n\
    保存并运行 HTML 代码。这返回了“true”，因为它们都是变量且值都是 10。你可以通过将其更改来使其变为假：\n\n```\nX = 1\nY = 1\n\
    document.write(X === Y);\n```\n\n保存并运行 HTML 代码 – 它返回了“false”。尽管它们都是变量，但值不同。我们也可以通过编写以下\
    \ JavaScript 代码返回假：\n\n```\nX = \"Ten\"\ndocument.write(X === 10);\n```\n\n编写包含以下内容的程序：\n\
    \n- 使用双等号 (==) 和类型转换（即使用变量和一个值）并得到 \"true\" 结果。\n- 使用三等号 (===) 产生 \"true\" 和 \"\
    false\"。\n\n# 第二十二章章\n逻辑运算符\n\n在 JavaScript 中，有三种逻辑运算符：\n\n- 1. AND（与）：&&\n- 2.\
    \ OR（或）：||\n- 3. NOT（非）：!\n\n&& 运算符确定值和变量之间的逻辑关系，例如只有当 ____ 和 ____ 都为真时返回“true”。如果其中一个或两个为假，代码将返回（“false”）。编写这段代码：\n\
    \n```\n<!DOCTYPE html>\n<html>\n<body>\n  <script>\n    document.write(5 > 2 &&\
    \ 10 > 4);\n  </script>\n</body>\n</html>\n```\n\n我们的代码返回了“true”，因为 5 大于 2 且 10\
    \ 大于 4。我们可以通过更改比较项中的一个或两个让代码返回“false”，例如：\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n\
    \  <script>\n    document.write(5 > 6 && 10 > 4);\n  </script>\n</body>\n</html>\n\
    ```\n\n编写、保存并运行这段代码，它将返回 false。\n\n||（或）运算符的意思听起来是 ____ 的最佳描述。编写这段代码：\n\n```\n\
    <!DOCTYPE html>\n<html>\n<body>\n  <script>\n    document.write(5 > 6 || 10 >\
    \ 4);\n  </script>\n</body>\n</html>\n```\n\n保存并执行你的代码。它返回了 \"true\"，虽然 5 不大于\
    \ 6， 但 10 大于 4。我们可以通过以下代码使其返回 \"false\"，因为两者都不为真：\n\n```\n<!DOCTYPE html>\n<html>\n\
    <body>\n  <script>\n    document.write(5 > 10 || 10 > 20);\n  </script>\n</body>\n\
    </html>\n```\n\n!（非）运算符检查某事是否为真。如果存在 __，将返回 \"true\"。编写这段代码：\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n  <p id=\"Not\"></p>\n  <script>\n    document.getElementById(\"\
    Not\").innerHTML = !(5 > 10);\n  </script>\n</body>\n</html>\n```\n\n保存并运行你的代码。结果是\
    \ \"true\"，因为 5 不大于 10。当然，如果你想要“双重否定”，编写这段代码：\n\n```\n<!DOCTYPE html>\n<html>\n\
    <body>\n  <p id=\"Not\"></p>\n  <script>\n    document.getElementById(\"Not\"\
    ).innerHTML = !!(5 > 10);\n  </script>\n</body>\n</html>\n```\n\n保存并执行你的代码。我们说\
    \ 20 不大于 10。\n\n# 第十三章章\n三元运算符\n\n三元意味着“由三部分组成”。三元运算符对三个值进行操作。它可以根据条件为变量赋值。这也被称为条件运算符，因为它根据条件给变量赋值。其语法为：\n\
    \n变量名 = (条件) ? 值_1 : 值_2\n\n三元运算符是 ?。编写这段代码：\n\n```\n<!DOCTYPE html>\n<html>\n\
    <body>\n  <script>\n    document.write(Bigger = (5 > 1) ? \"左边的数字更大。\" : \"右边的数字更大.\"\
    );\n  </script>\n</body>\n</html>\n```\n\n保存并执行你的代码。在这段代码中，我们说：“如果 5 大于 1 是真的，显示‘左边的数字更大’。”如果你更改数字或将符号改为\
    \ <，你就可以更改代码的结果。\n\nInput 是包含用户数据的命令。它允许用户在程序中输入信息。\n\n以下是使用三元运算符可以完成的更复杂的任务：\n\
    \n```\n<!DOCTYPE html>\n<html>\n<body>\n  <p>乘客身高至少达到 52 厘米才能乘坐。</p>\n  <input\
    \ id=\"Height\" value=\"52\" />\n  <button onclick=\"Ride_Function()\">点击这里</button>\n\
    \  <p id=\"Ride\"></p>\n  <script>\n    function Ride_Function() {\n      var\
    \ Height = document.getElementById(\"Height\").value;\n      var Can_ride = (Height\
    \ < 52) ? \"你太矮了;\" : \"你身高足够了;\";\n      document.getElementById(\"Ride\").innerHTML\
    \ = Can_ride + \" 乘坐.\";\n    }\n  </script>\n</body>\n</html>\n```\n\n保存并执行你的代码。\n\
    \n# 本章挑战\n\n编写一个包含以下内容的程序：\n\n- 三元运算符，以及\n- input 命令。\n\n# 第四章\n面向对象编程\n\n正如我们之前介绍过的，对象是计算机程序中同时具有状态和行为的项。对象的状态可以是重量、颜色、高度等。而对象的行为将对象所做的事情——它采取的动作，如跳跃、跑步、坐等。\n\
