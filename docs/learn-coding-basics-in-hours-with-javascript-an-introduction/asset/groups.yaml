    \n因此，“customer”类的新实例（在这里处是变量“cust”）将具有以下属性：\n\n```\nFullName = \"Brenda Smith\"\
    \nActive = true;\n```\n\n注意：上面的代码仅作为示例，并不用于执行。我们很快就会创建一个构造函数。\n\n# 关键字\n\n正如之前讨论的，JavaScript\
    \ 关键字用于标识要执行的操作。例如，`var` 是我们用于给变量赋值的关键字。\n\n关键字的一个重要方面是，它们不能用于命名变量或函数。例如：你不能说\
    \ `var var = \"variable\"`。\n\n另一种类型的关键字是 `new` 关键字，用于创建新对象。\n\n我们还有 `this` 关键字。`this`\
    \ 关键字指示代码的所有者。当在对象内部使用时，`this` 的值是该对象。当与函数使用时，`this` 的值是拥有该函数的对象。\n\n我们现在涵盖了许多关于构造函数、`new`\
    \ 关键字、`this` 关键字等的更多信息。让我们把这些用起来吧。\n\n在 HTML 文件中编写以下代码：\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n  <p id=\"Keywords_and_Constructors\"></p>\n  <script>\n\
    \  function Vehicle(Make, Model, Year, Color) {\n    this.VehicleMake = Make;\n\
    \    this.VehicleModel = Model;\n    this.VehicleYear = Year;\n    this.VehicleColor\
    \ = Color;\n  }\n  var Jack = new Vehicle(\"Dodge\", \"Viper\", 2021, \"Red\"\
    );\n  var Emily = new Vehicle(\"Jeep\", \"Trail Hawk\", 2020, \"White and Blue\"\
    );\n  var Erik = new Vehicle(\"Ford\", \"Pinto\", 1971, \"Mustard\");\n  document.getElementById(\"\
    Keywords and Constructors\").innerHTML = \n    \"Erik drives a \" + Erik.VehicleColor\
    \ + \"-colored \" + Erik.VehicleModel +\n    \" manufactured in \" + Erik.VehicleYear\
    \ + \";\";\n  </script>\n</body>\n</html>\n```\n\n保存并执行你的代码。这应该打印出以下字符串：\n\nErik\
    \ drives a Mustard-colored Pinto manufactured in 1971\n\n让我们检查一下代码。函数 \"Vehicle()\"\
    \ 是一个对象构造函数。\n\n# 保留字\n\n在 JavaScript 中，某些单词你不能作为变量、标签（分配给代码段的名称）或函数使用。保留字的示例有：\"\
    true\" 和 \"false\"。\n\n如果你感兴趣，这里有一个 JavaScript 保留字列表的链接：\n\nw3schools.com/js/js/reserved.asp\n\
    \n你不能使用这些单词的原因是它们已经有了其他含义——它们被保留给 JavaScript 使用。\n\n# 章节结束挑战\n\n编写一个包含以下内容的程序：\n\
    \n- 一个类，\n- 一个构造函数，\n- `new` 关键字，以及\n- `this` 关键字。\n\n# 第二十五章\n## 标识符与字面量\n\n\
    “标识符”是某物的名称。在 JavaScript 中，标识符是变量、函数、关键字和标签的名称。在以下代码中，“X”就是标识符：\n\n```\nvar X\
    \ = 10\n```\n\n与标识符相反，字面量是源代码中表示某个值的内容。源代码是程序设计者最初编写（即用某种编程语言输入到计算机）的计算机程序版本。通常，当程序员完成工作后，代码会被编译或解释。\n\
    \n字面量是直接用在代码中使用的值。例如，在 `var X = 10` 中，10 是一个数字字面量。在 `var name = \"Alice\"` 中，“Alice\"\
    \ 是一个字符串字面量。\n\n字面量可以是：\n- 数字（例如 10, 3.14）\n- 字符串（例如 \"Hello\", 'World'）\n- 布尔值（例如\
    \ true, false）\n- Null 和 undefined\n\n理解标识符和字面量之间的区别是编写 JavaScript 代码的基础。标识符是容器容器，而字面量是放在它们内部的内容。\n\
    \n在下一节中，我们将更详细地探讨 JavaScript 中不同类型的字面量以及如何在你的代码中有效地使用它们。\n\n"
