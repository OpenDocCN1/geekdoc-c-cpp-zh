    # 第六章

    互联网与万维网


    JavaScript 是一种可以在大多数计算机上运行的编程语言。它由一位名叫 Brendan Eich（Brendan Eich）的美国人于1995年创建，在制作网站方面特别有用。


    万维网（缩写“www”或“web”）是链接电子文档的集合，并组织成称为网站的组。


    网站由一个或多个独立的网页组成，其中“页面”是一个组织良好的独立文档，包含文本、图像、视频和其他元素。


    ![](img/33a81fac26246d29975692e5ecda6e53_20_0.png)


    # 互联网


    网络是指两个或多个计算机相互连接的系统。计算机可以通过电缆（即有线连接）或通过无线方式（通过空气）连接。“网络”（Network）是用于描述协作事物之间连接的词，在计算机领域有许多不同的用法。信息可以通过网络在计算机之间进行共享。


    ![](img/33a81fac26246d29975692e5ecda6e53_20_1.png)


    互联网（Internet）是“interconnected”（互连）和“network”（网络）两个词的结合。


    互联网是全球许多计算机的互连网络。它是现存最大的网络，允许计算机相互传递数据。


    连接到互联网的计算机之间可以往返发送不同类型的数据——例如电子消息、电子文档、医疗记录等。


    ![](img/33a81fac26246d29975692e5ecda6e53_21_0.png)


    除了指此网络上计算机之间的连接外，互联网还指用于计算机间传输数据的一系列协议（协议）。


    “协议”（protocol）是一种正式程序。在技术中，它是对特定类型信息如何格式化和处理的正式描述。基本上，它是所有工作人员共同遵守的一项约定。协议通常在文档中描述，并且非常精确。


    协议具有价值的一个例子是：如果医疗行业的各种组织在工作时需要在计算机之间传输数据，那么关于信息的精确格式、如何保持数据安全等，就是非常重要的。在互联网上为了传输不同类型的数据，创建了一个或多个协议。这些这些协议会导致错误。


    总结：互联网是全球许多计算机的互连网络，是一套用于计算机间传输不同类型数据的约定或协议。


    # 互联网 VS 万维网


    那么，互联网和万维网之间的区别是什么？互联网是跨互联网传输数据的硬件和协议，而万维网是被称为网页的链接文档集合。


    互联网是基础设施（物理框架），而万维网是传输和显示的代码。


    ![](img/33a81fac26246d29975692e5ecda6e53_22_0.png)


    动态（Dynamic）指的是需要时立即发生的动作，而不是预先发生的。动态的反面是“静态”（static），它字面意思是“不变的”。静态意味着在要求之前数据已经准备好了——不会随时间或情况而改变。


    在编码中，动态意味着计算机在你要求时立即处理请求。


    动态与互联网有关，描述网页在查看时内容的变化。


    这些是鼠标操作：


    例如，网站上的动态图像可以在当你悬停在上面时产生影响（移动或变化）（悬停在特定对象上）。


    # 编程


    编程（通过编写代码创建计算机程序的活动）是一项了不起的事情，因为它是几乎适用于所有行业的技能之一。


    是的，创建软件的公司绝对利用编码——但如果你想的话，大多数行业都利用技术（软件、数据库等）。因此，编码人员对于任何行业（建筑、餐饮、零售、交通等）都是宝贵的资产。


    有很多编程语言，而且技术在不断变化。整个内容可能会非常复杂，但在整个技术领域都有基础知识。


    现在，让我们讨论什么是 JavaScript。


    # 第七章

    JavaScript


    JavaScript 是一种非常好的编码入门语言，并位列世界上最流行的编程语言。


    JavaScript 的主要用途之一是让网站更动态（内容根据用户操作或其他因素变化，而不是在外观和内容上保持静态）。


    JavaScript 还可以让程序和网页更具交互性，例如让视频在用户鼠标移动时就开始播放。


    JavaScript 还有许多其他用途；它被用于创建不同类型的计算机程序。


    ![](img/33a81fac26246d29975692e5ecda6e53_24_0.png)


    从一开始，那个解释就说明了我们为什么要写这本书。那个定义完全不通。所以，为了理解那里所说的内容，让我们剖析一下定义。


    # 高级


    我们之前讨论的机器语言（1 和 0）被认为是“低级语言”。这是因为它直接代表了计算机硬件中使用的开启或关闭状态，直接代表了计算机的指令和计算机操作的数据。


    低级语言的反面是高级语言——代码以更易读和易写的方式编写，因为它程度上类似于英语，例如：


    Print "Hello";


    在这里，你正在告诉计算机在屏幕上写出 Hello 这个单词。


    所有最流行的编程语言都是高级语言——意味着，它们使用英语字母、符号和单词。


    # 无类型


    数据就是信息。


    计算机程序需要不同类型的数据。这些数据类型类型如：


    - 数字，

    - 字母，

    - 日期，

    - 真或假，等。


    当信息在计算机中使用时，该信息将有一个“数据类型”。这包含两点：


    1. 这是什么信息？

    2. 我们能用这些数据做什么？


    不同的数据类型可以用不同的方式使用。


    当数据存储在计算机中时，它的类型也会被存储——这样计算机就知道了如何处理该特定数据。


    对数据执行的各种不同操作被称为“操作”（operations）。并不是所有数据类型都具有相同的操作。


    例如，“小数”（0-9）是一种数据类型。你可以对小数数据执行的典型操作是加法、减法、乘法等。


    文本


    在创建计算机程序时，计算机跟踪的每条数据都是某种数据类型。例如，数据 342.98 是“小数”类型的数据。数据“casserole”（砂菜）是“文本”类型的数据。


    A B C 1 2 3 TRUE/FALSE 3.14

    （数据类型的示例）


    '
