    \ id=\"seconds\" value=\"\" />\n  <button onclick=\"countdown()\">Click here</button>\n\
    \  <p id=\"timer\"></p>\n  <script>\n    function countdown() {\n      var seconds\
    \ = document.getElementById(\"seconds\").value;\n\n      function tick() {\n \
    \       seconds = seconds - 1;\n        timer.innerHTML = seconds;\n        setTimeout(tick,\
    \ 1000);\n        if(seconds == -1) {\n          alert(\"Time's up!\");\n    \
    \    }\n      }\n      tick();\n    }\n  </script>\n  </body>\n</html>\n```\n\n\
    你会立即注意到，在我们的 JavaScript 代码中有两个独立的函数。事实上，“tick\" 函数就位于 \"countdown\" 函数内部！提醒一下，这被称为“嵌套函数”。\n\
    \n`countdown` 函数只被调用一次，而且它只做两件事：\n\n- 1. 它将一个名为 \"seconds\" 的变量设置为用户输入的值。\n- 2.\
    \ 它创建并运行 `tick` 函数。\n\n另一方面，`tick` 函数有几个步骤要执行，并且最终会重复多次。\n\n在 `countdown` 函数接收到用户的输入值后，`tick`\
    \ 函数立即开始安排它的指令。需要注意的是，`tick` 函数实际上还没有被执行。它只是在让它的指令为人知，以防以后真的需要使用它。一旦解释器读取 `tick`\
    \ 函数，它就会发现并看到 `tick()` 指令。看到这个函数后，解释器知道要立即回到 `tick` 函数。然而，这一次，它不再仅仅是读取函数，而是实际上要运行该函数。\n\
    \n看看 `tick` 函数内部的变量 \"seconds\"。它获取了 `countdown` 中 \"seconds\" 的值，并将其减 1。这个值之所以需要减去\
    \ 1 的原因是，此函数每次运行都只持续一秒钟（正如我们将看到的），我们需要在每秒过去时将 \"seconds\" 变量减去 1。\n\n在 `tick`\
    \ 函数第一次运行从用户输入中减去 1 之后，同一个被减去 1 的数字将显示给用户看。这是因为 `timer.innerHTML` 被赋值给了用户。记得我们在其中一个\
    \ HTML 标签中放入了 \"id=timer\" 吗？它现在保存着我们分配的这个数字。\n\n语句 `setTimeout(tick, 1000);`\
    \ 仅仅意味着程序暂停 1,000 毫秒（即 1 秒）。这很重要，因为这个函数可能会重复多次——而且每重复一次，它都必须持续恰好一秒钟。\n\n我们这里有一个条件语句。它告诉我们的是，如果用户的输入一直减到\
    \ -1，就停止一切并运行警报框。你可能在问自己，为什么是 -1 而不是 0？原因是解释器看到了 -1，但它还没有将其显示给用户。用户看到的仍然是0，因此在显示\
    \ -1 之前，警报框就会出现，防止任何其他代码运行。顺便提一下，如果用户点击警报框上的确定按钮，他/她将看到计时器继续倒数到负数。\n\n现在，如果用户的输入不等于\
    \ -1，解释器将像以前一样跳出函数。但等；它会再次遇到 `tick()` 语句！没错。你看到我们的函数现在将继续重复了吗？也就是说，直到我们的条件语句被满足——即显示警报框。\n\
    \n你自己试一试，如果你必须反复阅读几次代码才能让它真正理解，也不要担心！\n\n# 终极挑战\n\n这是你的最后一项任务：\n\n通过在线研究，找出当用户点击警报框上的确定按钮时，如何结束程序（即停止倒计时）。\n\
