- md: "\n# CONSTRUCTORS\n\nA \"constructor\" is a special part of a class (a template\
    \ for defining an object item with state and behavior).\n\nThe constructor is\
    \ a special part of the class that describes the default state of any new instance\
    \ of the class that gets created. In other words, it gives default values for\
    \ the properties of the class.\n\nFor example, let's say you had a class called\
    \ \"Customer.\" The computer code to create the \"customer\" class might look\
    \ something like this:\n\n```\nclass Customer\n{\n    string FullName;\n    Boolean\
    \ Active;\n}\n```\n\nNow let's say that whenever you created a new instance of\
    \ the \"customer\" class, you wanted it to be an active customer – in other words,\
    \ you wanted the property \"Active\" to be set to \"true\".\n\nTo do this, you\
    \ would make a constructor for the \"customer\" class. It would be a small subparagraph,\
    \ inside the class, that would be used every time an instance of the \"customer\"\
    \ class was created.\n\nThe constructor might look something like this:\n\n```\n\
    Customer(string name) {\n    Fullname = name;\n    Active = true;\n}\n```\n\n\
    The entire class would look like this:\n\n```\nclass Customer\n{\n    string FullName;\n\
    \    Boolean Active;\n    Customer(string name) {\n        Fullname = name;\n\
    \        Active = true;\n    }\n}\n```\n\nThe constructor would be used by asking\
    \ for an instance of the “customer” class to be created and passing along the\
    \ desired name of the customer.\n\nThe call to create the instance of the class\
    \ name would look like this:\n\n```\nCustomer cust = new Customer(\"Brenda Smith\"\
    );\n```\n\nThis creates a new instance of the “customer” class using the constructor\
    \ inside the class. The constructor uses the string “Brenda Smith” that it was\
    \ given to set the value of the property “FullName” and uses the instruction in\
    \ the constructor to set the property “Active” to “true”.\n\nThe new instance\
    \ of the “customer” class, which is the variable “cust” here, will, therefore,\
    \ have the properties:\n\n```\nFullName = \"Brenda Smith\"\nActive = true;\n```\n\
    \nNote: The above code is given as an example and is not meant to be executed.\
    \ We will create a constructor soon.\n\n# KEYWORDS\n\nAs discussed earlier, JavaScript\
    \ keywords identify actions to be performed. For example, var is a keyword we\
    \ use to assign variables.\n\nAn important aspect to keywords is that they cannot\
    \ be used to name variables or functions. For example: you can’t say var var =\
    \ “variable\".\n\nAnother type of keyword is the “new” keyword, which is used\
    \ to create new objects.\n\nWe also have the “this” keyword. The “this” keyword\
    \ indicates the object that is the owner of the code. When used within an object,\
    \ the value of “this” is the object. When used with a function, the value of “this”\
    \ is the object that possesses the function.\n\nWe now just covered a lot of information\
    \ about constructors, the “new” keyword, the “this” keyword, and more. Let’s put\
    \ this all to use.\n\nWrite the following code within an HTML file:\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n  <p id=\"Keywords_and_Constructors\"></p>\n\
    \  <script>\n  function Vehicle(Make, Model, Year, Color) {\n    this.VehicleMake\
    \ = Make;\n    this.VehicleModel = Model;\n    this.VehicleYear = Year;\n    this.VehicleColor\
    \ = Color;\n  }\n  var Jack = new Vehicle(\"Dodge\", \"Viper\", 2021, \"Red\"\
    );\n  var Emily = new Vehicle(\"Jeep\", \"Trail Hawk\", 2020, \"White and Blue\"\
    );\n  var Erik = new Vehicle(\"Ford\", \"Pinto\", 1971, \"Mustard\");\n  document.getElementById(\"\
    Keywords and Constructors\").innerHTML = \n    \"Erik drives a \" + Erik.VehicleColor\
    \ + \"-colored \" + Erik.VehicleModel +\n    \" manufactured in \" + Erik.VehicleYear\
    \ + \";\";\n  </script>\n</body>\n</html>\n```\n\nSave and execute your code.\
    \ This should print the following string:\n\nErik drives a Mustard-colored Pinto\
    \ manufactured in 1971\n\nLet's inspect our code. The function \"Vehicle()\" is\
    \ an object constructor.\n\n# RESERVED WORDS\n\nIn JavaScript, there are certain\
    \ words you can't use as variables, labels (names assigned to sections of code),\
    \ or functions. Examples of reserved words are: \"true\" and \"false\".\n\nIf\
    \ you are interested, here is a link to a list of the reserved words in JavaScript:\n\
    \nw3schools.com/js/js/reserved.asp\n\nThe reason you cannot use these words is\
    \ that they already mean something else – they are reserved for JavaScript.\n\n\
    # END OF CHAPTER CHALLENGE\n\nWrite a program that includes the following:\n\n\
    - A class,\n- A constructor,\n- The \"new\" keyword, and\n- The \"this\" keyword.\n\
    \n# CHAPTER TWENTY FIVE\n## IDENTIFIERS AND LITERALS\n\nAn “identifier” is a name\
    \ for something. In JavaScript, identifiers are the names of variables, functions,\
    \ keywords, and labels. In the following code, “X” is the identifier:\n\n```\n\
    var X = 10\n```\n\nIn contrast to an identifier, a literal is something that represents\
    \ a value within source code. Source code is the version of a computer program\
    \ as it is originally written (i.e., typed into a computer in some programming\
    \ language) by the designer of the program. Normally, when the programmer is done,\
    \ the code is compiled or interpreted.\n\nLiterals are the values used directly\
    \ in the code. For example, in `var X = 10`, 10 is a numeric literal. In `var\
    \ name = \"Alice\"`, \"Alice\" is a string literal.\n\nLiterals can be:\n- Numbers\
    \ (e.g., 10, 3.14)\n- Strings (e.g., \"Hello\", 'World')\n- Booleans (e.g., true,\
    \ false)\n- Null and undefined\n\nUnderstanding the difference between identifiers\
    \ and literals is fundamental to writing JavaScript code. Identifiers are the\
    \ containers, while literals are the content placed inside them.\n\nIn the next\
    \ section, we will explore different types of literals in JavaScript in more detail\
    \ and how to use them effectively in your code.\n"
  mdcn: "\n\n# 构造函数\n\n“构造函数”是类的一个特殊部分（用于定义具有状态和行为的对象的模板）。\n\n构造函数是类中的一个特殊部分，用于描述新创建的任何类实例的默认状态。换句话说，它为类的属性提供了默认值。\n\
