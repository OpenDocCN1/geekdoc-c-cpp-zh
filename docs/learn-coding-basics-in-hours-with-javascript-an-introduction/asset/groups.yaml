  mdcn: "\n例如，以数字三千四百二十五为例。正常写法为：3425 —— 使用浮点计数法表示，它可以是：$3.425 \\times 10^3$。由于 $10^3$\
    \ 等于 1000，这意味着 $3.425 \\times 1000 = 3425$。\n\n“float”（浮点数）是计算机的一种数据类型。“float”类型用于存储具有高精度的数字。它主要用于数学目的。\n\
    \n假设我们想用更短的方式来写 100,000。我们可以写成 10E 4。\n\n10E 4 表示 $10 \\times 10^4$（10 乘以次方）。\n\
    \n在 JavaScript 中，所有数字都是浮点数，浮点数的限制是 $1.797693134862315\\times 10^{308}$（这意味着 JavaScript\
    \ 可以处理大大的浮点数）。任何大于 $1.797693134862315\\times 10^{308}$ 的数字都被视为“无穷大”（infinity）。请注意，这是一个巨大的数字，远超大多数计算器的处理能力，并且需要大量的行数才能显示。\n\
    \n## 其他数字\n\n在 JavaScript 中，有三个被视为数字但实际行为方式并不相同的唯一值。它们是：\n\n- NaN（“Not a Number”的缩写，意为“不是数字”）\n\
    - Infinity（正无穷）\n- -Infinity（负无穷）\n\n理解这些内容的最好方法让它们运行。这里有一个例子：在一个*新*的 Notepad++\
    \ 文档中，编写以下代码：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <p id=\"Not_a_Number\"\
    ></p>\n  <script>\n    document.getElementById(\"Not_a_Number\").innerHTML = 0/0;\n\
    \  </script>\n</body>\n</html>\n```\n\n将你的文件保存为 .html 文档，并任取一个名称。执行你的代码。结果是 NaN，因为你不能将\
    \ 0 除以 0。\n\n我们可以通过 `isNaN()` 函数来检查某个内容是否为数字。将你的代码修改为：\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n  <p id=\"Not_a_Number\"></p>\n  <script>\n    document.getElementById('Not_a_Number').innerHTML\
    \ = NaN('Hello');\n  </script>\n</body>\n</html>\n```\n\n保存并运行你的代码。如你所见，结果是 \"\
    true\"，因为 \"Hello World\" 不是数字。让我们将代码修改为：\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n  <p id=\"Not_a_Number\"></p>\n  <script>\n    document.getElementById('Not_a_Number').innerHTML\
    \ = NaN('007');\n  </script>\n</body>\n</html>\n```\n\n注意：唯一的区别在于我们将 \"Hello World\"\
    \ 改为了 \"007\"。保存并运行你的代码。现在结果是 false，因为 007 是一个数字。\n\n现在，删除你的代码并编写以下内容：\n\n```html\n\
    <!DOCTYPE HTML>\n<html>\n<body>\n  <p id=\"Infinity\"></p>\n  <script>\n    document.getElementById('Infinity').innerHTML\
    \ = 1.797693148623157E+309;\n  </script>\n</body>\n</html>\n```\n\n保存并执行你的代码。你可以看到结果\
    \ \"infinity\"。这是因为我们输入了一个大于 1.797693148623157E+308 的数字。\n\n要查看 -Infinity，只需将你的代码更改为小于\
    \ -1.7976931348623157E+308 的数字，如下面的数字：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    \  <p id=\"Infinity\"></p>\n  <script>\n    document.getElementById(\"Infinity\"\
    ).innerHTML = -1.7976931348623157E+309;\n  </script>\n</body>\n</html>\n```\n\n\
    ## 本章挑战\n\n创建一个你自己的程序，返回以下内容：\n\n- Infinity，\n- -Infinity，以及\n- NaN。\n\n## 第二十章\n\
    ### 布尔逻辑\n\n“逻辑”指的是合乎逻辑的操作、行为和思考。在论论计算机时，逻辑是计算机执行某些任务时形成的基础规则。计算机逻辑是计算机在做决策时遵循的指南。\n\
    \n逻辑运算符如 \"and\"（与）、\"or\"（或）和 \"not\"（非）用于判断表达式是真是假。\n\nGeorge Bool 是一位英国数学家，他开发了布尔逻辑。“布尔逻辑”是逻辑的形式，决策唯一的可能结果是“true”（真）和“false”（假）。计算或决策中不存在任何模糊或“几乎”的答案——非黑即白，没有灰色。\n\
    \n![](img/33a81fac26246d29975692e5ecda6e53_84_0.png)\n\n布尔逻辑的一个例子是仅用“是”或“否”回答问题。\n\
    \n布尔逻辑对于数字计算机的构建和运行尤为重要，因为创建一个操作结果为“true”或“false”的机器相对容易。\n\n这是通过比较两个或多个项目实现的——这些项目只能是“true”或“false”的。\n\
    \n此类布尔比较的一些常见例子有 \"AND”（与）和 \"OR”（或）。\n\n在名为 \"AND\" 的布尔比较中，只有当所有相关的比较均为真时，结果才为真。\n\
    \n让我们看一些例子来展示它是如何工作的：\n\n在下面的 AND 比较中，结果为真：\n\n5 大于 3 且 10 大于 5\n\n让我们将其拆解。\n\n\
    这里发生了三个比较：\n\n- 1. 比较 5 和 3，看 5 是否大于 3（5 大于 3 吗？）\n- 2. 比较 10 和 5，看 10 是否大于 5（10\
    \ 大于 5 吗）？\n- 3. 使用布尔比较 \"AND\" 比较那两个比较的结果。\n\n在接下来的 AND 比较中，结果为真：\n\n5 大于 3 且\
    \ 10 大于 5\n\n让我们将其拆解。\n\n这里发生了三个比较：\n\n- 1. 比较 5 和 3，看 5 是否大于 3（5 大于 3 吗？）\n-\
    \ 2. 比较 10 和 5，看 10 是否大于 5（10 大于 5 吗）？\n- 3. 使用布尔比较 \"AND\" 比较那两个比较的结果。\n\n（注：原文中存在大量重复的\
    \ AND 比较示例，此处已根据逻辑进行翻译并保留核心内容。）\n"
