    # Graphs of Item IRT Response Functions


    Differing from dichotomous IRT models, polytomous items have more than one response,
    for each category. However, as illustrated in Chapter 4 to plot ICCs for binary
    response items, the category response can be drawn for each dichotomous item.
    Program 5.11 provides the commands for drawing the item response curves for the
    DASH items based on the GR model. The plots are shown in Output 5.29.


    In the program, point estimates for the items are first obtained using PROC MEANS
    ➊. These point estimates are saved in a data set and used to generate a data set
    of response categories for each item ➁. In this data set, we retrieve discrete
    values of θ from -4 to 4 in increments of L. This data graph, a template can can
    be used to plot the category curves using SERIESPLOT command for each response
    curve and for each item ➌. A LAYOUT LATTICE command �� is used to graph all the
    category plots in a single graph with common scales for the x-axes and y-axes.


    # Program 5.11: Graph Item Response Curves for Polytomous IRT models–GR Model


    ```

    * nitems=10; /* number of items */

    let n=5; /* number of response categories */

    let n=4; /* number of threshold parameters */


    /* save point estimates for item parameters*/

    proc means al-data-dash output noprint; ➊

    var al&nitems b1_l1&nitems b2_l2&nitems b3_l3&nitems

    b4_b4&nitems;

    output=means_gr mean=;

    run;


    /* create dataset of expected item response probabilities across theta */

    data plotdata_gr; ➁

    set means_gr;

    array b[nthrees, al&nitems] b1_b1&nitems b1_b1&nitems

    b2_b2&nitems b3_b3&nitems b4_b4&nitems;

    ```'
