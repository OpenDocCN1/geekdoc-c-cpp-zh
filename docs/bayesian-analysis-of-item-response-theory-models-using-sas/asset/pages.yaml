  md: 'To further the use of nontrunc distributions for this example, consider an
    example of trace and autocorrelation plots based on nontrunc prior distributions
    (Output 4.7). For the nontrunc prior distributions, the most notable difference
    in the parameters based on the truncated priors (Output 4.5) is the trace plot
    for the $b_1$ parameter for Item 1 (a very easy item). For this parameter, numerous
    extremely sampled values were observed. As such values are not observed with real
    data applications, thus it is reasonable to place bounds on the prior distributions
    to stabilize the sampling process. It is also interesting to note that the autocorrelation
    plots indicate lower autocorrelations for the sampled parameter values based on
    nontrunc priors, as opposed to truncated priors.


    Output 4.8 presents the posterior summary statistics for the item parameters based
    on nontrunc priors. In comparison with the posterior summary statistics based
    on the truncated distributions (Output 4.4), the means are similar, as are the
    standard deviations, for the $b_1$ and $b_2$ parameters (Items 1 and 5). These
    parameters are inflated because of extreme values that are sampled.


    Because the truncated normal distribution reflects a relatively flat likelihood
    over the bounds of -6 and 6, a uniform distribution could also be proposed. In
    order to evaluate the use of a uniform prior over the same distributions, the
    prior, PRIOR D: UNIFORM(-6,6), was used in place of the truncated normal distribution
    for the $b_i$ parameters in Program 4.2. In contrast with the results based on
    the truncated normal distributions, failed convergence diagnostic tests for sampled
    parameters with large variance specifications may be preferred over the use of
    uniform distributions.


