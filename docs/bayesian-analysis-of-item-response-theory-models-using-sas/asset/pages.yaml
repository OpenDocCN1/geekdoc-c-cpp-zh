  md: '# 40 Bayesian Analysis of Item Response Models Using SAS


    Similar to other information criteria, the DIC index weights both model fit and
    model complexity in identifying a preferred model. DIC was developed after MCMC
    estimation used prior information, and the actual number of parameters cannot
    be clearly identified as AIC and BIC. The DIC index is widely used with Bayesian
    estimation and is defined as follows:


    $DIC = \bar{D}(\theta) + p_D$$


    and


    $p_D = \bar{D}(\theta) - D(\bar{D}(\theta))$$


    where $\bar{D}(\theta)$ is the mean of the deviance others measures how well the
    data fits the model using the likelihood function $(-2log L|\))$ and the sampled
    parameters at each iteration. $p_D$ is used to correct for the bias toward higher-dimensional
    models. More specifically, $p_D$ reflects the "effective" number of model parameters
    and is computed by the difference between $D(\theta)$ and the variance, based
    on the log likelihood at the posterior mean of model parameter estimates, $D(\bar{\theta})$.
    As for other information indices, smaller values of DIC indicate better fit. Note
    that DIC should be used cautiously because the likelihood is not uniquely defined
    (Lumm et al., 2013). In addition, DIC assumes the posterior mean is an accurate
    and appropriate estimate from the posterior distribution. If this is not the case,
    when the posterior density reflects extreme skewness or bimodality, DIC should
    not be used.


    Lumm et al. (2013) discuss "rough" guidelines for interpreting differences in
    DIC when you are selecting a preferred model: differences of more than 10 rule
    out the model with higher DIC; differences between 5 and 10 reflect differences
    in favor of the model with smaller DIC; and it may be misleading to select a preferred
    model for differences that are less than 5 among the models.


    # Bays Factor


    A common approach to selecting a preferred model from competing models in a Bayesian
    analysis is to compute the Bayes factor (BF). The $BF$ is defined as the posterior
    odds of Model 1 ($M_1$) to Model 2 ($M_2$) divided by the prior for $M_1$ to $M_2$,
    which reduces to the ratio of marginal likelihoods of the data across the parameter
    space for each model:


    $BF = \frac{P(M_1|D)/P(M_2|D)}{P(M_1)/P(M_2)} = \dots$$


    A larger BF supports $M_1$, and a smaller supports $M_2$. The magnitude of BF
    can also be used in evaluating the weight of evidence in either model. The guidelines
    for interpreting $BF$ when considering evidence for $M_1$ over $M_2$ have been
    suggested (Rafferty, 1996): 1 reflects a minimal support for $M_1$; between 3
    and 12 reflect moderate support for $M_1$; between 12 and 150 reflect strong evidence
    for $M_1$; after 150 reflect very strong evidence for $M_1$.


    However, computation of the Bayes factor has both practical and theoretical limitations,
    for example, the prior are agreeing highly misplaced parameters. In order to overcome
    these problems, an alternative called Pseudo-Bayes factor (PSBF) has been proposed
    (Geisser & Eddy, 1979; Gelfand, Dey, Chang, 1992). This criterion approximates
    the marginal densities in the Bayes Factor using conditional predictive coordinates,
    the $PSBF$ index can be expressed as:


    $PSBF = \frac{P^{\pi=1}(CPO|M_1)}{P^{\pi=1}(CPO|M_2)}$


    where $R$ denotes the total number of item responses from all items. When you
    are comparing the models at the item level, $R$ equals the number of examinations
    $N$. When you are comparing the models at the test level, $R$ equals the number
    of responses for all examinees to all items (that is, $R = N \times I$ $I$ is'
