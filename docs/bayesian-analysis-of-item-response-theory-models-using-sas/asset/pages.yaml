  md: '# 228 Bayesian Analysis of Item Response Models Using SAS


    # Program 8.8: Evaluating Item Fit with Use of Yen''s Q Measure


    ```

    /*control variables*/

    let nperson=1000;

    let nitem=5;

    let npostsample=500;

    let ngroups=10; /*/number of discrete theta groups for persons */

    let ncat=2;

    /* read in observed data and sampled posterior estimates and estimate item

    and theta parameter samples in different datasets*/

    data obs;

    set lsat;

    person=n;

    run;

    data outpost_sample_lsat;

    set outpost_sample_lsat;

    sample_r;

    run;

    data theta;

    set outpost_sample_lsat;

    array theta_(&nperson);

    do person=1 to &nperson;

    theta=theta_[person];

    output;

    end;

    keep sample person theta;

    run;

    data itempars;

    set outpost_sample_lsat;

    keep sample a bl-4&nitem;

    run;

    /* create equal-sized theta groups - add rank for each person */

    data theta;

    set theta;

    thetal=theta;

    run;

    proc rank data=theta out=thegrp (rename=(thetal=group))

    ngroups=&ngroups;

    var theta; by sample;

    run;

    data thegrp; /* rank for each theta within each dataset added * */

    set thegrp;

    ngroup=group+1;

    run;

    /* Collect statistics for each theta group - means and counts */

    proc sort data=thegrp; by sample;

    proc univariate data=thegrp noprint;

    var theta; by group;

    output out=meanout mean=mean n=n;

    proc transpose data=meanout out=mean1 prefix=mean_g; var mean; by sample;

    proc transpose data=meanout out=mean2 prefix=nsub; var nsubg; by sample;

    data means; /* dataset has mean theta and counts per group */

    merge mean1(drop=name_label_) mean2(drop=name_label_);

    by sample;

    run;

    ```'
