  md: '# Bayesian Analysis of Item Response Models Using SAS


    # Differential Item Functioning—Multiple Group and Mixture IRT Models


    When evaluating the validity of inferences, you should evaluate sample heterogeneity
    and whether items function differently across subpopulations of examinations.
    Heterogeneity in how examinees interpret and respond to questions can come from
    a variety of sources (see, for example, Zumbo, 2007). In the context of IRT models,
    heterogeneity or differential item functioning (DIF) exists when the probability
    of a response is different across subgroups of examinations with the same status
    on the test being measured. When DIF exists, separate IRT models should be estimated
    and reported for the subpopulations of examinations.


    A DIF analysis can evaluate measurement across defined subpopulations or groups
    based on observed variables, and all members of a subfamily are assigned to a
    group (such as males). For this, a multiple-group analysis may be used to evaluate
    the presence of DIF. In this approach, two models are defined and compared for
    the subpopulations under study. One model defines unique parameters for each subpopulation.
    To evaluate the presence of DIF, this is compared with a model that constrains
    parameters to be equal across subpopulations.


    A DIF analysis may also be used to detect and characterize subgroups of examinations
    from their performance. In case the source(s) of examine item response heterogeneity
    is unobserved, and the assignment of examinations to latent classes is a random
    variable that is inferred from the item responses. For example, latent classes
    may be predominantly of one subpopulation (for example, males) or mixtures of
    subpopulations (for example, males who graduated college). In the case where latent
    membership is to be estimated, mixture IRT models may be used to cluster examinations
    into latent classes based on different examine response patterns (Belt, Cohen,
    & Pollock, 2001). Chapter 1 describes other uses of mixture IRT models in testing
    applications.


    # Multiple Groups for Detecting DIF


    Any of the IRT models can be used in a multiple-group paradigm to evaluate DIF
    across subpopulations or groups (for example, male and female). In this approach,
    a model is first estimated in unique sets of item parameters across G groups (unconstrained
    group model). This model would estimate item parameters or item response probabilities
    for each subpopulation. A second model is estimated with one set of item parameters
    defined for all groups (constrained group model). The constrained and unconstrained
    model can be compared using procedures discussed in Chapter 7, and if the unconstrained
    model is preferred, then DIF would be detected in the subpopulations.


    Program 6.7 presents a PROC MCMG to estimate an unconstrained IPL model using
    a modified version of the LSAT data. Program 6.8 presents a PROC MCM to estimate
    a constrained IPL model. Subpopulations in the LSAT data are simulated by assigning
    each examination to group 1 and each observation to group 2. Thus, no DIF would
    be expected under this simulated condition. Note that the group membership is
    saved in the variable G for creating the LSAT_G data set included in Program 6.7
    on the authors'' web page for this book.


    You can see in Program 6.7, for the unconstrained model, unique item parameters
    are defined for each of the two groups ① single RANDOM statement is used to define
    the random effects (θ parameters) and prior distributions for the two groups ②
    a single RANDOM statement is used with a single prior specification, the assignment
    is used to identify default.


    In Program 6.8, for the constrained model, one set of item parameters are defined
    and used in the likelihood model for both groups. In this model, a single RANDOM
    statement is used to define the random effect θ in the two groups or subpopulations,
    but the means for the prior distributions for the groups are not assumed to be
    equal. This is accomplished by using an array of parameters for means of the group-level
    prior distributions in the random effects statement ②, where the parameter for
    the first group is fixed at 0 and a parameter (MU_G) is included to estimate the
    mean for the second group. As you can see in the program, the mean that is used
    for the prior distribution is determined by the group membership of each examination.
    Estimating the mean for a group(s) allows for overall differences in the'
