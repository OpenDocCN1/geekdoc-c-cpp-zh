  md: "# # The Testlet IRT Model\n\nAs discussed in Chapter 1, there are some applications\
    \ in which individuals respond to sets of items (testlets) based on common similarity.\
    \ For example, reading comprehension passages with items associated with each\
    \ passage would separate testlets. For these types of applications, the assumption\
    \ of local independence is likely to be violated. The item responses within a\
    \ testlet would be more highly related than predicted by a unidimensional ability\
    \ trait or based on all item responses and standard IRT models (e.g., 2 IRT model).\
    \ For assessment applications that use testlets, the IRT models discussed in previous\
    \ chapters may be modified to account for the dependence between items within\
    \ testlets. For example, a modified GR model for testlets proposed by Wang, Bland\
    \ and Wainer (2002) is suitable for applications involving polytomously scored\
    \ items.\n\n# ## Description of the Model\n\nIn the testlet IRT model, a random\
    \ person-specific test effect is attributed to a unidimensional IRT model in order\
    \ to model the interaction of a person with a testlet and the dependence between\
    \ items within a testlet. For example, in adding this to the GR model, the probability\
    \ that the $j^{th}$ examinee receives a score $k=(1, 2, ..., m)$ or over $j$ within\
    \ a testlet $t(j)$ is defined as follows:\n\n```\n$P_{jk}(\\theta) = \\frac{e^{(\\\
    alpha_j\\theta+\\gamma_{t(j)})}}{1+e^{(\\alpha_j\\theta+\\gamma_{t(j)})}}}$\n\
    ```\n\nwhere $\\gamma_{tj}$ is a random person-specific test effect that models\
    \ the dependence between items within a testlet $t(j)$. In this model, $\theta$\
    \ is assumed to have an $N(0,1)$ distribution, and $\\gamma_{tj}$ is assumed to\
    \ be independent of $\theta$ and $N(0,\\sigma_{\\gamma}^2)$. The values of $\\\
    gamma_{tj}$ are assumed to be constant for an examinee over all given testlets.\
    \ Further, the test effect is assumed to vary across examinees subject to the\
    \ constraint $\\sum_{t}\\gamma_{tj}=0$. Because the variance of the test effects\
    \ $(\\sigma_{\\gamma}^2)$ is test-specific, the amount of local dependence increases;\
    \ whereas $\\sigma_{\\gamma}^2=0$, the items within the testlet can be treated\
    \ as conditionally independent.\n\n# ## Estimation of the Model\n\nProgram 6 uses\
    \ the PROC MCMC code for estimating the testlet model for a simulated application\
    \ with 15 dichotomously scored items and 1000 examinees. Thus, in the above equation,\
    \ the subscript for the response category $(k)$ is deleted, and $P_j(\\theta)$\
    \ represents the probability that the $j^{th}$ examinee correctly answers item\
    \ $j$. This model can be described as a modified 2 IRT model for testlets.\n\n\
    In the simulated data, sets of five items were simulated as testlets with varying\
    \ levels of dependence across the three testlets: $\\gamma_{tj}=-0.5, 0,$ and\
    \ $1$. The item responses were simulated with fixed parameters for items within\
    \ testlets and for varied items (1.4, 1.7, and 2.0), and different parameters\
    \ $(j)$ reflected items that were located around the $\theta$.\n\nThe program\
    \ uses code from previous examples in Chapter 4 for dichotomously scored items.\
    \ Additional model parameters include priors for gamma parameters $(\\sigma_{\\\
    gamma}^2)$ and variance $(\\sigma_{\\sigma}^2)$ for the distributions of the gamma\
    \ parameters. Note that the variance parameters are sampled using a slice sampler.\
    \ This sampler tends to provide better mixing of variance parameters than the\
    \ default conjugate sampling of the random effects. Rather than use inverse gamma\
    \ priors for the variance parameters, uniform or half priors are recommended by\
    \ Gelman (2006). In this program, a half $t$ prior is used. Priors for the random\
    \ effect parameters are specified using multiple random statement, with the gamma\
    \ parameters estimated. The gamma parameter is included in the likelihood function\
    \ for the testlet in array $T$ is part of the data set and used to indicate which\
    \ items are associated with specific testlets. Similar to the bifactor model program,\
    \ a large number of iterations are used because the chains for the slope and variance\
    \ for gamma parameters exhibit a high degree of dependence and are not efficient."
