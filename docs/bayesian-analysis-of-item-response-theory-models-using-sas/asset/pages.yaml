  md: "# 82 Bayesian Analysis of Item Response Models Using SAS\n\nintercept model\
    \ where $z_i = a_i - d_i$, and $d_i$ is a function of $a_i$ or $b_i = d_i / a_i$.\
    \ The reader is referred to Chapter 3 for an overview of how to use PROC MCCMC\
    \ to estimate IRT models.\n\n# The 1-Parameter IRT or Rasch Model\n\nIn the 1-Parameter\
    \ (1P) model, the logistic device includes estimation of a person parameter ($\t\
    heta$) for each examine, one threshold parameter for each item ($b_i$), and a\
    \ common slope parameter for all items ($a$). In the of context of educational\
    \ assessments, a parameter is referred to as an item discrimination parameter\
    \ and the $b_i$ parameters are referred to as difficulty parameters. By estimating\
    \ a single slope parameter, this model assumes that all items have the same discriminatory\
    \ power and are related equally to the underlying trait or ability being measured.\
    \ The Rasch (1960) model is equivalent to a 1P logistic model with $D_a=1$ in\
    \ the logistic device. As discussed in Chapter 1, Rasch or 1P models have several\
    \ desirable properties, and may also be preferred for practical reasons (for example,\
    \ to reduce the number of estimated parameters).\n\nThe PROC MCMC code for a multidimensional\
    \ 1P IRT model is provided in Program 4.1. The commands in this program are similar\
    \ to the commands illustrated in Chapter 3, with some exceptions. In addition\
    \ to a logistic device reflecting an intercept model, the MONITOR option specifies\
    \ that only the $a$ and $b$ parameters from the posterior distribution are summarized.\
    \ The $b$ parameters rather than the $d_i$ are more interpretable and of more\
    \ interest. Secondly, more diffuse or uninformative priors are specified for the\
    \ item parameters. Finally, the THREADS=8 option specifies the use of parallel\
    \ processing in the SAS system.\n\n# Program 4.1: PROC MCMC Code for the 1P Logistic\
    \ IRT Model\n\n```\nproc mcmc data=lsat out=lsat seed=23 nbi=500 nmc=20000\\\n\
    threads=8; monitor(a diagnostics=allplots(trace autocorr));\n\narray b[5]; array\
    \ p[5];\n\npars a; d=0;\n\nprior d ~ normal(0,var=25);\nprior a ~ lognormal(0,var=4);\n\
    random theta ~ normal(0,var=1) subject=obs_\n\ndo j=1 to 5;\np[j] ~ lognormal(a*theta\
    \ - d[j]);\nb[j] ~ d[j]/a;\nend;\n\nmodel x1 ~ binary(p1);\nmodel x2 ~ binary(p2);\n\
    model x3 ~ binary(p3);\nmodel x4 ~ binary(p4);\nmodel x5 ~ binary(p5);\n\nrun;\n\
    ```\n\nOutputs 4.1 and 4.2 provide the summary statistics from the posterior distributions\
    \ for the item parameters and convergence diagnostic (trace and autocorrelation)\
    \ plots. As shown, the chain appears to mixing well and exhibits low dependence.\
    \ The means of the posterior distributions for the parameters may be used as point\
    \ estimates for the parameters and the standard deviations reflect the uncertainty\
    \ associated with parameter estimates. The point estimates for the $b_i$ parameters\
    \ indicate that four of the five items reflect easy (Items 1, 2, 4, and 5), with\
