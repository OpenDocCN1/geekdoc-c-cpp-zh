    - Using the MODEL statement to define the likelihood model compels certain data
    requirements. For example, the BINARY distribution must be 0s and 1s with 1 representing
    correct codes. An alternative to using MODEL statements is discussed and later
    not have this same data requirement.


    PROC MCMC Processes the SAS Data Set

    PROC MCMC uses the predicted distributions and log-likelihood function to calculate
    the posterior distributions for parameters. By default, it assumes that observations
    are independent. Under this assumption, PROC MCMC calculates the log of the posterior
    distribution as:


    ```

    log(p(theta)) = log(p(theta)) + \sum_{i=1}^{n} log(f(yi|theta))

    ```


    where ci is a parameter in the SAS data set with n observations. log(yi|theta)
    is the log-likelihood function for a single observation | i. At each iteration
    of the sampling algorithm (for example, Metropolis algorithm), the programming
    and MODEL statements are executed for each observation, and the log-likelihood
    is accumulated across all observations in the SAS data set. After each evaluation,
    the log of the prior is added to compute the log of the posterior distribution.
    As procedures proceed sequentially the observations in a data set, computations
    across the observations are not explicitly programmed as in other programs implementing
    MCMC algorithms (for example, WinBUG). After the posterior distributions are obtained,
    various statistics, convergence diagnostics, and graphical displays can be computed
    from the posterior distributions, as detailed in the options of the PROC MCMC
    statement.

    If observations are not independent, the assumption above may introduce an incorrect
    likelihood value. In case of dependent observations, or f(yi, theta) for i !=
    j, use the JOINTMODEL option in the PROC MCMC statement.


    More on the RANDOM Statement

    The RANDOM statement is used to specify random effect parameters that can also
    reflect cluster-specific characteristics. Several options for the RANDOM statement
    are required: RANDOM <random effect(s)> ~ <prior distribution> SUBJECT=<option>.
    The random effect that can be specified as a parameter or array of parameters.
    Prior distributions for the random effects must be specified. However, only one
    subset of the'
