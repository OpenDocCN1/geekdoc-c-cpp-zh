    A PPMC analysis using odds ratios as the discrepancy measure was also conducted
    with the DASH data. Program 8.9 was modified, but not presented (see Program 8.10
    on the authors'' webpage for the book), for this analysis. However, to analyze
    the DASH item responses, you need to consider three different types of odds ratios
    in an R × C contingency table for polytomously scored items: local odds ratios,
    local-global odds ratios, and global odds (Agresti, 2002). Local odds ratios are
    defined using cells in adjacent rows and columns. A problem with local odds ratios
    is that number of local odds ratios for a single item pair will increase dramatically
    as the number of response categories for each item increases.


    One way to measure the association in an R × C contingency table is to dichotomize
    one of the items according to a cut-point and compute local-global odds ratios.
    While this type of odds ratio reduces the number of odds ratios to be compared,
    it still requires execution of multiple odds ratios per item pair. A single odds
    ratio is often preferred to simplify or summarize the association in an R × C
    contingency by dichotomizing the response categories of each item in pair. When
    you do so, a ×2 contingency table is constructed for each item pair, and a single
    global odds ratio is computed. Use of global ratios with a PPMC analysis of polytous
    IR models has been found (Zubu & Store, 2011), and these are used in each example.


    Output 8.7 and 8.8 present the results that the DASH survey was designed to measure
    physical functioning with items asking about the degree of difficulty, from 1
    ("No Difficulty") to 5 ("Unable”), in performing different tasks such as opening
    a jar, writing, and making the bed. Two cut-points are examined because there
    isn''t an obvious-natural cut-point between the two responses. You can see that
    the different cut-points generated produce different results; but, overall indicate
    that between 25% and 33% of the OR values demonstrate PPP values that were either
    < .05 or > .95. Thus, there is evidence that the local independence assumption
    may be compromised for the DASH items. It is possible that this local independence
    is deu2013compromu201ised by the common context (physical functioning) under which
    the persons are responding to the items. Finally, note that this discrepancy measure
    is not addressing model-data-fit for individual'
