    # Example 7: Use of PPMC to Compare Models


    It is also possible to use PPMC to compare models and supplement the model comparison
    statistics discussed in Chapter 7. Because the item-total score correlation is
    related to the discrimination parameter or slope parameter in IRT models, this
    statistic is particularly useful as a discrepancy measure in a PPMC analysis comparing
    models that estimate a common parameter for all items in an IRT model. For example,
    we could compare the IP and 2P for dichotomously scored items using the PPMC method
    to help determine the significance of incorporating separate slope parameters
    in the model.


    The same approach could be used to compare a one-parameter GR model with the GR
    model. Program 8.6 was modified slightly to perform a comparison of the one-parameter
    GR model and the GR model for the DASH data (Program 8.13 for the GR model is
    included on the authors'' webpage for the book). Results from the two PPMC analyses
    are provided in Outputs 8.11 and 8.12. You can see that in Output 8.11, the item-corrected
    total score correlation for the observed data falls at the boundary or outside
    the credible interval for the predicted correlations for a number of items under
    a one-parameter GR model. However, in Output 8.12, you can see that the item-corrected
    total score correlation for the observed data falls within'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'credible interval for all items, indicating that the GR model, with separate
    slope parameters for each item, provides better model fit than the one-parameter
    GR model.


