  md: "# 86 Bayesian Analysis of Item Response Models Using SAS\n\nThe item parameters\
    \ are expected to be interrelated, higher degrees of autocorrelation could be\
    \ obtained if the two PARMS starts are used: PARMS A: 1 and PARMS D: 0.\n\nProgram\
    \ 4.2 also illustrates the use of truncated prior distributions. For the 1P model\
    \ (Program 4.1), PRIOR D ~ NORMAL(0, VAR=25) and PRIOR A LOGNORMAL(0, VAR=4).\
    \ In Program 4.2, however, truncated priors are specified for the 2P model to\
    \ set reasonable bounds on the parameter space to avoid extreme and unsampled\
    \ values. It highly unlikely that the $a_i$ and $b_i$ parameters with real data\
    \ would fail out satisfy the bounds in Program 4.2. For example, the proportion\
    \ of individuals in the LSAT data answer Item 1 would be classified as extremely\
    \ easy, and the $b_i$ parameters for these items are estimated at -3.65 and -2.8\
    \ under the 1P model with nontruncated prior distributions. These priors are only\
    \ slightly more informative than the nontruncated bounds on the item parameter\
    \ space.\n\nNotably, bounds of -6 and 6 were imposed on the $a_i$ parameters,\
    \ but were not directly imposed on the $b_i$ parameters given the parameterization\
    \ of the model (logistic $z_i = a_i - d_i$). Because the $b_i$ parameters are\
    \ a function of $a_i$ and $d_i$, $b_i$ parameters could be sampled beyond the\
    \ bounds of -6 to 6 for some sampled $a_i$ parameter values, particularly small\
    \ sampled values. Bounds on the $b_i$ parameters could be directly imposed by\
    \ changing the logistic device to $z_i = a_i(\theta - d_i)$, where $a_i$ parameters\
    \ directly impose reasonable bounds on the item parameter space and avoid extreme\
    \ values for the $b_i$ parameters.\n\n# Program 4.2: PROC MCMC Code for the 2P\
    \ Logistic IR Model\n\n```\nproc mcmc data=lsat_lsat_bayes seed=23 nbi=5000 ncmc=2000\n\
    threads=8 (a b) diagnostic=all plots=(trace autocorr);\n\narray a(5); array b(5);\
    \ array d(5); array p(5);\n\nparms a1 d1 0;\nparms a2 d2 0;\nparms a3 d3 0;\n\
    parms a4 d4 0;\nparms a5 d5 0;\n\nprior d ~ normal(0,var=25, lower=-6, upper=6);\n\
    nprior a ~ lognormal(0,var=4, .2, upper=5);\n\nrandom theta ~ normal(0,1) subject=obj_j;\n\
    for j=1:5 do\np[j] ~ logistic(a[j]*theta-d[j]);\nb[j] = d[j]/a[j];\nend;\n\nmodel\
    \ x1 ~ binary(p1);\nmodel x2 ~ binary(p2);\nmodel x3 ~ binary(p3);\nmodel x4 ~\
    \ binary(p4);\nmodel x5 ~ binary(p5);\nrun;\n```\n\nOutputs 4.4 through 4.6 provide\
    \ the summary statistics from the posterior distributions for the item parameters\
    \ in the 2P IRT model and converge diagnostics. As can be seen, the chains are\
    \ mixing well and exhibit relatively dependence more than that observed for the\
    \ 1P model. In estimating the posterior means for the item parameters, the $b_i$\
    \ parameters are similar to the $b_i$ parameters from the 1P model. For the $a_i$\
    \ parameters, there appears to be some variability across the 5 items, much of\
    \ the variability is due to the larger $a$ value for Item 3. However, one significant\
    \ difference between the two models is the increased uncertainty or standard deviations\
    \ in the"
