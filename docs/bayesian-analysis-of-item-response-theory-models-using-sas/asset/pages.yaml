    # CPO Results


    Program 7.1 uses the SAS program to obtain the CPO results for the 1P model. The
    program assumes the observed data (LSAT) and the samples from the posterior distribution
    (OUTPOST file from PROC MCMC) in the work library. Control parameters are specified
    ① and labels for the parameters in the response probability models are defined
    as follows: the slope parameter $a_i$, threshold $b_i$ to $b_n$, and guessing
    parameters $c_i$ to $c_n$; where n is the number of items ② Data sets are processed
    by saving the observed data (LSAT) in the SAS data set ③ and saving a copy of
    the estimates from the OUTPOST data in the DATA set ④ A macro CPO is used to compute
    the item-level and test-level CPO values for dichotomous data following the three
    steps in the template ⑤ For each observation in OUTPOST_, the program specifies
    the necessary model parameters (item and person parameters) and the sampled values
    are used in the DATA STEP ONE CPO DI to compute the likelihood of the data for
    each observation ⑥ Results are accumulated in the SAS data set ALLPO_I Item level
    and test level CPO indices are computed from ALLPO_I ⑥ and the results are saved
    and managed in the data set CPO_RESULT ⑦


    The program specifies the three response probability models for the 1P, 2P, and
    3P models. ⑧ In to run the program for the 2P or 3P model, you need to change
    the macro variable ITEMPARAMS to the correct variable model, change the macro
    variable and change any required file specifications.


    # Program 7.1: Computing the CPO Statistics for the 1P Model–LSAT


    ```

    * Control Settings for the Macro

    USER DEFINED;

    %itemlevel=1; /* 1-P 2P-3P */ ①

    %itemnerson=1000; /* number of examiners */

    %itemn=5; /* number of items * */

    %itemsamples=2000; /* subset of OUTPOST iterations to use in CPO */

    %itemparams=a b1-b5; /* item parameters in OUTPOST */ ②


    /* Create SAS datasets to process - observed data and subset of

    iterations from OUTPOST dataset ③

    d res_data;

    set lsat;

    run;

    proc procseselect data=lsat_bays_lp_model=SRS rep=1

    sample=&postsamples=12345 out=outpost_sample;

    id _j;

    run;


    %macro cpo_di;


    /* STEP1: compute CPO(i,j) for each iteration of posterior distribution */

    proc datasets delete allCPO_ij;

    run;


    %do mc=1 %to&postsamples;

    /* Attach posterior results to each record of the observed dataset */

    data out_one;

    if _n=1 then set output_sample(firstobs=&mc obs=&mc);

    set res_data;

    array theta[_*) theta_1-theta_&itemnerson;

    person_n;

    theta_theta=theta[person];

    keep x1-xitem &itemparams theta;

    run;

    ```'
