  md: "# Chapter 4: Bayesian Estimation of Unidimensional IRT Models for Dichotomously\
    \ Scored Items 95\n\nwith low ability have little chance of correctly answering\
    \ an item. As such, the lower asymptote parameter ($c_j$) is often referred to\
    \ as a guessing parameter.\n\nFigure 4.1: Example ICC for a Dichotomously Scored\
    \ Item (0,1)\n\n![](img/dd5368102e19084dcd107a02a82ba37c_110_0.png)\n\nThis model\
    \ is also illustrated with the LSAT data this model would be expected to be consistent\
    \ with the multiple-choice LSAT items. The 3P model includes $a_j$, $b_j$, and\
    \ $c_j$ item parameters to reflect all aspects of the shape: the lower asymptote\
    \ ($c_j$), location of the ICC along x-axis or the scale ($b_j$), slope of the\
    \ ICC ($a_j$). In this model, the $c_j$ parameter is incorporated externally in\
    \ the logistic deviate $z_j = Da_j(\theta - b_j)$ as follows:\n\n$P_j(\theta)\
    \ = P_j(U_j = 1 | \\theta) = c_j + (1 - c_j)\\frac{e^{a_j\\theta}}{1+e^{a_j\\\
    theta}}$\n\nNote that if $c_j=0$, then the model defaults to a 2P IRT model.\n\
    \nThe PROC MCMC code to estimate the 3P model extends the 2P model by including\
    \ the $c_j$ parameter in the likelihood model and associated prior distribution\
    \ specifications. However, there are several complications to estimating the $c_j$\
    \ parameters. Data or responses may be suitable for examinations with low $\t\
    heta$, and $c_j$ are more stable for items that are of average difficulty or more\
    \ difficult and discriminate; see, for example, Hamilton & Swaminathan (1985).\
    \ Lord (1980) recommends estimating $c_j$ when $b_j - (2/a_j) > -3$ or $<-5$ examples\
    \ where $N>2000$. However, there is also literature suggesting it should be fixed\
    \ at $1/k$, where $k$ is the number of response choices (Han, 2012). In the context\
    \ of a Bayesian paradigm, this recommendation suggests that using informative\
    \ priors for the $c_j$ parameters may be useful with means equal to 1.\n\nBecause\
    \ problems in estimating the $c_j$ parameters may exist for the 3P model, it is\
    \ also useful to examine empirical plots before estimating the model. An empirical\
    \ ICC uses the total scores as a proxy for 0 on the x-axis and plots the mean\
    \ response for an item on the y-axis. Thus, this plot provides"
