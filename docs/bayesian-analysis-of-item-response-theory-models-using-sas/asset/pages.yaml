- img_proc: true
  md: '# 50 Bayesian Analysis of Item Response Models Using SAS


    Recall from Chapter 1 that the general form of the IRT response model for dichotomously
    scored items, the probability that an examinee receives a correct (e.g., 1 versus
    0, or Yes versus No) to the fth item, is modeled as follows:


    > $P(X_i=1|\theta_i) = c_i + (1-c_i)F(\theta_j)$


    where $F(z)$ is a logistic or lognormal distribution with $z=\theta-\theta_j$;
    $D$ is an arbitrary scaling constant used to define the metric for $\theta$; for
    example, examination ability); and $\theta_i$ represents the value of possible
    item for item in the model; $a_i$ is the slope parameter, $b_i$ is a threshold
    parameter, and $c_i$ is a lower asymptote parameter.


    A general template for the use with dichotomously scored items is presented below.
    To estimate a model, you can see all the aspects of the model needed: the specific
    IRT model, parameters, prior distributions for parameters, and the likelihood
    model that links the observed data and the model parameters. PARMS parameters
    are used to define item parameters ($a_i, b_i, c_i$) in the model and RANDOM parameters
    are used to define parameters ($\theta$) in the model. The particular IRT model
    is specified through a set of SAS programming statements that define the probability
    of a response (P(Ij)) for each item. MODEL statements define the log-likelihood
    functions that link the observed data for each item to the IRT model being estimated.
    ARRAY statements are not necessary but to facilitate reference to parameters not
    agreed upon by the model. There is no order required for PROC MCMC models (PROC,
    PARMS, and RANDOM). With any programming statements that include, any of the statements
    (for example, DO loop) should be maintained.


    ```

    proc mcmc <class dataset=<dataset> outsas=<dataset> select=<value>

    mbc=<value> nbi=<value> threads=<value> statistics=<list>

    diagnostics=<list> plots=<list>;


    /* define arrays to reference item parameters */

    array array[number of expected response variables for items];

    array a[number of slope parameters];

    array b[number of threshold parameters];

    array c[number of pseudo-guaranteeing parameters];


    /* define IRT model item parameters */

    parms a = <value>; /* '':'' is used to reference array of elements */

    parms b = <value>; /* if only one parameter, do not use the '':'' */

    parms c = <value>;


    /* define prior distributions for item parameters */

    nprior a = ~ <distribution>;

    prior b = ~ <distribution>;

    prior c = ~ <distribution>;


    /* define IRT model person parameters and prior distribution */

    random theta ~ <distribution> subject=obs_;


    /* set of programming statements defining likelihood function for each

    item;\ncorrect response probability, pj, for each item (1,..., J) based on the

    chozen IRT model*/

    do j=1 to <number of items>;

    p[j] = <IRT model defining response probability for each item>;

    end;

    ```'
