  md: "better understanding of the psychometric properties of items and to obtain\
    \ more information about the characteristic being measured. In some assessment,\
    \ this additional information translates into more diagnostic information about\
    \ respondents.\n\nIn tandem with the development of IRT models for dichotomously\
    \ scored items, different types of IRT models have been proposed for applications\
    \ with polytously scored items. In this book, threshold parameters, similar to\
    \ those used for dichotomously scored items, are used to define boundaries between\
    \ adjacent response categories and are used to describe the transition in response\
    \ from one category to another. Because the thresholds reflect boundaries between\
    \ adjacent response categories, the number of threshold parameters is equal to\
    \ one less than the number of response categories.\n\n# The Graded Response Model\n\
    \nSemeja's (1969; 1996) graded response (GR) model is a commonly used model for\
    \ assessment with original response scales such as rating or Likert scaled items.\
    \ The response process underlying the model assumes that all response options\
    \ are chosen by persons and that the selected response option is a function of\
    \ the trait being measured and all prior response categories in the scale.\n\n\
    In the GR model, the cumulative probability that an item scores $k$ or higher\
    \ is modeled by the logistic deviate $z_{jk}=D_{jk}(\theta-b_{jk})$, where $D$\
    \ is the scaling constant; $\theta$ represents the person ability or trait being\
    \ measured; $b_{jk}$ is a threshold parameter for item $j$ and $k$ $\\{0, 1, 2,\
    \ ... m\\}$;\n\n```\n$P_{jk}(\\theta) = \\frac{e^{a_{jk}\\theta}}{1+e^{a_{jk}\\\
    theta}}$\n```\n\nFigure 1.2 presents the cumulative probability functions, $P_{jk}(\t\
    heta)$, also called \"operating characteristic curves,\" for an item with five\
    \ response categories. Under the GR model for this item, there are four category\
    \ threshold parameters ($b_1=-1.5, b_2=-0.5, b_3=0.5$, and $b_4=1.5$). Each parameter\
    \ indicates the point on the scale $\theta$ where the curve is steept, and an\
    \ individual has a $.5$ probability of responding in category $k$ or higher. For\
    \ example, if $\theta > b_k$, the probability that the response is in category\
    \ $k$ or higher is greater than $.5$. For individuals with $\theta = -1.5$, the\
    \ probability is $.5$ that individuals will endorse response 1 or higher. Because\
    \ the response functions reflect cumulative probabilities of responding in category\
    \ $k$ or higher, the are naturally ordered $b_1 < b_2 < ... < b_m$. Note that\
    \ an operating characteristic for the lowest category (0) is not plotted, the\
    \ function would be equal to 1 for all items.\n\nFor the GR model, one slope parameter\
    \ is estimated in Figure 1.2 for each item to lead the parallel operating characteristics.\
    \ Under the further assumption that all items have a common slope parameter, the\
    \ GR model reduces to a one-parameter model with the logistic deviate $z_{jk}=a(\t\
    heta-b_{jk})$. Therefore, the one-parameter GR model is a restricted version of\
    \ the GR model with a common slope parameter across categories. Finally, as discussed\
    \ by Embreten & Reese (2000), the GR model for an item reflects a series of 2P\
    \ logistic models for dichotomously scored items ($k < 1$ versus $k < 2$ versus\
    \ $k \\ge 2$). Thus, if there are only two categories, the model is equivalent\
    \ to the 2P logistic response model for dichotomously scored items."
