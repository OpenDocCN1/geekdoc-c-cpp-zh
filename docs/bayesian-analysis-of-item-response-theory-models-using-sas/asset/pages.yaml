    performance for individual items. If the model is appropriate, properties for
    items are independent of the specific group that is assessed (person-free measurement),
    and traits or abilities being measured are independent of the items that are assessed
    (item-free measurement). Because IRT focuses on and provides a useful framework
    for test development that includes selecting items appropriate to a particular
    testing, equating multiple forms so that trait or ability estimates are comparable,
    and constructing item banks that may be used for computer adaptive testing. Santos
    and Ramsay (1998) found that IRT methods afford a better estimate of an individual''s
    true value on the trait measured than a summed score of items used in a CTT approach.


    This chapter provides a description of different types of IRT models that can
    be used in different testing applications. The descriptions are briefed by design
    and are intended to serve as supporting documentation for the examples of Bayesian
    analysis of IRT models that are presented in subsequent chapters. For more general
    and complete treatments of IRT models, for example, Embreison and Reise (2000);
    and Yen and Fitzpatrick (2006).


    Rather than view this chapter in its entirety, you may wish to review specific
    sections of this chapter with the PROC MCMC code for Bayesian analysis in other
    chapters. Chapter 3 describes the use of PROC MCMC, including syntax and options,
    but only in the context of simple unidimensional IRT models for binary responses.
    Thus, information relevant to unidimensional IRT models for binary responses is
    limited to the first two sections of this chapter. For readers focusing on models
    for polytomously scored responses, by contrast, Chapter 5 may be combined with
    the section on unidimensional models for polytomously scored responses in Chapter
    1.


    # Overview of IRT Models and Their Application


    IRT models involve a class of mathematical models that may be used to predict
    persons'' responses to each item using characteristics of the persons and the
    items. The person characteristics reflect one or more latent constructs being
    measured by an instrument (test, survey, or scale), and a person''s level or status
    on each construct being measured is assumed to affect test performance. These
    characteristics could reflect many different types of traits for individuals,
    such as verbal ability in educational assessment, a psychological trait such as
    depression or quality-of-life in health assessments. A broad construct domain
    can be further conceptualized into subdomains (for example, mental and physical
    quality of life), and each subdomain can represent a separate person characteristic
    that is being measured.


    Underlying the measurement of each construct are the indicators for the construct—that
    is, items. Because characteristics of items are also assumed to affect test performance,
    IRT models also include parameters to reflect item characteristics. For example,
    items are often targeted at specific levels of a trait and that level is the characteristic
    of items. In the context of educational assessment, items may be targeted or designed
    to measure performance for individuals with high ability (that is, more difficult
    items). The targeted level of the trait for an item reflects an characteristic
    that is modeled in the class of IRT models is:


    To predict and model item responses, IRT models consist of one or more person
    parameters and one or more item parameters (for example, Embreison & Reise, 2000;
    Hambleton & Swift, 1985; Reise, 2002; Yen & Fitzpatrick, 2006). These parameters,
    in conjunction with a mathematical function, such as a normal log or logistic
    function, may be used to model the probability of a response to item j. This response
    could be, for example, correct or incorrect, or endorsement of a particular response
    uj. A general expression for the class of IRT models is:


    ```

    P(Uj = 1 | θ, α)

    ```


    where θ is a vector of person characteristics reflecting different traits being
    measured, and αj is a vector of item parameters for item j characterizing features
    of the item that are assumed to affect performance.'
