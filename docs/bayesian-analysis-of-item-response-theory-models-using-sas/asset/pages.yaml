    Because the MCMC method samples parameter values iteratively, determining whether
    the Markov Chain has converged to the target posterior distribution is important.
    If the chain does not converge, then the samples from this chain will not represent
    the target parameter space or posterior distribution of interest. Therefore, you
    must assess convergence of Markov chains before making any inferences. For a complete
    description of the diagnostics available in PROC MCMC, see Chapter 2.


    Trace history plots (sampled values across iterations) and autocorrelation plots
    are typically examined. Output 3.4 presents these diagnostic plots for the posterior
    distributions. With regard to the trace plots, you can see that the sampled values
    are “mixing” reasonably well across iterations for all item parameters $(a, b1
    - b_5)$, indicating that the values were traversing in a random pattern over a
    plausible support of the parameter space. Plots exhibiting a trend (for example,
    increasing over time) or values that do not traverse the entire parameter space
    quickly would reflect poor mixing (for examples of trace plots exhibiting poor
    mixing; see Chapter 2).


    Autocorrelation plots, on the other hand, are used to evaluate the dependence
    of sampled values with a focus on higher lags because dependence at lower lags
