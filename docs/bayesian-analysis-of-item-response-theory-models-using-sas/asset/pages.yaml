    proc mcmc data=dummy dummy=none ncmc=2000 plots=density seed=123;


    parms a1 a2 b 0 s2;


    prior a1 ~ lognormal(0,var=.5);

    prior a2 ~ normal(0,var=4,lower=-6);

    prior b ~ normal(0,var=100, lower=-6, upper=6);

    prior s2 ~ gamma(shape=.01,iscale=.01);


    model general(0);


