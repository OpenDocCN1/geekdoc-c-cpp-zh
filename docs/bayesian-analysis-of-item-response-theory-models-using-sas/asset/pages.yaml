    ```

    $p(D''=1|D) = \int_0^1 1\pi p(\pi|D)d\pi$$

    ```


    ```

    $= \int_{\pi=0}^1 \pi p(\pi|D)d\pi = E[\pi|D]$

    ```


    For this example, the prediction for a new draw would be the mean of $p(\pi|D)$,
    or .417. Using the mean of $p(\pi|D)$ makes sense as a prediction for a single
    subsequent draw.


