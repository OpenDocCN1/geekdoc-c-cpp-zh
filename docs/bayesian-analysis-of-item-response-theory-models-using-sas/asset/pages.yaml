    # ### Program 4.6: PROC MCMC Commands for a Constrained 3P Model


    ```

    proc mcmc data=lsat out=lsat_bayes seed=23 nbi=5000 nmc=5000

    threads=8 monitor=(a b c) diagnostics=all plots={trace autocorr);


    array b[5]; array a[5]; array c[5]; array p[5];


    parms a1 l1 d0;

    parms a2 l1 d0 c2 .20;

    parms a3 d1 c3 .20;

    parms a4 d4 0;

    parms a5 l1 d5 0;


    begindata

    c1=0;

    c4=0;

    c5=0;

    endata


    prior a ~ lognormal(0, var=4, lower=-.2, upper = 3);

    prior di ~ normal(0, var=25, lower=-6, upper = 6);

    nprior c2 c3 ~ beta(5, 20);


    random theta ~ normal(0, var=1) subject=obs_;

    k=1 to 5;

    p[k] ~ c[k]+k+(1-c[k])*logistic(a[k])*theta - d[k]);

    b[k] ~ d[k]/a[k];

    end;


    model x1 ~ binary(1);

    model x2 ~ binary(2);

    model x3 ~ binary(3);

    model x4 ~ binary(4);

    model x5 ~ binary(5);

    run;

    ```


    Finally, a hierarchical prior on c_i parameters may prove useful with the 3P model
    (Johnson, Sinharay, & Bradshaw, 2007). As discussed in Chapter 3, hierarchical
    priors borrow information across persons or items to stabilize the estimation
    process. Program 4 presents an example prior for the logit(c), where logit(c)~NORMAL(MU,
    SIGMA2) and MU ~ NORMAL(-1.38, VAR=10) and SIGMASQUARE(1) is used to change the
    metric of the c_i parameters to an unbounded scale where a normal prior could
    suffice with independent parameters (mean and variance parameters). The values
    of -1.38 used for initial values for the c_i parameters and in the Prior MC to
    constrain the logit(c) 0 or 1/k).


    Output 4.7 presents the posterior summary statistics from estimating the model
    for the c_i parameters. You can see that the logit of the c_i parameters are all
    ~-3.5, which corresponds to a probability of ~0. The other parameters (a_i and
    b_i) are similar to those estimated for the 2P model (see Output 4.8 and 4.9).
    This, therefore, would indicate that a 2P model is sufficient to model the LSAT
    item responses. Notably, the LSAT data set may not be an optimal choice for a
    hierarchical specification on c_i parameters, given that there are few items and
    the items are generally very easy.'
