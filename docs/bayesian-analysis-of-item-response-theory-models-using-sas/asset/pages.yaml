    \ 41\n\n# Introduction\n\nInterest in Bayesian analysis has grown tremendously\
    \ in recent years. In part, this growth is due to the appeal of the Bayesian paradigm\
    \ among psychometricians and statisticians, as well as to the advantages of these\
    \ methods when analyzing more complex or highly parameterized models. In contrast\
    \ to traditional approaches for estimating model parameters, a Bayesian paradigm\
    \ considers model parameters to be random variables, and However, interest in\
    \ Bayesian analysis has also grown because of the availability of software that\
    \ may be used to implement general Bayesian methods—for example, WinBUGS (Spiegelhaler,\
    \ Thomas, Best, & Nunn 2003) and the SAS MCMC procedure.\n\nThis chapter provides\
    \ a basic introduction to Bayesian analysis. The purpose is to provide fundamental\
    \ material to support the discussion in subsequent chapters that cover the implementation\
    \ of Bayesian analysis with the use of PROC MCMC, and to support the discussion\
    \ of the programs and results related to estimating item response theory (IRT)\
    \ models with PROC MCMC.\n\nAmong the numerous sources for a more detailed and\
    \ theoretical discussion of Bayesian analysis, see for example, Congdon (2006);\
    \ Fox (2010); Gelman, Carlin, Stern, Dunson, Vehtari, & Rubin (2014); Lunn, Jackson,\
    \ Best, and Spiegelhaler (2013). Fox (2010) is also an excellent reference for\
    \ a technical treatment of Bayesian analysis of IRT models.\n\n# Elements of Statistical\
    \ Models and Inference\n\nStatistical models are used to describe data or variables\
    \ that are measured into formulated relationships between the variables. For example,\
    \ factor analysis models allow for structuring a larger set of observed variables\
    \ into a smaller set of factors so that the relationships can be easily discussed\
    \ and evaluated."
