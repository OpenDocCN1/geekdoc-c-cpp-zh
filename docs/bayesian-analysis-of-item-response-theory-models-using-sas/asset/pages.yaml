  md: "# Unidimensional IRT Models for Dichotomous Responds\n\nIRT models for dichotomously\
    \ scored responses were originally developed for educational assessment applications\
    \ where responses are scored as Correct as to Incorrect. However, these models\
    \ can also be used for responses that are scored in dichotomy such as Yes as to\
    \ No. For any of these types of applications, Hamilton and Swanathan (1988) describe\
    \ three IRT models that are generally used: 1-, 2-, and 3-Parameter models. In\
    \ the general form for these three, the probability that an examinee receives\
    \ a response (1-Correct as opposed to 0-Incorrect) to the $i$-th item is modeled\
    \ by a logistic function:\n\n```\n$P_i(\\theta) = P_i(U_i=1|\\theta,\\omega_i)\
    \ = \\Psi(z_i) = c_i + (1-c_i)\\frac{e^{z_i}}{1+e^{z_i}}$\n```\n\nWhere $\\Psi(z)$\
    \ is the cumulative function and $z_i = Da(\\theta - b_i)$ is a logistic device;\
    \ $D$ is a scale constant; $\theta$ represents the person parameter (for example,\
    \ ability); and $\\omega_i$ refers to the vector of item parameters for item $i$;\
    \ the $a_i$ is the slope parameter for item $i$, $b_i$ is a threshold parameter\
    \ for item $j$, and $c_j$ is a lower asymptote for item $j$.\n\nA normal function\
    \ $\\Phi(z)$, or any other function that has a cumulative density function, may\
    \ also be used (Yen & Fitzpatrick, 2006). For $\\Phi(z)$, $z_i = Da(\\theta -\
    \ b_i)$ is a normal deviate and is as defined above for the logistic function;\
    \ however, because the logistic function is more mathematically tractable, the\
    \ logistic link has received more attention in IRT applications. Note that the\
    \ two links for IRT models, $\\Psi(z)$ and $\\Phi(z)$, produce essentially equivalent\
    \ results if the scaling (D) of $D=1.72$ is optional and is used in some IRT model\
    \ parameterizations; $D=1.0$ is used in other IRT model parameterizations.\n\n\
    The three models for dichotomously scored items are differentiated by the parameters\
    \ that are included. The 3-Parameter model includes all three parameters: $a_i$,\
    \ $b_i$, and $c_i$—see Figure 1.1 for an example of an ICC. The 2-Parameter model\
    \ does not include $c_i$; and is appropriate for applications where the lower\
    \ asymptote is assumed to be zero or is measured as negligible. The 1-Parameter\
    \ model does not include $a_i$; and estimates a common slope parameter across\
    \ items. That is $z_i = D(\\theta - b_i)$. In essence, this model makes assumption\
    \ that item relates only to the ability or trait being measured. These three models\
    \ reflect hierarchical or nested models, and you can use model comparisons to\
    \ determine the preferred method. For comparing the models the are discussed in\
    \ Chapter 7.\n\nThe Rasch (1960) model for dichotomously scored items has also\
    \ received much attention. IRT models were developed to measure item performance\
    \ and fit. The Rasch model was developed to capture measurement precision in instruments\
    \ more broadly, such as those used in the physical sciences. Although independently\
    \ developed IRT model is equivalent to a PL logistic model with $D=1$ in the logistic\
    \ device. Rasch-based or IRT models have several desirable properties: person-item\
    \ interactions is independent of the level of $\theta$ for Rasch or PL models.\
    \ In other words, any comparisons of persons' $\theta$ levels are independent\
    \ of the items used in the comparisons. Rasch or PL models may also be preferred\
    \ for practical reasons such as reduction of the estimated parameters. For a useful\
    \ summary of Rasch model properties, see, for example, Embretson and Reise (1999).\
    \ Rasch and PL IRT models are equal; these models will be referred to as IRT models\
    \ in subsequent chapters.\n\n# Unidimensional IRT Models for Polytom Scored Responses\n\
    \nTo extend the capability of educational assessments and to measure other characteristics\
    \ of individuals, numerous instruments have been developed that use response scales\
    \ and items that are scored polytomously. Examples of assessments in education\
    \ include items that allow for partial credit, constructed response and performance\
    \ items, and multiple-choice items for which response option is selected. Examples\
    \ in the health, social, and behavioral sciences include a myriad of items involving\
    \ rating scales and Likert-type items. The appropriate of IRT applications to\
    \ polytomously scored items is"
