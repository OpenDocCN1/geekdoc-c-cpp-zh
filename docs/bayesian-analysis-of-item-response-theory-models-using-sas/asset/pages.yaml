    # # Introduction


    The item response theory (IRT) models discussed in Chapter 4 apply to dichotomously
    scored items. When items are polytously scored, as constructed-response items
    in educational assessments and rating or Likert-type response items in health,
    social, and behaviours, polytomous IRT models are required. These models represent
    the relationship between a person''s level on the latent trait measured and the
    probability of a particular response. But now there are more than two response
    categories. This chapter focuses on polytomous IRT models where items are also
    assumed to measure one underlying trait.


    There are various multidimensional IRT models. The commonly used models include
    (1) the graded response (GR) model (Samejima, 1969; 1996); (2) a modified GR model
    (Muraki, 1990), also called Muraki''s rating scale (RS) model; (3) the partial
    credit (PC) model (Masters, 1982); (4) the generalized partial credit (GPC) model
    (Muraki, 1992); and (5) the nominal response (NR) model (Bock, 1972).'
