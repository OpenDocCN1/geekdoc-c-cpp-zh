  md: "# Chapter 1: Item Response 9\n\nThe item category boundary parameters may be\
    \ interpreted as the point on the scale at which a score response becomes more\
    \ likely than the preceding score response. Therefore, the parameters reflect\
    \ the relative difficulty associated with the transition from one category to\
    \ the next adjacent category. Because the boundary parameters only reference the\
    \ previous step or response category, there is no requirement that the transitions\
    \ from one score to another be ordered in difficulty despite the requirement that\
    \ the response be easier than the transition from a score of 0 to a score of 1.\
    \ Finally, no slope parameter is included in the model, all items are assumed\
    \ to be equal to the underlying trait being measured.\n\nA general expression\
    \ for the PC model defines the probability of responding at a particular score\
    \ category x (or the number of completed items ) j, given a particular level of\
    \ theta, as the following:\n\n```\n$P_{jk}(\\theta)= \\frac{e^{\\alpha_{jk}\\\
    theta + \\beta_{jk}}}{\\sum_{i=0}^J e^{\\alpha_{ik}\\theta + \\beta_{ik}}}}$$\n\
    ```\n\nfor\n\n```\n$k = 0, 1, 2, \\dots, m_j$\n```\n\nwhere $z_{jk}$ includes\
    \ the following: $e_{k=0}z_{jk}=0$ or $e_{k\\neq0}z_{jk}=1$. To contrast with\
    \ the GR model, the PC model may use to directly derive the probability of the\
    \ score response. This is because the number is an exponential function of the\
    \ difference between a person's theta and each boundary $\\delta_k$ up to a specific\
    \ response (number of steps) divided by a summation of exponential functions of\
    \ $\theta$ and $\\delta_k$ across all possible score responses. Accordingly, Thissen\
    \ and Steinberg (1986) described these models and their derivatives as divide-by-total\
    \ models.\n\nFigure 1.4 presents item category responses for a sample 5-category\
    \ item with four or fewer changes in performance under the PC model (level 0 $\b\
    lack$ level 1, ..., level 3 $\black$ level 4). Under the PC model, the item difficulty\
    \ parameters, $\\delta_k$, reflect the point on the 0 continuum where adjacent\
    \ response probabilities ($k$ and $k-1$) are equal, on the point on the continuum\
    \ where adjacent item category responses interest. This relationship is in contrast\
    \ to the GR model, where the threshold parameters reflect the point on the 0 continuum\
    \ but are steeper. The $\\delta_k$ for the item in the figure reflects an ordered\
    \ set: $-2, -5, 5,$ and $2$. As can be seen when $\\delta_k$ individual has an\
    \ equal probability of responding in the two categories. For example, at $\\theta=-2$,\
    \ the item has the same probability of responding Category 0 and 4. Because the\
    \ item in the figure is widely spaced from one another, each response option would\
    \ likely be endorsed by a number of people, although the numbers in categories\
    \ 0 and 4 would be smaller because there are fewer people in the tail of the distribution.\
    \ Thus, the item in Figure 1.4 reflects a well functioning item.\n\nAs discussed,\
    \ $\\delta_k$ need not be ordered, as in the GR model, because transitions to\
    \ different score levels differ in difficulty. For example, Figure 1.5 presents\
    \ an item under the PC model where the set of $\\delta_k$ parameters are unordered:\
    \ $-2, 5, -5,$ and $2$. From this it much easier to transition from Category 2\
