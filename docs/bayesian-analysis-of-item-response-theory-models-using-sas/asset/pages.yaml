- img_proc: true
  md: '# Parameter Blocking


    Strategy when you have poor mixing is to alter the way parameters are sampled
    or sequentially updated by the strategic use of PARMS statements. Each PARMS statement
    can be used to define a single parameter or a block of parameters. The Metropolis
    algorithm used in PROC MCMC updates the parameters in each PARMS statement simultaneously.
    There are two PARMS statements, one for the single $a$ and one for a block of
    $b_i$ parameters. When parameters exhibit strong dependence you may benefit from
    defining a block of parameters in a single PARMS statement. For example, if $a$
    and $b_i$ parameters were expected to be correlated or exhibit strong dependence,
    the two PARMS statements can be combined into one PARMS statement with a single
    block of parameters $(a, b_1, ..., b_h)$ or PARMS A 1 B: 0. With this specification,
    the Metropolis algorithm updates all the item parameters $(a$ and $b_j)$ jointly.
    Any correlation between parameters is more easily accounted for when updating
    parameters.


    However, blocking a large number of parameters can be tedious because "good mixing"
    may be difficult to achieve when simultaneously sampling a large number of parameters
    (see SAS Help for PROC MCMC, subtitle “Blocking of Parameters”). With a large
    number of parameters, fewer proposed values are accepted unless the PARMS statements
    be specified that reflect small sets of correlated or dependent parameters and
    a blocking strategy adopted that falls between blocking all parameters in a single
    PARMS statement and using separate PARMS statements for each parameter.


    In order to compare these two strategies, Outputs 3.11 and 3.12 present trace
    and autocorrelation plots when separate PARMS statements are used—that is, 6,
    PARMS statements—and plots based on use of a single PARMS statement—that is, the
    PARMS statement A 1 B: 0. The results can be compared against the use of two PARMS
    statements (PARMS A: 1; PARMS B: 0) in the original 1P example (see Output 3.3).


    Although it is difficult to observe in Output 3.11, use of separate PARMS statements
    marginally reduced the observed dependence when compared with the use of two PARMS
    statements. The autocorrelations ranged from .06 to .47 for lag 50 for the original
    program (Program 3.2); when six separate PARMS statements were used, the autocorrelations
    lagged from .02 to .40. However, a disadvantage with the use of sampling each
    parameter individually is that the computational cost increases. In the present
    analysis, the computation time was approximately doubled. In Output 3.12, you
    can also see improvement from the use of a single block of parameters. Here, the
    autocorrelations range from .06 to .27 for lag 50.'
