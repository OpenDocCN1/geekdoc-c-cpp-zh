  md: "# Chapter 8: Bayesian Model-Checking for IRT Models 223\n\nOutput 8.3: Comparing\
    \ Observed and Predicted Item-Test Score Correlations – 1P Model\n\n![](img/dd5368102e19084dcd107a02a82ba37c_238_0.png)\n\
    \nExample 3: Item Fit Plots and Yen's $Q_z$ Measure\n\nAs discussed, classic item-fit\
    \ statistics can be used with PPMC for evaluating the fit of an IRT model for\
    \ each item. Item fit evaluation is used to judge how well an IRT model predicts\
    \ the responses to a particular or the degree of agreement between observed responses\
    \ and model predictions for an item. There are basically two ways to use plots\
    \ of residuals or differences between observed data and model-predictions. For\
    \ example, consider a dichotomously scored item and a discrete group of examinations\
    \ with similar trait estimates. An item fit plot may be drawn to demonstrate the\
    \ differences between the observed proportions correct and model-predictions in\
    \ each group. Another approach is to use item-fit statistics, such as Yen's $Q_z$\
    \ statistic. In this section, we illustrate how to use fit plots and Yen's $Q_z$\
    \ with PPMC to assess the fit of the 1PL model to the LSAT data. For more details\
    \ on item fit, the reader is referred to Chapter 1.\n\n# Item Fit of Proportion\
    \ Correction Statistics\n\nProgram 8.7 compares observed and predicted corrections\
    \ of responses for each LSAT item for different $\theta$ groups using item fit\
    \ plots. Examine are divided into groups based on their $\theta$ estimates or\
    \ by proxy $\theta$ for such test score. We use test scores to form groups. This\
    \ is achieved by using groups based on $\theta$ estimates under the 1PL model.\
    \ Since the LSAT data is dichotomously scored, we use all possible test scores:\
    \ 0, 1, 2, 3, 4, and 5. The examiners will be grouped into 6 groups. In this program,\
    \ the two data sets that are required include the LSAT data set of observed responses\
    \ and a posterior predictive response set generated with NSIM (500) data set of\
    \ 1000 observations or $500 \\times 1000$ observations (Format 1). While this\
    \ data set could be created using Program 8.2, the posterior predictive response\
    \ set (LSAT_PRE) was created in Format 2 using the PREDDST command.\n\nIn the\
    \ program, examines test scores (TS) in the observed response data (LSAT data\
    \ set) are computed first, and the proportions of correct responses for each group\
    \ are obtained using the MEANS procedure by the BY option. The observed proportions\
    \ are saved in the data set OBS_PROPS."
