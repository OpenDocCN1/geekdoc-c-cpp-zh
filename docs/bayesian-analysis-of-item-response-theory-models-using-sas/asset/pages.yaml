    # Introduction


    In many applications, different models may be estimated that reflect competing
    theoretical perspectives about the nature of the item responses and therefore
    competing model specifications. For example, the three dichotomously scored models
    in Chapters 1 and 4 reflect different assumptions about the nature of the items
    (item characteristics), persons (person characteristics), and the prediction of
    item responses. Model comparison methods can be used to evaluate competing models
    and to decide which assumptions about the item and person characteristics are
    modeled and which are not tenable


    This chapter begins with a description of two indices that can be used with the
    MCMC method. This is followed by three examples that compare competing models
    in Chapters 4, 5, and 6. In the programs for each of these, a random sample from
    the joint posterior distribution for model parameters is used to compute some
    of the model comparison indices. Certainly all iterations from the posterior distribution
    can be processed, but because likelihood results for the model comparison indices
    are summarized across persons and items (using means), processing iterations in
    the joint posterior distribution is not necessarily required. Thus, we will show
    how to draw a random sample from the posterior distribution using PROC SURVEYSELECT.
    Furthermore, we will see that the programs differ primarily with respect to the
    IRT model that is used to compute the likelihood of response data. Thus, it is
    straightforward to use any of the illustrated programs for computing the model
    comparison statistics in other model comparison applications.'
