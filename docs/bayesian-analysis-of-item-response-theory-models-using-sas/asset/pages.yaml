    The mean $PPP$ values are also shown in the graphs. These values range from 0.46\
    \ to 0.53, indicating good fit between model predictions and the observed item\
    \ responses.\n\n# Output 8.5: Comparing Observed and Predicted $Q_i$ Measures\
    \ — 1P Model\n\n![](img/dd5368102e19084dcd107a02a82ba37c_246_0.png)\n\nExample\
    \ 4: Observed and Predicted Odds Ratio\nIn order to check if the local independence\
    \ holds in a Bayesian IRT application, you can use the odds ratio ($OR$) or $Y_i$'s\
    \ discrepancy measures between pairs of items. In this example we use PPCMC with\
    \ the $OR$ measure to evaluate if the LSAT data and the DASH data meet the assumption\
    \ of local independence. Note that the $OR$ measure is only a function of the\
    \ data. For example, there are 5 items and 10 item pairs for the LSAT data. Each\
    \ item has one observed $OR$ value based on the observed set data, but 500 predicted\
    \ response sets sets. Each compared with the observed value to see if there are\
    \ any systematic differences.\n\nProgram 8 provides the code to compute the observed\
    \ and predicted $OR$ values and also computes the $PPP$ value for each pair of\
    \ LSAT items. The program assumes that the LSAT data and a set of posterior predictions\
    \ ($LSAT\\_PRED$) are available in the work library. The data set of posterior\
    \ predictions is in the format defined by the PREDICT statement from the PROC\
    \ MCMC command (Format 2).\n\nA macro $OR$ ⓵ is used to iteratively run PROC FREQ\
