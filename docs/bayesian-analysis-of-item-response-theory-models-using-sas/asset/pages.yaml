    # Comparison of the Posterior Densities for the Three Prior Specifications


    Given the differences observed in the prior densities for the threshold parameters
    (see Output 5.1), you can examine any subsequent impact on the posterior densities
    for the parameters. Output 5.13 presents the posterior densities for the threshold
    parameters values for Item 1 under the three different prior density specifications.
    You can see that the differences are between lower bounds (Lower) and the method
    using sorted values (Sort). However there are some modest differences for several
    of the threshold parameters under the method using lower and upper bounds on the
    distributions (Up/Lower). In particular, for the thresholds $b1$, $b2$, and $b3$,
    the densities are shifted slightly higher than those based on the other two methods.
    In terms of comparing the first two moments of the distributions, the moments
    only differed in the hundredths place. So essentially, the point estimates for
    the parameters and parameter errors were essentially identical across the three
    methods.


    Thus, estimation of the GR model for the DASH data set was not sensitive to the
    method used to specify the prior distributions for the threshold parameters. This
    is likely due to the relatively large amount of data in the DASH data set which
    “overwhelmed” the priors. Of course, since real data is analysed, it is not clear
    which density is closer to true values. Therefore more exploration of these different
    prior specifications may be needed.'
