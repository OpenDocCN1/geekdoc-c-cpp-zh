  md: "# 214 Bayesian Analysis of Item Response Theory Using SAS\n\nby $\theta$ estimates.\
    \ The expected frequency in a response category for a $\theta$ subgroup is the\
    \ number of examinees in subgroup times the probability of responding in that\
    \ category for examinees at the mean $\theta$ in the subgroup.\n\nRecently, the\
    \ performance of these different measures with the PPC method has been examined\
    \ (see, for example, Sinclair, 2006; Zhu & Stone, 2011). Under conditions considered\
    \ in these studies, the item-fit statistics were found in detecting missed misfit\
    \ due to the variance in the form of the IRT model, but were ineffective in detecting\
    \ item misfit due to multidimensionality or local dependence.\n\n# Pairwise Measures\n\
    \nTraditionally, dimensionality and local independence assumptions underlying\
    \ IRT models have been evaluated using pairwise statistics reflecting associations\
    \ between responses to items. For example, local-dependence statistics such as\
    \ Yen's $Q_3$ and the odds ratio ($OR$) are examples of pairwise statistics.\n\
    \nYen's $Q_3$ statistic measures the correlations between pairs of items after\
    \ accounting for the latent variable $\theta$ (Yen, 1991). For $j$ and $j'$, $Q_3$\
    \ is defined as $r(d_j, d_{j'})$, where $d$ is the difference between the expected\
    \ and observed response on item $j$. Yen's $Q_3$ can be used with either dichotomous\
    \ or polytous items. Used as a discrepancy measure with PPC, previous studies\
    \ have found that the $Q_3$ was more powerful than pairwise measures in detecting\
    \ multidimensionality and local dependence (for example, Lee et al., 2009; Sinclair\
    \ et al., 2006; Zhu & Stone, 2011).\n\nChen and Th (1997) used odds ratios ($OR$)\
    \ to evaluate local dependence for dichotomous items. For dichotomous items $j$\
    \ and $j'$, $OR$ is computed from $2 \times 2$ tables $n_{pq11}/n_{pq00}$, where\
    \ $n_{pq}$ is the number of examinees observing $p$ or 1 on item $j$ and $q$ or\
    \ 0 on item $j'$. If local dependence is not met, the $OR$ will be larger than\
    \ what is expected under a multidimensional IRT model. The $OR$ has been found\
    \ to be effective for checking several aspects of misfit in the PPC context; using\
    \ $OR$ as a discrepancy measure compared to Yen's $Q_3$ because computation of\
    \ $OR$ is dependent on both the data and model parameters, whereas computation\
    \ of $Q_3$ is\n\nIn contrast to scored items, multiple odds can be computed for\
    \ polytous items since the contingency table is $R \times C$ ($R, C \\ge 2$).\
    \ One approach is to compute global odds ratios (Agresti, 2002). For any two items,\
    \ the $R \\times C$ contingency may be reduced to a $2 \\times 2$ contingency\
    \ by grouping the response categories of each item. The global odds ratio is then\
    \ defined as the cross-ratio of the $2 \\times 2$ table. For example, for items\
    \ with 5 response categories (0–4), categories 3 and 4 may be treated as *correct*\
    \ responses, and categories 0, 1, and 2 treated as incorrect responses. Thus,\
    \ the 5 category reduces to a $2 \\times 2$ table. Zhu & Stone (2011) found the\
    \ global odds ratio was a useful discrepancy measure for evaluating misfit with\
    \ the GR model.\n\n# Person-Fit Measures\n\nPerson-fit statistics produced in\
    \ theist framework may be used with the PPC method. The performance of several\
    \ person-fit statistics with the PPC method has been examined in previous studies\
    \ and the results indicate that some statistics perform better than others in\
    \ a Bayesian framework (see, for example, Glas & Meier, 2003).\n\nOne of the most\
    \ popular person-fit indices is the $l_z$ statistic (Drasgow, Levine, & Williams,\
    \ 1985), which is defined as $l_z = (l_z - E(l_z)) /\\sqrt{Var(l_z)}$, where $l_z$\
    \ is the log-likelihood for an examinee's response pattern and $E(l_z)$ denotes\
    \ the expected value of $l_z$ and $Var(l_z)$ for dichotomous scored items,\n\n\
    ```\n$l_0 = \\sum_{j=1}^{Y} \\{Y_j \\log[P_j(\\theta)] + (1 - Y_j) \\log[1 - P_j(\\\
    theta)]\\}$\n```\n\n*"
