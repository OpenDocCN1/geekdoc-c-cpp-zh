    # PROC MCMC Template for IRT Model Estimation


    This section illustrates a general template for the PROC MCMC commands used to
    estimate IRT models. A template is presented for use with dichotomously scored
    items under the assumption of unidimensionality in the trait being measured. Later
    sections describe modifications to the general template; for example, these modifications
    may be used to address convergence problems. Subsequent chapters illustrate commands
    for extending this template to polytomously scored IRT models (Chapter 5) and
    other more complex models, such as multidimensional IRT models (Chapter 6).'
