    # Visualization of IRT Models


    The IRT model for a dichotomously scored item (0, 1: Incorrect, Correct, No, Yes)
    is typically displayed using an item response curve or item characteristic curve
    (ICC). Figure 1.1 illustrates an ICC for a dichotomously scored item, $P_i(U=1|\theta)$,
    the item response to one latent ability, trait, assumed to determine item performance.
    In the figure, the x-axis corresponds to the latent trait or ability being measured,
    and the y-axis corresponds to the expected probability of responding correctly
    or endorsing the item. As can be seen, the mathematical function reflects a monotonic
    increasing relationship between response probability and the status or level of
    the trait being measured.


    Figure 1.1: Example ICC for a Dichotomously Scored Item (0, 1)


    ![](img/dd5368102e19084dcd107a02a82ba37c_18_0.png)


    In the ICC, the set of item parameters $(\\alpha_i$) for the specific IRT model
    determines the shape of the function. A slope parameter for the ICC is used to
    describe how rapidly the probability of a response changes (sensitivity) as changes
    in the latent trait $\theta$. It also reflects the degree to which the item is
    related to the underlying ability, trait, being measured. Higher slope parameters
    correspond to items that are more sensitive to changes in $\theta$, and provide
    more information for estimating $\theta$.


    A second parameter, the threshold parameter, is on the same scale as the latent
    trait $\theta$ or the location of the ICC. Conceptually, threshold parameters
    reflect the level on the latent trait $(\theta)$ continuum where one response
    becomes more likely than a different response, as well as reflecting the level
    of the trait where more information about $\theta$ is available. For example,
    in Figure 1.1, the probability of a correct response (1) is greater than an incorrect
    response (0) in the region of $\theta >$.


    A lower asymptote parameter may also be included to model the probability of the
    response for examinees with low $\theta$. In Figure 1.1, very-ability examinees
    $(\theta < -2.5)$ have a .20 probability of answering the'
