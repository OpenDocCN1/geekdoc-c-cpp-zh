    # Organization of the Chapter


    The remainder of this chapter describes various types of IRT models that can be
    applied to different types of assessments. These include IRT models for achievement
    and ability tests that use items that are dichotomously scored (correct, incorrect),
    as well as models for constructed item or performance assessments where raters
    type examiners using ordinal response scales with two or more response categories
    (Lame & Stone, 2006). Developers of measures in the health and behavioral sciences
    (for example, personality tests, quality of life measures) can also take advantage
    of IRT models (Embreise & Reese, 2000; Gibbs, Bock, 2007; Immers, Gibbs, & Rush,
    McHonry, 1997; Reese, Hayes, Chang, & Porto, 2007). These types of measures may
    also consist of dichotomously scored items (Yes, as opposed to No) items such
    as rating or Likert-scored items.


    In addition to characterizing IRT models in terms of the types of items that can
    be modeled, IRT models can also be characterized in terms of the number of traits
    being measured: unidimensional IRT models measuring one trait and multidimensional
    IRT models measuring multiple traits. Extensions of IRT models to other testing
    applications include the following:


    +   * tests where raters score responses

    * scales composed of sets of items with common stimuli (tests)

    * populations of examiners that include qualitatively different subpopulations

    * applications in which item responses are nested within clusters of persons


    Finally, evaluating the validity of IRT model applications and estimating IRT
    model parameters are discussed.'
