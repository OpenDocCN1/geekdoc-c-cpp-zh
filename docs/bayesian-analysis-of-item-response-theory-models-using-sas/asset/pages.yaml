  md: "# 20 Bayesian Analysis of Item Response Models Using SAS\n\nYen (1993) discusses\
    \ a possible sources for local item dependence. Some sources reflect unintended\
    \ dimensions that are measured or unmodeled person characteristics, external assistance\
    \ or interference, fatigue, speedness, practice, item or response format, scoring\
    \ rubrics, or differential item functioning among subpopulations. Other sources\
    \ may reflect unmodeled characteristics (for example, halo or len effects), and\
    \ interactions that may include dependence from use of a common passage or stimulus\
    \ for a set of items, effect items that are \"chained\" or organized into sets\
    \ that share them.\n\nSeveral statistics have been proposed to detect the presence\
    \ of local item dependence. Yen (1984; 1993) described a statistic, $Q_d$, which\
    \ examines the differences between examines' observed and expected item performance\
    \ under a given IRT model, and the correlation for these residual terms across\
    \ pairs of items. In essence, the statistic examine the correlation between items\
    \ accounting for overall test performance or ability. A disadvantage of the $Q_d$\
    \ statistic is that it requires estimates of $\theta$ for examines in order to\
    \ capture expected frequencies. Alternatively, Chen and Thissen (1997) discuss\
    \ other statistics that do not depend on the estimates of $\theta$. These statistics\
    \ examine the independence of items based on estimated marginal frequencies under\
    \ the given IRT model.\n\nYen (1993) also discusses ways to manage local independence\
    \ in the different stages of development, administration, and analysis. More relevant\
    \ to the purpose of this book is what can be done at the analysis stage. A common\
    \ approach with dichotomously scored tests is to create test sets of items that\
    \ combines the scores from each set of dependent items into a test (Wainer & Kiel,\
    \ 1987). For example, with reading passages that a passage would have a score\
    \ range of 0 (no correct) to 5 (all correct answers), the test may use IRT models\
    \ for polynom scored responses as discussed above (for example, the GR model).\
    \ Another approach to managing locally dependent item responses is to model the\
    \ dependency of items in IRT models directly. These models incorporate a parameter\
    \ in the model that reflects the degree of dependence among sets of locally dependent\
    \ items or tests (see the section \"Locally Dependent Item Sets (Tests)\" in this\
    \ chapter for detail).\n\n# Form of the IRT Model\n\nA third assumption concerns\
    \ the form of the IRT model, the function and model parameters used to describe\
    \ the relationship between the test being measured and the probability of a response\
    \ for each item (item response function). Although most functions assume that\
    \ the probability of a response is decreasing with increasing levels of the test\
    \ being measured (monotonicity), different models may be included to reflect test\
    \ response performance. For example, the nature of the assessment may dictate\
    \ the item characteristics that are included in the model. However, comparison\
    \ methods may also be used to statistically compare models with different item\
    \ characteristics (for example, IP to 2 IRT models). Chapter 7 discusses model\
    \ comparison techniques that may be used in a Bayesian analysis to compare IRT\
    \ models or models with differing sets of model parameters.\n\n# Speedness\n\n\
    Often included as a specific assumption that a test is nonspeeded, or that theoretically\
    \ has as much time need to respond. In essence, this assumption reflects an unmodeled\
    \ person characteristic because individual differences in examines' test-taking\
    \ behaviors affect test response performance. Hambleton and Swamin (1985) discuss\
    \ several strategies for evaluating the presence of speedness in a testing application.\n\
    \n# Model Fit\n\nThe fit of a model, or the correlation between model predictions\
    \ and observed data, is generally regarded as an important property of model-based\
    \ procedures. When a model does not fit the data, the validity of using results\
    \ (for example, estimated 0 parameters) may be compromised. In general, you can\
    \ evaluate IRT model applications by comparing observed model-predictions—that\
    \ is, by examining model-data fit."
