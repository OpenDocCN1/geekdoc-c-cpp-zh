    It is also possible to consider the suggestion that $c_i$ parameters should not
    be estimated for very easy items. Based on Lord''s criterion (1980), $c_i$ parameters
    for items 1, 4, and 5 should be fixed at 0 based on estimated with the use of
    $a_i$ and $b_i$ parameter estimates in Output 4.4. This type of partially constrained
    model can be estimated with the use of the BEGINNODATA and ENDNODATA statements
    to specify constants for parameters that do not need to be sampled. The BEGINNODATA
    and ENDNODATA statements define a set of statements that are executed only twice:
    at the first and the last observation of the data set. The BEGINNODATA and ENDNODATA
    statements are used for computations that are identical for every observation
    and serve to reduce unnecessary observation-level computations in the execution
    of PROC MCMC.


    The code for this model is provided in Program 4.6. Note that, which are not reported,
    are not substantially different from those in Output 4.13. The only exceptions
