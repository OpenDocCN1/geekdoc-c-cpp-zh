    item correct. In an educational assessment context, these three parameters (slope,
    threshold, lower asymptote) are often referred to as discrimination, difficulty,
    and guessing parameters. While these three parameters have dominated the discussion
    of item parameters in IRT models for dichotomously scored items, other parameters
    have been discussed (for example, an upper asymptote parameter).


    Although item parameters may be compared either numerically or by comparing ICCs
    for different items, the focus is primarily on threshold or difficulty parameters
    when comparing items. Because the items and the latent trait (θ) are on the same
    scale, threshold parameter may be compared with particular θ values or compared
    across items. For example, comparing a threshold value with a value indicates
    how much increase in θ is required to achieve a particular level of performance
    or expected response on an item. Also the value for a particular person provides
    information about the types of items that the person would likely answer correctly
    or the response (Yes, as opposed to No). For example, items with thresholds below
    a person’s θ are more likely to be answered correctly or endorsed.


    Finally, a comparison of threshold values across different items indicates the
    relative difficulty of items in the case of dichotomously scored items. ICCs for
    multiple items may also be displayed in the graph. ICCs that require higher or
    lower levels of the ability or trait to achieve measurable performance would be
    centered to the right (for higher levels) or left (for lower levels) of the ICC
