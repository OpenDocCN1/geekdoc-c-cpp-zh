    # Example 2: Comparing GR and RS-GR Models for Polytomous Scored Items (DASH Item
    Responses)


    For polytomously scored items, it may be useful to compare GR models that share
    a common slope parameter across item applications as opposed to a model where
    separate parameters are estimated. However, for rating scale item applications,
    it may be of particular interest to compare a model that specifies separate scales
    for items (GR) as opposed to a model that specifies a common scale across items
    (RS-GR). This comparison extends to the extent to which respondents are interpreting
    the scale and response options similarly across the items. Because the DASH data
    reflects rated scaled items, comparing the GR and RS-GR models with the DASH data
    is used to illustrate models with polytomously scored items (see Chapter 5 for
    the estimation of polytomously scored models with the DASH data).


    # DIC Results


    Table 7.3 provides the DIC statistics and related components of PROC MCMC for
    the GR and RS-GR models. Based on the data and guidelines for comparing DIC statistics,
    the preferred model for the DASH item responses would be the GR model as opposed
    to the RS-GR model, because the GR reflects the smaller DIC value and the difference
    between the DIC values is greater than 10. Notably, the GR model reflected a standard
    model specification with decomposition of the threshold parameter (see Chapter
    5 for detail). A GR model where the threshold parameter was decomposed into a
    location and category threshold parameters was also examined. This model yielded
    nearly identical DIC (DIC = 17655.47) as the standard GR model.'
