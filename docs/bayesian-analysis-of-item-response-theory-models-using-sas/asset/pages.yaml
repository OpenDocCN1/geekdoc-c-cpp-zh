    # The 3-Parameter IRT Model


    Although the 3-Parameter (3P) model is also used to model responses that are scored
    dichotomously, the model is specifically designed to model testing applications
    where the probability of a correct response is greater than 0 for examinees with
    low θ. For example, consider the ICC in Figure 4.1. In the figure, the graph has
    a lower asymptote that is .20 for 0 < θ < -2. The primary application for this
    model involves the use of multiple-choice tests where examinees can obtain a correct
    response by guessing. In contrast, the 1P and 2P models reflect models in which
    the lower asymptote of the ICC approaches 0, indicating that examinees'
