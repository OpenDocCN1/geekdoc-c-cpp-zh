    \ 107\nAdding Elements to the Graph: Uncertainty in Item Parameters..................................................................\
    \ 109\nAdding Elements to the Graph: Observed Results.....................................................................................\
    \ 111\n\n# Introduction\n\nThree IRT models that may be used with dichotomously\
    \ scored items under the assumption of unidimensionality are the 1-, 2-, and 3-Parameter\
    \ models (see, for example, Hambleton & Swaminathan, 1985). In the general form\
    \ for these three models, the probability that an examinee receives a correct\
    \ response (1 as opposed to 0; Yes, as opposed to No) to the $i^{th}$ item is\
    \ commonly modeled with a logistic function:\n\n> $P(\\theta) = P(U_i=1|\\omega_i,\
    \ \\theta) = \\Psi(z_i) = c_i + (1-c_i)e^{-z_i}$\n\nWhere $\\Psi$ is the cumulative\
    \ function, $z_i = D_i(\\theta - b_i)$ is a logistic function; $D$ is a scaling\
    \ constant; $\theta$ references the same person parameter or examinee characteristic;\
    \ and $\\omega_i$ references a vector of possible item parameters for the item\
    \ $i$; $a_i$ is the slope parameter, $b_i$ is the threshold parameter, and $c_i$\
    \ is the lower asymptote parameter.\n\nThe person parameter reflects a struct\
    \ or scale that corresponds to the characteristic or trait being measured by the\
    \ items. This trait could reflect many types of characteristics such as ability\
    \ in educational assessments, a psychological trait such as depression, or quality\
    \ of life in health assessments. The only requirement for using this model is\
    \ that the construct reflects a single dimension or that the items reflect reliable\
    \ indicators of the construct are dichotomously scored. As described in subsequent\
    \ sections, the three models for dichotomously scored items are differentiated\
    \ only by the item parameters or characteristics that are included in the model.\
    \ For more discussion of these models, see Chapter 1.\n\nThe examples in this\
    \ chapter are based on the data set used in Chapter 3 to describe the general\
    \ template for estimating IRT models using PROC MCMC. This data set contains responses\
    \ of 1000 to 5 multiple-choice items from the Law School Admission Test (LSAT)\
    \ assessment. It is assumed that the data set for item responses (LSAT) has been\
    \ read into the SAS Work library (see Chapter 3 for detail). In addition, all\
    \ models in the PROC MCMC code set $d=1$ and reflect a reparameterization of the\
    \ logistic deviate in order to reduce correlation among parameter estimates (see\
    \ Chapter 3 for a discussion). In the PROC MCMC commands, $z_i=a_i(\\theta-b_i)$\
    \ is reparameterized into an"
  merge: -1
