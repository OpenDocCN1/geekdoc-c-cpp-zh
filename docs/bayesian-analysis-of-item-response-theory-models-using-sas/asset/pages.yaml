    | X8 | | | | | ⚫ | ◑ | ◐ | ⚪ | |

    | X9 | | | | | | | ⚫ | ◑ | |


    A final example uses PPCM results to compare competing models for the bifactor
    model described and estimated in Chapter 6. Recall that the bifactor model is
    a multidimensional IRT model. A competing model of interest is a unidimensional
    IRT model. You can modify Program 8.11 to perform these analyses by changing the
    file, parameter, and model specifications. Although the programs to perform this
    analysis are not presented, Program 8.14 for the analysis based on the bifactor
    model is included as an example on the authors'' webpage for this book.


    Outputs 8.15 and 8.16 present PPCM results using Yen''s Q; statistic as the discrepancy
    measure to compare these two models. This discrepancy measure should be useful
    in this context because dimensionality and local independence assumptions are
    violated. The same data used to illustrate the bifactor model in Chapter 6 are
    used another.


    In Output 8.15, you see that many of the PPP values reflect extreme values (pie
    plots that are nearly all white or nearly all dark), suggesting that the unidimensional
    model does not fit the data. In addition, 10 items clearly fell into two clusters
    that matched the modeled factor structure: Items 1–5 formed one cluster, and Items
    6–10 formed another cluster. This suggests that a two-dimensional model might
    be needed to fit the data, and you can see in Output 8.16 that the PPP values
    are not extreme, suggesting the bifactor model fits the data.


    From these examples, you can see that a PPCM analysis comparing models can supplement
    analyses using the DIC or CPO statistics described in Chapter 7. When you are
    reporting Bayesian analyses of IRT model applications, an advantage of a PPCM
    analysis is that it can be used to compare both the relative and absolute fit
    of different models. In contrast, the DIC and CPO model-comparison indices consider
    the relative fit of different models. Moreover, a PPCM analysis can provide more
    diagnostic information that might suggest alternative models for a specific IRT
    application.'
