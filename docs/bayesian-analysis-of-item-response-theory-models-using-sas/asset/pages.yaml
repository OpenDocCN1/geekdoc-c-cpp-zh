  md: "# 114 Bayesian Analysis of Item Response Models Using SAS\n\nThis chapter illustrates\
    \ how to estimate a variety of IRT models for polytomous responses using PROC\
    \ MCMC. Although the models are briefly described in each section, the reader\
    \ is referred to Chapter 1 for more detail. The data for the illustrations are\
    \ a subset of cases and items from the DASH survey (Stone & Iranga, 2004) and\
    \ responses of 1000 items to five-categories. The DASH survey was designed to\
    \ measure consumer functioning with items about the degree of difficulty, from\
    \ 1 (\"Easy\") to 5 (\"Unusable”), such as a jar, bed, and others. One latent\
    \ trait was found to underlie this survey. In order for you to execute the code\
    \ in this chapter, it is assumed that the SAS data set of items (DASH_DATA) has\
    \ been read into the SAS work library. (See the SAS Press authors' web page for\
    \ this SAS data set.)\n\n# The Generated Response Model\n\nSimeja's (1996, 1999)\
    \ generated response (GR) model is used to model the cumulative probability of\
    \ responding in a particular category or higher for graded ordered responses.\
    \ Specifically, for an item $j$ with $m_j$ categories ($1, 2, ..., m_j$), the\
    \ cumulative probability that a person responds to category score $k$ ($k = 2,\
    \ ..., m_j$) or higher ($P_j^{(\\ge k)}$) is modeled by the logit $z_{j(k-1)}\
    \ = D_a(a\theta - b_{j(k-1)})$, where $D_a$ is the scale factor the trait being\
    \ measured for a person, $a$ is the discrimination parameter for item $j$, and\
    \ $b_{j(k-1)}$ is a threshold between category $k-1$ and item $j$. Given the cumulative\
    \ response probabilities, the probability of receiving a category score $k$ on\
    \ item $j$ is defined as the difference between the cumulative probabilities for\
    \ adjacent categories, with two constraints $P_j^{(0)}(\theta) = 1$ and $P_j^{(m_j+1)}(\t\
    heta) = 0$. Note that within each item, the category thresholds $b_{jk}$ are necessary\
    \ ordered in the GR model. Also, the response function for an individual person,\
    \ but the subscript for the person is excluded for convenience in this equation\
    \ and subsequent.\n\n# Program Template for the GR Model\n\nA preliminary template\
    \ of PROC MCMC code for estimating a GR model using the DASH data is provided\
    \ in Program 5.1. For each five-category item, one slope code ($a_j$) and four\
    \ threshold parameters ($b_{jk}$) are estimated. For the DASH data and GR model,\
    \ a total of 10 slope parameters ($a_1 \\sim a_{40}$) and 40 threshold parameters\
    \ ($b_{1,1} \\sim b_{1,4}, b_{40,1} \\sim b_{40,4}$) are estimated. For the IRT\
    \ model described in Chapter 4, the model is parameterized in one step helper\
    \ to form the logistic $z_{jk} = a\theta - b_{jk}, D=1$ and $b_{jk}=d_{jk}/a$.\
    \ These $b_{jk}$ are saved rather than the $d_{jk}$ parameters because they are\
    \ more interpretable.\n\nThe code in the template above the set of commands to\
    \ define the likelihood of IRT models using polytomously scored items. As discussed\
    \ in Chapter 3, than the probability response model and use MODEL statement to\
    \ specify the conditional distribution of the data you have program the log-likelihood\
    \ function explicitly using SAS programming languages and use the GENERAL statement\
    \ to log the joint distribution for the observed items. If you have SAS/STAT 13\
    \ or earlier, this approach is necessary for IRT models with polytomously scored\
    \ items because there is no general categorical distribution function available\
    \ in the MODEL statement beyond the binary distribution. As will be shown in a\
    \ later section, a general categorical distribution function is available, starting\
    \ in SAS/STAT 13, that can be used with the MODEL statement for estimating polytomously\
    \ scored items. However, this function is less efficient than the code\n\nNotably,\
    \ Program 5.1 assumes that the response categories for each item in the data are\
    \ ordered sequentially from 1 to $m_j$, where $m_j$ is the number of response\
    \ categories for each item $j$. If the item data does not conform to this assumption,\
    \ the item responses will need to be transformed prior to using any of the programs\
    \ in this chapter."
