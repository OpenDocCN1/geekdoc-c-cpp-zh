    PPP value is 0.47 for the mean measure and 0.42 for the standard deviation measure.
    Both are close to 0.50, which also suggests adequate model-fit regarding the total
    score discrepancy measure.


    # Output 8.2: Comparing Observed and Predicted Test Score Statistics—1PL Model


    ![](img/dd5368102e19084dcd107a02a82ba37c_235_0.png)


    # Example 2: Observed and Predicted Item-Test Score Correlations


    Previous research has shown that the item-test score correlation is an measure
    for evaluating the violation of slope or discrimination assumption. This is a
    reasonable supposition because the correlation reflects an item''s power to discriminate
    among examines. Research has also found that this measure is useful for detecting
    local dependence because local dependence affects estimation of item discrimination,
    and item discrimination is related to item-test score correlations (Yen, 1993).
    Therefore, when discrimination or local dependence is a possible source of model
    misfit, the item-test score correlation may be a well measure in a PPC analysis
    of a Bayesian IRT model.


    Program 8.6 compares the observed and predicted item-test score correlations for
    each LSAT item. The data sets for this program include the original LSAT data
    and a set of predicted responses (PRED_DIST_LSAT) in Format 1. As this, the posterior
    responses were generated using a modified version of Program 8.2 rather than using
    the PREDICT statement in PROC MIX program because PROC COR was used to compute
    the correlations for each data set of simulated observations. This data consists
    of 500 sets of observations where each replicated data is observed 1000 times,
    totaling 500,000 observations.


    In Program 8.6, rather than the total score being based on all items, including
    the one being evaluated, the correlations of item scores with these corrected
    total scores are computed for each of the five LSAT items (observed) using PROC
    COR, and only the correlations are saved in the SAS data set OBS_CORRS. The total
    scores are computed for the predicted items, and the correlations are computed
    for each of the 500 simulated data sets. The correlation results from PROC COR
    are then saved in the SAS data set PRED_CORR.


    To compare the correlations for the observed and predicted response data sets,
    the percentiles of the correlations for the predicted data are computed and merged
    with the observed correlations. The observed correlations can be compared with
    the 5th, 50th, and 95th percentiles for correlations for the replicated data in
    the SAS data set OBS_PRED_CORR.'
