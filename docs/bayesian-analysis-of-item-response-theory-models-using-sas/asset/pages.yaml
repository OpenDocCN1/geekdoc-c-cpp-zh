  md: "# Table 2.1: Comparison of a Bayesian and Frequentist Approach to Statistical\
    \ Inference\n\n| Bayesian | Frequentist |\n| --- | --- |\n| Assumes that model\
    \ parameters (such as or proportion) that generated data are unknown random variables.\
    \ This assumption allows for making direct probability statements about the parameters.\
    \ Data are assumed to be fixed but assumed to be a random sample from the population\
    \ for the purpose of making inferences from data to the population. | Assumes\
    \ that sample of data is random but parameters generating the data are unknown\
    \ and fixed. Therefore, direct probability statements cannot be made from any\
    \ one sample but can be made based on a hypothetical sequence of repeated random\
    \ samples and examples.\n| Enters with some expectations or opinions about parameter\
    \ distributions (prior beliefs), observes data, and combines the prior beliefs\
    \ about parameters with the data to obtain updated or posterior distributions\
    \ for parameters. | All information about parameters is derived from the data.\
    \ That is, data is only used to derive parameter estimates.\n| Posterior distribution\
    \ for parameters given the data provides parameter estimates and quantifies the\
    \ uncertainty in parameters. | In likelihood-based inference, the likelihood function\
    \ for the model and data are evaluated. First and second derivatives of the likelihood\
    \ function are obtained for estimating parameters and quantifying uncertainty\
    \ (standard errors for parameters).\n\nHypothesis testing and probability interpretations\
    \ for parameters are based on posterior distribution parameters. Direct probability\
    \ interpretations for parameters are possible; null hypothesis is invalidated\
    \ if a value is within the posterior distribution for a parameter.\n\nFor a Bayesian\
    \ analysis, the posterior distributions for the parameters provide all the information\
    \ needed for statistical inference. Using Bayes theorem, the posterior distribution\
    \ for a parameter $\theta$, given the data $(D)$ or $p(\\theta|D)$, may be obtained\
    \ as follows:\n\n```\n$p(\\theta|D) = \\frac{p(D|\\theta)p(\\theta)}{p(D)}$\n\
    ```\n\nwhere $p(D)$ is the likelihood function (probability of data given possible\
    \ values of $\theta$); $p(\\theta)$ is the prior distribution for the parameter\
    \ $\theta$ or prior belief about $\theta$ before obtaining the data; and $p(D)$\
    \ is the marginal or unconditional probability of data across all possible variables\
    \ or the parameter space for $\theta$. The numerator, $p(D|\\theta)p(\\theta)$,\
    \ reflects an updated belief about the distribution of $\theta$ based on the data.\
    \ The computation requires either summing over the parameter space in the case\
    \ of discrete distributions, or integrating over the parameter space in the case\
    \ of continuous random variables. Note, $p(D)$ is a constant used to normalize\
    \ $p(\\theta|\\D)$ so that the posterior, $p(\\theta|D)$, is a probability distribution.\n\
    \nIn the equation, $p(\\theta|D)$ is a weighted average of knowledge about parameters\
    \ before observations are obtained (prior) and the most likely value given the\
    \ observations (likelihood), and $p(\\theta|D)$ describes the degree of certainty\
    \ or uncertainty in $\theta$ after updating the prior with the observed data.\
    \ Note that $p(\\theta|D)$ is proportional to $p(D|\\theta)p(\\theta)$ because\
    \ $p(D)$ is a constant and does not change the shape of $p(D|\\theta)p(\\theta)$.\n\
    \nIn a Bayesian paradigm, statistical inference is performed from posterior distributions\
    \ for model parameters. For example, means of parameter posterior distributions\
    \ may be used to provide estimates for parameters, standard deviations of posterior\
    \ distributions may be used to provide information about uncertainty or error\
    \ in estimating parameters. In addition to direct probability"
