  md: "# Analysis of Multiple Chains—Gelman-Rubin Test for Convergence\n\nThe Gelman-Rubin\
    \ diagnostics are based on analysis of multiple MCMC chains, each initiated with\
    \ different values for parameters. To obtain these diagnostics, the model must\
    \ first be initialized multiple times with different initial values for parameters.\
    \ The next step is to compare the variance of sampled values within chains and\
    \ between chains for each of the initialized parameters. The commands to perform\
    \ this task use an autoc GELMAN which computes the necessary variance components.\
    \ In addition to the variance estimates, trace plots for the multiple chains can\
    \ also be obtained. For a complete description of the calculations, see the auxiliary\
    \ documentation for PROC MCMC.\n\nAn adaptation of the code in PROC MCMC documentation\
    \ is provided for the IP model example in Program 3.4 and consists of three macro\
    \ calls: %GMCMC, %GELMAN, %TRACE. Note that in the GMCMC macro, most output is\
    \ suppressed in the PROC MCMC statement because the focus is on the Gelman-Rubin\
    \ test. The number of run-cycles is 0 to 3 values from the start of the chains.\
    \ Finally, the option INIT-REINIT is important because this option resets the\
    \ initial values, after the tuning phase, with the different values that are specified\
    \ (for example, A_INIT1, A_INIT2, A_INIT3). The result of executing the macro\
    \ GMCMC is three sets (OUT1, OUT2, and OUT3) that included sample values from\
    \ the three different chains.\n\nThe autocall GELMAN is a built-in macro that\
    \ computes and outputs the variances from the multiple chains that are produced\
    \ by the macro GMCMC. By default, the number of chains is three. The macro TRACE\
    \ overlays the sampled values of the iterations for each chain.\n\n# Program 3.4:\
    \ For Obtaining the Gelman-Rubin Statistics\n\n```\n% let chain = 3; * number\
    \ of parallel chains;\n% let a_init1 = 1; * set of 3 initial values for \"a\"\
    \ parameter;\n% let a_init2 = 2;\n% let a_init3 = 3;\n% let b_init1 = 4; * set\
    \ of 3 initial values for all \"b\" parameters;\n% let b_init2 = 0;\n% let b_init3\
    \ = -4; * number of parameters to test for convergence;\n% let param = 4; * number\
    \ of mc samples;\n% let nsim = 5000;\n% let var = a b1 b2 b3 b4 b5; * specification\
    \ of parameters to test;\n\n% macro gmcmc; * defines a macro to loop proc mcmc\
    \ command for &chain chains;\n% do i = 1 to &chain; do\n% proc mcmc data=lsat\
    \ output=out&i seed=&i nbi=0 nmc=&nsim init=reinit\n% monitor(a b) statistics=(summary)diagnostics=none\
    \ plots=none;\n array b[5];\n array p[5];\n array a &a_init&i;\n params b &b_init&i;\n\
    % prior b ~ normal(0, var=4);\n prior a ~ lognormal(0, var=.25);\n random theta\
    \ ~ normal(0, var=1) subject=obs_;\n% do j = 1 to 5; do\n% p[j] = logistic(a*(theta-b[j]));\n\
    % end;\n% model x1 ~ binary(p1);\n% model x2 ~ binary(p2);\n% model x3 ~ binary(p3);\n\
    % model x4 ~ binary(p4);\n% model x5 ~ binary(p5);\n% end;\n% end;\n% mend;\n\
    ```\n\nods listing; %gmcmc; ods listing;"
