  md: '# Chapter 5: Bayesian Estimation of Unidimensional IRT Models for Polymously-Scored
    Items 117


    Method 1(L)—Use the sampled values for $b_k$ and $d_k$ as lower bounds on the
    distributions for $b_{k+1}$ or $d_{k+1}$


    ```

    | parms d1 -1 d2 -.5 d3 .5 d4 1 |

    | prior d1 ~ normal(0, var=16);

    | prior d2 ~ normal(0, var=16, lower=d1);

    | prior d3 ~ normal(0, var=16, lower=d2);

    | prior d4 ~ normal(0, var=16, lower=d3);

    ```


    Method 2(L/U)—Use sampled values for $b_k$ and $d_k$ as lower and/or upper bounds
    on the distributions for $b_{k+1}$ and $d_{k+1}$


    ```

    | parms d1 -1 d2 -.5 d3 .5 d4 1 |

    | prior d1 ~ normal(0, var=16, upper=d2);

    | prior d2 ~ normal(0, var=16, lower=d1, upper=d3);

    | prior d3 ~ normal(0, var=16, lower=d2, upper=d4);

    | prior d4 ~ normal(0, var=16);

    ```


    Method 3(Sort)—Sort of thresholds and the used parameter values in the response
    probability model (Curtis, 2010):


    ```

    parms q1 -1 q2 -.5 q3 .5 q4 1;

    prior q ~ n(0, sd=4);

    d1=q1;

    d2=q2;

    d3=q3;

    d4=q4;

    call sort(d1, d2, d3, d4);

    ```


    The use of Method 3 PROC MCMC is complicated by the fact that no transformations
    can be performed directly on model parameters specified in PARMS statements, a
    copy of the variables in the PARMS statements may be obtained, and these copied
    variables are used in the response probability model for the GR model to satisfy
    the order constraint. It is also noted that a direct sampling method cannot be
    used with the code as presented for Method 2. Rather, the above presentation is
    used to more easily specify the parameter constraints on the normal distributions.
    Instead, a joint density function must be specified in the next section.


    Output 5.1 presents the prior densities for the four threshold parameters ($d1–$d4$)
    from the three methods where Method 1 is labeled $L$, Method 2 is labeled $L/U$
    for lower or upper bounds, and Method 3 is labeled $Sort$. These graphs can be
    produced by modifying the code presented in Chapter 3 (Program 3.1), stacking
    the data of sampled values from the distributions, and overlaying graphs using
    DENSITYplot graphics.


    As you can see, all three densities are the same mean and variance for the normal
    distributions. While Methods 2(L/U) and 3 (Sort) have similar locations, the spreads
    in the densities are quite different. In contrast, you see that the locations
    of the densities from Method 1 ($L$) are very different from the locations of
    the densities for Methods 2 (L/U) and 3 (Sort). Given the differences between
    the prior densities for the three methods, it may be useful to evaluate the use
    of all three methods with the GR model and the impact on the posterior densities
    for the threshold parameters explored further in a later section. Finally, the
    observation that Methods 1 and 2 are different routes counter to the claim by
    Curtis (2010) that these approaches are essentially equivalent.'
