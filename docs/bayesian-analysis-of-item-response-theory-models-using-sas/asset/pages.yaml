    The parameters can be transformed to conform to Bock’s constraint. $\sum a_{jk}
    = \sum c_{jk} = 0$ across $k$. The program code that follows illustrates centering
    the sampled values that result from executing Program 5.9, and Output 5.24 presents
    output from executing the program code. In the program, centering of the values
    is obtained at each iteration in the posterior results by computing the sum of
    the sampled values for the $a_{jk}$ and $b_{jk}$ parameters for each item. The
    mean based on this sum (sum / 5) is then used to center the values for $a_{jk}$
    and $b_{jk}$ by taking the sampled value minus the mean. PROC MEANS can be used
    to obtain point estimates for the centered values. As you can see in the output
    (Output 5.24), $\sum a_{jk} = \sum c_{jk} = 0$ across $k$ for each item.'
