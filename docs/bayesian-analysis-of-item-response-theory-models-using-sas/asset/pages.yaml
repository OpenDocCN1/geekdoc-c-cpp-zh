  md: "# Chapter 1: Item Response Theory 15\n\nfor dichotomously scored items, and\
    \ simple generalizations of compensatory MIRT models, have been discussed for\
    \ example, in a multidimensional version of the 2P logistic model, all that changes\
    \ for item.j is the logistic deviate in a corresponding slope intercept form:\n\
    \n$P_j(\\thetatheta) = \\frac{e^{z_j}}{1+e^{z_j}}$\n\nwhere, $z_j = D\\alpha_j\\\
    theta + d_j$, $\theta_h$ is the ability level, $\\alpha_{jh}$ is the slope (discrimination)\
    \ parameter for item j on dimension h, and $d_j$ is an intercept for item and\
    \ related to difficulty through a composite function of the slope and difficulty\
    \ parameters for item.j. In matrix notation, the logistic deviate can be expressed\
    \ as $z = D\\alpha\\theta + d$, where $D\\alpha$ is a vector of slope parameters\
    \ and $\\theta$ is a vector of parameters on each of the dimensions. The difference\
    \ between this compensatory MIRT model and its unidimensional counterpart is that\
    \ the response model involves a weighted linear combination of $\theta_h$ and\
    \ $\\alpha_{jh}$ parameters. In other words, multidimensional models are characterized\
    \ with a corresponding slope parameter to reflect the relationship between the\
    \ item and each dimension.\n\nAnalogous to item characteristics (ICCs) for dichotomous\
    \ items (for Example 1), item response surfaces may be used to display the probability\
    \ of response across two dimensions. In introduction to MIRT models, see Ackerman,\
    \ Gierl, and Walker (2003). For other research technical treatment, see for example,\
    \ Ackerman (1994, 1996), McDonald (1999), Muraki & Carlson (1995) and Reckase\
    \ (1997a, 1997b).\n\nNoncompensatory models express response probability as a\
    \ multiplicative function of probabilities associated with each dimension (Sympson,\
    \ 1978). Thus, a threshold (difficulty) parameter is included for each item in\
    \ addition to slope and slope parameters. For example, the 2P logistic model to\
    \ the multidimensional case, a non-compensatory MIRT model for a dichotomous item,j,\
    \ may be expressed as:\n\n$P_j(u=1|\\theta) = \\Psi_j(z_j) = \\frac{e^{z_j}}{1+e^{z_j}}$\n\
    \nwhere $z_j = \\alpha_{jh}(\theta_h - b_{jh})$, $\\alpha_{jh}$ is the slope (discrimination)\
    \ parameter of item j on dimension h, and $b_{jh}$ is the threshold parameter\
    \ for item j on dimension h. As can be seen, this model multiplies the probability\
    \ of a response on each dimension to obtain an overall probability of a response.\
    \ The approach is noncompensatory in nature such that successful performance is\
    \ dependent on successful performance on each dimension. For example, a low probability\
    \ of success on one dimension results in an overall low probability of success\
    \ even if others are high.\n\nNoncompensatory MIRT models have received less attention\
    \ in the literature possibly due to the number of parameters that require estimation.\
    \ However, these models have been effectively used to build IRT models and cognitive\
    \ psychology relates to the measurement of skills and abilities. For example,\
    \ in Embreton's composite model (Embreton, 1997), performance on a task is modeled\
    \ as a multidimensional Rasch model with a profile of cognitive skills identified\
    \ for each task. Each component has an associated ability level and difficulty\
    \ level, and the product of each component provides the probability of success\
    \ on the item. Thus, these models have the potential to understand what makes\
    \ a task difficult and what features require instructional focus. Recently, Embreton\
    \ (2015) extended these models to provide diagnostic measurement of abilities\
    \ for subdomains (components) or skills to further analyze subdomains in broad\
    \ heterogeneous contexts.\n\nNotably, a broader class of classification models,\
    \ which have also been designed to evaluate the extent to which individuals possess\
    \ a multidimensional profile of skills or attributes underlying performance on\
    \ items, have also been developed and discussed in the literature (Rupp, Tilly,\
    \ & Henson, 2010). These models have been characterized as both compensatory and\
    \ noncompensatory MIRT models.\n\nAnother MIRT model that has recently received\
    \ attention is the bactor model. In this model, item responses are determined\
    \ or explained by both a general or dominant factor and orthogonal factors (Gibbons\
    \ & Hedeker, 1992), the bactor model allows for measuring a general"
