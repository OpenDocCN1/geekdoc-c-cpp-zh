  md: "# Chapter 1: Item Response Theory\n\nThe generalized partial credit (GPC) model\
    \ (Muraki, 1992) is a straightforward extension of the PC model. In this model,\
    \ a slope parameter and scaling constant are added equally to the logistic device,\
    \ $z_{jk} = a_j(\theta - \\delta_{jk})$, to relax the assumption that items are\
    \ related equally to the underlying trait being measured. For the GR model, the\
    \ item difficulty parameters, $\\delta_{jk}$, may be decomposed into a location\
    \ parameter $\beta_j$ for each item and category parameters $(\\tau_k$ or $\t\
    au_{jk}$); for example, $\\delta_{jk} = \beta_j + \tau_k$. The values of $\tau_k$\
    \ are not necessarily ordered sequentially, and $\\tau_k$ reflects the difficulty\
    \ of category $k$; relative to other categories, compared to the location parameter\
    \ $\beta_j$. This parametrization is equivalent to the Rating Scale (RS) model\
    \ developed by Aldrich (1978) and Masters and Wright (1984).\n\n# The Nominal\
    \ Response Model\n\nThe nominal response (NR) model was developed for multiple\
    \ choice tests and capturing information about disastrous (Bock, 1972). In these\
    \ types of applications as well as other applications the response options are\
    \ not ordered. Thissen (1993) discusses applications of the NR model, such as\
    \ items with nominal response in personality and attitude assessments. The NR\
    \ model can also be used with Likert or rating scales that filters such as \"\
    Don't Know\". Finally, Thissen, Cai, and Bock (2010) discuss that the nominal\
    \ model could be used only for items with nominal scales, but also to check on\
    \ the ordering of response scale options and used to model sets of item responses\
    \ that have been combined.\n\nThissen (1986) illustrated all the divide-by-total\
    \ models (for example, PC and GPC) are special cases of the general nominal response\
    \ (NR) model. In the NR model, the propensity to endorse order $k$ of item $j$\
    \ is given by\n\n```\n$P_{jk}(\\theta) = \\frac{e^{z_{jk}}}{\\sum_{l=0}^{J} e^{z_{jl}}}$\n\
    ```\n\nwhere $z_{jk} = a_j\\theta + c_{jk}$, $a_j$ is the discrimination parameter,\
    \ and $c_{jk}$ is called the option extremity parameter. For other IRT models,\
    \ the slope parameter for an item category, $a_{\beta}$, reflects the strength\
    \ and direction of the relationship between an item category and 0, and the intercept\
    \ parameter for each item $c_{jk}$, reflects the tendency to endorse option $k$\
    \ at $\\theta=0$. For the model to be identified, $\\Sigma a_{\beta}$ and $\\\
    Sigma c_{\beta}$ across categories are constrained to equal. Alternatively, $a_j$\
    \ and $c_{j0}$ for the first response category of item can be constrained to 0.\n\
    \nFigure 1 shows $P_{jk}(\\theta)$ of an item, given the NR model, in which the\
    \ response scale reflects a 5-category rating scale (1 = not at ... 5 = very much).\
    \ In this example, vectors of parameters for $a_j$ are (0, 2.03, 3.48, 5.0, 6.29)\
    \ and for $c_{jk}$ are (0, 1.91, -4.5, -14, -3.43). In this parametrization, $a_j$\
    \ and $c_{jk}$ are constrained to equal 0. You can see that, in this case, response\
    \ categories become more likely with increased $\\theta$, indicating that the\
    \ linear regression of $\\theta$ on reflects reflects an increasing probability\
    \ of selecting option $k+1$ over $k$.\n\nTo express the parameters in a form similar\
    \ to IRT models, a location parameter, $b_j$, can be derived from a function of\
    \ $a_j$ and $c_{jk}$ ($b_j = -c_{jk}/a_j$). Differing from interpretations of\
    \ the discussed models, the interpretation of these parameters and the location\
    \ of the item category response functions depend on all the response category\
    \ parameters (Baker & Kim, 2004). For example, $b_j$ parameters do not reflect\
    \ location on the $\\theta$ continuum where item category response functions intersect.\
    \ Alternatively, Xu and Xu (2009) discuss $b_{jk}$ being defined as functions\
    \ of $a_j$ and $c_{jk}$ for adjacent categories, to reflect where item category\
    \ response functions for adjacent categories intersect on the 0 continuum. In\
    \ addition location for adjacent categories is defined by $b_{jk} = (c_{jk}-c_{j,k-1})/(a_j-a_j)$.\
    \ For example, the value of $\\theta$, where the adjacent response categories\
    \ for Category 2 and 3 intersect, is given by $b_2 = (c_{j2}-c_{j1})/(a_j-a_j)\
    \ = .32$."
