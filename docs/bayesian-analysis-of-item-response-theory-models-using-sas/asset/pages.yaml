  md: '# Bayesian Analysis of Item Response Models Using SAS


    ability or trait while controlling for the variance that arises from measurement
    of other factors. This model has received a good deal of attention, not only in
    educational assessment, but more recently in health and behavioral assessment
    (Gibbons, Immekus, & Bock, 2007).


    In this model, slope parameters (or factor loadings) are estimated for each item
    on the general factor as well as a secondary factor. For example, in a 6-item
    test, slope parameters ($a_{i0}$) for Items 1–6 are estimated for Factor 1, slope
    parameters ($a_{i2}$) for Items 1–4 are estimated for Factor 2, and slope parameters
    ($a_{i3}$) for Items 5–6 are estimated for Factor 3. In matrix notation this would
    be displayed as:


    ```

    $$\begin{pmatrix} a_{10} & a_{11} \ a_{20} & a_{21} \ a_{30} & a_{31} \ a_{40}
    & a_{41} \ a_{50} & a_{52} \ a_{60} & a_{62} \end{pmatrix}$

    ```


    The bifactor model can be considered a constrained case of a MIRT model where
    the first factor is defined as a general factor, and slope parameters for subsets
    of items are constrained to be 0 on secondary factors.


    # Differential Item Functioning and Mixture IRT Models


    When evaluating the validity of scores, you should evaluate homogeneity and whether
    items function differently across subpopulations (for example, masters versus
    males females). If there is differential item functioning (DIF), measurement of
    the underlying abilities or traits is not invariant across subpopulations. In
    the context of IRT subpopulations measurement invariance does not, or if DIF exists
    when the ICCs for an item differ significantly. In other words, the probability
    of a response is different across subgroups of examines with the same status on
    the trait being measured. If DIF exists, separate IRT models should be estimated
    and reported for subpopulations of examines.


    There are a variety of possible sources for DIF that can cause groups of examinees
    to interpret and respond to questions in different manners. Zumbo (2007) provides
    a historical perspective for the discussion of DIF as well as the future of DIF
    assessment. Sources of DIF that he discusses includes characteristics of test
    items, such as content and format, as well as factors and testing contexts, such
    as testing environment and socioeconomic status.


    DIF can be defined with the use of a multiple-group IRT model. In this approach,
    a test for DIF would involve a model in which item parameters are constrained
    to equal across groups, or unconstrained, if the unconstrained model is preferred,
    then DIF would be indicated. The mean level of the trait or ability being measured
    in each group could also be compared to determine whether differences exist between
    the groups in the abilities or traits that are being measured.


    In the case of a multiple-group approach, the purpose is to evaluate invariance
    variance across subpopulations or groups based on observed variables, such as
    gender, and all members of a subpopulation are assigned to a particular group
    (such as males). However, another purpose of DIF analysis is to detect and characterize
    subgroups of examines based on their performance. In this case, the source or
    sources of item-response heterogeneity are unobserved, and the assignment of examinees
    to latent classes is a random variable that is inferred from the item responses.
    For example, latent classes may consist of predominantly one subpopulation (for
    example, males), or mixtures of subpopulations (for example, those who graduated
    HS), and membership in each latent class is unknown and must be estimated.'
