  md: '# Chapter 8: Bayesian Model-Checking for IRT Models 217


    # Program 8.4: Comparing Observed and Predicted Test Score Distributions–1P Model


    ```

    * CONTROL VARIABLES */

    %let nperson=1000;      /*number of persons*/

    %let nitem=5;            /*number of items*/


    /*obtain the discrepancy measure in the observed dist*/

    data ts_obs;

    set lsat;

    array x(nitem);

    tts=sum(of x);

    run;

    proc freq data=ts_obs;

    tables ts /=out_dist;

    run;


    /* obtain the discrepancy measure in the replicated data */

    %macro ts_

    data ts_pred;

    set lsat_pred;

    sample_n;

    %do i=1 to &nperson;

    tts=0;

    %do j=1 to &nitem;

    tts=x(j).&i;

    %end

    &i=;

    output;

    %end

    keep ts sample;

    run;

    %mend;

    tts;


    /* compute distributions for predicted discrepancy measures */

    proc freq data=ts_pred noprint;

    tables ts /=out_all_preddist; by sample;

    run;

    /* compute frequencies for each test score */

    proc sort data=all_preddist; by ts sample; run;

    proc univariate data=all_preddist noprint;

    var count; by ts;

    out output=pred_pcts pctlpre=p pclts= 5 10 90 95;

    run;

    ```


