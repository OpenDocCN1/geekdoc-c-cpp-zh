  md: "# 240 Bayesian Analysis of Item Response Models Using SAS\n\nsaved in the set\
    \ PPP_LZ. The PPP values can be examined within this dataset for all examinees.\
    \ Extreme values (values < .05 or >95) and corresponding response patterns are\
    \ obtained and saved in a separate SAS data set MISPATTERNS to identify the aberrant\
    \ response patterns or patterns that are not expected under the 1PL model.\n\n\
    Among the 1000, a small number of examinees have aberrant response patterns. These\
    \ mistifying response patterns on the five LSAT items are 00100, 00101, 00110,\
    \ 00111, 01101, 01110, and 11100. From recall that Chapter 4 the five items are\
    \ identified as follows: b3 > b2 > b4 > b5 > b1. That is, Item 3 is the most difficult\
    \ item, and 1 is the easiest under the 1PL model. Thus, an examinee also be able\
    \ to respond correctly on each item. The response pattern 00100 means this person\
    \ answered the most difficult item correctly, but answered easier items incorrectly.\
    \ This would be an unlikely response pattern under the model.\n\nProgram 8.12:\
    \ Comparing Observed and Predicted Measures - LSAT Data\n\n```\n/ control parameters\
    \ */\n%let nitems=5\n%let nperson=1000\n%let nsample=500\n\n/* reconstruct the\
    \ posterior samples * */\ndata modelspar;\n set outpost_sample_lsat;\nsample=n_;\n\
    \ keep a b1-&nitems theta1_theta_&nperson;\nrun;\nndata modelspar;\n set modelspar;\n\
    \ array theta[*] theta1_theta_&nperson;\n do person=1 to &nperson;\ntheta=theta[person];\n\
    output;\nend;\nkeep a b1-&nitems theta sample person;\nrun;\n\n/**macro to compute\
    \ the Lz/ * */\n%macro lz(infile, outfile=);\ndata lz;\n set &infile;\n array\
    \ b[*] b1-&nitems;\n array x[*] x1-&nitems;\nlo=0; elo=0; vlo=0;\ndo j=1 to &nitems;\n\
    z=z*(x[j]-b[j]); /* 1 PRT model used to compute likelihood */\n call logistic(z);\n\
    lo+=x[j])*log(z) + (1-x[j])*log(1-z);\nelo+=elo*(log(z) + (1-z)*log(1-z));\nvlo+=z*(1-z)*log(z/(1-z))**2;\n\
    end;\nlz=(lo-elo)/sqrt(vlo);\n keep sample person lz;\nrun;\nnproc sort data=lz\
    \ by sample;\nproc transpose data=lz out=&outfile prefix=lz; id person; by sample;\
    \ run;\n%mend;\n```"
