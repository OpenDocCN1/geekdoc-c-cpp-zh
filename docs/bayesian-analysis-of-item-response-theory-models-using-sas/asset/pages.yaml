  md: '# About These Authors


    ![](img/dd5368102e19084dcd107a02a82ba37c_12_0.png)


    Clement A. Stone is a professor in the Research Methodology program at the University
    of Pittsburgh School of Education. He is an expert in psychometrics, including
    educational and psychological instrument development and validation, item response
    theory (IRT) models and applications, and Bayesian analysis of IRT models. Also
    an expert in SAS software, he has used SAS extensively in research utilizing simulation
    methods, and he instructs students in the use of SAS. He applies IRT in the development
    and validation of educational, psychological, and behavioral assessments, including
    a research focus on educational achievement, critical thinking, psychosocial stress,
    communication outlets, risk factors for addiction, and physical disability. He
    has published numerous articles, and he coauthored a chapter on the development
    and analysis of performance assessments in Educational Measurement. In addition
    to publishing and reviewing for numerous prominent journals, he has served on
    the editorial boards for the Journal of Educational Measurement, Applied Measurement,
    and the American Educational Research Journal. Stone holds a Ph.D. in research
    methods, measurement, and statistics from the University of Arizona.


    Xiaowan Zhu is an associate professor in the Department of Sociology and a research
    fellow in the Institute for Empirical Social Science Research, Xi’an Jiaotong
    University, China. Formerly, she was a psychometrician for the Data Recognition
    Corporation in the United States, working on large-scale educational assessments.
    She has strong theoretical background, operational experience, and research experience
    in psychometrics and applied statistics. She is especially adept at Bayesian analysis
    of IRT models and has published journal articles on this subject. In addition,
    she has used SAS throughout her research career for general statistical analysis
    and simulation studies. Zhu holds a Ph.D. in research methodology from the University
    of Pittsburgh.


    Learn more about these authors by visiting their author pages, where you can download
    free book excerpts, access example code and data, and read the latest reviews,
    get updates, and more:


    http://support.sas.com/publishing/authors/stone.html

    http://support.sas.com/publishing/authors/zhu.html'
