    # Output 8.14: Item Pair Pie Plots of PPP for Yen''s Q: Measure–RS–GR Model


    | | X2 | X3 | X4 | X5 | X6 | X7 | X8 | X9 | X10 |

    |---|---|---|---|---|---|---|---|---|---||

    | X1 | ⚪ | | | | | | | | |

    | X2 | ◐ | ⚪ | | | | | | | |

    | X3 | ◑ | ◐ | ⚪ | | | | | | | |

    | X4 | ⚫ | ◑ | ◐ | ⚪ | | | | | | |

    | X5 | | ⚫ | ◑ | ◐ | ⚪ | | | | | |

    | X6 | | | ⚫ | ◑ | ◐ | ⚪ | | | | |

