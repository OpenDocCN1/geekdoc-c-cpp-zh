  md: "# 42 Bayesian Analysis of Item Response Models Using SAS\n\non each $D^{rep},i$\
    \ replication provide a distribution of discrepancy measures under the null condition\
    \ of model-data-fit. When a discrepancy measure depends only on the data, the\
    \ discrepancy measure may be denoted as $T(D^{rep})$ for replicated data and $T(D)$\
    \ for observed data. When the discrepancy measure depends on the data and model\
    \ parameters $(\theta)$, the discrepancy measure may be denoted as $T(D^{rep},\t\
    heta)$ for the replicated data and $T(D,\theta)$ for observed data.\n\nYou can\
    \ locate a discrepancy measure computed from $D^{rep,1}, \\dots, D^{rep,R}$ (posterior\
    \ predictive distribution) using graphical displays. For example, a histogram\
    \ for the distribution of $T(D^{rep})$ may be identified in the graph. In addition,\
    \ you can compute predictive probability values (PPP values). A PPP value reflects\
    \ the relative accuracy of $T(D)$, for example, in the distribution of the discrepancy\
    \ measure $T(D^{rep})$ for replication from $p(D^{rep})$, or the:\n\nPPP = P(T(D^{rep})\
    \ \\geq T(D))\n\nwhere a PPP value is the proportion of times across R replications\
    \ that $T(D)$ equals or exceeds $T(D)$ observed. Thus, PPP values reflect the\
    \ relative similarity between the discrepancy measure for the predicted and observed\
    \ data. PPP values near .5 indicate no systematic difference between the realized\
    \ and predictive discrepancies, and thus indicate adequate fit of a model. PPP\
    \ values near 0 or 1 (for example, values < .05 or >95), conversely, the realized\
    \ discrepancies are inconsistent with the posterior predictive discrepancy values,\
    \ and thus indicate model-data-fit (Gelman et al., 2014).\n\nIt should be noted\
    \ that the PPP values should not be interpreted in the same way as traditional\
    \ hypothesis-p-values. Both are defined as tail-area probabilities, PPP values\
    \ are not necessarily distributed as expected and to be closer to .5 more often\
    \ than would be expected. As a result, using PPP values in a traditional hypothesis\
    \ testing framework would lead to a conservative test (see example, Levy, 2006;\
    \ Sinharay, 2005; Sinharay et al., 2006).\n\nPPMC has also been found in model\
    \ comparisons when Bayesian estimation is used (see example, Sinharay, 2005).\
    \ The relative fit of a set of candidate models can be evaluated by comparing\
    \ the numbers of extreme PPP values for the discrepancy measure(s) for the different\
    \ models. A model with fewer extreme PPP values is considered to fit the data\
    \ better than an alternative model with larger numbers of extreme PPP values.\n\
    \nAs you might imagine, selecting appropriate discrepancy measures is an important\
    \ consideration in applications of the PPMC method, and it should be chosen to\
    \ reflect sources of potential misfit. The method and the choice of PPMC discrepancy\
    \ measures in the context of IRT models and different testing applications are\
    \ discussed in detail in Chapter 8."
