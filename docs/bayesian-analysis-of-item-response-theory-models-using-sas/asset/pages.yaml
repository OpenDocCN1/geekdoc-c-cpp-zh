  md: "# Program 4.3: PROC MCMC Commands for the 2P IRT Model with Hierarchical Priors\n\
    \n```\nproc mcmc data=lsat logistic_out=lsat_bayes seed=23 nbi=5000 nmc=20000\n\
    threads = 8 monitor=(a b mu var_a);\n=\narray a[5]; array b[5]; array d[5]; array\
    \ p[5];\n\nparms a1 d1 0;\nparms a2 d2 0;\nparms a3 d3 0;\nparms a4 d4 0;\nparms\
    \ a5 d5 0;\n\nparms a1 1 mu_var_a1;\n\nprior d = normal(0,var_a, lower=-6, upper=6);\n\
    prior a = normal(mu_a, var=var_a, lower=0);\nprior mu_a = normal(1,var=100, lower=0);\n\
    prior var_a = gamma(1,scale=1);\n\nrandom theta = normal(0,var=1) subject=obs_j;\n\
    do j=1 to 5\n  p[j] = logistic(a[j])*theta-d[j]);\n b[j]=d[j]/a[j];\nend;\n\n\
    model x1 = binary(p1);\nmodel x2 = binary(p2);\nmodel x3 = binary(p3);\nmodel\
    \ x4 = binary(p4);\nmodel x5 = binary(p5);\nrun;\n```\n\nOutput 4.9 presents the\
    \ posterior summary statistics for the item parameters, as well as the hyperparameters\
    \ (mean and variance) for the slope parameters. Output 4.10 and 4.11 present the\
    \ diagnostic plots for only the hyperparameters because the other plots were similar\
    \ to those for the standard 2P model in the previous section (Outputs 4.5 – 4.6).\n\
    \nFocusing on the hyperparameters in Output 4.9, the mean for the slope parameters\
    \ (MU_A) is 74, and the variance for the slope parameters (VAR_A) is 10. Examining\
    \ the slope parameters for the 2P model in Output 4.4, we see that the slope parameters\
    \ are relatively similar, varying from 61–90. It is expected that the variance\
    \ (VAR_A) would be relatively small in the hybrid 2P model. In addition, the mean\
    \ for the five slope parameters in the 2P model is ~76, which is similar to the\
    \ hyperparameter mean (MU A) for the hybrid 2P model. It should also be noted\
    \ that the slope parameters in the hybrid 2P model are more similar, ranging from\
    \ .72–84 in comparison with those from the 2P model. This is a typical result\
    \ when using hierarchical priors. The hierarchical prior “shrinks” the parameters\
    \ to a common value, in this case the of .75 from the 1P model. As a result, the\
    \ standard deviations for the slope parameters in the hybrid 2P model are also\
    \ lower than those in the standard 2P model.\n\nFinally, as Fox (2010) specified,\
    \ a relatively informative prior for the variance parameter (VAR_A~GAMMA(1,SCALE=1))\
    \ was used rather than a more informative prior such as VAR_A~GAMMA(1,SCALE=1).\
    \ When using hierarchical priors, the data are used to estimate the parameters—in\
    \ this case the mean and variance for the set of α parameters. However, when there\
    \ is little data, as in this case with 5 items, the priors on the mean and variance\
    \ parameters in particular can overwhelm the data. If a more uninformative prior\
    \ had been used, it would increase the variance estimate substantially, which\
    \ does"
