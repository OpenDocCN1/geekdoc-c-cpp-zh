  md: '# Chapter 8: Bayesian Model-Checking for IRT Models 245


    A second example involves another comparison between competing models with the
    DASH data consist of rating scaled items. For these types of applications, it
    may be of particular interest to compare a model that separate response scales
    for items (GR) as opposed to a model that shares a common response scale across
    items (RS-GR). This comparison determines the extent to which respondents interpreting
    the scale and response options similarly across the items.


    In the model comparison results in Chapter 7, the GR model was found to be the
    preferred model based on both CSO statistics and DIC statistics. To compare these
    models using a PPC analysis, Yen''s $Q_3$ measure was used as the discrepancy
    measure. Output 8.13 presents the pie plots of $PPP$ values for the GR model,
    and Output 8.14 presents that the pattern in the $PPP$ values (degree pie plots
    are dark or white) is nearly equivalent across the two graphs. Thus, with respect
    to Yen''s $Q_3$ statistic as the discrepancy measure, the two models appear very
    similar.


    This similarity counter the example comparing the GR and RS-GR models in Chapter
    7. In that example, the GR model was found to better approximate the DASH item
    responses than the RS-GR model. This PPC example should illustrate that the choice
    of discrepancy measure is important. As discussed, discrepancy measures should
    be chosen to reflect potential sources of most relevant to the models under evaluation.
    In addition, multiple discrepancy measures should be used to evaluate models.
    Because they violate the assumption of local dependence, the measure may not be
    sensitive to the type of response scale assumed under different GR models (common
    and separate response scales). Thus, another measure, such as Yen''s $Q_3$ statistic
    may prompt another interpretation about the comparison of the two models. The
    analysis is left to the reader to interpret as appropriate.


