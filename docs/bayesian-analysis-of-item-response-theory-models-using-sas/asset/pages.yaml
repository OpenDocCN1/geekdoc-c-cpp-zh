  md: "# Chapter 1: Item Response Theory 21\n\nThere are two types of model fit that\
    \ can be examined: (1) item fit that can be evaluated for sets of items (test\
    \ level) or for individuals (item level). Lack of fit for items indicates that\
    \ observed responses (across categories) do not conform to model-based expectations\
    \ as the assumed model and item parameters. In other words, lack of fit for items\
    \ indicates that the assumed IRT model has uncertainty variance because of how\
    \ examinees respond to the items. Person fit, on the other hand, refers to the\
    \ value of model parameter estimates for specific items. In other words, the assumed\
    \ IRT model and parameter estimates have uncertainty variance for a specific examinee\
    \ because they should not be used in combination with an examinee's response (response\
    \ pattern) to estimate his or her ability or trait.\n\nBecause IRT predicts expected\
    \ response score for each examinee, $E[Y_i] = P(Y_i|theta)$, and predictions of\
    \ expected score in a test for each examinee, these predictions may be summarized\
    \ across categories and compared with observed results. For example, at the test\
    \ level, the observed number of examinees with each possible total or summed score\
    \ can be compared with model-based expectations (see, for example, Beginning &\
    \ Glas, 2001; Orlandi & Thickness, 2000); if the number of response patterns is\
    \ reasonably small, observed counts of individuals with each pattern can be compared\
    \ with expected counts under the model.\n\nFor multidimensional IRT models, individual\
    \ item fit has typically been assessed by comparing observed item performance\
    \ for various subgroups of examinees with performance that is predicted under\
    \ the chosen model. For each item, a goodness-of-fit test can be obtained as follows:\n\
    \n+   1. Estimate the IRT model parameters ($\theta$)\n2. Approximate the continuous\
    \ distribution for $\theta$ by a small number of discrete subgroups (e.g., 10\
    \ subgroups)\n3. Cross-classify items, using their $\theta$ estimate and their\
    \ response score, in a $G x K$ table, where $G$ corresponds to the number of $\t\
    heta$ subgroups and $K$ represents the number of response categories.\n4. Construct\
    \ an observed score distribution for each $\theta$ subgroup by pooling or tallying\
    \ the number of examinees in each combination of $\theta$ subgroup and score categories.\n\
    5. Construct an expected score distribution across score categories for each $\t\
    heta$ subgroup using the IRT model, item parameter estimates, and a $\theta$ level\
    \ representing the discrete ability subgroups (for example, midpoint of score\
    \ distribution)\n6. Compare model-based score distributions from Step 5 with observed\
    \ score distributions from Step 4, using residual-based statistics and goodness-of-fit\
    \ statistics (see for detail, Hamlett & Swaminathan, 1985; Yen & Fitzpatrick,\
    \ 2006).\n\nRather than focus on the predictions afforded by each examinee or\
    \ set of items under the model, person fit is concerned with whether a particular\
    \ examinee's response pattern conforms to the been model. In the case of dichotomously\
    \ scored items, an IRT model implies examinees with low $\theta$ would be expected\
    \ to respond correctly to easy items and incorrectly to more difficult items;\
    \ whereas examinees with high $\theta$ would be expected to respond correctly\
    \ to both easy and difficult items. A response pattern that does not match the\
    \ model is called *aberrant* and compromises inferences about an examinee's estimated\
    \ score ($\theta$). There are a number of possible sources for aberrant responses\
    \ patterns, including for example, cheating and careless reading in the case of\
    \ educational assessments, and individuals engaged in response sets that are socially\
    \ desirable or responsive in the case of psychological and behavioral assessments.\n\
    \nOne common approach to assessing person fit is to compare the relative likelihood\
    \ of an examinee's observed pattern ($\theta$), the IRT model parameter estimates\
    \ ($\\alpha, \theta$), in a population of examinees with $\theta = \theta$. For\
    \ example, a $F$ statistic that assumes a standard null distribution has been\
    \ discussed (Draskow, Levine, & Williams, 1985) as well as other person fit statistics\
    \ (Karabutatos, 2003 for a review of 36 person fit statistics).\n\nIn a Bayesian\
    \ approach, the posterior model-checking (PPMC) is a popular model checking and\
    \ has proved useful for evaluating model fit with IRT models (see, for example,\
    \ Béguin &"
