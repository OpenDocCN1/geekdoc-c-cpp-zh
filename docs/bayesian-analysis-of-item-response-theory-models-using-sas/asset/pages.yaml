  md: '# Chapter 7: Bayesian Comparison of IRT Models 193


    # Example 1: Comparing Models for Dichotomously Scored Items (LSAT Data)


    For dichotomously scored items, it is useful to capture the application of the
    1P, 2P, and 3P models in item response data in order to evaluate the extent to
    which different model specifications and item characteristics capture the response
    patterns. In particular, we are interested in whether separate slope andor guessing
    parameters are useful for describing the items. The estimation of the three models
    is illustrated using the LSAT data in Chapters 3 and 4. The example in this section
    will compare the three models using the DIC and CPO indices to examine which model
    conforms better to the LSAT data.


    # DIC Results


    Table 7.1 provides the DIC statistics and related components from PROC MCMC Based
    on the DIC statistics and the above, the preferred model for the LSAT item responses
    would be the 2P IRT model because this reflects the smallest DIC value, and the
    difference between the DIC values for the 2P model and the other models is greater
    than 10.


    This conclusion is somewhat different from the discussion in Chapter 4 that comparatively
    described the model estimates across the three models (see "Comparison of Results
    Based on MML Estimation"). Recall, that there was some variability in the slope
    parameter estimates in the 2P model was (.61–90). As the 3P model, recall from
    Chapter 4, it could be argued that 3 of the 5 guessing parameters (ci) could be
    fixed at 0. This would suggest that a 2P model was more appropriate for these
    items.


    # Table 7.1 DIC Results Comparing the 1P, 2P, and 3P Models–LSAT data


    | DIC | 1P | 2P | 3P |

    |---|---|---|--|

    | Dbar | 4,589.98 | 4,568.46 | 4,565.01 |

    | Dmean | 4,288.84 | 4,270.85 | 4,238.37 |

    | pd | 301.16 | 297.82 | 326.64 |

    | DIC | 4,891.16 | 4,866.47 | 4,891.65 |


    The components of the DIC statistic can also be examined. Given that the variance
    underlying Dbar and Dmean corresponds to the statistic for nested models, –2–likelihood
    accumulated across observations, these statistics can also be used to measure
    how well the model describes the data, whereas Dmean measures how well the “best”
    model (based on point estimates for the model) describes the. For these both,
    smaller values are observed from the 1P to 3P models. This indicates improved
    in relative fit across the models. However, the statistics do not capture complexity
    as well as the DIC.


    In addition, the difference in Dmean for nested models is to be distributed as
    chi-square with df equal to the difference in number of estimated parameters (Spiegelhalher,
    2002). In the 1P and 2P models, the difference chi-square is 17.99 with 5 df,
    corresponding to the 5 slope parameters that the additional slope parameters are
    contributing significantly to the fit of the model. However, while this comparison
    is consistent with the DIC values, the difference of Dmean for the 2P versus 3P
    models, indicates that the added c_i parameters also contribute significantly
    to model fit– difference chi-square = 32.8 with 5 df. Thus, it is not entirely
    clear whether the difference in Dmean for statistic models can be used for model
    comparisons, with the LSAT data.


    Finally, an examination of the pd values, reflecting the number of effective parameters,
    represents a paradoxical result. As you can see, pd is lower for the 2P model,
    a model that includes more parameters than the 1P model. Recall, that by definition,
    pd is the difference between the “best” and the average (Dbar) across iterations.
    If pd reflected the true difference in parameters between the 1P and 2P models
    (5), Dmean might be expected to be greater for the 2P model. Because'
