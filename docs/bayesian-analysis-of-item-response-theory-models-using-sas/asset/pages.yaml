  md: "# Bayesian Model Comparison Indices\n\nAs discussed in Chapter 2, in a Bayesian\
    \ paradigm, the model comparison indices are based on information criteria and\
    \ the Bayes factors. These classes of indices can be used to assess the relative\
    \ fit between competing models but do not address the absolute fit of any particular\
    \ model or the degree to which any particular model best approximates the data.\
    \ Absolute fit in a Bayesian paradigm is generally assessed using posterior predictive\
    \ checks (PPMC). PPMC analysis is considered in detail in Chapter 8.\n\n# Deviance\
    \ Information Criterion\n\nThe Deviance Information Criterion (DIC; Spiegelhalter\
    \ et al., 2002) is a model comparison tool similar to the well-known likelihood-based\
    \ information criteria: Akaike Information Criterion (AIC; Akaike, 1974) and the\
    \ Bayes Information Criterion (BIC; Schwarz, 1978). DIC can be used to compare\
    \ nested or unnested models, as well as models that are non-independent-and-identically\
    \ distributed variables.\n\nSimilar to other information criteria identifying\
    \ a preferred model, the DIC index weights model fit based on likelihood functions\
    \ and model complexity or the number of model parameters. DIC was developed because\
    \ MCMC estimation uses prior information, and the actual number of parameters\
    \ cannot be clearly identified for AIC and BIC indices. The DIC is widely used\
    \ with Bayesian estimation and is defined as:\n\n```\n$DIC = D(\\bar{\\delta})\
    \ + p_D$\n```\n\nwhere $D(\bar{\\delta})$ is the posterior mean of the deviance\
    \ across iterations and measures how well the data fits the model using the likelihood\
    \ function ($-log L(\\delta)$) and the sampled IRT model parameter values ($\\\
    delta$) at each iteration; $p_D$ is used to account for model complexity or overfitting;\
    \ $p_D$ is computed by the difference $D(\bar{\\delta})$ and the deviance based\
    \ on the likelihood function at the posterior mean of model parameters, $D(\\\
    hat{\\delta})$.\n\nWhen interpreting DIC values across competing models, smaller\
    \ values of DIC indicate better relative fit. However, there is no statistical\
    \ hypothesis test to perform DIC values. Instead, the guidelines for interpreting\
    \ differences in DIC for models have been discussed: differences of more than\
    \ 10 \"important\" differences, differences between 5 and 10 reflect \"substantial\"\
    , differences less than 5 are insignificant (Lum, Jackson, Thomas, & Spiegelhalter,\
    \ 2013). A cautionary note is that DIC should be used with caution with missing\
    \ data because the likelihood is not undefined (Linn et al., 2013). In addition,\
    \ DIC assumes that the posterior mean is an accurate and appropriate estimate\
    \ from the posterior distribution. If this is not the case, the posterior density\
    \ reflects extreme skewness or bimodality, the DIC should probably not be used.\n\
    \n# Conditional Predictive Ord\n\nA common approach to selecting a preferred model\
    \ from competing models in a Bayesian analysis is to compute the Bayes factors\
    \ (BF). The BF is defined as the posterior odds of Model 1 in relation to Model\
    \ 2 divided by the prior for Model 1 to Model 2. This ratio reduces to the ratio\
    \ of marginal likelihoods of the data across the parameter space for each model.\n\
    \nHowever, computation of the Bayes factors has practical and theoretical limitations,\
    \ computation when the prior is vague or for highly parameterized models. In order\
    \ to overcome these problems, alternative criteria called Pseudo-Bayes factors\
    \ (PsBF) have been proposed as surrogates for BF (Gisser & Eddy, 1979; Gelfand,\
    \ Dey & Chang, 1992; Kim & Bolt, 2007). PsBF indices approximate the marginal\
    \ densities in the BF when using conditional predictive ordinates (CPO). As discussed\
    \ in Chapter 2, the CPO index for any model can be defined as $\\prod_{i=1}^n\
    \ (CPO_i | M)$, and with larger CPO value is preferred."
  merge: -1
  pgno: 205
