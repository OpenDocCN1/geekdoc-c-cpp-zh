  md: '# Example PPMC Applications


    This section presents examples to illustrate implementation of PPMC methods using
    different discrepancy measures with IRT models. We continue to use the LSAT data
    for evaluating the fit of dichotomous IRT models, and the DASH data for the fit
    of polytous models. It is assumed that the posterior predictive response data
    sets are already simulated before the programs in this section are run. A subset
    of the discrepancy measures discussed above are used due to the space limitations,
    but at least one of the measures in each type of measure is illustrated. As mentioned,
    the display of the results and PPP values use SAS Graphics Template (GTL) commands.
    Because the focus of this chapter is on conducting the PPMC analysis, the commands
    used to generate graphs in this chapter are not presented but are included in
    the programs on the authors'' web site for this [INSERT URL]. The reader interested
    in the graphs should consult SAS GTL documentation.


    # Example 1: Observed and Predicted Test Score Distributions—LSAT Data


    The overall fit of the IP model to the LSAT data was evaluated using the total
    score distribution as the discrepancy measure. The total score distribution contains
    the frequencies of the persons for each possible total or or score across the
    tests. This analysis was conducted using Program 8.4, which includes the SAS code
    used for comparing the test distributions for the observed and predicted responses.
    In the IP model estimated, using NSIM 500 predicted response sets were simulated
    from the posterior predictive distribution and saved in the SAS data set LSAT_PRED.


    From Program 8.4, you can see that the total score for each examine in the observed
    data (LSAT data) is computed first ①, and the frequencies of test scores were
    observed using the PROC FREQ procedure. The observed frequencies are saved in
    the SAS data set OBS_DIST ②. The same discrepancy measure, total score, is then
    computed for each predicted data set to obtain the test score frequency distributions
    for predicted responses are saved in the SAS data set ALL_PREDICT ③. The summary
    results (frequencies) are saved using the macro TS ④. PROC UNIVARIATE is used
    to compute the 5th, 10th, 50th, 90th, and 95th percentiles of the predicted frequencies
    for each test value score. These percentiles are saved in the SAS data set PRED_PCTS
    ⑤.


    To compare the observed and predicted test score distributions, the frequency
    distribution for the observed data and the 5th, 50th, and 95th percentiles for
    the frequency distributions from the predicted responses can be examined and merged
    with the SAS data set OBS_PRED ⑱ or plotted using SERIESPLOT statements and SAS
    GTL commands.


    You should note that the format of the posterior predictive data set is produced
    by using the PREDICT set (Format 2) in PROC MCMC—that is, NSIM rows of predictions
    (500) in which each row contains the predicted responses for all observations
    in the LSAT data set (1000). In order to use PROC FREQ with a BY statement, you
    must transform this data set to Format 1 so that the number of observations in
    the posterior predictive data set is 1000×500. This task is accomplished with
    the macro TS in Program 8.4 ⑗. Alternatively, Program 8.2 could have been used
    to create the posterior predictive data set in Format 1 directly.'
