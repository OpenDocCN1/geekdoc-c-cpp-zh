  md: "# Locally Dependent Item Sets (Testlets)\n\nFor assessment applications that\
    \ use testlets, one solution is to sum the item effects within each testlet into\
    \ a single item and use an IRT model for polytomous items. However, this approach\
    \ ignores information available from each item, and the approach can be effectively\
    \ used only for dichotomous test items. Alternatively, item level information\
    \ may be retained by adapting an IRT model to account for the dependence between\
    \ items. For example, a modified GR model for testlets proposed by Wang, Bradley,\
    \ and Weiner (2002) can be estimated for applications that involve polytomous\
    \ items. In this model, the probability that the $i^{th}$ examinee receives category\
    \ score $k$ ($k=2, \\dots$) or higher on item within testlet $d(j)$ is defined\
    \ as:\n\n```\n$P_{ijk}(\theta) = \\frac{e^{\\alpha_{ij}(\theta-Y_{id}(j))}}{1+e^{\\\
    alpha_{ij}(\theta-Y_{id}(j))}}$\n```\n\nwhere $\\alpha_{ij}$ is a random person-specific\
    \ effect added to the GR model to represent the interaction of a person with the\
    \ item and the dependence between items within a testlet $d_{ij}$. In this model,\
    \ $\theta_i$ is typically assumed to have a N(0,1) distribution, and $Y_{id}(j)$\
    \ are assumed to be independent of $\theta_i$. The values of $Y_{id}(j)$ are assumed\
    \ to be constant for an examinee over all items within a given testlet. Furthermore,\
    \ the testlet effect is assumed to satisfy the constraint $\\sum Y_{id}(j)=0$.\
    \ Because the variances of the testlet effects $(\\sigma_{ij}^2)$ are test-specific,\
    \ the dependence increases when $\\sigma_{ij} \\to 0$, the items can be treated\
    \ as conditionally independent. Ip (2010) discusses that the item parameters for\
    \ testlets do not necessarily have the same as parameters from standard IRT models\
    \ because the interpretations are conditional on the values of the person-specific\
    \ test effects.\n\n# Rater Effects\n\nOne rater effect that has received much\
    \ attention in the literature is severity/leniency; or the tendency to rate items\
    \ at low or high of the scoring rubric (Wolfe, 2004). Applications of measurement\
    \ to these types of assessments can incorporate rater effects and behaviors into\
    \ the prediction of performance. A model described by Linacre (1989), the many-face\
    \ Rach measurement model (MFRM), is an extension of Aldrich's Rating Scale model\
    \ that includes an additional parameter to quantify the severity for the $r^{th}$\
    \ rater $(\\lambda_r)$.\n\n```\n$P_{ijr}(\theta) = \\frac{e^{\\alpha_{ij}(\theta-b_j-\\\
    lambda_r)}}{\\sum_{k=0}^{m} e^{\\alpha_{ij}(\theta-b_j-\\lambda_r)}\n```\n\nFor\
    \ $k=0, 1, \\dots, m$ for item $j$. In this model, the probability of rater rating\
    \ $x$ to item $j$ by rater $r$ is a function of the examinee's ability $(\theta)$;\
    \ the difficulty level for item $j$ ($b_j$); the gift level $k$ relative to $k-1$\
    \ for item); or the boundary categories on the rating scale $(\\delta_k)$; and\
    \ the severity of rater $(\\lambda_r)$. Furthermore, conditional independence\
    \ is assumed over raters and items. The severity of accuracy is considered when\
    \ one estimates both item and person parameters. If the model is appropriate,\
    \ the parameters are subsequently invariant to subsets of raters.\n\nNotably,\
    \ other factors or dimensions of the assessment can also be modeled. For example,\
    \ subcomponents or domains of the test such as analytic scoring rubrics, could\
    \ be included. If gender and time factors are included in the model, interaction\
    \ effects involving these factors and the rater effect could be examined to reveal\
    \ rater bias to gender or \"rater drift\" over. For more detail about the MFRM\
    \ model and applications to performance assessments and indices to identify random\
    \ errors, see England (1997, 2002).\n\nOne issue with the MFRM model involves\
    \ applications where assessments are scored with multiple raters. When multiple\
    \ raters score the same response, the MFRM model cannot account for the dependency\
    \ among rater response judgments. Research has found that proficiency estimates\
    \ may have lower than expected standards (Bock, Brennan, and Maki, 1999; Dongohue\
    \ & Hobby, 2000; Patz, 1996; Wilson & Hoskens, 2001). Patz, Junker, Johnson, and\
    \ Mariano (2002) discuss"
  merge: -1
