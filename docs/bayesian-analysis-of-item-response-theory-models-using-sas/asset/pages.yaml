  md: "# 236 Bayesian Analysis of Item Response Models Using SAS\n\n# Example 5: Observed\
    \ and Predicted Yen’s Q3 Measure\n\nIn Example 4, the PPMC with the global OR\
    \ measure indicates that number of the DASH item pairs violate the local independence\
    \ assumption. In this section, we use Yen’s Q3 statistic as the discrepancy measure\
    \ to see if the same conclusion can be drawn. Different from the OR measure, Yen’s\
    \ Q3 measure is a function of both data and parameters. An advantage of Yen’s\
    \ Q3 statistic as a discrepancy measure is that you don’t need to worry about\
    \ the construction of global OR values for poorly scored items.\n\nProgram 8.11\
    \ uses code to implement PPMC with Yen’s Q3 measure and the DASH data. The first\
    \ step is to read in the 500 samples of possible estimates (OUT_SAMPLE_DASH) and\
    \ compute the expected items for each person based on the GR model and expected\
    \ value. The expected items are saved in the data set EX_RESP. A macro Q3 is used\
    \ to obtain the Q3 values for each item pair. This macro requires two input files:\
    \ the observed response file and the expected response file (EXRESFILE). The obtained\
    \ Q3 values are saved in the data set OUTFILE.\n\nYou can see that in the code,\
    \ the observed response file and the expected response file are merged into one.\
    \ The results reflecting differences between observed and expected item responses\
    \ are calculated. For each item pair, the Q3 value is the correlation between\
    \ residuals obtained through PROC COR.\n\nTo compute the observed Q3 values, the\
    \ macro produced DASH data (DASH_DATA) is modified with the macro Q3. It produces\
    \ values for all 45 pairs (saved in the data set OBS Q3). The variables Q3 values\
    \ are changed to Q3OBS01–Q3OBS45 using the rename statement. Similar procedures\
    \ are applied to the predicted response data, and the Q3 values for all 45 item\
    \ pairs are saved in the data set PRE_Q3.\n\nThe observed and predicted Q3 values\
    \ are merged into the data set OBS_PRE_Q3 and the PPP values for all items are\
    \ saved in the variables PPP–PPP45 in the data set PPP_Q3. Examination of the\
    \ PPP_Q3 indicates that more than half of the item pairs have the extreme values\
    \ (< .5 or > .95). This is consistent with the PPMC analysis using OR values as\
    \ the discrepancy measure, suggesting a possible violation of the local independence\
    \ assumption for the DASH items.\n\n# Program 8.11: Comparing Observed with Predicted\
    \ Yen’s Q Measure–GR Model\n\n```\n* control parameters */\n* let items=10;\n\
    * let ncat=6;\n* let person=1000;\n* let postsample=500;\n* let q3=eval(&items*(&items-1)/2);\
    \ /* total number of q3 *\n/* compute the expected item responses */\ndata output;\n\
    \  set outpost sample_data;\n  sample=n_r;\nrun;\ndata ex_resp (rename=(i=person));\n\
    \  set outpost;\n  array (items) a=&items;\n  array (items) b1_1–b1_&items b2_1–b2_&items\
    \ b3_1–b3_&items b4_1–b4_&items;\n  array (person) theta_1–theta_&person;\n  array\
    \ ex(&items) el_&person–el_&items;\n  do j=1 to &items;\n    exp=0;\n    do k=1\
    \ to &ncat;\n      if k<&ncat then p=1/(1+exp(-a[j]*(theta[i]-b[k,j])));\n   \
    \   else if k=&ncat then p=1/(1+exp(-a[j]*(theta[i]-b[ncat-1,j]))));\n```"
