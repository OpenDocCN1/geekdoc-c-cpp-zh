  md: "# Muraki's Rating Scale Model\n\nAnother restricted version of the GR model\
    \ is Muraki's (1990) rating scale (RS-GR model). In this model, the logistic version\
    \ is $z_{ijk} = a_{ij}(\theta - b_j + c_k)$. The threshold parameters $(b_{jk})$\
    \ in the GR model are decomposed into two terms: (1) a location parameter $(b_j)$\
    \ for each item, and (2) one set of category threshold parameters $(c_k)$ that\
    \ apply to all items. To identify, $\\sum_k$ across the $k$ responses for each\
    \ item is constrained to 0. Also, the thresholds $c_k$ are ordered similarly to\
    \ the thresholds $b_{jk}$ parameters in the GR model. Advantage of this parameterization\
    \ is that the $b_j$ parameters can be used to directly compare different items\
    \ are measuring on the same $\theta$ continuum. Another advantage is that the\
    \ number of parameters in the model is reduced significantly compared to the GR\
    \ model.\n\nThe RS model is a restricted version of the GR model because the category\
    \ threshold parameters, $c_k$, are assumed to be equal all items in the model,\
    \ whereas they are free to vary across items in the GR model. Thus, the RS-GR\
    \ model can be compared with the GR model to determine whether one set of category\
    \ threshold adequately describes the item responses. This model comparison is\
    \ illustrated with the DASH data set in Chapter 7.\n\n# Estimating the RS-GR Model\n\
    \nProgram 5.7 includes the PROC MCMC code for estimating the RS-GR model with\
    \ the DASH data. One slope parameter $(a_{ij})$ and one location parameter $(b_j)$\
    \ are estimated for each DASH item, and there is one set of four category threshold\
    \ parameters $(c_{j1}, c_{j2}, c_{j3}, c_{j4})$ for the five response categories:\
    \ 1 (“No Difficulty”) to 5 (“Unable”). The category threshold parameters (c) are\
    \ defined in a separate PARMS statement ①. The fourth threshold $(c_1)$ is obtained\
    \ using $c_1 = -(c_2 + c_3 + c_4)$. This computation is embedded in a BEGINNODATA\
    \ ~ ENDNODATA block and is used to satisfy the model identification constraint\
    \ $\\sum_k c_k = 0$ ②. The lower value of $c_2$ is specified as $c_2$, and the\
    \ lower value of $c_4$ is specified as $c_3$ to also satisfy the order constraint\
    \ ③. The code used to compute the log-likelihood function is the same as for the\
    \ GR model except for the response model ④\n\nNote that the same strategy of decomposing\
    \ the threshold parameter into location $(b_j)$ and category threshold parameters\
    \ $(c_{j1}, c_{j2}, c_{j3}, c_{j4})$ can be done for each item in the GR model.\
    \ This is illustrated in Program 5.8, which can be found on the SAS Press authors’\
    \ web page."
  merge: -1
  pgno: 146
- img_proc: true
  md: '# 132 Bayesian Analysis of Item Response Theory Using SAS


    # Program 5.7: PROC MCMC Code for Estimating the RS-GR Model


    ```

    proc mcmc data=dash out=post_dash_postRSGR seed=23 nbi=5000 nmc=20000

    nnthreads=8 monitor=(a b c) diagnostics=all plots=(trace autocorr);


    array ix[10];

    array a[10]; array b[10]; array c[4];

    array p_star[10]; array p[10,5];


    parms a1 b1 0;

    parms a2 b2 0;

    parms a3 b3 0;

    parms a4 b4 0;

    parms a5 b5 0;

    parms a6 b6 0;

    parms a7 b7 0;

    parms a8 b8 0;

    parms a9 b9 0;

    parms a10 b10 0;

    parms c2 -c3+c4 c6; ①


    beginningata;

    cl=(c2+c3+c4); ②

    enddata;


    prior a: lognormal(0, var=25);

    prior b: normal(0, var=25);

    prior c2: normal(0, var=25);

    prior c3: normal(0, var=25, lower=c2); ⅓

    prior c4: normal(0, var=25, lower=c3);


    tandom theta: normal(0, var=1) subject=obs_;


    like=0;

    j=1 to 10;

    k=1 to 4;

    p_star[j,k]=logistic(a[j]*(theta-b[j]+c[k])); ④

    end;

    k=2 to 4;

    p[j,k]=p_star[j,(k-1)]-p_star[j,k];

    end;

    p[j,5]=p_star[j,4];

    llike=llike + log(p[j,ix[j]]));

    end;

    model general(llike);

    run;

    ```


    # Output from Estimating the RS-GR Model


    Output 5.14 shows the summary statistics for item parameters. Compared to the
    results for the GR model (see Output 5.3), the item slope estimates based on two
    models are similar. The category threshold parameter in the RS model approximates
    the average of the four thresholds in the GR model. The four category threshold
    estimates for all items are ordered as expected. Outputs 5.15 to 5.18 show the
    trace and autocorrelation plots for selected item parameters. You can see that
    the chains are mixing well for the slopes with low autocorrelations. The location
    and category threshold parameters, on the other hand, exhibit mixing but a moderate
    degree of autocorrelation. To reduce autocorrelations in other models that have
    been discussed, the models where zik = Daji(θ - bjk) are reparameterized into
    zik = Daji(θ - djk) where djk = djk/aj;; However, the RS-GR model is more difficult
    to reparameterize into a slope intercept model since the ck parameters are not
    a function of each item.'
