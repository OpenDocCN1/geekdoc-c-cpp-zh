    # Introduction


    Evaluating the value of item response theory (IRT) model applications involves
    the collection of different types of evidence about different aspects of model
    fit. For example, the degree to which underlying IRT model assumptions, such as
    unidimensionality and local independence, hold in the item response data can be
    assessed. In addition, goodness-of-fit of IRT models or the degree to which observed
    responses respond to model-based predictions be evaluated. Lack of model fit indicates
    that the assumed model does not accurately model how examinees respond the items.
    Thus, goodness-of-fit reflects the fit of a specific model, whereas the model
    comparison methods discussed in Chapter 7 are concerned with the relative fit
    of models. Chapter 1 discusses a variety of methods that have been for proposing
    different aspects of model fit in the context of classical applications of IRT
    models. This chapter focuses on the goodness-of-fit for IRT models in Bayesian
    applications.


    In a Bayesian paradigm, the posterior predictive model checking (PPMC) method
    is a commonly used Bayesian analysis tool and proved useful for evaluating model
    fit with IRT models (see, for example, Levy, Mislevy, & Sinhay, 2009; Sinhay,
    2005, 2006; Sinhay, Johnson, & Stern, 2006; Zhu & Stone, 2011). This chapter describes
    the PPMC method and uses a number of examples to illustrate how to'
  merge: -1
  pgno: 220
