  md: '# About this Book


    Although the focus is often on estimating IRT parameters, it is equally important
    to evaluate the fit of a particular IRT model to the item responses. When a model
    doesn''t fit the data, the validity of any inferences for the model parameters
    is threatened. The SAS system and PROC MCMC affords over other available software
    for Bayesian analysis of IRT models. For evaluating model-data-fit, SAS provides
    a robust programming language and built-in statistical and graphical tools. The
    programming language and tools expand the capability of the program beyond estimating
    the model to computing many different types of statistics for comparing models
    and evaluating fit.


    The topics of model comparison and checking in Bayesian analysis are discussed
    in Chapters 7 and 8 of this book. Chapter 7 considers methods for comparing models
    so that a preferred model can be identified. Methods based on information criteria
    and Bayes Factors are considered. Chapter 8 begins with a discussion of item and
    person fit in the context of IRT models and a description of a popular model checking
    tool in Bayesian analysis—posterior predictive checking (PPMC). Then possible
    discrepancy statistics for a PPMC analysis of IRT models are discussed, followed
    by examples illustrating the use of SAS procedures and programming commands to
    perform a PPMC. The use of output in the form of tables and graphs is also included
    to illustrate the capabilities of a PPMC analysis in SAS, as well as the different
    types of output that can be produced to report a PPMC analysis.


    # About the Examples


    # Software Used to Develop the Book''s Content


    PROC MCMC statements and examples using PROC MCMC in this book are based on SAS
    9.4 and SAS/STAT 13.2.


    # Example Programming Code and Data


    Examples are provided to estimate IRT models for dichotomously and polytomously
    scored items, well as more complex IRT models, such as multidimensional and hierarchical
    models.


    You can access the example programs and data for this book by linking to its author
    page at http://support.sas.com/publishing/authors/stone.html. Select the name
    of the author. Then look for the cover thumbnail of this book, and select Example
    Code and Data to display the SAS programs that are included in this book.


    For an alphabetical list of all books for which code is available, see http://support.sas.com/bookcode.
    Select a title to display the book''s example code.


    If you cannot attain access to the code through the website, send email to sasxpress@sas.com.


    # Output and Graphics


    All output was derived from programs using PROC MCMC or from other SAS programs.
    All graphics were obtained with the use of SAS Graphics Template Language with
    default SAS Output Delivery System settings.'
