  md: "IRT model. Compared to overall test-fit statistics, more statistical procedures\
    \ have been proposed in the literature to assess the IRT models at the item level.\n\
    \nMany-item statistics compare response score distributions or the frequencies\
    \ of responding in each category for an item (for example, 0 opposed to 1 for\
    \ dichotomous items). The general steps for these statistics were described in\
    \ Chapter 1, and one statistic that has received a lot of attention in the literature\
    \ is Yen's $Q_{\theta}$ statistic (Yen, 1981). The $Q_{\theta}$ statistic is based\
    \ on a cross-classification of response categories with discrete $\theta$ variable.\
    \ A chi-squared statistic can be formed to summarize the differences between observed\
    \ and expected frequencies within each response category across the $\theta$.\
    \ The expected frequencies for each response category $k$ at discrete level of\
    \ the $\theta$ subgroup for item $j$ ($P(U_j=k|\\delta_j$ subgroup) are based\
    \ on the IRT model, where $\\delta_j$ is the set of item parameter estimates for\
    \ item $j$.\n\n# Person Fit\n\nPerson-fit statistics refer to methods used to\
    \ evaluate the fit of an examinee's response to a particular IRT model. Investigation\
    \ of person fit may help researchers obtain additional information about the response\
    \ behavior of a person and identifies with aberrant response patterns. There are\
    \ a large number of statistics available for evaluating person fit. Meijer and\
    \ Sijsama (2001) discusses a system considering thirty-different person-fit statistics.\n\
    \nOne of the more used and intuitive measures of person fit is a log-likelihood\
    \ statistic $L_{\theta}$ (Drasgow, Levine, & Williams, 1985). The $T_{\theta}$\
    \ is defined as a standardized version of the $L_{\theta}$ statistic, where $L_{\t\
    heta}$ is the log-likelihood of response pattern based on the fitted IRT model,\
    \ the examinee's responses, and model parameter estimates (item $-\\delta_i, \\\
    theta$).\n\n# Posterior Predictive Checking\n\nPPPC involves simulating item responses\
    \ (data) under the estimated or assumed model using posterior samples of model\
    \ parameters. The simulated or replicated data are compared against the observed\
    \ data using discrepancy measures or statistics calculated on both the simulated\
    \ and observed data (for example, residual or total score). The rationale behind\
    \ PPPC is that, if a model fits the data, then the observed data, any statistic\
    \ computed on observed data, should be similar to statistics computed on data\
    \ replicated under the estimated IRT model. Any systematic differences between\
    \ the statistics indicate potential misfit of the model (Gelman, Carlin, Stern,\
    \ Dun, Vetari, & Rubin, 2014).\n\n# The PPC Method\n\nThe PPC method uses drawn\
    \ samples of model parameters from the posterior distribution $p(\\delta|D)$ to\
    \ simulate item responses under the model, where $D$ corresponds to the observed\
    \ data and $\\delta$ corresponds to the set of model parameters. For each draw\
    \ or item in the posterior distribution, a set of model-based observations is\
    \ generated based on the model. Thus, for $R$ iterations, there are $R$ predicted\
    \ response data sets. Each data set represents a sample from the posterior distribution\
    \ $p(T^{rep}|D)$. A discrepancy statistic, $T$, is computed for each $T^{rep}$\
    \ replication to produce a distribution of discrepancy measures under the null\
    \ condition of model-fit $T(T^{rep})$.\n\nA discrepancy statistic is also computed\
    \ on the observed data $T(D)$, and any systematic difference between $T(D)$ and\
    \ the distribution of $T(T^{rep})$ is used to evaluate model fit. Posterior predictive\
    \ probability values (PPP values) are computed to quantify the relative occurrence\
    \ of $T(D)$ in the reference distribution of $T^{rep}$ from the posterior predictive\
    \ distribution:\n\n> $PPP = P(T(T^{rep}) \\geq T(D))$$\n\nwhere PPP is the proportion\
    \ of times $R$ replications that $T(T^{rep})$ equals or exceeds $T(D)$. Thus,\
    \ PPP values reflect the relative similarity between the discrepancy measure for\
    \ the predicted and observed"
