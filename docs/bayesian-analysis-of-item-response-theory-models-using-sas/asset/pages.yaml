  md: "Glas, 2001). However, persons are often nested within clusters as classrooms\
    \ or schools. In multilevel IRT models, an item model is used to measure the latent\
    \ traits or abilities of persons, and this model is integrated with structural\
    \ models to explain variance in trait or ability at different levels and clusters\
    \ of persons (Fox, 2010).\n\nIn multilevel IRT models, the Level 1 is an IRT model\
    \ or a model expressing the probability of a response, conditional on the modeled\
    \ item and person characteristics. At this observational level, measurement error\
    \ is associated with the individual $\theta$. For the Level 2, structural model,\
    \ is used to describe the relationship between the latent variable measured at\
    \ Level 1 ($\theta_{ij}$) and covariates, $x_{ij}$, which are introduced to explain\
    \ variance or uncertitude in $\theta$. At this level, the latent variables measured\
    \ for persons are now dependent: $\theta_{ij} = \beta_0 + \beta_1x_{ij} + ...\
    \ + \beta_kx_{ij} + \\epsilon_{ij}$, with the random effects for persons $\\epsilon_{ij}\
    \ \\sim N(0, \\sigma^2)$. Additional structural models can be included to reflect\
    \ clusters of persons, such as person groups (Level 3). If persons are clustered\
    \ in groups, such as schools, then an index for G is included in the model. The\
    \ $\beta$ coefficients introduced: $\beta_{ij} = \\gamma_0 + \\gamma_1y_g + ...\
    \ + \\gamma_ky_g + \\mu_g$ and $\\mu_g \\sim N(0, \\mathbf{T})$.\n\nFor this three-level\
    \ model, Fox (2010) expresses the joint response probability of the response data\
    \ ($\\mathbf{u}$) for the combined measurement and structural models as a product\
    \ of the Level 1 and 2 models across examiners, and the Level 3 across G groups:\n\
    \n```\n$P(u_{ij}|\\theta_{ij}, \\omega)$\nP(u_{ij}|\\theta_{ij}, \\beta_{ij},\
    \ \\sigma^2_{ij}})\\nP(\\mathbf{y}_g|\\gamma_g, \\mathbf{T})$\n```\n\n$P(u_{ij}|\\\
    theta_{ij}, \\omega)$ is the Level 1 IRT model, with persons of $X$ explanatory\
    \ variables for persons within clusters ($x_{ij}$), and $P(\\mathbf{y}_g|\\gamma_g,\
    \ \\mathbf{T})$ is the Level 3 model with a set of $Y$ explanatory variables across\
    \ clusters of persons ($y_g$).\n\nOne of the primary advantages of a multilevel\
    \ approach is that variables can be introduced to explain variance in parameters\
    \ and measurement error at the different levels of the multilevel model. For example,\
    \ a person explanatory model could introduce variables at the person level. For\
