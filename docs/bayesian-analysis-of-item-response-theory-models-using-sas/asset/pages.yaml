    array z[5]; zl-z5;\narray sum_z[5]; sum_zl-sum_z5;\narray number[5]; number1-number5;\n\
    array p[5]; p1-p5;\n\nparms a[1] b1 tau1_1 tau2_1 tau3_1 ;\nparms a[2] b2 tau1_2\
