    and therefore reflects mixing in the chain. ESS is calculated by first computing
    the estimated iteration (AUTOCORRELATION TIME) where autocorrelations are close
    to 0. ESS is then equal to NMC / (AUTOCORRELATION TIME) where NMC equals the Monte
    Carlo sample size. In turn, EFFICIENCY of the chain is equal to ESS / NMC. Values
    of ESS close to NMC indicate better mixing, whereas large discrepancies between
    ESS and NMC indicate poor mixing. Results in Output 3.9 illustrate values that
    are much lower than the 20000 (NMC), indicating poor mixing due to the high observed
    degree of correlations between sampled values.


    The Gelman-Rubin test is another common technique that can be used to evaluate
    convergence in the target distribution. This test requires the use of multiple
    chains initiated by different or starting values. The test compares the between-
    and within-chain variations. This test cannot be requested as part of the DIAGNO
    option; rather, PROC MCMC must be executed multiple times for each chain and initial
    value. The command indicates that results for the Gelman-Rubin test are described
    in a later section in this chapter. For a technical discussion and references
    for the diagnostic statistics that are computed in PROC MCMC, see the documentation
    for PROC MCMC.


    # # Strategies to Improve Convergence of the Monte Carlo Chain


    Obtaining chains that quickly traverse the support region for the posterior distribution
    (mix) and chains that exhibit low among sampled values (autocorrelations) can
    be problematic with MCMC sampling. Poor mixing is a problem that may indicate
    a misspecified or over-parameterized model. High degree or high correlations among
    sampled values typically reflects low efficiency in the sampling algorithm, although
    there is no impact on the posterior summary statistics for parameters. When poor
    mixing or high degree is observed in the chains, there are several strategies
    that can be used to improve convergence.


    # ## Thinning


    One way to reduce dependence is to thin the chain by taking every $n^{th}$ sampled
    value. Thinning the chain is specified with the THIN=$n option in the PROC MCMC
    statement. This method can be useful for reducing autocorrelation, but it comes
    at a cost of inefficiency when sampled values are discarded. For example, Output
    3.10 presents trace autocorrelation plots for the option THIN=4 added to the PROC
    MCMC command. As can be seen, thinning reduced the autocorrelation significantly'
