- img_proc: true
  md: "that, as the number of raters increases in the AFRM model, the model incorporates\
    \ the information as added information about the ability being measured even though\
    \ no additional items are administered.\n\nPatz, Junker, Johnson, and Mariano\
    \ (2002) in their approach consider the hierarchical structure to assessments\
    \ that are scored by multiple raters. In these testing applications, ratings are\
    \ nested within responses which are nested within person. To apply IRT models\
    \ a hierarchical (HR) model to account for this structure and the dependencies\
    \ between rater judgments. This model, as well as others (for example, Verheld\
    \ & Verstraelen, 2001), introduces a latent variable that can be considered the\
    \ \"ideal rating\" or an unbiased rating is conditionally independent across items.\
    \ Random errors such as lack of consistency and systematic errors such as rater\
    \ tendencies are likely to differ from this ideal rating. Estimating of this latent\
    \ variable from a multiple-rating design can be considered a \"consensus rating\"\
    \ among the rater judgments, and variability can be analyzed.\n\nThus, in the\
    \ HR model, the rater scores are indicators of performance quality which in turn\
    \ are indicators of the latent trait measured (DeCarlo, Johnson, 2011). The observed\
    \ ratings are related to the ideal ratings (performance quality) using a latent\
    \ class or detection model that estimates the conditional probability that a provider\
    \ provides a rating at each score level given an ideal rating. This level of model\
    \ is used to quantify rating errors and rater precision. The ideal ratings are\
    \ random variables that depend on ability and they can be modeled using any response\
    \ function in another level of the model. For example, a K category PC model may\
    \ be used, which corresponds to the ideal rating of an item:\n\n```\n$P_{jr}(\\\
    xi_j) = \\frac{e^{\\alpha_{ij}(b_i-\\xi_j-\\lambda_{ij})}}{\\sum_{k=1}^{K} e^{\\\
    alpha_{ik}(b_i-\\xi_k-\\lambda_{ik})}}$\n```\n\nand $\theta, b_i, \\tau_j,$ and\
    \ $\\lambda_{ij}$ are defined in the AFRM model. In addition, Patz et al. (2002)\
    \ discussed how covariates to predict reader behavior can be incorporated into\
    \ the HR model. For example, parameters could be modeled to estimate the effects\
    \ of rater and experience variables or item features.\n\n# IRT Models for Multidimensional\
    \ Response Data\n\nThe models discussed in this paper are appropriate for analyzing\
    \ item responses that are assumed to be determined by a single person characteristic\
    \ or trait being measured (unidimensional model). However, multidimensionality\
    \ can be caused by various factors, such as test structure, unmeasured irrelevant\
    \ variance, and item formats. For example, when an instrument is designed to measure\
    \ more than one trait, the item response would be expected to exhibit a multidimensional\
    \ structure.\n\nConstruct-relevant variance can manifest as multidimensionality\
    \ when, for example, mathematics ability is measured by constructed response items\
    \ that require examinees to explain answers. Variability in the performance of\
    \ the items may be due to both the mathematics and communication abilities of\
    \ examinees. Finally, including items with different item formats, such as multiple-choice\
    \ and constructed response, can induce multidimensionality in item response data.\n\
    \nThere are different ways of classifying multidimensionality (Reocke, 1997a,1997b).\
    \ One classification defines multidimensional as between-item or within-item multidimensional.\
    \ Between-item multidimensional is assumed if only one of the ability/trait dimensions\
    \ in the model determines the response to an item, while within-item multidimensionality\
    \ is assumed when an item response is dependent on multiple dimensions simultaneously\
    \ (that is, complex structure). In addition, types of multidimensional IRT (MIRT)\
    \ models have been proposed: compensatory, noncompensatory, and bi-factor models.\n\
    \nIn predicting item response, compensatory models assume that a low level or\
    \ status in one dimension can be compensated for higher levels in the other dimensions.\
    \ Simple generalizations of the logistic model"
