    estimates for persons, computed from means from posterior 0 distributions for
    each group, can be used to "bin" examines into discrete groups along the continuous
    0 scale. Uncertainty around binning parameters in each group theta can be expressed
    by using lower and upper percentiles from the posterior distributions for theta.
    The observed proper correction values at discrete 0 groups and expected uncertainty
    within 0 groups can be plotted with model-based expectations. The commands used
    to add these elements to the ICC plots are included in Program 4.10 (see the SAS
    Authors'' web page for this program.) The output from executing the commands is
    presented in Output 4.21.


    Across the 5 items, several of the observed proportion-correct values conform
    reasonably with model expectations or expected uncertainty, particularly where
    the number of persons in a 0 group are more substantial. While this is a limited
    method to examining model-data-fit, Bayesian analysis provides more robust methods
    for evaluating model-data-fit using posterior predictive model checks (PPMC).
    These methods are discussed briefly in Chapter 2 and in more detail in Chapter
    8. Note that both of these graphs (Output 4.20 and 4.21), the bands reflecting
    uncertainty are derived from values for the 5th and 95th percentiles from posterior
    distributions. In addition, uncertainty in both item and 0 parameters can be reflected
    in Output 4.21 by combining the methods in the Programs 4.9 and 4.10.'
