  md: "# Chapter 1: Item Response Theory\n\nIn the case where group or latent class\
    \ membership is to be estimated, mixture IRT models may be used to cluster examples\
    \ into latent classes based on response patterns (Bolt & Wollack, 2001). Mixture\
    \ IRT models assume that this population of examples consists of qualitative subpopulations\
    \ or classes. Mixture IRT models provide a mechanism for clustering examples to\
    \ better understand any heterogeneity in item responses. An interesting application\
    \ in the area of health assessment is a study that samples bare heterogeneity\
    \ in patient-reported outcomes (Satzky, Ratner, Kopec, & Kubo, 2012). For a useful\
    \ comparison of methods for studying population heterogeneity, see Lubke & Muthen\
    \ (2005).\n\nIn the context of DIF educational assessments, the latent classes\
    \ typically reflect demographic characteristic such or a combination of demographic\
    \ characteristics. However, Co and Cohen (2010) discuss the use of mixture IRT\
    \ in DIF analyses to verify testing examples, using different response strategies\
    \ by examiners. In the context of surveys, the latent could reflect clusters of\
    \ individuals with different levels of response latitude or different ranges in\
    \ response options that individuals use (Law, Witten, Zickar, Wood, Dahl, and\
    \ Bochinski). Finally, in the context of personality assessment, Maj-de Mee, Kelderman,\
    \ and van Flier (2008) discuss the use of mixture models to detect latent classes\
    \ related to the use of response scale, including tendency to extreme ranges,\
    \ midpoints, and filters as *Don't Know*.\n\nIn IRT mixture models, differential\
    \ performance and identification of latent classes can be examined by extending\
    \ any of the IRT models to include group-level item parameters for each group\
    \ or class $P_{ij}(\theta) = \text{logit}(\\alpha_{ij}\theta - \beta_{ij})$. In\
    \ these models, the assumed IRT model holds across the classes, but each class\
    \ has a unique set of parameters that are estimated in addition to a model parameter\
    \ reflecting the probability of latent class membership. These models may also\
    \ be considered multidimensional IRT models because two person characteristics\
    \ (subgroup membership and the trait being measured) determine item response in\
    \ the model.\n\nIn structure, the trait being measured by class-specific means\
    \ and standards $(\\mu_h, \\sigma_h)$. Therefore, mixture IRT models may be used\
    \ to account for qualitative differences between examiners (Rost, 1990). Measurement\
    \ invariance across latent classes can be further explored if you compare non-invariant\
    \ or unconstrained models across classes with partially or fully invariant models.\
    \ These comparisons, as determining the number of modeled latent classes, can\
    \ be conducted using goodness-of-fit measures such as information-based indices\
    \ (for example, AIC, BIC). For a detailed discussion of mixture models, see van\
    \ Davier and Rost (2007)\n\n# Hierarchical Models—Multilevel and Random Effect\
    \ IRT Models\n\nIn the IRT models discussed above, hierarchical models make an\
    \ assumption about independence of item responses conditional on the latent traits\
    \ (0) in order to define the likelihood function. However, in some testing examples\
    \ that reflect a nested structure of item responses within persons, clusters of\
    \ items, or others this may not be reasonable. For example, in testing applications\
    \ where students are within classrooms, the responses of a student in a school\
    \ (cluster) are likely to be more than what is accounted for by latent traits\
    \ alone. Persons can also come from clusters of neighborhoods, and the neighborhood\
    \ context may influence responses to behavioral assessments. Finally, in two examples\
    \ discussed above the conditional-independence assumption may not be reasonable\
    \ for testing applications that use testers or multiple tests\n\nIn types of testing\
    \ applications, hierarchical models, also referred to as multilevel, random effects,\
    \ or mixed models, can be used to model any dependence within clusters of persons\
    \ or items. Different types of hierarchical models are motivated and discussed\
    \ further below. Chapter 6 introduces the hierarchical IRT model and illustrates\
    \ an application of this. For more detail about hierarchical IRT models, see John,\
    \ Sinharay, and Browder (2007) and Fox (2010).\n\nA multilevel modeling approach\
    \ to educational and behavioral assessments conforms to the natural structure\
    \ of item responses. Any IRT model can be conceptualized as a multilevel model\
    \ with item responses or observations nested within persons. In this case, the\
    \ person parameters are treated as random components, and item parameters are\
    \ treated as fixed components (Fox, 2010; Fox &"
  merge: -1
