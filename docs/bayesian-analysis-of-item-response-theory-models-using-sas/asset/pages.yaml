  md: 'evaluate different aspects of model-fit using SAS. SAS code used to perform
    a PPMC analysis is described in detail this chapter. Results that are presented
    use Graphics Template Language (GTL) commands. Because the focus of this chapter
    is on obtaining posterior model checking (PPMC) results, the commands used to
