    # Introduction


    Previously, individuals using Bayesian methods had to write their own programs
    using programming languages as R or Matlab. However, Bayesian analysis using the
    Markov Chain Monte (MCMC) method has been greatly simplified through programs
    like SAS PROC MCMC and WinBUGS (Spiegelhalter, Thomas, Best, & Linn, 2003). Similar
    to WinBUGS, specification of the model using PROC MCMC is straightforward. All
    that is necessary to specify the model or likelihood function for the observed
    data, model parameters, and prior distributions for model parameters. However,
    PROC MCMC has several significant advantages over WinBUGS: (1) SAS is commonly
    used by individuals across disciplines; (2) SAS provides a robust programming
    language that extends the capability of the'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# 44 Bayesian Analysis of Item Response Models Using SAS


    program, in particular, to model checking; and (3) PROC MCMC displays increased
    performance and efficiency through the use of parallel processing.


    This chapter provides an overview of the PROC MCMC commands and options that are
    most relevant to Bayesian estimation of IRT models. These commands and options
    are then illustrated through the estimation of the 1 IRT model. Other commands
    that may be used are described with examples of IRT models in subsequent chapters.
    For a complete list of commands and options, see the SAS Help (search for PROC
    MCMC), or in the SAS/STAT 13.2 User’s Guide (SAS, 2014), see Chapter 61, the "MCMC
    Procedure."


    Also, Chen (2009, 2011, and 2013) provide other sources for learning more about
    PROC MCMC. Note that the description of PROC MCMC commands and statements using
    PROC MCMC in this book is based on SAS 9.4 and SAS/STAT 13.2.


    # Summary of PROC MCMC Statements for IRT Model Estimation


    The MCMC method is designed to estimate a wide range of statistical models under
    a Bayesian paradigm. The MCMC method is a general procedure for simulating or
    sampling from posterior distributions and summarizing information from posterior
    distributions. (For an introduction to MCMC, see Chapter 2.) In the context of
    a Bayesian analysis of IRT models using PROC MCMC, the following statements and
    options are specified typically:


    +   * PROC MCMC statement. This statement is used to call the MCMC procedure and
    specify input/output data sets, options for the sampling algorithm, and the summary/diagnostic
    information to be computed and output. The following options for the PROC MCMC
    statement are illustrated and in later chapters:


    +   ○ DATA = <SAS dataset>. This option specifies the data set of item response
    data.

    ○ OUTPOST = <SAS dataset>. This option specifies a data set for saving samples
    from the posterior distribution.

    ○ NBI = <value - default = 1000>. This option specifies the number of burn-in
    samples.

    ○ NMC = <value - default = 1000>. This option specifies the number of MC samples
    for the posterior distribution post burn-in.

    ○ THIN = <value - default = 1>. This option is used to "thin" the chain. If >1,
    every nth sample is saved into OUTPOST.

    ○ SEED = <value the default = 0>. This option specifies a value to start the sampling
    process. A value of 0 means the seed value is determined by the computer clock,
    and, results cannot be replicated.

    ○ NTHREADS = <value>. This option is used to specify the number of threads available
    for parallel processing (depends on micro-processor - using SAS/STAT 13.1). Note
    that parallel processing speeds up the processing significantly. Also, for using
    a RANDOM statement, results may vary slightly when NTHREADS>0 because different
    number threads are used under parallel processing.

    ○ MISSING = <ALLCASE, COMPLETECASE>. This option specifies how missing values
    are accommodated in PROC MCMC. If MISSING=ALLCASE, then any missing responses
    are treated as unknown random variables and sampled directly using the response
    model and MODEL specification as process of. If MISSING=COMPLETECASE, then cases
    with missing data are not used. Starting with SAS/STAT 12.1, PROC MCMC performs
    Bayesian augmentation for missing data.

    ○ MONITOR=<list of parameters>. This option is used to specify a subset of parameters
    for which statistics or plots (posterior analyses) are computed. If no option
    is specified, all parameters contained in PARMS are monitored and saved in OUTPOST.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# Chapter 3: Bayesian Estimation of IRT Models Using PROC MCMC 45


    +   DIAGNOSTICS=<NONE | ALL | keyword>. This option specifies options for the
    reporting of convergence diagnostics. By default, PROC MCMC computes the Geweke
    test, sample autocorrelations, effective sample sizes, and Monte Carlo errors.
    All the diagnostic tools are described in Chapter 2 as well as in the auxiliary
    documentation for PROC MCMC.


    +   STATISTICS=<NONE | ALL | keyword>. This option specifies statistics to be
    computed from posterior distributions for model parameters listed in the MONITOR
    option. If no STATISTICS option is specified, the output includes the number of
    parameters, mean, standard deviation, and the 95% highest posterior density (HPD)
    intervals. SUMMARY as a keyword provides standard deviations and percentiles for
    each value (default, 25th, 50th, and 75th).


    +   PLOTS=<NONE | ALL | keyword>. This option specifies the plots to be generated
    for model parameters that are listed in the MONITOR option. Three types of plots
    can be created: trace plots (TRACE), autocorrelation plots (AUTOCOR), and density
    plots (DENSITY) for each model parameter. Plots are displayed in panels unless
    the UNPACK option is specified—see auxiliary documentation for detail.


    +   DIC. This option is used to indicate that the DIC and associated statistics
    are reported for model comparison purposes (see Chapter 7 for detail on model
    comparisons).


    +   For the more advanced user, options are available for tuning parameters, acceptance
    rates, and different proposal distributions (see auxiliary documentation).


    +   PARMS=<name(initial value)> statement. This statement specifies parameters
    to be estimated and their initial values.


    +   ARRAY=<list of parameters name> statement. This statement specifies a set
    of parameters that may be more easily resolved in the code for PROC MCMC.


    +   PRIOR=<name distribution> statement. This statement is used to specify distributions
    for parameters that are specified in the PARMS and ARRAY statements.


    +   RANDOM=<name of random effect> SUBJECT=<variable> statement. This statement
    specifies a single or array of random effects and their prior distributions. The
    SUBJECT option is used to identify an indexing variable for the random effects.
    This variable should be part of the input data set, and the data set does not
    need to be sorted by the variable. However, if random effects are modeled for
    each observation, OBS=<by> is used to specify the index in the RANDOM statement
    and MONITOR=<parameters>—to output results such as summary statistics for random
    effects parameters.


    +   MODEL=<response distribution> statement. This statement specifies the specification
    of the log-likelihood function linking the data and the model parameters. Every
    PROC MCMC program must have at least one MODEL statement.


    +   PREDICT=<OUTSET dataset=value> statement. This statement is used to create
    a data set that contains random samples of the response variable(s) from the posterior
    predictive distribution.


    +   SAS programming commands are used in DATA statements. These statements, for
    DO, and IF, may also be used in the PROC MCMC command as needed.


    # MCMC Sampling Algorithms


    With the MCMC algorithms used to sample parameter values, PROC MCMC determines
    the sampling algorithm based on the parameters and their prior distributions.
    When appropriate, PROC MCMC uses conjugate sampling methods to draw conditional
    posterior samples and, particularly for missing values, draw missing methods.
    Otherwise, a normal-kernel walk Metropolis algorithm is default by PROC MCMC.
    Other sampling algorithms are available, such as a slice sampler or a t-distribution
    walk Metropolis algorithm. To specify an alternative method specified in PARMS
    statements, the /OPTION=<algorithm> is used. To specify an alternative algorithm
    for random effects parameters, the /ALGORITHM=<algorithm> is used with the RANDOM
    statement. In addition,'
