  md: "# Bayesian Analysis of Item Response Models Using SAS\n\nFigure 1.3: $P_{jk}(\t\
    heta)$ for a 5-Response Category Item under the GR Model\n\n![](img/dd5368102e19084dcd107a02a82ba37c_23_0.png)\n\
    \n# Muraki's Rating Scale Model\n\nAnother restricted case of the GR model is\
    \ Muraki's (1990) rating scale (RS) model. In this model, the threshold parameters\
    \ ($b_h$) in the GR model are decomposed into two: (1) a location parameter ($b_i$)\
    \ for each item to be compared with other items, and (2) set of category threshold\
    \ parameters ($c_h$) that applies to all items; or $z_{ih} = D_i(\theta - b_i\
    \ - c_h)$. The RS is a restricted version of the GR model since category threshold\
    \ parameters are assumed to be equal to all items in the RS model, whereas there\
    \ are free across items in the GR model. As a result, the number of parameters\
    \ in the RS model is significantly reduced compared with the GR model. Another\
    \ advantage of this parameterization is that $b_i$ parameter locates the item\
    \ on the ability or trait being measured and thus reflects the level of $\theta$\
    \ at which optimal measurement is attained.\n\nA model with a common set of threshold\
    \ parameters may be more consistent with responses to rating scales in questionnaires\
    \ where a set of items share the same response scale. However, Lane and Stone\
    \ (2006) out that the GR model may also be appropriate for performance assessments.\
    \ When a general rubric is used as the basis for developing specific items, the\
    \ response scales and the differences between score levels may be the same as\
    \ the set of items.\n\n# The Partial Credit Model and Extensions\n\nAnother class\
    \ of models that may be used with polytomous scored items and ordinal scales is\
    \ based on the Rach model. The partial credit (PC) model (Masters, 1982) was originally\
    \ developed to respond to items that measure strength in performance. In the PC\
    \ model, transition from one category to the next is modeled by a dichotomous\
    \ model where the logistic device $z_{jk} = (\theta - \\delta_{jk})$ and $\\delta_{jk}$\
    \ are item category boundary parameters, also called \"item step difficulty\"\
    \ parameters, governing the transition from category $k-1$ to category $k$ in\
    \ item $j$. As for the GR model, the number of category boundary parameters is\
    \ equal to one less than the number of response options."
