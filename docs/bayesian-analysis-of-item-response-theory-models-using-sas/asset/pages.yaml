  md: '# Program 8.3: Simulate Posterior Predictive Responses Based on the 1P Model
    (LSAT Data)–

    Posterior Predictive Output Data Set Format 2


    ```

    %let ncat=2;               /*number of response categories*/

    %let nperson=1000;      /*number of persons*/

    %let nitem=5;            /*number of items*/

    %let postsamples=500;   /*number of replicated datasets to be generated*/

    %let seed=23;


    /* randomly creates a dataset from the postdata comment - if not used*/

    proc surveyselect=lsat_data methods=rep-1

    sample=&postamples seed=0 out=out_postsample;

    id_all_j;

    run;


    /* creates a dataset with the number of observations equal to the

    number of postsamples and structures the dataset using PREDIST

    command */

    %macro gen_pred;

    data pred_list_lsat;

    set output_sample;

    array b(&nitem) bl-&nitem;

    array theta(&nperson) theta_1-&nperson;

    array z(&) z-&ncat;

    seed=&seed;

    retain sample=(0);

    sample=sample=;

    %do i=1 to &nperson;

    %do k=1 to &ncat-1;

    z[k]=-(a*(theta[i] - b([k])));

    nnz[k]=1/(1+exp(z[k])));

    %end;


    r01=ranuni(seed);

    %if r01=0 then z[1] x&j_i=0;

    %else x&j_i=1;

    %end;

    %end;

    %keep sample xl_1--&nitem._&nperson;

    run;

    %nmend;

    %gen_pred;

    ```


    # Discrepancy Measures


    In a PPC analysis of model fit, a discrepancy measure or statistic is computed,
    which summarizes a particular aspect of the items. For example, the total score
    distribution, describing the frequency of persons in the data with a total score
    equal to each possible total score, can be computed on the observed data to summarize
    measures of all the items. This statistic is compared to the statistic computed
    on each of the replicated datasets simulated from the posterior distribution.
    The underlying principle is that, if a model fits the data, then discrepancy measure
    computed from the observed data should be similar to those computed from replicated
    or simulated data.


    Choosing discrepancy measures, therefore, is an important aspect of the PPC method.
    They should be chosen to reflect potential sources of misfit that are most relevant
    to a testing application. For example, when a unidimensional IRT model is used
    in a testing application where item responses may reflect a multidimensional structure,
    discrepancy measures should be chosen that are sensitive to this type of threat
    to model fit. It is recommended that a number of different discrepancy measures
    be used for evaluating different sources of possible model misfit for a particular
    testing application (Sinharay et al., 2006).'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# Chapter 8: Bayesian Model-Checking for IRT Models 213


    As discussed, discrepancy measures can be a function of the data, or discrepancy
    measures can depend on both the data and model parameters. This section reviews
    briefly discrepancy measures that have proved effective for assessing fit in Bayesian
    IRT model applications. Examples of using several of these discrepancy measures
    are presented and discussed in later sections.


    # Test-Level Measures


    As discussed previously, the test score distribution (frequency counts for each
    possible total score or summed score across the test items) is commonly used for
    evaluating model fit at the test-level. The test score distribution has has been
    found to be not effective for evaluating threats due to multidimensionality or
    local dependence (see, for example, Béguin & Gaul, 2001; Sinaray et al., 2006;
    Zhu & Stone, 2011).


    While a descriptive comparison of the test score distributions can be discussed,
    Béguin and Gaul (2001) suggested using a Pearson chi-squared statistic $\chi^2=\sum(N_i
    - E(N_i))^2/E(N_i)$, where $T$ is the maximum total score, $N_i$ is the observed
    number of examinations with total score $t$, and $E(N_i)$ is the expected number
    of examinations with total score $t$, based on the selected IRT model. For any
    particular total score, $E(t)$ can be calculated as:


    ```

    $E(t) = N \sum_{yt} p(y|\theta)g(\theta)$

    ```


    where $N$ is the number of examinations, $y$ represents the set of all possible
    response patterns resulting in $t$, $p(y|\theta)$ is the probability of response
    pattern $y$ given ability $\theta$ and the item parameter estimates, and $g(\theta)$
    is the assumed density of the distribution. The expected frequencies for each
    total score are based on the selected IRT model and sampled model values from
    the joint posterior distribution, $\chi^2$ discrepancy measure is a function of
    the data and the model parameters.


    # Item-Level Measures


    An intuitive measure of assessing fit is the number of examinations responding
    to each category for each item. Similar to the test score distribution, the difference
    between observed and posterior predictive item score distributions can be summarized
    using a chi-squared test for each item: $\chi^2=\sum(O_{ik}-E_{ik})^2/E_{ik}$,
    where $O_{ik}$ is the observed number of examinations and $E_{ik}$ is the predicted
    number of examinations responding to category $k$ in item $j$. $E_{ik}$ can be
    calculated by summing the probabilities of responding to category $k$ in item
    $j$ across all $N$ examinations: $E_{ik}=\sum p(y|\theta)$. This $\chi^2$ measure
    has been found useful with the PPMC method (see for example, Levy et al., 2009;
    Zhu & Stone, 2011). Similar to the test-level chi-squared measure, the $\chi^2$
    measure depends on both data and model parameters.


    The item-score correlation is the correlation between test scores and on a particular
    item $(t)$. While this measure is not a classic fit statistic, it has been found
    effective for Bayesian analyses of IRT models. For example, Sinaray et al. (2006)
    found that this discrepancy measure can be effective in detecting misspecification
    of IRT models data that were generated from a 2PL or 3PL model, indicating a violation
    of equal discrimination assumption. Zhu and Stone (2011) showed that this measure
    is also useful for detecting local dependence. This discrepancy measure depends
    only on the data.


    Classic item-statistics discussed previously, such as Yen''s $Q_0$ statistic,
    can also be used as discrepancy measures with PPMC to evaluate IRT model fit.
    These statistics extend the analysis of item score distributions by comparing
    the distributions at different levels of the measured trait $(\theta)$. For example,
    Yen''s $Q_0$ statistic is a Pearson chi-squared test statistic defined as: $\chi^2=\sum_{jkg}(O_{ijk}-E_{ijk})^2/E_{ijk}$
    where the $O_{ijk}$ are the observed number of examinations responding to category
    $k$ on item $j$ for subgroup $g$, and $E_{ijk}$ are predicted number of examinations
    based on the IRT model and the item parameter estimates. In Yen''s statistic,
    examinations are divided into $n/\theta$ subgroups of approximately equal size
    after they are rank-ordered'
