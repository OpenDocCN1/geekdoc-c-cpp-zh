  md: '# Bayesian Analysis of Item Response Models Using SAS


    # Prerequisites


    Although introductory material related to IRT and Bayesian analysis is included
    in the book, some prior knowledge about these topics is necessary for you to better
    understand and implement the procedures in your own assessment applications. For
    detail and more technical information, see the references forward.


    # Scope of This Book


    This book is example-driven, with sections presenting code for estimating particular
    models and results that illustrate convergence diagnostics and inferences for
    parameters, as well as results that can be used by scale developers—for example,
    plotting item response functions.


    Chapters 1 and 2 provide introductory treatments of IRT and Bayesian analysis.
    These chapters are not meant to provide detailed information for individuals interested
    in learning about these topics. Rather, these chapters provide supporting documentation
    for the subsequent chapters that describe Bayesian analysis of different IRT models
    with the use of SAS PROC MCMC. Chapter 1, on IRT, motivates the use of the models
    and provides the model formations that will be used in subsequent chapters. Chapter
    2, on Bayesian analysis, provides supporting documentation for terms and concepts
    integral to the use of PROC MCMC and the subsequent examples.


    Chapter 3 presents an overview of the PROC MCMC syntax commands and template for
    the estimation of IRT models, but focuses on syntax that is most relevant to the
    estimation of IRT models. As a result, there is some duplication with other SAS
    documentation for Bayesian analysis and the use of PROC MCMC. However, presentation
    of PROC MCMC in this book provides a self-contained guide to the use of PROC MCMC
    and Bayesian analysis of IRT models.


    Chapters 4 to 6 provide detailed presentations of the syntax used to estimate
    IRT models for different types of assessment applications. In these chapters,
    the IRT models and PROC MCMC syntax to estimate the models are discussed. Examples
    then illustrate the generation of convergence diagnostics, using different priors,
    and statistics from the posterior distributions for parameters. In some cases,
    item responses from data sets that are commonly analyzed in the literature are
    used. In other cases, item parameters can be made. The comparison between estimated
    parameters and population parameters facilitates the evaluation of using PROC
    MCMC to estimate the models. In addition, combinations of parameter estimates
    derived from using PROC MCMC with other available software are presented.


    Specifically, Chapter 4 illustrates estimation of IRT models for dichotomously
    scored items, and Chapter 5 illustrates of polytomous scored items. For both of
    these, the models that are assumed that a single person parameter determines the
    performance of respondents (idimensional IRT models).


    Chapter 6 illustrates extensions of IRT to more highly parameterized models, including
    multidimensional IRT models, models that account for any dependence between sets
    of items (testlet IRT models), multilevel IRT models, and applications to different
    item functioning (DIF). Multidimensional models are considered when more than
    one parameter is assumed. Testlet IRT models are used for testing applications
    in which individual responds to a set of items on a single or stimulus (testlet).
    Multilevel or hierarchical models may be estimated in applications where there
    exists a nested structure of item responses within clusters of people or within
    clusters of items. Finally, models for evaluating different item functioning and
    the use of mixture IRT models are considered to examine whether items function
    across subpopulations of examiners (for example, males versus females). In the
    case of mixture IRT models, these models assume that the population consists of
    qualitatively different subpopulations or latent classes that are unknown. These
    models provide a mechanism for clustering examiners to better understand any heterogeneity
    in item responses.'
