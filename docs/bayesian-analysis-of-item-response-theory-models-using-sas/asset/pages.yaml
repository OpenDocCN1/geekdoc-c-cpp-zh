    \ score based on the remaining items (corrected item to total score correlation)\
    \ are measured. Here the total score serves as proxy for the latent being measured.\n\
    \nWith regard to identifying potential problems with items, unexpected means,\
    \ extreme means (for example, values=0,1), or items with very low standard deviations\
