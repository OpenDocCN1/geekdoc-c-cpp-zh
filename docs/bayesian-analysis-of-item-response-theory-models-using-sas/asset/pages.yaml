    # Example 3: Comparing a Unidimensional IRT Model and a Bifactor IRT Model


    As discussed in Chapters 1 and 6, a multidimensional IRT (MIRT) that has recently
    received attention is the bifactor model. In the bifactor model, each item response
    is determined or explained by both a general factor and secondary factors (Gibbons
    & Dedeker, 1992; Gibbs, Immekus, Bock, 2007). The bifactor model allows for measuring
    a general ability or trait while controlling for the variance that arises from
    the measurement of other factors. The bifactor model is particularly useful in
    testing applications where the general factor is the primary trait. Secondary
    factors, which may be conceptually narrower in scope and be considered factors,
    are introduced to capture any residual item relationships beyond the general factor.


    In the bifactor model, slopes (factor loadings) are estimated for each item on
    the general factor as well as a secondary factor. Because the bifactor model allows
    for measuring a general trait while controlling for the variance that arises from
    the measurement of other traits (subdomains), a useful competing model is unidimensional
    IRT. If a simpler unidimensional IRT model can be estimated. As discussed by Reckeke
    (1994), when estimation of the trait or traits is focus, “The dimensionality of
    interest is the minimum dimensionality that provides the greatest information
    provided by the item responses.” Comparison of these two competing models is illustrated
    below using the simulated item responses that were analyzed in Chapter 6. Recall
    that the item responses were simulated under the bifactor model.


    Notably, a comparison of models could be used to evaluate whether a testlet-based
    model is preferred over a standard IRT model. From Chapters 1 and 6 individuals
    may respond to sets of items (testlet) on a single stimulus. For these applications,
    each response factor reflects a testlet in the bifactor model. Thus, for each
    item, one slope is estimated for the general factor, and one slope parameter is
    estimated for a single test factor. Comparing a unidimensional model with a bifactor
    model in this context can also be used to evaluate whether a testlet model is
    useful for describing item responses.


