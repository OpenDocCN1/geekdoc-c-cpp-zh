    \ of the Markov chain (burn-in phase) is customary, to minimize any influence\
    \ of early sampled values on the target posterior.\n\nDiagnostic tools are available\
    \ to determine the extent to which the chain has converged in PROC MCMC. Popular\
    \ tools use trace plots of parameter value iterations across the chain. A chain\
    \ that \"mix” traverses the posterior space, reaches all of the relevant parameter\
