    # The Problem of "Label Switching"


    Although discussed in the context of Bayesian analyses of mixture models, label
    switching is a potential problem with IRT models like the bifactor model. In context
    of mixture models, for example, Jasra, Holstens, & Stephens (2005, p. 2) to label
    switching:


    If exchangeable priors are placed upon parameters of a mixture model, then the
    resulting posterior distribution will be invariant to permutations in the parameters.
    As a result, the posterior distributions for the parameters will be identical
    for each mixture component. Furthermore, during MCMC simulation, the sampler encounters
    the symmetries of the posterior distribution and the interpretation of labels
    switching.


    In the bifactor model, where multiple slope parameters are estimated for each
    item, the likelihood surface may have multiple modes when the slope parameters
    are similar in size. When this happens, posterior summaries for parameters are
    invalid. It is well known that evidence of label switching in a Bayesian analysis
    may be observed in plots where the label disjointed or segmented with good mixing
    in different locations of the parameter space. In addition, multimodality in density
    plots may indicate label switching.


    If this problem occurs, constraints on parameters may need to be imposed. For
    example, in the bifactor model (Program 6.1), upper constraints on the secondary
    factors can be defined as below. In this code, an upper bound in the joint distribution
    for the slope parameters for the secondary factors is defined as the value for
    slope parameter on the general factor. While these types of constraints may be
    useful in certain circumstances, it is recommended that an unconstrained model
    be estimated first, and trace/density plots be examined for any abnormal patterns.


    ```

    begindata:

    lipriora=0;

    do kk=1 to 10;

    if kk<6 then do;

    lipriora=lipriora + lpdfnorm(ai_[kk], 0,4,0);

    lipriora=lipriora + lpdfnorm(ae_[kk], 0,2,0,al_[kk]);

    end;

    elelse do;

    lipriora=lipriora + lpdfnorm(al_[kk], 0,4,0);

    lipriora=lipriora + lpdfnorm(a3_[kk-5], 0,2,0,al_[kk]);

    end;

    enddata;

    prior ai_1-al_10 a2_1-a2_5 a3_1-a3_5 = general(lipriora);

    ```'
