  md: '# Chapter 1: Item Response Theory


    item parameters (number of parameters per item × number of items) if the sample
    is normally distributed, and a ratio that is somewhat greater for nonnormal examinee
    distributions.


    Other researchers (for example, Hambleton & Swaminathan, 1985; Lord, 1980) have
    discussed problems with the ML-based estimation of item parameters. For example,
    slope parameter estimates near zero can be obtained in combination with very large
    absolute estimates of item threshold parameters; slope parameter estimates for
    some items may not converge and continue to increase with each iterative cycle
    in the estimation algorithm; and for scale, isolating and estimating a lower asymptote
    parameter may prove difficult below the midpoint of the theta scale. Finally,
    ML-based estimation methods are more complicated to implement for more highly
    parameterized IRT models such as MIRT and mixture models.


    Interest in IRT models using Bayesian methods has grown tremendously during the
    beginning of the 21st century. In this, growth is due to the appeal of the Bayesian
    paradigm among psychometricians and statisticians, as well as the advantages of
    these methods with small sample sizes, when parameter estimation is unstable,
    and for more complex or highly parameterized models. In Bayesian estimation methods,
    for example, constraints may have an impact on the parameter space, distributions
    so that parameters do not drift out of bounds. For more complex IRT models, a
    Bayesian approach has been particularly useful (see, for example, Béguin & Glas,
    2001; Bolt & Lall 2003; Bradley, Weiner, & Wang, 1999; Cohen, & Kim, 2013; DeMars,
    2006; Li, & Fu, 2006; Patz et al., 2002; Yao & Schwarz, 2006; Zhu & Stone, 2012).
    Finally, with commonly used estimation methods for IRT models (for example, MML),
    person parameters are not estimated simultaneously with item parameters. Rather,
    person parameters are estimated by fixing item parameters at estimated values
    and estimating person parameters in a separate analysis. A Bayesian approach estimates
    estimates person parameters simultaneously with item parameters, and in doing
    so incorporates or models any uncertainty in item parameter estimates when estimating
    point estimates and uncertainty in person parameter estimates.'
