    # Evaluation of IRT Model Applications


    To evaluate the validity of an IRT application to an assessment, a number of assumptions
    underlying the use of IRT models require examination (Embreton & Reese, 2000;
    Hamble & Swaminathan, 1985; Yen & Fitzpatrick, 2006). When these assumptions are
    not sufficiently met, the validity of inferences from the IRT model application
    is compromised.


    # Dimensionality


    IRT models predict performance in relation to one or more underlying dimensions
    (traits or abilities). With unconditional IRT models, one latent trait is assumed
    to determine an examinee''s performance; in others, traits are homogeneous in
    their measurement of the measured trait or ability. However, responses to an assessment
    will always be multifarious in nature and reflect or construct-invariant variance
    (e.g., context effects) in addition to the number of factors measured by design.
    Nuisance minor factors reflect random dimensionality, whereas the number of dimensions
    is test to measure fixed dimensionality (Wainer & Thissen, 1996). Multidimensional
    IRT models assume that multiple traits underlie performance and may with more
    than one trait determines an examinee''s performance.


    Assessing the number of dimensions underlying is relevant to both evaluating the
    application of an IRT model and to understanding the construct(s) being measured.
    Keck (1994) argued that the exploration of dimensionality may also be affected
    by the assessment. When the structure of the assessment is the focus, overestimating
    the dimensionality may be desirable over underestimating the dimensions. However,
    if the trait or ability is the focus, then the minimum dimensionality that provides
    the greatest information and most meaningful interpretation is the objective.
    If dimensionality is overestimated, more parameters are estimated, and in turn
    error may increase.


    Factor analysis or cluster-based methods are used to explain the dimensionality
    in test responses because these methods attempt to explain the associations of
    a set of variables (items) in terms of a smaller number of factors (dimensions).
    If the objective is to evaluate whether multidimensional models may be used in
    a testing application, Strout (1990) describes a nonparametric test for "essential
    dimensionality". Furthermore, MIRT models may be estimated and compared with unidimensional
    IRT models. For example, slope parameters is analogous to the pattern of factors.
    Nested models with different number of ability parameters can be compared to assess
    dimensionality. For a general discussion of these approaches in the context of
    IRT applications, see, for example, Hambleton and Swaminathan (1985), Embreton
    and Reese (2000), and Yen & Fitzpatrick (2006).


    # Local Independence


    A second assumption is local independence. That is, after accounting for the underlying
    trait being measured (or condition), examine responses to items are statistically
    independent. This assumption is essential to the computation of the likelihood
    function and the estimation of model parameters. In a MIRT model context, local
    independence now refers to a coordinate space for the multiple traits being measured.'
