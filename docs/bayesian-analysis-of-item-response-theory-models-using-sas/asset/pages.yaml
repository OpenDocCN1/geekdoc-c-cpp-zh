    # Autocall Macros for Post-Processing PROC MCMC Data Sets


    All of the plots and tables available in PROC MCMC can be regenerated with the
    use of autocall macros or macros available in SAS libraries. For PROC MCMC, Table
    3.3 details the available autocall macros. For all macros, the data set of posterior
    samples and variable list are required. Optional parameters can be used to suppress
    printing (PRINT=NO) and save results to a SAS data set (OUT=<dataset>). For example,
    to regenerate the diagnostic plots from the 1 IP analysis using OUTPOST=LSAT_BAYES,
    using the following command:


    ```

    %TADPLOT(DATA=LSAT_BAYES, VAR=A B1-B5);

    ```


    Notably convergence diagnostics can also be produced using the OUTPUT data set
    and JMP software

    (Zink, 2014).'
