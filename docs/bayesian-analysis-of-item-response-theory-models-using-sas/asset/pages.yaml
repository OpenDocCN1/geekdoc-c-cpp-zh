  md: "# 174 Bayesian Analysis of Item Response Models Using SAS\n\n# Program 6.5:\
    \ Unconditional Multilevel IRT Model for the Math Item Responses\n\n```\nproc\
    \ mcmmc data=math output=math_post seed=23 nbi=5000 nmc=40000\nplots=(trace autocorr)\
    \ nthreads=8;\n\n b[15]; array d[15]; array a[15]; array p[15];\nparms a1 d0;\n\
    parms a2 d0;\nparms a3 d0;\nparms a4 d6;\nparms a5 d5;\nparms a6 l1;\nparms a7\
    \ l1;\nparms a8 l1;\nparms a9 l1;\nparms d10 0;\nparms a11 d11;\nparms a12 d12;\n\
    parms a13 d13;\nparms a14 d14;\nparms a15 d15;\nbegindata;\na10=1; d6=0;\nenddata;\n\
    parms gamma0 0;\nparms sch theta_v .5 / slice;\n\nprior d1-d5 d7-d15 ~ normal(0,var=4);\n\
    prior a11-a15 ~ normal(0,var=4,lower=0);\nprior gamma0 ~ normal(0,var=2);\nprior\
    \ sch theta_v ~ t(0,sd=2,1,lower=0);\nrandom sch m ~ normal(m,var_sch) subject=school;\n\
    random theta ~ normal(m,var_theta) subject=obs_j;\n\ndown j=1 to 15;\np[j] = logistic(a[j])*theta\
    \ - d[j]);\nb[j]=d[j]/a[j];\nend;\n\nmodel ix1 ~ binary(p1);\nmodel2 ~ binary(p2);\n\
    model ix3 ~ binary(p3);\nmodel ix4 ~ binary(p4);\nmodel ix5 ~ binary(p5);\nmodel\
    \ ix6 ~ binary(p6);\nmodel ix7 ~ binary(p7);\nmodel ix8 ~ binary(p8);\nmodel ix9\
    \ ~ binary(p9);\nmodel ix10 ~ binary(p10);\nmodel ix11 ~ binary(p11);\nmodel ix12\
    \ ~ binary(p12);\nmodel ix13 ~ binary(p13);\nmodel ix14 ~ binary(p14);\nmodel\
    \ ix15 ~ binary(p15);\nrun;\n```\n\nProgram 6.6 presents the code for including\
