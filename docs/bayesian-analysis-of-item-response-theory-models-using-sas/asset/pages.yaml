  md: "# 242 Bayesian Analysis of Item Response Theories Using SAS\n\n```\ndata ppp_lz;\n\
    set ppp_lz;\narray ppp_4(&nperson);\ndo person-1= to &nperson;\n  ppp_value=ppp(person);\n\
    \  output;\nend;\nkeep person ppp_value;\nrun;\n\n/* finding misfit response patterns\
    \ **/\ndata misfit;\nset ppp_lz;\nwhere ppp_value>0.95 or ppp_value<0.05;\nrun;\n\
    proc sort data=misfit; by person; run;\ndata mispatterns;\nmerge(in=a) obs (in=b);\
    \ by person; if a; run;\nset misfit;\npattern=cat(of x1-x15);\nrun;\n```\n\nScatterplots\
    \ can also be plotted to illustrate the relationship between the li values for\
    \ observed and predicted responses. The code used to draw the scatterplot is similar\
    \ to other examples and is included in the program on the authors' webpage for\
    \ the book. Note that only one scatterplot for one person exhibiting fit (PPP\
    \ value =5) and one scatterplot for another person exhibiting misfit (PPP value\
    \ =99) are presented to illustrate the process of generating graphs.\n\nOutput\
    \ 8.10 displays the scatterplots of observed and li values for these two people.\
    \ The left plot is for the person exhibiting fit (PPP value =5), indicating that\
    \ this person correctly answered the three easier items (Items 1, 4, 5) and incorrectly\
    \ answered the two harder items (Items 2 and 3). The data points are scattered\
    \ around the diagonal line, suggesting that there is no systematic difference\
    \ between the observed and li values.\n\nIn contrast, the plot on the right is\
    \ for a person exhibiting misfit (PPP value =99). This person's response pattern\
    \ was 00110, indicating that the easier items were answered incorrectly and the\
    \ harder items correctly (PPP value is 0.99). The values in the scatterplot are\
    \ also above the diagonal line indicating that the predicted li values are systematically\
    \ greater than the observed values. Both the PPP value and the scatterplot indicate\
    \ misfit of the 1P model for this person."
