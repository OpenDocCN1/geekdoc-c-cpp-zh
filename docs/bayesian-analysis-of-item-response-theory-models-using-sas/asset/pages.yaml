    # Hierarchical Priors


    In the above examples, constants were used to define the parameters of the prior
    distributions. These parameters, called hyperparameters, can be parameters with
    associated priors (hyperpriors or hierarchical priors). This creates a hierarchical
    structure to the prior specifications that allows for, in the context of IRT models,
    "borrowing information across observational units (individuals or items), thereby
    making the results more robust" (Johnson, Sinhahay, & Bradley, 2007, p. 589).
    Hierarchical priors may also be used to reduce the strength of priors, perform
    a nonparametric analysis, and let the data influence hyperparameters.


    For example, in the 1 IRT model, we may want to consider the b i parameters to
    be exchangeable and assign a normal prior to the bi parameters (Kim & Bolt, 2007).
    Priors are then specified for these parameters—a local or restricted uniform prior
    for the mean and an inverse gamma distribution for the variance parameter. While
    the inverse gamma distribution is typically specified in this context because
    it is a conjugate prior to the normal distribution, Gelman (2006) has recommended
    uniform or half priors for variance parameters.


    The commands for this hierarchical model are presented in Program 3.5. You can
    see that in this program, the prior for the bi parameters are normal distributions
    with hyperparameters = MUB and variance = VARB. Priors for these hyperparameters
    reflect both noninformative distributions (MUB ranging from -6 to 6 and an inverse
    gamma distribution for VARB with parameters equal to 0.1). The prior variance
    distributions are typically equal, although this is not required. These priors
    allow the data to estimate the hyperparameters of the normal prior for the bi
    parameters. Thus, the amount of "shrinkage" to the mean of the prior is determined
    by the data. A cautionary note is that hyperparameters can become unstable with
    small data where little information is available to estimate the hyperparameters
    precisely (Gelman, Carlin, Sun, Vahtari, & Rubin, 2014).


    # Program 3.5: Posterior Summary Output from PROC MCMC with Hierarchical Priors


    ```

    proc mcmc data=lsout=lsat_bayes seed=23 niter=5000 maxit=20000

    array b[5];

    array p[5];

    params a=1;

    params b: 0;

    parms b ~ normal(mub,varb);

    prior mub ~ uniform(-6,6);

    prior varb ~ gamma(.01, scale=.01);

    prior a ~ lognormal(0, var=4);

    ```'
