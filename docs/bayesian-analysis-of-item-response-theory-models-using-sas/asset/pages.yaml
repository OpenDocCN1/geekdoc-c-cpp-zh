  md: '# 28 Bayesian Analysis of Item Response Models Using SAS


    interpretations afforded by a Bayesian paradigm, other advantages when estimating
    statistical models (in particular, IRT) include the following:


    +   - parameter estimates are typically more precise than Maximum Likelihood (ML)
    estimates.

    - methods accommodate perfect and imperfect response patterns.

    - ability or trait parameters are estimated simultaneously with item parameters.
    Therefore, uncertainty in item parameter estimates is propagated to ability or
    trait parameters.

    - use of prior distributions provide more stable estimation. Parameter estimates
    do not "drift out of bounds" as may be the case, for small samples or short tests.

    - estimation of more complex or highly parameterized models is more accessible
    (for example, parameters that reflect additional facets of an assessment).


    # Use of Bayesian Analysis to Estimate a Proportion—An Example


    Consider a bag of balls with $N$ balls at random, and $r$ white balls are observed.
    What is an estimate of the proportion of white balls $(\pi)$ in the bag? In a
    Bayesian analysis, the posterior distribution for the given observed data, $p(D|\pi)
    = p(D|\pi)p(\pi)/p(D)$, is computed. The likelihood function, $p(D|\pi)$, reflects
    the probability of observing $r$ successes (white as observed nonwhite balls)
    in $N$ independent trials (draws from the bag). Given success rate $\pi$ may be
    modeled using the binomial distribution:


    ```

    $p(D|\pi) = \binom{N}{r}\pi^r(1-\pi)^{N-r}$

    ```


    The prior distribution, $p(\pi)$, or the prior distribution or belief about $\pi$
    before collecting the data, also needs to be specified in the Bayesian paradigm.
    It is often useful to choose a "conjugate" prior or prior that has the same functional
    form as the likelihood. The advantage of a conjugate prior is that the product
    of a conjugate prior and the likelihood yields a posterior with the same form
    as the prior. Furthermore, use of a conjugate prior precludes the need to compute
    $p(D)$, which can be complicated.


    The Beta distribution is a conjugate prior distribution for the binomial distribution;
    therefore, a Beta prior with a binomial likelihood produces a Beta posterior.
    With the example, there that a Beta prior with parameters $a$ and $b$ or Beta
    $(a,b)$ has the following form:


    ```

    $p(\pi; a, b) = k\pi^{a-1}(1-\pi)^{b-1}$

    ```


    for


    ```

    $0 \le \pi \le 1$

    ```


    where $k$ is a normalizing constant with location and scale parameters, $a$ and
    $b$. Combining the Beta prior with the binomial likelihood $p(D|\pi)$, you obtain
    the posterior distribution for the parameter $\pi$ as follows:


    ```

    $p(\pi|D) = \binom{N}{r}\pi^r(1-\pi)^{N-r}[k\pi^{a-1}(1-\pi)^{b-1}]$

    ```


    Because $\pi$ does not depend on the constants in the equation, they can be ignored
    and $p(\pi|D)$ can be expressed as proportional to a function in the following
    follows:


    ```

    $p(\pi|D) \propto \pi^{r+a-1}(1-\pi)^{N-r+b-1} = \pi^{r+a-1}(1-\pi)^{N-r+b-1}$

    ```


    for


    ```

    $0 \le \pi \le 1$

    ```'
