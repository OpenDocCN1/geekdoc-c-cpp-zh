  md: "# The Nominal Response Model\n\nBock’s (1972) nominal response (NR) model is\
    \ the most general model for polytomously scored items and is used to model items\
    \ when response categories are not necessarily ordered along the trait ($\theta$)\
    \ scale. In the NR model, the probability of an examine with trait level $\theta$\
    \ responding in the $k^{th}$ response option, for item $j$ with $m_j$ response\
    \ options (or categories), is given by the:\n\n```\n$P_{jk}(\\theta) = \\frac{e^{z_{jk}}}{\\\
    sum_{l=1}^{m_j} e^{z_{jl}}}$\n```\n\nfor\n\n$k = 1, \\dots, m_j$,\n\nwhere $z_{jk}\
    \ = a_{jk}\\theta + c_{jk}$ is a multivariate log for the $k^{th}$ option in item\
    \ $j$, $a_{jk}$ is the option discrimination parameter for item $j$ and category\
    \ $k$, and $c_{jk}$ is the option extremity parameter for item $j$ and category\
    \ $k$. As discussed in Chapter 1, to identify the model, the constraint $\\sum\
    \ a_{jk} = \\sum c_{jk} = 0$ across $k$ or the constraint $a_{j1} \\equiv c_{j1}\
    \ = 0$ for each item is typically specified.\n\n# Estimating the NR Model\n\n\
    Program 9 uses the PROC MCMC code for estimating the NR model with the DASH data\
    \ set. For each DASH item, there are five parameters ($\\alpha_{1}, \\alpha_{2},\
    \ \\alpha_{3}, \\alpha_{4}, \\alpha_{5}$) and five intercept parameters ($\\gamma_{1},\
    \ \\gamma_{2}, \\gamma_{3}, \\gamma_{4}, \\gamma_{5}$) corresponding to five response\
    \ categories. However, for model identification purposes, the first slope and\
    \ intercept for each item are constrained to be 0 in a BEGINNATA-ENDDATA block.\
    \ Two-dimensional arrays are used for the item parameters where the first index\
    \ corresponds to the response probabilities and the second index corresponds to\
    \ the category response number. The multivariate logits are stored in the Z[5]\
    \ and P[5] arrays. The item parameters within each item are treated as a block,\
    \ and their initial values are set to 0. The priors for slopes and intercepts\
    \ are declared as unbounded normal distributions with mean of 0 and variance of\
    \ 25. To obtain the likelihood of the data, the multivariate logits for the second\
    \ to fifth response options ($z_{2}$ to $z_{5}$) are calculated first. Note that\
    \ the logit for the first option ($z_{1}$) is 1 since its slope and intercept\
    \ are both 0. In the next step, the response probabilities for 5 options are computed."
  merge: -1
  pgno: 151
- img_proc: true
  md: "# Program 5.9: PROC MCMC for Estimating the NR Model\n\n```\nproc mcmc data=dash_data\
    \ outpost=dash_postNR seed=23 n=5000 nmc=20000\nmonitor(a) diagnostic=all plots;\n\
    \narray[10,5] a1_1-a1_5 a2_1-a2_5 a3_1-a3_5 a4_1-a4_5 a5_1-a5_5\na6_1-a6_5 a7_1-a7_5\
    \ a8_1-a8_5 a9_1-a9_5 a10_1-a10_5;\ncarray[10,5] c1_1-c1_5 c2_1-c2_5 c3_1-c3_5\
    \ c4_1-c4_5 c5_1-c5_5\nc6_1-c6_5 c7_1-c7_5 c8_1-c8_5 c9_1-c9_5 c10_1-c10_5;\n\
    array[10] p(5);\nparams a1_1-a1_5 c1_1-c1_5;\nparams a2_1-a2_5 c2_1-c2_5;\nparams\
    \ a3_1-a3_5 c3_1-c3_5;\nparams a4_1-a4_5 c4_1-c4_5;\nparams a5_1-a5_5 c5_1-c5_5;\n\
    params a6_1-a6_5 c6_1-c6_5;\nparams a7_1-a7_5 c7_1-c7_5;\nparams a8_1-a8_5 c8_1-c8_5;\n\
    params a9_1-a9_5 c9_1-c9_5;\nparams a10_1-a10_5 c10_1-c10_5;\n\nbegindata\ni1_1=0;a2_1=0;a3_1=0;a4_1=0;a5_1=0;a6_1=0;a7_1=0;a8_1=0;a9_1=0;a10_1=0;\n\
    c1_1=0;c2_1=0;c3_1=0;c4_1=0;c5_1=0;c6_1=0;c7_1=0;c8_1=0;c9_1=0;c10_1=0;\nendata;\n\
    \nprior prior c1_1-c1_5 c2_1-c2_5 c3_1-c3_5 c4_1-c4_5 c5_1-c5_5\nc6_1-c6_5 c7_1-c7_5\
    \ c8_1-c8_5 c9_1-c9_5 c10_1-c10_5\n- normal(0,var=25);\nprior a1_1-a1_5 a2_1-a2_5\
    \ a3_1-a3_5 a4_1-a4_5 a5_1-a5_5\na6_1-a6_5 a7_1-a7_5 a8_1-a8_5 a9_1-a9_5 a10_1-a10_5\n\
    - normal(0,var=25);\ndandom theta=normal(0,var=1) subject=obs_j;\nlllike=0;\n\
    do j=1 to 10;\n do k=1 to 5;\n  p[k]=exp(a[j,k]*theta+ c[j,k]);\n end;\n do k=2\
    \ to 5;\n  p[z]=z/(1+sum(of z-25));\n end;\n p[1]=sum(of p2-p5); calc prob for\
    \ category 1;\n lllike=llike+log(p[ix[j]]);\n end;\nmodel general(llike);\nrun;\n\
    ```\n\n# Output from Estimating the NR Model\n\nOutput 5.19 shows the summary\
    \ statistics for selected item parameters. Selected results for Items 1, 7, and\
    \ 10 are reported as these items with varying item properties. The autocall macro\
    \ deffer for regenerating items, %POSTSUM, was used, and as in previous, the results\
    \ from the default summary statistics by PROC MCMC. Note that all item parameter\
    \ estimates are available in the next section comparing Bayesian and MML models.\n\
    \nAs you can see in that, the $a_{jk}$ parameters across response categories are\
    \ ordered. Given that the $a_{jk}$ parameters reflect the linear slope of the\
    \ response process (z) on each response option $k$, increasing values of the $a_{jk}$\
    \ parameters across response categories reflect an increasing probability of selecting\
    \ option $k+1$ over $k$. In turn this indicates the scale of response options\
    \ is ordered. Therefore, an ordered scale for the DASH items would be expected."
  merge: -1
