  md: '# Output 4.12: Density Plot for the Beta(5,20) Prior–c Parameter


    ![](img/dd5368102e19084dcd107a02a82ba37c_113_0.png)


    Output 4.13 provides the summary statistics from the posterior distributions for
    the item parameters, and Outputs 4.14 through 4.16 display trace and density plots
    for the item parameters. Trace plots were displayed to provide a comparison of
    mixing behavior for the common item parameters across the models (1P, 2P, and
    3P IRT models). Although not provided in the diagnostic plots, the autocorrelation
    plots were similar for the $a_i$ and $b_i$ parameters; for the $c_i$ parameters,
    the autocorrelation plots displayed low dependence except for $c_3$. From the
    trace plots in the output, you can see that the chains appear to be mixing well.
    Note that thinning the chain can be used to reduce the autocorrelation, but this
    has no effect on the posterior statistics.


    Finally, the density plots generally exhibit a degree of skewness in sampled parameter
    values. For example, sampled values for the $a_3$ parameters were more positively
    skewed with higher values than the other $a_i$ parameters. The $b_i$ parameters
    for the easiest items (Items 1 and 5) exhibited the most negative skew, which
    is not surprising. With regard to the $c_2$ parameters, the distributions more
    closely resembled the shape of the prior (see Output 4.10), no doubt because of
    the relative strength of the prior. Notably, the mean of the posterior distribution
    is commonly used for posterior inference even when the density is not normally
    distributed. It is well known that the posterior mean minimizes the Expected Bayesian
    Loss or posterior risk in using the mean as the parameter estimate under a squared-error
    loss function.'
