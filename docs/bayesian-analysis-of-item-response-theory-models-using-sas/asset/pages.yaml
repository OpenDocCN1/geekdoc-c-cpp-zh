  md: "# Chapter 2: Bayesian Analysis 35\n\n# MCMC and the Gibbs Sampler\n\nIn a multidimensional\
    \ parameter space, a special case of the Metropolis-Hastings algorithm, the Gibbs\
    \ sampler, may be used to sample from the joint posterior distribution for the\
    \ model parameters (see, for Gelman et al., 2014). This method draws from independent\
    \ conditional distributions that are in the limit equal to drawing from the joint\
    \ posterior distribution. In this algorithm, each parameter or random variable\
    \ from a vector of parameters is sampled, conditional on the most recent sampled\
    \ values for the other parameters in the vector. Thus, the joint posterior is\
    \ reduced to a set of lower or one-dimensional conditional distributions that\
    \ can be sampled as easily.\n\nFor example, with a 2 IRPT model, univariate conditional\
    \ distributions would be specified (see, by item i, draw the data and all other\
    \ item and parameters) and drawn from each parameter's conditional distribution,\
    \ given all other parameters are known. Based on arbitrary starting values at\
    \ iteration t=0, the draws at iteration t (+1) would be:\n\n+   - for item i,\
    \ draw $\\theta_i^{(t+1)}$ from $p(\\theta_i | a_{i-1}^{(t)}, \\theta_j^{(t)},\
    \ b_j^{(t)})$ \n- for item j, draw $\\theta_j^{(t+1)}$ from $p(\\theta_j | a_{j-1}^{(t)},\
    \ \\theta_i^{(t)}, b_j^{(t)})$ \n- for item k, draw $\\theta_k^{(t+1)}$ from $p(\\\
    theta_k | a_{k-1}^{(t)}, \\theta_j^{(t)}, b_j^{(t)})$\n\nWhen the Markov chain\
    \ converges, $(\\theta^{(t)}, a^{(t)}, b^{(t)})$ will be from the stationary joint\
    \ posterior or target distribution.\n\nNote that PROC MCMC determines the sampling\
    \ algorithm based on the parameters and their prior specifications. When appropriate,\
    \ PROC MCMC uses conjugate sampling methods to their conditional posterior spaces;\
    \ otherwise, a random walk Metropolis algorithm is used by PROC MCMC. Other sampling\
    \ algorithms are available such as a slice sampler. For more detail, see Chapter\
    \ 3 in this book. In the SAS Help, for PROC MCMC. Or, in the SASSTAT 13.2 User’s\
    \ Guide (SAS, 2014), see \"The MCMC Procedure,\" or Chapter 7, \"Introduction\
    \ to Bayesian Analysis Procedures.\"\n\n# Burn-In and Convergence\n\nBecause the\
    \ MCMC method samples parameters iteratively, you should determine whether the\
    \ Markov chain has converged to the target distribution. If the chain has not,\
    \ the simulated draws from this chain do not represent the parameter space or\
