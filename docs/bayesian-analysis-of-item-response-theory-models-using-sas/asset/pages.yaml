  md: "# 128 Bayesian Analysis of Item Response Models Using SAS\n\nOutput 5.13: Comparison\
    \ of Posterior Densities for the Four Threshold Parameters (Item 1)\n\n![](img/dd5368102e19084dcd107a02a82ba37c_143_0.png)\n\
    \nComputation of Transformations by Post-Processing Posterior Results\n\nAny transformations\
    \ of parameter estimates may be obtained by post-processing the set of posterior\
    \ results saved using the OUTPOST output on the PROC MCMC command. For example,\
    \ rather than compute the threshold parameters ($b_h$) using the intercept parameter\
    \ ($a_0$) and slope parameters ($a_h$) in the PROC MCMC program (see program 5.2),\
    \ the OUTPOST data set can be processed. Assuming the transformation is excluded\
    \ from Program 5.2, the following DATA step and PROC MEANS command can be used\
    \ to compute the values of $b_h$ for each iteration, and compute point estimates\
    \ for the parameters from the means of the posterior samples for the $b_h$ parameters.\
    \ The ease in processing of the posterior samples illustrates the flexibility\
    \ of using PROC MCMC for Bayesian analysis.\n\n```\ndata dash_transformed;\n \
    \ set dash_postGR;\n  array a[10] a1-a10;\n  array d[4,10] d1_d1_a10 d2_d2_a10\
    \ d3_d3_a10 d4_d4_a10;\n  array b[4,10] b1_b1_a10 b2_b2_a10 b3_b3_a10 b4_b4_a10;\n\
    \  do j=1 to 10;\n    do k=1 to 4;\n      b[k,j]=d[k,j]/a[j];\n    end;\nrun;\n\
    \nproc means data=dash_transformed;\n  var a1-a10 d1_d1_a10 d2_d2_a10 d3_d3_a10\
    \ d4_d4_a10 b1_b1_a10\n  b2_b2_a10 b3_b3_a10 b4_b4_a10;\nrun;\n```"
