    # Estimation of the GR Model by Method 1


    Program 5.2 provides code for estimating the GR model. The code in the program
    is based on the Method 1 prior specifications (lower bound specifications) because
    this method is commonly used with the GR model. In these programs, changes were
    made to the template to make the program more concise. First, two-dimensional
    analyses, B[4,10] and D[4,10], are used to represent the 40 threshold and 40 intercept
    parameters across the 10 items. Second, a joint prior distribution for the intercept
    parameters is specified, and all intercept parameters are sampled from this distribution.
    This is described in more detail.

    Finally, a BEGINDATA-ENDDATA block of statements is used. Any statements included
    within the block are executed only at the first and the last observation of the
    data set. Thus a BEGINDATA-ENDDATA block of statements reduces unnecessary observational-level
    computations, and is appropriate for computations that are identical across observations,
    such as transformation of parameters.


    Although not presented, Programs 5.3 and 5.4 contain the code for estimating the
    GR model using the other methods and are included on the SAS Press authors'' web
    page for this. As discussed above, given the differences observed for the different
    methods of prior specifications, a comparison of results based on the different
    methods is presented in a later section.'
