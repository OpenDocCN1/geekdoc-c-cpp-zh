    # **Program 6.3: Estimating the Testlet Model


    ```

    proc mmc data=testlet_post output=testlet_post seed=123 nbi=5000

    mc=60000 nthread=8 plots=(trace density);


    array b[15]; array x[15]; array t[15];

    array p[15]; array a[15];

    array vard[3]; array gamma[3];

    params a1 b1 0;

    params a2 b2 0;

    params a3 b3 0;

    params a4 b4 0;

    params a5 b5 0;

    params a6 b6 0;

    params a7 b7 0;

