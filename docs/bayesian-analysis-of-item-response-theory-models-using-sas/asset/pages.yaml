  md: "# 172 Analysis of Item Response Theory Using SAS\n\nAs described by Demars\
    \ (2006), the slope parameters in Program 6.4 (bifactor model) are not comparable\
    \ with the gamma parameters in the testmodel. To estimate a model that competes\
    \ with the testmodel more directly, you may decompose the single slope parameter\
    \ for items within a secondary factor into $g \times a_{(j)}$, where $g$ is the\
    \ item slope on the general factor and $a_{(j)}$ is a parameter corresponding\
    \ to $Y_{it(j)}$ for each latent (scaled N(0,1)). This model can be estimated\
    \ using the following statements:\n\n```\narray alpha[3]; * alpha parameter for\
    \ each testlet;\nparms alpha:.5; * initial value for each alpha parameter;\nprior\
    \ alpha ~ N(0, var=1); * prior for each alpha parameter;\nlikely;\ndj=1 to 5;\n\
    z = -(alpha[j]*theta[1] + al[j]*alpha[1]*theta[2] - d[j]);\npr = 1 /(1 + exp(z));\n\
    like = like + ix[j]*log(pr) + (1-ix[j])*log(1-pr);\ndj=6 to 10;\nz = -(alpha[j]*theta[2]\
    \ + al[j]*alpha[2]*theta[3] - d[j]);\npr = 1 /(1 + exp(z));\nlike = like + ix[j]*log(pr)\
    \ + (1-ix[j])*log(1-pr);\n;\nmodel general(likely);\n```\n\n# Hierarchical–Multilevel\
    \ IRT Models\n\nMany IRTs make an assumption of independence of item response\
    \ functions conditional on the latent traits ($\theta$) in order of the likelihood\
    \ function. However, in some testing applications, there exists a structure of\
    \ item responses within clusters of persons, within clusters of items, or both,\
    \ and in applications this assumption may not be reasonable. For example, in applications\
    \ where students are clustered within schools, the responses of the students in\
    \ a school (cluster) are likely to be more related than accounted for by their\
    \ latent traits alone. Another example is a behavioral assessment in which persons\
    \ clustered within neighborhoods may be similarly related.\n\nFor these types\
    \ of testing applications, hierarchical models, also referred to as multilevel,\
    \ random effects, can be used to model any dependency within clusters of persons\
    \ or items. For more detail about hierarchical IRT models, see example, Johnson,\
    \ Sinharay, and Bradley (2007)\n\n# Description of the Multilevel IRT Model\n\n\
    A multilevel approach conforms to the natural structure of item responses, persons,\
    \ and clusters or groups (Fox, 2010; Fox & Glas, 2001). In the most basic application\
    \ of a multilevel model, the response assumes that persons are clustered in G.\
    \ In the model, the Level 1 model is an IRT model or model expression representing\
    \ probability conditional on it and person characteristics. At the next level,\
    \ Level 2, a structural model may be used to describe the relationship between\
    \ the latent variable measured at Level $i$ and person-level covariates ($X_i$)\
    \ to explain variability in $\theta$, across persons. At this level, the latent\
    \ variables measured for persons are dependent variables; $\theta_i = \beta_0\
    \ + \beta_1X_i + \\dots + \beta_kX_{ki} + \\epsilon_i$; with the random effects\
    \ for persons $\\epsilon_i \\sim N(0, \\sigma^2)$.\n\nIf persons are clustered\
    \ in groups, such as schools, then an index $g$ for the G groups is included in\
    \ the Level 2 model, $\theta_{ig} = \beta_{0g} + \beta_{1g}X_{ig} + \\dots + \b\
    eta_{kg}X_{ig} + \\epsilon_{ig}$ and $\\epsilon_{ig} \\sim N(0, \\sigma_g^2)$,\
    \ and a Level 3 model is added to explain variability in the Level 2 random effects.\
    \ At this level, the $\beta_{kg}$ coefficients are dependent variables with"
  merge: -1
  pgno: 187
- img_proc: true
  md: "# Chapter 6: IRT Model Extensions 173\n\ngroup level covariates, $y_{wi}$,\
    \ introduced to explain variance: $\\beta_{igj} = \\gamma_0 + \\gamma_{1ige} +\
    \ \\dots + \\gamma_{iwg} + \\mu_{igj}$ and $\\mu_{ig}$\\nmultivariate $N(0, \\\
    Sigma)$.\n\nYou can see that an advantage of a multilevel modeling approach is\
    \ that it can be introduced to\nexplain variance in parameters and model measurement\
    \ error at the different levels of the multilevel\nmodel. Fox (2010) discusses\
    \ that the introduction of explanatory variables can also lead to more accurate\n\
    parameter estimation (for example, use of collinear information about examinees).\n\
    \nIn a multilevel IRT, the scale of the latent $\\theta$ variable concerns several\
    \ variance components (for example,\nschool variance and person variance) that\
    \ are estimated. To identify the model,\ndifferent approaches can be taken. Fox\
    \ (2010) fixes the mean of $\\theta$ values at 0 and the standard\ndeviation of\
    \ $\\theta$ values at 1 in each MCMC iteration. In an earlier paper, Fox and Gelin\
    \ (2001)\nidentified the model through item parameters—fixing one slope for an\
    \ item at 1 and\none intercept parameter for item 0. In the example that the item\
    \ parameters are\nimposed to identify the model.\n\n# Estimation of the Model\n\
    \nThe example that is provided is based on an analysis by Fox (2010). The data\
    \ consists of item responses to\ndiscotomously scored items from the Dutch Primary\
    \ School Mathematics Test. The student\ngroup consisted of 2,156 $8^n$ students\
    \ from 97th grade. School level covariates were available\navailable explain variance\
    \ in math ability: socioeconomic status (SES), and gender (GENDER – males = 0,\
    \ females = 1). School-\nlevel covariate (Participated) was used to differentiate\
    \ among students that regularly participated in a\nprimary school program (Participate\
    \ = 1 or 0). This, a three-level model can be used to analyze\nthis data.\n\n\
    Program 6 presents the case for estimating the unconditional model. That is, a\
    \ model with no covariates.\nThis is a modified version of the model used to estimate\
    \ the 2P IRT. To identify the model,\nparameters for one slope and one intercept\
    \ parameter are fixed. If these parameters were\nfixed at particular values, these\
    \ parameters are not included in PARMS statements for these items.\nThe particular\
    \ parameters that were chosen were based on a preliminary analysis using a 2P\
    \ IRT\nmodel. From the preliminary analysis, the slope parameter for Item 10 identified,\
    \ and the intercept\nparameter for Item 6 approximated 0. Of course, any items\
    \ can be chosen, choosing items where the\nslope parameter is -1 and the intercept\
    \ parameter is -0 is chosen, choosing the other items around\nreflecting average\
    \ diversity and difference discrimination.\n\nIn the unconditional model, the\
    \ student level $\\theta$ is modeled by a school level ($\\beta_{0j}$) and a\\\
    within-school error term ($e_{ij}$), where $\\theta_{ij} = \\beta_{ij} + e_{ij}$.\
    \ The school intercept is modeled by an overall level\n($\\gamma_0$) and a school\
    \ error term ($\\zeta_j$), where $\\beta_{0j} = \\gamma_0 + \\zeta_j$. The parameters\
    \ in the programming\nthese components include overall math ability for schools\
    \ (GEMMA00); a school-variance\nparameter (SCH\\_V); and a student level $\\theta$\
    \ variance (THETA\\_V). That is, the SCH\\_M variable\nin the program serves as\
    \ the school-specific intercept variable $\beta_{ij}$\n\nA Normal prior is used\
    \ for the overall mean. The program used to estimate the test IRT\nmodel, both\
    \ of the variance parameters are sampled using the sampler with half-distribution\n\
    priors. Two random effects statements are included: one for the school level (Level\
    \ 3) with the\nused to identify students (SUBJECT<SCHOOL); and for the person\
    \ level (Level 2) with the variable\nused to identify subjects (SUBJECT=OBS).\
    \ Priors for the random effects reflect the\nparameters in the Normal distributions\
    \ used for the different effects in the model (SCH\\_V and\nETA\\_V). The remaining\
    \ code in the program is the same code used to specify the likelihood model for\n\
    the 2P IRT model (Level 1)."
