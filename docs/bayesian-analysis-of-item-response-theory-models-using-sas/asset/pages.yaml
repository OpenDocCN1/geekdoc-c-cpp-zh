    # Model Identification


    Model identification is an issue that arises with IRT models because the models
    are over-parameterized, and ability or trait parameters (θ) and item difficulty
    or threshold parameters (b) are unobservable and on the same scale, the metric
    for the θ or b parameters must be defined. One advantage of Bayesian paradigm
    is that specification of priors with constant values defines a metric for the
    model (for example, Fox, 2010). Notably, the prior distributions for all θ or
    person parameters are defined as N(0). In other words, the latent traits or abilities
    are assumed to be sampled from normal distributions. In the case of multiple person
    parameters, θ, multivariate normal prior would typically be specified. However,
    it is also possible to have unconstrained priors for θ and establish a metric
    within each iteration of the MC algorithm; for example, standardize the θ at each
    iteration (see the example, Fox, 2010). Notably, this option would add overhead
    to algorithm and increase computation requirements.


    # Example Use of the Template for the 1-Parameter IRT Model


    The 1-Parameter (1P) model uses a logistic response for each item j with zi =
    Da (θ - bj), where θ represents a single person for each examination; bj reflects
    a threshold or item difficulty for item j; and a is a common parameter across
    all J items. The example presented in this is based on data that is used in various
    SAS software applications and analyzed by Bock and Lieber (1970). This SAS set
    consists of responses from 1000 examines to J=5-multiple choice from the Law School
    Admissions Test (LSAT). It is assumed that the SAS data set of item responses
    (LSAT) has been used for estimating a 1P model. See the SAS Authors web page for
    a program to create this SAS data set (Program_Appendix.SAS).


    # Program 3.2: PROC MCMC Code for Estimating a 1P IPT Model


    ```

    proc mcmc lsat_output=lsat_bayes seed=23 nmc=20000 nbi=5000

    diagnostics=all plots=(trace autocorr); 1


    array b[5]; 2

    array p[5]; 3

    ```'
