  md: "# # Use of a Normal Logistic Link Function\n\nNote that a normal function,\
    \ $\\Phi(z)$, which also models the cumulative probability of a variable, is a\
    \ natural link function to use with IRT models. For $\\Phi(z)$, $z$ is called\
    \ a *normal deviate* and is defined as the logistic function $z = Da(\theta -\
    \ b)$. Because the logistic function is more mathematically tractable based on\
    \ maximum likelihood procedures, the logistic function has received more attention\
    \ in software used to estimate IRT models. In a Bayesian analysis, the intractability\
    \ of $\\Phi(z)$ is not an issue. Nonetheless, many of the examples of Bayesian\
    \ IRT models still use the logistic function in the likelihood expression.\n\n\
    To implement with a normal logistic link function, replace the line of code, $P[j]\
    \ = \\text{LOGISTIC}(A\\theta - D[j])$, with $P[j] = \\text{PRONORM}(A\\theta\
    \ - D[j])$. As an illustration, Output 4 includes the summary statistics for the\
    \ IP code in Program 1 with a normal logistic link function. As you choose, $b$,\
    \ the parameters for the different link functions are essentially equivalent.\
    \ For $a$ the parameter, the difference can be accounted for by the difference\
    \ in the scaling counts ($D$). Although not specified, implicit in the $\\Phi(z)$\
    \ function is a scaling constant $D$— typically set to $1.702$ or $1.0$. When\
    \ $D=1$, the difference between the $a$ parameters for the normal and logistic\
    \ link functions are functionally related ($0.4359 / 1.702 = .2546$). Thus, to\
    \ ensure essential equivalence between the two link functions, $D$ should be set\
    \ to $1.702$ using the logistic link function.\n\nOutput 4: Posterior Summary\
    \ Statistics for the Item Parameters–1P Model\n\n| Parameter | N | Mean | Standard\
    \ Deviation | 95% HPD Interval |\n|---|---|---|---|---||\n| a | 20000 | 0.4359\
    \ | 0.0394 | 0.3594 | 0.5128 |\n| b1 | 20000 | -3.6087 | 0.3225 | -4.2294 | -2.9964\
    \ |\n| b2 | 20000 | -3.1815 | 0.1527 | -1.6848 | -1.0892 |\n| b3 | 20000 | -0.3318\
    \ | 0.1012 | -0.5283 | -0.1332 |\n| b4 | 20000 | -1.8095 | 0.1797 | -2.1768 |\
    \ -1.4827 |\n| b5 | 20000 | -2.8364 | 0.2638 | -3.3593 | -2.3371 |\n\n# ## The\
    \ 2-Parameter IRT Model\n\nThe 2-Parameter (2P) estimates the 1P model by estimating\
    \ each item, the logistic deviate is $z_i = a(\theta - b)$ or $z_i = a\theta -\
    \ d$. By estimating separate slope parameters for each item, this model assumes\
    \ that items have different discriminatory power or have different relationships\
    \ with the underlying trait or ability being measured. The PROC MCMC commands\
    \ used for estimating the 2P model are provided in Program 4.2. Note that the\
    \ commands are similar to the commands used to estimate a 1P model, except that\
    \ now for the item discrimination parameters, $a_i$, is defined (ARRAY A), and\
    \ the array elements (ARRAY B) are referenced in the LOGISTIC function.\n\nOther\
    \ differences exist between the estimating 2P (Program 4.2) and for estimating\
    \ the 1P model (Program 4.1). To reduce autocorrelation among the sampled parameters\
    \ in the 2P model, separate PARMS statements for each item to define separate\
    \ blocks of parameters. Parameters in the same block are updated jointly in the\
    \ sampling process, and any possible correlation between parameters in the same\
    \ block is thereby taken into account (see Chapter 5 for more discussion on blocking\
    \ of parameters)."
