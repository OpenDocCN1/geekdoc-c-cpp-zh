  md: '# Chapter 8: Bayesian Model-Checking for IRT Models 227


    The next step is to compute the observed number of examinees in each response
    category (0 and 1 in this example) for each theta group. PROC FREQ is used to
    cross-tabulate the response (X, 0,1) by theta group (GROUP) for each item. A MAC
    LOOPITEMS executes the FREQ procedure for each item. The SPARSE option was specified
    in order to include any observation with a zero frequency. Frequency counts for
    each item are merged into a single data set (OBS, ALLITEMS) and restructured into
    a data set OBSQ500 (frequency of counts) ⊕


    This process is repeated for the predicted item response set (PREDICT_DIST). In
    this case, you need to restructure the posterior data set using the RESTRICTURE
    command ⊕ The MAC LOOPITEMS is used to execute the FREQ procedure on the predicted
    frequencies with counts processed and saved in the data set PREDICT. ⊕ Each of
    these data sets includes variables representing frequency counts in the 10 discrete
    theta groups with response categories 0 and for each of 5 items (NITEM × NCAT
    = NGROUPS values). Each of these 100 values is denoted Oij in Yen’s Qi formula,
    where j is the item, g refers to the group, and k is the response category (the
    section "Item-Level Measures" for detail on this statistic).


    When you compute Eij in Yen’s Qij formula, the item parameters and group means
    are merged with the observed and predicted frequencies ⊕. Then, for each item,
    mean means for groups and the sampled item parameter values are used to compute
    model-based expectations (proportions responding 0 or 1) for each theta group.
    Because the 1P model was investigated, the 1P model was used to compute the probability
    of responding 0 and 1, and expected frequencies were computed using this probability
    times the number of examinees in each group. Given Oij and Eij, Yen’s Qi measure
    for item j is equal:


    > $$Q_{ij}^sigma = [(O_{ij} - E_{ij})^2 / E_{ij} + (O_{ij} - E_{ij})^2 / E_{ij}]
    \uplus$$


    To compute the $Q_i$ measures for the observed responses, you compute $O_{ij}$
    using the observed frequencies in the variables of OBSFREQ(J,G,X). To compute
    $Q_i$ for the replicated responses, you compute $O_{ij}$ using the predicted frequencies
    in the variables of the PREFREQ(J,G,X). The $E_{ij}$ are equivalent when you compute
    $Q_i$ for the observed and replicated responses.


    The observed and predicted Yen’s $Q_i$ measures are saved in the variables Q10BS1–Q10BS5
    and Q1PRE1–Q1PRE5 in the data set Q1. Each of 500 pairs of observed and predicted
    measures may be compared, and PROC MEANS may be used to compute $PPP$ values or
    the proportion of times across $R$ replications that $T(D^{pre}, \delta)$ equals
    or exceeds $T(D, \delta)$. These 500 pairs of observed and predicted Yen’s $Q_i$
    measures can be displayed in a scatterplot using SAS commands as illustrated in
    the program on the author’s webpage for this book.'
