    # Treatment of Item Parameters as Random Effects


    In addition to modeling the person parameters as random effects, you can also
    model the item parameters as random effects. As discussed by Fox (2010), this
    approach does not necessarily require a "sampling argument" and may improve parameter
    estimation by reducing the dimensionality for the parameters. Furthermore, as
    discussed in Chapter 1, a class of hierarchical models can be used to model random
    item effects where a random error term is added at the item level and covariates.
    For example, features or cognitive skill requirements can be introduced to explain
    variability in item parameters. In this section, specifying items as random effects
    is illustrated in order to compare with the estimation of the item parameters
    with fixed effect specification in the example above.


    In order to estimate a model with random and item effects, the data set must be
    consistent with the hierarchical structure to model. In typical response sets,
    items are nested within persons. Program 3.6 may be used to reconstruct the data
    necessary to estimate a random item effect IRT model for the $b_i$ parameters.
    The DATA step in the program creates a SAS data set with 5 observations for each
    person (indexed by the variable OBS). Thus, there is a total of $N \times J$ observations
    in the data, where $N$ equals the number of persons and $J$ the number of items.
    Each observation for each person will contain one item response $(a)$ that corresponds
    to one particular item (indexed by the variable ITEM).'
