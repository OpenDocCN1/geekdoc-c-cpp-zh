  md: '# Chapter 7: Bayesian Comparison of IRT Models 191


    In the context of IRT estimation with MCMC methods, the CPO statistics are first
    estimated at the level of an individual item response, using the inverse likelihood
    of each observation for T samples in the joint posterior distribution:


    ```

    $CPO_{ij} = \left( \frac{1}{T} \sum_{t=1}^{T} \frac{1}{p(y_{ij} | \delta_t)} \right)^{-1}$

    ```


    where T is the number of samples from the chain, and $p(y_{ij} | \delta_t)$ is
    the likelihood of the response data for an examineee $i$ and item $j$ based on
    the sampled item and parameter values at time $t$ ($\delta_t$). Given the likelihood
    for each examineee, $CPO_{ij}$ is computed by the inverse of the average of the
    likelihoods across the T draws.


    An item-level CPO index can be computed by summarizing the product of the values
    of $CPO_{ij}$ across all N examinees:


    ```

    $CPO_{j} = \prod_{i=1}^{N} CPO_{ij}$

    ```


    A CPO index for the overall test can be computed by summarizing the product of
    the item-level $CPO_{j}$ across all J items:


    ```

    $CPO = \prod_{j=1}^{J} CPO_{j}$

    ```


    Note that the natural logarithm of the CPO was used for comparison in this chapter.
    The product terms become above summations over persons and items. The preferred
    model is the model with the larger CPO value.


    # Computing Model Statistics in PROC MCMC


    To output the DIC statistics in PROC MCMC


    In order to compare the DIC for the overall test and the item-level $CPO_{ij}$
    for each of the items, a SAS program that processes the OUTPOST data from a Bayesian
    analysis using PROC MCMC. A template for the program is presented below so that
    you can see the link between the programming code and the formula provided. The
    first step in the process linking sampled values from the joint posterior distribution
    for the model parameters (item and person parameters) to the observed data for
    each examineee $i$. This allows for computing the likelihood of the item response
    data for each examineee using the sampled parameter values in each iteration ($p(y_{ij}
    | \delta_t)$) $\Omega$ and accumulating results across iterations (\sum $1/p(y_{ij}
    | \delta_t)$) $\Omega$. The next step summarizes results across iterations to
    obtain the CPO at the level of the individual item response ($CPO_{ij}$) $\Omega$
    and then summarize $CPO_j$ results across each item (item-level CPO index or $CPO_j$)
    and across items (test-level CPO index or $CPO$). $\Omega$'
