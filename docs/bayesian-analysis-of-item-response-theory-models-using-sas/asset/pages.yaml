    # Other Multidimensional IRT Models


    Assessments are often multidimensional in nature because items are sampled from
    multiple domains of an overall construct (for example, quality of life). In cases
    where subdomains or subscales may be of interest, Gibbons et al. (2007) caution
    against treating these subscales as secondary factors in an application of the
    bifactor model. These authors discuss that trait estimates from the secondary
    factors in the bifactor model underestimate trait levels. When you are reporting
    in both general and specific factors from the bifactor model, Demars (2013) suggests
    reporting a composite score. For a discussion of composite scores, see, for example,
    Haberman (2008), Sinaray, Puruhan, and Haberman (2021), and Feinberg and Weiner
    (2014).


    Alternatively, here MIRT models that were discussed in Chapter 1 may be considered
    to model any multidimensionality in effect. If you are interested in subscale
    scores, a simple structure factor analysis can be deemed. In the bifactor model,
    items are related (load) to two factors, the general and one secondary factor.
    Items relate to only one factor or dimension in a simple structure factor analysis
    model. For example, given six items with two factors, items 1–4 may be assumed
    to relate to factor 1 and 5–6 may be assumed to relate to factor 2.


    In a simple factor model, correlations between the factors or traits that are
    modeled may not be assumed. If no correlations or an orthogonal model is assumed,
    the model is equivalent to estimating separate unidimensional IRT models for each
    subscale, and estimating separate unidimensional IRT models may be preferred to
    estimating the more complex MIRT model.


    Because subscales are often assumed to be correlated, a simple structure factor
    model is particularly of interest in MIRT applications. In addition to modeling
    the multidimensionality in item responses, there may some efficiency in parameter
    estimation gained by estimating correlations among the factors. This gain in efficiency,
    is at the expense of factor interpretation because each trait contributes to the
    estimation of other traits through the correlation (see, for example, DeMars,
    2013).


    Program 6.2 presents the PROC MCMC code for estimating a two-dimensional, simple,
    correlated IRT model to the same bifactor data. As you can see, the structure
    of the program is similar to'
