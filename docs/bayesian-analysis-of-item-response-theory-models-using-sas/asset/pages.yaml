  md: "Numerous arrays are designed to facilitate different parameters and variables\
    \ in the model.\nSpecifically, ARRAY_bl_[10] represents bl_1 to bl_10 or the set\
    \ of first parameters for the 10 items. Similarly, b2_[10], b3_[10], and b4_[10]\
    \ represent the second, third, and fourth sets of parameters for the 10 items.\
    \ The item parameters for Item 1 are defined by b1_1, b2_1, b3_1, and b4_1 in\
    \ the program. Arrays P_STAR and P define two dimensional arrays with rows indexing\
    \ items and columns cumulative response probabilities\n(P_STAR) and category response\
    \ probabilities (P).\n\nIn order to reduce autocorrelation in parameter value,\
    \ MULTIPLE PARMS statements are used to block sets of parameters for each item\
    \ (see Chapter 3, \"Parameter Building\\ In the program template, initial values\
    \ of 1 are given for parameters (a), and the initial values of -1,\n0.5, 0, and\
    \ 1 are given for the first, second, third, and fourth intercepts (d1, d2, d3,\
    \ d4). It should be noted that the initial values of these intercepts for each\
    \ item are also ordered to reflect the\nconstraint in in the GR model: d1 < d2\
    \ < d3 < d4.\n\nThe PRIOR statements provide the prior distributions for parameters\
    \ specified in PARMS statements.\nAs for models in Chapter 4, the prior distributions\
    \ for the parameter (a) of DASH items\nare assumed to follow a normal distribution\
    \ with mean of 0 and a variance of 16. In\ncontrast to the priors in Chapter 4,\
    \ no lower and upper bounds were necessary to define a reasonable\nset of bounds\
    \ on sampled values. Since all item flows follow the same distribution, one PRIOR\n\
    statement is used with A: indicating the 10 parameters.\n\nThe prior distribution\
    \ specifications for the thresholds (bi) or intercepts (di) enforce the order\
    \ constraint in the GR model. That is,\nb1 < bi2 < bi3 < bi4 or di1 < di2 < di3\
    \ < di4. Though priors for these parameters also typically\nfollow normal distributions,\
    \ one PRIOR statement for all intercepts PRIOR D : NORMAL\n(<distribution specifications->)\
    \ cannot be used for the dichotomous IRT models (see Chapter 4).\nInstead, for\
    \ each item, you have to specify four threshold or intercept parameters in four\n\
    PRIOR statements to reflect the order constraint. There are 40 prior statements\
    \ for the threshold\nor intercept parameters in total. Three different options\
    \ for specifying the prior distributions are\ndiscussed in the next section.\n\
    \nThe DO loop is used to compute cumulative response category probabilities for\
    \ each item\n(P_STAR[i,1] – P_STAR[i,j]), transform the intercept parameters (di)\
    \ to compute the threshold\nparameters (bi), and use differences between cumulative\
    \ response probabilities to compute\nprobability of responding in each of the\
    \ categories (P[i,1] – P[i,j]). Note that the response\nprobability for response\
    \ Category 1 (P(1,1)) is the difference between the cumulative probabilities\n\
    for response Category 1 (P[i,1]) and for response Category 2 (P_STAR[i,1]). The\
    \ response probability\nfor response 2 (P[i,2]) is the difference between the\
    \ cumulative probabilities for response\nCategory 2 (P_STAR[i,1]) and for response\
    \ Category 3 (P_STAR[i,2]). The probability associated\n the last category (P[i,j])\
    \ is equal to cumulative probability (P_STAR[i,j]). Lastly, if\nthreshold parameters\
    \ are included in the response as a function of the slope and intercept parameters\
    \ would\ndeleted.\n\nThe MODEL statement specifies the likelihood distribution.\
    \ There is no need to specify the\ndependent variable in the MODEL statement since\
    \ the log likelihood function includes the dependent\n(IX array).\n\n# Options\
    \ for Specifying Prior Distributions for the Thresholds and Intercept Parameters\n\
    \nThe literature contains details regarding how to specify the prior distributions\
    \ which give the order constraint\nfor the threshold or intercept parameters for\
    \ each item. Three different methods are discussed to reflect\nanordered constraint\
    \ between parameters for each item in the\nGR model. The code is presented without\
    \ without the item subject to simplify the\npresentation."
