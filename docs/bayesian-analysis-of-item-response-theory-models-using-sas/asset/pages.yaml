  md: 'you can specify a user-defined Gibbs sampling algorithm using the USD statement.
    See the SAS auxiliary documentation for PROC MCMC for detail.


    # Built-In Distributions


    A number of standard and familiar distributions are available for use with PROC
    MCMC and the PRIOR RANDOM statements. Tables 3.1 and 3.2 provide a summary of
    the distributions most relevant for estimating IRT models. In the models, all
    labels in braced arguments are optional, whereas others labeled arguments are
    required. For example, the specification NORMAL(MEAN=0, SD=1) is equivalent to
    NORMAL(0, SD=1).


    Also, for distributions requiring reflecting dispersion, either the standard deviation
    (SD-), variance (VAR-), or precision (PREC-) which is the inverse of the variance,
    can be specified. Also, all of the univariate distributions, with the exception
    of binary and uniform, have optional LOWER- and UPPER-arguments. These options
    can be used to specify bounds on the distributions. For a complete list and description
    of all available distributions, consult the SAS auxiliary documentation for PROC
    MCMC.


    Note that the gamma and inverse gamma distributions are widely used in Bayesian
    analysis. Given a normal distribution, the gamma distribution is typically used
    as a conjugate prior for the precision parameter. The inverse-gamma distribution
    is typically used as a conjugate prior for the variance parameter. As an example
    of the relationship between the gamma and inverse gamma distributions, the specification
    for precision, τ ~ gamma(shape=0.01, scale=0.01), is equivalent to a specification
    for the variance σ² ~ gamma(shape=0.01, scale=0.01). Use of the gamma and inverse
    gamma distributions for variance parameters is commonplace. However, Gelman (2006)
    recommends the use of uniform or half t priors. This is discussed more in Chapter
    6.'
