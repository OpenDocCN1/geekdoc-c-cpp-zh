    heta)$ for a 5-Category Item under the NR Model\n\n![](img/dd5368102e19084dcd107a02a82ba37c_27_0.png)\n\
    \n# Other Testing Effects in Unidimensional IRT Models\n\nIn practice, individuals\
    \ may respond to a set of items (testlet) based on a single or common stimulus.\
    \ For example, four items constructed for each reading passage in a reading comprehension\
    \ test would form separate testlets. Assessment applications using polyous items\
    \ (for science, performance assessments) may also consist of one or more testlets\
    \ (Lane & Stone, 2006). For these types of testing applications, the assumption\
    \ of local independence is to be violated. The responses to the items within a\
    \ testlet might be more highly related than predicted by the latent ability or\
    \ trait for the entire test.\n\nIn other applications, individuals may respond\
    \ to items that are rated (for example, performance assessments), and an essential\
    \ element to consider in the assessments is the use of scoring rubrics. R England\
    \ (2002) refers to this type of assessment as \"rater-mediated\" because performance\
    \ assessments do not provide direct information about the constructs of interest\
    \ but mediated information through interpretations by raters. Thus, the observed\
    \ performance is dependent not only on the measured construct of interest (for\
    \ example math ability) but on rater characteristics and behaviors such as severity,\
    \ task difficulty, and the structure of the rating scale as number of score levels.\
    \ Thus, there is a confounding of rater and items inherent to item response.\n\
    \nA major concern with rater-scored assessments is that raters bring a variety\
    \ of potential biases to the rating process. Some examples that England includes\
    \ different interpretation of the score scale by raters, bias in ratings from\
    \ male opposed to female responses, and bias in rater interpretations about the\
    \ difficulty level of the tasks. Other researchers have classified rated errors\
    \ in terms of halo effects, central tendency, restriction of range, and severity\
    \ or leniency of raters (Saal, Downey, & Lahey, 1980)."
  merge: -1
