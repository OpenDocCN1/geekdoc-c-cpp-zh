    # Effect of Different Priors


    Because the prior contains additional information in a Bayesian analysis, different
    prior specifications can influence the posterior estimates. Output 3.21 compares
    the posterior densities for one parameter ($b_2$) in the 1P model under different
    prior specifications:


    +   * Typical prior—$b_2 \sim$ Normal(0,4)

    * Uninformative prior—$b_2 \sim$ Normal(0,100)

    * Hierarchical prior—$b_2 \sim$ Normal($\mu_b, \sigma_b^2$) where $\mu_b \sim$
    uniform(-6,6) and $\sigma_b^2 \sim$ gamma(.01,.01)'
