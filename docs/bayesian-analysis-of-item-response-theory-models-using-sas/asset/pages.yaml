    \ approaches. Any trivial differences are caused by direct sampling is used to\
    \ sample values in the separate prior specifications, whereas the metropolis sampler\
    \ is used to sample values in the joint prior specifications.\n\n# Program 5.5:\
    \ Comparing Separate and Joint Prior Specifications—Method 1\n\n```\nproc mcmc\
    \ data=n=100000 seed=22 nbi=1000 out=out1(density=);\n  params d1=-1 d2 -5 d3\
    \ ~5 d4=1;\n  prior d1 ~ n(0, sd=5);\n  prior d2 ~ n(0, sd=5, lower=d1);\n  prior\
    \ d3 ~ n(0, sd=5, lower=d2);\n  prior d4 ~ n(0, sd=5, lower=d3);\n  model general(0);\n\
    run;\n\nproc mcmc data=out2 seed=23 nbi=1000 nmc=100000(density=);\n  params d1=-1\
    \ d2 -5 d3 ~5 d4=1;\n  beginnodata;\n  lprior = lpdfnorm(1,0,5);\n  lprior = lprior\
    \ + lpdfnorm(d2,0,5,d1);\n  lprior = lprior + lpdfnorm(d3,0,5,d2);\n  lprior =\
    \ lprior + lpdfnorm(d4,0,5,d3);\n  endnodata;\n  prior d ~general(lprior);\n \
    \ model general(0);\nrun;\n```"
