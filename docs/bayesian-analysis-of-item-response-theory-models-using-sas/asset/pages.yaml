    prior b: normal(0, var=4);

    prior a: normal(0, var=4, lower=0);

    prior t: t(0, s=3, lower=0);


    random gamma1: normal(0, var=4) subject=obs_obs;

    random gamma2: normal(0, var=2) subject=obs_obs;

    random gamma3: normal(0, var=3) subject=obs_obs;

    do j=1 to 15;

    p[j] = logistic(a[j]*(ttheta[j] - b[j]) - gamma[t[j]]));

    end;

    model ix1 ~ binary(p1);

    model ix2 ~ binary(p2);

    model ix3 ~ binary(p3);

