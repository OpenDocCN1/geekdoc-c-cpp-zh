  md: '# 170 Bayesian Analysis of Item Response Models Using SAS


    Output 0.11: Trace and Density Plots for Item Parameters–Testlet Model


    ![](img/dd5368102e19084dcd107a02a82ba37c_185_0.png)


    Alternatively, applications involving testlets may be estimated using a bifactor
    model (for example, Li Bolt, & Furu, 2006; Demars, 2006). The bifactor model is
    consistent with testlet applications because it allows for estimating a general
    ability or trait after controlling for the variance that arises from nuisance
    factors. In the case of applications of the bifactor model to item responses involving
    testlets, slope parameters for the common stratum and parameters for the general
    factor are estimated for all items. Item slope parameters are also estimated for
    secondary factors that correspond to the sets of items within testlets. Slope
    parameter estimates that are high on secondary factors indicate the presence of
    strong local dependence.


    If a separate slope parameter is estimated for a secondary factor or testlet,
    a general testlet model is estimated (Li et al., 2006). Such a model may be preferred
    over the testlet IRT model discussed above. Li et al. argue that in the testlet
    IRT model, the primary trait (θ) and testlet traits (γ) are multiplied by a single
    slope parameter (α(θ - b_{jk} - γ_{ij)})). Thus, items with high slope parameters
    will have corresponding high test parameters, which may or may not be a reasonable
    result or expectation for realistic testing applications.


    Program 6.4 provides the code for estimating a bifactor model with testlet applications.
    In the code, the same data set of simulated items is used. A general testlet model
    is estimated in which a single slope parameter for each secondary factor is estimated
    (A2_1–A2_5, A3_1–A3_5, and A4_1–A4_5). Note that no output from estimating this
    model is presented.'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# Program 6.4: Bifactor Model for the General Testlet Model


    ```

    proc mcmc data=testlet_data testlet_bifactor_post seed=423

    nbi=5000 nmc=60000 nthreads=8 diagnostics=none plots=(trace density);


    array ix[15]; array d[15]; array theta[4];

    array a1[15]; array a2[5]; array a3[5]; array a4[5];

    parms a1_1 1 a2_1 1 d1 0;

    parms a2_1 1 a2_2 1 d2 0;

    parms a3_1 1 a3_2 1 d3 0;

    parms a4_1 1 a4_2 1 d4 0;

    parms a5_1 1 a2_5 1 d5 0;

    parms a6_1 1 a3_1 1 d6 0;

    parms a7_1 1 a2_2 1 d7 0;

    parms a8_1 1 a2_3 1 d8 0;

    parms a9_1 1 a3_4 1 d9 0;

    parms a10_1 1 a3_5 1 d10 0;

    parms a11_1 1 a4_1 1 d11 0;

    parms a12_1 1 a4_2 1 d12 0;

    parms a13_1 1 a4_3 1 d13 0;

    parms a14_1 1 a4_4 1 d14 0;

    parms a15_1 1 a4_5 1 d15 0;


    prior_a1_a15 normal(0, var=4, lower=0);

    prior_a2_1-a2_5 a3_1-a3_5 a4_1-a4_5 normal(0, var=4, lower=0);

    prior_d1-d15 normal(0, var=4);

    random theta normal(0, var=1) subject=obs;

    random theta2 normal(0, var=1) subject=obs;

    random theta3 normal(0, var=1) subject=obs_;

    random theta4 normal(0, var=1) subject=obs_;


    lllike=0;

    d j=1 to 5;

    z = -(a1[j]*theta[1] + a2[j]*theta[2] - d[j]);

    pr = 1 / (1 + exp(z));

    llike = llike + ix[j] * log(pr) + (1 - ix[j]) * log(1 - pr);

    end;

    nd j=6 to 10;

    z = -(a2[j]*theta[1] + a3[j-5]*theta[3] - d[j]);

    pr = 1 / (1 + exp(z));

    llike = llike + ix[j] * log(pr) + (1 - ix[j]) * log(1 - pr);

    end;

    d j=11 to 15;

    z = -(a3[j]*theta[1] + a4[j-10]*theta[4] - d[j]);

    pr = 1 / (1 + exp(z));

    llike = llike + ix[j] * log(pr) + (1 - ix[j]) * log(1 - pr);

    end;

    model general(llike);

    run;

    ```'
