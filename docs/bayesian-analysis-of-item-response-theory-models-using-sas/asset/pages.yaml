    # ## Model-Fit Statistics


    Model fit for IRT models are generally grouped into three types: test-fit statistics,
    item-fit statistics, and person-fit statistics. As described in Chapter 1, both
    test- and item-fit statistics are used for evaluating IRT model. The difference
    is that test-fit assesses the fit of all tests as a whole, whereas item-fit evaluates
    the fit for each individual item. Lack of fit indicates that the assumed IRT model
    does not accurately how examine respond to the items. Person-fit statistics are
    used to assess the fit of models for a specific examine. Lack of fit indicates
    that estimated model parameters for the selected IRT model do not capture the
    response pattern for a specific example. To evaluate the fit of an IRT model,
    you should consider


    Test-level fit is compromised, another IRT model might be appropriate and suggested
    by the PPMC analysis or by consideration of an alternative theoretical approach
    over item and person characteristics used to model fit. For example, a multidimensional
    IRT model might be suggested by a PPMC analysis of a unidimensional IRT model
    for item responses (see Example 7 in this chapter). Alternatively, lack of fit
    at the test level may not uncover the responsible items, and these items could
    be deleted from the test or revised. Even when model fit is found at the test
    level, it may still be useful to perform a PPMC at the item level to evaluate
    whether any items are functioning as expected. Finally, although a lack of fit
    may be found, some researchers have argued that practical significance must be
    demonstrated. For example, Sinharay and Habberman (2014) presented several examples
    of assessing the practical significance of model misfit and discuss that validity
    inferences about the fit can still be made under certain conditions of model misfit.


    When IR models are compromised at the person level but not at the test or item
    level, the issue is that the IRT model is not appropriate for an individual person
    or persons. In this case, the response pattern for a person does not match the
    pattern of the model, or is called aberrant, and person compromises inferences
    about a person''s estimated score (theta). There are a number of possible sources
    for aberrant responses patterns, including for example, cheating and careless
    responding in the educational assessments, and individuals engaged in response
    sets such as socially desirable response or acquiescence in the case of psychological
    and behavioral assessments. A small number of individuals with aberrant patterns
    could not affect model fit, but a large number of individuals with aberrant patterns
    could be a source of.


    # ## Test-Level Fit


    A common way to evaluate model fit at the test level is to observe and compare
    score distributions or the number of persons with each test score. If the observed
    test score distribution corresponds to the predicted test score distribution,
    there is no evidence of model misfit at the test level. In addition to this descriptive
    comparison of the two distributions, Béguin and Glas (2001) suggest using a Pearson
    chi-squared statistic (chi2) to test the difference between the observed and expected
    score distributions for T total scores.


    # ## Item-Level Fit


    Even when an IRT model fits the data at the test level, some of the items may
    not respond as expected under the specific IRT model (Embretson & Reise, 2000).
    Identifying these misfitting items can help testers isolate poor items in item
    pool and retain only items in the pool that fit'
