- img_proc: true
  md: "# Chapter 8: Bayesian Model-Checking for IRT Models 215\n\n$Y_j$ is the response\
    \ to item $j$, and $P_j(\\theta)$ is the probability of a correct response for\
    \ an examinee with ability level $\theta$. $E(l_0)$ and $Var(l_0)$ are computed\
    \ by the following:\n\n```\nE(l_0) = \\sum_{j=1}^{J} P_j(\\theta)\\log P_j(\\\
    theta) + [1 - P_j(\\theta)]\\log[1 - P_j(\\theta)]\n```\n\nand\n\n```\nVar(l_0)\
    \ = \\sum_{j=1}^{J} P_j(\\theta)[1 - P_j(\\theta)] [log\\frac{P_j(\\theta)}{1-P_j(\\\
    theta)}]^2\n```\n\n# Evaluation of Model Fit\n\nThe discrepancy statistic computed\
    \ from the observed data is compared to the same measure computed on each of the\
    \ replicated data sets based on the parameter values from the posterior distribution.\
    \ If a model fits the data, then the discrepancy computed from the observed data\
    \ should be similar to the same measure computed from the replicated or simulated\
    \ data. Thus, discrepancies play a similar role in Bayesian statistics as hypothesis\
    \ testing.\n\nAs discussed, this comparison is often presented through graphical\
    \ displays. For example, a histogram of $T(\\theta)$ can be drawn with $T(\\theta)$\
    \ on the histogram. If $T(\\theta)$ is near the middle area of the histogram,\
    \ then we consider the model fit adequate. Predictive probability values (PPP)\
    \ values can also be computed to quantify the occurrence of $T(\\theta)$ in the\
    \ reference distribution, whereas PPP values near 0 or 1 (typically PPP <0.05\
    \ or PPP >.95) suggest inadequate model-data fit (Gelman et al., 2014). Use of\
    \ both graphical displays and PPPs to evaluate model fit are provided in the examples\
    \ in this chapter.\n\nWith hypothesis testing in classical model-fitting\n\nFor\
    \ example, consider the use of a chi-squared statistic as a discrepancy measure\
    \ ($\\chi^2$) where expected values are based on sampled values for the model\
    \ parameters (8). An empirical sampling distribution for the measure may be obtained\
    \ by computing the measure for each $r^{th}$ iteration of posterior distribution\
    \ (rep$_r$) using sampled parameters. Thus, over $R$ replications, an empirical\
    \ distribution $\\chi^2$ (rep$_r$, $\\delta_r$) is obtained. For example, if $R=1000$\
    \ posterior samples are used, an empirical sampling distribution under the null\
    \ condition or model fit is computed on 1000 $\\chi^2$ (rep$_r$, $\\delta_r$)\
    \ statistics:\n\n```\n$\\chi^2 (rep_1, \\delta_1), \\chi^2 (rep_2, \\delta_2),\
    \ ... \\chi^2 (rep_{1000}, \\delta_{1000})$\n```\n\nThe observed measure may be\
    \ computed using point estimates of model parameters or however, be incorporated\
    \ by computing the measure on the observed data using sampled model parameter\
    \ values from $r^{th}$ iteration of posterior distribution ($\\delta_r$). This\
    \ process will produce a distribution of $\\chi^2$ (obs$_r$, $\\delta_r$). By\
    \ directly computing each pair of the observed discrepancy statistic and the predicted\
    \ discrepancy statistic $\\chi^2$ (rep$_r$, $\\delta_r$) across $R$ replications,\
    \ the likelihood of the observed measure can be quantified using PPP values. PPP\
    \ values close to .5 indicate model fit while PPP values near 1 or 0 suggest possible\
    \ misfit."
