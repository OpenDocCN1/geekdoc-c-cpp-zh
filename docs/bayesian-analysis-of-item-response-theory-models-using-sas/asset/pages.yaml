    - Heidelberger-Welch (stationary test). This diagnostic procedure tests whether
    the Markov chain is a “weakly” stationary process using a Cramer-von Mises statistic
    based on the relative accuracy of parameters for different lengths of the chain.

    - Heidelberger-Welch (half-width test). Using the portion of chain that passed
    the stationary test, the half-width test evaluates whether the number of iterations
    is adequate to reach a specified accuracy for the mean estimate.

    - Raftery-Lewis. This procedure reports the number of samples needed to reach
    specified accuracy in the percent parameters.

    - Effective size (ESS). This statistic measures the variation in sampled values
    across iterations of the chain.


    For details about the computations of these tests and procedures, see the PROC
    MCMC documentation in the SAS Help. Or, in SASSTAT11.2 User’s Guide (SAS, 2014),
    see Chapter 7, “Introduction to Bayesian Analysis Procedures.” These diagnostics
    are also described further in the context of Chapter 3. Note that all these diagnostic
    tools cannot be used as proof of convergence, but instead are be used only to
    detect nonconvergence or inefficiency in the chain. Furthermore, the different
    convergence diagnostics are to check different aspects of convergence. Therefore,
    a good practice is to evaluate convergence by using multiple diagnostic tools
    rather than relying on one tool.


    # Informative and Uninformative Prior Distributions


    As discussed, the prior and the specified distribution for the prior can play
    an important role in Bayesian analysis, although priors are also less relevant
    when data are numerous or when data is precise. When choosing different types
    of priors, you can classify them into two classes: informative and uninformative.


    Informative priors, also referred to as flat, vague, or diffuse priors, are designed
    to provide minimal information about the parameter being estimated and allow the
    data to dominate the analysis and determination of the posterior distribution.
    Uninformative priors assign approximately equal probability or likelihood to all
    possible values of a parameter in the parameter space. In estimating a proportion,
    the Beta(1,1) distribution reflects nonparametric because it is flat relative
    to the data (see Figure 3).


    Informative priors, on the other hand, use external information about the parameter
    before collecting data, and the analysis and estimation of the posterior on this
    external information, as well as on the data that is collected. The external information
    used to specify an informative prior could come from previous analyses on similar
    data sets or be based on mathematical properties of the parameters in a sample
    model. In estimating a proportion, the Beta(3,5) and Beta(4,4) represent different
    types of informative priors or expectations about the plausible values of the
    parameter before data is collected. Because informative priors may affect the
    form of the posterior distribution, you should conduct a sensitivity analysis
    to evaluate the influence of informative priors on posterior distributions for
    parameters.


    Although uninformative priors may be preferred when they are deemed less “subjective,”
    uninformative priors can lead to improper priors or probability distributions
    that are not defined. For'
