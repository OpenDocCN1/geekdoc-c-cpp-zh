    # A 2-Parameter IRT Model with a Hierarchical Prior


    Because the means of the sampled parameter values (point estimates) from the 2P
    model are similar, you might reasonably consider a model that reflects a common
    population for the slope parameters using hierarchical prior specification. In
    this model, the model is a hybrid 2P model in which the slope or $a_j$ parameters
    are considered exchangeable, and a model is estimated that “shrinks” the parameters
    to a common value as in a 1P model (Johnson & Albert, 1999). Thus, the belief
    is that the $a_j$ parameters are approximately equal, but you want to model expected
    variation across items. A hierarchical prior specification can be used to estimate
    a modified 2P IRT model, with hyperparameters reflecting the mean and variance
    distributions for the $a_j$ parameters.


    The commands to estimate the hybrid 2P model are provided in Program 4.3. You
    can see that two additional parameters, $MU_A$ and $VAR_A$, are specified and
    used in the hierarchical prior specification for the $a_j$ parameters. Here, a
    local uniform prior is specified for the mean of slope parameters $(MU_A)$ using
    a truncated normal distribution with a large variance. An inverse gamma distribution
    is used as the prior for the variance of the slope parameters. Inverse gamma distributions
    are typically used for variance parameters. And, in this case, the shape and scale
    specifications are similar to those by Fox (2010) in a similar application. Other
    than the hierarchical prior specification for the $a_j$ parameters, the model
    is the same as the 2P model in Program 4.2.'
