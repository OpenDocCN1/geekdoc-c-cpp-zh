  md: '# 208 Bayesian Analysis of Item Response Models Using SAS


    data, PPP values near 5 indicate that there are no differences between the realized
    and predictive values, and thus indicate adequate fit of a model. PPP near 0 or
    1 (typically values <05 or >95) suggest, that the realized statistic is inconsistent
    with the posterior predictive values and therefore reflect inadequate model-data-fit
    (Gelman et al., 2014). As discussed in Chapter 2, PPP values should not be interpreted
    in the same way as traditional hypothesis testing p values.


    The relative occurrence of T(D) in the reference distribution of T(D^ref) may
    also be evaluated using graphical displays. For example, a histogram frequency
    of T(D^ref) can be drawn with T(D) located in the histogram to indicate the relative
    frequency of the discrepancy statistic based on the observed data in the empirical
    distribution of discrepancy statistics, which are based on the replicated data.


    Other methods for model comparisons were discussed in Chapter 7, PPC has also
    been used for comparing models in a Bayesian analysis. The relative fit of a set
    of candidate models can be evaluated by comparing the means of extreme PPP values
    for the discrepancy measure(s) for the different models. A model with fewer PPP
    values is considered to fit the data better than an alternative model with higher
    extreme PPP values (see, for example, Sinharay, 2005; Zhu & Stone, 2012).


    Clearly, selecting appropriate discrepancy measures is an important consideration
    in applications of the PPC method, and they should be chosen to reflect sources
    of potential misfit. In the overall discussion, the discrepancy measure depends
    only on the T(D^ref) for replicated data and T(D) for observed data. However,
    discrepancy measures can also be computed that depends on both the data and model
    parameters (&). In this case, the discrepancy measures are denoted as T(D^ref)
    for the replicated data and T(D) for observed data.


    # The Posterior Predictive Distribution


    There are two ways to obtain the posterior predictive distribution based on the
    SAS data and the PREDICTST model. One way is to use the PREDICTST statement with
    the PROC MCMC method. The syntax with options for analysis of IR models is: preprocess
    OUTSET dataset=<value>, where the <SASdataset> specifies the data to contain the
    simulated posterior predictive samples, and the <value> for NSIM specifies the
    number of replications in the SAS data set.


    Figure 1 illustrates how to obtain the posterior predictive distribution based
    on the SAS data and the 1P model. As shown in the program, the PREDICTST statement
    is added to the PROC MCMC program for estimating the 1 model (Program A.1). The
    PREDICTST generates 500 samples from the posterior predictive distribution and
    stores them in the SAS data set LAS_PRED. The predicted response variable names
    in the LAS_PRED data set are based on the variables in the LAS data set (X1, X2,
    X3, X4, X5). The LAS data includes 5 response variables and 1000 observations.
    Thus, the LAS_PRED data set includes 500 replications of item responses (NSIM=500)
    with each replication of 5 items for 1000 observations or 500 variables based
    as X1, X2, X3, X4, X5, l1...X100, X200, X300, X400, and X500.


    # Program 8.1: Simulate Posterior Predictive Responses Based on 1P Model—SAS Data


    ```

    proc mcmc data=outpost_last_bays n=23 nsim=5000 ncm=2000

    monitor(a) diagnostics=all plots=(trace autocorr);

    array b[5]; array d[5]; array p[5];

    prior a; prior d ~ 0;

    prior d ~ normal(0, var=25);

    prior a ~ lognormal(0, var=4);

    random theta ~ normal(0, var=1) subject=obs_i;

    d j=1 to 5

    p[j] = logistic(a*theta - d[j]);

    b[j] = d[j]/j;

    end;

    model x1 ~ binary(p1);

    model x2 ~ binary(p2);

    ```'
