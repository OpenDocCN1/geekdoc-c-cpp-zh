    # Introduction


    The item response theory (IRT) models discussed in this paper are appropriate
    for analyzing item responses that are assumed to be determined by a single person
    parameter or latent trait (that is, unidimensional). However, there are a number
    of extensions to these models for other testing applications. For example, multidimensionality
    in item responses is often detected and can be caused by various factors, as designed
    test structure, unintended construct-relevant variance, and fixed item formats.
    For example, when an instrument is designed to measure more than one ability or
    trait, such as quality of life, the responses would be expected to exhibit a multidimensional
    structure. This chapter discusses several extensions to unidimensional IRT models,
    multidimensional IRT (MIRT) models, models that account for dependence between
    sets of items (testlets), hierarchical IRT models, and models that can be used
    to examine item functioning (DIF) and sample heterogeneity in item responses.
    Although not discussed in this chapter, programs that reflect random item effects
    are included on the authors’ web page for this book (see “Treating Item Parameters
    as Random Effects” in Chapter 3 for a brief discussion of these types of models).
    One example is a random item model for determining item functioning.


    # The Bifactor IRT Model


    A MIRT model that has received attention is the bifactor IRT model. In the bifactor
    model, each item response is determined or explained by both a general factor
    and specific factors (Gibbons & Hedeker, 1992; Gibbons, Immekus, & Bock, 2007).
    The bifactor model allows for measuring any general ability or trait while controlling
    for the variance that arises from the measurement of factors.'
  merge: -1
  pgno: 170
- img_proc: true
  md: "# 156 Bayesian Analysis of Item Response Models Using SAS\n\nThe bifactor model\
    \ is particularly useful in testing applications where the general factor is the\
    \ primary trait of interest. Secondary factors, which may be conceptually narrower\
    \ in scope, are introduced to capture any residual item relationships beyond those\
    \ accounted by the general factor.\n\nIn some applications, these secondary factors\
    \ can be nuisance factors and can arise from a variety of sources. For example,\
    \ Demars (2013) discusses the residual variance arising from the presence of subscales\
    \ with common center even though scales are not the focus; or from survey instruments\
    \ where both positively and negatively worded items are used and the directionality\
    \ of items forms the factor. After controlling for these factors, better estimates\
    \ of the general traits being measured for persons are obtained (Gibbons et al.,\
    \ 2007).\n\nIn other applications, the secondary factors, or group factors from\
    \ the factor-analysis literature, may be specific factors of interest. For example,\
    \ when the directionality of items is modeled as a nuisance factor (negative wording),\
    \ you may be interested in comparing persons who score high on the negatively\
    \ worded items as opposed to persons who score low on the general trait (Demars,\
    \ 2013). For example, consider the case of an achievement test that consists of\
    \ a number of items from different content areas (geometry, algebra, and trigonometry).\
    \ You may be interested in focusing on students who score low on algebra after\
    \ controlling for mathematics.\n\n# Description of the Model\n\nIn the bifactor\
    \ model, slope factors (or loadings) are estimated for each item on the general\
    \ factor as well as a single secondary factor. For example, given six items with\
    \ two secondary factors (items 1–4 are assumed to relate to factor 2 and items\
    \ 5–6 to factor 3), slope parameters for the general factor (first dimension or\
    \ factor 1) would be estimated for the six items. Also, slope parameters for the\
    \ secondary factors are estimated for items 1–4, and slope for the third are estimated\
    \ for items 5–6. Orthogonality among the dimensions is assumed in the bifactor\
    \ model because the secondary dimensions reflect the specific relationships among\
    \ different groups of items after controlling for the contribution of the general\
    \ factor. For example, a two-parameter (2) bifactor model for dichotomously scored\
    \ items is:\n\n```\n$P_i(\\theta) = \\frac{e^{z_i}}{1+e^{z_i}}$\n```\n\nwhere,\
    \ $z_i = \\sum_j a_{ij}\\theta_j + d_i$, $\theta_j$ is the person's trait/level\
    \ on dimension $j$ in the vector of traits $(\theta)$; $a_{ij}$ is the discrimination\
    \ (slope) of item $i$ on dimension $j$; and $d_i$ is an intercept parameter, which\
    \ is related to difficulty through a composite function of the slope and difficulty\
    \ parameters for item $j$. In a multidimensional context, $d_i$ is interpreted\
    \ as the log-odds of a correct response for persons with $\\theta=0 (Demars, 2013).\n\
    \nA bifactor model for polytously scored items can be an extension to the GR model.\
    \ In this bifactor model, the cumulative probability that a person selects a category\
    \ score or rating higher for item, $P_{ik}(\theta)$ is modeled by the logistic\
    \ $z_{ik} = \\sum_j a_{ijk}\\theta_j + d_{ik}$, where $d_{ik}$ is an intercept\
    \ for item $i$ and category $k$, and $\theta$ and $\theta_j$ $a_{ijk}$ have the\
    \ same meaning as above.\n\n# Estimation of the Model in PROC MCMC\n\nProgram\
    \ 6.1 presents the PROC MCMC code for estimating the bifactor model for a simulated\
