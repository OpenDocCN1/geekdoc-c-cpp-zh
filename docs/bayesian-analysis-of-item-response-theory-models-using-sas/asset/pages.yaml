    Particular items (1, 7, and 10) were selected to reflect measurement of the trait
    at varying locations on the theta. Point estimates for all parameters are available
    in a later section that covers Bayesian and maximum likelihood (MML) parameter
    estimates.


    As you can see in, the slope point estimates (means) range from 1.83 to 3.39 indicating
    that the DASH items are highly discriminating. The threshold estimates reflect
    the trait for all the items and do not spread out over the entire latent trait
    scale. A majority of the thresholds estimates are larger than 0, indicating that
    the subset of DASH is measuring the trait at the upper end of the trait scale.
    Given the order constraint for the threshold parameters, you can see that the
    four thresholds within each item are indeed ordered. In addition, the standard
    deviations (SDs) of the posterior distributions for the parameters are quite small,
    indicating that all the slope and threshold parameter estimates were estimated
    with relatively high precision.'
