    **Example 6: Observed and Predicted Person-Fit Statistic**nThis example illustrates
    the application of PPMC to evaluate person fit. The person-fit statistic $l_i$
    (see the section Person-Fit Measures for detail) is used as the discrepancy measure
    and is a function of both the data and model parameters. Program 8.12 provides
    the SAS code to assess person fit for the LSAT data under the IPL model. To facilitate
    the computation of $l_i$ values, we restructure the set of posterior samples (OUTPOST_SAMPLE_LSAT)
    into 500 sets with 1000 observations. A macro LZ draws the posterior set to compute
    $l_i$ values and stores results in the data variables LZLIKHOOD. The log-likelihood
    for each response pattern, $l_i$, is calculated (LO). The expected value (EV)
    and the variance (VLO) of $l_i$ are obtained and used to compute the $l_i$ measure.
    The IRT model used to calculate the log-likelihood values may be modified in this
    macro for other IRT model applications ⟄


    To compute the observed LS data are merged with the restructured posterior samples
    of model parameters. The LZ macro is called to process the data OBS_PARS and save
    the $l_i$ values in set LZ_OBS. The $l_i$ values for the 1000 persons (observed
    data) are saved in set LZ001–LZ1000 for each of the 500 posterior samples of model
    items (item and person parameters).


    Similarly, 500 sets of predicted responses are restructured ⟄ and with the restructured
    posterior samples of model parameters ⟄. The LZ macro is called to compute the
    $l_i$ values for the predicted responses ⟄. The data set PRE includes 1000 variables
    LZPREDI–LZPRE1000 for each of the 500 sets of predicted items (item and person
    parameters). Note that it is essential that the predicted data is based on the
    set of posterior samples in the data OUTPOST_SAMPLE_LSAT. As mentioned in other
    examples, this is required for any PPMC analysis where the discrepancy measure
    is based on both the data and model parameters. Program 8.3 can be used to select
    the posterior sample and the predicted item to ensure this match.


    To compare the observed and predicted $l_i$ values, merge the LZ OBS and LZ_PRED
    data sets and obtain PPP values as in previous examples ⟄. The PPP values for
    each observation in the LSAT data set are'
