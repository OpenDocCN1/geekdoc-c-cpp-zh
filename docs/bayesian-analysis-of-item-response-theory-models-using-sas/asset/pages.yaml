    # Computing the Posterior and Drawing Inferences


    Continuing with the example, consider 10 balls drawn from a bag of golf balls,
    and 4 white balls are observed. What is an estimate of the proportion of white
    (π) in the bag?


    Assuming a Li(1,1) or uniform prior for the data $r=4$ and $N=10$, the posterior
    distribution $p(D|\pi)$ follows a Beta$(a+r, N-r+b)$ or Beta(5,7) distribution.
    Because inferences for a Bayesian analysis use only the posterior distribution,
    you can compute a point estimate for $\hat{\pi}$ and the standard deviation for
    error $SE_{\hat{\pi}}$. For any Beta distribution, the mean of $\hat{\pi}=a/(a+b)$
    and the variance of $\hat{\pi}=(a \times b)/[(a+b+1)^2]$. Thus, for the above
    example and Beta(5,7) distribution:


    ```

    $$\hat{\pi} = \frac{a}{a+b} = \frac{5}{12} = .417$$

    $$SE_{\hat{\pi}} = \sqrt{(a \times b)/[(a+b+1)^2]} = .138$$

    ```


    In a Bayesian paradigm, you can construct a probability interval (Bayesian or
    Credible Interval) for the posterior distribution. You can construct a $(1-\alpha)$
    credible interval using $z_{\alpha/2}SE_{\hat{\pi}}$, where $\hat{\pi}$ is the
    point estimate of $\pi$ and $SE_{\hat{\pi}}$ is the standard deviation of the
    credible interval. If the posterior is not normal, you can construct a credible
    interval for the percentiles on an empirically derived distribution using Markov
    Chain Monte Carlo (MCMC) methods. For example, the 95% credible interval for $\pi$
    reflects $[\pi_{05}, \pi_{95}]$ in $\pi|D$.


    Probability statements about the parameter $\pi$ can be made from $\pi|D$. If
    95 is between the $P_5$ and $P_{95}$ percentiles of $\pi|D$. While credible intervals
    appear similar to confidence intervals, their interpretations are not the same.
    Note that in a Frequentist framework, direct probability statements or interpretations
    cannot be made unless the parameter $\pi$ is fixed.


    You can also use the posterior distribution for hypothesis testing ($H_0$) by
    comparing a null or $H_1$ value with the posterior distribution. For example,
    you can compute the proportion of white balls in the bag, which is less than an
    $H_0$ value of 3 or $\pi \leq .3$ given $p(D|\pi) \sim Beta(5,7)$. If a normal
    density is used to approximate $p(\pi|D, \pi \leq .3) = (p(\pi \leq .3) = .417/.138)
    = .20$. Then, the probability is approximately .27. Note that $\pi \leq .3$ can
    also be computed from an empirically derived posterior distribution, $p(\pi|D)$,
    by computing how many times $\pi = .3$ is less than or equal to the sample mean
    in $\pi|D$.


    Finally, $\pi|D$ can be used for predicting values from a future sample. For example,
    what is the probability of drawing a white ball in a new draw from the bag ($D''$)?
    A predictive posterior distribution for a new value (1 = white ball) from a new
