    through parallel processing using the THTHREADS option in the PROC MCMC statement.


    As illustrated and discussed in later chapters on model comparisons and evaluating
    model fit using PPMC, SAS has a more robust programming language, whereas the
    programming language available in WinBugs is difficult to use for some analyses.


    # The OUTPOST SAS Data Set


    As mentioned in Chapter 2, advantage of a Bayesian analysis of IRT models is that
    item and person parameter estimates are available simultaneously. Thus, any uncertainty
    in item parameter estimates is accounted for in the uncertainty of person parameter
    estimates. In PROC MCMC, the OUTPOST data set contains all monitored parameters,
    as well as parameters specified by the RANDOM statement to allow iterations.


    Because this data is standard SAS data set, this data set can be post-processed
    with the use of any SAS commands. For example, point estimates and standard errors
    for the theta parameters from estimating the model can be obtained using PROC
    MEANS. The means for the theta as well as the standard deviations for each theta,
    or empirical standard errors, can be computed and merged with the data of file
    items as reported in Proc 3.7.


    # Program 3.7: Program to Merge Estimates of theta and SEs with Original Item
    Responses


    ```

    * obtain summary statistics from the posterior distributions */

    proc means data=lsat_bayes;

    var theta_1_theta_100;

    output out-means mean-mean1000 sdd1-sd1000;

    run;


    /* merge the summary statistics with the original data */

    lsat;

    set lsat;

    if n=0 then set means;

    array th(1000) mean-mean1000;

    array sd(1000) sd1-sd1000;

    retain obs (0) mean--sd1000;

    obs=obs;

    theta=theta[obs];

    se=sd[obs];

    keep kl-x5 total theta

    run;

    ```


