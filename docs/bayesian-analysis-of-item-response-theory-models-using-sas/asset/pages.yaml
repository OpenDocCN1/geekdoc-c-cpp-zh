  md: '# Chapter 6: IRT Model Extensions


    Notably, a BINARY distribution could have been used for the RANDOM statement because
    only two groups were modeled. However, using the TABLE distribution allows for
    generalizing the program applications that involve more than two groups.


    # Program 6.9: Mixture IRT Model-- Simulated Item Responses


    ```

    procm mcmc data=mixture_data out=mixture_post seed=23 nbi=5000

    nmc=30000 monitor=(a b pi) nthreads=8 plots=(trace autocorr);


    array b[2,8]; array a[2,8]; array d[2,8]; 1

    array pi[8]; array pi[2];

    params a;

    params d;

    params pi;

    ray prob[2] (.5, .5)

    prior d ~ normal(0,var=4);

    normal(0,var=2,lower=0);

    prior pi ~ dirch(prob); 3

    random group ~ table(pi)subject=obs; 2

    random theta ~ normal(0,var=1) subject=obs_ 4


    d j=1 to 8

    p[j] = logit(a[group,j])theta - d[group,j]; 5

    broup(group,j)/a[group,j];

    end;


    model ix1 ~ binary(pi1);

    model ix2 ~ binary(pi2);

    model ix3 ~ binary(pi3);

    model ix4 ~ binary(pi4);

    model ix5 ~ binary(pi5);

    model ix6 ~ binary(pi6);

    model ix7 ~ binary(pi7);

    model ix8 ~ binary(pi8);

    run;

    ```


    Output 6.2 presents posterior summary results, using the autocall macro %POSTSUM,
    for a subset of the model parameters in the mixture IRT model. In this output,
    the results are presented for the slope and threshold parameters for items 1-3,
    corresponding to the first three items for class 1, and threshold parameters for
    items 9-11, corresponding to the first three items for class 2. In addition, the
    posterior summary results are presented for the latent class probability (pi1-pi2).
    Note that the posterior summary results closely an approximate analysis of the
    same data set using Mplus.


    From the output, you can see that both the slope and threshold parameters differ
    markedly between the two latent classes as designed in the simulation of the item
    responses. You can also see that the latent class probability parameters, pi and
    pi2, were estimated at .5, which reflected the number of observations in each
    class. Finally, you can see that the standard deviations for the latent class
    parameters are very small, indicating a high degree of certainty in the latent
    class assignments. Examining the GROUP random effects for simulated examiners
    confirmed that nearly all of the examiners were assigned to a single latent class
    across the iterations. Further processing of the posterior data revealed that
    the average probabilities across examiners and iterations for each latent class
    exceeded 95.'
