  md: '# 70 Bayesian Analysis of Item Response Models Using SAS


    # Informative, Uninformative, and Hierarchical Priors


    The Bayesian paradigm begins with an assessment of the uncertainty of model parameters
    (prior distributions) before data are collected. Specification of the prior distributions
    can be based on previous research, expert opinion, or based on the properties
    of parameters in the models being estimated. In the case of IRT model applications,
    it is common to use base priors on the properties of the model parameters. For
    example, slope parameters, which reflect the relationship between the item and
    the trait being measured, should be positive and relatively less than -4 or greater
    than 4. Also, threshold priors can consider whether an item serves as a board
    of measurement or is designed to measure the trait or ability in a local region
    of the theta. Generally, power priors have been discussed that for historical
    data, such as previous parameter and trait estimates, to be combined with the
    current item data in the MCMC parameter estimation process (Matuseci & Veldkamp,
    2014).


    As discussed in Chapter 2, the prior is combined with the data through the likelihood
    function to obtain posterior distributions for model parameters. However, because
    the prior contributes additional information in a Bayesian analysis, different
    types of priors can influence the analysis.


    # Informative Priors


    An informative prior is a prior that dominates the likelihood. Informative priors
    place more value on the external information as a parameter in the Bayesian analysis.
    Generally, the variance of a prior distribution determines the level of information
    provided by the prior. If the variance of a prior distribution is small, the prior
    will have more influence on the posterior distribution for the parameter. For
    example, the thresholds parameters in an IRT model may be defined as Normal(0,
    4). This may be considered a reasonable informative prior since parameters are
    typically between -4 and 4. However, the primary effect of an informative prior
    is to "shrink" the distribution of parameter values. Therefore, there will be
    a bias in the posterior toward the mean of the prior. Thus, there will be a bias
    toward the mean of the prior. One advantage of informative priors and shrinking
    values to the mean of the prior, is that the parameter space that is sampled can
    be constrained so that out-of-bounds or very uncommon values are not sampled.


    # Uninformative Priors


    Uninformative priors are often used to reduce the influence of the prior distribution
    on the shape of the posterior distribution. Such priors can be defined by specifying
    large variance terms for prior distributions. In the 1P IR model considered above,
    the prior distributions for the $b_i$ parameters can be changed to Normal with
    mean=0 and variance=100 or Normal(0, 100). These priors may be considered uninformative
    or weakly informative because the densities are relatively flat and reflect similar
    likelihoods over a reasonable range of values for the parameters. For the $b_i$,
    parameters, for example, the middle 50% of the priors from this distribution fall
    approximately -6 and 6.


    Using these prior distributions for the $b_i$ parameters, the 1P model was re-estimated
    and summary statistics for the analysis are presented in Output 3.19. From the
    output, you can see that the summary results are similar to results based on Normal(0,
    4) priors for the $b_i$ parameters in Program 3.2 (see Output 3.3), with slightly
    higher standard deviations than those for the more informative priors.'
