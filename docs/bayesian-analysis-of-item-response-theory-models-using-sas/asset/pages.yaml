  md: "# 226 Bayesian Analysis of Item Response Models Using SAS\n\n# Output 8.4:\
    \ Item Fit Plots for the LSAT Items–1P Model\n\n![](img/dd5368102e19084dcd107a02a82ba37c_241_0.png)\n\
    \n# Item Fit Results with Yen's Q\n\nItem fit plots provide meaningful insights\
    \ into the nature of misfit and have been recommended by Hamlet, Swamblin, and\
    \ Rogers (1991). However, it is also useful to use item-fit statistics to compare\
    \ observed and expected values to evaluate each item. This illustrates how to\
    \ use classic item-fit statistics with the PPMC. Yen's $Q$ is selected as a discrepancy\
    \ measure to evaluate the fit of the 1P model to the LSAT. The proportion correction\
    \ discrepancy measure in the previous example depends only on the data, the discrepancy\
    \ measure based on Yen's $Q$ statistic depends on both data and model parameters.\
    \ Thus, this discrepancy is denoted as $T(Q^\\delta)$ for the replicated data\
    \ and $T(Q)$ for observed data.\n\nProgram 8.8 computes $Q$ and $PPP$ for each\
    \ item based on the observed and predicted response data. This program uses the\
    \ following SAS data sets: observed (LSAT), posterior samples of model parameters\
    \ (500) in `OUTPOST_SAMPLE`, and posterior responses (500 sets of simulated responses)\
    \ in `PRED_DIST`. `PRED_DIST` is in Format 1 contains 500 data sets $\times$ 1000\
    \ simulated observations based on the set of posterior parameters for model parameters\
    \ indexed by sample (1 to NSIM) and (1 to N). This program assumes that these\
    \ data sets have been created and are available in the WORK library. Note that\
    \ it is essential that the predicted data be generated based on the set of posterior\
    \ parameters in the SAS data set `OUTPOST_SAMPLE_LSAT`. This is required for Program\
    \ 8.8 to select the posterior parameters and compute the predicted item responses\
    \ to ensure their consistency.\n\nThe parameter estimates and 0 estimates are\
    \ saved in two separate data sets: ITEMPARANS and THETA $\\Theta$. Next, 10 equal-sized\
    \ groups are created for each sample using PROC RANK with the BY option, and these\
    \ groups are saved in the data set THETRAP. The mean for each group is obtained\
    \ using PROC UNIVARIATE with results (mean and number of people in each group)\
    \ saved in the data set MEANOUT. This data is restructured into a data set MEANS,\
    \ which has, for each NSIM simulated data sets (500), mean values for each group\
    \ (MEAN_G1–MEAN_G10) and sample size counts (NSUBG1–NSUBG10) for each group."
