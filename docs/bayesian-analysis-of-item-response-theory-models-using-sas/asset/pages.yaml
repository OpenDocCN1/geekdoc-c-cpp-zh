    # Program 4.5: PROC MCMC Commands for the 3P Logistic IRT Model


    ```

    proc mcmc data=lsat_bays seed=23 nmc=5000 nmc=20000

    threads=8 monitor=a b diagnostics=all plots=(trace autocorr);


    array a[5]; array d[5]; array c[5]; array p[5];


    pams a1 1 d1 0 c1:.20;

    pams a2 1 d2 0 c2:.20;

    pams a3 1 d3 0 c3:.20;

    pams a4 1 d4 0 c4:.20;

    pams a5 1 d5 0 c5:.20;


    prior a ~ lognormal(0, var=. lower=, upper = 3);

    prior d ~ normal(0, var=25, lower = -6, upper = 6);

    prior c ~ beta(5,20);


    random theta ~ normal(0, var=1) subject=obs_;

    do k=1 to 5;

    p[k] = c[k]+(1-c[k])*logistic(a[k]*theta - d[k]);

    b[k] = d[k]/a[k];

    end;

    model x1 ~ binary(p1);

    model x2 ~ binary(p2);

    model x3 ~ binary(p3);

    model x4 ~ binary(p4);

    model x5 ~ binary(p5);


    run;

    ```'
