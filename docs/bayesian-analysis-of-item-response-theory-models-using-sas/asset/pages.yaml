  md: "# Chapter 5: Bayesian Estimation of Unidimensional IRT Models for Polytomously\
    \ Scored Items 129\n\n# Specification of the Likelihood Model with the Table Function\n\
    \nBeginning with SAS/STAT 12, the likelihood model for items with more than two\
    \ response categories can be specified using the TABLE function. The TABLE function\
    \ supports the specification of a categorical distribution with an array of probabilities\
    \ for the discrete values. As an example, the code for using this with a 5-category\
    \ item (Item 1 from the DASH data set) is presented below.\n\n```\narray p_star[4];\n\
    array p[5];\nd k=1 to 4;\n  p_star[k]=logistic(a[j])*theta-d[k,j];\nend;\np[1]=1-p_star[1];\n\
    d k=2 to 4;\n  p[k]=p_star[k-1]-p_star[k];\nend;\np[5]=p_star[4];\nmodel i ~ table(p);\n\
    ```\n\nThe TABLE function requires a vector of probabilities. A two-dimensional\
    \ array of probabilities, indexed by item and response option cannot be specified.\
    \ But what makes the use of the TABLE function cumbersome when IRT models because\
    \ the code must be repeated for each item separately rather than including the\
    \ code within a DO LOOP across the items. You may find it to program the log-likelihood\
    \ function as easily in Program 5.6. However, the macro presented below can be\
    \ used to replicate the code for each of the items in your data set.\n\n```\n\
    array p_star[4];\narray p[5];\n#macro prob_gr;\nd j=1 to 10;\n  k=1 to 4;\n  \
    \  p_star[k]=logistic(a[j])*theta-d[k,j]);\nend;\np[1]=1-p_star[1];\nd k=2 to\
    \ 4;\n  p[k]=p_star[k-1]-p_star[k];\nend;\np[5]=p_star[4];\nmodel i x&j ~ table(p);\n\
    %end\n%mend\nprob_gr;\n```\n\n# Estimation of the One-Parameter Graded Model\n\
    \nFor the GR, one slope parameter and four threshold parameters are estimated\
    \ for each item. Under the assumption that all items have a common slope parameter,\
    \ the GR model reduces to a one-parameter GR with the logistic z_ij = D(a-b_k)\
    \ or z_ij = D(ab-d_kj). Therefore, the one-parameter GR can be treated as a restricted\
    \ case of the GR model. These two models can be compared using Bayesian model\
    \ comparison methods (Chapter 7) to determine which model is preferred in a particular\
    \ testing application.\n\nThe PROC MCMC commands used used to estimate the one-parameter\
    \ GR model are provided in Program 5.6. You can see that the commands are similar\
    \ to those used to estimate a GR model in Program 5.2, except that the slope (a)\
    \ is a single variable reflecting a common slope across all items. Thus, a single\
    \ variable is specified in a PARMS statement for the parameter, PARMS A 1, in\
    \ the prior distribution for the slope parameter, PRIOR A ~ LOGNORMAL(0, VAR-25),\
    \ and in the response probability, P_STAR[KJ]~LOGISTIC(A*THETA-D[KJ]).\n\nNo output\
    \ is provided for this model. It can be estimated and compared with the GR model\
    \ to determine whether slope parameters for each item should be estimated. As\
    \ turns out, for the DASH data set, the point estimate (mean of posterior values)\
    \ for the slope parameter a is 2.63, which is similar to the"
