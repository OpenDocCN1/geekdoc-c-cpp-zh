    The three models (1P, 2P, 3P) that then reflect competing IRT models for the item
    response data. Given competing models, it is important to evaluate or compare
    competing models and choose a preferred method. In describing the item parameter
    estimates for the three models (Table 4.2, Output 4.1, Output 4.4, and Output
    4.13), the more parsimonious 1P model may be preferred. In both MML and Bayesian
    analyses, there is little variability in the ai parameter. Furthermore, there
    is little empirical support for estimating ci, even when the items are multiple-choice
    items. The observed numbers of proportion that are correct for low total scores
    (Table 4.1) are not consistent with the presence of a lower asymptote parameter,
    except in the case of Items 1 and 5, which are very easy items. And, as noted
    by Item, ci parameters should be estimated for very easy items.


    As discussed in Chapter 1, a Bayesian analysis also provides indices or criteria
    for comparing competing models statistically: (1) Deviance Information Criterion
    (DIC; Spiegelhalter, Best, Carlin, & van Linden, 2002), and (2) Indices by Bayes
    factors. Rather than consider these methods for this specific application, the
    comparison of the 1P, 2P, and 3P models with the LSAT data are considered in a
    separate chapter in this book on model comparison (Chapter 7).


