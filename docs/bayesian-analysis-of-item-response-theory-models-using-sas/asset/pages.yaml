  md: '# Chapter 3: Bayesian Estimation of IRT Models Using PROC MCMC 47


    Table 3.1: Commonly Used Univariate Distributions with IRT Models

    | Distribution | Description |

    |---|---|

    | BETA(<A=> a, <B=> b) | Beta distribution with shape parameters a and b |

    | BINARY(<PROB=> p) | Binary (Bernoulli) distribution with probability of success
    p |

    | BINOMIAL(<MEAN=> n, <PROB=> p) | Binomial distribution with count n and probability
    of success p |

    | CHISQUARE(df) | Chi-squared distribution with df degrees of freedom |

    | GAMMA(<SHAPE=> a, SCALE=λ; ISSCALE=λ) | Gamma distribution with shape a and
    a scale or inverse-scale value λ |

    | IGAMMA(<SHAPE=> a, SCALE=λ; ISSCALE=λ) | Inverse-gamma distribution with shape
    a and a scale or inverse-scale value λ |

    | LOGNORMAL(<MEAN=> mu, SD=| |VAR=|) | Log-normal distribution with mean mu and
    a standard deviation, variance, or precision |

    | NORMAL(<MEAN=> mu, SD=| |VAR=| |PREC=>) | Normal (Gaussian) distribution with
    mean mu and a value for standard deviation, variance, or precision |

    | T(<MEAN=> mu, SD=| |VAR=| <V=> df) | t distribution with df degrees of freedom,
    mean mu and a value for standard deviation, variance, or precision |

    | | Categorical distribution with array p of probabilities for discrete categories
    |

    | UNIFORM(<A=> a, <B=> b) | Uniform distribution with range a and b |

    | GENERAL(ll) | User-defined function constructed using SAS programming statements
    for a single or multiple parameters. It is an expression for the log-likelihood
    of the distribution and is interpreted as the log of the joint distribution for
    the parameters.


    Table 3.2: Commonly Used Multivariate Distributions with IRT Models

    | Distribution | Description |

    |---|---|

    | MVN(<MEAN=> mu, <COV=> Σ) | Multivariate normal distribution with mean vector
    mu and covariance Σ |

    | MVNAR(<MEAN=> mu, SD=|VAR=| <RHO=> p) | Multivariate normal distribution with
    mean vector mu and covariance Σ. The covariance matrix Σ is a multiple of the
    scale matrix and a matrix with a first-order autoregressive structure with parameter
    p.


    # Density Plots


    As discussed, prior distributions are in the PRIOR statement for fixed-effect
    model parameters and in the RANDOM statement for random-effect model parameters.
    PROC MCMC can be used to explore and plot probability density functions for different
    distributions. Although no data is required to sample directly from a distribution,
    PROC MCMC requires a DATA statement specification. The first element in the program
    includes the DATA statement data set. The PROC MCMC statement specifies the number
    of samples or iterations. Other statements are used to specify the four parameters
    to be plotted and their initial values (PARMS statement); different distributions
    are specified for each of these parameters (PRIOR statements). The prior specifications
    also illustrate the use of lower and upper boundaries on the densities. Every
    PROC MCMC program must have at least one MODEL statement, because there is no
    response variable, a MODEL GENERAL(<constant>) statement is included to reflect
    a uniform distribution on the real line. Output is presented in Output 3.'
