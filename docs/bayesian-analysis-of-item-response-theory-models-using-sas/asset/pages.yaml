    Introduction

    Item response theory (IRT) is one of several test theories that may be applied
    to assess data to describe how it estimates, inferences, and predictions of a
    particular characteristic, trait, or ability of a person may be from responses
    to test items (Lord & Novick, 1969). Test theories provide models for explaining
    test performance in relation to variables that are presumably to influence response.
    Furthermore, they provide methods for obtaining scores and quantifying error in
    measurement.


    In the past, methods based on classical test theory (CTT) have dominated applications
    of test theories to assessment. CTT is an intuitive model that relates observed
    to true scores plus error. Using results from applications of CTT to assessment
    responses requires estimation of item characteristics (for example, item difficulty),
    observed score reliability, and quantifying error in measurement (standard error
    of measurement or SEM). However, these and other results depend on the group of
    examinations from which they are derived.


    IRT addresses shortcomings of CTT and also solves problems related to test development
    (see, for example, Embretson & Reise, 2000; Hambleton & Swaminathan, 1985). Compared
    to CTT, which models responses at the test level, IRT focuses attention on the
    item level by modeling or predicting'
