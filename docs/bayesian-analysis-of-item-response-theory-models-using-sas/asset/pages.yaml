  md: 'IRT models formulate the relationships between observed item responses and
    latent or unobserved characteristics of items and persons.


    Statistical inference, on the other hand, is used to separate signal from noise
    and decide which model or formalized relationships are relevant (that is, signal).
    For example, is there evidence that two factors explain the relationships between
    the set of observed variables? Or test item responses adequately explained by
    the modeled item characteristic (item difficulty) and one person characteristic
    (ability measured by the items)?


    The three basic goals of statistical inference are estimation, prediction, and
    model selection. With regard to estimation, the parameters of the statistical
    model (for example, item parameters in IRT models or factor loadings in models)
    are estimated, and uncertainty each estimate is quantified. Estimation enables
    us to better understand the nature and importance of the formulated relationships
    relative to the uncertainty in estimating the models. Prediction involves using
    current beliefs about a model and the estimated parameters to predict other values—for
    example, values that were not observed for some subjects in the population or
    for missing data. Based on the estimated model, predictions can also be made for
    future samples from the population. Finally, model comparison and selection involves
    exhibiting a preferred model among competing models, and determining whether a
    particular model reflects “overfitting” (noise is being modeled) or a particular
    model reflects “underfitting” (signal in the data is missed).


    # # Frequent and Bayesian Approaches to Statistical Inference


    The frequentist approach to statistical inference or more classical statistical
    analysis relates observed data to unknown fixed parameters, obtains inferences
    about parameter estimates from data, and probability interpretations for model
    parameters on a hypothetical sequence of random observations or experiments. In
    contrast to this classical paradigm, a Bayesian approach considers model parameters
    to be random variables and is used to obtain distributions of model parameters
    from which direct probability statements about parameters may be made.


    Bayesian analysis begins with an assessment about the uncertainty in a parameter
    (prior distribution) before data is collected. Using Bayes Theorem, distributions
    for the parameters given the data (posterior distribution) may be obtained by
    updating beliefs about how parameters are distributed (prior distribution) with
    the distribution of data given the parameters (likelihood function). Table 2.1
    provides a summary of the comparison between Bayesian and frequentist paradigms.'
