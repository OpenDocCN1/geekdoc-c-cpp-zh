    models, although the use of a Jeffery'' prior does not guarantee a proper posterior.
    However, you can achieve a relatively informative prior by choosing a prior that
    is locally uniform over a region of the parameter space that reflects values for
    a parameter. A Normal prior could be chosen that has a large variance for a parameter
    that ranges from $-3$ to $+3$, as is the case for difficulty parameters in IRT
    models. In this case, a Normal(0,1000), truncated over the range from $-3$ to
    $+3$, could be specified to achieve an essentially locally uniform prior. Rather
    than specify a truncated prior, an alternative may be "weakly" informative using
    prior distributions with large variance terms (Sheng, 2013).


    For discussion prior distributions in the context of IRT models, see Chapter 3.
    For more background on informative and noninformative priors see, for example,
    Gelman et al. (2014), Gelman (2006), Goldstein (2006), Fox, and Kass & Wasserman
    (1996).


    # Model Comparisons


    In applications, different models may be estimated that reflect competing formalizations
    of the relationships under study, or reflect competing theoretical perspectives.
    Furthermore, a researcher using IRT to model item responses is interested in a
    parsimonious model—that is, a model with fewer parameters that adequately reflects
    the data. Consequently, you must choose among competing models to arrive at a
    preferred model, and comparison procedures may be used for this purpose.


    Model comparison methods also help you determine whether a particular model reflects
    "underfitting" or a particular class model in a Bayesian paradigm fall within
    two classes: (1) Bayesian information-based criteria—the Deviance Information
    Criterion (Spielhalter, Berlin, & van Linde, 2002), and (2) indices based on Bayes
    priors. These classes of indices are indeed only be used to assess the relative
    fit between competing models and do not address the absolute fit of any particular
    model or the degree to which any one particular model approximates the data. Nonetheless,
    methods have been found useful for comparing IRT models in testing applications
    (for example, Zhu & Stone, 2012).


    Absolute fit in a Bayesian framework is generally assessed by measures of predictive
    model checks (PPMC). For this approach, a model fits the data if it produces good
    predictions. Of course this method could also be used to compare different models
    by taking a predictive approach to model comparisons and selecting the model that
    provides the better predictions. PPMC analysis is described briefly and considered
    in more detail in Chapter 8.


    # Deviance Information Criterion


    The Deviance Information Criterion (DIC; Spielhalter et al., 2002) is a model
    comparison tool similar to the well-known likelihood-based information criterion:
    Akaike Information Criterion (AIC; Akaike, 1974) and the Bayesian Information
    Criterion (BIC; Schwarz, 1978). DIC can be applied to nested or non-nested models,
    as well as models that have independent not identically distributed variables.'
