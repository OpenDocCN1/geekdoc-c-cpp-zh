- img_proc: true
  md: "model under the assumption that all items have equal slopes. Similar to the\
    \ RS-GR model, some parameterizations of the GPC model decompose the $\\delta_{jk}$\
    \ to a location parameter $(b_j)$ for each item and a set of category parameters\
    \ $(\tau_{jk})$. Using this parameterization, the logistic deviate $z_{jk} = Da_j(\\\
    theta - b_j + \\tau_{jk})$. To identify and estimate the parameters of the GPC\
    \ model, the threshold parameter of the last category for each item is set to\
    \ the negative of the sum of the category threshold parameters for the previous\
    \ categories, that is,\n\n```\n$$\\tau_{mj} = -\\sum_{k=1}^{j-1} \\tau_{jk}$$\n\
    ```\n\nThis constraints the set of category thresholds parameters to 0 for each\
    \ item.\n\n# Estimating the GPC Model\n\nProgram 5.10 includes the MCMC code for\
    \ estimating the GPC model, where $z_{jk} = Da_j(\\theta - b_j + \\tau_{jk})$,\
    \ using the DASH data. For each DASH item, one slope parameter $(a_j)$, one location\
    \ parameter $(b_j)$, and four category threshold parameters $(\\tau_{j1}, \\tau_{j2},\
    \ \\tau_{j3}, \\tau_{j4})$ are defined corresponding to four steps $(1\\to2, 2\\\
    to3, 3\\to4, 4\\to5)$.\n\nIn the code, the TAU[4,10] matrix represents the 40\
    \ threshold parameters (4 categories for each item), and the Z[5] array denotes\
    \ the five logistic deviate z for each item, $z_{jk} = Da_j(\\theta - b_j + \\\
    tau_{jk})$ with $D=0-1$. SUM[Z] is an array reflecting the sum of the logistic\
    \ deviates for response categories That is, the values $\\sum_{k=x} z_{jk}$ for\
    \ $x=1, 2, 3, 4, 5$. NUMER[K] is an array that reflects the numerator for response\
    \ categories in the GPC model, and P[5] is an array of response probabilities\
    \ for five score categories.\n\nAs for other models, the item parameters within\
    \ each item are treated as a single block. Note that for the model identification,\
    \ only the category threshold parameters for the first three steps are declared\
    \ as. The last threshold parameter within each item equals the negative sum of\
    \ the first three steps, and is computed in a BEGINDATA--ENDDATA block ①. The\
    \ priors for the slope parameters $(a_j)$ are log-normal distributions, and the\
    \ priors for both location and thresholds parameters are normal distributions.\
    \ To calculate the likelihood of the data, the Z values are calculated first ②\
    \ followed by the SUM. Z values. Then the numerator ③ and denominator ④ of the\
    \ GPC model are computed and used to obtain the response probabilities ℄."
