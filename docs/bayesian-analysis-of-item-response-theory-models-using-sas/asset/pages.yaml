  md: '# 6 Bayesian Analysis of Item Response Models Using SAS


    # Model Re-parameterizing


    Finally, another strategy for addressing poor mixing is to re-parameterize the
    model and reduce dependence among the parameters. For example, the probability
    in the 1P program (Program 3.2) can be expressed as an intercept model with P[j]
    = LOGISTIC(A*THETA-D[j]), where D[j] is an intercept term and a function of a
    and $b_j = d/a$. In the computation, B[j] = D[j]/a, a can be included in the LOOP
    of (A B D) and the $b_j$ parameters monitored by including a MONITOR-(A B D) in
    the PROC MCMC sampler. The example would be presented in Program 3.3.


    # Program 3.3: Re-parameterization of the 1P IRT Model


    ```

    proc mcmc seed=23 nseed=20000

    monitor=(a b d) diagnostics=all plots=(trace autocorr);

    array b(5);

    array d(5);

    array p(5);

    parms a 1;

    parms d 0;

    prior d ~ normal(0, var=4);

    prior a ~ lognormal(0, var=.25);

    random theta ~ normal(0, var=1) subject=obs_j;

    j=1 to 5;

    p[j] = logistic(a*theta-d[j]);

    b[j] = d[j]/a;

    ;

    model x1 = binary(p1);

    model x2 = binary(p2);

    model x3 = binary(p3);

    model x4 = binary(p4);

    model x5 = binary(p5);

    run;

    ```


    Selected results from this re-parameterization of the IRT are presented in Outputs
    3.13 through 3.15. Output 3.13 presents a matrix of scatterplots that reflects
    the correlations among the item parameters and illustrates the impact of the transformation
    on the level of dependence among the parameters. In the output, two blocked areas
    in the upper triangle of the matrix (red shape) describes the relationships between
    the original $a$ and $b_j$ parameters, whereas the lower block (blue shape) portrays
    the relationships between the $d_j$ parameters and the original parameters (a,
    h). You can see from the upper block that there are significant relationships
    among the $a$ and $b_j$ parameters—indicated by more linear patterns in the scatterplots.
    When compared with the lower block most of the relationships appear very low except
    for one ($d_j, a$). Thus, re-parameterization does not remove the original dependence
    among the $a$ and $b_j$ parameters, it remove dependence among the parameters
    in the re-parameterized model.


    Posterior summary statistics are presented in Output 3.14, and diagnostic plots
    for the $a$ and $b_j$ parameters are presented in Output 3.15. As we can see,
    this parameterization essentially produces the same posterior summary results
    but improves mixing and reduces autocorrelation by substantially the dependence
    among the sampled $a$ and $b_j$ parameters across iterations.


    Note that the $d_j$ parameters can be excluded from the MONITOR command because
    they lack the interpretability of the $b_j$ parameters. Finally, as discussed
    agreed, differences in the autocorrelation results across all the different strategies,
    essentially no impact was observed on the posterior summary statistics for parameters.'
  merge: -1
