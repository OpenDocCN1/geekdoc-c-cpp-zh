    \        }\n    }\n}\n```\n\n# Deadlocks\n\nA deadlock is a condition that happens\
    \ when two threads attempt to access a resource that is held by the other thread.\
    \ As an example, let there be two threads, threadA and threadB, executing at the\
    \ same point of time. Assume that the threads have acquired locks on resources\
    \ resourceA and resourceB in the way shown in the code example given below."
