  md: '# Common Language Runtime


    The Common Language Runtime (CLR) is a runtime engine that is responsible for
    executing your programs, code verification, type safety, memory allocation, garbage
    collection, security, and many more. It provides several services, which includes:


    +   - Just-in-time compilation

    - Garbage collection

    - Code access security

    - Memory management

    - Code verification


    Figure 1.2 depicts the components of .NET Framework.


    ![](img/13229b4b9ff377325da8c3d3e8c64024_23_0.png)


    Figure 1.2: Components of .NET Framework'
