  md: '# Common Intermediate Language


    The Common Intermediate Language (CIL), formerly known as Microsoft Intermediate
    Language (MSIL), is a platform-independent language into which source code is
    compiled in the .NET environment is written. It is a set of instructions that
    are platform independent and is generated by the compiler from the source code.
    At runtime, the CIL is converted into a machine code by the Just-in-Time (JIT)
    compiler. In other words, the JIT compiler converts the CIL into a machine code
    specific to the target environment, that is, the environment in which the application
    needs to execute. Figure 1.3 shows how this entire process works:


    ![](img/13229b4b9ff377325da8c3d3e8c64024_24_0.png)


    Figure 1.3


    # Dynamic Language Runtime


    While the CLR provides services such as, a common type system, JIT, garbage collection,
    and many more, the Dynamic Language Runtime (DLR) runs on top of the CLR and offers
    services for dynamic languages. These include: dynamic types, dynamic method dispatch,
    code generation, and more.'
