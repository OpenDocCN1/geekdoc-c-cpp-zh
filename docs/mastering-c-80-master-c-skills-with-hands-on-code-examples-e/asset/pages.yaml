  md: '# Delegates, Funcs and Actions in C# 155


    instance. Delegates in C# are like function pointers in C or C++ with the exception
    that delegates are type-safe, function pointers are not.


    Delegates are used in event handling programs to define callback methods. A callback
    function is one that is executed once the execution of a task is complete. To
    create a callback function in C#, you need to take advantage of delegates or lambda
    functions or action.


    A delegate type is declared using the delegate keyword. The syntax for declaring
    a delegate in C# is as follows:


    ```

    `[modifier] delegate [return_type] [delegate_name] ([parameter_list]);`

    ```


    Here''s the explanation of the delegate syntax:


    +   - modifier: This is optional and used to define the access level of the delegate.

    - delegate: This keyword is used to declare the delegate.

    - return_type: This implies the return type of the methods the delegate be pointing
    to.

    - delegate_name: This is the name of the delegate.

    - parameter_list: This is used to specify the parameters that the method(s) pointed
    to by the delegate would accept.


    The statement given below illustrates how you can declare a delegate in C#:

    public delegate void MyFirstDelegate(string someText);


    In the above statement, public is the modifier, void is the return type, the delegate
    name is MyFirstDelegate, and someText is the parameter.


    The same statement would declare a delegate named MyFirstDelegate that can be
    used to point to a method that accepts a string as an argument:


    Once you have declared a delegate, you can instantiate it when needed. The statement
    given below shows how you can instantiate the delegate we just declared.


    ```

    MyFirstDelegate delegateObj = new MyFirstDelegate(SomeMethod);

    ```


    Now that the delegate object has been created, you can use the following code
    to invoke the delegate method named SomeMethod:


    ```

    delegateObj("This is my first delegate");

    ```


    You can also call SomeMethod using the Invoke method on the delegate instance
    shown in the following code snippet:


    ```

    delegateObj.Invoke("This is my first delegate");

    ```'
