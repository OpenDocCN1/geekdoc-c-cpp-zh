    # Garbage collection


    Garbage collection (GC) is a feature provided by .NET CLR to manage memory automatically.
    It cleans up the unused objects, that is, objects that are no longer in use. The
    term garbage here implies an object that is no longer needed, that is, it''s now
    a waste.'
