    # Task.Run and Task.Factory.StartNew


    You can create a task using either of the two methods, that is, Task.Run and Task.Factory.StartNew.
    Although Task.Factory.StartNew has a lot of options, Task.Run is a quicker alternative
    of Task.Factory.StartNew.


    The Task.Run method is the recommended way to create compute-bound tasks in .NET.
    You should use Task.Factory.StartNew only when you need more fine-grained control
    for a long-running task. You can use Task.Factory.StartNew if you would like to
    create a custom TaskScheduler or custom TaskCreationOptions. Note that a task
    scheduler is a component that is responsible for scheduling tasks.


    The following code snippet illustrates how you can use Task.Factory.StartNew to
    create a task:


    ```

    Task.Factory.StartNew(action, CancellationToken.None, TaskCreationOptions.DenyChildAttach,
    TaskScheduler.Default);

    ```


    When using the Task.Run, same thing can also be done with the following code:

    Task.Run(action);


    # Task.WaitAll and Task.WhenAll methods


    The Task.WaitAll method blocks the currently executing thread until all tasks
    have completed. The Task.WhenAll method returns a task instance that will be complete
    only when the other tasks have completed their execution. Unlike Task.WaitAll
    method, Task.WaitAll doesn''t block the currently executing thread.


    The syntax of Task.WhenAll method is as follows:


    ```

    Task.WhenAll(taskList).ContinueWith(t => {


    // Some code


    });

    ```


