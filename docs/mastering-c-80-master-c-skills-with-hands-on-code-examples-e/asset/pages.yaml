    There are three types of multithreading. These include:


    +   - Serial: This is supported by the DOS OS.

    - Co-operative: This is supported by Windows 3.11.

    - Preemptive: This is supported by Windows 9x, NT, XP, and many more.


    # Benefits and drawbacks of multithreading


    Multithreading can provide enhanced throughput in an application—you can take
    advantage of multithreading to execute multiple tasks simultaneously. Multithreading
    improves the responsiveness of an application as well. Multithreading is complicated
    and is all resource-intensive. Context switching between threads is an expensive
    operation.


