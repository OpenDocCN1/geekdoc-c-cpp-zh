  md: '# Multithreading in C# 223


    To work with thread pooling in .NET, you should leverage the ThreadPool classes
    available as part of the System.Threading namespace. You can create a thread pool
    in a number of ways. These include the following:


    +   - Using the task parallel library

    - Using a BackgroundWorker

    - Using the ThreadPool.QueueUserWorkItem

    - Using asynchronous delegates


    The code snippet given below shows how you can set the minimum number of threads
    in the ThreadPool:


    ```

    ThreadPool.MinThreads(25, 25);

    ```


    While the first parameter to the SetMinThreads is the minimum number of worker
    threads, the second parameter is used to set the minimum number of IO completion
    threads. You can also set the maximum number of threads in the thread pool using
    the ThreadPool.SetMax method.


    You can retrieve the number of available worker threads and available async threads
    using the GetMinThreads static method of the ThreadPool class as shown in the
    code snippet below:


    ```

    int availableWorkerThreads = 0;

    int availableAsyncThreads = 0;

    ```


    ```

    ThreadPool.GetMinThreads(out availableWorkerThreads, availableAsyncThreads);

    ```


    # Thread synchronization


    Thread synchronization is a concept that ensures that only one thread can access
    a shared resource at a given point of time. No other thread can access the resource
    till the time the thread relinquishes control of the shared resource.


    Synchronization constructs belong to one of the following categories:


    +   - Locking constructs like Mutex, lock, SpinLock

    - Blocking methods like Sleep, Join, and many more

    - Signaling constructs like Wait and Pulse methods of the Monitor class

    - Non-blocking synchronization constructs like Thread.Memorybarrier, Thread.VolatileRead,
    Thread.VolatileWrite and the Interlocked class


    In the example on the ThreadSafe class given below in this section, we will implement
    synchronization using the lock keyword and also by a Mutex. A Mutex is similar
    to lock but it can work across multiple processes. We''ll now examine'
