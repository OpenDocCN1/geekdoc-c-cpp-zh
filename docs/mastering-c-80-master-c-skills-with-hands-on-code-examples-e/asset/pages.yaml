    of the classes that extend the super class.


    As an example, consider the relationship between a Person and a Student and a
    Person and a Teacher. A Teacher is also a Person. Hence, exists a generalization
    relationship between a Person and a Student and a Person and a Teacher. Generalization
    is often known as inheritance. However, they are not the same. Generalization
    is defined as the process by of which the shared characteristics (attributes,
    associations, or methods) of two or more classes are combined into a generalized
    class. On the contrary, inheritance is the process of extending one or more classes
    to create a child class. We''ll learn more about inheritance later in this chapter.


    Specialization is the reverse of generalization. It is the process of creating
    subclasses from an existing class. Generalization relationship exists for the
    following types:


    +   * Undifferentiated classes

    * Implementation classes

    * Interfaces


    We will learn more about this in the section Inheritance later in this chapter.
    The UML notation for generalization is shown in the Figure 4.5.


