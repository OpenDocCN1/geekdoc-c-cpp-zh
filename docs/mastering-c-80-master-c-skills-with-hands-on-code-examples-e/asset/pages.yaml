    # Process, threads, and tasks


    A process may be defined as the running instance of a program. In other words,
    a process is defined as a program in execution. A thread is defined as the path
    of execution within a process. A task is a higher level of abstraction and is
    executed by a task scheduler. In essence, a thread denotes the smallest sequence
    of instructions that can be managed by the scheduler. A thread takes advantage
    of the thread pool by default and is a convenient way to execute some code asynchronously.


    A thread represents an OS-level thread having its own stack and kernel resources.
    Note that threads are not a .NET construct. Rather, they are created and managed
    by the operating system. The Thread class in .NET provides a way to create and
    manage threads using the host operating system.


    # Multithreading


    At any given point of time, a CPU can execute only one thread. Multithreading
    refers to the ability of the operating systems to have at the same point of time
    multiple threads in the memory and switch these threads in the memory as and when
    needed. So, if there are $n$ threads in the system, $1$ of them is in the running
    state and the remaining $n-1$ threads are in other states. This switching between
    the threads (also known as context switching) in the memory happens so fast that
    you''ll observe a pseudo parallelism, that is, it seems as if all the threads
    are running concurrently.'
