    \ : IDisposable\n{\n    public void Dispose()\n    {\n}\n}\n```\n\nWhen you'll\
    \ compile the above program, you would observe a compilation error, Error CS8343\
    \ 'Author': ref structs cannot implement interfaces, as shown in Figure 14.4.\n\
    \n![](img/13229b4b9ff377325da8c3d3e8c64024_307_0.png)\n\nFrom C# 8.0 onwards,\
    \ ref struct can be disposed without the need of implementing the IDisposable\
    \ interface. All you need to add is a Dispose method to the ref struct. This would\
    \ ensure that an instance of the struct is consumed by using statements as shown\
    \ in the code mentioned in Figure 14.5."
