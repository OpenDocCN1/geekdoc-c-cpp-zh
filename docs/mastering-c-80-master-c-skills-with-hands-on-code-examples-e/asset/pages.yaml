  md: "# # MASTERING C# 8.0\n\nDESCRIPTION\n book starts by introducing the concepts\
    \ of .NET framework. It then discusses OOP and explores how one can work with\
    \ OOP in C#. There are two chapters on OOP: the first one covers the basics of\
    \ object-oriented programming (OOP); and the second one delineates advanced concepts\
