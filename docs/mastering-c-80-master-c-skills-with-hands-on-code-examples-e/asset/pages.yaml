    \ Id;\n  }\n  public Order With With(int Id = 1) => new Order(Id);\n}\n```\n\n\
    # Disposable ref structs\n\nDisposable ref struct is another interesting new feature\
    \ in C# 8.0. Note that ref struct were first introduced in C# 7.2. Consider the\
    \ following program where we have a ref struct implementing the IDisposable interface:\n\
    \n```\nclass Program\n{\n  static void Main(string[] args)\n{\n```"
