  md: "# # CHAPTER 9\nException Handling in C#\n\nExceptions are run-time errors that\
    \ occur when the application is in execution. If exceptions are not handled properly\
    \ in your code, the application will terminate abruptly. This chapter presents\
    \ a discussion on exceptions, how to work with exception handling in C# and the\
    \ best practices that should be followed to make the best use of exceptions.\n\
    \n# ## Structure\n\nIn this chapter, we will discuss the following points:\n\n\
    +   * Exception handling concepts\n* Exception blocks\n  * Programming using exceptions\n\
    \  * Throwing exceptions\n* Implementing a custom exception class\n  * Throwing\
    \ and catching custom exception classes\n* Best practices\n\nWe will start this\
    \ chapter with an understanding of exceptions. In the subsequent sections, we\
    \ will dive deep into the related concepts and write programs to illustrate the\
    \ concepts covered."
