  md: "# 44 Mastering C# 8.0\n\nHere's how the syntax of a constructor looks:\n\n\
    ```\n[modifier] name (parameters)\n{\n    // constructor code\n}\n```\n\nA constructor\
    \ can have one of the following modifiers:\n\n+   * public\n* protected\n* internal\n\
    * private\n* extern\n\nWe will learn more about each of these modifiers later\
    \ in this chapter.\n\nA constructor can be of two types: static and non-static.\
    \ Static constructors are also known as class constructors and are called when\
    \ a static member of the class is accessed for the first time. Non-static constructors\
    \ are also called instance constructors and are called each time the class is\
    \ instantiated. Static constructors are invoked before instance constructors.\
    \ Let's understand all of this with an example in each case.\n\n# Instance constructors\
    \ or non-static constructors\n\nNon-static or instance constructors of a class\
    \ are used to initialize the non-static members of the class. Such constructors\
    \ are also known as type constructors or type initializers. Note that there can\
    \ be multiple instance constructors in a class—differing in the signature. This\
    \ feature is known as constructor overloading. We will learn more about constructor\
    \ overloading later in this chapter. The default constructor of a class is also\
    \ an instance constructor.\n\n# Default constructor\n\nAny class should have a\
    \ minimum of one constructor. If you don't define a constructor for a class, C#\
    \ automatically provides one. This constructor is known as the default constructor.\
    \ A default constructor of a class doesn't accept parameters. There can be one\
    \ and only one default constructor in a class. A default constructor of a class\
    \ is invoked when an instance of the class is created using the new operator and\
    \ no arguments are passed to it. Here is an example that illustrates how a default\
    \ constructor can be used:"
