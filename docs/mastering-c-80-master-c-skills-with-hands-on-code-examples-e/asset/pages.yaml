  md: '# Asynchrony and Parallel Programming in C#


    asynchronous to improve scalability. However, you should be aware of the best
    practices using asynchronous programming.


    # Avoid using async void methods


    Asynchronous methods can return Task, Task<T>, and void. You should not use async
    void methods except when writing async event handlers. The semantics of async
    void methods are not the same as asyncTask or asyncTask<T> methods. Exception
    handling works differently in async void and async Task or async Task<T> methods.
    When an exception is thrown in an async void method, it will be raised directly
    on the currently active SynchronizationContext. On the contrary, when an exception
    is thrown in an async Task or async Task<T> method, its details are captured and
    stored in the Task object.


    # Avoid mixing synchronous and asynchronous code


    When writing programs that leverage asynchrony, async code contains a mix of both
    synchronous and asynchronous code. If you are using async code, you should use
    it throughout, that is, right from the topmost layer to the bottom—it should be
    async all the way.


    Since there is a likelihood of making a few common mistakes while writing async
    code, one should:


    +   * Avoid having void return type in async methods.

    * Avoid blocking on tasks using .Result or .Wait(). This means blocking on async
    code.

    * Avoid creating async wrappers for sync methods.


    Note that if you mark a method as async and you don''t have an await keyword used
    inside the method the entire method will be executed synchronously.


    # Conclusion


    Asynchrony and parallel programming are two of the most important features in
    .NET. In this chapter, we have learned the concepts of parallel and asynchronous
    programming and how to write programs that leverage these concepts in C#. In the
    next chapter, we''ll examine how we can work with threads in C#.


    # Questions


    +   1. What is the difference between a thread and a task?

    2. What is the difference between asynchrony and parallelism?

    3. What are the types of parallel programming?'
