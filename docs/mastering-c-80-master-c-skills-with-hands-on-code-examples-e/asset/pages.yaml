    # Operators


    An operator is an element that is applied to one or more operands as part of an
    expression. Operators in C# can be of the following types:


    +   - Arithmetic operators

    - Relational operators

    - Logical operators

    - Bitwise operators

    - Assignment operators

    - Misc operators (that is, sizeof, typeof, is, as, and ?: operators)


    Based on the number of operands in an expression, operators in C# can be of the
    following typesas well:


    +   - Unary: These operators take one operand.

    - Binary: These operators take two operands.

    - Ternary: These operators take three operands.


    There are two more types of operators: comparison and assignment. The C# programming
    language also enables you to define the behavior of certain operators. This feature
    is known as operator overloading. Not that all operators can be overloaded. Operator
    overloading is an example of static or compile time polymorphism, and is supported
    by languages like C++, C# and Java.


