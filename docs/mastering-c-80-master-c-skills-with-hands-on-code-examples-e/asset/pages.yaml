    \ used console application projects throughout this book.\n\n# Writing a Hello\
    \ World application in Visual Studio 2019\n\nIn this section we will examine how\
    \ we can build a Hello World application in Visual Studio 2019. When you create\
    \ a new Console Application project, a file called Program.cs will be created\
    \ in the project by default. You will be presented with the Program class inside\
    \ the Program.cs file. There would be an empty Main method as well. The Main method\
    \ is the entry point for all console applications. Next, replace the Main method\
    \ with the following code:\n\n```\nstatic void Main(string[] args)\n{\n    Console.WriteLine(\"\
    Hello World!\");\n}\n```"
