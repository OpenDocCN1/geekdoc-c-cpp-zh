  md: "# Implementing a generic collection class\n\nIn this section, we will implement\
    \ a custom collection class class using generics. We'll implement a custom type\
    \ safe stack class which can store and retrieve elements to and from the generic\
    \ stack.\n\nThe code listed below shows an implementation of a generic stack.\
    \ The stack can contain a maximum of 10 elements. If you would like it to store\
    \ more elements, you would need to change the value of the size integer variable:\n\
    \n```\npublic class GenericStack<GS>\n{\n    const int size = 10;\n    private\
    \ readonly GS[] dataRegister = new GS[size];\n    private int counter = 0;\n \
    \   public void Push(GS x)\n    {\n        if (counter < size)\n            dataRegister[counter++]\
    \ = x;\n    }\n    public GS Pop()\n    {\n        return dataRegister[--counter];\n\
    \    }\n}\n```\n\nWhile the Push method of the generic stack pushes an integer\
    \ to the stack, the Pop method removes an element from the top of the stack.\n\
    \nThe code snippet given below shows how you can create a stack of integers, store\
    \ data into the stack and then retrieve them:\n\n```\nstatic void Main(string[]\
    \ args)\n{\n    GenericStack<int> integerStack = new GenericStack<int>();\n  \
    \  integerStack.Push(10);\n    Console.WriteLine(integerStack.Pop());\n```"
