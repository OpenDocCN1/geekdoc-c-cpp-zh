    \ how you can instantiate the delegate, make it a multicast delegate, and then\
    \ invoke the methods that the delegate points to:\nmyDelegateObj = new MyDelegate(MethodA);\n\
    myDelegateObj += MethodB;\nmyDelegateObj.Invoke(\"This is a multicast delegate\"\
    );\n\nRefer to the preceding code snippet. Note how the += operator has been used\
    \ to create a multicast by assigning methods that have an identical signature\
    \ to the delegate object. Note that you can use - or -= operator to remove methods\
