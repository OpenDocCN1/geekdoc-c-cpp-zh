  md: '# Abstraction


    Abstraction has been defined by Richard Gabriel as the process of identifying
    common patterns that have systematic variations; an abstraction represents the
    common pattern and provides a means for specifying which variation to use. Abstraction
    is the process of hiding the non-essential details of an object, abstraction is
    the mechanism that is used to show only the relevant details of an object to the
    user. Encapsulation is used to bind the members of a class (that is, the data
    and methods) inside a single unit to disallow access to the members directly from
    outside the unit. Note that abstraction in Object-Oriented Analysis and Design
    (OOAD) has nothing to do with abstract classes in C#.


    An example of abstraction is how brakes of a car work. You can press the pedals
    to make it work but you are not aware of how it works internally.


    Abstraction and encapsulation are two complementary concepts in OOP''s. While
    the former focuses on the observable behavior of an object, encapsulation facilitates
    information hiding so as to conceal the secrets of the object from the external
    world. To be more precise, on the one hand, abstraction is used to show only the
    relevant details and hide the unnecessary details of an object from the user.
    Encapsulation, on the other hand, is used to combine the data and functions of
    an object inside a single unit, resulting in an isolation of the contents of the
    unit from the external world.


    # Inheritance


    Inheritance is the ability to create a subclass from an existing class by extending
    it. The subclass is known as the derived class or the child class and the class
    from which the subclass is created, also known as the base class or the parent
    class. The child class reuses, extends, or modifies the behavior of the parent
    class. Inheritance can be of several types. These include:


    +   * Single inheritance

    * Multi-level inheritance

    * Multiple inheritance

    * Hierarchical inheritance

    * Hybrid inheritance


    C# supports only single and multi-level inheritance.'
