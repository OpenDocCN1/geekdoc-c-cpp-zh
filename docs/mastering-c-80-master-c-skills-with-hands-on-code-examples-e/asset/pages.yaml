    Figure 1.4: The Dynamic Language Runtime (DLR)


    The DLR was first introduced in .NET 4.0, and since then it has been a part of
    .NET Framework. The addition of a powerful feature, dynamic keyword, in .NET 4.0
    enhanced the capabilities of C# programming language. Essentially, the dynamic
    keyword is used to skip the compile-time type checking. When you have a method
    with a dynamic parameter, the method can accept any type at runtime. We''ll learn
    more about the dynamic keyword later in this book.


    # Framework Class Library


    The .NET Framework Class Library (FCL) is a comprehensive collection of reusable
    classes, interfaces, and data types that provide several services. Note that the
    FCL provides the base on top of which applications and components written in .NET
    are built.


    The services provided by the FCL include the following:


    +   * File handling

    * Exceptions

    * Removing

    * Sockets

    * Database access'
