  md: '# Attributes


    Attributes are a feature in C# language used to embed metadata in the assemblies.
    Essentially, an attribute is an object, which is used to add declarative information.
    This information can be read at runtime if needed. An attribute can be applied
    to any of the following:


    +   * Assembly

    * Class

    * Method

    * Delegate

    * Enum

    * Event

    * Field

    * Interface

    * Property

    * Struct


    # Pre-defined attributes


    There are three pre-defined attributes in .NET. They are as follows:


    +   * AttributeUsage

    * Conditional

    * Obsolete


    # AttributeUsage


    The pre-defined attribute AttributeUsage is used to specify how a custom attribute
    can be used. The following code snippet illustrates how the AttributeUsage can
    be used:


    ```

    [System.AttributeUsage(System.AttributeTargets.All,

    AllowMultiple = false,

    Inherited = true)]nclass CustomAttribute : System.Attribute { }

    ```


