  md: '# CHAPTER 15

    Getting Started with Visual Studio 2019


    This is the concluding chapter of this book. In this chapter, we''ll examine how
    we can work with Visual Studio 2019 to create projects in C#.


    # Structure


    In this chapter, we will discuss the following points:


    +   * The different editions of Visual Studio

    * Installing Visual Studio 2019

    * Creating a console application project in Visual Studio 2019


    # Different editions of Visual Studio 2019


    As of this writing, Microsoft has just released Visual Studio 2019. Note that
    Visual Studio 2019 is available in three editions. These include:


    +   * Community: This edition is available for free and can be used by students,
    professionals, and open-source community contributors.

    * Professional: This edition is meant for individual developers and teams of small
    sizes.

    * Enterprise: This edition can be used by small or big teams, provided they have
    a Visual Studio Enterprise subscription.'
  merge: -1
  pgno: 310
- img_proc: true
  md: '292 Mastering C# 8.0


    # # Installing Visual Studio 2019


    If you don''t have a copy of Visual Studio 2019 installed on your system, you
    can download it from https://visualstudio.microsoft.com/downloads/. See Figure
    1.


    ![](img/13229b4b9ff377325da8c3d3e8c64024_311_0.png)


    Figure 1: Downloads page for Visual Studio 2019


    Once Visual Studio 2019 has been downloaded successfully, you can launch the installer
    to install Visual Studio 2019 on your system. After the installer is loaded, you''ll
    be presented with a screen to choose what components should be installed. As shown
    in Figure 2, you will also get an option to install the language packs and specify
    the installation location.


    ![](img/13229b4b9ff377325da8c3d3e8c64024_311_1.png)


    Figure 2: Selecting the components to be installed'
  merge: -1
  pgno: 311
- img_proc: true
  md: 'You can also update the Visual Studio 2019 installation if you need to. To
    update the Visual Studio 2019 installation, launch the installer again and click
    on the Update button in the Visual Studio Enterprise 2019 panel. Once you click
    on the Update button, the download and install will start and the text of the
    Update button will change to Pause as shown in Figure 3.


    ![](img/13229b4b9ff377325da8c3d3e8c64024_312_0.png)


    Figure 3: Updating the Visual Studio 2019 installation


    Note that if there are any pending updates available, they will be downloaded
    and installed as well.


    # Starting Visual Studio 2019


    When you have launched the Visual Studio 2019successfully, here''s how the initial
    screen would look like:


    ![](img/13229b4b9ff377325da8c3d3e8c64024_312_1.png)


    Figure 4: Launching Visual Studio 2019'
  merge: -1
  pgno: 312
- img_proc: true
  md: 'Once the initial screen has been loaded, you''ll be presented with a screen
    to select and create a new project or clone an existing one. Nonetheless, you''ll
    also get an option to open the recent projects. The projects that were created
    earlier by you will appear in the left side panel. In Figure 5, since there aren''t
    any projects created so far, the left side panel is empty.


    # Visual Studio 2019


    ![](img/13229b4b9ff377325da8c3d3e8c64024_313_0.png)


    Figure 5: Getting started with Visual Studio 2019


    If you would like to launch the Visual Studio IDE directly, you can click on **Continue
    without code**. The Visual Studio 2019 IDE will be launched as shown in Figure
    6.


    ![](img/13229b4b9ff377325da8c3d3e8c64024_313_1.png)


    Figure 6: The Visual Studio 2019 IDE'
