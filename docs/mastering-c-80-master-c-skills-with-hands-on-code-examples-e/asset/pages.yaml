  md: '# Composition


    Composition is a special type of aggregation in which an object contains another
    object and the contained object cannot exist if the container object has been
    deleted. So, if there are two objects in a composition relationship, there is
    a strong lifecycle dependency between them. While aggregation represents a *has-a*
    relationship, composition represents a *part-of* relationship is used to show
    that a class is a part of another class.


    The *has-a* relationship is used to show that an instance of one class contains
    a reference to an instance of another class or the same class. A good example
    of *has-a* relationship is the relation between library and students. A student
    can exist without a library and hence this is an example of an aggregation relationship.
    An example of *part-of* relationship is the relation between library and books.
    If there were no books, the library wouldn''t exist. Note that a-composition or
    *part-of* relationship is more restrictive—the composed object (the rooms in this
    example) cannot exist without the other object. When diagrammatically representing
    composition or aggregation, you must specify the direction. The direction is used
    to specify which object contains the composed object.


    So, the composition is a strong association, but aggregation is a weak association.
    The lifetime of the composed object is dependent on the parent object. Figure
    4.3 shows how association, aggregation, and composition are related to each other.


    ![](img/13229b4b9ff377325da8c3d3e8c64024_83_0.png)'
