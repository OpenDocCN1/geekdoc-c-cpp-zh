  md: "# Suspending and resuming a thread\n\nYou can suspend a thread using the Suspend()\
    \ method. To resume a suspended thread, you may use the Resume() method. It should\
    \ be noted that a thread is not suspended immediately after the Suspend method\
    \ is called or the thread instance. Rather, the thread is suspended after a safe\
    \ point is achieved. This safe point is decided by the runtime—you don't have\
    \ control over it.\n\nThe code snippet given below shows how you can suspend a\
    \ running thread:\n\n```\nif (threadObj.ThreadState == ThreadState.Running )\n\
    {\n    threadObj.Suspend();\n}\n```\n\nThe code snippet given below shows how\
    \ you can resume a suspended thread:\n\n```\nif (threadObj.ThreadState == ThreadState.Suspended\
    \ )\n{\n    threadObj.Resume();\n}\n```\n\nNote that you can resume a thread that\
    \ is in the suspended state only. Attempts to resume a thread that is not in a\
    \ suspended state is ignored.\n\n# Passing data to a thread\n\nYou can pass data\
    \ to a thread method using a lambda expression as shown in the following code\
    \ snippet:\n\n```\nstatic void Main()\n{\n    Thread t = new Thread (() => Display(\"\
    Hello World!\"));\n    t.Start();\n}\n\nstatic void Display (string message)\n\
    {\n    Console.WriteLine(message);\n}\n```"
