  md: "# Implementing a custom exception class\n\nIn this section, we'll learn how\
    \ to build a custom exception class in C#. A custom exception class is created\
    \ by extending the System.Exception class and then adding custom code to it.\n\
    \nWhen creating a custom exception class, you have two choices--extend either\
    \ the ApplicationException class or the System.Exception class. It should be noted\
    \ that ApplicationException is thrown by your program and not by the CLR. Albeit\
    \ the fact the ApplicationException was originally intended to be to create user-defined\
    \ exceptions, Microsoft does not recommend this anymore. It should be noted that\
    \ ApplicationException is thrown by your program and not by the runtime. If you\
    \ are designing your custom exception classes by extending the ApplicationException\
    \ class, you would need to throw the custom exception explicitly and this adds\
    \ overhead as far as application performance is concerned. Hence, the practice\
    \ of extending the ApplicationException class to create custom exception classes\
    \ has been deprecated.\n\nIt is a convention to name a custom exception class\
    \ with the suffix Exception. You should derive the System.Exception class to create\
    \ a custom exception class as shown in the code snippet given below:\n\n```\n\
    class LoginException : Exception\n{\n    //Write custom code here\n}\n```\n\n\
    When designing your custom exception class, you should include three constructors,\
    \ that is, a default constructor, a constructor that accepts a string as an argument,\
    \ and a constructor that accepts a string and an inner exception instance as an\
    \ argument. In other words, when creating your custom exception classes, you should\
    \ extend the custom exception class from the System.Exception class and implement\
    \ the three common constructors in the below code example:\n\n```\npublic class\
    \ LoginException : Exception\n{\n    public LoginException()\n    {\n    }\n\n\
    \    public LoginException(string message): base(message)\n```"
