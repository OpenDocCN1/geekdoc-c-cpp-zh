    Note that Figure 1.1 shows the evolution of .NET till .NET Framework 4.5 only.
    The major releases of .NET Framework after .NET Framework 4.5, with their features,
    are as follows:


    +   - .NET Framework 4.6: This version introduces new features and enhancements
    in cryptography, ADO.NET, WPF, profiling, NGen, and Windows Workflow Foundation
    (WWF).

    - .NET Framework 4.7: This version introduces new features and enhancements in
    base classes, networking, ASP.NET, Windows Communication Foundation (WCF), Windows
    Forms, and Windows Presentation Foundation (WPF).

    - .NET Framework 4.8: This version introduces new features and enhancements in
    the areas of obase classes, WCF, WPF, and Common Language Runtime (CLR).'
