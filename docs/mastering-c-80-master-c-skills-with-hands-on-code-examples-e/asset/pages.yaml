  md: '# # CHAPTER 1

    # The Microsoft .NET Ecosystem


    Microsoft .NET Framework is a developer platform that can be used for building
    robust, scalable and portable applications. The first version of the Microsoft
    .NET Framework was released in February 2002 and since then it has matured by
    leaps and bounds. This book starts with a discussion on Microsoft .NET Framework.


    Since C# programs would leverage the .NET Framework, a good knowledge of what
    the underlying platform is all about and how its components work is imperative
    for building efficient applications. This chapter discusses the concepts related
    to Microsoft .NET Framework, its components, memory management, etc. In order
    to be a proficient programmer in C#, one must understand the internals of .NET
    as well. Let''s take a round of briefing on the Microsoft .NET Framework before
    we start learning C# in the next chapter.


    # ## Structure


    In this chapter, we will discuss the following points:


    +   - Introduction to Microsoft .NET

    - Common Language Runtime

    - Framework Class Library

    - Common Language Specification'
  merge: -1
  pgno: 20
- img_proc: true
  md: '2 Mastering C# 8.0


    +   * Common Type System

    * Common Intermediate Language

    * Components of Microsoft .NET Framework

    * Garbage collection

    * The Dynamic Language Runtime


    # # Objective


    After reading this chapter, the reader will be able to:


    +   * Understand the components of .NET Framework

    * Learn how the garbage collector works in .NET

    * Understand why the Common Intermediate Language is needed

    * Understand the Dynamic Language Runtime


    # # Introduction to Microsoft .NET


    .NET Framework is a popular software development platform created by Microsoft.
    It has been around for a long time now and can be used to build windows applications,
    web services, and web-based applications. The .NET Framework primarily runs on
    Windows. However, you can use .NET Core, a light-weight framework, if you have
    to build and run your applications on Linux or Mac as well. .NET Core is free,
    modular, open-source framework for Windows, Linux, and macOS operating systems.
    It is a platform-independent successor to .NET Framework that has been released
    under the MIT license.


    The .NET Framework provides the following benefits:


    +   * Portability

    * Cross-Language Integration

    * Interoperability

    * Base Class Library

    * Security


    # # Evolution of .NET framework


    Figure 1.1 illustrates the evolution of .NET Framework from version 2.0.'
