    # Managed and unmanaged code


    Managed code represents the source code that runs within the context of the CLR
    and managed by it. Type safety is a key concept in .NET. On the contrary, unmanaged
    code is code that runs outside the CLR’s context. In other words, the unmanaged
    code is one that is simply not managed by the CLR. Therefore, the safety of unmanaged
    or unsafe code is not verified by the CLR.


    # Just-in-Time compiler


    Programs written in C# or VB.NET when compiled generate intermediate language
    code. This is also known as the intermediate language (IL) code. The JIT compiler
    is responsible for compiling the IL code to a native code at runtime. Figure 1.6
    illustrates the CLR execution model.'
