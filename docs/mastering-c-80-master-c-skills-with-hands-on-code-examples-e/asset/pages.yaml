- img_proc: true
  md: "The block of code executed by threadA is as follows:\n\n```\nlock(resourceA)\n\
    {\n    //Usual code\n    lock(resourceB)\n    {\n        //Some code\n    }\n\
    }\n```\n\nThe block of code executed by threadB is as follows:\n\n```\nlock(resourceB)\n\
    {\n    //Usual code\n    lock(resourceA)\n    {\n        //Some code\n    }\n\
    }\n```\n\nWhen the above piece of code is executed, here's what happens. The thread,\
    \ threadA, acquires a lock on resourceA while the other thread, threadB, acquires\
    \ a lock on resourceB. After a while, the threadA attempts to lock the resource\
    \ resourceB but it has to wait for the lock on resourceB to be released and vice-versa.\
    \ And, the resultant is deadlock. The recommended practice to avoiding deadlocks\
    \ is locking on objects in a consistent order. Deadlocks can be avoided in this\
    \ case if both the threads acquire the locks on the resources in the same order.\n\
    \n# Conclusion\n\nThreads are expensive and so multithreading. It should be noted\
    \ that context switching is an expensive process. Threads should be used only\
    \ if your application needs it. This chapter presented a discussion on the concepts\
    \ related to threads and multithreading in C# with relevant code examples wherever\
    \ applicable. In the next chapter, we'll examine how we can work with files in\
    \ C#."
