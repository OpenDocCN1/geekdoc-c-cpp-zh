  md: '# Objective


    After reading this chapter, the reader will be able to learn the advanced concepts
    of C#, including tuples, pattern matching, local functions, nullable types and
    non-nullable reference types, unsafe code, preprocessor directives, regular expressions,
    and Dynamic Language++ Runtime. You will also learn how to apply these advanced
