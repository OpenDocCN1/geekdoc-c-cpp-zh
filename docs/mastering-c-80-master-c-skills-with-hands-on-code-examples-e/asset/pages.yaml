    \n# Association\n\nIn OOP, the terms association, aggregation, and composition\
    \ are used to represent relationships between objects. In association, the objects\
    \ can have their own lifetimes and there is no owner. Association represents a\
    \ using relationship between objects. Association relationship can be one-to-one,\
    \ one-to-many, many-to-one or many-to-many. This is known as the cardinality.\
    \ Association relations can be unidirectional or bidirectional. Composition and\
    \ aggregation are special forms of association.\n\nAn example of an association\
    \ relationship is the relation between a student and a teacher. In a relationship\
    \ between a student and a teacher, there is no owner, and both have their own\
    \ independent lifetimes. To be more precise, when a class has a using relationship\
    \ with another class without any ownership, a relationship is termed as association.\n\
    \nThe code snippet given below illustrates a structural representation of the\
    \ association relationship between two classes:\n\n```\npublic class Association\n\
    {\n    public void someMethod(SomeClass someObj)\n    {\n        someObj.DoSomeWork();\n\
    \    }\n}\n```\n\nAssociation is represented by a line between the participating\
    \ classes and an arrow. The Unified Modeling Language (UML) notation for association\
    \ is shown in Figure 4.1."
