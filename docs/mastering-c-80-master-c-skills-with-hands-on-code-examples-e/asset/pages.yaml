  md: '# ConcurrentBag<T>


    The ConcurrentBag class represents a thread-safe, unordered collection of elements.
    Unlike a ConcurrentDictionary you can store duplicate elements in a ConcurrentBag.
    The code snippet given below illustrates how an instance of ConcurrentBag can
    be created.


    ```

    ConcurrentBag<int> bag = new ConcurrentBag<int>();

    ```


    The code snippet given below shows how we can add items to an instance of ConcurrentBag:


    ```

    ConcurrentBag<int> concurrentBag = new ConcurrentBag<int>();

    concurrentBag.Add(1);

    concurrentBag.Add(2);

    concurrentBag.Add(3);

    concurrentBag.Add(4);

    concurrentBag.Add(5);

    ```


    You can also add a list of integers to an instance of ConcurrentBag, that is initialize
    a ConcurrentBag using a collection. The code snippet given below illustrates how
    this can be achieved:


    ```

    List<int> integers = new List<int>();

    ```


    ```

    integers.Add(1);

    integers.Add(2);

    integers.Add(3);

    integers.Add(4);

    integers.Add(5);

    ```


    ```

    ConcurrentBag<int> concurrentBag = new ConcurrentBag<int>(integers);

    ```


    You can get the total number of items in an instance of ConcurrentBag using the
    Count property as shown in the below code snippet:


    ```

    ConcurrentBag<int> concurrentBag = new ConcurrentBag<int>(integers);

    int numberOfItems = concurrentBag.Count; //returns 5

    ```


    To retrieve items from a ConcurrentBag you can take advantage of either the TryPeek
    or the TryTake methods. While the former returns an item from the bag doesn''t
    remove it, the latter returns an item from the bag and removes it as well.'
