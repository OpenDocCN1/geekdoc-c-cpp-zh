    \nFigure 11.6\n\n# Thread pooling\n\nA thread pool comprises a collection of worker\
    \ threads and IO threads. It can be defined as a pool of threads that are ready\
    \ to execute instructions when asked for. You can leverage thread pools to create\
    \ and use threads as and when they are needed, that is, on demand. A thread pool\
    \ reduces the number of application threads and complexity of thread management.\
    \ Usage of thread pools can reduce or eliminate the overhead of having to create\
    \ threads each time the application needs one. It should be noted that a thread\
    \ pool works in a non-deterministic manner, that is, you don't have any control\
    \ over a thread submitted to the thread pool would execute. Figure 11.6 shows\
    \ a thread pool, comprising both worker threads and async threads:\n\n![](img/13229b4b9ff377325da8c3d3e8c64024_241_1.png)\n\
    \nFigure 11.7\n\n# Multithreading in C#\n\nTo work with thread pooling in .NET,\
    \ you should leverage the ThreadPool classes available as part of the System.Threading\
    \ namespace. You can create a thread pool in a number of ways. These include the\
    \ following:\n\n- Using the task parallel library\n- Using a BackgroundWorker\n\
    - Using the ThreadPool.QueueUserWorkItem\n- Using asynchronous delegates\n\nThe\
    \ code snippet given below shows how you can set the minimum number of threads\
    \ in the ThreadPool:\n\n```c\nThreadPool.MinThreads(25, 25);\n```\n\nWhile the\
    \ first parameter to the SetMinThreads is the minimum number of worker threads,\
    \ the second parameter is used to set the minimum number of IO completion threads.\
    \ You can also set the maximum number of threads in the thread pool using the\
    \ ThreadPool.SetMax method.\n\nYou can retrieve the number of available worker\
    \ threads and available async threads using the GetMinThreads static method of\
    \ the ThreadPool class as shown in the code snippet below:\n\n```c\nint availableWorkerThreads\
    \ = 0;\nint availableAsyncThreads = 0;\n\nThreadPool.GetMinThreads(out availableWorkerThreads,\
    \ out availableAsyncThreads);\n```\n\n# Thread synchronization\n\nThread synchronization\
    \ is a concept that ensures that only one thread can access a shared resource\
    \ at a given point of time. No other thread can access the resource till the time\
    \ the thread relinquishes control of the shared resource.\n\nSynchronization belong\
    \ to the following categories:\n- Locking constructs like Mutex, SpinLock\n- Blocking\
    \ constructs like Sleep, Join\n- Signaling constructs like Wait, Pulse\n- Non-blocking\
    \ constructs like Interlocked, Memorybarrier\n\nIn this section, we'll now examine\
    \ how synchronization can be achieved using the lock keyword. The code snippet\
    \ below shows a class that is not thread-safe:\n\n```csharp\nclass ThreadUnsafe\n\
    {\n    static int i = 10, j = 1;\n\n    public static void Display()\n    {\n\
    \        if (j != 0)\n        {\n            Console.WriteLine(i / j);\n     \
    \       j = 0;\n        }\n    }\n}\n```\n\nThe lock keyword in C# is a shortcut\
    \ for the methods Monitor.Enter and Monitor.Exit. Here's a thread-safe version.\
    \ Note how the lock keyword has been used:\n\n```csharp\nclass ThreadSafe\n{\n\
    \    private static readonly object lockObj = new object();\n    static int i\
    \ = 10, j = 1;\n\n    public static void Display()\n    {\n        if (j != 0)\
    \ \n        {\n            lock (lockObj)\n            {\n                Console.WriteLine(i\
    \ / j);\n                j = 0;\n            }\n        }\n    }\n}\n```\n\n#\
    \ Deadlocks\n\nA deadlock is a condition that happens when two threads attempt\
    \ to access a resource that is held by the other thread. As an example, let there\
    \ be two threads, threadA and threadB, executing at the same point of time. Assume\
    \ that the threads acquire locks on resourcesA and resourceB in the way shown\
    \ in the code example below.\n\nThe block of code executed by threadA is as follows:\n\
    \n```csharp\nlock(resourceA)\n{\n    //Usual code\n    lock(resourceB)\n    {\n\
    \        //Some code\n    }\n}\n```\n\nThe block of code executed by threadB is\
    \ as follows:\n\n```csharp\nlock(resourceB)\n{\n    //Usual code\n    lock(resourceA)\n\
    \    {\n        //Some code\n    }\n}\n```\n\nWhen the above piece of code is\
    \ executed, here's what happens. The thread, threadA, acquires a lock on resourceA\
    \ while the other thread, threadB, acquires a lock on resourceB. After a while,\
    \ the threadA attempts to lock the resource resourceB but it has to wait for the\
    \ lock on resourceB to be released and vice-versa. And, the resultant is deadlock.\
    \ The recommended practice to avoiding deadlocks is locking on objects in a consistent\
    \ order.\n\n# Conclusion\n\nThreads are expensive and so multithreading. It should\
    \ be noted that context switching is an expensive process. Threads should be used\
    \ only if your application needs it. This chapter presented a discussion on the\
    \ concepts related to threads and multithreading in C# with relevant code examples\
    \ wherever applicable. In the next chapter, we'll examine how we can work with\
    \ files in C#.\n"
