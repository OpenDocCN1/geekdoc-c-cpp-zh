    \ 属性的作用是什么？\n5. 如何将实例序列化为 JSON 格式？\n\n# 第 13 章\nC# 高级概念\n\n本章讨论了 C# 编程语言的一些高级概念。\n\
    \n## 结构\n\n在本章中，我们将讨论以下几点：\n\n- 元组 (Tuples)\n- 模式匹配 (Pattern matching)\n- 局部函数\
    \ (Local functions)\n- 可空类型和不可空引用类型\n- 不安全代码 (Unsafe code)\n- 预处理器指令\n- 正则表达式\n\
    - 动态语言运行时 (Dynamic Language Runtime)\n- 属性 (Attributes)\n- 反射 (Reflection)\n\n\
    # 目标\n\n阅读本章后，读者将学习 C# 的高级概念，包括元组、模式匹配、局部函数、可空类型和不可空引用类型、不安全代码、预处理器指令、正则表达式以及动态语言运行时。还将学习如何在\
    \ C# 程序中应用这些高级概念。\n\n# 元组 (Tuples)\n\n元组是一种用于表示一组同构或异构数据的数据结构。它是不可变的、固定大小数据的有序序列。元组的大小在创建后是固定的。元组的属性无法更改，因为它们从创建开始就是只读的。你可以使用元组在一个“伞”内存储多个不同数据类型的值。\n\
    \n注意，元组有八项的限制。如果你想存储更多项，应该使用嵌套元组。C# 中的 Tuple 类本质上是静态的，并利用工厂设计模式来创建元组实例。\n\nTuple\
    \ 类的重载和静态 Create 方法如下：\n\n```csharp\nCreate<T1>(T1) - 用于创建 1 元元组\n```\n\n```csharp\n\
    Create<T1, T2>(T1, T2) - 用于创建 2 元元组\n```\n\n```csharp\nCreate<T1, T2, T3>(T1,\
    \ T2, T3) - 用于创建 3 元元组\n```\n\n```csharp\nCreate<T1, T2, T3, T4>(T1, T2, T3, T4)\
    \ - 用于创建 4 元元组\n```\n\n```csharp\nCreate<T1, T2, T3, T4, T5>(T1, T2, T3, T4, T5)\
    \ - 用于创建 5 元元组\n```\n\n```csharp\nCreate<T1, T2, T3, T4, T5, T6>(T1, T2, T3, T4,\
    \ T5, T6) - 用于创建 6 元元组\n```\n\n```csharp\nCreate<T1, T2, T3, T4, T5, T6, T7>(T1,\
    \ T2, T3, T4, T5, T6, T7) - 用于创建 7 元元组\n```\n\n下面的代码段创建了一个包含三个不同类型项目的元组：\n`Tuple<int,\
    \ string, DateTime> tuple = Tuple.Create(1, \"Joydip\", new DateTime(1970, 1,\
    \ 1));`\n\n下面的代码列表插图了如何创建一个元组、向其分配数据并显示元组属性的值：\n\n```csharp\nstatic void PrintData(string\
    \ str, int i)\n{\n    Console.WriteLine(\"{0} {1}\", str, i);\n}\nstatic void\
    \ Main(string[] args)\n{\n    Tuple<string, int> tuple = new Tuple<string, int>(\"\
    This is a string.\", 10);\n    PrintData(tuple.Item1, tuple.Item2);\n}\n```\n\n\
    下面的代码段插图了如何创建一个包含超过八个元素的元组：\n\n```csharp\nvar lstAuthors = new List<Tuple<int,\
    \ string, string>>(\n    Tuple.Create(1, \"Joydip\", \"India\"),\n    Tuple.Create(2,\
    \ \"Anaraswamy\", \"India\"),\n    Tuple.Create(3, \"Steve Smith\", \"USA\"),\n\
    \    Tuple.Create(4, \"Davin\", \"USA\"),\n    Tuple.Create(5, \"Michalle\", \"\
    USA\")\n);\n```\n\n现在，考虑以下创建元组列表的代码：你可以使用以下代码来显示你创建的列表中作者的名字：\n\n```csharp\nforeach\
    \ (Tuple<int, string, string> tuple in lstAuthors)\n{\n    Console.WriteLine(tuple.Item2);\n\
    }\n```\n\n# 模式匹配 (Pattern matching)\n\n模式匹配是在 C# 7.0 中引入的。你可以对任何数据类型使用模式匹配。下面的代码段插图了模式匹配如何工作：\n\
    \n```csharp\nobject obj = \"This is a test\";\nif (obj is str)\n{\n    Console.WriteLine(str);\n\
    }\n```\n\n模式匹配也可以用于自定义类型，让我们查看下面的代码：\n\n```csharp\npublic class Employee\n{\n\
    \    public int Id { get; set; }\n    public string FirstName { get; set; }\n\
    \    public string LastName { get; set; }\n    public string Address { get; set;\
    \ }\n}\n\npublic class PartTimeEmployee\n{\n    public double Hourly { get; set;\
    \ }\n}\n\npublic class FullTimeEmployee\n{\n    public double Salary { get; set;\
    \ }\n}\n```\n\n模式匹配可以用于实例化这些类：\n\n```csharp\nPartTimeEmployee partTimeEmployee\
    \ = new PartTimeEmployee();\npartTimeEmployee.Hourly = 20;\n\nFullTimeEmployee\
    \ fullTimeEmployee = new FullTimeEmployee();\nfullTimeEmployee.Salary = 50000;\n\
    ```\n\n现在检查类型：\n\n```csharp\nif (partTimeEmployee is PartTimeEmployee p)\n{\n\
    \    Console.WriteLine(p.Hourly);\n}\n\nif (fullTimeEmployee is FullTimeEmployee\
    \ f)\n{\n    Console.WriteLine(f.Salary);\n}\n```\n\n# 局部函数 (Local functions)\n\
    \n在 C# 中，局部函数允许你在另一个方法内部定义方法。它们通常只使用一次。下面的代码段插图了如何使用局部函数：\n\n```csharp\nstatic\
    \ void Main(string[] args)\n{\n    int Sum(int x, int y)\n    {\n        return\
    \ x + y;\n    }\n\n    Console.WriteLine(Sum(10, 20));\n}\n```\n\n# 可空类型和不可空引用类型\
    \ (Nullable types and non-nullable reference types)\n\n引用类型默认是可空的，但 int 等值类型不是。可空值类型在\
    \ C# 2.0 中首次引入。可空类型包含两个成员：HasValue 和 Value。前者表示可空类型是否有值的布尔类型，后者包含可空类型内部的数据。下面的代码段插图了如何使用\
    \ HasValue：\n\n```csharp\nstatic void Main(string[] args)\n{\n    int? x = 10;\n\
    \    if (x.HasValue)\n    {\n        Console.WriteLine(\"The variable contains\
    \ non-nullable value.\");\n    }\n    else\n    {\n        Console.WriteLine(\"\
    The variable contains null value.\");\n    }\n    Console.Read();\n}\n```\n\n\
