    ## Objective


    After reading this chapter, the reader will be able to:


    - Understand the components of .NET Framework

    - Learn how the garbage collector works in .NET

    - Understand why the Common Intermediate Language is needed

    - Understand the Dynamic Language Runtime


    ## Introduction to Microsoft .NET


    .NET Framework is a popular software development platform created by Microsoft.
    It has been around for a long time now and can be used to build windows applications,
    web services, and web-based applications. The .NET Framework primarily runs on
    Windows. However, you can use .NET Core, a light-weight framework, if you have
    to build and run your applications on Linux or Mac as well. .NET Core is a free,
    modular, open-source framework for Windows, Linux, and macOS operating systems.
    It is a platform-independent successor to .NET Framework that has been released
    under the MIT license.


    The .NET Framework provides the following benefits:


    - Portability

    - Cross-Language Integration

    - Interoperability

    - Base Class Library

    - Security


    ## Evolution of .NET framework


    Figure 1.1 illustrates the evolution of .NET Framework from version 2.0.


    ## The Microsoft .NET Ecosystem


    ![](img/13229b4b9ff377325da8c3d3e8c64024_22_0.png)


    ![](img/13229b4b9ff377325da8c3d3e8c64024_22_1.png)


    ![](img/13229b4b9ff377325da8c3d3e8c64024_22_2.png)


    ![](img/13229b4b9ff377325da8c3d3e8c64024_22_3.png)


    ![](img/13229b4b9ff377325da8c3d3e8c64024_22_4.png)


    ![](img/13229b4b9ff377325da8c3d3e8c64024_22_5.png)


    > Figure 1.1: The evolution of .NET over the years


    Note that Figure 1.1 shows the evolution of .NET till .NET Framework 4.5 only.
    The major releases of .NET Framework after .NET Framework 4.5, with their features,
    are as follows:


    - .NET Framework 4.6: This version introduces new features and enhancements in
    cryptography, ADO.NET, WPF, profiling, NGen, and Windows Workflow Foundation (WWF).

    - .NET Framework 4.7: This version introduces new features and enhancements in
    base classes, networking, ASP.NET, Windows Communication Foundation (WCF), Windows
    Forms, and Windows Presentation Foundation (WPF).

    - .NET Framework 4.8: This version introduces new features and enhancements in
    the areas of base classes, WCF, WPF, and Common Language Runtime (CLR).


    ## Common Language Runtime


    The Common Language Runtime (CLR) is a runtime engine that is responsible for
    executing your programs, code verification, type safety, memory allocation, garbage
    collection, security, and many more. It provides several services, which includes:


    - Just-in-time compilation

    - Garbage collection

    - Code access security

    - Memory management

    - Code verification


    Figure 1.2 depicts the components of .NET Framework.


    ![](img/13229b4b9ff377325da8c3d3e8c64024_23_0.png)


    Figure 1.2: Components of .NET Framework


    ## Common Intermediate Language


    The Common Intermediate Language (CIL), formerly known as Microsoft Intermediate
    Language (MSIL), is a platform-independent language into which source code is
    compiled in the .NET environment. It is a set of instructions that are platform
    independent and is generated by the compiler from the source code. At runtime,
    the CIL is converted into a machine code by the Just-in-Time (JIT) compiler. In
    other words, the JIT compiler converts the CIL into a machine code specific to
    the target environment, that is, the environment in which the application needs
    to execute. Figure 1.3 shows how this entire process works:


    ![](img/13229b4b9ff377325da8c3d3e8c64024_24_0.png)


    Figure 1.3


    ## Dynamic Language Runtime


    While the CLR provides services such as, a common type system, JIT, garbage collection,
    and many more, the Dynamic Language Runtime (DLR) runs on top of the CLR and offers
    services for dynamic languages. These include: dynamic types, dynamic method dispatch,
    code generation, and more.


    ## Mastering Mastering C# 8.0


    Figure 1.4 shows how CLR and DLR are related:


    ![](img/13229b4b9ff377325da8c3d3e8c64024_25_0.png)


    Figure 1.4: The Dynamic Language Runtime (DLR)


    The DLR was first introduced in .NET 4.0. The addition of the dynamic language
    to .NET has enhanced the capabilities of C#. We''ll learn more about it later.


    ## Class Library


    The .NET Class Library (FCL) is a comprehensive collection of reusable classes,
    interfaces, and other types provided by .NET.


    The services provided by FCL include:


    - File handling

    - Database access

    - XML


    ## Type System


    The Common Type System (CTS) is a standard that defines how types are represented
    in .NET. It enables multiple languages to coexist.


    ## Value types and reference types


    The CTS provides support for two types. While value types are stored on the stack,
    reference types are stored in the managed heap. Refer to Figure 1.5 for better
    understanding:


    ![](img/13229b4b9ff377325da8c3d3e8c64024_26_0.png)


    > Figure 1.5: Type System


    Here''s the list of value types in .NET:


    - bool

    - byte

    - decimal

    - double

    - enum

    - float

    - int

    - long


    ## Mastering Mastering C# 8.0


    - short

    - uint

    - ulong

    - ushort


    Here''s the list of reference types in .NET:


    - class

    - interface

    - delegate

    - object

    - strings


    ## Managed and unmanaged code


    Managed code represents the source code that runs within the context of the CLR
    and is managed by it. On the contrary, unmanaged code is one that runs outside
    the CLR. Therefore, the safety of unmanaged code is not verified.


    ## Just-in-time compiler


    Programs written in C# or VB.NET when compiled generate intermediate language
    code. This is also known as intermediate language (IL) code. The JIT compiler
    is responsible for compiling the IL code to native code at runtime. Figure 1.6
    illustrates the CLR execution model.


    ![](img/13229b4b9ff377325da8c3d3e8c64024_28_0.png)


    The native code is then executed by the host operating system with the help of
    the CPU and other resources.


    ## Garbage collection


    Garbage collection (GC) is a feature provided by .NET CLR to manage memory automatically.
    It cleans up the unused objects, that is, objects that are no longer in use. The
    term garbage here implies an object that is no needed.


    ## Mastering Mastering C# 8.0


    The heap memory is divided into two portions: The small object heap (SOH) and
    the large object heap (LOH). Let''s first discuss how the GC works in the SOH.
    For reference, see Figure 1.7:


    ![](img/13229b4b9ff377325da8c3d3e8c64024_29_0.png)


    Figure 1.7: The Managed Heap in .NET


    Microsoft .NET adopts a generational model for storing objects in the memory.
    In this model, the garbage collected heap (part of the small object heap) is partitioned
    into three distinct regions: generation 0, generation 1, and generation 2. When
    objects are first created, they are placed in generation 0. If the objects in
    generation 0 survive a generation 0 collection, they are promoted to generation
    1. Similarly, when objects in generation 1 survive a generation 1 collection,
    they are promoted to generation 2.


    Figure 1.8 illustrates these three generations of the GC:


    | Generation 2 |

    | Generation 1 |

    | Generation 0 |


    Figure 1.8: The three generations of the GC

