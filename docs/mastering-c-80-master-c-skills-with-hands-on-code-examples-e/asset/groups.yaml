  - '[PAGE 209]


    # Parallel verses Task


    +   * Understand the concepts of Parallel and Asynchronous Programming

    * Learn to use async and wait in programs

    * Understand Parallel LINQ

    * Understand Task Parallel Library


    Microsoft .NET provides excellent support for programming using threads. A thread
    in .NET represents an OS-level thread that contains its own stack and kernel resources
    necessary for the thread to work. You can create, suspend, resume, or abort threads,
    set thread properties, and write methods that would be executed when a thread
    runs. You will learn more about threads in the chapter on multithreading.


    A ThreadPool is a pool of ready to use threads. It is a wrapper around a thread.
    A thread pool in .NET is represented using the ThreadPool class. You can take
    advantage of thread pools to avoid the overhead of creating threads each time
    you need. However, a thread pool doesn''t provide any way for you to know if a
    thread has completed its execution. Hence, thread pools are a good choice for
    running short operations only.


    The Task Parallel Library (available as of Microsoft .NET Framework 4.0 onwards)
    contains a Task class that you can take advantage of to create and manage tasks
    in .NET. A task combines the best of both worlds, that is, like a thread pool
    a task scheduler in .NET is represented by the TaskScheduler class—you have a
    default scheduler that runs on the ThreadPool. The Task class provides more fine-grained
    control to execute a task (represented by one or more instructions). You can leverage
    the Task class to implement asynchronous programming as well. We will examine
    this later in the chapter.


    # Parallel programming


    Parallel programming breaks a large program into smaller chunks and executes chunk
    concurrently. Parallel programming is of two types:


    +   * Data parallelism: Data parallelism is achieved by distributing data across
    different parallel computing nodes where each processor performs the same task
    on these pieces of data.


    +   * Task parallelism: Task parallelism is defined as the mechanism of executing
    different threads on each processor on an identical or a different piece of data.'
- md: "\n## Parallel Extensions Library\n\nThe Parallel Extensions Framework or the\
    \ Parallel Framework extensions or PFX is a managed concurrency library. You can\
    \ take advantage of this library to implement imperative and declarative data\
