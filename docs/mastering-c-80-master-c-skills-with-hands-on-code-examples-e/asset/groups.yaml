    ## 关于作者


    Joydip Kanjilal 是 ASP.NET 的微软最有价值专家 (MVP)，一名演讲者以及多本书和文章的作者。他连续在 2007、2008、2009、2010、2011
    和 2012 年获得了备受殊誉的 MVP 奖。


    Joydip 在 IT 领域拥有 20 多年的行业经验，在微软 .NET 及其相关技术领域拥有 16 年以上的经验。他曾被选为 Fortnite MSDN
    特色开发者并多次获得社区积分奖。


    他编写了多本书和 500 多篇文章。他写的许多关于 ASP.NET 的文章已在微软官方网站上刊登过。


    Joydip 编写了以下书籍：


    - Entity Framework Tutorial 第2版 (Packt Publishing)

    - ASP.NET Web API (Packt Publishing)

    - Visual Studio Six in One (Wrox Publishers)

    - ASP.NET 4.0 Programming (Mc-Graw Hill Publishing)

    - Entity Framework Tutorial (Packt Publishing)

    - Pro Sync Framework (APRESS)

    - Sams Teach Yourself ASP.NET Ajax in 24 Hours (Sams Publishing)

    - ASP.NET Data Presentation Controls Essentials (Packt)


    Joydip 还审阅了多本书。他曾是班加罗尔著名的 Spark IT 2010 活动和受人尊敬的 Dr. Dobb''s Conference 2014 的演讲者。他曾担任
    Dr. Dobb''s Journal Jolt Awards 的评审。Joydip 是 SSWUG 虚拟会议的定期演讲者。他现在的博客是：https://www.infowerorld.com/blog/microsoft-coder/


    ## 审稿员


    Anand Narayanaswamy 是一位住在 Thiruvananthapuram 的自由作家和评论员。他曾在领先的印刷杂志和在线门户网站发表过文章和评论。Anand
    曾担任 ASPAlliance 的首席技术编辑。他是 2002 年至 2011 年微软 MVP 奖获得者。他目前是 Windows Insider MVP，也是著名的
    ASPInsiders 组的成员。


    Anand 还为 Packt、Sams Publishing、Addison-Wesley 等出版社担任技术编辑和审稿员。Anand 还为 Packt Publishing
    写了《Community Server Quickly》。Anand 还为 Digit Magazine 和 Manorama Year Book 贡献内容。


    Anand 在 Unacademy 教教，并运营自己的博客 Netans 和 Learnxpress。Anand 在社交媒体上非常活跃，可以通过 Twitter
    的 @visualanand 或 Instagram 的 @netastech 与他联系。


    在空闲时间，Anand 过去经常深入研究不仅是新设备还有旧设备。他的抽屉里堆了一大堆功能手机，包括最新的设备和配件。


    ## 感谢


    首先，我想感谢我的父母，Shri Amal Kanjilal 先生和 Smt. Rama Kanjilal 女。我特别感谢 BPB Publications
    给我写这本书的机会。我特别感谢 Naraywamy 提供的宝贵反馈。我也感谢我的家人的支持和鼓励。最后，感谢 BPB Publications 的所有人在本书写作过程中的指导。


    ## 前言


    C# 是目前最流行的语言之一。从 2000 年发布 C# 1.0 以来，该语言经历了飞速的发展。它是一种语法简洁的强大多用途语言。在本书写作，C# 8.0
    刚刚发布。这是一本精通 C# 的简洁指南。本书分为 15 章。每章目标的简要描述如下：


    - 第 1 章介绍了 .NET Framework 的概念。本章提供了用于构建健壮、可扩展和移植程序的平台讨论。

    - 第 2 章介绍了如何开始使用 Visual Studio。

    - 第 3 章介绍了 OOP 的基础概念。

    - 第 4 章讨论了 OOP 的高级概念。

    - 第 5 章讨论了 C# 中的属性和索引及其编程。

    - 第 6 章探讨了 LINQ 概念以及如何使用 LINQ 对数据源进行查询。

    - 第 7 章讨论了泛型和泛型集合以及如何使用它们。

    - 第 8 章讨论了委托、Lambda 表达式和扩展方法。

    - 第 9 章讨论了异步和并行编程。

    - 第 10 章关注多线程概念以及如何在 C# 中处理多线程。

    - 第 11 章讨论了序列化及其类型，以及如何在 C# 中处理文件。

    - 第 12 章讨论了 C# 编程语言的高级概念。

    - 第 13 章讨论了 C# 8.0 的新功能。

    - 第 14 章是本书的最后一章，介绍了如何使用 Visual Studio 2019 IDE。


