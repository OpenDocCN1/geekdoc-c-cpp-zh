- md: "\n# Asynchrony and Parallel Programming in C#\n\nis a programming paradigm\
    \ that enables you to build applications having fast and responsive user interfaces.\n\
    \nIn addition, asynchronous programming helps improve the responsiveness and scalability\
    \ of an application. You can take advantage of asynchronous programming to reduce\
    \ the number of threads needed in an application. It increases the number of requests\
    \ that can be handled at the same time using the same resources. Threads are expensive\
    \ as they consume a lot of resources and context switching is a resource-intensive\
    \ operation. You can leverage asynchronous programming to avoid having to create\
    \ additional threads and blocking the current thread.\n\n# Async and Await\n\n\
    The async keyword is used in the method signature to imply that a method can use\
    \ the await keyword and enable asynchronous capabilities. In other words, the\
    \ async keyword used in a method signature makes a method asynchronous. An asynchronous\
    \ method can use the await keyword to indicate suspension points. Note that if\
    \ an async method doesn't have the await keyword the method will be executed synchronously.\
    \ An asynchronous method will have the keyword async in its signature and can\
    \ have following return types: void, Task, or Task<T>.\n\nAsynchronous methods\
    \ in .NET can have any of the following return types:\n\n- *Task*: This returns\
    \ control to the caller once the work is done.\n- *Task<T>*: This returns an object\
    \ of type T to the caller after the work is done.\n- *void*: This is used to make\
    \ a fire-and-forget method.\n\nThe code snippet below illustrates an example of\
    \ an asynchronous method. Note the usage of the async keyword in the method signature\
    \ and the await keyword inside the method body.\n\n```csharp\npublic async Task<string>\
    \ DownloadString(String url)\n{\n    var request = await _httpClient.GetAsync(url);\n\
    \    return await request.Content.ReadAsStringAsync();\n}\n```\n\nThe code snippet\
    \ below illustrates a synchronous version of the DownloadString method. Note the\
    \ usage of the .Result property. However, this approach is not recommended for\
    \ reasons discussed later and is just given here for illustrative purposes:\n\n\
    ```csharp\npublic string DownloadString(String url)\n{\n    var request = _httpClient.GetAsync(url).Result;\n\
    \    return request.Content.ReadAsAsync().Result;\n}\n```\n\n# Task.Run and Task.Factory.StartNew\n\
