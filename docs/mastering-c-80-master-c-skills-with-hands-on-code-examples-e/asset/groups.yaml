    \ is defined as a relationship in which one class depends on another class for\
    \ its functionality. If the supplier class changes, the client class may also\
    \ need to be changed. The UML notation for dependency is shown in the Figure 4.7.\n\
    \n![](img/13229b4b9ff377325da8c3d3e8c64024_86_0.png)\n\nFigure 4.7\n\n## Polymorphism\n\
    \nPolymorphism is one of the core concepts of OOP. The goal of polymorphism is\
    \ to allow objects of different types to be accessed using the same interface.\
    \ The word polymorphism is derived from two Greek words, namely poly many and\
    \ morphos mean forms.\n\nPolymorphism is basically of two types:\n\n- Static polymorphism\
    \ or compile-time polymorphism\n- Dynamic or runtime polymorphism\n\n## Static\
    \ polymorphism or compile-time polymorphism\n\nMethod overloading is an example\
    \ of static polymorphism. In method overloading, you will have multiple methods\
    \ in a class consisting of same name but different signatures. The SimpleCalculator\
    \ class below demonstrates overloaded methods. In this class, the method Add is\
    \ overloaded.\n\n```java\npublic class SimpleCalculator\n{\n    public int Add(int\
    \ x, int y)\n    {\n        return x + y;\n    }\n    public int Add(int x, int\
    \ y, int z)\n    {\n        return x + y + z;\n    }\n}\n```\n\nConstructor overloading\
    \ is also an example of static polymorphism. You may need to take advantage of\
    \ constructor overloading in order to allow an instance of a class to be initialized\
    \ in various ways. In constructor overloading, you will have multiple constructors\
    \ for a class, each of them differing in the signature. The code snippet in Figure\
    \ 4.8 shows a class with multiple constructors, demonstrating constructor overloading:\n\
    \n![](img/13229b4b9ff377325da8c3d3e8c64024_87_0.png)\n\nFigure 4.8: Constructor\
    \ overloading\n\nThe class MyClass in the code example, which is shown in the\
    \ preceding screenshot, has two constructors—a default constructor and argument\
    \ constructor. Two instances of the class MyClass are created in the Main() method:\
    \ one named obj1 and the other named obj2. When the instance obj1 is created,\
    \ the default constructor is called. Since the default constructor doesn't have\
    \ any code inside, the value of the variable x remains unchanged. When the instance\
    \ obj2 is created, the value of 10 is passed as an argument to the one-argument\
    \ constructor. In this case, the value of the variable x is changed to 10. So,\
    \ when this code is executed, the value of x is displayed as 0 for the instance\
    \ obj1 and 10 for the instance obj2.\n"
