    \ Main(string[] args)\n{\n    BitArray bitArray = new BitArray(5, true);\n\n \
    \   for (int index = 0; index < bitArray.Length; index++)\n        Console.WriteLine(bitArray[index]);\n\
    \    Console.Read();\n}\n```\n\n## Generics—what is it and why should I use it?\n\
    \nThe C# programming language is a strongly-typed language. So, you should declare\
    \ the type of an object before assigning any value to it. Although this feature\
    \ enforces language interoperability and security, you are constrained to specifying\
    \ the type of an object before a value is assigned to the object.\n\nGenerics\
    \ enable us to work with type-safe collections in C#. In doing so, there is no\
    \ boxing or un-boxing overhead. Generics are used to implement parametric polymorphism\
    \ in C#. They promote safety, code efficiency, improve performance, and reduce\
    \ code. The code snippet given below illustrates how a generic type can be declared:\n\
    \n```csharp\npublic class SomeClass<T>\n{\n    public void Display()\n    {\n\
    \        //Some code\n    }\n    //Other members\n}\n```\n\nYou can instantiate\
    \ the generic class using the following code:\n\n```csharp\nSomeClass<int> someObject\
    \ = new SomeClass<int>();\n```\n\nNow consider the following array of integers:\n\
    \n```csharp\nint[] integerArray = { 1, 2, 3, 4, 5, 6, 7, 8, 9 };\n```\n\nYou can\
    \ use the below method, which takes advantage of generics to display the contents\
    \ of this array:\n\n```csharp\npublic static void Display<G>(G[] array)\n{\n \
    \   for (int i = 0; i < array.Length; i++)\n    Console.WriteLine(array[i]);\n\
    }\n```\n\nSimilarly, you can display the contents of a character array using the\
    \ same generic method:\n\n```csharp\nchar[] characterArray = { 'H', 'e', '1',\
    \ '1', 'o', '!' };\n\nConsole.WriteLine(\"Displaying characters\");\n\nDisplay(characterArray);\n\
    ```\n\nFigure 7.7 presents the complete program for your reference.\n\n```csharp\n\
    class\n{\n    static void Main(string[] args)\n    {\n        int[] integerArray\
    \ = { 1, 2, 3, 4, 5, 6, 7, 8, 9 };\n        Console.WriteLine(\"Displaying integerArray\"\
    );\n        Display(integerArray);\n\n        char[] characterArray = { 'H', 'e',\
    \ '1', '1', 'o', '!' };\n        Console.WriteLine(\"Displaying characters\");\n\
    \        Display(characterArray);\n\n        Console.Read();\n    }\n\n    public\
    \ static void Display<G>(G[] array)\n    {\n        for (int i = 0; i < array.Length;\
    \ i++)\n        Console.WriteLine(array[i]);\n    }\n}\n```\n\nFigure 7.7\n\n\
    ## Working with generic types\n\nSystem.Collections.Generic namespace contains\
    \ several types that represent generic collections. Strongly typed collections\
    \ provide type safety and improved performance compared to non-generic collection\
    \ types.\n\n## Dictionary\n\nA Dictionary is a generic collection of key-value\
    \ pairs. It implements the IDictionary interface. The keys of a dictionary are\
    \ not unique. The code example given below shows how a Dictionary instance can\
    \ be created and data stored into it:\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    Dictionary<int, string> dictionary = new Dictionary<int, string>();\n\
    \    dictionary.Add(1, \"A\");\n    dictionary.Add(2, \"B\");\n    dictionary.Add(3,\
    \ \"C\");\n}\n```\n\nWhile the Push method of the generic stack pushes an integer\
    \ to the stack, the Pop method removes an element from the top of the stack.\n\
    \nImplementing a generic collection class\n\nIn this section, we will implement\
    \ a custom collection class using generics. We'll implement a custom type safe\
    \ stack class which can store and retrieve elements to and from the generic stack.\n\
    \nThe code listed below shows an implementation of a generic stack. The stack\
    \ can contain a maximum of 10 elements. If you would like it to store more elements,\
    \ you would need to change the value of the size integer variable:\n\n```csharp\n\
    public class GenericStack<GS>\n{\n    const int size = 10;\n    private readonly\
    \ GS[] dataRegister = new GS[size];\n    private int counter = 0;\n    public\
    \ void Push(GS x)\n    {\n        if (counter < size)\n            dataRegister[counter++]\
    \ = x;\n    }\n    public GS Pop()\n    {\n        return dataRegister[--counter];\n\
    \    }\n}\n```\n"
