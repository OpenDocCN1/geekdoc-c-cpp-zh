    \ However, the downside is that the data that is serialized is not in human-readable\
    \ format due to which you would not be able to know what you have serialized.\n\
    \n# XML serialization\n\nXML serialization is slower than binary serialization\
    \ and is used to serialize the public members of a class into an XML stream. XML\
    \ serialization provides cross-platform support and is text-based. The code snippet\
    \ given below shows how you can take advantage of XML serialization to serialize\
    \ an instance of the Author class created earlier:\n\n```c\npublic static void\
    \ Serialize(Author author, string filename)\n{\n    XmlSerializer serializer =\
    \ null;\n    FileStream stream = null;\n    try {\n        serializer = new XmlSerializer(typeof(Author));\n\
    \        stream = new FileStream(filename, FileMode.Create);\n        serializer.Serialize(stream,\
    \ author);\n    }\n    finally {\n        if (stream != null)\n            stream.Close();\n\
    \    }\n}\n```\n\nTo deserialize the instance of the Author class, we can use\
    \ the following code:\n\n```c\npublic static Author Deserialize(string filename)\n\
