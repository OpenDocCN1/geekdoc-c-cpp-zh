    # # Preface


    C# is one of the most popular programming languages around. It is a powerful and
    an efficient multi-purpose computer programming language with terse, clear syntax.
    From the initial release of C# 1.0 back in the year 2000, the C programming language
    has matured leaps and bounds. As of this writing, C# 8.0 has just been released.


    This is a concise book written in a lucid language, packed with a lot of ready-to-use
    real-world code examples and tips on how to make the best use of the C# programming
    language. This book intends to help readers, who are beginners or are relatively
    new to C# programming, to master the concepts of C#. In addition, the book aims
    to assist professionals who would want to master the basic and advanced concepts
    of the C# programming language. This book will guide you through the basic to
    advanced concepts of the C# programming language. It is a comprehensive guide
    to mastering C# with insights into its latest features and enhancements.


    This book is divided into 15 chapters. A brief description of the objective of
    each chapter is given below:


    +   Chapter 1 introduces the concepts of Microsoft.NET Framework. This chapter
    provides a discussion on the features and benefits of Microsoft_NET Framework—a
    device and independent platform that can be used for building robust, scalable
    and portable applications.


    +   Chapter 2 presents a discussion on how to get started working with C# in Visual
    Studio.


    +   Chapter 3 introduces the basic concepts of OOP.


    +   Chapter 4 discusses the advanced concepts of OOP.


    +   Chapter 5 discusses the properties and indexes in C# and how to program them.


    +   Chapter 6 examines the concepts of LINQ and how LINQ can be used for querying
    data from different sources of data.'
