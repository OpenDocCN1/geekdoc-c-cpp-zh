    \ enum. FileMode, which is used to specify how the file should be opened. This\
    \ enum can have the following possible values:\n\n- Append\n- Create\n- CreateNew\n\
    - Open\n- Truncate\n\nThe code snippet given below can be used to read a file\
    \ using FileStream. StreamReader is used here to read the characters from the\
    \ stream:\n\n```csharp\nstatic void Main(string[] args)\n{\n    string path =\
    \ \"D:\\\\test.txt\";\n    string data;\n    FileStream fileStream = new FileStream(path,\
    \ FileMode.Open, FileAccess.Read);\n}\n```\n\nA StreamWriter can also be used\
    \ to create a file. You can use it to write characters to a stream in a particular\
    \ encoding. The code snippet given below shows how you can write lines of text\
    \ to a file using a StreamWriter:\n\n```csharp\nstatic void Main(string[] args)\n\
    {\n    string[] lines = { \"This is the first line\", \"This is the last line\"\
    \ };\n    using (StreamWriter StreamWriter = new StreamWriter(\"test.txt\"))\n\
    \    {\n        foreach (string line in lines)\n        {\n            StreamWriter.WriteLine(line);\n\
    \        }\n    }\n}\n```\n\n# Serialization\n\nSerialization is the process of\
    \ converting an object's state into a stream of bytes so it can be transmitted\
    \ across boundaries or stored in memory. De-serialization is the reverse of serialization\
    \ and is used to reconstruct the object from serialized data. It is a feature\
    \ provided by the Common Language Runtime (CLR).\n\nConsider the following class:\n\
    \nTo serialize an instance of this class, you should mark the class with the Serializable\
    \ attribute. Here's how the updated Author class would look:\n\n```csharp\n[Serializable]\n\
    class Author\n{\n    public int Id { get; set; }\n    public string FirstName\
    \ { get; set; }\n    public string LastName { get; set; }\n    public string Address\
    \ { get; set; }\n}\n```\n\nThe following program creates an instance of the Author\
    \ class and then serializes it as binary:\n\n```csharp\nclass Program\n{\n   \
    \ static void Main(string[] args)\n    {\n        Author author = new Author();\n\
    \        author.Id = 1;\n        author.FirstName = \"Joydip\";\n        author.LastName\
    \ = \"Kanjilal\";\n        author.Address = \"Hyderabad, India\";\n\n        FileStream\
    \ fileStreamObject = null;\n        try\n        {\n            fileStreamObject\
    \ = new FileStream(\"D:\\\\author.bin\", FileMode.Create);\n            BinaryFormatter\
    \ binaryFormatter = new BinaryFormatter();\n            binaryFormatter.Serialize(fileStreamObject,\
    \ author);\n        }\n        finally\n        {\n            fileStreamObject.Close();\n\
    \        }\n    }\n}\n```\n\nTo deserialize the object that has been stored in\
    \ the binary file, you need to make a call to the Deserialize method of the BinaryFormatter\
    \ class. The code given below shows how you can deserialize the Author object\
    \ from the binary file:\n\n```csharp\nstatic void Main(string[] args)\n{\n   \
    \ FileStream fileStreamObject = null;\n\n    try\n    {\n        fileStreamObject\
    \ = new FileStream(@\"D:\\\\author.bin\", FileMode.Open);\n        BinaryFormatter\
    \ binaryFormatter = new BinaryFormatter();\n        Author author = (Author)(binaryFormatter.Deserialize(fileStreamObject));\n\
    \n        Console.WriteLine(author.Id + \"\\t\" + author.FirstName + \"\\t\" +\
    \ author.LastName + \"\\t\" + author.Address);\n        Console.Read();\n    }\n\
    \    finally\n    {\n        fileStreamObject.Close();\n    }\n}\n```\n"
