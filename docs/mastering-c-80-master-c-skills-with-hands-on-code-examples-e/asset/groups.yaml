    \n图 14.3：指定 C# 8.0 为项目的编程语言\n\n好了，你所做的就这些了。你现在可以开始使用 C# 8.0 进行编程了。在接下来的章节中，我们将研究\
    \ C# 8 的显著特性。\n\n## 默认接口成员\n\n如果你还记得的话，接口就像 C++ 中的纯抽象类。它是一个契约，只能包含成员声明。在 C# 8.0\
    \ 之前，你不能在接口中拥有成员定义。随着 C# 8.0，情况发生了变化。你现在可以为你的接口成员提供实现。让我们通过一个示例来理解这一点。下面的代码段显示了如何为接口成员定义实现。ILogger\
    \ 接口包含一个名为 `Initialize` 具有默认实现的方法。\n\n```csharp\ninterface ILogger {\n    void\
    \ Initialize() {\n        Console.WriteLine(\"Working with C# 8!\");\n    }\n\
    }\n```\n\n注意：上述代码在之前的 C# 版本中无法运行，但在 C# 8.0 中是完全允许。\n\n## 可空引用类型\n\nC# 编程语言支持两种类型的变量：基本类型和引用类型。基本类型包括\
    \ char、int 和 double。基本类型不能接受 null。引用类型是我们创建的类的实例对象。引用类型的内存分配在托管堆中。C# 2.0 引入了值类型的可空版本，你可以拥有可空\
    \ char、可空 int 和可空 double。引用类型默认可以为 null。但这可能在你的应用程序中引入可空引用问题。这里正是可空引用类型大显身场的地方。\n\
    \n在 C# 8.0 中，string 对象是非可空引用类型。在 C# 8.0 中，你也可以创建可空引用类型。下面的代码段说明了如何创建可空引用类型：\n\n\
    ```csharp\nstring? nullableString = null;\n```\n\n考虑下面返回可空字符串的方法，它是可空引用类型：\n\n\
    ```csharp\npublic static int GetLength(string? bar)\n{\n    if (string.IsNullOrEmpty(bar))\n\
    \    {\n        return 0;\n    }\n    return bar.Length;\n}\n```\n\n你可以像代码所示调用上述方法：\n\
    \n```csharp\nstatic void Main(string[] args)\n{\n    string? nullableText = null;\n\
    \    Console.WriteLine(nullableText);\n    int length = GetLength(nullableText);\n\
    \    Console.WriteLine(length);\n}\n```\n\n记住空引用异常吗？如果使用可空引用类型，可以避免这个问题。空合并赋值允许你对值进行赋值：\n\
    \n```csharp\nstring? nullableObj = null;\nnullableObj ??= \"default\";\n```\n\n\
    ## 只读成员\n\nC# 8.0 引入了只读成员。下面的代码段说明了如何使用只读成员：\n\n```csharp\npublic struct Rectangle\n\
    {\n    public double Length { get; }\n    public double Breadth { get; }\n}\n\
    ```\n\n## 静态局部函数\n\n局部函数在 C# 7.0 中引入。你可以在方法内部定义局部函数。在 C# 8.0 中，你也可以定义静态局部函数。如下：\n\
    \n```csharp\npublic void OuterFunction(int x)\n{\n    Console.WriteLine(\"Outer\
    \ Function\");\n\n    static void InnerFunction(int y)\n    {\n        Console.WriteLine(\"\
    Inner Function\");\n    }\n}\n```\n\n这是另一个显示如何使用静态局部函数的示例：\n\n```csharp\nint AddNumbers()\n\
    {\n    int a = 10;\n    int b = 20;\n    return Sum(a, b);\n\n    static int Sum(int\
    \ x, int y)\n    {\n        return x + y;\n    }\n}\n```\n\n## 异步流\n\n对异步流的支持是\
    \ C# 8.0 添加的一个很棒的特性，可以异步生成多个值。IAsyncEnumerable 接口允许你生成结果：\n\n```csharp\npublic\
    \ async IAsyncEnumerable<int> GetNumbers()\n{\n    for (int i = 0; i < 10; i++)\n\
    \    {\n        await Task.Delay(10);\n        yield return i;\n    }\n}\n```\n\
    \n## 精通 C# 8.0\n\n这些接口属于 System.Generic。类似于 IDisposable，你还有 IAsyncDisposable\n\
    \n```csharp\npublic interface IAsyncDisposable\n{\n    ValueTask DisposeAsync();\n\
    }\n```\n\n方法要返回异步流需要满足以下条件：\n\n- 方法声明中具有 `async` 修饰符。\n- 方法返回 `IAsyncEnumerable<T>`。\n\
    - 方法包含一个或多个 `yield return` 语句。\n\n## 模式匹配增强\n\nC# 8.0 中的模式匹配得到了增强。你现在可以在 switch\
    \ 表达式中使用模式匹配。由于 C# 8 引入了递归模式——即模式表达式的输出是另一个模式——你现在可以在 C# 8 中利用位置模式匹配、属性匹配、递归模式和元组匹配。\n\
    \nC# 8.0 允许通过利用元组模式、位置模式和属性模式编写复杂的模式匹配表达式。\n\n- **元组模式**：元组模式用于在模式匹配表达式中匹配多个值，如下代码所示：\n\
    \n```csharp\nswitch (LogTarget.File, LogLevel.Info) {\n  case IsVerbose = false:\n\
    \    break;\n  case (LogTarget.File, LogLevel.Warning): {\n    IsVerbose = false;\n\
    \    break;\n  case (LogTarget.File, LogLevel.Error): {\n    IsVerbose = true;\n\
    \    break;\n  default:\n    throw new InvalidOperationException();\n}\n```\n\n\
    - **位置模式**：位置模式包含与元组模式非常相似的语法，用于检查对象的属性并使用这些属性来构建模式：如下代码段所示\n\n```csharp\nif (log\
    \ is LogManager(LogTarget.File, LogLevel.Error)) {\n  // 如果 LogTarget 是 LogTarget.File\n\
    \  // 且 LogLevel 是 LogLevel.Error，则执行代码\n}\n```\n\nLogManager 类型应该具有以下 Deconstruct\
    \ 方法：\n\n`public void Deconstruct(out LogTarget logTarget, out LogLevel logLevel)`\n"
