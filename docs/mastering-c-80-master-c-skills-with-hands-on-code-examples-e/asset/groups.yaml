    }\n```\n\nLike the Directory class, we also have a FileInfo class to work with\
    \ files. The FileInfo class doesn't have static methods like in the File class.\
    \ Some of the important methods of the FileInfo class are as follows:\n\n- Create:\
    \ It is used to create a new file.\n- CreateText: It is used to create new text\
    \ file using a StreamWriter.\n- Delete: It is used to delete a file.\n- OpenText:\
    \ It is used to read an existing text file using a StreamReader.\n- CopyTo: It\
    \ is used to copy an existing file to a new file.\n- MoveTo: It is used to move\
    \ a file from one location to another.\n- AppendText: It is used to append text\
    \ to a file using a StreamWriter.\n\nThe code listed below can be used to create\
    \ a new text file using the FileInfo class:\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    string path = @\"D:\\Test.txt\";\n    FileInfo fileInfo = new\
    \ FileInfo(path);\n    StreamWriter streamWriter = fileInfo.CreateText();\n  \
    \  streamWriter.WriteLine(\"This is a new text file.\");\n    Console.WriteLine(\"\
    A new text file has been created.\");\n    streamWriter.Close();\n    Console.Read();\n\
    }\n```\n\nRefer to the code snippet above. Note how a StreamWriter instance has\
    \ been used together with the FileInfo class to create a text file. Once the file\
    \ has been created, the StreamWriter can be closed.\n\nIf you were to append text\
    \ to a file, you can take advantage of the AppendText method of the FileInfo class.\
    \ The code snippet given below shows how you use a StreamWriter with FileInfo\
    \ class to append text to a file:\n\n```csharp\nstatic void Main(string[] args)\n\
    {\n  string path = @\"D:\\Test.txt\";\n  FileInfo fileInfo = new FileInfo(path);\n\
    \  StreamWriter streamWriter = fileInfo.AppendText();\n  streamWriter.WriteLine(\"\
    Text has been appended...\");\n  Console.WriteLine(\"Text has been appended to\
    \ a text file.\");\n  streamWriter.Close();\n  Console.Read();\n}\n```\n\nWhen\
    \ you'll execute the above code, the line \"Text has been appended...\" will be\
    \ appended to the text file.\n\nYou can also create a file using the FileStream\
    \ class. The FileStream class enables you to read from, write to, open, and close\
    \ files. It also enables you to specify the mode in which a file should be created\
    \ and the access permissions. The code snippet given below illustrates how the\
    \ FileStream class can be used to create a file:\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n  string path = \"D:\\test.txt\";\n  FileStream fs = new FileStream(path,\
    \ FileMode.Create);\n  fs.Close();\n  Console.Write(\"A new file has been created\
