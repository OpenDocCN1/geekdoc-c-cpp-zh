    ## 通用中间语言


    通用中间语言 (CIL)，以前称为微软中间语言 (MSIL)，是一种平台无关的语言，由 .NET 环境生成。在运行时，CIL 被即时编译器 (JIT) 转换为特定的机器码。图
    1.3 显示了这一过程：


    ![](img/13229b4b9ff377325da8c3d3e8c64024_23_0.png)


