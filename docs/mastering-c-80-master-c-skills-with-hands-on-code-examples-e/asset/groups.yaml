    ArrayList is non-generic collection of heterogeneous objects. In an array, we
    are constrained to store data of the same type you. So, an array is a collection
    of data pertaining to homogenous types. In an ArrayList you can store data to
    different types. However, the data you store in an ArrayList will be stored as
    an array.


