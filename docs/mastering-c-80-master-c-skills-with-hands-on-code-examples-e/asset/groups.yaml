    \n# 精通 C# 8.0\n\n描述\n书籍从介绍 .NET 框架的概念开始。然后讨论了 OOP，并探索了如何在 C# 中使用 OOP。关于 OOP 有两个章节：第一章涵盖面向对象编程\
    \ (OOP) 的基础；第二章阐述了 OOP 的高级概念以及如何在 C# 中实现它们。\n\n接下来，书籍讨论了语言集成查询 (LINQ) 以及如何在 C#\
    \ 中使用它，随后讨论了多线程、异步和并行编程概念，并配有相关的代码示例来说明所涵盖的概念。泛型、集合、泛型集合、委托和 lambda 表达式在该部分也有涉及。\n\
    \n你将学到\n通过本书，读者将掌握 C# 编程语言的概念，并能够使用 C# 构建高性能、可扩展且健壮的应用程序。\n\n在书籍的最后部分，简要讨论了序列化、文件\
    \ I/O 以及如何在 C# 中使用它们。增加了一个关于 C# 8.0 的章节以突出其新特性……还有一个附录章节讨论了如何开始使用 Visual Studio\
    \ 2019。\n\n+   主要特性\n- 包含大量的代码示例\n- 精通 C# 的详尽指南\n- 讨论了 OOP 原则\n- 针对 C# 初级到高级读者\n\
    - 提供了最新特性（包括 C# 8.0）的见解\n- 涵盖了 Visual Studio 2019\n\n本书适用于希望从事 .NET 职业的人士，以及想要掌握\
    \ C# 编程语言概念的专业人士。由于本书面向 C# 初级到高级读者，具备基础 C# 知识将会有帮助。\n\n"
