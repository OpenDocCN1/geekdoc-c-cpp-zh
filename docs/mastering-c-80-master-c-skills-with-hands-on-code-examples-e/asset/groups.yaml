    \ `SynchronizationContext` 上。相反，当 `async Task` 或 `async Task<T>` 方法抛出异常时，其详细信息会被捕获并存储在\
    \ `Task` 对象中。\n\n## 避免混合同步异步代码\n\n编写利用异步的程序时，异步代码包含了同步和异步代码的混合。如果你在使用异步代码，你应该贯穿始终使用，也就是说，从最顶层到到底——它应该全程是异步的。\n\
    \n由于在编写异步代码时可能会犯一些常见的错误，人们应该：\n\n- 避免在异步方法中使用 `void` 返回类型。\n- 避免使用 `.Result` 或\
    \ `.Wait()` 阻塞任务。这意味着在阻塞异步代码。\n- 避免为同步方法创建异步包装器。\n\n注意，如果你将方法标记为 `async` 且在方法内部没有使用\
    \ `await` 关键字，则整个方法将以同步方式执行。\n\n## 结论\n\n异步和并行编程是 .NET 中两个最重要的特性之一。在本章中，我们学习了并行和异步编程的概念，以及如何在\
    \ C# 中编写利用这些概念的程序。在下一章中，我们将研究如何在 C# 中处理线程。\n\n## 问题\n\n- 1. 线程（thread）和任务（task）之间的区别是什么？\n\
    2. 异步（asynchrony）和并行（parallelism）之间的区别是什么？\n3. 并行编程有哪些类型？\n- 4. 使用什么方法来控制并行性？\n\
    5. `async` 和 `await` 关键字之间的区别是什么？\n6. 异步方法所有可能的返回类型有哪些？\n7. 什么是任务并行库（Task Parallel\
    \ Library）？\n8. 什么是线程池（thread pool）？为什么需要它？\n9. 什么是任务调度器（task scheduler）？\n10.\
    \ 讨论一些可以用于异步编程的最佳实践。\n\n# 第 11 章\n# C# 中的多线程\n\nMicrosoft .NET Framework 为多线程提供了内置支持。\n\
    本章将讨论我们如何在 C# 中处理多线程进行工作。\n\n## 结构\n\n在本章中，我们将讨论以下几点：\n\n- 线程、进程和任务\n- 多线程\n \
    \ - 多线程的类型\n  - 多线程的优点和缺点\n- 线程池\n- 线程同步\n- 死锁\n- 在 C# 中编写线程\n\n## 目标\n\n阅读完本章后，读者将能够：\n\
    \n- 掌握对线程、进程和任务的理解\n- 理解线程池\n- 理解线程同步\n- 理解死锁及其发生原因\n- 使用线程编写程序\n\n## 进程、线程和任务\n\
    \n进程（process）可以被定义为程序的运行实例。换句话说，进程被定义为执行中的程序。线程（thread）被定义为进程内的执行路径。任务（task）是更高层次的抽象，由任务调度器执行。从本质上说，线程表示为由调度器管理的最小指令序列。线程默认利用线程池，是异步执行某些代码的方便方法。\n\
    \n线程代表一个拥有自己的堆栈和内核资源的 OS 级线程。注意，线程不是 .NET 的构造结构。相反，它们是由操作系统创建和管理的。.NET 中的 `Thread`\
    \ 类提供了一种使用主机操作系统创建和管理线程的方法。\n\n## 多线程\n\n在任何给定时刻，CPU 只能执行一个线程。多线程（Multithreading）是指操作系统能够在同一时刻内存中保留多个线程，并在需要时切换内存中这些线程的能力。因此，如果系统中有\
    \ $n$ 个线程，其中 $1$ 个处于运行状态，其余 $n-1$ 个线程处于其他状态。内存中线程之间的切换（也称为上下文切换）发生得非常快，以至于你会观察到一种伪并行，即似乎所有线程都在并发运行。\n\
    \n## C# 中的多线程 207\n\n图 11.1 显示了线程的状态。我们将在本章稍后部分详细讨论线程状态：\n\n![](img/13229b4b9ff377325da8c3d3e8c64024_226_0.png)\n\
    \n图 11.1\n\n## 多线程的类型\n\n有三种多线程类型包括：\n\n- 串行（Serial）：DOS 操作系统支持。\n- 协作式（Co-operative）：Windows\
    \ 3.11 支持。\n- 抢占式（Preemptive）：Windows 9x、NT、XP 及更多系统支持。\n\n## 多线程的优点和缺点\n\n多线程可以为应用程序提供更高的吞吐量——你可以利用多线程同时执行多个任务。多线程还可以提高应用程序的响应能力。多线程是复杂的且是资源密集型的。线程之间的上下文切换是一项开销很大的。\n\
    \n## 编写线程\n\n`System.Threading` 命名空间提供了用于线程的类型（类、结构和枚举）。`Thread` 类提供了启动、停止或恢复线程的方法。要创建一个新线程，你可以利用\
    \ `ThreadStart` 委托并传递要执行的方法引用：\n\n```csharp\nusing System;\nusing System.Threading;\n\
    \nnamespace Chapter11_Example\n{\n    class Program\n    {\n        static void\
    \ Main()\n        {\n            Thread t = new Thread(new ThreadStart(SomeThreadMethod));\n\
    \            t.Start();\n            Console.Read();\n        }\n        static\
    \ void SomeThreadMethod()\n        {\n            Console.WriteLine(\"Hello World!\"\
    );\n        }\n    }\n}\n```\n\n这是线程的另一个示例。参考下面的代码：\n\n```csharp\nclass Program\n\
    {\n    static void Main()\n    {\n        Thread t1 = new Thread(Display);\n \
    \       t1.Name = \"Worker Thread\";\n        t1.Start();\n\n        Thread t2\
    \ = new Thread(Display);\n        t2.Start();\n\n        Console.Read();\n   \
    \ }\n\n    static void Display()\n    {\n        for (int i = 1; i <= 10; i++)\n\
    \        {\n            Console.WriteLine(i);\n            Thread.Sleep(100);\n\
    \        }\n    }\n}\n```\n\n## 前台线程和后台线程\n\n线程可以是前台的或后台的。你创建的线程在前台线程，只要它们在运行就会保持应用程序运行。当所有前台线程结束，后台线程会被强制终止，应用程序也会结束。你可以利用\
    \ `IsBackground` 属性检查线程是前台线程还是后台线程。下面的代码片段说明了如何实现这一功能：\n\n```csharp\nclass Program\n\
    {\n    static void Main()\n    {\n        Thread t = new Thread(Display);\n  \
    \      t.Name = \"Worker Thread\";\n        if(t.IsBackground)\n        {\n  \
    \          Console.WriteLine(\"这是一个后台线程.\");\n        }\n        else\n      \
    \  {\n            Console.WriteLine(\"这是一个前台线程。\");\n        }\n    }\n}\n```\n\
    \n线程可以在前台运行也可以在后台运行。前台线程防止应用程序终止。你可以使用 `Thread` 类的 `IsBackground` 属性显式设置线程的状态，即指定线程应该在前台运行还是后台运行。这是一个说明此点的示例：\n\
    \n```csharp\nstatic void Main()\n{\n    Thread thread = new Thread(new ThreadStart(SomeThreadMethod));\n\
    \    thread.Start();\n    thread.IsBackground = true;\n    Console.WriteLine(\"\
    Thread status: \"+t.IsBackground.ToString());\n    Console.Read();\n}\n```\n\n"
