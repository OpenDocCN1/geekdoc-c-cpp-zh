    # # Common Type System


    The Common Type System (CTS) is a standard that is used to define how the .NET
    types are represented in the memory. The CTS enables multiple languages targeted
    at the .NET Framework to co-exist. It provides support for two types, which are
    explained intrat the next section.


    # # Value types and reference types


    The CTS provides support for two types. These include: value types and reference
    types. While value types are stored in the stack, reference types are stored in
    the managed heap. The primitive data types, such as char, int, and etc, are examples
    of value types. Other examples of value types include: struct and enum. Refer
    to Figure 1.5 for better understanding:


    ![](img/13229b4b9ff377325da8c3d3e8c64024_26_0.png)


    > Figure 1.5: Common Type System


    Here''s the list of value types in .NET:


