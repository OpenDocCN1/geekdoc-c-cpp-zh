    \    get;\n    set;\n  }\n}\n\nclass DerivedClass : BaseClass\n{\n  public override\
    \ int this[int index]\n  {\n    get\n    {\n      return numbers[index];\n   \
    \ }\n    set\n    {\n      numbers[index] = value;\n    }\n  }\n}\n```\n\n## 多维索引器\n\
    \n多维索引器类似于多维数组。在声明索引器时，你需要在参数列表中传递两个参数。你应该使用整数下标来访问多维索引器的元素。\n\n接下方提供的代码段说明了如何在\
