    \ Language Runtime (CLR) and is the process of converting an object's state into\
    \ a stream of bytes so it can be transmitted over the network or stored in a persistent\
    \ storage. De-serialization is the reverse of serialization and is the process\
    \ that is used to reconstruct the object from the serialized data. You can take\
    \ advantage of serialization to pass data across process boundaries."
