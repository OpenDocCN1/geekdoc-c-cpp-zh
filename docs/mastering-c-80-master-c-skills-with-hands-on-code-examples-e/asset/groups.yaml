    # The Microsoft .NET Ecosystem 11


    It should be noted that the GC works much more frequently in the lower generations
    than in the higher ones. The objects that survive GC cleanup in generation 1 are
    promoted to generation 2. While the objects residing in generation 0 are called
    short-lived objects, the objects in generation 2 are considered old objects.


    Objects that reside in the Loh do not pass through the generations, that is, generation
    0, 1, or 2. The Loh is a special area in the managed memory that is reserved for
    storing objects larger than the size of 85KB.


    The System.GC class represents the GC in .NET. This class contains several methods
    and properties. Some of the important members of this class include:


    +   - GC.Collect: This method is used to force a garbage collection of one or
    more generations. If you pass the generation number to be collected, it would
    collect that generation only. If no generation number is passed to this method
    as an argument, all generations are collected.

    - GC.GetTotalMemory: This method returns the total number of bytes that have been
    allocated to the managed memory.

    - GC.KeepAlive: This method is used to extend the lifetime of an object.

    - GC.SupressFinalize: This method is used to suppress the finalization of an object
    that is passed to it as a parameter.

    - GC.GetGeneration: This method accepts a reference of an object and returns the
    generation that the object is in.

    - GC.MaxGeneration: This method is used to return the maximum number of generations
    that are supported in the version of CLR installed.


    # Security


    Security is an important aspect in any application and it is all about protecting
    the assets in an application from unauthorized users. Basically, .NET supports
    two types of security. These include:


    +   - Role-based security

    - Code access security'
