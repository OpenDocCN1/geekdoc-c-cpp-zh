    \        {\n            return data[row, column];\n        }\n\n        set\n\
    \        {\n            data[row, column] = value;\n        }\n    }\n```\n\n\
    你可以像下面的代码段所示为多维索引器赋值数据：\n\nMultidimensionalIndexer multiIndexer = new MultidimensionalIndexer();\n\
