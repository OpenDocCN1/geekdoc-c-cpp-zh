    # CHAPTER 14

    New Features

    in C# 8.0


    As of writing, the latest version of C# programming language is 8. C# 8 has many
    new exciting features that would change the way you write code. In this chapter,
    we''ll examine some of the important new features of C# 8.


    # Structure


    In this chapter, we will discuss the following points:


    +   * Default interface members

    * Nullable reference types

    * Readonly members

    * Static local functions

    * Asynchronous streams

    * Pattern matching enhancements

    * Using declarations

    * Record types

    * Disposable ref structs'
  - '[PAGE 297]


    # Objective


    After reading this chapter, the reader will be able to learn the new features
    of C# 8.0. This includes default interface members, nullable reference types,
    readonly members, pattern matching enhancements, static locals, asynchronous streams,
    using declarations, disposable ref structs, and record types. You will also learn
    how to apply these new features in C# 8.


    # Getting started


    As of this writing, .NET Core 3.0 has just been released. To work with C# 8 you
    should have .NET Core 3.0 installed on his or her system. Assuming that you have
    .NET Core 3.0 installed on your system, you can work with C# 8 in Visual Studio
    2019 as well. However, it must be enabled. To enable C# 8 in Visual Studio 2019,
    follow the following steps:


    +   1. Download and install .NET Core 3.0 SDK (it is now in its preview stage)
    from here: https://dotnet.microsoft.com/download/dotnet-core/3.0

    2. Next, download and install ASP.NET Core runtime (so that you can use C# 8 in
    ASP.NET Core as well)

    3. Create a new .NET Console Application project. Ensure that the .NET Core version
    3.0 is used to create the project.(Refer to Chapter 15, Getting Started with Visual
    Studio 2019 of this book to know how you can do this.)

    4. Click on Tools | Options | Project and Solutions.

    5. Locate .NET Core and check the previews of the .NET Core SDK checkbox as shown
    in Figure 14.1.


