    \ void SetValues(double basic, double allowance)\n    {\n        this.basic =\
    \ basic;\n        this.allowance = allowance;\n    }\n\n    protected internal\
    \ void DisplaySalary()\n    {\n        Console.WriteLine(\"The salary is: \" +\
    \ (basic + allowance));\n    }\n}\n```\n\nThe SalesEmployee class extends the\
    \ Employee class as shown in the following code snippet:\n\n```csharp\nclass SalesEmployee\
    \ : Employee\n{\n    public void Initialize(double basic, double allowance)\n\
    \    {\n        this.SetValues(basic, allowance);\n    }\n\n    public void Display()\n\
    \    {\n        this.DisplaySalary();\n    }\n\n    //Other members\n}\n```\n\n\
    The SalesEmployee class contains two methods, namely Initialize and Display. While\
    \ the former calls the SetValues method of the base class, the latter calls the\
    \ DisplaySalary method of the base class internally.\n\nYou can now create an\
    \ instance of the SalesEmployee class and call the Initialize and Display methods\
    \ as shown in the below code snippet:\n\n```csharp\nSalesEmployee employee = new\
    \ SalesEmployee();\nemployee.Initialize(1000, 200);\nemployee.Display();\n```\n\
    \nIt should be noted that if the SalesEmployee class is in another assembly, you\
    \ can not access the protected internal members of the Employee class.\n\n## Access\
    \ modifier “private protected”\n\nIf a member of a class is declared using the\
    \ private protected modifier, access to the member is limited to the containing\
    \ class or classes that are derived from the containing class but in the same\
    \ assembly only. The private protected access modifier is available since C# 7.2.\n\
    \n## Abstraction\n\nAbstraction has been defined by Richard Gabriel as the process\
    \ of identifying common patterns that have systematic variations; an abstraction\
    \ represents the common pattern and provides a means for specifying which variation\
    \ to use. Abstraction is the process of hiding the non-essential details of an\
    \ object, abstraction is the mechanism that is used to show only the relevant\
    \ details of an object to the user. Encapsulation is used to bind the members\
    \ of a class (that is, the data and methods) inside a single unit to disallow\
    \ access to the members directly from outside the unit. Note that abstraction\
    \ in Object-Oriented Analysis and Design (OOAD) has nothing to do with abstract\
    \ classes in C#.\n\nAn example of abstraction is how brakes of a car work. You\
    \ can press the pedals to make it work but you are not aware of how it works internally.\n\
    \nAbstraction and encapsulation are two complementary concepts in OOP's. While\
    \ the former focuses on the observable behavior of an object, encapsulation facilitates\
    \ information hiding so as to conceal the secrets of the object from the external\
    \ world. To be more precise, on the one hand, abstraction is used to show only\
    \ the relevant details and hide the unnecessary details of an object from the\
    \ user. Encapsulation, on the other hand, is used to combine the data and functions\
    \ of an object inside a single unit, resulting in an isolation of the contents\
    \ of the unit from the external world.\n\n## Inheritance\n\nInheritance is the\
    \ ability to create a subclass from an existing class by extending it. The subclass\
    \ is known as the derived class or the child class and the class from which the\
    \ subclass is created, also known as the base class or the parent class. The child\
    \ class reuses, extends, or modifies the behavior of the parent class. Inheritance\
    \ can be of several types. These include:\n\n- Single inheritance\n- Multi-level\
    \ inheritance\n- Multiple inheritance\n- Hierarchical inheritance\n- Hybrid inheritance\n\
    \nC# supports only single and multi-level inheritance.\n\n## Single inheritance\n\
    \nIn single inheritance, a base class is extended by one derived class. This is\
    \ depicted in Figure 4.9:\n\n![](img/13229b4b9ff377325da8c3d3e8c64024_97_0.png)\n\
    \nFigure 4.9: Single inheritance\n\nThe code snippet given below illustrates how\
    \ single inheritance can be implemented:\n\n```csharp\nclass Base\n{\n    //Members\
    \ of the class Base\n}\n\nclass Derived : Base\n{\n    //Members of the class\
    \ Derived\n}\n```\n\n## Multi-level inheritance\n\nIn multi-level inheritance,\
    \ you have inheritance in one than one level, that is, Class A is extended by\
    \ a Class B which in turn is extended by a Class C. This is shown in Figure 4.10:\n\
    \n![](img/13229b4b9ff377325da8c3d3e8c64024_98_0.png)\n\nThe code snippet given\
    \ below illustrates multi-level inheritance:\n\n```csharp\nclass A\n{\n    //Members\
    \ of the class A\n}\n\nclass B : A\n{\n    //Members of the class B\n}\n\nclass\
    \ C : B\n{\n    //Members of the class C\n}\n```\n\nIt should be noted that inheritance\
    \ is supported only by classes; structs don't. However, structs can implement\
    \ interfaces. When a class inherits a base class, it gains all the base class\
    \ except those that are private.\n\n## Multiple inheritance\n\nIn multiple inheritance,\
    \ a derived class extends more than one base class. This is shown in Figure 4.13:\n\
    \n![](img/13229b4b9ff377325da8c3d3e8c64024_99_0.png)\n\nFigure 4.11: Multiple\
    \ inheritance\n\n## Hierarchical inheritance\n\nIn hierarchical inheritance, a\
    \ base class can have more than one subclass, that is, multiple subclasses have\
    \ the same base class. This is depicted in Figure 4.12:\n\nObject-Oriented Programming\
    \ – Part 2 81\n\n![](img/13229b4b9ff377325da8c3d3e8c64024_100_0.png)\n\nFigure\
    \ 4.12: Hierarchical inheritance\n\n## Hybrid inheritance\n\nHybrid inheritance\
    \ combines multiple and multi-level inheritance. This is shown in Figure 4.13:\n\
    \n![](img/13229b4b9ff377325da8c3d3e8c64024_100_1.png)\n\nFigure 4.13: Hybrid inheritance\n\
    \n## Rules of inheritance\n\nHere's a quick glance at the basic rules of inheritance:\n\
    \n- An abstract class can be extended but not instantiated.\n- All public members\
    \ of a class can be accessed from outside the class.\n- All non-private members\
    \ of a class can be inherited to its child class.\n- While inheriting a base class,\
    \ you can specify the visibility level as well.\n- Visibility levels are used\
    \ to denote how much of the class is available from the external world, or can\
    \ be extended.\n- If a class extends a base class with the visibility mode as\
    \ public, all public members of the base class become public members of the derived\
    \ class and all protected members of the base class become protected members of\
    \ the derived class.\n- If a class extends a base class with the visibility mode\
    \ as protected, all public and protected members of the base class become protected\
    \ members of the derived class.\n- If a class extends a base class with the visibility\
    \ mode as private, all public and protected members of the base class become private\
    \ members of the derived class.\n- Private members of a class are not inherited\n\
    - Derived classes cannot have more accessibility than their base types.\n\n##\
    \ Conclusion\n\nIn this chapter, we learned about the concepts of OOP, such as\
    \ association, aggregation, composition, polymorphism, abstraction, generalization\
    \ and inheritance, with relevant code examples. In the next chapter, we'll explore\
    \ the properties and indexers in C#.\n\n## Questions\n\n1. What is association?\
    \ What is bidirectional association?\n2. What is the difference between aggregation\
    \ and composition?\n3. What are the UML notations for association, aggregation,\
    \ and composition?\n4. Explain generalization with an example.\n5. What is the\
    \ access specifier internal used for?\n"
  mdcn: "\n\n# 面向对象编程 – 第2部分 75\n\n```c\nEmployee employee = new Employee();\nemployee.basic\
    \ = 1000;\nemployee.allowance = 200;\n```\n\n注意，这两个数据成员的访问权限仅限于当前程序集（assembly），也就是说你无法从另一个程序集访问它们。\n\
    \n## 访问修饰符 \"protected internal\"\n\n如果类的成员使用 `protected internal` 访问限定符声明，则该成员的访问被限于包含它的类、程序集以及声明该成员类的派生类。\n\
    \n提供的代码段展示了一个名为 `Employee` 的类，它具有 `protected internal` 成员——它有两个方法——每个方法都标记了 `protected\
    \ internal` 关键字。\n\n```c\nclass Employee\n{\n    internal double basic;\n    internal\
    \ double allowance;\n\n    protected internal void SetValues(double basic, double\
    \ allowance)\n    {\n        this.basic = basic;\n        this.allowance = allowance;\n\
    \    }\n\n    protected internal void DisplaySalary()\n    {\n        Console.WriteLine(\"\
    The salary is: \" + (basic + allowance));\n    }\n}\n```\n\n`SalesEmployee` 类如下面的代码所示扩展了\
    \ `Employee` 类：\n\n```csharp\nclass SalesEmployee : Employee\n{\n    public void\
    \ Initialize(double basic, double allowance)\n    {\n        this.SetValues(basic,\
    \ allowance);\n    }\n\n    public void Display()\n    {\n        this.DisplaySalary();\n\
    \    }\n\n    //Other members\n}\n```\n\n`SalesEmployee` 类包含两个方法，即 `Initialize`\
    \ 和 `Display`。前者调用了基类的 `SetValues` 方法，后者在内部调用了基类的 `DisplaySalary` 方法。\n\n你现在可以创建一个\
    \ `SalesEmployee` 类的实例，并如下面的代码所示调用 `Initialize` 和 `Display` 方法：\n\n```csharp\n\
    SalesEmployee employee = new SalesEmployee();\nemployee.Initialize(1000, 200);\n\
    employee.Display();\n```\n\n需要注意的是，如果 `SalesEmployee` 类在另一个程序集中，则你将无法访问 `Employee`\
    \ 类的 `protected internal` 成员。\n\n## 访问修饰符 “private protected”\n\n如果类的成员使用 `private\
    \ protected` 修饰符声明，则对成员的访问仅限于包含它的类或同一程序集内派自该类的类。`private protected` 访问修饰符自 C#\
    \ 7.2 起可用。\n\n## 抽象\n\n抽象由 Richard Gabriel 定义为识别具有系统性变化的共同模式的过程；抽象代表这种共同模式，并提供了一种指定使用何种变体的方法。抽象是隐藏对象非本质细节的过程，抽象是用于向用户显示对象相关细节的机制。封装用于将类的成员（即数据和方法）绑定在单个单元内部，以不允许从单元外部直接访问这些成员。注意，面向对象分析与设计\
    \ (OOAD) 中的抽象与 C# 中的抽象类无关。\n\n抽象的一个例子是汽车刹车的工作原理。你可以踩踏板使其工作，但你并不知道它内部是如何运作的。\n\n\
    抽象和封装是面向对象编程（OOP）中两个互补的概念。前者关注对象的可观测行为，而封装则促进了信息隐藏，从而向外部世界隐藏对象的秘密。更准确地说，一方面，抽象用于向用户显示对象的相关细节并隐藏其不必要的细节；另一方面，封装用于将对象的数据和函数组合在单个单元内部，导致单元的内容与外部世界隔离。\n\
    \n## 继承\n\n继承是通过扩展现有类来创建子类的能力。子类被称为派生类或子类，而创建子类的类也称为基类或父类。子类重用、扩展或修改父类的行为。继承可以有几种类型，包括：\n\
    \n- 单级继承\n- 多级继承\n- 多重继承\n- 层次继承\n- 混合继承\n\nC# 只支持单级和多级继承。\n\n## 单级继承\n\n在单级继承中，一个基类被一个派生类扩展。这如图\
    \ 4.9 所示：\n\n![](img/13229b4b9ff377325da8c3d3e8c64024_97_0.png)\n\n图 4.9：单级继承\n\
    \n提供的代码段展示了如何实现单级继承：\n\n```csharp\nclass Base\n{\n    //Base 类的成员\n}\n\nclass\
    \ Derived : Base\n{\n    //Derived 类的成员\n}\n```\n\n## 多级继承继承\n\n在多级继承中，你拥有一个以上层级的继承，即类\
    \ A 被类 B 扩展，而类 B 又被类 C 扩展。这如图 4.10 所示：\n\n![](img/13229b4b9ff377325da8c3d3e8c64024_98_0.png)\n\
    \n提供的代码段展示了多级继承：\n\n```csharp\nclass A\n{\n    //A 类的成员\n}\n\nclass B : A\n{\n\
    \    //B 类的成员\n}\n\nclass C : B\n{\n    //C 类的成员\n}\n```\n\n需要注意的是，继承仅支持类；结构体（structs）不支持。然而，结构体可以实现接口。当类继承基类时，它获得了基类的所有成员，私有成员除外。\n\
    \n## 多重继承\n\n多重继承中，派生类扩展了多个基类。这如图 4.13 所示：\n\n![](img/13229b4b9ff377325da8c3d3e8c64024_99_0.png)\n\
    \n图 4.11：多重继承\n\n## 层次继承\n\n在层次继承中，一个基类可以有多个子类，即多个子类具有同一个基类。这如图 4.12 所示：\n\n面向对象编程\
    \ – 第2部分 81\n\n![](img/13229b4b9ff377325da8c3d3e8c64024_100_0.png)\n\n图 4.12：层次继承\n\
    \n## 混合继承\n\n混合继承结合了多重继承和多级继承。这如图 4.13 所示：\n\n![](img/13229b4b9ff377325da8c3d3e8c64024_100_1.png)\n\
    \n图 4.13：混合继承\n\n## 继承规则\n\n这里快速概览继承的基本规则：\n\n- 抽象类可以扩展但不能实例化。\n- 类的所有公共成员都可以从类外部访问。\n\
    - 类的所有非私有成员都可以继承到其子类中。\n- 在继承基类时，你也可以指定可见性级别。\n- 可见性级别用于表示从外部世界可以获取或扩展类的类的部分的程度。\n\
    - 如果一个类以 public 可见性模式扩展基类，基类的所有公共成员将成为派生类的公共成员，基类的所有受保护成员将成为派生类的保护成员。\n- 如果一个类以\
    \ protected 可见性模式扩展基类，基类的所有公共和保护成员将成为派生类的保护成员。\n- 如果一个类以 private 可见性模式扩展基类，基类的所有公共和保护成员将成为派生类的私有成员。\n\
    - 类的私有成员不被继承。\n- 派生类的访问权限不能高于其基类型。\n\n## 总结\n\n在本章中，我们学习了 OOP 的概念，如关联、聚合、组合、多态、抽象、泛化和继承，以及相关的代码示例。在下一章中，我们将探索\
    \ C# 中的属性和索引器。\n\n## 问题\n\n1. 什么是关联？什么是双向关联？\n2. 聚合和组合有什么区别？\n3. 关联、聚合和组合的 UML\
    \ 符号是什么？\n4. 请举例说明泛化。\n5. 访问限定符 internal 用于什么？\n\n"
