    \ author = new Author();\n    try\n    {\n        serializer = new XmlSerializer(typeof(Author));\n\
    \        stream = new FileStream(filename, FileMode.Open);\n        return (Author)serializer.Deserialize(stream);\n\
    \    }\n    finally\n    {\n        if (stream != null)\n            stream.Close();\n\
    \    }\n}\n```\n\n# Figure 12.8 shows complete code listing for your reference:\n\
