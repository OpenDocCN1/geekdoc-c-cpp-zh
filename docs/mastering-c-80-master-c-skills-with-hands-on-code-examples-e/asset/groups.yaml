  mdcn: "\n\n# C# 中的异步与并行编程\n\n异步可以提高可扩展性。然而，你应该注意使用异步编程的最佳实践。\n\n## 避免使用 async void\
    \ 方法\n\n异步方法可以返回 `Task`、`Task<T>` 和 `void`。除非在编写异步事件处理程序，否则你不应该使用 `async void`\
