    \n```csharp\nvar data = from a in authors.AsParallel() where a.FirstName.StartsWith(\"\
    J\") select a;\n```\n\n注意，`AsParallel` 是 `System.Linq.ParallelEnumerable` 类的一部分提供的可用扩展方法。\n\
