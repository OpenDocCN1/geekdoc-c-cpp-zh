    ## 精通 C# 8.0


    - 通用类型系统 (Common Type System)

    - 通用中间语言 (Common Intermediate Language)

    - Microsoft .NET Framework 的组件

    - 垃圾回收 (Garbage collection)

    - 动态语言运行时 (Dynamic Language Runtime)


    ## 目标


    阅读完本章后，读者将能够：


    - 理解 .NET Framework 的组件

    - 学习 .NET 中的垃圾回收器如何工作

    - 理解为什么需要通用中间语言

    - 理解动态语言运行时


    ## Microsoft .NET 简介


    .NET Framework 是由微软创建的一种流行的软件开发平台。它已经存在了很久，可以用于构建 Windows 应用程序、Web 服务端以及基于 Web
    的应用程序。.NET Framework 主要运行在 Windows 上。然而，如果你还需要在 Linux 或 Mac 上构建并运行你的应用程序，你可以使用
    .NET Core，它是一个轻量级框架。.NET Core 是一个适用于 Windows、Linux 和 macOS 操作系统的免费、模块化、开源框架。它是
    .NET Framework 的平台无关的继承者，根据 MIT 许可证发布。


    .NET Framework 提供了以下优势：


    - 可移植性

    - 跨语言集成

    - 互操作性

    - 基类库

    - 安全性


