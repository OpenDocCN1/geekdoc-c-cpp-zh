    \n图 9.6\n\n## 最佳实践\n\n本节讨论了在 C# 中处理异常时应遵循的推荐做法。\n\n只有在需要时才应该使用异常。你不应该在代码中“吞掉”（swallow）异常。相反，你只需要使用\
