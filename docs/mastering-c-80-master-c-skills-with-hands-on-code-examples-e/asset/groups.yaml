    # Mastering C# 8.0


    Figure 1.9 illustrates the types of security:


    ![](img/13229b4b9ff377325da8c3d3e8c64024_31_0.png)


    Figure 1.9: Security in .NET


    # Role-based security


    Role-based security is a security mechanism that provides access to resources
    in an application to an authenticated user based on his or her access permissions.
    To enforce security in .NET application, you need to authenticate the user and
    authorize access to the resources that the user has access to. In other words,
    authentication and authorization are the key concepts as far as implementing security
    in .NET applications is concerned.


    Enforcing role-based security in .NET applications is quite easy. Support for
    role-based security in .NET is flexible and extensible as well. To ensure consistency
    with code access security, role-based security in .NET includes the System.Security.Permissions.PrincipalPermission
    objects that can be taken advantage of to perform authorization the same way you
    do with code access security.


    # Code access security


    Code access security (CAS) is a sandbox for .NET. It is a security mechanism that
    is used by the CLR to restrict untrusted code from performing privileged actions.
    Note that CAS can only be applied to managed applications. Unmanaged applications
    as the name suggests run out of the CLR''s context and hence there are no CAS
    restrictions. The only restriction that is applicable to managed applications
    is the operating system''s role-based security. The components of CAS include:
    code group, evidence, and permissions.'
