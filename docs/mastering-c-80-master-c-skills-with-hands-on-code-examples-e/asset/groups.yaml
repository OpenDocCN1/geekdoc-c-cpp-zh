    # Objective


    After reading this chapter, the reader will be able to:


    +   - Understand the basics of OOP

    - Understand how to work with constructors and destructors

    - Understand constructor overloading and constructor chaining

    - Execution order of constructors and destructors in inheritance


    # Object-oriented programming (OOP)


    Object-oriented programming(OOP) is a programming paradigm that focuses on objects
    and data in lieu of actions and logic. OOP replaced the traditional structured
    programming methodology and took the programming fraternity by storm decades ago—in
    the early 1960s. The first OOP language was Simula. Later many other languages
    (C++, Java, Smalltalk, C#, and more) followed. A good understanding of classes,
    objects, constructors, and destructors is imperative for learning OOP in C#.


    OOP provides the following benefits:


    +   - Reusability

    - Easier maintainability

    - Data hiding

    - Better analysis and design of complex system


    In this chapter, we will learn the basics of OOP, that is, classes and objects.
    We will learn more about OOP in the next chapter.


    # Classes and objects


    The world is made up of many objects. Any tangible entity is an object—the car,
    the table, the chair, and more. You can use classes and objects to model real-life
    entities. A class is defined as the blueprint on which an object is created. It
    combines member data and member functions into a single unit. When you create
    a class, you need to define the members of it. Members of a class are basically
    of two types, namely: member data or data members; and methods or functions within
    a class. While the data members contain data, the methods contain code.


    Objects are instances of a class. An object comprises the following:


    +   - State: This is represented by the properties and attributes of the object.

    - Behavior: This is represented by the member functions or methods pertaining
    to an object.

    - Identity: This is represented by a unique name given to an object.'
