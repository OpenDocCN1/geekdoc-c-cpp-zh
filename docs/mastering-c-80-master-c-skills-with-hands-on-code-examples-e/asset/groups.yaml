    # Thread synchronization


    Thread synchronization is a concept that ensures that only one thread can access
    a shared resource at a given point of time. No other thread can access the resource
    till the time the thread relinquishes control of the shared resource.


    Synchronization constructs belong to one of the following categories:


    +   - Locking constructs like Mutex, lock, SpinLock

    - Blocking methods like Sleep, Join, and many more

    - Signaling constructs like Wait and Pulse methods of the Monitor class

    - Non-blocking synchronization constructs like Thread.Memorybarrier, Thread.VolatileRead,
    Thread.VolatileWrite and the Interlocked class


    In the example on the ThreadSafe class given below in this section, we will implement
    synchronization using the lock keyword and also by a Mutex. A Mutex is similar
    to lock but it can work across multiple processes. We''ll now examine'
