- md: "\n# Static constructors or class constructors\n\nConstructors can be static\
    \ as well. Unlike an instance constructor, a static constructor is invoked only\
    \ once during the application's life cycle. Consider the following class that\
    \ contains a static constructor. Refer to the code snippet given below:\n\n```\n\
    class MyClass\n{\n    public static int x;\n    public static int y;\n\n    static\
    \ MyClass()\n    {\n        x = 0;\n        y = 0;\n    }\n}\n```\n\nNote the\
    \ usage of the static keyword when declaring the variables x and y. A static constructor\
    \ can only access static members. The reason is that static members of a class\
    \ are loaded before the instance members in the memory. The code snippet below\
    \ illustrates how the values of the static members of the class MyClass can be\
    \ printed in the console. Note the usage of the class name when referring to the\
    \ static members x and y:\n\n```\nclass Program\n{\n    static void Main(string[]\
    \ args)\n    {\n        MyClass myClass = new MyClass();\n        Console.WriteLine(\"\
    x = \" + MyClass.x);\n        Console.WriteLine(\"y = \" + MyClass.y);\n     \
    \   Console.Read();\n    }\n}\n```\n\nA static constructor is invoked before an\
    \ instance constructor. The code snippet given below illustrates this:\n\n```\n\
    class MyClass\n{\n    static MyClass()\n    {\n        Console.WriteLine(\"Static\
    \ constructor\");\n    }\n    public MyClass()\n    {\n        Console.WriteLine(\"\
    Default constructor\");\n    }\n}\n```\n\n```\nstatic void Main(string[] args)\n\
    {\n    MyClass myClass = new MyClass();\n    Console.Read();\n}\n```\n\nWhen the\
    \ preceding program is executed, the text Static constructor is printed in the\
    \ console followed by Default constructor in the next line.\n\nSimilar to the\
    \ static method, a static constructor of a class can only access static members\
    \ of the class. Consider the piece of code given below, which depicts a class\
    \ having two instance members:\n\n```\nclass MyClass\n{\n    public int x;\n \
    \   public int y;\n\n    static MyClass()\n{\n    x = 0;\n    y = 0;\n}\n```\n\
    \nThe preceding code will not compile since inside the static constructor of the\
    \ class MyClass the instance members x and y cannot be accessed.\n\nAnother point\
    \ to note here is that a static constructor is called only once during the life\
    \ time of the program or the application domain. Let's understand this with an\
    \ example. Consider the piece of code given below, which shows a static class\
    \ with two static properties:\n\n```\nclass MyStaticClass\n{\n    public static\
    \ string EditText { get; set; }\n    static MyStaticClass()\n    {\n        Console.WriteLine(\"\
    Static Constructor executed.\");\n    }\n    public static int MyInteger\n   \
    \ {\n        get;set;\n    }\n}\n```\n\nYou can access the static properties of\
    \ this class using the piece of code mentioned below:\n\n```\nstatic void Main(string[]\
    \ args)\n{\n    MyStaticClass.MyText = \"Hello World\";\n    MyStaticClass.MyInteger\
    \ = 10;\n    Console.Read();\n}\n```\n\n# Object-Oriented Programming- Part 1\
    \ 49\n\nWhen you run this program, a message will be displayed in the console\
    \ as follows:\nStatic Constructor executed.\n\nThe reason is that even if two\
    \ static properties have been accessed in the Main method as shown in the code\
    \ snippet above, the static constructor is called only once. Note that if you\
    \ have a static constructor in a class, but you have only instance members, the\
    \ static constructor will be called only once when the class is instantiated.\
    \ Consider the class MyClass given below:\n\n```\nclass MyClass\n{\n  static MyClass()\n\
    {\n    Console.WriteLine(\"Static Constructor executed.\");\n  }\n}\n```\n\nYou\
    \ can create instances of this class as shown in the code snippet given below:\n\
    ```\nstatic void Main(string[] args)\n{\n  MyClass myClass1 = new MyClass();\n\
    \  MyClass myClass2 = new MyClass();\n  Console.Read();\n}\n```\n\nWhen you run\
    \ this program, a message will be displayed in the console since the static constructor\
    \ was called only once irrespective of the number of instances created for the\
    \ class: The message will be:\n\nStatic Constructor executed.\n\n# Constructor\
    \ overloading\n\nA constructor can accept one or more parameters. Parameters of\
    \ a constructor can be written the same way they are for methods. A constructor\
    \ that doesn't accept any parameter is the default constructor. You can have multiple\
    \ constructors in a class, each differing in their signatures. These are called\
    \ overloaded constructors. Overloaded constructors enable the members of a class\
    \ to be initialized in multiple ways.\n\n# Mastering C# 8.0\n\nIt should be noted\
    \ that overloaded constructors should differ in the method signature (type and\
    \ order of parameters). Constructors cannot be overloaded by just differing in\
    \ access specifiers.\n\nThe code snippet given below illustrates constructor overloading:\n\
    \n```\nclass MyClass\n{\n    public MyClass()\n    {\n        //Default constructor\n\
    \    }\n    public MyClass(int x)\n    {\n        //Constructor with one parameter\n\
    \    }\n    public MyClass(int x, int y)\n    {\n        //Constructor with two\
    \ parameters\n    }\n}\n```\n\nThere are three constructors in the class `MyClass`.\
    \ One of them is the default constructor. The other two constructors are parameterized\
    \ constructors, but they differ in their signatures.\n\n# Constructor chaining\n\
    \nThis refers to the ability to call one constructor from another. If a child\
    \ class constructor needs to call a base class constructor, base (parameters)\
    \ must be used. If the call to another constructor is in the same class, this\
    \ (parameters) is used. It should be noted that constructor chaining is supported\
    \ only by non-static constructors of a class. The code snippet given below illustrates\
    \ how constructors of a class can be chained:\n\n```\npublic class Base\n{\n \
    \   public Base(int x)\n    {\n      //Default constructor\n    }\n}\n\nclass\
    \ Derived: Base\n{\n  public Derived() : base(0)\n  {\n    //Default constructor\n\
    \  }\n  public Derived(int x):base(x)\n  {\n    //Constructor with one parameter.\n\
    \  }\n  public Derived(int x, int y):this(x)\n  {\n    //Constructor with two\
    \ parameters.\n  }\n}\n```\n\nThe Base class contains an argument constructor\
    \ and there is no default constructor. Note that if you explicitly write a constructor\
    \ for a class, you should also write the default constructor for the class if\
    \ you need one. In the code snippet shown above, the default constructor of the\
    \ Derived class makes a call to the parameterized constructor of the Base class\
    \ and passes a default value as there is no default constructor in the Base class.\n\
    \n# Access specifiers or modifiers\n\nConstructors can have modifiers or access\
    \ specifiers. The modifiers that can be used on a constructor are: public, protected,\
    \ internal, private, or extern. The public modifier is applied on a constructor\
    \ to allow it to be called automatically when an instance of the class is created.\
    \ The default constructor of a class is public. The code snippet given below illustrates\
    \ how you can write an explicit default constructor for a class:\n\n```\nclass\
    \ MyClass\n{\n    public MyClass()\n    {\n        Console.WriteLine(\"Default\
    \ constructor\");\n    }\n}\n```\n\nA private constructor for a class is used\
    \ to prevent the class from being extended or inherited and even instantiated.\
    \ So, if you have a private constructor in a class, you can neither create an\
    \ instance of the class, nor can you extend the class. Refer to the code snippet\
    \ given below:\n\n```\npublic class MyClass\n{\n    private MyClass()\n    {\n\
    \        //This is a private constructor.\n    }\n}\n```\n\nSince you have a private\
    \ constructor in the class MyClass, you cannot create an instance of this class\
    \ or subclass it.\n\nA protected constructor in a class allows the class to be\
    \ inherited but not instantiated. The code snippet mentioned below illustrates\
    \ how a protected constructor is used:\n\n```\npublic class Base\n{\n    protected\
    \ Base()\n    {\n        Console.WriteLine(\"Protected constructor in the Base\
    \ class called.\");\n    }\n}\n\npublic class Derived : Base\n{\n  public Derived()\n\
    \  {\n    Console.WriteLine(\"Default constructor in the Derived class called.\"\
    );\n  }\n}\n```\n\nNote the protected constructor in the class named Base. You\
    \ can create an instance of the Derived class using the following statement:\n\
    \n```\nDerived derived = new Derived();\n```\n\nWhen this code is executed, here's\
    \ how the output would look like:\n\n![](img/13229b4b9ff377325da83d3e8c64024_72_0.png)\n\
    \nFigure 3.3\n\nYou can use the internal access specifier for a constructor to\
    \ limit assessing the class from outside the assembly. In essence, you can mark\
    \ a constructor of a class with the internal access specifier if you want the\
    \ class to be visible, but subclassed only within the assembly in which it is\
    \ defined.\n\nYou can also specify the extern modifier in a constructor declaration.\
    \ A constructor that is marked with the extern access specifier doesn't contain\
    \ any implementation. Here's an example that illustrates this:\n\n```\npublic\
    \ class MyClass\n{\n  extern MyClass();\n}\n```\n\n# Constructors and inheritance\n\
    \nConstructors are not inherited from the base class to any of its derived classes.\
    \ However, the order of execution of constructors is to be noted in inheritance.\n"
