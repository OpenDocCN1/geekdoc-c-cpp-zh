    \ 11.6 所示：\n\n![](img/13229b4b9ff377325da8c3d3e8c64024_241_0.png)\n\n图 11.6\n\n\
    # 线程池\n\n线程池由一组工作线程和 IO 线程组成集合。它可以被定义为一组在被请求时准备好执行指令的线程池。你可以利用线程池按需要（即按需）创建和使用线程。线程池减少了应用程序线程的数量和线程管理的复杂性。使用线程池可以减少或消除每次应用程序需要线程时创建线程的开销。需要注意的是，线程池以非确定性的方式工作，也就是说，你无法控制提交到线程池的线程将何时执行。图\
    \ 11.6 显示了一个包含工作线程和异步线程的线程池：\n\n![](img/13229b4b9ff377325da8c3d3e8c64024_241_1.png)\n\
    \n图 11.7\n\n# C# 中的多线程\n\n要在 .NET 中与线程池一起工作，你应该利用作为 `System.Threading` 命名空间组成部分可用的\
    \ `ThreadPool` 类。你可以通过多种方式创建线程池。这些包括以下方式：\n\n- 使用任务并行库 (task parallel library)\n\
    - 使用 `BackgroundWorker`\n- 使用 `ThreadPool.QueueUserWorkItem`\n- 使用异步委托\n\n下面的代码段展示了如何设置\
    \ `ThreadPool` 中的最小线程线程数：\n\n```csharp\nThreadPool.MinThreads(25, 25);\n```\n\n\
    虽然 `SetMinThreads` 的第一个参数是最小工作线程数，但第二个参数用于设置最小的 IO 完成线程数。你也可以使用 `ThreadPool.SetMax`\
    \ 方法设置线程池中的最大线程数。\n\n你可以像下面的代码段所示，使用 `ThreadPool` 类的静态方法 `GetMinThreads` 获取可用工作线程和可用异步线程的数量：\n\
    \n```csharp\nint availableWorkerThreads = 0;\nint availableAsyncThreads = 0;\n\
    \nThreadPool.GetMinThreads(out availableWorkerThreads, out availableAsyncThreads);\n\
    ```\n\n# 线程同步\n\n线程同步是一个确保在特定时刻只有一个线程可以访问共享资源的概念。在线程释放对共享资源的控制权之前，没有其他线程可以访问该资源。\n\
    \n同步属于以下类别：\n- 锁结构，如 `Mutex`、`SpinLock`\n- 阻塞结构，如 `Sleep`、`Join`\n- 信号结构，如 `Wait`、`Pulse`\n\
    \n在本节中，我们现在将如何使用 `lock` 关键字来实现同步。下面的代码段展示了一个非线程安全的类：\n\n```csharp\nclass ThreadUnsafe\n\
    {\n    static int i = 10, j = 1;\n\n    public static void Display()\n    {\n\
    \        if (j != 0)\n        {\n            Console.WriteLine(i / j);\n     \
    \       j = 0;\n        }\n    }\n}\n```\n\nC# 中的 `lock` 关键字是 `Monitor.Enter`\
    \ 和 `Monitor.Exit` 方法的快捷方式。这是一个线程安全的版本。注意 `lock` 关键字的使用：\n\n```csharp\nclass ThreadSafe\n\
    {\n    private static readonly object lockObj = new object();\n    static int\
    \ i = 10, j = 1;\n\n    public static void Display()\n    {\n        if (j !=\
    \ 0) \n        {\n            lock (lockObj)\n            {\n                Console.WriteLine(i\
    \ / j);\n                j = 0;\n            }\n        }\n    }\n}\n```\n\n#\
    \ 死锁\n\n当两个线程都尝试访问被另一个线程持有的资源时，就会发生死锁。作为一个例子，假设有两个线程 `threadA` 和 `threadB` 同时执行。假设这些线程按照代码示例所示的方式获取\
    \ `resourceA` 和 `resourceB` 的锁。\n\n由 `threadA` 执行的代码块如下：\n\n```csharp\nlock(resourceA)\n\
    {\n    //Usual code\n    lock(resourceB)\n    {\n        //Some code\n    }\n\
    }\n```\n\n由 `threadB` 执行的代码块如下：\n\n```csharp\nlock(resourceB)\n{\n    //Usual\
    \ code\n    lock(resourceA)\n    {\n        //Some code\n    }\n}\n```\n\n当执行上述代码时，发生以下情况：线程\
    \ `threadA` 获取了 `resourceA` 的锁，而另一个线程 `threadB` 获取了 `resourceB` 的锁。过了一段时间，`threadA`\
    \ 尝试锁定 `resourceB`，但它必须等待 `resourceB` 的锁被释放，反之亦然。结果就是死锁。避免死锁的建议实践按照一致的顺序锁定对象。\n\
    \n# 总结\n\n线程是昂贵的，多线程也是如此。需要注意的是，上下文切换是一个昂贵的过程。只有在你的应用程序需要时才使用线程。本章讨论了 C# 中与线程和多线程相关的概念，并在适当的情况下提供了相关的代码示例。在下一章中，我们将研究我们如何在\
    \ C# 中处理文件。\n\n"
