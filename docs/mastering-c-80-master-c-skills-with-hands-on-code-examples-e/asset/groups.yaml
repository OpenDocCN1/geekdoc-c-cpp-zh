    # Controlling Parallelism


    PLINQ may decide whether a query will perform better when run sequentially. However,
    you may force parallel execution in PLINQ as well. To do this, you should take
    advantage of the WithExecutionMode extension method on a ParallelQuery type instance.
    Here''s an example that illustrates how this can be achieved:


    ```

    var results = from a in authors.AsParallel().WithExecutionMode(ParallelExecutionMode.ForceParallelism)
    where a.FirstName.StartsWith("J") select a;

    ```


    You can also limit the degree of parallelism while using PLINQ. To do this, you
    should take advantage of the WithDegreeOfParallelism extension method. Note that
    setting the degree of parallelism defines the upper limit only. How can you set
    the degree of parallelism in PLINQ is as follows:


    ```

    var results = from a in authors.AsParallel().WithDegreeOfParallelism(3) where
    a.FirstName.StartsWith("J") select a;

    ```


    To create a parallel sequence, you can use the following code. The Range method
    creates a range of integers starting with 1:


