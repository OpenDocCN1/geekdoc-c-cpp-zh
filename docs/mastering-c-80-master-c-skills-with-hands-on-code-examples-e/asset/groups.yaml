- md: "\nBasically, constructors are executed in the order of inheritance. Let's understand\
    \ this with an example. Consider the following two classes, namely Base and Derived:\n\
    \n```csharp\npublic class Base\n{\n  public Base()\n  {\n    Console.WriteLine(\"\
    Base class constructor\");\n  }\n}\npublic class Derived : Base\n{\n  public Derived()\n\
    \  {\n    Console.WriteLine(\"Derived class constructor\");\n  }\n}\n```\n\nNow,\
    \ suppose we instantiate the Derived class as shown in the following code snippet\
    \ given below:\n\n```csharp\nstatic void Main(string[] args)\n{\n  Derived derived\
    \ = new Derived();\n  Console.Read();\n}\n```\n\nWhen this code is executed, the\
    \ text message Base class constructor will be displayed in the console followed\
    \ by the message Derived class constructor. A base class constructor is always\
    \ called before the derived class constructor. The derived class constructor can\
    \ call a base class constructor using constructor chaining. We saw this earlier\
    \ in this chapter. Here's another example of constructor chaining in inherited\
    \ classes:\n\n```csharp\npublic class Base\n{\n  public Base(int x)\n```\n\n```csharp\n\
    {\n  Console.WriteLine(\"Base class constructor\");\n}\n```\n\n```csharp\npublic\
    \ class Derived : Base {\n  public Derived() : base(0) {\n    Console.WriteLine(\"\
    Derived class constructor\");\n  }\n}\n```\n\nIn this example, the Derived class\
    \ has a default constructor. It passes a default value 0 to the parameterized\
    \ constructor of the Base class.\n\n# Destructors\n\nDestructors are methods of\
    \ a class that have the same name as the class name and are prefixed with a ~\
    \ sign. Destructors are automatically called by the runtime when an object of\
    \ the class to which the destructor belongs is destroyed. Note that Destructors\
    \ can only be used with classes, you cannot have a destructor for a struct. Destructors\
    \ are called automatically when the program exits. Destructors cannot be overloaded,\
    \ they can neither accept parameters nor have modifiers. When you define a destructor\
    \ for a class, the destructor implicitly invokes the finalize on the instance.\
    \ However, one point to here is that there is no guarantee that the destructor\
    \ of a class will be called—execution of the destructor of a class depends on\
    \ when an instance of the class becomes eligible for garbage collection. In other\
    \ words, destructors are invoked by the runtime, you don't have any control on\
    \ them.\n\nIt should be noted that while constructors are called in the order\
    \ of inheritance, destructors are called in the reverse order of inheritance.\
    \ Let's understand this with an example. Refer to the code snippet given below:\n\
    \n```csharp\npublic class Base {\n  public Base()\n```\n\n```csharp\n{\nConsole.WriteLine(\"\
    Base class constructor\");\n}\n\n~Base()\n{\n    Console.WriteLine(\"Base class\
    \ destructor\");\n}\n\npublic class Derived : Base\n{\n    public Derived()\n\
    \    {\n        Console.WriteLine(\"Derived class constructor\");\n    }\n   \
    \ ~Derived()\n    {\n        Console.WriteLine(\"Derived class destructor\");\n\
    \    }\n}\n```\n\nYou can create an instance of the Derived class as shown in\
    \ the code snippet given below:\n```csharp\nstatic void Main(string[] args)\n\
    {\n    Derived derived = new Derived();\n    Console.Read();\n}\n```\n\nWhen you\
    \ execute the previous piece of code, here’s how the output would look like:\n\
    Base class constructor\nDerived class constructor\nDerived class destructor\n\
    Base class destructor\n\nSo, while constructors are executed in the order of inheritance,\
    \ destructors are executed in the reverse order of inheritance. Let's understand\
    \ the execution order of constructors and destructors with another example. Consider\
    \ the piece of code given below, which illustrates three classes: class A, class\
    \ B, and class C. The class A is extended by class B and the class C extends class\
    \ B to form a multi-level chain:\n\n```csharp\nclass A\n{\n    public A()\n  \
    \  {\n        System.Console.WriteLine(\"A's constructor is called\");\n    }\n\
    \    ~A()\n    {\n        System.Console.WriteLine(\"A's destructor is called\"\
    );\n    }\n}\n```\n\n```csharp\nclass B : A\n{\n    public B()\n    {\n      \
    \  System.Console.WriteLine(\"B's constructor is called\");\n    }\n    ~B()\n\
    \    {\n        System.Console.WriteLine(\"B's destructor is called\");\n    }\n\
    }\n```\n\n```csharp\nclass C : B\n{\n    public C()\n```\n\n```csharp\n{\n  System.Console.WriteLine(\"\
    C's constructor is called\");\n}\n~C()\n{\n  System.Console.WriteLine(\"C's destructor\
    \ is called\");\n}\n```\n\nThe previous piece of code depicts a multi-level inheritance\
    \ classes. We will learn more about multi-level inheritance in another chapter.\
    \ The code, which can be used to instantiate the class C is as follows:\n\n```csharp\n\
    static void Main(string[] args)\n{\n  C obj = new C();\n}\n```\n\nWhen you execute\
    \ this program, here's how output would look like:\n\nA's constructor is called\n\
    B's constructor is called\nC's constructor is called\nC's destructor is called\n\
    B's destructor is called\nA's destructor is called\n\nAs evident, while the constructors\
    \ are executed in the order of inheritance, the destructors are executed in the\
    \ reverse order of inheritance.\n\n# Constructors in structs\n\nLike classes,\
    \ a struct can also have constructors. However, there are certain limitations.\
    \ As an example, a struct cannot have explicit parameter-less constructor. So,\
    \ the piece of code given below wouldn't compile\n\n```csharp\nstruct MyStruct\n\
    {\n  public MyStruct()\n```\n\n```csharp\n{\n  }\n}\n```\n\n# Object-Oriented\
    \ Programming - Part 2\n\nIn the previous chapter, we learned about Object-Oriented-Programming\
    \ (OOP) and its benefits. We also gained an understanding of classes and objects\
    \ as well as structs. In this chapter, we'll cover the properties of OOP.\n\n\
    ## Structure\n\nIn this chapter, we will discuss the following points:\n\n- Association\n\
    - Aggregation\n- Composition\n- Generalization\n- Dependency\n- Encapsulation\n\
    - Inheritance\n- Polymorphism\n- Abstraction\n\n# Objective\n\nAfter reading this\
    \ chapter, the reader will be able to:\n\n- Understand association.\n- Understand\
    \ the difference between aggregation and composition.\n- Understand generalization\
    \ and inheritance.\n- Learn the types of inheritance and their purpose.\n- Understand\
    \ the difference between encapsulation and abstraction.\n- Understand polymorphism\
    \ and types of polymorphism.\n\n# Association\n\nIn OOP, the terms association,\
    \ aggregation, and composition are used to represent relationships between objects.\
    \ In association, the objects can have their own lifetimes and there is no owner.\
    \ Association represents a using relationship between objects. Association relationship\
    \ can be one-to-one, one-to-many, many-to-one or many-to-many. This is known as\
    \ the cardinality. Association relations can be unidirectional or bidirectional.\
    \ Composition and aggregation are special forms of association.\n\nAn example\
    \ of an association relationship is the relation between a student and a teacher.\
    \ In a relationship between a student and a teacher, there is no owner, and both\
    \ have their own independent lifetimes. To be more precise, when a class has a\
    \ using relationship with another class without any ownership, a relationship\
    \ is termed as association.\n\nThe code snippet given below illustrates a structural\
    \ representation of the association relationship between two classes:\n\n```csharp\n\
    public class Association\n{\n    public void someMethod(SomeClass someObj)\n \
    \   {\n        someObj.DoSomeWork();\n    }\n}\n```\n"
