    in which one of the entities represents the specification (the contract) and the
    other represents the implementation. The UML notation for realization is as shown
    in Figure 4.6.


    ![](img/13229b4b9ff377325da8c3d3e8c64024_85_1.png)


    Figure 4.6


    An example of realization is the relation between an interface or a blueprint
    class (say ILogger) and its implementing class (say a class named Logger).


    # Dependency


    A dependency is defined as a relationship in which one element or a set of elements
    require other elements (that is, they are dependent on other elements) for their
    implementation. The UML notation for dependency is shown in Figure 4.7.'
  - "[PAGE 86]\n\n# Object-Oriented Programming – Part 2 67\n\nFigure 4.7\n\nDependency\
    \ is also known as a using relationship, that is, one class is dependent on another\
    \ class. As an an example, consider the relation between the Customer and Order\
    \ classes. The Order class needs a reference to the Customer class to save order\
    \ data pertaining to a specific customer.\n\n# Polymorphism\n\nPolymorphism is\
    \ one of the core concepts of OOP. The goal of polymorphism is to allow objects\
    \ of different types to be accessed using the same interface. It should be noted\
    \ that each of these types may have its own implementation of the interface. The\
    \ word polymorphism is derived from two Greek words, namely, poly and morphos.\
    \ Poly implies many and morphos mean forms. Hence, polymorphism is the existence\
    \ of the same thing in different forms.\n\nPolymorphism is basically of two types:\n\
    \n+   - Static polymorphism or compile-time polymorphism\n- Dynamic or runtime\
    \ polymorphism\n\n# Static polymorphism or compile-time polymorphism\n\nMethod\
    \ overloading is an example of static polymorphism. In method overloading, you\
    \ will have multiple methods in a class consisting of same name but different\
    \ signatures. The SimpleCalculator class given below demonstrates overloaded methods.\
    \ In this class, the method Add is overloaded.\n\n```\npublic class SimpleCalculator\n\
    {\n    public int Add(int x, int y)\n    {\n        return x + y;\n    }\n   \
    \ public int Add(int x, int y, int z)\n    {\n        return x + y + z;\n    }\n\
    ```"
