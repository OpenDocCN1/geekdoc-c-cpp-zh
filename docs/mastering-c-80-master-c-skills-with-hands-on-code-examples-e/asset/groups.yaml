  mdcn: "\n\n# C# 中的异步与并行编程\n\n是一种能够让你构建具有快速响应用户界面的应用程序的编程范式。\n\n此外，异步编程有助于提高应用程序的响应性和可扩展性。你可以利用异步编程来减少应用程序所需的线程数量。它增加了使用相同资源同时可以处理的请求数量。线程是昂贵的，因为它们消耗大量资源，而且上下文切换是一个资源密集型操作。你可以利用异步编程来避免创建额外的线程并阻塞当前线程。\n\
    \n# Async 和 Await\n\n`async` 关键字用于方法签名中，表示该方法可以使用 `await` 关键字并启用异步功能。换句话说，在方法签名中使用\
    \ `async` 关键字会使方法变为异步方法。异步方法可以使用 `await` 关键字来指示挂起点。注意，如果异步方法没有 `await` 关键字，该方法将以同步方式执行。异步方法的签名中将包含\
    \ `async` 关键字，并具有以下返回类型：void、Task 或 Task<T>。\n\n.NET 中的异步方法可以以下任何一种返回类型：\n\n-\
    \ *Task*: 在工作完成后，它会将控制权返回给调用者。\n- *Task<T>*: 在工作完成后，它向调用者返回一个类型为 T的对象。\n- *void*:\
    \ 用于创建“发后即不管”（fire-and-forget）的方法。\n\n下面的代码片段说明了异步方法的示例。注意方法签名中 `async` 关键字的使用以及方法体内部\
    \ `await` 关键字的使用。\n\n```csharp\npublic async Task<string> DownloadString(String\
    \ url)\n{\n    var request = await _httpClient.GetAsync(url);\n    return await\
    \ request.Content.ReadAsStringAsync();\n}\n```\n\n下面的代码片段说明了 `DownloadString`\
    \ 方法的同步版本。注意 `.Result` 属性的使用。然而，由于后文讨论的原因，不建议使用这种方法，此处仅用于说明：\n\n```csharp\npublic\
    \ string DownloadString(String url)\n{\n    var request = _httpClient.GetAsync(url).Result;\n\
    \    return request.Content.ReadAsAsync().Result;\n}\n```\n\n# Task.Run 和 Task.Factory.StartNew\n\
    \n你可以使用两种方法之一来创建任务，即 `Task.Run` 和 `Task.Factory.StartNew`。虽然 `Task.Factory.StartNew`\
    \ 有许多选项，但 `Task.Run` 是 `Task.Factory.StartNew` 的更快速替代方案。\n\n`Task.Run` 方法是 .NET\
    \ 中创建计算密集型任务的推荐方式。只有当你对长时间任务需要更细粒度的控制时，才使用 `Task.Factory.StartNew`。如果你想要创建自定义的\
    \ `TaskScheduler` 或自定义的 `TaskCreationOptions`，可以使用 `Task.Factory.StartNew`。注意，任务调度器是一个负责调度任务的组件。\n\
    \n下面的代码片段说明了如何使用 `Task.Factory.StartNew` 创建任务：\n\n```csharp\nTask.Factory.StartNew(action,\
    \ CancellationToken.None, TaskCreationOptions.DenyChildAttach, TaskScheduler.Default);\n\
    ```\n\n当使用 `Task.Run` 时，也可以通过以下代码实现相同的操作：\n```csharp\nTask.Run(action);\n```\n\
    \n# Task.WaitAll 和 Task.WhenAll 方法\n\n`Task.WaitAll` 方法会阻塞当前执行的线程，直到所有任务完成。`Task.WhenAll`\
    \ 方法返回一个任务实例，该任务只有在其他任务完成其执行后才会完成。与 `Task.WaitAll` 方法不同，`Task.WhenAll` 不阻塞当前执行的线程。\n\
    \n`Task.WhenAll` 方法的语法如下：\n\n```csharp\nTask.WhenAll(taskList).ContinueWith(t\
    \ => {\n    // Some代码\n});\n```\n\n等待单个任务，你可以使用以下代码：\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n  Console.WriteLine(Thread.CurrentThread.ManagedThreadId);\n  Task<int>\
    \ output = Task.Factory.StartNew(SomeMethod);\n  Console.WriteLine(output.Result);\n\
    \  Console.Read();\n}\n\nprivate static int SomeMethod()\n{\n  Thread.Sleep(2000);\n\
    \  Console.WriteLine(Thread.CurrentThread.ManagedThreadId);\n  return 100;\n}\n\
    ```\n\n图 10.4 显示了执行上述程序时输出的内容如下：\n\n![](img/13229b4b9ff377325da8c3d3e8c64024_218_0.png)\n\
    \n`Main` 方法内部的线程 ID 首先打印，然后是名为 `SomeMethod` 方法的当前线程 ID。注意，托管线程 ID 是不同的。调用 `Task.Factory.Start`\
    \ 创建了一个新任务。名为 `SomeMethod` 的方法返回值 100，并在 `Main` 方法中显示。\n\n你可以使用 `Task.Run` 重写之前所示程序。实现方式如下：\n\
    \n```csharp\nstatic void Main(string[] args)\n{\n  Console.WriteLine(Thread.CurrentThread.ManagedThreadId);\n\
    \  Task<int> output = Task.Run(()=>SomeMethod());\n  Console.WriteLine(output.Result);\n\
    \  Console.Read();\n}\n\nprivate static int SomeMethod()\n{\n    Thread.Sleep(2000);\n\
    \    Console.WriteLine(Thread.CurrentThread.ManagedThreadId);\n    return 100;\n\
    }\n```\n\n"
