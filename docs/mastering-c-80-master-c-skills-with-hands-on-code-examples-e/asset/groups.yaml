    \        Console.WriteLine(File.GetLastAccessTime(path).ToLongTimeString());\n\
    \    }\n\n    Console.Read();\n}\n```\n\nYou can also write text to a file using\
    \ the WriteAllText method of the File class as shown in the following code snippet:\n\
    \n```csharp\nstatic void Main(string[] args)\n{\n    string text = \"This is a\
    \ text\";\n    string path = @\"D:\\Test.txt\";\n    File.WriteAllText(path, text);\n\
    \    Console.Read();\n}\n```\n\nThe WriteAllText method would overwrite the content\
