    # Thread pooling


    A thread pool comprises a collection of worker threads and IO threads. It can
    be defined as a pool of threads that are ready to execute instructions when asked
    for. You can leverage thread pools to create and use threads as and when they
    are needed, that is, on demand. A thread pool reduces the number of application
    threads and complexity of thread management. Usage of thread pools can reduce
    or eliminate the overhead of having to create threads each time the application
    needs one. It should be noted that a thread pool works in a non-deterministic
    manner, that is, you don''t have any control over a thread submitted to the thread
    pool would execute. Figure 11.6 shows a thread pool, comprising both worker threads
    and async threads:


    ![](img/13229b4b9ff377325da8c3d3e8c64024_241_1.png)


    Figure 11.7'
