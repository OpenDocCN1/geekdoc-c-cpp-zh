    ![](img/13229b4b9ff377325da8c3d3e8c64024_298_0.png)\n\nFigure 14.2: Launch Advanced\
    \ Settings Dialog\n\n## 9. In the Advanced Settings window that pops up, select\
    \ C# 8.0 (beta) as shown in Figure 14.3.\n\n| Application | Configuration (Active\
    \ Debug) | Platform: Active (Any CPU) |\n|---|---|---|\n| Build | | |\n| Build\
    \ Events | [x] Define DEBUG constant | |\n| Package | [x] Define TRACE constant\
    \ | |\n| Debugging | | Any CPU |\n| Signing | [ ] Prefer 32-bit | |\n| Resources\
    \ | [ ] Allow unsafe code | |\n| | [ ] Optimize code | Advanced Build Settings\
    \ ? X |\n| Errors and warnings | | C# latest supported minor version (default)\
    \ |\n| Warning level: | C# latest supported minor version (default) | C# latest\
    \ supported minor version (latest) |\n| | [x] Check for arithmetic overflow |\
    \ unsupported preview of next C# version (preview) |\n| Treat warnings as errors\
    \ | | C#1 |\n| Debugging information | C#2 |\n| File alignment: | C#3 |\n| Library\
    \ base address: | C#4 |\n| | C#5 |\n| | C#6 |\n| | C#7 |\n| | C#8 |\n| Output\
    \ paths | | |\n| [ ] XML documentation file | Since... |\n\nFigure 14.3: Specify\
    \ C# 8.0 as the programming language for the project\n\nAnd, that's all you must\
    \ do. You can now start programming in C# 8.0. In the sections that follow, we\
    \ will examine the salient features of C# 8.\n\n## Default interface members\n\
    \nAn interface, if you recall, is like a pure abstract class of C++. It is a contract\
    \ and can only contain member declarations. With C# 8.0, you couldn't have member\
    \ definitions in an interface. Things have changed with C# 8.0. You can now have\
    \ implementation for your interface members. Let's understand this with an example.\
    \ The code snippet below shows how you can define an implementation for a member\
    \ of an interface. The ILogger interface contains a method named Initialize with\
    \ a default implementation.\n\n```csharp\ninterface ILogger {\n    void Initialize()\
    \ {\n        Console.WriteLine(\"Working with C# 8!\");\n    }\n}\n```\n\nNote:\
    \ The above code will not work in the previous versions of C#, but is perfectly\
    \ legal in C# 8.0.\n\n## Nullable reference types\n\nC# programming language supports\
    \ variables of two types: primitive types and reference types. The primitive types\
    \ include char, int, and double. Primitive types cannot accept null. Reference\
    \ types are the objects of the classes we create. Memory for the reference types\
    \ is allocated in the managed heap. C# 2.0 introduced nullable versions of value\
    \ types to which you can have nullable char, nullable int, and nullable double.\
    \ Reference types can have null values by default. However, this might introduce\
    \ nullable reference issues in your applications. Here's exactly where nullable\
    \ reference type comes to the rescue.\n\nC# 8.0, a string object was a non-nullable\
    \ reference type. With C# 8.0, you can create nullable reference types as well.\
    \ The following code snippet illustrates how a nullable reference type can be\
    \ created:\n\n```csharp\nstring? nullableStringObj = null;\n```\n\nConsider the\
    \ method given below that returns the length of a non-nullable string. The string\
    \ passed to it as an argument is null, the method returns -1:\n\n```csharp\npublic\
    \ static int GetTextLength(string? bar)\n{\n    if (!string.IsNullOrEmpty(bar))\n\
    \    {\n        var length = bar!.Length;\n        return length;\n    }\n   \
    \ return -1;\n}\n```\n\nYou can call the above method from the Main method as\
    \ shown in the below code snippet:\n\n```csharp\nstatic void Main(string[] args)\n\
    {\n    string? nullableText = null;\n    int length = GetTextLength(nullableText);\n\
    \    Console.WriteLine(length);\n    Console.Read();\n}\n```\n\nRemember the dreaded\
    \ NullReferenceException problem? You can get around this if you use nullable\
    \ reference types. Nullable reference types will not solve this problem directly,\
    \ but you can write a code better that can avoid the dreaded error.\n\nThe null\
    \ coalescing assignment feature enables you to assign a value to a variable if\
    \ the value is null. The following code snippet illustrates how this can be achieved:\n\
    `v ??= expression;`\n\n## readonly members\n\nC# 8.0 has introduced a new feature\
    \ called readonly members. This enables you to mark a member in a struct as readonly.\
    \ The following code snippet illustrates how readonly members can be used in a\
    \ struct:\n\n```csharp\npublic struct Rectangle\n{\n    public double Length {get;\
    \ set;}\n    public double Breadth {get; set;}\n    public readonly double Distance\
    \ => Math.Sqrt(Length * Breadth);\n}\n}\n```\n\n## Static local functions\n\n\
    Local functions were introduced in C# 7.0. You can define any function inside\
    \ a method -that is, you define a local method inside another method. With C#\
    \ 8.0, you can define a static local function as well. Here's an example that\
    \ illustrates this:\n\n```csharp\npublic void OuterFunction(int x)\n{\n    Console.WriteLine(\"\
    Inside OuterFunction\");\n    InnerFunction(x);\n\n    static void InnerFunction(int\
    \ x)\n    {\n        Console.WriteLine(\"Inside Inner Function\");\n    }\n}\n\
    ```\n\nHere's another example that shows how static local functions can be used:\n\
    \n```csharp\nint AddNumbers()\n{\n    int a = 10; int b = 20;\n    return Sum(a,\
    \ b);\n    static int Sum(int x, int y) => x + y;\n}\n```\n\n## Asynchronous streams\n\
    \nSupport for asynchronous stream is a nice new feature added to C# 8.0 that can\
    \ be used to write computations and generate multiple values asynchronously. The\
    \ IAsyncEnumerable interface in C# 8.0 allows you to yield results asynchronously.\n\
    \n```csharp\npublic interface IAsyncEnumerable<T>\n{\n    IAsyncEnumerator<T>\
    \ GetAsyncEnumerator(CancellationToken cancellationToken = default);\n}\n\npublic\
    \ interface IAsyncEnumerator<T> : IDisposable\n{\n    T Current { get; }\n   \
    \ ValueTask NextAsync();\n}\n```\n\n## Mastering C# 8.0\n\nThese interfaces are\
    \ a part of System.Collections.Generic. Similar to the IDisposable interface,\
    \ you also have IAsyncDisposable\n\n```csharp\npublic interface IAsyncDisposable\n\
    {\n    ValueTask DisposeAsync();\n}\n```\n\nFor a method to return an asynchronous\
    \ stream, the following conditions should be satisfied:\n\n- The method should\
    \ have async modifier in its declaration.\n- The method should return IAsyncEnumerable<T>.\n\
    - The method should contain one or more yield return statements.\n\n```csharp\n\
    private static async IAsyncEnumerable<int> GetNumbersAsync()\n{\n    for (int\
    \ i = 0; i < 10; i++)\n    {\n        await Task.Delay(10);\n        yield return\
    \ i;\n    }\n}\n```\n\n## Pattern matching enhancements\n\nPattern matching in\
    \ C# 8.0 has been enhanced. You can now use pattern matching in switch expressions\
    \ as well. Since C# 8 introduces recursive patterns—that is, the output of a pattern\
    \ expression is another pattern—you can now take advantage of positional pattern\
    \ matching, property matching, recursive pattern and tuple matching in C# 8.\n\
    \nC# 8.0 enables you to write complex pattern matching expressions by leveraging\
    \ tuple patterns, positional patterns, and property patterns.\n\n- **Tuple patterns:**\
    \ Tuple pattern is used to match more than one value in pattern matching expression\
    \ as shown in the below code snippet\n```csharp\nswitch (LogTarget.File, LogLevel.Info)\
    \ {\n  case IsVerbose = false:\n    break;\n  case (LogTarget.File, LogLevel.Warning):\
    \ {\n    IsVerbose = false;\n    break;\n  case (LogTarget.File, LogLevel.Error):\
    \ {\n    IsVerbose = true;\n    break;\n  default:\n    throw new InvalidOperationException();\n\
    }\n```\n\n- **Positional patterns:** Positional includes syntax that has close\
    \ resemblance to tuple patterns, and is used to inspect the properties of an object\
    \ and use those properties to build a pattern: The following code snippet\n```csharp\n\
    if (log is LogManager(LogTarget.File, LogLevel.Error)) {\n  // Code executes if\
    \ LogTarget is LogTarget.File\n  // and LogLevel is LogLevel.Error\n}\n```\n\n\
    The LogManager type should have the following Deconstruct method:\n`public void\
    \ Deconstruct(out LogTarget logTarget, out LogLevel logLevel)`\n"
