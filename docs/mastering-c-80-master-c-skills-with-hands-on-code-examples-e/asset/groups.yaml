    \ the characteristics (attributes and methods) of the classes that extend the\
    \ super class and combines them into a single unit—the super class. Hence, a super\
    \ class is a generalization of the classes that extend the super class.\n\nAs\
    \ an example, consider the relationship between a Person and a Student and a Person\
    \ and a Teacher. A Teacher is also a Person. Hence, exists a generalization relationship\
    \ between a Person and a Student and a Person and a Teacher. Generalization is\
    \ often known as inheritance. However, they are not the same. Generalization is\
    \ defined as the process by of which the shared characteristics (attributes, associations,\
