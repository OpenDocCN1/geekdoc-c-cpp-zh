    \ following type:\n\n- Task Parallel Library\n- Parallel LINQ\n\n## Task Parallel\
    \ Library\n\nThe Task Parallel Library is based on the concept of a task and comprises\
    \ a collection of types in System.Threading and System.Threading.Tasks namespaces.\n\
    \n## Parallel LINQ\n\nParallel LINQ or PLINQ is a parallel execution engine that\
    \ you can take advantage of to execute LINQ queries on multi-core systems. Consider\
    \ the following LINQ query:\n\n```csharp\nvar data = from a in authors where a.FirstName.StartsWith(\"\
