    \n![](img/13229b4b9ff377325da8c3d3e8c64024_31_0.png)\n\n图 1.9：.NET 安全\n\n# 基于角色的安全\n\
    \n基于角色的安全是一种安全机制，根据用户的访问权限为已身份验证的用户提供应用程序资源的访问权限。要在 .NET 应用程序中实施安全性，你需要对用户进行身份验证，并对其有访问权限的资源进行授权。换句话说，对于实现\
    \ .NET 应用程序的安全而言，身份验证和授权是关键概念。\n\n在 .NET 应用程序中实施基于角色的安全非常简单。.NET 对基于角色的安全的支持也是灵活且可扩展的。为了确保与代码访问安全的一致，.NET\
    \ 中的基于角色的安全包含了 System.Security.Permissions.PrincipalPermission 对象，可以利用这些对象以与处理代码访问安全相同的方式执行授权。\n\
    \n# 代码访问安全\n\n代码访问安全 (CAS) 是 .NET 的沙箱。它是 .NET 的一种安全机制，用于 CLR 限制不受信任代码执行特权操作。CAS\
    \ 适用于托管应用程序。\n\n# 结论\n\n本章讨论了 .NET 的内部机制。在下一章中，我们将开始探索。\n\n# 问题\n\n1. .NET Framework\
