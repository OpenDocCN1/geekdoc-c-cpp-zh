    \ the block that contains code, which might throw an exception.\n- catch: The\
    \ catch block is used to catch or handle exceptions thrown inside the try block.\
    \ You can have multiple catch blocks for a try block.\n- finally: The finally\
    \ block is used to write cleanup code.\n- throw: The throw statement is used to\
    \ create a new exception that is bubbled up to a try...catch...finally block.\n\
    \nWhen an exception occurs, the runtime searches for a matching catch block. If\
    \ one is found, the code inside the matching catch block is executed. If none\
    \ is found, the runtime throws an error and terminates the program. The finally\
    \ block is executed irrespective of whether an exception has occurred or not.\
    \ In other words, the code inside the finally block will be executed irrespective\
    \ of whether an exception has occurred. We will examine all about this later in\
