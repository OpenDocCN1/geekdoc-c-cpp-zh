    \ newObj.LastName, newObj.Address);\n```\n\n# 结论\n\n本章讨论了 C# 中的文件和 I/O。我们还探索了序列化及其目的、序列化的类型以及如何使用\
    \ C# 进行数据的序列化反序列化。在下一章节中，我们将探索 C# 的一些高级概念。\n\n# 问题\n\n-1. Directory 类和 DirectoryInfo\
