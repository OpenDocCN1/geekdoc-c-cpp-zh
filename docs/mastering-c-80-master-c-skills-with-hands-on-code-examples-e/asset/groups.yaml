    ```\n\nWhen you'll execute the preceding program, a new file will be created at\
    \ the specified location.\n\nNow that the file has been created, you can use the\
    \ static methods of the File class to retrieve the creation time and the last\
    \ accessed time of the file as shown in the following code snippet:\n\n```csharp\n\
    static void Main(string[] args)\n{\n    string path = @\"D:\\Test.txt\";\n\n \
