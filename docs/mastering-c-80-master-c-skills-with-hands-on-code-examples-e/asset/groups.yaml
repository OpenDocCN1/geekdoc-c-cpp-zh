- md: "\n# Asynchrony and Parallel Programming in C#\n\nasynchronous to improve scalability.\
    \ However, you should be aware of the best practices using asynchronous programming.\n\
    \n## Avoid using async void methods\n\nAsynchronous methods can return Task, Task<T>,\
    \ and void. You should not use async void methods except when writing async event\
    \ handlers. The semantics of async void methods are not the same as async Task\
    \ or async Task<T> methods. Exception handling works differently in async void\
    \ and async Task or async Task<T> methods. When an exception is thrown in an async\
    \ void method, it will be raised directly on the currently active SynchronizationContext.\
    \ On the contrary, when an exception is thrown in an async Task or async Task<T>\
    \ method, its details are captured and stored in the Task object.\n\n## Avoid\
    \ mixing synchronous and asynchronous code\n\nWhen writing programs that leverage\
    \ asynchrony, async code contains a mix of both synchronous and asynchronous code.\
    \ If you are using async code, you should use it throughout, that is, right from\
    \ the topmost layer to the bottom—it should be async all the way.\n\nSince there\
    \ is a likelihood of making a few common mistakes while writing async code, one\
    \ should:\n\n- Avoid having void return type in async methods.\n- Avoid blocking\
    \ on tasks using .Result or .Wait(). This means blocking on async code.\n- Avoid\
    \ creating async wrappers for sync methods.\n\nNote that if you mark a method\
    \ as async and you don't have an await keyword used inside the method the entire\
    \ method will be executed synchronously.\n\n## Conclusion\n\nAsynchrony and parallel\
    \ programming are two of the most important features in .NET. In this chapter,\
    \ we have learned the concepts of parallel and asynchronous programming and how\
    \ to write programs that leverage these concepts in C#. In the next chapter, we'll\
    \ examine how we can work with threads in C#.\n\n## Questions\n\n- 1. What is\
    \ the difference between a thread and a task?\n2. What is the difference between\
    \ asynchrony and parallelism?\n3. What are the types of parallel programming?\n\
    - 4. Which method is used to control parallelism?\n5. What is the difference between\
    \ async and await keywords?\n6. What are all the possible return types of an async\
    \ method?\n7. What is a Task Parallel Library?\n8. What is a thread pool? Why\
    \ is it needed?\n9. What is a task scheduler?\n10. Discuss a few best practices\
    \ that can be used in asynchronous programming.\n\n# CHAPTER 11\n# Multithreading\
    \ in C#\n\nThe Microsoft .NET Framework provides built-in support for multithreading.\n\
    This chapter discusses how we can work with multithreading in C#.\n\n## Structure\n\
    \nIn this chapter, we will discuss the following points:\n\n- Threads, processes,\
    \ and tasks\n- Multithreading\n  - Types of multithreading\n  - Benefits and drawbacks\
    \ of multithreading\n- Thread pooling\n- Thread synchronization\n- Deadlocks\n\
    - Programming threads in C#\n\n## Objective\n\nAfter reading this chapter, the\
    \ reader will be able to:\n\n- Grasp an understanding of threads, processes, and\
    \ tasks\n- Understand thread pooling\n- Understand thread synchronization\n- Understand\
    \ deadlocks and why they occur\n- Write programs using threads\n\n## Process,\
    \ threads, and tasks\n\nA process may be defined as the running instance of a\
    \ program. In other words, a process is defined as a program in execution. A thread\
    \ is defined as the path of execution within a process. A task is a higher level\
    \ of abstraction and is executed by a task scheduler. In essence, a thread denotes\
    \ the smallest sequence of instructions that can be managed by the scheduler.\
    \ A thread takes advantage of the thread pool by default and is a convenient way\
    \ to execute some code asynchronously.\n\nA thread represents an OS-level thread\
    \ having its own stack and kernel resources. Note that threads are not a .NET\
    \ construct. Rather, they are created and managed by the operating system. The\
    \ Thread class in .NET provides a way to create and manage threads using the host\
    \ operating system.\n\n## Multithreading\n\nAt any given point of time, a CPU\
    \ can execute only one thread. Multithreading refers to the ability of the operating\
    \ systems to have at the same point of time multiple threads in the memory and\
    \ switch these threads in the memory as and when needed. So, if there are $n$\
    \ threads in the system, $1$ of them is in the running state and the remaining\
    \ $n-1$ threads are in other states. This switching between the threads (also\
    \ known as context switching) in the memory happens so fast that you'll observe\
    \ a pseudo parallelism, that is, it seems as if all the threads are running concurrently.\n\
    \n## Multithreading in C# 207\n\nFigure 11.1 shows the states of a thread. We'll\
    \ discuss more about thread states later in this chapter:\n\n![](img/13229b4b9ff377325da8c3d3e8c64024_226_0.png)\n\
    \nFigure 11.1\n\n## Types of multithreading\n\nThere are three types of multithreading.\
    \ These include:\n\n- Serial: This is supported by the DOS OS.\n- Co-operative:\
    \ This is supported by Windows 3.11.\n- Preemptive: This is supported by Windows\
    \ 9x, NT, XP, and many more.\n\n## Benefits and drawbacks of multithreading\n\n\
    Multithreading can provide enhanced throughput in an application—you can take\
    \ advantage of multithreading to execute multiple tasks simultaneously. Multithreading\
    \ improves the responsiveness of an application as well. Multithreading is complicated\
    \ and is all resource-intensive. Context switching between threads is an expensive\
    \ operation.\n\n## Programming threads\n\nThe System.Threading namespace provides\
    \ types (classes, structs, and enums) for working with threads. The Thread class\
    \ provides methods to start, stop, or resume threads. To create a new thread,\
    \ you can take advantage of the ThreadStart delegate and pass the reference of\
    \ the method that you want to be executed when the thread starts:\n\n```csharp\n\
    using System;\nusing System.Threading;\n\nnamespace Chapter11_Example\n{\n   \
    \ class Program\n    {\n        static void Main()\n        {\n            Thread\
    \ t = new Thread(new ThreadStart(SomeThreadMethod));\n            t.Start();\n\
    \            Console.Read();\n        }\n        static void SomeThreadMethod()\n\
    \        {\n            Console.WriteLine(\"Hello World!\");\n        }\n    }\n\
    }\n```\n\nHere's another example of a thread. Refer to the code below:\n\n```csharp\n\
    class Program\n{\n    static void Main()\n    {\n        Thread t1 = new Thread(Display);\n\
    \        t1.Name = \"Worker Thread\";\n        t1.Start();\n\n        Thread t2\
    \ = new Thread(Display);\n        t2.Start();\n\n        Console.Read();\n   \
    \ }\n\n    static void Display()\n    {\n        for (int i = 1; i <= 10; i++)\n\
    \        {\n            Console.WriteLine(i);\n            Thread.Sleep(100);\n\
    \        }\n    }\n}\n```\n\n## Foreground and background threads\n\nThreads can\
    \ be foreground or background. The threads you create are foreground threads and\
    \ they keep the application alive as long as they are running. When all the foreground\
    \ threads finish, the background threads are terminated abruptly, and the application\
    \ also ends. You can take advantage of the IsBackground property to check if a\
    \ thread is a foreground thread or a background. The code snippet given below\
    \ illustrates how this can be achieved:\n\n```csharp\nclass Program\n{\n    static\
    \ void Main()\n    {\n        Thread t = new Thread(Display);\n        t.Name\
    \ = \"Worker Thread\";\n        if(t.IsBackground)\n        {\n            Console.WriteLine(\"\
    This is a background thread.\");\n        }\n        else\n        {\n       \
    \     Console.WriteLine(\"This is a foreground thread.\");\n        }\n    }\n\
    }\n```\n\nA thread can run either in the foreground or in the background. A foreground\
    \ thread prevents the application from being terminated. You can explicitly set\
    \ the status of a thread, that is, specify if the thread should run in the foreground\
    \ or in the background, using the IsBackground property of the Thread class. Here's\
