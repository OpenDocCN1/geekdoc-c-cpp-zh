    # Using a predicate delegate with an anonymous method


    You can assign an anonymous method to a predicate delegate much the same way you
    did earlier with Action delegate. Here''s an example that illustrates how this
    can be achieved:


    ```

    Predicate<int>isNumberEven = delegate (int i) { return (i % 2) == 0 ? true : false
    };

    bool result = isNumberEven(1);

    ```


    # Using a predicate delegate with a lambda expression


    You can assign a lambda expression to a predicate delegate as well. Here''s an
    example that illustrates how this can be achieved:


    ```

    Predicate<string>isUpperCase = s => s.Equals(s.ToUpper());

    bool result = isUpperCase("This text is in mixed case.");

    Console.WriteLine(result);

    ```


    Since the text passed as a parameter to the predicate is not in upper case, when
    you execute the previous piece of code, the text false will be displayed in the
    console window.


    # Extension methods


    Extension methods are a special type of static methods that enable you to add
    methods to an existing type, without the need of creating a new type. In other
    words, extension methods enable you to extend the functionality of existing types.
    As the name suggests, these methods are additional methods for the type. Support
    for extension methods has been provided in C# since version 3.0.


    It should be noted that extension methods should be static and should reside inside
    a static class. The first parameter of an extension method should always be this.
    In other words, the signature of an extension method should start with this keyword
    followed by the type on which it would work. It should be noted that extension
    methods are not at all a substitute for inheritance. Extension methods should
    be used sparingly, that is, only when they are needed.'
