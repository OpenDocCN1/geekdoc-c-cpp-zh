    Figure 14.1: Turn on the preview versions of .NET Core SDK'
- md: "\nNote that step 5 is needed if you are using a preview version of .NET Core\
    \ 3.0. If you have the final release of .NET Core 3.0 installed, you wouldn't\
    \ need this step at all. Next, select the project in the solution Explorer Window.\n\
    \n7. Right-click and select Properties. Alternatively, select the project and\
    \ press the Alt and Enter keys together.\n\n8. In the Properties window, click\
