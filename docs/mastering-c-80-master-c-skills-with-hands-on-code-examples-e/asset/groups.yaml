    # Lambda expressions


    A lambda expression in C# is a syntactic sugar; it is an anonymous function that
    doesn''t have any declaration. You can take advantage of Lambda expressions to
    write local functions that can be passed as arguments or returned as the value
    of a function call. Lambda expressions can be used to create delegates or expression
    trees.


    A lambda expression comprises a block of code that is treated as an object. Essentially,
    lambda expressions are represented as a delegate or an expression tree. You can
    pass a lambda expression to a method as its argument and return it using method
    calls.


    Lambda expressions contain expressions or a sequence of operators and use the
    lambda operator ->. While the left side of the operator contains the input parameters,
    the right side of the operator contains an expression or a code block. So, to
    create a lambda expression you should specify the input parameters at the left
    side of the ->> lambda operator and put expressions at the right side of the =>
    lambda operator.


