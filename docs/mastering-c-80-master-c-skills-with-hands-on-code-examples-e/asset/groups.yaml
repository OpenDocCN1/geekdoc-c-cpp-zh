    机器码由主机操作系统在 CPU 和其他资源的帮助下执行。


    ## 垃圾回收


    垃圾回收 (GC) 是 .NET 提供的一种功能，用于自动管理内存。它会清理未使用的对象，即不再使用的对象。这里的“垃圾”一词指的是不再需要的对象。


    ## 精通 C# 8.0


    堆内存分为两个部分：小对象堆 (SOH) 和大对象堆 (LOH)。让我们先讨论 GC 如何在 SOH 中工作。参考图 1.7：


    .NET 采用分代模型来存储对象。在该模型中，垃圾回收堆（小对象堆的一部分）被划分为三个不同的区域：第 0 代、第 1 代和第 2 代。对象首次创建时被放在第
    0 代。如果第 0 代的对象存活了第 0 代回收，它们会被提升到第 1 代。同样，当第 1 代的对象存活了第 1 代回收时，它们会被提升到第 2 代。


    图 1.8 展示了这三个代代：


    | 第 2 代 |

    | 第 1 代 |

    | 第 0 代 |


    图 1.8：GC 的三个代


