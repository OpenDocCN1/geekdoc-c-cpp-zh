    ## 通用语言运行时


    通用语言运行时 (CLR) 是一个运行时引擎，负责执行你的程序、代码验证、类型安全、内存分配、垃圾回收、安全等许多功能。它提供了若干服务，包括：


    - 即时编译 (Just-in-time compilation)

    - 垃圾回收

    - 代码访问安全

    - 内存管理

    - 代码验证


