    \ LINQ (Parallel LINQ)\n\n## 任务并行库\n\n任务并行库基于“任务”的概念，包含一组 `System.Threading` 和\
    \ `System.Threading.Tasks` 命名空间中的类型。\n\n## 并行 LINQ\n\n并行 LINQ 或 PLINQ 是一种并行执行引擎，你可以利用它在多核系统上执行\
