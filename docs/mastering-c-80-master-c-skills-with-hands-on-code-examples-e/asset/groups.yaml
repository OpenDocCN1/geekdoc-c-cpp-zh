    ## 托管代码和非托管代码


    托管代码在 CLR 的上下文中运行并由其管理。相反，非托管代码运行在 CLR 之外，因此其安全性不受验证。


    ## 即时编译器


    用 C# 或 VB.NET 编写的程序生成中间语言代码，也称为 IL 代码。JIT 编译器负责在运行时将 IL 代码编译为机器码。图 1.6 展示了 CLR
    的执行模型。


