    Constructor overloading is also an example of static polymorphism. You may need
    to take advantage of constructor overloading in order to allow an instance of
    a class to be initialized in various ways. In constructor overloading, you will
    have multiple constructors for a class, each of them differing in the signature.
    The code snippet in Figure 4.8 shows a class with multiple constructors, demonstrating
    constructor overloading:


    ![](img/13229b4b9ff377325da8c3d3e8c64024_87_0.png)


    Figure 4.8: Constructor overloading


    The class MyClass in the code example, which is shown in the preceding screenshot,
    has two constructors—a default constructor and argument constructor. Two instances
    of the class MyClass are created in the Main() method: one named obj1 and the
    other named obj2. When the instance obj1 is created, the default constructor is
    called. Since the default constructor doesn''t have any code inside, the value
    of the variable x remains unchanged. When the instance obj2 is created, the value
    of 10 is passed as an argument to the one-argument constructor. In this case,
    the value of the variable x is changed to 10 inside the one-argument constructor.
    So, when this code is executed, the value of x is displayed as 0 for the instance
    obj1 and 10 for the instance obj2.'
- md: "\nObject-Oriented Programming – Part 2 69\n\n## Dynamic or runtime polymorphism\n\
    \nDynamic or runtime polymorphism can be implemented using method overriding.\
    \ Such type of polymorphism is commonly known as late binding. In dynamic polymorphism,\
    \ the compiler doesn't have the knowledge of the method to call on an instance—this\
    \ information is available only at runtime. Method overriding enables you to invoke\
    \ methods belonging to different classes in the same hierarchy using a base class\
    \ reference. Method overriding differs from method overloading in more ways than\
    \ one. In method overriding, you typically have having the same signature available\
    \ both in the Base and Derived classes. The signature of these methods is the—the\
    \ same—they differ only in their implementation. The Derived class overrides the\
    \ method of the Base class. Let's understand this with an example. Consider the\
    \ two classes Base and Derived, as shown in the below code snippet:\n\n```csharp\n\
    class Base\n{\n  public virtual void SomeMethod(int someParameter)\n  {\n    Console.WriteLine(\"\
    SomeMethod of the Base class called. The value of the parameter passed is: \"\
    \ + someParameter);\n  }\n}\n```\n\n```csharp\nclass Derived : Base\n{\n  public\
    \ override void SomeMethod(int anotherParameter)\n  {\n    Console.WriteLine(\"\
    SomeMethod of the Derived class called. The value of the parameter passed is:\
    \ \" + anotherParameter);\n  }\n}\n```\n\nThe class Base contains a virtual method\
    \ named SomeMethod. This method is overridden in the class named Derived. The\
    \ method signature is the same in both the base and the derived classes. Note\
    \ the usage of the virtual keyword in the method signature in the class named\
    \ Base. A method that is declared as virtual in a Base class should be marked\
    \ using the override keyword in the Derived classes to implement method overriding.\
    \ Without this keyword, the base version of the method would be hidden, and the\
    \ compiler will flag a warning.\n\nThe code snippet given below illustrates how\
    \ you can create an instance of the Derived class using a reference of the Base\
    \ class and then invoke the method SomeMethod():\n\n```csharp\nBase b = new Derived();\n\
    b.SomeMethod(10);\n```\n\n70 Mastering C# 8.0 (Page Header)\n\nWhen the above\
    \ code is executed, a message will be displayed in the console as follows:\n\n\
    ```\nSomeMethod of the Derived class called. The value of the parameter passed\
    \ is: 10\n```\n\n## Encapsulation\n\nEncapsulation is the process by which the\
    \ data and member functions of a class are combined into a single unit. Encapsulation\
    \ binds together the data and methods of a class that manipulate the data inside\
    \ one single unit. Encapsulation is typically used to hide the internal representation\
    \ or state of an object from the external world. In other words, encapsulation\
    \ (also known as **information hiding**) is the process of hiding the internal\
    \ details of an object from the outside world. So, encapsulation helps protect\
    \ your data from misuse.\n\nIn C#, there are different types of modifiers that\
    \ are used to encapsulate data and member functions (or methods). These include:\
    \ public, private, internal, protected, and protected internal.\n\n## Access modifier\
    \ “public”\n\nThe public access modifier allows a member of a class to be accessed\
    \ from anywhere else in the program. Please refer to the following Employee class:\n\
    \n```csharp\nclass Employee\n{\n    public double basic;\n    public double allowance;\n\
    \n    public void DisplaySalary()\n    {\n        Console.WriteLine(\"The salary\
    \ is: \" + (basic + allowance));\n    }\n}\n```\n\nIn the Employee class, you\
    \ have two data members, namely basic and allowance. Since the data members have\
    \ public access specifiers, they can be accessed from outside the class as well.\
    \ The code snippet given below illustrates how you can instantiate this class\
    \ and assign data to the data members of this class from the Main method:\n\n\
    ```csharp\nstatic void Main(string[] args)\n{\n    Employee employee = new Employee();\n\
    \    employee.basic = 1000;\n    employee.allowance = 200;\n    employee.DisplaySalary();\n\
    \    Console.Read();\n}\n```\n\nWhen you execute the previous program, a message\
    \ will be displayed in the console window as follows:\n\n```\nThe salary is: 1200\n\
    ```\n\nThe public data members of the Employee class can be accessed using an\
    \ instance of the class from outside the class.\n\n## Access modifier “private\"\
    \n\nWhen a member of a class is declared using the private access modifier, access\
    \ to the member is restricted to the class in which it is declared, that is, the\
    \ member cannot be accessed from outside the class. So, if you have a private\
    \ data member in a class, you would need a public method to access the data member\
    \ from outside the class.\nLet’s understand this with an example.\n\nThe class\
    \ named Employee, which contains two data members is given below. Here, both of\
    \ them have been declared using private access modifiers:\n\n```csharp\nclass\
    \ Employee\n{\n    private double basic;\n    private double allowance;\n\n  \
    \  public void DisplaySalary()\n    {\n        Console.WriteLine(\"The salary\
    \ is: \" + (basic + allowance));\n    }\n}\n```\n\nSince these data members are\
    \ private, you can no longer access them (as you did in the previous section)\
    \ from the Main method. To assign values to these data members, you would need\
    \ a public member. The code snippet given below shows a modified version of the\
    \ Employee class with a method named SetValues to assign data to both the data\
    \ members:\n\n```csharp\nclass Employee\n{\n    private double basic;\n    private\
    \ double allowance;\n\n    public void SetValues(double basic, double allowance)\n\
    \    {\n        this.basic = basic;\n        this.allowance = allowance;\n   \
    \ }\n\n    public void DisplaySalary()\n    {\n        Console.WriteLine(\"The\
    \ salary is: \" + (basic + allowance));\n    }\n}\n```\n\nThe code snippet given\
    \ below shows how you can instantiate the Employee class and assign data to its\
    \ members using the SetValues method:\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    Employee employee = new Employee();\n    employee.SetValues(1000,\
    \ 200);\n    Console.Read();\n}\n```\n\nWhen you execute the preceding program,\
    \ the output will be the same as in the previous:\n\n```\nThe salary is: 1200\n\
    ```\n\n## Access modifier \"protected\"\n\nWhen a member of a class is declared\
    \ using the protected access specifier, the member can be accessed from within\
    \ the class and its subclasses only. You cannot access a protected member of a\
    \ class from outside the class. The code listed below illustrates two classes,\
    \ namely Employee and SalesEmployee:\n\n```csharp\nclass Employee\n{\n    protected\
    \ double basic;\n    protected double allowance;\n}\n\nclass SalesEmployee : Employee\n\
    {\n    public void Initialize(double basic, double allowance)\n    {\n       \
    \ this.basic = basic;\n        this.allowance = allowance;\n    }\n    public\
    \ void Display()\n    {\n        Console.WriteLine(\"The salary is: \" + (basic\
    \ + allowance));\n    }\n}\n```\n\nThe Employee class contains two data members\
    \ marked with the protected keyword. The SalesEmployee class extends the Employee\
    \ class and contains the Initialize and Display methods. It should be noted that\
    \ since the data members of the Employee class are marked using the protected\
    \ keyword, you cannot access them using an instance of the Employee class. Rather,\
    \ you can create an instance of the SalesEmployee class and call its methods as\
    \ shown in the below code snippet:\n\n```csharp\nSalesEmployee employee = new\
    \ SalesEmployee();\nemployee.Initialize(1000, 200);\nemployee.Display();\n```\n\
    \n## Access modifier \"internal\"\n\nWhen a member of a class is declared using\
    \ the internal access specifier, the member can be accessed from within the same\
    \ assembly only, that is, the member cannot be accessed from outside the assembly\
    \ in which it has been declared.\n\nThe code snippet given below illustrates a\
    \ class named Employee having two data members–both declared using the internal\
    \ access modifier:\n\n```csharp\nclass Employee\n{\n    internal double basic;\n\
    \    internal double allowance;\n\n    public void SetValues(double basic, double\
    \ allowance)\n    {\n        this.basic = basic;\n        this.allowance = allowance;\n\
    \    }\n\n    public void DisplaySalary()\n    {\n        Console.WriteLine(\"\
    The salary is: \" + (basic + allowance));\n    }\n}\n```\n\nNote the usage of\
    \ the internal keyword when declaring the data members named basic and allowance.\
    \ You can access both these data members from outside the class as shown in the\
    \ below code snippet:\n"
  mdcn: "\n面向对象编程 – 第2部分 69\n\n## 动态或运行时多态\n\n动态或运行时多态可以通过方法重写（method overriding）来实现。这种类型的多态通常被称为晚绑定。在动态多态中，编译器并不知道要在一个实例上调用哪种方法——这些信息仅在运行时才可用。方法重写允许你使用基类引用调用同一继承层级中不同类的方法。方法重写与方法重载（method\
    \ overloading）在多个方面都有其不同之处。在方法重写中，你通常在基类和派生类中拥有相同的签名。这些方法的签名是——完全相同的——它们的区别仅在于实现方式。派生类重写了基类的方法。让我们通过一个示例来理解这一点。考虑两个类\
    \ `Base` 和 `Derived`，如下代码段所示：\n\n```csharp\nclass Base\n{\n  public virtual void\
    \ SomeMethod(int someParameter)\n  {\n    Console.WriteLine(\"SomeMethod of the\
    \ Base class called. The value of the parameter passed is: \" + someParameter);\n\
    \  }\n}\n```\n\n```csharp\nclass Derived : Base\n{\n  public override void SomeMethod(int\
    \ anotherParameter)\n  {\n    Console.WriteLine(\"SomeMethod of the Derived class\
    \ called. The value of the parameter passed is: \" + anotherParameter);\n  }\n\
    }\n```\n\n`Base` 类包含一个名为 `SomeMethod` 的虚拟方法。该方法在名为 `Derived` 的类中被重写。基类和派生类中的方法签名是相同的。请注意在\
    \ `Base` 类的方法签名中使用了 `virtual` 关键字。在基类中声明为 `virtual` 的方法在派生类中应使用 `override` 关键字进行标记以实现方法重写。如果没有此关键字，基类的方法版本将被隐藏，编译器将标记警告。\n\
    \n给出的代码段演示了如何使用 `Base` 类的引用创建 `Derived` 类的实例，然后调用 `SomeMethod()` 方法：\n\n```csharp\n\
    Base b = new Derived();\nb.SomeMethod(10);\n```\n\n70 精通 C# 8.0（页眉）\n\n当执行上述代码时，控制台将显示如下消息：\n\
    \n```\nSomeMethod of the Derived class called. The value of the parameter passed\
    \ is: 10\n```\n\n## 封装\n\n封装是将类的数据和成员函数组合成单个单元的过程。封装将类的数据和操作该类内部数据的方法绑定在同一个单一单元中。封装通常用于从外部世界隐藏对象的内部表示或状态。换句话说，封装（也称为**信息隐藏**）是从外部世界隐藏对象内部细节的过程。因此，封装有助于保护你的数据免受误用。\n\
    \n在 C# 中，有不同类型的修饰符用于封装数据和成员函数（或方法）。这些包括了：`public`、`private`、`internal`、`protected`\
    \ 和 `protected internal`。\n\n## 访问修饰符“public”\n\n`public` 访问修饰符允许从程序的任何其他地方访问类的成员。请参考下方的\
    \ `Employee` 类：\n\n```csharp\nclass Employee\n{\n    public double basic;\n  \
    \  public double allowance;\n\n    public void DisplaySalary()\n    {\n      \
    \  Console.WriteLine(\"The salary is: \" + (basic + allowance));\n    }\n}\n```\n\
    \n在 `Employee` 类中，你有两个数据成员，即 `basic` 和 `allowance`。由于这些数据成员具有 `public` 访问修符，它们也可以从类外部访问。给出的代码段演示了你如何在\
    \ `Main` 方法中实例化此类并为该类的数据成员赋值：\n\n```csharp\nstatic void Main(string[] args)\n\
    {\n    Employee employee = new Employee();\n    employee.basic = 1000;\n    employee.allowance\
    \ = 200;\n    employee.DisplaySalary();\n    Console.Read();\n}\n```\n\n当执行上述代码时，控制台将显示如下消息：\n\
    \n```\nThe salary is: 1200\n```\n\n## 访问修饰符“private”\n\n在基类中声明为 `virtual` 的方法在派生类中应使用\
    \ `override` 关键字进行标记以实现方法重写。如果没有此关键字，基类的方法版本将被隐藏，编译器将标记警告。\n\n（注：此处根据原文逻辑翻译，关于\
    \ `private` 修饰符的描述如下）\n\n在基类中声明为 `virtual` 的方法在派生类中应使用 `override` 关键字进行标记以实现方法重写。如果没有此关键字，基类的方法版本将被隐藏，编译器将标记警告。\n\
    \n`private` 访问修饰符限制类的成员只能在类内部访问。让我们通过一个示例来理解这一点。考虑 `Employee` 类：\n\n```csharp\n\
    class Employee\n{\n    private double basic;\n    private double allowance;\n\n\
    \    public void DisplaySalary()\n    {\n        Console.WriteLine(\"The salary\
    \ is: \" + (basic + allowance));\n    }\n}\n```\n\n如果你尝试在类外部访问 `basic` 或 `allowance`，编译器将报错。\n\
    \n## 访问修饰符“protected”\n\n`protected` 访问修饰符允许在类及其派生类内部访问成员。你不能从类外部访问 `protected`\
    \ 成员。下代码展示了两个类，即 `Employee` 和 `SalesEmployee`：\n\n```csharp\nclass Employee\n\
    {\n    protected double basic;\n    protected double allowance;\n}\n\nclass SalesEmployee\
    \ : Employee\n{\n    public void Initialize(double basic, double allowance)\n\
    \    {\n        this.basic = basic;\n        this.allowance = allowance;\n   \
    \ }\n    public void Display()\n    {\n        Console.WriteLine(\"The salary\
    \ is: \" + (basic + allowance));\n    }\n}\n```\n\n`Employee` 类包含两个标记为 `protected`\
    \ 关键字的数据成员。`SalesEmployee` 类继承自 `Employee` 类并包含 `Initialize` 和 `Display` 方法。应该注意的是，由于\
    \ `Employee` 类的成员使用了 `protected` 关键字，你不能通过 `Employee` 类的实例访问它们。相反，你可以创建一个 `SalesEmployee`\
    \ 类的实例并调用其方法，如下代码段所示：\n\n```csharp\nSalesEmployee employee = new SalesEmployee();\n\
    employee.Initialize(1000, 200);\nemployee.Display();\n```\n\n## 访问修饰符“internal”\n\
    \n当使用 `internal` 访问修饰符声明类成员时，成员只能在同一个程序集内部访问，也就是说，该成员无法在声明它的程序集外部被访问。\n\n给出的代码段演示了一个名为\
    \ `Employee` 的类，它包含两个数据成员——它们都使用了 `internal` 访问修饰符：\n\n```csharp\nclass Employee\n\
    {\n    internal double basic;\n    internal double allowance;\n\n    public void\
    \ SetValues(double basic, double allowance)\n    {\n        this.basic = basic;\n\
    \        this.allowance = allowance;\n    }\n\n    public void DisplaySalary()\n\
    \    {\n        Console.WriteLine(\"The salary is: \" + (basic + allowance));\n\
    \    }\n}\n```\n\n注意在声明数据成员 `basic` 和 `allowance` 时使用的 `internal` 关键字。如下代码段所示，你可以从类外部访问这两个数据成员：\n"
