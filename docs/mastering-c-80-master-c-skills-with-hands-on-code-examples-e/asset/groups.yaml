    \ Order\n{\n  private string[] productCodes = new string[5];\n  public string\
    \ this[int index]\n  {\n    get\n{\n      return productCodes[index];\n    }\n\
    \    set\n{\n      productCodes[index] = value;\n    }\n  }\n}\n```\n\nThe code\
    \ snippet given below shows how you can create an instance of the Order class\
