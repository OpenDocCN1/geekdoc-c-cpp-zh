    \ Square(int x)\n{\n    return x * x;\n}\n\nstatic void Main(string[] args)\n\
    {\n    Func<int> add = Square;\n    int result = Square(10);\n    Console.WriteLine(result);\n\
    }\n```\n\n这里是使用匿名函数的 `Func` 委托的另一个示例：\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n  Func<int, int, string> funcWithAnonymousFunction = delegate(int\
