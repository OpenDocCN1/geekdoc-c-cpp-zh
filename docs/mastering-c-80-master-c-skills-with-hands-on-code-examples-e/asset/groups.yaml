    ## 类库


    .NET 类库 (FCL) 是一组由 .NET 提供的可重用类、接口和其他类型的综合集合。


    FCL 提供的服务包括：


    - 文件处理

    - 数据库访问

    - XML


    ## 类型系统


    通用类型系统 (CTS) 定义了类型在 .NET 中的表示方式。它支持两种类型。


    ## 值类型和引用类型


    CTS 值类型存储在栈上，而引用类型存储在托管堆中。请参考图 1.5 以更好地理解：


