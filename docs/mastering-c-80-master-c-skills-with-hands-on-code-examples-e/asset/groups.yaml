    # Rules of inheritance


    Here''s a quick glance at the basic rules of inheritance:


    +   - An abstract class can be extended but not instantiated.

    - All public members of a class can be accessed from outside the class.

    - All non-private members of a class can be inherited to its child class.

    - While inheriting a base class, you can specify the visibility level as well.

    - Visibility levels are used to denote how much of the class is available from
    the external world, or can be extended.

    - If a class extends a base class with the visibility mode as public, all public
    members of the base class become public members of the derived class and all protected
    members of the base class become protected members of the derived class.

    - If a class extends a base class with the visibility mode as protected, all public
    and protected members of the base class become protected members of the derived
    class.

    - If a class extends a base class with the visibility mode as private, all public
    and protected members of the base class become private members of the derived
    class.

    - Private members of a class are not inherited

    - Derived classes cannot have more accessibility than their base types.


    # Conclusion


    In this chapter, we learned about the concepts of OOP, such as association, aggregation,
    composition, polymorphism, abstraction, generalization and inheritance, with relevant
    code examples. In the next chapter, we''ll explore the properties and indexers
    in C#.


    # Questions


    +   1. What is association? What is bidirectional association?

    2. What is the difference between aggregation and composition?

    3. What are the UML notations for association, aggregation, and composition?

    4. Explain generalization with an example.

    5. What is the access specifier internal used for?'
