    # Tuples\n\nA Tuple is a data structure that can be used to represent a set of\
    \ homogenous or heterogeneous data. It is an ordered sequence of immutable, fixed-size\
    \ data. The size of a Tuple is fixed after it is created. The properties of a\
    \ Tuple cannot be changed, as they are read-only from the time they are created.\
    \ You can use a tuple to store multiple values of varied data types inside one\
    \ umbrella.\n\nNote that tuples have a limit of eight items. If you would like\
    \ to store more items, you should use nested tuples. The Tuple class in C# is\
    \ static in nature and takes advantage of the factory design pattern to create\
    \ instances of tuples.\n\nThe overloaded and static Create methods of the Tuple\
    \ class are as follows:\n\n```csharp\nCreate<T1>(T1) - this is used to create\
    \ a 1-tuple\n```\n\n```csharp\nCreate<T1, T2>(T1, T2) - this is used to create\
    \ a 2-tuple\n```\n\n```csharp\nCreate<T1, T2, T3>(T1, T2, T3) - this is used to\
    \ create a 3-tuple\n```\n\n```csharp\nCreate<T1, T2, T3, T4>(T1, T2, T3, T4) -\
    \ this is used to create a 4-tuple\n```\n\n```csharp\nCreate<T1, T2, T3, T4, T5>(T1,\
    \ T2, T3, T4, T5) - this is used to create a 5-tuple\n```\n\n```csharp\nCreate<T1,\
    \ T2, T3, T4, T5, T6>(T1, T2, T3, T4, T5, T6) - this is used to create a 6-tuple\n\
    ```\n\n```csharp\nCreate<T1, T2, T3, T4, T5, T6, T7>(T1, T2, T3, T4, T5, T6, T7)\
    \ - this is used to create a 7-tuple\n```\n\nThe following code snippet creates\
    \ a tuple comprising three items of dissimilar types:\n`Tuple<int, string, DateTime>\
    \ tuple = Tuple.Create(1, \"Joydip\", new DateTime(1970, 1, 1));`\n\nThe following\
    \ code listing illustrates how you can create a tuple, assign data to it and display\
    \ the values of the properties of the tuple:\n\n```csharp\nstatic void PrintData(string\
    \ str, int i)\n{\n    Console.WriteLine(\"{0} {1}\", str, i);\n}\nstatic void\
    \ Main(string[] args)\n{\n    Tuple<string, int> tuple = new Tuple<string, int>(\"\
    This is a string.\", 10);\n    PrintData(tuple.Item1, tuple.Item2);\n}\n```\n\n\
    The following code snippet illustrates how you can create a tuple that contains\
    \ more than eight elements:\n\n```csharp\nvar lstAuthors = new List<Tuple<int,\
    \ string, string>>(\n    Tuple.Create(1, \"Joydip\", \"India\"),\n    Tuple.Create(2,\
    \ \"Anaraswamy\", \"India\"),\n    Tuple.Create(3, \"Steve Smith\", \"USA\"),\n\
    \    Tuple.Create(4, \"Davin\", \"USA\"),\n    Tuple.Create(5, \"Michalle\", \"\
    USA\")\n);\n```\n\nNow, consider the following piece of code that creates a list\
    \ of tuples: You can use the following piece of code to display the names of the\
    \ authors in the list you created:\n\n```csharp\nforeach (Tuple<int, string, string>\
    \ tuple in lstAuthors)\n{\n    Console.WriteLine(tuple.Item2);\n}\n```\n\n# Pattern\
    \ matching\n\nPattern matching was introduced in C# 7.0. You can use pattern matching\
    \ on any datatype, even custom types. The following code snippet illustrates how\
    \ pattern matching works:\n\n```csharp\nobject obj = \"This is a test\";\nif (obj\
    \ is string str)\n{\n    Console.WriteLine(str);\n}\n```\n\nTo examine how pattern\
    \ matching can be used on custom types as well, let us consider the following\
    \ classes:\n\n```csharp\npublic class Employee\n{\n    public int Id { get; set;\
    \ }\n    public string FirstName { get; set; }\n    public string LastName { get;\
    \ set; }\n}\n\npublic class PartTimeEmployee\n{\n    public double Basic { get;\
    \ set; }\n}\n\npublic class FullTimeEmployee\n{\n    public double Basic { get;\
    \ set; }\n}\n```\n\nThe code, which can be used to instantiate the PartTimeEmployee\
    \ and FullTimeEmployee classes and initialize the data members is as follows:\n\
    \n```csharp\nPartTimeEmployee partTimeEmployee = new PartTimeEmployee();\npartTimeEmployee.Id\
    \ = 1;\npartTimeEmployee.FirstName = \"Joydip\";\n\nFullTimeEmployee fullTimeEmployee\
    \ = new FullTimeEmployee();\nfullTimeEmployee.Id = 1;\nfullTimeEmployee.FirstName\
    \ = \"Joydip\";\nfullTimeEmployee.LastName = \"Kanjil\";\n```\n\nYou can now use\
    \ the expression to check for a type as shown in the code below:\n\n```csharp\n\
    if (partTimeEmployee is Employee)\n{\n    Console.WriteLine(\"Employee\");\n}\n\
    ```\n\n# Local functions\n\nIn C#, local functions are a feature that enable you\
    \ to define a local method inside another method. They are often needed to write\
    \ a function one would use just once. The following code snippet illustrates how\
    \ local functions can be used:\n\n```csharp\nstatic void Main(string[] args)\n\
    {\n    int Sum(int x, int y)\n    {\n        return x + y;\n    }\n\n    Console.WriteLine(Sum(10,\
    \ 20));\n    Console.Read();\n}\n```\n\n# Nullable types and non-nullable reference\
    \ types\n\nThe reference types are nullable by default but value types like int\
    \ are not. Nullable value types were first introduced in C# 2.0. Nullable types\
    \ contain two members: HasValue and Value. While the former is a boolean type\
    \ that denotes if the nullable type has value, the later contains the data inside\
    \ the nullable type. The following code snippet shows how HasValue can be used:\n\
    \n```csharp\nstatic void Main(string[] args)\n{\n    int? x = 10;\n    if (x.HasValue)\n\
    \    {\n        Console.WriteLine(\"The variable contains non-nullable value.\"\
    );\n    }\n    else\n    {\n        Console.WriteLine(\"The variable contains\
    \ null value.\");\n    }\n    Console.Read();\n}\n```\n\nWhen you run the above\
    \ program, the message \"The variable contains non-nullable value.\" will be displayed\
    \ on the console window. Let's now assign null to the integer variable and see\
    \ what happens. The following code snippet illustrates how you can assign a null\
    \ value to the integer variable:\n\n```csharp\nstatic void Main(string[] args)\n\
    {\n    int? x = null;\n    if (x.HasValue)\n    {\n        Console.WriteLine(\"\
    The variable contains non-nullable value.\");\n    }\n    else\n    {\n      \
    \  Console.WriteLine(\"The variable contains null value.\");\n    }\n    Console.Read();\n\
    }\n```\n\nWhen you run the above program, the message \"The variable contains\
    \ null value.\" will be displayed at the console window.\n\n## Unsafe code\n\n\
    Unsafe code is code that is executed outside the context of the Common Language\
    \ Runtime (CLR). You can invoke native functions using pointers. Note that a pointer\
    \ is defined as a variable that contains memory address, that is, it contains\
    \ the address of another variable. To work with unmanaged code in C#, you need\
    \ to take advantage of the unsafe keyword. To work with unsafe, you should check\
    \ the Build | Allow unsafe code checkbox as shown in Figure 13.1.\n\n![](img/13229b4b9ff377325da8c3d3e8c64024_278_0.png)\n"
