    # # Objective


    After reading this chapter, the reader will be able to:


    +   - Understand LINQ and the components of LINQ architectural

    - Explore the features and benefits of LINQ

    - Learn LINQ to Objects

    - Learn LINQ to SQL

    - Learn LINQ to XML

    - Learn LINQ to DataSets

    - Learn LINQ to Entities

    - Learn to program LINQ


    # # Overview of LINQ


    LINQ can be used to query in-memory objects, databases, XML documents, datasets,
    and so on. It is actually the name given to the generic capabilities, which is
    present in the C# language. You can take advantage of LINQ to write queries against
    a database, XML documents, datasets, or a collection of objects that provides
    support for IEnumerable or the generic IEnumerable<T>.


    To query in-memory objects you have LINQ to Objects, for querying datasets you
    should use LINQ to DataSets, for querying databases you should use LINQ to SQL,
    and for querying XML documents you should use LINQ to XML.


    # # Features and benefits of LINQ


    Support for LINQ has been added in .NET Framework 3.0. While LINQ to SQL can only
    be used with SQL Server, LINQ to Entities can be used with Entity Framework. So,
    LINQ to Entities can be used to connect to and work with any underlying database
    that Entity Framework has for.


    LINQ provides the flexibility of using one query language to query data from multiple
    data sources. It provides an elegant way for storage and retrieval of data using
    type-safe queries. You can take advantage of LINQ to connect and work with varied
    data sources using the same query syntax. Since LINQ queries are typesafe and
    validated at compile-time, they reduce the chances of run time errors. LINQ provides
    better support for querying strings compared to the standard SQL string operations.
    LINQ queries are more concise and readable and provide powerful ordering, filtering,
    and grouping capabilities. If your underlying data source changes, you can easily
    port your LINQ queries—they need not be changed.'
