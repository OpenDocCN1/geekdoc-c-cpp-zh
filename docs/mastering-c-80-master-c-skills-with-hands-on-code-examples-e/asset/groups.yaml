    \n## Generalization\n\nGeneralization may be defined as the process of extracting\
    \ the common functionalities of two or more classes and then combining them into\
    \ a generalized class (also known as the base class or the super class). Such\
    \ share functionalities may be in the form of attributes, properties, or methods.\n\
    \nGeneralization represents an is-a relationship. The is-a relationship is used\
