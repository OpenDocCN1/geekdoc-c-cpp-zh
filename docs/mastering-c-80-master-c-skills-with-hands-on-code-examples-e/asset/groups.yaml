  - '[PAGE 189]


    # Objective


    After reading this chapter the reader will be able to:


    +   - Understand exception concepts

    - Understand exception class hierarchy

    - Learn how exception handling works

    - Understand the exception handling blocks

    - Learn how to build a custom exception class

    - Learn the best practices in working with exceptions


    # Exceptions


    Exceptions are errors that occur at runtime, that is, at the time when your program
    is in execution. You should write code in your application to handle exceptions.
    If exceptions are not handled properly, the normal flow of the program will be
    terminated. Exception handling is the act of handling exceptions in an application.
    Note that exception handling is a non-functional requirement and a cross-cutting
    concern in an application.


    An exception instance contains a property named StackTrace. This, in turn, contains
    the method names of the current call stack and other related information, that
    is, the line number where the exception has been thrown, and more. An exception
    instance also contains another property called Message. This property contains
    the error message that relates to the reason of the error that has occurred.


    We''ll learn more about exception handling in the sections that will followin
    the chapter.


    # Exception class hierarchy


    The base class of all exception classes in .NET is System.Exception. The System.Exception
    class in turn extends the System.Object class. All the classes in the exception
    class hierarchy are derived some way or the other from this class. The System.ApplicationException
    and System.SystemException classes inherit the System.Exception class.'
