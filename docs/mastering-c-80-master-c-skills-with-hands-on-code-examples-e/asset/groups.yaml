- md: "\n# Access specifiers\n\nAccess specifiers are accessibility levels that can\
    \ be applied to a class or members of the class. So, you can have access specifiers\
    \ for a class, properties or variables or objects inside the class and even methods\
    \ of the class. Such accessibility levels are used to control access to a class\
    \ or its members. In this section, we will learn how to work with access specifiers.\n\
    \nAccess specifiers in a class are used to control the accessibility levels of\
    \ the class. A class can have public, private, or protected accessibility levels.\
    \ If the accessibility level of a class is public, the class is accessible from\
    \ within the same assembly or outside of the assembly. Refer to the code snippet\
    \ given below, which shows a class having its access specifier marked as public:\n\
    \n```\npublic class MyClass\n{\n    // Members of the class\n}\n```\n\nSince the\
    \ MyClass is public, you can extend the class or create an instance of it in the\
    \ same or any other assembly. Similarly, if the access specifier of the member\
    \ of a class is marked as public, you can access the member using an instance\
    \ of the class from within the same assembly or another assembly that references\
    \ the assembly in which the class has been declared. The code snippet given below\
    \ shows a class having a public member in it:\n\n```\npublic class MyClass\n{\n\
    \    public int x;\n}\n```\n\nSince the member of the class MyClass is public\
    \ as shown in the code snippet above, you can access the public member using an\
    \ instance of the class.\n\nIf the accessibility of a class is private, the class\
    \ cannot be extended or accessed from outside of the program. The rule applies\
    \ to a class member this, that is, if a class is private, it will not be available\
    \ to a subclass of the class but can be accessed through a public method of the\
    \ same class.\n\nThe class MyClass given below is marked with the private access\
    \ specifier:\n\n```\nprivate class MyClass\n{\n```\n\n# Object-Oriented Programming–Part\
    \ 1\n\n```\n//Members of the class\n```\n\n```\n}\n```\n\nNow, if you try creating\
    \ an instance of this class, there would be a compile-time error saying, The class\
    \ MyClass is inaccessible due to its protection level. A private class can neither\
    \ be instantiated nor inherited. A good example of using a private class is when\
    \ you would like to hide the internal details of a class for security reasons.\
    \ The code snippet given below illustrates a typical use case where a private\
    \ class can be used to encapsulate the implementation of a node:\n\n```\npublic\
    \ class DoubleLinkedList\n{\n//The Node class is accessible from here\nNode prevNode\
    \ = new Node();\nNode nextNode = new Node();\nprivate class Node\n{\n//Members\
    \ of the Node class\n}\n}\n}\n```\n\nIn other words, you can take advantage of\
    \ the private access specifier to hide the implementation details for security\
    \ reasons. If the accessibility of a class is marked as protected, the class can\
    \ be extended by its subclass but cannot be instantiated from outside.\n\nThere\
    \ are two more access specifiers that can be applied to a class member: protected\
    \ internal and private protected. Note that you cannot apply protected internal\
    \ or private protected access specifier to a class.\n\nIf a class member is marked\
    \ using the protected internal access specifier, the class member can be accessed\
    \ from within the same assembly in which it is declared or from within a class\
    \ that extends this class in another assembly. The code snippet given below illustrates\
    \ a protected internal member in a class:\n\n```\npublic class Base\n{\nprotected\
    \ internal int number = 0;\n}\n```\n\n```\npublic class Derived : Base\n{\n  \
    \  public void ResetValue()\n    {\n        number = 0;\n    }\n}\n```\n\nThe\
    \ protected internal member of the Base class is accessible from a Derived class\
    \ in the same assembly or from another assembly using an instance of the derived\
    \ type. Here's another example of a protected internal member of a class—this\
    \ time the member is a method:\n\n```\npublic class MyClass\n{\n    protected\
    \ internal int x;\n    protected internal void Display()\n    {\n        Console.WriteLine(\"\
    The value of x is: \" + x);\n    }\n}\n```\n\nIf the access specifier of a class\
    \ member is marked private protected, the member can only be accessed from the\
    \ same assembly in which it is declared through code or a class that extends this\
    \ class in the same assembly. The code snippet given below illustrates how a private\
    \ protected member of a base class can be accessed from its derived class:\n\n\
    ```\npublic class Base\n{\n    private protected int number = 0;\n}\n\npublic\
    \ class Derived : Base\n{\npublic void ResetValue()\n{\n    number = 0;\n}\n```\n\
    \nYou can also specify given protected access specifier to a method of a class.\
    \ The code snippet given below illustrates this. The ResetValue method in the\
    \ Derived class is marked using the private protected access specifier:\n\n```\n\
    public class Base\n{\n    private protected int number = 0;\n}\n\npublic class\
    \ Derived : Base\n{\n    private protected void ResetValue()\n{\n    number =\
    \ 0;\n}\n```\n\nNote that for public, private, or protected access specifiers,\
    \ the same rule applies to class and its members (member data or member functions\
    \ or methods).\n\n# Constructors in C#\n\nA class comprises of member data or\
    \ data member and member functions. Member functions of a class are also known\
    \ as methods. A constructor is a special method of a class that contains initialization\
    \ code used to initialize the data members of the class. Unlike other methods,\
    \ a constructor cannot return any value. A constructor has the same name as the\
    \ class name and is called automatically when the class is instantiated. However,\
    \ not all constructors behave the same way. We will learn more about this as we\
    \ progress in this chapter.\n\n# 44 Mastering C# 8.0\n\nHere's how the syntax\
    \ of a constructor looks:\n\n```\n[modifier] name (parameters)\n{\n    // constructor\
    \ code\n}\n```\n\nA constructor can have one of the following modifiers:\n\n-\
    \ public\n- protected\n- internal\n- private\n- extern\n\nWe will learn more about\
    \ each of these modifiers later in this chapter.\n\nA constructor can be of two\
    \ types: static and non-static. Static constructors are also known as class constructors\
    \ and are called when a static member of the class is accessed for the first time.\
    \ Non-static constructors are also called instance constructors and are called\
    \ each time the class is instantiated. Static constructors are invoked before\
    \ instance constructors. Let's understand all of this with an example in each\
    \ case.\n\n# Instance constructors or non-static constructors\n\nNon-static or\
    \ instance constructors of a class are used to initialize the non-static members\
    \ of the class. Such constructors are also known as type constructors or type\
    \ initializers. Note that there can be multiple instance constructors in a class—differing\
    \ in the signature. This feature is known as constructor overloading. We will\
    \ learn more about constructor overloading later in this chapter. The default\
    \ constructor of a class is also an instance constructor.\n\n# Default constructor\n\
    \nAny class should have a minimum of one constructor. If you don't define a constructor\
    \ for a class, C# automatically provides one. This constructor is known as the\
    \ default constructor. A default constructor of a class doesn't accept parameters.\
    \ There can be one and only one default constructor in a class. A default constructor\
    \ of a class is invoked when an instance of the class is created using the new\
    \ operator and no arguments are passed to it. Here is an example that illustrates\
    \ how a default constructor can be used:\n\n```\nclass MyClass\n{\n    public\
    \ int x;\n    public int y;\n\n    public MyClass()\n    {\n        x = 0;\n \
    \       y = 0;\n    }\n}\n```\n\n```\nclass Program\n{\n    static void Main(string[]\
    \ args)\n    {\n        MyClass myClass = new MyClass();\n        Console.WriteLine(\"\
    x = \" + myClass.x);\n        Console.WriteLine(\"y = \" + myClass.y);\n     \
    \   Console.Read();\n    }\n}\n```\n\nRefer to the preceding code example. The\
    \ data members of the class MyClass have been initialized in the default constructor\
    \ of the class. The Console.WriteLine statements will print 0 in the console for\
    \ the integer variables x and y:\n\n![](img/13229b4b9ff377325da8c3d3e8c64024_64_0.png)\n\
    \nFigure 3.2\n"
  mdcn: "\n\n# 访问修饰符\n\n访问修饰符是可以应用于类或类成员的访问级别。因此，你可以为类、属性、变量、类内部的对象甚至类方法设置访问修饰符。此类访问级别被用于控制对类或其成员的访问。在本节中，我们将学习如何使用访问修饰符。\n\
    \n类中的访问修饰符用于控制类的访问级别。类可以具有 public（公共）、private（私有）或 protected（保护）访问级别。如果类的访问级别为\
    \ public，则可以从同一个程序集内部或程序集外部访问。参考下面的代码片段，它显示了一个访问修饰符标记为 public 的类：\n\n```\npublic\
    \ class MyClass\n{\n    // 类的成员\n}\n```\n\n由于 MyClass 是 public 的，你可以在相同或任何其他程序集中扩展该类或创建它的实例。同样，如果类成员的访问修饰符标记为\
    \ public，你可以通过同一个程序集内或引用了该类所在程序集的程序集中的类实例来访问该成员。下面的代码片段显示了一个具有 public 成员的类：\n\n\
    ```\npublic class MyClass\n{\n    public int x;\n}\n```\n\n如上面的代码片段所示，由于类 MyClass\
    \ 的成员是 public，你可以通过类的实例访问该 public 成员。\n\n如果类的访问级别为 private，则无法从程序外部扩展或访问该类。该规则同样适用于类成员，也就是说，如果一个类是\
    \ private 的，它对该类的子类是不可见的，但可以通过同类的 public 方法进行访问。\n\n下面的 MyClass 类被标记为 private\
    \ 访问修饰符：\n\n```\nprivate class MyClass\n{\n```\n\n# 面向对象编程 – 第一部分\n\n```\n// 类的成员\n\
    ```\n\n```\n}\n```\n\n现在，如果你尝试创建此类的实例，将出现编译错误，提示为：“类 MyClass 由于其保护级别而不可访问”。private\
    \ 类既不能被实例化，也不能被继承。使用 private 类的一个良好例子是出于安全考虑想要隐藏类的内部细节。下面的代码片段说明了一个典型的用例，其中可以使用\
    \ private 类来封装节点的实现：\n\n```\npublic class DoubleLinkedList\n{\n// 从这里可以访问 Node\
    \ 类\nNode prevNode = new Node();\nNode nextNode = new Node();\nprivate class Node\n\
    {\n// Node 类的成员\n}\n}\n}\n```\n\n换句话说，你可以利用 private 访问修饰符出于安全考虑隐藏实现细节。如果类的访问级别标记为\
    \ protected，则该类可以被其子类扩展，但不能从外部实例化。\n\n还有两个访问修饰符可以应用于类成员：protected internal 和 private\
    \ protected。注意，你不能对类应用 protected internal 或 private protected 访问修饰符。\n\n如果类成员使用\
    \ protected internal 访问修饰符标记，则可以从该成员定义所在的程序集内部，或者从另一个程序集中扩展了该类的类内部访问该成员。下面的代码片段说明了类中的\
    \ protected internal 成员：\n\n```\npublic class Base\n{\nprotected internal int\
    \ number = 0;\n}\n```\n\n```\npublic class Derived : Base\n{\n    public void\
    \ ResetValue()\n    {\n        number = 0;\n    }\n}\n```\n\nBase 类的 protected\
    \ internal 成员可以从同一程序集中的 Derived 类访问，也可以通过派生类型的实例从另一个程序集访问。这里是类的 protected internal\
    \ 成员的另一个例子——这次成员是一个方法：\n\n```\npublic class MyClass\n{\n    protected internal\
    \ int x;\n    protected internal void Display()\n    {\n        Console.WriteLine(\"\
    The value of x is: \" + x);\n    }\n}\n```\n\n如果类成员的访问修饰符标记为 private protected，则只能通过定义该成员的同一程序集中的代码或同一程序集中扩展该类的类来访问该成员。下面的代码片段说明了如何从派生类访问基类的\
    \ private protected 成员：\n\n```cs\npublic class Base\n{\n    private protected\
    \ int number = 0;\n}\n\npublic class Derived : Base\n{\npublic void ResetValue()\n\
    {\n    number = 0;\n}\n```\n\n你也可以为类的方法指定的 protected 访问修饰符。下面的代码片段说明了这一点。Derived\
    \ 类中的 ResetValue 方法使用 private protected 访问修饰符标记：\n\n```cs\npublic class Base\n\
    {\n    private protected int number = 0;\n}\n\npublic class Derived : Base\n{\n\
    \    private protected void ResetValue()\n{\n    number = 0;\n}\n```\n\n注意，对于\
    \ public、private 或 protected 访问修饰符，相同的规则适用于类及其成员（成员数据或成员函数或方法）。\n\n# C# 中的构造函数\n\
    \n类由成员数据或数据成员以及成员函数组成。类的成员函数也称为方法。构造函数是类的一种特殊方法，包含用于初始化类数据成员的代码。与其他方法不同，构造函数不能返回任何值。构造函数的名称与类名相同，并在类实例化时自动被调用。然而，并不是所有构造函数的行为都相同。随着本章的进行，我们将学习更多内容。\n\
    \n# 44 精通 C# 8.0\n\n构造函数的语法格式如下：\n\n```\n[modifier] name (parameters)\n{\n   \
    \ // 构造函数代码\n}\n```\n\n构造函数可以是以下修饰符之一：\n\n- public\n- protected\n- internal\n\
    - private\n- extern\n\n我们将在本章后面详细介绍这些修饰符。\n\n构造函数分为两种类型：静态（static）和非静态（non-static）。静态构造函数称为类构造函数，在首次访问静态成员时调用。非静态构造函数称为实例化构造函数，每次实例化类时调用。静态构造函数在实例化构造函数之前调用。让我们通过每个示例来理解这一切。\n\
    \n# 实例化构造函数或非静态构造函数\n\n非静态或实例化构造函数用于初始化类的非静态成员。此类构造函数也称为类型构造函数或类型初始化器。注意，类中可以有多个签名不同的实例化构造函数。这种特性被称为构造函数重载。我们将在本章学习更多关于构造函数重载的知识。类的默认构造函数也是实例化构造函数。\n\
    \n# 默认构造函数\n\n任何类至少应该有一个构造函数。如果你没有为类定义构造函数，C# 会自动提供一个。此构造被称为默认构造函数。类的默认构造函数不接受参数。类中只有一个默认构造函数。在使用\
    \ 运算符创建实例且不传递参数时，会调用默认构造函数。下面的示例说明了如何使用默认构造函数：\n\n```cs\nclass MyClass\n{\n  \
    \  public int x;\n    public int y;\n\n    public MyClass()\n    {\n        x\
    \ = 0;\n        y = 0;\n    }\n}\n```\n\n```cs\nclass Program\n{\n    static void\
    \ Main(string[] args)\n    {\n        MyClass myClass = new MyClass();\n     \
    \   Console.WriteLine(\"x = \" + myClass.x);\n        Console.WriteLine(\"y =\
    \ \" + myClass.y);\n        Console.Read();\n    }\n}\n```\n\n参考前面的代码示例。MyClass\
    \ 类的数据成员已在默认构造函数中初始化。Console.WriteLine 语句将在控制台中为整数变量 x 和 y 打印 0：\n\n![](img/13229b4b9ff377325da8c3d3e8c64024_64_0.png)\n\
    \n图 3.2\n\n"
