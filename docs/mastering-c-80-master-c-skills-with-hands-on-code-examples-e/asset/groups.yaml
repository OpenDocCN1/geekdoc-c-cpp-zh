- md: "\nThe compiler generates a try...finally block from the using block as shown\
    \ in the below code snippet:\n\n```sharp\ntry {\n    SqlConnection connection\
    \ = new SqlConnection(\"Specify your connection string here\");\n    //Some code\n\
    } finally {\n    //Write any cleanup code here\n}\n```\n\nNote that the using\
    \ block is just an alternative for try...finally block. You should write your\
    \ exception handling code even if you are using the using block. You can wrap\
    \ the using block inside a try block as shown in the below code snippet:\n\n```sharp\n\
    try {\n    using(SqlConnection connection = new SqlConnection(\"Specify your connection\
    \ string here\")) {\n    //Some code\n} catch(Exception ex) {\n    //Write code\
    \ here to handle the exception\n}\n```\n\n## Exception filters\n\nException filter\
    \ is a concept that has been introduced with C# 6.0. You can take advantage of\
    \ Exception filter to specify conditions in your catch blocks. So, you can leverage\
    \ Exception filter to allow a catch block to be executed only if a certain condition\
    \ is true. Let's understand this with an example. The code snippet below illustrates\
    \ how you can work with Exception filter in C#:\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    try\n    {\n        throw new ArithmeticException(\"ErrorCode001\"\
    );\n    }\n    catch (ArithmeticException ae) when (ae.Message == \"ErrorCode002\"\
    )\n    {\n        Console.WriteLine(\"Error Message from first catch block: \"\
    \ + ae);\n    }\n    catch (Exception ex) when (ex.Message == \"ErrorCode001\"\
    )\n    {\n        Console.WriteLine(\"Error Message from second catch block: \"\
    \ + ex);\n    }\n\n    Console.Read();\n}\n```\n\nRefer to the preceding code\
    \ snippet. Note the usage of the conditional statement in the catch blocks. When\
    \ the keyword acts as a predicate expression. If this predicate expression is\
    \ true, the catch block is executed.\n\nIn the try block, an exception of type\
    \ ArithmeticException is thrown. However, even though the first catch block can\
    \ handle an exception of type ArithmeticException, the condition specified in\
    \ the when statement fails. The text stored in the Message property doesn't match\
    \ with the condition specified in the statement.\n\nThe second catch block is\
    \ executed since it handles exceptions of type ArithmeticException and Exception\
    \ is the base class of all exception classes in the exception hierarchy. Furthermore,\
    \ the when statement in the second catch block is true the text stored in the\
    \ Message property of the exception instance is ErrorCode001.\n\n# 184 Mastering\
    \ C# 8.0\n\nWhen you execute the above program, here's how the output would look\
    \ like (Figure 9.5):\n\n![](img/13229b4b9ff377325da8c3d3e8c64024_203_0.png)\n\n\
    Figure 9.5\n\nLet's understand exception filters with another example. Consider\
    \ the code snippet given below that illustrates how a thrown exception can be\
    \ handled in a catch block using exception filter:\n\n```csharp\npublic static\
    \ void Main()\n{\n    try\n    {\n        throw new Exception(\"E002\");\n   \
    \ }\n    catch(Exception ex) when(ex.Message == \"E001\")\n    {\n        Console.WriteLine(\"\
    Exception with error code E001 handled.\");\n    }\n    catch(Exception ex) when(ex.Message\
    \ == \"E002\")\n    {\n        Console.WriteLine(\"Exception with error code E002\
    \ handled.\");\n    }\n    Console.Read();\n}\n```\n\nWhen you execute the above\
    \ program, a text message will be displayed in the console window (see Figure\
    \ 9.6):\n\n![](img/13229b4b9ff377325da8c3d3e8c64024_203_1.png)\n\nFigure 9.6\n\
    \n## Best practices\n\nThis section discusses the recommended practices that should\
    \ be adhered to when working with exceptions in C#.\n\nExceptions should be used\
    \ only when they are needed. You should never swallow exceptions in your code.\
    \ Rather, you can just use the throw statement to propagate the exception upwards\
    \ in the call hierarchy.\n\nSince exception handling is costly as far as performance\
    \ is concerned, you should try to write code that avoids exception. As an example,\
    \ if you try to close a connection object that has already been closed, it might\
    \ throw an InvalidOperationException. You can avoid it by writing a construct\
    \ as shown in the code snippet given below:\n\n```csharp\nif (connection.State\
    \ != ConnectionState.Closed)\n{\n    connection.Close();\n}\n```\n\nRethrow exception\
    \ is expensive and if you rethrow the way it has been shown in the below code\
    \ snippet, the stack trace information is lost:\n\n```csharp\ntry\n{\n    //Write\
    \ code here that might throw an exception\n}\ncatch(Exception ex)\n{\n    throw\
    \ ex;\n}\n```\n\nRather, you can use the throw statement to preserve the stack\
    \ trace information as shown in the below code snippet:\n\n```csharp\ntry\n{\n\
    \    //Write code here that might throw an exception\n}\ncatch(Exception ex)\n\
    {\n  throw;\n}\n```\n\nMastering C# 8.0\n\nThe business rules in your application\
    \ should not be driven using exceptions, that is, exceptions should not be used\
    \ in an application to propagate business rules as shown in the below code snippet:\n\
    \n```csharp\ntry {\n  new OrderBL().GetOrder(1009);\n} catch(Exception ex) {\n\
    \  new OrderBL().ReadAll();\n}\n```\n\nYou should never use the throw statement\
    \ to control flow.\n\n# Conclusion\n\nThis chapter presented a discussion on exception,\
    \ why it is important, and how to work with it. In the next chapter, we'll explore\
    \ asynchronous and parallel programming.\n\n# Questions\n\n1. What are exceptions?\
    \ Why is it important?\n2. What is the base class of all exception classes? Which\
    \ class should you extend?\n3. What is exception filter? Give an example.\n4.\
    \ Explain try...catch, and finally with an example.\n5. Explain rethrow.\n6. List\
    \ the best practices that should be followed when working with exceptions.\n7.\
    \ Which of the following statements are true?\n\na. Exceptions should be used\
    \ sparingly.\nb. A finally block is executed only if an exception has occurred.\n\
    c. You should extend Exception class to create custom.\nd. The using statement\
    \ is a short alternative to try...catch blocks.\ne. The runtime automatically\
    \ throws an instance of Application when there is an error.\n"
