    \ of such levels exist?\n\n## CHAPTER 5: Properties and Indexers in C#\n\nProperties\
    \ and indexers are two of the most important concepts in the C# programming language.\
    \ This chapter presents a discussion on properties (also known as smart fields)\
    \ and indexers (also known as smart arrays) in C#, with relevant code examples\
    \ to illustrate the concepts covered.\n\n## Structure\n\nIn this chapter, we will\
    \ discuss the following points:\n\n- Properties\n    * Programming properties\
    \ in C#\n        * Non-static properties\n        * Static properties\n- Indexers\n\
    \    * Programming indexers in C#\n        * Polymorphic indexers\n        * Abstract\
    \ indexers\n\n# Objective\n\nAfter reading this chapter, the reader will be able\
    \ to:\n\n- Understand properties and how to program them in C#.\n    - Learn how\
    \ to work with non-static properties.\n    - Learn how to work with static properties.\n\
    - Understand indexers and how to program them in C#.\n    - Learn how to program\
    \ a multi-dimensional indexer.\n\n# Properties in C#\n\nProperties are also called\
    \ smart fields and they are used to provide access to the members of a class.\
    \ A property is like a virtual field and contains get and set accessors to retrieve\
    \ or set values to the data members of a class. A property of a class can either\
    \ be static or non-static. This implies that you can access properties of a class\
    \ either using the class name (if the property is static) or by using an instance\
    \ of the class (if the property is non-static). The set accessor of a property\
    \ in C# has an implicit parameter name value.\n\nThe syntax for defining properties\
    \ is as follows:\n\n```\n<access_modifier><return_type><property_name>\n\nget\n\
    {\n    // some code\n}\n\nset\n{\n    // some code\n}\n```\n\nIn the preceding\
    \ syntax, please note the following points:\n\n- access_modifier can be public,\
    \ private, protected, or internal.\n- return_type can be any valid C# type (primitive\
    \ or user-defined).\n- property_name can be any name (user-defined).\n\n# Properties\
    \ and Indexers in C#\n\nThe code snippet given below shows a class named Customer\
    \ with read-only as well as read-write properties:\n\n```\npublic class Customer\n\
    {\n    public int Id { get; }\n    public string FirstName { get; set; }\n   \
    \ public string LastName { get; set; }\n    public string Address { get; set;\
    \ }\n}\n```\n\n# Restrictions on properties\n\nIt should be noted that a property\
    \ cannot be overloaded. This implies that you can have only a single get or a\
    \ set accessor in a class. The code example given below illustrates this:\n\n\
    ```\npublic class PropertyDemo\n{\n    int _id;\n    public int Id\n    {\n  \
    \      get {\n            return _id;\n        }\n        set {\n            _id\
    \ = value;\n        }\n        get {\n            return 0;\n        }\n    }\n\
    }\n```\n\nWhen you compile the previous code, an error will be displayed, stating:\n\
    Property accessor already defined\n\nA property cannot be passed to a method as\
    \ a parameter using a ref or out parameter. If you try doing this, a compilation\
    \ error will be displayed.\n\n# Accessor\n\nAn accessor is used to restrict access\
    \ to a property. There are two types of accessors, that is, get accessor and set\
    \ accessor. Here's the list of the types of properties supported by the C# language:\n\
    \n- Read-only properties: This property contains only the get accessor.\n- Write-only\
    \ properties: This property contains only the set accessor.\n- Read and write\
    \ properties: This property contains both get and set accessor.\n- Auto-implemented\
    \ properties: These were introduced in C# 3.0.\n\n# Non-static properties\n\n\
    Non-static properties are those that can be accessed using an instance of a class.\
    \ A non-static property cannot be accessed by static members of a class. The code\
    \ listed below illustrates how non-static properties are defined in a class:\n\
    \n```csharp\nclass Employee\n{\n    private int _empId;\n    private string _firstName;\n\
    \    private string _lastName;\n\n    public int EmployeeId\n    {\n        get\n\
    \        {\n            return _empId;\n        }\n        set\n        {\n  \
    \          _empId = value;\n        }\n    }\n    public string FirstName\n  \
    \  {\n        get\n        {\n            return _firstName;\n        }\n    \
    \    set\n        {\n            _firstName = value;\n        }\n    }\n    public\
    \ string LastName\n    {\n        get\n        {\n            return _lastName;\n\
    \        }\n        set\n        {\n            _lastName = value;\n        }\n\
    \    }\n}\n```\n\nThe new versions of the C# language enable you to use properties\
    \ directly without the need of the private data members as shown in the code snippet\
    \ given below:\n\n```csharp\nclass Employee\n{}\n```\n\n```csharp\npublic int\
    \ EmployeeId\n{\n    get;set;\n}\n```\n\n```csharp\npublic string FirstName\n\
    {\n    get;set;\n}\n```\n\n```csharp\npublic string LastName\n{\n    get;set;\n\
    }\n```\n\nWhile the code snippet mentioned above, note that the properties shown\
    \ are public—they can be accessed outside of the class. Employee employee = new\
    \ Employee();\n\nemployee.EmployeeId = 1;\n\nemployee.FirstName = \"John\";\n\n\
    employee.LastName = \"Doe\";\n\nWith the new versions of C#, you no longer need\
    \ to create the data members. You can take advantage of auto-properties as shown\
    \ in the code snippet below:\n\n```csharp\nclass Employee\n{\n    public int EmployeeId\
    \ { get; set; }\n    public string FirstName { get; set; }\n    public string\
    \ LastName { get; set; }\n}\n```\n\n# Static properties\n\nStatic properties are\
    \ defined using the keyword static and they can be accessed using the class name.\
    \ The code snippet below shows how they can be defined for a class:\n\n```csharp\n\
    class LogManager\n{\n    public static string FileName { get; set; }\n\n    public\
    \ static string Path { get; set; }\n}\n```\n\nThe code snippet mentioned above\
    \ shows a custom class LogManager that contains two static properties. Here's\
    \ how the static properties of the LogManager can be accessed using the class\
    \ name:\n\n```csharp\nLogManager.FileName = \"Log.txt\";\nLogManager.Path = @\"\
    D:\\Logs\\\";\n```\n\n# Restricting visibility\n\nSo far, we have used public\
    \ properties, however, you can restrict the visibility of the properties of a\
    \ class as well. By restricting the visibility of the members of a class, you\
    \ can allow or deny the members of a class to be accessed from outside of the\
    \ class. The code snippet given below shows how the visibility of properties of\
    \ a class can be restricted to the same assembly:\n\n```csharp\nclass Author\n\
    {\n    internal int AuthorId { get; set; }\n\n    internal string FirstName {\
    \ get; set; }\n\n    internal string LastName { get; set; }\n}\n```\n\nProperties\
    \ of a class can also be private as shown in the code snippet below:\n\n```csharp\n\
    class Author\n{}\n```\n\n```csharp\nprivate int AuthorId { get; set; }\nprivate\
    \ string FirstName { get; set; }\nprivate string LastName { get; set; }\n```\n\
    \nPrivate properties of a class cannot be directly accessed by an instance of\
    \ the class. Similar to other members of a class, you need a public member to\
    \ access a private property in a class.\n\nPrivate properties of a class cannot\
    \ be inherited. Properties of a class can also be protected. In this case, although\
    \ you cannot access the property directly using an instance of a class, the property\
    \ can be inherited to a derived class. An example, showing protected properties\
    \ can be defined in a class, as is follows\n\n```csharp\nclass Author\n{\n   \
    \ protected int AuthorId { get; set; }\n    protected string FirstName { get;\
    \ set; }\n    protected string LastName { get; set; }\n}\n```\n\n# Properties\
    \ and inheritance\n\nIn this section, we'll learn how properties work in inheritance.\
    \ We've learnt inheritance in Chapter 4: Object-Oriented Programming – Part 2.\
    \ The non-private properties of the Base class are inherited to its Derived classes.\
    \ An example to illustrate this as follows:\n\n```csharp\nclass Base\n{\npublic\
    \ int _id;\npublic int Id\n{\n    get\n{\n        Console.WriteLine(\"Get accessor\
    \ of the Base class called.\");\nreturn _id;\n}\n}\n```"
  mdcn: "\n\n- 6. 单一继承和多级继承之间的区别是什么？\n- 7. 什么是混合继承？C# 支持它吗？\n- 8. 封装和抽象之间的区别是什么？\n\
    - 9. 什么是多态？多态有哪些类型？\n- 10. 什么是可见性级别？存在多少种此类级别？\n\n## 第 5 章：C# 中的属性和索引器\n\n属性和索引器是\
    \ C# 编程语言中最重要的概念之一。本章将讨论 C# 中的属性（也称为智能字段）和索引器（也称为智能数组），并提供相关的代码示例来解释所涵盖的概念。\n\n\
    ## 结构\n\n在本章中，我们将讨论以下要点：\n\n- 属性\n    * 在 C# 中编写属性\n        * 非静态属性\n        *\
    \ 静态属性\n- 索引器\n    * 在 C# 中编写索引器\n        * 多态索引器\n        * 抽象索引器\n\n# 目标\n\n\
    读完本章后，读者将能够：\n\n- 理解属性以及如何在 C# 中编写属性。\n    - 学习如何处理非静态属性。\n    - 学习如何处理静态属性。\n\
    - 理解索引器以及如何在 C# 中编写索引器。\n    - 学习如何编写多维索引器。\n\n# C# 中的属性\n\n属性也被智能字段，用于提供对类成员的访问。属性类似于虚拟字段，包含\
    \ `get` 和 `set` 访问器，用于检索或设置类数据成员的值。类的属性可以是静态的，也可以是非静态的。这意味着你可以使用类名（如果属性是静态的）或类的实例（如果属性是非静态的）来访问类的属性。C#\
    \ 中属性的 `set` 访问器有一个隐式的参数名称值。\n\n定义属性的语法如下：\n\n```\n<access_modifier><return_type><property_name>\n\
    \nget\n{\n    // some code\n}\n\nset\n{\n    // some code\n}\n```\n\n在上述语法中，请注意以下几点：\n\
    \n- access_modifier 可以 `public`、`private`、`protected` 或 `internal`。\n- return_type\
    \ 可以任何有效的 C# 类型（基本类型或用户定义类型）。\n- property_name 可以任意命名（用户定义）。\n\n# C# 中的属性和索引器\n\
    \n下面的代码片段显示了一个名为 `Customer` 的类，它具有只读和读写属性：\n\n```\npublic class Customer\n{\n\
    \    public int Id { get; }\n    public string FirstName { get; set; }\n    public\
    \ string LastName { get; set; }\n    public string Address { get; set; }\n}\n\
    ```\n\n# 属性的限制\n\n应该注意的是，属性不能被重载。这意味着在类中只能有一个 `get` 或 `set` 访问器。下面提供的代码示例说明了这一点：\n\
    \n```csharp\npublic class PropertyDemo\n{\n    int _id;\n    public int Id\n \
    \   {\n        get {\n            return _id;\n        }\n        set {\n    \
    \        _id = value;\n        }\n        get {\n            return 0;\n     \
    \   }\n    }\n}\n```\n\n当你编译上述代码时，将显示错误：\nProperty accessor already defined（属性访问器已定义）\n\
    \n属性不能作为参数使用 `ref` 或 `out` 关键字传递给方法。如果你尝试这样做，将显示编译错误。\n\n# 访问器\n\n访问器用于限制对属性的访问。访问器有两种类型，即\
    \ `get` 访问器和 `set` 访问器。这里是 C# 语言支持的属性类型列表：\n\n- 只读属性：此属性只包含 `get` 访问器。\n- 只写属性：此属性只包含\
    \ `set` 访问器。\n- 读写属性：此属性同时包含 `get` 和 `set` 访问器。\n- 自动实现属性：这些是在 C# 3.0 中引入的。\n\n\
    # 非静态属性\n\n非静态属性可以使用类的实例进行访问。非静态属性不能通过类的静态成员访问。下面列出的代码说明如何在类中定义非静态属性：\n\n```csharp\n\
    class Employee\n{\n    private int _empId;\n    private string _firstName;\n \
    \   private string _lastName;\n\n    public int EmployeeId\n    {\n        get\n\
    \        {\n            return _empId;\n        }\n        set\n        {\n  \
    \          _empId = value;\n        }\n    }\n    public string FirstName\n  \
    \  {\n        get\n        {\n            return _firstName;\n        }\n    \
    \    set\n        {\n            _firstName = value;\n        }\n    }\n    public\
    \ string LastName\n    {\n        get\n        {\n            return _lastName;\n\
    \        }\n        set\n        {\n            _lastName = value;\n        }\n\
    \    }\n}\n```\n\nC# 语言的新版本允许你直接使用属性，而不需要私有数据成员，如下面的代码片段所示：\n\n```csharp\nclass\
    \ Employee\n{}\n```\n\n```csharp\npublic int EmployeeId\n{\n    get;set;\n}\n\
    ```\n\n```csharp\npublic string FirstName\n{\n    get;set;\n}\n```\n\n```csharp\n\
    public string LastName\n{\n    get;set;\n}\n```\n\n在上述代码片段中，请注意显示的属性是公共的——它们可以在类外部访问。`Employee\
    \ employee = new Employee();`\n\n`employee.EmployeeId = 1;`\n\n`employee.FirstName\
    \ = \"John\";`\n\n在 C# 的新版本中，不再需要创建私有数据成员。你可以利用属性，如下代码片段所示：\n\n```csharp\nclass\
    \ Employee\n{\n    public int EmployeeId { get; set; }\n    public string FirstName\
    \ { get; set; }\n    public string LastName { get; set; }\n}\n```\n\n# 静态属性\n\n\
    静态属性使用 `static` 关键字定义，并可以使用类名访问。下面的代码显示了如何在类中定义它们：\n\n```csharp\nclass LogManager\n\
    {\n    public static string FileName { get; set; }\n\n    public static string\
    \ Path { get; set; }\n}\n```\n\n上述代码片段显示了一个包含两个静态属性的自定义类 `LogManager`。这里是使用类名访问\
    \ `LogManager` 静态属性的方法：\n\n```csharp\nLogManager.FileName = \"Log.txt\";\nLogManager.Path\
    \ = @\"D:\\Logs\\\";\n```\n\n# 限制性\n\n到目前我们使用了公共属性，但你也可以限制类属性的可见性。通过限制类成员的可见性，你可以允许或拒绝外部访问。代码如何将可见性限制在程序集内：\n\
    \n```csharp\nclass Author\n{\n    internal int AuthorId { get; set; }\n\n    internal\
    \ string FirstName { get; set; }\n\n    internal string LastName { get; set; }\n\
    }\n```\n\n类的属性也可以是私有的，如下代码片段所示：\n\n```csharp\nclass Author\n{}\n```\n\n```csharp\n\
    private int AuthorId { get; set; }\nprivate string FirstName { get; set; }\nprivate\
    \ string LastName { get; set; }\n```\n\n私有属性无法通过类的实例直接访问。与其他类的成员类似，你需要一个公共成员来访问类的私有属性。\n\
    \n私有属性不能被继承。类的属性也可以是保护的。在这种，虽然不能通过类的实例直接访问属性，但该属性可以继承到派生类。一个在类中定义保护属性的示例如下：\n\n\
    ```csharp\nclass Author\n{\n    protected int AuthorId { get; set; }\n    protected\
    \ string FirstName { get; set; }\n    protected string LastName { get; set; }\n\
    }\n```\n\n# 属性与继承\n\n在本节中，我们将学习属性如何在继承中工作。我们在第4章面向对象编程——部分2中学习了继承。基类的非私有属性会被继承到它的派生类。说明此点的示例如下：\n\
    \n```csharp\nclass Base\n{\npublic int _id;\npublic int Id\n{\n    get\n{\n  \
    \      Console.WriteLine(\"调用了基类的 get 访问器。\");\nreturn _id;\n}\n}\n```\n"
