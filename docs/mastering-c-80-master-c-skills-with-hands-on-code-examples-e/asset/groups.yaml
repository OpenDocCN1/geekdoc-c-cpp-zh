    \n## 聚合 (Aggregation)\n\n如果两个对象之间存在关联关系，其中一个对象对另一个拥有所有权，则这种关系被称为聚合。聚合是关联的一种特殊形式，也称为弱关联。它是两个类之间的一种单向“拥有”（has-a）关系。然而，尽管存在所有权，但即使你删除了一个对象，另一个仍然存在。换句话说，在聚合关系中，两个实体都将独立生存——删除其中一个不会影响另一个。\n\
    \n聚合关系的一个例子是图书馆和学生之间的关系。虽然图书馆包含了作为其成员的学生，但学生在没有图书馆的情况下也可以存在。下面提供的代码片段说明了如何通过编程方式描述聚合关系：\n\
    \n```java\npublic class Library {\n    private List<Student> members; // 此处描述了聚合关系\n\
    \    public Library() {\n        members = new List<Student>();\n    }\n}\nclass\
    \ Student {\n    int rollNo;\n    private string firstName;\n    private string\
    \ lastName;\n    private string standard;\n    private string section;\n    //\
    \ Student 类的其他成员\n}\n```\n\n## 组合 (Composition)\n\n组合是聚合的一种特殊类型，其中一个对象包含另一个对象，且如果容器对象被删除，被包含的对象就不能存在。因此，如果组合关系中有两个对象，它们之间存在强烈的生命周期依赖关系。聚合表示的是\
    \ *has-a*（拥有）关系，而组合表示的是 *part-of*（部分）关系，用于表示一个类是另一个类的一部分。\n\n*has-a* 关系用于表示一个类的实例包含另一个类或同类实例的引用。*has-a*\
    \ 关系的一个很好的例子是图书馆和学生之间的关系。学生可以在没有图书馆的情况下存在，因此这是聚合关系的一个例子。*part-of*（部分）关系的一个例子是图书馆和书之间的关系。如果没有书，图书馆就不存在了。注意，组合或\
    \ *part-of* 关系更具限制性——被组合的对象（此例中的房间）在没有另一个对象的情况下无法存在。在用图表示组合或聚合时，必须指定方向。该方向用于指定哪个对象包含了被组合的对象。\n\
    \n因此，组合是强关联，而聚合是弱关联。被组合对象的寿命依赖于父对象。图 4.3 显示了关联、聚合和组合之间是如何相互相关的。\n\n![](img/13229b4b9ff377325da8c3d3e8c64024_83_0.png)\n\
    \n组合关系的一个例子是建筑和房间之间的关系。建筑包含房间，如果建筑被毁，房间就不能存在。下面提供的代码片段说明了建筑和房间之间的组合关系：\n\n```java\n\
    public class Building\n{\n    private List<Room> rooms; // 一栋建筑由几个房间组成\n\n   \
    \ public Building()\n{\n        rooms = new List<Room>();\n    }\n}\n```\n\n```java\n\
    class Room\n{\n    int floor;\n    string flatNo;\n}\n```\n\n图 4.4 显示了组合的 UML\
    \ 表示法。\n\n![](img/13229b4b9ff377325da8c3d3e8c64024_84_0.png)\n\n## 泛化 (Generalization)\n\
    \n泛化定义为提取两个或多个类的通用功能的过程，然后将它们合并为一个泛化类（也称为基类或超类）。这些共享功能可以是属性、属性或方法的形式。\n\n泛化表示一种\
    \ *is-a*（是一种）关系。*is-a* 关系用于描述子类是其基类的一部分。超类提取了扩展超类的类的特征（属性和方法），并将它们合并成单一单元——超类。因此，超类是扩展该超类的类的泛化。\n\
    \n例如，考虑人（Person）与学生（Student）之间的关系，以及人与老师（Teacher）之间的关系。老师也是人。因此，人与学生之间、人与老师之间存在泛化关系。泛化通常被称为继承。然而，它们并不是等同的。泛化被定义为将两个或多个类的共享特征（属性、关联或方法）合并为一个泛化类的过程。相反，继承是扩展一个或多个类以创建子类的过程。我们将在本章后面学习更多关于继承的知识。\n\
    \n特化（Specialization）是泛化的反向过程。它是从现有类创建子类的过程。泛化关系存在于以下类型：\n\n* 未分类的类\n- 实现类\n- 接口\n\
    \n我们将在本章后面的“继承” 节中学习更多关于此的内容。图 4.5 显示了泛化的 UML 表示法。\n\n![](img/13229b4b9ff377325da8c3d3e8c64024_85_0.png)\n\
    \n图 4.5\n\n## 实现 (Realization)\n\n实现是抽象的一种特殊形式。实现是抽象的一种特殊形式，其中一个实体代表合约，另一个代表实现。实现的\
    \ UML 表示法如图 4.6 所示。\n\n![](img/13229b4b9ff377325da8c3d3e8c64024_86_0.png)\n\n\
    图 4.6\n\n（注：此处原文中存在大量重复段落，已根据要求仅保留核心含义并翻译）\n\n## 依赖 (Dependency)\n\n依赖定义为一种关系，其中一个类依赖另一个类来实现其功能。如果供应商类发生变化，客户端类也可能需要变化。\n\
    \n## 多态 (Polymorphism)\n\n多态是面向对象编程（OOP）的核心概念之一。多态的目标是允许使用相同的接口访问不同对象。多态一词源于两个希腊语，poly\
    \ 表示“多个”，morphos 表示“形式”。\n\n多态基本上有两种：\n\n- 静态多态或编译时多态\n- 动态多态或运行时多态\n\n## 静态多态或编译时多态\n\
    \n方法重载是静态多态的一个例子。在方法重载中，类中多个同名但签名不同的方法。下面的 SimpleCalculator 类演示了重载方法。在这个类中，`Add`\
    \ 方法被重载了。\n\n```java\npublic class SimpleCalculator\n{\n    public int Add(int\
    \ x, int y)\n    {\n        return x + y;\n    }\n    public int Add(int x, int\
    \ y, int z)\n    {\n        return x + y + z;\n    }\n}\n```\n\n构造函数重载也是静态多态的一个例子。你可能需要利用构造函数重载，以便以各种方式初始化类的实例。在构造函数重载中，一个类有多个构造函数，每个构造函数的签名不同。图\
    \ 4.8 中的代码片段显示了一个具有多个构造函数的类，演示了构造函数重载：\n\n![](img/13229b4b9ff377325da8c3d3e8c64024_87_0.png)\n\
    \n图 4.8: 构造函数重载\n\n前述代码示例中的 `MyClass` 类有两个构造函数——默认构造函数和参数构造函数。在 `Main()` 方法中创建了两个\
    \ `MyClass` 实例：一个名为 `obj1`，另一个名为 `obj2`。当创建实例 `obj1` 时，调用默认构造函数。由于默认构造函数内部没有任何代码，变量\
    \ `x` 的值保持不变。当创建实例 `obj2` 时，将 `10` 作为参数传递给单参数构造函数。在这种情况下，变量 `x` 的值变为 `10`。因此，当执行此代码时，`obj1`\
    \ 的 `x` 值显示为 `0`，`obj2` 的显示为 `10`。\n\n"
