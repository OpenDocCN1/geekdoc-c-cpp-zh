    # Working with generic collection types


    System.Collections.Generic namespace contains several types that represent generic
    collections. You can take advantage of these types to create strongly typed collections
    in C#. Strongly typed collections provide type safety and improved performance
    compared to non-generic collection types.


    # Dictionary


    A Dictionary is a generic collection of key-value pairs. It implements the IDictionary
    interface. The keys of a dictionary are not null and unique. The code snippet
    given below illustrates how a Dictionary instance can be created and data stored
    into it:


    ```

    static void Main(string[]) args

    {

    Dictionary<int, string> dictionary = new

    Dictionary<int, string>();

    dictionary.Add(1, "A");

    dictionary.Add(2, "B");

    dictionary.Add(3, "C");

    }

    ```


    The code example given below shows how you can add a key-value pair to a dictionary
    instance:


    ```

    IDictionary<int, string> dictionary =

    new Dictionary<int, string>();

    dictionary.Add(new KeyValuePair<int, string>(1, "A"));

    dictionary.Add(new KeyValuePair<int, string>(2, "B"));

    dictionary.Add(new KeyValuePair<int, string>(3, "C"));

    ```


    To access the elements of the dictionary instance, you can use the following code:


    ```

    foreach (KeyValuePair<int, string> item in dictionary)

    {

    Console.WriteLine("Key: {0}, Value: {1}", item.Key, item.Value);

    }

    ```'
