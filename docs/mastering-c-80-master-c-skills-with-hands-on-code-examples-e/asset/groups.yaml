    # Objective


    After reading this chapter, the reader will be able to learn the advanced concepts
    of C#, including tuples, pattern matching, local functions, nullable types and
    non-nullable reference types, unsafe code, preprocessor directives, regular expressions,
    and Dynamic Language++ Runtime. You will also learn how to apply these advanced
    concepts in C# programs.


    # Tuples


    A Tuple is a data structure that can be used to represent a set of homogenous
    or heterogeneous data. It is an ordered sequence of immutable, fixed-size data.
    The size of a Tuple is fixed after it is created. The properties of a Tuple cannot
    be changed, as they are read-only from the time they are created. You can use
    a tuple to store multiple values of varied data types inside one umbrella.


    Note that tuples have a limit of eight items. If you would like to store more
    items, you should use nested tuples. The Tuple class in C# is static in nature
    and takes advantage of the factory design pattern to create instances of tuples.


    The overloaded and static Create methods of the Tuple class are as follows:


    ```

    Create<T1>(T1) - this is used to create a 1-tuple

    ```


    ```

    Create<T1, T2>(T1, T2) - this is used to create a 2-tuple

    ```


    ```

    Create<T1, T2, T3>(T1, T2, T3) - this is used to create a 3-tuple

    ```


    ```

    Create<T1, T2, T3, T4>(T1, T2, T3, T4) - this is used to create a 4-tuple

    ```


    ```

    Create<T1, T2, T3, T4, T5>(T1, T2, T3, T4, T5) - this is used to create a 5-tuple

    ```


    ```

    Create<T1, T2, T3, T4, T5, T6>(T1, T2, T3, T4, T5, T6) - this is used to create
    a 6-tuple

    ```


    ```

    Create<T1, T2, T3, T4, T5, T6, T7>(T1, T2, T3, T4, T5, T6, T7) - this is used
    to create a 7-tuple

    ```


