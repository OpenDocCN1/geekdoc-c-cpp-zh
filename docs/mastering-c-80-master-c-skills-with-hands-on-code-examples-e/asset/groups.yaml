    # # CHAPTER 1

    # The Microsoft .NET Ecosystem


    Microsoft .NET Framework is a developer platform that can be used for building
    robust, scalable and portable applications. The first version of the Microsoft
    .NET Framework was released in February 2002 and since then it has matured by
    leaps and bounds. This book starts with a discussion on Microsoft .NET Framework.


    Since C# programs would leverage the .NET Framework, a good knowledge of what
    the underlying platform is all about and how its components work is imperative
    for building efficient applications. This chapter discusses the concepts related
    to Microsoft .NET Framework, its components, memory management, etc. In order
    to be a proficient programmer in C#, one must understand the internals of .NET
    as well. Let''s take a round of briefing on the Microsoft .NET Framework before
    we start learning C# in the next chapter.


    # ## Structure


    In this chapter, we will discuss the following points:


    +   - Introduction to Microsoft .NET

