  - "[PAGE 176]\n\n# Delegates, Funcs and Actions in C#\n\nTo create a multicast delegate,\
    \ you can take advantage of the static method of the Delegate class named Combine.\
    \ You can also use the + operator to make a delegate point to several methods.\n\
    \nLet's now implement a multicast delegate. To do this, we would need to define\
    \ multiple methods having the same signature. Here are two methods that have identical\
    \ signatures:\n\n```\nstatic void MethodA(string text)\n{\n    Console.WriteLine(\"\
    Inside method A.\\t\"+text);\n}\n```\n\n```\nstatic void MethodB(string text)\n\
    {\n    Console.WriteLine(\"Inside method B.\\t\"+text);\n}\n```\n\nNext, declare\
    \ a delegate named MyDelegate as shown in the below code snippet:\npublic delegate\
    \ void MyDelegate(string someText)\n\nThe code snippet given below illustrates\
    \ how you can instantiate the delegate, make it a multicast delegate, and then\
    \ invoke the methods that the delegate points to:\nmyDelegateObj = new MyDelegate(MethodA);\n\
    myDelegateObj += MethodB;\nmyDelegateObj.Invoke(\"This is a multicast delegate\"\
    );\n\nRefer to the preceding code snippet. Note how the += operator has been used\
    \ to create a multicast by assigning methods that have an identical signature\
    \ to the delegate object. Note that you can use - or -= operator to remove methods\
    \ from the delegate list.\n\nYou can also create a multicast delegate using the\
    \ static method Combine as well. This is shown in the following code snippet:\n\
    \n```\nMulticastDelegate delegateObj = new MulticastDelegate(MethodA);\nMulticastDelegate\
    \ delegateObj2 = new MulticastDelegate(MethodB);\nMulticastDelegate multicastDelegate\
    \ = (MulticastDelegate)delegate;\nCombine(delegateObj, delegateObj2);\nmulticastDelegate.Invoke(\"\
    This is a multicast delegate\");\n```"
- md: "\nWhen you have a multicast delegate pointing to multiple methods, the methods\
    \ when invoked are executed in a first-in-out-first-in-out order. Hence, the code\
    \ snippet shown above, MethodA and MethodB will be executed in this order.\n\n\
    The complete source code of the program that illustrates a multicast delegate\
    \ is shown in Figure 8.3.\n\n![](img/13229b4b9ff377325da8c3d3e8c64024_177_0.png)\n\
    \nFigure 8.3: Programming a multi-cast delegate\n\nThe Func and Action keywords\
    \ in C# provide an easy way to define delegates. In the sections that follow,\
    \ we will examine both Func and Action delegates.\n\n## Func delegate\n\nThe C#\
    \ language includes built-in delegates Func and Action. In C# is a generic delegate\
    \ and is available as part of the System namespace. Func can accept zero or more\
    \ input parameters and one output parameter. Note that you can have a Func delegate\
    \ with no input parameters, but it must have an output parameter. A Func delegate\
    \ can have a maximum of 16 input parameters and a mandatory output parameter.\n\
    \nHere's how the signature of a Func delegate looks like:\n\n```\nnamespace System\n\
    {\n    public delegate TResult Func<in T, out TResult>(T arg);\n}\n```\n\nThe\
    \ code snippet given below declares a Func delegate that accepts one input parameter\
    \ and has one output parameter:\n\n```cs\npublic delegate TOutput Func<in T, out\
    \ TOutput>(T arg);\n```\n\nThe code snippet given below illustrates a Func delegate\
    \ with two input parameters and one output parameter:\n\n```cs\npublic delegate\
    \ TOutput Func<in T1, in T2, out TOutput>(T1 arg1, T2 arg2);\n```\n\nThe last\
    \ parameter that you specify in the angled brackets is the output parameter and\
    \ the other parameters are the input parameters. Now, consider the following method:\n\
    \n```csharp\nstatic int Add(int x, int y)\n{\n  return x + y;\n}\n```\n\nHere's\
    \ how you can invoke the Add method using a Func delegate and display the result\
    \ on the console:\n\n```csharp\nFunc<int, int, int> math = Add;\nint result =\
    \ math(1, 2);\nConsole.WriteLine(result);\n```\n\nHere's the complete program\
    \ for your reference:\n\n```csharp\nclass Program\n{\n  static int Add(int x,\
    \ int y)\n  {\n    return x + y;\n  }\n  static void Main(string[] args)\n  {\n\
    \    Func<int, int, int> math = Add;\n    int result = math(1, 2);\n    Console.WriteLine(result);\n\
    \    Console.Read();\n  }\n}\n```\n\n## Using Func delegate with anonymous methods\n\
    \nYou can use a Func delegate with an anonymous method. For reference, the code\
    \ snippet given below illustrates how you can assign an anonymous method to a\
    \ Func delegate.\n\n```csharp\nFunc<int> getMilliseconds = delegate ()\n{\n  \
    \  return DateTime.Now.Millisecond;\n};\n```\n\nA Func delegate that accepts an\
    \ argument as input parameter and has one output parameter is declared in the\
    \ System namespace as shown in the code snippet given below:\n\n```cs\npublic\
    \ delegate TResult Func<in T, TResult>(T arg);\n```\n\nThe code snippet given\
    \ below illustrates a Func delegate that accepts one parameter and returns an\
    \ integer value:\n\n```csharp\nstatic int Square(int x)\n{\n    return x * x;\n\
    }\n\nstatic void Main(string[] args)\n{\n    Func<int> add = Square;\n    int\
    \ result = Square(10);\n    Console.WriteLine(result);\n}\n```\n\nHere's another\
    \ example of a Func delegate with anonymous functions:\n\n```csharp\nstatic void\
    \ Main(string[] args)\n{\n  Func<int, int, string> funcWithAnonymousFunction =\
    \ delegate(int x, int y)\n  {\n    return string.Format(\"The sum of the two numbers\
    \ is : {0}\", (x + y));\n  }\n  Console.WriteLine(funcWithAnonymousFunction(1,\
    \ 10));\n}\n```\n\n## Using Func delegate with lambda expressions\n\nYou can use\
    \ Func delegate with lambda expressions as well. You can use Func delegate type\
    \ with an anonymous method or lambda expression. Let's examine how Func delegate\
    \ can be used with lambda expression.\n\n```csharp\nFunc<int, int, int> add =\
    \ (a, b) => a + b;\n```\n\n## Action delegate\n\nSimilar to Func, Action delegate\
    \ not return any value. Here's an example of Action delegate:\n\n```csharp\nAction<string>\
    \ displayMessage = (string message) =>\n{\n    Console.WriteLine(message);\n};\n\
    \nstatic void Main(string[] args)\n{\n    displayMessage(\"Hello World!\");\n\
    }\n```\n"
  mdcn: "\n\n当你有一个指向多个方法的多路委托时，这些方法在被调用时将按照“先入先出”的顺序执行。因此，上述所示的代码片段中 MethodA 和 MethodB\
    \ 将按此顺序执行。\n\n阐明多路委托的程序完整源代码如图 8.3 所示。\n\n![](img/13229b4b9ff377325da8c3d3e8c64024_177_0.png)\n\
    \n图 8.3：编写多路委托\n\nC# 中的 `Func` 和 `Action` 关键字提供了定义委托的简单方法。在接下来的章节中，我们将分别检查 Func\
    \ 和 Action 委托。\n\n## Func 委托\n\nC# 语言包含了内置的委托 `Func` 和 `Action`。在 C# 中，`Func`\
    \ 是一个泛型委托，作为 `System` 命名空间的一部分。`Func` 可以接受零或多个输入参数和一个输出参数。请注意，你可以有一个没有输入参数的 `Func`\
    \ 委托，但它必须有一个输出参数。`Func` 委托最多可以有 16 个输入参数和一个强制性的输出参数。\n\n以下是 `Func` 委托的签的格式：\n\n\
    ```\nnamespace System\n{\n    public delegate TResult Func<in T, out TResult>(T\
    \ arg);\n}\n```\n\n下面的代码片段声明了一个接受一个输入参数并有一个输出参数的 `Func` 委托：\n\n```cs\npublic delegate\
    \ TOutput Func<in T, out TOutput>(T arg);\n```\n\n下面的代码片段说明了一个具有两个输入参数和一个输出参数的\
    \ `Func` 委托：\n\n```cs\npublic delegate TOutput Func<in T1, in T2, out TOutput>(T1\
    \ arg1, T2 arg2);\n```\n\n你在尖括号中指定的最后一个参数是输出参数，其他参数是输入参数。现在，考虑以下方法：\n\n```csharp\n\
    static int Add(int x, int y)\n{\n  return x + y;\n}\n```\n\n以下是你可以使用 `Func` 委托调用\
    \ `Add` 方法并在控制台上显示结果的方法：\n\n```csharp\nFunc<int, int, int> math = Add;\nint result\
    \ = math(1, 2);\nConsole.WriteLine(result);\n```\n\n以下是供你参考的完整程序：\n\n```csharp\n\
    class Program\n{\n  static int Add(int x, int y)\n  {\n    return x + y;\n  }\n\
    \  static void Main(string[] args)\n  {\n    Func<int, int, int> math = Add;\n\
    \    int result = math(1, 2);\n    Console.WriteLine(result);\n    Console.Read();\n\
    \  }\n}\n```\n\n## 使用匿名方法使用 Func 委托\n\n你可以将 `Func` 委托与匿名方法结合。作为参考，下面的代码片段说明了你如何将匿名方法分配给\
    \ `Func` 委托。\n\n```csharp\nFunc<int> getMilliseconds = delegate ()\n{\n    return\
    \ DateTime.Now.Millisecond;\n};\n```\n\n在 `System` 命名空间中声明了一个接受一个参数作为输入参数并有一个输出参数的\
