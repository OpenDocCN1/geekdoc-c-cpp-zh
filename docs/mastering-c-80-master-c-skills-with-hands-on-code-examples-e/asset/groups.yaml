    ## About the Author


    Joydip Kanjilal is a Microsoft Most Valuable Professional (MVP) in ASP.NET, a
    speaker and the author of several books as well as articles. He received the prestigious
    MVP awards consecutively in 2007, 2008, 2009, 2010, 2011 and 2012.


    Joydip has more than 20 years of industry experience in IT, with more than 16
    years in Microsoft .NET and its related technologies. He has been selected as
    MSDN Featured Developer of the Fortnite and Community Credit Winner times.


    He has authored several books and more than 500 articles. Many of his articles
    related to ASP.NET have been featured on Microsoft''s Official Site.


    Joydip has authored the following books:


    - Entity Framework Tutorial 2nd Edition (Packt Publishing)

    - ASP.NET Web API (Packt Publishing)

    - Visual Studio Six in One (Wrox Publishers)

    - ASP.NET 4.0 Programming (Mc-Graw Hill Publishing)

    - Entity Framework Tutorial (Packt Publishing)

    - Pro Sync Framework (APRESS)

    - Sams Teach Yourself ASP.NET Ajax in 24 Hours (Sams Publishing)

    - ASP.NET Data Presentation Controls Essentials (Packt)


    Joydip has also reviewed several books. He was a speaker at the reputed Spark
    IT 2010 event and the well-respected Dr. Dobb''s Conference 2014 in Bangalore.
    He worked as a judge for the Jolt Awards at Dr. Dobb''s Journal. Joydip is a regular
    speaker at the SSWUG Virtual Conference. He blogs these days at: https://www.infowerorld.com/blog/microsoft-coder/


    ## Reviewer


    Anand Narayanaswamy is a freelance writer and reviewer based in Thiruvananthapuram.
    He had published articles and reviews on leading print magazines and online portals.
    Anand had worked as a Chief Technical Editor for ASPAlliance. He was the recipient
    of Microsoft MVP award from 2002 to 2011. He is currently a Windows Insider MVP
    and also part of the prestigious ASPInsiders group.


    Anand also worked as a technical editor and reviewer for several publishers as
    Packt, Sams Publishing, Addison-Wesley and others. Anand also authored the book
    Community Server Quickly for Packt Publishing. Anand also contribute content for
    Digit Magazine and Manorama Year Book.


    Anand works as an Unacademy educator and also runs his own blog Netans and Learnxpress.
    Anand is active on social media and can be reached at @visualanand on Twitter
    and @netastech on Instagram.


    During spare time, Anand used to dig deep into not only new but also old gadgets.
    His drawer consists of a huge pile of feature phones including latest gadgets
    and accessories.


    ## Acknowledgement


    First and foremost, I would like to thank my Parents, Shri Amal Kanjilal and Smt.
    Rama Kanjilal. I owe a special thanks to BPB Publications for giving me the opportunity
    to write this book. My special thanks goes to Narayanaswamy for his invaluable
    feedback. I also owe some to my family for their support and encouragement. Lastly,
    I would like to thank everyone at BPB Publications for their guidance on writing
    this book.


    ## Preface


    C# is one of the most popular languages around. From the initial release of C#
    1.0 back in the year 2000, the language has matured leaps and bounds. It is a
    powerful multi-purpose language with terse, clear syntax. As of this writing,
    C# 8.0 has just been released. This is a concise guide to mastering C#. This book
    is divided into 15 chapters. A brief description of the objective of each chapter
    is given below:


    - Chapter 1 introduces the concepts of .NET Framework. This chapter provides a
    discussion on the features and benefits of .NET Framework—an independent platform
    that can be used for building robust, scalable and portable applications.

    - Chapter 2 presents a discussion on how to get started working with Visual Studio.

    - Chapter 3 introduces the basic concepts of OOP.

    - Chapter 4 discusses the advanced concepts of OOP.

    - Chapter 5 discusses the properties and indexes in C# and how to program them.

    - Chapter 6 examines the concepts of LINQ and how LINQ can be used for querying
    data from different sources of data.

    - Chapter 7 discusses generics and generic collections and how to work with them.

    - Chapter 8 discusses delegates, lambda expressions and extension methods.

    - Chapter 9 discusses asynchrony and parallel programming.

    - Chapter 10 focuses on the concepts of multithreading and how to work with multithreading
    in C#.

    - Chapter 11 discusses serialization and its types, and how to work with files
    in C#.

    - Chapter 12 discusses the advanced concepts of the C# programming language.

    - Chapter 13 discusses the new features of C# 8.0.

    - Chapter 14 is the last chapter of this book and it presents a discussion on
    how to work with the Visual Studio 2019 IDE.


