    # 13.6 Random Access to files


    The file I/O routines all work in the same way; unless the user takes explicit
    steps to change the file position indicator, files will be read and written sequentially.
    A read followed by a write followed by a read (if the file was opened in a mode
    to permit that) will cause the second read to start immediately following the
    end of the data just written. (Remember that stdio insists on the user inserting
    a buffer-flushing operation between each element of a read-write-read cycle.)'
