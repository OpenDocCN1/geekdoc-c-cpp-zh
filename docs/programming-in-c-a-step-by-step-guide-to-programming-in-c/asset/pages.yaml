  md: 'If we''re lucky, the relevant parts of the program check how much of an array
    they''ve used, and print an error message or otherwise gracefully abort before
    overflowing the array. If we''re not so lucky, a program may sail off the end
    of an array, overwriting other data and behaving quite badly. In either case,
    the user doesn''t get his job done. How can we avoid the restrictions of fixed-size
    arrays?


    The answers all involve the standard library function malloc. Very simply, malloc
    returns a pointer to n bytes of memory which we can do anything we want to with.
    If we didn''t want to read a line of input into a fixed-size array, we could use
    malloc, instead. It takes the following form:


    ```

    ptr=(cast-type*)malloc(byte-size)

    ```


    where ptr is a pointer of type cast-type. The malloc returns a pointer(of casttype)
    to an area of memory with size byte-size.


    Here is an example


    ```

    #include <stdlib.h>

    char *line;

    int linelen = 100;

    line = (char *)malloc(linelen);

    /* incomplete -- malloc''s return value not checked */

    getline(line, linelen);

    ```


    malloc is declared in <stdlib.h>, so we #include that header in any program that
    calls malloc. A “byte" in C is, by definition, an amount of storage suitable for
    storing one character, so the above invocation of malloc gives us exactly as many
    chars as we ask for. We could illustrate the resulting pointer like this:'
