    also offer extended data types such as long double and signed char. C permits
    mixing of constants and variables of different types in an expression, but during
    evaluation it adheres to very strict rules of type conversion. When one of the
    operands is real and the other is integer, the expression is called a mixed-mode
    arithmetic expression. There are instances when we want to force a type conversion
    in a way that is different from the automatic conversion. That is, by using type
    cast operator. All keywords have fixed meanings and these meanings cannot be changed.


