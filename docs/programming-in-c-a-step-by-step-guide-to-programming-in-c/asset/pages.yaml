    right can make writing the rest of the program simple. By now you''ve seen C''s
    built-in data types: simple variables, arrays, pointers, structures, and unions.


    Finding the right data representation, however, often goes beyond simply selecting
    a type. You should also think about what operations will be necessary. That is,
    you should decide how to store the data, and you should define what operations
    are valid for the data type. For example, C implementations typically store both
    the C int type and the C pointer type as integers, but the two types have different
    sets of valid operations. You can multiply one integer by another, for example,
    but you can''t multiply a pointer by a pointer. You can use the * operator to
    dereference a pointer, but that operation is meaningless for an integer. The C
    language defines the valid operations for its fundamental types. However, when
    you design a scheme to represent data, you might need to define the valid operations
    yourself. In C, you can do so by designing C functions to represent the desired
    operations. In short, then, designing a data type consists of deciding on how
    to store the data and of designing a set of functions to manage the data. You
    will also look at some algorithms, recipes for manipulating data. As a programmer,
    you will acquire a repertoire of such recipes that you apply over and over again
    to similar problems.


