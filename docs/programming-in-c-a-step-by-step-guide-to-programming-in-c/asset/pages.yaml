- pgno: 266
  md: 'in your program, the code that gets compiled depends on whether a preprocessor
    macro by that *name* is defined or not. If it is (that is, if there has been a
    #define line for a macro called *name*), then “*program text* is compiled and
    “*more program text*” is ignored. If the macro is not defined, “*more program
    text*” is compiled and “*program text*” is ignored. This looks a lot like an if
    statement, but it behaves completely differently: an if statement controls which
    statements of your program are executed at run time, but #ifdef controls which
    parts of your program actually get compiled.


    Just as for the if statement, the #else in an #ifdef is optional. There is a companion
    directive #ifndef, which compiles code if the macro is *not* defined (although
    the “#else clause” of an #ifndef directive will then be compiled if the macro
    *is* defined). There is also an #if directive which compiles code depending on
    whether a compile-time expression is true or false. (The expressions which are
    allowed in an #if directive are somewhat restricted, however, so we won’t talk
    much about #if here.)


    Conditional compilation is useful in two general classes of situations:


    You are trying to write a portable program, but the way you do something is different
    depending on what compiler, operating system, or computer you’re using. You place
    different versions of your code, one for each situation, between suitable #ifdef
    directives, and when you compile the program in a particular environment, you
    arrange to have the macro names defined which select the variants you need in
    that environment.


    (For this reason, compilers usually have ways of letting you define macros from
    the invocation command line or in a configuration file, and many also predefine
    certain macro names related to the operating system, processor, or compiler in
    use. That way, you don’t have to change the code to change the #define lines each
    time you compile it in a different environment.)'
