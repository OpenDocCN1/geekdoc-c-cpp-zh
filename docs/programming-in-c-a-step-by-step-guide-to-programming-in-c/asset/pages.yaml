  md: '# 3.1 Introduction


    In the previous unit, you learned about the operators that a C programming language
    supports. You also learned how the operators are used in the expressions of C
    programs. In this unit, you will learn about the data types that are supported
    in C. You will also study about the Input/output operators which makes C as the
    most efficient and powerful programming language. Integer is one of the fundamental
    data types. All C compilers support four fundamental data types, namely integer
    (**int**), character (**char**), floating point (**float**), and double-precision
    floating point (**double**). Like integer data type, other data types also offer
    extended data types such as **long double** and **signed char.**


    **C** supports a rich set of operators. We have already used several of them,
    such as =, +, -, *, / and %. An operator is a symbol that tells the computer to
    perform certain mathematical or logical manipulations. Operators are used in programs
    to manipulate data and variables. They usually form a part of the mathematical
    or logical expressions. It is possible to combine operands of different data types
    in arithmetic expressions. Such expressions are called mixed-mode arithmetic expressions.


    C language is accompanied by some library functions to handle input/output(I/O)
    operations. In this unit we will make use of six I/O functions : getchar(), putchar(),
    scanf(), printf(), gets() and puts(). These functions are used to transfer the
    information between the computer and the standard input/output devices. Throughout
    this course we assume that keyboard is the standard input device and the user
    screen is the standard output device. The first two functions, getchar() and putchar(),
    allow single character to be transferred into and out of the computer; the functions
    scanf() and printf() permit the transfer of single character, numerical values
    and strings; the functions gets() and puts() facilitate the input and output of
    strings. These functions can be accessed within a program by including the header
    file stdio.h.'
