    It reads one character, and if it is not the EOF code, enters a while loop, printing
    one character and reading another, as long as the character read is not EOF. A
    char variable could hold integers corresponding to character set values, and that
    an int could hold integers of more arbitrary values (from 32768 to + 32767). Since
    most character sets contain a few hundred characters (nowhere near 32767), an
    int variable can in general comfortably hold all char values, and then some. Therefore,
    there''s nothing wrong with declaring c as an int. But in fact, it''s important
    to do so, because getchar() can return every character value, plus that special,
    non-character value EOF, indicating that there are no more characters. Type char
    is only guaranteed to be able to hold all the character values; it is not guaranteed
    to be able to hold EOF value without possibly mixing it up with some actual character
    value. Therefore, you should always remember to use an int for anything you assign
    getchar()''s return value to.


    When you run the character copying program, and it begins copying its input (you''re
    typing) to its output (your screen), you may find yourself wondering how to stop
    it. It stops when it receives end-of-file (EOF), but how do you send EOF? The
    answer depends on what kind of computer you''re using. On Unix and Unix-related
    systems, it''s almost always control-D. On MS-DOS machines, it''s control-Z followed
