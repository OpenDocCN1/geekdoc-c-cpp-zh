    # 6.1 Introduction


    In the previous unit, you studied about functions. You found out that how functions
    can be used to break the large problems into small problems and then solve it.
    You studied how functions can be repeatedly called and used again and again. In
    this unit, you will study about the types of storage classes that are used in
    C. You will study how these storage classes are useful in making the C language
    a very powerful computing language.


    Variables are channels of communication within a program. You set a variable to
    a value at one point in a program, and at another point (or points) you read the
    value out again. The two points may be in adjoining statements, or they may be
    in widely separated parts of the program. How long does a variable last? How widely
    separated can the setting and fetching parts of the program be, and how long after
    a variable is set does it persist? Depending on the variable and how you''re using
    it, you might want different answers to these questions. For example, in some
    situations it may be desirable to introduce certain “global” variables that are
    recognized throughout the entire program (or within major portions of the program,
    e.g. two or more functions). Such variables are defined differently than the usual
    “local” variables, which are recognized only within a single function.'
