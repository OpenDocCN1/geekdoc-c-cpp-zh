  md: '# What should you put in header files?


    External declarations of global variables and functions. We said that a global
    variable must have exactly one *defining instance*, but that it can have *external
    declarations* in many places. We said that it was a grave


    error to issue an external declaration in one place saying that a variable or
    function has one type, when the defining instance in some other place actually
    defines it with another type. (If the two places are two source files, separately
    compiled, the compiler will probably not even catch the discrepancy.) If you put
    the external declarations in a header file, however, and include the header wherever
    it''s needed, the declarations are virtually guaranteed to be consistent. It''s
    a good idea to include the header in the source file where the defining instance
    appears, too, so that the compiler can check that the declaration and definition
    match. (That is, if you ever change the type, you do still have to change it in
    two places: in the source file where the defining instance occurs, and in the
    header file where the external declaration appears. But at least you don''t have
    to change it in an arbitrary number of places, and, if you''ve set things up correctly,
    the compiler can catch any remaining mistakes.)


    Preprocessor macro definitions (which we''ll meet in the next section). Structure
    definitions

    Typedef declarations


    However, there are a few things *not* to put in header files:

    Defining instances of global variables. If you put these in a header file, and
    include the header file in more than one source file, the variable will end up
    multi defined.


    Function bodies (which are also defining instances). You don''t want to put these
    in headers for the same reason -- it''s likely that you''ll end up with multiple
    copies of the function and hence “multiply defined" errors.


    People sometimes put commonly-used functions in header files and then use #include
    to bring them (once) into each program where they use that function, or use #include
    to bring together the several source files making up a program,'
