  md: '# 9.5 Pointers and two-dimensional arrays


    Since a one-dimensional array can be represented in terms of pointer (the array
    name) and an offset (the subscript), it is reasonable to expect that a two-dimensional
    array can also be represented with an equivalent pointer notation. A two-dimensional
    array is actually a collection of one-dimensional arrays. Therefore we can define
    a two dimensional array as a pointer to a group of contiguous one-dimensional
    arrays. A two-dimensional array declaration can be written as:


    ```

    data-type (*ptr)[expression]

    ```


    where data-type is the type of array elements and expression is the positivevalued
    integer expression that indicates the number of columns in each row of the two-dimensional
    array.


    Example 9.5: Suppose that x is a two-dimensional integer array having 10 rows
    and 20 columns. We can declare x as int (*x)[20];


    In this case, x is defined to be a pointer to a group of contiguous, onedimensional,
    20-element integer arrays. Thus x points to the first 20-element array, which
    is actually the first row(row 0) of the original two-dimensional array. Similarly,
    (x+1) points to the second 20-element array, which is the second row(row 1) of
    the original two-dimensional array and so on.


    # Arrays of pointers


    A two-dimensional array can also be expressed in terms of an array of pointers
    rather than as a pointer to a group of contiguous arrays. Each element in the
    array is a pointer to a separate row in the two-dimensional array. In general'
