    # 1.6 Rules for naming Variables and assigning values to variables


    Within limits, you can give your variables and functions any names you want. These
    names (the formal term is “identifiers”) consist of letters, numbers, and underscores.
    For our purposes, names must begin with a letter. Theoretically, names can be
    as long as you want, but extremely long ones get tedious to type after a while,
    and the compiler is not required to keep track of extremely long ones perfectly.
    (What this means is that if you were to name a variable, say, supercalafragalisticespialidocious,
    the compiler might get lazy and pretend that you''d named it super calafragalisticespialidocio,
    such that if you later misspelled it supercalafragalisticespialidociouz, the compiler
    wouldn''t'
