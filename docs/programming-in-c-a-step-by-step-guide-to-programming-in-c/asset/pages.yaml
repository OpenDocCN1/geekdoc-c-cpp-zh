    supplied to a program when the program is invoked.


    (We should probably admit that command line user interfaces are a bit oldfashioned,
    and currently somewhat out of favor. If you''ve used Unix or MSDOS, you know what
    a command line is, but if your experience is confined to the Macintosh or Microsoft
    Windows or some other Graphical User Interface, you may never have seen a command
    line. In fact, if you''re learning C on a Mac or under Windows, it can be tricky
    to give your program a command line at all.


    C''s model of the command line is that it consists of a sequence of words, typically
    separated by whitespace. Your main program can receive these words as an array
    of strings, one word per string. In fact, the C run-time startup code is always
    willing to pass you this array, and all you have to do to receive it is to declare
    main as accepting two parameters, like this: int main(int argc, char *argv[])'
