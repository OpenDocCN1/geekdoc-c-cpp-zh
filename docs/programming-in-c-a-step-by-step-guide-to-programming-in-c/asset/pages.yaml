  md: 'broken up into functions cleanly. Two obvious reasons for moving code down
    into a function are because:


    +   1. It appeared in the main program several times, such that by making it a
    function, it can be written just once, and the several places where it used to
    appear can be replaced with calls to the new function.


    +   2. The main program was getting too big, so it could be made (presumably)
    smaller and more manageable by lopping part of it off and making it a function.


    These two reasons are important, and they represent significant benefits of well-chosen
    functions, but they are not sufficient to automatically identify a good function.
    As we''ve been suggesting, a good function has at least these two additional attributes:


    +   3. It does just one well-defined task, and does it well.

    +   4. Its interface to the rest of the program is clean and narrow.

    +   Attribute 3 is just a restatement of two things we said above. Attribute 4
    says


    that you shouldn''t have to keep track of too many things when calling a function.
    If you know what a function is supposed to do, and if its task is simple and well-defined,
    there should be just a few pieces of information you have to give it to act upon,
    and one or just a few pieces of information which it returns to you when it''s
    done. If you find yourself having to pass lots and lots of information to a function,
    or remember details of its internal implementation to make sure that it will work
    properly this time, it''s often a sign that the function is not sufficiently well-defined.
    (A poorly-defined function may be an arbitrary chunk of code that was ripped out
    of a main program that was getting too big, such that it essentially has to have
    access to all of that main function''s local variables.)'
