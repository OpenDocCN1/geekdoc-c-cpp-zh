    queues required to be maintained by the scheduler of an operating system. It is
    a queue in which each element has a priority value and the elements are required
    to be inserted in the queue in decreasing order of priority. This requires a change
    in the function that is used for insertion of an element into the queue. No change
    is required in the delete function.'
