- pgno: 363
  md: 'Whenever an operand is encountered, it is pushed in a queue. If the scanned
    element is a right parenthesis (`)`), it is pushed in a stack of operators. If
    the scanned element is a left parenthesis (`(`), the queue of operands is emptied
    to the prefix output, followed by the popping of all the operators up to, but
    excluding, a right parenthesis in the operator stack.


    3. If the scanned element is an arbitrary operator o, then the stack of operators
    is checked for operators with a greater priority than o. Such operators are popped
    and written to the prefix output after emptying the operand queue. The operator
    o is finally pushed to the stack.


    4. When the scanning of the infix expression is complete, first the operand queue,
    and then the operator stack, are emptied to the prefix output. Any whitespace
    in the infix input is ignored. Thus the prefix output can be reversed to get the
    required prefix expression of the infix input.


    # Example


    If the infix expression is a*b + c/d, then different snapshots of the algorithm,
    while scanning the expression from right to left, are shown in Table 14.1.


    | Step | Scanned expression element | Remaining operands | Queue of operators
    | Stack of operators | Prefix output |

    |---:|---|---|---|---|---|

    | 0 | a*b+c/d | nil | empty | empty | nil |

    | 1 | a*b+c/D | d | empty | nil |  |

    | 2 | a*b+c/d/ | nil |  | nil |  |

    | 3 | a*b+C d | c | / | nil |  |

    | 4 | a*b+ | empty | + | dc/ |  |

    | 5 | a*B | b | + | dc/ |  |

    | 6 | A | a | *+ | dc/ |  |'
