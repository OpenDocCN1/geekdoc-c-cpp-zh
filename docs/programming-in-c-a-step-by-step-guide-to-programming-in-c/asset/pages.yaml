- pgno: 4
  md: 'Another important characteristic of C is that its programs are highly portable,
    even more so than with other high-level languages. The reason for this is that
    C relegates most computer dependent features to its library functions. Thus, every
    version of C is accompanied by its own set of library functions, which are written
    for the particular characteristics of the host computer.


    A C program can be viewed as a group of building blocks called functions. A function
    is a subroutine that may include one or more statements designed to perform a
    specific task. To write a C program we first create functions and then put them
    together. A C program may contain one or more sections shown in Fig. 1.1.


    The documentation section consists of a set of comment (remarks) lines giving
    the name of the program, the author and other details which the programmer would
    like to use later. Comments may appear anywhere within a program, as long as they
    are placed within the delimiters /* and */ (e.g., /*this is a comment*/). Such
    comments are helpful in identifying the program''s principal features or in explaining
    the underlying logic of various program features.


    Documentation section Link section


    Definition section


    Global declaration section main() function section {


    Declaration part Executable part

    }


    Subprogram section


    Function 1


    Function 2


    .

