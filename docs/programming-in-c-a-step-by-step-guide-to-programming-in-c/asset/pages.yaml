  md: 'For example, you might use lines like this:


    ```

    #ifdef DEBUG

    printf("x is %d\n", x);

    #endif

    ```


    to print out the value of the variable x at some point in your program to see
    if it''s what you expect. To enable debugging printouts, you insert the line


    ```

    #define DEBUG

    ```


    at the top of the file, and to turn them off, you delete that line, but the debugging
    printouts quietly remain in your code, temporarily deactivated, but ready to reactivate
    if you find yourself needing them again later. (Also, instead of inserting and
    deleting the #define line, you might use a compiler flag such as -DDEBUG to define
    the macro DEBUG from the compiler invocating line.)


    Conditional compilation can be very handy, but it can also get out of hand. When
    large chunks of the program are completely different depending on, say, what operating
    system the program is being compiled for, it''s often better to place the different
    versions in separate source files, and then only use one of the files (corresponding
    to one of the versions) to build the program on any given system. Also, if you
    are using an ANSI Standard compiler and you are writing ANSI-compatible


    code, you usually won''t need so much conditional compilation, because the Standard
    specifies exactly how the compiler must do certain things, and exactly which library
    functions it much provide, so you don''t have to


    work so hard to accommodate the old variations among compilers and libraries.'
