- pgno: 286
  md: 'you can damage other parts of your program, or (in some cases) other programs
    or the operating system itself!


    When we use pointers to simple variables, there''s not much that can go wrong.
    When we use pointers into arrays, and begin moving the pointers around, we have
    to be more careful, to ensure that the moving pointers always stay within the
    bounds of the array(s). When we begin passing pointers to functions, and especially
    when we begin returning them from functions, we have to be more careful still,
    because the code using the pointer may be far removed from the code which owns
    or allocated the memory.


    One particular problem concerns functions that return pointers. Where is the memory
    to which the returned pointer points? Is it still around by the time the function
    returns? The strstr function (as described in the earlier unit), returns either
    a null pointer (which points definitively nowhere, and which the caller presumably
    checks for) or it returns a pointer which points into the input string, which
    the caller supplied, which is pretty safe. One thing a function must *not* do,
    however, is return a pointer to one of its own, local, automatic arrays. Remember
    that automatic variables (which includes all non-static local variables), including
    automatic arrays, are deallocated and disappear when the function returns. If
    a function returns a pointer to a local array, that pointer will be invalid by
    the time the caller tries to use it.


    Finally, when we''re doing dynamic memory allocation with malloc, calloc, realloc,
    and free, we have to be most careful of all. Dynamic allocation gives us a lot
    more flexibility in how our programs use memory, although with that flexibility
    comes the responsibility that we manage dynamically allocated memory carefully.
    The possibilities for misdirected pointers and associated havoc are greatest in
    programs that make heavy use of dynamic memory allocation. You can reduce these
    possibilities by designing your program in such a way that it''s easy to ensure
    that pointers are used correctly and that memory is always allocated and deallocated
    correctly. (If, on the other hand, your program is designed in such a way that
    meeting these guarantees is a tedious nuisance, sooner or later you''ll forget
    or neglect to, and maintenance will be a nightmare.)'
