- pgno: 11
  md: 'A sequence of digits preceded by 0x or 0X is considered as *hexadecimal* integer.
    They may also include alphabets A through F or a through f. The letters A through
    F represent numbers 10 through 15.


    Examples: 0X6, 0x5B, 0Xbcd, 0X


    The largest integer value that can be stored is machine-dependent. It is 32767
    on 16-bit machines and 2,147,483,647 on 32-bit machines. It is also possible to
    store larger integer constants on these machines by appending *qualifiers* such
    as U, L and UL to the constants.


    Examples: 54637U or 54637u (unsigned integer)


    65757564345UL or 65757564345ul (unsigned long integer)


    7685784L or 7685784l (long integer)


    # Program 1.1: Program to represent integer constants on a 16-bit computer


    ```

    /* Integer numbers on 16-bit machine */

    main()

    {

    printf("Integer values\n\n");

    printf("%d %d %d\n", 32767,32767+1,32767+10);

    printf("\n");

    printf("Long integer values\n\n");

    printf("%ld %ld %ld\n", 32767L, 32767L+1L, 32767L+10L);

    }

    ```'
