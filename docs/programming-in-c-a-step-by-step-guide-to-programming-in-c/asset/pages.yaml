- pgno: 26
  md: 'All of these operators “group” from left to right, which means that when two
    or more of them have the same precedence and participate next to each other in
    an expression, the evaluation conceptually proceeds from left to right. For example,
    1 - 2 - 3 is equivalent to (1 - 2) - 3 and gives -4, not +2. (“Grouping” is sometimes
    called associativity, although the term is used somewhat differently in programming
    than it is in mathematics. Not all C operators group from left to right; a few
    groups from right to left.)


    Whenever the default precedence or associativity doesn''t give you the grouping
    you want, you can always use explicit parentheses. For example, if you want to
    add 1 to 2 and then multiply the result by 3, you could write (1 + 2) * 3.


    # Program 2.1: Program that shows the use of integer arithmetic to convert a given
    number of days into months and days.


    ```

    /* Program to convert days to months and days */

    main()

    {

