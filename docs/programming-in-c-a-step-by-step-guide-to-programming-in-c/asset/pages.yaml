    # 1.4.2 Real constants


    The numbers containing fractional parts like 67.45 are called real (or floating
    point) constants.


    Examples: 0.0045, -8.5, +345.678


    A real number may also be expressed in *exponential (scientific)* notation. The
    general form is:


    *mantissa* e *exponent*


    The mantissa is either a real number expressed in decimal notation or an integer.
    The exponent is an integer number with an optional plus or minus sign. The letter
    e separating the mantissa and the exponent can be written in either lowercase
    or uppercase.


    Examples: 04e4, 12e-2, -1.3E-2


    750000000 may be written as 7.5E9 or 75E8.


    Floating point constants are normally represented as double-precision quantities.
    However, the suffixes f or F may be used to force single precision and l or L
    to extend double-precision further.


    # 1.4.3 Character constants


    A single character constant (or simple character constant) contains a single character
    enclosed within a pair of single quote marks.


    Examples: ''6'', ''X'', '';''


    Character constants have integer values known as ASCII values. For example, the
    statement


    ```

    ```c

    printf("%d", ''a'');

    ```

    ```'
