- pgno: 258
  md: 'stdio.h are collections of declarations (including external function prototype
    declarations) having to do with various sets of Standard library functions. When
    you use #include to read in a header file, you automatically get the prototypes
    and other declarations it contains, and you should use header files, precisely
    so that you will get the prototypes and other declarations they contain.


    The difference between the <> and "" forms is where the preprocessor searches
    for filename.h. As a general rule, it searches for files enclosed in <> in central,
    standard directories, and it searches for files enclosed in "" in the “current
    directory,” or the directory containing the source file that''s doing the including.
    Therefore, "" is usually used for header files you''ve written, and <> is usually
    used for headers which are provided for you (which someone else has written).


    The extension “.h", by the way, simply stands for “header," and reflects the fact
    that #include directives usually sit at the top (head) of your source files, and
    contain global declarations and definitions which you would otherwise put there.
    (That extension is not mandatory, you can theoretically name your own header files
    anything you wish, but .h is traditional, and recommended.)


    As we''ve already begun to see, the reason for putting something in a header file,
    and then using #include to pull that header file into several different source
    files, is when the something (whatever it is) must be declared or defined consistently
    in all of the source files. If, instead of using a header file, you typed the
    something in to each of the source files directly, and the something ever changed,
    you''d have to edit all those source files, and if you missed one, your program
    could fail in subtle (or serious) ways due to the mismatched declarations (i.e.
    due to the incompatibility between the new declaration in one source file and
    the old one in a source file you forgot to change). Placing common declarations
    and definitions into header files means that if they ever change, they only have
    to be changed in one place, which is a much more workable system.'
