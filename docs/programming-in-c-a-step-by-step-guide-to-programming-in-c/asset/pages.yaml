    The process of allocating memory at run time is known as Dynamic Memory Allocation.
    Although C does not inherently have this facility, there are four library routines
    known as “Memory Management Functions” that can be used for allocating and freeing
    memory during program execution. They are listed in Table 12.1. These functions
