    # 12.2.3 Freeing Memory


    Memory allocated with malloc lasts as long as you want it to. It does not automatically
    disappear when a function returns, as automatic variables do, but it does not
    have to remain for the entire duration of your program, either. Just as you can
    use malloc to control exactly when and how much memory you allocate, you can also
    control exactly when you deallocate it.


    In fact, many programs use memory on a transient basis. They allocate some memory,
    use it for a while, but then reach a point where they don''t need that particular
    piece any more. Because memory is not inexhaustible, it''s a good idea to deallocate
    (that is, release or free) memory you''re no longer using.'
