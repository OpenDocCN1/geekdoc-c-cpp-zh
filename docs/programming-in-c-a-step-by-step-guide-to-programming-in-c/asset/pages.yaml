  md: 'We should say a little more about the mechanism by which an argument is passed
    down from a caller into a function. Formally, C is *call by value*, which means
    that a function receives *copies* of the values of its arguments. We can illustrate
    this with an example. Suppose, in our implementation of **multbyfour**, we had
    gotten rid of the unnecessary **retval** variable like this:


    ```

    int multbyfour(int x)

    {

    x = x * 4;

    return x;

    }

    ```


    We might wonder, if we wrote it this way, what would happen to the value of the
    variable i when we called

    j = multbyfour(i);


    When our implementation of **multbyfour** changes the value of x, does that change
    the value of i up in the caller? The answer is no. x receives a copy of i''s value,
    so when we change x we don''t change i.


    However, there is an exception to this rule. When the argument you pass to a function
    is not a single variable, but is rather an array, the function does *not* receive
    a copy of the array, and it therefore *can* modify the array in the caller. The
    reason is that it might be too expensive to copy the entire array, and furthermore,
    it can be useful for the function to write into the caller''s array, as a way
    of handing back more data than would fit in the function''s single return value.
    We will discuss more about passing arrays as arguments to a function later.


    There may be several different calls to the same function from various places
    within a program. The actual arguments may differ from one function call to another.
    Within each function call, however, the actual arguments must'
