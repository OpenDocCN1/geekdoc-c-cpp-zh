  md: 'replacement text. After that (for the rest of the current source file), wherever
    the preprocessor sees that name, it will replace it with the replacement text.
    The name follows the same rules as ordinary identifiers (it can contain only letters,
    digits, and underscores, and may not begin with a digit). Since macros behave
    quite differently from normal variables (or functions), it is customary to give
    them names which are all capital letters (or at least which begin with a capital
    letter). The replacement text can be absolutely anything

    -it''s not restricted to numbers, or simple strings, or anything.

    The most common use for macros is to propagate various constants around and to
    make them more self-documenting. We''ve been saying things like char line[100];

    ...

    getline(line, 100);


    but this is neither readable nor reliable; it''s not necessarily obvious what
    all those 100''s scattered around the program are, and if we ever decide that
    100 is too small for the size of the array to hold lines, we''ll have to remember
    to change the number in two (or more) places. A much better solution is to use
    a macro:

    #define MAXLINE 100

    char line[MAXLINE];

    ...

    getline(line, MAXLINE);


    Now, if we ever want to change the size, we only have to do it in one place, and
    it''s more obvious what the words MAXLINE sprinkled through the program mean than
    the magic numbers 100 did.


    Since the replacement text of a preprocessor macro can be anything, it can also
    be an expression, although you have to realize that, as always, the text is substituted
    (and perhaps evaluated) later. No evaluation is performed when the macro is defined.
    For example, suppose that you write something like'
