- pgno: 260
  md: 'but both of these are poor ideas. It''s much better to learn how to use your
    compiler or linker to combine together separately-compiled object files.


    Since header files typically contain only external declarations, and should *not*
    contain function bodies, you have to understand just what does and doesn''t happen
    when you #include a header file. The header file may provide the declarations
    for some functions, so that the compiler can generate correct code when you call
    them (and so that it can make sure that you''re calling them correctly), but the
    header file does *not* give the compiler the functions themselves. The actual
    functions will be combined into your program at the end of compilation, by the
    part of the compiler called the *linker*. The linker may have to get the functions
    out of libraries, or you may have to tell the compiler/linker where to find them.
    In particular, if you are trying to use a third-party library containing some
    useful functions, the library will often come with a header file describing those
    functions. Using the library is therefore a two-step process: you must #include
    the header in the files where you call the library functions, *and* you must tell
    the linker to read in the functions from the library itself.


