- pgno: 25
  md: '# 2.2 Arithmetic Operators


    The basic operators for performing arithmetic are the same in many computer languages:


    +   + addition

    +   - subtraction

    +   * multiplication

    +   / division

    +   % modulus (remainder)


    The - operator can be used in two ways: to subtract two numbers (as in a - b),
    or to negate one number (as in -a + b or a + -b).


    When applied to integers, the division operator / discards any remainder, so 1
    / 2 is 0 and 7 / 4 is 1. But when either operand is a floating-point quantity
    (a real number), the division operator yields a floating-point result, with a
    potentially nonzero fractional part. So 1 / 2.0 is 0.5, and 7.0 / 4.0 is 1.75.
    The modulus operator % gives you the remainder when two integers are divided:
    1 % 2 is 1; 7 % 4 is 3. (The modulus operator can only be applied to integers.)


    An additional arithmetic operation you might be wondering about is exponentiation.
    Some languages have an exponentiation operator (typically ^ or **), but C doesn''t.
    (To square or cube a number, just multiply it by itself.)


    Multiplication, division, and modulus all have higher precedence than addition
    and subtraction. The term “precedence" refers to how “tightly" operators bind
    to their operands (that is, to the things they operate on). In mathematics, multiplication
    has higher precedence than addition, so 1 + 2 * 3 is 7, not 9. In other words,
    1 + 2 * 3 is equivalent to 1 + (2 * 3). C is the same way.'
