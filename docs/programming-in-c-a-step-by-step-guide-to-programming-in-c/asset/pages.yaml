    # 4.1 Introduction


    In the previous unit, you studied about the data types that are supported in C
    and the types of Input/output operators available in C. This unit will enable
    you to use the various types of control statements for making a decision in C.
    Statements are the “steps" of a program. Most statements compute and assign values
    or call functions, but we will eventually meet several other kinds of statements
    as well. By default, statements are executed in sequence, one after another. We
    can, however, modify that sequence by using *control flow constructs* such that
    a statement or group of statements is executed only if some condition is true
    or false. This involves a kind of decision making to see whether a particular
    condition has occurred or not and then direct the computer to execute certain
    statements accordingly.


    C language possesses such decision making capabilities and supports the following
    statements known as the *control* or *decision making* statements.


    +   - **if** statement

    +   - **switch** statement

    +   - **goto** statement

    +   - conditional operator statement'
