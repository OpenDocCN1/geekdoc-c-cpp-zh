    # 3.3 The type cast Operator


    C performs type conversions automatically. However, there are instances when we
    want to force a type conversion in a way that is different from the automatic
    conversion. Consider, for example, the calculation of ratio of doctors to engineers
    in a town.


    ```

    Ratio = doctor_number / engineer _number

    ```


    Since doctor _number and engineer_number are declared as integers in the program,
    the decimal part of the result of the division would be lost and Ratio would represent
    a wrong figure. This problem can be solved by converting locally one of the variables
    to the floating point as shown below: Ratio = (**float**) doctor_number / engineer
    _number


    The operator (**float**) converts the doctor_number to floating point for the
    purpose of evaluation of the expression. Then using the rule of automatic conversion,
    the division is performed in floating point mode, thus retaining the fractional'
