  md: '# Function Tasks


    malloc Allocates requested size of bytes and returns a pointer to the first byte
    of the allocated space


    calloc Allocates space for an array of elements, initializes them to zero and
    then returns a pointer to the memory


    free Frees previously allocated space


    realloc Modifies the size of previously allocated space


    Figure 12.1 shows the conceptual view of storage of a C program in memory.


    +   Local variables

    +   Free memory

    +   Global variables

    +   C program instructions


    Figure 12.1: storage of a C program- a conceptual view


    The program instructions and global and static variables are stored in a region
    known as permanent storage area and the local variables are stored in another
    area called stack. The memory space that is located between these two regions
    is available for dynamic allocation during execution of the program. This free
    memory region is called heap. The size of the heap keeps changing when program
    is executed due to creation and death of variables that are local to functions
    and blocks. Therefore, it is possible to encounter memory “overflow” during dynamic
    allocation process.


