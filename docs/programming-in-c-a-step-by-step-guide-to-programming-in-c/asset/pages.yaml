  md: '# 12.4 The Concept of Linked List


    When dealing with many problems we need a dynamic list, dynamic in the sense that
    the size requirement need not be known at compile time. Thus, the list may grow
    or shrink during runtime. A linked list is a data structure that is used to model
    such a dynamic list of data items, so the study of the linked lists as one of
    the data structures is important.


    An array is represented in memory using sequential mapping, which has the property
    that elements are fixed distance apart. But this has the following disadvantage:
    It makes insertion or deletion at any arbitrary position in an array a costly
    operation, because this involves the movement of some of the existing elements.


    When we want to represent several lists by using arrays of varying size, either
    we have to represent each list using a separate array of maximum size or we have
    to represent each of the lists using one single array. The first one will lead
    to wastage of storage, and the second will involve a lot of data movement.


    So we have to use an alternative representation to overcome these disadvantages.
    One alternative is a linked representation. In a linked representation, it is
    not necessary that the elements be at a fixed distance apart. Instead, we can
    place elements anywhere in memory, but to make it a part of the same list, an
    element is required to be linked with a previous element of the list. This can
    be done by storing the address of the next element in the previous element itself.
    This requires that every element be capable of holding the data as well as the
    address of the next element. Thus every element must be a structure with a minimum
    of two fields, one for holding the data value, which we call a data field, and
    the other for holding the address of the next element, which we call link field.'
