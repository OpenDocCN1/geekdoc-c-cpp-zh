    (that is, more % signs) than the arguments, or if the arguments have the wrong
    types for the format specifiers, printf() can misbehave badly, often printing
    nonsense numbers or (even worse) numbers which mislead you into thinking that
    some other part of your program is broken.


    Because of some automatic conversion rules which we haven''t covered yet, you
    have a small amount of latitude in the types of the expressions you pass as arguments
    to printf(). The argument for %c may be of type char or int, and the argument
    for %d may be of type char or int. The string argument for %s may be a string
    constant, an array of characters, or a pointer to some characters. Finally, the
    arguments corresponding to %e, %f, and %g may be of types float or double. But
    other combinations do not work reliably: %d will not print a long int or a float
    or a double; %ld will not print an int; %e, %f, and %g will not print an int.


