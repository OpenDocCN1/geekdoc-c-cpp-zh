    # 3.2 Floating-point Numbers


    Floating point (or real) numbers are stored in 32 bit (on all 16 bit and 32 bit
    machines), with 6 digits of precision. Floating point numbers are defined in C
    by the keyword float. When the accuracy provided by a float number is not sufficient,
    the type double can be used to define the number. A double data type number uses
    64 bits giving a precision of 14 digits. These are known as double precision numbers.
    To extend the precision further, we may use long double which uses 80 bits. The
    table 3.1 shows all the allowed combinations of floating point numbers and qualifiers
    and their size and range on a 16-bit machine.


    Table 3.1: Floating point numbers and qualifiers and their size and range on a
    16-bit machine.


    | Type | Size (bits) | Range |

    |---|---|---|

    | Float | 32 | 3.4E-38 to 3.4E+38 |

    | Double | 64 | 1.7E-308 to 1.7E+308 |

    | long double | 80 | 3.4E-4932 to 1.1E+4932 |'
