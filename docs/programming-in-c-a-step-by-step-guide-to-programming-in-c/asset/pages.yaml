    We discover the value pointed to by a pointer using the “contents-of” operator,
    *. Placed in front of a pointer, the * operator accesses the value pointed to
    by that pointer. In other words, if ip is a pointer, then the expression *ip gives
    us whatever it is that''s in the variable or location pointed to by ip. For example,
    we could write something like


    ```

