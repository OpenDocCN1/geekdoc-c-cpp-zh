    The **goto** requires a *label* in order to identify the place where the branch
    is to be made. A *label* is any valid variable name, and must be followed by a
    colon. The *label* is placed immediately before the statement where the control
    is to be transferred. The general forms of **goto** and *label* statements are
    shown below:


    ```

    goto label;\nlabel:\n---------- statement;\n---------- ----------\n----------
    ----------\nlabel: ----------\nstatement; goto label;\n(i) Forward jump (ii) Backward
    jump

    ```


    The *label* can be anywhere in the program either before the **goto** or after
    the **goto label;** statement. During execution of the program when a statement
    like


    ```

    goto first;

    ```


    is met, the flow of control will jump to the statement immediately following the
    label **first**. This happens unconditionally.


    Note that a **goto** breaks the normal sequential execution of the program. If
    the *label* is before the statement **goto label;** a loop will be formed and
    some statements will be executed repeatedly. Such a jump is known as a *backward
    jump*. On'
