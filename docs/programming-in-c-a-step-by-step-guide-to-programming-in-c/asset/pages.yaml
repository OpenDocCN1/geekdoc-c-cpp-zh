- pgno: 326
  md: '**fseek** allows the file position indicator for stream to be set to an arbitrary
    value (for binary files), or for text files, only to a position obtained from
    ftell, as follows:


    In the general case, the file position indicator is set to offset bytes (characters)
    from a point in the file determined by the value of ptrname.


    Offset may be negative. The values of ptrname may be SEEK_SET, which sets the
    file position indicator relative to the beginning of the file, SEEK_CUR, which
    sets the file position indicator relative to its current value, and SEEK_END,
    which sets the file position indicator relative to the end of the file. The latter
    is not necessarily guaranteed to work properly on binary streams.


    For text files, offset must either be zero or a value returned from a previous
    call to ftell for the same stream, and the value of ptrname must be SEEK_SET.


    fseek clears the end of file indicator for the given stream and erases the memory
    of any ungetc. It works for both input and output.

    Zero is returned for success, non-zero for a forbidden request.


    Note that for ftell and fseek it must be possible to encode the value of the file
    position indicator into a long. This may not work for very long files, so the
    Standard introduces fgetpos and fsetpos which have been specified in a way that
    removes the problem.


    fgetpos stores the current file position indicator for stream in the object pointed
    to by pos. The value stored is ‘magic’ and only used to return to the specified
    position for the same stream using fsetpos.'
