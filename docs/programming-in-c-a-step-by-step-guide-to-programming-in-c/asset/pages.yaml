    to it:


    ```

    int i = 5;

    ```


    ```

    ip = &i;

    ```


    The assignment expression ip = &i; contains both parts of the “two-step process”:
    &i generates a pointer to i, and the assignment operator assigns the new pointer
    to (that is, places it “in”) the variable ip. Now ip “points to” i, which we can
