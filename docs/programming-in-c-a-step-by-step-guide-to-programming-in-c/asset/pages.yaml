    # 5.2 Function Basics


    A function is a self-contained program segment that carries out some specific,
    well-defined task. Every C program contains one or more functions. One of these
    functions must be called main. Program execution will always begin by carrying
    out the instructions in main. Additional functions will be subordinate to main,
    and perhaps to one another.


    So what defines a function? It has a name that you call it by, and a list of zero
    or more arguments or parameters. Parameters (also called formal parameters) or
    arguments are the special identifiers through which information can be passed
    to the function. A function has a body containing the actual instructions (statements)
    for carrying out the task the function is supposed to perform; and it may give
    you back a return value, of a particular type.


    In general terms, the first line can be written as


    data-type name(data-type parameter 1, data-type parameter 2, ..., data-type parameter
    n)


