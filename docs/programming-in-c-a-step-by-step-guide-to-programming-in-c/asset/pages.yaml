    which would print 5, since ip points to i, and i is (at the moment) 5.


    (You may wonder how the asterisk * can be the pointer contents-of operator when
    it is also the multiplication operator. There is no ambiguity here: it is the
    multiplication operator when it sits between two variables, and it is the contents-of
    operator when it sits in front of a single variable. The situation is analogous
    to the minus sign: between two variables or expressions it''s the subtraction
    operator, but in front of a single operator or expression it''s the negation operator.
    Technical terms you may hear for these distinct roles are unary and binary: a
    binary operator applies to two operands, usually on either side of it, while a
    unary operator applies to a single operand.)'
