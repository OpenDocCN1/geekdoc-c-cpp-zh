    # 7.4 Strings


    Strings in C are represented by arrays of characters. The end of the string is
    marked with a special character, the null character, which is simply the character
    with the value 0. (The null character has no relation except in name to the null
    pointer. In the ASCII character set, the null character is named NULL.) The null
    or string-terminating character is represented by another character escape sequence,
    \0.


    Because C has no built-in facilities for manipulating entire arrays (copying them,
    comparing them, etc.), it also has very few built-in facilities for manipulating
    strings.'
