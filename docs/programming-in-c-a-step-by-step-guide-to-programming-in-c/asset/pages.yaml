    # Table 1.2: Basic types, qualifiers and their size


    | Type | Size (bits) | Range |

    |---|---|---|

    | int or signed int | 16 | -32,768 to 32,767 |

    | unsigned int | 16 | 0 to 65535 |

    | short int or signed short int | 8 | -128 to 127 |

    | unsigned short int | 8 | 0 to 255 |

    | long int or signed long int | 32 | -2,147,483,648 to 2,147,483,647 |

    | unsigned long int | 32 | 0 to 4,294,967,295 |


    Informally, a *variable* (also called an *object*) is a place where you can store
    a value so that you can refer to it unambiguously. A variable needs a name. You
    can think of the variables in your program as a set of boxes, each with a label
    giving its name; you might imagine that storing a value “in" a variable consists
    of writing the value on a slip of paper and placing it in the box.


    Now let us see how integers and variables are declared. A *declaration* tells
    the compiler the name and type of a variable you''ll be using in your program.
    In its simplest form, a declaration consists of the type, the name of the variable,
    and a terminating semicolon:


    ```

    int i;

    ```


    The above statement declares an integer variable i.


    ```

