    reads, or, if there are no more characters available, the special value EOF (“end
    of file”). This value will be assigned within the stdio.h file. Typically, EOF
    will be assigned the value -1, but this may vary from one compiler to another.


    The syntax of the **getchar()** function is written as


    ```

    character variable = getchar()

    ```


    where *character variable* refers to some previously declared character variable.


    Example:


    ```

    char c;


