    # 13.3 Closing Files


    Although you can open multiple files, there''s a limit to how many you can have
    open at once. If your program will open many files in succession, you''ll want
    to close each one as you''re done with it; otherwise the standard I/O library
    could run out of the resources it uses to keep track of open files. Closing a
