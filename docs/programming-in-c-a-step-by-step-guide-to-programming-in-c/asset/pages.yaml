    # The *continue* statement


    The **continue** statement is used to continue the next iteration of the loop
    by skipping a part of the body of the loop (for, **do/while** or **while** loops).
    The *continue* statement does not apply to a **switch**, like a *break* statement.
    Unlike the **break** which causes the loop to be terminated, the **continue**,
    causes the loop to be continued with the next iteration after skipping any statements
    in between.


