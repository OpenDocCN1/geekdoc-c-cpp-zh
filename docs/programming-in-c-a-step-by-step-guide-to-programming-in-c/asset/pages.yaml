    # 14.6 Summary


    The most important aspect of program development is finding a good representation
    of the data manipulated by that program. The stack and the queue are examples
    of ADTs commonly used in computer programming. A stack is basically a list with
    insertions and deletions permitted from only one end, called the stack-top, so
    it is a data structure that exhibits the LIFO property. One of the important applications
    of a stack is in the implementation of recursion in the programming language.
    A queue is also a list with insertions permitted from one end, called rear, and
    deletions permitted from the other end, called front. So it is a data structure
    that exhibits the FIFO property. When the size of the stack/queue is known beforehand,
    the array implementation can be used and is more efficient.


    When the size of the stack/queue is not known beforehand, then the linked representation
    is used. It provides more flexibility. A circular queue is a queue in which the
    element next to the last element is the first element.


