  md: 'catch your mistake. Nor would the compiler necessarily be able to tell the
    difference if for some perverse reason you deliberately declared a second variable
    named supercalafragalisticespialidociouz.)

    The capitalization of names in C is significant: the variable names variable,
    Variable, and VARIABLE (as well as silly combinations like variAble) are all distinct.


    A final restriction on names is that you may not use keywords (the words such
    as int and for which are part of the syntax of the language) as the names of variables
    or functions (or as identifiers of any kind).


    Now let us see how you can assign values to variables. The assignment operator
    = assigns a value to a variable. For example,

    x = 1;

    sets x to 1, and

    a = b;

    sets a to whatever b''s value is. The expression

    i = i + 1;

    is, as we''ve mentioned elsewhere, the standard programming idiom for increasing
    a variable''s value by 1: this expression takes i''s old value, adds 1 to it,
    and stores it back into i. (C provides several “shortcut” operators for modifying
    variables in this and similar ways, which we''ll meet later.)


    We''ve called the = sign the “assignment operator" and referred to “assignment
    expressions" because, in fact, = is an operator just like + or -. C does not have
    “assignment statements"; instead, an assignment like a = b is an expression and
    can be used wherever any expression can appear. Since it''s an expression, the
    assignment a = b has a value, namely, the same value that''s assigned to a. This
    value can then be used in a larger expression; for example, we might write

    c = a = b;'
