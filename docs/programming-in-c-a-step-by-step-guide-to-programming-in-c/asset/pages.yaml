- pgno: 16
  md: "We can also declare several variables of the same type in one declaration,\
    \ separating them with commas as shown above.\n\nThe placement of declarations\
    \ is significant. You can't place them just anywhere (i.e. they cannot be interspersed\
    \ with the other statements in your program). They must either be placed at the\
    \ beginning of a function, or at the beginning of a brace-enclosed block of statements,\
    \ or outside of any function. Furthermore, the placement of a declaration, as\
    \ well as its storage class, controls several things about its *visibility* and\
    \ *lifetime*, as we'll see later.\n\nYou may wonder *why* variables must be declared\
    \ before use. There are two reasons:\n\n+   1. It makes things somewhat easier\
    \ on the compiler; it knows right away what kind of storage to allocate and what\
    \ code to emit to store and manipulate each variable; it doesn't have to try to\
    \ intuit the programmer's intentions.\n+   \n+   2. It forces a bit of useful\
    \ discipline on the programmer: you cannot introduce variables wherever you wish;\
    \ you must think about them enough to pick appropriate types for them. (The compiler's\
    \ error messages to you, telling you that you apparently forgot to declare a variable,\
    \ are as often helpful as they are a nuisance: they're helpful when they tell\
    \ you that you misspelled a variable, or forgot to think about exactly how you\
    \ were going to use it.)\n\nMost of the time, it is recommended to write one declaration\
    \ per line. For the most part, the compiler doesn't care what order declarations\
    \ are in. You can order the declarations alphabetically, or in the order that\
    \ they're used, or to put related declarations next to each other. Collecting\
    \ all variables of the same type together on one line essentially orders declarations\
    \ by type, which isn't a very useful order (it's only slightly more useful than\
    \ random order).\n\nA declaration for a variable can also contain an initial value.\
    \ This *initializer* consists of an equal sign and an expression, which is usually\
    \ a single constant:"
