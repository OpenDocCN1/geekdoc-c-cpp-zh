  md: 'In fact, C''s only truly built-in string-handling is that it allows us to use
    *string constants* (also called *string literals*) in our code. Whenever we write
    a string, enclosed in double quotes, C automatically creates an array of characters
    for us, containing that string, terminated by the \0 character. For example, we
    can declare and define an array of characters, and initialize it with a string
    constant:


    ```

    char string[] = "Hello, world!";

    ```


    In this case, we can leave out the dimension of the array, since the compiler
    can compute it for us based on the size of the initializer (14, including the
    terminating \0). This is the only case where the compiler sizes a string array
    for us, however; in other cases, it will be necessary that *we* decide how big
    the arrays and other data structures we use to hold strings are.


    To do anything else with strings, we must typically call functions. The C library
    contains a few basic string manipulation functions, and to learn more about strings,
    we''ll be looking at how these functions might be implemented.


    Since C never lets us assign entire arrays, we use the **strcpy** function to
    copy one string to another:


    ```

    #include <string.h>

    char string1[] = "Hello, world!";

    char string2[20];

    strcpy(string2, string1);

    ```


    The destination string is **strcpy''s** first argument, so that a call to **strcpy**
    mimics an assignment expression (with the destination on the left-hand side).
    Notice that we had to allocate string2 big enough to hold the string that would
    be copied to it. Also, at the top of any source file where we''re using the standard
    library''s string-handling functions (such as **strcpy**) we must include the
    line


    ```

    #include <string.h>

    ```'
