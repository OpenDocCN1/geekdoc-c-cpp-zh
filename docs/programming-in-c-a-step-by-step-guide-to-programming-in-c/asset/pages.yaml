- pgno: 277
  md: 'What if we''re not allocating characters, but integers? If we want to allocate
    100 ints, how many bytes is that? If we know how big ints are on our machine (i.e.
    depending on whether we''re using a 16- or 32-bit machine) we could try to compute
    it ourselves, but it''s much safer and more portable to let C compute it for us.
    C has a sizeof operator, which computes the size, in bytes, of a variable or type.
    It''s just what we need when calling malloc. To allocate space for 100 ints, we
    could call


    ```

    int *ip =(int *)malloc(100 * sizeof(int));

    ```


    The use of the sizeof operator tends to look like a function call, but it''s really
    an operator, and it does its work at compile time.


    Since we can use array indexing syntax on pointers, we can treat a pointer variable
    after a call to malloc almost exactly as if it were an array. In particular, after
    the above call to malloc initializes ip to point at storage for 100 ints, we can
    access ip[0], ip[1], ... up to ip[99]. This way, we can get the effect of an array
    even if we don''t know until run time how big the “array" should be. (In a later
    section we''ll see how we might deal with the case where we''re not even sure
    at the point we begin using it how big an “array" will eventually have to be.)


    Our examples so far have all had a significant omission: they have not checked
    malloc''s return value. Obviously, no real computer has an infinite amount of
    memory available, so there is no guarantee that malloc will be able to give us
    as much memory as we ask for. If we call malloc(100000000), or if we call malloc(10)
    10,000,000 times, we''re probably going to run out of memory.


    When malloc is unable to allocate the requested memory, it returns a null pointer.
    A null pointer, remember, points definitively nowhere. It''s a “not a pointer"
    marker; it''s not a pointer you can use. Therefore, whenever you call malloc,
    it''s vital to check the returned pointer before using it! If you call malloc,
    and it returns a null pointer, and you go off and use that null pointer as if
    it pointed somewhere, your program probably won''t last long. Instead, a program
    should immediately check for a null pointer, and if it receives one, it should
    at the very least print an error message and exit, or perhaps figure out some
    way of proceeding without the memory it asked for. But it cannot go on to use
    the null pointer'
