    # 10.1 Introduction


    In the previous units, you studied about the pointers as a most powerful tool
    in C programming language. It is due to the pointer only that makes C as the most
    beautiful language. In this unit, you will study another useful ways of making
    the program easy and efficient. This unit will enable you to learn about the structures
    and unions.


    As we know an array is a data structure whose elements are all of the same data
    type. We now turn our attention to the structure, which is a data structure whose
    individual elements can differ in type. Thus, a single structure might contain
    integer elements, floating-point elements and character elements. Pointers, arrays
    and other structures can also be included as elements within a structure.


    This unit is concerned with the use of structures within a C program. We will
    see how structures are defined, and how their individual members are accessed
    and processed within a program.


    Closely associated with the structure is the union, which also contains multiple
    members. Unlike a structure, however, the members of a union share the same storage
    area, even though the individual members may differ in type.


