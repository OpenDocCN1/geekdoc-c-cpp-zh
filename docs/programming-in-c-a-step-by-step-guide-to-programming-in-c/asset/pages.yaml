  md: 'Dynamically allocated memory is deallocated with the free function. If p contains
    a pointer previously returned by malloc, you can call


    ```

    ```c

    free(p);

    ```

    ```


    which will “give the memory back” to the stock of memory (sometimes called the
    “arena” or “pool”) from which malloc requests are satisfied. Calling free is sort
    of the ultimate in recycling: it costs you almost nothing, and the memory you
    give back is immediately usable by other parts of your program. (Theoretically,
    it may even be usable by other programs.)


    (Freeing unused memory is a good idea, but it''s not mandatory. When your program
    exits, any memory which it has allocated but not freed should be automatically
    released. If your computer were to somehow “lose” memory just because your program
    forgot to free it, that would indicate a problem or deficiency in your operating
    system.)


    Naturally, once you''ve freed some memory you must remember not to use it any
    more. After calling


    ```

    ```c

    free(p);

    ```

    ```


    it is probably the case that p still points at the same memory. However, since
    we''ve given it back, it''s now “available,” and a later call to malloc might
    give that memory to some other part of your program. If the variable p is a global
    variable or will otherwise stick around for a while, one good way to record the
    fact that it''s not to be used any more would be to set it to a null pointer:
    free(p);


    ```

    ```c

    p = NULL;

    ```

    ```


    Now we don''t even have the pointer to the freed memory any more, and (as long
    as we check to see that p is non-NULL before using it), we won''t misuse any memory
    via the pointer p.'
