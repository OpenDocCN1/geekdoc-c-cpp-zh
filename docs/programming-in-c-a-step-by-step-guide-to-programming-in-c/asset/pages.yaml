- pgno: 2
  md: '# 1.1 Introduction


    C is a general-purpose, structured programming language. Its instructions consist
    of terms that resemble algebraic expressions, augmented by certain English keywords
    such as if, else, for, do and while. C was the offspring of the ‘Basic Combined
    Programming Language’ (BPCL) called B, developed in the 1960''s at Cambridge University.
    B language was modified by Dennis Ritchie and was implemented at Bell laboratories
    in 1972. The new language was named C. Since it was developed along with the UNIX
    operating system, it is strongly associated with UNIX. This operating system,
    which was also developed at Bell laboratories, was coded almost entirely in C.


    In C, the type of a variable determines what kinds of values it may take on. The
    type of an object determines the set of values it can have and what operations
    can be performed on it. This is a fairly formal, mathematical definition of what
    a type is, but it is traditional (and meaningful). There are several implications
    to remember:


    +   1. The “set of values" is finite. C''s int type cannot represent all of the
    integers; its float type cannot represent all floating-point numbers.


    +   2. When you''re using an object (that is, a variable) of some type, you may
    have to remember what values it can take on and what operations you can perform
    on it. For example, there are several operators which play with the binary (bit-level)
    representation of integers, but these operators are not meaningful for and may
    not be applied to floating-point operands.


    +   3. When declaring a new variable and picking a type for it, you have to keep
    in mind the values and operations you''ll be needing.'
