    *value* or replacement text for the macro MAXLINE was the 4 characters `100;`,
    and that''s exactly what the preprocessor substituted (even though it didn''t
    make any sense).


    Simple macros like MAXLINE act sort of like little variables, whose values are
    constant (or constant expressions). It''s also possible to have macros which look
    like little functions (that is, you invoke them with what looks like function
    call syntax, and they expand to replacement text which is a function of the actual
    arguments they are invoked with) but we won''t be looking at these yet.


    # 11.3.1 Macros with arguments


    The preprocessor permits us to define more complex and more useful form of replacements.
    It takes the form:


    ```

    ```c

    #define identifier(f1, f2, ..., fn) string

    ```

    ```


    Notice that there is no space between the macro identifier and the left parenthesis.
    The identifiers f1, f2, ..., fn are the formal macro arguments that are analogous
    to the formal arguments in a function definition.'
