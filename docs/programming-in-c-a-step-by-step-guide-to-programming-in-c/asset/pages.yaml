    the return value is assigned to the variable j. (Notice that the value of main''s
    local variable i will become the value of **multbyfour''s** parameter x; this
    is absolutely not a problem, and is a normal sort of affair.)


    This example is written out in “longhand,” to make each step equivalent. The variable
    i isn''t really needed, since we could just as well call j = multbyfour(5);


    And the variable j isn''t really needed, either, since we could just as well call
    printf("%d\n", multbyfour(5));


    Here, the call to **multbyfour** is a subexpression which serves as the second
    argument to **printf**. The value returned by **multbyfour** is passed immediately
    to **printf**. (Here, as in general, we see the flexibility and generality of
    expressions in C. An argument passed to a function may be an arbitrarily complex
    subexpression, and a function call is itself an expression which may be embedded
    as a subexpression within arbitrarily complicated surrounding expressions.)'
