  md: "In order to solve a problem recursively, two conditions must be satisfied.\
    \ First, the problem must be written in a recursive form, and the second, the\
    \ problem statement must include a stopping condition.\n\n**Example 5.3: Factorial\
    \ of a number.** Suppose we wish to calculate the factorial of a positive integer,\
    \ n. We would normally express this problem as n! = 1 x 2 x 3 x ... x n.\n\nThis\
    \ can also be written as n! = n x (n−1)!. This is the recursive statement of the\
    \ problem in which the desired action (the calculation of n!) is expressed in\
    \ terms of a previous result (the value of (n−1)! which is assumed to be known).\
    \ Also, we know that 0! = 1 by definition. This expression provides stopping condition\
    \ for the recursion.\n\nThus the recursive definition for finding factorial of\
    \ positive integer n can be written as:\n\n```\nfact(n) = {\n    1 if n = 0\n\
    \    n x fact(n−1) otherwise\n}\n```\n\n```\nProgram 5.4: Program to find factorial\
    \ of a given positive integer\n#include <stdio.h>\n\nmain()\n{\n    int n;\n \
    \   long int fact(int);\n\n    /* Read in the integer quantity */\n    scanf(\"\
    %d\", &n);\n\n    /* calculate and display the factorial */\n    printf(\"n!=%ld\\\
    n\", fact(n));\n}\n\nlong int fact(int n)\n```"
