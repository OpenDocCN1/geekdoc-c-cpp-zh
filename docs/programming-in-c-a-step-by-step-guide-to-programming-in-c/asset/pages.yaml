    # Explanation


    1.In an infix expression, a binary operator separates its operands (a unary


    operator precedes its operand). In a postfix expression, the operands of an operator
    precede the operator. In a prefix expression, the operator precedes its operands.
    Like postfix, a prefix expression is parenthesis free, that is, any infix expression
    can be unambiguously written in its


    prefix equivalent without the need for parentheses.


    2.To convert an infix expression to reverse-prefix, it is scanned from right to
