    This declaration looks like our earlier declarations, with one obvious difference:
    that is the asterisk. The asterisk means that ip, the variable we''re declaring,
    is not of type int, but rather of type pointer-to-int. (Another way of looking
    at it is that *ip, which as we''ll see is the value pointed to by ip, will be
    an int.)


    We may think of setting a pointer variable to point to another variable as a two-step
    process: first we generate a pointer to that other variable, and then we assign
    this new pointer to the pointer variable. We can say (but we have to be careful
    when we''re saying it) that a pointer variable has a value, and that its value
    is “pointer to that other variable”. This will make more sense when we see how
    to generate pointer values.


    Pointers (that is, pointer values) are generated with the “address-of” operator
    &, which we can also think of as the “pointer-to” operator. We demonstrate this
