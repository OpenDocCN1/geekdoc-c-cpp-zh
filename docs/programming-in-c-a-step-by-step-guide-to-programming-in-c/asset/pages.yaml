    # 14.4.2 Implementation of a Stack Using Linked Representation


    Initially the list is empty, so the top pointer is NULL. The push function takes
    a pointer to an existing list as the first parameter and a data value to be pushed
    as the second parameter, creates a new node by using the data value, and adds
    it to the top of the existing list. A pop function takes a pointer to an existing
    list as the first parameter, and a pointer to a data object in which the popped
    value is to be returned as a second parameter. Thus it retrieves the value of
    the node pointed to by the top pointer, takes the top point to the next node,
    and destroys the node that was pointed to by the top.


