  md: 'For example, in ANSI C, the function to delete a file is `remove`. On older
    Unix systems, however, the function was called `unlink`. So if filename is a variable
    containing the name of a file you want to delete, and if you want to be able to
    compile the program under these older Unix systems,


    you might write


    ```

    ```c

    #ifdef unix

    unlink(filename);

    #else

    remove(filename);

    #endif

    ```

    ```


    Then, you could place the line


    ```

    ```c

    #define unix

    ```

    ```


    at the top of the file when compiling under an old Unix system. (Since all you''re
    using the macro unix for is to control the #ifdef, you don''t need to give it
    any replacement text at all. *Any* definition for a macro, even if the replacement
    text is empty, causes an #ifdef to succeed.) (In fact, in this example, you wouldn''t
    even need to define the macro unix at all, because C compilers on old Unix systems
    tend to predefine it for you, precisely so you can make tests like these.)


    You want to compile several different versions of your program, with different
    features present in the different versions. You bracket the code for each feature
    with #ifdef directives, and (as for the previous case) arrange to have the right
    macros defined or not to build the version you want to build at any given time.
    This way, you can build the several different versions from the same source code.
    (One common example is whether you turn debugging statements on or off. You can
    bracket each debugging printout with #ifdef DEBUG and #endif, and then turn on
    debugging only when you need it.)'
