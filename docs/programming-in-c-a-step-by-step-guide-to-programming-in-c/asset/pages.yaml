    # 1.2 Features of C and its Basic Structure


    C is characterized by the ability to write very concise source programs, due in
    part to the large number of operators included within the language.


    It has a relatively small instruction set, though actual implementations include
    extensive library functions which enhance the basic instructions. The language
    encourages users to write additional library functions of their own. Thus, the
    features and capabilities of the language can easily be extended by the user.


    C compilers are commonly available for computers of all sizes. The compilers are
    usually compact, and they generate object programs that are small and highly efficient
    when compared with programs compiled from other high-level languages.'
