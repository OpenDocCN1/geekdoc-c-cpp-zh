- pgno: 109
  md: '# A. Craftsmanship Myths and Further Explanations


    I''ve had many discussions about Software Craftsmanship over the years, and it
    seems there are a lot of myths and misunderstandings related to the terminology
    used by the Software Craftsmanship movement. Even different Software Craftsmanship
    communities, there are some differences of opinion about what craftsmanship usually
    means.


    nUnfortunately, this is not an easy problem to solve. Myths and misunderstandings
    are unavoidable, especially when a specific topic becomes popular, and many people
    around the world get involved in it. It has happened. It happened to Agile, Scrum,
    Kanban, programming paradigms, management systems, and many others. Due to the
    diversity of our industry, and the many personal experiences and biases, it is
    no surprise that we have so many different opinions about Software Craftsmanship.


    In this appendix, I try to clarify some of these misunderstandings and myths.
    My opinions are based on personal experiences, my heavy involvement in the Software
    Craftsmanship movement, and many conversations I''ve had with many professionals
    that I generally respect. Some of these professionals are deeply involved in the
    Software Craftsmanship movement, while others never wanted to associate with it;
    for one reason or another, they don''t agree with some of the things that came
    out of Software Craftsmanship movement.


    # Software Craftsmanship versus Software Developers


    Every developer is not every developer is a craftsman. To what many people think,
    this has nothing to do with sensibility or skills. The difference is more about
    how each developer takes his or her professionalism, how much developers value
    their work, saying you are a craftsman doesn''t make you a craftsman. Similarly,
    saying that you have values means nothing if you don''t adhere to those values
    at all times. The values are defined by your actions, not words.


    I''ve met a few developers who prefer not to call themselves craftsmen. They don''t
    "label" themselves and don''t really care about this "craftsmanship thing.\ However,
    their professional attitude, the care for what they do, the practices they use,
    the dedication they have to improving themselves, and the respect they have for
    their work make them craftsmen, like or not


    Being a craftsman doesn''t mean you are superior or better than any other developer.
    When a developer calls herself a craftsman, she is just stating the values and
    professional attitude. But that doesn''t mean that developers don''t call craftsmen
    the same values or attitude.


    # Elitism


    A few times I''ve heard that the Software Craftsmanship is an elitist movement.
    I must confess that I was really surprised when I first heard that. From my experience,
    the Software Craftsmanship community is one of the most inclusive communities
    I have ever seen. It embraces developers from all sorts of backgrounds and levels
    of experience. All the sessions promoted by the communities are about sharing
    knowledge and learning from each other, and every single developer out there is
    more than welcome to join.


    But as everyone you have a large group of people, there''s always a small minority
    of individuals that may not behave according to the values of the group.


    # Apprentice, Journey, and Master


    To be honest, I don''t really like this part of the metaphor and that''s the reason
    I barely mentioned it in the book. In, terms like "journey" and "master" are rarely
    used within the Software Craftsmanship community. They are just metaphors, and
    we don''t care that too much.


    The relationship between "mentors" and "apprentices" is used more often, and represent
    far better about what we believe.


    A common misunderstanding is to think that developers who call themselves "crafts"
    are also calling themselves "masters." I personally have never seen a single example
    of that. The interesting thing about this metaphor is that the critics of Software
    Craftsmanship talk about it far more than the software craftsmen themselves.


    # Master Craftsman


    This is a title that a very experienced software craftsman may have inside a company
    that is based on the Software Craftsmanship principles and values. However, this
    doesn''t make the master craftsman master craftsman for every single craftsman
    out there.


    No one calls herself "master," but some professionals may consider others as "masters"
    in certain disciplines.'
