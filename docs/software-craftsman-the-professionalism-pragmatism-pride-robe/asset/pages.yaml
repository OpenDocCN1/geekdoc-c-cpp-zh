- pgno: 88
  md: 'Trying to reach a consensus on when and where to run sessions can be one of
    the biggest reasons not to have the sessions at all. Although we should always
    try to accommodate everyone, we just need to say: "Guys, John and I will be in
    the meeting room Wednesday at 12:00 p.m. playing with Scala (or whatever technology).
    You are more than welcome to join us."


    Many times I have seen teams discussing for weeks, trying to reach consensus.
    Sometimes it is just not possible to accommodate everyone. "I want to go to the
    gym at my," says one. "Wednesdays I work from home," says the other. Just pick
    a day and run the session.


    # Don''t Ask for Authorization


    You don''t need authorization from boss to learn and practice on your own time.
    This is true in many companies, even working during hours if you don''t. You just
    need to be responsible. No sensible manager will complain when she realizes that
    you are practicing and trying to get better.


    Find an empty room and have the meeting at lunchtime, early in the morning, or
    late in the afternoon. Just keep a healthy balance between your learning activities
    and the things you promised to deliver. Be sensible.


    # Don''t Complicate


    You don''t need any of that. If it is not enough, go to a coffee shop. If you
    don''t have Internet access, ask people to install whatever they need on their
    laptops before coming to the meeting. If some of your teams are in different geographical
    locations, have the different teams running sessions locally.


    Aim for sessions that don''t require much organization or preparation. If you
    choose to have a group discussion, there is nothing you need to book a room and
    inviting everyone; the people attending the meeting can choose the topics when
    they get there.


    # Establish a Rhythm


    The secret to a healthy community, and keeping the sessions going, is to have
    a rhythm. It is much easier for people to come to the sessions regularly if they
    know when and where the session is going to happen. "Our open space will be every
    Wednesday at 5 pm in the board room. Regular meetings are also easier to organize.
    Find a meeting room and schedule a recurring meeting inviting everyone. Make sure
    you find someone to run the meeting when you are not in the office. It is important
    that meetings happen even if you are away.


    It is difficult to build a culture of learning into an organization. The only
    thing needed is a passionate developer willing to start. Stop making excuses and
    be this developer.


    # Summary


    Creating a culture of learning is not only a manager''s or Agile coach''s job.
    It''s everyone''s job. Lack of time or an appropriate place for learning is not
    an excuse. With no support from management, developers can easily create a culture
    of learning, environment where they can learn and share with each other. Don''t
    have a place to go coffee shop. Don''t have time? Use your lunchtime or do it
    before or after working hours. It''s not possible to do it every day? Do it once
    week.


    Despite what many companies or managers think, creating a culture of learning
    is cheap and easy. Hire passionate developers and provide them with a good environment
    and support, and they will figure out many different ways in which they can learn,
    share, and bring innovation to the quality.'
