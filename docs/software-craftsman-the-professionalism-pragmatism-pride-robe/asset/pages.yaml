  md: '# The Agile Transformation Era


    Agile was a major revolution in our industry and, by bit, by companies adopted
    it. Consultancy companies and individuals specialized in helping companies go
    through the Agile journey. The role of the Agile coach emerged. Agile coaches
    go to companies; analyze their problems, people, and people; and help them change
    in order to become more agile. Companies started to visualize and understand where
    their inefficiencies were.


    During these Agile transformations. Scrum, combined with a few more specific techniques,
    was normally the methodology of choice. What was a great entry point into the
    Agile world. The notion of self-organization teams was really for many companies.
    Accepting the idea of having teams backlogs, backing and splitting stories, estimates,
    and helping with priority features at the end of each iteration was a massive
    step forward. Communication also improved. Team started to talk to each other
    and with their customers much more often—another agile them in certain companies.


    Providing an environment where more people interact with each helped companies
    to solve problems and understand weaknesses and strengths of teams and individuals.
    Agile processes helped to unite teams members, providing with common goal.


    Agile processes definitely helped companies to move forward, not only exposing
    their problems but also providing a feedback loop that they needed to react and
    adapt.


    # The Agile Hangover


    For a few years, companies and teams were in this Agile transformation part. Companies
    were transformed. Meetings started to be meeting—although some companies have
    a team in a room, sitting down for one hour. Burn-down charts, iteration backlogs,
    and release backlogs became the new project management tools. We used user cases
    other stories. Project managers became Scrum masters And Agile became the new
    name for their way of working. Some changes were not noticeable. If you looked
    at teams from offices before and after the Agile transformation, the difference
    could be massive.


    We were not. Some companies were Agile by one or more people around a single computer,
    and whatever became Post-Its. And what was Agile meant to many companies. The
    number of color Post-Its on a whiteboard became their true measure of Agile. The
    more Post-Its, the more Agile they thought they were. Very mature companies could
    be identified by their use of Post-Its, of course, or anything else. Anyway, whatever
    was agile, everyone could see the color Post-Its-moving of some time they seemed
    well, a bit faster, not at some time, and everyone had that feeling of freedom
    and empowerment. Freedom member could do whatever he or she wanted to—as long
    as his or her boss lasted. And one day, after a few months, or in years, cases
    of having Agile ended with a massive hangover. Agile hangover.


    They realized that after all this transformation, they were still not delivering
    software with quality fast enough. In fact, many of the teams and companies still
    had the same problems they had before the Agile transformation. They spent a long
    time to doing anything although they were producing it. They had loads of technical
    debt, even in projects that they started from scratch in Agile fashion. Motivation
    was still a big problem. The quality assurance (QA) teams still had a period (a
    few days, a few weeks) after each sprint. Their code bases were a mess and slowing
    them down. The size of bugs was not small enough. They had still applications
    that no understood and everyone was scared to touch. Debugging and log file were
    still their main techniques for figuring out what he was going on. Managers were
    still talking about decommissions projects just a few weeks after the start. The
    code was not written in Agile, which was becoming the bottleneck.


    # A Partial Transformation


    Over the years I have seen, and was of, many Agile transformation projects. I
    have seen many companies strongly that they wanted to adopt Agile but not make
    enough to actually be agile. They wanted a prescription: something that they could
    follow to magically make them better. But many companies and teams claim that
    Agile does not work. They went through this Agile transformation and were not
    really better than they were before.'
