    # Engage with External Technical Communities


    Although we covered many ways to establish a culture of learning in our organizations,
    we shouldn''t stop there. Why not limit ourselves to our small group? Check if
    there are any technical communities or user groups in your town. Invite your colleagues
    to go to their meetings. Get involved and see how you can contribute.


    Exposing yourself to many passionate and amazingly developers from the communities
