- pgno: 84
  md: 'development is not an exciting career, and like their seniors, they start planning
    how to become managers or architects; they believe this is their natural career
    progression. These young developers, as they join our industry, have to deal with
    much crap and unnecessarily complex code produced by their seniors that, for them,
    creating presentations on PowerPoint and spreadsheets on Excel seems more attractive
    than writing code.


    On the other hand, same junior developers have been brought up in an environment
    where their seniors were always trying to get better at what they do, getting
    excited every time they found a better way to do things or learning new—they would
    have enjoyed their professions. With highly motivated developers who have found
    doing what they do and who are constantly looking out their own cubicles, companies
    could benefit immensely from all the innovations and efficiencies they would bring.


    Instead of having managers trying to impose how, when, and what developers should
    learn, companies should decide which developers to recruit based on their interest.
    Let developers decide how, when, and what they want to learn. With this freedom,
    developers will have a much better chance of creating and building a culture of
    learning. The better the developers are, the more native and agile the code they
    can be. If the company becomes a place where developers are happy, many other
    developers will be attracted to it.


    Let''s explore some of the things developers can do to create such an environment.


    # Start a Book Club


    Pick a book and tell you will start reading. Tell them what the book is and check
    if anyone is interested in having a discussion about it at lunchtime—or any other
    suitable time. If at least one developer is interested, they are ready to start.


    If one is interested, ask them what other sorts of book (or subject) they want
    to explore. Make a list of the wanted topics, pick the one most interested in,
    do some research, and present them with a small list of books on the topic. As
    a group, choose one of them and schedule the first meeting.


    If no is interested, start reading the book, but then take the time when you are
    learning informal conversations. Maybe some of the developers who were not interested
    will change their minds and join you.


    # Have a Tech Lunch (Bag Session)


    Ask your team, if so would, they like to have lunch together while talking about
    technical stuff. The meeting doesn''t have to be anything; what do you want to
    talk about when you get there. Although could be beneficial to discuss improvements
    to the project you are working on, don''t make this about work. What about learning.
    Make about different technologies, approaches, techniques, methods, or whoever
    else wants to share and discuss. If people present some of the ideas they could
    use to improve the project you are working on, schedule a time to discuss it.


    Tech lunches are easy to set up because there is no preparation or organization.
    You just need a place and bring their own lunch. I recommend using a meeting room
    of a coffee shop or restaurant; that you can use whiteboards, flip charts, and
    projectors


    # Have Group Discussions (Roundtables)


    Divide a or whiteboard in two. One side is for talks; the other side for topics
    to be discussed in a group. Hang Post-it notes for all the participants (or on
    the table). Ask participants to write down the title of the talk they want to
    give (five minutes for the talk, two minutes for questions) or the topic they
    want to discuss as a.


    Start with the talking. Giving people talks can stand up and show. You can use
    the whiteboard or projector if they want. Make sure control the talk. If there
    are many questions after the talk is finished, then use up time and move the next
    talk Post-it to the group discussion. Tell everyone they will have the opportunity
    to discuss that topic if they want.


    Once the talking (if any) are over, move on to the group discussion. Read the
    first one out loud and whoever wrote it gives a 30-second explanation about what
    they want to discuss. Do it for all the talks. Once all the talks are explained,
    check if anyone wants to merge into a single discussion; make sure people collaborate
    and are happy about the topics. Once this is done, start all the topics again,
    then ask people to vote if they would like to discuss it. Write down the (or on
    the) number of people interested in the topic. If there is a clear winner, ask
