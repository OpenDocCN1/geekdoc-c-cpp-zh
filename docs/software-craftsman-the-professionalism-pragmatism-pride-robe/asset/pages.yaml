- pgno: 26
  md: 'The LSCC is currently the largest and most active community in the world with
    more 2,000 developers, organizing around four to five events per month, and an
    annual Software Craftmanship conference–Socrates UK. The LSCC also serves as a
    menu to help many others organizing around the world they created.


    # The Software Craftmanship Manifesto.


    Trying to come out of the anticlimax of the 2007 Software Apprenticeship Summit,
    Micah Martin wanted something to come out of the Software Craftmanship Summit.
    He wanted something to write down and a draft of some kind that he could use himself.
    They discussed, among other things, what it means to be a craftman and what it
    means to be an apprentice. They also discussed who the document would be written
    for, what the contents of it would be, if the document existed, and if it needed
    to exist at all. The ideas were captured on a whiteboard and although they came
    up with lots of ideas, there was far too much and it was far too uncertain. They
    weren''t even to a finished document. Before closing the summit, Micah asked everyone
    to sign what they were on the whiteboard


    Doug brought back an idea of focus. He noted the outcome of the summit in the
    group and collected feedback. He got lots of it. In February 2009, Doug mentioned
    an email "The New Left Side," which started to get the values and refined the
    actual Software Craftmanship Manifesto. There was a debate about the Agile Manifesto
    and the Software Craftmanship Manifesto, which was pivotal in moving forward.
    The manifesto was discussed with "The New Left Side" by Doug Bradbury and "Right
    Side, Revisited" by Scott Firth.


    The discussion around the question, "Why a Software Craftmanship Manifesto?" Cory
    Haines answered by saying, "By becoming a community, publishing a manifesto, beginning
    on establishing principles and schools of thought, we are creating a light thing
    that everyone can see. Who are really interested in apprenticeships, journeys,
    programs. In some cases, this will lead someone to these ideas, hopefully helping
    them create a nice life."


    It was a fascinating conversation which spanned the final language of the manifesto.
    The whole discussion can be read in the Software Craftmanship group. After a few
    weeks, Doug presented an elegant manifesto based on all the ideas discussed, with
    the structure of the Agile Manifesto. It was great, and the community in general
    approved it. Within another couple weeks they built and published a site where
    people could call the "Manifesto for Software Craftmanship."


    # The Manifesto


    As aspiring Software Craftsmen we are raising the bar of professional software
    development by practicing it and helping others learn the craft. Through this
    work we can come to the following value:


    +   - Not only working software,

    - also well-crafted software

    - Not only responding to change,

    - but steadily adding value

    - Not only individuals and interactions,

    - but a community of professionals

    - Not only customer collaboration,

    - but also productive partnerships


    That is, in pursuit of the essence of Software Craftmanship we on the left have
    the items on the right to be indispensable


    In the manifesto, the essence of Craftmanship is captured in "Raising the Bar."
    The manifesto summarizes the values, frustrations and aspirations of very experienced
    and talented developers. For them, projects had to stop failing because of poor
    management, ill-defined processes, and, of course, well written code.


    Developers are making the matter into their own hands and are trying to change
    how the industry see software development. They do not just by proposing new and
    revolutionary processes but also by showing their customers what they can do.
    They their customers want to work together with them in order to produce great
    and long-lived software, helping them achieve whatever they want to


    Not Only Working, but Also Well-Crafted Software

    Think about a first-year application. Imagine an application that has no tests;
    no one knows exactly how the application works; the code is full of technical
    and infrastructure issues instead of addressing the business, and classes and
    methods have failed, not thousands, of flaws. Also imagine that you need to make
    changes to this application, writing tests to is a massive undertaking. Of course,
    you think, you can pair with the other developers on the team. No, there is no
    team. You are the team. All the developers who have left and the only one you
    have is a graduate who was hired few weeks ago to look after the application.'
