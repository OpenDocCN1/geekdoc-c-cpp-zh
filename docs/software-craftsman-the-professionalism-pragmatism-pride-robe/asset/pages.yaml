  md: '# 6. Working Software


    One of the first things said by the nonbelievers of the Software Craftsmanship
    movement is that good and clean code is not enough to guarantee the success of
    a project. And yes, they are absolutely right. There are innumerable reasons for
    what may cause a software project to fail, ranging from bad business strategy,
    competitors'' superiority, bad project management, high costs to market, technical
    limitations, and integrations—just to mention a few. Due to the importance of
    things software project many organizations have not to pay much attention to those
    that are concerned with less important, like the quality of the software being
    developed. Some mistakenly believe that with a good project management, strict
    process, and a large amount of documentation, the project will succeed. Many organizations
    see software development as a production line where the workers (developers) are
    viewed as lesser than their "highly qualified" and well-paid masters. Software
    development is then outsourced to workers in cheap countries; since, if they provide
    good quality, it will not matter anyway. With a strong emphasis on top-down control
    and management, software development is treated as a detail. Very rarely companies
    find that they are able to attract or retain good software developers, leaving
    their business in the hands of inexperienced professionals.


    Traditional managers and business consultants can say whatever they want about
    the importance of good process and documentation, but the truth is that in a software
    project, the most important deliverable is the software itself. Anything else
    is secondary. Our industry seems to evolving and gradually we are all learning
    from our mistakes, and more companies are realizing the importance of having great
    people working collaboratively.


    In this chapter I discuss why working software is not enough and the invisible
    impacts of bad software. I also discuss how a change in attitude can help developers
    to deal with legacy systems and the creation of more low-quality software.


    # Working Software Is Not Enough


    In the Agile Manifesto, we have working software over comprehensive documentation.
    There are also two principles that mean working software:


    +   1. Deliver working software frequently, from a couple of weeks to a month,
    with a preference to the shorter timescale.

    2. Working software is the primary measure of progress.


    This is absolutely great and we all agree with these principles. The problem here
    is that over the years, the idea of working software moving away from high-quality
    working software, and many Agile projects are producing code that is well below
    the standards expected from a Agile project. All code counts: Imagine all those
    applications that take a long time to add a new feature or update. All developers
    are scared to touch code that is so tightly coupled. And what about those applications
    without an extensive test suite, where are we forced to test? What about the applications
    that we need to deploy in user acceptance testing (UAT) if we wanted to test because
    we cannot run it locally? They are all working software.


    So, what does "working software" mean? Can we consider the applications described
    above as working software? Is working enough? Is it acceptable to deliver something
    that takes a long time to build and to go through a long period of manual testing
    and bug fixing? And the story is repeated for every new feature? Has quality been
    forgotten or just naively taken for granted?


    # Looking After Our Garden


    Code is not mechanical. A garden needs constant maintenance. For a garden to look
    beautiful all year, we need to tend to its soil, water it regularly, remove some
    dead plants, plant new ones or rearrange existing so they can stay healthy and
    wide. With basic and regular maintenance, the garden will always look great but
    if we neglect it, for a short period of time, it will start to wither and require
    much effort to make it look good again. The longer we neglect it, the harder we
    will need to work to bring it back to life that we can enjoy. Code is not different.
