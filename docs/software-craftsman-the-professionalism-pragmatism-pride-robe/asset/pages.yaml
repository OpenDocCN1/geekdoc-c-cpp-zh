    can give you and your colleagues many ideas of what to do in your own inner CoP.


    # What if Others Don''t Want to Join?


    Different people, on different projects, in different companies, behave in different
    ways. Persuading people to change their behavior and to care about is no simple
    task. Some will even say it is impossible. If you are going to change an enterprise
    with your enthusiasm and the knowledge you get from a few books, forget it. That''s
    not going to happen. However, you can help some people to rediscover their passion
    and how great it is to be a developer.


    You don''t need to change everyone to make the organization more effective or
    a better place. That''s where the majority of the attempts to create a culture
    of learning fail. Attempting to change the whole organization (or the department,
    or the team) in one goal will bring frustration for those leading it. Frustration
    leads to lack of motivation, which in turn will make you give up. Don''t let that
    happen.


    The following sections provide advice on how can inspire software craftsmen to
    create a culture of learning.


    # Be Example


    "It''s really annoying," claims a developer. "I would love to tell people to do
    this but no one in my team want to do it." This is not an excuse, not the attitude
    of a software craftsman. How can you persuade people to do something if you don''t
    do it? The most way is to inject passion into a team, and help them embrace different
    ways of working (or different technologies), is to lead. Many developers are not
    comfortable in working hours, even if they feel that it could be a good idea.
    Having someone who is not necessarily experienced but has enthusiasm leading the
    way may be what is needed


    # Focus on Who Count


    Everyone will be moved by your enthusiasm and willingness to change. Focus on
    the ones who are willing to join. Pair with them. Write tests and review each
    other''s code. Engage in good conversations: share ideas and information. Have
    fun with them. Once a few people are having, working well together, and using
    different techniques and approaches, more people will want to join.


    # Don''t Force


    Forcing developers to attend any of the learning initiatives will make things
    worse. Keep them the invitations (as you do for all the developers), making sure
    that they feel welcome to join in whatever they want. Never let people who don''t
    want to be in the sessions discourage the fun who want to be in the session expect
    to. If people don''t want to participate, that''s OK. At least not discouraging
    others to participate in future sessions because of a bad experience.


    Don''t get disappointed or angry with developers who don''t want to join. Keep
    your own motivation, regardless of how many people turn up. As one of the open
    space guiding principles says "Whoever comes is the right people."


    # Don''t Try to Change Everything


    If you are on a team of ten where no one is doing TDD or pairing (or whatever
    you want the team to do or do), and after a few months three or four doing it,
