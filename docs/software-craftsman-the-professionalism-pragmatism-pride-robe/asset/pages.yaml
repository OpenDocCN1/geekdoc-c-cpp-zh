    we are planning our next projects. They can give us details of how to use the
    technology-specific books we get extremely quickly. When a new version of the
    technology they cover is released, or a different way of doing things comes, they
    will not be as much as before. Examples would be books about Java, Hibernate,
    Nodejs, or Kotlin.

    - Conceptual books are the books that give us the foundation to our careers. They
    are the books where we get introduced to new concepts, paradigms, and practices.
    The knowledge we acquire through this type of book cannot always be applied immediately;
