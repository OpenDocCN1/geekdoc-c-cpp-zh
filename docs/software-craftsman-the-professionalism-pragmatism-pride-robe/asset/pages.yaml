- pgno: 14
  md: '# # 1. Software Development in the Twenty-First Century


    I remember the early years of my career, back in the 1990s. After those years,
    I considered myself a senior developer. I could mix assembly with Pascal and impress
    my friends. I could code fluent in at least four programming languages. Most important,
    I could write Delphi code—with lines of code and outside Windows programming interfaces
    (APIs)—that very few developers were able to understand.


    That''s how seniority worked back then. If you couldn''t understand a piece of
    code, normally it was because you were not senior enough. And writing it made
    you a senior developer stairway. It was common to hear from managers and developers,
    "We can''t change this code now. We need to wait until someone else understands
    it."


    After years in the industry, I was done being a developer. It was time to move
    on with my career. I didn wanted to be called a developer or God, for forbid,
    architect or any code maker. From that point onward I would call myself a software
    architect. At that time I was working for a business consultancy and our projects
    were large Java Enterprise Applications (JEE). We were using Rational Unified
    Process (RUP), and I had to struggle with design, class, and sequence.


    After some time working for this consultancy, I was promoted to the architecture
    team, where we would never have to draw our classes without first our Design Patterns.
    Besides knowing the Gang of Four (GoF) design patterns and the JEE patterns perfectly,
    I also knew Unified Modeling Language (UML) and UML. I had more than enough skills,
    experience, and credentials to be a software architect.


    My job, as an architect, was to speak to business, analyze the functional and
    non requirements, and create diagrams that specified what developers had to do.
    I also had to do hard-very consulting my crystal ball and checking the direction
    with my finger—to make sure with the rights that we would evolve without growing
    apart. Since no one knew the details of all the features that would be added to
    the system in each year, it was almost impossible to predict exactly how the system
    would grow. The solution to this problem was to let add''ons and design patterns
    all over the place. Today, we call it overengineering and stupidity.


    After a few months on the architecture team, I realized that I was still far more
    connected to my teammates in the development team than the other architects. I
    was constantly having lunch with the developers, talking to them also and asking
    them how they were making to use different parts of the application. I also realized
    that I was spending far more time than using my code in saving time; now I know
    it was because I was not writing code at all, just talking and talking.


    I realized how right that decision was. I remember spent weeks trying to figure
    out if being an architect was the right thing to do. On one hand I had "status"
    of being an architect in a large company—seniority, recognition (we don''t just
    you developers, we tell people what to do), superiority (compared to other developers),
    visibility (by management), career advancement, and responsibility (looking at
    all the code). On the other hand, I was being an architect—creating diagrams,
    designing, and discussing long-term calls that rarely satisfied the test of time.
    Then I made my decision: to choose happiness. Because being able to write code
    every day made me happy. From that point onwards, I promised that I would only
    choose jobs and positions that would make me to wake up in the morning and to
    go,


    Decisions that can change our careers perfectly and permanently. If I had decided
    to remain on the architecture team


    The point here is not about architects versus developers. Today, I don''t even
    think that what I was back then was architecture. What I''m saying is that we
    should choose our career path according to our passion, to what we love doing.
    It doesn''t matter if it is architecture, software development, testing, business
    analysis, management, or something. They are all relevant and important


    In the rest of this chapter we will be discussing what seniority really means
    and the new reality faced by developers in the twenty-first century.


    # Seniority'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Unfortunately, the notion of seniority has not changed in the last 20 years.
    Software developers are normally considered according to the number of years they
    have worked in the industry and not according to their knowledge.


    There is a huge difference between years of experience and having repeated experience.
    Years working on different projects, with different technologies, and for different
    companies is different from years working for the same company, on the same project,
    and with the same people and technology.


    Over the years, I learned that seniority is transient and volatile. It is transient
    because clients will demand different types of technology every few years and
    coding in a waterfall methodology will not make you a senior position in a modern
    company developing mobile applications in an Agile. Seniority is not a bad thing
    to care for the rest of our lives after five years in the industry. Seniority
    is also something fleeting; we need to ask the following questions: what compared
    to whom? In which ''technology?''


    There is no such as a senior or junior developer. Developers may be experienced
    in developing Java applications for large organizations but totally inexperienced
    in writing games in JavaScript. They can be extremely experienced working in a
    volatile Agile environment but totally inexperienced dealing with the bureaucracy
    and challenges of a large corporation.


    # A New Reality


    Good programming practices and techniques can be applied in many different environments
    and systems of types, coding is just one of the things that modern developers
    do besides about writing code in any language or framework. Modern developers
    need to know how to care for customers, automate tests and deployment, manage
    challenges that may affect the entire business, work in distributed teams, help
    clients to define and prioritize requirements, report progress, manage changes
    and expectations, pre-sales activities, estimate times and costs, interview team
    members, design and evolve the architecture, deal with nonfiction and service
    level agreements (SLAs), understand business logic, make decisions based on facts
    and better ways to work, about the value you deliver to customers, and many other
    things.


    Some developers have been around for the decades. And well, that is true for some
    developers, but it is definitely not true for the majority of them. In the past,
    the roles and responsibilities of the people involved in software projects were
    merged for efficiency. Developers were not involved in the design and architecture
    of the applications, which rarely had access to users, and were never needed to
    be troubled to business analysis.


    The days when developers were specialized in only one thing are old - had it not
    been, - my problem is no longer acceptable. Companies started to leave, flattening
    their hierarchies and replacing many one-phony professionals with generalizing
    specialists. Companies are for developers who are well-rounded, good at coding
    and at business at the same time.


    In the past decades with the Internet, mobile devices, cloud services and general
    technology, everything changed. Clients want more things, and companies are becoming
    more aggressive with their software offerings. Being agile allows us to change
    the software, with agility which allows the value provided to customers to become
    a competitive advantage. We rely on software like Amazon, Google, Twitter, Facebook,
    and many others to dominate the markets. Clients are requiring bureaucratic service
    companies with rigid and deep hierarchical structures with more agile service
    companies. The waterfall approach with a traditional management style often cannot
    cope with the fast pace of change and rapid development required to keep up with
    the game.


    The scale of projects has changed as well. Today, we see applications that do
    not integrate with each machine, having a huge monolithic database as an integration
    point. Modern applications are built built using multiple technologies and integrated
    together. Where we had applications only using internal employees, now we have
    applications used by millions of people around the world. For many companies,
    the cost of bugs in production expensive enough to push them out of business,
    or cause massive damage to their


    This reality in the software industry forced an evolution of the software development
    process. Companies are demanding professional developers and not just coders who
    do what they are told to do.


    Furthermore, our industry is leaving behind the Industrial inheritance-command
    and control, the roles and responsibilities of a software developer become more
    and demanding, making more people to be developed of acquiring new elements and
    skills that they need to move forward with their careers. The priority we once
    encountered on projects with a rigid and flat plan, and strictly defined process,
    are meaningless. Flat hierarchies with talented and empowered professionals are
    becoming common. The need for agility and well-crafted software has never been
    higher.


    In 2001, a revolution in the software industry happened: Agile. Companies all
    the world adopted and embracing the Agile methodologies and mindset, which changed
    their processes and internal structures. However, even'
