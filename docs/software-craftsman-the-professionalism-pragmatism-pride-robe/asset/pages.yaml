  md: '# 15. Pragmatic Craftsmanship


    There is an assumption that quality takes time. Managers and developers believe
    they need to choose between expensive-crafted code that takes a long time to write
    or cheap code that is delivered faster. Unfortunately, cheap code is usually triumphs
    over-crafted code.


    In this chapter we bust the myth that quality is expensive. We will also discuss,
    with examples, what pragmatic craftsmanship means.


    # Quality Is Always Expected


    I''ve met a person who wouldn''t want quality if quality were expensive or if
    quality didn''t need to be a trade-off for earning whatever she judged important
    at some point in time—like time to market or cost. Managers expect bad quality
    regardless of that; they say they expect high value. When developers tell them
    how many times quality will suffer if they want the code done and deliver tasks,
    they will not agree in it but they will expect quality.


    The main problem is with this assumption that cheap code is good enough—maybe
    in the term, but not in the medium and term. For quality that usually aims for
    average code, more often than not, average means poor. For the big build of mid
    grow, cheap doesn''t mean the number of bugs increases, but to develop features
    becomes difficult. This is what managers and project sponsors don''t see. They
    do not. For software development, a service is just like any other service they
    pay for. And like any other service provider, developers are expected to deliver
    quality.


    And ask yourself when buying a service. You are hiring a builder to extend your
    house or to renovate your house. You know how much it is going to cost before
    they start the project. The very least, you expect a well-educated guide and price
    range. You want to know how long it is going to take, or when the new kitchen
    will be finished as possible. If the builders tell you that it will be quick and
    cheap, you can''t guarantee quality. "If you don''t want quality over price and
    time, then what are you asking us, you may have some problems in the future."
    What would you do if you refused to pay quality over price and time, because usually
    that is not the case. Unless you are very rich and not living in the house where
    the work is going to be done, will you afford to be quick, cheap, and unequal?


    It''s also reasonable that you want to get the quality you want but you have a
    limited budget. If the building company told you you would not need to pay more
    for the quality you wanted, or the project would take two or three times longer,
    what would you choose? Without budget, will you accept quality, or over with high
    quality?


    There are many circumstances that you may make between keeping quality high, even
    if you need to pay a tight budget or you quality low by having the service done
    and as soon as possible. Maybe you are a couple and your wife have kids and the
    you need an extension before they are born. If you don''t live in the house but
    you need a new kitchen so you can rent it out as soon as you are planning to move
    for a long time and are looking to make it comfortable and functional as possible,
    regardless of how much time it takes.


    Regardless of which decision you make, even if you choose the low-quality one,
    it will always help for you. Quality will always have to help with the service
    you provide. And that is how managers and clients think when paying for a software
    project. They may not decide to pay for quality and ask for a quick and cheap
    delivery, but later they will regret that it will be bad — and they won''t get
    it.


    But what if quality cost more? What if a quality service didn''t make much longer
    to be done? The difference in time and difference between a quality service and
    novelty was so small that, in the grand scheme of things, would it make any difference?
    Would anyone still call a low-quality service? Doubt it.


