- pgno: 17
  md: '# 2. Agile


    Back in February 2001, seventeen influential people in our industry decided to
    get together in a ski resort in Utah to discuss alternatives to heavyweight and
    document-based approaches to software development. Each of them had been working
    and experimenting with different techniques and approaches to software development,
    and they decided that it would be a good idea to get together and share what they
    were doing. The idea was to learn from each other and try to come up with better
    ways to deliver software projects.


    They were Kent Beck, Mike Beedle, Alistair Cockburn, Ralph Cunning, Martin Fowler,
    James Gimsight, Andrew Hunt, Jon Kern, Brian Marek, Robert C. Martin, Steve Mellor,
    Ken Schubert, Jeff Sutherland, and Dave Thomas.


    They presented methodologies and techniques like Extreme Programming (XP), Scrum,
    the Systems Development Model (SDM), Adaptive Software Development, Feature-Driven
    Development, and programmatic programming.


    After many discussions, the Agile Manifesto was created and the Agile Alliance
    formed.

    Agile is not a single thing. Agile is a combination of methodologies and techniques
    that, according to the context, it can help teams and adapt to the ever-changing
    nature of software projects and also reduce the risks associated with them. The
    Agile disciplines and methodologies were divided into two main groups: process-oriented
    and technical-oriented.


    In this chapter what it means to be Agile, as well as the Agile Manifesto and
    the problems that many organizations face when adopting Agile.


    # Process-Oriented Agile Disciplines


    These disciplines describe how teams and organizations work, collaborate, and
    organize. They normally prescribe and/or suggest, among many other things, the
    types of methodologies the teams should use; the roles people should play; in
    which to capture requirements, how to measure work velocity, how to work in an
    iterative way, how to plan and deliver work, and how to demonstrate progress and
    get feedback back.

    Process-oriented disciplines help teams to keep the focus on what is really important
    and valuable to the business. Using these methodologies is a great way to make
    sure the team is building the right.


    # Technical-Oriented Disciplines


    These disciplines are more focused on the challenges of developing, maintaining,
    and delivering the software. They normally prescribe or suggest technical practices
    and techniques. Test-Driven Development, pair programming, continuous integration,
    and simple design are few examples of these practices and techniques. Technical-oriented
    disciplines help teams to keep focus on the quality of the software they are producing
    and helping teams to make sure they are building the right.


    # What Is It to Be Agile?


    > [Agile means] adapting successfully to new circumstances.

    —Tom Gil


    We don''t Agile. We are Agile or we are not.

    Agile methodologies are all about quick and short feedback loops. The quicker
    and shorter our feedback loop is, the more we receive feedback, the more we have
    an opportunity to react to it, and the act of reacting (or not) to new information
    makes us (or less) agile. Narrowing the feedback loop helps us to make problems
    visible sooner, allowing us to identify them earlier and adapt quickly. Agile
    does not solve any problems; it just exposes them. The faster we see a demo or
    any other feature to a user, the earlier we get feedback on it. I''m using user
    here as a general term. If we are a product owner, sponsor, or an end user. Getting
    feedback from multiple sources is extremely important. Using sooner feedback helps
    us mitigate the risks of our industry.


    # A Game Changer


    Agile was a huge step forward in our industry. Its acceptance by the wider community,
    immediately after its creation, was massive. The fast pace of change in modern
    software projects is frustrating and costs a lot of money for companies. Agile
    was an antidote for that. The mindset changed. Where before we had many documents,
    big design up-front (BDUF), and bureaucracy, now we have running software from
    one week. Where before we were reactive to changes, now we embrace them.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Agile changed the way we work. The old, hierarchical, and very segregation
    of roles within a software project team started fading away. Software professionals
    realized that writing code is just one of the things they need to be good at Developers,
    who were just following a plan, fully understood the importance of getting involved
    with business and delivering value to the clients. The realization that a team
    was responsible for all the different aspects of a software project was a game
    changer. It made software professionals evolve. Instead of just being someone
    who writes code according to defined plan, developers started taking an active
    role in planning, estimation, requirements, team organization, analysis, architecture,
    production readiness, prioritization, demos collecting feedback from users and
    stakeholders on a regular basis.


    # People Empowerment


    Software teams become flat in hierarchy. No more team leads and segregation of
    duties. Instead of having managers assign tasks to individuals and specify the
    amount of time it should take to be done, now we have a backlog of tasks that
    are prioritized by sponsors and product owners of the team. The team decides which
    task to work on next, according to priorities, and decides who is going to do
    what is going to be done, and how long it is to take. This all happens as part
    of an iterative process which the feedback loop for all the people is constant.


    # Professional Vision


    To fit this way of working, software professionals had to evolve. Instead of being
    specialists, like in the past, companies started to look for generalizing specialists.
    Being good at writing is the minimum skill expected from software professionals.
    Testing, analysis ability to understand the business, good communication and a
    more extroverted personality became part of the skill set software professionals
    need today.


    # Agile Manifesto


    The following is an excerpt from the Agile Manifesto.


    > We are uncovering better ways of developing software by doing it and helping
    others to do it. Through this we have come to value:


    +   - Individuals and interactions over process and tools

    - Working software over comprehensive documentation

    - Customer collaboration over contract negotiation

    - Responding to change over following a plan


    That is, while there is value in the right, we value the values on the left more.


    Besides the Agile Manifesto, the originator of Agile came up with twelve principles.


    # Principles Behind the Agile Manifesto


    The principles include the following:


    +   1. Our highest priority is to satisfy the customer through early and continuous
    delivery of valuable software.

    2. We welcome changing requirements, even late in development. Agile processes
    harness change for the customer''s competitive advantage.

    3. Delivering software frequently, from a couple of weeks to a couple of months,
    with a preference to the shorter time scale.

    4. Businesspeople and developers must work together daily throughout the project.

    5. Build projects around motivated individuals. Give them the environment and
    support they need, and trust them to get the job done.

    6. The most efficient and effective method of conveying information to and within
    a team is face-to-face conversation.

    7. Working software is our primary measure of progress.

    8. Agile processes sustainable development. The sponsors, developers, and users
    should be able to maintain a constant pace indefinitely.

    9. Continuous attention to technical excellence and good design enhances agility.

    10. Simplicity—the art of maximizing the amount of work not done—is essential.

    11. The best architectures, requirements and designs emerge from self-organizing
    teams.

    12. At regular intervals, the team reflects on how to become more effective, it
    tunes and adjusts its behavior accordingly.'
