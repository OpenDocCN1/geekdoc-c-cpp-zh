    # Focus: The Pomodoro Technique


    In order to use our time outside working wisely, it is extremely important that
    we have a focus. A good technique is to decide before what we want to do we actually
    use this time. It is like deciding the agenda before scheduling a meeting. It
    does not need to be, but we need at least have a good idea of what we want to
    achieve. Once this is done, we must ensure we can get it done. One way we can
    achieve this is by using the Pomodoro technique. There are five basic steps to
    implement this technique:


    +   1. Decide on the task to be done.


    +   2. Set the Pomodoro (timer) to 25 minutes.


    +   3. Work on the task until the timer rings.


    +   4. Take a short break (normally 5 minutes).


    +   5. Every four "Pomodoros", take a longer break (15-30 minutes).


    During a Pomodoro (minutes), we focus on the task and ignore nothing else. The
    breaks between Pomodoros are for a quick rest, coffee, checking emails, a phone
    call, checking your Twitter, or whatever you feel like. We do whatever we to finish
    the Pomodoro with no interruptions but in case it needs to be interrupted (there
    is an important call we need to take or we really need to speak), then the Pomodoro
    must be terminated and not counted. If you are interrupted, one should create
    a new Pomodoro. There are many Pomodoro tools available out there. There are some
    sophisticated you that can keep track of all the tasks you completed, interrupted
    Pomodoros, and many other statistics. I, personally prefer the simple ones but
    free to use one that suits you better.


