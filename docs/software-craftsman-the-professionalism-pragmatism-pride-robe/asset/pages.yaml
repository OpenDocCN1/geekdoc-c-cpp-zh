    # Katas


    Katas are simple coding exercises that can be understood in a few minutes and
    are complicated enough to be solved too quickly. They normally take from a few
    minutes to a few hours to be solved and are great practice to try new techniques
    and approaches. An example would be a kata where we need to calculate the score
    of a bowling game or tic-tac-toe. We can use these katas to practice things we
    think we are not good at, like Test-Driven Development, language, or a framework.


    Katas have been criticized by some in the Agile community, over and over again.
    However, solving katas with our current toolkit (the tools and that we are comfortable
