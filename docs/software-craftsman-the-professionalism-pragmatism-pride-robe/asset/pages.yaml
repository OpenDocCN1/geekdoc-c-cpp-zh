    The focus on high-quality software must be the number one if you want long-lived
    applications. Rewriting a legacy application few years after it has been developed
    for a poor return on investment. In many occasions, the decision to rewrite an
    application is made because of the prohibitive costs of maintaining it.


    > Insanity is doing the same thing over and again and expecting different results.\Albert
    Einstein


    The problem is that same bad techniques that were used to build the old application
    will also be used to build the new one—making the new application as old as the
    old after just a few months or years. It is our job to break this cycle, building
    applications with well-crafted code.


    # Not Only Individuals and Interactions, but also a Community of Professionals


    Sharing and mentoring are at the heart of Software Craftsmanship. Software crafters
    are passionate and always strive to be better. However, we have a bigger mission
    we are responsible for protecting the next generation of craftsmen.


    The best way to move our industry is by sharing what we learned through mentoring
    and inspiring-less experienced developers. This is related to the ideas of apprentices,
    journeymen, and masters, where Software Craft must mentor apprentices and help
    them in their journey. Knowledge, ideas, successes, and failures must be shared
    and discussed within the community in order to move our industry forward.


    I was surprised to hear from some developers and Agile coaches that the Software
    Craftsmanship community is a group of selected and elite developers. An developer
    cannot be considered a software craftsman if he is not Software Craftsmanship
    is elitist, it is not enough to learn from others, or is not willing to share
    his knowledge and mentor less-experienced developers. From my experience, the
    Software Craftsmanship community is'
