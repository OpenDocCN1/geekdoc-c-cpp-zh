  md: '# Test First


    Test first helps us to focus on our ideas; to focus one thing at a time; to define
    when the responsibility of modules, classes, and functions; and to work in small
    increments. It gives us assurance our code works according to expectations. Since
    each test takes from a few milliseconds (unit tests) to a few seconds (higher-level
    to run), test first gives us very quick feedback loops when writing the code.
    Writing tests first helps us to write enough code to satisfy the requirements,
    keeping the code simple. It reduces complexity and overengineering.

    That''s the value it brings to the business.


    # Test-Driven Development


    Test-Driven Development is an evolution of test first. A common misconception
    is that TDD does not mandate the unit testing of what should be written. There
    are many different types of tests, with tens of definitions for each one—many
    overlapping or conflicting with each other. Let''s not worry too much about that.
    Let''s focus on the TDD brings.


    Although TDD has "test" in it, TDD is actually a design process. When test-driving
    code, it becomes difficult to write code. First, because we just write enough
    code to satisfy the requirements—such as we discourage overengineering and design
    before you (BFDF). However, when our code becomes a bit too complex and also becomes
    difficult to test, bad design choices are highlighted. Complexity in maintaining
    and writing new tests. These tests lead us to rethink the design of our code and
    refactor to make it


    The feedback loop provided by TDD on our code is far more sharp and objective
    than when in design meetings. When we design a code or a new feature, we get immediate
    feedback on how maintainable the code is. Design review is a good practice, but
    when TDD falls into two parts—if we do it too frequently, we lack objectivity
    and overengineering. If we do infrequently, the problem may be too big to solve
    quickly. Design reviews are more effective when the agenda is well defined: bad
    performance requires a higher-level view of the company''s ecosystem. Design reviews
    must be done before a big change starts and potentially a few times during the
    development of a piece of work, but not more than that. If the code is tight,
    it should be broken down into smaller and incremental steps. Many design reviews
    take time, which makes it hard to write a single line of code, while highlighting
    problems as they arise. TDD and design reviews are not mutually exclusive and
    both are needed, but it is important to compare the value they bring and the length
    of their feedback loop.

    That''s the value of a quick feedback loop.


    TDD offers us quick feedback on the design, simplicity, and maintainability of
    our code. It provides a living and executable documentation for our algorithms,
    and as a good effect, a rich suite of tests. That''s the value to the business.


    # Continuous Integration


    On average, teams between four to ten developers. In large projects, we may find
    teams spread across different territories and time zones. Even in a small team,
    with three or four developers, how can we make sure we are not stepping on each
    other''s toes? Teams may be working on totally different features, how can we
    know if the application will work when some code is added to it? How can we know
    if one of us breaks a part of the application by introducing an unexpected side
    effect?


    One way of making sure the system is working correctly, once all the changes made
    by developers are integrated, is to have a dedicated QA team. Testers execute
    a manually executed set of tests and will report, a few days or weeks any bugs.
    But that will be the feedback loop.


    Continuous integration, with TDD, can reduce the feedback loop. Every time a developer
    commits some code, the suite of tests is executed and it is essential to ensure
    the team knows when tests fail.


    This practice needs to be combined with a "stop and fix" attitude: the team must
    stop whatever they are doing to fix a broken build, which the problem introduced
    by the latest change. The advantage of this practice is that the system is in
    a deployable condition and doesn''t accumulate debt.


    In addition to that, the combination of continuous integration and TDD can make
    an entire QA team redundant. The best tests could be better written by those who
    wrote the code, and to help business analysts and product owners define criteria
    for user stories. Good testers can also help the entire team by exploring testing,
    which only humans can do and there is no easy way to make it


    # Pair Programming


    Code review is a practice adopted by many teams in order to guarantee quality.
    Code reviews are also used to disseminate knowledge of the system and good coding
    skills to the team. Like design reviews, the problem is how often code reviews
    are done


    Let''s say code reviews happen once a week and we have a team of ten developers.
    That is a lot to be reviewed and go through a couple of hours, in a room full
    of opinionated developers. The chosen area of the code to be'
