    wizards who solve all the problems, from configuring the server to writing some
    code. The Insecure are developers who fear that, they see software as a threat
    and that will discard them


    +   - **The Fanatic**: They are totally devoted to a single group (or point of
    view) in a manic fashion, to the point it can be considered an obsession. Developers
    in this group are the ones who dedicated a long time to learn and become a specialist
    in one particular—usually a tool, language, or framework. This is the only thing
    they know and they ignore all other possibilities. Their obsession is not always
    about a particular design technique, methodology, or process. They feel happy
