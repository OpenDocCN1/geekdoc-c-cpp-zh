- pgno: 28
  md: 'of the most open and friendly communities know. By its own nature, language
    agnostic, it is a community that embraces all sorts of developers, regardless
    of their level of seniority or technology.


    Learning from each other is by far the best way for us to become better. Writing
    blogs, contributing to open source projects, making our code publicly, becoming
    part of our local communities, and pairing with other developers are some of the
    ways we can contribute to the great good of our industry.


    Since 2010, Software Craftsmanship communities are being created in Europe and
    the United States and they run many free events every month. We welcome developers
    from all sorts of backgrounds, interests, and levels of experience. These communities
    provide an environment where developers can share, meet, and write code together.


    Besides communities, this in our manifesto also includes our work. Great developers
    want to work with great developers. Great developers want to work for great companies.
    What we want is to work with people who can make us better, that we want to share
    and learn from each other. We do not want more colleagues. We want passionate
    and inspiring professionals that we can call.


    # Not Only Customer, but Also Product Partners


    The first thing to mention here is that we do not believe in the employer/employee
    type of relationship. What the contract says may be permanent employee, contractor,
    vendor, paid per day, hour, or month are just formalities. We believe in partnership
    above all. If you are a permanent employee, you should treat your employer as
    your customer, the same way as if you were a contractor or consultant. Employers,
    on the other hand, should also expect their employees to provide great service
    at all times, like a consultant and craftsman is supposed to. Turning up to work
    code, keeping your head down, and doing what you are told to do is not what it
    means to be.


    Software craftsmen are not factory workers. We want to actively contribute to
    the success of the project, questioning requirements, understanding the business,
    processes and proactively partnering with our customers or employers. This is
    a different approach to the traditional employer/employee model and the advantages
    for every employer. A highly motivated team will likely succeed. Passionate and
    talented people want to succeed and will always find ways to overcome problems
    and barriers.


    Although extremely important, writing code is just one of the things we need to
    do for a project to succeed. We must help our customers to improve their processes,
    provide them with more viable options, help them to remove unnecessary bureaucracy,
    understand their business, question their requirements in the value they provide,
    provide them with good information and knowledge, help them to plan and prioritize
    work, and work on things that, although they are not required, are also important
    to the project. Providing value to our customers at all levels is what we mean
    by having a productive partnership.


    # But Some Clients Are Not Ready for a Product Partnership ...


    Unfortunately, there are some clients that are not ready for this type of partnership.
    They see software development as an industrial process and the least important
    part of the project. For some companies, developers are as factory workers, who
    are there to follow orders from smarter people.


    Some of these companies focus on getting the cheapest developers they can find
    and always have ways to micro-manage them. Some will not welcome or listen to
    developers when they come to business decisions. They will not value development
    skills, up to the technical leader (or director).


    Working for a company with this mentality is always very difficult for any software
    craftsman. We always try our best to turn this situation around and prove to our
    clients that we could help them far more if they let.


    However, in the same way that companies have to have good developers, software
    craftsmen also want not to work for good people. There is no point in spending
    all our energy and health to help those who do not want to be. There is a limit
    to the effort we make to help our clients. Choosing how to select clients (or
    employees) is an essential skill for a craftsman. Choosing for a client who is
    not interested in or does not value the skills of a software craftsman is pointless.


    Choosing clients carefully is essential for software craftsmen to build their
    reputations and move forward with their careers. A partnership, by nature, is
    a two-way street. A partnership is a good partnership only if it is good for both
    involved. If you don''t find that the partnership with your client is good for
    you, it is probably time for you to find another client.'
