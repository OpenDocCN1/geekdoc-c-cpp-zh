- pgno: 29
  md: '# The Problem with the Manifesto


    There were a few criticisms related to the Software Craftsmanship Manifesto. The
    main one is that, unlike the Agile Manifesto, the Software Craftsmanship Manifesto
    is almost impossible to disagree with. In the Agile Manifesto, the contrast between
    the left and right sides is clearly indicating what is being proposed. A person
    who believes that documentation is very important struggles to accept "working
    software over comprehensive documentation."


    Companies that are used to fixed price and detailed contracts would struggle with
    "customer collaboration over contract negotiation. In the Software Craftsmanship
    Manifesto there is no clear contrast between the left and right sides. The right
    side is an evolution of an already accepted left side. A person who agrees that
    working software is better than comprehensive documentation will never disagree
    with the value of well-crafted software. Companies that believe in collaboration
    will never disagree with productive partnership.


    This is a fair point. I don''t think anyone is wrong. Agile values can really
    disagree with what is written in the Software Craftsmanship Manifesto. However,
    if no one disagrees with the Software Craftsmanship Manifesto, it is fair to assume
    that everyone agrees with it. If that is the case, the question we should ask
    ourselves is do we work and behave according to what is written in the manifesto?
    Are we really practicing the things on we craft?


    In my view, the manifesto should not be read as if it was just a bunch of lines
    put together. We must go deeper to fully understand.


    # Summary


    Software Craftsmanship is about professionalism in software development. It''s
    about developers striving to always do their best and provide good service to
    their clients. Software craftsmen seek productive partnerships with their clients
    and employees and not an employer/employee relationship. Software craftsmen understand
    that being a good professional means having a good reputation, and for that they
    need to constantly delight their clients by delivering successful projects.


    Software Craftsmanship is a mindset—a lifestyle that many professional developers
    adopt. Software craftsmen live and breathe software. They see software as a craft
    and are committed to do whatever they can to master their craft.'
