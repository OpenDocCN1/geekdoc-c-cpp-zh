  md: '# Choose Your Battles


    If I had the power and could work without any disturbing me, and could hire and
    fire whoever I wanted, I would change this entire organization in a very short
    period of time. This is something that crossed my mind many times during my career.
    However, this is not the reality I face. And frankly, above all, a one-man army
    can''t win a war, so choose your battles carefully, one at a time.


    After a few weeks working in an investment bank, I had a list of things that I
    wanted to change. The entire list was quite a lot to the effort required to make
    them. I wanted to change some small pieces of code here and there, and throw away
    entire applications, fix de-conflict with teams and vendors, reduce bureaucracy,
    and many other things. The list was huge, and the sheer cost of changing them
