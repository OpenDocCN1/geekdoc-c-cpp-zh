  md: '# 14. Driving Technical Changes


    How do I integrate technical practices to my team? How do I convince my team to
    Test-Driven Development (TDD)? How do I convince my manager let us do pair programming?
    How can I introduce another language or framework in my current project? These
    are questions that always pop up conversations with other developers. Over the
    years of finding other developers to adopt technical practices or to change their
    untold was far harder than convincing managers. Many developers suffer when Kent
    Beck calls adolescent. They think they have the secret formula for delivering
    great software and nothing is worth risking.


    From developers to managers and architects, learning how to do it is essential
    when driving technical change. In this chapter we look at different types of skeptics
    and how to convince them to be more open to different ideas.


    # Identifying Skepticism Patterns


