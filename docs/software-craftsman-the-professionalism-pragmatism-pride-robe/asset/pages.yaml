  md: '# 13. Culture of Learning


    No change can be made effectively if the people involved are not motivated or
    don''t really care about their jobs. Over and over again I have seen managers
    trying to define strategies to make the organizations more efficient. And there
    they would go, with their PowerPoint presentations, telling everyone how that
    change would be. They would also say, with a big smile, that everyone had to comply
    with the new policy. "From now on, developers must do Test-Driven Development
    (TDD). Development teams must do Agile. Everyone is now expected to follow our
    new process." Developers might ask themselves: "what does she know about writing?
    Could she sit down and pair with us? Does she understand the details well enough
    to teach us how to work?


    But let''s underestimate a manager''s ability to make things work. To make sure
    people comply with the new (and improved) way of working, managers would make
    sure people''s objectives and bonuses. However when it comes to software development,
    this approach can lead to disastrous consequences.


    In this chapter we discuss many different ways the we can create a culture of
    learning. All the things described in this chapter have been used in large financial
    companies and also in a few smaller companies in various industries, with positive
    results in all of them.


    # Wrong Motivation


    There a time when a well-known investment bank hired the consultancy I work for.
    They had a specific requirement: "we want some developers to can unit tests to
    our base." The consultancy then asked one of these developers, which by surprise
    I was on the bench; I couldn''t really say no. To make things even, they wanted
    us to do it from our own office. This was not quite right: companies in the financial
    industry wanted the code to be accessible from their premises.


    For a few months some colleagues and I wrote unit tests for the code without ever
    any of the developers who wrote it. The contract said "You need to write the tests.
    Your target is to get the test coverage up to 70 percent. Once you reach that,
    you just to keep maintaining it as mark." Many occasions, we had no idea if the
    code had a bug or if the failure we found was the desired behavior. We also had
    no idea if the classes and methods made any sense in the overall design and structure.
    We tried to solve the problem, but that was not part of our job and they were
    not interested in talking to us.


    To make things even, the developers working for the were not keeping the tests
    up to date as they made the code. And, of course, they were not writing tests
    every single. Every time we updated our with the latest version of the code, we
    found that many of our tests were broken.


    After a few months of blindly retrofitting tests, without having a clause if the
    code was fit for the purpose, we managed to keep the test coverage above 70 percent.
    A few weeks later, the company was happy and terminated the


    After the project finished (if we could call that project), we asked the managers
    what project was really about. As part of their targets for, some technical managers
    had to bring the test coverage of their applications up to at least seventy percent.
    As part of their targets, their bonuses would be directly impacted if they didn''t
    deliver. So they did it.


    Looking back, now what I know today, I feel that what we did was immoral. Our
    company should have accepted that type of work. I should have said no. We would
    have helped them if we had told them what they were asking was not wrong, but
    also dangerous. Some people would think the system was reliable and could be deployed
    into production. Bad tests are no tests than at, at least without understanding
    what we were doing with no context of the business, understand. However, if the
    classes (or the application) had a bug, we wouldn''t know, and now we had created
    tests that would perpetuate failure. If the tests are failing, the code better


    At the end of the day, the client knew what they did wrong, but they only cared
    about the bonuses. We learned a lesson we will never change an organization by
    forcing people to adopt a new process or practices. Instead, we should create
    a culture of learning, where people can find their own motivation to make better.


    # Creating a Culture of Learning


    Creating a culture of learning is one of the most efficient ways of injecting
    passion into a company. Not many developers have been exposed to environments
    where their senior colleagues were constantly looking for ways to improve themselves.
    Many developers started their careers in places where senior developers didn''t
    like what they were doing or were not motivated. Due to a lack of role models,
    junior developers are less to believe that'
