    not acting professionally because we said NO.


    # Learning to Say No


    More than not, we have tight deadlines and a lot of pressure from our managers
    to meet them. Many of these deadlines are unrealistic and imposed by managers
    who were very aggressive in trying to make sure they are delivered on time. Developers,
    the younger ones, tend to succumb to such pressure and say yes they will get them
    done by the imposed date, because they are afraid to go against their managers
    or because they would fear they would be unable to deliver all the features they
    demanded, up deadlines and ending in conflict.


    The outcome of this is usually very bad. Systems are delection full of bugs, customers
    are unhappy, and trust evaporates. After working hard for many days, and sacrificing
    time with their loved ones, developers blame the manager who pushed them to do
    what they knew impossible, while he was at home enjoying his weekend with his
    family, and blame their incompetence. "How hell did you break the deal on the
    sign-up page? Why isn''t the system performing well? How earth is the system not
    able to process more than 10,000 transactions per minute? How could you forget
    this edge case?


    # An Epic Failure


    I worked for a large communications company. The marketing team wanted to launch
    this brand-new mobile portal that we were developing. They wanted to launch it
    in three different countries and their estimation was that a small percentage
    of our customers used the application every day. So we were talking about a few
    hundred thousand customers. We did not know. One manager wanted to say that we
    would launch the app by a certain date and he knew alone. So, in one of our first
    meetings, we told him that we probably would not meet the deadline he asked for.
    So he had to us and said that if we worked hard we would be able to pull it off.
    We were not happy, but he was being so insistent that we would do it and we went
    on. We were devastated.


    Week by week the manager and a business analyst asked for more features and the
    deadline did not move. More and more, then we were all struggling with the requirements,
    let alone taking on new ones. However, they would come back to us and say the
    marketing team had already starting the campaign in all countries


    We told the marketing team our first estimates and if we could speak to them in
    order to see if we could come with an agreement on which features we really had
    to negotiate the scope of a few features. We had a few ideas that could potentially
    make some features smaller or unnecessary. The manager was our contact point and
    he was fully aware of all the marketing team''s needs, so we were not speaking
    to them. "Look, there is no time for negotiations. The client wants everything,"
    he said. After all the conversations we had with him, then our only option was
    to say yes and work as much hard as we could. What else could we do?


    The final day was a Monday morning and the application went live. Our last deployment
    to production had just a few hours before. We were tired and wanted the thing
    to be over but at the same time we were extremely proud of knowing that we had
    saved the project. We had conversations in the middle of the night, during a coffee
    break, about pay raises and emotions'
