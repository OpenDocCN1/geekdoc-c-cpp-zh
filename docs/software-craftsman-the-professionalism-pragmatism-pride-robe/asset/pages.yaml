    # About This Book


    After decades and many different technologies, software projects are still failing.
    There are many reasons why they fail, but few things that cannot be ignored: software
    development as a line, how to manage software projects and how to foster good
    developers, and many developers still behave like unskilled, unmotivated workers,
    providing very poor service to their employees and clients. With the advent of
    Agile methodologies, the software industry took this still failing, Why are we
    so bad at delivering successful projects? What is missing?


    Although the term "Software Craftsmanship" has been around for over a decade,
    it was not until that it emerged as a viable solution for many of the problems
    faced by the software industry today.'
