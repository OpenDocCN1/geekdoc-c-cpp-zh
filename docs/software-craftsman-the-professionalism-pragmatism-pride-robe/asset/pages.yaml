- pgno: 8
  md: '# Foreword


    In 1973 Roberta Flack sang "Killing Me Softly". You''ve never heard it in elevators
    or on your grandmother''s radio station. It''s a soft, lilting ballad about a
    woman who goes to a concert and hears a young man singing a song that she identifies
    with that she wonders the young man had found and read her letters. She expresses
    her belief that she feels when he strums his guitar, and it is the song of her
    whole life.


    The book you are holding feels that way may be to you. Sandro Mancuso''s career
    has been very different from mine. He is a better programmer than I. I have lived
    and worked our careers on different continents and in different cultures. We share
    neither nationality. I''ve met him only a few times, and each time it was never
    for a few minutes.


    Within the pages you are holding you will find a fascinating alternating biographical
    anecdotes based on those experiences. If you are a programmer, you will feel these
    stories and recommendations resonate within you. If you will to say it, as I did,
    "Believe in that." And you will feel the aching in your mind as he strums his
    pair


    And strum the pain you will feel, because this book is about pain. It is about
    the pain that you and I, all in an un-profession. It is the pain of feeling trapped
    to do better and not knowing how.


    This book also contains the antidote for pain that you cure. I believe it can
    cure you. You see, this book is about all software professionalism. Not just that
    of software organization. This is a book about Software Craftsmanship.


    In these pages the author lays out a plan, a strategy, a set of attitudes, and
    a suite of principles that every programmer, programming team, and software organization
    can use to haul themselves out of the mire of mediocrity, to make themselves more
    professional, more productive, and more of the work that they do.


    The scope of this book is incredibly wide. Topics range from design patterns,
    pair programming, and Test-Driven Development to how to conduct and deal with
    deadlines, how to respond to tight deadlines, how to write job descriptions, and
    how to relate to coworkers and managers


    In short, this book is an encyclopedia of the behavior, attributes, and structure
    of an organization striving to grow in professionalism and adhere to the principles
    of Software Craftsmanship.


    If you are the type of programmer, team lead, or manager who craves to be able
    to go home after a long day of work, look in the mirror, and say, "Damn, I did
    a good job today?" then this is the book for you.


    -Robert C. Martin

    August 2014'
