    After 45 minutes (30 if you don''t have much time), interrupt the discussion and
    ask if people want to switch topics or carry on the topic they chose.


    # Switch Projects for an Iteration


    Within a company, it is common to have different teams working on different applications
    or in different parts of the system. After a period of time, projects fall into
    a routine; some of the initial challenges have been solved and the best design
    decisions have been made. However, as projects evolve, very rarely redo previous
    decisions. As developers become comfortable with the tools and designs, they also
    take other ways of doing things.


    Assuming that developers are constantly pairing with each other, we can solve
    this problem by providing an opportunity for developers to switch projects for
    at least a iteration. Pairing with different teams offers opportunities to develop
    technologies, ways of working and knowledge. Having different teams joining an
    existing project, even if for a short period of time, makes the team rethink their
    problems and solutions and why things are done the way they are. This may bring
    a few positive effects:


    +   - **Validation of the decisions**: The new person, after understanding the
    context in may confirm if that was a good decision.

    - **Knowledge sharing**: The new developer learns how certain problems can be
    solved.

    - **Collective learning**: After discussing the current situation and sharing
    knowledge with each other, the existing members of the team and the new developer
    come up with a better solution.


    Periodic changes generally improve motivation, spread ideas across projects, and
    break knowledge silos. These periodic exchanges aren''t limited to developers.
    The Scrum master of one team can swap places with a tester from another team.


    # Switch Projects for a Few Hours


    As a variation to the approach discussed, we could have developers working with
    different teams for just a few hours or days. Developers can organize the themselves.
    They just need to walk to the other team''s location, sit with one of the developers,
    and pair for a couple of hours.


    I once worked for a large organization where all the software we developed was
    written in Java. Over time, different teams started adopting Gradle as a build
    tool, and as a framework, instead of Maven and JUnit. The team I was working with
    decided to use Scala and a commercial in-memory data grid instead of Java and
    Oracle for our new projects.


    Being able to walk over another team and ask if we could pair with someone for
    a few hours every day was a great way to expose many of us to the different technologies.
    At the moment of this writing, one of our teams is already migrating to Gradle
    and Spock, and another team is considering Gradle.


    # Conduct Group Code Reviews


    Group code reviews are another interesting way to create a culture of learning.
    It''s amazing what we can learn just debating with colleagues whether a piece
    of code could be improved or if it could be used as an example that should be
    followed. If done right, group code reviews bring the whole team together; everyone
    responsible for the decisions of quality for them.


    Although I value code reviews, it is important to get it right. But what does
    "get it right" mean?


    +   - Comments should never be personal.

    - It doesn''t matter who wrote the code.

    - Never look at the history during a group code review. Focus on changing the
    future, not dwelling on the past.

    - Comments should be objective and constructive. The focus is on how to make the
    code better and not why it says it.

    - Sometimes we have a facilitator. Her role is to make sure everyone understands
    and that there is no finger-pointing.

    - Don''t expect to make a lot of progress. If developers want to spend a lot of
    discussing a single issue, let them do it.'
