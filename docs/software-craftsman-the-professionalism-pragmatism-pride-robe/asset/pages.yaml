  md: '# Have Hands-On Coding Sessions


    Hands-on coding sessions are sessions where developers get together to write code.
    The facilitator will choose an exercise, normally a kata, and add some twist (constraints)
    to it to spice things up. The main objective of a hands-on coding session is not
    to finish the exercise; the focus is to practice writing the best code we possibly
    write and challenge ourselves. Here are some suggestions for running a hands-on
    session:


    +   - The facilitator must be familiar with the exercise; she would have done
    the exercise herself at least twice before the session.

    - Developers work in pairs, with a person that they never paired before.

    - As a rule, TDD is mandatory, unless stated otherwise.

    - All developers should work on the same exercise; the retrospective more relevant
    and focused.

    - The facilitator should walk around and help developers; normally he or she should
    ask questions, not give them the answer or directly.

    - The facilitator should run a small retrospective at the end, where all developers
    can share what they''ve done, how they''ve done, and what they''ve learned.

    - Developers thank their pairs when the session is over.


    Hands-on sessions are very helpful for injecting passion into your teams. It creates
    an opportunity for developers to learn from each other, and it is a bit of fun
    to manage.

    I suggest you follow the suggestions above if you want to organize hands-on sessions.
    They serve as a base for all of the very successful hands-on sessions organized
    by the London Software Craftsmanship Community (LSCC) and the ones we run internally
    in our companies.


    +   A few important points for running a hands-on session:

    - Don''t make it about work. The focus is to practice and learn in a safe environment.

    - Allocate two hours for the session: one hour from the company''s time and one
    hour from the developers'' own personal time (i.c. 4 to 6 if the working day finishes
    at 5 PM). This is why we have a mutual commitment to creating a culture of learning.

    - Be prepared to run the first few sessions yourself. Rarely will others put themselves
    forward to run the first sessions. Make sure you run them a very informal and
    friendly way so the others are encouraged to run sessions.


    # Factor Technology-Agnostic


    Running technology-agnostic sessions. It is always easier to run technology-specific
    sessions, if developers are not interested in the technology, they won''t.

    When running technology-agnostic sessions, developers are in control of what technologies
    they want to use, which will make the session far more enjoyable. Choose a kata,
    add a few constraints (you cannot use an else approach) ask to pair up to you,
    and your code every two minutes. You need to use a tell-don''t approach to ask
    without writing (it first, etc.), and let them choose which languages and frameworks
    they want to use.


    Technology-agnostic sessions variety. There will always be a pair trying to use
    a new language or framework. The retrospectives will will talk about the challenges
    they faced while using the technology they''ve chosen.


    # Start Internal Communities of Practice (CoP)


    If you have a few sessions running, invite the developers who come more often
    to the sessions to help organize the sessions. Try to regularly discuss these
    sessions and share the load of the organization and facilitation of the CoP. Keep
    it open and democratic so everyone can participate.

    You need just two people to start the community, internal or external. That is
    exactly how LSCC, the largest Craftsmanship community in the world, started. It
    also start like that. You need just two people meeting regularly to attract more
    people online. Just make sure you are aware that you are meeting and how much
    fun you are having. Share what you are learning during informal conversations
    over coffee or lunch. In no time, and more developers will be joining you.


    Just a word of caution: don''t focus on growing the community. Focus on having
    fun and running good sessions. growth will come naturally.


