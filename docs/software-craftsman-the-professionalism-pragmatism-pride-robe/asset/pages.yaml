- pgno: 31
  md: '# Employer/Employee Relationship


    In creative work, the employer/employee model is the wrong model. On one hand,
    we have a contractual model that states how people should be paid and also states
    the legal and behavioral obligations that professionals need to be respected by
    employees and employers. On the other hand, we have the type of relationship that
    professionals have with clients.

    The top-down, command and control of management became very popular during the
    Industrial Revolution and arguably has merits when the manager of the work is
    doing manual or repetitive work. However, it does not work well for creative workers.
    This style of management can be detrimental to the morale of professionals, making
    the company far less efficient. Companies that are still using this style of management
    struggle to hire talented professionals and slowly losing the ones they still
    have. But, of course, this is just one of the stories we tell. We are said to
    be a professional industry. That is, if workers are treated as professionals,
    they should start acting as professionals. A software professional must, among
    other things, get involved and contribute to the business, provide options and
    solutions, and offer the best service when it comes to implementation, techniques,
    and quality of what we produce.


    The relationship between software craftsmen and their clients should be seen as
    a productive business partnership, regardless of which contractual model we may
    have. A permanent employee, a contractor, a consultant, or a developer working
    for an outsourcing company should not affect that or the attitude we have towards
    our clients.


    # Keeping Up To Date


    We live in a world where there is more and more information, and less and meaning.


    > —Jean Baudrillard


    Different people have different patterns and preferences, and by no means do I
    feel that could describe all the possible ways a person could learn. However,
    the following is a small list of things that we can keep up to to date.


    # Books, Many Books


    Having our own library, physical or electronic, we are very lucky to be in an
