    # Agile Coaches


    Every profession has good and bad practices and this is no different Agile coaches.
    They are the ones who fully understand the original Agile message and, when advising
    companies and teams on their adoption, they emphasize the importance of process
    and technical excellence. Although the majority focus on process, they will often
    deal with process or recruit other professionals who could help them with the
    technical disciplines.


    However, every Agile coach, due to a lack of technical knowledge, will overwhelm
    the process side (misleading the client) and, often, will not mention the technical
    side at all.


    It is easier to sell to process management than convince the importance of technical
    excellence and all the effort we need to manage it. Senior managers really well
    fail to see the benefits of developers playing a part bigger than just writing
    code. They also fail to understand the importance of paying for the quality of
    the code produced by developers. As long as it works, they are happy


    Senior managers, coming from technical backgrounds, are easily misled by bad coaches.
    After a few months, if not years, when things goes wrong, it is very easy for
    Agile coaches and managers to blame their developers. Sometimes they are at fault,
    but the question here is how will the Agile transformation help them to be?


    # Rejecting Technical


    But there is the other side as well. There are very good Agile coaches and consultancy
    companies out there doing an excellent job and helping their customers. When it
    comes to XP childish, they get many. customers immediately reject the idea of
    having two developers pairing—they think it is a complete waste of money. They
