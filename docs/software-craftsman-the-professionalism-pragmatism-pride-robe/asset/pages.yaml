- pgno: 49
  md: 'legacy code can be massively rewarding. The process of trying to make sense
    of a big ball of mud seems daunting, but if we focus on small pieces at a time,
    and start them (writing tests, extracting methods and classes, renaming variables,
    etc.), things become much easier and enjoyable.


    Working with legacy code is almost like solving a jigsaw puzzle. We don''t put
    all the small pieces together at the same time. By separating the pieces into
    groups, often starting with the corners and then separating the other pieces by
    color, pattern, and so on, This approach will help us see a few small pieces and
    start forming a well-defined model in our head. What was once a mess of pieces
    (a big ball of mud) is now a bunch of small pieces of non-related spots. It is
    not very helpful or, encouraging, but progress is being made. Bit by bit, we start
    working on one of these groups (parts of the code) and start putting some pieces
    together (with the existing code), which will help us with understanding of the
    code, and refactoring it until it''s getting real.


    When we start putting pieces together, we start to see a bigger picture. We get
    excited because now it''s getting. It''s starting to make sense and we are happy
    making progress. The more pieces we put together, the more the remaining pieces
    get together. And that''s exactly the feeling we have when we are working with
    legacy code. For every piece of code we make, the more we want to refactor. The
    mess is now a bunch of what was there before something we could easily read and
    took to understand but now looks like a story, and every developer can understand
    it, without effort at all. Maybe with well-defined code is helped (covered by
    tests, easily changed), and we can easily refactor it into new frameworks that
    we wanted to use. We could use some lovely libraries. We could then throw a lot
    of old code and replace it with a framework. With that, we don''t even need to
    envy our friends working on green-field projects.


    Another interesting thing about legacy code is that it forces us to think in a
    different way. In green-field projects, when adding a new feature we can just
    build it. In legacy code, we can''t even instantiate a class in order to test
    it without all its dependencies. In one place we can cause an impact on other
    parts of the code. We have two options here. We can see all the challenges of
    working with legacy code as a pain in the neck or we can see them as interesting
    problems to solve. I personally prefer the latter. It is easy to say that this
    piece of code is badly written. It is easy to complain or even laugh. But the
    question is: are you good enough to make it better?


    # Personal and Client Satisfaction


    Refactoring code can be a bit of time and very addictive. However, although it
    is OK to have fun and enjoy what we are doing, we always need to remember that
    we are professionals and being paid to help our clients achieve their business
    goals. Companies are investing a lot of time and money on software projects. With
    every investment, clients want to maximize their return and we do our part to
    make that happen. The more we improve and keep the clean software, the longer
    the client will be able to benefit from it. Stretching the life span of an application
    maximizing our client''s return on investment.


    At the end of the day, it does not matter if we are working on a green or brown-field
    project. It is your attitude towards our job that will make it more or less enjoyable.


    # Summary


    If a piece of software is effective for more than a few weeks or months, neglecting
    quality in order to go fast is an illusion. Many companies become hostages of
