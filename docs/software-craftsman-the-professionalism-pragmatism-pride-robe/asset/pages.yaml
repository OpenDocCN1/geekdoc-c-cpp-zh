  md: '# 8. The Long Road


    Everyone wants to be good at something. The motivations vary a little but one
    thing is true for all of us: mastering gives us pleasure. We become proud of ourselves,
    even if no one cares about it. However, even a ball nights having fun focus and
    determination is required to master something. Whether we are of enough to win
    the long and road to mastery.


    This chapter is about our careers and the things that really motivate us. Are
    we really looking after our careers? Do we really know where we are going or where
    we want to be? What are the things that really motivate us to do a great job?
    Do we show our jobs as investment? If yes, what is the return on investment?


    # A Tale from a Brazilian Teen


    As a middle-class teenager living in a small town in the Brazilian country, my
    dream was to live in London. I could never explain why, but there was something
    about London that fascinated me. My parents avoided conversations about the subject
    because they knew the chances of it happening close to zero; our ever-struggling
    financial situation never allow me to have a good education or live in a better
    city. The small town we lived in didn''t even have a university let a skilled
    professional. On that day, I could not speak English well and I had never even
    thought about working in the UK market. How could my CV stand out in a country
    that has some of the best universities in the world?


    Even so, I was different. When I finished school, I had to decide which career
    I would follow. My dreams were limited because we couldn''t afford the best universities.
    Taking that into account the things I was passionate about: as a teenager, I had
    a long road ahead and the dream to become a developer was my only option.


    After a few years working as a software developer, I finally could afford to start
    a very long and expensive Italian journey; my parents were Italians. I had a lot
    of money to help me find a job in London. For a Brazilian-middle class boy like
    me, I could translate all of them into Portuguese, and make legal documents in
    English well, but having a European passport was almost essential for me to pursue
    my dream.


    In 2000, with my career in motion, I traveled to the UK on holidays. I was 23
    years old and what I wanted was never to have to travel in order to see London,
    and the rest of the UK, was was exactly what I thought it would be. I had to know
    exactly what to do in order to be competitive in the UK market. For 30 days I
    traveled around the UK and spoke to a few developers, who found me the trip via
    an online website similar to LinkedIn. I realized I had a few years of experience
    as a developer, Delphi was not enough to get accepted in the UK market. I spoke
    to many developers and asked for job openings. The job market was hard back. Then
    as I realized that my English was not good enough to talk to other developers,
    for interviews, or for any of the conversations we needed to have when working
    on a software project, I started to practice English with the people around me.


    After a wonderful time I found a place I could live. I hired a private English
    teacher who could teach me in the evenings; and I enrolled myself in a postgraduate
    course. As it was a bit weird that my academic record wouldn''t be enough. I decided
    to take a few courses well-not that they prove anything but to help me on my CV
    that many companies in London could recognize.


    At that point, I realized that my career was so important for me; I was not just
    preparing myself to move the UK. I was preparing to have a successful career-according
    to my ambitions and criteria-where I wanted to live. I realized I had to move
    out of my comfort zone; take ownership of my career, and constantly look for opportunities.
    It is my life, and career is important.


    For the next four years, keeping an eye on the UK market, I prepared myself. In
    January 2004, with a European passport in hand, I contacted a few developers and
    companies in London, moved to London, and within two years I started my journey


    A journey that lasted more than a decade come to an end. I was finally living
    in London and working as a developer. I realized my dream was just for start,
    some new opportunities appeared. But even deeper something had happened to me.
    When I arrived in London I was not the same teenager with a dream. I was a 27-year-old
    professional software developer who was still at the very beginning of my journey.
    I realized that my career was a long road to mastery, and a new and exciting journey
    was just about to start.'
