  md: '# # Preface


    In the mid twenties, two years after I started my professional career, a large
    international company in São Paulo, Brazil, announced that there were 6 developers
    needed on go. The selection process took a few weeks and was divided into four
    phases: a three-hour technical; weeks of trainings in their proprietary technology
    followed by a test; a full day of group dynamics; and a round of interviews. They
    announced in a newspaper and 900 developers applied. I was working for a small
    software house at the time, a place where I was very happy, but I felt that I
    was looking for something better. Since the first few were held on a Saturday,
    I decided to apply. For, more than 300 candidates passed to the next phase, and
    I felt nervous and confident but wary. I had to resign from my current job to
    move forward with the selection process because I would need to take many days
    off for the remaining days. My financial situation was not as great and I could
    not count on any monetary support from my family. It was quite hard to leave a
    job in order to pursue a dream that I had no idea if would come true. Also, I
    had no new job ready. But I had to do it. That was the type of company I wanted
    to work for. For what I wanted.


    I was 21 years old, and I already had a few years of experience when I was 11
    and started my professional career when I was 19. The process is a mix of the
    youth and a bit of cockiness that is easy to arrange without giving the impression
    of an arrogant, young person like you. I could easily anyone hands down. I thought
    of myself, better than any other person who studied with me at university, but
    better than the majority of the developers who met me in my previous jobs.


    After going through all four phases, the company announced that they could find
    60 developers at the level they were expecting. They hired 32, and I was one of
    them. The more I worked the more cocky I became. In my first week, I was assigned
    to be responsible for delivering different business modules of the system. For
    the first weeks, I heard about a team that seemed the best team in the company.
    They were the "architecture" team, responsible for the core system and for providing
    all architecture used by the business.


    The architecture team was led by this incredible guy, who also did all the management,
    and was also a fantastic developer. He was a man like me, but he had many years
    of experience to manage time, code in his name, and review the code written by
    his team. His team was always working on interesting things and that their code
    was really good. That was what I was looking for.


    After a few weeks, I was asked to meet the manager of the architecture team, this
    guy I heard so much about. I didn''t know what to say or what I was expecting.
    I had only one thing: I had nothing to lose. The worst-case scenario was he would
    say that he was not interested to have me on his team. One day I found myself
    alone in the office waiting for him. He looked at me with a smile. "I''m Nam,"
    he said. "Nice to meet you," I replied. He was calm and relaxed. "I want to work
    with you," I said after a few seconds. He was surprised but he took it in a very
    positive way. We started talking about the selection process, why I applied, what
    I expected and if I had pet projects to show. I showed him my projects and some
    other random things I had done. And after 30 minutes of conversation, he called
    me when I started. I was shocked. That was not what I was expecting. So he scheduled
    a meeting, a formal interview, and so on. It took a long time to get used to the
    rhythm and I was always wondering whether I was good for this development. He
    was right, I was worried about doing the right thing.


    My first day was on a Monday. The manager came to call me and assigning me a task.
    He explained one of the application and what I had to do. He told me it was a
    good way to check what I could handle. It was hard. That was the challenge. I
    had to show him how well I wanted to be. I stayed in the office until midnight,
    shift a few hours every day on Tuesday, and two cups of coffee in the afternoon.
    I finished my first assignment with less than half of the time had been given.
    I was feeling great. I had all my colleagues helping me get the job done. It was
    a huge achievement.


    I rushed to Nam''s office and he said with excitement, "You finished it. And it''s
    good." He was stopped working and turned to me. "Making things work is much easier
    for someone who is good for it," he said. "What you say is true, if it works"
    - That was like a big slap in my face. My face faded a bit because I thought he
    was being sarcastic. Maybe he was, I had a bit to say. It was a long day, No and
    I did not have words to say. "But, let''s see what you can do," he continued,
    and I was watching him type in the command line, checking the code from source
    control and assigning my sample.file containing all my code. He opened the file
    with this horrible black and green editor on the command line. That was the first
    time I had seen it. We worked together then and some Delphi files in vi (a Unix
    text editor) integrated environment (IDE). "Close so we can have a look at it,"
    he said. I had written about 200 lines of code. He positioned the cursor and I
    started at the code line by line. Every five lines he would stop and say things
    like, "Do you know what happens when you allocate and deactivate memory? Can you
    see here? Here are allocating memory in one method and'
