    as they move forward in their careers and gain more experience, they should share
    their better ways of doing things, exploring alternatives in real projects, and
    sharing their experiences with the rest of the community


    Good practices and processes are good until one comes to replace them. That''s
    for programming languages and tools. That''s for building things like cars, electronics,
    and almost everything else. Back in the 1990s, the Unified Process was the alternative
    to waterfall development. Scrum became a much better option later. After more
    than ten years since the Agile summit, and what we learned during this period,
    alternatives are being discovered. That''s called evolution.


    As craftsmen, we don''t believe that TDD and all the XP practices are the best
    that we will ever have. At this time, the practices we use might not be the best,
    which would mean we should stop looking for ways to improve. The way we convince
    others there is just one way of developing software—in other words, that is just
    one set of practices we should use—is not correct. Software craftsman has a tool
    and can choose the best practices and tools for the job.


    Don''t to call people unprofessional just because they don''t use craft practices.
    Ask what practices they use and then compare their benefits with over the practices
    that you use.


    # # Helping the Business


    It is common to be a project where the business doesn''t know what they want.
    It''s common to have a situation in which they are still trying to figure out
