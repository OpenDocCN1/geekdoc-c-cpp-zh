- pgno: 61
  md: '# 9. Recruitment


    The first thing to do when hiring a new person is to sure we are not making our
    existing problem worse. If we are unhappy with how our developers work or behave,
    there is no point in hiring more developers who work and behave in the exact same
    way. We want our developers to be constantly learning, bringing innovations, adopting
    more efficient practices, caring about the project and quality of the code, self-organizing
    to solve problems, and striving to be better than they do, why would we hire more
    developers who do not satisfy this criteria? Although this sounds obvious to many
    of us, it is not so to hiring managers and the humans resources department. Every
    company would say that they want the best people, they do not really know what
    that means. And a proof of that is they advertise job openings.


    In this chapter we look at how to attract software craftsmen to our organizations
    and how to do proactive recruitment. We will also look at how craft job descriptions
    and how to avoid job descriptions altogether.


    # An Ordinary Job Description


    The following advertisement was adapted from a job site and anonymized to protect
    the poor who wrote it. Financial institutions normally have job listings like
    the following:


    +   Our Client, a Major Bank, is currently looking for a Java developer to work
    in their London office on a long-term contract basis.


    The successful applicant for the Java Developer position will have the following
    skills and experience:

    * Strong Java programming skills, multi-threading and concurrency (minimum of
    five years'' experience)

    * Very good background (Spring Integration, Spring Batch, MVC and IoC)

    * Banking background (minimum two years)

    * Low Lat High Frequency Trading systems—Foreign Exchange

    * FX price (focus, but towards future and precious metals)

    * Front office trading risk management and pricing in Foreign Exchange

    * Strong academic background in Computer Science (preferably Masters or PhD)

    * Solaris, Linux, RMDS, 22, Kv/Q, SQL (Oracle), Coherence

    * Desirable: C,++, messaging, Agile methodologies, distributed/distributed caches,
    Sabase, DB2


    If you are interested in this Java Developer position and meet the above requirements
    please apply immediately.


    Due to my experience and personal concerns, I know that the companies that have
    job listings are not only looking for another Java developer. They have bigger
    problems in their projects, processes, culture, and that''s what they are trying
    to fix. Unfortunately, they do not know how to solve these problems or how to
    hire the right people to help them


    This job listing is about investment banking. But the developers who created these
    legacy enterprise systems in one bank, and who first insisted on earning more
    money of profit after all, can easily find a Java developer or another similar
    job. They pick off all the best in the listing: they have the best experience,
    they have the technology (although they do not know how to use them) and we have
    investment experience. These developers are free to move from one bank to another
    to whoever they want. They want to deliver quality code, but they are not the
    people who care about the product for the better. But, unfortunately, they do
    not really understand that it is what they have for better people, they need to
    change their recruitment process. They need to change how they attract great developers,
    starting with their job


    Of course this is not just investment banking. Many companies with similar problems
    also have advertisements like this. For companies trying to change their culture,
    struggling with low morale, with technical debt, and lacking passion to innovate,
    how is this job listing useful? If the goal is to deliver quality capabilities,
    change the way things are done and improve the culture of the company—this job
    listing is totally pointless. The hiring has the wrong focus, failing to express
    the company''s values and the attitude it expects from each candidate. Hiring
    people purely based on technical knowledge will not help to drive technical and
    cultural changes.'
