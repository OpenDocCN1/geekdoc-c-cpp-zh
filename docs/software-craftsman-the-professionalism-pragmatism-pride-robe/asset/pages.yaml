  md: '# 7. Technical Practices


    What is the real business value of technical practices? Why should I, as a project
    manager or product owner, care about technical practices? As a developer, would
    I care about Test-Driven Development (TDD), pair programming, and all other Extreme
    Programming (XP) practices? I''ve been developing software for a long time and
    never needed them.


    This chapter addresses all these questions and gives you more ammunition to convince
    your peers and managers to adopt technical practices, or at least review the value
    of the ones you use currently.


    # The Right Thing versus the Thing Right


    The feedback loop provided by process-oriented Agile methodologies enables us
    to regularly inspect whether the business goals are met. Instead of freezing for
    long periods of time, companies can inspect and adapt on a daily basis. There
    is nothing them to a ton of diagrams, documents, plans, or contracts in a short
    time. Agile methodologies embraces changes instead of them. They may have found
    their own way to establish a quick and fast feedback loop, but not every company


    With exceptions, I believe that Agile methodologies are a better alternative to
    waterfall and other heavyweight, document-based methodologies. They provide a
    quick and short feedback loop, which helps us to make building the right thing.
    This is achieved through a combination of practices and activities: visualizing
    in progress, just-time prioritization, and focusing on minimum marketable features
    (MMFs), stand-up meetings, burn-down charts, user stories, acceptance criteria,
    scenarios, definition of done, cross-functional teams, regular demos, and everything
    else provides value. Using these practices will help us build the right thing.


    The problem is that we cannot manage the quality of our applications through these
    practices and activities alone. when companies realize that one of the biggest
    impediments for achieving business agility in the state of their code, it may
    be too costly to maintain. The cost of rewriting a part of base code or rewriting
    the whole codebase can be prohibitive. The "code" that is deconstructed can be
    very difficult for the business to identify and when it is finally discovered.
    Discarded code is like a sunken car, difficult to identify in the beginning, and
    hard to recover when it is finally discovered.


    So how can we make sure we are building the right thing? How can we get the same
    quick and short feedback loop on the quality and design of our code?


    Although there overlaps between Agile and Software Craftsmanship, Software Craftsmanship
    complements Agile by focusing on technical practices and providing a quick and
    short feedback loop on the quality of our code. Technical practices help us to
    make sure we are building the right thing.


    # Context


    Software Craftsmanship, promotes a more professional and ethical approach, also
    strongly encourages the adoption of XP practices like Test-Driven Development
    (TDD), pair programming, refactoring, simple design, continuous integration. All
    of these practices, will be discussed later in the book.


    Many developers cannot explain why they don''t use XP practices on a daily basis.
    After asking developers over the years, a very common explanation is: "You don''t
    know my company. You don''t know the people I work with. This would never work
    in my company. My boss would never allow us to do that. I believe the whole Software
    Craftsmanship is a joke, and there is no need to see there and understand what
    I am saying."


    When speaking to others, of course, I don''t know their context, and in theory
    what would make it impossible for me to draw any conclusions. They are absolutely
    right. I don''t know their context. The details at length. However, after working
    for many companies and on many different projects, it is not hard to say that,
    each company has its own way of working, they also have a lot of money. In many
    of these problems are the same. Many companies, regardless of how different they
    are, are unhappy with their software delivery capabilities, lack of bureaucracy,
    and messy systems, many of these teams are looking for a magic solution that can
    make them accept a better code they can get easily and freely. Scrum fits the
    bill, and many companies don''t feel the need to go beyond that. Well, at least
    not until they realize that they need to pay more attention to how their software
    is being developed.


    Context is important. If we are adopting Agile methodologies, which can significantly
    change the way we work, context is extremely important. Context needs to be taken
    into consideration when choosing a more suitable work to our problems. A change
    in the process may impact roles, responsibilities, and information flow, which
    makes understanding the context essential.'
