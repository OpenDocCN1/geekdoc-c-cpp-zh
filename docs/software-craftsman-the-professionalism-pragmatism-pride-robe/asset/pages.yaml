  md: '# 11. Interview Anti-Patterns


    Paying attention to detail during the selection process is one of the best ways
    to get insights into the culture and values of the hiring company. Experienced
    and talented developers are very selective about the clients they want to work
    with. On top of the financial offer, autonomy, mastery, purpose, productive partnership,
    talented and passionate people, and a good working environment are some of the
    things they will consider before accepting any offer. How they are interviewed
    and, most importantly, the people who are interviewing them can be decisive in
    them accepting the job.


    In order to attract software craftsmen, as an interviewer it is important to know
    what to avoid when conducting interviews.


    In this chapter we cover many interview anti-patterns that should be avoided if
    you want to attract software craftsmen to your organization.


    # Don''t Be a Smart-Ass Interviewer


    Don''t try to make yourself look smarter and better than the candidate. Don''t
    intimidate the candidate by putting them in a tough situation for your pleasure.
    Don''t try to impress the candidate with your job title, responsibilities, and
    the skills. Don''t talk to the candidate as if you were the most powerful person
    in the world. Simply put, don''t be an ass.


    Don''t try to look smart by asking irrelevant and questions. Experienced and talented
    developers will notice it and won''t be very interested in working with you.


    When recruiting for talent, you should be looking for a partner, a person who
    can join your team and help you to be, and not a subordinate developer who follows
    your orders.


    Just be honest and humble. Treat candidates like professional developers, and
    conduct the interview as if you were having a technical conversation with some
    people. Most important, listen to the candidates and keep your open mind. You
    may actually learn a few things.


    # Don''t Use Brainteasers


    Avoid questions that are totally unrelated to the how. How golf balls can you
    fit into an airplane? A clerk at a butcher shop finds 50 inch tall and size 13
    sneakers. What does the weight? To answer these stupid brainteasers has nothing
    to do with writing relevant code, being a good team player, or having a professional
    attitude. Brainteasers are a total waste of time, as Google developers finally
    realized after using them for a long time. At least for them, better than never.


    # Don''t Ask Questions Which You Know the Answers


    Googling for questions and answers to ask candidates before the interview makes
    no sense. If you, as an interviewer, are not sure about the questions and answers
    they are probably not important to the job. If you are a good interviewer, you
    will know what is important and what is not.


    Don''t try to trick the candidate with confusing or misleading questions. If we
    don''t do that to our colleagues, and we get mad when people do it to us, why
    would we do it to likes?


