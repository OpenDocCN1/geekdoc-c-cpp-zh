  md: '# 10. Software Craftsmen


    Interviews are a two-way street. Companies try to find developers who can help
    them achieve their goals, and developers try to find out if the hiring company
    is a good fit for their career aspirations.


    As companies generally conduct interviews as part of their selection process,
    it is vital that developers use the interviews to learn as much as possible about
    the hiring company. Choosing a new job is an important career decision and can
    have a direct impact on our personal lives; we may be spending more time at work
    than we spend with our loved ones.


    In this chapter we look at how companies and developers can identify whether they
    will have a productive partnership. We will then look at some interview techniques
    and describe how to interview software craftsmen.


    # A Business Negotiation


    As technology evolves, the need for software professionals increases. In order
    to have a competitive advantage, companies now demand that they hire highly talented
    and passionate developers and, most importantly, pay them well. This is highlighted
    in an article in InfoWorld. The US Bureau of Labor Statistics projects a 30 percent
    job growth in the coming years, and CareerCast deemed software engineering the
    all-around best job for 2012.


    During an interview, it is important to remember that we are not begging for a
    job. We are doing business negotiation. On one side we have a company with needs
    and goals. On the other side we have a software perspective that could help the
    company achieve its contracts; the most important aspect of providing a service,
