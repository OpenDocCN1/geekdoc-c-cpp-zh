  md: 'Throughout my career, I chose one of my jobs very carefully. I never sent a
    bunch of CVs to many different companies with the expectation that at least one
    of them would make me an offer. I knew exactly what type of company I wanted to
    work for. And even when I faced reality, when I was not ready or good enough for
    that type of job, I took my time, prepared myself, and tried again. Each job helped
    me to move forward with my career. Each job was a very important step in the road
    that is my career—long road to mastery.


    This should be confused with "CV building". CV building is when, while working
    for a company, developers use the force of a technology or a methodology that
    is not fit for the purpose they want to have on their CV. It is not only wrong,
    but also unprofessional.


    # Building Our Career, One Job at a Time


    Before I chose a job, I ask myself the following questions:


    +   * What do I want for career?

    * What is the next step to achieve?

    * Is this job aligned with my career aspirations?

    * How much value can I add to this company?

    * What is the return on my investment?

    * How long (roughly) the duration of my mastery?

    * How would this job help me to get to be as a professional?

    * In this job, I will have autonomy, mastery, and purpose?


    I will have a productive partnership with my employer, where both sides will be
    happy with the value they are getting out of it!


    > Note

    The questions above are completely unrelated to the type of contract I had. I
    was a permanent employee for the last part of my career, this is not exclusive
    to contractors or consultants.


    Knowing to all the answers before starting, is almost impossible. We only get
    some of the answers after we started our employment. This doesn''t mean we didn''t
    try to get these answers upfront. As is mentioned in previous chapters, the hiring
    process is a two-way street, and there was no way to make questions about the
    employer as early as possible before we


    So, the question is why I have resigned from so chosen jobs? If employers could
    make exactly what I wanted when I joined, why did I leave? There are a few reasons
    for that. Over time, my aspirations changed. Personal life changed. Some of my
    employers changed. When things changed, I spoke to them, and within their limits,
    they were able to give me all the I was looking for. So sometimes I looked for
    more. Some wanted more projects or different things. Some wanted more money, and
    I wanted more things. When times then I wanted more responsibilities, and they
    gave me pay and raises. When times then they could not offer what I wanted more,
    I could offer. When I wanted to work for a different company; have my own startup;
    for a company with global teams; live abroad; have I had my first daughter, I
    wanted to reduce the amount of time spending away from home working on projects.
    At different stages of my career, I wanted different things. And with maybe one
    or two exceptions, all my experiences were great, but at some points, we had to
    separate that ways.


    I see a career as long, winding, and curvy. The road of that, is the Promised
    Land: mastery. This road also has roadblocks, potholes, confusing signs, and many
    leading junctions to order... Mastery is very difficult to master, and whether
    we going for too long road can make a direction may, if I am not careful, and
    we take another turn, where conditions do not allow us to see so far ahead..


    After a few years working as a software developer, I became a master. But I was
    meeting more and more developers, out of my circle, I realized that I was away
    from what I thought. I was not traveling fast on a German Autobahn I thought.
    Reality showed me that I was fact traveling slowly on a Brazilian country road.
    I was so far away from mastery that I could not even see it. I was disappointed,
    and it took me time to recover from that. When I realized that I had to do something
    about it. I had to take my layoffs and seek opportunities where I could in and
    evolve.


    Each is a milestone, a step in a ladder. Each job should follow us on our journey,
    so they should be chosen carefully. The amount of time we stay in a job can vary
    enormously—it can be from a few months to many'
