- pgno: 107
  md: 'My way is to stay in a job for as long as it remains aligned with our career
    aspirations. Whenever it starts to diverge from our career aspirations, the partnership
    with employees gets weaker and less beneficial for both. Whenever we feel we are
    not moving forward, we are not learning or enjoying ourselves, we should move
    on. Loving the company and our colleagues is not enough to stay in a job. People
    move on, companies move on, and so we. Looking for a job that is more aligned
    with our career aspirations is a favor that we do for them to bring in new people,
    with fresh ideas and energy to inspire the status quo and do better. From experience,
    I believe a staff turnover of 15 to 30 percent is very healthy for a company.
    People with new ideas help the company remain up to date, competitive, and fresh.


    # What If We Don''t Know Where to Go


    At first, this sounds like a little question, but it happens to everyone. We don''t
    know where to go or what to do next. Sometimes we get lost. It takes a bit of
    courage to adapt to that, but when we do that ourselves, things get better. Once
    we know where we are going, we can be more focused and objective in our way. That
    clearly has happened to me. In fact, it has happened three times in my career.
    There is nothing more you can do when you meet more people. Get out of yourself
    and open as many doors as you can. Start attending networking events. Catch startup
    events to inspire new opportunities. In conversations meetings look for luck.
    If you go out there and show who you are and what you can do, you will see that
    there is a world out there full of of people, and with opportunities you never
    imagined before. This experience will help you decide where to go. Personally
    I know a few stories from developers in technical communities and started their
    own companies, found great jobs, or changed their careers.


    # Job Diversity


    Software development is a very diverse profession, and skillful craftsmen have
    very broad experiences. Being a developer in a startup and building games for
    mobiles is very different from building enterprise applications for a global investment
    bank. Developing a mass-market product is very different from developing software.
    Working with web applications is very different from developing applications with
    no user interface. Although you can argue that all software should be treated
    as a project internal tool or other systems that are not and-that is not the class.
    Building an embedded system for a car is not the same as having thousands of users
    to satisfy. Working with your own applications allows you to see how many of the
    good practices apply in many different types of software, the whole environment
    is different. People are different. The relationship with users or clients is
    different. The amount of experience you get in certain projects can be very different
    experienced projects. In certain applications, a bug can cause huge damages (millions
    of dollars in fairly, or even endangerment of human life) while in others, a huge
    bug reduction might not be as big (some users get a bit annoyed but they will
    get it over soon, when the bug is fixed).


    Working for a company can be great if you''re exposed to different types of projects
    and industries. I''m not saying this, but it''s definitely a great deal. A consultancy
    company has many experiences and they provide us with many different opportunities.
    As you move from project to project, you may have opportunities to work with different
    technologies, different types of software, different types of teams, different
    team dynamics, and different tools and processes. You may have all of these while
    still working for the same company. On top of that, you can increase your network,
    which can be very handy as you move forward with your career. Working on various
    types of projects can be exciting, as it makes you learn things you never would
    before. Opening many doors can lead you to explore new environments. A few years
    can give you a lot of experience, exposure, and options, making it easier for
    you to decide where to take your career in.


    # The Mission


    Software craftmen are not us. They focus on better matters, constantly investing
    in their own careers and learning, teaching, sharing, and delivering value to
    every single client. But this is mission but not just clients—that''s just part
    of it. The real mission of a software craftsman is to make a contribution to the
    raise of the software industry, with professionalism, passion, and care. Software
    craftsmen are not more than ordinary developers who are hired to do a job. Craftsmen
    focus on helping others get better at their craft and to be what they do and why
    they do. The goal is, that, the quality and scale of software projects around'
