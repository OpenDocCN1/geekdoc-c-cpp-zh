    # Summary


    Low morale can destroy a company. Unmotivated people have no energy to create
    and bring innovation. They have no motivation to do a good job and take responsibility,
    but people are not normally like that; they become like that. Some comparison
    is a very good job in beating the passion out of people. The good news is that
    low morale can be reversed over time if we have good support from management.
    Embracing Agile processes and ideology is essential for providing the right environment
    for improving morale, but when it comes to developers, we need more than that.
    Managers and Agile coaches have a very low chance of motivating developers because
    they are not close enough to them. I don''t mean sitting next to them and talking
    to them multiple times a day. I mean sharing a career, a passion. The best person
    to motivate a developer is another developer. A good developer a software craftsman.
    A developer whom other developers look up to can inspire them. If you want to
    bring passion and motivation to a development team, make sure you bring in a few
    craftsmen to join them.'
