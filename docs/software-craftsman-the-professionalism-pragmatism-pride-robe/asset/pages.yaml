  md: '# 16. Career As a Software Craftsman


    Being a software developer is awesome. Look around. Almost everything that is
    man-made today has software behind it. The chair you are sitting on comes from
    a factory that uses software, TVs, refrigerators, and cars all have software running
    inside them. The food you eat is connected to software—if not for the many companies
    using millions of lines of code in their systems, from so many different suppliers
    and countries wouldn''t have marketplaces. Software lives—many of the advancements
    in life were possible without software. Transport, communications, entertainment,
    sports, everything has software behind it. Software enables businesses to succeed
    and charities to help people. Software provides support for the authorities and
    volunteers to help people, minimizing suffering after natural disasters. Software
    helps to prevent injustices, assists law enforcement, and helps to restore parts
    of the world. Software also gives us cool bears and herds of conversations in
    our TV boxes. Software unites families and friends, and that for one another.
    Software lives—a continuous dedication to what we do? How can we treat our jobs
    as “just a job?” How can we not know we know that what we do is important. Sometimes
    even essential, for our own lives? Software developers are essential for the world
    we live in.


    In this chapter we will discuss what it is to be a craftsman and how to have a
    successful and fulfilling career.


    # Being a Craftsman


    Passion. That summarizes it. Software craftsmen are passionate about software
    development and profession. They are passionate about solving problems with simple
    solutions. They are passionate about learning, teaching, and sharing. Software
    craftsmen are passionate about helping the industry to evolve; share mentoring
    developers through their experiences via blogs, books, talks, videos, and conversations;
    and being active in technical communities. Software craftsmen are always ready
    to learn from more-experienced developers, and to develop less experienced.


    It is no secret that software is only going to grow in the next few decades, making
    our society even more dependent on it. It is order to craft well with this demand,
    software craftsmen feel they have a social and moral obligation to craft the next
    generation of craftsmen, making our industry more better and professional.


    Being a craftsman is more than going where we choose to do things well, to do
    the best we can. It’s a life. A life where we are prepared to make some sacrifices
    to learn and help others learn the craft. It’s a life of dedication to the art
    of writing code. It’s a constant search for better and more efficient ways to
    deliver value through software.


    Being a craftsman means willing to experiment with new ideas and not to be dogmatic
    about languages, frameworks. It means to be specific about using the right tools
    for simple solutions and although not dogmatic about them, a craftsman must master
    a good set of tools, languages, and frameworks.


    True software craftsmen focus on solving problems, not on writing code. When they
    need to write code, they focus on writing code that is easy to understand, and
    easy to maintain.


    A craftsman is missed for the work we demand. No developer will be a craftsman
    because the mess they left behind or they were the only one who could understand
    the code they wrote. A craftsman is missed for the right reasons: insightful conversations,
    encouragement, knowledge, and most, being a great colleague.


    # Honesty and Courage


    Honesty and courage are essential qualities of a software craftsman. "Well, but
    that is valid to you," you say. But by honesty and courage I mean saying “no”
    to clients when it is necessary. I mean being honest and courageous to tell them
    what they are asking for is unrealistic and is not good to go with—even if we
    know they will be annoyed by it. I mean telling our clients they are making a
    bad decision. We need to tell our clients that we are not going to commit, or
    be responsible for, for things that they don''t feel.


    Honestly, saying “no” is not about a craftsman’s attitude. ‘A no’ is often followed
    by, ‘But this will not work, maybe we could try this thing instead.’ Or, ‘There
    is a big change and we are not going to meet the deadline, maybe we could release
    a version, and release the release as soon as we can.’ Or, “But sorry what you
    are asking for is not to happen within the time frame you expect. I would advise
    you to speak to the stakeholders and then call a meeting so we can discuss the
    alternatives. I cannot commit to what you are asking because I know that the risk
    is too high.


    The career of a craftsman is built on honesty and courage. A craftsman never hides
    from customers. Crafts and customers are in a partnership, where honesty, courage,
    and transparency are key.


    # Career Progression


    Wei***'
