  md: 'How we make sure we are not filtering out good developers? The first thing
    is to define what a good developer means. This is totally dependent. Different
    teams, with different cultures, developing applications, have different views
    of what a good developer means. I''ve had this discussion with experienced developers
    over the years and once were good developers defined according to specific technology,
    years of experience, or academic background. If a good developer is not measured
    according to that, why do we keep looking for these things or using these criteria?


    In our case, filter criteria were related to what we value the most. We soon realized
    we could measure it just looking at traditional CVs, and that was not enough for
    starting off. From that point onward, we looked for CVs that had at least one
    GitHub account, a blog, technical contributions, community involvement and users
    with which they were active. In this mind, any of new projects, a passionate junior
    developer should have some of these items. This approach was good for us to identify
    the developers who were investing in their careers outside working hours, which
    also adds passion.


    Although we know that some developers may not have any of the things described
    above, the alternative would be to go back and interview every candidate—which
    would make the selection process very expensive and even prohibitive.


    # Proactive Recruitment


    When we started Codurance, one of our clients, an international consultancy company,
    asked us for a unusual service. They asked us to help reshape their recruitment
    process and interview candidates. We were growing fast and had to hire more than
    70 developers to keep up with their demand. They needed developers of all levels—junior,
    senior, architects, employees, contractors. They also needed analysts, development
    operations (DevOps), and testers. They were hiring for many new projects and needed
    developers in various languages and technologies.


    One of the reasons they asked us to help them is that they couldn''t cope with
    the volume of interviews, and they were not able to quite hire about recruitment.
    They needed to make sure they got talented developers to join the company because
    the mastery these developers would work directly with their clients, developing
    bespoke software.


    Before they in, they were in desperation. They had no time to hit and fill all
    the roles in order to not lose business opportunities. The problem is that when
    you are in desperation, you increase the risk of making mistakes, especially when
    it comes to recruitment. You ended up lowering the bar and recruiting anyone you
    please.


    It took us some time, but we helped to reshape their recruitment process, with
    the advice written in this book, and we managed to select some developers from
    them.


    We learned a lesson which never allow your company to be in this situation. When
    you are desperate it will make you bring the wrong people to your organization,
    although you may think that at least you are able to hire these developers for
    the projects they are going to join. Maybe they will end even before you expect,
    because your clients will be very dissatisfied with the service provided by them
    besides. Besides damaging the reputation of the company, the you now has many
    developers on the bench, waiting for their next project.


    At Codurance, we decided to be proactive with our recruitment process. We did
    not want to wait until we have a need to start recruiting. Finding good developers
    is very difficult and you often won''t find one quickly enough. In this way, we
    constantly interview candidates for our craftsmanship and passions. The difference
    is that we make our recruitment process specific enough that only the types of
    developers we need to apply. In addition, this helps us to reduce the number of
    applications and increase the quality of candidates.


    During times when we are not ready to hire all applicants, we tell them at the
    start of the recruitment process that we are not ready. If they want to go through
    the selection process and pass, they will be the first ones we call so soon as
    we are. As part of our selection process, we use code assignment that is at least
    a way to convince them that they can go through the process, even that we are
    not ready to hire, we provide to them with a very comprehensive review of their
    code. In this way, applicants at least get some valuable advice on their code,
    and we can build a pool of talented developers who have passed our selection,
    and we can call them when we are ready.


    # Summary


    Companies can benefit a lot from engaging with local users and technical communities.
    It gives them a chance to meet great and well-established professionals, as well
    as many young developers with high potential. Due to their conflict of interest,
    they do not always care about clients'' cultures and values. Matching keywords
    in a job description to CVs is how they usually do their filtering. Their lack
    of understanding about software development and technologies makes them very poor
    talent scouts.'
