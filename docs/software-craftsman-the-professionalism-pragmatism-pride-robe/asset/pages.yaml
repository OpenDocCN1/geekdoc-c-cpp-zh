    more confident to choose the best solution to the problem, making the people that
    made the suggestions stand out.


    Good managers are part of the team. They stay with the team during good and bad
    times. If everyone is committed to work extra hours, they should be there as well,
    even if just to buy the pizzas, crack a few jokes every now and again. The team
    feels everyone in the same boat, feeling the same pain or enjoying success. This
    type of environment from external pressure helps people to focus on doing whatever
    they can to make things happen. Good managers shield developers from external
    pressure, whatever they can to remove any impediments the team may have, and help
    the team to feel comfortable and confident to get their job done. Managers should
    be ambassadors and it is their job to keep the team healthy, happy, and united.


    # Summary


    Being professional and satisfying our clients does not mean doing everything they
    ask us to. Our job is to help clients figure out what their needs are and also
    advise them on the best way to approach them. A professional has an ethics of
    conduct. A professional would never do something that could be harmful to a client
    just because the client is paying for it. Clients rarely understand the full impact
    of certain decisions on a software project, and it is our job to make them aware
    of it. It is our job to say no to clients when they ask for something which we
    know is not going to work or that is not going to be done by a certain deadline.
    This is the thing we would expect from a project manager, an accountant, who knows
    what to do or how to do their job. They wouldn''t let us away away. We go to these
    professionals with a problem (or a need) and we expect them to use their experience
    to explain options we have and what their respective risks are. We expect them
    to give us information so that we can make informed decisions. But if we push
    them to do something that goes against what they think right, they would simply
    say no. And that''s exactly what we should do.'
