- pgno: 51
  md: 'However, does context always matter?


    Are there any companies that really don''t care about satisfying their customers?
    Are there any companies that moved all to getting a good return on their investment?
    Are there any companies that are willing to pay for software that does not attend
    to their needs? Would it be better if the software they are investing in is delivered
    in years instead of months? Agile context is important, but there are many things
    that are not context dependent.


    # # Extreme Programming


    In 1996, Kent Beck introduced a set of practices that originated XP. Kent became
    the project leader on the Chrysler Comprehensive Combination (C3) payroll project,
    he proposed and implemented changes in their practices—some of them based on his
    work with Cunningham in the 1990s.


    The multimillion-dollar C3 project needed high-class developers together, as opposed
    to working in competition and isolation. Beck joined the team to develop and refine
    these methods. Jeff acted thereafter as a catalyst to instill the Agile practices
    in the team. The team had more Agile practitioners, including Beck, Martin, and
    Don. With a big focus on continuous integration and unit testing, they managed
    to keep the project on track.


    During an interview, Beck describes the example of the methods: "The first time
    I was asked to lead a team, I asked to do a little bit of the things they were
    sensible, like unit testing. The second time was more like the one I had. ''Damn
    the practices, at least this will make a good article;'' the team asked to crank
    up to ten on the things they were comfortable doing."


    Due to its strange and unconventional practices, the C3 project was considered
    an anomaly, but by Don moved out, he was able to apply their practices and had
    the same benefit. Unit testing and integration also added collective ownership
    to the XP. With the adoption of XP practices, management noticed a significant
    reduction in production bugs, a great suite of unit tests, and debugging time
    reduced to nearly, reached a factor of ten after the second case in lapse—projects
    were not to be an anomaly, but a viable approach.


    Since the Agile summit in 2001, XP has been considered an Agile methodology. However,
    rarely do companies adopt XP during transformations. XP practices are considered
    less important—by Agile coaches and companies prefer process-oriented methodologies.
    The truth is, few coaches and consultancy companies are good enough to teach XP.


    Some coaches and consultancy companies say that XP practices were granted for
    Agile transformations, and that why they focus on the process. Looking at the
    aftermath of all Agile transformations I''ve seen, XP practices were not granted;
    they were totally neglected. They were too hard to sell. It was difficult to explain
