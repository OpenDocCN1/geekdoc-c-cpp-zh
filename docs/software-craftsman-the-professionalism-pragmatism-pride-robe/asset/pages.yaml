- pgno: 25
  md: 'Almost immediately after the start, the conversation was taken to the Internet
    via a Google group. A few people from England and a few other countries also jumped
    in and had plenty to contribute. Bit by bit, Software Craftsmanship started in
    the UK, found a few places, and later to many other countries around the world.


    In March 2009, after loads of debate, a summary of the general consensus was decided.
    It was presented publicly, for both viewing and signing, in the form of the Software
    Craftsmanship Manifesto.


    # # Crossing Borders


    On February 26, 2009, the first international Software Craftsmanship Conference
    was held in London. Also in London, in May 2009, Adelaide Oshineye held a seminar
    for the aspiring software craftsmen, and Enrique Rioseniesen started The Wandering
    Book, a book that travels from craftsman to craftsman, capturing the current thinking,
    the zeitgeist, of the Software Craftsmanship movement. Software craftsmen wrote
    about what it meant to be a software craftsman and the book took pictures of entries
    and posted them on it. Unfortunately, after traveling around a few countries,
    the book and the website got wiped out. It is possible to find some information
    about The Wandering Book in a few blogs.


    In October 2009, the book Apprenticeship Patterns: Guidance for the Aspiring Software
    Craftsman, by Dave Hoover and Adelaide Oshineye, was published. This book was
    one of the first books to print, with practical advice, software developers to
    look after their careers, purpose, and their profession.


    From forward, Software Craftsmanship Conferences have been held every year in
    the United States, Kingdom, and from 2011, in Germany as well.


    # # Software Craftsman


    In April 2009, Beth and Olivia mentioned many of the important details about the
    swap. The Chicago Tribune covered this event on June 15, 2009, mentioning the
    mutual respect between the two companies, in terms of their technical capabilities,
    which made them believe they could learn a lot from each other. Many people, as
    a reaction, would think this is madness but in reality it shows that the craftsmen
    have different ways of doing things. ''I like to gain as much money as you can-
    as much as just pushing out software without thinking about how software has lives
    for a long period of time,'' said Cory Hayes, who helped to organize the swap
    and who was the originator of the idea..


    > "Initially there were comments from both sides as how it would work and we were
    all very excited," said Tyler Jenkins from Obama. "We experienced that they couldn''t
    get anything else. We chose to [send] someone who was an experienced developer
    and someone we thought represented the Obama movement"


    The developers involved as normal developers, working with other developers and
    doing real work. They wrote code, in meetings, and behaved as they were working
    for the other company-at least during what they wrote. This helped them to learn
    new practices, new styles, new languages, and so on.


    # # Software Craftsmanship Communities


    Although there was some noise about Software Craftsmanship since 1999, it was
    in 2009 that the field flourished. Besides books and few conferences, the Software
    Craftsmanship movement really gained traction with the creation of a global mailing
    list and a few Software Craftsmanship communities in the United States, London,
    and a few others in Europe.


    In December 2009, Uri Levi founded the Israel Software Craftsmanship Community.
    In August 2010, David Green and I founded the London Software Craftsmanship Community
    (LSC). SoCates 2011, the Craftsmanship and Testing conference in Germany, several
    Software Craftsmanship communities were founded: the Paris Software Craftsmanship
    Community was founded in October 2011, the same time the Softwarekammer started
    with Software Craftsmanship communities in Germany. The Germany are now organizing
    more than fifteen communities around the world. Many other communities have been
    created around the world since.'
