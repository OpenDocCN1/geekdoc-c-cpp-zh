  md: 'A question that is often asked during our Software Craftsmanship meetings is,"How
    can I convince my team [or manager, company] to adopt TDD [or pair programming,
    continuous integration]" Trying to sell technical practices for what they are
    pointless. It doesn''t work. Don''t focus on the practices themselves when trying
    to convince managers or team members to adopt them. Focus the discussion on the
    benefit they bring and how they compare to the practices they currently have.
    A smaller feedback loop; a better understanding of requirements and cost; knowledge
    sharing; reduction of bugs; and quick and automated releases to production are
    examples of values added by technical practices.


    # # Adding Value Through Practices


    Back to our main topic: does context matters? Is there anything we can do to improve
    the chances of having a successful project? Are there practices we can adopt that
    give us a quick and short feedback loop?


    Let''s look at the practices defined in the inner circles of Figure 7. Are they
    specific? Do we really authorization from managers to adopt them?


    ![](img/37068c1e49085ee56b4227c127638630_52_0.png)


    Source: From www.xprogramming.com/what-is-extreme-programming/; used with permission.


    Figure 7.1 XP Practices.


    Although we will discuss a few XP practices, it is not in the scope of this book
    to cover all. For that, I suggest Kent Beck''s Extreme Programming. Let''s take
    a few practices and explore the values they bring to the business.


    # # Automated Testing


    Automated testing enables us, with a click of the button, to have our entire system
    tested within a few minutes. It gives us confidence to deploy alone into production
    minutes after the last change was made. The amount of time the business can save
    avoiding quality assurance (QA) phases that can be measured in days, not weeks.


    The feedback loop on the correctness of our code is reduced from weeks to minutes,
    enabling us to correct any mistakes almost immediately. This reduction in the
    feedback loop allows us to write more code instead of erroneous code—reducing
    the overall bug-fixing cost.


    As the system grows, tests become longer, so this means more testers. Writing
    tests before writing any production code makes us faster as the system grows.
    This increase in speed is due to our confidence to add features without breaking
    the system. Since the entire test suite normally takes a few minutes to run, it
    can be run as often as needed—reducing the need for lengthy testing phases and
    the number of people involved in them. Automated testing gives us measurable business
    value.'
