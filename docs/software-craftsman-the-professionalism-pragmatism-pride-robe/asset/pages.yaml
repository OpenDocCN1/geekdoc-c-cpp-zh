    # Four Rules of Simple Design


    Before thinking about architecture, design patterns, generic solutions, or anything
    else, as a rule, a software craftsman always try to write code that satisfies
    the "Four Rules of Simple Design," as defined by Kent Beck:


    +   1. Pass all tests

    2. Clear, expressive, and concise

    3. Duplicates no behavior or configuration

    4. Minimal methods, classes, and modules


    Over the years, many people rewarded these four rules (or elements). I personally
    prefer J. B. Rainsberger''s version:


    +   1. Minimizes duplication

    2. Maximizes clarity

    3. Few elements


    There is a lot of debate about the right (in terms of importance) of these elements.
    As J. B. Rainsberger defines it, if we assume craftsmen use practice TDD, rule
    number one is stating the obvious, it can be ignored if we strive to minimize
    duplication (rule two), we would have fewer elements, the fourth rule becomes
    irrelevant. With that in mind, we end up with two rules:


    +   1. Minimization


    I would favor clarity over simplicity, as a guideline, in order to achieve a simple
    design, I first focus on good and nice abstractions that represent concepts. Then
    I focus on removing duplications, which usually leads to a messy and coupled code.
    When removing duplications, new structures emerge, forces me to maximize clarity,
    and then remove duplications. I stay in this cycle, working in very short iterations,
    until I''m done. This cycle was first described by Rainsberger as well.


    Combined with the knowledge of Domain-Driven Design and the SOLID principles,
    this approach is normally enough to achieve well-crafted code without following
    the rules of design and architecture.


