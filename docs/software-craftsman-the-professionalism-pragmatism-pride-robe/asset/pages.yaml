    people who could help them. They started hiding their honest opinion in order
    to do what they wanted. And while they were doing strong things a particular company,
    which was still evolving, their skills got rusty or totally obsolete. Of those,
    people—who have now become managers and directors—realized they were now stuck
    in that company, with a high salary but no soul. They paid for the country not
    to go through another recession; otherwise, what would they do if they lost their
    jobs?


    On top of that, companies that encourage this type of behavior are with a bureaucratic
    and incompetent layer of managers, unqualified to understand the intricacies of
    the job by the more qualified people below them. This is called the "Peter Principle,"
    and its effect could be "employees to be given more authority until they cannot
    cope competently." In other words, they make mistakes, misapplications of credit,
    hiding their experience by blaming others, and unprofessional and dishonest attitudes.
    People promoted to positions for which they are totally incompetent


    People whose are obsolete worry about finding another job where they can keep
    their careers and personal life stable, at a high salary. For them, a career in
    a company is only viable if it is aligned with their own career aspirations. Software
    craftsmen know that their careers are long roads, the journey is far more important
    than reaching the end of the line.


    # Summary


    Delivering value to clients is the obligation of any professional who is paid
    to do a job. But there is more to a job than that. Work doesn''t need to be the
    antonym of pleasure—we just need to know what to look for when choosing a job
    autonomy, mastery, and purpose. These are the three that a craftsman should look
    for in each. Although it''s not always easy to find jobs that can provide us that,
    they exist. We are just not ready to get these jobs yet.


    The better we are, the easier it is to find jobs that give us pleasure. But to
    reach a point where we can change the jobs we want we need a lot of effort to
    develop our careers. We need to understand where we want to be and work hard to
    get there. A successful career doesn''t come for free. We need to craft it. Our
    own careers should always take precedence over a career inside a company. It''s
    great when a career inside a company is aligned with our own aspirations but it
    is often a mistake to let a company control our careers. Jobs are an investment.
    Carefully choosing our jobs and satisfying all clients is the best way to construct
    a very successful and pleasant career as a software craftsman.'
