  md: '# The Invisible Threat


    Starting a new project, everything is great. With a nonexistent base code, developers
    can quickly start creating new features without the fear of breaking or changing
    any existing code. Testers are happy because everything they need to test is new,
    they don''t need to worry about regression tests. Managers can see new features
    delivered at a fast rate. However, the team is composed of average developers,
    selected by matching a set of keywords against their CVs, and it is structured
    and treated like fine. As time goes by, bugs start to appear (with no apparent
    explanation), and features start taking longer and longer to be developed. Slowly,
    the quality of the code starts to trend. But this is a slow process. It takes
    months, sometimes over a year or two, to be noticed by management.


    It''s very common to see projects where, at the beginning, a feature of size X
    number of days to is built. Improved over time, more bad code is added to addition,
    another feature roughly the same size X, will take longer to be implemented than
    it used to take at the beginning of the project. As the quality of the code decreases,
    the amount of time to implement a new feature, fix a bug, or make a change increases
    (see Figure 6). The lower the quality, the higher the number of bugs, and the
    harder it is to test. The lower the quality, the less robust and reliable the
    application becomes.


    ![](img/37068c1e49085ee56b4227c127638630_45_0.png)


    Figure 6.1 The relationship between code quality and time spent implementing each
    feature over time


    Interestingly, some people say that they don''t have time to do properly, but
    they claim that they always find a way to justify the amount of time and money
    spent on long testing and bug-fixing phases. "This is how software projects are,"
    they say. "First there is a construction phase, then there is the testing and
    stabilization phases. Every software project is like that, isn''t it?


    # Hostage of Your Own Success


    When the base code gets into the situation where changes or additional features
    take too long to be implemented and developers are scared to touch the existing
    code, action must be taken. This is a very dangerous situation to be in because
    progress is impeded or delayed by software instead of being helped by it.


    In order to increase agility and have a good return on investment, keeping code
    quality high is


    The cost of dealing with bad code can make companies less competitive—the cost
    of implementing new features or making the desired changes can be prohibitive.
    It is totally unacceptable to have bad code quality affecting business decisions.


    The biggest problem with bad code is invisible to everyone except the developers.
    Members of the team only realize something is wrong when it''s too late. It''s
    the developers'' responsibility to look after the quality of the code. Sometimes
    developers experience problem to project managers, but the request to have some
    time to refactor the code is often ignored for various reasons including their
    lack of understanding of impacts of bad code, and the developers'' inability to
    explain it. It is worth noting that when developers get to a point where they
    need to ask for some time to do refactoring for one reason or another, they neglected
    the code at some point in the past.


    # Hire Craftsmen, Not Average Developers


    With the amount of literature, tools, methodologies, and the infinite amount of
    information available on the web, it is unacceptable to have a team of developers
    who can let the code rot. Craftsmen are gardeners. they constantly looking after
    the code, quickly refactoring without fear—they are backed by a good of automated
    tests that can test the code and provide a fast feedback. The contracts or change
    in requirements will never be an excuse for bad code because they would have used
    good principles and techniques to ensure the application life span. An empowered
    team of craftsmen can be the difference between success and failure of any software
