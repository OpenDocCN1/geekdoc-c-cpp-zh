    would fall in this category. Reading them is much harder than learning a specific
    skill, and it may take many years to get comfortable with them. However, conceptual
    books are the books that give us the foundation to learn specific technologies
    much quicker.

    - Behavioral books are the books that make us more efficient when working in teams
    and better professionals in general. They help us learn how to deal with people,
    clients, team members, and others. Knowing programming languages, frameworks,
    and practices is not enough if we want to be good professionals. We also need
    to learn how to deal with everything that is not related to code but is part of
    a software project or organizational context. Books in this category will cover
    the more human and professional side of software development, including topics
    like Software Craftsmanship, Lean software development, philosophy, and management.

    - Revolutionary books (some call them classics) are the ones that change the way
    we work or even some of'
