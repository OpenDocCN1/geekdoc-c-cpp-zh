- pgno: 30
  md: '# 4. The Software Craftsmanship Attitude


    If we think that this piece of code we wrote in the past is still good today,
    it means we didn''t learn anything since.


    For some craftsmen, caring about anding the work of what we do is a given. Constantly
    finding ways to become better professionals is a lifetime commitment. Satisfying
    and helping our customers to achieve what they want to, in the most efficient
    way, is our main goal. Sharing our knowledge with less-experienced software craftsmen
    is our obligation.


    A few years ago, I was speaking to a colleague of mine. We joined the company
    at the same time, hired at the same position, and worked on a project for almost
    one year. When we were working for a consultancy some time we spent separate ways
    to work on different projects and for different clients. It was only a few years
    that we had the opportunity to work again. He asked me a few how things were going
    with him and said, "I don''t like this company. This company sucks" I was surprised
    by what he said since I had been enjoying my time in that company. Then he asked
    me "Who owns your career?" I said "You. They never gave me a book, a training
    course to learn new technologies. They never gave me a promotion, he said, "I
    haven''t learned anything for a long time since," he complained."


    I was not quite sure to talk or say about his concerns. I had two promotions during
    that period, worked on a few good projects, and learned many new things. I suddenly
    asked him a few seconds of silence, he didn''t understand my question and asked
    me to repeat it. "Who is in charge of your career and your professional future"
    he asked again. After a few years we had this conversation, I remembered the puzzle
    in his eyes.


    In this chapter I discuss how we can care about our careers, keep ourselves up
    to date, practice, and discover the things we didn''t know. I also talk about
    how to create for all these things.


    # Whose Own Your Career?


    What if the career for work does not use any books? If the company never uses
    us to any training or courses? Would that be how we could learn anything new?
    Does it really mean the company is bad?


    Imagine that you need a plumber to work in your house. If you need a lawyer to
    solve any legal issues, or a doctor or a dentist when you have an aching tooth.
    Normally you go to these professionals when you have a problem, so imagine them
    turning back to you and saying, "Could you make a book? Can you send me on a training
    course?" What would you think about that? To make things even, imagine that you,
    for some reasonable reason, decide to buy a book or send them on a service, and
    they acquire the knowledge you gave, they come back and charge you for their services.
    How does it sound to you?


    These professionals need to invest in their own careers so they can do a good
    job, satisfy their customers, and hopefully refer other clients. They are responsible
    for themselves in the current market. Those that don''t end up losing clients,
    receive fewer referrals, and will will slowly be forced out of their business.


    On the other hand, factories work, for example, in factories. Factories need to
    train their employees to use new machines and skills. Factory workers have no
    say in what the factory should do, and they just do what they are told to do.


    Clients pay with the expectation and experience of receiving a good service. They
    pay to professionals to solve the problems in the best way possible. Clients don''t
    pay for their learning. Clients pay for their knowledge and skills. Professionals
    are expected to provide solutions, viable alternatives, and ideas to their clients.
    Professionals are expected to help their clients de-risk and achieve whatever
    they want to achieve in the best possible way, and that is how the trust will
    be built.


    We have all wanted to respect and respect professionals before we achieve what
    we need to start behaving like professionals. That means that we use our own time
    and get money to get better at what we do. We should show our own careers and
    what we learn and what we are not. We should be in a position that we can help
    clients and employees to achieve their goals. Those who only rely on their companies
    to provide knowledge are not professional software developers. They are just craftsmen
    in disguise


    > "Companies should not be investing in their own people" You may be asking. No,
    that is not what I mean. Companies should invest in people but software professionals
    do not see that as their obligation. That should be as a bonus, a win-win situation.
    Companies that provide time to get better at what they do are much better and
    can become far more efficient. Passionate developers will always favor these companies
    when choosing who to work for.


    Our industry moves, faster than any other industry. Languages, frameworks, practices,
    and processes are constantly evolving. Keeping up to date and constantly getting
    better at what you do is key for a career as a we'
