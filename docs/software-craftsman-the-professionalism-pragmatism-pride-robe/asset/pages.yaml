    Keeping your professional life is essential for a healthy life. An unhealthy professional
    life, where we are constantly worried about not being paid well, or that we might
    not find another well-paid and interesting job if we are made redundant in the
    market, puts us in a good position to not worry much about our professional lives
    and gives our family and friends the attention they deserve. At the top of our
    game, with good connections and skills that are in demand market,


    # Summary


    Owning our careers is hard. We need to put a lot of effort into getting to a position
    where we can say "I feel confident I find a well-paid job whenever I want." Determination
    and passion are essential for a successful career as a software craftsman. However,
    without, how much of our efforts are wasted. We need to learn how to keep ourselves
    to date and how to practice. We need to learn how to use our time. The day we
    stop learning and practicing is we lose control of our careers. The more knowledge
    and skills we have, the easier it is to use our careers—that means we are able
