- pgno: 27
  md: 'The main problem you have when working with applications that is fear. No,
    I''m not calling you a coward. I''m just stating that you are a responsible developer
    who understands the implications of making the wrong change in a code that you
    are scared to change parts of this code because you do not understand how it works,
    and you have no confidence will not break something.


    This application is working software, but is it good enough? Well-crafted software,
    regardless of how old the developer, can understand it. The side effects are well
    known and controlled. It has high and reliable clear and simple design, and business
    language expressed in the code. Adding or changing features does not take longer
    than it used to take at the beginning of the project, when the code base was.


    In order to evolve developers, must not shy away from changing. Using Test-Driven
    Development, simple design, and using the business language in code are the best
    ways to keep healthy and well-crafted code.


    # Not Responding to Change, Also Steadily Adding Value


    Have you ever thought how software projects work? Think about all the developers
