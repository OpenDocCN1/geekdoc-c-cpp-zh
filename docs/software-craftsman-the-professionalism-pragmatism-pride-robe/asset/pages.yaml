  md: 'Encourage simplicity. Your idea or proposal must be simple and clear. Organize
    your thoughts before proposing anything. It is very easy for people to understand;
    use examples whenever possible. The ability to communicate is key if you want
    to have your ideas accepted.


    **Speak the language.** Depending on changes you are proposing, you may need to
    speak to developers, managers, architects, sponsors, product owners, business
    analysts, or any other person who can be affected by them. Learn how to speak
    their language. Don''t talk about details of your code or frameworks with managers
    and product owners; tell them about the benefits that your proposal has for the
    project: reducing maintenance costs, more reliable and frequent releases, and
    so on.


    **Do your homework.** Make sure what you are talking about is accepted. Research,
    and practice. Think about what skeptics will ask and make sure you have an answer
    before you speak to them. If your proposal has any drawbacks, mention them before
    anyone else. If there are areas where you don''t know enough to be clear about
    them, clear out the drawbacks that you have thought about the problem and increases
    your credibility.


    **Be respectful.** Don''t be disrespectful if you were stupid. Disrespect and
    aggression will immediately put people into a defensive mode, making the task
    of convincing almost impossible.


    **Learn to listen.** When you have a very good idea of how things should be done,
    make no mistake, you are not the only one with it. Everyone has an opinion and
    sees the same problems from different angles. Perhaps, by many things you are
    not even aware of. Listen and digest what everyone has to say before you make
    any judgment.


    # # Where Do We Start?


    After a short period of time in a new project or organization, ideas starting
    popping in heads like popcorn in a microwave. And we start identifying all the
    different types of skeptics we face, it is hard to imagine how difficult it will
    be to push our ideas forward. So where do we start?


    # # Establish Trust


    We can''t change anything if people don''t trust us. The best way to build trust
    (with developers, delivery managers, or clients) is consistently delivering quality
    software. The trick here is to understand what quality software means. For others,
    the team may mean that we''ve written meaningful and readable tests, that there
    are no duplications—that is, if the code is easy to maintain. For others it means
    software that satisfies all their requirements, has no bugs, and was delivered
    on time. It can mean quality software that is in production, saving them money,
    or protecting their revenue.


    Although essential, consistently delivering quality software is not enough to
    build trust. If you don''t change anything, people won''t trust you. You need
    to expose yourself. You need to be visible. You need to demonstrate how passionate
    you are and how much you care about the project and what you are proposing. People
    are far more inclined to follow someone who is passionate about something than
    someone who doesn''t exhibit any passion.


    But showing your passion is not enough. Above all, to establish trust, you need
    to be good. People need to feel what you can do. They need to feel you lead them.


    # # Gain Experience


    When gaining experience, we tell all teams (including managers, product owners,
    etc.) that the future will be much better place if we do the things we are proposing.
    While those things—adopting a new technology, changing the design of an application,
    costing process or adopting TDD—will have an initial cost. Skeptics will immediately
    say that it is, it will cost too much, or it will take too much time.


    Before proposing a new thing, make sure you really understand it. Play with it,
    build something with it, talk to experts, and compare it to other methods. Make
    sure you can do what you need to do with it, and above all, that you can teach
    others. There are people out there who want to use their time to become an expert
    in a new technology or to master a new practice. Others are people who don''t
    want to learn them. You can speed up their learning curve by getting the learning
    curve yourself and teaching them.


    In gaining experience, you can inform the Uninformed; the Herd will join you,
    then show them what you know about talking about; the Cynic can be disarmed if
    you answer questions with confidence and demonstrate a deeper knowledge. The more
    knowledge you have, the better it will be for you to understand what happened
    with the Burned. With this understanding you can identify where the energy lies
    and additions matters. Gaining expertise gives you more ammunition to engage in
    discussions with the Ivory-Tower Architect and the Fanboy. And if it fails, you
    will have more knowledge than you had before, which makes you a better professional.
    For a software craftsman, this is a win-win situation.


    # # Lead by Example'
