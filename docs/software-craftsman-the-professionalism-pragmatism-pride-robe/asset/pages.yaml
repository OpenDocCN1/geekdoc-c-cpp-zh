    to have lasted debates for extended periods of time.


    # Be Prepared


    There are a few things you must have if you want to change things. The most important
    one is courage. You are not afraid to engage in debates with managers, technical
    leaders, and fellow developers; certain discussions are unavoidable and you need
    to be prepared for them. You must be brave and say everything you think, no what
    matter. Honesty and transparency are core values for software craftsman. You also
