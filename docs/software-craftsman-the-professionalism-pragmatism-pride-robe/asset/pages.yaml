  md: '# 3. Software Craftsmanship


    Before we discuss Software Craftsmanship is, let''s describe what it is **not**:


    +   - Beautiful code

    * Test-Driven Development

    * Self-selected group of people

    * Specific technologies or methodologies

    * Certifications

    * Religion


    So, what Software Craftsmanship sees then? This chapter presents a few definitions
    and discusses its origins and history. This chapter also covers the Software Craftsmanship
    Manifesto, with an in-depth explanation of what it really means.


    # A Better Metaphor


    In a very simple way, we can say that Software Craftsmanship is a better metaphor
    for software development than software engineering. Software Craftsmanship sees
    software as craft and compares software developers to medieval blacksmiths. Apprentices
    would work with more experienced blacksmiths, traveling from place to place and
    working for different masters, learning different tools and techniques, and improving
    their craft until the point they were good enough to become a master themselves.
    There is more to it, but bear with me for now.


    # What Does Wikipedia Say?


    [Software Craftsmanship] "is an approach to software development that emphasizes
    the coding skills of the software developers. It is a response by software developers
    to the mainstream software industry, including the prioritization of financial
    concerns over developer agility."


    I personally do not like this definition. It''s very dry and I don''t think it
    captures the essence of what being a software craftsman means to a software developer.


    # A More Personal Definition


    Software Craftsmanship is a long journey to mastery. It is a mindset where software
    developers choose to be responsible for their own craft, constantly learning new
    tools and techniques and constantly better themselves. Software Craftsmanship
    is all about putting responsibility, professionalism, formalism, and pride back
    into software development.


    # A Shorter Definition


    Software Craftsmanship is perhaps the most important thing about Software Craftsmanship.
    If you only remember one thing after reading this book, you remember this statement.


    # Beyond Definitions


    I prefer to think of Software Craftsmanship as an ideology or a mindset. It is
    something that many want to express and give a name to all the things I always
    believed. Many developers, myself, may say they are the majority of the things
    that Software Craftsmanship talks about: caring about what they do; trying to
    better themselves; being professional; delight customers by helping them achieve
    whatever they want to; learning from developers what they knew; mentoring less-experienced
    colleagues.


    If you have valued the things above that is great, then you are a software craftsman,
    even if you do not like to refer to yourself as such. Many people de meet not
    really likes or do not even with the Software Craftsmanship profession. That is
    totally fine. The important things are the things we should care about as software
    professionals.


    # Craft, Trade, Engineering, Science, or Art


    When I first got with the Software Craftsmanship movement, I remember having many
    discussions about what software development was. I originally liked to describe
