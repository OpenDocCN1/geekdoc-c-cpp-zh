    > That''s a short feedback loop.


    # Refactoring


    The Boy Scout rules: "Always leave the campground cleaner than you found." This
    is a value that software craftsmen must make when it comes to code


    Developers are inclined to make improvements to code that they find difficult
    to understand. Because of the fear of breaking the code, developers start introducing
    small hacks and debug. The bigger the mess, the bigger it is, which we know. This
    is known as the "broken windows theory." Messy applications go slowly, which causes
    the business to slow down.


    Constantly refactoring our code mitigates this risk. Developers will constantly
    refactor the code they touch. If this practice is accepted and handled from the
    beginning of the project, developers will never spend too much time refactoring
    because the code will be in a good state


    However, when working with legacy applications, developers need to be cautious
    not to incur risk of rewriting the entire system in one go. In this case, focusing
    on refactoring the code being a better approach.


    Refactoring without programming is a dangerous practice. Professional means to
    understand trade-offs. Although we want to make the whole system better, we might
    not need to. There is no point in refactoring a piece of code that hasn''t changed
    in years. If we don''t need to change it, changes are not to refactoring. Start
    refactoring when changes more often. The Boy Scout rule should be applied when
    we need to make a change or understand one of the code, not everywhere.


    A clean and maintainable code enables developers to go fast and reduces the chances
    of new bugs. That''s the value to the business.


    # Accountability


    Many people are stuck without some of these practices, when we describe the value
    they think. And I hear them. Here they say, "These are just practices and many
    of them are not needed. We can easily develop good software without"


    Although this may be true, it is also a very vague argument. A quick search for
    "software projects that fail" will give us reports and statistics about projects
    that one way or another, have failed. The percent of fail range from 30 to 70
    percent depending on others.


    When someone—whether a developer, a project manager, or from the business—he or
    she does not want to adopt or some of these practices, we should listen. There
    is no reason to react back or immediately think that person doesn''t know anything.
    We should learn from the interaction. After explaining the value of the practices
    described in the previous section, we should ask: "What do you do (or should we
    do) that gives us the same or more value than that? What do you do that is better
    than"


    We are all accountable for decisions, but only for the decisions of adopting certain
    practices, but also for the decisions of not adopting them. This is not just about
    developers. Managers should also be accountable for all teams to adopt certain
    practices. We should record these decisions and escalate it if necessary.


    # Pragmatism


    Technologies, methodologies, and practices are constantly emerging and evolving.
    While we described a set of practices in this chapter, that doesn''t mean they
    are the only practices out there or they are suitable in every single context.
    Those that are considered good today may not be considered'
