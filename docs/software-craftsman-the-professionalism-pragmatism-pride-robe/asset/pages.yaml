  md: '# pairing-programming session.


    There is a lot we can get from a pairing-programming interview:


    +   - How quickly the developer decides on tests to write—that shows experience

    - How familiar is she with the tools (the integrated development environment [IDE]),
    language, testing and mocking frameworks, use of shortcuts, etc.)

    - Choice of names for classes, methods, and attributes

    - How clean and expressive the code is

    - How the developer reacts when the other makes suggestions or comments

    - Her thought process

    - Her care in not solving the problem but also how she is solving the problem


    However, pairing-programming interviews can be very tricky and choosing a good
    problem to work on can be quite challenging.


    A common approach is to choose one of the katas publicly available or to create
    our own. Katas are great when we want to use TDD and general clean-code principles.


    Another approach is to take an existing code from our own base, especially one
    that is badly written and without tests, and ask the candidate to write it and
    make it better. It is valuable for projects with loads of legacy skills the candidate
    would show if using it.


    It is important to have realistic expectations when conducting pairing-programming
    interviews. We need to remember that, as interviewers, we know more domain than
    the candidate doesn''t. We shouldn''t expect the candidates to get certain solutions
    or strategies away. We know something, forget how much time we spend learning
    it.


    If we use tools (Computer, IDE, and mocking frameworks), we need to bear in mind
    that the candidate may not be familiar with them. This is not a bad thing. Every
    mainstream language has many testing frameworks and is supported by many different
    IDEs and editors. It can cause candidates getting stuck when they don''t know
    the expected action or IDE provided during the interview. Pay attention to how
    the candidate reacts to that and offer some help. Since this is a pairing-programming
    exercise, the interviewer should show what the candidate can do in the right direction.


    Whatever we do as an interviewer, we should not leave the struggle too long. We
    should wait for maximum of three or four minutes, and then ask for suggestions.
    The candidate is already under pressure, and making them struggle for too long
    will just make things worse. As we can keep track of the points where the candidate
    struggled, we should discuss them at the end.


    Pairing programming means pair programming and not overstepping someone''s boundaries
    and applying unnecessary pressure. That''s not how we usually work with our colleagues
    and there is no point to behave this way with a candidate.


    Once I interviewed a very experienced guy. On my machine he had Eclipse, JUnit,
    and Mockito (a Java mocking framework). He told me he was more familiar with IntelliJ
    and Mock. I never used Mockito, so I''m at least learning it myself.


    He quickly became frustrated because he didn''t know the Eclipse shortcuts. "I''m
    really stupid using the mouse so often," he said to me. "What''s the shortcut
    for running?" I answered and he took notes on a piece of paper. He then asked
    me about other shortcuts and not to how many of them. Fifteen minutes later, on
    a piece of paper, on some of the basic shortcuts and started to feel more comfortable.


    He also struggled with Mockito. "If you tell me what you want to do, I can type
    it for you," he said. "I want to make this class work every time the public method
    is invoked." I then wrote the code according to what he wanted to do. By the end
    of the interview, he was using Eclipse and Mockito quite well.


    The only thing I regret about that interview is that we were not fast enough to
    get back home and he got a job somewhere else.


    The best thing about this interview was that the candidate took the time to learn
    the Eclipse shortcuts and a new testing framework. We could help learn Mockito.
    He showed me when he was irritated because he didn''t know the shortcuts. He showed
    me how he could learn new frameworks quickly-Mockito in this. He was humble in
    asking questions, showing me that we could easily work together as a team. We
    had a few debates, but even when we disagreed, I could see that he had thought
    about the things he was saying. And, besides all that, his code was quite clean.


