    and whoever is behind it should be fired."


    The identity and culture of an organization are defined by its people and by itself
    the chief executive officer (CEO). Delegating recruitment to HR, recruitment agencies
    or vendors means degrading the identity and culture of your organization to companies
    that do not understand or care about it.


    # Too Busy to Interview


    The main mistake many interviewers make is to say that they are too busy to interview:
    "We can''t spend too much interviewing people. We have to do work."


    We spend more time with our colleagues than we spend with ours—which makes it
    even more important that we trust and have relationships with them. It is true
    that if you cannot afford time to interview, you can''t be realistic about building
    a great team.


    Because the majority of business relies heavily on software, developers play a
    big part in the success or failure of a business. Developers are the ones who
    maintain the machine that the business uses to stay.


    Since hiring good developers is key, the quality of the interviewers is extremely
    important. Candidates are always judging from a biased perspective: they will
    be considered good or bad according to the interviewer''s views, values, and technical
    abilities. People who do not listen and believe in hierarchies will not hire anyone
    like themselves or even at their level. On the other hand, people who are always
    eager to do things in a better way are always looking for people who are better
    than or as good as they are.


    Although we need to allocate time to interview, the whole recruitment process—from
    collecting and filtering CVs to actually hiring someone—can take weeks or months.
    If it takes too long, we wasted a lot of time looking at all-the-other CVs and
    interviewing many unsuitable candidates.

    Time-consuming activities or delaying a formal recruitment process is not the
    solution. The wasted interviewing wrong candidates to find four or five is not
    viable, and delaying the recruitment activity is too risky; the only alternative
    is to be more specific with your filtering criteria.


    # No Job Descriptions


    Job descriptions are anti-patterns. Lod Adler has a series of articles on the
    topic at the website tlint.com. He says that traditional skills and experience-based
    job descriptions are "anti-talent and anti-diversity, aside from being terrible
    predictions of future success.


    Here are some:


    +   * Absolute numbers: they are arbitrary, misleading, and capricious. Defining
    that candidates have five or more years of experience in Japan or a university
    degree does not make sense. Having five years of experience is different from
    having five times one of experience. Many developers who have worked with the
    same technology for a long time might not learned anything after they were hired.
    A good university degree doesn''t mean anything because the students are not ready
    to be professional software developer when they graduate. It is what developers
    do at work and in their spare time,'
