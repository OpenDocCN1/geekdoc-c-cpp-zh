    should engage in conversations with the business, practices and be part of the
    solution. Then, what you should be said, and say it in any situation. But there
    is far more than we can do.


    I was once on a project where the business and the IT department were being pressured
    by auditors to create a solution to assess the risk associated with their operational
    features. It was a big program, where systems were being integrated with many
    legacy systems.


    The problem was, at a macro level, never knew what the goals were. At the detail
    level, the things were very fuzzy and complicated. The challenge was not related
    to the natural complexity of the requirements or systems involved, it was also
    related to how the organization was structured. Refining requirements was not
    just about writing clear acceptance criteria for user stories. Discussions could
