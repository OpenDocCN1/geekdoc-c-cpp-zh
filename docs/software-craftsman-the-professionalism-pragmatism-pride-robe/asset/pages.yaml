  md: 'awesome and it was a pleasure to work with many talented guys.


    Today, I know what we did wrong. It hurts me to remember how we were treated.
    It frustrates me to know that this situation is very common, in countries that
    offshore work. We didn''t act professionally— why we were doing things or what
    the real problem was. We tried to provide an alternative. We allowed ourselves
