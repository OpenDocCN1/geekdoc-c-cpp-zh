    be our allies in achieving?


    If we use Test-Driven Development (TDD), code refactoring, pair programming, and
    Agile methodologies, they should all be part of our process. If we need to improve
    the design of our applications, we should test and hire someone who has design
    skills. If we feel that team needs an injection of passion, we need her him passionate.


    Don''t waste interview time talking about things that are not relevant. What is
