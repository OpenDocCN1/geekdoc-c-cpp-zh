- pgno: 24
  md: 'craft. Many people I know, people who I really respect, do not agree with this
    at all. For some, it is a trade. For others, it is engineering. Very few would
    say software development is a science.


    Every developer has many arguments why software development should be viewed as
    art, craft, trade, or science. When listening to all the reasons why software
    development is one thing or the other, the reasons makes sense—some more than
    others, but they all make sense.


    Another big debate about Software Craftsmanship is the name itself. Some people
    hate it. They cannot see the point of comparing the most innovative and fast-crafting
    industry to something that goes back to medieval times. And others may have a
    point.


    Over the years, I joined some of these debates and spent a lot of energy trying
    to convince people why Software Craftsmanship is a good method and why development
    is craft. As I was getting involved with it, suddenly realized that it didn''t
    really matter. This is far the most important thing we were discussing. I personally
    like the metaphor and treat software development as craft, but what I really import
    and care about are the values of Software Craftsmanship.


    At the end of the day, what we all care about is the bar of profession and helping
    others, including ourselves, to professional developers and not just unskilled
    workers who are told to do.


    # Software Craftsmanship History


    Although Jack W. Reeves suggested that software development is more than an engineering
    in 1992, I believe Software Craftsmanship really begins with the Thematic Programmer:
    From Jouryman to Master by Andy Hunt and Thomas Thomas. Peter McConnell published
    Software Craftsmanship: The New Imperative, the book that introduced the majesty
    of ideas that we used to shape the Software Craftsmanship movement years later.


    In 2002, Ken Auer hosted a Software Craftsmanship Summit in North Carolina, and
    invited; many others, Peter McConnell, Ron Jeffries, and Robert Martin (Uncle).
    At the time, Auer was already hosting apprentices. The conclusions of the summit
    were a call to form a community around software apprenticeships, though didn''t
    get much traction. But it did create the attitude at Object Method, the company
    founded by Uncle. From on, Object started mentoring on apprentices. There was
    no formality or process around it, but several developers did go through an apprenticeship.


    In the autumn of 2006, Michael Martin and Paul Page called it a Software Craftsmanship
    company from the start, aiming to help apprenticeships and cultivate disciplined
    talent. Eight Light published software craftspersmen, not developers, and their
    actions did not occur.


    Around that time Eight Light was craft. Dave Hoover took a position at Objectiv
    (created by Groupon in August 2001). After Eight Light began their apprenticeship
    program, offering apprenticeships as well. So began a friendly rivalry.


    Although there were many in Chicago Software Craftsmanship, nothing really happened
    in the field between 2008-2011 (when Peter McConnell''s book came out in 2008).
    Agile was the new thing, with agile methodologies, and techniques shaping the
    foundations of the software development industry. Back then, there was no real
    need for Software Craftsmanship because many people believed that the biggest
    problems in our industry could be addressed by one of the Agile methodologies
    and practices now.


    In August 2008, during his keynote speech at the Agile 2008 conference, Uncle
    published a fifth value for the Agile Manifesto: "craftsmanship over over." Also
    in August 2008, he published Clean Code: A Handbook of Software Craftsmanship
    and later in May 2021, The Clean Code: Code of Craft for Professionalmers, two
    of the most, if not the most, influential books in the Software Craftsmanship
    circle.


    # The Software Craftsmanship Summit


    In years since the Agile summit, it appeared that things in the Agile world were
    not going well as expected. The dejection from the Agile methodologies like Extreme
    Programming (XP) and the commercialization of the process-oriented methodologies
    like Scrum started to bother some of the original Agile innovators.


    There were lots of tales about Software Craftsmanship in the Agile community,
    which Michael Martin and Paul Page joined to organize the Software Craftsmanship
    Summit in order to better and define it. The main goal was to put a public face
    on Software Craftsmanship. The invitees were all people who had expressed interest,
    to some extent, in Softwaresmanship.


    The summit took place on December 13, 2008, in Libertyville, Illinois, a few kilometers
    from Chicago. The summit lasted for six hours and there were roughly thirty people
    there, including Uncle Bob, Brian Marick, Cory Haines, Dave Hoover, Doug Bradley,
    and David Chelsea.'
