  md: 'Fortunately, not all projects and companies are like that.


    # Constrained by Lack of Motivation


    Every company has every employee, without much effort, easily come up with a big
    list of things they wished were better. But, if employees know what needs to be
    changed and how things could be improved, why don''t they do anything about it?
    Here are the most common reasons, in particular order:


    +   - They don''t feel they are empowered to do it.


    +   - They don''t want to be the pushing it.


    +   - Nah! Too much hassle.


    +   - They don''t believe things could be changed.


    +   - No one agrees on what the best thing is.


    +   - They don''t care. It''s just a job.


    The reason why companies fail when trying to improve the way they work is low
    motivation. There is no way we can change an organization when people are not
    motivated and don''t care about their jobs. Before trying to convince people to
    work in a different way, ask yourself: are they motivated to do a good job? Do
    they really care about improving the way they? Are they constantly trying to get
    better at what they do? Do even believe in or like the company does?


    # Injecting Passion


    Embedding software craftsmen in a team, either hiring them or bringing in external
    craftsmen for a period of time is the most differences between regular development
    and software craftsmen are on a mission. They are on a mission to make things
    better, to deliver value to clients, and to inspire people around them. They are
    not afraid to lead the way and develop. For software, striving to do their best
    is just a natural state of mind.


    There is nothing more annoying for a developer than having a manager or an architect
    dictating what she should do. Instead of just telling others what to do, software
    craftsmen can sit and pair with other developers, sharing their knowledge, experience,
    and passion. Besides getting the work done, they are always keen to be mentors
    to other developers. Software craftsmen are always trying to help the team they
    are doing to do better.


    While working in an environment bank, my job was many other things, to inject
    passion into development teams. There were a few smart developers but not many
    of them were really excited about their jobs. They were coming to the office,
    when they were asked to do, and going home. They were in the middle of an Agile
    transformation, they had loads of bugs in their systems, and they were deploying
    software only once or two times per year, and had very little incentive to develop.


    We done many things over the years we were there, but there is no focus on Agile
    transformation and development. I''ll focus on some simple ones that ended up
    having a very good result.


    One of the first things we hired a few craftsmen to join us. The advantage of
    bringing a few more craftsmen to the team was that we all began to inject passion
    and bringing innovation.


    Were using Scrum and at the end of our daily stand-up meeting, we started asking:Has
    anyone learned anything since our last stand-up? In the first week developer would
    answer and then say something we read in a book or log post, some we tried the
    right and some we wrote code we had. As weeks went by, more and more developers
    became to learn more and share in our daily stand-ups. We started sharing blog
    posts, videos, and books. All of us, more and more talked about software, technologies,
    best practices, practices, and possible solutions to our problems. We met the
    new craftsmen during lunch breaks, and we asked them about what they wanted to
    be part of.


    I bought a copy of Seven Languages in Weeks by Bruce A. Tale then started going
    through the first language (Ruby) and it ran a few times during our stand-up,
    coffee breaks, and pairing sessions. At two points in the developers asked if
    they could join me when I was ready to start the second (Prolog). We then agreed
    that we would meet every Wednesday at 12pm and spend our lunch there. After each
    session, we were excited and wanted to talk about it. More and more developers
    got interested and at one point we had 12 developers to join the sessions and
    some of them even completely.


    Things like that completely changed our environment. Developers were all far more
    inclined to pair-program and try new things. New innovations were brought to our
    department, many technical problems were fixed, the number of bugs reduced dramatically,
    everyone embraced TDD, and we started deploying to production more often. The
    general mood was so great that even project owners, managers, and production services
    were notified. They were happy to work with the developers as well.'
