- pgno: 110
  md: '# # Narrow Focus


    Another big misunderstanding is to think that Software Craftsmanship is TDD and
    "beautiful" code. Some very uninformed people, mainly from the Agile community,
    have made comments that software craftsmen are shortsighted and have a very narrow
    focus. I hope that this book helps explain that Software Craftsmanship goes beyond
    TDD and well-crafted code.


    Lean, Agile, and Craftsmanship are totally aligned and have similar values. They
    all focus on providing value to clients through transparency and short feedback
    loops. The major difference is that their practices and principles are best applied
    in different spheres of an organization.


    # # Craftsmanship versus XP


    Craftsmanship is an ideology, XP is a methodology. An ideology is about values,
    attitude, and behavior. A methodology is about practices that solve specific problems.


    XP is also based on values (simplicity, communication, feedback, respect, and
    courage), but it is more commonly known for its practices


    Craftsmanship focuses on, a professional attitude is totally related to the practices
    we use, and currently, the majority of these practices are XP practices.


    # # Attachment to Practices


    Software craftsmen are not attached to practices. They are attached to the practices
    that give them. For the vast majority of projects, XP practices have proven to
    be the practices that provide value to clients and development, and that is the
    reason why Craftsmanship advocates them.


    Our industry is in constant evolution and we are always trying to uncover and
    more efficient ways to deliver software. Practices are chosen according to the
    value they bring, whenever we find practices that could give us more than the
    XP practices, we are not happy to adapt them.


    # # Agile Coaches and Managers


    While writing this, I noticed that it was quite tough, unaring on, Agile coaches
    and managers. As a technical author, when expressing an opinion about a specific
    subject, it is not easy to put down into words all the implied knowledge and personal
    experiences we have which serve as a context for that opinion.


    I had the pleasure of working with great Agile coaches and managers. Their professionalism,
    knowledge, and ability to deal with tough situations (business or people-related),
    were so near. Unfortunately, I worked with many Agile coaches and managers who
    were useless, or at best, not very good at their jobs.


    Due to their positions, power, and influence, their decisions can damage not projects,
    but also an entire organization. Working under them while being advised by bad
    Agile coaches destroy the motivation of a team, causing a lot of frustration,
    and even make the best leave the team.


    In many parts of the book, when referring to Agile coaches and managers, I was
    thinking about all the bad ones I worked with, and not the good ones.


    Agile coaches and managers are very important in some organizations, and I have
    a lot of respect for great professionals, regardless of what kind of work they
    need to do.


    # # Software Apprenticeships


    Some people ask me why I didn''t write about software apprentices. For a Software
    Craftsmanship book, this is a fair question. When I started this book, it was
    my plan to cover software apprenticeships as well, but there were few reasons
    why I me not decide to. The main reason was that software apprenticeship is a
    huge topic, with many different people and companies doing it in a completely
    different way. Although I have my strong opinions on the subject, having a software
    apprenticeship program at Codars, I felt that the topic would take a big chunk
    of the book and it end up deviating from its core message. However, it is still
    my plan to write about it in the future. Maybe in another book or a series of
    articles.


    # # The Problem of Metaphors


    A metaphor is a figure of speech that describes something by asserting that it
    is, on some point of comparison, the'
