  md: '# Text file streaming


    Python treats content in a document as continuous character streams.

    When a document is opened, the system generates a hidden pointer to indicate the
    position being read at the moment, i.e. point to the first character. The pointer
    will move according to the order in which the program reads the document, until
    it reaches the end of the file.


    | T h i s l i n e o n e . \n T \n n l i n e t h r e e S O F |


    In text files, there are some special characters for controlling the formats of
    printing and display. Usually such characters are not shown in the document editor,
    but they are still stored in the text files. The above example contains two kinds
    of special characters that are commonly used:


    +   - Line Feed (LF) character "\n" is stored at the end of every line;

    - End Of File (EOF) character "EOF" is stored at the end of the text file.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_282_0.png)


    In Python, the read() function is used to read a document until it detects the
    EOF, thus the returned string stores the whole content of the document; while
    the readline() function is used to read a document until it detects a \n or reaches
    the end of the file. Take the following Python program as an example:


    | Line | Code |

    1 | f = open("testfile.txt", "r") |

    2 | line1 = f.readline() #line1 = "This is line one.\\n |

    3 | line2 = f.readline() #line2 = "This is line two.\\n |

    4 | line3 = f.readline() #line3 = "This is line three." |

    5 | line4 = f.readline() #line4 = "" |

    6 | f.close() |'
