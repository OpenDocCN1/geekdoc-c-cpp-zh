    # ANALOGY


    By observing different ways of arranging soft drinks, we can understand the modes
    of operation of various data structures. **Stacks** use the last-in-first-out
    approach. This mode of operation is as if stacking baskets of soft drinks, in
    that the last soft drink added to the stack will be the first one taken out by
    customers.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_184_0.png)


    On the other hand, **queues** use the first-in-first-out approach. This mode of
    operation is similar to how soft drinks are arranged in a convenient store. The
    staff start placing soft drinks from the back of the refrigerator, thus the first
    soft drink placed will be the first one taken out by the customers.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_184_1.png)'
