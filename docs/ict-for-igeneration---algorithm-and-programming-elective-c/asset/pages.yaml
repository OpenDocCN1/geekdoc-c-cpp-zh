  md: "# Global variables\n\nA variable declared outside a sub-program is regarded\
    \ as a global variable. Its scope covers the whole program including all sub-programs.\n\
    \n```\nadj = \"fun\"\n\ndef fill():\n    print(\"Python is \" + adj)\n\nfill()\n\
    print(adj, adj, adj)\n```\n\n![](img/56bdb053bf3793fa85bbbf08ebb74627_127_0.png)\n\
    \nNo matter whether the global variable adj is in the main program or the sub-program,\
    \ the program can read its value. The above program's output is:\n\n```\nPython\
    \ is fun\nfun fun()\n```\n\nIn Python, a variable declared within a sub-program\
    \ is regarded as a local variable by default. To change the value of a global\
    \ variable in the sub-program, we need to use the keyword global in the sub-program\
    \ to represent the global variable.\n\nUsing an undeclared local variable score\n\
    \n```\nscore = 0\ndef add1():\n    score = score + 1\n\nadd1()\nprint(score)\n\
    ```\n\n![](img/56bdb053bf3793fa85bbbf08ebb74627_127_1.png)\n\n![](img/56bdb053bf3793fa85bbbf08ebb74627_127_2.png)\n\
    \nUsing the keyword global to refer to the global variable score\n\n```\nscore\
    \ = 0\ndef add1():\n    global score\n    score = score + 1\n\nadd1()\nprint(score)\n\
