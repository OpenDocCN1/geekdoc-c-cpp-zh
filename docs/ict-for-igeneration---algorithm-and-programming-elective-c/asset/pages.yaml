  md: '# Types of sub-programs


    # Without inputs and outputs


    This type of sub-programs have neither input parameters nor return values. They
    usually execute default code and are mainly for printing some information in the
    shell.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_110_0.png)


    > MISCONCEPTION

    Printing a string is the output of the sub-program.

    Printing a string is the output of the program instead of the return value of
    the sub-program.


    # With inputs but without outputs


    This type of sub-programs have input parameters but no return values. They perform
    operations on parameters, yet do not return the results as return values. Instead,
    they use and display the results in other ways, such as printing the results in
    the shell or directly saving them in variables.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_110_1.png)


    +   [1, 2, 3]


    # Without inputs but without outputs


    This type of sub-programs have return values even though there are no input parameters.
    They can produce return values without relying on parameters. Some of these sub-programs
    directly use variables in the program to perform operations instead of obtaining
    input values in the form of parameters. There are also sub-programs that produce
    return values in the absence of any input values, such as a random number generator.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_110_2.png)'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# With inputs and outputs


    This type of sub-programs have input parameters and return values. They are the
    most common sub-programs. The input values they require are usually passed to
    them in the form of parameters, while the results of operations are returned to
    other parts of the program in the form of return values.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_111_0.png)


    # 4.2 Calling Sub-programs


    In Python, we call a function by writing the function name and the required actual
    parameter. If this function has a return value, a variable can be used to store
    the return value.


    ```

    print("Hello World!")

    Function Actual name parameter

    a = input()

    Variable storing Function the return value name

    ```


    > TIP Actual parameters are also called arguments, which mean the values passed
    to the function.


    # Built-in functions


    Python has many built-in functions, providing users with frequently used functions.
    print(), input(), type(), int(), float() and str() are examples of Python built-in
    functions. The following are some examples of function built-in functions:


    | Built-function | Description | Example | Value of variable y |

    | abs (x) | Return the absolute value of the number x | y = abs(-10) | 10 |

    | | | y = abs(20) | 20 |

    | round (x, y) | Round the number x to y decimal places | y = round(10/3, 2) |
    3.33 |

    | | | y = round(10/3, 5) | 3.33333 |


    Table 4.1 Commonly used内置 built-in functions in Python'
