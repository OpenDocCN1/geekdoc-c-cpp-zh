  md: '# Linear linked list


    A linked list is formed by many nodes. Each node stores its own data and a pointer,
    which stores the address of the next node. Nodes in the linked list are all connected
    by pointers.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_204_0.png)


    When we want to add a new node or delete a node from the linked list, we simply
    need to change the pointers of the nodes.


    # Delete a node


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_204_1.png)


    # Add a node


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_204_2.png)


    # Comparison of linked lists and arrays


    | Linked lists | Arrays |

    | --- | --- |

    | Types of data stored: Different | Same |

    | Data access method: Sequential access | Direct access / Random access |

    | Speed of data access: Low | High |

    | Speed of adding or deleting data: High | Low |


    # Glossary


    +   array | node | 節點

    circular queue | null pointer | 空值指標

    data structure | 數據結構 | pointer | 指標

    dequeue | 隊列 | pop | 彈

    direct access | 直接存取 | push | 推入

    enqueue | queue | 隊列

    First-In-First-Out (FIFO) | 先進先出 | random access | 隨機存取

    Last-In-First-Out (LIFO) | 後進先出 | sequential access | 順序存取

    linked list | 鏈結 | stack | 堆疊'
