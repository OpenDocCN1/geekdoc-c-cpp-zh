  md: '# Simple data types


    After declaring the name of a variable, the name becomes the identifier of the
    variable. Besides, data types define the types of values stored in the variables.
    The computer will assign suitable memory space to each variable based on the type
    of data stored in the variable. Data types also determine the kinds of arithmetical,
    relational or logical operations that can be performed on variables without causing
    errors in the program. The following are four simple data types in Python:


    | Simple data type | Data |

    | Integer (int) | Integers (both positive and negative) |

    | Float (float) | Integers and decimals (both positive and negative) |

    | Boolean (bool) | Must either "True" or "False" |

    | String (str) | A series of characters, which may include any letters, numbers
    and some special symbols |


    Table 1.4 Simple data types of Python


    Unlike most programming languages, Python declares the types of variables by tagging
    values directly during assignments. Python uses "=" as the assignment operator
    to put data into a specified variable, which automatically tags the data type
    of the variable according to that of the piece of data. The following are example
    of assignment and tagging of variables:


    > TIP Python allows a variable to switch between different data types in the process
    (type casting).


    | Pseudocode | Python | Output |

    | mark = 98 | <class ''int''> |

    | | print (type(mark)) | |

    | grade = "A" | <class ''str''> |

    | | print (type(grade)) | |


    Table 1.5 Assignment statements of Python


    > ANALOGY Variables are very similar to algebra that we have learnt in Mathematics.
    Besides, they are like boxes for storing objects in our daily life. A name is
    labelled on each box for identifying the content. Variables can store various
    types of data, such as numbers or text. Different data types will be explained
    in detail later.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_14_0.png)'
