  md: "# The program for selection sort\n\nThe following Python program uses selection\
    \ sort to sort list mark in\ndending order:\n\n```\nfor i in range(0, len(mark)):\n\
    \    max_index = i\n    for j in range(i+1, len(mark)):\n        if mark[j] >\
    \ mark[max_index]:\n            max_index = j\n    temp = mark[i]\n    mark[i]\
    \ = mark[max_index]\n    mark[max_index] = temp\n```\n\n![](img/56bdb053bf3793fa85bbbf08ebb74627_238_0.png)\n\
    \n![](img/56bdb053bf3793fa85bbbf08ebb74627_238_1.png)\n\n![](img/56bdb053bf3793fa85bbbf08ebb74627_238_2.png)\n\
    \n> THINK ABOUT\nHow can we modify the above program so that it uses selection\
    \ sort to sort list\nmark in ascending order instead?\n\n# Efficiency of selection\
    \ sort\n\nSuppose there are N items in the list:\n\n| The length of the unsorted\
