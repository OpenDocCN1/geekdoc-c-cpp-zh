  md: '# Algorithm Design & Basics of Python Programs


    > TIP

    Comments


    Programming is often a long-term development project and possibly a collaboration
    between a lot of people. Therefore, using comments, which means explaining the
    use of part of the code in simple words, is a good and necessary habit. Comments
    do not affect the program operation, because they are ignored by the program compiler.
    The purpose of adding them is to make the program more readable, so that you or
    others can understand the gist quickly when reading the long program.


    Python does not require declaration of the data types of variables and the variables
    can be tagged as different data types at any time. Thus, we can add comments to
    avoid design errors in the future, e.g other programmers change the uses of variables
    and lead to logic errors. In Python, all after the "#" in a line is regarded as
    comments. Thony displays comments in light grey.


    ```

    # All are comments 这是注释

    # This program is to calculate the area of a square

    print("This is to find the area of a square:")

    length = input("Enter a side length for a square:")

    length = float(length) # Change the data type of length to float

    area = length * length # The data type of area is float

    print(area)

    ```


    # Basic Programming Concepts


    # Output statements


    In Python, the print() function prints the input parameter in the brackets to
    the console. The input parameter can be strings, variables or expressions:


    | Input parameter | Purpose | Example | Output |

    | --- | --- | --- | --- |

    | String | Display all characters within the quotation marks | print("Text") |
    Text |

    | Variable | Print the value of the variable | length = 10 print(length) | Text
    |

    | Expression | Print the input parameters sequentially. Different types of data
    or expressions are separated by, "." Whitespaces are added automatically when
    printing | name = "Sam" print("Hi", name) | Hi Sam |


    Table 1.3 Output statements of Python


    > TIP

    1. To add a quotation mark to a string, we can add a backslash (\) before quotation
    mark. This backslash is called an "escape character", meaning that it "escapes
    from" (cancels) its original syntax function.

    2. The print() function is default to adding a line break after printing, meaning
    the content to be printed next will automatically be placed in a new line. If
    we use end = """ at the end of the input parameter in print(), the last string
    to output be changed, and the printed text will be shown in the same line.


    comment 注释 output statement 输出语句 控制台'
