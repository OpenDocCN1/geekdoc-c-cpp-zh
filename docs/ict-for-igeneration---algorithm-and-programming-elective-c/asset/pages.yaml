  md: '# 6.5 Other Quicker Sorting Algorithms


    Apart from the above three sorting algorithms, there are faster alternatives,
    such as merge sort and quick sort.


    # A Merge sort


    Merge sort is a sorting algorithm using the strategies of divide-and-conquer and
    recursion. Its concept is as follows:


    +   1. Divide the whole list into sub-lists, until each sub-list has only one
    item left.


    > GOTO

    Recursion is discussed in section 4.5 in Elective C.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_266_0.png)


    +   2. Merge two sorted sub-lists into a sorted list, until the whole list has
    been sorted.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_266_1.png)'
  merge: -1
