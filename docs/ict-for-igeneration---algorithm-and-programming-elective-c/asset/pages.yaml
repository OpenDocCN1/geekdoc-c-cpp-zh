  md: '# CHAPTER SUMMARY


    Focus


    # Text File Functions


    # Opening text files


    ```

    f = open("datafile.txt", "r")

    ```


    | Mode | Description |

    | --- | --- |

    | "r" | Read the content of a file. If the file does not exist, a run-time error
    occurs. |

    | "x" | Create a file. If the file already exists, a run-time error occurs. |

    | "w" | Open the file and overwrite its content. If the file does not exist, the
    program will create it. |

    | "a" | Open the file and append new content. If the file does not exist, the
    program will create it. |


    # Closing text files


    ```

    f.close()

    ```


    # Checking whether a text file exists


    ```

    import os

    os.path.exists("targetfile.txt")

    ```


    # Deleting text files


    ```

    import os

    os.remove("targetfile.txt")

    ```


    # Writing into text files


    ```

    f.write("Write here.")

    ```


    # Reading text files


    +   - Reads all the content in a document and returns that content as a string.


    ```

    f.read()

    ```


    +   - Reads all the content in the first line in a document and returns that content
    as a string.


    ```

    f.readline()

    ```


    +   - Reads all the content in a document, saves each line of string as a list
    item and returns the list.


    ```

    f.readlines()

    ```'
