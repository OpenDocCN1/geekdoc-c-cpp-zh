  md: '# Handling of Text Files


    # B Splitting strings


    An English sentence is formed by multiple words, which are separated from one
    another by whitespaces. We can use the split() function to split words into list
    items, and then the function returns this list. The following is a sample Python
    program:


    ```

    the_string = "I am fine"

    words = the_string.split(\)

    print(words)  # [''I'', ''am'', ''fine'']

    print(type(words)) # <class ''list''>

    ```


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_286_0.png)


    Apart from splitting strings by the default delimiter (i.e. whitespaces), we can
    specify another delimiter. The split() function uses the input parameter as the
    delimiter. The following example uses "#" as the delimiter for splitting strings.


    ```

    the_string.split("##")

    String to be split      Delimiter

    ```


    Sample Python program:


    ```

    the_string = "cat#dog#bird"

    words = the_string.split("##")

    print(words)  # [''cat'', ''dog'', ''bird'']

    print(type(words)) # <class ''list''>

    ```


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_286_1.png)


    # C Replacing strings


    We often have to update the content of text files. Python provides the replace()
    function, which returns the new string after the specified string has been updated.


    ```

    the_string.replace("two", "2")

    String to be replaced New string

    ```


    Sample Python program:


    ```

    the_string = "one two two three three three"

    new_string = the_string.replace("two", "2")

    print(the_string)  # one two two three three three

    print(new_string)  # one 2 two three three three

    ```


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_286_2.png)'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# String Processing


    # MISCONCEPTION


    The replace() function directly changes the specified string in the the_string
    to a new string.


    The replace() function returns the new string after the specified string has been
    updated, while the_string remains unchanged.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_287_0.png)


    If the number of replacements is not specified, all occurrences of the specified
    string will be replaced. An integer parameter can be added to the replace() function
    to specify the number of replacements.


    ```

    the_string.replace("three", "3", 1)

    ```


    String to be replaced New string No. of replacements


    Sample Python program:


    ```

    the_string = "one two three three three"

    new_string = the_string.replace("three", "3", 1)

    print(the_string)  # one two two three three three

    print(new_string)  # one two 3 three three

    ```


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_287_1.png)'
