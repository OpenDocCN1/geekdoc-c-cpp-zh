    # Embedded software engineer


    You have probably heard of software engineers and electrical engineers, but what
    about embedded software engineers? Familiar with both electronics and coding,
    embedded software engineers are the bridge between software and electronics engineers.
    They specialise in creating software that runs on electronics other than the typical
    computers we usually see using languages like C and C++.


    Being an embedded software engineer is a rapidly rising career path as embedded
    systems begin to popularise in many different industries, including medical science
    and automotive. For example, Tesla, a multinational automotive company, is actively
    hiring Embedded software engineers to work on vehicle charging and power conversion.


