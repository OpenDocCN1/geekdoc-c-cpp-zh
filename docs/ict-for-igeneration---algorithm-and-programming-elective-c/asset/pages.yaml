  md: '# 3.1 Nested Control Structures


    Placing a structure into another is called a nested structure. A conditional statement
    may also be nested within a branch of another conditional statement. A nested
    conditional statement decides whether to enter another conditional statement based
    on the result of the previous condition. The following "if-elif" statements are
    examples of a nested conditional structure:


    | Python | Flowchart |

    | --- | --- |

    | if (condition 1): | if (condition 1): | True "then" body |

    |  "then" body 1 | | False |

    | elif (condition 2): | if (condition 2): | True "then" body |

    |  "then" body 2 | | False |

    | elif (condition 3): | if (condition 3): | True "then" body |

    |  "then" body 3 | | False |

    | else: | else: | |

    |  "else" body | | "else" body |


    A conditional statement can be nested in not only the "else" branch but also other
    branches. The following is another example of a nested conditional structure:


    | Python | Flowchart |

    | --- | --- |

    | if (condition 1): | False | True |

    |  if (condition 2): | condition 1 | |

    |  "then" body 2 | | condition 3 True |

    | else: | condition 2 | True |

    |  if (condition 3): | | False False |

    |  "then" body 3 | | "then" body 2 |'
