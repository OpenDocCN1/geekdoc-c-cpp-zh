  md: '# Data Structures


    When writing programs, we usually use variables to store data. However, when it
    comes to storing a lot of related data items, we will use data structures to organise
    the data. For example, to store the scores of all students in a class, we will
    choose to use an array instead of tens of variables.


    Data is stored in computer memory cells arranged in a row. Each computer memory
    location stores only one piece of data. Data structures refer to the methods of
    storing and organising data in the computer memory. They determine the sequences
    and locations of data items in the computer memory.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_152_0.png)


    # Arrays


    As mentioned in Module D of the Compulsory Part, an array is a simple linear data
    structure that stores a set of data sequentially in a continuous computer memory.
    The following diagram shows an array that arranges data items in a row:


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_152_1.png)


    Since data is stored continuously in the memory, the computer can use the index
    to calculate the memory address quickly and easily, and access a given item directly.
    For example, the value of the_array[4] is “E”.


    > GOTO

    Arrays in computer memory is discussed in Core D section 5.1.'
