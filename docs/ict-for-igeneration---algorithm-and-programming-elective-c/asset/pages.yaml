  md: 'The following table lists the advantages and limitations of linear search and
    binary search:


    | Linear search | Binary search |

    | :--- | :--- | :--- |

    | Algorithm design program writing | Simple | Complicated |

    | Requirements for the list to be searched | No | The items in the list must be
    sorted |

    | Efficiency | Suppose that there are N items on a list: | Suppose that there
    are N items on a list: |

    | Maximum number of searches | N | log N / log 2 |

    | Average number of searches | N + 1 | log N / log 2 |

    | Applicable to | Lists with fewer items | Lists with more items |


    Table 6.1 Comparison between linear search and binary search


    > TIP: Since binary search is only applicable to sorted lists, when we need to
    add an item to the list, we must place it in the correct position to keep the
    list sorted. Therefore, if we wish to use binary search, we need to spend more
    time and resources while adding items; whereas linear search has no restrictions
    on the order of the list, meaning that we can simply place a new item at the end
    of the list.


    To sum up, before choosing whether to use linear search or binary search on a
    list, we should first consider which operation (searching for Items or adding
    items) is performed by the program more often, in order to enhance the program’s
    efficiency.'
