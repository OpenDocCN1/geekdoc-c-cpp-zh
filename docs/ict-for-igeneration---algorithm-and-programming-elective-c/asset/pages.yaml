  md: '1. When the document is opened, the hidden pointer points to the first character.


    ```

    T h i s i s l i n e o n e . \n T h i s i s l i n e t w o ...

    ```


    2. The readline () function in the second line starts reading the document until
    the hidden pointer moves to the character after the \n character.


    ```

    T h i s i s l i n e o n e . \n T h i s i s l i n e t w o ...

