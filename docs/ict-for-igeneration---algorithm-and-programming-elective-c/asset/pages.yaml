    10 You have completed your program! Now, you can test it on an Android device!


    # ENRICHMENT

    Engineering design process (工程設計流程)


    Many think that if we aim at a revolutionary design, all restrictions must be
    removed so that our imaginations can run wild. In fact, too much freedom can make
    us confused, while the right level of constraint can help us find creative inspiration.
    The engineering design process allows us to solve problems and design products
    systematically. It includes five steps:


    +   1 Ask: point out problems and reflect on how to spot them.

    2 Imagine: research and brainstorm how to solve the problems.

    3 Plan: plan precisely how to solve the problems.

    4 Create: create the product according to the plan.

    5 Improve: look for room for improvement and repeat the whole process.


    This process is very similar to the process for solving a problem by programming:


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_331_1.png)'
