  md: "# 4.5 Parameters Passing\n\nWhen calling a sub-program that requires an input\
    \ parameter, the actual parameter will be passed to the formal parameter. In Python,\
    \ the program determines the way of parameter passing according to the data type\
    \ of the actual parameter.\n\nFormal parameter\n\n```\ndef printx2(s):\n    print(s)\n\
    \    print(s)\n    sent = \"Hello\"\n    printx2(sent)\n```\n\n![](img/56bdb053bf3793fa85bbbf08ebb74627_130_0.png)\n\
    \nActual parameter\n\n# A Passing immutable objects\n\nIn Python, integers (int),\
    \ floats (float), Booleans (bool) and strings (str) are immutable objects. When\
    \ calling a sub-program and passing an immutable object, the value of the actual\
    \ parameter will be copied to the formal parameter of the sub-program. Since formal\
    \ parameters belong to local variables as well, when the sub-program ends, all\
    \ local variables will be dropped. Therefore, modifications made to the formal\
    \ parameter within the sub-program do not affect the value in the actual parameter.\n\
    \n```\ndef add(x):\n    print(\"Inside, before add:\", x)\n    x = x + 1\n   \
    \ print(\"Inside, after add:\", x)\n\nnum = 1\nprint(\"Outside, before add:\"\
    , num)\nadd(num)\nprint(\"Outside, after add:\", num)\n```\n\n| Python | Analogy\
    \ |\n| --- | --- |\n| Memory address Data | Actual parameter num |\n| 0x1000 1\
    \ | Copy |\n| 0x1001 | |\n| 0x1002 | |\n| 0x1003 | |\n| 0x1004 2 | Formal parameter\
    \ x (local variable) Modify |\n| 0x1005 | |\n| 0x1006 | |\n| 0x1007 | |\n\nOutside,\
    \ before add: 1\nInside, before add: 1\nInside, after add: 2\nOutside, after add:\
    \ 1"
  merge: -1
  pgno: 130
- img_proc: true
  md: '# B Passing mutable objects


    Lists (list) are mutable objects in Python. When calling a sub-program and passing
    a mutable object, the formal parameter of the sub-program will store the computer
    memory address of the actual parameter. The formal parameter is the pointer of
    the actual parameter. When the sub-program is being run, the formal parameter
    will refer to the memory address of the actual parameter. Therefore, any modifications
    made to the formal parameter within the sub-program will be reflected in the actual
    parameter.


    | def add(x): | Memory address | Data |

    |---|---|---|

    | print("Inside, before add:", x) | 0x1000 | Actual parameter num |

    | x[0] = x[0] + 1 | 0x0001 | Modify |

    | print("Inside, after add:", x) | 0x0002 | |

    | | 0x0003 | Refer |

    | | 0x0004 0x1000 | Formal parameter x (local variable) |

    | | 0x0005 | |

    | | 0x0006 | |

    | | 0x0007 | |


    num = [1]

    print("Outside, before add:", num)

    add(num)

    print("Outside, after add:", num)


    Outside, before add: [1]

    Inside, before add: [1]

    Inside, after add: [2]

    Outside, after add: [2]


    > In C++, there are also two ways for parameter passing, which are called call-by-value
    (按值调用) and call-by-reference (按引用). When a sub-program is called by value, the
    value in the actual parameter will be copied and become the formal parameter in
    the sub-program, which is akin to the effect of passing an immutable object in
    Python. Calling a sub-program by reference is the other way round. When a sub-program
    is the computer memory address of the actual parameter, the formal parameter can
    directly refer to the value of the actual parameter, which is akin to the effect
    of passing a mutable object in Python.'
