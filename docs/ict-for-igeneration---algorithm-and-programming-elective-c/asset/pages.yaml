  md: '# Rounding errors


    Apart from directly truncating numbers, we may choose the alternative way of rounding
    the values, which includes round off, round up and round down.


    # Round off


    Suppose that we are going to round off a number to $n$ decimal places, the rules
    for rounding are as follows:


    +   - If the number at the $(n+1)^{th}$ decimal place is smaller than or equal
    to 4, we will directly truncate the extra digit. For example, the result of rounding
    off $\pi$ to two decimal places is 3.14.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_58_0.png)


    +   - If the number at the $(n+1)^{th}$ decimal place is greater than or equal
    to 5, truncate the extra digit and add 1 to the number at the $n^{th}$ decimal
    place. For example, the result of rounding off $\pi$ to four decimal places is
    3.1416.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_58_1.png)


    In Python, we can use the round() function to round off a number to a certain
    decimal place.


    ```

    import math

    PI = math.pi

    print (round(PI, 2))

    print (round(PI, 4))

    ```'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# Round up


    Rounding up a number to a certain digit means raising the number to the nearest
    value at the specified digit. For example, the result of rounding up π to two
    decimal places is 3.15.


    # Round down


    Rounding down a number to a certain digit means lowering the number to the nearest
    value at the specified digit. For example, the result of rounding down π to two
    decimal places is 3.14.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_59_0.png)


    # MISCONCEPTION


    +   Round down and rounding give the same result.

    When the number is negative, the absolute value of the rounded down number is
    greater than the absolute value of the true number. For example, the result of
    rounding down -3.456 to two decimal places is -3.46; whereas the result of truncating
    -3.456 to two decimal places is -3.45. Therefore, rounding down and truncation
    are different.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_59_1.png)


    Rounding error means the difference between the true value and the rounded value:


    > Rounding error = |True value – Rounded value|


    For example, if we save the value of (2.718281828459045) Into a variable that
    can only store two decimal places, the results are as follows:


    | Actual value stored | Error |

    |---|---||

    | Round off | 2.72 | Rounding error = 0.0017818171540955 |

    | Round up | 2.72 | Rounding error = 0.0017818171540955 |

    | Round down | 2.71 | Rounding error = 0.008281828459045 |

    | Truncation | 2.71 | Truncation error = 0.008281828459045 |


    It can be seen that rounding errors must be larger or equal to truncation errors.
    Therefore, programs will round off (/) a float by default.


    > TIP Although there are no functions for rounding up and rounding down in Python
    we can verify using the mathematical functions in spreadsheets. The ROUND (),
    ROUNDUP () and ROUNDDOWN () mean rounding off, rounding up and rounding down respectively.


    rounding 入误差'
