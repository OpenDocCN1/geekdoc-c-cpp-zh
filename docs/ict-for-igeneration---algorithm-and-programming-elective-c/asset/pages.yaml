  md: '# Applications of Programming in Real Life


    | Type of sensor | Picture | Applications |

    |---|---|---||

    | Accelerometer and gyroscope | [image] | Acceleration and direction | Pedometers
    (detect motions)<br>Drone balancing |

    | Particulate matter (PM) sensor | [image] | Concentration of particulate matter
    | Air quality monitoring stations |


    **Table 8.1** Sensors from sensors, manual input devices also count as input devices.


    In fact, apart from sensors, manual input devices also count as input devices.
    The sensors we have learnt about are automatic input devices, which can adjust
    the data automatically according to changes in the external environment. However,
    manual input devices require users to adjust the data by hand. The following are
    some manual input devices that we have seen in our daily life:


    | Manual input device | Picture | Applications |

    |---|---|---||

