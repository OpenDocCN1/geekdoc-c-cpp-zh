  md: '# The concept and manipulation of circular queue


    As shown in the pointers manipulation above, in the case of an array with a fixed
    size, we can neither add new items nor reuse the array items once the tail of
    the queue reaches the end of the array. This way of manipulation wastes computer
    resources.


    To solve this problem, we can simply reset the pointers. When a pointer reaches
    the end of the array, the next value of the pointer is reset to the index of the
    first item in the array. In this way, a circular queue is formed. The following
    explains how to implement the manipulation of circular queue using pointers:


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_176_0.png)


    | Queue manipulation | Pointer manipulation |

    |---|---|

    | | Assume initially that the data of the queue is at the end of the array. |

    | `cir_queue = [''A'', ''B'']` | ![cir_queue_1]

    | | Since pointer tail has reached the end of the array, set the value of tail
    to 0. |

    | `enq(cir_queue, ''C'')` | ![cir_queue_2]

    | | Increase the value of pointer tail by 1. |

    | `enq(cir_queue, ''D'')` | ![cir_queue_3]

    | | Increase the value of pointer head by 1. |

    | `deg(cir_queue)` | ![cir_queue_4]|'
  merge: -1
