  md: '# Efficiency of insertion sort


    Every time the loop body of insertion sort is executed:


    +   - the best case is the key value smaller than the item on the left, means
    there is no need to swap the items;

    - the worst case is the key value to be inserted into the first position of the
    list. If the key value is $k$, it needs to perform $(K-1)$ comparisons and swapping.


    To conclude, suppose a list with $N$ items is to be sorted in descending order,


    +   - the best case is the list to be sorted in descending order, which means
    there is no need to swap any items.

    - the worst case is the list to be sorted in ascending order. The number of comparisons
    and swapping for completing the whole insertion sort:


    $1 + 2 + 3 + ... + (N-2) + (N-1) = \frac{N(N-1)}{2}$


