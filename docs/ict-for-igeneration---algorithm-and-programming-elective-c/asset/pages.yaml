  md: '# Algorithm Comparison


    A problem can often be solved using several algorithms, yet each of them must
    have its merits and demerits. We need to compare different algorithms in order
    to select the most correct and appropriate solution. The merits and demerits of
    algorithms can be compared mainly in two aspects, steps of operation and resource
    usage. When there are more steps of operation, the program takes a longer time
    to run, which usually means an increase in the time complexity (時間複雜度) of the
    program. When two algorithms use different data structures or different numbers
    of variables, they occupy different amounts of resources. The more computer resources
    an algorithm occupies, the higher the space complexity (空間复杂度) of the program
    is.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_96_0.png)


