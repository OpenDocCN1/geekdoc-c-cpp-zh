  md: '# # Event-driven programming


    In daily life, when we press the shutter of a camera, the camera will take a photo;
    when we press the button of a lift, the lift will arrive. Generally speaking,
    many devices will execute the corresponding actions once certain events are triggered.
    While designing a program, we can set the event that triggers program execution.
    Once the specified event occurs, the corresponding code will be executed. This
    design is called [event-driven programming](link).


