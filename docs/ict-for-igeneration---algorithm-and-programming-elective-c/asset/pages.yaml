  md: "# Updating a Text File\n\nThe following sub-program update_file() writes all\
    \ the items of two-dimensional list record to the text file once again in a specific\
    \ format:\n\n```\ndef update_file():\n    f = open(\"phonebook.txt\", \"w\")\n\
    \    for i in range(0, len(record)):\n        f.write(record[i] + \"0;\";+record[i]\
    \ + [1]+\";\";+record[i] + [2]+\";\";+record[i] + [3])\n        if i < len(record)-1:\n\
    \            f.write(\"\\n\")\n```\n\nThe content of the updated text file phonebook.txt\
    \ is as follows:\n\n```\nRose;Wong;Mobile;95784224\nDaniel;Chan;Mobile;90094786\n\
    ---;---;---\nSally;Ho;Mobile;68753694\n```\n\n# Adding records\n\nThe following\
    \ sub-program add_record(firstname, lastname, noType, number) appends the record\
    \ of a contact to the text file.\n\n```\ndef add_record(firstname, lastname, noType,\
    \ number):\n    f = open(\"phonebook.txt\", \"a\")\n    f.write(\"\\n\"+firstname+\"\
    :\";+lastname+\":\";+noType+\":\";+number)\n    f.close()\n```\n\nThe content\
    \ of the text file phonebook.txt after calling the sub-program add_record(\"Jay\"\
    , \"Chow\", \"Home\", \"265730212\") is as follows:\n\n```\nRose;Wong;Mobile;95784224\n\
    Daniel;Chan;Mobile;90094786\n---;---;---\nSally;Ho;Mobile;68753694\nJay;Chow;Home;265730212\n\
    ```\n\n> TIP\nSince this record is directly appended to the text file, if we want\
    \ to update the 20 list in the program, we must call the sub-program load_record()\
    \ again to load the latest data from the text file into the program."
