    3. The readline () function in the third line starts reading the document from
    the position where the hidden pointer last stopped, until the hidden pointer moves
    to the character after the \n character.


    ```

    o n e . \n T h i s i s l i n e t w o . \n T h i s i s l i n ...

    ```


    4. The readline () function in the fourth line starts reading the document from
    the position where the hidden pointer last stopped. Since no \n is detected by
    the time the function reached the end of file, the function stops reading.


    ```

    t w o . \n T h i s i s l i n e t h r e e . EOF

    ```


    5. The hidden pointer reaches the end of file character. The readline () function
    in the fifth line returns an empty string.'
