  md: '# STEAM +


    # Definition of functions in Mathematics


    In Mathematics, functions are expressed by symbols as $f, g, h$ and the general
    format is


    $y = f(x)$


    in which $x$ is the input passed to function $f$ and $y$ is the output of function
    $f$.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_109_0.png)


    # ANALOGY


    # Black box


    We use many functions when writing programs. Due to different reasons, such as
    the limitations of our knowledge and the lack of access right to view the source
    code of libraries, we cannot understand the principles of some functions. Nonetheless,
    this does not prevent us from using these functions, yet they can be compared
    to a black box: we have no idea about the code and algorithm, yet we can know
    the input and output values of the functions by reading the documentation (文献)
    and using the functions.


    For example, you may know what the following formula is?


    $e = \sum_{n=0}^{\infty} \frac{1}{n!} = 1 + \frac{1}{1} + \frac{1}{1 \cdot 2}
    + \frac{1}{1 \cdot 2 \cdot 3} + \dots$


    The above is the formula for calculating the mathematical constant $e$. We do
    not need to understand the principle of the formula nor write a program to perform
    the calculation. Instead, we simply need to use the function `math.exp(1)` to
    get the answer.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_109_1.png)'
  merge: -1
  pgno: 109
