  md: '# 7.1 Reading Content from Text Files


    Programs often require users to input information. We have learnt about using
    the input() function in Python to obtain information input by users. Every time
    when the program runs, users need pieces of information one by one, until they
    input a string (e.g. -1) for exiting the program. If there are input errors in
    the program, the users need to run the program and input the information once
    again.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_278_0.png)


    | Input a data (input -1 to exit): 81 |

    | Input a data (input -1 to exit): 92 |

    | Input a data (input -1 to exit): 86 |

    | Input a data (input -1 to exit): 75 |

    | Input a data (input -1 to exit): 68 |

    | Input a data (input -1 to exit): 48 |

    | Input a data (input -1 to exit): 88 |

    | : |


    Other than receiving the information directly input by users, Python programs
    can also obtain information from plain text files (e.g. files in TXT, CSV or JSON
    format). Therefore, when the program has a large number of inputs or outputs,
    it is more convenient to read the content from or write the content to text files.
    Text files can be compared to simple databases. This chapter will discuss how
    to handle text files as well as convert file content to a format that can be processed
    by Python.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_278_1.png)


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_278_2.png)'
