  md: '# Selection sort


    Selection sort is based on linear search. The algorithm repeatedly carries out
    linear search in the unsorted part of the list to find the maximum or minimum
    value. Then, this value is swapped with the first item of the unsorted list so
    as to set up the sorted part of the list. This process is repeated until all list
    items have been sorted.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_236_0.png)


    # The concept of selection sort


    The following list stores the exam marks of seven students, as shown below:


    | mark | 45 | 70 | 66 | 82 | 55 | 95 | 60 |

    | index | 0 | 1 | 2 | 3 | 4 | 5 | 6 |


    Suppose that the list is to be sorted in descending order:


    +   1. Firstly, perform linear search on the list to find the maximum value.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_236_1.png)


    +   2. Swap the maximum value with the first item of the list. This divides the
    sorted and unsorted parts of the list.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_236_2.png)'
  merge: -1
  pgno: 236
- img_proc: true
  md: '3. Then, perform linear search on the unsorted part to find the maximum value.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_237_0.png)


    4. Swap the maximum value with the first item of the unsorted list. This adds
    an item to the sorted list.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_237_1.png)


    5. Repeat the above operations of linear search and swapping.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_237_2.png)


