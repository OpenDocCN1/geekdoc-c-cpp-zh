  md: "# Calling sub-programs\n\n+   - We call a sub-program by writing the sub-program\
    \ name and the required actual parameter(s).\n\n+   - If this function has a return\
    \ value, a variable can be used to store the return value.\n\n```\nsumm = addAll(1,\
    \ 2, 3, 4, 5)\nVariable storing Sub-program Actual parameter the return value\
    \ name\n```\n\n# Parameter passing\n\n+   - When calling a sub-program that requires\
    \ an input parameter, the actual parameter will be passed to the formal parameter.\n\
    \n+   - In Python, the program determines the way of parameter passing according\
    \ to the data type of the actual parameter.\n\n| Data type of the actual parameter\
    \ | Object type | Description |\n| Integer (int), Float (float), Boolean (bool),\
    \ String (str) | Immutable object | When calling a sub-program and passing an\
    \ immutable object, the value of the actual parameter will be copied to the formal\
    \ parameter of the sub-program. Modifying the formal parameter **does not affect**\
    \ the value in the actual parameter. |\n| List (list) | Mutable object | When\
    \ calling a sub-program and passing a mutable object, the formal parameter of\
    \ the sub-program will store the computer memory address of the actual parameter.\
    \ Modifying the formal parameter **will affect** the value in the actual parameter.\
    \ |\n\n# Variable scopes\n\n+   - Every variable has a scope in which it can be\
    \ used. Variables mainly be categorised into local variables and global variables.\n\
    \n| Local variables | A variable declared within a sub-program is regarded as\
    \ a local variable. This variable is only valid within the sub-program. |\n| Global\
    \ variables | A variable declared outside a sub-program is regarded as a global\
    \ variable. Its scope covers the whole program including all sub-programs. |\n\
    \n```\nsumm = addAll(1, 2, 3, 4, 5)\ndef addAll(n1, n2, n3, n4, n5):\n    result\
    \ = n1 + n2 + n3 + n4 + n5\n    return result\nsumm = addAll(1, 2, 3, 4, 5)\n\
    print(summ)\n```"
