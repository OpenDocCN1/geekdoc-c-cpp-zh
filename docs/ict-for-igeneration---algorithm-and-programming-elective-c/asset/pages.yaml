  md: '# Sub-programs


    #  4.1 Modularisation


    As mentioned in previous parts, when we break down a complicated problem into
    several smaller and manageable sub-problems (also known as modules), then deal
    with them one by one systematically, the problem becomes easier to solve.


    > GOTO

    Benefits of modularity are mentioned in section 3.5 of Core D.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_108_0.png)


    Fig. 4.1 Compose a problem


    Similarly, when designing algorithms or writing programs, people often use a modularised
    design intentionally. Constructing a program from smaller modules helps enhance
    the efficiency of developing and managing the program. These modules in a program
    are called sub-programs (also called functions in Python). They can be used individually
    and repeatedly, and each of them represents multiple lines of code. This chapter
    will focus on writing and using sub-programs.


    > GOTO

    We have used different functions in a spreadsheet.

    Spreadsheet functions are mentioned in section 4.3 of Core A.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_108_1.png)


    Fig. 4.2 A modularised program'
  merge: -1
