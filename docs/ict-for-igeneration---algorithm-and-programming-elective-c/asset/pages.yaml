  md: '# Pseudocode and flowcharts


    There are three common ways to express algorithms. The first way is expressing
    them in everyday words, yet it is hard to be concise. Now, we learn about two
    other ways of expression: pseudocode and flowcharts.


    +   - Pseudocode uses simple words/statements, including some keywords, to express
    an algorithm.

    - Flowchart uses specific shapes and links to express an algorithm.


    The following are some common pseudocode and flowcharts:


    | Structured English | Pseudocode | Flowcharts |

    | --- | --- | --- |

    | Start / End the algorithm | N/A | N/A | Start <br> End |

    | Process / Assignment | Set A to 21 Copy the value of A to B Add 1 to the value
    of B | A ← 21 B ← A B ← B + 1 | A ← 21 <br> B ← A <br> B ← B + 1 |

    | Input / Output | Input the values of A, B | Input A, B | Input A, B |

    | Decision | If A equals to B, then ... Else, ... | if A = B then else ... | No
    / A = B / Yes |

    | Sub-program | Call sub-program ProABC | ProABC | ProABC |


    Table 1.1 Commonly used pseudocode and flowcharts'
