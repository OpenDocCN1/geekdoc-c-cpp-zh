  md: "# Sub-programs\n\nTherefore, we need to use stubs. They replace the main body\
    \ of sub-programs by short, simple and temporary code, allowing the main program\
    \ to run even when the sub-programs have not been completed. Since stubs are also\
    \ sub-programs, we only need to define the sub-program names or return values\
    \ when writing them. The following are examples of some common stubs:\n\n+   -\
    \ Stubs without a return value:\n\n```\n```\ndef stubs_with_no_return_value():\n\
    \    print()\n```\n```\n\n+   - Stubs with a return value:\n\n```\n```\ndef stubs_with_return_value():\n\
    \    return 100 #Can be modified according to the data type of return value\n\
    ```\n```\n\nMoreover, since stubs are simple code, it may contain syntax or logical\
    \ errors. When debugging a program, we can replace certain sub-programs with stubs.\
    \ By excluding these sub-programs, we can narrow the scope of examination and\
    \ spot the issue more efficiently.\n\nTake the above BMI algorithm as an example,\
    \ we can replace the sub-programs \"Calculate the BMI\" and \"Analyse the BMI\"\
    \ with stubs in order to test the sub-program \"Make the report\".\n\n![](img/56bdb053bf3793fa85bbbf08ebb74627_140_0.png)"
