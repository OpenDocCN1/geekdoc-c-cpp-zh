  md: '# Forever loops


    Unlike programs for performing operations, many electronic devices do not execute
    their tasks only once; instead, they need to do the tasks over and over. Therefore,
    most programs include the following functions:


    +   - Setup function: the code in this function will be run once after the programmable
    microcontroller has started.


    +   - Forever loop function: After the setup function is run, the code in this
    function will be run repeatedly, until the programmable microcontroller is reset
    or turned off.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_316_0.png)


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_316_1.png)


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_316_2.png)


    # Control an output device (LED panel) using micro:bit


    micro:bit is a programmable microcontroller with a size of 4 cm x 5 cm. It is
    equipped with a 5 x 5 LED panel, various built-in sensors as well as many pins
    (引脚) for connecting external accessories.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_316_3.png)


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_316_4.png)


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_316_5.png)


    The MakeCode editor provided by Microsoft lets us write programs for our micro:bits
    using blocks or Python. It has a simulator, which helps us test our programs quickly
    after we have finished writing.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_316_6.png)'
