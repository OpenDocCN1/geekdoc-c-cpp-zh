    # Grady Booch


    Following


    > “The task of the software development team is to engineer the illusion of simplicity.”


    Modularisation is a crucial strategy for problem-solving. Sub-programs are useful
    when developing complex software. Using sub-programs facilitates the reuse of
    programs and helps avoid writing the same content repeatedly. Sub-programs can
    also simplify the program into a more readable one, making the division of labour
    easier and therefore enhancing the efficiency of development.'
