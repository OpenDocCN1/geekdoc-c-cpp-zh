  md: "# ENRICHMENT\n\n# Recursion (递归)\n\nRecursion means the process of a function\
    \ calling itself in a function. Take the following code as an example, sec, the\
    \ parameter passed in the first function call, passes the parameter sec-1 every\
    \ time it calls the recursive function. The recursion stops when the value of\
    \ sec becomes zero.\n\n```\ndef countdown(sec):\n    print(sec)\n    if sec ==\
    \ 0:\n        # base case\n        print(\"Time's up!\")\n    else:\n        countdown(sec-1)\n\
    ```\n\nA recursive function must have a base case (基本情况) to prevent the function\
    \ from calling itself indefinitely. The control flow of a recursive function is\
    \ as follows:\n\n![](img/56bdb053bf3793fa85bbbf08ebb74627_132_0.png)\n\nIf the\
    \ recursive function has a return value, the control flow is as follows:\n\n```\n\
    def sum(num):\n    if num == 1:\n        # base case\n        return 1\n    else:\n\
    \        return (num + sum(num-1))\n```\n\nprint(sum(4))\n\n![](img/56bdb053bf3793fa85bbbf08ebb74627_132_1.png)"
