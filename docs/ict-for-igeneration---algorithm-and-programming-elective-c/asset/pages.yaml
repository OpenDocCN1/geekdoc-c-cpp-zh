  md: '# # 8.3 Programmable Microcontrollers


    Input and output devices are often called external/peripheral devices. Have you
    thought about how they are controlled? Same as computers, electronic devices require
    a "brain" to process data and instructions, as well as control system operations.
    The main processor on an electronic device is known as a programmable microcontroller.
    It is usually a small circuit board with various ports and pins, which allow users
    to freely connect different input and output devices.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_313_0.png)


    Fig. 8.6 Examples of programmable microcontrollers (From left to right: Arduino,
    microbit and Raspberry Pi)


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_313_1.png)


    Fig. 8.7 The input, processing and output devices of an electronic


    Fig. 8.8 The input, processing and output devices of a computer


    A complete electronic device includes both hardware and software. Hardware is
    the physical part while software is the program. A programmable microcontroller
    lets the user upload a program and executes specific tasks according to instructions
    in this program.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_313_2.png)


    programmable microcontroller 可编程微控制器'
