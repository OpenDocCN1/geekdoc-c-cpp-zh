  md: "# 4.4 Variable Scopes\n\nACTIVITY\n4.3\n\nDebug (Variable scopes)\n\nDo you\
    \ know the reason why the following program cannot be executed?\n\n| Python code\
    \ | Cause of error |\n| --- | --- |\n| def add(a, b): | |\n| result = a + b |\
    \ |\n| add(1, 1) | |\n| print(result) |\n\nIn Python programs, each variable has\
    \ a scope in which it can be used. Variables can be categorised into local variables\
    \ and global variables according to the regions they cover.\n\n# Local variables\n\
    \nA variable declared within a sub-program is regarded as a local variable. This\
    \ variable is only valid within the sub-program. After the sub-program has ended,\
    \ all local variables will be dropped. If the user tries to access a local variable\
    \ outside the sub-program, the program will display an error message.\n\n> TIP\n\
    Formal variables of a sub-program also belong to local variables.\n\n```\ndef\
    \ add(a, b):\n    result = a + b\n    print(result)\n```\n\nLocal variables in\
    \ the sub-program add\n(a, b, result) and their scopes\n\n> They are different\
    \ variables!\n\n```\ndef sub(a, b):\n    result = a - b\n    print(result)\n```\n\
    \nLocal variables in the sub-program sub\n(a, b, result) and their scopes\n\n\
    add(1, 1)\nsub(10, 7)"
