  md: "# 4.3 Defining Sub-programs\n\nApart from calling built-functions, we can define\
    \ our own functions.\nBefore writing a sub-program or a function, we need to analyse\
    \ the Input-Process-Output cycle of the sub-program, same as what we do when designing\
    \ an algorithm.\n\nFor instance, we are going to design a sub-program to add three\
    \ parameters together and return the sum. The following is the Input-Process-Output\
    \ cycle of the sub-program:\n\n![](img/56bdb053bf3793fa85bbbf08ebb74627_114_0.png)\n\
    \n# Syntax\n\nEach sub-program or function represents multiple lines of code,\
    \ and it must be defined before being called. In Python, we use the keyword def\
    \ to define a sub-program. The syntax is as follows:\n\n+   Sub-program name\n\
    For identifying the sub-program\n\n+   Formal parameters\nList the parameters\
    \ to be passed to the sub-program\n\n```\ndef myFunction(p1, p2, p3, ...):\n \
    \ # Statement 1\n  # Statement 2\n  # Statement 3\n    value = \"return something\"\
    \n  return value\n```\n\n+   Indentation\nIndicate which statements are in this\
    \ sub-program\n\n+   Main body of the sub-program\nEvery time the sub-program\
    \ is called, the statements in this part will be executed once\n\n+   Return value\n\
    After the call has ended, the sub-program sends this piece of data back to the\
    \ program"
  merge: -1
  pgno: 114
- img_proc: true
  md: "# Naming sub-programs\n\nThe name of a sub-program is its identifier. The rules\
    \ for naming variables apply to naming sub-programs as well. Since both variable\
    \ names and subprogram names are identifiers, every identifier in the same program\
    \ must be unique and no repetition is allowed.\n\n# Formal parameters\n\nThe formal\
    \ parameters to be passed to the sub-program are listed in the brackets. If there\
    \ is more than one parameter to be passed, commas to separate the parameters.\
    \ If there are no parameters to be passed, leave the brackets blank. The following\
    \ are some examples:\n\n```\ndef myFunction(a):          # Pass one parameter\n\
    def myFunctionB(a, b, c):   # Pass more than one parameter\ndef myFunctionC():\
    \          #No parameter\n```\n\n> GOTO\nRules for naming variables\nare mentioned\
    \ in in section\n1.3 of Elective C.\n\n> TIP\nTo make a subprogram easier to understand,\
    \ its name should reflect its actual use.\n\n# Return value\n\nIn a sub-program,\
    \ the keyword return ending the sub-program call and sending back piece of data\
    \ to the position where the sub-program is called. This piece of data is called\
    \ the return value. If there are no data to be returned by the sub-program, by\
    \ keyword does not need to be added and the subprogram ends after executing the\
    \ code in the main body.\n\n```\nreturn value1             #Return one value\n\
    return value1, value2      #Return more than one value\n```\n\nTake the sub-program\
    \ for adding three parameters together as an example, the following is the Python\
    \ code for defining the sub-program:\n\n```\ndef add3(a, b, c):    add3 is the\
    \ name of this sub-program\n    a, b, c are formal parameters\n    to be passed\
    \ to the sub-program\n    s = a + b + c           The main body of the sub-program\n\
    \                        adds the three parameters together\n    return s    \
    \           s is the return value of this sub-program\n```"
