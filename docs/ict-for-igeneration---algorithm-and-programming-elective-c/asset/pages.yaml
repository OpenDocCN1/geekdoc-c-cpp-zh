  md: '# Differences between linked lists and arrays


    Linked lists and one-dimensional arrays have similar uses in both that can store
    a series of data. As mentioned in Module D of the Compulsory Part, an array can
    store the same type of data. Only the contrary, a linked list can store different
    types of data.


    Moreover, since an array stores data in a continuous memory, the computer can
    use the index to access the memory address quickly and easily, and access a given
    item directly. This method of data access (also known as random access). For example,
    if we want to access data item “d” in the array, we simply need to use the_array[3]
    to find the corresponding array item.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_187_0.png)


    Since a linked list connects nodes by pointers, data items do not need to be stored
    in a continuous memory, instead, they can be stored separately in different locations.
    When we need to access the data item at a given location, we can only search the
    list from the beginning and follow the pointers. This access method is called
    sequential access.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_187_1.png)


    > Data access method is discussed in Core B section 2.3.'
