  md: '# 8.2 Input and Output Devices


    Same as in computers, data in most electronic devices must undergo the three stages
    of computer operation: input, process and output.


    +   - “Input” means that the electronic device receives via input devices (e.g.
    sensors);

    - “Process” means the methods or procedures used by the electronic device for
    processing data;

    - “Output” means the responses given by the electronic device.


    This process is known as the Input-Process-Output cycle. In this chapter, we will
    learn about various tools that help us make electronic devices, such as different
    types of sensors, output devices and processors.


    # A Input devices


    Input devices are responsible for the first stage in the Input-Process-Output
    cycle. Using input devices, we can input instructions to an electronic device,
    or obtain data from the real world and send it to the electronic device.


    Sensors belong to automatic input devices. There are different categories of sensors,
    and each reads one or more physical quantities of the surroundings as the input
    to a smart device. The following are some sensors and examples of their applications:


    | Type of sensor | Picture | Physical quantity measured | Applications |

    | Light sensor (Photoresistor sensor) | | Light intensity | Automatic lighting
    systems (e.g. turn on the light automatically when the room is too dark) |

    | Ultrasonic sensor | | Measure the distance by emitting and receiving ultrasonic
    waves | Automatic taps, Parking sensors (e.g. check whether the car is close to
    any obstacles) |

    | Temperature and humidity sensor | | Air temperature and humidity | Climate control
    systems in greenhouses (e.g. change the air-conditioning settings according to
    the temperature and humidity) |

    | Passive infrared (PIR) motion sensor | | Sense human movements by infrared radiation
    | Automatic doors, Automatic escalators (e.g. increase the speed when someone
    walks post) |


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_309_0.png)


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_309_1.png)


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_309_2.png)'
