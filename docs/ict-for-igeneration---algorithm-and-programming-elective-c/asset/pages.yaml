  md: "![](img/56bdb053bf3793fa85bbbf08ebb74627_211_0.png)\n\n# The need for efficient\
    \ sorting algorithms\n\nSorted lists are everywhere in our daily life. Apart from\
    \ simply reading lists to obtain information, we also add new data to them. Every\
    \ time a new data is added, the list will be sorted again using sorting algorithms.\
    \ \nWith the enormous amount of digital data in our modern society, imagine how\
    \ much extra time we have to spend if we could only use selection sort! Therefore,\
    \ efficient sorting algorithms are a necessity for people nowadays nowadays. We\
    \ are constantly searching for new algorithms to handle more data in a shorter\
    \ time frame and with fewer resources.\n\nYou may wonder why we don't use the\
    \ fastest algorithm to sort everything? Why do we have so many different sorting\
    \ algorithms? A major reason is that different sorting algorithms perform differently\
    \ in different use cases. Their performances depend on many factors, such as the\
    \ data structure for storing the information.\n\n![](img/56bdb053bf3793fa85bbbf08ebb74627_211_1.png)\n\
    \n![](img/56bdb053bf3793fa85bbbf08ebb74627_211_2.png)"
