  md: '# 3.4 Integrated Application of Control Structures


    In computer programs, different control structures are available for changing
    the control flow, i.e. the order in which statements are executed. Control structures
    of a program can be broadly divided into three categories: sequence, selection
    and iteration. No matter how complex a program is going to be, it can be constructed
    using these three control structures. They can even be paired with different data
    structures, such as one-dimensional arrays and two-dimensional arrays, to form
    multi-layered nested control structures. Making good use of the control structures
    allows us to design algorithms that solve problems effectively.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_88_0.png)


    Example is as follows:


    +   1. Mr Wong is an engineer developing automatic agricultural robots. He is
