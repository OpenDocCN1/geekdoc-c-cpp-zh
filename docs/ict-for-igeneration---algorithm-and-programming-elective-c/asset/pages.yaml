  md: '# Pointers


    A pointer is a variable for storing computer memory address, which is usually
    the address of another variable. A pointer can be compared to an arrow in that
    it points to a specific variable. The following is an illustration of a pointer.


    | Memory address | Data |

    |---|---|

    | 0x2000 | |

    | 0x2001 | 879 Variable num |

    | 0x2002 | |

    | 0x2003 | |

    | 0x2004 | 0x2001 Variable p (pointer) |

    | 0x2005 | |

    | 0x2006 | |

    | 0x2007 | |


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_153_0.png)


    Fig. 5.1 A pointer in computer memory


    # ENRICHMENT


    Address-of operator and dereference operator

    In C++, we can use the following operators to obtain the memory address of a variable
    and declare a variable as a pointer.


    +   * Address-of operator (&s, 位址運符) can obtain the memory address of a variable.

    ```int num = 879;

    out << num << endl; // Output the value of variable num: 879

    cout << &num << endl; // Output the memory address of variable num: 0x2001```

    * Dereference operator (*, 解引用運符) can obtain the value of the variable to which
    that pointer points.

    ```int *p;

    p = &num; // Declare pointer p

    // p stores the address of variable num,

    meaning that p points to num

    cout << *p << endl; // Output the value of the variable to which p points: 879```'
