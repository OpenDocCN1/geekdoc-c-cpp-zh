  md: '3. State three benefits of automation.


    # 8.5 Internet of Things (IoT), Artificial Intelligence (AI) and Smart Living


    We make use of technology to make our daily life safe, convenient and environmentally-friendly.
    The concept of smart home has existed for several decades, and some functions
    have already been realised. Most smart devices are not inventions. However, because
    of the development and expansion of IoT, many items can now be connected with
    one another. This allows smart devices to have better functions and features than
    before.


    For example, you can control your electronic appliances via the Internet. When
    the Global Positioning System (GPS) on your smartphone devices that you are near
    your home, the smart air-conditioner will turn on the air-conditioning automatically.
    Then, you can enjoy comfortable breezes you have arrived home.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_327_0.png)


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_327_1.png)


    Internet of Things (IoT) is the network of objects. These objects can connect
    to sensors and the Internet so that data can be transferred among one another.
    This also lets us collect the most updated information. When paired with pre-set
    programs, sensors and computers can collect and process data more effectively
    than humans do, and then help the system make automatic and appropriate decisions.


    IoT involves wireless communication technologies, including Wi-Fi, Bluetooth,
    Radio Frequency Identification (RFID) and Near Field Communication (NFC). For
    instance, we can control an electronic switch remotely using the Bluetooth function
    on our smartphone.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_327_2.png)


    Fig. 8.13 Electronic modules for wireless communication (from left to right: a
    Wi-Fi module, a Bluetooth module and a RFID reader with tags)'
