  md: '# 1.4 Control Structures


    In computer algorithms, there are three basic types of control structures, including
    sequence, selection and Iteration. The sequence control structure allows the program
    to execute statements according to the order of writing. Selection and iteration
    control structures let the program decide which statements to execute according
    to specified conditions.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_20_0.png)


    # A Selection


    Selection control structure uses a Boolean expression as the condition for evaluation.
    The logical result will decide which statements the program should execute.


    | Python | Flowchart |

    | --- | --- |

    | **if-then** conditional statements | `if {condition}: {"then" body}` | ![condition
    -> True: "then" body, False: ] |

    | **if-then-else** conditional statements | `if {condition}: {"then" body} else:
    {"else" body}` | ![condition -> True: "then" body, False: "else" body ]'
  merge: -1
