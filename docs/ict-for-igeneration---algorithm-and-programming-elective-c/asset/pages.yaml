  md: '# Linked Lists


    # 5.4 The concept and manipulation of linked lists


    A linked list is formed by many nodes. Each node stores its own data and a pointer,
    which stores the address of the next node. Nodes in the linked list are all connected
    by pointers.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_185_0.png)


    Fig. 5.8 A linked list


    To add a new node or delete a node from the linked list, we simply need to modify
    the pointers of the nodes.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_185_1.png)


    Fig. 5.9 Deleting a node


    > TIP Since no pointers point to node B, it is no longer accessible. Thus, there
    is no need to change the pointer in node B.


    > THINK ABOUT Why should we direct the pointer of the new node E before redirecting
    the pointer of the previous node A?


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_185_2.png)


    Fig. 5.10 Adding a node


    Stack and queue data structures only allow us to add data at their ends, a linked
    list lets us insert new data in the middle of a row of data items. Therefore,
    a linked list is more flexible than the previous two data structures.'
