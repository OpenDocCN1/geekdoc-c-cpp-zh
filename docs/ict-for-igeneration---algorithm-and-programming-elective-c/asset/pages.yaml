    # Zen of Python


    Python is one of the most loved languages among modern software engineers. One
    of the most prominent reasons for its high popularity is its elegant design. Designing
    a programming language is complicated; it begins from conceptual and abstract
    ideas to minuscule considerations.


    The Zen of Python, written by software engineer Tim Peters, is a set of 20 aphorisms
    that greatly influenced the design principles of Python. The 20 statements are
    pretty abstract, you can easily see their implementation when coding in Python.
    For example, using indentation of curly braces like in other languages to indicate
    code blocks makes code more beautiful and readable.


    If you carefully read the Zen of Python, you may ask, "Where''s the twentieth
    aphorism?" No one! Tim Peters intentionally left it blank for the creator of Python,
    Guido van Rossum, to fill in, but never did!


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_5_1.png)'
