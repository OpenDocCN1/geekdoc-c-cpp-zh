  md: '# Variables and simple data types


    Data is often used in the process of computation. Variables are locations in the
    computer memory for data storage.


    # Declaration of variables


    Most programming languages require us to declare the name and data type of any
    variable that we are going to use. Variables cannot be named arbitrarily, otherwise
    program errors or obstacles in reading may be caused. In Python, we should pay
    attention to the following rules for naming variables:


    +   1. A variable name can only start with English letters (A-Z, a-z) or an underscore
    (_), but not numbers (0-9).


    +   - number

    - numberOne


    +   2. Only English letters, numbers and underscore (_) can be used in a variable
    name. "Whitespace" or other symbols (such as !, #, $) must not be included.


    +   - new_number

    - newnumber


    +   3. We cannot use "keywords / reserved words" as variable names. Such keywords
    are reserved by the programming language and have predetermined meanings, so are
    not available for use. The following are examples of keywords in Python:


    +   - print

    - and

    - or

    - for

    - while

    - if


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_13_0.png)


    +   1. Python is case-sensitive, "bmi" and "Bmi" represent two different variables.
    Variable names usually start with small letters.


    +   2. Although the data in variables can be changed, some values are fixed, e.g.
    pi=3.14159. Variables with fixed data (also called constants) are often named
    in all capital letters, e.g "PI".


    +   3. To make the algorithm easier to understand, the variable name should reflect
    its actual use. If "weight" and "height" are changed to "a" and "b", it will be
    hard to guess the uses of variables and the purpose of the algorithm.


    +   5. Since variable names are for identifying locations in the computer memory,
    each variable name in the program must be unique and repetition avoided.'
  merge: -1
