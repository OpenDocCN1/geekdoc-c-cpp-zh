  md: '# 8.4 Automation


    Why do doors open automatically when we walk near them? Why do taps dispense water
    automatically? Why can air conditioners adjust the temperature automatically?
    These are all examples of automated devices.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_322_0.png)


    Automation lets the computer make decisions on its own according to a preset program.
    For instance, when a door with an infrared sensor detects someone walking past,
    it will open automatically. Automated devices can improve people’s lives in many
    ways. For example, they can reduce manual work, enhance cost-effectiveness and
    operate continuously to fulfil our needs. If we want our automatic device to execute
    different scenarios, we can write its program using simple conditional statements
    and relational operators.


    An example is a smart street light, which is automatically controlled by a program
    and a sensor. When the light sensor detects that the surroundings are dark, the
    LED will be turned on; when the surroundings are bright, the LED will be turned
    off.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_322_1.png)


    Fig. 8.11 The flowchart of a smart street light


    Fig. 8.12 The Input – Process – Output cycle of a smart street light'
