    | mark | 45 | 70 | 66 | 82 | 55 | 95 | 60 |

    | index | 0 | 1 | 2 | 3 | 4 | 5 | 6 |


    Suppose that the list is to be sorted in descending order:


    +   1. Starting from the leftmost item of the list, compare two adjacent items.
    If the value on the left is smaller, swap the two items.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_251_0.png)


    +   2. After the above operation has been completed on the whole list, the smallest
    value will move (rise) to the last item. This divides the list into the sorted
    and unsorted parts.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_251_1.png)'
