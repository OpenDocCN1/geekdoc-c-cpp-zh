  md: '# Types of Program Errors


    When we store a number in a variable, if that exceeds the range of values that
    can be stored in the data type of that variable, an overflow error occurs. On
    the contrary, if number is lower than the range of values that can be stored in
    the data type of variable, an underflow error occurs.


    For example, if we try to access an item outside the range of array index, or
    obtain a result that exceeds the range after calculating the two''s complement
    representation, overflow error occurs.


    > ## GOTO

    Overflow errors in the calculation of the two''s complement representation is
    mentioned in Core A 3.1.


    # Numerical errors


    # Truncation errors


    When there is insufficient memory for storing a number, we need to shorten the
    number, and one way to do is to truncate the extra digits. Truncation error refers
    to the difference between the true value and the actual value stored:


    Truncation error = | True value – Actual value stored |


    For example, if we want to save the value of π in a variable that can store three
    decimal places, only the actual value stored will be 3.141, and the truncation
    error will be 0.00592653589...


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_57_0.png)


    In Python, we can use the trunc() function in the math library to truncate the
    decimal places.


    ```

    import math

    um = 1234.56789

    integer_part = math.trunc(num)

    print(integer_part)  #1234

    ```


    Alternatively, we may make use of the int () function to truncate the decimal
    places of a float and convert the float into integer data type.


    ```

    num = 1234.56789

    integer_part = int(num)

    print(integer_part)  #1234

    ```'
  merge: -1
