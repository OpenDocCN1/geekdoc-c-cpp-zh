  md: '# 5.2 Stacks


    # A The concept and manipulation of stacks


    Imagine that you are a librarian. You need to take books from a bookshelf and
    put them onto another bookshelf. While you are taking out the books, they are
    stacked up and the first one you have taken out becomes the bottom of the stack.
    While you are putting the books back onto the bookshelf, you pick up the one at
    the top of the stack, i.e. the last book you have taken out. This mode of manipulation
    is called Last-In First-Out (LIFO).


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_155_0.png)


    A stack is a data structure that adopts the above mode of manipulation. When you
    add (push) a data item into a stack, the item will be added to the top of the
    stack; when you remove (pop) a data item from a stack, the removed item will be
    the one at the top of the stack, i.e. the last item that you have added.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_155_1.png)'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Application of stacks in computer systems


    The “undo”（復原） and “redo”（取消復原） operations that we frequently perform make use
    of the stack data structure. Suppose that we are using a drawing software.


    +   1. When we perform an operation, it will be added to the undo stack.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_156_0.png)


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_156_1.png)


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_156_2.png)


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_156_3.png)


    +   2. When we perform another operation, it will be added on top of the previous
    operation.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_156_4.png)


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_156_5.png)


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_156_6.png)


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_156_7.png)


    +   3. If we press the “undo” button, the program will follow the last-in-first-out
    mode of manipulation, which means taking our last operation from the undo stack
    and put it into the redo stack.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_156_8.png)


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_156_9.png)


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_156_10.png)'
  merge: -1
  pgno: 156
- img_proc: true
  md: '4. If we press the “redo” button, the program will pop the last operation that
    we have undone from the redo stack and put it back into the undo stack.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_157_0.png)


    5. When we perform the next operation, the program will clear the redo stack.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_157_1.png)


    Moreover, we need to use stacks when a program calls its sub-program. Call stack
    (調用堆) is a stack stored in RAM and used to coordinate sub-programs. When we call
    a sub-program, its stack frame, which stores information as return address, will
    be pushed into the call stack. When the sub-program has been executed, its stack
    frame will be popped. The following is the operating principle of a call stack.


    | Line | Code | | Call | Call | |

    |---|---|---|---|---||

    | 1 | def multiply(a, b) : | | sub-program square | sub-program area | | |

    | 2 | return a*b | | | | Line 5 |

    | 3 | | | | | Line 8 | Line 8 |

    | 4 | def area(a, b) : | | | Line 11 | Line 11 | Line 11 |

    | 5 | return multiply(a, b) | | Call stack | Call stack | Call stack |

    | 6 | | | | | | |

    | 7 | def square(n) : | | End | End | End |

    | 8 | area = area(n, n) | | sub-program multiply | sub-program area | sub-program
    square |

    | 9 | | | | Line 5 | Line 8 | Line 11 |

    | 10 | #main program | | | Line 11 | | |

    | 11 | print(square(5)) | | | Line 11 | Line 11 |

    | | | | Call stack | Call stack | Call stack |'
