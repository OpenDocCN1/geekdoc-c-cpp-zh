  md: "# A Loading records\n\nTo update records in a text file by a program, we need\
    \ to load the data into the program first, and then store and process the data\
    \ in a two-dimensional list. In Checkpoint 7.1, we understood how to store the\
    \ data in a text file as a two-dimensional list. The following two-dimensional\
    \ list record displays the contact information in the text file \"phonebook.txt\"\
    :\n\n| | 0 | 1 | 2 | 3 |\n|---|---|---|---|---|n| record | 0 | \"Rose\" | \"Wong\"\
    \ | \"Mobile\" | \"95784224\" |\n| 1 | \"Daniel\" | \"Chan\" | \"Mobile\" | \"\
    90094786\" |\n| 2 | \"Gary\" | \"Lee\" | \"Home\" | \"23546030\" |\n| 3 | \"Sally\"\
    \ | \"Ho\" | \"Mobile\" | \"68753694\" |\n\nThe following sub-program load_record()\
    \ saves the information in the text file to two-dimensional list record:\n\n```\n\
    def load_record():\n    f = open(\"phonebook.txt\", \"r\")\n    global record\n\
    \    record = f.readlines()\n    for i in range(0, len(record)):\n        record[i]\
    \ = record[i].replace(\"\\n\", \"\")\n        record[i] = record[i].split(\";\"\
    )\n    f.close()\n```\n\nThe following sub-program print_record() prints the items\
    \ of two-dimensional list record in table format:\n\n```\ndef print_record():\n\
    \    for i in range(0, len(record)):\n        for j in range(0, 4):\n        \
    \    print(record[i][j], end = \"\\t\")\n    print(\"\")\n```\n\nThe following\
    \ is the output in the shell after loading the data and calling the print_record():\n\
    \n> TIP Printing the tab character\\t advances the print cursor to the next tab\
    \ stop.\n\n```\nShell -\nPython 3.7.9 (bundled)\n>>>Run \"phonebook manager.py\"\
    \nRose Wong Mobile 95784224\nDaniel Chan Mobile 90094786\nGary Lee Home 23546030\n\
    Sally No Mobile 68753694\n```\n\n![](img/56bdb053bf3793fa85bbbf08ebb74627_295_0.png)"
  merge: -1
  pgno: 295
