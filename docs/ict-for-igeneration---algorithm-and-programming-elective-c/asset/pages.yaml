  md: "# Software Debugging Tools\n\nAfter we have finished writing a program, we\
    \ should test the program systematically and ensure that it fulfils its intended\
    \ purpose. We have used series of test data to verify the accuracy of programs.\
    \ Substitute the data into the program and run it, and then compare the test result\
    \ with the expected result. If the test result does not match the expected result,\
    \ it means the program contains errors.\n\n![](img/56bdb053bf3793fa85bbbf08ebb74627_61_0.png)\n\
    \nWhen the program is found to contain bugs, we must identify the locations where\
    \ they occur, so that we can formulate effective solutions and eliminate all errors.\
    \ This process is known as debugging. Flags and stubs are some of the manual ways\
    \ of debugging. Other than these, many Integrated Development Environments provide\
    \ some debugging functions to help test and debug our programs.\n\n+   - Stubs\
    \ are explained in detail in Elective C section 4.6.\n\n# Tracing variable values\n\
    \nWe have used dry runs and trace tables to analyse program codes by line, tracing\
    \ the flow of the program and the values of all variables. Using the debug mode\
    \ of the IDE, we can execute the program step by step and monitor the variable\
    \ in the program to spot any errors. This method is known as program trace.\n\n\
    +   - The debug mode of Thony is mentioned in Core D 6.2.\n\n```\ndebug.py\nA\
    \ = 1\nB = 2\nif A > B:\n    print(B-A/2)\nelse:\n    print(A-B/2)\n```\n\n# Breakpoints\n\
    \nA breakpoint is the position where the execution of a program is paused, we\
    \ can view its current status in the IDE, such as the current values of variables,\
    \ in order to find out the error is before or after the breakpoint. We usually\
    \ add a breakpoint before a conditional statement or the part that we want to\
    \ test."
