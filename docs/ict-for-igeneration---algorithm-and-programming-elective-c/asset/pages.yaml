  md: "# CHAPTER SUMMARY\n\n# Focus Sub-programs / Functions\n\nA modularised design\
    \ helps us solve complicated problems. Sub-programs / functions are modules broken\
    \ down from a program, and these modules can be used independently and repeatedly.\
    \ The following are some common types of sub-programs:\n\n| Without inputs and\
    \ outputs | With inputs but without outputs |\n| --- | --- |\n| Input | Input\
    \ |\n| printSomething() Output | printList(numList) Output |\n| Without inputs\
    \ but with outputs | With inputs and outputs |\n| Input | Input |\n| luckyDraw()\
    \ Peter Output | sum(a, b) 3 Output |\n\n# Defining sub-programs\n\nEach sub-program\
    \ or function represents multiple lines of code, and it must be defined before\
    \ being called.\n\n+   - Sub-program name For identifying the sub-program\n- Formal\
    \ parameters List the parameters to be passed to the sub-program\n- Indentation\
    \ Indicate which statements are in this sub-program\n- Main body of the sub-program\
    \ Every time the sub-program is called, the statements in this part will be executed\
    \ once\n- Return value After the call has ended, the sub-program sends this piece\
    \ of data back to the program\n\n```\ndef addAll(n1, n2, n3, n4, n5):\n    result\
    \ = n1 + n2 + n3 + n4 + n5\n    return result\n```"
