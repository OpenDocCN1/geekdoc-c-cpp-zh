    # Other errors


    Apart from numerical errors, other kinds of errors may appear in a program, which
    prevent the program from running properly and may even lead to wrong results.
    Program errors include syntax errors, logical errors and run-time errors.


    | Syntax errors | Logical errors | Run-time errors |

    |---|---|--|

    | Definition | The code cannot be compiled and executed because it breaks the
    rule of the programming language. | The program behaves (functions) abnormally
    or produces results because of errors in terms of logic. | When the program is
    running, it encounters a problem and stops unexpectedly. |

    | Examples | - Missing columns<br>- Misspelt keywords<br>- Wrong choice of letter
    case<br>- Missing indentation or brackets | - Errors in the sequences<br>- Errors
    in the control structure of conditional statements<br>- Infinite loops | - Dividing
    by a number zero<br>- Calculating the square root of a negative number<br>- Accessing
    an item that is outside the range of the array index |

    | How to detect | IDE can detect syntax errors. | Test the logical flow of the
    program with test data. | IDE will display the error message after the program
    has stopped. |'
