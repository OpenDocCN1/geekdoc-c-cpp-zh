  md: 'Programs will process the operators with higher precedence. If some operators
    have the same precedence, the expression should be processed according to the
    direction in which operators associate.

    Take `-1 + 2 * 2 + 2 ** 3 ** 2` as an example,


    ```

    -1 + 2 * 2 + (2 ** (3 ** 2))

    ```


    The operator `**` has a higher precedence


    ```

    -1 + 2 * 2 + (2 ** (3 ** 2))

    ```


    The expression in the brackets should be processed from right to left


    ```

    (-1) + 2 * 2 + 512

    ```


    The negative sign – “has a higher precedence


    ```

    ((-1) + (2 * 2) + 512

    ```


    The operator `**` has a higher precedence


    ```

    ((-1) + 4) + 512

    ```


    The expression should be processed from left to right


    ```

    3 + 512

    ```


    515


    Therefore, the above expression should be interpreted as `(-1) + (2 * 2) + (2
