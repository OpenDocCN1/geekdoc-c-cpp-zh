  md: '# 7.2 String Processing


    Same as numbers (integers and floats), strings are one of the most frequently
    processed data types in Python. In the previous chapters, we have learnt about
    using loops to process each character in a string sequentially. In this section,
    we will learn more ways to process strings in Python.


    > GOTO


    String functions in Python are similar to text functions in spreadsheets. You
    can read section 4.4 in Core A for details.


    # A Searching strings


    We can easily find whether the target character exists in a string using loops,
    but for finding the target string in a string is more complicated. Python provides
    the find() function for us to search a string for the target string, and then
    returns the result:


    +   - If the target string is found, the function returns the index of its first
    occurrence:

    - If the target string is not found, the function returns -1.


    ```

    the_string.find("is")

    String to be searched      Target string

    ```


    > GOTO


    In 2 of Checkpoint 3.3 in Elective C, nested loops are used to find whether the
    target string is in a string.


    Sample Python program:


    ```

    the_string = "This is a string"

    position = the_string.find("is")

    print(position)

    ```


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_285_0.png)


    Apart from starting the string from the beginning (index 0), we may also specify
    the range for searching the target string:


    ```

    the_string.find("is", 3)

    String to be searched      Target string Start index

    ```


    Sample Python program:


    ```

    the_string = "This is a string"

    position = the_string.find("is", 3)

    print(position)

    ```


