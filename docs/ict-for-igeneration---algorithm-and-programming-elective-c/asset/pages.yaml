    # Video Game Modding


    Game modifications, also known as game mods, are small programs through which
    players of a game can introduce their own alterations to the game. Game modding
    demonstrates the idea of sub-program and modularity as different game modders
    each create single stand-alone mods that modify a small part of the game. Through
    the collaborative effort of gamers and programmers, a pre-existing game can be
    enhanced.


    There are many different types of game mods, such as mods that change the game''s
    appearance and provide unofficial patches for bugs. Many popular video games support
    game modding, and users have written and uploaded thousands of mods to websites
    such as Mod DB.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_107_1.png)'
  merge: -1
