  md: '# Sorting Algorithms


    # Selection sort


    Selection sort repeatedly carries out linear search in the unsorted part of the
    list in order to find the maximum or minimum value, this value is swapped with
    the first item of the unsorted list so as to set up the sorted part of the list.
    This process is repeated until all list items have been sorted.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_270_0.png)


    # Insertion sort


    Insertion sort divides the list into sorted and unsorted parts, then one of the
    list items in the unsorted part (key value) is inserted into the correct position
    in the sorted part of the list. This process is repeated until all list items
    have been sorted.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_270_1.png)


    # Bubble sort


    Bubble sort starts from the first item of the list and compares an item with its
    adjacent item. If the two items are in the wrong positions, they will be swapped.


    ![](img/56bdb053bf3793fa85bbbf08ebb74627_270_2.png)'
