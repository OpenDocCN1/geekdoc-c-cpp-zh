  md: "# Searching for records\n\nThe following sub-program search_recordByFirstName(firstname)\
    \ uses linear search to search for the existence of the target name firstname\
    \ in the list, and returns the search result:\n\n+   - If the imputed name exists\
    \ in the list, the sub-program returns the row number of that record at the end;\n\
    - If the imputed name does not exist in the list, the sub-program outputs -1 at\
    \ the end.\n\n```\ndef search_recordByFirstName(firstname):\n  for i in range(0,\
    \ len(record)):\n    if record[i][0] == firstname:\n      return i\n  return -1\n\
    ```\n\n> THINK ABOUT\nWhat is the return value of calling the sub-program search_recordByFirstName(\"\
    Gary\")?\n\n# Deleting records\n\nThe following sub-program delete_recordByFirstName(firstname)\
    \ replaces the whole record of the target name firstname with the string \"\"\
    \ to indicate that the record has been deleted:\n\n```\ndef delete_recordByFirstName(firstname):\n\
    \  row = search_recordByFirstName(firstname)\n  if row != -1:\n    for j in range(0,\
    \ 4):\n      global record\n      record[row][j] = \"-\"\n```\n\nThe following\
    \ is the output in the shell after loading the data and calling the sub-programs\
    \ delete_recordByFirstName(\"Gary\") and print_record() sequentially:\n\n![](img/56bdb053bf3793fa85bbbf08ebb74627_296_0.png)"
