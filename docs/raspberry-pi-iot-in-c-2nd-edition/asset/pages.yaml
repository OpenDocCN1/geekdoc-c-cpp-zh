  md: "# # How Fast Is An Interrupt?\n\nFinally the big problem with this approach\
    \ to interrupts is speed. Let's find out how much overhead is inherent in using\
    \ it by repeating the pulse width measurement. This time, we can't simply print\
    \ the results as this would stop the interrupt-handling. As a compromise, we save\
    \ 20 readings in an array and then print them. It is also important to keep the\
    \ interrupt-handling routines short as long they take to complete governs how\
    \ fast the next interrupt can be handled.\n\nThe new interrupt handler is:\n\n\
    ```\nuint64_t t[20];\nint count=0;\nvoid myHandler(int fd) {\n    struct gpio_event\
    \ edata;\n    read(fd,&edata, sizeof edata);\n    t[count++]=edata.timestamp;\n\
    \    if(count>19) {\n        for(int i=1;i<19;i++) {\n            printf(\"%llu\
    \ \\n\\r\", t[i]-t[i-1]);\n        }\n        flush(stdout);\n    }\n    count=0;\n\
    }\n```\n\nNotice we have the interrupt handler called when there is a rising edge.\
    \ It records reasonably accurate times for pulses longer than 60 milliseconds\
    \ on a Pi Zero. This makes this approach to interrupts suitable for infrequent,\
    \ non-urgent, and unsuitable for fast protocols or high priority tasks. The very\
    \ slow timing is most probably due to the time to stop and restart the thread,\
    \ coupled with a slow processing of the hardware interrupt. Even so, 60ms is very\
    \ slow and there might be a scheduling or some other tweak that would make it\
    \ faster. Using FIFO decoding doesn't seem to help, see Chapter 21.\n\nYou can\
    \ get an idea of how things are working by toggling a GPIO line at the end of\
    \ the interrupt handler and comparing this with the input signal:\n\n![](img/175b89abfcdc9824337e5b1ac4bb1ef3_129_0.png)"
