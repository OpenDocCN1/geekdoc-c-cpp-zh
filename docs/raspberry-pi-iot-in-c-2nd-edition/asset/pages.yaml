  md: "Looking at the output of the logic analyzer reveals that we can work with pulses\
    \ at around 1.2MHz but we occasionally miss a pulse:\n\n| 1234539s | +1us | +2us\
    \ | +3us |\n|---|---|---|---|\n| | | Width: 420ns |\n| | | Period: 840ns |\n|\
    \ | | DutyCycle: 50% Frequency: 1.1904716MHz |\n\n# The Finite State Machine\n\
    \nIf you are working with an application that requires that you deal with a complex\
    \ set of input and output lines then you need an organizing principle to save\
    \ you from the complexity. When you first start writing IoT programs that respond\
    \ to the outside world you quickly discover that all of your programs take a similar\
    \ form:\n\n```\nfor(;;{\n  wait for some input lines\n  process the input data\n\
    \  write some output lines\n  wait for some input lines\n  read some more input\
    \ lines\n  write some output lines\n}\n```\n\nFor most programmers this is a slightly\
    \ disturbing discovery because programs are not supposed to consist of infinite\
    \ loops but IoT programs nearly always, if principle not in practice, the take\
    \ of an apparently infinite loop. A second, and more important, aspect is the\
    \ way in which reading and writing GPIO lines is related to be so complex that\
    \ it can be difficult to see exactly when any particular line is read and when\
    \ it is written.\n\nIt is natural to try to find implementations that make this\
    \ simpler. In most cases programmers discover or invent the idea of the event\
    \ or better the interrupt. In this case when something happens in the outside\
    \ world a function is automatically called to deal with it and the relation between\
    \ the external state and the system's response is seemingly well defined. Of course,\
    \ in practice it isn't, as you have to deal with what happens when multiple events\
    \ or interrupts occur at the same, or nearly the same, time."
