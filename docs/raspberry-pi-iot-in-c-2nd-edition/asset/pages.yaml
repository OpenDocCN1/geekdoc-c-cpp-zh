  md: '# Summary


    +   - The serial port is one of the oldest ways of connecting devices together,
    but it is still very much in use.


    +   - The serial protocol is asynchronous, but simple. A start bit gives the timing
    for the exchange.


    +   - There are many control lines once used with telephone equipment that are
    mostly ignored in computer use. Similarly, the original ±12V signaling has been
    mostly replaced by 5V, and even 3.3V, signaling.


    +   - The standard hardware that implements a serial connection is usually called
    a UART.


    +   - The Raspberry Pi Zero, 1, 2, and 3 contain two UARTs and the Raspberry Pi
    4 has both these plus four additional ones.


    +   - If you want to use a UART within your program, you first have to configure
    things so that Linux isn''t using it as command console.


    +   - The serial port is used in C programs as if it was a file, but there are
    many ways to configure it using the ioctl function.


    +   - The ioctl function is too low-level for most applications and termios a
    better way to do the job.


    +   - Termios can be used to set the protocol, baud rate, parity, etc and to determine
    how the software interacts with the UART, timeout etc.


    +   - You can use a UART to input data in blocking mode or non-blocking mode or
    something between the two.


    +   - The UART can be repurposed to work with any asynchronous signaling where
    the time to transmit a single bit is constant.'
