- img_proc: true
  md: "# A First IoT Program\n\nThis purpose of this program is to just let you check\
    \ that everything is working; the functions used will be explained in detail later.\n\
    \nStart a new project, call it Blink, and make sure you add the BCM 2835 library\
    \ to the linker options, as just described.\n\nThen enter the program:\n\n```\n\
    #include <bcm2835.h>\n#include <stdio.h>\nint main(int argc, char **argv) {\n\
    \    if (!bcm2835 gpio_init()) {\n        return 1;\n    }\n    bcm2835 gpio_fsel(RPI_BPLUS_GPIO_J8_07,BCM2835_GPIO_FSEL_OUTP);\n\
    \    while (1) {\n        bcm2835 gpio_write(RPI_BPLUS_GPIO_J8_07, HIGH);\n  \
    \      bcm2835_delay(500);\n        bcm2835 gpio_write(RPI_BPLUS_GPIO_J8_07, LOW);\n\
    \        bcm2835_delay(500);\n    }\n    bcm2835 close();\n    return 0;\n}\n\
    ```\n\nDon't panic when NetBeans initially shows you lots of errors. If you build\
    \ or run the project NetBeans will notice of the header files and stop worrying\
    \ about identifiers like bcm2835_init(). Once the project has been built NetBeans\
    \ knows all about the new library and syntax check and offer code completion hints.\
    \ If things don't work right-click on the project and select Code Assistance,\
    \ Clean/ Cache and C/C++ and restart IDE. If none of this works the only options\
    \ are that you haven't included the header or/or you haven't added the library\
    \ file to the linker.\n\nEven though you don't know how much about the library\
    \ just yet, it isn't difficult to understand what is going on in the program.\
    \ First we try to initialize the library. If this works, GPIO Pin 7 is set to\
    \ be an output and the loop turns it on and off (high voltage turn) with a delay\
    \ of half a second. The library uses physical pins rather than logical GPIO numbers\n\
    RPI_BPLUS_GPIO_J8_07 is Pin 7 on connector J8."
  merge: -1
  pgno: 37
- img_proc: true
  md: 'If you want to connect an LED to see the "blinking" for real then this is easy
    enough, but you do need a current-limiting resistor – 200Ω is a good choice.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_38_0.png)


    How you build the circuit is up to you. You can use a prototyping board or just
    a pair of jumper wires. The short pin and/or the flat on the side of the case
    marks the negative connection on the LED – the one that goes to Pin 6


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_38_1.png)


    If you can''t be bothered to go though the ritual of testing "Blinky" with a real
    LED, then just connect a logic analyzer to Pin 7 and you will see one-second pulses.'
