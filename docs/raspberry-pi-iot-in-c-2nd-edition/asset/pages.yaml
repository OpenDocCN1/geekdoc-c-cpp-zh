  md: "```\nThe complete program is:\n#include <stdio.h>\n#include <stdlib.h>\n#include\
    \ <bcm2835.h>\n\n#define CLK GP0 CTL 28\n#define CLK GP0 DIV 29\nvoid bcm2835GPI04_set_clock_source(uint32_t,\
    \ uint32_t, uint32_t);\n\nint main(int argc, char** argv) {\n    if (!bcm2835\
    \ init()) {\n        return 1;\n        bcm2835 gpio_fsel(4, Bcm2835 GPIO_FSEL\
    \ ALTO);\n        bcm2835 GPI04_set_clock_source(6, 50, 0);\n}\n\nvoid bcm2835GPI04_set_clock_source(\n\
    \    uint32_t source,\n    uint32_t divisorI,\n    uint32_t divisorF) {\n\n  \
    \  divisorI &= 0xff;\n    divisorF &= 0xff;\n    source &= 0x7;\n    uint8_t mask=bcm2835_peri_read(bcm2835_clk\
    \ + CLK_GP0_CTL) & 0xffffff;\n    bcm2835_peri_write(bcm2835_clk + CLK_GP0_CTL,\
    \ Bcm2835 PWM PASSWRD | mask);\n    while ((bcm2835_peri_read(bcm2835_clk + CLK_GP0_DIV)\
    \ != 0) {\n        bcm2835_peri_write(bcm2835_clk + CLK_GP0_DIV, Bcm2835 PWM PASSWRD\
    \ | (divisorI << 12) | divisorF);\n        bcm2835_peri_write(bcm2835_clk + CLK_GP0_CTL,\
    \ Bcm2835 PWM PASSWRD | source|0x200);\n        bcm2835_peri_write(bcm2835_clk\
    \ + CLK_GP0_CTL, Bcm2835 PWM PASSWRD | 0x0210 | source);\n}\n```\n\nLearning to\
    \ access the GPIO registers using memory mapping is important, not only for using\
    \ the GPIO lines, but also for extending what can be done on the registers. Once\
    \ you understand how Linux performs memory mapping, you can see that it is a general\
    \ mechanism that can be applied in other situations. However, the mechanism that\
    \ you can start out using the library and only think about doing anything more\
    \ complicated if it proves necessary. Before implementing your own memory mapping,\
    \ make sure that your low-level register functions. are almost as fast as anything\
    \ you can create."
