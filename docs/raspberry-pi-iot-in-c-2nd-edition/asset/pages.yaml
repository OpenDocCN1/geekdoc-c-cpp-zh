  md: '# A Web Client


    We now have enough information to implement our first socket program, a web client.
    It has to be admitted that a web client isn''t as common a requirement as a web
    server, but it is simpler and illustrates most of the points of using sockets
    to implement an HTTP transaction.


    The first thing we have to do is create a socket and the TCP needed for an HTTP
    transaction:


    ```

    int sockfd = socket(AF_INET, SOCK_STREAM, 0);

    ```


    To allow this to work you have to add:

    #include <sys/socket.h>


    Next we need to get the address of the server we want to connect to. For the web
    this would usually be using a DNS lookup on a domain name. To make things simple
    we will skip the lookup and use a known IP address, example.com, which is a domain
    name provided for examples. You can find its address by pinging it and at the
    time of writing it was hosted at: 93.184.216.34


    This could change check before concluding that "nothing works".


    There are three fields in the address structure:


    ```

    struct sockaddr_in addr;

    .sin_family = AF_INET;

    ```


    to indicate an internet IPv4 address. The next field is the port number of the
    IP address, but you can''t simplify addr.sin_port = 80; because the bit order
    used on the Internet isn''t the same as used on most processors. Instead, you
    have to use a utility function that will ensure the correct order: addr.sin_port
    = hons(80);


    The function name stands for "host to network short" and there are other similarly
    named functions.


    The actual address is defined in the in_addr field. This is a struct with only
    one field that you need to know about, s_addr, a 32-bit representation of an IP
    address. The format is fairly simple. Regard the 32-bit value as four bytes with
    each byte coding one value of the "dotted" IP address.'
  merge: -1
  pgno: 316
- img_proc: true
  md: "That is, if the IP address is w.x.y.z then w, x, y and z are the bytes of s_addr.\n\
    For example, the IP address of example.com is 93.184.216.34 and converting each\
    \ value into its byte equivalent gives 5d.b0.d8.22, which would be the hex value\
    \ which we have to store in s_addr if if it wasn't for the fact that the bytes\
    \ are stored in reverse order. So, the hex equivalent of the IP address is 0x22d8b8b5\
    \ and this is used to initialize the addr struct:\n\n```\naddr.sin_addr.s_addr\
    \ = 0x22d8b8b5;\n```\n\nTo make all this work you need to:\n\n```\n#include <sys/types.h>\n\
    #include <unistd.h>\n#include <netinet/in.h>\n```\n\nWith the address worked out\
    \ and safely stored we can now make the connection:\n\n```\nconnect(sockfd, &addr,\
    \ sizeof(addr));\n```\n\nThis will return 0 if it successfully connects and we\
    \ need to test for this condition. You will also get a warning because the pointer\
    \ to the addr structure is not as defined in the function. In fact there are many\
    \ variations of the addr structure you could pass and it is the standard idiom\
    \ to cast them to the function's pointer type:\n\n```\nconnect(sockfd, struct\
    \ sockaddr *) &addr, sizeof(addr))\n```\n\nFinally we need to check for an error:\n\
    \n```\nif(connect(sockfd, struct sockaddr *) sizeof(addr))<0)\n   return -1;\n\
    ```\n\nAs long as there is not we can start to send and receive data. But what\
    \ data? The answer is that it depends on the protocol you are using. There is\
    \ nothing about a socket that tells you what to send. It is a completely general\
    \ I/O mechanism. You can send anything, but if you don't send what the server\
    \ is expecting you will never get very far.\n\nThe web uses HTTP protocol and\
    \ this is essentially a set of text headers that tell the server what to do, and\
    \ a set of headers that the server sends back to you what you tell it.\n\nThe\
    \ most basic transaction the client can have with the server is to send a GET\
    \ request for the server to send a particular file. The simplest header is: char[]\
    \ = \"GET/index.html HTTP/1.1\\r\\n\\r\\n\";\n\nwhich is a request for the server\
    \ to send index.html. However, in most cases we need one more header, HOST, which\
    \ gives the domain name of the server. Why do we need to do this? Simply because\
    \ HTTP says you should and many websites are hosted by a single server at the\
    \ same IP address.\n\n318"
  merge: -1
  pgno: 317
- img_proc: true
  md: 'Which website the server retrieves the file from is governed by the domain
    name you specify in the HOST header.


    This means that the simplest set of headers we can send the server is:


    ```

    char header[] = "GET /index.htm HTTP/1.1\r\nnHOST:example.org\r\n\r\n";

    ```


    which corresponds to the headers:


    ```

    GET /index.html HTTP/1.1

    HOST:example.org

    ```


    An HTTP request always ends with a blank line. If you don''t send the blank line
    you will get no response from most servers. In addition the HOST header has to
    have the domain name with no syntax - no slashes and no http: or similar.


    With the headers we can send our first HTTP request using write as if the socket
    was just another file to write to:


    ```

    int n = write(sockfd, header, strlen(header));

    and, of, to use the function we need to add:

    ```


    #include <string.h>

    The server receives the HTTP request and should respond by sending the data corresponding
    to the file specified, i.e. index.html. We can read the response just as if the
    socket was a file:


    ```

    char buffer[2048];

    n = read(sockfd, buffer, 2048);

    printf("%s", buffer);

    ```


    You can make this more complicated by checking the number of bytes read and reading
    more if the buffer is full, but this is a simple and direct way to get the HTML
    in. The more you get the HTML as you get the entire HTTP response including the
    response headers:


    ```

    HTTP/1.1 200 OK

    Cache-Control: max-age=604800

    Content-Type: text/html

    Date: Sun, 14 Aug 2016 15:30:44 GMT

    ETag: "359670651+gzip+ident"

    Expires: Sun, 21 Aug 2016 15:30:44 GMT

    Last-Modified: Fri, 09 Aug 2013 23:54:35 GMT

    Server: ECS (werf/159)

    Vary: Accept-Encoding-Cache: HIT

    x-custom-error: 1

    Content-Length: 1270

    <!doctype html>

    <head>

    ```


    and so on...'
