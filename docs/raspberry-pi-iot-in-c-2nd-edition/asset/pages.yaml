- img_proc: true
  md: 'As not all GPIO lines are available for use you cannot all of the UART modes.
    The table column "Available" has one asterisk if a line is available but is generally
    used for something else, two asterisks if it has a rarely used alternative function,
    and three asterisks if it is usually just a GPIO line.


    You can see that you can use:


    +   * UART0 on GPIO14 and GPIO15

    * UART1 on GPIO14 and GPIO15

    * UART2 on GPIO0 and GPIO1 optionally CTS/RTS on GPIO2 and GPIO3

    * UART3 on GPIO4 and GPIO5 optionally CTS/RTS on GPIO6 and GPIO7

    * UART4 on GPIO8 and GPIO9 optionally CTS/RTS on GPIO10 and GPIO11

    * UART5 on GPIO12 and GPIO13 optionally CTS/RTS on GPIO14 and GPIO15

    * Of these, UART3 on GPIO4 and GPIO5 is the best to use from the point of viewing
    other functions usable.


    Notice that by all UARTs from the primary interface on GPIO14 and GPIO15 is disabled.
    You could enable them by directly writing to their control registers, but it is
    better to allow Linux to do the job for you. The reason is if you let Linux handle
    the serial ports then you get all the advantages of interrupt driven buffering
    provided by the kernel. If you drive the serial ports from user mode, you have
    to contend with Linux scheduling and lack of interrupts.


    To summarize:


    +   * The Pi Zero and earlier models only have UART0 and UART1 and UART1 is a
    mini-UART which isn''t as sophisticated. For IoT you need to use UART0 and to
    do this have to disable its use in Bluetooth or swap the rolls of UART1 and UART0.

    * The Pi 4 has UART0 to UART5 and they are all usable but UART1 is still used
    for Bluetooth.


    # Linux Device Names


    Linux lets you work with a serial console via a device name of the form tty.


    You can see which devices have been defined using:


    ```

    ls -dev

    ```


    You will see ttyAMA0 and ttyS the mini-UART in the list on all versions of the
    Pi. Earlier in the list you will also see serial0 and serial1.


    Linux by default opens a console on whichever UART is assigned to serial0 – i.e.
    ttyS0 the mini-UART on all unmodified Bluetooth devices and ttyAMA0 on all others.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_260_0.png)'
