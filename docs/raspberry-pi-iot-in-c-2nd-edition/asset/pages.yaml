  md: '# Local v Remote


    There are two distinct ways you can work with NetBeans and the Pi:


    +   - You could install NetBeans on a Raspberry Pi and work with it via the GUI
    desktop i.e. directly on the Pi. In this case you are using the Pi as if it was
    a full desktop computer and it is your development and test machine.


    +   - You could connect the Pi to a desktop machine and make use of the remote
    development features of NetBeans. In this case you are using the Pi as a build
    host and the desktop machine as the environment.


    In both cases the Pi does the compiling and the running of the program. In practice,
    the remote development approach tends to work better because the desktop machine
    has the power to run NetBeans. If you are using a Pi4 to test your code then using
    to host NetBeans is reasonable. Running NetBeans on a Pi Zero is less than ideal
    and a Pi3 is on the slow side.


    Another advantage of running NetBeans on another machine is that you can change
    the Pi that you are testing on easily preserving all of the code stored on the
    desktop machine. This is very useful because you can try out your program on a
    range of Raspberry Pis and swap machines simply by changing the build host used
    for the project. The desktop machine can be a Windows, OSX, or even another Linux
    machine.


    Before we get down to work, we find out how to set up NetBeans on a Pi or a desktop
    machine.


    # Installing NetBeans


    Important Note: NetBeans has moved from Oracle to being an Apache project. In
    the transition much of the simplicity of installing the latest version and setting
    up C development has been lost. This said, installing the latest version, 12,
    isnt difficult but the procedure might well change in the future. Check with this
    book''s web page at iopress.info for the latest news about NetBeans.


    NetBeans is a Java program that will work on any machine that supports a Java
    Virtual Machine (JVM) and the Pi comes with a JVM already installed as part of
    Pi OS. If you are installing NetBeans on a PC or a Mac you need to check that
    Java is installed and if it isn''t you need to install it.'
  merge: -1
