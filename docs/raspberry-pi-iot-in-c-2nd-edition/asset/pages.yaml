  md: '# Summary


    +   PWM, Pulse Width Modulation, has a fixed repetition rate but a variable duty
    cycle, i.e. the amount of time the signal is high or low changes.


    +   PWM can be generated by software simply by changing the state of a GPIO line
    correctly, but it can also be generated in hardware so relieving the processor
    of some work.


    +   As well being a way of signaling, PWM can also be used to vary the amount
    of power or voltage transferred. The higher the duty cycle, the more power/voltage.


    +   The Pi has two hardware PWM lines and these are capable of a range of operational
    modes.


    +   The PWM lines are controlled by two counters – data, which sets the line is
    high, and range, which sets the repeat rate. Both work in terms of number of clock
    pulses.


    +   You can select mark/space mode which distributes the high time more evenly
    across the repeat time to smooth out power/voltage transfer.


    +   Hardware PWM can generate high speed pulses, but how quickly you change the
    duty cycle is still software-limited.


    +   PWM can be used to implement a DtoA converter simply by varying the duty cycle.


    +   By the same way, by varying the output of the DtoA you can create music.


    +   In the same way, by varying the duty cycle, you can dim an LED. As the brightness
    of an LED is not linear with applied voltage, you have to modify the output using
    a cubic law to get linear changes in brightness.


    +   Servo motors set their position in response to the duty cycle of a PWM signal.


    +   The PWM lines in the Pi are sophisticated and there are many non-standard
    configurations you can use to push the performance beyond the norm.'
  merge: -1
