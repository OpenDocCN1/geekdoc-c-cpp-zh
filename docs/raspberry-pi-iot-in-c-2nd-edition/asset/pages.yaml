  md: "You can be sure that the deadlines will be met because the scheduler computes\
    \ the feasibility of the requested schedule and setattr will return with an EBUSY\
    \ error when you add a thread that makes it impossible.\nnTo see how this works,\
    \ implement a simple task that prints “sensor” every two seconds. The first problem\
