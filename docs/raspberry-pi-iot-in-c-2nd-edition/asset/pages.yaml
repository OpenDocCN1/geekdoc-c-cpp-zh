  md: "# FSM Hold Button\n\nAs a slightly complicated example of using the FSM approach,\
    \ let's implement the button with hold. You might think that button with hold\
    \ has three states – button not pushed, button pushed and button held. You implement\
    \ it in this way, but there is an argument that there are still two states – not\
    \ pushed and pushed. The held state is better implemented as extra input data\
    \ to the state, i.e. the time the button has been in the pressed state. Remember,\
    \ the output of a FSM depends on the state and the input and in this\n\n```\n\
    #include <stdio.h>\n#include <stdlib.h>\n#include <bcm2835.h>\nint main(int argc,\
    \ char** argv) {\n    if (!bcm2835 init(argv)) return 1;\n    bcm2835 gpio fsel(RPI\
    \ BPLUS GPIO_J8_07, BCM2835_GPIO_FSEL INPT);\n    bcm2835 gpio set_pull(RPI BPLUS\
    \ GPIO_J8_07, BCM2835_GPIO_PUD_UP);\n    uint64_t t,;\n    while (1) {\n     \
    \   t = bcm2835 st_read();\n        i = bcm2835 gpio_lev(RPI BPLUS_GPIO_J8_07);\n\
    \        switch (s) {\n            case 0: //Button not pushed\n             \
    \   if (!i) {\n                    s = 1;\n                    tpush = t;\n  \
    \              }\n                break;\n            case 1: //Button pushed\n\
    \                if (i) {\n                    s = 0;\n                    if\
    \ ((t - tpush) > 50000000) {\n                        printf(\"Button held \\\
    n\\r\");\n                    } else {\n                        printf(\"Button\
    \ pushed \\n\\r\");\n                    }\n                }\n              \
    \  fflush(stdout);\n                break;\n            default:\n           \
    \     s = 0;\n        }\n        t = bcm2835 st_read() - t;\n        bcm2835_delayMicroseconds(1000)\
    \ - t;\n    }\n    return 0;\n}\n```"
