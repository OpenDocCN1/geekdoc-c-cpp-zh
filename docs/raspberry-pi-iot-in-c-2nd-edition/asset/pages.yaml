  md: "# Summary\n\n+   - Making SPI work with any particular device has four steps:\n\
    \  1. Discover how to connect the device to the SPI pins. This is a matter of\
    \ identifying pinouts and mostly what chip selects are supported.\n  2. Find out\
    \ how to configure the Pi's SPI bus to work with the device. This is mostly a\
    \ matter of clock speed and mode.\n  3. Identify the commands that you need to\
    \ send to the device to get it to do something and what data it sends back as\
    \ a response.\n  4. Find, or work out, the relationship between the raw reading,\
    \ the voltage and the quantity it represents.\n- The MCP3000 range of AtoD converters\
    \ is very easy to use via SPI.\n- You can read data at rates as fast as 70kHz\
    \ which is fast enough for some audio applications."
