  md: 'Another, and arguably neater, way of doing the same job is to use the systemd

    systemctl command to stop the serial console service. For example, to stop

    ttyAMA0 you would use:


    ```

    sudo systemctl stop serial-getty@ttyAMA0

    ```


    After this program is free to use the ttyAMA0 UART until the next time

    the system boots. If you want to disable the service for subsequent boots then

    use:


    ```

    sudo systemctl disable serial-getty@ttyAMA0.service

    ```


    Of course, if the service want to make use of ttyS0, use the commands

    to stop and disable that instead.


    Neither of these changes change /boot/cmdline and so you probably won''t

    have modify enable=uart, but it is worth checking.


    If you don''t want to modifying the operating system configuration, a reasonable

    approach is to execute the stop command from within the program. The

    proper way to do this is to learn about system and dbus, but a simpler way is

    to use the system command which can be used to run another program.


    To disable the use of ttyAMA0 as a console use the system function:

    system("sudo systemctl stop serial-getty@ttyAMA0.service\nbefore open the file.


    You should check for an error if the system function returns -1.


    When you are trying to debug a serial port:


    +   - If you get a Device not found error then the problem is most likely

    that you don''t have uart=1 in the /boot/config.txt file.

    - If the program works, but you don''t get sensible results and you have

    set the baud rate ect correctly, the chances are you haven''t disabled

    the Linux console.


