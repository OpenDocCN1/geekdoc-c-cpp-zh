  md: "# GPIO Output\n\nThe next step up is to set a GPIO line to output and use it.\
    \ This involves only a few more ideas than the previous example. We need to go\
    \ through the same steps, but in this case we first use the GPIO chip to make\
    \ a GPIO handler device. This represents multiple GPIO lines, i.e. you can work\
    \ with a group of lines, not just one at a time. This is a two-stage process.\
    \ First get the GPIO chip and ask it to configure the GPIO lines and return a\
    \ new file descriptor to the GPIO lines. The request constant for setting a line\
    \ to a particular state and returning a new file descriptor that references the\
    \ line set is:\n\n```\nGPIO_GET_LINEHANDLE_IOCTL\n```\n\nThe appropriate struct\
    \ {\n\n```\nstruct gpiohandle_request {\n    u32 offsets[GPIOHANDLE_MAX];\n  \
    \  u32 flags;\n    u8 default_values[GPIOHANDLE_MAX];\n    char consumer_label[32];\n\
    \    u32 lines;\n    int fd;\n};\n```\n\nThis has to be initialized to sensible\
    \ values before the ioctl call. The lineoffsets array is simply a list of GPIO\
    \ line numbers that you want to set. The flags field is one of:\n\n+   - GPIOHANDLE_REQUEST_OUTPUT\n\
    - GPIOHANDLE_REQUEST_INPUT\n- GPIOHANDLE_REQUEST_ACTIVE_LOW\n- GPIOHANDLE_REQUEST_OPEN_DRAIN\n\
    - GPIOHANDLE_REQUEST_SOURCE\n\nall of the lines specified in lineoffsets are set\
    \ to the same state. Notice that you can OR the flags together where this makes\
    \ sense, for example to request an active low output with an open drain. Two additional\
    \ flags will be made available in:\n\n+   - GPIOHANDLE_REQUEST_PULL_UP\n- GPIOHANDLE_REQUEST_PULL_DOWN\n\
    \nThe default_values array sets output lines to high or low depending on whether\
    \ you store 1 or 0 in each element."
