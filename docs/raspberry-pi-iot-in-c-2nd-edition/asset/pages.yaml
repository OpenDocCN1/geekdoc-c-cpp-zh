- img_proc: true
  md: 'Now we can use epoll on the file having something to read. The epoll system
    call accepts an array of epoll_event structs that tells it what it is waiting
    for and to return the results. In this case we have only a single file descriptor
    and we are waiting for the file to have something to read:


    ```

    static struct epoll_event ev;

    ev.events = EPOLLIN;

    ev.data.fd = req.fd;

    ```


    The events field specify what the epoll is waiting for - EPOLLIN means that we
    are waiting for the file to be ready to read. The data. fd field specifies the
    file that the event is associated with.


    Once the array of structs, or just the single element in our example, it is set
    up we can add it to an epoll instance, which just happens to be a file:


    ```

    int epfd = epoll_create(1);

    t res = epoll_ctl(epfd, EPOLL_CTL_ADD, req.fd, &ev);

    ```


    The first instruction creates the epoll entity which is in the kernel and returns
    a file descriptor to it. The parameter specifies the number of events it will
    monitor. The second instruction adds the array of structs that specify the events.
    As well as EPOLL_CTL_ADD you can also use EPOLL_MOD and EPOLL_CTL_DEL to modify
    and delete the elements in the array of structs. In this case the file descriptor
    is used to identify which element to modify or delete. Finally, we can wait for
    the file, or files, to have something ready to attend to:


    ```

    int nfds = epoll_wait(epfd, &ev, 1, 20000);

    ```


    The first parameter gives the epoll entity to use, the second is an array of epoll_event
    structs to return the results, the third is the size of the array, and the number
    of events returned at time, and the final parameter is the timeout in milliseconds.
    The epoll_wait suspends the thread that it is and waits for an interrupt from
    the file or files it is waiting for. If the interrupt corresponds to one of the
    events being waited for, the epoll function restarts its user mode and returns
    the number of descriptors that have fired an event - nfds in this case. You can
    test to detect a timeout when nfds is zero. if it is greater than zero you have
    to process each of the epoll_event structs returned. In this case we have only
    one file so we can ignore the returned GPIO line to retrieve the event data in
    a gpioevent_data_struct, which gives you an event and a timestamp:


    ```

    struct gpioevent data edata;

    read(req.fd,&edata,sizeof edata);

    printf("%u,%llu",edata.id,edata.timestamp);

    ```'
