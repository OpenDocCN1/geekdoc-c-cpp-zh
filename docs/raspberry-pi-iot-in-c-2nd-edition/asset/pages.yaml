    \ 4, 0x10);\n        bcm2835_peri_write(gpioBASE + BCM2835 GPIOCLR0, 4, 0x10);\n\
    \    }\n    return 0;\n}\n```\n\n# GPIO Clocks - An Example\n\nThis is an advanced\
    \ topic.\n\nThe GPIO Clocks are not well known as they deserve and there are no\
    \ functions that let you work with them in the bcm2835 library. It is, however,\
    \ fairly easy to add one.\n\nThere are three general-purpose GPIO clocks and two\
    \ special-purpose clocks, the PWM (pulse width modulated) and PCM (pulse mode\
    \ modulated) clocks. You can set any of the clocks to run at a given rate and\
    \ the general purpose clocks can be routed to a subset of GPIO pins. The outputs\
    \ are trains of the specified frequency which can be modulated by changing the\
    \ clock divider.\n\nThe frequency division can include a fractional part which,\
    \ if you know your digital logic, is surprising. Dividing by 2, 4 or 8 is easy,\
    \ but how do you divide by 2,5? The answer is that the scope of this book, but\
    \ it is a digital processing technique that works is it can generate a signal\
    \ with the frequency desired. The problem is that it"
