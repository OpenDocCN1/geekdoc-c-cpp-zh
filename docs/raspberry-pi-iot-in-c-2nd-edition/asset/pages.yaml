- img_proc: true
  md: 'The GPIO lines that you can work with are shown in the following diagram:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_43_0.png)


    You may also notice that many of the pins on the pin diagrams have two labels.
    For example GPIO2 is labeled as SDA1. Many, but not all, of the GPIO lines have
    alternative functions such as connecting SPI devices, more of which later. In
    general you should avoid using pins which have an alternative function as general
    purpose I/O lines. The reason is that you might need to use one of the special
    functions later in your project''s development and if it is already used as a
    GPIO line you not only have to change all the pin assignments, which is relatively
    easy, but also all of the hardware connections, which is harder.


    In practice, for general GPIO cases use


    GPIO 4, 5, 6, 12, 13, 17, 18, 22, 23, 24, 25, 26 and 27


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_43_1.png)


    > The "preferred" GPIO pins.


    Then use:

    GPIO 2, 3, 9, 7, 8, 16, 10, 11, 14, 15, 19, 20 and 21


    in that order. The reason for the non-sequential order is that some GPIO lines
    work as a group and once you have used one might as well use the others.


    This isn''t a definitive rule because the Pi 4 offers additional modes for many
    of the GPIO lines. Although the situation is very complicated, don''t worry too
    much as changing which GPIO line is used in software is easy unless you have reached
    a late prototyping stage it is fairly easy in hardware.'
