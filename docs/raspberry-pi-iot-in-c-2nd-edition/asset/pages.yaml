  md: '# Summary


    +   In many cases you don''t need to install a complete web server to get an application
    on the web. You can program the interactions between your app and a browser using
    sockets.


    +   A socket is a general way to transfer data and it is slightly more complicated
    as a wave of accessing the Internet than it needs to be because of this generality.


    +   Sockets are usually bidirectional, allowing both parties to send and receive
    data.


    +   In all cases, you create a socket, connect it to an address and begin transferring
    data.


    +   Sockets differ mostly in the nature of the address you use with them.


    +   Sockets that make connections to client data are associated with an address,
    the endpoint for the data sent, using the connect function.


    +   Sockets that receive connections are associated with an address using the
    listen function. This address that a client uses to connect to the socket.


    +   Once the client starts to make a connection, the accept function returns a
    new socket that is used to actually do the data transfer. The original socket
    continues to wait for other connection attempts.


    +   A web client creates a socket that connects a given address and then sends
    and receives HTTP packets.


    +   An HTTP packet is simple text preceded by a set of headers that determines
    what is to be transferred.


    +   Creating a server is slightly more difficult in that it has to create a socket
    that listens for incoming connections and creates a new socket to enable data
    transfer.


    +   The biggest problem is in creating a secure server. In most cases, you can
    simply limit the IP addresses allowed to connect and limit what data is returned.


    +   If you really need the security of an encrypted link, then it is better to
    use an SSL library such as LibHTTP.'
  merge: -1
