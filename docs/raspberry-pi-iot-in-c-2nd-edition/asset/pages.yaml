    \ readBuf, 3);\n    int data = ((int) readBuf[1] & 0x03) << 8 | (int) readBuf[2];\n\
    \    float volts = (float) data * 3.3f / 1023.0f;\n\n    printf(\"%f\", volts);\n\
    \    bcm2835_spi_end();\n    bcm2835_close();\n    return (EXIT_SUCCESS);\n}\n\
    ```"
