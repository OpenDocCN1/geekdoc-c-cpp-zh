- img_proc: true
  md: 'Now consider what happens if you start a FIFO scheduled thread with priority
    1. It starts and is added to the end of the priority 1 queue. Of course it is
    the only priority process and it starts immediately on one of the cores available.
    If the process never makes a call that causes it to wait for I/O or become blocked
    in some other way then it will execute without being interrupted by any other
    process. In principle this should ensure that your process delivers nothing but
    its fastest response time.


    This is also, but not quite. There are more complex situations you can invent
    with different priorities according to how important they are and this gets complicated
    very quickly.


    The Round robin scheduler, SCHED_RR, is a modification to SCHED_FIFO in which
    each running process is only allowed to run for a single timeslice. When the timeslice
    is up, the thread at the head of the priority queue is started and the current
    thread is added to the end of the queue. You can see that this allows each thread
    to run around once in turn.


    In most cases for real-time programming with the Raspberry Pi, the SCHED_FIFO
    scheduler is what you need and in its simplest form its complete set of scheduling
    commands supported by #include:


    | sched_setscheduler | The scheduling policy and parameters of a thread |

    | sched_getscheduler | Return the scheduling policy of a thread |

    | sched_setparam | Set the scheduling parameters of a thread |

    | sched_getparam | Fetch the scheduling parameters of a thread |

    | sched_get_priority_max | Return the maximum priority available in a scheduling
    policy |

    | sched_get_priority_min | Return the minimum priority available in a scheduling
    policy |

    | sched_rr_get_interval | Fetch the quantum used for threads that are scheduled
    under the round-robin scheduling policy |

    | sched_yield | Cause the caller to relinquish the CPU, so that some other thread
    be executed |

    | sched_setaffinity | Set the CPU affinity of a thread |

    | sched_getaffinity | Get the CPU affinity of a thread |

    | sched_setattr | Set the scheduling policy and parameters of a thread |

    | sched_getattr | Fetch the scheduling policy and parameters of a thread |'
