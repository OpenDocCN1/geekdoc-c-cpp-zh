  md: "# Phased Pulses\n\nAs a simple example of using the bcm2835 output functions,\
    \ let's try to write a short program that pulses two lines — high and then low\
    \ in phase.\n\nThe simplest program to do this job is:\n\n```\n#include <bcm2835.h>\n\
    #include <stdio.h>\n#include <stdlib.h>\n#include <stdint.h>\n\nint main() {\n\
    \    if (!bcm2835_init())\n        return 1;\n    bcm2835_gpio_fsel(RPI_BPLUS_GPIO_J8,\
    \ BCM2835_GPIO_FSEL_OUTP);\n    bcm2835_gpio_fsel(RPI_BPLUS_GPIO_J11, BCM2835_GPIO_FSEL_OUTP);\n\
    \    volatile int i;\n    for (;;) {\n        bcm2835_gpio_write(RPI_BPLUS_GPIO_J8,\
    \ HIGH);\n        bcm2835_gpio_write(RPI_BPLUS_GPIO_J11, HIGH);\n        bcm2835_gpio_write(RPI_BPLUS_GPIO_J8,\
    \ LOW);\n        bcm2835_gpio_write(RPI_BPLUS_GPIO_J11, LOW);\n    }\n    return\
    \ (EXIT_SUCCESS);\n}\n```\n\nNotice that there is no delay in the loop so the\
    \ pulses are produced at the fastest speed.\n\nUsing a logic analyzer reveals\
    \ that the result isn't what you might expect:\n\n![](img/175b89abfcdc9824337e5b1ac4bb1ef3_58_0.png)\n\
    \nAt this speed the pulses aren't perfectly regular and occur in two sizes, but\
    \ you can also see that the pulse trains are not in step. The top train switches\
    \ on and the bottom train takes half a pulse before it switches on, although the\
    \ intent is for both actions to occur at the same time. The point is that it does\
    \ take quite a long time to access and change the state of output line.50ns with\
    \ a pulse width of 125ns."
  merge: -1
  pgno: 58
- img_proc: true
  md: "Of course, if we include a delay to increase the pulse width then the delay\
    \ caused by accessing the GPIO lines in two separate actions isn't so obvious,\
    \ but it is still there. There are applications where – the switching speed is\
    \ so low that the delay between switching doesn't matter – flashing LEDs for instance.\
    \ You could flash a line of 800,000 LEDs before the lag between the first and\
    \ the last appeared. On the other hand, if you use out-of-phase pulses to control\
    \ a motor, the overlap when both GPIO lines were to burn out the drivers quite\
    \ quickly. Of course, any sensible, cautious, engineer wouldn't feel a motor control\
    \ from two independently generated pulse trains unless they were guaranteed not\
    \ to switch both sides of the bridge at the same time.\n\nA better way to generate\
    \ pulses that are in phase is to use a multi function and a mask.\n\nFor example,\
    \ if you change the first program to:\n\n```\n#include <bcm2835.h>\n#include <stdio.h>\n\
    #include <stdlib.h>\n#include <unistd.h>\n\nint main() {\n    if (!bcm2835_init())\n\
    \        return 1;\n    bcm2835_gpio fsel(RPI BPLUS GPIO_J8_07, BCM2835 GPIO_FSEL_OUT);\n\
    \    bcm2835_gpio fsel(RPI BPLUS GPIO_J8_11, BCM2835 GPIO_FSEL_OUT);\n    uint32_t\
    \ mask = (1 << RPI_BPLUS_GPIO_J8_11) |\n\n    for (;;) {\n        bcm2835_gpio_set_multi(mask);\n\
    \        bcm2835_gpio_clr_multi(mask);\n    }\n\n    return (EXIT_SUCCESS);\n\
    }\n```\n\nThe GPIO lines are not to change at the same time and when you do, even\
    \ at the fastest speed:\n\n![](img/175b89abfcdc9824337e5b1ac4bb1ef3_59_0.png)"
