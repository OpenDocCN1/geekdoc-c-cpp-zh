- img_proc: true
  md: 'The scheduling types supported are:

    SCHED_OTHER the standard time-sharing policy

    SCHED_BATCH for "batch" style execution of processes

    SCHED_IDLE for running very low priority background jobs

    SCHED_FIFO a first-in-first-out policy

    SCHED_RR a round-robin policy

    where only the final two are real-time schedulers.


    Also notice that all the scheduling functions return an error code which you should
    check to make sure things have worked. For example, to set the current thread
    to FIFO scheduling with a priority structure you you need to use:

    sched_setscheduler(pid sched &priority);

    where pid is the thread id and if zero then the calling thread is used.


    For example:

    #include <sched.h>

    const struct sched_param priority = {1};

    sched_setscheduler(0, SCHED_FIFO, &priority);


    If this is the thread with a priority as high as 1 then it will not be interrupted
    by other threads and the kernel will cause short interruptions in its running
    – typically a few tens of microseconds every now and again. Even if there are
    other threads with the same or higher priorities, as long as there are sufficient
    cores to run them, the thread will still not be interrupted.


    # Real Time FIFO Scheduling


    Now we can try the same test given earlier, but with FIFO real-time scheduling
    selected. It is simpler to try on a Pi Zero as this has only a single core. The
    results on a Pi 4 are similar to what you have to adds to keep all cores occupied
    before you see a difference.


    To set FIFO scheduling we need to use the sched_setscheduler function:

    sched_setscheduler(pid SCHED_FIFO &priority);

    where pid is the thread id - if zero then the calling thread is used.


    The second parameter sets the type of scheduling used, FIFO in this case, and
    the final parameter is a pointer to a structure that specifies the priority.


    Notice you need to include <sched.h> to make use of the scheduling functions.'
