    # Group Scheduling


    There is another twist to the CFS story - group scheduling. It is possible to
    group processes together so that they are scheduled as if they were a single entity.
    For example, if you have two groups, one consisting of a single process and of
    the other containing three processes the two groups each get 50% of the processor
    time, which means one process get 50% and the three in the other group get 50%/3
    each. Group scheduling would be a footnote and not something we need to get into,
    but for the adaption of auto-grouping.


    This approach automatically forms groups according to the console that starts
    each. If you run a process from a console, or an implied console, it forms a group.
    Run another process from the same source and it is added to the group and the
    time allotted to them. The idea is that, for a desktop system, the time should
    be shared between the different consoles to seem more responsive to the user.
    If a user uses a video editor, that is one group. They start compiling multiple
    threads and all of those threads form another group. If this were not the case,
    each thread would get an equal share of time and the video editor would slow to
    a crawl.'
