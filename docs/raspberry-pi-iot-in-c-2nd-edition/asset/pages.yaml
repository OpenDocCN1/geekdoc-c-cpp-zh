- img_proc: true
  md: '# Chapter 4


    # Simple Output


    A GPIO line is either configured to be an input or an output. The electronics
    of working with inputs and outputs are discussed in the next chapter. In this
    chapter we focus on the software side of the task of using GPIO lines in output
    mode. While it isn''t possible to ignore some electronics in this chapter, keep
    in mind that this is discussed in detail in the next chapter.


    It is worth noting at this stage that output is easy. Your program chooses the
    time to change a line''s state and is generally easy because you can use the system
    timer to work out exactly when things should happen. The real problems only start
    to become apparent when you are trying to change the state of lines very fast
    or they need to be changed synchronously. This raises the question of how fast
    the Pi can change a GPIO line and this is something we consider at this early
    stage because it puts constraints on what we can easily do.


    # Output Mode


    The bcm2835 functions that you need to make use of a pin in output mode are very
    simple. The basic configuration function is:


    ```

    void bcm2835_gpio_fsel (uint8_t pin, uint8_t mode)

    ```


    This will be set by a GPIO number to a given mode. The two most commonly modes
    are:


    ```

    BCM2835_GPIO_FSEL INTP

    BCM2835_GPIO_FSEL OUTP

    ```


    These set the GPIO line to either input or output. Notice that by default lines
    are usually set to input as this is the less dangerous option. Having a line configured
    as output by default could set other device that was connected into an unwanted
    state or even destroy the output line or Pi by drawing too much current.'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'So to set the GPIO line connected to pin 7 to be an output you would use:

    bcm2835_gpio_fsel(RPI_BPLUS_GPIO_J8_07, BCM2835_GPIO_FSEL_OUTP);


    Once you set the line to output there are a range of ways to set its state to
    high or low voltage output. The number of possibilities is initially confusing,
    but they have their particular use.


    The simplest and most used is:

    void bcm2835_gpio_write(uint8_t pin, uint8_t value)


    As you specify the GPIO number or use one of the Physical enumeration values.
    The value parameter can be either HIGH or LOW. So to set the GPIO line on pin
    7 to high you would use:

    bcm2835_gpio_write(RPI_BPLUS_GPIO_J8_07, HIGH);

    and set it low:


    bcm2835_gpio_write(RPI_BPLUS_GPIO_J8_07, LOW);

    As HIGH is defined to be 1 and 0 you can also write

    bcm2835_gpio_write(RPI_BPLUS_GPIO_J8_07, 1);

    and use a variable if you want to:


    ```

    int state=1;

    bcm2835_gpio_write(RPI_BPLUS_GPIO_J8_07, state);

    ```


    When you want to call a single function and set the state of the line, write is
    useful. However, there are times when you always want to set a line high or low.
    In this case you can use one of:

    bcm2835_gpio_set (uint8_t pin)

    bcm2835_gpio_clr (uint8_t pin)


    As you can guess set the line to high and clr sets the line low.

    For example, to set pin 7 high:

    bcm2835_gpio_set (RPI_BPLUS_GPIO_J8_07);


    # Multi Functions


    So far the functions have allowed us to change one line at a time. If you want
    to change more than one line there are quali equivalents of the write, set and
    clear functions:


    ```

    void bcm2835_gpio_write_multi (uint32_t mask, uint8_t on)

    void bcm2835_gpio_set_multi (uint32_t mask)

    void bcm2835_gpio_clr_multi (uint32_t mask)

    ```'
  merge: -1
  pgno: 47
- img_proc: true
  md: 'In this case you have to supply a "mask" to indicate which GPIO lines are to
    be altered. Only the lines specified in the mask are modified – the rest are left
    in their current state.


    The mask is very simple; each of the 32 bits in the mask represents a GPIO line
    – bit zero is for GPIO 0, bit one is for GPIO 1 and so on. Of course the problem
    is you can select GPIO lines that aren''t brought out on the Pi''connector and
    which GPIO corresponds to which pin? Fortunately it is very easy to automatically
    make a mask that corresponds to any set of GPIO lines by pin number. Suppose you
    want a mask for pin 3 this means you need to set the third bit in the mask. This
    can be done using 1<<3, i.e. shifted 3 places to the left. If you want to know
    about manipulation of this sort, see Chapter 12 of Fundamental C: Getting To The
    Machine, ISBN: 9781871962604.


    This is the mask you require and it has been found by a general algorithm. If
    you want a mask for pin n all you have to do is:


    ```

    1<<n

    ```


    Now you want a mask for pin n and pin m. All you have to do is the bitwise operator,|
    to OR the masks for each pin together, so the complete mask is:


    ```

    (1<<n) | (1<<m)

    ```


    Of course, you can use the pin enumeration in place of pin numbers. So, to create
    a mask for pin 3 and pin 5, so you would use:


    ```

    uint32_t mask=(1 << RPI_BLUP5_GPIO_J8_03) | (1 << RPI_BLUP5_GPIO_J8_05);

    ```


    Once you have the mask you can use it in any of the multi functions. For example:


    ```

    bcm2835_gpio_set_mask (mask);

    ```


    sets both pin 3 and pin 5 to high in a single operation.


    There is another mask function which can be used to set multiple GPIO lines to
    different values:


    ```

    void bcm2835_gpio_write_mask (uint32_t value, uint32_t mask)

    ```


    In this case the mask works in the same way and specifies which GPIO lines are
    to be involved. The difference is that the value parameter determines what each
    of the lines is to be set. So, for example, if bit 6 of the mask is a 1 then GPIO
    line 6 will be set to whatever parameter is. This allows you to set multiple GPIO
    lines to different states.'
  merge: -1
  pgno: 48
- img_proc: true
  md: "```\nFor example:\nuint32_t mask=(1 << RPI_BPLUS_GPIO_J8_03) |\n          \
    \    (1 << RPI_BPLUS_GPIO_J8_05);\nuint32_t value=1<< RPI_BPLUS_GPIO_J8_05;\n\
    bcm2835_gpio_write_mask(value, mask);\n```\n\nwill set pin 3 to low and pin 5\
    \ to high because the mask specifies these pins and in value the bit corresponding\
    \ to pin 3 is low and the bit corresponding to pin 5 is high. Notice the state\
    \ of bits in value that do not correspond to bits to 1 in mask have no effect.\
    \ Although this looks like a single operation it isn't. The bcm2835_gpio_write_mask\
    \ function sets the lines that need setting and in a separate operation clears\
    \ the lines that need clearing. The mask functions are very useful when you want\
    \ coordinated changes across a number of GPIO lines, it is worth saying at this\
    \ early stage that you can set a group of lines in one operation and you can unset\
    \ a group of lines in one operation but if you want to set some lines and unset\
    \ others this is always two separate operations.\n\n# How Fast?\n\nA fundamental\
    \ question that you have to answer for any processor intended for use in embedded\
    \ or IoT products, how fast is the GPIO lines?\nSometimes the answer isn't of\
    \ too much concern because what you want to do only works relatively slowly. Any\
    \ application that is happy with response times in the tens of millisecond region\
    \ will generally work with almost any processor. However, if you want to implement\
    \ custom protocols or anything that needs microsecond, or even nanosecond, responses\
    \ to the question is much more important.\n\nIt is easy to find how fast a single\
    \ GPIO line can be used if you have a logic analyzer or oscilloscope. All you\
    \ have to do is run the program:\n\n```\n#include <bcm2835.h>\n#include <stdio.h>\n\
    int main(int argc, char **argv) {\n    if (!bcm2835_init()))\n        return 1;\n\
    \    bcm2835_gpio_fsel(RPI_BPLUS_GPIO_J8_07, BCM2835_GPIO_FSEL_OUTP);\n    for(;;\
    \ {\n        bcm2835_gpio_write(RPI_BPLUS_GPIO_J8_07, HIGH);\n        bcm2835_gpio_write(RPI_BPLUS_GPIO_J8_07,\
    \ LOW);\n    }\n    bcm2835_close();\n    return 0;\n}\n```"
  merge: -1
  pgno: 49
- img_proc: true
  md: 'What you will see depends on which version of the Pi you are working with,
    the quality of the instrument you are using and how the system clock is set by
    the management software, see the next section. For the Pi Zero pulses are every
    so often. For the Pi 4 you will see the same pattern but the pulses are around
    75ns. Why the Pi 4 is marginally slower isn''t obvious.


    Using an oscilloscope reveals the pulses are very rough and irregular. A logic
    analyzer will often read two pulses as one because of the irregularity or lack
    of high enough sampling rate. You see regular interruptions to the pulse train
    every so often. There are small interruptions 10ms for the Pi Zero the dropout
    is 17µs and for the Pi 4 it is 8ms. There is also a bigger interruption 125ms
    or so with a dropout of 100ms for the Pi Zero.


    The biggest difference between the two comes from the fact that the Pi Zero has
    only a single core. If there are any other applications then the gaps can be tens
    of milliseconds in duration and very frequent:


    | | 500ms | +10ms | +20ms | +30ms | +40ms |

    |---|---|---|---|---|---|n| Width:| | | | | 10.94125ms |

    | Period:| | | | | 10.0411ms |

    | DutyCycle:| | | | | 99.998362% |

    | Frequency:| | | | | | 90.9076Hz |


    The block blocks when the signal is being produced and you can see that it is
    stopped for 10ms periods.


    The Pi 4 also behaves like this but it needs to be loaded with enough tasks to
    need all four cores to be active. We''ll return to the topic of how CPU loading
    affects speed in Chapter 21: Real Time Linux.


    It doesn''t make any difference if you use one and cl or any of the other functions.
    You can also use a while(1) loop in place of the for loop - it makes no difference
    to the overall timing.


    So you can generate nanosecond pulses using the Pi, but not accurately. For accuracy
    you will have to move to the microsecond range, which is usually sufficient for
    most applications.


    # The Problem Of Clocks


    Until recently, processors and computer systems in general used a very simple
    approach to clock frequencies. Each time a clock pulse occurred something happened
    in the system and, for simplicity, clocks were set to run at a fixed maximum rate
    that allowed the system to remain cool.


    Today''s systems, however, make use of multiple clocks which run at variable rates.
    This allows a system to "s", i.e. use a higher clock rate for short'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'time to keep the temperature increase below a set level. If the temperature
    increases too much then the clock can be throttled, i.e. slowed down, until the
    system is once again within a safe zone. Slowing the clock can also be to reduce
    power consumption.


    A variable clock rate is good from the point of view of completing tasks and perhaps
    reducing power consumption, but if you are trying to write programs where timing
    is critical it can be a problem. If you synchronize your program using a known
    change in a timer, which always ticks at the same rate irrespective of the system
    clock, then your program will work in the same way irrespective of the speed of
    the system clock. However, this is not true if the system clock runs so slowly
    that the program cannot complete the task in the allotted time.


    The latest version of Pi OS, as Raspian, implements the Linux cpufreq kernel driver,
    which are more complicated with the Pi because it is the GPU that controls things,
    not the CPU. You can find out what the GPU is doing using vcmcmd which talks directly
    to the GPU, whereas the standard Linux commands work with the CPU and sometimes
    gives the wrong answer. The vcmcmd monitor is fully documented at the official
    site, but the important command for clock speed:


    vcgencmd measure_clock arm


    You can substitute other clock names for arm, but this gives you the frequency
    that all of the cores are running at.


    The Linux cpufreq commands are standard, but in some situations the GPU may change
    the clock frequency without Linux being aware of it. The idea is that a set of
    governors control how the frequency is varied. For the current generation of Pis
    the default is demanded, but you can discover the active governor using:


    ```

    sudo cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor

    ```


    You can discover the available governors using:


    ```

    sudo cat

    /sys/devices/system/cpu/cpu0/cpufreq/scaling_available_governors

    ```


    The action of the demanded governor according to the Linux manual is:


    > The cpufreq governor "demand" sets the CPU frequency depending on the current
    system load. Load estimation is triggered by the scheduler through the update_util_data->func
    hook; when triggered, cpufreq checks the CPU-usage statistics over the last period
    and the governor sets the CPU accordingly.'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'Altering the frequency on the basis of load makes sense for a mix of applications,
    but using this for an IoT app that needs high speed, even though it doesn''t load
    the CPU, isn''t ideal.


    Empirically the Pi Zero regards its single core as being heavily loaded all of
    the time as it always reports 1GHz as its clock rate, but the Pi 4 reports as
    600MHz with low load. You can discover the current clock rate using Linux using:


    ```

    cat /sys/devices/system/cpu/cpufreq/scaling_cur_freq

    ```


    and the maximum and minimum frequencies used:


    ```

    cat /sys/devices/system/cpu/cpufreq/scaling_min_freq

    cat /sys/devices/system/cpu/cpufreq/scaling_max_freq

    ```


    For the Pi Zero the maximum frequency is 1GHz and for the Pi 4 it 1.5GHz. The
    minimum in both cases is 700MHz.


    If you need a fixed clock frequency you have to set the governor to performance
    which sets the clock to the highest possible frequency - usually scaling_max_freq:


    ```

    sudo sh -c "echo performance >

    /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor"

    ```


    This will run the clock at the highest frequency, but if the CPU temperature goes
    over the maximum frequency will still be reduced.


    In most cases you can ignore the clock speed variation with load, but you do need
    to keep the effect in mind when searching for explanations for why things aren''t
    happening as fast as you might expect.


    # # Including Pauses


    To generate pulses of a known duration we need to pause the program between state
    changes. The simplest way of pausing a thread for a number of microseconds is
    with usleep, which is still in common use even if it is deprecated in Posix. However,
    its replacement nanosleep is also easy to use and has some advantages.'
  merge: -1
  pgno: 52
- img_proc: true
  md: "To nanosleep you need to include a define right at the start of the program:\n\
    \n```\n#define _DEFAULT_SOURCE\n#include <bcm2835.h>\n#include <stdio.h>\n#include\
    \ <time.h>\n```\n\n```\nint main(int argc, char **argv) {\n    if (!bcm2835_init())\n\
    \        return 1;\n    bcm2835_gpio_fsel(RPI_BPLUS_GPIO_J8_07, BCM2835_GPIO_FSEL_OUTP);\n\
    \    volatile int i;\n    struct timespec delay={0,10*1000};\n    for (;;) {\n\
    \        bcm2835_gpio_set(RPI_BPLUS_GPIO_J8_07);\n        nanosleep(&delay,NULL);\n\
    \        bcm2835_gpio_clr(RPI_BPLUS_GPIO_J8_07);\n        nanosleep(&delay,NULL);\n\
    \    }\n    bcm2835_close();\n    return 0;\n}\n```\n\nTo nanosleep you need to\
    \ specify the delay in seconds and nanoseconds - hence the delay set in the example\
    \ is 10µs. The reason for the second parameter is that nanosleep can be interrupted\
    \ by a signal and in this case it returns with the second set to the amount of\
    \ time remaining. You can use this to restart the delay with the remaining time.\
    \ If you don't want this value set the second parameter to NULL.\n\nYou will discover\
    \ that adding nanosleep(&delay,NULL) doesn't increase the pulse length by 10µs\
    \ by 80µs. You will also discover that longer glitches have gone.\n\nWhat seems\
    \ to be happening is that calling nanosleep yields the thread to the operating\
    \ system and this incurs an additional 70µs penalty due to calling the scheduler.\
    \ There are also losses that are dependent on the time you set to wait nanosleep\
    \ only promises that your thread will not restart for at least the specified time."
  merge: -1
  pgno: 53
- img_proc: true
  md: '![](img/175b89abfcdc9824337e5b1ac4bb1ef3_54_0.png)


    If you look at how the delay time relates to the average pulse length, things
    seem fairly simple for a Pi Zero:


    For the Pi 4, the equation of the line is approximately:


    ```

    pulse length = delay + 68

    ```


    and for the Pi Zero:


    ```

    pulse length = delay + 77.5

    ```


    What this means is that, if you want to set a delay less than 70µs or 90µs, don''t
    use nanosleep.


    The same is not true of the delayMicroseconds function: void bcm2835_delayMicroseconds(time)


    This uses a busy wait for shorter times than 450µs and a system delay like usleep
    or nanosleep for longer periods. We first need to look at how a busy wait works.


    # Busy Wait


    For pulses of less than 100µs it is better to use a busy wait, i.e. a loop that
    does nothing. You have to be a little careful about how you insert a loop that
    does nothing because optimizing compilers have a tendency to take a null loop
    out in an effort to make your program run faster. To stop an optimizing compiler
    from removing busy wait loops make sure you always declare loop variables as volatile.'
  merge: -1
