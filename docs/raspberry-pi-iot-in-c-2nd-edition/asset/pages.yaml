  md: "What has all this got to do with the GPIO lines?\n\nThe answer is that the\
    \ GPIO character driver is a pseudo file and as such you\ncan wait on it using\
    \ epoll. As this makes use of an interrupt generated by the\nGPIO lines, you need\
    \ to ensure that the line:\n\n```\ndtoverlay = gpio-on-irq\n```\n\nisn't present\
    \ in, or is commented out of, the /boot/config.txt file.\n(Remember that earlier,\
    \ when working with the BCM 2835 library, this line\nwas needed because there\
    \ was no kernel interrupt handler and so GPIO\ninterrupts had to be turned off)\
    \ If you have used checkIRQ to dynamically\nturn gpio irqs then you need to reboot\
    \ the machine.\n\nTo wait for an event on a GPIO line we have to use the\nGPIO_GET_LINEEVENT_IOCTL\
    \ request to the GPIO character driver and the\nassociated struct:\n\n```\nstruct\
    \ gpioevent_request {\n    u32 lineoffset;\n    u32 handleflags;\n    u32 eventflags;\n\
    \    char consumer_label[32];\n    int fd;\n```\n\nNotice that you can set set\
    \ single GPIO number – lineoffset isn't an\narray. The handleflags field is the\
    \ same as the flags field and it is usually\nto GPIOHANDLE_REQUEST_INPUT. The\
    \ event flags field determines what causes\nan event:\n\n```\nGPIOEVENT RISING_EDGE\n\
    GPIOEVENT REQUEST_FALLING_EDGE\nGPIOEVENT REQUEST_BOTH_EDGES\n```\n\nWhen the\
    \ ioctl call returns the file descriptor in the fd file, it can be used to\nwait\
    \ for an event to occur. For example, we first set the gpioevent struct\nand make\
    \ the GPIO_GET_LINEEVENT_IOCTL request:\n\n```\nint fd, ret;\n```\n\n```\nstruct\
    \ gpioevent_request req;\nreq.lineoffset = 4;\nreq.handleflags = GPIOHANDLE_REQUEST_INPUT;\n\
    req.eventflags = GPIOEVENT_REQUEST_BOTH_EDGES;\nstrncpy(req.consumer_label, \"\
    Event test\");\n```\n\n```\nfd = open(\"/dev/gpichip0\", O_RDONLY);\nret = ioctl(fd,\
    \ GPIO_GET_LINEEVENT_IOCTL, &req);\nclose(fd);\n```"
