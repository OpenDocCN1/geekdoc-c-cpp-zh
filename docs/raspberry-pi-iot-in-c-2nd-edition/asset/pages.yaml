- img_proc: true
  md: "The codes that you send to the device can often be considered\naddresses or\
    \ commands. In this case you can think of sending 0xE7 as a\ncommand to the register\
    \ or the read address of the register, it makes no\ndiffence. In most cases, the\
    \ term \"command\" is used when sending the code\nmakes the device do something,\
    \ and the term \"address\" is used when it\nsimply makes the device read or write\
    \ specific data.\n\nTo read the user register we have to write a byte containing\
    \ 0xE7 and\nread the byte the device sends back. This involves an address frame,\n\
    data frame, and then another address frame and reading a data frame. The\ndevice\
    \ seems to be happy if you send a stop bit between each transaction or\njust a\
    \ new start bit.\n\nA program to read the user register is fairly easy to put\
    \ together. The address\nof device is 0x40, so its write address is 0x80 and its\
    \ read address is 0x81.\nRecall that bus addresses are shifted one bit to the\
    \ left and the base address is\nwrite and read address is base address+1. As the\
    \ I2C functions adjust the\naddress as needed, we simply use 0x40 as the device's\
    \ address, but it does\nafect what you see if you sample the data being exchanged:\n\
    \n```\n#include <stdio.h>\n#include <stdlib.h>\n#include <bcm2835.h>\nint main(int\
    \ argc, char** argv) {\n    if (!bcm2835_init())\n        return 1;\n    char\
    \ buf[] = {0xE7};\n    bcm2835_i2c_begin();\n    bcm2835_i2c_setclockdivider(BCM2835_I2C_CLOCK_DIVIDER_148);\n\
    \    bcm2835_i2c_setslave(0x40);\n    bcm2835_i2c_write(buf, 1);\n    bcm2835_i2c_read(buf,\
    \ 1);\n    printf(\"User Register = %X \\r\\n\", buf);\n    bcm2835_i2c_end();\n\
    \    return (EXIT_SUCCESS);\n}\n```\n\nThis sends the address frame 0x80 and then\
    \ the data frame 0xE7 to select the\nuser register.\n\nIf you run the program\
    \ you will see (and the program needs to be run as root):\n\nRegister = 02\n\n\
    This is the default value of the register and it corresponds to a resolution of\n\
    12 and 14 bits for the humidity and temperature respectively and a supply\nvoltage\
    \ greater than 2.25V."
