- img_proc: true
  md: '# Scanning The Bus


    Scanning the 1-wire bus is a strange thing to do. The reason is that in most cases
    the devices on the bus don''t change. You set up a group of slaves and, unless
    one or more of them fail, the serial numbers don''t change. So why bother scanning
    the bus? As long as you program the serial numbers into your code, it will all
    work.


    It is not uncommon to find people using 1-wire bus scanners to discover what is
    connected and transcribing the serial numbers to the program, even if there is
    only one device on the bus! However, discovering the devices on the bus dynamically
    allows you to write programs that are robust against failures and auto-configuring.
    Instead of scanning the bus and hard-coding the serial numbers, why not scan the
    bus each time there is a restart, or even sooner? Now we come to the problems
    of scanning the bus.


    The 1-wire bus isn''t robust. Use of pull-up resistors at high speeds means it
    doesn''t take much capacitance to make the pulses like a capacitor charging up.
    Getting the wiring right for a 1-wire bus with multiple devices isn''t easy. What
    is more, scanning the bus is the only time, apart from the presence pulse, when
    multiple devices control the bus. A setup that works perfectly with a single device
    often has problems there is more than one device. In fact, a standard 1-wire bus
    debugging technique is to remove all but one device and see if what wasn''t working
    suddenly.


    You can get around some of the problems by lowering the value of the pull-up resistor,
    but this increases the load on the driving GPIO lines and the slave devices. You
    can reduce the pull-up to 2kΩ or even less to account for the reduced voltage
    of 3.3V. The 1-wire bus works best at 5V when the lines are long, but it is usually
    not worth the trouble to drive a 3.3V to 5V driver.


    If you want to drive a very long line, or just need the highest possible performance,
    there is a technique which, while it might not be worth in many situations, is
    worth knowing about. It is called by a name of names but "controllable slew rate"
    is close enough. The idea is that when the master releases the bus, we wait for
    it to be pulled up by the resistor and this can be slow. We can make it faster
    by replacing resistors by active devices.'
  merge: -1
  pgno: 244
- img_proc: true
  md: 'The principle used is that we can put a transistor in parallel with the pull-up
    resistor and use it to pull the line faster when appropriate. For example, when
    the master pulls the line low for a presence pulse, it can trigger the pull-up
    transistor when the pulse ends to get the line back faster than just via the resistor.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_245_0.png)


    The fast pull-up transistor Q2, controlled by DPU, is switched off just before
    the slaves start to pull the line low. You can use the fast pull-up transistor
    when the master writes a 0 or reads a 1. Of course, you don''t need to use it
    when the master reads a 0 because the slave holds the line low for the whole time
    slot and there is no need for a fast pull-up. It is claimed that lines as long
    as 500cm can work in this mode. Notice that you now need an additional GPIO line
    to drive the fast pull-up transistor. If you want to know more refer to the Maxim
    design notes.


    In practice you have to face the fact that you will get errors when working with
    the 1-wire bus and especially with multiple devices. The problem is particularly
    bad if you are testing a circuit using a prototype board. Things work better when
    you move to properly soldered connections and cables, but you will still get errors.
    However, even with the best wiring possible, you are still going to get errors
    due to the inevitable occasional interrupt that Linux will force on your program.


    The only reasonable solution is to add error checking to validate the serial numbers
    using the standard CRC function.'
  merge: -1
  pgno: 245
- img_proc: true
  md: "# Error checking\n\na a bus scan is fairly easy. The only problem is exactly\
    \ how to respond when you detect an error.\n\nWhen the oneWiScan function returns\
    \ we have an array with serial numbers ready to check. Each serial number is a\
    \ 64-bit integer, but the CRC checking function accepts an 8-byte array. At this\
    \ point you might be starting to think about repacking the bits into array, but\
    \ there is a much simpler solution.\n\nThe layout in memory for an 8-byte array\
    \ and a 64-bit integer is the same, all we have to do is cast the array to a suitable\
    \ pointer type and pass the 64-bit integer as if it was an 8-byte array. That\
    \ is:\n\n```\nuint64_t serial[15];\nuint8_t *code;\nint crc;\nint d = oneWiScan(RPI_GPIO_P0_11,\
    \ serial);\ncrc = 0;\nfor (int i = 0; i < d; i++) {\n    code = (uint8_t*) & &serial[i];\n\
    \    crc += crc8(code, 8);\n}\n```\n\nWhen you call oneWiScan you have to provide\
    \ it with an array of 64-bit integers it can use to store serial numbers. It returns\
    \ d, the number of devices it has found, and you need to check for CRC errors\
    \ in each of them. As there is no CRC error if they are all 0 we can check for\
    \ any CRC errors by summing the crc values for each serial number.\n\nThe important\
    \ line to explain is:\n\n```\ncode = (uint8_t*) &serial[i];\n```\n\nThis takes\
    \ the address of the ith element of serial and casts it to a pointer to uint8_t,\
    \ i. unsigned bytes. The function can use this as if it was an array of unsigned\
    \ bytes and everything without having to do any manipulation, which is the power,\
    \ and danger, of programming in C. Everything works as long as the basic assumption,\
    \ that a 64-bit unsigned integer and an 8-byte array are stored in memory the\
    \ way we hold. They usually are, but there is no guarantee.\n\nThis short piece\
    \ of code allows you to scan the bus and detect if there is an error. If there\
    \ is then you can scan it again. Generally speaking, you will mostly get a scan\
    \ without error, but in scans of configurations with small numbers, up to about\
    \ eight, devices you will get errors in one in ten scans. Notice that a scan transfers\
    \ lots of data and how long it takes depends on how many devices are connected\
    \ to the bus."
  merge: -1
  pgno: 246
- img_proc: true
  md: "# How Many Devices?\n\nUnfortunately there are other ways that a bus scan can\
    \ go wrong. It can fail to detect one or more devices. It only takes a single-bit\
    \ error and the scan will fail to get the serial number for that device. If it\
    \ is the first device in the scan and there are no backtrack points as yet, the\
    \ entire scan is canceled. More usually, however, just one device goes missing\
    \ during a scan. This will not be detected as an error because the serial numbers\
    \ returned will not be in error and hence will not trigger a CRC error.\n\nThere\
    \ are a number of solution to this problem. You could add error detection to the\
    \ scanning function, but even if you did this correctly there are times a device\
    \ simply doesn't respond at all, presumably because it misses the initialization\
    \ pulse and goes missing without triggering an error. There are two easy things\
    \ you can do to deal with missing devices. You can scan the bus more than once\
    \ and take the maximum number of correct serial numbers you find the number of\
    \ devices on the bus; and you can set the number of devices as a constant and\
    \ only accept scans that return in practice. It is normal to know how many devices\
    \ are there on the bus and as enforcing the scan to find that number is the best\
    \ solution. For example, here is an error-proof bus scan for exactly four devices:\n\
    \n```\nfor (j = 0; j < j++) {\n  d = oneWireScan(RPI_GPIO_P11,serial);\n  if (d\
    \ <= 4)continue;\n  crc = 0;\n  for (i = 0; i < d; i++) {\n    code = (uint8_t*)\
    \ & serial[i];\n    crc += crc8(code,8);\n  }\n  if (crc == 0)break;\n  bcm2835.delayMicroseconds(30000);\n\
    }\n```\n\nYou can adjust the number of retries and delays to suit your application.\
    \ The delay is included to give time for any noise or instability in the system\
    \ to subside. If you use twisted-pair cable then one-wire is prone to RF interference.\
    \ The scan is retried 100 times over a 3-second period. If you don't get a good\
    \ scan in time something is seriously wrong and most likely one of the devices\
    \ has failed.\n\n# Reading Specific Devices\n\nNow that we have an array of serial\
    \ numbers, we can use them to read the devices they correspond to. Before you\
    \ do this you should check the family codes, i.e. the first byte of the serial\
    \ number, to discover what kind of device you are about to work with. In practice\
    \ you usually already know. In this example it is assumed that all of the devices\
    \ are DS18B20 temperature sensors."
  merge: -1
  pgno: 247
- img_proc: true
  md: "To read a specific device all you have to do is send a Match ROM command (0x55)\
    \ in place of a Skip ROM command (0xCC) and then send the 64-bit serial number\
    \ to select a single device. After this transaction is the same and you can, in\
    \ the case of the DS18B20, initiate a conversion and then read the scratchpad.\n\
    \nThe new function to read a specific device is very similar to the original that\
    \ reads a single device on the bus. First we have to issue a convert command after\
    \ selecting the device:\n\n```\nfloat getTemperature(uint8_t pin, uint64_t device)\
