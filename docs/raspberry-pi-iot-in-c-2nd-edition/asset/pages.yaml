  md: "Working with a clock stretch timeout disabled isn't a good idea for a production\
    \ program, but at the default clock rate the longest timeout that can be set using\
    \ 16 bits is 24.5ms, which is not long enough. To set a timeout of 100ms, the\
    \ clock has to be, at most, 1.5µs.\nA standard clock rate of BCM2835_I2C_CLOCK_DIVIDER_2500\
    \ gives a clock time of 5µs (Pi 4) and a timeout of 20000 for 100ms.\n\nThe complete\
    \ program is:\n#include <stdio.h>\n#include <stdlib.h>\n#include <bcm2835.h>\n\
    \n```\nvoid setTimeout(uint32_t timeout) {\n    volatile uint32_t* timeout = bcm2835_bcscl\
    \ +\n    bcm2835_BSC_CLKT / 4;\n    bcm2835_peri_write(timeout, timeout);\n}\n\
    ```\n\n```\nint main(int argc, char** argv) {\n    if (!bcm2835_init())\n    \
    \    return 1;\n    bcm2835_i2c_begin();\n    bcm2835_i2c_setClockDivider(BCM2835_I2C_CLOCK_DIVIDER_2500);\n\
    \    setTimeout(20000);\n    char buf[3] = {0xE3};\n    uint8_t status = bcm2835_i2c_read_rs(buf,\
    \ buf, 3);\n    uint8_t msb = buf[0];\n    uint8_t lsb = buf[1];\n    uint8_t\
    \ check = buf[2];\n    printf(\"%ms %d\\n\\r ms %d\\n\\r checksum %d\\n\\r\",\
    \ msb, lsb, check);\n    bcm2835_i2c_end();\n    return (EXIT_SUCCESS);\n}\n```\n\
    \nThis works reliably and will timeout if anything goes wrong with the slave.\n\
    \n# Processing the data\n\nOur next task isn't really related to the problem of\
    \ using the I2C bus, but it is a very typical next step. The device returns the\
    \ data in three bytes, but by the way that data relates to the temperature isn't\
    \ simple.\n\nIf you read the datasheet you will discover that the temperature\
