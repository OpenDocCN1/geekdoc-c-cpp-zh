    Linux drivers or modify the device tree in any way,


    # # How SPI0 Works


    The SPI0 bus is available on the GPIO connector of all Pis but it has only two
    select lines. This means that in principle you can only connect two SPI devices
    to the Pi using it, although this is a restriction that is easy to overcome. If
    you want to work with SPI1 all you have to do is change the function calls from
    bcm2835_spi_action into bcm2835_aux_api_action.'
