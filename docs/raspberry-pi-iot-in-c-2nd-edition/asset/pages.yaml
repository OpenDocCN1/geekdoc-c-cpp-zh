    \        bcm2835_delayMicroseconds(1000);\n        printf(\"Button Push \\n\\\
    n\");\n        fflush(stdout);\n    }\n\n    return 0;\n}\n```\n\nIn this case\
    \ you really need to debounce the delays if you want to avoid responding twice\
    \ to what the user perceives as a single press.\n\nThe 1-millisecond delay is\
    \ probably the smallest delay that produces a button that feels as if it works.\
    \ In practice, you would have to tune the delay to suit the button mechanism in\
    \ use the number of times you can allow the button to be pressed in one second."
