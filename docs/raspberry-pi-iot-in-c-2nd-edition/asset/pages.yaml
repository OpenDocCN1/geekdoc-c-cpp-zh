- img_proc: true
  md: "The thread is specified as a Pthread id. You can also use a Linux process id\
    \ if you use the alternative get and set functions defined in sched.h:\n\n```\n\
    int sched_setaffinity(pid_t pid, size_t cpusize,\n              const cpu_set_t\
    \ *mask);\nint sched_getaffinity(pid_t pid, size_t cpusize,\n              cpu_set_t\
    \ *mask);\n```\n\nNotice that we work with the Linux process id rather than the\
    \ thread id and this can sometimes be useful. In practice, the Pthreads function\
    \ calls the functions defined in sched.h.\n\nThe other thing we need to know is\
    \ how to set the affinity mask. This uses a single bit to access each of the physical\
    \ and logical cores. You can simply set or reset these bits. You have to use the\
    \ set of macros designed for the job. There are a large number of these, but the\
    \ ones you use most often are:\n\n```\nCPU_ZERO(&cpuset);      set all bits to\
    \ 0\nCPU_SET(n &cpuset);      sets the bit corresponding to core n\nCPU_CLR(n\
    \ &cpuset);      resets the bit corresponding to core n\n```\n\nHow do you find\
    \ out which bit is in the mask?\nas long as your system is set up correctly you\
    \ should be able to get details by reading the /proc/cpuinfo file, or you could\
    \ use the ltopo tool. For example, suppose you want to run two threads on separate\
    \ cores. We first need two functions to run:\n\n```\nvolatile int j;\nvolatile\
    \ int i;\n```\n\n```\nvoid * threadA(void *p) {\n  for (i = 0; i++) {\n}\n```\n\
    \n```\nvoid * threadB(void *p) {\n  for (j = 0; j++) {\n}\n```\n\nThese simply\
    \ run a for loop with a global counter to let us know how many times the loop\
    \ has been executed. The global counters have to be marked as volatile to stop\
    \ the compiler optimizing the empty loops away."
  merge: -1
  pgno: 377
- img_proc: true
  md: "To set the thread affinity we need to use the macros:\ncpu_set_t cpuset\nCPU_ZERO(&cpuset);\n\
    CPU_SET(1, &cpuset);\n\nThis sets the mask to core 1. Next we set the first thread\
    \ and set its affinity:\npthread_t threadA\npthread_create(&threadA, NULL, NULL);\n\
    pthread_setaffinity_np(threadA, sizeof(cpu_set_t), &cpuset);\n\nThe second thread\
    \ is to run on core 2 so we need to change the mask and then start the thread:\n\
    \n```\nCPU_ZERO(&cpuset);\nCPU_SET(2, &cpuset);\npthread_t threadB\npthread_create(&threadB,\
    \ NULL, NULL);\npthread_setaffinity_np(threadB, sizeof(cpu_set_t), &cpuset);\n\
    ```\n\nNow we can let the main thread sleep for a few seconds and print the value\
    \ of the counters to give an indication of how many loops each thread has performed.\n\
    \nThe complete program is:\n\n```\n#define GNU_SOURCE\n#include <stdio.h>\n#include\
    \ <stdlib.h>\n\n#include <pthread.h>\n#include <sched.h>\n#include <unistd.h>\n\
    \nvolatile int j;\nvolatile int i;\n\nvoid * threadA(void *p) {\n    for (i =\
    \ 0; i++) {\n    }\n}\n\nvoid * threadB(void *p) {\n    for (j = 0; j++) {\n \
    \   }\n}\n```"
  merge: -1
  pgno: 378
- img_proc: true
  md: "```\nint main(int argc, char** argv) {\n    cpu_set_t cpuset;\n    CPU ZERO(&cpuset);\n\
    \    CPU_SET(1, &cpuset);\n\n    thread_t threadA;\n    pthread_create(&threadA,\
    \ NULL, threadA, NULL);\n    pthread_setaffinity_np(threadA, sizeof(cpu_set_t),\
    \ &cpuset);\n\n    CPU ZERO(&cpuset);\n    CPU_SET(2, &cpuset);\n    thread_t\
    \ threadB;\n    pthread_create(&threadB, NULL, threadB, NULL);\n    pthread_setaffinity_np(threadB,\
    \ sizeof(cpu_set_t), &cpuset);\n\n    sleep(5);\n\n    printf(\"%d %d\", i, j);\n\
    \    return (EXIT_SUCCESS);\n}\n```\n\nIf you run the program you will find that\
    \ each thread executes roughly the same number of loops.\n\nNow you set the second\
    \ thread to run on the same core by changing:\nCPU_SET(2, &cpuset);\n\nto:\nCPU_SET(1,\
    \ &cpuset);\n\nand run it again, you will discover that each thread now loops\
    \ for about the previous total. This is what you would expect as each of the two\
    \ threads now gets to run on the core for half of the total time.\n\nIf you run\
    \ the same program without setting affinities you will discover that, for a lightly\
    \ loaded machine, they will automatically be allocated to different cores and\
    \ as the load goes up they will eventually share a core.\n\nThere are Linux tools\
    \ that will allow you to discover what core is running and change its affinity.\
    \ There is also the cpuset facility, which can be used to dynamically change what\
    \ cores are used. However, if your goal is to allocate a single core to a single\
    \ important thread, then the best and simplest way of doing this, is to first\
    \ prohibit Linux from using the core by adding:\nisolcpu = core_number\n\nto the\
    \ boot loader. You can use a comma separated list of cores not to use."
