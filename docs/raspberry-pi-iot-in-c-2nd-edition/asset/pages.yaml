  md: "# A Server\n\nA server is more or less the same as a client from an implementation\
    \ point of view. The only real difference is that it has to wait around until\
    \ a client connects before dealing with a transaction.\n\nThe first step is to\
    \ create the socket and this follows the same pattern as for the client. We could\
    \ simply set up the address structures and create a socket, but now we know how\
    \ to use getaddrinfo it is easier to use this to do the job automatically and\
    \ flexibly:\n\n```\nstruct addrinfo hints, *server;\nmemset(&hints, 0, sizeof(hints));\n\
    hints.ai_family = AF_INET;\nhints.ai_socktype = SOCK_STREAM;\nhints.ai_flags =\
    \ AI_PASSIVE;\ngetaddrinfo(NULL, \"80\", &hints, &server);\n```\n\nThe AI_PASSIVE\
    \ flag assigns the current system's IP address. You can easily get address structures\
    \ for alternative addresses such as IPv6, but for simplicity we just ask for the\
    \ IPv4 address. Notice the specification of port 80 for an HTTP server socket.\
    \ After the call to getaddrinfo, the structs we need to create sockets are ready\
    \ to be used:\n\n```\nint sockfd = socket(server -> ai_family,\nserver -> ai_socktype,\n\
    server -> ai_protocol);\nbind(sockfd, server -> ai_addr, server -> ai_addrlen);\n\
    listen(sockfd, 10);\n```\n\nYou can see how easy getaddrinfo makes everything.\
    \ The call to bind assigns the socket to the IP address of the machine on port\
    \ 80 and listen starts things going with a queue of 10 pending clients.\n\nWe\
    \ can now accept to wait for a client to connect:\n\n```\nstruct sockaddr_storage\
    \ client_addr;\nsocklen_t addr_size = sizeof(client_addr);\nint client_fd = accept(sockfd,\n\
    \  (struct sockaddr *)&client_addr,\n  &addr_size);\n```\n\nAt this point your\
    \ program is blocked, waiting for a client to connect to the socket. If you want\
    \ to keep processing things then you need to use a socket in non-blocking mode,\
    \ see later."
  merge: -1
  pgno: 322
- img_proc: true
  md: 'at the moment, we can assume when accept returns there is a new socket descriptor
    in client and details of the client in client_addr Again, for simplicity, we are
    not going to check who the client is, just serve them a web page. The client will
    first send the server an HTTP GET packet, assuming they do want to GET a web page.
    We can read this in using:


    ```

    buffer[2048];

    int n = read(client_fd, buffer, 2048);

    ("%ws", buffer);

    ```


    The data in the headers will tell the server which file is required and you can
    do some string handling to process it the name. In this case we are going to send
    the same HTML file, no matter what the client asked for.


    The HTML is simple enough:


    ```

    <html><head><title>Temperature</title></head><body>{\"humidity":81, \"temperature":23.5C}</p></body></html>\r\n";

    ```


    This is a typical small page for a small server reporting temperature and humidity.
    The HTML could be anything as long as it is not too big. If this was real data
    from a sensor then the temperature and humidity would be dynamically added to
    the HTML string after reading. Also notice that the data takes the form of a JSON
    data object. In this case the JSON is wrapped by some simple HTML so that it can
    be displayed, but it is easy enough to change this so that we are transmitting
    raw JSON ready for processing, see later.


    To send this we need HTTP headers defining what we are sending back. The simplest
    set of headers that work is something like:


    ```

    HTTP/1.1 200 OK

    Content-Type: text/html;charset=UTF-8

    Server:CPi

    Date: Sat, 13 Jun 2020 6:23:15 GMT

    Content-Length:113

    ```


    Notice that we have two headers, Date and Content-Length, that need to be generated
    dynamically and be set to the current date and the size of the data portion respectively.
    There is also a blank line to mark the end of the headers. If you drop back to
    HTTP 1.0 you can avoid the dynamic headers, but they aren''t difficult to construct.'
