- img_proc: true
  md: '# Extracting the Data


    Now we have the data in the buffer as 0s and 1s, all that remains is to decode
    it into temperature and humidity readings. But first we will convert the bits
    into five bytes of data. The simplest way of doing this is to write a function
    that will pack eight bytes into a uint:


    ```

    uint8_t getByte(int b, int buf[]){

    int i;

    uint8_t result=0;

    b=(b-1)*8+1;

    for(i=b;i<=b+7;i++){

    result=result<<1;

    result=result|buf[i];

    return result;

    }

    ```


    The b parameter can be set to the byte that you want to extract from the array.
    For example, if b=2 then the for loop runs from i=9 to i=16, i.e. the second byte
    stored in the array. Notice that we skip the first bit because this signals the
    start of the data. The bit manipulation in the loop is a fairly standard shift
    to the left and OR the least significant bit until it reaches the result.


    Using this function getting the five bytes is trivial:


    ```

    int byte1 = getByte(1, buf);

    int byte2 = getByte(2, buf);

    int byte3 = getByte(3, buf);

    int byte4 = getByte(4, buf);

    int byte5 = getByte(5, buf);

    ```


    The first two bytes are the humidity measurement, the second two are the temperature,
    and the final byte is the checksum. The reason for the cast to int rather than
    keeping the data as bytes is that it makes computing the checksum easier.


    The checksum is just the sum of the first four bytes reduced to eight bits and
    we can test it using:


    ```

    printf("Checksum %hxo %d\n", byte5, (byte1+byte2+byte3+byte4)&0xFF);

    ```


    If the two values are different, there have been a transmission error. The addition
    of the bytes is done as a full integer and then it is reduced back to a single
    byte by the AND operation. If there is a checksum error, the simplest thing to
    do is get another reading from the device. Notice, however, that you shouldn''t
    read the device more than once every two seconds.'
  merge: -1
  pgno: 192
- img_proc: true
  md: "The humidity and temperature data are also easy to reconstruct as they are\
    \ transmitted high byte first and 10 times the actual value.\n\nExtracting the\
    \ humidity data is easy:\n\n```\nfloat humidity = (float)(byte1<<8 |byte2)/10.0;\n\
    printf(\"Humidity= %f \\n\", humidity);\n```\n\nThe temperature data is slightly\
    \ more difficult in that the topmost bit is used to indicate a negative temperature.\
    \ This means we have to test for the most significant bit and flip the sign of\
    \ the temperature if it is set:\n\n```\nfloat temperature;\nint neg=byte3 & 0x80;\n\
    byte3=byte3 & 0x7F;\ntperature=(float)(byte3<<8|byte4)/10.0;\nif(neg!=0) temperature=-temperature;\n\
    printf(\"Temperature= %f \\n\", temperature);\n```\n\nThis completes the data\
    \ processing.\n\n```\nA main program to call the measuring function is just:\n\
    int main(int argc, char** argv) {\n    struct sched_param priority = {5};\n  \
    \  sched_setscheduler(0, SCHED_FIFO, &priority);\n    mlockall(MCL_CURRENT | MCL_FUTURE);\n\
    \    if (!bcm2835_init())\n        return 1;\n    bcm2835_gpio_fsel(RPI BPLUS\
    \ GPIO_J8_07, BCM2835_GPIO_FSEL_INPT);\n    bcm2835_delayMicroseconds(1000);\n\
    \    GetDHT22data(RPI BPLUS GPIO_J8_07);\n    return 0;\n}\n```\n\nThe scheduler\
    \ attempts to make the program high priority so it won't be interrupted during\
    \ a measurement, see Chapter 21 for more details.\n\nYou can, of modify GetDHT22data\
    \ to not print any and return the humidity and temperature. You need to add it\
    \ to the checksum to take the measurement if there is an error, but you need to\
    \ keep in mind the 2-second maximum reading rate. Using a static variable you\
    \ could slow down the rate that DHT22 was used to more than two seconds per call.\n\
    \nThe point is that we have a simple and reliable program that reads the DHT22\
    \ without the need for drivers or a third party library. Decoding protocols of\
    \ this sort is easy and makes your program self-contained."
  merge: -1
