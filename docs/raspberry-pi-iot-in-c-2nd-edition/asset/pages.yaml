  md: 'To check open a command prompt, this works for Windows, Linux and Mac OSX,
    and type:

    java -version


    If you don''t see a listing something like:

    openjdk version "11.0.3" 2019-04-16 LTS

    OpenJDK Runtime Environment Corretto-11.0.3.7.1 (build 11.0.3+7-LTS)

    JDK 64-Bit Server VM Corretto-11.0.3.7.1

    (build 11.0.3+7-LTS, mixed mode)


    then either Java isn''t installed or it is misconfigured. Consult the documentation
    on the website of the JDK you are using. You can use any JDK from 9 through 12.
    If you haven''t got Java working, there is no point moving to install NetBeans
    as it simply will not work.


    To install Java on the Pi use:

    sudo apt update

    sudo apt install default-jdk


    The next step is very similar on all machines. Go to the NetBeans site:

    https://netbeans.apache.org


    and navigate to the download page. Select the latest version and either download
    an installer and follow its instructions or download the zip listed as Binaries.
    Its name should be something like:

    netbeans-12.0-bin.zip


    according to the version number. You will also see installers for various operating
    systems. At the time of writing there isn''t an installer for Pi OS and the other
    installers often fail to find the installed JDK. Luckily, working with the binary
    is just as easy.


    After the download is complete you have to extract the files in the zip to a suitable
    directory. If you are the only person going to use NetBeans then your Linux home
    directory or Program Files under Windows is suitable. Extract all of the files
    into the directory.


    Navigate to the directory and then netbeans/bin and run the file netbeans for
    a Linux installation or netbeans.exe or netbeans64.exe for a 32- or 64-bit Windows
    installation. These small programs install NetBeans and subsequently run the IDE
    after installation. Run it in a terminal, accept the license agreement and wait
    while it installs.'
