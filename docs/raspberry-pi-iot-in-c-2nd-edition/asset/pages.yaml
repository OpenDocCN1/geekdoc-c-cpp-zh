  md: "The only problem with this loop is that accept is a blocking call, which means\
    \ you can't include any additional processing in the loop. Sometimes this doesn't\
    \ matter. For example, if this was a processing loop for a sensor then the sensors\
    \ could be read after a client connected and the web data served. If this isn't\
    \ the case we need to make the call to accept non-blocking. The simplest way of\
    \ doing this is to use SOCK_NONBLOCK in the call to socket:\n\n```\nint sockfd\
    \ = socket(server -> ai_family,\n                               server->ai_type\
    \ | SOCK_NONBLOCK,\n                               server->ai_protocol);\n```\n\
    \nNote that this only works under Linux. If you want Unix compatibility then use\
    \ fcntl(sockfd, F_SETFL, 0_NONBLOCK);\n\nFollowing this call to accept will return\
    \ immediately with a negative value of client_fd if there is no client waiting:\n\
    \n```\nfor (;;) {\n\tint client_fd = accept(sockfd,\n\t\t(struct sockaddr *) &client_addr,\
    \ &addr_size);\n\tif (client_fd > 0) {\n\t\tint n = read(client_fd, buffer, 2048);\n\
    \t\tprintf(\"%s\", buffer);\n\t\tflush(stdout);\n\t\tn = write(client_fd, data,\
    \ strlen(data));\n\t\tclose(client_fd);\n\t}\n\n}\n```\n\nNotice that this polling\
    \ loop is a bad idea if the machine is a general purpose system as it uses 100%\
    \ of one's core. However, if the system is dedicated to doing a single job, this\
    \ is the most logical and effective solution. In this case, the polling loop also\
    \ implements some repetitive and essential tasks. Also notice that if the only\
    \ purpose of this program is to send data on temperature and humidity on demand,\
    \ then a better plan would be to block on the call to accept and read the sensor\
    \ when a client connected. While the program is blocked the operating system can\
    \ get on with other tasks. The non-blocking approach is only good if your program\
    \ has something else to do while waiting for a client.\n\nIn a more general context,\
    \ the problem of how to handle multiple incoming client connections has two general\
    \ solutions that divide opinion on which is better. Servers like Apache create\
    \ a new thread for each client that has to be served. This is efficient, but handling\
    \ lots of threads and cleaning up after they terminate can be a problem. Node.js,\
    \ on the other hand, uses a single thread to deal with all client requests and\
    \ manages things using events. Event"
