  md: '# # Chapter 10

    Using The I2C Bus


    The I2C, standing for I-Squared-C, or Inter I2C bus, is one of the most useful
    ways of connecting moderately sophisticated sensors and peripherals to any processor.
    The only problem is that it can seem like a nightmare confusion of hardware, low-level
    interaction and high-level software. There are few general introductions to the
    subject because at sight every I2C device is different, but there are shared principles
    that can help you work out how to connect and talk to a new device.


    The I2C bus is a serial bus that can be used to connect multiple devices to a
    controller. It is a simple bus that uses two wires: one for data and one for a
    clock. Despite being lots of problems in using the I2C bus, because it isn''t
    well standardized and devices can conflict and generally do things in their own
    way, it is still commonly used and too useful to ignore.


    The big problem in starting with the I2C bus is that you will find it described
    at many different levels of detail, from the physical bus characteristics and
    protocol to the details of individual devices. It can be difficult to relate all
    of this together and produce a working project. In fact, you only need to know
    the general workings of the I2C bus, some general features of the protocol, and
    know the addresses and commands used by any particular device.


    To explain and illustrate these idea we really do have to work with a particular
    device to make things concrete. However, the basic stages of getting things to
    work, the steps, the testing and verification, are more or less the same irrespective
    of the device.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# I2C Hardware Basics


    The I2C bus is very simple from the hardware point of view. It has just two signal
    lines, SDA and SCL, the data and clock lines respectively. Each of these lines
    is pulled up by a suitable resistor to the supply line at whatever voltage the
    devices are working - 3.3V and 5V are common choices. The size of the pull-up
    resistors isn''t critical, 4.7K is typical as shown in the circuit diagram.


    You simply connect the SDA and SCL pins of each of the devices to the pull-up
    resistors. Of course, if any of the devices have built-in pull-up resistors you
    can omit the external resistors. More of a problem is if multiple devices each
    have pull-ups. In this case you need to disable all but one.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_163_0.png)


    The I2C bus is an open collector bus. This means that it is actively pulled down
    by a transistor set to on. When the transistor is off, however, the bus returns
    to the high voltage state via the pull-up resistor. The advantage of this approach
    is that multiple devices can pull the bus low at the same time. That is, an open
    collector bus is low when one or more devices pulls it down and high when none
    of the devices is active.


    The SCL line provides a clock which is used to set the speed of data transfer,
    one bit is presented on the SDA line for each pulse on the SCL line. In all cases,
    the master drives the clock line to control how fast bits are transferred. The
    slave can, however, hold the clock line if it needs to slow down the data transfer.
    In most cases the I2C bus has a single master device, the Pi in our case, which
    drives the clock and invites the slaves to receive or transmit data. Multiple
    masters are possible, but this is advanced and usually not necessary.'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'At this point we could go into the details of how all of this works in terms
    of bits. However, the bcm2835 library handles these details for us. All you really
    need to know is that all communication occurs in 8-bit packets. The master sends
    a packet, an address frame, which contains the address of the slave it wants to
    interact with. Every slave has to have a unique address, which is 7 bits, but
    it can be 11 bits, and Pi does support this.


    One of the problems using the I2C bus is that manufacturers often use the same
    address, or set of selectable addresses, and this can make using particular combinations
    of devices on the same bus difficult or impossible.


    The 7-bit address is set as the high-order 7 bits in the byte and this can be
    confusing as it is stated that as 0x48 in the datasheet results in 0x90 being
    sent to the device. The low-bit of the address signals a write or a read operation
    on whether it is a 0 or a 1. After sending an address frame it then sends or receives
    data frames back from slave. There are also special signals used to mark the start
    and end of an exchange of packets, but the library functions take care of these.


    This is really all you need to know about I2C in general to get started, but you
    will certainly need them as you debug I2C programs.


    The clock SCL and SDA lines rise high. The master signals a Start by pulling the
    SDA line down - S in the diagram below. The clock is pulled low by the master,
    during which time the SDA line can change state. The bit is in the middle of the
    following high period of the clock pulse B1, B2 and so on in the diagram. This
    continues until the last bit has been sent when the data is allowed to rise while
    the clock is high, sending a stopB - P in the diagram. Notice that when data is
    being transmitted the data line doesn''t change while the clock is high. Any change
    in the data line when the clock sends a start or a stop bit, i.e. clock high and
    falling data line is a start bit and clock high rising data line is a stop:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_164_0.png)


    The clock speed was originally set at 100kHz, standard mode, but then increased
    to 400kHz in fast mode. In practice, devices usually specify a maximum clock speed
    that they will work.'
  merge: -1
  pgno: 164
