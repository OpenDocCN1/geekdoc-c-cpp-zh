- img_proc: true
  md: 'and you need to add:


    ```

    #define _DEFAULT_SOURCE

    #include <netdb.h>

    ```


    to the start of your program and:


    You pass the IP address or the DNS name, i.e. either "93.184.216.34" or "www.example.com",
    or as node. The service can be specified as a port address "80" or as a service
    name "http". The hints struct is used to specify what sort of socket and address
    you are going to use. The result is a linked list of structs pointed at by getaddrinfo.
    The only slight complication in using getaddrinfo is that you might have more
    than one result - one for IPv4 and say for IPv6 - then you have to work out which
    to actually use.


    The result contains structs that you need to use both the socket and to connect,
    setting up the hints as:


    ```

    struct addrinfo hints;

    memset(&hints, 0, sizeof(hints));

    hints.ai_family = AF_INET;

    hints.ai_socktype = SOCK_STREAM;

    ```


    asks for the struct to be made for a TCP IPv4 socket.

    We now get the address details we need:


    ```

    struct addrinfo *servinfo;

    int status = getaddrinfo("www.example.com", "80",

    &hints, &servinfo);

    ```


    Notice that you could use the IP address as a string.

    As long as this works, the result should be a linked list with a single entry.
    In this case servinfo points to the first and only addrinfo struct. If there are
    any additional structs they are pointed at by


    ```

    servinfo->next

    ```


    which is NULL if there is no next struct.

    Using the single result is easy. To create the socket we use:


    ```

    int sockfd = socket(servinfo->ai_family,

    servinfo->ai_socktype,

    servinfo->ai_protocol);

    ```


    and connect to the server using:


    ```

    connect(sockfd, servinfo->ai_addr,

    servinfo->ai_addrlen);

    ```'
