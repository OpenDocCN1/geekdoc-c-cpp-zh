  md: '# What Else Can You Use PWM For?


    PWM lines are incredibly versatile and it is always worth asking the question
    "could I use PWM?" when you are considering almost any problem. The LED example
    shows how you can use PWM as a power controller. You can extend this idea to a
    computer-controlled switch-mode power supply. All you need is a capacitor to smooth
    out the voltage and perhaps a transformer to change the voltage. You can also
    use PWM to control the speed of a DC motor and if you add a bridge circuit you
    can control its direction and speed. Finally, you can use a PWM signal as a modulated
    carrier for data communications. For example, infrared controllers make use of
    a 38kHz carrier, which is roughly a 26µs pulse. This is switched on and off for
    1ms and this is well within the range that the PWM can manage. So all you have
    to replace the red LED in the previous circuit with an infrared LED and you have
    the start of a remote control, or data transmission, line:


    # Some Hardware Details


    # Advanced Topic


    The PWM hardware is more complicated than what is required to produce a simple
    PWM signal. It also has a serialize mode, which can clock a 32-bit word of a register
    to serialize a pulse train with the characteristics you require. To make this
    even more useful, it also supports the use of DMA to keep the serialization queue
    full. These features are beyond the scope of this book, but if you understand
    how things work they are not difficult to use.


    The PWM has a large number of registers associated with it, including a control
    register and status register for both channel, a pair of data and range registers
    for each channel, plus a DMA and a FIFO for serialization.


    The offsets from cm2835_pwm as word addresses are:


    ```

    BCM2835 PWM CONTROL 0

    BCM2835 PWM STATUS 1

    BCM2835 PWM DMAC 2

    BCM2835 PWM0 RANGE 4

    BCM2835 PWM0 DATA 5

    BCM2835 PWM1 FIFO 6

    BCM2835 PWM1 RANGE 8

    BCM2835 PWM1_DATA 9

    ```'
  merge: -1
