  md: 'This indicates that the interrupt routine takes around 48µs to complete which
    gives it time to be ready for the next rising edge in 55µs. Thus interrupts can
    handle pulses at around 18kHz where using epoll on the same thread can deal with
    28kHz and an event-or level-polling loop manages 1.2MHz.


    At the moment polling - real polling - is. In fact, it would be faster to use
    the second thread to poll the GPIO state and run the interrupt handler directly
