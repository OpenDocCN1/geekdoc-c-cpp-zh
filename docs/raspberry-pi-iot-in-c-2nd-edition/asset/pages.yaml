    \ bcm2835_delayMicroseconds(2000000);\n        bcm2835_pwm_set_data(0, 52 * 90\
    \ / 180 + 920);\n        bcm2835_delayMicroseconds(2000000);\n        bcm2835_pwm_set_data(0,\
    \ 52 * 180 / 180 + 920);\n        bcm2835_delayMicroseconds(2000000);\n    }\n\
    \    return (EXIT_SUCCESS);\n}\n```\n\nIf you run this program using the transistor\
    \ driver circuit you should find that\nthe servo moves as before.\n\nThings may\
    \ work but the servo might not reach its limits of movement.\nServos differ in\
    \ how they respond to the input signal and you might need to\ncalibrate the pulse\
    \ widths. Many robot implementations, for example,\ncalibrate the servos to find\
    \ their maximum movement using either\nmechanical switches to detect when the\
    \ servo is at the end of its range or\nvision sensor. Hence you will often see\
    \ a robot doing a \"warm up\"\nbefore moving. What is happening is that each servo\
    \ is being moved until it\nactivates the limit switch giving the duty cycle needed\
    \ to move it to that\nposition. Low cost servos are particularly hard to pin down\
    \ in terms\nspecification and variations in behavior generally have to be taken\
    \ account of software."
