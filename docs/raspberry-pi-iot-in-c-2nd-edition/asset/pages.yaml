  md: '# Chapter 3


    # Getting Started With The GPIO


    In this chapter we take a look at the basic operations involved in using the

    Pi''s General Purpose Input/Output (GPIO) lines with an emphasis on output.

    We''ll consider questions such how fast you can change a GPIO line, how

    do you generate pulses of a given duration and how can you change multiple

    lines in sync with each other?


    While there are other, more direct, ways that we will examine later, the

    easiest way to work with the GPIO lines is with the C library for the

    Broadcom BCM2835 chip on which the Pi 1 and Zero are based. The Pi 2 is

    based on the BCM2836, the Pi 3 and 3+ are based on the BCM2837 and

    BCM2837B and the Pi 4 is based on the BCM2711. As far as

    GPIO lines and other peripherals are concerned the differences are minor.


    The BCM2835 library is designed to make it easy to access the hardware and

    despite its name works with all of the BCM chips used by the Pi. It is open

    source and doesn''t need any Linux drivers.


    In this chapter we take a first look at using bcm2835, how to install it and

    to control the GPIO pins as basic output lines. Later on we will look at

    how the library works and how to avoid using it if you really need to. If you

    want to set up using VS Code see Appendix II.


    # Setting Up the BCM 2835 Library With NetBeans


    Exactly how to set up this library is a tiny bit trickier than most it has

    to run as root to be able to access all of the GPIO facilities. It is also a little

    puzzling as how to set up the library if you are using a remote build server.

    Where do you copy the library, for example? As it turns out the answer to this

    is easy.'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'First we need to set up a password for the standard root user and allow the
    root user to log in using SSH. To allow root to log on with a password we have
    to assign a password, so log in as user pi and give the command:

    sudo passwd root


    you will be prompted to type the root password twice. Next use a text editor of
    your choice, e.g. nano, to edit the ssh.config file to allow root to log on via
    SSH:

    sudo nano /etc/ssh/sshd_config


    Find:

    PermitRootLogin without-password

    and change it to read:

    PermitRootLogin yes


    Reboot the system to make the changes take effect or restart the SSH agent using:

    sudo service ssh restart


    Check that this works by logging in via an SSH console, such as PuTTY, using the
    user name root and the password you supplied earlier.


    If you are using NetBeans on the Pi log in as root whenever you are working with
    it. If you are using NetBeans with the Pi as a remote build host then you need
    to create a new build host with the user name root and the password you specified.
    This might have the side effect of moving the location where projects are created
    to root''s home directory. With these changes made, check that you can create
    and/or run a project with the new build host.


    If you find that a project is failing to run and returns a -1 status with no reason
    given, the chances you are not running the program as root.


    The final step is to download the BCM 2835 library from:

    http://www.airspace.com/mikem/bcm2835/


    At the time of writing this is in version 1.60 and works with all versions of
    the Raspberry Pi including the Zero and the Pi 4.


    To install the library you need to download into it root''s home directory. You
    can do this from the command line using:

    sudo wget "http://www.airspace.com/mikem/bcm2835/bcm2835-1.60.tar.gz"


    You may need to change the URL to reflect the latest version. The wget command
    as given will download the tarball to the current directory.'
