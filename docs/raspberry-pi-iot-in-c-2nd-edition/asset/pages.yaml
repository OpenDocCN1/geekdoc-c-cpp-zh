  md: 'In this case the GPIO line is set up as an output with a pull-up and it fires
    an event on the falling edge of a signal. Notice that now the if statement tests
    not the state of the line, but the state of the event flag. The difference is
    that if the user presses the button at any time during the 20-second sleep, the
    flag is set no matter what the program is doing, so instead of sleeping it could
    be getting on some work, confident that it won''t miss a button press. However,
    it cannot know exactly when the button was pressed and it cannot know how many
    times the button was pressed.


    Events allow you to avoid missing a single input while polling, but cannot handle
    inputs. You could implement a full queue-based event handling system, but this
    would only make sense on a multi-core machine like a Pi 4 and with the thread
    event detection locked into a separate core from the rest of the program. This
    probably isn''t worth the effort. A more reasonable alternative is to use the
    interrupt abilities of the GPIO character driver.


    # Interrupts And The GPIO Character Driver


    **Advanced:** Skip unless you use it.


    Linux files can generate interrupts to tell the kernel when they change state
    – for example have some data to read. User-mode programs often need to wait on
    files to be suspended and there are special commands that the job - `select`,
    `poll` or `epoll`. Until recently poll would have been the preferred way to wait
    for a file to be ready, but today epoll is its more sophisticated replacement.


    To be clear about what is happening: when your program waits on a file using epoll
    it is suspended and other threads get to use the processor. When the file is ready
    to be used, it fires an interrupt which the kernel handles and the interrupt service
    routine that called wakes up your suspended program.


    Notice that, while this is a hardware interrupt, your program can''t do anything
    but wait for it to happen, so it is a little more restrictive than a full interrupt.
    You can make it much more like a full interrupt by waiting for the file to be
    ready on another thread while allowing your main program''s thread to continue
    with other work – see the next section.'
