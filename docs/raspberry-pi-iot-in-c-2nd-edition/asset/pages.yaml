  md: '# The Pi I2C


    The Pi Zero and Pi 3 have built-in I2C masters referred to as BSC controllers.
    The Broadcom Serial controller is essentially an implementation of the I2C bus
    and in general you don''t have to worry about incompatibilities. The Pi 4 has
    4 BSC controllers including the original. BSC22, and BSC7 in the case of the Pi
    4, is dedicated to working with the HDMI interface, and therefore aren''t available
    for use.


    The pin and GPIO assignments:


    | Function | Pin | |

    |---|---||

    | SDA | 27 | GPIO0 |

    | SCL | 28 | GPIO1 |


    BSC1


