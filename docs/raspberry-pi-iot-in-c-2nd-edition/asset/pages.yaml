  md: '# Summary


    +   - C is a very good language to learn for any IoT project. It is fast and

    efficient and close to the machine. There are lots of other languages

    that have it as their ancestor, so it is worth learning.


    +   - You can write programs in C using an editor and the command

    line compilers, but NetBeans makes it much easier to create and

    debug programs. It is free to download and is open source.


    +   - If you don''t want to use NetBeans then an alternative is Visual Studio

    Code which can be configured to do remote development – see

    Appendix II


    +   - There are two ways to use NetBeans with a Raspberry Pi. You can

    install it on the Pi or you can install it on a desktop machine and use

    the Pi as the build host.


    +   - There are lots of advantages to using a desktop machine to edit the

    programs in NetBeans and using the Pi as the build host to compile

    and run them.


    +   - All you have to do the Pi as a build host is to make sure it is

    correctly set up, know its IP address and be sure that SSH is enabled.

    You then set the Pi up as a build host in NetBeans.


    +   - When you create a new project NetBeans creates the files you need to

    started in the NetBeansProjects directory, which is either in your

    home directory on Linux or your Documents directory under

    Windows.


    +   - When you run your project, NetBeans will first upload the files to the

    NetBeansProjects folder if you are using a remote build host and use

    the compilers specified to run the program.'
