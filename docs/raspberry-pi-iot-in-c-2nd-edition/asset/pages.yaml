- img_proc: true
  md: '# # Summary


    +   - The BCM 2835 library is a low-level open source C library that provides
    direct access to the hardware.


    +   - It is best used as a user with root permissions and the simplest way to
    do this if you are using remote development is to enable SSH for root.


    +   - Installing the BCM 2835 library is easy, but notice you have to do it on
    any Pi you are working with. It doesn''t need to be installed on any remote development
    servers you are using.


    +   - You have to add #include <bcm2835.h> at the start of every program which
    uses the library and you have to add bcm2835 to the linker.


    +   - NetBeans makes compiling and running programs easy. It also has a debug
    facility that allows you to step through a program.


    +   - Pin numbering is complicated by the fact that there are GPIO numbers and
    physical pin numbers. You can use either with bcm2835, but if you simply specify
    a number then this is a GPIO number.


    +   - The pinout command used at the Pi console will print a map of the pins.


    +   - Not all of the GPIO lines that the Pi has are brought out to the main connector.
    Some are used internally and some are simply ignored.


    +   - Some of the GPIO lines have alternative functions and these are best avoided
    if all you need is a simple GPIO input/output line.'
  merge: -1
