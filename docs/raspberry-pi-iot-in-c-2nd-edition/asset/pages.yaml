    | 4117 pi | 20 | 2372 | 416 | 340 | R | 12.3 | 0.1 | 00:04:57 stress |

    | 4118 pi | 20 | 2372 | 416 | 340 | R | 12.3 | 0.1 | 00:04:58 stress |

    | 4119 pi | 20 | 2372 | 416 | 340 | R | 12.3 | 0.1 | 00:04:58 stress |


    You can see that our C program gets 50% of the CPU time. The other processes get
    roughly 50% divided between them and form a single group for the purposes of scheduling.


    With the second group of processes running, the logic analyzer shows a very different
    pattern:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_365_0.png)


    You can see that the pulse-generating program gets 10ms and the other group of
    processes gets 10ms. You can see that, regardless of the times implied by the
    CFS, it is the 10ms tick interrupt that is most important in determining how long
    a process runs for.


    You get similar behavior from a Pi 4, but only after all four cores have been
    utilized.


    # RT Scheduling


    Every Linux thread is assigned a scheduling policy and a static priority. The
    normal scheduling algorithm that Linux uses, SCHED OTHER, applies to all threads
    with static priority zero. If you are not using real-time scheduling then all
    the threads run at priority zero. In place of a static priority each thread is
    assigned a dynamic priority which increases each time it is passed over for execution
    by the scheduler. The scheduler gives the with'
