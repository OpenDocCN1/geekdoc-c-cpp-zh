- img_proc: true
  md: 'In this chapter we use GPIO lines to interface with the 1-wire bus but in Chapter
    16 the UART connection is used to create an alternative method with some advantages.


    You might think we have to initialize the GPIO line so that it works in pull-up
    mode. This isn''t necessary and the default push-pull mode will do. The reason
    is that, in the case of the 1-wire bus, the master controls when other devices
    send their data. Typically the master sends a pulse and the slaves respond by
    pulling the line. As long as the master doesn''t drive the line during the period
    when the slaves are responding, everything is fine.


    What do we in practice is to configure the GPIO line for output only when the
    master needs to drive the line. Once the master is finished the GPIO line is set
    back to input and the pull-up resistor is allowed to pull the line back. After
    this, any slave wanting to send data is free to pull the line low.


    The first transaction we use is the initialization pulse. This is simply a low
    pulse that lasts at least 480µs, a pause of 15µs to 60µs follows and then all
    of the devices on the bus pull the line low for 60µs to 240µs.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_200_0.png)


    The suggested timings are set the line low for 480µs and read the line after 70µ
    followed by a pause of 410µs.


    This is fairly easy to implement as function:


    ```

    int presence(uint8_t pin) {

    bcm2835 gpio_fsel(pin, BCM2835, GPIO_FSEL_OUTP);

    bcm2835 gpio_write(pin, LOW);

    bcm2835 delay_Microseconds(480);

    bcm2835 gpio_fsel(pin, BCM2835, GPIO_FSEL_INPT);

    bcm2835 delay_Microseconds(70);

    uint8_t b = bcm2835 gpio_lev(pin);

    bcm2835 delay_Microseconds(410);

    return b;

    }

    ```'
  merge: -1
  pgno: 200
- img_proc: true
  md: "We pull the low line for 480µs and then let it be pulled up by changing the\
    \ line to input, i.e. high impedance. After a 70µs wait, which is right at the\
    \ start of the guaranteed period when the line should be low if there is an active\
    \ device on the bus, we read the input line and then wait another 410µs to complete\
    \ the data slot.\n\nThe Timings in this case are not critical as long as the line\
    \ is read while it is held low by the slaves, which is never less than 60µs and\
    \ is typically as 100µs.\n\nThe actual pulse timings with the values given are\
    \ a 482µs reset and a total slot time of 632µs. If there is a device the function\
    \ should return a 0 and if there are no devices it should return a 1.\n\n```\n\
    #include <bcm2835.h>\n#include <stdio.h>\n```\n\n```\nint presence(uint8_t *ptr);\n\
    \nint main(int argc, char **argv) {\n\n    if (!bcm2835_init())\n        return\
    \ 1;\n\n    if (presence(RPI_BPLUS_GPIO_J8_07) == 1) {\n        printf(\"No device\
    \ \\n\");\n    } else {\n        printf(\"Device present \\n\");\n    }\n\n  \
    \  bcm2835_close();\n    return 0;\n}\n```\n\nIf you try this partial program\
    \ and have a logic analyzer with a 1-wire protocol analyzer you will see something\
    \ like:\n\n| +100us | +200us | +300us | +400us | +500us | +600us | Measurements\
    \ |\n|---|---|---|---|---|---||}{\n| | RESET condition | | | | PRESENCE condition\
    \ | Width: 482.4us |\n| | | | | | | Period: 513.1us |\n| | | | | | | DutyCycle:\
    \ 5.98323913% |\n| | | | | | | Frequency: 1.948937837KHz |\n| | | | | | | Pulse\
    \ Measurements |\n\nSeeing a presence pulse is the simplest and quickest way to\
    \ be sure that hardware is working."
