    : {\n      \"showReuseMessage\": true\n    }\n  },\n  {\n    \"label\": \"copyARMheaders\"\
    ,\n    \"type\": \"shell\",\n    \"command\": \"mkdir ${workspaceFolder}/include/\\\
    nscp -r ${config:sshUser}@${config:sshEndpoint}:/usr/include ${workspaceFolder}/include/\"\
    ,\n    \"problemMatcher\": [],\n    \"presentation\": {\n      \"showReuseMessage\"\
    : true,\n      \"clear\": true\n    }\n  }\n}\n```\n\nAll of the files can be\
    \ downloaded from iopress.info."
