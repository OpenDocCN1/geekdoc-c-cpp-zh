- img_proc: true
  md: '# # Chapter 21

    # Almost Real-Time Linux


    This chapter is about advanced scheduling and not every Raspberry Pi C programmer
    needs to know about this. Overall you can use the ideas to achieve a smaller latency
    and some aspects of real time service, but you cannot eliminate the possibility
    of your program being interrupted.


    You can write real time programs using standard Linux as long as you know how
    to control scheduling. In fact, it turns out to be relatively easy and it enables
    the Pi to do things you might not think it capable of. There are also some surprising
    differences between the one- and quad-core Pis that make you think again about
    real-time Linux programming.


    If you are writing a real-time system there are two things that should concern
    you - how fast the system can act and how poor this response can be in the worst
    case. We usually divide this response into throughput and latency. Throughput
    is many events you can deal with per second and it is what we have been concerned
    with so far. Latency is how quickly the system responds to a one-off event. Throughput
    is mostly a hardware matter, but latency is very much affected by the software
    and the need to multitask and keep the system running. The machine may have the
    hardware speed to respond to an event, but it might not be able to do it it is
    doing something else.


    After learning how to generate accurate and fast pulses, we now have the ability
    to work with I/O down in the microsecond region, but we still have the problem
    that program can be interrupted at any time by the operating system. This means
    that our outputs and inputs can go drastically wrong. For example, if you generate
    a fast pulse train in the 1ms range using a standard GPIO line and set logic analyzer
    to trigger on a long pulse, you will eventually find one or very long pulses -
    typically in the millisecond range. This problem becomes worse the more the CPU
    is loaded as the operating system switches between tasks to make sure everything
    has an opportunity to progress. There are many situations where this is not just
    inconvenient, but completely unacceptable. Pi OS is not a real-time operating
    system and we cannot turn it into one, but there is a great deal we can do to
    make the problem less.'
  merge: -1
  pgno: 360
- img_proc: true
  md: '# The Scheduling Problem


    If you are familiar with microcontrollers such as the PIC, AMTEL, etc, then

    tidea that there could be something getting between you and the hardware

    will be new. The majority of simple microcontrollers do nothing but run the

    program you download. Any talk of an "operating system" generally refers to

    code that does the downloading or minimal system preparation. When you

    write a control loop you can safely assume that the loop will run as you

    wrote it and without interruption, unless of course you have coded an

    interrupt handler.


    The point is in many situations your program is the only program

    running and you are in complete charge of the processor.


    In the case of running a program on the Raspberry Pi''s ARM processor the

    situation is very different. Your program is just one of a number of programs

    running at any given time. The Raspberry Pi has up to four cores and this

    means that at most four programs can be running at any given time. The

    operating system is responsible for starting and stopping programs so that

    each and each program has a turn to run. This is called "scheduling" and it is

    a problem if you are trying to write a real-time system.


    The problem is that you might write a program that toggles a GPIO

    bween high and low with a given timing, but whether this timing is

    hon depends not just on your program but on the operating system as

    well. You can''t be sure how the operating system will treat your program

    because it depends, in a fairly complex way, on what else is running on the

    system and exactly what the other programs are doing.


    Sometimes this is expressed as program execution being non-deterministic,

    whereas in a simple microcontroller unit (mcu) it is deterministic.

    means if you run the same program twice on the Raspberry Pi you

    probably don''t get exactly the same result, whereas on an mcu this is

    reasonable expectation.


    The whole subject of multitasking operating systems, and scheduling in

    particular, is a large one. It is usually taught as part of a computer science

    deg, but generally it does not applies to real-time programming. What this

    means is that there is often a lot of guesswork involved in getting programs

    with real-time demands to work properly under general operating systems

    s as Linux. In fact, it is often stated that you can''t do real-time processing

    under Linux because you cannot place a bound, an upper limit, on how

    long your program might be suspended by the OS. This isn''t true and real-

    time processing on standard Linux is possible, as long as you are able to live

    within the constraints.'
  merge: -1
  pgno: 361
- img_proc: true
  md: 'As an alternative you could opt to run a specially designed real-time OS that
    does provide guarantees on how quickly a request will be serviced. There are such
    real-time versions of Linux that you can install, but, since version 3.14, the
    Linux Kernel has sufficient real-time facilities for many applications, so you
    don''t need to move to anything different to the standard Pi OS.


    Before we continue, it is important to realize that there is no way that a real-time
    operating system can increase the speed of the processor; the maximum speed of
    operation cannot be improved upon. In the case of the Raspberry Pi this means
    that you can achieve pulses of around 1ms if you are careful and no amount of
    real-time programming is going to improve on.


    What real time provides is higher consistency of response time. It isn''t perfect,
    however, and we have used all of the features of real-time Linux there will still
    be small periods of time when your program is not operating and there is little
    to be done about.


    # The Completely Fair Scheduler


    After 2007 most versions of Linux make use of a new default scheduler called the
    Completely Fair Scheduler (CFS) which, of course, is not completely fair. All
    threads that run under a real-time scheduling policy have static priority 0, which
    means that what happens is, for every thread with static priority 0, a dynamic
    priority is calculated. The system defines a target latency, usually around 20ms,
    and a dynamic time slice is computing:


    ```

    timeslice = target latency / N

    ```


    where N is the number of tasks being scheduled. Notice that unlike the original
    Linux scheduler the timeslice isn''t fixed in size. The idea is that each of the
    N tasks will be run in each real latency period – this is why it is called completely
    fair.


    You can find the target latency:


    ```

    cat /proc/sys/kernel/sched_latency_ns

    ```


    For the Pi Zero it is 6ms and for the Pi 4 it is 18ms.


    Of course, there are a lot of tasks the timeslice could become practically small.
    To avoid this, a minimum granularity which you can display using:


    ```

    cat /proc/sys/kernel/sched_min_granularity_ns

    ```


    For a Pi Zero it is 0.75ms, and for the Pi 4 it is 2.250ms.'
  merge: -1
  pgno: 362
- img_proc: true
  md: 'The rule is that if the timeslice is less than the minimum granularity then
    the machine is overloaded and any attempt at running threads in a fair way is
    abandoned and the timeslice is set to the minimum granularity.


    What this means is for a Pi Zero the timeslice is 6/ms for N≤8 and 0.75ms otherwise.
    For a Pi 4 the timeslice is 18/ms, for N≤8 and 2.25ms otherwise.


    Each runnable thread has a timeslice adjusted by a programmer-set “nice" value.
    If the thread yields before its timeslice is up, then the scheduler looks at the
    runnable threads and selects the one with the lowest virtual runtime (vruntime)
    which records the number of nanoseconds each task has run for. You can see that
    the objective is to try to even how much each thread gets to run by starting the
    thread with the lowest runtime for a timeslice.


    # Tick Jiffy


    All of this sounds very reasonable, but if you start to examine what actually
    happens you will find a very different picture. The reason is that the scheduling
    is performed by calls to the scheduler kernel function and this usually isn''t
    invoked enough to make CFS work as it should in theory. In practice, the scheduler
    is called at regular intervals by the system timer. How often the scheduler is
    called depends on a kernel constant USER_HZ which is set when the kernel is compiled.
    In other words, it is not an easy value to change unless you are happy about compiling
    the kernel. You can find the current setting using the command line:


    ```

    getconf CLK_TCK

    ```


    If you try this on the Pi Zero or the Pi 4 you will discover that the value is
    100. This means the clock ticks 100 times per second, i.e. every 10ms. This period
    of time is also known as a "jiffy", and despite attempts to get rid of it, it
    is still a fundamental unit in Linux. The scheduler is called at other times,
    such as when an interrupt occurs, but the clock tick is the only guaranteed regular
    call. This means that on average the CFS doesn''t have an opportunity to schedule
    apart from every 10ms and occasionally due to some other, irregular interrupt.
    Given that the minimum granularity is 0.75ms for a Pi Zero and 2.25ms for a Pi
    4, you can see that CFS isn''t going to work as it would if the scheduler was
    run more often.'
