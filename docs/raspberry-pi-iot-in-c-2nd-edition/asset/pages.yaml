- img_proc: true
  md: '# The UART Hardware


    There are a variable number of UARTs according to the model of Pi you are using.
    The current situation is:


    The Raspberry Pi Zero, 1, 2, and 3 each contain two UARTs as follows:


    | Name | Type |

    |---|---|

    | UART0 | PL011 |

    | UART1 | mini UART |


    The Raspberry Pi 4 has both these plus four additional PL011s, which are disabled
    by default:


    | Name | Type |

    |---|---|

    | UART2 | PL011 |

    | UART3 | PL011 |

    | UART4 | PL011 |

    | UART5 | PL011 |


    The mini UART is something of a problem in that it is limited in what it can do
    and its speed is linked to the system clock which, of course, can vary in speed.
    If possible, it is better to avoid it.


    Unfortunately, in all of the Pi models that support Bluetooth - Pi Zero W, Pi
    3 and Pi 4, the full serial interface UART0 is used by the built-in Bluetooth
    device and the console uses the mini-UART1 with all its clock problems. This means
    that for Pi Zero W and Pi 3, unless you reassign UART0, you only have the mini-UART
    to work with. In most cases it is better to swap the role of the two serial ports.


    To swap the use of the UARTs you have to edit /boot/config.txt, for example:


    ```

    sudo nano /boot/config.txt

    ```


    and add the line:


    ```

    dtoverlay = pi3-miniuart-bt

    ```


    If you want to disable Bluetooth completely you can add:


    ```

    dtoverlay = pi3-disable-btpi3-disable-bt

    ```


    to the end of /boot/config.txt.


    Following these you can use UART 0 for your own purposes.'
  merge: -1
  pgno: 258
