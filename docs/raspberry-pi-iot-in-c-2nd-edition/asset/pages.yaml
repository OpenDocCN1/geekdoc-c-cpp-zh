- img_proc: true
  md: 'highest dynamic priority an opportunity to run one quantum time or for one
    time slice. A thread can be suspended before its time slice is up because it has
    to wait for I/O or because it is blocked in some other way. Any time a thread
    makes a system call it is also a candidate to be suspended in favor of another
    thread.


    You have only a little control over the computation of the dynamic priority. All
    you can do is its initial value using the nice command or setpriority.


    The normal scheduling algorithm doesn''t provide much control over what runs.
    It''s "fair" in the sense that all threads turn at running, but it isn''t possible
    to set a thread to have a high priority so that it runs in preference to all others.
    To do this we need to look at the real-time scheduling options. The ones that
    are important for us are SCHED_FIFO, SCHED_DEADLINE, and some cases SCHED_RR.
    These apply to real-time threads with static priorities 1 (low) to 99 (high).


    Earliest Deadline Scheduling (EDS), introduced in Kernel 3.14 is a new Linux scheduling
    policy. Due to its recent introduction, isn''t used much, basically because it
    seems complicated. EDS is covered in a later section.


    The first thing to note is that a thread with priority greater than zero will
    always run in preference to a thread with zero priority and so all threads will
    run before a thread using the normal scheduling algorithm.


    What happens in FIFO is the system maintains queues of threads that are ready
    to run at each priority. It then looks for the list with the highest priority
    threads ready to run and it starts the thread at the head of the list. When a
    thread is started it is added to the back of its priority queue. Once a FIFO thread
    gets to run it can be preempted by a thread with a higher static priority that
    is ready to run.


    If a FIFO thread is suspended because a higher priority thread, it goes back to
    the head of the queue. This makes the next thread to resume. This is in the sense
    that the schedule is FIFO (First In First Out) - if a thread is suspended by another
    thread of higher priority it becomes runnable then it is restarted as soon as
    the thread that replaced it is suspended or stops running. Finally, if a thread
    explicitly yields, by calling yield(), it goes to the end of the priority queue.


    # Setting Scheduling Priority


    This sounds like chaos, but if you think about it for a moment and start simply,
    you will see that it provides most of what you are looking for. You are in full
    control of the Raspberry Pi and so you can determine exactly how many non-zero
    priority threads there are. By default, all of the standard threads are priority
    zero and scheduled by the normal scheduler.'
