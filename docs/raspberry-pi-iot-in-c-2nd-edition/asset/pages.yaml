- img_proc: true
  md: "# Automatic Busy Wait Calibration\n\nIt is usually said that the big problem\
    \ using busy waits is that they depend on how fast the CPU is working. The other\
    \ big problem with them is that they lock up the CPU and stop it from doing anything\
    \ else, but this is a minimum problem with a multi-core processor.\n\nYou can\
    \ set constants at the start of a program to allow it to work with different versions\
    \ of the Pi, but it is also fairly simple to add a calibration routine. All you\
    \ have to do is time how long set number of loops take and then work out how many\
    \ loops you need for a busy wait of 1us and to derive all other delay times.\n\
    \nFor example:\n\n```\n#define GNU_SOURCE\n#include <stdio.h>\n#include <stdlib.h>\n\
    #include <bcm2835.h>\n#include <time.h>\n\n#define BILLION 1000000000\n\nint main(int\
    \ argc, char** argv) {\n    volatile int i;\n    clock gettime(CLOCK_REALTIME,\
    \ &btime);\n    for (i = 0; i < 1000000000; i++) {\n    }\n    clock gettime(CLOCK_REALTIME,\
    \ &btime);\n    double nsecs =\n        (double)(btime.tv_sec - btime.tv_sec)*BILLION+\n\
    \        (double)(btime.tv_nsec - btime.tv_nsec);\n    int n = (int) (10 * nsecs\
    \ / BILLION + 0.5);\n    printf(\"time = %f \\n\\r,nsec / BILLION:\\n\", nsecs\
    \ / BILLION);\n    printf(\"n = %d \\n\\r\\n\", n);\n    return (EXIT_SUCCESS);\n\
    ```\n\nIf you run this on a Pi Zero you will see that n is about 80, i.e. you\
    \ need busy wait loops to delay for 1us and on a Pi 4 n is around 130."
  merge: -1
  pgno: 56
- img_proc: true
  md: "You can also create a function that does the same job:\n\n```\nint busyWaitCalibrate()\
    \ {\n    struct timespec btime, etime;\n    volatile int i;\n    clock_gettime(CLOCK_REALTIME,\
    \ &btime);\n    for (i = 0; i < 100000000; i++) {});\n    clock_gettime(CLOCK_REALTIME,\
    \ &etime);\n    double seconds = (double)(etime.tv_sec - btime.tv_sec)\n     \
    \   * 1000000000L)+(double)(etime.tv_nsec - btime.tv_nsec);\n    return n;\n}\n\
    ```\n\nIf you are going to use busyWaitCalibrate, it is a good idea to take a\
    \ few samples and average them to make sure you get a sensible value for n.\n\n\
    # delayMicroseconds\n\nFor delays upward of 1µs you can avoid all of the problems\
    \ of calibrating your own busy wait by using delayMicroseconds.\n\nFor delays\
    \ of 1µs to 40µs this uses a busy wait with an automatic calibration. It simply\
    \ sits in a loop reading the system clock until the required number of microseconds\
    \ has gone by. For example, to create a 1us pulse:\n\n```\n#include <bcm2835.h>\n\
    #include <stdio.h>\n\nint main(int argc, char **argv) {\n    if (!bcm2835_init())\n\
    \        return 1;\n    bcm2835_gpio_fsel(RPI_BPLUS_GPIO_J8_07, BCM2835_GPIO_FSEL_OUTP);\n\
    \    for (;;) {\n        bcm2835_gpio_set(RPI_BPLUS_GPIO_J8_07);\n        bcm2835_delayMicroseconds(1);\n\
    \        bcm2835_gpio_clr(RPI_BPLUS_GPIO_J8_07);\n        bcm2835_delayMicroseconds(1);\n\
    \    }\n    bcm2835_close();\n    return 0;\n}\n```\n\nThis produces pulses that\
    \ are measured as 0.875µs to 1.25µs.\nAs you can see, the simple busy wait is\
    \ more accurate and more consistent than delayMicroseconds. However, as the delay\
    \ increases, the errors in delayMicroseconds become less important. In practice,\
    \ you can generally use delayMicroseconds unless you are generating pulses less\
    \ than 10µs and need the accuracy."
