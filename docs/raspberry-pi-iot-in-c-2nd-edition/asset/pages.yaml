- img_proc: true
  md: 'You often simply ignore the structure of the processor and allow the operating
    system to manage allocation of threads to cores. Threads are generally created
    with a natural CPU affinity. This means that the operating system will assign
    a thread to a core and then on attempt to run the thread on the same core. So,
    in most cases, you can let the operating system manage a machine''s cores, but
    sometimes you will want to intervene.


    The reasons why you would want to manually allocate threads to cores are usually
    specific to the application. For example, you might have a computation-bound thread
    and an I/O-bound thread. Clearly, scheduling these on the same single core with
    two processing units would allow the computational thread to make use of the core
    when waiting for the external world. Other reasons include placing a high priority
    thread into a core that no other thread was allowed to use so that it wasn''t
    interrupted, placing a thread into a core that has preferential access to particular
    hardware, and so on.


    Another consideration is warm versus cache. When a thread starts running on a
    core none of the data it needs in the cache and so it will run slowly. Slowly
    as it transfers the data and instructions it uses, the cache "warms up"; If the
    thread is switched out of the core and another thread takes it over, restoring
    the original thread means that it is still possible that the cache has the data
    that it requires – the cache is still warm.


    # Affinity


    The operating system tries to keep threads associated with particular cores, but
    sometimes you need to enforce this. If you can ensure that the machine is lightly
    loaded and there is spare computing power, then the operating system will do the
    right thing. If this isn''t the case you may need to specify the core program
    is going to use.


    There is no standard POSIX way of determining which core a thread will use, but
    there is a Linux extension of the Pthreads library that does the job. The setaffinity
    function:


    ```

    int pthread_setaffinity_np(pthread_t thread, size_t cpusize, const cpu_set_t *cpuset)

    ```


    sets the specified thread to run on one of set of possible CPUs as specified by
    the cpuset – affinity mask.


    The getaffinity function will return the affinity mask of the specified thread:


    ```

    int pthread_getaffinity_np(pthread_t thread, size_t cpusize, cpu_set_t *cpuset);

    ```'
  merge: -1
