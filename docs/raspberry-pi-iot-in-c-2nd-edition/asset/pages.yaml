  md: '| | |

    | 0x004C | GPRE0 GPIO Pin Rising Edge Detect Enable 0 |

    | 0x0050 | GPRE1 GPIO Pin Rising Edge Detect Enable 1 |

    | 0x0058 | GPFEN0 GPIO Pin Falling Edge Detect Enable 0 |

    | 0x005C | GPFEN1 GPIO Pin Falling Edge Detect Enable 1 |

    | 0x0064 | GPHEN0 GPIO Pin High Detect Enable 0 |

    | 0x0068 | GPHEN1 GPIO Pin High Detect Enable 1 |

    | 0x0070 | GPLEN0 GPIO Pin Low Detect Enable 0 |

    | 0x0074 | GPLEN1 GPIO Pin Low Detect Enable 1 |

    | 0x007C | GAREN0 GPIO Pin Async. Rising Edge Detect |

    | 0x0080 | GAREN1 GPIO Pin Async. Rising Edge Detect 1 |

    | 0x0088 | GPAFEN0 GPIO Pin Async. Falling Edge Detect 0 |

    | 0x008C | GPAFEN1 GPIO Pin Async. Falling Edge Detect 1 |

    | | |

    | 0x0094 | GPPUD GPIO Pin Pull-up/down Enable |

    | 0x0098 | GPPUDCLK0 GPIO Pin Pull-up/down Enable Clock |

    | 0x009C | GPPUDCLK1 GPIO Pin Pull-up/down Enable Clock |


    The only registers missing from this list are the PAD control registers and these
    are located in a different area of memory: BCM2835_GPIO_PAD5 = bcm2835_peripherals_base
    + BCM2835_GPIO_PAD5nand the offsets are:


    | | |

    | 0x002c | PADS0 (GPIO 0-27) |

    | 0x0030 | PADS1 (GPIO 28-45) |

    | 0x0034 | PADS2 (GPIO 46-53) |


    You can work out the address of any register listed in the documentation by finding
    the base address for the registers and adding its offset. It is worth knowing
    that you can use:

    sudo /proc/iomem

    to discover devices are in memory.'
