  md: 'The safest way to form the address of a clock register, GP0 control for

    example, is to use:


    ```

    bcm2835_clk+CLK_GP0_CTL

    ```


    as the bcm2835_clk is automatically adjusted to the start of the registers as

    mapped in memory. The control register has a simple layout:


    | 31-24 | PASSWD | Clock Manager password "5a" |

    | 10-9 | MASH | MASH control

    | | 0 = integer division

    | 1 = 1-stage MASH

    | 2 = 2-stage MASH

    | 3 = 3-stage MASH |


    | 8 | FLIP | Invert the clock generator output |

    | 7 | BUSY | Clock generator is running |

    | 6 | Unused |

    |5 | KILL |


    ```

    Kill the clock generator

    0 = no action 1 = stop

    ```


    | 4 | ENAB | Enable the clock generator |

    | 3-0 | SRC | Clock source |


    ```

    0 = GND

    1 = oscillator 19.2MHz (Pi Zero) 54MHz (Pi 4)

    2 = testdebug0 0MHz (Pi Zero & Pi 4)

    3 = testdebug1 0MHz

    4 = PLLA 0MHz (Pi Zero & Pi 4)

    5 = PLLC 1000MHz (Pi Zero) 600MHz (Pi 4)

    6 = PLLD 500MHz (Pi Zero) 750MHz (Pi 4)

    7 = HDMI aux 216MHz

    8-15 =

    ```


    Notice that these are default clock selects at the time of writing – they can
    be

    changed.


    The important points are that you use ENAB to start and stop the clock; you

    don''t make changes to the settings while the clock is running; and you don''t

    make changes while enabling the clock.


    The divider register has its format:


    | 31-24 | PASSWD | Clock Manager password "5a" |

    | 23-12 | DIVI | Integer part of divisor |

    | 11-0 | DIVF | Fractional part of divisor |


    and for the control register you do not change this while BUSY=1.


    The output frequency is given by:

    SOURCE/(DIVI + DIVF/4096)


    353'
