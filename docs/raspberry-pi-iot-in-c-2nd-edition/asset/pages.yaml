  md: 'In general, there can also be any number of SS (Slave Select), CE (Chip

    Enable) or CS (Chip Select) lines, which are usually set low to select which

    slave is being addressed. Notice that unlike other buses, I2C for example,

    there are no SPI commands or addresses, only bytes of data. However, slave

    dev interpret some of the data as commands to do something or send

    some particular data.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_289_0.png)


    There are two other modes of operation of the SPI interface – bidirectional

    and LoSSI mode. The bidirectional mode uses a single data line MIMO

    for both input and output. The direction of the line is determined by writing
    a

    command to the slave. LoSSI mode is used to communicate with

    sophisticated peripherals such as LCD panels. Both of these are unsupported

    b the bcm2835 library and beyond the scope of this chapter. However, once

    you know how standard mode works, the other two are some variations.


    # Pi SPI Interfaces


    The number of SPI buses a Pi depends on its model. The Pi Zero and

    Pi 3 have three SPI devices but only SP0 and SP1 are available on the GPIO

    connector:


    | SPI0 | | |

    | Function | Pin | | |

    | MOSI | 19 | GPIO10 |

    | MISO | 21 | GPIO09 |

    | SCLK | 23 | GPIO11 |

    | CE0 | 24 | GPIO08 |

    | CE1 | 26 | GPIO07 |'
