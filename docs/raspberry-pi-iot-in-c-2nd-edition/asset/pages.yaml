- img_proc: true
  md: 'The final odd thing about the SPI bus is that there are four modes which define
    the relationship between the data timing and the clock pulse. The clock can be
    either active high or low, which is referred to as clock polarity (CPOL) and data
    can be sampled on the rising or falling edge of the clock, which is clock phase
    (CPHA).


    All combinations of these two gives the four modes:


    | SPI Mode* | Clock Polarity CPOL | Clock Phase CPHA | Characteristics |

    |---|---|---|---|

    | 0 | 0 | 0 | Clock active high data output on falling edge and sampled on rising
    |

    | 1 | 0 | 1 | Clock active high data output on rising edge and sampled on falling
    |

    | 2 | 1 | 0 | Clock active low data output on falling edge and sampled on rising
    |

    | 3 | 1 | 1 | Clock active low data output on rising edge and sampled on falling
    |


    *The way that the SPI modes are labeled is common but not universal.


    There is often a problem trying to work out what mode a slave device uses. The
    clock polarity is usually easy and the Clock phase can sometimes be worked out
    from the data transferring diagrams and:


    +   * First clock transition in the middle of a data bit means CPHA=0

    * First clock transition at the start of a data bit means CPHA=1


    So to configure the SPI bus to work with a particular slave device:


    +   1. Select the clock frequency - anything from 125MHz to 3.8kHz

    2. Set the CS polarity - active high or low

    3. Set the clock mode Mode0 thru Mode3


    Now we have to find out how to do this using the bcm2835 library.'
  merge: -1
  pgno: 293
- img_proc: true
  md: '# The SPI Functions


    The SPI functions can be grouped into initialization, configuration and data transfer.
    Let''s look at each group in turn:


    +   * Initialization


    There are two functions concerned with enabling and disabling the SPIO bus:

    bcm2835_spi_begin ()

    bcm2835_spi_end ()


    Before you make use of the SPIO bus you have to initialize it using:

    bcm2835_spi_begin ()


    This returns 1 if successful and 0 otherwise. After this the pins allocated to
    the SPIO bus no longer works as general purpose GPIO pins. If this function fails
    the most likely reason is that you are not running the program as root.


    When you are finished using the SPI you can return the pins to general GPIO lines
    by calling:

    bcm2835_spi_end ()


    +   * Configuration


    There are a number of functions that you can use to configure the way the bus
    works:

    bcm2835_spi setClockDivider(uint16_t divider)

    bcm2835_spi setBitOrder(uint8_t order)

    bcm2835_spi setData(uint8_t mode)

    bcm2835_spi chipSelect(uint8_t cs)

    bcm2835_spi chipSelectPolar(uint8_t cs uint8_t active)


    clockDivider sets the speed of data transfer as a fraction of the Pi''s clock
    speed. The documentation indicates that only powers of two can be used for the
    divider and provides a predefined enumeration:

    BCM2835_SPI_CLOCK_DIVIDER_power2


    In fact, you can use any value for the clock divider.

    The clock speed on a Pi Zero is given, in mega Hertz,

    clock speed=250/divider


    As the SPI clock is the clock divider down, if the Pi 4 enters an idle or throttled
    state the SPI speed will be lower. To guarantee the selected speed you have to
    fix the core clock rate as discussed in Chapter 4 and use 500MHz for the Pi 3
    and 4. You have to regard the clock divider function as a request for a maximum
    SPI clock rate.'
  merge: -1
  pgno: 294
- img_proc: true
  md: 'You can ignore the setBitOrder function because the Pi''s SPI bus doesn''t
    support it.

    setDataMode can be used to set the data transfer to one of:


    | BCM2835_SPI_MODE0 | CPOL = 0 CPHA = 0 |

    | BCM2835_SPI_MODE1 | CPOL = 0 CPHA = 1 |

    | BCM2835_SPI_MODE2 | CPOL = 1 CPHA = 0 |

    | BCM2835_SPI_MODE3 | CPOL = 1 CPHA = 1 |


    chipSelect sets which chip select line will be involved in all data transfer operations
    until it is changed. You can set any of:


    | BCM2835_SPI_CS0 | Chip Select 0 |

    | BCM2835_SPI_CS1 | Chip Select 1 |

    | BCM2835_SPI_CS2 | Chip Select 2 (i.e. pins CS1 and CS2 are asserted) |

    | BCM2835_SPI_CS0_NONE | No CS, control it yourself |


    Finally, chipSelectPolarity can be used to set either of the chip select lines
    to active high or active low.

    in general you should configure the operation of the SPI bus completely, the defaults
    are:


    To make sure that you get the configuration you want, you get in the habit of
    including:

    bcm2835_spi_setBitOrder(BCM2835 SPI BIT ORDER_MSBFIRST);

    bcm2835_spi_setDataMode(BCM2835 SPI MODE0);

    bcm2835_spi_setClockDivider(BCM2835 SPI CLOCK_DIVIDER 65536);

    bcm2835_spi_chipSelect(BCM2835 SPI (CS0));

    bcm2835_spi_setChipSelectPolarity(BCM2835_SPI_CS0, LOW);


    This sets the defaults, but you can modify the settings as you need.'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# Data Transfer functions


    Because of the way the SPI bus uses a full-duplex transfer, things are a little
    different from other buses when it comes to implementing functions to transfer
    data:

    bcm2835 spi transfer (uint8_t value, uint32_t len)

    bcm2835 spi writenb (char *buf, uint32_t len)

    bcm2835 spi transfern (char *buf, uint32_t len)

    bcm2835 spi transfernb (char *tbuf, char *rbuf, uint32_t len)


    If you recall that the data transfer sends a byte of data out of the register
    while shifting in a byte of data, the transfer functions will make sense.


    The most basic of this set is transfer, which sends a single byte to the slave
    while receiving a single byte back. Unlike the underlying protocol, it does not
    overwrite the original value with the slave''s data. So, for example, to send
    and receive data you would use like:


    ```

    uint8_t SendData=0x55;

    uint8_t ReadData;

    Read_data = bcm2835_spi_transfer(SendData);

    ```


    Of course, you can simply throw away the data from the slave, or send meaningless
    data to the slave, to create something that like a read/write pair.


    The remaining functions send multiple bytes of data stored in a buffer. They differ
    in how they treat the data returned by the slave - writenb ignores it, stores
    in a new buffer, and transfer overwrites the send buffer with it. Let''s look
    at each one in:


    If you just want to write data to the slave and ignore what it sends back then
    you need to use the writenb function. This takes a char buffer and a length specification
    and transfers each byte in, throwing away any data that sends slave back. For
    example:


    ```

    char buf[] = {''A'', ''B'', ''C''};

    bcm2835_spi_writenb(buf, 3);

    ```


    will send three bytes, containing the ASCII codes for A B and C, to the slave,
    ignoring any data sent back. Notice that you need to get the size of the buffer
    correct in the function call to avoid buffer overflow.


    The transfer function will send the number of bytes you specify and return the
    slaves data in the same buffer. For example:


    ```

    char buf[] = {''A'', ''B'', ''C''};

    bcm2835_spi_transfer(buf, 3);

    ```


    sends the ASCII codes for A, B, but overwrites each element of the array with
    whatever the slave transferred, i.e. buf no longer contains A B C.'
  merge: -1
  pgno: 296
- img_proc: true
  md: "Finally the transfer function uses two buffers, one for the data to send and\
    \ one for the received data. For example:\n\n```\nchar buf[] = {'A' 'B' 'C'};\n\
    char readBuf[3];\nbcm2835_spi_transfer(buf readBuf, 3);\n```\n\nsends A B C to\
    \ store and sends the three bytes sent back into readBuf.\nUsing these functions\
    \ you should be able to deal with most SPI slaves.\nNow we come to a subtle point.\
    \ What is the difference between transferring multiple bytes using transfer, transfer\
    \ or write or simply sending the bytes individually using multiple transfer calls?\
    \ The answer is that each time you make a transfer the chip select line is activated,\
    \ the data is transferred and then it is deactivated. Using the buffers, the chip\
    \ select is active for the entire transfer, i.e. it isn't deactivated between\
    \ each byte. Sometimes this difference isn't important and you can transfer three\
    \ bytes using three calls to transfer or one call to transfer. However, some slaves\
    \ will abort the multibyte operation if the chip select is deactivated in the\
    \ middle of a multibyte transfer.\n\nIt is important to realize that the nature\
    \ of the transfer is that the first byte is sent at the same time that the first\
    \ byte is received. That is, unlike other protocols, the whole of the buffer isn't\
    \ sent before the data comes back. The whole transfer works a byte at a time –\
    \ the first byte is sent while the first byte is being received, then the second\
    \ byte is sent at the same time as the second byte is being received and so on.\
    \ Not fully understanding this can lead to some interesting bugs.\n\n# A Loopback\
    \ Example\n\nBecause of the way that data is transferred on the SPI bus, it is\
    \ very easy to test that everything is working without having to add any components.\
    \ All you have to do is connect MOSI to MISO so that anything you sent also received\
    \ in a loopback mode.\n\nFirst connect pin19 to pin 20 using a jumper and start\
    \ a new NetBeans project. The program is very simple. First we initialize the\
    \ library and the SPI bus:\n\n```\nif (!bcm2835_init()) {\n  return 1;\n}\nif\
    \ (!bcm2835_spi_begin()) {\n  return 1;\n}\n```\n\nIf either call fails the chances\
    \ are you aren't running as root, as explained in Chapter 2."
  merge: -1
  pgno: 297
- img_proc: true
  md: "As this is a loopback test we really don't need to configure the bus, but we'll\n\
    do it for completeness:\n\n```\nbcm2835_spi_setBitOrder(BCM2835 SPI_BIT_ORDER_MSBFIRST);\n\
    bcm2835_spi_setDataMode(BCM2835 SPI MODE0);\nbcm2835_spi_setClockDivider(BCM2835\
    \ SPI CLOCK_DIVIDER_65536);\nbcm2835_spi_setChipSelect(BCM2835 SPI CS0);\nbcm2835_spi_setChipSelectPolarity(BCM2835\
    \ SPI CS0, LOW);\n```\n\nNext we can send some data and receive it:\nuint8_t read_data\
    \ = bcm2835_spi_transfer(0xAA);\nThe hex value AA is useful in testing because\
    \ it generates the bit sequence\n10101010 which easy to see on a logic analyzer.\n\
    \nCheck that the received data matches the sent data:\nif (read_data==0xAA) printf(\"\
    data received correctly\");\n\nFinally we close the bus and the library:\n\n```\n\
    bcm2835_spi_end();\nbcm2835_close();\nreturn (EXIT_SUCCESS);\n```\n\nPutting all\
    \ of this together gives us the complete program:\n\n```\n#include <bcm2835.h>\n\
    #include <stdio.h>\n#include <stdlib.h>\n```\n\n```\nint main(int argc, char **argv)\
    \ {\n    if (!bcm2835_init()) {\n        return 1;\n    }\n    if (!bcm2835_spi_begin())\
    \ {\n        return 1;\n    }\n```\n\n```\nbcm2835_spi_setBitOrder(BCM2835 SPI_BIT_ORDER_MSBFIRST);\n\
    bcm2835_spi_setDataMode(BCM2835 SPI MODE0);\nbcm2835_spi_setClockDivider(BCM2835\
    \ SPI CLOCK_DIVIDER_65536);\nbcm2835_spi_setChipSelect(BCM2835 SPI CS0);\nbcm2835_spi_setChipSelectPolarity(BCM2835\
    \ SPI CS0, LOW);\nuint8_t read_data = bcm2835_spi_transfer(0xAA);\n    if (read_data\
    \ == 0xAA) {\n        printf(\"data received correctly\");\n    } else {\n   \
    \     printf(\"data error\");\n    }\n```\n\n```\n;nbcm2835_spi_end();\nbcm2835_close();\n\
    return (EXIT_SUCCESS);\n}\n```"
  merge: -1
