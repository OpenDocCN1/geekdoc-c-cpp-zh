- img_proc: true
  md: 'If you run the program and don''t get the data received correctly message then
    the most likely reason is that you have connected the wrong two pins or not connected
    them at all.


    If you connect a logic analyzer to the four pins involved – 19, 21, 23 and 24
    you will see the data transfer:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_299_0.png)


    If you look carefully you will see the CS0 line go low before the master places
    the first data bit on the MOSI and hence on the MISO lines. The documentation
    states that the CS line is held for at least three clock cycles before transfer
    starts and held for at least one clock cycle when the transfer is complete. Notice
    that the rises a mode0 transfer. You can also see that the clock is measured to
    be 7.6kHz on a Pi 4, as promised.


    # # Problems


    The SPI bus is often a real headache of a difficult standard, but in most cases
    you can make it work. The first problem is in discovering the characteristics
    of the slave device you want to work with. In general, this is solved by a careful
    reading of the datasheet or perhaps some trial and error, see the next chapter
    for an example.'
  merge: -1
  pgno: 299
- img_proc: true
  md: 'If you are working with a single slave then generally things work once you
    have the SPI bus configuration correctly. Things are more difficult when there
    are multiple devices on the same bus. The Pi can only directly support two devices,
    but this is enough to make the task more difficult. Typically you will find SPI
    devices that don''t switch off properly when they are not being addressed. In
    principle, all SPI devices should present high impedance outputs (i.e. trist buffers)
    when not being addressed but some. If you encounter a problem you need to check
    that the selected slave is able to control the MISO line properly.


    Another problem, which is particularly bad for the Pi, is noise. If you are using
    a USB, or some other power supply that isn''t able to supply sufficient instantaneous
    draw to the Pi, you will see noise on any or all of the data lines - the CS0/1
    lines seem to be particularly sensitive. The solution is to get a better power
    supply.


    If you really need more than two SPI devices, you might be tempted to look at
    the possibility of using the other SPI buses. This sounds good in theory, but
    in practice it seems bit difficult. The documentation advises not to use the SPI
    bus used for EEPROM I/O in HAT boards.


    A better solution is to multiplex the CS0/1 lines to create additional chip selects.
    For example, you can use standard GPIO lines as chip selects and connect more
    than two SPI slaves. All you have to do is set


    ```

    bcm2835_spi_setChipSelectPolarity to BCM2835_SPI_CS_NONE just before you send
    data, then the GPIO line you are using as a chip select for three clock periods
    and perform the data transfer.

    ```'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# Summary


    +   - The SPI bus is often problematic because there is no SPI standard.


    +   - Unlike other serial buses, it makes use of unidirectional connections.


    +   - The data lines are MOSI (master output slave input) and MISO

    (master input slave output).


    +   - In addition, there is a clock line, output from master, and a number of

    select lines, two in the case of the Pi.


    +   - Data is transferred from the master to the slave and from the slave to

    the on each clock pulse, arranged as a circular buffer.


    +   - The Pi Zero and Pi 3 have three SPI devices, but only SP0 and SP1

    are available on the GPIO connector. The Pi 4 has an additional four,

    full SPI interfaces.


    +   - The bcm2835 library provides all the functions you need to set up the

    SPI bus and transfer data one or multiple bytes at a time, but

    only for SPI0 and SPI1. You can easily extend it to use others.


    +   - You can test the SPI bus using a simple loopback connection.


    +   - Working with a single slave is usually fairly easy, working with

    multiple slaves can be more of a problem.'
  merge: -1
  pgno: 301
- img_proc: true
  md: '# # Chapter 18

    # A to D With The SPI Bus


    The SPI bus can be difficult to make work at first, but once you know what to
    look for about how slave claims to work it gets easier. To demonstrate how its
    done, let''s add eight channels of 12-bit AtoD using the MCP3008.


    The Raspberry Pi doesn''t have any analog inputs or outputs. You can use expansion
    boards, HATS, that add multiple interfaces including analog I/O, but sometimes
    you just don''t need many new features. The MCP3000 family of AtoD converters
    provides a simple, clean and low-cost alternative to fitting an expansion board.
    Although the MCP3008, with eight AtoD inputs at 10-bit precision, and the MCP3004,
    with four AtoD inputs at 10-bit precision, are the best known, there are other
    devices in the family, including ones with 12-bit and 13-bit precision and differential
    inputs, at around the same sort of cost $1 to $2.


    In this chapter the MCP3008 is used because it is readily available and provides
    a good performance at low cost, but the other devices in the family work in the
    same way and could be easily substituted.


    # ## MCP3008


    The MCP3008 is available in a number of different packages which is the easiest
    to work with using a prototyping board. You can buy it from the usual sources
    including Amazon. Its pinouts are self-explanatory:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_302_0.png)


    You can see that the analog inputs are on the left and the power and SPI connections
    are on the right. The conversion accuracy is claimed to be 10 bits, but how many
    of these bits correspond to reality and how many are noise depends on how you
    design the layout of the circuit.'
  merge: -1
  pgno: 302
- img_proc: true
  md: 'You need to take great care if you need high accuracy. For example, you will
    notice that there are two voltage inputs VDD and VREF. VDD is the supply voltage
    that runs the chip and VREF is the reference voltage that is used to compare the
    input voltage. Obviously, if you want highest accuracy, VREF which has to be lower
    than equal to VDD, should be set by an accurate low-noise voltage source. However,
    in most applications VREF and VDD are simply connected together and the usual,
    low- quality, supply voltage is used as the reference. It is not good enough then
    you can use anything from a Zener diode to a precision voltage reference chip
    such as the TL431. For the very least, you should add a 1µF capacitor to ground
    connected to the VDD pin and the VREF pin.


    The MC3000 is a type of AtD called a successive approximation converter. You don''t
    need to know how to use it, but it is not difficult to understand. The idea is
    that a first voltage equal to VREF/2 is generated and the input voltage is compared
    to this. If it is greater than equal then the most significant bit is a 0 and
    if it is 1. At the next step the voltage generated is VREF/2 + VREF/4 and the
    comparison is repeated to generate the next bit.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_303_0.png)


    You can see that successive approximation fits in well with a serial bus as each
    bit can be obtained in the time to transmit the previous bit. However, the conversion
    is relatively slow and a sample-and-hold circuit has to be used to keep the input
    to the converter stage fixed. The sample-and-hold takes the form of a 20pF capacitor
    and a switch. The only reason you need to know about this is that the conversion
    has to be completed in a time that is short compared to the discharge time of
    the capacitor. So, for accuracy, there is a minimum SPI clock rate as well as
    a maximum.


    Also, to charge the capacitor quickly enough for it to follow a changing voltage,
    it needs to be connected to a low-impedance source. In most cases this isn''t
    a problem, but if it is you need to include an op amp.


    # 304'
  merge: -1
  pgno: 303
- img_proc: true
  md: 'If you are using an op buffer then you might as well implement an aliasing
    filter to remove frequencies from the signal that are too fast for the AtoD to
    respond to. How all this works takes us into the realm of analog electronics and
    signal processing and well beyond the core subject matter of this book.


    You can also use the AtoD channels in pairs, i.e. in differential mode, to measure
    the voltage difference between them. For example, in differential mode you measure
    the difference between CH0 and CH1, i.e. what you measure is CH1-CH0. In most
    cases you want to use all eight channels in single-ended mode. In principle, you
    can take 200k samples per second, but only at the upper limit of the supply voltage,
    i.e. VDD=5V, falling to 75k samples per second at its lower limit of VDD=2.7V.


    The SPI clock limits are a maximum of 3.6MHz at 5V and 1.35MHz at 2.7V. The clock
    can go slower, but because of the problem with the sample-and-held mention earlier,
    it shouldn''t go below 10kHz. How fast we can take samples is discussed later
    in this chapter.


    # Connecting To The Pi


    The connection from the MCP3008 to the Pi''s SPI bus is very simple and can be
    seen in the diagram below.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_304_0.png)


    The only additional component that is recommended is a 1UF capacitor connected
    between pins 15 and 16, which is mounted as close to the chip as possible. As
    discussed in the previous section you might want a separate voltage reference
    for pin 15 rather than just using the 3.3V supply.


    # Basic Configuration


    Now we come to the configuration of the SPI bus. We have some rough figures for
    the SPI clock speed of around 10kHz to a little more than 1.35MHz. So an initial
    clock divider of 4096 on a Pi Zero or 8192 on a Pi 3/4 giving a frequency of 61kHz
    seems a reasonable starting point.'
  merge: -1
  pgno: 304
- img_proc: true
  md: 'From the datasheet, the chip select has be active low, by default is sent most
    significant bit first for both the master and the slave. The only puzzle is what
    mode to use? This is listed in the datasheet as mode 0 0 with clock active high
    or mode 1 1 with clock active low. For simplicity we use mode 0 0, which is mocked
    in the bcm2835 library.


    We now have enough information to initialize the slave:


    ```

    bcm2835_spi_setDataMode(BCM2835_SPI_MODE0)

    bcm2835_spi_setClockBider(BCM2835_SPI_CLOCK_DIVIDER_8192)

    bcm2835_spi_chipSelect(BCM2835_SPI_CS0)

    bcm2835_spi_setChipSelectPolarity(BCM2835_SPI_CS0, LOW)

    bcm2835_spi_setBitOrder(BCM2835_SPI_BIT_ORDER_MSBFIRST);

    ```


    # # The Protocol


    Now we have the SPI initialized and ready to transfer data, but what do we transfer?
    The SPI bus doesn''t have any standard commands or addressing structure. Each
    device responds to data sent in different ways and sends data back in different
    ways. You simply have to read the datasheet to find out what the commands and
    responses are.


    Reading the datasheet might be confusing because it says what you have to do is
    send five bits to the slave - a start bit, a bit that selects its operating mode
    single or differential, and a 3-bit channel number. The operating mode is 1 for
    single-ended and 0 for differential.


    So read Channel 3, i.e. 011, in single-ended mode you would send the slave:


    ```

    10111xxx

    ```


    where an x can take either value. The response from the slave is that it holds
    its output in a high impedance state until the sixth clock pulse, then sends a
    zero bit on the seventh followed by bit 9 of the data on the eighth clock pulse.
    That is, the slave sends:


    ```

    xxxxx0b9

    ```


    where x means indeterminate. The remaining nine bits are sent back in response
    to the next clock pulse. This means you have to transfer three bytes to get all
    bits of data. All makes reading the data in 8-bit chunks confusing.


    The datasheet suggests a different way of doing the job that delivers the data
    more neatly packed into three bytes. What it suggests to send a single byte is:


    ```

    00000001

    ```'
  merge: -1
  pgno: 305
- img_proc: true
  md: 'At the time, the slave transfers random data, which is ignored. Final 1 is
    treated as the start bit. If you transfer a second byte with most significant
    bits indicating single bits or differential mode, then a 3-bit channel address
    and the remaining bits set to 0, the slave will respond with the null and the
    top two bits of the conversion. Now you all have to get the final eight bits of
    data is to read a third bit:


    | MCU Transmitted Data | | | | | | | | | | | | | |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|n| (Aligned with falling
    edge of clock) | Start Bit | 0 | 0 | 0 | 0 | 0 | 0 | 0 | D2 | D1 | D0 | X | X
    | X | X |

    | MCU Received Data (Aligned with rising edge of clock) | ? | ? | ? | ? | ? |
    ? | ? | (NACK) | ACK | B7 | B6 | B5 | B4 | B3 | B1 | B0 |


    Data stored in MCU register after transmission of 8 bits


    Data stored in MCU register after transmission of 8 bits


    Data stored in MCU register after transmission of 8 bits


    X - "Don''t Care" Bits


    This way get next bytes contain the data with all the low-order bits in their
    correct positions.


    Using this information we can now write some instructions that read the start
    bit and ignore the byte slave transfers. For example, read Channel 0 we send a
    first byte to 0x61 to select single-ended and Channel 0 and keep the byte slave
    sends back as the two high-order bits. Finally, we send a zero byte (0x00) so
    that we get the low-order bits from the slave i.e.


    ```

    char buf[] = {0x61, 0x80, 0x00};

    char readbuf[3];

    bcm2835_spi_transfernb(buf, readbuf, 3);

    ```


    Notice you cannot send the three bytes one at a time using transfer because results
    in the CS line being deactivated from the transfer of each byte.

    To get out of readbuf we need to do some bit manipulation:

    int data = ((int)readbuf[1] & 0x03) << 8 | (int)readbuf[2];


    The first part of the expression extracts the low three bits from the first byte
    the slave sent, and as these are the most significant bits, they are shifted eight
    places. The rest of the bits are ORed with to give the full 10-bit result. To
    convert to volts:

    float volts = (float)data * 3.3f / 1023.0;


    assuming that VREF is 3.3V.


    In a application you would also need to convert the voltage to some other quantity,
    like temperature or light level.'
  merge: -1
  pgno: 306
- img_proc: true
  md: "If you connect a logic analyzer to the SPI bus you will see something like:\n\
    \n![](img/175b89abfcdc9824337e5b1ac4bb1ef3_307_0.png)\n\nYou can see the commands\
    \ and the response, in this case a reading of 3.3V.\n\nThe complete program is:\n\
    #include <bcm2835.h>\n#include <stdio.h>\n#include <stdlib.h>\n\n```\nint main(int\
    \ argc, char **argv) {\n    if (!bcm2835_init()) {\n        return 1;\n    }\n\
