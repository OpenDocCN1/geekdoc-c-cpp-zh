- img_proc: true
  md: '# Summary


    +   - All of the peripherals, including the GPIO lines, are controlled by registers
    – special memory locations that you write and read to configure and use the hardware.


    +   - Exactly where the registers are positioned in address space varies according
    to the model of Pi, but once you have found the start the offsets from this address
    to any given register are the same.


    +   - Access to memory is via the /dev/mem file which needs root status to access.
    You can use /dev/gpiom instead without root access but it only gives you the GPIO
    registers.


    +   - Once you have opened mem or gpiom you use the mmap function to map the memory
    area into your programs user space. From this point you can access the memory
    area using pointers in the usual way.


    +   - Using direct access to GPIO registers you can generate pulses as small as
    20ns on a Pi Zero, but due to its multicore nature, access to the Pi 4''s memory
    has to be synchronized using memory barriers and it can only produce 80ns pulses.


    +   - The bcm2835 library provides some general-purpose functions for accessing
    registers which are easier to use than direct access and are hardly any slower.


    +   - You can use low-level access to registers to do things that aren’t standard.
    For example, you can access the GPIO clock facility to generate signals over 100MHz,
    i.e. radio frequencies.


    +   - You can also use low-level access to registers to extend the bcm2835 library,
    for example giving access to the Pi 4''s new SPI interfaces interfaces.'
  merge: -1
