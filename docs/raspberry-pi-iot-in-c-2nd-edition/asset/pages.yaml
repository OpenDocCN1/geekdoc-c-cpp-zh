  md: "This can be measured down to around 1 microsecond with an accuracy of 0.5µs:\n\
    \n| Pulse width µs | System time µs |\n|--- |--- |\n| 1 | 0-1 |\n| 2 | 2 |\n|\
    \ 5 | 4-5 |\n| 10 | 9-10 |\n| 25 | 24-25 |\n| 50 | 49-50 |\n\nNotice in either\
    \ case if you try measuring pulse widths much shorter than the limit that works,\
    \ you will get results that look like longer pulses are being applied. The reason\
    \ is simply that the Pi will miss the first transition to zero but will detect\
    \ a third or longer transition. This is the digital equivalent of the aliasing\
    \ effect found in the Fourier Transform or general signal processing.\n\nFinally,\
    \ we can change the program to detect rising edges and see how many inputs we\
    \ can deal with by toggling a GPIO output line at the end of each measurement:\n\
