  md: '# # Chapter 1

    Why Pi For IoT?


    The Raspberry Pi has changed the computing world in more ways than one. It isn''t
    a particularly powerful device, but it is so low cost that it introduced an era
    of almost disposable computing. This isn''t quite true. Even the lowest cost Pi,
    the Pi Zero, actually costs more than its $5 raw cost to get into a usable state,
    it really lowers the financial barrier to using advanced computing devices to
    all sorts of creative and useful things.


    In this short chapter we will take a look at the range of devices that are available
    and usually rather than another to do particular jobs. The term IoT - Internet
    of Things - has become very popular and tends to be used in place of older terms
    as embedded processing, microcontrollers and newer terms as physical computing.
    The ideas, however, are related and in the rest of this book the term IoT will
    be used to mean a system being used to interface with the real world, usually
    via custom electronics, even if the Internet isn''t explicitly invoked.


    As this book is about using the Pi to connect to the outside world, it is the
    Pi as a microcontroller or embedded IoT device that interests us the most.


    # ## Pi Versus The Microcontroller


    Compared to the Pi, the Arduino and any similar microcontroller is a very low-power
    computer. The basic Arduino isn''t capable of running Linux, which is a full operating
    system. It simply runs the program you have written for it. However, the Arduino
    and similar devices have a big advantage – they have dedicated I/O lines and usually
    analog I/O. The Pi doesn''t have the same variety of I/O lines, but it has enough
    for many jobs and it can be easily expanded with the use of standard expansion
    boards called HATs (Hardware Attached on Top) because of the way they plug in.


    To make the difference plain, you can use a Pi for almost any job that a desktop
    computer can do, including any server role. An Arduino, on the other hand, isn''t
    up to this of work. Sometimes the fact that the Pi is a full computer makes it
    even more suitable for low-level jobs. For example, you want a new door bell?
    Why not use a Pi and have it say hello using a voice synthesizer.


    In short, the Pi gives you more computing power for less money.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'Everything isn’t perfect with the Pi and the IoT. In particular, the use of
    Linux means that you can no longer pretend your program is the only program running.
    Linux is a multitasking operating system and it can suspend any program at any
    time to give another program a chance to run. If you are a familiar with microcontroller
    programming then it will come as something of a shock that you do not have complete
    control of the machine. What is more, Linux isn’t the easiest operating system
    to get grips with if you are a beginner.


    All of these problems and more can be overcome with a little work and it is worthwhile.
    The Pi is a fast and capable IoT computer and would still be a good choice if
    it cost a lot more. We are entering a new era of embedded computing when the device
    that runs your washing machine is as powerful as your desktop computer.


    # Which Pi?


    As far as the IoT goes, you can use an early Pi 1 or Pi 2 model A or B to do any
    of the tasks described in this book, it is much better not to. These early models
    have now been discontinued and the modern range of devices is so much better suited
    to the task because they are more powerful.


    The smallest and cheapest at $5 is the Pi Zero which has a single core and is
    about half as fast as a Pi 3 and ten times slower than the Pi 4. Even though it
    isn’t as fast as a Pi 3 is often sufficient for IoT tasks and wins on power use.
    The Pi Zero only has a single USB connector and no networking.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_13_0.png)


    Pi Zero and Zero W – small and low cost'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'The Pi Zero W has onboard WiFi but is twice as expensive, still only $10. If
    you want a small unconnected IoT device then the Pi Zero is worth considering.
    If you want a connected device then the Pi Zero W is the better choice. The big
    difference between the Pi Zero and the Pi 3 or Pi 4 is that it has only one core,
    which means your program will be interrupted by the operating system to keep the
    device working. In many applications this doesn''t matter. If it does then you
    need one of the main Pi models.


    Moving from the models capable of the most basic of tasks, currently the top of
    the range Raspberry Pis are the 4B and the 3A+. Unlike the Pi 4, the main Pi models
    have been available as an A or B sub-type. The A lacks multiple USB connectors
    and a wired network connection and so is cheaper. At the moment the Pi 4 only
    comes in a B version and so means that the 3A+, costing $25, still has a role.
    The 3A+ (and the 3B+) is also still available, costing $35) has a 64-bit quad
    core processor and built-in WiFi and Bluetooth.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_14_0.png)


    The Pi 3 A and B


    The Pi 4B is the latest and probably the last of the current line of Raspberry
    Pi hardware. It is a 64-bit quad core process running at 1.5GHz. The entrylevel
    model, which still costs $35, has 2GB of memory, but you can opt for 4GB or 8GB.
    It also has USB 3 and two HDMI ports which support dual monitors. This makes the
    Pi 4 capable of being used as a desktop replacement, as far as IoT goes this is
    overkill for most projects. However, as is the same price as the slower and less
    capable Pi 3B+ you might well use it. Its only disadvantage is that it uses more
    power than the 3B+ and tends to run hot without cooling.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '![](img/175b89abfcdc9824337e5b1ac4bb1ef3_15_0.png)


    # The Pi 4 B


    There is also the Pi 3 Compute module. Intended for commercial/industrial use,
    this a Pi 3 but with no external connectors. Instead all of the I/O is via an
    edge connector. The Compute module works in the same way as the Pi 3 and you can
    use a standard Pi 3 to develop software for it. Its downside is that it needs
    a development kit or some custom connections to use it.


    In this book the target devices are the Pi Zero, the Pi 3A and the Pi 4B but all
    of the Raspberry Pis are highly compatible with some very minor variations.


    # No HATS Needed


    The basic Pi can be easily expanded with the addition of a HAT, standing for “Hardware
    Attached on Top”, plugin board or an earlier non-HAT expansion board. Some of
    these expansion boards are so commonly used that they are considered more or less
    standard. In this book HATs and expansion boards of any kind are not used. The
    reason is simply that the focus is on the Pi as it comes. There is also a tendency
    to use an expansion board when in fact all that is needed is a few cents worth
    of additional electronics, or better still just some clever software. HATs often
    make the task easier, they rarely make it expensive.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_15_1.png)


    The popular Sense HAT adds a range of sensors and an LED display'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# What To Expect


    There are no complete projects in this book – although some examples come very
    close and it is clear that some of them could be used together to create finished
    projects. The reason for this is that the focus is on learning how things work
    so that you can move on and do things that are non-standard.


    What matters is that you can reason about what the processor is doing and how
    it interacts with the real world in real time. This is the big difference between
    desktop and embedded programming. In the desktop world you don''t really care
    much when something happens, but when you are programming a physical system you
    care very much.


    This is a book about understanding general principles and making things work at
    the lowest possible level. This knowledge isn''t always necessary when you are
    working on a relatively slow system in, say, Python, but it is always helpful
    for understanding what is going on when things go wrong. When you are working
    directly with the hardware, speed matters and so does knowing what is happening.


    # User Mode – No Drivers


    In most of books on using the Pi you will find a lot depends on using Linux drivers
    to access the hardware. Indeed, if you are using a language as Python, you have
    no choice but to install suitable drivers as the language isn''t fast enough to
    work in any other way. However, if you have to install a driver, or otherwise
    configure the operating system, to make your program then you have the problem
    of making sure that any other system it runs is set up in the same way.


    There is also the problem of what happens when the OS is updated. When Raspberry,
    now referred to as Pi OS, was updated to make use of systemd its init system,
    many programs that made use of the hardware stopped working until the system was
    reconfigured. Changes in Python, or other high-level language, implementations
    also cause the same sort of problems, causing programs and libraries that did
    work to stopping. This is often referred to as "bit-rot".


    For this and many other reasons, the programs developed in this book are based
    on user-mode access to the hardware and hence don''t use drivers. The only exception
    is the serial port in Chapter 18 where the Linux serial port driver is so standard
    and unchanging that not to use it would be to do extra for no reason.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'As a result all of the programs in this book are fairly self-contained and
    once compiled they should just run on any Linux system with minimal additional
    configuration.


    Put simply, the approach used in this book is to write Zero or a difference Pi
    set up with low-level C programs that run under Linux but make use of the operating
    system to access the hardware and require minimal configuration to make them work.
    This approach makes installation easy and isolates the program from changes in
    the OS. In short, code everything in C and minimize bit-rot.


    If you want to approach IoT via Linux drivers or if you want to mix your approach
    see: Raspberry Pi IOT in C With Linux Drivers, ISBN: 9781871962642


    # What Do You Need?


    If you are going to follow the examples you will need either a Pi Zero or Pi 3
    or a Pi 4. You can use an earlier Pi as long as you make allowances for the difference
    in pin assignments and other minor hardware changes.


    You need to have a Pi OS, formerly called Raspbian, and you need to know how to
    connect to it and use it via a serial console. You also need to be comfortable
    with Linux in the sense that you might not know how to do something, you do know
    how to look it up and follow the instructions.


    It is also assumed that you are able to program in a C-like language - Java, C#,
    Python are all similar to C and, of course, so is C++. . There isn''t space in
    this book to teach C programming, but the programs are easy enough to follow and
    any out of the ordinary coding is explained. If you want to learn in detail, see
    Fundamental C, ISBN: 9781871962604.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_17_0.png)


    A solderless prototype board and some Dupont wires


    To additional hardware over and above the Pi, you will need a solderless prototype
    board and some hookup wires – known as Dupont wires. You will also need some LEDs,
    a selection of resistors, some 2N2222 or other general purpose transistors and
    any of the sensors used in later chapters. It is probably better to buy what you
    need as you choose to implement one of the'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'projects but an alternative is to buy one of the many "getting started" kits
    for the Raspberry Pi. You will probably still need to buy some extra components,
    however.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_18_0.png)


    # A Low Cost Logic Analyzer


    You don''t need to know how to solder, but you will need to be able to hook up
    a circuit on a prototyping board. A multimeter (less than $10) is useful, but
    you are serious about building IoT devices, investing in a logic analyzer (less
    than $100) will repay itself in no time at all. You can get small analyzers that
    plug in via a USB port and use an application to show you what is happening. It
    is only with a multichannel logic analyzer can you have any hope of understanding
    what is happening. Without one and the slight skill involved in using it, you
    are essentially flying blind and left to guess what might be wrong.


    Finally, if you are even serious then then pocket oscilloscope is also worth investing
    in to check out the analog nature of the supposedly digital signals that microcontrollers
    put out. However, if you have to choose between two instruments, the logic analyzer
    should be your first acquisition.


    It is worth noting that the Pi can generate signals that are too fast to be detected
    by low cost oscilloscopes and logic analyzers which work at 1MHz and 25MHz. This
    can mean that working with pulses faster than 1µs can be difficult as you cannot
    rely on your instruments. There are reasonably priced 200MHz and 500MHz logic
    analyzers and one of these is certainly worthwhile if you are serious about hardware.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Safety In Numbers


    There is one final point to make about the Raspberry Pi and its ecosystem – there
    is safety in numbers. At the time of writing, the Pi has sold more than 30 million
    units, and while these aren''t exactly the same device, they are all compatible
    enough to ensure that your programs have a good chance of running on any of them.


    The large number of Pis in the world means that you have a good chance of finding
    the answer to any problem by a simple internet search, although it has to be said
    that the quality of answers varies from misleading to excellent. Always make sure
    you evaluate what you are being advised in the light of what you know. You also
    need to keep in mind that the advice is also usually offered from a biased point
    of view. The Python programmer will give you an answer that suits a system that
    already uses Python and electronics beginners will offer you solutions that are
    based on “off the shelf” modules, when a simple alternative solution is available
    based on a few cheap components. Even when the advice you get is 100% correct,
    it still isn''t necessarily the right advice for you.


    The large numbers of Raspberry Pis in circulation also means that it is unlikely
    that the device will become obsolete. This isn''t something you can assume about
    other less popular single-board computers. It is reasonable to suppose that any
    programs you write today will work into the foreseeable future on a device that
    might not look like today’s Raspberry Pi’s but will be backward compatible.


    In short the Raspberry Pi provides a secure and non-threatening environment for
    your development work.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Summary


    +   - The cost of computing hardware has fallen to the point where many applications
    that would have used low cost and less powerful microcontrollers can now make
    use of hardware powerful enough to run a full version of Linux.


    +   - The smallest of the Pi is the Pi Zero. It has a single core processor with
    a minimal number of connectors. The Pi Zero W also has built-in WiFi which makes
    it easy to use.


    +   - The most powerful of the Pis is the Pi 4B. This is a quad-core device which
    is at least twice the speed of the earlier Pis and has up to 8GB of memory.


    +   - As the Pi 4 isn''t currently available as a "cut down" model, the Pi 3+
    is still a viable choice for IoT applications.


    +   - All modern Pi support expansion cards called HATs. In many cases HAT makes
    hardware expansion easy, but often it is more than required for a dedicated task.
    HATs are not used in this book as its focus is on connecting to lower cost raw
    devices.


    +   - You can access many devices via high-level Linux drivers. The downside of
    this simple approach is that drivers date and operating systems change and this
    leads to "bit-rot" which stops programs working.


    +   - By avoiding the use of drivers and only depending on the basic provisions
    of the operating system we can minimize bit-rot.


    +   - To work with electronics you need a solderless prototyping board, some hookup
    wires and some components. You also need a multimeter and preferably a logic analyzer.
    After these basic instruments you can add what you can afford.


    +   - With more than 30 million devices sold and a very large community of users,
    the Raspberry Pi is a very stable platform and one can use with reasonable assurance
    that it will be available in the future.'
