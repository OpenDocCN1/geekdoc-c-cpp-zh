- img_proc: true
  md: '# Connect a socket to an address


    To connect a socket as a client of another socket you need to use:

    int connect(int sockfd, const struct sockaddr *addr, socklen_t addrlen);


    The sockfd parameter is just the socket file descriptor returned from the socket
    function. the addr parameter points at a sockaddr struct, which contains the address
    of the socket you want to connect to. Of course, addrlen specifies the size of
    the struct. The socket address type depends on the underlying communications medium
    that the socket uses, but in most cases, and certainly in this article, it is
    just an IP address. As addresses are used in many different socket functions it
    is worth dealing with how to construct an address as a separate topic.


    # Bind a socket to an address


    To assign a server socket to the address it will respond to:

    int bind(int sockfd, const struct sockaddr *addr, socklen_t addrlen);


    The sockfd parameter is just the socket file descriptor returned from the socket
    function and addr is a pointer to an address struct.

    Beginners often ask what the difference is between connection and bind. The answer
    is that connect makes a connection to the socket with the specified address whereas
    bind makes the socket respond to that address. Put another way, use connect with
    a client socket and bind with a server socket.


    # Reading and Writing


    There isn''t anything to say about sending and receiving data from an open socket
    because it is just a file and you can use the standard read and write functions
    that you use to work with a file. Of course, there are some differences and some
    additional features that you need to work with a network, but this is the general
    principle.


    # Listen and Accept


    There is one small matter that we have to deal with that takes you beyond simple
    file use. If you have opened a socket and bound it to an IP address then it is
    acting as a server socket and is ready to wait for a connection. How do you know
    when there is a connection and how do you know when to read or write data? Notice
    this problem doesn''t'
  merge: -1
  pgno: 314
- img_proc: true
  md: 'arise with a socket because it initiates the complete connection

    sends and receives data when it is ready.


    The function:


    ```

    int listen(int sockfd, int backlog);

    ```


    sets the socket as an active server. From this point on it listens for the

    IP address it is bound to and accepts incoming connections. The

    backlog parameter sets how many pending connections will be

    queued for processing. The actual processing of a connection is

    specified by:


    ```

    int accept(int sockfd, struct sockaddr *addr,

    socklen_t *addrlen);

    ```


    The accept function provides the address of the client trying to make

    the connection in the sockaddr structure. The original socket carries

    file descriptor to use to talk to the client. The original socket carries

    on on operating as before. Notice that this is slightly more complicated

    than you might expect in that it is not the socket that you created that

    listens out for clients and creates a queue of pending requests. The

    accept function processes these requests and creates new sockets that

    are used to communicate with the client.


    This still doesn''t solve the problem of how the server detects thatnthere are
    clients pending. This is a complicated question with many

    solutions. You can set up the listening socket to be either

    blocking or non-blocking. If it is blocking then a call to accept will

    not return until there is a client ready to be processed. If it is non-

    blocking then a call to accept returns at once with an error code equal

    to EAGAIN or EWOULDBLOCK. So you can either use a blocking call or you

    call for clients to be ready.


    A more complex approach would be to use another thread to call the

    epoll() function which performs a wait with no CPU overhead while

    the file descriptor is not ready, see Chapter 8 for an example.'
  merge: -1
