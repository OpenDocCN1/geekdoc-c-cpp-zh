  md: '# Raw GPIO Character Dev In C - ioctl


    You don''t need anything special to work with a character device. All you need
    is the standard ioctl system call and for this you simply need to add:


    ```

    #include <sys/ioctl.h>

    ```


    The call varies according to the device it is being used. With its general form
    is: ioctl(fd, request, pstruct)


    where fd is a file descriptor that returns the device being used and request is
    an unsigned long that specifies the request or operation to be performed. The
    third parameter is unsigned pointer to a struct or area of memory. Some ioctl
    calls have additional parameters.


    The request number was never formalized and driver writers tended to invent their
    own but there was an improptu to apply an organization and many requests follow
    a regular pattern. The most recent scheme is 2 direction bits (00: none, 01: write,
    10: read, 11: read/write) followed by 14 size bits (giving the size of the argument),
    followed by an 8-bit type (collecting the ioctls for a common purpose or a common
    driver), and an 8-bit number of macros is provided so that the request can be
    built up from its parts:


    ```

    _IOR(type,nr,size)

    _IOOW(type,nr,size)

    _IORWR(type,nr,size)

    ```


    and


    ```

    _IO(type,nr)

    ```


    These are optional in if you know the request number you can simply use it in
    the ioctl call.


    The GPIO character device works entirely in terms of the ioctl system call – not
    reading or writing the files. What you need to know use the driver directly are
    the request codes and the structures that are passed. These are all defined in
    the gpio. header:


    ```

    #include <linux/gpio.h>

    ```


    Working with the GPIO chip and the GPIO lines follows the same standard steps:


    +   - Find the request constant you need to use

    - Find the struct that is used with that constant

    - Open the appropriate file

    - Make an ioctl call using the constant and the struct'
  merge: -1
