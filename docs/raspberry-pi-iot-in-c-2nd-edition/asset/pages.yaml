- img_proc: true
  md: 'Auto-grouping is said to be the single biggest improvement in desktop Linux
    in terms of interactivity, but it can cause problems for IoT programs if you don''t
    know about it. For example, suppose you decide to stress your system using the
    stress utility:

    sudo apt-get install stress


    You can start a number (n) of CPU-hogging programs using:

    stress --cpu n


    If you try without knowing about auto-grouping you might be puzzled by the result.
    If you start four CPU-hogging programs, for example, what you see when you use
    the command is:


