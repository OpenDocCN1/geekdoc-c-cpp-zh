  md: '# Chapter 8


    # Advanced Input - Events, Threads, Interrupts


    As already discussed in earlier chapters, the big problem with input is that it
    happens when it wants to and usually not when you decide. What this means is that
    you usually have to check for input repeatedly to see if there is any – hence
    the polling loop.


    Most programmers find polling loops inelegant, although they are a perfectly efficient
    way of getting the job done as long as they are well designed. However, if you
    don''t poll for input at the right time, a change can be completely missed. If
    a GPIO line goes high and low while the polling loop is doing something else,
    the input is lost forever. There are two common solutions, events and interrupts.


    Events and interrupts are related concepts but there are some important differences.


    # Events


    An event is a latch or a memory that something happened. Imagine that there is
    a flag that will be automatically set when an input line changes state. The flag
    is set without the involvement of software, or at least any software that you
    have control over. It is useful to imagine an entirely hardware-based setting
    of the flag, even if this is not always the case. With the help of an event you
    can avoid missing an input because the polling loop was busy doing something else.
    The polling loop now detects if the line has changed since last polled. The polling
    loop resets the event flag and processes the event. Of course, it can''t know
    exactly when the event happened, but at least it has missed altogether.


    A simple event can avoid the loss of a single input, but what if there is more
    than one input while the polling loop is unavailable? The most common solution
    is to create an event queue – that is, a FIFO (first in, first out) queue of events
    as they occur. The polling loop now reads the event at the front of the queue,
    processes it and reads the next. It continues like this until the queue is empty,
    when it simply waits for an event. As long as the queue is big'
  merge: -1
  pgno: 110
- img_proc: true
  md: 'enough, an event queue means you don''t miss any input, but input events are
    not necessarily processed close to the time that they occurred. They should be
    processed in order, but unless the events are time stamped the program has no
    idea when they happened.


    An event queue is a common architecture, to work, or have any advantages, it needs
    multiple cores so that events can always be added to the queue after another occurs
    or it needs the help of hardware, usually in the form of interrupts. Notice that
    an event, or an event queue, cannot increase the program''s throughput or its
    latency – the time to react to an input. In fact, an event decreases throughput
    and increases latency due to overhead of management. All an event system does
    to ensure that you do not miss any input and that all input get processed eventually.


    # Interrupts Considered Harmful?


    Interrupts are often confused with events but they are very different. An interrupt
    is a hardware mechanism that stops the computer whatever it is currently doing
    and transfer its attention to running an interrupt handler. You can think of an
    interrupt as an event flag that, when it is set, interrupts the current program
    to run the assigned interrupt handler.


    Using means that the outside world decides when the computer should pay attention
    to input and there is no need for a polling loop. Most hardware people think that
    interrupts are the solution to everything and polling is inelegant and only to
    be used when you can''t use an interrupt. This is far from the reality.


    There is a general feeling that real-time programming and interrupts go together
    and if you are not using an interrupt you are probably doing something wrong.
    In fact, the truth is that if you are using an interrupt you probably doing something
    wrong. So much that some organizations are convinced that interrupts are so dangerous
    that they are banned from being used at all.


    Interrupts are only really useful when you have a low frequency condition that
    needs to be dealt with on high priority basis. Interrupts can simplify the logic
    of your program, but rarely does using an interrupt speed things up because the
    overhead involved in interrupt handling is usually quite high.


    If you have a polling loop that takes 100ms to poll all inputs and there is an
    input that demands attention it is not going to good enough. Using an interrupt
    allows the high priority event to interrupt the polling loop and be processed
    in less than 100ms. However, if this happens very often the polling loop will
    cease to work as intended. Notice an alternative is simply make the polling loop
    check the input twice per loop.'
  merge: -1
  pgno: 111
- img_proc: true
  md: 'For a real world example, suppose you want to react to a doorbell button. You
    could write a polling loop that simply checks the button status repeatedly and
    forever or you could write an interrupt service routine (ISR) to respond to the
    doorbell. The processor would be free to get on with other things until the doorbell
    was pushed when it would stop what it was doing and transfer its attention to
    the ISR.


    How good a design this depends on how much the doorbell has to interact with the
    rest of the program and how many doorbell pushes you are expecting. It takes time
    to respond to the doorbell push and then the ISR has to run to completion - what
    is going to happen if another doorbell push happens while the first push is being
    processed? Some processors have provision for a queue of interrupts, but it doesn''t
    help with the fact that the process can only handle one interrupt at a time. Of
    course, the same is true of polling, but if you can''t handle the throughput of
    events you cannot handle it using an interrupt because interrupts add the time
    to transfer to the ISR and back again.


    Finally, by you dismiss the idea of having a processor do nothing but repeatedly
    "is the doorbell pressed", consider what else it has to do. If the answer is "not
    much" then a polling loop might well be your simplest option. Also, if the processor
    has multiple cores, the fastest way of dealing with any external event is to use
    one of the cores in a fast polling loop. This can be considered to a software
    emulation of a hardware interrupt - not to be confused with a software interrupt
    or trap, which is a hardware triggered by software.


    If you are going to use interrupts to service input then a good design is to use
    the interrupt handler to feed an event queue. This at lowers the chance that input
    will be missed.


    Despite their attraction, interrupts are usually a poor choice for anything other
    than low frequency events that need to be dealt with.


    # Events And The BCM 2835 Library


    The BCM 2835 library does not support interrupts and the reason is that Linux
    does not support user-mode interrupts. However, it does support events in connection
    with GPIO lines.


    That is, a GPIO line can be configured to set a bit when the input changes in
    a specific way, and this setting is performed in hardware with no need for the
    software to get involved. The hardware can also be set to generate an interrupt
    when the flag bit is set but we cannot handle this interrupt in user mode so it
    has to be disabled. Later we will discover how to make use of the GPIO interrupt,
    but this involves using the GPIO driver – see Chapter 7.'
  merge: -1
