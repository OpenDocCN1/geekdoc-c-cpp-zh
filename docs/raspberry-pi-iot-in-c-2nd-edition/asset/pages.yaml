- img_proc: true
  md: 'You may notice that the scratchpad also has an EEPROM memory connected.

    You can transfer the three bytes of the scratchpad to the EEPROM using Copy Scratchpad
    (0x48) and transfer them back using the Recall EEPROM command (0xB8). You can
    use this to make the settings non-volatile.


    Finally there is the Read Power Supply command (0xB4). If the master reads the
    bus after issuing this command a0 indicates that there are parasitic powered devices
    on the bus. If there are such devices the master has to run the bus in such a
    way that they are powered correctly.


    If you restrict yourself to a single slave device on the bus, this is more or
    less all there is to the DS18B20, and the 1-wire bus in general. If you want to
    have multiple slave devices, however, while you don''t need any more hardware,
    you do need some more software, which is the subject of the next chapter.'
