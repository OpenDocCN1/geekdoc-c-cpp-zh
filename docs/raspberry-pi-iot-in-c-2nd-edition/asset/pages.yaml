- img_proc: true
  md: 'The key looks more complicated than the original, and there are more lines
    of code, but it is much easier to extend to more complex situations. In this case
    we have only two states - s = 0 for button not pushed and s = 1 for button pushed.
    Ideally the states that we shouldn''t refer to inputs or outputs, but to the overall
    state of the system.


    For example, if you were using a Pi to control a nuclear reactor you might use
    a state "CoreMeltdown" in preference to "TempSensorOverLimit". States should be
    about the consequence of the input and the outputs should be the consequence of
    the current state. In the example above the inputs and output are too simple to
    give to an abstract concept of "state". Even if you were to change the state labels
    to LED on or LED off they are directly related to the state of a single output
    line.


    The key idea, however, is that the states indicate the state of the system at
    the time of the input. That is, s = 0 button not pushed is the state when the
    system reads in on the GPIO line (recall the line is pulled high so pushing the
    button makes it go low). You can see at the polling loop we read the input line
    and store its value in the variable i. Next, a case statement is used to process
    the input depending on the current state. You can see if s = 0, i.e. button not
    pushed, then the state moves to s = 1, i.e. button pushed, and a message is printed
    as a simple action. In general, the action could be setting a GPIO line high or
    doing anything that is appropriate for the new state. Note that actions occurs
    on state changes.


    If the state is in s = 1, i.e. button pushed, then the input has to be 1 for anything
    to happen. In this case the state changes to s = 0 and any actions that are needed
    to take the system from state 1 to state 0 are performed — none in this case.
    Finally, if the state is anything other than 0 or 1, we set it to 0 as something
    is wrong.


    Notice that the polling loop is set up so the whole thing repeats every 1ms. The
    time at the start of the loop and after everything we processed wait for 1ms to
    be up. If you take the delay then the polling loop takes about 0.75µs on a Pi
    Zero.


    This is a very simple state machine polling loop. In practice there is usually
    a switch statement that deals with each current state, but there is often another
    switch statement within each state case to deal with what happens according to
    different inputs. An alternative way of designing the state machine loop is to
    use a lookup table indexed by state and input which gives you the new state and
    the actions.'
