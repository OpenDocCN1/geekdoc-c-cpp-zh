- img_proc: true
  md: "If you run this program with different pulse widths on a Pi Zero the result\
    \ is very regular:\n\n![](img/175b89abfcdc9824337e5b1ac4bb1ef3_84_0.png)\n\nThe\
    \ equation relating t = 0.12 n + (in µs) and loop count n for a Pi Zero:\n\nt\
    \ = 0.12 n + 0.002\nFor a Pi 4 the equation is:\nt = 5.6 n + 1.1\n\nThis works\
    \ down to about 1 microsecond or slightly less.\nIf you want to record the time\
    \ in microseconds rather than using a loop count then you could use:\n\n```\n\
    #include <stdio.h>\n#include <stdlib.h>\n#include <bcm2835.h>\n\nint main(int\
    \ argc, char** argv) {\n    if (!bcm2835_init()) return 1;\n    bcm2835_gpio_fsel(RPI\
    \ BPLUS_GPIO_J8, 07,BCM2835_GPIO_FSEL_INPT);\n    volatile int i;\n    uint64_t\
    \ t;\n    while (1) {\n        while (1 == bcm2835_gpio_lev(RPI BPLUS_GPIO_J8));\n\
    \        while (0 == bcm2835_gpio_lev(RPI BPLUS_GPIO_J8)) {\n            t = bcm2835_st_read();\n\
    \            for (i = 0; i < 5000; i++) {\n                if (0 == bcm2835_gpio_lev(RPI\
    \ BPLUS_GPIO_J8)) break;\n            }\n            t = bcm2835_st_read() - t;\n\
    \            printf(\"%d,%lu\\n\\r\", i, t);\n            fflush(stdout);\n  \
    \      }\n    }\n    return (EXIT_SUCCESS);\n}\n```\n\nThe function bcm2835_st_read()\
    \ returns the low 32 bits of the system clock.\nIf you get zero as the result\
    \ you are not running as root."
