- img_proc: true
  md: "So to configure the clock you:\n\n+   1. Set ENAB low\n2. Wait for BUSY to\
    \ go low\n3. Set the values you want to change including the divider register\
    \ with ENAB low\n4. Set ENAB high with the same set of values so as to change\
    \ them.\n\nNow we can put this together to write a function that will set the\
    \ clock associated with GPIO4. You can easily change this to work with any of\
    \ the valid GPIO lines (it is used at the end of Chapter 9 to control the PWM\
    \ clock):\n\n```\n#define CLK GPO0_CTL 28\n#define CLK GPO0_DIV 29\nvoid bcm2835\
    \ GPIO4_set_clock_source(\n\tuint32_t source,\n\tuint32_t divisor1,\n\tuint32_t\
    \ divisorF) {\n\tdivisorI &= 0xffff;\n\tdivisorF &= 0xffff;\n\tsource &= 0xf;\n\
    \nuint8_t mask=bcm2835_peri_read(bcm2835_clk + CLK_GPO_CTL)\n\t\t& 0xffffff;\n\
    \n\nbcm2835_peri_write(bcm2835_clk + CLK_GPO_CTL,\n\t\tBCM2835_PWM_PASSWRD | mask);\n\
    \nwhile ((bcm2835_peri_read(bcm2835_clk + CLK_GPO_CTL)\n\t\t& 0x80) != 0) {\n\n\
    \ bcm2835_peri_write(bcm2835_clk + CLK_GPO_DIV,\n\t\tBCM2835_PWM_PASSWRD (divisorI\
    \ << 12) | divisorF);\nbcm2835_peri_write(bcm2835_clk + CLK_GPO_CTL,\n\t\tBCM2835_PWM_PASSWRD\
    \ | source|0x2000);\nbcm2835_peri_write(bcm2835_clk + CLK_GPO_CTL,\n\t\tBCM2835_PWM_PASSWRD\
    \ | 0x0210 | source);\n}\n```\n\nAt the start of the function we make sure that\
    \ the divisors and the source are within the legal range by ANDing them with masks.\n\
    \nNext we read the control register so as to create a mask to ensure we don't\
    \ change any of the bits until the clock is stopped. Note that the enable bit\
    \ of the mask is set to zero, which is why the clock stops when the mask is written\
    \ to the control register."
  merge: -1
