    \ {\n            printf(\"Button held \\n\\r\");\n        } else {\n         \
    \   printf(\"Button Push \\n\\r\");\n        }\n    }\n    fflush(stdout);\n\n\
    \    return 0;\n}\n```\n\nIn this case holding the button for 5s registers a “held”\
    \ and anything less is a “push”.\n\nOne of the problems with all of these sample\
    \ programs is that they wait for the button to be pressed or held and this makes\
    \ it difficult for your program to do anything else. You have to include whatever\
    \ your program needs to do within the loop that waits for the button – You can\
    \ do this in ad hoc way, but the best approach is to implement a finite state\
    \ machine, see later."
