  md: "bits, zero currently isn't used and the data is a 1 if the data is the humidity\n\
    measurement and a 0 if it is a temperature measurement.\n\nTo put the two bits\
    \ together we use:\nunsigned int data16=(unsigned int) msb << 8 | |\n(unsigned\
    \ int) (lsb & 0xFC);\n\nThis zeros the bottom two bits, shifts the msb up bits\
    \ and ORs the two\nresult. The result is a 16-bit temperature value with the bottom\
    \ two bits\nzeroed.\n\nNow we have a raw temperature value but we still have to\
