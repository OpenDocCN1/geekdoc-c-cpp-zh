- img_proc: true
  md: '# Chapter 5


    # Some Electronics


    Now that we have looked as some simple I/O, it is worth spending a little time
    on the electronics of output and input. We cover the electronics of input before
    looking at how the software, the BCM 2835 library in particular, handles input
    because we need to understand some of the problems that the software has to deal
    with.


    First some basic electronics – how transistors can be used as switches. The approach
    is very simple, but it is enough for the simple circuits that digital electronics
    makes use of. It isn''t enough to design a high quality audio amplifier or similar
    analog device, but it will be all you need.


    The basis of all electronics is Ohm''s law, V = IR, and this prerequisite implies
    an understanding of voltage, current and resistance.


    # Electrical Drive Characteristics


    If you are not very familiar with electronics the important things to know are
    what voltages are being worked with how much current can flow. The most important
    to know about the Pi is that it works with two voltages – 0V and 3.3V. If you
    have worked with other logic devices you might be more familiar with 0V and 5V
    as being the low and the high levels. The Pi uses a lower output voltage to reduce
    its power consumption, which is good, but you need to keep in mind that you have
    to use some electronics to change the 3.3V to other values. The same is true of
    inputs which must not exceed 3.3V or risk damaging the Pi.


    In output mode the single GPIO line can source and sink 16mA, but the situation
    is a little more complicated than this seems.


    Unfortunately the Pi power supply can only supply enough power for all of the
    GPIO lines working around 3mA. If you use too much current then the 3.3V supply
    will fail. For the safe limit is usually stated as 50mA in total, i.e all of the
    GPIO lines have to keep their current consumption below a total of 50mA. When
    you get close to this limit you might find that current spikes cause strange behavior.
    In addition, no single GPIO line should supply or sink more than 8mA or 16mA if
    you configure a high drive current – see later.'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'In practice, if you are planning to use more than 3mA from multiple GPIO lines
    consider using a transistor. If your circuits draw more than 50mA from the 3.3V
    supply rail consider a separate power supply. You can use the 5V supply with a
    regulator if you need more 3.3V supply current. How much the 5V pin can carry
    is a difficult question that depends on the USB power supply in, but 2A is a reasonable
    estimate if there are no other USB devices connected. The total of all USB, HDMI,
    and 5V pin has to be less than 2.5A. If in doubt use a separate power supply.


    Notice that the 16mA limit means that you cannot drive a standard 20mA red LED
    without restricting the current to below 16mA. A better solution is to use a low
    power 2mA LED or a transistor driver.


    # Driving An LED


    One of the first things you need to know how to compute the value of a current-limiting
    resistor. For example, if you just connect an LED across a GPIO line and ground
    then no current will flow when the line is low and the LED is off but when the
    line is high at 3.3V it is highly likely that the current will exceed the safe
    limit. In most cases nothing will happen as the Pi''s GPIO lines are rated very
    conservatively but if you keep doing it eventually will fail.


    The correct thing to do is an essential part of using an LED, it is also something
    you need to keep in mind when connecting any output device. You need to discover
    the voltage the device needs and the current it uses and calculate a current-limiting
    resistor to make sure that indeed the current draws from the GPIO line.


    An LED is a non-linear electronic component – the voltage across it stays more
    or less the current passing through the device. Compare this to a normal linear,
    or "Ohmic", device where the current and voltage vary together according to Ohm''s
    law, V =IR, means that if the current doubles, so does the voltage and vice versa.


    This is not how an LED behaves. It has a fairly constant voltage drop irrespective
    of the current. (If you are aware, the relationship between current and voltage
    for an LED is exponential, meaning that big changes in the current hardly change
    the voltage across the LED.) When you use an LED you need to look up its forward
    voltage drop, about 1.7V to 2V for a red LED and about 3V for a blue LED, and
    the maximum current, usually 20mA for small LEDs. You don''t have to use the current
    specified, this is the maximum current and maximum brightness.'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'To work out the current-limiting resistor you simply calculate the voltage
    across the resistor and then use Ohm''s law to give you the resistor you need
    for the current required. The LED determines the voltage and the resistor sets
    the current.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_64_0.png)


    A GPIO line supplies 3.3V and if you assume 1.6V, its forward voltage, across
    the LED that leaves 1.7V across the current-limiting resistor since voltage distributes
    itself across all components connected in series. If we restrict the current to
    8mA, which is very conservative, then the resistor we need is given by:


    R = V/I = 1.7/8 = 0.2125


    The result is in kilohms, kΩ, because the current is in milliamps, mA. So we need
    at least a 212Ω. In practice you can use a range of values as long as the resistor
    is around 200 ohms – the bigger the resistor the smaller the current but the dimmer
    the LED. If you were using multiple GPIO lines then keeping the current down to
    3mA would be better but that would need a transistor.


    You need to do this sort of calculation when driving other types of output device.
    The steps are always the same. The 3.3V distributes itself across the output device
    and the resistor in some proportion and we know the maximum current – from these
    values we can compute the resistor needed to keep the actual current below this
    value.'
  merge: -1
  pgno: 64
- img_proc: true
  md: '# LED BJT Drive


    Often you need to reduce the current drawn from a GPIO line. The Bipolar Junction
    Transistor (BJT) may be relatively old technology, but it is a current amplifier,
    low in cost and easy to use.


    A BJT is a three-terminal device - base, emitter and collector - in which the
    current that flows through the emitter/collector is controlled by the current
    in the base:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_65_0.png)


    The diagram shows an NPN transistor, which is the most common. This diagram is
    a simplification in that in reality the current in the emitter is slightly larger
    than that in the collector because you have to add the current flowing in the
    base.


    In most cases you have to know are two additional facts. The voltage on the base
    is approximately 0.6V, no matter much current flows. The base is a diode, a nonlinear
    device just like the LED in the previous section. The second is that the current
    in the collector/emitter is hfe or beta (β) times the current in the base. That
    is, hfe or beta is the current gain of the transistor and you look it up for any
    transistor you want to use. While you are consulting the sheets, you also need
    to check the maximum currents and voltages the device will tolerate. In most cases,
    the beta is between 100 and 200 and hence you can use a transistor amplify the
    GPIO current by at least a factor of 100.


    Notice that for the emitter/collector current to be non-zero the base has to have
    a current flowing into it. If the base is connected to ground then the transistor
    is "cut off", i.e. no current flows. What this means is that when the GPIO line
    is high the transistor is "on" and current is flowing and when the GPIO line is
    low the transistor is "off" and no current flows.'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'This high on/low off behavior is typical of an NPN transistor. A PNP transistor
    works the other way round:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_66_0.png)


    The 0.6V is between the base and the collector and the current flows out of the
    base. What this means is that the transistor is off when the GPIO line is high
    and when it is low.


    This complementary behavior of NPN and PNP BJTs is very useful and means that
    we can use such transistors in pairs. It is worth knowing that the diagram given
    above is usually drawn with 0V at the top of the diagram i.e. flipped vertically,
    to make it look like the NPN diagram. You need to always make sure you know where
    the +V line is.


    # A BJT Example


    For a simple example we need to connect a standard LED to a GPIO line with a full
    20mA drive. Given that all of the Pi''s GPIO line work at 3.3V and only supply
    a few milliam, we need a transistor to drive the LED which typically draws 20mA.


    You could use a Field Effect Transistor (FET) of some sort, but for this sort
    of application an old-fashioned BJT (Bipolar Junction Transistor) works well and
    is cheap and available in a through-hole mount, i.e. it comes with wires.


    Almost general purpose NPN transistor will work, but the 2N2222 is very common.
    You can discover from its data sheet that the max collector current is 800mA and
    beta is at least 50 which makes it suitable for driving a 20mA LED with a GPIO
    current of at most 20/50mA=0.4mA.'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'The circuit is simple but we need two current-limiting resistors:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_67_0.png)


    If you connect the base to the GPIO line directly then the current flowing in
    the base would be unrestricted – it would be similar to connecting the GPIO line
    to ground. R1 restricts the current to 0.39mA, which is very low and, assuming
    that the transistor has a minimum gain (hfe) of 50, this provides just short of
    20mA to power it.


    The calculation is that the GPIO supplies 3.3V and the base has 0.6V across it
    so the voltage R1 is 3.3 - 0.6V = 2.7V. To limit the current to 0.4mA would need
    a resistor of 2.7/0.4kΩ = 6.7kΩ. The closest preferred value is 6.8kΩ gives a
    slightly smaller current.


    Without R2 the LED would draw a large current and burn out. R2 limits the current
    to 20mA. Assuming a forward voltage drop of 1.6V and a current of 20mA the resistor
    is given by (3.3-1.6)/20kΩ = 85Ω. In practice we could use anything in the range
    82Ω to 100Ω. The calculation just given assumes that the voltage between the collector
    and emitter is zero, but of course, in practice it isn''t. Ignoring this results
    in a current less than 20mA, which is being on the safe side. The data sheet indicates
    that the collector emitter voltage is less than 200mV.


    The point is that you rarely make exact calculations for circuits such as this,
    you simply arrive at acceptable and safe operating conditions.'
  merge: -1
  pgno: 67
- img_proc: true
  md: 'You can also use this design to drive something that needs a higher voltage.
    For example, to drive a 5V dip relay which needs 10mA to activate it you would
    use something like:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_68_0.png)


    Notice that in this case the transistor isn''t needed to increase the drive current
    – the GPIO line could provide the 10mA directly. Its purpose is to change the
    voltage from 3.3V to 5V. The same idea works with any larger voltage.


    If you are using the 2N2222 then the pinouts are:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_68_1.png)


    As always the positive terminal on the LED is the long pin.'
