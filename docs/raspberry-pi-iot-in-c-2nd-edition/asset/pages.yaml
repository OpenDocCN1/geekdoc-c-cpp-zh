  md: 'be-read. However, the UART approach described next ever misses a reading as
    long as the 1-wire bus isn''t noisy – that is, the operating system never causes
    a timing error. The reason is that the UART gets on with the job of measuring
    the line state independently and it has buffers that make sure no data is ever
    lost.


    The first thing we have to deal with the electronics. In this example we are using
    a Pi 4 with UART3 enabled on GPIO3 and GPIO4. As the output has a pull-up where
    the standard UART pins have pull-down this makes slightly simpler. If you are
    going to use the standard UART pins you have to use a transistor to convert the
    pull-down into a pull-up. If you do use GPIO3 and GPIO4 then all you have to do
    is connect them together and to the DS18B20 data line, with the other pins connected
    to 3.3V and ground respectively.


    The basic idea is that we can use the UART to start an initial pulse which pulls
    the line down. After this we can send data on the line for a write or just allow
    the DS18B20 to pull the line out. Of course, we have to get the timing right.
    Let''s start with the presence/reset pulse.


    If we use a speed of 9600 baud, the start bit pulls the line down for 104µs, the
    next four zero bits holds the line low for 502µs and then the final four bits
    allow it to be pulled up. If there is a device connected to it, it will pull the
    line down for a few microseconds. The serial port will read the line at the same
    time it is being written as the RX is connected to the line, it will is connected
    to the TX. The TX sent 0xF0, and you might expect this to be what is received.
    If there is no device connected then RX will receive 0xF0, but if there is an
    active device connected the line will be pulled down for some part of the four
    bits. As the low order bits are sent first this causes the RX to receive something
    like 0xE0, 0x00, and so on i.e. some of the high order bits are zered by the device
    pulling the line down. You can use this to detect the device.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_280_0.png)'
