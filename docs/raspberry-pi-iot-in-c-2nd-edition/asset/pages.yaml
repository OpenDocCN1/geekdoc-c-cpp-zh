  md: '# Chapter 7


    # GPIO The Linux Way


    Until recently the standard way to work with GPIO in Linux was to use the sysfs
    interface and you will see a lot of articles advocating its use and you will encounter
    many programs use of it. Sysfs was deprecated in Linux 4.8 at the end of 2016
    and is due for removal from the kernel in 2020. Of course, at the time for Linux
    distributions to make use of the latest kernels. At the time of writing Pi OS,
    formerly Raspian, is using Linux 4.19 released two years earlier. Nevertheless,
    Sysfs gpio will soon be removed and you still need to know how to cope with legacy
    software, you shouldn''t use it for new projects. You can find out how it works
    Appendix I.


    Its replacement the GPIO character device, and while this looks superficially
    like the old sysfs interface, it has many differences. Although it has some advantages,
    it is also more complex and can no longer be used from the command line – it is
    a program-only interface. This said, there are some utility programs that are
    fairly standard and allow GPIO control from the command line. These are covered
    in the first part of the chapter, even though they are unlikely to be the main
    way that you work with the new interface. There is also a wrapper library called
    gpiod isn''t necessary for simple access to the GPIO lines. If you want to know
    see - Raspberry Pi IoT in C With Linux Drivers, ISBN:9781871962642


    # Why Integrate GPIO With Linux?


    You might ask, given that we have the BCM 2835 library, why bother with a Linux-based
    approach? The answer is that the GPIO character driver is standardized across
    Linux. That is, your program should work with perhaps minor tweaks if you move
    it from a Raspberry Pi to another machine that has GPIO hardware. In addition,
    access to the GPIO driver doesn''t require special permissions and you don''t
    need direct access to memory. It is also a very easy way to make use of I/O events
    from user space, which makes it sometimes to use in conjunction with the BCM 2835
    library.'
  merge: -1
  pgno: 96
- img_proc: true
  md: 'A key principle of Linux is that everything is a file or a folder. As far as
    possible, Linux deals with external hardware by treating it as if it was a file
    system. This is reasonable because external hardware either wants to receive data
    as commands or something to store or display, or to send data as responses or
    user input. Most hardware interacts with Linux as a source or a sink of data and
    this is exactly what a file is all about.


    This “everything is a file” approach only fails when issues of performance enter
    the picture. Accessing a piece of hardware as if it was a file when it isn''t
    slow. In normal use direct memory access is much faster and it is what the BCM
    2385 library is all about.


    So file-based access to the hardware can be slow, but it has the advantage that
    it is language-independent. Every language has the facilities needed to open,
    read/write and close a file and so has the facilities needed to work with hardware
    via the file system.


    It also has the advantage that it works with Linux rather than just ignoring it.
    The system knows about files and understands how to work with them. This allows
    it to offer advanced features like interrupts to GPIO users that fit in with the
    way other interrupts work, more of this in the next chapter.


    To be clear if you want to make use of interrupts without writing your kernel
    modules, then the GPIO character driver is the only way to do it.


    It may crazy, especially if you know the underlying hardware works, to treat a
    single GPIO line as if it was a file, but it works. Files are a fundamental data
    type in Linux and a GPIO line is something you read from or write, just like a
    file. From the Linux point of view it makes perfect sense. The big problem is
    that the details of how hardware is represented as a file is poorly documented
    and you have find out it by guesswork, trial and error, reverse engineering, or
    by reading code that makes use of it.


