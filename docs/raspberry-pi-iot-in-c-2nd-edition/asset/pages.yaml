  pgno: 236
- img_proc: true
  md: "There are four devices on the bus they must all differ in at least one bit\
    \ position. When the master starts the scan, it reads all 1 or all 0 as it processes\
    \ each bit position until it comes to the first location where there is another\
    \ device with a different value at that. The master receives a $\theta$ back from\
    \ the slaves and arbitrarily sends a $\theta$ to switch off all the slaves with\
    \ a 1 in location. The master continues to read bits and if all of the other devices\
    \ have a 1 in that bit position there are no conflicts.\n\nWhen the master reaches\
    \ 63, it has the complete serial number of the first Device, Device 1 in the diagram.\
    \ It then backtracks to the bit position where the first conflict occurred. It\
    \ writes writes 1 to switch off Device 1 and continues to read bits until it encounters\
    \ another conflict. Again it chooses a $\theta$ and switches off all of the devices\
    \ with a 1 in that bit position.\n\nIn the example there are two devices with\
    \ a $\theta$ in that bit position and so as the master reads bits until it encounters\
    \ another conflict. Again it sends a $\theta$ and switches off the other device\
    \ and continues reading bits until it reaches 63 when it has the serial number\
    \ of Device 2.\n\nThe master backtracks to the most recent conflict, sends a 1\
    \ and continues the next branch to get the next device's serial number and until\
    \ there are no conflict points to backtrack to.\n\nMake sure you understand the\
    \ algorithm before moving on to consider the implementation.\n\n# A Recursive\
    \ Scan\n\nThe depth-first tree search described above is most easily implemented\
    \ using recursion. Recursion is often considered difficult, when it fits in the\
    \ nature of the problem it is the best way to work. A simple, but not complete,\
    \ recursive algorithm for the depth-first search described above is relatively\
    \ easy to construct. If you don't follow how it works then you can just use it,\
    \ but it is worth trying to understand as it is a really good example of how recursion\
    \ can make things simpler.\n\nThe serial numbers of the devices found will be\
    \ stored in an array of 64-bit integers passed into the function:\n\n```\nint\
    \ oneWireScan(uint8_t pin, uint64_t serial[]) {\n\n```"
