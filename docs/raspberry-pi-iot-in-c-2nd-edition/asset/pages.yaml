- img_proc: true
  md: '# Summary


    +   - Events are a stored indication that something happened.

    - Interrupts are events that cause something to happen.

    - You can use an event with a polling loop to protect against missing input because
    the program is busy doing something else.

    - If an event occurs before the current event has been cleared it might be missed.
    To avoid missing events, you can use an event queue which stores events in the
    order they happened until they are processed.

    - The BCM 2835 library supports GPIO events. You can enable a bit be if a GPIO
    line goes high, low or is high or low. Edge-triggered events are the easiest to
    work with.

    - If you use events then you have to turn off GPIO generated event handling or
    they system will crash.

    - Using events in a polling loop hardly slows things down at all.

    - You can use events to generate an interrupt that you can wait for using epoll.
    To do this you need to use the GPIO character driver to provide the file that
    epoll waits on.

    - The use of the GPIO character driver slows down a lot.

    - When polls the thread simply waits for the interrupt to occur. If you want to
    continue processing until the interrupt occurs you then have to wait for the interrupt
    on a new thread. This is slow but it is the closest approach to a true interrupt
    user mode.

    - The gpiod library has some commands that will wait for an event occur and report
    the time stamp of the event.

    - Overall events are useful, but interrupts are not. Neither increases the throughput
    of a polling loop and an interrupt only decreases response time if the event is
    infrequent.'
