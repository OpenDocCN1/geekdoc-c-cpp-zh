- img_proc: true
  md: "If you want a smaller range you can reduce the clock to a lower frequency and\
    \ the divider you need is:\n\ndivider = 2* max range/desired range\n\nThe 2 is\
    \ because it is the smallest divider you can use. For example, if you want to\
    \ reduce the range to 8 bits, i.e. range 255, but keep the repeat time at 5ms,\
    \ you would need a divider given by:\n\ndivider = 2 * 48000/255 = 367\n\nThe closest\
    \ divider to is 256 which gives a clock rate of 75kHz and a repeat rate of 3.1ms\
    \ and a frequency of 294kHz, which isn't close to the desired rate, but this is\
    \ the best we can do if you are restricted to an 8-bit resolution for the duty\
    \ cycle.\n\n# Using PWM\n\nSo now you know how to make use of the PWM lines. All\
    \ you have to do is set the frequency, range and data. You also have to set the\
    \ mode of the GPIO pin you using the correct ALT mode, some GPIO lines have a\
    \ number of alternative uses or ALT modes. To enable the two PWM pins, you use\
    \ GPIO 18 to ALT 5 and GPIO 13 to ALT 0:\n\n```\nbcm2835_gpio_fsel(18, BCM2835_GPIO_FSEL_ALT5);\n\
    bcm2835_gpio_fsel(13, BCM2835_GPIO_FSEL_ALT0);\n```\n\nThe simplest PWM program\
    \ you can write:\n\n```\n#include <bcm2835.h>\nint main(int argc, char** argv)\
    \ {\n    if (!bcm2835_init())\n        return 1;\n    bcm2835_gpio_fsel(18, BCM2835_GPIO_FSEL_ALT5);\n\
    \    bcm2835_pwm_set_clock(2);\n    bcm2835_pwm_set_mode(0, 1);\n    bcm2835_pwm_set_range(0,\
    \ 2);\n    bcm2835_pwm_set_data(0, 1);\n    return 0;\n}\n```\n\nThe clock is\
    \ set to fastest (9.6MHz) and PWM 0 is set to mark/space mode with range 2 and\
    \ data 1. This produces the pulse train with one clock pulse high and one low:\n\
    \nThe theoretical pulse width is 104.16ns and it is measured to 105ns.\n\n![](img/175b89abfcdc9824337e5b1ac4bb1ef3_142_0.png)"
  merge: -1
  pgno: 142
- img_proc: true
  md: "You have to set the value first and then set the period, otherwise the PWM\
    \ line is not set up properly. You also have to set the period for each pin you\
    \ are using, even if it does the same period. Notice that there is no need to\
    \ put the program into an infinite loop. Once the PWM line has been set up and\
    \ enabled, it just gets on generating the pulse train, no matter what the processor\
    \ does. In this case the pulse generation continues long after the program has\
    \ ended.\n\nThis may be fast, but as a PWM signal it is completely useless because\
    \ you cannot change its duty cycle to anything useful. In practice, you need to\
    \ set range to something greater than 2.\n\nJust to demonstrate that two PWM lines\
    \ can be used independently of one another, there is a program that sets each\
    \ of the PWM GPIO lines to a different duty cycle and repeat rate:\n\n```\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n#include <bcm2835.h>\n\nint main(int argc, char\
    \ **argv) {\n    if (!bcm2835_init())\n        return 1;\n    }\n\n    bcm2835_gpio_fsel(18,\
    \ BCM2835 GPIO_FSEL_ALT);\n    bcm2835_gpio_fsel(13, BCM2835 GPIO_FSEL_ALT);\n\
    \    bcm2835_pwm_set_clock(2);\n\n    bcm2835_pwm_set_mode(0, 1, 1);\n    bcm2835_pwm_set_range(0,\
    \ 2);\n    bcm2835_pwm_set_data(0, 1);\n\n    bcm2835_pwm_set_mode(1, 1, 1);\n\
    \    bcm2835_pwm_set_range(1, 8);\n    bcm2835_pwm_set_data(1, 2);\n    return\
    \ (EXIT_SUCCESS);\n}\n```\n\nYou can see the result in this logic analyzer display:\n\
    \n![](img/175b89abfcdc9824337e5b1ac4bb1ef3_143_0.png)"
