  md: "# Getting Chip Info\n\nAs a first simple example, let's get some information\
    \ about the GPIO chip. If you look through the header file you will find:\n\n\
    ```\nGPIO_GET_CHIPINFO_IOCTL\nwhich is the request constant. You will also find:\n\
    struct gpiochip_info {\n    char name[32];\n    char label[32];\n    __u32 lines;\n\
    };\n```\n\nwhich is the struct that is used to hold information about the GPIO\
    \ chip.\n this information we can open the file and make the ioctl call:\n\n```\n\
    #include <stdio.h>\n#include <errno.h>\n#include <unistd.h>\n#include <fcntl.h>\n\
    #include <sys/ioctl.h>\n#include <linux/gpio.h>\n\nint main(int argc, char **argv)\
    \ {\n    int fd;\n    struct gpiochip_info info;\n\n    fd = open(\"/dev/gpiochip0\"\
    , O_RDONLY);\n    int ret = ioctl(fd, GPIO_GET_CHIPINFO_IOCTL, &info);\n    close(fd);\n\
    \n    printf(\"label: %s\\n name: %s\\n number of lines: %u\\n\",\n          \
    \ info.label,info.name,info.lines);\n\n    return 0;\n}\n```\n\nWith all good,\
    \ easy-to-understand examples, error handling has been omitted. If you run this\
