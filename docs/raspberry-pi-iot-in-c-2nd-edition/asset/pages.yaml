- img_proc: true
  md: '| Measurements | |

    |---||

    | Width | 17.86us |

    | Period | 35.72us |

    | DutyCycle | 50% |

    | Frequency | 27.9952970kHz |


    This use of epoll has been set up so that the main thread pauses waiting for the
    event. If you want the main thread to continue to do your work you can run poll
    on another thread and have it wait and restart when the event occurs. If you know
    about threads this isn''t difficult, but it introduces many potential problems.


    # # An Interrupt Function Using A Thread


    **Advanced:** Skip unless you need to use it.


    The epoll function gets you close to handling interrupts as you can get in user
    mode, but there is one thing - the thread is suspended while waiting for the interrupt.
    This is generally not what you want to happen.


    You can create a better approximation to a true interrupt by running epoll function
    on another thread. But if the main program wants to work with an interrupt you
    have to define an interrupt-handling function that will be called when the interrupt
    occurs. Next you have to create a new thread that sets everything up and then
    calls epoll on the file descriptor. This causes your new thread to be suspended,
    but you don''t care because its only purpose is to wait for the interrupt and
    meanwhile your program''s main thread continues to run and do useful work. When
    the interrupt occurs, the new thread is restarted and correct and then calls your
    interrupt handler. When the interrupt handler completes, the thread cleans up
    and calls poll again to wait for another interrupt. If you want to know more about
    threads, see Chapter 12 of Applying C for the IoT with Linux,


    ISBN: 9781871962611.


    This is all very straightforward conceptually, but it means using threads, which
    is an advanced technique that tends to make programs prone to esoteric errors
    and more difficult to debug.


    The following program provides the basic skeleton of a thread to simulate a user-mode
    interrupt, without error checking, error recovery or locking. If you are going
    to use this sort of approach in the real world you would have to add code that
    handles what happens when something goes wrong, whereas this code simply assumes
    that everything goes right.'
