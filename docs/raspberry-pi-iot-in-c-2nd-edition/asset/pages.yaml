- img_proc: true
  md: "# Writing Bits\n\nOur next task is to implement the sending of some data bits\
    \ to the device. The 1-wire bus has a very simple data protocol. All bits are\
    \ sent using a minimum of 60µs for a read/write slot. Each slot must be separated\
    \ from the next by a minimum of 1µs.\n\nThe good news is that timing is only critical\
    \ within each slot. You can send the first bit in a time slot and take your time\
    \ before you send the next bit as the device will wait for you. This means you\
    \ only have to worry about timing within the functions that read and write individual\
    \ bits.\n\nTo send a 0 you have to hold the low line for most of the slot. To\
    \ send a 1 you have to hold the low line for just between 1µs and 15µs and leave\
    \ the line for the rest of the slot. The exact timings can be seen below:\n\n\
    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_202_0.png)\n\nIt seems reasonable to\
    \ use the typical timings given in the datasheets. So for a 0 we hold the line\
    \ for 60µs then let it go high for the remainder of the slot, 10µs. To send a\
    \ 1 we hold the line for 6µs and then let it go high for the remainder of the\
    \ slot, 64µs. As the only time critical operations are the actual setting of the\
    \ line and back to high, there is no need to worry much about the speed of operation\
    \ of the entire function we might as well combining 0 and 1 into a single writeBit\
    \ function:\n\n```\nvoid writeBit(uint_t pin, int b) {\n    int delay1, delay2;\n\
    \    if (b == 0) {\n        delay1 = 6;\n        delay2 = 64;\n    } else {\n\
    \        delay1 = 60;\n        delay2 = 10;\n    }\n\n    bcm2835 gpio fsel(pin,\
    \ BCM2835 GPIO_OUTP);\n    bcm2835 gpio write(pin, LOW);\n    bcm2835 delayMicroseconds(delay1);\n\
    \    bcm2835 gpio fsel(pin, BCM2835 GPIO_FSEL_INPT);\n    bcm2835 delayMicroseconds(delay2);\n\
    }\n```"
  merge: -1
