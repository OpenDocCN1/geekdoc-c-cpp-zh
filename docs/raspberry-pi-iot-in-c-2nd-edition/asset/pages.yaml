  md: '# # The I2C Functions


    # ## Initialization


    There are two initialization functions:

    int bcm2835_i2c_begin(void)

    void bcm2835_i2c_end(void)


    The begin function changes pins 3 and 5 to ALT 0 which gets things ready for I2C
    data transfer. The end function restores them to default GPIO inputs.

    You also have to set the speed of the bus if you don''t want to accept the default
    100KHz and there are two functions to set the clock:


    ```

    void bcm2835_i2c_setClockDivider(uint16 t divider)

    vcm2835_i2c_set_baudrate(uint32 t baudrate)

    ```


    The following constants set the clock to common frequencies although the logic
    of these choices is lost to the change in core clock frequency. The measured frequencies
    for the Pi Zero and a Pi 4 with a clock rate of 1GHz and 1.5GHz respectively:


    | Constant | Pi Zero | Pi 4 |

    | BCM2835_I2C_CLOCK_DIVIDER_2500 | 160KHz | 200KHz |

    | BCM2835_I2C_CLOCK_DIVIDER_626 | 639KHz | 800KHz |

    | BCM2835_I2C_CLOCK_DIVIDER_150 | 2.66MHz | 3.33MHz (default) |

    | BCM2835_I2C_CLOCK_DIVIDER_148 | 2.7MHz | 3.38MHz |


    As the I2C clock is the core clock divided down, if the Pi 4 enters an idle or
    throttled SPI speed will be lower. To guarantee the selected speed, you have to
    fix the core clock rate as discussed in Chapter 4. Use 500Mhz for the Pi 4 and
    Pi 3.


    The baud rate function is used to mimic the action of the Linux driver settings.
    As the library doesn''t use the Linux driver, this is purely for convenience of
    transferring software. The baud rate is simply the clock speed in Hz.


    There is also a function to set the slave''s address for subsequent read/write
    operations:

    void bcm2835_i2c_setSlaveAddress(uint8_t addr)


    Simply specify the slave''s address as specified in its datasheet, noting that
    the 7-bit address is set the high-order bits in the byte and that when you specify
    a device address will convert the address according to whether the operation is
    a write or a read. For example, a device might report an address of 0x40 on its
    datasheet, but on this bus translates to a write address of 0x80 and a read address
    of 0x81.'
  merge: -1
