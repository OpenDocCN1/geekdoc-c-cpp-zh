- img_proc: true
  md: "It is clear that you can't know the time the button has been pressed until\
    \ it is released so the actions are now all in the button pushed state. While\
    \ the button is in the pushed state it can be released and we can compute the\
    \ time it has been pressed and modify the action accordingly.\n\n# FSM Ring Counter\n\
    \nAnother common input configuration is the ring counter. A ring counter moves\
    \ to a new output each time it receives an input and repeats when it reaches the\
    \ last output of the. For example, if you have three output lines connected to\
    \ three LEDs then initially LED 0 is on, when the user presses the button 1 is\
    \ on and off the rest, the next user press moves to LED 2 on and another press\
    \ turns LED 0 on. You can see that as the user keeps pressing the button LEDs\
    \ go on and off in a repeating sequence.\n\nA common implementation of a ring\
    \ counter has a state for each button press and release for each LED being on.\
    \ For three LEDs this means six states and this has a number of disadvantages.\
    \ A better idea is to have just two states button pressed and button released\
    \ and use a press counter as an additional input value. This means what happens\
    \ when you enter the button state depends on the counter.\n\nImplementing this\
    \ is fairly easily:\n\n```\n#include <stdio.h>\n#include <stdlib.h>\n#include\
    \ <bcm2835.h>\n```\n\n```\nint main(int argc, char** argv) {\n    if (!bcm2835_init())\
    \ return 1;\n\nnbcm2835_gpio_fsel(RPI BPLUS GPIO J_07, BCM2835 GPIO FSEL_INTP);\n\
    bcm2835_gpio_set_pad(RPI BPLUS GPIO J_07, BCM2835 GPIO_PUD_UP);\n\nbcm2835_gpio_fsel(RPI\
    \ BPLUS GPIO J_11, BCM2835 GPIO FSEL_OUT);\nbcm2835_gpio_fsel(RPI BPLUS GPIO J_13,\
    \ BCM2835 GPIO FSEL_OUT);\nbcm2835_gpio_fsel(RPI BPLUS GPIO J_15, BCM2835 GPIO\
    \ FSEL_OUT);\n\nbcm2835_gpio_write(RPI BPLUS GPIO J_11, HIGH);\nbcm2835_gpio_write(RPI\
    \ BPLUS GPIO J_13, LOW);\nbcm2835_gpio_write(RPI BPLUS GPIO J_15, LOW);\n```"
