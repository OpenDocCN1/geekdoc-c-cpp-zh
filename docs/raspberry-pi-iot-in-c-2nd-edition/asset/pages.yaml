- img_proc: true
  md: 'Given that the HTU21D has pull-up resistors we really should disable them for
    use on the Pi’s internal I2C bus which already has pull-ups. In practice, the
    additional pull-ups don''t seem to make much difference to the waveforms and you
    can leave them in place while testing.


    You can use a prototype board to make the connections and this makes it easier
    to connect other other instruments such as a logic analyzer. Given that the pins
    out vary according to the exact make of the device you need to compare the suggested
    wiring with the breakout board you are actually using.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_174_0.png)


    # A First Program


    After wiring up any I2C device the first question that needs to be answered, does
    it work?


    Unfortunately for most complex devices finding out if it works is a multi-step
    process. Our first program aims to read some data back from the HTU21D - any data
    will do.


    If you look at the datasheet you will find that the device address is 0x40 and
    it supports the following commands/registers:


    | Command | Code | Comment |

    |---|---||

    | Trigger Temperature Measurement | 0xE3 | Hold master |

    | Trigger Humidity Measurement | 0xE5 | Hold master |

    | Trigger Temperature Measurement | 0xF3 | No Hold master |

    | Trigger Humidity Measurement | 0xF5 | No Hold master |

    | Write user register | 0xE6 | |

    | Read user register | 0xE7 | |

    | Soft Reset | 0xFE | |


    The easiest of these to get started with is the Read user register command. The
    user register gives the current setup of the device and can be used to set the
    resolution of the measurement.'
