- img_proc: true
  md: '# Read A Register


    As for writing to a register, reading from a register is a very standard operation,
    but it is slightly more complicated that you need a write and a read operation.
    That is, to read a register you need a write operation to send the address of
    the register to the device and then a read operation to get the data that device
    sends as the contents of the register. So, for example, to read a register you
    could use something like:


    ```

    char buf[]={registerAddress};

    bcm2835 i2c_read(buf 1);

    bcm2835 i2c_read(buf 1);

    ```


    If the register sends multiple bytes then you can usually read one after another
    as a block transfer without sending an address each time. This write/read combination
    is so common that there is a second read function just for this application, but
    with an extra feature. The read_register_rs function will read any number of bytes
    from a register by its address:


    ```

    uint8_t bcm2835_i2c_read_register_rs(char *addr, *buf, uint32_t len)

    ```


    In other words, this combines writing the register''s address with reading it.
    In theory, and mostly in practice, a register read of this sort can work with
    a stop-start separating the write and the read operation, which is what you get
    if you use separate write and read function calls. That is the transfer sequence
    is:


    | START | ADDR | ACK | REGADDR | ACK | STOP |

    | START | ADDR | ACK | DATA1 | ACK |

    | | DATA2 | ACK |

    | | DATA | NAK | STOP |


    If you look at the start and end of the write, using a logic analyzer, you will
    see that there is a STOP and START between them.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_170_0.png)'
  merge: -1
  pgno: 170
- img_proc: true
  md: "For some devices this is a problem. A STOP bit is a signal that another\nttransaction\
    \ can start and this might allow another master to take over the bus.\nto avoid\
    \ this, some devices demand a repeated START bit between the write\nand the read\
    \ and no STOP bit. This is referred to as a \"repeated start\"\ntransaction. That\
    \ is, the sequence for a repeated start bit register is:\n\n```\nSTART | ADDR|ACK|REGADR|ACK|\n\
    START | ADDR|ACK|DATA0|ACK|\n      DATA1|ACK|\n...\n      DataN|NAK|STOP\n```\n\
    \nNotice that there is one STOP bit. work, but in practice you will find\n some\
    \ slave devices that they need a repeated start bit and no stop\nbin continuous\
    \ transactions. In this case you need to be careful how you\nsend and receive\
    \ data. For example, to read a register from a device that\nrequires repeated\
    \ bits but no STOP bit you would use:\n\n```\nchar buf[] = {0xE7};\nbcm2835 i2c_setSlaveAddress(0x40);\n\
    bcm2835 i2c_read_register_rs(buf, buf, 1);\n```\n\nYou can see in the logic analyzer\
    \ display that there is now just a simple START\nwith the write and data.\n\n\
    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_171_0.png)\n\nThe read_register_rs function\
    \ sends a single byte to select the register and\nthen reads back as many bytes\
    \ as the slave device specifies as a response.\n\nWhat if you need to send more\
    \ than one byte to the slave? You can of course\nuse separate write and read function\
    \ calls, but there is a special function\nwhich will suppress the stop bits between\
    \ the write and read of any number\nof bytes:\n\n```\nuint8_t bcm2835_i2c_write_read_rs(char\
    \ * cmds,\nuint32_t cmds_len,\nchar * buf,\nuint32_t buf_len\n);\n```"
  merge: -1
  pgno: 171
- img_proc: true
  md: "This writes cmd len bytes from buf and then reads buf_len bytes from the slave\
    \ without putting a STOP bit between the read and write. Of course: bcm2835_i2c_write_rs(buf,1,\
    \ buf, 1);\n\nis the same as:\nbcm2835_i2c_read_register_rs(buf, buf, 1);\n\n\
    \ few devices need a repeated start transaction. The documentation mentions the\
    \ MLX90620 IR array, but this is hardly a common peripheral. In practice it usually\
    \ doesn't make any difference if you need a stop bit in the middle of a write/read\
    \ transaction but you need to know about it in case.\n\n# Slow Read Protocols\n\
    \nThe I2C clock is mostly controlled by the master and this raises the question\
    \ of how we cope with the speed that a slave cannot respond to a request for data.\n\
    \nThere are two broad approaches to waiting for data on the I2C bus. The first\
    \ is simply to request the data and then perform reads in polling. If the device\
    \ isn't ready with the data, then it sends a data frame with a NAK bit set.\n\n\
    The I2C functions return one of the following codes:\n\n| BCM2835 I2C REASON OK\
    \ | Success |\n| BCM2835 I2C REASON ERROR_NACK | Not acknowledged |\n| BCM2835\
    \ I2C REASON ERROR_CLKT | Received clock timeout |\n| BCM2835 I2C REASON ERROR_DATA\
    \ | Not all data is sent / received |\n\nSo all we have to do is test for an ERROR_NACK\
    \ response. Of course, polling loop doesn't have to be \"tight\". The response\
    \ time is long enough to do other things and you can use the I2C bus with other\
    \ slave devices while the you activated gets on trying to get the data you requested.\
    \ All you have to do is to remember to read its data at some later time.\n\nThe\
    \ second way is to allow the slave to hold the clock line after the master has\
    \ released it - so called \"clock stretching\". In most cases the master will\
    \ simply wait before moving on the next frame where the clock line is held low.\
    \ This is very simple and it means you don't have to implement a polling loop,\
    \ but also notice that your program is frozen until the slave releases the clock\
    \ line.\n\nThe Pi's implementation of I2C clock stretching has a flaw in that\
    \ it fails the clock stretching is very short. However, there is also a problem\
    \ with the Linux driver and with the bcm2835 library that may account for many\
    \ of the reports that I2C doesn't work at all."
  merge: -1
  pgno: 172
- img_proc: true
  md: 'There is a clock stretch timeout register that isn''t much discussed and as
    there isn''t a library function to set it, it tends to be ignored and this causes
    clock stretching to appear not to work. By default it is set to 40, but the units
    are I2C clock pulses. If you are using a high clock rate then 40 clock pulses
    can be a very short time period and not long enough for devices as AtoD converters
    to complete their tasks. To make clock stretching, you have to set the timeout
    and you can see how to do this in the example that follows. Many devices implement
    both types of slow read protocol and you can use whichever suits your application.


    # A Real Device


    Using an I2C device has two problems - the physical connection between master
    and slave and figuring out what the software has to make it work. Here''ll work
    with the HTU21D/Si7021 and the information in its datasheet to make a working
    temperature humidity sensor using the I2C functions we''ve just met.


    First the hardware. The HTU21D Humidity and Temperature sensor is one of the easiest
    of I2C devices to use. Its only problem is that it is only available in a surface-mount
    package. To overcome this you solder wires onto the pads or buy a general breakout
    board. However, it is much simpler to buy the HTU21D breakout board because this
    has been replaced by the Si7021 which is more robust and works in the same way,
    but the HTU21D is still available from many sources.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_173_0.png)


    If you decide to work with some other I2C device you can still follow the steps
    given, modifying what you do to suit it. In particular, if you select a device
    that only works at 5V you might need a level converter.'
  merge: -1
