  md: '# Other Books by Harry Fairhead


    # Applying C For The IoT With Linux


    ISBN: 978-1871926211


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_408_0.png)


    If you are using C to write low-level code using Small Board Computers (SBCs)
    that run Linux, or if you do any coding in C that interacts with the hardware,
    this book brings together low-level, hardware-oriented and often hardware-specific
    information. It starts by looking at how programs work with user-mode Linux. When
    working with hardware, arithmetic cannot be ignored, separate chapters are devoted
    to integer, fixed-point and floating-point arithmetic.


    It goes on the pseudo file system, memory-mapped files and sockets as a general-purpose
    way of communicating over networks and similar infrastructure. It continues by
    looking at multitasking, locking, mutex and condition variables, and scheduling.
    Later chapters cover managing cores, memory models and barriers and it rounds
    out with a short look at how to mix assembler with C.


    # Fundamental C: Getting Closer To The Machine


    ISBN: 978-1871926204


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_408_1.png)


    At an introductory level this book explores C from the point of view of the low-level
    programmer and keeps close to the hardware. It covers addresses, pointers, and
    how things are represented using binary and emphasizes the important idea that
    everything is a bit pattern and what it means change. For beginners, the book
    covers installing an IDE and GCC before writing a Hello World program and then
    presents the fundamental building


    blocks of program - variables, assignment and expressions, flow of control using
    conditionals and loops. When programming in C you need to think about how the
    data is represented, how a bit pattern is treated using type punning and unions
    tackles the topic of undefined behavior, which is ignored in many books on C.
    A particular feature of the book is that your C code is illustrated by the assembly
    language it generates. This helps you understand why C is the way it is. And the
    way it was always intended to be written - close to the metal.'
  merge: -1
  pgno: 408
- img_proc: true
  md: '# micro:bit IoT In C

    ISBN: 978-1871962451


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_409_0.png)


    The BBC micro:bit is capable of taking a variety of roles including that of a
    powerful IoT device. This book, written for the electronics enthusiast with a
    programming background, presents details of sensors and circuits with several
    complete programs. A first "Hello Blinky" C program introduces the embedded online
    compiler, after that an offline approach using the yotta development is used to
    discover how to control the micro:bit''s I/O lines and explore using the GPIO.
    For speed


    we need to work directly with the raw hardware and also memory mapping and pulse
    width modulation. Sensors are connected using first the I2C bus, then by implementing
    a custom protocol for one-wire bus, and eventually adding eight channels of 12-bit
    AtoD. The micro:bit lacks WiFi connectivity but can become an Internet server
    via its serial port. The book concludes with a look at the micro:bit''s LED display
    and how it can be used for the classic game of Commando Jump, in C.'
  merge: -1
  pgno: 409
- img_proc: true
  md: '# # Coming Soon


    # ## Raspberry Pi IoT in Python With GPIO Zero

    ISBN:9781871962666


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_410_0.png)


    Python is an excellent language to learn about the IoT or physical computing.
    It might not be as fast as C, but it is much easier to use for complex data processing.
    The GPIO Zero library is the official way to use Python with the GPIO and other
    devices. This book looks how to use it to interface with devices and how it works
    so that you can extend it to custom devices. GPIO Zero is also a great way to
    improve your Python.


    # ## Raspberry Pi IoT in C With Linux Drivers

    ISBN:9781871962642


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_410_1.png)


    There are Linux drivers for many off-the-shelf IoT devices and they provide a
    very easy-to-use, high-level way of working. The big problem is that there is
    very little documentation to help you get started. This book explains the principles
    so that you can tackle new devices and provides examples of using external hardware
    via standard Linux drivers.


    # ## Raspberry Pi IoT in Python With Linux Drivers

    ISBN:9781871962659


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_410_2.png)


    If you opt to use Linux drivers to connect to external devices then Python becomes
    a good choice, as speed of execution is no longer a big issue. This book explains
    how to use Python to connect and control external devices using the standard Linux
    drivers.'
  merge: -1
  pgno: 410
