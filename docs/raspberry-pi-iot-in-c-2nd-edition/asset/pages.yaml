    \ = buf[2];\nprintf(\"msg %d \\n\\r checksum %d \\n\\r\", ((unsigned int) msb\
    \ << 8) | \n(unsigned int) (lsb & 0xFC));\n```\n\n```\nfloat temp = (float)(-46.85\
    \ +175.72 * data16 / (float) 65536));\nprintf(\"Temperature %f C \\n\\r\", temp);\n\
    ```"
