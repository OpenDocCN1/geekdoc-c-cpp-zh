    \ working out 2^i. You can work out\n2\" with the expression 1<<i, i.e. shift\
    \ 1 places to the right.\n\nThis gives:\n\n```\nfloat temp = (-46.85 +175.72 *\
    \ data16 /(float)(1<<i));\n```\n\nAs 2^i is a constant that works out to 65536\
    \ it is more efficient to write:\nfloat temp = (float)(-46.85 +175.72 * data16\
    \ /(65536));\n\nAll we have to do is print the temperature:\nprintf(\"Temperature\
    \ %f C \\n\\r\", temp);\n\nThe final program extract is:\n\n```\nif (!bcm2835\
    \ init()) return 1;\nbcm2835_i2c begin();nbcm2835_i2c setClockDivider(BCM2835_I2C_CLOCK_DIVIDER_626);\n\
    setTimeout(40000);\nbcm2835_i2c setSlaveAddress(0x40);\nchar buf[4] = {0xE3};\n\
    uint8_t status = bcm2835_i2c read_register(buf, buf, 3);\nprintf(\"status=%d \\\
