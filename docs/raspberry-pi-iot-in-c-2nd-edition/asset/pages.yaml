    enable_uart = 1


    /to /boot/config.txt and reboot.


    Setting enable_uart to 0 disables the UART and setting 1 enables it so you also
    need to remove any mention of serial0 in /boot/cmdline.txt using:

    sudo nano /boot/cmdline.txt


    You generally have to remove:

    console = serial0 115200'
