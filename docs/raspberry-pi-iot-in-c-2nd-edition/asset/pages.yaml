  md: '# Summary


    +   - One of the device types that use the 1-wire bus are iButtons which come
    in a range of types.


    +   - The main purpose of an iButton is security and each one contains a unique
    identifying serial number.


    +   - You can buy hardware to mount iButtons in an easy to use fob that works
    naturally with a reader.


    +   - Using an iButton is a standard exercise in the 1-wire bus protocol.


    +   - After finding that there is an iButton connected, the next step is usually
    to read the ROM to find the unique serial number.


    +   - To check for errors you need to compute a CRC which follows the usual steps.


    +   - Putting everything together gives a program that can detect an iButton in
    reader and read its serial number. To use this in a security program you would
    need to keep a list or a database of authorized serial numbers.'
