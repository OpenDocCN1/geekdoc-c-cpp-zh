    \ SPI MODE0);\n    bcm2835 spi_setClockDivider(BCM2835 SPI CLOCK_DIVIDER_8192);\n\
    \    bcm2835 spi_chipSelect(BCM2835 SPI CS0, LOW);\n    bcm2835 spi_setChipPolarity(BCM2835\
