- img_proc: true
  md: "```\nbcm2835 gpio_fsel(pin, BCM2835 GPIO_FSEL_OUTP);\nbcm2835 gpio_write(pin,\
    \ LOW);\nbcm2835 delayMicroseconds(8);\nbcm2835 gpio_fsel(pin, BCM2835_GPIO_FSEL_INPT);\n\
    bcm2835 delayMicroseconds(2);\nuint8_t b = bcm2835_gpio_read(pin);\nbcm2835 delayMicroseconds(60);\n\
    return b;\n}\n```\n\nA logic analyzer shows the typical pattern of bits from the\
    \ device:\n\n![](img/175b89abfcdc9824337e5b1ac4bb1ef3_205_0.png)\n\nBy adding\
    \ some commands to toggle a line after the sample is taken can we see how the\
    \ timings work:\n\n![](img/175b89abfcdc9824337e5b1ac4bb1ef3_205_1.png)\n\nYou\
    \ might think that sampling so close to the rising edge of the timing pulse is\
    \ a bad idea, but the timing of the sample tends to drift longer not shorter and\
    \ this short reducing limits the error rate.\n\nFinally we need a function that\
    \ will read a byte. In the case of writing a byte, there is no criticality in\
    \ the time between reading bits so we don't need to take extra special care in\
    \ constructing the function:\n\n```\nint readByte(uint8_t pin) {\n  int byte =\
    \ 0;\n  int i;\n  for (i = 0; i < 8; i++) {\n    byte = byte | readBit(pin) <<\
    \ i;\n  }\n  return byte;\n}\n```\n\nThe only difficult part is to remember that\
    \ the 1-wire bus sends significant bit first and so this has to be shifted into\
    \ the result from the right."
