  md: "We can now run the pulse-generating program in core 3 after isolating it so\n\
    nothing else uses it:\n\n```\n#define _GNU_SOURCE\n#include <stdio.h>\n#include\
    \ <stdlib.h>\n#include <sched.h>\n#include <unistd.h>\n#include <bcm2835.h>\n\
    #include <stdio.h>\n```\n\n```\nint main(int argc, char **argv) {\n    cpu_set_t\
    \ cpuset;\n    CPU_ZERO(&cpuset);\n    CPU_SET(3, &cpuset);\n    int res = sched_setaffinity(getpid(),\
    \ sizeof(cpu_set_t), &cpuset);\n```\n\n```\nconst struct sched_param priority\
    \ = {1};\nsched_scheduler(0, SCHED_FIFO, &priority);\nif (!bcm2835_gpio_init())\n\
    \    return 1;\bcm2835_gpio_fsel(RPI_BPLUS_GPIO_J8_07, BCM2835_GPIO_FSEL_OUTP);\n\
    while (1) {\n    bcm2835_gpio_write(RPI_BPLUS_GPIO_J8_07, HIGH);\n    bcm2835_gpio_write(RPI_BPLUS_GPIO_J8_07,\
    \ LOW);\n}\nbcm2835_close();\nreturn 0;\n```\n\nNotice the use of the sched_affinity\
    \ to allocate the core to the current\nprocess. The result is that we still see\
    \ rescheduling interrupts every 10ms, but\nthese only last 8µs. The problem is\
    \ that we now have 50ms interrupts every\nsecond. If you take off the FIFO scheduling\
    \ then these disappear, proving\nthat things aren't simple."
