- img_proc: true
  md: "# # Polling For Data With Non-blocking\n\nAn alternative way of doing the same\
    \ job is to use a polling loop and read the data, a character at a time, without\
    \ blocking. The problem in this case is knowing when the block of data is complete.\
    \ You can do this by arranging for the sending device to indicate the number of\
    \ bytes to be transferred or by sending a flag byte to indicate the end of the\
    \ block. However it is done, you have to have some way of knowing that a block\
    \ is complete.\n\nIn this example, the end of the block is created by a mark by\
    \ null as if it was a string. The non-blocking read is created by setting c_cc[VTIME]=0\
    \ and c_cc[VMIN]=0, but you could do it another:\n\n```\n#define DEFAULT_SOURCE\n\
    #include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <unistd.h>\n\
    #include <fcntl.h>\n#include <termios.h>\n#include <errno.h>\n\nint main(int argc,\
    \ char **argv) {\n    system(\"sudo systemctl stop serial-getty@serial.service\"\
    );\n    int sfd = open(\"/dev/serial0\", O_RDWR | O_NOCTTY);\n    if (sfd == -1)\
    \ {\n        printf(\"Error no is : %d\\n\", errno);\n        printf(\"Error description\
    \ is : %s\\n\", strerror(errno));\n        return (-1);\n    }\n\n    struct options;\n\
