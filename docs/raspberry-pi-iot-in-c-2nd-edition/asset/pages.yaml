- img_proc: true
  md: "To use the serial port we have to open it as a file in the usual way. The only\
    \ thing that might be problematic is that you have to specify the device name\
    \ in place of a filename and this can change depending on how the UARTs are enabled.\n\
    \nTo open the serial port we use:\n\n```\n#include <unistd.h>\n#include <fcntl.h>\n\
    #include <termios.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include <errno.h>\n\
    #include <string.h>\n```\n\n```\nint main(int argc, char** argv) {\n    int sfd\
    \ = open(\"/dev/serial0\", O_RDWR | O_NOCTTY);\n    if (sfd == -1) {\n       \
    \ printf(\"Error no is : %d\\n\", errno);\n        printf(\"Error description\
    \ is : %s\\n\", strerror(errno));\n        return (-1);\n    }\n    return 0;\n\
    }\n```\n\nNotice the location of the device file, /dev/serial0, that we specify\
    \ it is opened for read and write, O_RDWR, the NOCTTY constant specifies that\
    \ the serial port should not kill the process if a Ctrl-C is received. If you\
    \ enabled one of the extras on the Pi 4 UART3 for example you can use /dev/ttyAMA1.\n\
    \nYou can open any serial port in this way but if you get a \"no such file or\
    \ directory\" error then the serial port you are trying to open is enabled.\n\n\
    The Linux driver does a lot of processing on the received data and as a result\
    \ there are lots of settings that go well beyond the basic baud rate, stop bits,\
    \ data bits and parity."
