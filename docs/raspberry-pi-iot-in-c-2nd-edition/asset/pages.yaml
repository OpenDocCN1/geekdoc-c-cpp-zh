- img_proc: true
  md: 'Then use the following commands:

    tar xvf bcm2835-1.xx.tar.gz

    cd bcm2835-1.xx

    ./configure

    make

    sudo make check

    sudo make install


    where xx is the version number, 68 at the moment. When these commands completed
    you will have a bcm2835-1.xx folder which contains copies of the library, the
    header file and all the source code.


    The library and header file that you are going to use will have been installed
    automatically. /usr/local/lib and /usr/local/include where NetBeans will find
    them automatically. Notice that NetBeans will find them even if you are using
    the Pi as a remote build host. You do not have to install the library on the machine
    running NetBeans, only on the build host.


    To use the library in your program to do two final things.


    First you have to include the header file:


    ```

    #include <bcm2835.h>

    ```


    This not ensures that NetBeans will find the header on the remote build host,
    it will also let you work with it as if it a file within the project.


    Second you have to specify the name of the library that you want the linker to
    add to your program. To do this right-click on the project and select properties.
    Select Build, Linker in the dialog box that appears, click the three dots in the
    Libraries section, click Add Library and specify bcm2835. Don''t make the mistake
    of trying to add a Library File.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_36_0.png)


    Now you don''t have to specify where the library is stored or its version number
    as NetBeans and GCC will work it out.


    Now you are ready to write your first IoT program which is nearly always to flash
    an LED – usually referred to as the “Blinky” program.'
  merge: -1
