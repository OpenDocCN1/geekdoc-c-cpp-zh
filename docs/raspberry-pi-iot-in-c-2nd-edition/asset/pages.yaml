  md: '# # Appendix I


    # # GPIO Sysfs Interface


    The GPIO sysfs Interface is the now deprecated and soon to be removed approach
    that Linux took to making the GPIO hardware available in user space. It should
    not be used for new projects, but it has been extensively used in the past that
    you might need some knowledge of how it works for some time to come. This appendix
    is a brief overview.


    Note: Only GPIO sysfs has been deprecated, the rest of sysfs is perfectly usable.


    # ## Working With Sysfs


    Sysfs is a virtual file system that provides all sorts of access to hardware and
    the operation of the Linux kernel. You can spend a lot of time exploring sysfs,
    but the part we are interested in here is the gpiopi folder. Sysfs is usually
    mounted in the sys folder and the folder corresponds to the GPIO device is usually:
    /sys/class/gpio


    To see what in the folder, list it:


    ```

    ls @raspberrypi: ls /sys/class/gpio

    export gpio10 gpichip0 export

    pi@raspberrypi: _

    ```


    The list includes the GPIO lines that are already in use by some process or other.
    Note that the gpio numbers are not external pin pins, but internal gpio numbers.
    For example, to use the GPIO line that is on physical pin 7 on the connector you
    need to refer to GPIO4.


    The steps in using a line are the same:


    +   1) Reserve or "export" the GPIO line so that no other process can use it

    2) Set its direction and read or write it

    3) Unregister it or export it


    You can do these steps from any language that supports file operations, including
    the shell.'
  merge: -1
  pgno: 384
- img_proc: true
  md: "you might ask why you have to \"export\" or reserve a GPIO line rather than\
    \ just use it? The answer is that the export operation will only work if the OS,\
    \ or some other process, hasn't claimed the GPIO line for its own use. You can\
    \ think of the export/un process as making sure that you don't misuse GPIO lines\
    \ and that you don't share them with other processes.\n\nTo reserve a GPIO line\
    \ you have to write its number to the export folder and you can do this using\
    \ the shell command. For example, assuming we want to work with GPIO 4:\n\n```\n\
    echo 4 > /sys/class/gpio/export\n```\n\nYou can course change 4 to any valid gpio\
    \ number.\n\nYou can do the same job in:\n\n```\n#include <stdio.h>\n#include\
    \ <string.h>\nint main(int argc, char** argv) {\n    int gpio = 4;\n    FILE*\
    \ fd = fopen(\"/sys/class/gpio/export\", \"w\");\n    fprintf(fd, \"%d\", gpio);\n\
    \    fclose(fd);\n    return 0;\n}\n```\n\nThe fopen function opens export for\
    \ write, the fprintf string prints the number of the gpio line and then the file\
    \ is closed with fclose. If you are not familiar with C file operations, see Fundamental\
    \ C: Getting Closer To The Machine, ISBN:978817962604, or at a more advanced level,\
    \ Applying C For The IoT With Linux, ISBN:978817962611.\n\nOnce you have the pin\
    \ reserved, you will see a gpio4 folder corresponding to it in /sys/class/gpio.\
    \ You can set it its direction and read or write it. To do you have to read from\
    \ or write to the appropriate subfolder of the gpio folder created.\n\nIf you\
    \ list all of the folders in raspberrypi: you will see:\n\n```\npi@raspberrypi:\
    \ ls /sys/class/gpio/gpio4\nactive low edge direction subsystem uevent value\n\
    pi@raspberrypi:\n```\n\nEach of these folders controls some aspect of the GPIO\
    \ line's functioning. The most important are direction, which the line can be\
    \ set to 0 or in out, and value, which can be set to 0 or 1 for output and 0 or\
    \ 1 for input. There is also active_low, which determines which the logic operates\
    \ and whether the line corresponds to a 1 or a 0.\n\n386"
  merge: -1
  pgno: 385
- img_proc: true
  md: "For example, to read GPIO 4 from the command line use:\necho \"in\" > /sys/class/gpio/gpio4/direction\n\
    cat /sys/class/gpio/gpio4/value\n\nand to set it as output to go high and then\
    \ low use:\necho \"out\" > /sys/class/gpio/gpio4/direction\necho 1 > /sys/class/gpio/gpio4/value\n\
    echo 0 > /sys/class/gpio/gpio4/value\n\nYou can do the same using C, but it is\
    \ slightly more verbose to the need to open and close files and build the appropriate\
    \ strategies.\n\n# ## Toggling A Line\n\nAs an example, consider the following\
    \ C program which sets GPIO 4 to output and then toggles it high and low as fast\
    \ as possible:\n\n```\n#include <stdio.h>\n#include <string.h>\n\nint main(int\
    \ argc, char** argv) {\n    int gpio = 4;\n    char buf[100];\n\n    FILE* fd\
    \ = fopen(\"/sys/class/gpio/export\", \"w\");\n    fprintf(fd, \"%d\", gpio);\n\
    \    fclose(fd);\n\n    sprintf(buf, \"/sys/class/gpio/gpio%d/direction\", gpio);\n\
    \    fd = fopen(buf, \"w\");\n    fprintf(fd, \"out\");\n    fclose(fd);\n\n \
    \   sprintf(buf, \"/sys/class/gpio/gpio%d/value\", gpio);\n    fd = fopen(buf,\
    \ \"w\");\n\n    for (;;) {\n        fd = fopen(buf, \"w\");\n        fprintf(fd,\
    \ \"1\");\n        fclose(fd);\n        fd = fopen(buf, \"w\");\n        fprintf(fd,\
    \ \"0\");\n        fclose(fd);\n    }\n    return 0;\n}\n```"
  merge: -1
  pgno: 386
- img_proc: true
  md: "The program exports gpio4 and then writes out to its direction folder to set\
    \ the line to output. After this the file value is open for writing and 1 and\
    \ 0 are written to the file repeatedly. Notice the use of sprintf to create strings\
    \ which incorporate the number of the gpio line you are using so that you can\
    \ open the correct folder.\n\nYou might be puzzled by the loop that opens the\
    \ file, writes a value and closes it. Why not just keep the file open? The reason\
    \ is that the file buffer isnt flushed unless the file is closed. This is the\
    \ usual way of dealing with the problem, but it is not very fast and it is part\
    \ of the reason that sysfs has a bad reputation.\n\nIf you try the program you\
    \ will discover that the pulse train has a frequency of around 4kHz and a pulse\
    \ width of 100µs on a Pi Zero and 18Khz and 28µs respectively on a Pi 4.\n\nWe\
    \ can, however, do much better by not closing the file every time we write to\
    \ it. Instead we can use fflush flush the file buffer by changing the loop to:\n\
    \n```\nfor (;) {\n    sprintf(fd, \"1\");\n    fflush(fd);\n    sprintf(fd, \"\
    0\");\n    fflush(fd);\n}\n```\n\nThe difference is quite amazing. Now, on a Pi\
    \ Zero, the frequency is 130Khz and the pulse width is 3.6µs and, on a Pi 4, 450Khz\
    \ and 1.1µs. This is still about 10 times slower than using the library, useful\
    \ for some applications. Sysfs GPIO may be obsolete, but it was simple and logical."
  merge: -1
