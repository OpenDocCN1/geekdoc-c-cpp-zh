- img_proc: true
  md: '# Preface


    This is the second edition of my book about IoT in C featuring the Raspberry Pi
    and things have changed a lot since the first edition. The Pi range has evolved
    and expanded over the time to provide both low-cost, almost disposable, device,
    the Pi Zero and a desktop replacement, the Pi 4. What has stayed the same is the
    way that the Pi has enabled a full Linux system to be used for hardware-oriented
    IoT applications. In the past most have opted for a microcontroller that didn''t
    run any sort of operating system, even the simplest of IoT devices can be a full
    Linux server if the need arises.


    This is a different way to think about physical computing, but it brings many
    challenges and the biggest is speed. You could say that this is always an issue,
    but getting a hardware task complete can mean trimming timings to the microsecond.
    To do this means working close to the hardware and there is no language better
    than this C. It may be an old language, but C is still at or number one in programming
    language rankings. It is worth learning and it isn''t difficult.


    The first problem any beginner at any programming project has to solve is what
    tools to.. In the case of programming the Pi things are initially easy that the
    GCC compiler is installed as standard. When it comes to an editor or IDE to help
    you write programs, things become more difficult. Ideally you need a remote development
    system running on a desktop machine which will download, build and run the program
    on a remote Pi. The only IDE that does the job properly is NetBeans, but this
    is in a state of flux moving from Oracle to Apache. This book still majors on
    NetBeans, but there is now an increasingly attractive alternative by way of Visual
    Studio Code. VS Code is slightly more difficult to set up, something that is covered
    in Appendix II, but works well once you are over that hurdle.


    I have also taken the opportunity to reorganize some of the material so that the
    introductory topics come before the more advanced ones. So only after dealing
    with simple GPIO output, do we look at simple input. Input is generally harder
    to program when you aren''t in control of when happen. The usual solution to this
    is to use events or interrupts. Linux doesn''t support user mode interrupts and
    to create something that behaves like an interrupt we need to look at the use
    of the new, character-mode, GPIO driver. In a later chapter the idea of using
    a finite state machine approach to input is described, which solves nearly all
    our problems without having to use interrupts.'
  merge: -1
  pgno: 2
- img_proc: true
  md: 'Moving on other forms of output, we explore Pulse Width Modulation (PWM) and
    what it can be used for – servos, music, LED control. The important topics of
    I2C, the serial port and the SPI bus are all covered in detail, including the
    new ports available on the Pi 4. A custom protocol is implemented to make use
    of the DHT22 temperature sensor and the very useful 1-wire bus is also implemented
    both as a custom protocol and using the serial port. As connecting with the web
    is key to the IoT, we look at how to use sockets to implement an HTML/2 server.
    We finally consider how things work at the very lowest level via memory accessing
    registers and how to make the best of Linux in a real-time system, including the
    relatively newly deadline scheduling.


    The main idea in this book is to work directly with the hardware. This approach
    frees you from dependence on the current Linux configuration and isolates you
    from the restrictions of the drivers. Perhaps more importantly, it ensures you
    understand what is going on and in complete control. Similarly, on the hardware
    side, no HATs or other off-the-shelf expansion boards are used. Simple and direct
    electronics are often all that is needed and finding out how to do it means that
    you can understand how the expansion boards do their job.


    This is not a projects book, although there isn''t much left for you to do round
    out the embryonic projects that are used as examples. Instead it is about understanding
    concepts and the acquisition of skills. The hope is that by the end of the book
    you will know how to tackle your own projects and get them safely to completion
    without wasting time in trial and error.


    Thanks to my tireless editors Sue Gee and Kay Ewbank. I may know what a comma
    is for in C, but my understanding of its role in natural language is severely
    limited. Errors remain, and I hope they are few, mine.


    For updates, errata, links to resources and the source code for the programs in
    this book, visit its dedicated page on the IO Press website: iopress.info. You
    can also contact me at harry.fairhead@i-programmer.info.


    Harry Fairhead

    September, 2020'
