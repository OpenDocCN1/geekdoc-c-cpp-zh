  md: 'The BCM 2835 GPIO hardware has a very sophisticated and impressive list of
    conditions that you can set to trigger an event. These are all made available
    via the BCM 2835 library as a group of set and clear functions. While we cannot
    use these to implement an interrupt we can use them to make detecting changes
    in the state of a GPIO line much easier. All that happens is the hardware sets
    a status bit when the specified event occurs and this happens without the intervention
    of the software. The setting of the flag can also generate an interrupt and, in
    an ideal world, we would be able to write an interrupt handler for this, but you
    can''t do this in user mode so we are restricted to polling for changes in the
    state of the flag.


    There are four groups of functions that work with any of high, low, rising edge
    detection:


    +   * High Detect

    ```

    void bcm2835_gpio_hen(uint8_t pin)

    void bcm2835_gpio_clr_hen(uint8_t pin)

    ```


    +   * Low Detect

    ```

    void bcm2835_gpio_len(uint8_t pin)

    void bcm2835_gpio_clr_len(uint8_t pin)

    ```


    +   * Falling Edge Detect

    ```

    void bcm2835_gpio_fen(uint8_t pin)

    void bcm2835_gpio_clr_fen(uint8_t pin)

    ```


    +   * Rising Edge Detect

    ```

    void bcm2835_gpio_ren(uint8_t pin)

    void bcm2835_gpio_clr_ren(uint8_t pin)

    ```


    The first function of each pair enables the event and the disables it. You can
    set both rising and falling edge detection so to enable all edges. Notice that
    these are hardware settings, they will persist between runs.


    It is obvious that the rising and falling events occur when the input changes
    from low to high and high to low respectively, but when do the high and low level
    events occur? The answer is that a high or low level event is triggered as soon
    as the line is high or low and is enabled. This means that you could trigger the
    event as soon as you enable it, if the line is already high or low. The event
    also stays as long as the high or low status persists and trying to reset it has
    no effect. In practice, edge detection is usually more useful.'
  merge: -1
  pgno: 114
- img_proc: true
  md: 'There are also two groups that work with an asynchronous version of rising
    and falling edge detection. These are simply faster versions of the previous two:


    # Asynchronous Falling Edge Detect


    ```

    void bcm2835_gpio_afen(uint8_t pin)

    void bcm2835_gpio_clr_afen(uint8_t pin)

    ```


    # Asynchronous Rising Edge Detect


    ```

    void bcm2835_gpio_aren(uint8_t pin)

    void bcm2835_gpio_clr_aren(uint8_t pin)

    ```


    It is worth explaining thatht the asynchronous versions may be faster but they
    are not "debounced". The difference between the two is that the first set of functions
    gates the inputs with the system clock limiting the rate that the line can change.
    Only use the asynchronous versions if you really have to.


    Each of these events, if set and triggered, set bits in an event detection register.
    The setting of these status bits can also be set to cause an interrupt, but as
    already mentioned there is no way of directly handling an interrupt in user mode
    and they have to be explicitly disabled.


    The functions that you test the status bits are:


    # Return or clear a specific bit


    ```

    uint8_t bcm2835_gpio_eds(uint8_t pin)

    void bcm2835_gpio_set_eds(uint8_t pin)

    ```


    # Return or clear a set of bits using a mask


    ```

    uint32_t bcm2835_gpio_eds_multi(uint32_t mask)

    void bcm2835_gpio_set_eds_multi(uint32_t mask)

    ```


    The first function of the pair returns one if the bit is set and zero otherwise.
    Despite it having "set" in its name, the second clears the status bit.


    Notice that after an event has been detected you have to clear the status bit
    for the event to be detected again. As already mentioned, clearing bits for high
    or low events only works if respectively. If you clear the high bit and the line
    is already high then it is immediately set again, and similarly for the low bit,
    and this can cause a system crash. Avoid such level events if you can.


    You can set multiple events on pins at the same time and you can test the all
    of the event bits using the multi version of the functions.'
  merge: -1
  pgno: 115
- img_proc: true
  md: 'Putting all this together, the steps in using events are:


    +   1. Set the line to be an input e.g.


    bcm2835_gpio_fsel(RPI_BPLUS_GPIO_J8_07,

    BCM2835_GPIO_FSEL_INPT);


    +   2. Select which type of event you want to enable e.g

    bcm2835_gpio_ren(RPI_BPLUS_GPIO_J8_07);

    enabling rising edge.


    +   3. Clear the event bit e.g.

    bcm2835_gpio_set_eds(RPI_BPLUS_GPIO_J8_07);


    +   4. After this you can do something and eventually read the status bit

    to see it e.g.

    bcm2835_gpio_eds(RPI_BPLUS_GPIO_J8_07);

    returns one if the event occurred.


    +   5. Reset the event bit to detect another event e.g.

    bcm2835_gpio_set_eds(RPI_BPLUS_GPIO_J8_07);


    # Measuring Pulses With Events


    We have all of the functions we need to implement a pulse measurement

    program using events. In this case we can measure the width of any pulse

    the distance between a rising and a falling edge or a falling and a rising edge.

    The difference between this and the previous program that measured

    width of a pulse is now that we are using the hardware to detect the state

    transitions, it "edges" of the signal.


    To do this we need to set the rising and falling edge detection for the pin:

    bcm2835_gpio_fsel(RPI_BPLUS_GPIO_J8_07, BCM2835_GPIO_FSEL_INPT);

    bcm2835_gpio_fen(RPI_BPLUS_GPIO_J8_07);

    bcm2835_gpio_ren(RPI_BPLUS_GPIO_J8_07);


    Now Pin 7 will trigger an edge event if it goes from low to high or to

    low. So now all we have to do is test the status register for the event and clear

    it after it has been detected.'
