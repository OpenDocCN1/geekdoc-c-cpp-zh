    };\n```\n\nThe task will be repeated every two seconds and can be up to 11ms late.\n\
    The thread function is simply:\n\n```\nsched_setattr(0, &attr, 0);\nfor (;;) {\n\
    \    printf(\"sensor\\n\");\n    fflush(0);\n    sched_yield();\n}\n```\n\nNotice\
    \ that, after we set the scheduling policy, the thread simply loops printing the\
