  md: "# SPI6 – An Example\n\nThe BCM 2835 library wasn't written to work with the\
    \ BCM2711 used in the Pi 4 – its name gives this away. However, the differences\
    \ between the two devices are very small and it really only the additions to the\
    \ hardware we need to worry about. For example, the Pi 4 has six SPI interfaces,\
    \ but the BCM 2835 library only works with the original found in the Pi Zero and\
    \ Pi 3. However, making a change to the library to gain access to one of the other\
    \ SPI interfaces is very easy.\n\nThe documentation gives the base addresses:\n\
    \n| SPI0 | 0x7E20 4000 |\n| SPI3 | 0x7E20 4600 |\n| SPI4 | 0x7E20 4800 |\n| SPI5\
    \ | 007E20 4A00 |\n| SPI6 | 0x7E20 4C00 |\n\nCurrently the SPI functions use all\
    \ 0x2E0400 as the offset for the SPI0 interface. Apart from using different GPIO\
    \ lines and having a different base offset, the SPI register offsets are the same\
    \ for all the interfaces. This means that by changing the base offset you can\
    \ make the SPI functions work with any of the SPI interfaces.\n\nWe can add the\
    \ bcm2835_spi6_begin function, which sets up the GPIO lines and sets bcm2835_spi0\
    \ to a new value, saving the restored later.\n\n```\n#define BCM2835_SPI6_BASE\
    \ 0x20C400\nvolatile uint32_t *bcm2835_spi0LD;\n\nint bcm2835_spi6_begin(void)\
    \ {\n    volatile uint32_t *paddr;\n    bcm2835_spi0ld=bcm2835_spi0;\n    bcm2835_spi0\
    \ = bcm2835_peripherals + BCM2835_SPI6_BASE / 4;\n    bcm2835_gpio_fsel(27, BCM2835_GPIO_FSEL3);\
    \ /* CE1 * /;\n    bcm2835_gpio_fsel(18, BCM2835_GPIO_FSEL3); /* CE2 * /;\n  \
    \  bcm2835_gpio_fsel(19, BCM2835_GPIO_FSEL3); /* MISO * /;\n    bcm2835_gpio_fsel(20,\
    \ BCM2835_GPIO_FSEL3); /* MOSI * /;\n    bcm2835_gpio_fsel(21, BCM2835_GPIO_FSEL3);\
    \ /* CLK * /;\n\n    paddr = bcm2835_spi0 + BCM2835_GPIO_CS / 4;\n    bcm2835_peri_write(paddr,\
    \ 0); /* All 0s * /;\n    bcm2835_peri_write_nb(paddr,BCM2835_SPI0_CS_CLEAR);\n\
    \    return 1;\n}\n```"
  merge: -1
