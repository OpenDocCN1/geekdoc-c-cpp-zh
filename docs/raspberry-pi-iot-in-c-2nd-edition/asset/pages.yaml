- img_proc: true
  md: '# Reading Humidity


    The nice thing about I2C and using a particular I2C device is that it gets easier.
    Once you have seen how to do it with once the skill generalizes and, once you
    know how to deal with a particular device, other aspects of the device are usually
    similar.


    While clock stretching is simple it sometimes doesn''t work with some slave and
    master combinations. It is worth knowing how the alternative method works. For
    this reason let''s implement the reading using polling. We also find out how to
    use the No Hold master mode of reading the data which is sometimes useful.


    In this case we can''t use the read_register_ns command to read the slave because
    we don''t want to keep sending the 0xF5 command. We write once to the slave and
    repeatedly read the three-byte response. If the slave isn''t ready it replies
    with a NACK.


    ```

    buf[0] = 0xF5;

    bcm2835 i2c write(buf, 1);

    while (bcm2835_i2c read(buf, 3) == BCM2835_I2C_REASON_ERROR_NACK) {

    bcm2835 delayMicroseconds(500);

    };

    ```


    This polls repeatedly until the slave device returns an ACK, when the data is
    loaded into the buffer.


    Once we have the data, the formula to convert the 16-bit value to percentage humidity
    is:


    ```

    RH = -6 + 125 * data16 / 216

    ```


    Putting all this together, and reusing variables from the previous parts of the
    program, we have:


    ```

    buf[0] = 0xF5;

    bcm2835 i2c write(buf, 1);

    while (bcm2835_i2c read(buf, 3) == BCM2835_I2C_REASON_ERROR_NACK) {

    bcm2835 delayMicroseconds(500);

    };

    msb = buf[0];

    lsb = buf[1];

    check = buf[2];

    printf("% %d \n\r lsb %d \n\r checksum %d \n\r", msb, lsb, check);

    printf("crc = %d\n\r", crccheck(msb, lsb, check));

    data16 = ((unsigned int) msb << 8) | (unsigned int) (lsb & 0FC);

    float hum = -6 + (125.0 * (float) data16 / 65536);

    printf("Humidity is %f \n\r", hum);

    bcm2835 i2c end();

    ```


    The only unusual part of the program is using %% to print a single % character,
    which is necessary because % means something in printf. We also need to implement
    the crcCheck function.'
  merge: -1
  pgno: 181
- img_proc: true
  md: "# Checksum Calculation\n\nAlthough computing a checksum isn't specific to I2C,\
    \ it is another common task. The datasheet explains that the polynomial used is:\n\
    \n$X^8+X^2+X+1$\n\nOnce you have this information you can work out the divisor\
    \ by writing a binary number with a one in each location corresponding to a power\
    \ of X in the polynomial. In this case the 8th, 5th, 4th and 1st bit. Hence the\
    \ divisor is:\n\n0x0131\n\nWhat you do next is roughly the same for all CRCs.\
    \ First you put the data that was used to compute the checksum together with the\
    \ checksum value as the low-order bits:\n\n```\nuint32_t data32 = ((uint32_t)msb\
    \ << 16) |\n  (uint32_t) lsb << |\n  (uint32_t) check;\n```\n\n```\nuint32_t divisor\
    \ = ((uint32_t) 0x0131) <<15;\n```\n\nNow that you have the data and the divisor\
    \ aligned, you step through the top-16 bits, i.e., if you don't process the lower-order\
    \ bits which hold the received checksum. For each bit you check to see if it is\
    \ a 1. If it is to replace the data with the data XOR divisor. In either case\
    \ you shift the divisor one to the right:\n\n```\nfor (int i = 0; i < 16; i++))\n\
    \  if(data32 & (uint32_t)1<<(23 - i ))\n    data32=data32 ^ divisor;\n    divisor>>=\
    \ 1;\n;\n```\n\nWhen the loop ends, if there was no error, the data32 should be\
    \ zeroed and the received checksum is computed and returned as the data.\nA complete\
    \ function to compute the checksum, with some optimization, is:\nuint_t crcCheck(uint8_t\
    \ msb, uint8_t lsb, uint8_t check)\nuint32_t data32 = ((uint32_t)msb << 16)|((uint32_t)\
    \ lsb <<)|\n  (uint32_t) check;\n\n```\nuint32_t divisor = 0x988000;\nfor (int\
    \ i = 0; i < 16; i++))\n  if(data32 & (uint32_t)1<<(23 - i )) data32 ^= divisor;\n\
    \  divisor>>= 1;\n}\nreturn (uint8_t) data32;\n```\n\nIt is rare to get a crc\
    \ error on an I2C bus unless it is overloaded or subject to\nlot of noise."
