    # # Blocking Versus Non-blocking


    This use of completely non-blocking reads is the typical way that serial port
    communication is handled. This is mostly because the range of behavior that you
    can program using blocking reads isn''t properly appreciated. You just have a
    choice of blocking versus non-blocking. You can set a timeout between characters
    and a minimum number of characters to wait for and a maximum to return. When you
    don''t know how much data is going to be sent, only an upper limit to a block
    of data, then blocking are simpler and preferable, as long as you set a timeout
    and a minimum character size.

    Notice that a blocking read doesn''t load the processor because it is suspended
    while the driver waits for data. A polling read, on the other hand, occupies a
    single core 100% of the time, but it can be doing things as well as checking for
    data. If there isn''t enough to do in the polling loop, then a nanosleep call,
    see Chapter 3, will give the processor back to the operating system and reduce
    the loading. However, using 100% of a core doesn''t matter so much if you have
    other cores to keep the system working and it doesn''t matter at all if you''ve
    got anything else for the core.

    In more complicated situations you may need to use a separate thread to poll or
    wait for blocked calls, but this isn''t necessary as you might think. Neither
    is the use of software interrupt to service incoming data, as most transactions
    use a command-response approach.


