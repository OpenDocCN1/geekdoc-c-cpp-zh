- img_proc: true
  md: '# Setting Up


    The default settings often work for a loopback test


    The key to setting any parameters of any device that is being treated as a file,
    or indeed any file, is to use the ioctl function. This is low level and for the
    serial device it is easier and more common to use termmios which in turn uses
    the ioctl function to get the job done.


    To use termios to configure the serial port we simply fill in the details in a


    struct termios options;


    You can look up all of the many possible settings for the struct''s fields. There
    are also a number of fields that can be set, although most of the time you only
    have to work with a few options:


    | Member | Description |

    | --- | --- |

    | c_cflag | Control options |

    | c_lflag | Line options |

    | c_iflag | Input options |

    | c_oflag | Output options |

    | c_cc | Control characters |

    | c_speed | Input baud (new interface) |

    | c_ospeed | Output baud (new interface) |


    The most common is to set the basic operation of the UART using the

    c_cflag.


    # Baud rate


    To set the baud rate you can use the functions:

    cfsetpeed(&options speed); //for output speed

    cfsetpeed(&options speed); //for input speed


    where speed is one:


    ```

    B0 B50 B75 B110 B134 B150 B200 B300 B600 B1200 B1800

    B2400 B4800 B9600 B19200 B38400 B57600 B115200 B230400

    ```


    There is also a single speed setting function:


    cfsetpeed(&options speed);'
  merge: -1
  pgno: 266
- img_proc: true
  md: 'The reason you use a function and not simply set the relevant bits is that
    the way the baud rate is set in different systems varies and the functions cover
    up the differences. Notice that most UARTs can only work at the same speed for
    input and output and you should set both to the same value unless you know better.


    # Data Bits


    To set the number of data bits you have to directly set a bit mask using CSIZE
    and values CS5, CS6, CS7, or CS8.


    For example:


    ```

    options.c_cflag &= CSIZE;

    options.c_cflag |= CS7;

    ```


    sets the number of data bits to 7. What is going on here is not hard to understand
    once you realize that CS constants are multibit settings. So you first AND a bitmask
    with the current value to zero the bits in question, then you OR the new value
    you want.


    # Parity


    You can set parity by directly setting the bits that it controls.


    For example:


    ```

    options.c_cflag |= PARENB

    options.c_cflag |= PARODD

    ```


    enables parity and sets it to odd. Notice that PARODD and PARENB are single bit
    settings, you don''t have to use a bit mask to zero the location first, just OR
    the set bit with the value and it''s done. To set the opposite of a single flag,
    i.e. to zero the bit in cflag you simply AND its NOT. That is, you can use & =
    ~ PARODD to set even parity and & = ~ PARENB to set no parity, i.e. to disable
    parity.


    # Stop Bits


    The default is one stop bit. If you want to set two then you use:


    ```

    options.c_cflag |= CSTOPB

    ```


    or & = ~ CSTOPB if you want to explicitly clear the stop field to set one stop
    bit.


    There are also two bits we have to set in normal operation:


    ```

    options.c_cflag |= CLOCAL

    options.c_cflag |= CREAD;

    ```


    The first ignores modem control lines and the second enables the read operation.
    The only other part of the struct that we generally need to modify is the c_lflag
    to set local options.'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# Raw Mode


    There are two ways the driver handles input, canonical and raw. In canonical mode
    it works a line at a time, waiting until there is a full line of text, signaled
    by a carriage return or a line feed, before being sent. In raw mode characters
    are passed through as they arrive and they are not processed in any way. For device-to-device
    communications raw is the mode you want to use. In addition, you generally want
    to stop any echo of input to output. You can also opt to handle the software interrupts,
    the signals that the serial port generates - usually you don''t want to.


    To set raw mode with no echo and no signals you use:

    options.c_lflag &= ~(ICANON | ECHO | ECHOE | ISIGN);


    Notice that the flags are all single-bit they can be ORed together and applied
    in a single operation. You can do this with other single-bit flags to simplify
    setting options.


    There is a similar setting for raw output:

    options.c_oflag |= OPOST;


    A simpler way of setting all options so that you have raw mode and output is to
    use the function:

    cfmaker(pointer to termios);


    This sets the following options:

    c_iflag &= ~(IGNBRK | BRKINT | PARMRK | ISTRIP | INCLR | IGNCR | ICNL | IXON);


    ```

    c_oflag &= ~OPOST

    c_iflag &= ~(ECHO | ECHONL | ICANON | ISIG | IEXTEN)

    c_cflag &= ~(SIZE | PARENB)

    c_cflag |= C58;

    ```


    The final problem is that we also need to fill in values for all of the other
    fields in the terminus struct and mostly we are not interested in them. The standard
    technique is to first fill the terminus struct with the current values set on
    the serial port and then simply modify the ones of interest.


    The function:

    tgetattr(filedescriptor,pointer to termios)


    will fill the struct with the current values corresponding to the serial port
    specified by the file descriptor.


    The function:

    tsetattr(filedescriptor,when,pointer to termios)


    does the reverse job and stores the values back in the device.'
  merge: -1
  pgno: 268
- img_proc: true
  md: 'There is one last matter to be cleared up. When you change the configuration
    of the serial port it might already be in the middle of sending or receiving some
    data. You need to specify when you want the changes to take effect. This is what
    the parameter specifies and you can usually set it to TCSANOW for an immediate
    change.


    So our standard algorithm is to get the attributes, modify the ones we want to
    and set the attributes back in the device. For example, to set raw mode, no echo,
    with 8n1 at 9600 baud, you would use:


    ```

    struct termios options;

    tcgetattr(sfd, &options)

    cfsetspeed(&options, cflag, B9600)

    options.c cflag &= ~CSTOPB

    options.c cflag |= CLOCAL

    options.c cflag |= CREAD

    cmakeraw(&options)

    tcsetattr(sfd, TCSANOW, &options);

    ```


    If this program doesn''t work, and you can''t set the parameters of the serial
    port, the reason is usually Linux has not relinquished control of the port as
    a console.


    # Utility Functions


    There are some utility functions you need to know about:


    +   - tcdrain(filescriptor); waits until all of the data that has been written
    has been sent. The Linux UART driver will accept large amounts of data and send
    it for you your program gets on something else and this is true even in blocking
    mode. If you need to wait before sending any more data or reading response is
    the way to do it.


    +   - tcflush(filescriptor, action) discards data written to the object referred
    to by the file descriptor not transmitted, or data received but not read, depending
    on the value of action.


    TCIFLUSH flushes data received but not read

    TCOFLUSH flushes data written but not transmitted

    TCIOFLUSH flushes all data waiting to be processed'
  merge: -1
  pgno: 269
- img_proc: true
  md: 'tcsendbreak(filesdescriptor, duration)

    transmits a continuous stream of zero-valued bits for a specific duration. A break
    is an "out of band" transmission needed to signal special conditions like a hard
    reset to some devices. It doesn''t correspond to any transmitted character because
    it is out of specification for the number of bits, stop bit and parity specified.
    The line is simply held low for a given time. If duration is zero, it transmits
    zero-valued bits for at least 0.25 seconds, and not more than 0.5 seconds. If
    duration is not zero, it sends zero-valued bits for some implementation-defined
    length of time.


    # Sending Data


    We have already used the write function without really discussing it in its simplest
    form.


    You can use the standard file descriptor writing function to send data:

    write(fd, buffer, len)

    w len bytes of buffer to the file specified by the file descriptor, fd.

    What is less well known is that you can also use d, which is the file descriptor
    version of printf to write to the file descriptor and has been a Posix standard
    since 2008:


    ```

    dprintf(filesdescriptor, formatstring, variablelist)

    ```


    For example:


    ```

    char buf[] = "hello world"

    int count = write(sfd, buf, 11);

    ```


    can be written:


    ```

    char buf[] = "hello world"

    dprintf(sfd, "%s", buf);

    ```


    The printf function is very useful when you need to send the value of a numeric
    variable to a device over the serial connection. It works on most systems, including
    the Pi.


    For example:


    ```

    int total=100;

    dprintf(sfd, "%d\n\r", total):

    ```


    sends 100 followed by a newline and carriage return.


    There is also the subtle point of when the writing functions return control to
    your program. It is usually said that writing data to a serial port is either'
  merge: -1
  pgno: 270
- img_proc: true
  md: '“blocking”, i.e. it only returns when all the data written, or “non-blocking”,
    i.e. it returns at once. In fact, the Linux device driver effectively implements
    a 4096-byte buffer in raw mode, there is little difference between the two modes
    for writing data in most cases.


    Non-blocking mode can be set by opening the file using O_NONBLOCK in the open.
    That is, following:

    int sfd = open("/dev/serial0", O_RDWR | O_NOCTTY|O_NONBLOCK );

    if you select blocking raw mode then, as the data you are writing is less than
    4096 bytes and the buffer is, the call to write returns immediately, even most
    of the bytes still have to be transmitted.


    If you need to wait for all of the data to be sent then use:

    tcdrain(filedescriptor);

    in non-blocking raw mode, discussed in the next section, the same thing happens
    when you write data. In short, the write is to a buffer the difference between
    blocking and non-blocking mode for write isn''t important. In both cases, a write
    can return before the data has actually been transmitted.


    However, reading data is quite different.


    # Reading Data


    When programming a serial connection it is reading the data that usually causes
    the most difficulty. Sending data is easy because you just send the data and the
    device on the other end has the problem of processing it. Receiving data, by contrast,
    requires you to know that there is some data to receive. In short, the problem
    is finding out when the other device has something to process. This is exactly
    the same as for GPIO - output is easy and input is hard.


    It is often said that there are two modes – blocking and non-blocking - when it
    comes to a serial read. In fact the situation is much more complicated. There
    are in four possible ways that a serial read can behave, controlled by two parameters
    in the termios struct:


    ```

    c_cc[VTIME]

    c_cc[VMIN]

    ```


    Roughly speaking, VTIME sets how long to wait, i.e. the timeout, and VMIN sets
    the minimum number of characters before the call is considered satisfied. Note
    that both parameters are single-byte variables so the maximum value you can set
    is 255 characters for VMIN or 25.5 seconds for VTIME.'
  merge: -1
  pgno: 271
- img_proc: true
  md: 'To understand how these work you have to keep in mind that the Linux serial
    driver will read data from the serial port as it becomes ready and store it in
    a fairly large buffer, irrespective of what your programming is doing. So when
    you go to read the serial port there might well be data waiting to be read.


    The read call specifies the number of bytes to read, but this doesn''t determine
    what happens when there aren''t enough bytes in the buffer to satisfy the read.

    That is, if you:

    read(sfd buf 10);


    then if there are more than 10 bytes in the serial buffer the call returns at
    once with 10 bytes - leaving the rest in the buffer for future reads. In other
    words, the byte count you specify in read determines what happens when there are
    more than number of bytes in the buffer. It is the maximum number of bytes that
    will be.


    The question is, what happens if there aren''t enough bytes in the buffer? The
    answer depends on the settings of c_cc[VTIME] and c_cc[VMIN]


    +   * c_cc[VTIME] = 0 and c_cc[VMIN] > 0

    VMIN sets the number of characters to receive before the read is satisfied. There
    is no timeout and the call will wait if the number of characters is never received.
    The default is:

    c_cc[VTIME] = 0 and c_cc[VMIN] = 1

    and this is usually called a blocking read.


    +   * c_cc[VTIME] > 0 and c_cc[VMIN] = 0

    The read will be satisfied if a single character is available to read. There is
    no character to read then the call will wait for the specified time in tenths
    of a second.


    +   * c_cc[VTIME] > 0 and c_cc[VMIN] > 0

    Now the time is an inter-character timer. The call waits for at least the number
    of characters to be received but will return if the time between characters exceeds
    the timeout. The timer is reset each time a character is received. It is very
    important to note that the timer is only started after the first character is
    received and this means that the call can block forever if no characters are received.


    +   c_cc[VTIME] = 0 and c_cc[VMIN] = 0

    The will be satisfied immediately. The number of characters currently available
    or the number of characters requested will be returned. This is usually referred
    as a non-blocking call and it is the way to set up one after the serial port has
    been opened.'
  merge: -1
  pgno: 272
- img_proc: true
  md: 'To summarize, the number of bytes you specify in the read function sets the
    maximum number of bytes that will be read. The actual number of bytes read is
    returned by the read function. c_cc[VMIN] sets the minimum number of bytes that
    will satisfy the read function and c_cc[VTIME] sets the timeout for each character
    to be received.


    ```

    options.c_cc[VTIME] = 10;

    options.c_cc[VMIN] = 5;

    ```


    will cause the read function to return when five characters have been received
    or when one second has elapsed between characters being received. As already mentioned,
    i.e. there is no overall timeout.


    You can now see that there isn''t just a blocking and a non-blocking mode. You
    can adjust the time that the read waits and how many characters are required before
    it returns. The setting:


    ```

    options.c_cc[VTIME] = 0;

    options.c_cc[VMIN] = 1;

    ```


    corresponds to what is usually called a blocking call because the read will wait
    for any amount of time until at least one character is ready to read and the setting:


    ```

    options.c_cc[VTIME] = 0;

    options.c_cc[VMIN] = 0;

    ```


    corresponds to what is called a non-blocking read because it returns at once,
    with no overall timeout.


    The configuration c_cc[VTIME]>0 and c_cc[VMIN]=0, which will wait for least c_cc[VMIN]
    with a timeout of c_cc[VTIME] characters is useful because it corresponds to reading
    a burst of data. The device being read is assumed to send a block of data and
    then fall silent for a period. However, the block is detected by the inter-character
    timeout. However, there is a problem in that if there is no overall timeout. So
    you could wait forever if the device doesn''t send any data at all. It only needs
    to send one character to the timeout, but if this doesn''t happen you don''t recognize
    that no block is sent. The solution to this problem is to start a read until at
    least one character is available in the buffer.


    To discover how many characters are in the buffer we need to use the lowerlevel
    ioctl function. The FIONREAD command will return the number of characters waiting:


    ```

    #include <sys/ioctl.h>

    int bytes;

    ioctl(sfd, FIONREAD, &bytes);

    ```'
