  md: "Another common problem is the degree to which the standards are vague.\nexample,\
    \ in principle you should not encounter a situation where an accept occurs followed\
    \ by a read of zero data, but it happens. If you are using blocking sockets, then\
    \ the read will hang forever waiting for the data. This is a common cause of otherwise\
    \ well-behaved programs hanging at seemingly random times. The solution is to\
    \ set a timeout and test for zero bytes by data:\n\n```\nstruct timeval tv = (1,\
    \ 0);\nif (setsockopt(sockfd, SOL_SOCKET, SO_RCVTIMEO, &tv, sizeof(tv)) < 0) {\n\
    \    printf(\"Option error\");\n    printf(\"The error message is: %s\\n\", strerror(errno));\n\
    };\n```\n\n# # What About Security?\n\nIf you need to exchange encrypted data\
    \ then you need to use HTTPS and this is generally too difficult to implement\
    \ from scratch. The best solution, however is still not to use a general web server\
    \ such as Apache, but to use an HTTP is still not to use a general library such\
    \ as LibHTTP which provides functions to implement HTTP and HTTPS servers. An\
    \ alternative is to use encryption functions to encrypt the data that you send\
    \ using HTTP. The GNU library has standard functions for passwords, hash functions\
    \ and DES encryption.\n\nThe main advantage of not using a server or a library\
    \ is that you can keep things so simple that they are obviously secure. If you\
    \ don't need encryption then you can use a remote sensor so that it only sends\
    \ sensor data in response to any HTTP request and an attacker has no way of making\
    \ inroads into your server. It doesn't matter what the attacker requests they\
    \ always get the same data packet. You can also setup a list of IP addresses that\
    \ are allowed to connect to your server – not so easy or useful if the clients\
    \ use dynamic IP addresses. In addition, using sockets you are free to abandon\
    \ HTTP and use your own protocol which arguably makes yours secure but this takes\
    \ us into the controversial subject of security by obscurity."
