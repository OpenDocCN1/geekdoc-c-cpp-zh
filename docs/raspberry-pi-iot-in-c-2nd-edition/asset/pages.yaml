  md: '# Chapter 13

    Using iButtons


    If you haven''t already discovered iButtons then you are about to find lots of
    uses for them. At its simplest, an iButton is an electronic key providing a unique
    code stored in its ROM, which can be used to unlock, or simply record, the presence
    of a particular button. The good news is that they are easy to interface to a
    Pi.


    A basic iButton is a small disc that can be placed into a simple contact reader.
    Often it is placed in a fob that makes it possible to keep on a key ring:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_208_0.png)


    A typical reader is just a two-contact receptacle:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_208_1.png)


    iButtons are cheap and robust and they are easy to use, as long as you have some
    1-wire software.


    You can get very simple iButtons that store a unique serial number for a few dollars.
    These are suitable for security applications. You could design a reader to open
    a door, arm an alarm, or record comings and goings. The main advantage of ib over
    swipecards and similar id devices is that they are almost indestructible. The
    small stainless steel is tough and waterproof.


    There are also more sophisticated iButtons that come with sensors and data loggers.
    These are more expensive and slightly more difficult to read, but after you have
    seen how to work with the basic security button there should be no problem in
    extending the software.'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# The Hardware


    A typical iButton is used in parasitic mode, meaning it derives its operating
    power from the data line and has such a low current drain that you don''t to do
    anything to make it work properly. All that is needed is a pull-up resistor, typically
    2.2kΩ, a 3.3V supply, a ground and a GPIO line, pin 7 in this example, but it
    could be any other you care to use.


    The circuit really couldn''t be simpler:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_209_0.png)


    You can realize this in many ways. A prototype board allows you to check things
    that are working with a logic analyzer, but you can wire it directly to the Pi''s
    connector.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_209_1.png)'
