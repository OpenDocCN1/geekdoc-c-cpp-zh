- img_proc: true
  md: "In fact the only thing we need to record is the current bit position in a local,\
    \ rather than a static, variable, bitposition:\nint bitposition = bitcount;\n\
    bitcount++;\noneWireScan(pin,serial);\n\nNow when the oneWireScan returns, bitposition\
    \ holds the number of the bit that it was working on before the call. We can restore\
    \ bitcount and start a completely new scan:\n\n```\nbitcount = bitposition;\n\
    if (presence(pin) == 1){\n    bitposition=0;\n    return 0;\n}\nwriteByte(pin,0xF0);\n\
    ```\n\nThis starts us at bit zero of the scan, but to restore the state we want\
    \ to be at the bit position stored in bitposition. If you think about it, the\
    \ bits of the next number up to bitposition are going to be the same as the retrieved\
    \ serial number, So we can retrieve the first part of the serial number from the\
    \ previous serial number. The difference is that the last bit that we isn't going\
    \ to be a 0. It now needs to be a 1 to take down the next branch of the tree.\
    \ We can do this in one:\n\n```\nuint64_t temp = serial[deviceCount - 1] | (0x1LL\
    \ << (bitcount));\n\nint i;\nuint64_t bit;\nfor (i = 0; i < bitcount+1; i++) {\n\
    \    bit = temp & 0x01LL;\n    b1 = readBit(pin);\n    b2 = readBit(pin);\n  \
    \  writeBit(pin, bit);\n    serial[deviceCount] >>= 1;\n    serial[deviceCount]\
    \ |= (bit << 63);\n}\n```\n\nThe hardware is now restored to its state just before\
    \ the first call to oneWireScan and we have a 1 in place of the 0 for the current\
    \ bit. We can now call oneWireScan again to explore the alternative branch of\
    \ the tree:\n\n```\nbitcount++;\noneWireScan(pin,serial);\n}\n```\n\nThat's the\
    \ final step for a recursive scan of the 1-wire bus."
