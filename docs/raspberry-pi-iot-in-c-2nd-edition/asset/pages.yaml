- img_proc: true
  md: 'The serial protocol is also fairly simple:


    +   1. The host pulls the line low for between 0.8ms and 29ms, usually 1ms.


    +   2. It then releases the bus which is pulled high.


    +   3. After between 20$\mu s$ and 20$\mu s$, usually 30$\mu s$, the device starts
    to send data by pulling the line down for around 80$\mu s$ and then lets it float
    high for another 80$\mu s$.


    +   4. Next 40 bits of data are sent using 70$\mu s$ high for 1$\mu s$ and a 26$\mu
    s$ high for 0 with the high pulses separated by around 50$\mu s$ periods.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_188_0.png)


    What we have to do is pull the line low for 1ms or to start the device sending
    data and this is very easy. Then we have to wait and let it pull up again for
    about 160$\mu s$ and then read the time that the line is high 80 times.


    1 corresponds to 70$\mu s$ and a 0 corresponds to 26$\mu s$. This is within the
    range of pulse measurement that can be achieved using standard library functions.
    There is also a 50$\mu s$ low period between each data bit and this can be used
    to do limited processing. Notice that we are only interested in the time that
    the line is held high.


    When trying to work out how to decode a new protocol it helps to try to answer
    the question, "how can I tell the difference between a 0 and a 1?"


    If you have a logic analyzer it can help to look at the waveform and see how you
    work it out manually. In this case, despite the complex looking timing diagram,
    the difference comes down to a short versus a long pulse!'
  merge: -1
  pgno: 188
- img_proc: true
  md: "# The Electronics\n\nExactly how you build the circuit is a matter of preference.\
    \ The basic layout can be seen below.\n\n![](img/175b89abfcdc9824337e5b1ac4bb1ef3_189_0.png)\n\
    \nIt is very easy to create this circuit using a prototyping board and some jumper\
    \ wires. You can also put the resistor connected to the DHT22 to make a sensor\
    \ package connected to the Pi using three cables.\n\n# The Software\n\nWith the\
    \ hardware shown above connected to the Pi, the first thing that we need to do\
    \ is establish that the system is working. The simplest way is to pull the line\
    \ down for 1ms and see if the device responds with a stream of pulses. These can\
    \ be seen on a logic analyzer or an oscilloscope, both are indispensable tools.\
    \ If you don't have access to either tool then you will just have to skip to the\
    \ next stage and see if you can read some data.\n\nThe simplest code that this\
    \ will do is:\n\n```\nvoid GetDHT22data(uint8_t pin) {\n bcm2835 gpio_fsel(pin,\
    \ BCM2835_GPIO_FSEL_OUTP);\nbcm2835 gpio_write(pin, LOW);\n bcm2835 delayMicroseconds(1000);\n\
    \ bcm2835 gpio_fsel(pin, BCM2835_GPIO_FSEL_INTP);\n  return;\n}\n```\n\nSetting\
    \ the line initially, to ensure that it is configured as an output, we then set\
    \ it low, wait for around 1000µs and then change its direction to input by reading\
    \ the data."
  merge: -1
  pgno: 189
- img_proc: true
  md: "There is no need to set the line's pull-up mode because the Pi is the only\
    \ device driving the line until it releases the line by changing direction to\
    \ input. When a line is in input mode it is high impedance and this is why we\
    \ need an external pull-up resistor in the circuit.\n\nAs long as the circuit\
    \ has been correctly assembled and you have a working device, you should see something\
    \ like:\n\n| +1ms | +2ms | +3ms | +4ms | +5ms |\n|---|---|---|---|---||\n| Width:\
    \ | 1.20095ms | | | | |\n| Period: | 1.028395ms | | | | |\n| DutyCycle: | 2.886744%\
    \ | | | | |\n| Frequency: | | | | 972.19943Hz\n\n# Reading The Data\n\nWith preliminary\
    \ flights complete, it is time to read the 40-bit data stream. The first thing\
    \ to do is wait for the low that the device sends before the start bit:\n\n```\n\
    int i;\nfor (i = 1; i < 2000; i++) {\n  if (bcm2835_gpio_lev(pin)==0)break;\n\
    }\n```\n\nNext we can start to read the bit stream. When doing this there are\
    \ two things to keep in mind. The first is that it is the only time the line is\
    \ high that matters and you only need to measure this period accurately, you don't\
    \ care how long the line is low for. The second is that it is better to collect\
    \ the bits and only later process and extract the data. To end it is usually a\
    \ good idea to save the data in a buffer:\n\n```\nuint64_t buf[41];\nint j;\n\
    for(j=0;j<2000;j++){\n  for(i=1;i<2000;i++){\n    if(bcm2835_gpio_lev(pin)==1)break;\n\
    \  }\n  t=bcm2835_st_read();\n  for(i=1;i<2000;i++){\n    if(bcm2835_gpio_lev(pin)==0)break;\n\
    \  }\n  buf[j]=(bcm2835_st_read()-t);\n}\n```\n\nYou should be able to see how\
    \ this works. The outer loop, indexed on j, repeats in all 41 bits, i.e. 40 data\
    \ bits and the initial start bit. The first inner loop waits for the line to go\
    \ high and its final count gives us a measure of how long the line has been low.\
    \ This is of no interest the device keeps the line low for the same length of\
    \ time for a 0 or a 1."
  merge: -1
  pgno: 190
- img_proc: true
  md: "Next the second for loop waits for the line to go low. Its final count is now\
    \ proportional to the time the line was high. For machines that don't have a microsecond\
    \ clock this would be enough to decode the data. In this case we can use the low-order\
    \ 32 bits of the Pi's clock as returned by bcm2835_st_read(). We just need the\
    \ difference between time the clock went high and returned to work out if the\
    \ data is a 1 or a 0.\n\nIf you add:\n\n```\nfor(j=0;j<40;j++){\n    printf(\"\
    %d d \\n\", buf[j]);\n}\n```\n\nto the end of the program you will be able to\
    \ see the counts and you should quickly be able to work out the value halfway\
    \ between the long 1 pulses and the short 0 pulses. Examining the data reveals\
    \ that short pulses returned between 26µs and 27µs and long pulses between 73µs\
    \ and 74µs. Thus the threshold halfway between the two is approximately 50µs.\n\
    \nWith a threshold of 50 we can classify the pulses into long and short and store\
    \ 1s and 0 in the buffer:\n\n```\nint buf[41];\nint\nfor(j=0;j<41;j++){\n    for(i=1;i<2000;i++){\n\
    \        if(bcm2835_gpio_lev(i)==1)break;\n    }\n    int t=bcm2835_st_read();\n\
    \    for(i=1;i<2000;i++){\n        if(bcm2835_gpio_lev(i)==0)break;\n    }\n \
    \   buf[j]=(bcm2835_st_read()-t)-50;\n}\n```\n\nYou can afford to include this\
    \ extra processing in the data collection loop because it happens when the line\
    \ is low and we aren't interested in measuring this time. If we were then it would\
    \ be a good idea to put off processing until the loop had finished. Notice that\
    \ now we can use an integer buffer because we aren't storing the 64-bit time in\
    \ it, just the result of the conditional expression, is 0 or 1.\n\nThere is a\
    \ small bug in this program as it stands, but probably one that we can live with.\
    \ The time difference will be wrong if the clock rolls over to zero. You can fix\
    \ this by doing the arithmetic mod the size of the clock, or you can simply put\
    \ up with the fact that, very rarely, you will get a checksum error."
  merge: -1
