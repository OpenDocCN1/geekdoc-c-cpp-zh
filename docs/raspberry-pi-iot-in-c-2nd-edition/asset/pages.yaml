    | A7 Serial | Enable serial port hardware console |

    | A8 Audio | Force audio out through HDMI or 3 |

    | A9 1-Wire | Enable/Disable one-wire interface |

    | AA GPIO Server | Enable/Disable remote access to G |


    However, if you do this you will discover that any programs you write fail with
    an error that says there is no such device as serial 0. The reason is that Linux
    isn''t using serial 0 as a console, it simply doesn''t set up the serial port.
    This seems a reasonable idea, but if you want to use it the Linux driver for it
