- img_proc: true
  md: '# MOSFET Driver


    There are many who think that the FET (Field Effect Transistor) or more precisely
    the MOSFET (Metal Oxide Semiconductor FET) is the perfect amplification device
    and we should ignore BJTs. They are simpler to understand and use, but it can
    be more difficult to find one with the characteristics you require.


    Like the BJT, a MOSFET has three terminals called the gate, drain and source.
    The current that you want to control flows between the source and drain and it
    is controlled by the Gate. This is analogous to the BJT''s base, collector and
    emitter, the difference is that it is the voltage on the gate that controls the
    current between the source and drain.


    The gate is essentially a high resistance input and very little current flows
    in it. This makes it an ideal way to connect a GPIO line to a device that needs
    more current or a different voltage. When the gate voltage is low the drain current
    is very small. When it is different for MOSFETs, the source drain current starts
    to increase exponentially. When the gate is connected to 0V or below Don''t think
    of VGS(th) as the gate voltage that when it is above VGS(th) the MOSFET turns
    on, but as the voltage below which it is turned off. The problem is that the gate
    voltage to a typical MOSFET fully on is in the region of 10V. Special "logic"
    MOSFETs need a gate voltage around 5V to fully turn on and this makes the 3.3V
    at which the Raspberry Pi''s GPIO lines work a problem. The data sheets usually
    give the full on resistance and the minimum gate voltage that produces it, usually
    listed as Drain-Source On-State Resistance. For digital work this is a more important
    parameter than the gate threshold.


    You can deal with this problem in two ways – ignore it or find a MOSFET with a
    very small VGS(th). In practice MOSFETs with thresholds below 3.3V are hard to
    find and when you do they are generally only available as surface mount. Ignoring
    the problem sometimes works if you tolerate the MOSFET not being fully. If the
    current is kept low then, even though the MOSFET might have a resistance of a
    few ohms, the power loss and voltage drop may be acceptable.


    What MOSFETs are useful for in connecting higher voltages to a GPIO line used
    as an input – see later.


    Also notice that this discussion has been in terms of an N-channel MOSFET a P-channel
    works in the same way, but with all polarities reversed. It is cut off when the
    gate is at the positive voltage and when the gate is grounded. This is exactly
    the same as the NPN versus PNP for the BJT.'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# MOSFET LED


    A BJT is the easiest way to drive an LED, but as an example of using a common
    MOSFET we can arrange to drive one using a 2N7000, a low-cost, N-channel device
    available in a standard TO92 form factor suitable for experimentation:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_70_0.png)


    Its data sheet states that it has a V_{GS(th)} typically 2V, but it could be as
    low as 0.8V or as high as 3V. Given we are trying to work with a gate voltage
    of 3.3V you can see that in the worst case this is hardly going to work – the
    device will only just turn on. The best you can do is to buy a batch of 2N7000
    and measure their VGS(th) to weed out any that are too high. This said, in practice
    the circuit given below does fairly work.


    Assuming a V_{GS(th)} of 2V and a current of 20mA for the LED data sheet gives
    a rough value of 6Ω for the on resistance with a gate voltage of 3V. The calculation
    for the current-limiting resistor is the same as in the BJT case and the final
    circuit is:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_70_1.png)'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'Notice that we don''t need a current-limiting resistor for the GPIO line as
    the gate connection is high impedance and doesn''t draw much current. In practice,
    it is usually a good idea to include a current-limiting resistor in the GPIO line
    if you plan to switch it on and off rapidly. The problem is that the gate looks
    like a capacitor and fast changes in voltage can produce high currents. Notice
    that there are likely to be devices labeled 2N7000 that will not work in this
    circuit due to the threshold gate voltage too high, but encountering one is rare.


    A logic-level MOSFET like the IRLZ44 has a resistance of 0.028Ω at 5V compared
    to the 2N2222''s of 6Ω. It also has a $V_{GS(th)}$ guaranteed to be between 1V
    and 2V.


    # Setting Drive Type


    The GPIO output can be configured into one of a number of modes, but the most
    important is pull-up/down. Before we get to the code to do the job it is worth
    spending a moment explaining the three basic output modes, push-pull, pull-up
    and pull-down.


    # Push-Pull Mode


    In push-pull mode two transistors of opposite polarity, PNP and one NPN, are used:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_71_0.png)


    The circuit behaves like the two-switch equivalent on the right. Only one of the
    transistors, or switches, is "closed" at any time. If the input is high then Q1
    is saturated and the output is connected to ground - exactly as if S1 closed.
    If the input is low then Q2 is saturated and it is as if S2 was closed and the
    output is connected to 3.3V.


    You can see that this pushes the output line high with the same "force" as it
    pulls it low. This is the standard configuration for a GPIO output.'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# Pull-Up Mode


    In pull-up mode one of the transistors is replaced by a resistor:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_72_0.png)


    In this case the circuit is equivalent to having a single switch. When the switch
    is closed, the output line is connected to ground and hence driven low. When the
    switch is open, the output line is pulled high by the resistor. You can see that
    in this case the degree of pull-down is greater than the pullup, where the current
    is limited by the resistor. The advantage of this mode is that it can be used
    in an AND configuration. If multiple GPIO or other lines are connected to the
    output, then any one of them being low will pull the output line low. Only when
    all of them are off the resistor succeed in pulling the line high. This is used,
    for example, in a serial bus configuration the I2C bus.


    # Pull-Down Mode


    Finally the pull-down mode, which is the best mode for driving general loads,
    motors, LEDs, etc, is exactly the same as the pull-up only now the resistor is
    used to pull the output line low.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_72_1.png)


    The line is held high by the transistor and pulled low by the resistor only when
    all the switches are open. Putting this other way round, the line is high if any
    switch is closed. This is the OR version of the shared bus idea.'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# Setting Output Mode


    To set the mode for a GPIO line the simplest function to use is:

    bcm2835_gpio_set_pud (uint8_t pin, uint8_t pud)


    where pin is specified in the usual way and pud can be any of:


    +   - BCM2835 GPIO PUD OFF

    - BCM2835 GPIO PUD DOWN

    - BCM2835 GPIO PUD UP


    OFF is the default and you need to explicitly set DOWN and UP if required. That
    is, a GPIO line is in push-pull mode unless you pull-up/pull-down.

    The internal pull-up/pull-down resistors are in the range 50k to 65k. There are
    external 1.8k pull-ups on pins 3 and 5. The only way to remove them is to unsolder
    them from the board.


    # Basic Input Circuit - The Switch


    Now it is time to turn our attention to the electrical characteristics of GPIO
    as inputs. One of the most common input circuits is the switch or button.


    Many beginners make the mistake of wiring a GPIO line to a switch something like:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_73_0.png)


    The problem with this is, if the switch is pressed, the GPIO line is connected
    to ground and will read as zero. The question is, what does it read when the switch
    is open? A GPIO line configured as an input has a very high resistance. It is
    not connected to any particular voltage and the voltage on it varies due to the
    static it picks up. The jargon is that the unconnected line is “floating”. When
    the switch is open the line is floating and if you read it the result, zero or
    one, depends on whatever noise it has picked up.'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'The correct way to do the job is to tie the input line either high or low when
    the switch is open using a resistor. A pull-up arrangement would be something
    like:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_74_0.png)


    The value of the resistor used isn''t critical. It simply pulls the GPIO line
    high when the switch isn''t pressed. When it is pressed a current of a little
    more than 0.3mA flows in the resistor. If this is too much increase the resistance
    to 100kΩ or even more - but that the higher the resistor value the noisier input
    to the GPIO and the more it is susceptible to RF interference. Notice that this
    gives a zero when the switch is pressed.


    If you want a switch that pulls the line high instead of low, reverse the logic
    by swapping the positions of the resistor and the switch in the diagram to create
    a pull-down:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_74_1.png)


    Notice that this gives a one when the switch is pressed.


    The good news is that the Raspberry Pi has built-in pull-up and pull-down resistors
    which you can enable in software. This means that you can connect a switch directly
    to the GPIO and set a pull-up or pull-down configuration in software. How to do
    this is covered in the next chapter.'
  merge: -1
  pgno: 74
- img_proc: true
  md: '# Debounce


    Although the switch is the simplest input device, it is very difficult to get
    right. When a user clicks a switch of any sort, the action isn''t clean - the
    switch bounces. What this means is that the logic level on the GPIO line goes
    high and low again and bounces between the two until it settles down. There are
    electronic ways of debouncing switches, but software does the job much better.
    All you have to do is insert a delay of a millisecond or after detecting a switch
    press and read the line again - if it is still low then record a switch. Similarly,
    when the switch is released, read the state twice with a delay. You can vary the
    delay to modify the perceived characteristics of the switch.


    A more sophisticated algorithm is based on the idea of integration to debounce
    a switch. Every few milliseconds say, and keep a running sum of values. If you
    sum ten values each a total of 6 and 10 can be taken as an indication that the
    switch is high. A total less than this indicates that the switch is low. You can
    think of this as a majority vote in the time period for the switch being high
    or low.


    # The Potential Divider


    If you have an input that is outside of the range of 0V to 3.3V then you can reduce
    it using a simple potential divider. In the diagram V is the input from the external
    logic and Vout is the connection to the GPIO input line:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_75_0.png)


    Vout = V R2 / (R1+R2)


    You can spend a lot of time on working good values of R1 and R2. For loads that
    take a lot of current you need R1+R2 to be small and divided in the same ratio
    as the voltages.


    For example, for a 5V device R1=18 or 20K and R2=33K work well to drop the voltage
    to 3.3V.'
  merge: -1
  pgno: 75
- img_proc: true
  md: 'A simpler approach that works for a 5V signal is to notice that the ratio R1:R2
    has to be the same as (5-3.3):3.3, i.e. the voltage itself divides across the
    resistors in proportion to their value, which is roughly 1:2. What this means
    is that you can take any resistor and use it for R1 and use two of the same value
    in series for R2 and the Vout will be 3.333VV.


    The problem with resistive divider is that it can round off fast pulses due to
    the small capacitive effects. This usually isn''t a problem, but if it is then
    the solution is to use a FET or a BJT as an active buffer:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_76_0.png)


    Notice that this is an inverting buffer, the output is low when the input is high,
    but you can usually ignore this and simply correct it in software, i.e. read a
    1 as a low state and 0 as a high state.

    The role of R1 is to make sure the FET is off when the 5V signal is absent and
    R2 limits the current in the FET to about 0.3mA.


    In most cases you should try the simple voltage divider and only move to an active
    buffer if it doesn''t work.

    This basic look at electronics isn''t all you need to know, but it is enough for
    you to see some of the problems and find some answers. In general, this sort of
    electronics is all about making sure that voltages and currents are within limits.
    As switching speeds increase you have additional problems, which are mainly concerned
    with making sure that your circuits aren''t slowing things down. This is where
    things get more subtle.'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# Summary


    +   - You can get a long way with only a small understanding of electronics, but
    you need to know enough to protect the Pi and things you connect to it.


    +   - The maximum current from any GPIO line should be less than 16mA and the
    total current should be less than 50mA.


    +   - All of the GPIO lines work at 3.3V and you should avoid directly connecting
    any other voltage.


    +   - You can drive an LED directly from a GPIO line, but only at 16mA rather
    than the nominal 20mA needed for full brightness.


    +   - Calculating a current-limiting resistor always follows the same steps -
    find out the current in the device, find out the voltage across the device and
    work out the resistor that supplies current when the remainder of the voltage
    is applied to it.


    +   - For any load you connect to a GPIO output you generally need a current-limiting
    resistor.


    +   - In many cases you need a transistor, a BJT, to increase the current supplied
    by the GPIO line.


    +   - To use a BJT you calculate a current-limiting resistor in the base and generally
    one in the collector.


    +   - MOSFETs are popular alternatives to BJTs, but it is difficult to find a
    MOSFET that works reliably at 3.3V.


    +   - GPIO output lines can be set to activate push-pull mode, where a transistor
    is used to pull the line high or low, or passive pull-up or pull-down mode, where
    one transistor is used and a resistor pulls the line high or low when the transistor
    is inactive.


    +   - GPIO lines have built-in pull-up and pull-down resistors which can be selected
    or disabled under software control.


    +   - When as inputs, GPIO lines have a very high resistance and in most cases
    you need pull-up or pull-down resistors to stop the line floating.


    +   - The built-in pull-up or pull-down resistors can be used in input mode.


    +   - Mechanical input devices have to be debounced to stop spurious input.


    +   - If you need to connect an input to something bigger than 3.3V then you need
    a potential divider to reduce the voltage back to 3.3V. You can also use a transistor.'
  merge: -1
