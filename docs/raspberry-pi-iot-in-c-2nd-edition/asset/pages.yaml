  md: "# How Fast Can You Modulate?\n\nIn most cases the whole point is to vary the\
    \ duty cycle or the period of the pulse train, for reasons that will be discussed\
    \ later. This means that the next question is how fast you can change the characteristic\
    \ of a PWM line? In other words, how fast can you change the duty cycle? There\
    \ is no easy way to give an exact answer, and in many applications, an exact isn't\
    \ of much value. The reason is that for a PWM signal to convey information it\
    \ generally has to deliver a number of complete cycles with a given duty cycle.\
    \ This is because of the ways pulses are often averaged in applications.\n\nWe\
    \ also have another problem – synchronization. There is no way to swap from one\
    \ duty cycle to another exactly when a complete duty cycle has finished. You all\
    \ can do is a timer to estimate when the pulse is high or low.\n\nWhat this means\
    \ is that there is going to be a glitch when you switch from one duty cycle to\
    \ another. Of course, this glitch becomes less important as you slow the rate\
    \ of duty cycle change and exactly what is depends on the application. For example,\
    \ set up the PWM to clock(2), 9.6MHz, with range 256 gives a repeat time of 26.6µs.\
    \ We can change the duty cycle from 0 to 256 and in this we choose 128, i.e. 50%,\
    \ and 16, i.e. 6.25%, and switch between then after eight cycles:\n\n```\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n#include <bcm2835.h>\nint main(int argc, char**\
    \ argv) {\n    if (!bcm2835_gpio_init())\n        return 1;\n\n    bcm2835_gpio\
    \ fsel(18, bcm2835_GPIO_FSEL_ALT);\nbcm2835_pwm_set_clock(2);\nbcm2835_pwm_set_mode(0,\
    \ 1, 1);\nbcm2835_pwm_set_range(0, 256);\n\n    for (;;) {\n        bcm2835_pwm_set_data(0,\
    \ 16);\n        bcm2835_delayMicroseconds((int)26.666*8);\n        bcm2835_pwm_set_data(0,\
    \ 128);\n        bcm2835_delayMicroseconds((int)26.666*8);\n    }\n    return\
    \ (EXIT_SUCCESS);\n}\n```"
  merge: -1
  pgno: 144
- img_proc: true
  md: 'The result looks fairly good and notice that the change in duty cycle is correct,
    the last 50% unit is followed by a 6.25% unit:


    | +500us | +600us |

    |---|---|

    | Width: | 1.67us |

    | Period: | 26.67us |

    | DutyCycle: | 6.261729% |

    | Frequency: | 37.495313KHz |


    The fastest PWM repetition rate that you can use is 26.6µs for an 8-bit resolution
    and you can change the duty cycle as frequently as once per.


    # Uses Of PWM – Digital To Analog


    What sorts of things do you use PWM for?


    There are lots of very clever uses for PWM. However, there are two use cases which
    account for most PWM applications - voltage or power modulation and signaling
    to servos.


    The amount of power delivered to a device by a pulse train is proportional to
    the duty cycle. A pulse train with a 50% duty cycle is delivering current to the
    only 50% of the time and this is irrespective of the repetition rate. So the duty
    cycle controls the power but the period still matters in many situations you want
    to avoid any flashing or other effects. A higher frequency smooths out the power
    flow at any duty cycle.


    If you add a low-pass filter to the output of a PWM signal then you get what is
    a voltage that is proportional to the duty cycle. This can be looked at in many
    ways, but again it is the amount of power delivered by a PWM signal. You can also
    think of it as using the filter to remove the high frequency components of the
    signal leaving only the slower components to the modulation of the duty cycle.


    How fast you work depends on the duty cycle resolution you select. If you work
    with 8-bit resolution your D to A A/2 conversion will have 256 steps, with 3.3V
    gives a potential resolution of 3.3/256 or about 13mV. This is often good enough.
    At the fastest clock rate this gives a repetition rate of 37.5kHz, which sounds
    as if it be enough for audio synthesis.


    The PWM output in this configuration mimics the workings of an 8-bit AtD converter.
    You set the duty cycle using a value of 0 to 256 for data and you get a voltage
    output that is 3.3data/256V. The repetition rate is around 25µs and the usual
    rule of thumb is that you need 10 pulses to occur per conversion, i.e. the maximum
    frequency you can produce is pulse rate/10. This means that the fastest signal
    you can create about 3kHz, which isn''t fast enough for a great many applications
    and you can''t use it for sound synthesis, in particular.'
  merge: -1
  pgno: 145
