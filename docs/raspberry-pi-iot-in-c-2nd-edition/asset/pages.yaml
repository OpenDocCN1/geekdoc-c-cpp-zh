- img_proc: true
  md: "The writeByte function will write the low eight bits of an int to the device:\n\
    void writeByte(uint8_t pin, int byte) {\n int i;\n for (i = 0; i < 8; i++) {\n\
    \  if (byte & 1) {\n    writeBit(pin, 1);\n  } else {\n    writeBit(pin, 0);\n\
    \  }\n  byte = byte >> 1;\n }\n}\n\nUsing this we can send a SKIP ROM command\
    \ using:\nwriteByte(RPI_BPLUS GPIO_J8_07, 0xCC);\n\nYou can see the pattern of\
    \ bits sent on a logic analyzer:\n\n![](img/175b89abfcdc9824337e5b1ac4bb1ef3_204_0.png)\n\
    \n# Reading Bits\n\nWe already know how the master sends a 1 and a 0. The protocol\
    \ for the slave device is exactly the same that the master still provides the\
    \ slot's starting pulse. That is, the master starts a 60µs slot by pulling the\
    \ bus down for at least 1µs. Then the slave device either holds the line down\
    \ for a further 15µs minimum or it allows the line to float high. See below for\
    \ the exact timings:\n\n![](img/175b89abfcdc9824337e5b1ac4bb1ef3_204_1.png)\n\n\
    So all we have to do read is to pull the line down for more than 1µs and then\
    \ sample the bus after pausing long enough for the line to be pulled or held.\
    \ In practice, the datasheet gives 6µs for the master's pulse and a 9µs pause.\
    \ a final delay of 2µs to work best and allows for the time to change the line's\
    \ direction.\nuint8_t readBit(uint8_t pin) {"
