  md: '# Your First C Pi Program


    At this point it is assumed that you have NetBeans installed either on the Pi
    or on a desktop machine. It is also assumed that the Pi is correctly set up and,
    if you are using remote development, it is connected to a network and can know
    your IP address and can SSH to.


    As this isnt a complete beginner''s book, it is assumed that you have your target
    Pi up with Pi OS and you either have a monitor, keyboard and mouse moved or you
    have an SSH connection. If you haven''t reached this stage there are lots of introductory
    tutorials.


    In general, before starting work with C it is necessary to set up the details
    of where the C compilers are located. The Pi comes ready setup with GCC compiler
    standard, so there is no need to do anything all if you are running NetBeans on
    the Pi. In this case NetBeans will automatically detected the compilers and set
    up localhost as the build server.


    If you are running NetBeans on a desktop machine then localhost, i.e the desktop
    machine, will have been set up as the build server, but this is only useful if
    the necessary compilers have been installed. In the case of Windows this is unlikely
    unless you have specifically installed them.


    # Remote Build Server


    For remote development you have to set up the Pi as the remote build server. You
    can skip this step if you are using NetBeans on the Pi itself, but it is a good
    idea to follow the instructions to confirm that you have the GNU compilers set
    up correctly. To do this use the menu command:


    Windows, drop-down C/C++ Build Hosts in the window that appears.


    If NetBeans is running on the Pi when you expand the localhost entry you''ll see
    all of the compilers and other software needed to compile a program:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_27_0.png)'
