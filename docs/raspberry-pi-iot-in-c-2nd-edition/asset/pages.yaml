  md: '# # Chapter 2

    Getting Started


    There are lots of ways to program the Pi. Popular choices range from Scratch,
    often regarded as a language for children, but in fact a well-suited choice for
    simple IoT scenarios, to Python, a general-purpose language that is so widely
    taught to students, and you could even choose assembler. Each language has its
    advantages and disadvantages, but there are times when subtle arguments are necessary.
    If you want to program the Pi in a way that extracts the maximum efficiency and
    without any limits C is the obvious choice. It is easier to program C than in
    assembler and the results are almost the same in terms of speed.


    You can describe C as a machine-independent assembly language and when you learn
    it you get deeper into the system than other languages and discover what is really
    going on. This makes it a good way to improve your understanding of computing
    and general. If you need to learn C as it is used in IoT programming then *Fundamental
    C: Getting To The Machine*, ISBN: 9781871962604.


    Sometimes you dont need speed, even in example, if you just want to flash a few
    LEDs or read a temperature sensor in a human timescale, however if you want to
    directly interface with other systems and control externally hardware at its full
    speed, C is your best choice. If timing is critical, C is the only way to go.
    Put simply, if you can''t make your application work fast enough in C, you probably
    can''t in any language C as being “low-level” makes it easy to access the underlying
    hardware.


    In the programs in this book of the peripherals are accessed directly and Linux
    drivers are mostly avoided. The reason is that, even if a driver is available,
    it is to be installed and makes the setup for your program more complex. Also,
    driving the hardware directly isn''t that difficult and it means you can modify
    how it behaves and correct for defects in software. This is the advantage of working
    with C instead of a language that is so slow that drivers are essential for speed.


    You might be worried that you are somehow trapping yourself in a low-level language
    and will be unable to take advantage of sophisticated programming practices. Your
    get-out-clause is that C is a subset of C++ and you can break out of C any time
    you want to and start writing code that has objects and'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'the trimmings of a modern language. Of course, the code you write might not
    be quite efficient as the C code you have had to give up, but it is still fast.
    While C leads on naturally to C++, a full object-oriented extension of the C language,
    in this book C is used rather than C++ to simply make the programs easier to understand.
    In practice, many of the functions created as we go along would be better off
    integrated into suitable objects. Equally, for the sake of simplicity, the code
    presented is the simplest that will do the job. This means we ignore error handling
    and factoring code into headers and other libraries — everything is as simple
    as possible and self-contained as possible. After all, the point is to understand
    what is going on, not present production-ready code.


    Put simply, C is a great language for any interfacing, IoT or embedded program
    and it leads on to C++ and more sophisticated languages.


    So C is worth learning. How do we get started?


    # Getting Started In C


    You can program in C in many different ways. All of the software you need to run
    a C program is already installed on a standard Pi Pi OS, which was formerly called
    Raspberry. You can use an editor on the Pi to create your program and compile
    it and run it using the command line. However, there are easy-to-use IDEs that
    make programming in C fast and painless, and they provide debugging facilities
    that make finding bugs quicker.


    You could use Genny or Eclipse, which are both open source, but my choice, and
    the one used throughout this book, is NetBeans. If you want to use one of the
    others, or just a text editor and the command line, you can and everything will
    work well, but NetBeans is worth a try because the help it gives you generating
    code and debugging will save you a lot of time in the long run. It is also open
    source and free to use.


    If you don''t want to use NetBeans, the best alternative is Visual Studio Code,
    VS Code. This is a free multi-language, multi-platform code editor that is worth
    the time to know. Its only disadvantages are that at the moment it doesn''t support
    remote development on the Raspberry Pi in C. However, this is relatively easy
    to overcome and how to use it for remote development using C for the Raspberry
    Pi is described in Appendix II. Although NetBeans is used in the examples in the
    rest of this book, the changes to make use of VS Code are trivial.'
