- img_proc: true
  md: '# Write


    While there are two write functions, the basic one is:

    uint8_t bcm2835_i2c write(const char * buf, uint32_t len)


    This performs a simple write of the buffer to the previously selected slave.

    When you use it, first an an address frame, a byte containing the address of the
    device you specify, is transmitted. Notice that the 7-bit address has to be shifted
    into the topmost bits and the first bit has to be zeroed for a write operation.
    When you write to a device with an address of 0x40 or 0x80 on a logic analyzer,
    it sees the address frame as many data frames are specified in buf and len.


    If you know the I2C protocol, it is worth saying that the library functions deal
    with the start sequence and the address frame, check the NAK/ACK from the slave,
    send the data bits, check the NAK/ACK bit from the slave, and send the stop sequence.
    That is, the usual transaction is:


    ```

    START|ADDR|ACK|DATA0|ACK|DATA1|ACK...

    DATAn|ACK|STOP

    ```


    Notice that it is the slave that sends the ACK bit, and if the data is not received
    correctly, it can send NAK instead. Notice that the Pi sends a single STOP when
    the entire transaction is complete.


    A multibyte transfer is different from sending single bytes one at a time:


    ```

    START|ADDR|ACK|DATA0|ACK|STOP

    START|ADDR|ACK|DATA1|ACK|STOP...

    START|ADDR|DATAn|ACK|STOP

    ```


    Notice that there are multiple ADDR frames as well as START and STOP bits. What
    this means in practice is that you have to look at a device''s datasheet and send
    many bytes it needs as a single operation. You cannot send the same number of
    bytes broken into chunks.


    # Write To A Register


    A standard interaction between master and slave is writing data to a register.
    This isn''t anything special and, as far as the I2C bus is concerned, you are
    simply writing raw data. However, datasheets and users tend to think in terms
    of reading and writing internal storage locations, i.e. registers in the device.
    In fact, many devices have lots of internal storage, indeed some I2C devices,
    for example I2C EPROMS, are nothing but internal storage.'
  merge: -1
  pgno: 168
- img_proc: true
  md: 'In this case a standard transaction to write to a register is:


    +   1. Send a data frame


    +   2. Send a data frame with the command to select the register


    +   3. Send a data frame containing the byte, or word, to be written to the register


    So, for example, you might use:


    ```

    char buf[]={registerAddress data};

    bcm2835_i2c_write(buf 2);

    ```


    Notice the command that has to be sent depends on the device and you have to look
    it up in its datasheet. Also notice that there is a single START and STOP bit
    at the beginning and end of the transaction.


    # Read


    There are two read functions and the simplest follows the logic of the corresponding
    function:


    ```

    uint8_t bcm2835_i2c_read (char *buf, uint32_t len)

    ```


    This sends an address and then reads as many bytes from the slave as specified.
    As in the case of write, the address supplied is shifted up one bit and the lower-order
    bit set to 1 to indicate a read operation. So, if the current slave is at address
    0x40, the slave reads a read address of 0x81.


    The read transaction is:


    |START|ADDR|DATA0|ACK|

    |DATA1|ACK|

    |DATA2|ACK|

    |...|DataN|NAK|STOP|


    The master sends the address frame and the slave sends the ACK after the address
    to acknowledge that it has been received and is ready to send data. Then the slave
    sends bytes one at a time and the master sends ACK to each byte. Finally the master
    sends a NAK to indicate that the last byte has been read and then a STOP bit.
    That is, the master controls how many bytes are transferred.


    As in the case of the write functions, a block transfer of n bytes is different
    from transferring n bytes one at a time.'
  merge: -1
