- img_proc: true
  md: "The while loop waits for the clock to stop and then the divisor is written\
    \ to the divisor register and the source to the control register.\n\nFinally the\
    \ source is written to the control register along with an enable bit set to 1.\
    \ The 0x200 selects one stage of MASH, which is necessary if you want to use the\
    \ fractional divisor.\n\nAlso notice that we are using the predefined BCM2835_PWM_PASSWRD\
    \ for 0x5A to allow a write to the registers.\n\nYou can try this out with a main\
    \ program like this:\n\n```\nif (!bcm2835_init())\n    return 1;\nbcm2835_gpio_fsel(4,\
    \ bcm2835_GPIO04_FSEL_ALTO);\nbcm2835_gpio04_set_clock_source(6, 50, 0);\n\n```\n\
    \nwhich selects frequency source 6 and a divisor of 50 which gives 10MHz on a\
    \ Pi Zero. For the same frequency on a Pi 4, the divisor would need to be set\
    \ to 75.\n\nIf you look at the output of GPIO 4 with a logic analyzer you might\
    \ be surprised by jittery the signal. Part of this is likely to be due to the\
    \ poor shape at a high frequency. If you look at the pulse stream on oscilloscope\
    \ then you would see something like:\n\n![](img/175b89abfcdc9824337e5b1ac4bb1ef3_354_0.png)\n\
    \nThe maximum frequency that can be produced depends on the loading on the GPIO\
    \ pin and stray capacitance. In theory, you should be able to get up to 100MHz.\
    \ In practice, this is difficult. As the frequency goes up the losses due to capacitance\
    \ and the output voltage falls. Add to this fact that many oscilloscopes will\
    \ not record a signal at 100MHz and it gets very difficult to work with divisors\
    \ smaller than 20 you often can't see the output.\n\nWith a divisor of 5 you can\
    \ get enough of a signal to use the output as a 100MHz FM transmitter. There are\
    \ programs that make use of this effect to send an FM audio signal by changing\
    \ the frequency by the fractional divisor."
  merge: -1
