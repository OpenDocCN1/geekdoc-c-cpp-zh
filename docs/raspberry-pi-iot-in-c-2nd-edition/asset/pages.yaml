- img_proc: true
  md: '# Polling For Data With Blocking


    You can set up a software interrupt to signal when there is data to be read and
    use another thread to process it, the majority of serial applications work best
    with a simple polling loop and you can do the job with some mix of blocking and
    non-blocking. For example, suppose you have just sent a command to a device and
    you need to wait for it to respond. Suppose the response is a block of code less
    than 100 bytes and after this has been transmitted nothing happens until the next
    command is sent to the device.


    To do the job with a blocking call you can read one block of data at a time by
    setting c_cc[VTIME] and c_cc[VMIN] correctly. As we are only expecting fewer than
    100 bytes you can set c_cc[VMIN] to 10 and be safe that the read will not return
    all of the characters sent by the device.


    Setting c_cc[VTIME]=1 means that if there is more than a tenth of a second pause
    between then the block is assumed complete and the read returns with the data.
    Of course, if the device pauses for more than 0.1s and it hasn''t finished, then
    the block will be received incomplete. However, in many cases this is unlikely
    and, when does happen, represents an error that needs a complete retry.


    There is also the problem of what happens if the device doesn''t send any data
    at all. In this case the timeout between characters is never triggered and the
    read call blocks forever. To avoid this problem, we have to use ioctl to test
    for at least one character in the buffer before we start the read.


    An example program using this method is:


    ```

    #define DEFAULT_SOURCE

    #include <stdio.h>

    #include <stdlib.h>

    #include <string.h>

    #include <unistd.h>

    #include <fcntl.h>

    #include <termios.h>

    #include <errno.h>

    #include <sys/ioctl.h>

    ```'
  merge: -1
  pgno: 275
