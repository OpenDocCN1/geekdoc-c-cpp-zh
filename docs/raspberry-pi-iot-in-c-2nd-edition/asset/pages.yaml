  md: "# Is There A Button?\n\nThe first thing you want to try with any 1-wire device\
    \ is to discover if the bus is working and to do this you send an initialization\
    \ pulse. We created a function to do just this in the previous chapter, so we\
    \ can just use it.\nHowever, you want to detect when an iButton is pressed into\
    \ the reader, so you need a loop something like:\n\n```\nuint8 t b = 1;\nfor(;;\
    \ {\n    b = presence(RPI_BPLUS_GPIO_J8_07);\n    if (b == 0) {\n        read\
    \ iButton\n    }\n}\n```\n\nwhere presence is a function from the previous chapter.\n\
    In practice there is also the problem that the iButton is likely to be intermittent\
    \ contact and so you have to implement error checking and some way of \"debouncing\"\
    \ the iButton so you only it once. For the moment, we can ignore this problem\
    \ and just read the iButton.\n\n# Read The Serial Number\n\nThe DS190R and similar\
    \ are very simple 1-wire devices and they only support a few commands. If it is\
    \ the only device on the bus then only one of these commands is actually useful.\
    \ After the initialization pulse, and once the device has sent its presence back,\
    \ it waits for a command byte to be transmitted from the master. In most cases\
    \ the command you need to send is Read ROM which is either 0x33 or 0xFF. In response\
    \ the slave sends the unique serial number stored in its memory.\n\n| MSB | 0-BIT\
    \ CRC CODE | 48-BIT SERIAL NUMBER | 0-BIT FAMILY CODE (07) | MSB |\n|---|---|---|---|---|\n\
    | LSB MSB | | | LSB MSB |\n\nNormally you would have to select the Skip ROM command\
    \ or Match ROM command device but in this case it isn't necessary because the\
    \ iButton is usually the only device on the bus.\n\nTo send the Read ROM command\
    \ you use the writeByte function introduced in the previous chapter:\n\n```\n\
    writeByte(RPI_BPLUS_GPIO_J8_07, 0x33);\n```"
  merge: -1
