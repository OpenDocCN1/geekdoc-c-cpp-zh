  md: '# # Chapter 17


    # # Getting Started With The SPI Bus


    The Serial Peripheral Interface (SPI) bus can be something of a problem because
    it doesn''t have a well-defined standard that every device conforms to. Even so,
    if you only want to work with one specific device it is usually easy to find a
    configuration that works - as long as you understand what the possibilities are.


    # ## SPI Bus Basics


    The SPI bus is commonly encountered as it is used to connect all sorts of devices
    from LCD displays, through realtime clocks and AtoD converters, but as different
    companies have implemented it in different ways, you have to work harder to implement
    it in any particular case. However, it does usually work, which is a surprise
    for a bus with no standard, or clear, specification.


    The reason it can be made to work is that you can specify a range of different
    operating modes, frequencies and polarities. This makes the bus slightly more
    complicated to use, but generally it is a matter of looking up how the device
    you are trying to work with implements the SPI bus and then getting the Pi to
    work in the same way.


    The SPI bus is odd in another way - it does not use bidirectional serial connections.
    There is a data line for the data to go from the master to the slave and a separate
    data line from the slave back to the master. That is, instead of a single data
    line that changes its direction, there is one for data going out and one for data
    coming. It is also worth knowing that the drive on the SPI bus is push-pull and
    not open collector/drain. This provides higher speed and more noise protection
    as the bus is driven in both directions. There is a bidirectional mode where a
    single wire is used for but the Pi does not support this.


    In the configuration most used for the Pi, there is a single master and, at most,
    two slaves. The signal lines are:


    +   - MOSI (Master Slave Output Input), i.e. data to the slave

    - MISO (Master Input Slave Output), i.e. data to the master

    - SCLK (Serial Clock), which is always generated by the master'
