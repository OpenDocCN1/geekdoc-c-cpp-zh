- img_proc: true
  md: '# Summary


    +   - Output is easy because the program decides when to change the state of a
    line. Input is hard because you never know when an input line will change state.

    - GPIO lines can be set to act as inputs or outputs.

    - If a line is set to output it can be set high or low using setting and clr or
    to the state of a variable using writing.

    - You can either set or clear a group of GPIO lines in one operation using a mask
    to indicate which lines to change.

    - You cannot both set and clear a group of lines in a single operation.

    - You can generate pulses as short as 70ns but not reliably.

    - The clock speed in a Pi Zero, 3 and 4 is not fixed. It varies according to load
    and CPU temperature. You can set the clock to its maximum using a command but
    the clock will still be reduced if the CPU temperature is too high.

    - A delay can be introduced into a program using the nanosleep function. However,
    this only promises to suspend the program for at specified time.

    - You can derive an approximate relation between specified delay and actual using
    nanosleep.

    - An alternative to nanosleep is to use a busy wait which is simply a loop that
    keeps the CPU busy for an amount of time. It is easy to obtain an equation that
    gives the delay per loop repetition.

    - If you are going to use a busy wait you should create a function that calibrates
    the number of loops needed for any given time.

    - The BCM2835 library provides the bcm2835_delayMicroseconds function which uses
    a busy wait for small delays and nanosleep for longer delays.

    - Pulsing pulses which are in phase can be done but using the masked based operations.

    - Even using masked based operations you still cannot achieve perfect 180 degree
    out of phase pulses because set and clear are always distinct operations.

    - How important the overlap or delay between lines changing state is depends on
    the application, but you need to keep it in mind.'
  merge: -1
