- img_proc: true
  md: '# The I2C Protocol In Action


    If you have a logic analyzer that can interpret the I2C protocol connected what
    you will see is:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_176_0.png)


    You can see that the write byte function sends an address packet set to the device''s
    7-bit address 0x40 as the high-order bits with the low-order bit set to zero to
    indicate a write, ie 0x80. After this you get a data packet containing 0xE7, the
    address of the register. After a few microseconds it sends the address frame again,
    only this time with the low-order bit set to 1 to indicate a read. It receives
    back a single byte of data from the device, 0x02. This demonstrates that the external
    device is working properly and can move on getting some data of interest.


    # Reading the raw temperature data


    Now we come to reading one of the quantities that the device measures temperature.
    If you look back at the command table you will see that there are two possible
    commands for reading the temperature:


    | Command | Comment |

    |---|---||

    | Trigger Temperature Measurement | 0xE3 | Hold master |

    | Trigger Temperature Measurement | 0xF3 | No Hold master |


    What is the difference between Hold master and No Hold master? This was discussed
    earlier in a general context. The device cannot read the temperature instantaneously
    and the master can either opt to be waiting for the data, i.e. hold master, or
    released to do something else and poll for the data until it is ready.


    The Hold master option works by allowing the device to stretch the clock pulse
    by holding the line after the master has released it. In this mode the master
    will wait until the device releases the write. Not all masters support this mode
    but the Pi does and makes it the simpler option.'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'To read the temperature using the Hold master mode you simply send 0xE3

    and then read three bytes. The simplest program that will work in theory, but

    not in practice, is:


    ```

    char buf[4] = {0xE3};

    bcm2835_i2c_read_register_rs(buf, buf, 3);

    uint8_t msb = buf[0];

    uint8_t lsb = buf[1];

    uint8_t check = buf[2];

    printf("%d \n\r checksum %d \n\r", msb, lsb, check);

    ```


    The buffer is unpacked into three variables with more meaningful names:

    msb - most significant byte, least significant byte, check - checksum


    If you try this will find that it doesn''t work. This is almost certainly

    because it out given the default setting of 40 clock pulses for the clock

    stretching timeout. Unfortunately, the bcm2835 library doesn''t provide a

    timeout. It is, however, a timeout of 14µs, which is very short. The HTU21D takes
    40ms or more to

    complete a temperature conversion so timeout is inevitable.


    # Setting The Clock Stretching Timeout


    In most cases when using clock stretching, we have to modify the clock

    stretching timeout. Unfortunately, the bcm2835 library doesn''t provide a


    ```

    void setTimeout(uint16_t timeout) {

    volatile uint32_t* timeout = bcm2835_bscl + BCM2835_BSC_CLKT / 4;

    bcm2835_peri_write(timeout, timeout);

    }

    ```


    This simply writes to the timeout register using the address created

    by the library. Now we can make clock stretching work by disabling the

    timeout by setting a value of zero.


    ```

    #include <stdio.h>

    #include <stdlib.h>

    #include <bcm2835.h>

    ```


    ```

    void setTimeout(uint32_t timeout) {

    volatile uint32_t* timeout = bcm2835_bscl +

    BCM2835_BSC_CLKT / 4;

    bcm2835_peri_write(timeout, timeout);

    }

    ```'
