- img_proc: true
  md: 'For the Raspberry Pi, the Linux configuration is stored in /boot/cmdline.txt.

    Simply add:


    isolcpus = 3


    to the end of the list and reboot. When the machine starts up, core 3 will not

    used by the system. You can, however, still use thread affinity to run a user

    thread on core 3. There are other ways, such as cpu setc, to disable a core

    dynamically, but these suffer from problems like not removing any thread

    at is already running.


    For fixed tasks the best way to do the job is isolcpus. You can find out what

    cores are isolated using:


    ```

    cat /sys/devices/system/cpu/isolated

    ```


    The system will still occasionally interrupt a thread running on an isolated

    core, the interference is much less than encountered in normal

    scheduling.


    You can discover which cores are being used for interrupt handlers using the

    command:


    ```

    cat /proc/interrupts

    ```


    This gives you a list of interrupt numbers and the cores that have handled

    them. Some interrupts have names rather than numbers and these are the

    ones that you cannot tamper with. Isolated cores only handle interrupts that are

    essential – rescheduling interrupts for example.


    It is sometimes possible to control which cores are used for particular

    interrupts – as long as they have an interrupt number and as long as they

    support IO-APIC, and many do. There are none on the Raspberry Pi, for

    example. To discover which cores a particular interrupt can be handled used:


    ```

    cat /proc/irq/n/smp_affinity

    ```


    where n is the interrupt number. This returns a bit mask with the low-order

    bit corresponding to core 0. You can set the bit mask to determine which

    processors will handle the interrupt using:


    ```

    echo m > /proc/irq/n/smp_affinity

    ```


    where n is the interrupt number and m is the new mask.

    For example, to have all timer interrupts, irq 17, handled by core 0 you went

    use:


    ```

    echo “1” > /proc/irq/17/smp_affinity

    ```


    Note that if the interrupt is not IO-APIC compatible with you will get a read/write

    error. You also have to give the entire command as root, e.g. use sudo -1.'
  merge: -1
