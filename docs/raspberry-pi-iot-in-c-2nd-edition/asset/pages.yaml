  md: "The filter's cutoff is 17kHz and might be a little on the high side for this\
    \ low frequency output.\n\n![](img/175b89abfcdc9824337e5b1ac4bb1ef3_147_0.png)\n\
    \nWe can create a sine wave, or any other waveform we, using the same techniques,\
    \ for 400-800Hz is a practical upper limit on what can be managed.\n\nIf you already\
    \ know that the PWM outputs are used to create audio on the Pi, you might be wondering\
    \ how this is possible with an 800Hz upper limit? The answer is that there are\
    \ other clock sources, up to 500MHz, that can be used to drive the PWM lines.\
    \ If you change to mode 0, i.e. balanced output, the oscilloscope trace looks\
    \ different, but there is a lot spurious RF interference generated.\n\n# # Music\n\
    \nSo how can the Pi generate musical notes? The simplest solution is to settle\
    \ for a simple square wave. That, use the pulse period rather than duty cycle.\n\
    \nAs the frequency of middle C is 281.6Hz, using a clock rate of 9.6Mhz set to\
    \ a period of 34091 to get the correct frequency.\n\nSo to generate middle C you\
    \ could use:\n```c\n#include <stdio.h>\n#include <stdio.h>\n#include <stdlib.h>\n\
    #include <bcm2835.h>\n\nint main(int argc, char** argv) {\n    if (!bcm2835_init())\n\
    \        return 1;\n\n    bcm2835_gpio_fsel(18, BCM2835_GPIO_FSEL5);\n    bcm2835_pwm_set_clock(2);\n\
    \    bcm2835_pwm_set_mode(0, 1, 1);\n    int C = 34091;\n    bcm2835_pwm_set_range(0,\
    \ C);\n    bcm2835_pwm_set_data(0, C / 2);\n    return (EXIT_SUCCESS);\n}\n```"
