    \ C Debug\",\n  \"type\": \"cppdbg\",\n  \"request\": \"launch\",\n  \"program\"\
    : \"${config:remoteDirectory}/${relativeFilenameNoExtension}.exe\",\n  \"args\"\
    : [],\n  \"stopAtEntry\": false,\n  \"cwd\": \"${config:remoteDirectory}/${relativeFilename}\"\
    ,\n  \"environment\": [],\n  \"externalConsole\": false,\n  \"pipeTransport\"\
    : {\n    \"debuggerPath\": \"/usr/bin/gdb\",\n    \"pipeProgram\": \"C:/Windows/System32/OpenSSH/ssh\"\
    ,\n    \"pipeArgs\": [\n      \"-${config:sshUser}@${config:sshEndpoint}\",\n\
    \      \"pipecwd\": \"${workspaceFolder}\"\n    ]\n  },\n  \"MIMode\": \"gdb\"\
    ,\n  \"setupCommands\": [\n    {\n      \"description\": \"Enable pretty-printing\
    \ for gdb\",\n      \"text\": \"-enable-pretty-printing\",\n      \"ignoreFailures\"\
    : true\n    }\n  ],\n  \"sourceMapFile\": {\n    \"${config:remoteDirectory}/${relativeFilename}\"\
    : \"${filename}\"\n  },\n  \"preLaunchTask\": \"CopyBuildRemote\"\n]\n```\n\n\
    This specifies the location of all the files on the local and how to connect to\
    \ the remote machine. The preLaunchTask runs a task called CopyBuildRemote. As\
    \ its name suggests, it copies the files in the current folder and uses GCC to\
    \ build an debug information."
  merge: -1
  pgno: 392
- img_proc: true
  md: 'Third you need a tasks.json file which is listed at the end of this appendix.

    This contains the definitions of a number of tasks that are used to run and

    debug the program and some of them are useful as standalone tasks:


    +   - copyToRemote copies all files in the folder that the current file open in

    the editor is stored. Note it copies all of the files even if they

    haven''t changed.


    +   - copyHeader copies the single file specified in the setting.json as

    header from the remote machine to the workspace of the file currently

    open in the editor. This has to be invoked manually to make sure that

    the local machine has access to the header for debugging and

    IntelliSense purposes.


    +   - buildRemote runs GCC to create the .exe file. If the current file is

    helloworld.c the command is:

    `/home/pi/Documents/Cprojects/HelloWorld/

    helloworld.c -lbcn2835

    -o/home/pi/Documents/Cprojects/HelloWorld/helloworld.exe`


    +   - runRemote runs the file created by buildRemote


    +   - CopyBuildRunRemote runs a compound task which uses copyToRemote and

    buildRemote and runRemote used to build and run a remote program.


    +   - CopyBuildRemote runs a compound task which uses copyToRemote and

    buildRemote used to build a remote program so that another

    command can run it.


    +   - StopRemoteC stops all processes with the same name as the program

    being developed. This is sometimes used manually to stop programs

    that have been started manually.'
  merge: -1
  pgno: 393
- img_proc: true
  md: "The final file is c_cpp_properties.json:\n\n```\n{\n  \"configurations\": [\n\
    \    {\n      \"name\": \"Win32\",\n      \"includePath\": [\n        \"${workspaceFolder}/**\"\
    ,\n        \"C:/Program Files (x86)/mingw-w64/i686-8.1.0-posix-darwin-rt_v6-rev0/mingw-w32/i686-w64-mingw-w32/include\"\
    \n      ],\n      \"defines\": [\nn        \"DEBUG\",\n        \"UNICODE\"\n \
    \     ],\n      \"cStandard\": \"c99\",\n      \"elliSenseMode\": \"gcc-arm\"\n\
    \    }\n  ],\n  \"version\": 4\n}\n```\n\nThe Cstandard variable sets the version\
    \ of C used for IntelliSense syntax checking and has no effect on the compiler.\
    \ You need to set the version in two different places, settings.json for the compiler\
    \ and c_cpp_properties.json for the editor. The includePath variable sets the\
    \ folders that the editor looks for header files. In this case MinGW directory\
    \ for all the standard headers and the workspace folders for custom headers.\n\
    \n# Running And Debugging Remote\n\nWith the four files given above stored in\
    \ .vscode, we can now run the helloworld.c program on the remote machine.\n\n\
    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_394_0.png)\n\nIf you just want to build\
    \ and run the program all you have to do is open it in the editor and select Terminal,\
    \ Run Build Task or press Ctrl+Shift+B. The program will be automatically copied,\
    \ built and run and you will see"
  merge: -1
  pgno: 394
- img_proc: true
  md: "output in the Terminal window. If the program you run is an infinite loop you\n\
    need to manually run StopRemoteC to stop it.\n\nTo debug the program place some\
    \ breakpoints in:\n\n![](img/175b89abfcdc9824337e5b1ac4bb1ef3_395_0.png)\n\nSelect\
    \ the Run icon and then click on the Start debugging icon. The program\nis automatically\
    \ copied, built and run in debug mode. The debugger will\npause at the first breakpoint\
    \ and you can single-step and examine variables.\nWhen you are finished the Stop\
    \ icon.\n\n# # Remote IoT Programs\n\nRunning an IoT Program remotely is almost\
    \ the same, but with one difference\n– the use of the BCM 2835 and possibly other\
    \ non-standard libraries. The\nremote machine has the library installed and the\
    \ compiler can make use of\njust by using the -bcm2835 option but the local machine\
    \ doesn't have\ninstalled and doesn't need 2835 as the program is never run.\n\
    \nLet's try a simple example. Create a new folder called Blinky and create a file\n\
    called blink.c:\n\n```\n#include <bcm2835.h>\n#include <stdio.h>\nint main(int\
    \ argc, char **argv) {\n    if (!bcm2835_init()) {\n        return 1;\n    }bcm2835\
    \ gpio_fsel(RPI_BPLUS_GPIO_J8_07, BCM2835 GPIO_FSEL_OUTP);\n    while (1) {\n\
    \        bcm2835 gpio_write(RPI_BPLUS_GPIO_J8_07, HIGH);\n        bcm2835_delay(500);\n\
    \        bcm2835 gpio_write(RPI_BPLUS_GPIO_J8_07, LOW);\n        bcm2835_delay(500);\n\
    \    }\nbcm2835_close();\n    return 0;\n```"
  merge: -1
  pgno: 395
- img_proc: true
  md: "This attempts to use the local machine so immediately you will see an error:\n\
    \n```\n```\nEXPLORER                _cpp_properties.json  tasks.json\nOPEN EDITORS\n\
    vscode > Blinky > C blink.c\n  (C) _cpp_properties.json  vscode  1 #include <bcm2835.h>\n\
    \  ( ) tasks.json             2 #include <stdio.h>\n  (X) settings.json      \
    \    3 int main(int argc, char **argv) {\n  (C) blink.c_vscode.Blinky   4 if (bcm2835_gpio_init())\
    \ {\n    Blinky                     5 return 1;\n    Blinky                  \
    \   6 bcm2835_gpio_write(GPIO_0);\n  PROJECTS                  7 {\n    vscode\
    \                     8 bcm2835_gpio_write(GPIO_1);\n      C blink.c         \
    \       9 }\n      (C) _cpp_properties.json  10 bcm2835_gpio_delay(100);\n   \
    \   ( ) lifecycle             11 bcm2835_gpio_write(GPIO_0);\n      ( ) settings.json\
    \        12 bcm2835_gpio_delay(100);\n      ( ) tasks.json           13 bcm2835_close();\n\
    \      hello.world               14 return 0;\n```\n```\n\nHowever if you run\
    \ the program you will find the compiler doesn't return an error and the program\
    \ works. The reason is, that, on the remote machine bcm285.h is available as the\
    \ library file used by the linker. If you don't seeing errors that don't really\
    \ exist you can leave things as they are but it is very easy to copy the header\
    \ from the remote machine to the local machine using the copyHeaders task. This\
    \ creates a headers directory and copies bcm285.h into it. Now the reported error\
    \ should disappear and you should be able to run and debug the program in the\
    \ usual way. In a more general case you may have to copy multiple header files\
    \ to the local machine but you only need the header files as the program is actually\
    \ compiled on the remote machine.\n\nNotice also that if you run the program using\
    \ ctrl+shift+B you will have to use the StopRemote task to stop it.\n\nIf you\
    \ want to make sure that you have all of the ARM headers for your program you\
    \ can enter and run the following:\n\n```\n{\n  \"label\": \"copyARMHeaders\"\
    ,\n  \"type\": \"shell\",\n  \"command\": \"mkdir ${workspaceFolder}/include/;\
    \ sc -r ${config.sshUser}@${config.sshEndpoint}:/usr/include ${workspaceFolder}/include/\"\
    ,\n  \"problemMatcher\": {\n    \"presentation\": {\n      \"showReuseMessage\"\
    : true,\n      \"clear\": true\n    }\n  }\n}\n```"
  merge: -1
  pgno: 396
- img_proc: true
  md: "This copies all of the headers to a new include folder. You will also need\
    \ to add:\n\n#define __ARM_PCS_VFP\n\nto the start of some of your programs to\
    \ make all of the spurious intelligent errors go away. This symbol is defined\
    \ by the compiler at run time to select hardware or software floating point operations.\
    \ Programs that use headers that depend on the hardware specification generate\
    \ errors on the local machine as they don't know the configuration. Notice that\
    \ none of this has any effect on the program that runs on the remote machine it\
    \ simply suppresses errors that you see on the local machine as VS Code attempts\
    \ to find pre-compile errors.\n\nThe complete tasks.json is:\n\n```\n{\n  \"version\"\
    : \"2.0.0\",\n  \"tasks\": [\n    {\n      \"label\": \"copyToRemote\",\n    \
    \  \"type\": \"shell\",\n      \"command\": \"scp -r ${fileDirName} ${config:ssh}@${config:sshEndpoint}:${config:remoteDirectory}/\"\
    ,\n      \"problemMatcher\": [],\n      \"presentation\": {\n        \"showReuseMessage\"\
    : false,\n        \"clear\": true\n      }\n    },\n    {\n      \"label\": \"\
    copyHeader\",\n      \"type\": \"shell\",\n      \"command\": \"mkdir ${config:workspaceFolder}/headers/;\
    \ scp -r ${config:ssh}@${config:sshEndpoint}:${config:header} ${config:workspaceFolder}/headers/\
    \ \",\n      \"problemMatcher\": [],\n      \"presentation\": {\n        \"showReuseMessage\"\
    : false,\n        \"clear\": true\n      }\n    }\n  ]\n}\n```"
  merge: -1
  pgno: 397
- img_proc: true
  md: "```\n{\n  \"label\": \"buildRemote\",\n  \"type\": \"shell\",\n  \"command\"\
    : \"ssh ${config.sshUser}@${config.sshEndpoint}\\n      gcc -g -std=${config.std}\\\
    n      ${config:remoteDirectory}/${relativeFileDirname}/${fileBasename} ${config:remoteDirectory}/${relativeFileDirname}/\
    \      -o ${config:remoteDirectory}/${relativeFileDirname}/${fileBasenameNoExtension}.exe\"\
    ,\n  \"problemMatcher\": [],\n  \"presentation\": {\n    \"showReuseMessage\"\
    : false,\n    \"clear\": false\n  }\n},\n{\n  \"label\": \"runRemote\",\n  \"\
    type\": \"shell\",\n  \"command\": \"ssh ${config.sshUser}@${config.sshEndpoint}\\\
    n      '${config:remoteDirectory}/${relativeFileDirname}/${fileBasenameNoExtension}.exe'\n\
    \  \"problemMatcher\": [\n    \"\n  ],\n  \"presentation\": {\n    \"showReuseMessage\"\
    : true,\n    \"clear\": false\n  }\n},\n{\n  \"label\": \"CopyRunRemote\",\n \
    \ \"dependsOrder\": \"sequence\",\n  \"dependsOn\": [\n    \"copyToRemote\",\n\
    \    \"buildRemote\",\n    \"runRemote\"\n  ],\n  \"problemMatcher\": [],\n  \"\
    group\": {\n    \"kind\": \"build\",\n    \"isDefault\": true\n  }\n}\n```\n\n\
    399"
