  md: "To generate a pulse of a given length you can use:\n\n```\n#include <bcm2835.h>\n\
    #include <stdio.h>\nint main(int argc, char **argv) {\n    if (!bcm2835_init())\n\
    \        return 1;\n    bcm2835_gpio_fsel(RPI_BPLUS_GPIO_J8_07, BCM2835_GPIO_FSEL_OUTP);\n\
    \    volatile int i;\n    int n=10;\n    for(i=0;i<n;i++) {\n        bcm2835_gpio_write(RPI_BPLUS_GPIO_J8_07,\
    \ HIGH);\n        for(i=0;i<n;i++) {\n            bcm2835_gpio_write(RPI_BPLUS_GPIO_J8_07,\
    \ LOW);\n        }\n    }\n    bcm2835_close();\n    return 0;\n}\n```\n\nwhere\
    \ n is set to a value that depends on the machine it is running on. For a Pi Zero\
    \ we have a good fit to a straight line right down to small values of n take proportionally\
    \ longer than larger values of n. This is because the time to execute the delay\
    \ loop is faster than on the Pi Zero, but the time to access the GPIO line is\
    \ slightly longer.\n\nFor the Pi 2, Pi 3 or Pi Zero, for t greater than or equal\
    \ to 0.5 you can work out using:\n\n+   n = 100 * t - 8\n\nwith t in microseconds.\n\
    \nFor a Pi 4 we have:\n\n+   n = 186 * t - 13.5\n\nthis is only accurate for a\
    \ Pi n=10. For example, if you want 1-microsecond pulses on a Pi Zero then n=92\
    \ and the result can be seen:\n\n| +5us | +6us | +7us |\n|---|---|---|\n| Width:\
    \ | 1us |\n| Period: | 2us |\n| DutyCycle: | 50% |\n| Frequency: | 500KHZ |\n\n\
    The pulses that vary from about 1µs to 1.05µs, but this is enough for most applications."
