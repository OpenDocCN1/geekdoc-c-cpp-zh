  md: "Two static variables are needed to record a global state, bitcount, which records\
    \ how deep in the tree we are currently are, and deviceCount, which records how\
    \ many devices we have found so far:\n\n```\nstatic int bitcount = 0;\nstatic\
    \ int deviceCount = 0;\n```\n\nStatic variables are shared between all invocations\
    \ of a function. They are only initialized once, when the program starts, and\
    \ they are allocated on the heap not the stack.\n\nThe way to think about oneWIREScan,\
    \ and how to think about it if you were writing it from scratch, is that calling\
    \ it will process the bit indicated by the current value of bitcount. As you increment\
    \ bitcount before you call oneWIREScan, it will process all of the bits down to\
    \ 63 by repeatedly calling itself to process the next bit. Next we need to write\
    \ starting and ending conditions. This is fairly usual with recursion. If bitcount\
    \ is greater than 63 we have a full serial number and can move deviceCount by\
    \ one and zero bitcount to start over.\n\n```\nif (bitcount > 63) {\n    bitcount\
    \ = 0;\n    deviceCount++;\n}\n```\n\nSimilarly if bitcount is zero we need to\
    \ start a traverse of the tree by sending a presence pulse and then a search command.\
    \ If there are no devices on the bus we set bitcount to zero and return as there\
    \ is nothing to do.\n\n```\nif (bitcount == 0) {\n    if (presence(pin) == 1)\
    \ {\n        bitcount = 0;\n        return deviceCount;\n    }\n    deviceCount\
    \ = 0;\n    serial[deviceCount] = 0;\n    writeByte(pin, 0xF0);\n}\n```\n\nNow\
    \ we are ready to read the first or next bit - it doesn't really make a lot of\
    \ difference to what we have to do:\n\n```\nint b1 = readBit(pin);\nint b2 = readBit(pin);\n\
    ```"
  merge: -1
  pgno: 238
- img_proc: true
  md: "What we have to do however does depend on b1 and b2. The two simplest conditions\
    \ are if there are no conflicts on the bus and we simply need to set a 0 or a\
    \ 1:\n\n```\nif (b1 == 0 && b2 == 1) {\n    serial(deviceCount) >= 1;\n    writeBit(pin\
    \ 0);\n    bitcount++;\n    oneWireScan(pin, serial);\n}\nif (b1 == 1 && b2 ==\
    \ 0) {\n    serial(deviceCount) >= 1;\n    serial(deviceCount) |= 0x8000000000000000LL;\n\
    \    writeBit(pin,1);\n    bitcount++;\n    oneWireScan(pin, serial);\n}\n```\n\
    \nWe shift a 0 or a 1 to the serial number we are building up and then write a\
    \ 0 or a 1 to keep all of the slaves in the scan. Finally, this is where recursion\
    \ comes in, we increment bitcount and call oneWireScan again to process the next\
    \ bit. This is the part that worries most programmers, as long as you understand\
    \ that we get a complete new version of oneWireScan and it processes the next\
    \ bit just like the previous bit, then it all works.\n\nIf we get b1 and b2 equal\
    \ to one then we have an error condition and this terminates the processing of\
    \ the next bit:\n\n```\nif (b1 == 1 && b2 == 1) {\n    bitcount = 0;\n    return\
    \ deviceCount;\n}\n```\n\nNotice that you have to set bitcount back to zero, otherwise\
    \ it will be wrong the next time you call the function.\n\nThe most difficult\
    \ of the conditions to deal with is when there is a collision because you have\
    \ to explore both branches of the tree."
  merge: -1
  pgno: 239
- img_proc: true
  md: "Using recursion, however, this is fairly easy:\n\n```\nif (b1 == 0 && b2 ==\
    \ 0) {\n    serial[deviceCount] >= 1;\n    writeBit(pin, 0);\n    bitcount++;\n\
    \    oneWireScan(pin, serial);\n    serial[deviceCount] >= 1;\n    serial[deviceCount]\
    \ |= 0x800000000000000LL;\n    writeBit(pin, 1);\n    bitcount++;\n    oneWireScan(pin,\
    \ serial);\n}\n```\n\nAll that happens here is first that we record a 0 in the\
    \ serial number and send\na 0 to turn off all the devices with a 1 in this position.\
    \ Next we call\noneWireScan again to complete this version of the serial number.\
    \ When this\nreturns we have the completed 64-bit serial number and deviceCount\
    \ is\nincremented. Next we follow the other branch, recording a 1 in the serial\n\
    number and writing a 1 to turn off all of the devices with 0 in this position\
    \ as\nwe already have them in the array, and then call oneWireScan to find the\n\
    remaining bits.\n\nThat completes the function and the final instruction is:\n\
    \nreturn deviceCount;\n\nIf you try this will find it doesn't work. The reason\
    \ is very simple. In the\nconflict-handling part of the function it is assumed\
    \ that, when the first call to\noneWireScan returns, it is exactly where it was\
    \ before, i.e. at the same\nbit position, and is ready to continue down the new\
    \ branch of the tree. This is\ntrue as far the function is concerned, but the\
    \ devices on the bus have\nphysically moved and are no longer at the same bit\
    \ positions.\n\nIn the scan has completed. We are at bit 63 and need to start\
    \ a new\nscan. Not only do we need to start a new scan, we need to restore the\n\
    hardware to the position it was just before the call to oneWireScan.\n\nThis is\
    \ the reason that most programmers don't implement the scan as\nrecursive function\
    \ - the function is recursive but the hardware isn't. If we had\nhardware stack\
    \ we could simply push the state just before the call and then\npop it when the\
    \ call returned. We don't have a hardware stack, but it is very\neasy to restore\
    \ the state of the hardware."
