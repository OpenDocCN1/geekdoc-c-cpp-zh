  md: '+   - gpioget


    The gpioget command returns the state of the lines specified as text:

    gpioget chip name/number <offset 1> <offset 2>

    For example:


    ```

    gpioget 0 4 17

    will display the current state of GPIO 4 and GPIO 17 on gpichip0.

    ```


    +   - gpiomon


    The gpiomon command lets monitor changes in input lines using a poll system call:

    gpiomon options chip name/number <offset 1> <offset 2> ...


    The options:


    ```

    -n, --num-events=NUM exit after processing NUM

    -s, --silent don''t print event info

    -f, --rising-edge only process rising edge events

    -f, --falling-edge only process falling edge events

    -F, --format= FMT specify custom output format FMT

    ```


    Format specifications:

    %d: GPIO line offset

    %e: event type - falling edge, 1 - rising edge

    %s: seconds part of the event timestamp

    %n: nanoseconds part of the event timestamp


    For example to monitor GPIO 4 and GPIO 17 for any changes:


    ```

    @raspberrypi:~ $ gpiomon 0 4 17

    event: RISING EDGE offset: 4 timestamp: [1589563313.974056272]

    event: RISING EDGE offset: 17 timestamp: [1589563313.974694285]

    ```


