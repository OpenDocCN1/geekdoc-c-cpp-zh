- img_proc: true
  md: "To make use of this function we need a definition of the new struct. While\
    \ there is a definition in one of the Linux-specific headers, it is simpler to\
    \ explicitly add it to your program:\n\n```\nstruct sched_attr {\n    uint32_t\
    \ size;\n    uint32_t sched_policy;\n    uint64_t sched_flags;\n    int32_t sched_nice;\n\
    \    uint32_t sched_priority;\n    uint64_t sched_runtime;\n    uint64_t sched_deadline;\n\
    \    uint64_t sched_period;\n};\n```\n\nwith size as the size of the struct and\
    \ policy specifying the policy using the same constants as used earlier plus the\
    \ new SCHED_DEADLINE. The flags field is to control what happens if you fork the\
    \ thread and what to do if the time constraints aren't met and can be mostly set\
    \ to zero and ignored. The next two fields control what happens under SCHED_OTHER/BATCH\
    \ and SCHED_FIFO/RR respectively. The final three fields control SCHED DEADLINE.\
    \ To use these constants you need to add:\n\n```\n#include <linux/sched.h>\n```\n\
    \nThe function call has to be implemented as a Linux syscall you also need to\
    \ add:\n\n```\n#include <sys/syscall.h>\n```\n\n```\nint sched_setattr(pid_t pid,\
    \ const struct sched_attr *attr, unsigned int flags) {\n    return syscall(__NR_sched_setattr,\
    \ pid, attr, flags);\n}\n```\n\nThere is also a getter call:\n\n```\nint sched_getattr(pid_t\
    \ pid, struct sched_attr *attr, unsigned int size, unsigned int flags) {\n   \
    \ return syscall(__NR_sched_getattr, pid, attr, size, flags);\n}\n```\n\nThe whole\
    \ idea of EDS is any task that has to be done on a regular basis can be given\
    \ a guarantee it will not miss its appointments. For example, suppose you need\
    \ to check that a sensor is within range every few seconds. The actual reading\
    \ takes little time, but in a priority-based scheduler it could be that a high\
    \ priority task blocks access to the CPU for so long that multiple readings are\
    \ missed."
