  md: '# Chapter 14


    # DS18B20 Temperature Sensor


    Using the software developed in previous chapters we can connect and use the very
    popular DS18B20 temperature sensor without the need for external drivers.


    # The Hardware


    DS18B20 is available in a number of formats, but the most common makes it look
    just like a standard BJT (Bipolar Junction Transistor) which can sometimes be
    a problem when you are trying to find one. You can also get them made up into
    waterproof sensors complete with cable.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_220_0.png)


    No matter how packaged, they will work at 3.3V or 5V. The basic specification
    of the DS18B20 is:


    +   - Measures temperatures from -55°C to +125°C (-67°F to +257°F)

    - ±0.5°C accuracy from -10°C to +85°C

    - Thermometer resolution is user-selectable from 9 to 12 bits

    - Converts temperature to 12-bit digital word in 750ms (max)


    It can also be powered from the data line, making the bus physically only two
    wires - data and ground, however, this “parasitic power” mode is difficult to
    make work reliably and best avoided in an initial design. supply it with enough
    power during a conversion the has to connect it'
  merge: -1
  pgno: 220
