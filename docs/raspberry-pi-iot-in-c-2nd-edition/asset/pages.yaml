    | GPIO19 (19) (20) GND |

    | GPIO9 (21) (22) GPIO25 |

    | GPIO11 (23) (24) GPIO26 |

    | GND (25) (26) GPIO27 |

    | GPIO9 (27) (28) GPIO1 |

    | GPIO5 (29) (30) GND |

    | GPIO6 (31) (32) GPIO12 |

    | GPIO13 (33) (34) GND |

    | GPIO19 (35) (36) GPIO16 |

    | GPIO26 (37) (38) GPIO20 |

    | GND (39) (40) GPIO21 |


    42'
