- img_proc: true
  md: '# # Chapter 6


    # # Simple Input


    There is no doubt that input is more difficult than output. When you need to drive
    a line high or low you are in command of when it happens, but input is in the
    hands of the outside world. If your program isn''t ready to read the input, or
    if it reads it at the wrong time, then things just don''t work. What is worse,
    you have no idea what your program is doing relative to the event you are trying
    to capture. Welcome to the world of input.


    In this chapter we look at the simplest approach to input – the polling loop.
    This may be simple, but it is a good way to approach many tasks.


    Chapter 8 we look at more sophisticated alternatives – events and interrupts.


    # ## GPIO input


    GPIO input is a much more difficult problem than output the point of measurement
    and verification. For output at least you can see the change in the signal on
    a logic analyzer and know the exact time that it occurred. This makes it possible
    to track down timing problems and fine tune things with good accuracy.


    Input on the other hand is "silent" and unobservable. When did you read in the
    status of the line? Usually the timing line is with respect to other action that
    the device has. For example, you read the input line 20µs after setting the output
    line. But how do you know when the input line changed that 20 microseconds? The
    simple answer is in most cases you don''t.


    In some applications the times are long and/or unimportant but then they are critical
    and we need some strategies for monitoring and controlling events. The usual rule
    of thumb is to assume it takes as long to read a GPIO line as it does to set it.
    This means we can use the delay mechanisms that we looked at with regard to output
    for input as well.


    One common and very useful trick when you are trying to get the timing of input
    correct is to substitute an output command to a spare GPIO line and monitor it
    with a logic analyzer. Place the output instruction just before the input instruction
    and where you see the line change on the logic analyzer'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'should be close to the time that the input would be read in the unmodified
    program. You can use this to debug and fine tune and then remove the output statement.


    # Basic Input Functions


    We have already met the function that sets a GPIO line to input or output:

    `bcm2835_gpio_fsel(uint8_t pin,uint8_t mode)`


    To set the GPIO line of your choice to input simply:

    `BCM2835_GPIO_FSEL_INPT`


    for mode.

    Once set to input, the GPIO line is high impedance, it won''t take very much current,
    no matter what you connect it to. However, notice the Pi 3.3V logic and you should
    not exceed this value on an input line – for a full discussion of how to work
    with input the previous chapter.


    You can read its input state using:

    `uint8_t bcm2835_gpio_lev(uint8_t pin)`


    This is all there is to use GPIO line as an input, apart from the details of the
    electronics and the small matter of interrupts. Notice that the function even
    if the GPIO line is set to output – it reads the current level of the line as
    high or low.


    As introduced in the previous chapter you can also set the internal pull-up or
    pull-down resistors using:

    `bcm2835_gpio_set_pud(uint8_t pin, uint8_t pud)`


    where pin is specified in the usual way and can be any of:

    `BCM2835 GPIO_PUD_OFF

    BCM2835 GPIO_PUD_DOWN

    BCM2835 GPIO_PUD_UP`


    The default is OFF.


    # The Simple Button


    One of the most common inputs is the switch or button. If you want another external
    button you can use any GPIO line and the circuit explained in the previous chapter.
    That is, the switch has to have either a pull-up or pull-down resistor either
    provided by you or a built-in one enabled using software.'
  merge: -1
  pgno: 79
- img_proc: true
  md: "The simplest switch input program using an internal pull-up is:\n\n```\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n#include <bcm2835.h>\n\nint main(int argc, char**\
    \ argv) {\n    if (!bcm2835_init()) return 1;\n\n    bcm2835 gpio_fsel(RPI_BPLUS\
    \ GPIO_J8_07, BCM2835 GPIO_FSEL_INP);\n    bcm2835 gpio_set_pud(RPI_BPLUS GPIO_J8_07,\
    \ BCM2835_GPIO_UD_UP);\n\n    while (1) {\n        if (0 == bcm2835_gpio_lev(RPI_BPLUS_GPIO_J8_07))\
    \ {\n            printf(\"Line Low \\n\\r\");\n            fflush(stdout);\n \
    \       }\n        return 0;\n    }\n}\n```\n\nAs the internal pull-up resistor\
    \ is used, the switch can be connected to the line without any external resistors:\n\
    \n![](img/175b89abfcdc9824337e5b1ac4bb1ef3_80_0.png)\n\nThe program simply waits\
    \ for the line to be pulled low by the switch being closed.\n\nShould you use\
    \ an internal or external resistor? The answer is that it mostly doesn't matter\
    \ as long as there is a resistor. The only problem with using an internal resistor\
    \ is the possibility that the software fails to set the pull-up/down mode and\
    \ leaves the input floating."
  merge: -1
