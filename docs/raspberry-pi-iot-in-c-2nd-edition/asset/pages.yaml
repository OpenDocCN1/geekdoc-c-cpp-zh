  md: '# GPIO Chapter 9


    # Pulse Width Modulation - Servos And More


    One way around the problem of getting a fast response from a microcontroller is
    to move the problem away from the processor. In the case of the Pi''s processor
    there are some built-in devices that can use GPIO lines to implement protocols
    without the CPU being involved. In this chapter we take a close look at Pulse
    Width Modulation (PWM) including generating sound, driving LEDs and servos.


    When performing their most basic function, i.e. output, the GPIO lines can be
    set high or low by the processor. How fast they depends on the speed of the processor.


    Using the GPIO line in its Pulse Width Modulation (PWM) mode you can generate
    pulse trains up to 4.8MHz, i.e. pulses as short as just a little more than 0.08us.
    You can go further if you are prepared to do some additional work. The reason
    for the increase in speed is that the GPIO is connected to a pulse generator and,
    once set to generate pulses of a specific type, the pulse generator gets just
    on it without needing any intervention from the GPIO line or the processor. In
    fact, the pulse output can continue after your program has ended if you forget
    to reset it.


    Of course, even though the PWM line can generate pulses each time that the processor
    can modify them. For example, you can''t use PWM to produce a single 0.1us pulse
    because you can''t disable the PWM generator in 0.1us.


    # Some Basic Pi PWM Facts


    There are some facts getting clear right from the start, although some of their
    significance will only become clear as we progress.


    First, what is PWM? The simple answer is that a Pulse Width Modulated has pulses
    that repeat at a fixed rate - say one pulse every millisecond, but the width of
    the pulse can be changed.'
  merge: -1
  pgno: 136
- img_proc: true
  md: 'There are two basic things to specify about the pulse train that is generated,
    its repetition rate and the width of each pulse. Usually the repetition rate is
    set as a simple repeat period and the width of each pulse is specified as a percentage
    of the repeat period, referred to as the duty cycle.


    So, for example, a 1ms repeat and a 50% duty cycle cycles a 1ms period, which
    is high for 50% of the time, i.e. a pulse width of 0.5ms. The two extremes are
    100% duty cycle, i.e. the line is always high, and 0% duty cycle, i.e. the line
    is always low.


    Notice it is the duty cycle that carries the information in PWM and not the frequency.
    What this means that you generally select a repeat rate and stick to it and what
    the program runs is the duty cycle.


    In many cases PWM is implemented using special PWM-generator hardware that is
    built into the processor chip or provided by an external chip. The processor simply
    sets the repeat rate by writing to a register and then changing the duty cycle
    by writing to another register. This generally provides the best sort of PWM with
    no load on the processor and, generally, glitch-free operation. You can even buy
    add-boards that will provide additional channels of PWM without adding to the
    processor.


    The alternative to dedicated PWM hardware is to implement it in software. You
    can quit easily work out how to do this. All you need is to set a timing loop
    to set the line high at the repetition rate and then set it low again according
    to the duty cycle. You can implement this either using interrupts or a polling
    loop and in more advanced ways, such as using a DMA (Direct Memory Access) channel.


    In the case of the Pi, the PWM lines are implemented using special PWM hardware.


    The big problem is, although there are two PWM implementations, which are available,
    the second PWM is used for sound generation. However as long as you don''t want
    to use sound, you can use both PWM channels on the Pi 4 and Pi Zero. Usually and
    this is enough to run two servos or motors. The main PWM channel zero is brought
    out on the connector on pin 2 GPIO 18. The secondary channel, which is also used
    by the system for sound generation, is brought out on the connector on pin 35
    GPIO 13 – obviously you can only use it if you don''t want sound generation.


    Both PWM lines are driven by the same clock and sometimes causes people to conclude
    that the two lines work at the same repeat rate. Although there are restrictions,
    each PWM line can be set to its own repeat.'
  merge: -1
  pgno: 137
- img_proc: true
  md: 'Two PWM lines is limiting and often forces users to either use hardware expansion
    or implement PWM in software.


    As you can guess, there are no PWM inputs, just output. If for some reason you
    need to decode, or respond to, a PWM input then you need to program it using the
    GPIO input lines and the pulse measuring techniques introduced in the previous
    chapters.


    # PWM Modes


    The PWM hardware is more sophisticated than you might have encountered before.
    The first big difference is that it can work in two modes, mark/space or balanced.
    In fact there are even more options, but these are the only two that have a common
    use.


    The PWM signal is generated using two counters, range and data. The range counter
    counts down the current clock rate and PWM generation starts over when it reaches
    zero. In mark/space mode the data counter starts counting down the same time as
    the range counter and when it reaches zero the output is inverted. In other words,
    range gives the repeat rate and sets the duty cycle, both in terms of the underlying
    clock:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_138_0.png)


    You can see that in mark/space mode the PWM signal is high for data clock pulses
    and low for range-data clock pulses.


    In mark/space mode you set the duty cycle as the ratio of data to range and the
    line stays high for Data clock pulses. This is fine for many common PWM devices
    such as a servo motor, but for applications that only need the power transfer
    provided by PWM it isn''t so good. The reason is that, despite the clock frequency
    being high, the actual PWM frequency is much lower. Instead'
  merge: -1
  pgno: 138
- img_proc: true
  md: "of holding the high line for one continuous time period, an alternative is\
    \ to distribute the time that it is high across the entire period - this is balanced\
    \ mode. Its advantage is that you get the same duty cycle spread out the entire\
    \ period range.\n\nFor example, suppose you want a 1kHz pulse train with a 50%\
    \ duty cycle to deliver half power or voltage to a device. The mark/space way\
    \ of doing this switches the GPIO line on 500µs and for 500µs. The fluctuations\
    \ in voltage are very slow and this causes problems for the driven device. A better\
    \ way would be to divide the time into some, 1µs blocks and spread the on and\
    \ off times throughout the block. In this case the device would be high for 1µs\
    \ and low for 1µs and the filtering problems would be much easier to solve.\n\n\
    The algorithm for achieving the distribution of the \"high\" time across the full\
    \ range period is given in the ARM manual as:\n\n```\ncontext = 0;\nfor(i=0;i<range;i++)\
    \ {\n    context = context + data;\n    if(context >= range){\n        context\
    \ = context - range;\n        set line high\n    }else{\n        set line low\n\
    \n```\n\nSuppose range is 8 and 4, giving a 50% duty cycle, then the algorithm\
    \ generates:\n\n| clock | 1 2 3 4 5 6 7 8 |\n| context | 4 8 4 8 4 8 4 8 |\n|\
    \ line | 0 1 0 1 0 1 0 1 |\n| mark/space mode | 1 1 1 1 0 0 0 0 |\n\nIt is clear\
    \ that range sets the repeat rate and data sets the duty cycle in both modes.\
    \ Obviously using this way of specifying repeat rate and duty cycle means that\
    \ you can select more one range and data value for any given duty cycle, only\
    \ the ratio of the two matters. For example, a range of 4 and data of 2 is also\
    \ a 50% duty cycle. So do you choose a suitable pair of values?\n\nThe range gives\
    \ you the possible number of duty steps you can use. For example, for a range\
    \ of 2 you modify the duty cycle to 0%. 50% or 100% by setting data to 0, 1 or\
    \ 2. A range of 512 gives you 512 steps and is usually called 8-bit PWM and a\
    \ range of 1024 gives you 1024 duty cycle steps and is called 16-bit PWM."
  merge: -1
