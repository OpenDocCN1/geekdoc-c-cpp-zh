  md: "The complete program is:\n#include <string.h>\n#include <stdio.h>\n#include\
    \ <errno.h>\n#include <unistd.h>\n#include <cntl.h>\n#include <sys/ioctl.h>\n\
    #include <Linux/gpio.h>\n#include <sys/epoll.h>\n\n```\nint main(int argc, char\
    \ **argv) {\n    int fd, ret;\n\n    struct gpioevent_request req;\n    req.lineoffset\
    \ = 4;\n    req.handleflags = GPIOHANDLE_REQUEST_INPUT;\n    req.eventflags =\
    \ EPOLL_REQUEST_RISING_EDGE;\n    strcpy(req.consumer_label, \"Event test\");\n\
    \n    fd = open(\"/dev/gpio0\", O_RDONLY);\n    ret = ioctl(fd, GPIO_GET_LINEVENT_IOCTL,\
    \ &req);\n    close(fd);\n\n    static struct epoll event ev;\n    ev.events =\
    \ EPOLL;\n    ev.data.fd = fd;\n    int epfd = epoll_create(1);\n    int res =\
    \ epoll_ctl(epfd, EPOLL_CTL_ADD, req.fd, &ev);\n\n    int nfds = epoll_wait(epfd,\
    \ &ev, 1, 20000);\n    if (nfds <= 0) {\n        struct gpioevent_data edata;\n\
    \        read(req.fd, &edata, sizeof(edata));\n        printf(\"%u,%lu\\n\", edata.id,\
    \ edata.timestamp);\n    }\n}\n\n```\n\nYou can set up multiple GPIO loops to\
    \ generate events. Also notice that the file that triggered the event might have\
    \ more than one gpio struct ready to read. You have to read the data that is ready\
    \ to clear the event. One of the advantages of the new interface is that events\
    \ are not lost and they are timestamped so you know when they happened.\n\nTo\
    \ find out how fast epoll works you can add a command to toggle an line after\
    \ the read of each event. You can see from the logic analyzer that it takes about\
    \ 30us per input and the maximum input frequency is around 28kHz. This is a bit\
    \ slower than the 1.2MHz of the level- or event-detecting polling loops given\
    \ earlier."
