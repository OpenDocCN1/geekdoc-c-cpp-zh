- img_proc: true
  md: 'The pins that are used for the Pi''s SPI bus are:


    | Function | GPIO | Pin | Direction |

    |---|---|---|--|

    | MOSI | GPIO10 | 19 | Out |

    | MISO | GPIO9 | 21 | In |

    | SCLK | GPIO11 | 23 | Out |

    | CE0 | GPIO8 | 24 | Out |

    | CE1 | GPIO7 | 26 | In |


    The data transfer on the SPI bus is slightly odd. What happens is that the master
    pulls one of the chip selects low, which activates a slave. Then the master toggles
    the clock SCLK and both the master and the slave a single bit on their respective
    data lines. After eight clock pulses, a byte has been transferred from the master
    to the slave and from the slave to the master. You can think of this as being
    implemented as a circular buffer, although it doesn''t have to be.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_292_0.png)


    This full-duplex data transfer is often hidden by the software and the protocol
    used. For example, there is a read function that reads data from the slave and
    sends zeros data that is ignored by the slave. Similarly, there is a write function
    that sends valid data, but ignores whatever the slave sends. The transfer is typically
    in groups of eight bits, usually most significant bit first, but this isn''t always
    the case. In, as long as the master supplies clock pulses, data is transferred.


    Notice this circular buffer arrangement for slaves to be daisy-chained with the
    output of one going to the input of the next. This makes the entire chain one
    big circular shift register. This can make it possible to have multiple devices
    with only a single chip select, but it also means commands sent to the slaves
    are received by each one in turn. For example, you could send a convert command
    to each AtoD converter in turn and receive back results from each one.'
