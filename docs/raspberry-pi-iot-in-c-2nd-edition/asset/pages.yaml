- img_proc: true
  md: '# Chapter 19


    # Connecting With The Web - Sockets


    It is fairly easy to get the Pi on the Internet either via a wired connection
    or a USB WiFi device. However, there is the small matter of software. If you want
    to get data out of a device the best idea is to allow it to serve a web page.
    If you want to get data into a device then what better than to get it to read
    a web page. Getting the Pi on the web doesn''t require a browser or a server -
    in fact all you need is some socket code.


    Sockets are general-purpose way of communicating over networks and infrastructure.
    Essentially they are a generalization of streams to things other storage devices.
    The main problem is that they are called "sockets", which sounds strange. In addition
    they are so general purpose that it can be difficult to see what you can do with
    them.


    To send web data, an HTML page or JSON data, many programmers think of a web server
    and that the next step is to install and configure Apache. This is usually far
    too big a solution to a small problem.


    It is very easy to implement a simple web server or a web client using sockets
    and in this chapter you will discover how versatile they can be. All sockets do
    transport data from one point to another, so you can use them to communicate using
    almost any standard protocol, like HTTP, or a custom protocol of your own devising.


    # Socket Basics


    The basic steps in using a socket are fairly simple:


    +   1. Create socket

    2. Connect the socket to an address

    3. Transfer data


    Sockets connect to other sockets by their addresses. The simplest case is where
    there are just two sockets, or two endpoints, communicating. Once the connection
    is made, the two sockets operate in more or less the same way. However, in general
    one of the sockets, the client, will have initiated the connection; and the other,
    the server, will have accepted it.'
  merge: -1
  pgno: 312
- img_proc: true
  md: 'There is a conceptual difference between a client and a server socket. A server
    socket is set up and then it waits for clients to connect to it. A client socket
    actively seeks a connection with a server. Once connected, data can flow in both
    directions and the difference between the two ends of the connection becomes less.


    The key idea is that a socket is implemented to make it look as much like a standard
    Linux file as possible. This conforms with a general principle of Linux that any
    I/O facility should follow the conventions of a file.


    # # Socket Functions


    The basic socket functions that you need to know are:


    +   - Create a socket


    ```

    sockfd = socket(int socket_family, int socket_type, int protocol);

    ```


    This returns a socket descriptor, an int, which you use in other socket functions.


    The socket_family is where you specify the type of communications link to use
    and where this sockets are most general. There are lots of communications methods
    that sockets can use, including AF_UNIX or AF_LOCAL, which don''t use a network,
    but allow intercommunication between processes on the same machine. In most cases,
    you are going to be using AF_INET for IPv4 or AF_INET6 for IPv6 networking.


    The socket_type specifies the general protocol to be used. In most cases you will
    use SOCK_STREAM which specifies a reliable two-way connection - for IP communications
    means this TCP/IP is used. For some applications you might want to use SOCK_DGRAM
    which specifies that the data should be sent without confirming that it has been
    received. This is a broadcast mechanism that corresponds to UDP communications.


    The protocol parameter selects a sub-protocol of the socket type. In most cases
    you can simply set it to zero.


    As we are going to be working with sockets that basically work with the web we
    will use AF_INET and SOCK_STREAM.'
  merge: -1
