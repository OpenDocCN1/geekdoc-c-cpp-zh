- img_proc: true
  md: 'This means that you can always use serial0 to mean the serial port on which
    Linux has opened a console and serial1 as the alternative serial port that might
    be used for something else.


    If you disable Bluetooth, or swap the roles of the UARTS as explained earlier,
    after a reboot you will see:


    ```

    serial0 -> ttyAMA0

    serial1 -> tty0

    ```


    and now the system console is the full UART and the Bluetooth is either disabled
    or using the Pi-UART.


    If you are using a Pi 4 you can enable the alternative UARTS by adding:

    ddtolay = uartn


    where n ranges from 0 to 5, /boot/config.txt

    sudo nano /boot/config.txt


    This, after reboot, enables the UART on the pins given in the earlier table. You
    can, for UARTs 2 to 5, include the parameter ctsrts to enable the associated CTS/RTS
    pins. For example:


    dtoverlay = uart3,ctsrts


    enables UART3 with TX on GPIO4, RX on GPIO5 and CTS/RTS on GPIO6 and GPIO7. In
    most cases you won''t control the lines and so:


    ```

    dtoverlay = uart3

    ```


    is more common.


    # Getting Rid Of The Console


    We come to a difficult problem. Serial interfaces have long been the way that
    Linux, and Unix before it, connected to the outside world. As a result, there
    is support for serial consoles built in to the kernel. When Linux boots up it
    configures at least one serial interface to work as a console.


    What this is that your program cannot simply connect to the serial interface because
    Linux is already using it. What happens when something connects to the serial
    interface is that Linux issues the prompt to log in and then presents the user
    with a command interface.


    If this is what you want to do, then you can make a serial connection to the Pi
    either over the full serial interface or over a USB connection. This isn''t difficult,
    but it is not what we are trying to do. We want our programs to have full control
    of the serial interface so as to be able to send and receive what they want, without
    any interference from the operating system.'
  merge: -1
  pgno: 261
- img_proc: true
  md: 'Whichever UART is assigned to serial0, Linux will use it as a console. This
    is exactly what you want if you plan to connect using a terminal program such
    as PuTTY or minterm. If you do this you will see the usual logon appear and you
    can start using Linux as normal.


    This is not what you want to happen if you are writing a program to transfer commands
    and data to another device. To stop Linux responding to you have to stop it using
    serial0 as a console. There are a number of ways of doing this. The simplest is
    to use:


    ```

    sudo raspi-config

    ```


    Select Advanced and disable the serial console in the GUI that appears:


    | A1 Overscan | You may need to configure oversca |

    | A2 Hostname | Set the visible name for this memory |

    | A3 Memory Split | Change the amount of memory for this Pi |

    | A4 SSH | Enable/Disable remote command lin |

