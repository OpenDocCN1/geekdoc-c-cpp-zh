    20215000-2021508f : aux@7e215000

    20300000-203000ff : mmc0@7e300000

    209b0000-209bffff : dwc_otg

    ```


    The addresses on the left give the virtual addresses that you would use in programs
    and devices that run on the CPU and under Linux. The values on the right are the
    physical addresses.


    # Linux Memory Access


    If you recall the discussion in Chapter 7 on the GPIO character device, Linux
    likes to have every I/O device taken as much like a file as possible. This is
    a basic principle of Unix that Linux has to heart and and, in the main, it sometimes
    you have to think that we are going the long way around to get a job done. For
    example, how do you think Linux gives your user mode program access to raw memory?
    Yes, that is correct. It represents memory as a single binary file /dev/mem.


    This is a character device file that is in user mode memory. When you read or
    write b n this is the same as reading and writing the memory location at address
    n. You can move the pointer to any memory location using lseek and read and write
    blocks of bytes using read and write. If you want to know more about this, see
    Applying C For The IoT With Linux


    ISBN:978187192611'
  merge: -1
  pgno: 341
- img_proc: true
  md: 'It is simple but it takes time to get used to the idea. For example, to open

    the file to read and write you might use:

    int memfd = open("/dev/mem", 0, O_SYNC);


    The RDWR opens the file for read and write the O_SYNC flag makes the

    call blocking. You have to root access to open /dev/mem. If you want to

    run the program with lower privileges then can use /dev/gpiom instead

    but this only gives you access to the GPIO registers.


    After this you can seek the memory location you want to work with. For

    example, for a Pi Zero/1 to go the start of the GPIO registers you would use:

    uint32_t p = seek(memfd, (off_t) 0x02000000, SEEK_SET);


    A better way is:


    ```

    uint32_t p = seek(memfd, (off_t) bcm2835_peripherals base + +

    BCM2835_GPIO_BASE, SEEK_SET);

    ```


    which works on any Pi.

    Notice that bcm2835_peripherals_base is only set correctly after you have

    initialized bcm2835.


    Next you could read the 32 bytes starting at location, it is the F5L0

    register:


    ```

    int n = read(memfd, buffer, 4);

    ```


    This is how it is supposed to work, but it often doesn''t and in the case of

    Pi you will usually get a "Bad Address Error" or something similar. The reason

    for this is the /dev/mem file isn''t intended to be used in this way and

    it read and write functions are not defined for the device. This doesn''t matter

    cause it isnt the usual way that /dev/mem file is used to access the

    hardware, as discussed in the next section.


    # Memory Mapping Files


    The Linux approach to I/O places the emphasis on files, but there are times

    when reading and writing a file to an external device like a disk drive is too

    slow. To solve this problem, Linux has a memory mapping function which

    will read any portion of a file into user memory so that you can work with

    directly using pointers. In principle, it is a very fast way to access any file,

    in /dev/mem.


    This seems like a crazy roundabout to get at memory. First implement

    memory access as a file you read and then map that into memory so

    to read as if it was memory, which it is. However, if you follow

    the story, it is logical. What is more, it solves a slightly different problem

    elegantly. It allows the fixed physical addresses of the peripherals into the'
  merge: -1
  pgno: 342
- img_proc: true
  md: "user space virtual addresses. In other words, when you map the /dev/mem file\
    \ into user memory it can be located anywhere and the address of the start of\
    \ the register area will be within your program's allocated address space. This\
    \ means that all of the addresses we have been listing will change. Of course,\
    \ as long as we work with offsets from the start of memory, this is no problem\
    \ - we update the starting value and use the same offsets.\n\nLet's see how this\
    \ works in practice. The key function is mmap:\n\n```\nvoid *mmap(\n    void *addr,\n\
    \    size_t length,\n    int prot,\n    int flags,\n    int fd,\n    off_t offset\n\
    );\n```\n\nThe function maps the file corresponding to the file descriptor fd\
    \ into memory and returns its start address. The offset and length parameters\
    \ control the portion of the file mapped, i.e. the mapped portions starts at the\
    \ byte given by offset and continues for length bytes.\n\nThere is a small complication\
    \ in that, for the sake of efficiency, the file is always mapped in units of the\
    \ page size of the machine. So if you ask for a 1kB file to be loaded into memory\
    \ then, the Pi with a 4kB page size, 4kB of memory will be allocated. The file\
    \ will occupy the first 1kB and the rest will be zero.\n\nYou can also specify\
    \ the address that you would like the file loaded to your program's address, but\
    \ the system doesn't have to honor this request - it uses it as a hint. Some programmers\
    \ reserve an area of memory using malloc and then ask the system to load the file\
    \ into it. As this might not happen it seems simpler to let the system allocate\
    \ the memory and return NULL as the starting address.\n\nThe prot and flags fields\
    \ specify various ways the file can be memory-mapped and there are a lot of options,\
    \ some its map page for details.\n\nNotice that this is a completely general mechanism\
    \ and you can use it to map any file into memory. For example if you have a graphics\
    \ file, image.gif, then you could load it into memory to make working with it\
    \ faster. Many databases use this technique to speed up their processing."
  merge: -1
  pgno: 343
- img_proc: true
  md: 'Now all we have to do is map /dev/mem into memory. First we need to open

    the /dev/mem device as usual:

    uint32_t memfd = open("/dev/mem", O_RDWR | O_SYNC);


    As long as this works, and you have to have root access, we can map the file

    to memory.

    We want to map the file starting at 0x20200000 for the Pi 1/Zero, at

    0x3F200000 for the Pi 2/3 or 0xFE00000 for the Pi 4. If we only want to

    work with GPIO registers then we only need offsets of 00B0, i.e.

    176 bytes, but as we get a complete 4kB page, we might have map 4kB

    worth of address. Using the Pi Zero starting address this is:


    ```

    uint32_t * map = (uint32_t*)mmap(

    NULL,

    *1024,

    (PROT_READ | PROT_WRITE,

    MAP_SHARED,

    memFd,

    0x20200000);

    ```


    If you this remember to change the offset to be correct for the Pi you are

    using. A better alternative is to use bcm2835_peripherals_base to specify the

    address:

    (off_t) bcm2835_peripherals_base + BCM2835_GPIO_BASE


    Also notice that we haven''t set an address for the file to be loaded into, the

    system will take care of it and return the address in map. We also have asked

    read/write permission and allowed others to share the map. This

    makes map a very important variable because now it gives the location of the

    start of the GPIO register area, but in user space.


    Now we can read and map a 4kB block of addresses starting at the first GPIO

    register, i.e. FSEL0. For example, to read and print the current value of FSEL0

    we would:

    printf("fsel0 %%X\r\n", *map);


    To access the other registers we need to add offsets, but there is one

    ub difference. The pointer to the start of the memory has been cast to a

    uint32_t because we need to read and write 32-bit registers. However, the

    rules of pointer arithmetic, when you add one to a pointer you actually add

    the size of the data type the pointer is pointing to. In this case, when you add

    one to map you increment the location it is pointing at by four, i. the size of

    32-bit unsigned integer.


    The rule is that with this cast we are using word addresses, which are byte

    addresses divided by 4. Then when we add the offsets we need to add them

    divided by 4. With this all clear''s write a program that toggles GPIO4 as

    fast as possible.'
  merge: -1
  pgno: 344
- img_proc: true
  md: "# Fastest Pulse\n\nFirst we need to set GPIO4 to output. This is controlled\
    \ by FSEL0 and bits 12 13 and 14 which we want to set to 001, i.e. we need to\
    \ store 0x1000 in FSEL0:\n\n```\n*paddr=0x1000;\nWith GPIO4 set to output we now\
    \ need to use the SET0 and CLR0 registers to set the line high and low. As we\
    \ want to do this as fast as possible we need to precompute the addresses of SET0\
    \ and CLR0:\nvolatile uint32_t* paddr1 = map + 0x1C/4;\nvolatile uint32_t* paddr2\
    \ = map + 0x28/4;\n```\n\n```\nfor(;{\n    *paddr1=0x10;\n    *paddr2=0x10;\n\
    }\n```\n\nThe complete program is:\n\n```\n#include <stdio.h>\n#include <stdlib.h>\n\
    #include <bcm2835.h>\n#include <sys/mman.h>\n#include <errno.h>\n#include <string.h>\n\
    #include <unistd.h>\nint main(int argc, char** argv) {\n    if (!bcm2835_init())\
    \ {\n        return 1;\n    }\n    uint32_t memfd = open(\"/dev/mem\", O_RDWR\
    \ | O_SYNC); (uint32_t *) map(\n        NULL,\n        4 * 1024,\n        (PRO_READ\
    \ | PRO_WRITE),\n        MAP_SHARED,\n        memfd,\n        (off_t) bcm2835_peripherals_base\
    \ + bcm2835_GPIO_BASE);\n    if (map == MAP_FAILED) {\n        printf(\"map failed:\
    \ %s\\n\", strerror(errno));\n    }close(memfd);\n    volatile uint32_t* paddr\
    \ = map;\n    *paddr = 0x1000;\n    volatile uint32_t* paddr1 = map + 0x1C / 4;\n\
    \    volatile uint32_t* paddr2 = map + 0x28 / 4;\n    for (;{\n        *paddr1\
    \ = 0x10;\n        *paddr2 = 0x10;\n    }\n    return (EXIT_SUCCESS);\n}\n```"
  merge: -1
  pgno: 345
- img_proc: true
  md: "If you run this program you will discover that it generates pulses that are\n\
    small as 20ns on a Pi Zero. On a Pi 4 the results are more surprising. The\nsmall\
    \ pulses are 0.01µs but they are very irregular:\n\n![](img/175b89abfcdc9824337e5b1ac4bb1ef3_346_0.png)\n\
    \nThe top trace is a Pi Zero and the bottom trace is a Pi 4. You can see that\
    \ the\nmulticore architecture of the Pi 4 limits the rate at which data can be\n\
    transferred to the GPIO lines. The reason for this, as discussed below, is the\n\
    use of memory barriers to allow the reordering of instructions.\nTo make the work\
    \ for the Pi 4 you need to calls to enforce\nmemory barriers. Change the for loop\
    \ to read:\n\n```\nfor (;\n  sync_synchronize();\n  *paddr1 = 0x10;\n  sync_synchronize();\n\
    \  *paddr2 = 0x10;\n)\n```\n\nThe sync_synchronize() function is a built-in function\
    \ provided by the\nGCC compiler places a full memory barrier between the instructions.\n\
    Now when you try the program you will discover that the Pi Zero is slower,\nat25ns,\
    \ due to the use of barriers, but the Pi 4 is now producing a regular\npulse train\
    \ of 80ns:\n\n![](img/175b89abfcdc9824337e5b1ac4bb1ef3_346_1.png)\n\nThis is as\
    \ fast as you can go memory-mapped file access. As before, the\nquality of the\
    \ pulses is such that it is difficult to measure an exact pulse\nwidth."
  merge: -1
  pgno: 346
- img_proc: true
  md: "Because of all the complexities and differences between the different models\
    \ of the Pi, you are much better off using the bcm2835 library which uses exactly\
    \ these techniques to work with the GPIO and isn't much slower than a custom-code\
    \ approach.\n\nLet's look at the lower-level functions that the library provides.\n\
    \n# Low Level Register Access\n\nThe bcm2835 library provides a small number of\
    \ functions that will access any register you need to. It makes use of the /dev/mem\
    \ file and the mmap function and it works in more or less the way described above.\
    \ The big advantage is that it sets up so that the addressing is correct for the\
    \ current, and presumably future, versions of the Pi. The map is set up so it\
    \ starts on every model of Pi at the peripheral's start address:\n\nPi 1\n\n```\n\
    #define BCM2835_PERI_BASE                0x20000000\n```\n\nPi 2/3/Zero\n\n```\n\
    #define BCM2835_RPI2_PERI_BASE        0x3F000000\n```\n\nPi 4\n\n```\n#define\
    \ BCM2835_RPI4_PERI_BASE        0xFE000000\n```\n\nAll of the addresses used in\
    \ the bcm2835 library are relative to these values and are the same for all versions\
    \ of the Pi. The only complication is that the documentation uses legacy addresses.\
    \ The Pi 4 documentation says:\n\n> \"So a peripheral described in this document\
    \ as being at legacy address 0x7Ennn_nnnn is available in the 35-bit address space\
    \ at 0x47En_nnnn, and visible to the ARM at 0x0FE7nn_nnnn if Low Peripheral mode\
    \ is enabled.\"\n\nWhat means is when the documentation gives the address 0x7E200000,\
    \ making the offset from the start of the GPIO registers, you use 0xFE200000,\
    \ making the offset The final complication is that the memory is organized as\
    \ 32-bit words each address addressed individually and so, i.e. 0x20000000/4 =\
    \ 0x80000000.\n\nThere are two read and write functions:\n\n+   - uint32_t bcm2835_peri_read\
    \ (volatile uint32_t *paddr)\n- uint32_t bcm2835_peri_read_nb (volatile uint32_t\
    \ *paddr)\n\n+   - void bcm2835_peri_write (volatile uint32_t *paddr,\n  uint32_t\
    \ value)\n- void bcm2835_peri_read_nb (volatile uint32_t *paddr,\n  uint32_t value)"
  merge: -1
  pgno: 347
- img_proc: true
  md: 'The difference between them is the use of read/write barriers. This is something
    that has been ignored until now. The processor allows operations to occur in an
    asynchronous way. This means that it is possible for results to occur in a different
    order to the one in which you programmed them. This can only happen on the first
    access to a peripheral. If you read or write to a peripheral for the first time
    you need to use a memory barrier that ensures access occurs in the order you would
    expect. Subsequent reads and writes don''t need such a barrier. If you write to
    another peripheral and go back to the first, you need to use a barrier again.
    In short, you need a barrier at the start of any consecutive peripheral accesses.
    It is always safer to use standard read/write functions that apply a barrier than
    the _nb, non-barrier, functions, however the latter is slightly faster.


    As well as the basic read/write functions we also have a function: void volatile
    uint32_t peri_bits *paddr, uint32_t value, uint32_t mask


    This will set the bits defined in the mask to the value specified in the corresponding
    bit value parameter.


    For example:


    ```

    bcm2835_peri_bits (paddr, 0x01, 0x01)

    ```


    will set 0 to a 1, leaving all other bits unchanged and:

    bcm2835_peri_bits (paddr, 0x00, 0x01)

    will set 0 to a 0 leaving all other bits unchanged.


    where regbase is one of:


    | BCM2835_REGBASE_ST | Base of the ST (System Timer) registers |

    | BCM2835_REGBASE_GPIO | Base of the GPIO registers |

    | BCM2835_REGBASE_PWM | Base of the PWM registers |

    | BCM2835_REGBASE_CLK | Base of the CLK registers |

    | BCM2835_REGBASE_PADS | Base of the PADS registers |

    | BCM2835_REGBASE_SPI0 | Base of the SPI0 registers |

    | BCM2835_REGBASE_BSC0 | Base of the BSC0 registers |

    | BCM2835_REGBASE_BSC1 | Base of the BSC1 registers |


    349'
  merge: -1
  pgno: 348
- img_proc: true
  md: "So to get the address in user memory of the GPIO register you can use BCM2835_REBASE_GPIO.\
    \ Alternatively you can use bcm2835_peripherals and simply add the known offsets,\
    \ for example:\nbcm2835_peripherals + BCM2835_REBASE_GPIO/4;\n\nThe library also\
    \ provides a set of pre-computed starting addresses for the standard sets of registers:\n\
    \n```\nbcm2835_gpio = bcm2835_peripherals + BCM2835 GPIO BASE/4;\nbcm2835_pwm\
    \ = bcm2835_peripherals + BCM2835 GPIO PWM/4;\nbcm2835_clk = bcm2835_peripherals\
    \ + BCM2835 CLOCK BASE/4;\nbcm2835_pads = bcm2835_peripherals + BCM2835 GPIO PADS/4;\n\
    bcm2835_spi0 = bcm2835_peripherals + BCM2835 SPI0/4;\nbcm2835_bsc0 = bcm2835_peripherals\
    \ + BCM2835 BSC0 BASE/4; /* I2C */\nbcm2835_bcl1 = bcm2835_peripherals + BCM2835\
    \ BSC1 BASE/4; /* I2C */\nbcm2835_st = bcm2835_peripherals + BCM2835 ST_BASE/4;\n\
    ```\n\nNotice the addresses all refer to the location in user space where the\
    \ file has been mapped and all the offsets to be converted to word addresses by\
    \ being divided by 4.\n\n# # Almost Fastest Pulse\n\nAs an example using the low-level\
    \ functions, lets repeat the toggling of GPIO4 using them. This doesn't give you\
    \ the fastest possible time because there is the overhead of the function calls,\
    \ but in practice you are unlikely to see any real differences.\n\nThis we need\
    \ to initialize the library as this is where the mapping is up:\n\n```\nif (!bcm2835_init())\n\
    \  return 1;\n```\n\nNext we can get the start of the GPIO registers in user memory:\
    \ uint32_t* gpioBASE = bcm2835_regbase(bcm2835_REBASE_GPIO);\n\nFinally we can\
    \ set GPIO4 to output, setting bits 12, 13 and 14 of GPIO Function Select 0, at\
    \ offset zero, 001 and we can set and clear it by writing a one to four in GPSET0\
    \ and GPCLR0;\n\n```\nbcm2835_peri_write(gpioBASE, 0x1000);\nfor (;\n  bcm2835_peri_write(gpioBASE\
    \ + BCM2835 GPSET0 / 4, 0x10);\n  bcm2835_peri_write(gpioBASE + BCM2835_GPCLR\
    \ / 4, 0x10);\n}\n```"
