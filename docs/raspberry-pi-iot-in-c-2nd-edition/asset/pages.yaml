    \ markspace is 1 for mark/space mode and 0 for\nbalanced and enabled is 1 start\
    \ the PWM pulses running.\n\nFinally you can set range using:\nvoid bcm2835_pwm_set_range\
    \ (uint8_t channel, uint32_t range)\nand you can set data using:\nvoid bcm2835_pwm_set_data\
    \ (uint8_t channel, uint32_t data)\n\nThe largest value of range that seems to\
    \ work in practice is 0xFF, over\n268 million clock pulses, at which the highest\
    \ clock rate is 30s per\nrepeat.\n\n# Selecting Clock Rate\n\nOne of the basic\
    \ problems in using the Pi's PWM is selecting a clock divider\n range value. There\
    \ is a fairly standard way of doing this. The best way to\nout out a configuration\
    \ that gives a particular repeat rate is to start at the\nhighest clock rate,\
    \ i.e.9.6MHz, with a divisor of 2 and work out the range\nneeded.\n\nIn general:\n\
    \n```\nmax range = repeat time*clock frequency\n= repeat time* 9.6*1000\n```\n\
    \nwith the repeat time in milliseconds.\n\nFor example, if you need a repeat rate\
    \ of 5ms then:\n\n```\nmax range = 5 * 9.6 * 1000\n= 48000\n```\n\nWhat this means\
    \ is the duty cycle can be specified using 16 bits of\nprecision.\n\nSimilarly\
    \ if the repeat rate is specified as a frequency then max range is:\nmax range\
    \ = clock frequency/ repeat frequency\n= 9.6/repeat frequency\n\nThis gives you\
    \ the maximum range you can use. The previous example with a\n5ms repeat time\
    \ is equivalent to 0.2kHz and hence:\n\nmax range = 9.6/0.2*1000 = 48000\nwhich\
    \ is of course the same range."
  merge: -1
