- img_proc: true
  md: '# Pin Numbering


    Something that drives every programmer mad is the different ways of referring
    to the numbering of the GPIO pins. There is the physical pin number, i.e. the
    number of the pin on the physical connector, and the logical GPIO number, which
    is assigned deep in the hardware.


    For most of the Pi family the standard 40-pin connector is largely the same:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_40_0.png)


    The Pi 4 adds some additional uses to those of the pins, but it still supports
    this layout and functionality. The Pi 1 had a smaller 26-pin connector and only
    supported a subset of GPIO pins unless you have an existing program designed for
    the Pi 1 you ignore this.


    The BCM 2835 library works in terms of the GPIO pins defined by the processor.
    However, it also provides an enumeration which allows you to work in terms of
    the physical pins. For example in the blink program:


    ```

    bcm2835_gpio_write(RPI_BPLUS_GPIO_J8_07);

    ```


    sets the GPIO line connected to pin 7 on connector J8. If you look at the code
    for the enumeration you will discover that RPI_BPLUS_GPIO_J8_07 is defined as
    4 corresponding to GPIO 4, which is indeed connected to pin 7.


    You could have used:


    ```

    bcm2835_gpio_write(4, HIGH);

    ```


    to set the GPIO line high.'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'It is up to which way way you choose to specify pin numbers – by logical GPIO
    number or physical pin number. In most cases the physical pin numbers are more
    direct because they specify what you are actually connecting wires to.


    Notice, however, that you do to specify the model of Pi that you are working with.
    For example, the library defines three types of pin 3:


    RPI_GPIO_P1_03 which is the Pi 1 revision 1 version of pin 3 or GPIO 0

    RPI_V2_P1_03 which is the Pi 1 revision 2 version of pin 3 or GPIO 2

    RPI_BPLUS_GPIO_03 for all models after the B+


    You can see that this can be confusing but the change in the pins is also confusing.
    If you are using the Pi Compute module then don''t worry about the enumeration,
    simply use the GPIO number. In general you should use the enumeration values that
    start with RPI_BPLUS_GPIO for all modern Pis from the B+ on.


    The command pinout can be viewed from the console to see the pinout and general
    configuration of the device you are using:


    | J8 |

    | 3V3 (1) (2) 5V |

    | GPIO2 (3) (4) GND |

    | GPIO3 (5) (6) GND |

    | GPIO4 (7) (8) GPIO14 |

    | GND (9) (10) GPIO15 |

    | GPIO17 (11) (12) GPIO18 |

    | GPIO27 (13) (14) GND |

    | GPIO22 (15) (16) GPIO23 |

