  md: '# Chapter 16


    # The Serial Port


    The serial port is one of the oldest of ways of connecting devices together, but
    it is still very useful as it provides a reasonably fast communication channel
    that can be used over a larger distance than most other connections such as USB.
    Today, however, its most common and important use is in making connections with
    small computers and simple peripherals. It can also be used as a custom signal
    decoder, see later.


    The bad news is to get the best from the Linux serial port you have to master
    a lot of detail.


    # Serial Protocol


    The serial protocol is very simple. It has to be because it was invented in the
    days when it was generated using electromechanical components, motors and the
    like. It was invented to make early teletype machines work and hence you will
    find abbreviations such as TTY used in connection with it. As the electronic device
    used to work with serial is called a Universal Asynchronous Receiver/Transmitter,
    the term UART is often used.


    The earliest standards are V24 and RS232. Notice, how early serial communications
    worked between plus minus 24 and later ones ±12. Today''s serial communications
    with logic, or TTL, levels of 0V to 5V or to 3.3V. This voltage difference is
    a problem we will return to later. What matters is, irrespective of the voltage,
    the protocol is always the same.


    For the moment let concentrate on the protocol. As already mentioned, the protocol
    is simple. The line rests high and represents a 0. When the device starts to transmit
    it first pulls the line low to generate a start bit. The width of this start bit
    sets are a variable number, usually seen seven or eight, data bits, an optional
    single parity bit, and finally one or two 0 stop bits.


    Originally the purpose of the start bit was to allow the motors etc to get started
    and the receiving end to end performing any corrections. The stop bits were similarly
    to give time for the motors to come back to their rest position. In the early
    days the protocol was used at very slow speeds; 300 baud, i.e. roughly 300 bits
    per second, was considered fast enough.'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'Today the protocol is much the same but there is little need for multiple stop
    bits and communications is often so reliable that parity bits are dispensed with.
    Transmission speeds are also higher - typically 9600 or 115200 baud.

    To specify what exact protocol is in use, you will often encounter a short form
    notation. For example, 9600 baud, 8 data bits, no parity, one stop bit, will be
    written as 9600 8n1. Here you can see the letter 0 (01101111 or 0x6F) transmitted
    using 8n1:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_255_0.png)


    Notice that the signal is sent least significant bit first. The first low is the
    start bit, then the eight dots show the ideal sampling positions for the receiver.
    The basic decoding algorithm for receiving serial data is to detect the start
    of the start bit and then sample the line at the center of each bit. Notice that
    the final high on the right is the stop bit.

    Also that the sampling points can be put to use on custom protocols. As long as
    the data is transmitted in fixed time “cells” indicated by a start bit you can
    use a serial port to read individual bits.

    For a serial connection to work, it is essential that the transmitter and the
    receiver are set to the same speed, data bits and parity. Serial interfaces often
    fail because they are not working with the same settings.

    A logic analyzer with a serial decoder option is an essential piece of equipment
    if you are going to do anything complicated with serial interfacing.

    What is a baud? Baud rate refers to the basic bit time. That is, 300 baud has
    a start bit that is 1/300s wide. This means that for 9600 baud a bit is 1/9600
    wide or roughly 104µs and 115200 baud a bit is 1/115200 or roughly 8.6µs. Notice
    that baud rate doesn’t equate to speed of sending data because there is an overhead
    in start, stop and perhaps parity bits to include in the calculation.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# Hardware


    A simple serial interface has a transmit pin, TX, and a receive pin, RX. That
    is, a full serial interface uses two wires for two-way communications. Typically
    you connect the TX pin on one device to the RX pin on the other and vice versa.
    The only problem is some helpful manufacturers label the pins by what they should
    be connected to not what they are and you have to connect RX to RX and TX to TX
    - not really helpful. You generally need to check with a scope, logic probe or
    meter which pin is which if you are in any doubt.


    In addition to the TX and RX pins, a full serial interface has a lot of control
    lines. Most of these were designed to help with old fashioned teleprinters and
    they are not often used. For example RTS - Request To Send is a line that used
    to ask permission to send data from the other end of the connection, CTS - Clear
    To Send is a line that indicates that it is okay to send and so on. Usually these
    are set by the hardware automatically when the receiver buffer is full or empty.


    You can use RTS and CTS as a hardware flow control. There is also a standard flow
    control involving sending XON and XOFF characters to start and stop the transmission
    of data. For connections between modern devices you can ignore these lines and
    just receive data. If you need to interface to something that implements a complex
    serial interface you are going to have to look up the details and hand-craft a
    program to interact with it. For the rest of this chapter we are going to work
    with TX and RX and ignore additional status and signaling lines.


    Modern system-on-a-chip devices like the Pi usually have one or more devices or
    Universal Asynchronous Receiver/Transmitters (UARTS) built in. The Pi has two,
    a full-function UART and a mini-UART. The difference is the size of the buffers
    and support for features. The mini-UART has a problem that it is tied to the system
    clock and, the mini-UART''s baud rate changes. You can fix the system clock to
    a set frequency, but this is not a good idea. For this reason we will concentrate
    of the full UART, but the principles are the same for any UART.


    There is a problem with making the connection to the Pi''s RX and TX pins that
    devices work at different voltages. PC-based serial ports usually use +13V to
    -13V and all RS232-compliant ports use a + to - voltage swing, which is completely
    incompatible with the Pi and most other microprocessors which work at 5V or 3.3V.'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'If you want to connect the Pi to a PC then you need to use a TTL-to-RS232 converter.
    In this case it is easier to use the PC''s USB port as a serial interface with
    USB to TTL level serial converter. All you have to do is plug the USB port into
    the PC, install a driver and start to transmit data.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_257_0.png)


    The full UART is brought out onto pin 8 TX and pin 10 RX, corresponding to GPIO
    14 and GPIO 15 in mode ALT 0. At the moment these are set to ALT 0 when Linux
    boots, but there are discussions about changing this, in which case you will have
    to explicitly set both GPIO lines to ALT 0 to use the serial interface.


    Remember when you connect the Pi to another device TX goes to the other device''s
    RX and RX goes to the other device''s TX pin. Also remember that the signaling
    voltage is 0V to 3.3V.'
  merge: -1
