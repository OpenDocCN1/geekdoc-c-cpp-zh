  md: 'If you want to serve other content then you need to arrange for your server
    to respond for specific file types. Images, for example, are requested separately
    and have to be uploaded separately. All this is relatively easy unless you are
    trying to be completely general. You can also upload non-HTML, or non-text, data.
    For example, to send JSON data would change the header to:


    ```

    char Status[] = "HTTP/1.1 200 OK\r\nContent-Type: application/json\r\ncharset=UTF-8\r\nServer:
    Cpi\r\n";

    ```


    and the HTML to:


    ```

    char html[] = {"humidity":81, \"temperature":32C"};

    ```


    The key idea is that an HTML server is simple, but it has a great many use cases
    to cover. A completely general HTML server isn''t so much complicated, just more
    extensive. We also have some minor irritations to overcome. The first is if you
    run the socket-using program and then halt it the socket isn''t immediately closed.
    The connection is maintained after your program has finished to allow clients
    to gracefully shut down. The problem is if you run your program again it will
    very likely give a socket error of "address in use". Once you have finished testing,
    this isn''t going to be a problem with your program should shut the socket down
    correctly.


    The simplest solution to solve the problem is to allow an address to be shared
    by more than one socket:


    ```

    if(setsockopt(sockfd

    ```


    You might also like to explore additional configuration options provided by setsockopt.
    Notice that because of the use of an address, or a literal argument, &(int){1},
    this only works under C99.'
