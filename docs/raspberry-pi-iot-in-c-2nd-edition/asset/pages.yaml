    \ 14 (TXD)\n- GPIO 15 (RXD)\n- GPIO 18 (PCM,CLK)\n- GPIO 23\n- GPIO 24\n- Ground\n\
    - GPIO 25\n- GPIO 8 (CEO)\n- GPIO 7 (CE1)\n- GPIO 1 (ID,SC)\n- Ground\n- GPIO\
    \ 12 (PWM0)\n- Ground\n- GPIO 16\n- GPIO 20 (PCM,DIN)\n- GPIO 21 (PCM,DOUT)\n\n\
    Notice that the numbering is supposed to start anew from each end as this gives\
