  md: "# How Fast Are Events\n\nIf we poll on rising edge events we get an estimate\
    \ of how fast we can read data by toggling another GPIO line at the end of the\
    \ event loop:\n\n```\n#include <stdio.h>\n#include <stdlib.h>\n#include <bcm2835.h>\n\
    #include <unistd.h>\n\nint main(int argc, char* argv) {\n    if (!bcm2835_init())\
    \ return 1;\n    bcm2835_gpio_fsel(RPI_BPLUS_GPIO_J8_07, BCM2835_GPIO_FSEL_INPT);\n\
    \    bcm2835_gpio_fen(RPI_BPLUS_GPIO_J8_07);\n    bcm2835_gpio_clr_fen(RPI_BPLUS_GPIO_J8_07);\n\
    \    bcm2835_gpio_fsel(RPI_BPLUS_GPIO_J8_11, BCM2835_GPIO_FSEL_OUTP);\n    bcm2835_gpio_write(RPI_BPLUS_GPIO_J8_11,\
    \ LOW);\n\n    uint64_t t;\n    while (1) {\n        bcm2835_gpio_set_eds(RPI_BPLUS_GPIO_J8_07);\n\
    \        t = bcm2835_gpio_read();\n        for (;;)) {\n            if (1 == bcm2835_gpio_eds(RPI_BPLUS_GPIO_J8_07))\
    \ break;\n        }\n        t = bcm2835_gpio_read() - t;\n        bcm2835_gpio_write(RPI_BPLUS_GPIO_J8_11,\
    \ HIGH);\n        bcm2835_gpio_write(RPI_BPLUS_GPIO_J8_11, LOW);\n    }\n    return\
    \ (EXIT_SUCCESS);\n}\n```\n\nReading the time of the rising edge is included to\
    \ add some minimal processing of the signal. A logic analyzer trace indicates\
    \ that around 1.2MHz is the upper limit on using input events in a polling loop:\n\
    \n![](img/175b89abfcdc9824337e5b1ac4bb1ef3_118_0.png)\n\nYou can see that the\
    \ event takes about 0.5µs and this leaves enough time to catch the next rising\
    \ edge on a 1.2MHz pulse. In practice, throughput would be lower than this. This\
    \ is about the speed as the level-reading program given in Chapter 6, but there\
    \ are far missed pulses due to the latching effect of using events."
