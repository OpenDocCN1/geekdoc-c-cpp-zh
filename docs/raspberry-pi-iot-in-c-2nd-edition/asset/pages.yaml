- img_proc: true
  md: 'If you need the GPIO lines to be out of phase you can use:

    bcm2835_gpio_write_mask (value, mask);


    but this will still produce a slight lag between the lines switching in different

    directions of about 50ns. The reason for this is that the lines are all set high

    using one write to a control register and all of the lines are set low with

    another write to a different control register. Hence, all lines transitioning
    to

    high switch at the same time and so all of the line transitioning to low, but

    there is a 50ns gap between them.


    It is clear that if you want to synchronize the changing of GPIO lines you

    should use the multi functions and a mask but this isn''t perfect – you can''t

    produce perfect out-of-phase pulses.


    # Can We Do Better?


    If by better you mean faster, then probably not enough to make it worth the

    effort. There is some overhead in calling a function, but this is tiny. How to

    directly address the GPIO without the use of a library is covered in

    Chapter 20, but more for educational reasons than to increase the speed of

    operation.


    A more interesting question is whether it is possible to increase the accuracy

    of the pulses. This might be possible by turning off interrupts and using

    internal timers, but it would interfere with the normal operation of Linux and

    again probably isn''t going to be worth it.'
