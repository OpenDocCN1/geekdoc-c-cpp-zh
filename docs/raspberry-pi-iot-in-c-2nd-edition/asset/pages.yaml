- img_proc: true
  md: 'There isn''t much documentation on hysteresis and slew rate but broadly speaking
    hysteresis makes the input Schmitt trigger and slew rate puts a small capacitive
    load on the input.


    The Drive strength deserves deserves explanation. This is the effective output
    resistance. Each time the drive current is increased by 2mA another transistor
    is used in the drive, so lowering the output resistance. This has the effect of
    increasing or decreasing the voltage.


    This is a subtle idea and is related to how much current is needed to make the
    input 3.3V or 0V. For example, if you have a 2mA drive current then a load that
    draws 2mA will have a voltage across it within the tolerances for 3.3V logic for
    0 and a 1. If the load draws more than 2mA then the output voltages will not meet
    the tolerances of 0.8V for 0 and 1.3V for 1. For example, if the line is being
    driven down sinking more than 2mA will make the output greater than 0.8V and the
    output will not be read as a 0.


    The drive current is not a maximum current that can be supplied and it is certainly
    not a current limiting value. If you short an output to 0V or 3.3V then it will
    supply as much current as it can before overheating and failing. The power up
    defaults for PAD registers is Slew rate unlimited, hysteresis and drive current
    of 8mA.


    # Where Are the Registers?


    The only question we have answer now is where are the registers? This turns out
    to be a difficult question to answer because the processor implements memory mapping,
    which essentially means that any physical address can appear almost anywhere in
    the memory map of a running program.


    According to the Pi documentation, all of the peripheral registers, including
    the GPIO registers we have describing, are in a block of memory with a base address
    and size that vary according to the version of the Pi you are using:


    | | base | size |

    |---|---||

    | Pi 1, Pi Zero & Compute Module | 0x20000000 | 0x01000000 |

    | Pi 2 & Pi 3 | 0x3F000000 | 0x01000000 |

    | Pi 4 | 0xFE000000 | 0x01800000 |'
  merge: -1
  pgno: 337
- img_proc: true
  md: "This means to make use of the registers directly we need to discover that the\
    \ base address and size of the block of memory is.\n\nFor a Pi Zero/2/3/4, the\
    \ register's start is indicated by the contents of a file set up by the Linux\
    \ Device Tree. This use of a file to record where the registers start means any\
    \ changes in the future are taken care of automatically.\n\nTo find out where\
    \ the registers are you have to read:\n/proc/device-tree/soc/ranges\n\nwhich contains\
    \ the address of the start of the registers and the size of the memory area. The\
    \ only problem is that for the Pi 4 address space has increased to 64 bits, even\
    \ though the first 32 bits are zero. What this means is reading the first 32 bits\
    \ will give you the address on everything but a Pi 4, where it will be zero –\
    \ which can be used as a test for a Pi 4\n\nThe best way to discover where the\
    \ peripheral registers is located is try to read the file and use the default\
    \ 0x20000000 if it isn't present.\n\nFor example:\n\n```\nuint32_t *bcm2835_peripherals_base\
    \ = (uint32_t*)0x20000000;\nFILE *fp;\nunsigned char buf[16];\nif ((fp = fopen(\"\
    /proc/device-tree/soc/ranges\", \"rb\"))) {\n    if (fread(buf, 1, sizeof(buf),\
    \ fp) == sizeof(buf)) {\n        bcm2835_peripherals_base =\n            (uint32_t\
    \ *) (buf[4] << 24 |\n            buf[5] << 16 |\n            buf[6] << 8 |\n\
    \            buf[7] << 0);\n    }\n    fclose(fp);\n}\nif ((bcm2835_peripherals_base\
    \ =\n    bcm2835_peripherals_base =\n        (uint32_t *) (buf[8] << 24 |\n  \
    \      buf[9] << 16 |\n        buf[10] << 8 |\n        buf[11] << 0);\n```\n\n\
    In practice, it is easier to use the bcm2835 library and the variable:\nbcm2835_peripherals_base\n\
