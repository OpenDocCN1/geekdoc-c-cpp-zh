  md: '# Summary


    +   - The new Linux GPIO character driver replaces the well known sysfs GPIO driver.

    - It is harder to use from the command line and mostly uses ioctl calls to access
    the GPIO lines.

    - If you install the gpiod library you get a set of utility functions that do
    allow command line use.

    - The raw GPIO character is easy to use once you know the sysctl operations supported
    and their structs.

    - The GPIO character driver is about twice as fast as the sysfs-based interface,
