    \nNotice that we can read and write from the serial port as if it was a file,\
    \ but course it isn't there are some differences. In particular, we can't read\
    \ back more characters than we wrote in a loopback setup. The read and write function\
    \ calls are also set up to be blocking - and this isn't the best way to work.\
