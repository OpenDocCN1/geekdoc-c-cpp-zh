- img_proc: true
  md: '# To summarize:


    +   - The PWM clock gives the smallest unit of change of the PWM line

    - The range gives the repeat rate of the PWM pulse train, i.e. the duty cycle
    is fixed for range clock pulses.

    - The repeat frequency is equivalent to clock frequency divided by the range

    - The range gives the resolution of the duty cycle, 1/range %, or the number of
    duty cycle steps that are available. To set the duty cycle to d% then data = range*d/100


    You can now see why the clock frequency being supplied to the two PWM units doesn''t
    constrain them to the same repeat rate. They can work at different rates as long
    as they can tolerate different duty resolutions and hence range values.


    # PWM Functions


    The bcm2835 library provides PWM in an easy-to-use form. Its functions allow you
    to set the parameters of both PWM channels numbered 0 and 1. The fundamental frequency
    of the PWM is set by:

    `bcm2835_pwm_set_clock(uint32_t divisor)`


    You can''t select the clock speed directly. Instead have to use a divisor to reduce
    the 19.2MHz clock to a lower rate. The library provides some standard settings:


    ```

    BCM2835_PWM CLOCK DIVIDER 2048 9.375kHz

    BCM2835_PWM CLOCK DIVIDER 1024 18.75kHz

    BCM2835_PWM CLOCK DIVIDER 512 37.5kHz

    BCM2835_PWM CLOCK DIVIDER 256 75.0kHz

    BCM2835_PWM CLOCK DIVIDER 128 150.0kHz

    BCM2835_PWM CLOCK DIVIDER 64 300.0kHz

    BCM2835_PWM CLOCK DIVIDER 32 600.0kHz

    BCM2835_PWM CLOCK DIVIDER 16 1.2MHz

    BCM2835_PWM CLOCK DIVIDER 8 2.4MHz

    BCM2835_PWM CLOCK DIVIDER 4 4.8MHz

    BCM2835_PWM CLOCK DIVIDER 2 9.6MHz

    BCM2835_PWM CLOCK DIVIDER 1 4.6875kHz

    ```


    The largest divider you can specify is 0FFF, or 4096, which gives the same frequency
    as specifying 1, i.e. 4.6875kHz. An important point to remember that the clock
    rate is not the PWM repeat rate.'
