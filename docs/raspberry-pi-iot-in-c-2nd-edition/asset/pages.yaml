  md: '# Chapter 11


    # The DHT22 Sensor

    Implementing A Custom Protocol


    In this chapter we make use of all the ideas introduced in earlier chapters to
    create a raw interface with the low-cost DHT11/22 temperature and humidity sensor.
    It is an exercise in implementing a custom protocol directly in C.


    # The DHT22


    The DHT22 is a more accurate version of the DHT11 and it is used in this project.
    The software will work with both versions and also with the AM2302, which is equivalent
    to the DHT22.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_186_0.png)


    Model AM2302/DHT22

    Power supply 3.3-5.5V DC

    Output signal digital signal via 1-wire bus

    Sensing element Polymer humidity capacitor

    Operating range

    humidity 0-100%RH;

    tperature -40–80Celsius

    Accuracy

    humidity +-2%RH(Max +-5%RH);

    tperature +-0.5Celsius

    Resolution or sensitivity

    humidity 0.1%RH;

    tperature 0.1Celsius

    Repeatability

    humidity +-1%RH;

    tperature +-0.2Celsius'
  merge: -1
  pgno: 186
- img_proc: true
  md: 'The device will work at 3.3V and it makes use of a 1-wire open collector style
    bus, which makes it very easy to make the physical connection to the Pi. The one-wire
    bus used isn''t standard and is only used by this family of devices, so we have
    little choice but to implement the protocol in C.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_187_0.png)


    The pinouts are:


    +   1. VDD

    2. SDA serial data

    3. not used

    4. GND


    and the standard way of connecting the device is:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_187_1.png)


    Although the recommended pull-up resistor is 1K, a higher value works better with
    the Pi - typically 4.7K, but larger will work.'
