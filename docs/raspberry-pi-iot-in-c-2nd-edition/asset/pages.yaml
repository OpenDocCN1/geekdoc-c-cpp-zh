  md: '# Alarm Scan


    You can use the same technique to pick out devices with an alarm set. The DS18B20
    discussed in the previous chapter, for example, can have a high and low limit
    temperature set by writing data to the scratchpad. If the temperature goes outside
    these limits an alarm is set off. You can obtain the serial numbers of all devices
    with an alarm set by scanning the bus using Alarm Search (0xEC) rather than Match
    ROM (0x55). Just change the code sent in the function. In this case you will get
    a list of serial numbers corresponding to devices with alarms set and you can
    continue to process these.


    This seems like an attractive option but, given the propensity for errors, it
    isn''t particularly robust and you could easily miss a device with an alarm set.
    If possible it is better to perform a manual scan of each device on the bus and
    read its alarm status.


    # Final Thoughts


    The 1-wire bus is simple and immensely useful, as long as you don''t try to push
    it too far. Problems start to arise when you use long, over 2m or 4m connections,
    or try to put lots of devices on the same bus. With the price of a Pi Zero and
    the number of GPIO lines available this seems like an unnecessary complication.
    You can simply use an additional GPIO line to implement a separate bus with fewer
    devices on it. It is also worth knowing that there are devices which will convert
    I2C signals to 1-wire and hence as a bus extender.'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Summary


    +   - You can connect multiple devices to a single 1-wire bus.

    - This introduces the problem of discovering what is connected to the bus and
    selecting the device you want to talk to.

    - The 1-wire bus has an ingenious algorithm to discover the serial numbers of
    each connected device. This is worth knowing about, even if you don''t want to
    implement it or modify it.

    - The algorithm relies on each device sending the first bit of its serial number
    and the NOT of its first bit. i.e. As the Bus outputs, a 0 0 indicates that there
    is at least one device with the bit set to 1 and at least one with the bit set
    to 0. Any other bit pair indicates that all of the devices have the same first
    bit.

    - In the next step, if there are devices with 0 and 1 as the first bit, the master
    picks one and sends it, i.e. it transmits a 0 or a 1. The result is that only
    devices that match the transmitted bit continue to respond to the master''s requests.

    - After this master reads two more bits which encode the next bit of the serial
    number. It picks either 0 or 1 to continue the process and at each step it knocks
    out devices that it doesn''t want to query.

    - The master continues until has the complete serial number which corresponds
    to a single device as serial numbers are unique.

    - This algorithm can be implemented as a recursive search whose only problem is
    returning the hardware to its previous state.

    - Once you have a device serial number you can select it for further reading and
    writing using the Match ROM.

    - You can use the scan algorithm to check a range of sensors for an alarm bit
    set.

    - You can improve the length of the 1-wire bus using an active pull-up, but this
    needs another GPIO line.'
  merge: -1
