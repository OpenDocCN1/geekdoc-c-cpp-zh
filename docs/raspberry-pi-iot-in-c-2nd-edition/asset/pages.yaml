- img_proc: true
  md: '# Summary


    +   Working with the Raspberry Pi under Linux isn''t working with a microcontroller.
    The difference is that the operating system schedules programs to run and services
    interrupts and this means you cannot be sure that your program is running at any
    given time.


    +   The Linux scheduler has been developed over many years and its current default
    configuration is better suited to running desktop applications than anything else.


    +   Although there have been many attempts to downplay the basic unit of Linux
    time, the jiffy is still important as it controls how often the scheduler is called.
    Typically this gives a reschedule time of 10ms.


    +   Another complication is that the Pi 4 has four cores and a lot depends on
    which one your program runs and which one the scheduler interrupts uses.


    +   A recent feature of Linux scheduling, designed to make desktop apps more responsive,
    is group scheduling. Put simply, all processes that are started from the same
    console share the same time allocation.


    +   There are some real-time scheduling methods - SCHED_FIFO, SCHED_RR and the
    more recent SCHED_DEADLINE which attempts to meet a set of timing constraints.


    +   In the case of the Pi 4 you can control which core your program runs on using
    thread affinity and you can isolate a core and tell Linux not to use it.'
  merge: -1
