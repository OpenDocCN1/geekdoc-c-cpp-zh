  md: "You can build the circuit in a variety of ways. You can solder the resistor\
    \ to the temperature sensor and then use longer wires with clips to connect to\
    \ the Pi. You could also solder directly to the Pi, which is a good plan for the\
    \ Pi Zero, or use a prototyping board.\n\n# Initialization\n\nEvery transaction\
    \ with a 1-wire device starts with an initialization handshake. The master holds\
    \ the bus low for at least 480µs, a pulse of 15µs to 60µs follows, and then any\
    \ and all of the devices on the bus pull the line low for 60µs to 240µs.\n\nWe\
    \ have already implemented the presence function and can simply use it\n\n```\n\
    int main(int argc, char **argv) {\n    const struct sched param priority = {1};\n\
    \    sched_setscheduler(0, SCHED_FIFO, &priority);\n    mlock(MCL_CURRENT | MCL_FUTURE);\n\
    \n    if (!bcm2835_init()) {\n        return 1;\n    }\n    bcm2835_gpio_fsel(RPI_BPLUS_GPIO_J8_07,\
    \ BCM2835_GPIO_FSEL_INPT);\n\n    if(presence(RPI_BPLUS_GPIO_J8_07)==0) {\n  \
    \      read temperature\n    }\n}\n```\n\nIf you find this does not work, make\
    \ sure that you are running the program as root at the start of Chapter 2.\n\n\
    If you try this program and have a logic analyzer with a 1-wire protocol analyzer,\
    \ you will see something like:\n\n| +100us | +200us | +300us | +400us | +500us\
    \ | +600us | +700us | +8 |\n|---|---|---|---|---|---|---|---|n| RESET condition\
    \ | | | | | PRESENCE condition | | | |\n| | | | | | | | | Width: 482.4us\n| |\
    \ | | | | | | | Pulse Measurements |\n\nSeeing a presence pulse is the simplest\
    \ and quickest way to be sure that your hardware is working. From this point it\
    \ is just a matter of using the functions developed in the previous chapters to\
    \ work with the commands defined in the datasheet."
