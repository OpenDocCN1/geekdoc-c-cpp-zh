  md: "To demonstrate the sort of approach that you can take to DtoA conversion, the\
    \ following program creates a triangle or ramp waveform:\n\n```\n#include <stdio.h>\n\
    #include <stdlib.h>\n#include <bcm2835.h>\n```\n\n```\nint main(int argc, char**\
    \ argv) {\n    if (!bcm2835 init())\n        return 1;\n\n    bcm2835 gpio fsel(18,\
    \ BCM2835_GPIO_FSEL_ALT);\n    bcm2835 pwm set_clock(2);\n    bcm2835 pwm set_mode(0,\
    \ 1, 1);\n    bcm2835 pwm set_range(0, 256);\n    for (int i = 0; i < 256; i =\
    \ i + 10) {\n        bcm2835 pwm_set_data(0, i);\n        bcm2835 delayMicroseconds(100);\n\
    \    }\n    return (EXIT_SUCCESS);\n}\n```\n\nThe inner loop sets a value of 0\
    \ to 256 in steps of 10, i.e. 300mV per step and the delay of 100µs produces a\
    \ total loop time of over 106µs. This means that around three or four pulses of\
    \ each 25µs duty cycle should be produced. This is far too few, but it is interesting\
    \ to see what happens. The waveform repeats at around 2.5ms, which makes the frequency\
    \ around 400Hz. Using an oscilloscope, the measured repeat is more like 2.3ms\
    \ or 430Hz.\n\nTo see the analog waveform, we need to put the digital output into\
    \ a low-pass filter. A simple resistor and capacitor work reasonably well:\n\n\
    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_146_0.png)\n\n147"
  merge: -1
