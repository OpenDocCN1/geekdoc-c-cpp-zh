  md: 'error response if there is a transmission error. The Datasheet suggests that
    you read the scratchpad after writing it to check that you have been successful
    in setting the three bytes.


    The third byte written to the scratchpad is to the configuration register:


    | BIT 7 | BIT 6 | BIT 5 | BIT 4 | BIT 3 | BIT 2 | BIT 1 | BIT 0 |

    |---|---|---|---|---|---|---|---|

    | 0 | R1 | 0x1F RD | 1 | 1 | 1 | 1 |


    Essentially the only thing you can change is the resolution of the temperature
    measurement.


    | Configuration Register | Resolution | Time |

    |---|---|--|

    | 0x1F | 9 bits | 93ms |

    | 0x3F | 10 bits | 175ms |

    | 0x5F | 11 bits | 375ms |

    | 0x7F | 12 bits | 750ms |


    The time quoted is the maximum for a conversion at the given precision. You can
    see that the only real advantage of decreasing precision is to make conversion
    faster. The default is 0x7F and 12 bits of precision.


    The first two bytes of the write scratchpad set a high and low temperature alarm.
    This feature isn''t much used, but you can set two temperatures that will trigger
    the device into alarm mode. Notice you only set the top eight bits of the threshold
    temperatures. This is easy enough, but the alarm status is set with every read
    so the temperature goes outside the bounds and then back in the alarm is cleared.


    The second problem is, to discover which devices are in alarm mode, you have to
    use the Alarm Search command (0xEC). This works like the Search ROM, but only
    the devices that respond with an alarm state. The alarm feature might be useful
    if you have a lot of devices and simply want to detect an out of band temperature.
    You could set up multiple devices with appropriate temperature limits and then
    simply scan the bus for devices with alarms set. To see how this can be done see
    the next chapter.'
