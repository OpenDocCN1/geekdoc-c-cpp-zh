- img_proc: true
  md: "# Initiating Temperature Conversion\n\nAs there is only one device on the 1-wire\
    \ bus, we can use the Skip ROM\ncommand (0xCC) to signal it to be active:\nwriteByte(RPI_BPLUS_GPIO_JB_07,\
    \ 0xCC);\n\nYou can see the pattern of bits on a logic analyzer:\n\n![](img/175b89abfcdc9824337e5b1ac4bb1ef3_223_0.png)\n\
    \nOur next task is to send a Convert command (0x44) to start the DS18B20\nmaking\
    \ a temperature measurement. Depending on the resolution selected,\nthis can take\
    \ as long as 750ms.\n\nHow the device tells the master that the measurement has\
    \ completed\non the mode in which it is operating, but using an external power\
    \ line, i.e.\nusing parasitic mode, the device sends a 0 bit in response to a\
    \ bit read until it\nis completed when it sends a 1.\n\nThis is 1-wire devices\
    \ that need time to get data read slow down the\nmaster until they are ready.\
    \ The master can read a single bit as often as it likes\nand the slave will respond\
    \ with a 0 until it is ready with the data.\n\nAs we already have a readBit function\
    \ this is easy. The software polls for the\ncompletion by reading the bus until\
    \ it gets a 1:\n\n```\nint convert(uint8_t pin) {\n  int i;\n  writeByte(pin,\
    \ 0x44);\n  for (i = 0; i < 5000; i++) {\n    bcm2835.delayMicroseconds(100000);\n\
    \    if (readBit(pin) == 1)break;\n  }\n  return i;\n}\n```\n\nYou can course\
    \ test the return value to check that the result has been\nobtained. If convert\
    \ returns 5000 the loop timed out. When the function\nreturns, the new temperature\
    \ measurement is stored in the device's\nscratchpad memory and now all we have\
    \ to do is read this."
  merge: -1
  pgno: 223
- img_proc: true
  md: "# Reading The Scratchpad\n\nThe scratchpad memory has nine bytes of storage\
    \ in total and does things control the accuracy of conversion and provide status\
    \ information. In our simple example the only two bytes of any great interest\
    \ are the first two, which hold the result of a temperature conversion. However,\
    \ as we are going to check the CRC for error correction we need to read all nine\
    \ bytes.\n\nAll we have to issue a Read Scratchpad 0xBE command and read the nine\
    \ bytes that the device returns. To send the new command we have to issue a new\
    \ initialization pulse and a Skip ROM 0xC command followed by a Read Scratchpad\
    \ 0xBE:\n\n```\npresence(RPI BPLUS GPIO_J8_07);\nwriteByte(RPI BPLUS GPIO_J8_07,\
    \ 0xCC);\nwriteByte(RPI BPLUS GPIO_J8_07, 0xBE);\n```\n\nNow the data is ready\
    \ to read. We can read all bytes or just the first two that we are interested\
    \ in. The device will keep track of which bytes have been read. If you come back\
    \ later and read more bytes you will continue the read from where you left. If\
    \ you issue another initialization pulse then the device awaits data transmission.\n\
    \nAs we do want to check the CRC for errors, we will read all bytes:\n\n```\n\
    int i;\nuint8_t data[9];\nfor (i = 0; i < 9; i++) {\n    data[i] = readByte(RPI_BPLUS_GPIO_J8_07);\n\
    }\n```\n\nNow we have all of the data stored in the scratchpad and the CRC byte\
    \ we can check for errors:\n\n```\nuint8_t crc = crc8(data, 9);\n```\n\nAs before,\
    \ crc8 will be 0 if there are no transmission errors. The crc8 was given at the\
    \ end of the previous chapter.\n\n# Getting The Temperature\n\nTo obtain the temperature\
    \ measurement we need to work with the first two bytes, which are the least and\
    \ most significant bytes of the 12-bit reading:\n\n```\nint t1 = data[0];\nint\
    \ t2 = data[1];\n```\n\nt1 holds the low-order bits and t2 the high-order bits.\n\
    \nAll we have to do is put the two bytes together as a 16-bit two's complement\
    \ integer. As the Pi supports a 16-bit int type, we can do this very easily:\n\
    \n```\nint16 t temp1 = (t2 << 8 | t1);\n```"
  merge: -1
  pgno: 224
- img_proc: true
  md: "Notice that this only works because int16_t really is a 16-bit integer. If\
    \ you were to use:\n\n```\nint temp1= (t2<<8 | t1);\n```\n\ntemp1 would be correct\
    \ for positive temperatures but it would give the wrong answer for negative values\
    \ because the sign bit is not propagated into the top 16 bits. If you want to\
    \ use a 32-bit integer, you will have to propagate the sign bit manually:\n\n\
    ```\nif(t2 & 0x80) temp1= f C 0xFFFF0000;\n```\n\nFinally, we have to convert\
    \ the temperature to a scaled floating-point value. As the returned data gives\
    \ the temperature in centigrade with the low-order four bits giving the fractional\
    \ part, it has be scaled by a factor of 1/16:\n\n```\nfloat temp = (float) temp1\
    \ / 16;\n```\n\nNow we can print the CRC and the temperature:\n\n```\nprintf(\"\
    CRC %hhho \\n\\r\", crc);\nprintf(\"temperature = %f C \\n\", temp);\n```\n\n\
    # A Temperature Function\n\nPackaging all of this into a single function is:\n\
    \n```\nfloat getTemperature(uint8_t pin) {\n    if (presence(pin) == 1) return\
    \ -1000;\n    writeByte(pin, 0xCC);\n    if (convert(pin) == 5000) return -3000;\n\
    \    presence(pin);\n    writeByte(pin, 0xCC);\n    writeByte(pin, 0xBE);\n  \
    \  int i;\n    uint8_t data[9];\n    for (i = 0; i < 9; i++) {\n        data[i]\
    \ = readByte(pin);\n    }\n    uint8_t crc = crc8(data, 9);\n    if(crc!=0) return\
    \ -2000;\n    int t1 = data[0];\n    int t2 = data[1];\n    int16_t temp1 = (t2\
    \ << 8 | t1);\n    float temp = (float) temp1 / 16;\n    return temp;\n}\n```\n\
    \nNotice that the function returns -1000 if there is no device, -2000 if there\
    \ is a CRC error and -3000 if the device fails to provide data. These values are\
    \ outside the range of temperatures that can be measured."
  merge: -1
