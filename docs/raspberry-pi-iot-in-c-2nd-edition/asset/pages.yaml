- img_proc: true
  md: "You can read the data that the slave is ready to send. The slave sends eight\
    \ bytes. The first byte is the family code which identifies the type of device.\
    \ For a simple iButton this is a 0x01. Next it sends the six bytes of the serial\
    \ number and finally a CRC check byte. Often you can ignore the check byte because\
    \ the transmission is reliable and getting it wrong isnt important. In this case\
    \ you can't because the connection with the iButton is subject to a lot of noise.\n\
    \nReading the eight bytes is easy:\n\n```\nuint8_t code[8];\n i;\nfor (i = 0;\
    \ i < 8; i++) {\n  code[i] = readByte(RPI_BPLUS_J8_07);\n}\n```\n\nWe now have\
    \ all of the data we need, but it needs to be checked for transmission errors.\n\
    \n# Computing The CRC\n\nDevising a CRC (Cyclic Redundancy Checksum) is often\
    \ regarded as a tough problem. However, once you know the basic idea you should\
    \ be able implement any CRC calculation, perhaps not in the most efficient way\
    \ but it will work. For low data rate applications high efficiency isnt needed\
    \ and you can use of a direct implementation. The datasheet specifies the CRC\
    \ used as a shift register:\n\nThe first thing to notice is the generator polynomial\
    \ that defines the CRC.\n\n![](img/175b89abfcdc9824337e5b1ac4bb1ef3_211_0.png)\n\
    \nIn this case it is:\n\nX^8 + X^5 + X^3 + 1\n\nThe first question to answer is\
    \ what is the connection between binary values and polynomials? The answer is\
    \ that you can treat a binary number as the coefficients of a polynomial, for\
    \ example 101 is 1*X^2+0*X+1. Each bit position corresponds to a power of X. Using\
    \ this notation creates a very simple relationship between multiplying by X and\
    \ a left-shift."
  merge: -1
  pgno: 211
- img_proc: true
  md: "For example:\n\n(1*X^2 + 0*X+ 1)*X = 1*X^3 + 0*X^2 + 1*X + 0\ncorresponds to:\n\
    \n```\n101 <<1 == 1010\n```\n\nYou can see this that multiplying one polynomial\
    \ by another and even polynomial division, all accomplished by shifting and XOR\
    \ (eExclusive OR).\n\nThe CRC is the remainder when you divide the polynomial\
    \ XOR represents the data by the generator polynomial. The computation of the\
    \ remainder is what the shift register specified on the datasheet does. The fact\
    \ that what makes this sort of CRC computation so common. The hardware has to\
    \ do is zero the shift register and feed the data into. When all the data has\
    \ been shifted, what is left in the shift register is the CRC, i.e. the remainder.\n\
    \nTo check the data you have received, all you have to run it through the shift\
    \ register again and compare the computed CRC. A better trick is to also run the\
    \ received CRC through the shift register. If there have no errors, this will\
    \ result in 0.\n\nYou can look into the theory of CRCs, bit sequences and polynomials\
    \ further, it is interesting and practically useful, but we know everything we\
    \ need to implement the CRC used by the iButton. All we have to do is implement\
    \ the shift register in software.\n\nFrom the diagram, what we have to do is take\
    \ each bit of the input data and XOR with the least significant bit of the current\
    \ shift register. If the input is bit 0, the XORs in the shift register don't\
    \ have any effect and the CRC just has to be moved one bit to the right. If the\
    \ input bit is 1, we have to XOR the bits at positions 3 and 4 and put a 1 in\
    \ a position 7 to simulate shifting a 1 into the register, i.e. XOR the shift\
    \ register with 10001100.\n\nSo the algorithm for a single byte is:\n\n```\nfor\
    \ (j = 0; j < 8; j++) {\n  temp = (crc >> datbyte) & 0x01;\n  crc >>= 1;\n  if\
    \ (temp) {\n    crc ^= 0x8c;\n    datbyte>>= 1;\n  }\n}\n```\n\nFirst XOR the\
    \ data with the current CRC and extract the low-order bit into temp. Then we right-shift\
    \ the CRC by one place. The low-order result in temp was a 1, we have to XOR the\
    \ with 0x8c to simulate the XORs in"
  merge: -1
  pgno: 212
- img_proc: true
  md: "the shift register and shift in a 1 at the most significant bit. Then shift\
    \ the data\none place right and repeat for the next data bit.\n\nWith this worked\
    \ out, we can now write a function that computes the CRC for\nthe entire bytes\
    \ of data:\n\n```\nuint8_t crc8(uint8_t *data, uint8_t len) {\n    uint8_t i;\n\
    \    uint8_t j;\n    uint8_t temp;\n    uint8_t databyte;\n    uint8_t crc = 0;\n\
    \    for (i = 0; i < len; i++) {\n        databyte = data[i];\n        for (j\
    \ = 0; j < 8; j++) {\n            temp = (crc ^ databyte) & 0x01;\n          \
    \  if (temp)\n                crc ^= 0x8C;\n            databyte >>= 1;\n    \
    \    }\n    }\n    return crc;\n}\n```\n\nWith in this place we can now check\
    \ the CRC and print the results:\n\n```\nuint8_t crc = crc8(code\n```\n\n```\n\
    bcm2835_delayMicroseconds(100000);\n```"
