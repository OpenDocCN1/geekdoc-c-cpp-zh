  md: "# Other Commands\n\nAs well as the commands that we have used to read the temperature,\
    \ the DS18B20 supports a range of other commands. There are two commands concerned\
    \ with when there are more devices on the bus. Search ROM (0xF0) is used to scan\
    \ the bus to discover what devices are connected, and Match ROM (0x55) is used\
    \ to select a particular device.\n\nYou can also read the unique 64-bit code of\
    \ a device using the Read ROM command (0x33) and this works in exactly the same\
    \ way as for iButton discussed in the previous chapter. In this case, the slave\
    \ transmits eight bytes, comprised of a single-byte device family code, 0x28 for\
    \ the DS18B20, 6 bytes of serial number and a single CRC byte.\n\nYou can use\
    \ the iButton function in the previous chapter to read the serial number:\n\n\
    ```\nuint8_t code[8];\nint i;\nint p = readButton(RPI_BPLUS_GPIO_J8, code);\n\
    if (p == 1) {\n    for (i = 0; i < 8; i++) {\n        printf(\"%02hh \", code[i]);\n\
    \    }\n    printf(\"\\n\\r\");\n    flush(stdout);\n}\n```\n\nAs well as the\
    \ Read ScratchPad command that we used to read the temperature, there is also\
    \ a Write ScratchPad command, 0x4E.\n\nThe format of the scratchpad is:\n\n| BYTE\
    \ 0 | TEMPERATURE LSB (09h) | EEPROM |\n|---|---||\n| BYTE 1 | TEMPERATURE MSB\
    \ (09h) | |\n| BYTE 2 | T_REGISTER OR USER BYTE 1* | T_REGISTER OR USER BYTE 1*\
    \ |\n| BYTE 3 | T_REGISTER OR USER BYTE 2* | T_REGISTER OR USER BYTE 2* |\n| BYTE\
    \ 4 | CONFIGURATION REGISTER* | CONFIGURATION REGISTER* |\n| BYTE 5 | RESERVED\
    \ (FFh) | |\n| BYTE 6 | RESERVED | |\n| BYTE 7 | RESERVED (10h) | |\n| BYTE 8\
    \ | CRC* | |\n\nThe first two bytes are the temperature that we have already used.\
    \ The only writable entries are bytes 2, 3 and 4. The Write ScratchPad command\
    \ transfers three bytes to these locations. Notice that there is no CRC and no\n\
    \n230"
