  md: '# # Chapter 12

    Exploring 1-Wire Bus Basics


    The Raspberry Pi is fast enough to be used to directly interface to a 1-wire bus
    without the need for drivers. The advantages of programming our own 1-wire bus
    protocol is that it doesn''t depend on the uncertainties of a Linux driver. The
    1-wire bus is a proprietary bus that is very easy to use and has a lot of useful
    devices you can connect to, including theButton security devices. However, probably
    the most popular of all 1-wire devices are the DS18B20 temperature sensor - it
    is small, very cheap and very easy to use. The next two chapters show you how
    to use both of these, but first let''s deal with the general techniques needed
    to work with the 1-wire bus.


    There are 1-wire drivers for Linux and these are most commonly used in Python
    and other higher levels that work with the bus. To make use of them you have to
    install the drivers and occasionally there are compatibility problems. If you
    are programming in C you have more than enough to write your own 1-wire protocol
    functions and this has the advantage of not requiring any interaction with Linux
    to work. You are also free to modify and extend the 1-wire functions without having
    to become involved in writing Linux modules.


    If you are interested in using the Linux drivers then see: Raspberry Pi IoT in
    With Drivers, ISBN: 9781871926424.


    # # The Hardware


    One-wire devices are very simple and use only a single wire to transmit data:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_198_0.png)


    The 1-wire device can pull the low using its Tx line and can read the line using
    its Rx line. The reason for the pull-up resistor is that both the master and the
    slave can pull the bus low and it will stay low until both release the bus.'
  merge: -1
  pgno: 198
- img_proc: true
  md: 'The device can even be powered from the bus line by drawing sufficient current
    through the pull-up resistor - so called parasitic mode. Low power devices work
    well in parasitic mode, but some devices have such a heavy current draw that the
    master has to provide a way to connect them to the power line - so called strong
    pull-up. In practice parasitic mode can be difficult to work reliably for high
    power devices.


    In normal powered mode there are three connections - V power, usually 3.3V for
    the Pi; Ground and Data:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_199_0.png)


    The pull-up rester varies according to the device, but anything from 2.2K to 4.7kΩ
    works. The longer the bus the pull-up resistor has to be reduce "ringing". There
    can be multiple devices on the bus and each has a unique 64-bit lasered ROM code,
    which can be used as an address to select the active devices.


    For simplicity, it is better to start with a single device and avoid the problem
    of enumerating the devices on the bus, although once you know how everything works
    this isnt difficult to implement. To get select a 1-wire device that you want
    to work with and set it up ready to talk to the Pi of your choice. In the next
    chapter we show how to work with iButton and in the following one the DS18B20
    is explained. The functions described in this chapter should work with any 1-wire
    device.


    It is worth mentioning that there is a Linux driver for the 1-wire bus that makes
    it look like working with a file systs. How to do this is covered in Raspberry
    Pi IOT in C With Linux Drivers, ISBN: 9781871926242. In this book we use 1-wire
    directly as this allows you to customize to any device and it isnt'' subject to
    change.


    # Initialization


    Every transaction with a 1-wire device starts with an initialization handshake.
    First we have to work out how to configure the GPIO line. This example assumes
    the 1-wire device is connected to pin 7. If this isn''t the case, change the pin
    enumeration to the correct pin. For full practical examples, the next two chapters.'
