  md: '# Summary


    +   - The DS18B20 temperature sensor is one of the most commonly encountered 1-wire
    bus devices.

    - Using the DS12B20 uses the same low-level function as presented in the previous
    two chapters.

    - After a convert command is sent to the device, it can take 750ms before a reading
    is ready.

    - To test for data ready you have to poll on a single bit. – Reading 0 means data
    not ready and reading 1 means data ready.

    - When the data is ready you can read the scratchpad memory where the data is
    stored.

    - The DS18B20 has other commands that can be used to set temperature alarms etc,
    but these are rarely used when you have the resources of a full Linux machine
    to process the data.'
