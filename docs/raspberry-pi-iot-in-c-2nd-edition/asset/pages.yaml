  md: 'The code at the start of the function simply increases the time between slots
    slightly. Notice that once again we return the GPIO line to input, i.e. high impedance,
    rather than driving the high line at the end of the transaction.

    This allows the line to be pulled high ready for any response from the slave.

    nYou can see two 1s followed by two 0s in the following logic analyzer trace:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_203_0.png)


    # # A First Command - Writing Bytes


    After discovering that there is at least one device connected to the bus, the
    master has to issue a ROM command. In many cases the ROM command used first will
    be the Search ROM command, which enumerates the 64-bit codes of all the devices
    on the bus. After collecting all of these codes, the master can use Match commands
    with a single 64-bit code to select the device master wants to talk to.


    While it is perfectly possible to implement the Search ROM procedure, it is simpler
    to work with the single device by using commands which ignore the 64-bit code
    and address all of the devices on the bus at the same time. Of course, this only
    works as long as there is only one device on the bus. If there is only one device
    then we can use the Skip ROM command 0xCC to tell all the devices on the bus to
    be active.


    We need a function that can send a byte. As we have a writeBit function for this
    easy:


    ```

    void sendskip(uint8_t pin){

    writeBit(pin 0);

    writeBit(pin 0);

    writeBit(pin 1);

    writeBit(pin 1);

    writeBit(pin 0);

    writeBit(pin 0);

    writeBit(pin 1);

    writeBit(pin 1);

    }

    ```


    Notice that 0xCC is 1100 1100 in binary and the 1-wire bus sends the least significant
    bit first. If you try this out you should find out it works but the device doesn''t
    respond because it is waiting for another command. Again, as the time between
    writing bits is not critical we can take this implementation of the function and
    write something more general if slightly slower.


    204'
