    \ this is include a time delay in the loop before the line is sampled again. In\
    \ this case the printed message delays things long enough to remove most of the\
    \ initial bounce.\n\nIf you want to respond to a button press that is a press\
    \ and a release event then you have to test for a double transition:\n\n```\n\
    #include <stdio.h>\n#include <stdlib.h>\n#include <bcm2835.h>\n\nint main(int\
    \ argc, char** argv) {\n    if (!bcm2835_init()) return 1;\n\n    bcm2835_gpio_fsel(RPI_BPLUS_GPIO_J8_07,\
    \ BCM2835_GPIO_INTP);\n    bcm2835_gpio_set_pud(RPI_BPLUS_GPIO_J8_07, BCM2835_GPIO_PUD_UP);\n\
    \n    while (1) {\n        while (1 == bcm2835_gpio_lev(RPI_BPLUS_GPIO_J8_07));\n\
