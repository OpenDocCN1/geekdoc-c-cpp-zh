- img_proc: true
  md: 'The resulting output is a square wave with a measured frequency of 281.5Hz
    which isn''t particularly nice to listen to. You can improve it by feeding it
    through a simple low-pass filter the one used above for waveform synthesis.


    You can look up the frequencies for other notes and use a table to generate them.


    # Controlling An LED


    You can also use PWM to generate physical quantities such as the brightness of
    an LED or the rotation rate of a DC motor. The only differences required by these
    applications are to do with the voltage and current you need and the way duty
    cycle relates to whatever the physical effect is. In other words, if you want
    to change some effect by 50%, how much do you need to change the duty cycle? For
    example, how do we "dim" an LED?


    By changing the duty cycle of the PWM pulse train you can set the amount of power
    delivered to an LED, or any other device, and hence change its brightness. In
    the case of an LED, the connection between duty cycle and brightness is a complicated
    matter, but the simplest approach uses the fact that the perceived brightness
    is roughly proportional to the cube of the input power. The exact relationship
    is more complicated, but this is good enough for most applications. As the power
    supplied to the LED is proportional to the duty cycle we have:


    ```

    b=kd

    ```


    where b is the perceived brightness and d is the duty cycle. The constant k depends
    on the LED.


    Notice, as the LED when powered by a PWM signal is either full on or full off,
    there is no effect of the change in LED light output with current - the LED is
    always run at the current.


    What all of this means is if you want an LED to fade in a linear fashion you need
    to change the duty cycle in a non-linear fashion. Intuitively it means that changes
    when the duty cycle is small produce bigger changes in brightness than when the
    duty cycle is large.'
  merge: -1
  pgno: 148
- img_proc: true
  md: "For a simple example we need to connect a standard LED to the PWM line and\
    \ can use the BJT driver circuit introduced in Chapter 5.\n\n![](img/175b89abfcdc9824337e5b1ac4bb1ef3_149_0.png)\n\
    \nAssuming that you have this circuit constructed then a simple PWM program to\
    \ modify its brightness from low to high and back low in a loop is:\n\n```\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n#include <bcm2835.h>\n\nint main(int argc, char\
    \ **argv) {\n    if (!bcm2835_gpio()) return 1;\n    bcm2835_gpio_fsel(18, BCM2835_GPIO_FSEL_ALT5);\n\
    \    bcm2835_pwm_set_clock(2);\n    bcm2835_pwm_set_mode(0, 1, 1);\n    bcm2835_pwm_set_range(0,\
    \ 1024);\n    int w = 1;\n    int inc = 1;\n    for (;;) {\n        bcm2835_pwm_set_data(0,\
    \ w);\n        w = w + inc;\n        if (w > 1024 || w <= 0)\n            inc\
    \ = -inc;\n        bcm2835_delayMicroseconds(5000);\n    }\n    return (EXIT_SUCCESS);\n\
    }\n```\n\nThe basic idea is to set up a pulse train of 1ms. Next, for the loop,\
    \ the duty cycle is set to 0% to 100% and then back to 0%. If you watch the flashing\
    \ you will see that it changes brightness very quickly and then seems to spend\
    \ a long time \"stuck\" at almost full brightness and suddenly starts to dim rapidly.\
    \ This is a consequence of the way human eye perceives light output as a function\
    \ of input power."
  merge: -1
  pgno: 149
- img_proc: true
  md: "# Changing LED Brightness Linearly\n\nWhat about a linear change in brightness?\n\
    To achieve this reasonably accurately isn't difficult, all we need to is increase\
    \ the power, or equivalently the duty cycle, in steps that are cubic. if we use\
    \ just 0 to 10 cubed we get a pulse width of 0 to 1000, which is ideal for the\
    \ 1024 pulse used in the previous example, i.e. a duty cycle going from 0 to close\
    \ to 100%.\n\nIf you need the utilize speed you pre-compute the powers, but for\
    \ simplicity we will just use integer multiplication:\n\n```\n#include <stdio.h>\n\
    #include <stdlib.h>\n#include <bcm2835.h>\n\nint main(int argc, char **argv){\n\
    \    if (!bcm2835_init()n        return 1;\n    bcm2835 gpio_fsel(18, BCM2835_GPIO_FSEL_ALT5);\n\
    \    bcm2835 pwm_set_clock(2);\n    bcm2835 pwm_set_mode(0, 1, 1);\n    bcm2835\
    \ pwm_set_range(0, 1024);\n    int w = 0;\n    int inc = 1;\n    for (;)\n{\n\
    \        bcm2835 pwm_set_data(0, w * w * w);\n        if (w > 10 || w <= 0)\n\
    \            inc = -inc;\n        bcm2835 delayMicroseconds(50000);\n    }\n \
    \   return (EXIT_SUCCESS);\n}\n```\n\nAs this produces 10 cubic steps, a bcm2835_delayMicroseconds\
    \ of 50ms makes each step 50ms, and it takes 500ms to go from low to high.\nIf\
    \ you try the program you should find that you see the LED increase steadily towards\
    \ a maximum and then decrease steadily to a minimum.\n\nIf you replace the delay\
    \ with a value of 100000 i.e. 100ms then you will get a one-second cycle i.e.\
    \ 10x100ms, which using only ten steps to look a little too flashy."
  merge: -1
  pgno: 150
- img_proc: true
  md: "You can increase the number of steps by simply dividing by a suitable factor.\n\
    If you cube 1 to 20, you get 1 to 8000 and dividing by 8 gives 0 to 1000.\nDividing\
    \ by 8 is just a matter of three right shifts, and while not very accurate,\n\
    does allow fast computation with integer arithmetic:\n\n```\n#include <stdio.h>\n\
    #include <stdlib.h>\n#include <bcm2835.h>\n\nint main(int argc, char **argv) {\n\
    \    if (!bcm2835_init())\n        return 1;\n    bcm2835_gpio_fsel(18, BCM2835_GPIO_FSELALT5);\n\
    \    bcm2835_pwm_set_clock(2);\n    bcm2835_pwm_set_mode(0, 1, 1);\n    bcm2835_pwm_set_range(0,\
    \ 1024);\n    int w = 0;\n    int inc = 1;\n    for (;;) {\n        bcm2835_pwm_set_data(0,\
    \ (w * w) >> 3);\n        w = w + inc;\n        if (w > 20 || w <= 0)\n      \
    \      inc = -inc;\n        bcm2835_delayMicroseconds(50000);\n    }\n    return\
    \ (EXIT_SUCCESS);\n}\n```\n\nNotice that now, as there are as many steps. we only\
    \ need each one to\nlast half the time, i.e. 50ms to give a one second flash.\n\
    \nYou can also set the PWM to mode 0, i.e. balanced mode:\nbcm2835_pwm_set_mode(0,\
    \ 0, 1);\n\nThis does the LED look even smoother, but the increase in RF noise\n\
    makes it essential to put the Pi in a metal case.\n\nIn most cases it is irrelevant\
    \ exactly how linear the response of the LED is - a\nrough approximation looks\
    \ as smooth as the human eye. The only exception\nis when you are trying to drive\
    \ LEDs to create a gray-level or color display\nwhen color calibration is out\
    \ another level of accuracy."
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Controlling A Servo


    Hobby servos, the sort used in radio control models, are very cheap and easy to
    use and the Pi has enough PWM lines to control two of them without much in the
    way of extras.


    A basic servo has just three connections, ground, a power line and a signal line.
    The colors used vary, but the power line is usually red, ground is usually black
    or brown and the signal line is white, yellow or orange.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_152_0.png)


    The power wire has to be connected to a 5V supply capable of providing enough
    current to run the motor - anything up to 500mA or more depending on the servo.
    In general you cannot power a full-size servo from the Pi''s 5V pin, you need
    a seperate5 power supply. You can power some micro servos directly from the Pi''s
    5V, line but you need to check the specifications. The good news is that the servo
    signal line generally needs very little current, although it does, in theory,
    need to be switched between 0 and 5V using a PWM signal.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_152_1.png)'
  merge: -1
  pgno: 152
- img_proc: true
  md: 'This is the correct way to drive a servo but in nearly all cases you can connect
    the servo to 5V and the pulse line directly to the 3.3V GPIO line. In other words
    in most cases you don''t need a transistor driver and the circuit shown below
    will work:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_153_0.png)


    Now all we have to do is set the PWM line to produce 20ms pulses with widths ranging
    from 0.5ms to 2.5ms.


    As described earlier, the best way to work out a configuration that gives a particular
    repeat rate is to start at the highest clock rate and work out the range needed.
    For example, with a clock of 9.6MHz the range needed to give a 20ms repeat rate
    is:


    max range = repeat * clock frequency = 192000


    This gives you the maximum range you can use. If you actually want a smaller range
    you can reduce the clock to a lower frequency and the divider you need is:


    divider = 2 * max range/desired range


    because the smallest divider you can use is 2.


    So, to get a range of 1024, i.e. a 16 bit resolution we need a clock divider of:
    divider = 2 * 192000/1024= 375


    If you use a divider of 375 and a divider of 1024 you will find that the repetition
    rate is, as promised, 20ms.


    Most servos work on a pulse width ranging from 500µs to 2.5ms, or a duty cycle
    of 2.5% to 12.5% but this varies quite a lot according to the servo.


    Using a range of 1024, this corresponds to values of data from 25 to 128.'
  merge: -1
  pgno: 153
- img_proc: true
  md: "The simplest servo program you can write is something like:\n\n```\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n#include <bcm2835.h>\n\nint main(int argc, char**\
    \ argv) {\n    if (!bcm2835_init()) {\n        return 1;\n    }\n\n    bcm2835_gpio_fsel(1,\
    \ BCM2835_GPIO_FSEL_ALT);\n    bcm2835_pwm_set_clock(375);\n    bcm2835_pwm_set_mode(0,\
    \ 1, 1);\n    bcm2835_pwm_set_range(0, 1024);\n\n    for (;;) {\n        bcm2835_pwm_set_data(0,\
    \ 25);\n        bcm2835_delayMicroseconds(2000000);\n        bcm2835_pwm_set_data(0,\
    \ 50);\n        bcm2835_delayMicroseconds(2000000);\n        bcm2835_pwm_set_data(0,\
    \ 128);\n        bcm2835_delayMicroseconds(2000000);\n    }\n    return (EXIT_SUCCESS);\n\
    }\n```\n\nThis moves the servo to three positions, pulsing between each. This\
    \ works with the direct drive servo circuit but not with the transistor drive\
    \ circuit.\nThe reason is that the transistor voltage driver is an inverter. When\
    \ the PWM line is high the transistor is fully off and the servo's pulse line\
    \ is grounded. When the PWM line is low the transistor is fully on and the servo's\
    \ pulse line is pulled high by the resistor.\n\nThe standard solution in this\
    \ case is to use two transistors to generate a non-inverted pulse. The simplest\
    \ solution of all is to ignore the problem in hardware and solve the problem in\
    \ software. This is generally a good approach to take before you consider modifying\
    \ the hardware unless there is an easier software fix.\nInstead of generating\
    \ 20 pulses with widths 0.5ms to 2.5ms, you can generate an inverted pulse with\
    \ 20 pulses with widths in 17.5ms to 19ms. The principle is that if the servo\
    \ needs a 10% duty cycle we supply it with a 90% duty cycle which the inverter\
    \ converts back to a 10% duty cycle. The range of duty cycles we use goes from\
    \ 17.5ms to 19.5ms, which in percentages is 87.5% to 97.5%, or as values 895 to\
    \ 997."
  merge: -1
  pgno: 154
- img_proc: true
  md: "Simple math can convert an angle T to a value in the range 895 to 997:\nvalue\
    \ = (997-895)/180*T+895 = 138*T/180+895\n\nTo make sure this works with all servos,\
    \ it is a good idea to restrict the range\n1ms to 2ms or demers 18ms to 19ms and\
    \ hence values from 920 to 972:\nvalue = 52*T/190+920\n\nWe can write the same\
    \ testing program as:\n#include <stdio.h>\n#include <stdlib.h>\n#include <bcm2835.h>\n\
    \n```\nint main(int argc, char **argv) {\n    if (!bcm2835_init())\n        return\
    \ 1;\n    bcm2835_gpio_fsel(18, BCM2835_GPIO_FSEL_ALT5);\n    bcm2835_pwm_set_clock(375);\n\
