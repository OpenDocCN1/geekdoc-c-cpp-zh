- img_proc: true
  md: '# Running Programs On NetBeans


    All you have to do run the program is click the Run icon or press F6. This downloads
    the program to the Pi that is the Build Server for the project and then runs it
    on the same Pi. If you try this with Blink you will see the LED blink or the Logic
    Analyzer will show the pulse train.


    The next question is how you stop the program. If the program isn''t in the form
    of an infinite loop it will terminate naturally and you don''t have to do anything
    to stop it. Blink is an infinite loop which never ends so you need to have some
    way of stopping it. If you click the run a second time a second copy of the program
    will be created and will start to run. This clearly isn''t a good idea for programs
    that are interacting with GPIO inputs.


    You have to explicitly stop the program before you run it again. To do this simply
    click the red stop button in the Output window:


    ```

    CppApplication_4 (Build, Run) - root@192.168.11.151:22

    Uploading files:

    Checking permissions...

    Uploading changed files finished successfully.

    cd /root/.netbeans/remote/192.168.11.151/rockrose

    /usr/bin/make -f Makefile CONJ=Debug

    /usr/bin/make -f nbproject/Makefile-Debug.mk Q8

    ```


    You can also see that there is a program running from the status bar at the bottom
    of the window:


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_39_0.png)


    If you do multiple programs, either by design or accident, you can stop any of
    them by double clicking on the status at the bottom of the window. Notice the
    message to the right tells you how many programs are running. You can stop any
    or all by clicking on the corresponding stop buttons.


    This is the minimum you need to know to run a program using NetBeans. It is worth
    spending a little time to learn some of the other features provided – especially
    the debugging tools.'
  merge: -1
