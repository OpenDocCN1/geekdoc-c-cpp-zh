- img_proc: true
  md: 'The single core Pi has to share its single core even with a high priority FIFO
    process. The quad core Pi 2, Pi 3 and Pi 4 should behave differently because they
    have three cores to work with after you monopolize a whole core with your program.


    Let''s see how things work with a Pi 4. The first difference is that if you start
    a CPU hog process using the stress command your program and the CPU still gets
    100% of the CPU until you start more than three CPUs – i. on core. They also have
    to be started from different consoles so that each get a share of the total CPU
    time. As you increase the number of CPUs you will see under FIFO scheduling your
    C program retains 100% of its core and the remaining three cores are shared between
    the CPUs. The output of the program is interrupted every 10ms as the scheduler
    examines it for about 6µs otherwise the output is continuous.


    The reason for this behavior is fairly obvious. Now your process can run by one
    of the cores while the remaining three are shared between the other non-real-time
    processes. Thus, for a four-core Pi, near real-time Linux works better than a
    single core Pi Zero. For a core Pi you can expect a response in 6µs even under
    a heavy load using FIFO. On a Pi Zero The maximum latency is 50ms.


    Adding a simple statement makes your program hog one of the available processor
    cores and removes the long interruptions that occur when other threads are scheduled
    to run. You might think at this point that the best thing to do is set a maximum
    priority and use FIFO as soon as your program is loaded. However, hogging a single
    core on a Raspberry Pi can have some undesirable effects. To avoid these it is
    a good idea to only enable FIFO scheduling when it is absolutely needed or to
    use the command at intervals.


    # Deadline Scheduling


    FIFO can be used to lock a single process into a core so to get the maximum time
    possible but there are more subtle ways of managing things. Earliest Deadline
    Scheduling (EDS) is a recently introduced (Kernel 3.14) Linux scheduling policy.
    Due to its recent introduction and because it isn''t a POSIX scheduling method,
    it is not widely used, but it does have many good properties for real-time tasks.


    A SCHED_DEADLINE thread is associated with three parameters – runtime, period
    and deadline. The thread will receive nanoseconds of execution every period nanoseconds
    and deadline specifies in nanoseconds how delayed into the period the allocation
    can be. If a thread takes longer than its runtime period the operating system
    suspends it and restarts it at its next activation period.'
  merge: -1
  pgno: 370
- img_proc: true
  md: 'It is also useful to know that in this case sched yields the thread until its
    next time period starts. This means you can give time back to the system if you
    have overestimated how long a task should take.

    Notice that times are specified in nanoseconds (ns), but microseconds (µs) are
    more reasonable for describing how long a real-world task is likely to take. For
    example, if runtime is 10µs, period is 100µs and deadline is 20µs you can be sure
    that the thread will get 10µs every 100µs and the maximum delay from the start
    of the 100µs period is 20µs. If the setting is a hardware line high at the start
    of the 10µs and low at the end, the pulses will be 10us and repeat every 100µs,
    with a jitter of 20µs from the start of the 100µs period, i.e. a pulse could be
    up to 20µs late. This only works if the system isn''t overloaded and there aren''t
    enough CPUs to satisfy all of the demands. As long as the system isn''t overloaded,
    the scheduling algorithm will meet the specifications of period and deadline.


    You may be wondering how Linux can manage to operate with threads that have different
    scheduler policies? The answer is that Linux has a modular scheduler which can
    be expanded by the addition of new classes. At the moment there are four scheduler
    classes, idle, cfs, rt in order of priority. All Deadline tasks are scheduled
    first, then FIFO, Round Robin and finally Normal. What this means is that if there
    are any runnable Deadline threads take precedence of any other type of thread.
    However, to keep the system running, Linux only allows Deadline tasks to add up
    to 95% of the available computing time. This leaves no than 5% for the other schedulers.


    To set deadline scheduling you have to use the Linux-specific calls and these
    these are not available as easy-to-call functions in the GNU libraries. Fortunately
    it is very easy to use a direct Linux syscall:


    ```

    int sched_attr(pid, struct sched *attr, flags);

    ```


    where pid is the Linux process id and not the thread id returned by Pthreads.
    If this is 0 then the current thread is used. The second parameter is a pointer
    to a new struct which sets the properties of the scheduling policy and the third,
    flags, is an integer which is currently unused and should be set to 0.'
