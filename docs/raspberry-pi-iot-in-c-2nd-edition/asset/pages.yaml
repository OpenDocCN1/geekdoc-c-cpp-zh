- img_proc: true
  md: 'Often more sophisticated approaches are used to try and handle more external
    changes of state in a given time. Somehow the infinite polling loop is seen as
    wasteful. What is the CPU doing if it spends all its time looping round waiting
    for something to happen? Of course, if it has nothing better to do then it isn''t
    a waste. In IoT devices are dedicated to just getting one job done so the “polling
    is wasteful” meme so prevalent in the rest of computing is completely unjustified.


    What is, the polling loop is usually the way to get the greatest throughput. If
    a processor can handle X state changes per second and respond with them Y state
    changes per second, moving to an event- or interrupt-based implementation reduces
    both X and Y. In short, if a processor cannot do the job using a polling loop
    then it cannot do the job. This is not to say that there no advantages to events
    and interrupts – are, but they do not increase throughput.


    So how you organize a polling loop so that it does is self-evident looking at
    the code?


    There are many answers to this the system being implemented and there are no “pure”
    theoretical answers that solve all problems, but the finite state machine, or
    FSM, is a model every IoT programmer should know.


    A finite state machine is very simple. At any given time the machine/program has
    a record of the current state S. At a regular interval the external world provides
    an input I which changes the state from S to S’ and produces an output O. That’s
    all there is a finite state machine. There are variations on the definition of
    the FSM but this one, a Mealy machine because its outputs depend on both its state
    and the input, is most suitable for IoT programming.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_87_0.png)


    You can design an FSM with the help of a diagram. In the FSM shown we have three
    states 1, 2 and 3 if you are in state 1 an input of A moves the system to state
    2 and an input of B moves it into state 3.'
  merge: -1
  pgno: 87
- img_proc: true
  md: "Your program simply needs to take the form of a polling loop that implements\
    \ a finite state machine. It reads the input lines as I and uses this and the\
    \ current state S to determine the new state S' and the output O. There is some\
    \ overhead in using this organization, but it is usually worth. Notice that this\
    \ organization implies that you read input once, make changes and set outputs\
    \ in the loop. If you fix the time that the polling loop takes then you know the\
    \ characteristic time for any changes to the system.\n\n# FSM Button\n\nAs an\
    \ example, let's implement the simple button earlier in the chapter. The first\
    \ version used multiple loops to wait for changes in the state of the input line.\
    \ The finite state version uses only a single polling loop:\n\n```\n#include <stdio.h>\n\
    #include <stdlib.h>\n#include <bcm2835.h>\nint main(int argc, char** argv) {\n\
    \    if (!bcm2835_init()) return 1;\n    bcm2835_gpio_fsel(RPI BPLUS GPIO_J8_07,\
    \ BCM2835 GPIO_FSEL INPT);\n    bcm2835_gpio_set_pud(RPI BPLUS GPIO_J8_07, BCM2835\
    \ GPIO_PUD UP);\n    uint64_t t = 0;\n    int i;\n    while (1) {\n        t =\
    \ bcm2835_st_read();\n        i = bcm2835_gpio_lev(RPI BPLUS GPIO_J8_07);\n  \
    \      switch (s) {\n            case 0: //Button pushed\n                if (!i)\
    \ {\n                    s = 1;\n                    printf(\"Button Push \\n\\\
    r\");\n                    flush(stdout);\n                }\n               \
    \ break;\n            case 1: //Button released\n                if (i) {\n  \
    \                  s = 0;\n                }\n                break;\n       \
    \     default:\n                s = 0;\n        }\n        \n        t=bcm2835_st_read();\n\
    \        bcm2835_delayMicroseconds(1000-t);\n    }\n    return 0;\n}\n```"
