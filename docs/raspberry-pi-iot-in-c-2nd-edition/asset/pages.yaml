  md: "```\n{\n  \"label\": \"CopyBuildRemote\",\n  \"dependsOrder\": \"sequence\"\
    ,\n  \"dependsOn\": [\n    \"copyToRemote\",\n    \"buildRemote\"\n  ],\n  \"\
    problemMatcher\": [],\n  {\n    \"label\": \"StopRemoteC\",\n    \"type\": \"\
