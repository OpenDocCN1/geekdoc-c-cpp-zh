    \ uint32_t* paddr;\n    bcm2835_spiOLD=bcm2835_spi0;\n    bcm2835_spi0 = bcm2835_peripherals\
    \ + BCM2835_SPI6_BASE / 4;\n\n    bcm2835 gpio_fsel(27, BCM2835 GPIO_FSEL ALT3);\
