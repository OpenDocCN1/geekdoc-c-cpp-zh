  md: 'First we need to include the pthread library and this isn''t just a matter
    of adding the include:


    ```

    #include <pthread.h>

    ```


    You also have to specify the name of the library that you want the linker to add
    to your program. To do this right-click on the project and select properties.
    Select Build, Linker in the dialog box that appears, click the three dots in the
    Libraries section, click Add Library and specify pthread. Don''t make the mistake
    of trying to add a Library File. You can also use the Add Standard Library option
    and if you are using VS Code change the setting in "libs.json" to:


    ```

    "libs": ".pthread",

    ```


    The simplest way of implementing this is to create a function waitInterrupt that
    we can run on another thread:


    ```

    void *waitInterrupt(void *arg) {

    intVec *intData = (intVec*) arg;

    struct epoll_event ev;

    for (;;) {

    int nfds = epoll_wait(intData->epfd, &ev, 1, 20000);

    if (nfds != 0) {

    intData->func(intData->fd);

    }

    }

    ```


    This casts the input arg to the correct type for use in the function. Then it
    repeatedly calls an epoll which suspends the thread until the interrupt occurs.
    It wakes up and checks that it was the interrupt and not a timeout. If so it calls
    the interrupt routine which is expected to read the data waiting in the file so
    that the interrupt is cleared. The interrupt routine doesn''t read the file, then
    the interrupt will occur immediately the epoll is called again. Notice that this
    means the interrupt could be called more than once to read all the data from the
    file.


    The waitInterrupt function accepts a pointer to a struct that contains all of
    the information about what the epoll call has to wait for:


    ```

    typedef struct {

    int epfd;

    int fd;

    eventHandler func;

    } intVec;

    ```


    The epfd field is the file descriptor for the epoll entity, fd is the file descriptor
    for the GPIO line and func is the interrupt handler you want to call when the'
