  md: '# Appendix II


    # Using VS Code For Remote C Development


    Visual Studio Code, or VS Code, is a very popular code editor and, with just a
    little effort, it can be made to work very well with a Raspberry Pi for remote
    development. VS Code can be installed on a PC, a Mac or a Linux machine, including
    the Pi, and you can simply use it for local code development. That is, you create
    the source code and run the program on the same machine that VS Code is running
    on. As explained in Chapter 2, this works well on a Pi 4, but it can be slow on
    a Pi Zero. There is also the matter of having to copy source code onto another
    machine if you want to try it out on a different device.


    A simpler alternative is to use remote development, where VS Code is installed
    on a desktop or portable computer and used to write the source code which is stored
    on the same computer. When the time comes to run the source code, it is uploaded
    to the remote machine and compiled and run there. You can even run a debug session
    with the code running on a remote machine and the debugger console running on
    the local machine. This is very convenient because you have a central copy of
    the program and switching to another Raspberry Pi is very easy.


    VS Code has a remote development option for C/C+, but it currently doesn''t work
    on ARM machines like the Pi and it is unlikely to ever work on the Pi Zero because
    of the demands it makes. A simple solution is to use a custom launch file to implement
    remote running and remote debugging. The files presented here have been tested
    on Windows, but they should work on Mac OS and Linux with changes to the folders
    used.


    # Preliminaries


    The first thing you have to do is install VS Code. As this changes very frequently,
    the only advice I can give is to follow the current instructions on the website
    https://code.visualstudio.com/. Install accepting all the defaults unless you
    know better.'
  merge: -1
