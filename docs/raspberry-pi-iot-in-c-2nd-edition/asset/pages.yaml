- img_proc: true
  md: 'There is also the Pi library function:

    unsigned bcm_host_get_peripheral_address())

    which you will find in:


    ```

    #include <bcm_host.h>

    ```


    You also need to add bcm_host to the linker. This is the “official” way to find
    out of the configuration.


    # Register Offsets


    Register addresses can be specified as offsets from bcm2835_peripherals_base but
    it is easier to take the offsets from where the first register of the type is
    in the block.


    So for the GPIO the first GPIO register is at 0x200000 from the start of the block.
    In the bcm2835 library this is given by BCM2835_GPIO_BASE.

    That is, the starting address of the GPIO registers is given by:

    gpio address = bcm2835_peripherals_base + BCM2835_GPIO_BASE


    The offsets for each of the registers this address is:


    | | |

    |---||

    | 0x0000 | GPSEL0 GPIO Function Select 0

    | 0x0004 | GPSEL1 GPIO Function Select 1

    | 0x0008 | GPSEL2 GPIO Function Select 2

    | 0x000C | GPSEL3 GPIO Function Select 3

    | 0x0010 | GPSEL4 GPIO Function Select 4

    | 0x0014 | GPSEL5 GPIO Function Select 5 |

    | | |

    | 0x001C | GPSET0 GPIO Pin Output Set 0

    | 0x0020 | GPSET1 GPIO Pin Output Set 1 |

    | | |

    | 0x0028 | GPCLR0 GPIO Pin Output Clear 0

    | 0x002C | GPCLR1 GPIO Pin Output Clear 1 |

    | | |

    | 0x0034 | GPLEV0 GPIO Pin Level 0

    | 0x0038 | GPLEV1 GPIO Pin Level 1 |

    | | |

    | 0x0040 | GPEDS0 GPIO Pin Event Detect Status 0

    | 0x0044 | GPEDS1 GPIO Pin Event Detect Status 1 |'
  merge: -1
