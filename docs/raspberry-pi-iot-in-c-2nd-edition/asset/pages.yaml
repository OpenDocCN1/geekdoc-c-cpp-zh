  md: '# # Chapter 15

    # The Multidrop 1-Wire Bus


    Sometimes it it just easier deor from the point of view of hardware to connect
    a set of 1-wire devices to the same GPIO line, but this makes the software more
    complex. This chapter looks at how to discover what devices are present on a multidrop
    bus (MDB) and how to select the one you want to work with.

    The1-wire bus has a very sophicated addressing mechanism that lets you discover
    what devices are connected to a 1-wire implementation. This is an algorithm well
    knowing about its ingenious design and in this chapter a 1-wire function is developed.
    Unlike the one presented by Maxim, the company that invented the 1-wire bus, it
    is recursive and, as simpler.

    Every 1-wire bus device has a unique 64-bit serial number that serves as its address
    on the bus. You can select just one device by writing its serial number. However,
    how do you discover what devices are connected?


    # # The Hardware


    The first thing to clear up is that you can run multiple 1-wire devices on the
    same bus by adding them in parallel. You only need a single pull-up resistor,
    no matter how many devices there are on the bus.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_234_0.png)


    In this chapter the DS18B20 will be used as an example because it is often used
    in this way, but the same techniques will work with other devices and mixed devices.'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# The 1-Wire Search Algorithm


    The serial number has a standard format. The least significant byte is a family
    code, i.e what sort of device it is, the next six bytes are the serial number
    and the most significant byte is a checksum.


    | MSB | 64-Bit ''Registration'' ROM Number | LSB |

    | 8-Bit CRC | 48-Bit Serial Number | 8-Bit Family Code |

    | MSB LSB MSB | LSB MSB LSB |


    All bytes used are as the address of the devices and this means we can check for
    transmission errors by simply applying the CRC function developed in earlier chapters.


    If you know the serial numbers of the devices you can simply write your program
    to work with them. However, this means that you need to hard-code the serial numbers
    into your program, which doesn''t make it portable. A better solution is to scan
    the bus for connected devices and discover their serial numbers. This is what
    the 1-wire search algorithm is for. It has a reputation for being difficult to
    understand and even more difficult to implement. The good news is that it isn''t
    as difficult as it first appears and is very instructive.


    The basic idea is that the master sends an initialization pulse on the bus and
    all of the connected devices respond with their presence pulses. Next the master
    places the search command, 0xF0, on the bus which sets all of the devices into
    search mode.


    The master then reads two bits from the bus that together encode the first bit
    of the serial numbers from all of the devices. Given the nature of the 1-wire
    bus and the the pull-up works, the master receiver is the logical AND of all bits
    sent from each of the slaves. The first bit the slaves send their low-order bit
    and the second bit is the logical complement, i.e NOT, of their first bit. From
    these two bits the master can decode the following:


    | 1st Bit | 2nd Bit | Conclusion |

    | 0 | 0 | There is at least one device with a 1 in this position and another with
    a 0 |

    | 0 | 1 | All devices have a 0 in this position |

    | 1 | 0 | All devices have a 1 in this position |

    | 1 | 1 | No devices are present |


    Obviously 1 is an error condition indicating something has removed the devices
    from the bus.'
  merge: -1
  pgno: 235
- img_proc: true
  md: 'In the case of receiving either 0 or 1 the bit at that position has been determined
    to be a 0 or 1 respectively and all of the devices on the bus share value in their
    serial numbers at this bit position. If the master receives 0 then there are devices
    with a 1 and devices with a 0 in their serial numbers at this position and the
    master can pick one of the values to explore. Of, if the master wants to list
    all of the devices on the bus it has to return to this point and explore the second
    possibility.


    The master selects which value it goes to follow by transmitting a single bit.
    All of the devices that match the bit in their serial number continue to transmit
    bits to the master while those that do not go into a wait state until the next
    initialization pulse from the master.


    The search algorithm determines a single bit of a serial number by reading two
    bits from the slaves and transmitting one bit to reduce the number of slaves participating
    in the scan. By repeating the "read two bits/write one" action the master eventually
    finds all 64 bits of the serial number. One of the slaves. It then has to backtrack
    to one of the bit locations where there was a choice of which bit to select and
    select the alternative.


    Notice that the master starts off trying to determine bit zero for a single device
    connected to the bus. It determines each bit where all of the devices agree on
    a 0 or a 1. Each time the master encounters a bit conflict, i.e. there are devices
    with a 0 and a and a 1 in this bit position, it selects one value and tells the
    devices with the other value to switch off. It then continues to determine the
    subsequent bit positions for the remaining devices. As the serial numbers are
    unique, the master always ends up talking to one device.


    You can probably see that this is a depth-first tree search with branches where
    the bit values are in conflict.


    ![](img/175b89abfcdc9824337e5b1ac4bb1ef3_236_0.png)'
