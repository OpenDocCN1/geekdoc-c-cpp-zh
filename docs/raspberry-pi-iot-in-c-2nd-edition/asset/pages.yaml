  md: "# How Fast Can We Measure?\n\nButtons are one form of input, but often we want\
    \ to read data from a GPIO line driven by an electronic device and decode the\
    \ data. This usually means measuring the width of the pulses and this raises the\
    \ question of how fast can we accept input?\n\nThe simplest way to find out how\
    \ quickly we can take a measurement is to perform a pulse width measurement using\
    \ a busy wait. Applying a square wave to GPIO 4, i.e. pin 7, we can measure the\
    \ time that the pulse is high using:\n\n```\n#include <stdio.h>\n#include <stdlib.h>\n\
    #include <bcm2835.h>\n\nint main(int argc, char** argv) {\n    if (!bcm2835_init())\
    \ return 1;\n\n    bcm2835_gpio_fsel(RPI_BPLUS_GPIO_J8_07,BCM2835_FSEL_INPT);\n\
    \    volatile int i;\n    while (1) {\n        while (i == 0) bcm2835_gpio_lev(RPI_BPLUS_GPIO_J8_07);\n\
    \        for (i = 0; i < 5000; i++) {\n            if (i == 0) bcm2835_gpio_lev(RPI_BPLUS_GPIO_J8_07))\
    \ break;\n            printf(\"%d\\n\\r\", i);\n        }\n        fflush(stdout);\n\
    \    }\n    return (EXIT_SUCCESS);\n}\n```\n\nThis might look a little strange\
    \ at first.\nThe inner while loops are responsible for getting us to the right\
    \ point in the waveform. First we loop until the line goes low, then we loop until\
    \ it goes high and again finally how long before it goes low. You might think\
    \ that we simply have to wait for it to go high and then measure how long it goes\
    \ low, but this misses the possibility that the signal might be part way through\
    \ a high period when we first measure it."
  merge: -1
