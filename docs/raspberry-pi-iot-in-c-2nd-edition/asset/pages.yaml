- img_proc: true
  md: "# Some Packaged Functions\n\nThis all works, but it would be good to have a\
    \ function that has the AtoD on\nspecified channel:\n\n```\nfloat readADC(uint8_t\
    \ chan) {\n    char buf[] = (0x01, (0x08 | chan) << 4, 0x00);\n    char readBuf[3];\n\
    \    bcm2835_spi_transfern(buf, readBuf, 3);\n    int data = ((int)readBuf[1]\
    \ & 0x03) << 8 | readBuf[2];\n    return (float) data * 3.3f / 1023.0;\n}\n```\n\
    \nNotice that this only works if the SPI bus has been initialized and set up\n\
    correctly. An initialization function is something like:\n\n```\nvoid spiInit()\
    \ {\n    bcm2835_spi_setDataMode(BCM2835 SPI MODE0);\n    bcm2835_spi_setClockDivider(BCM2835\
    \ SPI CLOCK_DIVIDER_4096);\n    bcm2835_spi_chipSelect(BCM2835 SPI CS0);\n   \
    \ bcm2835_spi_chipSelectPolararity(BCM2835 SPI CS0, LOW);\n    bcm2835_spi_setOrder(BCM2835_SPI_BIT_ORDER\
    \ MSBFIRST);\n}\n```\n\n# How Fast\n\nOnce you have the basic functionalities\
    \ working, the next question is always how\nfast something work. In this case\
    \ we need to know what sort of data\nrates we can achieve using this AtoD converter.\
    \ The simplest way of finding\nthis out is to use the fastest read loop for Channel\
    \ 5:\n\n```\nfor(;; {\n    int data=readADC(0x05);\n}\n```\n\nWith the clock we\
    \ used earlier:\nBCM2835_SPI_CLOCK_DIVIDER_4096\n\nThis gives a clock rate of\
    \ 61kHz (on a Pi Zero) and the sampling\nrate is measured to 2.26kHz. This is\
    \ perfectly reasonable as it takes at least\n24 clock pulses to read the data.\
    \ Most of the time in the loop is during the 24\nclock pulses, so there is little\
    \ to be gained from optimization.\n\nIncreasing the clock rate to around 900kHz\
    \ by setting the divider to 256 (on a\nPi Zero) pushes the sampling rate to 36kHz,\
    \ which is just enough to\ndigitize audio as long as you don't waste too much\
    \ time in the loop\nprocessing. Changing the clock rate to 2Mhz, using a divisor\
    \ of 128 (for a\nPi Zero), pushes the sampling up to 70kHz, which is fast enough\
    \ for most\naudio."
