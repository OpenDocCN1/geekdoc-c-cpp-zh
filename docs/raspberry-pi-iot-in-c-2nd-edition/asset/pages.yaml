- img_proc: true
  md: 'also generates additional error frequencies that, with luck, are outside the
    band required and easy to remove. If you opt for no MASH filter then you cannot
    use a fractional divider. Selecting one, two or three MASH filters produces the
    required frequency, but with different properties of noise associated with the
    signal.


    The three GPIO clocks can be used with the following GPIO lines:


    | GPCLK0 | GPIO4 | GPIO20 | GPIO32 | GPIO44 |

    | GPCLK1 | GPIO5 | GPIO21 | GPIO42 | |

    | GPCLK2 | GPIO6 | GPIO43 | | |


    The only GPIO pin available on early Pis is GPIO4, but on later ones you can use
    the following:


    | GPIO4 | GPCLK0 | ALT0 |

    | GPIO5 | GPCLK1 | ALT0 (reserved for system use) |

    | GPIO6 | GPCLK2 | ALT0 |

    | GPIO20 | GPCLK0 | ALT5 |


    Each clock is controlled by two registers: a control register and a register used
    to specify the clock driver.


    The word offsets for the registers, which should be multiplied by 4 for byte addresses
    are:


    ```

    #define CLK_GP0_CTL 28

    #define CLK_GP0_DIV 29

    ```


    ```

    #define CLK_GP1_CTL 30

    #define CLK_GP1_DIV 31

    ```


    ```

    #define CLK_GP2_CTL 32

    #define CLK_GP2_DIV 33

    ```


    ```

    #define CLK_PCM_CTL 38

    #define CLK_PCM_DIV 39

    ```


    ```

    #define CLK_PWM_CTL 40

    #define CLK_PWM_DIV 41

    ```


    The offsets are all relative to the start of the peripheral area using:


    ```

    BCM2835_CLOCK_BASE 0x101000

    ```


    Alternatively use:


    ```

    bcm2835_clk

    ```


    which is a word address relative to the start of the memory-mapped registers.'
