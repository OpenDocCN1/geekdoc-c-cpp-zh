  md: 'In this case the main program simply stops its thread leaving the Deadline
    thread to run every two seconds. In a real instance the main program could continue
    to run using any of the other scheduling policies.


    If you run the above program, the chances you will simply see “sensor” printed
    as fast as your machine can print it. The reason is to use Deadline scheduling
    you have to run the program with root privileges. The setattr fails and you should
    test the return value of setattr for an error.


    To make the program work it has to be run as root or similar, see Chapter 3 if
    you need to know how to do this.


    Now if you run the program you should see the message printed every two seconds.
    The advantage of logging in as root is that you can make use of the debug facilities
    without making any changes.


    Deadline scheduling means you don''t need to use a full real-time version of Linux
    or an RT operating system. It is good enough for most situations where you have
    a set of short, duration-repetitive tasks. You can also be that the task will
    get its allocated time without interruption, even on a single-core machine.


    # Managing Cores On The Pi 4


    There is a world of difference between the Pi Zero and the Pi 4. The Pi Zero has
    only a single core and this has to do everything. The Pi 4 has four cores and
    this makes it possible to dedicate a core to a single task. The Pi Zero is small
    and ideally suited to IoT tasks, but sometimes the extra power of the Pi 4 is
    needed.


    The Pi 4 has four cores capable of running a single thread, there is no hyperthreading.
    It is also important to note that, as each core runs out of its own L1 cache,
    you can think of them as isolated machines. Even when they appear to be operating
    on the same variable, they are in fact working with their own copy of the variable.
    This would mean that each core has its own value of the state of the machine if
    it wasn''t for cache coherency mechanisms. When a core updates its level 1 (L1)
    cache then that change is propagated to all the L1 caches by special cache coherency
    hardware. This means that, even though updates to a variable by each cache occur
    in an isolated fashion, the change is propagated and all threads see the same
    updated value. What is not guaranteed by cache coherency is the order of update
    of different variables, which can be changed by the hardware for efficiency reasons.'
