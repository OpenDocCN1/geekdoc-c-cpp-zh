  md: "# Algorithm 57: isContractibleNMap(cm,d,i): test if an i-cell is contractible\
    \ for n-maps\n\n```\nInput: cm: an n-map;\n        d ∈ cm.Darts: a dart;\n   \
    \     i ∈ {0, ..., n}.\nOutput: True iff c_i(d) is contractible.\n1 if i = 0 then\
    \ return false;\n2 if i = 1 then return true;\n3 foreach dart d' ∈ c_i(d) do\n\
    4     if d'.Betas[i − 2].Betas[i − 1] ≠ d'.Betas[i − 1].Betas[inv(i − 2)]\n5 \
    \    then\n6         return false;\n7 return true;\n```\n\n# Algorithm 58: contractNMap(cm,d,i):\
    \ contract an i-cell for n-maps\n\n```\nInput: cm: an n-map;\n        d ∈ cm.Darts:\
    \ a dart such that c_i(d) is contractible;\n        i ∈ {2, ..., n}.\nResult:\
    \ Contract the i-cell c_i(d).\n1 ma ← reserveMarkNMap(cm);\n2 mark all the darts\
    \ in c_i(d) for ma;\n3 foreach dart d' ∈ c_i(d) do\n4     d1 ← d'.Betas[i];\n\
    5     if not isMarkedNMap(cm,d1,ma) then\n6         d2 ← d'.Betas[i − 1].Betas[i];\n\
    7         while isMarkedNMap(cm,d2,ma) do\n8             d2 ← d2.Betas[i − 1].Betas[i];\n\
    9         if d1 ≠ cm.null_dart then\n10            if d2 ≠ cm.null_dart then\n\
    11                d1.Betas[i] ← d2;\n12            else\n13                d1.Betas[i]\
    \ ← cm.null_dart;\n14        else\n15            if d2 ≠ cm.null_dart then\n16\
    \                d2.Betas[i] ← cm.null_dart;\n17 foreach dart d' ∈ c_i(d) do\n\
    18     remove d' from cm.Darts;\n19 freeMarkNMap(cm,ma);\n```"
