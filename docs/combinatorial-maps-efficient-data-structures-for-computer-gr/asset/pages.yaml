- pgno: 301
  md: 'In order to take into account the boundaries with the infinite region, the
    image is extended by one pixel all around it, these additional pixels belonging
    to the infinite region. In order to avoid special cases for these pixels and thus
    to simplify the algorithm, each last pixel of a line is identified with the first
    pixel of the next line (see Fig. 7.18(a)). Making these identifications is equivalent
    to fold the image on a cylinder with a shift on the lines, so that we can now
    iterate through the entire image by only advancing the current pixel in x direction.


    In order to satisfy our invariant for the first pixel of the image (pixel (0,
    0)), an upper border is first built in the 2-map (cf. Fig. 7.18(b)). It is composed
    by one dart to the left of the first pixel, and all the darts to the up of the
    pixels in the first line of the image. This border is extended for one pixel to
    the right of the image to consider the infinite region. To simulate the folding
    on a cylinder, β₁ links the dart to the left of the first pixel and the dart to
    the up of the last pixel of the first line (represented by the dashed curve in
    the figure). It is enough to add one pixel in the column to the right of the image
    because, thanks to the cylinder, the last pixel of a line is also the first pixel
    of the next line. The dart to the left of the first pixel is the first last dart,
    ready to be 2-sewn with the square describing pixel (0, 0). Thanks to this border,
    each pixel of the image can be processed without special case for first and last
    columns and lines.


    In the main loop of the construction algorithm (line 4 and 5) we consider pixel
    (i, j). First a square is created and 2-sewn with darts last and up. This is done
    in Algorithm 76, where first four darts are created and linked by β₁ (lines 1
    to 5). Then dart res[0] is 2-sewn with dart last, and dart res[1] with dart up
    (lines 6 and 7). Lastly the embedding of the four new darts is initialized given
    (x, y) the position of the up-left pointel. To take into account the bending of
    the image on a cylinder, the position of pointels are computed modulo the width
    of the image plus one. The function returns dart res[2] which is the dart to the
    right of the new square, i.e. the next last when processing the next pixel of
    the image.


    Note that during the main loop of the construction algorithm, only last dart is
    kept since up dart can be computed from last thanks to Algorithm 77 (where mainly
    we turn around the vertex containing dart last until obtaining a 2-free dart).


    In the next step of the construction algorithm, the two edges containing the darts
    last and up and the vertex containing dart last are considered in order to test
    if they must be removed or kept. The edge containing last must be removed if pixel
    (i − 1, j) belongs to the same region than the current pixel. Indeed in this case,
    there is no frontier between these two pixels. Note that if i = 0, pixel (−1,
    j) belongs to the infinite region R₀. Thus, if the current pixel belongs also
    to the infinite region (when j = n₂), both pixels belong to the same region; otherwise,
    they belong to two different regions. If i = n₁, pixel (i, j) belongs to the infinite
    region and both pixels belong to the same region only if pixel (i − 1, j) belongs
    also to the infinite region (when j = n₂).'
