    incidence graphs, cell-tuple structures and their simplicial analogs;\n- showed
    the relations between the cell-tuple structure and close structures of lower dimensions,
    namely the quad-edge structure and the facet-edge structure.


    Brisson restricted his work to subdivided manifolds without multi-incidence. In
    fact, the property characterizing manifolds, i.e. the neighborhood of any point
    is homeomorphic to a ball, is not a combinatorial property: as far as we know,
