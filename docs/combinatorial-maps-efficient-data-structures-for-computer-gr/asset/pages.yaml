    # *Incidence and adjacency relations*


    The “boundary” relation corresponds to the *incidence* relation: more precisely,
    an edge (resp. a vertex) which belongs to the boundary of a face is incident to
    the face, and conversely, the face is incident to the edge (resp. to the vertex).
    Moreover, if a vertex is part of the boundary of an edge (i.e. the vertex meets
    the edge), the vertex and the edge are incident to each other. Usually, adjacency
    is defined in the following way: two *i*-cells are *adjacent* if they share a
    common cell in their boundaries. For instance, two faces (resp. two edges) are
    adjacent if they share an edge or a vertex (resp. a vertex). Adjacency is sometimes
    defined in a generalized way: two cells are adjacent if they are incident to the
    same cell: for instance, two vertices are adjacent if they are incident to the
    same edge or to the same face.


