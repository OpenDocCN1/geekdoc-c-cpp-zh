    The function is *injective* (i.e. it is an *injection*) when, for any $x, y \in
    F$, $x \neq y$ implies $\phi(x) \neq \phi(y)$; so, in the corresponding graph,
    any vertex corresponding to an element of $G$ is the extremity of at most one
    edge.


    The function is *surjective* (i.e. it is a *surjection*) when, for any $y \in
    G$, $x \in F$ exists such that $y = \phi(x)$; so, in the corresponding graph,
    any vertex corresponding to an element of $G$ is the extremity of at least one
    edge.


    A function is *bijective* (i.e. it is a *bijection* or a one-to-one mapping) when
    it is injective and surjective: so, in the corresponding graph, any vertex corresponding
    to an element of $F$ is the origin of an edge, and any vertex corresponding to
    an element of $G$ is the extremity of an edge.


    The *inverse* bijection $\phi^{-1}$ is a bijection between $G$ and $F$ such that
    its graph is obtained by reversing all edges; in other words, $\phi(x) = y \implies
    \phi^{-1}(y) = x$.


    When $F = G$, the bijection is a *permutation* and the corresponding graph is
    a set of elementary cycles, since each vertex is the origin and the extremity
    of one edge; note that the inverse of a permutation is also a permutation (cf.
    Figs. 2.24(e) and (f)). Let $P$ be a permutation: a *fixed point* for $P$ is any
    element $x$ such that $P(x) = x$; a fixed point corresponds thus to a vertex incident
    to a loop in the associated graph.


    *Id* denotes the *identity*, i.e. any permutation such that $Id(x) = x$ for any
    $x$. In other words, all elements are fixed points for $Id$.


    An *involution* $I$ is a permutation which is its own inverse, i.e. $I = I^{-1}$,
    meaning $I(x) = y \implies I(y) = x$. The associated graph is thus a nonoriented
    graph, and any connected component is made by either one vertex incident twice
    to an edge (i.e. a loop) or two vertices incident to an edge: cf. Fig. 2.25(a).


    Let $F, G, H$ be three sets, $f$ and $g$ be two functions: $f : F \to G$, $g :
    G \to H$, such that $f$ is surjective. $g \circ f : F \to H$, the *composition*
    of $f$ and $g$, is defined by: $g \circ f(x) = g(y)$, with $y = f(x)$, for any
    $x \in F$, i.e. $g \circ f(x) = g(f(x))$. The graph corresponding to $g \circ
    f$ has $F \cup H$ as set of vertices, and its edges correspond to paths of length
    2 in the union of the graphs⁷ associated with $f$ and $g$.


    Note that the composition of two bijections is a bijection, the composition of
    two permutations is a permutation, the composition of two involutions is a permutation
    (cf. Figs. 2.25), and the composition of an involution with itself'
