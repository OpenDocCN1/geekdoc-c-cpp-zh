    # 9.2 Oriented Cellular Quasi-Manifolds


    # 9.2.1 Winged-edge


    The first data structure defined in order to describe 2D subdivisions for computer
    vision purposes is the winged-edge data structure [17].


    The main element of this data structure is the winged-edge, which is an edge having
    eight pointers to different incident cells. The main structural information is
    related to the four pointers which make it possible to access the incident edges
    by turning clockwise and counterclockwise around the incident vertices: cf. Fig.
    9.2. The winged-edge is often used for solid modeling, i.e. for representing the
    surface which bounds a polyhedron. By convention, clockwise ordering corresponds
    to a view from outside of the polyhedron, and this ordering is used for traversing
    the subdivision.


    In addition to the list of winged-edges, there is also a list of vertices and
    a list of faces. Different information is associated with vertices and faces:
