- pgno: 112
  md: 'Note that the restrict operation is only possible if the given set of darts
    D′ corresponds to a set of connected components. Indeed, otherwise, we would obtain
    some darts linked with some elements that do not belong to D′, contradicting the
    involution definition and thus the definition of n-Gmaps. However, we can use
    the restrict operation for any set of darts simply by using first the required
    unsew operations to isolate this set of darts.


    The split operation, given in Def. 17 takes as input an n-Gmap G and a subset
    of darts D′, and produces two n-Gmaps by using twice the restrict operation: a
    first time for D′ and the second time for D \ D′.


    # Definition 17 (split)


    Let G = (D, α₀, …, αₙ) be an n-Gmap, and D′ ⊆ D such that ∀d ∈ D′, ∀i ∈ {0, …,
    n}, αᵢ(d) ∈ D′. The two n-Gmaps obtained by splitting G along D′ are Gₛ₁(D′) =
    G|ᴅ′ and Gₛ₂(D′) = G|ᴅ\ᴅ′.


    It is straightforward to prove that each operation is the inverse of its corresponding
    operation. For that, we have to show that starting from G, using an operation
    then the corresponding inverse operation, we obtain an n-Gmap G′ which is isomorphic
    to G: for each operation, it is easy to choose the parameters of the operations
    which lead to this conclusion.


    # 4.2.2 Sew Operations


    Intuitively, the i-sew operation allows to “link” some i-free darts by αᵢ, for
    a given i. In order to satisfy the “composition constraint” of the n-Gmap definition
    (i.e. αᵢ ∘ αⱼ is an involution for |i − j| ≥ 2), we often need to put in relation
    not only two darts but several darts: for instance, if we link two darts by α₂
    in a 2-Gmap, it is necessary to link also the darts which are associated by α₀.
    For the i-sew operation, we choose to put in relation the minimal number of darts
    such that the result of the operation is an n-Gmap.


    In fact, the i-sew operation implies some identifications of cells: for instance,
    when two darts are sewn by α₂ in a 2-Gmap, the corresponding edges are identified
    into a single edge: this identification can involve the identification of the
    vertices incident to the initial edges.


    For this reason, it is not always possible to apply the i-sew operation: the cells
    to identify must have the same structure. More precisely, the two cells must be
    isomorphic to each other. Indeed, when two cells have different structures, we
    do not know how to do their identification. For example it is not possible to
    sew a cube and a tetrahedron since we do not know how to identify a square face
    with a triangle face. So, before defining the sew operation, we need to be able
    to test if a sew is possible. The property of “being i-sewable” is detailed in
    Def. 18.


    # Definition 18 (i-sewable)


    Let G = (D, α₀, …, αₙ) be an n-Gmap, i ∈ {0, …, n}, d, d′ ∈ D. Let o_d denotes
    ⟨α₀, …, α_{i−2}, α_{i+2}, …, αₙ⟩(d), and o_{d′} denotes ⟨α₀, …, α_{i−2}, α_{i+2},
    …, αₙ⟩(d′). d is i-sewable with d′ if d ≠ d′, αᵢ(d) ='
