    \ an array of n + 1 empty associative arrays from pairs of darts to darts;\n2\
    \  gm′ ← createNGMap(n + 1);\n3  foreach dart d ∈ gm.Darts do\n4      foreach\
    \ dart d′ ∈ gm′.Darts do\n5          for i ← 0 to n do\n6              phi[i][(d,\
    \ d′)] ← createDartNGMap(gm′);\n7  foreach dart d ∈ gm.Darts do\n8      foreach\
    \ dart d′ ∈ gm′.Darts do\n9          phi[0][(d, d′)].Alphas[0] ← phi[0][(d, d′.Alphas[0])];\n\
    10         phi[0][(d, d′)].Alphas[1] ← phi[1][(d, d′)];\n11         for i ← 2\
    \ to n + 1 do\n12             phi[0][(d, d′)].Alphas[i] ← phi[0][(d.Alphas[i −\
    \ 1], d′)];\n13         for i ← 0 to n − 1 do\n14             phi[n][(d, d′)].Alphas[i]\
    \ ← phi[n][(d.Alphas[i], d′)];\n15         phi[n][(d, d′)].Alphas[n] ← phi[n −\
    \ 1][(d, d′)];\n16         phi[n][(d, d′)].Alphas[n + 1] ← phi[n][(d, d′.Alphas[1])];\n\
    17         for j ← 1 to n − 1 do\n18             for i ← 0 to j − 1 do\n19   \
