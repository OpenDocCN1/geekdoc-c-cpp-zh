- pgno: 33
  md: '# 1.3.2  Some Interests of Many Structures


    It can be interesting to simultaneously handle several data structures for a given
    application. For instance for architectural design, a 2-dimensional drawing can
    be conceived for each floor of the building: a data structure for representing
    2-dimensional subdivisions can here be handled. Then, a 3-dimensional representation
    of each floor is constructed, and it is necessary to handle a data structure for
    representing 3-dimensional subdivisions. Then, operations are applied in order
    to join the different floors, producing a 3-dimensional representation of the
    building. Then, and as said above, the 3-dimensional structure can be discretized
    (into tetrahedral or cubic meshes) in order to simulate some physical phenomena;
    the faces of the 3-dimensional structure can also be triangulated in order to
    efficiently produce images of (parts of) the building.


    For geological purposes, surfaces representing faults or frontiers between layers
    can be reconstructed from 3-dimensional seismic images. Then, 3-dimensional subdivisions
    can be constructed from these surfaces, representing the different blocks of the
    layers. For some operations, it can be useful to triangulate the faces of the
    blocks. For other processes, for instance simulating oil flow, it can be useful
    to discretize the subdivisions into tetrahedral or cubic meshes.


    For some applications, for which huge subdivisions can be represented, it can
    be useful to simultaneously handle several data structures in order to represent
    different parts of a subdivision. Indeed, structural irregularities are often
    localized in a subdivision: so, regular parts are represented using specialized
    data structures, parts corresponding to irregularities are represented using more
    general data structures, and correspondences between data structures are maintained
    in order to put all information together.


    # 1.4  Cellular Structures


    This book mainly focuses on cellular structures, i.e. for the representation of
    subdivisions such that no particular structural property is satisfied by the cells.
    Mainly two classes of cellular structures can be distinguished:


    +   - *incidence graphs*: the nodes of the graph correspond to the cells, the
    edges of the graph represent incidence relations between cells. Such graphs represent
    unambiguously subdivisions in which *no multi-incidence* occurs, i.e. a cell cannot
    be incident several times to another cell. For instance, it is not possible to
    unambiguously represent a loop, i.e. an edge which is incident twice to a vertex;

    +   - *ordered models*: such models are based on elements which are more elementary
