    # **FIGURE 5.2**


    A 2-map with 1-boundary and 2-boundary.

    For example dart 1 is 0-free, i.e. $\beta_0(1)=\varnothing$. Thus dart 0 belongs
    to an edge which has no previous edge in the same face.

    Dart 2 is 1-free, i.e. $\beta_1(2)=\varnothing$. Thus dart 2 belongs to an edge
    which has no next edge in the same face.

    Dart 3 is 2-free, i.e. $\beta_2(3)=\varnothing$, so it belongs to an edge which
    is incident to only one face.


    In all generality, boundaries can exist in all dimensions; in practical applications,
    $n$D objects are often without boundary, except for dimension $n$, i.e. there
    are no free darts except for $\beta_n$.


    Note that a 0-boundary (i.e. an edge incident to only one vertex, as for instance
    an edge cut by a plane) corresponds to a dart free for all $i\in\{1,\ldots,n\}$.
    Indeed, as soon as a dart $d_1$ is $i$-sewn with a dart $d_2$, for $i\in\{1,\ldots,n\}$,
    the edge containing dart $d_1$ is incident to two vertices: the vertex containing
    dart $d_1$, and the vertex containing dart $d_2$ (cf. definition of cells below).


    As seen in the intuitive presentation, an $n$-map can contain different connected
    components. The set of darts belonging to the same connected component than a
    given dart can be retrieved, thanks to Def. 28. This is the set of darts of the
    orbit made of all the permutations.


    **Definition 28 (connected component)** *Let $M=(D,\beta_1,\ldots,\beta_n)$ be
    an $n$-map, and $d\in D$. $\langle\beta_1,\ldots,\beta_n\rangle(d)$ is the connected
    component containing $d$.*


    As said before, according to the context, an orbit denotes either a set of darts,
    or this set of darts together with the corresponding $\beta$ relations. Thanks
    to this definition, it can be directly tested if a given $n$-map is connected,
    i.e. made of only one connected component, simply by testing if the connected
    component containing a dart is the set of all the darts of the $n$-map (cf. Def.
    29).


    **Definition 29 (connected $n$-map)** *Let $M=(D,\beta_1,\ldots,\beta_n)$ be an
    $n$-map. $M$ is connected if $\langle\beta_1,\ldots,\beta_n\rangle(d)$ is equal
    to $D$, with $d\in D$.*'
