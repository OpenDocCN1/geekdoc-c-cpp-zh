    Considering the whole orbits $\langle\alpha_0,\ldots,\alpha_{i-2},\alpha_{i+2},\ldots,\alpha_n\rangle(d)$
    and $\langle\alpha_0,\ldots,\alpha_{i-2},\alpha_{i+2},\ldots,\alpha_n\rangle(d'')$
    is required in order to satisfy after the sew the condition that $\alpha_i\circ\alpha_j$
