    it is easy to prove that $switch_i \circ switch_j$ is an involution, for $0 \le
    j \le i-2 < i \le n$. So, any $n$-dimensional cell-tuple structure is a $n$-Gmap:
    cell-tuples correspond to darts, and for $0 < i < n$, $switch_i$ corresponds to
    $\alpha_i$.


    So, starting from subdivisions of manifolds without multi-incidence, Brisson:


    +   - pointed out and studied the properties of the associated incidence graphs;\n-
    deduced the notion of cell-tuple structure;\n- showed the link with the barycentric
