    together. For instance, a subdivision can always be constructed by taking cells
    and gluing them along cells of their boundaries, i.e. by identifying cells of
    their boundaries. Constraints can be added. For instance, multi-incidence can
    be allowed or not, i.e. it is possible, or not, to identify cells which belong
    to the boundary of the same cell (e.g. a loop is created when two vertices incident
