    # ### 7.2.2.3 Geometrical Removal


    Algorithm 73 implements the modification of the removal operation (introduced
    in Section 6.2.1 page 199) for embedded $n$-Gmaps. When a cell is removed, two
    types of modifications can occur: first, some darts of some vertices are removed;
    so it is necessary to ensure that the darts linked with the geometrical points
    still exist after the operation; second, some vertices could disappear: so the
    associated points have to be removed.


    In the algorithm, we iterate through all the darts in $c_i(d)$ not already considered
    (line 2). Indeed in the second loop (line 5) all darts in the vertex $c_0(d′)$
    have to be processed only once. For that, the darts already considered are marked
    during the second loop (line 5).


    For each vertex incident to the removed $i$-cell, we test if all its darts are
    removed or not. If they are all removed, the associated geometrical point is also
    removed (line 12); otherwise (line 13), we test if the dart linked with the geometrical
    point belongs to $c_i(d)$. In this case, the dart will be deleted by the operation,
    and the link between the vertex and its associated point will be lost. To solve
    this problem, the geometrical point is associated with a dart not removed by the
    operation (line 14). Here, a second mark is used to test in constant time if a
    dart belongs to $c_i(d)$ or not.


    Note that there is a special case for the 0-removal operation (line 15): in this
    case the only geometrical modification is the removal of the geometrical point
    associated with the removed vertex.


    At last, the combinatorial $i$-removal operation is applied since the embedding
    is now correct (line 16).


    The complexity of Algorithm 73 is the same than the one of the combinatorial operation:
    it is linear in the number of darts of the removed $i$-cell.'
