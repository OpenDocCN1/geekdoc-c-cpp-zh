    # 9.1  History of Combinatorial Maps


    The first work about combinatorial maps started in the 1960s in mathematics, more
    precisely in the field of combinatorics, in order to represent planar graphs embedded
    in the plane. They were introduced in [103] to describe *polyhedral surfaces*,
    then formally defined in [206, 137]. In the different works, different names were
    used: *planar maps*, *topological graphs*, *constellations* or *rotation systems*.
    These concepts were used in combinatorial graph theory, for problems of compact
    encoding of planar graphs, enumeration of rooted planar graphs or for the map-coloring
    problem [54, 55, 191, 192].


    When a graph is embedded in a plane, edges are ordered around vertices, for instance
    according to a clockwise orientation. It is then possible to define a function
    *f*, giving for each edge its next edge around one of its vertex. However, since
    each edge has two different successors, one for each extremity vertex, each edge
    has two associated edges and thus *f* is not a function¹. This problem can be
    solved by cutting each edge in two half-edges: so, each half-edge has only one
    extremity, and thus only one successor by *f*. This cutting requires to add a
    relation between the two half-edges issued from the same edge. This gives the
    original definition of planar maps: a planar map is a set of half-edges (called
    “darts” according to the terminology of combinatorial maps), plus two functions
    defined on these half-edges: σ, which gives the next half-edge around its incident
    vertex, and α, which gives the other half-edge issued from the same edge. Formally,
    σ is a permutation and α is an involution.


    Thanks to these two functions, the notions of vertices, edges and faces can be
    retrieved. A vertex is the cycle of half-edges obtained from a given half-edge,
    by applying σ until going back to the initial half-edge. An edge is the set of
    two half-edges linked by α. Since a planar map describes a planar graph embedded
    in the plane, cycles of edges describe the boundary of faces. Given a half-edge
    h, the next half-edge of the face is σ ∘ α(h), denoted φ(h). A face'
