  md: '# FIGURE 6.37


    1-insertion of a dangling edge.


    (a) Two 2-Gmaps G and C, linked by bijection γ. The edge in C is dangling.


    (b) 2-Gmap G_{I_1}(C, γ).


    only for a subset of the darts of C, i.e. α₁(b) = c, α₁(c) = b, γ(a) = 2, γ(d)
    = 3. Note that since darts b and c are linked by α₁ in C, they are still linked
    by α₁ in G_{I₁}(C, γ). This illustrates the interest of describing the cell to
    insert by an n-Gmap.


    The general i-insertion operation takes three parameters as input:


    +   - n-Gmap G, in which an i-cell is inserted;


    +   - n-Gmap C, describing the i-cell to insert;


    +   - γ, the function describing the way the i-cell is inserted. More precisely,
    γ is a bijection between a subset BV′ of the darts of C, and a subset BV of the
    darts of G.


    The insertion can be achieved if C is i-insertable into G according to γ (cf.
    Def. 68). More precisely, four conditions have to be satisfied:


    +   - C contains exactly one removable i-cell. This condition is required for
    ensuring the invertibility of insertion and removal operations;


    +   - the darts of BV′ are i-free in C, since these darts will be i-linked with
    the darts of BV;


    +   - γ commutes with involution α_j in G and C for all darts in BV ∪ BV′, for
    all j such that |i − j| ≥ 2. This conditions ensures that the resulting α_j is
    an involution in the resulting n-Gmap;


    +   - the fourth condition is also required to ensure the invertibility of insertion
    and removal operations: the paths of darts followed if C is removed in the resulting
    n-Gmap lead to the darts linked by α_i in the initial n-Gmap.


