  md: 'nals), and no link exists between these different boundaries in the 2-map:
    they correspond to distinct connected components.


    To solve this problem, an enclosure tree of regions is added to describe all enclosed
    relations. Intuitively a region R_i is enclosed by a region R_j if R_i is surrounded
    by R_j. More precisely, R_i is enclosed by R_j if all the 8-paths starting from
    a pixel of R_i and going to a pixel of R_0 traverse region R_j. Region R_i is
    directly enclosed by region R_j if it is enclosed by R_j and if there is no region
    R_k such that R_i is enclosed by R_k and R_k is enclosed by R_j.


    In our example, region R_4 is enclosed by region R_3 because all the paths starting
    from a pixel of R_4 traverse region R_3 to go to R_0. Region R_2 is not enclosed
    by region R_1, because some paths going from R_2 to R_0 exist which do not contain
    pixels of R_1. R_4 is enclosed by R_3 and by R_0, but it is only directly enclosed
    by R_3.


    The “directly enclosed” relations are encoded by an enclosure tree of regions.
    This tree has one node for each region of the image, its root corresponds to the
    infinite region R_0. A region R_i is son of region R_j in the tree if R_i is directly
    enclosed by R_j. All the regions sons of R_i are grouped by 8-connected components
    thanks to the samecc relation: two regions belonging to the same connected component
    and having the same father belong to the same list of regions with the samecc
    relation. Only the smaller regions (smaller for the lexicographic order) sons
    of each 8-connected component are described as sons of R_i in the tree, other
    regions will be retrieved thanks to the samecc relation.


    The enclosure tree of regions and the 2-map are linked. Each dart of the 2-map
    knows its region denoted by d.Region, and each region knows one of its darts denoted
    by R.Representative. This dart must belong to the external boundary of R and the
    corresponding edge must contain the smaller pointel of the external boundary of
    R (smaller in term of lexicographic order).


    Figure 7.16(b) describes the enclosure tree of regions associated with the 2-map
    given in Fig. 7.16(a) (cf. Fig. 7.15(a) for the labeled image). The three regions
    R_1, R_2 and R_3 are directly enclosed in region R_0, and they belong to the same
    8-connected component. The smaller region is R_1, which is son of R_0 in the tree,
    the two other regions R_2 and R_3 being linked with R_1 by the samecc relation.
    Similarly, the three regions R_4, R_5 and R_6 are directly enclosed in region
    R_3, and they belong to the same 8-connected component. The smaller region is
    R_4 which is son of R_3 in the tree, the two other regions R_5 and R_6 being linked
    with R_4 by the samecc relation.


    All the boundaries of a given region R can be retrieved thanks to the enclosure
    tree of regions and to the links between the tree and the 2-map. The external
    boundary of R is given by ⟨β_1⟩(R.Representative). All internal boundaries are
    obtained by ⟨β_1⟩(β_2(R′.Representative)) for all regions R′ son of R (since R′
    is the smaller region of an 8-connected component and thanks to the properties
    of Representative, we know that β_2(R′.Representative) belongs necessarily to
    one internal boundary of R, cf. Fig. 7.16).'
