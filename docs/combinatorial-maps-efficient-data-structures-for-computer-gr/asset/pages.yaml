    them by β₁″, according to the corresponding links in the inverse of the 2-boundary
    map M∂₂⁻¹.


    The 2-map depicted in Fig. 6.7 has 1-boundaries and 2-boundaries. In this case,
    the 2-closure operation produces a 2-map without 2-boundary, but it still has
