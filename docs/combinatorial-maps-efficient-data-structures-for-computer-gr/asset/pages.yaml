    α₂⟩, i.e. it is equal to the number of triangles minus the number of edges (numbered
    (1,2), (0,2), (0,1)) plus the number of vertices (numbered (2), (1), (0)). Four
    examples of 2-Gmaps are depicted in Fig. 8.18, together their Euler-Poincaré characteristics.
    For instance, for G₁ depicted in Fig. 8.18(a): #⟨⟩ = 12, #⟨α₀⟩ = #⟨α₁⟩ = 6, #⟨α₂⟩
    = 10, #⟨α₀, α₁⟩ = 2, #⟨α₀, α₂⟩ = 5 and #⟨α₁, α₂⟩ = 4. Thus χ(G₁) = 12 − 6 − 6
    − 10 + 2 + 5 + 4 = 1: this is the Euler-Poincaré characteristic of a disk. Note
    that the Euler-Poincaré characteristics of an annulus, of a Möbius strip and of
    a torus are equal;


