    Incidence graphs can describe the topology of n-dimensional complexes in which
    no multi-incidence occurs (see chapter 8 for a precise study of incidence graphs
    and their associated complexes). In order to construct the graph associated with
    such a complex (cf. Fig. 2.28(b)):


    +   1. associate a vertex of the graph with any cell; moreover, associate also
    the dimension of the cell with the corresponding cell (this is not a requirement,
    several definitions of incidence graph omit dimensions, which can be retrieved
    from other informations represented by the graph); in Fig. 2.28(b), the dimension
    of cells is represented by the height of the graph vertices;


    +   2. for each pair of incident i- and (i − 1)-dimensional cells, associate an
    oriented edge between the corresponding vertices of the graph.


    In fact, this graph is that of the incidence relation between i- and (i − 1)-dimensional
    cells; in the graph, a vertex corresponding to an i-dimensional cell is the origin
    of edges the extremities of which are the vertices associated with the (i − 1)-dimensional
    cells of its boundary. The idea at the basis of incidence graphs is thus simple
    and intuitive. Note that other variants have been proposed in order to represent
    classes of complexes or more general objects, for instance complexes from which
    subparts have been removed [195].'
