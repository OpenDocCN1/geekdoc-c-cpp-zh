    the face described by 2-Gmap C is expanded into 2-Gmap G, according to γ. This
    produces G_{E_2}(C, γ), represented in Fig. 6.40(b).


    Since expansion and insertion are very similar, the corresponding algorithms are
    also very similar: cf. Algorithms 62 and 63. Thus, the complexities of these two
    algorithms are also linear in the number of darts #d of the n-Gmap c times log
    #d.'
