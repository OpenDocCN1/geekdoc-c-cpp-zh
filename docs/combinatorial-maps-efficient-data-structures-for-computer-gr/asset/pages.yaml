  md: 'Any connected component of an i-Gmap is an i-dimensional cell, or i-cell: that
    is why α_i^i = ω is undefined, in order to describe only the interior of the cell.
    The cells are linked by face operators σ^i.


    Chains of maps can be constructed in the following way: take isolated cells and
    their boundaries, and then identify cells (cf. Fig. 8.17(e) and (f)). More precisely,
    note first that a chain of maps can be associated with any n-Gmap (cf. Fig. 8.17(c)
    and (d) and the conversion process below). So, an isolated i-cell c_i is the chain
    of maps which corresponds to an i-Gmap G^{c_i} = (D^{c_i}, α_0^{c_i}, …, α_{i-1}^{c_i},
    α_i^{c_i} = Id) containing a unique connected component. The canonical boundary
    of G^{c_i} is (D^{c_i}, α_0^{c_i}, …, α_{i-1}^{c_i}). The chain of maps associated
    with G^{c_i} contains thus an i-cell and its canonical boundary (cf. Fig. 8.17(e)).
    It is then easy to define an operation for identifying two i-cells G^{c_i} = (D^{c_i},
    α_0^{c_i}, …, α_{i-1}^{c_i}, α_i^{c_i} = ω) and G^{c''_i} = (D^{c''_i}, α_0^{c''_i},
    …, α_{i-1}^{c''_i}, α_i^{c''_i} = ω) such that:


    +   1. a function φ : D^{c_i} → D^{c''_i} exists, such that for any d ∈ D^{c_i},
    for any j, 0 ≤ j ≤ i − 1, φ(α_j^{c_i}(d)) ∈ {φ(d), α_j^{c''_i}(φ(d))}; in other
    words, a correspondence exists between the cells, which have thus common elements
    in their structures;

    +   2. for any d ∈ D^{c_i}, σ^i(d) = σ^i(φ(d)). In other words, the two cells
    share the same boundary.


    The operation consists in modifying σ^{i+1} for any dart d′ ∈ G^{i+1} such that
    σ^{i+1}(d′) = d ∈ G^{c_i} in order that σ^{i+1}(d′) = φ(d), and in removing G^{c_i}.


    Subclasses of chains of maps have been defined: for instance, when for any i ≥
    1, σ^i is a isomorphism between an orbit ⟨α_0^i, …, α_{i-2}^i⟩ of the boundary
    of an i-cell and an (i − 1)-cell, there is a strict correspondence between the
    structure of i-cells and their boundaries. Such properties can be used in order
    to define optimized data structures.


    # Conversion between n-Gmap and n-dimensional chains of maps


    Let G = (D, α_0, …, α_n) be an n-Gmap. The n-dimensional chain of maps C = ((G^i
