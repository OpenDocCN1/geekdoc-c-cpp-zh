  md: '# Definition 76 (abstract simplicial complex) An abstract simplicial complex
    K is a set of nonempty subsets of a given finite set V such that:


    +   1. {v} ∈ K for every v ∈ V;

    +   2. τ ⊆ σ ∈ K ⟹ τ ∈ K.


    The elements of K are called simplices. Let σ ∈ K such that |σ| = i + 1; σ is
    called an (abstract) i-dimensional simplex, or i-simplex. The elements of V are
    called vertices, and any vertex v ∈ V is assimilated with the 0-simplex {v} ∈
    K.


    Let σ ∈ K. τ ⊆ σ is a face of σ: if τ = σ, then it is the principal face of σ,
    or main face, else it is a proper face of σ. The boundary of σ is the set of its
    proper faces; it is an abstract simplicial complex. The star (resp. proper star)
    of σ is the set of simplices of which σ is a face (resp. a proper face): so, σ
    is contained in its star, but not in its proper star. A principal, or main, simplex
    of K is such that its proper star is empty.


    Example. Let V_ex = {v1, v2, v3, v4, v5, v6}, and K_ex = {{v1}, {v2}, {v3}, {v4},
