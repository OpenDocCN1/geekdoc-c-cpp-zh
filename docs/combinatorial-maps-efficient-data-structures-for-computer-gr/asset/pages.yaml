    # 6.2 Removal


    The removal operation consists in removing a given i-cell c while merging the
    two (i + 1)-cells incident to c when they exist; when there is only one (i + 1)-cell
    incident to c, no cells are merged. The basic operation is the i-removal, which
    consists in removing an i-cell. Two examples are depicted in Fig. 6.11. Starting
