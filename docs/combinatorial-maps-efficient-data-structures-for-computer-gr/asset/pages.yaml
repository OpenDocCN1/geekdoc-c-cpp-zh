    # *Open and closed sets*


    Let $A\subset\mathbb{R}^n$. $A$ is an *open set* of $\mathbb{R}^n$ if, for every
    $x\in A$, there is some $\epsilon>0$ such that $B_\epsilon(x)\subset A$; note
    that $\varnothing$ and $\mathbb{R}^n$ are open sets. Let $B\subset\mathbb{R}^n$.
    $B$ is a *closed set* of $\mathbb{R}^n$ if $\mathbb{R}^n\setminus B$ is an open
    set of $\mathbb{R}^n$; note that $\varnothing$ and $\mathbb{R}^n$ are also closed
    sets.


    Arbitrary unions of open sets are open sets; finite intersections of open sets
    are open sets. Conversely, finite unions of closed sets are closed sets; arbitrary
    intersections of closed sets are closed sets. For instance, let $B(x)$ be the
    intersection of all open balls of any radii around $x$. It is easy to see that
    $x$ belongs to $B(x)$, but any other point of $\mathbb{R}^n$ does not belong to
    $B(x)$ (if $y\ne x$, $y$ does not belong to $B_{d(x,y)/2}(x)$), so $B(x)=\{x\}$
    is a closed set, since $\mathbb{R}^n\setminus\{x\}$ is an open set.


    *Neighborhood:* cf. Fig. 2.1(d).


    Let $A\subset\mathbb{R}^n$. A subset $N$ of $A$ is a neighborhood of a point $a\in
    A$ if there is an open set $V$ in $A$ such that $a\in V\subset N$.


    *Interior, closure, boundary:* cf. Fig. 2.2.


    Let $A\subset\mathbb{R}^n$. $\mathring{A}$, the *interior* of $A$, is the union
