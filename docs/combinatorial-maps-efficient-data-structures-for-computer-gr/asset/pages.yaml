    \ this complex satisfies an important topological property: there is *no multi-incidence*\
    \ within this complex. More precisely, this property can be defined as follows\
    \ for the 2-dimensional case:\n\n+   1. any 2-dimensional (resp. 1-dimensional)\
    \ cell is incident once to any 1-dimensional (resp. 0-dimensional) cell of its\
    \ boundary. In other words, if you think at the construction of such a complex\
    \ by identifying edges or vertices:\n+   \n+      - before any identification,\
    \ each face has a boundary made by at least three edges and three vertices;\n\
    +      - before any identification, the boundary of each edge is made by exactly\
    \ two vertices;\n+      - two edges (free or not) can be identified if they are\
    \ not incident to a same face;\n+      - no loop is produced by any identification\
    \ (of edges, of vertices);"
