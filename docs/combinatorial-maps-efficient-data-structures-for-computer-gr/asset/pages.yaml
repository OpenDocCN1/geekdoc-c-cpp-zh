    gons. More generally, a linear embedding consists in associating a part of an
    iD hyperplane with each i-cell. This type of embedding is often used because it
    is simple to handle. However many other types of embedding exist. For example
    splines can be used to embed edges or nurbs surfaces to embed faces. However even
