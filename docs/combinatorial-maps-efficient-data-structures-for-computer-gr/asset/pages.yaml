    # 6.3.2 For n-maps


    As explained above, the i-contraction operation is the dual of the (n − i)-removal
    operation. In 1D, as illustrated in the example given in Fig. 6.30, the 1-contraction
    is the dual of the 0-removal. In this example, edge {4} is contracted, by setting
    β′1(3) = 5. Note that this produces the same 1-map than the removal of vertex
    {4}.


    Figure 6.31 represents an example of 1-contraction in a 2-map. Edge {4,5} is contracted
    by modifying β1 for darts 3 and 9, by following paths of darts related to β1 ∘
    β1. So, β′1(3) = 1 and β′1(9) = 6. Edge {4,5} is contracted and its two incident
    vertices are merged.


    For the example represented in Fig. 6.32, face {1,2} is contracted, by modifying
    β2 for darts 3 and 7, by following paths of darts related to β2 ∘ β1 ∘ β2.'
