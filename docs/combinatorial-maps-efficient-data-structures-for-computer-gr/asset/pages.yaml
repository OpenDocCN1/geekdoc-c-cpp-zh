    oriented cycles, according to ccw_edge_use; cw_edge_use is the inverse of ccw_edge_use;


    +   - let f′ be a face such that it is directly adjacent to f by e, i.e. f and
    f′ share e and, starting from f, f′ is reached by turning around e without traversing
