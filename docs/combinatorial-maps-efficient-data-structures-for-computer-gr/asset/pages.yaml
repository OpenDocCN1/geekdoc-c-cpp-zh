    of geometric objects. They are illustrated by following Griffith’s approach about
    surface classification [125], and then extended for higher dimensions;

    +   - the second ones are related to the *representations* of these subdivisions.
    Here we are interested in defining data structures which can be handled in geometric
    softwares: such representations are algebraic ones, based upon well-known discrete
    structures equivalent to graphs.


    Some notions are not formally defined, since the goal of this chapter is to give
    an intuition about (*subdivisions of*) quasi-manifolds, and about *identification*,
    which is the basic construction operation. Quasi-manifolds are formally defined
