    So, many notions related to graph theory can be directly applied to $n$-Gmaps.
    For instance, as for graph theory, the notion of connectivity is related to the
    notion of path given in Def. 5.


    # **Definition 5 (path)**


    Let $G=(D,\alpha_0,\ldots,\alpha_n)$ be an $n$-Gmap and $d,d''\in D$. A path between
    $d$ and $d''$ is a sequence of darts $(d_1,\ldots,d_k)$ such that $d_1=d$, $d_k=d''$
    and $\forall i\in\{2,\ldots,k\}$, $d_i=\alpha_{k_i}(d_{i-1})$, with $k_i\in\{0,\ldots,n\}$.


    Given any pair of darts $d$ and $d''$ that belong to the same connected component,
    there exists a path between $d$ and $d''$. Reciprocally, if $d$ and $d''$ do not
    belong to the same connected component, there is no path between $d$ and $d''$.


    As seen in the previous chapter, a dart corresponds to an $(n+1)$-tuple of incident
    cells of different dimensions (vertex, edge, face, volume . . . ). In other words,
    a dart describes a “small part” of each cell, this explains why cells are not
    the basic elements of $n$-Gmaps, contrary to incidence graphs for instance. A
    consequence is the fact that very local notions and operations can be defined:
    for instance, if an edge is a loop, we can distinguish its two extremities, even
    if it is incident to only one vertex (cf. example in Fig. 3.19 page 71). More
    generally, $n$-Gmaps naturally take multi-incidence into account, and this can
    be useful for representing free-form objects.


    As seen in the intuitive presentation, a cell containing a given dart corresponds
    to a specific orbit (cf. Def. 6).


    # **Definition 6 (i-cell)**


    Let $G=(D,\alpha_0,\ldots,\alpha_n)$ be an $n$-Gmap, $d\in D$, and $i\in\{0,\ldots,n\}$.
    The $i$-dimensional cell (or $i$-cell) containing $d$ is


    $$c_i(d)=\langle\alpha_0,\ldots,\alpha_{i-1},\alpha_{i+1},\ldots,\alpha_n\rangle(d).$$


    The cells can equivalently be defined as connected components of the $(n-1)$-Gmap
    of cells defined in Def. 7.


    # **Definition 7 ((n − 1)-Gmap of i-cells)**


    Let $G=(D,\alpha_0,\ldots,\alpha_n)$ be an $n$-Gmap, $n>0$, and $i\in\{0,\ldots,n\}$.
    The $(n-1)$-Gmap of $i$-cells is $G_{c_i}=(D,\alpha_0,\ldots,\alpha_{i-1},\alpha_{i+1},\ldots,\alpha_n)$.
    When $n=0$, $D$ is the set of 0-cells.


    Thanks to this definition of cells, incidence and adjacency relations between
    cells can be easily expressed (cf. Def. 8).


    # **Definition 8 (incidence and adjacency)**


    Let $G=(D,\alpha_0,\ldots,\alpha_n)$ be an $n$-Gmap, $d,d''\in D$, and $i,j\in\{0,\ldots,n\}$,
    $i\ne j$.


    +   - cells $c_i(d)$ and $c_j(d'')$ are incident iff $c_i(d)\cap c_j(d'')\ne\varnothing$;

    +   - cells $c_i(d)$ and $c_i(d'')$ are adjacent iff $\exists d_1\in c_i(d)$ and
    $\exists d_2\in c_i(d'')$, $d_1\ne d_2$, such that $d_1=\alpha_i(d_2)$.'
