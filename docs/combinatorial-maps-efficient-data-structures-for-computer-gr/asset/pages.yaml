  md: '# Cellular Structures as Structured Simplicial Structures


    So far we have been concerned with the definitions of *n*-Gmaps and *n*-maps,
    construction operations and embedding definitions for applications in geometric
    modeling, computational geometry, discrete geometry, computer graphics, image
    processing and analysis. But note that only *examples* of geometric objects which
    can be associated with *n*-Gmaps and *n*-maps have been provided. An important
    question remains: *what are the geometric objects* which correspond to *n*-Gmaps
    and *n*-maps, and more generally to cellular structures, including incidence graphs?


    For instance:


    +   - assume an incidence graph contains an edge incident to three vertices: is
    it possible to associate a geometric object with it?¹

    +   - assume a 2-dimensional incidence graph or a 2-Gmap describes a subdivided
    torus. Add a 3-dimensional cell which has the torus as boundary (by adding a 3-dimensional
    cell to the incidence graph, which is incident to all the faces of the torus or
    by increasing the dimension of the 2-Gmap). What is the corresponding object?
    a full torus?²


    *In fact, it is always possible to associate a simplicial analog with any cellular
    structure. This simplicial analog is a triangulation: it is made of simplices,
    i.e. vertices, edges, triangles, tetrahedra, etc., and it formally describes the
    topology of the object which is associated with the cellular structure.*


    But it looks strange to define the interpretation of a cellular structure as a
    simplicial object. Why not establish a direct relation between cellular structures
    and “subdivided objects”³?


    +   - classical objects in topology are simplicial complexes (cf. Section 8.1.1)
    and CW-complexes [174, 1, 115] (cf. Section 8.1.2). The cells of these objects
    are *homeomorphic to balls*, and we have seen above that cellular structures exist,
    which cells do not correspond to balls. Moreover, as far as we know, no combinatorial
    characterization of balls exists, i.e. it is


    ¹ Yes

    ² No

    ³ Note that “subdivided objects” are so far not formally defined!'
  merge: -1
