    # Connectivity


    Until now, all considered surfaces are connected, i.e. informally, made of one
    piece: intuitively, you can walk on the surface between any two of its points.
    More formally, a path between two points x and y in X ⊂ ℝⁿ, where x, y ∈ X, means
    a continuous map γ : [0,1] → X, such that γ(0) = x and γ(1) = y. x and y are said
    connected by the path γ. The path is closed when γ(0) = γ(1).


    Let X ⊂ ℝⁿ, and let R be the relation defined on points of X, such that xRy if
    and only if x and y are connected by a path in X. R is an equivalence relation,
    and its equivalence classes are the connected components of X: in other words,
    a path in X exists between any two points of a connected component, and no path
    exists in X between two points of two distinct connected components.


    We can generalize our presentation of surfaces in order to take into account nonconnected
    surfaces, i.e. surfaces made of several connected components; the definition of
    the characteristic numbers (number of boundaries, orientability factor, genus)
    could be adapted, but it is more interesting (since more precise) to look at the
    characteristics of each connected component.


