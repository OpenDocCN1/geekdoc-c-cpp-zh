    # 9.3.3 Cell-tuple


    Brisson [38, 39] studied the representation of subdivisions of $n$-dimensional
    manifolds without multi-incidence. He pointed out the important relations between
    incidence graphs and what he called “ordered models”, making it possible to:


    +   - formally define properties satisfied by incidence graphs which correspond
    to quasi-manifolds;

    +   - conceive operations for converting equivalent incidence graphs and ordered
    models.


    More precisely, let $M$ be a $n$-dimensional subdivided manifold without boundary,
    such that no multi-incidence occurs. $M$ is thus a regular $CW$-complex³: its
    structure can be described unambiguously by an incidence graph. Since $M$ is a
    manifold, it satisfies particular properties studied by Brisson, mainly the switch
    property (cf. Section 8.2.4). Let $(c_{i-1}, c_i, c_{i+1})$ be three incident
    cells of respective dimensions $i-1, i, i+1$, for $0 \le i \le n$ (a fictive $(-1)$-cell
    (resp. $(n+1)$-cell) is added, incident to all 0-cells (resp. all $n$-cells)).
    Then $switch(c_{i-1}, c_i, c_{i+1}) = c''_i$, such that $c''_i$ is the only $i$-cell
    different from $c_i$, which is also incident to both $c_{i-1}$ and $c_{i+1}$.
    Consequently, $switch(c_{i-1}, c''_i, c_{i+1}) = c_i$. Operator switch is thus
    an involution on the set of triples of incident cells of consecutive dimensions.


