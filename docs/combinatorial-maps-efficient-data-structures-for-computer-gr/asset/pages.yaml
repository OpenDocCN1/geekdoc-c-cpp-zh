    \ testing if it is marked.\n\nThe i-unsew operation is given in Algorithm 45,\
    \ for i ∈ {2,…,n}. As for the i-sew algorithm, it follows directly the i-unsew\
    \ definition (see Def. 47 page 146). It runs through all the darts of the orbit\
    \ ⟨β1,…,βi−2,βi+2,…,βn⟩(d), and we i-sew darts βi(e) and e to ∅."
