  md: 'involutions when |i − j| ≥ 2. Note that a dart can be i-sewn with itself; more
    generally, it is possible that o_d = o_d′: the corresponding sew will create folded
    cells (see Section 5.3).


    Note that any pair of free darts is always i-sewable in any 1-map and in any 2-map;
    for these cases, orbits o_d and o_d′ contain only one dart, and the set {1, …,
    i − 2, i + 2, …, n} is empty. So, no precondition is required for sewing darts
    in 1-maps and in 2-maps. Similarly, it is always possible to 2-sew free darts
    in 3-maps.


    The notion of “being i-sewable” is used to define the i-sew operation in Def.
    45. When applying the i-sew operation, all the darts in o_d and o_d′ are linked
    by β_i. This implies the identification of the two (i − 1)-cells containing darts
    d and d′. Moreover, several other cells can be identified i.e. the j-cells incident
    to the two identified (i − 1)-cells, with j ∈ {0, …, i − 2, i + 1, …, n} (cf.
    below for some examples).


    # Definition 45 (i-sew)


    Let M = (D, β₁, …, β_n) be an n-map, n > 0, i ∈ {2, …, n}, and let d, d′ ∈ D be
    such that d and d′ are i-sewable by the isomorphism f of Def. 44. The n-map obtained
    from M by the i-sewing of d and d′ is M_i-sew(d, d′) = (D, β₁, …, β_{i−1}, β_i′,
    β_{i+1}, …, β_n), where β_i′ is defined by: ∀e ∈ D,


    +   - if e ∈ o_d, β_i′(e) = f(e);


    +   - if o_d ≠ o_d′ and e ∈ o_d′, β_i′(e) = f^{−1}(e);


    +   - otherwise, β_i′(e) = β_i(e).


    Given an n-map and two i-sewable darts, the i-sew operation consists simply in
    linking all the darts in o_d with their “equivalent” darts in o_d′. More precisely,
    β_i′ is directly given by β_i and isomorphism f. So, the i-sew of d and d′ produces
    the same n-map than the i-sew of any dart d″ of o_d and the corresponding dart
    f(d″) of o_d′.


    As often for n-maps, there is a special case for the dimension 1, described in
    Def. 46; this is due to the fact that β₁ is a partial permutation, as other β’s
    are partial involutions. More precisely, there are two differences with the generic
    definition for other dimensions: first, β₁ being a partial permutation, the inverse
    relation has not to be defined; second, given two darts e and e′ = f(e), it is
    necessary to define β₁(e) = e′ if e has the same orientation than d, and β₁(e′)
    = e otherwise (see example in Fig. 5.6) to obtain a correct orientation of all
    the linked darts. e has the same orientation than d if e ∈ {⟨β_i ∘ β_j |∀i, j
    ∈ {3, …, n}, i < j⟩}(d).


    # Definition 46 (1-sew)


    Let M = (D, β₁, …, β_n) be an n-map, and let d, d′ ∈ D be such that d and d′ are
    1-sewable by the isomorphism f of Def. 44. Let o₁ denote {⟨β_i ∘ β_j |∀i, j ∈
    {3, …, n}, i < j⟩}(d). The n-map obtained from M by the 1-sewing of d and d′ is
    M₁-sew(d, d′) = (D, β₁′, β₂, …, β_n), where β₁′ is defined by: ∀e ∈ D,'
