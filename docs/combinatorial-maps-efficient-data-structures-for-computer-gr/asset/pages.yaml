    # 5.3.3 Completeness


    Any n-map can be constructed thanks to the two construction methods.


    # Theorem 3 (Completeness of the first method for n-map construction or destruction)
    Any n-map can be transformed into a set of isolated darts in dimension 0, by a
    sequence of unsew and decrease dimension operations, unsew being always applied
    for the highest possible dimension. Conversely, any n-map can be constructed starting
    from a set of isolated darts in dimension 0, by using only the increase dimension
    and sew operations, sew being always applied for the highest possible dimension.'
