    it is possible to define an orientation of $F$ in such a way that $S''$ is coherently
    oriented (take for $e''$ the inverse orientation of $e$), and thus $S''$ is orientable.
    If $S$ is not orientable, $S''$ is not orientable too. So $q'' = q$, since $b''
    = b$ and $c'' = c$.


    At last, $g'' = g$ since $b'' = b$, $c'' = c$ and $q'' = q$.'
