  md: "# Algorithm 55: isContractibleNGMap(gm,d,i): test if an i-cell is contractible\
    \ for n-Gmaps\n\n```\nInput: gm: an n-Gmap;\n    d ∈ gm.Darts: a dart;\n    i\
    \ ∈ {0,...,n}.\nOutput: True iff c_i(d) is contractible.\n1 if i = 0 then return\
    \ false;\n2 if i = 1 then return true;\n3 foreach dart d' ∈ c_i(d) do\n4   if\
    \ d'.Alphas[i - 2].Alphas[i - 1] ≠ d'.Alphas[i - 1].Alphas[i - 2]\n5     then\n\
    6       return false;\n7 return true;\n```\n\n# Algorithm 56: contractNGMap(gm,d,i):\
    \ contract an i-cell for n-Gmaps\n\n```\nInput: gm: an n-Gmap;\n    d ∈ gm.Darts:\
    \ a dart such that c_i(d) is contractible;\n    i ∈ {1,...,n}.\nResult: Contract\
    \ the i-cell c_i(d).\n1 ma ← reserveMarkNGMap(gm);\n2 mark all the darts in c_i(d)\
    \ for ma;\n3 foreach dart d' ∈ c_i(d) do\n4   d1 ← d'.Alphas[i];\n5   if not isMarkedNGMap(d1,ma)\
    \ then\n6     d2 ← d'.Alphas[i - 1].Alphas[i];\n7     while isMarkedNGMap(d2,ma)\
    \ do\n8       d2 ← d2.Alphas[i - 1].Alphas[i];\n9     d1.Alphas[i] ← d2;\n10 foreach\
    \ dart d' ∈ c_i(d) do\n11   remove d' from gm.Darts;\n12 freeMarkNGMap(gm,ma);\n\
    ```"
  merge: -1
