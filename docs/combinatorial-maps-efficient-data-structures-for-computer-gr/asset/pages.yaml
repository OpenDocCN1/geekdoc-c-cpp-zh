    # 9.2.2 Half-edge


    One problem related to the winged-edge data structure is the fact that pointers
    between edges correspond to adjacency relations between edges according to some
    vertex (or face). A simple way to illustrate this problem is to consider a subdivision
    of an orientable surface without boundary in which an edge e is a loop: so, vertex1(e)
    = vertex2(e). The traversal of the incident cells in a coherent way is possible,
    but it is more complicated for e than for an edge which is incident to two distinct
    vertices. Since traversals can be complicated, it can be necessary to conceive
    complex modification operations.


    To solve this problem, the winged-edge data structure was modified by splitting
    each edge in two heal-edges. A half-edge is incident to exactly one face and to
    exactly one vertex: so, no confusion can arise, even when multi-incidence occurs.


    This idea is the basis of the definition of the face-edge data structure [214],
    the half-edge data structure [172], and the DCEL data structure [86] (DCEL, for
    Doubly Connected Edge List). These three data structures are equivalent, the only
    difference being the names of the relations between the half-edges (e.g. opposite
    is called sometimes twin or pair, previous is called sometimes prev). This is
    probably the data structure which is the most used for describing surface meshes
    with irregular faces. See [140] for a comparison of different versions of half-edges,
    and for an efficient implementation.


    The main element of the half-edge data structure is the half-edge: four pointers
    associate the half-edge with incident cells: cf. Fig. 9.3.


    In addition to the list of half-edges, there is also a list of vertices and a
    list of faces. Each vertex and each face is associated with some information,
    and a pointer links it to one of its incident half-edges.


    Half-edge data structures allow to represent oriented 2D manifolds without boundary.
    They are directly equivalent to 2-maps without boundary: for instance, half-edges
    correspond to darts (see Table 9.2). The two lists of vertices and faces exist
    also in 2-map data structures, when 0- and 2-embeddings are defined.


    Figure 9.3(a) shows a half-edge data structure which represents the 2D object
    depicted in Fig. 3.4(a) page 56. Half-edges are numbered from 1 to 18. For example,
    previous(4) = 1, next(4) = 3, opposite(4) = 9, vertex(4) = v1 and face(4) = f2.'
