    \ example, $\\alpha_0(1)=2$ and $\\gamma \\circ \\alpha'_1 \\circ \\gamma^{-1}(1)=2$\
    \ ($k=0$); this is similar for the other darts in $BV$.\n\nThe $i$-insertion operation\
    \ is defined in Def. 69. The $n$-Gmap resulting from the $i$-insertion of $C$\
    \ in $G$ is $G_i(C,\\gamma)$: its set of darts is the union of the two sets of\
    \ darts of $G$ and $C$; its involutions are defined according to the involutions\
    \ of $G$ (when two darts of $G$ are concerned), or that of $C$ (when two darts\
    \ of $C$ are concerned), or according to $\\gamma$ otherwise (when one dart of\
    \ $G$ and one dart of $C$ are concerned).\n\n# **Definition 69 (insertion)**\n\
    \nLet $G=(D,\\alpha_0,\\ldots,\\alpha_n)$ and $C=(D',\\alpha'_0,\\ldots,\\alpha'_n)$\
    \ be two $n$-Gmaps, $BV\\subseteq D$, $BV'\\subseteq D'$, $\\gamma$ a bijection\
    \ from $BV'$ onto $BV$, such that $C$ is an insertable $i$-cell according to $\\\
    gamma$. The $n$-Gmap resulting from the $i$-insertion of $C$ in $G$ is $G_i(C,\\\
    gamma)=(D'',\\alpha''_0,\\ldots,\\alpha''_n)$ defined by:\n\n+   - $D''=D\\cup\
    \ D'$;\n+   - $\\forall j\\in\\{0,\\ldots,n\\}$, $j\\ne i$:\n+     $$\\forall\
    \ d\\in D,\\ \\alpha''_j(d)=\\alpha_j(d);\\quad \\forall d'\\in D',\\ \\alpha''_j(d')=\\\
    alpha'_j(d');$$\n+   - $\\forall d\\in D\\setminus BV$, $\\alpha''_i(d)=\\alpha_i(d);\\\
    quad \\forall d'\\in D'\\setminus BV'$, $\\alpha''_i(d')=\\alpha'_i(d');$\n+ \
    \  - $\\forall d\\in BV$, $\\alpha''_i(d)=\\gamma^{-1}(d);\\quad \\forall d'\\\
    in BV'$, $\\alpha''_i(d')=\\gamma(d')$.\n\nThe definition of the resulting $n$-Gmap\
    \ $G_i(C,\\gamma)$ is straightforward, the complex part of the definition being\
    \ the $i$-insertability condition, which guaranty the validity of the operation.\n\
    \nAlgorithm 60 is a direct implementation of the $i$-insertability condition."
