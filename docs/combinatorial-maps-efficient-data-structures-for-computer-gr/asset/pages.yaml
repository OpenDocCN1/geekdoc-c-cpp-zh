    # 7.2  Geometric Modeling


    *n*-Gmaps and *n*-maps have been used in geometric modeling to construct and modify
    geometric objects. This section focuses on the conception of Moka [211], a 3D
    geometrical modeler based on 3-Gmaps. The choice of 3-Gmaps was taken in order
    to simplify the implementation of data structures and operations, thanks to their
    homogeneity. Many implementation choices are dimension independant. First, we
    explain the linear embedding of *n*-Gmaps in ℝᵈ in Section 7.2.1. Then geometric
    operations are described in Section 7.2.2. At last, an example of object construction
    is provided in Section 7.2.3.


    # 7.2.1  Embedding of *n*-Gmaps in ℝᵈ


    As explained above, an *n*-Gmap is linearly embedded into ℝᵈ by associating a
    point in ℝᵈ with each vertex of the *n*-Gmap. The other cells are implicitly embedded.
    For representing this association between a vertex and a point, we chose to link
    *one* dart of each vertex with its corresponding point. This choice was done in
    order to favor the modification operations, since only one association between
    a dart and its embedding need to be modified in order to modify the embedding.
    This solution is made to the detriment of the access operation to the embedding,
    since all the darts belonging to the vertex need to be traversed to find the one
    having the link. Note that the choice of the dart linked with the point has no
    importance: any dart of the same vertex can be chosen.


    Such an embedding for a 3-Gmap describing a cube adjacent to a pyramid is illustrated
    in Fig. 7.3(a). Nine points are associated with the nine vertices of the 3-Gmap,
    and one dart of each vertex is linked with its associated point. Figure 7.3(b)
    shows a snapshot of this object represented in MOKA.


    In order to represent this embedding, the Dart data structure (introduced in Section
    4.4 page 108) is modified by adding a pointer (called Point) to a structure describing
    the associated point. A point is represented by an array of *d double* corresponding
    to the coordinates (see structure GeometricalPoint). The Point pointer is set
    to NULL for darts not linked with a point (some advanced programming technique
    make it possible to avoid to represent this pointer for darts not linked with
    a point, by using two different classes of darts).


