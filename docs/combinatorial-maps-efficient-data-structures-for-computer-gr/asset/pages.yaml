  md: "```\nAlgorithm 60: isInsertableNGMap(gm, c, i, assoc): test if an i-cell is\
    \ insertable for n-Gmaps\n\n**Input:** gm, c: two *n*-Gmaps;\n\n              i\
    \ ∈ {0, ..., n};\n\n              assoc: a mapping from c.Darts to gm.Darts.\n\
    \n**Output:** True iff c can be inserted in gm according to assoc.\n\n```text\n\
    1  if c contains more than one i-cell then return false;\n2  if the i-cell in\
    \ c is not removable then return false;\n3  assoc⁻¹ ← an associative array between\
    \ darts, inverse of assoc;\n4  foreach dart d ∈ assoc do\n5      if not isFreeNGMap(d,\
    \ i) then return false;\n6      d′ ← assoc[d];\n7      foreach j ∈ {0, ..., i\
    \ − 2, i + 2, ..., n} do\n8          if d.Alphas[j] ∈ assoc and\n9           \
    \   assoc[d.Alphas[j]] ≠ assoc[d].Alphas[j] then\n10             return false;\n\
    11         if d′.Alphas[j] ∈ assoc⁻¹ and\n                assoc⁻¹[d′.Alphas[j]]\
    \ ≠ assoc⁻¹[d′].Alphas[j] then\n                return false;\n12     d₂ ← d.Alphas[i\
    \ + 1];\n13     while d₂ ≠ assoc do\n14         d₂.Alphas[i].Alphas[i + 1];\n\
    15     if assoc[d₂] ≠ d′.Alphas[i] then return false;\n16 return true;\n```\n\
    ```"
