  md: "(a), which is one orientation of $G$. Black darts belong to this first orientation,\
    \ gray darts belong to the second orientation.\n\nAt last, let $G$ be an orientable\
    \ $n$-Gmap, and let $M$ be one of its orientation. Note that $G$ has twice the\
    \ number of darts of $M$. Thus, in order to describe an orientable quasi-manifold,\
    \ the memory space occupation is the main advantage of an $n$-map. However, the\
    \ main advantage of $n$-Gmaps is related to their homogeneous definitions, leading\
    \ to generic algorithms without special cases, which are thus simpler to conceive.\n\
    \n# 5.5.3  Classification of 2-maps\n\nGiven a connected 2-map $M$ having no 0\
    \ nor 1-boundary, it is possible to compute the different topological characteristics\
    \ of $M$ introduced in Section 2.3 for the classification of paper surfaces:\n\
    \n+   - $b(M)$ is the number of 2-boundaries of $M$, i.e. the number of connected\
    \ components of $M_0$;\n+   \n+   - $\\chi(M)$ is the Euler-Poincaré characteristic\
    \ of $M$:\n+     $$\\chi(M)=\\#\\langle\\beta_2\\circ\\beta_0\\rangle-\\#\\langle\\\
    beta_2\\rangle+\\#\\langle\\beta_1\\rangle+\\{|\\{d\\mid\\beta_2(d)=d\\}\\|$$\n\
    +     $\\#\\langle\\rangle$ denotes the number of orbits, see Section 8.3.2.2\
    \ page 331 for details on this characteristic;\n+   \n+   - $q(M)$ is the orientability\
    \ factor of $M$: $q(M)=0$, since a 2-map is always orientable;\n+   \n+   - $g(M)$\
    \ is the genus of $M$ defined by $g(M)=1-(b(G)+\\chi(G))/2$.\n\nThese characteristics\
    \ make it possible to define a classification of connected 2-maps by the pair\
    \ $(b(G),g(G))$ related to the classification of the associated surfaces. Note\
    \ that nonconnected 2-maps can be classified, by classifying each of their connected\
    \ components. The following array gives some characteristics of usual surfaces:\n\
    \n| Type of surface | $(b(G),g(G))$ |\n|---|---|\n| Sphere | $(0,0)$ |\n| Torus\
    \ | $(0,1)$ |\n| Double torus | $(0,2)$ |\n| Disk | $(1,0)$ |\n| Annulus | $(2,0)$\
    \ |\n\nNote that the number of $n$-boundaries and the Euler-Poincaré characteristic\
    \ are defined for any $n$-maps whatever their dimensions is (cf. Section 8.3.2.2\
    \ page 331 for Euler-Poincaré characteristic); but for $n>2$, no complete classification\
    \ exists."
