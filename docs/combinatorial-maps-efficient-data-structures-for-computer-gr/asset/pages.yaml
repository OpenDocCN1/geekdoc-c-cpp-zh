  md: 'As for graph theory, the notion of connectivity is related to the notion of
    path given in Def. 30.


    # **Definition 30 (path)**


    *Let* $M=(D,\beta_1,\ldots,\beta_n)$ *be an* $n$-*map and* $d,d''\in D$. *A path
    between* $d$ *and* $d''$ *is a sequence of darts* $(d_1,\ldots,d_k)$ *such that*
    $d_1=d$, $d_k=d''$ *and* $\forall i\in\{2,\ldots,k\}$, $d_i=\beta_{k_i}(d_{i-1})\in
    D$, *with* $k_i\in\{0,\ldots,n\}$.


    Given any pair of darts $d$ and $d''$ that belong to the same connected component,
    a path exists between $d$ and $d''$. Reciprocally, if $d$ and $d''$ do not belong
    to the same connected component, there is no path between $d$ and $d''$.


    In an $n$-map, a dart corresponds to an $(n+1)$-tuple of oriented cells of different
    dimensions (vertex, edge, face, volume ...), each pair of cells in this tuple
    being incident. Moreover, the vertex is the origin of the oriented edge. In other
    words, a dart describes a “small part” of each oriented cell (this explains why
    cells are not the basic elements of $n$-maps). A consequence is the fact that
    very local notions and operations can be defined: for instance, if an edge is
    a loop, its two extremities can be distinguished, even if it is incident to only
    one vertex. More generally, $n$-maps naturally take multi-incidence into account,
    and this can be useful for representing free-form objects.


    As we have seen in the intuitive presentation, a cell containing a given dart
    corresponds to some specific orbit (cf. Def. 31).


    # **Definition 31 (i-cell)**


    *Let* $M=(D,\beta_1,\ldots,\beta_n)$ *be an* $n$-*map,* $d\in D$ *and* $i\in\{0,\ldots,n\}$.
    *The* $i$-*dimensional cell (or* $i$-*cell) containing* $d$ *is* $c_i(d)$:


    +   - if $i=0$, $c_0(d)=\langle\{\beta_j\circ\beta_k\mid \forall j,k\in\{1,\ldots,n\},\
    j<k\}\rangle(d)$;

    +   - otherwise, $c_i(d)=\langle\beta_1,\ldots,\beta_{i-1},\beta_{i+1},\ldots,\beta_n\rangle(d)$.


    The cells can equivalently be defined as the connected components of the $(n-1)$-map
    of cells defined in Def. 32. For $i=0$, this property is only satisfied for $n$-maps
    without 1-boundary. Indeed, in such a map, the 0-cell definition is equal to the
    simplified form $\langle\beta_2\circ\beta_0,\ldots,\beta_n\circ\beta_0\rangle$
    while this is not true for $n$-maps with 1-boundary (as shown for the example
    given in Fig. 3.16 page 68).


    # **Definition 32 ((n − 1)-map of i-cells)**


    *Let* $M=(D,\beta_1,\ldots,\beta_n)$ *be an* $n$-*map, with* $n\ge 1$, *and* $i\in\{0,\ldots,n\}$.
    *The* $(n-1)$-*map of* $i$-*cells is* $M_{c_i}$:


    +   - if $i=0$, $M_{c_0}=(D,\beta_2\circ\beta_0,\ldots,\beta_n\circ\beta_0)$;

    +   - otherwise, $M_{c_i}=(D,\beta_1,\ldots,\beta_{i-1},\beta_{i+1},\ldots,\beta_n)$.


    Thanks to this definition of cells, the incidence and adjacency relations between
    cells can be directly retrieved (cf. Def. 33).


    # **Definition 33 (incidence and adjacency)**


    *Let* $M=(D,\beta_1,\ldots,\beta_n)$ *be an* $n$-*map,* $d,d''\in D$, *and* $i,j\in\{0,\ldots,n\}$,
    $i\ne j$.'
