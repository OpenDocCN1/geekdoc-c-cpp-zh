    # Some remarks about cellular quasi-manifolds


    So, *n*-Gmaps corresponds to cellular quasi-manifolds, and their cells correspond
    to the interior of quasi-manifolds. A key point is the fact that quasi-manifolds
    can be combinatorially defined: they are more general than manifolds, but as far
    as we know, no other class has been defined such that:


    +   - it contains manifolds;

    +   - it can be combinatorially defined;

    +   - and it is strictly contained in the set of quasi-manifolds.


    So, as far as we know, the set of quasi-manifolds is the “smallest” set which
    contains manifolds and which can be combinatorially defined, i.e. such that the
    combinatorial definition of the structure takes directly into account the expected
    properties. Of course, it is possible to define subclasses by adding properties
    which can be combinatorially defined and computed: for instance, *n*-Gmaps without
    multi-incidence can be defined, which are equivalent to *n*-surfaces, i.e. a subset
    of incidence graphs (cf. Section 8.2.4)⁸; *n*-Gmaps can be restricted in order
    that the homology of all cells is that of balls (cf. [4]); but the representation
    itself, as a set of darts on which involutions act, is not modified.


