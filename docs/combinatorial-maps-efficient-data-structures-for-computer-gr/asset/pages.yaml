- pgno: 251
  md: "The mapping assoc, corresponding to γ in Def. 68, is implemented as an associative\
    \ array (for example a hash table or a binary search tree) from c.Darts to gm.Darts.\
    \ Testing if a dart d belongs to assoc is equivalent to test if d belongs to BV′\
    \ in the insertability condition definition. assoc−1 is computed from assoc (assoc−1\
    \ corresponds to γ−1), and it is stored into a second associative array. It allows\
    \ to test if a given dart d belongs to BV. Note that, by definition of assoc and\
    \ assoc−1, iterating through the darts of assoc (thus BV′) and considering d′\
    \ ← assoc[d] is equivalent to iterate through the darts of assoc−1 (thus BV).\n\
    \nThe i-insertion operation is implemented by Algorithm 61. Instead of building\
    \ a new n-Gmap Gi(C, γ), n-Gmap gm is modified in order to obtain an n-Gmap which\
    \ is isomorphic to Gi(C, γ). So, the Alphas[i] links have to be modified only\
    \ for the darts of assoc and of assoc−1.\n\n# Algorithm 61: insertNGMap(gm, c,\
    \ i, assoc): insert an i-cell in an n-Gmap\n\nInput: gm: an n-Gmap;\n c: an n-Gmap,\
    \ which is an insertable i-cell according to assoc;\n i ∈ {0, …, n};\n assoc:\
    \ a mapping from c.Darts to gm.Darts.\n Result: Insert the i-cell c in gm along\
    \ assoc.\n\n```\n1 foreach dart d′ ∈ c.Darts do\n2   add d′ in gm.Darts;\n3  \
    \ remove d′ from c.Darts;\n4   if d′ ∈ assoc then\n5     d′.Alphas[i] ← assoc[d′];\n\
    6     assoc[d′].Alphas[i] ← d′;\n```\n\nThe complexity of Algorithm 60 is linear\
    \ in the number of darts #d of the n-Gmap c times the complexity for accessing\
    \ an element in the associative array log #d. Indeed, it is possible to iterate\
    \ through the i-cell c in linear time, in order to test if c contains more than\
    \ one i-cell. Then, it is possible again to test in linear time if this i-cell\
    \ is removable. The number of elements in assoc is bounded by the number of darts\
    \ in c, thus each access in assoc or assoc−1 is done in log #d. At last, the complexity\
    \ of the loop over the path of darts (α′i+1 ◦ α′i) k ◦ α′i+1 ◦ γ−1(d) is bounded\
    \ by the number of darts in c, because the considered paths are disjoint. This\
    \ gives the global complexity of the algorithm.\n\nThe complexity of Algorithm\
    \ 61 is also linear in number darts #d of the n-Gmap c times log #d. This is straightforward,\
    \ since all darts in c are processed, using the links described by assoc."
