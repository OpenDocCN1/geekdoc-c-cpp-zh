    explained here are valid for both \(n\)-maps and \(n\)-Gmaps. A classical way
    consists in embedding an \(n\)-map in the Euclidean space \(\mathbb{R}^d\). Note
    that the dimension \(n\) of the \(n\)-map is not necessarily equal to \(d\), the
    dimension of the Euclidean space. \(n\) will be referred to as the *combinatorial
    dimension*, and \(d\) will be referred to as the *ambient dimension*.


    A 2-map embedded into \(\mathbb{R}^2\) is represented in Fig. 7.1. Each vertex
    of the 2-map is associated with a point in \(\mathbb{R}^2\) (for example vertex
    \(\{1,6\}\) is associated with point \((0,2)\) and vertex \(\{7\}\) is associated
    with point \((1,3)\)); each edge is associated with an open segment (for example
    edge \(\{6\}\) is associated with segment \(](0,2),(1,3)[\) and edge \(\{1,5\}\)
    is associated with segment \(](0,2),(2,2)[\)); each face is associated with an
    open surface area (face \(\{5,6,7\}\) is associated with the surface area defined
    by \(\{(x,y) \in \mathbb{R}^2|y > 2 \text{ and } y < x-2 \text{ and } y < -x+4\}\)
    and face \(\{1,2,3,4\}\) is associated with the surface area defined by \(\{(x,y)
    \in \mathbb{R}^2|x > 0 \text{ and } x < 2 \text{ and } y > 0 \text{ and } y <
    2\}\).


    We can verify that this example is a correct embedding by checking that two incident
    cells in the 2-map are associated with two incident elements of the plane and
    reciprocally. For example vertex \(\{1,6\}\) associated with point \((0,2)\) is
    incident to edge \(\{1,5\}\) associated with segment \(](0,2),(2,2)[\) and point
    \((0,2)\) belongs to the boundary of the segment.


    This 2-map is “linearly embedded” into \(\mathbb{R}^2\): vertices are associated
    with points, edges are associated with segments and faces are associated with
