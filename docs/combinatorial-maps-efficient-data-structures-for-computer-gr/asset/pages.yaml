  md: '# 4


    # *n*-Gmaps


    An *n*-Gmap is a combinatorial data structure allowing to describe an *n*-dimensional
    orientable or nonorientable quasi-manifold with or without boundary. An intuitive
    presentation of *n*-maps and *n*-Gmaps is provided in the previous chapter.


    In this chapter, *n*-Gmaps are defined in Section 4.1, as the basic notions of
    cells, incidence and adjacency relations between the cells. Some basic operations
    allowing to modify existing *n*-Gmaps are presented in Section 4.2. These operations
    allow to add/remove darts, increase/decrease the dimension of an *n*-Gmap, merge/split
    *n*-Gmaps; the sew/unsew operations allow to identify cells. It is shown in Section
    4.3 that these operations make a small basis of operations allowing to build any
    *n*-Gmap. Moreover, multi-incidence between cells can be taken into account with
    *n*-Gmaps, and some specific configurations related to multi-incidence are illustrated,
    such as dangling cells and folded cells. In Section 4.4, a possible data structure
    for implementing *n*-Gmaps is presented, and also some algorithms allowing to
    develop a computer software handling *n*-Gmaps. Section 4.5 contains some additional
    notions related to *n*-Gmaps.


    In this book, *n*-Gmaps are studied before *n*-maps, because their definition
    is simpler: it is homogeneous, i.e. all functions involved in their definition
    are involutions. This simplifies many definitions and algorithms.


    # 4.1  Basic Definitions


    As explained in the previous chapter, an *n*-Gmap is defined by a set of darts
    on which act *n* + 1 involutions, satisfying some composition constraints. This
    leads to the following definition of *n*-Gmaps.


    **Definition 1 (*n*-Gmap)**  An *n*-dimensional generalized map, or *n*-Gmap,
    with 0 ≤ *n*, is an (*n* + 2)-tuple *G* = (*D*, α₀, . . . , αₙ) where:


    +   1. *D* is a finite set of darts;

    +   2. ∀*i* ∈ {0, . . . , *n*}: αᵢ is an involution on *D*;

    +   3. ∀*i* ∈ {0, . . . , *n* − 2}, ∀*j* ∈ {*i* + 2, . . . , *n*}: αᵢ ∘ αⱼ is
    an involution.'
