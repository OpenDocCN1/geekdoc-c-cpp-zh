- pgno: 161
  md: 'n-maps. Note that many high level operations have been defined, sometimes based
    on these basic ones, allowing to construct and modify n-maps. Even if the basic
    operations introduced in this section can be directly used to interactively construct
    an object, their interest is mainly theoretical: they provide a small basis of
    operations allowing to build any n-map. The high level operations usually handle
    orbits, as cells for instance, although basic operations handle directly the darts
    and the β functions. All these operations take an n-map as input, and produce
    another n-map which is the result of the operation.


    # 5.2.1 Basic Tools


    The first basic tool consists in adding a new dart in an n-map. To guaranty the
    validity of the n-map, the new dart is isolated, i.e. ∀i ∈ {0,…,n}, βi(d) = ∅.
    This operation can be used several times to add any number of isolated darts in
    the n-map.


    Definition 37 (add isolated dart) Let M = (D, β1, …, βn) be an n-map. The n-map
    obtained from M by adding an isolated dart is M+d = (D ∪ {d}, β1′, …, βn′); ∀i
    ∈ {1,…,n}, βi′ is defined by:


    +   - ∀e ∈ D, βi′(e) = βi(e);

    +   - βi′(d) = ∅.


    The inverse operation given in Def. 38 consists in removing an isolated dart.


    Definition 38 (remove isolated dart) Let M = (D, β1, …, βn) be an n-map, and let
    d ∈ D be an isolated dart, i.e. ∀i ∈ {0,…,n}, βi(d) = ∅. The n-map obtained from
    M by removing d is M−d = (D \ {d}, β1′, …, βn′); ∀i ∈ {1,…,n}, βi′ is the restriction
    of βi to the set of remaining darts, i.e. βi′ = βi|D\{d}.


    Since only isolated darts are removed, the result of the operation is obviously
    an n-map. Note that any dart can be removed, but it is necessary to isolate it
    by applying (maybe several times) the unsew operation (cf. Section 5.2.3 for the
    definition of the unsew operation).


    The operation which increases the dimension of an n-map is straightforward: cf.
    Def. 39. Increasing the dimension of an (n − 1)-map M by one leads to create one
    n-cell for each connected component of M. For any i in {0,…,n − 1}, no i-cell
    is modified by this operation.


    Definition 39 (increase dimension) Let M = (D, β1, …, βn−1) be an (n−1)-map. The
    n-map obtained from M by increasing its dimension is M+ = (D, β1, …, βn), where
    βn is defined by: ∀d ∈ D, βn(d) = ∅.'
