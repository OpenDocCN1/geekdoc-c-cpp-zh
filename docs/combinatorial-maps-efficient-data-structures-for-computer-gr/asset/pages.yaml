  md: "# 5.4 Data Structures, Iterators and Algorithms\n\nIn this section, data structures\
    \ and algorithms are defined in order to handle n-maps in computer softwares.\
    \ We choose to use an algorithmic language to facilitate the coding in different\
    \ programming languages. To simplify notations, we do not make the distinction\
    \ in algorithms between a pointer to an element and the element itself.\n\nThe\
    \ objective here is to describe one way to encode darts and relations. We choose\
    \ a solution based on structures with pointers, but it is easy to modify the algorithms\
    \ in order to deal with other possibilities. Note that only the combinatorial\
    \ part of the data structure is described here. You can see chapter 7 for two\
    \ examples showing how is it possible to represent the geometrical part. The solution\
    \ presented here is the one used for example in the Combinatorial Maps package\
    \ of CGAL [61].\n\n# 5.4.1 Data Structures\n\nThe basic element of the definition\
    \ of n-maps is the dart. Thus the main data structure is the one which represents\
    \ the darts. In dimension n, a dart structure contains an array Betas of n + 1\
    \ pointers for representing the different βi links. We choose here to explicitly\
    \ encode β0 relations for efficiency reasons. Indeed, in algorithms, it is often\
    \ needed to retrieve the two neighbor darts in a same face of a given dart. This\
    \ operation is performed in constant time if β0 is encoded, while it is needed\
    \ to iterate through the face otherwise (or even worse, to iterate through all\
    \ the darts of the n-map if the considered face has a 1-boundary).\n\n# Listing\
    \ 5.1\n\nDart data structure for n-maps\n\n```\nstructure Dart\n{\n    pointer\
    \ to Dart Betas[n+1];\n    Boolean Marks[NB_MARKS];\n};\n```\n\nIn addition to\
    \ the n + 1 pointers, a dart structure contains an array Marks of Boolean which\
    \ serves to mark darts. These marks are used in several algorithms in order to\
    \ test in constant time if a dart is already processed. They also can be used\
    \ to mark some part of an n-map having a specific property. The number of marks\
    \ is defined by a constant number, NB_MARKS, which can be fixed by the users depending\
    \ on their requirements. Generally, 8 is enough for usual applications. In the\
    \ algorithms, marks satisfy an important invariant: all darts are always unmarked\
    \ for unused marks. This invariant allows us to avoid initialization of marks\
    \ in algorithms, and it is often more efficient"
