    # **Definition 60 (removable cell)**


    An $i$-cell $C$ in an $n$-map $M=(D,\beta_1,\ldots,\beta_n)$ is $i$-removable
    iff:


    +   - $i=n-1$;

    +   - or $0\le i<n-1$, and $\forall d\in C$, $\beta_{i+1}\circ\beta_{i+2}(d)=\beta_{i+2}\circ\beta_{i+1}^{-1}(d)$.


    The $i$-removal operation, for $i\ge 1$, is defined in Def. 61. It is also a direct
    transposition of the same definition for $n$-Gmap. Let $D^S$ be the set of darts
    $i$-linked with the removed $i$-cell $C$. $\beta_i$ is modified for all darts
    of $D^S$; in fact, $\beta_i^{-1}$ is used in order to take correctly into account
    the case when $i=1$. For each dart $d\in D^S$, the path of darts $(\beta_i\circ\beta_{i+1})^k\circ\beta_i(d)$
    is followed, until either a dart in $D^S$ is reached, which is the second extremity
    of the path, or $\varnothing$ is obtained, when the $n$-map has boundaries. These
    two cases correspond to the same condition: $k$ is the smaller positive integer
    such that the dart of the path does not belong to $C$.


    # **Definition 61 (cell removal)**


    Let $M=(D,\beta_1,\ldots,\beta_n)$ be an $n$-map and $C$ be a removable $i$-cell,
    $i\ge1$. Let $D^S=\beta_i^{-1}(C)\setminus C$. The $n$-map resulting from the
    $i$-removal of $C$ in $M$ is $M_{R_i}(C)=(D'',\beta''_1,\ldots,\beta''_n)$, defined
    by:


    +   - $D''=D\setminus C$;

    +   - $\forall j\in\{1,\ldots,n\}$, $j\ne i$, $\beta''_j=\beta_j|_{D''}$;

    +   - $\forall d\in D''\setminus D^S$, $\beta''_i(d)=\beta_i(d)$;

    +   - $\forall d\in D^S$, $\beta''_i(d)=(\beta_i\circ\beta_{i+1})^k\circ\beta_i(d)$,
