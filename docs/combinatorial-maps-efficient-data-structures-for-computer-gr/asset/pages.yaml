  md: '![](img/6ba3cf72cbe3568e76a174448323bb33_243_0.png)


    # **FIGURE 6.33**


    1-contraction of a dangling edge.

    (a) 2-map $M$; edge ${2,3}$ is dangling.

    (b) 2-map $M_{C_1}({2,3})$.


    The 1-contraction operation is defined in Definition 67 (cf. Figs. 6.30 and 6.31).
    There are two differences with the general case. First, the set of darts for which
    $\beta_1$ has to be modified is $D^S = \beta_0(C) \\ C$: $\beta_0$ is applied,
    instead of $\beta_1$, since $\beta_1$ is a partial permutation. Second, a path
    of darts corresponding to $(\beta_1)^k(d)$ is followed until obtaining a dart
    which does not belong to $C$.


    # **Definition 67 (1-cell contraction)**


    Let $M = (D, \beta_1, \ldots, \beta_n)$ be an $n$-map, and $C$ be a contractible
    1-cell. Let $D^S = \beta_0(C) \\ C$. The $n$-map resulting from the 1-contraction
    of $C$ in $M$ is $M_{C_1} = (D'', \beta''_1, \ldots, \beta''_n)$, defined by:


    +   - $D'' = D \\ C$;

    +   - $\forall j \in \{2, \ldots, n\},\ \beta''_j = \beta_j|_{D''}$;

    +   - $\forall d \in D'' \\ D^S,\ \beta''_1(d) = \beta_1(d)$;

    +   - $\forall d \in D^S,\ \beta''_1(d) = (\beta_1)^k(d)$, where $k$ is the smaller
    positive integer s.t. $(\beta_1)^k(d) \notin C$.


    An example of 1-contraction is presented in Fig. 6.33. Edge ${2,3}$ is dangling:
    cf. Fig. 6.33(a). $D^S = {1}$, and $\beta''_1(1) = 4$ (with $k = 2$). Note that
    the same 2-map is produced by the removal of edge ${2,3}$.


    Algorithm 57 implements the test of the contractibility condition. This is a direct
    implementation of the corresponding definition.


    The $i$-contraction operation is implemented by Algorithm 58, for $i \geq 2$,
    and Algorithm 59 implements the 1-contraction operation.


    As for the contraction operation for $n$-Gmaps, the complexities of these algorithms
    are linear in number of darts of the contracted cell.'
