    \n```\n**Input:** cm: an *n*-map;  \n　　　　d ∈ cm.Darts: a dart;  \n　　　　i ∈ {0,\
    \ …, *n*}.  \n**Output:** True iff d is i-free.  \n1. return d.Betas[i] = cm.null_dart;\n\
    ```\n\nThe algorithms which add isolated darts and remove isolated darts are straightforward\
    \ since they only add or remove elements in the set of darts. In Algorithm 35,\
