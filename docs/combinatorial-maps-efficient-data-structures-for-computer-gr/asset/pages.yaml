    *global* operations. For instance, when simulating a traversal of a building,
    the adjacency relations between the represented rooms make it possible to control
    the traversal: obviously, it is not possible, when exiting a room, to enter a
    nonadjacent room.


    Subdividing a geometric object corresponds in some way to discretize it, and discretizing
    a geometric object can be necessary or useful for many processes, for instance:


    +   - simulating some phenomena sometimes involve to solve partial differential
    equations, for instance simulating fluid flow in geological layers, heat in buildings,
    etc. Often (cf. finite element method, finite difference method, finite volume
    method), this requires to discretize the object or the part of geometric space
    containing the object², i.e. to compute a mesh with regular cells (simplices,
    cubes);

    +   - many processes in computer graphics or in computational geometry handle
    geometric objects as triangular meshes, since many computations can be efficiently
    designed for triangles, e.g. computing the intersection of a light ray and a triangle
    for image synthesis purposes.


