  md: "![](img/6ba3cf72cbe3568e76a174448323bb33_260_0.png)\n\n**FIGURE 6.46**  \n\
    1-chamfering for 2-Gmap.  \n(a) 2-Gmap $G$ describing the surface of a cube (partially\
    \ drawn).  \n(b) 2-Gmap $G_{1\\text{-chf}}(\\{1,2,3,4\\})$.\n\n+   - $\\alpha'_2$\
    \ is defined, according to the definition of $\\alpha'_2$ for the darts of $C$\
    \ (item 6); so, $\\alpha'_2$ is an involution (for instance, $\\alpha'_2(1^2)=1^1$).\
    \ This is the last part of the insertion of the new face.\n\nThe $i$-chamfering\
    \ operation is implemented by Algorithm 64. As above, the given $n$-Gmap is modified,\
    \ instead of building a new $n$-Gmap as result of the operation. The algorithm\
    \ is a direct translation of the definition. First, new darts are created, and\
    \ stored into phi associative arrays (there is an associative array phi[j] for\
    \ each $j \\in \\{1,\\ldots,n\\}$). Then, the $\\alpha$ links are defined for\
    \ these darts according to the definition.\n\nRemember that $\\alpha_{i+1}$ is\
    \ modified for the darts of $c_i(d)$ (line 18). In order to avoid side effects,\
    \ this is done in a second loop, after having defined all the $\\alpha$ links\
    \ for the new darts. Thus, the definition of the links for these new darts is\
    \ based on the original $\\alpha$ links of the $n$-Gmap. Moreover, and due to\
    \ the same reason, it is also necessary to be careful for the second loop, in\
    \ order to correctly iterate through the darts of $c_i(d)$. For that, the darts\
    \ of $c_i(d)$ are stored in a data structure (for example a stack) during the\
    \ first loop (line 2); the iteration of the second loop is done through this data\
    \ structure, and not through a cell iterator (line 17).\n\nThe complexity of Algorithm\
    \ 64 is linear in the number of darts #d of the chamfered $i$-cell times $\\log\
    \ #d$. Indeed, $n$ being a constant, the loops iterating through $j$ and $k$ (lines\
    \ 7, 8, 10 and 15) are bounded and thus can be considered as constants, and the\
    \ accesses to the associative array are done in log time."
