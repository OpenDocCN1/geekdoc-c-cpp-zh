    # 2.5 Discrete Structures


    It is necessary to define data structures in order to handle such quasi-manifolds
    (and more generally complexes) in computers. We will distinguish between the representation
    of the structure of the object (its “topology”) and the representation of its
    shape (its “embedding”, usually in some ℝⁿ).


    For instance (cf. Fig. 2.22), assume a triangulated surface embedded in ℝ³ is
    described by a set of triangles, each triangle being defined by three points.
    A possible data structure is a list of Triangle, each Triangle being a tuple of
    nine floating numbers, defining the coordinates of three points of ℝ³. This structure
    does not clearly distinguish between the representations of the topology and of
    the shape of the surface. In order to know that two triangles are adjacent, it
    is necessary to compare the coordinate values, i.e. to take the shape into account.
    Moreover, it is well-known that imprecisions or errors about floating numbers
    (as consequences of some computations, for instance) can lead to inexact representations
    of the surface. So it may be impossible to check whether two triangles are adjacent
    or not.


    An alternative representation is the following. A surface still corresponds to
    a list of Triangles, but a Triangle is now a tuple of three pointers to a Point,
    each Point being a tuple of three floating numbers corresponding to the three
    coordinates of a point in ℝ³. The precondition upon the data structure is the
    fact that a point (resp. a triangle) is represented only once (two different Points
    correspond to two distinct points of ℝ³, two different Triangle correspond to
    two distinct triangles). Now, the structure of the triangulation is represented,
    “independently” of its shape. For instance, in order to check whether two triangles
    are adjacent, pointers to points are compared, producing an exact information;
    the coordinates of the points are not involved here.'
