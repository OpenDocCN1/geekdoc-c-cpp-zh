  md: "The key point of this algorithm is the use once again of the two generic iterators.\
    \ If i > 2, we use the two sequences (0, 1, …, i − 2, i + 2, …, n) and (1, 0,\
    \ 2, …, i − 2, i + 2, …, n) to iterate through the two orbits by using the same\
    \ β links, except for β0 and β1 which are used in reverse order (if i = 2 the\
    \ two orbits are considered in the same order as they do not contain β1). Since\
    \ we know that d and d′ are i-sewable, and since the generic iterator uses the\
    \ indexes given in the sequence in the same order, at each step of the while loop,\
    \ the two iterators point to two darts in relation by isomorphism f of Def. 45.\
    \ For this reason, we only need to put the two pointed darts in relation by βi,\
    \ then move the two iterators to their next positions. Note that the relation\
    \ is done in both directions as βi is a partial involution (because i ∈ {2, …,\
    \ n}). The algorithm ends when the two iterators reach their end positions.\n\n\
    Algorithm 44 shows the special case of 1-sew operation. Its principle is similar\
    \ to the previous algorithm. The only difference is that there are two cases depending\
    \ if it ∈ ⟨{βi ∘ βj | ∀i, j ∈ {3, …, n}, i < j}⟩(d) or not (as seen in Def. 46\
    \ page 142).\n\n# Algorithm 44: 1sewNMap(cm,d,d′): 1-sew two darts for n-maps\n\
    \nInput: cm: an n-map;\n        d, d′ ∈ cm.Darts: two 1-sewable darts.\nResult:\
    \ 1-sew darts d and d′.\n\n```\n1 it ← generic iterator(cm,d,(3,…,n));\n2 it′\
    \ ← generic iterator(cm,d′,(3,…,n));\n3 while it is not to its end do\n4   if\
    \ it ∈ ⟨{βi ∘ βj | ∀i,j ∈ {3,…,n}, i < j}⟩(d) then i ← 1;\n5   else i ← 0;\n6\
    \   it.Betas[i] ← it′;\n7   it′.Betas[inv(i)] ← it;\n8   advance it to its next\
    \ position;\n9   advance it′ to its next position;\n```\n\nThe complexity of the\
    \ two sew algorithms is linear in the number of darts in the orbit ⟨β1,…,βi−2,βi+2,…,βn⟩(d).\
    \ In the 1-sew algorithm, all the darts in ⟨{βi ∘ βj | ∀i,j ∈ {3,…,n}, i < j}⟩(d)\
