    \ to D′, or a nonsafe version that does not make the test and assume the user\
    \ gives always a set of connected components. . .\n\n# Algorithm 41: restrictNMap(cm,D′):\
    \ restrict an n-map to a subset of darts\n\n```\nInput: cm: an n-map;\n    D′\
    \ ⊆ cm.Darts: a subset of darts.\nOutput: The n-map obtained by restricting cm\
    \ to D′.\n1 foreach dart d ∈ D′ do\n2   for i ← 0 to n do\n3     if d.Betas[i]\
    \ ∉ D′ then error;\n4 cm′ ← createNMap(n);\n5 cm′.FreeMarks ← cm.FreeMarks;\n\
    6 assoc ← an empty associative array between darts;\n7 assoc[cm.null_dart] ← cm′.null_dart;\n\
    8 foreach dart d ∈ D′ do\n9   assoc[d] ← createDartNMap(cm′);\n10 foreach dart\
    \ d ∈ D′ do\n11   d′ ← assoc[d];\n12   for i ← 0 to n do\n13     d′.Betas[i] ←\
    \ assoc[d.Betas[i]];\n14   for i ← 0 to NB_MARKS − 1 do\n15     d′.Marks[i] ←\
    \ d.Marks[i];\n16 return cm′;\n```\n\nThe complexity of the merging operation\
    \ is linear in the number of darts of the two given n-maps (#d1 and #d2) times\
    \ the complexity for accessing an element in the associative array, i.e. in O((#d1\
    \ + #d2).log(#d1 + #d2)). The complexity of the restrict operation is linear in\
    \ the number of darts in D′ times log|D′| (this corresponds to the cost of the\
    \ copy), plus the cost of the initial test (checking whether the subset of darts\
    \ corresponds to a set of connected components: lines 1 − 3). The test complexity\
