- pgno: 375
  md: 'A main interest of structures with regular cells is the fact that consistency
    constraints are taken into account within their definitions, and that they are
    more efficient than cellular structures for representing subdivisions with regular
    cells. The counterpart is the fact that subdivisions with any cells cannot be
    directly represented. When such a subdivision has to be represented, it is necessary
    to arbitrarily subdivide the cells, and to add information in order to memorize
    the initial cells. Moreover, several operations which naturally produce any cells
    (as Boolean operations, for instance) cannot be directly applied on such structures
    with regular cells.


    Cellular structures are also based upon simplicial structures: a *numbering mechanism*
    makes it possible to implicitly define cells as particular subsets of simplices.
    Mainly two classes of cellular structures can be distinguished:


    +   - one is related to incidence graphs; they correspond to abstract simplicial
    complexes structured into cells, and multi-incidence between cells is not taken
    into account. Incidence graphs do not naturally integrate consistency constraints
    about cells: so, cells can be complexes, and not even quasi-manifolds. Consistency
    constraints have to be explicitly checked, for instance based upon the definition
    of *n*-surfaces (remember that *n*-surfaces are a subclass of incidence graphs
    corresponding to quasi-manifolds). In order to simplify, incidence graphs are
    often linearly embedded by associating *convex* spaces with cells; cells are thus
    homeomorphic to balls, and such embedded incidence graphs correspond to *regular
    CW-complexes*¹. Since the structure itself does not integrate consistency constraints,
    operations have to take these constraints into account, but it is usually difficult.
    For instance, many operations, usual in Geometric Modeling, do not produce convex
    cells;

    +   - the other one is related to combinatorial maps; they correspond to semi-simplicial
    sets structured into cells, and multi-incidence between cells is taken into account.
    Combinatorial maps naturally integrate consistency constraints: mainly cells are
    quasi-manifolds. Since constraints are taken into account within the structure
    definition itself, operations can be easily defined. Moreover, combinatorial maps
    can be embedded linearly, or by associating curved spaces with cells. Combinatorial
    maps can thus be used for a larger class of applications than incidence graphs.
    The drawback is the fact that combinatorial maps, when equivalent to incidence
    graphs, are generally more space consuming; note that the ratio is usually not
    important for applications in geometric modeling, computational geometry, discrete
    geometry, computer graphics, image processing and analysis; and operations for
    handling combinatorial maps are less time consuming than operations for handling
    incidence graphs, since more constraints have to be checked for these last ones.'
  merge: -1
  img_proc: true
- pgno: 376
  md: 'Operations for converting incidence graphs and combinatorial maps satisfying
    both some properties have been conceived. Moreover, optimized structures have
    been defined in order to represent subclasses of subdivisions, as n-Gmaps for
    n-dimensional quasi-manifolds and n-maps for n-dimensional oriented quasi-manifolds.
    Contrary to incidence graphs, the fact that subclasses are represented is taken
    into account within the structure definition, leading to optimization².


    This general frame for the definition of structures representing subdivisions
    is thus sound, since it is based upon simplicial structures, and safe mechanisms
    (cartesian product, numbering for implicit definition of cells). It is large,
    from structures with regular cells to structures with any cells, from complexes
    to oriented quasi-manifolds. Optimization mechanisms exist, for defining structures
    suited for subclasses of subdivisions. Given an application, it is thus possible
    to define a structure, well-suited to the requirements of the application.


    # Model choice


    The choice of a topological model obviously depends on the “nature” of objects
    one intends to handle, and also on the operations which have to be applied, the
    space/time complexity and the complexity of software development [21, 96]. It
    is thus a classical problem: choosing a data structure, taking into account:


    +   1. the “nature” of objects, i.e. the topological properties satisfied by the
    objects. It is possible to always use a general structure conceived in order to
    represent “any” cellular complex, but it is often space consuming, maybe also
    time consuming, since more information has to be handled compared to an optimized
    structure. It is also obvious that using a structure conceived for a subclass
    in order to handle subdivisions of a larger class can lead to important errors.
    For instance, even if it is intuitively possible to deduce an incidence graph
    from a subdivision in which some cells are multi-incident to other cells, the
    formal interpretation of the resulting incidence graph does not correspond in
    any way to the initial subdivision;


    +   2. the operations applied to the objects. It is impossible to define some
    operations for some structures, since these operations naturally create objects
    which do not satisfy the implicit properties of the structures (e.g. Boolean operations
    for simplicial objects);


    ²n-surfaces are incidence graphs satisfying some structural property. This property
    does not lead to an optimized representation, and it has to be checked in order
    to know if an incidence graph represents a quasi-manifold. Conversely, there is
    a bijection between n-Gmaps and quasi-manifolds, and n-Gmaps is an optimized representation,
    compared to chains of maps, which have been designed for representing cellular
    complexes.'
