  md: '# 10


    *Concluding Remarks*


    Numerous data structures and operations have been proposed in order to represent
    and handle subdivided geometric objects, for various applications within different
    fields, e.g. geometric modeling, computational geometry, discrete geometry, computer
    graphics, image processing and analysis, etc. [17, 8, 167, 214, 127, 107, 215,
    93, 102, 87, 38, 163, 162, 94, 10, 195, 128, 170, 181, 203, 108, 57, 39, 132,
    183, 153, 165, 104, 184, 154, 110, 49, 19, 159, 31, 45, 90, 84, 88, 66, 175, 185,
    157, 60, 50, 158].


    All structures are based on the representation of the structural information (topology),
    the shape (embedding) being represented by attributes associated with the cells.
    This distinction between topology and embedding makes it possible to easily define
    different data structures corresponding to different embedding requirements (linear,
    curved embeddings); this simplifies also the definition of operations and the
    reuse of software parts.


    Note (and this is reassuring) that the proposed solutions are often similar, whatever
    their original field is. More precisely, most *topological models* conceived for
    representing the structural information of subdivisions fit into a general frame.


    # *General frame*


    *Simplicial structures are the basis of this frame.* Two classes can be distinguished:


    +   - one is related to abstract simplicial complexes, and multi-incidence between
    simplices is not taken into account. So, such structures are usually linearly
    embedded, i.e. as simplicial complexes. Basic operations as identification of
    vertices can lead to identify other simplices, or to degenerate simplices;

    +   - the other one is related to (semi-)simplicial sets, and multi-incidence
    is taken into account. So, such structures can be embedded with curved shapes,
    for instance triangular Bézier spaces. Basic operations modify only the simplices
    on which they are applied.


    Operations for converting abstract simplicial complexes and semi-simplicial sets
    satisfying some properties have been conceived. Moreover, optimized structures
    have been conceived in order to represent subclasses of'
  merge: -1
  img_proc: true
- pgno: 374
  md: 'abstract simplicial complexes or semi-simplicial sets, mainly for representing
    objects close to (quasi-)manifolds (see for instance [183, 90]). For instance:


    +   - quasi-manifolds are defined as objects one can construct by adding n-simplices
    and by identifying (n−1)-simplices, in such a way that at most two n-simplices
    share a (n−1)-simplex. This definition is consistent for semi-simplicial sets.
    But several problems arise when applied to abstract simplicial complexes, since
    the identification of simplices can lead to the degeneracy of simplices [89];

    +   - optimized data structures have been proposed in order to represent quasi-manifolds;
    mainly, n-simplices are represented, together with adjacency relations between
    n-simplices.


    Simplicial objects are well-known in combinatorial topology: several operations
    have been defined, as many topological properties and methods for computing these
    properties. The fact that the general frame for the definition of structures for
    representing subdivisions is based upon simplicial structures is thus very interesting,
    since many notions, constructions, properties and algorithms can be extended for
    the other structures of this frame. For instance, it has been possible to extend
    the definition of cartesian product from simplicial sets to combinatorial maps
    [166]; similarly, a topological property, namely homology, has been directly defined
    on combinatorial maps, inspired by the corresponding definition for semi-simplicial
    sets [78, 4].


    Cubic and simploidal structures have been defined in order to represent subdivisions
    with cubic cells, and more generally with simploidal cells. They are based upon
    simplicial structures, and cartesian product [185, 186]:


    +   - a 2-dimensional cube is the cartesian product of two 1-dimensional cubes,
    i.e. two edges; more generally, a n-dimensional cube is the cartesian product
    of n edges. It is possible to deduce cubic sets from semi-simplicial sets: cubes
    are the basic elements (as simplices are the basic elements of semi-simplicial
    sets), and they are linked by face operators;

    +   - more generally, a simploid is the cartesian product of simplices of any
    dimension; for instance, a prism is the cartesian product of an edge and a triangle.
    Simploidal sets have been deduced from semi-simplicial sets: their basic elements
    are simploids, which are linked by face operators.


    Such structures can be useful for image processing and analysis (since pixels,
    voxels, and more generally the basic elements of images, are associated with n-cubes),
    and also for computer graphics, geometric modeling or computational geometry,
    for handling assemblies of curved geometric simploids. As for simplicial structures,
    optimized structures for representing subclasses of cubic and simploidal sets
    can be defined.'
