- pgno: 176
  md: 'The proof of this theorem is easy. First, it is proved that any n-map can be
    decomposed into a set of darts in dimension 0 by applying a sequence of decrease
    dimension and unsew operations. Let M be an n-map. The n-unsew operation is applied
    to any non n-free dart. This operation can always be applied to a non n-free dart,
    and it increases at least by two the number of n-free darts. Thus, at the end,
    all the darts of the resulting n-map are n-free. Next, the decrease dimension
    operation can be applied, producing an (n − 1)-map. The process can be reiterated
    until obtaining a 0-map composed by a set of isolated darts. In order to prove
    the second part of the theorem, let us consider the previous operation sequence
    in reverse order, and replace each operation by its inverse operation (decrease
    dimension by increase dimension and i-unsew by i-sew). This sequence transforms
    the 0-map into M.


    A similar theorem and proof can be stated for the second construction method.


    # Theorem 4 (Completeness of the second method for n-map construction or destruction)


    Any n-map can be transformed into an empty n-map by a sequence of i-unsew and
    remove isolated darts operations. Conversely, any n-map can be constructed starting
    from an empty n-map by applying the add isolated dart and i-sew operations.


    The proof of the first part of this theorem is based upon the fact that an i-unsew
    operation can be applied to any non i-free dart, increasing at least by two the
    number of i-free darts. And when a dart is isolated, it can be removed. We get
    thus a sequence of operations which at last destructs the n-map; in order to get
    the initial n-map, the inverse operations can be applied in reverse order, proving
    thus the theorem.


    # 5.3.4 Multi-Incidence


    Any n-map can be constructed by the basic construction operations; possible configurations
    are now studied. Indeed, there are two cases of sew operations: the first one
    is the identification of two distinct cells; the second one is the identification
    of one cell with itself. For practical applications, identification is (almost)
    always applied to two distinct cells.


