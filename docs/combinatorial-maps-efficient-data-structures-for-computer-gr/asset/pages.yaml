    # 2.5.2 Hypermaps, Group of Permutations, Orbits


    Let S = {P₁, …, Pₖ} be a set of permutations defined on a set D. (D, P₁, …, Pₖ)
    is a k-dimensional hypermap⁸; the associated graph is the union of the graphs
    (D, P₁), …, (D, Pₖ): cf. Fig. 2.26.


    Let S'' = {Pᵢ₁, …, Pᵢⱼ} be a subset of S. ⟨S''⟩ is the group of permutations,
    or permutation group, generated by S'': it is the set of all permutations P such
    that P is either Id, a permutation of S'' or its inverse, or any composition of
    permutations of S'' and their inverses. For instance, let I and I'' be the involutions
    depicted in Figs. 2.26(a) and (b). ⟨I, I''⟩ is {Id, I, I'', I'' ∘ I, I ∘ I'',
    I ∘ I'' ∘ I, I'' ∘ I ∘ I'', …}.


    The orbit of an element d of D relatively to S'' is the set ⟨S''⟩(d) = O(d) =
    {P(d) | P ∈ ⟨S''⟩}. It is the set of all elements which can be reached, starting
    from d, by applying any composition of (inverses of) permutations of S'' (note
    that d belongs to any of its orbits, since Id belongs to any permutation group).
    ⟨S''⟩(d) denotes also, according to the context, the sub-hypermap (O(d), Pᵢ₁|O(d),
    …, Pᵢⱼ|O(d)), where Pᵢₖ|O(d) is the restriction of Pᵢₖ to O(d)


    > ⁸ As n-Gmaps and n-maps to which this book is mainly devoted, hypermaps are
    particular classes of combinatorial maps: the relations between these structures
    are explained in chapter 8.'
