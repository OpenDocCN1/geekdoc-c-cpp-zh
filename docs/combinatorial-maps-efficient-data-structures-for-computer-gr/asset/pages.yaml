    this dart by setting d.Marks[i] to true/false (see Algorithms 26 and 27).


    # Algorithm 25: isMarkedNMap(d,i): test if a dart is marked for n-maps


    Input: d: a dart;

    i: the index of a reserved mark.

    Output: True iff d is marked for mark i.


