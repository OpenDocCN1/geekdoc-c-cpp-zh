    # 1.2 Explicit Representations of Subdivisions


    # 1.2.1 Why Explicit Representations?


    Explicit means that the representation of a subdivision is based upon a representation
    of the cells and their structural relations. More precisely, the structure of
    a finite subdivision, i.e. a subdivision containing a finite number of cells,
    can be implemented by a discrete data structure. For instance, the structure of
    a wire mesh can be represented by a graph: each wire corresponds to an edge, an
    extremity of a wire corresponds to a vertex.


    The shape of the wire mesh is represented by attributes associated with the graph,
    for instance:


    +   - for a piecewise linear shape: the representation of a geometric point is
    associated with any vertex; so, each edge is associated with a line segment joining
    the two points associated with the vertices incident to the edge; in order to
    avoid degeneracies, two distinct points are associated to two distinct vertices;


    +   - for a piecewise curved shape: a curve (for instance a spline, a Bézier curve,
    etc.) is associated with any edge, in such a way that the curves associated with
    adjacent edges share extremity points.


    Note that in both cases, the attributes defining the shape have to satisfy some
    properties in order to fit the structure of the subdivision.


    So, the key point for defining data structures for representing subdivisions'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'is to focus on the subdivision structure, i.e. the cells and their structural
    relations. Often, the data structures are close (in some way) to graphs. So, *structural
    characteristics* (e.g. connectivity) can be efficiently computed on the data structure,
    which can be useful in order to *provide information* about the object, or to
    *control its construction*. The structure of objects can also be used in order
    to efficiently compare objects or match objects, e.g. for Pattern Recognition
    applications.


    At last, remember that the shape is *locally defined* as attributes of cells:
    this is often referred to as the *distinction between topology and embedding*¹.
    As mentioned above, the shape attributes have to satisfy some properties in order
    to be coherent according to the structure. Moreover, a relative independence exists
    between the structure and the shape. For instance, the shape of a wire mesh can
    be modified although its structure remains invariant, by modifying the points
    associated with the vertices of the graph representing the wire mesh. Similar
    modifications can be useful for the animation of articulated mechanical objects
    or other applications in geometric modeling, computational geometry, discrete
    geometry, computer graphics, image processing and analysis, etc.


    Obviously, shape and structure are not completely independent, and, according
    to the operations, each one can influence the other. For instance for the simulation
    of the growing of plants, the creation of a new branch changes the structure of
    the plant; at the beginning, the branch is so small that it is quite not visible,
    then its length increases, modifying the shape of the tree; in some way, the structure
