    \ i-sewable. Algorithm 42 allows to test if two given darts are i-sewable or not.\
    \ This algorithm follows directly the i-sewable definition given in Def. 44 page\
    \ 141. Its main principle is to run simultaneously through the two orbits o_d\
    \ and o_d', to progressively build the isomorphism while testing it is indeed\
    \ an isomorphism.\n\n```\nAlgorithm 42: sewableNMap(cm,d,d',i): test if two darts\
    \ are i-sewable for n-maps\nInput: cm: an n-map;\n       d, d' ∈ cm.Darts: two\
    \ darts;\n       i ∈ {1,…,n}.\nOutput: True iff d is i-sewable with d'.\n1 if\
    \ not isFreeNMap(d,i) or not isFreeNMap(d',inv(i)) then\n2   return false;\n3\
    \ if d = d' then return true;\n4 if i = 1 or i = 2 then\n5   S ← (i + 2,…,n);\
    \ it ← generic iterator(cm,d,S);\n6   it' ← generic iterator(cm,d',S);\n7 else\n\
    8   S ← (0,1,…,i − 2,i + 2,…,n); it ← generic iterator(cm,d,S);\n9   it' ← generic\
    \ iterator(cm,d',(1,0,2,…,i − 2,i + 2,…,n));\n10 f ← an empty associative array\
    \ between darts;\n11 f[cm.null_dart] ← cm.null_dart;\n12 while it is not to its\
    \ end and it' is not to its end do\n13   f[it] ← it';\n14   foreach j ∈ S do\n\
    15     if it.Betas[i] is defined in f and\n16     f[it.Betas[i]] ≠ it'.Betas[inv(i)]\
    \ then\n17       return false;\n18   advance it to its next position;\n19   advance\
    \ it' to its next position;\n20 if it is not to its end or it' is not to its end\
    \ then\n21   return false;\n22 return true;\n```\n\nFirstly in line 1, we verify\
    \ that d is i-free and that d is inv(i)-free. If it is not the case, the two darts\
    \ are not i-sewable. Secondly if d = d' they are always sewable. Thirdly we create\
    \ two generic iterators that cor-"
