  md: 'The i-chamfering operation is defined in Def. 72. This operations takes as
    input an n-Gmap G and one of its i-cell C. It mainly consists in creating new
    sets of darts D^j, for each i + 1 ≤ j ≤ n. Intuitively, each D^j corresponds to
    the j-cells required to chamfer the initial i-cell.


    # Definition 72 (chamfering) Let G = (D, α0, …, αn) be an n-Gmap, C be one of
    its i-cells, with i ∈ {0, …, n − 1}. The n-Gmap resulting from the i-chamfering
    of C in G is G_i-chf(C) = (D′, α′0, …, α′n) defined by:


    +   • ∀j ∈ {i + 1, …, n}, let D^j be a set of new darts, such that a bijection
    φ^j maps C onto D^j. Let φ^i be the identity on C;

    +   • D′ = D ∪_{j=i+1}^n D^j;

    +   • 1. ∀j ∈ {0, …, n}, j ≠ i + 1, ∀d ∈ D, α′j(d) = αj(d);

    +     2. ∀d ∈ D \ C, α′i+1(d) = αi+1(d);

    +     3. ∀d ∈ C, α′i+1(d) = φ^{i+1}(d).

    +   • ∀j ∈ {i + 1, …, n}, ∀d ∈ C:

    +     4. ∀k ∈ {0, …, i − 1}, α′k(φ^j(d)) = φ^j(αk(d));

    +     5. ∀k ∈ {i, …, j − 1}, α′k(φ^j(d)) = φ^j(αk+1(d));

    +     6. α′j(φ^j(d)) = φ^{j−1}(d);

    +     7. if j < n, α′j+1(φ^j(d)) = φ^{j+1}(d);

    +     8. ∀k ∈ {j + 2, …, n}, α′k(φ^j(d)) = φ^j(αk(d)).


    The chamfering operation is illustrated in Fig. 6.45; it is applied to vertex
    C = {1,2,3,4,5,6} of a 2-Gmap describing the surface of a cube. D^1 = {1^1,2^1,3^1,4^1,5^1,6^1}
    and D^2 = {1^2,2^2,3^2,4^2,5^2,6^2} are the sets of new darts, φ^1 (resp. φ^2)
    associates darts d and d^1 (resp. d^2).


    α′ involutions are defined on D by items 1 − 3 of the definition. For the example,
    nothing is changed, except for the darts of C, which are 1-linked with the darts
    of D^1 according to φ^1 (item 3): so, each dart incident to a corner of a face
    in the initial object is now linked with a new dart (for instance, α′1(1) = 1^1);
    this is the first part of the insertion of a new edge into each corner of each
    face.


    α′ involutions are defined on the new darts by items 4 − 8 of the definition:


    +   • for D^1:

    +     – each edge inserted into an initial face is constructed, by defining α′0,
    according to α1 (item 5); this is the second part of the insertion of a new edge
    into each corner of each face (for instance, α′0(1^1) = 2^1);

    +     – α′1 is defined, according to the definition of α′1 for the darts of C
    (item 6): so α′1 is an involution (for instance, α′1(1^1) = 1); this is the last
    part of the insertion of a new edge into each corner of each face;'
