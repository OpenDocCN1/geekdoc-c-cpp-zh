    in the graph makes it possible to choose e₂ in order to follow the boundary of
    f₁?


    Note also that it may be difficult to define subclasses of incidence graphs dedicated
    to particular complexes. For instance, it is possible to construct incidence graphs
    in which a 1-cell is incident to more than two 0-cells; so, what are the properties
    that an incidence graph has to satisfy in order to represent a quasi-manifold?
    Such properties have been defined (cf. [84], for instance), but they are not intrinsic
    to the definition of incidence graphs, contrary to “ordered” structures as n-Gmaps
    and n-maps (cf. chapter 4 and chapter 5).


    Since only complexes in which no multi-incidence occurs can be represented with
    incidence graphs, only particular embeddings can be associated, usually linear
    embeddings, i.e. a 0-cell is associated with a point, a 1-cell is associated with
    a line segment, a 2-cell is associated with a part of a plane, etc., and these
    embeddings of cells satisfy the incidence relations between cells (e.g. the point
    associated with a 0-cell which is incident to a 1-cell is the extremity of the
    line segment associated with the 1-cell).


    Many applications in geometric modeling, computational geometry, discrete geometry,
    computer graphics, image processing and analysis require to handle nonlinear objects,
    e.g. parametric curves and surfaces, etc., and objects in which multi-incidence
    can occur. Thus, many “ordered” models have been proposed (e.g. [17, 214, 203,
    39, 165, 104]). Note also that it is often more easy to conceive construction
    operations for handling ordered models than for handling incidence graphs. n-Gmaps
    (resp. n-maps) are an archetype of ordered models dedicated to the representation
    of the topology of quasi-manifolds (resp. oriented quasi-manifolds), that is why
    this book is devoted to these structures.'
