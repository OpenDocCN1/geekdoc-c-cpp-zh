    mark.


    Algorithm 38 implements the operation that increase the dimension of a given *n*-map:
    it only creates a new (*n* + 1)-map cm′ and then copies cm into cm′.


    Algorithm 39 implements the operation that decrease the dimension of a given *n*-map:
    it only creates a new (*n* − 1)-map cm′ and then copies cm into cm′. Note that
    we require here that the given *n*-map has all its darts *n*-free. We can add
