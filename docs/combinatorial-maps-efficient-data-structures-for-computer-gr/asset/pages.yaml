- pgno: 109
  md: 'Note that, according to this definition, a cell is never incident to itself
    since i must be different from j, but it can be adjacent to itself: for instance
    a loop is adjacent to itself, and more generally cells can be multi-incident to
    other cells: cf. Section 4.3.


    It is possible to test if two n-Gmaps describe the topology of the same subdivision,
    i.e. the same set of cells and the same structure of incidence relations. This
    corresponds to the isomorphism notion. Two n-Gmaps are isomorphic if there is
    a one-to-one mapping between their darts which preserves all involutions (cf.
    Def. 9).


    # Definition 9 (isomorphism) Two n-Gmaps G = (D, α₀, …, αₙ) and G'' = (D'', α''₀,
    …, α''ₙ) are isomorphic if there exists an isomorphism mapping D onto D'', i.e.
    a one-to-one mapping f : D → D'', such that ∀d ∈ D, ∀i ∈ {0, …, n}: f(αᵢ(d)) =
    α''ᵢ(f(d)).


    It is also possible to test if an n-Gmap G'' is included in a second n-Gmap G,
    or in other words if there exists a part of G being isomorphic to G''. An n-Gmap
    is subisomorphic to a second one if an injective mapping exists between the darts
    of the first n-Gmap onto the darts of the second n-Gmap that preserves all the
    involutions inside the concerned part of the second n-Gmap (cf. Def. 10 and example
    in Fig. 4.3).


    # Definition 10 (subisomorphism) An n-Gmap G'' = (D'', α''₀, …, α''ₙ) is isomorphic
    to a submap of G = (D, α₀, …, αₙ) if there exists a subisomorphism between D''
    and D, i.e. an injective mapping f : D'' → D, such that ∀d ∈ D'', ∀i ∈ {0, …,
    n}:


    +   - if d is not i-free, then f(α''ᵢ(d)) = αᵢ(f(d));

    +   - otherwise, either f(d) is i-free, or ∀dₖ ∈ D'', f(dₖ) ≠ αᵢ(f(d)).


    # 4.2 Basic Operations


    In the previous section, several basic definitions concerning n-Gmaps have been
    introduced. Now some basic operations are defined, allowing to modify existing
    n-Gmaps. Note that many high level operations have been defined, sometimes based
    on these basic ones, allowing to directly construct and modify n-Gmaps. Even if
    the basic operations introduced here can be directly used to interactively construct
    an object, their interest is mainly theoretical by providing a small basis of
    operations allowing to build any n-Gmap. The high level operations usually handle
    orbits, as cells for instance, although basic operations handle directly the darts
    and the involutions. All these operations take as input an n-Gmap and produce
    another n-Gmap which is the result of the operation.'
