    In this section, we show that any n-Gmap can be built thanks to the basic operations.
    For that, two basic construction methods allowing to build an n-Gmap are proposed:
    the first one consists in applying an iterative creation process, which increases
    progressively the dimension of the n-Gmap starting from 0 until the dimension
    of the object, and at each step sews some darts for the new dimension; the second
    one consists in starting directly in the dimension of the object, in adding some
    isolated darts, and in sewing some darts for any dimension. Note that as for the
    basic operations, the main interest of these construction methods is mainly theoretical,
    and generally high level operations are used for practical applications.


