    3   if not isMarkedNMap(e,ma) then\n4     // process dart e\n5     mark all the\
    \ darts in c_i(e) for ma;\n6 unmark all marked darts for ma;\n7 freeMarkNMap(cm,ma);\n\
    ```\n\nunmark all the marked darts, we reuse the same algorithm by reversing the\
    \ role of marked and unmarked darts.\n\nThe complexity of this algorithm is linear\
    \ in the number of darts discovered during the traversal, i.e. in the number of\
    \ darts of c_j(d) plus the number of darts of the incident cells.\n\nThe last\
    \ example given in Algorithm 33 allows to run through one dart per each i-cell\
    \ adjacent to a given i-cell, for i > 0.\n\nOnce again we use the same principle\
    \ than for the two previous examples, but here, we have to test dart β_i(e) for\
    \ each e ∈ c_i(d). Indeed, due to the definition of adjacency relations in n-maps,\
    \ we know that all adjacent i-cells to c_i(d) can be reached by such a dart. For\
    \ i = 1 it is also required to test β_i^{-1}(e), i.e. β_0(e). It is easy to modify\
    \ this algorithm to consider the case i = 0 thanks to Def. 33.\n\nThe complexity\
    \ of this algorithm is linear in the number of darts discovered during the traversal,\
    \ i.e. in the number of darts of c_i(d) plus the number of darts of the adjacent\
    \ cells.\n\nNote that we generally implement the iterators as data structures\
    \ (like iterators in STL [12]) allowing to start a traversal, move to the next\
    \ position, get the current element pointed by the iterator and test if the iterator\
    \ has reached its end position (i.e. the traversal is finished). Some algorithms\
    \ given in next sections use this type of implementation (for example Algorithms\
    \ 42 and 43 page 171).\n\n# 5.4.3 Basic Tools\n\nWe propose now algorithms implementing\
