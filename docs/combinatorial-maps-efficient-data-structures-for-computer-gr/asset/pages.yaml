    # 2.3 Classification of Paper Surfaces


    # 2.3.1 Topological Surfaces


    Several numbers can be associated with any surface paper S:


    +   - *b(S)* is the *number of boundaries* of *S*;


    +   - *c(S)* is the *Euler characteristic* of *S*, defined by:


    *c(S) = v(S) − e(S) + f(S)*


    where *v(S)*, *e(S)* and *f(S)* are respectively the numbers of vertices, edges
    and faces of *S*.


    +   - *q(S)* is the *orientability factor* of *S*, defined by:


    *q(S) = { 0 if S is orientable; 1 if S is nonorientable and (b(S) + q(S)) is odd;
    2 otherwise. }*


    +   - *g(S)* is the *genus* of *S*, defined by: *g(S) = 1 − (b(S) + c(S) + q(S))/2.*


    For instance, all polygons depicted in Fig. 2.7 have one boundary; their Euler
    characteristic is equal to 1, they are orientable, so their orientability factor
    is equal to 0, and their genus is null. All polygons have these characteristics
    (all have one boundary, they are orientable, their Euler characteristic is equal
    to 1, since they have one face, and vertices and edges in equal numbers), but
    other surfaces too, for instance the gluing of a square and a triangle, or the
    gluing of two squares: cf. Fig. 2.8(a) and Fig. 2.11(c). The annulus has two boundaries,
    its Euler characteristic is equal to 0, it is orientable, so its genus is equal
    to 0. The Möbius strip has one boundary, its Euler characteristic is equal to
    0, it is not orientable, so its orientability factor is equal to 1 and its genus
    is equal to 0.


    All these numbers are integers, and for any paper surface S, b(S), q(S) and g(S)
