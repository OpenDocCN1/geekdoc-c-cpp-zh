    ![](img/6ba3cf72cbe3568e76a174448323bb33_295_1.png)


    describe such information was the region adjacency graph (RAG): a vertex corresponds
    to each region of the image, and two vertices are linked by an edge if the two
    corresponding regions are adjacent [193]. The RAG has several advantages: this
    is a simple data structure (a graph) which can be defined for any dimension. Given
    a region, it is easy to retrieve all its adjacent regions. Merging two adjacent
    regions can be done in the RAG by contracting the edge linking the two corresponding
    vertices. However, there are also several drawbacks. First, a RAG does not take
    the multi-adjacency into account. When two regions are adjacent several times,
    there is only one edge in the corresponding RAG. Second, the regions adjacent
    to a given region are not ordered³, and this order is often important for operations.
    Third, a RAG does not describe all the cells of the subdivision corresponding
    to a labeled image. In 2D, only 2-cells are described (which are regions), and
    some 1-cells (which are frontiers separating regions) corresponding to edges of
    the RAG.


    Several solutions were proposed to solve these drawbacks, such as dual graphs
    [217, 152] for example. But this ad hoc solution is defined only in 2D and cannot
    be extended for higher dimension. In order to propose a generic definition, including
    the description of the multi-adjacency and the order relations, many works have
    concluded that a good solution consists in basing this definition on n-maps, and
    similar solutions have been proposed [95, 110, 32, 66]. Here, the solution defined
    in [66] for 2D labeled images is described, one of its main advantages is that
    it can be extended in 3D [59].


