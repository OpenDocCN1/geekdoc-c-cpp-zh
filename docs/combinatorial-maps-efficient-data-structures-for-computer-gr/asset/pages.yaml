- pgno: 126
  md: '# 4.3.3 Completeness


    Now we show that any n-Gmap can be constructed thanks to the two construction
    methods. First, we show that any n-Gmap can be destroyed by following the inverse
    processes; then, since any basic operation has an inverse operation, any n-Gmap
    can be constructed by applying the inverse sequence of inverse operations.


    Let start with the first method.


    # Theorem 1 (Completeness of the first method for n-Gmap construction or destruction)


    Any n-Gmap can be transformed into a set of isolated darts in dimension 0, by
    a sequence of unsew and decrease dimension operations, unsew being always applied
    for the highest possible dimension. Conversely, any n-Gmap can be constructed
    starting from a set of isolated darts in dimension 0, by using only the increase
    dimension and sew operations, sew being always applied for the highest possible
    dimension.


    The proof of this theorem is easy. For the first part of the theorem, let us start
    from an n-Gmap G. For each non n-free dart d, the n-unsew operation is applied.
    This operation can always be applied for any non n-free dart, and it increases
    at least by two the number of n-free darts. Thus, at the end, an n-Gmap having
    all its darts n-free is obtained. Now the decrease dimension operation can be
    applied, producing an (n − 1)-Gmap. The process can be iterated until obtaining
    a 0-Gmap which is composed by a set of isolated darts of dimension 0. In order
    to prove the second part of the theorem, let us consider the previous operation
    sequence in reverse order, by replacing each operation by its inverse operation
    (decrease dimension by increase dimension and i-unsew by i-sew). This sequence
    transforms the set of isolated darts in dimension 0 into G.


    A similar theorem and proof can be stated for the second construction method.


    # Theorem 2 (Completeness of the second method for n-Gmap construction or destruction)


    Any n-Gmap can be transformed into an empty n-Gmap by a sequence of i-unsew and
    remove isolated darts operations. Conversely, any n-Gmap can be constructed starting
    from an empty n-Gmap by using only the add isolated darts and i-sew operations.


    The proof of the first part of this theorem is based upon the fact that an i-unsew
    operation can be applied to any non i-free dart, increasing at least by two the
    number of non i-free darts. And when a dart is isolated, it can be removed. This
    produces a sequence of operations which at last destructs the n-Gmap: in order
    to get the initial n-Gmap, the inverse operations can be applied in reverse order,
    proving thus the theorem.'
  merge: -1
  img_proc: true
