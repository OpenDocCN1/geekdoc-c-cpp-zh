    # 8.1.3 Conversions of Simplicial Structures


    Semi-simplicial sets are a “more general” structure than abstract simplicial complexes:
    as said above, semi-simplicial sets allow multi-incidence between simplices, but
    abstract simplicial complexes do not. That means that a semi-simplicial set can
    be associated with any abstract simplicial complex, but the converse is not true.
    More precisely:


    +   1. Let K be an abstract semi-simplicial set defined on the set of vertices
    V. A semi-simplicial set can be associated with K in the following way. Define
    an order on the vertices of V. Associate with any simplex (which is a set of vertices)
    the sequence of its vertices according to the order defined on V, and associate
    a simplex in the semi-simplicial set with this sequence. Define now the face operators
    in the following way: let σ be an i-simplex associated with a sequence (v₀, …,
    vⱼ, …, vᵢ); for any j, 0 ≤ j ≤ i, dⱼ(σ) is the (i − 1)-simplex associated with
    the sequence (v₀, …, v̂ⱼ, …, vᵢ), where v̂ⱼ denotes that vⱼ is removed. For instance,
    the semi-simplicial set corresponding to the abstract simplicial complex depicted
    on Fig. 8.2(a), where the order of the vertices corresponds to the order of the
    points, i.e. from P₁ to P₆, is depicted on Fig. 8.4(a). Note that the commutation
    property of face operators is satisfied by this construction. Note also that several
    nonisomorphic semi-simplicial sets can be associated with a single abstract simplicial
    complex, depending on the order chosen on V.


    +   2. Conversely, let S be a semi-simplicial set, such that:


    +   - any i-simplex σ is incident to (i + 1) distinct 0-simplices; in other words,
    the set V(σ) = {d₀(d₁(… d̂ⱼ(… dᵢ(σ)))), 0 ≤ j ≤ i} contains (i + 1) 0-simplices;

    +   - for any i, 1 ≤ i ≤ n, for any distinct i-simplices σ and τ, the sets of
    vertices incident to σ and τ, i.e. V(σ) and V(τ), are distinct.


    In this case, an abstract simplicial complex K can be associated with S: the set
    of vertices associated with K is the set of 0-simplices of S, and the simplices
    of K are the sets of vertices associated with the simplices of S.'
