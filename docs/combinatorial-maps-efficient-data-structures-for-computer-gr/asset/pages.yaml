  md: 'Gmaps. Some preliminary definitions are needed in order to define n-surfaces:
    cf. Fig. 8.16.


    Let G be an incidence graph, and let c^i be a vertex of G. The closure of c^i
    is the subgraph of G such that c^i is its root; in other words, it contains c^i,
    all vertices c^k such that a path from c^i to c^k exists in G (so k < i), and
    all edges of G linking these vertices. The boundary of c^i is the closure of c^i
    minus c^i and its incident edges. Let G^- be the graph deduced from G by reversing
    all edges; the star (resp. proper star) of c^i is the subgraph of G which corresponds
    to the closure of c^i (resp. the boundary of c^i) in G^-. The neighborhood of
    c^i in G is the subgraph of G which contains all vertices of the star and the
    boundary of x, and all edges linking these vertices. The strict neighborhood of
    c^i is the neighborhood of c^i minus c^i and all its incident edges, plus all
    edges (c^{i+1}, c^{i-1}) such that edges (c^{i+1}, c^i) and (c^i, c^{i-1}) exist
    in G.


    # Definition 89 (n-surfaces) [84, 85]


    +   1. An incidence graph is a 0-surface if it is composed by exactly two vertices
    c^0 and c''^0, and no edges;

    +   2. an incidence graph G is an n-surface, n > 0, if it is connected and for
    any vertex c^i, the strict neighborhood of c^i is an (n − 1)-surface.


    Remember that a 0-sphere is a set of two points: the structure of a 0-sphere corresponds
    thus to a 0-surface. The property characterizing an n-surface is a local property
    which has to be satisfied for any vertex of the graph, i.e. for any cell of the
    associated subdivision. The correspondence with n-Gmaps will be explained below.


    Note that the dimension of all main cells is n. Moreover, n-surfaces satisfy the
    following switch property: cf. Figs. 8.16(f) and (g). Let G be an n-surface, to
    which two vertices c^{n+1} and c^{-1} are added, and edges which link c^{n+1}
    with any vertex numbered n, and any vertex numbered 0 with c^{-1}. Then for any
    cells x^i and y^j, b(x^i) ∩ s(y^j) is either empty or made of exactly two elements,
    where b(x^i) (resp. s(y^j)) is the set of vertices numbered i − 1 in the boundary
    of x^i (resp. the set of vertices numbered j + 1 in the star of y^j).


    # Conversion between n-surfaces and connected n-Gmaps without boundary and without
    multi-incidence


    Let S be an n-surface. Let D be the set of all (n+1)-cell tuples (c0, …, cn),
    i.e. such that |(c0, …, cn)| = n + 1: in other words, an (n + 1)-cell tuple corresponds
    to a main simplex in the associated numbered semi-simplicial set. Let t = (c0,
    …, ci, …, cn) ∈ D, with 0 ≤ i ≤ n: due to the switch property, a unique cell tuple
    t'' = (c0, …, c''i, …, cn) exists in D, which shares all cells with t except ci;
    then define switchi(t) = t'' and switchi(t'') = t. It has been shown that G =
    (D, switch0, …, switchn) is a connected n-Gmap which satisfies [5]:'
