    The boundary notion is generalized in Def. 21 in order to define the i-boundary
    map for any n-Gmap. Given an n-Gmap G, the i-boundary map G_{∂_i} is an n-Gmap
    which covers the different i-boundaries of G. More precisely there is a one to
    one mapping between the different i-boundaries of G and the connected components
    of G_{∂_i}.


    # Definition 21 (i-boundary map) Let G = (D, α_0, …, α_n) be an n-Gmap, and i
    ∈ {0, …, n}. The i-boundary map G_{∂_i} = (D'', α''_0, …, α''_n) is the n-Gmap
    defined by:


    +   1. D'' = {d ∈ D | d is i-free};

    +   2. ∀d'' ∈ D'':

    +      • ∀j ∈ {0, …, i−2, i+2, …, n}, α''_j(d'') = α_j(d'');

    +      • α''_{i+1}(d'') = d''; α''_{i+1}(d'') = d'';

    +      • α''_{i−1}(d'') = α_{i−1} ∘ (α_i ∘ α_{i−1})^k(d'')

    +        k being the smaller integer s.t. α_{i−1} ∘ (α_i ∘ α_{i−1})^k(d'') is
    i-free.


    Note that there are two possible cases for the definition of α''_{i−1}(d''). The
    first case is when an i-free dart d'''' ≠ d'' is reached when following the path
    of dart α_{i−1}∘(α_i∘α_{i−1})^k(d''). In this case, α''_{i−1}(d'') = d''''. The
    second case is when an (i−1)-free dart is reached when following the path α_{i−1}∘(α_i∘α_{i−1})^k(d'').
    In this case, the path goes forward until obtaining d'' which is the first i-free
    dart of the path, and α''_{i−1}(d'') = d''. Note also that, by definition, all
    the darts in an i-boundary map are i-free and (i+1)-free.


    Note also that the generalized i-boundary map has the same dimension than the
    initial n-Gmap. This is required for i < n in order to associate correctly during
    the closure operation (cf. Section 6.1 page 185) darts of initial n-Gmap with
    darts of i-boundary map. However this is not required for i = n as there is no
    dimension higher than i.


    This generalized definition of the i-boundary map can be used to retreive the
    classical boundary of an n-Gmap G, when all involutions except α_n are without
    fixed points. First G_{∂_n} is computed, then its dimension is decreased (by definition
    each dart d in G_{∂_n} is such that α_n(d) = d), producing G_∂.


    # Definition 22 (boundary map) Let G be an n-Gmap without boundary except possibly
    for dimension n. The (n−1)-Gmap of the boundaries is G_∂ = G^{−}_{∂_n}.'
