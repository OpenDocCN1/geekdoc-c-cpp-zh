    # CW-complexes


    This paragraph is based on [180].


    Let B̄ⁿ (resp. Bⁿ) denotes an n-dimensional closed (resp. open) ball. In this
    paragraph, an n-dimensional open cell denotes a space which is homeomorphic to
    Bⁿ.


    # Definition 84 (CW-complex) A CW-complex is a space X and a collection of disjoint
    open cells {e_α} whose union is X, such that:


    +   1. X is Hausdorff⁵;

    +   2. for each open n-cell e_α of the collection, there exists a continuous map
    f_α : B̄ⁿ → X that maps Bⁿ homeomorphically onto e_α and carries ∂B̄ⁿ, i.e. the
    boundary of B̄ⁿ, onto a finite union of open cells, each dimension less than n;

    +   3. a set A is closed in X if A ∩ ē_α is closed in ē_α for each α, where
    ē_α denotes the closure of e_α.


    Schematically, a CW-complex is a set of balls “glued” together by continuous attaching
    functions.


