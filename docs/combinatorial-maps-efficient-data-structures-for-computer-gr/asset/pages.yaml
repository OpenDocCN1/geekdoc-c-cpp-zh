    # Definition 48 (1-unsew) Let M = (D, β1, …, βn) be an n-map and d ∈ D be a non
    1-free dart. Let o1 denote ⟨{βi ∘ βj | ∀i, j ∈ {3, …, n}, i < j}⟩(d) and o2 denote
    ⟨β3, …, βn⟩(β1(d)) \ {⟨βi ∘ βj | ∀i, j ∈ {3, …, n}, i < j⟩}(β1(d)). The n-map
