- pgno: 36
  md: 'As far as we know, no book exists, in the field of geometric modeling, computational
    geometry, discrete geometry, computer graphics, image processing and analysis,
    about the representation of subdivided geometric objects. Moreover, many works
    deal with combinatorial maps, for applications in different fields of mathematics
    and computer science: many subclasses of combinatorial maps, related notions and
    operations have been studied. So, a main goal here is to gather important notions
    related to combinatorial maps in a coherent way, suited for the application of
    combinatorial maps in geometric modeling, computational geometry, discrete geometry,
    computer graphics, image processing and analysis, etc.


    # 1.4.2 Outline


    Mainly, two subclasses of combinatorial maps, namely n-Gmaps and n-maps, are here
    studied. The book is organized as follows:


    +   - Chapter 2: first, some basic topological notions and vocabulary are introduced,
    through a presentation of the classification of surfaces; second, some technical
    notions are recalled, related to discrete mathematical structures, as permutations
    and graphs, which are the bases of data structures for representing subdivisions,
    for instance incidence graphs;

    +   - Chapter 3: starting from subdivided geometric objects, it is shown in an
    intuitive way how to deduce formal models, i.e. n-Gmaps and n-maps, for representing
    the structures of the objects;

    +   - Chapters 4 and 5: these chapters are organized in the same way, since they
    are respectively devoted to n-Gmaps and n-maps. All notions related to these structures
    are defined; then, elementary operations are defined, for constructing any n-Gmap
    and n-map. Data structures and iterators are deduced from the mathematical definitions.
    At last, some useful notions are added;

    +   - Chapter 6: basic operations for handling n-Gmaps and n-maps are defined,
    such as the closure of a combinatorial map with boundaries, the removal and contraction
    of cells, and their inverse operations (insertion and expansion); other classical
    operations are also defined, as chamfering, extrusion and triangulation;

    +   - Chapter 7: combinatorial maps have been implemented and used for Geometric
    Modeling and Image Processing purposes; the basics of geometric operations and
    softwares are illustrated for these two application fields;

    +   - Chapter 8: the definitions of simplicial structures are recalled; then cellular
    objects are defined as simplicial objects structured into cells, and different
    subclasses are introduced, mainly cellular quasi-manifolds.'
