    **Definition 24 (Orientable $n$-Gmap)**  An $n$-Gmap $G=(D,\alpha_0,\ldots,\alpha_n)$
    is orientable if $D=E_1\cup E_2$, such that $E_1\cap E_2=\varnothing$, and $\forall
    d\in D,\ \forall i\in\{0,\ldots,n\},\ d$ is not $i$-free $\Rightarrow d$ and $\alpha_i(d)$
