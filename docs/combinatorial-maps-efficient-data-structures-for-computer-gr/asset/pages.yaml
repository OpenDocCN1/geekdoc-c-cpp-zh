  md: 'corresponds to the 3-sew operation, producing the 3-map shown in (d): it corresponds
    to the 3D subdivided object shown in (h).


    The inverse operations can be applied in order to destroy a given n-map: this
    corresponds exactly to the decomposition process described for the intuitive presentation
    of n-maps (cf. Section 3.1). First, n-unsew operations are applied until having
    all the darts n-free, then the dimension of the n-map is decreased. This process
    is iterated until obtaining in 1D a set of darts on which β₁ is equal to ∅. As
    examples of this “destruction process”, we can consider the examples given for
    the construction process in reverse direction (cf. Figs. 5.10 and 5.11), and apply
    i-unsew (resp. decrease dimension) operations instead of i-sew (resp. increase
    dimension) operations.


    # 5.3.2 Construction Directly in a Given Dimension


    The second basic construction method consists in working directly in dimension
    n. Starting with an empty n-map, the operation which adds an isolated dart is
    applied as many times as necessary. Next, any i-sew operation can be applied,
