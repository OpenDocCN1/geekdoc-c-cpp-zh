    orientable condition. In the second case, this is not possible: for instance,
    if $E_1=\{1,3,5,7\}$ and $E_2=\{2,4,6,8\}$, these two sets satisfy the orientable
    condition for $\alpha_0$ and $\alpha_1$, but not for $\alpha_2$ because $\alpha_2(3)=7$,
    and darts 3 and 7 both belong to $E_1$. Any other pair of sets $E_1$ and $E_2$
    does not satisfy the orientable condition for $\alpha_0$ or $\alpha_1$. We will
    see in Section 5.5.2 page 178 how to compute an orientation of any orientable
    $n$-Gmap.


