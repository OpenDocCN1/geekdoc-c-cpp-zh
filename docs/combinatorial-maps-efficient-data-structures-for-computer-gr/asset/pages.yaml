    easily find such images), and knows that different anatomical parts can be distinguished.
    In order to examine brain diseases, 3-dimensional brain images are analyzed: an
    important task consists in identifying the anatomical parts, in order to extract
    information about them. This task is the image segmentation. Then, one can be
    interested in constructing a representation of the segmented (i.e. subdivided)
    brain in order, for instance, to simulate a surgical procedure.


    +   - study of spatially distributed data: subdivisions can be constructed in
    order to study various phenomena. For instance, let P = {p1, …, pn} be a set of
    points in the Euclidean plane (these points are called sites). The Voronoï face
    associated to pi contains any point of the plane whose distance to pi is less
    or equal to its distance to any other site (note that a Voronoï face is a convex
    polygon). A Voronoï edge contains points which are equidistant to their two nearest
    sites, and a Voronoï vertex is a point which is equidistant to three (or more)
    nearest sites. This defines a subdivision of the Euclidean plane, the Voronoï
    diagram (cf. Fig. 1.3(a)), which is a basic tool for many applications, for intense
    in epidemiology, meteorology, etc.


    So, roughly speaking, a subdivided geometric object is composed by cells of different
    dimensions (vertices, edges, faces, volumes, etc.), and structural relations exist
    between these cells, since the boundary of a cell is made of cells of lower dimensions.
    For instance, a cell and a cell of its boundary are said to be incident; two cells
    with the same dimension are adjacent if they are both incident to a third cell.


    The general framework of this book is the study of data structures for the explicit
    representation of subdivided geometric objects, and operations for'
