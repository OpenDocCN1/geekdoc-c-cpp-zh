    be $i$-free, so all the darts in $o_d$ and $o_{d''}$ are also $i$-free since $\alpha_i\circ\alpha_j$
    are involutions when $|i-j|\geq 2$. $d$ and $d''$ must be different (otherwise
    nothing will be changed by the $i$-sew). At last, note that it is possible that
    $o_d=o_{d''}$: the corresponding sew will create folded cells (see Section 4.3).


    Note that any pair of free darts is always sewable in any 0-Gmap and in any 1-Gmap.
    Indeed in these cases, orbits $o_d$ and $o_{d''}$ contain only one dart, and the
    set $\{0,\ldots,i-2,i+2,\ldots,n\}$ is empty. This means that we can sew without
    precondition any pair of free darts in any 0-Gmap and in any 1-Gmap.


    The notion of being $i$-sewable is used to define the $i$-sew operation in Def.
    19. After applying the $i$-sew operation, all the darts in $o_d$ and $o_{d''}$
    are linked by $\alpha_i$. This implies the identification of the two $(i-1)$-cells
    containing darts $d$ and $d''$. Moreover, several other cells can be identified
    i.e. the $j$-cells incident to the two identified $(i-1)$-cells, with $j\in\{0,\ldots,i-2,i+1,\ldots,n\}$
    (cf. below for some examples).


    # **Definition 19** *(i-sew)*


    Let $G=(D,\alpha_0,\ldots,\alpha_n)$ be an $n$-Gmap, $i\in\{0,\ldots,n\}$, $d,d''\in
    D$ such that $d$ and $d''$ are $i$-sewable by the isomorphism $f$ of Def. 18.
    The $n$-Gmap obtained from $G$ by the $i$-sewing of $d$ and $d''$ is $G_{i\text{-}sew}(d,d'')=(D,\alpha_0,\ldots,\alpha_{i-1},\alpha''_i,\alpha_{i+1},\ldots,\alpha_n)$,
    where $\alpha''_i$ is defined by: $\forall e\in D$,


    +   - if $e\in o_d$, $\alpha''_i(e)=f(e)$;

    +   - if $o_d\neq o_{d''}$ and $e\in o_{d''}$, $\alpha''_i(e)=f^{-1}(e)$;

    +   - otherwise, $\alpha''_i(e)=\alpha_i(e)$.


    Given an $n$-Gmap and two $i$-sewable darts, the $i$-sewing operation consists
    simply in linking all the darts in $o_d$ with their “equivalent” darts in $o_{d''}$.
    More precisely, $\alpha''_i$ is directly given by $\alpha_i$ and isomorphism $f$.
    So, the $i$-sew of $d$ and $d''$ produces the same $n$-Gmap than the $i$-sew of
    any dart $d''''$ of $o_d$ and $f(d'''')$ of $o_{d''}$.


