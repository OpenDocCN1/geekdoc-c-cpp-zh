    # 9.2.5 Nef Polyhedron


    A n-dimensional Nef-polyhedron is defined as the set of points in ℝⁿ generated
    by a finite number of intersection and complement operations of open halfspaces.
    So, Nef polyhedra can be n-dimensional manifolds with or without boundary, or
    non-manifolds mixing different dimensional parts. They were first defined by the
    mathematician W. Nef [182, 24]. Data structures, algorithms and implementation
    are described in [131], and [130] provides a free available implementation in
    3D.


    The main interest of Nef-polyhedron is to be closed for Boolean operations, which
    are set union, set intersection, set difference, set complement, interior, exterior,
    boundary, closure. The main difference between Nef-polyhedra and other data structures
    introduced in this chapter is the fact that the definition of Nef-polyhedra is
