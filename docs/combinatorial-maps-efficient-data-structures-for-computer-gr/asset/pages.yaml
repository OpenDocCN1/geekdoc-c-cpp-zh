    # 7.2.2  Geometric Operations


    Several combinatorial operations for handling *n*-Gmaps have been presented in
    Section 4.4 and chapter 6 (pages 108 and 185). These operations must be modified
    for handling embedded *n*-Gmaps in order to update accordingly the embeddings.
    Hopefully, this can be done easily, due to the distinction between the topology
    of the object and its embedding. Indeed, darts and α links correspond to the topology
    of the object, while the set of geometrical points correspond to the embedding.
    As illustrated in the following, operations can deal only with the topology, only
    with the embedding or simultaneously with both.


    Generally when a vertex is modified, the associated geometrical point must also
    be modified. Operations modifying vertices in an *n*-Gmap are: the creation of
    a new vertex; the destruction of an existing vertex; the merging of several vertices;
    the split of one vertex. The corresponding embedding operations are: the creation
    of a new geometrical point; the deletion of the associated geometrical point;
    the removing of all the geometrical points except one; the duplication of the
    geometrical point. Note that some combinatorial operations do not involve embedding
    modification. This is for example the case of the *i*-close operation, for *i*
    > 0 (see Section 6.1 page 185). Indeed, this operation does not create new darts
    and there is no merge nor split of existing vertices. The new darts created by
    the operation are linked with existing darts, so they will belong to existing
    vertices. All resulting vertices corresponds to initial vertices and their embeddings
    are not modified.


