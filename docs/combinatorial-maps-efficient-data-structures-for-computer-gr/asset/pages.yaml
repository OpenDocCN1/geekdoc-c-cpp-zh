    The radial-edge data structure was defined in [215] as an extension of the winged-edge
    data structure, in order to represent 2D non-manifolds, i.e. 2-dimensional complexes:
    remember that a 2-dimensional complex can be constructed by adding isolated i-cells,
    for 0 ≤ i ≤ 2, and by identifying isomorphic j-cells, for 0 ≤ j ≤ 1. So, more
    than two faces can be incident to the same edge; vertices or edges can exist,
    such that they are not incident to a face.


    The main notion of a radial-edge data structure is the edge-use element. Let (f,
    e) be any pair of incident face and edge. Two edge-use elements are associated
    with (f, e). More precisely, remember that f can be oriented by defining a coherent
    orientation of its incident edges; then each edge-use associated with (f, e) corresponds
    to a possible coherent orientation of f and e.


    Several relations are defined on edge-use elements. Let f be a face and e be an
    edge incident to f:


