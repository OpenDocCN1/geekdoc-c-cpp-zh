    # Operations


    Any semi-simplicial set can be constructed, starting from an empty semi-simplicial
    set, by the three following operations (cf. Fig. 8.5). Let S = (K = (⋃_{i=0}^n
    K_i), (d_j)_{j=0,...,n}) be an n-dimensional semi-simplicial set:


    +   1. adding a new 0-simplex to K₀;


    +   2. creating a cone: let v be a 0-simplex of K₀, and K′ be a subset of K such
    that (K′, (d_j/K′)) is a semi-simplicial set. Let K″ be a set of simplices, such
    that a bijection φ exists between K′ and K″. More precisely, for 0 ≤ j ≤ n, φ
    associates j-simplices of K′ and (j + 1)-simplices of K″. Then, for any j-simplex
