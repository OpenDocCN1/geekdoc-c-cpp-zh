    +   - the formal links between combinatorial maps and ordered models, combinatorial
    maps and incidence graphs, combinatorial maps and simplicial structures, are well-known;
    it is thus possible to conceive conversion operations between all these structures.


    # 1.4.1 Some Historical Milestones


    The concept of combinatorial map has first been defined and studied in mathematics,
    more precisely in the field of combinatorics. Originally, a map on a surface is
    a cell decomposition of a surface. In his paper “Combinatorial maps” [212], Vince
    wrote:


    > “The classical approach to maps is by cell decomposition of a surface. A more
    recent approach, by way of graph embedding, is taken by Edmonds [103], Tutte [207],
    and others. Our intention is to formulate a purely combinatorial generalization
    of a map, called a combinatorial map. ...”


    So, in the middle of the 1980s, combinatorial maps corresponding to 2-maps, 2-Gmaps
    and n-Gmaps were known, and also their relations with subdivisions of cellular
    objects.


    Independently, data structures have been defined in geometric modeling, computational
    geometry, computer graphics, computer vision and image processing for representing
    cellular objects. The first one is the winged-edge data structure, defined in
    the middle of the 1970s by Baumgart, for computer vision purposes [17]. This structure
    has been proved to be equivalent (but not similar in its definition) to 2-maps.


    In the middle of the 1980s, several structures were defined, equivalent (and similar
    in their definition) to 2-maps and 2-maps, 2-Gmaps and 3-Gmaps, since people were
    interested in handling subdivisions of 2D and 3D cellular objects. At the end
    of 1980s, structures were proposed, equivalent to n-Gmaps and n-maps, for the
    representation of generalizations of surfaces for any dimension.


    At the end of the 1980s and during the 1990s, many works dealt with the definition
    of data structures for representing “non-manifold” objects, i.e. complex cellular
    objects, chains of maps [104] being one representative structure of the results
    of these works.'
