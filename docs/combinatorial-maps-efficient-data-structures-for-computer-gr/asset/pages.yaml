  md: '![](img/6ba3cf72cbe3568e76a174448323bb33_242_0.png)


    # FIGURE 6.32


    2-contraction for 2-map.


    +   - (a) 2-map M.

    +   - (b) 2-map M_{C2}({1,2}).


    So, β₂''(3) = 7 and β₂''(7) = 3. Face {1,2} is contracted and its two incident
    edges are merged.


    The contractibility condition is defined in Def. 65. This definition is the direct
    transposition of the same definition for n-Gmaps. The only difference is the use
    of β_{i-2}^{-1} instead of α_{i-2}; this is important for i = 2 and i = 3, since
    β₁ is a partial permutation.


    # Definition 65 (contractible cell)


    An i-cell C in an n-map M = (D, β₁, …, βₙ) is contractible if:


    +   - i = 1;

    +   - or 1 < i ≤ n, and ∀d ∈ C, β_{i-1} ∘ β_{i-2}(d) = β_{i-2}^{-1} ∘ β_{i-1}(d).


    Note that when i = 2, this condition becomes β₁ ∘ β₀(d) = β₁ ∘ β₁(d). Thus a face,
    i.e. a 2-cell, is contractible if each of its darts is either a loop, i.e. it
    is linked with itself by β₁, or belongs to a cycle of two darts linked by β₁.
    Indeed, all other configurations are prohibited by this condition.


    The i-contraction operation, for i ≥ 2, is defined in Def. 66.


    # Definition 66 (cell contraction)


    Let M = (D, β₁, …, βₙ) be an n-map, and C be a contractible i-cell, i ≥ 2. Let
    D^S = βᵢ(C) \ C. The n-map resulting from the i-contraction of C in M is M_{Cᵢ}
    = (D'', β₁'', …, βₙ''), defined by:


    +   - D'' = D \ C;

    +   - ∀j ∈ {1, …, n}, j ≠ i, βⱼ'' = βⱼ|_{D''};

    +   - ∀d ∈ D'' \ D^S, βᵢ''(d) = βᵢ(d);

    +   - ∀d ∈ D^S, βᵢ''(d) = (βᵢ ∘ β_{i-1})ᵏ ∘ βᵢ(d), k being the smaller positive
    integer s.t. (βᵢ ∘ β_{i-1})ᵏ ∘ βᵢ(d) ∉ C.'
