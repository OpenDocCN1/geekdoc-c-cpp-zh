    A 0-Gmap (D, α₀) represents the structure (the topology) of a set of isolated
    vertices, or pairs of vertices (corresponding thus to 0-spheres); a 1-Gmap (D,
    α₀, α₁) represents the structure of a set of polygonal curves with or without
    boundaries (cf. Fig. 4.1(a)); a 2-Gmap (D, α₀, α₁, α₂) represents the structure
    of a set of surfaces (cf. Fig. 4.1(b)); a 3-Gmap (D, α₀, α₁, α₂, α₃) represents
    the structure of assemblies of volumes (cf. Fig. 4.1(c))...


    As seen before, darts can be linked with themselves for some involutions when
    describing objects with boundaries. Dart d is i-free if it is linked with itself
    by αᵢ, and it is i-sewn otherwise (cf. Def. 2 and example in Fig. 4.2).


    # Definition 2 (i-free, i-sewn) Let G = (D, α₀, …, αₙ) be an n-Gmap, d ∈ D, and
    i ∈ {0, …, n}:


    +   - d is i-free if αᵢ(d) = d;

    +   - d is i-sewn with dart d₂ ∈ D if αᵢ(d) = d₂ and d ≠ d₂.


    When a dart is free for an involution, it is a fixed point for this involution.


    For practical applications, it may be useful to handle objects with boundaries.
    Usually, a 3-dimensional subdivided object embedded into the usual 3-dimensional
    Euclidean space has 2-dimensional boundaries, which are surfaces without boundaries:
    it is composed by volumes, which boundaries are also surfaces without boundaries.
