    high level operations of 2D image processing.


    # 7.3.3 Operations


    # 7.3.3.1 Topological Map Construction


    The first operation defined is the construction of a 2D topological map from a
    2D labeled image. Algorithm 75 implements an incremental solution, which mainly
    consists in iterating through all the pixels of the image line by line, in creating
    a square associated with the current pixel and, depending on the local configuration,
    in removing the two edges to the left and to the up of the current pixel and the
    vertex to the left and up corner of this pixel. During the scan line of the image,
    last denotes the dart to the left of the current pixel and up the dart to the
    up. An important invariant is the fact that the 2-map describing the pixels smaller
    than the current pixel (according to lexicographic order) is already build. This
    invariant is required to 2-sew the square corresponding to the current pixel to
    the former 2-map.'
