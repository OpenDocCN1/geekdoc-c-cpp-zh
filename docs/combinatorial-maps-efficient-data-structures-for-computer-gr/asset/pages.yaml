    # 6.1.2 For n-maps


    The i-closure operation, for i ≥ 2, is defined in Def. 56 for an n-map M. As for
    n-Gmaps, new darts are created, one for each i-free dart in M; these darts are
    linked between them for βⱼ, ∀j ∈ {1,…,n}, j ≠ i, according to the corresponding
    links in the inverse of the i-boundary map M∂ᵢ (cf. Def. 49 page 175); each new
    dart is linked by βᵢ with its corresponding dart in M.


    # Definition 56 (i-closure) Let M = (D, β₁,…,βₙ) be an n-map, i ∈ {2,…,n}, and
    M∂ᵢ⁻¹ = (D′, β₁′,…,βₙ′) be the inverse of the i-boundary map of M. The i-closure
    of M is the n-map Mᵢ-close = (D″, β₁″,…,βₙ″) defined by:


    +   1. D″ = D ∪ {d₁″,…,d″_{|D′|}}, where {d₁″,…,d″_{|D′|}} is a set of new darts,
    such that a bijection f maps D′ onto {d₁″,…,d″_{|D′|}};

    +   2. ∀j ∈ {1,…,n} s.t. j ≠ i:

    +      • ∀d ∈ D, βⱼ″(d) = βⱼ(d);

    +      • ∀d′ ∈ D′, βⱼ″(f(d′)) = f(βⱼ′(d′));

    +   3. ∀d ∈ D \ D′, βᵢ″(d) = βᵢ(d);

    +   4. ∀d′ ∈ D′, βᵢ″(d) = f(d), βᵢ″(f(d)) = d.


