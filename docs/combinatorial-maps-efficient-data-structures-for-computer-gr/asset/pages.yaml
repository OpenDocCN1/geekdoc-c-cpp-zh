    # 4.5.2 Duality


    Duality is a classical notion that, for geometrical objects, is the link between
    two objects having similar structure, but regarding their dimensions in reverse
    order. A classical example is a planar graph embedded in a plane, which describes
    vertices, edges and faces. Its dual graph, embedded also in the plane, is a planar
    graph where each vertex (resp. edge, face) corresponds to a face (resp. edge,
    vertex) of the initial graph. Another classical example is the Delaunay subdivision
    of a set of points which is the dual of the Voronoï subdivision of the same set
    of points.'
