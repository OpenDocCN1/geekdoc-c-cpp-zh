  md: '# ## 9


    # Comparison with Other Cellular Data Structures


    In this chapter, *n*-maps and *n*-Gmaps are compared with related cellular data
    structures. Many different data structures have been proposed in order to describe
    subdivided objects. They can be classified according to:


    +   - the dimension of the represented objects;

    +   - the topological properties of the represented objects: non-manifold, pseudo-manifold,
    quasi-manifold, orientable, nonorientable...

    +   - the type of cells: regular cells, as triangles (and more generally simplices),
    quadrangles (and more generally cubes, simploids), general cells...


    Remember that *n*-maps allow to represent *n*-dimensional orientable quasi-manifolds
    with general cells, and *n*-Gmaps allow to represent *n*-dimensional orientable
    and nonorientable quasi-manifolds with general cells. Thus, we limit in this chapter
    the comparison with data structures corresponding to these two classes (see also
    for instance [164, 208]). A more general discussion is conducted in the next chapter
    10.


    Schematically, the first work about data structures for representing subdivided
    geometric objects is the definition of the *winged-edge* data structure by Baumgart
    at the beginning of the 1970s [17]. Then, during the 1980s, many works in geometric
    modeling and computational geometry dealt with the definition of data structures
    for representing orientable (quasi-)manifolds without boundaries, then general
    (quasi-)manifolds, for dimension 2, then dimension 3, at last dimension *n* (cf.
    next section). At the end of the 1980s and during the 1990s, many data structures
    for representing complexes have been conceived, from dimension 2 to dimension
    *n* (see for instance [102, 195, 216, 104, 159]).


    In parallel, several authors studied data structures and operations for representing
    simplicial objects (e.g. [90]). Some ideas, as the representation of adjacency
    relations between *n*-cells, when handling *n*-dimensional quasi-manifolds, were
    applied for simplicial structures as for cellular structures (see for instance
    [183]).


    Note that during the 1990s and 2000s, the definition of subclasses close to manifolds
    was a subject of great interest, for simplicial structures, incidence graphs and
    ordered cellular structures (see for instance [89, 91, 85, 39, 165]).'
