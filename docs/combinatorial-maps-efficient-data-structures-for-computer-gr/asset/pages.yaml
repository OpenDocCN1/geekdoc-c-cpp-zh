    **Input:** gm: an $n$-Gmap;


    $d,d'' \in$ gm.Darts: two i-sewable darts;


    $i \in \{0,\ldots,n\}$.


    **Result:** i-sew darts d and d’.


    ```text

    1  it ← generic iterator(gm,d,(0,...,i−2,i+2,...,n));

    2  it’ ← generic iterator(gm,d’,(0,...,i−2,i+2,...,n));

    3  while it is not to its end do

    4      it.Alphas[i] ← it’;

    5      it’.Alphas[i] ← it;

    6      advance it to its next position;

    7      advance it’ to its next position;

    ```

    ```


    The key point of this algorithm is the use once again of the two generic iterators
    $(\mathrm{gm},d,(0,\ldots,i-2,i+2,\ldots,n))$ and $(\mathrm{gm},d'',(0,\ldots,i-2,i+2,\ldots,n))$
    to iterate through the two orbits by using the same $\alpha$ links. Since we know
    that $d$ and $d''$ are $i$-sewable, and since the generic iterator uses the indexes
    given in the sequence in the same order, at each step of the while loop, the two
    iterators point to two darts in relation by isomorphism $f$ of Def. 19. For this
    reason, we only need to put the two pointed darts in relation by $\alpha_i$, then
    move the two iterators to their next positions. Note that the relation is done
    in both directions as $\alpha_i$ is an involution. The algorithm ends when the
    two iterators reach their end positions.'
