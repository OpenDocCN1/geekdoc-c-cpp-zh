    # ### 9.3.2  Facet-edge


    The *facet-edge* structure [93] is the 3D extension of the quad-edge structure.
    Let *f* be a face and *e* be an edge of a 3D manifold. Two coherent cycles of
    edges can be associated with *f*, corresponding to its two orientations. Similarly
    (and by duality), two coherent cycles of faces can be associated with *e*, according
    to the chosen direction of rotation around *e*. Intuitively, the basic element
    of the facet-edge structure is the facet-edge pair **a = (e, f)**, where face
    *f* is incident to edge *e*. Four facet-edge elements correspond to a facet-edge
    pair, depending on the two directions of the rings around *e* and *f*.


    Four functions are defined on the facet-edge elements: *fnext* gives the next
    facet-edge element in the facet-ring, i.e. the facet-edge element with the same
    edge and the next facet; *enext* gives the next facet-edge element in the edge-ring,
    i.e. the facet-edge element with the same facet and the next edge; *rev* corresponds
    to the same facet-edge pair, but considering the facet with its opposite direction;
    *clock* corresponds to the same facet-edge pair, but considering the edge and
    the facet with their opposite directions. Moreover the dual is also described;
    thus, each facet-edge element is associated with its dual, thanks to the *dual*
    function.


    The facet-edge structure allows to represent orientable and nonorientable 3D quasi-manifold
    without boundary. It is equivalent to 3-Gmaps, when a 3-Gmap and its dual are
    simultaneously represented: cf. Table 9.6.'
