  md: 'This segmentation algorithm is generic, because it is guided by Oracle which
    can be any user defined function. In the following, different oracles are defined
    for gray level images, but similar functions can be defined for color images.
    A first simple oracle is defined in Algorithm 80, by using the mean gray level
    of each region, and allowing to merge two regions if the distance between their
    two mean gray levels is smaller than a given threshold τ defined by the user.


    # Algorithm 80: criterionMeanGray(d): merging criterion based on mean gray level


    Input: d: a dart.

    Result: true iff d.Region and d.Betas[2].Region must be merged.

    1 R1 ← d.Region; R2 ← d.Betas[2].Region;

    2 dist ← |R1.mean_gray − R2.mean_gray|;

    3 return dist < τ;


    This criterion is computed by adding the sum of all the pixel gray levels and
    the size of each region to the information associated with each region. Thanks
    to these two values, the mean gray level of each region is computed in constant
    time. These two values can be computed directly during the construction algorithm
    (Algorithm 75). Moreover they can be updated incrementally in constant time when
    two regions are merged (line 2 of Algorithm 78).


    The main advantage of this criterion is its simplicity. However it does not produce
    very good segmentation results. A better solution is proposed in [105] using external
    and internal contrasts. e.ext is the external contrast associated with each edge
    e of the topological map. It is the minimal gray level difference between two
    4-adjacent pixels separated by a linel belonging to edge e. R.int is the internal
    contrast associated with each region R of the topological map. It is the maximal
    gray level difference between two pixels belonging to the minimal spanning tree
    of pixels in R. Intuitively, R.int is the maximal value separating two pixels
    in R according to minimum paths linking these pixels (minimum in term of gray
    value differences).


    The external contrast can be initialized during the construction algorithm. When
    a new edge is created, its external contrast is initialized as the gray value
    difference of the two pixels separated by the edge. When a vertex is removed,
    the two incident edges are merged and the external contrast of the resulting edge
    is updated by keeping the minimum value of the two initial edges. The internal
    contrast can also be initialized and updated during the segmentation algorithm.
    Indeed, R.int is equal to 0 if all the pixels in R have the same gray level value,
    and R1''.int = e.ext when two regions R1 and R2 are merged along edge e, e being
    the edge with the smallest external contrast separating the two regions.


    Thanks to these contrasts, we can decide if two regions must be merged or not
    using Algorithm 81. Given a dart d belonging to the edge with the smallest'
