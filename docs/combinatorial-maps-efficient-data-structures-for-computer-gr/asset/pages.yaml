    # 6.1.1   For $n$-Gmaps


    The $i$-closure operation for an $n$-Gmap $G$ is defined in Def. 55. It consists
    in creating new darts, one for each $i$-free dart in $G$. Then, the new darts
    are linked between them by $\alpha_j$, $\forall j \in \{0, \ldots, n\}$, $j \ne
    i$, by using the corresponding links in the $i$-boundary map $G_{\partial i}$
    (cf. Def. 21 after 124); each new dart is linked by $\alpha_i$ with its corresponding
    dart in $G$.


    > **Definition 55** *(i-closure)*  Let $G = (D, \alpha_0, \ldots, \alpha_n)$ be
    an $n$-Gmap, $i \in \{0, \ldots, n\}$, and $G_{\partial i} = (D'', \alpha''_0,
    \ldots, \alpha''_n)$ be the corresponding $i$-boundary map. The $i$-closure of
    $G$ is the $n$-Gmap $G_{i\text{-close}} = (D'''', \alpha''''_0, \ldots, \alpha''''_n)$
    defined by:


    +   1. $D'''' = D \cup \{d''''_1, \ldots, d''''_{|D''|}\}$, where $\{d''''_1,
    \ldots, d''''_{|D''|}\}$ is a set of new darts, such that a bijection $f$ maps
    $D''$ onto $\{d''''_1, \ldots, d''''_{|D''|}\}$.

    +   2. $\forall j \in \{0, \ldots, n\}$ s.t. $j \ne i$:

    +      - $\forall d \in D$, $\alpha''''_j(d) = \alpha_j(d)$;

    +      - $\forall d'' \in D''$, $\alpha''''_j(f(d'')) = f(\alpha''_j(d''))$.

    +   3. $\forall d \in D \setminus D''$, $\alpha''''_i(d) = \alpha_i(d)$;

    +   4. $\forall d'' \in D''$, $\alpha''''_i(d'') = f(d)$, $\alpha''''_i(f(d))
    = d$.


    The links between $D'''' \setminus D$ (i.e. the new darts) and $D''$ (i.e. the
    darts of $i$-boundaries of $G$) are defined through the bijection $f$. Note that
    any bijection between the two sets of darts can be considered, as the order of
    the new darts has no importance. Note also that $D'' \subseteq D$, by definition
    of boundary map: this explains why new darts are added to $D$ and linked with
    $D''$.


    The 1-closure operation is illustrated in Fig. 6.1. Starting from the 1-Gmap with
    boundary depicted in (a), the 1-Gmap shown in (b) is obtained by applying the
    1-closure operation; note that this 1-Gmap has no boundary. In the initial 1-Gmap,
    there are two 1-free darts (numbered 1 and 6); thus two new darts (numbered 7
    and 8) are created; moreover, $f(6)$ (resp. $f(1)$) is arbitrarily set to 7 (resp.
    8). As the two darts 1 and 6 are 0-sewn in the 1-boundary map $G_{\partial 1}$,
    the corresponding darts 7 and 8 are also 0-sewn in $G_{1\text{-close}}$: $\alpha''''_1(1)=8$
    (resp. $\alpha''''_1(6)=7$), since $f(1)=8$ (resp. $f(6)=7$).


    Another example of the 1-closure operation is presented in Fig. 6.2; it is here
    applied to a 3-Gmap. In this example, four darts, namely 1, 6, 7 and 12, are 1-free
    darts; thus four new darts are created, numbered 13, 14, 15 and 16, and are respectively
    associated with 1, 6, 7 and 12 by bijection $f$. As darts 1 and 6 are 0-sewn in
    the 1-boundary map $G_{\partial 1}$, the corresponding darts 13 and 14 are also
    0-sewn in $G_{1\text{-close}}$ (this is similar for darts 7 and 12, and the corresponding
    darts 15 and 16). Moreover, as 6 and 12 are 3-sewn in the'
