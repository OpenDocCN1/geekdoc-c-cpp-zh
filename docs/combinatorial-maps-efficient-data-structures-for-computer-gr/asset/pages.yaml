  md: '+   3. the space/time costs of structures and operations.


    Given a class C of subdivisions (e.g. quasi-manifolds), a structure S_L corresponding
    to a larger class L (e.g. cellular complexes) uses generally more memory space
    than an optimized structure S_C corresponding to C: this corresponds to the fact
    that some information is explicit within S_L, and implicit within S_C.


    It is clear that the time complexity of operations has also to be taken into account:
    when some operations often need to make explicit some implicit information, a
    less efficient model (according to space complexity) could be a better choice.
    For instance, it is possible to represent a polyhedron by a list of faces, but
    adjacency and incidence relations are thus not explicitly represented; so, this
    representation is often not efficient when constructing objects, since adjacency
    and incidence information are used by many construction operations. Conversely,
    many algorithms do not need all information contained in the whole geometric data
    structures, and specialized structures can be a better choice [190] (e.g. a list
    of faces for some rendering algorithms).


    +   4. the cost of operation conception.


    For instance, the definitions of several structures do not take into account the
    constraints of consistency which have to be satisfied by the represented objects
    (e.g. an edge incident to three vertices can be represented by an incidence graph).
    The construction process has thus to control the object validity. For instance,
    Euler operators have been defined in order to construct any subdivision of any
    orientable surface without boundary [173, 171]: each operator simultaneously creates
    or removes several cells; so, the conception of Euler operators for handling incidence
    graphs, even if not complicated, is not so easy than the conception of other basic
    operations defined for handling structures in which the constraints of consistency
    are directly taken into account, e.g. inserting a dart and sewing for n-Gmaps.
    Moreover, Euler operators have never been generalized for constructing n-dimensional
    quasi-manifolds; is it inefficient, difficult or both?


    So, it is clear for us that “one best structure” does not exist, but some structures
    can be well suited for particular processes. Thus, conversion algorithms which
    can be deduced from the general frame presented in this book are very important
    for practical purposes.


    # Combinatorial maps


    When cellular objects have to be handled for some reason (“nature” of represented
    objects, or specificities of operations), we think that combinatorial maps are
    a good starting point for the design of a data structure:


    +   1. consistency properties are taken into account in the very definition'
  merge: -1
  img_proc: true
- pgno: 378
  md: "of combinatorial maps. For instance, any *n*-GMap represents a *n*-dimensional\
    \ quasi-manifold. So, any operation constructing an *n*-GMap construct a valid\
    \ quasi-manifold; it is not necessary to control its validity through Euler operators,\
    \ for instance;\n\n+   2. few basic operations make it possible to construct any\
    \ combinatorial map. It is possible to conceive many low- or high-level operations,\
    \ in order to satisfy different construction needs for various applications, and\
    \ to prove the validity of these operations;\n\n+   3. local operations can be\
    \ defined, for carefully controlling the modifications of the object during its\
    \ construction. Global operations have also been defined, based on these local\
    \ operations, for instance for different processes related to geometric modeling,\
    \ computational geometry, discrete geometry, computer graphics, image processing\
    \ and analysis;\n\n+   4. optimized structures can be defined for the efficient\
    \ representation of subclasses of cellular subdivisions. Since the structures\
    \ are close to each other, it is possible to:\n+   \n+   - either reuse for a\
    \ structure parts of a software conceived for another structure;\n+   - either\
    \ conceive the software in order to efficiently implement several structures;\n\
    \n+   5. combinatorial maps are based on a single type of elements, i.e. the darts,\
    \ and functions between darts satisfying clear and simple consistency constraints.\
    \ This simplifies the implementation of related data structures and algorithms.\n\
    \nFor representing subdivisions of the plane, and more generally surface subdivisions,\
    \ 2-maps and 2-Gmaps correspond to the kernel of other well-known data structures.\
    \ This makes it possible to clearly distinguish the structure information from\
    \ the shape information or redundant information added for optimizing some processes.\
    \ Based on combinatorial maps, several implementations have been proposed, including\
    \ more or less explicit information, in order to get efficient data structures.\n\
    \nAdvantages of combinatorial maps increase for higher dimensions, since defining\
    \ specific data structures becomes more difficult. It is thus possible to safely\
    \ conceive many local and global construction operations, operations for computing\
    \ topological properties, and to deduce efficient implementations for different\
    \ types of (linear or curved) embeddings.\n\nMore specifically, both *n*-maps\
    \ and *n*-Gmaps correspond to quasi-manifolds with or without boundary, but *n*-maps\
    \ represent orientable quasi-manifolds while *n*-Gmaps can also represent nonorientable\
    \ ones. However the two structures have their one advantages, and the choice of\
    \ one"
  merge: -1
  img_proc: true
- pgno: 379
  md: 'of them depends on the needs of your specific application. For instance, the
    definition of $n$-Gmaps is “homogeneous”, since all functions are involutions.
    This simplifies the definitions of related notions and the conception of algorithms.
    The definition of $n$-maps is more complex since $\beta_1$ is a partial permutation
    while other $\beta_i$ are partial involutions. However $n$-maps use twice less
    darts than $n$-Gmaps for representing an orientable object. Thus if memory footprint
    is a crucial criterion for your application, and if only orientable objects are
    handled, using $n$-maps is perhaps a better solution. But if nonorientable objects
    are handled, or if you want to simplify the implementation of operations by avoiding
    special cases, which are sometimes complex, using $n$-Gmaps is perhaps a better
    solution.


    # Some references about $n$-Gmaps and $n$-maps


    $n$-maps and $n$-Gmaps are used for many different works in geometric modeling,
    computational geometry, discrete geometry, computer graphics, image processing
    and analysis, for instance:


    +   - 2D and 3D image segmentation and processing: segmentation [36, 16, 95, 40,
    110, 42, 41, 33, 32, 35, 19, 34, 20, 26, 144, 31, 43, 63, 66, 25, 175, 67, 59,
    99, 98, 14, 73], discrete operations [81, 82, 100], robust region filling [65],
    contour approximation [68, 69], deformable model [101, 75, 74];

    +   - definition of hierarchical models based on combinatorial maps, and use of
    these hierarchical models for different applications: [44, 46, 45, 198, 199, 72,
    200, 197, 147, 112, 118, 121, 148, 113, 122, 120, 119, 210, 209];

    +   - definition of comparison tools of combinatorial maps: isomorphism and subisomorphism
    [71, 70, 83, 202], combinatorial map signature [123, 124], frequent submap discovery
    [124], edit distance [51, 52, 213, 53];

    +   - definition of generic operations: removal and contraction [77, 72, 112,
    113], insertion and expansion [13], chamfering [156], compression [190, 106],
    thickening [28], cartesian product [166];

    +   - computation of topological invariants: incremental Euler-Poincaré characteristic
    [80], canonical polygonal schema [64], Betti numbers and homologie groups [78,
    187, 79, 6, 188, 76];

    +   - geometric modeling for geology, architecture, etc. [21, 7, 29, 30, 114,
    126, 135, 136, 11];

    +   - animation and simulation for computer graphics: [205, 27, 201, 160, 161,
    177, 176, 22, 138, 23, 111].


    Several libraries implement some combinatorial maps and high level operations,
    for instance:'
  merge: -1
  img_proc: true
- pgno: 380
  md: '+   - the “Combinatorial maps” package in CGAL [61] is a generic implementation
    of *n*-maps, the “Linear cell complexes” package [62] is the embedding layer;

    +   - CGoGN [149] is a library implementing *n*-maps and *n*-Gmaps, and hierarchical
    structures deduced from them, for *n* = 1, 2, 3;

    +   - Girl [117] is a 2D image processing software based on 2-maps;

    +   - MoKA [211] is a geometrical modeler based on 3-Gmaps.


    Note that these libraries implement *n*-maps or *n*-Gmaps for different *n* and
    various uses, depending on the specific needs of the addressed applications. This
    illustrates once again the interest of the generic definitions of *n*-maps and
    *n*-Gmaps, which are versatile enough for various applications of geometric modeling,
    computational geometry, discrete geometry, computer graphics, image processing
    and analysis, etc.'
  merge: -1
