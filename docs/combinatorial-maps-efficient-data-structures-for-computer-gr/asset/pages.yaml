    orbit, $\beta_0$ is applied, starting from dart $d''$ as many times as necessary
    until obtaining a 0-free dart. Note that all the darts in a 1-boundary map are
    1-free and 2-free (see two examples in Figs. 5.21 and 5.22).


    Given an $n$-map $M$ with $i$-boundaries, it is then possible to “fill in” all
    $i$-boundaries by linking the $n$-map with a copy of its $i$-boundary map $M_{\partial_i}$.
