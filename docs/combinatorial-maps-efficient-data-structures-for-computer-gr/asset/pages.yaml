    # Geometric realization


    Every simplicial complex K determines an abstract simplicial complex A(K) = {{P0,
    P1, …, Pi} | P0 P1 … Pi is an i-simplex of K}.


    Conversely:


    # Definition 81 (geometric realization of an abstract simplicial complex)


    Let K be an abstract simplicial complex. A geometric realization of K is a pair
    (φ, GR(K)), where GR(K) is a simplicial complex and φ is a bijection between the
    vertices of K and the vertices of GR(K), such that {v0, v1, …, vi} is an i-simplex
    of K if and only if φ(v0) φ(v1) … φ(vi) is an i-simplex of GR(K).


    Every abstract simplicial complex has a unique geometric realization, up to isomorphism.


    Note also that a simplicial map between simplicial complexes induces an abstract
    simplicial map between the corresponding abstract simplicial complexes; conversely,
    an abstract simplicial map between two abstract simplicial complexes induces a
    simplicial map between their geometric realizations.


