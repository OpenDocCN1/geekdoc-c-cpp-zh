  md: 'Note that β_j is defined for d only if d is not j-free and d'''' is not i-free.
    Indeed, if d is j-free, then d'' must be also j-free, and thus there is nothing
    to do as darts are created free in all dimensions. If d'''' is i-free, it is not
    possible yet to define the β_j links between d'' and β_i(d''''), as the new dart
    associated with β_j(d) is not yet created. This will be done in a future step
    of the algorithm, when dart β_j(d) will be processed. This is why this definition
    is done in both directions.


    β_{i-1} is initialized by following the path of darts β_{i-1}^{-1}∘(β_i∘β_{i-1}^{-1})^k(d)
    until obtaining either an i-free dart or a dart such that its associated dart
    by β_i is (inv(i-1))-free. The first case corresponds to the definition of β''_{i-1}
    in the i-boundary map. However, it is not possible to define β_{i-1} as the second
    dart concerned by this definition is not yet created. The definition will be done
    when the second extremity of this path will be processed. For this second dart,
    the first dart is no longer i-free, because its corresponding dart has already
    been created, and linked with it by β_i. However, the new dart is (inv(i-1))-free
    as it is not yet (inv(i-1))-linked. In this second case, β_{i-1}(d'') is defined
    as β_i(d''''), and reciprocally. As d'' = f(d) and β_i(d'''') = f(β_{i-1}^{-1}∘(β_i∘β_{i-1}^{-1})^k(d)),
    this is equivalent to β''''_{i-1}(f(d)) = f(β_{i-1}^{-1}∘(β_i∘β_{i-1}^{-1})^k(d)),
    which corresponds to item 2 of the i-closure definition.


    Note that β_{i-1}^{-1} is used, because the i-closure definition uses the inverse
    of the i-boundary map (this is only necessary for i = 2).


    The complexity of Algorithm 48 is linear in number of darts of cm. Indeed, each
    dart is considered exactly once in the main foreach loop. In this loop, each operation
    is atomic except the while loop (line 12) which is linear in number of darts in
    the path β_{i-1}^{-1}∘(β_i∘β_{i-1}^{-1})^k(d). However these darts are considered
    exactly twice, the first time when d is processed, and the second time when the
    second i-free dart is processed. In other words, these paths are disjoint for
    each different pair of i-free darts. So, the overall complexity of the algorithm
    which is linear in number of darts of the n-map.


    The behaviour of this algorithm can be illustrated on the examples provided in
    Fig. 6.7(a) and Fig. 6.10(a). Since it is close to the behavior of Algorithm 47,
    this is left to the reader.


    The 1-closure operation for n-maps is implemented by Algorithm 49. It is similar
