    +   - D'''' = D ∪ D'';

    +   - ∀ j ∈ {0, …, n}, j ≠ i:

    +       ∀ d ∈ D, α''''_j(d) = α_j(d); ∀ d'' ∈ D'', α''''_j(d'') = α''_j(d'');

    +   - ∀ d ∈ D \ BV, α''''_i(d) = α_i(d); ∀ d'' ∈ D'' \ BV'', α''''_i(d'') = α''_i(d'');

    +   - ∀ d ∈ BV, α''''_i(d) = γ^{-1}(d); ∀ d'' ∈ BV'', α''''_i(d'') = γ(d'').


    Note that the definition of the i-expansion operation is the same than the definition
    of the i-insertion operation, the only difference being the fact that an expansible
    i-cell is taken into account instead of an insertable i-cell.


    Since the expansion operation is the inverse of the contraction operation, the
    examples presented in Section 6.3.1 illustrate also the expansion operation, but
    starting here from the results. Fig. 6.39 represents a 1-expansion in a 2-Gmap.
    Starting from Fig. 6.39(a), the edge described by 2-Gmap C is expanded into 2-Gmap
