    cubical structures (cells are vertices, edges, squares, cubes, hypercubes, etc.),
    simploidal structures (cells are products of simplices, as cubes are products
    of edges). Cellular structures have been defined for representing subdivisions
    with any cells: in fact, cells are never “any” cells, they always satisfy some
    structural properties.


