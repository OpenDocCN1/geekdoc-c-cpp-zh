    # 3.1.2.2  2D


    In 2D, an oriented quasi-manifold with boundary (an oriented surface with boundary,
    see example in Fig. 3.13) is decomposed into isolated faces by splitting each
    edge into two, except edges that belong to a boundary (such as edge e₃ in this
    example). Indeed, such an edge belongs to the boundary of only one face and thus
    does not need to be split. By definition, the corresponding dart is free and it
    has ∅ as image by β₂. Then each polygonal curve, with or without boundary, is
    decomposed. This produces the 2-map shown in Fig. 3.13(d) that contains twelve
    darts. Darts 2, 3, 7, 10, 11, 12 belong to a boundary, so they are 2-free as they
    have ∅ as image by β₂ (for example β₂(2) = ∅ and dart 2 is said 2-free).


    By comparison with the case of 2D oriented quasi-manifold without boundaries,
    β₂ is now a partial involution and no more an involution. There is no modification
    for the definition of cells, however different types of cells can be distinguished.
    A vertex and a face can be either a cycle of darts (case without boundary) or
    a sequence of darts (case with boundary); and an edge can be composed by one dart
    (case with boundary) or two darts (case without boundary). There is also no difference
    for the definition of connected components.'
