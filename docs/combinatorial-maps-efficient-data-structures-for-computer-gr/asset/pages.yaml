    first o1 = {⟨βi ∘ βj | ∀i, j ∈ {3, …, n}, i < j⟩}(d) is all the darts of the first
    edge having the same orientation than d, second o2 = ⟨β3, …, βn⟩(β1(d)) \ {⟨βi
    ∘ βj | ∀i, j ∈ {3, …, n}, i < j⟩}(β1(d)) is all the darts of the second edge having
