  md: "# 5.5.4  Duality\n\nRemember that duality is a classical notion which makes\
    \ the link between two objects having a similar structure, but regarding their\
    \ dimensions in reverse order.\n\nThe definition of duality for $n$-maps can be\
    \ easily deduced from the definition of duality for $n$-Gmaps and from the links\
    \ between $n$-Gmaps and $n$-maps. Let $G=(D,\\alpha_0,\\ldots,\\alpha_n)$ be an\
    \ orientable $n$-Gmap without boundary, and let $O(G)=(D,\\beta_1,\\ldots,\\beta_n)$\
    \ be its $n$-map of the orientations; so, for any $i$, $1\\leq i\\leq n$, $\\\
    beta_i=\\alpha_i\\circ\\alpha_0$. Let $G^*=(D,\\alpha_n,\\ldots,\\alpha_0)$ be\
    \ the dual of $G$.\n\nIn order to satisfy the relation between the associated\
    \ quasi-manifolds, it is clear that $O(G^*)$, the dual of $O(G)$, has to be the\
    \ $n$-map of the orientations of $G^*$, i.e. $O(G^*)$. The definition of $O(G)^*$\
    \ can thus be easily deduced:\n\n+   • let $n=1$. $G=(D,\\alpha_0,\\alpha_1)$\
    \ and $O(G)=(D,\\beta_1=\\alpha_1\\circ\\alpha_0)$; $G^*=(D,\\alpha_1,\\alpha_0)$,\
    \ and $O(G^*)=(D,\\beta_1^{-1}=\\alpha_0\\circ\\alpha_1)$;\n+   \n+   • let $n>1$;\
    \ then for any $i>1$, $\\beta_i=\\alpha_i\\circ\\alpha_0$ is an involution, i.e.\
    \ $\\beta_i=\\beta_i^{-1}$. $G=(D,\\alpha_0,\\ldots,\\alpha_n)$, and $O(G)=(D,\\\
    beta_1=\\alpha_1\\circ\\alpha_0,\\ldots,\\beta_n=\\alpha_n\\circ\\alpha_0)$. $G^*=(D,\\\
    alpha_n,\\ldots,\\alpha_0)$, and $O(G^*)=(D,\\beta_1^*=\\alpha_{n-1}\\circ\\alpha_n,\\\
    ldots,\\beta_{n-1}^*=\\alpha_1\\circ\\alpha_n,\\beta_n^*=\\alpha_0\\circ\\alpha_n)$.\
    \ $\\beta_i^*=\\beta_{n-i}=\\beta_{n-i}^{-1}$, $1\\leq i\\leq n-1$, $\\beta_i^*=\\\
    alpha_{n-i}\\circ\\alpha_n=\\beta_{n-i}\\circ\\beta_n^{-1}=\\beta_{n-i}\\circ\\\
    beta_n$.\n\nThis leads to the following definition.\n\n**Definition 54 (dual)**\
    \ Let $M=(D,\\beta_1,\\ldots,\\beta_n)$ be an $n$-map without $n$-boundary. The\
    \ dual map of $M$ is $M^*$ defined by:\n\n+   • if $n=1$, $M^*=(D,\\beta_1^{-1})$;\n\
    +   \n+   • otherwise, $M^*=(D,\\beta_{n-1}\\circ\\beta_n,\\ldots,\\beta_1\\circ\\\
    beta_n,\\beta_n)$.\n\nTo ensure that the composition $\\beta_i\\circ\\beta_n$\
    \ can be done without loss of any relation, the $n$-map must be without $n$-boundary.\
    \ This ensures that $\\beta_n\\ne\\varnothing$ and thus that composing $\\beta_i$\
    \ with $\\beta_n$ gives $\\varnothing$ only when $\\beta_i=\\varnothing$. This\
    \ property is required to guarantee the important property that $M^{**}=M$. For\
    \ all other dimensions $i\\ne n$, the $n$-map can have $i$-boundary.\n\nBy definition\
    \ of cells, $i$-cells are transformed into $(n-i)$-cells by duality. Thanks to\
    \ this definition, it is straightforward to prove that $M^{**}=M$.\n\nAn example\
    \ of a 2-map $M=(D,\\beta_1,\\beta_2)$ without boundary is presented in Fig. 5.24,\
    \ as its corresponding dual 2-map $M^*=(D,\\beta_1\\circ\\beta_2,\\beta_2)$. $M$\
    \ is composed by seven vertices, nine edges and four faces, and $M^*$ is composed\
    \ by four vertices, nine edges and seven faces.\n\nAs illustrated in Fig. 5.25,\
    \ the dual definition is still valid for $n$-maps with boundaries. In this example,\
    \ the 2-map $M=(D,\\beta_1,\\beta_2)$ is without 2-boundary, but with 1-boundaries.\
    \ Its dual is 2-map $M^*=(D,\\beta_1\\circ\\beta_2,\\beta_2)$ is also without\
    \ 2-boundary, but with 1-boundaries. $M$ is composed by six vertices, five edges\
    \ and five faces, and $M^*$ is composed by five vertices, five edges and six faces."
