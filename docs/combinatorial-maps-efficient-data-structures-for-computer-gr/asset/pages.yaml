    # Algorithm 23: reserveMarkNMap(cm): reserve a new mark for n-maps


    Input: cm: an n-map.

    Output: The index of a new reserved mark;

    -1 if there is no more available mark.


    ```

    1 if cm.FreeMarks is empty then return -1;

    2 i ← an element of cm.FreeMarks;

    3 remove i from cm.FreeMarks;

    4 return i;

    ```


    # Algorithm 24: freeMarkNMap(cm,i): free a reserved mark for n-maps


    Input: cm: an n-map having all its darts unmarked for mark i;

    i: the index of a reserved mark.

    Result: Free the reserved mark i.


    ```

    1 add i into cm.FreeMarks;

    ```


