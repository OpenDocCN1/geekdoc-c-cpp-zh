  md: '# 3


    *Intuitive Presentation*


    In this intuitive introduction, we show how to represent the topology of subdivisions
    of quasi-manifolds, introduced in chapter 2. *n*-maps and *n*-Gmaps are presented
    in Section 3.1 and Section 3.2. Both models have their own advantages and drawbacks.
    *n*-maps allow to describe oriented subdivisions while *n*-Gmaps allow to describe
    oriented and nonoriented subdivisions. *n*-maps need twice less memory than *n*-Gmaps
    for representing oriented quasi-manifolds. However algorithms are more complex
    to write for *n*-maps than for *n*-Gmaps due to an inhomogeneous definition. For
    these reasons, both models are interesting and could be chosen depending on the
    specific needs of a particular application.


    In this chapter, the different models are introduced, starting from the object
    to describe, by applying successive decompositions to cells. Note that this construction
    is only useful to understand the concept of darts, which is the basic element
    of combinatorial maps, and the different links between these darts. In practice,
    *n*-maps and *n*-Gmaps are handled through high level operations.


    # 3.1  *n*-maps


