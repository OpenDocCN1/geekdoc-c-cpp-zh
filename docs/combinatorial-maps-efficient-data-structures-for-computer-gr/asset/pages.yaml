  md: '# 8.3.2 Euler-Poincaré Characteristic for Combinatorial Maps


    The Euler-Poincaré characteristic is a well-known topological invariant¹¹: if
    two subdivisions are homeomorphic, then their Euler-Poincaré characteristics are
    equal. The converse assertion is used in practice, i.e. if the Euler-Poincaré
    characteristics of two subdivisions are different, it is sure that the subdivisions
    are not homeomorphic.


    The Euler-Poincaré characteristic of an n-dimensional simplicial “object” is the
    alternate sum of the number of i-simplices, for 0 ≤ i ≤ n, i.e.:


    ```

    χ = Σ_{i=0}^{n} (-1)^i |K_i|

    ```


    where K_i is the set of i-simplices.


    # 8.3.2.1 For n-Gmaps


    The definition of the Euler-Poincaré characteristic of an n-Gmap can be easily
    deduced from the simplicial interpretation of n-Gmaps, since an orbit for i involutions
    corresponds to an (n − i)-simplex.


    # Definition 91 (Euler-Poincaré characteristic of an n-Gmap) Let G = (D, α₀, …,
    αₙ) be an n-Gmap, with n ≥ 0. Its Euler-Poincaré characteristic χ(G) is:


    ```

    χ(G) = Σ_{i=0}^{n} (-1)^{(n−i)} Σ_{0 ≤ k₀ < … < k_{i−1} ≤ n} #⟨α_{k₀}, …, α_{k_{i−1}}⟩

    ```


    where #⟨α_{k₀}, …, α_{k_{i−1}}⟩ is the number of orbits ⟨α_{k₀}, …, α_{k_{i−1}}⟩.


    For instance:


    +   when n = 0, χ(G) = #⟨⟩ = |D|, i.e. it is equal to the number of vertices in
    the associated cellular quasi-manifold;


    +   when n = 1, χ(G) = −#⟨⟩ + #⟨α₁⟩ + #⟨α₀⟩, i.e. it is equal to the numbers of
    vertices numbered (0) and (1) minus the number of edges of the associated cellular
    quasi-manifold. When G is connected and without 0 and 1-boundary, i.e. it corresponds
    to a closed polygonal curve, #⟨α₀⟩ = #⟨α₁⟩ = #⟨⟩/2; thus χ(G) = 0, it is the Euler-Poincaré
    characteristic of a circle. When G is connected, without 0-boundary but with 1-boundaries,
    i.e. it corresponds to an open polygonal curve, #⟨α₀⟩ = #⟨⟩/2 and #⟨α₁⟩ = 1 +
    #⟨⟩/2; thus χ(G) = 1, it is the Euler-Poincaré characteristic of a segment;'
  merge: -1
  img_proc: true
