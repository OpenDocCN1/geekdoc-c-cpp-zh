  md: '# FIGURE 5.9


    Two examples of non 3-sewable darts in a 3-map.


    (a) Darts 1 and 5 are not 3-sewable. It is not possible to define a one to one
    mapping, since the two 2-cells do not have the same number of darts.


    (b) Darts 8 and 12 are not 3-sewable. Let f be the one to one mapping defined
    by f(8) = 12, f(9) = 15, f(10) = 14 and f(11) = 13. β₁(f(8)) = β₁(12) = ∅ while
    f(β₁⁻¹(8)) = f(11) = 13. This is not an isomorphism.


    An example of 3-sew operation in a 3-map is presented in Fig. 5.8. Two 2-cells
    are identified by linking two by two by β₃ all the darts belonging to the two
    initial faces. This identification of faces involves the identification of the
    boundaries of the two faces (each pair of edges and each pair of vertices of the
    two faces in relation by the isomorphism f are identified two by two). Such 3-sew
    operation is not always possible: the two initial faces must be 3-sewable, i.e.
    they must have the same structure. In this example, it is easy to verify that
    darts 1 and 5 are 3-sewable. o₁ = {1,2,3,4} and o₂ = {5,6,7,8} are isomorphic,
    the isomorphism f is defined by f(1) = 5, f(2) = 8, f(3) = 7 and f(4) = 6, and
    for each dart e ∈ o₁, β₁(f(e)) = f(β₁⁻¹(e)).


    The 3-sew operation cannot be applied to the two examples depicted in Fig. 5.9.
    In the first example, darts 1 and 5 are not 3-sewable since faces c₂(1) and c₂(5)
    do not have the same number of darts. Thus no one to one mapping exists between
    o₁ and o₅. In the second example, the two faces c₂(8) and c₂(12) do not have the
    same structure: the first one has no 1-boundary while the second one has one 1-boundary.
    Thus no isomorphism exists between o₈ and o₁₂.


