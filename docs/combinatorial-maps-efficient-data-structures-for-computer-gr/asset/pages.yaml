  md: '# Algorithm 63: expandNGMap(gm, c, i, assoc): expand an i-cell in an n-Gmap


    Input: gm: an n-Gmap;


    c: an expansible i-cell according to assoc;


    i ∈ {0, …, n};


    assoc: a mapping from c.Darts to gm.Darts.


    Result: Expand the i-cell c in gm along assoc.


    ```

    1 foreach dart d'' ∈ c.Darts do

    2   add d'' in gm.Darts;

    3   remove d'' from c.Darts;

    4   if d'' ∈ assoc then

    5     d''.Alphas[i] ← assoc[d''];

    6     assoc[d''].Alphas[i] ← d'';

    ```


    # 6.6 Chamfering


    The chamfering operation takes an i-cell as parameter, and replaces it by an n-cell.
    It allows to smooth an object by rounding its sharp cells. In 2D, vertices or
    edges can be chamfered (cf. examples in Fig. 6.41). In both cases, when no multi-incidence
    occurs, the chamfered cell is replaced by a new face which has as many edges in
    its boundary than the number of faces incident to the chamfered cell. For instance
    in Fig. 6.41:


    +   - when the vertex is chamfered, the new face is incident to three edges;

    +   - when the edge is chamfered, the new face is incident to two edges.


    Note that only the given cell is chamfered: for instance, when chamfering an edge,
    its incident vertices are not chamfered.


    In 3D, vertices (cf. Fig. 6.42), edges (cf. Fig. 6.43) or faces can be chamfered.
    When no multi-incidence occurs, the chamfered cell is replaced by a volume, which
    has as many faces in its boundary than the number of volumes incident to the chamfered
    cell. For instance in Fig. 6.42, the new volume is incident to eight faces; in
    Fig. 6.43, the new volume is incident to four faces. Note again that only the
    given cell is chamfered, not its incident cells.


    The chamfering operation presented here is a basic operation. As illustrated in
    Fig. 6.44, it is a basis for a generalized chamfering operation, which consists
    in applying several times the basic chamfering operation. In this example, starting
    from the 3D object represented in Fig. 6.44(a), edge e is first chamfered, then
    the two vertices incident to edge e before its chamfering are chamfered. This
    produces the object represented in Fig. 6.44(b), after a cleanup step which merges
    several new cells.'
