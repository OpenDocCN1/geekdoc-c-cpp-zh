    (and more generally for any orbit): cf. Def. 25. The only difference with the
    definition of orientable $n$-Gmap is to consider here only the darts of the given
    cell, and all involutions except $\alpha_i$.


    **Definition 25 (Orientable $i$-cell)**  An $i$-cell $c$ in an $n$-Gmap $G=(D,\alpha_0,\ldots,\alpha_n)$
