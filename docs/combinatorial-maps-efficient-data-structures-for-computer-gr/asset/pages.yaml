    # 2.1.2 Continuous Map, Homeomorphism


    Let A ⊂ ℝ^n, and let f : A → ℝ^m. f is a continuous map if for any x ∈ A and for
    any ε > 0 it exists δ > 0 such that f(B_δ^n(x)) ⊂ B_ε^m(f(x)). Equivalently, f
