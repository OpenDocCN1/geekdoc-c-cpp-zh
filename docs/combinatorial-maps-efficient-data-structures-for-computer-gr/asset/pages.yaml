  md: '# 1.3.1 Why Numerous Structures?


    In fact, there are two questions:


    +   1. *why assuming that objects satisfy some properties?* Mainly for:


    +   - *coherence of representation.* Representing a volume by its boundary is
    a well-known method of Geometric Modeling, applied for instance for CAD applications.
    For instance, take a simple object of our real world, e.g. a wooden cube; it corresponds
    to a volume, and its boundary is an orientable surface without boundary, made
    of six faces, twelve edges and eight vertices. But a nonorientable surface does
    not define the boundary of a volume in the 3-dimensional space. So, when the data
    structure takes into account that only orientable surfaces without boundaries
    can be represented, it is impossible to construct an object which cannot be represented
    in the usual 3-dimensional space;


    +   - *optimization of operations.* For instance, objects are generally triangulable,
    and triangulations are well suited for many operations of computer graphics or
    computational geometry, e.g. as said above, it is easy to detect (and compute)
    the intersection between a light ray and a triangle;


    +   - *but it is not always possible to assume that objects still satisfy properties.*
    Other operations are not so easy to perform on triangulations, for instance boolean
    operations (union, intersection, difference). Such operations, applied to triangulations,
    do not directly produce triangulations (cf. Fig. 1.5(a)). A first idea consists
    in splitting simplices when intersections are processed (cf. Fig. 1.5(b)), but
    examples exist, showing that the process may be not convergent, since new simplices
    are added which perhaps produce new intersections; so, it could be convenient
    here to handle cellular structures instead of simplicial ones;


    +   - *and don’t forget some additional costs.* As said before, it could be efficient
    to handle triangulations, and thus to triangulate cellular objects; but if some
    operations are more efficient when applied to a triangular cell, there are more
    triangular cells than initial ones, so more cells to process. Moreover, information
    can be lost (or explicit information can become implicit). For instance, assume
    that the initial structure has a meaning related to the application, e.g. wooden
    cubes are represented. When triangulated, several triangles correspond to each
