- pgno: 270
  md: "```\n**Algorithm 66:** `triangulationNGMap(gm,d,i)`: triangulation of an *i*-cell\
    \ for *n*-Gmaps\n\n**Input:** `gm`: an *n*-Gmap;  \n`d ∈ gm.Darts`: a dart;  \n\
    `i ∈ {1, ..., n}`.\n\n**Result:** Make a triangulation of the *i*-cell `cᵢ(d)`.\n\
    \n**Output:** A dart of the new vertex.\n\n```text\n1  phi ← an array of i + 1\
    \ empty associative arrays between darts;\n2  foreach dart d′ ∈ cᵢ(d) do\n3  \
    \    for j ← 0 to i − 1 do\n4          phi[j][d′] ← createDartNGMap(gm);\n5  \
    \    phi[i][d′] ← d′;\n6  foreach dart d′ ∈ cᵢ(d) do\n7      phi[0][d′].Alphas[0]\
    \ ← phi[1][d′];\n8      for j ← 1 to i do\n9          phi[0][d′].Alphas[j] ← phi[0][d′.Alphas[j\
    \ − 1]];\n10     for j ← i + 1 to n do\n11         phi[0][d′].Alphas[j] ← phi[0][d′.Alphas[j]];\n\
    12     for k ← 1 to i − 1 do\n13         for j ← 0 to k − 2 do\n14           \
    \  phi[k][d′].Alphas[j] ← phi[k][d′.Alphas[j]];\n15         phi[k][d′].Alphas[k\
    \ − 1] ← phi[k − 1][d′];\n16         phi[k][d′].Alphas[k] ← phi[k + 1][d′];\n\
    17         for j ← k + 1 to i do\n18             phi[k][d′].Alphas[j] ← phi[k][d′.Alphas[j\
    \ − 1]];\n19         for j ← i + 1 to n do\n20             phi[k][d′].Alphas[j]\
    \ ← phi[k][d′.Alphas[j]];\n21 foreach dart d′ ∈ cᵢ(d) do\n22     d′.Alphas[i −\
    \ 1] ← phi[i − 1][d′];\n23 return phi[0][d];\n```\n```"
