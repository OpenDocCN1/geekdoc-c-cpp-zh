    `up`: the dart to the up of the current pixel;


    `(x,y)`: the coordinates of the up-left pointel of the square;


    `w`: the width of the image.


    **Result:** Create a new square 2-sewn with darts `last` and `up`, with `(x,y)`
    as coordinates of the up-left pointel of the square (modulo `w + 1` in `x`-axis).


    **Output:** The dart to the right of the new square.


    ```text

    1  for i ← 0 to 3 do

    2      res[i] ← createDartNMap(cm);

    3      if i > 0 then

    4          res[i].Betas[0] ← res[i − 1]; res[i − 1].Betas[1] ← res[i];

    5  res[0].Betas[0] ← res[3]; res[3].Betas[1] ← res[0];

    6  res[0].Betas[2] ← last; last.Betas[2] ← res[0];

    7  res[1].Betas[2] ← up; up.Betas[2] ← res[1];

    8  x′ ← (x + 1) % (w + 1); y′ ← y + ((x + 1) / (w + 1));

    9  res[0].Emb ← ((x,y + 1),1); res[1].Emb ← ((x,y),0);

    10 res[2].Emb ← ((x′,y′),3); res[3].Emb ← ((x′,y′ + 1),2);

    11 return res[2];

