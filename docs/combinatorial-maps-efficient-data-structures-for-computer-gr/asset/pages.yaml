- pgno: 271
  md: "![](img/6ba3cf72cbe3568e76a174448323bb33_271_0.png)\n\n**FIGURE 6.53**  \n\
    (a) A 2D object.  \n(b) The result of the 1-triangulation operation applied to\
    \ the edges of (a).  \n(c) The result of the 2-triangulation operation applied\
    \ to the faces of (b). This is the barycentric triangulation of the initial object.\n\
    \nAs for the chamfering operation, the αᵢ₋₁ links are modified for the darts in\
    \ cᵢ(d) (line 22). To avoid side effects, this modification is done in a second\
    \ loop, after having defined the α links for the new darts. Moreover, the darts\
    \ of cᵢ(d) are stored in a data structure during the first loop (line 2); the\
    \ iteration of the second loop is done through the data structure, and not through\
    \ a cell iterator (line 21). At last, the algorithm returns one dart belonging\
    \ to the new vertex, as it can be used in other algorithms (as we will see in\
    \ Algorithm 74 page 265).\n\nThe complexity of Algorithm 66 is linear in the number\
    \ of darts #d of the given i-cell times log #d.\n\nThe *barycentric triangulation*\
    \ of a given n-Gmap can be defined by applying the i-triangulation operation to\
    \ the i-cells of the n-Gmap, from i = 1 to i = n. For example, look at the 2D\
    \ object represented in Fig. 6.53(a). It contains 12 vertices, 17 edges and 6\
    \ faces. The 1-triangulation operation is applied to all its edges, producing\
    \ the 2D object represented in Fig. 6.53(b). This object contains 29 vertices,\
    \ 34 edges and 6 faces. Then, the 2-triangulation operation is applied to all\
    \ its faces, producing the 2D object represented in Fig. 6.53(c). This object\
    \ contains 35 vertices, 84 edges and 50 faces. This is the barycentric triangulation\
    \ of the initial object: a vertex corresponds to each cell of the initial object."
