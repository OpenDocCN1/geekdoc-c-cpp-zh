    embedding (e.g. trimmed surfaces: cf [2]). Associate a plane of ℝ³ with any face.
    The plane is the support space of the face. The surfaces associated with two adjacent
    faces which share an edge intersect along a line: this line is the support space
    of the common edge. All lines associated with the edges which share a vertex intersect
    on a point, which is the embedding of the vertex. The line segment associated
    with an edge is defined by its support line, delimited by the points associated
    with its incident vertices. Similarly, the part of plane associated with a face
    can be retrieved from its support plane, and the lines associated with its incident
    edges. In fact, all embedding information can be retrieved from the support spaces
    associated with the faces, since the embedding of other cells can be deduced.
    Here also, consistency constraints still have to be satisfied: for instance, the
    planes associated with two edges which share an edge have to be different. This
    approach can be generalized for higher dimensions, and also for nonlinear embedding.
    For instance, support spaces associated with faces are often free-form surfaces
    (e.g. nurbs).


    The main interests of implicit embedding are:


    +   1. decrease the memory size: there are less geometrical elements to store
    and less links to describe;

    +   2. simplify the operations: only one type of embedding is handled;

