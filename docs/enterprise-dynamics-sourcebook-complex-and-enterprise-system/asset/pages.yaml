  md: '# Defining Enterprise and Transformation Challenges


    4. Qualitative and quantitative information and methods are important to operational
    decision making and may be integrated and applied to the complex challenges of
    enterprise transformation using unifying techniques.

    5. Emergent behaviors are an ever-present challenge to enterprise transformation
    and sustainability, which can be managed or explored using theories and methods
    drawn from theory and experience with complex adaptive systems.


    The enterprise as a purposeful socio-techno-economic undertaking involves multiple
    organizations and agencies activated by coordination of policies, organizations
    (people), economics (budgets), and technology to provide services or deliver products
    to the government or public. This functional definition of the “enterprise” differs
    from the institutional definition of an enterprise as an agency or commercial
    entity. They are related in that an institutional enterprise is organized to carry
    out one or more purposeful activities.


    The application of ESE/A in the Section II case studies focuses on the acquisition
    of new capabilities for enterprise transformation and operational excellence in
    both the targeted state and during transformation. The methods can be applied
    using the ESE/A process to guide the planning and managing of an enterprise as
    it implements new capabilities for the delivery of products and services in private
    and public sector. The results also provide quantitative benchmarks against all
    kinds of enterprise programs, encompassing acquisition of capabilities and their
    operational use to carry out the mission, can also be used to support decision
    making and the selection of acquisition and management approaches for these extremely
    efforts.


    Systems engineering methods have evolved as a formal discipline over the past
    60 years to address emerging technical and socioeconomic challenges, often with
    new techniques arising from those challenges and from active research programs
    in computational methods. This evolution has extended the practice of systems
    engineering from purely technical systems in automated control systems, to manage
    complex domains such as systems engineering, air traffic control, and combat systems.
    Major events and developments in the systems engineering timeline are outlined
    in Chapter 2 as a consistent trend toward ever-increasing complexity based on
    the needs of modern society and on burgeoning analytical capabilities.


    Engineering is defined as “the application of science and mathematics by which
    the properties of matter and the sources of energy in nature are made useful to
    people” (Merriam-Webster). As an engineering discipline, systems engineering has
    not consistently employed quantitative methods, recognizing, that not all aspects
    of the system challenge can be quantified.


    Early applications in the 1950s and 1960s focused on applying physical sciences
    to transportation, nuclear power systems, weapons systems, and the space program.
    Another major aspect of these applications involved the integration of multiple'
