  md: '# 2.1.4 Physical


    +   - Facilities

    - Technical infrastructure


    A variety of additional tools for planning and analysis is needed for the proper
    use of the rich but static information contained in EAs. This more extensive activity
    is referred to as enterprise systems engineering and architecting (ESE/A). Following
    is an historical perspective on highlights in the long-term evolution of the field
    of systems engineering in response to challenges.


    # 2.2 Foundations of Systems Engineering


    Concepts of general systems theory, or system science, were utilized in the origin
    and continued evolution of systems engineering. Although useful, these concepts
    were often highly abstract and needed to be incorporated in a systems engineering
    discipline to support practical applications. An important and distinct foundation
    of systems engineering up to the 1990s is found in control theory (Kucera 2000):


    > Control theory and engineering have witnessed dramatic achievements throughout
    this century. Recall the stability theory of Lyapunov at the beginning of the
    century, the conception of three-term or PID (Proportional-Integral-Derivative)
    controllers in the 1910s, electronic and pneumatic feedback alimmers in the 1920s.
    Nyquist and Bode charts of the 1930s, and Wiener’s cybernetics of the 1940s. Then
    the 1950s and Bellman’s principle of optimality, Kalman filter of the 1960s, adaptive
    control in robust control in the 1980s, and the hybrid control systems of the
    current decade.


    The control-theoretic methods were particularly appropriate for applications to
    predominantly technical systems such as automated manufacturing, weapons systems,
    and nuclear power.


    Academic origins of systems engineering are found in industrial engineering, which
    drew upon other engineering disciplines for industrial and civil applications.
    The incorporation of engineering economics in the curriculum was especially noteworthy,
    an addition that was often ignored, but proved highly beneficial to all engineering
    disciplines.


    The applications of industrial engineering to such areas as public works and manufacturing
    clearly drew on system principles and are fundamental efforts for the discipline
    of systems engineering. In a period of constrained resources there was'
