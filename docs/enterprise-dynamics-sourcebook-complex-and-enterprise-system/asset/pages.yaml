    # 3.5 Conclusion


    There is a strong relationship between enterprise architecting as has been practiced
    in the private sector and government, and the dynamic methods employed in enterprise
    systems engineering. This chapter outlined the formulation and experiment with
    these methods and their integration in ESE/A with an emphasis on the dynamic behaviors
    of the enterprise and its transformation to adapt to the evolving external environment.
    This foundational ESE/A process architects from a static and deterministic regime
    to a dynamic and probabilistic regime.


    The case studies in Section II demonstrate a mature state of development in the
    dynamic modeling of enterprise performance in operations, supporting information
    for planning and operational management, and the costs and benefits of transforming
    systems and technologies. Because of the critical importance of aligning organizational
    change with the transformation of the enterprise, attention has been given in
    this chapter to the state of development of organizational science and practical
    approaches to advancing that.


    The foundation established here for the ESE/A process is expanded upon in the
    following chapters of Section I review specific models and methods to describe
    enterprise dynamics (Chapter 4) and that present a management approach that incorporates
    ESE/A supported by enterprise dynamics methods to guide the transformation process.
    Emphasis is placed on governance in Chapter 5 to assure performance of all required
    roles and responsibilities in a coordinated way.


