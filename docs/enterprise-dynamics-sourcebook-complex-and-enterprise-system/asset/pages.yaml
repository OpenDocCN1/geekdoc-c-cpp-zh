    # 5.5.1 The Scope of Governance in Multiagency Agencies


    Governance, in its largest sense, deals with all management aspects of an enterprise,
    including stakeholder relations and the public good: "Good corporate governance
    should provide proper incentives for the board and management to pursue objectives
    that are in the interests of the company and its shareholders and should facilitate
    effective monitoring. The presence of an effective governance system, within an
    individual company and an economy as a whole, helps to provide a degree of confidence
    that is necessary for the proper functioning of a market economy. As a result,
    the cost of capital is lower and firms are encouraged to use resources more efficiently,
    thereby underpinning growth" (OECD 2004, p. 11).


    These principles apply equally to the government sector. The working definition
    of governance used in this chapter focuses on the important mission-oriented aspects
    of managing operational activities and transformation programs with significant
    technological in a way that meets management''s obligations to stakeholders and
    the public: in short, the effective use of capital, both human and financial.
    The following definition is drawn from the Information Audit and Control Foundation:
    "The set of responsibilities and practices exercised by the board and executive
    management with the goal of providing strategic direction, ensuring that objectives
    are achieved, ascertaining that risks are managed appropriately, and verifying
    that the organizations resources are used responsibly" (Hamaker 2003, website).


    This definition of governance can be applied to the benefit of stakeholders in
    both the public and private sectors. A sound governance structure is essential
    in where responsibility, authority, and accountability for both technical management
    and operations management are widely distributed. This situation can involve varying
    varying degrees of centralization, ranging from an overall program manager (or
    coordinator) to the other extreme of a distributed collaborative management team.
    The architecture-based approach applies across this'
