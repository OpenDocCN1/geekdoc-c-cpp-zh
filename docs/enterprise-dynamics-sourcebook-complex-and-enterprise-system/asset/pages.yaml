  md: 'The landscape, modeling, and architecting element of the ESE/A process must
    address these challenges, and must encompass policy, organizational (people),
    economic, and technology elements of enterprise dynamics in planning and managing
    the transformation to greatly improved operational levels.


    # 1.5 Modeling Approaches and Applications


    A wide range of disciplines and models can be drawn upon for ESE/A analysis of
    POET dynamics. Specific models and methods applied to enterprise system engineering
    depend on the system description, the objectives of the ESE exercise, and the
    characteristics of a specific enterprise. The characterization of the enterprise
    and its transformation challenges uses the conceptual framework discussed in Section
    1.3 and serves to identify the applicable disciplines and the specific modeling
    capabilities required to deal with factors that can be quantified as well as critical
    qualitative factors.


    Several example applications are presented covering various scales and other characteristics
    of an enterprise ranging from a specific operation to a major sector of the U.S.
    economy, as well as various operational environments, including the delivery of
    repetitive services or products and situation-dependent operations of a highly
    variable nature. These examples encompass many analytical methods that may be
    drawn upon to address complete enterprise system challenges in their appropriate
    roles.


    The emphasis in ESE/A modeling is to capture quantitative and qualitative factors
    that affect enterprise performance and the ability to achieve operational improvements
    through transformation programs. Predictive capability is greatly desired in such
    models, however any capability is highly conditioned on the assumptions and factors
    considered. Applications of models in the ESE/A process emphasize descriptive
    and normative capabilities to analyze alternative decisions and actions to inform
    managers and other stakeholders.


    The variety of modeling methods and disciplines applied in the case examples of
    Section II includes control theory, system dynamics, agent-based models, Bayesian
    probability theory, highly optimized tolerance, Fourier series, and game theory.


    No treatise on ESE can be complete without addressing the social aspects of planning,
    modeling, and analysis. All stakeholders must be drawn into the process to reveal
    objectives and priorities, and to communicate the results of the ESE process and
    analytical work. The closing chapter in Section I provides an approach to governance
    and ESE/A process guidelines while engaging stakeholders in the effort.


    # 1.6 Conclusion


    The definition of the enterprise as a purposeful socio-techno-economic undertaking
    involving multiple organizations and agencies can be applied at multiple scales.'
