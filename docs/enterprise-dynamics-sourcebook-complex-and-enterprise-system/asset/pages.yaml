  md: '# Enterprise Dynamics Methods and Models 65


    The ESE/A process can resolve these issues, principally by propagating a consistent
    definition of services and activities throughout the various tools and methods,
    still not easy in application, but well worth the effort given the very high risks
    and failure-rates observed in even simple transformation programs.


    # 4.5.2 Results of the C-I-U Simulation of the Enterprise in its Environment


    For illustrative purposes, the basic mathematical formulation and results of the
    C-I-U Model Version 1.0, which was constructed as a control-theoretic representation
    on selected state-space parameters in the source HOT model and the cycles and
    lags model, are outlined below. This illustration draws from the more extensive
    case study on this topic in Chapter 8 and demonstrates the feasibility of the
    C-I-U analytic approach.


    In its simplest form applied to the entire scope of enterprise acquisition and
    in operations, the core model has a time-dependent scalar state $s(t)$ and controls
    $q(t)$ and $t_f$. Here, $s(t)$ quantifies the progress made toward an operational
    capability and $q(t)$ is the square root of money spent toward the acquisition.
    The control parameter $t_f$ is the time to finish the acquisition. In this simple
    model “acquisition” encompasses transitions to operations as the traditional acquisition
    process. Also, a total system lifetime (across both acquisition and operational
    use) $t_L$ is specified as constants $b$ and $K$ in the control formulation:


    ```

    $s(t) = b \cdot q(t)$

    ```


    ```

    $J = K \cdot s(t_f) \cdot (t_L - t_f) - \int_{0}^{t_f} q^2(t) \cdot dt$

    ```


    Here, $J$ is the objective function to be maximized. The first term in $J$ represents
    the benefit of the capability in operations, and the second term represents total
    cost to acquire the capability. Wojcik and Hoffman (2007) demonstrate that $s(t)$
    at optimum is linear in $t$, and, remarkably, the optimum $t_f$ is always $t_L/3$,
    independent of the values of the constants $K$ and $b$. This very general rule
    provides a quantitative benchmark against which all kinds of enterprise acquisition
    programs can be compared. Wojcik and Hoffman (2007) also extend the core model
    to encompass exogenous effects due to environmental changes, evolving user requirements,
    or an unstable enterprise mission. Thus, through the application of optimal control
    theory, the core model generates high-level, emergent enterprise dynamic behavior
    in the context of its mission and its environment.'
