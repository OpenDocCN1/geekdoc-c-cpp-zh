    # 8.4 Differential Game Models


    # 8.4.1 Linear Differential Game of Self-Interested, Synchronizing Stakeholders


    This section describes a model of interacting stakeholders that influence an SE
    process connected with an enterprise. Such stakeholders may include contractors,
    government organizations, system user groups, unions, or myriad other individuals
    or groups pertaining to the enterprise. It is assumed here that stakeholders need
    to'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# Optimal Control and Differential Game Modeling ■ 201


    “synchronize” in some fashion for the SE process to run well. For example, in
    some large military SE programs, sets of contractors need to collaborate, share
    information, and coordinate their development activities toward a system-level
    capability.

    In another current civil aviation SE program, called NextGen, a large set of stakeholders,
    including profit-seeking airlines, government agencies, and airport organizations,
    needs to reach and maintain consensus, and provide political support toward a
    final system involving many interrelated programs implemented in many geographic
    areas across the United States (FAA 2010). The specific details of these programs
    vary widely, they all have stakeholders with diverse interests who need to synchronize
    in some way to facilitate a successful SE result.

    The modeling presented here seeks to represent the essential features of stakeholder
    synchronization in SE programs.


    In the modeling, the perspective is that individual stakeholders are motivated
    by their self-interests, which may vary widely across the stakeholder population.
    Furthermore, it is assumed there is an enterprise agent that can apply incentives
    and others to influence other stakeholders. In the case of a government-led enterprise,
    this profit-making could be a high-level executive or organization in charge of
    the SE effort. For simplicity, the model has each stakeholder making a limited
    set of decisions as a function of time: at minimum, each stakeholder must decide
    how to synchronize with each of the other stakeholders. Each stakeholder can directly
    benefit from greater synchronization through incentives provided by the enterprise,
    and through other mechanisms as well, including the operational benefit to a particular
    stakeholder of a better system achieved through greater synchronization. However,
    synchronization entails cost to stakeholders, to the effort applied to synchronization
    activities such as meetings and preparation, and this cost can be substantial,
    particularly because highly skilled technical people are often needed to perform
    the activities. Synchronization cost also includes associated with possible exposure
    of internal information to other stakeholders, although these costs may be negative
    for stakeholders who receive information about other stakeholders during synchronization
    activities. The interaction of stakeholder decision making over time, based on
    benefits and costs seen by stakeholders over the lifetime of the system (including
    the SE process and operational use) is modeled here with a simple dynamic game.


    A familiar “solution” for a dynamic game is the Nash equilibrium (Nash 1950).
    In a Nash equilibrium, nobody has incentive, based on self-interest, to change
    its decision. In this chapter, we emphasize a weaker version of equilibrium, characterized
    by each stakeholder having no incentive to make incremental unilateral changes
    to the amount it synchronizes with other stakeholders. Equilibrium is further
    specialized to open-loop equilibrium, which specifies the behaviors of the stakeholders
    over time, rather than a closed-loop feedback specification.'
