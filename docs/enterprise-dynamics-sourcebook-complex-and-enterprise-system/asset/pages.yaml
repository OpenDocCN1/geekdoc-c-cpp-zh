    # 7.5 Conclusion


    LSERA method provides the capability for managers to (a) develop a representation
    of a specific technology initiative within an enterprise transformation for examination
    (questioning, reasoning, inferring) and (b) re-examine the representation on the
    basis of emergent information.


    LSERA provides the capability for enterprise analysts to develop ELos in a properly
    manner, extend it to reasoning on the probability of the transformation''s success
    daily emergent information. Given software, the analysts can develop the LSERA
    models concurrently with the development of the ELos argument. It takes time to
    develop the two models is primarily based on the manager''s ability to express
    the entities, relations, beliefs, and inferences. Analysts can quickly build models
    and adjust concurrently with changes in the managers'' thinking. A key point to
    understand is that LSERA is most applicable in situations where it is not possible
    to build algorithmic models, that where reasoning and decisions are based on the
    beliefs of a group of managers such as in a large enterprise transformation. During
    the course of an enterprise transformation, enterprise architects, managers, and
    analysts develop numerous enterprise models and other analyses. Each result relates
    to assertions of attaining a desired aspect of the transformation. In general,
    the results are presented to a group of managers who then assimilate what they
    have heard, think about it at that moment, decide, and initiate actions. The problem
    is'
