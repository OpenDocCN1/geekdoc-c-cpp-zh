    # 7.3.1.5 LSERA Cause and Effect Criteria


    The LSERA Group 1 behavior-to-behavior directed relations are causal; that is,
    one entity’s behavior influences another entity’s behavior. The American Heritage
    Dictionary defines causality as* “The principle of relationship between cause
    and effect.” The “causality” has been a philosophical debate since Aristotle’s
    *Posterior Analytics and Metaphysics* (1994). The modern debate can be said to
    start with David Hume’s *A Treatise of Human Nature* (David 1739/2009). Today,
    there are many theories of causal effect and for LSERA, a directed relation has
    cause and effect if it meets the following conditions: entity activity; entity
    behaviors; entity pairs; temporal order; asymmetry; proximity; and a causal level
    of positive relevance, sufficient, or necessary sufficient.


    Entity actuality means the enterprise managers have defined the behavioral entities
    within the directed relations as discrete things with specific boundaries. Entity
