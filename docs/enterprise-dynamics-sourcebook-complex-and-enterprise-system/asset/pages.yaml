    # 4.4.1 Dynamic Enterprise Architecting Using Simulation Models


    One promising approach to better understanding and analyzing enterprise dynamics
    is to simulate the behavior of an enterprise as guided by enterprise architecting.
    This approach holds that the behavior of enterprises can potentially be understood
    through simulation. The inherent complexity of enterprises, however, makes practical
    simulation a challenge. To address this complexity, enterprise architecture (EA)
    frameworks are used to decompose the enterprise into coherent views which can
    be simulated. By integrating simulations of multiple EA, a deeper understanding
    of dynamics driven by highly interdependent views and contexts can be built.


    The subject of coupling simulation methods with EA (or architecting the active
    form) was presented in Chapter 3. An application case study is presented in Chapter
    6 with emphasis on its role in management decisions regarding the investment of
    discretionary funds. The architectural capability is enhanced significantly using
    simulation methods that capture the dynamic features of the POET elements of the
    enterprise.


    # 4.4.1.1 Principles of Hybrid Simulation Models of the Enterprise Architecture


    Simulation models have been used for a wide range of applications, including forecasting,
    education, and theory building, and decision aids. Each application requires a
    different approach to model building and use as each application has different
    objectives and goals. A simulation model intended to predict the price of a traded
    commodity, for example, requires a different approach for creation and than a
    simulation model intended to understand the spread of a contagious disease or
    one to teach people how to use a system. The guidelines for creating a simulation
    model change depending on whether the model is intended to describe, predict,
    optimize, build theory, teach, communicate, or uncover mechanisms. The goals of
    simulation models exposed are focused on understanding and communicating the effects
    of the enterprise''s architecture on the behavior of the enterprise with enterprise
    leaders as the key user models. These simulation models yield insight into complexity,
    while communicating and educating. They do not need to be predictive but they
    must be able to identify possible enterprise behavioral and performance outcomes
    in response to discrete strategic management decisions. These simulation models
    work well with existing abstractions and integrate disparate perspectives into
    a single'
