    #  11.8.5 Tool Integration


    Several classes of visualization, information management, and simulation tools
    are applied in the case study. Data sharing and interoperability are enabled by
    the web services enterprise middleware.


    +   - Operations, processes, systems, and network simulations are federated to
    provide a comprehensive integration of the environment, enterprise business rules,
    and enterprise information infrastructure. The federated simulations impose the
    spatial and temporal dependencies and constraints of the real world, enabling
    enterprises to perform resource allocation and positioning, manage time-space
    relationships among entities, and determine the overall timing of decision and
    directive processes.

    - The GIS interface provides planners and models with improved and more accurate
    geospatial locations. GIS can also provide a wealth of environmental and demographic
    information that affects the planning exercise and enterprise architecture. GIS
    technology is further leveraged in the ESE workbench using two MITRE-developed
    technologies, SimServer (Flournoy et al. 2005) and simulation over GIS, SOGIS
    (Payne et al. 2003), which provide a near and universally accessible method for
    providing simulation results to a widely dispersed audience. This is useful for
    bringing in state and local agency partners and for reaching stakeholders of small
    and medium-businesses.

    - A metadata server contains metadata, which is described using RDF and RDF schema.
    An open-source Java framework, Sesame (openRDF 2005), is used for storing, querying,
    and reasoning with the metadata and for translating agency and simulation federate-specific
    syntax agreed upon by all agencies. This clarifies entity and action references
    and helps fuse observations reported by different exercise participants. A similar
