    #  8.4.2.2 Robustness and Program Characteristics


    Next we consider the problem of program robustness, or the ability of a program
    to survive in the face of unexpected changes. Following the results already presented,
    we focus on robustness with respect to uncertainty about internal difficulty to
    a stakeholder. One metric for this level of robustness is the level of difficulty
    at which the stakeholder''s hardness catastrophe occurs for a specific stakeholder,
    as discussed above. A high level of robustness means the enterprise can adjust
    incentives to maintain the stakeholder''s development activities optimally, even
    if the internal difficulty to that stakeholder turns out to be high.


    An important question for SE programs is: what characteristics give rise to a
    high robustness level? Here, we vary the extent to which synchronization among
    the stakeholders is important to the overall effort, relative to individual effort,
    keeping the operational value of the program constant. This is done by choosing
    different values of the constant $b$ and renormalizing the system value as:


    ```

    $v_i(u_1(t), \dots, u_n(t), r_1(t), \dots, r_n(t)) = \n\sum_{j=1}^n a_j + n \cdot
    b \int_0^n [\sum_{j=1}^n [a_j \cdot g(u_j(t))] + b \cdot \sum_{j=1}^n r_j(t) /
    n \prod_{j=1}^n g(u_j)] \cdot dt \n (8.51)

    ```


    A measure of importance of synchronization can be expressed by the parameter,


    ```

    $I = \sum_{j=1}^n a_j + n \cdot b \n (8.52)

    ```


    Numerical simulations indicate in Figure 8.9 that there is a middle range of synchronization
    importance at which robustness is maximized. As described before, the scenarios
    analyzed involve three stakeholders, and the internal difficulty to one of the
    stakeholders is varied. An interpretation of these results is that if the synchronization
    importance is too high, the difficulties experienced by stakeholder 3 bring down
    the other stakeholders, and hence the entire system, relatively soon. At the other
    extreme, if the stakeholders work independently, then stakeholder 3 does not derive
    any benefit from the other stakeholders'' efforts which might counterbalance its
    own difficulties. Hence, there is a middle ground where robustness is maximized.'
