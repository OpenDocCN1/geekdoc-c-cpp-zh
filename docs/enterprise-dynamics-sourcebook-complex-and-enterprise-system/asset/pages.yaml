    # 4.1 Introduction


    Multiple dimensions of complex large-scale enterprises—including number of stakeholders,
    emergent properties, changing environments and landscapes, and uncertain futures—pose
    enormous challenges requiring the contribution of multiple disciplines, theories,
    and methods. These multiple dimensions are categorized here using the policies,
    organizations, economics, and technology (POET) covering policy, organization,
    economics, and technology. Describing and analyzing the dynamic interactions across
    these POET dimensions in the operations and transformation of complex enterprises
    are the objectives of enterprise dynamics.


    This chapter summarizes a diverse set of models and methods that can be drawn
    upon to address specific aspects of the enterprise as functional source modes.
    Several have been applied in the enterprise systems engineering and architecture
    (ESE/A) case studies presented in Section II of this textbook. They represent
    differing perspectives across disciplines and are drawn from an even larger population
    of methods that are used for similar analytical purposes. The dynamics of a multi
    mission or undertaking (a multiagent enterprise) can be best considered as a complex
    system-of-systems (SoS) amenable to modeling and simulation.


    Because most models and, indeed, disciplines describe partial, albeit important,
    aspects of an enterprise, there is a need to integrate or more strongly unify
    them to provide the more comprehensive perspective required to plan and manage
    enterprisewise transformation. The analytic concept of a unifying framework that'
