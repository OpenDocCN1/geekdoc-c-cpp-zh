  md: '# 24 Enterprise Dynamics Sourcebook


    # 3.1 Introduction


    The current state of systems engineering (SE) and enterprise architecting (EA)
    is reviewed in this chapter along with enhancements to portray an integrated approach
    to enterprise systems engineering and architecting (ESE/A). The objectives of
    the enhancements described here are to advance the state of EA and SE practice
    from predominantly static and deterministic approaches to dynamic and probabilistic
    ESE/A.


    This integrated approach draws on concepts of enterprise dynamics using models
    to describe mission performance, organizational change, cost elements, and technologies
    (Glazner 2009). Managing and enhancing the performance of public and private enterprise
    activities is the subject of architecting and modeling to apply the disciplines
    of management science, probability theory, organizational theory, systems engineering,
    and socioeconomics. Each discipline addresses specific dynamic elements of the
    enterprise from a unique perspective and, using hybrid modeling approaches, contributes
    a robust foundation for ESE/A that addresses the complexity and dynamics of the
    interacting policy, organizational, economic, and technical (POET) elements of
    the enterprise. This field has been fertile ground for research and applications
    over the past few years and is sufficiently mature to identify conceptual foundations.


    The chapter begins by reviewing the application of complexity theory to the enterprise,
    highlighting principles such as “systems thinking,” near-decomposability, scale,
    and how they can be brought to bear in the analysis of enterprise behaviors. Next,
    the concept of frameworks is introduced as a holistic construct for managing enterprise
    complexity, with an eye toward its application for understanding enterprise dynamics.
    The chapter concludes with a discussion of how frameworks and the theories and
    constructs of organizational science can be brought to bear for an understanding
    of the complexities of enterprise dynamics.


    # 3.2 Complexity in Enterprises


    Organizations have long considered “complex” in the casual use of the term, however,
    the study of them as complex systems did not begin until the 1950s and 1960s as
    a result of research done in the fields of general systems theory (GST) and cybernetics.
    These contemporary fields gave rise to modern notions of systems and complexity,
    although they studied different aspects of complexity in systems. GST sought to
    identify and understand common structures, behaviors, and attributes of many kinds
    of systems across scientific disciplines, ranging from biology to sociology (von
    Bertalanffy 1956). Cybernetics studied the capability of systems for self-regulation
    through feedback and environmental sensing. Although cybernetics often focused
    on the study of technical systems, its followers applied their analyses equally
    to organizations and other sociotechnical systems.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# Foundations of Enterprise Systems Engineering and Architecting ■ 25


    The term complex system was used by both GST and connectivity to describe a general
    class of system that exhibited behaviors were difficult to predict. Herbert Simon
    (1962, p. 468) noted “by a ‘complex system’ I mean made of a large number of parts
    that interact in a non-simple way. In such systems, the whole is more than the
    sum of the parts, not in an ultimate, metaphysical sense, but in the important
    pragmatic sense that given the properties of the parts and the laws of their interaction,
    it is not a trivial matter to infer the properties of the whole.


    Complex systems can be technical or social systems, or by their key feature is
    the interaction of their parts. Ever cybernetics, which tended to focus on technical
    systems such as fire control radars, saw how organizing organizations in terms
    of the interaction of their major elements could help in understanding their behavior.
    Norbert Wiener, one of the fathers of the cybernetics movement, noted that “we
    must consider (organizations) as something in which there is an interdependence
    between the organized parts” (Wiener 1956). If the interdependence of the parts
    could be understood and characterized, the behavior of the system could be understood.


    # 3.2.1 Applying Complexity Theory to Enterprises


    The study of complex systems requires a balance of contrasting perspectives depending
    on the context of the system: holism versus reductionism, top-down versus bottom-up.
    The perspectives and analytical approaches in a study of complex system are contingent
    on the system under study and the particular dynamics being investigated. There
    is no single approach that is best suited to the study of all complex systems
    and for all questions (Mingers and Gill 1997).


    The study of enterprises as complex systems presents researchers and managers
    alike with a broad array of challenges. Enterprises may be designed from the top
    down or evolve from the bottom up and in all cases emergent behaviors requiring
    a response. They are both centrally directed and dependent on the actions of agents
    who make locally rational decisions dependent on their local incentives. Accordingly,
    different bodies of research and practice have been built different approaches
    for managing the complexity of the enterprise.


    # 3.3 Organizational Science


    At its core, organizational science is the study of the structure, behavioral
    dynamics, and design of organizations. It seeks to identify scientific principles
    that can be employed to describe how organizations are structured and how they
    behave their environments and offers suggestions on how new organizations can
    be designed. Organizational science uses the organization as its unit of analysis.
    This can be seen in contrast to the study of enterprises, which is often more
    practically oriented and'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Enterprise Dynamics Sourcebook


    uses the enterprise as its unit of analysis, extending the organizational construct
    to incorporate an extended value chain that includes stakeholders and its environment.


    Although both "rational" and the "natural" perspectives of organizational science
    have contributed greatly to the understanding of organizations, the "open systems"
    perspective is more suited to understanding the broader concept of enterprises.
    The open systems perspective places an emphasis on challenging the boundaries
    of the organization while also examining the nature of its interdependencies (Thompson
    1967). It recognizes that organizations often exhibit a high degree of coupling
    (Cyert and March 1963), which can allow the system to be more adaptive and flexible.
    This perspective is most likely to include analysis of an enterprise''s environment,
    processes, technologies, and products in organizational forms and decision-making
    (Scott and Davis 2006). The open systems perspective tends to take a more holistic
    approach to analysis than either of the two perspectives of organizational science.
    From the vantage point of the enterprise architecture, the primary areas of interest
    within the open systems perspective of organizational science are contingency
    theory and the closely related field of organizational design.


    The field of organizational design capitalized on the work of contingency theorists
    with the aim of providing prescriptive guidance to those wishing to design organizations.
    In the study of organizational contingencies, proponents of organizational design
    advocated the study of such areas as work flows, control systems, information
    processing, planning mechanisms, knowledge transfer, and their interactions. The
    field of organizational design tends to be applied more than just other fields
    within organizational science; organizational designers seek to change and improve
    organizations from a managerial perspective rather than describe and understand
    them from a theoretical perspective (Scott and Davis 2006).


    An organizational designer embraces the complex systems philosophy of "more than
    the sum of its components" (Scott and Davis 2006). As heavy emphasis was placed
    on understanding the fit and interdependence of an organization''s design components,
    Thompson, a contingency theorist, is considered an early pioneer of organizational
    design for his work in identifying and categorizing interdependencies in organizations
    and the dimensions of coordination in organizations (Thompson 1967).


    # 3.3.1 Computational Organizational Science


    Quantitative analysis of the architecture of enterprises is largely missing from
    both the contingency theory and organizational design liter. This is a critical
    connection to managing organizational change in coordination with other elements
    of a transformation program. There are few tools to quantitatively assess trade-offs
    made in organizational design, or to assess one architecture against another.
    Due to the inherent complexity of enterprises, closed-form mathematical'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# Foundations of Enterprise Systems Engineering and Architecting ■ 27


    or logical analysis of designs is limited to the absolute simplest structures,
    as the analysis of the complementarity of structure and strategic fit performed
    by Milgram and Roberts (1995). Analysis of modest real-world organizational forms,
    processes, and behaviors require the use of computer simulation models capable
    of modeling the enterprise as a network of interacting adaptive components over
    time.


    Research organizations’ interest in using simulation models is not a recent development.
    Going back several decades, organizational design theorists advocated the use
    of simulation models where "all variables and relationships of interest are linked
    as understatus in a model and then the manager-analyst-researcher manipulates
    certain ones and observes how changes of the system plays out" (Swinth 1974).
    The desire to use simulation models, it was many years before simulation techniques
    and computational power matured enough to be applied to the types of problems
    of organizational scientists.


    Carley (1995) was among first to advocate the creation of a new discipline within
    organizational science, "computational organizational science," arguing that virtual
    experiments employing simulation models could be used for the purpose of creating
    and testing organizational theory, especially for the application of complexity
    theory to the organization to understand how models adapt and evolve. Simulation
    models allow organizational researchers to create controlled, easily manipulated
    experiments where real-world "natural experiments" inside organizations are not
    feasible due to cost, scope, or ethical considerations (Fowler 2003). Techniques
    such as agent-based modeling allow the creation of simulation models that capture
    the behavior of an organization at multiple scales by simulating the interaction
    of elements. Each models allow analyses of how organizations search, adapt, and
    learn in changing environments.


    Computational organizational science has come to focus primarily on taking a complex
    adaptive view of organizations and has simulation models to establish theories
    for how organizations evolve and adapt in uncertain environments, especially from
    a bottom-up perspective (Anderson 1999). Although still in its infancy, computational
    organizational science shows much promise at developing theory that enterprises
    adapt at multiple scales to changing environments.


    Computational organizational science primarily uses simulation models in a theory-generative
    or testing-role rather than as an analysis tool in the process of organizational
    design. The models employed to date have been highly abstract "toy" models that
    served to prove an hypothesized mechanism, rather than as a simulation of a real-world
    organization or system. Although such simple models have proved valuable in the
    creation of new organizational theories (Rivkin and Siggelkoop 2003; Ethiraj and
    Levinthal 2004), they cannot be considered tools that can be used by managers
    as analysis tools in organizational design. These "toy" models are far too abstract
    for managerial application. The aim of computational organizational design is
    to develop new theory, not to create new architecting and analysis tools.'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'Breaking from the tradition of using simulation modeling exclusively for theory
    generation, Levitt (2004) argues that the development of analysis tools for organizational
    design has been hampered by the lack of robust theory that supports it. He then
    argues that this is changing, and two major strands of organizational research
    have provided the foundations for a theory strong enough to support analysis tools
    that can be used to design organizations:


    +   1. The information-processing view of the organization (March and Simon 1958;
    Galbraith 1973) provides the framework for agent-based simulation models at the
    micro levels through an understanding of information paths and local incentives.

    2. Contingency theory provides the macro-level propositions that relate structural
    format to context, based on empirical observation.


    By bringing together theory of organizations from both top-down and bottom-up
    perspectives, Levitt argues that simulation models can link these perspectives
    and should be used to analyze the potential performance of organizational design
    in different environments. He states that simulation technologies have come of
    age, making the simulation of organizational design both technically and theoretically
    supportive.


    # 3.3.2 Resolving Gaps in Organizational Theory for Effective Dynamic Organizational
    Design


    Organizational science as a whole has stroved to create rigorously developed,
    generalizable theory with broad exploratory powers. Organizational theory is capable
    of providing normative guidance to managers seeking to direct the transformation
    of their enterprise, but it does not provide managers and architects with the
    tools to analyze and apply the theory to their own enterprises quantitatively.
    Ideally, managers would adapt and change their organization''s design based on
    a careful consideration of current organizational theory, however studies have
    repeatedly shown that managers tend to adapt their organization''s design using
    a costly "trial and error" process based upon experience rather than theory (Tatum
    1983). Levitt argues that without the ability for managers and architects to analyze
    potential changes to their own architecture before they are implemented, it is
    impossible to create an effective archiving process. Without an effective process,
    the enterprise will revert to the ad hoc trial and error approach (Levitt 2004).


