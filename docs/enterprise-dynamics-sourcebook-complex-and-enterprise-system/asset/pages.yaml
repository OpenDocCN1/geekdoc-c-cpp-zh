    # 10.1 Introduction


    This chapter presents a framework for the use of a materials flow model and dynamic
    influence diagram, to develop system insight into the U.S. Department of Energy’s
    (DoE) responsibility for environmental cleanup of legacy nuclear waste. This framework
    is used to explore policy options, analyze plans, address management challenges,
    and develop mitigation strategies for the DoE Office of Environmental Management
    (EM). The societal complexity of EM missions compels the use of a qualitative
    approach to analysis a more quantitative discrete event modeling effort. We use
    this analysis to drive scenarios for the model, pinpoint strategy and leverage
    points, and develop a shared conceptual understanding of the problem space among
    stakeholders. This approach affords the opportunity to discuss problems with a
    unified conceptual perspective and is also general enough to apply to a broad
    range of capital investment/production operations problems.


    In the aftermath of the Cold War, the United States was left with a formidable
    legacy of radioactive waste, the by-products of the creation of nuclear weapons
    and nuclear energy research. This is a challenging proposition, as the difficult
    and intensive technical process for disposal of nuclear waste is further complicated
    by regulatory, legal, and budget constraints. The challenge for the EM is to understand
    the myriad processes, alternatives, and policy constraints of these operations
    from a system perspective, allowing them to better manage the system toward program
    completion and facility closure on time and budget.


    # 10.2 Background


    # 10.2.1 Background—Mission


    The DoE is responsible for cleaning up the environmental legacy from five decades
    of nuclear weapons development and government-sponsored nuclear energy research.
    In 1989, the DoE established the EM program to address these problems. Sites once
    involved in the production of nuclear weapons, such as the Savannah River site,
    are now tasked with properly disposing of surplus nuclear materials and radioactive
    waste by-products.


    The EM mission encompasses the decontamination and decommissioning of nuclear
    production facilities, the safe disposal of highly radioactive liquid waste stored
    in underground tanks generated from reprocessing surplus used nuclear fuel'
  merge: -1
  pgno: 259
- img_proc: true
  md: '(UNF), the retrieval of nuclear contaminated waste buried at sites that are
    threat-ening the environment, and the burial of nuclear contaminated material
    that meets legal standards for final disposition.


    # 10.2.2 Background–Program Management


    In 1998, EM developed a "projectized" approach to cleanup, which more fully defined
    the life-cycle scope and cost of the EM program (DoE 1998). The Paths to Closure
    marked the evolution to a more discrete project management approach for over 350
    projects at DoE sites. Four years later, a comprehensive review was published
    (DoE 2002) recommending a renewed focus on completing projects with appropriate
    performance-based contracts, comprehensive risk prioritization approaches, and
    business processes focused on accelerated risk reduction and tighter controls
    on cost and schedule.


    In September 2005, the House and Senate Energy and Water Development Appropriations
    Subcommittee (NAPA) requested the National Academy of Public Administration (NAPA)
    to conduct a management review of EM. Over the 19-month NAPA study (NAPA 2007),
    EM worked closely with the Academy panel and staff to implement recommendations
    during the study period before the report was published. The study panel investigated
    how EM was organized and managed, its human capital, acquisition, and project
    management operations.


    Throughout this period of internal reforms, continuous improvement, and external
    oversight, EM has been evolving its management practices and business systems.
    EM has formalized these efforts with "Journey to Excellence" initiatives to institutionalize
    the evolution to best-in-class processes and practices.


    # 10.2.3 Objectives


    The EM program scope illustrates the complex system of systems inherent in large-scale
    government programs. The program spans a long time interval, with estimates extending
    out to 2050 and 2062 timeframe (DoE 2010, p. 8). Large investments in the billions
    of dollars are involved. The risks are very high. Cost escalation, delays, and
    technical problems can undermine the feasibility, jeopardize its completion, and
    lead to government inquiries. Problems in any single dimension can cause substantial
    management challenges. The challenge for EM is to better understand the myriad
    processes, alternatives, and policy constraints of these operations to better
    manage the system toward program completion and facility closure on time and within
    budget meeting performance measures.


    To date, DoE has reduced the sites requiring cleanup from 110 to 18, which represents
    a reduction in the legacy footprint from 3,125 square miles to 900 square miles
    (DoE 2011). Despite this progress, the remaining work presents unique'
  merge: -1
  pgno: 260
