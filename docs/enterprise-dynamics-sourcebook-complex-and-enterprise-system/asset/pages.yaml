  md: '# 9.3 Operator-Environment Model (Agent-Based)


    Boiney (2007) describes a systems framework for attention allocation of operators
    within the AOC, as shown in Figure 9.2. This framework was developed using direct
    field observations of operators in command and control environments (e.g., Joint
    Expeditionary Forces Experiment, JEFX ''06). The focus of the agent-based modeling
    iteration is the Attention Allocation System shown in the first. In this iteration,
    the agents are assumed to focus on only one activity at a time. Therefore, the
    Primary and Secondary Activity boxes are modeled as a single operator focus. The
    various activities that the operator must handle have priority and density (e.g.,
    related to stress) levels and can spawn additional self-activities (e.g., related
    to memory) such as completing a checklist.


    This interpretation can be visualized as an attention queue (Figure 9.3), with
    the top activity being the current focus. As the agent is interrupted, the order
    of the activities in the queue can change. If operators are interrupted frequently,
    the delay in reorienting to new activities can be increased (e.g., due to stress
    or originality). Agents can be interrupted by various communication modalities
    including chat, e-mail, and telephone, with a notional representation of the disruptiveness
    of each modality in Figure 9.3. Subject matter experts have provided following
    guidance on how much modality is used (in terms of an average utilization rate)
    in a typical command and control environment: chat: 75% (text chat: 70% and audio
    chat: 55%); e-mail: 10%; telephone: 5%; and in-person: 10%. The agent behavior
    will also depend on the agent''s past experience with the source of the interruption.
    Current behavior is expected, depending on whether the source is trustworthy (McCarter
    and White 2007), for example.


    The information itself will also affect agent behavior; it may be specifically
    related to the activity in which the operator is working, changing the operator''s
    priorities, or a distraction (e.g., media report or pilot-down). Therefore, each
    interruption is associated with: (1) the agent''s past experience with the information;
    (2) the information type; (3) a communication modality; and (4) whether an attention
    allocation attract is present. Attention attractors are defined as elements of
    higher interest, being drawn to human faces and voices, changes in the environment
    (if not gradual), informal conversation (versus formal language), bright colors,
    signs of imminent danger, and anything novel or unexpected or unresolved (Biney
    2007). For example, operators sometimes scan 10 rooms when only four are actively
    used. In this instance, one question is whether it is possible to develop a smaller
    interface (e.g., summary display) that still provides value to the operator through
    the use of social network software and rule correction (Biney 2007). The degree
    of disruptiveness of the attention attractor can span a wide range as illustrated
    in Figure 9.4.'
