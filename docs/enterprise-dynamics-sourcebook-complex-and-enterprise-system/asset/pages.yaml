  md: '# Modeling the Nation''s Healthcare System as a Dynamic Enterprise ■ 321


    +   - National accounts and statistics should address requirements for health
    and safety data from private sector enterprises and responsible government agencies.

    - An integrated planning methodology must be employed to ensure that projects
    are viable in the context of the overall system, and that all potential risks
    are identified.

    - The systems methodology can reveal inconsistencies and imbalances in market
    that must be understood by all participants in a project.

    - Uniform approaches to effectiveness and cost accounting should be developed
    and promulgated among stakeholders.


    Projects and policies often fail due to deficiencies in the infrastructure. A
    large number of these must be considered to be “system failures” and indicate
    that the system configuration, capacities, and bottlenecks must be defined and
    managed by private and public sector institutions. In addition:


    +   - The role of stakeholders must be defined.

    - All critical labor, material, resource requirements for healthcare transformation
    should be identified and their markets should be tracked.

    - Government policies affecting projects and private sector activity should be
    based on realistic physical and financial information. Policies and regulations
    should be based on a cost-benefit analysis taking technological capabilities and
    costs into account, reflecting lively market responses.


    Access and usability of the RHSS as an integrated healthcare information system
    can be promoted by the use of state-of-the-art information and communication technology.
    For example:


    +   - Data should be generated in relational and object-oriented format for accessibility
    and ability to support hoc reports and analyses.

    - A geographic interface should be provided for access and analysis across regions
    and demographic characteristics.

    - System simulation or optimization with animation is feasible and should be used
    to help make the information more useful for policy formulation and decision making.

    - Material system models should be integrated with economic policy models.


    It is clear that close and continuous coordination must be maintained between
    financial planning and policies addressing markets and the physical projects planned
    and implemented by the private sector and government. A comprehensive healthcare
    information system can support such coordination.

    In summary, the concepts and supporting tools are sufficiently well developed
    for immediate application to a well-defined policy or program where the relevant
    technical and economic data can be collected from existing sources. Additional'
