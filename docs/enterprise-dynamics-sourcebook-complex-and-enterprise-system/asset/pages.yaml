    increasing with time. For parameter values of $A=B=C=F=1$ with $d_0=5$ and $k_0=3$,
    with $T_0=0$ and $T_f=10$, Wojcik and Hoffman (2006) report a critical value of
    $D_c=-1.02467$, at which the rates of increase approach infinity in this simple
    model. The simple model does not include many real-world constraints, which of
    course do not permit infinite rates.


    #  8.5 Conclusion


    Instantiations of the framework presented here for modeling the SE process behavior
    patterns that can be compared to SE programs. Quantitative validation of these
    models is likely to be limited, but there is nevertheless potential for the models
    to be used for education, information sharing, SE program diagnostics, and early-stage
    screening of SE management and governance approaches.


    Specific modeling results of interest include the “one-third” rule for development
    time, relative to total system lifetime, of systems with moderate internal complexity,
    and deviations from the one-third rule for systems with other levels of internal
    complexity, as well as deviations due to such effects as system aging and external
    complexity. Systems developed in stages also have characteristic optimal development
    times relative to total system lifetime, and the “HOT” model originally developed
    (Wojcik 2004) to model the systems engineering process is shown'
