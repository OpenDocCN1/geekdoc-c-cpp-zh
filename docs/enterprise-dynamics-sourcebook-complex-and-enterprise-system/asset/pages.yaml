    # 8.4.1.1 Tragedy of the Commons


    An obvious incentive scheme is to reward each stakeholder according to the final
    result of the SE process, achieved across all stakeholder efforts and presumably
    enhanced by greater synchronization among the stakeholders. A similar case is
    where the stakeholders benefit directly from the final system and hence may be
    motivated to synchronize and otherwise contribute to the quality of the final.


    With such an incentive scheme, an individual stakeholder is rewarded for the contribution
    to the final result of the SE process, but stakeholder does not receive the rewards
    to the other stakeholders. This is an example of economic "externality"; that,
    each stakeholder does not see the full benefit of synchronization. Externalities
    are seen in other domains such as ground transportation, where the typical effect
    is overuse of a limited resource. However, it is sometimes referred to as the
    "tragedy of the commons" (TOC) (Hardin 1968). In the case of SE stakeholders,
    the effect is under-synchronization across the set of stakeholders, despite the
    fact that each stakeholder decides in its own self-interest. The under-synchronization
    occurs because each stakeholder does not receive the benefit that goes to other
    stakeholders from its synchronization; hence, all stakeholders tend to be better
    if synchronized more than they do at equilibrium.


    There are well-known mitigations of TOC to prevent overuse of a limited resource,
    including some that efficiently internalize the costs of economic externalities
    (Ellis and den Nouveld 2000). TOC mitigations include establishing control mechanisms
    (e.g., centrally planned transportation systems (Cantarela and Sforza 1991)) or
    penalties to remove economic externalities (e.g., congestion pricing for used
    highways), and providing mechanisms for resource users to reach binding agreements
    not to overuse the limited resource. The analogies for stakeholder synchronization
    are threefold.


    First, stakeholders can be constrained with each other by the enterprise. For
    example, in the case where the stakeholders consist of a set of contractors, contracts
    can be written to require synchronization. This approach suffers from the great
    disadvantage of limited adaptability: as the SE program proceeds and changes condition,
    requirements for synchronization, as originally conceived and written into contracts,
    may cease to be helpful. Furthermore, it is not'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Optimal Control and Differential Game Modeling ■ 203


    feasible at all to bind many kinds of stakeholders through contractual or other
    legal arrangements.


    Second, stakeholders can be provided with additional incentives to synchronize
    further. These can be financial or nonfinancial incentives provided by the enterprise.
    However, at some point the cost of such incentives will exceed the benefits of
    providing them. Modeling of stakeholder incentive provision leads to another set
    of behavioral patterns discussed later in this chapter.


    Third, an environment can be fostered that facilitates a “cooperative game” among
    stakeholders, with effectively “binding agreements” between stakeholders to help
    ensure they will not defect from a position of higher synchronization than in
    their immediate self-interest. This could be accomplished through an “enterprise
    culture” that rewards good synchronization behavior and punishes bad behavior.
    These rewards and punishments need not be financial, and can be introduced at
    any level of an organization, including individuals in the organization. For example,
    special recognition rewards individuals who are especially active in coordinating
    across organizations to achieve synchronization. And, if opportunities to synchronize
    repeatedly throughout the SE program, or multiple SE programs, then good synchronization
    can be promoted through a “tit for tat” threat across time (Axelrod 1984).


    # 8.4.1.2 Multiple Equilibria


    Another general characteristic of many types of games is the existence of multiple
    equilibria. That is, the solution to the game is not unique. Using the specific
    instantiation of a stakeholder synchronization game described in the next section,
    such multiple equilibria have been observed. Interpreting each equilibrium as
    an “attractor” for collective behavior, multiple equilibria means that collective
    behavior may be attracted in multiple directions, which may depend upon seemingly
    insignificant or capricious factors that might direct collective behavior in one
    direction as opposed to another. In this sense, there are fundamental limits to
    predictability of stakeholder systems, even ones for which extensive and detailed
    information about motivations and costs is available, and in which stakeholders
    behave “rationally”.


