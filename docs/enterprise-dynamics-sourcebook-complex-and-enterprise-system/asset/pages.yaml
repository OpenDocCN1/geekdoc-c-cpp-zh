  md: '# Enterprise Dynamics Sourcebook


    Many alternative management options are available during both transformation and
    operations. Regardless of the option selected, achieving successful multiagency
    governance structure that operates on a comprehensive information base. An architecture-based
    approach to governance can help to resolve this complexity and the many organizational
    accountability and control issues that arise in the multiagency environment. This
    approach will ensure that routine management tasks are integrated across the multiple
    agencies and responsive to the strategic direction and assigned responsibilities.


    The definition of the required level of organizational and technical interoperability
    is a major factor in multi missions. The level of interoperability depends on
    the mission and can vary among the specific activities performed. In any case,
    it is a strong factor in the assignment of responsibilities and accountability.
    Specifically, the level of information sharing and provisions for accountability,
    information quality, privacy, and security are closely tied to the required level
    of interoperability.


    This chapter focuses on the contributions of technical and operations managers.
    They can play an equally important role throughout all operational phases of multiagency
    missions. Well-formulated operational activity and service definitions incorporated
    in the architecture can be used to manage enterprise services and applications,
    and for financial reporting and performance management. Despite this potential,
    architectures are underutilized as a strategic planning and operations management
    resource. The relationships described here to other enterprise planning and management
    systems suggest how multiple agencies can realize the full potential value of
    major investments made in EAs.


