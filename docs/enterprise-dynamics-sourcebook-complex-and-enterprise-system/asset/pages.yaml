    # 12.1 Introduction


    This application provides an example of an enterprise systems engineering challenge
    at the largest scale, crossing major materials and energy-related sectors of a
    nation''s economy. The objective is to illustrate a comprehensive ESE framework
    for planning, analysis, and the management of natural resources for materials
    and by private and public sector stakeholders at local, national, and international
    levels. Energy and material resource extraction, processing, and end-use activities
    are private sector responsibilities and operate under regulatory policies. Taking
    the entire system as the enterprise provides a perspective on the physical aspects
    of economic activity, the dual space in mathematical programming techniques to
    the monetary economic perspective of national accounts and gross domestic product
    (GDP). The objective of the framework is to illuminate the complexities of resource
    use and emerging technologies and their social, economic, and environmental impacts.
    It provides an indication for industry and government managers for purposes of
    informing stakeholder investment decisions and policies using decision methods
    appropriate to the complexities and uncertainties they face.


    This natural resource systems study is the largest and most comprehensive example
    of an enterprise covered in this sourcebook. It encompasses major elements of
    a functioning economy and the planning and management of government and private
    policies and investments by stakeholders. The need to understand the local, national,
    and, indeed, global implications of their collective actions represents a very
    complex ESE challenge.


    The vitality of the economy of a nation or region is based on the effective use
    of material resources such as cement, iron, aluminum, plastics, wood, and agricultural
    products for public and private infrastructure, including housing, roads, railways,
    pipelines, utilities, agriculture, medical facilities, and industrial plants.
    The associated requirements for labor and energy resources, as well as the environmental
    impacts, are related to the specific material resources used and the technologies
    employed to convert material resources to useful products and services in a developing
    economy. A value chain approach based on the reference material information system
    (RMIS), described below as a state-of-the-art information'
  merge: -1
  pgno: 293
