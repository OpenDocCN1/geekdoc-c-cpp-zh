    +   - It supports modeling a specific technology initiative ELo for examination
    (questioning, reasoning, inferring).

    - It supports adjusting and then re-examining the representation on the basis
    of emergent information.


    LSERA allows managers to reason about and gain insight from complex people, process,
    and technology interactions where enterprise analysts cannot easily construct
    algorithmic-based models.


    # 7.1.1 Modeling Challenge


    For a large complex technology initiative to support an enterprise transformation
    effectively, there must be a clear alignment of key aspects of the technology,
    the business processes directly affected, and the indirect effects on the business
    services composed of the business processes.


    Managers must structure the alignment in a principled manner to assert confidence
    that the technology initiative supports the strategic outcomes of the enterprise
    transformation. The challenges here are to identify: (a) the elements in the ELoS;
    (b) the states things can be in, such as attaining or not attaining; (c) what'
