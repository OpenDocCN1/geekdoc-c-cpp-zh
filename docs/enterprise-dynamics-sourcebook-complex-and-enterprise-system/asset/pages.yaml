  md: '# 10 Enterprise Dynamics Sourcebook


    Information Dynamics to collect and exchange information that supports sense-and-respond
    decision processes during acquisition and the transition to operations


    Technology Dynamics governing the maturity, rate, and degree of difficulty in
    employing advanced technologies for improved enterprise performance


    A comprehensive study of complexity in the forward-looking transformation to network-centric
    operations enabled by new information systems, sensors, and other technologies
    was performed by the National Research Council (NRC 2006). This study focused
    on U.S. Army applications but is referred as “… an exercise in coping with complexity.”


    Although the focus was on network-centric applications in U.S. Army, the network-centric
    paradigm is being applied to transform government services, commercial supply
    chains, and healthcare and the conclusions and recommendations directly to that
    wide range of enterprise domains. A major point of interest in the NRC report
    is the statement that “… trying to implement net-centric operations as envisioned
    is like trying to design and build a modern combat jet aircraft without resorting
    to the science of fluid dynamics.” This statement reinforced the importance of
    the enterprise dynamics research program that was progress at the time and suggested
    a strong focus on transformation challenges in network-centric or network-enabled
    enterprises.


    The NRC report identified a number of challenges in ESE/A process described in
    the following chapters, including the following:


    +   - Lack of overall integrating architectures and systems engineering for enterprise
    networks

    - Inadequately trained, educated, and certified personnel and network users

    - Network management and lack of joint network configuration management

    - Network security and information assurance

    - Requirements to model, simulate, and test large networks before deployment

    - Fusion of multiple sensors and sensor types across the network for renewal time
    making

    - Design and integration of individual service networks

    - Understanding of the relationship between network structure and complexity and
    its impact on organizational design and individual and unit behaviors

    - Energy-efficient electronics to reduce soldier loads and simplify logistics
    support'
