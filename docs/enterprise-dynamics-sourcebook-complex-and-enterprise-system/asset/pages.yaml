    mapping expected progress during acquisition and implementation of new enterprise
    capabilities. The core model must be sufficiently flexible to incorporate additional
    dynamic state-space elements from other source modules and to increase its level
    of fidelity on such elements when required to support specific management decisions.


    In the generalized concept of the unifying framework, the structure of the core
    enterprise model will be based on the strategic planning and analysis study to
