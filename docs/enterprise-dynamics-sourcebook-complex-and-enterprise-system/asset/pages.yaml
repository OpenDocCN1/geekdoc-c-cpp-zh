  md: '# Energy and Materials Systems as an ESE Application ■ 283


    # 12.6.4 Transition to Infrastructure Operations


    The data and modeling methods outlined in this chapter are applicable to the planning
    and implementation of resource and infrastructure development projects supporting
    economic transition and development. Information systems described are also applicable
    to the management of resource extraction, materials conversion, and infrastructure
    operations by responsible units and other operators. Extensions to this framework
    would be needed to deal with logistics, local market, and labor supply issues.


    GISs are commonly applied for automated mapping and facilities management applications.
    Most commercial products incorporate direct linkages to relational and object-oriented
    databases describing:


    +   - Resources in place and extraction operations

    - Facility configuration and capacities

    - Infrastructure configuration and operating status (pipelines, transmission lines,
    communication cables, water systems, etc.)

    - Distribution facilities

    - Infrastructure development project status


    If the methods developed for planning and implementation of materials processing
    and infrastructure projects follow the recommended approach, they can be supplemented
    to provide tools for operational management.


    # 12.7 Analysis Results and Recommendations


    # 12.7.1 Applications of the Reference Materials Information System*


    The technoeconomic models and methods outlined in the approach have been applied
    in a variety of studies ranging from material selection for a specific product,
    to national energy/materials research and development (R&D) planning.


    The initial purpose in developing the RMIS was to support the National Research
    Council Committee on Renewable Resources for Industrial Materials, (CORRIM 1976).
    The RMIS was used successfully as an integrating framework to document the technical
    and economic characteristics of concepts proposed by a number of subcommittees.
    A number of R&D and policy recommendations were made to promote the use of renewable
    resources as a substitute for petroleum feedstock.


