  md: '# Enterprise Modeling Approaches and Applications


    This case study represents a major step forward in the foundational discipline
    that supports ESE/A through the concept of dynamic architecting. The application
    described implements a dynamic model and simulation with the comprehensive structure
    of an EA as defined by federal and commercial EA guidelines. The approach overcomes
    a major deficiency in the static nature of most architectures by joining this
    widely-practiced enterprise planning and management method with Enterprise Dynamics.


    # Chapter 7: Reasoning on Technology Uncertainties for Enterprise Transformation


    This chapter describes a method for reasoning about the likelihood of attaining
    desired performance dynamics resulting from emerging dynamics, and uncertainties
    within an enterprise or its environment. A basic principle is that mission performance
    occurs from the individuals understanding the dynamic interactions of people,
    process, and technologies. Individuals reason on dynamic interactions producing
    insights into likely performance after given the interactions. Individuals increase
    their understanding and their subsequent decisions and actions changed because
    of their improved collective understanding.


    The method uses evidential reasoning and Mult Bayesian Networks (MEBN) to compose
    arguments about the relationship of technology initiatives to strategic outcome
    attainment. A federal program example illustrates the method.


    # Chapter 8: Optimal Control and Differential Game Modeling of a Systems Engineering
    Process for Transformation


    This case study describes a unifying framework for modeling Enterprise Dynamics
    in the ESE/A process, across a range of enterprise and program types and is demonstrated
    on a strategic transformation program. The framework is a control theoretic formulation
    that uses state and control parameters relating to the enterprise, stakeholders,
    and the environment with which the enterprise interacts. The framework explores
    the individual self-interests of stakeholders and environmental players as a differential
    (dynamic) game, which is explored and interpreted in terms of game-theoretic Nash
    equilibrium. It provides a mathematical basis for relating and/ integrating the
    diverse ESE/A modeling methods.


    # Chapter 9: Hybrid Systems Dynamics, Petri Net, and Agent-Based Modeling of the
    Air and Space Operations Center


    This chapter describes an innovative systems engineering effort to model the policy,
    organizational, and technical aspects of a mission critical national defense operation.
    The application uses systems dynamics, Petri net, and agent-based multiscale modeling
    to understand the effect of operator-environment interaction and the global environment
    on Air and Space Operations Center (AOC) processes. AOC process model is linked
    (e.g., critical event process time and probability of errors) to a global-environment
    model that is driven by the political landscape in which the AOC operates.'
