    # 7.3.1 LSERA Argument Model


    The purpose of the LSERA argument model is to present the ELoS argument in a simple
    language and logic. This facilitates reasoning by enterprise managers and translating
    into a probability model by analysts. The argument model is a knowledge base consisting
    of six fundamentals: entities, hypotheses, directed relations, evidence credentials,
    cause-and-effect criteria, and IF–THEN reasoning. The following is a description
    of each of the six fundamentals.


    # 7.3.1.1 LSERA Entities


    LSERA entities are real things or concepts of interest in the enterprise’s domain.
    For LSERA, the set of entities comes from a review of evidential reasoning theory,'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# 156 Enterprise Dynamics Sourcebook


    MEBN theory, enterprise architecture frameworks, and the Federal Enterprise Architecture
    Performance Reference Model. These LSERA entities are what managers want to reason
    about when they assert that a particular initiative will directly or indirectly
    support the attainment of an enterprise''s mission results, customer results,
    and strategic outcomes. There are 18 LSERA entities in four groupings: behavioral,
    performance, artifact, and evidential; see Table 7.2.


    # 7.3.1.2 LSERA Hypothesis Sets


    Given entities, managers can make assertions about the entities, for example,
    that the process will attain its performance. An hypothesis set is how the enterprise
    expresses assertions about the LSERA entities. LSERA contains three hypothesis
    sets of mutually exclusive and collectively exhaustive statements. These are behavioral
    hypotheses, performance hypotheses, and information hypotheses. Behavioral hypotheses
    are how a real-world entity is likely to behave as a combination of its specific
    behaviors and in relation to a specific set of conditions. The behavioral hypotheses
    are described as exceed, attain, and relative to the desired behavior. Performance
    hypotheses are assertions about the measurable performance of the behavioral entities.
    The hypotheses are higher, and lower than the range of the specified target value.
    Enterprise subject matter experts define the acceptable range around the target
    value. Information hypotheses are assertions about the quality of supporting artifacts
    within the LSERA argument. The LSERA method defines quality broadly, and a particular
    enterprise will define it for a particular argument context. The information hypotheses
    are high quality, acceptable, and low quality. For LSERA, these states indicate
    comparison of an artifact against an agreed-upon standard.


    # 7.3.1.3 LSERA Directed Relations


    A relation is a meaningful connection or association between two or more things
    on the basis of the relevance of influence, if “A influences B,” then this is
    a directed relation and it is represented by an arrow. A key characteristic of
    LSERA is a set of directed relations. The LSERA argument model is not a free argument;
    it is a prescribed structure that forms a template for developing most LSERA ELOs
    arguments. This is different from enterprise architecture frameworks that permit
    defining any relation among their entity instances without expressing the nature
    of the relation.


    LSERA has two kinds of directed relations: causal and inferential. In causal,
    the parent’s (A) behavior influences the child’s (B) behavior, as in, “A causes
    B.” In inferential, the state of the parent simply infers something about the
    child, as in, “Given an acceptable technical architecture, then it is like the'
