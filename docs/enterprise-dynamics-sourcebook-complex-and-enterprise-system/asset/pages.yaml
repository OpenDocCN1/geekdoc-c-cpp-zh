    # 12.3 Statement of the Enterprise Transformation Challenge


    The Transformation envisioned for this case study stems from the need to produce
    the physical goods required by a growing economy using natural resources in a
    more sustainable manner while addressing environmental concerns such as water
    use and potential climate change.


    The Energy Independence and Security Act of 2007 outlined a series of transformation
    objectives for the U.S. energy system to increase the security of the United States.
    Elements of this Act included:


    +   Increasing the supply of alternative fuels by setting a mandatory Renewable
    Fuel Standard (RFS) requiring fuel producers to use at least 36 billion gallons
    of biofuel in 2022.


    +   Reducing U.S. demand for oil by setting a national fuel economy standard of
    35 miles per gallon by 2020, which will increase fuel economy standards by 40%
    and save billions of gallons of fuel.


    +   Requiring that all general purpose lighting in federal buildings use Energy
    Star® products or products designated under the Department Federal Energy Management
    Program (FEMP) by the end of Fiscal Year 2013.


    +   Updating the Energy Policy and Conservation Act to set new appliance standards
    that will save Americans money and energy.


    +   Establishing an Office of High-Performance Green Buildings (OHPGB) in the
    U.S. General Services Administration.


    The Energy Information Administration (EIA) 2007) has to gauge the impacts on
    energy supply–demand balances. The Act will also have major effects on the transformation
    of other sectors of the economy to produce biofuels from agricultural products,
    composite materials for lighter-weight vehicles, batteries for hybrid vehicles,
    and “green” building materials. Analysis of these transformations requires a broad
    perspective on materials and energy systems and their interactions. In turn, agricultural
    impacts, will raise water use, land use, and significant trade issues.


    There are additional demands on the economy that are very materials intensive,
    such as replacement of aging infrastructure, including bridges, pipelines, and
    water supplies. The European community is emphasizing energy and communications
    infrastructure as an investment priority for the future. Infrastructure issues
    are also a significant factor for nations in transition to a market economy and
    in most developing countries. When viewed from a global perspective, these collective
    activities'
