    # 7.3.2 LSERA Inference Model


    The purpose of the LSERA inference model is to support principled reasoning within
    ELoS arguments and manage the effect of emergent evidence on existing argument
    inferences. It does this by associating the argument model relations to Bayesian
    network fragments and then combining the fragments into a single model representing
    the ELoS argument. MFrags, probability distributions, combination rule, and evidence
    force measurement.


    # 7.3.2.1 LSERA MFrags


    LSERA uses MEBN theory. MEBN theory supports encoding the knowledge structure
    of the LSERA argument into Bayesian network fragments and combining the fragments
    into larger networks for inference and examination. The LSERA inference model
    is a set of 46 MEBN MFrags, one for each directed relation in LSERA. By combining
    the MFrags in a principled manner, the analyst produces a situation-specific Bayesian
    network representing the ELoS.


