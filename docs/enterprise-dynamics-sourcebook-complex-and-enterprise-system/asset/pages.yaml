    #  8.1 Introduction*


    Large-scale, complex systems engineering efforts involving multiple stakeholders
    often have been problematic, so there is interest in both government and private
    industry in understanding how to improve the systems engineering process for such
    systems. This chapter presents an approach to modeling the systems engineering
    (SE) process, originally inspired by the highly optimized tolerance (HOT) framework
    for understanding complexity in designed systems. Here, high-level, optimal control-theoretic
    and differential-game models of the systems engineering process represent in a
    simplified way the cost, and performance trade-offs inherent in systems engineering.
    Although the modeling is in an exploratory research stage and is not predictive,
    it is suggested that high-level models can be used to communicate risks inherent
    in new and ongoing systems engineering programs, as well as the potential effects
    of management and governance mitigation approaches. Areas for further exploration
    include high-level modeling for systems engineering program diagnostics and early-stage
    assessment.


    SE in the context of a large complex or private enterprise is challenging and
    many instances of such SE have been problematic (Bar-Yam 2003). To cite a single,
    well-documented SE example dating back to the 1990s, the U.S. Federal Aviation
    Administration''s (FAA) multibillion-dollar Advanced Automation System (AAS) traffic
    control system took place in context of major technical and management challenges
    with unclear requirements in key areas, and was only partially completed, with
    delays and cost overruns, when the program ceased to exist (Boppana et al. 2006).
    Boppana et al. (2006) present system dynamics and HOT models of SE processes applied
    to the AAS program, and pose the question of whether the complexity of SE in a
    complex enterprise such as aviation can be adequately represented and studied
    with such models. Here, we extend the unifying framework of Hoffman et al. (2007)
    as the basis for modeling the overall SE process at a high level, and present
    a range of optimal control and differential game models to account for SE complexity
    factors including uncertainty,


    > * Adapted, in part, from Wojcik, L.A. and K.C. Hoffman, 2007 IEEE. IEEE/SMC
    International Conference on System of Systems Engineering (SoSE).'
  merge: -1
