  md: '# International Trade and Commerce ■ 255


    of information and communication services are required. Specific planning and
    management functions that can be integrated and that benefit from the scope and
    content of the ESE workbench include the following:


    +   * Strategic planning

    * Performance planning

    * Operations management

    * Engineering management

    * Information systems planning and management

    * Training


    The ESE workbench supports the objective of the “notional” multiagency governance
    environment that builds on the capabilities of individual agencies for a close
    coupling of strategic planning, technical management, and operational management.
    The workbench approach, with a strong focus on mission activities, can deal effectively
    with complexity and challenges in achieving this objective. It provides the comprehensive
    systems necessary for the modernization of technologies and mission activities
    for successful program coordination and management in a multiagency environment.


    Many alternative management options are available for both modernization programs
    and operations. Regardless of the option selected, achieving successful multiagency
    governance requires a robust governance structure operating on a comprehensive
    information base. An architecture-based approach to governance can resolve complexity
    and the many organizational accountability and control issues that arise. This
    approach ensures that routine management tasks are integrated across multiple
    agencies and are responsive to strategic direction and assigned responsibilities.


    Defining the required level of organizational and technical interoperability is
    a major factor in multiagency missions. The level of interoperability, which depends
    on the specific mission, can vary among the specific activities performed and
    is always a strong factor in the assignment of respons and accountability. Specifically,
    the level of information sharing and provisions for accountability, information
    quality, privacy, and security are tied closely to the level of organizational
    and technical interoperability required.


