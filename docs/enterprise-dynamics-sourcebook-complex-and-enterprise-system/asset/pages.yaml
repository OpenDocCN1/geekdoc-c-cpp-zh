  md: '# xii Introduction


    evolution of systems engineering to address issues of increasing complexity, in
    this case enterprises operating at a national and global scale involving multiple
    partners and stakeholders, divergent interests, and a high degree of risk and
    uncertainty.


    Section I also presents a selection of analytical tools and methods (models) that
    deal with specific complexities of transformation addressed through ESE/A. Collectively
    the tools and methods establish an initial foundation for ESE/A and the supporting
    discipline of enterprise dynamics, an emergent and comprehensive field that extends
    systems engineering and architecting into the complex enterprise environment.


    Section II presents a series of ESE/A case studies based on published papers and
    reports on modeling the complex dynamics in enterprise-level applications to address
    critical issues in the acquisition of new operating capabilities. They represent
    enterprise transformation challenges at a scale where the government role is paramount,
    and in some of the applications presented, with significant private sector and
    consumer involvement. The cases study a variety of modeling and analytical methods
    appropriate to the specific enterprise transformation challenge they are addressing.
    Examining this variety in the context of the ESE/A process provides valuable and
    practical guidance for management and problem solving.


    Concepts and complexities of complex systems and mesystems were introduced in
    an enterprise context by Hybertson (2009), Stevens (2010), and Rebovich and White
    (2010). This sourcebook supplements these concepts. It describes a discipline
    of enterprise dynamics incorporated in an ESE/A process to address the planning,
    design, and management of complex enterprises and mesystems in a very challenging
    technical, social, and economic environment. Illustrative applications pertaining
    to a range of enterprise domains are summarized to demonstrate how the process
    can be tailored to specific enterprise challenges with a focus on mission performance.
    A top-level summary of the sourcebook chapters is presented below. Each chapter
    title is followed by key concepts within the chapter.


    # Section I: Foundations and Conceptual Frameworks


    Section I of this sourcebook establishes the foundations of ESE/A and the supporting
    discipline of enterprise dynamics, an emergent and comprehensive field that extends
    systems engineering and architecting into the complex enterprise environment.
    This is the most recent stage in the long-term continuous evolution of systems
    engineering to apply quantitative and qualitative methods to issues of increasing
    complexity, in this case enterprises operating at a national and global scale
    involving multiple partners and stakeholders, divergent interests, and a high
    degree of risk and uncertainty.


    The discipline of ESE/A merges systems engineering with management science, enhancing
    current concepts of enterprise architectures (EA) to deal with increasingly complex
    challenges faced by government agencies and large commercial enterprises. The
    emphasis is on describing, analyzing, and evaluating dynamic behaviors of complex
    techno-socio-economic systems, with all of the POET elements of the'
