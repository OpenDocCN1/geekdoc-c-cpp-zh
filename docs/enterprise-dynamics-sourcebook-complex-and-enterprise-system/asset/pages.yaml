    # 5.5.2.4 Comprehensive Planning and Investment Methods


    In response to the Clinger-Cohen Act (U.S. Congress 2000) and OMB guidelines (OMB
    1996; OMB FEA 2003) for technology budgeting, federal agencies are making massive
    investments in EAs at the agency level and for major bureaus and offices within
    the agencies. Commercial enterprises, as well as state and local governments,
    are also developing information system architectures (NASCIO 2002). Although these
    products are applied widely for IT investment planning and budgeting, they are
    rarely used as an overall enterprise-level strategic planning and management tool.
    As such, architectures represent a seriously underutilized resource.


    At the same time many agencies are implementing ERP systems to consolidate financial
    and accounting systems. This capability is important in allocating resources to
    transformation processes and measuring their operational effectiveness. Although
    used extensively in this domain, ERP systems lack the type of enterprise data
    and information that is contained in the architecture and related to mission performance.


    A variety of architecture frameworks and approaches have been applied successfully
    in the commercial and government environments to plan investments (Hoffman and
    Melancon 1988; Zachman 1987). Frameworks in the government sector driven by the
    Clinger-Cohen Act include the Federal Enterprise Architecture Framework (FEAF
    (CIO 2001), and Command, Control, Communications, Computers, Intelligence, Surveillance,
    and Reconnaissance (C4ISR)/DoD Architecture Framework (DoD 1997). The reference
    models (OMB FEA 2007) are a more recent development. The performance reference
    model is the most important addition and motivates the need for dynamic architectures.
    There are numerous technical standards concerning computing and communications
    that are embedded in the technical level of these architectures.


