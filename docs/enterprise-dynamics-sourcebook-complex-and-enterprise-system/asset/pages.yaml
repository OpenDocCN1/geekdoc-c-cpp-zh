  md: '# 5.7.2 MIT Complex, Large-Scale, Interconnected,

    Open, Sociotechnical Process


    The complex, large-scale, interconnected, open, sociotechnical (CLIOS) process

    (Sussman 2002) has been used on many complex projects and in undergraduate

    grade level courses at MIT. The process is organized in four major segments

    with 12 steps in total:


    Representation of structure:


    +   1. Describe the system (identify issues and goals).

    2. Identify major subsystems.

    3. Develop the CLIOS diagram (nesting, layering, expanding).


    Behavior:


    +   4. Describe components and links.

    5. Seek insight about system behavior.


    Evaluation:


    +   6. Refine system goals and identify performance measures.

    7. Identify options for system performance improvement.

    8. Flag important areas of uncertainty.

    9. Evaluate options and select those that behave “best” across uncertainties.


    Implementation:


    +   10. Develop strategy for implementation.

    11. Identify opportunities for institutional changes and architecture development.

    12. Perform postimplementation evaluation and modification.


    The enterprise landscape concepts discussed earlier in Chapter 4 support the

    representation steps of CLIOS by providing multiple management and operational

    ppectives. The enterprise dynamics modeling methods described in the follow-

    ing sections provide a robust capability for the evaluation steps of CLIOS.


    Systems engineering (SE) in the earlier tradition differs from CLIOS

    d the rest of the engineering systems curriculum at MIT that is mainly

    technical, whereas engineering systems includes a broader perspective that encom-

    passes management, social sciences, and engineering, as well as focusing on critical

    temporary issues, including climate change, trade issues, world sustainability
    and

    development goal, economics, and equity.'
