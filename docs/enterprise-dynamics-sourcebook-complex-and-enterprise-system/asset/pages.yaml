  md: '# 8.3.1.2 Objective Function Related to Pressure to Complete the System


    In some cases, the modeler may wish to emphasize pressure to complete the system,
    rather than the benefit of the system in operations. For example, estimates of
    the operational benefit or the system lifetime might not be known. For these applications,
    a model with an objective function related to pressure to complete the system
    can be used. Pressure to complete the system might come from operational needs,
    or from political or organizational pressure, or a combination of both.


    # 8.3.1.1 The “HOT” Model


    HOT is a framework for understanding aspects of complexity in designed or engineered
    systems. Carlson and Doyle (1999) originally created the HOT concept and applied
    it to forest fire management, Internet traffic, and natural ecologies. In engineered
    systems, they showed how power laws relating size to probability emerge from minimization
    of cost in the case of design trade-offs and uncertainty. Since then, the HOT
    methodology has been applied to systems such as the electric power grid (Alderson
    et al. 2004) and Internet architecture (Stubna and Fowler 2003). HOT typically
    is identified with power laws, but Wojcik (2004) applied a version of the HOT
    methodology to the SE process without finding power laws as a result; so it be
    more correct to call it a HOT-inspired model, rather than a HOT model. In this
    section, we show that Wojcik''s (2004) HOT-inspired model can be described in
    terms of the linear optimal control framework, but at the limit where the system
    is completed in an infinite number of incremental stages, as described above.


    Wojcik (2004) posits a simple cost density function


    ```

    $c(t) = A\cdot(1-s(t))\cdot(1-e^{-t/\tau}) + B\cdots(t)\cdot\delta_p(t) + D\cdot\dot{s}(t)^2$

    ```


    Here, $A, B, D,$ and $\tau$ are constants, and random $\delta_p(t)$ is a delta
    function with probability density $p$ over time $t$. The parameter $p$ is assumed
    to be a constant. The first term of the equation for $c(t)$ models the pressure
    to finish the base system, from actual needs or other such as political pressure.
    The second term represents the cost incurred from random events that change the
    system will be used relative to the base system capabilities. This incorporates
    stakeholder interactions as well as other external events. The second term is
    proportional to $s(t)$, which represents greater impact on a system that is closer
    to completion. The cost of actually building the system is modeled by the third
    term, which is nonlinear in $s(t)$, to reflect the relative difficulty of building
    the system in a short time compared to a longer time.'
