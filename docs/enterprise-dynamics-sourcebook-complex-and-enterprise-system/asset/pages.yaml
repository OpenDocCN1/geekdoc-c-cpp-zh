    # 12.7.3 Materials and Energy Planning Methodology*


    A material resource planning methodology based on the use of the RMIS and the
    IMIS for the specific case of a developing economy is outlined in Figure 12.8.
    The features of this methodology (Hoffman and Basile 1982; Hoffman and deTerra
    1984) involve three basic elements:


    +   1. Estimates of market demands for materials based on analysis of the overall
    economy of a region or nation, including specific development projects. This linkage
    can be developed at an aggregate level, but a disaggregated approach is preferred
    when planned projected construction activities and development projects are defined.

    2. A comprehensive information framework as provided by the IMIS.

    3. Analytical models including:

    * Economic forecasting models.

    * Construction plans.

    * Resource allocation and optimization models.


    The logic of this approach to sequential planning is clear. A key step is that
    project definition, where (1) specific projects are identified to remove projected
    development bottlenecks (e.g., provide increased cement production capacity);
    (2) energy needs are identified (e.g., build or supplement the capacity of power
    plants to provide for material processing); and (3) a specific trained labor force


