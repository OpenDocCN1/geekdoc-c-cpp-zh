  md: '# 4.6 Conclusion


    This chapter presents a series of models that can be drawn upon for ESE and positions
    to support dynamic enterprise architecting through the ESE/A process. Although
    this establishes an improved capability for planning and managing enterprise transformation,
    a possible future direction—the unifying concept—is described to motivate further
    research. Individual modeling methods to be used for specific purposes in enterprise
    dynamics and are shown with respect to the POET space in Figure 4.7. The positioning
    indicated represents the more common application tendencies for each modeling
    approach but can have a wider range of application. Specialized tendencies account
    for the popularity of hybrid modeling in the Section II case studies and emphasize
    the need for integration (unifying) methods.


    The operational performance benefits from the introduction of enterprise dynamics
    are an essential part of enterprise planning and analysis for the acquisition
    and implementation of technology (i.e., in support of the ESE/A process). The
    proposed framework describes the scope and content of this engineering discipline.


    The application of performance simulation models for enterprise architecture described
    in this chapter is a state-of-the-art ESE/A process. This method can be advanced
    further using the unifying concept as that framework and the core C-I-U model
    matters.


    The definition of the core C-I-U model at the enterprise operational scale and
    the definition of dynamic sense-and-respond mechanisms provide unifying capabilities
    directed both at the higher scale of the economic sector in which the enterprise
    is embedded and the lower organizational scales. Fidelity may be added to the
    core C-I-U model as required for analysis as the source modules are fully developed
    to provide more detail and complete state-space descriptions.


