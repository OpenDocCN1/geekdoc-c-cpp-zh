    simulation model.


    The diagram has been used as a starting point to explore and scenarios for the
    simulation model. These scenarios evaluate more specific hypotheses that are subsequently
    developed in the model. Many of the scenarios are “what if” experiments that explore
    the consequences with the timing of certain key decisions and events. Although
