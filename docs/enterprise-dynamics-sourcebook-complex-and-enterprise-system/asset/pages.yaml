  md: '# FOUNDATIONS

    AND CONCEPTUAL

    FRAMEWORKS


    This sourcebook draws upon and describes a number of methods to provide a proven
    and structured approach, a framework, for Enterprise Systems Engineering and Architecting
    (ESE/A). It is directed towards analysts, managers, and decision-makers engaged
    in significant transformation of enterprises to operate at high performance levels
    in the delivery of products and services. It is also intended for the academic
    community for research and education purposes.


    Representing, analyzing, and evaluating dynamic behaviors is a very important
    part of that framework. Enterprise Dynamics is a discipline for analysis of the
    complex interaction of policy, organizational, economic, and technical factors
    within an enterprise that affect the operations of the enterprise, and the acquisition
    and implementation of new capabilities for mission or business performance. The
    descriptive capabilities of Enterprise Dynamics address this need. They build
    on the concept of descriptive geometries and involve the mapping of the highly
    multidimensional enterprise state-space into the decision space for management
    of system and technology acquisition, policy formulation, and business operations.
    Several conceptual models are described to apply the discipline of Enterprise
    Dynamics.


    The objective of Enterprise Dynamics is to develop and apply dynamic theory to
    acquiring and implementing technology, systems, and services for new operating
    capabilities in very complex organizational and operational environments involving
    Enterprise Systems Engineering (ESE) applications. Understanding the characteristics
    of the enterprise landscape and the need to support specific management decisions
    will increase the opportunities for success in this failure-prone endeavor.'
