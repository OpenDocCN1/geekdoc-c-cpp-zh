    # 3.4 Enterprise Architecting


    The practitioner-oriented field of enterprise architecting offers a holistic approach
    to managing an enterprise''s complexity. Enterprise architecting holds that enterprises,
    complex systems, can be “architected” in an organized fashion that will give better
    results than an ad hoc or piecewise approach to organization and design (Bernus
    2003). To architect an enterprise is to create and document a specific abstraction
    of it that describes its fundamental mission, organization, and resources inherent
    in its current state or as a desired future. This abstraction is known as the
    enterprise architecture.


    The ANSI/IEEE definition of EA states that it is “the fundamental organization
    of the environment, embedded in its components, their relationship to each other
    and the governing principles of its design” (ANSI/IEEE 1471: 2000). A second,
    more complete definition is given by Bozdogan, who states “enterprise architecture
    is an abstract representation of a ‘real-life’ enterprise’s holistic design (gestalt,
    configuration, pattern) binding its structure, strategy, environment and performance,
    showing its essential elements and the relationships among them, as both co-evolve
    over time” (Bozdgan 2007, p. 10). The EA is an abstraction of the ‘real-world’
    enterprise structured in such a way that makes both analysis and design possible
    by treating the enterprise as a hierarchical, nearly decomposable system. The
    EA has the potential to make the systematic de-sign design and improvement of
    complex enterprises more feasible by describing the enterprise from multiple perspectives
    and specifying the interactions of disparate aspects of the enterprise.


    Although the original raison d’être for enterprise architecting was to integrate
    disparate systems across the enterprise in order to provide value to the enterprise,
    its application has evolved from enterprise information system integration toward
    much broader scopes. At its core, the purpose of enterprise architecting is (1)
    to understand the enterprise as an interacting complex system, (2) to communicate
    the structure and behavior to enterprise stakeholders, and (3) to serve as


