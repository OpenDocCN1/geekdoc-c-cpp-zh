  md: '# Foundations and Conceptual Frameworks


    **Working Definition of an Enterprise.** An enterprise is a purposeful social,
    technical, and economic undertaking designed to create value for its stakeholders
    involving:


    +   - Policies, organizations (people), economics, and technology interacting
    with each other and their environment in operational processes as a complex system-of-systems
    to achieve goals


    +   - An organization (single or multiagent, and possibly virtual) created for
    the undertaking to embark on new ventures


    +   - Readiness to embark on new ventures


    The dynamics of an enterprise are highly dependent on the mission and/or business
    characteristics (the enterprise landscape) of—and the perspective on—the enterprise
    required to address management issues and influence decision-making (operational,
    scalar, and temporal perspectives).


    **Working Definition of Enterprise Transformation.** The transformation of an
    enterprise to a desired future state is a comprehensive change process driven
    by public (consumer) demands, competitive factors, economic forces, and technological
    opportunities. The primary transformation objective is significant performance
    improvements and the effective coordination of policies, organizations, economics,
    and technology (POET) in operational strategies and processes. Performance improvements
    include better products and services, cost, and quality. The dynamic and iterative
    change process and key elements addressed in this datasource as the discipline
    of enterprise dynamics are portrayed in Figure 1.1.


    **Enterprise Dynamics Defined.** Enterprise dynamics is defined in this textbook
    as a discipline that deals with the time-dependent interactions of the internal
    elements of an enterprise (policies, organization and staff, economic resources,
    and technology assets) and the characterization of its transformation to increase
    performance levels in a changing external social and market environment. The ability
    of the enterprise to internalize and influence aspects of the “external” environment,
    or to respond to uncontrollable elements, introduces further complexities dealt
    with the foundations of enterprise dynamics outlined in Section 1. Concepts and
    economics, management sciences, and operations research are drawn from engineering,
    economics, management sciences, and operations research to address complexities
    over the range of enterprise characteristics encompassed in the Section II case
    studies. The discipline of enterprise dynamics is a major contribution to the
    practice of enterprise systems engineering and architecture (ESE/A).


    The ESE/A process is designed to enhance the timeliness and dynamic state-of-the-art
    management systems such as Activity-Based Management (ABM) and Enterprise Resource
    Planning (ERP) to enable the agile sense-and-respond enterprise.


    Each of the case studies in Section II represents unique transformation challenges
    and draws upon applicable models and approaches those described in'
