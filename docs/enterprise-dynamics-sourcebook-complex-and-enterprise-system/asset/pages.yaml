    # 4.5 Unifying Approach to Enterprise Dynamics—Future Directions


    As fluid dynamics and structural dynamics theories and methods support engineering
    disciplines, enterprise dynamics supports the ESE/A process as a discipline. All
    of these fields of application employ a variety of modeling methods depending
    on the specific nature of the challenge. The concepts and specific methods that
    comprise an emerging field of enterprise dynamics have been outlined earlier.
    This section describes a concept for integrating models of specific elements of
    the enterprise into a comprehensive (unified) view to further advance the application
    of enterprise dynamics to the ESE/A process.


    # 4.5.1 Unifying Concept


    The unifying concept is proposed as a future capability for ESE/A to stimulate
    further research. The concept is based on a state-space description of dynamic
    elements of the enterprise from a temporal perspective coupled with the C-I-U
    operational perspective. Its feasibility is demonstrated in the case study in
    Chapter 8 as a reduced form of an SE process applied to enterprise transformation,
    reduced in terms of the number of enterprise state-space and control parameters
    using mathematical techniques of nonlinear closed-form optimal control theory
    and game theory.


    The structure of the unifying framework to implement this concept captures the
    transformation path of the enterprise in mathematical state-space form and is
    illustrated in Figure 4.5, the unifying framework. The representative analytical
    methods that may be applied as source modules and may be selected as applicable
    to the enterprise challenge. The unifying framework also includes the core C-I-U
    enterprise model to analyze the transformation of the enterprise.


    The dynamic parameters are drawn from a diverse set of multidisciplinary source
    modules formulated to address specific acquisition and operational issues needed
    for a specific analysis. Source modules are defined here as models based'
