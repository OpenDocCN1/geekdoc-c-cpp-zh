  md: "# 327\n\ndelays require major updates to the business case and strategy to\
    \ estimate a revised\noperational lifetime and the resultant benefits. The definition\
    \ of maintenance and\nageing effects over the system of systems' lifetime, and\
    \ the sensitivity of the business\ncase to those factors must be given more attention\
    \ than the usual practice.\n\nMajor uncertainties in the internal and external\
    \ environments must be ana-\nzed and estimated. Although the current formulation\
    \ of the model is based on nondeterministic external impacts that are postulated\
