    # 13.1 Introduction


    This chapter presents a multiscale data analytics approach for modeling the U.S.
    healthcare system as an enterprise. The U.S. healthcare enterprise encompasses
    public and private entities with significant government involvement in policies
    and programs that have widespread interactions and effects at all levels of the
    system; As such, in other words the U.S. healthcare enterprise is a complex adaptive
    system. Integrated holistic analytical methods are needed to understand the enterprisewide
    interactions and outcomes of proposed initiatives. An enterprise systems engineering
    (ESE) approach is applied to organize diverse datasets and perform integrative
    analytics of patient populations, health services, providers, facilities, insurers,
    pharmaceuticals, research, and the U.S. economy.


    Hybrid models are applied to a selected health service and proposed interventions
    to affect outcomes and costs. Type 2 diabetes management is used as a case study
    with selected policy and costly interventions to deal with the lifetime complications
    and consequences of this condition. The hybrid modeling structure includes agent-based
    methods to portray the movement of patients in the headspace, systems dynamics
    to capture policy and programmatic influences, discrete event methods to describe
    sequential processes, and economic analysis to capture costs and impacts on the
    healthcare enterprise in the context of the overall economy.


    At a higher macroscale, the application of an economic analysis model to policies
    that expand insurance coverage to the currently uninsured population is presented.
    The methods address the need for an enterprise-level system-of-systems (SoS) approach
    to organize the vast and diverse datasets published by various agencies into an
    open-source data-analytical framework. The framework encompasses the healthcare
    enterprise to support the comprehensive analysis of the impacts of policies and
    programs across the many dimensions and scales. Policy and programmatic areas
    of interest include insurer coverage decisions for new or modified health services,
    new technologies for diagnostic, therapeutic, and preventive services, and other
    major influences on the cost and quality of healthcare services.'
