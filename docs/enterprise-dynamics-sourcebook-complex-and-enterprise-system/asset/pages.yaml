  md: '# 12.5 Strategies and Technologies Examined for the Transformation


    The individuals and agencies engaged in the supply, processing, and use of natural
    resources make decisions and investments in response to demands and regulatory
    policies that drive the transformation of the materials and energy system. This
    transformation must be directed at improved performance levels for industry and
    the national economy, and must address national and global policies that balance
    economic and social development with sustainable resource use and environmental
    challenges. Decisions and actions are coordinated through government initiatives
    but often are taken independently for local reasons, adding to the complexity.


    Many alternative technology and strategy options are available for transformation
    of the materials and energy systems. Regardless of the options selected, achieving
    rational policies requires a robust governance structure operating on a comprehensive
    information base. An architecture-based approach to governance can help resolve
    complexity and the many organizational accountability and control issues that
    arise. This approach ensures that decision processes are integrated across multiple
    agencies and are responsive to strategic direction and assigned responsibilities.
    Specifically, the level of information sharing and provisions for accountability,
    information quality, privacy, and security are tied closely to the decision processes
    and regulatory policies.


    # 12.6 ESE Analytical Approach


    Analyses of the physical aspects of the materials and energy system can be performed
    using a GIS display of data including plant sites, material transport flows, and
    emission maps. The International Institute for Applied Systems Analysis has developed
    and applied a comprehensive set of regional environmental models using these data
    presentation and modeling approaches (Brouwer et al. 1991).


    An example of a more detailed RMIS process description for a specific use is shown
    in Figure 12.3 (Schoener et al. 2008). The end-to-end physical flow of materials
    from agricultural feedstock to ethanol as a vehicle fuel is shown. Inputs of land,
    fertilizer, energy, and capital are described along outputs of fuel, by-products,
    and effluents to air, land, and water.


    # 12.6.1 Material System Process Models


    The process structure of the RMIS maps directly into discrete event simulation
    models and large-scale optimization models. The strengths of process models include:


    +   - The ability to represent material flows, labor, and other factors in physical
    terms


    +   - The characterization of specific technologies for extraction, conversion,
    and processing


    +   - Conformance to the laws of science and engineering'
