  md: '# Modeling the Nation’s Healthcare System as a Dynamic Enterprise  ■ 297


    Rouse (2008) defines the healthcare system as a complex adaptive system and therefore
    not amenable to hierarchical decomposition. The hybrid method applied in this
    chapter encompasses the multiple scales of the healthcare system in an integrated
    and unified approach for analyzing this complex system-of-systems. The emphasis
    is placed primarily on methods and illustrative applications to healthcare-planning,
    analysis, and evaluation, rather than on specific results. Analytical results
    are highly dependent on the purpose, assumptions, and context of the policy studies
    and are meant to inform and improve-current decision processes.


    # 13.2 Background on Healthcare Transformation*


    The healthcare system is a large and comprehensive example of a service-oriented
    enterprise. Health services and systems range across many sectors of the U.S.
    comprising 18% of our gross domestic product (GDP) in 2010 with an annual growth
    rate of 4%. This raises major challenges to long-term affordability and sustainability
    that are central to government policies and programs to transform healthcare.


    The complexities of the nation’s health sector are evident in policy debates that
    address quality, access, and cost from the perspectives of the public and the
    government, and can be described and analyzed using complex systems methods. This
    chapter applies line of sight performance modeling concepts (Dougherty et al.
    2006), along with an ESE process, to the formulation of a comprehensive health
    services system (RHSS) framework and associated data and multiscale modeling methods.
    The framework is designed to support planning, analysis, and management of government
    policies and programs to transform the healthcare enterprise to a more effective
    and sustainable state. The RH framework illuminates the complexities of human
    and physical resources and emerging technologies to deliver health services. It
    provides a comprehensive data-analytic framework for use by stakeholders and to
    inform decisions and policies using decision methods appropriate to the complexities
    and uncertainties of this sector.


    Much of the policy emphasis is on bending the cost for health services downward,
    technological innovation is leading to more effective healthcare services that
    do hititherto untreatable conditions; these emergent effects pose additional policy
    and analytical challenges.


    The planning and management of government and private policies and investments
    by stakeholders and the need to understand the local and national implications
    of their collective actions represent complex ESE challenges. Policy issues and
    programs for healthcare transformation range from local initiatives and specific


