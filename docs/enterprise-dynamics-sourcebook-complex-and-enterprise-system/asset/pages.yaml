    methods must always be considered.


    # Future of Enterprise Systems Engineering, and Some Alphabet Soup—SoSE, CAS


    Emerging challenges of globalization, security, the economy, and improved social
    services require significant transformations in private and public sectors. Increased
    capabilities to address these complex issues are enabled by new technologies that
    enhance the effectiveness of physical and information networks. The complexity
    of the challenges motivates the need for methods that draw upon the physical and
    social sciences and apply the robust capabilities of those disciplines: the integrating
    applied discipline of ESE. ESE'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'must raise the capabilities of its methodology to deal with the complexities
    of the challenges.


    Efforts to address the important, but more qualitative, aspects of systems such
    as stakeholder behaviors, organizational theory, complexity, and decision making
    require new methods. These aspects are of particular importance in enterprise
    systems, and are a major aspect of the POET scope of the ESE process that blends
    qualitative methods with the traditional quantitative methods of an engineering
    discipline. Enterprise-level programs generally involve some mix of private sector,
    federal, and local government and, with increasing frequency, foreign partners.
    These multistake programs require a well-balanced treatment of POET elements.
    Earlier systems efforts reveal emphasis on one or more of those elements, usually
    for good reason, occasionally as an oversight. The ESE process must address all
    POET elements, with emphasis and priorities still dependent on the characterization
    of the specifies of the enterprise and the transformation program.


    Previous efforts in systems engineering and its extensions to systems systems
    engineering (SoSE) in an enterprise context events have been problematic (Bar-Yam
    2003; Hoffman et al. 2007). The systems engineering method must be tailored and
    extended with greater POET dynamic capabilities to deal with these complex adaptive
    systems (CAS). To cite a single, well-documented SoSE example dating back to the
    1990s, the U.S. Federal Aviation Administration’s (FAA) multibillion-dollar advanced
    automation system (AAS) program to modernize the U.S. air traffic control system
    took place in a context of major technical and management challenges together
    with major delays and cost overruns, and was only partially completed, with the
    program ceased to exist as originally conceived (Boppana et al. 2006). This reference
    presents system dynamics (SD) and highly optimized traditional (HOT) models of
    SoSE processes applied to the AAS program, and poses the question of whether the
    complexity of SoSE in an enterprise context can be adequately represented and
    studied with such models. These models are described along with other multidisciplinary
    enterprise dynamics methods.


    # 2.6 Conclusion


    This survey of the applications of systems engineering to larger and more complex
    challenges exhibits an ongoing evolution in the scope of transformation challenges
    and the willingness to embark on them. The evolution of models and methods has
    been enabled by ever-increasing computing and analytic power, too often without
    commensurate success. This broad survey indicates that improved frameworks for
    planning and management are needed and can benefit from greater attention to dynamic
    models and methods employed in an ESE/A framework.'
