    hybrid simulation model. To meet these goals, a set of guiding principles has
    been developed to help guide the modeling process. There are four key principles
    that can be identified to aid the modeler in creating hybrid simulation models
    of EA:


    +   1. Models should be created for insight (e.g., through what-if analysis by
    defining possible future outcomes related to decisions) not for generating point
    predictions.

    2. Models must capture the essential elements of the enterprise architecture and
    the architecture should contain source data for analytics.

    3. Hybrid models should preferably be focused at the strategic level versus the
    tactical level to address enterprise-level strategic decisions and their possible
    consequences.

    4. Hybrid models must explicitly capture interactions across the enterprise''s
    architecture comprising multiple views or domains as required by the strategic
    decision or issue being.


    The next four sections develop these principles further for application to the
    creation of hybrid simulation models of EA.


    # 4.4.1.2 Modeling for Insight, Not Prediction


    EA simulation modeling is not a predictive approach to simulation modeling that
    is intended to improve operational efficiency; instead, this approach seeks to
    yield insight into the behavior of a complex enterprise arising from its architecture
    and the key interactions and decision points. This insight helps to accelerate
    the learning curve for enterprise managers seeking to shape and guide their enterprise
    from a system-level perspective. This approach allows the modeler and architect
    to capture key attributes of the enterprise from multiple perspectives (e.g.,
    strategy, process, organization, products, etc.) and to examine how the interactions
    between these perspectives drive the high-level behaviors of the enterprise. Such
    an approach takes a strategic view of the enterprise to guide architects and managers
    in understanding how the system, as a whole, delivers value to its stakeholders.
    This use of simulation as a strategic decision support tool is similar to that
    of researchers in the fields of systems thinking and organizational learning.
    Here, models are used along with architectures to gain insight into the system
    by:


    +   1. Creating a shared frame of reference among managers and architects for
    understanding nonlinear enterprise dynamics

    2. Understanding the relationship and effects between both hard (quantitative)
    and soft (qualitative) system variables

    3. Testing hypotheses and performing scenario analyses

    4. Discovering new architectures or ways to manage the current architecture as
    a result of analysis of the simulation'
