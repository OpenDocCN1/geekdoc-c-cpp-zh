    The scenario selected for the operator-environment model was the time-sensitive
    targeting (TST) process, which is modeled as 49 operators working in the processes
    outlined in Figure 9.4. These operators work in specific groups denoted by the
    larger boxes (rectangles) in task boxes. In the current version of the model,
    one group of 8 operators interacts to complete a task (rectangles in Figure 9,4),
    based on a random number of activities or subtasks. Each agent is randomly assigned
    a number of static properties, including a level of expertise, experience, and
    ease of interaction.


    Based on the initial processes, the agent develops a social network as the simulation
    is run. As shown in Figure 9.5, an agent “grabs” a critical event. The agent checks
    to see the event, to be handled properly, gets more information. If not, the agent
    is done, and the processing proceeds depending on a random setting of the modality
    of the next event. If the modality is “talking” a check is made to see if the
    given agent has any trusted associates from the same cell. If so, the agent picks
    one and talks for a random amount of time. If the modality is “telephone” no associate
    is picked but a talk-time is calculated (assumed outside of cell). In either case,
    the talk-time passes the agent if success in getting information accomplished.
    If the agent is successful (a probabilistic outcome), the amount of information
    needed to handle an event is decreased, and the agent adds the associate to the
    trusted list (if not already there), and goes back to see if the event needs any
    more information. If the agent was unsuccessful, a check is made to see whether
    more information is needed. E-mail and chat modalities are implemented in a simplified
    fashion.


    Agent measures of performance (MOP) or indicators include: transition time between
    activities or subtasks, errors, missed information, response time, and repeated
    requests. Potential experiments in the agent-based modeling environment include:'
