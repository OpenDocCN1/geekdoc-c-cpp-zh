    # 5.5.3 Business Activities Play a Central Role in Governance


    The allocation of accountability for management of specific activities performed
    by individuals in a multiagency business or mission is central to effective governance.
    The tasks of achieving tactical and strategic objectives, assigning responsibility
    and accountability, managing risks, and making possible use of resources are best
    addressed at the activity level. In this context activities represent the work
    elements that must be performed to deliver a business service or product or perform
    a defined portion of a mission.


    Activities, whether performed repeatedly or on a one-time basis, must be defined
    at a level of specificity that permits their inclusion in a documented and repeatable
    process using specific staff and technical resources. The activities, although
    distributed across agencies, must be coordinated. Activities can be characterized
    by documented processes for their execution and include the defined inputs of
    resources, including staff, facilities, and information. Outputs are also defined
    for services or work products delivered by the activity.


    The precise and consistent definition of activities strengthens the application
    of ABM, a broad discipline and practice to apply activity information to business
    performance and resource management (Player and Keys 1999). Activities are a key
    element because they can be defined with precision, assigned as responsibilities
    for organizational accountability, managed by traditional methods, and measured
    for'
