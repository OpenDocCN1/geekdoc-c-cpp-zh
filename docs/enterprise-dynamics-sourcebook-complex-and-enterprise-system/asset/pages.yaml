  md: '# 238 Enterprise Dynamics Sourcebook


    management, technical, and stakeholder challenges. Within this mission, the chief
    threat to the environment, health, and safety is the radioactive liquid waste.
    The DoE currently manages approximately 88 million gallons of highly radioactive
    waste in 239 underground tanks. Collectively, these tanks and downstream operations
    are the largest cost element in the EM program (DoE 2011).


    The EM program prioritizes (DoE 2010, p. 5) activities that are projected to reduce
    the most per volume (the cure is a unit of radioactivity). These activities include
    (but are not limited to):


    +   - The treatment and disposal of liquid waste stored in underground tanks

    - The receipt, storage, and disposition of UNF

    - The consolidation, stabilization, and disposition of special nuclear wastes


    This chapter presents the influence diagrams and the model structures that are
    currently being applied to address these objectives.


    # 10.2.4 A Unifying Structure


    There is a large body of work on the application of system dynamics to project
    management. Lneys and Ford (2007) have surveyed literature with a focus on single
    projects. Very large-scale capital projects in the public sector have been singularly
    analyzed in a case study (Lynes, Cooper, and Els 2001). We have applied these
    and other causal structures to identify scenarios that the model might explore.
    Although qualitative in nature, the influence diagrams capture the relationships
    between key variables and formalize the mental models of decision makers and engineers.


    This chapter presents a framework for exploring policy options, analyzing plans,
    addressing management challenges, and developing mitigation strategies. This framework
    makes it possible to see a complex problem on a single sheet of paper and affords
    the opportunity to discuss problems under a unified conceptual perspective. The
    framework is also general enough that it applies to a broad range of capital investment/production
    operations. The causal influences also identify feedback loops that represent
    significant management challenges to the DoE and can be generalized to large-scale
    operations in both the public and private sectors.


    What sets this framework apart from previous work is the system of systems scale
    and the joint operations/capital project dependencies and complexities. The production
    planning and operations of existing physical facilities need to be accomplished
    in an efficient, timely, and cost-effective manner. The physical characteristics
    of surplus nuclear materials and radioactive waste streams are dynamic and often
    require investments in new technologies for safe disposal.


    Project outcomes need to be viewed in the context of their impact on ongoing and
    future operations. Today’s decisions have to be evaluated in the context of a
    common framework that can be translated into a model to generate reliable'
