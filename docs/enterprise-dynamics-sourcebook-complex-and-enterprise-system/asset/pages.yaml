    # 13.5.1 Policy and Business Risk


    Public policies generally reflect the public interest and preferences that balance
    economic impacts and sustainability with health and safety objectives. Policies
    must provide a clear and stable business environment as a basis for investment.
    Private sector responsibilities in the industry—government partnership must be
    defined and understood by all parties for healthcare system activities.


    The major risks encountered in national programs that seek to transform large
    sectors of the economy involve emergent behaviors in health services and supporting
    insurers respond to federal policies. These tend to dilute, delay, and even counter
    the desired objectives and must be subjected to critical analyses.


    # 13.5.2 Program Risk


    Program objectives must be clearly defined and planning must be integrated to
    ensure supplies of resources and labor to carry out the project and make a smooth
    transition to operations. Design and operating requirements must be stable, and
    constitute a major risk in this dynamic area.


    The potential for schedule slippage exists on every program. The resulting risk
    is much more than the simple sum of project schedule slippings as they are compounded
    by the cascading effect of interrelationships and dependencies between related
    projects in other portions of the system. Contractors must have references of
    their experience in the projects to be undertaken.


    # 13.5.3 Resource Risk


    Physical resources (providers, facilities, and technologies) must be adequate
    to support the demand for healthcare services. Financial resources for new construction
    and operation, by cash-strapped multiplicities, must be available with stable
    long-term commitments. Trained human resources must be available, and training
    plans must be implemented to ensure an adequate labor supply.


    # 13.5.4 Technical Risk


    Proven processes and technologies must be employed to minimize technical risks.
    Component obsolescence and degradation can constrain system performance as technical
    components do not meet expectations or specifications. Many of the promising technologies
    involve systems to maintain current records, reduce errors, and save money. There
    is much resistance to the use of such technology in clinical settings attributable
    to public acceptance, privacy, and implementation risks for these investments.
    The performance of individual projects is important; however, all related projects
    and activities must perform to meet all system objectives of greater access at
    affordable cost.'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# Modeling the Nation’s Healthcare System as a Dynamic Enterprise ■ 317


    Information systems used for monitoring and control of processes always risks
    that merit special attention. Computers are available that are fault tolerant,
    and other backup measures may be taken to ensure the reliability of data and control
    applications. A reliable communication system must be available with provision
    for emergency power supplies during power outages. There should be prior experience
    with any software in similar applications and the software should be fully documented.


    # 13.5.5 Health and Safety Risk


    Many federal agencies are engaged in the regulation of safety, including the Food
    and Drug Administration (FDA), U.S. Department of Agriculture (USDA), Nuclear
    Regulatory Commission (NRC), and the Department of Transportation (DOT) National
    Transportation Safety Board (NTSB). Risks associated with this regulation include
    uncertainty impacts and emergent behaviors in response to regulation. These risks
    are weighed against the benefits of regulation as of the regulatory process. Again,
    dealing with uncertainties is a crucial step.


    # 13.5.6 Emergent Behavior Risk


    A major risk in healthcare modeling and analysis, or any modeling and analysis
    of complex systems, is the unforeseen emergent behaviors that inevitably arise
    and that can dominate as policies and programs implemented. Such behaviors can
    be positive or negative in their impacts, and can sometimes be identified by drawing
    on the institutional expertise of managers in highly regulated environments and
    experts in technology forecasting. Analytical formulations and results must be
    subject to such expert review. However, emergent behaviors are defined by some
    to be unfore by any known methods; in the end all policies and program plans must
    incorporate specific corrective capabilities to draw upon localized experiments
    and deal with uncertainties and emergent outcomes. Our federal system indeed allows
    for pertinent testing and evaluation at the state and local levels; experience
    in states such as Massachusetts (2006) and Oregon (2010) is particularly noteworthy
    in this regard.


    # 13.6 Governance


    The importance of governance in major transformation programs is stressed by Hamaker
