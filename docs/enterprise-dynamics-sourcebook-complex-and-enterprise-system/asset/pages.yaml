  md: '# 196 Enterprise Dynamics Sourcebook


    ![](img/1fb08e914000d6821708e3e25f491f6b_219_0.png)


    **Figure 8.4** AAS planned and actual cumulative program expenditures.


    A diagnostic interpretation is that the original AAS plan underestimated the level
    of uncertainty for the effort ($B^*p^* > Bp$), the inherent technical difficulty
    of the development ($D^* > D$), and external pressures on the program ($A^* >
    A$). From Figure 8.4, the effect of the difficulties ($B^*p^*$) immediately after
    contract award was a slow start. Then, in the program, pressure to complete ($A^*$)
    forces up the expenditure rate, but the inherent difficulty ($D^*$) prevents the
    system capabilities from even coming close to the original.


    Could the AAS program have predicted at its start? Given the great uncertainties,
    a deterministic prediction would not have been useful, but a range of possible
    scenarios could have been played out with the HOT-inspired model. Information
    from expert panels reported by the U.S. Congress Office of Technology Assessment
    (1982) (before the name “AAS” came into common usage) suggests that experts were
    suspicious of the program’s technical viability, as well as being some awareness
    of POET and stakeholder factors that were likely to increase the complexity of
    the SE effort. The range of opinions could have been played out in a set of HOT-inspired
    simulations to show a set of possible outcomes given the program strategy at the
    time. Alternative program strategies could have been assessed in terms of their
    robustness in the face of perceived uncertainties at the time, perhaps using extensions
    of the HOT-inspired model to generate high-level program trajectories, such as
    the expenditure trajectory of Figure 8.4. The utility of the models would have
    translated divergent opinion into a set of possible program trajectories. Broadly
    speaking, this approach is similar to model-based policy analysis to address such
    issues as sustainable development and pollution, where large uncertainties can
    dominate the analysis (Popper, Lempert, and Bankes 2005).'
