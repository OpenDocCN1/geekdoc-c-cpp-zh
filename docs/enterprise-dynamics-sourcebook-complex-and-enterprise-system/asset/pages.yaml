    # 4.2 Enterprise Landscapes, Perspectives, and Elements


    Descriptive enterprise dynamics builds on the concept of descriptive geometries
    and involves the mapping of the highly multidimensional enterprise state-space
    into the decision space for management of systems and technology acquisition,
    policy formulation, and business operations.


    The objective of research on descriptive enterprise dynamics is to develop and
    apply dynamic theory to acquiring and implementing systems, and services for new
    operating capabilities in very complex organizational and operational environments.
    Understanding the characteristics of the enterprise landscape and support for
    specific management decisions will increase the opportunities for success in this
    failure-prone endeavor.


    # 4.2.1 Enterprise Landscapes


    The concept of landscapes has been applied to organization theory and enterprise
    fitness (Levinthal 2001) to deal with operations performance and management regimes
    (Nonden and Stanbridge 2005) that deal with people, organizations, and biological
    policies. It has also been applied to various scientific domains, including biological
    evolution (Crutchfield 2003) and string theory in physics at a cosmological scale
