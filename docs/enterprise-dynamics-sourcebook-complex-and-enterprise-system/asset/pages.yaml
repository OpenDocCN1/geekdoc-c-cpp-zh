    # 10.3 Development of the Influence Diagram


    Qualitative diagrammatic modeling in the form of influence diagrams is used to
    communicate the model scope and describe the relationship between key variables
    in the model. Many of the key variables are explicitly modeled, however some emerge
    from the scenario analysis. The influence diagram is an overall system representation
    that can be used to design scenarios.


    # 10.3.1 Physical Flow–The Route to Closure


    One of EM’s goals is to accelerate the cleanup and reduce the life-cycles of legacy
    materials. Doe uses legacy-hardened production facilities to replace used nuclear
    fuel, and separate and treat waste products. There are cases, where new capabilities
    are required to treat the radioactive wastes and prepare them for final disposition.
    Figure 10.1 shows the investment and production chain associated with the transformation
    process. EM is responsible for the disposition of surplus nuclear materials and
