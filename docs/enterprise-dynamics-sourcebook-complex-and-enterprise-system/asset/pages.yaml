    # 10.3.5 Needs and Project Outcomes


    Policy decisions increase the stocks of surplus nuclear materials and nonproliferation
    materials, the need for new capabilities creates a capability gap that becomes
    the justification for new investments. There are two feedback loops associated
    with capability gaps. The first is a reinforcing loop, $R_1$; demand for additional
    capacity. As more production campaigns are initiated, these activities tie up
    the process event, increasing the capability gap and the need for new capabilities.
    New investments in production capacity may be required to eliminate the capability
    shortfall. The implication is that life-cycle acceleration may make capacity constrained
    by the absence of new investment.


    A relief strategy can be seen in the balancing loop, $B_1$; early completion mitigates
    capacity constraints. Complet campaigns frees up capacity, closes the capability
    gap and may obviate the need to expand capacity. The challenge is to develop a
    lifecycle campaign strategy that strikes a balance between these two feedbacks
    in a way they may minimize investment and maximize production flexibility. The
    underlying model is designed to explore this trade space. This approach is consistent
    with recommendations to prioritize cleanup work to achieve the greatest technical
    risk reduction at an accelerated rate (DOE 2002, p. II-3).


    Project outcomes effect new capabilities as in the reinforcing loop $R_2$; schedule
    slip exacerbates the capability gap and illustrates how delays in the delivery
    of new capabilities prolong the capability gap, putting pressure to resolve the
    problem with stopgap measures and acceleration strategies. Figure 10.5 only illustrates
    the effects of schedule slip; a similar reinforcing loop for cost and performance
    outcomes can cause a performance shortfall to spin out of control. For example,
    a performance shortfall can also fail to narrow the capability gap and in the
    worst case would require a follow-on'
