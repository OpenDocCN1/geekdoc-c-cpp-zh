    # 6.5 Conclusions


    The TechSys Enterprise Architecture Simulation Model has proven to be a very useful
    tool to better understand TechSys''s enterprise architecture and its effect on
    enterprise performance. Although the model does not "crystal ball" predictions,
    it is capable of being used to understand how the enterprise architecture will
    tend to respond to varying the control levers into the architecture. This deeper
    understanding of the architecture can be used to think about how the enterprise
    can be managed and structured going ahead, and can be used as an input when making
    recommendations and decisions to increase the future performance of TechSys.


