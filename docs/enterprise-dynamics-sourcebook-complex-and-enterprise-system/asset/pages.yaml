  md: "# Optimal Control and Differential Game Modeling ■ 195\n\n# 8.3.1.2.2 Application\
    \ to the FAA AAS Program*\n\nThe FAA AAS program (1982–1994) is a well-documented\
    \ example of a complex SE program whose result was considerably less than originally\
    \ intended (Boppana et al. 2006). To apply the HOT-model to the whole AAS program,\
    \ Boppana et al. (2005) used the program and initial budget to calibrate the values\
    \ of A, B, D, and $\tau$, as they appeared at the beginning of the AAS program.\
    \ The theoretical basis for such a comparison is that one set of assumptions was\
    \ expressed (although not necessarily by anyone) in the original program plan,\
    \ and another set of realities that played out in the execution of the SE program.\
    \ The originally planned and actual spending profiles were used to generate two\
    \ sets of HOT-inspired model parameters. It was assumed that competent SE decision\
    \ faced a very difficult and complex system tended to behave highly motivated\
    \ by the cost, schedule, and performance tradeoffs reflected in the HOT-inspired\
    \ model.¹ The control optimization step in the HOT-inspired model generates a\
    \ program trajectory over time reflecting at this high kind of decision-making\
    \ behavior.\n\nNo “original AAS plan” at a sufficient level of detail was found\
    \ in the literature, so an approximation to the parameter set corresponding to\
    \ the original plan was approximated from available information relating to expectations\
    \ in the early 1980s about the AAS spending program. The parameter derived for\
    \ the original plan was: $A=1, \\tau=10, D=45$ (Boppana et al. 2005). This parameter\
    \ set generates a steep profile from the initial year to a total of $3.2B roughly\
    \ 13 years after the initial year. This reflects an ambitious schedule that did\
    \ not account for significant program uncertainties.\n\nThen, a revised set of\
    \ HOT-inspired model parameters $A^*, B^*, D^*$, and $\tau^*$ was estimated from\
    \ the actual expenditure trajectory of the AAS program, using a design of experiment\
    \ (DoE) based on an orthogonal array for four factors (the HOT-inspired model\
    \ parameters) at three levels and three confirmation runs. The actual AAS spending\
    \ trajectory was based on congressional appropriations documented in an AAS postmortem\
    \ report by the Department of Transportation inspector general (1998). The HOT-inspired\
    \ model parameter set corresponding to the actual expenditure trajectory $A^*=12,\
    \ B^*=10, D^*=60$, and $\tau^*=10$.\n\nA comparison of the planned and actual\
    \ AAS program trajectories is in 8.4, which shows cumulative expenditure as a\
    \ function of time.\n\n> *Adapted from K. Boppana et al., New England Complex\
    \ Systems Institute (NECSI) International Conference on Complex Systems (ICS2006).\
    \ 2006. The MITRE Corporation and Massachusetts Institute of Technology. All rights\
    \ reserved.\n¹ A conceptualization of the modeling is that the HOT-inspired model\
    \ assumes the program is completed in infinite incremental steps, whereas the\
    \ real program was not. At the time the study was done, the HOT-inspired model\
    \ was the only formation of the framework that was available."
