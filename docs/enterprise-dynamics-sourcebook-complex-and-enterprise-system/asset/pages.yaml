  md: '# Introduction ■ xi


    The case studies in Section II represent "purposeful undertakings" at multiple
    scales ranging from a commercial business strategy, through technology challenges,
    an operations control center, and agency activities, to national programs for
    the transformation of healthcare and the U.S. energy system.


    # Working Definition of Enterprise Transformation


    The transformation of an enterprise to a desired future state is a comprehensive,
    managed change process driven by public (consumer) demands, competitive factors,
    economic forces, and technological opportunities. The primary transformation objectives
    are significant performance improvements and the effective coordination of policies,
    organizations, and technology in operational strategies and processes. Performance
    improvements include better products and services, cost, and quality. The iterative
    change process and key elements may be portrayed as shown in Figure 0.1.


    The agile sense-and-respond enterprise is quick in sensing and responding to external
    events and trends is in a constant state of transformation given the pace of socioeconomic
    change. This transformation requires proactive analysis of the dynamic interactions
    among policies, organization, economics, technology, and the environment, incorporating
    inherent risks and uncertainties.


    Each of the case studies in Section II represents unique transformation challenges
    and draws upon applicable models and approaches from those described in Section
    1.


    The initial chapters in Section I describe the scene and complexities of enterprise
    transformation as well as approaches to planning and managing that transformation,
    including ESA/A and the supporting discipline of enterprise dynamics. These emergent
    and comprehensive methods extend systems engineering and architecture into the
    complex enterprise environment to address the coordinated evolution and transformation
    of all POET elements of enterprise to adapt to changing public demands and expectations,
    and take advantage of organizational opportunities. This is the most recent stage
    in the long-term continuous


