  md: '# Energy and Materials Systems as an ESE Application ■ 271


    system, can be used to provide an integrated framework for information on material
    resources and finished materials markets to support infrastructure planning and
    the efficient allocation of resources.


    The use of state-of-the-art information technology involving relational databases,
    object-oriented databases, geographic information systems (GIS), and simulation
    or optimization models make information more accessible and useful for planning
    and analysis. This chapter outlines an approach to a comprehensive integrated
    materials information system for infrastructure planning. The objectives of this
    comprehensive approach are to support integrated planning across the entire materials
    system and to identify and analyze risks and uncertainties that must be resolved
    during the planning and implementation of materials and infrastructure projects.
    The scope and content of such a framework is reviewed with examples from the materials
    and energy sectors. The integration of these sectors into the overall economy
    is also discussed.


    From the perspective of private profit-seeking firms, as well as policy makers
    and regulators, there is a need for readily available and high-quality information
    on material requirements, small and large-scale technologies, markets, prices,
    and other physical resources employed to improve the level and quality of the
    infrastructure is critical to the efficiency of markets, and is particularly important
    to developing economies and those in transition to market economies.


    Much attention is paid to gathering and interpreting financial statistics on economic
    development; however, little attention is paid to developing appropriate information
    on the flow of material resources into the infrastructure and formation in regional
    or national markets. There is a need for open technical information accessible
    to modelers and decision makers is to open and review by advocates and those with
    different views or data. The RMIS, and associated data on the physical infrastructure,
    may also be used as a framework representing the annual flow and the stock level
    in the capital portion of national accounts.


    This chapter describes a case study (Hoffman 1995) that applies an integrated
    information system encompassing critical elements. It provides a comprehensive
    base for a variety of process and econometric modeling approaches to support business
    decisions and government policy making. The potential roles of process simulation,
    optimization, and econometric modeling are described.


