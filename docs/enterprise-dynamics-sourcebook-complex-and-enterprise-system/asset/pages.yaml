  md: 'complexity, anticipated internal and external impacts, as well as operational
    ageing effects. Considering enterprise complexities in this context, the general
    guidelines suggested in this chapter can achieve better return on investment.
    However, this research is still at an early stage, and should be integrated with
    other modeling approaches to provide a full picture for enterprise decision making.
    In particular, we recommend further research on probabilistic modeling of the
    dynamic processes to account for uncertainties.


    The value of dynamic enterprise modeling and simulation and quantitative methods
    is clear. Quantification is important where feasible and data can be estimated.
    Also, the qualitative behavior of quantified models may be an excellent source
    of insight for complex systems engineering. Purely qualitative approaches are
    also appropriate for incorporation into a full suite of models.


    Finally, this sourcebook represents a snapshot of the state of the enterprise
    dynamics discipline in its formative stages. The authors believe that the directions
    established by ever-increasing capabilities to deal with the complexities of enterprise
    transformation to achieve higher performance levels.


    Looking ahead at emerging capabilities for dynamic analytics that will be available
    to managers, a new world of ubiquitous computing—predicted for the past three
    decades—is becoming a reality posing major management opportunities and challenges.
    Ubiquitous computing makes information available anytime on any device with powerful
    data mining and analytical capabilities. Synergistic forces between societal trends,
    such as consumerization, and emerging technologies that enable ubiquitous computing
    are fueling, collaborative, real-time decisionmaking and control. These changes
    challenge legacy concepts of organizational structures and require new thinking
    about how to model POET enterprises through continuous change. Agile enterprises
    will evolve to maintain integrity and viability through continuous change and
    adaptation to increase operational performance and value to stakeholders.


    Boundaries between enterprises and their business systems and infrastructure will
    become fuzzy and fluid and enterprise ecosystems proliferate, extending operations
    beyond traditional organizational boundaries. Customers and other stakeholders
    will be brought more directly into an "extended enterprise" in this new world
    of ubiquitous computing. Strategic outcomes—once the planning and transformation—are
    becoming more emergent than predictable and controllable. Evolutionary transformation
    and acquisition methods are needed to cope with the pace of change characteristic
    of agile, adaptive enterprises and may focus on capabilities and problem solutions
    rather than long-term implementation cycles for more flexible systems. Perhaps
    the strongest toughest of ubiquitous computing technologies on enterprise transformation
    is the complexity associated with implementing security and privacy controls required
    to avoid cyber catastrophes from decentralized, mobile, and dynamically formulated
    business processes. Successful enterprises will navigate this space through evolutionary
    processes that exploit the significant opportunities and manage the inherent risks.'
