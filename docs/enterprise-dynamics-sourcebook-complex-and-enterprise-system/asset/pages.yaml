  md: '# # Introduction


    The only constant is change, continuing change,

    inevitable change that is the dominant factor in society today.


    Isaac Asimov


    This Enterprise Dynamics Sourcebook is the product of the MITRE Corporation’s
    (MITRE) Sponsored Research Program and a range of published applications that
    pertain to enterprise transformation programs. As a sourcebook it draws on a series
    of published papers and reports documenting case studies that provide a starting
    point for a new discipline of enterprise dynamics as a core capability of enterprise
    systems engineering (ESE). This case study approach captures the diversity of
    transformation environments and the evolution of methods to deal with this emergent
    challenge to government and private sector enterprises. Just as fluid dynamics
    and structural dynamics advance other engineering practices, enterprise dynamics
    advances the practices of systems engineering at the enterprise level and enterprise
    architecting, enabling the enterprise systems engineering and architecting (ESE/A)
    process described in Chapter 5, Section 5.8 and drawing on tools and methods described
    throughout Section I.


    Rapidly changing market, technological, and organizational environments pose complex
    challenges to government and private enterprises that must improve services and
    transform their processes, organizations, and resource base. Planning and management
    of such extreme transformation require extended management tools and methods that
    deal with the dynamics of change. This sourcebook provides a foundation and examples
    of methods that deal with the complexities of enterprise transformation involving
    the coordination of policies, organizations, economics, and technology (POET)
    in operational strategies and processes. In its original formulation, the “O”
    in POET designated designated organizations; here it is used to designate organizations,
    giving greater emphasis to organizational issues, the major theme of ESE/A is
    transformation of operational capabilities, and recognizing the importance of
    managing organizational change in coordination with other transformation activities.
    Throughout this sourcebook enterprise dynamics focuses on the mission and business
    operations of the enterprise.'
  merge: -1
  pgno: 10
