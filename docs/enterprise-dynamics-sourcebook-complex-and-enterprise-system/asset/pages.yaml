    the managers. Entity pairs within each causal directed relation are modular and
    consist of parent–child pairs that are stable physical mechanisms where changes
    to a pair are (i.e., they do not affect other pairs). Temporal order means that
    if Entity X behavior causes Entity Y behavior, then Entity X behavior must occur
    before Entity Y within the same time interval. Antisymmetry means that if X causes
    Y, then Y will not cause X at the same time. Proximity means that Entity X must
    have a single-step directed relation to the associated Entity Y behavior that
    not inserting another step for the direct effect to occur.


    Last, the causal level indicates the nature of the cause and effect among the
    behavioral entities. Positive relevance means that Y is more likely to occur X
    than if X did not. Necessary means that X is required to produce the desired effects
    in Y, and the desired effects will not be possible without X. Sufficient means
    that X’s behavior alone very likely will produce the desired behaviors in Y, recognizing
    that there may be other ways to generate the Y behavior than X. Necessary and
    sufficient means that X’s is necessary and X alone can produce the desired behavior
    in Y. Within LSERA, cause and effect is probabilistic. The analysts will need
    a probabilistic expression for positive relevance, necessary, sufficient, and
    necessary and sufficient to substantiate the direct or indirect cause assertions.
    The LSERA inference model supports this.


