    stocks. Management allocates production resources by scheduling start and campaigns
    for these different materials. Each campaign has a distinct finish date and it
    is organized into a master roadmap. With each campaign start, existing production
    capacity is committed for that purpose, temporarily reducing the capacity for
    other campaigns. Capacity is subsequently freed when a campaign ends, making process
    options available for other materials. This flexibility is shown by the influence
    of available capacity to process option in Flow 10.1. Over the course of the campaigns,
    interim milestones make periodic progress toward a final closure objective.


    This planning process is straightforward for conventional materials that can be
    processed in existing facilities. However, unconventional materials often require
    capital investments with first-of-a-kind technologies. These investments range
    from minor modifications to a major investment in a new facility such as the Salt
    Waste Processing Facility (SWPF).


    Investment decisions are generally driven by production schedules and stakeholders.
    This is more typical in the public sector in contrast to the private sector. Morecroft
    (2007) presents three different approaches to evaluating capital investments:
    finance-driven, planning-driven, and operations-driven. EM typically focuses on
    the required capacity to meet regulatory commitment dates and projected benefits
    from accelerating milestones (operations-driven). This investment approach is
    viable rationale; we simply point out that it is generally more appropriate for
    the public sector. EM manages these investments to deliver performance objectives
    on time and within budget. Over the past five years, there has been a focus on
    accelerating the cleanup by compressing the roadmap and generally managing total
    program costs to a level funding profile.


