    # 6.1 Introduction


    Today, despite the efforts of researchers in many fields over the past half-century,
    the design and management of enterprises remains as much art as science. The complex
    structure and behavioral dynamics of enterprises makes it difficult to untangle
    the relationship between form and behavior; changes to one aspect of an enterprise’s
    structure, incentives, or strategy can affect its behavior in seemingly unrelated
    areas at distant points in time. An enterprise is composed of many different elements,
    such as the business plan, organizational structures, processes, and technologies,
    all of these interact, in dynamic ways that are difficult for an individual or
    group with limited visibility and cognitive capacity to anticipate. Nonlinearities,
    inertia, delays, and feedback in the system contribute to the difficulty in understanding
    how complex enterprises are influenced by the “design” of the enterprise that
    produced them. It is exceedingly difficult for enterprise leaders to anticipate
    how any changes to their enterprise’s form may affect its behavior without tools
    to help them analyze the behavior and its drivers.


    Imagine the task of a chief executive officer, faced with a shifting business
    environment challenging the existing business model. There are a host of questions
    that may be asked in such a situation:'
  merge: -1
  pgno: 135
- img_proc: true
  md: '# Simulation of Enterprise Architecture for a Business Strategy 113


    +   - How can the enterprise be retooled to capitalize on a newly developed business
    model?


    +   - Will a new business model require changes to the enterprise''s organization,
    processes, or knowledge requirements?


    +   - How can a new organizational form and incentives be developed that will
    be responsive to new customer demands or more quickly take advantage of new technologies
    in its products and processes?


    +   - Could alternative proposed forms of the enterprise be compared to each other?
    How could trade-offs be assessed?


    Currently, enterprise leaders have few tools available to help them wrestle with
    questions such as those that concern the enterprise''s architecture, its design.
    Most major decisions concerning an enterprise''s architecture are made without
    the aid of a tool that allows experimentation to test hypotheses. Previous practical
    efforts to develop tools and processes to conceive and analyze aspects of the
    enterprise, such as business process re-engineering (Hammer and Champy 1993) and
    value stream mapping (Womack and Jones 1996) have relied heavily on "brown-paper
    wall" or "white board," employing sticky notes and hand-drawn lines to convey
    new organizational structures and processes. More recent efforts have used simple
    digital versions of this static "boxes and lines" approach to modeling the enterprise''s
    structure. Such approaches do not create dynamic models that can be subjected
    to hands-on experimentation, however. They do not embrace the use of tools and
    concepts from the field of e-architecting. What is required is the capability
    to bridge the gap between descriptive approaches to enterprise design and quantifiable
    models from which results can be collected and analyzed (Fowler 2003). Without
    the ability to analyze new, there cannot be a formal reliable process for designing
    (redesigning, or evolving) the enterprise (Levitt 2004).


    # 6.2 Enterprise as a Complex System


    Unfortunately, an ideal comprehensive model that captures every facet of an enterprise''s
    design and behavior would be extremely difficult, if not impossible to create
    in practice. As demonstrated in Chapter 3, enterprises are very complex systems,
    orders of magnitude more complex than the largest models that modern computers
    can handle (Simon 1990). Enterprises are both structurally complex, in that they
    have a great number of interconnections, as well as behaviorally complex, in that
    the behavior of the system cannot be understood or anticipated by study of the
    constituent parts; its behavior is more than the sum of its parts. There are many
    factors that make enterprises complex. Enterprises are'
  merge: -1
  pgno: 136
- img_proc: true
  md: '# Enterprise Dynamics Sourcebook


    +   - Sociotechnical systems, combining “hard” technical elements as well as “soft,”
    cultural and organizational elements

    - Highly interconnected with many feedback loops, inertia, and delays

    - Filled with autonomous people all making local and perhaps not strictly rational
    decisions

    - Capable of adaptation

    - Embedded in a constantly shifting, open environment


    The complexity of enterprises makes creating the ideal crystal ball model most
    impossible. A predictive simulation of a complex system that seeks to model all
    inputs, outputs and interactions is a futile endeavor. The data for such models
    are often approximated, and the full nature of all interactions is not known.
    Enterprises exhibit chaotic behavior: they are stochastic and sensitive to small
    perturbations to their conditions that make accurate prediction to impossible
    (Dooley and Van De Ven 1999). Sterman (1991, pp. 209–229) argues “It is not possible
    to build a single, integrated model of (a complex system), into which mathematical
    inputs can be inserted and out of which will a coherent and useful understanding
    of world trends.” A fully detailed, predictive model of a complex system would
    necessarily be as complex as the original system.


    The key to modeling complex systems as an enterprise is to properly abstract them.
    Modelers must abstract from the complexity of the enterprise in a way that helps
    highlight critical interactions and relationships that drive behaviors of interest,
    while ignoring other interactions that do not contribute to a systems-level understanding
    of the enterprise. Herbert Simon (1990) argues that for many problems, the answers
    needed do not require a highly detailed, predictive model, but rather one that
    is capable of understanding general trends, paths, and steady states. Rather than
    focus on models that try to predict the chaotic behavior of enterprises, models
    and leaders should seek out “organization-specific generative models that can
    explain how the chaotic behavior came in the first place” (Dooley and Van De Ven
    1999). Enterprises must be understood in terms of their dynamic behavior, and
    models must be designed to capture patterns of events driven by the organizational
    design (Abbott 1990). Enterprise modelers should not concern themselves with how
    to build more detailed models, but instead with how to develop abstractions of
    enterprises in a way that allows more insight into their behavior, and ultimately
    to a better job of conceiving and managing them.


    # 6.2.1 Abstracting Enterprise Complexity


    One approach to developing an abstraction of the enterprise, as explained in Chapter
    3, is the practice of enterprise architecting. Enterprise architecting holds that
    the enterprise can be both understood and designed by employing the construct
    of'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# Simulation of Enterprise Architecture for a Business Strategy


    enterprise architecture as a unifying conceptual framework. The enterprise architecture
    is a documented abstraction of the fundamental organization of an enterprise as
    a dynamic holistic system with nonlinearly interacting components. The architecture
    of an enterprise is an abstraction of its essential features, rather than a complete
    description of its design. In order to help enterprise architects develop these
    abstractions, enterprise architecture frameworks (such as the policies, organizations,
    economics, and technology (POET) framework used in this sourcebook) serve as a
    starting point in establishing scope and identifying key abstractions, boundaries,
    and interactions within an architecture. Each framework identifies multiple views
    that can be used to decompose the architecture from different perspectives, such
    as strategy, organizational structure, processes, and information technology.


    Unlike the theoretical literature on organizational design and architecture that
    remains highly fragmented and multifaceted, an important benefit of the enterprise
    architecture reference frameworks is that they provide a practical way for defining
    and decomposing enterprises as an interconnected system, relating the disparate
    components of the architecture together. Enterprise architecture frameworks are
    intended to serve as a unifying platform for many different disciplines of enterprise
    design and study to allow their combined and coordinated application, rather than
    their individual disjoint application. They do not provide theoretically grounded
    guidance of their own to guide the architecting process, but instead unify the
    theories developed in disparate research areas such as organizational science,
    management science, and business process design in order to achieve this task.
    They provide well-defined workable representations of aspects of the enterprise
    that can be analyzed by employing a number of methods to help understand and create
    enterprise architectures.


    Enterprise architecture frameworks provide a potentially useful way of simplifying
    and abstracting an enterprise''s complexity by decomposing it into its many constituent
    components, each representing a discrete view, and by linking them together into
    an interconnected whole, by utilizing social theory. The resulting architectures,
    however, are static representations and present limited opportunity for quantitative
    analysis of the dynamic enterprise architecture. It is difficult to use an enterprise
    architecture framework alone to answer a question concerning the enterprise''s
    potential behavior. To answer such questions, a simulation model of enterprise
    behavior is needed. The enterprise architecture, however, may be used to provide
    the necessary abstractions, scoping, structure, and interactions necessary to
    create a simulation model to answer the question.


    # 6.2.2 Hybrid Simulation Modeling


    The complexity of enterprises requires that they be abstracted into different
    systems in order to be understood. Each subsystem presents a new perspective on
    the enterprise, complete with its own context. For the modeler attempting to model'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'behavior this presents a challenge: many problematic behaviors span multiple
    perspectives, and there is no single simulation modeling methodology that is capable
    of simulating each perspective in its context (Mingers and Gill 1997). The tools
    used to simulate the behavior of the incentivized collection of people within
    an organization are very different from those used to simulate the execution of
    a manufacturing process or top-down strategic resource allocation decisions. Each
    simulation methodology has its owns strengths and weaknesses, based on the assumptions
    and methods that it uses to simulate the system at. For this reason, it has been
    argued that a cross-disciplinary approach to simulation modeling of enterprises
    be taken, engaging a portfolio of models from different fields and for different
    purposes, allowing the individual models to be compared, contrasted and credited
    (Sterman 1991).


    Others have gone to argue that using a portfolio of stand-alone simulation models
    does not accurately convey the system''s dynamics, and a hybrid multimetology
    approach to simulation should be used (Mingers and Gill 1997; Rabelo et al. 2005).
    In a hybrid simulation model, multiple submodels employing different simulation
    methodologies are interfaced with each other such that the execution of one submodel
    can be used as the input of another, forming a system of interacting subsystems.
    In recent years, this hybrid approach to modeling complex systems has gained traction
    in areas of enterprise modeling, such as supply chains (Schitzer and Grofler 2003;
    Rabelo et al. 2007), production planning (Yenkateswaran and Son 2005), and manufacturing
    decision making (Rabelo and Speller, Jr. 2005). These hybrid simulation models
    have employed system dynamics, agent-based models, and discrete event simulations
    to capture different perspectives of a system, and have applied each methodology
    to areas where it is the best method to describe and understand the system''s
    behavior.


    To date, the hybrid models of enterprise operations have been fairly modest in
    scope. There has not been a formalized approach to determining the boundaries
    between submodels in the hybrid models or the pathways of their interactions.
    Previous hybrid models have taken an ad hoc approach to boundary setting between
    simulation submodels. Ad hoc approaches will become increasingly problematic as
    the scope and complexity of hybrid models increases. Furthermore, each time a
    new model is required to capture a new aspect of the enterprise'' behavior, a
    new effort to abstract the portions of the enterprise being modeled is required.
    This can prove to be a very substantial amount of work, and may also provide obstacles
    to communicating the boundaries and scope of the model.


    # 6.2.3 An Enterprise Architecture-Based Hybrid Simulation Methodology


    Simulation models of enterprise behavior can take advantage of an initial definition
    of the existing enterprise architecture in order for them to capture an adequate'
