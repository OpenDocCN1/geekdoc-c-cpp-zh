    This process helps ensure that the simulation model is properly bounded and scoped,
    and that a framing question is well posed, the model is created in a logical progression,
    and the model can be useful in answering the question it was intended to answer.
    Modeling will always be a creative endeavor, however, it can benefit from a structured
    process. Without a well-developed process to guide the model creation effort,
    the model can quickly become unmanageable or unsuitable to its purposes lose of
    sight scope, purpose, or structure. A process that is standardized helps to ensure
    that models do not lose sight of the end goals, and structures the model in ways
    that make it more useful to decision makers and for later use. The process serves
    as a tool to guide the creative process in much the same way that an EA framework
    is used to create the EA.


    The process of creating a model is not a strictly linear process. All modeling
    is iterative with updates to the model as more information becomes available and
    new insights are made. As the model is created, it should be continuously tested
    and re-evaluated to ensure that it is meeting its objectives. Although testing
    is often rarely tended toward the end of the modeling process, because preliminary
    tests cannot be performed during model development. After the model is evaluated,
    new hypotheses are developed, and the process can be iterated again.


    # 4.4.2 Executable Multiagentcy Enterprise Architectures


    EAs are developed to guide investment in systems and services and to guide the
    improvement of business processes (Swell 2005). The as-is architecture describes
    the current business processes, activities, services, data resources, and infrastructure.
    These are a rich source of initial conditions for state-space parameters. Executable
    architectures add a modeling capability to analyze the interactions and performance
    of these elements in the systems and the operational (system systems) environment.
    A multiagent executable architecture is formulated in a case study for an international
    trade scenario in Chapter 11.'
