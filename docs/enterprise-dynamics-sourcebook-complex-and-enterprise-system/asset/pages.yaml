  md: '# Managing Enterprise Transformation Using ESE/A ■ 99


    # 5.9 Conclusions


    The management of enterprise transformation requires an effective governance environment
    together with an enterprise transformation process such as ESE/A. The challenges
    of transformation in complex enterprises, whether single or multiagency missions,
    are extremely demanding from both the organizational and technical perspectives.
    As such, they require the integrated efforts of executive managers, operations
    managers and technical program managers. The discipline of enterprise dynamics
    provides a theory and a practical discipline to integrate management processes
    such as ABM and ERP with EAs and performance models.


    A major fraction of the failures in large-scale enterprise programs are attributed
    to a lack of attention to the program complexities and challenges across the POET
    elements that are involved. When applied with effective governance the ESE/A process
    outlined here provides:


    +   - A disciplined sequential approach to planning, architecting, and carrying
    out a major enterprise transformation

    - A framework to portray the program complexities; the temporal, organizational,
    and management landscapes; and the various perspectives of stakeholders on the
    transformation

    - A guide to selecting the appropriate qualitative and quantitative models to
    describe the transformation in sufficient detail to project likely outcomes and
    emergent behaviors

    - A governance structure to incorporate stakeholder perspectives and interest
    in the outcome, and to reveal reinforcing and conflicting behaviors

    - A systems engineering and architecting approach to integrate and harmonize policy,
    organizational, economic, and technology elements of the transformation


    The ESE/A process captures experience and best practices gained over a range of
    programs. As it is applied going forward, it will evolve to greater levels of
    reliability and effectiveness. This process will fully support the performance-based
    and outcomes-oriented transformation guidelines.


    Given the role and reach of public and private sector enterprises in national
    and global operations with extensive partnerships and supply chain relationships,
    the multiagency model is becoming the dominant mode. The concept of idealized
    multiagency governance environment that builds on the capabilities of individual
    agencies was introduced for very close coupling of technical management with operational
    management. The architecture-based approach, with a strong focus on mission activities,
    can deal effectively with the complexity and challenges in achieving this objective.
    It provides the comprehensive systems perspective of transformation technologies
    and mission activities needed for successful technical management in a multiagency
    environment.'
