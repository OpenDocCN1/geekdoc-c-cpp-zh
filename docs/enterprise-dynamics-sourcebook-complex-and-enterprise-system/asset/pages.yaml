  md: '# xviii Introduction


    Major transformational initiatives have been proposed to deal with resource depletion
    and environmental challenges. The energy and materials systems underlying the
    physical infrastructure of national economies are complex and addressed here through
    combined technical and economic analytical methods.


    # Chapter 13: Modeling the Nation''s Healthcare System as a Dynamic Enterprise


    This case study provides an example of a government ESE challenge to transform
    healthcare to provide greater access at a sustainable cost with effective outcomes.
    Healthcare sectors account for 18% of the U.S. economy with roughly half of being
    funded through government programs. This application spans the POET aspects of
    the challenge at multiple scales from demographics through specific diagnostic
    and therapeutic services, the structure of healthcare sectors and interactions
    with other sectors of the economy, to the overall economy. A framework is presented
    that helps to integrate analytics into this data-rich, information-poor environment.


    # Epilogue: Enterprise Systems Engineering and Architecting—Lessons and the Road
    Ahead


    The epilogue reinforces descriptive enterprise dynamics as an essential part of
    enterprise planning and analysis for the acquisition and implementation of transform
    technologies and processes to improve mission performance. This dynamic perspective
    of the POET aspects of the enterprise is a central feature of the ESE/A process.
    This sourcebook is a snapshot and assessment of the current state of an emergent
    field of national import and a platform for further research and operational applications.


