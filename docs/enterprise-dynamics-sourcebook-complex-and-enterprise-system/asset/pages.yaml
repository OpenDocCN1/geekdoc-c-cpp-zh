  md: '# Acknowledgments


    The authors sincerely thank those who contributed case study chapters for this
    sourcebook. These represent an impressive sampling from over a decade of enterprise
    engineering planning and analytic experience at MITRE.


    The organizing principles of enterprise dynamics as a core systems engineering
    discipline stem from MITRE-sponsored research performed over a three-year period
    from 2005 to 2007. David Lehman, then MITRE''s chief engineer, and Anne Cady,
    then chief engineer of MITRE''s Center for Enterprise Modernization and a co-author,
    actively supported the initiation of the research effort. Kirkor Bozdanogan and
    Joseph Sussman of the Engineering Systems Division at the Massachusetts Institute
    of Technology collaborated in the research and made invaluable contributions that
    are evident in the numerous citations of their work.


    Rick Sciambi, chief engineer of the MITRE Center for Connected Government, and
    Glenn Roberts, chief engineer of the Center for Advanced Aviation System Development,
    provided much appreciated counsel and guidance to the wide range of projects and
    research efforts represented in this sourcebook.


    Many thanks to Iris Fahr for editing support, and to others at Taylor & Francis
    for their helpful contributions.'
