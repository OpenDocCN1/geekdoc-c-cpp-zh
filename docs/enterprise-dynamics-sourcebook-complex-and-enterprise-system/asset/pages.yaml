    has been applied by the U.S. General Services Administration (GSA), which is leading
    the work on ontology and XML-based web services mark-ups for enterprise architectures.
    The GSA work will facilitate the search and retrieval of information in enterprise
    architectures for incorporation into the operations-centric architecture and business
    process simulation models.


    # 11.9 Conclusion


    The ESE workbench includes and integrates the basic tools to describe mission
    operations, organizational roles and responsibilities, business processes, enterprise
    resources, and information services and technologies needed to improve capabilities
    to support the governance of commerce such as international commerce. The workbench
    is scalable and extensible, using web services enterprise middleware for information
    sharing and access to other enterprise engineering and planning tools (e.g., process
    optimization, resource allocation, decision support) in the integration environment.
    The basic tools have been demonstrated for governance of the most complex operations,
    those in the multiagency environment. They are equally applicable to individual
    agencies and commercial operations with complex operations and processes.


    The transformation programs of individual firms and agencies represented in their
    respective architectures can be brought into the operations-centric architecture
    to evaluate their effectiveness in the overall multiagency mission. The definition
    and use of a consistent set of activities and services in the architectures and
    the simulation performance models support management concepts of activity-based
    management (ABM), (Player and Keys 1999), and can also be captured in an ERP system
    for budgeting, monitoring, and management.


    Perhaps more important than the feasibility and value of the ESE workbench is
    the concept of an independent program planning and analysis office for a multinational
    and multiagency enterprise such as international commerce. The independent “notional”
    joint office postulated in this case study is a feasible concept that would provide
    advisory value to all stakeholders.


