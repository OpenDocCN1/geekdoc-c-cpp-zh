    # 12.6.2 Relation to Economic Models*


    There is a direct and natural link between a physical process flow model and macroeconomic
    planning methods indicated in Figure 12.4. A macroeconomic model can be formulated
    with reasonable sector detail (e.g., more than 10 sectors) to address physical
    demands on the materials and energy infrastructure as a function of demographic,
    financial, and policy factors.


    A variety of methods has been employed for the economic analysis of materials
    and energy resources using econometric methods, linear programming, input-output,
    dynamic simulation, and systems dynamics. Each method brings some unique perspective
    to the problem and relative advantages and disadvantages in specific planning
    and analysis issues.


