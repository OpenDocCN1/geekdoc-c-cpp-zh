    +   - A resident node that has the random variable (tpm). This random variable
    represents the performance entity and the tpm attribute represents a unique instance
    of a defined technical performance measure. The states of performance (tpm) represent
    the associated performance hypotheses.


    +   - An input node that has the random variable behavior (ti). It represents
    the technology initiative entity and the ti attribute represents a unique instance
    of the TI. The states of behavior (ti) again consist with the associated behavioral
    hypotheses.


