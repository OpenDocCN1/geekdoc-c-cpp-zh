    # 3.4.4 Application of Enterprise Architecture Frameworks in Systems Engineering


    In contrast to the traditional architecture that creates blueprints for the construction
    of new buildings, enterprise architecting is most often used to support the efforts
    of enterprises already in operation that seek to change in some way. Enterprise
    architecting efforts begin with the "current state" EA: a blueprint of the enterprise
    in its current form. The current state architecture serves as the baseline for
    all enterprise change activities. In an ideal environment, an enterprise will
    always have its current state architecture updated and available.


    In enterprise change, some change has occurred that has made the current state
    architecture undesirable. Perhaps the environment has changed, rendering old processes
    inadequate; perhaps the enterprise''s strategy has changed in order to become
    more competitive in the marketplace. When a desire arises from the current state
    architecture, the first step is to analyze the current state to identify where
    changes should be made to achieve the desired behavior for the transformed state.
    Currently, there are few rigorous processes for behavioral or performance analysis
    of EAs. In practice, many “analyses” consist of establishing carefully crafted
    narratives that link architecture to performance based on observation; the better
    analyses will involve an application of metrics to support the narrative. Value
    stream mapping (Rother and Shook 2003) and business process analysis of conducted
    on EAs. Such changes can potentially be very useful and accessible to many organizations
    but cannot provide a true analysis that links an enterprise''s performance to
    its architecture or measure how a change to the architecture will affect enterprise
    performance. As complexity in the EA grows, the effectiveness of such static qualitative
    analysis techniques decreases.


    Currently, the analysis of current state and future state EAs is a weakness of
    most enterprise architecting efforts. In some cases, analysis of the current state
    may be skipped entirely in favor of directly creating an alternative future state
    that addresses perceived problems. Such a weak treatment of analysis has the potential
    to completely undermine the value of enterprise architecting.


    Despite the fact that EA frameworks represent an attempt to provide systems thinking
    approach to describing architecture, if the architecture is not also'
