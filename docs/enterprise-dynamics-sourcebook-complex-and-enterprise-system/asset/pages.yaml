  md: '# 9.1 Introduction


    In an earlier paper (Mathieu et al. 2007b), an existing Air and Space Operations
    Center (AOC) process model (i.e., Petri net) and new global and mission models
    for the environment in which the AOC operates (i.e., system dynamics) were linked
    (federated). The focus of this chapter is the development of an operator-environment
    model (i.e., agent-based model). An systems framework for attention allocation
    of operators within the AOC has been implemented that supports multiple modeling
    paradigms. The results for linking the Petri net and system dynamics are summarized,
    and new results for the agent-based model are presented based on a pilot-down
    scenario. It has been observed that many AOC operators can become distracted by
    a pilot-down scenario, even if the operator is not able to assist in the rescue
    directly. Furthermore, this distraction has been hypothesized to have a detrimental
    effect on the activities of the uninvolved operators are currently handling.


    # 9.2 Background


    A set of interrelated activities (or regime) for complex-system engineering has
    been suggested (Kuras and White 2005; White 2005a; White 2005b; Kuras and White
    2006), including: (1) analyze and shape the environment; (2) tailor developmental
    methods to specific regions and scales; (3) identify or define target outcome
    spaces; (4) establish rewards (and penalties); (5) judge actual results and allocate
    rewards; (6) formulate and enforce developmental stimulants; (7) characterize
    continuously; and (8) formulate and enforce fitness regulations (policing).


    These activities were hypothesized to focus and accelerate the natural evolution
    for the potential benefit of the system. The goal of this effort is to develop
    a multiscale model using real data and subject matter experts (e.g., Figure 9.1).
    The main research question is how to link (federate) the models from the various
    scales together. Once a multiscale model exists, it will be possible to apply
    more fully the activities listed above. As part of this study, analyzing and shaping
    the environment, tailoring development methods, judging results, characterizing
    continuously, and enforcing fitness regulations are all part of the modeling process.
    The methods can be applied after the multiscale model is validated.


    The earlier paper (Mathieu et al. 2007b)'
