  md: '# 16 ■ Enterprise Dynamics Sourcebook


    a reasonable balance between the economic (cost) and technological elements of
    those programs. Manufacturing firms and local governments had restrictive bud-gets
    and could not print money, so costs were dealt with very seriously as a con-strain.
    This may be contrasted with budget “discipline” at the federal level.


    When operational aspects of new technologies such as radar became a focus of attention
    in World War II, it was clear that adversarial strategies and human reactions
    were of great importance and the field of operations research (OR) developed rapidly
    to address human, organizational, and operational aspects of systems. Systems
    engineering drew on OR methods, and vice versa. They shared many common elements
    in their respective timelines as evident in an OR timeline (Gass 2002) that is
    integrated in the following section with the systems engineering timeline to illustrate
    the significant cross-fertilization that took place. Specialized areas related
    to OR such as management science and organizational science emerged and are among
    the more important disciplines that need to be drawn upon in a multi-disciplinary
    E/A process. Certainly during WWII, and in defense programs thereafter, advanced
    capabilities to deal with threats to the nation proceeded over the economic elements.


    OR, post WWII, is sometimes characterized as emphasizing theory and method-ologies,
    whereas systems engineering emphasized applications in keeping with engineering
    traditions. Systems engineering is generally offered as an interdisciplin-ary
    program within schools of engineering. Curricula have evolved from basically a
    control theory chore through the incorporation of OR methods to a predominantly
    software development curriculum in response to program application challenges.


    # 2.3 Evolution of Systems Engineering—Timeline


    To the extent that systems engineering-like methods were applied in the early
    stages of this timeline, they generally emphasized the purely technical aspects
    of the problem separately from policy and organizational aspects of the enterprise.
    For example, the timeline for relevant systems engineering-related programs from
    the late 1930s to the 1990s is summarized as follows.


    1938—NYC-LI Highway and Park System (Caro 1975). Often cited to illustrate emergent
    behavior in complex adaptive systems (e.g., unforeseen outcomes of suburbanization).
    Some New Yorkers who enjoyed the highways and parks have a much more positive
    view of this era and the role of Robert Moses than that expressed by Caro.


    This period is exemplified by the technological vision of the Futurama exhibit
    at the 1939 NY World’s Fair (Figure 2.1).


    1940s—Bell Labs. First reference to systems engineering; see History (INCOSE 2010).'
