  md: '# Optimal Control and Differential Game Modeling


    (partially completed) system. In this generalization, $t_i$ can be understood
    as a vector of times corresponding to different developments, $X(t_i)$ as a matrix
    of states across the vector of times, and the integral of the cost function in
    Equation (8.2) can be expanded to a sum of integrals of cost functions across
    the different developments.


    The assumption behind ''optimization'' in the optimal control framework for a
    single modeled stakeholder is that SE decision makes choices reflecting cost,
    schedule, and performance trade-offs. It is not that SE decision literally minimize
    their decisions, but optimization in the framework shows the kind of high-level
    behavior that could be expected to emerge from cost, schedule, and performance
    trade-offs in an SE program. Similarly, with multiple stakeholders, equilibrium
    represents a type of collective behavior that could be expected from each stakeholder,
    making its own trade-offs. Another important factor represented in the framework
    is that SE decision takes into account not only the immediate effects of their
    decisions but also the longer-term effects. SE is a "planned" effort over a period
    of time, and the motivational framework expressed by Equation (8.2) reflects the
    impacts of a decision taken at time $t$ on overall benefit accumulated over the
    system lifetime.


    With only one modeled stakeholder, the problem of finding the "best" control $U(t)$
    is an optimal control problem. With multiple stakeholders, different stakeholders
    exercise different controls, and there is not necessarily a single optimum for
    all stakeholders. We represent the state of the different stakeholders with different
    components of $X(t)$ and controls of the different stakeholders with different
    components of $U(t)$. Stakeholder interactions are modeled with a differential
    game approach, in which equilibrium solutions represent potential attractors for
    collective stakeholder behavior. As discussed later in the chapter, such equilibrium
    solutions are not necessarily unique for a given game, suggesting a mathematical
    basis for a fundamental unpredictability limit in multistakeholder models with
    scalar state and control variables.


    # 8.3 Optimal Control Models


    We begin with a discussion of optimal control models in which $X(t)$ and $U(t)$
    are both scalars, and the objective function $J$ also is a scalar. This is the
    simplest type of model in the optimal control framework, corresponding to a single
    modeled stakeholder with a unitary control.


    # 8.3.1 Linear Models*


    In a linear model, the equation of state (1) reduces to:


    ```

    $\dot{X} = A \cdot X + B \cdot U$

    ```


