  md: '# 8.2 The Framework*


    We use a general form for the SE process based on optimal control theory as follows:


    ```

    $\dot{X} = f(X(t), U(t), t), \quad (8.1)$

    ```


    The vector $X(t)$ is a state vector for the enterprise and the vector $U(t)$ represents
    control elements affecting enterprise evolution. The components of $X(t)$ depend
    on the specific SE process being modeled, but might include, for example, metrics
    of progress towards the capability developed, or total expenditures made towards
    the system acquisition, or other metrics related to the enterprise that could
    affect the SE process (Hoffman et al. 2007). The dot above $X$ on the left side
    of Equation (8.1) is the derivative with respect to time. The function $f$ relates
    the current state $X(t)$, the control $U(t)$, and time $t$ to the evolution of
    $X$ in time. In general, the function $f$ may include random as well as deterministic
    variables. Following optimal control theory (Bryson and Ho 1975), we postulate
    the motivation from stakeholder i for the controls ij is exercised by an objective
    function for stakeholder i:


    ```

    $J_i = \Phi_i(X(t_i), t_i) - \int_{t_0}^{t_i} L_i(X(t), U(t), t) dt \quad \(8.2)$

    ```


    In general, different stakeholders in an SE process may have different motivations,
    hence different $J_i$. For example, an SE contractor might be motivated by profit,
    whereas a government program manager might be motivated by the difference between
    benefit and total cost of the SE.


    On the right-hand side of Equation (8.2), the second term integrates a cost from
    a specified start time $t_0$ to an end time $t_i$. In an acquisition context,
    the second term represents total cost to acquire the systems. The end time $t_i$,
    which typically represents the time to complete system development, may be a control
    variable. The end time together with the time inherent in $L_i$ specify a high-level
    "schedule" and potentially other aspects of the SE process. The first term in
    Equation (8.2) represents the performance value of the acquired system in enterprise
    operations, which may depend on the time taken to acquire the system. Thus, Equation
    (8.2) represents mathematically the "iron triangle" of cost, schedule, and performance
    in SE.


    A further generalization of Equation (8.2) is discussed in this chapter, recognizing
    that there may be multiple stages towards development of a system, which may be
    completed across a range of times. At the end of each stage, it may be possible
    to free some capability into enterprise operations and generate benefit from the


    > *Wojcik, L.A. and K.C. Hoffman. 2007. ©2007 IEEE. IEEE/S International Conference
    on System of Systems Engineering (SoSE), April 16–18. With permission.'
  merge: -1
