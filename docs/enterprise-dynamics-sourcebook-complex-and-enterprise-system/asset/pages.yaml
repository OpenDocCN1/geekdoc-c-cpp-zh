  md: "# Optimal Control and Differential Game Modeling\n\n#  8.3.2 Nonlinear Model\
    \ of External Complexity*\n\nTo model external complexity, in which events such\
    \ as changes in enterprise mission or an evolving enterprise environment alter\
    \ the requirements for a system, we modify the base control-theoretic model to\
    \ allow for sudden \"hits\" to $s(t)$, which instantaneously reduce $s(t)$, and\
    \ also \"helps,\" which instantaneously increase $s(t)$. Hits and helps (which\
    \ are called \"hits\" below for brevity) may occur during the acquisition period\
    \ from 0 to $t_f$, or afterwards, during the period of operational use. For simplicity,\
    \ the internal complexity parameter $\beta$ was set equal to 1 and aging parameter\
    \ $\\sigma$ was set equal to 0, as in the base model. The new equation of state\
    \ is:\n\n```\n$$\\dot{s}(t) = b \\cdot q(t) - \\sum_{i=1}^{n} c_i \\cdot \\delta(t\
    \ - t_i) \\cdot s(t) \\quad (8.34)$\n```\n\nThe magnitude of the $i$th hit, expressed\
    \ as a fraction of current $s(t)$, is given by $c_i$ and the times at the hits\
    \ occur are given by $t_i$. The \"minus\" subscript indicates that the $i$th hit\
    \ is applied to the value of $s(t)$ prior to $t_i$. Although hits may occur during\
    \ both the acquisition period and during operational use, expenditures are assumed\
    \ to be zero during operational use (hence $q(t)$ is zero at times greater than\
    \ $t_f$), as in previous sections. Then, the objective function is:\n\n```\n$J\
    \ = K \\cdot \\int_{0}^{t_f} s(t) \\cdot dt - \\int_{0}^{t_f} q^2(t) \\cdot dt\
    \ = K \\cdot s(t_f) \\cdot h(t_f) - \\int_{t_f}^{0} q^2(t) \\cdot dt \\quad (8.35)$\n\
    ```\n\nwhere:\n\n```\n$h(t_f) = \\left(t_{m(t_f)+1} - t_f) + \\sum_{i=m(t_f)+1}^{n}\
    \ (t_{i+1} - t_i) \\cdot \\prod_{j=m(t_f)+1}^{i} (1 - c_j)\\right) \\quad (8.36)$\n\
    ```\n\nThe parameter $m(t_f)$ is the index of the last hit between time 0 and\
    \ $t_f$, the last hit during the acquisition period, and $m(t_f)$ is zero if there\
    \ are no hits during the acquisition period. The summation in Equation (8.36)\
    \ is defined to be zero if the starting index exceeds the final index. $t_0 =\
    \ 0$ and $t_{n+1}=t_f$. Thus, Equation (8.36) accounts for instantaneous changes\
    \ in the value of $s(t)$ during the operational use, due to hits specified in\
    \ Equation (8.34). If no hits occur during the operational use, then Equation\
    \ (8.35) reduces to Equation (8.5), the base model objective function.\n\n> *\
    \ Wojcik, L.A. and K.C. Hoffman. 2007.©2007 IEEE/SSC International Conference\
    \ on System of Systems Engineering (SoSE), April 16–18. With permission."
