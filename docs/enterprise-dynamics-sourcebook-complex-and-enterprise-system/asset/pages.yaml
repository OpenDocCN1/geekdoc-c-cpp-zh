  md: '# Defining Enterprise and Transformation Challenges 9


    Management decisions (and equally important "nondecision" decisions) rely on the
    enterprise sense-and-respond capabilities where the situation is monitored and
    measured across the controlled, influenced, and uncontrolled (C-I-U) space. The
    C-I-U paradigm is captured in the ESE/A process explicitly in a control-theoretic
    framework, specifically the C-I-U theoretic model.


    Enterprise resource management (ERP) methods provide a representation of the organization,
    activities performed, and resources utilized in the enterprise. Activity-based
    management (Player and Keys 1999) is often coupled with ERP to provide portions
    of a sense-and-respond capability. These methods along with EAs play an important
    role in ESE/A.


    Geographic information systems (GIS) are used to represent the physical location
    of enterprise assets, markets, operational environments and the movement of products,
    services, and resources. They play an important representational role in the ESE/A
    process as demonstrated in several of the case studies.


    The ESE/A process guidelines outlined in Section I include the following principal
    elements:


    +   - Characterization of the complex enterprise and processes, objectives, and
    important internal and external relationships

    - Multidisciplinary analysis of the cost and performance parameters across policies,
    organizations, economics, and technology (POET) elements for alternative transformation
    strategies and solutions using quantitative and qualitative methods

    - Analysis of stakeholder interests and influences, and organizational roles and
    responsibilities

    - Implementation of acquisition or transformation strategies and systems

    - Ongoing monitoring and management to achieve objective levels of improvement
    in operational performance


    # 1.4 Enterprise Dynamics Processes


    Enterprise dynamics is a discipline for analysis of the complex interaction of
    policy, organizational, economic, and technical factors within an enterprise that
    affect the operations of the enterprise and the acquisition and implementation
    of new capabilities for mission or business performance. These include:


    +   - Performance Dynamics in acquisition programs and in ad hoc proactive and
    reactive missions and business initiatives

    - Organizational and Behavioral Dynamics involving collaboration across agencies
    and among stakeholders to perform complex acquisitions and missions'
