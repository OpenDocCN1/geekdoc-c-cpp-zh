  md: '# Optimal Control and Differential Game Modeling 183


    external influences (comprised of policy, operational, economic, and technological,
    or POET, factors [Carlock, Decker, and Fenton 1999]) and stakeholder interactions.
    The work presented here brings together previous research results as to previously
    unreported results.


    The high-level optimal control models of this chapter represent cost, schedule,
    and performance trade-offs inherent in the SE process. The models are not "predictive"
    because the uncertainties associated with POET and stakeholder factors are simply
    too large. Quantitative validation of the models is likely to remain limited,
    especially where POET factors dominate. Rather, the models are intended for use
    in playing out different assumptions and strategies in SE programs where POET
    and stakeholder factors pervade the SE process. Ultimately, with further research,
    the models might form the base for greater scientific understanding of complex
    SE and contribute to the discourse on the nature of human/technological systems
    in general (Arthur 2009; Alderson and Doyle 2010). The models may prove useful
    in several ways relevant to practical SE.


    First, they can serve as communication and educational values to help practitioners
    understand the possible implications of SE management and governance approaches.
    As described later, the models can discern behavior patterns that may not be obvious
    to many government and industry decision makers or SE practitioners, yet ever
    in particular SE programs. The models can help a wide range of decision makers,
    SE practitioners, and students understand these behavior patterns and how to prepare
    for or respond to them better.


    Second, the models can be used for SE program diagnostics. When problems occur
    in an SE program, the models might suggest possible problem sources based on available
    data and program information. A retrospective example of this model-based diagnosis
    is presented in this chapter. To do this the parameters were first fit to the
    original program plan, based on available information, to the actual program trajectory,
    as it played out with various POET factors. Model parameter differences across
    the two program scenarios (planned versus actual) yield diagnostic information.
    With diagnostic tools for other complex systems such as human health, experts
    are needed to interpret and apply the diagnostics in the context of their knowledge
    and experience. But models of the SE process have the potential to extend what
    is possible with human expertise and also to communicate diagnostics clearly.


    Third, the models can be used for early-stage assessment of possible SE management
    and governance approaches. Even though the models are not predictive, they can
    suggest qualitative types of possible outcomes and behaviors of SE managers should
    be aware. Modeling for early stage assessment can augment judgment by "playing
    out" different possible assumptions about the future.'
