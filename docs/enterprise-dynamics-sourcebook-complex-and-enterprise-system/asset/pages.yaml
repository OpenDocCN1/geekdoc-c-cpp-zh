    # 7.3.2.4 LSERA Evidence Force


    In an EoS argument, enterprise personnel believe in the successful outcome of
    a technology initiative based on particular evidence, an EoS argument is complex,
    and understanding the influences of, for example, contradictory evidence, is difficult.
    Calculating the force of evidence supports the manager’s understanding of which
    pieces of evidence in isolation or in combination are contributing to the increase
    or decrease in the probability of a specific hypothesis being true. Managers understanding
    the force of particular evidence within the argument may increase their ability
    to make a more principled argument.


    LSERA uses likelihood ratios to measure the force of individual items of evidence
    and the influence of evidence across the argument. The likelihood ratio is simply
    the ratio of the likelihood of a piece of evidence (e*) existing something divided
    by the likelihood of e* if H did not occur (Hc). Evidential force (as Le*) when
    the likelihood ratio is


    > $L_{e^*} = P(e^*|H)/P(e^*|Hc)$


    In the LSERA method, each entity has multiple hypotheses. For example, the behavior
    entity hypotheses are {exceed, attain, and below}. Thus, for LSERA, it is necessary
    to expand the likelihood ratio formula for multiple hypotheses, which is simply
    determining P(e*|Hc).


    Setting $H_1$ as *exceed*, $H_2$ as *atain*, and $H_3$ as *below*, and after some
    algebra, the evident force of $e^*$, for example, $H_2$ is equal to its likelihood
    probability divided by the average of the likelihood probabilities of the other
    hypotheses. Equation (7.1) shows this force calculation.'
