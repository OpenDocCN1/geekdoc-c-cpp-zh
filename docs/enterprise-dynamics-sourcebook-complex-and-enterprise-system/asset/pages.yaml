    This section describes a differential game model to explore the dynamics of a
    range of enterprise types. Here, the enterprise might correspond to a government
    agency or set of agencies with a mission, and its environment is the external
    world that interacts with the enterprise. For example, the enterprise could be
    the FAA and its environment could be the users of the aviation system, including
    airlines, general aviation, and military users. Or, the enterprise could be the
    Internal Revenue Service (IRS) and its environment U.S taxpayers. The enterprise
