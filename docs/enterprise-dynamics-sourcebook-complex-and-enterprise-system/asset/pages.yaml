    likeliness of behavior attainments within the entire ELOs given each piece of
    new information. The LSERA knowledge structure derives from an examination of
    the enterprise architecture frameworks and from goal-oriented requirements engineering
    techniques (Chung et al. 1999; Vanmsweere 2001; Yu and Myopoulos 1998; Zowghi
    and Owen 1997). To address the enterprise architecture framework limitations and
    the ELO modeling choices, LSERA uses evidential reasoning multient Bayesian network
    (MEBN) (Laskey 2008). LSERA consists of two main models: the argument model, which
    structures the reasoning and relevant evidence to a chain of IF-THEN statements;
    and the inference model, which combines local Bayesian models into an overall
    probability model indicating the likelihood of attaining a behavior, goal, or
    transformation.


    The LSERA method supports three extensions to enterprise architecture and requirements
    engineering:


    +   - Considering enterprise architecture artifacts and other information artifacts
    as entities. These may be compound combinations of enterprise architecture metamodel
    entities, but they have no explicit representation within the enterprise architecture
    metamodel.

    - Defines entities. Evidence entities are instances of artifacts and metamodel
    entities that are relevant to an assertion.

    - Defines referential relations with probabilistic support, which enables reasoning
    on the likelihood of attainment.


    # 7.2 Discussion of Key Concepts


    The following provides a brief introduction to evidential reasoning and multiently
    Bayesian networks, key to understanding the LSERA method.


    # 7.2.1 Evidential Reasoning


    Reasoning is defined as the "use of reason, especially to form conclusions, inferences,
    or judgments" (American Heritage Dictionary of the English Language, Fourth Edition
    2000). There are various types of reasoning: deductive (Johnson-Laird 2009), inductive
    (Hacking 2001), abductive (Josephson and Josephson 1996), analogical (Jithe 2005),
    case-based (Amodt 1994), probabilistic (Pearl 1988), and evidential (Schum 1994).
    In an ELO argument, analysts do not use (a) deductive reasoning, because there
    are no stated premises or valid structures (e.g., syllogism), (b) inductive reasoning,
    because there are no repeated instances of the alignment on which to assert the
    plausibility of attainment, (c) abductive reasoning, because they do not start
    with performance evidence and to infer'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# Enterprise Dynamics Sourcebook


    the most likely explanation for the evidence, or (d) case-based reasoning, because
    there are no appropriate cases to study. The reasoning is not analogical because,
    in general, the alignment argument is unique.


    The ELo argument contains uncertainty within it, and analysts could choose to
    use some form of probabilistic reasoning. Probabilistic reasoning is reasoning
    that uses a form of probability theory as the argument logic. ELo has evidence
    and an argument structure, and analysts try to use the evidence to support or
    challenge an assertion. Thus, analysts can use evidential reasoning. In particular,
    they can use some form of evidential reasoning with probabilistic support.


    Evidential reasoning is structuring evidence in support of, or against, a defined
    hypothesis. In general, an evidential reasoning consists of four parts: hypotheses,
    evidence, relevance, and force. Hypotheses are conclusions in which the argument
    authors have argued. Hypotheses may be binary (e.g., true or false) or multiple
    (e.g., high, medium, or low). Hypotheses are mutually exclusive and exhaustive.
    For example, a set of hypotheses about raining could be [it rained today; it did
    not rain today]. Analysts collect data to make hypotheses more than just beliefs.
    Data becomes evidence if the analysts can show that the data are relevant to one
    of the hypotheses. Relevance is linking evidence (data) to an hypothesis using
    a chain of reasoning. Generalizations support this linking. Generalizations are
    relations commonly understood in the context of the argument. Last, force of evidence
    refers to the evidence that, to some degree, changes the individual''s belief
    in an assertion. A piece of evidence can be relevant but have little force.


    # 7.2.2 Multientity Bayesian Networks (MEBN)


    Any specific ELo argument consists of multiple entities, attributes, relations,
    and uncertainty. The argument authors can express these ELo elements as a Bayesian
    probability network (Jensen 2001). Given evidence findings, they can then assess
    the probability of a target variable given on the evidence.


    A particular Bayesian network is not, however, applicable to other situations.
    It is situation specific; that is, it is a specific agency technology initiative.
    The network pertains to the analysis of a set of entities with variables and attributes.
    Analysts can only find findings related to the specific problem. This is restrictive
    for ELo analysis, which begins with multiple types of entities, the number of
    which may be known beforehand (e.g., performance measures) and may have different
    relations. Defining a set of situation-specific Bayesian networks to analyze all
    of the ELo arguments of interest may not be possible.


    MEBN theory extends Bayesian networks by combining the expressive power of first-order
    logic with Bayesian probability theory (Laskey 2008). It represents a domain as
    a set of entities with attributes related to other entities. MEBN theory'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# Technology Uncertainties for Enterprise Transformation 153


    represents these relations as Bayesian network fragments, referred to as multentity
    fragments (MFags). An MFrag consists of the following:


    +   - Resident random variables represent the focus of the MFrag

    - Input random variables that are resident random variables from other MFags that
    influence the MFrag local probability distributions

    - Context nodes that are Boolean random variables representing conditions that
    must be satisfied

    - A local probability distribution representing the uncertainty within the MFrag
    relations

    - A fragment graph that expresses the conditional independence relations among
    the entities as a directed acyclic graph


    MEBN represents specific unique instances with a unique identifier of the random
    variables. Given instances of the input random variables, an MFrag produces conditional
    probabilities and can result in a simple Bayesian network.


    # 7.3 LSERA Method


    This section describes the LSERA method. These are two main parts of the LSERA
    method: the argument model and the inference model. The argument model consists
    of six fundamentals: entities, hypotheses, directed relations, evidence, cause
    and effect, and logic. The inference model consists of four fundamentals: MFags,
    probabilities, combination rule, and evidence force. Each of these fundamentals
    relates to one of the ten Elo modeling challenges, shown in Table 7.1. The left
    column of Table 7.1 contains the modeling challenges, and the right column shows
    the corresponding LSERA fundamental.


    In general, enterprise architecture frameworks contain the LSERA entities. A noted
    exception is evidence type and evidence instances. The frameworks do not contain
    hypotheses about the entities, although the frameworks can be extended to include
    hypotheses. The frameworks only have mappings between entities and not directed
    relations. They do not explicitly causality or logic, and they do not support
    inference expression. Last, the frameworks have no structures to incorporate probabilistic
    relations. Thus, it considers additional work to extract framework information
    and develop a situation-specific probability model.


