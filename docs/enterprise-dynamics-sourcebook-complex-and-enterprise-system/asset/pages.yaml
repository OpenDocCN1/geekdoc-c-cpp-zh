    # 8.3.1.1 Objective Function Related to Operational Benefit *


    We start with perhaps the nontrivial instantiation of Equations (8.1) and (8.2).
    In this instantiation, the state X is a scalar function of time s(t), the control
    U is a scalar function of time q(t), the matrix B is a constant (denoted as b)
    and A and Δ are both zero. Figure 8.1 is a timeline for the generic SE scenario
    corresponding to this model, in which s(t) measures progress made toward an operational
    capability in acquisition.


    # 8.3.1.1.1 The One-Third Rule†


    The state s(t) starts at the beginning of the acquisition (time zero) and is unconstrained
    in the positive direction. The control function q(t) is the positive square root
    of expenditure rate toward the acquisition. At time t_f the acquisition is assumed
    to be completed, at which time the acquisition expenditure rate goes to zero and
    the capability provided by the system is used in operations until a prespecific
    system lifetime t_L. Thus, transition to operations in the acquisition period
    in this model. The acquisition completion time t_f is taken to be a control variable.
    The control function L is q''(t) until t_f and afterwards. The operational benefit
    φ is just the integral of the final state s(t) from t_f to the system lifetime
    t_L, multiplied by a constant K, which corresponds to the dollar value of operational
    benefits over the period of the system in operations.‡ Then, Equations (8.1) and
    (8.2) simplify to:


    > *Wojcik, L.A. and K.C. Hoffman. 2007. ©2007 IEEE. IEEE/SMC International Conference
    on System of Systems Engineering (SoSE), April 16–18. With permission. Section
    8.3.1.1. is original to this chapter.

    †Wojcik, L.A. and K.C. Hoffman. 2007. ©2007 IEEE. IEEE/SMC International Conference
    on System of Systems Engineering (SoSE), April 16–18. With permission.

    ‡We note that it is generally more realistic to assume decreasing benefits over
    the system lifetime, compounded by increased maintenance costs. These effects
    are treated in a later section of this chapter.'
