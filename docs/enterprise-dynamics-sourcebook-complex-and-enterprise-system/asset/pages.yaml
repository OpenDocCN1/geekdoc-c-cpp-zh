  md: '# Enterprise Dynamics Sourcebook


    An enterprise engaged in a dynamic mission involving multiple internal and external
    stakeholders operates as a complex adaptive system with policy, organizational,
    economy, and technology dimensions. Management decisions and the actions of the
    multiple stakeholders, as well as foreseen and unforeseen events, influence an
    enterprise’s dynamic evolution. Systems engineering applied in this context spans
    the entire life cycle from research and development through the development and
    acquisition of new capabilities, transition to operations, operational use and
    maintenance, and finally to retirement and replacement. This evolutionary life
    cycle is extraordinarily complex as uncertainties dominate along with unanticipated
    and uncontrollable events that influence the life cycle and the dynamic evolution
    of the enterprise. Enterprise systems engineering and architecting (ESE/A) addresses
    the complexities of this endeavor.


    In this sourcebook, we describe and apply frameworks and analytical models of
    the enterprise to manage the understanding of its dynamic elements and their interactions.
    Dynamics is a very part of all engineering disciplines. Concepts of enterprise
    dynamics play a central role in this new discipline of ESE. The dynamic interacting
    elements of the enterprise can be broadly classified as the policies, organizations,
    economics, and technology factors in an operational process environment; we call
    these the POET conceptual elements. Specific enterprise transformation efforts
    involve all of these elements with a balance appropriate to the specific enterprise.
    Planning, implementing, and managing the transformed enterprise require multiple
    skills and methods. This sourcebook focuses on the multidisciplinary methods drawn
    from management science, economics, engineering, operations research, and the
    social sciences that comprise a discipline of ESE/A.


    # 1.2 Scope and Principles


    The foundational principles underlying ESE/A are:


    +   1. The modern enterprise engages in coordinated multiagency activities of
    public and private sector entities operating on a global scale with diverse activities,
    markets, and sources to provide products and services.

    2. Enterprise transformation is an ongoing process in sustainable organizations
    operating in an environment of constant and discontinuous change with associated
    risks as well as opportunities.

    3. The planning and management of transformation require multiple skills and disciplines
    across policy, organizational, economic, and technology dimensions that can be
    drawn together and applied using a systems approach based on systems engineering,
    enterprise engineering, enterprise architecture, and management science.'
