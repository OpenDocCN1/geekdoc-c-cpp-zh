  md: '# Energy and Materials Systems as an ESE Application


    are heavily influenced by regulatory policies that can have a major impact on
    material markets and competition among firms and nations. Such impacts must be
    analyzed and understood in policy formulation, program planning, and investment.


    Beyond these large and distributed scale of operations; the complexities of the
    materials and energy system include the challenges; multiagent roles and responsibilities;
    and associated governance challenges for planning investment; technical and system
    diversity of technologies, policies, and management methods; emergent behaviors;
    security concerns; and many uncertainties raised by ever-changing stores and markets.
    Milky et al. (2008) stated “stationarity is dead.” His statement refers to water
    management as usage increases to levels where availability is affected by all
    present vagaries of weather and competing demands, but applies in an even stronger
    way to the wide range of factors to be addressed by ESE. Many systems engineering
    efforts assume a level of “stationarity” to simplify the problem, an assumption
    that cannot generally made for ESE challenges. Stationarity assumptions are found
    particularly often in energy and materials sectors given the high capital intensity
    of the technologies and systems and the associated expectation of longevity of
    the invested technologies.


    An ESE perspective is required in this complex operate space, and multiple organizational
    levels, to characterize and analyze the impacts of decisions and technology choices
    that lead to sustainable economic and social development.


    The expansion in the scope of resources and industrial sectors involved in such
    a major transformation of the U.S economy requires an improved information base
    for planning and decisions by all stakeholders. The specific objective of this
    study is to illuminate and formulate a comprehensive information system—the reference
    materials information system—and demonstrate its potential use by multiple stakeholders
    to project and evaluate alternative policies, technical strategies and solutions,
    and socioeconomic-environmental impacts. These capabilities will support entities
    and programs engaged in the development, acquisition, and implementation of technologies
    and materials/energy processing systems.


    The comprehensive description of the system and its complexities emphasized in
    this application is an important foundation for planning and decision actions
    of the multiple stakeholders. Decision methods and theories described in other
    case studies can be drawn upon as necessary and fitting, considering their specific
    roles and responsibilities.


