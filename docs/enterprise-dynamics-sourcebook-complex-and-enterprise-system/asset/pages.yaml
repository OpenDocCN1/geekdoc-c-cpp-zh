  md: '# 11.2 Description of the Enterprise—nInternational Commerce


    The significant undertaking, the enterprise, in this case study is the management
    of international commerce activities and improvements in the effectiveness and
    security of trade to support the global economy. This international trade enterprise
    is composed of private-sector and public entities that manage and monitor trade
    including suppliers, transporters, and purchasers operating the supply chain in
    conformance with government policies and procedures at ports of entry.


    # 11.3 Statement of the Enterprise

    Transformation Challenge


    The transformation envisioned for this case study is the development and implementation
    of secure multinational trade technologies and systems that are utilized for commercial
    transactions and tracking by purchasers, sellers, and logistics managers (private
    sector) as well as government programs initiated for customs operations and security
    purposes.


    The individual firms and agencies engaged in international commerce make decisions
    and investments that drive the transformation to improved performance levels.
    Decisions and actions are sometimes coordinated through government initiatives,
    but are often taken independently for local reasons to add the complexity. The
    case study postulates a “notional” joint program operating in the public interest
    to monitor and analyze individual initiatives, integrate the results, and project
    the outcomes of the collective efforts to inform decisions and actions by all
    stakeholders. No such office exists although the potential benefits are significant.


    Management of the supply chain for production lines on the successful implementation
    of real-time information systems and sensors to track and locate commercial products,
    to record transactions at points of sales, export, and delivery. Information-sharing
    technologies must provide accurate and timely information on shipments and their
    provenance to comply with the advanced security and privacy provisions required
    by governments.


    An E perspective is required to characterize and analyze the integrated technologies
    and organizations that lead to excellence in planning, transforming, and operating
    the international trade system. Programs to modernize computing, communication,
    and information services are high-risk ventures with very low success rates. It
    has proven especially difficult to fully align these services with new business
    processes that are often deployed at the same time. The enterprise transformation
    that is required involves all elements of the enterprise: management, organizations,
    technology, and information. Further complicating modernization efforts are the'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# 252 Enterprise Dynamics Sourcebook


    rapid pace of technology advancement and the emergent behavior it facilitates
    inside and outside the enterprise. Increasingly, the performance required of enterprise
    information systems is fully known in retrospect. Hence, the enterprise architect
    needs to plan for uncertainty and build in agility. While organizations are ''growing
    and coping'' with these challenges, the increased demand for multiagency services
    is raising risks to an even higher level.


    The complexities of international trade as a system include the large and distributed
    scale of operations; migrant roles and responsibilities and associated governance
    challenges; emergent behaviors; security concerns; and major uncertainties raised
    by ever-changing sources and markets. Milly et al. (2008) states that ''stationarity
    is dead.'' His statement refers to water management as usage increases to levels
    where availability is affected by the always present vagaries of weather and competing
    demands, but applies in an even stronger way to the very wide range of factors
    to be addressed by ESE. Many systems engineering assume a level of ''stationarity''
    to simplify the problem, an assumption that cannot be made for ESE challenges
    such as the international trade system.


    # 11.4 Characterization of the International Commerce Enterprise


    The central features of international commerce are presented in a geographic perspective
    on the flow of goods in a supply chain from their source to destination point
    of sale. The geographic characterization draws on public data sources in the form
    of a geographic information system (GIS), Figure 11.1, which describes the major
    elements of a demonstration exercise and the activities involved in international
    commerce. The description is intentionally at a generic level so that it applies
    to any geographic region engaged in global commerce. The case study serves to
    develop and apply an ESE (or architect-engineering) approach to international
    commerce, a sector of major economic importance that poses security concerns.
    Specific activities and related information services define the following:


    +   - Cargo import and export processing (e.g., account maintenance, data mining,
    and inspection services)

    - Passenger security processing at departure and arrival (e.g., image processing,
    data mining, and decision support services)

    - Apprehension and identification of individuals (e.g., biometric, data mining,
    and communication services)

    - Financial flows in international commerce (e.g., workflow, data mining, and
    decision support services).'
