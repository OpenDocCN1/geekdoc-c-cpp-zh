    Taking the descriptive interpretation of the optimization, the model predicts
    that well-run, but complex SE efforts take approximately one-third of total system
    lifetime for acquisition including transition to operations, and two-thirds of
    total system lifetime for use in operations. This “one-third rule” provides a
    benchmark for comparison with real SE programs.


    # 8.3.1.1.2 Modeling “Internal Complexity**


    One seemingly arbitrary parameter in the base model is the square exponent in
    the cost term of $J$. If this exponent were unity (so that $q(t)$ is expenditure
    rate), the optimal solution would be “bang-bang”; that is, the optimum $t_i$ is
    0, and depending on the values of the parameters $K$ and $b$, the optimum $q(t)$
    is either zero or a delta function at zero time. We interpret the unit-exponent
    case as representing “zero internal complexity” in the acquisition, so that it
    is optimal to acquire as rapidly as possible. We distinguish here between “internal
    complexity,” which relates to the number and strength of interactions during the
    process of acquiring the system, and “external complexity,” which relates to external
    events to the acquisition or operations. External complexity is modeled later
    in this chapter). For example, acquisition of a large number of identical and
    easily made parts would fit into the category of very low complexity: the acquisition
    can proceed extremely rapidly relative to the lifetime of the parts in the system
    because the means to manufacture them can be duplicated.


    The case of a quadratic cost function discussed in the previous section represents
    larger “internal complexity” for the acquisition. It is natural to generalize
    Equations (8.4) and (8.5) to include a variable exponent $\alpha$ in the cost
    function:


    ```

    $s(t) = b \cdot q(t)$

    ```


    ```

    $J = K \cdot s(t_i) \cdot (t_i - t_j) - \int_{0}^{t_i} q^{\alpha}(t) \cdot dt$

