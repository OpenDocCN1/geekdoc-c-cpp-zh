    The unifying concept described in Chapter 4 is one view of that road ahead based

    on a timelier state-space description of the enterprise achievable through tighter

    coupling with management systems such as enterprise resource plan-

    nning. The definition of the core control-influence-uncontrolled (C-I-U) state-space

    odel at the enterprise operational scale, and the definition of dynamic sense-and-

    respond, provide unifying capabilities directed both at the higher scale

    of the economic sector in which the enterprise is embedded, and the lower organi-

    zationalational scales. Greater fidelity may be added to the core C-I-U model
    used for

    analysis as the source modules are fully developed to provide more detailed and

    complete state-space representations. Methods of tagging the state-space descriptors

