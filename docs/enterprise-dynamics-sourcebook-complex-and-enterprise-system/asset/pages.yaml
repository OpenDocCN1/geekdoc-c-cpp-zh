    a vehicle for changing the enterprise. It does not this so much by replicating
    the work done in other fields to understand key aspects of enterprises, but by
    harnessing them in a coordinated way: enterprise architecting "facilitate(s) the
    unification of methods of several disciplines used in the change process, as methods
    of industrial engineering, management science, control engineering, communication
    and information technology, i.e., to allow their combined use, as opposed to segregated
    application" (Generalised Enterprise Reference Architecture and Methodology (GERAM)
    i.6.3 1999). The documented EA can be used to foster a shared understanding of
    the enterprise''s structure, function, and behaviors by enterprise stakeholders
    and can as the blueprint for changing the enterprise. When properly executed,
    enterprise architecting is a holistic integrated approach to the design of enterprises
    based on principles of near-decomposability and the facilitated application of
    many previously independent disciplines.


    Despite its widespread application in industry and government, enterprise architecting
    has not emerged as a prominent field of academic study. The field has largely
    emerged from the practitioner literature rather than the academic literat, and
    as such, it traditionally has no strong ties to rigorous theory despite its success
    and utility in practice. It does, however, offer of the few approaches to integrating
    a vast array of knowledge about enterprises together with a holistic approach
    that is able to address the fundamental complexity of enterprises. Some deficiencies
    in recent architecting practice that can be resolved using the ESA/A approach
    include the static nature of the descriptions and the difficulty in representing
    uncertainties in a dense set of data describing important features of the enterprise.


