    # 5.7 Background on Systems Engineering and Architecting Guidelines


    This section provides some background on structured systems engineering processes
    for designing, building, and managing complex technical engineering systems for
    transformation. These processes have been applied successfully to a number of
    complex systems engineering challenges. The processes require an effective governance
    environment as outlined in the previous section. The approaches outlined below
    are the basis of the holistic ESE/A process described in Section 5.8.


    # 5.7.1 MITRE SEPO Regime


    The Systems Engineering Practice Office (SEPO) at MITRE formulated an approach
    (Kuras and White 2005)—a “regimen”—to apply to large programs. The regime is supplemented
    in practice with the POET to address the multiple dimensions of complex systems.
    The basic steps in the regime are:


    +   1. Analyze and shape the environment.

    2. Tailor developmental methods to specify regimes and scales.

    3. Identify or define targeted outcome spaces.

    4. Establish rewards (and penalties).

    5. Judge actual results and allocate rewards.

    6. Formulate and apply developmental stimulants.

    7. Characterize continuously.

    8. Formulate and enforce fitness regulations (policing).'
