    The scenarios have led to a deeper understanding of systems dependencies between
    closely coupled operations. New capabilities that accelerate the waste cleanup
    to the new operating state during the initial startup phase and continue smoothly
    transition to steady-state operations. For example, a new production unit introduces
    new interactions and systems dependencies with existing capabilities that may
    result in cascading effects during system upsets. The model has helped identify
    these circumstances and develop mitigation strategies.


    # 10.4 Conclusion


    The influence diagram in Figure 10.7 is an overall system representation in a
    single diagram. The level of aggregation masks some of the details; however the
    advantage lies in the ability to analyze the problem from a high-level systems
    perspective. By probing the relationships between key model variables, the diagram
    effectively conveys the complexities. The stepwise progression through the diagram
    hones the collective mental models into a more cohesive whole and leads to a deeper
    understanding.'
