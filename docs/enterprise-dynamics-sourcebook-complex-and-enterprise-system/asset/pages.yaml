    \ impacts can and should be performed as an\nimportant part of the business case.\n\
    \nSignificant effort must be devoted to characterizing potential emergent behav-\n\
    iors in a complex enterprise system of systems. Results of agent-based modeling\n\
    and other methods dealing with such behaviors can be incorporated in the optimal\n\
