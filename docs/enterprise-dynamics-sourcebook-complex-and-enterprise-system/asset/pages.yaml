    # 4.4.1.3 Strategic Level Modeling of the Enterprise Architecture


    A key tenant of the proposed approach to hybrid modeling of EA at a strategic
    level as opposed to tactical or operational levels. This has profound implications
    for the modeling approach: instead of a detailed model with high precision that
    allows for predictive capability in a specific context, this approach aims to
    deliver a model that, although lacking high precision, delivers insight about
    the system in a broader context in the face of uncertainty. Such approach to modeling
    addresses fundamentally different questions from those addressed by tactical models.
    A tactical model might answer the question of what the parameters are will allow
    achievement of optimum output, however, a strategic model will answer the question
    of what the design characteristics are that provide for good performance in the
    anticipated environment.


    Organizational design theorists, systems thinkers, and enterprise architects (Gallbraith
    1973; Senge 2000; Ross et al. 2006) have embraced a strategic focus in the study
    of enterprises, this has not been reflected in the work of enterprise models.
    Most models tend to focus narrowly (as such to support a single view in an EA),
    tactically (as in the study of supply chain efficiency), or both (Kalpic and Bern
    2002; Epstein 2003; Schieritz and Größer 2003). Researchers in the field of computational
    organizational design have created models (Rivkin and Sigglelow 2003; Sigglelow
    and Leinthal 2003; Ethiraj and Leinthal 2004). However, these models tend to be
    generative and too abstract to provide insight that most enterprise managers can
    understand and trust. There is a tremendous need for a strategy-focused modeling
    capability that will not only support the theories of organizational design theorists
    and systems theorists, but also support the needs of enterprise managers as they
    seek to guide the development and direction of their enterprise.


    # 4.4.1.4 Focus on Dynamics Resulting from Interactions Across the Architecture


    The proposed approach to simulation modeling of EA seeks to capture the complex
    dynamics of the enterprise by explicitly capturing the interactions across the
    contextual boundaries of the EA''s views in accordance with the concept of near-decomposability
    of complex systems. These interactions provide pathways for feedback in the system,
    within and across the views of the EA. Beginning with a set of initial conditions,
    such a simulation model will play out the response of the EA over time to an external
    environment.'
