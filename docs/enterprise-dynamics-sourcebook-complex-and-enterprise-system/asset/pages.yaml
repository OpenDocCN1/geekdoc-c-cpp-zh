    # ### 10.3.4 Policy Influences


    The cost estimate for cleaning up the radioactive tank wastes is between $88 billion
    and $117 billion over the next 40 to 50 years (DoE 2010). With a planning horizon
    this long, there will be opportunities to accelerate tank closures with investments
    in new technologies and strategic operating decisions. The Accelerated Closure
    Policy (DoE 2010) reflects this posture, making investments in new capabilities
    and increasing the surplus nuclear materials production rate to accelerate the
    closure date.


    A proactive proliferation policy would have a similar effect, the main difference
    being the introduction of more nonproliferation materials from outside the DoE
    complex. New investments and more campaigns may be required to treat nonproliferation
    materials. These policy influences are diagrammed in Figure 10.4.'
