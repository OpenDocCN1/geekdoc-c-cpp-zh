    # 4.3.8 Bayesian Networks


    Uncertainties regarding changes to the enterprise and its operational environment
    and transformation can be dealt with implicitly or explicitly in planning and
    management. In particular, given the uncertainty within the enterprise landscape,
    managers and analysts often use probabilistic methods to reason given the results
    of other analytical techniques. Formal methods for dealing with uncertainties
    that can inform or validate experience are needed and Bayesian networks provide
    a powerful approach. Estimates of uncertainty are often drawn from the experience
    of managers, analysts, and other experts. Bayesian networks address the need to
    deal explicitly with such uncertainties in enterprise transformation.


    Bayesian networks represent the probabilistic relations among variables that collectively
    form a joint probability distribution. The variable will have states that are
    mutually exclusive (must be in only one state) and collectively exhaustive (there
    are no other states), for example, [true or false], [male, female]. There are
    relations among the variables where the path (sequence of arcs) does not cycle
    back to the variable. Probabilities represent the influence strength of a variable''s
    state on another variable''s states. The existence or absence of arcs among variables
    represent dependence/independence. An independence condition for a Bayesian network
    is that every variable is independent of its descendendants given its parents.


    Modeling enterprise dynamics can also have significant degrees of uncertainty.
    Bayesian network theory can be used for managing and understanding uncertainties
    within the enterprise dynamics and encoding the knowledge structure of the enterprise
    dynamics for inference and examination.


