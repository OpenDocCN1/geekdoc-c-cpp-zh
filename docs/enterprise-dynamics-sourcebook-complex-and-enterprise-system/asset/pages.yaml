    # 4.3.6 Homeodynamic Risk–Opportunity Model


    The homeodynamic model uses fluids and biological analogues to simulate resistance
    to change in enterprise and response mechanisms. The method derives from biological
    systems (Yates 2002) and may be applied to enterprise operations where an external
    parameter λ applies the dynamic influence of the external environment on the enterprise
    (analogous to a shear “viscosity”). An internal parameter η represents the responsiveness
    of the enterprise to the boundary effect (analogous to a bulk “viscosity”). White
    (2006) describes application of the concept to a dynamic enterprise affected by
    risk while responding to opportunities.


    Specific questions that may be addressed with the homeodynamics model include:


    +   - What is the expected acquisition progress to be achieved given the rate
    of internal enterprise responses to changes in the external environment?

    - What are the natural risk–opportunity trade-off dynamics that arise in programs?


