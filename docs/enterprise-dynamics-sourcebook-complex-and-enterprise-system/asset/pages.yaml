    decommissioning), and the level of specification (general, partial, and specific).
    The level of specification is common to all frameworks, but is specifically highlighted
    by CIMOSA. The generic specification is the structure given by the reference architecture;
    the partial specification is a reusable description that can be adapted, and the
    specific is an architectural description to a particular enterprise.


    There is no “best” enterprise architecture framework that is suited to all enterprises
    in all environments and for all applications. Each framework has its strengths
    and weaknesses, and is biased toward certain applications. As a result, it is
    uncommon for enterprise architects to create “blended” frameworks that work best
