    units with a common understanding and preparedness for joint operations in mission
    performance.

    * Level 3—Collaborative: Recognized relationships are in place and shared goals
    are recognized, but the organizations are still distinct in performing mission
    activities.

    * Level 2—Cooperative (Ad Hoc): Limited organizational interaction on an ad hoc
    basis with liaison points established for situational awareness of the presence
    of other agencies.

    * Level 1—Independent: Separate organizational structures with little interaction
    and no information exchange or shared purpose.


