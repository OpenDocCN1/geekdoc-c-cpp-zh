    new business opportunities to fund in the coming months funds from their bid and
    indirect marketing budgets. Because synergy opportunities must be independently
    approved by OUs with different local incentives, synergy opportunities are not
    selected at a rate exceeding new “organic” opportunities.


    Figure 6.10 illustrates the mathematics of the opportunity approval process for
    both organic and synergy opportunities. On the left, an organic opportunity must
    only pass a single review. In the case of a synergy opportunity, it must pass
    two independent reviews. This has the effect of a Boolean AND gate. The resulting
    probability of the synergy opportunity funding is equal to the product of pass
    rates from each OU''s review, which can substantially lower the overall pass rate.


