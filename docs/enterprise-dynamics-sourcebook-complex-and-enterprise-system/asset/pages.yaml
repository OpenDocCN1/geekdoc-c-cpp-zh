    # 4.3.3 Highly Optimized Tolerance Model


    Highly optimized tolerance (HOT) (Wojcik 2004) is a framework for understanding
    aspects of complexity in design, engineered, and managed systems. Carlson and
    Doyle (1999) originally created the HOT concept and applied it to forest management,
    Internet traffic, and natural ecologies. For engineered systems, they showed how
    power laws relating to size emerge from minimization of expected cost in the face
    of design trade-offs and uncertainty. Since then, the HOT methodology has been
    applied to such systems as the electric power grid and Internet architecture.
    HOT typically is identified with power laws. The HOT model is applied in the case
    study in Chapter 8 to model the systems engineering process applied to a specific
    enterprise transformation program. Specific questions that may be addressed with
