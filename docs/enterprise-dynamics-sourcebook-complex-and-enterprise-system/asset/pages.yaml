    # 11.5 Strategies and Techniques Examined for the Transformation


    The transformation strategy is to develop and implement network-centric information
    management and communication technologies for the multinational trade system.
    The network concept encompasses the organizations that must interact in real-time,
    as well as the data management and communication technologies that provide situational
    awareness. The case study provides a proof-of-concept for the planning and management
    of the enterprise transformation program and commercial trade operations.


    Multiagency missions are extremely demanding from both the organizational and
    technical perspectives. They require the integrated efforts of executive managers,
    operations managers, and engineering managers. This is especially critical in
    the case of highly networked multiagency operations—the net-centric enterprise—in
    which both organizational and policy coordination and technical interoperability'
  merge: -1
  pgno: 277
