    spectives should be investigated further, for example, semantic technology.


    Improved methods to address uncertainties and to incorporate probabilistic

    factors in the framework are for decision support, coupled with visualization-

    gaming capabilities. The external environment is perhaps the most difficult in
    this regard. More effective environmental scans are essential and

    be coupled with more advanced game-theoretical and "what if" analytics.


    Several of the methods represented in the preceding chapters address dynamic

    interactions of the enterprise with its external, mostly uncontrolled, environment,

    for example, control-theoretic, game-theoretic, highly optimized tolerance, system

    dynamics, and agent-based methods. These are employed in source modules char-\acterizing
    specific functions of the enterprise. Future research will explore

    source modules describing competitive, adversarial, and deceptive behaviors as

    important dynamic elements.


    The models discussed in previous chapters can be applied to "play out" the

    asumptions that enterprise decision makers have about the future, and can thereby

    be used for qualitative "what if" analysis of different acquisition strategies
    and manag-\agement approaches. The models have been validated based on extensive

    diverse programmatic and operational management experience. It is expected that

    t models would need extensive calibration to be useful for quantitative predic-

    t specific enterprise systems engineering applications. Calibration, validation,

    and application may be accomplished for specific agency planning and program

    management use through an integrated gaming facility supported by a diverse set
    of

    descriptive, prescriptive, and predictive models with a core state-space representation.


    The analyses using multiple models described above indicate planning and

    management guidelines for the acquisition of new capabilities in an enter-\prise
    system of systems. The models highlight important aspects to be addressed

    in the business case prepared prior to the acquisition. These span the full life
    cycle

    of acquisition and operations with attention to the "one-third rule" (the optimum

    quisition time as one-third of total system lifetime) as well as other variable

    tors to ensure the targeted benefits of the transformation program. Significant'
