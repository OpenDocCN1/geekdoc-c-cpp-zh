    # 1.1 Introduction


    Government agencies and commercial entities are constantly evolving and transforming
    to respond to public demands, exploit opportunities, meet market challenges, and
    adapt to a changing world. The networking of global supply chains for physical
    goods and information systems for financial services and operations management
    is based on new system technologies and business models that drive a high level
    of performance and operational excellence. Planning, acquiring, and implementing
    these integrated systems in organized processes require the application of systems
    engineering methods at the enterprise level: enterprise systems engineering (ESE).'
