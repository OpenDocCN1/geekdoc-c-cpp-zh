- img_proc: true
  md: '# 212 Enterprise Dynamics Sourcebook


    to be a limiting case of the more general framework, with infinite incremental
    stages of development. Modeling of self-interested enterprise stakeholders in
    system development shows the familiar phenomena of the “tragedy of the commons”
    and multiple equilibrium. In the simple model presented the modeling produces
    a “hardness catastrophe” in incentives as a stakeholder’s internal difficulty
    is increased. And, simulation results point to a “sweet spot” in internal synchronization
    importance in terms of maximizing the robustness of the multistakeholder enterprise
    process. Finally, it is demonstrated that different types of enterprise–environment
    relationships, ranging from cooperatively adaptive to oppositional, can produce
    qualitatively different behaviors. In the simple model presented here, oppositional
    relationships can produce singular behavior with respect to a key parameter expressing
    the degree of oppositional motivation of the environment.


    The modeling presented is intended to inspire more investigation. With more research
    needed to link the models to real SE programs and real systems, apply the models
    to improve new and ongoing SE, and to demonstrate the practical utility of the
    models. On a broader level, perhaps the high-level optimal control and differential
    game modeling of the SE process presented could lead to deeper understanding of
    complex SE and human/technological systems in general.


