    # 13.3.1 Statement of the Healthcare Enterprise Transformation Challenge


    The transformation envisioned in comprehensive healthcare policies is to provide
    greater access to health services for all citizens with more effective outcomes
    and at a sustainable cost. The Affordable Care Act (ACA 2010) addresses virtually
    all elements of the healthcare enterprise and has generated considerable analysis
    and debate. Multiscale analysis provide insights into the complex interactions
    of the policy elements that have been and are yet to be defined.


    Earlier bills proposed in Congress desire other outcomes of transformation of
    the healthcare sectors. Using a highly focused preceding the major legislation
    of 2009u2010 as an example, the Health Technology to Enhance Quality Act of 2005
    (2005) outlines a series of transformation objectives building on the Electronic
    Health Record (EHR) and other information technologies.


    A report by the Engel Center at Brookings, "Bending the Curve" (Brookings 2009),
    presents ideas for controlling the cost of healthcare, mostly through information
    technologies. Others have proposed a broad range of technology and process changes
    well as major reorganization of the enterprise that challenges healthcare analytics
    and dictates the application of complex systems methods. Again, attention must
    also be directed toward emergent behaviors and technological change regarding
    new methods that can force the curve upward.


    The government, through direct services provided by the Veterans Administration
    and Military Health Services and direct financing payroll fees, account for nearly
    10% of the U.S. GDP. The transformation challenge in Medicare and Medicaid programs
    is a sustainable balance of costs and revenues, a critical topic in all policy
    discussions. Medicaid addresses the underserved population directly, with roughly
    half of the potential beneficiaries actually enrolled. The financial burden of
    this program on states, is leading to significant change in services and eligibility.


    Approaches to coverage for the uninsured population also include the IRS Health
    Coverage Tax Credit (HCTC) Program (IRS 2005) administered by the IRS that applies
    to individuals and families who are receiving benefits from the Pension Benefits
    Guarantee Corporation (PBGC) or who have lost their jobs and insurance'
