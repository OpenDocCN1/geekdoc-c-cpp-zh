    # 8.4.2.1 Hardness Catastrophe in Incentives


    The results show a consistent effort termed here “hardness catastrophe” and illustrated
    in Figure 8.8. Here, three stakeholders are modeled, and the optimum stakeholder-3
    with difficulty to the other stakeholders held constant. As internal difficulty
    increases, the optimum incentive to stakeholder 3 also increases, until a threshold
    is reached and the optimum incentive drops to zero. This happens because, as difficulty
    of the development effort increases, the enterprise spends more on incentives,
    until the point is reached and it is no longer worthwhile to provide incentive
    to stakeholder 3.


    This could be a dynamic effect in complex enterprise SE efforts, in which the
    difficulty of the SE effort is not apparent at the beginning of the program, but
    becomes more apparent. Wishing for ultimate success, the enterprise provides additional
    incentives to a contractor that finds more and more difficult, until the catastrophe
    threshold is reached, and the contractor is dropped from the program.


