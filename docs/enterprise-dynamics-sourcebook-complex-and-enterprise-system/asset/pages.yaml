    # 12.7.4 Materials and Energy System and Infrastructure Risks


    Risk is inherent in all materials systems and infrastructure programs is a major
    factor that must be addressed in the planning and implementation phases, as well
    as in subsequent operations. Haefele (1991) has published extensively on risks
    in the energy sector, as well as on the subject of energy systems analysis; there
    is much in'
  merge: -1
  pgno: 310
- img_proc: true
  md: 'common with the overall materials systems risks. The magnitude of risk is dependent
    on the technologies employed (stable, emerging, new) and on the stability of the
    materials systems and markets. The major risk categories are outlined below. Idealized
    conditions are used as examples to illustrate risk avoidance measures but are
    never realized fully in practice.


    Policy and business risk: Public policies generally reflect the public interest
    and preferences that balance economic development with environment, health, and
    safety concerns. Policies must also provide a clear and stable regulatory environment
    as a basis for investment. Private sector responsibilities in the industry—government
    partnership must be defined and understood by all parties for all materials system
    activities.


    Resource risk: Material resources must be adequate to support materials processing
    and infrastructure projects through their entire life cycle, and must satisfy
    all project demands on those resources. Financial resources for construction and
    operation must be available with stable long-term commitments. Trained human resources
    must be available, or a training plan must be implemented to ensure a trained
    labor supply.


    Project risk: Project objectives must be clearly defined and planning must be
    integrated to ensure staples of materials, energy, and labor to carry out the
    project. Design and operating requirements must be stable. The potential for schedule
    slippage exceeds every project. The resulting risk is much more than the simple
    sum of project schedule slippages as they are compounded by the cascading effect
    of interrelations and inter between related projects in other portions of the
    materials system. Contractors must have referenced experience in the projects
    to be undertaken.


    Technical risk: Proven processes and technologies must be employed to minimize
    technical risks. Component obsolescence and degradation can constrain system performance
    as technical components do not meet expectations or specifications. A maintenance
    and upgrade plan must be in place to ensure continued operation. The performance
