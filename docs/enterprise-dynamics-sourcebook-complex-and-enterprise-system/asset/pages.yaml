    thinking about and managing a highly interactive and iterative process efficiently
    and effectively while allowing for continuous organizational learning and adaptation.
    Although the theme of this chapter is the management of enterprise transformation,
    it is written from the perspective that transformation is an ongoing process that
    must be managed simultaneously with uninterrupted business operations.


    Therefore, in this chapter we start with earlier engineering processes that have
    evolved over the years from linear or sequential processes to waterfall processes,
    to concurrent engineering processes that have merged into a spiral process, as
    the very process itself has had to deal with steadily increasing system hardware
    and software complexity. This means the incorporation of a growing number of feedback
    loops to account for the steady growth in system complexity, and the adoption
    of an iterative dynamic approach to accomplishing the underlying design process.
    This evolutionary development in the systems engineering process is reflected
    in the progressive changes over time in the defense acquisition process, and consequently,
    in the design and development of complex new products. Both the systems engineering
    process and the product development process have also been influenced to a significant
    degree by the evolving processes employed in the design and development of software
    systems.


    These developments pose some important questions. What does it mean to engineer
    or architect complex enterprises, which represent a subset of complex sociotechnical
    systems that exhibit dynamic network characteristics, nonlinear interactions,
    emergence, and self-organization properties? How does one design and develop,
    simultaneously, complex engineered systems and the complex sociotechnical systems
    embodying them with the assurance that the engineered systems will be error-tolerant,
    particularly in the face of the orders of greater complexity arising from the
    interactions of the engineered systems with the multiple dimensions and behavioral
    factors characterizing the enterprise as a whole?


