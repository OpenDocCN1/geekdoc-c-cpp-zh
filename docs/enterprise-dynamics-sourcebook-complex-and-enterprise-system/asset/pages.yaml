    relates to what technology, process, services, and information; (d) usability
    of data for reasoning: (e) the causal relations; and (f) a logic underlying the
    reasoning. In addition, managers must account for uncertainty in the ELOs. The
    challenges are: (a) express uncertainty within the logic; (b) capture the manager''s
    subjective beliefs about relations; (c) combine uncertain influences, such as
    a subprocess and technology influence on a process; and (d) identify the influential
    understanding the ELO argument.


    A basic principle of LSERA is that enterprise transformation occurs when individuals
    understand the complex element interactions prescribe correct actions. No set
    of managers, however, can understand all these complex interactions. This presents
    two challenges. First, the enterprise needs a way for managers to construct localized
    models independently and at different times. Second, the enterprise formation
    managers need a way to integrate these localized models in a principled manner
    into an overall model allowing them to examine the overall influences of localized
    changes. As, as the transformation proceeds, managers maintain confidence in the
    assertions by discerning emerging information, adjusting the changing changed
    results. What looked promising yesterday may look less today. Emergent information,
    such as new ideas, technologies, and changes in the environment, may strengthen
    or weaken the ELO argument.


    # 7.1.2 Enterprise Architecture Approach


    Enterprises increasingly use enterprise architecture methods to support technology-based
    transformations and to support managers'' understanding of complex element interactions.
    Among the main frameworks used are The Open Group Architecture Framework (The
    Open Group Architecture Framework 2009) and the Zachman Framework (Zachman 2008).
    To understand the interactions in federal agency initiatives, the federal government
    has specified the Federal Enterprise Architecture Reference Models (FEA-RM 2007),
    the Federal Segment Architecture Method (Federal Segment Architecture Method 2008),
    and, specifically for the Department of Defense, the Department of Defense Architecture
    Framework (Department of Defense Architecture Framework 2009).


    These methods represent technology, process, and service entities and the relations
    among them, but they model ELO alignment as a set of relations. They inadequately
    specify the following: (a) a technology investment''s ELOs as an ordered structure
    of technology, process, service, and outcome entities; (b) the relations among
    the ''entities'' performance behaviors; (c) the relevance of information and modeling
    analyses to support inferences of performance behavior attainment; (d) the reasoning
    on the likelihood of the enterprise''s various performance targets and transformation;
    and (e) an approach for re-examining the'
  merge: -1
