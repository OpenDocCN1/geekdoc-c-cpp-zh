  md: '# Managing Enterprise Transformation Using SE/A ■ 91


    # 5.8 Holistic Enterprise System’s Engineering and Architecting Process


    The holistic SE/A process draws on the SEPO and CLIOS processes to provide an
    integrated approach for applying the discipline of complex SE/A in large-scale
    complex technology-enabled engineering-intensive sociotechnical systems. Both
    the SEPO and CLIOS processes call for description and characterization of the
    system or enterprise as a critical step that is emphasized here as an application
    of enterprise dynamics methods.


    The holistic SE/A process is generalized and must be tailored to address the unique
    characteristics of enterprise challenges. Ideally, both technical and business
    managers should participate in the process along with others and specialists.
    From a management perspective, the process should emphasize the concepts of enterprise
    architecting and enterprise dynamics presented in this coursebook.


    The process combines augments elements of the SE and structured processes described
    in Section 5.7 in six major steps. Supporting enterprise dynamics tools and methods
    are identified with specific steps in applying the SE/A process, with reference
    to landscapes and perspectives discussed in Chapter 4 and to modeling methods
    described in the Section II case studies.


    Although the SE/A process is described in a sequential fashion, in practice the
    steps are highly iterative and interactive to help technical and business managers
    converge on perspectives, beliefs, opportunities, plans, and outcome objectives.
    The process, as in the examples of other processes, is simplified and generalized
    for a range of applications. References are included to enterprise plans and materials,
    tools, and methods described in other chapters and references that can be selected
    and drawn upon for specific application cases. The six major steps, activities,
    and supporting analytic tools and methods are described in the following sections.


    # 5.8.1 Statement of the Complex Enterprise System Challenge and Complexities


    The challenge and complexities of enterprise transformation can be stated as follows.
    Define the scope and major elements of the enterprise and the operational or transformation
    objectives over which they are to be achieved through a major acquisition or change
    in the complex POET environment.


    +   - Identify the scope of operations of the enterprise, the geographic reach,
    the goods and services provided, and all stakeholders involved in a supply chain
    for production and delivery.'
