    # ### 3.4.5 Integration with Enterprise Systems Engineering and Simulation Models


    EA frameworks, even with the inclusion of the perspectives and guidance of organizational
    theory, do not provide a complete toolkit for architecting the enterprise. EA
    frameworks have the potential to provide a series of lenses, theories, and tools
    for reducing the apparent complexity of enterprises. A good framework decomposes
    the enterprise into manageable views that can be interpreted and understood independently
    and in relation to others. It does not, however, necessarily help managers understand
    how the EA will behave in different environments with different inputs, or if
    the architecture will an expected level of performance.


    An EA created using a framework is a static description of the essential components
    of the enterprise and their interconnections. By itself, this static description
    does not provide enough information to analyze and understand the behaviors that
    given EA is capable of producing. Enterprise managers need the analytical capabilities
    presented here—enterprise engineering including optimization and simulation modeling,
    and coupled with the framework for architecting—to help analyze, understand, and
    manage transformation activities. As noted above, analytical capabilities are
    essential to the development of a true process for enterprise architecting (Levitt
    2004). Without such capabilities, there can be little assurance that any changes
    to the architecture will have their desired effect or that any understanding of
    enterprise behavior is correct.


    Later chapters discuss these analytic tools by exploring the literature to identify
    appropriate simulation methodologies that can be brought to bear as illustrated
    in Section II. Using the decomposition of enterprise frameworks and organizational
    science as guides, the contribution of different simulation perspectives is,'
