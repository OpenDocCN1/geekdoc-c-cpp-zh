    Enterprise transformation involves the implementation of new technologies and
    business processes to improve performance of the mission and support activities
    of the enterprise. Transforming technologies include automation and sensor technologies
    applied directly to performance of the mission or delivery of a service and information
    technologies that provide the mission or service with better decision support,
    data, and communication systems.


    The states of the planning and investment processes for selecting and deploying
    advanced technology are mature for individual business entities, but the failure
    rates remain unacceptably high. Federal, state, and local governments and private
    sector enterprises are in EAS to better manage transformation programs. The architecture
    may be viewed as the genomic code of the enterprise and describes the mission,
    orientation, and business processes along with the supporting information systems
    and infrastructure.


    Activity-based costing (ABC) and ERP methods are commonly used to consolidate
    large-scale financial and accounting systems that track enterprise performance
    and the progress of transformation initiatives. ERP systems are used extensively
    today, however, they are not customarily coupled with the architectural view of
    the enterprise. In the governance environment described in this chapter, ERP systems
    can be used to capture any always-current state-space description of the enterprise.
    Collectively, these ABC and ERP methods and practices provide a foundation for
    agency-level planning and transformation must be extended, integrated, and adapted
    to the more complex multiquency environment. The discipline of enterprise dynamics
    provides a unifying theory for more effective application of these planning and
    management methods.


