  md: '# Energy and Materials Systems as an ESE Application


    # 12.7.2 Materials and Energy Analysis Topics


    The specific planning and analysis applications for a materials information system
    will depend on a number of factors, including political organization of the economy
    and the stage of development, as well as regional culture and customs. The overall
    objective of planning and analysis of the physical infrastructure and supporting
    materials system is to coordinate expansions and improvement projects across all
    activities in the system to identify and evaluate the capital and operating investment
    required to reduce or eliminate bottlenecks and disruptions throughout the entire
    supply, processing, and end-use chain. Investments must be tightly coupled with
    the scheduled project plans, and the policy environment should work to provide
    appropriate incentives to industry and engineering firms along the entire chain.


    The emphasis is on coordinated planning of infrastructure expansion projects.
    Similar objectives may be applied to the operational phase and the system concept
    provided by the IMIS may also be applied at that stage with the addition of appropriate
    logistics management methods. The specific policy priorities that are most pertinent
    to various types of economies are outlined below. Almost every issue listed can
    arise at any stage of development, but the priorities may vary.


    Mature market economy:


    +   - Land use standards and allocation

    - Maintenance requirements and investments for the infrastructure

    - Definition of critical materials and their form at the appropriate step in the
    processing chain

    - Environmental impacts, local and regional, as well as contribution to global
    concerns

    - Regional labor opportunities and training requirements

    - Research and development priorities


    Transition to market economy:


    +   - Provision and maintenance of essential infrastructure to support economic
    transition

    - Appropriate sectors for privatization and timing of the transition

    - Productive use of indigenous resources

    - Pricing of materials during the transition

    - Sustainability and resiliency of the materials system and infrastructure to
    economic and political shocks


    > Hoffman, K.C. 1995. An Integrated Materials Information System for Infrastructure
    Planning. © 1995 Kluwer Academic Publishers: Journal of Systems Integration, 5(2):
    91–105. Reprinted with kind permission from Springer Science+Business Media.'
