  md: 'Introduction ▃ xiii

    Enter working together for effective operational purposes (enterprise dynamics).
    Several methods are described for dealing with complexities, risks, and uncertainties
    to provide a robust adaptive approach to planning and implementing major national
    and international programs.


    # ## Chapter 1: Defining Enterprise and Transformation Challenges


    The enterprise definition that captures the transformation theme and the range
    of scales addressed is an entity engaged in a purposeful undertaking involving
    internal and external stakeholders, and operates as a complex adaptive system
    involving policy, organizational, economic, and technology dimensions. This definition
    clearly includes complex systems and megastystems and establishes a scope that
    encompasses a broader boundary that includes all stakeholders rather than just
    an individual organization. This broad definition can include specific agencies
    with a complex mission, multagency initiatives, or virtual organizations that
    come together for a specific purpose. The transformation challenges that are outlined
    establish the need for improved planning and management process that incorporates
    enterprise dynamics. Effective governance of the enterprise and transformation
    programs is critical to success and serves as a wrap-up to Section I. Decision
    support and resource management for such enterprises can be improved by systems
    engineering and archiving methods applied at the enterprise level: ESE/A.


    # ## Chapter 2: From Systems Engineering to Enterprise Systems Engineering


    An historical perspective illuminates the long-term evolution of the field of
    systems engineering in response to public and private sector challenges and leads
    up to a foundation for the enterprise systems engineering methodology as described
    in a following chapter. This evolution involves increasingly complex challenges
    and evolving tools and methods for planning and analysis. Historical examples
    reveal a tendency towards hubris in expecting more than the methods are capable
    of delivering, warning that the enterprise systems engineer must draw upon management
    and organizational theory and approaches to decision making under uncertainty,
    in addition to other analytical methods that serve to describe and analyze complex
    systems.


    # ## Chapter 3: Foundations of Enterprise Systems Engineering and Architecting


    The current state of evolution in enterprise systems engineering and enterprise
    architecting is reviewed in this chapter and is extended to portray an integrated
    approach to ESE/A drawing on concepts of enterprise dynamics. Managing'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'and enhancing the performance of public and private enterprise activities are
    the subject of architecting, modeling, and simulation applying the disciplines
    of management science, probability theory, organizational theory, systems engineering,
    and socioeconomics. Each discipline addresses specific dynamic elements of the
    enterprise from a unique perspective and contributes a robust foundation for ESE/A
    that addresses the complexity and dynamics of the interacting POET elements of
    the enterprise. This field has been fertile ground for research and applications
    over the past few years and is sufficiently mature to identify foundational concepts.


    # ## Chapter 4: Enterprise Dynamics Methods and Models


    This chapter summarizes a diverse set of enterprise dynamics methods and models
    that have been applied in the ESE/A applications summarized in this source. They
    constitute a representative sampling of the differing perspectives across disciplines
    applied to a range of enterprise dynamics (or perhaps a subdiscipline in the larger
    ESE/A context). Emphasis is placed on characterizing the complexities of enterprise
    transformation to guide the selection and creative application of appropriate
    tools and methods. The presentation flows from specific methodologies (source
    modules) to analyze dynamic effects, through the unifying time-dependent state-space
    descriptors of the enterprise, to the concept of an enterprise model that reflects
    the factors critical to transformation and the reality that some of these factors
    can be controlled, can be influenced, and are uncontrollable (the controlled,
    influenced, and uncontrolled [C-I-U] formulation). Multidisciplinary methods are
    particularly relevant to address the desired scope of policy, organizational,
    economic, and technical factors that must be coordinated in successful transformations
    of enterprise operations.


    # ## Chapter 5: Managing Enterprise Transformation Using ESE/A


    This chapter describes how enterprise dynamics methods and the enterprise systems
    engineering and architecture (ESE/A) guidelines provide value by relating the
    modeling and simulation methods to state-of-the-art management tools such as EA,
    activity-based management (ABM), and enterprise resource planning (ERP) systems.
    This architecture-based approach for governance of enterprisewide operations and
    transformations encompasses the POET elements and facilitates the engagement of
    technical, financial, and business managers in the operational and transformation
    processes. Architecture templates are described to couple dynamic analytical methods
    with ABM techniques to coordinate planning and management across the multiple
    agencies and stakeholders involved in complex undertakings. In this governance
    environment, enterprise resource management (ERM) accounting systems can be used
    to capture an always-current “state-space” description of'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'financial and tangible resources of the enterprise. The approach is described
    using transformation examples that involve the coordination of multiple agencies
    (or firms). The multiagency environment is an increasingly important challenge
    for the enterprise, public or private, that operates in complex national and global
    markets with extended supply chains or reach.


    The management approach is supported by ESE/A guidelines that can be tailored
    to specific enterprise transformation challenges. The diverse tools and methods
    described earlier must be selected and applied in a way that is appropriate to
    the scale and complexity of the ESE/A challenge. An enabling process described
    here provides the necessary guidelines, and is based on experience with transformation
    programs, examples of which are described in the Section II case applications.
    The process is flexible and adaptive in addressing the challenges and uncertainties
    in managing the transformation of complex enterprises in their unique forms.


    # Section II: Enterprise Modeling Approaches

    and Applications


    In Section II, we present a series of ESE/A case studies based on published papers
    and technical reports on modeling the complex dynamics in specific enterprises
    to address critical issues in the acquisition of new operating capabilities. The
    case studies represent enterprise transformation challenges at a scale where the
    government role is paramount but with significant private sector and public involvement.
    The case studies employ a variety of modeling and analytical methods as appropriate
    to the specific enterprise transformation challenge they are addressing. Examining
    this variety in the context of the ESE/A process provides valuable and practical
    guidance for management and problem solving.


    The case study applications are organized in relation to the defined scale of
    the enterprises starting with single agencies and corporations, and progressing
    through complex mission operations to multiple agencies and complex challenges
    of national scale with significant impacts on the economy. They are summarized
    in the following chapter descriptions.


    # Chapter 6: Simulation of Enterprise Architecture

    for a Business Strategy


    This chapter applies the coupling of enterprise architecting and enterprise dynamics
    to strategic planning at the corporate level. The results of alternative discretionary
    funds in business development and R&D are analyzed. This case study represents
    a major step forward in the foundational discipline that supports ESE/A through
    the concept of dynamic architecting. The application described implements'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# xvi Introduction


    a dynamic model and simulation with the comprehensive structure of an EA as defined
    by federal and commercial EA guidelines. This approach overcomes a major deficiency
    in the static nature of most architectures by joining this widely practiced enterprise
    planning and management method with enterprise dynamics.


    # Chapter 7: Reasoning on Technology Uncertainties for Enterprise Performance
    Transformation


    This chapter describes a method for reasoning about the likelihood of attaining
    a specified desired performance resulting from emerging dynamics and uncertainties
    within an enterprise or its environment. A basic principle is that mission performance
    occurs by individuals understanding the dynamic interactions of people, process,
    and technologies. Individuals reason about dynamic interactions producing insights
    on performance attainment given the interactions. Individuals increase their understanding
    and their subsequent decisions and actions are changed because of their improved
    understanding.


    The method uses evident reasoning and multentity Bayesian networks (MEBN) to compose
    arguments about the relationship of technology initiatives to strategic outcome
    attainment. A federal program example illustrates the method.


    # Chapter 8: Optimal Control and Differential Game Modeling of a Systems Engineering
    Process for Transformation


    This case study describes a unifying analytical framework for modeling enterprise
    dynamics across a range of enterprise and program types, and is demonstrated on
    a specific transformation program. The framework is a control-theoretic formulation
    that uses state and control parameters relating to the enterprise, stakeholders,
    and the environment with which the enterprise interacts. The framework expresses
    the individual self-interests of stakeholders and players as a differential (dynamic)
    game, which is explored and interpreted in terms of game-theoretic Nash equilibrium
    solutions (Nash 1950). It provides a mathematical basis for relating or integrating
    the diverse ESE modeling methods employed in the application examples that follow.


    # Chapter 9: Hybrid Systems Dynamic, Petri Net, and Agent-Based Modeling of the
    Air and Space Operations Center


    This chapter describes an innovative enterprise systems engineering effort to
    model the policy, organizational, and technical aspects of a mission-critical
    national defense operation. The application uses hybrid systems dynamics, Petri
    net, and agent-based multiscale modeling to understand the effect of operator–environment
    interaction and the global environment on Air and Space Operations Center (AOC)'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'processes. The AOC process model (e.g., critical event process time and probability
    of errors) is linked to a global environment model that is driven by the political
    landscape in which the AOC operates.


    # Chapter 10: Nuclear Waste Management Strategic Framework for a Large-Scale Government
    Program


    This case study presents an enterprisewide framework using the hybrid approach
    of a process-based materials flow model coupled with a systems dynamics influence
    diagram, or causal loop diagram. The objective of the work is to provide system-level
    insight into the U.S. Department of Energy’s (DoE) responsibility for environmental
    cleanup of nuclear waste. The focus is on the Savannah River site and all activities
    carried out in this enterprise from the receipt of nuclear materials through their
    shipment to the materials suitable for long-term storage. The framework is used
    for exploring policy options, analyzing plans, addressing management challenges,
    and developing mitigation strategies for the DoE Office of Environmental Management
    (EM). The sociotechnical complexity of EM compels the use of a qualitative approach
    to complete discrete event modeling. We use this analysis to develop scenarios
    for the model, pinpoint pressure and leverage points and develop a shared conceptual
    understanding of the problem space among stakeholders. This approach affords the
    opportunity to discuss dynamic phenomena in enterprise operations over a 25-year
    time horizon using a unified conceptual perspective, and is also general enough
    that it applies to a broad range of capital investment/production operations.


    # Chapter 11: International Trade and Commerce: Enterprise Systems Engineering
    and Architecting in a Multiagency Environment


    The objective of this case study is to formulate and demonstrate a comprehensive
    planning framework for ESE/A in a complex international enterprise that is essential
    to the global economy. The framework, an integrated systems engineering workbench,
    is designed for multinational and multiagency enterprises, public and private,
    engaged in international commerce.


    # Chapter 12: Energy and Materials Systems as an Enterprise Systems Engineering
    Application: Planning and Analysis for the Economy’s Infrastructure


    This case study provides an example of a large-scale challenge to the private
    sector and government, crossing major materials and energy-related sectors of
    a nation’s'
