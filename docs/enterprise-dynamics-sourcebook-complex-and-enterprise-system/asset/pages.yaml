  md: '# 2.1 Introduction—Looking Back and Looking Forward


    Looking backward, systems and the enterprises they supported were viewed as relatively
    independent entities and were treated that way. First, industrial engineers and
    systems engineers have been quite successful in dealing with them well-bounded
    systems with repetitive and predictable operational characteristics. These system
    characteristics are changing in significant and fundamental ways. Commercial enterprises
    addressing important markets and government enterprises addressing critical national
    problems increasingly operate in a collaborative networked environment, networked
