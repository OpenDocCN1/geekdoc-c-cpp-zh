    # 7.1 Introduction


    Enterprises comprise a multifaceted mixture of elements comprising strategic outcomes,
    business processes, technology, and individuals. Strategic outcomes are the enterprise''s
    planned accomplishments and represent what the enterprise values. Business processes
    consist of structures, data, and communication among company sites, roles, and
    divisions. Technology employs the various systems that enable business processes.
    Individuals manage the complex interactions among these elements to produce outputs
    and attain a strategic outcome.


    Enterprise transformation moves the enterprise from a given state to a new state
    in response to opportunities, perceived weaknesses, and changes in its domain
    (Knotour 2011; Rouse 2005). It involves structuring the complex interaction under
    an organizational change management model, such as the Burke–Litwin model (Burke
    and Litwin 1992), which identifies specific components in organizational change.
    Today, most large enterprise transformations require significant investments in
    new enterprise technology to accomplish the transformation (Merrifield, Calhoun,
    and Stevens 2008; Venkatraman 1994). This is especially true in the federal government
    (Government Accountability Office 2010).


    This chapter does not cover broad interactions of elements to ensure successful
    transformation. It focuses on an alignment reasoning method usable by managers
    involved in a technology-based enterprise transformation. To support a reasoned
    understanding of alignment, this chapter defines a technology initiative''s line
    of sight (ELoS) as an inferential alignment of a technology initiative to business
    processes, business services, and strategic outcomes and supporting a perceived
    assertion of attainment of the strategic outcome. This is shown in Figure 7.1.


    The line of sight reasoning analysis (LSERA) method specifically focuses on a
    technology initiative''s ELoS that supports an enterprise transformation to attain
    some strategic outcomes. The LSERA method has two main uses:'
  merge: -1
  pgno: 171
