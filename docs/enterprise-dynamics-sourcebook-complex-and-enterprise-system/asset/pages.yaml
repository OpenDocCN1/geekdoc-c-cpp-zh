  md: '# Introduction


    The concepts discussed in this sourcebook are applicable to both government and
    large private sector enterprises that involve significant service or regulatory
    interactions with government entities and must transform to operate effectively
    in this complex ever-changing environment.


    Dynamic phenomena are a very important part of all organizational theories and
    engineering disciplines and are a central theme of the analytic case studies in
    this sourcebook. In these enterprise case studies, we describe and apply frameworks
    and analytical models to improve the understanding of dynamic elements and interactions.
    Specific enterprise transformation efforts must improve all of the POET elements
    over the full life cycle of transformation with a balance appropriate to the specific
    enterprise. Planning, implementing, and managing the transformed enterprise require
    multiple skills and methods. As dynamic analyses in engineering and the social
    sciences draw a wide variety of methods applicable to specific challenges, the
    applications here were selected to introduce a wide range of methods that have
    demonstrated their utility for the analysis of enterprise dynamics.


    The sourcebook is directed towards analysts, managers, and decision makers engaged
    in significant transformation of their enterprises to operate at high levels in
    the delivery of products and services. The concepts in the public and private
    sectors and address the inherent technical, social, economic, and management complexities
    of enterprise operations and transformation in a global economy. It is written
    with the belief that qualitative and quantitative analytical methods drawn from
    systems engineering and management science inform the managers of enterprise transformation
    programs and reduce their risks and unacceptably high failure rates.


    # Working Definition of an Enterprise


    An enterprise is a purposeful social, technical, and economic undertaking designed
    to create value for its stakeholders involving:


    +   - Policies, organizations (people), economics, and technology interacting
    with each other and their environment in operational processes as a complex system-of-systems
    to achieve goals

    - An organization (single or multiagent, and possibly virtual) created for the
    undertaking

    - A readiness to embark on bold new ventures


    The dynamics of an enterprise are highly dependent on the mission or business
    characteristics (the enterprise landscape) and the perspective of the enterprise
    required to address management issues and inform decision making (operational,
    scalar, and temporal perspectives).'
