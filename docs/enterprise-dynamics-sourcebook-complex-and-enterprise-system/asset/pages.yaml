    # 6.4 Recommendations from the Use of the TechSys Simulation Model


    Based on this analysis, TechSys was to identify key vulnerabilities in its organization
    and process design, as well as identify R&D expenditures as an area of concern.
    By addressing these issues, TechSys will remove barriers to successful execution
    on its strategies.


    # 6.4.1 Benefits of a Hybrid Approach to Enterprise Simulation Modeling


    Hybrid enterprise architecture simulation is a new approach to understanding enterprise
    dynamics, and the TechSys simulation model is the first of its kind to employ
    a hybrid simulation approach to analyze enterprise architecture from the multiple
    perspectives offered by enterprise architecture frameworks. The previous sections
    have shown how this approach has been successfully applied to address the pressing
    concerns of TechSys, however, it must also be noted that some of the problems
    observed at TechSys, such as synergy investment behavior, could only be addressed'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'through a multisperspective approach. Hybrid simulation modeling is a useful
    tool in a modeler''s toolbox, but for some classes of problems, it is the only
    tool.


    There were two key dynamics at play in the TechSys simulation model: discretionary
    budget allocation and synergy investment. The first issue, discretionary budget
    allocation, can be easily captured and modeled using dynamics (assuming that data
    could be gathered that capture aggregate characteristics of the processes). The
    causal loop diagram in Figure 6.13 can be expanded into a full-system dynamics
    model by quantifying the system in terms of stocks, rates, and variables, and
    the extra effort of interfacing models would not be required. The issue of synergy
    investment, however, could not be so simply captured by any modeling approach.


    The dynamics of the synergy investment problem were much more complex than the
    discretionary budget problem. The problem lies at the intersection of two major
    views of the enterprise: process and organization. One component of the dynamics
    of synergy investment could be explained using a discrete event process model,
    similar to the one in the process submodel of the hybrid simulation model. This
    doesn''t tell the whole story, however. The behaviors are also driven by the incentives
    of all the operating units making rational decisions that end producing subsystem-level
    outcomes. These dynamics were captured using the agent-based submodel in the hybrid
    simulation, which treated each OU as an agent with its own decision logic guiding
    behavior. The contributions of the process submodel as well as the organizational
    submodel, the full extent of the bias against synergy opportunities in TechSys''s
    current architecture would not be known.


    Due to the flexibility and scope of the TechSys simulation model, both of the
    major parameters driving enterprise behavior could be varied simultaneously, providing
    the ability to capture the performance landscapes in Figures 6.14 and 6.17. This
    would not have been possible without a hybrid simulation with an enterprise-level
    perspective.


    One should not infer that hybrid modeling is the only approach that could be used
    to model the dynamics of enterprise architectures, but it does suggest that there
    is a class of problems that span the boundaries of context views that be fully
    addressed with this approach. Problems that can be described within the context
    of a single view can be modeled with a single simulation approach. Those that
    span views by very different behavioral dynamics (e.g., top-down versus-bottom)
    may require a hybrid modeling approach to be applied. Without the aid of an enterprise
    framework to help with boundary setting and scoping, this class of problems has
    proven to be very difficult to detect and understand, as a mental exercise and
    from a simulation perspective. The application of enterprise architecture frameworks
    and hybrid simulation techniques to this class of problems provides an analytical
    approach that helps to manage the complexity of the dynamics and get to the causal
    structures and variables that drive enterprise behavior.'
