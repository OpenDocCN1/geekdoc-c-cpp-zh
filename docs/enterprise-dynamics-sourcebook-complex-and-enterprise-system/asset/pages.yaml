    # 6.3.4 Creating an Alternative Architecture


    Working with TechSys stakeholders, an alternative enterprise architecture to the
    current state was developed to address the noted deficiencies of the current state
    architecture in the extremely limited sense pertaining to the allocation of available
    budgetary resources for capturing new business growth. The first changes to the
    architecture addresses the biases in system against synergy. In the alternative
    architecture, synergy opportunities are not selected locally by the OUs, but rather
    by a team at the division level select opportunities based on what has the most
    benefit for the division as a whole. The money for financing the new synergies
    will come by allocating a percentage of each OU’s bid and proposal budget back
    to the division for synergy opportunities. The amount of this “synergy tax” on
    the OUs is the percentage of opportunities that have a synergy component (the
    same value as the model input parameter) multiplied by the OU’s bid and proposal
    budget. The division chooses how money will be spent, the OUs will still develop
    the ideas, and receive the benefits from winning resulting contracts.


    The second change to the current state architecture is to select IRAD projects
    in a more strategically aligned fashion. This change reflects changes that were
    under way at TechSys at the time simulation was completed. In the alternative
    architecture, IRADs are chosen on their expected contribution to key technology
    areas that are aligned with a strategic technology roadmap. Although these roadmaps
    had been in use for years, they had not been used as part of the IRAD selection
    process.


    The alternative architecture resolves the process bias, eliminating the independent
    approval needed for synergy opportunities and not for organic opportunities, and
    also resolves the local OU incentives against choosing synergy opportunities.


    The alternative architecture serves primarily as a “proof of concept” architecture,
    rather than as the blueprint for a future architecture that is under consideration.
