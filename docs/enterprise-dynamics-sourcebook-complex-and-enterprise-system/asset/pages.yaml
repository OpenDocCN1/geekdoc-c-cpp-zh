    the evolution of a transformation or acquisition program based on requirements
    stability, technology maturity, and program complexity. This model captures feedback
    and feedforward effects that influence progress and cost. Specific questions that
    may be addressed with the models:


    +   * What are the requirements of transformation or acquisition to support enterprise
    operations objectives?

    * What are the influences of new technologies and the changing environment on
    requirements, transformation strategies, and capabilities?

