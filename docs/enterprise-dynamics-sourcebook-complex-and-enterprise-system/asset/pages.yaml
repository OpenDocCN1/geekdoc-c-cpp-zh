  md: '# # Epilogue: Enterprise Systems Engineering and Architecting—Lessons Learned
    and the Road Ahead


    Kenneth C. Hoffman, William J. Bunting, Anne Cady, Christopher G. Glazner, and
    Leonard A. Wojcik


    Understanding the dynamic behaviors of the enterprise is essential to planning
    and managing the acquisition and implementation of transformational systems and
    technologies to improve mission and business performance. The framework and methods
    in Section I describe the scope and content of this emerging discipline of enterprise
    dynamics and the significant role it plays in advancing systems to the enterprise
    level (enterprise system engineering and architecting, ESE/A). Emphasis is placed
    on overcoming past deficiencies in static and deterministic methods to enable
    the agile enterprise. This is accomplished in the ESE/A process as outlined in
    Section I and applied to case studies in Section II. evolving at a rapid rate.
    The process deals effectively with the policy, organization, economic, and technology
    elements of the enterprise as demonstrated in the case studies. Perhaps the most
    difficult challenge is the organizational aspect, as this element tends to be
    more static than the ever-changing policy, economic, and technology dimensions.
    Further


