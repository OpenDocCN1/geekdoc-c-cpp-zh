  md: '# 8 Enterprise Dynamics Sourcebook


    engineering disciplines: mechanical, chemical, civil, electrical, and nuclear.
    The success of applications in these predominantly technical areas created an
    appetite for the application of systems engineering to social challenges involving
    institutions, enterprises, and the public. This expanded scope into "social engineering"
    was not nearly as successful and offers significant lessons. The lesson applied
    in this sourcebook to the multidisciplinary field of enterprise systems is to
    return to basic engineering principles, but in a broader multidisciplinary context
    that builds on the applicable sciences, physical and social theory. Enterprise
    systems are addressed in management science, organizational theory, process engineering,
    economics, operations research, and other disciplines. The systems engineering
    approach provides a proven method of integrating the multiple perspectives and
    insights from these disciplines and applying them to the challenges faced in transforming
    and modernizing public and private enterprises to address markets and public interests.
    This sourcebook describes a state-of-the-art approach to ESE/A in two parts:


    +   I. Foundational and Conceptual Frameworks

    II. Enterprise Modeling Approaches and Applications


    ESE/A process guidelines are formulated with sufficient generality to apply to
    a wide range of enterprise challenges, government and commerce. The process guidelines
    address many types of programs involving dynamic interactions among multiple stakeholders
    in the enterprise around policies, organization, economics, and technology.


    # 1.3 Conceptual Frameworks


    A conceptual framework uses landscapes and architectures to characterize the specific
    nature of an enterprise. Landscapes characterize the form and objectives of the
    enterprise—in terms of efficiency, flexibility, and adaptability—well as the nature
    of the operational processes to deliver repetitive services, specialized services,
    or adversarial actions. Enterprise architectures (EA) capture the key activities
    in the enterprise, the supporting services (logistic and informational), and the
    network applications and computing resources needed.


    These artifacts help define the scope and structure of the enterprise to be addressed
    as a complex system. Systems theory requires a precise definition and description
    of system boundaries and relationships within across the boundaries, ever-drawn.


    No characterization of an enterprise is complete without an explicit representation
    of the decision processes that guide its transformation. An enterprise has a set
    of internal and external factors that are under its direct control, factors that
    it can influence, and factors that are uncontrolled, both internal and the external
    environment within which the enterprise operates.'
