- img_proc: true
  md: "variables.\n\nNow let's create one of the most important functions for our\
    \ EA. They are the functions of sending orders.\n\nWe need to send orders to buy\
    \ or sell every time a trigger is started. In MQL we can do this type of sending\
    \ in different ways. We can use a specific class called CTrade to work with the\
    \ handling and sending of orders. However, here we choose to use the requisite\
    \ assembly structures (MqlTradeRequest) and send response (MqlTradeResult).\n\n\
    MqlTradeRequest is used to perform all trade requests for a trade operation. It\
    \ contains all the fields necessary for performing a trade deal.\n\n```\nstruct\
    \ MqlTradeRequest {\n  ENUM_TRADE_REQUEST_ACTIONS action; // Trade operation type\n\
    \  long magic;         // Expert ID (magic number)\n  long order;         // Order\
    \ ticket\n  string symbol;      // Trade symbol\n  double volume;      // Requested\
    \ volume for the deal in lots\n  double price;       // Price\n  double stoploss;\
    \    // Stop loss of the order\n  double takprofit; // Take profit\n  int deviation;\
    \     // Price deviation from the requested price\n  ENUM_ORDER_TYPE_FILLING type;\
    \ // Order type\n  ENUM_ORDER_TYPE_TIME filling; // Order execution type\n  long\
    \ time;          // Order execution time (for the orders ORDER_TIME_SPECIFIED\
    \ type)\n  string comment;     // Order comment\n};\n```\n\nMqlTradeResult is\
    \ used for any trade operation. The variable declared to this will be able to\
    \ access the trade request results.\n\n```\nstruct MqlTradeResult {\n  uint code;\
    \           // Operation return code\n  long deal;           // Deal ticket, if\
    \ it is performed\n  long order;          // Order ticket, if it is placed\n \
    \ double deal;        // Deal price, confirmed by broker\n  double price;    \
    \   // Current price\n  double asr;         // Current ask price\n  string comment;\
    \     // Comment to operation (by default it is filled by the operation description)\n\
    };\n```\n\nFrom these structures we can delimit the type of order that we are\
    \ interested in, specifying details of it. The request and response variables\
    \ may be used in an order send function called OrderSend().\n\nBelow is a function\
    \ created to send an order to buy with market with type of fill FOK (fill or kill\
    \ fills the size of the order or does not execute). This order, executed to market,\
    \ already has stop and target of gains (take profit) defined."
  merge: -1
  pgno: 127
- img_proc: true
  md: "In every market there are offers from the best buyers and best sellers. Therefore,\
    \ we need to access the book of offers to know these prices. As we have seen,\
    \ in Chapter 5, we can access book information from the MqlTick structure. So\
    \ we created a variable 'tick' to store this information. With it we can access\
    \ the best seller 'tick.bid' and the best buyer 'tick.ask'.\n\nWe have the bid\
    \ = (sell, offer) and ask = (buy, demand).\n\n```\n// BUY TO MARKET\n123 bool\
    \ Buy&Market(){\n124 \n125   MqlTradeRequest request;      // request;\n126  \
    \ MqlTradeResult response;     // response;\n127 \n128   ZeroMemory(request);\n\
    129   ZeroMemory(response);\n130 \n131   request.action       = TRADE_ACTION_DEAL;\
    \ // Trade operation\n132   request.magic        = 123456; // Magic number\n133\
    \   request.volume       = 1.0; // Lot number\n134   request.price        = NormalizeDouble(tick.ask,\
    \ Digits); // Price to buy\n135   request.sl           = NormalizeDouble(tick.ask\
    \ - Point, Digits); // Stop Loss\n136   request.tp           = 0; // Take Profit\n\
    137   request.deviation    = 100; // Maximum possible deviation\n138   request.type\
    \        = ORDER_TYPE_BUY; // Order type\n139   request.filling     = ORDER_FILLING_IOC;\
    \ // Order execution type\n140 }\n141 //\n142 if(OrderSend(request, response)\
    \ == 10000)\n143 {\n144   Print(\"Order Buy executed successfully!\");\n145 }\n\
    146 else\n147 {\n148   Print(\"Error sending Order to Buy. Error = %d\n\", GetLastError());\n\
    149   ResetLastError();\n150 }\n```\n\nThe type of action to be chosen is the\
    \ first request that we assign:\n\n![](img/6d863e70ea1a0ecdc703a17721d7e78b_128_0.png)\n\
    \nWe have several types of orders. We can choose from the structure type:"
