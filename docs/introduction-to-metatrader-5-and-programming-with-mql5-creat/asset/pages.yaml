  md: '# ## .9. Adding Indicators


    The indicators, for many traders, are the main guiding factors for decision making.
    These are the indicators that often alert us to enter and exit an operation in
    timely situations. When you talk about indicators, MetaTrader does not leave you
    wanting.


    Currently, the platform has more than 2,000 indicators available for free download.
    This download can be done either by the site itself or by the platform in the
    Toolbox on the Code Base tab.


    Let''s, for example, add moving averages to the chart. We can do this either through
    the menu Insert -> Indicators or directly clicking in the field Navigator -> indicators,
    click and hold the chosen indicator and drag to the graphic window.


    As an example, let''s insert a Moving Average indicator:


