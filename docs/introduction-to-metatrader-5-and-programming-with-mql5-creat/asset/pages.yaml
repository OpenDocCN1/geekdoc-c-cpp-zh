  md: '# ## ..2. Main elements of the MetaTrader 5


    One of our main interests is to visualize asset prices from candles (candlesticks).
    So, let''s get to know the main visualization features of the MetaTrader 5 platform.


    In the **Menu: View -> Symbols**, we have the option to choose the financial assets
    that we wish to work.


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_23_0.png)


    We can choose between Bovespa and BMF Assets (continuous series). In the assets
    of Bovespa we have the OPTIONS (calls and puts), the shares in A VISTA and the
    INDICES (futures market) traded in the Brazilian market.


    It is important to note that each brokerage will provide distinct data routing.
    With more data and some with less. For example, if we were with some brokerage
    that works with the Forex market, the options that would appear in this window
    of Assets would be completely different.


    The addition of a symbol that represents a company, which is being consulted in
    the prices, can be executed in the **Market Watch.**'
