  md: '# ! MetaTrader 5


    MetaTrader is a platform developed to assist in the visualization of prices of
    financial assets and execution of buy and sell orders on the stock exchange. It
    is also possible to create scripts (algorithms for specific actions), indicators
    and investment robots.


    It is a free tool developed and distributed by MetaQuotes Softwares (https://www.metaquotes.net/).
    Initially, it was developed thinking about the Forex market. However, several
    brokerages have been allowing for the use in the stock market.


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_18_0.png)


    Millions of traders and hundreds of brokers cannot be wrong — they have chosen
    MetaTrader 5 for trading Forex and financial markets!


    We need a company (investment broker) to provide routing pricing data for the
    platform. Many investment brokers offer this service for free. Some even offer
    a demo account where we can simulate buy and sell operations in the financial
    market with dummy money. Also, in the demo account, we can put our robots to test
    in real time before using them in a real account.'
