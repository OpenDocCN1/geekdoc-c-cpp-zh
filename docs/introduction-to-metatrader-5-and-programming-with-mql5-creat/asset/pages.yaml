- img_proc: true
  md: 'used:


    Every tick or Every tick based on real ticks: MetaTrader tries to simulate real
    price ticks in the formation of candles. This option leaves the backtest more
    accurate, but requires more computational resources once inside a candle the MetaTrader
    tries to reproduce the formation of real ticks. It is worth noting that ticks
    are not real just a simulation (a possible representation of reality). This article
    clarifies the functioning of simulation:https://www.mql5.com/en/articles/75.


    1 minute OHLC: In this type of candle formation MetaTrader generates only 4 price
    values: O - open, H - High, L - Low, C - Close. This option requires fewer computational
    resources compared to the tick option.


    Open price only: This is the least costly computationally, because it only uses
    a price to represent a candle.


    In our backtests we will always leave the option Forward marked No (see the figure
    below). This option is useful when we are doing strategy optimizations and want
    to use optimization methods such as Walk Forward Analysis (WFA). This type of
    study is beyond the scope of this book. If you want to know more about it, you
    can buy the other e-book (How to Properly Optimize Investment Robots in MetaTrader
    5[4]).


