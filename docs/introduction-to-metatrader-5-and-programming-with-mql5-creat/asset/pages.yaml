- img_proc: true
  md: '# Return Codes of the Trade Server


    All requests to execute trade operations are sent as a structure of a trade request
    MTradeRequest. The function execution result is placed in structure MTradeResult,
    whose retcode field contains the trade server return code.


    | Code | Constant | Description |

    |---|---|---|

    | 10004 | TRADE_RETCODE_REQUOTE | Re-quote |

    | 10006 | TRADE_RETCODE_REJECT | Request rejected |

    | 10007 | TRADE_RETCODE_CANCEL | Request canceled by trader |

    | 10008 | TRADE_RETCODE_PLACED | Order placed |

    | 10009 | TRADE_RETCODE_DONE | Request completed |

    | 10010 | TRADE_RETCODE_DONE_PARTIAL | Only part of the request was completed
    |

    | 10011 | TRADE_RETCODE_ERROR | Request processing error |

    | 10012 | TRADE_RETCODE_TIMEOUT | Request canceled by timeout |

    | 10013 | TRADE_RETCODE_INVALID | Invalid request |'
  merge: -1
  pgno: 133
