    35

    36     Print(movingAveragePeriod * multiplier); // out: 14

    37

    38 }

    ```


    # #### i.8.2.Global Variables


    When we want a variable to be used by any function/method anywhere in our algorithm,
    we must declare it globally as shown in the example below. Pay close attention
    to this example as it is very important to understand the difference between variables.'
