  md: '# b. Programming the EA


    Now that we know the main functionality of MetaTrader, we have already understood
    the basics of the features of the MQL5 language and the use of MetaEditor we are
    minimally prepared to start developing our investment robot (Expert Advisor -
    EA).


    Before starting to program, let us know and understand the details of our EA strategy.'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# i.1. Strategy overview


    Our EA will have two moving averages and the RSI indicator. The crossing of two
    Moving Averages works well when the market is in a trend. On the other hand, in
    parallel markets or in consolidation, the RSI indicator performs better.


    There are several indicators that offer indicative when the market is in trend
    as the ADX indicator. We decided to choose the RSI for reasons of making an alternative
    between the possibility of choosing the market in the trend and/or lateralized
    market.


    For the buy or sell operations, our EA will have the possibility to choose only
    one of the indicators (crossing of averages or RSI) or both at the same time.
    Thus, we will have an EA that will track the input triggers based on two indicators:
    moving averages and RSI.


    Let us understand how the input triggers in operations will be given for each
    of these indicators.


    # i.1.1. Moving Averages


    First go to the trigger for the crossing of moving averages. We have two moving
    averages and the type, whether exponential or arithmetic, of these averages can
    be changed as we will see next.


    One of the moving averages will be called the fast average and the other slow
    average. The fast average is the one that has the shortest period, on the other
    hand the slow average should always have the longest period.


    We give these names to averages because fast averages are those with a shorter
    period of time and are more adherent to price, so they move faster than those
    of longer periods where they have slower directional behavior.


    Let''s look at an illustrative diagram of how these triggers work in trading:'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# i.1.2.Relative Strength Index (RSI)


    O indicador RSI (Relative Strength Index) no MetaTrader se refere a um Oscilar,
    ou seja, é útil para indicar posições de sobrecompra e revenda em mercado lateralizado
    (consolidado).


    We will not go into detail the calculations behind the RSI because it is not the
    goal at the moment. But let''s understand the kittens buy and sell this indicator


    The figure below shows the RSI and two main levels (solid lines in red) at 30
    and 70. Each of these lines represents the levels to allow overbought (line 70)
    and oversold (line 30). In other words, in a consolidated market, when the RSI
    is equal to or greater than line 70, it can be a reversal warning, warning an
    overbought, that it is a good time to make a sale. On the other hand, if the RSI,
    once again in a consolidated market, is less than equal to line 30, we are in
    an oversold region indicating a good time to buy.


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_115_0.png)


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_115_1.png)'
  merge: -1
  pgno: 115
- img_proc: true
  md: 'In our EA we will leave those levels of 70 (overbought) and 30 (oversold) possible
    to be changed by the user. So you can choose more loose restrictive levels for
    the kittens to buy and sell.


    Let''s now set an example where the trigger levels to buy are at line 30 and the
    trigger to sell is at line 70:


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_116_0.png)


    Let us, therefore, to a summary of the strategy with the elements that we will
    need to program for our EA:


    +   1 - We must add two moving averages (fast and slow) both with the possibility
    of choosing the period, the average application price and the average method used.


    +   2 - We must add the RSI indicator with possibility of period choice, applied'
  merge: -1
  pgno: 116
- img_proc: true
  md: 'price, and oversold and oversold levels.


    3 - The user can choose among the options to enter the traders if they come from
    the moving averages plus the RSI, only moving averages or only the RSI.


    Now that we know the operation to buy and sell for our two indicators (crossing
    of averages and RSI) we are ready to start developing the algorithm with the presented
    strategy.'
