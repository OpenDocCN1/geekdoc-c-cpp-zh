  md: '# .3. Performance Charts


    During the backtest or after the end we can follow the evolution of our capital
    in the Graph tab that appears in the Strategy Tester.


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_151_0.png)


    After, at the end of the backtest, a new tab called Backtest appears. This tab
    provides a summary of the operational statistics of our strategy. In we can see
    the Profit of the operation (ratio between gross profit and gross loss), recovery
    factor, drawdown or retraction, total trading, number of short positions and bought
    gains and losses, sharp index among others.


