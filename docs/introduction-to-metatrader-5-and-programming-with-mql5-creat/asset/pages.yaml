  md: '# 5.12. Ternary Operator


    The ternary operator exists in several high-level programming languages and in
    MQL it is no different. This is a very useful operator to simplify conditional
    structures that could use if and else.


    The ternary operator has the following operating structure:


    (conditional)? (alternative 1 if true): (alternative 2 if false)


    Let''s take an example:


