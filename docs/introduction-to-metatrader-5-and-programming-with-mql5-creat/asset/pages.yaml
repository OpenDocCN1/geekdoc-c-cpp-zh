  md: '# i.4. OnInit() Function


    In the OnInit() function we will add the initialization variables to the indicators
    and add them to the chart with the ChartIndicatorAdd() function.

    Follow the code:


    ```

    //--- Expert initialization function

    //

    int OnInit()

    {

    //

    ma_fast_Handle = iMA(Symbol, ma_time_graphic,ma_fast_period, 0,ma_method, ma_price);

    ma_slow_Handle = iMA(Symbol, ma_time_graphic,ma_slow_period, 0,ma_method, ma_price);


    rsi_Handle = iRSI(Symbol,rsi_time_graphic,rsi_price,rsi_price);

    if(ma_fast_Handle==0 || ma_slow_Handle==0 || rsi_Handle==0)

    {

    Alert("Error trying to create Handles for indicator error: "GetLastError(),"!");

    return(-1);

    }


    CopyBuffer(Symbol, Period,0,0,candles);

    ArraySetAsSeries(candles,true);

    // To add the indicator to the chart:

    ChartIndicatorAdd(0,0,ma_fast_Handle);

    ChartIndicatorAdd(0,0,ma_slow_Handle);

    ChartIndicatorAdd(0,1,rsi_Handle);

    //---

    return (INIT_SUCCEEDED);

    }

    ```


    Note that ChartIndicatorAdd(0,0,mm_fast_Handle) and ChartIndicatorAdd(0,0,mm_slow_Handle)
    has the same graphical addition reference (0 zero), which means that both indicators
    will be on the main screen where the candles. However, ChartIndicatorAdd(0,1,ifr_Handle)
    terms the reference (1 one) is the bookmark will be added to another chart box.'
