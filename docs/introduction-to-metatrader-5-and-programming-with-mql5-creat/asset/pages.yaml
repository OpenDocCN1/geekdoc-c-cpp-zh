    ```


    The NormalizeDouble() function is used for rounding variables. We need to use
    it because some financial assets have the number of different price digits of
    others. We have assets that are quantified by points (as is the case of index
    and dollar futures contracts), others are quantified by price and even pips (Forex
    market). In Chapter 5 we discussed the use of _Point and _Digits.


    The values of the SL and TK variables should be chosen by the user in the form
    of points. Notice that for the stop loss price we did: NormalizeDouble(tick.ask
    - SL * _Point, _Digits) as we are buying and our stop loss point needs to be below
    the (ask). Already the target of the take (take profit) naturally for a purchase
    should be above TK ask points.


    It is with the request request.type_filling = ORDER_FILLING_FOK'' that we choose
    the order fulfillment type. We basically have three types of order fulfillment:


    ```

    requisicao.type_filling = ORDER_FILLING_

    ORDER_FILLING_FOK

    ORDER_FILLING_IOC

    ORDER_FILLING_RETURN

    ```'
