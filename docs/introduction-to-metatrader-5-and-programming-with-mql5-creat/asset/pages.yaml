- img_proc: true
  md: '# 2. Analyzing the Backtest


    As soon as you press the Start button, the following window appears:


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_148_0.png)


    So we have a screen to visualize what is happening with the backtest. We can control
    the speed with which new candles (candles) appear, from the highlighted buttons
    (red) of the figure above.


    You can also have the prices of each candle and indicator (green area highlighted),
    just place the mouse over the desired element on the screen.


    In the Toolbox we have four tabs (Trading, History, Operations and Journal) where
    we can track records regarding our trades operations of our EA.'
  merge: -1
  pgno: 148
