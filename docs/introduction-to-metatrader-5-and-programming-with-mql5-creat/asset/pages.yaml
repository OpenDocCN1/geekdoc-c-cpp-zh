  md: '# MQL5 Reference


    MQL5 Reference / Technical Indicators / IMA


    Type in a request to look for:


    # IMA


    The function returns the handle of the Moving Average Indicator. It has one buffer.


    ```

    int    symbol;                // symbol name

    int    TIMEFRAMES;         // period

    int    price;                // averaging period

    int    MQL_MA_METHOD;      // method

    int    MQL_APPLIED_PRICE;  // type of price or handle

    hint    handle;

    ```


    Parameters


    +   [symbol] The name of the security, the data of which should be used to calculate
    the indicator. The value means the current symbol.


    period


    In our case we are using a moving average period of 7 with the simple smoothing
    type (MODE_SMA) applied to the closing price (PRICE_CLOSE). It is good to point
    out, once again, that each indicator has its own structure of parameters necessary
    for its proper functioning.


    It is always good to point codes to evaluate possible variable loading errors.
    In our case we added an Alert() if we have problems with the variable ''mm_Handle''.
    We did this because the correct functioning of this variable is extremely important
    to our robot strategy. However, the practice of evaluating the loading of variables
    is always welcome.


    The same procedure can be done for the i RSI indicator.


    We made the initial statement and addition of the indicator on the chart with
    the function ChartIndicatorAdd(0,0,mm,Handle). Now we should point ''mm_Handle''
    to the vector of ''mm_Buffer[]'' which is where we will access the values of our
    moving average.


    To do this within the OnTick() function we must call the CopyBuffer() function.'
