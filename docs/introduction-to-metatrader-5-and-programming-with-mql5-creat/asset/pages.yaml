  md: '# b. Basic Programming Logic with MQL5


    As mentioned before, the MQL5 language has great similarities with the C++, Java,
    and C # languages. Therefore, anyone who has any knowledge of these languages
    will have great ease in understanding the MQL5 operating syntax.


    Every algorithm, every recipe for cake, begins with the description of the ingredients.
    So let''s make an analogy and start studying the ingredients of our EA, our cake.


    Let''s first understand the main types of variables present in MQL5. We also need
    to know how this language declares and assigns values to variables.'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# i.1. Types of Variables


    The variable is the basic unit of data storage in any programming language. Almost
    every algorithm needs variables. In MQL5 we need to declare a variable always
    with some type.


    The main types of variables used to create robots are: Integer (int), floating
    point - decimal values (float and double), alphanumeric characters (string), logical
    (bool) and dates (datetime).


    Unlike MQL5 there are some languages that have automatic typing with, for example,
    Python.


    Having to explicitly declare the variable type has practical security advantages
    and makes it easy to find compilation errors. When we are limiting the type of
    the variable, we protect it from possible arithmetic errors, assignment errors,
    and programming logic errors.'
  merge: -1
  pgno: 74
- img_proc: true
  md: '# i.2. Declaration of Variables


    Every MQL5 variable must have a type and a name. The type of this variable must
    always be specified before the name. Then we can assign values corresponding to
    the variable type. Let''s study the most used and that will be part of the structure
    of our EA.


    # i.2.1.Integer Type


    We have some peculiarities regarding the memory consumption required to store
    a variable. In most EAs this is not a problem, but we will discuss these issues
    in case you want to leave your robot optimized for the memory consumption requirement
    of processing.


    For example, the type variables char, short, int, uchar, ushort, uint that serve
    for integer variables.


    char - uses 1 byte of memory. You can allow values in the range of -128 to 127.


    short - uses 2 bytes of memory. Can support values in the range of -32,768 to
    32,767.


    int - uses 4 bytes of memory. You can allow values in the range of -2,147,483,648
    through 2,147,483,647.


    uchar - uses 1 byte of memory. The range of values is 0 to 255.


    ushort - uses 2 bytes of memory. The range of values is 0 to 65,535.


    uint - uses 4 bytes of memory. The range of values is 0 to 4,294,967,295.


    See the example below:


    ```

    int int movingAveragePeriod = 24;

    15

    ```'
  merge: -1
  pgno: 75
- img_proc: true
  md: 'In this case we have a variable with the name ‘movingAveragePeriod, which accepts
    integer values (int). We can see a value assignment equal to 24. If no value is
    assigned to the variable MQL5 immediately assigns zero.


    # 2.2.Type Double


    When we are interested in storing variables with decimal numbers the most appropriate
    is to use the double type. The double type consumes 8 bytes of memory. More economical,
    we have the float type that consumes half, 4 bytes.


    The main difference between these two types (float and double) is that the accuracy
    of significant digits is larger for the double type (15 significant digits) while
    the float has only 7 significant digits. The difference in memory consumption
    for our robots will be irrelevant we use only the double type that is more accurate.


    For example, the division, in the figure below, does not involve many numeric
    digits. Therefore, the double or float type makes no difference. On the other
    hand, if we had a problem where the result was some periodic tithing multiplied
    by some number or other decimal, cumulative rounding errors could interfere with
    the accuracy of the results.


