  md: 'We can visualize bar charts informing about the schedules, the days of the
    week and the month where we have more entries in traders.


    You can track the frequency of profits and losses: by EA operating hours, days
    of the week, and months of the year. We also have information regarding the maximum
    time set and the minimum duration of a position.


    However, as we can see, MetaTrader 5 gives us a very thorough review of our backtest.


