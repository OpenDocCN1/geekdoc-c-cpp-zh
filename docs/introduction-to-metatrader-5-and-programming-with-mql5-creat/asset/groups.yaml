    ```

    49

    50 myArray[3] = 40; // we will have a compilation error!

    51

    ```


    This compilation error happens because we made an initial statement (myArray[3])
    to allocate only 3 memory locations and we are trying to add a fourth position.


    We can make our array of the type of variable we want. However, in advance, MQL5
    needs to know the size of the list of values we need for the array. So putting
    some value in brackets soon after the variable name is required.


    Another way to declare arrays is to directly assign values to it. We should do
    this in the following way:'
