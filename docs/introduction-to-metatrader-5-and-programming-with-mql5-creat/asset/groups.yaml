    74   }\n75\n76 if(A == B || A == C) // || 是布尔或逻辑运算\n77\n   {\n78   Print(true);\
    \ // 输出: true\n79 }\n```\n\n现在让我们来看看 else 类型的条件结构。如果 'if' 条件不为真，则会激活 else。因此，如果\
