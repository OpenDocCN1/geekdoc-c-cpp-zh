    (Robots)）。


    让我们从菜单中添加一个指标：


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_27_0.png)


    在上方图中，我们可以看到指标按趋势指标、震荡器、成交量、Bill Williams 和自定义（Custom）进行分类。趋势指标顾顾名，更适合在市场处于某些定义明确的方向性行为时发出警告。相反，震荡器指标更适合警告横盘市场（即震荡市场）中的机会。


    Bill Williams[2] 是一位非常受欢迎的交易员，他开发了许多重要且被广泛使用的指标。因此，为他创建的指标专门创建了一个部分。


    很有趣的是，我们可能需要使用 MetaTrader 原生的指标和 EA，也可以使用我们创建的、甚至是从工具箱“市场”（Market）标签页中提供的指标和 EA。


