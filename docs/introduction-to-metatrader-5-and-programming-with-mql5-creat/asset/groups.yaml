  - '[PAGE 57]


    # I.1. MetaEditor


    MetaEditor is an Integrated Development Environment (IDE) for the MQL5 language
    that is included in MetaTrader 5. Let us now know the main features of developments
    offered by MetaEditor.


    To open MetaEditor we must click the highlighted icon in the image below or press
    the F4 shortcut.


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_57_0.png)


    After clicking on the icon for MetaEditor we will have a development environment
    with three main areas that will assist us in the development of our codes.'
  - '[PAGE 58]


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_58_0.png)


    **Area 1:** Navigator - where we will manage our code library archives and libraries
    in development.


    **Area 2:** Window where the codes are properly typed.


    **Area 3:** Toolbox - here is where we will follow the development of our compilation
    and debugging tests. We have 6 tabs (Errors, Search, Articles, Code Base, Public
    Projects and Journal). Basically, for the creation of our algorithms we will only
    use the Errors and Journal tabs.


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_58_1.png)'
