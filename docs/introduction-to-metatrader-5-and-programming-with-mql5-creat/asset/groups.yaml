    # 14. Candles and Tick Variables


    The MQL5 language has a set of libraries prepared to work with the acquisition
    and manipulation of candle prices. We have the MqlRates structure that stores
    the price information of opening, closing, maximum, minimum, volume, spread and
    time.


    Tick information refers to those collected from the book of offers such as (bid),
    bid (sale), last business etc. This information can be accessed from the MqlTick
    structure.


    Let''s see how to declare a candle variable and tick. We must beware, because
    we must first declare the variable after doing the proper loading of the data
    in the variable declared from other specific functions.


    In order to load, we must specify the financial asset (which can be the current
    one of the graph using _Symbol) and the period of the candles (to use the current
    chart we put _Period).


    For an example, we will create a new Expert Advisor with the name of Study_Var
    (study of variables). In the wizard now we will add the OnTimer option.


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_98_0.png)'
