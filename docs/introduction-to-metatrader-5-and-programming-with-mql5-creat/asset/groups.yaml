    - 了解 MetaTrader 在线门户网站的主要优势；

    - 理解 MetaTrader 和 MQL5 之间的主要功能和区别；

    - 学习添加指标和 EA；

    - 了解 MetaEditor 和一些方便编程的主要快捷键；

    - 学习 MQL5 的编程语法；

    - 理解 MQL5 开发库的主要函数。

    - 使用趋势指标（移动平均线）和整合市场指标（相对强度指数 - RSI）创建策略；

    - 一步步编写一个多策略 EA；

    - 对创建的 EA 进行回测；

    - 了解回测统计数据；

    - 以及更多。


    现在，我们正迈向投资的未来。祝贺你决定进入这个宏大而迷人的自动化投资世界。


    感谢你信任购买这些材料。未来已来，我们将共同构建。


