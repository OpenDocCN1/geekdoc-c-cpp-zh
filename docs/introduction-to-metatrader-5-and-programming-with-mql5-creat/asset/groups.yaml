  mdcn: '


    # 1. 在 MetaTrader 中进行回测


    打开 MetaTrader，转到导航器（Navigator） -> **智能终端 (Expert Advisor)** 顾问，并寻找我们最新的 EA。找到后，我们应该对它点击右键，然后点击**测试
    (Test)**。


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_141_0.png)


    这将为 MetaTrader 提供一个名为**策略测试器 (Strategy Tester)** 的新字段，在设置选项卡中，我们有以下功能面板：


    | 专家 | EA_MA_Cross_RSIv5 | PETR4 | M5 |

    |---|---|---|---|

    | 日期自定义周期 | 2015.01.23 | 2016.06.11 | | |

    | 前向 | 否 | | | |

    | 执行 | 无延迟 | 1 分钟 OHLC | | |

    | 存款 | 10000 USD | 1:1 | 可视化 | | |

    | 优化 | 已禁用 | 余额指数 | | |

    | 测试进度： | | | | |


    通过这些功能，我们能够选择用于回测的金融资产：


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_142_0.png)


    ## 图形时间：


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_142_1.png)


    我们可以选择 MetaTrader 如何模拟**我们的蜡烛 线的形成**。


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_142_2.png)


    对于这种以 K 线生成价格的方式，让我们进入最常用的主选项：


    - **每个分跳或基于真实分跳的每个分跳**：MetaTrader 尝试在 K 线的形成中模拟真实的价格跳动。此选项让回测更准确，但在 K 线内部，MetaTrader
    会尝试重现真实分跳的形成，这需要更多的计算资源。值得注意的是，分跳并非真实，只是一个模拟（对现实的可能表示）。本文澄清了模拟的原理：https://www.mql5.com/en/articles/75。

    - **1 分钟 OHLC**：在这种类型的 K 线形成中，MetaTrader 只生成 4 个价格值：O - 开盘价、H - 高价、L - 低价、C -
    收盘价。与分跳选项相比，此选项需要的计算资源较少。

    - **仅开盘价**：计算成本最低，因为它只使用一个价格来代表 K 线。


    在回测中，我们将始终将“前向 (Forward)”选项标记为“否”（见下所示）。此选项在我们进行策略优化并希望使用诸如走向前分析 (WFA) 等优化方法时非常有用。这类研究超出了本书的范范围。如果你想了解更多信息，可以购买另一本电子书（《如何在
    MetaTrader 5 中正确优化投资机器人[4]》）。


    | 专家 | EA_MA_Cross_RSI.ex5 |

    |---|---|

    | 日期：自定义周期 | |

    | 前向：否 | 2015.01.07 |

    | 执行：无延迟 | |

    | 存款：10000 USD 1:1 | |

    | 优化：已禁用 | |


    带延迟或不带延迟的执行类型非常有趣，因为我们可以模拟服务器所在的环境以及我们互联网的速度。延迟是指路由订单以正确执行所需的时间。


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_144_0.png)


    我们有从初始存款选择金融产品的能力，以及使用杠杆投资的可能性（例如下方的 1: 1 - 无杠杆）。


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_144_1.png)


    对于我们的回测，**优化 (Optimization)** 字段应该是禁用的。


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_144_2.png)


    我们应该为回测选择数据段。


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_145_0.png)


    并勾选查看回测的选项：


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_145_1.png)


    现在让我们进入策略测试器的**输入 (Input)**（参数）选项卡。


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_146_0.png)


    在此字段中，我们可以放置实现回测所需的设置。目前，我们感兴趣的只是高亮显示的“值 (Value)”列。其他列（绿色高亮）用于 EA 优化。


    | | 值 | 开始 | 步长 |

    |---|---|---|---|

    | -策略- | | 仅移动平均线 | 移动平均线加... |

    | -移动平均线- | | | 120 | 120 |

    | -快速移动平均线周期 | | 32 | 1 | 120 |

    | -慢速移动平均线周期 | | 32 | 1 | 1个月 |

    | - 图形时间 | | 当前价格 | | 加权 |

    | - 应用价格 | | 收盘价 | | 加权 |

    | - RSI 周期 | | 当前价格 | | 50 |

    | - 图形时间 | | 收盘价 | | 1个月 |

    | - 超买水平 | | 70 | | 加权 |

    | - 超卖水平 | | 30 | | 700 |


    在**代理 (Agents)** 选项卡中，我们有关于执行回测和优化所需的计算能力的信息。回测通常是很便宜的。但是，当我们进行优化（大量回测）时，我们需要大量的资源，因此此代理选项卡对我们非常重要。我们可以使用多核来增加功率。只需几美元即可进行数千次优化。在正确设置回测参数后，只需回到设置选项卡并点击开始。


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_147_0.png)


    # 2. 分析回测


    一旦你点击开始，就会出现以下窗口：


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_148_0.png)


    我们有一个屏幕来可视化回测正在发生什么。我们可以控制出现新 K 线（蜡烛线）的速度，图中是每根 K 线（红色/绿色显示）。只需将鼠标悬停在所需的元素上即可。我们有交易
    (Trading)、历史 (History)、操作 (Operations) 等四个选项卡来跟踪我们 EA 的记录。在**操作 (Operations)**
    选项卡中，我们跟踪每笔交易。有用的是，我们可以点击操作中的某项，图表会自动显示该操作。我们可以快速看到盈利（绿色）和亏损（红色）操作。


    | 时间 | 订单 | 资产 | 类型 | 价格 | S/L | T/P | 收益 | 备注 |

    |---|---|---|---|---|---|---|---|---|

    | 2023-03-18 17:48:09 | | 卖 | 100.00 | 100.00 | | | | |

    | 2023-03-18 16:25:40 | | 买 | 100.00 | 17.05 | 17.25 | | | |

    | 2023-03-18 15:43:20 | | 买 | 100.00 | 16.00 | 18.03 | | | |

    | 2023-03-18 11:45:00 | | 买 | 100.00 | 17.12 | 17.47 | | | |

    | 2023-03-18 09:22:15 | | 卖 | | | | | | -1.00 |


    最后，操作选项卡显示了每个特定交易的进度。我们有入场价格、可用保证金以及交易进展的信息（无论是盈利还是亏损）。


    | 时间 | 订单 | 资产 | 类型 | 数量 | 价格 | S/L | T/P | 收益 | 备注 |

    |---|---|---|---|---|---|---|---|---|---|

    | 2023-03-18 13:50:40 | | | 等待 | | 18.35 | | 成交 | 18.35 |

    | 2023-03-18 14:13:40 | | | 等待 | | 18.25 | 17.31 | 成交 | 18.50 |

    | 2023-03-18 14:27:20 | | | 买 | | 17.02 | 17.17 | 成交 | |

    | 2023-03-18 15:16:00 | | | 买 | | 17.02 | 16.02 | 成交 | 17.34 |

    | 2023-03-18 15:43:20 | | | 买 | | 17.00 | 17.01 | 成交 | |

    | 2023-03-18 16:05:00 | | | 买 | | 17.00 | 16.00 | 成交 | |

    | 2023-03-18 16:25:40 | | | 买 | 100.00 | 17.05 | | 17.25 | | |

    | 2023-03-18 17:10:10 | | | 等待 | | 17.00 | 17.12 | 17.47 | | 1.8 | tp 17.37 |

    | 2023-03-18 17:48:09 | | | 卖 | 100.00 | 100.00 | | | | | -1.00 |


    | 票据 | | | 类型 | 数量 | 价格 | S/L | T/P | 收益 | 备注 |

    |---|---|---|---|---|---|---|---|---|---|

    | 卖出: 100 051.00 资金: 100 051.02 空闲保证金: 542.00 保证金亏损: 96.00 保证金比例: 106.78% | |
    | | | 0.00 | | | | |


