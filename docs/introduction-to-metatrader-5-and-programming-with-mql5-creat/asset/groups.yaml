    | 2023-03-18 17:10:10 | | | wait | | 17.00 | 17.12 | 17.47 | | 1.8 | tp 17.37
    |

    | 2023-03-18 17:48:09 | | | sell | 100.00 | 100.00 | | | | | -1.00 |


    | Ticket | | | Type | Volume | Price | S/L | T/P | Gained | Comment |

    |---|---|---|---|---|---|---|---|---|---|

