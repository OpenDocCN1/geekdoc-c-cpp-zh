    ## i.3. Declaration of Global Variables


    Let''s start by declaring our global variables. We will separate those variables
    that the user will have access to modify and those that will be used for the structure
    of the EA algorithm.


    ### i.3.1. Variables for the User


    We will provide the following options (input parameters): profit targets, stop
    loss, number of traded lots, chart time, average periods, RSI period, application
    of methods in processes (opening, closing, max, min) for both the averages and
    the RSI, possibility of choice in the strategy of entry triggers in operations
    (Moving averages plus RSI, only crosses, RSI only) and time limit to close the
    open operations.


    Below is the code of all this:


    ```

    // Variables Input

    ----------------------Strategy-------

    20 input string s0; // = ONLY_MA; // Trader Entry Strategy

    21 input STRATEGY_IN strategy


    ----------------------Moving Averages-----------------

    23 input string s1; // = Fast Moving Average Period

    24 input int ma_fast_period = 12; // Slow Moving Average Period

    25 input int ma_slow_period = 32;

    26 input EN_TIMRAMES ma_time_graphic = PERIOD_CURRENT; // Graphic Time

    27 input METHOD = Method; // Method

    28 input APPLIED_PRICE ma_price = PRICE_CLOSE; // Price Applied


    30 input string s2; //----------------------RSI Period

    31 input string rsi_period

    32 input EN_TIMRAMES rsi_time_graphic = PERIOD_CURRENT; // Graphic Time

    33 input APPLIED_PRICE rsi_price = PRICE_CLOSE; // Price Overbought


    35 input string rsi_overbought = 70; // Level Overbought

    36 input string rsi_oversold = 30; // Level Oversold


    38 input string s3; // = 100; // Number of lots

    39 input int num_lots = // // Take Profit

    40 input double TR = 60; // Stop Loss

    41 input double SL = 30;


    43 input string s4; // = "17:40"; // Time Limit Close Position

    44 input string limit_close_op

    ```


    For the ''strategy'' variable it was chosen to create an enum (this should be
    declared at the top of the algorithm above the Input variables):


    ```

    11 enum STRATEGY_IN

    12 {

    13 ONLY_MA,      // Only moving averages

    14 ONLY_RSI,     // Only RSI

    15 MA_AND_RSI   // moving averages plus RSI

    16 };

    ```


    ### i.3.2. Global Variables


    We must now declare the global variables that will be used by the functions of
    our algorithm. See below:


    ```

    46+//------------------------------------------------------

    47+// Variables for indicators

    48+//------------------------------------------------------

    49+// Moving Averages

    50 // FAST - shorter period

    51 int ma_fast_Handle;      // Handle Fast Moving Average

    52 double ma_fast_Buffer[]; // Buffer Fast Moving Average

    53

    54 // SLOW - longer period

    55 int ma_slow_Handle;      // Handle Slow Moving Average

    56 double ma_slow_Buffer[]; // Buffer Moving Average

    57

    58 // RSI

    59 int rsi_Handle;          // Handle for RSI

    60 double rsi_Buffer[];     // Buffer for RSI

    61

    62+//------------------------------------------------------

    63+// Variables for functions

    64+//------------------------------------------------------

    65 int magic_number = 123456; // Magic Number

    66

    67 MqlRates candle[];      // Variable for candles

    68 MqlTick tick;           // Variable for ticks

    ```


    ## i.4. OnInit() Function


    In the OnInit() function we will add the initialization variables to the indicators
    and add them to the chart with the ChartIndicator() function. Follow the code:


    ```

    //--- Expert initialization function

    //

    int OnInit()

    {

    //

    ma_fast_Handle = iMA(Symbol, ma_time_graphic,ma_fast_period, 0,ma_method, ma_price);

    ma_slow_Handle = iMA(Symbol, ma_time_graphic,ma_slow_period, 0,ma_method, ma_price);


    rsi_Handle = iRSI(Symbol,rsi_time_graphic,rsi_price,rsi_price);

    if(ma_fast_Handle==0 || ma_slow_Handle==0 || rsi_Handle==0)

    {

    Alert("Error trying to create Handles for indicator: ",GetLastError(),"!");

    return(-1);

    }


    CopyBuffer(Symbol, Period,0,0,candle);

    ArraySetAsSeries(candle,true);

    // To add the indicator to the chart:

    ChartIndicatorAdd(0,0,ma_fast_Handle);

    ChartIndicatorAdd(0,0,ma_slow_Handle);

    ChartIndicatorAdd(0,1,rsi_Handle);

    //---

    return (INIT_SUCCEEDED);

    }

    ```


    Note that ChartIndicatorAdd(0,0,ma_fast_Handle) and ChartIndicatorAdd(0,0,ma_slow_Handle)
    has the same graphical addition reference (0 zero), which means that both indicators
    will be on the main screen where the candles. However, ChartIndicatorAdd(0,1,rsi_Handle)
    terms the reference (1 one) is the bookmark will be added to another chart box.


    ## i.5. Function OnDeinit()


    When the EA is removed we need to remove the indicators and if necessary clear
    variables and parameters. The OnDeinit() function is called when the robot is
    removed. Thus, within this function we can write our disinitialization activities
    of the parameters:


    ```

    100+//------------------------------------------------------+

    101/* Expert deinitialization function */

    102+//------------------------------------------------------+

    103 void OnDeinit(const int reason)

    104 {

    105 //--

    106 IndicatorRelease(ma_fast_Handle);

    107 IndicatorRelease(ma_slow_Handle);

    108 IndicatorRelease(rsi_Handle);

    109 }

    ```


    As we write these codes it is advisable to compile and test EA in MetaTrader.
    So if we drag the file: MM_CROS_RSI.exe5 in MetaTrader for some financial asset
    we will have the following:

