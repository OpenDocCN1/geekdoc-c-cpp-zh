    # i.4. Vector Variables: Arrays


    An array is a variable that supports multiple values. We may think that an array
    is something like a list of values with a certain type. Within this list we can
    do iterations traversing each of its values.


    We will often use variable arrays to store mainly financial asset price information
    and indicator variables.


    Here is an example of a three-position array declaration for storing integer numbers:


    ```

    42 int myArray[3]; // creates a variable and allocates three int positions

    43 myArray[0] = 10; // saves the value 10 in the zero position

    45

    46 myArray[1] = 20; // saves the value 10 in the one position

    47

    48 myArray[2] = 30; // saves the value 10 in the two position

    ```


