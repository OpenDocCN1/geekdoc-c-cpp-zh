    # ### i.8. Local and Global Variables


    It is very important to know the distinction between local variables and global
    variables. The confusion between these two types of variables leads to many EA
    compilation and execution errors. Therefore, we must be very careful and pay close
    attention to where we are making the declaration of variables.


    # #### i.8.1.Local variables


    Let''s create a function to show an example of local variables. When variables
    are declared within a function/methods they with their assigned values will only
    be used within functions. So we have local variables because they are declared
    within a method or function.


    ```

    28 // test function with void return

