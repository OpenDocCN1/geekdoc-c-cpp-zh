    # .3. High Frequency Trading - HFT


    Investors and speculators in the financial market know that the main enemy to
    make money in this world is precisely the emotional factor. Human beings have
    desires, wants, greed, fears and fears that make the activity decide the best
    time to buy and / or sell a real challenge.


    When we are working with Investment Robots, we are discussing a strategy that
    has been previously defined and structured so that it can be executed in a timely
    manner. Frequently, robots do not get tired, stress or have any feelings that
    allow misunderstandings and / or biases when buying or selling.


    Optical fibers allowed for a revolution in communication. In the investment world,
    for example, every thousandth of a second can cost millions of dollars. So-called
    High Frequency Traders (HFTs) operating on the world''s top stock exchanges makes
    decisions at infinitesimal speeds and thus are threatening many professional brokers
    and traders.


    The HFTs'' decision to buy and / sell is taken in milliseconds, up to ten to fifty
    times faster than a simple wink of the human eye (lasting approximately 300 milliseconds).
    It is practically unfeasible and unfair the operational comparison of any computational
    system of this category with a normal human being.


    Recent data (year 2018) show that more than 50% of US financial operations are
    carried out by investment robots. And the results show that these robots can increase
    financial returns by up to 15%. There are some stock exchanges where more than
    90% of operations are carried out by investment robots.'
