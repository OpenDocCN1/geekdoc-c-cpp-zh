    129 ArraySetAsSeries(ma_slow_Buffer,true);\n130 ArraySetAsSeries(rsi_Buffer,true);\n\
    131\n132 --\n133 // Feed with tick variable data\n134 SymbolInfoTick(Symbol_,tick);\n\
    ```\n\nAfter this we can make use of these variables to build the logic of the\
