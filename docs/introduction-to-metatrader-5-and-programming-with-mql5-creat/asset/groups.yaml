- md: "\n## I.7. EA Properties\n\nIt is always good to inform details of robot development.\
    \ Thus, directive #property serves to describe basic information about EA. In\
    \ the example below, where we have the property directive, we can observe information\
    \ regarding copyright, link directed to some website and version of the robot.\n\
    \n```\n1/++                               EA MA_Ros_IFR.mq5 |\n2//|          \
    \                     Copyright 2018. |\n3//|                               https://www.mq15.com\
    \ |\n4//|                                                \n5//--------------------------------------------------\n\
    6#property copyright \"Copyright 2018\"\n7#property link \"https://www.mq15.com\"\
    \n8#property version \"1.00\"\n```\n\nAfter pressing the Compile button:\n\n![](img/6d863e70ea1a0ecdc703a17721d7e78b_67_0.png)\n\
    \nWe note that in the Toolbox field on the Errors tab the compiler did not raise\
    \ any problems.\n\n![](img/6d863e70ea1a0ecdc703a17721d7e78b_68_0.png)\n\nSo automatically\
    \ in the MetaTrader Platform in the field Navigator -> clicking on the more of\
    \ Expert consultant we can find our EA compiled (.ex5). You can now click, hold\
    \ and drag to the candle chart and observe the #property information present.\n\
    \n![](img/6d863e70ea1a0ecdc703a17721d7e78b_68_1.png)\n\nAs we still have practically\
    \ nothing programmed from the robot information in the Common tab above, are the\
    \ only available so far. Then, with each new modification made in the code with\
    \ MetaEditor we can observe the changes in the field Navigator in the part of\
    \ experts.\n\n## 1.8. MetaTrader and MetaEditor File Types\n\nThe file type generated\
    \ with MetaEditor has the extension '.mql'. We can verify this in the MetaEditor\
    \ Navigator field where we have our robot edition file called EA_MA_Cros_RSI.mql5.\n\
    \nAfter clicking on the button Compile a file with the extension 'EA_MA_Cros_RSI.ex5'\
    \ is automatically created in the field Navigator -> Expert Advisor of MetaTrader.\n\
    \nIt is important to note the difference between MetaTrader and MetaEditor. In\
    \ MetaEditor we have files with extension '.mql5' and in MetaTrader we have '.ex5'\
    \ files.\n\n## I.9. Adding Libraries\n\nWe can add special libraries provided\
    \ by MQL5. For this we just need to know the name of the library with the following\
    \ code structure:\n\n```\n//12--- Includes\n13 #include <ChartObjects/ChartObjectsFibo.mqh>\n\
    14 #include <Trade/Trade.mqh>\n```\n\nThe above example adds a set of classes\
    \ and methods ready to generate Fibonacci figures in the first <ChartObjects/ChartObjectsFibo.mqh>,\
    \ and work with sensing and managing sales orders in the second include <Trade/Trade.mqh>.\n\
    \nNote that the extension of these files is of type '.mqh'. MetaEditor also allows\
    \ you to create this type of file. From which we can create complex algorithms\
    \ that work with the graphic part and even visual animations.\n\nWe can research\
    \ and study the main MQL5 libraries from the site:\n\n![](img/6d863e70ea1a0ecdc703a17721d7e78b_70_0.png)\n\
    \nIn Chapter 5 we will know and study better MetaEditor functionality from the\
    \ study of the MQL5 syntax.\n\n## Chapter 5\n\n### b. Basic Programming Logic\
    \ with MQL5\n\nAs mentioned before, the MQL5 language has great similarities with\
    \ the C++, Java, and C# languages. Therefore, anyone who has any knowledge of\
    \ these languages will have great ease in understanding the MQL5 operating syntax.\n\
    \nEvery algorithm, every recipe for cake, begins with the description of the ingredients.\
    \ So let's make an analogy and start studying the ingredients of our EA, our cake.\n\
    \nLet's first understand the main types of variables present in MQL5. We also\
    \ need to know how this language declares and assigns values to variables.\n\n\
    ### i.1. Types of Variables\n\nThe variable is the basic unit of data storage.\
    \ The main types of variables used in MQL5 are:\n\n- Integer (int)\n- floating\
    \ point (float and double)\n- characters (string)\n- logical (bool)\n- dates (datetime)\n\
    \nIn the present moment do not worry about the results of operations. For the\
    \ time being, let's take a look at the structure of variables.\n\n### i.2. Declaration\
    \ of Variables\n\nEvery variable must have a name. In MQL5 we need to declare\
    \ the following:\n\n### i.2.1.Integer\n\nThe main types of variables used in MQL5\
    \ are:\n\n- char: uses 1 byte of memory, range of -128 to 127.\n- short: uses\
    \ 2 bytes of memory, range of -32,768 to 32,767.\n- int: uses 4 bytes of memory,\
    \ range of -2,147,483,648 to 2,147,483,647.\n- uchar: uses 1 byte of memory, range\
    \ of 0 to 255.\n- ushort: uses 2 bytes of memory, range of 0 to 65,535.\n- uint:\
    \ uses 4 bytes of memory, range of 0 to 4,294,967,295.\n\n```\nint movingAveragePeriod\
    \ = 24;\n```\n\n### i.2.2.Double\n\nWhen we are interested in decimal numbers\
    \ the most appropriate is to use the double type. The double type consumes 8 bytes\
    \ of memory while the float has only 4 bytes. The difference between these two\
    \ types (float and double) is that the accuracy is larger.\n\n```\nint movingAveragePeriod\
    \ = 24;\ndouble valueRSI = 1.611;\n\ndouble a = 1.0;\ndouble b = 0.5;\ndouble\
    \ c = a / b;\n```\n\n### i.2.3.String\n\nTextual character variables are typed\
    \ with string. The MQL5 language allows string concatenation in a very simplified\
    \ way as shown below:\n\n```\nstring s_1 = \"My first\";\nstring s_2 = \"Expert\
    \ Advisor\";\n\nstring s_t = s_1 + s_2; // return: My first Expert Advisor;\n\
    ```\n\nFor a string if no value is assigned, an empty string (NULL) is placed.\n\
    \n### i.2.4.bool\n\nWhen the interest is to have a variable with boolean characteristics,\
    \ that is, only allow true values (true) or false (false) we can use the type\
    \ bool:\n\n```\nint x = 10;\nint y = 20;\n\nbool result; //without initial assignment\
    \ we have (false)\n\nresult = x < y; // return (true)\n```\n\nIt should be noted\
    \ that in the case the variable 'bool response' was declared without initial value,\
    \ so the value of (false) is immediately assigned. Only then, see figure above,\
    \ that we have a value change to true.\n\n### i.2.5.Datetime\n\nThis is one of\
    \ the most widely used types, since asset price data are collected\n"
  mdcn: "\n\n## I.7. EA 属性\n\n告知机器人开发的细节总是好的。因此，`#property` 指令用于描述 EA 的基本信息。在下面的示例中，在我们使用了属性指令的情况下，我们可以看到有关版权、指向某些网站的链接以及机器人版本的信息。\n\
    \n```\n1/++                               EA MA_Ros_IFR.mq5 |\n2//|          \
    \                     Copyright 2018. |\n3//|                               https://www.mq15.com\
    \ |\n4//|                                                \n5//--------------------------------------------------\n\
    6#property copyright \"Copyright 2018\"\n7#property link \"https://www.mq15.com\"\
    \n8#property version \"1.00\"\n```\n\n点击编译（Compile）按钮后：\n\n![](img/6d863e70ea1a0ecdc703a17721d7e78b_67_0.png)\n\
    \n我们注意到，在错误（Errors）选项卡的工具箱（Toolbox）字段中，编译器没有提出任何问题。\n\n![](img/6d863e70ea1a0ecdc703a17721d7e78b_68_0.png)\n\
    \n因此，在 MetaTrader 平台的导航器（Navigator）字段中 -> 点击“交易顾问”（Expert consultant）的更多，我们可以找到编译好的\
    \ EA (.ex5)。现在你可以点击、按住并拖到 K 线图上，并观察显示的 `#property` 信息。\n\n![](img/6d863e70ea1a0ecdc703a17721d7e78b_68_1.png)\n\
    \n由于我们目前在上面的通用（Common）选项卡中还没有编写任何机器人信息，因此这些是目前唯一可用的。那么，通过在 MetaEditor 对代码进行每项新修改，我们都可以在导航器中的专家（experts）部分观察到变化。\n\
    \n## 1.8. MetaTrader 和 MetaEditor 文件类型\n\n使用 MetaEditor 生成的文件扩展名为 '.mql'。我们可以在\
    \ MetaEditor 导航器字段中验证这一点，那里我们有一个名为 `EA_MA_Cros_RSI.mql5` 的机器人编辑文件。\n\n点击编译（Compile）按钮后，MetaTrader\
    \ 导航器 -> 交易顾问（Expert Advisor）字段中会自动创建一个扩展名为 'EA_MA_Cros_RSI.ex5' 的文件。\n\n注意 MetaTrader\
    \ 和 MetaEditor 之间的区别。在 MetaEditor 中，我们拥有扩展名为 '.mql5' 的文件，而在 MetaTrader 中是 '.ex5'\
    \ 文件。\n\n## I.9. 添加库\n\n我们可以添加 MQL5 提供的特殊库。为此，我们只需要按照以下代码结构知道库的：\n\n```\n//12---\
    \ Includes\n13 #include <ChartObjects/ChartObjectsFibo.mqh>\n14 #include <Trade/Trade.mqh>\n\
    ```\n\n上面的示例在第一个 `<ChartObjects/ChartObjectsFibo.mqh>` 中添加了一组用于生成斐波那契图形的类和方法，并在第二个包含\
    \ `<Trade/Trade.mqh>` 中处理感知和管理销售订单。\n\n注意这些文件的扩展类型为 '.mqh'。MetaEditor 也允许你创建这种类型的文件。通过它，我们可以创建处理图形部分甚至视觉动画的复杂算法。\n\
    \n我们可以从网站研究和学习主要的 MQL5 库：\n\n![](img/6d863e70ea1a0ecdc703a17721d7e78b_70_0.png)\n\
    \n在第 5 章，我们将通过学习 MQL5 语法来更好地了解和研究 MetaEditor的功能。\n\n## 第 5 章\n\n### b. MQL5 基础编程逻辑\n\
    \n如前所述，MQL5 语言与 C++、Java 和 C# 语言有许多相似之处。因此，任何了解这些语言的人都能非常轻松地理解 MQL5 的操作语法。\n\n\
    每一个算法、每一个蛋糕配谱都从描述成分开始。所以让我们做一个类比，开始学习我们的 EA（我们的蛋糕）的成分。\n\n让我们先理解 MQL5 中主要的变量类型。我们还需要知道这种语言如何声明和为变量赋值。\n\
    \n### i.1. 变量类型\n\n变量是数据存储的基本单元。MQL5 中使用的变量变量类型：\n\n- 整数 (int)\n- 浮点数 (float 和\
    \ double)\n- 字符 (string)\n- 逻辑型 (bool)\n- 日期 (datetime)\n\n目前不要担心操作的结果。暂时，让我们看看变量的结构。\n\
    \n### i.2. 变量声明\n\n每个变量必须有一个名称。在 MQL5 中，我们需要声明以下内容：\n\n### i.2.1. 整数\n\nMQL5 中使用的变量变量类型为：\n\
    \n- char: 使用 1 字节内存，范围为 -128 到 127。\n- short: 使用 2 字节内存，范围为 -32,768 到 32,767。\n\
    - int: 使用 4 字节内存，范围为 -2,147,483,648 到 2,147,483,647。\n- uchar: 使用 1 字节内存，范围为 0\
    \ 到 255。\n- ushort: 使用 2 字节内存，范围为 0 到 65,535。\n- uint: 使用 4 字节内存，范围为 0 到 4,294,967,295。\n\
    \n```\nint movingAveragePeriod = 24;\n```\n\n### i.2.2. Double\n\n当我们对小数数字感兴趣时，最合适的是使用\
    \ `double` 类型。`double` 类型消耗 8 字节内存，而 `float` 只有 4 字节。这两种类型（float 和 double）之间的区别是精度更高。\n\
    \n```\nint movingAveragePeriod = 24;\ndouble valueRSI = 1.611;\n\ndouble a = 1.0;\n\
    double b = 0.5;\ndouble c = a / b;\n```\n\n### i.2.3. String\n\n文本字符变量使用 `string`\
    \ 类型。MQL5 语言允许以非常简单的方式进行字符串拼接，如下所示：\n\n```\nstring s_1 = \"My first\";\nstring\
    \ s_2 = \"Expert Advisor\";\n\nstring s_t = s_1 + s_2; // 返回: My first Expert\
    \ Advisor;\n```\n\n对于字符串，如果没有赋值，则放置一个空字符串 (NULL)。\n\n### i.2.4. bool\n\n如果兴趣是有一个具有布尔特征的变量，即只允许真值\
    \ (true) 或假值 (false)，我们可以使用 `bool` 类型：\n\n```\nint x = 10;\nint y = 20;\n\nbool\
