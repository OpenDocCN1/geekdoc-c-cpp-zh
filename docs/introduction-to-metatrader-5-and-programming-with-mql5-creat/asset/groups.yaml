    \ datetime last_time=0;\n    // current time\n    datetime lastbar_time=(datetime)SeriesInfoInteger(Symbol(),Period(),SER_LASTBAR_DATE);\n\
    \    // if it is the first call of the function\n    if (last_time==0) {\n   \
    \     // set the time and exit\n        last_time=lastbar_time;\n        return(false);\n\
    \    }\n    // if the time differs\n    if (last_time!=lastbar_time) {\n     \
    \   // memorize the time and return true\n        last_time=lastbar_time;\n  \
    \      return(true);\n    }\n    // if we passed this line, then the bar is not\
    \ new; return false\n    return(false);\n}\n```\n\n让我们使用一个函数来帮助可视化策略的入点。此函数基本上会构建图形对象（垂直线）。每当机器人执行逻辑条件（触发激活）时，图上将绘制一条垂直线，其名称和颜色对应警告类型。\n\
    \n```\n//--- FUNCTIONS TO ASSIST IN THE VISUALIZATION OF THE STRATEGY\n//---\n\
    void drawVerticalLine(string name, datetime dt, color color = clrAliceBlue) {\n\
    \    ObjectDelete(0,name);\n    ObjectCreate(0,name,OBJ_VLINE,0,dt,0);\n    ObjectSetInteger(0,name,OBJPROP_COLOR,color);\n\
    }\n```\n\n`drawVerticalLine()` 函数有四个输入变量。MQL5 允许函数的最后一个输入变量带有默认值。请参考变量 `color\
    \ = clrAliceBlue` 的情况。这意味着如果用户没有设置特定颜色，`clrAliceBlue` 将自动分配给变量。因此，用户没有义务为此类变量赋值。然而，为其他变量输入值是强制性的。\n\
    \n现在让我们为 EA 创建一个最重要的函数之一。它们是发送订单的函数。\n\n我们需要在每次触发启动时发送买入或卖出订单。在 MQL 中，我们可以通过不同的方式执行这种发送。我们可以使用一个名为\
    \ `CTrade` 的特定类来处理订单的处理和发送。然而，这里我们选择使用必要的汇编结构 (`MqlTradeRequest`) 并发送响应 (`MqlTradeResult`)。\n\
    \n`MqlTradeRequest` 用于执行交易操作的所有交易请求。它包含了执行交易交易所需的所有字段。\n\n```\nstruct MqlTradeRequest\
    \ {\n  ENUM_TRADE_REQUEST_ACTIONS action; // Trade operation type\n  long magic;\
    \         // Expert ID (magic number)\n  long order;         // Order ticket\n\
    \  string symbol;      // Trade symbol\n  double volume;      // Requested volume\
    \ for the deal in lots\n  double price;       // Price\n  double stoploss;   \
    \ // Stop loss of the order\n  double takprofit; // Take profit\n  int deviation;\
    \     // Price deviation from the requested price\n  ENUM_ORDER_TYPE_FILLING type;\
    \ // Order type\n  ENUM_ORDER_TYPE_TIME filling; // Order execution type\n  long\
    \ time;          // Order execution time (for the orders ORDER_TIME_SPECIFIED\
    \ type)\n  string comment;     // Order comment\n};\n```\n\n`MqlTradeResult` 用于任何交易操作。声明此此变量可以访问交易请求的结果。\n\
    \n```\nstruct MqlTradeResult {\n  uint code;           // Operation return code\n\
    \  long deal;           // Deal ticket, if it is performed\n  long order;    \
    \      // Order ticket, if it is placed\n  double deal;        // Deal price,\
    \ confirmed by broker\n  double price;       // Current price\n  double asr; \
    \        // Current ask price\n  string comment;     // Comment to operation (by\
    \ default it is filled by the operation description)\n};\n```\n\n通过这些结构，我们可以界定我们感兴趣的订单类型，并指定其细节。请求和响应变量可以使用在名为\
    \ `OrderSend()` 的订单发送函数中。\n\n下面是一个创建用于以 FOK 成交类型（立即成交或取消，完全成交订单大小）发送市价买入订单的函数：\n\
    \n```\n// BUY TO MARKET\nbool BuyMarket() {\n   MqlTradeRequest request;\n   MqlTradeResult\
    \ response;\n   ZeroMemory(request);\n   ZeroMemory(response);\n   MqlTick tick;\n\
    \   if(!SymbolInfoTick(_Symbol, tick)) return false;\n   request.action = TRADE_ACTION_DEAL;\n\
    \   request.magic = 12345;\n   request.symbol = _Symbol;\n   request.volume =\
    \ 0.1;\n   request.price = tick.ask;\n   request.stoploss = NormalizeDouble(tick.ask\
    \ - 100, _Digits);\n   request.takprofit = NormalizeDouble(tick.ask + 100, _Digits);\n\
    \   request.deviation = 10;\n   request.type = ORDER_TYPE_BUY;\n   request.filling\
    \ = ORDER_FILLING_FOK;\n   request.comment = \"Buy Order\";\n   if(OrderSend(request,\
    \ response) == 10000) {\n      Print(\"Order Buy executed successfully!\");\n\
    \   } else {\n      Print(\"Error sending Order to Buy. Error = %d\", GetLastError());\n\
    \   }\n   ResetLastError();\n   return true;\n}\n```\n\n选择的动作类型是我们赋值的第一个：\n\n\
    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_128_0.png)\n\n我们有多种订单类型。我们可以从以下中选择：\n\
    \n```\nrequisicao.type = ORDER_TYPE\nORDER_TYPE_BUY\nORDER_TYPE_BUY_LIMIT\nORDER_TYPE_BUY_STOP\n\
    ORDER_TYPE_BUY_STOP_LIMIT\nORDER_TYPE_CLOSE_BY\nORDER_TYPE_FILLING\nORDER_TYPE_SELL\n\
    ORDER_TYPE_SELL_LIMIT\n```\n\n## 让我们看看卖出函数：\n\n在这种情况下，我们的止损位位于买入价之上 `NormalizeDouble(tick.bid\
    \ + 100, _Digits)`，获利目标自然位于下方 `NormalizeDouble(tick.bid - 100, _Digits)`。\n\n\
    我们还需要创建两个函数，在达到用户选择的时间限制时关闭开仓订单。这是因为我们的机器人是日内交易，我们不希望持有仓位。记住确保关闭开仓订单我们有一个用户选择的“限制平仓”变量。\n\
    \n"
