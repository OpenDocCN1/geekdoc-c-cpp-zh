    ## .3. 性能图表


    在回测期间或结束后，我们可以在策略测试器中出现的“图表”标签页跟踪资金的演变。


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_151_0.png)


    之后，在回测结束时会出现一个名为“回测”的新标签页。该标签页提供了策略运行统计的摘要。在这里，我们可以看到交易利润（总利润与总亏损之间的比例）、恢复因子、回撤或收缩、总交易次数、空头头数量以及买入的盈亏、夏普比指数等。


    | 历史质量 | 91% | | 1 | |

    |---|---|---|---|

    | 柱状 | 8733 | 交易代码 | 173527 | 其他 | |

    | 初始资金 | 100.000,00 | 余额绝对回撤 | 净资产绝对最大值... | 100.00 (0%) |

    | 总净利润 | 520,00 | 余额最大回撤 | 181.18 (0.1%) | 净资产最大回撤 | 100.00 (0%) |

    | 总利润 | -625,00 | 余额相对回撤 | 0.18 (18.0%) | 净资产相对回撤 | 0.25 (25%) |

    | 总亏损 | | 0,83 | 期望暴露 (Payback) | -0.66 | 保证金水平 | 3649.16 |

    | 获利因子 | | 0,53 | 夏普比指数 | -0,07 | Z-源 | | 127 (79.50%) |

    | 恢复因子 | 1.0000 (0%) | | | -0,00 | 测试结果 | | |

    | GPHR | 1.0000 (0%) | | | 36.66 | | |

    | 总交易次数 | 160 | 空头头寸 (收益 7%) | 0 (00%) | 多头头寸 (损失 7%) | 140 (26%) |

    | 总报价 | 320 | 盈利交易 (占总数 7%) | 33 (20.6%) | 亏损交易 (占总数) | 127 (79.38%) |

    | | 最大 | | 20,00 | 交易亏损 | | -5,00 |

    | | 平均 | | 15,78 | 交易亏损 | | -4,02 |

    | | 最大 | | 3,08 (00) | 最大连续盈利 (5) | | 15 (73,00) |

    | | 最大值 | | 41,00 (3) | 连续亏损 (计数) | | -73,00 (15) |

    | | 平均 | | | 连续盈利 | 连续亏损 | | 4 |


    我们可以通过柱状图直观看到交易中入场最多的时间段、星期和月份。


    你可以跟踪盈亏的频率：按 EA 运行时间、星期几和全年月份。我们还拥有关于设置的最时间和持仓最小持续时间的信息。


    然而，正如我们所看到的，MetaTrader 5 为我们提供了对回测非常详尽的审查。


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_152_0.png)


