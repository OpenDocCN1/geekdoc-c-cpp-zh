    # 7. Backtests


    Our main interest with Expert Advisor (EA) is to have a winning strategy over
    the long term. There is that famous phrase; that nobody in the financial market
    has a crystal ball. It is no use trying to predict the future of the market, because
    unfortunately, it is impossible until the present moment.


    We need to be realistic to accept that our strategy will have ups and downs regarding
    financial returns. The 100% winning strategy is a utopia. However, it is important
    to know how good our strategy is. There is nothing better than using past data
    to gauge how it performed under various market conditions. So testing our strategy
    at past time periods is called a backtest.


    Fortunately, when it comes to backtesting MetaTrader 5 provides a collection of
    simple and useful features to extract as much information as possible from the
    performance of our EA.


