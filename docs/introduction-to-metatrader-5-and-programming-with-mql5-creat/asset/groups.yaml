  - '[PAGE 62]


    # I.3. OnInit()


    The first function executed in an EA is OnInit (). It is triggered only when we
    initialize the robot. We use this function to initialize pointers (Handles) of
    indicators, variables, as well as make previous configurations and loads of variables
    and templates.'
  - '[PAGE 63]


    # I.4. OnDeinit()


    The OnDeinit () function is called when the robot is removed from MetaTrader.
    For example, we use this function to clean indicator handles, variables, remove
    graphic and textual objects from the screen, and so on.'
  - '[PAGE 64]


    # I.5. OnTick()


    One of the most important is the OnTick() function because it is a lot of our
    programming logic is running. This function is one of the most requested by our
    robot, since it is called every time a market operation happens. At each new sell,
    buy, release and order cancellation this function is called.


    It is worth mentioning that this function is only called when we have EA within
    trading hours. That''s because only with the trading in progress is that we have
    changes in the market.


    If we are working on the development of a robot and we are not in the trading
    hours we will not see any call of this function. Alternatively, we can use the
    OnTimer() function to minimize these problems and to make tests and debugs through
    it (using the Print() function). Later in Chapter 5 we will see an example of
    using the OnTimer() function.


    It is worth highlighting that there are several other predefined functions like
    ChartEvent(), OnTrader(), OnTester(), and others. However, we will only study
    the main ones. Further details regarding these other functions can be found in
    the MetaTrader 5 documentation.'
  - '[PAGE 65]


    # I.6. Programming Accessories


    We have some elements (functions) that help us in the readability and organization
    of our robot codes.


    # I.6.1. Comments


    Commenting on our algorithms is of the utmost importance for readability and understanding
    of key steps.


    For example, we have the comment element we can represent by // or * */


    ```

    /*

    // EA_MA_Cros_IFR.mq5

    // Copyright 2018.

    // https://www.mq15.com

    */


    #property copyright "Copyright 2018."

    #property link "https://www.mq15.com"

    #property version "1.00"

    ```


    This type of structure (// causes the compiler not to interpret the characters
    they saw immediately. So we can make small reminders and explanatory comments
    to make the code clear and readable for editing by developers and even us.


    The second type of comment / * / allows you to write entire paragraphs between
    them.


    ```

    /*

    13

    14 Here I can put a comment as a paragraph. I can skip the line

    15 between these special characters

    16

    17 */

    18

    ```


    We have some shortcuts to the comments. For example, if we want to'
