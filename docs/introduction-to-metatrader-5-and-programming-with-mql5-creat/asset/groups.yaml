- md: '

    # 1. Backtest in MetaTrader


    Let''s open MetaTrader and go to the field Navigator -> **Expert Advisor** consultant
    and look for our newest EA. Once found we should right click on it and then on
    **Test.**


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_141_0.png)


    This will give us a new field in MetaTrader called **Strategy Tester**, in the
    settings tab we have the following panel of possibilities:


    | Expert | EA_MA_Cross_RSIv5 | PETR4 | M5 |

    |---|---|---|---|

    | Date custom period | 2015.01.23 | 2016.06.11 | | |

    | Forward | No | | | |

    | Execution | Without Delay | 1 minute OHLC | | |

    | Deposit | 10000 USD | 1:1 | Visualization | |

    | Optimization | Disabled | Balance index | | |

    | Testing progress: | | | | |


    With these features we will be able to choose the financial asset for the backtest:


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_142_0.png)


    ## The graphical time:


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_142_1.png)


    We have the option to choose how the **formation of our candles** simulated by
    MetaTrader.


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_142_2.png)


    For this way of generating prices in candles, let’s go to the main options most
    used:


    - **Every tick or Every tick based on real ticks**: MetaTrader tries to simulate
    real price ticks in the formation of candles. This option leaves the backtest
    more accurate, but requires more computational resources once inside a candle
    the MetaTrader tries to reproduce the formation of real ticks. It is worth noting
    that ticks are not real just a simulation (a possible representation of reality).
    This article clarifies the functioning of simulation: https://www.mql5.com/en/articles/75.

    - **1 minute OHLC**: In this type of candle formation MetaTrader generates only
    4 price values: O - open, H - High, L - Low, C - Close. This option requires fewer
    computational resources compared to the tick option.

    - **Open price only**: This is the least costly computationally, because it only
    uses a price to represent a candle.


    In our backtests we will always leave the option Forward marked No (see the figure
    below). This option is useful when we are doing strategy optimizations and want
    to use optimization methods such as Walk Forward Analysis (WFA). This type of
    study is beyond the scope of this book. If you want to know more about it, you
    can buy the other e-book (How to Properly Optimize Investment Robots in MetaTrader
    5[4]).


    | Expert | EA_MA_Cross_RSI.ex5 |

    |---|---|

    | Date: Custom period | |

    | Forward: No | 2015.01.07 |

    | Execution: Without Delay | |

    | Deposit: 10000 USD 1:1 | |

    | Optimization: Disabled | |


    The type of execution with or without Delay is interesting so we can simulate
    the conditions in which the servers are and the speed of our internet. Latency
    refers to the time required for routing orders to be properly executed.


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_144_0.png)


    We have the possibility to choose the financial from the initial deposit as well
    the possibility to leverage investments (in the case of the below 1: 1 - without
    leverage).


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_144_1.png)


    For our backtests the **Optimization** field should be disabled.


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_144_2.png)


    We should choose the data period for the backtest.


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_145_0.png)


    And check the option to view the backtest:


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_145_1.png)


    Let''s now go to the **Input** (Parameters) tab of the Strategy Tester.


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_146_0.png)


    In this field we can put the setup necessary for the realization of our backtests.
    At the moment, what interests us is is just the Value column, highlighted in low
    red. The other columns (highlighted in green) are used as parameters for EA optimization.


    | | Value | Start | Step | Step |

    |---|---|---|---|---|

    | -Strategy- | | Only moving averages | Only moving averages | moving averages
    plus... |

    | -Moving Average- | | | 1 | 120 |

    | Fast Moving Average Period | | 32 | 1 | 120 |

    | Slow Moving Average Period | | 32 | 1 | 1 Month |

    | Graphic Time | | current | | | Linear weighted |

    | Price Applied | | Close price | Close price | | Weighted price |

    | RSI Period | | current | | | 50 |

    | Graphic Time | | Close price | Close price | | 1 Month |

    | Level Overbought | | 70 | | | Weighted price |

    | Level Oversold | | 30 | | | 700 |


    In the **Agents** tab we have information regarding the computational power of
    the machine we are using to do the backtests and optimizations. A backtest is
    usually computationally inexpensive. However, when we are doing optimizations
    (many backtests are required) we will need a lot of resources and therefore this
    **Agents** tab will be important to us.


    We can make a log to use multiple cores in the cloud and thus increase our power.
    The use of these extra cores is very affordable. With a few dollars we can make
    hundreds of thousands of optimizations. After setting the parameters correctly
    for the backtest, simply go back to Settings tab and hit the Start button.


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_147_0.png)


    # 2. Analyzing the Backtest


    As soon as you press the Start button, the following window appears:


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_148_0.png)


    So we have a screen to visualize what is happening with the backtest. We can control
    the speed with which new candles (candles) appear, from the highlighted (red)
    of the figure above. You can also have the prices of each candle and indicator
    (green), just place the mouse over the desired element on the screen. In the Toolbox
    we have four tabs (Trading, History, Operations and Journal) where we can track
    records regarding our trades of our EA.


    In the **Toolbox** in the **Operations** tab we follow with each of sales and
    purchase operations. Something useful is that we can give two clicks on some of
    this operation and the graph will automatically show the operation in question.
    The Toolbox history shows a bit more. We can quickly see profitable (green) and
    loss (red) operations from highlights.


    | Time | Order | Asset | Type | Direction | Price | S/L | T/P | Gained | Comment
    |

    |---|---|---|---|---|---|---|---|---|

    | 2023-03-18 17:48:09 | | | sell | 100.00 | 100.00 | | | |

    | 2023-03-18 16:25:40 | | | buy | 100.00 | 17.05 | 17.25 | | |

    | 2023-03-18 15:43:20 | | | buy | 100.00 | 16.00 | 18.03 | | |

    | 2023-03-18 11:45:00 | | | buy | 100.00 | 17.12 | 17.47 | | |

    | 2023-03-18 09:22:15 | | | sell | | | | | | -1.00 |


    Finally, the Operation tab shows the progress of each particular negotiation.
    We have the information regarding the entry price, our available margin and how
    the trade is progressing, whether with gain or loss.


    | Time | Order | Asset | Type | Direction | Volume | Price | S/L | T/P | Gained
    | Comment |

    |---|---|---|---|---|---|---|---|---|---|

    | 2023-03-18 13:50:40 | | | wait | | 18.35 | | | Filled | 18.35 |

