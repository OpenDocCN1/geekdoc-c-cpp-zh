  - "[PAGE 107]\n\n# 5.6. Adding MQL5 Indicators\n\nLet us now turn to one of the\
    \ most common and important practices when the goal is to plan an investment strategy.\
    \ It is very likely that your investment strategy will make use of some indicator,\
    \ so let's learn how to call indicators from the MQL5 language.\n\nInitially,\
    \ we need to declare the variables for our indicator. How we will declare variables\
    \ will depend greatly on the type and functioning of the indicator.\n\nThere are\
    \ indicators that provide only one output of information, such as a moving average.\
    \ From the moving average we have only one output of information which is the\
    \ value of the moving average calculated for a specific point in the graph. In\
    \ this case we say that the moving average has only one memory buffer. Every indicator\
    \ needs at least one Handle and it must be an integer type.\n\n```\n//--- Moving\
    \ Averages\nint ma_Handle; // Handle Moving Average\ndouble ma_Buffer[]; // Buffer\
    \ Moving Average\n/*\n//+ Expert initialization function\n//*/\nint OnInit()\n\
    {\n    ma_Handle = iMA(Symbol,Period,7.0,MODE_EMA,PRICE_CLOSE);\n\n    if(ma_Handle<0)\n\
    \    {\n        Alert(\"Error trying to create Handles for indicator error: \"\
    +GetLastError(),\"!**\");\n        return(-1);\n    }\n\n    // To add the indicator\
    \ to the chart:\n    ChartIndicatorAdd(0,0,ma_Handle);\n\n    return(INIT_SUCCEEDED);\n\
    }\n```\n\nThe declaration of the moving average indicator is given by a function\
    \ of MQL5 (**iMA**) with a F1 in this function we obtain:"
- md: "\n# MQL5 Reference\n\nMQL5 Reference / Technical Indicators / IMA\n\nType in\
    \ a request to look for:\n\n# IMA\n\nThe function returns the handle of the Moving\
    \ Average Indicator. It has one buffer.\n\n```\nint    symbol;               \
    \ // symbol name\nint    TIMEFRAMES;         // period\nint    price;        \
    \        // averaging period\nint    MQL_MA_METHOD;      // method\nint    MQL_APPLIED_PRICE;\
    \  // type of price or handle\nhint    handle;\n```\n\nParameters\n\n-   [symbol]\
    \ The name of the security, the data of which should be used to calculate the\
    \ indicator. The value means the current symbol.\n\nperiod\n\nIn our case we are\
    \ using a moving average period of 7 with the simple smoothing type (MODE_SMA)\
    \ applied to the closing price (PRICE_CLOSE). It is good to point out, once again,\
    \ that each indicator has its own structure of parameters necessary for its proper\
    \ functioning.\n\nIt is always good to point codes to evaluate possible variable\
    \ loading errors. In our case we added an Alert() if we have problems with the\
    \ variable 'mm_Handle'. We did this because the correct functioning of this variable\
    \ is extremely important to our robot strategy. However, the practice of evaluating\
    \ the loading of variables is always welcome.\n\nThe same procedure can be done\
    \ for the i RSI indicator.\n\nWe made the initial statement and addition of the\
    \ indicator on the chart with the function ChartIndicatorAdd(0,0,mm_Handle). Now\
    \ we should point 'mm_Handle' to the vector of 'mm_Buffer[]' which is where we\
    \ will access the values of our moving average.\n\nTo do this within the OnTick()\
    \ function we must call the CopyBuffer() function.\n\n```\n//++-\n// Expert tick\
    \ function\n//++-\nvoid OnTick()\n{\n    // Copy a three-dimensional data vector\
    \ to Buffer\n    CopyBuffer(ma_Handle, 0,0,3,ma_Buffer);\n\n    // Sort the data\
    \ vector:\n    ArraySetAsSeries(ma_fast_Buffer,true);\n}\n```\n\nWe can understand\
    \ the the structure of CopyBuffer() as follows:\n\n![](img/6d863e70ea1a0ecdc703a17721d7e78b_109_0.png)\n\
    \nNow let's add the RSI indicator. This indicator also has only a single Buffer.\
    \ If you are in doubt regarding the number of buffers of each indicator simply\
    \ go to the documentation from the F1 key and look for #property indicator_buffers:\n\
    \n![](img/6d863e70ea1a0ecdc703a17721d7e78b_109_1.png)\n\nIt follows the code with\
    \ the addition of the two indicators (moving average and RSI). Note that the (iRSI)\
    \ function of the RSI indicator has input parameters that are very different from\
    \ the iMA () function:\n\n```\n//--- Moving Averages\nint ma_Handle;      // Handle\
    \ Moving Average\ndouble ma_Buffer[]; // Buffer Moving Average\n\n//--- RSI\n\
    int rsi_Handle;     // Handle for RSI\ndouble rsi_Buffer[];  // Buffer for RSI\n\
    \n//| Expert initialization function\nint OnInit()\n{\n    int ma_Handle = IMA(Symbol,\
    \ Period, 7, NODE_EMA, PRICE_CLOSE);\n    double rsi_Buffer = iRSI(Symbol, Period,\
    \ 3, PRICE_CLOSE);\n    if (ma_Handle<0 || rsi_Handle<0)\n    {\n        Alert(\"\
    Error trying to create Handles for indicator - error: \" + GetLastError(),\"!\"\
    );\n        return(-1);\n    }\n    // To add the indicator to the chart:\n  \
    \  ChartIndicatorAdd(0,0,ma_Handle);\n    ChartIndicatorAdd(0,1,rsi_Handle);\n\
    \    return(INIT_SUCCEEDED);\n}\n\n//| Expert deinitialization function\nvoid\
    \ OnDeinit(const int reason)\n{\n    IndicatorRelease(ma_Handle);\n    IndicatorRelease(rsi_Handle);\n\
    }\n```\n\n```cpp\n53 //+------------------------------------------------+\n54\
    \ //| Expert tick function\n55 //+------------------------------------------------+\n\
    56 void OnTick() {\n57 {\n58 //+------------------------------------------------+\n\
    59     // Copy a three-dimensional data vector to Buffer\n60 CopyBuffer(ma_Handle,0,0,3,ma_Buffer);\n\
    61 CopyBuffer(rsi_Handle,0,0,3,rsi_Buffer);\n62 \n63 // Sort the data vector:\n\
    64 ArraySetAsSeries(ma_fast_Buffer,true);\n65 ArraySetAsSeries(rsi_Buffer,true);\n\
    66 \n67 Print(\"ma_Buffer = \", ma_Buffer[0]);\n68 Print(\"rsi_Buffer = \", rsi_Buffer[0]);\n\
    69 Print(\"===============================================\");\n70 \n71 }\n```\n\
    \nFinally, we are fully equipped with the minimum information necessary to start\
    \ programming our investment robot. Let's go to the next chapter!\n\n# Chapter\
    \ 6\n\n## b. Programming the EA\n\nNow that we know the main functionality of\
    \ MetaTrader, we have already understood the basics of the features of the MQL5\
    \ language and the use of MetaEditor we are minimally prepared to start developing\
    \ our investment robot (Expert Advisor - EA).\n\nBefore starting to program, let\
    \ us know and understand the details of our EA strategy.\n\n### i.1. Strategy\
    \ overview\n\nOur EA strategy will use moving averages and RSI. In a trending\
    \ market, we will use the moving averages to identify the direction. In a lateral\
    \ market, we will use the RSI to identify overbought and oversold conditions.\n\
    \nThe user can choose among the options to enter the traders if they come from\
    \ the moving averages plus the RSI, only moving averages or only the RSI.\n\n\
    ### i.1.1. Moving Averages\n\nFirst we have the fast average and the slow average.\
    \ The fast average is the one with the shortest period, on the other hand the\
    \ slow average should have the longest period. We give these names to averages\
    \ because fast averages have shorter periods and move faster than those of longer\
    \ periods. Let's look at an illustrative diagram of how these triggers work:\n\
    \n### i.1.2.Relative Strength Index (RSI)\n\nO indicador RSI (Relative Strength\
    \ Index) no MetaTrader se refere a Oscillator, ou seja, é útil para indicar posições\
    \ de sobrecompra e revenda. We will not go into detail the calculations behind\
    \ the RSI because it is not the goal at the moment. The figure below shows the\
    \ RSI and two main levels (solid lines) at 30 and 70. Each of these lines represents\
    \ the levels overbought (70) and oversold (30). In other words, in a consolidated\
    \ market, when the RSI is equal to or greater than line 70, it can be a reversal\
    \ warning, warning overbought, that it is a good time to make a sale. On the other\
    \ hand, if the RSI, once again in a consolidated market, is less than equal to\
    \ line 30, we are in an oversold region indicating a good time to buy.\n\nIn our\
    \ EA we will leave those levels of 70 (overbought) and 30 (oversold) possible\
    \ to be changed by the user. So you can choose more loose restrictive levels for\
    \ the kittens to buy and sell. Let's now set an example where the trigger levels\
    \ to buy are at line 30 and the trigger to sell is at line 70:\n\nLet us, therefore,\
    \ to a summary of the strategy with the elements that we will need to program\
    \ for our EA:\n\n1. We must add two moving averages (fast and slow) both with\
    \ the possibility of choosing the period, the average application price and the\
    \ average method used.\n2. We must add the RSI indicator with the possibility\
    \ of period choice, applied price, and oversold and oversold levels.\n3. The user\
    \ can choose among the options to enter the traders if they come from the moving\
    \ averages plus the RSI, only moving averages or only the RSI.\n\nNow that we\
    \ know the operation to buy and sell for our two indicators (crossing of averages\
    \ and RSI) we are ready to start developing the algorithm with the presented strategy.\n"
  mdcn: "\n\n# MQL5 参考文档\n\nMQL5 参考 / 技术指标 / IMA\n\n输入请求以查找：\n\n# IMA\n\n该函数返回移动平均指标的句柄。它有一个缓冲区（buffer）。\n\
    \n```\nint    symbol;                // 符号名称\nint    TIMEFRAMES;         // 周期\n\
    int    price;                // 平均周期\nint    MQL_MA_METHOD;      // 方法\nint  \
    \  MQL_APPLIED_PRICE;  // 价格类型或句柄\nhint    handle;\n```\n\n参数\n\n-   [symbol]\
    \ 安全性名称，使用其数据来计算指标。该值表示当前符号。\n\nperiod\n\n在我们的案例中，我们使用了周期为 7 的移动平均，并应用简单平滑类型 (MODE_SMA)\
    \ 到收盘价 (PRICE_CLOSE)。再次强调的是，每个指标都有其正常运行所需的特定参数结构。\n\n在代码中加入代码以评估可能的变量加载错误总是友好的。在我们的案例中，如果变量\
    \ 'mm_Handle' 出现问题，我们添加了 `Alert()`。这样做是因为该变量的正确运行对我们的机器人策略至关重要。然而，评估变量加载情况的习惯总是受到欢迎的。\n\
    \n对 i RSI 指标也可以执行相同的步骤。\n\n我们使用 `ChartIndicatorAdd(0,0,mm_Handle)` 函数进行了初始声明并将指标添加到图表上。现在，我们需要将\
    \ 'mm_Handle' 指向 'mm_Buffer[]' 向量，我们将从那里访问移动平均值。\n\n要在 `OnTick()` 函数中实现这一点，我们必须调用\
    \ `CopyBuffer()` 函数。\n\n```\n//++-\n// 专家分时函数\n//++-\nvoid OnTick()\n{\n    //\
    \ 将三维数据向量拷贝到缓冲区\n    CopyBuffer(ma_Handle, 0,0,3,ma_Buffer);\n\n    // 排序数据向量：\n\
    \    ArraySetAsSeries(ma_fast_Buffer,true);\n}\n```\n\n我们可以这样理解 `CopyBuffer()`\
    \ 的结构：\n\n![](img/6d863e70ea1a0ecdc703a17721d7e78b_109_0.png)\n\n现在让我们来添加 RSI\
    \ 指标。该指标也只有一个缓冲区。如果你对每个指标的缓冲区数量有疑问，只需按 F1 键查看文档并查找 `#property indicator_buffers`：\n\
    \n![](img/6d863e70ea1a0ecdc703a17721d7e78b_109_1.png)\n\n以下是添加两个指标（移动平均和 RSI）的代码。注意，RSI\
    \ 指标的 `(iRSI)` 函数的输入参数与 `iMA()` 函数非常不同：\n\n```\n//--- 移动平均线\nint ma_Handle;  \
    \    // 移动平均句柄\ndouble ma_Buffer[]; // 移动平均缓冲区\n\n//--- RSI\nint rsi_Handle; \
    \    // RSI 句柄\ndouble rsi_Buffer[];  // RSI 缓冲区\n\n//| 专家初始化函数\nint OnInit()\n\
    {\n    int ma_Handle = IMA(Symbol, Period, 7, NODE_EMA, PRICE_CLOSE);\n    double\
    \ rsi_Buffer = iRSI(Symbol, Period, 3, PRICE_CLOSE);\n    if (ma_Handle<0 || rsi_Handle<0)\n\
    \    {\n        Alert(\"创建指标句柄出错 - 错误代码: \" + GetLastError(),\"!\");\n       \
    \ return(-1);\n    }\n    // 将指标添加到图表上：\n    ChartIndicatorAdd(0,0,ma_Handle);\n\
    \    ChartIndicatorAdd(0,1,rsi_Handle);\n    return(INIT_SUCCEEDED);\n}\n\n//|\
    \ 专家去初始化函数\nvoid OnDeinit(const int reason)\n{\n    IndicatorRelease(ma_Handle);\n\
    \    IndicatorRelease(rsi_Handle);\n}\n```\n\n```cpp\n53 //+------------------------------------------------+\n\
    54 //| 专家分时函数\n55 //+------------------------------------------------+\n56 void\
    \ OnTick() {\n57 {\n58 //+------------------------------------------------+\n\
    59     // 将三维数据向量拷贝到缓冲区\n60 CopyBuffer(ma_Handle,0,0,3,ma_Buffer);\n61 CopyBuffer(rsi_Handle,0,0,3,rsi_Buffer);\n\
    62 \n63 // 排序数据向量：\n64 ArraySetAsSeries(ma_fast_Buffer,true);\n65 ArraySetAsSeries(rsi_Buffer,true);\n\
    66 \n67 Print(\"ma_Buffer = \", ma_Buffer[0]);\n68 Print(\"rsi_Buffer = \", rsi_Buffer[0]);\n\
    69 Print(\"===============================================\");\n70 \n71 }\n```\n\
    \n最后，我们已经完全具备开始编写投资机器人所需的最小信息。让我们进入下一章！\n\n# 第 6 章\n\n## b. 编写 EA\n\n现在我们已经知道了\
    \ MetaTrader 的主要功能，并理解了 MQL5 语言特征的基础以及 MetaEditor 的使用，我们已经做好了基本的准备，开始开发我们的投资机器人（专家交易系统\
    \ - EA）。\n\n在开始编程之前，让我们了解并理解我们 EA 策略的细节。\n\n### i.1. 策略概述\n\n我们的 EA 策略将使用移动平均线和\
    \ RSI。在趋势市场中，我们将使用移动平均线来识别方向。在横盘市场中，我们将使用 RSI 来识别超买和超卖状态。\n\n用户可以在以下选项中选择交易信号来源：基于移动平均线加\
    \ RSI、仅基于移动平均线或仅基于 RSI。\n\n### i.1.1. 移动平均线\n\n首先我们有快平均线和慢平均线。快平均线是周期最短的那个；相反，慢平均线应该具有最长的周期。我们之所以命名为平均线是因为快平均线的周期较短，移动速度比长周期的快。让我们看看这些触发器如何工作的示意图：\n\
    \n### i.1.2. 相对强度指数 (RSI)\n\nMetaTrader 中的 RSI 指标（相对强度指数）指的是震荡器，也就是说，它对于指示超买和超卖位置很有用。我们不会详细介绍\
    \ RSI 背后的计算，因为这不是目前的目标。下图显示了 RSI 以及位于 30 和 70 的两个主要水平（实线）。这些线中的每一条都代表了超买（70）和超卖（30）水平。换句话说，在震荡整合市场中，当\
    \ RSI 等于或大于 70 线时，它可能是一个反转警告，警告超买，这是一个卖出的好机会。相反，如果 RSI 再次在震荡市场中小于或等于 30 线，我们处于超卖区域，表示买入的好时机。\n\
    \n在我们的 EA 中，我们将允许用户更改 70（超买）和 30（超卖）这些水平。这样你可以为买入和卖出选择更宽松的限制水平。现在让我们设定一个例子，买入触发水平在\
    \ 30 线，卖出触发水平在 70 线：\n\n因此，我们对为 EA 编写所需的策略元素进行总结：\n\n1. 我们必须添加两条移动平均线（快线和慢线），两者都允许选择周期、平均应用价格和所使用的平均方法。\n\
    2. 我们必须添加 RSI 指标，并允许选择周期、应用价格以及超卖和超买水平。\n3. 用户可以在以下选项中选择交易信号来源：基于移动平均线加 RSI、仅基于移动平均线或仅基于\
    \ RSI。\n\n现在我们已经知道了这两个指标（均线交叉和 RSI）的买卖操作方法，我们准备好根据所提出的策略开始开发算法了。\n\n"
