    \ 除法\n29 double varF = 5 / 2;      // 结果: 2.5\n30 int\n31 varG = 5 / 2;      \
    \      // 结果: 2\n32\n```\n\n语言本身已经带了一系列数学和统计函数，用于处理各种操作。我们拥有以 MathXXX 开头的非常实用的函数：\n\
    \n```cpp\n13 Math\n14 MathAbs\n15 MathArccos\n16 MathArccosh\n17 MathArcsin\n\
    18 MathArcsinh\n19 MathArctang\n20 MathArctan\n21 MathArctanh\n22 MathCeil\n23\n\
    24\n```\n\n## s.11. 逻辑与条件关系\n\n在算法算法结构中，我们经常使用返回真或假值的逻辑关系。我们将处理的主要关系在 MQL5 中的表示方式如下：\n\
    \n```cpp\n54 A > B // 大于\n55\n56 A < B // 小于\n57\n58 A >= B // 大于等于\n59\n60 A\
    \ <= B // 小于等于\n61\n62 A == B // 等于\n63\n64 A != B // 不等于\n```\n\n查看条件结合逻辑连接符\
