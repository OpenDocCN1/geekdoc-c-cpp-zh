    \ 开头。\n\n最常用且我们将在创建第一个 EA（自动交易系统）时应用的变量是：\n\n- _Symbol：代表屏幕上显示的当前图表的金融资产符号。\n\
    - _Period：指当前 K 线图的周期（以分钟为单位）。\n- _Point：代表表征金融资产的最小点大小。\n- _Digits：代表当前资产的小数点位数。\n\
