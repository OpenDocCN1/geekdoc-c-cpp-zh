    # 1. MetaEditor MQL5


    The language MQL5 (MetaQuotes Language 5) has a large number of useful functions
    to analyze the prices of financial assets. We need to know these functions so
    that we do not recreate the wheel. But before it, is important to know as much
    as possible of our language programming environment (MetaEditor).'
- md: "\n## I.1. MetaEditor\n\nMetaEditor is an Integrated Development Environment\
    \ (IDE) for the MQL5 language that is included in MetaTrader 5. Let us now know\
    \ the main features of developments offered by MetaEditor.\n\nTo open MetaEditor\
    \ we must click the highlighted icon in the image below or press the F4 shortcut.\n\
    \n![](img/6d863e70ea1a0ecdc703a17721d7e78b_57_0.png)\n\nAfter clicking on the\
    \ icon for MetaEditor we will have a development environment with three main areas\
    \ that will assist us in the development of our codes.\n\n![](img/6d863e70ea1a0ecdc703a17721d7e78b_58_0.png)\n\
    \n**Area 1:** Navigator - where we will manage our code library archives and libraries\
    \ in development.\n\n**Area 2:** Window where the codes are properly typed.\n\n\
    **Area 3:** Toolbox - here is where we will follow the development of our compilation\
    \ and debugging tests. We have 6 tabs (Errors, Search, Articles, Code Base, Public\
    \ Projects and Journal). Basically, for the creation of our algorithms we will\
    \ only use the Errors and Journal tabs.\n\n![](img/6d863e70ea1a0ecdc703a17721d7e78b_58_1.png)\n\
    \n## I.2. Creating a new Project\n\nLet's click the **New** icon and then choose\
    \ from the MQL5 wizard the type of project that we want to create.\n\n![](img/6d863e70ea1a0ecdc703a17721d7e78b_59_0.png)\n\
    \nWe can notice that we have several design options. This **Wizard** even allows\
    \ us to create investment robots without programming knowledge. Of course in this\
    \ case we will be blind to most of the steps and we will hardly do anything with\
    \ confidence and due security.\n\nAs this ebook intends to provide the first steps\
    \ with the MQL5 tool we will only have the first option **Expert Advisor** (model).\
    \ There are two other ebooks - from the same author that show you how to develop\
    \ Indicator and Scripts codes.\n\nLet's first name our investment robot (Expert\
    \ Advisor). We'll call it **EA_MA_Cros_RSI** (Expert Advisor of Moving Moving\
    \ Crosses with the RSI Indicator). This is just a temporary name for MetaEditor\
    \ presentation.\n\n### MQL Wizard - File\n\nGeneral properties of the Expert Advisor\n\
    Please specify general properties of the Expert Advisor.\n\n| Name | Type | Initial\
    \ value |\n| --- | --- | --- |\n| ExpertEA_MA_Paz_RSI | | |\n| Author | Copyright\
    \ 2016, MetaQuotes Software Corp. | | |\n| link | https://www.mql5.com | | |\n\
    | Parameters | | |\n\nWatch how to assemble a trading robot\n\n### Event handlers\
    \ of the Expert Advisor\nPlease select event handlers of the Expert Advisor.\n\
    \n- OnTrade: The function is called when the Trade event occurs.\n- OnTradeTransaction:\
    \ The function is called when the TradeTransaction event occurs.\n- OnTimer: The\
    \ OnTimer function is called when the Timer event occurs.\n- OnChartEvent: The\
    \ OnChartEvent is the handler of a group of ChartEvent events.\n- OnDeinit: It\
    \ is generated for Expert Advisors only when Depth of Market changes.\n\nWatch\
    \ how to assemble a trading robot\n\n### MQL Wizard - File\n\nTester event handlers\
    \ of the Expert Advisor\nPlease select the tester event handlers of the Expert\
    \ Advisor.\n\n- OnTester: The OnTester function is called when the Tester event\
    \ occurs.\n- OnTesterInit: The OnTesterInit function is called when the TesterInit\
    \ event occurs.\n- OnTesterPass: The OnTesterPass function is the handler of the\
    \ TesterPass event.\n- OnTesterDeinit: The OnTesterDeinit is the handler of the\
    \ TesterDeinit event.\n\nWatch how to assemble a trading robot\n\nAfter clicking\
    \ Finish the MQL5 Wizard creates us for the basic body required for the development\
    \ of any investment robot. Therefore, we already have a divided structure with\
    \ the main methods for the operation of an EA.\n\n```cpp\n//+------------------------------------------------------------------+\n\
    //| EA Cross RSI.mq5\n//| Copyright 2018, MetaQuotes Software Corp.\n//| https://www.mqql5.com\n\
    //+------------------------------------------------------------------+\n#property\
    \ copyright \"Copyright 2018, MetaQuotes Software Corp.\"\n#property link \"https://www.mqql5.com\"\
    \n#property version \"1.00\"\n//+------------------------------------------------------------------+\n\
    // Expert initialization function\nint OnInit()\n{\n    return(INIT_SUCCEEDED);\n\
    }\n//+------------------------------------------------------------------+\n//\
    \ Expert deinitialization function\nvoid OnDeinit(const int reason)\n{\n\n}\n\
    //+------------------------------------------------------------------+\n// Expert\
    \ tick function\nvoid OnTick()\n{\n\n}\n```\n\n![](img/6d863e70ea1a0ecdc703a17721d7e78b_61_0.png)\n\
    \n![](img/6d863e70ea1a0ecdc703a17721d7e78b_61_1.png)\n\n![](img/6d863e70ea1a0ecdc703a17721d7e78b_61_2.png)\n\
    \nThe structure of an EA, for its proper functioning, will always contain at least\
    \ these three functions or methods: OnInit(), OnDeinit() and OnTick().\n\n## I.3.\
    \ OnInit()\n\nThe first function executed in an EA is OnInit(). It is triggered\
    \ only when we initialize the robot. We use this function to initialize pointers\
    \ (Handles) of indicators, variables, as well as make previous configurations\
    \ and loads of variables and templates.\n\n## I.4. OnDeinit()\n\nThe OnDeinit()\
    \ function is called when the robot is removed from MetaTrader. For example, we\
    \ use this function to clean indicator handles, variables, remove graphic and\
    \ textual objects from the screen, and so on.\n\n## I.5. OnTick()\n\nOne of the\
    \ most important is the OnTick() function because it is a lot of our programming\
    \ logic is running. This function is one of the most requested by our robot, it\
    \ is called every time a new price comes. It is worth mentioning that this function\
    \ is only called during trading hours.\n\nIt is worth highlighting that there\
    \ are several predefined functions like ChartEvent(), Tester(), and others. However,\
    \ we will only study the main ones. Further details regarding these functions\
    \ can be found in the MetaTrader documentation.\n\n## I.6. Programming Accessories\n\
    \nWe have some elements (functions) that help us in the readability and organization\
    \ of our robot codes.\n\n### I.6.1. Comments\n\nCommenting on our algorithms is\
    \ of utmost importance for readability and understanding.\n\nFor example, we have\
    \ the comment element we can represent by // or /* */\n\n```cpp\n/*\n// EA_MA_Cros_RSI.mq5\n\
    // Copyright 2018, MetaQuotes Software Corp.\n// https://www.mqql5.com\n*/\n\n\
    #property copyright \"Copyright 2018.\"\n#property link \"https://www.mqql5.com\"\
    \n#property version \"1.00\"\n```\n\nThis type of structure (// causes the compiler\
    \ not to interpret the characters they saw immediately). So we can make small\
    \ reminders and explanatory comments to make the code clear and readable for editing\
    \ by developers and even us.\n\nThe second type of comment /* */ allows you to\
    \ write entire paragraphs between them.\n\n```cpp\n/*\n13\n14 Here I can put a\
    \ comment as a paragraph. I can skip the line\n15 between these special characters\n\
    16 */\n```\n\nWe have some shortcuts to the comments. For example, if we want\
    \ to comment several lines we can make the selection of them and press (Ctrl +\
    \ ~). To remove the comments, simply select and press (Ctrl + ~).\n\n```cpp\n\
    //+--------------------------------\n//property copyright \"Copyright 2018.\"\n\
    //property link \"https://www.mqql5.com\"\n//property version \"1.0\"\n//----------------\n\
    ```\n\nThe shortcut (Ctrl + .) Lets you create the following annotated string.\
    \ This is useful for separating large sections of code.\n\n```cpp\n//--------------------------------\n\
    //|                               |\n//|                               |\n//--------------------------------\n\
    ```\n\nThe shortcut (Ctrl +;) lets you create a small separation with the following\
    \ strings:\n\n![](img/6d863e70ea1a0ecdc703a17721d7e78b_66_0.png)\n"
  mdcn: "\n\n## I.1. MetaEditor\n\nMetaEditor 是 MQL5 语言的集成开发环境（IDE），包含在 MetaTrader\
    \ 5 中。现在让我们了解 MetaEditor 提供的主要功能。\n\n要打开 MetaEditor，我们必须点击下方图中高亮的图标或按下 F4 快捷键。\n\
    \n![](img/6d863e70ea1a0ecdc703a17721d7e78b_57_0.png)\n\n点击 MetaEditor 图标后，我们将拥有包含三个主要区域的开发环境，这些区域将协助我们编写代码。\n\
    \n![](img/6d863e70ea1a0ecdc703a17721d7e78b_58_0.png)\n\n**区域 1：** 导航器（Navigator）\
    \ - 我们在这里管理代码库存档和开发中的库。\n\n**区域 2：** 窗口（Window） - 输入代码的地方\n\n**区域 3：** 工具箱（Toolbox）\
    \ - 我们在这里跟踪编译和调试测试进度。我们有 6 个标签页（错误、搜索、文章、代码库、公共项目和日志）。基本上，在创建我们的算法时，我们只会使用“错误”和“日志”标签页。\n\
    \n![](img/6d863e70ea1a0ecdc703a17721d7e78b_58_1.png)\n\n## I.2. 创建新项目\n\n点击**新建**（New）图标，然后从\
    \ MQL5 向导中选择我们想要创建的项目类型。\n\n![](img/6d863e70ea1a0ecdc703a17721d7e78b_59_0.png)\n\
    \n我们可以注意到有多种设计选项。这个**向导**（Wizard）甚至允许我们在在没有编程知识的情况下创建投资机器人。当然，在这种情况下，我们对大多数步骤将一无所知，而且很难自信且安全地进行任何操作。\n\
    \n由于本电子书旨在提供使用 MQL5 工具的第一步，我们只会有第一个选项**专家顾问**（Expert Advisor，模型）。还有两本由同一作者编写的电子书将向你展示如何开发指标（Indicator）和脚本（Scripts）代码。\n\
    \n让我们先给我们的投资机器人（专家顾问）命名。我们将其称为 **EA_MA_Cros_RSI**（带有 RSI 指标的均线交叉专家顾问）。这只是用于 MetaEditor\
    \ 演示的临时名称。\n\n### MQL 向导 - 文件\n\n专家顾问的通用属性\n请指定专家顾问的通用属性。\n\n| 名字 (Name) | 类型\
    \ (Type) | 初始值 (Initial value) |\n| --- | --- | --- |\n| ExpertEA_MA_Paz_RSI |\
    \ | |\n| 作者 (Author) | Copyright 2016, MetaQuotes Software Corp. | | |\n| link\
    \ | https://www.mql5.com | | |\n| 参数 (Parameters) | | |\n\n查看如何组装交易机器人\n\n###\
    \ 专家顾问的事件处理器\n请选择专家顾问的事件处理器。\n\n- OnTrade: 当交易事件发生时，调用该函数。\n- OnTradeTransaction:\
    \ 当交易事务事件发生时，调用该函数。\n- OnTimer: 当定时器事件发生时，调用 OnTimer 函数。\n- OnChartEvent: OnChartEvent\
    \ 是一组图表事件（ChartEvent）的处理器。\n- OnDeinit: 仅当市场深度（Depth of Market）变化时，为专家顾问生成该函数。\n\
    \n查看如何组装交易机器人\n\n### MQL 向导 - 文件\n\n专家顾问的测试事件处理器\n请选择专家顾问的测试事件处理器。\n\n- OnTester:\
    \ 当测试事件（Tester）发生时，调用 OnTester 函数。\n- OnTesterInit: 当测试初始化事件（TesterInit）发生时，调用\
    \ OnTesterInit 函数。\n- OnTesterPass: OnTesterPass 是测试通过（TesterPass）事件的处理器。\n- OnTesterDeinit:\
    \ TesterDeinit 是测试结束事件的处理器。\n\n查看如何组装交易机器人\n\n点击“完成”后，MQL5 向导将为我们创建开发任何投资机器人所需的基础主体。因此，我们已经有了一个划分好的结构，包含了运行\
    \ EA 的主要方法。\n\n```cpp\n//+------------------------------------------------------------------+\n\
    //| EA Cross RSI.mq5\n//| Copyright 2018, MetaQuotes Software Corp.\n//| https://www.mqql5.com\n\
    //+------------------------------------------------------------------+\n#property\
    \ copyright \"Copyright 2018, MetaQuotes Software Corp.\"\n#property link \"https://www.mqql5.com\"\
    \n#property version \"1.00\"\n//+------------------------------------------------------------------+\n\
    // Expert initialization function\nint OnInit()\n{\n    return(INIT_SUCCEEDED);\n\
    }\n//+------------------------------------------------------------------+\n//\
    \ Expert deinitialization function\nvoid OnDeinit(const int reason)\n{\n\n}\n\
    //+------------------------------------------------------------------+\n// Expert\
    \ tick function\nvoid OnTick()\n{\n\n}\n```\n\n![](img/6d863e70ea1a0ecdc703a17721d7e78b_61_0.png)\n\
    \n![](img/6d863e70ea1a0ecdc703a17721d7e78b_61_1.png)\n\n![](img/6d863e70ea1a0ecdc703a17721d7e78b_61_2.png)\n\
    \nEA 的结构为了其正常运行，始终至少包含以下三个函数或方法：OnInit()、OnDeinit() 和 OnTick()。\n\n## I.3. OnInit()\n\
    \nEA 中执行的第一个函数是 OnInit()。它只在我们初始化机器人时触发。我们使用此函数来初始化指标的指针（句柄）、变量，以及进行之前的配置并加载变量和模板。\n\
    \n## I.4. OnDeinit()\n\n当机器人从 MetaTrader移除时，调用 OnDeinit()。例如，我们使用此函数来清理指标句柄、变量，从屏幕移除图形和文本对象等。\n\
    \n## I.5. OnTick()\n\n最重要的函数之一是 OnTick()，因为我们的大部分编程逻辑都在这里运行。这个函数是机器人请求频率最高的，每当新价格产生时就会调用一次。值得注意的是，此函数只在交易时间内被调用。\n\
    \n值得强调的是有几个预定义函数如 ChartEvent()、Tester() 等。然而，我们将只学习主要的。关于这些函数的更多细节可以在 MetaTrader\
    \ 文档中找到。\n\n## I.6. 编程辅助工具\n\n我们有一些元素（函数）可以帮助代码的可读性。\n\n### I.6.1. 注释\n\n对算法进行注释对于可读性和理解至关重要。\n\
    \n例如，我们可以通过 // 或 /* */ 来表示注释元素。\n\n```cpp\n/*\n// EA_MA_Cros_RSI\n// Copyright\
    \ 2018, MetaQuotes Software Corp.\n// https://www.mqql5.com\n*/\n\n#property copyright\
    \ \"Copyright 2018.\"\n#property link \"https://www.mqql5.com\"\n#property version\
    \ \"1.00\"\n```\n\n这种类型的注释具有 这种结构（// 会导致编译器不解释它们紧接着看到的字符）。因此，我们可以编写一些提示和解释性注释，以便开发者以及我们自己编辑时清晰易读。\n\
    \n第二种注释 /* */ 允许你在它们之间编写整个段落。\n\n```cpp\n/*\n13\n14 在这里我可以写一段段落式的注释。我可以跳过\n15\
    \ 这些特殊字符之间的行\n16 */\n```\n\n我们有一些注释的快捷键。例如，如果我们想注释几行代码，可以选中它们并按下 (Ctrl + ~)。要移除注释，只需选中并按下\
    \ (Ctrl + ~)。\n\n```cpp\n//+--------------------------------\n//property copyright\
    \ \"Copyright 2018.\"\n#property link \"https://www.mqql5.com\"\n#property version\
    \ \"1.0\"\n//----------------\n```\n\n快捷键 (Ctrl + .) 让你创建下面的注释字符串。这对于分隔大代码段非常有用。\n\
    \n```cpp\n//--------------------------------\n//|                            \
    \   |\n//|                               |\n//--------------------------------\n\
    ```\n\n快捷键 (Ctrl +;) 让你创建以下字符串的小分隔：\n\n![](img/6d863e70ea1a0ecdc703a17721d7e78b_66_0.png)\n\
    \n"
