    The RSI is an indicator used to warn about overbought and/or oversold. Basically,
    we have two reference levels that we must choose for the activation trigger of
    the overbought or oversold. We can choose the levels of 30 (oversold) and 70 (overbought).


    For example, RSI values above 70 are indicating that the price is overbought,
    that is, at any moment in a consolidated market, we can begin to see a drop in
    prices. On the other hand, if the value of the RSI is below 30 we can say that
    the price is oversold and a sudden high in prices is eminent.


    These two indicators were presented, since they will be used to create our investment
    robot. Going forward, we will use three strategies: one with the crossing of moving
    averages, another with only the RSI and one with both indicators.


