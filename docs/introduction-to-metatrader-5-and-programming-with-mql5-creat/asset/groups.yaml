    \ conditions\n\n![](img/6d863e70ea1a0ecdc703a17721d7e78b_135_0.png)\n\nIn the\
    \ MQL5 language it is:\n\n| Line | Code |\n|---|---|\n| 135 | // LOGIC TO ACTIVATE\
    \ PURCHASE |\n| 136 | bool buy_ma_cros = ma_fast_Buffer[0] > ma_slow_Buffer[0]\
