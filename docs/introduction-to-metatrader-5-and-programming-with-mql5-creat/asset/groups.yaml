    # i.13. Methods or Functions


    When we are working with object-oriented programming (OOP) we make constant use
    of classes. Classes are the master plans of the objects architecture. Do not worry
    if this seems complicated because we will not use OOP.


    Among the classes we usually find methods and attributes. The term function is
    commonly used when we are working with procedural programming. The MQL5 language
    allows us to program both in the object-oriented and procedural paradigm. This
    book is about procedural programming, so we will talk about methods and functions
    as if they were the same thing.


    But what are methods or functions? They are code blocks that allow you to perform
    a specific task. Usually the functions have input and return parameters. In other
    words, the functions process the parameter entries according to a well-defined
