    ```markdown

    ## 5. What will we learn?


    In this e-book we will learn how to create, step by step, an automated investment
    strategy. We will create an Investment Robot (Expert Advisor - EA) from scratch
    using the MetaTrader 5 and MQL5 programming language.


    Thus, having a program written in a high-level language (MQL5) (those closest
    to the understanding of humans, low-level languages are closer to the understanding
    of machines) we will be able to leave the arduous and exhausting work of monitoring
    purchase and sale of a financial asset on the stock exchange for the robot.


    We will spend a few hours to program a robot known as **Expert Advisor** and spend
    the rest of the time monitoring the execution of the strategy in a much quieter
    and safer way. That leaves more time for a contemplative and pleasurable life.


    ## 6. Why MetaTrader 5?


    MetaTrader 5 is a powerful platform for visualizing, operating and scheduling
    investment strategies for various types of financial markets.


    It was created in the year 2005 and continues to be improved and distributed by
    MetaQuotes (https://www.metaquotes.net). We can use MetaTrader 5 to operate in
    the stock markets, futures, options, currency pairs (FOREX) among others.


    MetaTrader 5 was chosen to build our first EA, as it is a ''free'' tool, quite
    powerful and complete from the point of view of the main functionalities that
    a trader platform should have.


    Inside MetaTrader 5 we have the option to create scripts, indicators and, of course,
    investment robots using the MQL5 programming language. This language is very similar
    to C++, Java and C#. So anyone who already knows any of them will feel extremely
    comfortable learning MQL5.


    ## 7. EA Strategy


    We will develop from scratch a strategy of crossing two moving averages (one fast
    and slow) with the possibility of an input filter in operations with the rather
    popular indicator RSI (relative strength index).


    Our robot will be multi-strategy. It will be able to work, using as input triggers
    in the operations, only the crossing of the moving averages, only the RSI or both
    (crossing of averages plus RSI).


    We will also learn how to make backtests of the created robot. Thus we will be
    able to test various setups on historical data of various financial assets. The
    book is full of guidelines, with screenshots, using the key parts of MetaTrader
    5 and MetaEditor.


    We will learn the programming syntax in MetaEditor. We have several features when
    programming with MQL5. It already presents a very significant set of libraries
    to work with graphical manipulation, mathematical operations, statistics, with
    price structures and control of the sending of trading orders.


    ## 8. Advantages of Using EA


    Let''s go to the advantages behind using investment robots. They are many, but
    we go to the main ones:


    - Eliminates all emotional side;

    - Test ready strategies with backtests;

    - Simulate adverse market situations;

    - EA are free from fatigue, stress, lose attention, or fail to execute the strategy;

    - We can optimize the strategy from a Robot;

    - EA are infinitely disciplined and speedy compared to us;

    - Statistical validations can be made. EA statistically validated winners and
    consistent in the medium and long term.

    - EA has a single mindset that is to execute the scheduled strategy;

    - EA operate from the first second of market opening to the last second before
    closing, without truce and misconduct.


    ## 9. E-book Summary


    So to achieve the goal of creating our first Expert Advisor, this e-book organizes
    and simplifies in a didactic way the necessary steps with the knowledge and usage
    information of MetaTrader 5 and its MQL5 programming language.


    Here''s a summary of what you will learn from reading this e-book:


    - Learn how to install MetaTrader 5;

    - Know the main benefits of the MetaTrader online portal;

    - Understand the main features and differences between MetaTrader and MQL5;

    - Learn to add indicators and EA;

    - Know MetaEditor and some of the main shortcuts to facilitate programming;

    - Learn the programming syntax of MQL5;

    - Understand the main functions of the MQL5 development libraries.

    - Create a strategy using trend indicators (moving averages) and consolidated
    market indicators (Relative Strength Index - RSI);

    - Program step-by-step a Multrategy EA;

    - Make backtests of the created EA;

    - Know the backtest statistics;

    - And much more.


    Now we are moving towards the future of investments. Congratulations on your decision
    to enter this grand and fascinating world of automated investments.


    Thank you for your confidence in purchasing this material. The future is here
    and we will build it together.


    Everyone a great read!


    # Important note[1].


    # Chapter 2


    # MetaTrader 5


    MetaTrader is a platform developed to assist in the visualization of prices of
    financial assets and execution of buy and sell orders on the stock exchange. It
    is also possible to create scripts (algorithms for specific actions), indicators
    and investment robots.


    It is a free tool developed and distributed by MetaQuotes Softwares (https://www.metaquotes.net/).
    Initially, it was developed thinking about the Forex market. However, several
    brokerages have been allowing for the use in the stock market.


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_18_0.png)


    Millions of traders and hundreds of brokers cannot be wrong — they have chosen
    MetaTrader 5 for trading Forex and financial markets!


    We need a company (investment broker) to provide routing pricing data for the
    platform. Many investment brokers offer this for free. Some brokers offer a demo
    account where we can simulate buy and sell with dummy money.


    MetaTrader 4 was created in 2005 and since then has undergone major transformation
    in its system. It is currently in its second major release called MetaTrader 5
    which was released in 2010.


    We can use MetaTrader on both desktop and smartphones. It is available on Mac,
    Linux, Windows and Android systems. The leading Internet browsers support MetaTrader
    online.


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_19_0.png)


    MetaTrader 5 is not only a tool for visualizing and routing orders (buy/sell)
    of financial assets, but also an excellent platform for developing strategies
    from scripts, indicators and robots (Expert Advisors) using MQL5 (MetaQuotes Language)
    which presents great similarities with C++, Java and C#. Therefore, those who
    have some knowledge in any of these languages will feel comfortable with MQL5
    syntax.


    In comparison to MetaTrader 4, MetaTrader 5 allows developing strategies using
    the object-oriented programming paradigm (OOP).


    ## 1. Downloading and installing MetaTrader 5


    In the world several brokerages offer free use of MetaTrader 5. All we need is
    that we are a client of the investment broker. We need, after downloading the
    platform, to request a release of a demo and real account so that we can have
    access to the routing of the data of the financial assets.


    The direct download of the platform can be done by the site: https://www.metaquotes.com/en/metatrader5/.


    As said before, several brokers around the world offer free routing, but many
    for the Forex market. Some Forex brokers only need a valid phone number to release
    a demo account. In this e-book we will use the prices of financial assets present
    in the São Paulo (Brazil) BM&FBovespa exchange.


