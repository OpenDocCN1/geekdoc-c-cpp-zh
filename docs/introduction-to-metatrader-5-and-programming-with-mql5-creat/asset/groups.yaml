    \ if 结构在很多情况下非常有用。当条件链很长时，可以使用这种结构。如果没有 else if 为真，则 else 会自动执行。\n\n```cpp\n77\
    \ int var1 = 1;\n78 int var2 = 4;\n79 int var3 = 7;\n80\n81 if(var3 == 1)\n82\
    \ Print(\"Var3 = 1\");\n83\n84 else if(var3 == 4)\n85 Print(\"Var3 = 1\");\n86\n\
    87 else\n88 Print(\"Var3 = \\var3);\n89\n```\n\n## 5.12. 三元运算符\n\n三元运算符存在于许多高级编程语言中，在\
    \ MQL5 中也不例外。这是一个非常实用的运算符，可以简化可能使用 if 和 else 的条件结构。\n\n三元运算符的操作结构如下：\n\n(条件)?\
    \ (为真的备选项 1): (为假的备选项 2)\n\n让我们来看一个例子：\n\n```cpp\n102 bool conditional = true;\n\
    103\n104 bool resultado = conditional ? true : false;\n105\n106 Print(resultado);\
    \    // 输出: true\n```\n\n在我们将条件变量的地方，我们可以使用逻辑评估器（>, <=, &&, ||）进行任何结构。\n\n## i.13.\
