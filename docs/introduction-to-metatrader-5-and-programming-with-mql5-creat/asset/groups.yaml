    ## 5. 我们将学习什么？


    在这部电子书中，我们将学习如何一步步创建一个自动化投资策略。我们将使用 MetaTrader 5 和 MQL5 编程语言从零开始创建一个投资机器人（专家交易系统
    - EA）。


    因此，通过一个用高阶语言（MQL5）编写的程序（高阶语言更接近人类的理解方式，而低级语言更接近机器的理解），我们能够将从证券交易所监控金融资产买卖的繁重且精疲力竭的工作交给机器人。


    我们将花费几个小时来编写一个名为**专家交易系统（Expert Advisor）**的机器人，并将剩余的时间用于以一种更安静、更安全的方式监控策略的执行情况。这为沉思和愉悦的生活留下了更多时间。


    ## 6. 为什么选择 MetaTrader 5？


    MetaTrader 5 是一个强大的平台，用于各种类型金融市场投资策略的可视化、操作和调度。


    它创建于 2005 年，并由 MetaQuotes (https://www.metaquotes.net) 持续改进和分发。我们可以使用 MetaTrader
    5 在股票市场、期货、期权、货币对（FOREX）等领域进行操作。


    选择 MetaTrader 5 来构建我们的第一个 EA，因为它是一个“免费”工具，从一个交易平台应该具备的主要功能来看，它非常强大且完善。


    在 MetaTrader 5 内部，我们可以选择创建脚本、指标，当然，还有使用 MQL5 编程语言创建投资机器人。这种语言与 C++、Java 和 C# 非常相似。因此，任何已经熟悉其中任何一种语言的人在学习
    MQL5 时都会感到非常轻松。


    ## 7. EA 策略


    我们将从零开始开发双移动平均线交叉（一个快线，一个慢线）的策略，并可以在操作中使用相当流行的 RSI（相对强强度指数）指标作为输入过滤器。


    我们的机器人将是多策略的。它能够工作，在操作触发器中仅使用移动平均线交叉、仅使用 RSI 或两者兼顾（平均线交叉加之 RSI）。


    我们还将学习如何对创建的机器人进行回测。这样，我们就可以在各种金融资产的历史数据上测试各种设置。书中充满了指南和截图，涵盖了 MetaTrader 5 和
    MetaEditor 的关键部分。


    我们将在 MetaEditor 中学习编程语法。在使用 MQL5 编程时，我们拥有许多功能。它已经提供了一组非常丰富的库，用于图形处理、数学运算、统计、价格结构以及交易订单发送的控制。


    ## 8. 使用 EA 的优势


    让我们来看看投资机器人的优势。优势有很多，但我们重点介绍主要的几个：


    - 消除所有的情绪因素；

    - 通过回测测试准备绪的策略；

    - 模拟不利的市场状况；

    - EA 不会疲劳、压力、失去注意力或无法执行策略；

    - 我们可以从机器人开始优化策略；

    - 与我们相比，EA 具有无限的纪律性和速度；

    - 可以进行统计学验证。经过统计学验证的 EA 在中长期是获利且一致的。

    - EA 拥有单一思维，即执行计划好的策略；

    - EA 从市场开盘的第一秒运行到收盘前的最后一秒，没有休工或违规行为。


    ## 9. 电子书总结


    因此，为了实现创建第一个专家交易系统的目标，本电子书以教学化的方式组织并简化了必要的步骤，并提供了 MetaTrader 5 及其 MQL5 编程语言的知识和使用信息。


