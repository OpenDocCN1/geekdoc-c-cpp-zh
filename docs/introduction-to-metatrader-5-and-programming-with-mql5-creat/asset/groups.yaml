    \ |\n| 143 | ma_slow_Buffer[2] < ma_fast_Buffer[2]; |\n| 144 | |\n| 145 | bool\
    \ sell_rsi = rsi_Buffer[0] >= rsi_overbought; |\n\nWe have to create a logic to\
    \ use the enum (STRATEGY). We need the sales and purchase triggers to be oriented\
    \ with: ONLY_MA (moving averages only), ONLY_RSI (RSI only) and MA_AND_RSI (Moving\
    \ averages plus RSI) described in this enum. Here's a possible solution:\n\n```cpp\n\
    148 bool Buy = false; // Can Buy?\n149 bool Sell = false; // Can Sell?\n150\n\
    151 if(strategy == ONLY_MA) {\n152     Buy = buy_ma_cros;\n153     Sell = sell_ma_cros;\n\
    154 }\n155 else if(strategy == ONLY_RSI) {\n156     Buy = buy_rsi;\n157     Sell\
    \ = sell_rsi;\n158 }\n159 else {\n160     Buy = buy_ma_cros && buy_rsi;\n161 \
    \    Sell = sell_ma_cros && sell_rsi;\n162 }\n```\n\nNow we can organize our functions\
    \ so EA can make buying and selling decisions. It is important to know when a\
    \ new bar (candle) is created so that the algorithm can track, without much computational\
    \ effort, a crossing of averages and RSI values in the desired region. Let's draw\
    \ a vertical line when the buy/sell triggers are activated.\n\n```cpp\n// returns\
