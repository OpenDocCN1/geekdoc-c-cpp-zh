    ### 1.3. 导航字段 (Navigator Field)


    导航字段包含用户的账户信息（无论是演示账户还是真实账户），以及平台提供的指标、投资机器人，以及我们自己开发的指标。


    在该字段中，我们可以选择指标、脚本或 EA 类型，并将其直接拖放到感兴趣的金融资产图表中。


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_26_0.png)


