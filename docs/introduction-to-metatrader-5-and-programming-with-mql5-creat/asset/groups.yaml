    \        BuyAtMarket();\n    }\n\n    // Sell Condition:\n    if(Sell && PositionSelect(_Symbol)==false)\
    \ {\n        drawVerticalLine(\"Sell\",candle[1].time,clrRed);\n        SellAtMarket();\n\
    \    }\n}\n```\n\nThe 'PositionSelect(_Symbol)' function returns a boolean. If\
    \ there is any operation in progress it returns true, otherwise false. So we just\
