    ### 1.3. Navigator Field


    The field Navigator is where it contains the information regarding the account
    of the user if demo or real, as well as the indicators and robots of investments
    available by the platform and those that were developed by ourselves.


    In this field, we can choose the type of indicator, script or EA and drag directly
    to the financial asset chart of interest.


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_26_0.png)


    Another way to add indicators or EA is from the menu Insert -> Indicators, Insert
    -> Expert (Robots).


    Let''s add an indicator from the menu:


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_27_0.png)


    In the figure above, we can see that the indicators are separated by trend indicators,
    oscillators, volumes, Bill Williams and Custom. Trend indicators, as the name
    implies, are more apt to warn when the market is within some well-defined directional
    behavior. On the other hand, the Oscillator indicators in are more adequate to
    warn of opportunities within a lateralized market, a market in consolidation.


    Bill Williams[2] is a very popular trader who has developed several important
    and widely used indicators. Therefore, a specific section was created for the
    indicators created by it.


    It is interesting the possibility that we have to use indicators and native EA
    of MetaTrader itself and indicators and EA created by us or even offered in the
    Market tab of Toolbox.


    ### 1.4. Toolbox


    In the Toolbox field we can find several importants informations regarding the
    sale of the main indicators and investment robots developed for MetaTrader platform.
    We can also download those for free (Libraries). We can view the main news (tab
    News) in real time as auction and output of news relevant to the market.


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_29_0.png)


    In the Experts tab, we can view the main logs regarding operation of our robots.
    In this place, we are informed about sending of orders, problems with variables,
    errors of execution. Now that we already know, in general, the main fields of
    MetaTrader 5, we go to the main graphic field, which is the window of visualization
    of price.


    ### 1.5. Looking for Candles


    The MetaTrader 5 platform allows us to customize the way we visualize prices in
    different ways. For example, we can change the background of the screen, the colors
    of contours and fill of high/low/doji candles, separation lines of periods, grids,
    among other properties.


    We can switch between three types of price visualization of financial assets.
    These visual types are given through Bar Chart, Candlestick or Line Chart.


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_30_0.png)


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_30_1.png)


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_31_0.png)


    ### 1.6. Saving Templates


    It is important to note that each time a new chart is requested to be opened in
    MetaTrader it will appear on the screen with the default settings. However, there
    is a way to save our screen customization from creating a template.


    For example, let''s set up a template. For this we must make our customizations.
    With a right click on the graphic field we can choose Properties and make the
    appropriate color to our liking.


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_32_0.png)


    Let''s consider the following changes:


    Then right click on the graphic screen and go to Template -> Save Templates. We
    chose a name and that''s it.


    ![](img/6d863e70ea1a0ecdc703a17721d7e78b_33_0.png)


    So, just load the saved template to a new graphic, so that the settings are immediately
    applied. That way, we have a lot of flexibility to be able to configure visualization
    templates for setups of different strategies.


    ### 7. Drawing Objects


    You can draw several objects in price charts. We can add channels, support lines
    and resistance, Fibonacci, up/down arrows etc.


