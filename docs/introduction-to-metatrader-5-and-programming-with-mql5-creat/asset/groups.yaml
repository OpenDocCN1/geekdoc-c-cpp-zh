    \ e subtração\n15 // varA\n16 int varA = 2 + 3;           // Resultado: 5\n17\n\
    18 double varB = 2.5 + varA;  // Resultado: 7.5\n19\n20 double varC = varA - varB;\
    \  // Resultado: 2.5\n21\n22\n23 // Multiplicação\n24 int varD = 2 * 3;      \
    \    // Resultado: 6\n25\n26 double varE = 2.5 * varD; // Resultado: 15\n27\n\
    28 // Divisão\n29 double varF = 5 / 2;      // Resultado: 2.5\n30 int\n31 varG\
    \ = 5 / 2;            // Resultado: 2\n32\n```\n\nThe language itself already\
    \ comes with a set of mathematical and statistical functions to work connected\
    \ with the most diverse operations. We have the functions with radical MathXXX\
    \ quite useful:\n\n```cpp\n13 Math\n14 MathAbs\n15 MathArccos\n16 MathArccosh\n\
    17 MathArcsin\n18 MathArcsinh\n19 MathArctang\n20 MathArctan\n21 MathArctanh\n\
    22 MathCeil\n23\n24\n```\n\n## s.11. Logical and Conditional Relationships\n\n\
    In the structure of our algorithms we commonly use logical relations that return\
    \ values of true or false. The main relationships we will be working on are represented\
    \ as follows by MQL5:\n\n```cpp\n54 A > B // greater than\n55\n56 A < B // less\
    \ than\n57\n58 A >= B // greater or equal\n59\n60 A <= B // less than or equal\n\
    61\n62 A == B // equal\n63\n64 A != B // different\n```\n\nSee the use of the\
    \ conditional plus the logical connectives && (AND) and || (OR):\n\n```cpp\n67\
    \ int A = 7;\n68 int B = 7;\n69 int C = 10;\n70\n71 if(A == B && A+B == C) //\
    \ && is the boolean AND operation\n72\n   {\n73   Print(true); // Out: true\n\
    74   }\n75\n76 if(A == B || A == C) // || is the boolean OR operation\n77\n  \
    \ {\n78   Print(true); // Out: true\n79 }\n```\n\nLet's now go to the conditional\
    \ structure of the else type. The else is activated if the 'if' conditional is\
    \ not true. Therefore, if the 'if' is false automatically the else becomes true\
    \ and everything inside the keys of this structure is executed.\n\n```cpp\n62\
    \ int var1 = 1;\n63 int var2 = 4;\n64 int var3 = 7;\n65\n66 if(var1 >= var3)\n\
    67 {\n68 Print(\"Maior Var1 >= Var3\");\n69 else\n70 {\n71 Print(\"Var1 não é\
    \ >= Var3\");\n72 }\n73\n```\n\nThe else if structure is very useful in many cases.\
    \ When the chain of conditions is extensive we can use this structure. If no else\
    \ if is true, else executes automatically.\n\n```cpp\n77 int var1 = 1;\n78 int\
    \ var2 = 4;\n79 int var3 = 7;\n80\n81 if(var3 == 1)\n82 Print(\"Var3 = 1\");\n\
    83\n84 else if(var3 == 4)\n85 Print(\"Var3 = 1\");\n86\n87 else\n88 Print(\"Var3\
    \ = \\var3);\n89\n```\n\n## 5.12. Ternary Operator\n\nThe ternary operator exists\
    \ in several high-level programming languages and in MQL5 it is no different.\
    \ This is a very useful operator to simplify conditional structures that could\
