    MQL5 Reference

    nMQL5 is a high-level language designed for developing technical indicators, trading
    robots and utility applications, which automate financial trading. It has been
    developed by MetaTrader Software Corp. with advanced code writing tools, such
    as templates, wizards and visual debuggers.


    In addition to MQL5 language, the trading package also includes the MetaEditor
    IDE with highly advanced features. The language syntax is very close to C++, enabling
    easy transition for programmers.


    The project also has a community website, which contains a huge free community
    and a platform of articles. These articles cover all the aspects of modern trading,
    including expert advisors, trading systems, trading signals, and applications.


    MQL5 language provides specialized trading functions and predefined event handlers
    to develop Expert Advisors (EAs), which automatically control trade execution
    following specific trading rules. In addition, MQL5 also allows developing custom
    indicators, scripts, and libraries.


    The standard library contains many classes divided into several categories. The
    reference also provides descriptions of Standard library classes used for trading
    strategies, custom graphics and control panels, and file access. Additionally,
    the library contains the MQL5 numerical analysis library, which can be used for
    solving mathematical problems.


    Something very important for anyone who is starting with the MQL5 language are
    the open source code samples available in CodeBase. In this location we will have
    access to codes for both the MQL4 and MQL5 languages. It is extremely valuable
    to spend time researching and studying these codes.'
