    \n## i.6. 专家顾问函数（EA Functions）\n\n让我们为 EA 的运行创建一些有用且重要的函数。我们可以使用快捷键 (Ctrl +) 为我们将为\
    \ EA 创建的一组函数创建章节。\n\n首先，我们需要一个函数，无论图形周期如何，都能通知我们新 K 线的出现。尽管如此，MQL5 中还没有原生函数允许我们准确评估\
    \ K 线的变化，因此我们必须手动创建它。\n\n当图表出现新 K 线时，该函数应返回 true。以下是 MetaTrader 文章门户教程中使用的代码：\n\
    \n```\n//--- USEFUL FUNCTIONS\n//--- for bar change\nbool isNewBar() {\n    //\
