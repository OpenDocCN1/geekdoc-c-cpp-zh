    # Creating Functions


    Now that you have mastered the use of variables and user input, the next step
    is to tackle functions. You''ve already used a few functions, such as the print
    command but Python enables you to define your own functions.


    # FUNKY FUNCTIONS


    A function is a command that you enter into Python to do something. It''s a little
    piece of self-contained code that takes data, works on it and returns the result.


    +   STEP 1 It''s not just a function that works. They can do all of useful things
    in Python, such sort data, change items from one format to another and check the
    length or type of items. It is a short word followed by brackets, len(), or type().


    +   STEP 3 You can pass variables through functions in much the number of letters
    in a person''s surname, you could use the following code (enter the text editor
    for this example):


    ```

    name=input("Enter your surname: ")

    count=len(name)

    print("Your surname has", count, "letters in it.")

    ```


    ![](img/588364e02a77f179099fae91a1713f0a_37_0.png)


    +   STEP 2 A function takes data, using a variable, works on it depending on what
    the function is programmed to do and returns the end value. For example, if you
    wanted to know how many letters are in the word antestablishmentism, then you''d
    need len("antestablishmentism") and the number 28


    +   STEP 4 Python has tens of functions built into it, far too many to get into
    the limited space available here. However, to view the list of built-in functions
    available in Python 3, navigate to docs.python.org/3/library/functions.html. These
    are the predefined functions, but since users have created many more, they''re
    not the only ones available:


    ![](img/588364e02a77f179099fae91a1713f0a_37_1.png)


