    \n# 条件与循环\n\n条件和循环让程序变得有趣；它们可以简单，也可以相当复杂。你如何使用它们很大取决于程序试图实现的目标；它们可以是游戏中剩余的生命，或者只是显示倒计时。\n\
    \n## 真条件\n\n开始时保持条件简单会让学习编程成为一种享受体验。让我们从检查某事是否为真开始，如果不是执行某些操作。\n\n- * STEP 1 我们创建一个新的\
    \ Python 程序，要求用户输入一个单词，然后检查它是否是四个字母。从 File -> New File 开始，从输入开始：\n\n```python\n\
    word=input(\"Please enter a four-letter word: \")\n```\n\n![](img/588364e02a77f179099fae91a1713f0a_39_0.png)\n\
    \n- * STEP 2 我们可以创建一个新变量，然后使用 `len` 函数并将单词传递其中，以获取用户输入的字母数量：\n\n```python\nword=input(\"\
    Please enter a four-letter word: \")\nword_length=len(word)\n```\n\n- * STEP 3\
    \ 现在你可以使用 `if` 语句来检查单词是否为四个字母，如果符合规则，则打印一个友好的确认：\n\n```python\nword=input(\"Please\
    \ enter a four-letter word: \")\nword_length=len(word)\nif word_length == 4:\n\
    \    print(\"is a four-letter word. Well done.\")\n```\n\n双等号 (==) 意味着检查某物是否等于另一个物。\n\
    \n- * STEP 4 `if` 结尾的冒号告诉 Python 冒号之后语句为真，单词匹配。接下来，将光标移动到编辑器的开头：\n\n```python\n\
    word=input(\"Please enter a four-letter word: \")\nword_length=len(word)\nif word_length\
    \ == 4:\n    print(\"is a four-letter word. Well done.\")\nelse:\n    print(\"\
    is not a four-letter word.\")\n```\n\n![](img/588364e02a77f179099fae91a1713f0a_39_1.png)\n\
    \nSTEP 5 按 F5 并保存代码以执行。在 Shell 中输入一个四字母单词开始，你应该得到返回的消息，该单词是四个字母。现在再次按 F5 运行程序，这次输入一个五个字母单词。Shell\
    \ 将显示它不是四字母单词。\n\nSTEP 6 现在扩展代码以包含另一个条件。最终，它可以变得非常复杂。我们添加了一个针对三个字母单词的条件：\n\n```python\n\
    word=input(\"Please enter a four-letter word: \")\nif len(word) == 4:\n    print(word,\
    \ \"is a four-letter word. Well done.\")\nelse:\n    print(word, \"is not a four-letter\
    \ word. Try again.\")\n```\n\n![](img/588364e02a77f179099fae91a1713f0a_40_0.png)\n\
    \n![](img/588364e02a77f179099fae91a1713f0a_40_1.png)\n\n# 循环\n\n循环和条件看起来很相似，但它们的操作方式有所不同。循环会执行缩进代码块若干次，通常带有条件的支持。\n\
    \nSTEP 1 让我们从简单的 `while` 语句开始。`if` 将检查某事是否为真，然后执行缩进代码：\n\n```python\nx = 10\n\
    while x > 0:\n    print(x)\n    x = x - 1\n```\n\nSTEP 3 循环是另一个示例。`for` 用于遍历数据，通常是存储在方括号内的列表。For:\n\
    \n![](img/588364e02a77f179099fae91a1713f0a_40_2.png)\n\n![](img/588364e02a77f179099fae91a1713f0a_40_3.png)\n\
    \nSTEP 2 `if` 和 `while` 的区别在于当缩进代码回到结尾时，语句仍然为真。在示例中 x 是 10。每次循环打印 x 的当前值，然后减 1。\n\
    \nSTEP 4 循环也可以通过 `range` 函数用于倒计时示例：\n\n```python\nfor x in range(1, 10):\n   \
    \ print(x)\n```\n这里不需要 `x=1` 部分，因为 `range` 函数从第一个到最后一个数字创建一个列表。\n\n![](img/588364e02a77f179099fae91a1713f0a_40_4.png)\n\
    \n![](img/588364e02a77f179099fae91a1713f0a_40_5.png)\n\n![](img/588364e02a77f179099fae91a1713f0a_40_6.png)\n\
