    ```bash\npip install pygame\n```\n\n- STEP 4 PIP 安装需要权限在不同位置安装组件。Windows 用户可以通过开始按钮搜索\
    \ CMD 并右键点击结果“以管理员身份运行”。Linux 和 Mac 用户使用 `sudo pip install`。\n\n```\nMicrosoft\
    \ Windows [Version 10.0.15063]\n(C) 2017 Microsoft Corporation. All rights reserved.\n\
    Collecting pygame\n  Downloading pygame-2.0.1-py3-none_amd64.whl (2.1 MB)\nCollecting\
    \ pygame\n  Installing collected packages: pygame\nSuccessfully installed pygame-2.0.1\n\
    ```\n\n![](img/588364e02a77f179099fae91a1713f0a_41_1.png)\n\nSTEP 5 关闭命令提示符或终端或重新启动\
    \ IDLE Shell。当你现在输入 `import pygame` 时，模块将无问题地导入代码中。你会发现大多数从互联网下载或复制的代码将保持独特，通常通常是导致执行错误的源头。\n\
    \nSTEP 8 可以在代码中导入多个模块。要扩展你的代码，使用：\n\n```python\nimport random\nimport math\n\n\
    for i in range(5):\n    print(random.randint(1, 25))\n\nprint(math.pi)\n```\n\n\
    ![](img/588364e02a77f179099fae91a1713f0a_42_0.png)\n\n![](img/588364e02a77f179099fae91a1713f0a_42_1.png)\n\
    \nSTEP 6 模块包含了在自己的代码中实现特定结果所需的额外代码，正如我们之前遇到它那样。例如：\n\nSTEP 9 结果是一串随机数，后面跟着来自 math\
    \ 模块的 Pi 值，你也可以使用 `from` 和 `import` 命令从模块拉取某些函数，例如：\n\n```python\nimport random\n\
    ```\n\n来自随机数生成器模块。你可以使用这个模块创建如下内容：\n\n```python\nfrom random import randint\n\
    for i in range(5):\n    print(randint(1, 25))\n\nfor i in range(10):\n    print(random.randint(1,\
    \ 25))\n```\n\n![](img/588364e02a77f179099fae91a1713f0a_42_2.png)\n\nSTEP 7 这段代码在保存并执行时将显示\
    \ 1 到 25 之间的十个随机数。你可以运行更多或更，并在更大或更小的范围内。\n\nSTEP 10 这有助于创建一个更简洁的编程方法。你也可以导入模块*，这会导入模块内定义的所有内容。然而，它通常被视为资源的基础，尽管它依然存在。模块可以作为别名导入：\n\
    \n```python\nimport random\n\nfor i in range(25):\n    print(random.randint(1,\
    \ 100))\n\nimport math as m\nprint(m.pi)\n```\n\n当然，添加注释有助于告诉他人正在发生什么。\n\n![](img/588364e02a77f179099fae91a1713f0a_42_3.png)\n\
