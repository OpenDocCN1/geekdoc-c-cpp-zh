    \n# 为什么选择 C++？\n\nC++ 是当今最流行的编程语言之一。它最初被称为“带有类的 C语言”（C with Classes），在 1983 年被重命名为\
    \ C++。它是原始 C 语言的扩展，是一个通用的面向对象 OOP 环境。\n\n## C++ 的一切\n\n由于该语言的复杂性以及其强大的功能和性能，C++\
    \ 经常被用于开发游戏、设备驱动程序甚至整个操作系统。\n\n追溯到 1970 年（家用计算时代的开始），C++，或者说带有类的 C 语言，是丹麦科学家 Bjarne\
    \ Stroustrup 在撰写博士论文期间的脑结晶。Stroustrup 的计划是进一步改进原始的 C 语言，该语言自 70 年代初以来已在计算机实验室以及由于由于无法访问大型机和大型计算数据中心的普通用户中广泛使用。\n\
    \nC++ 证明其在 80 年代的开发者中非常受欢迎，因为它提供了一个更容易上手的环境，更重要的是，它与原始 C 语言有 99% 的兼容性。这意味着它可以被用于主流领域之外。\n\
    \nC++ 在数字世界中的影响是巨大的。许多程序、应用程序、游戏甚至操作系统都是使用 C++ 编写的。例如，Adobe 的所有应用程序（Photoshop、InDesign\
