    \ str << \"\\n\";\n    str.erase(str.begin()+9, str.end());\n    cout << str <<\
    \ \"\\n\";\n}\n```\n\n- STEP 7 You can add strings together, or rather combine\
    \ them to form strings:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main() {\n    string greet1 = \"Hello\";\n    string greet2 = \" world!\"\
    ;\n    string greet3 = greet1 + greet2;\n    cout << greet3 << \"\\n\";\n}\n```\n\
    \n- STEP 10 It's worth spending some time around the numbers, where the character\
    \ positions in the string. It can be hit or miss whether you get it right, so\
    \ practice makes. Take a look at the screenshot to the result of code:\n\n```\n\
    C:\\Users\\david\\Documents\\Document1.cpp\nHere is a long sentence in a string.\n\
    Here is a sentence in a string.\nHere is a string.\nProcessed (0x) execution time\
    \ : 0.051 s\nPress any key to continue.\n```\n\n# C++ Maths\n\nProgramming is\
    \ mathematical in nature and as you might expect, there is plenty of built-in\
    \ scope for some quite maths. C++ has a lot to offer someone who is implementing\
    \ mathematical models into their code. It can be extremely complex or relatively\
    \ simple.\n\n# C++ =\n\nThe basic mathematical symbols apply in C++ as they do\
    \ in most programming languages. However, by using the C++ Math Library, you can\
    \ also calculate square roots, powers, trig and more.\n\n- C++ mathematical operations\
    \ follow the same patterns as taught in school, in that multiplication and division\
    \ takes precedence over addition and subtraction. You can also alter that. For\
    \ now, create a new file and enter.\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n    float numbers = 100;\n    numbers = numbers + 10;  //\
    \ This adds 10 to the initial\n    cout << \"\\n\";\n    numbers = numbers - 10;\
    \  // This subtracts 10 from the new\n    cout << \"\\n\"\n}\n```\n\n- Multiplication\
    \ and division can be applied as such:\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n    float numbers = 100;\n    numbers = numbers * 10;  //\
    \ This multiplies 100 by 10\n    cout << \"\\n\";\n    numbers = numbers / 10;\
    \  // And divides 1000 by 10\n    cout << \"\\n\"\n}\n```\n\nWhile simple, it\
    \ does the old maths warmed up. We used a float for the variables. While you can\
    \ use an integer, if you to use decimals, you would need to change it to a float\
    \ or double, depending on the accuracy needed. Run the code and see.\n\nAgain,\
    \ while not particularly interesting, the code and see the results. It's a start\
    \ into C++ maths. We used a float, so you can play around with the code and multiply\
    \ by decimal places, as well as divide, add and subtract.\n\n![](img/588364e02a77f179099fae91a1713f0a_73_0.png)\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    float numbers\
    \ = 100;\n    numbers = numbers * 10;  // This multiplies 100 by 10\n    cout\
    \ << \"\\n\";\n    numbers = numbers / 10;  // And divides 1000 by 10\n    cout\
    \ << \"\\n\"\n}\n```\n\n```\nProcess returned (0x) execution time : 0.043 s\n\
    Press any key to continue.\n```\n\n```\nProcess returned (00) execution time :\
    \ 0.050 s\nPress any key to continue.\n```\n\n![](img/588364e02a77f179099fae91a1713f0a_73_1.png)\n"
  mdcn: "\n\n# 数据类型\n\n```cpp\ncout.precision(22);\ncout << PI;\n```\n\n这主要是由于编译器中的二进制转换导致的，而且\
    \ IEEE 754 双精度标准占用了 64 位数据，其中 52 位用于有效位（浮点数中的有效数字），大约有 3.5 位用于存储 0 到 9 的数值；如果你将\
    \ 52 除以 3.5，就会得到 14.857142，这恰好是第 15 位小数。\n\n老实说，如果你正在编写需要精确到 15 位小数的代码，你不会使用 C++；你会使用某种科学语言，并将\
    \ C++ 作为这两种语言之间的连接胶结组织。\n\n你可以使用一种类似于别名的系统 `typedef` 来创建你自己的数据类型。\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\ndouble PI = 3.141592653589793238463;\n\
    \nint main() {\n\tcout.precision(22);\n\tcout << PI;\n}\n```\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\ntypedef int metres;\n\nint main() {\n\tmetres\
    \ distance;\n\tdistance = 15;\n\tcout << \"distance in metres is: \" << distance;\n\
    }\n```\n\n```\nC:\\Users\\david\\Documents\\C++\\DataTypes.exe\nProcessed (3.14159265358979311598)\
    \ execution time : 0.047 s\nPress any key to continue.\n```\n\n再次编译并运行代码；如你从命令行窗口所示，变量\
    \ `PI` 表示的数字与你在 C++ 中得到的数字 3.14159265358979311598 不同，数字从第 15 位小数开始出现了偏差。\n\n|\
    \ | HYP | F-E | | | |\n| MC | MR | M+ | - | MS | M' |\n| x² | y³ | sin | cos |\
    \ tan | |\n| ✓ | 10ª | log | Exp | Mod | |\n| ↑ | CE | C | | ÷ | |\n| π | 7 |\
    \ 8 | 9 | × | |\n| n! | 4 | 5 | 6 | — | |\n| ± | 1 | 2 | 3 | + | |\n| ( | ) |\
    \ 0 | = | | |\n\n```cpp\n#include <iostream>\nusing namespace std;\ntypedef int\
    \ metres;\nint main() {\n\tmetres distance;\n\tdistance = 15;\n\tcout << \"distance\
    \ in metres is: \" << distance;\n}\n```\n\n```\nC:\\Users\\david\\Documents\\\
    C++\\DataTypes.exe\ndistance in metres is: 15 (exe)\nProcessed (0) execution time\
    \ : 0.041 s\nPress any key to continue.\n```\n\n这段代码在执行时创建了一个名为 `metres` 的新数据类型。然后，在\
    \ `main` 块代码中，有一个名为 `distance` 的新变量，这是一个整数；所以你基本上是在告诉编译器 `int` 有另一个名字。你将值 15 赋值给\
    \ `distance` 并显示了输出：distance in metres is: 15\n\n刚开始听起来可能有点困惑，但你越使用 C++ 并创建自己的代码，它就会变得越容易。\n\
    \n# 字符串\n\n字符串是表示并持有字符序列的类。例如，你可以在代码中有一个通用的问候语 'Welcome' 并将其赋值为字符串，以便在程序的任何地方调用。\n\
    \n# 字符串理论\n\n有不同的方法可以创建字符字符串，这些方法历史上都是从原始的 C 语言继承而，并且仍然被 C++ 支持。\n\n- 步骤 1 使用\
    \ `char` 函数创建字符串。打开一个新的 C++ 文件并从常用的头文件开始：\n\n- 步骤 3 编译并运行代码，屏幕上出现了 'Welcome'。虽然这完全没问题，但它不是字符串。字符串是一个类，它定义了可以表示为字符流的对象，并且不需要数组来终止。因此代码可以表示为：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main () {\n\n    char\
    \ greet = \"Welcome\";\n    cout << greet << \"\\n\";\n}\n```\n\n![](img/588364e02a77f179099fae91a1713f0a_71_0.png)\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main () {\n\n    char\
    \ greet = \"Welcome\";\n    cout << greet << \"\\n\";\n}\n```\n\n![](img/588364e02a77f179099fae91a1713f0a_71_1.png)\n\
    \n- 步骤 2 很容易将字符串与数组混淆。这里有一个数组，可以用空字符终止：\n\n- 步骤 4 还有一个字符串函数，其工作方式相同。再次使用字符串代码，\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main () {\n\n    char\
    \ greet[8] = {'W', 'e', 'l', 'c', 'o', 'm', 'e', '\\0'};\n    cout << greet <<\
    \ \"\\n\";\n}\n```\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint\
    \ main () {\n\n    string greet = \"Welcome\";\n    cout << greet << \"\\n\";\n\
    }\n```\n\n![](img/588364e02a77f179099fae91a1713f0a_71_2.png)\n\n- 步骤 5 还有许多适用于字符串的不同操作。例如，字符串的长度你可以使用：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n    string\
    \ greet = \"Welcome\";\n    cout << \"The length of the string is: \" <<\n}\n\
    ```\n\n- 步骤 8 正如你预期的，你可以将整数混合在字符串中。在这个例子中，我们创建了 `length`，它存储了 `size()` 的结果并输出：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    string\
    \ greet1 = \"Hello\";\n    string greet2 = \" world!\";\n    string greet3 = greet1\
    \ + greet2;\n    length = greet3.size();\n    cout << \"combined strings is: \"\
    \ << length;\n}\n```\n\n- 步骤 6 你可以通过 `size()` 输出长度，如果你需要调用它，就需要更改命令。编译并运行代码查看结果：\n\
    \n```\nC:\\Users\\david\\Documents\\Document1.cpp\nThe length of the string is:\
    \ 7\nProcessed (0x) execution time : 0.04 s\nPress any key to continue.\n```\n\
    \n- 步骤 9 使用字符串的可用操作，你可以操作字符串的内容。从字符串中删除字符你可以使用：\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main() {\n    string str = \"Here is a long sentence\
    \ in a string\";\n    cout << str << \"\\n\";\n    str.erase(10, 5);\n    cout\
    \ << str << \"\\n\";\n    str.erase(str.begin()+8);\n    cout << str << \"\\n\"\
    ;\n    str.erase(str.begin()+9, str.end());\n    cout << str << \"\\n\";\n}\n\
    ```\n\n- 步骤 7 你可以将字符串相加，或者说将它们组合形成字符串：\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n    string greet1 = \"Hello\";\n    string greet2 = \" world!\"\
    ;\n    string greet3 = greet1 + greet2;\n    cout << greet3 << \"\\n\";\n}\n```\n\
    \n- 步骤 10 值得花些时间研究数字，即字符串中的字符位置。可能会对也可能错，所以要练习。查看截图中的代码结果：\n\n```\nC:\\Users\\\
    david\\Documents\\Document1.cpp\nHere is a long sentence in a string.\nHere is\
    \ a sentence in a string.\nHere is a string.\nProcessed (0x) execution time :\
    \ 0.051 s\nPress any key to continue.\n```\n\n# C++ 数学\n\n编程本质上是数学性的，正如你预期的，有很多内置范围来处理数学问题。C++\
    \ 为在代码中实现数学模型的人提供了很多选择。它可以非常复杂，也可以相对简单。\n\n# C++ =\n\n基础数学符号在 C++ 中的应用与大多数编程语言一样。然而，通过使用\
    \ C++ 数学库，你还可以计算平方根、幂、三角函数等。\n\n- C++ 数学运算遵循学校教授的相同模式，即乘除法的优先级高于加减法。你也可以修改这一点。现在，创建一个文件并输入：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    float numbers\
    \ = 100;\n    numbers = numbers + 10;  // 给初始值加上 10\n    cout << \"\\n\";\n  \
    \  numbers = numbers - 10;  // 从新值中减去 10\n    cout << \"\\n\"\n}\n```\n\n- 乘法和除法可以这样应用：\n\
    ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    float numbers\
    \ = 100;\n    numbers = numbers * 10;  // 将 100 乘以 10\n    cout << \"\\n\";\n\
    \    numbers = numbers / 10;  // 将 1000 除以 10\n    cout << \"\\n\"\n}\n```\n\n\
    虽然简单，但它让你热身了基础数学。我们对变量使用了 `float`。虽然你可以使用整数，但如果你想使用小数，就需要根据所需的精度将其改为 `float` 或\
    \ `double`。运行代码查看。\n\n再次，虽然代码并不特别有趣，但运行它并查看结果。这是 C++ 数学的开始。我们使用了 `float`，所以你可以玩转代码并乘以小数，以及除法、加法和减法。\n\
    \n![](img/588364e02a77f179099fae91a1713f0a_73_0.png)\n\n"
