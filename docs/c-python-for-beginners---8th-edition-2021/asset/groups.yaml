    \n# 认识 Python\n\n## 了解 Python\nPython 是创造以来最强大的计算机编程语言。它让你以一种简洁且易于理解的语言充分利用计算机的力量。\n\
    \n## 什么是编程？\n在尝试学习编程语言之前，了解什么是编程语言是有帮助的，让我们看看 Python 是如何产生的以及它与其他语言的关系。\n\n![](img/588364e02a77f179099fae91a1713f0a_11_0.png)\n\
    \n# 编程食谱\n程序就像计算机的食谱。\n\n- 在碗里放入 100 克泡松粉。\n- 在碗里加入 100 克奶油。\n- 加入 100 毫升牛奶。\n\
    - 烘烤半小时。\n\n编程语言是计算机遵循的指令列表。这些指令可以简单到保存或播放文件，也可以复杂到构建一个世界。Python 在 20 世纪 80 年代后期由\
    \ Guido Rossum 在荷兰 Centrum Wiskunde 想出，作为 ABC 语言的继承者。\n\n> Guido Rossum，Python\
    \ 之父。\n\n就像食谱一样，程序由你顺序遵循的指令组成。程序描述了蛋糕运行可能像什么：\n\n```python\ncake = []\nflour =\
    \ 100\nbutter = 50\nmilk = 100\ncake.append([flour,butter,milk])\ncake.cake()\n\
