    ## 使用注释


    虽然注释在组合并制作游戏、应用程序甚至整个操作系统的许多代码行中似乎是一个不足道的元素，但事实上它们可能是最重要的因素之一。


    ### 注释的重要性


    代码中的注释基本上是对代码在特定点执行操作的人类可读描述。它们听起来并不特别重要，但没有注释的代码对于专业人士或初学者来说都是令人沮丧的。


    简而言之，代码应该通过注释有效地描述某个部分或单个元素的目的。你应该养成尽可能注释的习惯，以便对编程一无知的人也能理解你的代码。


    在专业环境中，注释对代码的成功至关重要。在组织中，经理与工程师、其他开发者、硬件分析师一起工作。如果你是开发团队的一员，注释可以帮助许多其他人跟进那些处理跨多个模块的
    80 万行代码的足迹。最好的注释是简洁的，并将代码连接起来，说明程序运行到某个部分时会发生什么。你不需要对每一行都进行注释。但是，如果某些内容极大地改变了程序，正如你已经用尽了行数，它确实需要注释。即使你只是为了与他人分享，通过这种方式你也可以回来并始终理解哪里出了问题。注释需要练习，一旦你理解了如何添加注释，它很快就会你的本性。


