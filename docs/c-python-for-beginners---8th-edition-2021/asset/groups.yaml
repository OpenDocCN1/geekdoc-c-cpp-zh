    # # User Input


    We''ve seen some basic user interaction with the code from a few of the examples
    earlier, so now would be a good time to focus solely on how you would get information
    from the user then and present it.


    # ## USER FRIENDLY


    The type of input you want from the user will depend greatly on the type of program
    you''re coding. For example, a game might ask for a character''s name, whereas
    a database can ask for personal details.


    +   - STEP 1 If it''s not already, open the Python 3 IDLE Shell, create a New
    File in the Editor. Let''s begin with something simple, enter:


    ```

    print("Hello")

    firstname=input("What is your name? ")

    print("Thanks")

    surname=input("What is your surname? ")

    ```


    +   - STEP 3 Now that we have the user''s name stored in a couple of variables
    we can call them whenever we want:


    ```

    print("Welcome", firstName, surname, ". I hope you''re well today.")

    ```


    +   - STEP 2 Save and execute the code, and as you already no doubt suspected
    it, in the IDLE Shell the program will ask for your first name, storing it as
    the variable firstName, followed by your surname, stored in another variable:


    +   - STEP 4 Run the code and you can see a slight issue, the full stop after
    the surname leaves a blank space. To eliminate that we can add a plus sign instead
    of the comma in the code:


    ```

    print("Welcome"

    ```


