    \ 5 步** 你可能需要通过 Windows 身份通知确认安装。点击“是”，Python 就会安装。安装完成后，最后的 Windows 页面将允许你查看最新的发布说明，并遵循一些在线教程。\n\
    \n**第 6 步** 在关闭安装窗口之前，最好点击“禁用路径长度限制”旁边的链接。这将允许你绕过 260 个字符的限制，能够执行存储在深层目录中的 Python\
    \ 程序。再次点击“是”激活该过程；然后就可以关闭安装窗口。\n\n**第 7 步** Windows 10 用户现在会在“开始”按钮的“最近添加”部分找到已安装的\
    \ Python 3.x。第一个链接 Python 3.6 (32位) 点击后将启动 Python 的命令行版本。要打开 IDLE，在 Windows 开始菜单中输入\
