    What you have done here is assigning the letters a and b values: 2 and 2. These
    are variables, which can be called upon Python to output, add, subtract, and so
    on for long as their numbers stay the same. Try this:


    print(a)


    ```

    ### Python 3.4.2 Shell

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    Type "copyright", "credits" or "license" for more information.

    >>> print("Hello")

    Hello

    >>> a=2

    >>> b=2

    >>> print(a+b)

    4

    >>> print(a-b)

    0

    >>> print(a*b)

    4

    >>> print(a/b)

    1.0

    ```


    # STEP 8


    Let''s add a surname:


    ```

    surname="Hayward"

    print(surname)

    ```


    You have two variables containing a first name and a surname and you can print
    them independently.


    ```

    ### Python 3.4.2 Shell

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    Type "copyright", "credits" or "license" for more information.

    >>> print("Hello")

    Hello

    >>> name="David"

    >>> surname="Hayward"

    >>> print(name)

    David

    >>> print(surname)

    Hayward

    ```


    # STEP 6


    The output of the last steps confirms the values of a and b individually, as you''ve
    asked to be printed separately. If you want to add them up, use the following:


    print(a+b)


    This code simply takes the values of a and b, adds them and outputs the result.


    ```

    ### Python 3.4.2 Shell

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    Type "copyright", "credits" or "license" for more information.

    >>> print("Hello")

    Hello

    >>> a=2

    >>> b=2

    >>> print(a+b)

    4

    >>> print(a-b)

    0

    >>> print(a*b)

    4

    >>> print(a/b)

    1.0

    ```


    # STEP 9


    If we were to apply the same routine as before, using the + symbol, the name wouldn''t
    appear correctly in the Shell. Try it:


    print(name+surname)


    You need a space between the two, defining them as separate values and not mathematically
    as you play around.


    ```

    ### Python 3.4.2 Shell

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    Type "copyright", "credits" or "license" for more information.

    >>> print("Hello")

    Hello

    >>> name="David"

    >>> surname="Hayward"

    >>> print(name+surname)

    DavidHayward

    ```


    # STEP 10


    In Python 3 you can separate the two variables with a space, comma:


    print(name, surname)


    Alternatively, you can add the space yourself:


    print(name + " " + surname)


    The use of the comma is much easier, as you can see.

    nCongratulations, you''ve just taken your first steps into the world of Python.


    ```

    ### Python 3.4.2 Shell

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    Type "copyright", "credits" or "license" for more information.

    >>> print("Hello")

    Hello

    >>> name="David"

    >>> surname="Hayward"

    >>> print(name, surname)

    David Hayward

    ```


    You can play with different kinds of variables and the Function. For example,
    consider someone''s name:


    name="David"


    print(name)


    ```

    ### Python 3.4.2 Shell

