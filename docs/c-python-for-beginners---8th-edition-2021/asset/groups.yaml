    # C++ 基础


    ![](img/588364e02a77f179099fae91a1713f0a_57_0.png)


    # C++ 基础


    在本节中，你可以开始理解 C++ 代码的结构以及如何编译和执行这些代码。这些是 C++ 的基础，将教你一些基础知识，如使用注释、变量、数据类型、字符串以及如何使用
    C++ 数学运算。


    这些是 C++ 程序的构建块。通过它们，你可以构建自己的代码，向屏幕输出内容，并存储和检索数据。


    ## 你的第一个 C++ 程序


    你之前可能已经看过 Mac 和 Linux 的示例，但从现在开始，你将专门在 Windows 环境和 Code::Blocks 中工作。让我们从编写你的第一个
    C++ 程序开始，迈向更大世界的第一小步吧。


    ## 你好，世界！


    在编程中，传统的做法是第一个代码在屏幕上输出“Hello, World!”字样。有趣的是，这可以追溯到 1968 年使用的一种种名为 BCPL 的语言。


    - **第一步** 正如所述，书中后续的 C++ 代码我们都使用 Windows 10 和最新版本的 Code::Blocks。首先启动 Code::Blocks。点击
    File（文件） > New（新建） > Empty File（空文件）或在键盘上按 Ctrl+Shift+N。


    ![](img/588364e02a77f179099fae91a1713f0a_59_0.png)


    - **第三步** 目前看起来没什么，甚至没什么意义，但我们会到时候提到的。现在点击 File（文件） > Save As（另存为）。在你的硬盘上创建或找到
    helloworld.cpp，在 File Name（文件名）框中，点击 Save as type（保存类型）框并选择 C++ files。点击 Save（保存）按钮。


    ![](img/588364e02a77f179099fae91a1713f0a_59_1.png)


    - **第二步** 现在你可以看到一个空白屏幕，标签为 Untitled1 的选项页，以及 Code::Blocks 主窗口左上角的数字。首先点击主窗口，让光标位于数字一旁边，并输入：

    `#include <iostream>`


    ![](img/588364e02a77f179099fae91a1713f0a_59_2.png)


    你可以看到 Code::Blocks 了颜色编码，识别出该文件现在是 C++ 代码。这意味着代码可以从 Code::Blocks 仓库中自动选择。删除 `include
    <iostream>` 行并重新输入。你可以看到自动选择框的出现。


    ![](img/588364e02a77f179099fae91a1713f0a_59_3.png)


    ## 你的第一个 C++ 程序


    步骤 5 命令的自动选择非常有用，可以避免潜在的拼写错误。按 Return 键到达第 3 行，然后输入：


    步骤 8 再次注意颜色编码的变化。在上一步的行尾按 Return 键，然后输入：


    ```cpp

    int main()

    ```


    注意：括号之间没有空格。


    ```cpp

    std::cout << "Hello, world!\n";

    ```


    ![](img/588364e02a77f179099fae91a1713f0a_60_0.png)


    ![](img/588364e02a77f179099fae91a1713f0a_60_1.png)


