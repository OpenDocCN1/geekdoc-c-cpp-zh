    第 6 步从数字的平方根开始：


    ```cpp

    #include <iostream>

    #include <cmath>

    using namespace std;

    ```


    第 9 步我们创建了一个值为 12 的 float 变量，以及一个 2（幂）。当然，你可以使用变量来计算幂和平方根。例如，在代码的第一个值中使用 `pow(12,
    2)`。


    ```cpp

    int main() {

    float number = 134;

    cout << "The square root of " << number << " is: " << sqrt(number) << "\n";

    }

    ```


    | | Startex x Maths.cpp |

    |---|---|

    | 1 | #include <iostream> |

    | 2 | #include <cmath> |

    | 3 | using namespace std; |

    | 5 | int main () |

    | 7 | float number = 134; |

    | 8 | cout << "The square root of " << number << " is: " << sqrt(number) << "\n";
    |

    | 10 | |


    第 10 步圆周率的值也存储在数学库中。它可以通过 `M_PI` 函数调用。在代码中输入 `M_PI`，你就会得到 3.14159，或者你可以用它：


    ```cpp

    #include <iostream>

    #include <cmath>

    using namespace std;

    int main () {

    double radius = 1.5;

    double area = M_PI * radius * radius;

    cout << area << "\n";

    }

    ```


    第 7 步在这里创建了一个新的 float 常数 `number`，并使用 `sqrt(function)` 显示 134 的平方根，即变量的值。编译并运行你的代码，你得到
    11.5758。


