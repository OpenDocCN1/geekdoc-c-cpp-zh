    # 向 Python 问好


    有很多不同的编程语言可以学习和使用。有些非常复杂且功能强大，而有些则很基础。


    本书的前半部分帮助你开始使用最新版本的 Python，并从那里引导你使用一些最常见和有趣的功能和特性。不久之后，你将编写自己的实用系统工具、文字冒险，甚至控制角色在屏幕上移动。


    # 为什么选择 Python？


    ## Python 的力量？


    其中一些语言是为科学工作设计的，有些是为了移动平台等。


    从我们拥有的最早计算机出现起，爱好者、用户和专业人士一直通宵劳作，在过热的电路上方彻夜不眠，以创造类似于魔法的东西。


    这些先驱开辟了新的疆域，创建了小型程序，让字母“A”能够在屏幕上划过。对于习惯了超高定义图形和开放世界多人游戏的这一代人来说，这听起来可能没什么不起。


