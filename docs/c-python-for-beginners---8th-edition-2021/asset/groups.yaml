    # C++ 数学


    第 5 步当你调用 C++ 数学库时，有趣的数学内容就出现了。在这个头文件中包含了几十个数学函数以及其他函数。从余弦到双参数的正切，再到圆周率的值。你可以通过方式调用该头文件：


    第 8 步计算数字的幂可以使用：


    ```cpp

    #include <iostream>

    #include <cmath>

    using namespace std;

    int main () {


    }

    ```


    ```cpp

    #include <iostream>

    #include <cmath>

    using namespace std;

    int main () {

    float number = 12;

    cout << number << " to the power of 2 is " << pow(number, 2) << "\n";

    cout << number << " to the power of 3 is " << pow(number, 3) << "\n";

    cout << number << " to the power of .08 is " << pow(number, 0.08) << "\n";

    }

    ```


