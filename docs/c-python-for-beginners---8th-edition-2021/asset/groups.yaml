    \ `g++ helloworld.cpp` 并按回车。\n\n![](img/588364e02a77f179099fae91a1713f0a_54_0.png)\n\
    \n![](img/588364e02a77f179099fae91a1713f0a_54_1.png)\n\n- 第 9 步：通过 g++ 编译代码需要很短的时间，只要代码中没有错误，你就可以返回命令行提示符。在终端中看到你的\
    \ C++ 文件已生成输出。\n\n![](img/588364e02a77f179099fae91a1713f0a_54_2.png)\n\n![](img/588364e02a77f179099fae91a1713f0a_54_3.png)\n\
    \n- 第 10 步：文件已编译为 C++。要运行代码输入 `./a.out` 并返回。屏幕上出现了“Hello World”字样。然而，a.out 并不友好。要让其他输出重新编译，使用\
    \ `g++ helloworld.cpp -o helloworld`。这将创建一个输出文件，可以通过 `./helloworld` 运行。\n\n![](img/588364e02a77f179099fae91a1713f0a_54_4.png)\n\
    \n![](img/588364e02a77f179099fae91a1713f0a_54_5.png)\n\n## 其他 C++ IDE\n\n如果你正在寻找\
    \ C++ IDE，这里是一些流行的选项：\n\n- **Eclipse**：一个强大的开源 IDE，通过插件支持许多语言，包括 C++。\n- **NetBeans**：以其用户友好的界面著称，它也支持\
    \ C++ 开发。\n- **Code::Blocks**：一个轻量级且免费的 IDE，非常适合初。\n- **Visual Studio Code**：一个现代代码编辑器，具有优秀的\
    \ C++ 扩展，使其非常强大。\n- **GNAT**：为需要极高性能的用户提供的专业级开发环境。\n- **CodeLite**：一个快速且轻量级的 IDE，非常适合小型项目。\n\
