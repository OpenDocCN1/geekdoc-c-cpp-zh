    # # Working with Variables


    We''ve seen some examples of variables in our Python code already but it''s always
    worth going through the way they operate and how Python creates and assigns certain
    values to a variable.


    # ## VAR VARIABLES


    You''ll be working with the Python 3 IDLE Shell in this tutorial. If you haven''t
    already, open Python 3 or close down the previous IDLE Shell to clear up any code.


    +   - STEP 1 In some programming languages you''re required to use a dollar sign
    to denote a string, which is a variable made of multiple characters, such as the
    name of a person. In Python this is not necessary. In the Shell enter: name="David
    Howard" (or use your own name, unless you also David Howard).


    +   - STEP 3 You''ve seen previously that variables can be concatenated using
    the plus symbol between the variables names. In our example we can use: print(name
    + " "). The middle part between quotations allows us to add a colon and a space,
    as variables are connected without spaces, so we need to add them manually.


    ```

    Python 3.4.2 (default, Oct 19 2014, 12:31:11)

    >>> type(''copyright'', ''credits'' or ''license'') for more information.

    >>> print(name)

    David Howard

    >>> David Howard

    ```


    +   - STEP 2 You can check the type of variable in use by issuing the type( )
    command, placing the name of the variable inside the brackets. In out this would
    be: type(name). Add a new string variable: title="Descended from Vikings".


    +   - STEP 4 You can also combine variables within another variable. For example,
    to combine both name and title variables into a new variable we:


    ```

    Python 3.4.2 (default, Oct 19 2014, 12:31:11)

    >>> type(''copyright'', ''credits'' or ''license'') for more information.

    >>> print(name)

    David Howard

    >>> type(name)

    <class ''str''>

    >>> title="Descended from Vikings"

    David Howard Descended from Vikings

    ```


    Then the output of the new variable as:


    ```

    print(character)

    ```


    Numbers are stored as different:


    ```

    age=44

    Type (age)

    ```


    Which, as we know, are integers.'
