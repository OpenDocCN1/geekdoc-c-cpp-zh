  - '[PAGE 6]


    # Say Hello to Python


    There are many different programming languages available to learn and use. Some
    are complex and incredibly powerful and some are extremely basic and used as minor
    utilities for operating systems. Python sits somewhere in the middle, combining
    ease of use with a generous helping of power that allows the user to create minor
    utilities, a range of excellent games and performance-heavy computational tasks.


    However, there''s more to Python than simply being another programming language.
    It has a vibrant and lively community behind it that shares knowledge, code and
    project ideas; as well as bug fixes for future releases. It''s thanks to this
    community that the language has grown and thrived and now it''s your turn to take
    the plunge and learn how to program in Python.


    The first half of this book helps you get started with the latest version of Python
    and from there guide you on how to use some of the most common and interesting
    functions and features of the language. Before long, you will be able to code
    your own helpful system tools, text adventures and even control a character as
    they move around the screen.'
  - '[PAGE 7]


    # Say Hello to Python


    # # Why Python?


    There are many different programming languages available for the modern computer,
    and some still available for older 8 and 16-bit computers. Some of these languages
    are designed for scientific work, others for mobile platforms and such. So why
    you choose Python out of all of the rest?


    # ## PYTHON POWER


    Ever since the earliest computers we have around, enthusiasts, users and professionals
    have toiled away the wee hours, sleeping over an overheating heat of circuitry
    to create something akin to magic.


    These pioneers carved their way into a new frontier, forging small routines that
    enabled the letter ''A'' to scratch the screen. May not sound terribly to a generation
    that''s used to ultra-high definition graphics and open world, multi-player gaming
    brilliantly.


    Regardless of whether you use an Android device, iOS device, PC, Mac, Linux, Smart
    TV, games console, MP3 player, GPS device built-in to a car, set-top box or a
    thousand other connected ''smart'' appliances, them all is programming.


    All aforementioned digital devices need instructions to tell them what to do,
    and allow them to be interacted with. These instructions forming the core of the
    device and can be built using a variety of programming.


    Naturally these bedroom coders helped form the foundations for every piece of
    digital technology we use today. Some went to become chief developers for software
    companies, others pushed the available hardware to limits and founded the gaming
    empire that continues to amass.


    The languages in use today differ depending on the situation, the platform, the
    device and how its device will interact with


    ![](img/588364e02a77f179099fae91a1713f0a_7_0.png)


    C++ is usually reserved for more operations, operating, games, and so on.'
