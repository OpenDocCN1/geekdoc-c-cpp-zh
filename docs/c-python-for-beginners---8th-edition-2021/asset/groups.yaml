    - **STEP 3** When you''ve reached the licensing terms, there is a choice to Agree
    to allow to make changes.

    - **STEP 4** After you''ve done, Xcode launches, including the additional components.

    - **STEP 5** With everything now installed, Xcode displays the main interface.
    The left-hand pane details the files in the C++ program.

    - **STEP 6** Start by clicking on New Xcode Project; this opens a window to choose
    the platform macOS, then click the Command Line Tool option.

    - **STEP 7** Fill in the various fields but ensure that the Language option at
    the bottom is set to C++; choose it from the drop-down list.

    - **STEP 8** The next step asks where to create a Git Repository for future projects.
    Choose a location on Mac, and click Create.

    - **STEP 9** You can see that Xcode has automatically completed a basic Hello
    World program for you. While it may not make sense at present, you will discover
    more as you progress.

    - **STEP 10** When you want to run the code, click on Product > Run. On the Mac:
    you may be asked to enable Developer Mode to perform functions without needing
    your password every session. When the program executes, the output is displayed
    at the bottom of the Xcode window.

