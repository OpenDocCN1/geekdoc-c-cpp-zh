  md: '# # How to Set Up Python on a Mac


    If you''re running an Apple Mac, setting up Python is incredibly easy. In fact
    that a version of Python is already installed. However, you should make sure you''re
    running the latest version.


    # ## INSTALLING PYTHON


    Apple''s operating system comes with Python installed, so you don''t need to install
    it separately. However, Apple doesn''t update Python very often and it makes sense
    to check and update first.


    +   **STEP 1** Open a new Terminal by clicking Go > Utilities, then double-click
    the Terminal icon. Now enter `--version`. You should see "Python 2.5.1" or even
    later, if Apple has updated the OS and Python installation. Either way, it''s
    best to check for the latest.


