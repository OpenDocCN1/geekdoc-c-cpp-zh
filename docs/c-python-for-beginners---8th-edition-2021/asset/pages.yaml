  md: "# # Conditions and Loops\n\nConditions and loops are what makes a program interesting;\
    \ they can be simple or rather complex. How you use them depends greatly on what\
    \ the program is trying to achieve; they could be the number of lives left in\
    \ a game or just displaying a countdown.\n\n# ## TRUE CONDITIONS\n\nKeeping conditions\
    \ simple to begin with makes learning to program a more enjoyable experience.\
    \ Let's start then by checking if something is TRUE, then doing something if it\
    \ isn't.\n\n+   * STEP 1 We create a new Python program that will ask the user\
    \ to input a word, then check to see if it's a four-letter word or not. Start\
    \ with File -> New File, and begin with the input:\n\n```\n```python\nword=input(\"\
    Please enter a four-letter word: \")\n```\n```\n\n![](img/588364e02a77f179099fae91a1713f0a_39_0.png)\n\
    \n+   * STEP 2 We can create a new variable, then use the len function and pass\
    \ the word through it to get the number of letters the user has entered:\n\n```\n\
    ```python\nword=input(\"Please enter a four-letter word: \")\nword_length=len(word)\n\
    ```\n```\n\n+   * STEP 3 Now you can use an if statement to check if the word\
    \ is four-letter and print a friendly confirmation if it applies to the rule:\n\
    \n```\n```python\nword=input(\"Please enter a four-letter word: \")\nword_length=len(word)\n\
    if word_length == 4:\n    print(\"is a four-letter word. Well done.\")\n```\n\
    ```\n\nThe double equals (==) means check if something is something else.\n\n\
    +   * STEP 4 The colon at the end of if tells Python that the statement is true\
    \ after the colon the word matches. Next, move the cursor to the beginning of\
    \ the Editor:\n\n```\n```python\nword=input(\"Please enter a four-letter word:\
    \ \")\nword_length=len(word)\nif word_length == 4:\n    print(\"is a four-letter\
    \ word. Well done.\")\nelse:\n    print(\"is not a four-letter word.\")\n```\n\
    ```\n\n![](img/588364e02a77f179099fae91a1713f0a_39_1.png)"
