  md: "# ## C++ COMMENTS\n\nCommenting in C++ involves using a double forward slash\
    \ //, or a forward slash and an asterisk, /*. You've already seen some brief examples\
    \ but this is how they work.\n\n+   STEP 1 Using the Hello World code as an example,\
    \ you can easily comment on different sections of the code using the double forward\
    \ slash:\n\n```\n//My first C++ program\ncout << \"Hello, world!\\n\";\n\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n\n    // My first C++ program\n\
    \    cout << \"Hello, world!\\n\";\n\n}\n```\n\n+   STEP 4 Be careful when commenting,\
    \ especially with blocks. It's very easy to forget to add the asterisk and forward\
    \ slash thus negate any code that falls inside the comment block.\n\n```\nHelloWorld.cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main() {\n    cout << \"Hello,\
    \ world!\\n\";\n    cout << \"And greetings from C++\";\n\n    // cover lines\n\
    \    cout << \"This line is now ignored by the compiler!\";\n\n}\n```\n\n+   STEP\
    \ 2 You can also add comments to the end of a line of code, to describe in a better\
    \ way what's going on:\n\ncout << \"Hello, world!\\n\"; //This line outputs the\
    \ words 'Hello, world!'. The \\n denotes a new line.\n\nNote, you cannot put a\
    \ semicolon at the end of a comment. This's because the line of code is then ignored\
    \ by the compiler.\n\n```\nHelloWorld.cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main() {\n    // This line process\n    cout << \"Hello, world!\\\
    n\"; //This compares the Hello, world. This is\n\n}\n```\n\n+   STEP 5 If you\
    \ obviously try and add comment, complaining of a messy curly bracket ] off the\
    \ block of code. If you need a few lines, then it can be time to go back and retry.\
    \ Frankly, colouring the code in Code:Blocks helps identify comments.\n\n```\n\
    HelloWorld.cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n  \
    \  // My comment\n    cout << \"Hello, world!\\n\";\n    cout << \"And greetings\
    \ from C++\";\n\n    // This comment can\n    without the need to add more lines\n\
    \    cout << \"This line is now ignored by the compiler!\";\n\n}\n```\n\n+   STEP\
    \ 3 You can comment out several lines by using the slash and asterisk:\n\n> *\
    \ This comment can cover several lines without the need to add more lines /*\n\
    \nJust remember to finish the comment block with the opposite asterisk and slash.\n\
    \n```\nint main() {\n\n    // My first process\n    cout << \"Hello, world!\\\
    n\";\n    cout << \"And greetings from C++\";\n\n    // This comment can\n   \
    \ several lines\n    without the need to add more lines /*\n\n}\n```\n\n+   STEP\
    \ 6 If you're using blocks, it's good practice in C++ to add an asterisk to each\
    \ new line of the comment block. This also helps you to remember the comment block\
    \ before continuing the code:\n\n> * This comment can cover several lines without\
    \ the need to add more lines /*\n\n```\nint main() {\n\n    cout << \"Hello, world!\\\
    n\";\n    cout << \"And greetings from C++\";\n\n    // cover lines\n    without\
    \ the need to add more lines /*\n    cout << \"This line is now ignored by the\
    \ compiler!\";\n\n}\n```"
