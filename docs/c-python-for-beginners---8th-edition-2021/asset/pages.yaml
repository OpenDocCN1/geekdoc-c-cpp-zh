- pgno: 61
  md: "# Structure of a C++ Program\n\nC++ has a very well defined structure and way\
    \ of doing things. Miss something out, even as small as a semicolon, and your\
    \ entire program will fail to be compiled and executed. Many a professional programmer\
    \ has fallen foul of sloppy structure.\n\n# #INCLUDE <C++ STRUCTURE\n\nLearning\
    \ the basics of programming, you begin to understand the structure of a program.\
    \ The commands may be different from one language to the next, but you will start\
    \ to see how the code works.\n\n| C++ | #INCLUDE *helloworld.cpp |\n|---|---|\n\
    | C++ was invented by Danish student Bjarne Stroustrup in 1979, as part of his\
    \ Ph.D. thesis. Initially C++ was called C with Classes, which added features\
    \ to the popular C language, while making it a more user-friendly environment\
    \ through a new structure. | The structure of a C++ code is quite precise. Every\
    \ C++ code begins with a directive: **#include** the pre-processor to include\
    \ a section of the C++ code. For example: **#include <iostream>** includes the\
    \ iostream header to support input/output operations. |\n 1 #include <iostream>\
    \ |\n 2 |\n 3 |\n 4 |\n 5 |\n 6 |\n\nBjarne Stroustrup, inventor of C++.\n\n#\
    \ INT MAIN()\n\nint main() initiates the declaration of a function, which is a\
    \ group of code statements under the name 'main'. All C++ code begins at the main\
    \ function, regardless of where it actually lies within the code.\n\n| Start here\
    \ | *helloworld.cpp |\n|---|---|\n 1 #include <iostream> |\n 2 |\n 3 int main()\
    \ |\n 4 |\n 5 |\n 6 |\n\n# BRACES\n\nThe open brace (curly brackets) is something\
    \ that you may not come across before, especially if you're used to Python. The\
    \ open brace indicates the beginning of the main function and contains all the\
    \ code that belongs to that function.\n\n| #include <iostream> |\n 1 |\n 2 int\
    \ main() |\n 3 |\n 4 { |\n 5 |\n 6 } |\n\n![](img/588364e02a77f179099fae91a1713f0a_61_0.png)"
  merge: -1
  img_proc: true
- pgno: 62
  md: "# Structure of C++ Program\n\n# COMMENTS\n\nLines with a double slash are comments.\
    \ This means they won't be executed in the code and are ignored by the compiler.\
    \ Comments are designed to help you, or another programmer looking at your code,\
    \ explain what's going on. There are two types of comment: // covers multiple\
    \ line comments, // means they won't be executed and are ignored by the compiler.\n\
    \n<< The chevrons used here are insertion operators. This means that whatever\
    \ follows the chevrons is to be inserted into the std::cout statement. In this\
    \ case they're 'Hello, world!' which are to be displayed on the screen when you\
    \ compile and execute the code.\n\n```\n#include <iostream>\nint main() {\n  \
