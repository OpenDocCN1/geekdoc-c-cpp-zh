  md: "# C++ Maths\n\nProgramming is mathematical in nature and as you might expect,\
    \ there is plenty of built-in scope for some quite intense maths. C++ has a lot\
    \ to offer someone who is implementing mathematical models into their code. It\
    \ can be extremely complex or relatively simple.\n\n# C++ = MC²\n\nThe basic mathematical\
    \ symbols apply in C++ as they do in most other programming languages. However,\
    \ by using the C++ Math Library, you can also calculate square roots, powers,\
    \ trig and more.\n\n+   C++ mathematical operations follow the same patterns as\
    \ taught in school, in that multiplication and division takes precedence over\
    \ addition and subtraction. You can also alter that. For now, create a new file\
    \ and enter.\n\n```\n#include <iostream>\nusing namespace std;\nint main() {\n\
    \    float numbers = 100;\n    numbers = numbers + 10;  // This adds 10 to the\
    \ initial\n    cout << \"\\n\";\n    numbers = numbers - 10;  // This subtracts\
    \ 10 from the new\n    cout << \"\\n\"\n}\n```\n\n+   Multiplication and division\
    \ can be applied as such:\n#include <iostream>\nusing namespace std;\nint main()\
    \ {\n    float numbers = 100;\n    numbers = numbers * 10;  // This multiplies\
    \ 100\n    cout << \"\\n\";\n    numbers = numbers / 10;  // And divides 1000\
    \ by\n    cout << \"\\n\"\n}\n\nWhile simple, it does the old maths warmed up.\
    \ We used a float for the variables. While you can use an integer, if you to use\
    \ decimals, you would need to change it to a float or double, depending on the\
    \ accuracy needed. Run the code and see.\n\nAgain, while not particularly interesting,\
    \ the code and see the results. It's a start into C++ maths. We used a float,\
    \ so you can play around with the code and multiply by decimal places, as well\
    \ as divide, add and subtract.\n\n![](img/588364e02a77f179099fae91a1713f0a_73_0.png)\n\
    \n```\n#include <iostream>\nusing namespace std;\nint main() {\n    float numbers\
    \ = 100;\n    numbers = numbers * 10;  // This multiplies 100 by 10\ncout << \"\
    \\n\"\n    numbers = numbers / 10;  // And divides 1000 by 10\ncout << \"\\n\"\
    \n}\n```\n\n```\nProcess returned (0x) execution time : 0.043 s\nPress any key\
    \ to continue.\n```\n\n```\nProcess returned (00) execution time : 0.050 s\nPress\
    \ any key to continue.\n```\n\n![](img/588364e02a77f179099fae91a1713f0a_73_1.png)"
