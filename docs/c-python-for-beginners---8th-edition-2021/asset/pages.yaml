  md: "# STEP 5\n\nThere are also many different operations that you\napply with the\
    \ string function. For instance,\nget the length of a string you use:\n\n```\n\
    #include <iostream>\nusing namespace std;\nint main() {\n    string greet = \"\
    Welcome\";\n    cout << \"The length of the string is: \" <<\n    cout << greet.size()\
    \ << \"\\n\";\n}\n```\n\n# STEP 8\n\nJust as you might expect, you can mix in\
    \ an integer\nand store something to do with the string. In this\nexample, we\
    \ created int length, which stores the result of string\nsize() and outputs it\
    \ to the:\n\n```\n#include <iostream>\nusing namespace std;\nint main() {\n  \
    \  int length;\n    string greet1 = \"Hello\";\n    string greet2 = \" world!\"\
    ;\n    string greet3 = greet1 + greet2;\n    length = greet3.size();\n    cout\
    \ << \"The length of the combined strings\nis: \" << length << \"\\n\";\n}\n```\n\
    \n# STEP 6\n\nYou can see that with getsize() to output the\nlength, the number\
    \ of characters there are, of\ncontents of the string. Naturally, if you call\
    \ your string\nother than greet, then you need to change the command\nitname.\
    \ Build and run the code to see\nthe results:\n\n```\nC:\\Users\\Document\\Document1.cpp\n\
    The length of the string is: 7\nProcess returned (0x0) execution time : 0.004\
    \ s\nPress any key to continue.\n```\n\n# STEP 9\n\nUsing the available operations\
    \ that come with the\nstring, you can manipulate the contents of a\nstring. To\
    \ remove characters from a string you could use:\n\n```\n#include <iostream>\n\
    using namespace std;\nint main() {\n    string str = \"Here is a long sentence\
    \ in a string\";\n    cout << str << \"\\n\";\n    str.erase(10,5);\n    cout\
    \ << str << \"\\n\";\n    str.erase(str.begin()+8);\n    cout << str << \"\\n\"\
    ;\n    str.erase(str.begin()+9, str.end()-9);\n    cout << str << \"\\n\";\n}\n\
    ```\n\n# STEP 7\n\nYou can add strings together, or rather\ncombine them to form\
    \ strings:\n\n```\n#include <iostream>\nusing namespace std;\nint main() {\n \
    \   string greet1 = \"Hello\";\n    string greet2 = \" world!\";\n    string greet3\
    \ = greet1 + greet2;\n    cout << greet3 << \"\\n\";\n}\n```\n\n# STEP 10\n\n\
    It's worth spending some time around\nthe numbers, where the character positions\n\
    in the string. It can be hit or miss whether you get it\nright, so practice makes.\
    \ Take a look at the screenshot to\nthe result of code:\n\n```\nC:\\Users\\Document\\\
    Document1.cpp\nHere is a long sentence in a string.\nHere is a sentence in a string.\n\
    Here is a string.\nProcess returned (0x0) execution time : 0.051 s\nPress any\
    \ key to continue.\n```"
