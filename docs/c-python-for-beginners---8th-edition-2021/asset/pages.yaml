  md: '# STEP 5


    What you have done here is assigning the letters a and b values: 2 and 2. These
    are variables, which can be called upon Python to output, add, subtract, and so
    on for long as their numbers stay the same. Try this:


    print(a)


    ```

    ### Python 3.4.2 Shell

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    Type "copyright", "credits" or "license" for more information.

