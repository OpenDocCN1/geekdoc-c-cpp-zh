  md: "# Why C++?\n\nC++ is one of the most popular programming languages available\
    \ today. Originally called C with Classes, the language was renamed C++ in 1983.\
    \ It's an extension of the original C language and is a general purpose object-oriented\
    \ OOP environment.\n\n# C EVERYTHING\n\nDue to how complex the language can be,\
    \ and its power and performance, C++ is often used to develop games, device drivers\
    \ and even entire operating systems.\n\nDating back 1970, the start of the era\
    \ of home computing, C++, or rather with Classes, was the brainchild of Danish\
    \ scientist Bjarne Stroustrup while working on his PhD thesis. Stroustrup's plan\
    \ was to further the original C language, which was widely used since the early\
    \ seventies.\n\ncomputing labs and by regular people who didn't have access to\
    \ the mainframes and large computing data centres.\n\nC++ proved to be popular\
    \ among the developers of the '80s, since it was a much easier environment to\
    \ get grips with and more importantly, it was 99% compatible with the original\
    \ C language. It meant that it could be used beyond the mainstream\n\nC++s impact\
    \ in the digital world is immense. Many of the programs, applications, games and\
    \ even operating systems are coded using C++. For example, all of Adobe's applications,\
    \ Photoshop, InDesign and so on, are developed in C++. You will find that the\
    \ browser you surf the Internet is written in C++, as well as Windows 10, Microsoft\
    \ Office and the backbone to Google's search engine. Apple's macOS is written\
    \ largely in C++ (with some\n\n+   C++ code is much faster than that of Python.\n\
    \n```\n#include<iostream>\nusing namespace std;\nvoid main() {\n    char ch;\n\
    \    cout<<\"Enter a character to check if it is vowel or not\";\n    switch (ch)\
    \ {\n        case 'a': case 'A':\n            cout<<ch<<\" is a Vowel\";\n   \
    \         break;\n        case 'e': case 'E':\n            cout<<ch<<\" is a Vowel\"\
    ;\n            break;\n        case 'i': case 'I':\n            cout<<ch<<\" is\
    \ a Vowel\"\\n            break;\n        case 'o': case 'O':\n            cout<<ch<<\"\
    \ is a Vowel\"\\n            break;\n        case 'u': case 'U':\n           \
    \ cout<<ch<<\" is a Vowel\"\\n            break;\n    }\n```"
