  md: '# HIGH-LEVEL LANGUAGES


    Computer languages that are easy to read are known as "high-level". This is because
    they fly high above the hardware (also referred to as "the metal") Languages that
    "fly close to the metal," like Assembly, are known as "low-level". Low-level languages
    are hard to read like this: `msg db len eq $ - md`


    # ZEN OF PYTHON


    Python lets you access all the power of a computer in a language that humans can
    understand. Behind all this is an called "The Zen of Python." This is a collection
    of 20 software principles that influence the design of language. Principles "Beautiful
    is better than ugly" and "Simple is better than complex." Type import this and
    it will display all princes.


    ![](img/588364e02a77f179099fae91a1713f0a_12_0.png)


    # PYTHON 3 VS PYTHON 2


    In a typical computing scenario, Python is complicated by the existence of two
