  md: "# Strings\n\nStrings are objects that represent and hold sequences of characters.\
    \ For example, you could have a universal greeting in your code 'Welcome' and\
    \ assign that as a string to be called up wherever you like in the program.\n\n\
    # STRING THEORY\n\nThere are different ways in which you can create a string of\
    \ characters, which historically are all carried over from the original C language,\
    \ and are still supported by C++.\n\n+   STEP 1 To create a string using the char\
    \ function. Open a new C++ file and begin with the usual header:\n\n+   STEP 3\
    \ Build and run the code, and 'Welcome' appears on the screen. While this is perfectly\
    \ fine, it's not a string. A string is a class, which defines objects that can\
    \ be represented as a stream of characters and doesn't need to be terminated by\
    \ an array. The code can therefore be represented as:\n\n```\n#include <iostream>\n\
    using namespace std;\n\nint main () {\n\n    char greet = \"Welcome\";\n    cout\
    \ << greet << \"\\n\";\n}\n\n```\n\n![](img/588364e02a77f179099fae91a1713f0a_71_0.png)\n\
    \n```\n#include <iostream>\nusing namespace std;\n\nint main () {\n\n    char\
    \ greet = \"Welcome\";\n    cout << greet << \"\\n\";\n}\n\n```\n\n![](img/588364e02a77f179099fae91a1713f0a_71_1.png)\n\
    \n+   STEP 2 It's easy to confuse a string with an array. Here's an array, which\
    \ can be terminated with a null character:\n\n+   STEP 4 There's also a string\
    \ function, which works in the same way. Using the string code again,\n\n```\n\
    #include <iostream>\nusing namespace std;\n\nint main () {\n\n    char greet[8]\
    \ = {'W', 'e', 'l', 'c', 'o', 'm', 'e', '\\0'};\n    cout << greet << \"\\n\"\
    ;\n}\n\n```\n\n```\n#include <iostream>\nusing namespace std;\n\nint main () {\n\
    \n    string greet = \"Welcome\";\n    cout << greet << \"\\n\";\n}\n\n```\n\n\
    ![](img/588364e02a77f179099fae91a1713f0a_71_2.png)\n\n![](img/588364e02a77f179099fae91a1713f0a_71_3.png)"
  merge: -1
