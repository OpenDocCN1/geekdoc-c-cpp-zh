  md: '# STEP 5


    You don''t always have to include quoted text within the input command. For example,
    you can ask the user''s name, and have the input in the line below:


    ```

    print("Hello. What''s your name?")

    name=input()

    ```


    ![](img/588364e02a77f179099fae91a1713f0a_36_0.png)


    ```

    Edit File Format Run Options Windows Help

    print("Hello. What''s your name?")

    name=input()

    ```


    # STEP 8


    What you''ve created here is a condition, which we will cover soon. In short,
    we''re using the input from user and measuring it against a condition. So, if
    the user enters David as their name, the guard will allow them to pass unharmed.
    Else, if they enter a name other than David, the guard challenges them to a fight.


    ![](img/588364e02a77f179099fae91a1713f0a_36_1.png)


    ```

    Edit File Format Run Options Windows Help

    print("Hello. What''s your name?")

    name=input()

    ```


    # STEP 6


    The code from the previous step is often criticized as being a little nessa than
    having a lengthy amount of text in the input command, but it''s not a rule that''s
    set in stone, so do you like in these situations. Expanding the code, this:


    ```

    print("Wait who goes there?")

    name=input()

    ```


    ![](img/588364e02a77f179099fae91a1713f0a_36_2.png)


    ```

    Edit File Format Run Options Windows Help

    print("Wait who goes there?")

    name=input()

    ```


    # STEP 9


    Just as you learned previously, any input from is automatically a string, so you
