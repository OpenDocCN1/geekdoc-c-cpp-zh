  md: "# C++ Fundamentals\n\n# Data Types\n\nVariables, as we've seen, store information\
    \ that the programmer can then call up, and manipulate if needed. Variables are\
    \ simply reserved memory locations where the values the programmer assigns, depending\
    \ on the data type used.\n\n# THE VALUE OF DATA\n\nThere are many different data\
    \ types available for the programmer in C++, such as integer, floating point,\
    \ Boolean, character and so on. It's widely accepted that there are seven basic\
    \ data types, often called Built-in Types; however, you can create your own data\
    \ types as need arise within the code.\nThe seven basic data types are:\n\n| TYPE\
    \ | COMMAND |\n|---|---|n| Integer | Integer |\n| Floating Point | float |\n|\
    \ Character | char |\n| Boolean | bool |\n| Double Floating Point | double |\n\
    | Wide Character | char_t |\n| No Value | void |\n\nThese basic types can also\
    \ be extended using the following modifiers: Long, Short, and Signed. Basically\
    \ this means they can expand the minimum and maximum range for each data type.\
    \ For example, the int data type has a default range of -2147483648 to 2147483647,\
    \ a fair value, you would agree.\n\nNow, if you were to use one of the modifiers,\
    \ the ranges alter:\nununsigned int = 0 to 4294967295\nint = -2147483648 to 2147483647\n\
    short = -32768 to 32767\nunsigned short = 0 to 65535\nsigned short = -32768 to\
    \ 32767\nint = -2147483648 to 2147483647\nunsigned int = 0 to 4294967295\n\nNaturally\
    \ you can get away with using the basic type without the modifier, as there's\
    \ plenty of range provided with each data type. However, it's good C++ programming\
    \ practice to use the modifiers when needed.\n\nThere are issues when using the\
    \ modifiers. Double represents a double-floating point, which you can use for\n\
    \n```\n#include <iostream>\nusing namespace std;\ndouble PI = 3.14159265358979323463;\n\
    int main() {\n    cout << PI;\n}\n```\n\n```\n#include <iostream>\nusing namespace\
    \ std;\ndouble PI = 3.14159265358979323463;\nint main() {\n    cout << PI;\n}\n\
    ```\n\n```\n/* C:\\Users\\Documents\\DataTypes.cpp */\nProcess returned (0) execution\
    \ time: 0.054 s\nPress any key to continue.\n```\n\nBuild and run the code so\
    \ you can see the output is 3.14159, representing double's limitations in precision.\n\
    \nYou can also limit the code using the aforementioned cout.precision function,\
    \ for greater accuracy. Precision all the way up to 22 decimal places, with the\
    \ following code:\n\n```\n#include <iostream>\nusing namespace std;\ndouble PI\
    \ = 3.14159265358979323463;\nint main() {\n}\n```"
