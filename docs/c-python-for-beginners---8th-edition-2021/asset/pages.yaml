    \n# LOOPS\n\nA loop looks quite similar to a condition but they are somewhat different\
    \ in their operation. A loop will run through the block of code of times, usually\
    \ with the support of a condition.\n\n# STEP 1 Let's start with a simple While\
    \ statement. If, this will check to see if something is TRUE, then the indented\
    \ code:\n\n```\nx = 10\nwhile x > 0:\n    print(x)\n    x = x - 1\n```\n\n# STEP\
    \ 3 The loop is another example. For is used to loop over a range of data, usually\
    \ a list stored in variables inside square brackets. For:\n\n![](img/588364e02a77f179099fae91a1713f0a_40_2.png)\n\
    \n![](img/588364e02a77f179099fae91a1713f0a_40_3.png)\n\n# STEP 2 The difference\
    \ between if and while is when the indented code it goes back to the end of the\
    \ indented code, checks the statement is still true. In an example x is 10. With\
    \ each loop it prints the current value of x, then adds one to that value. When\
    \ x eventually equals 10 it\n\n# STEP 4 The loop can also be used in the countdown\
    \ example by using the range function:\n\n```\nfor x in range(1, 10):\n    print(x)\n\
    ```\n\nThe x=1 part isn't needed here because the range function creates a list\
