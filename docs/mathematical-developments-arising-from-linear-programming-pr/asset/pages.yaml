    # 3. Analysis of connectivity properties


    Throughout this section, $f$ is a function from an open subset $U \subset \mathbb{R}^n$
    to $R$.


    > DEFINITION. A point $x \in U$ is called a local minimum of the function $f$
    if there exists a neighborhood $N$ of $x$, $N \subseteq U$, such that $f(y) >
    f(x)$ for all $y \in N, y \neq x$.


    It is known that a first-order method such as the steepest descent method and
    a second-order method such as Newton''s method for function convergence converge
    to a strict local minimum when started sufficiently close to it, for a $C^2$ function.


    > DEFINITION. A point $x \in U$ is called a global minimum of the function $f$
    over $U$ for all $y \in U$,


    $$f(y) \geq f(x)$.


    > DEFINITION. A point $x \in U$ is called a spurious local minimum of the function
    $f$ over $U$ if it is a strict local minimum of $f$ but not a global minimum of
    $f$ over $U$, and the function $f$ has a global minimum over $U$.


    The steepest descent method and Newton''s method can converge to a spurious local
    minimum and thus fail to find a global minimum.


