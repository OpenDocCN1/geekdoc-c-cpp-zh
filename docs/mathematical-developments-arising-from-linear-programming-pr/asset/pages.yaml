  md: "# 118 R. J. VANDERBEI AND J. C. LAGARIAS\n\nThe other two claims follow immediately\
    \ from the following statement:\n\nLEMMA. For any $n$-vector $\\gamma$, the function\
    \ $w^\\gamma(x) = (AD_2^2A^T)^{-1}AD_2^2\\gamma$ is bounded.\n\nTo prove this\
    \ lemma, we use Cramer's rule and the Cauchy-Binet theorem to write the $i$th\
    \ component as follows:\n\n```\n(8)\nw^\\gamma = \\frac{\\sum_{1\\le j_1 < \\\
    cdots < j_m \\le n} x_{j_1} \\cdots x_{j_m}^2 \\det[a_{j_1}, \\cdots, a_{j_m}]\
    \ \\det[a_1, \\cdots, \\gamma, \\cdots, a_m]}{\\sum_{1\\le j_1 < \\cdots < j_m\
    \ \\le n} x_{j_1} \\cdots x_{j_m}^2 \\det[a_{j_1}, \\cdots, a_{j_m}]^2}\n```\n\
    \nwhere $\\det_{j_1, \\cdots, j_m}(a_1, \\cdots, a_m)$ denotes the determinant\
    \ of the $m \times m$ matrix obtained by selecting columns $j_1, \\cdots, j_m$\
    \ from the $n \times n$ matrix whose rows are the $n$-vectors $\\alpha_1, \\cdots,\
    \ \\alpha_m$ and where $a_i$ denotes the $i$th row of $A$. To bound this expression,\
    \ we use the following inequality:\n\n```\n\\frac{\\sum_{i=1}^N r_i^2}{\\sum_{i=1}^N\
    \ s_i^2} \\le \\max \\frac{|r_i|^2}{s_i^2}\n```\n\nwhich is valid for any sequence\
    \ of sequences with $s_i > 0$. Since terms in the numerator (8) vanish whenever\
    \ terms in the denominator vanish, we can use this simple inequality to bound\
    \ the following:\n\n```\n|w^\\gamma(x)| \\le \\max_{1\\le j_1 < \\cdots < j_m\
    \ \\le n, \\text{denom} \\neq 0} \\frac{\\det[a_{j_1}, \\cdots, j_m](a_1, \\cdots,\
    \ \\gamma, \\cdots, a_m)}{\\det[a_{j_1}, \\cdots, j_m](a_1, \\cdots, a_m)}\n```\n\
    \nThe right-hand side is independent of $x$ and hence furnishes a bound.\n\n#\
    \ 5. Dikin's proof\n\nThe ideas, methods, and results presented in this paper\
    \ stem directly from Dikin's work. However, there are a few minor gaps in Dikin's\
    \ paper that we have rectified here. The first is that the limiting nonbasic reduced\
    \ costs are positive (Step 9) before he showed that the dual variables converge\
    \ (Step 8). His argument is extremely tight and combined with his proof that the\
    \ nonbasic components of $x$ converge to zero (Step 7), so it seems that at the\
    \ very least we were leaving a lot to the reader. In any case, the proof of Step\
    \ 9 certainly depends on the result of Step 8. Mike Todd has a proof for Step\
    \ 9 that does not depend on Step 8, but the proof given here is easier.\n\nThe\
    \ other difficulty is that in Steps 6, 8, and 11, where the boundedness of $(AD_2^2A^T)^{-1}$\
    \ is needed, Dikin argues that the desired result follows from Cramer's rule and\
    \ the Cauchy-Binet theorem. We do not see how it is possible to establish the\
    \ boundedness of this matrix using that approach."
