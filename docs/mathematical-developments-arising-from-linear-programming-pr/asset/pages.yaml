    +   5. The limiting behavior of the projective scaling trajectories $(r^* > 0)$


    In this section, we consider the limiting behavior of the projective scaling trajectories
    for the case when the optimal value $r^*$ of problem $(P)$ is positive. In this
    case, the projective scaling trajectories do not converge to an optimal solution
    of problem $(P)$. Instead, we show that they converge to a unique point $w^* \in
    W_1$ that minimizes the so-called Karmarkar potential function over $W_1$ as follows:


    ```

    $P(x) = n \ln c^T x - \sum_{j=1}^n \ln x_j$

    ```


    This fact was implicitly proved in Section 9 of [14] under the assumption that
    problem $(P)$ is primal nondegenerate.

    OBSERVATION 5.1. Even though the function $P(x)$ is not strictly convex over $W_1$,
    the function


    ```

    $Q(x) = \exp P(x) = \frac{(c^T x)^n}{\prod_{j=1}^n x_j}$

    ```


    is strictly convex over $W_1$. For a proof of this fact, we say $Q(x)$, and $P(x)$,
    has a unique minimizer $w^*$ over $W_1$. Also, the minimizer $w^*$ is completely
    characterized by Karush-Kuhn-Tucker conditions for the problem $\min\{P(x)|x \in
    W_1\}$.


    Before stating the main result of this section, we need to introduce a lemma that
    is an immediate consequence of the results of Section 2.


    Lemma 5.1. Assume that the optimal value of problem $(P)$ is positive and let
    $x: I \to S_1$, where $I = (0, a)$ be a solution curve of (2.4). Then,


