  md: '# Some Results Concerning Convergence of the Affine Scaling Algorithm


    ABSTRACT. Several authors, for example [2] and [6], have advocated the use of
    a big-M technique to simplify the problem of finding a feasible starting point
    for the affine scaling algorithm. In this paper we point out a difficulty with
    convergence that can arise when this method is used. We propose a method for avoiding
    this difficulty. We also prove a convergence result for the affine scaling algorithm
    applied to the Phase I problem. Unlike earlier proofs, this one does not require
    the problem to be nondegenerate.


    # 1. Introduction


    Consider the linear programming problem


    ```

    $minimize c^T x$

    subject to $Ax = b$

    $x \ge 0$

    ```


    where $c$ and $x$ are $n$-dimensional column vectors, $A$ is an $m \times n$ matrix,
    and $b$ is an $m$-dimensional column vector. We assume that the feasible region
    for this problem has a nonempty interior and that the problem has a bounded solution.
    The affine scaling algorithm for solving this problem begins with a strictly positive
    vector $x^0$, satisfying $Ax^0 = b$, and iterates as follows.


    If $x^k > 0$ satisfying $Ax^k = b$ is given, define and compute


    ```

    $D_k = \text{diag}(x_1^k, \dots, x_n^k)$

    n$\lambda_k = (AD_k^2 A^T)^{-1} AD_k^2 c$.

    ```


    Take


    ```

    $x^{k+1} = x^k - \frac{D_k^2(c - A^T \lambda_k)}{||D_k(c - A^T \lambda_k)|}$

    ```'
