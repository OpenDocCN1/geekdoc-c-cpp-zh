  md: '# A KANTOVICH INEQUALITY AND NEWTON''S METHOD


    Let $f$ be defined by the formula $f(x) = x - (DF)^{-1}(x_0)F(x)$. Since $f(x_0)
    = x_1$ and $f(x_1) = x_1 - (DF)^{-1}(x_0)F(x_1),


    $$(DF)^{-1}(x_0)F(x_1) = f(x_0) - f(x_1).$$


    By the generalized mean value theorem of Graves [7]


    $|f(x_1) - f(x_0)\| \le \sup \|f''(\xi)\| : t \in (0, 1)$ and $\xi = x_0 + (1-t)x_1
    \|x_1 - x_0\|.$


    But


    $$$\sup \|f''(\xi)\| = \sup \|I - (DF)^{-1}(x_0)DF(\xi)\|$\n\sup \|(Df)^{-1}(x_0)DF(x_0)
    - DF(\xi)\| = \gamma_1 \le \gamma_2.$


    Thus


    (2.1)

    $\eta_1 = \|(DF)^{-1}(x_1)F(x_1)\| = \|H^{-1}(DF)^{-1}(x_0)F(x_0)\| \le \gamma_1
    \|H^{-1}\| \|x_1 - x_0\|,$


    whence


    $$$\frac{\gamma_1}{1-\gamma_1}}\eta_0 \le \frac{\gamma_2}{2}.$$


    Assume that $x_2, x_3, \dots, x_n$ also belong to $S$. Then


    (2.2)

    $\eta_n \le \frac{\gamma_1}{1-\gamma_1}} \frac{\gamma_2}{1-\gamma_2}} \dots \eta_{n-1}
    \le (\frac{1}{2})^n \eta_0,$


    and


    $|DF(x_n)\| \le (\frac{1}{3})^n \|DF(x_0)\|$


    To complete the induction we show that $x_{n+1} \in S$. The triangle inequality
    gives


    $|x_{n+1} - x_0\| \le \eta_n + \eta_{n+1} + \dots + \eta_{n+p} \le \eta_n (1 +
    \frac{1}{2} + \frac{1}{4} + \dots + \frac{1}{2^n}) \le 2\eta_n.$


    Similarly we have


    $|x_{n+p} - x_n\| \le \eta_n + \eta_{n+1} + \dots + \eta_{n+p} < 2\eta_n.$


    Since $\{\eta_n\}$ converges to 0, the sequence $\{x_n\}$ is Cauchy with limit,
    say $x^*$, and we get claim (ii). We also have (iii) since


    $$$F(x_n) = -DF(x_{n+1})F(x_n).$$


    Thus,


    $$$|F(x_n)\| \le (\frac{1}{3})^n \|DF(x_0)\| \eta_n. \square$


    Lemma 2 can be used to prove the quadratic convergence of Newton''s method under
    the stronger assumption of Lipschitz continuity of $DF$, provided the bound $\gamma(x_0)
    < \frac{1}{3}$ holds. Indeed, if $\|(DF)^{-1}(x)\|$ is bounded on $\{x_n\}$ then
    there exists a $L$ such that


    $$\gamma_{n+1} \le L\eta_n.$'
