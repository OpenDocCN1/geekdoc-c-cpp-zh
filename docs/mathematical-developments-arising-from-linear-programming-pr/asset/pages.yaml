  md: '# STEEPEST DESCENT, LINEAR PROGRAMMING, AND HAMILTONIAN FLOWS


    that J here just [P,]. Thus J acting on [P, C] gives [P, [P, C]]! For further
    details see [9] and [11].


    Thus the equations P=[P, [P, C]] solve the linear programming problem associated
    with the TLS problem. We recall from Section 4 that the fact that solving the
    TLS problem reduces to linear programming follows also from a result in Hamiltonian
    systems, the convexity of the moment map associated with a torus action.


    Note that if we take p to be rank 1, p=iz⊗Z, z=(z1,...,zn), the equations for
    |z_j| are precisely Moser''s equations (3.3)! (For further details see [9] and
    [11]).


    In work of the author with R. Brockett, H. Flaschka, and J. Ratiu, some of the
    ideas have above have been used to give new results on the gradient-flow and convexity
    properties of the generalized (Lie-algebraic) Toda lattice equations. (See [10]
    and [11]). There is also an infinite-dimensional (partial differential equations)
    version of these results. (See [14]).


    In conclusion, we remark that this paper has explored a number of different connections
    between gradient flows, integrable Hamiltonian systems, and linear programming.
    There appears to be a rich interplay between these subjects, which we intend to
    explore further. As far as the Hamiltonian structure is concerned, a key feature
    is the noncompactness of level sets and the resultant “scattering” behavior of
    the flows. Numerically, a common feature is that the algorithms explore the interior
    of a relevant polytope in moving towards a solution.


