  md: '# THEOREM 4.4. $E_{m,n}(s^C) \leq 2(n+1)^2$ under the Sign-Invariance Model
    (4.1) where $s^C$ is the number of pivot steps required for the complete method.


    This result was derived in the papers of Todd and Adler/Megiddo by a very skillful
    choice of the start vector in Lemke''s algorithm (compare Section 2). They chose
    a vector $(\delta, \delta^2, \delta^3, \dots, \delta^{m-n}) \in R^{m-n}$ with
    $\delta > 0$ arbitrarily small to have an initial representation. They realized
    the so-called Lexicographic-Lemke Algorithm. The advantage of this algorithm comes
    from the fact that we have good control over which side is entered and left.


    Closer to our geometrical interpretation is the method used in the paper of Adler/Karp/Shamir,
    so the-called Lexicographic Constraint-by-Constraint Method. This algorithm works
    directly in the original space as follows:


    +   - Initialization: Define a basic solution $x_\Delta$ with $\Delta=\{1, \dots,
    n\}$ and choose $u$ (the objective making $ux$ optimal) as $u = \delta a_1 + \delta^2
    a_2 + \dots + \delta^n a_n$ with $\delta > 0$ arbitrarily small. Then $x_\Delta$
    is an optimal vertex on $X^{(n)}$ $= \{x | x^1 \leq b^1, \dots, x^n \leq b^n\$.

    - Typical steps: Start at $x$, the optimal vertex for $u^T x$ on $X^{(n+k-1)}
    = \{x | x^1 \leq b^1, \dots, x^{n+k-1} \leq b^{n+k-1}\}$. If $a_{n+k}^T x \leq
    b^{n+k}$ then $x$ is u-optimal on $X^{(n+k)} = \{x | x^1 \leq b^1, \dots, x^{n+k}
    \leq b^{n+k}\}$. We proceed to the next step.

    If $a_{n+k}^T x > b^{n+k}$, then use the shadow-vertex algorithm to minimize $a_{n+k}^T
    x$ on $X^{(n+k-1)}$ until $a_{n+k}^T x \leq b^{n+k}$ is achieved. All path points
    are $(u, -a_{n+k}^T)$ cooptical, the first point on our path with $a_{n+k}^T x$
    on $X^{(n+k-m)}$ maximizes $u^T x$ on $X^{(k-m}$. If it is impossible to achieve
    $a_{n+k}^T x \leq b^{k}$, then the original problem was infeasible.

    - Final step: We start at $x$, which is u-maximal on $X^{(m)}=X$. We apply the
    shadow-vertex algorithm to maximize $u^T x$ on $X$.


    This amounts to $(m-n+1)$-fold application of the shadow-vertex-algorithm. The
    very tricky choice of $u$ at the initial step enabled Adler, Karp, and Shamir
    to show that the expected number of pivot steps is only $O(n)$ or $O(n^2)$.


    In the paper by Adler/Megiddo, it was shown that slight additional conditions
    on the distributions of the entries of $a$ suffice to establish a lower bound
    on the average behavior such as $\sigma^2$ with $\delta > 0$.


    Although the algorithms used in [11], [2] were fundamentally different, they realized
    exactly the same simplex paths [13] on nondegenerate problems. As observed in
    probabilistic analysis of algorithms, one must be careful in the interpretation
    of the results and be aware of the the stochastic assumptions.'
