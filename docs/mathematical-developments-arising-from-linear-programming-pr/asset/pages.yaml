    In the analysis I published in 1984 [6], the number of iterations of the projective
    algorithm was bounded by O(n) to obtain a reduction in the objective function
    by a factor 2^{-L}. Subsequently, many variants of the basic procedure have been
    proven to have O(\sqrt{n}-L) bound [13]. However, the number of iterations of
    the projective algorithm appears to be much fewer, perhaps even O(max(L, log n)).
    Efforts to understand the reasons for such many iterations lead naturally into
    questions in differential geometry.


    # 1.2. Continuous trajectories. In the discrete trajectory defined before the
    next point in the sequence is obtained by following a certain distance the direction
    computed at each step. Instead, if we were to follow the direction an infinitesimal
    distance and make a new transformation to obtain a new direction, we would get
    the “continuous” or infinitesimal analogue of the discrete algorithm. If the discrete
    form of the method produces an iteration of the type


    ```

    x^{(k+1)} - x^{(k)} + \alpha \cdot x^{(k)} + O(\alpha^2)

    ```


    then by taking as \alpha \rightarrow 0, we get the infinitesimal version, whose
    continuous trajectories are given by the differential equation


    ```

    \frac{dx}{d\alpha} = v.

    ```


    Here, v as a function of x defines a vector field. For the projective method,
    the differential equation is


    ```

    (1.2.1) \frac{dx}{dt} = -[D - xx^T]P_{AD} \cdot Dc,

