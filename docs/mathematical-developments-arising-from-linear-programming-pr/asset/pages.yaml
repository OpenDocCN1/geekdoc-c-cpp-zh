  md: '# A PRIMIMAL-DUAL INTERIOR POINT METHOD FOR LINEAR PROGRAMMING 127


    and it ignores the extra constraints in (3.1) and (3.2) with $M_D$ and $M_p$ on
    the right-hand side. If the search parameter $\alpha^k$ can be set to $\alpha^k
    = 1$ (independent of $\mu^k$) on some iteration $k$ with $x^{k+1} > 0$ and $z^{k+1}
    > 0$, then primal and dual feasible solutions have been found, and the algorithm
    can revert to its original form by using equations (2.3) and (2.4).


    # 4. Properties of limiting feasibility directions


    The directions given by equations (3.20) satisfy the following two properties,
    which are easy to verify:


    ```

    (4.1a) $A\dot{p}_x^1 = -x_{n+1}d_p$;

    ```


    ```

    (4.1b) $A^T\dot{p}_y^1 + \dot{p}_z^1 = -y_{n+1}d_D$;

    ```


    Equation (4.1a) indicates that the search direction for the primal variables $x$
    and the artificial variable $x_{n+1}$ is in the null space of the equality constraints
    (3.21). Equation (4.1b) indicates that the search direction for the dual variables
    $y$ and $z$ and the artificial variable $y_{n+1}$ is in the null space of $A$.
    Equation (3.22) decreases the value of $x_{n+1}$ and increase the value of $y_{n+1}$.
    (Recall that $x_{n+1}^0 = 1$ and $y_{n+1}^0 = -1$).


    The directions given by (3.20) also satisfy the set of equations


    ```

    (4.2a) $Z\dot{p}_x^1 + X\dot{p}_z^1 = ZE$;

    ```


    ```

    (4.2b) $A\dot{p}_x^1 + d_p x_{n+1} = 0$,

    ```


    ```

    (4.2c) $A^T\dot{p}_y^1 + \dot{p}_z^1 + d_D y_{n+1} = 0$.

    ```


    This system indicates that the limiting feasibility directions are the Newton
    directions for the system


    ```

    (4.3a) $Ze = 0$,

    ```


    ```

    (4.3b) $Ax + d_p(x_{n+1}) = b$,

    ```


    ```

    (4.3c) $A^T y + z + d_D(y_{n+1}) = c$,

    ```


    ```

    (4.3d) $x_{n+1} = 0$,

    ```


    ```

    (4.3e) $y_{n+1} = 0$.

    ```


    It is clear that an algorithm based on using the limiting feasibility directions
    will decrease the amount of infeasibility of primal and dual linear programs (as
    measured by $x_{n+1}$ and $y_{n+1}$) on each iteration. Hence, this monotonic
    decrease suffices to prove that the algorithm will converge. However, proving
    that the algorithm converges to primal and dual feasible points (or determining
    that either problem is infeasible) is difficult. The proof of convergence of an
    algorithm based on these new directions is currently an open problem.'
