  md: "# I. I. DIKIN'S CONVERGENCE RESULT FOR THE AFFINE-SCALING ALGORITHM\n\nTo see\
    \ that this last sum converges absolutely, we use exactly the same argument as\
    \ in the previous step, except that $\\sigma_{ij}$ we get something similar.\n\
    \n```\n$$\\rho_{ij}(x) = e_j^T D_x^T (AD_x^T A^T)^{-1} N_e$$\n```\n\nIn the previous\
    \ section, we found a bound for $\\sigma_{ij}(x)$ that was valid throughout $\\\
    Omega$. Here we settle for slightly less: we only need to show that $\rho_{ij}(x)$\
    \ is bounded along the sequence $x^k$. This follows from the fact that $x^k$ converges\
    \ and $(AD_x^T A^T)^{-1}$ is bounded. This completes the proof for the case where\
    \ $\\Omega$ is assumed to be bounded.\n\n# 4. Proof without compactness\n\nThe\
    \ boundedness assumption (in conjunction with primal nondegeneracy) was used in\
    \ three places:\n\n+   1. In Step 5, showing that the dual variables $w(x)$ is\
    \ bounded.\n2. In Steps 6, 8, and 11, showing that $(AD_x^T A^T)^{-1}$ is bounded.\n\
    3. In Step 10, showing that the function $\\sigma_{ij}(x)$ is bounded.\n\nWe will\
    \ now show that the boundedness assumption is not necessary for any of these three\
    \ statements to hold and that primal nondegeneracy is not necessary for the first\
    \ and third.\n\nWe begin with the claim that $(AD_x^T A^T)^{-1}$ is bounded. Let\
    \ $\\Omega$ denote the compact set consisting of the convex hull of the polytope\
    \ of $\\Omega$. Any point $x$ in $\\Omega$ can be written as $x = \tilde{x} +\
    \ \tilde{t}$, where $\tilde{x}$ belongs to $\\Omega$ and $\tilde{t} \\geq 0, \t\
    ilde{A} = 0$. Hence, $AD_x^T A^T \\geq AD_{\tilde{x}}^T A_{\tilde{x}}$ in the\
    \ sense that the difference is positive semidefinite. Therefore, $\\lambda_1(x)\
    \ \\geq \\lambda_1(\tilde{x})$, where $\\lambda_1(x)$ denotes the smallest eigenvalue\
    \ of $AD_x^T A^T$. Primal nondegeneracy and compactness of $\\Omega$ imply that\
    \ $\\lambda_1(x) \\geq \tilde{\\lambda}_1 > 0$ for all $x \\in \\Omega$. Since\
    \ the $L^2$ norm of $(AD_x^T A^T)^{-1}$ is bounded,\n\n```\n$|(AD_x^T A^T)^{-1}|_2\
    \ = \\frac{1}{\\lambda_1(x)} \\leq \\frac{1}{\\lambda_1(\tilde{x})} \\leq \\frac{1}{\t\
    ilde{\\lambda}_1} < \\infty.$\n```\n\nEven though we have removed the boundedness\
    \ assumption on $\\Omega$, we still have used primal nondegeneracy. This is essential,\
    \ as the following example shows:\n\n```\n$$\\min x_1$$\n$$x_1 - x_2 = 0$$\n$$x_1\
    \ \\geq 0, \\quad x_2 \\geq 0.$$\n```\n\nClearly, $(x_1, x_2) = (0, 0)$ is a point\
    \ in the polytope at which $(AD_x^T A^T)^{-1} = 1/(x_1^2 + x_2^2)$ blows up."
