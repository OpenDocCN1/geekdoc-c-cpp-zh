    Since $\|y\|_p^p$ is a convex function the problem has a solution $y^*$. Then
    $y^*$ is characterized by the Lagrange multiplier conditions


    ```

    $$-p|x_j - y_j^*|^{p-2}(x_j - y_j^*) + \lambda a_j = 0.$$

    ```


    Hence


    ```

    (1) \n p|x_j - y_j^*|^{p-2}(x_j - y_j^*) = \lambda a_j,$$

    ```


    and therefore


    ```

    $|x_j - y_j^*|^p = (a x_j - a_j y_j^*) \frac{\lambda_j}{p}$.

    ```


    Summing both sides of the above equation from $j=1$ to $n$ and taking absolute
    values we have


    ```

    $$\|x - y^*\|_p^p = |a^T x - b| \frac{|\lambda|}{p}$$

    ```


    Taking logarithms of both sides yields


    ```

    $$p \ln \|x - y^*\|_p = \ln |a^T x - b| + \ln \frac{|\lambda|}{p}$$

    ```


    Here, for the given bounded polytope $P$,


    ```

    (2) \\sum_{i=1}^m d(x, H_i)_p = (\frac{1}{p}) \sum_{i=1}^m \ln |a_i^T x - b_i|
    + (\frac{1}{p}) \sum_{i=1}^m \ln \frac{|\lambda_i|}{p}$$

    ```


    where $d(x, H_i)_p$ describes the distance of $x$ from the hyperplane $H_i$ with
    respect to the $\ell^p$ metric in $\mathbf{R}^n$, and $\lambda_i$ is the Lagrange
    multiplier of the $i$th constraint. By Equation 1 we have


    ```

    $$\frac{|x_j - y_j^*|^p}{(x_j - y_j^*)} = \lambda a_j.$

    ```


    Squaring both sides yields


    ```

    $$\frac{p^2(x_j - y_j^*)^{2p}}{(x_j - y_j^*)^2} = \lambda^2 a_j^2.$

    ```


    Hence


    ```

    $$(x_j - y_j^*)^{2p-2} = \frac{\lambda^2 a_j^2}{p^2},\n (x_j - y_j^*) = \frac{\lambda^{1/(2p-2)}}{p^2}
    a_j^{2/(2p-2)},\n (a_j x_j - a_j y_j^*) = \frac{\lambda^2}{p^2} a_j^{p/(p-1)}.$

    ```'
