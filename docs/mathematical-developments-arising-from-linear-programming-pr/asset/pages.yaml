  md: "# CANONICAL PROBLEMS FOR QUADRATIC PROGRAMMING\n\nfunction evaluations, which\
    \ is $O(n^2)$ for $(P)$ and $O(n^3)$ for $(GP)$ (since a projection matrix may\
    \ be computed). As we have seen under convexity assumption, Procedure $W$ is capable\
    \ of solving $(P)$. This is interesting, it implies that linear programming can\
    \ be solved with inexpensive iterations. It is also worth mentioning that Procedure\
    \ $W$ in the case of $(P)$ admits parallelization quite naturally, since each\
    \ function evaluation requires the multiplication of a matrix by a vector. However,\
