    \ still the\nworse-case analysis applies. (In practical implementations one takes\
    \ bigger\nsteps than the complexity analyses allow.) Ye has since shown that those\n\
    extend to \"projective\" algorithms. In another direction, in early 1988\nthe\
    \ linear programming community in the West discovered that the affine\nscaling\
    \ algorithm was proposed in 1967 by the Soviet mathematician I. I.\nDikin, and\
    \ that he published a proof of convergence in it 1974. R. J.\nVanderbei and J.\
    \ C. Lagarias gave an exposé of Dikin's proof of convergence,\nwhich applies under\
    \ the assumption of primal nondependency. One of the\ndiffulties of interior-point\
    \ methods is that they require linear programs to\nbe transformed to a form that\
    \ comes with an initial feasible solu-\ntion. The paper of I. Lustig presents\
    \ a new method for obtaining an initial\nfeasible point for a linear program and\
    \ its. E. Barnes discusses another\nmethod for obtaining a feasible starting point\
    \ for the affine scaling algorithm\nand gives a convergence result for this algorithm.\
    \ The paper of K. Anstre-\nich considers ellipsoids containing optimal solutions\
    \ for a projective\nscaling interior point method in the case of primal degeneracy.\
    \ A. Asić,\nVovač-Vujčić, and M. Radosavljević-Nikolić analyze the asymptotic\n\
    behavior of Karmarkar's algorithm, obtaining results for degenerate lin-\near\
    \ programs. They also propose a rounding method to go from an interior\nfeasible\
    \ point to the exact optimal solution.\n\nSection 3 presents results on the trajectories\
    \ determined by \"infinitesimal\"\nversions of the affine scaling and projective\
    \ scaling algorithms. The paper of\nC. Wittgall, P. Boggs, and P. Domich and the\
    \ paper of I. Adler and R. Mon-\nteiro both prove that limiting behavior exists\
    \ for affine scaling trajectories.\nTheir results apply even to degenerate linear\
    \ programs, including cases where\nthe convergence of the affine scaling algorithm\
    \ has not yet been proved.\nThe paper of R. C. Monteiro analyzes the boundary\
    \ behavior of projective scaling\ntrajectories.\n\nSection 4 presents results\
    \ for nonlinear programming problems. F. Jarre,\nG. Sonneveld, and J. Stoer gives\
    \ a polynomial-time interior point method for\nsol convex quadratic programming\
    \ problems having convex quadratic\nconstraints. A. Kalantari studies the problem\
    \ of finding a zero of a quadratic\nform over a simplex, a problem which is NP-complete\
    \ in general. He gives\na \"projective\" algorithm for finding a local minimum\
    \ of a certain potential\nfunction, which gives a polynomial-time algorithm for\
    \ solving certain convex\nquadratic programs including linear programming. S.\
    \ Mehrotra and J. Sun\npresent an interior-point method for smooth convex programming.\
    \ A. Gold-\n gives a criterion specifying a quadratic convergence region when\
    \ using\nNewton's method to find a zero of a nonlinear function.\n\nSection 5\
    \ presents results for integer programming and multi-objective pro-\ngming. The\
    \ paper of N. Karmarkar gives an interior-point approach to\nsvolving 0–1 integer\
    \ programming problems. Such problems, which are NP-\ncomplete in general, are\
    \ converted to nonconvex quadratic programs on a"
