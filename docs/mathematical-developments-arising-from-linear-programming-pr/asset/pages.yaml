  md: '82


    H(P) is the restriction of a linear functional to the Grassmann manifold of d-planes
    in n-space, Q = I - P representing a point in the Grassmannian.


    The TLS problem can be seen to be equivalent to a linear programming problem as
    follows.


    Choose a basis in which C is diagonal. The H(P) = ∑_{i=1}^n c_i p_i where C =
    diag(c₁, ..., cn) and pᵢ are the diagonal entries of P. Then (see Byrne and Willems
    [15]) the set of all pᵢ is precisely the convex set C(d, n) = {p₁, ..., pn} ∈
    ℝⁿ : 0 ≤ pᵢ ≤ 1, ∑_{i=1}^n pᵢ = n-d}. This follows from the Schur-Horn theorem
    [21]. In this case he converges from the convexity of the moment map associated
    with the natural torus on the Grassmannian. (See [2], [7], or [15] for Atiyah''s
    and Guillemin and Sternberg''s work on the moment map.) We have a linear programming
    problem.


    The Schur-Horn theorem is the following: Let H be a Hermitian matrix and let λ
    = (λ₁, ..., λn), λ₁ ≥ λ₂ ≥ ... ≥ λₙ, and a = (a₁, ..., an) denote the eigenvalues
    and diagonal entries of H, viewed as vectors in ℝⁿ. Let Σλ denote the permutation
    group acting on ℝⁿ. Then a < Σλ, where Σλ denotes convex hull of all permutations
    of λ. Given any λ and a < Σλ, there exists a Hermitian matrix H with eigenvalues
    and diagonal entries a. We recall this result again in Section 6.


    Let us restrict ourselves (although the results generalize) to the real case and
    the fitting of lines. We can show


    THEOREM. Consider the TLS function TrCP in the real, line-fitting case and suppose
    that C has distinct eigenvalues. Then its gradient flow converges to one of the
    vertices of C(d, n), and the flow is equivalent to the Toda lattice flow.


    PROOF. Consider the function TrCQ. Here Q is a rank 1 projection matrix that we
    may have as Q = rrᵀ where r = [r₁, ..., rn] is a vector and ∑ri² = 1. Then one
    easily shows that minimizing TrCQ is equivalent to minimizing V = ∑cᵢ²/2ri². Thus
    we may consider the gradient flow of this system, which will converge generically
    in Q-space to the vertices of the simplex C(1, n). But V is just equal the V in
    (3.4), which gives rise to the gradient formulation of the Toda lattice equations
    described in Section 3.


    There is an alternative method of obtaining this result. (See Section 6.)


    REMARKS. (1) In the case where the eigenvalue corresponding to the minimal critical
    value of TrCP is a multiple eigenvalue, the gradient flow will converge to the
    edges spanned by the corresponding vertices. The gradient flow in this case is
    still equivalent to a Toda flow (see Chu [16]), where in this case some of the
    bⱼ in (3.5) are zero.'
