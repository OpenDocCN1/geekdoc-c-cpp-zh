  md: '236 F. JARRE, G. SONNEVEND, AND J. STOER


    it can be generalized to a larger class of functions $f_i, \dots, f_m$ satisfying
    a “Relative Lipschitz condition” as specified below.


    The following lemma shows the continuity of the $H$-norms.


    LEMMA 2 (equivalence of the $H$-norms, [Ja], Lemma, 2.20). If $y \in R^p$, and
    $\|x-y\|_{(H)} \le 0.1$ then there exists an $\epsilon$ with $|\epsilon| \le 3\|x-y\|_{(H)}$,
    such that


    $\|z\|_{H(x)} = \|z\|_{H(y)}(1 + \epsilon).$


    From the above lemmas we can already deduce that the convergence of Newton’s method
    is a fixed portion of the feasible set $P$ independent of the data of the functions
    $f_i$. This is the key part for the proof of the main theorem. For completeness
    we mention that in the analysis (but not necessarily in an implementation of the
    algorithm that is based on extrapolation, [JaSoSt]), it is advantageous to count
    the restriction $f_0(x) \le \lambda$ times, as first suggested by [Re].


    # 3. The algorithm


    The algorithm that we analyze is an iterative algorithm generating pairs $(y_0,
    \lambda_0) \to (y_1, \lambda_1) \to \dots \to (y_k, \lambda_k) \to (y_{k+1}, \lambda_{k+1})
    \to \dots$, where $\lambda_k \ge \lambda_{k+1} \ge \lambda^*$ is a monotone sequence
    of numbers and each $y_k$ is to be regarded as an approximation to $x(\lambda_k)$.
    For finding a pair $(y''_0, \lambda''_0)$ we refer to [Ja]. Here we describe the
    basic,


    $(y_k, \lambda_k) \to (y_{k+1}, \lambda_{k+1}).$


    Given $(y_k, \lambda_k)$ one reduces $\lambda_k$ to


    ```

    (1) $\lambda_{k+1} := (1 - \rho)\lambda_k + \rho f''_0(y_k),$

    ```


    where $0 < \rho < 1$ is a suitable fixed number. $(\rho = 0.005$, e.g.). Then,
    $y_{k+1}$ is obtained from $y_k$ by one step of Newton’s method for finding the
    solution $x(\lambda_{k+1}) = D_x\varphi(x, \lambda_{k+1}) = 0$,


    ```

    (2) $y_{k+1} := y_k - (D_x^2\varphi(y_k, \lambda_k))^{-1} D_x\varphi(y_k, \lambda_k)^T$.

    ```


    It can be shown that $y_k = y_{k-1} + h_{k-1}$ is close to $x(\lambda_k)$ in the
    sense that


    $\|h_{k-1}\| \le \sigma$ sufficiently small,


    $(\sigma = 0.01$, e.g.), where $h_{k-1}$ is the first Newton step starting from
    $y_{k-1}$ for finding the solution $x(\lambda_k) = D_x\varphi(x, \lambda_k) =
    0$ measured in terms of the norm


    ```

    $\|z\|^2_H := z^T H z$ with $H := D_x^2\varphi(x, \lambda_{k+1})|_{x=y_k}$,

    ```


    then $y_{k+1}$ is also close to $x(\lambda_{k+1})$ namely


    $\|h_{k-1}\| \le \sigma$ with $H := D_x^2\varphi(x, \lambda_{k+1})|_{x=y_k}$.'
