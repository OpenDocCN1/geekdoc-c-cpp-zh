    # 2.2. Affine connection, parallel translation. Corresponding to a Riemannian
    metric, the coefficients of the associated affine connection are given by


    ```

    $$(2.2.1) \quad L''_{jk} = -\frac{1}{2}g^{il} \left( \frac{\partial g_{jl}}{\partial
    x^k} + \frac{\partial g_{kl}}{\partial x^j} \right)$$

    ```


    An affine connection gives us a definition of parallel translation of a vector
    along a curve. Given a pair of points $A$ and $B$, and a curve connecting the
    two, we can move each vector in the tangent space at $A$ to the tangent space
    at $B$ along the curve by means of the affine connection. Thus it "connects" tangent
    spaces at different point, and the map is linear, hence the name. In general the
    map depends on the choice of curve; however, the unconstrained case analyzed in
    $4$, it is path-independent.


    If a contravariant vector $u^i$ situated at point $x$ is moved to a point $x+\Delta
    x$ while keeping parallel to it, its components at $x+\Delta x$ are


    ```

    $u''^i = u^i + L^i_{jk}\Delta x^j u^k + O(\Delta x^2)$$

    ```


    For the projective algorithm, one has


    ```

    $$(2.2.2) \quad L''_{jk} = \delta_{jk} \left( \frac{\delta_{ij}}{\partial x^k}
    - \frac{\delta_{ik}}{\partial x^j} \right)$$

    ```


    # 3. Geodesics and vector field of the algorithm


    In this section we derive properties of geodesics of the projectively invariant
    Riemannian geometry introduced in $\S2$. In the unconstrained case in which the
    feasible region of the linear program is the simplex $S_n$ we determine the geodesics
    explicitly in $\S3.2$, and also determine the global distance function between
    points in $S_n$ induced by this Riemannian geometry. In $\S3.3$ we characterize
    the projective algorithm vector field, in terms of geodesics. The projective algorithm
    trajectories are not geodesics of this geometry in general.


    # 3.1. Geodesics. Geodesics can be defined in two ways:


    +   (1) variational form,


    +   (2) in terms of parallel translation.


    The variational form is obtained by observing that if we want the shortest curve
    connecting a pair of points $A, B$, then the first variation of the length integral
    along such a curve must vanish. A curve satisfying this necessary condition is
    called a geodesic $[8, p. 130]$. It need not be the shortest, and a shortest path
    need not be unique.) The length integral is given by


    ```

    $$\int_0^1 L\left(u, \frac{du}{dt}\right)dt, \quad L(u, v) = \sqrt{g_{ij}(u)v^i
    v^j}$$

    ```'
