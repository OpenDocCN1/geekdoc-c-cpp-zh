  md: '# STEEPE DESCENT, LINEAR PROGRAMMING, AND HAMILTONIAN FLOWS 79


    $\dot{x}=x_H(x)$ take their usual classical form


    ```

    $$\dot{q}_i = \frac{\partial H}{\partial p_i},\\ \dot{p}_i = -\frac{\partial H}{\partial
    q_i} \quad i=1,\dots,n.$

    ```


    The Poisson bracket of two functions on $M$ is defined by $\{F, G\} = \omega(X_F,
    X_G)$. Again, in local coordinates the bracket reduces to the classical


    ```

    $$\{F, G\} = \sum_{i=1}^n (\frac{\partial F}{\partial q_i}\frac{\partial G}{\partial
    p_i}-\frac{\partial F}{\partial p_i}\frac{\partial G}{\partial q_i})$

    ```


    On $\mathbb{R}^{2n}$ these local coordinate expressions are valid globally. In
    this paper we are interested in systems of Hamiltonian flows that can be solved
    explicitly. We call such systems completely integrable.


    Liouville''s theorem [3] tells us that a Hamiltonian system with Hamiltonian $H_$
    is completely integrable if there exist $n$ independent (almost everywhere) functions
    $H_1, \dots, H_n$ that Poisson commute with $H_i$, and $H_i$ are said to Poisson
    commute with each other or be in involution $\{H_i, H_j\}=0\}$. Such systems can
    be solved by means of elementary integrations and inversions. Further, consider
    a level set of the functions $H_i, M_h = \{x : H_i(x)=h_i, i=1,\dots,n\}$, on
    which the $H_i$ are independent. $M_h$ is a smooth manifold invariant under the
    flow of $H_i$, and if it is connected it is diffeomorphic to a cylinder $\mathbb{R}^k
    \times T^{n-k}$. In the compact case it is a torus, but we deal mainly with the
    noncompact case. There is a beautiful theory of these systems that have undergone
    many developments in recent years. Characteristic of such systems is that they
    can very often be described by a so-called Lax pair, i.e., written


    ```

    $L(t) = \{B(t), L(t)\} = BL-LB$

    ```


    where $L$ and $B$ are $n \times n$ matrices. See, for example, [26] and [27] and
    the references in [10]). Given such a pair, there is usually a canonical way of
    arriving at the integrals in involution as well as carrying out the explicit integration.
    In particular, the Toda lattice has such a pair associated with it, as we discuss
    in the following pages


    # 3. The QR algorithm and the Toda lattice flow


    Let us begin considering the Toda lattice flow. The original Toda lattice Hamiltonian
    on $\mathbb{R}^{2n}$ with coordinates


    ```

    $$(x_1, \dots, x_n, y_1, \dots, y_n)$

    ```


    is given by (see [25])


    ```

    $$(3.1) \quad H = \frac{1}{2}\sum_{k=1}^n y_k^2 + \sum_{k=1}^{n-1} e^{(x_k-x_{k+1})}$

    ```'
