    # 2. Outline of the continuous minimization approach


    For a feasible problem, the optimal value of $\sum_i x_i^2$ over the feasible
    region is $n$. Using this information, we can obtain the two forms of objective
    function we have used most often, called "spherical form" and "conical form,"
    both of which have optimal value zero:


    ```

    $f(x) = \sqrt{n - \sum_i x_i^2} \quad (text{(spherical form)},$\n$$f(x) = \sqrt{n
    + \delta - \sum_i x_i^2 + \delta} \quad (text{(conical form).}$$

    ```


    Here $\delta$ is some positive constant, used to avoid nondifferentiability of
    the square-root function when $\sum_i x_i^2 = 0$.


    In the case of the projective form of the problem given later, it is easy to make
    $f(x)$ homogeneous by using the relation $\sum_i x_i = 1$. For example, the spherical
    form can be written as


    ```

    $f(x) = \sqrt{n \cdot \left(\sum_i x_i\right)^2 - \sum_i x_i^2}.$$

    ```


    If we want to impose equality constraints of the type $Ax=b$ on the solution,
    their effect can be incorporated into the quadratic objective function $f(x)$
    by changing it to $f(x)+\|Ax-b\|^2$. In the case of a feasible problem, such an
    optimal value continues to be zero after this modification. We assume that such
    a modification has been done in stating the standard problem forms below, although
    equivalent problem formulations with explicitly imposed equality constraints are
    also possible.


    From the objective function, we construct the associated potential function, just
    as in the linear programming.


    Let $s_i(x), i=1,2,...,N$ denote the slack variables that are linear functions
    of $x$. These include slack variables from upper- and lower-bound constraints
    $-1 \le x_i \le 1$ as well as slack variables from other inequality constraints
    $Ax \le b$.


    Then the potential function $g(x)$ associated with an objective function $f(x)$
    is given by


    ```

    $g(x) = \frac{(f(x))^N}{\prod_{i=1}^N s_i(x)}.$

    ```'
