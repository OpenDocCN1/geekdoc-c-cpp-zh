  md: '# LP PROBLEM. Find $x \in R^n$ such that


    $Ax \le b$,$

    $-1 \le x_i \le 1$.


    Solution of the LP relaxation can be useful in solving the IP problem in several
    ways:


    +   1. If the LP problem is infeasible, then one can infer that the IP problem
    is also infeasible.

    2. In a branch-and-bound type of method for solving IP [4], if the LP relaxation
    of the reduced problem obtained after partial assignment of $\pm1$ values to a
    subset of the variables is infeasible, then that partial solution cannot be extended
    to a feasible solution of the integer programming problem.

    3. If a vertex of the polytope associated with the LP problem happens to have
    $\pm1$ coordinates, then it is also a solution to the integer programming problem.
    Many unwanted fractional solutions (including zero-valued solutions in case of
    $\pm1$ formulation) have been ruled out by augmenting the linear program with
    additional inequalities. An approach based on polyhedral combinations seeks to
    generate several families of inequalities [9].


    Further selectivity in the type of solution to the linear programming problem
    can be gained using a quadratic objective function, $\sum_{i=1}^n x_i^2$, which
    prefers integral solutions over fractional ones, thus making it unnecessary to
    explicitly rule out fractional solutions with small values of the quadratic objective
    and achieving economy in the number of inequalities to obtain integral solution.
    In this paper, we elaborate on our approach, which is an interior-point approach
    based on quadratic objective function. In order to test our approach, we choose
    problem classes such as finding maximum independent sets in dense random graphs
    and which fractional solutions to the linear programming relaxation are abundant
    and it is very hard to find integral solutions. In 0-1 formulations of these problems,
    most coordinates have values 1/2 and 1/3, respectively. For both problems, lower
    bounds of combinatorial algorithms have been proven to grow like $e^{kn}$ and
    $e^{kn}$ respectively [2], [1], [3]. For the latter, the model used is more general
    because it allows linear programming relaxation to be solved at each node of the
    branch-and-bound method. Hence these problem classes are good test cases to see
    additional selectivity gained by quadratic objective function using the interior-point
    approach. We have also tested our approach on the satisfiability problem in mathematical
    logic. Reports on experimental results on these problem classes can be found in
    [5], [11], [13].


    However, many real-life applications of integer programming are much simpler.
    Our method has already been applied to developing a global router'
