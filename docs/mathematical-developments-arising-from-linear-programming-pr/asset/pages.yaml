    Theorem 7.1 shows that the family of PDAS trajectories are precisely the $w$-central
    paths defined in Section 2. Thus, all the results obtained in Sections 2–5 are
    applicable to these trajectories as well. We summarize our results in the following
    two theorems.


    THEOREM 7.2. Let $x^0 \in S_f$ and $(y^0, z^0) \in T_j$ be given. Let $(x(\mu),
    y(\mu), z(\mu))$ be the PDAS trajectory passing through $(x^0, y^0, z^0)$. Let
    $w = x^0/z^0$. Then


    ```

    $\lim_{\mu\to 0}(x(\mu), y(\mu), z(\mu)) = (x^*, y^*, z^*)$

    ```


    where $x^*$ and $(y^*, z^*)$ are the $w$-centers of the optimal faces of the primal
    $(P)$ and the dual $(D)$, respectively.


    It should be noted that Theorem 7.2 was first proved in [8].


    THEOREM 7.3. Let $x^0 \in S_f$ and $(y^0, z^0) \in T_j$ be given. Let $(x(\mu),
    y(\mu), z(\mu))$ be the PDAS trajectory passing through $(x^0, y^0, z^0)$. Let
    $x^*$ and $(y^*, z^*)$ denote the $w$-centers of the optimal faces of the primal
    $(P)$ and the dual $(D)$, respectively. Then, the limit of $(x(\mu), y(\mu), z(\mu))$
    as $\mu$ tends to 0 exists, and its value is as follows.


    +   (a) $\lim_{\mu\to 0}x_N(\mu) = w_B(z_N)^{-1}$ and $\lim_{\mu\to 0}x_B(\mu)$
    is equal to the unique optimal solution of problem (5.1).


    +   (b) $\lim_{\mu\to 0}z_B(\mu) = w_B(z_N)^{-1}$ and $\lim_{\mu\to 0}z_N(\mu)$
    is equal to the unique optimal solution of problem (5.5) with $p_B$ and $p_N$
    replaced by 0.


    # 8. Remarks


    It is an open question whether the actual discrete PAS (or DAS) algorithm converges
    to an optimal solution without assuming primal and dual nondegeneracy. We believe
    that the results presented here are a step towards proving that all the accumulation
    points (and possibly the limit) of the sequence of iterates $(x^k)$ generated
    by the PAS algorithm with appropriate step size) lie in the optimal face of the
    primal problem.'
