    # 2. Limiting behavior of the projective scaling trajectories ($r^* = 0$)


    In this section, we study the limiting behavior of the projective scaling trajectories
    for the linear programming problem $(P)$ stated in Section 2 under the assumption
    that the optimal value $r^*$ of problem $(P)$ is 0. The case $r^* > 0$ will be
    briefly analyzed in the next section. By Proposition 2.3 every projective scaling
    trajectory $w(\mu)$ for problem $(P)$ can be obtained from an affine scaling trajectory
    by radial projection onto $\{x|x^T x = 1\}$, it is enough to use the results of
    the previous section in order to analyze the limiting behavior of the projective
    scaling trajectories.


    Before going through the analysis of the projective scaling trajectories, we point
    out the relationship between the optimal faces of $(P)$ and $(HP)$. Let $N$ denote
    the set of indices $j$ such that $x_j = 0$ whenever is an optimal solution of
    problem $(HP)$. It follows from Proposition 2.2 that $N$ is also the set of indices
    $j$ for which $x_j = 0$ in any optimal solution of problem $(P)$. Moreover, the
    set $B \equiv \{1,\dots,n\}-N$ is nonempty.


    The dual of problem $(P)$ is problem stated as follows:


    ```

    $(D) \max \quad p\\ns.t.\ A_B^T y + ep + z = 0, \quad z \ge 0.$

    ```


    With respect to the dual problem $(D)$, we have that $(y, p, z)$ is an optimal
    solution of problem $(D)$ if and only if $A_B^T y = c_B, A_N^T y + z_N = c_N,
    z_N \ge 0, z_B = 0$, and $p = 0$.


    We start by showing that a projective scaling trajectory always converges to an
    optimal solution of problem $(P)$. In general, when the dimension of the optimal
    face of problem $(P)$ is greater than 0, two different projective scaling trajectories
    may converge to two distinct points on the optimal face of $(P)$.


