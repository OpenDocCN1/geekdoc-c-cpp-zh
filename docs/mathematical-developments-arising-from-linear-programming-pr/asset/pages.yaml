  md: 'A particular case of interest is when $X$ is a polytope in $R^n$ and $f$ is
    linear. This is called the multiple objective linear program (MOLP), Then $Q$
    is also a polytope, and $\tilde{Q}$ can be described as a set of faces of the
    polytope $Q$. Note that $\Lambda$ induces an ordering on $R^n$ defined by the
    convex cone


    ```

    $\Lambda^* = \{x \in R^n | f(x) \in \Lambda\}$

    ```


    It follows on that $E(X, f, \Lambda) = E(X, I, \Lambda)$, where $I$ is the identity
    mapping on $X$. Therefore, we will consider the following general problem.


    PROBLEM. Given a polytope defined by linear inequalities, find the set of efficient
    faces with respect to an ordering code $\Lambda$.


    This is a problem in the area of computational geometry (Preparata and Shamos
    (1985)). We seek efficient faces since this may include other than $(n-1)$-dimensional
    faces, i.e., facets. We use the adjacient efficient to avoid confusion with the
    definitions of a facet as a maximal face relative to inclusion.


    # 2. Simplex-based techniques


    The usual approach of solving the MOLP employs simplex-methods (Yu and Zelen (1975)).
    It is known that the set of efficient faces of a polytope $X$ is either the entire
    set of feasible solutions $X$ or a part of the boundary of $X$. If all objective
    functions are linearly independent, then the set of efficient points lies on the
    boundary of $X$. Since $X$ is a polyhedron, its boundary consists of faces (facets,
    edges, and points) that can be characterized by extreme points or extreme rays.
    If an interior point of a face or edge is efficient, then the whole face or edge,
    including its extreme points and edges, must also be efficient. The efficient
    set is connected (Yu (1985)). So for any points in the efficient set, one can
    move from one point to the other without leaving the set (efficient frontier).


    The above result suggests a simplex-based strategy for generating the efficient
    frontier of $X$. Since a face is completely described by its extreme points, the
    primary goal of simplex-based methods is the determination of the efficient extreme
    points. The set of efficient extreme points can be constructed iteratively by
    beginning at an efficient point and moving along one of the extreme edges emanating
    from it. The entire set of extreme points is then constructed in a finite (but
    not necessarily polynomial) number of iterations. Once all the efficient points
    have been generated, then one constructs all efficient (maximal) faces from the
    given set of efficient points.


    A variety of methods have been proposed to carry out the steps in this approach.
    For the problem of finding an initial extreme point, most methods solve a linear
    programming problem. For details see Ecker and Kouada (1975), Evans and Steuer
    (1973), and Zelen (1974). There are several schemes for exploring adjacent extreme
    points or edges.'
