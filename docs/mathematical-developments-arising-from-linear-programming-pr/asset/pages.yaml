    A closely related problem to the one mentioned above is the convergence of the
    dual estimate in the discrete PAS (or DAS) algorithm. We again believe that the
    results presented in this paper provide some insight into the observed fact (e.g.,
    [1] and [10]) that the “dual estimates” (or “primal estimates” in the case of
    the DAS algorithm) do converge to an optimal solution of the dual (primal) problem.


    In contrast to the discrete PAS (or DAS) algorithm, it has been proved in [11]
    that the PDAS converges (in polynomial time) to an optimal and dual solution without
    any nondegeneracy assumption. We believe that the inherently simpler structure
    of the PDAS trajectories (the $w$-trajectories) may provide some insight into
    the polynomial convergence of the PDAS algorithm.


