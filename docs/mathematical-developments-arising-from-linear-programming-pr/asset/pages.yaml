  md: "# CANONICAL PROBLEMS FOR QUADRATIC PROGRAMMING\n\nquadratic form $\\phi$ has\
    \ a zero in a subspace of $R^n$ containing the vector of ones. One more restrictive\
    \ decision problem can be approximated by solving two decision problems as $(P)$.\
    \ Thus, we use $(P)$ as the more fundamental problem in both linear and quadratic\
    \ programming. Procedure $W$ extends to $(GP)$ and in the special case where $\\\
    phi$ is the square of a linear function, it reduces to Karmarkar's algorithm using\
    \ optimal stepsize in each iteration.\n\nThe above procedures make use of projective\
    \ transformations. For each $d \\in S_n$, there exist a projective transformation\
    \ $T_d$ that maps $S$ one-to-one and onto itself, satisfying $T_d(d) = e_d$ induces\
    \ a corresponding quadratic $\\phi_d$ and a potential $f_d$. The functions $\\\
    phi_d$ and $f_d$ preserve all the relationships between $\\phi$ and $f$. The iterative\
    \ step of Procedure $W$ computes the infimum of $f_d$ in the direction of the\
    \ steepest descent $e$ (which coincides with the largest inscribed sphere in $S$),\
    \ centered at $e$. In Karmarkar's algorithm [13], the iterative step of each procedure\
    \ is repeated, replacing $d$ by the image of $T_d^{-1}$ at the computed point.\
    \ We describe a third procedure, Procedure $A$, for solving $(P)$, which under\
    \ convexity of $\\phi$ reduces to our previous extension of Karmarkar's algorithm\
    \ [9]. The iterative step of $A$ computes the infimum of $f_d$ in the descent\
    \ direction connecting $e$ to the point that minimizes $\\phi_d$ over the smallest\
    \ sphere circumscribing $S$.\n\n# 1.1. Notations and summary of the results. Let\
    \ $S=\\{x \\in R^n : e^T x = n, x \\geq 0\\}$, where $e^T = (1, 1, \\dots, 1)$.\
