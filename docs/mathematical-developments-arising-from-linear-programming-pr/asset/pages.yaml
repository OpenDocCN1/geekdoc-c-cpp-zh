  md: '# PROBABILISTIC ANALYSIS OF THE SIMPLEX METHOD


    We now come back to the inclusion of Phase I. We could introduce a (rather lengthy)
    method for doing the task of Phase I and Phase II by several applications of the
    shadow-vertex algorithm. This enables us to exploit our known results, since in
    every application the stochastic requirements (5.2) are still satisfied. By the
    way, all our trouble with the auxiliary objective $u x$ disappear. We do not need
    it anymore.

    The complete method works as follows.


    # Initialization.


    +   Starting from the origin, find a vertex of the polyhedron $X^{(2)}=\{x|Ax
    \le b, x^3 = \dots = x^n = 0\}$ (two-dimensional). This is easily done by running
    along a coordinate axis until a restricting hyperplane is hit. If the axis does
    not hit, we invert the search direction. If we do not find it, the original problem
    is unbounded. If a hitting point is found, it is located on an edge of $X^{(2)}$.
    Find a vertex of that edge. If the edge does not have vertices, the original problem
    is unbounded; we can STOP.


    +   Apply the shadow-vertex algorithm starting from the given vertex in order
    to maximize $v^T x$ on $X^{(2)}$. If $v^T x$ is unbounded, we can STOP (unbounded
    on $x$, too).


    Typical step. Use the solution $(x^1, \dots, x^{k-1}, 0, \dots, 0)^T$ of $X^{(k-1)}$.
    It is located on an edge of $X^{(k)}$.


    +   Find an adjacent vertex in $X^{(k)}$ to that edge.

    Apply the shadow-vertex algorithm by using $e_k^T x$ and $v^T x$ as objective
    and auxiliary objective, respectively. If $v^T x$ is unbounded on $X^{(k)}$ we
    can STOP.

    If $k < n$ we go to the next step and use the solution point with $k := k+1$.
    If $k = n$ we STOP.


    This method allowed evaluation, since it was in principle an $(n-1)$-fold application
    of the shadow-vertex algorithm. Our main result was


    THEOREM 5.9 (1981). For all distributions satisfying (5.2) our method solves the
    LP in not more than


    ```

    $m^{1/(n-1)}(n+1)^n \frac{2en}{4} (\frac{\pi}{2} + \frac{1}{e})$

    ```


    steps on average.


    By this method we were also able to verify this result for problems including
    sign constraints $x \ge 0$.


    Our result had a certain drawback. We had to know a feasible point in advance.
    But how should one handle problems of the form'
