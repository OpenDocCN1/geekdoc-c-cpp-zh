  md: 'The resulting system of equations with nonperiodic boundary conditions

    may be written


    ```

    $$(3.2) \quad \dot{x}_k = H_{y_k}, \quad k=1, \dots, n \n \dot{y}_k = -e^{x_{k-1}-x_k}
    - e^{-x_k-x_{k+1}}, \quad k=1, \dots, n$$

    ```


    if we set $e^{x_0-x_1}=1$ and $e^{x_n-x_{n+1}}=0$.


    The energy surface for this system is noncompact, and the “particles"

    described by this system behave asymptotically like free particles.

    Moser in [25] showed that this Hamiltonian system can be mapped by a

    one-to-one mapping to the following gradient system:


    ```

    $$(3.3) \quad \frac{d\lambda_k}{dt}=0, \n \frac{dr_k}{dt}=-\frac{\partial V}{\partial
    r_k}, \quad k=1, \dots, n$$

    ```


    where


    ```

    $$V = \sum_{k=1}^n \frac{\lambda_k r_k^2}{2 \sum_{l=1}^n r_l^2}$$

    ```


    and $\lambda_1 < \lambda_2 < \dots < \lambda_n, \sum_{k=1}^n r_k^2=1, r_k > 0$.

    These equations are explicitly solvable.

    Faschka [19] showed that the equations could also be recast in the Lax

    pair form $\mathcal{A}=[B, A]$. One makes the transformation


    ```

    $$a_k=\frac{1}{2}e^{(x_k-x_{k+1})/2} \quad b_k=-\frac{1}{2}y_k.$

    ```


    Then the resulting pair can be expressed as $\mathcal{A}=[B, A]$ where


    ```

    $$(3.5) \quad A=\begin{bmatrix} b_1 & & & a_1 \ a_1b_2 & & \dots & & a_2 \ & b_{n-1}a_{n-1}
    & & a_{n-1} \ 0 & & a_{n-1}b_n & 0 \ & & & -a_1 \end{bmatrix}$$

    ```


    One can check that this yields an isospectral flow; i.e., the (distinct) eigenvalues
    $\lambda_k$ of $A$ are conserved. ($dU/dt=BU, B(0)=I$). Then $L(t)=U^{-1}L(0)U$.
    These $\dot{\lambda}_k$ are the $\lambda_k$ of the gradient flow described above,

    in fact, we use the $n$ integrals in involution to show that the system

    is integrable. Another basis of integrals is $Tr A^k, k=1, \dots, n$, where

    Tr$ denotes the trace.


    The Lax pair equation can be written as $\mathcal{A}=[\pi_T, A]$ where $\pi_T
    A$ is

    thew-symmetric part of $A$ in the unique decomposition of $A$, as $A=\pi_T A+\pi_l
    A$ where $\pi_l A$ is lower triangular. We can show in fact that the

    Toda flow is Hamiltonian on the dual of an adjoint orbit of lower triangular

    matrices that may be identified with orbit of symmetric matrices. The

    corresponding Hamiltonian is just $\frac{1}{2}Tr A^2$.'
