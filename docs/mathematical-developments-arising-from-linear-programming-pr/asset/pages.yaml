    be called the “tolerance” approach:


    DEFINITION 3.1. A basic solution $x = x(B) = (x_B, x_N)$ where $x_B = B^{-1}b$
    and $x_N = 0$ is optimal with tolerance $\delta$ for $SF(A, b, c)$ if for every
    $j$,


    ```

    $x_j \ge -\delta \quad c_j \le c_B B^{-1} A_j + \delta$.

    ```


    Obviously, such a solution is not necessarily feasible in the sense that the equality
    constraints are satisfied while the nonnegative constraints are approximately
    satisfied. Analogously, the dual vector $y(B)$ is approximately feasible in the
    dual problem. Moreover, the vectors $x(B)$ and $y(B)$ satisfy the complementary
    slackness condition which is necessary for optimality.


    ```

    $x(B)^T A_j - c_j = 0$,

    ```


    which is necessary for optimality. This implies that both vectors yield the same
    objective function value in their respective problem


    ```

    $c^T x = c^T B^{-1} b = y^T b$.

    ```


    Note that the problem may also be feasible and unbounded but that an optimal solution
    with tolerance $\delta$ may still exist. One can also define an unbounded ray
    with tolerance $\delta$.


    # 4. Perturbation-based approximation


    It is interesting to observe from a solution that is optimal with small tolerance
    we can easily obtain an exact solution to an instance that is close to the one
    given. More precisely, we have the following proposition:


    PROPOSITION 4.1. Suppose $x = x(B)$ is a basic solution that is optimal with tolerance
    $\delta$. Let $x''$ be defined by $x''_j = x_j + \delta$ for $j$ associated with
    $\mathbf{B}$ and $x''_j = 0$ otherwise. Also, let $c''$ be defined by $c''_j =
    c_j$ for $j$ associated with $\mathbf{B}$ and $c''_j = c_j - \delta$, and let
    $b'' = b + \delta Be$. Under these conditions, $x''$ is an optimal solution for
    the problem $SF(A, b'', c'')$, and $y'' = B^{-T} c_B$ is optimal for its dual
    problem.


    PROOF. We have


    ```

    $x''_B = B^{-1}b'' = x_B + \delta Be \ge 0$,\nA''^T y'' \ge c''$

    ```


    and $x''$ and $y''$ satisfy the complementary slackness conditions required in
    $SF(A, b'', c'')$.


    In simpler words, we have


    COROLARY 4.2. If $x$ is optimal with tolerance $\delta$ for $SF(A, b, c)$ then
    there exist $b''$ and $c''$ such that an optimal solution $x''$ for $SF(A, b'',
    c'')$ satisfies that


