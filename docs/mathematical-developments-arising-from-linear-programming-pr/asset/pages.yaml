  md: '# 2. Sufficient conditions for convergence


    For perspective and comparison, this section reviews two key results from the
    large literature on Newton''s method.


    We are given two Banach spaces $X$ and $Y$ and an convex subset $U$ of $X$. A
    function $F$ is a given mapping $U$ into $Y$. We assume that $F$ is Fréchet differentiable
    on $U$.


    Newton''s method for solving the equation $F(x) = 0$ has the following form. Assume
    that the Fréchet derivative $DF(x)$ has an inverse throughout $U$, denoted by
    $(DF)^{-1}(x)$. The Newton''s method iterate of $x$ is $x-s(x)$ where


    ```

    $s(x) = (DF)^{-1}(x)F(x)$

    ```


    is called the Newton step. Given a starting point $x_0$ in $U$, the Newton sequence
    is


    ```

    $x_{k+1} = x_k - (DF)^{-1}(x_k)F(x_k)$.

    ```


    The totality of line segments joining the iterates $x_k, k=1, 2, 3, \dots,$ will
    be called the Newtonian trajectory. The length of the Newton step $\eta(x)$, given
    by


    ```

    $\eta(x) = \|s(x)\| = \|(DF)^{-1}(x)F(x)\|$,

    ```


    is an important quantity in estimating convergence of Newton''s method. The sequence
    $\{x_k\}$ generated may converge to a limit. Kantorovich [8] found sufficient
    conditions to guarantee that the point $x_0$ will start a Newton sequence that
    converges at a quadratic rate; these conditions depend on the existence of a global
    bound for $\|D^2F(x)\|$ on a convergence region $S$. Later, on Kantorovich and
    Akilov [9] weakened this to requiring a global bound on sup$\|(Df)^{-1}(x_0)D^2F(u)\|
    : u \in S\}$ on a convergence region $S$. This was relaxed to requiring only a
    Lipschitz condition on $DF$. The following result of this type is taken from Deuflhard
    and Heindi [4]. It is an amalgamation of the optimal estimate of convergence by
    Gragg and Tapia [6].


    THEOREM 1.1 (Kantorovich-Akilov, Gragg-Tapia, and Deuflhard-Heindi). Let $F: X
    \to Y$ be Fréchet differentiable. Suppose that one has a starting point $x_0$
    with $DF(x_0)$ invertible and constants $\eta(x_0) = \|DF^{-1}(x_0)F(x_0)\|$ and
    $\omega_0$ such that


    +   (1) Lipschitz condition at $x_0$.


    +   $\|(DF)^{-1}(x_0)(DF(y) - DF(x_0)) \le \omega_0 \|x-y\|$ for all $x, y$ in
    $Y$


    +   (2) Proximal root condition.

    $h_0 = \eta(x_0)\omega_0 < \frac{1}{2}$.'
