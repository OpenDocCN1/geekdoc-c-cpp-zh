    of $\phi$, there exists $\hat{\chi}(e) = \lambda x^1(e) + (1-\lambda)x^2(e) \in
    S$ where $\phi(\hat{\chi}(e))=0$. Convexity of $g$ implies that $g(\hat{\chi}(e))
