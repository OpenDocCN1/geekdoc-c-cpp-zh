    NARENDRA KARMARKAR


    THEOREM. Let $f(x)$ be a function from an open set $U \subseteq R^n$ to $R$. Suppose
    the level sets $L_f(\alpha)$ of $f$ are pathwise connected for all values of $\alpha$.
    Then the function $f$ cannot have a spurious local minimum.


    PROOF. If possible $x_1$ be a spurious local minimum of $f$ over $U$ having value
    $\alpha = f(x_1)$ and let $x_2$ be a global minimum. The level set $L_f(\alpha)$
    contains both $x_1$ and $x_2$, which cannot be pathwise connected, since we can
    choose a neighborhood $N$ of $x_1$, such that $x_2 \notin N$ and for all $y \in
    N$, $f(y) > f(x_1)$, thus a contradiction.


    # 3.4. Connectivity properties for NP-complete problems. In case of minimization
    of convex quadratic functions over a polytope, the level sets are connected and
    there is a polynomial-time algorithm for solving the problem. In contrast, minimization
    of a quadratic function over a polytope is NP-complete, and the level sets of
    such a function can have an exponential number of connected components; e.g.,
    let the polytope be defined by


    ```

    $$-1 \le x_i \le 1 \quad i = 1, \dots, n.$$

    ```


    ```

    $f(x) = n - \sum_{i=1}^n x_i^2$$

    ```


    and take the value of level $\alpha$ such that $0 < \alpha < 1$. Since each vertex
    of the polytope is in this level set and is disconnected from all other vertices,
    the number of connected components is exponential.


    However, in our approach we associate a "potential function" with the objective
    function. The level sets of potential function appear to have fewer connected
    components than those of the objective function. The following theorem offers
    a partial explanation of this phenomenon by showing that for a particular class
    of potential functions, and the homogeneous form of the problem, there is only
    one connected component. The problem is defined as follows:


    PROBLEM. Given a system of homogeneous linear equations $Ax = 0$, where $A: m
    \times n$ matrix of real numbers and $x \in R^n$, find a solution $x$ with each
    component


    ```

    $x_i = +1 \quad or \quad -1 \quad i = 1, \dots, n.$

    ```


    Note that there is no loss of generality in assuming the homogeneity. This problem
    too is NP-complete.


    The simplest form of the potential function to which the theorem applies is


    ```

    $f(x) = \left[ n - \sum_{i=1}^n (1 - x_i^2) \right]^n \quad i=1$$

    ```'
