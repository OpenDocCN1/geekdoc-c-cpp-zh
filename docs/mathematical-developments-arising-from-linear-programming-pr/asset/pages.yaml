  md: 'continuation. Reinhold [14] has shown that Smale''s theorem is a consequence
    of the Kantorovich-Akilov theorem [9], the precursor of Theorem 1.1.


    # 3. Variant of the Kantorovich inequality


    Consider the set of proximal points given by Theorem 1.1, namely $\{x_0 \in U:
    \eta_0(x_0)\omega_0 \leq \frac{1}{2}\}$. If $\omega_0$ can be decreased this set
    grows larger. Our main result reduces $\omega_0$ by replacing the Lipschitz condition
    on $U$ defining $\omega_0$ with a Lipschitz condition only in the direction of
    the Newton step $s(x) = (DF)^{-1}(x)F(x)$.


    We first show that the existence of DF and a growth condition on it a Newton method
    suffices to obtain convergence of the Newtonian iterates. Recall that the Newton
    step length $\eta(x) = ||s(x)||$.


    LEMMA 2.1. *Let F be a map between real Banach spaces $X$ and $Y$. Assume $F$
    is Fréchet differentiable on $X$ and the derivative DF is invertible. As all the
    Newton iterates $\{x_n\}$ of $x_0$ exist and that*


    $$\gamma(x_0) = \sup ||(DF)^{-1}(x_0)DF(x_0) - ts(x_0)||| \|: t \in (0, 1) \text{
    and } n = 0, 1, 2, 3, \dots \leq \frac{1}{2}.*$


    Then the sequence $\{x_n\}$ converges to a limit $x^*$ with $F(x^*) = 0$, and
    $\{x_n\}$ and $x^*$ lie in


    $S = \{x \in U: ||x - x_0|| \leq 2\eta(x_0)\}.*$


    Moreover


    +   (i) $\eta(x_n) \leq (\frac{1}{2})^n \eta(x_0)$,$

    (ii) $\||x_n - x^*|| \leq (\frac{1}{4})^{n-1} \eta(x_0)$,$

    (iii) $\||F(x_n)|| \leq (\frac{1}{3})^n ||DF(x_n)||$.*


    PROOF. $\gamma_n = \gamma(x_n)$ and $\eta_n = \eta(x_n)$ for the Newtonian iterates
    $\{x_n\}$. Suppose $A$ is a bounded operator mapping $X$ into itself, and let
    $I$ denote the identity mapping. By a well-known consequence of the contraction
    mapping principle of Banach, if $||A|| < 1$, then $(I-A)^{-1}$ exists


    $||(I - A)^{-1}|| \leq (1 - ||A||)^{-1}.*$


    By hypothesis, $x_1$ is well defined and belongs to $S$. Let


    $H(x_0, x_1) = (DF)^{-1}(x_0)DF(x_1) = I - (DF)^{-1}(x_0)(DF(x_0) - DF(x_1)).*$


    The bounded linear operator $H = H(x_0, x_1)$ maps X into itself. Since $||(DF)^{-1}(x_0)(DF(x_0)
    - DF(x_1))|| \leq \gamma_0 \leq \frac{1}{2}$, we have the estimate $||(H)^{-1}||
    = (1 - \gamma)^{-1} \leq \frac{2}{3}$. Also, $||H|| \leq \frac{2}{3}$. Observe
    that $DF(x_0)H = DF(x_1)$ and


    $(H)^{-1}(DF)^{-1}(x_0) = (DF)^{-1}(x_1).*$'
