    $\Lambda$ - maximize $f(x)$


    subject to $a_i^Tx \geq b_i, \quad i = 1, \dots, m$.


    Assume $f$ is a differentiable function from $\mathbb{R}^n$ to $\mathbb{R}^k$
    and that $\Lambda$ is the ordering cone in the space of objects.\nTamura (1974)
    considered the problem of constructing the polar cone of a polyhedral cone. This
    construction is also useful in our application, constructing the cone of increasing
    directions. First consider the polar cone $\Lambda^*$. That, $\Lambda^*$ is given
    by


    > $\Lambda^* = \{x \in \mathbb{R}^m | x = \sum_{i=1}^p \alpha^i v_i, \alpha^i
    \geq 0\}$.


    The cone of increasing directions $Q^*$ of $x$ is given by

    $Q^* = \{y \in \mathbb{R}^n : F(x)^Ty \geq 0\}$,


    where


    $F(x) = [\nabla f(x)^Tv_1, \dots, \nabla f(x)^Tv_p] \in R^{n \times p}$,


    and $v_i$ are edge vectors of $\Lambda^*$. From this point the procedure is the
    same as Algorithm (i) where $P = \{x|a_i^Tx \geq b_i, i = 1, \dots, m\}$ and the
    ordering cone is $Q^*$. If $f$ is linear, then $Q^*$ is constant; otherwise $Q^*$
    is a function of $x$.'
