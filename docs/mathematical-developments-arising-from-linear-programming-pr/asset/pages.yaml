    # 3. Tolerance-based approximation


    In this section we discuss the issue of approximation as it arises in the context
    of the simplex method. There are two ways to look at the question. First, imagine
    we run the simplex algorithm using exact arithmetic but rather running the algorithm
    to the end, we seek to apply some stopping rule that guarantees our output to
    be $\epsilon$-approximate solutions. Thus, rather than... The interesting problem
    is to devise such stopping rules for various concepts of approximation. Another
    way to look at the question is to realize that on a machine we usually have numerical
    errors, and we almost always have to specify some "tolerance" which we accept
    our results. It is important to know the implications of using a certain tolerance
    with regard to the results.


    Consider the problem SF($A, b, c$). In the Appendix we review the properties of
    basic solutions and how the simplex method uses them. (See the Appendix for the
    notation.)


    In practice, one usually works with some "tolerance" $\delta > 0$, so that any
    number $a \leq \delta$ is accepted as nonpositive and any $a \geq -\delta$ is
    accepted as nonnegative. This suggests another approach to approximation, which
    may'
