  md: "# 4.1. Relationship to parametric programming.\n\nThe algorithm has an inherently\
    \ close relationship to parametric programming when one considers the first three\
    \ equations in (4.3). Let $\theta=x_{n+1}-y_{m+1}$. Since $x_{n+1}^0=-y_{m+1}^0=1$,\
    \ the algorithm maintains the equality of $x_{n-1}^0=-y_{m+1}^0$ on the $k$th\
    \ iteration, provided that $d_p \neq 0$ and $d_D \neq 0$. Now, the set of equations\n\
    \n+   (4.4a) $XZe=0$\n(4.4b) $Ax+d_p\theta=b$\n(4.4c) $A^T y+z-d_D\theta=c$\n\
    (4.4d) $x,z \\geq 0$\n\nare the Karush-Kuhn-Tucker conditions for the parametric\
    \ linear program,\n\n```\nminimize (c+\theta d_D)^T x\nsubject to Ax=b-\theta\
    \ d_p, \\quad x \\geq 0.\n```\n\nA difficulty in showing that an algorithm using\
    \ the limiting feasibility directions may be shown by considering the case when\
    \ the current iterate is close to optimality for the linear program for some value\
    \ of $\theta$. It must be shown that the algorithm does not stall when $e^T XZe$\
    \ is small and $\theta>0$. (Note that if $Ax \neq b$ and $A^T y+z \neq c$, then\
    \ $e^T XZe \neq c^T x-b^T y$). Alternatively, the parametric linear program could\
    \ be solved for a fixed value of $\theta$, and then an optimal solution to the\
    \ original linear program could be found using an algorithm such as Dantzig's\
    \ Self-Dual Algorithm (Lemke's Algorithm).\n\n# 5. Computational experience\n\n\
    The algorithm described above has been implemented in conjunction with the generic\
    \ primal-dual algorithm to solve large-scale linear programs. The details of the\
    \ computational experiments are discussed by Lustig (1988b). The performance of\
    \ the algorithm was measured in terms of iteration counts against that of McShane\
    \ et al. (1989), which is a \"big-M\" method. Table 5.1 presents these results.\
    \ The average savings were optimized among 13%. Note that a feasible point for\
    \ the primal and dual problem was usually discovered long before the algorithm\
    \ terminated. The practical experience indicates that a convergence proof of an\
    \ algorithm using the limiting feasibility directions should be possible."
