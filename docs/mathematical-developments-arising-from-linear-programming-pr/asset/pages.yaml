  md: '# 3. The algorithm


    We solve linear programming relaxations of the matching problem using the primal
    projective standard-form variant of Karmarkar''s algorithm, which is due to several
    authors, including Anstrecher [2], Gonzaga [9], Gay [7], Jensen and Steger [20],
    and Ye and Kojima [22]. The algorithm is applied to the dual of relaxation.


    Our initial linear programming relaxation of the matching problem is


    ```

    max z

    y\delta(v) \le 1 \quad \forall v \in V

    -y_e \le 0 \quad \forall e \in E

    -w^T y + z \le 0

    ```


    Notice that the dual problem to $(D_0)$ is of the appropriate form for the projective
    standard-form variant of Karmarkar''s algorithm. We refer to the current relaxation
    of the matching problem as the *dual* linear programming problem, and we refer
    to its dual as the *primal* linear programming problem. Thus, $(D_0)$ is our initial
    dual problem. As we proceed, we modify $(D_k)$ by adding cutting planes of the
    form (2).


    Our algorithm is outlined in Figure 1. We now describe in detail how the algorithm
    works


