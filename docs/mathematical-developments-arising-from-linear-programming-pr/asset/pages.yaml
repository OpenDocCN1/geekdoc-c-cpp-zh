    and central trajectories. Trans. Amer. Math. Soc. 314 (1989), 499–581.


    +   2. P. Huard, Resolution of mathematical programming with nonlinear constraints
    by the method of centers, Nonlinear Programming (J. Abadie), North-Holland, Amsterdam,
