  md: 'In 4 we point out that the gradient flow associated with another important
    numerical problem, the total least squares (TLS) problem of fitting linear to
    data points in $n$-space, is just the Toda lattice flow. (In the case the TLS
    problem has another interesting Hamiltonian flow of spinning top type associated
    with it. See [7], [8].) We also note that the solution of the TLS problem can
    be shown to be equivalent to a linear programming problem.


    In 5 we discuss recent work of D. Bayer and J. Lagarias. In [5] and [6] they discuss
    the so-called $L$-trajectories associated with the affine scaling algorithm, a
    variant of Karmarkar''s algorithm for solving linear programming problems, are
    the integral curves of integrable Hamiltonian systems. These flows are also related
    to gradient flows.


    Finally we discuss some gradient flows recently analyzed by R. Brockett. See [12],
    [13]). These flows also arise from least squares type—“matching” in a least squares
    sense two $n$-tuples of space by rotating one of the n-tuples. In the simplest
    case the gradient flow rises to a Riccati equation that may be integrated by a
    “Hamiltonian flow.” A more complex example gives rise to an equation in the “Lax
    pair” form com most integrable systems. We have shown that this equation gives
    the Toda lattice flow on tridiagonal matrices as a special case. Brockett has
    shown that, by the Toda lattice flow, this flow can diagonalize matrices and,
    is capable of “solving” linear programming problems if the vertices are given.
    We also show how a related equation solves the total least squares problem.


    Recent joint work of the author with R. Brockett, H. Flaschke, and T. Ratiu on
    the Toda lattice, which utilizes some of the ideas discussed here, may be found
    in [9], [10], and [11].


    In the following pages we begin by reviewing the theory of Hamiltonian systems
    and complete integrability, and then we examine the various flows discussed above
    some of the mathematical features they have in common.


    # 2. Hamiltonian systems


    We begin with a brief review of the theory of Hamiltonian systems. (For more details,
    see example, [1] or [3]).


    A Hamiltonian system on a $2n$-dimensional manifold $M$ equipped with a nondegenerate
    bilinear $2$-form $\omega$ is defined to be the triple $(H, M, \omega)$. Here
    $H$ is a function on $M$, and $M$ is said to be a symplectic manifold with symplectic
    form $\omega$. The Hamiltonian vector field $X_H$ corresponding to $H$ is defined
    by $DH \cdot Y = \omega(X_H, Y).


    Locally, by the Darboux theorem ([1]), canonical coordinates


    ```

    $q_1, \dots, q_n, p_1, \dots, p_n$$

    ```


    can be found such that $\omega = \sum_{i=1}^n dq_i dp_i$, and the Hamiltonian
    equations'
