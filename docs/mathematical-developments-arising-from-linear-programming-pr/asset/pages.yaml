  md: '# On the Convergence Behavior of Trajectories

    for Linear Programming


    CHRISTOP WITITZGALL, PAUL T. BOGGS,

    AND PAUL D. DOMICH


    ABSTRACT. The convergence of center trajectories arising from the

    use of the logarithmic barrier function in linear programming is examined

    based on the concept of analytic center of a system of linear constraints.

    Main results are the convergence of λ-trajectories to g-centers of the op-

    timal face and the convergence of their tangential directions. Both results

    hold in the presence of primal and dual degeneracies. g-center varieties are

    introduced extending the concept of analytic g-centers.


    # Introduction


    In the early 1960s, Huard [13], [14] suggested a "method of centers" for

    minimizing a multivariate convex function $f(u)$ subject to convex inequalities

    g_i(u) \leq 0, \ i = 1, \dots, n$. Starting at a point $u^{(0)}$, a subsequent
    trial

    point $u^{(1)}$ is chosen as a suitable "center" of the system


    $g_0(u) = f(u) - f(u^{(0)}) \leq 0, \quad g_i(u) \leq 0, \quad i = 1, \dots, n$


    of convex constraints. The process is then repeated, defining $u^{(2)}$, with
    $u^{(1)}

    in the role of $u^{(0)}$, and so on. Accumulation points of the resulting sequence

    centers are optimal solutions. This method was also recognized (see

    Fiacco and McCormick [11]) as essentially equivalent to the approach based

    on sequential unconstrained minimization techniques (SUMT) proposed ear-

    by Fiacco and McCormick [9], [10] for solving nonlinear programming

    problems. Here a "barrier function," such as the logarithmic barrier function,

    is is used to transform a constrained minimization problem into a sequence of


