    The rational representation of a surface allows greater ease of transformation
    and shape control than is of most use in multiple objective optimization. The
    implicit form is useful for testing whether a point is above, or below the surface,
    where above and below is determined relative to the direction of the surface normal.
    It is crucial in applications to be able to go from one to the other, especially
    when curves and surfaces of an object are automatically generated in one of the
    two representations (Boehm, Farin, and Kahmann (1984)).


    In general, parameterization is more difficult than implicitization. For surfaces
    of degree higher than three, no rational parametric forms exist in general, although
    parameterizable subclasses can be identified. For low-degree curves and surfaces,
    Abhyankar and Bajaj (1987, 1987b) have developed and implemented procedures for
    parameterizing implicit forms. The approach has been extended to parameterize
    planar curves of higher degree (Abhyankar and Bajaj (1987c)) and special space
    curves. These methods can be specialized to work over rational or real fields
    (both of characteristic 0).


    For planar curves, i.e., curves having a rational parameter, there is also a subclass
    of curves parameterizable using polynomials. Polynomial parameterization is related
    to whether the rational curve has one or more places at infinity. An algorithmic
    irreducibility criterion has been developed (Abhyankar and Bajaj (1987b)) for
    determining when a rational curve has one place at infinity, and thereby, determining
    when a rational curve also has a permissible polynomial parameterization.


