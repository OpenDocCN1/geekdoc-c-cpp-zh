    and right iteration of the projective algorithm is equivalent to applying the


    translation $L_x^{-1}$, then optimizing over the ball of infinitesimals radius,
    applying the translation $L_{x^{-1}}.$


    Once we define the metric at the identity, the translation $L_x$ gives us a unique
    way of extending it to all interior points of the simplex, since the derivative
    of $L_x$ gives a natural way to map the tangent space at the identity to the tangent
    space at x:


    ```

    $$DL_x(T_e) \rightarrow T_x.$

    ```


    Thus we get the following Riemannian metric on $Int(S_n) = \{x: \sum x^i=1$, all
    $x^i > 0\}$ for the projective case:


    ```

    (2.1.1) \quad $$$g_{ij}(x) = \frac{1}{x^i x^j} [\delta_{ij} - \frac{1}{n}].$

    ```


    In the canonical problem with the extra constraints $Ax=0$ added, the associated
    Riemannian metric is the restriction to this subspace. In the affine case, we
    get the following Riemannian metric on the positive orthant and further restricted
    to the subspace $Ax=b$,


    ```

    (2.1.2) \quad $$$g_{ij}(x) = \frac{1}{x^i x^j} \delta_{ij}.$$

    ```


    In these formulae $g_{ij}(x)$ is a covariant, symmetric tensor of degree 2. The
    corresponding contravariant tensor is denoted $g^{ij}(x)$ and satisfies


    ```

    $$g^{ij}g_{jk} = \delta^i_k.$

    ```


    Note that although the dimension of the manifold we are working with is $n-1$
    due to the constraint $\sum x^i=1$, we are using $n$ coordinates $i,j=1dotsdotsn$
    in $g_{ij}$ for convenience. It is understood that in the quadratic form $g_{ij}u^iu^j$,
    $u^i$ is a contravariant vector satisfying $\sum u^i=0$. Similarly, the composition
    $g^{ij}g_{jk}$ needs to behave like the identity only on an appropriate $n-1$
    dimensional subspace.'
