    minima a priori. This property makes the class of convex functions rather important
    in the study of convex minimization methods and has attracted deue attention from
    many researchers. Convex functions (with further suitable

    restrictions) can be minimized in polynomial time [12].


    This leads to a natural question: Is convexity the characteristic property that
    separates the class of efficiently solvable minimization problems from the rest?
    Is there a broader class of functions for which existence of spurious local minima
    can be ruled out a priori?


    Here we give at least two reasons why a broader class is needed:


    +   1. If the given function $f(x)$ is not convex, it may be possible to define
    a Riemannian metric on the domain $U$ that for every pair of points in $U$ there
    is a unique geodesic joining them and the level sets of $f$ are geodesically convex
    in the sense that for every pair of points in a level set, the geodesic joining
    them lies entirely in the same level.

    2. If the given function is convex and we apply a nonlinear transformation to
    the space that is a diffeomorphism, the transformed function need not be convex,
    but the transformed problem may still be in spite of nonconvexity. In fact, there
    is a system of continuous trajectories defined in the original space that allow
    us to construct an algorithm for the global minimization problem, the image of
    these trajectories under the transformation gives us a way of solving the transformed
    problem. This argument suggests that the class of efficiently solvable optimization
    problems should be larger than the class of convex problems, and the property
    characterizing the broader class should be topologically invariant.


    In the next subsection we identify a class of functions, more general than convex,
    in terms of the connectivity of the level sets of the function.


    In the subsection 3.4, we give a formulation of NP-complete problems as a continuous
    optimization problem belonging to this class.


    # 3.3. Importance of connectivity.


    DEFINITION. A subset $X \subset R^n$ is said to be pathwise connected if for every
    pair of points $a, b \in X$, there exists a continuous path through $X$ joining
    the two points; i.e., there exists a continuous function $g(t): [0,1] \to X$ such
    that $g(0) = a$ and $g(1) = b$.


    DEFINITION. Let $f(x)$ be a function from an open set $U \subset R^n$ to $R$.
    The level set of $f$ corresponding to a level $\alpha \in R$ is denoted by $L_f(\alpha)$
    and is defined


    > $L_f(\alpha) = \{x \in U | f(x) \le \alpha\}$.


    In the following theorem we explain the importance of the class of functions having
    connected level sets.'
