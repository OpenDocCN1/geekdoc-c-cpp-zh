  md: 'In 1985 [So1] suggested a continuation method using “analytic centers” for
    solving general convex programs. In the underlying paper, the latter is applied
    to a generalized convex quadratic program, where also the constraints are given
    by convex quadratic functions. It is shown that for the latter problems, a simple
    zero-order extrapolation method following the path of analytic centers has a convergence
    rate of $(1 - const/\sqrt{m})$ per iteration. We point out that the proof outlined
    here can be extended to a class of more convex analytic programs. The exact proofs
    can be found in [Ja]; see also [SoSt] for other results on ellipsoidal approximations
    and higher-order extrapolation for generalized quadratic programs.


    # 1. Definitions


    The problem under study is to find


    $$\lambda^* := \min\{f_0(x)|f_i(x) \le 0 \text{ for } 1 \le i \le m\$


    where $x \in \mathbb{R}^n$ and the $f_i$ are convex quadratic functions. Let


    $P := \{x|f_i(x) \le 0 \text{ for } 1 \le i \le m\$


    We assume that the interior $P^circ$ is non nonempty and bounded. For $\lambda
    > \lambda^*$, let $P(\lambda)$ denote the polyhedron $P$ constrained by the additional
    inequality $f_0(x) \le \lambda$,


    The method follows a homotopy path $\lambda_0 \gg \lambda^*$, $\lambda_k \downarrow
    \lambda^*$ of some interior point in $P(\lambda)$ that is easily computable and
    depends on all constraints: A very convenient point ([So1] 1985) the analytic
    center $x(\lambda)$ of $P(\lambda)$, which is the unique point in $P(\lambda)^circ$
    minimizing the strictly convex logarithmic barrier function


    $$\varphi(\lambda, \lambda) := -ln(\lambda - f_0(x)) - \sum_{i=1}^m ln(-f_i(x))\$


    The analytic center $x(\lambda)$ also maximizes $(\lambda - f_0(x)) \cdot \prod_{i=1}^m
    (-f_i(x))$, i.e., the product of ''distances'' to the constraint functions. It
    is invariant under affine transformations of $P$ and invariant scaling of the
    functions $f_i$.


    Given $\lambda_0 > \lambda^*$ the first $x(\lambda_k)$ we outline how one can
    find a sequence $\lambda_k > \lambda_{k+1} > \lambda^*$ needs to be known in advance
    and approximations $y_k \in P(\lambda_k)^circ$ for $x(\lambda_k)$, so that $0
    < \lambda_{k+1}-\lambda^* < (1-c/\sqrt{m})\lambda_k-\lambda^*$ with fixed positive
    constant $c$. (Note that $y_k \in P(\lambda_k)^circ$ implies that $y_k$ is feasible
    and $0 < f_0(y_k)-\lambda^* < \lambda_k-\lambda^*$). Here, $y_{k+1}$ is obtained
    by one Newton step for finding the zero $x$ of $D\varphi(x, \lambda_k)$ using
    $y_k$ as the starting point.


    # 2. Newton''s method


    The analysis of the algorithm is based on an examination of Newton''s method applied
    to minimizing the logarithmic barrier function. For this'
