  md: 'in the case of integral coefficients the bounds on $x_i^*$ cannot be improved
    dramatically. For example, if


    ```

    $$\begin{bmatrix} 1 & & & \ -M & -M & 1 & \ \vdots & \vdots & \vdots & \ddots
    \ & -M & \dots & -M & 1 \end{bmatrix}$

    ```


    and $b = (M, \dots, M)^T$ then $x_m^* = \sum_{i=1}^m M^l$. Also, if


    ```

    $$\begin{bmatrix} M & M & M & \dots \ -1 & M & M & \dots \ & -1 & M & \dots \
    \vdots & \vdots & \vdots & \ddots \ & & -1 & M \ \end{bmatrix}$

    ```


    and $b = (1, 0, \dots, 0)^T$ then $x_m^* = 1/(M(M+1)^{m-1})$.


    Recall that to guarantee an $\varepsilon$-approximation in terms of the function
    value, we have to choose $\delta$ such that


    ```

    $$\delta \le \frac{\varepsilon}{e^T x^*}$

    ```


    Hence we get the estimate


    ```

    $$\delta \le \frac{\varepsilon \eta(A)}{m(\sqrt{mT^T})}$

    ```


    Another estimate can be derived by


    ```

    $e^T x^* \le \sqrt{m}\|x^*\| = \sqrt{m}\|B^{-1}b\| \le \frac{\sqrt{m}\|b\|}{\sqrt{\lambda_{\min}(BB^T)}}$

    ```


    where $\lambda_{min}$ denotes the least eigenvalue. Thus, we need a lower bound
    on the eigenvalue of any matrix of the form $BB^T$ where $B$ is a basis. Note
    that our estimates depend on properties of an optimal basis rather than one that
    supports the approximate solution. So, the optimal basis may be ill conditioned,
    this fact being known to the user, and the terminal basis well conditioned and
    satisfying the optimality conditions within tolerance.


    Obviously, if any $\eta(A)$ is known we then solve the $\varepsilon$-approximation
    problem in a polynomial number of operations in terms of $m, n$, and $-\log \delta$.
    However, in general $\eta$ is not known. It is interesting to note that for a
    practical solution of problems with thousands of variables, even with a sparse
    and well-structured problem with small integral coefficients, the required $\delta$
    may be too small to be practical. It is not clear that an approximate solution
    based on tolerance has a value close to the optimal. In fact, the value may be
    far from the optimum even though the duality gap is very small, since the vectors
    $x$ and $y$ are only approximately feasible.'
