    consists of the row vectors


    ```

    $a_1^T \text{ and } b = \begin{pmatrix} b_1 \ \vdots \ b^m \end{pmatrix} .$

    ```


    So, we can describe the above inequality system by $Ax \leq b$. The feasible set
    $X = \{x \in \mathbb{R}^n | Ax \leq b\}$ is a convex polyhedron. We prefer that
    type because we do not need slack variables, which would increase the dimension
    of the space and would destroy our ability to imagine what is going on geometrically.
    The Simplex Method solves such problems by running two phases.


    Phase I: Calculation of a vertex $x_0 \in X$. If this is impossible, then STOP.


    Phase II: Construction of a sequence $x_0, \dots, x_s$ of vertices of $X$ such
    that successive vertices are adjacent and the objective strictly increases from
    vertex to vertex. STOP as soon as the optimal vertex $x_s$ is reached or STOP
    as soon as the nonexistence of an optimal solution becomes obvious at a vertex
    $x_s$.


    (1.2)


    Since we want to study the complexity of that procedure, we are mainly interested
    in the number $s$. This is the crucial figure of complexity because it is easy
