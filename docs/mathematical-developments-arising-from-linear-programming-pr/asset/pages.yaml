    This implies that $h(P)$ is independent of the choice of linear function $z=c^ix$.
    In particular, $z=-c^ix$ would reverse the signs of all reduced costs but yet
    yield the $h$-vector, so the $h$-vector must be symmetric, i.e., $h_{d-i}, i=0,
    \dots, d$. This system of equations is equivalent to the Dehn-Sommerville equations
    $[7, 17]$.


    # 4. Algebraic significance of the $h$-vector


    Now let $P$ be a simplicial (rather than simple) $d$-dimensional polytope and
    $h(P)$ be the $h$-vector of a simple polytope dual to $P$. By replacing $f_j$
    by $f_{d-j-1}$ and using the Dehn-Sommerville equations, one can obtain formulas
    analogous to (2) and (3) directly in terms of the $f$-vector of $P$.


    ```

    $h_i = \sum_{j=0}^{i} (-1)^{i-j} \binom{d-j}{d-i} f_{j-1}, \quad i=0, \dots, d$

    $$f_j = \sum_{i=0}^{j+1} \binom{d-i}{d-j-1} h_i, \quad j=-1, \dots, d$$

    ```


    So, for example, we see that the $h$-vector of the octahedron (Figure 1) is (1,
    3, 3, 1).


    The boundary complex of a simplicial polytope is an example of a simplicial complex.
    Let $V$ be a finite set, $V=\{1, \dots, n\}$. A simplicial complex $\Delta$ on
    $V$ is a nonempty collection of subsets of $V$ that is closed under inclusion.
    For $F \in \Delta$, $F$ is called a face of $\Delta$, and its dimension, $\dim(F)$,
    is taken to be card$(F)-1$. The dimension of $\Delta$ itself, $\dim(\Delta)$,
    is $\max_{F \in \Delta} \dim(F)$.


    Given $F \in \Delta$, define $F$ to be $2^F$, the collection of all subsets of
    $F$, and $\partial F$ to be $2^F\setminus\{F\}$. The link in $\Delta$ of $F$ is
    $\mathrm{lk}_\Delta F=\{G \in \Delta: G \cap F = \varnothing, G \in \Delta\}$.
    If $F$ is not the empty set, we define $\Delta\setminus F=\{G \in \Delta: F \subset
