  md: '# SOLVING SMOOTH CONVEX PROGRAMS BASED ON NEWTON''S METHOD


    # 5. Conclusions


    We have shown that the trajectory of centers can be followed by using Newton''s
    method for a class of smooth convex programming problems. Our analysis indicates
    that the performance of the method depends on curvature of the objective and constraint
    functions near the trajectory.


