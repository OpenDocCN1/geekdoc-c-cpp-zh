  md: '# A Modified Kantovich Inequality for the Convergence of Newton’s Method


    A. A. GOLDSTEIN


    ABSTRACT. A sufficient condition is given guaranteeing quadratic convergence for
    Newton''s method to find a solution of $F(x)=0$. It assumed a Lipschitz-type condition
    for the inverse Jacobian $(DF)^{-1}(x)$ in the Newton''s method search direction.


    # 1. Introduction


    Newton’s method is now seen to play an important role in interior-point linear
    programming methods. The original Karmarkar algorithm has an interpretation (see
    Bayer and Lagarias [1]), and other interior methods use Newton steps. The analyses
    of Renegar [12] and Renegar and Shub [13] described how to follow a central trajectory
    using Newton''s method. Such trajectories were studied by Megiddo [10] and Bayer
    and Lagarias [2] and [3]. More Nesterov and Nemirovsky [11] have defined a large
    class of functions called self-concordant functions for which a variant of Newton''s
    method has global convergence properties. They showed that self-concordant functions
    can be found to solve many optimization problems including linear programming.


    It is well known that Newton''s method for finding a zero of a function $F(x)$
    generally converges quadratically in a close neighborhood of a zero. It is of
    great interest to determine as large a neighborhood as possible in which quadratic
    convergence is guaranteed. Many results of this kind have been given, starting
    from Kantorovich [9], and including Smale''s conditions on one point [15]. These
    results all require implicitly or explicitly some global constraint on the behavior
    of the function on an open set. Here we give a new variant of a Kantorovich-type
    inequality requiring only a Lipschitz-type condition in the direction of the Newton
    step for all points in an open set.


    1980 *Mathematics Subject Classification* (1985 Revision). Primary 49D15.

    Supported in part by Grants NIH RR012431 and NPS LHC-M44E1.


    ©1990 American Mathematical Society

    0271-4132/90 $1.00–$2.25 per copy'
