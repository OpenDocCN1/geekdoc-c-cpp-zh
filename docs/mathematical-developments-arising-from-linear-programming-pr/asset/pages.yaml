  md: 'run (at the time of publication) in time comparable to that taken by the best
    combinatorial codes. Subsequently, the combinatorial codes have been improved
    by incorporating some of the time-saving heuristics suggested by Groschechel and
    Holland [3], [4].


    In this report we describe an algorithm for the matching problem. This algorithm
    is also a cutting-plane algorithm, and it uses several of the heuristics of Groschechel
    and Holland [10]. However, rather than using the simplex method, we use Karmarkar''s
    algorithm (see Karmarkar [13]) in deciding how to proceed working on each successive
    linear programming relaxation of the original integer programming problem. Karmarkar''s
    method does not share this theoretical property; we were attracted to an interior
    point method in a cutting-plane context by the very favorable results quoted for
    such methods. (See, example, [1], [17], [14]).


    The performance of Karmarkar''s algorithm on linear programming problems differs
    in several ways from the performance of the simplex method, and many of these
    differences have to be taken into account when designing a cutting-plane algorithm.
    It has been noted that interior point methods perform poorly when started from
    nonoptimal vertices; therefore, we do not solve relaxation to optimality, but
    we attempt to add cuts as soon as possible. Because the amount of work required
    in each iteration is considerably higher for an interior point method than for
    simplex (with fewer iterations needed), the cost of the separation routines relative
    to the cost of an iteration is lower, so calling the separation routines whenever
    possible not drastically increase the cost of an iteration. When one uses the
    simplex method, the dual simplex algorithm is used to solve a relaxation after
    cutting planes are added, primal feasibility is only achieved when optimality
    is achieved. On the contrary, in our method we always maintain both primal and
    dual feasibility, so it is possible to call the separation routines whenever the
    solution to the relaxation is updated.


    Since we call the separation routines before solving the current relaxation, we
    do not require nearly the number of iterations of Karmarkar''s algorithm that
    might be demanded. In addition, because of the nature of the cuts generated when
    solving the matching problem, we found that our algorithm usually generated fewer
    relaxations than a simplex-based cutting-plane algorithm (See §4).


    The cutting-plane procedure described in this paper can be used to solve other
    combinatorial optimization problems. In particular, we have also developed an
    algorithm for solving linear ordering problems. (For a description of a cutting-plane
    algorithm based on the simplex method for the linear ordering problem, the reader
    is referred to [11]). This paper is intended to be an extended abstract of [15],
    [16]. More details of the algorithm, together with more motivation of various
    stages of, it can be found in those papers.


    We now define the matching problem. A graph G = [V, E] consists of'
