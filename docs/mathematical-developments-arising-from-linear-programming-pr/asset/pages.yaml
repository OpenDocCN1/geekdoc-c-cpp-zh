    In §2.2 we introduce such a projectively invariant Riemannian metric. In §4, we
    show that the integral of the scalar curvature with respect to this Riemannian
    metric is bounded by O(L) for the unconstrained case where the problem has no
    equality constraints, and in §5 we present a result suggesting that a similar
    bound may hold for the general case.


    It to relate such scalar curvature bounds to the performance of the discretized
    version of the algorithm. In §4.2 we indicate questions remaining to be answered
    regarding the relation between the discrete and continuous version of the algorithm.


    The usefulness of the Riemannian metric that we introduce is also demonstrated
    by the fact that there is a natural characterization of the vector field underlying
    the projective algorithm in terms of the geodesics in this metric, given in §3.3.


    # 2. Riemannian metrics and affine connections


    In the projective algorithm, we first decide how to proceed from a given point
    on the curve, (at least conceptually) to bring that point to the center of the
    simplex. Then long a step we can take from this point should depend on how much
    the path bends in this transformed coordinate system.


    Instead of using an infinite number of different coordinate systems to analyze
    the performance of the infinitesimal version of the algorithm, an equivalent approach
    is to construct a Riemannian metric $g_{ij}(dx^i dx^j)$ on the original space,
    which is invariant with respect to projective transformations of the simplex.
    There is an essentially unique choice of such a metric, and we study it.


    In the rest of the paper, in formulae for Riemannian metrics and affine connections,
    we generally use the Einstein summation convention, in which upper and lower indices
    that match in any expression are to be summed over; e.g., the expression $g_{ij}dx^idx^j$
    for a Riemannian metric abbreviates $\sum_{i=1}^n\sum_{j=1}^ng_{ij}dx^idx^j$.
    However, this connection is not used in formulae containing explicit summation
    signs, e.g., (3.2.2).


    # 2.1. Projectively invariant Riemannian metric. A projectively invariant choice
    of metric is based on the observation that the strict interior of the simplex
    is a Lie group with the following definition for multiplication:


    $x, y \in S_n, \quad (x \circ y)^l = \frac{x^l y^l}{\sum_k x^ky^k}$


    The identity element is the center of the simplex:


    ```

    $x^l = \frac{1}{n}$

    ```'
