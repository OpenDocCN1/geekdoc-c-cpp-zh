    # 5. Karmarkar''s algorithm, A-trajectories, and Hamiltonian systems


    Karmarkar''s algorithm, an interior point method for linear programming, has received
    much attention in the literature over the past five years and has spawned many
    variants. Recently Bayer and Lagarias [5] have shown that the A-trajectories of
    the affine scaling field associated with the affine scaling algorithm (see [4]
    or [31]) can be viewed as trajectories of integrable Hamiltonian systems. We briefly
    review these results here.


    In [6], a linear program in R^n in inequality form is considered:


    ```

    $min(c, x) - c_0\n(a_j, x) \ge b_j, \quad 1 \le j \le m$

    ```


    where the polytope Ph is full dimensional and the vectors [ai, ..., am] span R^n.
    One also supposes that the polytope of feasible solutions is bounded with nonempty
    interior. (The assumption of boundedness may be relaxed, however).


    There are several ways of describing the A-trajectories (see [6]), but one may
    show that they are given by


    ```

    $x \in int(Ph) : \phi_H(x) = \phi_H(x_0) + tc, \quad some \ t \in \mathbb{R}$

    ```


    where x_0 is the starting point and \phi_H(x) are the "Legendre transform" coordinates
    given by


    ```

    $\phi_H(x) = f_H(x)$

    ```


    where f_H(x) is the logarithmic barrier function


    ```

    $f_H(x) = -\sum_{j=1}^m log((a_j, x) - b_j)$

    ```


