  md: '# Steepest Descent, Linear Programming, and Hamiltonian Flows


    A. M. BLOCH


    ABSTRACT. In this paper we analyze the structure of the gradient-like flows associated
    with several problems of numerical importance. In particular, we review the flows
    associated with the QR algorithm and the total least squares problem, the A-trajectories
    associated with the affine scaling algorithm that is a variant of Karmarkar''s
    algorithm for linear programming, and certain flows associated with the orthogonal
    group associated with geometrical matching problems and linear programming. We
    show that all these flows are equivalent, under a nonlinear transformation, to
    flows of integrable Hamiltonian systems or are closely related to them.


    # 1. Introduction


    Recently there has been some interest in the continuous flows associated with
    numerical algorithms. (See, for example, [17].) A by now classic case is the relationship
    between the Toda lattice flow and the QR algorithm.


    We have observed a common trend among the flows associated with this algorithm
    and with other algorithms that are either of steepest descent type or closely
    related—namely that these flows are Hamiltonian. Further, these flows are integrable.
    Moreover, several of the flows are associated with linear programming. In this
    paper we review a number of flows of this type and also introduce some new results.


    We begin by discussing the QR algorithm for diagonalizing symmetric matrices,
    which can be shown to be equivalent to the time-l mapping of the Toda lattice
    flow. (See [17], [19], [27], [28].) The Toda flow is the flow of an integrable
    Hamiltonian system, but can be seen in the original work of Moser [25], the Toda
    flow (in the nonperiodic case) is, in fact, essentially a gradient flow.


    1980 Mathematics Subject Classification (1985 Revision). Primary 34A05, 49D35,
    70H05. This paper was submitted to the editors for publication in October 1988.


    Supported in part by grants from the National Science Foundation and the Air Force
    Office of Scientific Research, by the U. S. Army Research Office through the Mathematical
    Sciences Institute of Cornell University, and by a Seed grant from Ohio University.'
