  md: '# A Note on Limiting Behavior of the Projective and the Affine Rescaling Algorithms


    MIROSLAV D. AŠIC, VERA V. KOVAČEVIĆ-VUJJIĆ, AND MIRJANA D. RADOSAVLJEVIĆ-NIKOLIĆ


    ABSTRACT. In this paper we show that both the projective (Karmarkar [6]) and the
    affine rescaling algorithms (Dikin [4], Barnes [3]) have a unique asymptotic direction
    of convergence to the optimum, provided that some nondegeneracy assumptions are
    satisfied. The degenerate case is still open, although a similar behavior was
    observed in many numerical experiments.


    # 1. Introduction


    The asymptotic behavior of various rescaling algorithms has been studied by many
    researchers. Both the discrete and the continuous variants were investigated and
    a variety of techniques applied. We mention here a few results that are closely
    related to the present work.


    Megiddo and Shub in [7] consider the asymptotic behavior of continuous trajectories
    defined by the affine rescaling vector field. Under nondegeneracy conditions they
    show that every interior orbit is tangent to the direction uniquely determined
    by the componentwise inverse of the reduced cost vector at the optimal vertex.
    Adler and Monteiro in [1] show that a similar result also holds in the presence
    of primal and dual degeneracies. Witzgall, Boggs, and Domich present in [12] an
    alternative proof based on g-center manifolds.


    Shub in [10] analyzes both continuous and discrete trajectories defined by the
    projective rescaling vector field. Under nondegeneracy assumptions he proves that
    the continuous trajectories are tangent at the optimum to the same direction as
    in [7]. In the discrete case he obtains an estimate of the rate of convergence
    of the generated sequence of points to the optimal solution.


    1980 Mathematics Subject Classification (1985 Revision). Primary 90C05.

    The authors'' research supported in part by Republika Zajednica za Nauku SR Srbije
    dedicate this paper to her memory.

    The third author died on March 11, 1990. The other authors dedicate this.'
