  md: '# A PRIMAL-DUAL INTERIOR POINT METHOD FOR LINEAR PROGRAMMING 123


    Here, $X$ is a diagonal matrix with the components of $x^k$ on the diagonal, $Z$
    is a diagonal matrix with the components of $z^k$ on the diagonal, and $e = (1,
    1, \dots, 1) \in \mathbb{R}$. On each iteration, the parameters $\alpha^k$ and
    $\mu^k$ are chosen so that $x^{k+1} > 0$ and $z^{k+1} > 0$. Lustig (1988a) has
    shown that only mild restrictions on the values of $\alpha^k$ and $\mu^k$ are
    necessary to guarantee convergence of the algorithm. However, the algorithm requires
    that feasible points $x^0, y^0$, and $z^0$ be given.


    Note that the directions given above are written in two parts: directions $p_x^l,
    p_y^l$, and $p_z^l$ are used to reduce the duality gap whereas the directions
    $p_x^k, p_y^k$, and $p_z^k$ center the iterates $x^k$ and $z^k$. If we let $d^k
    = c^T x^k - b^T y^k$ represent the duality gap between the feasible primal-dual
    pair $(x^k, y^k)$, the directions have the property that $c^T p_x^k - b^T p_y^k
    = d^k$ and $c^T p_z^k - b^T p_z^k = n$. The duality gap changes according to $d^{k+1}
    = d^k - \alpha^k (d^k - n)$. If $\alpha^k < (d^k/n)$, then the directions $p_x^k,
    p_y^k$, and $p_z^k$ reduce the duality. In addition, $d^k = e^T ZX$, so that the
    measure of complementarity decreases.


    # 3. Finding a feasible point


    Megiddo (1986), Kojima et al. (1988), Monteiro and Adler (1989), and McShane et
    al. (1989) have suggested setting up the following pair of primal and dual linear
    programs to find the solution of a problem for which an initial feasible point
    is not augmented. The augmented system is (3.1)


    ```

    minimize $c^T x + M_p x_{n+1}$\nsubject to $Ax + (b - Ax^0) = 0$\n$(A^T)^T y +
    (z - z^0)^T x + x_{n+2} = M_D, \quad x_{n+1}, x_{n+2} \geq 0$.

    ```


    The dual system is


    ```

    (3.2) maximize $b^T y + M_D y_{m+1}$\nsubject to $A^T y + (z - z^0)y_{m+1} + z
    = c$,\n$(b - Ax^0)^T y + z_{n+1} = M_p$,\ny_{m+1} + z_{n+2} = \geq 0$,

    ```


    where $x^0 > 0, z^0 > 0$, and $y$ are arbitrary initial points. For large enough
    values of $M_p$ and $M_D$, the optimal solution $x$ to (3.1) will be the same
    as the optimal solution to (2.1). Similarly, the optimal vectors $y$ and $z$ to
    (3.2) will be the same as the optimal solution to (2.2). This solution will have
    that $x_{n+1} = 0$ and $y_{m+1} = 0$.


    The generic primal-dual algorithm can be applied to the primal-dual pair of linear
    programs given by (3.1) and (3.2). An initial feasible solution is easily attained
