  md: '# SOME RECENT RESULTS ON CONVEX POLYTOPES


    #  3. h-vectors, f-vectors, and faces


    It may seem surprising enough that the different sign patterns of the reduced
    costs contribute to the signs of the terms of (1) in just the right way, but in
    fact the reduced costs tell us even more. Let $h_i$ be the number of vertices
    for which there are exactly $i$ positive reduced costs (and hence $d-i$ negative
    reduced costs). Define the $h$-vector $h(P)$ to be $(h_0, \dots, h_d)$. So, from
    the previous example, the $h$-vector of the 3-cube is $(1, 3, 3, 1)$. From the
    $h$-vector it is possible to determine the number of faces of $P$ of all dimensions:


    ```

    $f_j = \sum_{i=j}^d \binom{i}{j} h_i, \quad i=0, \dots, d,$

    ```


    where $f_j$ equals the number of $j$-dimensional faces of $P$. The vector $f(P)
    = (f_0, \dots, f_d)$ is called the $f$-vector of $P$. For the 3-cube it is $(8,
    12, 6, 1)$. Formula (2) implies that the $f$-vector can be derived from the $h$-vector
    by constructing a triangle in a manner similar to Pascal''s triangle, but replacing
    the right-hand side of the triangle by the $h$-vector. The $f$-vector emerges
    in reverse at the bottom.


    ![](img/37c51c400a5180ea99d953873bf70e4f_20_0.png)


    One way to verify (2) is to use the one-to-one correspondence between the $d+m$
    variables and the $d+m$ constraints. The original $d$ variables correspond to
    the nonnegativity constraints. A constraint is enforced when the corresponding
    variable is set to zero. At a vertex $v$, the $m$ slack variables correspond.
    let $S(v)$ be the set of nonbasic vertices. For every subset $T$ of $S(v)$, consider
    the set of all points in $P$ for which the constraints corresponding to $S(v)\setminus
    T$ hold efficiently. If $card(T)=j$ then we obtain a face of dimension $j$. Moreover,
    if we carry this out for every vertex of $P$, we encounter every face once and
    only once [7,8]. So, the number of faces $j$ equals the number of ways of finding
    an $S(v)$ of cardinality $i \geq j$ and selecting a subset of size $j$.


    The above argument works as long as $P$ is simple and $z$ is nonconstant on every
    edge. Thus an enumeration of the vertices of $P$ (by the simplex method, for example)
    provides us with enough information to enumerate all the faces of $P$ efficiently.


    Inverting (2) yields


    ```

    $h_i = \sum_{j=i}^d (-1)^{j+i} \binom{j}{i} f_j, \quad i=0, \dots, d.$

    ```'
