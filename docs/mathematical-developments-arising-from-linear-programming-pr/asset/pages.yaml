    We embed our polyhedron $P_n$ in $\mathbb{R}^{n+1}$ by writing


    ```

    $$(a_1^T, a_2^T, a_3^T, \dots, a_n^T, b^i) \begin{pmatrix} x^1 \ \vdots \ x^{n+1}
    \end{pmatrix} \le 1 \iff a_i^T x + b^i x^{n+1} \le 1$$

    ```


    for $i=1, \dots, m$. This inequality system defines a new polyhedron $P_{n+1}
    \subset \mathbb{R}^{n+1}$. Here we distinguish between different values of the
    additional variable $x_{n+1}$, the so-called levels.


    In level $x_{n+1} = 1$ we find our original polyhedron $P_n$ (augmented by $1$''s
    in the additional component), because $a_i^T x + b^i x^{n+1} \le 1$ and $x_{n+1}
    = 1$ means $a_i^T x \le 1$.


    In level $x_{n+1} = 0$ we find a polyhedron $\tilde{P}_n$ (augmented by the original
    component), because $a_i^T x + b^i x^{n+1} \le 1$ and $x_{n+1} = 0$ means that
    $a_i^T x \le 1$.


    If all the $a_i$ satisfy the conditions of (5.2), we can immediately solve the
    problem $\tilde{P}_n$, and know results hold. Now we solve what we can and proceed
    to level 1.


    +   (1) Solve the problem of $\tilde{P}_n$. (By our old complete method, 0 is
    feasible.) If this problem has no solution, we STOP. (Unboundedness of $v^T x$
    leads to unboundedness of $v^T x$ in $P_n$ — if $P_n$ is nonempty.)


    +   (2) Consider the problem of the $\tilde{P}_n$ in level 0. It is located on
    an edge of $P_{n+1}$. Now apply the shadow-vertex algorithm to


    ```

    $$(5.11) \maximize x^{n+1} \ \text{subject to } a_i^T x + b^i x^{n+1} \le 1 \quad
    (i=1, \dots, m).$$

    ```


    Every point on the realized path is $(v, e_{n+1})$-cooptimal. Hence a path point
    of level $x^{n+1} = 1$ will be $v$-optimal in level $x_{n+1} = 1$. Then the truncated
    vertex $(x^1, \dots, x^n)$ is the optimal solution.'
