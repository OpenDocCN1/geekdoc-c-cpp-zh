  md: '# Phase 1 Search Directions for a Primal-Dual Interior Point Method for Linear
    Programming


    ABSTRACT. A new method for obtaining an initial feasible interior point solution
    to a linear program and its dual is presented. Given a linear program, an auxiliary
    program is created that uses a "big-M". By considering the search directions by
    solving the auxiliary problem as functions of the values of $M$, it is shown that
    as $M \to \infty$, the directions have limits and can be interpreted as Newton
    search directions on a certain system. Even though a proof of the theoretical
    convergence of the method is an open question, computational experience indicates
    that the method works well in practice.


    # 1. Introduction


    Since Karmarkar (1984) described his new polynomial-time algorithm for linear
    programming, many researchers have derived different variants of the algorithm.
    Most of these variants require that an initial interior feasible point be given.
    In order to find such a point, an auxiliary linear program is solved. An initial
    interior point for the auxiliary problem is easy to determine. The solution of
    this auxiliary program is found to be an initial interior point for the original
    linear program. Usually, the auxiliary program contains a large constant (a "big-M")
    that is required in order to guarantee the existence of a solution of the auxiliary
    problem. The use of such a constant can be unsettling in practice.


    Megbido (1986) described how one can take a primal and dual pair of linear programs,
    with each problem having a big-M in the objective and the right-hand side. If
    the primal-dual interior point methods of Kojima et al. (1988), Monteiro and Adler
    (1989), or Lustig (1988a) are applied to the auxiliary problems, the search directions
    generated will depend on the value of $M$. In this paper,


    1980 Mathematics Subject Classification (1985 Revision). Primary 90C05. Key words
    and phrases. Linear programming, interior point methods, primal-dual algorithms,
    feasibility.'
