    hat{\\lambda}_k - c_k^T y_k)$ for all $k$. Step 3 therefore applies the following\
    \ stopping test:\n\n(3) if $\\hat{\\lambda}_k - c_k^T y_k \\leq 0.8\\varepsilon$\
    \ then stop, else go 1.)\n\nFrom the previous results one can derive\n\nMAIN THEOREM.\
    \ If we start the algorithm with a point $y_0$ close to a first center $x(\\lambda_0)$\
    \ of $P(\\lambda_0)$ $\\|y_0 - x(\\lambda_0)\\|_{H(Y)} \\leq 0.01$, e.g.) the\
    \ upper bound for the error $\\hat{\\lambda}_k - \\lambda^* \\leq c_k^T y_k^*$\
    \ is reduced by a factor of $(1 - (1/450\\sqrt{m}))$ with each Newton step, or\
    \ by a factor of $\\varepsilon$ within $450\\sqrt{m} \\ln \\varepsilon$ iterations.\n\
    \nAs far as we know, this is the first theorem that proves the (polynomial) complexity\
    \ of $O(\\sqrt{m} \\ln \\varepsilon)$ Newton iterations to reduce the error in\
    \ the objective function value by a factor of $\\varepsilon$ for a class of problems\
    \ with non-linear constraints independent of the data of functions $f_i$.\n\n\
    The algorithm as explained in the main theorem is not intended for a practical\
    \ implementation (see below), and no attempt has been made to improve the constant.\
    \ Note that the complexity of $O(\\sqrt{m} \\ln \\varepsilon)$ Newton steps for\
    \ reducing an initial error of the quadratic program by a factor of $\\varepsilon$\
    \ was first obtained by [Re] and by [Ge] for the case of a linear program, but\
    \ so far it could not be improved, not in the linear case.\n\nThe implementation\
    \ described in Chapter 4 uses a modified algorithm that shows a remarkable speed\
    \ due to the following extrapolation procedure. Based on the values $\\hat{\\\
    lambda}_{k-j}, y_{k-j}, \\hat{\\lambda}_{k+1}, y_{k+1},\\dots, \\hat{\\lambda}_k,\
    \ y_k$ compute an interpolating function $\tilde{x}$ with $\tilde{x}(\\lambda_i)=y_i$,\
    \ for $k-j \\leq i \\leq k$ and evaluate $\\hat{\\lambda}_{k+1}$ as an approximation\
    \ for the first center $x(\\lambda_{k+1})$. Then perform a small number of Newton\
    \ steps starting from $\\hat{\\lambda}_{k-1}$. In our implementation we have deemed\
    \ the value of $\\lambda_+$ adaptively as large as possible so that Newton iteration\
    \ still converges rapidly.\n\nThe results of Chapters 2 and 3 can also be generalized\
    \ with qualitatively similar outcomes to nonquadratic functions $f_i$ whose Hessian\
    \ matrices remain positive and fulfill the following Lipschitz condition':\n$\\\
    exists M>0: \\forall x,y \\in P^0, \\forall z \\in \\mathbb{R}^n$\n\n> $|z^T f_i(x)z\
    \ - D^2 f_i(y)z| \\leq M\\|x-y\\|_{H(Y)} D^2 f_i(x)z$.\n\nIn this space of convergence\
    \ can be shown to be of $O(\\sqrt{m}(1+M^*) \\ln \\varepsilon)$ and the two-sided\
    \ ellipsoidal approximation of the set $P$ can be maintained with a similarity\
    \ ratio of $40m(1+M^*)^3$. For further details we refer to [Ja2].\n\nWhen following\
    \ by a first-order extrapolation method from $\\lambda = \\infty$ to $\\lambda\
    \ = \\lambda^* + \\delta$, the number of steps is of order $O(I^\\delta(x(\\cdot)))$,\
