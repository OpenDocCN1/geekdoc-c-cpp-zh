  md: 'The complement of each such $X''$ corresponds to a $d$-simplex in a triangulation
    of the polytope $P$, and the order induced by the halfline is a shelling order
    for the triangulation [24], [25], [30]. (That procedure resembles line shellings
    is no coincidence.) Such a triangulation will be called a Gale triangulation of
    $P$. During the shelling process the boundary of the triangulation changes by
    bistellar operations, so if $P$ is simplicial this induces a construction of the
    boundary complex of $P$ by a sequence of bistellar operations.


    In Figure 5, the halfline in the scaled Gale transform of the octahedron induces
    a triangulation of the octahedron into four samples, each sharing the common interior
    edge 56. The corresponding bistellar operations are precisely those depicted in
    Figure 3.


    If $d = 2$ or $n \le d+3$ every triangulation of $P$ is a Gale triangulation.
    In fact, Gale transforms can be used to prove that in these cases the collection
    of all subdivisions of $P$, ordered by refinement, is isomorphic to the face lattice
    of $(n-d-1)$-dimensional polytope [23], [24], [25].


    ![](img/37c51c400a5180ea99d953873bf70e4f_28_0.png)


    FIGURE 5. Inducing a Gale triangulation of the octahedron.'
