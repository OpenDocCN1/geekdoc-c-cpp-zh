  md: '# CONVERGENCE BEHAVIOR OF TRAJECTORIES FOR LINEAR PROGRAMMING


    Different vectors g may lead to the same g-center. Let L denote the linear subspace
    parallel to the affine hull H of a solution set. Then two gcenters $u^h(g^{(1)})$
    and $u^h(g^{(2)})$ of the same constraint system coincide if and only if the vectors
    $g^{(1)}, g^{(2)}$ have the same orthogonal projection onto L. Also, for every
    interior solution $u$ of a linear constraint system there exists a unique vector
    $g \in L$ for which $u=u^*(g)$. These considerations lead to the definition of
    higher dimensional analogues to analytic g-centers of a linear constraint system
    (1.1). We select in $R^m$, parallel to the affine hull H of the solutions set
    of (1.1) but otherwise arbitrary, a $k$-dimensional linear manifold, which we
    call a


    (1.12) template.


    (1.13) $C^T u = d$


    describes the template, then any parallel displacement of the template that differs
    from (1.13) only by the choice of the right-hand sides $d$. Adjoining one of those
    linear systems to the original system yields an expanded system


    $A^T u \le b$,n$E^T u = f$,n$C^T u = d$.


    (1.14) We now vary the right-hand sides $d$ such that the corresponding parallel
    displacements of the template meet the relative interior of the original solution
    polyhedron. The locus of all $g$-centers of such systems forms an $\hat{m}-k$-dimensional
    algebraic manifold or variety, the


    (1.15) g-center variety. Here $\hat{m}$ denotes the dimension of the original
    solution polyhedron. The variety is characterized by the existence of Lagrange
    multipliers $w, z$ (compare (1.10)) such that


    (1.16) $-AR^{-1}(u)e = g + Ew + Cz$.


    Consider the template displacement passing through the g-center $u^h(g)$ of the
    original system (1.1). We call the corresponding expanded system (1.14) a


    (1.17) g-center restriction. of the system (1.1) by the template (1.13). There
    is a unique g-center restriction for each template.'
