  md: '# SOLVING MATCHING PROBLEMS USING KARMARKAR''S ALGORITHM


    a finite, nonempty set of vertices $V$ together with a set of edges $E$, where
    each element $e$ of $E$ is defined as an unordered pair of vertices $i$ and $j$
    in $V$—we write $e=ij$; these two vertices are adjacent and are called the endvertices
    of $e$. If $G=\{V,E\}$ is a graph, the set of edges induced by $W$ is defined
    as $E(W) :=\{ij \in E : i, j \in W\}$, and the cut induced by $W$ is defined as
    $\delta(W) :=\{ij \in E : i \in W, j \in V \setminus W\}$. We write $\delta(v)$
    for $\delta(\{v\})$, the set of edges indexed to vertex $v$. A set of edges $M$
    with no two edges sharing a common vertex is called a matching. Let $n=|V|$. A
    matching of cardinality $n/2$ is called a perfect matching. Let $w:E \rightarrow
    R$ be a weight function on the edges of the graph $G$. For a matching $M$, the
    weight of $M$ is given by


    $w(M) := \sum_{e \in M} w(e).


    Then the matching problem is to find a maximum weight matching in the graph $G$.


    # 2. Formulation as a linear programming problem


    We recall Edmonds'' polyhedral description of the matching problem. Let $A$ be
    a subset of the edges of the graph $G=\{V,E\}$. Define $m=|E|$, and consider the
    components of $R^m$ indexed by $E$. The incidence vector $y(A)$ of $A$ is the
    $\{0,1\}$-vector in $R^m$ given by


    $y(A) = \begin{cases} 1 & \text{if } e \in A; \\ 0 & \text{otherwise.} \end{cases}$


    The matching polytope $P_M(G) \subseteq R^m$ of the graph $G$ is defined to be
    the convex hull of the set of incidence vectors of matchings of the graph. $P_M(G)$
    can be written


    $P_M(G) := conv\{y(M) \in R^m : M \subseteq E \text{ is a matching}).$.


    There is a bijection between the vertices of $P_M(G)$ and the matchings $M$ of
    the graph $G$.


    It was shown by Edmonds that


    > THEOREM 1. For every graph $G=\{V,E\}$, $P_M(G)$ is the solution set of the
    following system of inequalities:


    (1) \quad y(\delta(v)) \leq 1 \quad \text{for all } v \in V,\n(2) \quad y(E(W))
    \leq \frac{1}{2}(|W|-1) \quad \text{for all } W \subseteq V, |W|,$\n(3) \quad
    y(e) \geq 0 \quad \text{for all } e \in E.


    We refer to (1) as degree constraints, and (2) as odd set constraints, and to
    (3) as nonativity constraints.(The odd set constraints are sometimes called blossom
    constraints.) Thus, the matching problem can be expressed as


    $max\{w^T y : y \in R^m, \text{ satisfies } (1), (2), (3)\}.$.'
