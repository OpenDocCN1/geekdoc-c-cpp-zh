    2.3. Algorithm of centers for finding an efficient way. In this section we briefly
    describe the method of centers (Huard (1967)) applied to vector optimization.
    A similar approach was followed by Renegar (1986) in the single objective linear
    case. It results in a polynomial algorithm for linear vector optimization (Morin
    and Trafalis (1989)).


    Let $x^k$ be an interior point of $P$ and consider the intersection $P_k$ of $x^k+\Lambda$
    and $P$. Find the next center $x^{k+1}$ of $P$ and start with $x^{k+1}$ instead
    of $x^k$. That is, a sequence of points $\{x^k\}$ that is in the general case
    infinite. We will show that this sequence converges to a Pareto optimal solution.
    More formally,


    ALGORITHM (i) [Method of centers].


    +   0. Set $k=0$.


    +   1. Let $x^k$ be the interior point of $P$. Consider the intersection $P_k$
    of $x^k+\Lambda$ and $P$. Find the center $x^{k+1}$ of $P_k$.

    2. If $|x^{k+1}-x^k| < \epsilon$, then stop. Return to 1, with $k \leftarrow k+1$.


    It can be shown (Bayer and Lagarias (1989)) that the above sequence of points
    lies on a real algebraic curve.


