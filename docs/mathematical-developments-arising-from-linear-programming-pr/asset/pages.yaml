  md: '# Canonical Problems for Quadratic Programming and Projective Methods for Their
    Solution


    ABSTRACT. Define ($P$) to be the decision problem that asks if a given quadratic
    form $\phi$ attains the value of zero over a simplex. We prove that ($P$) is NP.
    We associate a generalized Karmarkar potential function $f$ to ($P$) having the
    property that if its infimum over the interior of $f$ is nonnegative, then $\phi$
    has zero over the simplex. We describe two procedures, $W$ (weak) and $S$ (strong),
    for optimization or $f$ using projective transformations. Procedure ($W$) solves
    either ($P$) or obtains an interior unconstrained (local minimum) point of $f$.
    Under convexity of $\phi$, either procedure is capable of solving ($f$). In particular,
    linear programming with constraints is formulated as ($P$) with a convex $\phi$.
    We describe a third procedure for convex $\phi$ which reduces to our previous
    extension of Karmarkar''s algorithm. Define ($GP$) to be the more general problem
    that asks if $\phi$ has a nontrivial nonnegative zero in an arbitrary subspace
    containing the vector of ones. Procedure $W$ extends to ($GP$), and in the special
    case where $\phi$ is the square of a linear function, it reduces to Karmarkar''s
    algorithm using optimal stepsize in each iteration iteration. A general quadratic
    programming problem can be solved by solving a sequence of ($GP$)s, each of which
    can be approximated by solving two associated ($P$)s.


    # # 1. Introduction


    Karmarkar''s ingenious projective algorithm [13] has motivated the development
    of several other interior algorithms for linear and convex quadratic programming.
    For the $NP$-hard problem of computing the global minimum of a nonconvex quadratic
    over linear constraints, except for Karmarkar''s interest [14], [15] and the work
    of Ye [24], we are not aware of other algorithms. While there exist methods for
    solving this problem (e.g., see [10], [11]), it is natural to investigate extensions
    of the interior linear or convex


    1980 Mathematics Subject Classification (1985 Revision). Primary Q90C20. Words
    and phrases: Karmarkar''s algorithm, projective transformation, linear programming,
    quadratic programming.


    This research was supported in part by the National Science Foundation under Grant
    No. CCR-88-07518.'
