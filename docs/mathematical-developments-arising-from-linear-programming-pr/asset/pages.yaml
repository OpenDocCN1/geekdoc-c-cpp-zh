    only involves a subset $\={E} \subseteq E$ of the edges. This subset contains
    the shortest edges in G. In the results quoted later, the 7 shortest edges adjacent
    to each vertex in the 60 vertex problems and the 10 shortest edges adjacent to
    each vertex in the 202 vertex problems.


    +   2. We use a greedy procedure to find a matching $M$. Let $y^l$ be the incidence
    vector of $M$. Let $z^l := w^T y^l$ be a lower bound on the optimal value of


    ```

    max{z : z \le w^T y, y \in P_M(G)}

    ```


    and also on any relaxation of this linear program. We take $(y^l, z^l)$ to be
    our initial dual solution. The point $y^l$ is our best initial dual point; y is
    the best continuous dual point. Every primal constraint allows a surplus variable
    together with two terms corresponding to potentials on the vertices. Therefore,
    it is straightforward to find an interior primal solution if the potentials chosen
    are large enough. We take such a point as our initial primal solution.


    +   3. We use the Todd-Burrell procedure [21] to update the current dual solution
    (y, z).


