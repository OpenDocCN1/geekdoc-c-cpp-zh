  md: '# Riemannian Geometry Underlying Interior-Point Methods for Linear Programming


    ABSTRACT. This paper studies the continuous trajectories underlying the projective
    and affine algorithms for linear programming, particularly the projective trajectories,
    using the techniques of differential geometry. We formulate a projectively invariant
    Riemannian metric defined on the feasible region of the linear programming problem
    and study the scalar curvature of the trajectories with respect to this metric.
    We present reasons why the total scalar curvature of trajectories should approximate
    the number of iterations needed by an interior-point algorithm following these
    trajectories. We show that the total scalar curvature of the projective trajectories
    is small in a typical case and present evidence that this may be true in the general
    case. A relation between the vector field underlying the projective algorithm
    and geodesics in this metric is proved.


    NARENDRA KARMARK


    # 1. Interior-point methods for linear programming


    This paper is motivated by the problem of determining the theoretical limit of
    the computational complexity of interior-point methods for linear programming.
    Interior-point methods can be viewed as making discrete approximations following
    a set of continuous trajectories to the optimal solution of the linear program.
    There are two basic ingredients that matter in choosing the continuous trajectories
    and choosing the method of making discrete approximation to the continuous trajectories.


    This paper concentrates on studying the continuous trajectories associated to
    the projective algorithm that I introduced in 1984 [6]. The worst-case bounds
    known for the number of iterations taken by the projective algorithm contrast
    with the few iterations observed empirically. In §1.2 we give a rule for selecting
    the step length that may have good worst-case properties. That-is, a step-length
    rule suggests that the running time of the algorithm should be proportional to
    the total scalar curvature of the underlying trajectories measured from the starting
    point to a point near the optimum.


    1990 Mathematics Subject Classification (1985 Revision). Primary 90C05; Secondary
    53B21.'
