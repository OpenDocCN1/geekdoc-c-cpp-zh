  md: '# C. WITZGALL, P. T. BOGGS, AND P. D. DOMICHL


    We are now prepared to define analytic g-centers for bounded systems of linear
    constraints, that is, systems with bounded solution sets. With each linear constraint
    system we associate the


    ```

    (1.6) logarithmic barrier function B(u) = \sum_{i\in S} \ln r_i(u),

    ```


    where S is the subset of indices i belonging to tonight inequalities. If all inequalities
    are tight, then we define B(u)= 0 for all feasible solutions. Gradient and hessian
    of B(u) are


    ```

    (1.7) \nabla^2_u B(u) = -A_S R_S^{-1}(u)e, \quad e^T = (1, 1, \dots, 1),\n\nabla^2_u
    B(u) = -A_S R_S^{-2}(u)A_S^T$,

    ```


    where A_S is the submatrix of A consisting of the columns that correspond to tonight
    constraints A_S^T u ≤ b_S, i\in S, and R_S(u) is the diagonal matrix of positive
    residuals of the same constraints and a square submatrix of the diagonal matrix
    of all residuals (1.3)


    ```

    R(u) = diag(r_1(u), r_2(u), \dots, r_n(u)).

    ```


    The expression given in (1.7) implies that the hessian of the barrier function
    is negative semidefinite with one of its null-directions parallel to the solution
    set. On the relative interior of polyhedron the logarithmic barrier function is
    strictly convex. Subtracting an arbitrary linear term g^T u, g \in R^n from the
    logarithmic barrier function B(u)-g^T u maintains strict concavity. The modified
    barrier function B(u)-g^T u thus has a unique maximizer u^s(g),


    ```

    (1.8) analytic g-center or, simply, g-center

    ```


    of the constraint system. In the case g=0 we arrive at the center point definition
    of Huard and Sonveind. In the full-dimensional case, the condition for the g-center
    is that \nabla_u B(u)=g. Otherwise, it takes the form


    ```

    (1.9) \nabla_u B(u) = -A_S R_S^{-1}(u)e = g+[A_T, E]w,

    ```


    where the submatrix A_T of A corresponds to the tight inequalities. If the system
    of constraints has been regularized (1.4), then the condition simplifies to


    ```

    (1.10) \nabla_u B(u) = -AR^{-1}(u)e = g+ew.

    ```


    We denote the analytic g-center of the face associated with a face F of the solution
    polyhedron by


    ```

    (1.11) u^h_F(g).

    ```


    The g-center associated with a vertex of the solution polyhedron is, of course,
    that vertex itself.'
