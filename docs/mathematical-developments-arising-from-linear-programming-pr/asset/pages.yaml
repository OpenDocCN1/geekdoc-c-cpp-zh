  md: '# On the Complexity of a Numerical Algorithm for Solving Generalized Convex
    Quadratic Programs by Following a Central Path


    F. JARRE, G. SONNEVEND, AND J. STOER


    ABSTRACT. This paper is divided into two parts. In the first part we give an outline
    of a complexity analysis concerning the global convergence of a zero-order extrapolation
    algorithm along a curve of analytic centers for solving generalized convex quadratic
    programs. It can be shown (see [Ja] and [SoSt]) that the analytic center of the
    feasible set provides a two-sided ellipsoidal approximation of this set, whose
    tightness—as well as the global rate of convergence of the algorithm—only depends
    on the number of constraints but not on the data of the constraints functions.
    So far, similar results were known only for programs with linear constraints.
    The second part presents some preliminary numerical experiments, which were obtained
    with a modified algorithm. The modification includes that higher-order extrapolation
    schemes are used to significantly accelerate this path-following method, so that
    the number of iterations seems to be a very slowly growing function of the number
    of variables.


    # Introduction


    In 1984 [Ka] published a new method for solving linear programs using interior
    points. Since then there have been several parts applying (modified) interior
    points to more general classes of problems. [KaVai] and [YeTs] allowed a convex
    quadratic objective function to be minimized over a bounded set by linear constraints
    and obtained a sufficiently accurate solution after O(NL) iterations. In [YeTo],
    the same problem was solved using ellipsoids, which contain all optimal primal
    and dual vectors and whose volumes shrink at a ratio of $2^{-O(\sqrt{n})}$. [KoMiNo]
    developed a continuation method for uniform P-functions, and recently [MeSu] developed
    a method that is based on ideas similar to the one presented here.


    ¹⁰ Mathematics Subject Classification... This work was supported by the Deutsche
    Forschungsgemeinschaft, Schwerpunktprogramm für anwendungsbezogene Optimierung
    und Steuerung.

    This paper is a summary of the presentation given at the AMS–ISM–SI joint summer
    research conference in Bowdoain, Maine, June 1998.'
