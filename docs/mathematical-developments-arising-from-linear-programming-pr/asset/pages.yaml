  md: "# AN($n^3L$) REDUCTION ALGORITHM FOR LP\n\nTHEOREM 3. Let $\rho = n + \\sqrt{n}$\
    \ and $\\phi(x^0, s^0) \\le O(\\sqrt{nL})$. Then, the modified primal algorithm\
    \ terminates in $O(\\sqrt{nL})$ iterations and uses $O(n^3L)$ total arithmetic\
    \ operations.\n\nOne can develop a modified dual algorithm with the same performance.\
    \ However, the modified algorithm may have only theoretical value, since a much\
    \ larger step has been usually taken in practice.\n\n**Concluding remark.** Finally,\
    \ we have developed an $O(\\sqrt{nL})$-iteration and $O(nL)$-operation reduction\
    \ algorithm, comparing to the $O(n^3L)$-operation Karmarkar-type projective algorithm.\
    \ Our algorithm is naturally equipped with the primal-dual potential function,\
    \ which is uniquely used to measure the solution's progress. It does not to trace\
    \ any particular path as the path-following algorithm does, or to use the projective\
    \ transformation as the projective algorithm does. There is no step-size reduction\
    \ during its iterative process: The greater the reduction of the potential function,\
    \ the faster the convergence of the algorithm.\n\nThe algorithm itself works like\
    \ a dynamic game, in which one player plays the leader and the other players follow.\
    \ In the primal form the leader, using only information about the current objective\
    \ value from the dual player, reduces his potential function by a constant at\
    \ each step until he is \"stuck.\" Once the leader is \"stuck,\" the follower\
    \ can then make a move to reduce their potential function by a constant. No matter\
    \ who moves, the primal-dual potential function is reduced. In this game, there\
    \ is no winner or loser; the players arrive at the optimal solution set (Cournot-Nash\
    \ equilibrium to their potential functions) together. One can also develop a symmetric,\
    \ cooperative strategy such that both players, the primal ($x$) and the dual ($s$),\
    \ move simultaneously at each step to reduce their joint primal-dual potential\
    \ function.\n\n# Acknowledgment\n\nThe author gracefully acknowledges Professors\
