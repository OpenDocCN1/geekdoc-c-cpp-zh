  md: '# SOLVING GENERALIZED CONVEX QUADRATIC PROGRAMS


    examination we restrict ourselves to the consideration of the set $P$ that has
    the same structure as the set $P(\lambda)$; i.e., we disregard $\lambda$ and the
    objective function $f_0(x)$. For $x \in P^0$ (i.e., $f_0(x) < 0$) we therefore
    consider the following functions:


    ```

    $\varphi(x) := -sum \ln(-f_i(x)), \quad g(x)^T := D\varphi(x), \quad \text{and}
    \ H(x) := D^2\varphi(x)$.

    ```


    Here, the first derivative $D\varphi(x)$ is represented by a row vector and the
    second derivative by a square matrix. Note that $H(x)$ is positive definite.

    Essential for all examinations is the use of a suitable norm:


    DEFINITION. For a point $y \in P$ the norm $\||\cdot||_{H(y)}\|$ is given by the
    Hessian matrix of $x$ in $y$, i.e., $(x^T H(y)x)^{1/2}$.

    The quality of Newton''s iteration depends on the closeness of a quadratic approximation
    to the log. Defining the quadratic approximation of $\varphi$ at the point $y$


    ```

    $q_y(x) := \frac{1}{2}(x-y)^T H(y)(x-y) + g(y)^T(x-y) + \varphi(y)$

    ```


    one can


    LEMA 1 (see [Ja], Lemma 2.10. Let a point $y \in P^0$ and a point $x$ with $\||x-y||_{H(y)}
    \le 0.1$ be given,,


    ```

    $|q_y(x) - \varphi(x)| < \||x-y||^3_{H(y)}$

    ```


    This lemma is for a global bound on the domain of convergence and the speed of
    convergence of Newton''s method and does not depend on the data of the functions
    $f_i$. The following corollary is a direct consequence of Lemma 1 and explains
    the behavior of the norms by $H(y)$.


    COROLARY (ellipsoidal approximation of $P$). For $y \in P^0$ define $E(y) := \{x|\||x||_{H(y)}
    \le 1\}$. The following holds:


    +   1) $y + 0.8E(y) \subset P^0$.


    Let $x$ be the center of $P$, then also


    +   2) $P \subset x + 20E(x)$.


    Part of one corollary implies that the norms $\||\cdot||_{H(y)}\|$ become singular
    as $y$ approaches the boundary of $P$. Simple examples show that the order $O(m)$
    of the ratio $20m/0.8$ is optimal. An application of the corollary is the possibility
    to identify inactive constraints long before reaching the optimal solution. Such
    an ellipsoidal approximation was first given by [SoSt] using duality considerations.
    For the "algebraic" proof given, it is essential that all the functions are quadratic,
    while the less elegant proof the one given in Lemma 1 has the advantage in that'
