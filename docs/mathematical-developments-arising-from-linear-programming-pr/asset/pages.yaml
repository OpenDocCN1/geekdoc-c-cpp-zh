    of $(HP)$. Hence, under our assumptions, 0 is an optimal solution of $(HP)$. The
    following results relating problems $(P)$ and $(HP)$ can be easily shown.


    PROPOSITION 2.1. $r^*>0$ if and only if 0 is the unique optimal solution of $(HP)$.


    PROPOSITION 2.2. Assume that $r^*=0$ and let $w\in W$ be given. Then $w$ is an
