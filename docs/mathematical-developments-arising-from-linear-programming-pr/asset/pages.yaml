  md: "# Probabilistic Analysis of the Simplex Method\n\nKARL HEINZ BORGWARDT\n\n\
    ABSTRACT. We are interested in the average number of pivot steps required for\
    \ solving LPs. It is a common experience shared by all operations research experts\
    \ that the Simplex Method is a very good tool for solving linear programming efficiency\
    \ in practice. On the other hand we know that all the usual variants of the method\
    \ have an exponential worst case behavior. To understand that discrepancy has\
    \ provided a great challenge for mathematicians for over three decades.\n\nThe\
    \ best way to close that gap and give a formal description of practical behavior\
    \ seemed to be a probabilistic analysis of the average behavior. For that purpose\
    \ one has to specify a stochastic model defining a (fictive) distribution of linear\
    \ programming problems occurring in practice. Then a chosen fixed variant of the\
    \ Simplex Method has to be analyzed under that model.\n\nThis paper is a survey\
    \ report on three major streams and successful approaches for such analysis. It\
    \ is interesting that all these approaches are based on parametric variants.\n\
    \n# 1. Introduction\n\nWhat I am telling here is a rather old story. Most of the\
    \ mathematical results mentioned here were derived during the years 1981–1984.\n\
    \nThroughout the talk we consider the following type of linear programming problems:\n\
    \n```\n$maximize v^T x$$\n$(1.1) \\text{ subject to } a_1^T x \\le b^1, \\dots,\
    \ a_m^T x \\le b^m$$\n$$\text{where } v, x, a_1, \\dots, a_m \\in R^n, b \\in\
    \ R^m \\text{ and } m \\ge n.$\n```\n\nThe matrix\n\n```\n$A = \\begin{pmatrix}\
    \ a_1^T \\ \\vdots \\ a_m^T \\end{pmatrix} \\in R^{m \times n}$\n```\n\n1980 Mathematics\
    \ Subject Classification (1985 Revision). Key words and phrases. Linear programming,\
    \ complexity of linear programming, probabilistic analysis of algorithms, stochastic\
    \ geometry."
