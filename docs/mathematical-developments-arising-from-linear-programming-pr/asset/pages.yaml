    For example, let $F$ be a face of $Q$ and consider $u = (u_1, \dots, u_n)$ such
    that


    ```

    $u_i = \begin{cases} 1 & i \in \text{supp}(F); \ 0 & \text{otherwise}. \end{cases}$

    ```


    Then


    ```

    $\phi(u) = \sum_{i \in \text{supp}(F)} \frac{1}{\text{card}(\text{supp}(F))} u_i$,

    ```


    which is the center of the vertices of $F$.


    As another, suppose $Q$ is a $d$-simplex. For $u \in R^+_0$, scale $u$ so that
    $\sum_{i=1}^n u_i^2 = 1$. Then $\phi(u) = \sum_{i=1}^n \lambda_i v_i = \sum_{i=1}^n
    \lambda_i v_i$ where $u_i = \sqrt{\lambda_i}$. Here there is one-to-one correspondence
    between the elements of $R^+_0$ and the points of $Q$.


    Fine [13] proved that for any $Q$, $\phi|_{R^+_0}$ is a bijection between $R^+_0$
    and $Q$. See also [41]. Another way to show this is to describe $\phi^{-1}_R$
    explicitly [26]. For any point $x \in Q$, consider all $\lambda = (\lambda_1,
    \dots, \lambda_n)$ such that


    ```

    $\sum_{i=1}^n \lambda_i x_i = x, \quad \sum_{i=1}^n \lambda_i = 1, \quad 0 \le
    \lambda_i \le 1$.

    ```


    Call this $L$. There is a unique $\lambda^*$ that minimizes $\sum_{i=1}^n \lambda_i
    \log \lambda_i$ over $L$. It turns out that for $x \in Q$ $(\sqrt{\lambda_1^*},
    \dots, \sqrt{\lambda_n^*}) \in R^+_0$ equals $\phi^{-1}_R(x)$.


    The inverse of the moment map allows a way of expressing any point $x \in Q$ as
    a convex combination of the vertices that is a natural generalization of barycentric
    coordinates for a simplex. The function $-\sum_{i=1}^n \lambda_i \log \lambda_i$
    is the familiar entropy function and suggests the following interpretation of
    the canonical convex: Suppose two individuals $A$ and $B$ are playing a game on
    a polytope $Q$. A referee chooses a point $x$ in $Q$, which is known to both $A$
    and $B$, and $A$ chooses a way of expressing $x$ as a convex combination $\sum_{i=1}^n
    \lambda_i v_i$, of the vertices of $Q$. Interpreting the $\lambda_i$ as probabilities
    assigned to the vertices, $A$ then produces this probability distribution. $B$
    now attempts to guess the vertex $A$ has chosen by asking questions of the form
    "Is the vertex in the set $S$?" where $S$ is a subset of the vertices. The object
    of $B$ is to guess the vertex using as few questions as possible, the object of
    $A$ is to choose the $\lambda_i$ that keep $B$ guessing as long as possible, even
    if $B$ should happen to discover which $\lambda_i$, his opponent has chosen. The
    inverse of the moment map provides the best choice of $\lambda_i^*$.


