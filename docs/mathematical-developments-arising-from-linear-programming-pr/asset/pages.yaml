  md: '4 CARL L. LEE


    $0 < b \in \mathbb{R}^m$. Further, assume that $P$ is bounded (hence a polytope)
    and simple (i.e., nondegenerate). Select any linear function $z=c^Tx$ that is
    nonconstant on every edge of $P$. Introduce $m$ slack variables, one for each
    constraint. At every vertex (basic feasible solution) $v$ of $P$ we record the
    (necessarily nonzero) reduced $\tilde{c}_i, \dots, \tilde{c}_d$ of the basic variables,
    the current value $\mathcal{Z}$ of $z$, and the determinant $|B|$ of the current
    basis matrix. If we have arrived at $v$ from a sequence of simplex pivots, $|B|$
    is the product of the pivot elements. Lawrence [20] proves that the volume of
    $P$ equals


    (1)

    \sum_{v} \frac{Z^d}{|B|\tilde{c}_1 \dots \tilde{c}_d}$


    where the sum is taken over all vertices of $P$. The formula can be modified to
    handle polytopes that are not simple.


    Thus we can theoretically compute the volume of $P$ without triangulating it first,
    although as Lawrence points out there may be some difficulties in practice because
    the sum involves terms of differing sign that can be quite large compared to the
    volume of $P$.


    As a trivial example, we calculate the volume of the unit 3-cube $\{x \in \mathbb{R}^3:
    0 \le x_i \le 1, i=1, 2, 3\}$ using the function $z=x_1+2x_2+4x_3$. With slack
    variables the description becomes


    $x_1 + x_4 = 1,

    $x_2 + x_5 = 1,

    $x_3 + x_6 = 1,

    $x_1, \dots, x_6 \ge 0$.


    The desired numbers are then as follows:


    | $v$ | reduced costs | $\mathcal{Z}$ |

    |---|---|---|

    | (0, 0, 0) | $(\tilde{c}_4, \tilde{c}_5, \tilde{c}_6) = (-1, -2, -4)$ | 0 |

    | (1, 0, 0) | $(\tilde{c}_1, \tilde{c}_5, \tilde{c}_6) = (+1, -2, -4)$ | 1 |

    | (0, 1, 0) | $(\tilde{c}_4, \tilde{c}_2, \tilde{c}_6) = (-1, +2, -4)$ | 2 |

    | (1, 1, 0) | $(\tilde{c}_1, \tilde{c}_2, \tilde{c}_6) = (+1, +2, -4)$ | 3 |

    | (0, 0, 1) | $(\tilde{c}_4, \tilde{c}_5, \tilde{c}_3) = (-1, -2, +4)$ | 4 |

    | (1, 0, 1) | $(\tilde{c}_1, \tilde{c}_5, \tilde{c}_3) = (+1, -2, +4)$ | 5 |

    | (0, 1, 1) | $(\tilde{c}_4, \tilde{c}_2, \tilde{c}_3) = (-1, +2, +4)$ | 6 |

    | (1, 1, 1) | $(\tilde{c}_1, \tilde{c}_2, \tilde{c}_3) = (+1, +2, +4)$ | 7 |


    In every case $|B|=1$, the volume equals


    $\frac{0^3}{6(-1)(-2)(-4)} + \frac{6(1)^3}{6(-1)(-2)(-4)} + \frac{2^3}{6(-1)(2)(-4)}
    + \frac{3^3}{6(1)(2)(-4)} + \frac{4^3}{6(-1)(-2)(4)} + \frac{5^3}{6(-1)(2)(4)}
    + \frac{7^3}{6(1)(2)(4)} = 1.$'
