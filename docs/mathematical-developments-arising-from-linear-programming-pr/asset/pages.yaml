  md: 'Given a basis $B$, the corresponding basic primal solution $x = x(B)$ is given
    by


    $x_B = B^{-1}b, \quad x_N = 0.$


    The dual dual vector $y = y(B)$ associated with $B$ is given by the equation


    $y^T B = c_B^T.$


    $\begin{aligned} &\text{Minimize } y^T b \ &\text{subject to } y^T A \ge c^T.
    \end{aligned}$


    Thus, $y(B)$ is feasible in the dual problem if and only if


    $c_N^T \le c_B^T B^{-1},


    in which case $y$ is optimal for the dual.


    Assuming that the algorithm (namely, the primal simplex method) works with exact
    arithmetic, for every $B$ occurring in the process,


    $B^{-1}b \ge 0.$


    The algorithm terminates in one of the following cases:


    +   (i) $c_N^T \le c_B^T B^{-1}$, in which case $B$ is optimal, or


    +   (ii) there exists a column $N_j$, such that $c_j > c_B^T B^{-1}N_j$ and $B^{-1}N_j
    \le 0$, in which case the problem is unbounded.


    In either case the basis $B$ is said to be terminal. The termination criterion
    applies to signs of certain entries in the tableau.


