    PROOF. As mentioned above, all that remains to be shown that the linear equations
    (7.14) have a unique solution. The first condition is solvable, if for any vector
    $v$, $v^T(A_F^T X_F^T + cc^T)=0$ implies $v^T c=0$. But this is plain since $v^T(A_F^T
    X_F^T + cc^T)=0$


    ```

    $v^T A_F^T X_F^T + cc^T = \|v^T A_F\|^2 + \|v^T c\|^2=0.$

    ```


    This also shows that, for any solution $v$ of the homogeneous system associated
    with the first condition in (7.14), $v^T A_F X_F=0$, and by the positivity of
    the diagonal elements of $X_F, v^T A_F=0$. Since the columns of matrix B form
    a basis of all vectors orthogonal to $A_F$, there exists a vector $z$ such that
    $v=Bz$. Every solution of the first condition is such that $w=w^{(0)}-Bz$, with
    $w^{(0)}$ an arbitrary fixed solution. Substitution into the second condition
    yields


    ```

    $B^T A_G R_G^{-2} A_G B z = B^T A_G R_G^{-2} A_G^T w^{(0)}.$

    ```


    These equations for $z$ are readily shown to be solvable by an analogous to the
    one used for the first condition. (They are also the normal equations for a linear
    regression problem, and are therefore known to be solvable, as are the equations
    of the first condition when the relation $c=-A_F X_F e_F$ is taken into account.)
    We have thus established the existence of a solution of (7.14). To show uniqueness,
    we establish zero as the only solution of the homogeneous system


    ```

    $(A_F^T X_F^T + cc^T)v=0,$\nB^T A_G R_G^{-2} A_G^T v=0.$

    ```


    We have already seen that the first condition in the above homogeneous system
    implies both $c^T v=0$ and $A_F^T v=0$, as well as the existence of a vector $z$
    with $v=Bz$. Multiplying the second condition by $z^T$ yields $v^T A_G R_G^{-2}
    A_G v=0$, and subsequently, $A_G^T v=0$.'
