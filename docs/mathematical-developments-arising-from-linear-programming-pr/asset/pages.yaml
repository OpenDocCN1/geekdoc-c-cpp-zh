    How does this relate to the QR algorithm for diagonalizing tridiagonal or symmetric
    matrices? A nice account of this may be found in Symes [28]. (Also see [16], [18],
    and [24].)


    First we recall that for any real matrix A, A invertible, there exists a unique
    decomposition A = QR where Q is orthogonal and L is lower triangular with nonnegative
    diagonal entries.


    Let A be our Toda matrix defined and let Q(t)L(t) = exp(itA(0)). (Then we can
    see [28])


    ```

    A(t) = Q(t)^T A(0)Q(t).

    ```


    The QR algorithm works as follows. Let Y = Y^{(0)} be an invertible n n matrix.
    Then Y^{(0)} = Q^{(0)}L^{(0)} as defined and let Y^{(1)} = L^{(0)}Q^{(0)} Then
    Y^{(1)} = Q^{(0)T}Y^{(0)} and thus has the spectrum Y^{(0)}. Similarly, define
    Y^{(k+1)} from Y^{(k)} by setting Y^{(k)} = Q^{(k)}L^{(k)} and Y^{(k+1)} = L^{(k)}.
    Then one can see


    THEOREM. If Y is positive-definite symmetric with simple spectrum {μ₁ > μ₂, ...,
    μₙ > 0}, the QR sequence above tends, as k → ∞, Y^{(∞)} = diag(μ₁, ..., μₙ).


    Let A(t) be our Jacobi matrix under the Toda flow. Using (3.6) we can see that
    if exp A(k) = Q^{(k)}L^{(k)}, k = 1, ..., exp A(k+1) = L^{(k)}Q^{(k)}- i.e., the
    QR algorithm is the time-map of the Toda lattice! In fact, this works for any
    symmetric matrix A.


    # 4. The total least squares problem, Toda flows, and linear programming


    The total least squares (TLS) problem is the problem of fitting d-planes to a
    set of p points in real or complex n space. The idea is to minimize the total
    perpendicular distance of the p points onto the d-plane. From the point of view
    of error analysis, this corresponds to the maximum likelihood estimate (MLE) when
    all the components of the points are measured to identically distributed normal
    errors. (This in contrast to ordinary least squares where all components except
    one are to be known.)


    We can write an orthonormal basis for F^n (Rⁿ or Cⁿ) and let xᵢ = ∑ⱼ λ_ije��ⱼ,
    i = 1, ..., p, be p points. Each λ_ij is measured with additive observation error
    εᵢ, εᵢ ~ N(0, 1) independent. Let P = I - Q where Q is the orthogonal projection
    onto a d-plane.


    Then we can show (e.g., [7] or [15])


    LEMMA. The total perpendicular distance of the p points onto the d-plane is H(P)
    = TrCP = Tr(I-Q), where C = Λ*Λ and Λ is the data matrix (λij).'
