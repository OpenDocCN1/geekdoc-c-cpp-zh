  md: '# EFFICIENT FACES OF POLYTOPES


    Note that if $Q^\vee$ is constant, then the ideas of affine-scaling vector fields
    (Bayer and Lagarias (1989)) can be generalized by considering affine “cone fields”
    and affine scaling trajectories as solutions of differential inclusions. Specifically,
    consider the following MOLP problem.


    ```

    $\Lambda - Cx$\nsubject to $Ax = b, \quad x \geq 0,$

    ```


    where $AA^T$ is invertible and $C$ is a $p \times n$ matrix. Define the following
    “cone field”


    ```

    $V_A(x, C) = X\pi_{(Ax)^ell}(XC),$

    ```


    where $C$ is the cone of increasing directions


    ```

    $C = \{y \in R^p \mid Cy \geq 0\},\n$\pi_{(Ax)^ell}$ is the orthogonal projection
    operator onto $A^l$, and

    $X = \text{diag}(x_1, \dots, x_n).$

    ```


    Then the affine scaling trajectory $T_A(x; C, A, b)$ in the vector optimization
    setting can be defined as the solution of the differential inclusion


    ```

    $\frac{d}{dt}x(t) \in V_A(x(t), C),\nx(0) = x_0,$

    ```


    where $x_0$ is an interior point of the feasible polytope.


