    # 3. Convergence of analytic g-centers


    A sequence of linear constraint systems,


    ```

    $(3.1) \quad A^T u \le b^{(k)}, \quad E^Tu = f^{(k)}, \quad k=1, 2, \dots,$

    ```


    is


    ```

    (3.2) \quad convergent

    ```


    if the sequences $\{b^{(k)}\}_{k=1,2,\dots}$ and $\{f^{(k)}\}_{k=1,2,\dots}$ of
    right-hand sides converge to limits $b^{(0)}$ and $f^{(0)}$, respectively. If
    the individual systems in sequence (3.1) are bounded, that is, their solution
    polyhedra $P^k$ are bounded, that every sequence $\{u^{(k)}\}_{k=1,2,\dots}$ of
    solutions $u^{(k)} \in P^k$ has an accumulation point. Any such accumulation point
    will solve the limit system,


    ```

    (3.3) \quad A^T u \le b^{(0)}, \quad E^Tu = f^{(0)},

    ```


    which is readily seen to have itself a bounded solution polyhedron $P^{(0)}$.


    We call a convergent sequence (3.2) of linear constraint systems


    ```

    (3.4) \quad regularly convergent

    ```'
