  md: '# PROJECTIVE SCALING TRAJECTORIES FOR LINEAR PROGRAMMING


    the following sense: Let (HP) denote the homogeneous linear program that arises
    from (P) by removing the constraint $e^T w = 1$. As shown in Bayer and Lagarias
    [4], every projective scaling trajectory for (P) can be obtained from an affine
    scaling trajectory for (HP) by projecting radially into the simplex $(x \in \mathbb{R}^n
    | e^T x = 1, x \geq 0)$. Using this, we will be able to translate the behavior
    of the affine scaling trajectories for (HP) to the projective scaling trajectories
    for problem (P). We do so under two cases: when the optimal value of (P) is zero
    and when it is positive. In the first and most interesting case, it turns out
    that the set of optimal solutions to problem (HP) is unbounded. Since [1] analyzed
    the behavior of the affine scaling trajectories for a linear program that has
    bounded optimal face, it is necessary to extend the results of [1] in order to
    handle this general case.


    This paper is organized as follows. In Section 2, we briefly recall the definition
    of the projective scaling vector field and its associated trajectories for problem
    (P). We discuss the relationship between these trajectories and the affine scaling
    trajectories for problem (HP) by recalling the result of Bayer and Lagarias. In
    Section 3, we show how to extend the analysis of [1] for the affine scaling trajectories
    with linear programs that have unbounded optimal face. In Section 4, we analyze
    the limiting behavior of the projective scaling trajectories for the case in which
    the optimal value of (P) is 0. We show that the projective scaling trajectories
    converge to optimal solutions that depend on the starting points. We also analyze
    the limiting behavior of the dual estimate that arises in the context of the projective
    scaling method as described in [18]. Finally, we characterize the asymptotic direction
    of the projective scaling trajectories near their limit. In Section 5, we consider
    the case when the optimal value of (P) is positive and show that every projective
    scaling trajectory converges to the unique point that minimizes the so-called
    Karmarkar potential function associated with problem (P).


