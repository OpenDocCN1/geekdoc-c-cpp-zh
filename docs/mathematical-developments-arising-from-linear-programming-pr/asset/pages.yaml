    \ in practice, we are led to consider the following question: Given a system of\
    \ continuous trajectories how best should we make a discrete approximation?\n\n\
    Intuitively, it seems that we can take \"long\" steps when the path is relatively\
    \ straight, but we want to take short steps when the path is bending more. This\
    \ leads us to consider the following simple step-length rule (see Figure 2).\n\
    \nStep-length rule: As long the angle between the straight-line segment we are\
    \ following and the direction given by the vector field does not exceed a fixed\
    \ limit $\theta_{\\max}$, continue on the current segment.\n\nMore generally,\
    \ one can consider such a step-length rule in which the angle measured with respect\
    \ to a general Riemannian metric. $\theta_{\\max} \to 0$ the step length is the\
    \ distance moved on the current trajectory until its tangent cost at a point,\
    \ and the integral of the scalar curvature $\\int |d\theta/ds|ds$ is the infinitesimal\
    \ step cost at a point, and the integral of the curvature is a surrogate measure\
