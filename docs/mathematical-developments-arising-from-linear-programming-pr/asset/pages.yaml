  md: '# An Interior-Point Approach to NP-complete Problems—Part I


    NARENDRA KARMARKAR


    ABSTRACT. In this paper, we extend the interior-point approach used in Karmarkar''s
    linear programming algorithm to solve NP-complete problems formulated as quadratic
    optimization problems over polytopes. We associate a potential function with the
    quadratic objective function and create a sequence of interior points to minimize
    the potential function. At each point in the sequence we optimize a local quadratic
    approximation to the potential function, over a search region that is similar
    to the search region used in linear programming.


    We then define a class of functions more general than convex functions having
    pathwise connected level sets and prove that functions in this class (i.e., do
    not have any spurious local minima; local minima that are not global minima).
    We prove that a particular family of potential functions used in our approach
    belongs to this class of functions.


    # # 1. Introduction


    To represent NP-complete problems, we study the following integer programming
    problem:


    IP PROBLEM. Find a feasible solution $x \in \mathbb{R}^n$ such that


    $Ax \le b \quad x_i \in \{-1, 1\}\quad \forall i = 1, \dots, n$


    where


    $A$: is an $m \times n$ real matrix and $b \in \mathbb{R}^m$.


    The more common form of integer programming, which requires each variable $x_i$
    to take 0–1 values, can be easily converted to the above form by the substitution
    $x_i = (1 + x''_i)/2$, so that $x''_i$ take $\pm1$ values.


    Consider the following linear programming relaxation of the integer programming
    problem by allowing each $x_i$ to take the values in the closed interval $[-1,
    1]$.'
