  md: '$S^k$ is the lack of enforcement of nonnegativity constraints on $s$ in EOP.
    Of course, explicitly adding the constraints $s \geq 0$ to EOP would result in
    a problem as difficult as the original linear program LP. However, a Lagrangian
    construction that enforces $s \geq 0$, while relaxing all other constraints, provides
    a computationally feasible strengthening of EOP. Specifically, consider the Lagrangian
    optimization problem


    ```

    LOP \quad \max L(\mu, \nu),\n A\nu = 0,\n \mu \geq 0,

    ```


    where $L(\mu, \nu)$ is the Lagrangian dual


    ```

    (4.1) \quad \min_{s\geq 0} L(\mu, \nu) = \min s_i + \frac{\mu}{2}((s-s^k)^T D^2(s-s^k)-e_k^T)
    + \nu^T(c^k-s).

    ```


    Note that for fixed $\mu$ and $\nu$, the objective in the problem defining $L(\mu,
    \nu)$ is a separable, convex quadratic. Thus, evaluating $L(\mu, \nu)$ can be
    accomplished in $O(n)$ arithmetic operations for any fixed $\mu$ and $\nu$. In
    fact, a straightforward analysis obtains


    ```

    $L(\mu, \nu) = \nu^T c^k + \frac{\mu}{2}(y_k^2-2e_kc^k) - \frac{\mu}{2}\sum_{j=1}^n(x_j^2)[s_j^k-\frac{q_j}{\mu}]^2$,

    ```


    where $a^+ = a$ if $a \geq 0$, and 0. Otherwise, standard Lagrangian duality results
    (Bazaaree and Shetty [1979]) imply that for any $\mu \geq 0$ and $\nu$ with $A\nu
    = 0$, $L(\mu, \nu)$ is a valid lower bound on the problem obtained by adding the
    constraints $s \geq 0$ to EOP. Finally, the original solution value $s''_i$ in
    EOP corresponds to evaluating $L(\mu'', \nu'')$ ignoring the constraints $s \geq
    0$ in (4.1). Thus, enforcing the nonnegativity constraints in (4.1) will always
    produce $L(\mu'', \nu'') \geq s''_i$. If fact $L(\mu'', \nu'') > 0$, then $s''
    > 0$ yields dual optimal solutions, and the variable $x_i$ can be eliminated from
    FLP. If on the other hand $L(\mu'', \nu'') \leq 0$, the lower bound on $s$, could
    be further strengthened by performing "dual ascent" in the LOP. It is unlikely
    that modifying $\nu''$ would be worth the computational effort of satisfying the
    constraint $A\nu = 0$, but ascent the scalar $\mu$ could certainly be worthwhile.
    In fact, whenever standard Lagrangian duality results imply that $L(\mu'', \nu'')
    > s''_i$, $\mu$ could be decreased from $\mu''$ to maximize $L(\mu, \nu'')$ in
    LOP.


    # REFERENCES


    K. M. Anstreicher [1986]. A monotonic projective algorithm for fractional linear
    programming. Algorithica 1, 483–498.


    M. S. Bazaaree and C. Shetty [1979]. Nonlinear programming–Theory and algorithms,
    John Wiley and Sons, New York, NY.


    D. M. Gay [1987]. A variant of Karmarkar’s linear programming algorithm for problems
    in standard form, Math. Programming 37 (1), 81–90.'
