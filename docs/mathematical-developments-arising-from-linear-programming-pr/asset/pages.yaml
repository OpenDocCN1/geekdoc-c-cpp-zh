    Observe that


    ```

    $c^T x^k - c^T x^{k+1} = (c - A^T \lambda_k^T)(x^k - x^{k+1}) = \|D_k(c - A^T
    \lambda_k)\|^{1/2}$\n(3) \quad \sqrt{\sum_{j=1}^n (x_j^k)^2 (c_j - a_j^T \lambda_k)^2}$

    ```


    where $a_j$ denotes the $j$th column of $A$.


    In practice there is generally no obvious way to select a feasible starting point
    $x^0$. The big-M method proposes the following way around this difficulty.


    Choose $x^0 > 0$ arbitrarily and solve the following modification of (1) for a
    very large value of $M$.


    ```

    $minimize \quad c^T x + M x_{n+1} \times x_{n+1}$\n(4) \quad \text{subject to
    } Ax + (b - Ax^0)x_{n+1} = b, \quad x \ge 0, x_{n+1} \ge 0.$

    ```


    The point $x = x^0, x_{n+1} = 1$ is a suitable starting point for applying the
    affine scaling algorithm to this problem.


    For $M$ very large, and $x_{n+1}$ close to 1, the objective in (4) is dominated
    by the $x_{n+1}$ term. In this case it is easy to see that the first steps of
    the affine scaling algorithm applied to this


    ```

    $minimize \quad x_{n+1}$\n(5) \quad \text{subject to } Ax + (b - Ax^0)x_{n+1}
    = b, \quad x \ge 0, x_{n+1} \ge 0,$

    ```


    starting at $x = x^0, x_{n+1} = 1$, behaves much like the first steps of the affine
    scaling algorithm applied to (4), from the same starting point. Therefore, in
    order to analyze the behavior of the affine scaling algorithm for (4), it suffices
    to analyze it holds for values of $x_{n+1}$ close to 1. However, for some choices
    of $x^0$ we see that $x_{n+1}$ remains close to 1 for many iterations of the affine
    scaling algorithm. This says that the affine scaling algorithm can spend a lot
    of time if $x^0$ is not chosen properly. In Section 2 we describe a way of choosing
    $x^0$ to accelerate convergence in Phase I. We note that the rate of convergence
    depends on the size of $\|Ax^0 - b\|$, and this quantity must be decreased in
    order to accelerate convergence.


