  md: 'The main goal of the paper is to study the geometric behavior of these continuous
    trajectories using techniques of differential geometry. Rather than study them
    using the Euclidean metric, we study them using a projectively invariant Riemannian
    metric that reflects the projective invariance properties of the algorithm. This
    paper shows that the scalar curvature of the trajectories in this metric is small.
    This information may shed some light on the remarkably few iterations that the
    projective algorithm takes in.


    In this section, we briefly review the projective and affine forms of interior-point
    methods for linear programming. We give a description of the algorithm as a discrete
    iterative process, then define the associated vector fields and continuous trajectories
    and differential equations governing the trajectories. We then propose a rule
    for choosing the length of the steps taken in a discrete algorithm that approximately
    follows trajectories. This motivates studying the scalar curvature of trajectories
    as an approximation to the number of iterations needed by discrete algorithms.


    In the rest of the paper, §2 describes a good Riemannian metric to study projective
    trajectories, §3 describes geodesics of this metric and relation to the projective
    vector field, and §4 and §5 estimate the scalar curvature of the projective trajectories
    in this metric. We remain a number of open problems that must be solved to obtain
    bounds for the number of iterations taken by discrete interior-point algorithms,
    and some of these are stated in §4.2 and 5.


    # 1.1. Canonical problem form and projective algorithm. The projective algorithm
    is conveniently defined for linear programs given in a particular canonical form.


    CANONICAL PROBLEM FORM (PROJECTIVE CASE).


    ```

    Minimize c^T x

    Subject to Ax = 0,

    e^T x = 1,

    x^T \ge 0

    ```


    Here $x, c, e \in R^n$, $e$ is the vector of all 1''s, and $A$ is an $m \times
    n$ real matrix. The center of the simplex $x^T = 1/n$ is assumed to be feasible;
    i.e., $Ae = 0$. Furthermore, the optimal objective value is assumed to be zero.


    (In the affine case, the constraint $e^T x = 1$ is not needed, and linear equations
    are allowed to be nonhomogeneous: $Ax = b$ and the objective function can have
    any optimal value). The constraints $\{e^T x = 1, x^T \ge 0\}$ define a simplex
    $S_n$, and $\Omega = \{x | Ax = 0\}$ defines a subspace.


    We are interested in their intersection $P = \Omega \cap S_n$, which defines the
    feasible region for the linear programming problem. Figure 1 illustrates the region
    $P$ in the unconstrained case where $P = S_n$, and the general case where $\Omega$
    is nontrivial.'
