  md: 'Concerning this estimation and related techniques of step size regulation,
    see [So3].


    Finally we mention a variant that has already been considered by [KoMiNo] and
    [MoAD]: If the optimal solution is nondense following the trajectory $(x(\lambda),
    \lambda(\lambda)) \in R^{n+m}$, where


    ```

    $$\nabla f_0(x) + \sum_{i=1}^m \mu_i \nabla f_i(x) = 0, \quad \mu_i f_i(x) = f_0(x)
    - \lambda, \quad i = 1, \dots, m$

    ```


    may yield a much faster method, mainly by this formulation, the singularity of
    the matrix $H(\lambda)$ at $\lambda = \lambda^2$ is eliminated, so that in the
    end phase we have quadratic convergence.


    # 4. Preliminary experiments


    To gain insight into the particular behavior of the method using some extrapolation,
    we have implemented the method in Fortran 77. Small-size problems (with up to
    300 unknowns and dense matrices) have been tested, and further experiments with
    larger problems are in preparation. Our implementation is intended to illustrate
    the dependence of the number of iterations on the dimension of the method and
    to test different types and orders of extrapolation. For a detailed description
    of extrapolation schemes and for further experiments we refer to [JaSoSt].


    When interpreting the numbers of the following tables one should note that the
    recomputation and Cholesky factorization of Hessian matrices $O(mn^2)$ operations
    is most expensive. An evaluation of $g(x, \lambda)$ (all gradients) and any feasibility
    check for a vector $x$ needs $O(mn)$ operations, which is in general more than
    the number of $O(n^2)$ operations to solve one Newton system using the Cholesky
    factors of the Hessian matrices is known. The computation of an interpolating
    polynomial of degree $j$ in $R^n$ requires only $O(jn)$ operations and is thus
    relatively cheap.


    EXAMPLE 1. The first set of tests consists of random problems of the form


    ```

    $$\min_{x \in P} \sum_{j=1}^n x_j$\nP = \{x \geq 0 : Ax \leq 10^4}$

    ```


    where $A$ is an $n \times n$ matrix whose entries are random numbers uniformly
    distributed between 1 and 1000 [Irim]. The connection between problem size and
    running time is examined. For each dimension $n$ the method was tested 5 times
    with different random numbers. Table 1 shows the average number of iterations
    (#it), Hessian matrix computations (#Hess. $O(m \cdot n^2)$ operations), and evaluations
    of the gradient (#grad) used for the test of the extrapolated vector and the Newton
    steps ($O(m \cdot n)$ operations). These calculations dominate computations of
    the algorithm. The numbers are totals for Phase 1'
