  md: '# # Dual Ellipsoids and Degeneracy in the Projective Algorithm for Linear Programming


    KURT M. ANSTREICHER


    **ABSTRACT.** We consider the construction of dual ellipsoids in the standard-formive
    projective algorithm for linear programming. As originally suggested by Todd and
    further developed by Ye, these ellipsoids potentially allow for the removal of
    primal variables by proving that they be zero in all optimal solutions. When the
    linear program is nondegenerate, Ye has shown that the solution basis can potentially
    be identified exactly in this manner. However, Ye''s approach does not generalize
    in the presence of primal degeneracy. We show here, under a mild assumption, that
    in all cases the dual ellipsoids converge to lie in the affine hull of the dual
    optimal solutions. This observation suggests a Lagrangian strengthening of the
    dual ellipsoid construction, which could significantly improve performance in
    the degenerate case.


    # ## 1. Introduction


    An important issue in the use of interior algorithms for linear programming is
    the problem of ultimately obtaining an exact, optimal, basic solution. Although
    interior algorithms appear to have the capability to obtain near-optimal solutions
    in a small number of iterations, the additional “clean-up” required to obtain
    a provably optimal solution could easily ruin any advantage over the simplex method.
    Not surprisingly, researchers have suggested (at least in talks) heuristic schemes
    for eliminating variables “on the fly” when solving linear programs using interior
    algorithms. Moreover, at least one theoretically rigorous approach has been devised.
    It was first shown in Todd [1988a] that ellipsoids that contain all dual optimal
    solutions can be easily generated in the standard-form variant of the projective
    algorithm. Ye [1987] recast these ellipsoids in the space of dual slacks and developed
    a simple, closed-form test that can prove a primal variable must be zero in all
    optimal solutions. He also showed that when the linear'
