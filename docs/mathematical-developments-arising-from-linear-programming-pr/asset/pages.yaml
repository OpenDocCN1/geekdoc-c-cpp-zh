- img_proc: true
  md: 'hypercube. Karmarkar isolates a subclass of such problems for which the set
    of optimal solutions is connected. He suggests that this approach will solve a
    large class of 0–1 integer programs previously considered tractable, including
    many covering problems. J. Mitchell and M. Todd study matching problems, which
    are a class of integer programs to solve solvable in polynomial time. They describe
    a cutting plane method for such problems that uses interior-point methods to solve
    linear programming relaxations of the problem and present computational data.
    Finally, the paper of S. Abhyankar, T. Morin, and T. Trafalgar outlines two methods
    for solving multi-objective linear programs, including an interior-point method
    to find a single efficient solution, and a method of circumscribed algebraic sets
    to find the entire set of efficient solutions.


    We would like to take this opportunity to thank the anonymous referees. We also
