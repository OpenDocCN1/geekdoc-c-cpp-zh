    Note that $\xi(x)$ is a feasible direction for problem $(P)$; that is, $\xi(x)\in{h\in\mathbf{R}^n|Ah=0,e^Th=0\}$.
    The projective scaling algorithm determines the next iterate $\hat{x}$ by $\hat{x}=x-\alpha(x)\xi(x)$
    where $\alpha(x)>0$ is an appropriate step size that guarantees $\hat{x}>0$, as
    well as a sufficient decrease in potential function associated with problem $(P)$
    [11]. The transformation $\xi(x)$ defines a vector field in $W_t$. In the following,
    we will be interested in studying the limiting behavior of the trajectories generated
    by $\xi(x)$, that is, the set of points traced by the solution curves of the following
    differential equation:


    ```

    \dot{w}(t)=\xi(w(t)).

    ```


