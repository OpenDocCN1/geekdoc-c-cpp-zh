  md: 'LP and nonlinear programming (NLP) problems one seeks the set of efficient
    faces, also called Pareto-optimal faces or nondominated faces (Benson and Morin
    (1977) and Yu (1974, 1985)) of a convex polytope. Since there can be an exponential
    number of efficient faces, this too is a natural setting to use interior point
    algorithms and algorithmic algebraic geometry (Abhyankar (1986)).


    We apply interior methods to both linear and nonlinear objective programming where
    the decision space is a convex polyhedron defined by linear inequalities. First,
    we develop an interior point algorithm that is a generalization of Renegar''s
    algorithm (Renegar (1986)) to the multiple objective setting. The algorithm finds
    a point on the efficient frontier of a polytope, and hence an efficient (maximal)
    face, in polynomial time. The approach is geometrical and a method of centers
    applied in multiple objective optimization problems. Second, we develop an algorithm
    that approximates the set of maximal faces (the efficient frontier or Pareto optimal)
    of a polytope, with respect to an ordering given by a closed polyhedral cone,
    by constructing an increasing series of inscribed algebraic varieties. To do this
    we construct parameterizations of ellipsoids in n-space and investigate the existence
    and construction of parameterizations of quadrics without singularities (Abhyankar
    (1986)).


    This paper is organized as follows. §1 discusses multiple objective optimization
    problems; §2 reviews the literature in MOLP. §2.1 the MOLP problem is defined
    and notation developed. The analytical center of a polytope is discussed in §2.2,
    and an algorithm of centers for finding an efficient (maximal) face is developed
    in §2.3. A proof of convergence of the algorithm is presented in §2.4. The problem
    of finding the entire set of efficient faces of a polytope in n-dimensions and
    rational parameterizations of a general quadric hypersurface is presented in §3.2.
    In §3.3 a method of approximating the maximal facets of a polytope by algebraic
    surfaces is developed and illustrated by an example in §3.4. The parameterization
    of the set of efficient faces (the efficient frontier) is discussed in §3.5. An
    example illustrating the connection of the algorithm of centers with dynamical
    systems is presented in §3.6. Applications in vector optimization are considered
    in §3.7.


    # 1.1. Multiobjective optimization problem. Let X be the set of decisions, Y be
    the set of objectives, and assume that a function f: X → Y is given. The image
    set f(X) = Q is called the set of attainable objectives.


    We assume that Y is partially ordered by <. The partial order < induces a partial
    order <_f on X as follows:


    ```

    x < x'' iff f(x) < f(x'').

    ```'
