  md: 'The above Lemma $\eta_n$ tends to 0. Thus $\gamma_n$ also tends to 0, and by
    (2.2) we see that the convergence of $\eta_n$ is superlinear.


    The quantity $q(x_0)$ of Lemma 2.1 depends on all the Newton iterates of $x_0$
    and hence is difficult to bound. For our Kantorovich-type theorem we use a weaker
    quantity $K$, which codifies a growth bound in the Newton direction for all points
    in a region $U$ closed under Newton iteration. Our main result is as follows:


    # Theorem 2.2. Let $F$ be a map between Banach spaces $X$ and $Y$. Assume that
    $F$ is Fréchet differentiable on $X$, and that $DF$ is invertible. Suppose there
    is an open set $U \subseteq X$ such that


    +   (1) $x \in U$ then the Newton step $x=s(x)$.\n(2) The quantity


    ```

    $$(2.3) \quad K = \sup_{x \in U} \|DF^{-1}(x)(DF(x) - tDF(x+s(x)))\|; 0 \le t
    \le 1\\n\|DF^{-1}(x)F(x)\|$$

    ```


    is finite Assume that $x_0 \in U$ satisfies


    $$\eta(x_0)K \le \frac{1}{2}$


    where $\eta(x) = \|S(x)\|$. Then the Newton iterates $\{x_n\}$ converge to a root
    $x^*$ of $F$, and all iterates $x_n$ and $x_0^*$ lie inside the region


    $S = \{x \in U : \|x - x_0\| < 1.61\eta(x_0)\\.$


    Furthermore, for $n \ge 1$ and $\eta_n = \eta(x_n)$ we have


    +   (i) $\eta_n \le (\frac{1}{4})^{2^{n-1}} \eta_0^2$\n(ii) $\|x_n - x_0^*\| <
    1.61\eta_n$\n(iii) $\|DF(x_n)\| < 1.61\eta_n$\n(iv) $\|DF^{-1}(x_n)\| < 1.87\|DF^{-1}(x_0)\|$$.


    PROOF. We will actually prove a stronger result, which depends only on data on
    the Newton trajectory. For any starting point $x_0 \in U$, the Newton iterates
    $\{x_n : n \ge 1\}$ are defined and lie in $U$, and we define


    ```

    $$(2.4) \quad K(x_0) = \sup_{n \ge 0} \|DF^{-1}(x_n)[DF(x_n) - DF(x_n - ts(x_n))\|;
    0 \le t \le 1\\n\|DF^{-1}(x_n)F(x_n)\|$$

    ```


    It is clear that $K(x_0) \le K$ for any $x_0$. We prove that all the conclusions
    of the theorem hold assuming that


    $$\eta(x_0)K(x_0) \le \frac{1}{2}$


    In what follows let $\beta(x) = \|DF^{-1}(x)\|$ and $\beta_n = \beta(x_n)$. Also
    set $h_n = \eta(x_n)K(x_n)$ and since $K(x_n) \le K(x_0)$ one has $h_n \le \eta_n
    K(x_0)$.'
