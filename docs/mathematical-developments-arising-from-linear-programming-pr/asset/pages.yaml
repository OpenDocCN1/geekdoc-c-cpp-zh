    We solved the perfect matching on these graphs, which involves finding the perfect
    matching of minimum weight. The perfect matching problem can be transformed to
    a matching problem by adjusting the edge weights appropriately. These runs were
    made on IBM 3090, and the code was written in double precision FORTRAN. It should
    be noted that the run times quoted are only accurate to within 10%. For more detailed
    results, the reader is referred to [16].


    We believe these results give some justification for optimism regarding the performance
    of our algorithm. This optimism is based on consideration of both the number of
    iterations and the number of stages of cutting planes, that is, the number of
    linear programming relaxations generated during the algorithm.


    Using Karmarkar''s algorithm to solve the final linear programming relaxation
    from scratch would take about half as many iterations as the reported in the table.
    This is because we call the separation routines before optimality is reached,
    the sequence of iterates does not approach the vertices of the polytope too closely,
    and the number of iterations in each stage is reasonably small.


    The number of stages adding odd set constraints using our algorithm is smaller
    than if a cutting plane algorithm based on the simplex method were used. This
    is for at least two reasons: First, because we are trying to cut off an interior
    point, we are able to find more violated equalities and cut off more of the polytope
    at each stage. Second, for many problems, the odd set constraints found at one
    stage are strongly related to the constraints found at subsequent stages. It is
    often necessary to add constraints that correspond to nested odd sets. Our separation
    heuristics are able'
