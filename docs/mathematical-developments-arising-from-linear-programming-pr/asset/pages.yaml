  md: "# SOLVING SMOOTH CONVEX PROGRAMS BASED ON NEWTON'S METHOD\n\nestablishes three\
    \ key results. First we relate the value of potential functions with some ellipsoidal\
    \ norms. The second result proves a lower bound on the amount of improvement in\
    \ the potential function obtained by taking a partial Newton step, and the last\
    \ result establishes an upper bound on the change in the potential function as\
    \ $z$ increases. Using these results we establish a global convergence theorem\
    \ for our algorithm. This theorem shows that the total number of arithmetic operations\
    \ required by this algorithm to converge to an approximate solution $x^k$ satisfying\
