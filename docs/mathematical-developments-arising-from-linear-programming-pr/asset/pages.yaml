  md: '# Limiting Behavior of the Affine Scaling Continuous Trajectories for Linear
    Programming Problems


    ILAN ADLER AND RENATO D. C. MONTEIRO


    ABSTRACT. We consider the continuous trajectories of the vector field induced
    by the primal affine scaling algorithm as applied to linear programming problems
    in standard form. By characterizing these trajectories as solutions of certain
    logarithmic barrier families of problems, we show that these trajectories tend
    to an optimal solution that in general depends on the starting point. By considering
    the trajectories that arise from the Lagrangian multipliers of the above-mentioned
    logarithmic barrier families of problems, we show that the trajectories of the
    dual estimates converge to the so-called "centered" optimal solution of the dual
    problem. We also present results related to asymptotic direction of the affine
    scaling trajectories. We briefly discuss how to apply our results to linear programs
    formulated in formats different from the standard form. Finally, we extend the
    result to the primal-dual affine scaling algorithm.


    # 1. Introduction


    The primal affine scaling (PAS) algorithm for solving linear programming problems
    was first presented by Dikin [4] and later was (independently) introduced by Barnes
    [2] and Vanderbilt, Meketon, and Freedman [13] as a variant of the projective
    interior point algorithm for linear programming that was presented in the seminal
    work of Karmarkar [6]. The PAS algorithm is designed for linear programming problems
    in standard form. A similar algorithm, the so-called dual affine scaling (DAS)
    algorithm designed for problems in inequality form, was implemented by Adler,
    Karmarkar, Resende, and Veiga [1]. Both variants are currently the most experienced
    interior


