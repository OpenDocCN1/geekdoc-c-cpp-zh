  md: 'unconstrained ones:


    ```

    $minimize f(u) - \pi_k \sum_{i=1}^a \ln(-g_i(u)), \quad k = 1, 2, \dots$

    ```


    with penalty parameters $\pi_k$ selected to converge to zero. With this particular
    choice of the barrier function, the SUMT method relates to the method of centers
    based on the "analytic center" in the parlance of Sonnevend [24]. Indeed, the
    points specified by the method of centers lie on the "center trajectory" as those
    obtained by SUMT.


    Linear programs constitute a very special case of the convex minimization problem,
    and it was only following the proposal of Karmarkar''s method [15] that the usefulness
    of linear programming of "interior point methods" was generally recognized, sparking
    an intense research effort. Karmarkar''s polynomial complexity bound for linear
    programming, for instance, was improved by the proposal of Renegar [21] of a version
    of the method of centers.


    Post-Karmarkar methods took their departure from trajectory-following procedures
    that go back to Murray [19], Murray and Wright [20], and the classic text by Fisher
    and McCormick [12]. Bayer and Lagarias [4], [5], [6] in their groundbreaking work
    identified two sets of trajectories, $A$-trajectories and $P$-trajectories, and
    their associated direction fields. $A$-trajectories are affine invariant and converge
    to SUMT with a logarithmic barrier function modified by the addition of a linear
    function. The associated field direction is often called "dual affine direction"
    or "affine scaling direction," and is utilized in class of methods (e.g., Megidido
    [16], Adler, Karmarkar, Resende, and Veiga [2]). Barnes [3], Vanderbekei, and
    Freedman [26], with forner Dikin [8] for which a substantial body of computational
    experience has been accumulated. Karmarkar''s method, on the other hand, relates
    to the $P$-trajectories.


    A main result of this paper is the continuity of the analytic "g-centers" of a
    system of linear constraints with respect to their right-hand side. This implies
    that $A$-trajectories converge to the corresponding $g$-centers of the optimal
    feasible of feasible solutions (see Megiddo [17], Adler and Monteiro [1]). Our
    proof utilizes a lemma that bounds $g$-centers away from the boundary. This lemma
    is also used to derive other convergence properties.


    $A$-trajectories have limit tangents. Moreover, it was frequently observed and
    easily proved for nondegenerate optima that, if the optimum is unique, all $A$-trajectories
    have the same limit tangent. Adler and Monteiro [1] prove these facts in full
    generality. We give a different proof that utilizes "g-varieties." Megiddo and
    Shub [18] show continuity of an affine vector field on the boundary of the feasible
    region. This result was for a different purpose and does not imply convergence
    of tangential directions since the limits may vanish.


    We also work with a more general form of linear program than commonly used. This
    is to ensure that the dual of that linear program falls again'
