    ```

    $S = \left\{x : \|x-x_0| \leq \rho^- = \left( \frac{1-\sqrt{1-2\hat{h}_0}}{\hat{h}_0}
    \right) \eta(x_0) \right\ \subset U.$

    ```


    Then


    +   (i) The Newton sequence $\{x_n\}$ is well defined, remains in $S$, and converges
    to a root $x^*$ of $F$.


    +   (ii) Let $\rho^+ = \frac{1+\sqrt{1-2\hat{h}_0}}{\omega_0}$ and set $\Theta
    = \frac{\rho^+}{\rho^-}$. Then


    ```

    $\|x_k-x^*| \leq \left( \frac{2\sqrt{1-2\hat{h}_0}}{\hat{h}_0} \frac{\Theta^2}{1-\\Theta}
    \right)^k \eta(x_0).

    ```


    Note that $A$ is a bounded invertible operator between Banach spaces $Y$ and $Z$
    and if $G=AF$ then $DG^{-1}(x)G(x)=DF^{-1}(x)F(x)$. Thus the Newton sequences
    for $F$ and $G$ are the same. This invariance is present in the hypotheses of
    Theorem 1.1.


    We now turn to the convergence criterion of Smale.


    THEOREM 1.2 (Smale [15]). Assume that $F$ is an analytic map between real Banach
    spaces $X$ and $Y$; that is, the Frechet derivatives $DF^k(x)$ exists for all
    $x \in X$ and $k=1, 2, 3, \dots$. Assume $x_0 \in X$, assume that the inverse
    $(DF)^{-1}(x_0)$ exists.


    ```

    $\eta(x_0) = ||(DF)^{-1}(x_0)F(x_0)||$

    ```


    and


    ```

    $$\hat{\gamma}(x_0) = \sup \left\ \left\ \frac{k!}{(DF)^{-1}(x_0)DF^k(x_0)} \right\
    \|^{1/(k-1)} \right\ : k \geq 2.$

    ```


    Suppose that


    ```

    $\eta(x_0)\hat{\gamma}(x_0) < .130707.$

    ```


    Then the Newton sequence is well defined and converges to a root $x^*$ of $F$.
    Furthermore


    +   (i) $\|x_{k+1}-x_k| \leq 2 \left( \frac{1}{2} \right)^{2^k} \eta(x_0).$


    +   (ii) $\|x_k-x^*| \leq \frac{1}{4} \left( \frac{1}{3} \right)^{2^{k-1}} \eta(x_0).$


    Smale''s theorem has the merit that it requires only information available at
    the starting point. In particular, it is checkable for the case when $F$ is a
    polynomial mapping. Its hypotheses are also invariant under bounded invertible
    linear transformations.


    Smale''s theorem implicitly supplies global information on the behavior of function
    $F(x)$ near $x_0$, which is inferable from the bound $\hat{\gamma}(x_0)$ analytic'
