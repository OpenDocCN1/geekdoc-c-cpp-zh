  md: '# Solving Matching Problems Using Karmarkar’s Algorithm


    JOHN E. MITCHELL AND MICHAEL J. TODD


    ABSTRACT. We describe a cutting-plane algorithm for solving matching problems.
    The primal projective standard-form variant of Karmarkar''s algorithm for linear
    programming is applied to the duals of a sequence of linear programming relaxations
    of the matching problem. Computational performance of the algorithm is described.
    We indicate why we believe our algorithm holds some long-term promise, although
    the current implementation is not competitive with simplex-based cutting plane
    approaches.


    # 1. Introduction


    The matching problem is one of the fundamental problems of combinatorial optimization.
    It was shown to be polynomially solvable by Edmonds [6] in a classic paper which
    he introduced and formalized the concept of a good algorithm. Edmonds [5] found
    a polyhedral description for the matching problem, giving a complete and nonredundant
    description of the facets of this polyhedron. The number of facets is exponential
    in the number of vertices of the graph, but Edmonds was able to use the structure
    of the facets to obtain an algorithm that runs in time polynomial in the number
    of vertices.


    Gröchel and Holland [10] developed a cutting-plane algorithm for the perfect matching
    problem that uses the polyhedral description characterized by Edmonds. Their algorithm
    employs the simplex method to solve the successive linear programming relaxations
    they obtain, and it appeared to


    1980 Mathematics Subject Classification (1985 Revision). Primary 90C05, 05C70.
    Computational facilities provided by the Cornell Computational Optimization Project
    and by the Cornell National Supercomputer Facility is a resource of the Center
    for Theory and Simulation in Science and Engineering at Cornell University, which
    is funded in part by the National Science Foundation, New York State, and the
    IBM Corporation. This research of both authors was partially supported by the
    U.S. Army Research Office through the Mathematical Sciences Institute of Cornell
    University.


    Research partially supported by NSF Grants ECS-8602534 and DMS-8706133 and by
    ONR Contract N00014-87-K-0212.'
