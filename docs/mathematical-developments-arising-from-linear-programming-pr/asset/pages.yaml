  md: '# Convergence and Boundary Behavior of the Projective Scaling Trajectories
    for Linear Programming


    RENATO D. C. MONTEIRO


    ABSTRACT. We analyze the convergence and limiting behavior of the continuous trajectories
    of the vector field induced by the projective scaling algorithm as applied to
    (possibly degenerate) linear programming problems in Karmarkar''s standard form.
    We show that a projective scaling trajectory tends to an optimal solution that
    in general depends on the starting point. When the optimal solution is unique,
    we show that all projective scaling trajectories approach through the same asymptotic
    direction. Our analysis is based on the affine scaling trajectories for the homogeneous
    standard form linear program that arises from Karmarkar''s standard form linear
    program by removing the unique nonhomogeneous constraint.


    # 1. Introduction


    Consider the linear programming problem in Karmarkar''s standard form as follows:


    ```

    $(P) \min {c^T w | Aw = 0, e^T w = 1, w \ge 0\}$

    ```


    where $\mathcal{A}$ is an $m \times n$ matrix $(m \le n-1)$ of full rank, $c$
    and $w$ are $n$-vectors, and $e$ denotes the $n$-vector of all ones. Assume that
    $(P)$ has feasible solution $w > 0$, under the assumption that the optimal value
    of $(P)$ is $0$, was first presented by Karmarkar in his seminal paper [11]. Variants
    of the projective scaling algorithm have been presented by many authors, including
    Anstreicher [2], G Ghellink and Vial [5], Gay [8], Gonzaga [9], Todd and Burrell
    [18], and Ye and Kojima [21]. Another algorithm, namely the affine scaling algorithm,
    designed for solving linear programming problems


    1980 Mathematics Subject Classification (1985 Revision). Primary 90C05; Secondary
    90C25. Key words and phrases. Interior point methods, linear programming, Karmarkar''s
    algorithm, logarithmic barrier function, and affine scaling trajectories, continuous
    trajectories for linear programming.


    This work was done while the author was a Ph.D. student in the Department of Industrial
    Engineering at the University of California at Berkeley. The author is currently
    working at the University of Arizona, Systems and Industrial Engineering Department,
    Tucson, AZ 85721.'
