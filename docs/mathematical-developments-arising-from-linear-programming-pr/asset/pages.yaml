  md: '# I. I. Dikin’s Convergence Resultnfor the Affine-Scaling Algorithm


    R. J. VANDERBEI AND J. C. LAGARIAS


    ABSTRACT. The affine-scaling algorithm is an analogue of Karmarkar''s linear programming
    algorithm which uses affine transformations instead of projective transformations.
    Although this variant lacks some of the nice properties of Karmarkar''s algorithm
    (for example, it is probably not a polynomial-time algorithm), it nevertheless
    performs well in computer implementations. It has recently come to the attention
    of the western mathematical programming community that V. Dikin, proposed the
    basic affine-scaling algorithm in 1967 and published a proof of convergence in
    1974. Dikin''s convergence proof assumes only primal nondegeneracy, while all
    other known proofs require both primal and dual nondegeneracy. Our aim in this
    paper is to provide a clear presentation of Dikin''s ideas.


    # 1. Introduction


    In 1984, N. K. Karmarkar [7] discovered a polynomial-time algorithm for linear
    programming, unlike earlier algorithms, was said to perform better than the traditional
    simple method. This pioneering work inspired a huge amount of research on interior
    methods for linear programming. Today, these methods are divided into two basic
    classes. Algorithms in the first class are called projective-scaling algorithms
    (see [10] for a list of references). This class includes the original algorithm
    studied by Karmarkar. Roughly speaking, projective-scaling algorithms are hard
    to describe but easy to analyze. That is, the description of these algorithms
    involves technicalities such as logarithmic barrier functions, assumptions that
    the objective function value is zero, etc., although they originally seemed obscure
    are now forcing the sequence of points generated by the algorithm to home in something
    called the ‘central trajectory.’ Once these technicalities are understood, the
    analysis proceeds to a proof of polynomial-time convergence.


    Algorithms in the second class are called affine-scaling algorithms (see, e.g.,'
  merge: -1
  pgno: 124
- img_proc: true
  md: '[4], [13]). In comparison, these algorithms are easy to describe but hard to
    analyze. That is, affine-scaling algorithms have very simple, geometrically intuitive
    descriptions, but proving convergence is a difficult and interesting mathematical
    problem. Until recently, the only known proofs of convergence (in the west) involved
    assuming that the linear program was primal and dual nondegenerate. (Empirical
    evidence suggests that neither of these assumptions is necessary). Furthermore,
    there is strong evidence [8] to support the belief that these algorithms are in
    fact exponential in the worst case.


    This segregation into two classes is not intended to imply projective-scaling
    algorithms are ''first-class'' whereas the affine-scaling algorithms are ''second
    class''. In fact, all serious large scale implementations currently pursued use
    affine-scaling methods ([1], [2], [9], [11], [12]). The reason is that the affine-scaling
    methods have certain advantages over the projective-scaling algorithms. For example,
    they apply directly to problems presented in standard form, and on the average
    they are computationally more efficient. Efficiently, this brings us back to the
    situation where what is theoretically best (worst case) is not practically best
    (average case).


    A further point worth mentioning is that the distinction between these two classes
    of algorithms is blurred as people discover polynomialtime algorithms that look
    more and like affine-scaling algorithms. The most notable example of this is the
    recent paper by Monteiro et al. [10], where it is shown that the affine-scaling
    algorithm applied to the primal-dual problem is in fact polynomial if the initial
    point is close to the center of the polytope and the step size is not too big.


    It has recently come to the attention of the western scientific community I. I.
    Dikin, proposed the basic affine-scaling algorithm in the Soviet Mathematics Doklady
    in 1967 [5]. He published a proof of convergence in 1974 [6]. It turns out, that
    not only Dikin predated the west by almost 20 years, but also his proof of convergence
    does not require the dual nondegeneracy assumption. The purpose of this paper
    is to give a clear presentation of Dikin''s methods.


    Perhaps the most interesting open problem in this area is to prove that the affine-scaling
    algorithm converges even if the problem is primal degenerate. Essentially, all
    real-world problems are both primal and dual degenerate, and yet practical experience
    shows that this does not present any difficulty (except that the code has to be
    able to solve a consistent system of equations when there are dependent or almost
    dependent rows). In a recent paper [3] by Adler and Monteiro, it was shown that
    the continuous trajectories associated with the affine-scaling algorithm do converge
    even when the problem is primal and/or dual degenerate. Hence the problem is the
    discreteness of the affine-scaling algorithm. Dikin chose a step size that is
    smaller than the one in [13] and was able to remove the dual nondegeneracy assumption.
    Perhaps by taking an even smaller (but noninfinitesimal) step size, it might be
    possible to remove the primal nondegeneracy assumption as well.'
