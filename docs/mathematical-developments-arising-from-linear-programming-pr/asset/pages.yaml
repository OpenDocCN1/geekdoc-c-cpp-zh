    We start by briefly reviewing the notion of a vector field. Let $E \in R^n$ be
    a finite-dimensional affine space. Let $T(E)$ denote the subspace determined by
    translating the affine space $E$ to the origin of $\mathbb{R}^n$; that is, $T(E)$
    is the set of vectors tangent to the affine space $E$. A vector field in an open
    subset $O$ of $E$ is a mapping $\Phi : O \to T(E)$. The trajectory of the vector
    field $\Phi$ passing through the point $x^0 \in O$ at time $t^0 \in R$ is determined
    by the solution of the following differential equation:


    ```

    $x(t) = \Phi(x(t)),\nx(t^0) = x^0$.

    ```


