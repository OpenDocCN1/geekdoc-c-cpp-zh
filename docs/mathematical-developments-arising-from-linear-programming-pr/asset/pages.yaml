  md: '# Preface


    This volume contains the proceedings of the AMS Summer Research Conference on
    Mathematical Developments Arising from Linear Programming held at Bowdoin College,
    June 25–July 1, 1988. This conference presented current research in linear and
    nonlinear programming and related areas of mathematics. There has been intense
    work in this area, much of it in extending and understanding the ideas underlying
    N. Karmarkar''s interior-point linear programming algorithm, which was proposed
    in 1984. This research effort is interdisciplinary, and the conference brought
    together mathematicians, computer scientists, and operations researchers.


    The state of the field in 1987 is illustrated in Progress in Mathematical Programming,
    Interior-Point and Related Methods (N. Megiddo, ed.), Springer-Verlag, Berlin
    and New York, 1989. To put the results presented in this volume in perspective,
    we first review the state of knowledge at that time.


    Karmarkar''s algorithm is an interior-point method for solving linear programs.
    It requires as input a linear program provided with a special starting point in
    the interior of the polytope of feasible solutions, center. There are two related
    types of algorithms, the projective scaling algorithm, which uses projective transformations,
    Karmarkar proved to be a polynomial time algorithm, and the affine scaling algorithm,
    which uses affine transformations, which has not, in general, been proved to converge
    in polynomial time (and probably not). The affine scaling algorithm, however,
    has computational advantages in practice, and many of the computer implementations
    of "Karmarkar''s algorithm" actually use affine scaling ideas. For both algorithms
    there is a vector field on the polytope of feasible solutions, which yields differential
    equations giving trajectories of feasible solutions inside the polytope all of
    which go to an optimal solution. The affine and projective scaling methods have
    different trajectories in general, but they have one common, the central trajectory
    or central path, which turns out also to be a logarithmic barrier function trajectory
    previously studied in connection with nonlinear programming algorithms. Karmarkar''s
    method,'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# xii PREFACE


    and many subsequent algorithms, approximately follow the central trajectory. Karmarkar
    originally proved that a linear program (in equality form) in n dimensions and
    with input size O(nL) iterations to convergence and O(n^{3.5}) arithmetic operations
    in total. J. Renegar, using path-following ideas, found an algorithm at most O(√L)
    iterations. By early 1987 P. Vaidya and, independently, C. Gonzaga obtained methods
    that followed the central trajectory O(n²) arithmetic operations in total. Karmarkar''s
    algorithm also used nonlinear programming ideals involving minimizing a "potential
    function." Such ideas carry over to a polynomial algorithm for convex quadratic
    programming was shown by S. Kapoor and P. Vaidya in 1987, and for a class of linear
    complementarity problems by M. Kojima, S. Mizuno, and A. Yoshise. much work was
    done on developing computationally efficient versions of interior-point methods,
    including variants of the projective scaling algorithm that can handle problems
    in standard form and which do not require advance knowledge of the optimal objective
    function value.


    Now describe the results presented in this venue. The conference had ten invited
    talks which were intended to provide broad views of recent in various areas related
    to linear programming. Section 1 presents papers based on such techniques. The
    remaining sections presented papers classified by subject area, most of which
    use interior-point ideas.


    The papers in Section 1 reflect the wide range of areas of mathematics on which
    linear programming impinges. Convex polytopes under linear programming problems
    and the simplex method. The paper of C. L. Lee describes on the combinatorial
    structure of convex polytopes. K. H. Barnard surveys "average-case" polynomial
    running bounds obtained for variants of the simplex method under various probability
    models. The paper of N. Megiddo analyzes several different notions of "approximate
    solution" of a linear programming problem. N. Karmarkar presents results that
    use Riemannian geometric methods to study the behavior of trajectories underlying
    interior-point methods. His results yield insights concerning the running time
    of such algorithms. Finally the paper of A. Bloch describes flow-like arising
    from several algorithms, including interior-point linear programming algorithms,
    the QRalgorithm for diagonalizing symmetric matrices, and methods for the least
    squares problems, matching problems. It shows that these flows are related to
    completely integrable Hamiltonian systems by suitable nonlinear transformations.


    Section 2 presents results on interior-point methods for linear programming. The
    paper of Y. Ye gives an O(√L) iteration algorithm using a new class of potential
    functions that apparently does not require staying close to the central trajectory.
    This is a significant advance, the previously known O(√L) algorithms take "small"
    steps, so that such algorithms must take on the order of √L iterations to get
    close to an optimal solution.'
