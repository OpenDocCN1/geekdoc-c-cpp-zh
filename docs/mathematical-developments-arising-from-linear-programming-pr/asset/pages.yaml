    # 10. The moment map


    We conclude with a brief discussion of a connection between convex polytopes and
    algebraic varieties. See also [41]. Let $Q$ be a rational $d$-polytope with vertices
    $v_1, \dots, v_n$. Consider all nontrivial affine relations on the vertices $D
    = (a_1, \dots, a_n) = \{a: \sum a_i v_i = 0, \sum a_i = 0, a \in \mathbb{R}$,
    not all zero\}$. For any $a$, $A_+ = \{i: a_i > 0\}$, $A_- = \{i: a_i < 0\}$,
    and $A_0 = \{i: a_i = 0\}$. We want to show that $a$ is conform if $A_+ \subseteq
    A''_+$ and $A_- \subseteq A''_-$. It is not difficult to see that there exists
    a finite set $\{a^1, \dots, a^m\}$ of integer $a^l \in D$ conforming to $a$.


    Fine [13] constructs a variety in the following way. Let $u_1, \dots, u_n$ be
    indeterminates. For each integer $a = (a_1, \dots, a_n) \in D$ associate the relation


    ```

    (12) $\prod_{i \in A_+} u_i^{a_i} = \prod_{i \in A_-} u_i^{-a_i}$

