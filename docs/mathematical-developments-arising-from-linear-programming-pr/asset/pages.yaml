  md: '# SOLVING MATCHING PROBLEMS USING KARMARKAR''S ALGORITHM


    The theorem holds because there are only a finite number of cutting planes, and
    the current dual solution (y, z) always satisfies all the cuts so far, so each
    cut is added to the formulation at most once.


    While Karmarkar''s algorithm applied to a single linear program runs in polynomial
    time, it is not known if our algorithm runs in polynomial time. The reason is
    that there seems to be no way to obtain a polynomial bound for the number of stages.
    The analysis of Karmarkar''s method is based on a guaranteed decrease in a potential
    function at each iteration, and the potential functions at different stages appear
    to be unrelated. (It should be noted that a cutting-plane algorithm based on the
    ellipsoid algorithm does run in polynomial time, provided it has a polynomial
    separation oracle. See Grötschel et al. [12])


