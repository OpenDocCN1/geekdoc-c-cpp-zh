    A third variant, a primal-dual affine scaling, was presented and analyzed by Monteiro,
    Adler, and Resende [11]. Our main interest in this paper is to analyze the limiting
    behavior of the three major variants of the affine scaling algorithms. Karmarkar
    [7] and Bayer Lagarias [3] discussed some properties of the continuous PAS trajectories.
    Meggido and Shub [9] analyzed the limiting behavior of these trajectories near
    the optimal vector under the assumption of primal and dual nondegeneracy. Meggido
    [8] presented and proved some limiting behavior of the trajectories associated
    with the PDAS algorithm. By presenting a weighted primal affine scaling algorithm
    and characterizing its infinitesimal trajectories as solutions of certain parametrized
    logarithmic barrier families of problems, we extend the above results and present
    some new results related to all three affine scaling variants with nondegeneracy
    assumptions.


    The logarithmic barrier function is formally studied in Fiacco and McCormick [5]
    in the context of nonlinear optimization.

    The paper is organized as follows. In Section 2, we define a weighted PAS algorithm
    and present a characterization of its infinitesimal trajectories as solutions
    of certain parametrized logarithmic barrier families of problems. By considering
    the optimality conditions associated with these families of problems, we automatically
    obtain dual trajectories associated with the weighted PAS trajectories. In Section
    3, we present the limiting behavior of the weighted PAS trajectories and its associated
    dual trajectories. We show in particular that, while the (weighted) PAS trajectories
    tend to an optimal solution of the linear program under consideration depends
    on the starting point, the dual trajectories tend to the so-called (weighted)
    "center" of the optimal face of the dual problem. In Section 4, we apply the results
    in Section 3 to show that the optimal face of the dual problem as x traverses
    a (weighted) "center" converging to an optimal solution of the linear program
    under consideration. In Section 5, we present some results related to the asymptotic
    direction of the primal and dual trajectories. In Sections 6 and 7, we briefly
    discuss how to apply the results of the preceding sections (2–5) to the dual affine
    scaling (DAS) and the primal-dual affine scaling (PDAS) trajectories, respectively.
    We conclude by offering some remarks in Section 8.


