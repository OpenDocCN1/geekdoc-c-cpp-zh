    problem


    find $w, z$ such that for given $q, M$


    $(2.2) \quad w - Mz = q, w^T z = 0, w \ge 0, z \ge 0$


    where $w, z, q \in R^{m+n}, M \in R^{(m+n) \times (m+n)}$


    When we specialize $M$ to


    ![](img/37c51c400a5180ea99d953873bf70e4f_39_0.png)


    and $q$ to


    ![](img/37c51c400a5180ea99d953873bf70e4f_39_1.png)


    a solution of (2.2) will give the solution of (2.1) and of the corresponding dual
    problem.


    Geometrically, the task is to represent $q$ as a conical combination of $m+n$
    columns (alternatively taken from $-M$ or the identity matrix $I$), i.e.,


    $q = Iw - M \quad \text{and} \quad w^T z = 0, \quad w \ge 0, z \ge 0$.


    We solve the problem by Lemke''s algorithm. Usually, we do not know the representation
    for $q$, but we know it for $e=1$ (the vector of $m+n$ ones). We have $e = e -
    M_0$.


    Now imagine a line between $e$ and $q$ and parametrize movement from $e$ to $q$
    by setting


    $(2.3) \quad q_\lambda = \lambda q + (1 - \lambda)e \in [0, 1]$.


    We know the conical representation for $\lambda=0$, but we want it for $\lambda=1$.
    When we move with increasing $\lambda$, we try to maintain $q_j = w_i - Mz_j$,
    with $w_j \ge 0, z_j \ge 0$ by adjusting $w_i$ and $z_j$. Every time we set a
    new cone (generated by $m+n$ column vectors out of $-M$ or $I$), we calculate
    the corresponding change of representation by a pivot step in Lemke''s algorithm.
    Consequently, we get an upper bound for the number of pivot steps in Lemke''s
    algorithm by counting the number of cones that had been intersected by $[e, q]$.


    The stochastic assumptions used in the analysis of Lemke''s algorithm were as
    follows:


    +   (1) Let the distribution of $(A, b, v)$ be absolutely continuous.


    +   (2) Let $A, b, v$ be distributed independently, and let particularly the columns
    of $A$ be distributed


    +   (3) Let the probability measure of $(A, b, v)$ be invariant under coordinate
    permutations (in columns of $A$ resp. b).


    Smale''s analysis came to the following result about $E_{m,n}(s^l)$, the expected
    number of pivot steps in Lemke''s algorithm for $(m, n)$-problems.'
