  md: '# Efficient Faces of Polytopes: Interior Point Algorithms,

    Parameterization of Algebraic Varieties,

    and Multiple Objective Optimization


    ABSTRACT. This paper addresses the problem of computing the set of efficient faces
    of a bounded polyhedron in R that is defined by linear inequalities. It describes
    two algorithms. One algorithm is an interior point method that generalizes and
    extends the affine variants of Karmarkar''s algorithm to multiple objective optimization.
    It finds an efficient (maximal) face in polynomial time. The other algorithm is
    based on techniques of algebraic geometry related to the parameterization of algebraic
    varieties in n-dimensional spaces. It approximates a portion of the set of efficient
    faces by an algebraic surface.


    # 1. Introduction


    Recent breakthroughs in linear programming (LP) have revolutionized the field.
    While it had long known (Klee and Minty (1972)) that the simplex algorithm could
    require an exponential number of pivots, the computational complexity of LP remained
    an open question until 1979 when Khachian (1970) showed that LPs could be solved
    in polynomial time using the ellipsoid algorithm. More recently, Karmarkar (1984)
    and others (Adler, Resende, and Vega (1986), Marsten, et al. (1988), McShane et
    al. (1988)) have demonstrated that interior point methods can be computationally
    effective.


    Khachian and Karmarkar demonstrated that it is computationally more efficient
    to work with an algebraic hypersurface, e.g., an ellipsoid that approximates the
    convex polytope, than to work with the polytope itself, which may have an exponential
    number of extremes. In multiple objective


    1980 Mathematics Society Classification (1985). Primary 90B50, 90C05, 52A25,

    14A10.

    This research was supported by a grant from the Office of Naval Research under
    University Research Initiative grant number N00014-88-K-0689, NSF grant DMS-88-16286,
    ONR grant N00014-88-K0402, and ARO grant DAAG 29-85-C0018 with Cornell MSI, at
    Purdue.'
