    The variational conditions give Euler-Lagrange equations defining the differential
    equations for geodesic curves:


    $$(3.1.1) \quad \frac{d}{dt}\left(\frac{\partial L}{\partial v^i}\right) = \left(\frac{\partial
    L}{\partial u^i}\right) \quad 1\leq i\leq n.$


    Geodesics can also be defined in terms of parallel translation using an affine
    connection. Let $T=dx/dt$ be the tangent to a curve $x(t)$ where $t$ is any smooth
    parametrization of the curve, not necessarily the arc-length parametrization.
    Then


    $T(x+\Delta x) = T(x) + \frac{d^2x}{dt^2}\Delta x + O(\Delta x^2).$$


    If we translate $T$ parallel to itself then


    $T'' = T + L_{jk}^i T^j\Delta x^k.$


    Equating the two,


    $$(3.1.2) \quad \frac{d^2x^i}{dt^2} = L_{jk}^i T^j\frac{dx^k}{dt} = L_{jk}^i \frac{dx^j}{dt}\frac{dx^k}{dt}.$$


    Thus it is possible to find the differential equation for a geodesic in terms
    of an affine connection alone. If hence two Riemannian metrics give the same affine
    connection then they have the same set of geodesics. (Given a Riemannian metric,
    there is only one affine connection compatible with it, but a given affine connection
    can be compatible with more than one Riemannian metric.)


    # 3.2. Global distance function in the unconstrained case. In the special case
    of (1.1.1) when the polytope is just the simplex $S_n$ for the projective algorithm,
    it is easy to compute the geodesics either by the differential equation or by
    exponentiating the elements of Lie algebra associated with the Lie group. We show
    that the distance between $x$ and $y$ in this metric is given


    $$(3.2.1) \quad d^2(x,y) = \sum_i [\ln\frac{x^i}{y^i} - \frac{1}{n}\sum_j\ln\frac{x^j}{y^j}]^2.$


