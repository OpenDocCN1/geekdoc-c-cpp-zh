    We note that the numerical difficulties in solving linear programming problems
    are due to the fact that many problems are ill posed. It is well known in numerical
    analysis (see, e.g., [3]) that near-singularities in the matrix $A$ can cause
    problems. However, in this paper we also discuss aspects of approximate solutions
    that arise even when exact arithmetic is used. For example, if one is interested
    in an approximate solution, what should be a good termination criterion? Because
    of such questions we have to deal with perturbations of the vectors $b$ and $c$
    and not only of the matrix $A$.


    Due to the classification of the problem, we clearly cannot always measure the
    quality of the approximation by the distance between the exact solution and the
    approximate one (neither in terms of the solution vector nor terms of the objective
    function). Thus a different approach to approximation may be proposed for a general
    situation, where there is some natural metric on the input space, but there does
    not exist one for the output space. The following definition is similar to backward
    analysis of errors in numerical analysis [9].


    DEFINITION 2.2. Let $M = (S, d)$ be a metric space and $f$ be a mapping from $S$
    into some $T$ that does not necessarily have any metric associated with it. A
    mapping $g: S \rightarrow T$ is called an $\epsilon$-approximation to $f$ if for
    every $x \in S$, there exists an $x'' \in S$ such that $d(x, x'') < \epsilon$
    and $g(x) = f(x'')$.


    In linear programming the output space (including the classification) does have
    a metric structure. Besides the classification information, there are also numerical
    values associated with the variables. The linear programming problem follows the
    following approach to approximation by solving the problem:


    PROBLEM 2.3. Given $SF(A, b, c)$ and $\epsilon > 0$, name a class $S \in \{FF,
    FI, I, II\}$ and assign values to the variables so that the following condition
    is satisfied: There exists an instance $(A'', b'', c'')$ in $S$ for which the
    numerical values are correct within an error of $\epsilon$, such that $\|(A, b,
    c) - (A'', b'', c'')\|_{\infty} < \epsilon$.


