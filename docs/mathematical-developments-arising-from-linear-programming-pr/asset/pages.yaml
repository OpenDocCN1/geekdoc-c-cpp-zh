  md: '# EFFICIENT FACES OF POLYTOPES


    If $X$ is an $n$-dimensional real Euclidean space $E^n$, $Y$ is an $m$-dimensional
    space $E^m$, and the partial order on $E^m$ is defined by


    $x < x'' \text{ iff } x_i \leq x_i'', \quad \text{for all } i = 1, \dots, m,$


    with strict inequality for at least one $i$ (componentwise strict partial order),
    then the maximal points of $X$ under $<_Y$ are called efficient (nondominated,
    Pareto-optimal) points.


    The sets $X$ and $Y$ can be infinite dimension. However, for our purposes we will
    assume that $X$ and $Y$ are subsets of finite dimensional Euclidean spaces. We
    will also assume that the partial order in $Y$ is defined by a positive cone $\Lambda$
    as follows:


    $y \geq z \text{ iff } y-z \in \Lambda, \quad y > z \text{ iff } y-z \in \Lambda
    \setminus \{0\.$


    The cone, therefore, describes the preferences of a decision maker. An example
    of a canonical order in $R^p$ is given by the nonnegative orthant


    $\Lambda = \{ \hat{y} \in R^p \mid \hat{y}_i \geq 0, \dots, \hat{y}_p \geq 0 \}.$


    The Pareto maximal objective $\hat{y} = f(\hat{x})$ and the set $\hat{Q}$ of all
    Pareto maximal objectives, and the set of all maximal decisions $E(X, f, \Lambda)$
    are then defined as follows:


    $\hat{Q} = \{ \hat{y} \in Q \mid (\hat{y} + \Lambda) \cap Q = \{ \hat{y} \}\}$


    and

    $E(X, f, \Lambda) = \{ \hat{x} \in X \mid f(\hat{x}) \text{ for some } \hat{x}
    \in \hat{Q} \}.$


    In the literature of multiple objective optimization the Pareto maximal decisions
    are called efficient points. Figure 1 shows an example in $R^2$. In $R^2$ with
    the usual componentwise vector ordering $\leq$,


    $\Lambda = \text{first quadrant}.$


    Then for any $x = (x_1, x_2) \in R^2, x + \Lambda$ is x the plus of all the points
    that dominate $x$. If $ABC$ is the polyhedron (polygon) of interest, $AC$ is the
    efficient face (edge).


    ![](img/37c51c400a5180ea99d953873bf70e4f_336_0.png)


    FIGURE 1. Efficient face in $R^2$'
