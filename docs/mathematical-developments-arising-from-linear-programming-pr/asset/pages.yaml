    $\sigma_0 = 0$. An algorithm for finding a point to two convex sets has been proposed
    in [4]. It begins with a point $\hat{y}^1 \in S_1$ and computes the point $\hat{y}^1
    \in S_2$, nearest $y^1$. It computes $y^2$ as the point in $S_1$ nearest $\hat{y}^1$.
    In general, we iterate $y^k \in S_1, \hat{y}^k$ is defined to be the projection
    of $y^k$ onto $S_2$ and $y^{k+1}$ is the projection of $\hat{y}^k$. In mathematical
    terms we have


