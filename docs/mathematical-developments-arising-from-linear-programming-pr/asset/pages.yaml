    for VLSI design [10]. The method described in this paper is part of an ongoing
    research program in interior-point approach. Rather than describing a single algorithm,
    we have described a general approach for constructing interior-point algorithms
    for difficult combinatorial problems. We believe that efficient algorithms for
    many difficult combinatorial problems can be constructed on the basis of a common
    principle similar to what we have outlined in this paper, and these algorithms
    will differ mainly in the way additional structure of the particular problem class
    is exploited to gain further computational efficiency. Detailed description of
    the algorithm at the level of pseudocode as applied to any specific problem class
    will be included in the paper describing experimental results on that particular
    class.


    Now we relate the following quadratic programming problem to the integer programming
    problem. Maximize


    ```

    $\sum_{i=1}^n x_i^2, \quad x \in R^n$

    ```


    subject to


    ```

    $Ax \le b$

    ```


    Note for any feasible solution to the quadratic programming problem, $|x_i| \le
    1 \Rightarrow \sum_{i=1}^n x_i^2 \le n$. Here the maximum value of objective function
    is at most $n$. If $x$ is a feasible solution to IP, then it is a feasible solution
    to QP and $x \in \{-1, 1\ \Rightarrow \sum_{i=1}^n x_i^2 = n$; hence, it is an
    optimal solution to QP with optimal value $n$.


    Conversely any optimal solution to QP with objective value $n$ is a feasible solution
    to the IP problem.


    The problem transformation given above is by itself of little value since the
    new problem is also NP-complete and hopelessly difficult computationally, if one
    were to employ an extreme-point approach, as in the simplex method, to solve it.
    What makes the problem transformation computationally useful is the recent approach
    into the geometry of linear programming polytopes gained by interior-point approach
    as Karmarkar’s algorithm [6]. As a by-product of this approach we discovered a
    method of making spherical approximation to a polytope, around any strictly interior
    point in the following sense.


    Given any point in the strict interior of the polytope, there is a projective
    transformation of the space, so that in the transformed space it is possible to
    draw two balls, circumscribing and inscribing the polytope, both centered at the
    image of the given point and having a “small” ratio of radii. In the worst case
    the ratio can be guaranteed to be no more than $n$, but in the average case it
    is even smaller.'
