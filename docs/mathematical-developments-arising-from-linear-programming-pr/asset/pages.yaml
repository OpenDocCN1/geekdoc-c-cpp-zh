  md: '214


    RENATO D. C. MONTEIRO


    in standard form, was presented by Dikin [6] and was later (independently) reintroduced
    by Barnes [3] and Vanderbei, Meketon, and Freedman [19] as a variant of the projective
    scaling algorithm. The continuous trajectories generated by the vector fields
    induced by the projective and affine scaling algorithms are commonly referred
    to as projective scaling trajectories and affine scaling trajectories, respectively.


    Continuous trajectories in the context of nonlinear programming have been discussed
    ago within the nonlinear programming community. In instance, in the case of Fiacco
    and McCormick [7], continuous trajectories that arise as sets of minimizers for
    parametrized families of weighted logarithmic barrier problems, are systematically
    studied.


    With the discovery of Karmarkar''s algorithm and other interior point methods,
    a new effort arose studying their continuous trajectories. Because of the special
    structure exhibited by linear programming, these continuous trajectories turn
    out to be more amenable to a deeper analysis than the trajectories associated
    with algorithms for general nonlinear optimization problems.


    The importance of analyzing the projective and affine scaling trajectories was
    recently pointed out by Karmarkar [12]. Bayer and Lagarias [4] presented a systematic
    study of some properties and mathematical structures of these trajectories. Megdid
    and Shu [14] and Shub [17] analyzed the limiting behavior of these trajectories
    near the optimal vertex under nondegeneracy assumptions. By characterizing the
    affine scaling trajectories as solutions of certain parametrized logarithmic barrier
    families of problems. Adler and Monteiro [1] analyzed the convergence and limiting
    behavior of the affine scaling trajectories under nondegeneracy assumptions. They
    Using a different approach, Wittgall, Boggs, and most [20] investigated the convergence
    of the affine scaling trajectories without nondegeneracy assumptions. The latter
    also contains a good historic review of the development and relations of several
    works that discuss continuous trajectories for linear and nonlinear programming.


    Another effort analyzing continuous trajectories for linear programs is by Megdid
    [13], which studied the weighted barrier trajectories in the framework of primal-dual
    complementarity relationships for the special case of linear and convex quadratic
    programming problems. A polynomial algorithm, namely the primal-dual affine scaling
    algorithm, which has the weighted barrier trajectories as its continuous trajectories,
    were pre-ented and analyzed by Monteiro, Adler, and Resende [15].


    The purpose of this paper is to extend the results of [14] and [17] by studying
    the convergence and limiting behavior of the projective scaling trajectories for
    the linear program (P) without imposing any nondegeneracy assumption (P). The
    development in this paper is closely related to the one in [1] in'
