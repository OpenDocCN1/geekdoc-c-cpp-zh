  md: '# ON SOLVING THE LINEAR PROGRAMMING PROBLEM APPROXIMATELY


    It is not known whether the $m \times n$ linear programming problem with real
    data can be solved in a polynomial number of arithmetic operations and comparisons
    in terms of $m$ and $n$. (We will refer to this notion of complexity as strongly
    polynomial time, even though the usual definition of this concept also requires
    polynomial time in the usual sense.) Thus, another question is whether for any
    $\epsilon > 0$, any of the $\epsilon$-approximation problems can be solved in
    a polynomial number of operations in terms of $m, n$, and $-\log \epsilon$. To
    deal with this question, we first have to define what we mean by an $\epsilon$-approximate
    solution. In particular, such definition should not make the second question trivially
    equivalent to the first. For example, the concept suggested in (i) above. Thus,
    for the problem Maximize $c^Tx$ subject to $Ax \leq b$ (assuming its $V^*$ exists)
    an $\epsilon$-approximate solution is a point $x$ such that $Ax \leq b$ and $c^Tx
    \geq V^*-\epsilon$. This definition is not satisfactory because it is not clear
    whether an $\epsilon$-approximation algorithm is required to decide the existence
    of an $x$ such that $Ax \leq b$, and the boundedness of the function $c^Tx$ on
    the feasible domain. If it is required to decide these questions, then in the
    worst-case this approximation problem is trivially equivalent to the exact problem.


    The consequences of approximation problems on convex sets are studied in [7].
    It is not clear whether these results can be applied to the type of results we
    seek here. The reason is that over the real numbers seems difficult to obtain
    estimates of the radii of a circumscribing sphere and an inscribed sphere. The
    main complexity result on convex minimization in [7] (Theorem 2.2.15) assumes
    that the convex set is given with estimates of such radii. Our main interest is
    the question of what is a reasonable sense of approximation when the algorithm
    fails to classify the instance correctly as feasible, unbounded, etc.


    In Section 2 we give some preliminaries and discuss the difficulties involved
    in classifying the problem. In Section 3 we discuss approximate solutions based
    on satisfying a termination criterion within some tolerance. In Section 4 we discuss
    whether notion of approximation is based on solving a perturbed instance exactly.
    Section 5 gives an analysis of complexity for various notions of complexity.


    # 2. Preliminaries


    We pointed out in the introduction that the practical situation usually dictates
    the right notion of approximate solution. For a theoretical discussion it is often
    convenient to consider the problem in the symmetric form Sym(A, b, c). (See Section
    1.) Traditionally, an exact algorithm for this problem (for example, the simplex
    method) is used to provide the user with information as follows. It has to classify
    the problem into one of the following three categories:


    +   (i) Infeasible. (The domain $X$ defined by $Ax \leq b$ and $x \geq 0$ is empty).'
