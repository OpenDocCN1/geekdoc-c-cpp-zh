    Theorem 2.5. $E_{m,n}(s^L) \leq O(n)(1+\ln(m+1))^{n(n+1)}$ under conditions (1)-(3)
    where $O(n)$ is a constant depending on $n$ but not on $m$.


    This result showed that $E_{m,n}(s^L)$ is polynomial in $m$, but the dependence
    on $n$ could be exponential.


    # 3. The shadow-vertex algorithm and other parametric variants


    Lemke''s algorithm can be interpreted as an application of the principle of parametric
    programming. Even more direct is the use of parametric variants over the next
    two approaches.


    For reason we explain how the vertices works. As stated before, consider Phase
    I to be done and a start vertex $x_0$ to be given. Now $x_0$, itself is an optimal
    vertex with respect to a certain objective direction $u \in R^n$.


    Having the optimal vertex with respect to $u^T x$, we desire to have for $v^T
    x$. We now project the polyhedron $X$ onto the two-dimensional plane spanned by
    $u$ and $v$ and we obtain a two-dimensional polyhedron $\Gamma(u, v)$. In $\Gamma(u,
    v)$, some of the vertices of $X$ have disappeared in the interior; the others
    have vertices of $\Gamma(u, v)$ (the shadow of $X$). The latter vertices of $X$
    will be called shadow vertices. As a result of their definition, the vertices
    $x_0$ and $x_i$ are shadow vertices. And there is a Simplex Path connecting both,
    touching only shadow vertices. This path is unique as a consequence of nondegeneracy
    if we run through the smaller angle between $u$ and $v$. Hence the number of shadow
    vertices $S$ is an upper bound for the representation of the number of pivot steps
    for the realizing $shadow-vertex path$. This realization is done with little effort,
    we only need a representation for a second objective $u$ in the Simplex Tableau,
    as we had for $v$ before.


    Running along the Simplex Path from $x_0$ to $x_i$, can be regarded as walking
    through the vertices maximizing an objective $(1-\lambda)u+\lambda v$ with $\lambda
    \in [0, 1]$ while $\lambda$ increases.


    And also very useful for the following is the concept of cooptimality. A point
    $y \in X$ is called $(u, v)$-optimal if $y$ is $u$-optimal ($u^T y$ is maximal)
    among all points of $X \cap\{u^T x = v^T y\}$. That means $y$ cannot be improved
    without changing $v^T x$.


    Obviously, every cooptimal vertex is optimal with respect to an objective $(1-\lambda)u+\lambda
    v$ with $\lambda \in[0,1]$, and it is clear that every cooptimal edge lies on
    the boundary of the shadow of $X$ and that every cooptimal vertex is a shadow
    vertex. Hence we have


    > $s \leq S$.


    ($S$ number of $(u, v)$-cooptimal vertices; $S$ number of shadow vertices).


    # 4. Results under the Sign-Invariance Model


    The stochastic model—the Sign-Invariance Model—could be analyzed and lead to a
    much more optimistic judgment on the average behavior.'
