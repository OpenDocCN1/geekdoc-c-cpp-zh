  md: '# On Solving the Linear Programming

    Problem Approximately


    NIMROD MEGIDDO


    ABSTRACT. This paper studies the complexity of some approximate solutions

    of linear programming problems with real coefficients.


    #  1. Introduction


    The general linear programming problem is to maximize a linear func-

    over a set defined by linear inequalities and equations. There are many

    eivalent ways to represent instances of the linear programming problem.

    For example, consider the symmetric form


    ```

    Maximize $c^T x$

    Sym($A, b, c$) subject to $Ax \le b$

    $x \ge 0$.

    ```


    The dual is then


    ```

    Minimize $b^T y$

    subject to $A^T y \ge c$

    $y \ge 0$.

    ```


    Intuitively, two representations are equivalent if there is an easy way to

    transform solutions of one to solutions of the other and vice versa. First, any
    set of linear

    inequalities and linear equations can be reduced to a set of linear equations

    with nonnegativity constraints or to a set of linear inequality and nonnegativitve

    conststraints. Also, any linear programming problem can be reduced to a linear

    programming problem with a nonempty set of solutions by using artificial

    variables. Moreover, any linear programming problem can be reduced to

    finding of finding a solution to a system of linear inequalities (by combining

    the constraints of the primal and dual and adding the inequality $c^T x \ge b^T
    y$) Primary 90C05.'
