  md: "# I. I. DIKIN'S CONVERGENCE RESULT FOR THE AFFINE-SCALING ALGORITHM\n\nAcknowledgment.\
    \ We would like to thank Mike Todd for several stimulating discussions. In particular,\
    \ he pointed out the appropriate argument to show that $(AD_x^T A^T)^{-1}$ is\
    \ bounded.\n\n# 2. The main convergence result\n\nIn this section, we describe\
    \ the basic affine-scaling algorithm studied by Dikin. The primal linear program\
    \ is\n\n```\nmin c · x\nAx = b\nx \\geq= 0.\n```\n\nThe associated dual linear\
    \ program is\n\n```\nmax b · w\nA^T w \\leq= c.\n```\n\nWe begin by introducing\
    \ some notation. Let $\\Omega = \\{x \\in R^n: Ax=b, x \\geq 0\\}$ denote the\
    \ polytope for the primal problem; let $\\Omega^0 = \\{x \\in \\Omega: x > 0\\\
    }$ denote the relative interior of $\\Omega$; and let $\\partial\\Omega = \\Omega\
    \ - \\Omega^0$ denote the boundary of $\\Omega$. Finally, given a vector $x$,\
    \ let $D_x$ denote the diagonal matrix having the components of $x$ along its\
    \ diagonal.\n\nThe motivation behind the affine-scaling algorithm can be found\
    \ in many papers (e.g., [13]). Therefore, in this paper we assume that the reader\
    \ has seen the motivation and we go straight to the definition of the algorithm.\
    \ For this, we need to introduce three important functions. The first function\
    \ $w:\\ \\Omega^0 \\rightarrow R^m$ associates with each $x \\in \\Omega^0$ a\
    \ vector of dual variables:\n\n```\nw(x) = (AD_x^T A^T)^{-1} AD_x^2 c.\n```\n\n\
    The second function $r:\\Omega^0 \\rightarrow R^m$ represents the slackness in\
    \ the inequality constraints of the dual problem:\n that $w(x)$ is dual feasible\
    \ if and only if $r(x) \\geq 0$. The vector $r(x)$ is called the vector of reduced\
    \ costs. The third function $y:\\Omega^0 \\rightarrow R^n$ is given by\n\n```\n\
    (1) y(x) = x - D_x^2(x)/|D_x r(x)|\n```\n\nThe affine-scaling algorithm is defined\
    \ in the function of y:\n\n```\nx^{k+1} = {y(x^k), x^k \\in \\Omega^0; x^k, x^k\
    \ \\in \\partial\\Omega\\}.\n```\n\nThe algorithm also generates a sequence of\
    \ dual variables\n\n```\nw^k = {w(x^k), x^k \\in \\Omega^0; w^{k-1}, x^{k-1} \\\
    in \\partial\\Omega\\}.\n```"
