  md: "# # An Interior Point Algorithm for Solving Smooth Convex Programs Based on\
    \ Newton's Method\n\nSANJAY MEHOTRA AND JIE SUN\n\nABSTRACT. An interior point\
    \ algorithm for smooth convex programming is developed. The seminorms defined\
    \ by Hessians of the functions in the problem are assumed to be equivalent to\
    \ the feasible set. The algorithm constructs a sequence of nested convex sets\
    \ within the feasible region and finds approximate centers of these sets by a\
    \ partial Newton step. We show that starting from a point near the center of the\
    \ first set the difference of the optimal value and its iterative bound is reduced\
    \ by a constant rate at each iteration. This rate depends on the number of constraints\
    \ and curvature constant.\n\n# ## 1. Introduction\n\nWe consider the convex programming\
    \ problem\n\n(CP) $\text{maximize } c(x)$\n$\text{subject to } c_i(x) \\geq 0,\
    \ \\quad i = 1, 2, \\dots, m,$\n\nwhere $x \\in \\mathbb{R}^n, c(x), c_i(x), i\
    \ = 1, \\dots, m,$ are concave and continuously differentiable. The optimal objective\
    \ value of (CP) is denoted by $z^*$. Let $z$ be a lower bound on the optimal objective\
    \ value of (CP) and let\n\n(1.1.1) $P_z = \\{x \\in \\mathbb{R}^n | c(x) \\geq\
    \ z, c_i(x) \\geq 0, i = 1, 2, \\dots, m\\}$\n\nthe convex set obtained by restricting\
    \ the feasible region of (CP) with an additional constraint $c(x) \\geq z$, where\
    \ $z$ is a parameter satisfying $z \\leq z < z^*$. We assume that the int $P_z\
    \ = \\{x \\in \\mathbb{R}^n | c(x) > z, c_i(x) > 0, i = 1, \\dots, m\\}$ is nonempty\
    \ and bounded for $z < z^*$. By convex analysis, the assumption is then true for\
    \ all $z < z^*$. Since $P_z$ is bounded,\n\n1980 Mathematics Subject Classification\
    \ (1985 Revision). Primary 90C20.\nKey words and phrases: convex programming,\
    \ interior point methods, path-following methods.\nResearch of the first author\
    \ was supported in part by the ONR under grant N00014-87-K-0214 and by the NSF\
    \ under grant CCR-8810107.\nResearch of the second author was supported in part\
    \ by the NSF under grant ECS-8721709."
