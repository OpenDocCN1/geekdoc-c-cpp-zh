    We next briefly describe the projective scaling method. We refer to [14] for a
    more detailed discussion of the projective scaling method as described below.
    Given a point $x\in W_t$, the projective scaling algorithm assigns $x$ to a search
    direction as follows:


    ```

    (2.1) \quad \xi(x)=[I-xx^T][I-XA^T(AX^TA)^{-1}AX]Xc

