    # 1. Systems of linear inequalities and equations


    Consider a system of $n$ linear inequalities and $l$ linear equations in $R^m$:


    ```

    $(1.1) \quad A^T u \le b, \quad u \in R^m,\nquad E^T u = f,$$

    ```


    Here $A$ denotes an $m \times n$ matrix, $E$ an $m \times l$ matrix, while $b$
    and $f$ are column vectors of $n$ and $l$ components, respectively.


    Constraints that are either equations in the first place, or are inequalities
    that are binding for all feasible solutions, will be called


    ```

    (1.2) \quad tight

    ```


    within a solvable constraint system (1.1). The relative interior of the solution
    polyhedron consists of all the feasible points $u$ for which tight inequalities
    are nonbinding, that is, for which all


    ```

    (1.3) \quad residuals_i(u) = b_i - A_i^T u

    ```


    of tonight inequalities are positive. It is clear that replacing tight inequalities
    (1.2) by their corresponding equations in system (1.1) does not alter the solution
    set. We call this modification


    ```

    (1.4) \quad regularization.

    ```


    In a regularized system, none of the inequalities $A_G^T u \le b_G$, are tight.
    Note that only solvable systems can be regularized, as otherwise tightness is
    not defined. Thus solvability is understood whenever we refer to regularized systems.


    Each face $F$ of the solution polyhedron consists of the solutions to the


    ```

    (1.5) \quad face system: \quad A_G^T u \le b_G, \quad A_F^T u = b_F, \quad E^T
    u = f,

    ```


    which arises from the original system by replacing the inequalities that are binding
    for all points in $F$ by their corresponding equations. In (1.5), we denote the
    matrix and right-hand sides of the remaining inequalities by $A_G$ and $b_G$,
    respectively. Similarly, $A_F$ and $b_F$ represent the equations that were inequalities
    previously. Each such face system is automatically regularized (1.4).'
