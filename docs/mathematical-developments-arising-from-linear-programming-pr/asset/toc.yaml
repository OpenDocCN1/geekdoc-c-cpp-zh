  - 引理 3.1. 令 $x^*$ 为 FLP 的极大最优。那么 $\{A_j | j \in \alpha(s^*)\} = \{A_j | j \in \beta(x^*)\}$。
- - '##'
  - 定理 3.2. 假设 $x^* \to x^{**}$，其中 $x^*$ 是 FLP 的极大最优。对于 $u$ 和 $u^*$，存在 $k(u)$ 对于所有
    $k \in \mathcal{K}, k \ge k(u)$。对于 $u \in \mathbb{R}^m$，存在唯一的分解 $u = u^* + v(u)
    + w(u)$，其中 $v(u) \in V^*$，且 $w(u) \perp u^*$。当且当 $w(u) = 0$，$u = u^*$。如果 $u^k
    \in \mathcal{U}$ 趋于 $u^*$，则有 $w(u^k) \to 0$ 且 $x^k \to x^*$。由于 $V^* = \{A_j |
    j \in \alpha(s^*)\}$,存在 $A_j \in \beta(x^*)$ 使得大的 $k \in \mathcal{K}$，$A_j^T(u^k
    - u^*)$ 离零界。但 $x_j^k$ 也离零界且 $\epsilon_k \to 0$，因此 (3.2) 对于大的 $k \in \mathcal{K},u^k
    \in U^*$。证毕。
