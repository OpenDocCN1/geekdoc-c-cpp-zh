    For parsing one of our grammars, we first need a parser combinator for choice,
    i.e. a function that takes two parsers as arguments and returns a new parser that
    recognizes everything that one of the parsers recognizes. It is called <|>. Here
    are its fixity declaration and definition:


    ```

    infix r4 <|>

    (<|) :: Parser a b -> Parser a b -> Parser a b

    (p1 <| p2) xs = p1 xs ++ p2 xs

    ```


    For example, the rule VP -> smiled | might correspond to the following parser:


    ```

    vp = token "smiled" -> token "laughed"

    ```


    Next, what to do with rules like S -> NP VP? Intuitively, we want to parse an
    NP, then parse a VP, and finally combine the results. That is, we want a parser
    combinator <-> for sequential composition, such that a parser for the grammar
    rule S -> NP VP could simply be s = np <-> vp, with np parser for NPs and vp parser
    for VPs. This is a general definition of this parser combinator:


    ```

    (p <-> q) xs = [ (combine r1 r2,zs) | (r1,ys) <- p xs, (r2,zs) <- q ys ]

    ```


    That is, the new parser (p <-> q) first applies p to the input. This returns a
    result r1 and a remainder. Then q is applied to this remainder. A returns a remainder
    and a result. Finally, (p <-> q) returns that second remainder, zs, and a combination
    of the two results r1 and r2 depends on how we define our parse objects. For example,
    if we simply take them to be strings, we can use (++) for combining r1 and r2.
    The definition of <*> works then be:


    ```

    (<*) :: Parser a [b] -> Parser a [b] -> Parser a [b]

    (p <*> q) xs = [ (r1 ++ r2,zs) | (r1,ys) <- p xs, (r2,zs) <- q ys ]

    ```'
