    Let us look at some simple parsers which will be the building blocks for more
    complex parsers which can handle context-free grammar rules.


    Two very elementary parsers are the parsers that always succeed or always fail,
    respectively.


    ```

    succeed :: b -> Parser a b

    succeed r xs = [(r,xs)]

    ```


    ```

    fail :: Parser a b

    fail xs = []

    ```


    The parser succeed does not consume any input, and it always returns a given,
    fixed result r. The parser fail also does not consume any input, but it always
    fails. Since parser failure corresponds to an empty list of parsers, the result
    of fail is the empty list. These parsers may look very interesting, but the point
    of having them is to use them as ingredients for more interesting parsers. Here
    is a parser for recognizing individual symbols c.


    ```

    symbol :: Eq a => -> Parser a a

    symbol c [] = []

    symbol c (x:xs) | c == x = [(x,xs)] | otherwise = []

    ```


