    Often we leave out type information. The definition of the language then looks\
    \ like this:\n\n```\nexpression ::= constant\n               | variable\n    \
    \           | ($\\lambda$ variable $\\mapsto$ expression)\n               | (expression)\n\
    ```\n\nA model $M$ for typed logic consists of a domain $D_e$ together with an\
    \ interpretation function $I$ which maps every constant of the language to the\
    \ function of the appropriate type in the domain hierarchy by $D_e$. A variable\
    \ assignment $g$ for typed logic maps every variable of the language to the function\
    \ of the appropriate type in the domain. The semantics for the language is given\
    \ by defining a function $[\\cdot]_g^M$ which maps every expression of the language\
    \ to a function of the appropriate type.\n\n+   [constant]_g^M = I(\text{constant})$\n\
    $[variable]_g^M = g(\text{variable})$\n$[\\lambda v_{\tau_1} \\mapsto E_{\tau_2}]_g^M\
    \ = h,\nwhere $h: D_{\tau_1} \rightarrow D_{\tau_2}$ is the function given by\
    \ $\\lambda d \\mapsto [E]_g^{[v=d]}$\n\n**Exercise 7.14** Assume Give$(a, b,\
    \ c)$ gives type $b$ to $c$. What do the following expressions say?\n\n+   (1)\
