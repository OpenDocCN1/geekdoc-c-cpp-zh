  md: 'data Term = Const String | Var Int deriving (Eq,Ord)


    The generalized quantifiers are:


    ```

    data GQ = Sm | All | Th | Most | Many | Few

    deriving (Eq,Show,Ord)

    ```


    An abstract is an LF representation of a lambda term.


    ```

    data Abstract = MkAbstract Int LF deriving (Eq,Ord)

    ```


    Abstracts occur in the logical forms for quantifications. A quantification consists
    of a generalized quantifier and two abstracts, one for the restriction of the
    quantifier and one for its body.


    ```

    data LF = Rel String [Term]

    | Eq Term Term

    | Neg LF

    | Impl LF

    | Equi LF

    | Conj [LF]

    | Disj [LF]

    | Qt Abstract Abstract

    nderiving (Eq,Ord)

    ```


    It is convenient to define show functions for these data types:


    ```

    instance Show Term where

    show (Const name) = name

    show (Var i) = ''x'': show i

    ```


    ```

    instance Show Abstract where

    show (MkAbstract i lf) =

    "(\\ x" ++ show i ++ " " ++ show lf ++ " ")

    ```'
