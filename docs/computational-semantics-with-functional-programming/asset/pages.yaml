    ```


    Here $m$ is an $M$ continuation and $n$ is an $N$ continuation. You can understand
    the rule as follows: in order to evaluate the evaluation of $M$ to $N$, first
    evaluate $N$ and bind the result to the variable $n$, then evaluate $M$ and bind
    the result to the variable $m$, finally apply $m$ to $n$ and pass the result to
    the continuation $k$.


    This illustrates the three general ingredients of CPS transformation: name all
    intermediate results, sequence the evaluations, and introduce continuations as
    an extra parameter.


    This CPS transformation results in the fixed evaluation order of first evaluating
    $N$ and then evaluating $M$. To illustrate how this comes about, let us consider
    the following pseudo program consisting of only two instructions:


    ```

    $$(4+2); square 6

    ```


    In principle, a compiler would decide in which order to evaluate these two instructions.
    Whichever it chooses, the result will be the same. However, this is different
    if we introduce a dependency:


    ```

    $x=4+2; square x

    ```


    Here the evaluation of the square function depends on the successful evaluation
    of the variable assignment. Because of this dependency the compiler is forced
    to evaluate the two instructions in order. A similar thing happens with a CPS
    transformation: when we name the intermediate results and sequence them, we introduce
    a dependency that forces the function that has to be called next to have a certain
    order of evaluation.


    You can also think of the continuation as the function that has to be called next
    with the result of the actual evaluation. In this function application rule, the
    continuation of $N$ is the term $\lambda n \mapsto \bar{M} (\lambda m \mapsto
    k (m))$. This function constructs what to do next after evaluating $N$. Since
    it contains the evaluation of $M$, we fixed the order of first evaluating $N$
    and then evaluating $M$.


    However, be aware that the evaluation order should not be confused with the order
    of reductions when reducing a lambda term. When we apply the rule above to terms
    $M$ and $N$, it does not matter at all, which parts of the expression we reduce
    first. But although all possibilities will reduce to the same result, this will
    mimic the order of having evaluated $N$ before having evaluated $M$.


