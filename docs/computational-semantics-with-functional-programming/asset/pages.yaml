    means of the following global principles (also called Gricean Maxims):


    **Cooperation** Try to adjust every contribution to the spoken communication to
    what is perceived as the common goal of the communication to that point in the
    interaction.


    **Quality** Aspire to truth. Do not say anything that you do not believe to be
    true. Do not say anything for which you have inadequate support.


    **Quantity** Be as explicit as the situation requires, no more, no less.


    **Mode of Expression** Don''t obscure, don''t be ambiguous, aspire to conciseness
    and clarity.


