  md: "# 11.2 Continuations as Abstractions over Context\n\nr as being type t. For\
    \ example, starting from no lifted NP of type e, an NP-continuation is of type\
    \ e $\rightarrow$ t. The continuation of an intransitive verb is of type $(e \\\
    rightarrow t)$ $\rightarrow$ t, and the continuation of the transitive verb is\
    \ of type $(e \\rightarrow e \\rightarrow t)$ $\rightarrow$ t. This might seem\
    \ a natural choice, but it is neither the only one that makes sense for the analysis\
    \ of natural language. We will see other useful examples of result types in this\
    \ chapter and also in the course of the next chapter.\n\nWe specified the denotation\
    \ of expression as a function from the continuation of expression to the result\
    \ type t. We will call such functions from continuations to result values computations.\
    \ For example, the meaning of Alice, $\\lambda P \\rightarrow (P a)$, is the computation\
    \ of Alice. This computation tells us what role the sub-expression Alice plays\
    \ in the expression, i.e. what is going to be done with when computing the meaning\
    \ of the whole expression (in this case it is plugged into a VP-meaning). Under\
    \ this view, a continuation is an instruction of what to do.\n\nHere are general\
    \ type synonyms in Haskell, for continuations (functions from values to a type\
    \ r), and for computations (functions from continuations to the type r):\n\n```\n\
    type Cont a r = a -> r\ntype Comp a r = Cont a -> r\n```\n\nAs already mentioned,\
    \ we assume that r is our sentence type t, so in the implementation we will only\
    \ work with continuation types Cont a Bool. Here is a list of examples:\n\n| category\
    \ | value type | continuation type | computation type |\n| NP | $e$ | $e \\rightarrow\
    \ t$ | $(e \\rightarrow t) \\rightarrow t$ |\n| IV, CN | $e \\rightarrow t$ |\
    \ $(e \\rightarrow t) \\rightarrow t$ | $((e \\rightarrow t) \\rightarrow t) \\\
    rightarrow t$ |\n| TV | $e \\rightarrow t$ | $(e \\rightarrow e \\rightarrow t)\
    \ \\rightarrow t$ | $((e \\rightarrow e \\rightarrow t) \\rightarrow t) \\rightarrow\
    \ t$ |\n\nThis schema applies to every type.\n\n**Exercise 11.2** What are the\
    \ continuation and computation types for adjectives of $(e \\rightarrow t) \\\
    rightarrow (e \\rightarrow t)$?\n\nNow we will turn to systematically lifting\
    \ the denotation of expressions from the type they had in Chapter 7 to the type\
    \ of a computation. The resulting semantics is called *continuation passing style\
    \ semantics*, because during the whole computation we will keep passing continuations\
    \ around. The lifting is called *continuation passing style transformation*, or\
    \ CPS transformation for short. There are several different possibilities to perform\
    \ this lift. We will pick a particularly simple one (e.g. used in [Bar02],[Bar04])."
