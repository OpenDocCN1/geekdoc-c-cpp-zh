  md: '# Formal Study of Natural Language


    # 1.4 Natural Languages and Formal Languages


    English, Swedish, Russian, and Hindi are natural languages. The language of primary
    school arithmetic, the language of propositional logic, and the programming language
    Haskell are formal languages. But the distinction is not absolute, since we can
    find cases between, like Esperanto. In order to see whether we can draw a dividing
    line, let us look at some crucial design features of human languages.


    +   * Duality of patterning (or double articulation): The construction of linguistic
    content can be analyzed on two structural levels. One is the level containing
    the smallest meaningful units of language: morphemes or words, like cat. However,
    they are not minimal but on another level made of a small set of speech sounds,
    so-called phonemes. These do not carry a meaning themselves but only differentiate
    meaningful units, e.g. /k/ and /m/, which distinguish cat and mat.


    +   * Recursion: Structural patterns in sentences or phrases can repeat themselves.
    A common noun bird can be modified to a complex noun green bird, which can be
    modified again, to form small green bird, and again, to form beautiful small green
    bird.


    +   * Contextuality: What a phrase or sentence means is determined in part by
    the context in which the phrase is used.


    **Exercise 1.2** Pollard and Sag, in their textbook [PS94], give the following
    example of the use of recursion to extend sentences:


    +   * Sentences can go on.

    * Sentences can go on and on.

    * Sentences can go on and on and on.

    * Sentences can go on and on and on and so on.

    * ...


    Can you give a concise description of this recursion pattern?


    **Exercise 1.3** Does it follow from the example in Exercise 1.2 that there are
    infinitely many English sentences? Or does it follow that English sentences can
    have infinite length? Or both?


    The properties of duality of patterning, recursion, and contextuality set human
    languages apart from communicative systems of animals, such as bee dancing. They
    are responsible for the creative economy of language, because they allow us to
    build and understand infinitely many sentences using only finitely many sounds
    and rules – a precondition for enabling children to learn language as quickly
    and easily as they do.


    Another key when talking about properties of human languages is compositionality.
    The so-called principle of compositionality will concern us a lot in what'
