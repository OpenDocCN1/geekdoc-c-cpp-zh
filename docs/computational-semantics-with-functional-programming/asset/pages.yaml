  md: "# Formal Semantics for Fragments\n\nthe universal negative *implies* the individual\
    \ negative *not all*. The universal and individual affirmative quantifiers are\
    \ said to be of types **A** and **I**, respectively, from Latin *Affermo*, the\
    \ universal and individual negative quantifiers of type **E** and **O**, from\
    \ Latin *NegO*. The medieval mnemonics in the Aristotelian syllisms derive from\
    \ these abbreviations: Barbara is the name of the syllogism with universal affirmative\
    \ premises and a universal affirmative conclusion, and so on.\n\nOur application\
    \ will be a slight extension of Aristotelian logic, for we consider the case where\
    \ there is a whole knowledge base of possible premises, instead of just two. Our\
    \ knowledge base will be as simple as it can get. The relations we are going to\
    \ model in the knowledge base are that of inclusion **C** and of non-inclusion\
    \ **L**.\n\n+   * All A are B expressed by inclusion, as $A \\subseteq B$.\n*\
    \ No A is B expressed by inclusion in the complement, as $A \\subseteq \bar{B}$.\n\
    * Some A are not B expressed by non-inclusion, as $A \not\\subseteq B$.\n* Some\
    \ A is B expressed by non-inclusion in the complement, as $A \not\\subseteq \b\
    ar{B}$. That this is equivalent to $A \\cap \bar{B} \neq \\emptyset$.\n\nA knowledge\
    \ base is a list of triples\n\n(Class1, Class2, Boolean)\n\nwhere $(A, B, \text{True})$\
    \ expresses $A \\subseteq B$, and $(A, B, \text{False})$ expresses $A \not\\subseteq\
    \ B$.\n\nThe rules of the inference engine are the following. Let $\tilde{A}$\
    \ be given by: if $A$ is of the form $\bar{C}$, then $A = C$, otherwise $\tilde{A}\
    \ = \bar{A}$. Let $A \\implies B$ express $A \\subseteq B$. That is, $\\implies$\
    \ is a syntactic symbol that is semantically interpreted as the subset relation.\
    \ One of the rules we will reverse the direction of the arrow and write $A \\\
    Rightarrow B$ as $B \\Leftarrow$. Let $A \neq B$ express $A \not\\subseteq B$.\n\
    \nComputing the sub-subset relation from a knowledge base **K** is done with the\
    \ following:\n\n| $(A, B, \top) \\in \\mathbf{K}$ | $A \\Rightarrow B$ | $A \\\
    Rightarrow B$ | $B \\Rightarrow C$ |\n| --- | --- | --- | --- |\n| $A \\Leftarrow\
    \ B$ | $\tilde{B} \\Leftarrow \tilde{A}$ | $A \\Leftarrow C$ | |\n\nComputing\
    \ the non-subset relation from the knowledge base is done:\n\n| $(A, B, \bot)\
    \ \\in \\mathbf{K}$ | $A \\Rightarrow B$ | $A \\Leftarrow B$ | $B \\Rightarrow\
    \ C$ | $C \\Rightarrow D$ |\n| --- | --- | --- | --- | --- |\n| $A \\Leftarrow\
    \ B$ | $\tilde{B} \\Leftarrow \tilde{A}$ | $A \\Leftarrow D$ | |\n\nNext we need\
    \ an axiom (a rule without a premise) to express reflexivity of $\\subseteq$.\n\
    \n```\n$A \\Rightarrow A$\n```"
