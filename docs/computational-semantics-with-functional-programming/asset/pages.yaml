  md: "# The Composition of Meaning in Natural Language\n\n# 7.7 Handling Ambiguity\n\
    \nIt is illuminating to examine the notion of *ambiguity* for fragments of natural\
    \ language with a compositional semantics. If a natural language expression *E*\
    \ is ambiguous, i.e. if *E* has several distinct meanings, then, under the assumption\
    \ that these meanings are arrived at in a compositional way, there are three possible\
    \ sources for the ambiguity (combinations are possible, or course):\n\n+   (1)\
    \ The ambiguity is lexical: *E* contains a word with several distinct meanings.\
    \ An example is a *splendid ball.*\n\n+   (2) The ambiguity is structural: *E*\
    \ can be assigned several distinct syntactic structures. Examples are old *[men\
    \ and women]* versus *[old men and women]*, or: the boy saw *[the girl with the\
    \ binoculars]* versus *the boy saw the [girl] [with the binoculars].*\n\n+   (3)\
    \ The ambiguity is derivational: the syntactic structure that *E* can be derived\
    \ in more than one way. An example is the sentence *Every prince sang ballad.*\
    \ It is not structurally ambiguous, but in order to account for the $\\exists$\
    \ reading one might want to assume that one of the ways in which the structure\
    \ can be derived by combining some ballad with the complex expression every prince\
    \ sang.\n\nLexical ambiguities can be handled in ours by multiplying lexical entries.\
    \ The two meanings of *ball* give rise to different translations:\n\nCN $\rightarrow$\
    \ ball $[CN]$ $\rightarrow$ $(\\lambda x \\mapsto (Ball_1 x))$\nCN $\rightarrow$\
    \ ball $[CN]$ $\rightarrow$ $(\\lambda x \\mapsto (Ball_2 x))$\n\nIf we use these\
    \ translations, then lexical ambiguity shows up in the fact that The *ball* was\
    \ *nice* will receive two parses, each with its own translation. An alternative\
    \ approach would be to allow ambiguities in the logical representation language,\
    \ by allowing ambiguous translations as the following:\n\nCN $\rightarrow$ ball\
    \ $[CN]$ $\rightarrow$ $(\\lambda x \\mapsto (\\{Ball_1 x, Ball_2 x\\}))$\n\n\
    To work this out, such ambiguous translations would course be given a clear meaning,\
    \ for otherwise the translation would fail to count as a specification of the\
    \ semantics.\n\nA correct handling of structural ambiguities would fall out of\
    \ the matching between syntax and semantics. You already looked at the syntax\
    \ in Exercise 4.8 on page 69. We asked you to extend the fragment such that it\
    \ can handle the structurally ambiguous sentence *A dwarf defeated a giant with\
    \ a sword.* The next exercise will get acquaint you with the semantic handling\
    \ of this ambiguity.\n\nExercise 7.26 Extend the semantics to match the extended\
    \ fragment from Chapter 4. Hint:"
