    To build a knowledge base we need a function for updating an existing knowledge
    base with a statement. But note that data may be inconsistent. To cater for that
    possibility, we use the Haskell data type Maybe. This data type is useful in cases
    like this, where we are not sure whether a function is successful. If the function
    is successful, we want an updated knowledge base. If it is not, we want to get
    an indicator of failure. The Maybe data type gives us this. It is defined in the
    Standard Prelude as


    ```

    data Maybe a = Nothing | Just a

    ```


    The following definition of the update function illustrates its use. The update
    function checks for possible inconsistencies. E.g. a request to add an A ⊆ B to
    the knowledge base leads to an inconsistency if A ⊈ B is already derivable.


    ```

    update :: Statement -> KB -> Maybe (KB,Bool)

    nupdate (All as bs) kb

    | bs ''elem'' (supersets as kb) = Nothing

    | bs ''elem'' (supersets as kb) = Just (kb,False)

    | otherwise = Just ((as,bs,True):kb),True

    ```


    A request to add A ⊆ B leads to an inconsistency if A ⊈ B is already derivable.'
