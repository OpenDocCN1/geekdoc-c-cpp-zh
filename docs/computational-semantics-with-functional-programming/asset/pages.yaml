    \ data type. This\nwill make the system easier to use and modify, at the cost\
    \ of making feature coding\nerrors slightly more difficult to detect (at least\
    \ they will not be caught by the type\nchecking).\n\n```\ndata Feat = Masc | Fem\
    \ | Neutr | MascOrFem\n               | Sg | P1\n               | Fst | Snd |\
    \ Thrd\n               | Nom | AccDat\n               | Pers | Refl | Wh\n   \
    \            | True | Infl\n               | On | With | By | To | From\ndereriving\
    \ (Eq,Show,Ord).\n```\n\nDeclare the type Agreement as a list of features:\n\n\
    type Agreement = [Feat]\n\nThe following picks out the gender, number, person,\
    \ case, pronoun\ntype, tense, and preposition features, respectively:\n\n```\n\
    gender, number, person, gcase, pronType, tense, prepType\n:: Agreement -> Agreement\n\
    gender  = filter 'elem' [MascOrFem,Masc,Fem,Neutr]\nnumber = filter 'elem' [Sg,Pl1]\n\
    person = filter 'elem' [Fst,Snd,Thrd]\ngcase  = filter 'elem' [Nom,AccDat]\npronType\
    \ = filter 'elem' [Pers,Ref1,Wh]\ntense   = filter 'elem' [Tense,Infl]\nprepType\
    \ = filter 'elem' [On,With,By,To,From]\n```\n\nTwo features of the same type clash,\
    \ except in the case of MascOrFem\nversus Masc or Fem. The following function\
    \ removes the MascOrFem feature if\nnecessary. This will ensure that MascOrFem\
    \ expresses the disjunction of Masc and\nFem: it will clash with Neut but not\
    \ with Masc or Fem (in the latter, it is\ninstead replaced by Masc or Fem, respectively)."
