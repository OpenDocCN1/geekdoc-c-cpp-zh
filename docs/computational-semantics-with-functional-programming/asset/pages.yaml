  md: '# 5.7 An Inference Engine with a Natural Language Interface


    (384 BC–322 BC). In his theory of the syllogism Aristotle studied the following

    inferential pattern:


    ```

    Quantifier$_1$ CN$_1$ VP$_1$

    Quantifier$_2$ CN$_2$ VP$_2$

    Quantifier$_3$ CN$_3$ VP$_3$

    ```


    An example is the valid syllogism BARBARA:


    ```

    All A are B

    All B are C

    All A are C

    ```


    Syllogistic theory focusses on the quantifiers in the so called Square of Opposition;
    see Figure 5.1.


    Fig. 5.1. The Square of Opposition


    ![](img/27863720c158bdd744a04cbf0ba9e2de_123_0.png)


    The quantifiers in the square express relations between a first and a second argument.
    Both arguments denote sets of entities taken from some domain of discourse. The
    quantified expressions in the square are related across the diagonals by external
    (sentential) negation, and across the horizontal edges by internal (or verb phrase)
    negation. It follows that the relation is internal plus external negation; this
    is the relation of so-called duality. Because Aristotle assumes that the domain
    of discourse is non-empty, the two quantified expressions on the top edge of the
    square cannot both be true; these expressions are called contraries. Similarly,
    the two quantified expressions on the bottom edge cannot both be false; they are
    so-called subcontraries. Next, Aristotle interprets quantifiers with existential
    import: All A are B and No A are B are taken to imply that there are A. Under
    this assumption, the quantified expressions at the top edge of the square imply
    those immediately below them. The universal affirmative quantifier all implies
    the individual affirmative some and'
