  md: "# 12.7 Implementing Reference Resolution\n\n# New Utility Functions\n\nWe define\
    \ two utility functions. The first one is lookupIdx', that looks up an index to\
    \ retrieve an entity, where lookupIdx' c is the implementation of c[*i].\n\n```\n\
    lookupIdx' :: Context' -> Idx -> Entity\nlookupIdx' ([],co) j = error \"undefined\
    \ context item\"\nlookupIdx' ((i,x):xs,co) j | i == j\n                      \
    \    | otherwise = lookupIdx' (xs,co) j\n```\n\nThe second one is an adjust, that\
    \ adjusts the context by putting a discourse up front, which permits the solace\
    \ ordering.\n\n```\nadjust :: (Idx,Entity) -> Context' -> Context'\nadjust (i,x)\
    \ (c,co) c = ((i,x):(filter (/=(i,x)) c)),co)\n  | elem (i,x) c\n  | otherwise\
    \ = error \"item not found in context\"\n```\n\nHere is a new version of extend:\n\
    \n```\nextend' :: Context' -> Entity -> Context'\nextend' = \\ (c,co) e -> let\
    \ i = length c in ((i,e):co)\n```\n\nThe following function success if a given\
    \ transition is possible from some context.\n\n```\nsuccess :: Context' -> Trans'\
    \ -> Bool\nsuccess = \\ c phi -> phi True /= []\n```\n\nNow we define a function\
    \ cutoff cs i, that cuts off context elements in the list of contexts with index\
    \ ≥ i. This is the implementation of [i] C, the operation used to cut all contexts\
    \ in C down to size i. The constraints that employ indices ≥ i are removed."
