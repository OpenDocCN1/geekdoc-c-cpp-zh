    # 13.8 Further Reading


    Textbooks on epistemic logic [FHMV95] and the more recent [DvdHK07]. Dynamic epistemic
    logic not only analyses knowledge but also the epistemic effects of communication.
    A key paper is [BM598]. An elegant version of a very dynamic epistemic logic can
    be found in [BVE06]. Dynamic epistemic modelling is the art of computing the effects
    of epistemic updates. A tool for this, implemented in Haskell, is DEMO; see [Ei07a]
    for documentation.


    An illuminating analysis of the role of social rituals in the creation of common
    knowledge is Chwe''s Rational Ritual [Chw01]. Discourses on Social Software [EV09]
    gives many examples of the role of (common) knowledge in social interaction.


    The analysis of presupposition in terms of common knowledge is based on [EU07],
    and the analysis of questions and appropriateness of answers was inspired by [UG08].'
