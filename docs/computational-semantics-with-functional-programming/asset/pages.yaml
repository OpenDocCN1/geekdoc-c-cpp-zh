    # Handling Relations and Scoping


    # Summary


    In this chapter we will interpret verb phrases as relations of various arities,
    using a type of arbitrary arity relations. The problem of encoding relations in
    type theory in such a way that the usual logical operations can be applied to
    them (relations should be ''conjoinable'', as the jargon has it) has been studied
    extensively in the semantic literature. We will define conjunction, disjunction,
    and complementation on our relational types. We next turn to the interpretation
    of determiner phrases as functions from (n+1)-ary relations to n-ary relations,
    the interpretation of n-ary sequences of determiner phrases as functions from
    (n+m)-ary relations to n-ary relations, and to the handling of scope reversal
    for such functions.


    # 10.1 Interpreting NP Lists


    Instead of analysing the sentence Every unicorn ate a lettuce leaf as a relation
    between the CN property of being a unicorn and the VP property of eating lettuce
    leaves (namely the relation of inclusion), it is also possible to look at the
    complex expression Every unicorn — a lettuce leaf, and interpret that as a function
    that takes a relation (a denote of a transitive verb) and produces a truth value.
    Similarly, Every unicorn was fed a lettuce leaf may be analysed as stating the
    set of unicorns is included in the set of entities that were fed a lettuce leaf
    by some fairy, it is also possible to look at the complex expression Every unicorn
    — a lettuce leaf by some fairy, and even at Every unicorn — a lettuce leaf some
    fairy. The interpretation of Every unicorn — a lettuce leaf by some fairy is again
    a function from binary relations to truth values, the interpretation of Every
    unicorn — a lettuce leaf — some fairy is a function from ternary relations to
    truth values.


    Following Keenan [Kee92] we call a function from properties (unary relations)
    to truth values a type ⟨1⟩ function, a function from binary relations to truth
    values'
