  md: "# Formal Syntax for Fragments\n\n# 4.4 Propositional Logic\n\nOur next example\
    \ is a grammar for propositional logic, where we use\n\n$p, q, r, p', q', r',\
    \ p'', q'', r'', \\dots$\n\nto indicate atomic propositions.\n\n```\natom $\t\
    o$ p | q | r | atom'\nF $\to$ atom | $\neg$F (F $\\wedge$ F) | (F $\\vee$ F)\n\
    ```\n\nHere $\neg$ is the symbol for not, $\\wedge$ the symbol for and, and $\\\
    vee$ the symbol for or. Some formulas generated by this grammar are $\neg\neg\
    \ p''$, $((p \\vee p') \\wedge p'')$, and $(p \\wedge (p' \\wedge p''))$. The\
    \ brackets force unique readability. Without brackets, we wouldn't know whether\
    \ to read $p \\wedge p'$ as\n\nor as\n\n![](img/27863720c158bdd744a04cbf0ba9e2de_88_0.png)\n\
    \nThis structural ambiguity affects the meaning, just as for the English sentence\
    \ *She was young and beautiful or depraved*. The formal definition of the language\
    \ of propositional logic makes it possible to reason about the properties of the\
    \ language in a formal way. For this we use the following principle:\n\n**Theorem\
    \ 4.1 (Principle of Structural Induction)** Every formula of propositional logic\
    \ has property $P$ provided\n\n**Basic step:** Every atom has property $P$.\n\n\
    **Induction step:** If $F$ has property $P$, then so does $\neg F$; if $F_1$ and\
    \ $F_2$ have property $P$, then so does $(F_1 \\wedge F_2)$ and $(F_1 \\vee F_2)$.\n\
    \nTo see this, let $P'$ be the set of all propositional formulas with property\
    \ $P$. Then the basic step and the induction step together ensure that all propositional\
    \ formulas are members of $P'$. But this means that every propositional formula\
    \ has property $P$.\n\nThis can be used as follows:\n\n**Proposition 4.2** Every\
    \ propositional formula has equal numbers of left and right parentheses."
