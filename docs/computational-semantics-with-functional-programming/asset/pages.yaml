    both are appropriate. The first one obviously is: updating with correct negation
    of $f$. This update makes ''Atreyu will not come on his horse'' common knowledge.
    The second answer has the same effect. Since the death of the horse entails that
    Atreyu cannot and will not come on it (i.e. the negation of $f$), answer 2 entails
