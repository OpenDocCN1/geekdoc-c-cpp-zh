  md: 'We will identify these ‘worlds’ as W1 and W2. For purposes of illustration
    we will throw in a third world W3 that is like W2 except for the fact that all
    the girls are princesses.


    ```

    data World = W1 | W2 | W3 deriving (Eq,Show)


    worlds :: [World]

    worlds = [W1,W2,W3]

    ```


    The interpretation of Snow White is different in the three worlds. We see from
    the example that the extensional interpretation of a proper name is of type Entity,
    but the intensional interpretation is a function of type World -> Entity. The
    extensional interpretation of a sentence is of type Bool, but the intensional
    interpretation is of type World -> Bool.


    Types that we will need a lot in what follows are the type World -> Entity of
    individual concepts and the type World -> Bool of propositions. It makes sense
    to introduce abbreviations for these types.


    ```

    type IEntity = World -> Entity

    type IBool = World -> Bool

    ```


    Intensional interpretation replaces the type Entity by World -> Entity (abbreviated
    IEntity) and the type Bool by World -> Bool (abbreviated IBool).


    Here is the definition of our first intensional function. The interpretation of
    Snow White depends on the world we are in. The intensional meaning of the proper
    name has type World -> Entity, or abbreviated IEntity.


    ```

    isSnowWhite :: IEntity

    isSnowWhite W1 = snowWhite''

    isSnowWhite W2 = snowWhite''

    isSnowWhite W3 = snowWhite’

