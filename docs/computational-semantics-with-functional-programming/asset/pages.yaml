    The rule should be implemented in such manner that gaps from outside are passed
    on to the next constituent, never consumed inside the NP. This is in order to
    impose the Complex NP Constraint. So we pass the contents of the incoming stack
    to the output extraction stack.


    ```

    nR :: SPARSER Cat Cat

    R = \ us xs =

    [ (Branch (Cat " "NP" fs []) [det,cn] xs, (us+ws, zs) |

    (det,ys) <- prsDET xs,

    (cn,ws,zs) <- prsCN vs ys,

    fs <- combine (t2c det) (t2c cn),

    agreeC det cn ]

    ```


    Determiner categories are always found on the input list:


    ```

    prsDET :: SPARSER Cat Cat

    prsDET = leafPS "DET"

