    How are reference markers selected? In [Kam81] and in the DRT textbook [KR93],
    the representation construction algorithm simply states ‘take a fresh reference
    marker’, and leaves it at that. The Classic DRT constructions always parses new
    sentences in the context of an existing representation structure. What this means
    is that Classic DRT merges representation structures. Another way of saying this
    is that the semantics of Classic DRT is a kind of continuation semantics: processing
    new discourse is the ‘what to do next’ of continuation.


    We will aim our a bit higher than Classic DRT, by developing a compositional reconstruction.
    Using • for reference marker, a lexical entry for the indefinite determiner *a*
    in DRT might look like this:


    ```

    λPQ → x • Px • Qx.

    ```


    What this says is that an indefinite article *a* gives rise to the introduction
    of a new reference marker *x* to the context, and that this marker *x* is predicated
    both of the restriction *P* and the body *Q* of the determiner. Restriction and
    body are abstracted over the lexical entry. The introduction of the marker is
    merged with the representation for the restriction, and this is in turn merged
    with the representation for the body.


    The lexical entry for *every* structure has a different structure. It uses the
    symbol ⇒ for discourse implication. A precise definition of its meaning will be
    given below.


    ```

    λPQ → (x • Px) ⇒ Qx

    ```


