    +   - neither derive kb query nor derive kb (neg query) is true. This means that
    the knowledge base does not have the answer to query.


    Open queries (''How about A?) are slightly more complicated. We should take care
    to select the most natural statements to report on a class:


    +   - A ⊆ B is expressed with ''all''.

    - A ⊂ B is expressed with ''no''.

    - A ↄ B is expressed with ''some not''.

    - A ↈ B is expressed with ''some''.


    This defines a function from facts in the knowledge base to appropriate statements:


    ```

    f2s :: (Class,Class,Bool) -> Statement

    f2s (as, Class bs, True) = All as (Class bs)

    f2s (as, OppClass bs, True) = No as (Class bs)

    f2s (as, OppClass bs, False) = Some as (Class bs)

    f2s (as, Class bs, False) = SomeNot as (Class bs)

    ```


    **Exercise 5.32** Write a function that filters the facts from a knowledge base
    that mention a class or its opposite. Next, use this to define a function


    ```

    report :: Class -> KB -> [Statement]

    ```


    that gives an exhaustive report of a particular class, as a list of statements.


    Instead of listing relevant facts from the knowledge base, we will give an exhaustive
    account of what is known about a class:


    ```

    tellAbout :: KB -> Class -> [Statement]

    ```


    ```

    tellAbout kb bs =

    [All as (Class bs) | (Class bs) <- supersets as kb,

    as /= = (Class bs) ]

    ++

    [No as (Class bs) | (OppClass bs) <- supersets as kb,

    as /= = (OppClass bs) ]

    ```


    Next, a bit of pragmatics comes in: we will not tell Some A are B if the stronger
    statement All A are B also holds. Note that All A are B is stronger than Some
    A are B beause of the assumption of existential import.'
