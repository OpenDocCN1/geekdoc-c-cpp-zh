    \ x, c)$\n(3) $\\lambda x \\mapsto \text{Give}(a, b, x)$\n(4) $\\lambda x \\mapsto\
    \ \text{Give}(x, b, y)$\n(5) $\\lambda y \\mapsto (\\lambda x \\mapsto \text{Give}(y,\
    \ b, x))$n(6) $\\lambda x \\mapsto (\\lambda y \\mapsto \text{Give}(x, b, y))$\n\
    \nIn fact, the logical constants of predicate logic can be viewed as constants\
    \ of typed logic, as follows: $\neg$ is a constant of type $t \rightarrow t$ with\
    \ the following interpretation.\n\n+   $[\neg] = h$, where $h$ is the function\
    \ in $t \rightarrow t$ which maps 0 to 1 and vice versa"
