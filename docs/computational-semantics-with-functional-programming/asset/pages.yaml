  md: '# 1.3 The Purposes of Communication


    You can say interesting things with predicate logic, at least if you know how
    to use it, for predicate logic is very expressive. We will see below that predicate
    logic gets us a long way in expressing the meanings of natural language statements.
    Still more expressive is typed higher-order logic, which will also be used extensively
    in this book. In typed logic you can say more abstract (but still romantic) things
    like ‘To love someone who makes me happy’. Finally, at the end of the book, we
    will have a look at logic of knowledge, or epistemic logic. This will shed light
    on the meaning of statements like ‘I am not completely sure whether I still love
    you.’ It will also allow us to get an abstract picture of communication by means
    of declarative statements leads to growth of knowledge, in subtle ways. We will
    study growth of audience knowledge about what the speaker knows, but also growth
    of speaker knowledge about audience speaker knowledge, and so on.


    Logic is a field that has made tremendous progress by focussing on well-defined
    formal languages, such as the examples above, and studying their properties in
    depth. It is possible to view logical languages like the language of propositional
    logic or the language of predicate logic as fragments of natural language, by
    focussing at the specific set of sentences of natural language that can be translated
    into the logical language. This is going to be an important method in this book.
    This method of fragments, taking things step by step, was first proposed for natural
    language analysis by logician and philosopher Richard Montague (1930–1971) in
    the 1970s, when he made the following statement:


    > There is in my opinion no important difference between natural languages and
    the artificial languages of logicians; indeed, I consider it possible to comprehend
    the syntax and semantics of both kinds of languages within a single natural and
    mathematically precise theory.


    [Mon74b, p. 222]


    Montague’s pioneering work has shown how natural languages can be formally described
    using techniques borrowed from logic. It introduced tools to compute meanings
    in a systematic way and gave rise to a whole tradition of formal semantics, a
    very general term covering logical approaches to natural language semantics.


    Our goal is to form an adequate model of parts of our language sentence. Adequate
    means that the model has to be realistic in terms of complexity and learnability.
    We will not be so ambitious as to claim that our account mirrors real cognitive
    processes, but what we do claim is that our account imposes constraints on what
    real cognitive processes can look like. In the rest of this chapter, we are going
    to explore the means that will help us fulfilling this goal.'
