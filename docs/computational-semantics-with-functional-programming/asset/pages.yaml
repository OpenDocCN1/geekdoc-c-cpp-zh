  md: "# 10.3 Boolean Algebras of Relations\n\nHow do we convert from lists of lists\
    \ (all of the same length) to RELs? First note\nthat for this we have to know\
    \ the arity, for if the arity is unknown, there is no way\nof dealing with the\
    \ empty list of lists. The following function gives the conversion.\n\n```\nlists2rel\
    \ :: Eq a => Int -> [[a]] -> REL a\nlists2rel 0 [] = Zero True\nlists2rel 0 _\
    \ = Zero False\nlists2rel n xss = abstract (n-1) r\n  where x = let ys = filter\
    \ (xs -> head xs == x) xs\n        in lists2rel (n-1) (map tail ys)\n```\n\nWhen\
    \ this is applied to a list of lists that are not all of the same length, a program\n\
    error is generated (because of the attempt to access the head of an empty list).\n\
    Finally, here is a case to uncurry:\n\n```\nlistCurry :: Int -> ([Bool]) -> Bool)\
    \ -> REL a\nlistCurry 0 f = Zero (f [])\nlistCurry n f = abstract (n-1) g\n  where\
    \ g x = listCurry (n-1) (h x)\n        h x xs = f (x:xs)\n```\n\n# 10.3 Boolean\
    \ Algebras of Relations\n\nIn this section we define generalizations of the Boolean\
    \ operations to relations.\nConjoining of relations of the same arity is a generalization\
    \ of conjunction for\nBoleans. The result of conjoining relations r and s is called\
    \ the Boolean meet of\nr and s, and is often denoted by r⊓ s. It is implemented\
    \ in terms of a general\nfunction for lifting relations (of the same arity) for\
    \ a given Boolean operation:\n\n```\nliftOp :: (Bool -> Bool) -> REL a -> REL\
    \ a -> a -> REL a\nliftOp op (Zero b) (Zero c) = Zero (op b c)\nliftOp op@(Succ\
    \ _) s(Succ _) = =\n  abstract n (\\ x -> liftOp op (apply r x) (apply s x))\n\
    \  where n = arity r - 1\nliftOp op _ = error \"arity mismatch\"\n```"
