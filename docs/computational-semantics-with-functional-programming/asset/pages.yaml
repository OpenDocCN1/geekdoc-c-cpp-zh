    have exactly one colour.


    Note that there is a rule for pragmatics in this game. The pragmatic rule ''ask
    for relevant information'' would forbid to make a guess that is already ruled
    out by earlier guesses.


    Let us turn to the implementation. The key element in the semantics of Mastermind
    is the computation that determines appropriate reactions to a guess. The guess
    is compared with the secret pattern, and the appropriate reaction is returned.
    To compute the reaction, first the elements that occur somewhere at the same position
    are counted, next the elements that occur somewhere are counted, and finally the
    counts are combined. Note that we do not forbid repetition of colours.


    ```

    samepos :: Pattern -> Pattern -> Int

    samepos [] = 0

    samepos [] = 0

    samepos (x:xs) (y:ys) | x == y = samepos xs ys + 1

    | otherwise = samepos xs ys

    ```


    ```

    occurcount :: Pattern -> Pattern -> Int

    occurcount xs [] = 0

    occurcount xs (y:ys) | ''elem'' xs = occurcount (delete y xs) ys + 1

    | otherwise = occurcount xs ys

    ```'
