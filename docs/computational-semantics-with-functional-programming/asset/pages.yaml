    # 3.7 List processing with map and filter


    The function takes a function and a list and returns a list containing the results
    of applying the function to the individual list members. Thus, if f is a function
    of type a -> b and xs is a list of type [a], then map f xs will return a list
    of type [b].


    ```

    map :: (a -> b) -> [a] -> [b]

    map f [] = []

    map f (x:xs) = map f x : map f xs

    ```


    For example, map (+ 1) will add 1 to each number in [0..9], so it will give the
    list of numbers from 1 to 10. Another example is the following one:


    ```

    FPH> map ("un") ++) ["friendly","believable"]

    ["unfriendly","unbelievable"]

    ```


    Accordingly, map hword produces a list of true values.


    The filter function takes a property and a list, and returns the sublist of all
    list elements satisfying the property. It has the type (a -> Bool) -> [a] -> [a].
    Here a again denotes an arbitrary type. One can filter strings, or lists of integers,
    or whatever, given a property of the right type: String -> Bool for strings, Int
    -> Bool for integers, and so on. Here is the definition of the filter function:


    ```

    filter :: (a -> Bool) -> [a] -> [a]

    filter p [] = []

    filter p (x:xs) | p x = x : filter p xs | otherwise = filter p xs

    ```


