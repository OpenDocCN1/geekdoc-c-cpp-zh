    \ = []\n```\n\nNow, the scan function scans an input string and puts whitespace\
    \ in front of punctuation marks.\n\n```\nscan :: String -> String = []\nscan []\
    \ =\nscan (x:xs) | x `elem` \" ,?\" = x:scan xs\n             | otherwise = x:scan\
    \ xs\n```\n\nThe lexer will produce lists of words (strings). Here is the data\
    \ type for such lists:\n\n```\ntype Words = [String]\n```\n\nThe lexer creates\
    \ lists of words from the input string. For robustness, we convert everything\
    \ to lowercase. The lexer function uses the predefined function words to split\
    \ the input into separate words. The function preprocess is defined below.\n\n\
    ```\nlexer :: String -> Words\nlexer = preprocess . words . (mapToLower) . scan\n\
    ```\n\nIt is useful to do some preprocessing on the list of input words. We will\
    \ disregard commas anywhere in the input, periods and question marks at the end\
    \ of the input.\n\n```\npreprocess :: Words -> Words = []\npreprocess [] = []\n\
    preprocess [\",\"] = []\npreprocess [\"?\"] = []\npreprocess (\":\\\":xs) = preprocess\
    \ xs\"\n```\n\nWhile we are at it, we can also use preprocessing for adjusting\
