  md: '# Formal Semantics for Fragments


    Eq indicates that a is in the equality class. This is needed because of the equality
    test === inside the function definition.


    The next concept we need is that of the composition of two relations $R$ and $S$
    in $A$. Recall that the composition $R \circ S$ is defined as the set of pairs


    ```

    {(x, z) \mid$ there is some $y \in A$ with $(x, y) \in R$ and $(y, z) \in S\}$.

    ```


    Here is the Haskell implementation:


    ```

    @@ :: Eq a => Rel a -> Rel -> Rel a

    r r @ s = nub [ (x

    ```


    Also recall that a relation $R$ is transitive if for all $x, y, z$ that $(x, y)
    \in R$ and $(y, z) \in R$, then $(x, z) \in R$. If a relation is not transitive,
    then it can be made into a transitive relation by adding pairs. The *transitive
    closure* of a relation $R$ is by definition the smallest transitive relation $S$
    with $R \subseteq S$.


    # **Exercise 5.30** Find the transitive examples in Exercise 2.7.


    Recall that a relation $R$ is reflexive if $I \subseteq R$, where $I$ is the identity
    relation on $R$, i.e. $I = \{(x, x) \mid x \in A\}$. The *reflexive transitive
    closure* of a relation $R$ is by definition the smallest reflexive and transitive
    relation $S$ with $R \subseteq S$.


    # **Exercise 5.31** Find the reflexive closures of the example relations in Exercise
    2.7 on page 19.


    To compute the reflexive closure of $R$, we proceed as follows. We start from
    $I$, and compute relations $R''$, $R''''$, and so on, by checking whether composing
    $R$ with the present stage of the relation yields anything. If this is the case,
    we add the new pairs and go on. If it is not the case, we know that the relation
    is reflexive and transitive, and we stop. This process of gradually adding stuff
    until nothing changes is called a fixed point construction. A fixpoint of a function
    $F$ is an argument $S$ for $F(S)=S$. The least fixpoint of $F$ is the smallest
    $S$ for which this happens. Think of $S$ as the present state of the relation
    that extends $R$, and think of $F$ as the result of adding the pairs in $R \circ
    S$ to $S$. The code is much shorter than the explanation.'
