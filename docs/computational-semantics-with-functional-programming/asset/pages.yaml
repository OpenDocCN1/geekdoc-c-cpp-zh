    # 13.3 A Language for Talking About (Common) Knowledge


    A suitable logic for talking about knowledge and common knowledge is epistemic
    PDL, or E-PDL. PDL is short for propositional dynamic logic. It was invented as
    a language for computer program specification, but the nice thing about tools
    is that they can be reinterpreted and used in different domains. For example,
    PDL has an operation of program composition: first execute P, next program Q.
    We can reinterpret this to express the epistemic relation of what Alice knows
    about Bob''s knowledge. Similarly, PDL has a construction for non-deterministic
    choice between two programs P and Q. We can reinterpret this as what Alice and
    Bob both know. Finally, PDL can express transitive closure, for executing a program
    P an arbitrary finite number of times. We reinterpret this as the reflexive transitive
    closure of a knowledge relation. If a denotes Alice''s accessibility relation
    and b Bob''s, and we use U for union of relations, and * for reflexive transitive
    closure, then (a b)* expresses the common knowledge of Alice and Bob.


    Here is a language for knowledge and public announcement. Assume that a ranges
    over the accessibility relations for individual agents and that p ranges over
    a set of basic propositions P.


    ```

    $\phi ::= T | p | \neg\phi | \phi_1 \wedge \phi_2 | [a]\phi | |!\phi_1]\phi_2$

    $\alpha ::= a^{?\phi | \alpha_1;\alpha_2 | \alpha_1 \cup \alpha_2 | \alpha^*$"

    ```


    To interpret this we need a formal definition of epistemic models. Here it is.
    Let us set a P of basic propositions and a set A of agents. Then an epistemic
    model M is a triple (W, V, R),


    +   * W is a non-empty set of worlds (the universe of the model),

    * V is a function from W to P(P) (the valuation function of the model),

    * R is a function from A to P(W × W) that assigns to each a in A an equivalence
    relation ∼ on W (the accessibility relation for agent a).


    We use this to define interpretations for formulas φ and epistemic expressions
    α. Let a model M = (W, V, R) be given. The formulas of E-PDL are interpreted as'
