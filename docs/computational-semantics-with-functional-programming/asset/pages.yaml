  md: '# COMPUTATIONAL SEMANTICS WITH FUNCTIONAL PROGRAMMING


    Computational semantics is the art and science of computing meaning in natural
    language. The meaning of a sentence is derived from the meanings of the individual
    words in it, and this process can be made precise that it can be implemented on
    a computer. Designed for students of linguistics, computer science, logic and
    philosophy, this comprehensive text shows how to compute meaning using the functional
    programming language Haskell. It deals with both denotational meaning (where meaning
    comes from knowing the conditions of truth in situations), and operational meaning
    (where meaning is an instruction for performing cognitive action). Including a
    discussion of recent developments in logic, it will be invaluable to linguistics
    students wanting to apply logic to their studies, logic students wishing to learn
    how their subject can be applied to linguistics, and functional programmers interested
    in natural language processing as a new application area.


    JAN VAN EIJCK is a Senior Researcher at CWI, the Centre for Mathematics and Computer
    Science in Amsterdam, and Professor of Computational Linguistics at Uil-OTS, the
    Research Institute for Language and Speech, Utrecht University.


    CHRISTINA UNGER is based in the Semantic Computing Group in the Cognitive Interaction
    Technology Center of Excellence at the University of Bielefeld.'
