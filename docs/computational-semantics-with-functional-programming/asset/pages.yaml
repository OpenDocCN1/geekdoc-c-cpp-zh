    # Summary


    This chapter sketches a dynamic incremental semantics for natural language that
    starts out from Discourse Representation Theory (DRT), and extends this into type
    theory. This type-theoretic version of DRT can be viewed as a reconstruction that
    does justice to the incrementality and the finite domain semantics of the original.


    # 12.1 The Dynamics of Pronoun Linking


    Basic ingredients for a dynamic account of pronoun linking are contexts and constraints
    on contexts. An example of such a dynamic account is Discourse Representation
    Theory (DRT) [Kam81]. A DR-style representation for a piece of text consists of
    a context, plus a list of constraints on that context. In the characteristic box
    notation of DRT this looks like:


    | context |

    | constraints |

    | on context |


    In DRT, the context consists of a list of reference markers or discourse referents.
    The constraints are assertions about the these markers. Together they represent
    the information that a text provides, plus information about the anaphoric possibilities
    of the text. As the information conveyed by a piece of text grows, the corresponding
    representation structures get ''updated''. This happens roughly as follows:


    | new context |

    | constraints — update → new constraints |

    | on context |


