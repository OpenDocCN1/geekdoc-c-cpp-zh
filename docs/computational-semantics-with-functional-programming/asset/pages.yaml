  md: 'The Booleans True and False are an example of a so-called enumerated datatype
    in Haskell. The two items True and False are called data constructors. The following
    standard definition of not uses pattern matching on these data to define negation.


    ```

    not :: Bool -> Bool

    not True = False

    not False = True

    ```


    Another kind of pattern matching on data occurs with the structured datatype of
    lists:


    ```

    null :: [a] -> Bool

    null [] = True

    null (_:_) = False

    ```


    The pattern [] is matched by the empty list, and the pattern (_:_) is matched
    by any non-empty list. The underscore _ is called a wild card pattern. It matches
    anything. (_:_) stands for anything that can be constructed with :, and it follows
    that (_:_) matches any non-empty list.


    Here is another example from the Haskell Prelude:


    ```

    last :: [a] -> a

    last [x] = x

    last (_:xs) = last xs

    last [] = error "Prelude.last: empty list"

    ```


    Pattern matching in Haskell takes place to bottom. The top equation is first.
    When there is a match, this equation is applied, otherwise the next equation is
    tried for a match, and so on. The following alternative way to write the last
    function illustrates this:


    ```

    myLast :: [a] -> a

    myLast [x] = x

    myLast (_:xs) = myLast xs

    myLast = error "myLast: empty list"

    ```


    The pattern used in myLast always matches, but because it is at the bottom of
    the list of patterns, it will only be selected in case the list is empty.'
