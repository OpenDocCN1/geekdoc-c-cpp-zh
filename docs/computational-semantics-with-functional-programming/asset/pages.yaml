  md: "# Parsing\n\nNotation for the subtree of $t$ at position $p$ is $t_p$. The\
    \ list of all subtrees of a syntax tree corresponds to the set $\\{t_p \\mid p\
    \ \\in \\text{Pos}(t)\\}$. Here is an implementation:\n\n```\nsubtrees :: ParseTree\
    \ a b -> [ParseTree a b]\nsubtrees t = [ subtree t | p <- pos t ]\n```\n\nIf $p,\
    \ q$ are tree positions, we say $p \\leq q$ if $p$ is a prefix of $q$. If $p,\
    \ q$ are positions in a syntax tree $t$, then $p \\leq q$ holds if only if $q$\
    \ is a subtree of $t_p$. If $p, q$ are positions in $t$ with $p \\leq q$, position\
    \ $p$ is said to *dominate* $q$. If also $p \\neq q$, position $p$ is said to\
    \ *properly dominate* $q$. Proper dominance is a relation on the set of tree positions.\
    \ In Section 5.7 we call a list of pairs over the same type a relation:\n\n```\n\
    type Rel a = [(a,a)]\n```\n\nThe proper dominance relation on the list of positions\
    \ in a tree can be implemented as follows:\n\n```\nproperdominance :: ParseTree\
    \ a b -> Rel Pos\nproperdominance t = [ (p,q) | p <- pos t,\n                \
    \              q <- pos t,\n                              p /= q,\n          \
    \                    prefix p q ]\n```\n\nThe dominance relation on a tree is\
    \ the result of dropping the inequality constraint:\n\n```\ndominance :: ParseTree\
    \ a b -> Rel Pos\ndominance t = [ (p,q) | p <- pos t,\n                      \
    \        q <- pos t,\n                              prefix p q ]\n```\n\n**Exercise\
    \ 9.1** The relation of dominance can be defined as the transitive closure of\
