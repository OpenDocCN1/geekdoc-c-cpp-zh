    \ = if (Masc 'elem' fs || Fem 'elem' fs)\n   then (delete MascOrFem)\n   else\
    \ fs\n\nNow that we have features, we can define a data type for syntactic categories.\
    \ Syntactic categories have four components. The first component gives the phonological\
    \ representation, the second category label, the third set of agreement features,\
    \ and the fourth the so-called subcategorization list. The subcategorization list\
    \ of a category C is the list of categories that combines with.\n\n```\ntype CatLabel\
    \ = String\ntype Phon = String\n\ndata Cat = Cat Phon CatLabel Agreement [Cat]\n\
    \   deriving Eq\n```\n\nOnly the categories that directly correspond with lexical\
    \ items have phonological content. The other categories have a blank in this position,\
    \ represented by \"_\".\n\n```\ninstance Show Cat where\nshow (Cat \"\" label\
    \ agr subcatlist) = label ++ show agr\nshow (Cat phon label agr subcatlist) =\
    \ phon ++ \" label ++ show agr\n```\n\nHere are functions for getting the components\
    \ out of a category:\n\n```\nphon :: Cat -> String\nphon (Cat ph _ _) = ph\n```\n\
    \n```\ncatLabel :: Cat -> CatLabel\ncatLabel (Cat _ label _) = label\n```\n\n\
    ```\nfs :: Cat -> Agreement\nfs (Cat _ _ _) = agr\n```\n\n```\nsubcatList :: Cat\
