    (henceforth called determiners) pick out binary relations on sets of individuals,
    on arbitrary domains of discourse E. The notation is DE_AB. We call A the restriction
    of the quantifier and B its body. If DE_AB is the translation of a simple sentence
    consisting of a quantified noun phrase with an intransitive verb phrase, then
    the noun denote is the restriction and verb phrase the body. In the example All
    dwarfs work, the NP *all dwarfs* is the restriction of the determiner *all*, and
    the VP *work* is the body. See Figure 7.2 for a general graphical representation.


