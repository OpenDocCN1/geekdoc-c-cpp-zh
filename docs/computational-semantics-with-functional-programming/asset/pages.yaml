    # 1.6 Computational Semantics and Functional Programming


    The approach to natural language semantics that was propagated by Richard Montague
    – sometimes called the Montaguevian program – has proved fruitful in the past
    three decades. More recently, in the last decade and a half, a discipline of so-called
    functional programming has developed to be a natural fit for the approach of Montague.
    Like Montague grammar, functional programming is based on the so-called lambda
    calculus.


    Now, why, indeed, should linguists have to acquire programming skills at all?
    Functional programming is a useful skill for linguists not only because of the
    dovetail with Montague grammar, but also because it allows illuminating experiments
    with linguistic rule formats. Implementing a rule system forces the linguist to
    be fully precise about the rules he or she proposes. You will find that once you
    are well-versed in functional programming, your programming efforts will give
    you immediate feedback on your linguistic theories.


    There are basically two things that machines are used for computational semantics.
    One is automatizing the construction of meaning representations. The other one
    is operating on the results. Possible operations are model checking (or model
    building) and performing inference tasks. Such operations are essential for Natural
    Language Processing applications, e.g. for searching for information within documents
    or databases (information retrieval), as implemented in search engines, for developing
    and implementing dialogue systems or question-'
