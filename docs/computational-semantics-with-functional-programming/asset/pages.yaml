    a type (n) function.


    A type (1) function $f$ can be lifted to a function $f''$ from $(n+1)$-ary relations
    $R$

    to n-ary relations $f''(R)$ by means of


    ```

    $f''(R) = \{(d_1, \dots, d_n) \mid f(\langle d_1, \dots, d_n\rangle) \in R\} =
    \{1\}.$

    ```


    These lifted type (1) functions can then be composed by means of


    ```

    $f'' \circ g'' = \lambda R \mapsto f''(g''(R)).$

    ```


    Here it is assumed, of course, that $R$ has arity $\ge 2$. The lifted type (2)
    function

    $f'' \circ g''$ maps $(n+2)$-ary relations to n-ary relations.


    Similarly, a type (n) function $F$ can be lifted to a function from $(m+n)$-ary

    to m-ary relations, by means of


    ```

    $F''(R) = \{(d_1, \dots, d_m) \mid\nF(\langle d_{m+1}, \dots, d_{m+n}\rangle)
    \mid\n\langle d_1, \dots, d_m, d_{m+1}, \dots, d_{m+n}\rangle \in R\} = \{1\.$

    ```


    Many type (2) functions can be decomposed in this way into types of (1)

    functions. E.g. the type (2) function $F$ that interprets the complex expression
    Every

    unicorn a lettuce leaf can be decomposed into a type (1) function $g$ that

    interprets a lettuce leaf and a type (1) function $f$ that interprets every unicorn,

    f'' \circ g''$ equals $F''$. To illustrate this, we start with $f$ and $g$; both
    are functions that

    map unary relations to truth values.


    ```

    $f = \lambda P \mapsto \forall x(Unicorn \ x \to Px)\ng = \lambda Q \mapsto \exists
    y(LettuceLeaf \ y \to Q)$

    ```


    Now we lift these functions to functions $f''$ and $g''$ that map $(n+1)$-ary
    relations

    to n-ary relations.


