  md: "# Handling Relations and Scoping\n\nHere are some further examples of quantifiers\
    \ Keenan shows to be not reproducible.\n\nThree knights in the castle dealt the\
    \ same princess. (10.2)\n\nThe women at the wedding all wore different hats. (10.3)\n\
    \nThe trolls gave different answers to different questions. (10.4)\n\nIn this\
    \ chapter we will interpret phrase clauses as relation reducers, with a cluster\
    \ of $n$ NPs interpreted as a type $\\langle n \\rangle$ function. In the cases\
    \ where such an NP cluster interpretation is reducible to type (1) functions,\
    \ the reduction $f_1 \\circ \\dots \\circ f_n$ imposes a scope ordering on the\
    \ NPs. This means that quantifier scoping can be handled by considering different\
    \ orderings of the reducing type (1) functions, while taking care that the scope\
    \ reorders respect the relevant argument binding constraints. E.g. recall the\
    \ interpretation of *Every unicorn — a lettuce above*. The composition $f \\circ\
    \ g$ gave the scope of the universal quantifier having scope over the existential\
    \ quantifier. To reorder the scope of $f \\circ g$, we first define a operation\
    \ $S$ by\n\n```\n$S := \\lambda R\\lambda x\\lambda y \\mapsto (R y) x$.\n```\n\
    \nThis reorders the two places of relation. The inverse scope reading of $f$ and\
    \ $g$ can be expressed as $g \\circ f \\circ \\mathbf{S}$. This corresponds to\n\
    \n```\n$\\lambda R \\mapsto \\exists y(\\\text{LettuceLeaf} y \\wedge \\forall\
    \ x(\\text{Unicorn} x \\to R xy))$.\n```\n\nWe will look at this maps of reversing\
    \ scope in a more detail in Section 10.5 below.\n\n# 10.2 Generalized Relations\n\
    \nA binary relation on a set $A$ can be viewed as a function of type $A \\to P(A)$.\
    \ It maps elements $a$ of $A$ to subsets $aR$ of $A$, where $aR$ is shorthand\
    \ for\n\n```\n{$x \\in A | R ax\\}$.\n```\n\nEquivalently, a binary relation can\
    \ be viewed as a function of type $A \\to A \\to t$. It maps elements $a$ of $A$\
    \ to characteristic functions $\\chi_a$ on $A$, where $\\chi_a$ is given by $\\\
    chi_a(b) = 1$ if $Rab$.\n\nSimilarly, a unary relation on a set $A$ is a function\
    \ of type $A \\to t$, a ternary relation on a set $A$ is a function of type $A\
    \ \\to A \\to A \\to t$, and so on. A special case is a nullary relation: this\
    \ is just a truth value. Note that an $(n+1)$-ary on $A$ can be viewed as a function\
    \ from $A$ to the type of $n$-ary relations over $A$."
