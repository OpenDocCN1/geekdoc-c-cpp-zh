  md: '# Handling Relations and Scoping


    Here is a general function for applying a relation to an argument. Precondition
    is that the relation is at least unary.


    ```

    apply :: REL a -> -> REL a

    apply (Zero _) _ = error "no argument position left"

    apply (Succ r) x = apply'' r x


    apply'' :: REL (a -> r) -> a -> RL a

    apply'' (Zero f) x = Zero (f x)

    apply'' (Succ r) x = Succ (apply'' r x)

    ```


    The functions illustrate the need for the auxiliary data for type RL r. At the
    point where apply'' (Zero f) x defines, Zero f is not of type REL but of type
    RL (a -> r), for f is not a Boolean.

    We will also need an operation for abstraction. That abstraction increases the
    arity by one. If f is a function that yields relations of 0, then we know that
