    # 11.2 Continuations as Abstractions over Context


    In the semantics we give 7.5, a quantificational NP like every dwarf denotes a
    function of type $(e \to t) \to t$. Also the denote of non-quantific NPs is lifted
    to that type. As an example, recall the denote of Alice:


    ```

    $$\lambda P \to (P \ a)$

    ```


    This term denotes a function that takes the linguistic context of the NP Alice
    and plugs the individual constant corresponding to Alice to that context.


    The treatment of NP denations as abstractions over NP contexts was devised by
    Montague to give a unified treatment of quantificational and non-quantificational
    NPs. We do not need to restrict this strategy to NPs; we can extend it to expressions
    of other categories as well.


    Suppose we are computing the meaning of


    ```

    $$\lambda Alice [vp helped Dorothy]$$

    ```


    Let us start with the NP Alice again. Its linguistic context is __ helped Dorothy.
    It denotes a predicate with one free argument. During the computing this slot
    will be filled with the individual constant corresponding to Alice. Abstracting
    over this predicate we reach at the denotation mentioned above: $\lambda P \to
    (P \ a)$, with $P$ being of type $e \to t$. We already how to do this for every
    NP. So the NP has a very similar denotation: $\lambda P \to (P \ d)$. It is an
    abstraction over the linguistic context of Dorothy, which, in this case, Alice
    helped __,e. again as a predicate which only needs to be applied to an NP in order
    to yield a full sentence.


    Now we can apply exactly the same treatment to the verb helped: we can say the
    meaning of helped is an abstraction over the linguistic context it appears in,
    a function that does something that requires a verb in order to yield a full sentence.
    To analogous NPs, we can specify the meaning of helped as $\lambda P \to (P''
    \ Help)$, where Help is the two-place predicate that helped denotes, and $\mathcal{P}$
    is the linguistic context of helped. In the sentence this is Alice __ Dorothy.
    This context is out of another type than the context of an NP, because it is applied
    to a verb of type $e \to e \to t$. A meaning we can assign to Alice __ Dorothy,
    that is, $\lambda P \to ((P \ d))$, i.e., a function that takes a predicate of
    type $e \to e \to t$ (a transitive verb denotation) and applies it to the individual
    constants corresponding to Dorothy and Alice. The type of this function is $(e
    \to e \to t) \to t$. So this is the type of the linguistic context of transitive
    verb, versus the type of the $\mathcal{P}$ in the denotation of helped above.
    The denotation of helped is a function from this context type to $t$, i.e. $((e
    \to e \to t) \to t) \to t$.


