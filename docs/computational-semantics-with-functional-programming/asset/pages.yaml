    \ satisfying the property is non-empty, False otherwise. Thus, any q list checks\
    \ whether any element of the list satisfies property q.\n\nThe interpretation\
    \ of every checks whether the CN property is included in the VP property. Again,\
    \ this is not a translation to logical form but an instruction for a check whether\
    \ the appropriate quantifier relation holds between p and q.\n\n```\nintDET Every\
    \ p q = all q (filter p entities)\n```\n\nHere filter p entities gives the list\
    \ of all members of entities that satisfy property p, and all q list checks whether\
    \ every member of list satisfies q.\n\nThe interpretation of the consists of two\
    \ parts (recall Russell's treatment of defines outlined in Section 6.2):\n\n+\
    \   (1) a check that the CN property is unique, i.e. that it is true of precisely\
    \ one entity in the domain,\n\n+   (2) a check that the CN and the VP property\
    \ have an element in common, in other words, the check on the two properties.\n\
    \n```\nintDET The p q = singleton plist && q (head plist)\n  plist = filter p\
    \ entities\n  singleton [x] = True\n  singleton - = False\n```\n\nThe interpretation\
    \ of no is just the negation of the interpretation of some:\n\n```\nintDET No\
    \ p q = not (intDET Some p q)\n```\n\nNow suppose we also want to give an interpretation\
    \ for the determiner most. It compares the length of the list of entities satisfying\
    \ the first argument (the restriction) with the length of the list of entities\
    \ satisfying the second argument (the body).\n\n```\nintDET Most p q = length\
    \ pqlist > length (plist \\ qlist)\n  plist = filter p entities\n  qlist = filter\
    \ q entities\n  pqlist = filter q plist\n```"
