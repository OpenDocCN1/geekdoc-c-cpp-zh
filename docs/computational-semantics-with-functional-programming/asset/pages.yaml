    A set is a collection of definite, distinct objects. This is too vague for a definition,
    but unfortunately we cannot do better, and fortunately that does not matter. Let
    us give some examples of sets instead. The first example is the set of words in
    the third edition of the Oxford Advanced Learner’s Dictionary of Current English.
    Other examples are the set of colours of the Dutch flag, or the set of letters
    of the Greek alphabet. Yet another example is the set of even numbers greater
