    ![](img/27863720c158bdd744a04cbf0ba9e2de_171_0.png)


    Not all two-place relations on sets of individuals are quantifier relations. The
    first two requirements that quantifiers must meet are general requirements for
    denot of determiners: extension and conservativity, which will be abbreviated
    as EXT and CONS, respectively. Extension is the following:


    EXT For all A, B ⊆ E''; DE_AB ⇔ DE''_AB.


    A relation observing EXT is stable under growth of the universe. So, given sets
