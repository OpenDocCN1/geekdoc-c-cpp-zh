    Communication as Informative Action


    ![](img/27863720c158bdd744a04cbf0ba9e2de_368_0.png)


    Aim of a communicative discourse is to create common knowledge between us and
    you. What does it mean to create common knowledge? If we inform you that something
    is the case, say that there is a party on tonight, then not only do you know that
    there is a party on, but also we know that you know, and you know that we know
    that you know. And so, ad infinitum. This is common knowledge.


    To see that common knowledge is different from mere knowledge, consider the example
    of cash withdrawal from a bank. You withdraw a large amount of money from your
    bank account and have it paid out to you by the cashier. What happens? The cashier
    looks at you earnestly to make sure she has your full attention, and then she
    slowly counts the banknotes for you: five hundred (counting ten notes), one thousand
    (counting ten notes), fifteen hundred (ten notes again), and two thousand (another
    ten notes). This ritual creates common knowledge that forty banknotes of five
    euros were paid out to you. To see that this is different from mere knowledge,
    consider the alternative where the cashier puts out the money of sight, puts it
    in an envelope, and hands it over to you. At home you open the envelope and count
    the money. Then the cashier and you have knowledge about the amount of money that
    is in the envelope. But the amount of money is not common knowledge among you.
    In order to create knowledge you will have to insist on counting the money while
    the cashier is looking on, making sure that you have her full intention. For suppose
    you fail to do that. On recounting the money at home you discover there be a mistake.
    One banknote is missing. The situation is as follows: the cashier believed she
    knew there were forty banknotes. You now know there are only thirty-nine. How
    are you going to convince your bank that a mistake has been made, and that it
    is their mistake?'
