  md: "# 11.3 Continuing a Grammar\n\nOur CPS transformation will lift expression\
    \ denot to functions that take their continuation as an extra argument. This,\
    \ however, will not change the meaning of the expressions. For a big part of our\
    \ fragment the semantics will turn out to work exactly like before. As a consequence\
    \ of this lifting, each expression will have access to its linguistic context\
    \ (in other words: to a stage in the meaning computation). We will exploit this\
    \ for the semantics of quantifiers.\n\nIn order to continue our grammar, we have\
    \ to proceed in two steps. First we need to lift the denotation of every basic\
    \ expression in our grammar, i.e. the meaning of the terminal symbols. We will\
    \ also have to lift our rule for functional application, because once we have\
    \ lifted all denotations to computations, they are not of the right type to simply\
    \ apply to each other.\n\nLet us start with the first step. In the previous section\
    \ we already lifted the denotations of Alice, *Dorothy*, and *helped*. What we\
    \ got $\\lambda P \rightarrow (P\\ a)$, $\\lambda P \rightarrow (P\\ c)$, respectively.\
    \ The pattern is very easy: the lifted denotation of a basic expression is a function\
    \ from the continuation of that expression to the result of applying that continuation\
    \ to the original denotation. Stating this as a general rule for all terminals\
    \ of our grammar, we get the first part of our CPS transformation:\n\n```\n$$\\\
    bar{c} = \\lambda k \rightarrow (k\\ c) \\quad \\text{for all constants } c \\\
    quad (11.4)$\n```\n\nWe denote the CPS transformation of a lambda expression by\
    \ overlining it. Implementing this rule in Haskell we use the following function\
    \ for continuing terminals:\n\n```\ncpsCont :: a -> Comp r\ncpsCont c = \\ k ->\
    \ k c\n```\n\nIn fact, these lifted denotations do not use of the continuation\
    \ but just pass it over. This can be seen from the fact that the continuation\
    \ is always the outermost function. It is applied to the original denotation without\
    \ being modified. So for this part of the fragment, the transformed one and the\
    \ original are equivalent. In order to get the original denotation from the continuized\
    \ one, we simply apply the latter to the trivial continuation, the identity function.\
    \ For example, applying the lifted denotation of *helped* to the identity function\
    \ results in the two-place predicate *Help*:"
