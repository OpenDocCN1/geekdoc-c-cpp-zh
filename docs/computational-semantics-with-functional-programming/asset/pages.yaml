  md: 'equals the set of indices I. If $c$ is an object language of (extensional)
    type $\alpha$, we interpret $c$ by means of


    > $M_I(c) = \cap(\lambda i \mapsto M_i(c)).$


    In other words, we consider the function that gives the extensional interpretation
    of $c$ at each index, and lift this function to the function $\overline{c}$ by
    means of $\cap$.

    Let $g$ be an extensional variable assignment, suitable for some extensional model
    $M_I$ in $\mathcal{I}$. Then it follows from the fact that all extensional models
    in $\mathcal{I}$ use the same domain $D_i$ that is a suitable variable assignment
    for *all models* in $\mathcal{I}$. We can lift such a $g$ to an assignment for
    $M_I$ by means of


    > $g^*(v : \alpha) = \cap(\lambda k \mapsto g(v)).$


    Note that the abstraction $\lambda k \mapsto g(v)$ is vacuous, so that it defines
    a function that yields the value $g(v)$ for every index. In other words, $g^*(v)$
    is defined as the $\cap$ lifting of the constant $g(v)$ function.

    The following fact is proved in [Kan09]. Consider the language of typed lambda
    calculus with constants of extensional types. Let $\phi$ be an expression of this
    language that is not a $\lambda$-abstract.


    > $[\phi]_{M_I,g^*} = \cap(\lambda i \mapsto [\phi]_{M_i,g}).$


    From this and the properties of $\cap$ it follows directly for closed expressions
    $\phi$ of type $t$ or $c$ we have


    > $[\phi]_{M_I} = \lambda i \mapsto [\phi]_{M_i}$.$


    This means that the intensional model $M_I$ does indeed behave in the appropriate
    way, as the intensionalization of the models in $\mathcal{I}$.

    The importance of this for natural language semantics is that we can define intensional
    interpretations of extensional constructs by means of a $\cap$ lift of the corresponding
    extensional interpretations. This allows for a modular set-up of a natural language
    fragment dealing with intensional phenomena, where extensional constructs can
    be cleanly separated from intensional constructs.


