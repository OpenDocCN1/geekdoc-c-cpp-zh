    \ (P a) that we get by employing the Haskell counterpart to λ.\nThe interpretation\
    \ of phrase verbs we invoke the information encoded in our first-order model.\n\
    \n```\nintVP :: VP -> Entity -> Bool\nintVP Laughed = \\ x -> laugh x\nintVP Cheered\
    \ = \\ x -> cheer x\nintVP Shuddered = \\ x -> shudder x\n```\n\nThe interpretation\
    \ of complex VPs is a bit more involved. We have to make reference to the property\
    \ of 'standing in the TV relation to the subject of the sentence\\'. We do this\
    \ in the same way as in the type logic specification of the semantic clause for\
    \ [VP TV NP].\n\n```\nintVP (VP1 tv np) =\n  \\ subj -> intNP (\\ obj -> intTV\
