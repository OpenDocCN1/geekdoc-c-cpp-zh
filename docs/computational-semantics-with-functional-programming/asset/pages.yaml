  md: "Exercise 5.1 Write a check lineupOK :: State -> Bool to make sure that all\
    \ ships in a state are on adjacent squares in a single row or column.\n\nThe Sea\
    \ Battle reactions missed, hit, sunk, and defeated are interpreted as follows.\
    \ Given a state and the position of the last attack, any of these reactions gives\
    \ the value 'true' (= 1) or 'false' (= 0). We can express this as a function F\
    \ S × P × R to {0,1}, where S is the set of states of the game, P the set of positions,\
    \ and R the set of reactions (so S × P × R is the set of triples consisting of\
    \ a state, a position and a reaction).\n\n```\nF(s, p, missed) = { 1 if there\
    \ is no ship at position p in state s,\n                      0 otherwise. }\n\
    F(s, p, hit)    = { 1 if there is a ship at position p in state s,\n         \
    \             0 otherwise. }\nF(s, p, sunk)    = { 1 if there is a ship at position\
    \ p in state s\n                      which is covered by X's everywhere but at\
    \ p,\n                      0 otherwise. }\nF(s, p, defeated) = { 1 if there is\
    \ a ship at position p in state s\n                              which is covered\
    \ by X's everywhere but at,\n                              while all other ships\
    \ are covered everywhere,\n                              0 otherwise. }\n```\n\
    \nThis can be implemented as follows:\n\n```\nhit :: Attack -> State -> Bool\n\
    hit pos (gs,_) = elem pos (concat gs)\n\nmissed :: Attack -> State -> Bool\nmissed\
