    Parsing is the process of constructing a list of parse trees for a string. Each
    parse tree will correspond to a possible parse of the string. If a string does
    not parse, the list of parse trees is empty.


    ```

    prs :: String -> [ParseTree Cat Cat]

    prs string = let ws = lexer string

    in [ s | catlist <- collectCats lexicon ws,

    (s,) <- parseSent catlist ]

    ```


