    [Keen92] it is demonstrated that there are cases where compound quantifier are
    not decomposable. Keenan shows that the following sentence exhibits an example
    of non-decomposable type (2):


    # Different djinnis satisfied different wishes. (10.1)


    For sentence (10.1) to make sense, we have to assume that there are at least two
    djinnis. The sentence is true if there is a one-to-one correspondence between
    djinnis and sets of wishes they satisfy. Thus, Different chỉnh and different wishes
    are interpreted as the type (2) function whose argument relation R satisfies the
    property that all $aR$, with $a$ ranging over individuals, are different (here
    $aR$ is used as shorthand for $\{x | Rax\}$), the set of objects that $a$ bears
    $R$ to. So, intuitively, different djinnis and different wishes cannot be interpreted
    independently. Keenan has a needed method to prove this. He states and proves
    a theorem that for any two type (2) functions $F, G$ that are reducible it holds
    that these functions are equal if they act on the Cartesian products, i.e. if
    for all subsets $P, Q$ of the discourse $U$ it holds $F(P \times Q) = G(P \times
    Q)$.


    How can this be to show that a type (2) function $F$ is non-reducible? Let $F$
    be the type (2) function that interprets different chỉnh — different wishes. Pick
    a universe containing at least three djinnis $d_1, d_2, d_3$ and at least two
    $w_1, w_2$. Let $P \times Q$ be a product relation, a relation that relates every
    object in $P$ to every object in $Q$. If there are two djinnis not in $P$, then
    they bear $P \times Q$ to the same wishes, namely if wishes. If there are two
    djinnis in $P$, then the wishes bear $P \times Q$ to again the same, namely $Q
    \cap Wish$. Again, $F(P \times Q) = 0$. Let $0$ be the type (1) function that
    is false for any argument. Then, by the above, $0 \circ (0)$ for any product relation
    $R$. But obviously, $F(R) = 0(R)$ is different from the composition $0 \circ 0$,
    for $F$ is true of $\{\langle d_1, w_1\rangle, \langle d_2, w_2\rangle\}$, and
    $0 \circ 0$ is not. Thus, by Keenan’s theorem, $F$ is not reducible.'
