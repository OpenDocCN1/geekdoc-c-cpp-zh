    space into two possibilities. It therefore suffices to add a designated propositional
    variable $f$ to our model, that represents the question focus. This focus will
    be reset by a question. More precisely, we analyse a yes/no question $\phi$ as
    an update that changes the denotation of $f$ to $\phi$:


    ```

    $[f := \phi]$

