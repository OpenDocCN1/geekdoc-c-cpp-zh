  md: '# 8.6 Further Reading 203


    (function from worlds to extensions). This ‘PTQ fragment’ employs a combination
    of generalization to the worst case and the use of so-called meaning postulates
    to reduce intricate intentionalities back to extensional objects. Such a set-up
    was criticized in, among others, [PR83], where it was argued on the basis of evidence
    concerning scope ambiguities in natural language that a more flexible approach
    was called for.


    For a very thorough study of lifting in Montague grammar, see [Hen93]. More systematic
    intentionalization is studied from a logical point of view in [KF88]. A more systematic
    approach is in [Ben88], where the lift from $t$ to $s \rightarrow t$ is analyzed.
    A proposal for a modular approach to intentionalization of lexical entries, can
    be found in [BAW70]. The treatment in the present chapter is based on an improved
    proposal that resulted from discussion between De Groot, Kanazawa, and Muskens
    as documented in the unpublished note [Kan09].


    All approaches to intentionality are based on possible worlds. This has a well-known
    drawback, the so-called omniscience problem: if $\psi$ is a logical consequence
    of $\phi$, and $\phi$ is true in some possible world $w$, then $\psi$ has to be
    true in $w$ as well. This is a serious problem for the analysis of propositional
    attitudes in terms of possible worlds. Take the attitude of knowing. If I know
    that a prime number is a natural number that has no proper divisors except 1 and
    itself, does it follow that I know that $2^{31} - 1$ is a prime number? In reality
    it does not. That $2^{31} - 1$ is a mathematical truth, but also a fact that had
    to be discovered. It was discovered by the great mathematician Leonard Euler in
    1750.


    Consider Frege’s example of the two descriptions of the centroid of a triangle:
    ‘the intersection of $a$ and $b''$’ and ‘the intersection of $b$ and $c''$’. In
    all possible worlds where the Euclidean axioms hold, these two descriptions will
    refer to the same point, for it is a theorem of Euclidean geometry that the three
    medians of a triangle intersect in the same point. In possible worlds, Frege’s
    two descriptions mean that intention does not work for cases as an explication
    of *sense*, for it is clear that the two descriptions have a different sense.
    It turns out to be possible to give a treatment of intentionality that avoids
    this problem, within the theory of types. However, however, is beyond the scope
    of our book. See [Mus07] for further details.'
