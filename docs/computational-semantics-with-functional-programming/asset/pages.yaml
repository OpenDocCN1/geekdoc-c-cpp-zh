  md: '# 9.4 Features and Categories


    # 9.4 Features and Categories


    Syntactic features are important in most syntactic formalisms for natural language
    analysis. We will develop a simple feature system for a small fragment of English.


    There are two opposing views of feature agreement. According to the first view,
    the features of a syntactic component are computed in some way by the features
    of a ‘controlling’ component. Call this the derivation view on feature agreement.
    On this view there is a strict distinction between source and target of feature
    agreement. According to the second view, features of syntactic structures are
    partially specified by the constituents of the structure by a constraint handling
    mechanism. On this view, feature agreement has neither source nor target, but
    is the result of compatibility checks between syntactic constituents. The second
    view is presented in so-called unification approaches to syntax. See, e.g., [PS87,
    PS94]. It is also possible to combine the two mechanisms, and let feature agreement
    be a matter of compatibility checking and control.


    Implementing the control view is easy in a functional approach: just define the
    feature set of a component in terms of a function from the feature set of the
    source of the agreement. To implement the constraint view we need a function for
    checking compatibility between feature lists. In the implementation below, we
    will mix the two approaches.


    Whatever we implement, if we add it to a context-free grammar, the result will
    again be a context-free grammar. Consider the simple case where there is just
    a feature for number. Then the simple rule S ⟶ NP VP is replaced by the following
    set:


    ```

    S₀ \\→ NP{Sg} VP₀

    S₀ \\→ NP{Sp} VP{Sg}

    S₀ \\→ NP[Pi] VP₀

    S₀ \\→ NP[Pi] VP{Pi}

    ```


    Adding a feature mechanism to a context-free grammar boils down to replacing rules
    of the form A ⟶ B C by rules of the form Aj ⟶ Bg Ch, and similarly for rules with
    different numbers of right-hand side items. Here, f, g, and h are sets of features,
    with the feature handling determining their shapes. Since the feature sets are
    all finite, this boils down to replacing each terminal T by a finite set of terminals
    Tj, and each terminal N by a finite set of nonterminals Nf. The resulting grammar
    will still be a finite set of context-free rules. This shows that a context-free
    grammar with features can be seen as an abbreviation of a context-free grammar
    without features but with a much larger rule set.


    We will start with defining a number of useful features. A principled approach'
