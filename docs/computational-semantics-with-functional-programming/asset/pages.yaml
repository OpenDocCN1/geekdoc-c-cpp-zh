  md: '# 310 Discourse Representation and Context


    This is very compact notation indeed, and it is worthwhile to have a closer look
    at what happens in (12.6). $P$ and $Q$ are variables for the restriction and the
    body of the indefinite determiner. These variables are of the type of pointers
    into context transitions, abbreviated as $K$. The input context is represented
    by $c$, and $E$ extends this context with a new element. The index $i$ points
    to this new element, for the input context $c$ runs from $c[0]$ to $|c|-1$, and
    $i$ is set equal to $|c|$. So what it is that the input context $c$ can be extended
    with a new element, and this new element will satisfy both $P$ and $Q$, and it
    will remain accessible for future reference.


    Here is an operation that blocks future reference: context negation or dynamic
    negation. One way to express this in DRT is this:


    ![](img/27863720c158bdd744a04cbf0ba9e2de_326_0.png)


    The typed logical version is the following, where $\phi$ represents the embedded
    representation structure.


    ```

    $\phi := \lambda cc'' \to (c = c'' \wedge \neg \exists'''' \phi cc'''')$

    ```


    This defines a relation between input context $c$ and output context $c''$ where
    the input context equals the output context, and where there is no extension $c''''$
    of context $c$ for which $\phi$ holds.


    Similarly, we can define dynamic implication:


    ```

    $\phi \Rightarrow \psi := \lambda cc'' \to (c = c'' \wedge \forall cc2(\phi cc2
    \to \exists c3\psi cc2c3))$$

    ```


    Now the lexical entry for the determiner **every** can be defined in terms of
    dynamic implication, as follows:


    ```

    $\lambda PQc \to $(\exists i; Pi \to Qi)c$ where $i = |c|$. \quad (12.7)$

    ```


