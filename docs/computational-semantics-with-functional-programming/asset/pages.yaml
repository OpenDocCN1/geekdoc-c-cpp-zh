  md: '# The Composition of Meaning in Natural Language


    To illustrate the claim that first-order logic has no difficulty with quantifier
    combinations, consider the translation of example (7.1).


    > Every prince sang a ballad. (7.1)

    \forall x(Prince x \rightarrow \exists y(Ballad y \wedge Sing x y))


    Observe that the translation does not contain phrases corresponding to the noun
    phrases every prince or a ballad. Given a natural language sentence and its translation
    into first-order logic, it is impossible to pinpoint the sub-expression in the
    translation that gives the meaning of a particular noun phrase in the original.
    In the translation into first-order logic, the noun phrases have been syntactically
    eliminated, so to speak.


    The next example, (7.2), with the two possible translations listed below it, can
    serve to illustrate a few further points.


    > A ballad was sung by every prince. (7.2)

    \exists y(Ballad y \wedge \forall x(Prince x \rightarrow Sing x y))

    \forall x(Prince x \rightarrow \exists y(Ballad y \wedge Sing x y))


    The fact that both translations are appropriate for (7.2) shows that the sentence
    is ambiguous. It also shows that translating into first-order logic can be used
    to disambiguate natural language semantics. In such cases one says that the translations
    express different readings of the original sentence.


    In an early era of natural language semantics, the time when first-order predicate
    logic was still considered as the only tool for semantic analysis, quantified
    noun phrases were commonly regarded as systematically misleading expressions.
    Their natural language syntax did not correspond to their logic, for natural language
    they were separate constituents, but they evaporated during the process of translation
    into first-order logic.


    The Fregean view on quantifiers is a vast improvement over the Aristotelian view.
    Three areas with scope for further improvement remained: (i) finding logical representation
    languages permitting the preservation of noun phrases as constituents; (ii) finding
    procedures for translating natural language to logical representations that are
    not ad hoc, and (iii) finding ways to treat non-standard quantifiers such as most,
    preferably in a uniform framework with standard quantifiers.


