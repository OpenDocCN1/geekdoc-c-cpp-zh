  md: '# Foreword


    xi


    ductions to symbolic language processing. The authors motivate this choice by
    pointing out that much of symbolic computational linguistics consists, like many
    other types of computational problems, in defining the right data structures and
    the right functions that map one data structure (the one that presents the problem)
    to another (the one that presents its solution).


    Indeed, the first applications that are shown in the book are non-linguistic,
    and chosen solely for the purpose of giving the reader a good grasp of how Haskell
    works and what can be done with. From these first applications is a gradual progress,
    via applications that involve elementary forms of language processing (as such
    words in texts), to applications that belong to computational semantics. One important
    benefit of this way of easing into the subject is that it makes the reader aware
    of how much language processing has in common with problem solving and data processing
    tasks that do not involve language. On the face of it such might sit awkwardly
    with the cherished view of many linguists that our ability to acquire and use
    language is unique among the cognitive capacities we have; but I do not think
    that there is likely to be any real conflict. As demonstrated by the diversities
    of the actual algorithms and programs presented in this book, what similarities
    between linguistic and nonlinguistic processing there still leaves plenty of room
    for the cognitive distinctness and uniqueness of those algorithms that characterise
    the computational aspects of the human language capacity.


    Although the book starts from scratch, and nevertheless manages to penetrate into
    some of the more advanced areas of computational semantics: the final chapters
    present continuous semantics, discourse representation theory, and a system of
    dynamic epistemic logic that serves as a first step in the direction of a fully-fledged
    computational theory of verbal communication. And yet, this wide span notwithstanding,
    the book completes with current demands on texts in computational linguistics
    that it presents for every bit of theory that it introduces a Haskell implementation,
    which the reader can run herself and play with, if she downloads the relevant,
    freely available software. The same goes for the numerous implementation-related
    exercises. This means that the diligent student of this book will, by the time
    she gets to the end of it, have not only learned a good deal about syntax and
    semantics, but also acquired much of which distinguishes the computational from
    the theoretical linguist.


    All this goes to make this book into the important and innovative contribution
    to the field of computational semantics that I think it is. Most important of
    all is the influence that I believe and hope it will have on coming generations
    of computational linguists, by instilling in them the elements of sophisticated
    programming expertise at the same time introducing them to many aspects of theoretical
    lin-'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'linguistics, and conveying some of that passion for the structural aspects
    of language that makes theoretical linguistics a must and (sometimes) a source
    of satisfaction for the true linguist. It has been pointed out again and again
    that the practical potential of computational linguistics, and of computational
    semantics as an essential part of it, is immense. Still, it is fair to say that
    the practical achievements of computational semantics so far been quite limited.
    The reasons for that, I think, are two-fold. Automated symbolic processing of
    natural language is notoriously brittle: even where it is clear what should should
    compute, it often lacks the necessary resources, in particular wide coverage lexicons
    with substantive semantic information and world knowledge in accessible form.
    We still haven''t even properly understood yet what it is that should be computed.
    These are hard problems, which will be solved – to the extent that they can be
    solved at all – only by people who have the combination of skills that are presented
    and taught here as as parts that naturally fit into a coherent whole.


    HANS KAMP

    Professor of Formal Logic

    and Philosophy of Language,

    University of Stuttgart'
