    # 13.4 Presuppositions and Common Knowledge


    A presupposition of an utterance is an implicit assumption about the world or
    a background belief shared by speaker and hearer in a discourse. For example,
    an utterance of (13.1) presupposes that the dragon was not spitting before. (13.2)
    presupposes that you already asked the wizard. And the question in (13.3) presupposes
    that the name Jan refers to a male adult.


    ```

    The dragon began to spit fire. (13.1)

    You should ask the wizard again. (13.2)

    Is Jan a bachelor? (13.3)

    ```


    When these examples occur as parts of more complex sentences, their presuppositions
    behave in a very systematic way. If a sentence is embedded under a model like
    (13.4), its presupposition remains unchanged. Also negating a sentence, like in
    (13.5), does not affect the presupposition. However, once we explicitly state
    the presupposition as the condition of an implication, the presupposition disappears:
    (13.6) no longer presupposes that you have already asked the wizard.


    ```

    Maybe the dragon began to spit fire. (13.4)

    You should not ask the wizard again. (13.5)

    If you already asked the wizard, you should not ask him again. (13.6)

    ```


    If a complex sentence inherits a presupposition from one of its parts, we say
    that the presupposition projects. We will now give a formal analysis of presuppositions
    and question projection, but restricted to the propositional case. The only reason
    for this restriction is to keep things simple in our exposition.


