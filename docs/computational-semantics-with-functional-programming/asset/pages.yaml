  md: '274


    Handling Relations and Scoping


    verbs are provided with a theta grid in which the thematic roles are given that
    the verb assigns. The verb give, e.g., assigns three thematic roles, one for Agent,
    one for Goal, and one for Theme.


    Although thematic relations have been with us for a long time – early references
    for an analysis in terms of ‘abstract thematic roles’ : [Gru65] and [Jac72] –
    it seems to say that most linguistic work in tha theory is informal and perspective.
    Also, the theory of thematic roles has received relatively little attention from
    formal semanticists ([Dow89] as one of the exceptions). There is no general agreement
    on the nature of theta roles that should be distinguished. [Rei00] came with the
    proposal to link theta roles to feature clusters defined in terms of ±c (c for
    ‘cause’) and ±m (m for ‘mental’). There are 9 consistent subsets of the feature
    {+c, -c, +m, -m}, and they get linked to the following nine theta roles:


    | Agent | [+c + m] | Instrument | [+c - m] |

    | Experiencer | | Patient, Theme | [-c - m] |

    | Cause | [+c] | Animate | [+m] |

    | Source, Subject Matter | [-m] | Goal | [-c] |


    The thematic roles as are part of the link between language and reality (the realm
    of things outside language is about). To implement thematic roles by means of
    type constraints in semantics would be a mistake, for Little M kicked the door
    and Little M kicked Alice, the door and Alice are both in the thematic role of
    Patient, but this cannot be taken to imply that the door also have to be of the
    same kind (except in the trivial sense of being the type of things that can receive
    kicks).


    | 1 | 2 | 3 |

    | Agent | Goal | Theme |


    If Atreyu gives Dorothy a sword, then Atreyu is the agent, Dorothy is the goal,
    and the sword is the theme. Of course, this is just for illustration. There may
    also be a theta role for location or time, and perhaps there are other roles.
    In general, to interpret a predicate with n thematic roles, the predicate will
    get as its denote n-relation.


    For a rudimentary version of Theta Theory it is enough to be able to extract a
    new relation from a given relation by specifying a list of argument positions.
    For the implementation we will be able to pick the entity at index n from a list.
    For this, we use a predefined Haskell function. The only snag is that !! computes
    from index 0, whereas we would like to start at index 1.'
