  md: "# 5.2 Semantics of Propositional Logic\n\nIt is not difficult to see that there\
    \ are formulas $F$ for which the $V^+$ value does not depend on the $V$ value\
    \ of $F$. Formulas $F$ with the property $V^+(F) = 1$ for any $V$ are called tautologies.\
    \ The common notation for '$F$ is a tautology' is $\\models F$. Formulas $F$ with\
    \ the property that $V^+(F) = 0$ for any $V$ are called contradictions.\n\n**Exercise\
    \ 5.5** Explain why the negation of a tautology is always a contradiction, and\
    \ versa.\n\nA formula $F$ is *satisfiable* if there is at least one valuation\
    \ $V$ with $V^+(F) = 1$. A formula $F$ is called *contingent* if it is satisfiable\
    \ but not a tautology.\n\n**Exercise 5.6** Which of the following are satisfiable?\
    \ If a formula is satisfiable, should you give a valuation that satisfies it?\n\
    \n+   (1) $p \\wedge \neg q$\n(2) $p \\wedge \neg p$\n(3) $p \rightarrow \neg\
    \ q$\n\nClearly, every tautology is satisfiable, but not every satisfiable formula\
    \ is a tautology.\n\nTwo formulas $F_1$ and $F_2$ are *logically equivalent* if\
    \ $V^+(F_1) = V^+(F_2)$ for any $V$. Notation for '$F_1$ and $F_2$ are logically\
    \ equivalent' is $F_1 \\equiv F_2$.\n\nFurther on we will ignore the distinction\
    \ between a valuation $V$ and its extension $V^+$, and we will refer to both as\
    \ $V$.\n\n**Exercise 5.7** Which of the following are true?\n\n+   (1) $\neg p\
    \ \\equiv p$\n(2) $p \rightarrow q \\equiv \neg p \\vee q$\n(3) $(\neg (p \\leftrightarrow\
    \ q)) \\equiv \neg p \\wedge q$\n\nNote that from the definition of logical equivalence\
    \ that all tautologies are logically equivalent to one another, and so are all\
    \ contradictions.\n\nFormulas $P_1, \\dots, P_n$ logically imply $C$ ($P$ for\
    \ premise, $C$ for conclusion) if every valuation makes every member of $P_1,\
