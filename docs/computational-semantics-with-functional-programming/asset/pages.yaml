  md: 'Parsing an NP can be done in three ways: finding the NP on the input list,
    application of the rule NP → DET CN, and popping an NP from the extraction stack.


    ```

    prsNP :: SPARSER Cat Cat

    prsNP :: leafPS "NP" <| > nR <| | pop "NP"

