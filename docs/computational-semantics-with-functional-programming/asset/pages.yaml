  md: "# 4.5 Predicate Logic\n\n+   - $(Px \\wedge P'xx'') \\lor Rxx''$\n- $\\forall\
    \ xRx$\n- $\\exists x(Rxx' \\wedge Sxyx)$\n- $\\forall x\\forall x'((x = x') \\\
    wedge \neg(x' = x))$\n\n**Exercise 4.15** Prove that the formulas of this language\
    \ have the property of unique read-ability.\n\nThe symbol $\\forall$ is the symbol\
    \ for universal quantification; it means 'for all'. The symbol $\\exists$ expresses\
    \ existential quantification; it means 'exists'. Thus, $\\forall xRxx$ means that\
    \ everything the $R$ relation to itself, and $\\forall x\\exists x'Rxx'$ means\
    \ that for everything there is something which is R-ed by that first. Incidentally,\
    \ this paraphrase shows that the variable notation is quite handy. More information\
    \ about the semantics of first-order predicate logic will be given in Chapters\
    \ 5 and 6.\n\n**Exercise 4.16** Give a BNF grammar for a predicate logic language\
    \ with infinitely many predicate letters for every finite arity. (Hint: use \"\
    P''', P'''', ...\" for the set of three-place predicate letters, and so on.)\n\
    \nAgain, it is convenient to be lenient about notation. We will use\n\n$x, y,\
    \ z, x_1, y_1, z_1, x_2, y_2, z_2, \\dots$\n\nfor individual variables, and\n\n\
    $P, R, S, P_1, R_1, S_1, P_2, R_2, S_2, \\dots$\n\nfor predicate symbols, we use\
    \ the conventions for parentheses when they are not essential for disambiguation.\
    \ We will use the abbreviations $F_1 \to F_2$ for formulas of the form $(\neg\
    \ F_1 \\wedge \neg F_2)$, and $F_1 \\leftrightarrow F_2$ for formulas of the form\
    \ $(F_1 \to F_2) \\wedge (F_2 \to F_1)$.\n\nIn talking about logical formulas\
    \ we want to distinguish between the occurrences that are *bound* by a quantifier\
    \ in that formula and the occurrences that are not. Binding is a syntactic notion,\
    \ and it can simply simply stated as follows: in a formula $\\forall x F$ or $(\\\
    exists x F)$, the quantifier binds all occurrences of $x$ in $F$ that are not\
    \ bound by an occurrence of $\\forall x$ or $\\exists x$ inside $F$.\n\nAlternatively,\
    \ we can define it in terms of syntax trees: an occurrence of $\\forall x$ or\
    \ $(\\exists x)$ binds an occurrence of $x$ in $F$ if in the syntax tree for $F$\
    \ it c-commands $x$, and there are no other occurrences of $\\forall x$ or $\\\
    exists x$ that c-commands $x$. The notion of c-command is defined as follows:\
    \ node $a$ in a tree c-commands (i.e. 'constituent'-commands) node $b$ in tree\
    \ if the first branching node above $a$ dominates $b$, where a node $a$ dominates\
    \ $b$ in a syntax tree if there is a downward path through the tree leading"
