- img_proc: true
  md: '# Continuation Passing Style Semantics


    that value to some arbitrary other function that encodes ''what to do next''.
    Here is a general way of doing that:


    ```

    mkc :: (a -> b) -> a -> (b -> r) -> r

    mkc f next = next (f x)

    ```


    Let us use this for applying the powers of two function (2^) to an argument, and
    show us the result:


    ```

    CPSS> mkc (2^) 4 show

    "16"

    ```


    Similarly, we can apply the function to an argument, and next apply it again:


    ```

    CPSS> mkc (2^) 4 (2^)

    65536

    ```


    If we look more closely at mkc, we see that this function can be viewed as a combination
    of argument and argument raising, as follows:


    ```

    raise :: a -> (a -> r) -> r

    raise x = \ f -> f x

    ```


    ```

    mkc'' (a -> b) -> a -> (b -> r) -> r

    mkc'' f x = raise (f x)

    ```


    We see that raise lifts types to CPS values, the type of a CPS value being (a
    -> r) -> r. In other words: a CPS value is a thing that you have to apply a function
    of type a -> r in order to get a result of type r.


    Where have we seen this argument raising before? Exactly, this is how grammar
    deals with proper names to assimilate them to the type of generalized quantifiers.
    So if it is the case, Reynolds [93] claims, that continuations were invented over
    and over again in computer science, then the person who reinvented them for natural
    language semantics was, without doubt, Richard Montague.


    A typical use of continuation passing style programming is for implementing computations
    which can be interrupted. Error handling is a prime example. To see how this is
    done in Haskell we advise you to have a look at the Haskell Continuation monad.'
