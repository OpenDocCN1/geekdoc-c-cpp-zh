  md: '# 10.4 Flexible Types for NP Interpretations


    # 10.4 Flexible Types for NP Interpretations


    There is extensive semantic literature on the near for flexible type assignment
    to syntactic categories (see, e.g., [Hen93]). Many of the arguments for this have
    to do with the need to account for various scoping ambiguities resulting from
    the interaction of quantified NPs with other quantified NPs or with intensional
    verb contexts.


    Now note that the type REL a is flexible, for this type do duty for the role family
    of types a -> t, a -> t, and so on. We intend to use the flexible type REL for
    the interpretations of verbs, and we will perform a ‘flexible lift’ on NP interpretations,
    so that an NP can be viewed as an operation on verb meanings, i.e. as a function
    of type REL a -> REL a. For this perspective on the semantics of NPs, compare
    [Kee87, Kee92].


    Let''s define a type for generalized quantifier operations. We will call them
    KQ, for quantifier:


    ```

    type KQ a = REL -> REL a

    ```


    An important conversion function that we need is from a characteristic function
    of properties that maps relations to relations. We will use this to lift the type
    of NP interpretations.


    Consider the problem of applying a type (a -> Bool) -> Bool not to a property
    (type a -> Bool), but to a relation with arity > 1. Note that a -> Bool can be
    viewed as the type of a relation of arity 1, and Bool as the type of a relation
    of arity 0. Thus, (a -> Bool) -> Bool is the type of reduction of 1-ary to 0-ary
    relations.


    So how about the general case: the reductions of (n+1)-relations to n-ary relations?
    The general shape of a reduction of a relation (n+1) is


    > $$\lambda_1 \dots \lambda x_n \lambda_y \mapsto r$.$\ (10.5)


    Here, $r$ is a Boolean expression (i.e. of type Bool).

    Converting a property function $f$ into a relation transformer is by reducing
    that relation by recursion. If the argument has the form $\lambda y \mapsto r$,
    with $r$ of type Bool, then property function $f$ can be applied to it, yielding
    a Boolean $f (\lambda y \mapsto r)$. If the argument has the form $\lambda_1 \dots
    \lambda x_n \lambda x_y \mapsto r$, the new relation is given by (10.6).


    > $$\lambda_1 \dots \lambda x_n \mapsto f (\lambda y \mapsto r)$.$\ (10.6)


    So this is what reduction of a relation $\lambda_1 \dots \lambda x_n \lambda_y
    \mapsto r$ should yield. Our obvious next question is: how is the operation defined
    that yields this results?'
