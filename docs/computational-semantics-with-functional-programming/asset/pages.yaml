    # ## 12.8 Further Reading


    Dynamic semantics for natural language started with Hans Kamp''s paper on Representation
    Theory [Kam81] and the closely related PhD thesis of Irene Heim [Hei82]. Semantisists
    in the Montague tradition had qualms about the compositionality of this approach.
    This led to a radical reconstruction by Groendijk and Stokhof called dynamic logic
    (or: DPL) [GS91]. The dynamic predicate logic or DRT became the choice tool for
    incorporating discourse representation theory into Montague semantics; e.g., [Mus94,
    Mus96]. A synthesis proposal along different lines can be found in [EK97]. The
    mathematics of context and context extension has developed into a topic in its
    own right; see, e.g., [VV96].


    Incremental dynamics, in [Ej01], remains closer to Kamp''s one-variable version
    of sequence semantics for dynamic predicate logic proposed [Ver93]. Incremental
    dynamics is described in terms of polymorphic type theory in [Ej00]. This system
    makes clear how the instruction to task discourse references can be made fully
    precise by using the standardIPSET of (polymorphic) type theory. Such a reconstruction
    of DRT in type theory justifies the incrementality and the finite state semantics
    of the original.


    The proposal for the treatment of valence in the second fragment is an extension
    of the basic context logic. It should be compared with the treatment of pronoun
    resolution in DRT proposed in the second volume of [BB05], as well as with the
    earlier proposal for pronoun resolution in DRT in [WA86].


    Central claim of the centering theory of local coherence in [GS86, GJW95] is that
    pronouns are used to signal that the speaker contin-'
