  md: '# 11


    # Continuation Passing Style Semantics


    # Summary


    In this chapter we are going to show an alternative way of treating quantifiers
    and their scoping, based on the concept of continuations. Continuations in computer
    science abstract over the state of the computation, and add the future computation
    from the present state as an extra parameter. The chapter starts with a section
    on continuation style programming. Next, we move to applications in computational
    semantics. Continuations in computational linguistics abstract the linguistic
    context of an expression and introduce it as an explicit parameter in the meaning
    computation. We will see how computing with continuations will allow quantifiers
    in object position to scope over the whole sentence, and how quantifier scope
    ambiguities can be derived by imposing different regimes on the order in which
    the quantifier meanings are computed.


    ```

    module CPSS where


    import FSynF

    import Model

    import MCWPL

    ```


    # 11.1 Continuation Passing Style Programming


    To see how continuations work in Haskell, let us start with the simplest possible
    example: a function of type a -> b.


    To lift a function $f$ of this type to a continuation passing style (CPS) function
    means that instead of letting $f$ compute its value for some argument $x$, we
    pass'
