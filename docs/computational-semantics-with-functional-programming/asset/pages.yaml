    deal with a function symbol. If $f$ is a one-place function symbol, then $I$ should
    map $f$ to a unary operation on the domain $D$, i.e. to a function $I(f): D \rightarrow
    D$. In general it holds that if $f$ is an $n$-place function symbol, then $I$
    should map $f$ to $n$-ary operation on the domain $D$, i.e. to a function $I(f):
    D^n \rightarrow D$. We use $C$ for the set of zero-place function symbols; these
    are the constants of the language, and we have that if $c \in C$ then $I(c) \in
    D$.


    Instead of the assignment function $g$ for variables we now need a value function
    $g$ for functional terms, defined as follows (note the recursion in the definition):


    ```

    $g_{I,g}(t) = \begin{cases} I(t) & \text{if } t \in C \ g(t) & \text{if } t \in
    V \ I(f)(g_{I,g}(t_1), \dots, g_{I,g}(t_n)) & \text{if } t \text{ has the form
    } f(t_1, \dots, t_n). \end{cases}$

    ```


    This value is used in the truth definition, but we leaves the details to you:


    **Exercise 5.23** Write out the truth definition for predicate logical languages
    with function constants.


    An important aim of any logic language is to study the process of valid reasoning
    in that language. Every logical language comes with an appropriate notion of ''valid
    consequence'' for that language. Intuitively, when we can draw a conclusion $C$
    from premises $P_1, \dots, P_n$? When is it inconceivable that the premises are
    true and the conclusion false, or in other words when the truth of the premises
    brings the truth of the conclusion in its wake.


    Now that we have a fully precise notion of truth for predicate logic we can use
    to make the intuitive notion of valid consequence fully precise too. We say that
    a predicate logical sentence $C$ logically follows from a predicate logical sentence
    $P$ ($P$ for premise and $C$ for conclusion); we also say that $P$ logically implies
    $C$ if every model that makes $P$ true makes $C$ true. Notation for ''P logically
    implies $C$'' is $P \models C$.


    How do we judge the statements of the form $P \models C$ (where $P$ and $C$ are
    closed formulas of predicate logic)? It is clear how we refute the statement $P
    \models C$, namely by finding a *counterexample*. A counterexample to $P \models
    C$ is a model $M$ with $M \models P$ but not $M \models C$, or in abbreviation
    notation: $M \notmodels C$. Here are some examples about valid consequence in
    predicate logic.


    **Exercise 5.24** Which of the following statements hold, then you should explain
    why. If a statement hold? If it does not, then you should give a counterexample.


    +   (1) $\forall x Px \models \exists x Px$

    (2) $\exists y \forall x Rxy \models \exists x Rxx$

    (3) $\exists y \forall x Rxy \models \forall x \exists y Rxy$'
