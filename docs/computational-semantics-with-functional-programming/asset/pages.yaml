    # 12.2 Abstraction over Context


    The essence of the solution to the merge problem is abstraction over context.
    If we take context to be simple finite lists of reference markers, then context
    abstraction can take the following form:


    ![](img/27863720c158bdd744a04cbf0ba9e2de_324_0.png)


    Contexts are lists of reference markers; these reference markers serve to encode
    discourse information, and allow the discourse participants to keep track of the
    topics of discourse.


    Order of discourse topics is relevant: topics mentioned most recently are (other
    things being equal) more readily accessible for reference resolution. Order of
    reference markers can be used as a measure for *salience*. A topic (or its marker)
    is more salient than another if it is more prominent on the list of candidates
    for reference resolution. For reference resolution, information of the following
    is needed:


    +   - gender and number information,

    - actor focus (agent of the sentence),

    - discourse focus (‘what is talked about’ in the sentence).


    Instead of giving a full account, we will sketch the basics, but in such a way
    that the reader can easily work out further details.


    So does abstraction over context work? Starting out from Incremental Dynamics
    [Eij01], which is the one-variable version of Vermeulen’s sequence semantics [Ver93],
    we represent a context as a stack of items. Here is an example:'
