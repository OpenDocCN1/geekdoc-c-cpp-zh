    = s(2) = 2 \cup \{2\} = \{0, 1\} \cup \{2\} = \{0, 1, 2\}$,$\n- and so on.


    Every natural number $n$ equals the set of all its predecessor numbers. Therefore,
    if $n$ is a natural number, $j \in n$ means the same as $j \in \{0, \dots, n-1\}$.
    But if you don''t care about Von Neumann numbers, that is perfectly fine with
