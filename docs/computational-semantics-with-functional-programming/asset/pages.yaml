  md: "# Continuation Passing Style Semantics\n\nlinguistic context is Alice _. Specify\
    \ the denotation of helped Dorothy and its type along the above lines, and do\
    \ the same also for Alice helped.\n\nWe will call the meaning of the linguistic\
    \ context of an expression continuation. The notion stems from computer science.\
    \ There are continuations used for giving a compositional semantics of programs\
    \ that exhibit noncompositional effects like jumps and exceptions. It serves the\
    \ same purpose we used for: it captures the context of an expression and provides\
    \ it to the computation as a function.\n\nThe general type of the continuation\
    \ of an expression type $\tau \\to r$, with $r$ being the type of result values.\n\
    \nAt this point two remarks, note that the continuation of an expression is not\
    \ fixed. For example the linguistic context of Alice in the sentence Alice helped\
    \ Dorothy differs from the linguistic context of Alice in The princess that admired\
    \ Alice.\n\nSecond, we need to ask what exactly the linguistic context is. Up\
    \ to now we implicitly assumed that it is the sentence expression occurs in. However,\
    \ this is not precise enough. Consider the following sentence:\n\n> If Alice helped\
    \ Dorothy, then she cheered. (11.1)\n\nWhat is the sentence expression Alice appears?\
    \ Is it the whole sentence (11.1), or is it only the embedded sentence Alice helped\
    \ Dorothy? If we decide for the former, we will not have solved our problem but\
    \ encounter it again in the following sentence:\n\n> If Alice helped Dorothy,\
    \ then she cheered,\n if Alice kicked Dorothy, then she did not. (11.2)\n\nDo\
    \ we now decide for the $if$-clause we had before, or do we again decide for the\
    \ whole sentence (11.2)? Then, is (11.3) the same like (11.2)? And if so, aren't\
    \ we talking about texts and not about simple sentences?\n\n> If Alice helped\
    \ Dorothy, then she cheered.\n if Alice kicked Dorothy, then she did not. (11.3)\n\
    \nIn order to avoid these ramblings and instead have a precise delimitation of\
    \ the linguistic context of an expression, we specify the linguistic context as\
    \ being the linguistic context up to the nearest enclosing sentence. So in all\
    \ three examples above, the linguistic context of the first occurrence of Alice\
    \ is the embedded sentence Alice helped Dorothy.\n\nSpecifying the linguistic\
    \ context as the next enclosing sentence now specifies the result values as sentence\
    \ denotations. This, in turn, specifies the result type"
