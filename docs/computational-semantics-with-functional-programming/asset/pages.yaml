    # ## Communication as Informative Action


    # ### Summary


    A theory of communication should provide accounts of changes in the state of information
    of a group of discourse participants, on the basis of message exchange within
    the group. This chapter gives an introduction to the way this is done in dynamic
    epistemic logic, focussing on the relevance of this work for semantics and pragmatics
    of natural language.


