    Together these allow us to express that a certain relation is an equivalence relation.
    In model logic, such a relation is called an S5 relation:


    ```

    isS5 :: Eq a => [a] -> Rel a -> Bool

    isS5 xs r = reflR xs && transR r && symymmR r

