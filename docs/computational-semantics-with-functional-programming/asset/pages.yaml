    For a general treatment, we assume that terminal symbols have type a, and parse
    objects have type b. Never mind what a parse object is; a parse object is simply
    a thing produced by a parser (e.g. a tree). We will assume that the parser works
    in a recursive descent fashion, as follows. The parser scans a list of tokens
    (objects of type a), and to construct parse objects of type b from a prefix of
    the input list, leaving the remainder of the input list for further processing.
    The outcome of the process is the list of all pairs [b, [a]] that the parser can
    construct. Parse failure is indicated by return of []. This gives the following
    type for a parser of type a:


    ```

    type Parser b = [a] -> [(b,[a]]

    ```


    The parser uses the grammar rules in a recursive way, starting from the start
    symbol of the grammar, and working towards the terminals. It will turn out that
    this can be done by means of a small set of elementary parsing functions and combinations
    of such parsing functions. We will only use standard language constructs, so we
    will not need anything that was not already introduced.


