    We use it for defining a function that collects the results of a list of parsers
    operating one after the other:


    ```

    collect :: [Parser a b] -> Parser a [b]

    collect [] = succeed []

    collect (p:ps) = p <:> collect ps

    ```


    Instead of an S-parser as pNP <*> pVP, like above, we can now define it as collect
    [pNP,pVP]. Finally, we also want to construct a parser tree. For that, we use
    a parser parseAs, which builds and labels non-leaf nodes. The parser parseAs takes
    its first argument as a nonterminal (the label), and as second argument a list
    of parsers. To handle a rule A → B1 · Bn, the function parseAs takes as its input
    A, and assumes that a list of parsers for B1 · Bn has been constructed.


    ```

    parseAs :: b -> [PARSER a b] -> PARSER a b

    parseAs label ps = (\ xs -> Branch label xs) $<> collect ps

    ```


