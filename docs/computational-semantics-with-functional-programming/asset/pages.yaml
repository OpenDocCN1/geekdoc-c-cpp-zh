  md: "# The Composition of Meaning in Natural Language\n\nA quantifier is called\
    \ first-order definable if it is definable in terms of the Fregean quantifiers\
    \  ∀ and =, and the predicates for the restriction and the body of the quantifier.\
    \ The question of first-order definability is relevant for the semantics of natural\
    \ language, because the suitability of logical representation languages depends\
    \ on it. It is a formal characterization of the first-order definable quantifiers:\n\
    \nThe first-order definable quantifiers are exactly those that can be computed\
    \ by an cyclic permutation-invariant finite state machine [Ben86].\n\nIt follows\
    \ from this that an even number of is not first-order definable (a cyclic automaton\
    \ is needed for computation), nor are quantifiers like half and most, which cannot\
    \ be computed on a finite state machine at all (a memory stack is needed to 'remember'\
    \ the numbers of elements in A – B and A ∩ B).\n\n**Exercise 7.12** The automata\
