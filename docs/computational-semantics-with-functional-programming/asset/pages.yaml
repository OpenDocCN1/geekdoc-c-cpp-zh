  md: '# Formal Study of Natural Language


    Formal languages are often designed by query tools or reasoning tools, or at least
    tools for formal reconstructions of reasoning processes. Therefore, they are a
    natural focus point for the formal study of language.


    One can look at it like this. Suppose we want to use language to communicate basic
    facts, like ''the sun is shining'', ''it is cold'', ''it is raining'', and so
    on. If you want to deny such a fact, you need to be able to say a thing like ''it
    is not cold''. You might also wish to express your uncertainty about which of
    two facts is the case, so you might like to say ''either it is cold or it is raining''.
    Similarly, you might like to say ''it is cold and rains'', or: ''if it rains,
    then it is cold''. The ingredients of just about the simplest kind of communication
    are: basic facts, negations, junctions, disjunctions, and implications. A fragment
    of natural language that has this is already quite useful. In fact, the usefulness
    of this simple fragment has been evident to logicians for a long time. The study
    of what can be expressed in this fragment is called propositional logic, or Boolean
    logic, by the British mathematician George Boole (1815–1864).


    To see how propositional logic can be used to express what goes in simple communicative
    discourses, suppose we want talk about basic facts a, b. Suppose we know nothing
    about whether these facts are true or not. Then for you there are four possibilities:
    both facts are true, both facts are false, the first fact is true and the second
    one is false, or the first fact is false and the second one is true. Now we tell
    you ''a'' or ''b''. If you believe us, this will allow you to rule out one of
    the four possibilities, the possibility both a and b are false. Or if you take
    our statement in the exclusive sense, it will even allow you to rule out two of
    the four possibilities. Your knowledge gained by elimination of possibilities.


    **Exercise 1.1** We see that (complete) ignorance about the truth or falsity of
    two facts can be modelled as uncertainty between four possibilities. Now suppose
    there are ten basic facts. How many possibilities would that give? How about the
    general case of n basic facts?


    If you want to study simple factual information exchange, it makes sense to focus
    on the fragment of natural language that can be translated into propositional
    logic. But suppose you want to be more explicit about expressing relations between
    things. If you wish to declare your love to someone, then stating a basic proposition
    like ''there is love'' might not articulate enough. You might wish to say something
    daring, ''I love you''. Talk like this expresses relations between subjects and
    objects. You can use pronouns ''I'' and ''you'', but also proper names. You can
    still do the propositional stuff, with disjunctions, negations, but you can also
    express quantational facts. You can use the power of quantification to add to
    your romantic declaration, strengthening it to ''I love no one but you''. You
    are now in the realm that is called predicate logic.'
