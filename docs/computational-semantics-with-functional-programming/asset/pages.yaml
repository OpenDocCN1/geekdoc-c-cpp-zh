    Derivational ambiguities, finally, are very much a logician''s ploy. In an essay
    on philosophical logic by Peter Thomas they are introduced as follows:


    [...] when we pass from "Kate/ is loved by "Tom" to "Some girl is loved by every
    boy", so it makes a big difference whether we first replace "Kate" with "some
    girl" (so as to get the predicable girl is loved by—into the proposition) and
    replace "Tom" by "every boy", or rather replace "Tom" by "every boy" (so as to
    get the predicable—is loved by—into the proposition) and replace "Kate" by "some
    girl". Two propositions are reached from the same starting point by the set of
    logical procedures (e.g. substitutions) may nevertheless differ in import because
    these procedures are taken to occur in a different order. [Gea80, Section 64]


    This is exactly the mechanism that has been proposed by Richard Montague to account
    for operator-scope ambiguities in natural language. Montague introduces a rule
    for quantifier-in of noun phrases in incomplete syntactic structures. The wide
    scope $\exists$ reading for *Every prince sang some ballad* is derived using a
    rule $Q_i$ to quantify in syntactic index $i$ in the structure *Every prince sang
    REF$_i$*. In more complex cases, where more than one occurrence of REF$_i$ is,
    the appropriate occurrence is replaced by the noun phrase, and the others are
    replaced by pronouns or reflexives with the right syntactic agreement features.
    [Mon73] for details.


    A rudimentary version of quantifying-in, for the present fragment, would look
    like this. We extend the syntax with dummy pronouns REF$_i$ ($i$ a natural number
    which serves as an index), with a matching semantics, where a correspondingly
    indexed variable of type $e$ is used. Next we add an indexed rule $Q_i$ that combines
    an NP with a sentence S containing precisely one occurrence of REF$_i$ (notation
    for this: S[REF$_i$]), and replaces occurrence by an occurrence of the NP (notation:
    S[REF$_$/NP]). The translation instruction uses the fact that the sentence translation
    contains a free variable $x_i$ resulting from the presence of the dummy pronoun'
