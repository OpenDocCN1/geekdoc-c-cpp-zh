    The stack parser that handles NPs should take the so-called island constraints
    on extraction (first proposed in [Ros67]) into account. Islands are domains out
    of which extraction is not possible. One example are relative clauses inside an
    NP. Ross proposed the Complex NP Constraint, which rules out configurations of
    the form


    > $\dots that_i \dots [NP_j \dots [REL that_j [s_i \dots t_i \dots t_j]]]$.


    The constraint is imposed to rule out examples like (9.3).


    > *Dorothy admired the princess that$_i$ [Goldilocks helped [NP the boy that$_j$
    [t_i$ gave the sword to $t_j$]]. (9.3)


    **Exercise 9.11** Some linguists would claim that the complex NP constraint explains
    the ungrammaticality of (9.3). Other linguists might counter that the complex
    NP constraint is just a *description*, and descriptions never explain anything.
    Which side are you on in this debate? Discuss.'
