  md: "# 9.7 Handling Extractions\n\nThe function succeedS implements a stack parser\
    \ for immediate success:\n\n```\nsucceedS :: b -> StackParser a b\nsucceedS r\
    \ us xs := [(r,us,xs)]\n```\n\nThe operation <: and the function succeedS can\
    \ be used to construct the\nstack parser version of the many parser:\n\n```\n\
    manyS :: StackParser a b -> StackParser a [b]\nmanyS p = (p <:> manyS p) <| succeedS\
    \ []\n```\n\nThe two fundamental stack operations are (i) pushing a new item on\
    \ the stack,\nand (ii) popping the top item from a non-empty stack. Push creates\
    \ a new\nparser from a category and an existing stack parser:\n\n```\npush ::\
    \ Cat -> SPARSER Cat -> SPARSER Cat Cat\npush c stack = p (c:stack)\n```\n\nPop\
    \ checks whether the category label of the top element on the stack matches\n\
    a given label and, if so, creates a leaf tree for that element. If the extraction\
    \ stack\nis empty, the parse fails. \n\n```\npop :: CatLabel -> SPARSER Cat Cat\n\
    pop c [] xs = []\npop c (u:us) xs | catLabel u == c = [(Leaf u, us, xs)]\n| otherwise\
    \ = []\n```\n\nA stack parser for recognizing a category on the input list can\
    \ be implemented\nas follows.\n\n```\nleafPS :: CatLabel -> SPARSER Cat Cat\n\
    leafPS 1 [] = []\nleafPS 1 s (c:cs) = [(Leaf c,s,cs) | catLabel c == 1 ]\n```"
