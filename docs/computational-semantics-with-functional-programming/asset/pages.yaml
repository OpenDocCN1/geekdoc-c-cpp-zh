  md: '# 1


    # Formal Study of Natural Language


    # Summary


    This chapter introduces computational semantics as the art and science of computational
    meanings for the expressions of a language. The chapter starts with a general
    overview of the formal study of language. The broad areas of syntax, semantics
    and pragmatics are distinguished, and the concept of meaning is discussed. Since
    the book will focus on language as a tool for describing states of affairs and
    for conveying information, since logicians have designed special purpose tools
    for just tasks, logic will be important to us. The chapter emphasizes the similarities
    between natural languages and the formal languages that have been designed by
    logicians and computer scientists. The chapter ends with a discussion of the usefulness
    of (functional) programming for computational semantics, and with an overview
    of the rest of the book.


    # 1.1 The Study of Natural Language


    Language is one of the most remarkable capacities of human beings and one of the
    distinctive features that set us apart from other inhabitants of this planet.
    Human languages are sophisticated systems for manipulating information-encoding
    symbols, and for composing sounds into structured expressions such as words, phrases,
    and sentences. These expressions can then serve in numerous ways for communicative
    actions information exchange, persuading and deceiving, expressing thoughts, reasoning,
    and much more.


    Linguistics is the scientific study of natural language. To make linguistics into
    a science it is necessary to specify the object of study. In his book Syntactic
    Structures (1957) the linguist Noam Chomsky made the influential proposal to identify
    a human language with the set of all correct (or: grammatical) sentences of that
    language. This idealization abstracts from cognitive limitations of language users.
    Chomsky called the ability of language users to recognize the members of this
    set,'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'at least in principle, competence, and he distinguished this from performance,
    the actual abilities of language users, affected by conditions like memory limitations,
    distraction, and errors. In this book we will make the same distinction. We will
    focus on studying competence and therefore assume that a particular language is
    given to us as a set of sentences.


    What makes us competent speakers of our language? What is linguistic knowledge?
    It is certainly something we have limited access to. For most speakers speakers
    and regularities of their tongue are intuitive. They know how to apply them correctly,
    but when asked to state them, they usually are at a loss. Explicit descriptions
    of the rules and regularities of a language are called grammars. Grammars can
    be viewed as models of our language competence.


    How grammars are represented as a cognitive device in the brain of the language
    user, we have no way of knowing. As a matter of fact, grammars can be represented
    in many different ways. In everyday life we encounter them, for example in dictionaries,
    online language references, and in textbooks for learning languages. Their design
    differs with their purpose. Grammars for learning usually follow pedagogical guidelines
    and may oversimplify rules used in linguistics us. They may start with specifying
    basic elements such as sounds, words, and meanings. They then state rules for
    how to combine these into more complex expressions. Usually there are various
    representation levels, in accordance with the subdisciplines of grammar theory:


    +   - Phonology explores the smallest meaning-distinguishing units (sounds) that
    are and how they are combined into the smallest meaning-carrying units (morphemes).

    - Morphology is concerned with how morphemes are combined into words.

    - Syntax studies how words are combined into phrases and sentences.

    - Semantics investigates meanings of basic expressions and how meaning is assigned
    to complex expressions based on the meaning of simpler expressions and syntactic
    structure.


    In this book, we will not be concerned with all of morphology, and we will also
    concentrate on linguistic form at the level of phrases and sentences. That means
    we will start with words as building blocks. The main task then will be to develop
    a grammar that provides us with notions of syntactic well-formedness and syntactic
    structure, and allows us to develop the notion of meaning for well-formed structures.
    Thus, our grammars


    +   - should be capable of building exactly those expressions that are well-formed
    in the language of our choice,'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# 1.2 Syntax, Semantics, and Pragmatics


    +   - should determine the constituents of complex linguistics expressions, as
    well as their internal structure,

    - and should allow us to assign appropriate meanings syntactically well-formed
    expressions, on the basis of their structure.


    In other words, the notion of syntactic well-formedness allows us to determine
    whether a particular expression is indeed a well-formed expression of a given
    category, and to determine its internal structure. The structure in turn will
    help us to relate the linguistic forms to the extralinguistic world (what they
    are about).


    # 1.2 Syntax, Semantics, and Pragmatics


    A basic trichotomy in the study of language is between syntax, semantics, and
    pragmatics. Roughly speaking, syntax concerns the form aspect of language, semantics
    its meaning aspect, and its use. Developing insight about the semantics of a language
    presupposes knowledge of the syntax of that language; study of language presupposes
    knowledge about both syntax and semantics. It is not surprising, then for lots
    of languages we know more about their syntax and semantics than pragmatic aspects
    of their use. Here are approximate definitions of the three notions:


    **Syntax** is the study of strings and the structure imposed on them by grammars
    generating them.


    **Semantics** is the study of the relation between strings and their meanings,
    i.e. their relation with the extralinguistic structure they are about.


    **Pragmatics** is the study of the use of meaningful strings to communicate about
    extralinguistic structure in an interaction process between users of the language.


    In a slogan: syntax studies Form, semantics studies Form + Content, and pragmatics
    studies Form + Content + Use. In this chapter we will examine what can be said
    about this trichotomy in concrete cases.


    It is a matter of what is to be taken as ‘form’ in natural language. In the following
    we will concentrate on written language, more specifically on well-formed sentences.
    Thus, we will look at languages as sets of symbols from some alphabet.


    This makes it particularly easy to bridge the gap between formal and natural languages,
    for formal languages can also be viewed as sets of strings. The difference between
    natural and formal languages lies in the manner in which the sets of strings are
    given. In the case of formal languages, the language is given by stipulative definition:
