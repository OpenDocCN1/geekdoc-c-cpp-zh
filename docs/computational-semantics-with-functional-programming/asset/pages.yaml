  md: '# 3

    Functional Programming with Haskell


    # Summary


    In this chapter we introduce the computational toolset that we are going to use
    throughout the book: the programming language Haskell. No prior knowledge of programming
    is assumed; you will learn everything you need to know about Haskell and (functional)
    programming as we go along.


    # 3.1 The Programming Language Haskell


    As a functional programming language, Haskell is a member of the Lisp family,
    as Scheme, ML, Occam, Clean, and Erlang. It was designed to form a standard for
    functional programming languages and was named after the mathematician and logician
    Haskell B. Curry. We already mentioned that it is based on the lambda calculus,
    just like the other family members. In fact, Haskell is so faithful to its origins
    that it is purely functional, i.e. functions in Haskell do not have any side effects.
    (However, there is a way to perform computations with side effects, like change
    of state, in a purely functional fashion. We will come across this later in the
    book, but it will not be of concern for us now.)


    Two very important characteristic features of Haskell are the following. First,
    functions are first-class citizens. This means that functions can be passed as
    arguments to other functions and also can be returned as the result of some function.
    Second, functions are permitted to be recursive. The significance of this we will
    see in Section 3.5. And third, arguments of functions are only evaluated when
    needed, if at all. This is called *lazy evaluation* and it allows the use of infinite
    and partially-defined data structures. We will see some examples of infinite lists
    in Section 3.6.'
