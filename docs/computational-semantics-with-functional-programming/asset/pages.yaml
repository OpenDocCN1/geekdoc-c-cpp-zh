  md: '# Preface


    This book on applications of logic in the semantic analysis of language pays the
    reader the compliment of not assuming anything about what he or she knows (in
    particular, no specific logical knowledge or experience with programming is pre-supposed),
    while making very flattering assumptions about him or her intelligence and interest
    in the subject matter.


    The method used throughout the book is the pursuit of logical questions and implementation
    issues occasioned by concrete examples of formally defined language fragments.
    At first, no distinction is made between formal and natural language; in the first
    chapter it is explained why. At the end of the text the reader should have acquired
    enough knowledge and skills for the development of (at least the semantic part)
    of serious Natural Language Processing applications. The reader who makes it to
    the end of the book will also find that he or she has acquired considerable programming
    skills, and will have learned how to put a wide variety of logical systems to
    use for natural language analysis.


    Throughout the text, abstract concepts are linked to concrete representations
    in the functional programming language Haskell. Haskell is a language that is
    well suited for our purposes because it comes with a variety of very useful interpreters:
    Hugs, GHCI, and Helium. Haskell interpreters, compilers, and documentation are
    freely available from the Internet.† Everything one has to understand the programs
    in the book is explained as we go along, but we do not cover every aspect of the
    language. Further on we will mention various good introductions to Haskell. The
    only thing we assume is that the reader is able to retrieve the appropriate software
    from the Internet, and that he or she is acquainted with the use of a text editor
    for the creation and modification of programming code.


    The book is intended for linguists who want to know more about logic, including


    > † See http://www.haskell.org'
