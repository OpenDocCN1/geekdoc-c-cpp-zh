    # 12.3 Introducing the Continuant


    The following combinator $G$ lifts the type of context transitions $[e] \to [e]
    \to t$ to the type of a map from contexts to continuations $[e] \to ([e] \to t)
    \to t$.


    ```

    $G = \lambda \phi Pc \mapsto \exists c''(\\phi ccc'' \wedge Pc'')$

    ```


    Call this continuized context transition. A continuized context transition can
    be viewed as a relation between contexts and context properties (type $[e] \to
    t$). Its first argument is an input context, and its second argument is a property
    of output contexts, for encoding ''what to do next with the output context''.


    The recipe for composing continuized context transitions is as follows:


    ```

    $\lambda\Phi\Psi Pc \mapsto (\Phi\lambda c \mapsto \Psi Pc)$ (12.11)

    ```


    So we lift the context transition (12.9) to its continuized counterpart:


    ```

    $\lambda cc'' \mapsto \exists x(Man x \wedge Enter x \wedge c''x = c'')$

    ```


    This reduces to:


    ```

    $\lambda Pc \mapsto \exists x(Man x \wedge Enter x \wedge c''x = c'' \wedge Pc'')$

    ```


    By equality reasoning, we can simplify this further to:


    ```

    $\lambda Pc \mapsto \exists x(Man x \wedge Enter x \wedge P(c''x))$

    ```


    In a similar fashion, continuing (12.10) will give us:


    ```

    $\lambda Pc \mapsto \exists x(Man x \wedge Leave x \wedge P(c''x))$

    ```


    Next, combine these two continuized context transitions with recipe (12.11) for
    composing them:


    ```

    $\lambda Pc \mapsto (\lambda Pc \mapsto \exists x(Man x \wedge Enter x \wedge
    P(c''x))c\\\\(\lambda c \mapsto (\lambda Pc \mapsto \exists x(Man x \wedge Leave
    x \wedge P(c''x)))cPc$

    ```'
