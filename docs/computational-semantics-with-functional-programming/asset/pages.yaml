  md: '# Formal Syntax for Fragments


    To capture some of the internal structure of sentences like this, in particular
    the role of predication and quantifiers, we now turn to predicate logic. Predicate
    logic is an extension of propositional logic with structured basic propositions
    and quantifications.


    +   - A structured basic proposition consists of an n-ary predicate followed by
    n variables.

    - A universally quantified formula consists of the symbol ∀ followed by a variable
    followed by a formula.

    - An existentially quantified formula consists of the symbol ∃ followed by a variable
    followed by a formula.

    - Other ingredients are as in propositional logic.


    Other names for predicate logic are first-order logic or first-order predicate
    logic. ''First-order'' indicates that the quantification is over entities (objects
    of the first order).


    We will now give a formal definition of the language of predicate logic, on the
    assumption that predicates combine with at most three variables. More formally,
    we assume that the predicates have arity less or equal to 3. What means that we
    can refer to one-place relations or properties (such as the property of being
    happy, or being an even number), to two-place relations (such as the relation
    ''greater than'' between numbers, or the relation ''older than'' between people),
    and to three-place relations (such as the relation of giving, which has a subject,
    an object and a recipient or indirect object), but not to relations with more
    than three arguments. Relations with more than three arguments are hardly ever
    needed, anyway.


    Here is the definition of the language of predicate logic with infinitely many
    one-place predicates, infinitely many two-placed predicates, and infinitely many-placed
    predicates:


    ```

    v → x | y|z | v''

    P → P | P''

    R → R | R''

    S → S | S''

    atom → P v | R v | S v v

    F → atom | (v = v) | ¬F | (F ∧ F) | (F ∨ F) | ∀ F | ∃ v F.

    ```


    The following strings are examples of formulas of this predicate logical language:


    +   - ¬''x

    - (Px ∧ P''x'')'
