  md: "# 4.4 Propositional Logic\n\nProof Basic step: atoms do not have parentheses\
    \ at all, so it holds vacuously that they have the same numbers of left and right\
    \ parentheses.\n\nInduction step: If $F$ has the same numbers of left and right\
    \ parentheses, then so does $\neg F$, for no parentheses are added. If $F_1$ and\
    \ $F_2$ both have equal numbers of left and right parentheses, then so do $(F_1\
    \ \\wedge F_2)$ and $(F_1 \\vee F_2)$, for both numbers are increased by one.\n\
    \nOf course, as a proposition is not very interesting. The interest is in the\
    \ proof method. The same holds for the next result.\n\n# Proposition 4.3 Propositional\
    \ formulas are quite readable (have only one parse tree).\n\nProof Basic step:\
    \ If $F$ is an atom, then $F$ has only one parse tree.\n\nInduction step: If $F$\
    \ has only one parse tree, then $\neg F$ has only one parse tree too. If $F_1$\
    \ and $F_2$ have only one parse tree each, then the same holds for $(F_1 \\wedge\
    \ F_2)$ and $(F_1 \\vee F_2)$.\n\nThe use of so-called *metasyMBOLS* $F_1$ and\
    \ $F_2$ in the reasoning above. Metsymbols are used whenever one wants to talk\
    \ about the general form of a formula. A formula of the form $(F_1 \\wedge F_2)$\
    \ is called a *conjunction*, a formula of the form $(F_1 \\vee F_2)$ a *disjunction*,\
    \ and a formula of the form $\neg F$ a *negated* formula.\n\nSometimes the 'official'\
    \ way of writing formulas is a bit clumsy. We will usually use $p_2$ for $p''$,\
    \ $q_3$ for $q''$, and so on. Also, we will omit parentheses when this does not\
    \ result in ambiguity. Furthermore, propositional conjunction is associative,\
    \ so $(p \\wedge (q \\wedge r))$ means the same as $((p \\wedge q) \\wedge r)$.\
    \ Therefore, there is no harm in writing $(p \\wedge q \\wedge r)$ or $p \\wedge\
    \ q \\wedge r$. Disjunction is also associative, so we will write $(p \\vee (q\
    \ \\vee r))$ as $p \\vee q \\vee r$. And so on, for longer conjunctions and disjunctions.\n\
    \nWhile we are at it, is useful to introduce the following abbreviations. We will\
    \ write $F_1 \to (\neg F_2)$. A formula of the form $F_1 \to F_2$ is called an\
    \ *implication* and read as '$F_1$ implies $F_2$' or 'if $F_1$, then $F_2$'. Also,\
    \ we write $F_1 \\leftrightarrow F_2$ for $(F_1 \to F_2) \\wedge (F_2 \to F_1)$.\
    \ A formula of the form $F_1 \\leftrightarrow F_2$ is called an *equivalence*.\n\
    \nThe logical connectives $\neg, \\wedge, \\vee, \to, \\leftrightarrow$ were designed\
    \ to correspond to the natural language connectives *not*, *and*, *or*... *then*,\
    \ and *if and only if*. For example, the sentence\n\n> If it rains and the sun\
    \ is shining, then there will be a rainbow. (4.5)\n\ncan be represented as the\
    \ propositional formula $(p \\wedge q) \to r$, with $p, q$, and $r$ being"
