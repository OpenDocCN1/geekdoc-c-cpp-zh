  md: '# 7.3 The Language of Typed Logic and its Semantics


    | Typed logic | Predicate logic |

    |---|---|

    | (¬ (P x)) | ¬Px |

    | ((∧ P x)) (Q y)) | Px ∧ Q y |

    |∀ (Ax → Px)) | ∀xPx |

    | (Ax → ∃ y (Ay → ((Rx) y)))) | ∀x∃yRxy


    It is possible to reduce the difference in syntactic appearance between ordinary
    predicate logic and typed logic by some abbreviation conventions. Occasionally
    we will write (Ax → (Ay → E)) as Ax → E, and similarly for three or more lambda
    abstractions. Also, an expression of the form (((E a) b) c) can be written as
    Eabc to make it resemble logical notation closely (for different number of arguments).
    Finally, it is convenient to write ((∧ E1 E2) as E1 ∧ E2 and similarly for ∨ →
    and ↔. These conventions are similar to the Haskell operator binding conventions.
    We will also omit outermost parentheses.


    Note that although ((E a) b) c) can be written as Eabc, this is not the same as
    E(a,b,c). The difference is that in Eabc, the arguments of the function E are
    consumed by one, while in E(a,b,c), the function E takes a single argument which
    is a triple. Technically, the process of converting (((E a) b) c) to E(a,b,c)
    is done by means of a function that puts the arguments in an ordered list. This
    is what the function unry3 (compare this with the curry3 function on page 137)
    does for us.


    ```

    uncurry3 :: (a -> b -> c -> d) -> (a, b, c) -> d

    uncurry3 f (x,y,z) = f x y z

    ```


    To demonstrate the use of this, here is a definition of a three-place relation
    in Haskell.


    ```

    rel3 :: Entity -> Entity -> Entity -> Bool

    rel3 D x y = love x y

    rel3 E x y = not (love x y)

    rel3 _ _ = False

    ```


    Here is a check of the definition of rel3:


    ```

    TCOM> love B S

    True

    TCOM> rel3 A B S

    False

    TCOM> rel3 D B S

    ```'
