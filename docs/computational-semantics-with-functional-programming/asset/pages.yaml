    # 13.5 Adding Public Change


    In this section we will look at another tool that proves useful for a formal study
    of pragmatics: public change.


    A propositional substitution $\sigma$ is list of propositional bindings $p :=
    \phi$ satisfying the following properties:


    +   - if $p := \phi$ is in the list, then $\phi$ is different from $p$,

    - if $p := \phi$ is in the list, then the other item in the list has $p$ as its
    left-hand side.


    Examples of substitutions are $[p := \neg p]$ and $[p := q, q := p]$. Non-examples
    are $[p := p]$ (violates the first property) and $[p := q, q := \neg p]$ (violates
    the second property).


    We use $\sigma$ to range substitutions. Each substitution $\sigma$ determines
    a function from the set of basic propositions $P$ to the set of formulas of the
    language. Let $\sigma$ be a substitution and $p \in P$. If there is a binding
    $p := \phi$ in $\sigma$, we let $\sigma(p)$ equal $\phi$, and otherwise we let
    $\sigma(p)$ equal $p$.


    These substitutions can be used to model actions that change the world. Let $M
    = (W, V, R)$ be an epistemic model, and let $\sigma$ be a substitution. Then $M^{\sigma}$
    is the result of changing $M$, as follows.


    ```

    $V''(w) = \{p \in P \mid M \models \sigma(p)\}$.

    ```


    So the valuation function in the new model agrees each world basic propositions
    for which the $\sigma$ substitution is true in the old. This takes the change
    expressed by the substitution into account. E.g. in $M^{[p := \neg p]}$, $p$ is
    true precisely those worlds where $p$ was false in $M$.


    Next we can extend the language with operations for public change. If $\sigma$
    is a substitution, then $[\sigma]\phi$ is an expression of the language. The intended
    interpretation is:


    ```

    $M \models_w [\sigma]\phi iff M^{\sigma} \models_w \phi$.

    ```


    Thus $[\sigma]\phi$ expresses the effect of changing the world according to the
    recipe given in $\sigma$.'
