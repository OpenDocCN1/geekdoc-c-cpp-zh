    in natural language semantics, by his stratagems for lifting of denotations from
    predicates to truth values is a prime example. Among the other rediscoverers in
    natural language semantics we must mention Hans Kaps and Irene Heim, who invented
    continuation style text processing, in order to treat donkey deictic anaphora
    and anaphoric linking across sentence boundaries. See Chapter 12 below, and the
    references given there.


