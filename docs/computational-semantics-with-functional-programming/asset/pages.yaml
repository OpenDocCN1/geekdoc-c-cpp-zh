  md: "# 10.2 Generalized Relations\n\nWhat we want is a data type for arbitrary relations.\
    \ Each instance of the data type should have a definite arity, but two instances\
    \ may well have different arities.\n\nBut first, we declare the module and import\
    \ some relevant modules that were defined before. With the keyword hiding we specify\
    \ functions that we don't want to be imported.\n\n```\nmodule HRAS where\n\nimport\
    \ Data.List\nimport Model\nimport FSyn hiding (Form,Term,Var,Eq,Neg,\nImpl,Equi,Conj,Disj)\n\
    import TCOM\nimport P\n```\n\nWe will use the following auxiliary data type RL\
    \ a r.\n\n```\ndata RL a r = Zero r\n             | Succ (RL a (a -> r))\n```\n\
    \nThis allows us to build relations starting from a given r. The two cases are\
    \ r and a -> r. If we apply the constructor a second time, for RL a (a -> r),\
    \ we get a -> r and a -> a -> r. If we apply the constructor for RL a (a -> a\
    \ -> r) we get a -> a -> r and a -> a -> a -> r, and so on.\n\nThe data type we\
    \ need is a partial case of where we start from Bool:\n\n```\ntype REL a = RL\
    \ Bool\n```\n\nWhat this is that a relation is either nullary, in which case it\
    \ is just a Boolean preceded by the tag Zero, or it is n-ary, with n >= 1. This\
    \ is indicated by the tag Succ. If a relation over objects of type a is n-ary,\
    \ with n >= 1, then it can be viewed as a function of type a -> Rn-1, where Rn-1\
    \ indicates the type of (n-1)-ary relations. The arity of a relation is determined\
    \ by counting the occurrences of Succ:\n\n```\narity :: RL b -> Int\narity (Zero\
    \ _) = 0\narity (Succ r) = succ (arity r)\n```"
