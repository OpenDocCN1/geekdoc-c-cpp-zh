    of the procedures will be the end of the program: one or two million ends. If
    one procedure gets to the end, and that is all of however; you can stop. That
    means you can make the procedure implementation so that it does not bother to
    enable the procedure to return. That is the difficulty with procedure implementation.
    That is why this is so simple; it''s exactly the same as a goto, only called in
    other words. [Wij66] (quoted in [Rey93])


    The trick van Wijngaarden described was in fact CPS transformation of Algol 60
    programs, which is somewhat different from an actual example of a CPS program.
    Many such examples were given around 1970.


