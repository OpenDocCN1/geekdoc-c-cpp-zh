  md: '# Handling Relations and Scoping


    In terms of this, relation conjunction is defined by doing a relational lift with
    conjunction:


    ```

    conjR :: REL a -> REL a -> REL a

    conjR = liftOp (&&)

    ```


    Disjoining relations works the same way. The result of disjoining r and s is called
    the Boolean join of r �sqcup s.


    ```

    disjR :: REL a -> REL a -> REL a

    disjR = liftOp (||)

    ```


    Finally, there is an operation for taking the complement of a relation. The complement
    (negation) of a relation r is often written as F.


    ```

    negR :: REL a -> REL a

    negR (Zero b) = Zero (not b)

    negR(Succ _) = abstract n (\x -> negR (apply r x))

    where n = arity r - 1

    ```


    These definitions illustrate that relations of the same arity form a Boolean algebra
    [DP90, Hal63].

    The operations are what needed for performing logical relations on complex VPS,
    to get interpretations for hurt but not kill, to love or admire, to give or sell,
    and so on. If Hurt is the binary relation that interprets hurt, and Kill interprets
    hurt not kill, then Hurt ⊓ Kill interprets hurt but not kill, and so on.


    Here is an illustration entities the implementation:


    ```

    HRAS>rel21entities (encode2 love) (encode2 help)

    [B,D,M], [R,S], [S,B], [V,V], [W,W], [Y,E]

    ```


    Note that the generalized operations for conjunction, disjunction, and negation
    are in fact generalizations of conjunction, disjunction, and negation for Booleans.
    Booleans can be viewed as θ-ary relations, and we have generalized the operations
    to n-ary relations, for arbitrary n.


