    \     | variabletype\n              | (λ variabletype₁, → expressiontype₂)(type₁\
    \ → expression₂)\n              | (expressiontype₁ → type₂, expressiontype₃ →\
    \ type₂)\n```\n\nNote that for an expression of the form (E₁ E₂) to be well-typed\
    \ the types have to match, and that the type of the resulting expression is fully\
