    \nWith minimal centering, the proposal also takes the so-called 'actor focus'\
    \ from the centering theory of local coherence in discourse [GS86, JGW95] into\
    \ account. Contexts ordered by salience are a suitable data structure for further\
    \ refinement of the reference resolution mechanism by means of methods for discourse\
    \ focus and world knowledge [WIP98].\n\n# 12.7 Implementing Reference Resolution\n\
    \nWe turn to the implementation. As we are going to pronoun resolution, we need\
    \ more informative contexts, for the context should reveal which pronoun went\
    \ to resolved which element. For this, we define a language of constraints, as\
    \ follows:\n\n```\ndata Constraint = C1 VP Idx Idx\n  | C2 TV Idx Idx\n  | C3\
