  md: '# 2.5 Types in Grammar and Computation


    In programming, types are a way of grouping similar values, like numbers, strings,
    etc. The general type scheme for a function is


    ```

    f :: a -> b

    ```


    Here, a -> b is the type of f, where f is a program (or: instruction) that defines
    the function. The types we will encounter in Haskell are basic types denoted by
    the type constants Int (the type of integers), Bool (the type of true-values),
    Char (the type of characters), and well as type a,b.. which stand for arbitrary
    types, lists [a], and function a -> b. For example, f :: a -> Bool reads as ''for
    all types a, f is an instruction for a function that takes a value of type a and
    returns a Boolean value''. We get to know them as we move along. Moreover Haskell
    allows user-defined types, which are very useful and we will look at in more detail
    in section 3.13.


    In the lambda calculus and programming actually have a lot in common with syntactic
    categories for grammars. For example, basic types can be thought of as noun phrases.
    They categorize expressions that are, in some sense, complete, and constitute
    the primary bearers of meaning. Function types, on the other hand, categorize
    incomplete expressions like verb phrases. Their meaning is derivative in the sense
    that it de“af their contribution to the meaning of the expressions they appear
    in.


    Consider the following very simple phrase-structure rule.


    ```

    S -> NP VP

    ```


    Reading it from right to left, it says that given an expression of category NP
    and an expression of category VP, we can form an expression of category S. If
    we think of the categories as types, we can read the rule as follows: a: NP and
    b: VP, then a -> b: S. That is, if we have an expression a of type NP and an expression
    b of type VP, then their concatenation a -> b is of type S.


    An approach to this point of view is categorial grammar, in its simplest form,
    goes back to Polish logician Kazimierz Ajdukwicz. It captures the same information
    as phrase-structure rules by assigning function types to grammatical expressions.
    For example, a VP would be of type NP -> S, i.e. the type of a function that takes
    something of type NP as input and gives something of type S as output. In other
    words, a VP that combines with an expression of type NP and then yields and expression
    of type S. Accordingly, the type of a transitive verb would be NP -> (NP -> S),
    i.e. a transitive verb is an expression that combines with two expressions of
    type NP and produces an expression of type S.


