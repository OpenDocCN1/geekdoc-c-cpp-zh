  md: '# 5.7 An Inference Engine with a Natural Language Interface


    It will turn out useful to define the negation of a question:


    ```

    neg :: Statement -> Statement

    neg (AreAll as bs) = AnyNot as bs

    neg (AreNo as bs) = AreAny as bs

    neg (AreAny as bs) = AreNo as bs

    neg (AnyNot as bs) = AreAll as bs

    ```


    Now the real action states. We use the reflexive transitive closure operation
    to compute the subset relation from the knowledge base.


    ```

    subsetRel :: KB -> [(Class,Class)]

    subsetRel kb = rtc

    (domain kb) = [(x,y)] | (x,y,True) <- kb ]

    ++ [[opp, y, opp x)] | (x,y,True) <- kb ]

    ```


    This uses this function for getting the domain of a knowledge base:


    ```

    domain :: [(Class,Class,Bool)] -> [Class]

    domain = nub . dom where

    dom [] = []

    dom ((xs,ys,_):facts) =

    xs : opp xs : ys : opp ys : dom facts

    ```


    The supersets of a particular class are given by a right section of the subset
    relation. Le. the supersets of a class are all classes of which it is a subset.


    ```

    supersets :: Class -> KB -> [Class]

    supets cl kb = rSection cl (subsetRel kb)

    ```


    Computing the non-subset relation from the knowledge base, i.e. the set of class
    pairs {(A, B) | A ⊆ B}, is a bit more involved, for we have to take care of existential
    import.'
