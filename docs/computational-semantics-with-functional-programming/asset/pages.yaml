  md: '# 2.7 Further reading


    Now, what does all this have to do with natural language analysis? There are at
    least two ways to answer this. The very straightforward answer is that we want
    to automate the association of natural language expressions with semantic representations,
    and lambda calculus happens to be a suitable tool for combining semantic representations.
    Since Haskell is an executable lambda calculus, functional programming is a very
    useful tool for implementing formal semantics. The way forward to implementation
    is short and easy. Usually it is quite straightforward to translate a piece of
    natural language analysis into Haskell code. This is not only of great use for
    writing an implementation but also for reflecting on the analysis itself.


    Another way of connecting functional programming and linguistic theory goes beyond
    practical reasons. It claims that once we formalized natural languages, they can
    actually be seen as programming languages themselves; they form a collection of
    instructions on how to build expressions from simple ones along with their meaning.
    And just as side effects in programming are state changes linguistic phenomena
    defying compositionality can be seen as effects of the computation of meaning.
    This analogy opens the door for using insights from programming language theory
    for handling noncompositional phenomena in natural language semantics; it is executed
    by Chieh Shan in his dissertation [Sha05]. We will see more on this perspective
    in Chapter 11.


    The best way of learning is still by doing, for as the common saying: semantics
    is not a spectator sport. That''s why we will give you an introduction to Haskell
    and not right away into implementing fragments. Before doing so, let us again
    emphasize the gist of this chapter and the reason for doing computational semantics
    with Haskell: reducing expressions in lambda calculus, evaluating a program (i.e.
    function) in lambda, and composing the meaning of a natural language sentence
    are, in a way, all the same thing.


    # 2.7 Further reading


    An illuminating introduction to the lambda calculus is [BB00]. The standard reference
    is [Bar84]. [Han04] is a textbook that stresses the practical applications of
    lambda calculus. Earlier work in computational semantics for natural language
    typically uses Prolog as a computational tool. See [Als92] for a description of
    an intellectual full-fledged computational computational engine written in Prolog.
    The standard – and truly excellent – textbook for Prolog-based computational semantics
    is [BB05]. An early plea for functional programming as a tool for natural language
    interpretation is [FL89], and a recent survey of natural language processing with
    lazy functional programming is [Fro06].'
