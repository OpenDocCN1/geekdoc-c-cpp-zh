  md: "The following function combine the feature lists of two categories.\nFailure\
    \ is indicated by [].\n\n```\ncombine :: Cat -> Cat -> [Agreement]\ncombine cat1\
    \ cat2 =\n  [ feats | length (gender feats) <= 1,\n      length (number feats)\
    \ <= 1,\n      length (person feats) <= 1,\n      length (gcase feats) <= 1,\n\
    \      length (pronType feats) <= 1,\n      length (tense feats) <= 1,\n     \
    \ length (prepType feats) <= 1 ]\n\n  where\n  feats = (prune . nub . sort) (fs\
    \ cat1 ++ fs cat2)\n```\n\nTwo categories agree if the attempt to combine does\
    \ not yield []. The agree function implements a compatibility check.\n\n```\n\
    agree :: Cat -> Cat -> Bool\nagree cat1 cat2 = not null (combine cat1 cat2)\n\
    ```\n\nCertain syntactic rules will assign a new feature to a category, e.g. the\
    \ rule that combines a syntactic subject with a predicate assign Nom to the subject.\
    \ The function assign implements a control mechanism for features.\n\n```\nassign\
    \ :: Feat -> Cat -> [Cat]\nassign f c0(Cat phon label fs sublist) =\n  [Cat phon\
    \ label fs sublist |\n      fs' combine c (Cat \" \" [f] []])\n```\n\nNote that\
