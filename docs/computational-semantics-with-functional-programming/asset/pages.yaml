  md: '# Discourse Representation and Context


    # Discussion


    It may seem that the integration of salience reshufflin in dynamic semantics precludes
    an account of the role of surface syntax in establishing salience. This impression
    is mistaken, however. The context semantics is flexible enough to take syntactic
    effects on salience ordering into account.


    Lambda abstraction allows us to make flexible use of the salience updating mechanism.
    In systems of typed logic, predicate argument structure is a feature of the ''surface
    syntax'' of the logic. Consider the difference between the following formulas:


    ```

    $\lambda xy \mapsto Kyy l d$\n$\lambda xy \mapsto Kyx d l$\n$\lambda x \mapsto
    Klx d$

    ```


    All of these reduce to $Kld$, but the predicate argument structure is different.


    Surface predicate argument structure of lambda expressions can be used to encode
    the relevant salience features of surface syntax. We can get the right salience
    effects from the surface word order of examples like the following:


    > Little Mook kicked the dwarf. (12.14)

    The dwarf got kicked by Little Mook. (12.15)

    The dwarf, Little Mook kicked. (12.16)


    To get the desired salience effect, we first make sure that the sentence gets
    translated into a lambda expression with the appropriate predicate argument structure.
    Next, we use this expression for the salience update of the appropriate contexts.


    # Reference Resolution


    Reference resolution picks the indices of the entities satisfying the appropriate
    generic constraint from the current state, in order of salience. The result of
    reference resolution is a list of indices, in an order determined by the salience
    ordering of the state. The meaning of a pronoun, given a state, is an invitation
    to pick indices from the state, and use those indices to link pronouns to entities.
    This can be further refined, de course, in a way that also stores syntactic information
