  md: "# 7.4 Reducing Expressions of Typed Logic\n\nconsisting of a function expression\
    \ $\\lambda v \\mapsto E$ followed by an argument expression $A$, basically the\
    \ following (we will state a *proviso*). The prefix $\\lambda v \\mapsto$ is removed\
    \ from the function expression $\\lambda v \\mapsto E$, leaving $E$, and next\
    \ the argument expression $A$ is substituted in $E$ for all free occurrences of\
    \ $v$. the free occurrences of $v$ in $E$ are precisely the occurrences which\
    \ were bound by $\\lambda v$ in $\\lambda v \\mapsto E$.\n\nHere is the *proviso*.\
    \ In some cases, the substitution process described above cannot be applied without\
    \ further ado, because it will result in unintended capturing of variables within\
    \ the argument expression $A$. Consider expression (7.21) (we use unabbreviated\
    \ notation again, as the syntactic details do matter).\n\n```\n$((\\lambda x \\\
    mapsto (\\lambda y \\mapsto ((R y)))) y)$\n```\n\nIn this expression, $y$ is bound\
    \ in the functional part $(\\lambda x \\mapsto (\\lambda y \\mapsto ((R y))))$\
    \ but free in the argument $y$. Reducing (7.21) by $\beta$-conversion to the recipe\
    \ above would result in $(\\lambda y \\mapsto ((R y)))$, with capture of the argument\
    \ $y$ at the place where it is substituted for $x$. This can be solved by performing\
    \ $\beta$-conversion on an alphabetic variant of the original expression, say\
    \ on (7.22).\n\n```\n$((\\lambda x \\mapsto (\\lambda z \\mapsto ((R z)))) y)$\n\
    ```\n\nAnother example where switching to an alphabetic variant (also called $\\\
    alpha$-conversion) is necessary before $\beta$-conversion to prevent unintended\
    \ capture of free variables is the expression (7.23).\n\n```\n$((\\lambda p \\\
    mapsto \\forall x((P x) \\leftrightarrow p))Q x)$\n```\n\nIn (7.23), $p$ is a\
    \ variable of type $t$ and $x$ of type $e$. Variable $x$ is bound inside the functional\
    \ part $(\\lambda p \\mapsto \\forall x((P x) \\leftrightarrow p))$ but free in\
    \ the argument $(Q x)$. Substituting $(Q x)$ for $p$ in the function expression\
    \ would cause $x$ to be captured, with failure to preserve the original meaning.\
    \ Again, the problem is avoided if $\beta$-conversion is performed on an alphabetic\
    \ variant of the original expression, say on (7.24).\n\n```\n$((\\lambda p \\\
    mapsto \\forall z((P z) \\leftrightarrow p))Q x)$\n```\n\n$\beta$-reduction on\
