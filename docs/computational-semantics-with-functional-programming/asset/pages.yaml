  md: "# 9.6 Parsing Categories\n\nPreposition phrases are always constructed by a\
    \ rule. Note that the rule uses feature control: the preposition assigns AccOrDat\
    \ case to the NP.\n\n```\nppRule :: PARSER Cat Cat\nppRule = \\ xs ->\n [ (Branch\
    \ Cat \"_\" \"pp\" fs []) [prep,np'],zs] |\n  (prep,ys) <- parsePrep xs,\n  (np,zs)\
    \ <- parseNP ys,\n  np' <- assignT AccOrDat np,\n  fs <- combine (t2c np') (t2c\
    \ np')]\n```\n\n```\nparsePP :: PARSER Cat Cat\nparsePP = ppRule\n```\n\nThe subcategorization\
    \ lists of verbs consist of NPs and PPs, so it makes sense to construct a parser\
