    Tautologies are formulas that evaluate to True for every valuation:


    ```

    tautology :: Form -> Bool

    tautology f = all (\ v -> eval v f) (allVals f)

    ```


    A propositional formula was called satisfiable if there is a propositional valuation
    that makes the formula true.


    ```

    satisfiable :: Form -> Bool

    satisfiable f = any (\ v -> eval v f) (allVals f)

    ```


    Contradictions are formulas that evaluate to True for no valuation. Clearly, a
    formula is contradiction if it is not satisfiable:


    ```

    contradiction :: Form -> Bool

    contradiction = not . satisfiable

