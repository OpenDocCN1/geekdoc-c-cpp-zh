    # Logical Representations for Quantifiers


    The pairs of cardinals that characterize a quantifier Q AB can be used for representation
    purposes. Every quantifier is defined by means of an arithmetical expression in
    two variables m and n, where m is the number of elements in A - B, n the number
    of elements in A ∩ B. Logical forms for quantified expressions can exploit this
    fact:


    +   - at least two ↝ λmn ↦ n ≥ 2.

    - all ↝ λmn ↦ m = 0.

    - no ↝ λmn ↦ n = 0.'
