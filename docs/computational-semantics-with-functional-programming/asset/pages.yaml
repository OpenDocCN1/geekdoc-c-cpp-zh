    It is also useful to have an abbreviation for common knowledge formulas:


    ```

    ck :: [Agent] -> Form -> Form

    ck ags f = K (Star (Sum [Agent | <- <-s])) f

    ```


    Valuation lookup can be used to look up the valuation for a world in a model:


    ```

    apply :: Eq a => [(a,b)] -> a -> b

    apply [] = error "argument not in list"

    apply ((x,z):xs) y | x == y = z

    | otherwise = apply xs y

    ```


    In Chapter 5 we defined aR as being the set


    ```

    {b ∈ A | Rab}

