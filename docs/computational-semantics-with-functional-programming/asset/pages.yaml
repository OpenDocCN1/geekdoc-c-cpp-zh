    definition:


    +   - For 0, take the empty set, $\emptyset$.$\n- For the successor $n \mapsto
    s(n)$, take $x \mapsto x \cup \{x\}$.


    This gives:


    +   - $0 = \emptyset$\n- $1 = s(0) = \emptyset \cup \{\emptyset\} = \{\emptyset\}
