    # 3.5 Recursion


    Point your webcam at your computer screen. What do you see? A computer screen,
    with on it a picture of a computer screen, with on it .... This is an example
    of recursion.


    A recursive definition is a definition that refers to itself, while avoiding an
    infinite regress. Let us make this precise for the case of the recursive screen.
    A screen picture is either (i) a tiny blob doing nothing, or (ii) a screen showing
    a screen. The case of the tiny blob doing nothing is the base case. The case of
    the screen showing a screen picture is the recursive case.


    Definition by recursion is important in mathematics, programming, and linguistics.
    A recursive function is a function that calls itself, but without infinite regress.
    To ensure that the recursion eventually stops, we have to give a base case, a
    case that can be computed without calling the function. Keep in mind that recursive-definitions
    always have a base case. As an example for recursion, recall Exercise 1.2. Here
    is a Haskell version.


    ```

    gen :: Int -> String

    gen 0 = "Sentences can go on"

    gen n = gen (n-1) ++ " and on"

    ```


