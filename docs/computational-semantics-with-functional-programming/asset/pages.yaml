  md: '# Foreword


    The view of computational semantics that informs and drives this book is one that
    sees the computation of linguistic meaning as that of computing transparent representations
    of meaning from “raw linguistic data”, linguistic input as it reaches a recipient
    when he hears something or reads it, and to which he has to attach a sense. The
    book abstracts away from the differences between hearing and reading in that it
    assumes the “raw data” have already been preprocessed as strings of words. Such
    computations of meaning are generally assumed to involve the computation of structure
    at several levels, minimally at that level, and then, via the syntactic structure
    obtained at that level, the semantic representation. This implies that in order
    to do computational semantics properly you need proficiency in at least three
    things: (i) proficiency in computation (you need to be proficient in one suitable
    programming language), (ii) proficiency in syntax, and (iii) proficiency in semantics,
    in the more narrow sense in which semantics is understood by many linguists, but
    also in a broader sense.


    The message this book drives from “raw data” isn’t all there is to computational
    semantics. Computing semantic representations wouldn’t be of much to use us if,
    once we have constructed them, wouldn’t be anything we could do with them. But
    of course there is. One thing we do with the semantic representations we construct
    from linguistic input is employ them as premises, usually in conjunction with
    representations we already have, and that often from other sources (e.g. from
    what we have seen with our eyes). In this way the new representation may yield
    additional information, that follows neither from the information we already had,
    nor from the new representation when taken by itself. Or the new representation
    may be instrumental in practical reasoning, help us to develop a better idea of
    how we should proceed in order to get what we want. It is because we use semantic
    representations in these inferential what that they must be “logically transparent”:'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# Foreword


    they must be in a form on which the inference mechanisms of formal logic must
    have a purchase.


    There is also something that we can do with the semantic representations we get
    from what we hear or read: we evaluate them against models of the world. These
    can be models that we put together on the basis of, say what we learn by seeing,
    hearing, or touching. "Model checking", i.e., checking whether a semantic representation
    says about a model or data structure obtained in some way it is true or false,
    is no less important than drawing inferences from it. Model checking is implicit
    in what speakers when they choose sentences to describe the model or data structures
    about which they want to say something, and what it is the recipient of an utterance
    when has independent access to the model or data structure that he assumes the
    speaker is talking about, for instance in situations where the speaker is making
    a comment on something they are both looking at.


    The importance of model checking and of the inferential uses we make of language
    may be plain enough in case. But how important they really comes when developing
    language skills for robots, which can tell us things they they see but we cannot,
    or that must be able to communicate with us when we are jointly working on a common
    task. Such uses of semantic representations are what makes them worth in the first
    place. A computational semantics tells us how representations get built, but has
    nothing to say about what is done with them would hardly be worth having.


    This book accounts for the uses of semantic representations to the Computational
    Semantics task thus making the agenda more ambitious than it would have been in
    any case by a good stretch. As far as I know no one has so far made an attempt
    to address this amplified agenda within the scope of a single text. This is one
    respect in which the present book breaks new ground, both conceptually, as a presentation
    of what computational semantics, defined by this agenda, is actually like, and
    pedagogically, by introducing the readers to the various different items on this
    agenda and showing how each of these items can be tackled and what is needed for.


    The book''s novelty is that it starts without any presuppositions. Nothing is
    assumed beyond common sense: no programming skills, no knowledge of syntax, no
    knowledge of semantics, no knowledge of natural language processing of any sort.
    The book begins by introducing the basics of the programming language that is
    used throughout. Haskell is a member of the family of functional programming languages
    and suitable for the theoretical purposes of this book because of its exceptional
    transparency. The use of Haskell in an introduction to computational semantics
    is a departure from the widespread use of Prolog in intro-'
  merge: -1
