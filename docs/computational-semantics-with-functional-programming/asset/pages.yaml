    # 3.14 Application: Representing Phonemes


    Now, let us turn to a more serious example. We saw a simple implementation of
    Finnish vowel harmony with string manipulation. This is not satisfying from a
    linguistic point of view, because phonological processes like vowel harmony don''t
    seem to be simple string replacement rules, but instead are driven by phonological
    features. Thus, an implementation of vowel harmony would be more adequate if phonemes
    are represented as feature bundles, especially when vowel harmony shows more complex
    patterns. We can do this by defining data structures like the following.


    ```

    data Feature = F Attr Value deriving (Eq,Show)

    ```


    ```

    data Attr = Back | High | Round | Cons deriving (Eq,Show)

    data Value = Plus | Minus deriving (Eq,Show)

    ```


    ```

    type Phoneme = [Feature]

    ```


    Representing phonemes with features proves helpful when considering complex vowel
    harmony systems, like the one in Yowelmani, an extinct variety of the Yokuts language
    of California. Yowelmani has the vowels i u e o a (ignoring the distinction between
    short and long vowels). They can be represented as being of type phoneme, i.e.,
    as lists of features:


    ```

    yowelmaniVowels = [i,a,o,u,e]

    ```


    ```

    i = [F Cons Minus, F High Plus,

    F Round Minus, F Back Minus]

    a = [F Cons Minus, F High Minus,

    F Round Minus, F Back Plus ]

    o = [F Cons Minus, F High Minus,

    F Round Plus, F Back Plus ]

    u = [F Cons Minus, F High Plus ,

    F Round Plus, F Back Plus ]

    e = [F Cons Minus, F High Minus,

    F Round Minus, F Back Minus]

    ```'
