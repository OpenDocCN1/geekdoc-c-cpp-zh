    # 9.6 Parsing Categories


    We will develop the tools for parsing with categories. The input list for the
    parsing process will consist of categories, and the parsers will build parse trees
    with categories at the leaf nodes and the internal nodes. To start, here is a
    function for getting the category out of a parse tree (a map from trees to categories):


    ```

    t2c :: ParseTree Cat Cat -> Cat

    t2c (Leaf c) = c

    t2c (Branch c _) = c

    ```


    > It is convenient to lift the agree function to parse trees:


    ```

    agreeC :: ParseTree Cat Cat -> ParseTree Cat Cat -> Bool

    agreeC t1 t2 = agree (t2c t1) (t2c t2)

    ```


    Our parsing functions will take a list of categories and produce a list of pairs
    consisting of a parse tree and a remainder list of categories. The simplest possible
    parser is the one for constructing a leaf tree of a given category:


    ```

    leafP :: CatLabel -> PARSER Cat Cat

    leafP label [] = []

    leafP label (c:cs) = [(Leaf c,cs) | CatLabel c == label ]

    ```


    For smooth handling of feature assignment it is useful to also lift the assignment
    function to the level of parse trees:'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Parsing


    ```

    assignT :: Feat -> ParseTree Cat Cat

    -> [ParseTree Cat Cat]

    assignT f (Leaf c) = [Leaf c'' | c'' <- assign f c]

    assignT f (Branch c ts) = [Branch c'' ts | c'' <- assign f c]

    ```


    Sentences are all constructed by means of the subject-predicate rule. Here is
    the corresponding parser. that the subject and the predicate have to agree in
    their feature lists, that the subject agreement list must allow the assignment
    of the feature Nom, and that the predicate must have combined with all its complements,
    i.e. its subcategorization list has to be empty.


    ```

    sRule :: PARSER Cat Cat

    sRule = \ xs ->

    [Branch Cat "" "S" [] [] [np,vp],zs] |

    (np,ys) <- parseNP xs,

    (vp,zs) <- parseVP ys,

    np'' <- assignT Nom np,

    agreeC np,

    subcatList (t2c vp) == []

    ```


    A sentence can only be parsed in this way so, here is our parser for sentences:


    ```

    parseSent :: PARSER Cat Cat

    parseSent = sRule

    ```


    Noun phrases can be formed according to a rule or found on the input category
    list:


    ```

    npRule :: PARSER Cat Cat

    npRule = \ xs ->

    [Branch Cat "" "NP" fs [] [det,cn],zs] |

    (det,ys) <- parseET xs,

    (cn,zs) <- parseCN ys,

    fs <- combine (t2c det) (t2c cn,

    agreeC cn []

    ```


    ```

    parseNP :: PARSER Cat Cat

    parseNP = leafP "NP" <|> npRule

    ```'
