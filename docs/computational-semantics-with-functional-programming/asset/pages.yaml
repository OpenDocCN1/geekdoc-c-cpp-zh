    A term $t$ is **free for $v$ in formula $F$** if every free occurrence of $v$
    in $F$ can be replaced by $t$ without any of the variables in $t$ getting bound.
    For example, $y$ is free for $x$ in $(Px \rightarrow \forall xPx)$, but the same
    term is not free for $x$ in $(\forall Ryxy \rightarrow \forall Rxxx)$. Similarly,
    $g(x,y)$ is not free for $x$ in $(\forall yRxy \rightarrow \forall xRxx)$.


    Being free for a variable $v$ in a formula is an important property, for which
    this property can be **substituted for $v$ of $u$ without unintended change of
    meaning**. As an example for a substitution that changes the meaning, consider
    the open formula $(\forall yRxy \rightarrow \forall Rxxx)$. If we replace the
    free occurrence of $x$ in this formula by $y$ we get a closed formula: $(\forall
    yRyy \rightarrow \forall Rxxx)$. The result of the substitution is a sentence:
    a sentence which was originally free captured. This kind of accident we would
    like to avoid.

    If a term $t$ is free for a variable $v$ in a formula $F$ we can substitute $t$
    for all free occurrences of $v$ in $F$ without getting bound by one of the quantifiers
    in $F$. If, on the other hand, $t$ is not free for $v$ in $F$, we can always rename
