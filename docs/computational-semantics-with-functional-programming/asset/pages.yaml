    It is common Haskell practice to refer to non-empty lists as x:xs, y:ys, and so
    on, as a useful reminder of the facts that x is an element of list x''s and that
    xs is a list.


    Lists in computer science are an approximation of the mathematical notion of a
    set. The important differences are that multiplicity (whether a certain element
    occurs or more than once) matters for lists but not for sets, and order of occurrence
    matters for lists but not for sets. The sets {1,2}, {2,1}, and {1,1,2} are all
    identical, but the lists [1,2], [2,1], and [1,1,2] are all different.


    Lists can also be given by enumerating all their elements by indicating the range
    of elements: [n..m] is the list bounded by n and by m. For example, the list [1..423]
    are all numbers from 1 to 423 and the list [''g''..''s''] are all characters from
    g to s. Of course, it works for objects that are ordered in a way that Haskell
    knows. In general, the ordered types are the types in class Ord. The types in
    this class are the types which functions <= (less or equal), >= (greater or equal),
    < (less than), and > (greater than) are defined. Predefined instances of Ord are
    numerical and characters. (For more types, see Section 3.9).


    By use... we can also work with infinite lists, e.g. [..] denotes the list of
    all positive natural numbers. When keying in [..] at the interpreter prompt, the
    interpreter will start printing the list of all natural numbers starting from
    0. This display will go until you hit Ctrl-c or your computer runs out of memory,
    for Haskell knows arbitrary size integers.


    Infinite lists are lazy evaluation methods. Since Haskell does not evaluate an
    argument unless it needs it, it can handle infinite lists as long as it has to
    compute only a finite amount of its elements. For example, if you take 5 [..],
    the interpreter will only consider the first five elements of the infinite list
    of natural numbers and give you [0,1,2,3,4].


    And there is another way to form lists, which is analogous to set comprehension.
    The latter says that if A is a set and P is a property, then {x | x ∈ A, P} is
    the set of all elements of A that satisfy P. List comprehension is the list counterpart
    of; it is written as [x | x <- A, P]. Here are some examples:


