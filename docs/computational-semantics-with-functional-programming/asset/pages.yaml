    A minor additional flaw is the assumption of existential presupposition. In mathematical
    reasoning, and sometimes also in everyday reasoning, one wants to be able universally
    quantified statements without the bother of first having to provide proofs.


    The first of these defects was removed by Frege. Frege''s theory of quantification
    is basically what we call predicate logic. It is based on the introduction of
    individual variables bound by the quantifiers ∀ (for ''all'') and ∃ (there exists).
    Quantifiers whose associated variables can be combined with arbitrarily complex
    predicate formulae to form new predicate logic formulae, as a formula may contain
    an arbitrary number of quantifiers.


    The quantifiers ∀ and ∃ are the standard quantifiers. These two quantifiers are
    interdefinable with help of negation: Something stinks means the same as It is
    not the case that it holds for every x that does not stink, and Everything is
    fine means the same as It is not the case that there is a thing with the property
    x is not fine. More formally: ∃Px is true if and only if ¬xPx is true, and ∀Px
    is true and only if ¬∃xPx is true.


    If one conveniently forgets the existential presuppitions, the Aristotelian quantifiers
    from the Square of Opposition (cf. Figure 5.1 on page 107) can be expressed in
    terms of the Frege standard quantifiers as follows (with ~ for ''translates as:'')


    | All A are B | ~ ∀(Ax → Bx) |

    | Some A/are B | ~ ∃(Ax ∧ Bx) |

    | No A is B | ~ ∀(Ax → ¬Bx) |

    | Not all A are B | ~ ¬∃(Ax → Bx) |


    A thing to note is that different ways of rendering Frege''s logic may be equivalent.
    Another possible translation for No A is B is ¬∃(Ax ∧ Bx). There is nothing to
    choose between the two translations because in every situation where the first
    is true the second is true well, and vice versa.


    Using standard quantifiers and equality it is also possible to express numerical
    constraints like At least two A are B:


    ```

    ∃xy(x ≠ y ∧ Ax ∧ Ay ∧ Bx ∧ By).

    ```


    It is not difficult to see that all disjunctions and conjunctions of quantifiers
    of the forms at least n and at most m can be expressed in terms of standard quantifiers
    and equality.'
