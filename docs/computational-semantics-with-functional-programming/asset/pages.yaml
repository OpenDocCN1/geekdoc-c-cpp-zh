  md: "# 10.7 Relational Interpretation of NPs\n\n```\nrelNP :: NP -> KQ Entity\n\
    relNP = liftQ . intNP\n```\n\nThe next step is to interpret a list of NPs as a\
    \ Keenan quantifier. If the NP list is empty, the Keenan quantifier is just the\
    \ identity function on relations (note that this is a Keenan quantifier). If the\
    \ NP list is non-empty, we use function composition. This works because each NP\
    \ is interpreted as a Keenan quantifier, and these Keenan quantifiers are relation\
    \ transforming functions. So it does make sense to apply these relations for one\
    \ by.\n\n```\nrelNPs :: [NP] -> KQ Entity\nrelNPs [] = id\nrelNPs (np:nps) = relNP\
    \ np . relNPs nps\n```\n\nThis definition has the effect of giving the first NP\
    \ on the list scope over the other NPs, for the relation transformer that is applied\
    \ last will have widest scope. So in fact what we have done is implement a fixed\
    \ scoping mechanism for the first element on the list outscopes, and so on. If\
    \ the order of the NP list reflects word order, our scoping mechanism gives surface\
    \ order. For generating other possible scopings, this will need to be modified.\
    \ But first we give an interpretation mechanism for sentences. We will assume,\
    \ just for simplicity of exposition, that a sentence consists of a list of NPs\
    \ and a VP.\n\n```\nrelSent :: [NP] -> VerbPhrase -> REL Entity\nrelSent np vp\
    \ = (relNPs np) (relVP vp)\n```\n\nIf all goes well and the arity of the verb\
    \ relation matches the length of the NP list, the outcome of relSent is a nullary\
    \ relation, i.e. a Boolean. This gives the following evaluation function:\n\n\
