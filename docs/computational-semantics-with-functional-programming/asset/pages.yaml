  md: '# 13.7 Epistemic Model Checking


    ```

    closure :: Ord state => [(Agent,state,state)] ->

    [Agent] -> [state] -> [state]

    closure rel agents xs = lfp f xs where

    f = \ys ys -> (nub.sort) (ys ++ (expand rel agents ys))

    ```


    The expansion of a relation R given a state S and a set of agents B is given by
    {t | s ⋂ₜ R, s ∈ S, B}. Here is an implementation:


    ```

    expand :: Ord state => [(Agent,state,state)] ->

    [Agent] -> [state] -> [state]

    expand rel agents ys = (nub.sort.concat)

    [ alternatives rel state ag | ag <- agents,

    state <- ys ]

    ```


    The epistemic alternatives for agent a in state s are the states in sRa (i.e.
    the states reachable through Ra from s):


    ```

    alternatives :: Eq state => [(Agent,state,state)] ->

    Agent -> state -> [state]

    alternatives rel ag current = [ s'' | (a,s,s'') <- rel,

    a == ag, s == current ]

    ```


    This ends the implementation of the epistemic model checker. To show how this
    can be used, we demonstrate a check of a muddy children scenario. We model the
    case where there are four children, Alice, Bob, Carol, and Dave, where that Bob,
    Carol, and Dave are the muddy ones.


    We use propositions p1, p2, p3, p4 to express the first, second, third, or fourth
    child is muddy:


    ```

    p1, p2, p3, p4 :: Form

    p1 = Prop (P 1); p2 = Prop (P 2)

    p3 = Prop (P 3); p4 = Prop (P 4)

    ```


    The initial muddy model has 16 worlds; one for each muddiness possibility. Agent
    a cannot distinguish worlds that differ only in the value of p1, for Alice cannot
    see whether herself is muddy. Agent b cannot distinguish worlds that differ only
    in the value of p2, for Bob cannot see whether he himself is muddy. Agent c cannot
    distinguish worlds that differ only in the value of p3, for Carol'
