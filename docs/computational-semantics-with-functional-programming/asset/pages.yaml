    To treat dependencies, we will enrich our parsers with a stack of ''extracted
    material''. We call this a stack parser.


    ```

    type StackParser a b = [a] -> [a] -> [[b], [a], [a]]

    ```


    We will be interested in the special version of this where the yield of the parser
    consists of parse trees.


    ```

    type SPARSER 4 b = StackParser a (ParseTree a b)

    ```


    As in the previous sections, we will first build a few purpose stack parsers.
    A new version of the choice operator is the following:


    ```

    (|>) :: StackParser a b -> StackParser a b

    -> StackParser a b

    (p1 <| > p2) stack xs = p1 stack xs ++ p2 stack xs

    ```


    A new version of the sequential composition operator (<:>) is:


    ```

    infixl 6 <:>

    ```


    ```

    (<:>) :: StackParser a b -> StackParser a [b]

    -> StackParser a b [b]

    (p <:> q) us xs = [(r:rs,ws,zs) | (r,vs,ys) <- p us xs,

    (rs,ws,zs) <- q vs ys ]

    ```'
