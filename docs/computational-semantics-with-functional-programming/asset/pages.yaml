    # 13.6 Yes/No Questions and Their Answers


    We will now proceed to use public changes for the epistemic analysis of yes/no
    questions. Yes/no questions indicate that the context is undecided with respect
    to a particular proposition. An answer settles the issue by announcing the truth
    or falsity of the proposition.


    For our analysis we want adopt the well-known idea of Groenendijk and Stokhof
    [GS84] that a question partitions the logical space into all the possibilities
    that constitute a possible answer. In particular, yes/no questions divide the
    logical'
