  md: '# 8.3 Intensional Constructs


    Richard Montague, in his fragments, dealt with tense by using pairs (w, t) of
    a possible world w at some instant in time t. Reference to the past can then be
    dealt by means of dt''(t'' < t ...). Implementing the semantics of tense is beyond
    the scope of this book.


    Attitude verbs like want and hope also give rise to intensional constructs. Such
    verbs combine with infinitives to form complex VPs. We will first implement the
    intensional semantics for infinitives.


    ```

    iINF :: INF -> IEntity -> IBool

    iINF Laugh = \ x i -> iLaugh (x i)

    iINF Shudder = \ x i -> iShudder (x i)

    iINF (TINF t np) = \ s -> iNP np (\ o -> iTINF tinf s o)

    ```


    We need an interpretation of the appropriate type for catch.


    ```

    iTINF :: TINF -> IEntity -> IEntity -> IBool

    iTINF Catch = \ x y w -> iCatch (x w) (y w)

    ```


    Next, the intensional meanings of the attitude verbs. An attitude towards an intensional
    property should map property to a property that holds in all worlds where the
    attitude is realized. So for each agent in the model that we have to identify
    the set of worlds for that attitude: desired worlds or hoped-for worlds. Let us
    assume that in all worlds everyone wants w2 or w3 and everyone hopes for w3.


    ```

    iAttit :: AV -> IEntity -> IBool

    iAttit Wanted x = \ i -> elem i [W2,W3]

    iAttit Hoped x = \ i -> == W3

    ```


    To check whether a property holds under an attitude we check whether the property
    holds in the designated attitude.


    ```

    iAV :: AV -> (IEntity -> IBool) -> (IEntity -> IBool)

    iAV Wanted p = \ x i -

    and [ p x j | j <- iAttit Wanted x j ]

    iAV Hoped p = \ x i -

    and [ p x j | j <- worlds, iAttit Hoped x j ]

    ```'
