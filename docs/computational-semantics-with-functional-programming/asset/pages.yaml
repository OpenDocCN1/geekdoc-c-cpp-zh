    If one is lenient enough one might consider these examples as fragments of English.
    Conversely, it is also very simple to write a grammar for a language which has
    English contained in it as a fragment:


    ```

    character    → A | Z | a | · | z | - | . | ? | ! | | :

    string       → character | string

    ```


    The set of strings, according to this definition, contains the set of sentences
    of written English.


    Note, by the way, we have tacitly introduced · as a new abbreviation. This is
    strictly for human consumption: if a computer is supposed to read this, we have
    to explain how. But we have all learnt the alphabet at primary school, and the
    abbreviation relies on this common knowledge. It is extremely tedious to write
    prose for human consumption without tacit relying on such background knowledge.
    In computer programming, one has to make all these shortcuts explicit, and of
    course. This may be why a person with talent for human relationships – and for
    seeking common ground – find it often difficult to relate to computers, and vice
    versa. It should be noted, by the way, that Haskell is rather smart at guessing
    what ellipsis means:


    ```

    FSynF→ [''A'' · ''Z'']

