  md: '# Model Checking with Predicate Logic


    Bertrand Russell (1872–1970), Alfred Tarski (1902–1983), and Willard Van Orm Quine
    (1908–2000) have maintained that the structure of these two sentences differ,
    and that it is not enough to say that they are compositions of a subject and a
    predicate.


    The logicians who used first-order predicate logic to analyse the logical structure
    of natural language were struck by the fact that the logical translations of natural
    language sentences with quantified expressions did not follow the linguistic structure.
    In the logical translations, the quantified expressions seemed to have disappeared.
    The logical translation of (6.1) does not reveal a constituent corresponding to
    the quantified noun phrase.


    Every dwarf loved Goldilocks. (6.1)

    \forall x(Dwarf x \rightarrow Love x g) (6.2)


    In the translation (6.2) the constituent *every dwarf* has disappeared; it is
    eliminated. Frege remarked that a quantified expression like *every dwarf* does
    not give rise to a concept by itself (*selbstständige Vorstellung*), but can only
    be interpreted in the context of the translation of the whole sentence. Considering
    this particular example, the literal paraphrase of (6.2) is:


    All objects in the discourse have the property of not being dwarfs or being objects
    who loved Goldilocks.


    In this restatement of (6.1) the phrase *every dwarf* does not occur any more.


    The logical properties of sentences involving quantified expressions (and descriptions,
    analysed in terms of quantifiers) suggested indeed that a simple noun phrase such
    as a proper name combines with a predicate is logically different from the way
    in which a quantified noun phrase or a definite description combines with a predicate.
    This led to the belief that the linguistic form of natural language expressions
    was misleading.


    The application of the logical tools of abstraction and reduction of the lambda
    calculus allows us to see that this conclusion was unwarranted. Using translation
    of natural language in expressions of typed logic we will see that natural language
    constituents correspond to expressions that combine with one another as functions
    and arguments. After full reduction of the results, quantified expressions and
    other constituents may have been contextualized, but this elimination is a result
    of the process, not the supposed misleading form of the original natural language
    sentence. Thus, while fully reduced logical translations of natural language sentences
    may be misleading in some sense, the fully reduced original expressions are not.


