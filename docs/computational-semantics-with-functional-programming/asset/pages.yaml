    The following function generalizes this to giving possible ways of splitting a
    string into substrings, for n ≥ 2. The function uses split2 for the case n = 2,
    and split2 plus recurse for the case n > 2.


    ```

    splitN :: Int -> [a] -> [[[a]]]

    splitN xs

    | n < 1     = error "cannot split"

    | n == 2    = [ys,zs] | (ys,zs) <- split2 xs ]

    | otherwise = [ys:rs] | (ys,rs) <- splitN (n-1) zs ]

    ```


