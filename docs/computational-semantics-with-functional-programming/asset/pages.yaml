  md: '# 1.4 Natural Languages and Formal Languages


    follows. This principle is widely attributed to the German mathematician Gottlob
    Frege (1848–1925). What it says is that the meaning of a complex expression depends
    on the meanings of its parts and the way they are combined syntactically. This
    formulation is quite vague, however, nothing is said yet about what meanings are,
    what counts as a part of an expression, and what kind of dependence we are talking
    about. To make sense, the principle has to be specified with respect to these
    matters. Moreover, it is meaningful only when understood the background of further
    requirements on a semantic theory, for example the requirement that meaning assignment
    is systematic. A systematic account will capture the fact that we know the meaning
    of white unicorn and brown elk, we also know what brown unicorn and white elk
    mean.


    Compositionality does not occur in our list of crucial properties of human languages
    listed above, because we assume it is primarily a method of methodology. question
    is not whether natural languages satisfy the principle of compositionality, but
    rather whether we can and want to design assembling in a way that this principle
    respects. Setting up the representation of meaning in a compositional way has
    the merit of elegance, but it is not always straightforward. A recurring difficulty
    is the context-dependence of natural language meaning. To state the meaning of
    a pronoun, information is needed about the context in which the pronoun occurs.
    Something similar holds for presuppitions. In such cases, there are in two kinds
    of reactions. The easy way is to give up on compositionality. The other kind of
    reaction is to enrich and extend our semantic theory in ways that allow us to
    capture seemingly non-compositional phenomena in a compositional way. We will
    return to these matters in time, when we take a closer look at pronoun resolution,
    in Chapter 12, and at presupposition, in Chapter 13.


    Besides natural languages, there are other symbol-manipulating systems that also
    show some of the properties listed above, for example the language of predicate
    logic and high-level programming languages like C, LISP, and Haskell. But these
    apparently lack other properties of human languages. For example, they lack the
    whole pragmatic dimension that human languages employ: deception, irony, conveying
    information without explicitly stating it, and capabilities like creating and
    understanding metaphors. Formal languages also lack the flexibility of human languages
    induced by vagueness together with heavy use of context and background knowledge.
    These differences, in fact, are the reason why natural languages are well-suited
    for efficient inter-human communication, whereas formal languages excel for doing
    mathematics and for interacting with computers.


