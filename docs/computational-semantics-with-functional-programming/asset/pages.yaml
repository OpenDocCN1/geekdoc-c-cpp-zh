  md: '# 8


    # Extension and Intension


    # Summary


    The semantic treatment we have given up to now consisted of evaluation in a single
    (predicate logical) model. In this chapter, we will make the distinction between
    extensional and intensional evaluation. Extension is interpretation in a single
    model, intention is interpretation across different possible situations. The preceding
    chapters we talked about expressions (signifiers) and their interpretations (referents).
    In this chapter we will discuss a way to make technical sense of the sense or
    the signified, the concept or idea that an extension invokes in a user of the
    language. The resulting semantics is called possible world semantics or intensional
    semantics. It is one of the trademarks of Montague grammar.


    # 8.1 Sense and Reference, Intension and Extension


    In paper On Sense and Reference (1892) the German mathematician and philosopher
    Gottlob Frege made a famous distinction between the sense (German: Sinn) of an
    expression and its reference (German: Bedeutung). The reference of a name, is
    the thing Frege refers to. The sense of the name is the thought that we use to
    identify the referent. If $a, b, c$ denotes the line that connects the vertices
    of a triangle to the midpoints of the opposite sides, then the intersection of
    $a$ and $b$ coincides with the intersection of $b$ and $c$. Thus, ‘the intersection
    of $a$ and $b$'' and ‘the intersection of $b$ and $c$'' have the same reference,
    but not the same sense.


    It is natural, to think of being connected with a sign (name, combination of words,
    letter), besides to that which the sign refers, which may be called the reference
    of the sign, also what I should call the sense of the sign, wherein the mode of
    presentation is contained. In our example, accordingly, the reference of the expressions
    ‘point of intersection of $a$ and $b$’ and ‘point of intersection of $b$ and $c$’
    would be the same,'
