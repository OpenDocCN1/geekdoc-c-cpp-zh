    If $c$ is a context under permutation, let $(i)c$ be the result of placing the
    item $(i, c[*i])$ upfront. Here is an example:


    ```

    $\left( \begin{array}{ccc} 2 & 0 & 1 \ Alice & Goldilocks & Snow White \end{array}
    \right) [*0] = Goldilocks$


    $(1) \left( \begin{array}{ccc} 2 & 0 & 1 \ Alice & Goldilocks & Snow White \ \end{array}
    \right) = \left( \begin{array}{ccc} 1 & 2 & 0 \ Snow White & Alice & Goldilocks
    \ \end{array} \right)$

    ```


    $(i)c$ is the result of moving the item with index $i$ to the head position of
    the context. Successive applications of this operation can generate all permutations
    of a context. If $d$ is an object and $c$ a context, then $d:c$ is the result
    of putting item $(|c|, d)$ at the head position of the context.


    ```

    $Dorothy : \left( \begin{array}{ccc} 2 & 1 & 1 \ Alice & Goldilocks & Snow White
    \ \end{array} \right) = \left( \begin{array}{ccc} 3 & 1 & 2 \ Dorothy & Snow White
    & Alice & Goldilocks \ \end{array} \right)$

    ```


    The operation $(:)$ is used for adding a new element to the context, in most salient
    position.


    # Further Refinement of Entries for Determiners


    Let $p[e]$ be the type of contexts under permutation. Assume $c, c''$ are variables
    of type $p[e]$, and $P, Q$ are variables of type $\mathcal{N} \to p[e] \to t$.
    Our new definition of context extension runs as:


    ```

    $\exists := \lambda cc'' \mapsto \exists x(x : c) = c''$.

    ```


    Lexical entries for $a man$ now use this new definition instead of the old one.
    The new definition of $a man$ effects a salient shuffle:


    ```

    $\lambda Qc'' \mapsto \exists x(Man x \wedge Qi(x : c'')$ where $i = |c|$.

    ```


    The referent for the indefinite gets introduced appears in most salient position
    in the new context. Note that $(x : c)[i]$ points to the newly introduced $x$.
    In any $c''$ that is an extension or permutation of $(x : c)$, the expression
    $c''[*i]$ will continue to point to $x$.'
