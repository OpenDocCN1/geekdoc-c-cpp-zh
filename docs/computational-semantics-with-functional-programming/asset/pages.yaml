    \ of $B$ still free, as it should be.\n\nTo state all this in a precise way, we\
    \ start with a definition of 'variable $v$ is free in expression $E'$. $v$ is\
    \ free in $E$ if the following holds (we use $\\approx$ for the relation of being\
    \ syntactically identical, i.e. for being the same expression):\n\n+   $v \\approx\
    \ E$"
