    # 9.7 Handling Extractions


    Left extraction in natural language occurs when a substituent of some constituent
    is missing, and another constituent to the left of the incomplete represents that
    missing constituent in some way, for example in the sentence Who did some dwarf
    defeat. In the generative tradition, such dislocations are accounted for by means
    of transformations that move a constituent while leaving a trace. Computational
    and logic-oriented approaches to natural language processing replace the transformational
    account with an in situ analysis, lexical functional grammar, categorical grammar)
    and/or through extension of the'
