  md: '# The Composition of Meaning in Natural Language


    well-understood message in the new medium. Because of this presupposed understanding
    of the original message, such translations cannot count as explications of the
    concept of meaning for natural language.


    As we have seen in Section 6.2, it is possible to make knowledge of the meaning
    of a fragment of natural language fully. What we give there is a procedure from
    natural language into predicate logic that can count as an explanation of the
    concept of meaning for natural language. The procedure does not presuppose knowledge
    of the meaning of complete natural language sentences. Instead, it specifies how
    sentence meanings are derived from the meanings of smaller building blocks. The
    meanings of complex expressions are constructed in a system fashion from the meanings
    of the smallest building blocks occurring in those expressions. We assume that
    they are instructions for linking individual words to the reality outside. In
    our example, these links are made by the interpretation instructions for relation
    and function symbols in a predicate logical model. Computational semantics has
    a lot to say, however, about the process of composing complex meanings in a systematic
    way out of the meanings of the components. The intuition that this is always possible
    can be stated somewhat more precisely; it is possible can be stated somewhat more
    precisely; it is called the Principle of Compositionality, which we already encountered
    encountered in the first chapter:


    The meaning of an expression is a function of the meanings of its immediate syntactic
    components and its syntactic mode of composition.


    The principle of compositionality is implicit in the work of Frege on the philosophy
    of language, and it has been made fully explicit in Richard Montague''s approach
    to natural language semantics. Another key element in Montague-style semantics
    is the treatment of quantifiers.


    # 7.2 Quantification


    An important goal in computational semantics for natural language is to provide
    an account of the process of drawing inferences in natural language. A key role
    in this process is played by quantifiers, and therefore quantification is a topic
    of central interest in computational semantics. The first systematic account of
    quantification is that of Aristotle: Impressive though it is, Aristotle''s theory
    of quantification has two logical defects:


    +   (1) Quantifier combinations are not treated; only one quantifier per sentence
    is allowed.


    +   (2) ''Non-standard'' quantifiers such as most, half of, at least five, ...
    are not covered.'
