    # 3.4 Type Polymorphism


    One of Haskell''s characteristics is a polymorphic type system. For example, the
    Haskell Prelude contains the following definition of the identity function:


    ```

    id :: a -> a

    id x = x

    ```


    This function can be applied to objects of any type. Applied to an argument, it
    just returns that. Since the type of the argument does not matter, we say that
    the id function is polymorphic. In the declaration of id, a is a type variable.
    The use of a indicates that any type will fit. So, instances of id''s type are
    Bool -> Bool, Int -> Int, String -> String, but also


    (String -> Bool) -> (String -> Bool)


    and so on.


    ```

    FPH> id 42

    42

    FPH> id "Jabberwocky"

    "Jabberwocky"

    FPH> (id hword) "Jabberwocky"

