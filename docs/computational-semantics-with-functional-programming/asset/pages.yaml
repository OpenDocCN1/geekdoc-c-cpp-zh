    # # 8.3 Intensional Constructs


    A fake princess is someone who in actual fact is not a princess, but pretends
    to be one. How does one model such pretense? Let us say that in other world she
    is a princess. Then here is a definition of the intensional property of being
    a fake princess (we use, $j$ to range over possible worlds):


    ```

    \lambda x.\lambda i \to Princess i \wedge \exists j Princess x j.

    ```


    Note that we can now define the meaning of the adjective fake. This adjective
    takes an intensional predicate $P$ and maps it into a new predicating state that
    $P$ does not apply in the actual world but does apply in other world:


    ```

    \P x\lambda i \to \P x i \wedge \exists j P x j.

    ```


    To illustrate this, here is an implementation for our fragment:


    ```

    iADJ :: ADJ -> (Entity -> IBool) -> IEntity -> IBool

    iADJ Fake = \ p x i ->\nnot (p x i) && any (\ j -> p x j) worlds

    ```


