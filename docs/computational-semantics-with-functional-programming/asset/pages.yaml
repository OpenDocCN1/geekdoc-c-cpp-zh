    # # The Composition of Meaning in Natural Language


    # ## Summary


    In the last chapter we gave an indirect interpretation for our natural language
    fragment. We translated natural language sentences into logical forms and then
    evaluated these logical forms with respect to a model. Logical forms were predicate
    logical formulas, which were constructed from type logical expressions. We used
    Haskell as a lambda calculus engine for this procedure. This worked very well,
    but it has the disadvantage that the Haskell interpreter hides the details of
    how expressions of typed logic get simplified. In this chapter, we will demonstrate
    that the composition of meaning can be carried out without a logical form language
    as intermediate representation level. We will give direct instructions for connecting
    natural language expressions to the “world” outside language (represented by an
    appropriate model). We will show how models of predicate logic can be extended
    to models of typed logic, and how typed logic yields appropriate meaning representations
    for the lexical items of natural language fragments and provides the means for
    building up meanings in a compositional way. Before we engage in this, we must
    focus on a key ingredient in natural language semantics: quantifiers.


    # ### 7.1 Rules of the Game


    An invitation to translate English sentences from an example fragment of natural
    language given by some set of grammar rules into some logic — predicate logic,
    or typed logic — presupposes two things: (i) that you grasp the meanings of the
    formulas of the representation language, and (ii) that you understand the meanings
    of the English sentences. Knowledge of the first kind can be made fully explicit;
    stating it in a fully explicit fashion is the job of the semantic truth definitions
    for the representation languages. In fact, translation exercises of this kind
    in logic textbooks are meant to expand the reader’s awareness of the expressive
    power of the logical representation language by inviting him or her to express
    (intuitively)'
