  md: 'syntactic properties of the sentence that contains the pronoun,


    information conveyed in the previous discourse, and


    background information shared by speaker and hearer (the common ground).


    Surface syntactic form is an important determinant for salience. It is usually
    assumed that a subject is more salient than an object. For example, the first
    choice for resolving he in (12.12) is Little Mook. And the first choice for resolving
    he in (12.13) is the dwarf.


    Little Mook hit the dwarf. He was upset. (12.12)


    The dwarf got kicked by Little Mook. He was upset. (12.13)


    In these two examples, Little Mook and the dwarf are the obvious candidates for
    resolving the reference of the pronoun he, because both Little Mook and the dwarf
    have been made salient by the preceding text.


    To illustrate how this process of salience update can be made explicit, consider
    the following context:


    | Alice | Snow White | Goldilocks |


    Salience in context is a resuffle of the order of importance of the items in a
    context list. This may make Goldilocks the most salient item:


    | Goldilocks | Snow White | Alice |


    To allow reshuffling of a context with Goldilocks in it, in such a way that we
    do not lose track of her, we represent contexts as lists of indexed objects, with
    the indices ranging from 0 to the length of the context minus 1:


    | 0 | 1 | 2 |

    | Goldilocks | Snow White | Alice |


    Reshuffling this to make Alice most salient gives:


    | 2 | 0 | 1 |

    | Alice | Goldilocks | Snow White |


    Note that the indices 0, ..., n-1 determine a permutation of the context list.
    We call these lists of indexed objects contexts under permutation.


    # Context Manipulation


    In a context c, the entity with index i is given by c[*i].'
