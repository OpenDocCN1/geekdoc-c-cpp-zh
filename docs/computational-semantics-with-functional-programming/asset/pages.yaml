  md: '# 9.9 Further Reading


    Logics for talking about tree relations were proposed in [BGMV93] (modal logic)
    and in [BRVs95] (first-order logic). The binary relations on positions that were
    used in Section 9.1 can be readily described in logical terms.


    Natural language parsing is assimilated to logical deduction in [PW83]. The bible
    of parsing in the context of formal language theory is [AU72]. Parsing natural
    language fragments with Prolog is the topic of [PS87]. Parser combinators in the
    context of functional programming are introduced in [Wad85] and receive further
    discussion in [Hut92]. Examples of parser combinators can also be found in [JS01].
    The approach to the treatment of gaps with parser combinators in Section 9.7 is
    based on [Eij03].


    Formally, extraction grammars are more powerful than context-free grammars, for
    they allow the definition of sequentially indexed languages. Sequentially indexed
    languages are a proper extension of context-free languages, and also of the linear
    indexed languages of [Gaz88]. We refer to [Eij07b] for further details.


    A special-purpose programming language for developing multilingual natural language
    applications, with parsing at the core, is Grammatical Framework, or GF. GF is
    similar to Haskell, but specialized to grammar writing. See [Ran09] and http://www.grammaticalframework.org.'
