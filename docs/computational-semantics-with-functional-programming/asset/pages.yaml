    \ may be that we end up with multiple copies of the same context. To remedy this,\
    \ we need the function nub for removing superfluous copies.\n\n# New Versions\
    \ of the Dynamic Operations\n\nThe neg' of a transition in the new style is got\
    \ by swapping the truth value, and doing a cutoff for the negative transition\
    \ relation.\n\n```\nneg' :: Trans' -> Trans'\nneg' = \\ phi c b -> if b then phi\
    \ c False\n    else cutoff (phi c True) (size c)\n```\n\nIf conj' succeeds, the\
