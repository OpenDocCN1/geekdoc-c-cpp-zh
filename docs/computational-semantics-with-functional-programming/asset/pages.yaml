  md: '# 1.3 The Purposes of Communication


    Explanations of meaning fall in two broad classes: meaning how and meaning as
    knowing that. If we say that Johnny doesn''t know the meaning of a good spanking,
    we refer to operational meaning. If Helen Keller writes that water means the wonderful
    thing that was flowing over her hand, she refers to meaning as reference, or denotational
    meaning.


    Usually the two are intertwined. Suppose we ask you directions to the Opera House.
    You might say something like: ''Turn right at the next traffic light and you will
    see it in front of you.'' Understanding the meaning of this involves being able
    to follow the directions (being able to work out traffic light counts as the ''next''
    one, which direction is ''right'', and being able to recognize the building in
    front). Phased in terms of ''being able to work out...'', being able to recognize...'',
    this is meaning as knowing. Being able to understand the meaning of the directions
    also involves being able to distinguish correct directions from wrong directions.
    In other words, the directions classify situations, with me positioned at some
    location in town, facing in a particular direction: in some situations the directions
    provide a description which is true, in other situations a description which is
    false. This is denotational meaning.


    Denotational meaning can be formalized as knowledge of the conditions for truth
    in situations. Operational meaning can be formalized as algorithms for performing
    (cognitive) actions. The operational semantics of plus in the expression seven
    plus five is operation given as a set of calculating instructions, or as a description
    of the workings of a calculating machine. The distinction between denotational
    and operational semantics is basic in computer science, and often a lot of work
    is involved in showing that the two kinds match.


    Often operational meaning is more fine-grained than denotational meaning. In instances,
    the expression seven plus five and two times six both refer to the natural number
    twelve, so their denotational meaning is the same. But they have different operational
    meaning, for the recipe for adding seven and five is different from the recipe
    for multiplying two and six.


    # 1 The Purposes of Communication


    The lofty aim of communication is to use language as a tool for collective finding.
    But language is also a tool for making your fellow citizens believe things, or
    for confusing your enemies. Even if two languages agree on non deception, this
    does not exclude the use of irony.


    A very important use of language, and one that we will be concerned with a lot
    in the following pages, is as a tool for describing states of affairs and as a
    reasoning tool. This is a use which formal languages and natural language have
    in common.'
