  md: '# Parsing


    context-free rule format with wrapping operations grammars, tuple-based and tree-based
    extensions of context-free grammars.


    An example of this is relative clause formation. The intuition behind relative
    clauses is that there are sentences with an NP parsing. To write a parser that
    parsers the internal structure of a relative clause correctly, we will extend
    our parsers with an extra component: a stack of graphs or missing constituents.
    This comes close to the gap threading mechanism of Generalized Phrase Structure
    Grammar (GPSG) [GKPS85] and Head-Driven Phrase Structure Grammar (HPSG) [PS94].


    Above we have seen extension of context-free rules with a feature agreement mechanism
    was possible within the context-free rule format. The extraction of it is different.
    Now adding an extraction mechanism to context-free rules gets us outside the context-free
    rule format. The grammar we get is of sequentially indexed grammars. Sequentially
    indexed grammars use indices that get pushed to an arbitrary terminal in the right-hand
    side of a rule. Rules have the form $AX \rightarrow B...C$ to indicate that X
    consumes in the production of $B...C$, or the form $A \rightarrow B...CX...D$
    to indicate that X gets to the production. In a sequentially indexed grammar for
    a toy of natural language might look like this:


    ```

    S \rightarrow$ NP VP

    VP \rightarrow$ TV NP | laughed

    NP \rightarrow$ DET CN | Alice | Dorothy

    TV \rightarrow$ admired | helped

    DET \rightarrow$ the | some

    CN \rightarrow$ boy | girl | CN S_{NP}

    NP_{NP} \rightarrow$ $\epsilon$

    ```


    This uses the np gap to handle relative clauses. We will not give a formal definition
    of sequentially indexed grammars and sequentially indexed languages here as as
    grammar theory is outside the scope of this book. A full account can be found
    in [Eij07b].


    As we will see now, treatment of extraction phenomena with extraction stacks remains
    close to the spirit of a movement analysis. Relative clause formation in English
    is a simple example of left extraction. The structure of the relative clause in
    (9.2) is represented by the annotation that links the relative pronoun to its
    trace $t_i$.


    > Dorothy admired the princess that Goldilocks gave the sword to $t_i$. (9.2)


    Our grammar will give the example in Figure 9.2, with # indicating the NP gap.'
