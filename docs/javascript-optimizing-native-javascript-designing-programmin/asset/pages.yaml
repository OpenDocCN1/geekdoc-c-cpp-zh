  md: '# Clearing arrays


    Because arrays are passed by reference, you have to be careful when you create
    new arrays that reference existing arrays. Generally, changing values of the first
    array will also change the values when referencing the second array. Be careful
    if you have to clear the array. The following methods will give slightly different
    results:


    ```

    array1 = [1, 2, 3]; //declare new array

    array2 = array1;//both arrays will have same values

    ```


    # Option 1 - setting array1 to blank array


    ```

    array1 = []; //array1 = []

    Result:

    array2 = [1,2,3]

    ```


    Setting it to null will have similar results.


    # Option 2 - setting length to zero


    ```

    array1.length = 0;

    Result:

    array1 = []

    array2 = []

    ```


    # Option 3 - using splice


    ```

    array1.splice(0,array1.length);

    Result:

    array1 = []

    array2 = []

    ```


    # Using ''pass by reference'' to your advantage


    In JavaScript, objects are passed by reference not by value. And since arrays
    are essentially objects, they inherit this same feature. I often use this to my
    advantage by setting temporary variables to objects and arrays that exist in more
    global contexts, and then use those variables to change values. Having a local
    reference to these objects makes the changes faster. In the following example,
    a global object and array are both changed inside a function, one by one passed
    in reference, the other by a temporary local variable. Both methods work with
    objects or arrays.


    ```

    object1 = {a: 1, b: 2, c: 3};

    array1 = [1, 2, 3];nchangeValues(object1);

    ```


    ```

    function changeValues(obj) {

    obj.a = 99;

    tvar temparray = array1;

    temparray[0] = 88;

    }

    Result:

    object1.a = 99

    array1[0] = 88

    ```'
