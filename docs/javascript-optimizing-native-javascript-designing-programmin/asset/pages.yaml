    be error-free. But they are not magic and they have many cross-dependencies.


    # ## JavaScript versions


    JavaScript was developed in 1995 and is known by its un-trademark name as ECMAScript.
    It has evolved over the years through many major version releases and is currently
    available in flavors of version 1.7 or 1.8. Each browser (IE, Firefox, Chrome,
    Opera, etc.) have their own implementation and do not support all the features
    so to be careful in what JavaScript features you rely on if you need cross-browser
    compatibility. To be safe, you should either support the older version used by
    the browsers you must support, or special your code based on the browser version.
    Many of the frameworks and libraries that are available to have cross-browser
    support. Older versions of Internet Explorer, in particular, have many known incompatibilities
    with other browsers. Google has an open JavaScript engine V8 which is used in
    its Chrome browser.


    The latest ECMAScript version 6 is supported on most browsers but with varying
    degrees of compliance. You can find a number of sites on the Internet that list
    capabilities by feature and by browser. You should be very careful relying on
    these new features in your application. Some items might be useful like the new
    `let` and `const` declarations. You can use websites like http://www.aniuse.com
    to verify which features work on which browsers.


