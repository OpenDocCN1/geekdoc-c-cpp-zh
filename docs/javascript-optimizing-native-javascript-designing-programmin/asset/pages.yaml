  md: '# Example questions


    These are just a few random questions that I was either asked or seem to be fairly
    common. You can find many more examples if you search the Internet but similar
    solutions apply to many of them. Many may have a brute force solution that is
    workable but may be time-consuming or inefficient. You need to always pay attention
    and try to find a more efficient solution. Remember to keep talking as you look
    for a solution or write code on the blackboard. Some may involve considering Big
    O calculations


    # Find minimum and maximum number in array


    You are given an array of random numbers asked to find the smallest and largest
    number. You could walk through the array checking each number but there are single
    line solutions shown below.


    ```

    var arrNumbers = [1,4,7,3,5,9,3,2];

    Math.max.apply(null, arrNumbers); // 9

    Math.min.apply(null, arrNumbers); // 1

    ```


    # Reverse characters in a string


    This problem gives you a string and asks you to reverse the order of characters.
    Again, you could write a loop that uses substituting to build up a new string,
    or you could remember that strings can be represented as arrays with one character
    per element, and use something like the following:


    # Finding descendants


    Often, just the question may point to a more efficient answer. I was given a problem
    of determining if B is a descendant of A in a multi-level tree. I imagined a recursive
    routine that would get all the children of A, then all their children, and so-on
    until I found element B. I realized, with a little pudding, that I could just
    reverse this and quickly get the answer. Just start with B and walk up the chain
    to see if you end up at A. The problem was reworked as "Is A ancestor of B"


    # Longest common prefix in an array of strings


    This asks you to find the longest common prefix of setting letters in an array
    of strings, as:


    ```

    var arr = ["abcdef", "abc", "abcd"];

    ```


    There are many ways to solve this by walking through the list comparing the starts
    of each string. However, an elegant and possibly more efficient (depending on
    the sort method) is simply to sort the array and then compare the first and last
    element to see how many letters match.'
