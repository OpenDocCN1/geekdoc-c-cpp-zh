  md: "# JavaScript • Optimizing Native JavaScript\n\nOnce you have the file, there\
    \ is another decision you need to make in order to format properly. If it is to\
    \ be fetched with a regular JSON fetch, you can use it as is. However, if you\
    \ want to substitute for a JSONP server request, you have a few more steps. In\
    \ order it to be fetched as a JSONP file, the data will have to be wrapped inside\
    \ a function call with a name known to the application. One way to accomplish\
    \ this is:\n\n+   - Decide on a unique function name (such as `cbAddressData`)\
    \ for each file and add around the data object, similar to the following where\
    \ `xxxx` represents your regular JSON object:\n  `cbAddressData((xxxx))`\n- Append\
    \ this name as the callback to your JSONP fetch instead of using a randomly generated\
    \ name. This will fetch your json from your local file system instead of a server.\n\
    \n# Validating your JSON files\n\nWhen entering data manually or testing new server\
    \ APIs, you may need to validate your JSON data to ensure it is formatted correctly\
    \ and to get a clear idea of what all the fields look like. Some methods to help\
    \ you do this are:\n\n+   - Install a JSON parser extension to your browser so\
    \ you can parse JSON files that fetch to your browser window.\n- Copy and paste\
    \ your JSON file into an online JSON validator or parser. There are many of free\
    \ tools that you can find by searching the Internet. These will point out errors\
    \ like missing quotation marks and improperly formatted fields. If you are trying\
    \ to validate a JSONP object, you may have to strip out the surrounding function\
    \ in order for it to be properly evaluated.\n\n# Converting between JSON objects\
    \ and Javascript objects\n\nThere are several ways to convert your JSON objects\
    \ to objects that you can use directly in your JavaScript code.\n\n+   - Built-in\
    \ `eval` function. This is not recommended as it can convert objects but also\
    \ execute JavaScript code that might be malicious. There are other differences\
    \ between this and the next method.\n- `JSON.parse`. This method is designed to\
    \ convert any of your JSON objects directly to JavaScript objects and is the preferred\
    \ method.\n\nAnother method that you will use is `JSON.stringify()` to convert\
    \ your JavaScript objects directly into a JSON string that can be sent to your\
    \ server."
