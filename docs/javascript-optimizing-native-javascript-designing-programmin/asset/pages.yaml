    \n# Disabling events on all elements on the screen\n\nThere are many times you\
    \ want to disable all events on the screen to prevent a user from clicking on\
    \ active elements while processing is going on. There are many ways to do this\
    \ including setting a variable that all action methods check before executing.\
    \ There are other ways to accomplish this by setting up a DOM element that covers\
    \ the entire screen that will allow all events while you are processing the action.\
    \ To set this:\n\n+   Add a <div>element to your DOM that it is on top of all\
    \ other elements (set a very high z-index property). You can set its color and\
    \ opacity properties so that it will dim the entire screen. When you need to disable\
    \ all events, simply set its visibility property to 'visible'.\n\n# Getting the\
    \ event properties you want\n\nThe event object has a number of properties that\
    \ can be used in your handler. However, starting with the event, different browsers\
    \ handle some of these properties differently. The most common properties you\
    \ might be interested in:\n\n+   event: Older browsers don't always pass the event\
    \ into your handler. You should handle this in each of your handlers in a manner\
    \ similar to the following:\n\n```\nfunction doSomething(event) {\n  event = event\
    \ || window.event;\n}\n```\n\n+   target: Again, this property is handled differently\
    \ across browsers. You can include the following line in each handler to get the\
    \ proper target object.\n\n```\nvar target = event.target || event.srcElement;\n\
    ```\n\n+   key: Getting the key that was pressed usually consists of two steps.\
    \ You get the numerical code first, then convert it to a character if you need\
    \ to, similar to:\n\n```\nfunction keyHandler(event) {\n  event = event || window.event;\n\
    \  var kcode = event.keyCode || event.which;\n  var kchar = String.fromCharCode(kcode);\n\
    }\n```"
