  md: '# Fetching Server Data


    Your applications will most likely be accessing a server to store and retrieve
    data, settings, or images. There are a number of factors you need to be aware
    of when writing applications that have to access a server other than the initial
    loading of your JavaScript, HTML, and CSS files.


    # Using GET or POST requests


    You will normally use either a GET or a POST request to communicate with your
    servers. There are some significant differences between these methods that you
    need to be aware of when designing your application.


    # GET


    This method is normally used to request data from the server. However, you can
    also include data in the request that the server can save. Some points about GET
    requests:


    +   - **Format**: The request consists of two parts: the URL, and the name/value
    pairs of the request. The first data is preceded by an ampersand or question mark
    (?). Any other pairs are preceded by an ampersand (&). The request looks like:
    http://xx.yy.com/app?name=val&name=val2. Only ASCII characters can be set. Note:
    you should include the final slash (/) before the question mark to be correct.
    It may also make a difference with SEO routes.

    - **Caching**: These requests can be cached (see comments below JSON requests).

    - **Booking**: Since everything is contained in the request string, GET requests
    can be saved and bookmarked for later use.

    - **Visibility**: Any data contained in the request are easily visible to the
    user.

    - **Size**: Get requests have a maximum length which varies by browser and server
    but it is usually 2048 characters.


    # POST


    This method is normally used to save data to the server, often from fields filled
    in on an HTML form. Some points about POST requests:


    +   - **Format**: The request consists of the URL. The name/value pairs are sent
    in the message body. Binary data can be sent.'
  merge: -1
  pgno: 121
