  md: 'Appendix A: Interviewing • 153


    # Interviewing


    The main impetus behind creating this book about programming was a wide layoff
    of the company where I had been working for a long time. Plus, for more than 15
    years. I was thrown into the job market for the first time in the running. I was
    now a few years older and competing with Millennials that grew up with the Internet.
    I had been programming JavaScript and HTML for a long time but I needed to ensure
    I was acquainted with the latest methods and reacquainted with the job interview
    process. So while I was trying to lay my new job, I started on this book. Unfortunately
    (for the book) but fortunately for me, I found a new job in a few months. I am
    finally finishing the book and have some comments about the interviewing process
    that might help someone else looking for a job.


    # How to automatically be in the top 50% of candidates


    I have been on both sides of the interviewing process—asking for a job and also
    interviewing candidates for work at my company. I also talked to the people interviewed
    me as possible to see how I was doing and get advice for future interviews. I
    was continually surprised how unprepared a large number of candidates were. So,
    independent of technical knowledge required for the new position, I have a number
    of De''s and Don''ts that should get you into the top 50% or more of all candidates.
    At minimum, following these suggestions should keep you in the running. They may
    sound obvious to you but it is surprising how many candidates do not follow them.
    And these have nothing to do with your skills related to the new position.


    +   **Be on time!** Be late and in the door with two strikes on one. Get early
    to make sure you have the correct building and room...and it shows you are aware.


    +   **Resumé.** Bring extra copies of your resume. Some interviewers may have
    lost their copy. You may also want to alter your résumé to make it job specific.


    +   **Dress** Dress neatly appropriately for the type and location of job. This
    may take a little research but it is better to be overdressed than underdressed
    as the saying goes. If nothing else, it shows respect for the interviewer.


    +   **Greeting.** Shake hands with a firm grip and look the other person in the
    eye.


    +   **Talking.** When you talk, be clear, upbeat, and positive. And speak slowly.
    Listen carefully to the question but do not be afraid to ask the interviewer to
    clarify any question. This shows you are paying attention and actually understand
    the area in question.'
