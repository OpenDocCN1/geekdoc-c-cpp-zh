  md: '# Localization


    Localization refers to ensuring that your application adapts to the country, language,
    customs, or preferences of the user using it. It is easy to forget when writing
    applications for the U.S. market that some users might be located in different
    countries or have different preferences. The items that you need to consider for
    localization include:


    +   - Date format

    - Language of the user interface

    - Number and time format

    - Currency format

    - Special text characters and sorting rules

    - Significance of icon and colors


    You will need to analyze your target audience to determine the amount of localization
    you need to provide with your application. There are also two methods of localization
    to consider as well:


    +   - Start-up localization. You determine the correct formats to use when your
    application starts and use for all parts of your app.

    - User-selectable localization. You may determine a default setup when your app
    starts but have a setup screen where the user can select their desired options
    for each area of localization. This may require more coding as all the formatting
    will be able to be changed dynamically at any time whatever is displayed on the
    screen.


    # Date format


    To allow dynamic changes to the display of dates and times, you may want to add
    two basic functions to your code:


    +   - An-purpose date formatting function. This will allow you to pass in a date
    object and a string representing how you want it displayed and the formatted date
    returned. See the example code later in this chapter for how to do to this.

    - Specific date/time routines by setter settings. You should have a common function
    that is called throughout the app to format date and time. To make these routines
    as fast as possible, they should be set to optimized routines for the date/time
    format selected'
  merge: -1
  pgno: 127
