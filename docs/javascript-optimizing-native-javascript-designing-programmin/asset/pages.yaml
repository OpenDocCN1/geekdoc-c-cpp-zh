  md: '# CSS Preprocessors


    These tools allow you to have more flexible and powerful CSS by accepting proprietary
    CSS input and processing it to produce standard CSS. The more powerful features
    include the use of variables and more nesting capabilities. Some popular tools
    include:


    +   - Saas

    - Less

    - Stylus


    The processors normally compile the CSS up front and don''t allow any dynamic
    changing of styles from the app itself if the user changes formatting options.
    and there are other solutions to substituting common colors or other values into
    your CSS or HTML Plus, be careful that you do not overuse the nesting features
    as it can make your HTML very hard to debug and/or change, and it may run slower.


    # Polfills and shims


    Polfills and shims are collections of code that allows your application to use
    features that may not be supported by all browsers. They let you implement these
    new features on browsers that support them, but provide a fallback method that
    works on the older browsers. They usually work by first testing for the existence
    of the feature before using it, and then using an older method if it does not
    exist. Examples include:


    +   - html5Shiv

    - PersistJS

    - Modernizr

    - Polyfiller


    # Minification tools


    Smaller JavaScript code downloads faster, loads faster, and consumes less bandwidth.
    Your code is not compiled like it is in most other languages, you need to take
    some extra steps to make it as small as possible. There are several tools out
    there that accomplish this using several methods including:


    +   - removing spaces and comments

    - shortening variable and function names

    - replacing functions with inline code

    - combining functions into fewer, larger files


    Your code is left alone and the compressor creates new, smaller files that you
    deploy on your website. Most of these steps are very safe. The more radical steps
    of changing variable and function names are also called obfuscation and must be
    done carefully. Obfuscation will also make your code harder for others to use
    without permission. Most debug tools have ''pretty'
