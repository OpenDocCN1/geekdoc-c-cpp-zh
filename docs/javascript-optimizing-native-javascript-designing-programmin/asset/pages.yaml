  md: '# Appendix B: UI Design • 167


    # Problems with metaphors


    +   1. Forcing the logic of all your screens to fit your metaphor. If you have
    not thought through all of your screens, you may find when trying to program your
    last screen, that you just can''t force the logic into your visual metaphor.


    +   2. Picking a metaphor that may not be obvious or known to yours. It is to
    potentially work across cultures and languages. And does magnifying glass mean
    search or zoom?


    +   3. Consistency: If you have picked a metaphor to use in your application,
    you must be consistent. It needs to be used on all your screens and features.
    If you have a design where the screens rotate from the left or right like a carousel,
    then shouldn''t suddenly switch and have some screens popping up from the bottom
    or fading. If you are using a book metaphor, when you display pages can they scroll
    up and down, is the user forced to view the content page at a time? How do you
    get back to the table of contents?


    +   4. Touch screen. An interface that runs on a desktop that uses a mouse, and
    a mobile device that uses a touch screen may have problems. If you have a long
    list that a user scrolls on a desktop by clicking on a down arrow, you can solve
    the problem of a long list by replacing the contents in the list. If the list
    is simple then you need a better way to let a user quickly swipe the screen to
    display the entire list.


    +   5. Other problems on same device. The popular programs that run on the device
    you are targeting your design. Users on Mac computers are used to a different
    look and feel than Windows users. Users on an iPad, for example, are used to have
    the Settings screen and operates. Features in other apps may also raise the user''s
    expectations of what your app should do. If you have pictures, the user may expect
    to be able to pinch them to zoom the display.


    +   6. Careful with metaphors that might be too cute. Remember Microsoft''s Bob
    application? It had a number of problems, one of them being it was just too cute.


    # Conventions are there for a reason


    Use "conventions" to your advantage. If there are accepted ways that most users
    carry out functions, make sure you use them and definitely don''t change them
    to something else. UI conventions let users concentrate on content, not the UI
    navigation. To reduce any mental effort a user has to exert just to navigate your
    site. Too much effort and for a user will go everywhere. Driving a car has become
    an mindless task (think eating juicy burger while driving), mainly because the
    auto industry has standardized how cars work, where the gas and brake pedals are,
    these conventions work. If you need a way for users to buy multiple items and
    see the list of potential purchases at any time, considering a "Shopping Cart"
    icon available at the top of each screen, as that is a widely-accepted convention.
    Don''t call "Buy List" and buy it on menu.


    I think some of the new Google and Microsoft designs are really a step backwards
    because they ignore these conventions in their drop shadows and gradients in controls
    so now it is very hard to tell what is a clickable control and what is just information.'
