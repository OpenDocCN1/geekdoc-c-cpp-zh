    \ visibility to hidden (visibility:hidden;) to hide the element. This hides the\
    \ element but does not change the layout. However, it will no longer intercept\
    \ mouse and touch events.\n\n+   3. **Display.** You can set the element's display\
    \ property to none (display:none;) to the element. This removes the element from\
    \ the DOM tree. It is hidden, cannot accept user events, and does not affect the\
    \ layout any more. Elements will be laid out by the display engine as if the element\
    \ does not exist. If this is the desired effect, it should allow the rest of the\
    \ UI to display faster since it doesn't have to lay out. You can also make changes\
    \ to the attributes in this state without any penalty by having the layout refreshed.\n\
    \nFading elements: If you want to slowly fade an element, you can use a transition\
    \ on the opacity attribute. If you want the user to be able to touch or click\
    \ on the hidden element, you will need to use a timeout to set the transition\
    \ time to hidden, the display property to none after the opacity fade is done.\
    \ Here is a sample of the CSS, HTML, and JavaScript show how this can be accomplished.\n\
    \n```\n.fadeout {\n  opacity: 1;\n  -webkit-transition: opacity 200ms linear;\n\
    \  -moz-transition: opacity 200ms linear;\n  -o-transition: opacity 200ms linear;\n\
    \  transition: opacity 200ms linear;\n}\n<div id=\"mvMain\" class=\"fadeout\"\
    ></div>\nfunction fadeMain() {\n  document.getElementById(\"mvMain\").style.opacity\
    \ = 0;\n  setTimeout(function() {\n    document.getElementById(\"mvMain\").style.visibility=\"\
    hidden\";\n  }, 2000);\n}\n```"
