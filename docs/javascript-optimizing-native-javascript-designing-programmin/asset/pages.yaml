  md: "Using closures to keep your variables and functions out of the global namespace.\
    \ This is a common method that both protects the global namespace and allows you\
    \ to keep variables or functions essentially \"private\". There are several ways\
    \ to write these functions, from having a public object with access methods, to\
    \ having a completely anonymous function that runs once when you start up and\
    \ never used again. They may look like:\n\n```\nvar nafDate = function () {\n\
    \  var localVar = 5;\n  var fname = \"name\";\n  var localMethod = function ()\
    \ {\n    console.log(\" \" + fname);\n  };\n  var globalMethod = function () {\n\
    \    localMethod();\n  };\n  return {\n    fname: fname,\n    globalMethod: globalMethod\n\
    \  };\n}();\n```\n\nThis creates a global object called nafDate that has only\
    \ two items that can be accessed outside the function, fname and globalMethod,\
    \ which were both returned when the object was created. The line of the declaration\
    \ that contains ()(); results in the function being immediately executed when\
    \ it is read in, creating the nafDate object. The localMethod cannot be accessed\
