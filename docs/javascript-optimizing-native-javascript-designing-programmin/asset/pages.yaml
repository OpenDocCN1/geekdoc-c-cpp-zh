  md: '# Chapter 5: HTML • 75


    Preventing elements from getting touch or click events. You may have an element
    that has either an opacity of zero or some low value to allow the element to act
    as a alpha layer on the rest of the UI. Since the element is visible, it will
    normally intercept all touch and click events. To prevent this happening, you
    can set the pointer-events CSS property to none: pointer-events: none;


    Dealing with inheritance. The visibility property is inherited, whereas opacity
    is not. You may run into problems if you have a parent container that holds a
    number of elements and set the visibility property on the parent expecting the
    container and all its children to become invisible. However, if you have manually
    overridden the visibility property on one of the children, that will now precedence
    and that element will no longer inherit the visibility setting of its parent.
    Depending on your requirements, you may need to manually check the child elements
    or set/clear classes accordingly; use display:none on the children and let it
    inherit its visibility property, or visibility:inherit when you make the child
    element visible.


    # Finding HTML elements


    There are several ways in your JavaScript to find elements in the DOM so you can
    do on changing their text, color, position, or other attributes. You should carefully
    design your HTML up front knowing which elements will need to be later accessed
    and changed. Some available methods make it easier to create more complicated
    algorithms, but you usually pay for convenience with slower performance.


    The methods tested elements based on their id, tag, or class. The getElementsByName
    should not be used by any as the name attribute has been deprecated. The three
    traditional methods are:


    +   * document.getElementById(id). Finds the first element with the designated
    id. Its are supposed to be unique but is not enforced and this method will only
    find the first one

    * document[or].getElementsByClassName(class). Returns an array of all elements
    that match the designated class name in the elements that were found in the DOM.
    This is a node list that is “live” meaning that any changes to the DOM will also
    change this list if it still exists. One advantage to this method is that it can
    be applied to any element in the DOM and not just the document. One major disadvantage
    is that it is inefficient if you keep the list and keeping the DOM. Another major
    disadvantage is that it is not supported on IE versions 8 and before. You can
    also use this method for two or more classes, such as getElementsByClassName(“class1
    class2”). In this usage, the element must contain all the classes included in
    the list.


    +   * document.getElementsByTagName(tag). Returns an array of all elements with
    the designated tag (such as “div” or “p”) in the order that they appear in the
    DOM. This is a node list that is “live” meaning that any changes to the DOM will
    also change this list if it still exists. To get all elements in the DOM, an asterisk
    (*) for the tag name.'
