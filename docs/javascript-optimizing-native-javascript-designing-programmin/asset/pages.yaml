  md: '# Caching your server requests


    Caching refers to the method of responding to your requests for data by using
    the response from an earlier request. This can be used for your program files,
    image files, or data files using HTTP requests. It can be very helpful when loading
    the same program repeatedly you run an application. Responses can be cached at
    various locations in the fetch process, starting with your browser''s cache. This
    reduces the load on the server and increases the responsiveness of your application.


    There are a number of factors that affect when caching is used. These include
    information in HTML file headers and, most importantly, the URL request that is
    sent. You can use this information to help influence when your requests are cached.
    There are a number of strategies that you can find by doing an online search,
    many involving the use of Expires or Cache-Control in your file headers, or the
    use of entity tags (ETags).


    # Disabling caching


    The common times you may want to ensure caching is disabled include:


    +   * Requesting time sensitive information that may be continually updated on
    the server so you need to ensure you have the latest information.


    +   * Loading program files (HTML, CSS, JavaScript) for your application when
    you are developing your application and those files may be frequently changing.
    A common way to disable caching in this instance is to add a random string, as
    the current time in milliseconds, to the filename of each file when requesting
    them JavaScript fetches.


    +   * Use your browser''s ''clear cache'' function to manually clear the current
    cache.


    # Enabling caching


    There are times that you want to ensure that data is cached, mainly to speed up
    your application and reduce server load. A few things to remember when to do this:


    +   * You can only GET requests. POST requests cannot be cached.


    +   * Your requesting URL must be the same as a previous request in order to ensure
    that your data is split up so that much information can be fetched with identical
    URLs and user-specific requests are kept to a minimum. Remember that caching can
    occur at different locations in the network so requests from different users may
    also be cached.


    +   * JSON requests. Routines that make JSON normally attach a unique string to
    the end of the URL to be constructing the callback function which is required
    for JSON to work. That unique string will make the request uncacheable. In order
    to cache these requests, you will need to use the same callback string for each
    request. You can try varying this string every 12 or 24 hours to ensure you periodically
    get a fresh copy.'
  merge: -1
  pgno: 125
- img_proc: true
  md: '# Reduce the amount of data you have to handle


    You should try to minimize the amount of data you receive from your servers. This
    will decrease the load on the server, improve load times, and decrease the amount
    of memory your application uses. Ways to accomplish this include:


    +   - Keep all field names as short as possible.

    - Change filenames if possible to make them easy to reference by index number
    or a computable name.

    - Put all images in one directory structure and send that name once and have your
    app prepend that name to each filename.

    - Don''t send unneeded information. Create separate API''s return just what you
    need or add a method on the API to specify the fields you need.

    - Try to avoid really long ids for your records. Even if you have 100,000 objects,
    you really only need a string 6 chars long, or even shorter if you hash it bit.

    - Combine binary fields on the server into bit arrays and send just the numbers
    representing bits.

    - Don''t send images in a size any bigger than you need. These large images force
    the browser to resize them before displaying. Remember that being twice as wide
    and twice as high results in a file that is up to 4 times bigger.'
  merge: -1
  pgno: 126
