    \ This uses a closure and the return method to make whatever methods and variables\
    \ you exposed. If items are not referenced in the return state, they will be private\
    \ to the object. Because the return statement returns a function, the main function\
    \ can be used as a constructor. This method is in the middle of the list in terms\
    \ of performance.\n\n```\n// MODULE PATTERN\nvar ModulePattern = (function ()\
    \ {\n  function doThis() {}\n  function doThat() {}\n  var propOne = 12;\n  return\
