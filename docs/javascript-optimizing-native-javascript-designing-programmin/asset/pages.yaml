  md: '+   6. **Regression bugs.** These are the worst kind of bugs as they occur
    in code that you have previously tested, but code changes or other bug fixes create
    new bugs. Unless you have a complete plan to test for regression bugs, you are
    at risk. Even relatively harmless fixes introduced late in the development may
    have major consequences since you normally have less time to fully test the product
    again.


    +   7. **Testing tools.** You may also want to consider using third party testing
    tools like Jenkins to automate your testing. These are particularly helpful in
    finding regression bugs when you run these tests after each codecheck. They mostly
    focus on unit-testing your code.'
