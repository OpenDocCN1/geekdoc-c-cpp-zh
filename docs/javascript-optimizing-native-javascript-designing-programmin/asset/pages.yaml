  md: '# Comparing objects


    If you compare objects to determine if they are the same, you need to be aware
    of the following conditions when you try to compare them:


    +   - Two objects made with the same constructor and values: Not equal.

    - Two independent objects made with exactly the same properties: Not equal.

    - A second object set equal to first object (e.g. obj2 = obj1): Equal'
