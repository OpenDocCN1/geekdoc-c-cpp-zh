  md: '# Handling Data Efficiently


    You often have to handle large lists of items that need to be sorted, scrolled,
    and filtered. This includes lists of names, lists of tv shows, or any other large
    collection of data that users have to access. There are many ways to handle these
    operations, the larger the list, the more you have to pay attention to optimizing
    memory and performance. The better a job you do, the more data you can handle.


    The main tasks that you need to be concerned with include:


    +   - Managing server requests

    - Managing memory

    - Managing the DOM

    - Improving performance, including scrolling, sorting, and filtering


    We''ll look at each of these areas in detail.


    # Managing server requests


    One of the first design tasks concerns the availability of the data from your
    servers and how quickly it can be fetched. This is usually a fairly complicated
    question as it involves a number of considerations based mainly on the size of
    the dataset, the frequency that it changes, and the end of use of the data. Questions
    you should ask include:


    +   - Does the dataset have to be created each time it is requested database queries
    or is it fairly static that changes infrequently? What if changes just once a
    day?

    - How many servers are available and what is their capacity? What kind of caching
    is available?

    - How many concurrent users will be using your application? How frequently will
    they need to request new data?

    - Can the data be broken down into smaller sets so that each user doesn''t need
    to fetch as much each time?

    - Can you break the data into lookup tables so that the main dataset can be smaller
    and simply reference in the table?

    - Are requests from multiple users or even from the same user cacheable? Do they
    have the same URL or is each request unique?'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# JavaScript • Optimizing Native JavaScript


    There are other considerations that may be unique to your application and server
    installation. I worked on software for set-top boxes in Europe that would fetch
    large amounts of TV data every time the boxes started. Unfortunately, at the time,
    there were frequent power outages in the area resulting in all boxes coming online
    and requesting data at exactly the same time. We had to add some randomizing timing
    to prevent all the requests from happening at the same.


    Another TV application was on originally set up to request data from the server
    in very verbose segments that required almost 200MB of data fetches to populate
    a UI guide. By reworking the data structure into a compact format with lookup
    tables, I was able to reduce the total payload to 3MB that loaded almost instantly.
    So be creative and at all facets of your project for ways to optimize its performance.
    It may seem that you don''t need to worry about bandwidth, transmission speed,
    and memory but you should try to design your application with these factors in.


    # Don''t let the server make UI decisions for you


    Don''t let the API''s, size of the data payload, or data format affect how the
    UI displays data. Make sure the data received from the server is in the optimal
    format for the application so it doesn''t have to be sorted or merged prior to
    use. This includes getting a date field in a format-free value as milliseconds
    or a JSON date format that can be directly converted by your JavaScript code.
    That way you can display the data in whatever format you need or even the user
    decide which date format to use. It is easier to sort.


    # Managing memory and bandwidth


    Managing memory can be more complicated than managing your server requests. Decreasing
    your bandwidth with smaller data objects the server often reduces your memory
    usage as well but that depends on the exact format of the objects you receive
    from the server. Different browsers handle memory in different ways and it is
    hard to know exactly how users will be using your application. Computers have
    more memory than before but you still have mobile devices that are more limited.
    And you are usually not the only application running on the device. The best approach
    is to design your memory usage carefully upon front, then keep everything as small
    as possible at each step of your development. Some things to keep in mind:


    +   * Keep your data as lean as possible with only the fields that you need. Arrays
    save space compared to objects. Keep your property names short. Having shorter
    variable and property names mainly affect the size of the files that are downloaded.
    The effect of shorter names on actual performance is very small since names are
    changed to address offsets. Make sure the name is long enough to be descriptive
    in their context.


    +   * If you have a large dataset, try to make it as relational as possible with
    lookup tables for common data.


    +   * Only download the data that you need from the server.'
