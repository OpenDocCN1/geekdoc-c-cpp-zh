    +   **Practice.** Practice answering questions ahead of time, including writing
    down solutions to programming problems. Answer questions out loud. You want to
    get used to speaking slowly and clearly.


    # Answering technical questions


    Now we get how to respond to the technical side of the interview that probes your
    knowledge required for the job. I believe what is more important than your answers
    is how you reason through the problem. In this age of having every answer available
    in .28 seconds using Google, remembering every option of function is not as important
    as knowing how to identify the software is attempting to solve and then designing
    a solution correctly. The most important things to keep in mind when handling
    this part of the interview include:


    +   **Clarify the question.** Make sure you clarify the question if it is unclear
    at all. Don''t be afraid to ask questions so you understand the problem enough
    that you don''t have to answer it.


    +   **Verbalize your solution.** The way you approach a programming problem is
    often more important than the exact details. An interviewer normally won''t penalize
    you if you forget the format of the substring method (or if it is str?) yet you
    explain what the function is doing.


    +   **Taking talking.** Don''t sit there unless you run into a problem. Talk your
    way through it. Often you may not have to finish answering the question if your
    logic and reasoning is correct. It is easy to have ''stage fright'' particularly
    if you haven''t interviewed in a while. Verbalizing the problem sometimes helps
    you come up with the right answer, and so tells the interviewers your thought
    processes (and sometimes they may help you.)


    +   **Don''t make something up.** If you don''t know the answer to something,
    don''t make one up. If you can''t remember the name of a method, just say so.
    You could say something: "I haven''t had to do that but I can see how it would
    be important. Let me see...I think this work..."


    +   **Be prepared.** Do your homework ahead of time. Make sure you study all the
    areas you think will be covered in each interview. That is another reason it is
    important to know about each company and each job ahead of time that will influence
    your areas of concentration.'
