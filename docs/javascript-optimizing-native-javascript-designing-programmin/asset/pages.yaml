  md: "# Step 5 - Show properties: This was one little harder. There were three properties\
    \ that were each from a small number of possibilities—type, rating, and resolution.\
    \ This made them prime candidates for using a bitwise operator to represent the\
    \ values. A bitwise operator essentially uses every bit of a number (up to 31)\
    \ as a true/false flag for the value at that position. Thus, the first bit may\
    \ represent type=Move, the second bit type=Sports, and so on. There were several\
    \ ways to combine all and read these values, but the simplest is to use the &\
    \ | operators. You can create a variable to zero and then use the or operator\
    \ () to shift the bits you want.\n\n```\nvar flag = 0;\nflag|=Math.pow(2,5); //\
    \ turns on (sets 1) to the 6th in bit\nflag|=Math.pow(2,8); //turns on 9th bit,\
    \ leaving the other bits alone\n```\n\nTo test the values of your flag, you can\
    \ use code similar to:\n\n```\nif (flag&Math.pow(2,5)) //do true function for\
    \ 6th bit true\n```\n\nI used this method to combine all three fields (type, rating,\
    \ and resolution) into one field.\n\nNow, the data like:\n\"show\": {\n  \"title\"\
    : 12,\n  \"flag\": 16823,\n  \"startTime\": 1335204000000,\n  \"endTime\": 1335205800000,\n\
    \  \"chanIdx\": 8\n}//bitwise number\n\nStep 6 - Combining all shows by channel:\
    \ This also took some analysis of the data on the server and how the data was\
