  md: "# Loops\n\nThere are a number of ways to handle loops in JavaScript. You should\
    \ understand the relative performance of each and ways to optimize the performance\
    \ when you use them. Obviously, if you are looping through a few items, you don't\
    \ have to worry about performance. But a lot of the code I have written dealt\
    \ with thousands or tens of thousands of items, and performance is of concern.\
    \ I think it is always a good idea to learn the best way to write the loops and\
    \ use that the time. I don't think any of these suggestions detracts from the\
    \ code readability, with the possible exception of having the loop count backwards.\
    \ This used to have a performance advantage which has mostly gone away. Using\
    \ local variables is often the best way to improve your loop's performance. Methods\
    \ whether you are looping through arrays or objects, that may influence your decision\
    \ to use arrays or objects.\n\nThe main methods to use are:\n\n+   * for loop:\
    \ This is the most common method and likes:\n  for (var i=0; i < newlen; i++)\
    \ {\n\n+   * while loop: Similar to the for loop:\n  while (i < newlen) { i++;\
    \ }\n\n+   * do loop: Similar to while it will always execute at least once.\n\
    \  do ( i++; ) while (i < newlen);\n\n+   * forEach: A special JavaScript operation\
    \ that runs your function on each element in the array:\n  arr.forEach(function(val)\
    \ {\n    var y = val;\n  })\n\n+   * for...in loop: This is mainly used to iterate\
    \ over properties of objects is very slow however you use it. This is mainly due\
    \ to the fact this operation is not optimized by browsers.\n  for (var name in\
    \ obj) {\n    var val = obj[name];\n  }\n\n+   * for...in loop checking hasOwnProperty:\
    \ If you are unsure if other properties have been added to the object prototype\
    \ for that you are checking, you should also add a check for using the hasOwnProperty\
    \ method.\n  for (var name in obj) {\n    if (obj.hasOwnProperty(name)) {\n  \
    \    var val = obj[name];\n    }\n  }"
