  md: "There are several methods to use to display your special font characters.\n\
    \n+   1. Set up a class that is used every time you want to display a special\
    \ character, to include that character inside a <span> or <div> element.\n\n```css\n\
    specialFont {\n  font-family: iconfont;\n  font-size: 15px;\n  color: #ee3333;\n\
    }\n```\n<div class=\"specialFont\">C</div>\n\n2. Set up a class that uses the\
    \ before selector:\n\n```css\nspecialChar {\n  font-family: iconfont;\n  content:\
    \ \"\\6653\";\n  color: #993333;\n}\n```\n<span class=\"specialChar\">/</span></span>\n\
    \nThere are few methods you can use in code to improve the performance of your\
    \ images.\n1. Preload your images. Preloading references allows the browser to\
    \ fetch them into local cache before you show them. This increases the speed at\
    \ display. The easiest way is to build an image array in your JavaScript and load\
    \ images into that array. Future requests for those images will be faster because\
    \ the image will be cached. Normally, you will also want to put this code in a\
    \ function that is not called until the first page is loaded so that you can display\
    \ that page faster.\n\n```\nvar imageNames = ['pic1.png', 'pic2.png', 'pic3.png'];\n\
    var imgNum = imageNames.length;\nvar imageList = [];\nfor (var i=0; i < imgNum;\
    \ i++) {\n  imageList[i] = new Image();\n  imageList[i].src = imageNames[i];\n\
    }\n```\n\n+   2. Sprites. These are smaller images combined into one array. The\
    \ single image loads faster than multiple images due to the overhead of fetching.\
    \ Your CSS defines the sections of the large image to display in different places\
    \ in your UI. This method is often used to combine the normal/hover/selected/disabled\
    \ versions of icons. The following example assumes you have combined several images,\
    \ each 60px by 60px, into one picbig.png. The numbers in the background represent\
    \ the position of the imagehorizontal first and then vertical. They are negative\
    \ numbers as they represent the top left of the image will be positioned in the\
    \ desired part of the image showing through the 'window' created by the height\
    \ and width values.\n\n```css\n.imageOne {\n  height: 60px;\n  width: 60px;\n\
    \  background: url('picbig.png') 0 0;\n}\n.imageTwo {\n  height: 60px;\n  width:\
    \ 60px;\n  background: url('picbig.png') -60px 0;\n}\n```"
