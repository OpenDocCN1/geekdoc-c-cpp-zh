  md: "# Global namespace\n\nJavaScript code runs in a global namespace. This means\
    \ that all your separate functions, variables, objects, methods, and modules share\
    \ a common root, the window object. Nothing prevents you from adding your names\
    \ to the global namespace. If you declare variables outside of your functions,\
    \ or inside a function without a var statement, they will be placed in this global\
    \ namespace. There are a number of good reasons to avoid placing your variable\
    \ and function names in the global namespace, including:\n\n+   * They can easily\
    \ be overwritten or deleted by any other program or process that is loaded by\
    \ your application, including libraries and frameworks. Or you may have two of\
    \ your functions relying on the same global variable without realizing that another\
    \ function is changing.\n* Relying on global variables and functions can make\
    \ your code harder to maintain. They can discourage encapsulation and code organization\
    \ that will make your modules and functions easier to debug or reuse.\n* Accessing\
    \ a global variable directly from a function is slower than a local copy of the\
    \ global variable.\n* If your project uses global variables, you must make sure\
    \ you have a strict naming convention in place that prevents programmers from\
    \ declaring variables with the same name. You should be able to assign a company\
    \ prefix to each item in the global space, such as mvModel and mvViews.\n\n# Global\
    \ namespace solutions\n\nThere are a number of solutions to preventing problems\
    \ when using the global namespace. Normally, you have to place at least one object\
    \ in the global space, if just to hold all of your variables and functions. But\
    \ remember this is not a magic solution—you have one name that can still be overwritten,\
    \ resulting in your entire application being deleted. You still have to be careful\
    \ no matter what you do. Your solution depends on the type of application you\
    \ are writing. If you are writing a specific app where you control all the content\
    \ that will be added to the global namespace, you may pick a different solution\
    \ than an application that has to handle 3rd party libraries or code being added\
    \ to that space. Solutions to consider include:\n\n+   * Using objects to hold\
    \ your variables and functions. You can use one global object (which can contain\
    \ multiple objects itself), or a small set of global objects to keep most of your\
    \ names out of the global namespace. Thus, you might have code that looks like:\n\
    \n```\nvar globalObj = {\n  name: \"name\",\n  city: \"city\",\n  showName: function()\
    \ {\n    console.log(\" \" + this.name);\n  }\n};\n```\n\nThis places just one\
    \ name, globalObj, in the global namespace. The same approach works if you create\
    \ a Constructor function that creates new instances of objects."
