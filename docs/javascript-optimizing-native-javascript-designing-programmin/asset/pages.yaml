  md: '+   Loading the data into one large array that is not changed when filtering
    or sorting. This will help cut down on garbage creation and be more efficient.


    +   Building separate arrays of indexes for each sort order when requested. These
    arrays will be in the requested order but are simply pointers to the main data
    array. These could also be pre-built and downloaded from the server.


    +   Adding a filter flag to each array member that is set to true or false whenever
    the filter is changed. This way the filter code does not have to rerun every time
    the sort changes.


    +   Keeping the DOM footprint as small as possible. This involved making the elements
    playing as lightweight as possible and setting the display property to none for
    elements that were not currently displayed.


    # ## Step 1 - Data format


    Start with making your data as compact as possible. I loaded my data as aJSON
    object with only the fields I needed. I made sure the data was created on the
    server in the initial sort order I wanted, in this case alphabetically by name.
    This assumes that the dataset is small enough to be fetched and displayed in its
    entirety. If the data is too large, you will have to load it in pieces as the
    user scrolls through the list. All of the concepts mentioned here can be used
    for lists loaded in sections. However, if you are displaying a partial list in
    a large div using the scrollbars (instead of a next/prev type button), you may
    want to set the height of the containing div to the full height if all of the
    rows were loaded to ensure that the scroll bar looks and acts correctly.


    # ## Step 2 - Adding sort


    To allow for optimal sorting and filtering, I usually lay the data by placing
    the data fields inside a div element for each row, using absolute position for
    each row. I increment a row height to set the top property of each row. Each row
    is identified with a unique ID that directly references the array index element
    of the data. Try to keep the HTML elements as ''light'' as possible. This means
    avoid nesting a lot of elements in each row and keep CSS effects to a minimum—no
    shadows, transforms, or for examples.


    # ## Step 3 - Adding sort


    Now add the ability to sort on any of the columns. You can add some method to
    display the current sort column and let the user change that. This is usually
    done clicking on the column header to change the order which is then shown by
    a small triangle icon. Create a new array of indexes in this new sort order that
    points to your data array. This minimizes the amount of data you have to move
    around and can keep the sort index array to use again if the user resorts on this
    column. If the user specifies a reverse sort, you can use the same index array
    in the opposite order.'
  merge: -1
