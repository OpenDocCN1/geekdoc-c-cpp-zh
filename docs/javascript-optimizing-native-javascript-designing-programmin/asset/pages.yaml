  md: '# General types of questions at interviews


    There are a few general categories of questions that you might be asked. There
    are a number of books and blogs out there that list kind of interview questions,
    from technical questions to weird tricks.Take them with a grain of salt. A lot
    of them have good ideas but may go overboard. You will also find the questions
    listed in a number of places as being ‘common’ questions. There is some value
    in looking at these sources as in many cases the interviewers are also looking
    to find questions to ask candidates. Remember to learn the basics many of the
    questions I have been asked nothing to do with anything I ever done programming.
    An interviewer told me that if they had a candidate who could answer all of difficult
    or tricky questions, it probably meant that they had been looking for a job too
    long and nobody wants. The types of questions you will include:


    +   * **Experience/background.** What college did you attend; courses taken; degree
    achieved; etc. Make sure you do not exaggerate on—it is too easy to check. A short
    summary of your work history will be helpful.


    +   * **Coding questions.** The questions will probe your knowledge about programming,
    in our case: JavaScript, HTML, and CSS. The section below lists some common areas
    you should be familiar with.


    +   * **Project management.** How well have you handled projects, particularly
    those with multiple programmers? Have you used development tools like Agile?


    +   * **Behavioral/management.** Be prepared for questions about your working
    with former workers, how you solved work problems, how you handled difficult employees,
    etc.


    +   * **Brainteaser/trick questions.** These are all over the map. Some ask you
    to estimate how many ping-pong balls fit in a car, how many cans of paint it takes
    to paint the wing of a 747 airplane.. The ping-pong question normally requires
    you to make an educated guess, the airplane question might be answered simply
    by saying “One can - if it is enough.” Most of these answers are are easier than
    you might think. Listen carefully to the question. These questions have value
    in determining how well you can solve problem or think outside the box.


    +   * **Stupid questions.** “If you were an animal, what kind of animal would
