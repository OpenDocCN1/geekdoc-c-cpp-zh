  md: 'preventDefault(): This is used ONLY to cancel the default action of the event.
    You may want to have an event handler on a submit button that checks for error
    conditions and ensures all fields are filled before actually submitting a form.
    Not all events are cancelable but you can check the event''s cancelable property
    to determine its eligibility. The preventDefault method DOES NOT stop the event
    from propagating. You still need to use one of the other methods for this. It
    is mainly used to stop the following two types of actions:


    +   - clicking on a form submit button to stop the form

    - clicking on an <a href> to open a link


    +   - return false: This is very interesting and is probably the most misunderstood
    method for good reasons because it depends...

    - addEventListener: For handlers with this method, return false has NO EFFECT.
    You must use stopPropagation or/ preventDefault as needed.


    +   - HTML assignment: If you assign the handler directly on the element, like
    the following code, a return false in the handler will stop the default action
    but NOT stop propagation. You have to include the return in the onclick string.


    +   - attachEventListener: For handlers with this method (IE 8 or before), return
    false will prevent the default action NOT stop propagation.

    - jQuery handlers: For handlers set up using jQuery, return false will both stop
    propagation and prevent the default action. This is probably the source of the
    confusion.


    # UsingEventListener


    You can add handlers to your elements from JavaScript using the addEventListener
    method:

    element1.addEventListener(''click'', doClick, true); or nelement1.addEventListener(''click'',
    doClick, false);


    Both of these methods add a listener to element that will call the function onClick.
    However, each event gets during a different stage. The first assignment, using
    true as the last argument, will be fired during the capture stage. The second
    assignment, using false as the last argument, will be fired during the bubble
    stage. The default operation if you don''t include the last argument is false
    (bubble) stage.


    # Example of capture vs. bubble


    The following example shows how capture and bubble events work. We assign three
    different handlers to nest elements: a capture and bubble event on the topmost
    element, and a bubble event on the innermost element.'
