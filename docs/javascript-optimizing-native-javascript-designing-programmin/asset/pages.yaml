    In general, you can use them for finding or replacing specific patterns inside
    other strings. You can use them to validate input fields like phone numbers or
    zip codes, or to filter text on matching fields. They can be incredibly powerful
    but also incredibly confusing. If you choose to use them, make sure you comment
    your code so others will know what the expression is doing.'
