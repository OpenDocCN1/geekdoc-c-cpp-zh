  md: 'Newer browsers vary on how object methods and properties are stored and accessed.
    Some have been optimized to provide fast property lookup by using offsets instead
    of using a hash map. You don''t want your lookups to be forced to use a hash map—want
    the fast offset method. One thing you want to avoid is to change a "fast" lookup
    into a "slow" lookup. On browsers, using the delete method will cause this to
    happen, resulting in more memory used and slower performance. Sparse arrays are
    slower for a similar reason. Instead, you should just set the property to null
    which will free up memory but still leave the property set to null. Let''s look
    at three consequences associated with removing object properties (this doesn''t
    apply to the object itself—you can still remove the entire object.)


    # 1. Speed in removing


    I analyzed the relative performance of removing object properties using the delete
    method just setting the property (method or variable) to null. Obviously, if you
    leave the property alone, then there will be no hit, but using that memory could
    be freed up. Setting to null also in memory being used. The results were:


    | PERFORMANCE TESTING | | | |

    | OPS (bigger is better) | Safari | Chrome | Firefox |

    | 1. delete obj.doThat; | 95 | 84 | 34 |

    | 2. obj.doThat = null; | 5,029 | 1,227 | 1,889 |


    > Test 4-2: http://www.nativejavascript.com/tests/Test-ObjectsWithDelete.html


    This measured how long it takes to remove properties using the two methods. Setting
    the property to null will still have a significant effect in performance. I noticed
    that the times of these methods varied dramatically over browser versions so you
    should decide which method to use.


    # 2. Speed in accessing


    Once the properties were removed, I tested the performance of accessing the remaining
    properties of the test. I measured the access of the object properties assuming
    I did not delete any properties to begin with.


    | PERFORMANCE TESTING | | | |

    | OPS (bigger is better) | Safari | Chrome | Firefox |

    | 1. obj.doThat5(); //deleted other methods | 73 | 1 | 45 |

    | 2. obj2.doThat5(); //set other methods to null | 75 | 44 | 56 |

    | 3. obj.doThat5(); //no methods removed | 74 | 44 | 47 |


    > Test 4-3: http://www.nativejavascript.com/tests/AccessingDeletedProperties.html


    This test showed different results using recent browser versions. Using delete
    used to be much slower but the difference has almost disappeared on Chrome which
    is dramatically slower.


    +   - The recommended method considering all these factors is to use your unused
    properties to null unless there is some reason that you have to use delete.'
