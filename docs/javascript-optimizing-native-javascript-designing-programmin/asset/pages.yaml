  md: '# Step 4 - Filtering


    Now add the ability to filter the list. This has a few components.


    +   1. First, create a screen that allows the user to select the fields and values
    they wish to filter on.

    2. Then, using the filter criteria, walk through all the data records setting
    a filter flag to true or false. You want to set it once so it doesn''t have to
    run again if the sort order changed.

    3. Now, using the current sort order array, you want to walk through each row
    `<div>` element which can directly reference by ID. If the filter flag is true,
    you can set the display property to ''block''; otherwise it to ''none''. This
    will remove it from the DOM tree. At the same time, you will set the top property
    of the element to position it in order. By hiding and moving existing DOM elements,
    you reduce the amount of DOM thrashing and avoiding creating a lot of elements.


    # Step 5 - Scrolling lists


    Your list of `<div>` elements can be placed inside one large `<div>` that has
    the overflow property set to scroll. Then, size this element to fit on your page.
    This allows you to keep other elements (like menus or column headers) always visible
    on the page. Unless the list is large, you can display all the rows in the list.
    However, for very large lists, you may need to limit the number of `div` elements
    that are actually visible in the DOM (`display:block`) at one time. Having too
    many elements displayed at one time will slow down scrolling and screen transitions.


    One way to handle this is to add a handler on the scroll event for the parent
    element of your list. In that handler, you can detect the location of the scroll
    bar, and, using the height of each row and the height of the window, determine
    which elements are currently being displayed. You can then set the display property
    of those rows to ''block'' while setting the other row''s display property to
    ''none''. To make the next page or down scrolling a little smoother, you may wish
    to set the display property of the 100 rows above and below the currently visible
    row to block as well.


    # Caching


    Your server requests make your data loading faster as the data that exist in either
    your local cache or server cache can be used. The downside is that you might get
    ''stale'' data that has been changed on the server. This includes new versions
    of program files or data that may be frequently changed on the server. Most applications
    use some of `cache busting` technique to ensure that they always load the latest
    data. The downside is that it will make your program and data load slower. A frequent
    method is to append a timestamp to the end of each url to force the app to appear
    a new request that bypass any cache. Using something like a JavaScript object
    displayed in milliseconds is often used.


    However, you may find that neither the data nor the program changes that often
    (but it does change). If that is the case, you could try using a timestamp for
    your cache busting that'
