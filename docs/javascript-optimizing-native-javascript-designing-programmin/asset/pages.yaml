  md: '# JavaScript: Optimizing Native JavaScript


    For various reasons, I decided to separate the show data into several arrays rather
    than either one of objects or multi-level arrays. These made for smaller payloads,
    smaller memory usage, and slightly faster access times. Properties at the same
    location in each array were for the same show. Now, the data looked like for each
    channel in each array element:


    ```

    "titles": ["Angels", "Armada", "As the World Turns"],

    "chans": [[2, "KRON"], [4, "KPIX"]],

    "gridStartTime": 1335250800000,

    "showTitles": [[23, 21, 3, 6, ...], [6541, 12, 22, ...]],

    "showFlags": [[345, 124, 1122, ...], [233, 1122, 1122, ...]],

    "showTimes": [[0, 30, 60, ...], [0, 90, 180, ...]]

    ```


    The original plan using 3-hour segments to load and need almost 200MB of data
    being transmitted. The new format downloaded almost immediately and used only
    around 4MB of memory.


    Updating: The entire database was downloaded by any application that was still
    running. Since any new instance of the application would always get the latest
    data when it started, for any area that had the same channel lineup, it could
    be pre-built and changed in multiple places. Updates during the day involving
    changes for specific shows were handled by:


    +   * Making each thing very light to the server periodically asking for updates,
    if.

    * Updates were returned by sending the array elements for the channels that had
    changes. These would simply replace the existing array member (not the entire
    array) and the UI was refreshed if needed. Changes to the actual show title could
    be handled by either sending the entire title array, or simply appending a new
    title to the end. This would result in the list not being completely alphabetical
    but this would be corrected the next time the complete data was loaded.


    # Scrolling, sorting, and filtering large lists


    I designed several applications that could scroll very large sets of data while
    allowing the user to quickly sort and filter the displayed list. I had to make
    the sorting and filtering operation as fast as possible and allow smooth scrolling
    on PC''s and mobile devices. For various reasons, I wanted to load the entire
    list once and then handle all the operations in the application without having
    to make further requests. If you design correctly, you should be able to make
    this work for tens of thousands of records giving the user a much better experience
    than typical ''load at a time''. Obviously, the requirements will vary by application.
    If the top 30 records of data you retrieve will be of interest (similar to a search
    engine request), some of these techniques will not be needed. However, if you
    want to be able to retrieve data, change a filter, sort on different fields, then
    these methods apply. The areas focused on:


    +   * Making the data format loaded from the server as small and efficient as
    possible.'
