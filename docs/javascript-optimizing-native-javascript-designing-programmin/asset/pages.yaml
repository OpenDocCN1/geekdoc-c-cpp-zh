  md: '# JavaScript: Optimizing Native JavaScript


    +   - Learn how they accomplish the task today, either manually or with other
    software. Ask questions of each user: What are you doing now? What if this happens?
    What would make this task easier?


    +   - Making a prototype as early as you can and put it in front of users and
    then watch them interact and ask them questions. Do this as as feasible throughout
    the process.


    +   - You need to observe—don''t rely on others to mimic the observations as they
    often know the right questions to ask and they don''t know what may be possible
    with the software.


    +   - Sit with users and watch them do their tasks or run your program.


    # Business rules or requirements


    If you are developing your application for a client or company, there are usually
    a number of options or decisions called business rules. These affect how various
    parts of your app function and are usually put in a config file so they can be
    easily changed. You need to work with your customer to ensure you have included
    all necessary items. They usually affect areas where there are a number of different,
    equally valid, ways to accomplish a task. The list often includes items like sheer
    timeouts, password rules, logos, encryption of API''s, etc. Be sure you get the
    customer to detail these as early in the development cycle as possible.


    # Models and metaphors


    The conceptual model of how your application works match the one you used to actually
    make the application, or you will have problems. Sometimes the problem is created
    by the designer, being too close to the application and making assumptions about
    how the app works that a new user to the UI would not know. You need to be consistent
    in your UI design that the user will always know how buttons and scrolling work.


    A common UI design pattern is to mimic an existing metaphor that users may be
    familiar with. This is a pattern in other popular programs, or even a real-life
    metaphor that has nothing to do with computers. The selection of a visual or functional
    metaphor for your program must be made very carefully. You should pick something
    that actually it easier for the user to access your interface and you to be consistent
    with that metaphor. Examples of computer metaphors abound, including:


    +   - Index cards (Apple''s Hypercard, Flashcard programs)


    +   - Carousels. Usually used for pages that slide in and out horizontally.


    +   - Paper/Notebook pages. Background images that look like paper.


    +   - Rolodex. Most used for list of addresses or similar items.


    +   - File folders/tabs. Tabs are used to page between different screens of different
    functionality.


    +   - Books. Often used to show spines of books on shelves to allow user to select
    and open.'
