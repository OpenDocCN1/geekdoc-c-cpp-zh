  md: 'Chapter 7: Event Handling • 93


    # 7 Event Handling


    JavaScript has a number of ways to assign and handle mouse, keyboard, and touch
    events. It can be confusing to know exactly which method to use to assign handlers,
    and how to properly handle them to avoid breaking your application. I think there
    is also some uncertainty about how events are actually handled inside your document.
    There are all types of events that you will be handling in your code, including
    document load events and key handler events, but I will concentrate on input events
    that I think cause the most problems.


    There are several concepts that need to be understood concerning setting and using
    event handlers. These include:


    +   * Setting handlers

    * Understanding the order events are handled, including the concept of capture
    vs. bubble stages

    * Controlling the propagation of events through multiple handlers


    # Setting event handlers


    You can use a variety of methods to assign event handlers to elements. These methods
    are all different and are covered in more detail below. These methods include:


    +   1. element.attach(): IE8 and earlier only

    2. HTML assignment: as <div onclick="doSomething()">

    3. direct assignment from JavaScript: as element.onclick=doSomething;

    4. element.addEventListener: all browsers, IE9 and later. This is the recommended
    method as it separates code from HTML as well as having more flexibility.


    # Order of event handling


    There are three orders of event handling you need to be concerned with:


    +   1. Multiple handlers for the same event on the same element.

    2. Multiple handlers for different events on the same element.

    3. Multiple handlers for the same event on different elements.


    You can assign several handlers for the same event to the same element. You need
    to be aware of how your browser handles those multiple handlers.'
  merge: -1
  pgno: 99
- img_proc: true
  md: '# 94 • JavaScript: Optimizing Native JavaScript


    +   Multiple handlers for same event on element. You can assign two or more handlers
    for the same event, like two onClick handlers. They should fire in the order they
    were assigned but I would not rely on this. Because of the possible ambiguity
    of doing this, I strongly recommend against doing this. You are only asking for
    problems.


    +   Multiple handlers for different events on same element. There is a standard
    order that events will fire when you click on an element or press a key. You need
    to be aware of this when you assign your handlers. The order for standard mouse
    events is:


    +   1. mousedown

    2. mouseup

    3. click

    4. submit (if this applies)


    +   The order for key events is:

    1. keydown

    2. keypress

    3. keyup


    +   Multiple handlers for the same event on different elements. Each document
    normally consists of a series of nested elements, starting with the BODY tag and
    moving through your DOM. You may have a DIV that contains other DIV elements,
    SPAN elements, or FORM elements. When you create an event on an element (like
    clicking on), the browser works the DOM in two directions, passing the event to
    any handlers that have been assigned. First, in the capture phase, the event will
    move from the top, outer-most element to the element that was acted upon. Once
    it reaches that element, it bubbles up to the outermost, top element. Any handler
    for this event on any of those elements will be executed.


    However, it is more complicated than that. All regular handlers work only on the
    bubble stage. Then you get any of the events created during the capture stage.
    There is only one way to see the capture stage, and that is assigning handlers
    using the addEventListener method, specifying the correct argument. This method
    works on all browsers except IE8 and earlier.


    # Event propagation


    Events are automatically passed to parent and children elements following the
    capture and bubble stages described above. If you do not want this default behavior,
    you must add methods to your event handlers to stop propagation. You will see
    several methods called from within event handlers to stop or how events are handled
    or propagated. It is important to understand the differences between these methods
    as it is easy to use the wrong method.


    +   event.stopPropagation(). This stops the propagation of the current event has
    no effect on other events that may have handlers. This works in both capture and
    bubble stages. If you stopPropagation() in an event handler registered as a capture
    handler on an element at the top of your DOM tree, event will never reach any
    other handler.


    +   event.cancelBubble = true. This acts similarly to stopPropagation but is only
    used for IE8 and earlier versions. If you need to support those browsers, you
    will need to handle both methods.'
