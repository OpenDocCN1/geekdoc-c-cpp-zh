- img_proc: true
  md: '# 150 · JavaScript: Optimizing Native JavaScript


    ments to determine which error conditions are most likely and important. You should
    have a set of use cases that match this prioritized list. You will almost always
    ship your product with known bugs, but bugs you have examined and decided you
    can live with. The later in your development process you fix bugs, even minor
    bugs, the higher the risk of breaking something that you don''t have time to detect.
    The effects you should focus on, in approximate order, include:


    +   - Prevent errors. This unit testing your code as much as possible. Make sure
    routine and module are as bullet-proof as possible, without adding excessive code
    to handle every possible. For most you know what parameters will be passed in
    or what possible error conditions might be, so be sure you handle those problems.


    +   - Make it difficult for the user to create errors. Add code where appropriate
    to prevent the user from doing something that may cause an error that be hard
    to catch. For example, to prevent multiple keys, you could have an alpha layer
    div (with an opacity of .5) that you the entire screen with the user presses a
    button. This prevents the user from accessing anything else on the screen until
    the first process finishes. Likewise, you could disable the key, mouse, or touch-handling
    until the previous event is completely handled.


    +   - Make error conditions easy for the user to undo. If you are unable to completely
    eliminate an error, then make sure the user has an obvious way to undo the operation
    or back out of the current error condition. This may be like selecting a filter
    that results in an empty list. While not a true error condition, you should have
    a clear indication on the screen of what is happening and what the user can do
    next. Be sure to avoid always having obstructive, modal popups that the user has
    to keep handling. That is real drag!


    +   - Add try/catch code where appropriate. You can now add try/catch statements
    around your JavaScript to handle error conditions. I would keep the following
    in mind when using:


    +   - Don''t automatically put them in when you start coding as they may hide
    real errors that you should properly address.


    +   - They make the code run slower. They create closures over the statements
    which could slow down the code depending on what is in the closure.


    +   - Don''t rely on them at the expense of writing the code properly to begin
    with. Use them for true, unexpected error conditions.


    +   - They are most useful, and required in many cases, when you are handling
    external data that you have no control over. For example, if you are processing
    a JSON object that you fetched from a server, you may encounter error conditions
    that you can''t plan for.


    +   - Capture errors. If possible, you can add code to capture error conditions
    (or for that any user action) and log them or send them to a server where you
    can analyze the error and hopefully fix the condition in the next code release.'
