  md: '# Loading program files


    There are a number of ways to load your program files—the HTML, CSS, and JavaScript
    files that make up your application. The method you decide on will most likely
    be influenced by the general use of your program and the variables that you want
    to optimize for. Some of the factors to consider include:


    +   - You can use script tags in your HTML to load your JavaScript files. The
    general practice is to put these at the end of the HTML so that the UI will load
    and display as fast as possible. Most browsers will allow multiple files to be
    fetched but they will block execution as they are loaded and parsed. There is
    an advantage to loading fewer, bigger files but these will block longer.

    - You may want to delay loading some of your files that are not needed right away
    to provide a better user experience. You would include the script and style tags
    in your main HTML that will just the bare code to display the first UI. The JavaScript
    loaded would contain the code to dynamically load the rest of the application
    as needed.

    - You may want to programmatically load files so that you can load different files
    based on user settings or preferences. Your initial script file loads conditional
    logic that uses config values or the information in the URL to determine which
    files to load. This could be helpful if your application supports different brands.

    - You may want to consider using a loader like require.js to load files only when
    needed. This is helpful if your application may never need certain files.

    - You should consider combining your files together there is overhead for each
    fetch. You can compress each file using any number of existing compressors or
    compactors. Using minified code can make debugging more difficult. To use compressed
    code where the spaces and comments have been removed, but not minified code where
    the variable and function names have been changed. There is some potential danger
    with minified names in JavaScript because of its loose typing and use of eval.

    - You should also consider the effect of caching on your file load times. Caching
    common files that are frequently fetched may decrease your load times. The downside
    of caching is that new files that have changed may not be loaded. This is more
    critical when developing your app or if your code changes often.'
  merge: -1
