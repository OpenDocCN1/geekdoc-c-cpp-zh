  md: '# Appendix B: UI Design • 165


    # Start with use cases


    The most important (and most overlooked) step in the development of a new application
    is clearly identifying what the application should do. This is best done by identifying
    the most common ''use cases'' which describe the various tasks that your software
    should accomplish. The Agile environment tells them stories. There are a number
    of systems in use that various methods and methodology to describe these, using
    terms like actors, goals, and systems. Your company may have specific requirements
    for how you should develop and document use cases—the most important thing is
    to take the time to analyze exactly what your software needs to accomplish and
    how it will be used. Make sure your application:


    +   - Accomplishes what the user needs to get done. You can add some cool features
    or special animations but just make sure the important tasks are accomplished.


    +   - Is usable by the target user. You need to take into account the skill and
    experience of the user. Designing an application for the mass market has different
    requirements than one that would be used by chemical engineers, for example.


    In general, you want to build up a number of use cases that cover all the expected
    usages of your application. Make sure you cover all of your common, expected actions
    and most of the anticipated cases. Each case usually includes the following simplified
    items:


    +   - Name: Name of the use case, such as: Make a Reservation.


    +   - Actor: This is a user of your application who carries out a specific action.
    If you are designing a travel application, you may have actors for each of the
    following:


    +   - Person searching for first flight.


    +   - Person reserving flight.


    +   - Person accessing previous reservation.


    +   - Notifying person that flight is changed.


    +   - Actions: Detailed steps to accomplish this use case.


    +   - Result: A measurable result from the actions.


    +   - Priority: Some indication of the importance of this case


    You need to have the complete requirements for your application in order to make
    the correct use cases. Make sure your measurements of results are as objective
    as possible. Your result can''t be "fast navigation" or "easy to use”—it should
    be concrete and measurable—full page scroll in less than 2 seconds" or "95% of
    users select proper menu item the first."


    # Observe your users


    Most of the times I have been unhappy with applications that I have released have
    not been able (or had the time) to sit with users and watch how they interact
    with the software. Sometimes a client has made it difficult to meet with their
    users; the schedule has been too tight to allow this. Even if you fit the requirements
    of your target user, you are way too close to the product to be a good test case.
    If you do have access, be sure to to the:'
