    # Variable types


    JavaScript is not a typed language. This does some problems and also means your
    IDE, if you use one, it''s not optimized in the same way it would be for a regular
    typed languages. There are solutions out now like TypeScript, and future plans
    for JavaScript itself to address this shortcoming. In the meantime, you can use
    this "feature" to your advantage if you are careful. You just need to be aware
    of how the JavaScript operators work and what the values are that you are testing.
    Even though variables are not strictly typed, there are several general types
    of variables that can be created,:


    +   - strings

    - numbers

    - objects

    - booleans


    You need to be aware of variables when you try to perform operations on them or
    you may get unpredictable results. Javascript does try to coerce variables of
    one type to another where possible, as adding a number to the end of a string,
    but you have to understand what is happening or you may get the wrong results.
    If you stay aware of what your data and input fields are in, then you should be
    able to properly handle it in your code.


    # Caution with global variable declarations


    First of all, you should keep global declarations to a minimum. You can declare
    some higher object names as globals but try to avoid using global declaration
    for variable names. Assuming that you must declare some global variables, there
    are three general ways to do that you are normally concerned with:


    ```

    globalVar = 12;

    var globalVar2 = 13; //using var may create a problem

    window.globalVar3 = 14;

    ```


    These all essentially assign your variables to the global object, but they are
    handled a little differently. This is usually not a problem until it comes time
    to remove them. One way is to assign them the value of null, similar to:


    ```

    globalVar = null;

    globalVar2 = null;

    globalVar3 = null;

    ```'
