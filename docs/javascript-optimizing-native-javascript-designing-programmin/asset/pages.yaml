  md: '# CSS Techniques


    You can use Cascading Style Sheets (CSS) to format your HTML displays. With the
    release of CSS 3, your applications can now take advantage of many powerful features
    that add animation, drop shadows, and more display control for mobile devices.
    This chapter is not a CSS reference manual or a detailed description of each CSS
    property but rather a collection of some general comments about common CSS uses
    and problems.


    # Including CSS in your application


    +   Adding your CSS definitions inside <style></style> tags in your HTML. These
    would have to be repeated inside each HTML file the definitions are used.


    +   Put your CSS definitions in a separate CSS file that you include your HTML
    by specifying something similar to the following inside your head. This allows
    one CSS definition file to be used by multiple HTML files and load faster as it
    will be cached after the first access, but you will have to include a reference
    to this in each of your HTML files.


    ```

    <link="stylesheet" href="index.css" type="text/css">

    ```


    +   Load an external CSS file from your JavaScript code using an XMLHttpRequest
    method. This may be useful if you want to download loading files, or if the CSS
    is only needed some of the time, or if you need to load different CSS files based
    on value available at runtime. You may have subdirectories of CSS organized by
    theme or company and may want to select which ones to load.


    +   Include the necessary CSS properties directly inline in the HTML tags. This
    is generally not recommended as it doesn''t allow the display to be separated
    from the data and styles cannot be shared but are actually overridden.


    +   Use JavaScript to assign style attributes or classes to specific elements.


    # Position property


    In laying out your screens, you need to decide if you are going to use absolute
    positioning or rely on letting the normal flow determine the position of the elements.
    In designing phone applications, I usually rely on absolute positioning to ensure
    text and graphics up'
