    in noting what actions are taking place. You should use motion to emphasize what
    is happening - clicking a right arrow should slide in the next screen from the
    right, pressing a down arrow should slide the next page up from the bottom of
    the screen, etc. This is very important compared to just displaying the new screen.
    However, animations can be costly in terms of performance. Try to avoid them if
    they are not needed and try to avoid animating elements at the same time.


    # Image pre-caching


    If you application images for your interface or to display as part of user selections,
    you may want to consider pre-caching them in order to speed up the display. This
    involves loading before they are displayed and storing them in an Image object.
    Then, you can refer to the object you want to actually display the image.


