  md: '# Appendix A: Interviewing • 155


    interviews at jobs I was interested in that the interviewer didn''t think I was
    interested. A follow up with e-mail would have helped remove this impression.


    +   **Interview often.** Interview as many times as you can. You don''t want to
    waste an interviewer''s time if you know for sure you want the job but every interview
    will improve your performance in the next one. I know first interviews were disasters
    until I got more experience. Plus it seemed learned something from every interview
