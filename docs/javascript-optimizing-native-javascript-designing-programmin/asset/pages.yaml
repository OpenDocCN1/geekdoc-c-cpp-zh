  md: "JavaScript: Optimizing Native JavaScript\n\n# Handling typehead\n\nTypehead\
    \ refers to keys or events added to the event or key buffer because the user is\
    \ pressing keys or buttons faster than the program can process them. Typehead\
    \ in input fields is usually handled differently and is acceptable most of the\
    \ time. Handling the other kind of typehead is sometimes desired and sometimes\
    \ not. You should address it in your applications depending on your desired user\
    \ experience. You normally can allow one of several options:\n\n+   - Go ahead\
    \ and cache the events and carry the operations out in order. You will need to\
    \ make each operation as fast as possible to try to keep up with the events.\n\
    - Carry out the first operation and discard all subsequent events or keystrokes\
    \ until the operation finishes.\n- Accept all the events or keystrokes by immediately\
    \ enter a \"fastmode\" where you have a small, fast runtime that can execute an\
    \ operation fast enough to keep up with the events. Typehead usually just a portion\
    \ of the normal UI in order to be fast—this may be displaying a channel number\
    \ or page number but no data. You can use a timer for keeping gets cleared on\
    \ each new event. Once there are no events within a certain time, the timer method\
    \ will find and you execute the main function which fills in the screen.\n\nThe\
    \ methods of either enabling or disabling your desired kind of typehead handling\
    \ includes:\n\n+   - Disable element. You can disable the button or element when\
    \ it is pressed or touched the first time. You can do this in several ways including\
    \ setting the disabled property to true. When the code carries out the operation\
    \ finishes, it will re-enable the element.\n- Use timeout. You can use a timeout\
    \ in the function that is called when the user presses the button. The button\
    \ will call the actual function that carries out the operations.\n\n```\nfunction\
    \ handlerKey() {\n  clearTimeout(keyTimer);\n  // to display fast mode UI\n  keyTimer\
    \ = setTimeout(function() {fullDisplay(); }, 220);\n}\n\nfunction fullDisplay()\
    \ {\n  // to do display\n}\n```\n\n+   - Timestamp. Most browsers support a timestamp\
    \ property on the event. This can be used to essentially clear the key or touch\
    \ buffer. This may be necessary if a function that runs for a long time and the\
    \ user has been creating touch, mouse, or keyboard events. You can compare each\
    \ event's timestamp property to \"now\" and throw away keys that are older than\
    \ a specified number of milliseconds, similar to:\n```javascript\nvar now = new\
    \ Date();\nvar diff = (now - event.timeStamp);\nif (diff > 300) return; //ignore\
    \ keys from more than 300ms\n```"
