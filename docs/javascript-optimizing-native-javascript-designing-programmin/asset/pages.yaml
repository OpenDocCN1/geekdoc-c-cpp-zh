  md: "# Chapter 9: Fetching Server Data • 117\n\n# Using canned data\n\nIf your application\
    \ relies on data downloaded from the server you may want to consider having this\
    \ data available locally in pre-built data files. This often referred to as *canned\
    \ data* and can be very helpful for several reasons:\n\n+   1. You may not have\
    \ the server APIs or data working in time for you when using your interface. You\
    \ want to be able to fill in lists and write the code to properly display the\
    \ screen first instead of stubbing it out and redo later.\n2. You may have to\
    \ run the program in the future when you do not have connections to the server,\
    \ or if the servers are not working for some reason. This can happen when giving\
    \ demonstrations to management, or at trade shows.\n3. It can also be used before\
    \ the server API's are in place in order to design the appropriate JSON data structure\
    \ and get it completely designed before giving it to the programmer who is implementing\
    \ the server API.\n\n# Limitations\n\nObviously you cannot recreate all of the\
    \ server API's using canned data. If your application displays a list of names\
    \ that allow the user to select any name to fetch detailed information from the\
    \ server, you obviously have to have canned data for only one or two names and\
    \ then add a test mode to your app indicate when to load only those files. But\
    \ it can be very helpful for this and other start data files that are loaded.\n\
    \n# Setting up canned data\n\nAdding the data to your canned files is fairly straightforward.\
    \ You have two choices:\n\n+   * If you do not have the server API in place, you\
    \ will need to manually enter the data in a valid JSON format using a text editor,\
    \ or\n* If you have the API working but want to guard against it not being available\
    \ in the future, or it may be almost correct, or you want to work offline, you\
    \ can do something similar to the following (it may change slightly in different\
    \ browsers):\n1. Before doing these steps, you should add a JSON formatter extension\
    \ to your browser.\n2. Open your browser and the debug console.\n3. Go to the\
    \ network tab in your debug console.\n4. Load your application and execute the\
    \ API request you are concerned with, or simply enter the URL in the server's\
    \ URL field. If the API has been executed from your program, you can do the following:\n\
    \   a. In the network tab, you will the requests for all of the files that your\
    \ application loads, including the data request.\n   b. Right click on the name\
    \ of the API you want to capture and select the 'Open link in new tab' option.\n\
    \   c. A new browser window will open displaying the results of the request. If\
    \ you have a JSON formatter in your browser, it should be nicely formatted and\
    \ indented.\n   d. Copy and paste this data to a text file and give it an appropriate\
    \ name."
  merge: -1
