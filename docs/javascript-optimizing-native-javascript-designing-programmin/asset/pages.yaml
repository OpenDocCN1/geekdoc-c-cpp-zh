  md: '# Event delegation using event bubbling


    Event bubbling allows you to set one event handler on an outer element that will
    get all events fired on all inner elements. This helps you greatly reduce the
    number of handlers in your code. Rather than setting a handler on every row or
    cell in a table, for example, you can set one handler on the table that will get
    all events from all the rows. You will all need to do check for the id of the
    element that created the event and take the appropriate action. Elements that
    you don''t recognize will have their events ignored, or you can cancel them.


    When you place your handler on the outermost element, you normally will need to
    know which inner element was acted upon. Your handler can access two properties
    that will help properly handle the event:


    +   * this: refers to the element that is handling the event that have bubbled
    up from a lower element. It does NOT refer to the element that was initially acted
    upon. You will have to test for this in another way.

    * target can access the original element that was acted upon by using the following
    line of code that handles the differences between browsers. The result of this
    assignment are the same in every handler that is executed when the event bubbles
    up. You can use this variable to determine the ID of the element that was selected.


    ```

    var target = event.target || event.srcElement;

    ```


    NOTE: The IE attach method does not pass any value for this.


    # Delegating events like focus and blur


    Some events do not bubble up to outer elements so trying to use a regular event
    delegation handler will not work. These events include focus, blur, and change.
    However, these events can be handled by a capture handler set up with addEventListener.
    This could be used to know when any child element has received focus, for example.


    # Differences in event names


    The exact name used to assign event varies slightly by browser and by usage. For
    example, to add a handler that takes care of click events, you could use one of
    the following methods:


    +   * <div onclick="doThis()">

    * element.onclick = doThis;

    * element.addEventListener(''click'', doThis, false);

    * element.attachEvent(''onclick'', doThis); (IE 8 and before)


    Note that you use onclick in all cases except when usingEventListener. The same
    difference applies to other events, such as: focus/onfocus, blur/onblur, and key/keyup.
    You will need to test for the proper handlers in your code before you assign them
    to your handlers.'
