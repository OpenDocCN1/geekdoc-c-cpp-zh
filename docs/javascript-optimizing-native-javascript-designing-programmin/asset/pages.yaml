  md: 'Chapter 5: HTML • 71


    # HTML


    Your application starts with your HTML file. Your HTML contains what your user
    will see and determine how they will interact with your applications. We will
    discuss the CSS (Cascading Style Sheet) used to apply styles to your HTML elements
    in a later chapter. The other term you need to be familiar with is the Document
    Object Model or DOM. This model is the representation of all the elements that
    can be displayed by your application. It is often referred to as a "tree" since
    it is a hierarchical list of related elements.


    # Rule Number One


    Don''t mess with the DOM. Proper access and manipulation of the DOM tree is one
    of the major causes of poor application performance. You need to minimize the
    number of times the browser must reflow your document''s DOM elements. An easy,
    and inadvertent, of forcing a reflow is to simply ask for an offset value, like
    elem.offsetTop. These methods force the browser to reflow the entire document
    in order to determine the exact value of the offset.


    # Rule Number Two


    See rule number one.


    # How to add HTML elements to your application


    There are several ways to add HTML elements to your application. You will have
    to decide which methods make sense for your application. Each method has its advantages
    and disadvantages. There are also number of template systems and frameworks like
    Angular that are available that also adding HTML or dynamic HTML. The native methods
    include:


    +   1. Place the elements in your main HTML file, called index.html. This may
    be useful if you have static HTML that isn''t dynamically updated. In general,
    you want to have only the HTML loaded at the start that is for your initial screen
    display.

    2. Append sections of HTML that you read from to the appropriate section of the
    existing HTML. This allows you to defer sections of the DOM until you need to.

    3. Copy or clone existing elements and add them back into the DOM. You can change
    the values of any attribute before adding them to the DOM.

    4. Create the elements from JavaScript either innerHTML or appendChild. This allows
    you to create custom attributes and use loops to populate the DOM. An advantage
    of appendChild is that you can save the handle to the element the time you create
    it if you need it later to change the element properties or content.'
