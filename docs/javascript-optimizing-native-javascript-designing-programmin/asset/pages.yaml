  md: "# JavaScript: Optimizing Native JavaScript\n\n# Getting to your first screen\
    \ faster\n\nYou need to decide what to optimize for designing your application.\
    \ Sometimes you want to display the first screen as fast as possible; other times,\
    \ you want to load more information before displaying the interface or the full\
    \ interface. Assuming you want to get your first screen displayed and operational\
    \ as soon as possible, you need to keep the following in mind:\n\n+   * To minimize\
    \ the amount of JavaScript code that is needed to display the first screen. Instead,\
    \ have most of the work done by your HTML and CSS.\n* Have the initial file that\
    \ is loaded (usually index.html) contain just the HTML that you need for your\
    \ first page. Have your JavaScript load or create the rest after the first page\
    \ load.\n* Put your script tags at the end of the document, after the HTML, to\
    \ ensure that the HTML loads as fast as possible. Loading JavaScript files using\
    \ script tags will block the complete display of your page. Most browsers will\
    \ load script files in parallel but still need to load.\n* You normally not need\
    \ any JavaScript executing until your DOM is properly loaded. You can use one\
    \ of two events (or both) on your body tag to call your initialization:\n  * onContentLoaded:\
    \ This fires when the document is loaded and parsed, but images and stylesheets\
    \ may not be loaded yet. If your HTML is complete and doesn't need these items,\
    \ this may work.\n  * onload fires when the page is fully loaded. This waits for\
    \ these other items, it may not fire for a while.\n\nSometimes it might be better\
    \ to load more files and images when you start the app so that the application\
    \ performs faster. One of UI design is deciding when and how to preload elements\
    \ or information.\n\nYou can also use the defer option in the script tag to defer\
    \ loading of scripts that do not affect the DOM display. This is supported by\
    \ most browsers. Once the DOM has been loaded these files will be requested and\
    \ loaded.\n\nSee more information in Chapter 11 about loading JavaScript, HTML\
    \ and CSS files.\n\n# Cloning nodes\n\nIf you have nodes you want to copy, you\
    \ can use the cloneNode method to make copies. There are some advantages of creating\
    \ elements this way, including:\n\n+   * You can copy the node but change individual\
    \ properties before adding it back into the DOM. This can be useful for changing\
    \ properties like ID or position.\n* You can save the handle to the element if\
    \ you need it later in your program.\n\nAn example of this to clone an element\
    \ is:\n\n```\nvar rowelement = document.getElementById('rowid-0');\nfor (var i=1;\
    \ i<10; i++) {\n  var newNode = rowelement.cloneNode(true);\n  newId = 'rowid-'\
    \ + i;\n  parentobj.appendChild(newNode);\n}\n```"
