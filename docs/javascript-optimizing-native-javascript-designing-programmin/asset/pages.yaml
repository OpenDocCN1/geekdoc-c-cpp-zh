    \ Doe</div>\n<div id=\"name_full-1\">Jane Doe</div>\n```\n\nBy that, you can access\
    \ these elements in a loop:\n\n```\nfor (var i=0; i < 2; i++) {\n  document.getElementById(\"\
    name_full-\\+i).innerHTML = names[i];\n}\n```\n\nYou can also use other methods\
    \ to locate elements by their class or ID. Your exact application will dictate\
    \ the best method.\n\n# innerText vs innerHTML\n\nThere are several ways to add\
    \ text or HTML to existing DOM elements. Depending on what you are trying to add,\
    \ you need to be sure you select the correct method. Two methods handle just text\
    \ while innerHTML will add HTML tags and text. Methods didn't work with older\
    \ browsers but should work with most current browsers. These methods can be used\
    \ to either set or get the content. There are other differences between the methods:\n\
    \n+   * innerHTML: This adds HTML tags but is slower than innerText of the extra\
    \ layer. Be careful using it it will replace all the HTML content inside the element.\
    \ If you need to add HTML tags, then this is the method you must use.\n* innerText:\
    \ Sets or gets the text of the element and not any HTML tags. It will not return\
