  md: '# Chapter 13: Debugging • 139


    # 13

    Debugging


    There are a number of tools available to help you debug your JavaScript/HTML applications.
    Firebug is a popular tool for debugging in Firefox, while Chrome has an excellent
    built-in debugger. Other browsers have built-in debugging tools with similar functions.
    I tend to use the Chrome debugger as I think it is the easiest to use, but you
    most likely will have to run debugging tools on every browser that your application
    supports. These tools are helpful at every step of your development cycle but
    are particularly useful when debugging final performance and memory problems before
    deploying. Use them and use them often.


    There are other tools available like JSLint or JSH to debug and format your code.
    Many errors can be found ahead of time by these tools and help in making your
    code more readable as well. Many development environments, like Eclipse or IntelliJ
    IDEA, will perform these functions as well, many of them in real time as you enter
    code.


    The available tools are well documented on the Internet and in publications, so
    I will not cover them in depth. However, I will touch upon the more important
    parts of the Chrome debugger that I frequently use when developing applications.
    You may want to research JSLint and JSHint for more information about how to use
    those tools.


    # Chrome developer tools


    With your Chrome browser you can run the developer tools by clicking on its small
    Menu icon and selecting More Tools/Developer Tools. This changes slightly depending
