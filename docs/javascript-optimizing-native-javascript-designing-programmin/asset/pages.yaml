  md: '# Appendix B: UI Design • 163


    # # UI Design


    Your job as a JavaScript programmer may not directly involve designing the user
    interface. You may have a different person or team that is designing the UI and
    you are simply implementing it. Or you may be in charge of designing and programming
    the interface. In either case, you should be aware of the general guidelines,
    concepts, and best practices for computer interfaces. You don''t necessarily have
    to be a graphic designer as well as you can easily get skills provided by someone
    else. This chapter includes recommendations about UI design from start to end.


    # Single page apps


    Traditional websites often are composed of separate pages that are linked together
    with hyperlinks. You load an entire page, when the user clicks a menu button,
    you replace the current page with a new HTML page, reloading the required JavaScript
    and CSS files. This will result in some screen flashing as the first page is unloaded
    and the new one loaded and displayed. Single page app works a little differently.
    You load all the HTML, JavaScript, and CSS files that you need then hide and show
    the elements as the user navigates the site or application. You can still load
    content only when needed, but the important point is that you don''t change the
    main global context as you don''t have to reload or reset variables.


    Single page apps require you to spend a little more time front designing your
    pages to reuse as much code as possible. If you use a common background for all
    the pages or a common menu, you don''t have to reload anything and you will avoid
    any screen flashing. The same goes for loading the JavaScript code that will persist
    for the duration. Spend the time up to design all the screens and functions of
    your application and you will have a better experience.


    # General UI goals


    There are some basic guidelines that you should keep in mind when designing any
    UI. They include:


    +   - Clarity. Your interface should clearly display its information and have
    controls that are clearly separate from the data.


    +   - Limit options. Having more than 5 or 6 choices on a screen makes it difficult
    for the user.


    +   - Be consistent. All the screens in your application should have a similar
    look and feel, and all the controls should look and act the same way.'
  merge: -1
