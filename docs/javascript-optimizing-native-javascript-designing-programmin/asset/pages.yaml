    # # Concatenating strings


    There may be cases where you have to create one large string by concatenating
    smaller strings. This is often used when creating HTML strings that will be used
    with an innerHTML property. There are several ways to accomplish concatenation.
    The methods that have larger memory requirements so you will have to decide on
    the proper trade off. Browsers have gotten much better in optimizing memory usage
    when concatenating and attempt to minimize the amount of copying memory blocks.


    | PERFORMANCE TESTING |

    | Safari | Chrome | Firefox |

    | 1. str = str.concat("abcd"); | 337 | 475 | 341 |

    | 2. str++ = "a" + "b" + "c" + "d"; | 383 | 988 | 700 |

    | 3. array.push("abcd"); str = array.join("","); | 323 | 192 | 283 |

    | 4. array[str.length]="abcd";str=array.join("","); | 323 | 188 | 301 |

    | 5. str++="abcd"; | 786 | | 814 |

