    \ and scroll bars on traditional mouse screens are very obvious. Everyone immediately\
    \ understands how to use them and what information they convey. The Down arrow\
    \ on the keyboard corresponds directly with the down arrow on the scroll bar or\
    \ moving the elevator bar. They all move down the document. However, touch screens\
    \ alter this obvious usability. Move down in a list, the user swipes over the\
    \ screen. If you display a scroll bar, it will move in the opposite direction.\
    \ If you let the user grab the scroll button and move it, then action will be\
    \ opposite of doing the same over text. You must be clear in how you display these\
    \ controls and what you \"invite\" the user to do. And I really don't like \"\
    hidden\" scroll bars that only appear when you are using them. Visible scroll\
    \ bars convey a lot of knowledge to the user—that there is more data than visible,\
    \ what part of the current screen displays, how big the document is, and you gives\
    \ a one-click method to scroll up or by page of data.\n- Spinners. You may also\
    \ have problems with spinners used for numbers or dates, and the corresponding\
    \ cursor keys are handled. If it is a list of dates, then moving up back in time\
    \ (smaller number) or to a higher number (forward in time). If you can, make date\
    \ controls move from left to right. You will have a similar problem for channel\
    \ numbers in a television guide. A Channel Up button may have the Up/Plus on top\
    \ of the button, but moving up in a displayed shows lower channel numbers.\n On/off\
    \ sliders. These are popular on iOS devices but use their space. They can be very\
    \ annoying if not implemented properly. Do slide them to the side or click on\
    \ one or the other? Do they even when moving the mouse?\n\n# Animation\n\nThe\
    \ designer needs to be involved in this and it is very important that they can\
    \ actually write the CSS that handles the animation. It does not help a programmer\
    \ to give what the animations should look like—they really want the CSS that shows\
    \ the exact vision, transform, or animation that produces the desired animation.\
    \ Programmers often will not know the effect desired by the designers.\n\nWith\
    \ the advent of CSS3, it becomes easier to quickly produce all kinds of cool-looking\
    \ special effects for screen transitions, moving elements around, or scrolling.\
    \ However, there is danger lurking with these new effects, including:\n\n+   -\
    \ They can be slow or jerky on devices that don't have the CPU power of your computer.\
    \ Having slow or jerky animations is most likely worse than having them. Don't\
    \ just test them on your high-end computer—try them on your targeted devices.\
    \ Preferably, you will try your desired animations in small test files before\
    \ deciding to incorporate them. Remember, though, that they may act differently\
    \ once you have the code in the full app with a full DOM tree."
