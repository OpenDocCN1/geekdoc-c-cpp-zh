  md: "# 116 • JavaScript: Optimizing Native JavaScript\n\n+   * Caching: These requests\
    \ are not cached.\n* Bookmarking: Post requests cannot be marked.\n* Visibility:\
    \ Any data is not displayed in the URL.\n* Size: There is no unreasonable restriction\
    \ on the amount of data sent.\n\n# Cross-domain problems\n\nYou are making cross-domain\
    \ requests if your code is making GET or POST requests to a server that is in\
    \ a different domain. Thus, if your application is running on www.sample.com,\
    \ a request to make a server application on www.test.com is a cross domain request.\
    \ If you need to make these kinds of requests, you have two options:\n\n+   *\
    \ CORS (Cross-Origin Resource Sharing): This has to be set up on the server referencing\
    \ that it will accept requests from your server.\n* JSONP: This stands for \"\
    JSON with Padding\". These requests are made by setting a source property on a\
    \ script tag that is added to your DOM. Your requesting URL must include a unique\
    \ name that is used by the server to wrap the returned data inside a function\
    \ that be executed by your browser. Thus, a regular JSON object might look like:\n\
    \n```\n{\n  \"name\": \"John Jones\",\n  \"age\": 12\n}\n```\n\nand the corresponding\
    \ JSONP would look like:\n\n```\ncb123(\n  \"name\": \"John Jones\",\n  \"age\"\
    : 12\n});\n```\n\nYour code must create the function that is called by the JSONP\
    \ before requesting the data (in this case `cb123`). Be à that parse errors in\
    \ the JSONP data may create an uncatchable error. This is usually caused by the\
    \ server not wrapping the data inside a function call.\n\n> NOTE: JSONP can only\
    \ be used with GET requests and not PUT requests.\n\n# Differences between UNIX\
    \ and Windows\n\nIf you are moving or sharing files between UNIX and Windows computers\
    \ and servers, there are a few differences you should be aware of, including:\n\
    \n+   * Line endings: UNIX uses a single LF (line feed) to end lines where Windows\
    \ uses CRLF (carriage return/line feed). Source control systems usually handle\
    \ this but need to be careful.\n* Character encoding: Character encodings of special\
    \ characters may be different between the systems.\n* Filenames: UNIX systems\
    \ normally ignore upper and lower case characters differently. Windows systems\
    \ normally ignore case in file and folder names. To avoid possible problems, I\
    \ try to keep all folder and file names in lowercase."
  merge: -1
