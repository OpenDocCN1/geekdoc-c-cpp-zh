  md: "# Getting images to display faster\n\nImproper use of images can make your\
    \ app slower slower to load and display, and can affect the speed of UI navigation.\
    \ There are a number of things you can do when designing your application, including:\n\
    \n+   - Minimize the number of images you use in your application.\n- Use solid\
    \ background colors instead of images.\n- Design your screens so that you share\
    \ as many UI elements as possible. Besides minimizing the number of elements that\
    \ have been loaded, your screen transitions should be smoother without any flashes.\n\
    - Combine smaller images into bigger images so that you load them as sprites,\
    \ discussed below.\n- If you have to use image, make sure it is created at the\
    \ exact size that the UI uses to display. Don't request a large image that takes\
    \ up bandwidth only to have the browser scale the image to a smaller size. Plus,\
    \ you can usually use your graphics editing tool to create a better looking smaller\
    \ image.\n- Include size attributes with your image tags to enable the browser\
    \ to properly size and position the image before it has been fetched and rendered.\
    \ Failure to do this results in web pages that hop around images finally load.\
    \ For tables, you can specify `tablelayout:fixed` to avoid table columns and rows\
    \ resizing.\n- Use special characters for simple icons and one-color images. Using\
    \ font characters has several benefits:\n  - The one font file will load much\
    \ faster than a number of separate image files.\n  - The font characters can be\
    \ scaled and still look smooth since they are essentially vector images. They\
    \ can be really big or small.\n  - The font characters will normally be anti-aliased\
    \ (edges smoothed using color variations) against whatever color they are displayed\
    \ over. This eliminates the need to have some transparent `gif` or `png` image\
    \ duplicated against different backgrounds so that they are properly anti-aliased.\n\
    \  - Special fonts will display faster in tables once the font has loaded rather\
    \ than waiting for images to load and be rendered.\n- It is easy to change the\
    \ color of a font character to indicate a special state.\n- Checkboxes. You may\
    \ find easier to use a font checkbox if you need a checkbox in a table column.\
    \ You can use a click handler to alternate the character between an empty box\
    \ and a box that contains a check. This may be faster and smaller than putting\
    \ an input control on every line.\n- You can find a number of common symbols on\
    \ websites like `https://icomoon.io/` or use a good font-editor to make almost\
    \ any one-color image you want:\n\n![](img/10c5df588c0c6e2580324246d7b5735f_86_0.png)"
