  md: '# Colors


    There are two main uses of color in your application:


    +   * To reinforce a company or product line color scheme.

    * To convey knowledge to the user to assist in making the correct decisions.


    Your designer should come up with a limited palette of colors that will be used
    throughout your product. This is often based on existing websites or programs,
    and often incorporates the company''s logo and trademark colors. Remember that
    most largest companies have very detailed and exacting specs for their corporate
    look. They will have exact color values for anything associated with their company
    name, and colors must meet their guidelines. Each color should be identified for
    exactly where in the interface they will be used, including:


    +   * general display and highlight colors

    * background color

    * body text and text emphasis

    * url links

    * headings and subheadings


    Some areas to be careful of when considering what colors to use include:


    +   * Be careful with your palette and selection, particularly if you get into
    very bold colors. There are cultural differences in acceptable colors, for both
    text and background so you need to make sure you understand the target audience.
    Asian markets tend to be more receptive to very unique set of colors. If you are
    designing software that will be on TVs, the traditional approach should be to
    avoid saturated colors, even black. Do not use a solid red (#ff0000) and your
    whites should be toned down-use #ffffff instead of #ffffff.

    * I would avoid light text on dark backgrounds for large areas of text. It fine
    another color selection is to use dark gray for your body text. This can create
    a very distinctive look to your application or website. Just be sure your text
    is not too hard to read on the devices you are targeting.

    * You also have to be careful if you have text anywhere that the user can select,
    as selection may result in colors inverted, for both text and background. Make
    sure that if there are any persistent selections that this inversion does not
    confuse the user.

    * Colors can also have meanings in different cultures. Be careful assuming that
    red means danger and green means OK.


    # Typefaces


    Don''t get carried away. This is one of the most obvious beginners mistakes, whether
    it is in fonts for web pages, Word documents, or applications. There are so many
    cool fonts available, and it is easy to switch them, that you can easily produce
    random-looking screens. Stick to a very small set of font families and use bold,
    italicizing, and sizing sparingly and for each. These fonts, sizes, and effects
    should be part of the style sheet that the designer creates for the programmers.'
  merge: -1
