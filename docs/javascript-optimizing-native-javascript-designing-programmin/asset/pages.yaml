  md: '# Find the missing number


    The problem involves an array of random numbers from 1 to 100 but only one number
    is missing. What is the best way to find the missing number? The best solution
    involves considering the Big O notation consequences of your solution. If you
    walk through the array creating a new array of flags, then you will need to walk
    through the new array again to determine which number is missing. This results
    in an O(2n) solution essentially meaning you may have to walk through all 100
    records a second time (or until you find the missing number.) To make it more
    efficient, you could do the following:


    +   1. Calculate what the total would be if all 100 numbers were present. This
    would be represented by n(n+1)/2 or 5050.


    +   2. Walk through the array once (O(n)) and add up all the numbers you find.


    +   3. Subtract that total from 5050 to determine the missing number.'
