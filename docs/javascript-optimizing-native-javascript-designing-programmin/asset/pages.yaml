  md: '# 84 JavaScript: Optimizing Native JavaScript


    properly. Websites or apps that contain more random data may do better to use
    static or relative positioning. One advantage of absolute positioning is that
    the entire document does not have to reflow if you move one element.


    +   - **static (default)**: The element is positioned in the position determined
    by the normal flow of the page.

    - **relative**: You can set left or top values to move the element relative to
    its normal flow position. The original position and size is used for positioning
    the next static or relative element.

    - **absolute**: Specifying a top and left value positions the element at this
    position relative to its container. It does not affect how static or relative
    elements are positioned.

    - **fixed**: Specifying a top and left value fixes the element''s position in
    the window and the parent container. This is useful for menus and lists that you
    don''t want to move when the user scrolls.

    - **inherit**: Inherits the position property of the element''s parent.


    # Display property


    Use the display property to select the type of "box" the element is displayed.
    It also has an important use when set to "none" in removing the element from the
    display layout.


    +   - **inline (default)**: Displays the element inline inside the current block
    using the width of the content, similar to a `<span>` tag.

    - **block**: Displays the element as a block with a specified height and width,
    like a `<p>` tag.

    - **inline-block**: Displays the element inline but treats as as a block.

    - **none**: Removes the element from the DOM display tree. This can be used to
    update the removed element without forcing a reflow, or to temporarily remove
    elements to "light up" the DOM for better performance.

    - **Others**: There are a number of other options which may not work on older
    browsers, such as: table-cell, run-in, list-item, inline-table. See CSS documentation
    for more details. Since the use of `<table>` on anything other than a table of
    data is discouraged, the use of some table display properties (like `table-cell`)
    can solve some of your UI problems like vertical alignment.


    # Setting style properties using JavaScript


    There are several ways to change the style of elements from JavaScript. Each have
    their uses, advantages, and disadvantages. It is important to design your UI pages
    to minimize the amount of style manipulation. The most common reason to set individual
    properties (directly or using `cssText`) when you need to do this dynamically
    from your JavaScript code to set a new position or color property. These methods
    include:


    +   - Assigning a new class or classes using `className`. This is usually the
    fastest method to change styles and update style properties. Any individual property
    that has already been assigned (using `cssText` or `style=`) will not be overridden
    but still have precedence.'
