  md: '# Ways to minimize your impact on the DOM


    As discussed earlier, you want to minimize the elements you have to force the
    browser to re-layout your HTML DOM. Sometimes this is unavoidable, but there are
    a number of methods you should keep this to a minimum.


    +   1. Append an entire section of HTML read in a file. This will cause a reflow
    but not multiple reflows for each element.

    2. Use innerHTML to append a string containing many elements. This may also be
    faster than appending multiple elements.

    3. Add elements to a document fragment and then append that to the DOM.


    | | Safari | Chrome | Firefox |

    |---|---|---|--|

    | 1. mdiv.innerHTML = str; | 41 | 31 | 21 |

    | 2. mdiv.appendChild(newDiv); | 63 | 18 | 21 |

    | 3. frag.appendChild(newDiv); | 24 | | 30 |


    Test 5: http://www.nativejavascript.com/tests/Test-innerHTMLVsAppendApp.html

    The results of using innerHTML vs appendChild showed different winners but they
    were all very close. Since your elements will be more complicated than those used
    in this, you probably need to test your exact requirements on each browser. Plus
    testing measure performance when testing HTML elements in a loop is not very accurate
    to determine overall performance.


    +   4. Don''t access attributes that require the browser to redraw the document.
    This includes items like offsetTop, offsetLeft. Instead, to save these values
    to a variable or when the elements are initially created or loaded, use that value
    instead of querying. These operations can be very slow. The test shows the difference
    between accessing the offsetTop each time calculating it once and accessing this
    saved value.


    | | Safari | Chrome | Firefox |

    |---|---|---|--|

    | 1. var divtop = divElement[i].offsetTop; | 381 | 162 | 406 |

    | 2. var divtop = divTop[i]; | 98,457 | 55,480 | 83,718 |


    Test 6: http://www.nativejavascript.com/tests/Test-offsetTopVsCached.html

    Using offset or style.top to access position attributes is, much slower so avoid
    it as much as possible, particularly in loops.


    +   5. Don''t destroy and recreate. To lay out your elements so you see as many
    elements as possible, or at least elements with only minimal changes. This may
    reduce the reflow of elements, and reduces the amount of DOM manipulation.

    6. Avoid changing attributes that will force reflow. This includes any positioning
    attribute like top, but does not include non-positioning attributes like color.
    Using positioning can prevent reflow as well. A number of properties will also
    repaint'
