    \ went through several iterations as it had memory footprint reduced and its performance\
    \ improved. One advantage I had was that I could change the format of the data\
    \ was requested. This may not always be possible but being able to change the\
    \ data structure is usually critical to your optimization efforts.\n\n# A TV programming\
    \ guide\n\nI wrote a mobile application for a large TV cable company that displayed\
    \ their entire TV schedule for two weeks in a scrolling grid to see what are on\
    \ your television. This project was a case of having to optimize the code in 3\
    \ areas—payload size, memory usage, and performance. It involved requesting their\
    \ schedule update using API calls when the application started. The original design\
    \ calling for requesting the data in 3-hour chunks and stitching the events together\
    \ in the UI. This was done using JSON requests that returned data similar to the\
    \ following. Each 3-hour segment contained what were on during that, even if only\
    \ for a few minutes. Each segment contained for approximately 2000 shows that\
