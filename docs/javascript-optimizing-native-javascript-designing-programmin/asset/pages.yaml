    : \"HD\",\n      \"startTime\": \"2012-04-23T18:00:00.000Z\",\n      \"endTime\"\
    : \"2012-04-23T18:30:00.000Z\",\n      \"duration\": 30,\n      \"channelID\"\
    : \"12\",\n      \"channelName\": \"CSPAN\"\n    },\n    \"show\": ....etc.\n\
    \  ]\n}\n```\n\nThe choices for some of the fields are:\n\n+   * movie: Movie,\
    \ Sports, Kids, News\n* resolution: HD, SD\n* rating: \"NA\", \"TV-V7\", \"TV-Y7\"\
    , \"NR(General)\", \"G/TV-G\", \"PG/TV-PG\", \"PG-13\", \"TV-14\", \"TV-MA\",\
    \ \"R\", \"NC-17\", \"NR(Adult)\"\n\nThe schedule covered hundreds of channels\
    \ for fourteen days, the number of shows requested was very large. The first step\
    \ was to get the requirements for the application:\n\n+   * The grid was to display\
    \ all channels and be able to scroll for two weeks.\n* The primary target platform\
    \ was a mobile device so the data transmitted should be as small as possible.\n\
    \n![](img/10c5df588c0c6e2580324246d7b5735f_113_0.png)"
