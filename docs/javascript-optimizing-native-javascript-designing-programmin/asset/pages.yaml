  md: '# 10 JavaScript: Optimizing Native JavaScript


    always strive to reduce the memory footprint of every function that you code.
    This applies to the objects and arrays that you create, images that you place
    in your UIs, and all data structures that you need to download or create. The
    reasons you need to keep it small include:


    +   - Mobile devices have to download code and data using limited bandwidth that
    often have to pay for. And downloads over the cellular network are going to be
    slower than what you get on your regular Ethernet connection. Your users want
    their mobile applications to load and become functional as quickly as possible.

    - You don''t necessarily know what app or data will be loaded at the same time
    your app is. This is true of frameworks and libraries that may be loaded by your
    app, or by other apps that are running on the device at the same time.

    - Creating and destroying strings, or loading and deleting data, creates memory
    usage. The way JavaScript is designed, you are unable to force a garbage collection
    (GC) from the code but must rely on the browser to decide when to force a GC.
    If this happens at the wrong time, when the user is fast scrolling a table, the
    UI can be adversely affected. So the rule is—just don''t make the garbage begin
    with


    # Speed still matters


    Faster is better. You should try to write all your functions to be as fast as
    possible while keeping the code readable. This does not optimizing your code at
    every step of the project. There is a good argument for waiting until your logic
    is in place before optimizing your code. You often won''t know what optimizing
    strategies are best until you have all pieces of the logic in place. But that
    doesn''t mean you can''t apply the best principles as you are writing your code.
    The methods discussed in later chapters, such as using variables or declaring
    an array length outside of the for loop, should always be used.


    # Flatter is better


    Make your UI designs as flat as possible. This is much more important for single
    screen applications. Design your screens to include common navigation and filtering
    controls on the same screen without creating nested menus that the user must navigate
    to carry out required functions.


    # The server shouldn''t make UI decisions


    Make sure the data delivered by the server doesn''t restrict or change the functionality
    of your UI. If the server gives you dates in the wrong format, or unused data,
    or fields that are unnecessarily long, they are impacting the performance of your
    application. If the server can''t give you enough at one time to fill your screens,
    your user''s experience may suffer. If the server gives excessive data that must
    be garbage collected on your end, your performance will suffer. Make sure the
    server team is involved in your design procedure early so they can deliver optimized
    and appropriate information. I had projects where the server team refused to optimize
    the data format delivered to the client, resulting in 160mb of data having'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Chapter 1: Basic Principles • 11


    to be delivered to a mobile device, greatly affecting the user experience. I was
    able to optimize that to a 3mb payload that the client received almost immediately,
    allowing immediate scrolling of all the data. Think of all the effort you may
    spend minimize your JavaScript content, but then you go and load huge data files
    that are unnecessarily large. Other incorrect server choices involve having data
    formatted on the server instead of letting the user interface format them to the
    user''s preferences, and sub-optimal uses of booleans, strings, and numbers.


    # Share, share, share...


    Share code and screens as much as possible. I am not talking about writing your
    code to be reusable in other projects. That is a separate subject open for debate
    as it tends to make your project longer. What I am talking about is making sure
    that you don''t copy and paste the same routine in multiple places in your code.
    If you have to do the same more than once, spend the time to make one good function
    that can be used from several places. Put more time in designing your application
    front and create single functions that can be used in several places. The same
    also applies to your HTML code which can have impact on your application''s performance.
    Be careful when laying out your HTML screens you reuse them as possible and avoid
    continual altering or destroying the DOM tree.


    # Make the appropriate trade-offs


    There are always trade-offs when you are writing code. Your job as a programmer
    is to optimize for the proper value when you have a choice. The trade-offs are
    usually between:


    +   - memory use

    - execution speed

    - code readability


    Therefully will be many cases in which you can optimize for all three values.
    In other cases, you will have to analyze whether your UI demands fast execution,
    or whether you need to conserve memory. If you select a method that results in
    code that is more difficult to read, make sure that you properly comment the section
    as much needed. Keep in mind a few rules when optimizing your code:


    +   - Do not optimize prematurely. However, that doesn''t mean that you shouldn''t
    try to use best practices all the time.

    - Code readability is always important so be sure to comment any section of code
    that may be difficult to understand. Comments can be easily removed by minifiers
    when your app is released.

    - Focus on ''low hanging fruit'' first. This follows Pareto''s 80-20 principle.
    You can get 80% of the benefit from concentrating on just 20% of the code. Profile
    your code to determine where memory is used and where performance suffers. Then
    focus on those areas. Obvious areas of concern are recursive functions and loops.'
  merge: -1
