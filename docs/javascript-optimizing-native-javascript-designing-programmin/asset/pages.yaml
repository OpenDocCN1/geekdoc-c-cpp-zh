  md: '# Chapter 13: Debugging· 149


    +   * Memory: How much free memory is available for your application?


    +   * Other applications: How many and what other applications are currently loaded
    into memory? If you are designing something that works tightly with another application,
    then you have to test with every possible version of that software as well.


    +   * Previous applications: What applications may have been run before and closed
    but may have corrupted memory?


    +   * Date: I had applications that were fine until a certain date. A calendar
    program tested all summer and worked fine until started problems in mid-October.
    Before we could determine what was causing the errors, the errors stopped started
    up a month later. It turned out that a date field was not specified to be large
    enough and so the date was a two-digit month and a two-digit day, it blew up.
    This happened starting 10/10/96 but stopped on 11/1/96. You just know never.


    +   * Data: If you program the user to add or import your own data, then you have
    a huge possible source of errors. You need to test every data for all possible
    combinations, including:


    +   * Empty fields


    +   * Long fields - as long as you can make


    +   * Unusual ASCII characters (!@#$%^&()())


    +   * Depending on what you allow, Unicode characters and extended ASCII characters
    like centered letters


    +   * Invalid field types, such as strings in number fields, or junk in date fields


    +   * Invalid entries in fields that have operations performed - such as entering
    a number or zero in a field that should have a one or larger., and so on...


    +   * User interaction. It seems that half of the applications have released after
    what I thought was testing hidden with the first user. This obviously meant my
    cases were not complete. The errors usually surfaced because the user had some
    unusual (untested) collection of programs, hardware that had not been tested,
    or simply entered unanticipated keys or run the program in an order that was not
    tested. This drives home the importance of testing with real users as often possible.


    +   * Unusual handling. Another-to-catch error condition sometimes when users
    presses keys (or click with the mouse or touch with their fingers) in ways you
    have not tested. You really don''t want to have a warning on each screen saying
    something like “Please press only one button at a time and do so slowly and not
    press another until you see the results of the first press...and please don''t
    hold down the button. Users will do the unanticipated—click on the right arrow
    very fast, one second and when they see nothing, click the left arrow ten times
    and then click the Cancel button. Can you handle that?


    The point of the above items is that you can''t possibly test your product for
    all possible error situations. So you will have to prioritize your efforts so
    you can get your product out the door sometime this century. You have to use your
    knowledge of the code and business require


    ![](img/10c5df588c0c6e2580324246d7b5735f_155_0.png)'
  merge: -1
