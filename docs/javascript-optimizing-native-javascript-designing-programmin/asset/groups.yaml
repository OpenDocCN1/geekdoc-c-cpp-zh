    \ are for the horizontal location -- situate Y for X to get the vertical location):\n\
    \n- clientX: location relative to window\n- layerX: location relative to current\
    \ element\n- offsetX: location relative to current element\n- pageX: location\
    \ relative to entire screen\n- x: location relative to window\n\nYou may need\
    \ to create one function that will return the position of the mouse on different\
    \ browsers. It may look something like:\n\n```javascript\nfunction getPosition(e)\
    \ {\n  e = e || window.event;\n  var pos = {};\n  if (e.pageX) {\n    pos.x =\
    \ e.pageX;\n    pos.y = e.pageY;\n  } else {\n    pos.x = e.clientX + document.body.scrollLeft\
    \ + document.documentElement.scrollLeft;\n    pos.y = e.clientY + document.body.scrollTop\
    \ + document.documentElement.scrollTop;\n  }\n  return pos;\n}\n```\n\n# Summary\n\
    \nBest usage is probably:\n\n- 1. Add a utility function that handles stopBubble\
    \ or stopPropagation in one call\n- 2. Use addEventListener to add your event\
    \ listeners. It is better to separate assigning handlers for HTML code anyway\
    \ and this method has more flexibility.\n- 3. Decide if capturing events will\
    \ help organize your code. If so, add this option to the addEventListener methods\
    \ you call.\n- 4. If you need to stop propagation or prevent the default action,\
    \ explicitly call these from your methods using stopPropagation and/or preventDefault.\n\
    \n> “The best programmers are not marginally better than merely good ones. They\
    \ are an order-of-magnitude better, measured by whatever standard: conceptual\
    \ creativity, speed, ingenuity of design, or problem-solving ability.”\n- Randall\
    \ E. Stross\n\n# Handling Data Efficiently\n\nYou often have to handle large lists\
    \ of items that need to be sorted, scrolled, and filtered. This includes lists\
    \ of names, lists of tv shows, or any other large collection of data that users\
    \ have to access. There are many ways to handle these operations, the larger the\
    \ list, the more you have to pay attention to optimizing memory and performance.\
    \ The better a job you do, the more data you can handle.\n\nThe main tasks that\
    \ you need to be concerned with include:\n\n- Managing server requests\n- Managing\
    \ memory\n- Managing the DOM\n- Improving performance, including scrolling, sorting,\
    \ and filtering\n\nWe'll look at each of these areas in detail.\n\n# Managing\
    \ server requests\n\nOne of the first design tasks concerns the availability of\
    \ the data from your servers and how quickly it can be fetched. This is usually\
    \ a fairly complicated question as it involves a number of considerations based\
    \ mainly on the size of the dataset, the frequency that it changes, and the end\
    \ of use of the data. Questions you should ask include:\n\n- Does the dataset\
    \ have to be created each time it is requested database queries or is it fairly\
    \ static that changes infrequently? What if changes just once a day?\n- How many\
    \ servers are available and what is their capacity? What kind of caching is available?\n\
    - How many concurrent users will be using your application? How frequently will\
    \ they need to request new data?\n- Can the data be broken down into smaller sets\
    \ so that each user doesn't need to fetch as much each time?\n- Can you break\
    \ the data into lookup tables so that the main dataset can be smaller and simply\
    \ reference in the table?\n- Are requests from multiple users or even from the\
    \ same user cacheable? Do they have the same URL or is each request unique?\n\n\
    # JavaScript • Optimizing Native JavaScript\n\nThere are other considerations\
    \ that may be unique to your application and server installation. I worked on\
    \ software for set-top boxes in Europe that would fetch large amounts of TV data\
    \ every time the boxes started. Unfortunately, at the time, there were frequent\
    \ power outages in the area resulting in all boxes coming online and requesting\
    \ data at exactly the same time. We had to add some randomizing timing to prevent\
    \ all the requests from happening at the same.\n\nAnother TV application was on\
    \ originally set up to request data from the server in very verbose segments that\
    \ required almost 200MB of data fetches to populate a UI guide. By reworking the\
    \ data structure into a compact format with lookup tables, I was able to reduce\
    \ the total payload to 3MB that loaded almost instantly. So be creative and at\
    \ all facets of your project for ways to optimize its performance. It may seem\
    \ that you don't need to worry about bandwidth, transmission speed, and memory\
    \ but you should try to design your application with these factors in.\n\n# Don't\
    \ let the server make UI decisions for you\n\nDon't let the API's, size of the\
    \ data payload, or data format affect how the UI displays data. Make sure the\
    \ data received from the server is in the optimal format for the application so\
    \ it doesn't have to be sorted or merged prior to use. This includes getting a\
    \ date field in a format-free value as milliseconds or a JSON date format that\
    \ can be directly converted by your JavaScript code. That way you can display\
    \ the data in whatever format you need or even the user decide which date format\
    \ to use. It is easier to sort.\n\n# Managing memory and bandwidth\n\nManaging\
    \ memory can be more complicated than managing your server requests. Decreasing\
    \ your bandwidth with smaller data objects the server often reduces your memory\
    \ usage as well but that depends on the exact format of the objects you receive\
    \ from the server. Different browsers handle memory in different ways and it is\
    \ hard to know exactly how users will be using your application. Computers have\
    \ more memory than before but you still have mobile devices that are more limited.\
    \ And you are usually not the only application running on the device. The best\
    \ approach is to design your memory usage carefully upon front, then keep everything\
    \ as small as possible at each step of your development. Some things to keep in\
    \ mind:\n\n- Keep your data as lean as possible with only the fields that you\
    \ need. Arrays save space compared to objects. Keep your property names short.\
    \ Having shorter variable and property names mainly affect the size of the files\
    \ that are downloaded. The effect of shorter names on actual performance is very\
    \ small since names are changed to address offsets. Make sure the name is long\
    \ enough to be descriptive in their context.\n- If you have a large dataset, try\
    \ to make it as relational as possible with lookup tables for common data.\n-\
    \ Only download the data that you need from the server.\n\n# Chapter 8: Handling\
    \ Data Efficiently • 105\n\n- Delete functions, arrays, and objects that you no\
    \ longer need. Remember that you can't control or force garbage collection in\
    \ JavaScript. It may happen at a time when you expect it.\n- Watch your usage\
    \ of graphic images. Try to design your screens so that most of elements are reused\
    \ as much as possible. Use solid colors or font instead of graphic images.\n-\
    \ Use lazy loading of code, data, and graphics as much as possible. This is often\
    \ done to enable you the screen as fast as possible by delaying loading of secondary\
    \ material.\n\n# Managing the DOM\n\nThe de-fact size and makeup of your DOM will\
    \ also impact your memory usage and performance. The mainly comes into play when\
    \ you have a single-page application that has to display a lot of data, such as\
    \ scrolling lists of items. The bigger your DOM, the more memory is used and the\
    \ slower your UI navigation becomes. If you have fairly simple interface, then\
    \ normally don't have to worry about the complexity of the DOM. However, things\
    \ you should be aware when displaying large amounts of data include:\n\n- Reuse\
    \ elements of DOM as much as possible. If you have a number of screens that have\
    \ similar backgrounds, use one background with different elements on top.\n- Avoid\
    \ thrashing the DOM. Don't keep adding and deleting elements in your HTML. Layout\
    \ is expensive and even simple tasks like changing an element's position can be\
    \ costly.\n- Set an element's display property to none if you don't need to show\
    \ it but will need it later. Be aware that may might change a page's appearance\
    \ after some elements change position as a result, so be sure you design your\
    \ pages to solve this problem. A common use would be an application that contains\
    \ a main menu with buttons that display elements, perhaps by sliding them off\
    \ and on the screen. When you slide an element off the screen, you can set its\
    \ display property to none. To redraw this element, set its display to block to\
    \ hide it back on the screen.\n- Avoid extra elements if possible, unless needed\
    \ spans and divs.\n- Minimize the use of special effects like drop shadows, text\
    \ shadows, and gradients.\n- Avoid transparency if possible, particularly if you\
    \ are moving elements across the screen. Text has to be anti-aliased against the\
    \ background as it is moved.\n- Be careful using transitions and transforms as\
    \ they can impact performance. Some animations will be accelerated by the hardware\
    \ you should use these methods as much as possible. In general, performance will\
    \ suffer as you increase the number and/ size of the elements you are moving or\
    \ resizing.\n- Some seemingly simple effects can have negative performance results,\
    \ such as rotating text.\n"
  mdcn: "\n鼠标位置：确定正确的鼠标位置也充满了危险。在鼠标处理程序中，你可以查询许多属性，但你需要理解每种属性的工作原理。你必须考虑到元素内部的位置以及已经发生的滚动。而且并不是所有的浏览器都支持每个属性。通常情况下，这些属性具有以下含义（这些是水平位置——将\
    \ Y 替换为 X 以获取垂直位置）：\n\n- clientX: 相对于窗口的位置\n- layerX: 相对于当前元素的位置\n- offsetX: 相对于当前元素的位置\n\
    - pageX: 相对于整个屏幕的位置\n- x: 相对于窗口的位置\n\n你可能需要创建一个函数来返回鼠标在不同浏览器中的位置。它看起来可能像这样：\n\n\
    ```javascript\nfunction getPosition(e) {\n  e = e || window.event;\n  var pos\
    \ = {};\n  if (e.pageX) {\n    pos.x = e.pageX;\n    pos.y = e.pageY;\n  } else\
    \ {\n    pos.x = e.clientX + document.body.scrollLeft + document.documentElement.scrollLeft;\n\
    \    pos.y = e.clientY + document.body.scrollTop + document.documentElement.scrollTop;\n\
    \  }\n  return pos;\n}\n```\n\n# 总结\n\n最佳用法可能是：\n\n- 1. 添加一个工具函数，在一个调用中处理 `stopBubble`\
    \ 或 `stopPropagation`。\n- 2. 使用 `addEventListener` 添加你的事件监听器。无论如何，将 HTML 代码的处理程序赋值分开更好，而且这种方法更具灵活性。\n\
    - 3. 决定捕获事件是否有助于组织你的代码。如果是，请在你调用的 `addEventListener` 方法中添加此选项。\n- 4. 如果你需要停止传播或阻止默认操作，请在你的方法中使用\
    \ `stopPropagation` 和/或 `preventDefault` 显式调用这些方法。\n\n> “优秀的程序员并不是比普通的程序员好出一点点。根据任何标准衡量（概念创造力、速度、设计的巧妙性或解决问题的能力），他们要好出整一个数量级。”\n\
    - Randall E. Stross\n\n# 高效处理数据\n\n你经常需要处理需要排序、滚动和过滤的大型项目列表。这包括名称列表、电视节目列表或用户必须访问任何其他大型数据集合。处理这些操作有很多方法，列表越大，你就越需要注意优化内存和性能。你做得越好，能够处理的数据就越多。\n\
    \n你需要关注的主要任务包括：\n\n- 管理服务器请求\n- 管理内存\n- 管理 DOM\n- 提高性能，包括滚动、排序和过滤\n\n我们将详细介绍这些每一个领域。\n\
    \n# 管理服务器请求\n\n第一个设计任务之一是关于服务器数据的可用性以及获取数据的快慢。这通常是一个相当复杂的问题，因为涉及到许多主要基于数据集大小、变化频率和数据使用终结的考量。你应该问的问题包括：\n\
    \n- 数据集是否在每次被请求时都必须创建（数据库查询），还是它是相当静态且不经常变化的？如果每天只变化一次呢？\n- 有多少服务器可用？它们的容量是多少？有什么种缓存可供？\n\
    - 将有多少并发用户使用你的应用程序？他们需要多频繁地请求新数据？\n- 数据是否可以拆分成较小的集合，以便每个用户每次都不需要获取大量数据？\n- 你可以将数据拆分为查找表，以便主数据集可以更小并简单地在表中引用吗？\n\
    - 来自多个用户甚至同一个用户的请求是可以被缓存的吗？它们具有相同的 URL 还是每个请求都是唯一的？\n\n# JavaScript • 优化原生 JavaScript\n\
    \n还有其他可能取决于你的应用程序和服务器安装的考量。我曾为欧洲的顶盒软件工作过，它每当顶盒启动时都会获取大量的电视数据。不幸的是，当时该地区经常停电，导致所有顶盒在同一时间上线并请求数据。我们必须添加一些随机计时，以防止所有请求在同时发生。\n\
    \n另一个电视应用程序最初被设计为以非常冗长的分段从服务器请求数据，这几乎需要获取 200MB 的数据来填充 UI 指南。通过将数据结构重构为带有查找表的紧凑格式，我能够将总有效负载减少到\
    \ 3MB，并且几乎瞬时加载。所以，请在项目的各个方面发挥创造力，寻找优化其性能的方法。看起来你可能不需要担心带宽、传输速度和内存，但你应该尝试将这些因素考虑在内设计应用程序。\n\
    \n# 不要让服务器为你做 UI 决策\n\n不要让 API、数据有效负载的大小或数据格式影响 UI 显示数据的方式。确保从服务器接收的数据是应用程序的最优格式，这样它在在使用之前就不需要进行排序或合并。这包括获取无格式值（如毫秒）的日期字段，或可以由你的\
    \ JavaScript 代码直接转换的 JSON 日期格式。这样，你就可以以任何需要的格式显示数据，甚至可以由用户决定使用哪种日期格式。这样更容易排序。\n\
    \n# 管理内存和带宽\n\n管理内存可能比管理服务器请求更复杂。通过更小的数据对象来减少你的带宽通常也会减少你的内存使用量，但这取决于你从服务器接收的对象的精确格式。不同的浏览器以不同的方式处理内存，很难确切知道用户将如何使用你的应用程序。计算机的内存比以前多，但你仍然拥有更受限的移动设备。而且你通常不是运行中的唯一应用程序。你应该尝试将这些因素考虑在内设计你的应用程序。为了让屏幕尽可能快，通过更小的数据对象减少带宽通常也会减少内存使用。你需要注意的属性包括：\n\
    \n- 尽量使用查找表来减少内存使用。\n- 尽可能使用元素元素，以减少内存。\n- 尽可能使用字体颜色而不是图形图像，以节省空间。\n- 尽量让数据保持精小。\n\
    - 属性名称越短对实际性能的影响越小。\n- 如果你有大型数据集，尽量使用查找表来处理它。\n- 只从服务器下载你需要的数据。\n\n# 第 8 章：高效处理数据\
    \ • 105\n\n- 删除不再需要的函数、数组和对象。记住你无法控制或强制垃圾回收。它可能会在你预期时发生。\n- 注意对图形图像的使用。尽量设计屏幕，让大多数元素被重用。\n\
    - 尽可能对代码、数据和图形进行懒加载。这通常是为了通过延迟加载素材来加快屏幕。\n\n# 管理 DOM\n\nDOM 的大小和组成也会影响你的内存使用和性能。当单页应用程序需要显示大量数据（例如滚动列表）时，DOM\
    \ 越大，使用的内存越多，UI 导航就越慢。如果你的界面相当简单，通常不需要担心 DOM 的复杂性。然而，在显示大量数据时你应该注意：\n\n- 尽可能重用元素元素。如果你有多个具有相似背景的屏幕，使用一个背景加上元素。\n\
    - 避免 DOM 抖动。不要在 HTML 中不断添加和删除元素。布局是昂贵的，即使是更改元素位置等简单任务也是代价的。\n- 如果不需要显示某个元素但以后需要，将元素的显示属性设置为\
    \ `none`。注意这可能会改变页面外观，所以请确保你设计页面来解决这个问题。一个常见的用例是包含主菜单的应用程序，通过按钮显示元素（可能是滑入）。当你将元素滑出屏幕外时，可以将其显示属性设置为\
    \ `none`。要重新绘制此元素，将其设为 `block` 以将其隐藏回屏幕上。\n- 尽可能避免额外的元素，除非是需要的 `span` 和 `div`。\n\
    - 尽量减少特殊特效的使用，如投影投影、文本阴影和渐变。\n- 尽可能避免透明度，特别是当你移动元素时。文本在移动时必须针对背景进行抗锯齿。\n- 小心使用过渡和变换，因为它们会影响性能。某些动画将由硬件加速，你应该尽可能使用这些方法。通常情况下，随着你移动或缩放的元素数量和大小的增加，性能将会下降。\n\
    - 某些看似简单的可能会产生负面的性能结果，例如旋转文本。\n"
