    The mainly comes into play when you have a single-page application that has to
    display a lot of data, such as scrolling lists of items. The bigger your DOM,
    the more memory is used and the slower your UI navigation becomes. If you have
    a fairly simple interface, then normally don''t have to worry about the complexity
    of the DOM. However, things you should be aware when displaying large amounts
    of data include:


    +   - Reuse elements of your DOM as much as possible. If you have a number of
    screens that have similar backgrounds, use one background with different elements
    on top.


    +   - Avoid thrashing the DOM. Don''t keep adding and deleting elements in your
    HTML. Layout is expensive and even simple tasks like changing an element''s position
    can be costly.


    +   - Set an element''s display property to none if you don''t need to show it
    but will need it later. Be aware that may change might change a page''s appearance
    after some elements change position as a result, so be sure you design your pages
    to solve this problem. A common use would be an application that contains a main
    menu with buttons that display elements, perhaps by sliding them off and on the
    screen. When you slide an element off the screen, you can set its display property
    to none. To redraw this element, set its display to block to hide it back on the
    screen.


    +   - Avoid extra elements if possible, unless needed spans and divs.


    +   - Minimize the use of special effects like drop shadows, text hadows, and
    gradients.


    +   - Avoid transparency if possible, particularly if you are moving elements
    across the screen. Text has to be anti-aliased against the background as it is
    moved.


    +   - Be careful using transitions and transforms as they can impact performance.
    Some animations will be accelerated by the hardware you should use these methods
    as much as possible. In general, performance will suffer as you increase the number
    and/ size of the elements you are moving or resizing.


    +   - Some seemingly simple effects can have negative performance results, such
    as rotating text.'
- md: "\n# JavaScript: Optimizing Native JavaScript\n\n- Keep your CSS as simple as\
    \ possible. I try to avoid grouping and nesting my CSS selectors as it can be\
    \ slow and confusing. The browser has to resolve the nesting behavior and if you\
    \ are not careful, this can take time. Plus, I found excessive nesting makes it\
    \ harder to maintain the code and make specific changes to an element. Use it\
    \ only when you need it.\n\n- Keep HTML comments to a minimum or ensure they are\
    \ removed before generating the final application.\n\n## Improving performance\n\
    \nIf you have properly handled the previous goals for handling server requests,\
    \ memory usage, and DOM design, then you have already done most of the work for\
    \ improving your application's performance. However, there are still areas where\
    \ you can improve the real or perceived performance of your application when dealing\
    \ with large amounts of data. Pay attention to the perceived performance which\
    \ is essentially how the users think the application is performing. Little things\
    \ like giving immediate feedback and filling in some of the screen right away\
    \ can go long way in making the app look and feel better. Areas to include:\n\n\
    - Sometimes you want to load all your program files and when the program starts\
    \ so that your performance will be faster in the program. You normally want to\
    \ make sure that you display some UI right away with what you are loading. If\
    \ your user will be using your application for some time, a little extra time\
    \ up front will be worth it for better performance elsewhere. You can defer loading\
    \ items, such as help screens, until they are actually requested. Users are accustomed\
    \ to waiting a bit longer to display these types of items. By keeping your code\
    \ as simple as possible and avoiding large libraries or frameworks, you will have\
    \ more memory for your data.\n\n- Show a progress meter or spinner when your application\
    \ is carrying out a task that may take a second or so. If it is a lengthy task,\
    \ you may want to display more information about what you are doing, such as:\
    \ `Calculating totals...`—Ever, you have to be careful about displaying the progress\
    \ of calculations in programming loops which you normally have to interrupt the\
    \ loop using something like a `setTimeout` command to allow the UI to display\
    \ the updated message. This alone will slow down your application. If you display\
    \ a message, try to use the `innerText` property of the element to avoid a DOM\
    \ reflow.\n\n- Give immediate feedback when the user clicks on your UI. This is\
    \ very important and often overlooked. This change from having a button move or\
    \ change color to having a new screen. Show a gray overlay over the entire screen\
    \ if you don't want the user to interact with your interface while you are changing\
    \ the page.\n\n- Don't mess with the DOM. Minimize the number of times you destroy\
    \ or create parts of the DOM. Minimize the number of times you have to reflow\
    \ the DOM by requesting values such as `offsetLeft`, `offsetTop`, and similar\
    \ properties.\n\n# Chapter 8: Handling Data Efficiently\n\n## Real life examples\n\
    \nI have worked on several applications that handled very large datasets that\
    \ had to be loaded from the server and manipulated by the UI. The design and programming\
    \ went through several iterations as it had memory footprint reduced and its performance\
    \ improved. One advantage I had was that I could change the format of the data\
    \ was requested. This may not always be possible but being able to change the\
    \ data structure is usually critical to your optimization efforts.\n\n## A TV\
    \ programming guide\n\nI wrote a mobile application for a large TV cable company\
    \ that displayed their entire TV schedule for two weeks in a scrolling grid to\
    \ see what are on your television. This project was a case of having to optimize\
    \ the code in 3 areas—payload size, memory usage, and performance. It involved\
    \ requesting their schedule update using API calls when the application started.\
    \ The original design calling for requesting the data in 3-hour chunks and stitching\
    \ the events together in the UI. This was done using JSON requests that returned\
    \ data similar to the following. Each 3-hour segment contained what were on during\
    \ that, even if only for a few minutes. Each segment contained for approximately\
    \ 2000 shows that aired at some point during three hours. The structure looked\
    \ like:\n\n```json\n{\n  \"shows\": [\n    \"show\": {\n      \"title\": \"Raiders\
    \ of the Lost Ark\",\n      \"type\": \"Movie\",\n      \"rating\": \"TV-14\"\
    ,\n      \"resolution\": \"HD\",\n      \"startTime\": \"2012-04-23T18:00:00.000Z\"\
    ,\n      \"endTime\": \"2012-04-23T18:30:00.000Z\",\n      \"duration\": 1800,\n\
    \      \"channelID\": \"12\",\n      \"channelName\": \"SPAN\"\n    },\n    \"\
    show\": ....\n  ]\n}\n```\n\n```\nThe choices for some of fields are:\n\n- movie:\
    \ Movie, Sports, Kids\n- resolution: HD, SD\n- rating: \"NA\", \"TV-G\", \"NR(General)\"\
    , \"G/TV\", \"PG/PG\", \"TV-13\", \"TV-MA\", \"R\", \"NC-17\", \"NR(Adult)\"\n\
    \nThe schedule covered hundreds of channels, the number of shows requested was\
    \ very large. The first step was to display all channels and be able to scroll\
    \ for two weeks. The target was a mobile device so the data transmitted should\
    \ be as small as possible. (img/10cdf588c0c2e50324246d7b57f0.png)\n\n- The app\
    \ should start working as soon as possible, at least showing some shows for the\
    \ current period.\n- The data could be pre-processed on the server to whatever\
    \ format needed.\n- The channel lineup (list of channels) would change frequently\
    \ and only at night. There are updates to a specific show during the day which\
    \ would have to be picked up by the application. So I began to analyze and change\
    \ the data one at a time. Some of this required looking for areas that could be\
    \ optimized.\n\nStep 1 - Dates: The data format seemed very lengthy so it could\
    \ be converted directly with JavaScript's `Date()` function. Now the dates looked\
    \ like:\n\n```json\n\"startTime\": 1335204000000,\n\"endTime\": 1335205800000\n\
    ```\n\nStep 2 - Duration: Since I had a start and end date, I could delete the\
    \ `duration` field.\n\nStep 3 - Title: This took a little bit of analysis on the\
    \ data on the server. There were over 150,000 airings but many of the titles were\
    \ duplicates due to reruns and multiple airings. I sorted all titles and removed\
    \ the duplicates, ended up with a list of unique names. I created an array of\
    \ these titles and added an index to the show instead of the full title. This\
    \ saved a huge amount of data.\n\n- Order the list alphabetically. This had the\
    \ added advantage of being able to use this list in the user interface to display\
    \ all shows without resorting to the list. This is the option.\n\n- Since the\
    \ channel lineup changed very frequently, this was also made into a lookup table\
    \ with each show containing an index into the table. Now a show record looks like\
    \ the following (along with the lookup tables for titles and channels):\n\n```json\n\
    \"show\": {\n  \"title\": 12,\n  \"type\": \"Movie\",\n  \"rating\": \"TV-14\"\
    ,\n  \"resolution\": \"HD\",\n  \"startTime\": 1335204000000,\n  \"endTime\":\
    \ 1335205800000,\n  \"chanIdx\": 8\n}\n```\n\nStep 5 - Show properties: This was\
    \ one little harder. There were three properties that each had a small number\
    \ of possibilities—type, rating, and resolution. This made them prime candidates\
    \ for using a bitwise operator to represent the values. A bitwise operator essentially\
    \ uses every bit of a number (up to 31) as a true/false flag for the value at\
    \ that position. Thus, the first bit may represent type=Movie, the second bit\
    \ type=Sports, and so on. There were several ways to combine all and read these\
    \ values, but the simplest is to use the `&` and `|` operators. You can create\
    \ a variable to zero and then use the OR operator to shift the bits you want.\n\
    \n```javascript\nvar flag = 0;\nflag |= Math.pow(2,5); // turns on (sets 1) to\
    \ the 6th bit\nflag |= Math.pow(2,8); // turns on 9th bit, leaving the other bits\
    \ alone\n```\n\nTo test the values of your flag, you can use code similar to:\n\
    \n```javascript\nif (flag & Math.pow(2,5)) // do true function for 6th bit\n```\n\
    \nI used this method to combine all three fields (type, rating, and resolution)\
    \ into one field. Now the data is like:\n\n```json\n\"show\": {\n  \"title\":\
    \ 12,\n  \"flag\": 16823,\n  \"startTime\": 1335204000000,\n  \"endTime\": 1335205800000,\n\
    \  \"chanIdx\": 8\n} // bitwise number\n```\n\nStep 6 - Combining all shows by\
    \ channel: This also took some analysis of the data on the server and how the\
    \ data was assembled before being transmitted to the application. This included:\n\
    \n- I discovered that shows for each channel were always continuous meaning there\
    \ were no gaps in the schedule—when one ended, the next show in the list started.\
    \ This allowed me to further compress the data since I no longer needed start\
    \ and end time for each show.\n"
  mdcn: "\n\n# JavaScript: 优化原生 JavaScript\n\n- 保持你的 CSS 尽可能简单。我尽量避免对 CSS 选择器进行分组和嵌套，因为这可能会导致运行变慢且令人困惑。浏览器必须解析嵌套行为，如果你不小心，这会消耗时间。此外，我发现过度嵌套会使代码更难以维护，难以对特定元素进行特定的更改。仅在需要时使用它。\n\
    \n- 尽可能减少 HTML 注释，或确保在生成最终应用程序之前删除它们。\n\n## 提高性能\n\n如果你已经妥善处理了之前关于处理服务器请求、内存占用和\
    \ DOM 设计的目标，那么你已经完成了优化应用程序性能的大部分工作。然而，在处理海量数据时，仍然有些领域可以改进应用程序的实际性能或感知性能。注意“感知性能”，它本质上是用户认为应用程序运行得如何。一些微小的操作如提供即时反馈和立即填充部分屏幕，对于让应用看起来和用起来更好非常有帮助。包括的领域有：\n\
    \n- 有时，你希望在程序启动时加载所有的程序文件，这样程序运行时的速度会更快。你通常希望确保在加载内容的同时立即显示某些 UI。如果用户将长时间使用你的应用程序，那么在开头花费一点额外时间换取其他更好的性能是值得的。你可以延迟加载某些项（例如帮助屏幕），直到它们被实际请求。用户已经习惯于多等一会儿来显示此类条目。通过保持代码尽可能简单并避免大型库或框架，你将为数据留出更多内存。\n\
    \n- 当你的应用程序执行可能需要一秒左右的任务时，显示进度条或加载旋转。如果是一项长期任务，你可能想要显示更多关于你正在操作的信息，例如：`Calculating\
    \ totals...`——此外，你必须小心在编程循环中显示计算进度，你通常需要使用类似 `setTimeout` 的命令来中断循环，以便 UI 显示更新后的消息。单单这一项就会减慢你的应用程序。如果你显示消息，请尝试使用元素的\
    \ `innerText` 属性以避免 DOM 重流（reflow）。\n\n- 当用户点击你的 UI 时，提供即时反馈。这非常重要且经常被忽视。这种从按钮移动或改变颜色到切换新屏幕的变化是非常重要的。如果你在切换页面时不想让用户与界面交互，可以在整个屏幕上显示一个灰色遮层。\n\
    \n- 不要乱动 DOM。尽量减少销或创建 DOM 部分的次数。通过请求 `offsetLeft`、`offsetTop` 和类似属性的值，尽量减少必须触发\
    \ DOM 重流的次数。\n\n# 第 8 章：高效处理数据\n\n## 现实案例\n\n我开发过几个处理大型数据集的应用程序，这些数据必须从服务器加载并由\
    \ UI 进行处理。设计和编程经过了多次迭代，以减少内存占用并提高性能。我拥有的一个优势是，我可以更改请求数据的格式。这并不总是可能的，但能够更改数据结构通常对你的优化工作至关重要。\n\
    \n## 电视节目指南\n\n我为一家大型电视电缆公司编写了一个移动应用程序，该程序在一个滚动网格中显示他们两周的完整电视节目表，以便查看电视上正在播放的内容。这个项目是一个在三个方面必须优化代码的案例——负载大小、内存占用和性能。它涉及到在启动时使用\
    \ API 调用请求他们的日程更新。原始设计要求每 3 小时分块请求数据并在 UI 中缝合这些事件。这是使用 JSON 请求完成的，返回的数据如下所示。每个\
    \ 3 小时的分段都包含该时间段播放的内容，即使只播放了几分钟。每个分段包含了在三小时内某个时间点播出的约 2000 个节目。结构看起来如下：\n\n```json\n\
    {\n  \"shows\": [\n    \"show\": {\n      \"title\": \"Raiders of the Lost Ark\"\
    ,\n      \"type\": \"Movie\",\n      \"rating\": \"TV-14\",\n      \"resolution\"\
    : \"HD\",\n      \"startTime\": \"2012-04-23T18:00:00.000Z\",\n      \"endTime\"\
    : \"2012-04-23T18:30:00.000Z\",\n      \"duration\": 1800,\n      \"channelID\"\
    : \"12\",\n      \"channelName\": \"SPAN\"\n    },\n    \"show\": ....\n  ]\n\
    }\n```\n\n```\n某些字段的选择如下：\n\n- 电影: Movie（电影）, Sports（体育）, Kids（儿童）\n- 解析: HD,\
    \ SD\n- 分级: \"NA\", \"TV-G\", \"NR(General)\", \"G/TV\", \"PG/PG\", \"TV-13\"\
    , \"TV-MA\", \"R\", \"NC-17\", \"NR(Adult)\"\n\n```\n\n节目表涵盖了数百个频道，请求的节目数量非常大。第一步是显示所有频道并能够滚动查看两周。目标是移动设备，因此传输的数据应该尽可能小。（img/10cdf588c0c2e50324246d7b57f0.png）\n\
    \n- 应用程序应该尽早开始工作，至少显示当前时段的某些节目。\n- 数据可以在服务器上预处理为任何所需的格式。\n- 频道列表（频道列表）会频繁变化，且仅在晚上更改。白天会有特定节目的更新，应用程序必须捕获这些更新。因此，我开始分析。通过保持代码尽可能简单并避免大型库或框架，你将为数据留出更多内存。-\
