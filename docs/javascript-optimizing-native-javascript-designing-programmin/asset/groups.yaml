    \ To produce the hexadecimal representation of a number, you can use the toString\
    \ method with the number in parenthesis, similar to:\n  var str = x.toString(16);\
    \ // str = \"12\" (hex key of decimal 18)\n- **Infinity.** You can set a variable\
    \ to a value of Infinity using the keyword Infinity, or by dividing zero. Thus,\n\
    \  var x = Infinity; // x is now larger than all numbers\n- **NaN.** NaN represents\
    \ \"Not Number\". Variables can be set due to a bad math operation using dividing\
    \ a string, or parseInt operation on a string that can't be coerced to a number.\
    \ You can use the built-in isNaN() function to determine if a variable is a number\
    \ before using it, similar to:\n  if (!isNaN(x)) y = x / 10;\n\n# Loops\n\nThere\
    \ are a number of ways to handle loops in JavaScript. You should understand the\
    \ relative performance of each and ways to optimize performance when you use them.\
    \ Obviously, if you are looping through a few items, you don't have to worry about\
    \ performance. A lot of the code I have written dealt with thousands or tens of\
    \ items, and performance is concern. I think it is always a good idea to learn\
    \ the best way to write loops and use that time. I don't think any of these suggestions\
    \ detract from the readability, with the possible exception of having the loop\
    \ count backwards. Using local variables is often the best way to improve your\
    \ loop's performance whether you are looping through arrays or objects, that may\
    \ influence your decision. The main methods to use are:\n\n- for loop: This is\
    \ the most common method and likes:\n  for (var i=0; i < newlen; i++) {\n- while\
    \ loop: Similar to the for loop:\n  while (i < newlen) { i++; }\n- do loop: Similar\
    \ to while it will execute at least once.\n  do { i++; } while (i < newlen);\n\
    - forEach: A special operation that runs your function on each element in the\
    \ array:\n  arr.forEach(function(val) {\n    var y = val;\n  })\n- for...in loop:\
    \ This is mainly used to iterate over properties of objects is very slow however\
    \ use it. This is mainly due to the fact this operation is not optimized by browsers.\n\
    \  for (var name in obj) {\n    var val = obj[name];\n  }\n- for...in loop checking\
    \ hasOwnProperty: If you are unsure if other properties have been added to the\
    \ object prototype for you are checking, you should also add a check for the hasOwnProperty\
    \ method.\n  for (var name in obj) {\n    if (obj.hasOwnProperty(name)) {\n  \
    \    var val = obj[name];\n    }\n  }\n\n# Chapter 3: JavaScript • 43\n\n# PERFORMANCE\
    \ TESTING\n\n| | Safari | Chrome | Firefox |\n|---|---|---|---|\n| 1. for (i=0;\
    \ i < newArr.length; i++) | 68 | 39 | 4 |\n| 2. for (var i=0; i < newArr.length;\
    \ i++) | 96 | 50 | 105 |\n| 3. same as 2 but cache newArr.length | | 50 | 102\
    \ |\n| 4. same as 3 but cache newArr to local array | 290 | 75 | 157 |\n| 5. same\
    \ as 4 count backwards | 282 | 61 | 78 |\n| 6. while (i--) | 280 | 60 | 77 |\n\
    | 7. Duff's device - for loop with 8 statements | 138 | 122 | 191 |\n| 8. forEach\
    \ with local copy of array | | 6 | 104 |\n| 9. for (var name in object) | 12 |\
    \ | 3 |\n| 10. for (var name in object) w/hasOwnProperty | 4 | 5 | 2 |\n\nTest\
    \ 3-7: http://www.javascript.com/tests/Test-Loops.Html\n\nThe relative results\
    \ fairly consistent across the browsers. The results points out important points\
    \ to consider in coding loops, particularly for large ones. The main areas of\
    \ optimization for your application will be loops that iterate over a large number\
    \ of items. You should be able to use the optimizations pointed out every time\
    \ you write a loop that start with optimal code. Only later when you identify\
    \ a particular loop as a continuing bottleneck you should considering the Duff's\
    \ device solution.\n\n- The performance increased from test 1 to 4. This was due\
    \ to using local variables declared with a var in the function instead of global\
    \ variables. Besides making the variable i, another gain was made by setting a\
    \ local variable equal to the global array, and then using that value. This obviously\
    \ not apply to your code keep in mind.\n- The JavaScript foreach allows you to\
    \ specify a function to perform on each array member it is very slow. This test\
    \ using it only for a simple operation or your code may have uses that would benefit\
    \ from using it.\n- Using the for (var name in object) method was really slow.\
    \ This shouldn't be used unless you have no other way to access the values. This\
    \ usually used for objects but is still slow. You could considering the property\
    \ names in an array and using that. This method causes the browser to skip optimization.\n\
    - The fastest way, except on Safari, was the \"Duff's device\". This method relies\
    \ on reducing the overhead of all the loop iterations by placing more statements\
    \ inside each iteration. The upside is a great increase in speed. The downside\
    \ is it is slightly harder to read the code and it increases the code size. The\
    \ method tested above is shown below. The accepted method is to carry out (8)\
    \ iterations inside each loop, after first reducing the number to an even number\
    \ of eight.\n"
