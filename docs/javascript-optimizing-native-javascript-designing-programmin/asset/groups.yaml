    # 140 · JavaScript: 优化原生 JavaScript


    ## Elements (元素)


    ![](img/10c5df588c0c6e2580324246d7b5735f_146_0.png)


    这可能是工具栏上最有用的工具。Elements 标签显示了 DOM 树，以及由于级联样式表和直接分配给元素的样式包含的所有属性。你也可以在浏览器窗口中右键点击元素并选择“检查
    (Inspect)”来显示此视图。此视图与“查看源代码”不同，后者显示的是原始 HTML，不包含任何动态添加或更改的 HTML。你可以使用 Elements
    标签覆盖任何类或属性并立即查看。只需在左侧面板中选择元素，然后在右侧面板中输入或更改属性即可。右侧底部的图显示了所选元素的所有“盒模型”值：位置、大小、内边距、边框和外边距。右上面板细分为更多标签，最常用的包括：


    - *Styles (样式)*：列出继承树中所有来自 CSS 类和文件的属性。被其他类或样式覆盖的属性将显示为删除线。


    - *Event Listeners (事件监听器)*：显示元素中用于点击、滚动和卸载处理器的所有监听器。


    ```javascript

    copy (xx)

    ```


    # 142 JavaScript: 优化原生 JavaScript


    ## Sources (源代码)


    ![](img/10c5df588c0c6e2580324246d7b5735f_148_0.png)


    Sources 标签是你对代码进行逐行调试的工具。代码加载后，你可以打开此标签并在代码的任何位置设置断点。你可以在左上面板中找到你的 JavaScript
    文件，向下滚动到感兴趣的行，并点击行号设置断点。然后你可以运行代码，程序会在遇到断点时暂停。在使用控制按钮单步执行代码时，可以在右侧面板查看所有变量的值。你还可以运行格式化工具（Pretty-Print，上方
    #5）来让压缩后的脚本具有可读性。可用项目包括：


    - 选择要检查的文件。

    - 点击行号设置由蓝色箭头指示的断点。

    - 触达断点后，使用这些工具遍历代码，包括：运行/暂停、单步跳过、进入、单步跳出、激活/禁用断点。

    - 在此处访问所有本地和全局变量的值。

    - 格式化压缩后的代码。


    # 第 13 章：调试 · 143


    ## Network (网络)


    ![](img/10c5df588c0c6e2580324246d7b5735f_149_0.png)


    Network 标签在左侧列出了所有请求的文件。你可以看到每个响应返回的 URL，检查每个请求的所有细节，并查看响应返回的负载（payload）。这允许你发现请求或响应中的错误。列表还显示了每个请求完成所需的时间。我最常用的该标签用法是右键点击左侧列表中的文件并选择“在新标签页中打开”。这将重新获取并在新的浏览器窗口中显示结果。你只能将其用于
    GET 请求而不能用于 POST 请求。如果你正在使用 JSON 数据，请确保在响应中添加 JSON 格式化器，使其格式整齐。点击响应菜单将显示所有标头：


    # 144 JavaScript • 优化原生 JavaScript


    ## Timeline (时间线)


    ![](img/10c5df588c0c6e2580324246d7b5735f_150_0.png)


    Timeline 标签为你提供了一种简单的分析应用程序的方法，用于寻找性能问题甚至是错误执行的代码。只需点击左上角的小圈图标即可开始录制。你会看到一个带有停止（Stop）按钮的小进度弹出窗口，录制完成后点击它。然后你可以根据此标签上的信息确定处理时间耗在何。


    # 第 13 章：调试 · 145


    ## Profiles (性能分析)


    ![](img/10c5df588c0c6e2580324246d7b5735f_151_0.png)


    你可以使用此标签上的信息确定处理时间耗在何。只需点击左上角的小圈图标即可开始录制。你会看到一个带有停止（Stop）按钮的小进度弹出窗口，录制完成后点击它。


