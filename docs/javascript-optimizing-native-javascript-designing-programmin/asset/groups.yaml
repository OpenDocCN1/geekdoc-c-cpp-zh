    \ need to set HTML properties, you must use innerHTML. Likewise, reading elements\
    \ were faster using nodeValue if you can use it with your elements. Firefox has\
    \ greatly optimized reading text with innerHTML so that is an option. Some of\
    \ the other methods act slightly differently with browsers when returning some\
    \ text like breaks so you need to test your application. The following simple\
    \ code has different results when you examine it with the different measures.\
    \ You may use the CR/LF changes in your response when you were not expecting it.\n\
    \n# HTML CODE\n\n```html\n<div id=\"div\">\n<span id=\"span\" style=\"left: 10px;\"\
    >>Inside Span</span>\n<span style=\"display:none;\">>Inside display none span</span>\n\
    </div>\n```\n\n- * Output using innerHTML of div1*\n  <blank line here>\n  <span\
    \ id=\"span\" style=\"left: 10px;\">>Inside Span</span>\n  <span style=\"display:none;\"\
    >>Inside display none span</span>\n  <blank line here>\n\n- * Output using innerText\
    \ of div1*\n  Inside Span\n\n- * Output using textContent of div1*\n  <blank line\
    \ here>\n  Inside Span\n  Inside display none span\n  <blank line here>\n\n# Appending\
    \ text to the DOM\n\nWe have discussed using innerHTML, innerText, and textContent\
    \ to add new content to your DOM. There is another method, insertAdjacentHTML,\
    \ that can also insert content into existing elements. There are four positions\
    \ that can be specified --before, afterbegin, beforeend, and append. If you specify\
    \ the new as a text string, it can be helpful in appending new information to\
    \ an existing display, such as a news feed or list of blog comments. However,\
    \ it is not as fast as other methods in most cases but you need to test your specific\
    \ use. The code snippet used in the following test looked like:\n\n```javascript\n\
    var elem = document.getElementById(\"test3\");\nelem.insertAdjacentHTML('beforeend',\
    \ '<span>abc' + '</span>');\n```\n\n| PERFORMANCE TESTING | Safari | Chrome |\
    \ Firefox |\n|---|---|---|---|\n| 1. Build string then innerHTML = str | 31 |\
    \ 4 | 30 |\n| 2. Use innerHTML += str | 4 | 3 | 4 |\n| 3. Use insertAdjacentHTML\
    \ | 15 | 5 | 13 |\n| 4. Use appendChild | 82 | 17 | 25 |\n\n# Getting images to\
    \ display faster\n\nImproper use of images can make your app slower to load and\
    \ display, and can affect the speed of UI navigation. There are a number of things\
    \ you can do when designing your application, including:\n\n- Minimize the number\
    \ of images you use in your application.\n- Use solid background colors instead\
    \ of images.\n- Design your screens so that you share as many UI elements as possible.\
    \ Besides minimizing the number of elements that have been loaded, your screen\
    \ transitions should be smoother without any flashes.\n- Combine smaller images\
    \ into bigger images so that you load them as sprites, discussed below.\n- If\
    \ you have to use image, make sure it is created at the exact size that the UI\
    \ uses to display. Don't request a large image that takes up bandwidth only to\
    \ have the browser scale the image to a smaller size. Plus, you can usually use\
    \ your graphics editing tool to create a better looking smaller image.\n- Include\
    \ size attributes with your image tags to enable the browser to properly size\
    \ and position the image before it has been fetched and rendered. Failure to do\
    \ this results in web pages that hop around images finally load. For tables, you\
    \ can specify `table-layout:fixed` to avoid table columns and rows resizing.\n\
    - Use special characters for simple icons and one-color images. Using font characters\
    \ has several benefits:\n  - The one font file will load much faster than a number\
    \ of separate image files.\n  - The font characters can be scaled and still look\
    \ smooth since they are essentially vector images. They can be really big or small.\n\
    \  - The font characters will normally be anti-aliased (edges smoothed using color\
    \ variations) against whatever color they are displayed over. This eliminates\
    \ the need to have some transparent `gif` or `png` image duplicated against different\
    \ backgrounds so that they are properly anti-aliased.\n  - Special fonts will\
    \ display faster in tables once the font has loaded rather than waiting for images\
    \ to load and be rendered.\n- It is easy to change the color of a font character\
    \ to indicate a special state.\n- Checkboxes. You may find it easier to use a\
    \ font checkbox if you need a checkbox in a table column. You can use a click\
    \ handler to alternate the character between an empty box and a box that contains\
    \ a check. This may be faster and smaller than putting an input control on every\
    \ line.\n- You can find a number of common symbols on websites like `https://icomoon.io/`\
    \ or use a good font-editor to make almost any one-color image you want:\n\n![](img/10c5df588c0c6e2580324246d7b5735f_86_0.png)\n\
    \nThere are several methods to use to display your special font characters.\n\n\
    1. Set up a class that is used every time you want to display a special character,\
    \ to include that character inside a `<span>` or a `<div>` element.\n\n```css\n\
    .specialFont {\n  font-family: iconfont;\n  font-size: 15px;\n  color: #ee3333;\n\
    }\n```\n<div class=\"specialFont\">C</div>\n\n2. Set up a class that uses the\
    \ before selector:\n\n```css\n.specialChar {\n  font-family: iconfont;\n  content:\
    \ \"\\6653\";\n  color: #993333;\n}\n```\n<span class=\"specialChar\"></span>\n\
    \nThere are few methods you can use in code to improve the performance of your\
    \ images.\n\n1. Preload your images. Preloading references allows the browser\
    \ to fetch them into local cache before you show them. This increases the speed\
    \ at display. The easiest way is to build an image array in your JavaScript and\
    \ load images into that array. Future requests for those images will be faster\
    \ because the image will be cached. Normally, you will also want to put this code\
    \ in a function that is not called until the first page is loaded so that you\
    \ can display that page faster.\n\n```javascript\nvar imageNames = ['pic1.png',\
    \ 'pic2.png', 'pic3.png'];\nvar imgNum = imageNames.length;\nvar imageList = [];\n\
    for (var i=0; i < imgNum; i++) {\n  imageList[i] = new Image();\n  imageList[i].src\
    \ = imageNames[i];\n}\n```\n\n2. Sprites. These are smaller images combined into\
    \ one. The single image loads faster than multiple images due to the overhead\
    \ of fetching. Your CSS defines the sections of the image to display in different\
    \ places. This method is often used to combine the normal/hover/disabled versions\
    \ of icons. The following example assumes you have combined several images, each\
    \ 60px by 60px, into one picbig.png. The numbers in the background represent the\
    \ position of the image horizontal first and then vertical. They are negative\
    \ numbers as they represent the top left of the image will be positioned in the\
    \ 'window' created by height and width values.\n\n```css\n.imageOne {\n  height:\
    \ 60px;\n  width: 60px;\n  background: url('picbig.png') 0 0;\n}\n.imageTwo {\n\
    \  height: 60px;\n  width: 60px;\n  background: url('picbig.png') -60px 0;\n}\n\
    ```\n\n- On/off images on top of each other. You often have images that change\
    \ appearance when touched or clicked on, such as an icon that shows state, or\
    \ even a manually created radio button. One method of changing state is to just\
    \ replace the first image with the second image. You may get better performance\
    \ by putting both versions of the image on top of each other and then just hiding\
    \ or showing the topmost image to show the change in state.\n\n- Forcing image\
    \ decompression. The first part of getting faster image performance was getting\
    \ the original image cached locally. The second part is to speed up the decompression\
    \ and actual display of the image. If you have a display that handles a lot of\
    \ images that the user can scroll through, you may want to speed up the image\
    \ display as much as possible. Images that are off-screen or hidden may take longer\
    \ to display when you want them on screen. One option is to add to each image\
    \ border of a few pixels that is transparent (if the image is a png or gif), or\
    \ colored to match the background. Then, display the images that will be displayed\
    \ next positioned to be actually 1 or 2 pixels on the screen. This will force\
    \ the browser to decompress and actually display the image before the user swipes\
    \ it onto the screen.\n"
  mdcn: "\n如果你是在设置文本，`nodeValue` 的性能相当不错，但如果你需要设置 HTML 属性，则必须使用 `innerHTML`。同样，如果你的元素上可以使用\
    \ `nodeValue`，那么读取元素的速度会更快。Firefox 已经极大地优化了使用 `innerHTML` 读取文本的速度，因此这也是一个可选方案。其他某些方法在返回换行符等文本时，在不同浏览器中的表现略有不同，因此你需要测试你的应用程序。下面的简单代码在用不同的度进行检查时会有不同的结果。在你没有预料的情况下，可能会在响应中使用\
    \ CR/LF 变化。\n\n# HTML 代码\n\n```html\n<div id=\"div\">\n<span id=\"span\" style=\"\
    left: 10px;\">>Inside Span</span>\n<span style=\"display:none;\">>Inside display\
    \ none span</span>\n</div>\n```\n\n- * 使用 div1 的 innerHTML 输出*\n  <此处空行>\n  <span\
    \ id=\"span\" style=\"left: 10px;\">>Inside Span</span>\n  <span style=\"display:none;\"\
    >>Inside display none span</span>\n  <此处空行>\n\n- * 使用 div1 的 innerText 输出*\n \
    \ Inside Span\n\n- * 使用 div1 的 textContent 输出*\n  <此处空行>\n  Inside Span\n  Inside\
    \ display none span\n  <此处空行>\n\n# 向 DOM 附加文本\n\n我们已经讨论过使用 `innerHTML`、`innerText`\
    \ 和 `textContent` 向你的 DOM 中添加新内容。还有另一种方法 `insertAdjacentHTML`，也可以将内容插入到现有元素中。可以指定四个位置——`before`、`afterbegin`、`beforeend`\
    \ 和 `append`。如果你将新内容指定为文本字符串，对于向现有显示内容附加新信息（例如新闻馈或博客评论列表）很有帮助。然而，在大多数情况下，它没有其他方法快，但你需要测试你的特定用例。在测试中使用的代码段如下：\n\
    \n```javascript\nvar elem = document.getElementById(\"test3\");\nelem.insertAdjacentHTML('beforeend',\
    \ '<span>abc' + '</span>');\n```\n\n| 性能测试 | Safari | Chrome | Firefox |\n|---|---|---|---|\n\
    | 1. 构建字符串后使用 innerHTML = str | 31 | 4 | 30 |\n| 2. 使用 innerHTML += str | 4 |\
    \ 3 | 4 |\n| 3. 使用 insertAdjacentHTML | 15 | 5 | 13 |\n| 4. 使用 appendChild | 82\
    \ | 17 | 25 |\n\n# 让图片显示更快\n\n不恰当使用图片会导致你的应用程序加载和显示速度变慢，并影响 UI 导航的速度。在设计应用程序时，你可以做许多事情，包括：\n\
    \n- 尽量减少应用程序中使用图片数量。\n- 使用纯色背景色代替图片。\n- 设计屏幕以尽可能共享更多的 UI 元素。除了减少加载的元素数量外，你的屏幕切换应该更加流畅，没有任何闪烁。\n\
    - 将较小的图片合并成较大的图片，以便以精灵（sprites）的形式加载它们，下文将讨论。\n- 如果必须使用图片，确保其创建的大小与 UI 显示所需的尺寸完全一致。不要请求占用带宽的大图，却让浏览器将其缩放到较小尺寸。此外，你通常可以使用图形编辑工具创建一个更好看的较小图片。\n\
    - 在图片标签中包含尺寸属性（size attributes），以便浏览器在获取和渲染图片之前正确设置图片的大小和位置。这样做会导致网页页面在图片最终加载时发生跳动。对于表格，你可以指定\
    \ `table-layout:fixed` 以避免表格列和行调整大小。\n- 使用特殊字符表示简单图标和单色图片。使用字体字符有几个优点：\n  - 一个字体文件的加载速度会比多个独立的图片文件快得多。\n\
    \  - 字体字符可以缩放且保持平滑，因为它们本质上是矢量图像。它们可以非常大或非常小。\n  - 字体字符在显示的任何背景色上都会进行抗锯齿（使用颜色变化平滑边缘）。这消除了为了在不同背景上正确抗锯齿而复制某些透明\
    \ `gif` 或 `png` 图片的需求。\n  - 一旦字体加载，特殊字体在表格中的显示速度更快，而无需等待图片加载和渲染。\n- 改变字体字符的颜色以指示特殊状态。\n\
    - 复选框。如果你在表格列中需要复选框，可能会发现使用字体复选框更容易。你可以使用点击处理器在空框和包含勾选标记的框之间切换字符。这可能比在每行都放置一个输入控件更快且体积更小。\n\
    - 你可以在 `https://icomoon.io/` 等网站上找到许多常用符号，或使用良好的字体编辑器制作你几乎任何想要的单色图片：\n\n![](img/10c5df588c0c6e2580324246d7b5735f_86_0.png)\n\
    \n有几种方法可以显示你的特殊字体字符。\n\n1. 设置一个类，每当你想显示特殊字符时使用该类，将该字符包含 `<span>` 或 `<div>` 元素内部。\n\
    \n```css\n.specialFont {\n  font-family: iconfont;\n  font-size: 15px;\n  color:\
    \ #ee3333;\n}\n```\n<div class=\"specialFont\">C</div>\n\n2. 设置一个使用 `before` 选择器的类：\n\
    \n```css\n.specialChar {\n  font-family: iconfont;\n  content: \"\\6653\";\n \
    \ color: #993333;\n}\n```\n<span class=\"specialChar\"></span>\n\n你可以在代码中使用几种方法来提高图片的性能。\n\
    \n1. 预加载你的图片。预加载引用允许浏览器在显示它们之前将它们获取到本地缓存中。这提高了显示速度。最简单的方法是在 JavaScript 中构建一个图片数组并将图片加载到数组中。未来对这些图片的请求将更快，因为图片会被缓存。通常，你还希望将此代码放在一个函数中，该函数在第一个页面加载之前不调用，以便你可以更快地显示该页面。\n\
    \n```javascript\nvar imageNames = ['pic1.png', 'pic2.png', 'pic3.png'];\nvar imgNum\
    \ = imageNames.length;\nvar imageList = [];\nfor (var i=0; i < imgNum; i++) {\n\
    \  imageList[i] = new Image();\n  imageList[i].src = imageNames[i];\n}\n```\n\n\
    2. 精灵（Sprites）。这些是合并后的较小图片。由于获取的开销，单个图片比多个图片加载更快。你的 CSS 定义图片的区域显示在不同位置。这种方法通常用于合并图标的正常/悬停/禁用版本。下面的示例假设你将几张\
    \ 60px x 60px 的图片合并成一张 picbig.png。背景数字代表图片的位置，先水平后垂直。它们是负数，因为它们代表在高度和宽度创建的“窗口”中的左上角。\n\
    \n```css\n.imageOne {\n  height: 60px;\n  width: 60px;\n  background: url('picbig.png')\
    \ 0 0;\n}\n.imageTwo {\n  height: 60px;\n  width: 60px;\n  background: url('picbig.png')\
    \ -60px 0;\n}\n```\n\n- 叠层图片。你经常图片在触摸或点击时改变外观，例如显示状态的图标，甚至是手动创建的单选按钮。改变状态的一种方法是将第一张图片替换为第二张。通过将两个版本的图片叠在一起，然后只需隐藏或显示最顶部的图片来显示状态变化，可能会获得更好的性能。\n\
    \n"
