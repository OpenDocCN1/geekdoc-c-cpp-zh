    \n\n- Use the toFixed() method if you want to control the number of decimal places,\
    \ or add decimal places. This might come in handy if you are trying to line up\
    \ decimal numbers in a table. If the command has round the last decimal place,\
    \ you may get different rounding results based on your browser so you should test\
    \ this if it is important. Just remember that the result is a string so don't\
