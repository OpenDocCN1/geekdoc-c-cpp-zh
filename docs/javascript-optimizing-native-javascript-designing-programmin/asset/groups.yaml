    \ be aware of, including:\n\n+   * Line endings: UNIX uses a single LF (line feed)\
    \ to end lines where Windows uses CRLF (carriage return/line feed). Source control\
    \ systems usually handle this but need to be careful.\n* Character encoding: Character\
    \ encodings of special characters may be different between the systems.\n* Filenames:\
    \ UNIX systems normally ignore upper and lower case characters differently. Windows\
    \ systems normally ignore case in file and folder names. To avoid possible problems,\
    \ I try to keep all folder and file names in lowercase."
  - "[PAGE 123]\n\n# Chapter 9: Fetching Server Data • 117\n\n# Using canned data\n\
    \nIf your application relies on data downloaded from the server you may want to\
    \ consider having this data available locally in pre-built data files. This often\
    \ referred to as *canned data* and can be very helpful for several reasons:\n\n\
    +   1. You may not have the server APIs or data working in time for you when using\
    \ your interface. You want to be able to fill in lists and write the code to properly\
    \ display the screen first instead of stubbing it out and redo later.\n2. You\
    \ may have to run the program in the future when you do not have connections to\
    \ the server, or if the servers are not working for some reason. This can happen\
    \ when giving demonstrations to management, or at trade shows.\n3. It can also\
    \ be used before the server API's are in place in order to design the appropriate\
    \ JSON data structure and get it completely designed before giving it to the programmer\
    \ who is implementing the server API.\n\n# Limitations\n\nObviously you cannot\
    \ recreate all of the server API's using canned data. If your application displays\
    \ a list of names that allow the user to select any name to fetch detailed information\
    \ from the server, you obviously have to have canned data for only one or two\
    \ names and then add a test mode to your app indicate when to load only those\
    \ files. But it can be very helpful for this and other start data files that are\
    \ loaded.\n\n# Setting up canned data\n\nAdding the data to your canned files\
    \ is fairly straightforward. You have two choices:\n\n+   * If you do not have\
    \ the server API in place, you will need to manually enter the data in a valid\
    \ JSON format using a text editor, or\n* If you have the API working but want\
    \ to guard against it not being available in the future, or it may be almost correct,\
    \ or you want to work offline, you can do something similar to the following (it\
    \ may change slightly in different browsers):\n1. Before doing these steps, you\
    \ should add a JSON formatter extension to your browser.\n2. Open your browser\
    \ and the debug console.\n3. Go to the network tab in your debug console.\n4.\
    \ Load your application and execute the API request you are concerned with, or\
    \ simply enter the URL in the server's URL field. If the API has been executed\
    \ from your program, you can do the following:\n   a. In the network tab, you\
    \ will the requests for all of the files that your application loads, including\
    \ the data request.\n   b. Right click on the name of the API you want to capture\
    \ and select the 'Open link in new tab' option.\n   c. A new browser window will\
    \ open displaying the results of the request. If you have a JSON formatter in\
    \ your browser, it should be nicely formatted and indented.\n   d. Copy and paste\
    \ this data to a text file and give it an appropriate name."
  - "[PAGE 124]\n\n# JavaScript • Optimizing Native JavaScript\n\nOnce you have the\
    \ file, there is another decision you need to make in order to format properly.\
    \ If it is to be fetched with a regular JSON fetch, you can use it as is. However,\
    \ if you want to substitute for a JSONP server request, you have a few more steps.\
    \ In order it to be fetched as a JSONP file, the data will have to be wrapped\
    \ inside a function call with a name known to the application. One way to accomplish\
    \ this is:\n\n+   - Decide on a unique function name (such as `cbAddressData`)\
    \ for each file and add around the data object, similar to the following where\
    \ `xxxx` represents your regular JSON object:\n  `cbAddressData((xxxx))`\n- Append\
    \ this name as the callback to your JSONP fetch instead of using a randomly generated\
    \ name. This will fetch your json from your local file system instead of a server.\n\
    \n# Validating your JSON files\n\nWhen entering data manually or testing new server\
    \ APIs, you may need to validate your JSON data to ensure it is formatted correctly\
    \ and to get a clear idea of what all the fields look like. Some methods to help\
    \ you do this are:\n\n+   - Install a JSON parser extension to your browser so\
    \ you can parse JSON files that fetch to your browser window.\n- Copy and paste\
    \ your JSON file into an online JSON validator or parser. There are many of free\
    \ tools that you can find by searching the Internet. These will point out errors\
    \ like missing quotation marks and improperly formatted fields. If you are trying\
    \ to validate a JSONP object, you may have to strip out the surrounding function\
    \ in order for it to be properly evaluated.\n\n# Converting between JSON objects\
    \ and Javascript objects\n\nThere are several ways to convert your JSON objects\
    \ to objects that you can use directly in your JavaScript code.\n\n+   - Built-in\
    \ `eval` function. This is not recommended as it can convert objects but also\
    \ execute JavaScript code that might be malicious. There are other differences\
    \ between this and the next method.\n- `JSON.parse`. This method is designed to\
    \ convert any of your JSON objects directly to JavaScript objects and is the preferred\
    \ method.\n\nAnother method that you will use is `JSON.stringify()` to convert\
    \ your JavaScript objects directly into a JSON string that can be sent to your\
    \ server."
- md: "\n# Caching your server requests\n\nCaching refers to the method of responding\
    \ to your requests for data by using the response from an earlier request. This\
    \ can be used for your program files, image files, or data files using HTTP requests.\
    \ It can be very helpful when loading the same program repeatedly when you run\
    \ an application. Responses can be cached at various locations in the fetch process,\
    \ starting with your browser's cache. This reduces the load on the server and\
    \ increases the responsiveness of your application.\n\nThere are a number of factors\
    \ that affect when caching is used. These include information in HTML file headers\
    \ and, most importantly, the URL request that is sent. You can use this information\
    \ to help influence when your requests are cached. There are a number of strategies\
    \ that you can find by doing an online search, many involving the use of Expires\
    \ or Cache-Control in your file headers, or the use of entity tags (ETags).\n\n\
    # Disabling caching\n\nThe common times you may want to ensure caching is disabled\
    \ include:\n\n- Requesting time sensitive information that may be continually\
    \ updated on the server so you need to ensure you have the latest information.\n\
    - Loading program files (HTML, CSS, JavaScript) for your application when you\
    \ are developing your application and those files may be frequently changing.\
    \ A common way to disable caching in this instance is to add a random string,\
    \ as the current time in milliseconds, to the filename of each file when requesting\
    \ them JavaScript fetches.\n- Use your browser's 'clear cache' function to manually\
    \ clear the current cache.\n\n# Enabling caching\n\nThere are times that you want\
    \ to ensure that data is cached, mainly to speed up your application and reduce\
    \ server load. A few things to remember when to do this:\n\n- You can only GET\
    \ requests. POST requests cannot be cached.\n- Your requesting URL must be the\
    \ same as a previous request in order to ensure that your data is split up so\
    \ that much information can be fetched with identical URLs and user-specific requests\
    \ are kept to a minimum. Remember that caching can occur at different locations\
    \ in the network so requests from different users may also be cached.\n- JSON\
    \ requests. Routines that make JSON normally attach a unique string to the end\
    \ of the URL to be constructing the callback function which is required for JSON\
    \ to work. That unique string will make the request uncacheable. In order to cache\
    \ these requests, you will need to use the same callback string for each request.\
    \ You can try varying this string every 12 or 24 hours to ensure you periodically\
    \ get a fresh copy.\n\n# Reduce the amount of data you have to handle\n\nYou should\
    \ try to minimize the amount of data you receive from your servers. This will\
    \ decrease the load on the server, improve load times, and decrease the amount\
    \ of memory your application uses. Ways to accomplish this include:\n\n- Keep\
    \ all field names as short as possible.\n- Change filenames if possible to make\
    \ them easy to reference by index number or a computable name.\n- Put all images\
    \ in one directory structure and send that name once and have your app prepend\
    \ that name to each filename.\n- Don't send unneeded information. Create separate\
    \ APIs return just what you need or add a method on the API to specify the fields\
    \ you need.\n- Try to avoid really long ids for your records. Even if you have\
    \ 100,000 objects, you really only need a string 6 chars long, or even shorter\
    \ if you hash it bit.\n- Combine binary fields on the server into bit arrays and\
    \ send just the numbers representing bits.\n- Don't send images in a size any\
    \ bigger than you need. These large images force the browser to resize them before\
    \ displaying. Remember that being twice as wide and twice as high results in a\
    \ file that is up to 4 times bigger.\n\n# Localization\n\nLocalization refers\
    \ to ensuring that your application adapts to the country, language, customs,\
    \ or preferences of the user using it. It is easy to forget when writing applications\
    \ for the U.S. market that some users might be located in different countries\
    \ or have different preferences. The items that you need to consider for localization\
    \ include:\n\n- Date format\n- Language of the user interface\n- Number and time\
    \ format\n- Currency format\n- Special text characters and sorting rules\n- Significance\
