    ## General types of questions at interviews


    There are a few general categories of questions that you might be asked. There
    are a number of books and blogs out there that list kind of interview questions,
    from technical questions to weird tricks. Take them with a grain of salt. A lot
    of them have good ideas but may go overboard. You will also find the questions
    listed in a number of places as being ‘common’ questions. There is some value
    in looking at these sources as in many cases the interviewers are also looking
    to find questions to ask candidates. Remember to learn the basics—many of the
    questions I have been asked nothing to do with anything I ever done programming.
    An interviewer told me that if they had a candidate who could answer all of the
    difficult or tricky questions, it probably meant that they had been looking for
    a job too long and nobody wants. The types of questions you will include:


    - **Experience/background.** What college did you attend; courses taken; degree
    achieved; etc. Make sure you do not exaggerate on—it is too easy to check. A short
    summary of your work history will be helpful.


    - **Coding questions.** The questions will probe your knowledge about programming,
    in our case: JavaScript, HTML, and CSS. The section below lists some common areas
    you should be familiar with.


    - **Project management.** How well have you handled projects, particularly those
    with multiple programmers? Have you used development tools like Agile?


    - **Behavioral/management.** Be prepared for questions about your working with
    former workers, how you solved work problems, how you handled difficult employees,
    etc.


    - **Brainteaser/trick questions.** These are all over the map. Some ask you to
    estimate how many ping-pong balls fit in a car, how many cans of paint it takes
    to paint the wing of a 747 airplane.. The ping-pong question normally requires
    you to make an educated guess, the airplane question might be answered simply
    by saying “One can—if it is enough.” Most of these answers are easier than you
    might think. Listen carefully to the question. These questions have value in determining
    how well you can solve problems or think outside the box.


    - **Stupid questions.** “If you were an animal, what kind of animal would you
    be?” You’re stuck with these if you are asked just to come up with a meaningful
    answer.


    ## General questions


    There are a number of general questions you might be asked that are not related
    to the technical requirements of the job. However, they are very important and
    your answers to these questions can be more important than any technical answers
    you give. Be sure to rehearse these ahead of time so you have coherent answers.
    These types of questions include:


    - What are you proudest of in your career?


    - What interests you in working at our company?


    - What would you do if you win the lottery tomorrow?


    - Describe times that you have worked well with your bosses and times that you
    had problems.


    - Describe yourself in a word or short phrase.


    - What other jobs or companies have you been looking at?


    - Why did you leave or why are you leaving your current job?


    - What are some of your weaknesses and strengths?


    - *(if appropriate)* Have been out of work for a while. What have you been doing?


    ## Coding questions


    One of the frustrating events when I was interviewing for jobs was that, no matter
    how hard I seemed to prepare, the interviewer always asked some question for which
    I hadn''t prepared. This is another reason to participate in many interviews as
    you can. The following list includes areas of expertise that you should know for
    a JavaScript UI position. You will need to place emphasis on the areas that apply
    to the job for which you are applying.


    ### JavaScript


    - Object Oriented Programming: know different ways to create objects; prototypes
    work; how to use the keyword this


    - recursion: be able to program a recursive function


    - Big O notation: know what this means and how it applies to programming. You
    should know this as any of your answers might need to take this into account.


    - linked list: know how to make a linked list and how you should use it


    - local vs. global context: the advantages and disadvantages; hoisting works;
    namespacing


    - event handling: bubbling and delegating; events; event propagation


    - closures: what creates a closure and how you use them; how to properly reference
    variables inside scopes; scopes in JavaScript


    - sorting: how to sort in JavaScript


    - browser detection: feature detection


    - loops: know different kinds of loops and when to use each one


    - module patterns: what are they and why you should care; how they can keep variables
    out of global context


