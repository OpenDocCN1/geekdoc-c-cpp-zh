    \ USER HAS PICKED SECONDARY COLOR\nelse if (x==1) {\n  elem.style.backgroundColor\
    \ = cBackAlternate;\n}\nvar rgex=^(\\d{5})/; //match 5 digits at start of line\n\
    ```\n\nBut please don't add comments that don't add if the code is self-explanatory,\
    \ such as\nlastIndex = 5 //set last index to 5 UNNECESSARY!"
  - '[PAGE 21]


    # Comments indicating ToDo items


    Something else I have found very useful when coding a large project, particularly
    if there are other programmers involved, it is to use your comments to communicate
    with the other programmers or make notes to yourself. I include comments with
    my initials anywhere I have a question or know that I need to go back and fix
    something. I have also included the initials of another programmer in a section
    where they know to do something. Keep your tag (i.e. your initials) consistent
    so you can easily do a global search to find all the comments. Be sure to remove
    any temporary or debugging code so you can make sure it is removed before final.
    Some IDE environments automatically support TODO comments for similar usage. I
    might have comments like:


    ```

    //RX: this function needs to be optimized

    //RX: I am not sure what the possible values are here

    //DD: Can you add the appropriate code in here?

    //RX: temporary test - take out before final

    ```


    # Comments for documentation such as JSDoc


    Documenting your code always seems to be a real pain and something you put off
    until the very end, or something after the end of the project. Depending on your
    project, this can be a real detriment. If items are not documented right away,
    you may have trouble remembering exactly how functions work or why they were written.
    If you are writing modules for other programmers, or have a published API, then
    proper documentation is crucial.


    There are a number of products that simplify your JavaScript code documentation
    task, as JSDoc or UIDoc These rely on the programmer embedding comments using
    a format specific to the tool, as:


    +   /**n* Method description about the following method. Can be several lines.

    * @method (String) objname Description of this string.

    * @param (Object) obj Description of object that is passed in

    * @return (Boolean) Returns true on success

    /


    Whether you want to use one of these methods is up to you and your project team.
    Most likely the person responsible for producing the formal documentation for
    the project will have the final say. The advantages of using one of these methods
    include:


    +   * They allow the programmer to communicate complicated information to the
    documentation team.

    * They force the programmer to document their methods, often resulting in better
    and more concise APIs.

    * Some IDE''s take advantage of embedded documentation to give you help, variable
    typing information, or code completion.

    * If concurrently with your code, then you will have your documentation ready
    when your code is done.'
