    jQuery 等效操作的差异。在某些情况下，jQuery 的等效操作要慢 2,000 倍。即使在性能问题出现必须使用 jQuery 调用，我也会非常谨慎。以下测试使用的是
    `jquery-3.1.1.min.js`，这是当时最新的 jQuery 库。


