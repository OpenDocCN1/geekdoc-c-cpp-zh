    # 12 Tools


    There are hundreds of libraries, plug-ins, add-ins, frameworks, and processors
    available to help you create better apps in less time. New ones are added every
    month. You may want to use these to help shorten your development time, or to
    enhance your program. If you are working at a company, their policy may necessitate
    you using one or more of these packages. Most of them have active communities
    that can provide documentation and help. This is about writing native JavaScript
    without using any of these tools. Since most of these tools are essentially JavaScript
    themselves, learning JavaScript should still be a high priority. Some of the issues
    that you should be aware of when using these tools include:


    +   - Your choice of which frameworks and libraries you learn may influence your
    future search since most job listings have strong preferences for these items.
    It seems there is always a new tool coming out that becomes the current favorite.

    - There are often cross-dependencies between these tools where using A requires
    you to use tool B which may require you to tool C. This adds more code and requirements
    for additional learning.

    - They all have their own learning curve, some steeper than others.

    - They all make your code bigger, in many cases they replace code that you would
    be writing from scratch. Other than some of the processors, they are all more
    just JavaScript code.

    - Anyone else, or in the future, that has to read your code will have to be familiar
    with the set of libraries and frameworks

    - You may need to keep using the latest version and keep track of which versions
    of each tool work with other versions of the other tools you are using.

    - You may find that you need to make small changes to the third party software
    to make it exactly what your application requires. You then have to keep track
    of those changes since you can no longer use new features of the tool without
    changes.

    - It takes a lot of research to select each tool you think you need. Once selected,
    you may spend a lot of time implementing it before you discover that it does not
    do everything you need.

    - You will need to decide if your application fetches all the third party code
    you are referencing from a remote server each time, or whether you will download
    the code once'
