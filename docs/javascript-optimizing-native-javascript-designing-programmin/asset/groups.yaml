    \ CSS 声明\n\n另一个被忽视的未使用 CSS 声明目标。使用剪切和粘贴来填充你的 CSS 文件，或者在使用 HTML 时不移除未使用的选择器是太容易的。移除未使用的声明将加速渲染，并通过减小文件大小来节省带宽。目前有很多工具可以帮助移除未使用的\
