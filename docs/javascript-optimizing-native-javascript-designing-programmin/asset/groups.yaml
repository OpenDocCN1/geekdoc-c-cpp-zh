    ## 36 • JavaScript：优化原生 JavaScript


    - 如果你使用假值（falsy）测试来判断变量是否已赋值，请务必小心，因为有效值包括 0（零）或空字符串。这些值会等于 false，但变量实际上已经过赋值了。


    ## 短路逻辑 if 语句


    测试多个条件的 `if` 语句会发生短路逻辑，这意味着语句一旦确定了其真假性就会立即执行。上一个测试中的测试 11 和 12 就是这种方法的例子。在接下来的语句中，使用
    `&&`（与）运算符，如果 `isValid` 为 false，对 `age` 的第二个测试将不会执行：


    同样，在下面的 `||` 语句中，如果 `x` 为 null，则不会进行第二个测试。


    除了尝试将最可能的测试放在前面之外，你还可以利用这种行为来避免由 `undefined` 值引起的错误。如果你不确定某个测试是否会抛出错误，可以在检查其属性之前先测试项是否存在。忘记这一点是错误的常见原因，而这些错误在测试所有可能比较的值的边界情况之前可能无法被发现：


    ```javascript

    var a = null;

    var b = [3, 2, 3];

    if (a.length > 0) // 这抛出一个错误

    if (b.length > 0) // OK - 为 true

    if (a && b.length > 0) {} // OK - 为 false

    ```


    ## 避免 if 语句中的赋值错误


    JavaScript 条件语句中的一个常见错误是忘记使用两个等号 `==` 或 `===`，而只使用了一个 `=`。这是一个有效的语句，因此 JavaScript
    通常会运行它。它看起来可能是这样：


    ```javascript

    if (x = 5) {

    // 而

    if (x == 5) {

    ```


    某些编译器、SDK 或像 ESLint 这样的程序会提示此类问题。许多程序员使用的一种方法通常被称为 Yoda 方法（尤达写法）。Yoda 可能会把比较语句描述为“如果
    5 是你的变量 x”，你这样写：


    ```javascript

    if (5 == x) {

    ```


    按照顺序书写，如果你写错并写成 `if (5 = x)`，它会导致一个明显的 JavaScript 错误，而不是引入一个难以发现的细微漏洞。如果你习惯这种写法并且它能帮你写出更好的代码就好。个人而言，我觉得这种语法很困惑，并依赖
    ESLint 来发现任何错误。


    ## 创建新数组和对象


    在 JavaScript 中创建原生数组和对象有两种主要方法（不包括 `split` 方法或对象构造函数等方法）。你随处都能看到这两种方法的示例，更传统的方法是：


    ```javascript

    var a = new Array();

    var b = new Object();

    ```


    你也可以使用以下快捷方法：


    ```javascript

    var a = [];

    var b = {};

    ```


    如下表所示，你真的应该使用第二种方法，因为在某些浏览器中其性能有巨大的提升。


    | | 性能测试 | OPS (越大越好) | Safari | Chrome | Firefox |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 1. var a = new Array(); | 1,521 | 69 | 972 | |

    | 2. var a = []; | 1,501 | 181 | 958 | |

    | 3. var a = new Object(); | 1,468 | 29 | 5 | |

    | 4. var a = {}; | 1,481 | 99 | 1,001 | |


    > 测试 3: http://www.nativejavascript.com/tests/CreateObjects.html


    这些结果强调了几个重要点。


    - Safari 浏览器似乎经过了优化，处理所有方法的方式大致相同，尽管快捷方法仍然更快。

    - Chrome 在所有方法上都较慢，但快捷方法仍然快得多。

    - Firefox 上创建对象的长方法慢得惊人。请使用快捷方法。


    ## 提升 (Hoisting)


    JavaScript 使用一种被称为“提升”的方法将所有变量声明移动到顶部。只有声明会被提升，而赋值值不会。


    ```javascript

    console.log("varA = " + varA);

    var varA = "value";

    ```


    这会在控制台显示：


    ```

    varA = undefined

    ```


    因为声明被提升了，但赋值未设置。如果你使用赋值来声明函数，情况如下：


    ```javascript

    function parseData {};

    ```


    ## 38 • JavaScript：优化原生 JavaScript


    如果你以以下方式声明相同的函数，它在当前作用域的任何地方（上方或下方）都是可用的：


    ```javascript

    function parseData() {

    ```


    这是另一个你应该将所有变量声明放在顶部的原因，以确保你的逻辑不会被误解。将函数赋值变量的另一个用途（尽管不会被提升）是可以将类似的函数赋值给数组元素。与其在一个函数中使用条件逻辑来处理不同的排序，不如通过索引调用相应的函数，例如：


    ```javascript

    var dateFunctions = [];

    dateFunctions[0] = function() {

    // 第一个函数的代码

    }

    dateFunctions[1] = function() {

    // 第二个函数的代码

    }


    ## 将字符串转换为数字


    有时你需要强制将字符串变量视为数字。如果你使用严格相等运算符 `===` 进行比较，或者将该值用作公式的一部分或数组索引，就需要这样做。有时从 Cookie
    或类似的存储获取的值看起来是数字，但在内部以字符串形式表示，必须转换为数字。有多种方法可以进行这种转换。


    - `parseInt()`：将字符串转换为整数。务必在操作末尾添加基数，以避免某些字符串被转换为非10 进制。以零“0”开头的字符串如果不指定基数，将默认为八进制（基数
    8）。命令应该是：`var x = parseInt("342", 10);`

    - `Number()`：将字符串转换为数字。

    - `parseFloat()`：将字符串转换为浮点数（包括小数）。

    - `Math.floor()`：通过向下取整处理数字或有效字符串。

    - `Math.ceil()`：通过向上取整处理数字或有效字符串。

    - `Math.round()`：将数字四舍五入到的整数。如果小数部分等于 .5，则向上舍入；否则向下舍入。

    - -0：字符串末尾有 -0 会强制将其转换为数字。


    '
