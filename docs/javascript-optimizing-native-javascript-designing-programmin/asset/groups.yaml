    # Using different values for True/False including bitwise operations


    We had looked at earlier differences using false comparisons on values like true/false
    or 0/1. You have properties on objects or arrays that are used essentially as
    flags having only two states. You can use either true/false or 1/0 in these cases.


    You may have collections that have a number of true/false flags on the same object.
    You can combine them into one integer value to save memory without sacrificing
    performance. Each in the number can represent a true/false value.


    # To Set:


    ```

    var filt = 0;

    filt = 1; //1st bit on - filt equal to 1

    filt = 4; //3rd bit on - filt equal to 5

    filt = 32; //6th bit on - filt now equal to 37

    ```


    # To Test:


    Test if a specific bit is on, even if other bits are on:


    ```

    if (filt&32) ... //true

    if (filt&64) ... //true

    ```


    # Math.pow to set values:


    Normally this method of storage will map to some list of variables or perhaps
    an index in an array. Thus, we want to have an easy way to set and get a specific
    value, let''s say by 6. The best way to do this is to use the built-in function
    Math.pow() and raising the number (2) to the power of your index, starting at
    zero (0). The setting method described above would like:


    ```

