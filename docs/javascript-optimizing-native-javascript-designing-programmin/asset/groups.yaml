    # A picture can be worth 1000 words


    Sometimes, having a small JPG or PNG image to convey a function is truly worth
    a 1000 words. You might want to use this in a settings page where the user is
    selecting options that control the visual display—like zooming, page orientation,
    or whether an info panel is displayed to the right or below the main window. Just
    put a small image in the UI and the user will instantly know what you are trying
    to say. You don''t have to worry about language localization as an added bonus.
    And you can fix more icons on the screen than you can.


    # Chartjunk


    Edward Tte, in his wonderful book about design, *The Visual Display of Quantitative
    Information*, refers to unnecessary elements on the screen or in graphs as chartjunk.
    Don''t add unnecessary elements on your screen. White space. It is OK to leave
    space around elements to aid screen readability in general. Make every element
    count. Instead of a separate sort button or buttons, allow the user to click on
    the column heading. Don''t make graphs look 3-dimensional if that represents the
    data. Remove vertical or horizontal lines that aren''t needed.


    # Screens should self-document


    The user should always be able to determine the state of a screen. They should
    self-document whenever possible. If the user clicked on a row in one screen to
    see more detail, the detail screen should repeat the item''s name from the first
    screen so it is clear what is being represented. This is more important in multi-user
    experiences such as software that will run on a TV screen and viewed by more than
    one person. Don''t rely on the person remembering exactly what they selected on
    one screen when you display the next. This can be done with extra text fields
    on the screen, small icons, or with special colors.


    # Function first–form later


    Get your logic in place. Study the needs of your end user carefully. Design the
    logic flow of your program first. Use a good wire-frame program to design and
    link all of your screens. Only then you start laying out your visual design (eye
    candy.) I have often seen the process fail when in reverse. Don''t pick a metaphor
    and then to force the logic into that metaphor. I have found more helpful to get
    all the features placed on the appropriate screens. Then, based on that layout
    and the expected user profile (is this for writers or gamers?) see if there is
    a metaphor that actually help the user use the program. You don''t have to have
    some cool-looking metaphor—you can make very effective designs that just require
    the standard interface appearance on the platform.


    There is often pressure from management or sales to get something as quickly as
    possible which often leads to a graphic designer delivering Photoshop or Powerpoint
    slides without much thought to how the application actually needs to work. And
    those designs often have a life of their own. Make sure this doesn''t happen to
    you.


    # Interface problems


    - Elevator bars on touch devices. Elevator bar and scroll bars on traditional
    mouse screens are very obvious. Everyone immediately understands how to use them
    and what information they convey. The Down arrow on the keyboard corresponds directly
    with the down arrow on the scroll bar or moving the elevator bar. They all move
    down the document. However, touch screens alter this obvious usability. Move down
    in a list, the user swipes over the screen. If you display a scroll bar, it will
    move in the opposite direction. If you let the user grab the scroll button and
    move it, then action will be opposite of doing the same over text. You must be
    clear in how you display these controls and what you "invite" the user to do.
    And I really don''t like "hidden" scroll bars that only appear when you are using
    them. Visible scroll bars convey a lot of knowledge to the user—that there is
    more data than visible, what part of the current screen displays, how big the
    document is, and you gives a one-click method to scroll up or by page of data.

    - Spinners. You may also have problems with spinners used for numbers or dates,
    and the corresponding cursor keys are handled. If it is a list of dates, then
    moving up back in time (smaller number) or to a higher number (forward in time).
    If you can, make date controls move from left to right. You will have a similar
    problem for channel numbers in a television guide. A Channel Up button may have
    the Up/Plus on top of the button, but moving up in a displayed shows lower channel
    numbers.

    - On/off sliders. These are popular on iOS devices but use their space. They can
    be very annoying if not implemented properly. Do slide them to the side or click
    on one or the other? Do they even when moving the mouse?


    # Animation


    The designer needs to be involved in this and it is very important that they can
    actually write the CSS that handles the animation. It does not help a programmer
    to give what the animations should look like—they really want the CSS that shows
    the exact vision, transform, or animation that produces the desired animation.
    Programmers often will not know the effect desired by the designers.


    With the advent of CSS3, it becomes easier to quickly produce all kinds of cool-looking
    special effects for screen transitions, moving elements around, or scrolling.
    However, there is danger lurking with these new effects, including:


    - They can be slow or jerky on devices that don''t have the CPU power of your
    computer. Having slow or jerky animations is most likely worse than having them.
    Don''t just test them on your high-end computer—try them on your targeted devices.
    Preferably, you will try your desired animations in small test files before deciding
    to incorporate them. Remember, though, that they may act differently once you
    have the code in the full app with a full DOM tree.


    # JavaScript • Optimizing Native JavaScript


    2. The animations do mean something. Don''t have gratuitous animations just because
    you can. If the user presses a right arrow to display the next screen, then that
    screen would slide from the right. Likewise for other animations triggered by
    arrow controls. If you press a Back button, sliding the previous screen in the
    left will reinforce what is happening in the user''s mind. If there is no obvious
    movement that makes sense, then you might want to try an opacity fade.


    3. The more elements you animate at one time, the more you run the risk of jerky
    animations so try to keep them to a minimum. Keep your HTML simple. If you have
    a table of rows you are moving, try to minimize the number of elements in each
    row.


    # Envision your application in a dark room


    This applies to any UI designed for a TV that will be using remote control, but
    the same concepts apply to UI''s on any device. The basic rule is to design your
    interface so if I have the remote controlling the television and you are sitting
    on the sofa don''t know what buttons I am pressing, you should be able to tell
    what is happening by looking at the screen. If you have designed screens to have
    no animation when the user presses the right or left arrow to the next/previous
    screens, then the other viewer will have no idea what just happened. Buttons should
    change shape, color, or position when pressed, and selected items should be clearly
    highlighted.


    # User feedback


    There should be immediate reaction to user events. If a button is pressed or touched,
    the user should know immediately that the event was registered and something is
    happening. You can do this one or more of the following techniques:


    - 1. Change appearance. The button can change appearance as soon as it is touched.
    This may involve a color change, a size change, or slight movement. The traditional
    change on a PC or Mac program is to show the button as being depressed usually
    means flipping the gradients colors. Just remember that on touch devices, the
    user''s finger is most likely hiding any changes you make to the element. This
    is why the virtual keyboards should show the character touched in a little bubble
    under your finger so you can see what you pressed.

    - 2. Progress. You can show a progress indication showing that something is happening.
    This is usually an GIF that is a small rotating circle or similar graphic.

    - 3. Show the next screen. You should be able to show the next screen as soon
    as possible. Work on a design that lets you show the main elements right away
    and then fill in the rest of the fields.


    You should also be able to disable controls by dimming them or when you are processing
    the previous user action. Don''t forget behind alpha dimmed layer when your application
    first loads. Be sure the user knows that something is happening.

