- md: "\n## Comparing objects\n\nIf you compare objects to determine if they are the\
    \ same, you need to be aware of the following conditions when you try to compare\
    \ them:\n\n- Two objects made with the same constructor and values: Not equal.\n\
    - Two independent objects made with exactly the same properties: Not equal.\n\
    - A second object set equal to first object (e.g. obj2 = obj1): Equal\n\n## Chapter\
    \ 5: HTML • 71\n\n## HTML\n\nYour application starts with your HTML file. Your\
    \ HTML contains what your user will see and determine how they will interact with\
    \ your applications. We will discuss the CSS (Cascading Style Sheet) used to apply\
    \ styles to your HTML elements in a later chapter. The other term you need to\
    \ be familiar with is the Document Object Model or DOM. This model is the representation\
    \ of all the elements that can be displayed by your application. It is often referred\
    \ as as a \"tree\" since it is a hierarchical list of related elements.\n\n##\
    \ Rule Number One\n\nDon't mess with the DOM. Proper access and manipulation of\
    \ the DOM tree is one of the major causes of poor application performance. You\
    \ need to minimize the number of times the browser must reflow your document's\
    \ DOM elements. An easy, and inadvertent, of forcing a reflow is to simply ask\
    \ for an offset value, like elem.offsetTop. These methods force the browser to\
    \ reflow the entire document in order to determine the exact value of the offset.\n\
    \n## Rule Number Two\n\nSee rule number one.\n\n## How to add HTML elements to\
    \ your application\n\nThere are several ways to add HTML elements to your application.\
    \ You will have to decide which methods make sense for your application. Each\
    \ method has its advantages and disadvantages. There are also number of template\
    \ systems and frameworks like Angular that are available that also adding HTML\
    \ or dynamic HTML. The native methods include:\n\n1. Place the elements in your\
    \ main HTML file, called index.html. This may be useful if you have static HTML\
    \ that isn't dynamically updated. In general, you want to have only the HTML loaded\
    \ at the start that is for your initial screen display.\n2. Append sections of\
    \ HTML that you read from to the appropriate section of the existing HTML. This\
    \ allows you to defer sections of the DOM until you need to.\n3. Copy or clone\
    \ existing elements and add them back into the DOM. You can change the values\
    \ of any attribute before adding them to the DOM.\n4. Create the elements from\
    \ JavaScript either innerHTML or appendChild. This allows you to create custom\
    \ attributes and use loops to populate the DOM. An advantage of appendChild is\
    \ that you can save the handle to the element the time you create it if you need\
    \ it later to change the element properties or content.\n\n## JavaScript: Optimizing\
    \ Native JavaScript\n\n### Getting to your first screen faster\n\nYou need to\
    \ decide what to optimize for designing your application. Sometimes you want to\
    \ display the first screen as fast as possible; other times, you want to load\
    \ more information before displaying the interface or the full interface. Assuming\
    \ you want to get your first screen displayed and operational as soon as possible,\
    \ you need to keep the following in mind:\n\n- To minimize the amount of JavaScript\
    \ code that is needed to display the first screen. Instead, have most of the work\
    \ done by your HTML and CSS.\n- Have the initial file that is loaded (usually\
    \ index.html) contain just the HTML that you need for your first page. Have your\
    \ JavaScript load or create the rest after the first page load.\n- Put your script\
    \ tags at the end of the document, after the HTML, to ensure that the HTML loads\
    \ as fast as possible. Loading JavaScript files using script tags will block the\
    \ complete display of your page. Most browsers will load script files in parallel\
    \ but still need to load.\n- You normally not need any JavaScript executing until\
    \ your DOM is properly loaded. You can use one of two events (or both) on your\
    \ body tag to call your initialization:\n  - onContentLoaded: This fires when\
    \ the document is loaded and parsed, but images and stylesheets may not be loaded\
    \ yet. If your HTML is complete and doesn't need these items, this may work.\n\
    \  - onload: fires when the page is fully loaded. This waits for these other items,\
    \ it may not fire for a while.\n\nSometimes it might be better to load more files\
    \ and images when you start the app so that the application performs faster. One\
    \ of UI design is deciding when and how to preload elements or information.\n\n\
    You can also use the defer option in the script tag to defer loading of scripts\
    \ that do not affect the DOM display. This is supported by most browsers. Once\
    \ the DOM has been loaded these files will be requested and loaded.\n\nSee more\
    \ information in Chapter 11 about loading JavaScript, HTML and CSS files.\n\n\
    ## Cloning nodes\n\nIf you have nodes you want to copy, you can use the cloneNode\
    \ method to make copies. There are some advantages of creating elements this way,\
    \ including:\n\n- You can copy the node but change individual properties before\
    \ adding it back into the DOM. This can be useful for changing properties like\
    \ ID or position.\n- You can save the handle to the element if you need it later\
    \ in your program.\n\nAn example of this to clone an element is:\n\n```\nvar rowelement\
    \ = document.getElementById('rowid-0');\nfor (var i=1; i<10; i++) {\n  var newNode\
    \ = rowelement.cloneNode(true);\n  newId = 'rowid-' + i;\n  parentobj.appendChild(newNode);\n\
    }\n```\n\n## Ways to minimize your impact on the DOM\n\nAs discussed earlier,\
    \ you want to minimize the elements you have to force the browser to re-layout\
    \ your HTML DOM. Sometimes this is unavoidable, but there are a number of methods\
    \ you should keep this to a minimum.\n\n1. Append an entire section of HTML read\
    \ in a file. This will cause a reflow but not multiple reflows for each element.\n\
    2. Use innerHTML to append a string containing many elements. This may also be\
    \ faster than appending multiple elements.\n3. Add elements to a document fragment\
    \ and then append that to the DOM.\n\n| | Safari | Chrome | Firefox |\n|---|---|---|---|\n\
    | 1. mdiv.innerHTML = str; | 41 | 31 | 21 |\n| 2. mdiv.appendChild(newDiv); |\
    \ 63 | 18 | 21 |\n| 3. frag.appendChild(newDiv); | 24 | | 30 |\n\nTest 5: http://www.nativejavascript.com/tests/Test-innerHTMLVsAppendApp.html\n\
    The results of using innerHTML vs appendChild showed different winners but they\
    \ were all very close. Since your elements will be more complicated than those\
    \ used in this, you probably need to test your exact requirements on each browser.\
    \ Plus testing measure performance when testing HTML elements in a loop is not\
    \ very accurate to determine overall performance.\n\n4. Don't access attributes\
    \ that require the browser to redraw the document.\n\n## Difference between visibility,\
    \ opacity, and display\n\nOnce you have added elements to your DOM tree, there\
    \ are several ways to temporarily hide them. Each method has advantages and disadvantages.\n\
    \n- **Opacity**: You can set the element's opacity to zero (opacity:0;) to hide\
