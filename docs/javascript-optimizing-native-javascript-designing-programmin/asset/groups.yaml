    \n你的团队必须决定一个一致的解决方案并确保其执行。至少，你应该有一种方法来识别哪些函数和变量需要记录，哪些本质上是私有的。当有疑问时，在编写代码时添加注释。你以后可以随时删除它们或稍后重做。\n\
    \n## 标点符号\n\n### 分号\n\n遗憾的是，JavaScript 规范并没有要求使用分号来结束每一行，但你应该确保使用它们。尽管你可以不使用它们也能运行，但在对代码使用闭包编译器（closure\
