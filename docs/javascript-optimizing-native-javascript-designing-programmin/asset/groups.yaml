    > “在编写代码时，要假设最后维护你代码的人是一个知道你住在哪里的暴虐精神病态者。”


    -John Woods


    附录 附录 A：面试 • 153


    ## 面试


    编写这本关于编程的书的主要动力是我长期工作的一家公司发生了大规模裁员。此外，我在那里工作了 15 多年。这是我第一次被投入就业市场。现在我老了几岁，正在与伴随互联网长大的千禧一代竞争。我编写
    JavaScript 和 HTML 已经很久了，但我需要确保自己熟悉最新方法，并重新熟悉面试流程。因此，在我努力寻找新工作的同时，我开始写这本书。遗憾的是（对这本书来说），但对我来说的是，我在几个月后找到了一新工作。现在我终于要完成这本书了，关于面试过程有一些建议，或许可以帮助其他正在找工作的人。


    ## 如何自动进入候选人的前 50%


    我曾处于面试过程的双方——作为求职者，以及为我的公司面试候选人。我还尽可能向面试过我的人请教，看看我的表现如何，并为未来的面试获取建议。我不断地惊讶于大量候选人的准备工作多么不充分。因此，无论新职位所需的专业知识如何，我有一些“要做的”和“不要做的”，可以让你进入所有候选人的前
    50% 或更多。至少，遵循这些建议应该让你保持竞争力。这些建议对你来说可能很显而易见，但令人惊讶的是这么多候选人没有遵守。而且这些与你与新职位相关的技能无关。


    - **准时！** 迟到就等于开场丢局。早点到确保你找到了正确的建筑和房间……这能显示出你的留心。

    - **简历。** 多带几份简历副本。有些面试官可能丢失了他们的那份。你可能还需要对简历进行修改以针对特定职位。

    - **着装。** 根据工作的类型和地点穿着整洁得体的衣服。这可能需要一些研究，但正如俗语所说，盛过犹也胜过不足。至少，这显示了对面试官的尊重。

    - **问候。** 握手要有力，直视对方的眼睛。

    - **交流。** 说话时要清晰、乐观、积极。语速要慢。仔细听问题，但不要害怕让面试官澄清任何问题。这显示出你在关注并且实际上理解了所涉及的问题。


    ## JavaScript • 优化原生 JavaScript


    - **回答。** 花些时间回答问题。这让你看起来像是在仔细考虑答案（并为你留出更多时间想出最佳答案）。对话中的停顿并没有问题。

    - **书。** 如果你必须写，请写得整齐。

    - **手机。** 关掉手机。面试期间甚至不要想看它，更不用说接电话了。也不发短信。没有什么比这更能表现出对面试官的不尊重了。

    - **做功课。** 尽可能多寻找关于你面试公司的信息。你可以在网上、公司官网和财务网站上找到大量信息。为你所面试的每个工作创建一个文件夹，并尽可能填满各种信息。

    - **这是什么工作？** 了解你所申请的职位的要求。有些候选人竟然不知道自己申请的是什么工作，这让我大为震惊。

    - **举例。** 注意不要把你没做过的事情归于自己。但尝试用具体的例子说明你过去是如何解决问题的。

    - **了解对方。** 如果可能，了解将面试你的人。你可以去 LinkedIn 获取他们的简介和照片（如果发布过的话）。了解他们的背景和技能将将是有帮助的。你可能会在爱好、运动或母校方面找到共同点。将这些信息放在你的文件夹里。

    - **发生了什么？** 准备好回答一些个人问题，例如你为什么离开上一份工作、你对那里喜欢或不喜欢什么、你如何与他人相处、你的优点和缺点等。这些与技术性工作技能无关，但对大多数工作来说同样重要，因为你将与他人合作。提前排练你的答案。这里的回答将让你获得工作，或让你无缘机会。

    - **如果你无话可说……** 永远不要诋毁之前的雇主或任何员工。准备好对任何关于以前工作的提给出积极的回答。

    - **福利。** 尽量避免谈论薪水或福利，至少在前面的面试中如此。如果你还在竞争中，这些问题可以在之后提。如果你一开始就问可以居家办公几天或有多少年假，可能会过早葬送自己的机会。

    - **提问！** 你也在面试。你正在做一个将影响你几年的决定，这会对你的生活产生巨大影响。你需要尽可能多地了解公司本身以及那里的人。就晋升机会和公司愿景提直接的问题。你可能会决定，尽管他们想要你，你也不想在那里工作。此外，如果你提问，面试官会将其视为负面——他们希望被提问。

    - **跟进。** 给面试官发一封礼貌的邮件会让你的名字留在他们面前，并向他们展示你的兴趣。我从一些那里得到了反馈。


    附录 A：面试 • 155


    - **经常面试。** 尽可能多参加面试。你不想浪费面试官的时间。在获得更多经验之前，面试都是灾难。此外，我似乎从每次面试中中学到了什么，或者发现了需要学习的领域。

    - **练习。** 提前练习回答问题，包括写解决方案。大声回答。你需要习惯缓慢清晰地说话。


    ## 回答技术问题


    现在我们讨论如何应对测试专业知识的技术面试。我认为，比起答案，你如何推导问题更重要。在可以秒查任何答案的时代，记住每个函数没有识别要解决的问题并设计解决方案重要。在处理这部分时，最重要的事情包括：


    - **澄清问题。** 如果问题完全不清楚，确保你澄清它。不要害怕提问，以便你充分理解问题后再回答。

    - **口语化你的解决方案。** 你处理问题的方法通常比细节更重要。如果你忘记了方法的格式，但解释了该函数在做什么，面试官通常不会惩罚你。

    - **交流。** 除非遇到问题，否则不要坐在那里。。边想边说。如果你的逻辑和推理正确，你可能不需要回答完问题。特别是如果你很久没有面试了，很容易产生“紧张”。口语化问题有时有助于你想出正确的答案，并以此告诉面试官（有时他们也会帮助你）。


