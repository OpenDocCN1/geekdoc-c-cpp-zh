    \ delete method, similar to:\n\n```\ndelete globalVar;\ndelete globalVar2;\ndelete\
    \ globalVar3;\n```\n\nThe delete method will normally remove the object. However,\
    \ the global object declared with var (globalVar2) will not be removed and will\
    \ still contain its value. When you try to access these variables again, accessing\
    \ globalVar or globalVar3 will throw a JavaScript error. Access globalVar2 still\
    \ shows the original value of 13;\n\n# Use of undefined variable\n\nBe careful\
    \ testing undefined as a user can actually change the value of this variable and\
    \ your tests may fail. I think this is highly unlikely and very easy to spot and\
    \ correct. Assume that your content is all \"trusted\"—that is, it has been reviewed\
    \ by some and not contain malicious code. If you are coding in an environment\
    \ where you may not have control over what is added, then you may have to take\
    \ that into account when deciding how to test variables. You would also have to\
    \ add a more error checking in this instance.\n\n# Comparisons with == or ===\n\
    \nJavaScript has two equality operators that can be used to compare variables\
    \ and constants.\n\n| Operator | Result |\n| == type-converting equality | JavaScript\
    \ will attempt to coerce the variables to the same type and compare them to see\
    \ if they are equal |\n === strict equality | Variables must be same type and\
    \ have same value to be considered equal |\n\nA few points about these operators:\n\
    \n+   * Expressions comparing objects are only true if they are comparing the\
    \ same object.\n* Null and undefined are considered the same using ==, but not\
    \ using ===.\n* As shown below, the performance of both operators is essentially\
    \ the same.\nnThe use of == to compare values can sometimes be OK if you know\
    \ what you are doing. Using the strict compare === ensures that the values are\
    \ both in type and value there may be the times that the regular compare would\
    \ be sufficient. Some places you need to be careful include:\n* Reading values\
    \ from cookies or similar storage. These normally be internally represented as\
    \ strings and the normal coercion may not work. You will have to force the numeric\
    \ value you read in to be a number using something like a parseInt().\n* If you\
    \ are careful, you can use the coercing compare to make short compare statements.\
    \ This is discussed in more detail in the section about testing for falsy values."
