    \  varA = varA || \"default\";\n}\n```\n\n- **Return values.** You can use the\
    \ following to return values from your functions:\n```javascript\nreturn varA\
    \ || \"default\";\n```\n\nAll tests in the table below returned a value of true.\
    \ Declarations for the following tests for equality follows:\n\n```javascript\n\
