    # # Loading files locally from a remote server


    Be careful if you always run and test software on a local server or directly from
    your computer. You may find that when loading and running the software from a
    server, the timing of file loading will be different and may cause errors. Asynchronous
    file loading results in an indeterminate order of loaded files so you need to
    be sure this will not cause problems, or take steps to control the files are actually
    loaded. You should also be careful if you test only your fastest PC with the most
    memory. Most users will not have that configuration.


    # # Debugging using console.log


    Depending on your build environment and how fast you can change your code and
    reopen in your browser, it is often useful to use console.log statements to help
    debug your code. Just place the statements where needed to indicate when functions
    execute, or the values of certain variables or objects. This may actually be faster
    than trying to debug the code using breakpoints. You may also need to use debug
    timing loops or code that actually executes differently if you stop it to examine
    values.


