  mdcn: '


    ## 我经常忘记的其他 CSS 属性


    除了上述描述的 `box-sizing` 属性外，我似乎总是忘记以下属性：


    - `pointer-events`: none; 你可以将此应用于屏幕上覆盖在其他对象上的透明或半透明对象，允许鼠标事件穿透到下方的元素，而不会被该元素拦截。

    - `table-layout`: fixed; 表格大小不再根据每个单元格中的内容来确定列宽，而是固定为你为表格和每列指定的值。这迫使表格外观保持一致，并加快显示速度，因为浏览器可以无需等待放置所有内容即可立即渲染表格。

    - `white-space`: nowrap; 这可以防止长字符串换行到后续行，并强制其保持单行。


    # 7 事件处理


    JavaScript 有多种方法来分配和处理鼠标、键盘和触摸事件。要确切知道使用哪种方法来分配处理程序，以及如何妥善处理它们以避免破坏应用程序，可能会令人困惑。我认为对于事件在文档内部究竟是如何处理的也存在一些不确定性。你在代码中会处理各种类型的事件，包括文档加载事件和按键处理事件，但我将集中关注我认为最容易问题的输入事件。


    在设置和使用事件处理程序方面，需要理解几个概念。这些包括：


    - 设置处理程序

    - 理解事件处理的顺序，包括捕获阶段与冒泡阶段的概念

    - 通过多个处理程序控制事件的传播


    # 设置事件处理程序


    你可以使用多种方法为元素分配事件处理程序。这些方法各不相同，并在下文中进行了详细介绍。这些方法包括：


    1. element.attach(): 仅限 IE8 及早期版本

    2. HTML 分配：如 <div onclick="doSomething()">


    3. 直接从 JavaScript 赋值：如 element.onclick=doSomething;

    4. element.addEventListener: 适用于所有浏览器，IE9 及更高版本。这是推荐的方法，因为它将代码与 HTML 分离，并且具有更高的灵活性。


    # 事件处理的顺序


    你需要关注的事件处理顺序有三种：


    1. 同一元素上同一事件的多个处理程序。

    2. 同一元素上针对不同事件的多个处理程序。

    3. 不同元素上同一事件的多个处理程序。


    你可以为同一个元素上的同一个事件分配多个处理程序。你需要意识到你的浏览器是如何处理这些多个处理程序的。


    - 元素上同一事件的多个处理程序。你可以为同一个事件分配两个或多个处理程序，例如两个 onClick 处理程序。它们应该按照分配的顺序触发，但我不会依赖此点。由于这样做可能产生歧义，我强烈建议不要这样做。你这纯同于在自找麻烦。


    - 同一元素上不同事件的多个处理程序。当你点击元素或按下按键时，事件的触发有一个标准的顺序。在分配处理程序时，你需要意识到这一点。标准鼠标事件的顺序是：


    1. mousedown

    2. mouseup

    3. click

    4. submit（如果适用）


    - 键键事件的顺序是：

    1. keydown

    2. keypress

    3. keyup


    - 不同元素上同一事件的多个处理程序。每个文档通常由一系列嵌套元素组成，从 BODY 标签开始并经过你的 DOM。你可能有一个包含其他 DIV 元素、SPAN
    元素或 FORM 元素的 DIV。当你在元素上创建一个事件（例如点击事件）时，浏览器会从两个方向处理 DOM，将事件传递给任何已分配的处理程序。首先，在捕获阶段，事件将从顶层最外层元素移动到被操作的元素。一旦到达该元素，它就会冒泡到最外层的顶层元素。这些元素上的任何该事件的处理程序都将被执行。


    然而，情况比这复杂。所有的常规处理程序只在冒泡阶段起。然后你会获得在捕获阶段创建的任何事件。查看捕获阶段只有方法，就是使用 `addEventListener`
    方法分配处理程序时指定正确的参数。此方法在 IE8 及早期版本以外的所有浏览器中均有效。


    # 事件传播


    事件遵循上述的捕获和冒泡阶段自动传递给父元素和子元素。如果你不想要这种默认行为，必须向事件处理程序中添加方法来停止传播。你会看到从事件处理程序内部调用的几种方法来停止或控制事件的处理或传播。理解这些方法之间的区别至关重要，因为很容易用错方法。


    - event.stopPropagation(). 这停止当前事件的传播，对其他可能具有处理程序的事件没有影响。这在捕获和冒泡阶段都有效。如果你在 DOM
    树顶部元素上注册作为捕获处理程序的事件处理程序中使用 stopPropagation()，事件将永远不会到达任何其他处理程序。


    - event.cancelBubble = true. 这的作用与 stopPropagation 类似，但仅用于 IE8 及早期版本。如果你需要支持这些浏览器，你需要处理这两种方法。


    - preventDefault(): 这仅用于取消事件的默认操作。你可能希望在提交按钮上设置一个事件处理程序，用以检查错误情况并在实际提交表单之前确保所有字段已填写。并不是所有事件都是可以取消的，但你可以检查事件的
    `cancelable` 属性来确定其适用性。preventDefault 方法并不会阻止事件的传播。你仍然需要使用其中之一。


    '
