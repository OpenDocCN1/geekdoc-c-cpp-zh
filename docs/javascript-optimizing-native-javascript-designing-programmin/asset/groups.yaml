    \n在 JavaScript 中，你通常可以交替使用单引号或双引号。在某些情况下，你必须注意使用的是哪一种：\n\n- 1. 有时你必须在引号内部使用双引号，例如从\
    \ JavaScript 设置 HTML：\n  `var str = '<div style=\"left:10px;\">text</div>';` \n\
    \  在那里你必须用一种类型作为外部引号，另一种类型作为内部引号。对于这个例子，两种种方式都可以，但在创建 HTML 字符串时，通常使用单引号作为外部字符串引号更好。\n\
