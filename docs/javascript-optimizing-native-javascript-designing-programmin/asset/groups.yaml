    Appendix A: Interviewing • 153


    ## Interviewing


    The main impetus behind creating this book about programming was a wide layoff
    of the company where I had been working for a long time. Plus, for more than 15
    years. I was thrown into the job market for the first time in the running. I was
    now a few years older and competing with Millennials that grew up with the Internet.
    I had been programming JavaScript and HTML for a long time but I needed to ensure
    I was acquainted with the latest methods and re-acquainted with the job interview
    process. So while I was trying to land my new job, I started on this book. Unfortunately
    (for the book) but fortunately for me, I found a new job in a few months. I am
    finally finishing the book and have some comments about the interviewing process
    that might help someone else looking for a job.


    ## How to automatically be in the top 50% of candidates


    I have been on both sides of the interviewing process—asking for a job and also
    interviewing candidates for work at my company. I also talked to the people interviewed
    me as possible to see how I was doing and get advice for future interviews. I
    was continually surprised how unprepared a large number of candidates were. So,
    independent of technical knowledge required for the new position, I have a number
    of Do''s and Don''ts that should get you into the top 50% or more of all candidates.
    At minimum, following these suggestions should keep you in the running. They may
    sound obvious to you but it is surprising how many candidates do not follow them.
    And these have nothing to do with your skills related to the new position.


    - **Be on time!** Be late and in the door with two strikes on one. Get early to
    make sure you have the correct building and room...and it shows you are aware.

    - **Resumé.** Bring extra copies of your resume. Some interviewers may have lost
    their copy. You may also want to alter your résumé to make it job-specific.

    - **Dress.** Dress neatly appropriately for the type and location of job. This
    may take a little research but it is better to be overdressed than underdressed
    as the saying goes. If nothing else, it shows respect for the interviewer.

    - **Greeting.** Shake hands with a firm grip and look the other person in the
    eye.

    - **Talking.** When you talk, be clear, upbeat, and positive. And speak slowly.
    Listen carefully to the question but do not be afraid to ask the interviewer to
    clarify any question. This shows you are paying attention and actually understand
    the area in question.


    ## JavaScript • Optimizing Native JavaScript


    - **Answering.** Take your time answering questions. It makes you look like you
    are carefully considering your answer (and gives you more time to come up with
    the best answer). There is nothing wrong with a pause in the conversation.

    - **Writing.** If you have to write, write neatly.

    - **Cell phone.** Turn your cell phone off. Don''t even think about looking at
    it during an interview, much less answering it. No text messages either. Nothing
    will show lack of respect to your interviewer more than this.

    - **Do your homework.** Find everything you can about the company where you are
    interviewing. You can find lots of information online, at your website, and on
    financial websites. Make a folder for each job you are interviewing for and fill
    it with as much information as you can.

    - **What job is this?** Know the requirements for the job you are interviewing
    for. I am flabbergasted that some candidates don''t know what job they are applying
    for.

    - **Give examples.** Be careful not to take credit for something you did not do.
    But try to use specific examples of how you solved problems from your past.

    - **Know yourers.** If possible, get to know the people who will be interviewing.
    You can go to LinkedIn and get their bios and pictures if they have been posted.
    It will always be helpful to know their background and skill set. And you may
    find common interest in hobbies, sports, or schools. Put that information in your
    folder.

    - **What happened?** Be prepared for some personal questions about why you left
    your last job, what did you like or not about, how you work with other people,
    what are your strong and weak points, etc. These are independent of the technical
    job skills but are as important for most jobs as you will be working with other
    people. Rehearse your answers ahead of time. Your answers here get you the job
    or keep you out of the running.

    - **If you can''t say something...** Don''t ever badmouth a previous employer
    or any employee. Be prepared with a positive response to any questions about your
    previous jobs.

    - **Benefits.** Try to avoid talking about salary or benefits, at least for the
    first interviews. These questions can come later if you are still in the running.
    You can kill your chances early if you are asking how many days you can work at
    home or how much vacation you get.

    - **Questions!** You are interviewing as well. You are making a decision about
    what you will be for years that will have a huge impact on your life. You need
    to find out as much as you can the company itself and the people who work there.
    Ask direct questions about advancement opportunities and the corporate vision.
    You may decide that even though they want you, you do not want to work there.
    Plus, if you ask questions, interviewers will treat that as a negative–they want
    to inquire.

    - **Follow up.** A polite e-mail to the interviewer will keep your name in front
    of the interviewer and shows them that you are interested. I got feedback from
    some


    Appendix A: Interviewing • 155


    - **Interview often.** Interview as many times as you can. You don''t want to
    waste an interviewer''s time. I know first interviews were disasters until I got
    more experience. Plus it seemed I learned something from every interview or discovered
    an area I need to study.

    - **Practice.** Practice answering questions ahead of time, including writing
    down solutions to programming problems. Answer questions out loud. You want to
    get used to speaking slowly and clearly.


    ## Answering technical questions


    Now we get how to respond to the technical side of the interview that probes your
    knowledge required for the job. I believe what is more important than answers
    is how you reason through the problem. In this age of having every answer available
    in seconds, remembering every function is not as important as knowing how to identify
    what is attempting to solve and then designing a solution. The most important
    things to keep in mind when handling this part of the interview include:


    - **Clarify the question.** Make sure you clarify the question if it is unclear
    at all. Don''t be afraid to ask questions so you understand the problem enough
    that you don''t have to answer it.

    - **Verbalize your solution.** The way you approach a programming problem is often
    more important than the exact details. An interviewer normally won''t penalize
    you if you forget the format of a method yet you explain what the function is
    doing.

    - **Taking talking.** Don''t sit there unless you run into a problem. Talk your
    way through it. Often you may not have to finish answering the question if your
    logic and reasoning is correct. It is easy to have ''stage fright'' particularly
    if you haven''t interviewed in a while. Verbalizing the problem sometimes helps
    you come up with the right answer, and so tells the interviewers (and sometimes
    they may help you.)

    - **Don''t make something up.** If you don''t know the answer to something, don''t
    make one up. If you can''t remember the name of a method, just say so. You could
    say something: "I haven''t had to do that but I can see how it would be important.
    Let me see...I think this..."

    - **Be prepared.** Do your homework ahead of time. Make sure you study all the
    areas you think will be covered in each interview. That is another reason it is
    important to know about each company and each job ahead of time that will influence
    your areas of concentration.

