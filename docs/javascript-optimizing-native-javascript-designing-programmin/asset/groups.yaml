    ```\n\n![](img/10c5df588c0c6e2580324246d7b5735f_41_0.png)\n\n| | Safari | Chrome\
    \ | Firefox |\n|---|---|---|---|\n| 1. (!varA) | 697 | 612 | 1,048 |\n| 2. (varA\
