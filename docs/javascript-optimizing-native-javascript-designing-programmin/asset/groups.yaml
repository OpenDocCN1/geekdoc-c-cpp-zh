    Test 3-8: http://www.nativejavascript.com/tests/Test-ConcatenatingStrings.html


    The methods were mainly consistent across browsers though there were differences
    in the test results. There are some lessons we learned to here:


    +   * Using str++ or str+ performed better than using arrays or .concat to add
    new text. However, if you look at the memory usage, the story is reversed. Granted,
    most of the extra memory used will be garbage collected but you really want to
    try to avoid creating garbage in the first place. Depending on the browser and
    the strings that are concatenated, you may see the memory usage using str+ or
    str+str double or more using that arrays.


    +   * You should also minimize the memory of additive operations. On some browsers,
    it will be faster to add the string "abc" to add "a" + "b" + "c".


    # # Regular expressions


    Regular expressions can work almost like magic to find or replace text in strings.
    Entire books have been written about the use of regular expressions, in programs
    ranging from Microsoft Word to JavaScript. I am not going to go into any detail
    about how to construct individual regular expressions as there are so many resources.
    In general, you can use them for finding or replacing specific patterns inside
    other strings. You can use them to validate input fields like phone numbers or
    zip codes, or to filter text on matching fields. They can be incredibly powerful
    but also incredibly confusing. If you choose to use them, make sure you comment
    your code so others will know what the expression is doing.'
