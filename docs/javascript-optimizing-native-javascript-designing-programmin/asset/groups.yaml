    JavaScript ，并能够编写简单的页面。对于更高级的 JavaScript 程序员，有很多优秀的参考书籍可以选择。


    我的很多经验是在 CPU 性能和内存（RAM）有限的顶盒设备上，因此编写简单快速的 JavaScript 是至关重要的。但同样的概念也适用于更快的 PC 浏览器和内存更大的移动设备：就像计算中的其他所有事物一样，额外的速度和内存会迅速被更大的图片、视频和
