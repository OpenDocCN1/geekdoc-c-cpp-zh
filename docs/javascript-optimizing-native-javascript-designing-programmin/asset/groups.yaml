    the decompression and actual display of the image. If you have a display that
    handles a lot of images that the user can scroll through, you may want to speed
    up the image display as much as possible. Images that are off-screen or hidden
    may take longer to display when you want them on screen. One option is to add
    to each image border of a few pixels that is transparent (if the image is a png
    or gif), or colored to match the background. Then, display the images that will
    be displayed next positioned to be actually 1 or 2 pixels on the screen. This
    will force the browser to decompress and actually display the image before the
    user swipes it onto the screen.'
- md: "\n# CSS Techniques\n\nYou can use Cascading Style Sheets (CSS) to format your\
    \ HTML displays. With the release of CSS 3, your applications can now take advantage\
    \ of many powerful features that add animation, drop shadows, and more display\
    \ control for mobile devices. This chapter is not a CSS reference manual or a\
    \ detailed description of each CSS property but rather a collection of some general\
    \ comments about common CSS uses and problems.\n\n# Including CSS in your application\n\
    \n- Adding your CSS definitions inside `<style></style>` tags in your HTML. These\
    \ would have to be repeated inside each HTML file the definitions are used.\n\n\
    - Put your CSS definitions in a separate CSS file that you include your HTML by\
    \ specifying something similar to the following inside your head. This allows\
    \ one CSS definition file to be used by multiple HTML files and load faster as\
    \ it will be cached after the first access, but you will have to include a reference\
    \ to this in each of your HTML files.\n\n```html\n<link rel=\"stylesheet\" href=\"\
    index.css\" type=\"text/css\">\n```\n\n- Load an external CSS file from your JavaScript\
    \ code using an XMLHttpRequest method. This may be useful if you want to download\
    \ loading files, or if the CSS is only needed some of the time, or if you need\
    \ to load different CSS files based on value available at runtime. You may have\
    \ subdirectories of CSS organized by theme or company and may want to select which\
    \ ones to load.\n\n- Include the necessary CSS properties directly inline in the\
    \ HTML tags. This is generally not recommended as it doesn't allow the display\
    \ to be separated from the data and styles cannot be shared but are actually overridden.\n\
    \n- Use JavaScript to assign style attributes or classes to specific elements.\n\
    \n# Position property\n\nIn laying out your screens, you need to decide if you\
    \ are going to use absolute positioning or rely on letting the normal flow determine\
    \ the position of the elements. In designing phone applications, I usually rely\
    \ on absolute positioning to ensure text and graphics up properly. Websites or\
    \ apps that contain more random data may do better to use static or relative positioning.\
    \ One advantage of absolute positioning is that the entire document does not have\
    \ to reflow if you move one element.\n\n- **static (default)**: The element is\
    \ positioned in the position determined by the normal flow of the page.\n- **relative**:\
    \ You can set left or top values to move the element relative to its normal flow\
    \ position. The original position and size is used for positioning the next static\
    \ or relative element.\n- **absolute**: Specifying a top and left value positions\
    \ the element at this position relative to its container. It does not affect how\
    \ static or relative elements are positioned.\n- **fixed**: Specifying a top and\
    \ left value fixes the element's position in the window and the parent container.\
    \ This is useful for menus and lists that you don't want to move when the user\
    \ scrolls.\n- **inherit**: Inherits the position property of the element's parent.\n\
    \n# Display property\n\nUse the display property to select the type of \"box\"\
    \ the element is displayed. It also has an important use when set to \"none\"\
    \ in removing the element from the display layout.\n\n- **inline (default)**:\
    \ Displays the element inline inside the current block using the width of the\
    \ content, similar to a `<span>` tag.\n- **block**: Displays the element as a\
    \ block with a specified height and width, like a `<p>` tag.\n- **inline-block**:\
    \ Displays the element inline but treats as a block.\n- **none**: Removes the\
    \ element from the DOM display tree. This can be used to update the removed element\
    \ without forcing a reflow, or to temporarily remove elements to \"light up\"\
    \ the DOM for better performance.\n- **Others**: There are a number of other options\
    \ which may not work on older browsers, such as: table-cell, run-in, list-item,\
    \ inline-table. See CSS documentation for more details. Since the use of `<table>`\
    \ on anything other than a table of data is discouraged, the use of some table\
    \ display properties (like `table-cell`) can solve some of your UI problems like\
    \ vertical alignment.\n\n# Setting style properties using JavaScript\n\nThere\
    \ are several ways to change the style of elements from JavaScript. Each have\
    \ their uses, advantages, and disadvantages. It is important to design your UI\
    \ pages to minimize the amount of style manipulation. The most common reason to\
    \ set individual properties (directly or using `cssText`) when you need to do\
    \ this dynamically from your JavaScript code to set a new position or color property.\
    \ These methods include:\n\n- Assigning a new class or classes using `className`.\
    \ This is usually the fastest method to change styles and update style properties.\
    \ Any individual property that has already been assigned (using `cssText` or `style=`)\
    \ will not be overridden but still have precedence.\n\n- Assigning a new class\
    \ using `classList`. The classList property has add and remove methods that can\
    \ be used to change classes.\n\n- Append a new class to the existing `className`.\
    \ This uses the '+' operator to append a new class to the element. Be sure to\
    \ include a blank before each class.\n\n- Assigning individual style attributes.\
    \ This is most useful when you have a variable value you must assign from JavaScript,\
    \ such as a position or color. Depending on how many attributes you must assign,\
    \ it is usually faster than `cssText`.\n\n- Assigning multiple attributes using\
    \ `cssText`. `cssText` allows you to read or set multiple attributes in one command.\
    \ You would think it would be faster than assigning the properties individually,\
    \ but is usually slower on Firefox. It clears any previous properties assigned\
    \ using style.\n\nSetup for performance tests below:\n\n```css\n.classOne {\n\
    \  left: 10px;\n  color: #ff9900;\n}\n.classTwo {\n  top: 10px;\n  height: 10px;\n\
    }\n```\n\n| | | Safari | Firefox |\n| :--- | :--- | :--- | :--- |\n| 84 JavaScript:\
    \ Optimizing Native JavaScript | | | |\n| 86 JavaScript: Optimizing Native JavaScript\
    \ | | | |\n| 1. element.className = \"classOne\"; | | | |\n| 2. element.className\
    \ += \"classTwo\"; | | | |\n| 3. element.add(\"classOne\"); | | | |\n| 4. element.className\
    \ += \"classTwo\"; | | | |\n| 5. element.style = \"10px\"; | | | |\n| 6. element.style.cssText\
    \ = \"left:10px;color:#ff9900;height:10px;\"; | | | |\n| 7. element.className\
    \ = \"classOne\"; | | | |\n| 8. element.className += \"classTwo\"; | | | |\n\n\
    # 86 JavaScript: Optimizing Native JavaScript\n\nThe fastest method of assigning\
    \ style properties will be using `className` and assigning multiple classes at\
    \ the time. NOTE: When you use `cssText` to set properties, it will remove all\
    \ properties previously assigned using `style` except for Firefox.\n\n# CSS selectors\n\
    \nMany properties are inherited from their parent elements but not all are. You\
    \ need to refer to a CSS reference if you are unsure about a specific property's\
    \ inheritance. The order that CSS rules are applied to your elements is determined\
    \ by their specificity. You need to be careful when you design your HTML that\
    \ you avoid specificity problems or incorporate them into your design. Browsers\
    \ use the CSS selectors that might apply to each element. When multiple selectors\
    \ have equal specificity, the latest declarations apply. Rules that are applied\
    \ directly to an element take precedence over inherited rules. The following list\
    \ shows the general precedence order, from least to most specific:\n\n1. Universal\
    \ `*` selector\n2. Pseudo elements and type selectors\n3. Class selectors and\
    \ pseudo classes\n4. ID selectors\n5. Inline styles on element (this one wins!)\n\
    \n# Overwriting style using the important rule\n\nStyles declared with the addition\
    \ of `!important` will override other declarations. Generally, you should avoid\
    \ using `!important` and instead structure your CSS so that is not required, though\
    \ that may always be possible. There are many articles, books, and websites (and\
    \ they are) explaining the rules of CSS. If the rules are complicated, my suggested\
    \ approach would be to avoid relying on stable interactions of CSS rules and focus\
    \ on making simple CSS rules that are as specific as possible as often. This avoids\
    \ interactions that may be difficult to trace and debug, and actually improve\
    \ performance.\n\n# Descendant selectors\n\nDescendant selectors are multiple\
    \ selectors defined together, such as:\n\n```css\n.class1 .class2 (props... )\n\
    ```\n\nYou can chain all types of selectors—including element, class, and type.\
    \ It is a feature of CSS and can be leveraged to make your CSS easier to assign.\
    \ Some CSS compilers (like LESS) also produce this kind of CSS output by allowing\
    \ you to nest CSS definitions. However, I recommend against use of this style\
    \ for several reasons:\n"
  mdcn: "\n\n# CSS 技术\n\n你可以使用层叠样式表（CSS）来格式化你的 HTML 显示。随着 CSS 3 的发布，你的应用程序现在可以利用许多强大的功能，为移动设备添加动画、阴影和更多的显示控制。本章节不是\
    \ CSS 参考手册，也不是对每个 CSS 属性的详细描述，而是关于常见 CSS 用法和问题的某些通用注释的集合。\n\n# 在你的应用程序中引入 CSS\n\
    \n-   将你的 CSS 定义放在 HTML 中的 `<style></style>` 标签内部。这必须在每个使用这些定义的 HTML 文件中重复这些定义。\n\
    \n-   将你的 CSS 定义放在单独的 CSS 文件中，通过在 HTML 的 `head` 标签内指定类似于下面的内容来引入。这允许一个 CSS 定义文件被多个\
    \ HTML 文件使用，并且由于在首次访问后会被缓存，加载速度更快，但你必须在每个 HTML 文件中包含该引用。\n\n```html\n<link rel=\"\
    stylesheet\" href=\"index.css\" type=\"text/css\">\n```\n\n-   在 JavaScript 代码中通过\
    \ `XMLHttpRequest` 方法加载外部 CSS 文件。如果你想下载加载所需文件、或者 CSS 仅在某些时候需要，或者你需要根据运行时可用的值加载不同的\
    \ CSS 文件，这种方法可能很有用。你可能有按主题或公司组织的 CSS 子目录，并可能想要选择加载哪些目录。\n\n-   将必要的 CSS 属性直接内联在\
    \ HTML 标签中。这通常是不建议的，因为这无法让显示与数据分离，且样式无法共享，而实际上会被覆盖。\n\n-   使用 JavaScript 为特定元素分配样式属性或类（class）。\n\
    \n# Position 属性（定位）\n\n在布局你的屏幕时，你需要决定是使用绝对定位，还是依靠正常流来决定元素的位置。在设计手机应用程序时，我通常依赖绝对定位以确保文本和图形正确对齐。包含更多随机数据的网站或应用程序使用静态或相对定位可能更好。绝对定位的一个优势是，当你移动一个元素时，整个文档不需要重流（reflow）。\n\
    \n-   **static（默认）**：元素位于由页面正常流决定的位置上。\n-   **relative**：你可以设置 `left` 或 `top`\
    \ 值，以相对于其正常流位置移动元素。原始位置和大小将用于为下一个静态或相对元素进行定位。\n-   **absolute**：指定 `top` 和 `left`\
    \ 值，将元素相对于其容器放置在此位置。它不会影响静态或相对元素的定位。\n-   **fixed**：指定 `top` 和 `left` 值将元素的位置固定在窗口和父容器中。这对于你不希望在用户滚动时移动的菜单和列表很有用。\n\
    -   **inherit**：继承父元素的定位属性。\n\n# Display 属性（显示）\n\n使用 `display` 属性来选择元素显示的“框”类型。它在设置为\
    \ \"none\" 时在从显示布局中移除元素方面也具有重要用途。\n\n-   **inline（默认）**：使用内容的宽度在当前块内内联显示元素，类似于\
    \ `<span>` 标签。\n-   **block**：以指定的高度和宽度作为块级显示元素，类似于 `<p>` 标签。\n-   **inline-block**：内联显示元素，但将其视为块级。\n\
    -   **none**：将元素从 DOM 显示树中移除。这可以用于在不强制重流的情况下更新移除的元素，或临时移除元素以“点亮” DOM 以获得更好的性能。\n\
    -   **Others**：还有许多其他选项在旧版浏览器中可能不起作用，例如：`table-cell`, `run-in`, `list-item`, `inline-table`。更多细节请参见\
    \ CSS 文档。由于避免在使用数据表格以外的地方使用 `<table>`，某些表格显示属性（如 `table-cell`）可以解决某些 UI 问题，如垂直对齐。\n\
    \n# 使用 JavaScript 设置样式属性\n\n有几种方法可以从 JavaScript 修改元素的样式。每种方法都有其用途、优缺点。设计 UI 页面以尽量减少样式操作是非常重要的。设置单个属性（直接设置或使用\
    \ `cssText`）的最常见原因是，当你需要从 JavaScript 代码中动态执行此以设置新的位置或颜色属性时。这些方法包括：\n\n-   使用 `className`\
    \ 分配新类或多个类。这通常是更改样式和更新样式属性最快的方法。已分配（使用 `cssText` 或 `style=`）的任何单个属性将不会被覆盖，但仍然具有优先级。\n\
    \n-   使用 `classList` 分配新类。`classList` 属性具有 `add` 和 `remove` 方法，可以用于更改类。\n\n- \
    \  向现有的 `className` 附加新类。这使用 `'+'` 运算符向元素追加一个新类。确保在每个类之前包含一个空格。\n\n-   分配单个样式属性。当你有一个必须从\
    \ JavaScript 分配的变量值时（如位置或颜色），这种最有用。取决于你必须分配的属性数量，它通常比 `cssText` 快。\n\n-   使用 `cssText`\
    \ 分配多个属性。`cssText` 允许在一条命令中读取或设置多个属性。你可能认为它比单独分配属性更快，但在 Firefox 上通常较慢。它会清除之前使用\
    \ `style` 分配的任何属性属性。\n\n以下是性能测试的设置：\n\n```css\n.classOne {\n  left: 10px;\n  color:\
    \ #ff9900;\n}\n.classTwo {\n  top: 10px;\n  height: 10px;\n}\n```\n\n| | | Safari\
    \ | Firefox |\n| :--- | :--- | :--- | :--- |\n| 84 JavaScript: Optimizing Native\
    \ JavaScript | | | |\n| 86 JavaScript: Optimizing Native JavaScript | | | |\n\
    | 1. element.className = \"classOne\"; | | | |\n| 2. element.className += \"classTwo\"\
    ; | | | |\n| 3. element.add(\"classOne\"); | | | |\n| 4. element.className +=\
    \ \"classTwo\"; | | | |\n| 5. element.style = \"10px\"; | | | |\n| 6. element.style.cssText\
    \ = \"left:10px;color:#ff9900;height:10px;\"; | | | |\n| 7. element.className\
    \ = \"classOne\"; | | | |\n| 8. element.className += \"classTwo\"; | | | |\n\n\
    # 86 JavaScript: Optimizing Native JavaScript\n\n分配样式属性的最快方法将是使用 `className` 并在一次时分配多个类。注意：当你使用\
    \ `cssText` 设置属性时，除了 Firefox 之外，它将移除所有之前使用 `style` 分配的属性。\n\n# CSS 选择器\n\n许多属性从其父元素继承，但并非所有属性都是。如果你不确定特定属性的继承情况，需要参考\
    \ CSS 参考。CSS 规则应用到元素的顺序由它们的特殊性（specificity）决定。在设计 HTML 时你需要小心，以避免特殊性问题或将其纳入你的设计中。浏览器使用可能应用于每个元素的\
    \ CSS 选择器。当多个选择器具有相同的特殊性时，最新的声明将生效。直接应用于元素上的规则优于继承规则。以下列表显示了通用优先级顺序，从低到高：\n\n\
    1.  通用 `*` 选择器\n2.  伪元素和类型选择器\n3.  类选择器和伪类\n4.  ID 选择器\n5.  元素上的内联样式（这一个胜出！）\n\
    \n# 使用 important 规则覆盖样式\n\n带有 `!important` 标记声明的样式将覆盖其他声明。通常，你应该避免使用 `!important`，而是通过结构化你的\
    \ CSS 使其不需要它，尽管这可能永远可行。有许多文章、书籍和网站（它们确实存在）在解释 CSS 的规则。如果规则很复杂，我建议的方法是避免依赖 CSS\
    \ 规则的稳定交互，并专注于编写尽可能具体的简单 CSS 规则。通常这样可以避免可能难以追踪和调试的交互，并且实际上可以提高性能。\n\n# 后代选择器\n\
    \n后代选择器是一起定义的多个选择器，例如：\n\n```css\n.class1 .class2 (props... )\n```\n\n你可以链联所有类型的选择器——包括元素、类和类型。这是\
    \ CSS 的一项功能，可以利用它让你的 CSS 更容易分配。某些 CSS 编译器（如 LESS）通过允许你嵌套 CSS 定义也产生这种 CSS 输出。然而，由于几个原因，我不建议使用这种样式：\n\
    \n"
