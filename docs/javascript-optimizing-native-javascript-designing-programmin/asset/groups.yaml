  mdcn: "\n\n## 160 • JavaScript: 优化原生 JavaScript\n\n苍蝇飞过去了吗？复杂的答案将涉及计算苍蝇旅程的每一段并将其相加。简单的答案是只需要计算出两列火车将在\
    \ 1 小时后相撞，而期间苍蝇会飞行 75 英里，这便是答案。\n\n- 仔细听每一个问题。有些问题是陷阱性问题，需要你仔细检查问题中的每一个词，以确保你没有对问题或问题中的任何词做出任何假设。接下来的问题属于这一类。\n\
    \n涂 747 飞机的机翼需要多少桶油漆？如果你假设“桶”意味着 1 加仑（这在美国很常见），那么你将尝试弄清楚机翼有多大，以及每加仑能覆盖多少平方英尺。或者，由于问题没有问需要多少加仑油漆，你可以说“1桶——如果足够的话”。\n\
    \n# FizzBuzz\n\n我在我最早的面试之一遇到了它。由于我没有做功课，而且已经多年没有面试了，这对我来说很新鲜。这个问题是编写一个程序，接受一个数字并返回以下内容之一：\n\
    \n- 如果数字能被 3 整除，返回 'Fizz'\n- 如果数字能被 5 整除，返回 'Buzz'\n- 如果数字能被 5 整除，返回 'FizzBuzz'\n\
    - 否则返回该数字\n\n解决这个问题有很多方法。我很关于这个练习的行注释数量感到惊讶，注释提到许多申请者在编写代码方面有困难。这里有几个重要点需要注意：\n\
    \n- 任何语言的任何编程职位候选人都应该能够给出快速答案，即使它不是优化的。\n- 最重要的问题（至少对于 JavaScript 面试但可能对其他面试也是如此）是你关于优化的追问。针对不同的目标有几种优化答案的方法，探测候选人对这些问题的知识和解决方案是非常重要的。这包括关于优化与创建垃圾回收的问题。下面的一种解决方案在计算中没有创建临时字符串，但它并不是最快的。\n\
    \n```javascript\nvar fizzbuzz = {\n  str: ['',','Fizz','Buzz','FizzBuzz'],\n \
    \ get: function (num) {\n    var a = (i%3) ? 0 : 1;\n    a = (i%5) ? a : (a +\
    \ 2);\n    return (a) ? str[a] : i;\n  }\n};\n```\n\n![](img/10c5df588c0c6e2580324246d7b5735f_166_0.png)\n\
    \n# 示例问题\n\n这些是我被问过或看起来相当常见的随机问题。你可以在互联网上找到更多示例，但类似的解决方案适用于其中许多问题。许多问题可能有可行的暴力破解解，但可能非常耗时或效率低下。你始终需要注意并尝试寻找更高效的解决方案。记住，在寻找解决方案或在黑板上写代码时要保持交流。有些问题可能涉及大\
    \ O 计算。\n\n# 寻找数组中的最小值和最大值\n\n你给你一个随机数数组，要求找到最小的数字。你可以遍历数组检查每个数字，但下面显示了单行解决方案。\n\
    \n```javascript\nvar arrNumbers = [1,4,7,3,5,9,3,2];\nMath.max.apply(null, arrNumbers);\
    \ // 9\nMath.min.apply(null, arrNumbers); // 1\n```\n\n# 反转字符串中的字符\n\n这个问题给你一个字符串并要求你反转字符顺序。同样，你可以写一个循环使用替换来构建新字符串，或者你可以记住字符串可以表示为每个元素一个字符的数组，并使用如下内容：\n\
    \n# 寻找后代\n\n通常，仅仅问题本身就可以指向一个更高效的答案。我得到一个问题，判断在多级树中 B 是否是 A 的后代。我想象了一个递归程序，获取 A\
    \ 的所有孩子，然后是他们所有的孩子，依此类推，直到我找到元素 B。我意识到，我只需要反过来这样做就能快速得到答案。从 B 开始并向上追踪链条，看是否到达了\
    \ A。问题被重写为“A 是 B 的祖先吗”。\n\n# 字符串数组中最长公共前缀\n\n这要求你找到字符串数组中的最长公共前缀，如：\n\n```javascript\n\
    var arr = [\"abcdef\", \"abc\", \"abcd\"];\n```\n\n有很多方法通过遍历列表并比较每个字符串的开头来解决。然而，一种优雅且可能更高效（取决于排序方法）的方法简单是将数组排序，然后比较第一个和最后一个元素，看看有多少字母是匹配。\n\
    \n# 寻找缺失的数字\n\n这个问题涉及一个从 1 到 100 的随机数数组，但只缺少了一个数字。找到缺失数字的最佳方法是什么？最好的解决方案涉及考虑你的解决方案的\
    \ Big O 表示法后果。如果你遍历数组并创建一个新的标记数组，你将需要再次遍历新数组以确定哪个数字缺失了。这本质上导致了 O(2n) 的解决方案，意味着你可能需要再次遍历所有\
    \ 100 条记录（直到你找到缺失的数字为止）。为了提高效率，你可以执行以下操作：\n\n1. 计算所有 100 个数字的总和将会是多少\n2. 从总和中减去数组之和\n\
    3. 结果就是缺失的数字\n\n# 附录 B：UI 设计\n\n与程序员（设计屏幕、制作图形、选择颜色的人）紧密合作至关重要。如果他们了解足够的 JavaScript/HTML/CSS\
    \ 以便在设计屏幕时做出正确的决策，将非常有帮助。根据我的经验，糟糕的情况（其他没有设计师）是有一个在真空环境中设计 Photoshop 的团队，然后将多层\
    \ PSD 交给无助的程序员。没有理由设计师不能为你提供正确的 CSS 和最终图像文件。记住，并不是所有的 Photoshop 设计都能直接转换为 CSS（例如渐变），在某些情况下，程序员将花时间转换所有其他属性。\n\
    \n设计师还必须熟悉程序的逻辑流。整个应用程序必须经过仔细考虑，并在设计 UI 时考虑到所有的边界情况。\n\n# 通用目标\n\n在设计时你应该记住的一些基本原则。它们包括：\n\
    \n- 清晰：你的界面应该是清晰且简单的。\n- 限制选项：超过 6 个选择会让用户感到困难。\n- 一致性：所有屏幕应该具有相似的外观和感觉。\n- 明显易用：元素的操作方式应该是清晰的。\n\
    - 明显的错误或警告：处理所有错误情况。对于预期的错误，给出的解决方案。\n- 为所有用户操作提供反馈：按钮会变化，屏幕在激活时应该变暗。\n- 当应用程序加载、等待或思考超过一秒时，显示进度指示。\n\
    - 在需要的地方提供在线帮助。\n- 保持界面尽可能扁平用户不容易迷。\n\n# 边界情况\n\n在你设计和调试界面时，你会看到并听到“边界情况”或“边缘情况”。这些是在出现异常情况或用户以未使用的方式调用某些函数或多个函数时发生的问题。如果你确定这些情况很少发生或后果很小，很多时候可以推迟修复这些边界情况。然而，我见过许多\
    \ UI 设计因为忽略了边界情况而失败。\n\n"
