    \ conditions—one when the try statement fails and throws an error, and the other\
    \ when it does not. We compared using a try/catch method with a simple test for\
    \ undefined. There is a performance penalty for using try/catch so you should\
    \ only use it when you cannot control the error conditions that might arise, usually\
    \ when importing or reading data. Compilers will also not optimize functions that\
    \ contain try/catch statements. The tests that failed the step had extremely bad\
    \ performance.\n\nThe simple try/catch statement used in our test looks like:\n\
    \n```\ntry {\n  var a = newvar2;\n}\ncatch (e) {\n  var a = 2;\n}\n```\n\nThe\
    \ statement compared to this was:\n\n```\nvar a = (typeof(newvar2) != \"undefined\"\
    ) ? newvar2 : ;\n```"
- md: "\n# 56 + JavaScript: Optimizing Native JavaScript\n\n| PERFORMANCE TESTING\
    \ | Safari | Chrome | Firefox |\n|---|---|---|---|\n| 1. Inside try statement\
    \ - fail | 7 | 2 | 3 |\n| 2. No try statement - fail | 9,892 | 70 | 9,929 |\n\
    | 3. Inside try statement - pass | 4,443 | 30,305 | 2,365 |\n| 4. No try statement\
    \ - pass | 49,228 | 30,660 | 32,263 |\n\nTest 3-15: http://www.javascript.com/tests/Test-TryCatch.html\n\
    \nUsing a regular array for 1,000,000 numbers takes up around 10,000,000 bytes\
    \ or 8 bytes per element. JavaScript usually stores the numbers as 64-bit numbers\
    \ and there are around 4 bytes per element. However, there are special types of\
    \ arrays that use a fixed number of bytes for each that might help you out. For\
    \ example, if you store your numbers in a `Int32Array`, you can reduce the memory\
    \ usages to around 4,000,000 bytes. If you can use a 16-bit array, the usage goes\
    \ down to 2,000,000 bytes. You will need to select the array type enough to hold\
    \ your expected values.\n\n- Try to use integer arrays as much as possible instead\
    \ of strings for many items, or even have a lookup indexed by an integer.\n- Use\
    \ the smallest fixed array size possible. You will save a lot of memory and have\
    \ better performance moving from 64 to 32 to 16 bits.\n- Declare and allocate\
    \ your arrays once when your application starts.\n- Use integer arrays as much\
    \ as possible instead of float arrays. Depending on your range of values, you\
    \ can multiply numbers by 10 or 100 to make them integers.\n\nBe aware of how\
    \ floating numbers are represented internally. This can cause computational errors.\
    \ Just look at what the following simple loop produces:\n\n```\nfor (var i=0;\
    \ i < 1; i+=1) {\n  console.log(i);\n}\n0.1\n0.2\n0.30000000000000004\n0.4\n0.5\n\
    0.6\n0.7\n0.7999999999999999\n0.8999999999999999\n0.9999999999999999\n```\n\n\
    # Types of fixed arrays\n\n| Name | Number of bytes | Type of number |\n|---|---|---|\n\
    | Int8Array | 1 | 8-bit signed integer |\n| Uint8Array | 1 | 8-bit unsigned integer\
    \ |\n| Uint8ClampedArray | 1 | 8-bit unsigned integer (clamped) |\n| Int16Array\
    \ | 2 | 16-bit signed integer |\n| Uint16Array | 2 | 16-bit unsigned integer |\n\
    | Int32Array | 4 | 32-bit signed integer |\n| Uint32Array | 4 | 32-bit unsigned\
    \ integer |\n| Float32Array | 4 | 32-bit floating point number |\n| Float64Array\
    \ | 8 | 64-bit floating point number |\n\nBesides saving memory, fixed arrays\
    \ can be populated after most browsers. It is a bit slower on Safari. There are\
    \ so many variables including the size of the fixed array and what numbers are\
    \ that you should test your experiment.\n\n| PERFORMANCE TESTING | OPS (bigger\
    \ is better) | | |\n|---|---|---|---|\n| 1. Populate regular array | 13,981 |\
    \ 3,947 | 6,182 |\n| 2. Populate Int16Array | 9,395 | 6,844 | 11,970 |\n\n> Test\
    \ 3-6: http://www.nativejavascript.com/tests/Test-FixedArray.html\n\n# Animation\
    \ performance\n\nAnimating elements of your interface, feels looking cool, it\
    \ is often important in noting what actions are taking place. You should use motion\
    \ to emphasize what is happening - clicking a right arrow should slide in the\
    \ next screen from the right, pressing a down arrow should slide the next page\
    \ up from the bottom of the screen, etc. This is very important compared to just\
    \ displaying the new screen. However, animations can be costly in terms of performance.\
    \ Try to avoid them if they are not needed and try to avoid animating elements\
    \ at the same time.\n\n# Image pre-caching\n\nIf your application images for your\
    \ interface or to display as part of user selections, you may want to consider\
    \ pre-caching them in order to speed up the display. This involves loading before\
    \ they are displayed and storing them in an Image object. Then, you can refer\
    \ to the object you want to actually display the image.\n\n```\nvar image = new\
    \ Image(480, 320); //width, height\nimage.src = \"1.jpg\";\n```\n\n# 58 JavaScript:\
    \ Optimizing Native JavaScript\n\n# Trimming blank spaces on strings\n\nThe newer\
    \ browsers support the trim method to remove blanks on both ends of strings. The\
    \ newer was not available before and you had to use a regular expression to trim\
    \ strings. The new method is faster than using a regex as the following test demonstrates\
    \ but you may need to add the regex if you need to support older browsers. The\
    \ regex that was compared:\n\n```\nvar y = x.replace(/\\s+|\\s+$/gm, '');\n```\n\
    \n| PERFORMANCE TESTING | Safari | Chrome | Firefox |\n|---|---|---|---|\n| Using\
    \ str.trim() | 8,076 | 11,058 | 18,351 |\n| Using regex | 5,727 | 4,211 | 3,290\
    \ |\n\nTest 3-17: http://www.nativejavascript.com/tests/TrimStrings.html\n\n#\
    \ Dangers of premature optimization\n\nIt is usually good to advise before premature\
    \ optimization. Get the general logic and program in place before spend time optimizing\
    \ certain areas or methods. You should concentrate on optimizing which are responsible\
    \ for the majority of processing. Use your debugging tools to determine which\
    \ functions are taking up the most time and concentrate on these areas. That said,\
    \ I believe it is a good idea to always try for speed. Once you learn the concepts,\
    \ you can write your code.\n\n# Infinite scrolling on non-touch\n\nTouch screens\
    \ normally have supporting swiping. There are a number of libraries that add iScroll\
    \ with great success. With just a few lines of code, I can make any list or collection\
    \ and it also allows me to independently scroll the list from touch-capable devices,\
    \ or mouse. If you need to add scrolling, or even infinite scrolling on discrete\
    \ interfaces, like set buttons, the following is the general approach for vertical\
    \ scrolling list, such as tapping up or down.\n\n# HTML\n\n1. Create clipping\
    \ element that is sized to display rows and position it in the proper place. It\
    \ should have property overflow:hidden;\n2. As child of DIV, create another DIV\
    \ that is sized to hold rows. Set its top value to a negative amount equal to\
    \ height. This results in hidden, while rows are shown.\n\n# JavaScript\n\n1.\
    \ Populate all rows with data so that the top row is in the second.\n2. When the\
    \ user presses a key, let's say down button, use your animation routines to smoothly\
    \ animate the inner DIV that holds all rows to end with height.\n3. Using a timer\
    \ or animation transitionend event, which fires after the DIV has moved, you need\
    \ to have a function that carry several operations. First, it should fill all\
    \ rows with new data, moving the data up. You can either copy the data from row\
    \ to row, or fill in anew from your data source. Then, reposition your inner DIV\
    \ so its top value is negative. These events will all happen at one time, so the\
    \ user will not detect the movement. You may want to optimize your routines using\
    \ setTimeout so that not immediately repopulate the grid if the user is pressing\
    \ the up or down arrow. With each press, you can increment the index of the first\
    \ row to display, but wait until the user has not pressed a key for 200ms before\
    \ you actually repopulate the data.\n\n> \"In theory, there is no difference between\
    \ theory and practice. But, in practice, there is.\" - Jan van de Sncheut\n\n\
    # 4 Objects\n\nJavaScript objects can be used to help organize and optimize your\
    \ code. JavaScript's object model is based on prototypes as opposed to class inheritance.\
    \ This means that you need to set up your objects differently than you do when\
    \ you create new objects or instances of objects. To understand how the prototype\
    \ chain works there are number of good books (like The Principles of Object-Oriented\
    \ JavaScript by Nicholas C. Zakas and Object-Oriented JavaScript by Stoyan Stefan)\
    \ and web articles about how objects work in JavaScript so I will not go into\
    \ detail here. Instead using complicated uses of objects in your applications,\
    \ I think you need to be very careful when using objects and prototypes in your\
    \ code as it can make your code slower and possibly harder to read. However, the\
    \ proper use of objects will help minimize the amount of code you need and provide\
    \ better protection of global name space.\n\n# Creating objects\n\nThere are several\
    \ ways to create and use objects in your applications. You need to select the\
    \ method that makes most sense for your needs. There is a difference in performance,\
    \ so you want to select the simplest and clearest method.\n\n- Plain object. This\
    \ uses the object constructor. This is the simplest but slower to construct an\
    \ object. All the properties are accessible on the copy You cannot use this to\
    \ create unique instances of objects since any copy will reference the original\
    \ object's values.\n\n```\nvar newObj = {\n  doThis: function () {},\n  doThat:\
    \ function () {},\n  propOne: 12\n};\n```\n\n- Regular object constructor. This\
    \ is the traditional constructor. This is very slow and is the slowest way to\
    \ construct new object instances on Chrome. Values can be passed in assign them\
    \ to properties of the new object. All items declared with this are available\
    \ on the object.\n\n```javascript\nfunction ObjectConstructor(val) {\n  this.type\
    \ = val || {};\n  this.doThis = function () {};\n  this.doThat = function () {};\n\
    \  this.propOne = 12;\n}\nvar newObj = new ObjectConstructor(5); // new instance\n\
    ```\n"
  mdcn: "\n\n# 56 + JavaScript: 优化原生 JavaScript\n\n| 性能测试 | Safari | Chrome | Firefox\
    \ |\n|---|---|---|---|\n| 1. try 语句内部 - 失败 | 7 | 2 | 3 |\n| 2. 无 try 语句 - 失败 |\
    \ 9,892 | 70 | 9,929 |\n| 3. try 语句内部 - 通过 | 4,443 | 30,305 | 2,365 |\n| 4. 无\
    \ try 语句 - 通过 | 49,228 | 30,660 | 32,263 |\n\n测试 3-15: http://www.javascript.com/tests/Test-TryCatch.html\n\
    \n使用普通数组来存储 1,000,000 个数字大约占用 10,000,000 字节，或者说每个元素 8 字节。JavaScript 通常将数字存储为 64\
    \ 位数字，每个元素大约占用 4 字节。然而，有一些特殊的数组类型每个元素使用固定字节数的这可能对你有所帮助。例如，如果你将数字存储在 `Int32Array`\
    \ 中，可以将内存占用减少到大约 4,000,000 字节。如果你可以使用 16 位数组，内存占用将下降到 2,000,000 字节。你需要选择足够以容纳你预期值的数组类型。\n\
    \n- 尽可能使用整数数组而不是字符串来处理许多项，甚至使用由整数索引的查找表。\n- 尽可能使用最小的固定数组大小。从 64 位到 32 位再到 16 位，将节省大量内存并获得更好的性能。\n\
    - 在应用程序启动时一次性声明并分配数组。\n- 尽可能使用整数数组而不是浮点数数组。根据你的数值范围，你可以将数字乘以 10 或 100 以变为整数。\n\
    \n注意浮点数在内部的表示方式。这可能会导致计算错误。看看下面这个简单循环的输出：\n\n```\nfor (var i=0; i < 1; i+=1) {\n\
    \  console.log(i);\n}\n0.1\n0.2\n0.30000000000000004\n0.4\n0.5\n0.6\n0.7\n0.7999999999999999\n\
    0.8999999999999999\n0.9999999999999999\n```\n\n# 固定数组的类型\n\n| 名称 | 字节数 | 数字类型\
    \ |\n|---|---|---|\n| Int8Array | 1 | 8 位有符号整数 |\n| Uint8Array | 1 | 8 位无符号整数\
    \ |\n| Uint8ClampedArray | 1 | 8 位无符号整数（限位） |\n| Int16Array | 2 | 16 位有符号整数 |\n\
    | Uint16Array | 2 | 16 位无符号整数 |\n| Int32Array | 4 | 32 位有符号整数 |\n| Uint32Array\
    \ | 4 | 32 位无符号整数 |\n| Float32Array | 4 | 32 位浮点数 |\n| Float64Array | 8 | 64 位浮点数\
    \ |\n\n除了节省内存外，固定数组在大多数浏览器中都可以填充。在 Safari 上速度稍慢。有许多变量，包括固定数组的大小和数值，因此你应该对你的实验进行测试。\n\
    \n| 性能测试 | OPS (越大越好) | | |\n|---|---|---|---|\n| 1. 填充普通数组 | 13,981 | 3,947 |\
    \ 6,182 |\n| 2. 填充 Int16Array | 9,395 | 6,844 | 11,970 |\n\n> 测试 3-6: http://www.nativejavascript.com/tests/FixedArray.html\n\
    \n# 动画\n\n让界面元素动画看起来很酷，但注意正在发生的动作通常是重要的 - 点击右箭头应该从右侧滑入新屏幕，按下向下箭头应该从底部向上滑入新页面，这与仅仅显示新屏幕相比非常重要。然而，动画在性能方面可能是昂贵的。如果不需要，请尝试避免同时动画元素。\n\
    \n# 预缓存\n\n如果为了你的应用程序界面或显示用户选择，你可能想要考虑预缓存它们以加速显示。这涉及到在显示之前加载并将存储在 Image 对象中。然后你可以引用实际想要显示的图像。\n\
    \n```\nvar image = new Image(480, 320); // width, height\nimage.src = \"1.jpg\"\
    ;\n```\n\n# 58 JavaScript: 优化原生 JavaScript\n\n# 裁剪字符串空格\n\n现代浏览器支持 `trim` 方法来移除字符串两端的空白。以前没有这种方法，你必须使用正则表达式来裁剪字符串。新方法比使用正则更快，但如果你需要支持旧浏览器，可能需要添加正则，如下测试所示：\n\
    \n```\nvar y = x.replace(/\\s+|\\s+$/gm, '');\n```\n\n| 性能测试 | Safari | Chrome\
    \ | Firefox |\n|---|---|---|---|\n| 使用 str.trim() | 8,076 | 11,058 | 18,351 |\n\
    | 使用正则 | 5,727 | 4,211 | 3,290 |\n\n测试 3-17: http://www.nativejavascript.com/tests/TrimStrings.html\n\
    \n# 过早优化的危险\n\n在过早优化某些区域或方法之前，通常建议先完成通用逻辑和程序。你应该使用你的调试工具确定哪些函数消耗了大部分时间，并集中在这些区域。尽管如此，我认为始终尝试加速是一个好主意。一旦你学会了这些概念，你就可以编写代码。\n\
    \n# 非触摸设备的无限滚动\n\n触摸屏幕通常支持滑动。许多库成功地添加了滚动。只需几行代码，我就可以让任何列表或集合在触控设备或鼠标上独立滚动。如果你需要添加滚动，甚至在离散界面上无限滚动，以下是垂直列表的通用方法，例如向上或向下。\n\
    \n# HTML\n\n1. 创建一个显示行的裁剪元素并将其放在正确的位置。它应该具有 `overflow:hidden;` 属性。\n2. 作为 DIV\
    \ 的子元素，创建另一个用于存放行的 DIV。将其顶部值 设置为等于高度的负值。这导致在显示行时它是隐藏的。\n\n# JavaScript\n\n1. 用数据填充所有行，使第一行位于顶部。\n\
    2. 当用户按下按键时（例如向下按钮），使用你的动画程序平滑地让包含所有行的内层 DIV 移动，直到高度结束。\n3. 使用定时器或 `transitionend`\
    \ 事件（在 DIV 移动后触发），你需要一个执行多个操作的函数。首先，它应该用新数据填充所有行并移动数据。你可以行行复制数据，也可以从你的数据源重新填充。然后重新定位你的内层\
    \ DIV，使其顶部值为负。这些事件将同时发生，因此用户不会检测到移动。你可能希望使用 `setTimeout` 优化你的程序，以便在用户按下向上或向下箭头时立即重新填充网格。每次按下，你可以增加显示行的索引，但在用户未按下按键\
    \ 200ms 后再重新填充数据。\n\n> “理论上，理论和实践没有区别。但在实践中，是有的。” Jan van de Sncheut\n\n# 4 对象\n\
    \nJavaScript 对象可以帮助组织和优化你的代码。JavaScript 的对象模型基于原型而不是类继承。这意味着你设置对象的方法与创建新对象或实例的方法不同。要理解原型链如何工作，有很多书籍（如\
    \ Nicholas C. Zakas 的《The Principles of Object-Oriented JavaScript》和 Stoyan Stefan\
    \ 的《Object-Oriented JavaScript》）以及关于 JavaScript 中对象如何运作的网络文章，所以我在这里不详细介绍。相反，在你的应用程序中使用复杂的对象时，我认为在代码中使用对象和原型时需要非常小心，因为可能会让你的代码变慢并可能难以阅读。然而，妥当使用对象将减少你所需的代码量，并对全局命名空间提供更好的保护。\n\
    \n# 创建对象\n\n在应用程序中创建和使用对象有多种方法。你需要选择最符合需求的方法。性能上存在差异，所以你想选择最简单清晰的方法。\n\n- 普通对象（Plain\
    \ object）。这使用 `object` 构造函数。这是最简单的但构造对象的速度较慢。所有属性在拷贝上都是的。你不能用它创建唯一的对象实例，因为任何拷贝都会引用原始对象的值。\n\
    \n```\nvar newObj = {\n  doThis: function () {},\n  doThat: function () {},\n\
    \  propOne: 12\n};\n```\n\n- 普通对象构造函数。这是传统的构造函数。这种方法非常慢，是 Chrome 上构造新对象实例最慢的方法。可以传递值并赋值给新对象的属性。所有通过这种声明的项目在对象上都可用。\n\
    \n```javascript\nfunction ObjectConstructor(val) {\n  this.type = val || {};\n\
    \  this.doThis = function () {};\n  this.doThat = function () {};\n  this.propOne\
    \ = 12;\n}\nvar newObj = new ObjectConstructor(5); // new实例\n```\n\n"
