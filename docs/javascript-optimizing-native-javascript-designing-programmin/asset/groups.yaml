  - "[PAGE 72]\n\n# 66 JavaScript: Optimizing Native JavaScript\n\n# 3. Memory usage\n\
    \nIt is always hard to accurately measure memory of items that will be garbage\
    \ collected you still want to avoid creating garbage in the first place. However,\
    \ the delete method can free up substantially more memory than setting object\
    \ properties to `null`. Now that the performance of accessing objects with deleted\
    \ properties has to improve, you may want to delete to get rid of unused properties.\n\
    \n# Assigning object properties\n\nWhen assigning properties to singleton objects,\
    \ you can save some code space and make your code easier to read by assigning\
    \ them when the object is created. You should already be using the `{}` method\
    \ of making new Object()` as we discussed in an earlier chapter. And instead of\
    \ assigning properties like:\n\n```\nvar newobj = {};\nnewobj.prop = \"a\";\n\
    newobj.prop2 = \"b\";\n```\n\nuse:\n\n```\nvar newobj = {\n  prop1: \"a\",\n \
    \ prop2: \"b\"\n};\n```\n\nor use:\n\n```\nvar newobj = {prop1\":\"a\",prop2\"\
    :\"b\"};\n```\n\nNOTE: If object property names are not valid variable names,\
    \ you can set their values using the `newobj[\\prop name\"]` method or surround\
    \ the name with quotes. Invalid names include those with embedded blanks or hyphens\
    \ or starting with a number. The speeds in the tests below were almost the same\
    \ whether this method was used or the original method shown above.\n\n![](img/10c5df588c0c6e2580324246d7b5735f_72_0.png)\n\
    \n| | Safari | Chrome | Firefox |\n|---|---|---|--|\n| 1. Object first, then properties\
    \ | 65 | 4 | 1 |\n| 2. Object and properties at same time | 72 | 6 | 51 |\n| 3.\
    \ Array first, then elements | 3 | 1 | 4 |\n| 4. Array and elements at same time\
    \ | 73 | 9 | 48 |\n\nTest 4: http://native.javascript.com/tests/Test-AssigningObjectProperties.html\n\
    The above result tests the speed of setting properties using two methods, and\
    \ also similar properties for comparison. This highlights:\n\n+   - Firefox was\
    \ very fast setting values on both objects and arrays if they were done at the\
    \ same time the object was declared. Separately, Firefox was really slow.\n- Setting\
    \ the values at the same time as the array was much faster on Chrome and Firefox."
