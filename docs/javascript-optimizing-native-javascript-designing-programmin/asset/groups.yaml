    ROBERT C. ETHEREDGE


    # JavaScript: Optimizing Native JavaScript


    # About the Author


    Robert C. Etherledge is the founder of MiraVista Press and myWriterTools. He has
    been programming for over 30 years. He wrote his first programs on IBM punch cards,
    graduated to using paper tape programming U.S. Navy computers, and wrote his first
    commercial software on 5 1/4" Apple II floppy disks. He has designed or programmed
    more than 20 software products, and spent 16 years programming set top boxes and
    mobile devices using JavaScript and HTML. Recently he has been designing and programming
    JavaScript/HTML interfaces to process big data for health related applications.


