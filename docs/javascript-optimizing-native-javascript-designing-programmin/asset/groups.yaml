    \n## JavaScript\n\n本章介绍了 JavaScript 命令和操作符。它不是参考手册，也没有涵盖所有的命令和操作符。其他书籍和网站提供了这些信息。然而，它涵盖了在为支持\
    \ JavaScript 的设备和计算机创建应用程序时的真实用法。我讨论了优化代码的方法，使其更小、更快。我不依赖第三方框架来处理所需的功能——所有内容都是用原生\
    \ JavaScript 编写的。如果你理解并编写这些代码，你就可以理解并使用任何框架。JavaScript 库和框架只是更多的代码层——它们必须更大、更慢，但它们有助于实现功能的标准化，特别是在使用由许多程序员支持的项目时。它们具有优势，特别是如果你是一个初级程序员，因为它们被广泛使用且应该是没有错误的。但它们并不是魔法，而且它们有许多交叉依赖关系。\n\
    \n## JavaScript 版本\n\nJavaScript 开发于 1995 年，以其非商标名称 ECMAScript 著称。多年来，它通过许多主要版本的发布不断演变，目前提供\
    \ 1.7 或 1.8 版本的变。每个浏览器（IE、Firefox、Chrome、Opera 等）都有自己的实现，并且并不支持所有功能，因此如果你需要跨浏览器兼容性，请注意你所依赖的\
    \ JavaScript 特性。为了安全起见，你应该支持你必须支持的浏览器所使用的旧版本，或者根据浏览器版本对代码进行特殊处理。许多可用框架和库都具有跨浏览器支持。特别是旧版本的\
    \ Internet Explorer 与其他浏览器有许多不兼容之处。Google 有一个开放的 JavaScript 引擎 V8，用于其 Chrome 浏览器。\n\
    \n最新的 ECMAScript 版本 6 在大多数浏览器上都得到了支持，但合规程度各不相同。你可以在网上找到许多网站，按功能和浏览器列出特性。在你的应用程序中依赖这些新特性时，你应该非常小心。某些项可能是用的，例如新的\
    \ `let` 和 `const` 声明。你可以使用如 http://www.aniuse.com 等网站来验证哪些功能在哪些浏览器上有效。\n\n## 性能\n\
    \n我们在本书的大多数章节中都讨论了性能，并在许多情况下列出了在几个浏览器上运行的实际测试结果。在许多情况下，使用各种选项运行数千次测试以发现某一次快了几毫秒，并不会让你的应用程序性能变得更好。你在编写代码时应该记住通用概念，尽可能高效地编写。本章讨论了你在设计和编写应用程序时应该记住的一些性能问题。请记住，书中记录的测试是针对当时的特定浏览器版本的。浏览器在不断变化，测试结果可能会发生变化，变慢或变快。务必使用\
    \ Google PageSpeed 等工具来改进你的代码。\n\n## 变量类型\n\nJavaScript 不是一种类型语言。这解决了一些问题，但也意味着如果你使用\
    \ IDE，它不会像普通的类型语言那样经过优化。现在已经有了像 TypeScript 这样的解决方案，以及 JavaScript 本身未来解决这一缺点的计划。在此期间，如果你足够小心，可以利用这一“特性”作为优势。你只需要意识到\
    \ JavaScript 操作符是如何工作的，以及你正在测试的值是什么。尽管变量不是严格类型化的，但可以创建几种通用类型的变量：\n\n字体 字符串 (strings)\n\
    - 数字 (numbers)\n- 对象 (objects)\n- 布尔值 (booleans)\n\n当你尝试对变量执行操作时，需要意识到变量，否则可能会得到不可预知的结果。JavaScript\
    \ 会尝试将一种类型的变量强制转换为另一种类型（例如在字符串末尾添加数字），但你必须理解发生了什么，否则可能会得到错误的结果。如果你明确你的数据和输入字段的类型，那么你应该能够在代码中正确地处理它们。\n\
    \n## 全局变量声明的注意事项\n\n首先，你应该将全局声明减少到最。你可以将一些高级对象名称声明为全局，但尽量避免对变量名使用全局声明。假设你必须声明一些全局变量，通常你关心的有三种通用方法：\n\
    \n```\nglobalVar = 12;\nvar globalVar2 = 13; //使用 var 可能会产生问题\nwindow.globalVar3\
    \ = 14;\n```\n\n这些本质上都是将你的变量分配给全局对象，但处理方式略有不同。这在需要删除它们时通常不是问题。一种方法是将它们赋值为 null，类似于：\n\
    \n```\nglobalVar = null;\nglobalVar2 = null;\nglobalVar3 = null;\n```\n\n这会将三个变量都设置为\
    \ null 并释放内存，但由于它们在全局范围内，它们不会被完全移除。删除这些变量的另一种方法是使用 `delete` 方法，类似于：\n\n```\ndelete\
    \ globalVar;\ndelete globalVar2;\ndelete globalVar3;\n```\n\n`delete` 方法通常会移除对象。然而，使用\
    \ `var` 声明的全局对象 (globalVar2) 不会被移除并仍然包含值。当你再次访问这些变量时，访问 globalVar 或 globalVar3\
    \ 将抛出 JavaScript 错误。globalVar2 仍然显示 13;\n\n## undefined 的使用\n\n小心测试 undefined，因为用户可能会更改此变量的值，你的测试可能会失败。我认为这种情况极不利且容易发现和修正。假设你的内容都是“可信任”的——即它们经过了审查并且不包含恶意代码。如果你在一个无法控制添加内容的环境中编程，那么在决定如何测试变量时，你可能需要考虑到这一点。在这种情况下，你还需要添加更多的错误检查。\n\
    \n## 使用 == 或 === 进行比较\n\nJavaScript 有两个相等操作符可以比较变量和常量。\n\n| 操作符 | 结果 |\n| :---\
    \ | :--- |\n| == 类型转换相等 | JavaScript 将尝试将变量转换为相同类型并比较它们是否相等 |\n| === 严格相等 | 变量必须具有相同类型且相同值才被视为相等\
    \ |\n\n关于这些操作符的几点：\n\n- 比较对象的表达式仅在比较的是同一个对象时为真。\n- null 和 undefined 使用 == 时被认为是相同的，但使用\
    \ === 则不是。\n- 如下所示，这两个操作符的性能基本上是相同的。\n\n如果你知道自己在做什么，有时使用 == 比较值是可以接受的。使用严格比较 ===\
    \ 可以确保值的类型和值都正确，但在某些情况下，普通的比较就足够了。你需要小心的地方包括：\n\n- 从 cookie 或类似的存储中读取值。这些通常在内部表示为字符串，普通的转换可能不起。你将需要使用类似\
    \ parseInt() 的方法将读取的数值强制转换为数字。\n- 如果你小心，可以使用类型转换比较来编写短比较语句。这在关于测试假值的章节中会有更详细的讨论。"
