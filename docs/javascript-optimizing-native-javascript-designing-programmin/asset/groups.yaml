  mdcn: "\n\n# 缓存你的服务器请求\n\n缓存是指通过早先请求的响应来响应你的数据请求的方法。这可以用于通过 HTTP 请求加载程序文件、图像文件或数据文件。当你运行应用程序并重复加载相同的程序文件时，这非常有帮助。响应可以缓存在\
    \ fetch 过程中的多个位置，从你的浏览器缓存开始。这减少了服务器的负载，并提高了应用程序的响应速度。\n\n有许多因素影响缓存何时使用。这些因素包括\
