    # JavaScript: Optimizing Native JavaScript


    For various reasons, I decided to separate the show data into several arrays rather
    than either one of objects or multi-level arrays. These made for smaller payloads,
    smaller memory usage, and slightly faster access times. Properties at the same
    location in each array were for the same show. Now, the data looked like for each
    channel in each array element:


    ```

    "titles": ["Angels", "Armada", "As the World Turns"],

    "chans": [[2, "KRON"], [4, "KPIX"]],

    "gridStartTime": 1335250800000,

    "showTitles": [[23, 21, 3, 6, ...], [6541, 12, 22, ...]],

    "showFlags": [[345, 124, 1122, ...], [233, 1122, 1122, ...]],

    "showTimes": [[0, 30, 60, ...], [0, 90, 180, ...]]

    ```


    The original plan using 3-hour segments to load and need almost 200MB of data
    being transmitted. The new format downloaded almost immediately and used only
    around 4MB of memory.


    Updating: The entire database was downloaded by any application that was still
    running. Since any new instance of the application would always get the latest
    data when it started, for any area that had the same channel lineup, it could
    be pre-built and changed in multiple places. Updates during the day involving
    changes for specific shows were handled by:


    - Making each thing very light to the server periodically asking for updates,
    if.

    - Updates were returned by sending the array elements for the channels that had
    changes. These would simply replace the existing array member (not the entire
    array) and the UI was refreshed if needed. Changes to the actual show title could
    be handled by either sending the entire title array, or simply appending a new
    title to the end. This would result in the list not being completely alphabetical
    but this would be corrected the next time the complete data was loaded.


    # Scrolling, sorting, and filtering large lists


    I designed several applications that could scroll very large sets of data while
    allowing the user to quickly sort and filter the displayed list. I had to make
    the sorting and filtering operation as fast as possible and allow smooth scrolling
    on PC''s and mobile devices. For various reasons, I wanted to load the entire
    list once and then handle all the operations in the application without having
    to make further requests. If you design correctly, you should be able to make
    this work for tens of thousands of records giving the user a much better experience
    than typical ''load at a time''. Obviously, the requirements will vary by application.
    If the top 30 records of data you retrieve will be of interest (similar to a search
    engine request), some of these techniques will not be needed. However, if you
    want to be able to retrieve data, change a filter, sort on different fields, then
    these methods apply. The areas focused on:


    - Making the data format loaded from the server as small and efficient as possible.

    - Loading the data into one large array that is not changed when filtering or
    sorting. This will help cut down on garbage creation and be more efficient.

    - Building separate arrays of indexes for each sort order when requested. These
    arrays will be in the requested order but are simply pointers to the main data
    array. These could also be pre-built and downloaded from the server.

    - Adding a filter flag to each array member that is set to true or false whenever
    the filter is changed. This way the filter code does not have to rerun every time
    the sort changes.

    - Keeping the DOM footprint as small as possible. This involved making the elements
    playing as lightweight as possible and setting the display property to none for
    elements that were not currently displayed.


    ## Step 1 - Data format


    Start with making your data as compact as possible. I loaded my data as a JSON
    object with only the fields I needed. I made sure the data was created on the
    server in the initial sort order I wanted, in this case alphabetically by name.
    This assumes that the dataset is small enough to be fetched and displayed in its
    entirety. If the data is too large, you will have to load it in pieces as the
    user scrolls through the list. All of the concepts mentioned here can be used
    for lists loaded in sections. However, if you are displaying a partial list in
    a large div using the scrollbars (instead of a next/prev type button), you may
    want to set the height of the containing div to the full height if all of the
    rows were loaded to ensure that the scroll bar looks and acts correctly.


    ## Step 2 - Adding sort


    To allow for optimal sorting and filtering, I usually lay the data by placing
    the data fields inside a div element for each row, using absolute position for
    each row. I increment a row height to set the top property of each row. Each row
    is identified with a unique ID that directly references the array index element
    of the data. Try to keep the HTML elements as ''light'' as possible. This means
    avoid nesting a lot of elements in each row and keep CSS effects to a minimum—no
    shadows, transforms, or for examples.


    ## Step 3 - Adding sort


    Now add the ability to sort on any of the columns. You can add some method to
    display the current sort column and let the user change that. This is usually
    done clicking on the column header to change the order which is then shown by
    a small triangle icon. Create a new array of indexes in this new sort order that
    points to your data array. This minimizes the amount of data you have to move
    around and can keep the sort index array to use again if the user resorts on this
    column. If the user specifies a reverse sort, you can use the opposite order.


    ## Step 4 - Filtering


    Now add the ability to filter the list. The downside is that it has a few components:


    1. First, create a screen that allows the user to select the fields they wish
    to filter on.

    2. Then, using the filter criteria, walk through all the data setting a filter
    flag to true or false.

    3. Now, using the current sort order, you want to set the display property of
    those rows to ''block'' while setting the others to ''none''. This will remove
    it from the DOM.


    ## Step 5 - Scrolling lists


    Your list of `div` elements can be placed inside one large `div` that has the
    overflow property set to scroll. Then, size this element to fit on your page.
    This allows you to keep other elements (like menus or column headers) always visible.
    Unless the list is large, you can display all the rows in the list. However, for
    very large lists, you may need to limit the number of `div` elements that are
    actually visible (`display:block`) at one time. Having too many elements at one
    time will slow down scrolling and screen transitions.


    One way to handle this is to add a handler on the scroll event for the parent
    element of your list. In that handler, you can detect the location of the scroll
    bar, and, using the height of each row and the height of the window, determine
    which elements are currently being displayed. You can then set the display property
    of those rows to ''block''. To make the next page or down scrolling a little smoother,
    you may wish to set the display property of the 100 rows above and below the currently
    visible row to block as well.


    # Caching


    Your server requests make your data loading faster as the data that exist in either
    your local or server cache can be used. The downside is that you might get ''stale''
    data that has been changed on the server. This includes new versions of program
    files or data that may be frequently changed on the server. Most applications
    use some `cache busting` technique to ensure that they always load the latest
    data. The downside is that it will make your program and data load slower. A frequent
    method is to append a timestamp to the end of each url to force the app to appear
    a new request that bypass any cache. Using something like a JavaScript object
    displayed in milliseconds is often used.


    However, you may find that neither the data nor the program changes that often
    (but it does change). If that is the case, you could try using a timestamp for
