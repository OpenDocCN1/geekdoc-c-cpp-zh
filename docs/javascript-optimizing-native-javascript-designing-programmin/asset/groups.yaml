    \n## JavaScript 格式化\n\n首先，我们将介绍简单但经常引起争议的 JavaScript 代码格式化主题。这看起来像是一个简单的话题，但正确的格式化极大影响他人阅读和维护你代码的难易程度。当你有多个程序员在同一个代码库工作以及你的版本控制软件如何工作时，这一点尤为重要。我在这里根据我编写特别是分享\
    \ JavaScript 代码的经验提供了一些建议。由于 JavaScript 独特的解释性质和全局上下文结构，这些中的许多重要性超过了它们在编译语言。你使用的编程环境和代码验证器也会影响你的风格，因为你可以利用这两个工具。\n\
    \n注意：某些 IDE 环境或代码验证器可能会自动格式化或至少对你的代码建议格式化更改。这些工具可能会为你决定一套格式化约定。你可能想先决定一个格式化工具，并基于该工具制定你的格式化指南。\n\
    \n## 严格模式\n\nJavaScript 1.8.5 添加了一个名为严格模式的新功能。要调用它，你需要在应用该模式的脚本或函数开头处包含 \"use\
