    \ | 604 | 1,013 |\n| 6. (varC == 0) | 1,535 | 592 | 1,038 |\n| 7. (varD == undefined)\
    \ | 1,557 | 600 | 1,051 |\n| 8. (varD == \"\") | 1,571 | 600 | 1,019 |\n| 9. (varE\
    \ == undefined) | 1,571 | 591 | 1,048 |\n| 10. (varE == false) | 1,575 | 605 |\
    \ 1,016 |\n| 11. (varB == false || varB == undefined) | 120 | 600 | 1,032 |\n\
    | 12. (varB == null || varB == undefined) | 1,567 | 592 | 1,038 |\n\nTest 3-3:\
    \ http://www.nativejavascript.com/tests/TestCompare.html\n\nThese cases were fairly\
