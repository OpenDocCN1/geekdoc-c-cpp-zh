    \ will be garbage collected (gc'd). You don't need to do anything to them.\n\n\
    However, global objects and variables may persist even if you delete them. You\
    \ need to be aware of how the different methods work depending on how the variables\
    \ were declared in the first place.\n\n+   - Variables can be set to null. This\
    \ is actually a value. Depending on how the variable was declared, it may be garbage\
    \ collected. However, global variables will have their memory freed but will not\
    \ be removed by garbage collection.\n- You can use the delete operator to remove\
    \ most objects. However, a global object or variable that was declared using var\
    \ (e.g. var newVal = 4); is not removed and still contains its value.\n- If you\
    \ set a property of an object to null, the null value is treated as a valid value\
    \ and the property will not be gc'd. If you want to ensure these are cleared out,\
    \ you can:\n  a. Copy the object and its to another object, omitting the value\
    \ you cleared. Then set the original object to null, or\n  b. Use the delete command\
    \ to delete the property. However, this may have impact on performance depending\
