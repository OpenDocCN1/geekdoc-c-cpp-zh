    \ to test for the existence is often slower than using typeof.\n- The use of ===\
    \ performed essentially the same as ==. Other tests that used === were not shown\
    \ as the same.\n- Most of the other comparisons were efficient, except for Safari\
    \ when testing against constant undefined in tests 7 and 9.\n- The tests for variable\
    \ varD (tests 8 and 9) involved testing null value. Null is considered an object\
    \ which is why method 8 returned \"object\". The speeds in Chrome were the same\
