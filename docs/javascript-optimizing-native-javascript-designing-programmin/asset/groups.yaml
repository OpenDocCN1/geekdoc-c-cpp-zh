    \ involve having data formatted on the server instead of letting the user interface\
    \ format them to the user's preferences, and sub-optimal uses of booleans, strings,\
    \ and numbers.\n\n## Share, share, share...\n\nShare code and screens as much\
    \ as possible. I am not talking about writing your code to be reusable in other\
    \ projects. That is a separate subject open for debate as it tends to make your\
    \ project longer. What I am talking about is making sure that you don't copy and\
    \ paste the same routine in multiple places in your code. If you have to do the\
    \ same more than once, spend the time to make one good function that can be used\
    \ from several places. Put more time in designing your application front and create\
    \ single functions that can be used in several places. The same also applies to\
    \ your HTML code which can have impact on your application's performance. Be careful\
    \ when laying out your HTML screens you reuse them as possible and avoid continual\
    \ altering or destroying the DOM tree.\n\n## Make the appropriate trade-offs\n\
    \nThere are always trade-offs when you are writing code. Your job as a programmer\
    \ is to optimize for the proper value when you have a choice. The trade-offs are\
    \ usually between:\n\n- memory use\n- execution speed\n- code readability\n\n\
    Therefully will be many cases in which you can optimize for all three values.\
    \ In other cases, you will have to analyze whether your UI demands fast execution,\
    \ or whether you need to conserve memory. If you select a method that results\
    \ in code that is more difficult to read, make sure that you properly comment\
    \ the section as much needed. Keep in mind a few rules when optimizing your code:\n\
    \n- Do not optimize prematurely. However, that doesn't mean that you shouldn't\
    \ try to use best practices all the time.\n- Code readability is always important\
    \ so be sure to comment any section of code that may be difficult to understand.\
    \ Comments can be easily removed by minifiers when your app is released.\n- Focus\
    \ on 'low hanging fruit' first. This follows Pareto's 80-20 principle. You can\
    \ get 80% of the benefit from concentrating on just 20% of the code. Profile your\
    \ code to determine where memory is used and where performance suffers. Then focus\
    \ on those areas. Obvious areas of concern are recursive functions and loops.\n\
    \n## How many lines of code do you write?\n\nIf you are ever asked how many lines\
    \ of code you wrote, replying with a large number is not necessarily a good thing.\
    \ Be proud of writing a smaller number of lines—just make them very good lines\
    \ of code. As Mark Twain (or Blaise Pascal) is said to have commented—“I am sorry\
    \ this letter is so long but I didn't have the time to make it shorter.”\n\n##\
    \ JavaScript Formatting\n\nFirst, we'll go over the simple, but often contentious,\
    \ subject of formatting your JavaScript code. This seems like a simple topic,\
    \ but proper formatting greatly affects how easily others can read and maintain\
    \ your code. It is particularly important when you have more than one programmer\
    \ working on the same code base and how your version control software works. I\
    \ include a number of suggestions here on my experience with writing and particularly\
    \ with sharing JavaScript code. Because of JavaScript's unique interpretive nature\
    \ and global context structure, many of these are more important than they are\
    \ in compiled languages. Your programming environment and code validator that\
    \ you use will also influence your style as you will be able to leverage those\
    \ two tools.\n\nNOTE: Some IDE environments or code validators may automatically\
    \ format or at least suggest formatting changes to your code. These tools may\
    \ decide a number of formatting conventions for you. You may want to decide on\
    \ a formatting tool first and base your formatting guidelines on that tool.\n\n\
    ## Strict mode\n\nJavaScript 1.8.5 added a new feature called strict mode. To\
    \ invoke it, you include the expression \"use strict\" in your code at the beginning\
    \ of the script or function where you want to apply, using the following line\
    \ of code:\n\n```\n\"use strict\";\n```\n\nIt is designed to make it harder to\
    \ write \"bad\" JavaScript code. Some of the sections in this book assume you\
    \ are not running in strict mode. When set, strict mode will throw errors in the\
    \ following situations:\n\n- Using a variable before it is declared\n- Deleting\
    \ a variable or object using the delete method\n- Using the with statement\n-\
    \ Restrictions on use of other variable names\n- arguments.callee is no longer\
    \ supported\n\n## 14 JavaScript: Optimizing Native JavaScript\n\n### Comments\n\
    \n### Comment style\n\nEven something as simple as commenting needs to be handled\
    \ consistently. In JavaScript, you can use two types of comments and you may read\
    \ books or articles recommending each type. You need to use a different type of\
    \ comment for CSS and HTML files. The comment types for your JavaScript code are:\n\
    \n- // Two slashes anywhere on a line treats the remainder of that line as a comment.\
    \ You can use this for blocks of code (each line starting with //), single comments,\
    \ and comments on the end of a line after the code.\n- Any code placed between\
    \ /* and ending another */ is treated as a comment. These tags can surround multiple\
    \ lines of code, or just one line.\n\nI strongly recommend using the first type\
    \ of comments (/) in your code for three main reasons:\n\n- If you have a /* */\
    \ block and insert another /* block inside of it, it will most likely throw a\
    \ JavaScript error.\n- When you do global searches for variable names, it makes\
    \ it easier to find the important strings that are real code and not commented\
    \ if you always use //. Otherwise, any code that is inside a block comment may\
    \ look like valid code.\n- /* may if it surrounds regular expressions: var rgex\
    \ = /c*/;\n\nOne good reason for using block comments may be for temporarily commenting\
    \ out a block of code for testing purposes, knowing that you are going to remove\
    \ the comments later.\n\n### What comments to include?\n\nThe amount of commenting\
    \ should be dictated by your programming style, the clarity of your code, and\
    \ the requirements of your project. Since most likely you will be compressing\
    \ your code before you deploy, you normally have to worry about the space taken\
    \ up by your comments. However, excess or extraneous comments can make your code\
    \ harder to read. Make sure you comment any places where the logic is not clear\
    \ to anyone new to the code (or even to you 6 months later). You can place comments\
    \ above logic branch points for clarity, and additional comments to the right\
    \ of lines that need explanation, as:\n\n```\n// USER HAS ENTERED VALUE\nif (x==0)\
    \ {\n  elem.style.backgroundColor = cBackColor;\n\n// USER HAS PICKED SECONDARY\
    \ COLOR\nelse if (x==1) {\n  elem.style.backgroundColor = cBackColor;\n}\n```\n\
    \nBut please don't add comments that don't self-explanatory, such as lastIndex\
    \ = 5\n\n### Comments indicating ToDo items\n\nSomething else I have found very\
    \ useful when coding a large project, particularly if there are other programmers\
    \ involved, it is to use your comments to communicate with the other programmers\
    \ or make notes to yourself. I include comments with my initials anywhere I have\
    \ a question or know that I need to go back and fix something. Some IDE environments\
    \ automatically support TODO comments. I might have comments like this function\
    \ needs to be optimized\n// I am not sure what the possible values are here\n\
    // Can you add the appropriate code in here?\n// take out before final\n```\n\n\
    ### Comments for documentation such as JSDoc\n\nDocumenting your code always seems\
    \ to be a real pain and something you put off until the very end, or something\
    \ after the end of the project. Depending on your project, this can be a real\
    \ detriment. If items are not documented right away, you may have trouble remembering\
    \ how functions work or why they were written. If you are writing modules for\
    \ other programmers, or have a published API, then proper documentation is crucial.\n\
    \nThere are a number of products that simplify your JavaScript code documentation\
    \ task, as JSDoc or UIDoc These rely on the programmer embedding comments using\
    \ a format specific to the tool, as:\n\n/**\n* Method description about the following\
    \ method. Can be several lines.\n* @method (String) objname Description of this\
    \ string.\n* @param (Object) obj Description of object that is passed in\n* @return\
    \ (Boolean) Returns true on success\n */\n\nWhether you want to use one of these\
    \ methods is up to you and your project team. Most likely the person responsible\
    \ for producing the formal documentation for the project will have the final say.\
    \ The advantages of using one of these methods include:\n\n- They allow the programmer\
    \ to communicate complicated information to the documentation team.\n- They force\
    \ the programmer to document their methods, often resulting in better and more\
    \ concise APIs.\n- Some IDE's take advantage of embedded documentation to give\
    \ you help, variable typing information, or code completion.\n- If concurrently\
    \ with your code, then you will have your documentation ready when your code is\
    \ done.\n"
