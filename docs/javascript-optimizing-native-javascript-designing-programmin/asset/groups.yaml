    # CSS selectors


    Many properties are inherited from their parent elements but not all properties
    are. You need to refer to a CSS reference if you are unsure about a specific property''s
    inheritance.

    The order that CSS rules are applied to your elements is determined by their specificity.
    You need to be careful when you design your HTML that you avoid specificity problems
    or incorporate them into your design. Browsers use the CSS selectors that might
    apply to each element in your HTML. When multiple selectors have equal specificity,
    the latest declarations apply. Rules that are applied directly to an element take
    precedence over inherited rules. The following list shows the general precedence
    order, from least to most specific.


    +   1. Universal * selector

    2. Pseudo elements and type selectors

    3. Class selectors and pseudo classes

    4. ID selectors

    5. Inline styles on element (this one wins!)


    # Overwriting style using the important rule


    Styles declared with the addition of important on the declaration will override
    declarations that may apply to that element. Two rules that both have important
    will use the specificity rules described above. Generally, you should avoid using
    !important and instead structure your CSS so that is not required, though that
    may always be possible.

    There are many articles, books, and websites (and they are) explaining the rules
    of CSS. If the rules are complicated, my suggested approach would be to avoid
    relying on stable interactions of CSS rules and focus on making simple CSS rules
    that are as specific as possible as often. This avoids interactions that may be
    difficult to trace and debug, and actually improve performance.


    # Descendant selectors


    Descendant selectors are multiple selectors defined together, such as:


    ```

    .class1 .class2 (props... )

    ```


    You can chain all types of selectors—including element, class, and type. It is
    a feature of CSS and can be leveraged to make your CSS easier to assign. Some
    CSS compilers (like LESS) also produce this kind of CSS output by allowing you
    to nest CSS definitions. However, I recommend against use of this style for several
    reasons:'
