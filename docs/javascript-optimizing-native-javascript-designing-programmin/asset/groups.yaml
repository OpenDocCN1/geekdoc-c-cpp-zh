    - 防止错误。这需要你对你的代码进行单元测试。\n- 让错误条件易于撤销。\n- 在适当的地方添加 try/catch 代码。\n\n- **回归 Bug。**\
    \ 这些是最糟糕的 Bug，因为它们发生于你之前测试过的代码中，但代码更改或其他 Bug 修复创建了新的 Bug。除非你有一个完整的测试回归 Bug 的计划，否则你就会面临风险。即使是开发后期引入的相对无害的修复也可能产生严重的后果，因为你通常没有时间再次充分测试产品。\n\
    - **测试工具。** 你可能还会考虑使用 Jenkins 等第三方测试工具来自动化你的测试。当你在每次代码检查后运行这些测试时，它们对于发现回归 Bug\
    \ 非常帮助。它们主要关注于对代码进行单元测试。\n\n"
