    // MODULE PATTERN FOR SINGLETON\nvar newObj = (function () {\n  function doThis()\
    \ {}\n  function doThat() {}\n  var propOne = 12;\n  return {\n    doThis: doThis,\n\
    \    doThat: doThat,\n    propOne: propOne\n  };\n})();\n```\n\n# 第 4 章：对象 • 63\n\
    \n下表提供了使用上述方法构建新对象的一些性能数据。比较它们稍微有点困难，因为构造函数实际上可以创建多个对象；测试 1 和 5 中的对象只是单个对象。\n\n\
    | | Safari | Chrome | Firefox |\n|---|---|---|---|\n| 1. 创建 - 普通对象 | 218 | 16\
    \ | 15 |\n| 2. 创建 - 常规构造函数 | 212 | - | 16 |\n| 3. 创建 - 带原型的构造函数 | 1,233 | 239\
    \ | 178 |\n| 4. 创建 - 模块模式 | 67 | 31 | 69 |\n| 5. 创建 - 模块模式 - 单例 | 216 | 3 | 17\
    \ |\n\n测试 4-1: http://www.nativejavascript.com/tests/Test-CreatingObjects.html\n\
    \n# 为对象声明方法\n\n当你使用构造函数创建对象实例时，有几种方法为每个实例创建方法：\n\n- 将方法包含在对象构造函数中。该方法将被复制并包含在每个实例中。对方法的更改不会反映在任何已创建的对象实例上。\n\
    - 将方法添加到原型系统中。每个实例将共享同一个原型方法。对原型方法的更改将影响所有对象实例。这通常不用于处理希望每个对象实例都唯一的属性，而且它无法访问构造函数中的局部变量。\n\
    - 将方法直接添加到实例上。只有此实例可以访问此方法。\n\n以下显示了一个对象构造函数在使用三种不同方法分配方法的效果：\n\n```javascript\n\
    // 方法作为对象的一部分\nfunction MakeObject() {\n  this.doSomething = function() {\n  \
    \  console.log('Original method');\n  }\n  var newInstance = new MakeObject();\n\
    \  newInstance.doSomething(); // 显示 'Original method'\n}\n\n// 使用了原型但仍使用原始方法\n\
    MakeObject.prototype.doSomething = function() {\n  console.log('Prototype method');\n\
    };\nnewInstance.doSomething(); // 显示 'Original method'\n\n// 删除实例上的方法 - 使用原型方法\n\
    delete newInstance.doSomething();\nnewInstance.doSomething(); // 显示 'Prototype\
    \ method'\n```\n\n```javascript\n// 覆盖原型方法 - 新原型方法\nMakeObject.prototype.doSomething\
    \ = function() {\n  console.log('New Prototype method');\n}\nnewInstance.doSomething();\
    \ // 显示 'New Prototype method'\n```\n\n```javascript\n// 覆盖实例上的方法 - 使用此方法\nnewInstance.doSomething\
    \ = function() {\n  console.log('Override method');\n}\nnewInstance.doSomething();\
    \ // 显示 'Override method'\n```\n\n```javascript\n// 删除实例方法 - 最后的原型方法\ndelete newInstance.doSomething;\n\
    newInstance.doSomething(); // 显示 'New Prototype method'\n```\n\n```javascript\n\
    // 删除原型方法 - 方法现在抛出错误\ndelete MakeObject.prototype.doSomething;\n//newInstance.doSomething();\
    \ // 抛出错误\n```\n\n```javascript\n// 分配新的原型方法 - 使用它\nMakeObject.prototype.doSomething\
    \ = function() {\n  console.log('Last Prototype method');\n}\nnewInstance.doSomething();\
    \ // 显示 'Last Prototype method'\n```\n\n## 删除使用的对象引用\n\n当属性取消引用（超出作用范围）时，它们将被收集。因此，如果你有一个使用\
    \ `var` 声明局部变量的函数，当函数结束时，变量将被垃圾回收。\n\n"
