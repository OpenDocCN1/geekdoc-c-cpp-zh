    \ `Expires` 或 `Cache-Control`，或使用实体标签 (ETags)。\n\n# 禁用缓存\n\n你可能想要确保禁用缓存的常见情况包括：\n\
    \n- 请求对时间敏感的信息，这些信息可能在服务器上不断更新，因此你需要确保获取的是最新信息。\n- 在开发应用程序时加载程序文件（HTML、CSS、JavaScript），这些文件可能会频繁更改。在这种情况下，禁用缓存的一种常用方法是在\
    \ JavaScript 获取这些文件时，为每个文件的文件名添加一个随机字符串（如当前毫秒时间）。\n- 使用浏览器的“清除缓存”功能手动清除当前缓存。\n\
    \n# 启用缓存\n\n有时你希望确保数据被缓存，主要为了加速你的应用程序并减少服务器负载。在此操作时需要记住以下几点：\n\n- 你只能进行 GET 请求。POST\
    \ 请求无法被缓存。\n- 你的请求 URL 必须与之前的请求相同，以确保你的数据被拆分，从而可以使用相同的 URL 获取大量信息，并将用户特定的请求减少到最少。请记住，缓存可能发生在网络中的不同位置，因此来自不同用户的请求也可能被缓存。\n\
