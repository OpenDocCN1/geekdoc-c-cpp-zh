    # Event delegation using event bubbling


    Event bubbling allows you to set one event handler on an outer element that will
    get all events fired on all inner elements. This helps you greatly reduce the
    number of handlers in your code. Rather than setting a handler on every row or
    cell in a table, for example, you can set one handler on the table that will get
    all events from all the rows. You will all need to do check for the id of the
    element that created the event and take the appropriate action. Elements that
    you don''t recognize will have their events ignored, or you can cancel them.


    When you place your handler on the outermost element, you normally will need to
    know which inner element was acted upon. Your handler can access two properties
    that will help properly handle the event:


    - *this*: refers to the element that is handling the event that have bubbled up
    from a lower element. It does NOT refer to the element that was initially acted
    upon. You will have to test for this in another way.

    - *target*: can access the original element that was acted upon by using the following
    line of code that handles the differences between browsers. The result of this
    assignment are the same in every handler that is executed when the event bubbles
    up. You can use this variable to determine the ID of the element that was selected.


    ```javascript

    var target = event.target || event.srcElement;

    ```


    NOTE: The IE attach method does not pass any value for this.


    # Delegating events like focus and blur


    Some events do not bubble up to outer elements so trying to use a regular event
    delegation handler will not work. These events include focus, blur, and change.
    However, these events can be handled by a capture handler set up with addEventListener.
    This could be used to know when any child element has received focus, for example.


    # Differences in event names


    The exact name used to assign event varies slightly by browser and by usage. For
    example, to add a handler that takes care of click events, you could use one of
    the following methods:


    - `<div onclick="doThis()">`

    - element.onclick = doThis;

    - element.addEventListener(''click'', doThis, false);

    - element.attachEvent(''onclick'', doThis); (IE 8 and before)


    Note that you use onclick in all cases except when using addEventListener. The
    same difference applies to other events, such as: focus/onfocus, blur/onblur,
    and key/keyup. You will need to test for the proper handlers in your code before
    you assign them to your handlers.


    # Setting handlers for mousemove events


    You may need to set up an event handler to allow a user to move an element like
    a slider or small window across the screen. This will involve setting three handlers:


    - mousedown: to capture the starting location of the mouse and set up the mousemove
    events.

    - mousemove: tracks the mouse location and moves the element appropriately using
    information from the mousedown event to know how far to move the element.

    - mouseup: indicates the mouse event is over and removes the mousemove event so
    that the element doesn''t keep moving as you move the mouse without the button
    depressed.


    When you set up these events, you need to be careful handle cases where the user
    either quickly moves the mouse, or moves the mouse beyond the location that you
    actually allow the element to appear. If you assign all three events to the same
    original element, you will usually have problems with the mousemove never stopping
    moving the element. The correct way to assign these handlers is:


    1. Assign the mousedown event handler to the original element that you want to
    move.

    2. In this mousemove event handler, you need to record the location of the mouse
    and the location of the element so you can properly move it in the mousemove event
    handler.

    3. In the mousemove event handler, you also need to assign a mousemove event handler
    on an upper level element, usually the document. This ensures you will properly
    track mouse movement. This handler will reposition the element on the mouse-movement.

    4. In the mousemove handler, you will also assign the mouseup event handler to
    the same upper level element or document. The mouse handler will remove both the
    mousemove and mouse handlers (see below for how to remove handlers.)


    # Removing event handlers


    The method of removing event handlers depends on how you created them in the first
    place. A common reason to remove handlers is handling mousemove events where you
    need to remove your mousemove and mouseup event handlers when you are done with
    them. The methods include:


    - detachEvent(''click'', doThis). Use to remove handlers added with the attach-Event
    method (IE 8 and before).

    - removeEventListener(''click'', doThis, true). Use to remove handlers added with
    the addEventListener method. You need to match the same argument used when creating
    the handler. If you added handlers for both capture and bubble stages, you need
    to remove each handler separately.

    - element.onclick=null. Use to remove handlers added with element.onclick=doThis;


    # Handling dblClick events


    You need to be careful when assigning handlers for dblClick events. You would
    normally add a handler for the dblclick event (dblclick) on the element the user
    double click on. If you add additional handlers for related events, such as mousedown,
    mouseup, and click events, you will see the following handlers fired when you
    double click on the element:


    1. mousedown

    2. mouseup

    3. click

    4. mousedown

    5. mouseup

    6. click

    7. dblclick


