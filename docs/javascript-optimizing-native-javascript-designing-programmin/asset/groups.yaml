    \n### 小心开销较大的 CSS 属性\n\n某些 CSS 属性比其他属性更“昂贵”，因为它们在浏览器尝试布局和重绘你的网页时造成了额外负担。你可能通过想象浏览器渲染元素必须完成的额外工作来判断哪些属性可能是昂贵的。这些属性包括：\n\
