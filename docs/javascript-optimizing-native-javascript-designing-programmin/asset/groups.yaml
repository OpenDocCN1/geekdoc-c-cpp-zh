    \ `('string')`。如果你不确定使用的是什么引号符号，也必须搜索 `('string')`。如果你不一致，可能会用错误的符号关闭你正在输入的字符串，尽管许多\
    \ IDE 环境会捕获这个错误。\n\n## 行与间距\n\n### 行长度\n\n你应该尝试将代码行的长度保持在 80 个字符或以内。能够在不进行水平滚动的情况下看到整行代码通常是有益的。如果必要，可以通过在逗号等运算符后添加换行来折断长行。下一行……\n\
    \n### 制表符或空格\n\n许多编辑器会自动执行此操作。你可能希望每一层缩进使用两个空格。你也希望所有逻辑连接的大括号对齐。这将使检查代码变得更容易。所以你的代码应该像这样：\n\
