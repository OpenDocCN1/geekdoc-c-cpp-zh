    # 使用事件冒泡进行事件委托


    事件冒泡允许你在外部元素上设置一个事件处理器，该处理器可以获取在所有内部元素上触发的所有事件。这可以极大减少你代码中处理器的数量。例如，你不需要在表格的每一行或每个单元格上设置处理器，可以在表格上设置一个处理器，来获取来自所有行的事件。你仍然需要检查创建事件元素的
    id 并采取相应的操作。对于你无法识别的元素，其事件将被忽略，或者你可以取消它们。


    当你将处理器放置在最外层元素上时，你通常需要知道是哪一个内部元素被操作了。你的处理器可以访问两个有助于妥善处理事件的属性：


    - *this*：指的是从较低元素冒泡上来的事件元素。它**不是**指向最初被操作的元素。你必须通过其他方式对此进行测试。

    - *target*：可以使用以下处理浏览器差异的代码来访问被操作的原始元素。在事件冒泡时执行的每个处理器中，赋值的结果都是相同的。你可以使用此变量来确定所选元素的
    ID。


    ```javascript

    var target = event.target || event.srcElement;

    ```


    注意：IE 的 attach 方法没有为此传递任何值。


    # 委托诸如 focus 和 blur 的事件


    某些事件不会冒泡到外部元素，因此尝试使用普通的事件委托处理器将不起作用。这些事件包括 focus、blur 和 change。然而，这些事件可以通过通过 addEventListener
    设置的捕获处理器来处理。例如，这可以用于判断任何子元素何时接收到焦点。


    # 事件名称的差异


    用于分配事件的精确名称根据浏览器和用法的略有不同。例如，要添加一个处理点击事件的处理器，可以使用以下方法之一：


    - `<div onclick="doThis()">`

    - element.onclick = doThis;

    - element.addEventListener(''click'', doThis, false);

    - element.attachEvent(''onclick'', doThis); (IE 8 及以前版本)


    注意，除了使用 `addEventListener` 之外，在所有情况下都使用 `onclick`。同样的差异也适用于其他事件，例如：focus/onfocus、blur/onblur
    以及 key/keyup。在将它们分配给你的处理器之前，你需要在代码中测试适当的处理器。


    # 为 mousemove 事件设置处理器


    你可能需要设置一个事件处理器，允许用户像滑块或小窗口一样跨屏幕移动元素。这涉及设置三个处理器：


    - mousedown：捕获鼠标起始位置并设置 mousemove 事件。

    - mousemove：跟踪鼠标位置，并使用 mousedown 事件中的信息（知道要移动多远）来适当移动元素。

    - mouseup：表示鼠标事件结束并移除 mousemove 事件，这样当你不按按钮移动鼠标时，元素就不会持续移动。


    当你设置这些事件时，需要小心处理用户快速移动鼠标或将鼠标移动到实际允许元素出现之外之外。如果你将三个事件都分配给同一个原始元素，通常会遇到 mousemove
    永远停止移动元素的问题。分配这些处理器的正确方法是：


    1. 将 mousedown 事件处理器分配到你想要移动的原始元素上。

    2. 在此 mousemove 事件处理器中，你需要记录鼠标的位置和元素的位置，以便在 mousemove 事件处理器中妥善地移动它。

    3. 在 mousemove 事件处理器中，你还需要在上层元素（通常是 document）上分配一个 mousemove 事件处理器。这确保你将妥善跟踪鼠标移动。该处理器将在鼠标移动时重新定位元素。

    4. 在 mousemove 处理器中，你还将 mouseup 事件处理器分配到同一个上层元素或 document 上。该处理器将移除 mousemove
    处理器。


    # 移除处理器


    移除处理器的方法取决于你最初是如何创建它们的。移除处理器的常见原因是处理 mousemove 事件时，你需要移除 mousemove 处理器。方法包括：


    - detachEvent(''click'', doThis)。（IE 8 及以前）

    - removeEventListener(''click'', doThis, true）。使用 removeEventListener 方法）

    - element.onclick=null。（使用 element.onclick 方法）


    # 处理 dblclick 事件


    在分配 dblclick 事件时需要小心。你通常会在元素上双击时触发 dblclick 事件。如果你添加了相关的事件，如 mousedown、mouseup
    和 click，你会在双击元素时看到以下处理器的触发顺序：


    1. mousedown

    2. mouseup

    3. click

    4. mousedown

    5. mouseup

    6. click

    7. dblclick


    # 在屏幕上禁用事件


    （注：原文此处为大量重复性文本，已剔除以保持文档清晰）


    '
