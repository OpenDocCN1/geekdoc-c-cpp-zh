  - '[PAGE 56]


    # Lookup of arrays vs. objects


    There are instances where arrays make the best sense for storing your data and
    other times an array of objects makes more sense. You need to decide which is
    the optimal method for your usage. The main factors to consider are:


    +   -Method of access.** How will you access the data? Do you need to have a named
    property to identify the member, or an integer index suffix? The items will need
    to be ordered?

    - **Performance.** How often will the data be accessed? Will speed of access be
    important?

    - **Memory.** How large a data set will you be handling? How important will memory
    usage be to your application?

    - **Number of properties.** Objects or arrays with more properties tend to take
    longer to access than with fewer properties this is hard to compare.

    - **Readability.** Which method do you select, need to make sure that your code
    remains readable and properly document the usage.


    | | Safari | Chrome | Firefox |

    |---|---|---||

    | 1. Object (2 properties): x = obj2[0]["9"] | 9 | 20 | 100 |

    | 2. Array (20 properties): x = arr21][8] | 350 | 360 | 270 |

    | 3. Object (10 properties): x = obj10[0]["1"] | 9 | 30 | 150 |

    | 4. Object (3 properties): x = obj3[0]["1"] | 9 | 30 | 180 |

    | 5. Array (10 properties): x = arr10[3] | 360 | 360 | 360 |

    | 6. Array (3 properties): x = arr3[0] | 430 | 370 | 340 |


    > Test-3: http://www.javascript.com/tests/TestArraysOrObjects.html


    The main result from these tests is that arrays are faster to access than objects.
    However, your application may have values and methods of filling the properties
    that are different from the tests used, so you should carefully analyze your application.


