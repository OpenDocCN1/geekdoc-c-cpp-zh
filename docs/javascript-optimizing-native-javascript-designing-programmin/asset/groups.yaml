    \ the amount of localization you need to provide with your application. There\
    \ are also two methods of localization to consider as well:\n\n- Start-up localization.\
    \ You determine the correct formats to use when your application starts and use\
    \ for all parts of your app.\n- User-selectable localization. You may determine\
    \ a default setup when your app starts but have a setup screen where the user\
