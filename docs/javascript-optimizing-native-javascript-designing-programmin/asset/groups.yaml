    \n    - Bill Gates\n\n# Chapter 3: JavaScript • 29\n\n## JavaScript\n\nThis chapter\
    \ covers JavaScript commands and operators. It is not a reference manual nor does\
    \ it cover all commands and operators. There are other books and websites that\
    \ offer this information. It does, however, the real-life usage of JavaScript\
    \ in creating applications for JavaScript-enabled devices and computers. I discuss\
    \ ways to optimize your code that it is smaller and faster. I do not rely upon\
    \ third party frameworks to handle needed functionality—everything is written\
    \ in native JavaScript. If you can understand and write that, then you can understand\
    \ and use any of the frameworks. JavaScript libraries and frameworks are just\
    \ more layers of code—they have to be bigger and slower, but they help standardize\
    \ functionality particularly when using projects supported by many programmers.\
    \ They have advantages, particularly if you are a novice programmer, since they\
    \ are widely used and should be error-free. But they are not magic and they have\
    \ many cross-dependencies.\n\n## JavaScript versions\n\nJavaScript was developed\
    \ in 1995 and is known by its un-trademark name as ECMAScript. It has evolved\
    \ over the years through many major version releases and is currently available\
    \ in flavors of version 1.7 or 1.8. Each browser (IE, Firefox, Chrome, Opera,\
    \ etc.) have their own implementation and do not support all the features so to\
    \ be careful in what JavaScript features you rely on if you need cross-browser\
    \ compatibility. To be safe, you should either support the older version used\
    \ by the browsers you must support, or special your code based on the browser\
    \ version. Many of the frameworks and libraries that are available to have cross-browser\
    \ support. Older versions of Internet Explorer, in particular, have many known\
    \ incompatibilities with other browsers. Google has an open JavaScript engine\
    \ V8 which is used in its Chrome browser.\n\nThe latest ECMAScript version 6 is\
    \ supported on most browsers but with varying degrees of compliance. You can find\
    \ a number of sites on the Internet that list capabilities by feature and by browser.\
    \ You should be very careful relying on these new features in your application.\
    \ Some items might be useful like the new `let` and `const` declarations. You\
    \ can use websites like http://www.aniuse.com to verify which features work on\
    \ which browsers.\n\n## Performance\n\nWe have discussed performance in most chapters\
    \ of this book and, in many cases, listed results from actual tests run on several\
    \ browsers. In many cases, running tests thousands of times with various options\
    \ to find that one runs milliseconds faster is not going to magically make your\
    \ application perform better. You should keep the general concepts in mind that\
    \ you code as efficiently as possible. This chapter discusses a few issues about\
    \ performance that you should keep in mind as you design and program your application.\
    \ Keep in mind that the tests recorded throughout this book are on specific browser\
    \ versions available at the time. Browsers are constantly changing and the test\
    \ results can change in direction, either becoming slower or faster. Be sure to\
    \ use tools like Google PageSpeed to improve your code.\n\n## Variable types\n\
    \nJavaScript is not a typed language. This does some problems and also means your\
    \ IDE, if you use one, it's not optimized in the same way it would be for a regular\
    \ typed languages. There are solutions out now like TypeScript, and future plans\
    \ for JavaScript itself to address this shortcoming. In the meantime, you can\
    \ use this \"feature\" to your advantage if you are careful. You just need to\
    \ be aware of how the JavaScript operators work and what the values are that you\
    \ are testing. Even though variables are not strictly typed, there are several\
    \ general types of variables that can be created:\n\n- strings\n- numbers\n- objects\n\
    - booleans\n\nYou need to be aware of variables when you try to perform operations\
    \ on them or you may get unpredictable results. Javascript does try to coerce\
    \ variables of one type to another where possible, as adding a number to the end\
    \ of a string, but you have to understand what is happening or you may get the\
    \ wrong results. If you stay aware of what your data and input fields are in,\
    \ then you should be able to properly handle it in your code.\n\n## Caution with\
    \ global variable declarations\n\nFirst of all, you should keep global declarations\
    \ to a minimum. You can declare some higher object names as globals but try to\
    \ avoid using global declaration for variable names. Assuming that you must declare\
    \ some global variables, there are three general ways to do that you are normally\
    \ concerned with:\n\n```\nglobalVar = 12;\nvar globalVar2 = 13; //using var may\
    \ create a problem\nwindow.globalVar3 = 14;\n```\n\nThese all essentially assign\
    \ your variables to the global object, but they are handled a little differently.\
    \ This is usually not a problem until it comes time to remove them. One way is\
    \ to assign them the value of null, similar to:\n\n```\nglobalVar = null;\nglobalVar2\
    \ = null;\nglobalVar3 = null;\n```\n\nThis sets all three variables to null and\
    \ will free up memory, but since they are in the global context they will not\
    \ be completely removed. Another method for removing these variables is to use\
    \ the delete method, similar to:\n\n```\ndelete globalVar;\ndelete globalVar2;\n\
    delete globalVar3;\n```\n\nThe delete method will normally remove the object.\
    \ However, the global object declared with var (globalVar2) will not be removed\
    \ and will still contain its value. When you try to access these variables again,\
    \ accessing globalVar or globalVar3 will throw a JavaScript error. globalVar2\
    \ still shows 13;\n\n## Use of undefined variable\n\nBe careful testing undefined\
    \ as a user can actually change the value of this variable and your tests may\
    \ fail. I think this is highly unlikely and very easy to spot and correct. Assume\
    \ that your content is all \"trusted\"—that is, it has been reviewed by some and\
    \ not contain malicious code. If you are coding in an environment where you may\
    \ not have control over what is added, then you may have to take that into account\
    \ when deciding how to test variables. You would also have to add a more error\
    \ checking in this instance.\n\n## Comparisons with == or ===\n\nJavaScript has\
    \ two equality operators that can be used to compare variables and constants.\n\
    \n| Operator | Result |\n| :--- | :--- |\n| == type-converting equality | JavaScript\
    \ will attempt to coerce the variables to the same type and compare them to see\
    \ if they are equal |\n| === strict equality | Variables must be same type and\
    \ have same value to be considered equal |\n\nA few points about these operators:\n\
    \n- Expressions comparing objects are only true if they are comparing the same\
    \ object.\n- Null and undefined are considered the same using ==, but not using\
    \ ===.\n- As shown below, the performance of both operators is essentially the\
    \ same.\n\nThe use of == to compare values can sometimes be OK if you know what\
    \ you are doing. Using the strict compare === ensures that the values are both\
    \ in type and value there may be the times that the regular compare would be sufficient.\
    \ Some places you need to be careful include:\n\n- Reading values from cookies\
    \ or similar storage. These normally be internally represented as strings and\
    \ the normal coercion may not work. You will have to force the numeric value you\
    \ read in to be a number using something like a parseInt().\n- If you are careful,\
    \ you can use the coercing compare to make short compare statements. This is discussed\
    \ in more detail in the section about testing for falsy values.\n"
