  - '[PAGE 135]


    # Loading program files


    There are a number of ways to load your program files—the HTML, CSS, and JavaScript
    files that make up your application. The method you decide on will most likely
    be influenced by the general use of your program and the variables that you want
    to optimize for. Some of the factors to consider include:


    +   - You can use script tags in your HTML to load your JavaScript files. The
    general practice is to put these at the end of the HTML so that the UI will load
    and display as fast as possible. Most browsers will allow multiple files to be
    fetched but they will block execution as they are loaded and parsed. There is
    an advantage to loading fewer, bigger files but these will block longer.

    - You may want to delay loading some of your files that are not needed right away
    to provide a better user experience. You would include the script and style tags
    in your main HTML that will just the bare code to display the first UI. The JavaScript
    loaded would contain the code to dynamically load the rest of the application
    as needed.

    - You may want to programmatically load files so that you can load different files
    based on user settings or preferences. Your initial script file loads conditional
    logic that uses config values or the information in the URL to determine which
    files to load. This could be helpful if your application supports different brands.

    - You may want to consider using a loader like require.js to load files only when
    needed. This is helpful if your application may never need certain files.

    - You should consider combining your files together there is overhead for each
    fetch. You can compress each file using any number of existing compressors or
    compactors. Using minified code can make debugging more difficult. To use compressed
    code where the spaces and comments have been removed, but not minified code where
    the variable and function names have been changed. There is some potential danger
    with minified names in JavaScript because of its loose typing and use of eval.

    - You should also consider the effect of caching on your file load times. Caching
    common files that are frequently fetched may decrease your load times. The downside
    of caching is that new files that have changed may not be loaded. This is more
    critical when developing your app or if your code changes often.'
- md: "\n# Using a file loader\n\nI tend not to use require.js because I normally\
    \ want to load all the files I need in the order I want them when the program\
    \ starts, or at least after I have been able to display the first screen. Using\
    \ native JavaScript runtime tends to keep the total code size small. I usually\
    \ have a small index.html file that loads a index.js file that contains the following\
    \ loader code. It loads all from an array of filenames.\n\nThe runtime also has\
    \ an option to ensure that cached files are not returned. If the variable cachebust\
    \ is set to true, a random string is added to the end of each requested URL to\
    \ ensure any cache is bypassed. The filesToLoad array contains the name and type\
    \ of all the files you want to load. This array can be in file or loaded from\
    \ a config file.\n\nIf needed, you can also change the name or location of the\
    \ files you are loading based on user settings or runtime parameters.\n\n## 1.\
    \ Set up a runtime to add DOM elements\n\n```javascript\n//\nif (window.addEventListener(function(type,\
    \ attributes, innerHTML) {\n  var attributes = attributes || {};\n  var element\
    \ = document.createElement(type);\n  if (innerHTML) element.innerHTML = innerHTML;\n\
    \  for (var key in attributes) {\n    if (key == \"class\") {\n      element.setAttribute(\"\
    className\", attributes[key]);\n    } else if (key == \"style\") {\n      element.style.cssText\
    \ = attributes[key];\n    } else {\n      element.setAttribute(key, attributes[key]);\n\
    \    }\n  }\n  return element;\n});\n\n// EXCEPT IE\nvar createDOMElement = function(type,\
    \ attributes, innerHTML) {\n  attributes = attributes || {};\n  var element =\
    \ document.createElement(type);\n  if (innerHTML) element.innerHTML = innerHTML;\n\
    \  for (var key in attributes) {\n    element.setAttribute(key, attributes[key]);\n\
    \  }\n  return element;\n};\n```\n\n## 2. Decide if you want to bypass cache\n\
    \n```javascript\nvar cacheBust = true; //set to true to bypass cache\n```\n\n\
    ## 3. Identify the head element of your main HTML file\n\n```javascript\nvar xTag_Head\
    \ = document.getElementsByTagName(\"head\")[0];\n```\n\n## 4. Set up array that\
    \ contains details of files you want to load\n\n```javascript\nvar filesToLoad\
    \ = [];\nfilesToLoad.push({type:\"js\", url:\"js/util.js\"});\nfilesToLoad.push({type:\"\
    css\", url:\"css/main.css\"});\nfilesToLoad.push({type:\"html\", url:\"main.html\"\
    });\n```\n\n## 5. Set up function you will call to load all files from the array\n\
    \n```javascript\nvar loadFiles = function() {\n  var nextobj = filesToLoad.shift();\n\
    \n  // NEXT FILE IN LIST\n  if (nextobj) {\n    loadFile(nextobj,loadFiles);\n\
    \    // ALL DONE\n  } else {\n    init(); //the function to start your program\n\
    \  }\n}\n```\n\n## 6. Set up function that accurately loads file\n\n```javascript\n\
    var loadFile = function(obj,callback) {\n  var fileref;\n  var newurl = obj.url;\n\
    \  if (cacheBust) newurl += '?ts=' + (new Date()).getTime();\n\n  //CSS\n  if\
    \ (obj.type == \"css\") {\n    fileref=document.createElement(\"link\");\n   \
    \ fileref.setAttribute(\"rel\", \"stylesheet\");\n    fileref.setAttribute(\"\
    type\", \"text/css\");\n    fileref.setAttribute(\"href\", newurl);\n  }\n\n \
    \ //CSS FILES DON'T FIRE ONLOAD-SET TIMER TO CHECK IF LOADED\n  var interval_id\
    \ = setInterval(function() {\n    try {\n      if (fileref.sheet && fileref.sheet.cssRules.length)\
    \ {\n        clearInterval(interval_id);\n        setTimeout(function() {if (callback)\
    \ callback());},10);\n      }\n    } catch (e) {\n    }\n    xTag_Head.appendChild(fileref);\n\
    \  },100);\n\n  // JAVASCRIPT FILES\n  else if (obj.type == \"js\") {\n    fileref\
    \ = document.createElement(\"script\");\n    fileref.setAttribute(\"type\", \"\
    javascript\");\n    fileref.setAttribute(\"src\", newurl);\n\n    fileref.onload\
    \ = function () {\n      fileref.onload = fileref.onereadychange = null;\n   \
    \   if (xTag_Head && fileref.parentNode &&\n      fileref.type===\"text/javascript\"\
    ) xTag_Head.removeChild(fileref);\n      setTimeout(function() {if (callback)\
    \ callback();},10);\n    }\n    xTag_Head.appendChild(fileref);\n  }\n  //HTML\
    \ FILES\n  } else if (obj.type == \"html\") {\n    var req = new window.XMLHttpRequest;\n\
    \    req.onereadychange = function() {\n      if (req.readyState == 4 && (req.status\
    \ == 0 ||\n      req.status == 200)) {\n        try {\n          var dv2 = createElement(\"\
    div\",{id:obj.id,\n          'class ':obj.sclass},req.responseText);\n       \
    \   document.getElementById(obj.element).appendChild(dv2);\n        } catch (e)\
    \ {\n          console.log(\"ERROR LOADING \"+newurl);\n        }\n        setTimeout(function()\
    \ {if (callback) callback();},10);\n      }\n      req.open(\"GET\", newurl, true);\n\
    \      req.send(\"\");\n    }\n  }\n}\n```\n\n## 7. Now, start the loading\n\n\
