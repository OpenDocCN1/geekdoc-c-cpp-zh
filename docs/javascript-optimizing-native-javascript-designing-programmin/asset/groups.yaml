    ## 面试中的常见问题类型


    你可能会被问到几类常见问题。市面上有很多书籍和博客列出了各种面试题，从技术问题到奇特的脑筋急转弯。对这些请保持保留态度，其中很多虽然主意不错，但可能有些过头。你也会在很多地方看到这些问题被列为“常见”问题。查看这些来源是有价值的，因为在很多情况下，面试官也在寻找可以问候选人的问题。记住学习基础知识——我被问过的很多问题与我做过的编程完全没有关系。一位面试官告诉我，如果他们有一个候选人能回答所有困难或刁钻的问题，那可能意味着这个人找工作找太久了，没人想要。你将涉及的问题类型包括：


    - **经验/背景。** 你在何所大学就读；上过哪些课程；获得了什么学位等。确保你不要夸大——这太容易查出来。工作经历的简要总结会有帮助。


    - **编程题。** 这些问题将测试你对编程的了解，在本文中是：JavaScript、HTML 和 CSS。下面的部分列出了你应该熟悉的某些常见领域。


    - **项目管理。** 你处理项目的能力如何，特别是那些有多个程序员的项目？你是否用过 Agile（敏捷）等开发工具？


    - **行为/管理。** 准备好回答有关你与前同事合作、如何解决工作问题、如何处理困难员工等的问题。


    - **脑筋急转弯/陷阱题。** 这些问题五形百态。有的要求你估算汽车里能装多少个乒乓球，需要多少桶油漆来喷 747 飞机的翼……乒乓球问题通常需要你做出合理的猜测，而飞机问题可能简单地回答“一桶——如果足够的话”。这些答案大部分都比你想象的要简单。仔细听问题。这些问题对于判断你解决问题或跳跃性思维的能力很有价值。


    - **蠢问题。** “如果你是一种动物，你会成为哪种动物？”如果你被要求给出一个有意义的答案，你就被这些问题困住了。


    ## 通用问题


    你可能会被问到一些与职位技术要求无关的通用问题。然而，它们非常重要，你对这些问题的回答可能比你提供的任何技术回答都重要。务必提前演练，以便有连贯的回答。这些类型的问题包括：


    - 你职业生涯中最让你感到自豪的是什么？


    - 在我们公司工作有什么吸引你的地方？


    - 如果你明天中了彩票，你会做什么？


    - 描述你与老板合作良好的经历，以及你遇到问题的经历。


    - 用一个词或一个短语来描述你自己。


    - 你还在看哪些其他工作或公司？


    - 你为什么要离开（或正要离开）目前的工作？


    - 你的优点和缺点是什么？


    - *（如果适用)* 失业了一段时间。你最近在做什么？


    ## 编程题


    我在找工作面试时最令人沮丧的事情之一是，无论我准备得多么充分，面试官总是会问一些我没有准备过的问题。这也是为什么尽可能参加多次面试的另一个原因。以下列表包含了作为
    JavaScript UI 职位应该掌握的专业领域。你需要重点关注与你申请的职位相关的领域。


    ### JavaScript


    - 面向对象：了解创建对象的不同方法；原型（prototypes）原理；如何使用 `this` 关键字。


    - 递归：能够编写递归函数。


    - 大 O 表示法：知道它的含义以及如何应用于编程。你应该了解这一点，因为你的任何回答都可能需要考虑到这个。


    - 链表：知道如何创建链表以及你应该如何使用它。


    - 局部与全局作用域：优缺点；提升（hoisting）的工作原理；命名空间。


    - 事件处理：冒泡和委托；事件；事件传播。


    - 闭包：什么创建了闭包以及如何使用它们；如何在作用域内正确引用变量；JavaScript 中的作用域。


    - 排序：如何在 JavaScript 中进行排序。


    - 浏览器检测：特性检测（feature detection）。


    - 循环：了解各种类型的循环以及何时使用每种。


    - 模块模式：它们是什么以及你为什么要关注它们；它们如何让变量不在全局作用域中。


    - 等等：知道 `==` 和 `===` 的区别；使用虚假比较。


    - DOM：使用 `document.getElementById`、`document.querySelectorAll` 和相关选择器访问 DOM 元素；哪些方法会强制
    DOM 重新布局。


    - 字符串：如何拼接；将字符串与数字拼接时会发生什么。


    - 对象、数组和关联数组。


    ### HTML


    - 格式：理解 HTML 页面及其部分的通用格式。

    - 语义化 HTML：加强部分含义的元素名称。

    - DOM：理解它是如何构建和访问的。

    - 响应式网页：了解响应式网站的概念以及如何创建。

    - 创建 HTML 的不同方式：模板；使用 JavaScript 动态创建。

    - 单页应用（SPA）：它们是什么以及为什么要使用它们。

    - 常见元素：它们的标签和属性，包括 `id`、`class`、`style` 和 `data`。


    ### CSS


    - 样式：使用内联样式对比类。

    - 盒模型：它是怎样的以及为什么重要；`box-sizing` 属性。

    - 居中：如何在两个方向上都居中元素。

    - 伪元素和伪类：如何以及何时使用它们。

    - 属性：了解常用属性，如 `position`、`display`、`left`、`top`、`right`、`bottom`、`margin`、`padding`
    等。

    - CSS 分组与嵌套：选择器。

    - CSS 编译器：Sass、LESS 以及其他预处理器的优。

    - CSS 规范化：重置（resets）的使用；`normalize.css`。

    - 雪图（sprites）：它们是什么以及为什么要使用它们。


    ### 服务器 API


    如果你是全栈，你需要更多地了解 PHP 和服务器端编程。这里的建议主要针对客户端编码。


    - JSON 和 JSON：它们的不同之处；何时使用。

    - 同步与异步请求。

    - Ajax：获取数据；回调函数（callbacks）。

    - 缓存：它是什么以及如何控制。


    ## 设计模式


    JavaScript 常见的设计模式以及它们如何封装代码并使其易于维护。理解 MVC 模式——模型（model）、视图（view）、控制器（controller）。


    ## 框架和库


    你应该了解并学习的准确框架和库取决于你申请的职位要求。


    - jQuery

    - Angular、Backbone、Bootstrap

    - 模板引擎：Mustache、Underscore、HandlebarsJS


    ## 术语


    有很多你应该了解的编程术语、概念、方法和框架。务必让自己熟悉它们，但不要装懂。


    ## 其他技能


    - 如何调试

    - 了解浏览器之间的通用区别

    - 项目管理工具。了解一些如何管理项目。熟悉敏捷系统是如何运作的。


    ## 逻辑/脑筋急转弯题


    你可能会被问到一个或多个不直接相关编程的问题，而是测试你解决问题的能力。有很多你无法学习所有的问题，但大多数属于几类，具有类似的解决方案。在尝试解决问题时保持说话，说出你的思维过程。记住，面试官并不是问关于技术技能的问题，而是测试你如何解决问题。


    - 通用逻辑。这些要求你分析问题并实际推导出解决方案。

    - 两个答案——简单和复杂。这些问题有两个可能的答案：一个需要复杂的数学或编程解决方案，另一个在知道后非常简单易见。由于你正在面试编程工作，很容易假设解决方案是复杂的。只需确保你没有错过简单的那个。这对于
    UI 设计师/程序员来说实际上是一个很好的测试，因为简单的解决方案通常更好。这些问题看起来可能像：

    火车相距 100 英里并以每小时 50 英里的速度迎面。一只蝇从一列火车起飞，以 75 英里的速度飞向另一列火车，到达另一只火车时立即返回（假设没有摩擦损失时间或速度）。蝇不断重复直到火车碰撞。蝇飞了多远？


    '
