    # Loading program files\n\nThere are a number of ways to load your program files—the\
    \ HTML, CSS, and JavaScript files that make up your application. The method you\
    \ decide on will most likely be influenced by the general use of your program\
    \ and the variables that you want to optimize for. Some of the factors to consider\
    \ include:\n\n- You can use script tags in your HTML to load your JavaScript files.\
    \ The general practice is to put these at the end of the HTML so that the UI will\
    \ load and display as fast as possible. Most browsers will allow multiple files\
    \ to be fetched but they will block execution as they are loaded and parsed. There\
    \ is an advantage to loading fewer, bigger files but these will block longer.\n\
    - You may want to delay loading some of your files that are not needed away to\
    \ provide a better user experience. You would include the script and style tags\
