  - '[PAGE 71]


    Newer browsers vary on how object methods and properties are stored and accessed.
    Some have been optimized to provide fast property lookup by using offsets instead
    of using a hash map. You don''t want your lookups to be forced to use a hash map—want
    the fast offset method. One thing you want to avoid is to change a "fast" lookup
    into a "slow" lookup. On browsers, using the delete method will cause this to
    happen, resulting in more memory used and slower performance. Sparse arrays are
    slower for a similar reason. Instead, you should just set the property to null
    which will free up memory but still leave the property set to null. Let''s look
    at three consequences associated with removing object properties (this doesn''t
    apply to the object itself—you can still remove the entire object.)


    # 1. Speed in removing


    I analyzed the relative performance of removing object properties using the delete
    method just setting the property (method or variable) to null. Obviously, if you
    leave the property alone, then there will be no hit, but using that memory could
    be freed up. Setting to null also in memory being used. The results were:


    | PERFORMANCE TESTING | | | |

    | OPS (bigger is better) | Safari | Chrome | Firefox |

    | 1. delete obj.doThat; | 95 | 84 | 34 |

    | 2. obj.doThat = null; | 5,029 | 1,227 | 1,889 |


    > Test 4-2: http://www.nativejavascript.com/tests/Test-ObjectsWithDelete.html


    This measured how long it takes to remove properties using the two methods. Setting
    the property to null will still have a significant effect in performance. I noticed
    that the times of these methods varied dramatically over browser versions so you
    should decide which method to use.


    # 2. Speed in accessing


    Once the properties were removed, I tested the performance of accessing the remaining
    properties of the test. I measured the access of the object properties assuming
    I did not delete any properties to begin with.


    | PERFORMANCE TESTING | | | |

    | OPS (bigger is better) | Safari | Chrome | Firefox |

    | 1. obj.doThat5(); //deleted other methods | 73 | 1 | 45 |

    | 2. obj2.doThat5(); //set other methods to null | 75 | 44 | 56 |

    | 3. obj.doThat5(); //no methods removed | 74 | 44 | 47 |


    > Test 4-3: http://www.nativejavascript.com/tests/AccessingDeletedProperties.html


    This test showed different results using recent browser versions. Using delete
    used to be much slower but the difference has almost disappeared on Chrome which
    is dramatically slower.


    +   - The recommended method considering all these factors is to use your unused
    properties to null unless there is some reason that you have to use delete.'
- md: "\n## 66 JavaScript: Optimizing Native JavaScript\n\n## 3. Memory usage\n\n\
    It is always hard to accurately measure memory of items that will be garbage collected;\
    \ you still want to avoid creating garbage in the first place. However, the delete\
    \ method can free up substantially more memory than setting object properties\
    \ to `null`. Now that the performance of accessing objects with deleted properties\
    \ has to improve, you may want to delete to get rid of unused properties.\n\n\
    ### Assigning object properties\n\nWhen assigning properties to singleton objects,\
    \ you can save some code space and make your code easier to read by assigning\
    \ them when the object is created. You should already be using the `{}` method\
    \ instead of making `new Object()` as we discussed in an earlier chapter. And\
    \ instead of assigning properties like:\n\n```javascript\nvar newobj = {};\nnewobj.prop\
    \ = \"a\";\nnewobj.prop2 = \"b\";\n```\n\nuse:\n\n```javascript\nvar newobj =\
    \ {\n  prop1: \"a\",\n  prop2: \"b\"\n};\n```\n\nor use:\n\n```javascript\nvar\
    \ newobj = {\"prop1\":\"a\",\"prop2\":\"b\"};\n```\n\nNOTE: If object property\
    \ names are not valid variable names, you can set their values using the `newobj[\"\
    prop name\"]` method or surround the name with quotes. Invalid names include those\
    \ with embedded blanks or hyphens or starting with a number. The speeds in the\
    \ tests below were almost the same whether this method was used or the original\
    \ method shown above.\n\n![](img/10c5df588c0c6e2580324246d7b5735f_72_0.png)\n\n\
    | | Safari | Chrome | Firefox |\n|---|---|---|---|\n| 1. Object first, then properties\
    \ | 65 | 4 | 1 |\n| 2. Object and properties at same time | 72 | 6 | 51 |\n| 3.\
    \ Array first, then elements | 3 | 1 | 4 |\n| 4. Array and elements at same time\
    \ | 73 | 9 | 48 |\n\nTest 4: http://native.javascript.com/tests/Test-AssigningObjectProperties.html\n\
    The above result tests the speed of setting properties using two methods, and\
    \ also similar properties for comparison. This highlights:\n\n- Firefox was very\
    \ fast setting values on both objects and arrays if they were done at the same\
    \ time the object was declared. Separately, Firefox was really slow.\n- Setting\
    \ the values at the same time as the array was much faster on Chrome and Firefox.\n\
    \n- Results will vary with the browsers you need to support and the actual number\
    \ of properties you need to set, but in terms of the speed of setting values,\
    \ you most likely set them, if possible, at the same time the object is declared.\
    \ And, again if possible, arrays may be a better choice in terms of speed of setting.\n\
    \n### Getters and setters\n\nThe earlier methods of using `_defineGetter()` and\
    \ `_defineSetter()` to define getters and setters have been deprecated. You should\
    \ use get or set operators if you need this functionality. The general use of\
    \ get and set is shown in the following object declaration:\n\n```javascript\n\
    var obj = {\n  zip: 0,\n  get zipcode() {\n    return this.zip;\n  },\n  set zipcode(newval)\
    \ {\n    this.zip=newval;\n  },\n  readzip: function() {\n    return this.zip;\n\
    \  }\n};\nObject.defineProperty(obj, 'arecode', {\n  value: 925\n});\nobj.zipcode\
    \ = 94563; //use setter to set value of obj.zip\nvar newzip = obj.zipcode; //use\
    \ getter to get value of obj.zip\nvar newzip = obj.readzip(); //use function to\
    \ get value of obj.zip\n```\n\nThe following tests show the differences between\
    \ using getters and setters, across accessing the property directly using a regular\
    \ object to retrieve the value.\n\n| | PERFORMANCE TESTING | Safari | Chrome |\
    \ Firefox |\n|---|---|---|---|---|\n| 1. Setting object property using setter\
    \ | 25 | .1 | 19 |\n| 2. Setting object property directly | 26 | 2 | 16 |\n| 3.\
    \ Reading object property using getter | 24 | .1 | 20 |\n| 4. Reading object property\
    \ directly | 25 | 3 | 26 |\n| 5. Reading object property using function | 25 |\
    \ 1 | 20 |\n\nTest 4-5: http://www.nativejavascript.com/tests/Test-GettersAndSetters.html\n\
    \nWhat does this show? There are a couple of concerns. These are new operators,\
    \ and I have seen the browsers steadily improving, except for Chrome. Now, we\
    \ can see:\n\n- Except for Chrome, you pretty can use whatever method is easiest.\
    \ If you need to support Chrome, you should consider bypassing the use of new\
    \ getter and setter for now.\n\nWhy would you use these types of getters and setters?\n\
    \n1. You could use a setter to validate or change the value passed in for the\
    \ variable, or even change multiple object properties with the value passed in.\
    \ Of course, you could also do this with a regular method which might be faster.\n\
    2. You could simulate an overloaded method (which is not allowed in JavaScript)\
    \ by adding a setter that allows the user to pass in a variable of different types\
    \ (e.g. string, number, or object). Again you could also do this with a regular\
    \ method.\n3. You could use a getter to perform some calculation before returning\
    \ the value. This is useful when the value depends on other properties.\n\n###\
    \ Using properties\n\nThere are several ways to access properties of an object.\
    \ The following example shows how--- can be used.\n\n```javascript\nvar Cobj =\
    \ function () {\n  this.a = 1;\n  this.b = 2;\n  this.c = function () {\n    console.log(\"\
    a is \", this.a);\n  };\n  this.d = function () {\n    setTimeout(function ()\
    \ {\n      console.log(\"b is \", this.b);\n    }, 100);\n  }\n}\n\nvar obj =\
    \ new Cobj();\nobj.c();\nobj.d();\n```\n\n### Enumerating properties\n\nThere\
    \ are several ways to enumerate the properties of objects. Some may look easier\
    \ but may have slow performance. These methods include:\n\n- for (var name in\
    \ obj). Use this to loop through all properties of the object. This will display\
    \ all properties including inherited properties unless you check for `obj.hasOwnProperty(name)`\
    \ for each name.\n  ```javascript\n  for (var name in obj) {\n    var val = obj[name];\n\
    \  }\n  ```\n- Object.keys(obj). This returns an array of all enumerable property\
    \ names. Use this to get the property values if needed.\n  ```javascript\n  var\
    \ arr = Object.keys(obj);\n  var len = arr.length;\n  for (var i=0; i < len; i++)\
    \ {\n    var val = obj[arr[i]];\n  }\n  ```\n- Object.getOwnPropertyNames(obj).\
    \ This returns an array of all properties, enumerable or not, of an.\n\n| | PERFORMANCE\
    \ TESTING | OPS (bigger is better) | | |\n| --- |---|---|---|\n| 1. for (var name\
    \ in obj) | 25 | 5 | 11 |\n| 2. Object.keys(obj) | 2 | 4 | 3 |\n| 3. Object.getOwnPropertyNames(obj)\
    \ | 2 | 1 | 3 |\n\nTest 4-6: http://www.nativeJavaScript.com/tests/Test-EnumerateObjectProps.html\n\
    \nThe fastest way on all browsers is to use the standard for (var name in obj).\
    \ There may be other reasons to use one of the other methods but for enumerate\
    \ this is fastest.\n"
  mdcn: "\n\n## 66 JavaScript: 优化原生 JavaScript\n\n## 3. 内存使用\n\n要准确测量将被垃圾回收项占用的内存总是很困难的；你从初就应该避免创建垃圾。然而，`delete`\
    \ 方法释放的内存通常比将对象属性设置为 `null` 要多得多。既然现在访问已删除属性对象的性能必须有所提高，你可能想要使用 `delete` 来移除未使用的属性。\n\
    \n### 给对象属性赋值\n\n在为单例对象分配属性时，你可以在创建对象时进行赋值，从而节省一些代码空间并使代码更易读。正如我们在前面的章节中讨论过的，你应该已经在用\
    \ `{}` 方法而不是使用 `new Object()`。而且与其像这样赋值属性：\n\n```javascript\nvar newobj = {};\n\
    newobj.prop = \"a\";\nnewobj.prop2 = \"b\";\n```\n\n不如使用\n\n```javascript\nvar\
    \ newobj = {\n  prop1: \"a\",\n  prop2: \"b\"\n};\n```\n\n或者使用：\n\n```javascript\n\
    var newobj = {\"prop1\":\"a\",\"prop2\":\"b\"};\n```\n\n注意：如果对象属性名不是有效的变量名，你可以使用\
    \ `newobj[\"prop name\"]` 方法为它们设置值，或者用引号括名称。无效名称包括包含空格、连字符或以数字开头的名称。在下面的测试中，无论使用这种方法还是上面所示的原始方法，速度几乎是相同的。\n\
    \n![](img/10c5df588c0c6e2580324246d7b5735f_72_0.png)\n\n| | Safari | Chrome |\
    \ Firefox |\n|---|---|---|---|\n| 1. 先对象，后属性 | 65 | 4 | 1 |\n| 2. 同时进行对象和属性 |\
    \ 72 | 6 | 51 |\n| 3. 先数组，后元素 | 3 | 1 | 4 |\n| 4. 同时进行数组和元素 | 73 | 9 | 48 |\n\n\
    测试 4: http://native.javascript.com/tests/Test-AssigningObjectProperties.html\n\
    上述结果测试了使用两种方法设置属性的速度，以及用于对比的类似属性。这突显了：\n\n- 如果在声明对象的同时进行操作，Firefox 在对象和数组上的设置值速度都非常快。单独操作，Firefox\
    \ 速度非常慢。\n- 在 Chrome 和 Firefox 上，与数组同时设置值的速度要快得多。\n\n- 结果将根据你需要支持的浏览器以及你需要设置的属性实际数量而异，但在设置值的速度方面，如果可能，你最好在声明对象的同时进行设置。再次，如果可能，从设置速度来说，数组可能是更好的选择。\n\
    \n### Getter（访问器）和 Setter（赋值器）\n\n早期使用 `_defineGetter()` 和 `_defineSetter()` 定义\
    \ getter 和 setter 的方法已弃用。如果你需要此功能，应该使用 `get` 或 `set` 运算符。get 和 set 的通用用法在下述对象声明中所示：\n\
    \n```javascript\nvar obj = {\n  zip: 0,\n  get zipcode() {\n    return this.zip;\n\
    \  },\n  set zipcode(newval) {\n    this.zip=newval;\n  },\n  readzip: function()\
    \ {\n    return this.zip;\n  }\n};\nObject.defineProperty(obj, 'arecode', {\n\
    \  value: 925\n});\nobj.zipcode = 94563; //使用 setter 设置 obj.zip 的值\nvar newzip\
    \ = obj.zipcode; //使用 getter 获取 obj.zip 的值\nvar newzip = obj.readzip(); //使用函数获取\
    \ obj.zip 的值\n```\n\n以下测试显示了使用 getter 和 setter 与直接使用普通对象访问属性获取值之间的差异。\n\n| | 性能测试\
    \ | Safari | Chrome | Firefox |\n|---|---|---|---|---|\n| 1. 使用 setter 设置对象属性\
    \ | 25 | .1 | 19 |\n| 2. 直接设置对象属性 | 26 | 2 | 16 |\n| 3. 使用 getter 读取对象属性 | 24\
    \ | .1 | 20 |\n| 4. 直接读取对象属性 | 25 | 3 | 26 |\n| 5. 使用函数读取对象属性 | 25 | 1 | 20 |\n\
    \n测试 4-5: http://www.nativejavascript.com/tests/Test-GettersAndSetters.html\n\n\
    这说明了什么？有几个关注点。这些是新运算符，我看到浏览器一直在稳步改进，Chrome 除外。现在，我们可以看到：\n\n- 除了 Chrome 之外，你可以使用任何最简单的方法。如果你需要支持\
    \ Chrome，目前应该考虑跳过使用新的 getter 和 setter。\n\n你为什么要使用这类 getter 和 setter？\n\n1. 你可以使用\
    \ setter 来验证或更改传递给变量的值，甚至可以使用传递的值更改多个对象属性。当然，你也可以通过普通方法做到这一点，后者可能更快。\n2. 你可以通过添加一个\
    \ setter 来模拟重载方法（这在 JavaScript 中是不允许的），该 允许用户传递不同类型的变量（例如字符串、数字或对象）。再次，你也可以通过普通方法来实现。\n\
    3. 你可以使用 getter 在返回值之前执行某些计算。当值依赖于其他属性时，这非常有用。\n\n### 使用属性\n\n有多种方法访问对象的属性。以下示例展示了如何使用：\n\
    \n```javascript\nvar Cobj = function () {\n  this.a = 1;\n  this.b = 2;\n  this.c\
    \ = function () {\n    console.log(\"a is \", this.a);\n  };\n  this.d = function\
    \ () {\n    setTimeout(function () {\n      console.log(\"b is \", this.b);\n\
    \    }, 100);\n  }\n}\n\nvar obj = new Cobj();\nobj.c();\nobj.d();\n```\n\n###\
    \ 枚举属性\n\n有多种方法枚举属性。某些方法看起来更简单，但性能可能较低。这些方法包括：\n\n- for (var name in obj)。使用它遍历对象的所有属性。除非对每个名称检查\
    \ `obj.hasOwnProperty(name)`，否则它将显示所有继承属性。\n  ```javascript\n  for (var name in\
    \ obj) {\n    var val = obj[name];\n  }\n  ```\n- Object.keys(obj)。返回所有可枚举属性名的数组。如果需要，使用它获取属性值。\n\
    \  ```javascript\n  var arr = Object.keys(obj);\n  var len = arr.length;\n  for\
    \ (var i=0; i < len; i++) {\n    var val = obj[arr[i]];\n  }\n  ```\n- Object.getOwnPropertyNames(obj)。返回所有属性（无论是否可枚举）的数组。\n\
    \n| | 性能测试 | OPS（越大越好） | | |\n| --- |---|---|---|\n| 1. for (var name in obj)\
    \ | 25 | 5 | 11 |\n| 2. Object.keys(obj) | 2 | 4 | 3 |\n| 3. Object.getOwnPropertyNames(obj)\
    \ | 2 | 1 | 3 |\n\n测试 4-6: http://www.nativeJavaScript.com/tests/Test-EnumerateObjectProps.html\n\
    \n所有浏览器快的方法是使用标准的 for (var name in obj)。可能有其他原因使用其他方法，但对于枚举来说，这种方法最快。\n\n"
