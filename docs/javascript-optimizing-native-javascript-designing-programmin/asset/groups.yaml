    \ decide on a standard and enforce that standard.\n"
  mdcn: "\n\n## 1 JavaScript: 优化原生 JavaScript\n\n然而，这种方法也有其缺点。你的团队（如果你是单兵作战，则是你自己）必须决定正确的方法。一些缺点包括：\n\
