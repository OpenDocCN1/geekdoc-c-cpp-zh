    \ nothing of your object with the index value. This is another reason not to place\
    \ braces on separate lines, discussed in a following section. Some environments\
    \ will also flag code that is terminating semicolons.\n\n```javascript\nfunction\
    \ doThis(str) {\n  return\n    index: 1;\n} // Bad Code!\n```\n\n## Operator precedence\
    \ in formulas\n\nJavaScript, like all computer languages, has a set order it uses\
    \ to analyze formulas operators. For example, multiplication operations are carried\
    \ out before addition operations. You can find the list in any number of articles\
    \ or books. You should err on the side of being overly precise, even if it means\
    \ a few extra characters. Don't assume that everyone reading your code remembers\
    \ the order of precedence for operators + * / ^. Just immediately know how the\
    \ following formula is calculated?\n\n```javascript\nvar prec = x + y / 4 - 2\
    \ * z % 5;\n```\n\nEven if you do, putting parentheses wherever appropriate can\
    \ only help a reader understand what you are trying to do. It also wouldn't hurt\
    \ to add some comments clarifying what you are attempting to do.\n\n## Location\
    \ of braces\n\nThis is a seemingly trivial formatting decision that creates heated\
    \ arguments every time it is discussed. Do I write my code like:\n\n```javascript\n\
    if (a == b) {\n  var a = 5;\n}\n```\n\nOr like:\n\n```javascript\nif (a == b)\
    \ {\n  var a = 5;\n}\n```\n\nTo me, the case is closed. The second method is much\
    \ more compact, easier to read, and friendlier to some code analysis tools like\
    \ JSLint. There is an advantage to being able to see more code on the screen at\
    \ one time as you page through your program. The same rule applies to other blocks\
    \ as for loops and switch statements. Unfortunately, it will probably be a subject\
    \ of debate every place you work. Programmers coming from different languages\
    \ tend to prefer the first style.\n\n## Strings—Single or double quotes\n\nIn\
    \ JavaScript, you can normally use single or double quotes interchangeably. There\
    \ are cases where you have to pay attention to which you are using:\n\n- 1. There\
    \ are times you have to use double quotes inside quotes, like setting HTML from\
    \ JavaScript:\n  `var str = '<div style=\"left:10px;\">text</div>';` \n  There\
    \ you will have to use one type for the outside quotes and the other type for\
    \ the inside one. You can do it either way for this example, but it is usually\
    \ better to use single quotes for the outside string quotes when making HTML strings.\n\
    - 2. JSON. The JSON standard specifies that all key-value pairs should be in double,\
    \ single...\n\nIn general, you should be as consistent as you can across your\
    \ entire code base. Don't arbitrarily alternate between styles. One problem that\
    \ arises if you are inconsistent, or if programmers working on the same code base\
    \ use different methods, involves global searching. Often you are looking for\
    \ a specific word in a string that may appear in several places, you may try to\
    \ search for ('string'). If you are unsure of what quote symbols you use, you\
    \ will also have to search for ('string'). And you may close strings that you\
    \ are entering with the incorrect symbol if you are not consistent, although many\
    \ IDE environments catch this error.\n\n## Lines and spacing\n\n### Line length\n\
    \nYou should try to keep the length of your code lines to 80 characters or less.\
    \ It is often advantageous to be able to see your entire line of code without\
    \ horizontal scrolling. You can break a long line if necessary, by adding a break\
    \ after an operator like a comma. The next line...\n\n### Tabs or spaces\n\nMany\
    \ editors do this automatically. You may want to indent each level by two or spaces.\
    \ You also want all braces that are logically connected. It will make it much\
    \ easier to check your code for unmatched braces. This also applies to HTML. So\
    \ your code should look like:\n\n```javascript\nfor (var i = 0; i < 10; i++) {\n\
    \  for (var j = 0; j < 5; j++) {\n    if (i == 0) {\n      //code here\n    }\n\
    \  }\n}\n```\n\n### Whitespace around operators\n\nThe issue about whether to\
    \ include spaces around operators is nullified by some compilers. It is valid.\
    \ Some formatters prefer the second method. Instead of:\n\n```javascript\nvar\
    \ x=2;\nif(x==2) {\n```\n\nuse\n\n```javascript\nvar x = 2;\nif (x == 2) {\n```\n\
    \n### Lining up equals signs\n\nAnother formatting option you may see... to line\
    \ up the equal signs or object properties when successive lines are very similar.\
    \ If you are compressing code, these spaces will be removed and sometimes the\
    \ extra indent makes it easier to read. It might look like:\n\n```javascript\n\
    var thisum = 5;\nvar idx = 12;\nvar str = 'name';\nvar obj = {\npl: 'value',\n\
    dateprop: 123,\nidx: 1\n}\n```\n\n## Variable and function names\n\nThere are\
    \ a number of naming conventions that are generally accepted as well as others\
    \ that are sometimes contentious. There are a few restrictions on naming that\
    \ are enforced by JavaScript engines, including:\n\n- **Case-sensitive.** JavaScript\
    \ names are case-sensitive. Thus, thisVar and ThisVar are treated as separate\
    \ variable names.\n- **Reserved words.** There are a number of words that are\
    \ reserved by the JavaScript language. You can see a complete list at developer.mozilla.org/en-US/Web/JavaScript/Reference/Reserved_Words\n\
    - **Special characters.** Names should consist of letters (A-Z, a-z), numbers\
    \ (0-9), and the underscore (_). Don't use special characters and I would avoid\
    \ international currency symbols as could be misinterpreted and harder to search.\
    \ I would also avoid using the dollar sign ($), even though it is valid, as it\
    \ is used by frameworks as an alias and could be misinterpreted.\n\nAll other\
    \ naming suggestions rely on coding convention and handling the global namespace\
