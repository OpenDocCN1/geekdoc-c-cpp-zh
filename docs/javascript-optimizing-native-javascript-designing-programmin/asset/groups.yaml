    \n```javascript\naddEvent(elem, \"mouseup\", callback, false);\n```\n\nThe last\
    \ argument (false = default) indicates that events will bubble up the DOM tree\
    \ from the element to the top. Specify true to execute handler during capture\
    \ phase. This is useful for immediately capturing and stopping propagation. This\
    \ is discussed in more detail in Event Handling chapter.\n\n# Using ID to identify\
