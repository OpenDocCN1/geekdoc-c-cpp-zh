- md: "\n# JavaScript: Optimizing Native JavaScript\n\n## Sparse arrays\n\nA sparse\
    \ array is a numerical array whose members are not consecutive, or worded another\
    \ way, has a number of identical values of undefined. If the array is too sparse,\
    \ it essentially turns into a lookup object. You can create this array by assigning\
    \ values to elements that are not sequential in a number of ways, similar to:\n\
    \n```javascript\nvar newArr = [];\nnewArr[0] = \"one\";\nnewArr[330] = \"thirty-three\"\
    ;\n```\n\n| | Safari | Chrome | Firefox |\n|---|---|---|---|\n| 1. Sparse array\
    \ - every 50th element | 233 | 310 | 82 |\n| 2. Regular array - all 10000 elements\
    \ | 5,050 | 3,744 | 4,993 |\n\nTest 3-12: http://www.native.javascript.com/tests/Test-SparseArray.html\n\
    \nThe above tests show how slow accessing a sparse array can be compared to a\
    \ regular array, up to 50 times slower. By making the array sparse, you can make\
    \ lookups slower. However, the performance varies with browsers and how sparse\
    \ the array is. You can have arrays that sparseness are not slow. If you are using\
    \ an array for data that turns out to be too sparse, you should consider using\
    \ an object with properties instead.\n\n## Populating arrays\n\nArrays can be\
    \ populated in three main ways (they can also be created by other methods as str.split(i)).\
    \ You can use the push method to add a new element to the array, or use an element\
    \ assignment to assign the new value to a sparse array.\n\n| | Safari | Chrome\
    \ | Firefox |\n|---|---|---|---|\n| 1. newArr.push(\"abc\" + i); | 1,322 | 3,891\
    \ | 1,588 |\n| 2. newArr[newArr.length] = \"abc\" + i; | 1,228 | 4,000 | 1,749\
    \ |\n| 3. newArr[i] = \"abc\" + i; | 1,003 | 3,963 | 1,637 |\n| 4. Duffs: newArr[i+n]\
    \ = five at time | 1,296 | 4,156 | 1,671 |\n\nTest 3-13: http://www.native.javascript.com/tests/Test-PopulatingArrays.html\n\
    \nThe performance of these measures has varied from the previous versions. Now\
    \ is not much difference at all. If you have large arrays and performance is an\
    \ issue, the fastest method was something like Duff's device discussed earlier.\
    \ This limits the number of loop iterations that you can incorporate into your\
    \ code. Something like this (which is a variation of Duff's device) might work\
    \ for your application but may not be worth it:\n\n```javascript\nvar duff = [];\n\
    for (var i=0; i<10000; i+=5) {\n  duff[i] = \"abc\" + i;\n  duff[i+1] = \"abc\"\
    \ + (i+1);\n  duff[i+2] = \"abc\" + (i+2);\n  duff[i+3] = \"abc\" + (i+3);\n \
    \ duff[i+4] = \"abc\" + (i+4);\n}\n```\n\n## Clearing arrays\n\nBecause arrays\
    \ are passed by reference, you have to be careful when you create new arrays that\
    \ reference existing arrays. Generally, changing values of the first array will\
    \ also change the values when referencing the second array. Be careful if you\
    \ have to clear the array. The following methods will give slightly different\
    \ results:\n\n```javascript\narray1 = [1, 2, 3]; //declare new array\narray2 =\
    \ array1;//both arrays will have same values\n```\n\n### Option 1 - setting array1\
    \ to blank array\n\n```javascript\narray1 = []; //array1 = []\nResult:\narray2\
    \ = [1,2,3]\n```\n\nSetting it to null will have similar results.\n\n### Option\
    \ 2 - setting length to zero\n\n```javascript\narray1.length = 0;\nResult:\narray1\
    \ = []\narray2 = []\n```\n\n### Option 3 - using splice\n\n```javascript\narray1.splice(0,array1.length);\n\
    Result:\narray1 = []\narray2 = []\n```\n\n### Using 'pass by reference' to your\
    \ advantage\n\nIn JavaScript, objects are passed by reference not by value. And\
    \ since arrays are objects, they inherit this same feature. I often use this to\
    \ advantage by setting temporary variables to objects that exist in global contexts,\
    \ and then use those variables to change values. Having a local reference to these\
    \ objects makes the changes faster. In the following example, a global object\
    \ and array are both changed inside a function, one passed in reference, the other\
    \ by temporary variable. Both methods work with objects.\n\n```javascript\nobject1\
    \ = {a: 1, b: 2, c: 3};\narray1 = [1, 2, 3];\nchangeValues(object1);\n```\n\n\
    ```javascript\nfunction changeValues(obj) {\n  obj.a = 99;\n}\nvar tempray = array1;\n\
    temray[0] = 88;\n```\nResult:\nobject1.a = 99\narray1[0] = 88\n\n## Handling events\n\
    \nHandling events refers to keys or events added to the event buffer because the\
    \ user is pressing buttons faster than the program can process them. Handling\
    \ input fields is usually handled differently and is acceptable most of the time.\
    \ To address it in your applications depending on your desired experience, you\
    \ need to make each operation as fast as possible. There are several options:\n\
    \n- Disable element. You can disable the button or element when it is pressed\
    \ the first time. You can do this in several ways including setting the property\
    \ to true. When the code carries out the operation finishes, it will re-enable\
    \ the element.\n- Use timeout. You can use a timeout in the function that is called\
    \ when the user presses the button. The button will call the actual function that\
    \ carries out the operations.\n\n```javascript\nfunction handlerKey() {\n  clearTimeout(keyTimer);\n\
    \  // to display fast\n  keyTimer = setTimeout(function() {fullDisplay(); }, 20);\n\
    }\n\nfunction fullDisplay() {\n  // to display\n}\n```\n\n- Timestamp. Most browsers\
    \ support a timestamp property on the event. This may be necessary if a function\
    \ runs for a long time and the user has been creating mouse, or keyboard events.\
    \ You can compare each event's timestamp property to \"now\" and throw away keys\
    \ that are older than a specified number of milliseconds, similar to:\n\n```javascript\n\
    var now = new Date();\nvar diff = (now - event.timeStamp);\nif (diff > 300) return;\
    \ //ignore keys from more than 300ms\n```\n\n## vs. inline code\n\nYou should\
    \ always attempt to avoid long functions that might be hard to read and debug.\
    \ This usually means structuring your code into files, objects, and functions\
    \ to encapsulate the logic into smaller chunks. One may want to relax this rule\
    \ for performance reasons. If you have routines that loop the same large number\
    \ of times, you may want to call code inline instead of a function that is called\
    \ inside the loop. If you do call a function that is located in a different object,\
    \ you may want to set a local reference outside the loop. You should always limit\
    \ the creation of variables and objects inside loops and try to use integers instead\
    \ of strings as much as possible. Loops can create a lot of garbage quickly so\
    \ you want to reduce that as much as possible.\n\nMany browsers will optimize\
    \ some functions depending on the code that is called. There are a number of constructs\
    \ that will cause functions to not be optimized, such as for-in members. Calling\
    \ functions that contain the optimization killers will run much slower than the\
    \ same code inline. These are shown by tests 3 and 4 which use `for (var name\
    \ in obj)`.\n\n| PERFORMANCE TESTING | Safari | Chrome | Firefox |\n|---|---|---|---|\n\
    | 1. Function - optimized | 91 | 62 | 78 |\n| 2. Inline - optimized | 91 | 62\
    \ | 80 |\n| 3. Function - not optimized | 22 | 7 | 14 |\n| 4. Inline - not optimized\
    \ | 22 | 43 | 15 |\n\n> Test 3-14: http://www.nativejavascript.com/tests/Test-InlineVsFunction.html\n\
    \n## Try/Catch\n\nThe try/catch method enables you to have error handling routines\
    \ that will report on a variety of error conditions. You can also create your\
    \ own error conditions using throw. In the performance tests list we tested two\
    \ conditions—one when the try statement fails and throws an error, and the other\
    \ when it does not. We compared using a try/catch method with a simple test for\
    \ undefined. There is a performance penalty for using try/catch so you should\
    \ only use it when you cannot control the error conditions that might arise, usually\
    \ when importing or reading data. Compilers will also not optimize functions that\
    \ contain try/catch statements.\n\nThe simple try/catch statement used in our\
    \ test looks like:\n\n```javascript\ntry {\n  var a = newvar2;\n}\ncatch (e) {\n\
    \  var a = 2;\n}\n```\n\nThe statement compared to this was:\n\n```javascript\n\
    var a = (typeof(newvar2) != \"undefined\") ? newvar2 : ;\n```\n"
  mdcn: "\n\n# JavaScript: 优化原生 JavaScript\n\n## 稀疏数组 (Sparse arrays)\n\n稀疏数组（Sparse\
    \ array）是一种成员索引不连续的数值数组，或者换句话说，它包含许多数量相同的 `undefined` 值。如果数组过于稀疏，它本质上会变成一个查找对象（lookup\
    \ object）。你可以通过多种方式给非连续的元素赋值来创建这种数组，类似于：\n\n```javascript\nvar newArr = [];\n\
    newArr[0] = \"one\";\nnewArr[330] = \"thirty-three\";\n```\n\n| | Safari | Chrome\
    \ | Firefox |\n|---|---|---|---|\n| 1. 稀疏数组 - 每隔 50 个元素一个 | 233 | 310 | 82 |\n\
    | 2. 普通数组 - 所有 10000 个元素 | 5,050 | 3,744 | 4,993 |\n\n测试 3-12: http://www.native.javascript.com/tests/Test-SparseArray.html\n\
    \n上述测试显示了访问稀疏数组与普通数组相比有多慢，慢速度可达 50 倍。通过使数组变稀疏，你可以降低查找速度。然而，性能会随浏览器和数组的稀疏程度而异。你可以拥有某些稀疏但并不慢的数组。如果你用于数组的数据被证明过于稀疏，你应该考虑使用带有属性的对象代替。\n\
    \n## 填充数组 (Populating arrays)\n\n数组可以通过三种主要方式填充（也可以通过 `str.split(i)` 等其他方法创建）。你可以使用\
    \ `push` 方法向数组添加新元素，或使用元素赋值为稀疏数组分配新值。\n\n| | Safari | Chrome | Firefox |\n|---|---|---|---|\n\
    | 1. newArr.push(\"abc\" + i); | 1,322 | 3,891 | 1,588 |\n| 2. newArr[newArr.length]\
    \ = \"abc\" + i; | 1,228 | 4,000 | 1,749 |\n| 3. newArr[i] = \"abc\" + i; | 1,003\
    \ | 3,963 | 1,637 |\n| 4. Duffs: newArr[i+n] = five at time | 1,296 | 4,156 |\
    \ 1,671 |\n\n测试 3-13: http://www.native.javascript.com/tests/Test-PopulatingArrays.html\n\
    \n这些指标的性能与之前的版本有所不同。现在已经没有太大区别。如果你有大型数组且性能是一个问题，最快的方法类似于之前讨论过的 Duff 技巧（Duff's\
    \ device）。这限制了你可以整合到代码中的循环迭代次数。类似下面的代码（Duff 设备的变体）可能适用于你的应用程序，但可能并不值得：\n\n```javascript\n\
    var duff = [];\nfor (var i=0; i<10000; i+=5) {\n  duff[i] = \"abc\" + i;\n  duff[i+1]\
    \ = \"abc\" + (i+1);\n  duff[i+2] = \"abc\" + (i+2);\n  duff[i+3] = \"abc\" +\
    \ (i+3);\n  duff[i+4] = \"abc\" + (i+4);\n}\n```\n\n## 清空数组 (Clearing arrays)\n\
    \n由于数组是通过引用传递的，因此在创建引用现有数组的新数组时，必须小心。通常情况下，更改第一个数组的值也会改变引用第二个数组时的值。如果你需要清空数组，请小心。以下方法将产生略有不同的结果：\n\
    \n```javascript\narray1 = [1, 2, 3]; //声明新数组\narray2 = array1;//两个数组将具有相同的值\n\
    ```\n\n### 选项 1 - 将 array1 设置为空空数组\n\n```javascript\narray1 = []; //array1 = []\n\
    结果:\narray2 = [1,2,3]\n```\n\n将其设置为 `null` 将产生类似的结果。\n\n### 选项 2 - 将长度置为零\n\n\
    ```javascript\narray1.length = 0;\n结果:\narray1 = []\narray2 = []\n```\n\n### 选项\
    \ 3 - 使用 splice\n\n```javascript\narray1.splice(0,array1.length);\n结果:\narray1\
    \ = []\narray2 = []\n```\n\n### 利用“引用传递”优势\n\n在 JavaScript 中，对象是按引用传递而非按值传递的。由于数组也是对象，它们继承了这一特性。我经常利用这一点，将临时变量设置为存在于全局上下文的对象，然后使用这些变量来更改值。拥有这些对象的本地引用会让更改速度更快。在下面的示例中，全局对象和数组在函数内部都被修改了，一个通过引用传递，另一个通过临时变量。这两种方法都适用于对象。\n\
    \n```javascript\nobject1 = {a: 1, b: 2};\narray1 = [1, 2, 3];\n\nfunction change(obj,\
    \ arr) {\n  obj.a = 4;\n  arr.push(4);\n}\n\nvar tempObj = object1;\nvar tempArr\
    \ = array1;\nchange(tempObj, tempArr);\n```\n\n"
