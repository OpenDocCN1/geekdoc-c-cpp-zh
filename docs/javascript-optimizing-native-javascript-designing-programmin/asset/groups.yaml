    \ 2. var numStr = num.toString(); | 16 | 39 | 64 |\n| 3. var numStr = num.toString(10);\
    \ | 15 | 24 | 55 |\n| 4. var numStr = num.toFixed(1); | 7 | 3 | 9 |\n| 5. var\
    \ numStr = (parseInt(num * 10) / 10) + \"\"; | 20 | 54 | 35 |\n\nTest 3-6: http://www.javascript.com/tests/Test-NumberToTesting.html\n\
    \nYou can see from the performance numbers that the simple operation of adding\
    \ a null string was faster in every case, up to 20 times faster in Chrome and\
    \ Firefox. The toFixed option was very slow but if you need it, you will have\
    \ to use it. Test 5 showed another way to convert a number to a string with one\
    \ decimal place. It is times faster than toFixed.\n\n# Be careful of floating\
    \ point arithmetic\n\nJavaScript stores numbers as double precision floating point\
    \ numbers, using 64 bits to store each number. This can cause precision errors\
    \ if you are not careful. Note the following expression:\n\n```\nvar x = .2 +\
    \ .1; // x = 0.30000000000000004\n```\n\nIf you need better precision in these\
    \ cases, you may need to multiply and divide the numbers, doing something like:\n\
    \n```\nvar x = ((2 * 10) + (1 * 10)) / 10; // x = 0.3\n```\n\n# Other weird pitfalls\
    \ about numbers\n\nThere are few other pitfalls concerning the use of numbers\
    \ in JavaScript including:\n\n- **Leading zeros.** Some browsers will interpret\
    \ a number with a leading zero as octal number. Thus,\n  var x = 012; // x = 10\
    \ (octal 012 = decimal 10)\n  var x = 12; // x = 12\n- **Hexadecimal.** To set\
    \ a number using a hexadecimal representation, simply precede the number with\
