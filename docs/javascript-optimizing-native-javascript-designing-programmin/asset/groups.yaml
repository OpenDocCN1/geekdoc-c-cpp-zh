    \ 100 像素宽元素在加上内边距、边框和外边距值后实际上占据了更大的空间。\n\n为了在设计 UI 时考虑到这些增加，你通常可以通过以下方式之一处理此情况：\n\
    \n- 将宽度和高度属性调小，为增加的内边距、外边距和边框留出空间。你需要计算内部元素缩小多少以适应你的设计。\n- 使用 CSS 属性 `box-sizing`\
    \ 让你的设计更简单。默认值是 `content-box`。\n\n```css\n.element {\n  box-sizing: border-box;\n\
    }\n```\n\n等等，让我重新对齐最后几页相当混乱的 OCR 文本：\n\n为了在设计 UI 时考虑到这些增加，你通常可以通过以下方式之一处理此情况：\n\
