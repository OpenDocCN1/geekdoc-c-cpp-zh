    - 不寻常的处理。当用户以你未测试的方式按键（或点击鼠标或用手指触摸）时，另一种捕获错误条件的情况。你真的不想在每个屏幕上显示一个警告，写着类似“请只按一个按钮，并缓慢操作，在看到第一次点击的结果之前不要按另一个按钮……而且请不要按住按钮。”用户会做出意料之外的事——在一秒内极快速点击右箭头，当看到没反应时，再点击左箭头十次，然后点击取消按钮。你能处理这种情况吗？\n\
    \n上述项的要点在于，你不可能针对所有可能的错误情况测试你的产品。因此，你必须优先考虑精力，以便在本世纪的某个时候将你的产品推出。你必须利用你对代码和业务需求的知识。\n\
    \n![](img/10c5df588c0c6e2580324246d7b5735f_155_0.png)\n\n# 150 · JavaScript: 优化原生\
