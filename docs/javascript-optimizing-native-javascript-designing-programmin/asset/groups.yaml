  mdcn: "\n\n# 62 • JavaScript: 优化原生 JavaScript\n\n3. **带原型的构造函数。** 与之前的构造函数类似，但使用原型来添加方法和属性，这可以快速加快对象的创建。原型项在通过此方法创建的实例之间共享。这是创建实例的最快方法。\n\
