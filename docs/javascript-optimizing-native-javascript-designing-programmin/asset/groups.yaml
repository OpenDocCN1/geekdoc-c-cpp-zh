    # Improving performance


    If you have properly handled the previous goals for handling server requests,
    memory usage, and DOM design, then you have already done most of the work for
    improving your application''s performance. However, there are still areas where
    you can improve the real or perceived performance of your application when dealing
    with large amounts of data. Pay attention to the perceived performance which is
    essentially how the users think the application is performing. Little things like
    giving immediate feedback and filling in some of the screen right away can go
    long way in making the app look and feel better. Areas to include:


    +   - Sometimes you want to load all your program files and when the program starts
    so that your performance will be faster in the program. You normally want to make
    sure that you display some UI right away with what you are loading. If your user
    will be using your application for some time, a little extra time up front will
    be worth it for better performance elsewhere. You can defer loading items, such
    as help screens, until they are actually requested. Users are accustomed to waiting
    a bit longer to display these types of items. By keeping your code as simple as
    possible and avoiding large libraries or frameworks, you will have more memory
    for your data.


    +   - Show a progress meter or spinner when your application is carrying out a
    task that may take a second or so. If it is a lengthy task, you may want to display
    more information about what you are doing, such as: `Calculating totals...`—Ever,
    you have to be careful about displaying the progress of calculations in programming
    loops which you normally have to interrupt the loop using something like a `setTimeout`
    command to allow the UI to display the updated message. This alone will slow down
    your application. If you display a message, try to use the `innerText` property
    of the element to avoid a DOM reflow.


    +   - Give immediate feedback when the user clicks on your UI. This is very important
    and often overlooked. This change from having a button move or change color to
    having a new screen. Show a gray overlay over the entire screen if you don''t
    want the user to interact with your interface while you are changing the page.


    +   - Don''t mess with the DOM. Minimize the number of times you destroy or create
    parts of the DOM. Minimize the number of times you have to reflow the DOM by requesting
    values such as `offsetLeft`, `offsetTop`, and similar properties.'
