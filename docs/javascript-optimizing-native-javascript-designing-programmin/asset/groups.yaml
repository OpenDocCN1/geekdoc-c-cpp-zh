- md: "\n## 48 + JavaScript: Optimizing Native JavaScript\n\n- setInterval(): This\
    \ acts similarly to setTimeout but but the referenced code will keep running every\
    \ x milliseconds until you issue a clearInterval() command. When you execute this\
    \ command, the first instance will not be triggered until the specified time interval.\
    \ You are not guaranteed that your function will free up at every interval since\
    \ other operations may block its execution.\n\nThere are several ways to set timeouts.\
    \ Variations cover how the function of the operation is set. You may see the following\
    \ methods. These apply for setTimeout and setInterval.\n\n- `setTimeout(\"doFunc\"\
    , 100);` has to do eval which is costly and could cause problems.\n- `setTimeout(doFunc,\
    \ 100);` this will call the doFunc in 100ms but you can't pass arguments.\n- `setTimeout(function\
    \ (var){100);` this is the best way to time your timeouts and intervals as it\
    \ avoids allows you to pass arguments directly into your function.\n\nThere are\
    \ many ways that timers can help you. Be sure you are familiar with all of them.\
    \ There is no guarantee that your timers will fire at exactly the time you specify.\
    \ The CPU has to finish its current thread before it can handle the timer function.\
    \ You should remember to stop timers that are no longer needed using the setTimeout\
    \ and clearCommands.\n\n- Timeout (0). You use all the time and will find lots\
    \ of uses. The main use is to stop your processing to allowing another process\
    \ to run. You don't need a number; zero will suffice. The most common uses are:\n\
    \n- Screen update. The timeout will allow the screen to update if required. You\
    \ might have made DOM objects using innerHTML and they haven't been created so\
    \ you can set a timeout which will allow the elements to be created.\n\n- Split\
    \ up long processes. You shouldn't have functions that take a long time to execute\
    \ without releasing control. You can break these long processes into two or more\
    \ functions and use setTimeout(xx, 0) to relinquish the process in between.\n\n\
    - Events. You may need keyboard, mouse, or touch events to be processed. These\
    \ will be queued until the process is free to accept them.\n\n- Wait until code\
    \ is a loaded event. You can use a setTimeout at the start of a function to allow\
    \ code execution to wait until a certain event happens, such as:\n\n```javascript\n\
    function thisFunction() {\n  setTimeout(loadLoaded);\n  if (filesLoaded) { //for\
    \ some external condition\n    loadTimer = setTimeout(function () {thisFunction()},200);\n\
    \    return;\n  }\n} // rest function\n```\n\nFallback in case data load fails.\
    \ You can have your XMLHttpRequest requests timeouts or you can add your own timeout\
    \ that run in case the data never fails. You would need to place a clearTimeout\
    \ in the callback code that normally runs when the data loads.\n\n## Chapter 3:\
    \ JavaScript • 49\n\n- Timer minutes. The best way to handle screen designs that\
    \ display the current time every minute is to set up a master timer routine that\
    \ fired every minute and updates all routines that have registered a callback\
    \ for the event. The routine updates a variable, updates the views, and issues\
    \ a new timeout call for the next minute. Creating Date is a little slow and most\
    \ of the time you only need a date object that is accurate to the closest minute,\
    \ so this is a good way to always have a valid date object.\n\n```javascript\n\
    function minuteTimer() {\n    clearTimeout(minuteTimeout);\n    globalDate = new\
    \ Date();\n    globalDisplayDate = dFormat(globalDate);\n    //update your views\
    \ here if they have registered a listener\n    //run again in one minute\n   \
    \ var nsecs = (60 - globalDate.getSeconds()) * 1000;\n    minuteTimeout = setTimeout(function\
    \ () { minuteTimer(); }, nsecs);\n}\n```\n\n## Reduce the creation of garbage\n\
    \nThe term \"garbage\" in JavaScript refers to memory used for variables, or functions\
    \ that have been freed up because it is no longer referenced by anything. There\
    \ is no way to force this garbage to be collected. Each browser has its own mechanism\
    \ of determining when garbage should be collected and freed. With efficient collection\
    \ and larger memory sizes, the issue is not as critical as before, but you should\
    \ still strive to minimize the creation of garbage. I have programmed high performance\
    \ scrolling applications that would be adversely affected by a sudden garbage\
    \ collection carried out by the browser. The two issues you should always keep\
    \ in mind:\n\n- Free unused memory. Any variables that leave scope be garbage\
    \ collected. This includes local variables declared with a var statement inside\
    \ a function. Once the function exits, these items are de-referenced and available\
    \ for collection. But other functions or variables in the global space will stay\
    \ referenced until you delete or set them to null. Be careful of any variables\
    \ that stayed referenced by closures.\n\n- Don't make garbage in the first place.\
    \ Make your loops as tight as possible and try to avoid a lot of temporary strings.\
    \ Make your data structures complex and try to minimize the amount of fetched\
    \ data you must throw away. I was able to take what would have been 168MB of data\
    \ downloaded from the server and creating garbage and create a small 3MB file\
    \ that was all JSON data.\n\nA simple change to use integers instead of strings\
    \ inside can save memory. Reuse of integers uses less memory than using strings.\
    \ Instead of something like:\n\n```javascript\nvar varNew = ((i%3)==0) ? \"on\"\
    \ : \"off\";\njust use:\nvarNew = ((i%3)==0) ? 1 : 0;\n```\n\n## Lookup of arrays\
    \ vs. objects\n\nThere are instances where arrays make the best sense for storing\
    \ your data and other times an array of objects makes more sense. You need to\
    \ decide which is the optimal method for your usage. The factors to consider are:\n\
    \n- Performance. How often will data be accessed?\n- Memory. How large will the\
    \ set be?\n- Number of properties. Do you need it?\n- Readability. Which method\
    \ is more readable?\n\n| Method | Safari | Chrome |\n|---|---|---|\n| 1. Object\
    \ | 9 | 9 |\n| 2. Array | 10 | 10 |\n| 3. Object | 9 | 9 |\n| 4. Object | 9 |\
    \ 9 |\n| 5. Array | 10 | 10 |\n| 6. Array | 10 | 10 |\n\nTest-3-2: http://www.javascript.com/tests/TestArraysObjects.html\n"
  mdcn: "\n\n## 48 + JavaScript: 优化原生 JavaScript\n\n- setInterval(): 它的作用类似于 `setTimeout`，但引用的代码每隔\
    \ x 毫秒就会持续运行，直到你发出 `clearInterval()` 命令为止。当你执行此命令时，第一个实例在指定的等待间隔到达之前不会被触发。你无法保证函数会在每个间隔期间都释放，因为其他操作可能会阻塞它的执行。\n\
    \n设置超时有多种方法。变体涵盖了操作函数的各种设置方式。你可能会看到以下方法。它们适用于 `setTimeout` 和 `setInterval`。\n\n\
    - `setTimeout(\"doFunc\", 100);` 必须通过 `eval` 执行，这开销很大且可能导致问题。\n- `setTimeout(doFunc,\
    \ 100);` 这将在 100ms 后调用 `doFunc`，但你无法传递参数。\n- `setTimeout(function (var){100);`\
    \ 这是设置超时和定时器的最佳方式，因为它允许你直接将参数传递到你的函数中。\n\n定时器有很多种可以帮助你的方法。请确保你熟悉所有这些方法。无法保证你的定时器会在你指定的精确时间触发。CPU\
    \ 必须在处理定时器函数之前完成其当前的线程。你应该记住使用 `setTimeout` 和 `clearCommands` 停止不再需要的定时器。\n\n\
    - 超时 (0)。你会一直使用它并发现它有很多用途。主要用途是停止你的处理以允许另一个进程运行。你不需要数字；零即可。最常见的用途是：\n\n- 屏幕更新。超时将允许屏幕更新。你可能使用\
    \ `innerHTML` 创建了 DOM 对象，但它们还没有创建，因此你可以设置一个超时来允许元素被创建。\n\n- 拆分长时间进程。你不应该拥有执行时间长且释放控制权的函数。你可以将这些长进程拆分为两个或多个函数，并使用\
    \ `setTimeout(xx, 0)` 在之间放弃处理权。\n\n- 事件。你可能需要处理键盘、鼠标或触摸事件。这些事件将一直排队，直到进程空闲并接受它们。\n\
    \n- 等待代码为加载事件。你可以在函数的开始处使用 `setTimeout`，让代码执行等待某个事件的发生，例如：\n\n```javascript\n\
    function thisFunction() {\n  setTimeout(loadLoaded);\n  if (filesLoaded) { //为了某些外部条件\n\
    \    loadTimer = setTimeout(function () {thisFunction()},200);\n    return;\n\
    \  }\n} // 剩余函数\n```\n\n数据加载失败时的备用方案。你可以让 `XMLHttpRequest` 请求超时，或者你可以添加自己的超时，以便在数据从未加载失败时运行。你需要在通常在数据加载时运行的回调代码中放置\
    \ `clearTimeout`。\n\n## 第3章：JavaScript • 49\n\n- 分钟定时器。处理每分钟显示一次时间的屏幕设计的最佳方法是设置一个主定时器程序，该程序每分钟触发一次，并更新所有注册了该事件的回调程序。该程序更新变量、更新视图，并为下一分钟发布新的超时调用。创建\
    \ `Date` 稍微有点慢，大多数时候你只需要精确到最近分钟的日期对象，因此这是一个始终拥有有效日期对象的好方法。\n\n```javascript\n\
    function minuteTimer() {\n    clearTimeout(minuteTimeout);\n    globalDate = new\
    \ Date();\n    globalDisplayDate = dFormat(globalDate);\n    // 如果它们注册了监听器，在这里更新你的视图\n\
    \    // 一分钟后再次运行\n    var nsecs = (60 - globalDate.getSeconds()) * 1000;\n   \
    \ minuteTimeout = setTimeout(function () { minuteTimer(); }, nsecs);\n}\n```\n\
    \n## 减少垃圾的创建\n\nJavaScript 中的“垃圾”是指用于变量的内存，或者因为不再被任何内容引用而被释放的函数。没有办法可以强制收集这些垃圾。每个浏览器都有其自己的机制来决定何时应该收集和释放垃圾。随着高效的收集和更大的内存容量，这个问题不再像以前那样关键了，但你仍然应该努力尽量减少垃圾的创建。我编写过高性能的滚动应用程序，这些程序会被浏览器突然执行的垃圾回收产生不利影响。你应该始终记住这两个问题：\n\
    \n- 释放未使用的内存。任何离开作用域的变量都可以被回收。这包括在函数内部使用 `var` 语句声明的局部变量。一旦函数退出，这些项就会解除引用并可以收集。但全局空间中的其他函数或变量将保持被引用，直到你删除它们或将其设置为\
    \ `null`。小心任何被闭包保持引用的变量。\n\n- 从源上不产生垃圾。让你的循环尽可能紧凑，尽量避免大量的临时字符串。让你的数据结构复杂化，并尽量减少你必须丢弃的数据量。我能够将原本从服务器下载并产生垃圾的\
    \ 168MB 数据，创建一个全都是 JSON 数据的 3MB 小文件。\n\n在内部使用整数代替字符串的简单更改可以节省内存。复用整数比使用字符串消耗内存内存。而不是使用类似：\n\
    \n```javascript\nvar varNew = ((i%3)==0) ? \"on\" : \"off\";\n直接使用：\nvarNew =\
    \ ((i%3)==0) ? 1 : 0;\n```\n\n## 数组与对象的查找\n\n在某些情况下，使用数组存储数据是最合理的，而在另一些情况下，对象数组可能更合理。你需要决定哪种是适用于你使用的最佳方法。需要考虑的因素有：\n\
    \n- 性能。数据访问频率有多高？\n- 内存。集合有多大？\n- 属性数量。你需要它吗？\n- 可读性。哪种方法更具可读性？\n\n| 方法 | Safari\
    \ | Chrome |\n|---|---|---|\n| 1. Object | 9 | 9 |\n| 2. Array | 10 | 10 |\n|\
    \ 3. Object | 9 | 9 |\n| 4. Object | 9 | 9 |\n| 5. Array | 10 | 10 |\n| 6. Array\
    \ | 10 | 10 |\n\n"
