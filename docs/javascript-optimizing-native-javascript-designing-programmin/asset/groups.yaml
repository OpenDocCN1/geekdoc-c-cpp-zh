    | 2. jQuery - $(''#id'') | | 46 | 9 |

    | 3. 原生 - getElementsByClassName | 660 | 401 | 20,049 |

    | 4. jQuery - $(''.class'') | | 9 | 3 |


    测试 12-1: http://www.nativejavascript.com/tests/Test-FixedArray.html


    这些测试也让你意识到，当你编写任何多功能函数时都需要进行权衡。你可以让函数处理许多不同的情况，但这通常是通过条件逻辑实现的，这会降低性能。对于许多用例，为了易用性和更小的代码，这种权衡是值得的。对于对性能重要的领域，你可能想要考虑创建特定的函数。


    # 模板


    模板系统有助于将你的 HTML 代码与 JavaScript 代码分离，并使其更容易填充重复元素的列表。它们使用特殊的格式，指示将使用动态值来填充元素。可用的模板系统包括：


    - Mustache

    - Handlebars

    - jQuery Template

    - Dust


    > 将显示内容与代码分离是许多 JavaScript 增强产品经常提到的目标。一方面，你不应该在 HTML 中嵌入处理器和对 JavaScript 函数的引用。另一方面，你的
    JavaScript 不应该直接创建所有的 HTML。考虑这一点的一种方法是思考开发应用时所需的传统技能。程序员应该专注于实际的代码逻辑，因为他们可能不精通布局设计；而设计师专注于布局，因为他们可能不是程序员。最好的工具将能够允许这种分离。通常情况下，模板包含了编程语言，或者程序包含了
    HTML 语言。


    # CSS 预处理器


    这些工具允许通过接受私有的 CSS 输入并将其处理以生成标准 CSS，从而获得更灵活、更强大的 CSS。更强大的功能包括变量的使用和更多的嵌套能力。一些流行的工具包括：


    - Sass

    - Less

    - Stylus


    处理器通常会预先编译 CSS，如果用户更改格式选项，它们不允许从应用本身动态更改样式。还有其他解决方案可以将常用颜色或其他值替换到你的 CSS 或 HTML
    中。此外，注意不要过度使用嵌套功能，因为这会让你的 HTML 非常难以调试和/或修改，并且运行速度可能会慢。


    # Polyfills 和 shim（垫片）


    Polyfills 和 shims 是代码集合，允许你的应用程序使用并非所有浏览器都支持的功能。它们让你支持这些功能的浏览器上实现这些新功能，但提供一个可以在旧浏览器上运行的后备方法。它们通常在使用功能之前先测试该功能是否存在，如果不存在，则使用旧方法。示例包括：


    - html5Shiv

    - PersistJS

    - Modernizr

    - Polyfiller


    # 压缩工具


    更小的 JavaScript 代码下载更快、加载更快，且消耗的带宽更少。你的代码不像大多数其他语言那样被编译，你需要采取额外的步骤来使其尽可能减小。有很多工具通过多种方法实现这一点，包括：


    - 移除空格和注释

    - 缩短变量和函数名

    - 将函数替换为内联代码

    - 将函数合并为更少更大的文件


    你的代码保持不变，压缩器创建新的、更小的文件并将其部署到你的网站上。这些步骤大部分是非常安全的。更改变量和函数名等更激的步骤被称为混淆，必须仔细进行。混淆也会让你的代码在他人未经许可的情况下难以使用。大多数调试工具都有“格式化打印”（pretty
    print）功能，可以让你的压缩后的文件更易读，但它们不会让混淆变得更清晰。还有 map 文件帮助你调试。合并文件可以更快下载代码，因为下载文件无论多小都会涉及一些开销。一些好的压缩器包括：


    - YUI Compressor

    - Google Closure Compiler

    - Microsoft Ajax Minifier

    - JSMIN

    - UglifyJS


    在使用更极端的压缩设置时要小心，因为由于 JavaScript 的非类型特性，你可能会引入错误。参见第 2 章中关于 JavaScript 格式的注释。你的代码中包含的库越多，压缩就变得越重要或越必要。当我添加库时，在功能几乎没有增加的情况下，代码大小却增加了四倍。


    # 脚本加载器


    在 HTML 中依赖 `<script>` 标签通常是加载 JavaScript 文件的最佳方法。每个脚本都会阻塞你的界面直到加载完成，并且所有的脚本都必须在应用程序启动之前加载。使用脚本加载器提供几处好处，包括：


    - 加载脚本可以延迟到初始 UI 加载并显示，从而带来更好的用户体验

    - 你的代码可以根据配置决定加载哪些文件或允许添加值以自定义


    一些可脚本加载器包括：


    - yepnope.js

    - HeadJS

    - RequireJS

    - LazyLoad


    > 动态加载脚本文件可以帮助提高应用程序的性能或感知性能。如果你的应用仅运行总可用文件的子集，它们将特别有用。然而，使用它们可能会导致脚本以完全随机的顺序加载，因此你需要确保这不会引起任何问题。用户在请求的文件加载时也可能会经历一些延迟。


    > “你自己任何六六个月没看过的代码，可能还不如别人写的。”

    - 埃格森定律 (Eagleson''s Law)


    # 第 13 章：调试 • 139


    # 13 调试


    有很多可用工具可以帮助你调试 JavaScript/HTML 应用程序。Firebug 是 Firefox 中用于调试的流行工具，而 Chrome 有一个出色的内置调试器。其他浏览器也有具有类似功能的内置调试工具。我倾向于使用
    Chrome 调试器，因为我认为它是最易于使用的，但你可能需要在你的应用程序支持的每个浏览器上运行调试工具。这些工具在你开发周期的每一步都有帮助，但在部署前的最后的性能和内存问题时特别有用。使用它们，并经常使用它们。


