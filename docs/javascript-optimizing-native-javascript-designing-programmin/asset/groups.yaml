    ## 36 • JavaScript: Optimizing Native JavaScript


    - Be careful if you are using a falsy test to determine if a variable has been
    set, but valid for the variable include 0 (zero) or an empty string. Those will
    equate to false but the variable has really been set.


    ## Short-circuiting if statements


    If statements test multiple conditions are subject to short-circuiting which means
    that the statement will execute as soon as it can determine its truthfulness.
    Tests 11 and 12 in the previous test are examples of this. In the following statement
    the && (and) operator, if isValid is false, the second test for age is never carried
    out:


    Likewise, in the following statement ||, if x is null, then the second test is
    not done.


    Besides trying to put the most likely tests first, you can also use this behavior
    to avoid errors caused by undefined values. If you are not sure of whether a test
    will throw an error, you can test for the existence of items before examining
    their properties. Forgetting to this is a frequent cause of errors that may not
    be caught until you test all corner cases of possible values that are compared:


    ```javascript

    var a = null;

    var b = [3, 2, 3];

    if (a.length > 0) //this throws an error

    if (b.length > 0) //OK -is true

    if (a && b.length > 0) {} //OK - is false

    ```


    ## Avoid assignment mistakes in if statements


    A common mistake in JavaScript conditional statements is to forget to use two
    or = signs and instead just use one. This is a valid statement so JavaScript will
    normally run it. It might look like:


    ```javascript

    if (x = 5) {

    instead of

    if (x == 5) {

    ```


    Some compilers, SDKs, or programs like ESLint will notify you of this kind of
    problem. A method that many programmers use is often called the Yoda method. Yoda
    might describe your comparison statement as "if 5 is your variable x", you write:


    ```javascript

    if (5 == x) {

    ```


    Written in order, if you make a mistake and write if (5 = x), it will cause an
    obvious JavaScript error right, instead of introducing a subtle bug that might
    be hard to find. If you are comfortable with it and helps you write better code.
    Personally, I find the syntax confusing and rely on ESLint to find any mistakes.


    ## Creating new arrays and objects


    There are two main ways to create native arrays and objects in JavaScript (not
    counting methods like split or object constructors). You will see examples of
    both methods everywhere, the more traditional methods is:


    ```javascript

    var a = new Array();

    var b = new Object();

    ```


    You can also use the following shortcut methods:


    ```javascript

    var a = [];

    var b = {};

    ```


    As the following table points out, you should really use the second method as
    there are huge increases in performance over some browsers.


    | | PERFORMANCE TESTING | OPS (bigger is better) | Safari | Chrome | Firefox |

    | :--- | :--- | :--- | :--- | :--- |

    | 1. var a = new Array(); | 1,521 | 69 | 972 | |

    | 2. var a = []; | 1,501 | 181 | 958 | |

    | 3. var a = new Object(); | 1,468 | 29 | 5 |

    || 4. var a = {}; | 1,481 | 99 | 1,001 | |


    > Test 3: http://www.nativejavascript.com/tests/CreateObjects.html


    There are a few important points that are highlighted by these results.


    - The Safari browser seems to be optimized to treat all methods approximately
    the same though the shorthand method is still faster.

    - Chrome was slower for all methods but the shorthand method is still much faster.

    - The long method for object creation on Firefox was incredibly slow for some
    reason. Use the shorthand method.


    ## Hoisting


    JavaScript uses method called "hoisting" to effectively move all variable declarations
    to the top of the code, such as the module or function. Only the declaration will
    be hoisted but not the assignment value.


    ```javascript

    console.log("varA value = " + varA);

    var varA = "newvalue";

    ```


    This will display the following on the console log:


    ```

    varA = undefined

    ```


    It displays "undefined" because the declaration was hoisted but the variable value
    was not set. The same applies if you are using the variable assignment method
    to declare functions, similar to:


    ```javascript

    var parseData = function () {};

    ```


    In this case, the function parseData will be declared and hoisted, but it will
    not be available to be called until its declaration.


    ## 38 + JavaScript: Optimizing Native JavaScript


    If you declare the same function in the following way, it will be available anywhere
    in the current scope, above or below:


    ```javascript

    function parseData() {

    ```


    This is another reason that you should put all your variable declarations at the
    top of each closure to ensure your logic won''t be misinterpreted.


    Another use of assigning a function to a variable (even though it won''t get hoisted)
    is that you can assign similar functions to the elements of an array. Rather than
    having one function with conditional logic to handle different variations like
    sort order, you can assign the optimized version of each function to an array
    element, and then call the proper function using an index, such as:


    ```javascript

    var dateFunctions = [];

    dateFunctions[0] = function() {

    // code for first date function

    }

    dateFunctions[1] = function() {

    // code for second date function

    }

    dateFunctions[1]

    ```


    ## Converting strings to numbers


    There are times when you need to force a string variable to be treated as a number.
    This will be required if you are using the strict equality operator (===) for
    comparisons or if the value is used as part of a formula or an index into an array.
    Sometimes values retrieved from cookies or similar storage appear to be numbers
    but are represented internally as strings and have to be forced to numbers. There
    are several ways to make this conversion.


    - parseInt(): Converts a string to an integer. Be sure to add the radix at the
    end of the operation to avoid certain strings being converted to a base other
    than base10. Strings starting with a zero "0" will default to octal (base 8) if
    you don''t specify the base. The command should look like: `var x = parseInt("342",
    10);`

    - Number(): Converts a string to a number.

    - parseFloat(): Converts a string to a floating point number including the decimal.

    - Math.floor(): Rounds a number or valid string by rounding down.

    - Math.ceil(): Rounds a number or valid string by rounding up.

    - Math.round(): Rounds a number to the nearest integer. If the decimal portion
    is equal to .5 it is rounded up; otherwise, it is rounded down.

    - -0: Having a -0 at the end of string will force it to a number.

