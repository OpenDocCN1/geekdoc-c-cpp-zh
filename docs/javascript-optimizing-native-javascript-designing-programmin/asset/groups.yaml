    # JavaScript: 优化原生 JavaScript


    出于各种原因，我决定将节目数据分成几个数组，而不是使用对象或多级数组。这使得有效载负载更小，内存占用更低，且访问速度略快。每个数组中相同位置的属性对应于同一个节目。现在，数据格式如下，对应每个数组元素中的每个频道）：


    ```

    "titles": ["Angels", "Armada", "As the World Turns"],

    "chans": [[2, "KRON"], [4, "KPIX"]],

    "gridStartTime": 1335250800000,

    "showTitles": [[23, 21, 3, 6, ...], [6541, 12, 22, ...]],

    "showFlags": [[345, 124, 1122, ...], [233, 1122, 1122, ...]],

    "showTimes": [[0, 30, 60, ...], [0, 90, 180, ...]]

    ```


    原始计划是使用3 小时分段进行加载，需要传输近 200MB 的数据。新格式几乎是时下载的，仅使用了约 4MB 的内存。


    更新：任何仍在运行的应用程序都会下载整个数据库。由于应用程序的任何新实例在启动时都会获取最新数据，对于任何具有相同频道组合的区域，都可以进行预构建并在多处进行更改。白天涉及特定节目更改的更新通过以下方式处理：


    - 定期让每个项变得非常轻量并向服务器请求更新（如果有的话）。

    - 更新通过发送发生变化的频道的数组元素返回。这些元素将简单地替换现有的数组成员（而不是整个数组），并在需要刷新 UI。实际节目标题的更改可以通过发送整个标题数组，或简单地在末尾添加新标题来处理。这将导致列表不是完全按字母顺序排序，但在下次加载完整数据时会纠正。


    # 大列表的滚动、排序和过滤


    我设计了几个应用程序，它们可以在滚动大量数据集的同时，允许用户快速对显示列表进行排序和过滤。我必须让排序和过滤操作尽可能快，并允许在 PC 和移动设备上平滑滚动。出于各种原因，我想一次性加载整个列表，然后在应用程序中处理所有操作，而无需进行进一步请求。如果你设计得当，你应该能够让它适用于数万条记录，为用户提供比典型的“一次加载”好得多的体验。显然，需求会随应用程序而异。如果你获取的数据的前
    30 条记录是有意义的（类似于搜索引擎的请求），则不需要这些技术中的某些。然而，如果你想能够检索数据、更改过滤器、在不同字段上进行排序，那么这些方法就适用。重点领域在于：


    - 使从服务器加载的数据格式尽可能精小且高效。

    - 将数据加载到一个大数组中，该数组在过滤或排序时不会发生变化。这将有助于减少垃圾回收（Garbage Collection）的产生并提高效率。

    - 在被请求时，为每个排序顺序构建单独的索引数组。这些数组将按照请求顺序排列，但仅是主数据数组的指针。这些数组也可以预构建并从服务器下载。

    - 为每个数组成员添加一个过滤器标记，每当过滤器更改时，将其设置为 true 或 false。这样，过滤代码就不需要在每次排序更改时重新运行。

    - 保持 DOM 占用尽可能小。这涉及让播放的元素尽可能轻量，并将当前未显示的元素的 display 属性设置为 none。


    ## 第 1  - 数据格式


    从让你的数据尽可能紧凑开始。我通过仅包含所需字段的 JSON 对象加载我的数据。我确保数据在服务器上创建时按照我想要的初始排序顺序创建（在这种情况下是按名称字母顺序排序）。这假设数据集足够小，可以一次性获取并显示。如果数据量太大，你必须在用户滚动列表时分段加载它。这里提到的所有概念都可以用于分段加载的列表。然而，如果你在大
    div 中使用滚动条显示部分列表（而不是使用“上一个/下一个”之类的按钮），那么你可能希望将容器 div 的高度设置为所有行加载后的高度，以确保滚动条看起来和运行正常。


    ## 第 2  - 添加排序


    为了实现最优的排序和过滤，我通常通过将数据字段放在每行的 div 元素中来布局数据，并对每行使用绝对定位。我通过递增行高来设置每行的 top 属性。每行用一个唯一
    ID 标识，该 ID 直接引用数据数组的索引元素。尽量保持 HTML 元素尽可能“轻量”。这意味着避免在每行中嵌套大量元素，并将 CSS 效果降至最低——例如不使用阴影、变或等。


    ## 第 3  - 添加排序


    现在添加对任何一列进行排序的能力。你可以添加一些方法来显示当前排序列并允许用户更改它。这通常通过点击列标题来更改顺序，更改后通过一个小三角形图标显示出来。在这个新的排序顺序中创建一个新的索引数组，指向你的数据数组。这最小化了你需要移动的数据量。当用户对此列进行排序时，这种方法可以减少需要移动的数据量。如果用户指定反向排序，可以使用该索引数组。


    ## 第 4  - 过滤


    现在添加对列表进行过滤的能力。缺点是它有以下几个部分：


    1. 首先，创建一个允许用户选择想要过滤的字段的界面。

    2. 然后，使用过滤标准遍历数据，并将过滤器标记设置为 true 或 false。

    3. 现在，使用当前的排序顺序，你希望将这些行的 display 属性设置为 ''block''而将它的设置为 ''none''。这将它们从 DOM 中移除。


    ## 第 5  - 滚动


    你的 div 元素列表可以放置在一个 overflow 属性设置为 scroll 的大 div 中。然后，调整此元素的大小以适应页面。这允许你保持其他元素（如菜单或列标题）可见。除非列表很大，否则你可以显示所有行。然而，对于非常大的列表，你可能需要限制一次显示（display:block）的
    div 元素数量。处理这种问题的方法是在列表父元素上添加滚动处理器。在该处理器中，你可以检测滚动条的位置，并根据行的高度和窗口的高度确定哪些元素正在显示。然后你可以将这些行的
    display 属性设置为''block''。为了让下一页或向下滚动更顺畅，你可能希望将当前可见行上下各100行的 display 属性也设置为 block。


    # 缓存


    你的服务器请求让数据加载更快，因为可以使用本地或服务器缓存中的数据。缺点是，你可能会获得在服务器上更改过的过时数据。这包括新版本的程序文件或服务器上频繁更改的数据。大多数应用程序使用某些
    `cache busting` 技术来确保它们始终加载最新数据。缺点是这会让你的程序和数据加载变慢。一种常见的方法是在 url 的末尾附加时间戳，以强制应用程序看起来新请求并绕过任何缓存。'
