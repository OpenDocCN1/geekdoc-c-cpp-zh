    # Chapter 12: Tools • 135


    You can see from the test below that some performance using these libraries can
    be abysmal.

    The following test compares doing a simple document.getElementById and document.getElementsByClassName
    with a simple jQuery equivalent. In some cases, the jQuery equivalent is 2,000
    times slower. I would be careful even if you have to use jQuery calls where performance
    is a problem. The following test was done using jquery-3.1.1.min.js which was
    the latest jQuery library available.


    ![](img/10c5df588c0c6e2580324246d7b5735f_141_0.png)


    | PERFORMANCE TESTING | Safari | Chrome | Firefox |

    | --- | --- | --- | --- |

    | 1. Native - getElementById | 647 | 550 | 22,442 |

    | 2. jQuery - $(''#id'') | | 46 | 9 |

    | 3. Native - getElementsByClassName | 660 | 401 | 20,049 |

    | 4. jQuery - $(''.class'') | | 9 | 3 |


    Test 12-1: http://www.nativejavascript.com/tests/Test-FixedArray.html


    These tests also make you realize the tradeoff when you have any function that
    is multipurpose. You can make the function handle lots of different cases but
    that is usually done with conditional logic that will degrade performance. For
    many uses, tradeoff is worth it for ease of use and smaller code. For areas where
    performance is of importance, you may want to consider making specific functions.


    # Templates


    Templating systems help separate your HTML code from your JavaScript code and
    make it easier to populate lists of repeating elements. They use a special format
    that indicates dynamic values will be used to populate the elements. Available
    template systems include:


    +   * Mustache

    * Handlebars

    * jQuery Template

    * Dust


    > Separating your display from your code is an oft-stated goal of many JavaScript
    enhancement products. On the one hand, you should not embed handlers and references
    to JavaScript functions in your HTML. On the other hand, your JavaScript should
    not directly create all HTML. One way to consider this is to think of the traditional
    skills required in making an app. The programmer should concentrate on the actual
    coding logic as they may not be proficient in the layout design. Whereas the designer
    concentrates on the layout since they may not be a programmer. The best tools
    would then allow for this separation. Too often, the template includes programming
    language, or the program includes HTML language.'
  - '[PAGE 142]


    # CSS Preprocessors


    These tools allow you to have more flexible and powerful CSS by accepting proprietary
    CSS input and processing it to produce standard CSS. The more powerful features
    include the use of variables and more nesting capabilities. Some popular tools
    include:


    +   - Saas

    - Less

    - Stylus


    The processors normally compile the CSS up front and don''t allow any dynamic
    changing of styles from the app itself if the user changes formatting options.
    and there are other solutions to substituting common colors or other values into
    your CSS or HTML Plus, be careful that you do not overuse the nesting features
    as it can make your HTML very hard to debug and/or change, and it may run slower.


    # Polfills and shims


    Polfills and shims are collections of code that allows your application to use
    features that may not be supported by all browsers. They let you implement these
    new features on browsers that support them, but provide a fallback method that
    works on the older browsers. They usually work by first testing for the existence
    of the feature before using it, and then using an older method if it does not
    exist. Examples include:


    +   - html5Shiv

    - PersistJS

    - Modernizr

    - Polyfiller


    # Minification tools


    Smaller JavaScript code downloads faster, loads faster, and consumes less bandwidth.
    Your code is not compiled like it is in most other languages, you need to take
    some extra steps to make it as small as possible. There are several tools out
    there that accomplish this using several methods including:


    +   - removing spaces and comments

    - shortening variable and function names

    - replacing functions with inline code

    - combining functions into fewer, larger files


    Your code is left alone and the compressor creates new, smaller files that you
    deploy on your website. Most of these steps are very safe. The more radical steps
    of changing variable and function names are also called obfuscation and must be
    done carefully. Obfuscation will also make your code harder for others to use
    without permission. Most debug tools have ''pretty'
  - '[PAGE 143]


    print'' functions that can make your minified files easier to read, but they won''t
    make any ob-uscation clearer. There are also map files available to help you debug
    as well. Combining files downloading the code faster as there is some overhead
    involved downloading a file, no matter how small. Some good minifiers include:


    +   - YUI Compressor

    - Google Closure Compiler

    - Microsoft Ajax Minifier

    - JSMIN

    - UglifyJS


    Be careful when using the more extreme minification settings as you might be in-troducing
    errors due to JavaScript''s non-typed nature. See comments about this in Chapter
    2 about JavaScript formatting. The more libraries you include in your code, the
    more important or necessary minification becomes. I have code size qua-druple
    when libraries were added with little gain in functionality.


    # Script loaders


    Relying on <script> tags in your HTML is normally the best way to load your JavaScript
    files. Each script will block your interface until it is loaded, and all your
    scripts will have to be loaded before your application starts. Using script loaders
    offers several benefits, including:


    +   - loading scripts can be delayed until your initial UI loads and displays
    resulting in a better user experience

    - your code can decide which files to load on config or allow values adding customization


    Some of the script loaders that are available include:


    +   - yepnope.js

    - HeadJS

    - RequireJS

    - LazyLoad


    > Dynamic loading of script files can help improve the performance or perceived
    per-formance of your application. They are particularly helpful if your app runs
    with only a subset of the total available files. However, their use may result
    in your scripts loading in a completely random order so you need to ensure that
    will not cause any problems. The user may also experience some delays as requested
    files are loaded.'
