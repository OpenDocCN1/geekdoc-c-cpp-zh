    \ placed between /* and ending another */ is treated as a comment. These tags\
    \ can surround multiple lines of code, or just one line.\n\nI strongly recommend\
    \ using the first type of comments (/) in your code for three main reasons:\n\n\
    +   If you have a /* */ block and insert another /* block inside of it, it will\
    \ most likely throw a JavaScript error.\n\n+   When you do global searches for\
    \ variable names, it makes it easier to find the important strings that are real\
    \ code and not commented if you always use //. Otherwise, any code that is inside\
    \ a block comment may look like valid code.\n\n+   /* may if it surrounds regular\
    \ expressions: var rgex = /c*/;\n\nOne good reason for using block comments may\
    \ be for temporarily commenting out a block of code for testing purposes, knowing\
