    \ varF = varE + 4;\nconsole.log(varF); // 显示 127，因为 -0 强制将 varE//转换为数字\n```\n\n\
    ```\nvar varG = 4 + 4 + \"60\" + 3;\nconsole.log(varG); // 显示 8603\n```\n\n```\n\
    var varH = \"123\" + 4 + 5;\nconsole.log(varH); // 显示 12345\n```\n\n```\nvar varJ\
    \ = \"123\" + 4 + 5 + \"789\";\nconsole.log(varJ); // 显示 12345789\n```\n\n# 将数字转换为字符串\n\
    \n将数字转换为字符串比相反的操作要简单得多，但你仍然有几个选项需要考虑。你可以：\n\n- 简单地在数字后面加上一个字符串或空字符串 \"\"，类似于：\n\
    var num = 22;\nvar numStr = num + \"\"; // numStr 现在是一个字符串\n\n- 使用 `toString()`\
    \ 方法强制将其转换为字符串。这种方法的好处是允许你指定转换的进制：\nvar num = 22;\nvar numStr = num.toString();\
    \ // 使用默认的 10 进制\nvar newStr = (3267).toString(16); // 生成 \"fff\"\n\n- 如果你想控制小数位数或添加小数，请使用\
    \ `toFixed()` 方法。如果你正尝试在表格中对齐小数，这可能会非常有用。如果命令对最后一位小数进行了舍入，你可能会根据不同的浏览器得到不同的舍入结果，因此如果这很重要，你应该对其进行测试。请记住结果是字符串，所以不要对它进行数学运算。\n\
    \n```\nvar num = 8.3;\nvar newStr = num.toFixed(2); //\"8.30\"\nvar newNum = newStr\
    \ + 1.1; //\"8.301.1\" 哎！\nvar new2 = (num + 1.1).toFixed(2); //\"9.40\" 正确！\n\
    ```\n\n以下转换测试的声明为：\nvar num = 22.5;\n\n# 性能测试\n\n| | Safari | Chrome | Firefox\
    \ |\n|---|---|---|---|\n| 1. var numStr = num + \"\"; | 33 | 607 | 1,038 |\n|\
    \ 2. var numStr = num.toString(); | 16 | 39 | 64 |\n| 3. var numStr = num.toString(10);\
    \ | 15 | 24 | 55 |\n| 4. var numStr = num.toFixed(1); | 7 | 3 | 9 |\n| 5. var\
    \ numStr = (parseInt(num * 10) / 10) + \"\"; | 20 | 54 | 35 |\n\n测试 3-6: http://www.javascript.com/tests/Test-NumberToTesting.html\n\
    \n从性能数据中可以看出，在所有情况下，添加空字符串的简单操作都更快，在 Chrome 和 Firefox 中速度快了高达 20 倍。`toFixed` 选项非常慢，但如果你需要它，就必须使用它。测试\
    \ 5 显示了另一种将数字转换为带一位小数的字符串的方法。它比 `toFixed` 快几倍。\n\n# 注意浮点数算术\n\nJavaScript 使用双精度浮点数存储数字，使用\
    \ 64 位来存储每个数字。如果你不小心，可能会导致精度错误。请注意以下表达式：\n\n```\nvar x = .2 + .1; // x = 0.30000000000000004\n\
    ```\n\n如果你在这些情况下需要更好的精度，你可能需要对数字进行乘法和除法，例如执行如下操作：\n\n```\nvar x = ((2 * 10) +\
    \ (1 * 10)) / 10; // x = 0.3\n```\n\n# 关于数字的其他奇怪陷阱\n\n关于 JavaScript 中使用数字还有其他一些陷阱，包括：\n\
    \n- **前零。** 某些浏览器会将带有前零的数字解释为八进制数。因此，\n  var x = 012; // x = 10 (八进制 012 = 十进制\
    \ 10)\n  var x = 12; // x = 12\n- **十六进制。** 要使用十六进制表示设置数字，只需在数字前加 0x，类似于：\n  var\
    \ x = 0x12; // x = 18 (十六进制 12 = 十进制 18)\n- 要产生数字的十六进制表示，你可以使用带有括号数字的 `toString`\
    \ 方法，类似于：\n  var str = x.toString(16); // str = \"12\" (十进制 18 的十六进制键)\n- **Infinity（无穷）。**\
    \ 你可以使用关键字 `Infinity` 将变量设置为无穷大值，或者通过除以零来设置。因此，\n  var x = Infinity; // x 现在大于所有数字\n\
    - **NaN。** `NaN` 代表“不是数字”（Not a Number）。当数学运算的结果不是数字时，就会返回 `NaN`。例如：\n  var x\
    \ = \"abc\" * 2; // x = NaN\n\n# 循环\n\n在 JavaScript 中处理循环有多种方法，包括：\n\n- **for\
    \ 循环。** 这是最常用的循环方式：\n  for (var i = 0; i < 5; i++) {\n    console.log(i);\n  }\n\
    - **while 循环。** 当条件为真时持续执行：\n  var i = 0;\n  while (i < 5) {\n    console.log(i);\n\
    \    i++;\n  }\n- **do...while 循环。** 这种循环至少执行一次，然后检查条件：\n  var i = 0;\n  do {\n\
    \    console.log(i);\n    i++;\n  } while (i < 5);\n- **forEach 循环。** 对数组中的每个元素执行函数：\n\
    \  var arr = [1, 2, 3];\n  arr.forEach(function(num) {\n    console.log(num);\n\
    \  });\n- **for...in 循环。** 用于遍历对象的属性：\n  var obj = {a: 1, b: 2};\n  for (var key\
    \ in obj) {\n    console.log(key);\n  }\n- **for...of 循环。** 用于遍历数组或其他迭代对象：\n \
    \ var arr = [1, 2, 3];\n  for (var val of arr) {\n    console.log(val);\n  }\n\
    \n"
