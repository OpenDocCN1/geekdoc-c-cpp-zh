  - '[PAGE 177]


    # Back button


    If your apps are more than simply linked html screens, the use of the browser
    back button may cause problems. Many of the frameworks use # hashtags and URLs
    to move between functional areas. This allows the user to use the browser back
    go to the previous URL since it is in the browser history stack. However, that
    may not be what you want. In many apps, the screens are dynamically created and
    the correct handling the ''back'' button is not clear. What happens in a browser
    if you save the screen as a favorite? What about running it later? Can you go
    backwards and forwards?


    # Screen size


    You need to be aware of the screen variations in your target market that you will
    need to support. These sizes can range from smaller sizes for small mobile devices
    to high resolution computer displays. The items to consider include:


    +   **Minimum and maximum screen size.** If you are making an application for
    a company, they may have requirements for screen size support. If you are designing
    for the general public, you will have to determine what range supports your requirements.
    The minimum size is usually more critical as even 800 x 600 can be hard to support.


    +   **Mobile device size.** If you are supporting mobile devices, either by writing
    responsive web pages or an actual mobile application, you will have to determine
    exactly which devices you feel must support. You will most likely run on other
    mobile devices but this will be the list of devices you are testing with your
    software.


    +   **Portrait vs landscape.** If you are supporting mobile devices, you may have
    to decide if you support them in both portrait and landscape modes. There are
    so many sizes for phones and tablets that the lines between portrait and landscape
    are blurred. However, there are a number of apps that will only run in either
    portrait or landscape on smaller phones. Your app may have lists that just work
    in portrait.


    +   **Responsive apps and web pages.** You should always write your applications
    to be responsive to screen sizes so that they automatically scale as the user
    resizes their window. You may make the app resizable to any size, or you may decide
    that there will be a minimum size (800 x 600) that will not go below. Your app
    should smoothly scale up and down the window size changes.


    # Double Negatives


    Avoid negatives as they can be confusing. Try to avoid options that say something
    like:


    +   - Hide comments

    or


    +   - Disable display of warning messages'
  - '[PAGE 178]


    # Colors


    There are two main uses of color in your application:


    +   * To reinforce a company or product line color scheme.

    * To convey knowledge to the user to assist in making the correct decisions.


    Your designer should come up with a limited palette of colors that will be used
    throughout your product. This is often based on existing websites or programs,
    and often incorporates the company''s logo and trademark colors. Remember that
    most largest companies have very detailed and exacting specs for their corporate
    look. They will have exact color values for anything associated with their company
    name, and colors must meet their guidelines. Each color should be identified for
    exactly where in the interface they will be used, including:


    +   * general display and highlight colors

    * background color

    * body text and text emphasis

    * url links

    * headings and subheadings


    Some areas to be careful of when considering what colors to use include:


    +   * Be careful with your palette and selection, particularly if you get into
    very bold colors. There are cultural differences in acceptable colors, for both
    text and background so you need to make sure you understand the target audience.
    Asian markets tend to be more receptive to very unique set of colors. If you are
    designing software that will be on TVs, the traditional approach should be to
    avoid saturated colors, even black. Do not use a solid red (#ff0000) and your
    whites should be toned down-use #ffffff instead of #ffffff.

    * I would avoid light text on dark backgrounds for large areas of text. It fine
    another color selection is to use dark gray for your body text. This can create
    a very distinctive look to your application or website. Just be sure your text
    is not too hard to read on the devices you are targeting.

    * You also have to be careful if you have text anywhere that the user can select,
    as selection may result in colors inverted, for both text and background. Make
    sure that if there are any persistent selections that this inversion does not
    confuse the user.

    * Colors can also have meanings in different cultures. Be careful assuming that
    red means danger and green means OK.


    # Typefaces


    Don''t get carried away. This is one of the most obvious beginners mistakes, whether
    it is in fonts for web pages, Word documents, or applications. There are so many
    cool fonts available, and it is easy to switch them, that you can easily produce
    random-looking screens. Stick to a very small set of font families and use bold,
    italicizing, and sizing sparingly and for each. These fonts, sizes, and effects
    should be part of the style sheet that the designer creates for the programmers.'
  - '[PAGE 179]


    # Feature Creep


    Avoid feature creep at all costs. Keep your focus tight on the original business
    requirements for the product. Any additions should be justified only if they meet
    those requirements. If you come up with new ideas, put them in your “Version 2”
    folder. A closely related area to avoid is design by committee. The more people
    that are involved with your design process, the longer it will take and less focused
    your application might be. That doesn''t mean you should avoid input from others—just
    be careful that you keep your focus and control how input is received from others.


    # Don’t make obvious mistakes


    I have seen too many screens on well-known programs that get the simplest things
    wrong.


    +   Order of controls. My favorite is the use of left/right arrows (or prev/next).
    At least in western culture, things tend to move from left to right. Timelines
    move from older events on the left to newer events on the right. If you are displaying
    text as pages, then the previous page is to the left. If you have a horizontal
    list of anything (pictures, pages, etc.), put your navigation buttons in the correct
    order.


    Not: Next | Prev But: Prev | Next


    +   Errors. Make sure users can’t get trapped in a loop, unable to carry out what
    they want, or even get out of the error condition. This problem could be something
    as obvious as the same error dialog popping up continually, or error conditions
    that don’t tell the user what they need to do.


    # Learn from others


    Don’t beat your head against the wall when designing new functionality. Someone
    else has probably already done it, and they probably had a lot more money and
    people involved than you do. Learn from their designs—and their mistakes. There
    are lots of applications and websites that you can look at for free to see how
    they handled their UI design.'
  - '[PAGE 180]


    > “First, solve the problem. Then, write the code.”

    - John Johnson'
