    # Introduction


    Writing applications using JavaScript, HTML, and CSS can be fun and rewarding.
    JavaScript is a fairly easy language to learn and HTML/CSS makes it easy to create
    great looking interfaces without a lot of graphics experience. It is easy and
    inexpensive to get your own website up running, or not just simple web pages.
    There are a number of reasons for these problems with many libraries and frameworks
    you can download to help your development efforts.


    However, this same low barrier to entry makes it easy for bad JavaScript apps
    to be written. And by bad, I don''t mean just inefficient code, but also apps
    that involve bad design and framework decisions. And this criticism is directed
    mainly at single-page, multi-screen JavaScript applications, and not just simple
    web pages:


    +   * Novice programmers who have little or no training or experience in programming.

    * Designers and programmers coming from page-oriented web site.

    * Experienced C++ and Java programmers that don''t really understand how best
    to write JavaScript applications.

    * Fast desktops with memory that hide inefficienciesencies in code that may have
    to run on less powerful computers and mobile devices.


    # Why write about native JavaScript?


    Many JavaScript websites and applications use any of libraries and frameworks
    along with their native JavaScript code. In many cases, they can shorten the development
    cycle and make the code easier to maintain by large development groups. However,
    I found when writing high performance applications or highly customized applications
    these cause more trouble than they are. They add to the size of the code, slow
    things down, and often make maintenance harder because of having to track versions.
    Often, you will find a library to carry out a specific graph or UI function only
    to find when you are done it does not exactly what you need and may be more trouble
    than it is worth to change it. Once modified, you no longer have a standard plug-in
    but customized code that you have to maintain. So this book concentrates on helping
    you write smaller and faster JavaScript code.


    There are lots of books about the many libraries and frameworks available for
    JavaScript development. If you develop websites and applications in JavaScript
    you most likely will use one or'
  - '[PAGE 12]


    # JavaScript: Optimizing Native JavaScript


    more of them in the course of your career. But remember that these libraries and
    frameworks are all themselves written in JavaScript and share all of the strengths
    and weaknesses pointed out in this book. Your knowledge of native JavaScript can
    only help you in your efforts.


    # Target audience of this book


    JavaScript: Optimizing Native JavaScript assumes that you have a good working
    knowledge of writing JavaScript applications or webpages using JavaScript, HTML,
    and CSS. You need to understand how those three systems interact and how to structure
    common applications. This book is not a language reference but more a collection
    of information to help you write more efficient JavaScript programs. Even if your
    application requires the use of frameworks and libraries, knowing how to code
    more efficient JavaScript will be important. In these cases, you can still use
    frameworks and libraries for the majority of the code native JavaScript where
    performance is important.


    # Based on real-life experience


    I have designing and programming JavaScript applications for more than 17 years.
    Most of this work was on applications designed for low memory and slow CPU platforms,
    such as set-box copies and mobile devices. I found that many recommended solutions
    didn''t necessarily make sense in real situations. When you were producing applications
    on deadlines, you tend to have different restrictions, methods, and goals.


    Through years of examining JavaScript code, I discovered repeating conditions
    that led to the JavaScript/HTML code running poorly on the targeted platforms.
    These conditions included excessive number of objects, unnecessary date manipulation,
    excessive error checking, creation of excess garbage, using inefficient libraries,
    and poorly designed data structures. In many cases, I was able to reduce code
    size up to 60% while doubling the speed of the code.


    # Write your code for others


    Remembersomeone else will very likely have to maintain or decipher your code.
    Or you may have to read someone''s code and feel able to reuse it instead of starting
    again. The clearer and simpler the code is, the more likely it is to be reused—and
    this saves time and money.


    Assume that whoever will be trying to make sense of your code does not know as
    much as you do. Be careful if you write code function is not obvious or could
    be ambiguous. If you are using some esoteric feature of JavaScript or some pattern
    that requires programming references to how to use it—probably shouldn''t. There
    are always good reasons to use some of these advanced methods if your program
    requires it—just make sure adequately document the code with clear in-line comments.


    JavaScript, with its global namespace and interpreted functionality, is just different
    from most other languages. And writing code for applications that meet real deadlines
    and have compact code that must perform on a variety of platforms is always a
    challenge.'
- md: '

    # Why is this book different from other books on JavaScript?


    This is not a JavaScript reference book. It is not about using the latest frameworks
    and libraries. It does not cover esoteric coding solutions and algorithms, nor
    do I get into the inner workings of the JavaScript engine. This book assumes you
    already know JavaScript at some level and you can program simple pages. For more
    advanced JavaScript programmers, there are a number of good reference books available.


    A lot of my experience is on set-top devices that are limited in CPU power and
    RAM, so writing simple and fast JavaScript was imperative. But the same concepts
    apply even with faster PC browsers and mobile devices with more memory: Like everything
    else in computing, extra speed and memory is quickly consumed by larger pictures,
    video, and 3D graphics so you are right where you started. Some applications or
    companies may require use of specific frameworks or libraries, such as Angular
    or jQuery, but there are other times and projects where a more basic approach
    may be warranted.


    My approach is practical. If you include code that is very difficult to understand
    (particularly if you don''t comment properly), then you probably shouldn''t be
    including that code unless you show that it gives you an advantage in speed or
    memory usage. This book should help you in real-life situations writing real code
    on a real schedule for projects.


    # Where is the code?


    Some of the code referenced in this book can be found on our website at www.Nativejavascript.com.
    The comparison tests found throughout the book reference lines at website where
    the tests can be run. The speed tests are not definitive as absolute times vary
    greatly with browsers, browser versions, and computer systems. You don''t want
    to fixate on these times as many operations are so fast you can afford to take
    extra milliseconds and you may not want to sacrifice readability for speed. But
    if you know what types of operations and patterns are faster, use them as your
    first choice, or when you choose to optimize.


    # Conventions in this book


    The following conventions are shown in a fixed pitch font, such as:


    - **Code.** `else if (x==1) { elem.style.backgroundColor = sBackalternate;`


    - **Performance examples.** Throughout the book, there are tables showing performance
    testing of various coding alterings on different browsers. This shows the relative
    number of operations for each example and browser. Higher numbers indicate better
    performance. These numbers only make sense in relation to each as they are the
    times to perform thousands of operation and in many cases the numbers have been
    shortened for readability. Beneath each table is listed the URL where you can
    run the performance test yourself. The numbers rather than trying to compare times
    across browsers.


    # JavaScript: Optimizing Native JavaScript


    | PERFORMANCE TESTING | OPS (bigger is better) | | | |

    |---|---|---|---|---|

    | 1. test 1 | 711 | 1,350 | 1,312 |

    | 2. test 2 | 702 | 3,330 | 1,634 |


    Test 3-5: http://www.nativejavascript.com/tests/Test-Sample

    NOTE: Performance numbers listed for all the tests in this book may change with
    each new browser version release. Some operations may get faster, while others
    may even get slower. Test them again before relying on them in your.


    - **Browsers Tested:** The various performance and memory shown in this book are
    generally done with the following browsers, though exact version numbers were
    constantly changing. Running the same tests again may produce different results
    due to newer versions of browsers, different computer speeds, other applications
    running at the same time, however, unless a specific browser has optimized a certain
    feature (or degraded it), the relative results should be similar. We tested on
    both Windows and Macintosh. The versions used for our tests are listed below.
    You can run the tests from our website whichever browser you want.

    - Chrome: 55.0

    - Safari: 9.1

    - Firefox: 50.1.0


    # Terms and abbreviations in this book


    - **API:** Application Program Interface. Describes the exact specification allowing
    applications to communicate with other applications and servers.

    - **app:** An abbreviation for application.

    - **camelCase:** Describes a common way to represent variable names by uppercase
    letters inside the word to make it easier to read.

    - **DOM:** Document Object Model. Describes the elements making up your displayed
    HTML.

    - **GC:** Garbage collection. An automatic process carried out by browsers to
    free up memory used by objects that are no longer in use.

    - **IDE:** Integrated Development Environment. A software application designed
    to assist programmers in writing and running code, such as Eclipse or IntelliJ.

    - **JSON:** JavaScript Object Notation. A common data representation format used
    to transfer data to and from applications.

    - **JSONP:** JSON with Padding. A method to send and receive JSON objects between
    different browser locations (cross-domain). It requires JSON object to be wrapped
    in a function statement.

    - **UI:** User interface. This describes the visual representation of the application
    and how it interfaces with the user.


    ## Chapter 1: Basic Principles


    # 1 Basic Principles


    There are a number of principles you should keep in mind during all stages of
    your application process, from design to implementation. These principles help
    drive your coding style and influence all the decisions you have to make during
    the project. I have been surprised at the number of times they will be ignored.


    Problems often arise when you are interfacing between different groups involved
    in the application process. If these groups are not aware of the Limitations (and
    strengths) of JavaScript/HTML, it is often easy for them to overlook some basic
    design principles. The main groups that you will be concerned with:


    - **Designers.** If designers treat each UI screen as separate HTML screen, then
    you will have problems designing an optimized application. They must understand
    that you are usually better off sharing many screens and code as possible. Even
    if your application loads a number of separate caches, you are still better off
    using shared files since they can be cached for faster loading.

    - **Server programmers.** They may ignore what is better for the application in
    designing their API''s and data structures. They need to understand that their
    data packets have to be small and appropriate to the needs of the application.
    You need to work together to maximize the amount of data that can be cached by
    avoiding URL strings. The server data should be formatted to avoid having the
    client application remnant and map any data. One of the advantages of the JSON
    data format is that it can be converted directly into JavaScript objects, reducing
    code size and garbage production. Parsing XML in JavaScript is much more difficult.


    # Principles


    All things being equal—smaller and faster is better, unless it makes the code
    hard to understand or maintain. You often don''t know what programs or libraries
    will be loaded at the same time as your code, so make it as small and fast as
    you can. Even an extra 20 or 30 milliseconds of execution time may cause your
    UI to suffer in some cases, especially in fast-scrolling situations.


    # Size still matters


    Smaller is better and bigger...well, bigger. It is easy to fall into complacency
    when programing on a powerful computer with lots of memory. But you should always
    strive to reduce the memory footprint of every function that you create. This
    applies to the objects and arrays that you create, the images that you place in
    UIs, and all data you need. The reasons you need to keep it small include:


    - Mobile devices have to download using limited bandwidth. And downloads over
    the cellular network are slower than what you get on regular connection. You don''t
    necessarily know what app or data will be loaded at the same time. This is true
    of frameworks and libraries that may be loaded by your app.

    - Creating and destroying strings, or loading and deleting data, creates memory
    usage. The way JavaScript is designed, you are unable to force garbage collection
    (GC) from the code but must rely on the browser to decide when. If this happens
    at the wrong time, when the user is fast scrolling a table, the UI can be adversely
    affected. You should try to write all your functions to be as fast as possible
    while keeping the code readable. This does not optimizing your code at every step
    of the project. There is a good argument for waiting until your logic is in place
    before optimizing your code. You often won''t know what optimizing strategies
    are best until you have all pieces of the logic in place. But that doesn''t mean
    you can''t apply the best principles as you are writing your code.


    # Speed still matters


    Faster is better. You should try to write all your functions to be as fast as
    possible while keeping the code readable. This does not optimizing your code at
    every step of the project. There is a good argument for waiting until your logic
    is in place before optimizing your code. You often won''t know what optimizing
    strategies are best until you have all pieces of the logic in place.


    # JavaScript: Optimizing Native JavaScript


    The methods discussed in later chapters, such as using variables or declaring
    an array length outside of the for loop, should always be used.


    # Flatter is better


    Make your UI designs as flat as possible. This is much more important for single
    screen applications. Design your screens to include common navigation and filtering
    controls on the same screen without creating nested menus that the user must navigate
    to carry out functions.


    # The server shouldn''t make UI decisions


    Make sure the data delivered by the server doesn''t restrict or change the functionality
    of your UI. If the server gives you dates in the wrong format, or unused data,
    or fields that are unnecessarily long, they are impacting the performance of your
    application. If the server can''t give you enough at one time to fill your screens,
    your user''s experience may suffer. If the server gives excessive data that must
    be garbage collected on your end, your performance will suffer. Make sure the
    server team is involved in your design procedure early so they can deliver optimized
    and appropriate information. I had projects where the server team refused to optimize
