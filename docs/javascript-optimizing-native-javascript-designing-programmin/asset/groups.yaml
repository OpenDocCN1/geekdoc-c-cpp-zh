    # 140 · JavaScript: Optimizing Native JavaScript


    ## Elements


    ![](img/10c5df588c0c6e2580324246d7b5735f_146_0.png)


    This is probably the most helpful tool on the toolbar. The Elements tab shows
    the DOM tree with all the properties that have been assigned to each element due
    to cascading sheets and styles assigned directly to the elements. This can also
    be displayed by right clicking on an element in your browser window, and selecting
    ''Inspect''. This view is not the same as selecting View Source as that view is
    the original HTML without any dynamically added or changed HTML. You can use the
    Elements tab to override any class or property and immediately see it. Simply
    select the element in the left pane and enter or change the property in the right
    panel. The diagram at the bottom of the right pane shows all the ''box'' values
    of the selected element - position, size, padding, border, and margin. The top
    right pane is sub-divided into more tabs. The most used are:


    - *Styles*: Lists all properties in the inheritance tree from what CSS class and
    file. Properties that have been overridden by an other class or style will be
    shown with a strikethrough.


    - *Event Listeners*: Displays all listeners in element for handlers like click,
    scroll, and unload.


    ```javascript

    copy (xx)

    ```


    # 142 JavaScript: Optimizing Native JavaScript


    ## Sources


    ![](img/10c5df588c0c6e2580324246d7b5735f_148_0.png)


    The Sources tab is your tool for line-by-line debugging of your code. After your
    has loaded, you can pull up this tab and set breakpoints anywhere in your code.
    You can locate your JavaScript file in the upper left pane, scroll down to the
    line you are interested in, and click on the line number to set a breakpoint.
    You can then run your code and the app will pause when it hits a breakpoint. You
    can then see the display of all variable values in the right hand pane as you
    use the controls to walk through the code. You can also run the Pretty-Print tool
    (#5 above) to make minified scripts readable. The available items include:


    - Select file to examine.

    - Click on line number to set a breakpoint indicated by the blue arrow.

    - Once breakpoint is reached, use these tools to walk through the code, including:
    run/pause, step over, step into, step out, of activate/deactivate breakpoints.

    - The values of all variables, local and global, can be accessed here.

    - Pretty minified code.


    # Chapter 13: Debugging · 143


    ## Network


    ![](img/10c5df588c0c6e2580324246d7b5735f_149_0.png)


    The Network tab lists all of the files that have been requested in the left side.
    You can see the URL of each returned in response and examine all the details of
    each request and see the payload that was returned in response. This allows you
    to find mistakes in your requests or in the response. The list also shows how
    long each request takes to be filled. My most common usage of this tab is to right
    click on a file in the list at the left and select the ‘Open in new tab’. This
    will fetch the again and show the results in a new browser window. You can only
    use this for GET requests and not POST requests. If you are using JSON data, be
    sure to add a JSON formatter to your response so it is nicely formatted. Clicking
    on the response menu will display all of the headers:


