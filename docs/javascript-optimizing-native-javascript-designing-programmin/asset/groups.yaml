    - 使用 with 语句\n- 对其他变量名使用的限制\n- 不再支持 arguments.callee\n\n## 14 JavaScript: 优化原生\
    \ JavaScript\n\n### 注释\n\n### 注释样式\n\n即使是注释这样简单的内容也需要一致地处理。在 JavaScript 中，可以使用两种类型的注释，你可能会读到推荐每种类型的书籍或文章。你需要为\
