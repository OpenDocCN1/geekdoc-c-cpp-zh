  mdcn: "\n\n## 附录 B：UI 设计 • 165\n\n## 从用例开始\n\n开发新应用程序最重要（也最被忽视）的步骤显然是明确应用程序应该做什么。最最好的方法是通过识别最常见的“用例”来实现，这些用例描述了你的软件应该完成的各种任务。敏捷环境通过故事来描述它们。目前许多系统在使用各种方法和方法论来描述这些，使用了参与者（actors）、目标（goals）和系统（systems）等术语。你的公司对于如何开发和记录用例可能有特定要求——最重要的是花时间准确分析你的软件需要完成什么以及将如何被使用。确保你的应用程序：\n\
    \n字体 完成用户需要完成。你可以添加一些酷炫的功能或特殊动画，但只需确保重要任务得以完成即可。\n- 目标用户可以使用。你需要考虑用户的技能和经验。例如，为大众市场设计应用程序与为化学工程师设计的应用程序具有不同的要求。\n\
    \n总的来说，你希望建立若干用例，涵盖你应用程序的所有预期用法。确保你涵盖了所有常见的、预期的操作以及大多数预期的情况。每个用例通常包含以下简化项目：\n\n\
    - 名称（Name）：用例的名称，例如：预订（Make a Reservation）。\n- 参与者（Actor）：执行特定操作的应用程序用户。如果你正在设计一个旅行应用程序，你可能为以下每一项设置参与者：\n\
    \    - 寻找第一班航班的人。\n    - 预订航班的人。\n    - 访问之前订单的人。\n    - 通知航班已更改的人。\n- 操作（Actions）：完成此用例的详细步骤。\n\
    - 结果（Result）：操作产生的可衡量结果。\n- 优先级（Priority）：对该用例重要性的某种指示。\n\n你需要拥有应用程序的完整需求才能创建出正确的用例。确保你对结果的测量尽可能客观。你的结果不能是“导航快速”或“易用”——它应该是具体的且可衡量的——例如“在\
    \ 2 秒内完成全页滚动”或“95% 的用户第一次选择了正确的菜单项”。\n\n## 观察你的用户\n\n大多数时候，对我发布的应用程序感到不满意，是因为我没有（或没有时间）与用户坐在一起，观察他们如何与软件交互。有时，客户可能很难与他们的用户见面；日程太紧，无法做到。即使你符合目标用户的需求，你离产品也太近了，无法作为一个良好的测试案例。如果你有访问权限，请务必：\n\
    \n## JavaScript：优化原生 JavaScript\n\n- 学习他们现在是如何完成任务的，无论是手动还是使用其他软件。向每位用户提问：你现在在做什么？如果发生这种情况会怎样？什么会让这项任务变得更容易？\n\
    - 尽早制作原型并将其展示在用户面前，然后观察他们的交互并向他们提问。在整个过程中尽可能可行地这样做。\n- 你需要观察——不要依赖他人来模仿观察，因为他们通常知道该问什么问题，而他们不知道软件可能实现什么功能。\n\
    - 与用户坐在一起，观察他们执行任务或运行你的程序。\n\n## 业务规则或需求\n\n如果你是为客户或公司开发应用程序，通常会有许多被称为“业务规则”的选项或决策。这些规则影响你的应用程序各个部分的功能，并且通常放在配置文件中，以便于更改。你需要与客户合作，确保你包含了所有必要项目。它们通常影响那些有多种不同且同等有效方式来完成任务的领域。列表通常包括超时、密码规则、标志、API\
    \ 加密等项目。确保在开发周期的尽早让客户详细说明这些内容。\n\n## 模型与隐喻\n\n你的应用程序工作原理的概念模型必须与你实际制作应用程序时使用的模型匹配，否则你将遇到问题。有时问题是由设计师造成的，他们离应用程序太近，对应用程序如何工作做出了假设，而\
    \ UI 的新用户并不知道。你需要在 UI 设计中保持一致性，让用户始终知道按钮和滚动是如何工作的。\n\n一种常见的 UI 设计模式是模仿用户可能熟悉的现有隐喻。这种模式在其他流行程序中，甚至是一个与计算机无关的现实隐喻。为你的程序选择视觉或功能隐喻必须非常小心。你应该选择一种实际上让用户更容易访问你的界面，并让你与该隐喻保持一致的东西。计算机隐喻的例子比比胜，包括：\n\
    \n- 索引卡（Apple 的 Hypercard、闪卡程序）\n- 轮播（Carousels）。通常用于水平滑入滑出的页面。\n- 纸张/笔记本页。看起来像纸的背景图像。\n\
    - 电话簿（Rolodex）。最用于地址列表或类似项目。\n- 文件夹/标签页（File folders/tabs）。标签页用于在不同功能的屏幕之间切换。\n\
    - 书籍（Books）。通常用于显示书架上的书脊，允许用户选择和打开。\n\n## 附录 B：UI 设计 • 167\n\n## 隐喻的问题\n\n1. 强制你所有屏幕的逻辑符合你的隐喻。如果你没有想清楚所有的屏幕，当你尝试编写最后一个屏幕时，你可能会发现你无法将逻辑强加到隐喻中。\n\
    2. 选择一个可能不明显或不为人知的隐喻。这是为了可能跨文化和语言。而且，放大镜是指搜索还是缩放？\n3. 一致性：如果你在应用程序中使用了一种隐喻，你必须保持一致。如果你设计的界面是像轮播一样从左向右切换，那么它就不应该突然从底部弹出。如果你使用书籍隐喻，当你的页面可以上下滚动时，你如何返回目录？\n\
    4. 触摸屏。在运行鼠标的桌面上的界面在在触摸屏的移动设备上可能会有问题。如果你有一个在桌面上通过点击向下箭头滚动的长列表，你可以通过替换列表内容来解决长列表的问题。如果列表很简单，你需要更好的方法让用户滑动屏幕来显示列表。\n\
    5. 同一设备上的其他问题。运行你目标设备的流行程序。Mac 计算机用户。其他应用程序中的功能也可能提高用户对你的应用程序应该做什么的预期。如果你有图片，用户可能期望能够通过捏合来缩放显示。\n\
    6. 小心可能太可爱的隐喻。记得微软的 Bob 应用程序吗？它有很多问题，其中一个就是太可爱了。\n\n## 惯例的存在是有根据的\n\n利用“惯例”的优势。如果存在大多数用户执行功能的被认可的方法，确保你使用它们，绝对不要将它们改为其他东西。UI\
    \ 惯例让用户专注于内容，而不是 UI 导航。减少用户为了导航你的网站而必须付出的任何心理努力。精力太大，用户就会到处去。驾驶汽车已变成一项无意识的任务（想象边开车边吃多汁汉堡），主要是因为汽车行业了汽车的工作方式、油门和刹车的位置，这些惯例是有效的。如果你需要一种方法让用户购买多种物品并随时查看潜在购买列表，可以考虑在每个屏幕顶部提供“购物车”图标，这是一个被广泛接受的惯例。不要把它命名为“购买列表”并在菜单上购买。\n\
    \n我认为谷歌和微软的一些新设计实际上是倒退，因为它们忽略了这些在控件阴影和渐变中的惯例，所以现在很难判断哪些是可点击的控件，哪些只是信息。\n\n"
