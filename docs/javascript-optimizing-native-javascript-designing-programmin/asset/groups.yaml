    \n## 分享、分享、分享……\n\n尽可能多分享代码和屏幕。我指的不是将你的代码写成可以在其他项目中复用的形式。这是一个可以引发讨论的独立议题，因为它往往会增加你的项目时长。我想说的是确保你没有在代码的多个地方复制和粘贴相同的例程。如果你必须执行相同的操作超过一次，请花时间编写一个良好的函数，以便在多处使用。投入更多时间设计你的应用程序前端，并创建可以在多处使用的单函数。这同样适用于你的\
