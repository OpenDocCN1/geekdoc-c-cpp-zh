    # Introduction


    Writing applications using JavaScript, HTML, and CSS can be fun and rewarding.
    JavaScript is a fairly easy language to learn and HTML/CSS makes it easy to create
    great looking interfaces without a lot of graphics experience. It is easy and
    inexpensive to get your own website up running, or not just simple web pages.
    There are a number of reasons for these problems with many libraries and frameworks
    you can download to help your development efforts.


    However, this same low barrier to entry makes it easy for bad JavaScript apps
    to be written. And by bad, I don''t mean just inefficient code, but also apps
    that involve bad design and framework decisions. And this criticism is directed
    mainly at single-page, multi-screen JavaScript applications, and not just simple
    web pages:


    - Novice programmers who have little or no training or experience in programming.

    - Designers and programmers coming from page-oriented web site.

    - Experienced C++ and Java programmers that don''t really understand how best
    to write JavaScript applications.

    - Fast desktops with memory that hide inefficiencies in code that may have to
    run.


    # Why write native JavaScript?


    Many libraries and frameworks use native JavaScript. In these cases, you can still
    use frameworks and libraries where performance is important. This book focuses
    on helping you write smaller and faster code. There are lots of books about many
    libraries and frameworks available. If your application requires the use of frameworks,
    knowing how to code native JavaScript will be important.


    # Target audience of this book


    JavaScript: Optimizing Native assumes that you have a good working knowledge of
    writing applications using JavaScript, HTML, and CSS. You need to understand how
    those three systems interact and how to structure them. This book is not a language
    reference but more a collection of information to help you.


    # Based on real-life experience


    I have designed and programmed JavaScript applications for more than 17 years.
    Most of this work was on applications designed for low memory and slow platforms,
    such as mobile devices. I found that many recommended solutions did not necessarily
    make sense in real situations. When you were producing applications on deadlines,
    you tend to have different restrictions, methods, and goals. Through years of
    examining JavaScript code, I discovered repeating conditions that led to JavaScript/HTML
    code running poorly. These conditions included excessive number of objects, unnecessary
    date manipulation, excessive error checking, creation of garbage, using inefficient
    libraries, and poorly designed data structures. In many cases, I was able to reduce
    code size up to 60% while doubling the speed of the code.


    # Write your code for others


    Remember someone else will very likely have to maintain or decipher your code.
    Or you may have to read someone''s code and feel able to reuse it instead of starting
    again. The clearer and simpler the code is, the more likely it is to be reused—and
    this saves time and money.


    Assume that whoever will be trying to make sense of your code does not know as
    much as you do. Be careful if you write code that is not obvious or could be ambiguous.
    If you are using some esoteric feature of JavaScript or some pattern that requires
    programming references to how to use it—probably shouldn''t. There are always
    good reasons to use some of these advanced methods if your program requires it—just
    make sure to adequately document the code with clear in-line comments.


    JavaScript, with its global namespace and interpreted functionality, is just different
    from most other languages. And writing code for applications that meet real deadlines
    and have compact code that must perform on a variety of platforms is always a
    challenge.

