    \ identify which functions and variables need to be documented and which ones\
    \ are essentially private. When doubt, add comments as you write your code. You\
    \ can always take them out or redo them later.\n\n## Punctuation\n\n### Semi-colons\n\
    \nUnfortunately, the JavaScript spec did not require semicolons to be used to\
    \ terminate every line, but you should ensure that you use them. Even though you\
    \ can get away with not using them, you likely will be tripped up when using a\
