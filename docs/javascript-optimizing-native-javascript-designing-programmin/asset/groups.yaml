    - Many of the libraries and tools may add a lot of code and slow down performance.


    # Frameworks


    There are a number of JavaScript frameworks available today and new ones to be
    added all the time. They help define the structure of your program and help organize
    your code. Most of them are based on a MVC pattern consisting of Model, View,
    and Controller parts.Angular is one of the most popular framework and React is
    one of the newer ones. The frameworks are written in JavaScript and add more code
    to your application, but used properly they should help the amount of code you
    have to write yourself. They have their own learning curves and it is easy for
    inexperienced framework programmers to write really bad code. Most frameworks
    have an active community providing many add-ins. Popular frameworks include:


    +   - Angular

    - React

    - Backbone

    - Ember

    - Spine

    - Ext JS


    # Libraries


    JavaScript libraries are different from frameworks. Libraries make it easier to
    program many of the common functions in applications applications. The most library
    is jQuery and there are many variations available for mobile devices as well.
    They handling Ajax calls for communicating with the server simpel. They historically
    greatly simplified running the same code on different browsers as there were many
    differences that caused problems, particularly with earlier versions of Internet
    Explorer. These differences have largely gone away. Just like frameworks, libraries
    are all written in JavaScript and add significant amounts of code to your app.


    +   - jQuery

    - Zepto.js

    - Prototype

    - Dojo

    - Knockout

    - Underscore'
