    ```


    # Code compilers and minifiers


    There are number of tools you can use to compress your JavaScript before deployment.
    The list includes Google''s Closure Compiler, JSMIN, UglifyJS, and YUI Compressor.
    Most of them have different options to control how much optimization is desired
    during the compile. They work by doing one or more of the following operations
    on your code:


    +   * Remove comments

    * Remove all extra spaces and tabs

    * Combine all lines of code into one line

    * Obfuscate variable and function names to very short 1 or 2 character names

    * Pre-process logic where possible, as changing:


    ```

    var d = 5;

    callFunction(5 + 3 + d);

    ```


    to


    ```

    callFunction(13);

    ```'
