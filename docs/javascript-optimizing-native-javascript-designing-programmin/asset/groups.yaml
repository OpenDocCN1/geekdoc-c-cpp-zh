    \ and enforce that standard."
- md: "\n# Global namespace\n\nJavaScript code runs in a global namespace. This means\
    \ that all your separate functions, variables, objects, methods, and modules share\
    \ a common root, the window object. Nothing prevents you from adding your names\
    \ to the global namespace. If you declare variables outside of your functions,\
    \ or inside a function without a var statement, they will be placed in this global\
    \ namespace. There are a number of good reasons to avoid placing your variable\
    \ and function names in the global namespace, including:\n\n- *They can easily\
    \ be overwritten or deleted by any other program or process that is loaded by\
    \ your application, including libraries and frameworks. Or you may have two of\
    \ your functions relying on the same global variable without realizing that another\
    \ function is changing.*\n- *Relying on global variables and functions can make\
    \ your code harder to maintain. They can discourage encapsulation and code organization\
    \ that will make your modules and functions easier to debug or reuse.*\n- *Accessing\
    \ a global variable directly from a function is slower than a local copy of the\
    \ global variable.*\n- *If your project uses global variables, you must make sure\
    \ you have a strict naming convention in place that prevents programmers from\
    \ declaring variables with the same name. You should be able to assign a company\
    \ prefix to each item in the global space, such as mvModel and mvViews.*\n\n#\
    \ Global namespace solutions\n\nThere are a number of solutions to preventing\
    \ problems when using the global namespace. Normally, you have to place at least\
    \ one object in the global space, if just to hold all of your variables and functions.\
    \ But remember this is not a magic solution—you have one name that can still be\
    \ overwritten, resulting in your entire application being deleted. You still have\
    \ to be careful no matter what you do. Your solution depends on the type of application\
    \ you are writing. If you are writing a specific app where you control all the\
    \ content that will be added to the global namespace, you may pick a different\
    \ solution than an application that has to handle 3rd party libraries or code\
    \ being added to that space. Solutions to consider include:\n\n- *Using objects\
    \ to hold your variables and functions. You can use one global object (which can\
    \ contain multiple objects itself), or a small set of global objects to keep most\
    \ of your names out of the global namespace. Thus, you might have code that looks\
    \ like:*\n\n```javascript\nvar globalObj = {\n  name: \"name\",\n  city: \"city\"\
    ,\n  showName: function() {\n    console.log(\" \" + this.name);\n  }\n};\n```\n\
    \nThis places just one name, globalObj, in the global namespace. The same approach\
    \ works if you create a Constructor function that creates new instances of objects.\n\
    \nUsing closures to keep your variables and functions out of the global namespace.\
    \ This is a common method that both protects the global namespace and allows you\
    \ to keep variables or functions essentially \"private\". There are several ways\
    \ to write these functions, from having a public object with access methods, to\
    \ having a completely anonymous function that runs once when you start up and\
    \ never used again. They may look like:\n\n```javascript\nvar nafDate = function\
    \ () {\n  var localVar = 5;\n  var fname = \"name\";\n  var localMethod = function\
    \ () {\n    console.log(\" \" + fname);\n  };\n  var globalMethod = function ()\
    \ {\n    localMethod();\n  };\n  return {\n    fname: fname,\n    globalMethod:\
    \ globalMethod\n  };\n}();\n```\n\nThis creates a global object called nafDate\
    \ that has only two items that can be accessed outside the function, fname and\
    \ globalMethod, which were both returned when the object was created. The line\
    \ of the declaration that contains ()(); results in the function being immediately\
    \ executed when it is read in, creating the nafDate object. The localMethod cannot\
    \ be accessed outside of the nafDate.\n\n- No matter what approach you take, you\
    \ have to worry about your global names being overwritten by other code. So, pay\
    \ attention to the naming of your global objects. I have used a method of assigning\
    \ a lower case prefix to each functional part of your program that might have\
    \ names in the global space.\n\n# Lowercase and uppercase characters in names\n\
    \nThere are some commonly accepted conventions for naming your JavaScript variables\
    \ and functions. Unless you have strong reasons to adopt another method, I recommend\
    \ using these as it will make your code easier to read by other programmers.\n\
    \n- *Constructors. Constructor functions should start with a capital letter. This\
    \ makes it easy to determine what the function is used for. They should look like:*\n\
    \n```javascript\nfunction MakeView()\n```\n\n- *Regular names. Regular variables\
    \ and function names should start with lowercase letters and be camelCase if needed\
    \ for clarity, such as:*\n\n```javascript\nfunction displayScreen()\n  var dateObj\
    \ = =;\n```\n\n- *Constants. JavaScript has no data type for constants. You could\
    \ simulate constants and declare variables with uppercase letters to make them\
    \ stand out. However, most browsers now support the const statement to be used\
    \ in place of var Variables declared cannot be redeclared or have their value\
    \ changed. You could declare their values like:*\n\n```javascript\nvar kEENT =\
    \ 13; // this can be changed\nconst kLEFT = 37; // this cannot be changed\n```\n\
    \n# JavaScript: Optimizing Native JavaScript\n\n- **Use of underscore.** A common\
    \ convention for methods and properties inside objects that are not \"public\"\
    \ or outside the function is to start the name with an underscore, and then follow\
    \ the naming rules above. Thus, your constructor for MakeView may have a local\
    \ variable: `_netWorth` that is referenced inside that object or closure. There\
    \ is nothing about the underscore—JavaScript doesn't interpret these names differently.\
    \ However, if you don't make closure around the area where it could be referenced\
    \ outside the function if someone knows the name, as `view._netWorth`, then it\
    \ makes it easier to find variables used improperly. If you are able to keep variables\
    \ used improperly.\n- **Characters to avoid.** Avoid using the letter \"l\" or\
    \ \"o\" in names unless they are part of a recognizable word, like `fullName`\
    \ or `logo`. I particularly avoid using these for single letter variables, or\
    \ at ends of names where they may be mistaken for the number zero (0) or one (1).\n\
    \n```javascript\nvar logor = \"logright.gif\";\nvar logo = \"logfile;\n```\n\n\
    ![](10c5df88c0c6e258032426d7b573f)\n\n# Length of names\n\nGet used using short\
    \ names. Spaces space more, but it keeps you always thinking about keeping your\
    \ code small. Remember that since you will likely be compressing your code before\
    \ putting it into production, you will need add comments to your code instead\
    \ of using long names. By keeping your names short to begin with, you reduce the\
    \ need to have your variable names. Don't make them so short or common they become\
    \ hard to find during global searches. Shorter names are easier to type and reduce\
    \ the chances of typing errors.\n\n# Variable names in loops\n\nThe convention\
    \ in JavaScript code seems to be use 'i' as a variable name in loops and 'x'.\
    \ Some coders like to use more descriptive names, like crit or titleIdx that is\
    \ normally not unless you have an extremely long loop. Use `i` (and `j,k` if you\
    \ need more variables inside the loop) but avoid lowercase `l(1)` or the letter\
    \ 'o'. I think you will find it easier to read your code if you are consistent\
    \ in this naming. This is some hard and rule? No...just keep it in mind.\n\n#\
    \ Names to avoid\n\nThere are some names you should avoid using for your variables\
    \ and functions to avoid possible problems. These include:\n\n- Local variable\
    \ names inside function that are same as global variables, even if the capitalization\
    \ is different. This is asking for trouble.\n- Names that are the same as any\
    \ HTML element IDs. This produces unpredictable results, particularly across browsers.\
    \ Even if you think it may help you, don't rely on it.\n"
  mdcn: "\n\n# 全局命名空间\n\nJavaScript 代码在全局命名空间中运行。这意味着你所有的独立函数、变量、对象、方法和模块都共享一个公共根，即\
    \ `window` 对象。没有什么可以阻止你将自己的名称添加到全局命名空间中。如果你在函数外部声明变量，或者在函数内部在没有使用 `var` 语句的情况下声明变量，它们将被放置在这个全局命名空间中。有许多理由可以避免将你的变量和函数名放在全局命名空间，包括：\n\
    \n- *它们很容易被你的应用程序加载的任何其他程序或进程覆盖或删除，包括库和框架。或者，你可能有两个函数依赖于同一个全局变量，而你并没有注意到另一个函数正在更改它。*\n\
    - *依赖全局变量和函数会使你的代码更难维护。它们会阻碍封装和代码组织，而这些组织将使你的模块和函数更容易调试或重用。*\n- *直接从函数访问全局变量的速度比访问全局变量的本地副本要慢。*\n\
    - *如果你的项目使用了全局变量，你必须确保你有一套严格的命名规范，以防止程序员声明同名的变量。你应该能够为全局空间中的每个项目分配一个公司前缀，例如 `mvModel`\
    \ 和 `mvViews`。*\n\n# 全局命名空间解决方案\n\n在使用全局命名空间时，有很多防止问题的方法。通常，你必须在全局空间中放置一个对象，仅仅是为了持有你所有的变量和函数。但记住，这不是魔法解决方案——你仍然有一个名称可以被覆盖，从而导致你的整个应用程序被删除。无论你做什么，你都必须小心。你的解决方案取决于你正在编写的应用程序类型。如果你编写一个特定的应用，你可以控制所有要添加到全局命名空间的内容，你选择的解决方案可能与必须处理第三方库或添加到该空间的代码的应用程序不同。可以考虑的解决方案包括：\n\
    \n- *使用对象来存放你的变量和函数。你可以使用一个全局对象（它本身可以包含多个对象），或一组小的全局对象将你的大部分名称排除在全局命名空间之外。因此，你的代码可能看起来像：*\n\
    \n```javascript\nvar globalObj = {\n  name: \"name\",\n  city: \"city\",\n  showName:\
    \ function() {\n    console.log(\" \" + this.name);\n  }\n};\n```\n\n这在全局命名空间中只放置了一个名称\
    \ `globalObj`。如果你创建一个创建对象新实例的构造函数，相同的方法也适用。\n\n使用闭包（closures）将你的变量和函数排除在全局命名空间之外。这是一个常用方法，既可以保护全局命名空间，又能让变量或函数在本质上保持“私有”。编写这些函数有多种方法，从拥有具有访问方法的公共对象，到一个在启动时运行一次且不再使用的完全匿名函数。它们可能像这样：\n\
    \n```javascript\nvar nafDate = function () {\n  var localVar = 5;\n  var fname\
    \ = \"name\";\n  var localMethod = function () {\n    console.log(\" \" + fname);\n\
    \  };\n  var globalMethod = function () {\n    localMethod();\n  };\n  return\
    \ {\n    fname: fname,\n    globalMethod: globalMethod\n  };\n}();\n```\n\n这创建了一个名为\
    \ `nafDate` 的全局对象，它只有两个项可以在函数外部访问：`fname` 和 `globalMethod`，它们在对象创建时都被返回了。包含 `()();`\
    \ 的声明行会导致函数在被读取时立即执行，从而创建 `nafDate` 对象。在 `nafDate` 外部无法访问 `localMethod`。\n\n-\
    \ 无论你采取什么方法，你必须担心你的全局名称被其他代码覆盖。因此，请注意你的全局对象的命名。我使用了一种方法，为程序中可能在全局空间中有命名的每个功能部分分配小写前缀。\n\
    \n# 名称中的大写和小写字母\n\n有一些被广泛接受的规范。为了让代码更易读，我建议在命名全局变量时遵循这些规则：\n\n- *构造函数。* 构造函数应该以大写字母开头，除非有其他理由。例如：\n\
    \n```javascript\nfunction Screen()\n```\n\n- *普通名称。* 普通变量和函数名应该以小写字母开头，并使用驼峰命名法（camelCase），例如：\n\
    \n```javascript\nfunction display()\n```\n\n- *常量。* JavaScript 没有专门的常量数据类型。你可以使用大写字母来突出显示它们，现在可以使用\
    \ `const` 语句来代替 `var`。它们可能如下：\n\n```javascript\nvar EENT = 13; // 这个可以更改\nconst\
    \ LEFT = 37; // 这个不能更改\n```\n\n# 原生 JavaScript优化\n\n- **下划线的使用。** 对于对象内部的方法和属性，一种常见的约定是使用下划线开头，表示它们不是“公共”的。对于在函数内部使用的变量，例如\
    \ `_netWorth`，JavaScript 不会以特殊方式解释这些名称。\n- **避免使用的字符。** 避免在名称中使用字母 \"l\" 或 \"\
    o\"，除非它们是识别单词的一部分，例如 `fullName` 或 `logo`。我特别避免将它们用于单字母变量，以免被误认为是数字 (0) 或 (1)。\n\
    \n```javascript\nvar logor = \"logright.gif\";\nvar logo = \"logfile;\n```\n\n\
