    # Appendix B: UI Design • 163


    # # UI Design


    Your job as a JavaScript programmer may not directly involve designing the user
    interface. You may have a different person or team that is designing the UI and
    you are simply implementing it. Or you may be in charge of designing and programming
    the interface. In either case, you should be aware of the general guidelines,
    concepts, and best practices for computer interfaces. You don''t necessarily have
    to be a graphic designer as well as you can easily get skills provided by someone
    else. This chapter includes recommendations about UI design from start to end.


    # Single page apps


    Traditional websites often are composed of separate pages that are linked together
    with hyperlinks. You load an entire page, when the user clicks a menu button,
    you replace the current page with a new HTML page, reloading the required JavaScript
    and CSS files. This will result in some screen flashing as the first page is unloaded
    and the new one loaded and displayed. Single page app works a little differently.
    You load all the HTML, JavaScript, and CSS files that you need then hide and show
    the elements as the user navigates the site or application. You can still load
    content only when needed, but the important point is that you don''t change the
    main global context as you don''t have to reload or reset variables.


    Single page apps require you to spend a little more time front designing your
    pages to reuse as much code as possible. If you use a common background for all
    the pages or a common menu, you don''t have to reload anything and you will avoid
    any screen flashing. The same goes for loading the JavaScript code that will persist
    for the duration. Spend the time up to design all the screens and functions of
    your application and you will have a better experience.


    # General UI goals


    There are some basic guidelines that you should keep in mind when designing any
    UI. They include:


    +   - Clarity. Your interface should clearly display its information and have
    controls that are clearly separate from the data.


    +   - Limit options. Having more than 5 or 6 choices on a screen makes it difficult
    for the user.


    +   - Be consistent. All the screens in your application should have a similar
    look and feel, and all the controls should look and act the same way.'
  - '[PAGE 170]


    +   Obvious usage. It should be clear which elements are controls and how they
    operate. Some new looks move away from things like drop shadows, but they do convey
    information about the element. Likewise, if you have a control that looks like
    a slider, it should act like a slider.


    +   Obvious error or warning conditions with obvious solutions. Handle all error
    conditions. For the ones you anticipate, give a clear solution. And be sure to
    add ways to trap unanticipated errors.


    +   Give feedback for all user actions. Pressed buttons change, selected screens
    move, screens should dim when they are not active.


    +   Display progress indicator when the application is loading, waiting, or thinking
    for more than a second or so.


    +   Provide online help wherever needed with access to more detailed help that
    can be loaded as needed or accessed on the Internet.


    +   Keep the interface as flat as possible users don''t lose. Don''t have nested
    levels of menus that require the user to navigate down and back up.


    # Working with graphic designers


    It is imperative to work very closely with the programmers (those designing the
    screens, making your graphics, picking the colors) It is helpful if they also
    know enough about JavaScript/HTML/CSS and your target devices to make the correct
    decisions as they design the screens. And, all they have to ensure their designs
    are optimized for a single page app. The worst case, in my experience (other having
    no designer), is to have a separate designer or design team that designs Photoshop
    in a vacuum, and then delivers a set of multi-layered PSD to the helpless programmer.
    There is no reason that the designer can''t provide you with proper CSS and final
    image files. Remember that not all Photoshop designs translate directly to CSS
    (like gradients), and, in event, the programmer will have to spend time converting
    all of the other properties.


    The designer must also stay well in the logic flow of the program. The entire
    app has to be thought through and all corner cases considered up front while you
    are designing the UI—don''t wait until halfway through.


    # Corner cases


    You will see and hear of "corner cases" or "edge cases" when you are designing
    and debugging your interface. These are the problems that occur when abnormal
    situations occur or when users call out some function or of functions in a manner
    not normally used. Many times fixing these corner cases can be deferred if you
    determine that they will rarely happen or that the consequences are minimal. However,
    I have seen many UI designs fail because ignored corner cases. These cases must
    be considered when you are designing your main interactions because they can easily
    invalidate your approach.'
- md: "\n## Appendix B: UI Design • 165\n\n## Start with use cases\n\nThe most important\
    \ (and most overlooked) step in the development of a new application is clearly\
    \ identifying what the application should do. This is best done by identifying\
    \ the most common 'use cases' which describe the various tasks that your software\
    \ should accomplish. The Agile environment tells them stories. There are a number\
    \ of systems in use that various methods and methodology to describe these, using\
    \ terms like actors, goals, and systems. Your company may have specific requirements\
    \ for how you should develop and document use cases—the most important thing is\
    \ to take the time to analyze exactly what your software needs to accomplish and\
    \ how it will be used. Make sure your application:\n\n- Accomplishes what the\
    \ user needs to get done. You can add some cool features or special animations\
    \ but just make sure the important tasks are accomplished.\n- Is usable by the\
    \ target user. You need to take into account the skill and experience of the user.\
    \ Designing an application for the mass market has different requirements than\
    \ one that would be used by chemical engineers, for example.\n\nIn general, you\
    \ want to build up a number of use cases that cover all the expected usages of\
    \ your application. Make sure you cover all of your common, expected actions and\
    \ most of the anticipated cases. Each case usually includes the following simplified\
    \ items:\n\n- Name: Name of the use case, such as: Make a Reservation.\n- Actor:\
    \ This is a user of your application who carries out a specific action. If you\
    \ are designing a travel application, you may have actors for each of the following:\n\
    \    - Person searching for first flight.\n    - Person reserving flight.\n  \
    \  - Person accessing previous reservation.\n    - Notifying person that flight\
    \ is changed.\n- Actions: Detailed steps to accomplish this use case.\n- Result:\
    \ A measurable result from the actions.\n- Priority: Some indication of the importance\
    \ of this case\n\nYou need to have the complete requirements for your application\
    \ in order to make the correct use cases. Make sure your measurements of results\
    \ are as objective as possible. Your result can't be \"fast navigation\" or \"\
    easy to use\"—it should be concrete and measurable—full page scroll in less than\
    \ 2 seconds\" or \"95% of users select proper menu item the first.\"\n\n## Observe\
    \ your users\n\nMost of the times I have been unhappy with applications that I\
    \ have released have not been able (or had the time) to sit with users and watch\
