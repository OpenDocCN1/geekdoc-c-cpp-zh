    \ based on logical levels. Many editors and SDK's do this automatically. Just\
    \ make sure that it gets done. You may want to indent each level by two or four\
    \ spaces. You also want all braces that are logically connected to have the same\
    \ level. It will make it much easier to check your code for unmatched braces or\
    \ bad logic. This also applies to your HTML code. So your code should look like:\n\
    \n```\nfor (var i = 0; i < 10; i++) {\n  for (var j = 0; j < 5; j++) {\n    if\
    \ (i == 0) {\n      //code here\n    }\n  }\n}\n```\n\n# Lining up equals signs\n\
    \nAnother formatting option you may see often in third party code, and that I\
    \ tend to use, to line up the equal signs or object properties when successive\
    \ lines are very similar. If you are compressing code, these spaces will be removed\
    \ and sometimes the extra indent makes it easier to read the code. It might look\
    \ like:\n\n```\nvar thisum = 5;\nvar idx = 12;\nvar str = 'name';\nvar obj = {\n\
    pl: 'value',\ndateprop: 123,\nidx: 1\n}\n```\n\n# Variable and function names\n\
    \nThere are a number of naming conventions that are generally accepted as well\
    \ as others that are sometimes contentious. There are a few restrictions on naming\
    \ that are enforced by JavaScript engines, including:\n\n+   **Case-sensitive.**\
    \ JavaScript names are case-sensitive. Thus, thisVar and ThisVar are treated as\
    \ separate variable names.\n\n+   **Reserved words.** There are a number of words\
    \ that are reserved by the JavaScript language. You can see a complete list at\
    \ //developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Reserved_Words\n\
    \n+   **Special characters.** Names should consist of letters (A-Z, a-z), numbers\
    \ (0-9), and the underscore (_). Don't use special characters and I would avoid\
    \ international currency symbols as could be misinterpreted and harder to search.\
    \ I would also avoid using the dollar sign ($), even though it is valid, as it\
    \ is used by frameworks as an alias and could be misinterpreted. Numbers are valid\
    \ but may not start a variable or function name.\n\nAll other naming suggestions\
    \ rely on coding convention and handling the global namespace of JavaScript. As\
