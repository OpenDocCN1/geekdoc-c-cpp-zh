  \ playlist），它包含了集合中的所有歌曲。定义这三个类并编写方法以实现以下操作：\n\n- 创建一个 `Song` 对象并设置其信息。\n- 创建一个\
  \ `Playlist` 对象，并向播放列表添加歌曲或从播放列表中移除歌曲。如果新歌曲不在主播放列表中，则应将其添加到主列表中。确保如果一首歌曲从主播放列表中移除，它也会从音乐集合中的所有播放列表中被移除。\n\
  - 创建一个 `MusicCollection` 对象，并向集合中添加播放列表或移除播放列表。\n- 搜索并显示任何歌曲、任何播放列表或整个音乐集合的信息。\n\
  \n确保你所有的类都不会发生内存泄漏！\n\n## 10. 编写一个程序，接收一个包含 `NSNumber` 对象的 `NSArray`（其中每个 `NSNumber`\
  \ 代表一个整数），并生成一个频率表，列出每个整数以及它们在数组中出现的次数。使用 `NSCountedSet` 对象来构建你的频率计数。\n\n## 11.\
  \ 当使用 `addCard:` 方法向地址簿添加地址卡片时，谁拥有该地址卡片？该卡片上的任何信息稍后可以被修改并影响存储在地址簿中的卡片吗？你能想到一种更安全的方法来实现\
  \ `addCard:` 方法吗？\n\n## 第 16 章：文件操作\n\nFoundation 框架允许你访问文件系统，以对文件和目录执行基本操作。这是通过\
  \ `NSFileManager` 提供的，它的方法包括以下能力：\n\n- 创建新文件\n- 从现有文件读取\n- 向文件写入数据\n- 重命名文件\n- （删除）文件\n\
  - 测试文件是否存在\n- 确定文件的大小以及其他属性\n- 复制文件\n- 测试两个文件以检查其内容是否相等\n\n这些操作中的许多也可以在目录上执行。例如，你可以创建一个目录、读取其内容或删除它。另一个功能是\
  \ `link`（链接）文件的能力。也就是说，允许同一个文件以两个不同的名称存在，甚至可能在不同的目录下。\n\n要打开文件并对该文件执行多次读写操作，你可以使用\
  \ `NSFileHandle` 提供的方法。该类中的方法允许你：\n\n- 打开文件进行读取、写入或更新（读写）\n- 寻到文件内的指定位置\n- 从文件和向文件读取或写入指定数量的字节\n\
  \n`NSFileHandle` 提供的方法也可以应用于设备或套接字（sockets）。在本章中，我们将只关注处理普通文件。\n\n`NSURL` 类允许你在应用程序中使用\
  \ URL。我们将通过一个简单的示例来看这个类，该示例展示了你如何从互联网读取数据。\n\n`NSBundle` 类提供了方法，允许你处理应用程序的包（bundle）。这包括在包中搜索特定资源的能力，例如所有的\
  \ JPEG 图像。我们将在本章末尾简单提到一下这个类。\n\n### 管理文件和目录：`NSFileManager`\n\n`NSFileManager` 使用文件的\
  \ `pathname`（路径名）来唯一标识文件或目录。路径名是一个 `NSString` 对象，可以是相对路径或完整路径。`relative`（相对）路径是相对于当前目录的路径。因此，文件名\
  \ `copy1.m` 意味着当前目录下的 `copy1.m` 文件。斜杠字符分隔路径中的目录列表。文件名 `ch16/copy1.m` 也是一个相对路径，它标识存储在\
  \ `ch16` 目录下的 `copy1.m` 文件，而该目录位于当前目录下。\n\n完整路径也称为 `absolute`（绝对）路径，以 `/` 开头。斜杠实际上是一个目录，被称为\
  \ `root`（根）目录。在我的 Mac 上，我的主目录的完整路径是 `/Users/stevekochan`。这个路径名指定了三个目录：`/`（根目录）、`Users`\
  \ 和 `stevekochan`。\n\n特殊的波浪字符 (`~`) 用作用户主目录的缩写。因此，`~linda` 是用户 `linda` 主目录的缩写，其路径可能是\
  \ `/Users/linda`。单个波浪号表示当前用户的主目录，这意味着路径名 `~/copy1.m` 将引用当前用户主目录下的 `copy1.m` 文件。其他特殊的\
  \ UNIX 风格路径名字符，例如表示当前目录的 `.` 和表示父目录的 `..`，在被任何 Foundation 文件处理方法使用之前，应该从路径名中移除。有多种路径工具可供你为此使用，它们将在本章稍后部分讨论。\n\
  \n你应该尽量避免在程序中硬编码路径名。正如你在本章中看到的，有可用的方法和函数允许你获取当前目录、用户主目录以及用于创建临时文件的目录的路径名。你应该尽可能地利用这些方法。你将在本章稍后部分看到，Foundation\
  \ 有一个函数可以获取特殊目录列表，例如用户的 `Documents` 目录。该函数对于开发 Mac OS 和 iOS 应用程序非常有用。\n\n表 16.1\
  \ 汇总了一些用于处理文件的 `NSFileManager` 方法。在该表中 `path`、`path1`、`path2`、`from` 和 `to` 都是 `NSString`\
  \ 对象；`attr` 是一个 `NSDictionary` 对象；`err` 是 `NSError` 对象的指针，你可以获取错误信息。如果你为 `err` 指定\
  \ `NULL`，将采取默认操作，对于返回 `BOOL` 的方法，是在成功时返回 `YES`，失败时返回 `NO`。我们在这里不会深入讨论该对象。\n\n**表\
  \ 16.1 常用 NSFileManager 文件方法**\n\n![image](img/16tab01.jpg)\n\n每个文件方法都是在一个 `NSFileManager`\
  \ 对象上调用的，该对象通过向类发送 `defaultManager` 消息创建，如下：\n\n```objc\nNSFileManager *fm;\n...\n\
  fm = [NSFileManager defaultManager];\n```\n\n例如，要删除当前目录下名为 `todolist` 的文件，你首先如之前所示创建\
  \ `NSFileManager` 对象，然后调用 `removeItemAtPath:` 方法，如下：\n\n```objc\n[fm removeItemAtPath:\
  \ @\"todolist\" error: NULL];\n```\n\n你可以测试返回值以确保文件删除成功：\n\n```objc\nif ([fm removeItemAtPath:\
  \ @\"todolist\" error: NULL] == NO) {\n    NSLog (@Couldn't remove file todolist\"\
  );\n    return 1;\n}\n```\n\n\n\n\n\n对于已存在的文件，`attributes` 字典包含了如文件所有者、大小、创建日期等信息。字典中的每个属性都可以根据其键（key）提取，这些键都定义在\
  \ `<Foundation/NSFileManager.h>` 中。例如，`NSFileSize` 是文件大小的键。\n\n程序 16.1 显示了了一些对文件的基本操作。此示例假设你的当前目录下有一个名为\
  \ `testfile` 的文件，其中包含以下三行文本：\n\n这是一个包含某些数据的测试文件。\n\n这里是另一行数据。\n\n这是第三行。\n\n### 程序\
  \ 16.1\n\n```objc\n// 基本文件操作\n// 假设当前目录下存在名为 \"testfile\" 的文件\n#import <Foundation/Foundation.h>\n\
  \nint main (int argc, const char * argv[]) {\n    NSAutoreleasePool * pool = [[NSAutoreleasePool\
  \ alloc] init];\n    NSString          *fName = @\"testfile\";\n    NSFileManager\
  \      *fm;\n    NSDictionary      *attr;\n    // 需要创建一个文件管理器实例\n    fm = [NSFileManager\
  \ defaultManager];\n    // 先确保我们的测试文件存在\n    if ([fm fileExistsAtPath: fName] ==\
  \ NO)  {\n        NSLog(@\"File doesn't exist!\");\n        return 1;\n    }\n \
  \   // 现在来复制一份\n    if ([fm copyItemAtPath: fName toPath: @\"newfile\" error: NULL]\
  \ == NO) {\n        NSLog(@\"File Copy failed!\");\n        return 2;\n    }\n \
  \   // 现在来测试两个文件是否相等\n    if ([fm contentsEqualAtPath: fName andPath: @\"newfile\"\
  ] == NO) {\n        NSLog(@\"Files are Not Equal!\");\n        return 3;\n    }\n\
  \    // 现在重命名拷贝的文件\n    if ([fm moveItemAtPath: @\"newfile\" toPath: @\"newfile2\"\
  \n        error: NULL] == NO){\n        NSLog(@\"File rename Failed\");\n      \
  \  return 4;\n    }\n    // 获取 newfile2 的大小\n    if ((attr = [fm attributesOfItemAtPath:\
  \ @\"newfile2\" error: NULL])\n        == nil)  {\n        NSLog(@\"Couldn't get\
  \ file attributes!\");\n        return 5;\n    }\n    NSLog(@\"File size is %llu\
  \ bytes\",\n        [[attr objectForKey: NSFileSize] unsignedLongLongValue]);\n\
  \    // 最后，删除原始文件\n    if ([fm removeItemAtPath: fName error: NULL] == NO)  {\n\
  \        NSLog(@\"file removal failed\");\n        return 6;\n    }\n    NSLog(@\"\
  All operations were successful\");\n    // 显示新创建文件的内容\n    NSLog(@\"%@\", [NSString\
  \ stringWithContentsOfFile:\n            @\"newfile2\" encoding:NSUTF8StringEncoding\
  \ error:NULL]);\n    [pool drain];\n    return 0;\n}\n```\n\n### 程序 16.1. 输出\n\n\
  ```\nFile size is 84 bytes\nAll operations were successful!\nThis is a test file\
  \ with some data in it.\nHere's another line of data.\nAnd a third.\n```\n\n程序首先测试\
  \ `testfile` 是否存在。如果存在，它会创建一个副本，然后测试两个文件的相等性。经验丰富的 UNIX 用户应该注意，你不能仅仅通过为 `copyItemAtPath:toPath:error:`\
  \ 和 `moveItemAtPath:toPath:error:` 方法指定目标目录来将文件移动或拷贝到目录；必须显式指定该目录下的文件名。\n\n####\
  \ 注意\n你可以通过 Xcode 创建 `testfile`：选择 `File`、`New File`....。在出现的左侧面板中高亮 `Other`，然后在右侧面板中选择\
  \ `Empty`。输入 `testfile` 为文件名，并确保将其创建在与可执行文件相同的目录中。如果你在查找目录时遇到困难，可以使用本节稍后描述的 `currentDirectoryPath:`\
  \ 方法。\n\n`moveItemAtPath:toPath:` 方法可以将文件从一个目录移动到另一个目录。（也可以移动整个目录。）如果两个路径引用同一个目录中的文件（如示例所示），效果是重命名文件。因此，在程序\
  \ 16.1 中，你使用该方法将文件 `newfile` 重命名为 `newfile2`。\n\n如表 16.1 所示，执行拷贝、重命名或移动操作时，目标文件不能已存在。如果已存在，操作将失败。\n\
  \n`newfile2` 的大小由 `attributesOfItemAtPath:error:` 方法确定。你通过测试确保返回的是一个非空字典，然后使用 `NSDictionary`\
  \ 方法 `objectForKey:` 通过键 `NSFileSize` 获取文件大小。然后显示字典中的整数值。\n\n程序使用 `removeItemAtPath:error:`\
  \ 方法移除你的原始文件 `testfile`。\n\n最后，使用 `NSString` 的 `stringWithContentsOfFile:encoding:`\
  \ 方法将文件 `newfile2` 的内容读取到字符串，然后将其作为参数传递给 `NSLog` 进行显示。`encoding` 参数指定了文件中字符数据的表示方式。用于此参数的选项定义在头文件\
  \ `NSString.h` 中。`NS8StringEncoding` 可用于此处。\n\n\n\n\n\n`createFileAtPath:contents:attributes:`\
  \ 方法根据指定的属性创建一个文件（如果为 `attributes` 参数提供 `nil`，则使用默认属性）。随后，将指定的 `NSData` 对象的内容写入文件。在我们的示例中，该数据区域包含了之前读取的文件内容。\n\
  \n### 目录操作\n\n表 16.2 总结了 `NSFileManager` 提供的用于处理目录的一些方法。其中许多方法与处理普通文件的方法相同，如 表 16.1\
  \ 所示。\n\n**表 16.2. 常用的 `NSFileManager` 目录方法**\n\n![image](img/16tab02.jpg)\n\n程序\
  \ 16.3 显示了目录的基本操作。\n\n**程序 16.3**\n\n```objc\n// 一些基本的目录操作\n#import <Foundation/Foundation.h>\n\
  \nint main (int argc, char *argv[])\n{\n  NSAutoreleasePool * pool = [[NSAutoreleasePool\
  \ alloc] init];\n  NSString          *dirName = @\"testdir\";\n  NSString      \
  \    *path;\n  NSFileManager      *fm;\n  // 需要创建一个文件器的实例\n  fm = [NSFileManager\
  \ defaultManager];\n  // 获取当前目录\n  path = [fm currentDirectoryPath];\n  NSLog (@\"\
  Current directory path is %@\", path);\n  // 创建新目录\n  if ([fm createDirectoryAtPath:\
  \ dirName withIntermediateDirectories: YES\n              attributes: nil error:\
  \ NULL] == NO) {\n        NSLog (@\"Couldn't create directory!\");\n        return\
  \ 1;\n  }\n  // 重命名新目录\n  if ([fm moveItemAtPath: dirName toPath: @\"newdir\" error:\
  \ NULL] == NO) {\n        NSLog (@\"Directory rename failed!\");\n        return\
  \ 2;\n  }\n  // 进入新目录\n  if ([fm changeCurrentDirectoryPath: @\"newdir\"] == NO)\
  \ {\n        NSLog (@\"Change directory failed!\");\n        return 3;\n  }\n  //\
  \ 现在获取并显示当前工作目录\n  path = [fm currentDirectoryPath];\n  NSLog (@\"Current directory\
  \ path is %@\", path);\n  NSLog (@\"All operations were successful!\");\n  [pool\
  \ drain];\n  return 0;\n}\n```\n\n**程序 16.3. 输出**\n\n```\nCurrent directory path\
  \ is /Users/stevekochan/progs/ch16\nCurrent directory path is /Users/stevekochan/progs/ch16/newdir\n\
  All operations were successful!\n```\n\n程序 16.3 相对来说自俗易懂。首先获取当前目录路径是为了提供信息参考。\n\n\
  #### 注意事项\n\n输出显示了当我使用 Terminal 运行程序时获取的当前目录。如果我用 Xcode 运行此程序，我获取的当前目录是：`/Users/steve_kochan/Library/Developer/Xcode/DerivedData/prog2-cnoljvycenoopiddzwoyraybqlza/Build/Products/Debug`。你的当前目录路径会与我的以及输出中显示的不同。在\
  \ iOS 设备上，你的程序运行在所谓的 `sandbox`（沙盒）中，它对文件的访问是限制的。如果你在类设备上运行此程序，你会发现当前目录被列为 `/`。那是运行在沙盒中的应用程序的根文件夹，而不是整个\
  \ iOS 设备文件系统的根目录。\n\n接下来，在当前目录中创建一个名为 `testdir` 的新目录。然后程序使用 `moveItemAtPath:toPath:error:`\
  \ 方法将新目录从 `testdir` 重命名为 `newdir`。记住，该方法也可以用于将整个目录结构（这意味着包含其内容）从文件系统中的一个位置移动到另一个位置。\n\
  \n在重命名新目录后，程序使用 `changeCurrentDirectoryPath:` 方法将该新目录设置为当前目录。然后显示当前目录路径以验证更改是否成功。\n\
  \n### 枚举目录内容\n\n有时你需要获取一个目录内容的列表。这种枚举过程可以使用 `enumeratorAtPath:` 或 `contentsOfDirectoryAtPath:error:`\
  \ 方法完成。在前一种情况下，指定目录中的每个文件都会被逐个进行枚举，并且默认情况下，如果这些文件中的一个是目录，它的内容也会被枚举。在此过程中，你可以通过向枚举对象发送\
  \ `skipDescendants` 消息来动态阻止这种行为，这样它的内容就不会被枚举。\n\n在 `contentsOfDirectoryAtPath:error:`\
  \ 的情况下，会枚举指定目录的内容，并以数组形式返回文件列表。如果目录中包含的任何文件本身是目录，则该方法不会递归地枚举它的内容。程序 16.4 展示了你如何在程序程序中使用这两种方法之一。\n\
  \n**程序 16.4**\n\n```objc\n// 枚举目录内容\n#import <Foundation/Foundation.h>\nint main\
  \ (int argc, char *argv[])\n{\n  NSAutoreleasePool  pool = [[NSAutoreleasePool alloc]\
  \ init];\n  NSString      *path;\n  NSFileManager  *fm;\n  NSEnumerator *dirEnum;\n\
  \  NSArray      *dirArray;\n  // 需要创建一个文件器的实例\n  fm = [NSFileManager defaultManager];\n\
  \  // 获取当前工作目录\n  path = [fm currentDirectoryPath];\n  // 枚举目录\n  dirEnum = [fm\
  \ enumeratorAtPath: path];\n  NSLog (@\"Contents of %@\", path);\n  while ((path\
  \ = [dirEnum nextObject]) != nil)\n    NSLog (@\"%@\", path);\n  // 枚举目录的另一种方法\n\
  \  dirArray = [fm contentsOfDirectoryAtPath:\n      [fm currentDirectoryPath] error:\
  \ NULL];\n  NSLog (@\"Contents using contentsDirectoryAtPath:error:\");\n  for (\
  \ path in dirArray )\n    NSLog (@\"%@\", path);\n  [pool drain];\n  return 0;\n\
  }\n```\n\n**程序 16.4. 输出**\n\n```\nContents of /Users/stevekochan/mysrc/ch16:\na.out\n\
  dir1.m\ndir2.m\nfile1.m\nnewdir\nnewdir/file1.m\nnewdir/output\npath1.m\ntestfile\n\
  Contents using contentsDirectoryAtPath:error:\na.out\ndir1.m\ndir2.m\nfile1.m\n\
  newdir\npath1.m\ntestfile\n```\n\n#### 注意事项\n\n在你的系统上，输出将与显示的不同。\n\n让我们仔细观察以下代码序列：\n\
  \n```objc\ndirEnum = [fm enumeratorAtPath: path];\nNSLog (@\"Contents of %@\", path);\n\
  while ((path = [dirEnum nextObject]) != nil)\n  NSLog (@\"%@\", path);\n```\n\n\
  你通过向文件管理器对象（在本例中为 `fm`）发送 `enumeratorAtPath:` 消息来开始枚举目录。`enumeratorAtPath:` 方法返回一个\
  \ `NSEnumerator` 对象，存储在 `dirEnum` 中。现在每当你向该对象发送 `nextObject` 消息，它都会返回下一个文件的路径。当没有更多文件可以枚举时，将返回\
  \ `nil`。\n\n你可以从 程序 16.4 的输出可以看到两种枚举技术的区别。`enumeratorAtPath:` 列出了 `newdir` 目录的内容，而\
  \ `contentsOfDirectoryAtPath:` 则没有。如果 `newdir` 包含子目录，`enumeratorAtPath:` 也会枚举它们。\n\
  \n正如提到的，在执行 程序 16.4 中的 `while` 循环期间，你可以通过进行以下更改来防止对子目录的枚举：\n\n```objc\nwhile ((path\
  \ = [dirEnum nextObject]) != nil) {\n  NSLog (@\"%@\", path);\n  [fm fileExistsAtPath:\
  \ path isDirectory: &flag];\n  if (flag == YES)\n    [dirEnum skipDescendants];\n\
  }\n```\n\n这里 `flag` 是一个 `BOOL` 变量。如果指定的路径是目录，则 `fileExistsAtPath:` 在 `flag` 中存储\
  \ `YES`；否则存储 `NO`。\n\n顺便提一下，作为提醒，你可以使用这个单一 `NSLog` 调用来显示整个 `dirArray` 内容\n\n```objc\n\
  NSLog (@\"%@\", dirArray);\n```\n\n而不是像程序那样那样快速枚举。\n\n### 处理路径：`NSPathUtilities.h`\n\
  \n\n\n\n\n`NSPathUtilities.h` 包含了用于 `NSString` 的函数和分类扩展，允许你操作路径名称。你应该尽可能使用这些方法，以使你的程序对文件系统结构以及特定文件和目录位置的依赖降低。程序\
  \ 16.5 展示了如何使用 `NSPathUtilities.h` 提供的若干函数和方法。\n\n#### 程序 16.5\n\n***\n\n```objc\n\
  // 一基础路径操作\n\n#import <Foundation/Foundation.h>\n\nint main (int argc, char *argv[])\n\
  \n{\n   NSAutoreleasePool  * pool = [[NSAutoreleasePool alloc] init];\n   NSString\
  \           *fName = @\"path.m\";\n   NSFileManager       *fm;\n   NSString    \
  \       *path, *tempdir, *extension, *homedir, *fullpath;\n   NSString         \
  \  *upath = @\"~stevekochan/progs/../ch16/./path.m\";\n   NSArray            *components;\n\
  fm = [NSFileManager defaultManager];\n   // 获取临时工作目录\n   tempdir = NSTemporaryDirectory\
  \ ();\n   NSLog (@\"Temporary Directory is %@\", tempdir);\n   // 从当前目录提取基础目录\n\
  \   path = [fm currentDirectoryPath];\n   NSLog (@\"Base dir is %@\", [path lastPathComponent]);\n\
  \   // 为当前目录下的文件 fName 创建完整路径\n   fullpath = [path stringByAppendingPathComponent:\
  \ fName];\n   NSLog (@\"fullpath to %@ %@\", fName, fullpath);\n   // 获取文件扩展名\n\
  \   extension = [fullpath pathExtension];\n   NSLog (@\"extension for %@ %@\", fullpath,\
  \ extension);\n   // 获取用户主目录\n   homedir = NSHomeDirectory ();\n   NSLog (@\"Your\
  \ home directory is %@\", homedir);\n   // 将路径划分为各个组件\n   components = [homedir\
  \ pathComponents];\n   for ( path in components ) {\n     NSLog (@\"%@\", path);\n\
  \   }\n   // “标准化”路径\n   NSLog (@\"%@ => %@\", upath , [upath stringByStandardizingPath]);\n\
  \   [pool drain];\n   return 0;\n}\n```\n\n***\n\n#### 程序 16.5 输出\n\n***\n\nTemporary\
  \ Directory is /var/folders/HT/yGLvNb6uo7TI-\nBase dir is examples\nfullpath to\
  \ path is /Users/stevekochan/progs/examples/path.m\nextension for path is m\nYour\
  \ home directory is /Users/stevekochan\n~stevekochan/progs/../ch16/./path.m => /Users\n\
  ***\n\n***\n\n#### 备注\n\n在你的系统上，输出将与所示不同。\n\n`NSTemporaryDirectory` 函数返回系统上某个目录的路径名称，你可以用它创建临时文件。如果你在该目录中创建了临时文件，请务必在完成后删除它们。此外，确保你的文件名是唯一的，特别是当你的应用程序可能有多个实例同时运行时（参见练习题\
  \ 5）。注意，临时文件仅仅是临时文件。如果你在使用后没有删除它们，系统会在某个时间自动为你删除它们。然而，你不应该依赖这一点，而应该自己删除它们。\n\n`lastPathComponent`\
  \ 方法提取路径中的最后一个文件。当你有一个绝对路径名并只想从中获取文件名时，这个方法非常有用。\n\n`stringPathComponent:` 有用于在路径末尾添加文件名。如果作为接收者的路径名不以斜杠结尾，该方法会在路径中插入一个斜杠，以区分追加的文件名。通过将\
  \ `currentDirectoryPath` 方法与 `stringPathComponent:` 方法结合，你可以创建一个指向当前目录下文件的完整路径名。该技术在程序\
  \ 16.5 中所示。\n\n`pathExtension` 方法提供提供路径名的文件扩展名。在示例中，文件 `path.m` 的扩展是 `m`，由该方法返回。如果文件没有扩展名，该方法简单返回空字符串。\n\
  \n`NSHomeDirectory` 函数返回当前用户的主目录。你可以改用 `NSHomeDirectoryForUser` 函数并传入用户名作为参数来获取任何特定用户的主目录。\n\
  \n`pathComponents` 方法返回一个包含指定路径每个组件的数组。程序 16.5 遍历数组的每个元素，并单独行显示每个路径组件。\n\n最后，正如我们讨论过的，有时路径名称包含波浪号（`~`）字符。`NSFileManager`\
  \ 方法接受 `~` 作为用户主目录的缩写，或接受 `~user` 作为指定用户主目录的缩写。如果你的路径名称可能包含波浪号，你可以使用 `stringByStandardizingPath`\
  \ 方法解析它们。该方法返回一个消这些特殊字符的路径。你也可以使用 `stringByExpandingTildeInPath` 方法在路径名中出现波浪号时仅对其进行扩展。\n\
  \n### 处理路径的常用方法\n\n表 16.3 总结了许多处理路径的常用方法。在表中，`components` 是一个 `NSArray` 对象，其中包含路径中每个组件的字符串对象；`path`\
  \ 是一个指定文件路径的字符串对象；`ext` 是一个指示路径扩展名的字符串对象。\n\n**表 16.3 处理路径的常用方法**\n\n![image](img/16tab3.jpg)\n\
  \n表 16.4 列出了用于获取用户信息、主目录以及存储临时文件的目录信息的[函数]。\n\n**表 16.4 常用路径函数**\n\n![image](img/16tab4.jpg)\n\
  \n你可能还想查看 Foundation 函数 `NearchPathForDirectoriesDomains`，你可以用它定位系统或设备上的特殊目录，例如应用程序和文档目录。例如，下面的代码定义了一个名为\
  \ `saveFilePath` 方法，它返回缓存目录中名为 `saveFile` 的文件路径。\n\n```objc\n-(NSString *) saveFilePath\n\
  {\n   NSArray *dirList = NSSearchPathForDirectoriesDomains (NSCachesDirectory, NSUserDomainMask,\
  \ YES);\n   NSString *docDir = [dirList objectAtIndex: 0];\n   return [docDir stringByAppendingPathComponent:\
  \ @\"saveFile\"];\n}\n```\n\n***\n\n#### 备注\n\n缓存目录可以用于存储从一次运行到下一次运行的数据。每个 iOS 都有自己的缓存目录可以向其中写入数据。`NearchPathForDirectoriesDomains`\
  \ 函数的第一个参数指定你想要定位的目录。你可能想在应用程序中使用另一个目录：文档。该目录也可以用于存储数据，并在 iOS 应用程序之间共享文件。请参见表 16.5\
  \ 的常用 iOS 目录列表。\n\n**表 16.5 常用 iOS 目录**\n\n![image](img/16tab5.jpg)\n\n***\n\n`NearchPathForDirectoriesDomains`\
  \ 函数的第二个参数可以是几个值之一，用于指定要列出的目录，例如用户目录（如所示）、系统目录或所有目录。最后一个参数指定是否扩展路径中的波浪号字符。\n\n\n\
  \n\n\n\n### 复制文件与使用 `NSProcessInfo` 类\n\nProgram 16.6 演示了一个实现简单文件复制操作的命令行工具。该命令的用法如下：\n\
  \n`copy from-file to-file`\n\n与 `NSFileManager` 的 `copyPath:toPath:handler:` 方法不同，你的命令行工具允许\
  \ `to-file` 成为一个目录名称。在这种情况下，文件将以 `from-file` 的名称复制到 `to-file` 目录。此外，与该方法不同的是，如果\
  \ `to-file` 已经存在，你允许其内容被覆盖。这更符合标准 UNIX 复制命令 `cp`。\n\n你可以通过使用传递给 `main` 函数的 `argc`\
  \ 和 `argv` 参数从命令行获取文件名这两个参数分别被填充为命令行上参数的数量（包括命令名称）以及一个指向 C 风格字符串数组的指针。\n\n你不再需要处理\
  \ C 风格字符串（这是你在处理 `argv` 时必须做的事情），而是应该使用一个名为 `NSProcessInfo` 的 Foundation 类。`NSProcessInfo`\
  \ 包含了许多方法，允许你设置和检索有关你运行的应用程序（即你的*进程*）的不同类型的信息。这些方法在表 16.6 中进行了总结。\n\n**表 16.6 `NSProcessInfo`\
  \ 方法**\n\n![image](img/16tab06.jpg)\n\n**程序 16.6**\n\n```objc\n// 实现一个基础复制实用\n\n\
  #import <Foundation/Foundation.h>\n\nint main (int argc, char *argv[])\n{\n   NSAutoreleasePool\
  \  * pool = [[NSAutoreleasePool alloc] init];\n   NSFileManager       *fm;\n   NSString\
  \           *source, *dest;\n   BOOL               isDir;\n   NSProcessInfo    \
  \  *proc = [NSProcessInfo processInfo];\n   NSArray            *args = [proc arguments];\n\
  \   fm = [NSFileManager defaultManager];\n   // 检查命令行是否有两个参数\n   if ([args count]\
  \ != 3) {\n       NSLog (@\"Usage: %@ src dest\", [proc processName]);\n       return\
  \ 1;\n   }\n   source = [args objectAtIndex: 1];\n   dest = [args objectAtIndex:\
  \ 2];\n   // 确保源文件是可以读取的\n   if ([fm isReadableFileAtPath: source] == NO) {\n  \
  \     NSLog (@\"Can't read %@\", source);\n       return 2;\n   }\n   // 检查目标文件是否为目录\n\
  \   // 如果是，将源文件添加到目标目录末尾\n   [fm fileExistsAtPath: dest isDirectory: &isDir];\n\
  \   if (isDir == YES)\n       dest = [dest stringByAppendingPathComponent:\n   \
  \            [source lastPathComponent]];\n   // 如果目标文件已存在，则删除它\n   [fm removeItemAtPath:\
  \ dest error: NULL];\n   // 好，开始执行复制\n   if ([fm copyItemPath: source toPath: dest\
  \ error: NULL] == NO) {\n       NSLog (@\"Copy failed!\");\n       return 3;\n \
  \  }\n   NSLog (@\"Copy of %@ to %@ succeeded!\", source, dest);\n   [pool drain];\n\
  \   return 0;\n}\n```\n\n**程序 16.6 输出**\n\n```\n$ ls –l              查看我们有哪些文件\n\
  total 96\n-rwxr-xr-x 1 stevekoc staff 19956 Jul 24 14:33 copy\n-rw-r--r-- 1 stevekoc\
  \ staff 1484  Jul 24 14:32 copy.m\n-rw-r--r--1  stevekoc staff 1403  Jul 24 13:00\
  \ file1.m\ndrwxr-xr-x 2 stevekoc staff  68  Jul 24 14:40 newdir\n-rw-r--r--1  stevekoc\
  \ staff 1567  Jul 24 14:12 path1.m\n-rw-r--r--1  stevekoc staff  84  Jul 24 13:22\
  \ testfile\n$ copy              尝试不带参数\nUsage: src dest\n$ copy foo2\nCan't read\
  \ foo\n$ copy.m\nCopy of copy.m to backup.m succeeded!\n$ diff copy.m backup.m\n\
  比较文件\n$ copy.m newdir\n尝试进入目录\nCopy of copy.m to newdir/copy.m succeeded!\n$ ls\
  \ –l newdir\ntotal 8\n-rw-r--r-- 1 stevekoc staff 1484 Jul 24 14:44 copy.m\n```\n\
