  \n## 第 17 章 内存管理\n\n在本书中，我们一直关注内存管理这一主题。到目前，你应该已经何时何时负责释放对象，以及何时不需要。虽然书中的示例都很小，但我们强调了关注内存管理的重要性，以教授良好的编程习惯并开发无泄漏的程序。\n\
  \n根据你所编写的应用程序类型，合理使用内存可能是至关重要的。例如，如果你正在编写一个在程序执行期间会创建许多对象的交互式绘画程序，你必须确保你的程序在运行时不会继续消耗内存资源。在这种情况下，智能地管理这些资源并在它们不再需要时释放它们就成了你的责任。这意味着在程序执行期间释放资源，而不是一直等到结束。\n\
  \n在本章中，你将更详细地学习 Foundation 的内存分配策略。这涉及到对自动释放池（autorelease pool）和保留（retain）对象思想的更深入讨论。你还将学习对象的引用或\
  \ `retain` 计数。最后，我们将会介绍一种被称为“垃圾收集”（garbage collection）的机制，它减轻了在使用完对象后必须保留并随后释放对象的负担。然而，正如你所看到的，垃圾收集无法用于\
  \ iOS 应用程序，因此你仍然必须理解书中（以及在本章中更详细描述）的内存管理技术。\n\n### 自动释放池 (The Autorelease Pool)\n\
  \n你通过本书第二部分之前的示例熟悉自动释放池。在处理 Foundation 时，你必须设置此池来使用对象。该池是系统跟踪你的对象以备后用的地方。正如你所看到的，应用程序可以通过如下调用来设置池：\n\
  \n```objc\nNSleasePool * pool = [[NSleasePool alloc] init];\n```\n\n当设置池时，Foundation\
  \ 会向其添加某些数组、字典和其他对象。当你完成池的使用后，可以通过发送 `drain` 消息来释放它占用的内存：\n\n```objc\n[pool drain];\n\
  ```\n\n自动释放池的名字是因为任何标记为自动释放并记录在池中的对象在池释放时会自动释放。事实上，你可以在程序中使用多个自动释放池，它们还可以嵌套。\n\n\
  如果你的程序产生了大量的临时对象（这在执行循环代码时很容易发生），你可能需要在程序中创建自动释放池。例如，以下代码片段说明了如何设置自动释放池来释放每次循环创建的临时对象：\n\
  \n```objc\nNSleasePool *tempPool;\n...\nfor (i = 0; i < n; ++i) {\n    tempPool\
  \ = [[NSleasePool alloc] init];\n    ... // 这里有很多对临时对象的操作\n    [tempPool drain];\n\
  }\n```\n\n注意，自动释放池并不包含对象本身——只有在释放时要释放的对象引用。\n\n你可以通过发送 `autorelease` 消息将对象添加到当前的自动释放池以便以后释放：\n\
  \n```objc\n[myFraction autorelease];\n```\n\n系统随后会将 `myFraction` 添加到自动释放池中以便自动释放。正如你将看到的，`autorelease`\
  \ 方法有助于在方法内部标记对象以便以后处理。\n\n### 引用计数 (Reference Counting)\n\n当我们讨论基础 Objective-C\
  \ 对象类 `NSObject` 时，我们提到内存是通过 `alloc` 方法分配的，随后可以通过 `release` 消息进行释放。不幸的是，这并不总是那么简单。运行中的应用程序可以在多个地方引用你创建的对象；例如，对象也可以存储在数组中或被其他地方实例变量引用。只有当你确定所有人都不使用该对象时，你才能释放该对象占用的内存。\n\
  \n\n\n幸运的是，`Foundation` 框架提供了一个优雅的解决方案来跟踪对象的引用计数。它涉及一种非常直接的技术，称为“引用计数”（reference\
  \ counting）。该概念如下：当一个对象被创建时，它的引用计数设置为 `1`。每当你需要确保该对象被保留时，通过向它发送一个 `retain` 消息将其引用计数加\
  \ 1，如下所示：\n\n```\n[myFraction retain];\n```\n\n`Foundation` 框架中的某些方法也会增加此引用计数，例如当一个对象添加到数组时。\n\
  \n当你不再需要一个对象时，通过向它发送一个 `release` 消息将其引用计数减 1，如下所示：\n\n```\n[myFraction release];\n\
  ```\n\n当一个对象的引用计数达到 0 时，系统就知道该对象不再被需要（因为从理论上讲，它不再被引用），因此会释放它的内存（`deallocates`）。这是通过向对象发送\
  \ `dealloc` 消息完成的。\n\n该策略的成功运行需要程序员程序员的勤奋，以确保在程序执行期间引用计数被适当地增加和减少。正如你所看到的，系统处理了其中部分但并非全部。\n\
  \n让我们更详细地查看引用计数。可以向对象发送 `retainCount` 消息以获取其引用（或 `retain`）计数。你永远不需要这个方法，但它在这里用于说明目的很有用（参见\
  \ 程序 17.1）。注意，它返回一个类型为 `NSUInteger` 的无符号整数。\n\n**程序 17.1**\n\n* * *\n\n```\n// Introduction\
  \ to reference counting\n#import <Foundation/Foundation.h>\n\nint main (int argc,\
  \ char *argv[])\n{\n    NSAutoreleasePool * pool = [[NSAutoreleasePool alloc] init];\n\
  \    NSNumber             *myInt  = [[NSNumber alloc: initWithInteger: 100];\n \
  \   NSNumber             *myInt2;\n    NSMutableArray     *myArr = [NSMutableArray\
  \ array];\n    NSLog (@\"myInt retain count = %lx\",\n         (unsigned long) [myInt\
  \ retainCount]);\n    [myArr addObject: myInt];\n    NSLog (@\"after adding to array\
  \ = %lx\",\n         (unsigned long) [myInt retainCount]);\n    myInt2 = myInt;\n\
  \    NSLog (@\"after asssignment to myInt2 = %lx\",\n         (unsigned long) [myInt\
  \ retainCount]);\n    [myInt retain];\n    NSLog (@\"myInt after retain = %lx\"\
  ,\n         (unsigned long) [myInt retainCount]);\n    NSLog (@\"myInt2 after retain\
  \ = %lx\",\n         (unsigned long) [myInt2 retainCount]);\n    [myInt release];\n\
  \    NSLog (@\"after release = %lx\",\n         (unsigned long) [myInt retainCount]);\n\
  \    [myArr removeObjectAtIndex: 0];\n    NSLog (@\"after removal from array = %lx\"\
  ,\n         (unsigned long) [myInt retainCount]);\n    [myInt2 release];\n    [pool\
  \ drain];\n    return 0;\n}\n```\n\n* * *\n\n**程序 17.1. 输出**\n\n* * *\n\n```\nmyInt\
  \ retain count = 1\nafter adding to array = 2\nafter asssignment to myInt2 = 2\n\
  myInt after retain = 3\nmyInt2 after retain = 3\nafter release = 2\nafter removal\
  \ from array = 1\n```\n\n* * *\n\n`NSNumber` 对象 `myInt` 被设置为整数值 `100`，输出显示它的初始引用计数为\
  \ `1`。接下来，使用 `addObject:` 方法将对象添加到数组 `myArr` 中。注意，它的引用计数随后变为 `2`。`addObject:` 方法会自动完成此操作；如果你检查\
  \ `addObject:` 方法的文档，你会在那里看到这一事实的描述。向任何类型的集合中添加（或插入）对象会增加其引用计数。这意味着如果你随后释放了你添加的对象，它在数组内部仍然有一个有效的引用，而不会被释放（释放）。\n\
  \n接下来，你将 `myInt` 赋值给 `myInt2`。注意这不会增加引用计数——这可能意味着潜在的问题。\n\n（注：原文此处存在大量重复的段落，已根据指令“不要重复输出原文”进行去重，仅保留核心逻辑翻译）\n\
  \n### 引用计数与字符串\n\n（此处重复内容省略）\n...\n```\n\n* * *\n\n\n\n\n```objc\n(unsigned long)\
  \ [myStr1 retainCount],\n(unsigned long) [myStr2 retainCount],\n(unsigned long)\
  \ [myStr3 retainCount]);\n\n[myArr addObject: myStr1];\n[myArr addObject: myStr2];\n\
  [myArr addObject: myStr3];\n\nNSLog (@\"Retain count: myStr1: %lx, myStr2: %lx,\
  \ myStr3: %lx\",\n      (unsigned long) [myStr1 retainCount],\n      (unsigned long)\
  \ [myStr2 retainCount],\n      (unsigned long) [myStr3 retainCount]);\n\n[myStr1\
  \ retain];\n[myStr2 retain];\n[myStr3 retain];\n\nNSLog (@\"Retain count: myStr1:\
  \ %lx, myStr2: %lx, myStr3: %lx\",\n      (unsigned long) [myStr1 retainCount],\n\
  \      (unsigned long) [myStr2 retainCount],\n      (unsigned long) [myStr3 retainCount]);\n\
  \n// Bring the reference count of myStr3 back down\n[myStr3 release];\n[pool drain];\n\
  \nreturn 0;\n}\n```\n\n* * *\n\n**程序 17.2. 输出**\n\n* * *\n\nRetain count: myStr1:\
  \ fffffffffffffff, myStr2: fffffffffffffff, myStr3: 1\nRetain count: myStr1: fffffffffffffff,\
  \ myStr2: fffffffffffffff, myStr3: 2\nRetain count: myStr1: fffffffffffffff, myStr2:\
  \ fffffffffffffff, myStr3: 3\n\n* * *\n\n`NSString` 对象 `myStr1` 被赋值为 `NSConstantString\
  \ @\"Constant string\"`。常量字符串在内存中的分配方式与其他对象不同。常量字符串不使用引用计数机制，因为它们永远不会释放。这就是为什么当向\
  \ `myStr1` 发送 `retainCount` 消息时，它返回的值为 `0xfffffffffffffff`。\n\n注意，这也适用于用常量字符串初始化的不可变字符串对象：它同样没有意义的引用计数，这正如\
  \ `myStr2` 显示的引用计数所验证的那样。\n\n* * *\n\n### 注意\n\n在这里系统非常聪明，它判断出该不可变字符串对象是由常量字符串对象初始化的。在\
  \ Leopard 版本发布之前，并没有进行这种优化，`myStr2` 将会有一个正常的引用计数。\n\n* * *\n\n在语句\n\n```objc\nNSMutableString\
  \ *myStr3 = [NSMutableString stringWithString: @\"string 3\"];\n```\n\n变量 `myStr3`\
  \ 被设置为一个由常量字符字符串 `@\"string 3\"` 拷贝而成的字符串。必须创建字符串的副本，是因为向 `NSMutableString` 类发送了\
  \ `stringWithString:` 消息，这表明字符串的内容在程序执行过程中可能会发生变化。由于常量字符字符串的内容不能被更改，系统不能像处理 `myStr2`\
  \ 那样直接将变量 `myStr3` 指向常量字符串 `@\"string 3\"`。\n\n因此，字符串对象 `myStr3` 确实有一个有意义的引用计数，这正如输出所验证的那样。引用计数可以通过将此字符串添加到数组或向其发送\
  \ `retain` 消息来改变，这正如最后两次 `NSLog` 调用的输出所验证的那样。Foundation 的 `stringWithString:` 方法在创建该对象时将其添加到自动释放池（autorelease\
  \ pool）中。Foundation 的 `array` 方法也将数组 `myArr` 添加到了池中。\n\n在自动释放池本身释放之前，`myStr3` 被释放了。这将其引用计数降到了\
  \ `2`。随后，自动释放池的释放会将该对象的引用计数减到 `0`，导致其被释放内存。这是如何发生的？当自动释放池释放时，池中的每个对象每接收过一次 `autorelease`\
  \ 消息，就会被发送一次 `release` 消息。由于字符串对象 `myStr3` 在 `stringWithString:` 方法创建它时被添加到自动释放池，因此它接收到了一个\
  \ `release` 消息。这将其引用计数降到了 `1`。当自动释放池中的数组被释放时，它的每个元素也会被释放。因此，当 `myArr` 从池中释放时，它的每个元素（包括\
  \ `myStr3`）都收到了 `release` 消息。这将其引用计数降到了 `0`，从而导致其被释放内存。\n\n你必须小心不要过度释放（over-release）一个对象。\n\
  \n\n\n\n\n程序 17.4 对 `setStr:` 方法进行了修改，以保留 `str` 的值。这可以防止其他人稍后释放了 `str` 引用的对象。\n\n\
  **程序 17.4**\n\n* * *\n\n```\n// Retaining objects\n#import <Foundation/Foundation.h>\n\
  \n@interface ClassA: NSObject\n\n{\n  NSString *str;\n}\n\n-(void) setStr: (NSString\
  \ *) s;\n\n-(NSString *) str;\n\n@end\n\n@implementation ClassA\n\n-(void) setStr:\
  \ (NSString *) s\n{\n   str = s;\n   [str retain];\n}\n\n-(NSString *) str\n{\n\
  \   return str;\n}\n\n@end\n\nint main (int argc, char *argv[])\n{\n   NSAutoreleasePool\
  \ * pool = [[NSAutoreleasePool alloc] init];\n   NSMutableString *myStr =\n    \
  \           [NSMutableString stringWithString: @\"A string\"];\n   ClassA   *myA\
  \ = [[ClassA alloc] init];\n   NSLog (@\"myStr retain count: %lx\", [myStr retainCount]);\n\
  \   [myA setStr: myStr];\n   NSLog (@\"myStr retain count: %lx\", [myStr retainCount]);\n\
  \   [myStr release];\n   NSLog (@\"myStr retain count: %lx\", [myStr retainCount]);\n\
  \   [myA release];\n   [pool drain];\n   return 0;\n}\n```\n\n* * *\n\n**程序 17.4.\
  \ 输出**\n\n* * *\n\n```\nmyStr retain count: 1\nmyStr retain count: 2\nmyStr retain\
  \ count: 1\n```\n\n* * *\n\n你可以看到，在调用 `setStr:` 方法后，`myStr` 的引用计数增加到了 `2`，因此这个特定问题得到了解决。随后在程序中释放\
  \ `myStr` 时，它通过实例变量持有的引用仍然有效，因为它的引用计数仍为 `1`。\n\n由于你在程序中使用 `alloc` 分配了 `myA`，因此你仍然需要负责手动释放它。与其担心手动释放它，不如向它发送\
  \ `autorelease` 消息将其加入自动释放池：\n\n[`myA autorelease];`\n\n如果你愿意，可以在对象分配后立即这样做。请记住，将对象加入自动释放池并释放它或使其失效；它只是将其标记为稍后释放。你可以继续使用该对象，直到它被销毁；如果在池被清空（drain）时对象的引用计数变为\
  \ `0`，它就会被销毁。\n\n你仍然面临一些你可能已经注意到的潜在问题。你的 `setStr:` 方法执行了保留作为参数的字符串对象的工作，但*那个*字符串对象什么时候被释放呢？另外，你正在覆盖的实例变量\
  \ `str` 的旧值该怎么办？难道不应该释放它的值以释放内存吗？程序 17.5 为该问题提供了解决方案。\n\n**程序 17.5**\n\n* * *\n\n\
  ```\n// Introduction to reference counting\n#import <Foundation/Foundation.h>\n\n\
  @interface ClassA: NSObject\n{\n    NSString *str;\n}\n\n-(void) setStr: (NSString\
  \ *) s;\n\n-(NSString *) str;\n\n-(void) dealloc;\n\n@end\n\n@implementation ClassA\n\
  \n-(void) setStr: (NSString *) s\n{\n   // free up old object since we're done with\
  \ it\n   [str autorelease];\n   // retain argument in case someone else releases\
  \ it\n   str = [s retain];\n}\n\n-(NSString *) str\n{\n   return str;\n}\n\n-(void)\
  \ dealloc {\n   NSLog (@\"ClassA dealloc\");\n   [str release];\n   [super dealloc];\n\
  }\n\n@end\n\nint main (int argc, char *argv[])\n{\n   NSAutoreleasePool * pool =\
  \ [[NSAutoreleasePool alloc] init];\n   NSMutableString *myStr =\n           [NSMutableString\
  \ stringWithString: @\"A string\"];\n   ClassA   *myA = [[ClassA alloc] init];\n\
  \   NSLog (@\"myStr retain count: %x\", [myStr retainCount]);\n   [myA autorelease];\n\
  \   [myA setStr: myStr];\n   NSLog (@\"myStr retain count: %x\", [myStr retainCount]);\n\
  \   [pool drain];\n   return 0;\n}\n```\n\n* * *\n\n**程序 17.5. 输出**\n\n* * *\n\n\
  ```\nmyStr retain count: 1\nmyStr retain count: 2\nClassA dealloc\n```\n\n* * *\n\
  \n`setStr:` 方法首先获取 `str` 实例变量中当前的内容并对其进行自动释放（autorelease）。如果给 `str` 赋值一个新值，旧值将被标记为释放。`str\
  \ = [s retain]` 确保了新值被保留。\n\n`dealloc` 方法用于清理资源。在 `ClassA` 中，`dealloc` 释放了 `str`\
  \ 对象并调用了 `[super dealloc]`。\n\n`setStr:` 方法负责管理 `str` 变量的引用计数。当分配新值时，自动释放旧值以防止内存泄漏。\n\
  \n`dealloc` 方法在对象引用计数达到 `0` 时被调用。在这种情况下，它释放了 `str` 对象。\n\n`autorelease` 方法增加引用计数。将对象加入\
  \ `autorelease` 池会将对象标记为稍后释放。当调用 `[pool drain]` 时，自动释放池会被清空，从而释放池中的所有对象。\n\n###\
  \ 自动释放示例\n\n让我们来看本章的最后一个例子，以确保你真正理解了引用计数、保留和释放对象。程序 17.6 定义了一个包含一个实例变量的虚拟类 `Foo`。\n\
  \n**程序 17.6**\n\n* * *\n\n```\n#import <Foundation/Foundation.h>\n\n@interface Foo:\
  \ NSObject\n{\n  int x;\n}\n\n@end\n\n@implementation Foo\n\n@end\n\nint main (int\
  \ argc, char *argv[])\n{\n   NSAutoreleasePool * pool = [[NSAutoreleasePool alloc]\
  \ init];\n   Foo   *myFoo = [[Foo alloc] init];\n   NSLog (@\"myFoo retain count\
  \ = %lx\", (unsigned long) [myFoo retainCount]);\n   [pool drain];\n   NSLog (@\"\
  after pool drain = %lx\", (unsigned long) [myFoo retainCount]);\n   pool = [[NSAutoreleasePool\
  \ alloc] init];\n   [myFoo autorelease];\n   NSLog (@\"after autorelease = %lx\"\
  , (unsigned long) [myFoo retainCount]);\n   [myFoo retain];\n   NSLog (@\"after\
  \ retain = %lx\", (unsigned long) [myFoo retainCount]);\n   [pool drain];\n   NSLog\
  \ (@\"after second pool drain = %lx\", (unsigned long) [myFoo retainCount]);\n \
  \  [myFoo release];\n   return 0;\n}\n```\n\n\n\n\n程序分配了一个新的 `Foo` 对象并将其赋值给变量 `myFoo`。正如你所看到的，它的初始引用计数为\
  \ 1。该对象尚未进入自动释放池（autorelease pool），因此清空池不会使该对象失效。随后会分配一个新池，并通过向 `myFoo` 发送 `autorelease`\
  \ 消息将其添加到池中。再次注意，它的引用计数没有变化，因为将对象添加到自动释放池并不会影响它的引用计数——它只是将其标记为稍后释放。\n\n接下来，你向 `myFoo`\
  \ 发送一个 `retain` 消息。这将其引用计数更改为 `2`。当你随后第二次清空池时，`myFoo` 的引用计数会减 1，因为之前它接收过 `autorelease`\
  \ 消息，因此在池被释放时它会收到一个 `release` 消息。\n\n由于在池释放之前 `myFoo` 已经被重留（retained）了，它在减 1 后的引用计数仍然大于\
  \ `0`。因此，`myFoo` 在池清空后依然存活，并且是一个有效对象。当然，你现在必须手动释放它，我们在 程序 17.6 中正是这样做，以便妥善清理并避免内存泄漏。\n\
  \n如果你对这段关于自动释放池的解释仍然有些模糊，请重读一遍。当你理解了 程序 17.6，你就能彻底理解自动释放池及其工作原理。\n\n### 内存管理规则总结\n\
  \n让我们总结一下在本章中中学的内存管理知识：\n\n-   发送 `release` 消息并不一定会销毁对象。当对象的引用计数减到 0 时，该对象会被销毁。系统通过向对象发送\
  \ `dealloc` 消息来释放其内存。\n-   如果你需要持有一个对象以确保它不会被他人销毁，你应该对其进行 `retain`。在使用完该对象后，务必将其\
  \ `release` 它。\n-   释放任何你 `retain` 过的或使用 `copy, mutableCopy`、`alloc` 或 `new` 方法创建的对象。这包括具有\
  \ `retain` 或 `copy` 属性的属性。你可以重写 `dealloc` 方法在对象准备销毁时释放你的实例变量。\n-   自动释放池在池本身清空时提供对象的自动释放。系统通过向池中的每个对象根据其被自动释放的次数发送\
  \ `release` 消息来实现这一点。自动释放池中任何引用计数降为 0 的对象都会收到一条 `dealloc` 消息以销毁对象。\n-   如果你不再需要方法内部的某个对象但需要返回它，请向它发送一个\
  \ `autorelease` 消息将其标记为稍后释放。`autorelease` 消息不会影响对象的引用计数。\n-   当应用程序终止时，所有对象占用的内存都会被释放，无论它们是否在自动释放池中。\n\
  -   当你开发 Cocoa 或 iOS 应用时，自动释放池会在程序执行过程中不断创建和清空（这会在每次事件发生时发生）。在这种情况下，如果你想确保你的对象在自动释放池清空时依然存活，你需要对其进行\
  \ `retain`。所有引用计数大于其收到的 `autorelease` 消息数量的对象将在池释放后存活。\n\n### 关于事件循环和内存分配详情\n\n\
  如上一节所述，Cocoa 和 iOS 应用运行在所谓的运行循环（run loop）或事件循环内部。通常可以将事件理解为由你执行显式操作（例如，在 iPhone\
  \ 上点击按钮）或隐式操作（例如，通过网络接收数据）而触发的。为了处理新事件，系统会创建一个新的自动释放池，并可能调用你应用程序中的某些方法来处理它。当你完成事件处理后，你将从方法返回，系统将等待下一个事件发生。在此之前，系统会清空自动释放池。这意味着你在处理该事件时创建的任何自动释放对象都会被销毁，除非你对这些对象进行了\
  \ `retain`，以便它们在池清空时存活。\n\n请看下面摘自某个 iOS 应用的接口部分。在这里我们定义了一个名为 `MyView` 的类，其中包含一个名为\
  \ `data` 的实例变量：\n\n```objc\n#import <UIKit/UIKit.h>\n\n@interface myView : UIView\n\
  \n{\n    NSMutableArray *data;\n}\n\n@property (nonatomic, retain) NSMutableArray\
  \ *data;\n\n@end\n```\n\n假设我们在实现部分为你的 `data` 变量合成了访问器方法。进一步假设我们有一个名为 `viewDidLoad`\
  \ 的方法，每当我们的视图加载到内存时，系统就会调用它（当你学习 iOS 编程时会学到更多内容。目前，这些细节并不重要）。\n\n假设在你的 `viewDidLoad`\
  \ 方法内部，你想分配 `data` 数组，因此在该方法内部插入了以下行代码：\n\n```objc\ndata = [NSMutableArray array];\n\
  ```\n\n如你所知，`array` 方法会创建一个自动释放的数组，你直接将其赋值给你的实例变量 `data`。问题是，该数组一旦当前事件处理完成就会被销毁。这是因为它被添加到了将在事件循环结束时清空的自动释放池中。为了确保数组在穿过事件循环时存活，你有几种替代方案。以下是三行可以替代使用的不同代码，它们都是有效的：\n\
  \n```objc\ndata = [[NSMutableArray array] retain]; // 在池清空后存活\n```\n```objc\ndata\
  \ = [[NSMutableArray alloc] init]; // 不自动释放\n```\n```objc\nself.data = [NSMutableArray\
  \ array]; // 使用 setter 方法\n```\n\n在最后一种情况下，由于 `data` 属性具有 `retain` 属性，自动释放的数组将被重留（回回赋值给\
  \ `self.data` 会导致使用 setter 方法）。注意，在所有三种情况下，你必须重写 `dealloc` 来释放你的数组：\n\n```objc\n\
  -(void)dealloc {\n    [data release];\n    [super dealloc];\n}\n```\n\n在许多情况下，使用框架方法创建新对象时，你可以选择创建一个自动释放的对象，也可以创建一个通过\
  \ `alloc` 分配的对象。如果你的应用程序在事件循环结束清空池之前创建了许多对象，你可能想要使用 `alloc` 的方法。这样，你可以在用完对象后立即释放它们，而无需等待事件处理结束。这可能意味着你的应用程序是因为内存耗尽被系统终止，还是运行良好，因此这是一个重要的考虑因素。在这些情况下，分析应用程序在处理事件时创建了多少对象可能是有价值的。\n\
  \n表 17.1 显示了一些分配自动释放方法的示例以及使用 `alloc` 分配它们的对应方法。\n\n**表 17.1 对象分配方法的选择**\n\n![image](img/17tab01.jpg)\n\
  \n### 查找内存泄漏\n\n随着开发日益复杂的应用程序，你会发现可能会出现这种情况：随着应用程序的持续，内存占用持续增长。这可能是由你创建了但忘记释放的对象引起的。问题在于如何找到这些对象以修复问题。通过从\
  \ Xcode 的 Product 菜单中选择 Analyze（分析）选项，你可以对你的代码进行各种问题的分析。该分析器能够检测的问题之一就是简单的内存泄漏。例如，它可以找到一个你\
  \ `alloc` 了但忘记 `release` 的对象。所以先尝试这种方法。\n\n\n\n\n\n如果分析器没有对你有帮助，你应该学习如何使用 Instruments。Instruments\
  \ 是一个非常强大的工具，它可以监控你的应用程序运行时的内存分配等，并帮助追踪内存泄漏。Apple 提供了一份使用 Instruments 的用户指南，你可以参考它来开始使用这个强大的工具。\n\
  \n### 垃圾回收\n\n到本书的目前为止，你所编写的程序都是运行在 `memory-managed` 运行时环境中。之前章节中总结的内存管理规则适用于这种环境，在这种环境中，你需要处理自动释放池（autorelease\
  \ pools）、对象保留（retain）和释放（release）相关的问题以及对象所有权。\n\n从 Objective C 2.0 开始，出现了另一种内存管理形式，称为\
  \ `garbage collection`（垃圾回收）。有了垃圾回收，你就不需要担心对象的保留和释放、自动释放池或引用计数（retain counts）。系统会自动跟踪哪些对象拥有其他对象，并在程序执行过程中需要空间时，自动释放（或垃圾回收掉）那些不再被引用的对象。\n\
  \n如果事情可以那么简单，为什么我们没有在本书中一直利用垃圾回收并跳过所有关于内存管理的讨论呢？有三个原因：首先，即使在支持垃圾回收的环境中，最好也知道谁拥有你的对象，并在你不再需要它们时对其进行跟踪。这将让你在编写代码时更加细致，因为你理解了对象之间的关系以及它们在程序中的生命周期。\n\
  \n第二个原因，如之前提到的）是 iOS 运行时环境不支持垃圾回收，因此当你为该平台开发程序时，没有选择。\n\n第三个原因适用于计划编写库函数、插件或共享代码的情况。由于这些代码可能被加载到支持垃圾回收或不支持垃圾回收的进程中，因此它们必须写成可以在两种环境中运行。这意味着你需要使用书中描述的内存管理技术来编写代码。这也意味着你必须在禁用和启用垃圾回收的情况下测试你的代码。\n\
  \n如果你决定使用垃圾回收，必须在使用 `Xcode` 编译程序时开启它。你可以通过 `Project`, `Edit Project Settings` 菜单来实现。在\
  \ `GCC 4.x—Code Generation` 设置下，你会看到一个名为 `Objective-C Garbage Collection` 的设置。将其从默认值\
  \ `Unsupported` 改为 `Required`，即指定你的程序将在启用自动垃圾回收的情况下构建（参见图 17.1）。\n\n图 17.1 启用垃圾回收。\n\
  \n![image](img/17fig01.jpg)\n\n启用垃圾回收后，你的程序仍然可以调用 `retain`、`autorelease`、`release`\
  \ 和 `dealloc` 方法。然而，它们都将被忽略。通过这种方式，你可以开发既可以在内存管理环境中也可以在垃圾回收环境中运行的程序。但是，这意味着如果你的代码要在两个环境中运行，那么你不能在你提供的\
  \ `dealloc` 方法中执行任何工作。因为正如前面提到的，当启用垃圾回收时，`dealloc` 调用会被忽略。\n\n* *\n\n### 注意事项\n\n\
  本章描述的内存管理技术对于大多数应用程序都是足够的。然而，在更高级的情况下，例如编写多线程应用程序时，你可能需要做得更多。\n\n* *\n\n### 练习\n\
  \n**1.** 编写一个程序，测试在字典中添加和删除条目对你添加和删除的对象引用计数的影响。\n\n**2.** 你认为 `NSArray` 的 `replaceObjectAtIndex:withObject:`\
  \ 方法对数组中被替换对象的引用计数会有什么影响？它对放入数组的对象会有什么影响？编写一个程序进行测试。然后查阅关于该方法的文档以验证你的结果。\n\n**3.**回到你在第一部分中一直使用的\
  \ `Fraction` 类，“Objective-C 语言](#pt01.html)”。为了方便起见，它列在第 21 章“编写 iOS 应用程序”中。修改各种\
  \ `MathOps` 分类方法，将每个操作产生的分数添加到自动释放池中。完成后，你能写出像这样的语句吗：\n\n```\n[[fractionA add: fractionB]\
  \ print];\n```\n\n且不发生内存泄漏？解释你的答案。\n\n**4.** 选择书中任意两个程序，并在开启垃圾回收的 `Xcode` 中编译并运行它们。验证当垃圾回收开启时，`retain`、`autorelease`\
  \ 和 `release` 等方法调用是否被忽略。\n\n## 第 18 章 对象的复制\n\n本章讨论了涉及对象复制的一些微妙之处。我们引入了浅拷贝与深拷贝的概念，并讨论了如何在\
  \ Foundation 框架下进行拷贝。\n\n在第 8 章“继承”讨论了当你使用简单的赋值语句将一个对象赋值给另一个对象时会发生什么，如下：\n\n```\n\
  origin = pt;\n```\n\n在这个示例中，`origin` 和 `pt` 都是我们像下面所示定义的 `XYPoint` 对象：\n\n```\n\
  @interface XYPoint: NSObject\n{\n    int x;\n    int y;\n};\n  ...\n@end\n```\n\n\
  回想一下，赋值的效果是将对象 `pt` 的地址拷贝到 `origin` 中。在赋值操作结束时，两个变量都指向内存中的同一位置。通过如下消息对实例变量进行更改：\n\
  \n```\n[origin setX: 100 andY: 200];\n```\n\n会改变 `origin` 和 `pt` 所引用的 `XYPoint`\
  \ 对象的 `x` 和 `y` 坐标。\n\n这种情况也适用于 Foundation 对象：将一个变量赋值给另一个只是创建了该对象的另一个引用（但不会增加引用计数，这在第\
  \ 17 章“内存管理”中讨论过）。如果 `dataArray` 和 `dataArray2` 都是 `NSMutableArray` 对象，以下语句从两个变量引用的同一个数组中删除第一个元素：\n\
  \n```\ndataArray2 = dataArray;\n[dataArray2 removeObjectAtIndex: 0];\n```\n\n###\
  \ `copy` 和 `mutableCopy` 方法\n\nFoundation 类实现了名为 `copy` 和 `mutableCopy` 的方法，你可以使用它们创建对象的拷贝。这是通过实现符合\
  \ `<NSCopying>` 协议的方法。如果你的类需要区分对象的可变和不可变拷贝，你还必须根据 `<NSMutableCopying>` 协议实现方法。你将在本节稍后的部分学习如何这样做。\n\
  \n回到 Foundation 类的拷贝方法，给定上一节描述的两个 `NSMutableArray` 对象 `dataArray2` 和 `dataArray`，语句\n\
  \n```\ndataArray2 = [dataArray mutableCopy];\n```\n\n会在内存中创建 `dataArray` 的新拷贝，复制其所有元素。随后，执行语句\n\
  \n```\n[dataArray2 removeObjectAtIndex: 0];\n```\n\n从 `dataArray2` 中删除了第一个元素，但没有从\
  \ `dataArray` 中删除。程序 18.1 说明了这一点。\n\n**程序 18.1**\n\n* *\n\n```\n#import <Foundation/Foundation.h>\n\
  int main (int argc, char *argv[])\n{\n    NSAutleasePool * pool = [[NSAutleasePool\
  \ alloc] init];\n    NSMutableArray *dataArray = [NSMutableArray arrayWithObjects:\n\
  \        @\"one\", @\"two\", @\"three\", @\"four\", nil];\n    NSMutableArray *dataArray2;\n\
  \    // 简单赋值\n    dataArray2 = dataArray;\n    [dataArray2 removeObjectAtIndex:\
  \ 0];\n    NSLog (@\"dataArray:  \");\n    for ( NSString *elem in dataArray )\n\
  \        NSLog (@ %@\", elem);\n    NSLog (@\"dataArray2: \");\n    for ( NSString\
  \ *elem in dataArray2 )\n        NSLog (@ %@\", elem);\n    // 尝试拷贝，然后从拷贝中删除第一个元素\n\
  \    dataArray2 = [dataArray mutableCopy];\n}\n```\n\n\n\n```objc\n[dataArray2 removeObjectAtIndex:\
  \ 0];\n\nNSLog (@\"dataArray:  \");\n\nfor ( NSString *elem in dataArray )\n   \
  \ NSLog (@\" %@\", elem);\n\nNSLog (@\"dataArray2: \");\n\nfor ( NSString *elem\
  \ in dataArray2 )\n    NSLog (@\" %@\", elem);\n\n[dataArray2 release];\n\n[pool\
  \ drain];\n\nreturn 0;\n```\n\n***\n\n**程序 18.1 输出**\n\n***\n\n```text\ndataArray:\n\
  \    two\n    three\n    four\ndataArray2:\n    two\n    three\n    four\ndataArray:\n\
  \    two\n    three\n    four\ndataArray2:\n    three\n    four\n```\n\n***\n\n\
  该程序定义了可变数组对象 `dataArray`，并将其元素设置为字符串对象 `@one, @two, @three, @four`。正如我们所讨论过的，赋值\
  \ `dataArray2 = dataArray;` 仅仅是为内存中的同一个数组对象创建了另一个引用。当你从 `dataArray2` 中删除第一个对象，并随后打印两个数组对象的元素时，第一个元素（字符串\
  \ `@one`）从两个数组对象引用中都消失并不意外。\n\n接下来，你创建了 `dataArray` 的可变副本，并将生成的副本赋值给 `dataArray2`。这在内存中创建了两个不同的可变数组，它们都包含三个元素。现在当你从\
  \ `dataArray2` 中删除第一个元素时，它对 `dataArray` 的内容没有影响，这通过 `dataArray` 的最后输出得到了验证。\n\n\
  注意，对对象创建可变副本并不要求被复制的对象本身是可变的。这同样适用于不可变副本：你可以为一个`可变对象` 创建一个不可变副本。\n\n还需要注意的是，在复制数组时，复制操作会自动增加数组中每个元素的引用计数（retain\
  \ count）。因此，如果你复制了一个数组并随后释放了原始数组，该副本仍然包含有效的元素。\n\n由于程序中使用 `mutableCopy` 方法创建了 `dataArray`\
  \ 的副本，你负责释放它的内存。上一章涵盖了这样一条规则：你负责释放使用某种拷贝方法创建的对象。这解释了为什么在程序 18.1 的末尾包含了这一行：\n\n```objc\n\
  [dataArray2 release];\n```\n\n### 浅拷贝与深拷贝\n\n[程序 18.1] 使用不可变字符串填充 `dataArray` 的元素（记住常量字符串对象是不可变的）。在程序\
  \ 18.2 中，你将改用可变字符串填充它，以便更改数组中的其中一个字符串。查看程序 18.2，并看看你是否理解它的输出。\n\n**程序 18.2**\n\n\
  ***\n\n```objc\n#import <Foundation/NSObject.h>\n#import <Foundation/NSArray.h>\n\
  #import <Foundation/NSString.h>\n#import <Foundation/NSAutoreleasePool.h>\n\nint\
  \ main (int argc, char *argv[])\n{\n    NSAutoreleasePool * pool = [[NSAutoreleasePool\
  \ alloc] init];\n    NSMutableArray     *dataArray = [NSMutableArray arrayWithObjects:\n\
  \        [NSMutableString stringWithString: @\"one\"],\n        [NSMutableString\
  \ stringWithString: @\"two\"],\n        [NSMutableString stringWithString: @\"three\"\
  ],\n        nil\n    ];\n    NSMutableArray  *dataArray2;\n    NSMutableString *mStr;\n\
  \    NSLog (@\"dataArray:  \");\n    for ( NSString *elem in dataArray )\n     \
  \   NSLog (@\" %@\", elem);\n    // 创建一个副本，然后更改其中一个字符串\n    dataArray2 = [dataArray\
  \ mutableCopy];\n    mStr = [dataArray objectAtIndex: 0];\n    [mStr appendString:\
  \ @\"ONE\"];\n    NSLog (@\"dataArray:  \");\n    for ( NSString *elem in dataArray\
  \ )\n        NSLog (@\" %@\", elem);\n    NSLog (@\"dataArray2:  \");\n    for (\
  \ NSString *elem in dataArray2 )\n        NSLog (@\" %@\", elem);\n    [dataArray2\
  \ release];\n    [pool drain];\n    return 0;\n}\n```\n\n***\n\n**程序 18.2 输出**\n\
  \n***\n\n```text\ndataArray:\n    one\n    two\n    three\ndataArray:\n    one\n\
  \    two\n    three\ndataArray2:\n    ONE\n    two\n    three\n```\n\n***\n\n该程序定义了可变数组对象\
  \ `dataArray`，并将其元素设置为字符串对象 `@one, @two, @three, @four`。正如我们所讨论过的，赋值 `dataArray2\
  \ = dataArray;` 仅仅是为内存中的同一个数组对象创建了另一个引用。当你从 `dataArray2` 中删除第一个对象，并随后打印两个数组对象的元素时，第一个元素（字符串\
  \ `@one`）从两个数组对象引用中都消失并不意外。\n\n接下来，你创建了 `dataArray` 的可变副本，并将生成的副本赋值给 `dataArray2`。这在内存中创建了两个不同的可变数组，它们都包含三个元素。现在当你从\
  \ `dataArray2` 中删除第一个元素时，它对 `dataArray` 的内容没有影响，这通过 `dataArray` 的最后输出得到了验证。\n\n\
  注意，对对象创建可变副本并不要求被复制的对象本身是可变的。这同样适用于不可变副本：你可以为一个`可变对象` 创建一个不可变副本。\n\n还需要注意的是，在复制数组时，复制操作会自动增加数组中每个元素的引用计数。因此，如果你复制了一个数组并随后释放了原始数组，该副本仍然包含有效的元素。\n\
  \n由于程序中使用 `mutableCopy` 方法创建了 `dataArray` 的副本，你负责释放它的内存。上一章涵盖了这样一条规则：你负责释放使用某种拷贝方法创建的对象。这解释了为什么在程序\
  \ 18.1 的末尾包含了这一行：\n\n```objc\n[dataArray2 release];\n```\n\n### 浅拷贝与深拷贝\n\n[程序 18.1]\
  \ 使用不可变字符串填充 `dataArray` 的元素（记住常量字符串对象是不可变的）。在程序 18.2 中，你将改用可变字符串填充它，以便更改数组中的其中一个字符串。查看程序\
  \ 18.2，并看看你是否理解它的输出。\n\n\n\n\n\n现在我们展示如何为你的 `Fraction` 类添加一个 `copy` 方法，该类在第一部分“Objective-C\
  \ 2.0 语言”中被广泛使用。请注意，我们在这里描述的拷贝策略对于你自己的类也同样有效。如果这些类是任何 Foundation 类的子类，你可能需要实现更复杂的拷贝策略。你必须考虑到父类可能已经实现了自身的拷贝策略这一事实。\n\
  \n回想一下，你的 `Fraction` 类包含两个整数实例变量，分别称为 `numerator`（分子）和 `denominator`（分母）。要为这些对象中的一个创建一个副本，你必须为新的分式分配空间，然后简单地将两个整数的值复制到新的分式中即可。\n\
  \n当你实实现 `<NSCopying>` 协议时，你的类必须实现 `copyWithZone:` 方法来响应 `copy` 消息。（`copy` 消息只是向你的类发送一个参数为\
  \ `nil` 的 `copyWithZone:` 消息。）如果你想区分可变副本和不可变副本，正如我们所指出的，你还需要根据 `<NSMutableCopying>`\
  \ 协议实现 `mutableCopyWithZone:` 方法。如果你同时实现了这两个方法，`copyWithZone:` 应该返回一个不可变副本，而 `mutableCopyWithZone:`\
  \ 应该返回一个可变副本。为对象创建可变副本并不要求被拷贝的对象本身也是可变的（反之亦然）；为不可变对象创建可变副本是完全合理的（例如考虑字符串对象）。\n\n\
  以下是 `@interface` 指令应该的样式：\n\n```objc\n@interface Fraction: NSObject <NSCopying>\n\
  ```\n\n`Fraction` 是 `NSObject` 的子类，并遵守 `NSCopying` 协议。\n\n在实现文件 `Fraction.m` 中，为你的新方法添加以下定义：\n\
  \n```objc\n-(id) copyWithZone: (NSZone *) zone\n{\n   Fraction *newFract = [[Fraction\
  \ allocWithZone: zone] init];\n   [newFract setTo: numerator over: denominator];\n\
  \   return newFract;\n}\n```\n\n`zone` 参数与你在程序中可以分配和使用的不同内存区域有关。当你编写分配大量内存的应用并希望通过将它们分组到这些区域来优化分配时，你才需要处理这些区域。你可以获取传递给\
  \ `copyWithZone:` 的值，并将其交给名为 `allocWithZone:` 的内存分配方法。该方法在指定的区域内分配内存。\n\n在分配了一个新的\
  \ `Fraction` 对象后，你将接收者的 `numerator` 和 `denominator` 变量复制到其中。`copyWithZone:` 方法应该返回该对象的新副本，你已经在方法中完成了这一操作。\n\
  \n程序 18.3 测试了你的新方法。\n\n**程序 18.3**\n\n```objc\n// 拷贝分式\n#import \"Fraction.h\"\n\
  #import <Foundation/NSAutoreleasePool.h>\n\nint main (int argc, char *argv[])\n\
  {\n    NSAutoreleasePool * pool = [[NSAutoreleasePool alloc] init];\n    Fraction\
  \ *f1 = [[Fraction alloc] init];\n    Fraction *f2;\n    [f1 setTo: 2 over: 5];\n\
  \    f2 = [f1 copy];\n    [f2 setTo: 1 over: 3];\n    [f1 print];\n    [f2 print];\n\
  \    [f1 release];\n    [f2 release];\n    [pool drain];\n    return 0;\n}\n```\n\
  \n**程序 18.3 输出**\n\n```\n2/5\n1/3\n```\n\n该程序创建了一个名为 `f1` 的 `Fraction` 对象并将其设置为\
  \ `2/5`。然后它调用 `copy` 方法创建一个副本，这会向你的对象发送 `copyWithZone:` 消息。该方法创建一个新的 `Fraction`，将来自\
  \ `f1` 的值复制到其中，并返回结果。回到 `main` 函数中，你将该结果赋值给 `f2`。随后将 `f2` 中的值设置为分式 `1/3`，证明了这对原始分式\
  \ `f1` 没有影响。将程序中读取这一行：\n\n`f2 = [f1 copy];`\n\n简单改为\n\n`f2 = f1;`\n\n并移除程序结尾对 `f2`\
  \ 的 `release`，以观察你获得的不同结果。\n\n如果你的类可能会被子类化，你的 `copyWithZone:` 方法将被继承。在这种情况下，你应该将方法中读取这一行：\n\
  \n`Fraction *newFract = [[Fraction allocWithZone: zone] init];`\n\n改为\n\n`id newFract\
  \ = [[[self class] allocWithZone: zone] init];`\n\n这样，你就会从 `copy` 的接收者的类中分配一个新对象。（例如，如果它被子类化为一个名为\
  \ `NewFraction` 的类，请确保在继承的方法中分配一个新的 `NewFraction` 对象，而不是 `Fraction` 对象。）\n\n如果你的类可能会被子类化，你的\
  \ `copyWithZone:` 方法将被继承。……（为了简洁省略了内容）……实现 `<NSCopying>` 协议时，你应该先调用父类的 `copy` 方法来拷贝继承的变量，然后包含你自己的代码来拷贝你添加的任何实例变量（如果有的话）。\n\
  \n### 在 Setter 和 Getter 方法中拷贝对象\n\n每当你实现一个 setter 或 getter 方法时，都应该考虑你向实例变量中存储了什么，正在获取什么，以及你是否需要保护这些值。例如，当你使用以下代码设置\
  \ `AddressCard` 的名称时：\n\n`newCard.name = newName;`\n\n假设 `newName` 是一个字符串对象。假设在\
  \ setter 方法中你直接将参数赋值给实例变量：\n\n```objc\n-(void) setName: (NSString *) theName\n{\n\
  \    name = newName;\n}\n```\n\n现在，如果程序以后更改了 `newName` 中包含的字符会发生什么（如果 `newName`\
  \ 是一个可变对象；这种对象可以使用指定 `NSString` 对象的地方）？它会改变地址卡的相应字段，因为它们将引用同一个字符串对象。\n\n正如你已经看到的，更安全的方法是在\
  \ setter 方法中创建对象的副本，以防止这种副作用。我们通过使用 `alloc` 方法创建一个新字符串，然后使用 `initWithString:` 设置它。\n\
  \n你也可以编写一个使用 `copy` 的 `setName:` 方法，如下：\n\n```objc\n-(void) setName: (NSString *)\
  \ theName\n{\n    name = [theName copy];\n}\n```\n\n当然，为了让这个 setter 方法内存内存友好，你应该先\
  \ `autorelease` 旧值，如下：\n\n```objc\n-(void) setName: (NSString *) theName\n{\n  \
  \  [name autorelease];\n    name = [theName copy];\n}\n```\n\n如果你在属性声明 中指定了 `copy`\
  \ 属性，合成方法将使用该类的 `copy` 方法（你写的或你继承的）。因此，下面的 `property` 声明\n\n```objc\n@property (nonatomic,\
  \ copy) NSString *name;\n```\n\n将生成行为如下的合成方法：\n\n```objc\n-(void) setName: (NSString\
  \ *) theName\n{\n    if (theName != name) {\n        [name release];\n        name\
  \ = [theName copy];\n    }\n}\n```\n\n此处使用 `nonatomic` 告诉系统不要用互斥锁（*mutex*, *mutually\
  \ *exclusive*）保护属性访问器。编写线程安全代码的人使用互斥锁来防止两个线程同时执行相同的代码，这种情况通常会导致严重的问题。但这些锁会减慢程序运行，如果你知道这段代码只会在单线程中运行，你就可以避免使用它们。\n\
  \n\n\n\n\n如果没有指定 `nonatomic` 或者而是指定了 `atomic`（这是默认值），那么你的实例变量将受到互斥锁（mutex lock）的保护。此外，合成的\
  \ getter 方法在返回其值之前会 `retain` 并 `autorelease` 该实例变量。在非垃圾回收的环境中，这可以防止实例变量被 setter\
  \ 方法调用时覆盖，因为 setter 方法在设置新值之前可能会先释放实例变量的旧值。getter 方法中的 `retain` 确保了旧值不会被释放内存。\n\n\
  ***\n\n### Note\n\n尽管在垃圾回收的环境中 `retain/autorelease` 问题是无关紧要的（回想一下这些方法调用会被忽略），但互斥锁问题并非不存在。因此，如果你的代码将在多线程环境中运行，请考虑使用原子的访问器方法。\n\
  \n***\n\n关于保护实例变量值的相同讨论也适用于 getter 例程。如果你返回一个可变对象，你应该确保对返回值的更改不会影响你实例变量的值。在这种情况下，你可以为实例变量创建一个副本并返回该副本，而不是原始值。\n\
  \n回到 `copy` 方法的实现，如果你正在复制包含不可变对象的实例变量（例如，不可变字符串对象），你可能不需要为对象的内容创建一个新副本。只需通过 `retain`\
  \ 该对象来创建一个新引用可能足够了。例如，如果你正在为包含 `name` 和 `email` 成员的 `AddressCard` 类实现一个拷贝方法，以下 `copyWithZone:`\
  \ 的实现就足够了：\n\n```objc\n-(AddresssCard *) copyWithZone: (NSZone *) zone\n{\n    AddressCard\
  \ *newCard = [[AddressCard allocWithZone: zone] init];\n    [newCard retainName:\
  \ name andEmail: email];\n    return newCard;\n}\n\n-(void) retainName: (NSString\
  \ *) theName andEmail: (NSString *) theEmail\n{\n    name = [theName retain];\n\
  \    email = [theEmail retain];\n}\n```\n\n这里没有使用 `setName:andEmail:` 方法来复制实例变量，因为该方法会对其参数创建新副本，这违背了整个练习的初衷。相反，你只是使用一个名为\
  \ `retainName:andEmail:` 的新方法保留了这两个变量。\n\n意识到在这里通过 `retain` 实例变量（而不是对它们进行完全拷贝）就可以，是因为复制卡片的所有者无法影响原始卡的\
  \ `name` 和 `email` 成员（这些包含不可变的字符串对象）。你可能想花一点时间思考一下这是否如此（提示：这与 setter 方法有关）。\n\n\
  ### Exercises\n\n**1.** 根据 `NSCopying` 协议为 `AddressBook` 类实现一个拷贝方法。同时也实现一个 `mutableCopy`\
  \ 方法有意义吗？为什么或为什么没有意义？\n\n**2.** 修改第 8 章中定义的 `Rectangle` 和 `XYPoint` 类，以符合 `<NSCopying>`\
  \ 协议。为这两个类都添加一个 `copyWithZone:` 方法。确保 `Rectangle` 使用 `XYPoint` 的拷贝方法来拷贝其 `XYPoint`\
  \ 成员起点。为这些类同时实现可变和不可变拷贝有意义吗？请解释。\n\n**3.** 创建一个 `NSDictionary` 字典对象并向其填充一些键/值对。然后同时创建可变和不可变的副本。这些创建的是深拷贝还是浅拷贝？验证你的答案。\n\
  \n**4.** 谁负责释放本章实现的 `copyWithZone:` 方法中为新的 `AddressCard` 分配的内存？为什么为什么？\n\n# 第 19\
  \ 章 归档 (Archiving)\n\n在 Objective-C 术语中，归档是将一个或多个对象保存为某种格式的过程，以便以后恢复。这通常涉及将对象写入文件，以便随后重新读取。在本章中，我们将讨论两种归档数据的方法：属性列表（property\
  \ lists）和键值编码（key-valued coding）。\n\n### 使用 XML 属性列表归档\n\nMac OS X 使用 *XML*属性列表（或\
  \ `plists`）存储诸如默认偏好、应用程序设置和配置信息，因此了解如何创建并读取它们是有用的。然而，它们用于归档的目的是有限的，因为在为数据结构创建属性列表时，特定的对象类不会被保留，同一个对象的多个引用不会存储，对象的可变性也不会被保留。\n\
  \n***\n\n### Note\n\n所谓的“旧式”属性列表以与 XML 属性列表不同的格式存储数据。如果，尽可能在程序中使用 XML 属性列表。\n\n\
  ***\n\n如果你的对象类型是 `NSString`、`NSDictionary`、`NSArray`、`NSDate`、`NSData` 或 `NSNumber`，你可以使用这些类实现的\
  \ `writeToFile:atomically:` 方法将数据写入文件。在写入字典或数组的情况下，该方法以 XML 属性列表的格式将数据写入文件。程序 19.1\
  \ 展示了你在第 15 章“数字、字符串和集合”中创建的简单术语表如何作为属性列表写入文件。\n\n**程序 19.1**\n\n***\n\n```objc\n\
  #import <Foundation/Foundation.h>\n\nint main (int argc, char *argv[])\n{\n    NSAutleasePool*\
  \ pool = [[NSAutleasePool alloc] init];\n    NSDictionary* glossary =\n    [NSDictionary\
  \ dictionaryWithObjects:\n    @\"A class defined so other classes can inherit from\
  \ it.\",\n    @\"abstract class\",\n    @\"To implement all the methods defined\
  \ in a protocol\",\n    @\"adopt\",\n    @\"Storing an object for later use. \"\
  ,\n    @\"archiving\",\n    nil];\n\n    if ([glossary writeToFile: @\"glossary\"\
  \ atomically: YES] == NO)\n        NSLog (@\"Save to file failed!\");\n\n    [pool\
  \ drain];\n    return 0;\n}\n```\n\n***\n\n`writeToFile:atomically:` 消息被发送给字典对象\
  \ `glossary`，导致字典被写入文件 `glossary`。`atomically` 参数设置为 `YES`，这意味着你希望先对临时文件执行写入操作；一旦成功，将最终数据移动到该文件中。这是一种保护机制，可以防止文件在例如系统在写入操作中间崩溃时变得损坏。在这种情况下，原始的\
  \ `glossary` 文件（如果之前存在）不会受到损害。\n\n如果你检查由程序 19.1 创建的 `glossary` 文件的内容，它看起来如下：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE plist PUBLIC \"-//Apple\
  \ Computer//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\"\
  >\n<plist version=\"1.0\">\n<dict>\n    <key>abstract class</key>\n    <string>A\
  \ class defined so other classes can inherit from it.</string>\n    <key>adopt</key>\n\
  \    <string>To implement all the methods defined in a protocol</string>\n    <key>archiving</key>\n\
  \    <string>Storing an object for later use. </string>\n</dict>\n</plist>\n```\n\
  \n你可以从创建的 XML 文件中看到，字典是以一组键（<key>...</key>）和值（<string>...</string>）对的形式写入文件的。\n\n\
  当你从字典创建属性列表时，字典中的键必须全部是 `NSString` 对象。数组的元素或字典的值可以是 `NSString`、`NSArray`、`NSDictionary`、`NSData`、`NSDate`\
  \ 或 `NSNumber` 对象。\n\n\n\n\n\n要从文件中读取 XML 属性列表（property list）到程序中，你需要使用 `dictionaryWithContentsOfFile:`\
  \ 或 `arrayWithContentsOfFile:` 方法。要读取数据，使用 `dataWithContentsOfFile:` 方法；要读取字符串对象，使用\
  \ `stringWithContentsOfFile:` 方法。Program 19.2 读取了在 Program 19.1 中写入的术表并显示其内容。\n\n\
  ## Program 19.2\n\n* * *\n\n```objc\n#import <Foundation/Foundation.h>\n\nint main\
  \ (int argc, char *argv[])\n\n{\n   NSAutoreleasePool * pool = [[NSAutoreleasePool\
  \ alloc] init];\n   NSDictionary *glossary;\n   glossary = [NSDictionary dictionaryWithContentsOfFile:\
  \ @\"glossary\"];\n   for ( NSString *key in glossary )\n       NSLog (@\"%@: %@\"\
  , key, [glossary objectForKey: key]);\n   [pool drain];\n   return 0;\n}\n```\n\n\
  * * *\n\n## Program 19.2. 输出\n\n* * *\n\narchiving: 存储一个对象以备后用。\n\nabstract class:\
  \ 定义一个类，以便其他类继承自它。\n\nadopt: 实现协议中定义的所有方法\n\n* * *\n\n你的属性列表不需要从 Objective-C 程序中创建；属性列表可以来自任何源。你可以使用简单的文本编辑器创建自己的属性列表，也可以使用位于\
  \ Mac OS X 系统上 `/Developer/Applications/Utilities` 目录下的 Property List Editor 程序。如果你计划在应用程序中使用属性列表，你可能想看一眼\
  \ `NSPropertyListSerialization` 类，它允许以机器可移植的方式将属性列表写入文件并从文件中读取。\n\n### 使用 `NSKeyedArchiver`\
  \ 进行归档\n\n一种更灵活的方法可以允许你将任何类型的对象保存到文件中，而不只是字符串、数组和字典。这是通过使用 `NSKeyedArchiver` 类创建*键值*（keyed）归档来实现的。\n\
  \nMac OS X 从 10.2 版本开始支持键值归档。在此之前，使用 `NSArchiver` 类创建的是*顺序*（sequential）归档。顺序归档要求归档中的数据必须按照写入时完全相同的顺序进行读取。\n\
  \n键值归档是指归档中的每个字段都有一个名称。当你归档一个对象时，你给它一个名称，即*键*（key）。当你从归档中检索它时，通过相同的键进行检索。通过这种方式，对象可以按任何顺序写入归档并检索。此外，如果类添加或删除了新的实例变量，你的程序可以处理这一点。\n\
  \nProgram 19.3 显示了可以使用 `NSKeyedArchiver` 类的 `archiveRootObject:toFile:` 方法将术表保存到磁盘上的文件。\n\
  \n## Program 19.3\n\n* * *\n\n```objc\n#import <Foundation/Foundation.h>\n\nint\
  \ main (int argc, char *argv[])\n{\n   NSAutoreleasePool * pool = [[NSAutoreleasePool\
  \ alloc] init];\n   NSDictionary *glossary =\n     [NSDictionary dictionaryWithObjectsAndKeys:\n\
  \         @\"A class defined so other classes can inherit from it\",\n         @\"\
  abstract class\",\n         @\"To implement all the methods defined in a protocol\"\
  ,\n         @\"adopt\",\n         @\"Storing an object for later use\",\n      \
  \   @\"archiving\",\n         nil\n     ];\n   [NSKeyedArchiver archiveRootObject:\
  \ glossary\n             toFile: @\"glossary.archive\"];\n   [pool release];\n \
  \  return 0;\n}\n```\n\n* * *\n\nProgram 19.3 不会在终端产生任何输出。然而，语句\n\n```objc\n[NSKeyedArchiver\
  \ archiveRootObject: glossary\n             toFile: @\"glossary.archive\"];\n```\n\
  \n将字典 `glossary` 写入文件 `glossary.archive`。可以为文件指定任何路径。在这种情况下，文件被写入到当前目录。\n\n创建的归档文件以后可以使用\
  \ `NSKeyedUnarchiver` 的 `unarchiveObjectWithFile:` 方法读取到你的程序中，正如 Program 19.4 中所示的那。\n\
  \n## Program 19.4\n\n* * *\n\n```objc\n#import <Foundation/Foundation.h>\n\nint\
  \ main (int argc, char *argv[])\n{\n   NSAutoreleasePool * pool = [[NSAutoreleasePool\
  \ alloc] init];\n   NSDictionary *glossary;\n   glossary = [NSKeyedUnarchiver unarchiveObjectWithFile:\n\
  \               @\"glossary.archive\"];\n   for ( NSString *key in glossary )\n\
  \       NSLog (@\"%@: %@\", key, [glossary objectForKey: key]);\n   [pool drain];\n\
  \   return 0;\n}\n```\n\n* * *\n\n## Program 19.4. 输出\n\n* * *\n\narchiving: 存储一个对象以备后用。\n\
  \nabstract class: 定义一个类，以便其他类继承自它。\n\nadopt: 实现协议中定义的所有方法\n\n* * *\n\n语句\n\n```objc\n\
  glossary = [NSKeyedUnarchiver unarchiveObjectWithFile: @\"glossary.archive\"];\n\
  ```\n\n将字典 `glossary` 写入文件 `glossary.archive`。可以为文件指定任何路径。在这种情况下，文件被写入到当前目录。\n\n\
  ### 编码与解码方法\n\n为了归档列出以外的对象，你必须告诉系统如何归档（即*编码*）你的对象，以及如何反归档（即*解码*）它们。这是通过根据 `NSCoding`\
  \ 协议为类添加 `encodeWithCoder:` 和 `initWithCoder:` 方法来实现。对于我们的地址簿示例，你必须向 `AddressBook`\
  \ 和 `AddressCard` 类添加这些方法。\n\n当归档器想要编码指定类的对象时，就会调用 `encodeWithCoder:` 方法，该方法告诉它如何这样做。同样，当解码指定类的对象时，就会调用\
  \ `initWithCoder:` 方法。\n\n通常，编码方法应该指定要保存的对象中的每个实例变量。幸运的是，你有帮助这样做。对于之前描述的基础 Objective-C\
  \ 类，你可以使用 `encodeObject:forKey:` 方法。对于基础数据类型（如整数和浮点数），你使用表 19.1 列出的方法之一。解码方法 `initWithCoder:`\
  \ 方法相反：你使用 `decodeObject:forKey:` 解码基础 Objective-C 类，并使用表 19.1 所示相应的解码方法处理基础数据类型。\n\
  \n### Program 19.5\n\nProgram 19.5 为 `AddressBook` 和 `AddressCard` 类添加了两个编码和解码方法。\n\
  \n## Program 19.5. Addresscard.h 接口文件\n\n* * *\n\n```objc\n#import <Foundation/Foundation.h>\n\
  \n@interface AddressCard: NSObject <NSCoding, NSCopying>\n\n{\n   NSString *name;\n\
  \   NSString *email;\n}\n\n@property (copy, nonatomic) NSString *name, *email;\n\
  \n-(void) setName: (NSString *) theName andEmail: (NSString *) theEmail;\n\n-(NSComparisonResult)\
  \ compareNames: (id) element;\n\n-(void) print;\n```\n\n\n\n\n\n```objc\n// NSCopying\
  \ 协议的额外方法\n```\n\n```objc\n-(void) retainName:(NSString *)theName andEmail::(NSString\
  \ *)theEmail;\n\n@end\n```\n\n***\n\n以下是用于你的 `AddressCard` 的两个新方法，将添加到实现文件中：\n\n\
  ```objc\n-(void) encodeWithCoder: (NSCoder *) encoder\n{\n   [encoder encodeObject:\
  \ name forKey: @\"AddressCardName\"];\n   [encoder encodeObject: email forKey: @\"\
  AddressCardEmail\"];\n}\n\n-(id) initWithCoder: (NSCoder *) decoder\n{\n   name\
  \ = [[decoder decodeObjectforKey: @\"AddressCardName\"] retain];\n   email = [[decoder\
  \ decodeObjectforKey: @\"AddressCardEmail\"] retain];\n   return self;\n}\n```\n\
  \n编码方法 `encodeWithCoder:` 接收一个 `NSCoder` 对象作为参数。由于你的 `AddressCard` 类直接继承自 `NSObject`，你不需要担心编码继承的实例变量。如果你确实需要这样做，并且知道你的类的父类符合\
  \ `NSCoding` 协议，那么你应该用类似下面的语句开始你的编码方法，以确保继承的实例变量也被编码：\n\n`[super encodeWithCoder:\
  \ encoder];`\n\n你的通讯录有两个实例变量，分别称为 `name` 和 `email`。由于它们都是 `NSString` 对象，你可以使用 `encodeObject:forKey:`\
  \ 方法分别对它们进行编码。这两个实例变量随后会被添加到归归档文件中。\n\n`encodeObject:forKey:` 方法编码一个对象并将其存储在指定的键下，以便以后使用该键进行检索。键的名称是任意的，只要你在检索（解码）数据时使用的名称与归档（编码）时使用的名称相同，就可以指定任何你喜欢的键。唯一可能发生冲突的情况是如果被编码对象的子类使用了相同的键。为了防止这种情况发生，在组合用于归档的键时，可以在实例变量名之前加上类名，就像在\
  \ 程序 19.5 中所示的那样。\n\n注意，`encodeObject:forKey:` 可用于任何在其类中实现了相应的 `encodeWithCoder:`\
  \ 方法的对象。\n\n解码过程是反的。传递给 `initWithCoder:` 的参数再次是一个 `NSCoder` 对象。你不需要担心这个参数；只需记住，对于你想从归档中提取的每个对象，都是向它发送消息。\n\
  \n***\n\n### 注意事项\n\n注意，解码后的对象是被保留（retain）的。这是因为 `NSKeyedUnarchiver` 类会对它解码的对象进行自动释放（autorelease）。如果你正在编写\
  \ iOS 应用程序，保留它们是非常重要的，因为自动释放池在处理完每个事件结束时会被清空。如果你有一个具有 retain` 或 `copy` 属性的属性，你也可以使用该属性的设置方法（setter）来进行赋值。\n\
  \n***\n\n再次，由于我们的 `AddressCard` 类直接继承自 `NSObject`，你不需要担心解码继承的实例变量。如果你确实需要这样做，可以在你的解码方法开头插入这样一行代码（假设你的类的父类符合\
  \ `NSCoding` 协议）：\n\n`self = [super initWithCoder: decoder];`\n\n随后，每个实例变量将通过调用\
  \ `decodeObject:ForKey:` 方法并传递编码该变量时使用的键来解码。\n\n与你的 `AddressCard` 类类似，你为 `AddressBook`\
  \ 类添加了编码和解码方法。你需要在接口文件中修改的唯一行是 `@interface` 指令，用于声明 `AddressBook` 类现在符合 `NSCoding`\
  \ 协议。该更改如下：\n\n`@interface AddressBook: NSObject <NSCoding, NSCopying>`\n\n以下是包含在实现文件中的定义：\n\
  \n```objc\n-(void) encodeWithCoder: (NSCoder *) encoder\n{\n   [encoder encodeObject:\
  \ bookName forKey: @\"AddressBookBookName\"];\n   [encoder encodeObject: book forKey:\
  \ @\"AddressBookBook\"];\n}\n\n-(id) initWithCoder: (NSCoder *) decoder\n{\n   bookName\
  \ = [[decoder decodeObjectForKey: @\"AddressBookBookName\"] retain];\n   book =\
  \ [[decoder decodeObjectForKey: @\"AddressBookBook\"] retain];\n   return self;\n\
  }\n```\n\n测试程序所示如下 程序 19.6。\n\n**程序 19.6. 测试程序**\n\n***\n\n```objc\n#import \"AddressBook.h\"\
  \n\nint main (int argc, char *argv[])\n{\n   NSAutoreleasePool * pool = [[NSAutoreleasePool\
  \ alloc] init];\n   NSString  *aName = @\"Julia Kochan\";\n   NSString  *aEmail\
  \ = @\"jewls337@axlc.com\";\n   NSString  *bName = @\"Tony Iannino\";\n   NSString\
  \  *bEmail = @\"tony.iannino@techfitness.com\";\n   NSString  *cName = @\"Stephen\
  \ Kochan\";\n   NSString  *cEmail = @\"steve@steve_kochan.com\";\n   NSString  *dName\
  \ = @\"Jamie Baker\";\n   NSString  *dEmail = @\"jbaker@hit.com\";\n   AddressCard\
  \ *card1 = [[AddressCard alloc] init];\n   AddressCard *card2 = [[AddressCard alloc]\
  \ init];\n   AddressCard *card3 = [[AddressCard alloc] init];\n   AddressCard *card4\
  \ = [[AddressCard alloc] init];\n   AddressBook *myBook = [AddressBook alloc];\n\
  \n   [card1 setName:aName andEmail:aEmail];\n   [card2 setName:bName andEmail:bEmail];\n\
  \   [card3 setName:cName andEmail:cEmail];\n   [card4 setName:dName andEmail:dEmail];\n\
  \n   [myBook addCard:card1];\n   [myBook addCard:card2];\n   [myBook addCard:card3];\n\
  \   [myBook addCard:card4];\n\n   if ([NSKeyedArchiver archiveObject:myBook toFile:@\"\
  book.arch\"]) {\n      NSLog(@\"archiving success\");\n   } else {\n      NSLog(@\"\
  archiving failed\");\n   }\n\n   [card1 release];\n   [card2 release];\n   [card3\
  \ release];\n   [card4 release];\n   [myBook release];\n   [pool drain];\n   return\
  \ 0;\n}\n```\n\n该程序创建通讯录，然后将其归档到文件 `book.arch`。在创建归档的过程中，意识到来自 `AddressBook` 和 `AddressCard`\
  \ 类的方法都被调用了。你可以为这些方法添加一些 `NSLog` 调用。\n\n程序 19.7 显示如何将通讯录读回内存。\n\n**程序 19.7**\n\n\
  ***\n\n```objc\n#import \"AddressBook.h\"\n#import <Foundation/Autorelease.h>\n\n\
  int main (int argc, char *argv[])\n{\n   NSAutoreleasePool * pool = [[NSAutoreleasePool\
  \ alloc] init];\n   AddressBook *myBook = [NSKeyedUnarchiver unarchiveFromFile:@\"\
  book.arch\"];\n\n   if (myBook) {\n      [myBook list];\n   }\n\n   [pool drain];\n\
  \   return 0;\n}\n```\n\n**程序 19.7. 输出**\n\n***\n\n```\n======== Contents of: Steve's\
  \ Address Book\nJamie Baker:jbaker@hit.com\nJulia Kochan:jewls337@axlc.com\nStephen\
  \ Kochan:steve@steve_kochan.com\nTony Iannino:tony.iannino@techfitness.com\n====================\n\
  ```\n\n***\n\n在解档通讯录的过程中，添加到两个类的解码方法被自动调用。注意你可以轻松地读回通讯录。\n\n正如，`encodeObject:forKey:`\
  \ 适用于内置类以及根据 `NSCoding` 协议编写了编码解码方法的类。如果你的实例包含某些数据类型，例如整数或浮点数，你需要知道如何编码和解码它们（参见\
  \ 表格 19.1）。\n\n这是一个简单的 `Foo` 类的定义，它包含三个实例变量：一个是 `NSString`，另一个是 `int`，第三个是 `float`。该类有一个\
  \ setter 方法、三个 getter 方法以及用于归档的编码解码方法：\n\n```objc\n@interface Foo: NSObject <NSCoding>\n\
  \n{\n   NSString *strVal;\n   int intVal;\n   float      floatVal;\n}\n\n@property\
  \ (copy, nonatomic) NSString *strVal;\n@property int intVal;\n@property float floatVal;\n\
  \n@end\n```\n\n实现文件如下：\n\n```objc\n@implementation Foo\n\n@synthesize strVal, intVal,\
  \ floatVal;\n\n-(void) encodeWithCoder: (NSCoder *) encoder\n{\n```\n\n\n\n\n\n\
  ```objective\n[encoder encodeObject: strVal forKey: @\"FoostrVal\"];\n[encoder encodeInt:\
  \ intVal forKey: @\"FoointVal\"];\n[encoder encodeFloat: floatVal forKey: @\"FoofloatVal\"\
  ];\n}\n\n```objective\n-(id) initWithCoder: (NSCoder *) decoder\n{\n    strVal =\
  \ [[decoder decodeObjectForKey: @\"FoostrVal\"] retain];\n    intVal = [decoder\
  \ decodeIntForKey: @\"FoointVal\"];\n    floatVal = [decoder decodeFloatForKey:\
  \ @\"FoofloatVal\"];\n    return self;\n}\n\n@end\n```\n\n编码例程首先如之前所示，使用 `encodeObject:forKey:`\
  \ 方法对字符串值 `strVal` 进行编码。\n\n在 程序 19.8 中，创建了一个 `Foo` 对象，将其归档到文件、反归档，然后显示出来。\n\n###\
  \ 程序 19.8. 测试程序\n\n```objective\n#import <Foundation/Foundation.h>\n#import \"Foo.h\"\
  \     // 我们 Foo 类的定义\n\nint main (int argc, char *argv[])\n{\n    NSAutoreleasePool\
  \ * pool = [[NSAutoreleasePool alloc] init];\n    Foo *myFoo1 = [[Foo alloc] init];\n\
  \    Foo *myFoo2;\n    [myFoo1 setStrVal: @\"This is the string\"];\n    [myFoo1\
  \ setIntVal: 12345];\n    [myFoo1 setFloatVal: 98.6];\n    [NSKeyedArchiver archiveRootObject:\
  \ myFoo1 toFile: @\"foo.arch\"];\n    myFoo2 = [NSKeyedUnarchiver unarchiveObjectWithFile:\
  \ @\"foo.arch\"];\n    NSLog (@\"%@\\n%i\\n%g\", [myFoo2 strVal], [myFoo2 intVal],\n\
  \              [myFoo2 floatVal]);\n    [myFoo1 release];\n    [pool drain];\n \
  \   return 0;\n}\n```\n\n### 程序 19.8. 输出\n\n```\nThis is the string\n12345\n98.6\n\
  ```\n\n以下消息对对象中的三个实例变量进行归档：\n\n```objective\n[encoder encodeObject: strVal forKey:\
  \ @\"FoostrVal\"];\n[encoder encodeInt: intVal forKey: @\"FoointVal\"];\n[encoder\
  \ encodeFloat: floatVal forKey: @\"FoofloatVal\"];\n```\n\n一些基本数据类型，如 `char`、`short`、`long`\
  \ 和 `long long` 未列在 表 19.1 中；你必须确定你的数据对象的大小并使用适当的例程。例如，`short int` 通常是 16 位，`int`\
  \ 和 `long` 可以是 32 或 64 位，而 `long long` 是 64 位。（你可以使用第 13 章“底层 C 语言特性”中描述的 `sizeof`\
  \ 操作符来确定任何数据类型的大小。）因此要归档一个 `short int`，先将其存储在 `int` 中，然后使用 `encodeIntForKey:` 进行归档。反转过程以获取：使用\
  \ `decodeIntForKey:` 然后将其赋值给你的 `short int` 变量。\n\n### 使用 `NSData` 创建自定义归档\n\n你可能不想像之前的示例程序那样，使用\
  \ `archiveRootObject:ToFile:` 方法直接将对象写入文件。例如，你可能想收集你的部分或全部对象并将它们存储在单个归档文件中。你可以在\
  \ Objective-C 中使用名为 `NSData` 的数据对象类来实现此，我们在第 16 章“处理文件”中简要访问过它。\n\n如第 16 章所述，`NSData`\
  \ 对象可以用于预留内存区域，你可以在其中存储数据。该数据区域的典型用途可能是为随后写入文件的数据提供临时存储，或者持有从磁盘读取的文件内容。创建可变数据区域简单的方法是使用\
  \ `data` 方法：\n\n```objective\ndataArea = [NSMutableData data];\n```\n\n这创建了一个空缓冲区空间，其大小会随着程序的执行根据需要进行扩展。\n\
  \n作为一个简单的示例，假设你想在同一个文件中归档你的通讯录和一个 `Foo` 对象。在本例中，假设你已经为 `AddressBook` 和 `AddressCard`\
  \ 类添加了键归档方法（参见程序 19.9）。\n\n### 程序 19.9\n\n```objective\n#import \"AddressBook.h\"\
  \n#import \"Foo.h\"\n\nint main (int argc, char *argv[])\n{\n    NSAutoreleasePool\
  \ * pool = [[NSAutoreleasePool alloc] init];\n    Foo *myFoo1 = [[Foo alloc] init];\n\
  \    NSMutableData *dataArea;\n    NSKeyedArchiver *archiver;\n    AddressBook *myBook;\n\
  \    // 插入程序 19.7 中的代码以在 myBook 中\n    // 创建包含四张卡片的 Address\n    [myFoo1 setStrVal:\
  \ @\"This is the string\"];\n    [myFoo1 setIntVal: 12345];\n    [myFoo1 setFloatVal:\
  \ 98.6];\n    // 设置数据区域并将其连接到 NSKeyedArchiver\n    dataArea = [NSMutableData data];\n\
  \    archiver = [[NSKeyedArchiver alloc] initForWritingToData: dataArea];\n    //\
  \ 现在开始归档对象\n    [archiver encodeObject: myBook forKey: @\"mybook\"];\n    [archiver\
  \ encodeObject: myFoo1 forKey: @\"myFoo1\"];\n    [archiver finishEncoding];\n \
  \   // 将归档数据写入文件\n    if ([dataArea writeToFile: @\"myArchive\" atomically: YES]\
  \ == NO)\n        NSLog (@\"归档失败！\");\n    [archiver release];\n    [pool drain];\n\
  \    return 0;\n}\n```\n\n从归档文件恢复数据非常简单：你只需要反向操作。首先，你需要分配一个数据区域。接下来，你需要将归档文件读入数据区域；然后你需要创建一个\
  \ `NSKeyedUnarchiver` 对象并告诉它从指定区域反归档数据。（理解这一点很重要。）由于你必须调用反归档方法来提取并反归档你的归档对象。当你完成时，向\
  \ `NSKeyedUnarchiver` 对象发送 `finishDecoding` 消息。\n\n在分配 `NSKeyedUnarchiver` 对象后，向它发送\
  \ `initReadingWithData:` 消息以指定反归档数据的区域；这是你之前创建的 `dataArea`。现在反归档对象。你可以使用 `decodeObjectForKey:`\
  \ 处理这些归档对象，因为你之前为 `AddressBook`、`AddressCard` 和 `Foo` 实现了编码和解码方法。当你完成归档你的对象时，向 `archiver`\
  \ 发送 `finishEncoding` 消息。你预留的 `dataArea` 现在包含了归档对象，你可以将其写入文件。表达式 `dataArea writeToFile:\
  \ @\"myArchive\" atomically: YES` 向你的数据流发送 `writeToFile:atomically:` 消息以将其写入指定的文件。正如你从\
  \ `if` 语句所示，`writeToFile:atomically:` 方法返回一个 `BOOL` 值：操作成功返回 `YES`，失败则返回 `NO`（可能是指定的路径不存在或磁盘已满）。这些操作都在程序\
  \ 19.10 中完成。\n\n### 程序 19.10\n\n```objective\n#import \"AddressBook.h\"\n#import\
  \ \"Foo.h\"\n\nint main (int argc, char *argv[])\n{\n    NSAutoreleasePool * pool\
  \ = [[NSAutoreleasePool alloc] init];\n    NSData *dataArea;\n    NSKeyedUnarchiver\
  \ *unarchiver;\n    Foo *myFoo1;\n    AddressBook *myBook;\n    // 读入归档并为其连接\n \
  \   // NSKeyedUnarchiver 对象\n    dataArea = [NSData dataWithContentsOfFile: @\"\
  myArchive\"];\n    if (! dataArea) {\n        NSLog (@\"无法读取归档文件！\");\n        return\
  \ 1;\n    }\n    unarchiver = [[NSKeyedUnarchiver alloc] initForReadingWithData:\
  \ dataArea];\n    // 解码我们之前存储在归档中的对象\n    myBook = [unarchiver decodeObjectForKey:\
  \ @\"myaddrbook\"];\n    myFoo1 = [unarchiver decodeObjectForKey: @\"myfoo1\"];\n\
  \    [unarchiver finishDecoding];\n    [unarchiver release];\n    // 验证恢复是否成功\n\
  \    [myBook list];\n    NSLog (@\"%@\\n%i\\n%g\", [myFoo1 strVal], [myFoo1 intVal],\
  \ [myFoo1 floatVal]);\n    [pool release];\n    return 0;\n}\n```\n\n\n\n\n\n```c\n\
  return 0;\n\n}\n```\n\n***\n\n# 程序 19.10. 输出\n\n***\n\n```\n======== Contents of:\
  \ Steve's Address Book =========\nJamie Baker jbaker@hitmail.com\nJulia Kochan jewls337@axlc.com\n\
  Stephen Kochan steve@steve_kochan.com\nTony Iannino tony.iannino@techfitness.com\n\
  ===================================================\nThis is the string\n12345\n\
  98.6\n```\n\n***\n\n输出验证了地址簿和你的 `Foo` 对象已成功从归档文件中恢复。\n\n## 使用归档器（Archiver）拷贝对象\n\
  \n在程序 18.2 中，你尝试对一个包含可变字符串元素的数组进行复制，并看到了数组是如何进行浅拷贝的。也就是说，字符串本身并没有被复制——仅复制了它们的引用。\n\
  \n你可以使用 `Foundation` 的归档功能创建对象的深拷贝。例如，程序 19.11 通过将 `dataArray` 归档到缓冲区然后反归档，并将结果赋值给\
  \ `dataArray2`，从而完成 `dataArray` 的拷贝。此过程不需要使用文件；归档和反归档过程完全可以在内存中进行。\n\n### 程序 19.11\n\
  \n***\n\n```objc\n#import <Foundation/Foundation.h>\n\nint main (int argc, char\
  \ *argv[])\n{\n    NSAutoreleasePool *pool = [[NSAutoreleasePool alloc] init];\n\
  \    NSData        *data;\n    NSMutableArray  *dataArray = [NSMutableArray arrayWithObjects:\n\
  \        [NSMutableString stringWithString: @\"one\"],\n        [NSMutableString\
  \ stringWithString: @\"two\"],\n        [NSMutableString stringWithString: @\"three\"\
  ],\n        nil\n    ];\n    NSMutableArray  *dataArray2;\n    NSMutableString *mStr;\n\
  \    // 使用归档器进行深拷贝\n    data = [NSKeyedArchiver archivedDataWithRootObject: dataArray];\n\
  \    dataArray2 = [NSKeyedUnarchiver unarchiveObjectWithData: data];\n    mStr =\
  \ [dataArray2 objectAtIndex: 0];\n    [mStr appendString: @\"ONE\"];\n    NSLog\
  \ (@\"dataArray: \");\n    for ( NSString *elem in dataArray )\n      NSLog (@\"\
  %@\", elem);\n    NSLog (@\"\\ndataArray2: \");\n    for ( NSString *elem in dataArray2\
  \ )\n      NSLog (@\"%@\", elem);\n    [pool drain];\n    return 0;\n}\n```\n\n\
  ***\n\n### 程序 19.11. 输出\n\n***\n\n```\ndataArray:\none\ntwo\nthree\ndataArray2:\n\
  oneONE\ntwo\nthree\n```\n\n***\n\n输出验证了修改 `dataArray2` 的第一个元素对 `dataArray` 的第一个元素没有影响。这是因为通过归档/反归档过程创建了字符串的新副本。\n\
  \n程序 19.11 中的拷贝操作是通过以下两行代码实现的：\n\n```objc\ndata = [NSKeyedArchiver archivedDataWithRootObject:\
  \ dataArray];\ndataArray2 = [NSKeyedUnarchiver unarchiveObjectWithData: data];\n\
  ```\n\n你甚至可以避免中间赋值，通过一条语句完成拷贝，如下所示：\n\n```objc\ndataArray2 = [NSKeyedUnarchiver\
  \ unarchiveObjectWithData:\n                [NSKeyedArchiver archivedDataWithRootObject:\
  \ dataArray]];\n```\n\n当你下次需要对一个对象或不支持 `NSCopying` 协议的对象进行深拷贝时，这种技术可能让你记住。\n\n##\
  \ 练习题\n\n**1.** 在第 15 章中，程序 15.7 生成了一个质数表。修改该程序，将生成的数组以 XML 属性列表的形式写入文件 `primes.pl`。然后检查该文件的内容。\n\
  \n**2.** 编写一个程序读取在练习 1 中创建的 XML 属性列表，并将值存储在数组对象中。显示数组的所有元素。\n\n**3.** 输出验证了修改 `dataArray2`\
  \ 的第一个元素对 `dataArray` 的第一个元素没有影响。这是因为通过归档/反归档过程创建了字符串的新副本。\n\n**4.** 程序 19.11 中的拷贝操作是通过以下两行代码实现的：\n\
  ```objc\ndata = [NSKeyedArchiver archivedDataWithRootObject: dataArray];\ndataArray2\
  \ = [NSKeyedUnarchiver unarchiveObjectWithData: data];\n```\n\n**5.** 你甚至可以避免中间赋值，通过一条语句完成拷贝，如下所示：\n\
  ```objc\ndataArray2 = [NSKeyedUnarchiver unarchiveObjectWithData:\n            \
  \    [NSKeyedArchiver archivedDataWithRootObject: dataArray]];\n```\n\n**6.** 当你下次需要对一个对象或不支持\
  \ `NSCopying` 协议的对象进行深拷贝时，这种技术可能让你记住。\n\n# 第三部分 Cocoa, Cocoa Touch 和 iOS\n\n## 第\
  \ 20 章 Cocoa 和 Cocoa Touch 简介\n\n在本书中，`Foundation`、`Cocoa` 和 `Cocoa Touch` 是关键框架。`Foundation`\
  \ 提供了基础数据类型，如 `NSString`, `NSArray`。`Cocoa` 扩展了 `Foundation` 并增加了用户界面功能。`Cocoa Touch`\
  \ 将这些框架适配触摸设备。\n\n### 框架层\n\n通常使用图表来阐明应用程序与底层硬件之间的分层。一种表示方法如图 20.1 所示。\n\n**图 20.1\
  \ 应用程序分层**\n\n![image](img/20fig1.jpg)\n\n`kernel` 以设备驱动程序的形式提供底层的硬件通信。它管理系统资源，包括调度执行、内存管理和\
  \ I/O 操作。\n\n顾如其名，`Core Services` 提供比上方层更底层（核心）的支持。例如，在这里你可以找到对集合、网络、调试、文件管理、内存管理、线程、时间和电源的支持\n\
  \n`Application Services` 层包含了打印和图形支持，包括 Quartz、OpenGL 和 QuickTime。\n\n应用程序正下方是 `Cocoa`\
  \ 层。正如`Cocoa` 包含了 `Foundation`、`Core Data` 和 `AppKit`。`Foundation` 提供了处理集合、字符串、内存管理、文件系统、归档等的类。`AppKit`\
  \ 提供管理视图、窗口、文档以及 Mac 所名的丰富用户界面的类。\n\n从这些描述来看，层之间存在功能重叠。集合在 `Cocoa` 和 `Core Services`\
  \ 中都存在。然而，前者构建后者的支持之上。此外，在某些情况下，层可以被跳过或“桥接”。例如，某些 `Foundation` 类（处理文件系统的类）直接依赖于\
  \ `Core Services` 层的功能，因此跳过了 `Application Services` 层。在许多情况下，`Foundation` 框架定义了底层\
  \ `Core Services` 层中数据结构（后者主要用过程化的 C 语言编写）的对象映射。\n\n### Cocoa Touch\n\niPhone、iPod\
  \ Touch 和 iPad 等 iOS 设备包含一台运行简化版 Mac OS X 的计算机。iPhone 硬件中的某些功能（如加速度计）是手机特有的，并未出现在其他\
  \ Mac OS X 计算机（如 MacBook Pro 或 iMac）上。\n\n***\n\n### 注意\n\n实际上，Mac 笔记本电脑包含加速度计，以便电脑掉落时保护硬盘；但你无法从程序中直接访问此加速度计。\n\
  \n`Cocoa` 框架是为 Mac OS X 桌面和笔记本电脑的应用开发设计的，而 `Cocoa Touch` 框架则用于 iOS 设备。\n\n\n\n\n\
  \nCocoa 和 Cocoa Touch 共同拥有 `Foundation` 和 `Core Data` 框架。然而，在 Cocoa Touch 中，`UIKit`\
  \ 替换了 `AppKit` 框架，为许多相同类型的对象提供了支持，例如窗口、视图、按钮、文本字段等。此外，Cocoa Touch 提供了用于加速度计、陀螺仪、通过\
  \ GPS 和 WiFi 信号进行位置三角测量以及触摸驱动界面的类，并消除了不需要的类。\n\n对 Cocoa 和 Cocoa Touch 的简要概述到此。在下一章中，你将学习如何使用\
  \ `iOS SDK` 部分的模拟器为 iPhone 编写应用程序。\n\n# 第 21 章 编写 iOS 应用程序\n\n在本章中，你将开发两个简单的 iPhone\
  \ 应用程序。第一个将介绍一些基本概念，帮助你熟悉使用 Interface Builder、建立连接，并理解 `delegates`（代理）、`outlets`（输出接字）和\
  \ `actions`（动作）。对于第二个 iPhone 应用程序，你将构建一个分数计算器。它结合了你在开发第一个应用程序时学到的知识以及在本书其余部分中学到的知识。你在这里学到的原理同样适用于为其他\
  \ iOS 设备开发应用程序。\n\n### iOS SDK\n\n要编写 iPhone 应用程序，你必须安装 `Xcode` 和 `iOS SDK`。该 SDK\
  \ 可以从 Apple 网站免费获得。要下载 SDK，你首先需要注册成为 Apple 开发者。该过程也是免费的。要获取合适的链接，你可以从 [developer.apple.com](http://developer.apple.com)\
  \ 开始并导航到相应位置。熟悉该网站是一个很好的主意。\n\n本章的讨论基于 `Xcode 4` 和针对 iPhone OS 4.3 的 `iOS SDK`。这两者的任何较后版本都应该与这里描述的内容兼容。如果你发现你的屏幕与所示内容不同，可能是因为你使用的是不同版本的\
  \ `Xcode`。在这种情况下，请访问 [classroomM.com/objective-c](http://classroomM.com/objective-c)\
  \ 论坛获取最新信息。\n\n### 你的第一个 iPhone 应用程序\n\n第一个应用程序展示了如何在 iPhone 屏幕上放置一个黑色窗口，允许用户按下按钮，然后根据按钮的按下情况显示一些文本。\n\
  \n***\n\n### 注意\n\n第二个应用程序更有趣！你将从第一个应用程序中获得的知识来构建一个可以进行分数运算的简单计算器。你可以使用书中之前处理过的\
  \ `Fraction` 类，以及一个修改过的 `Calculator` 类。这一次，你的计算器需要知道如何处理分数。\n\n***\n\n让我们直接进入第一个程序。本章采用的教学方法不是涵盖所有细节；正如所提到的，这里没有足够的空间做到这一点。相反，我们将引导你完成这些步骤，为你提供必要的基础（这并非双关语！），以便你通过另一本独立的\
  \ Cocoa 或 iOS 编程书籍自行探索和学习更多概念。\n\n图 21.1 显示了你为 iPhone 开发的第一个应用程序，运行在 iPhone 模拟器（稍后详细介绍）。\n\
  \n**图 21.1. 第一个 iPhone 应用程序。**\n\n![image](img/21fig01.jpg)\n\n该应用程序的设计是，当你按下标记为“1”的按钮时，相应的数字会出现在显示器上（参见\
  \ 图 21.2）。它仅如此！这个简单的应用程序为第二个分数计算器应用程序奠定了基础。\n\n**图 21.2. iPhone 应用程序结果。**\n\n![image](img/21fig02.jpg)\n\
  \n到本书的这里，如果你一直使用 `Xcode` 输入并测试程序，那么你应该已经非常熟悉使用它了。这一次，我们还将使用 `Xcode` 的一项功能，它允许你通过在类似于\
  \ iPhone 屏幕的窗口中放置表格、标签和按钮等 UI 元素来设计用户界面。像任何强大的开发工具一样，这个功能需要一些时间。\n\n***\n\n### 注意\n\
  \n在 `Xcode 4` 发布之前，UI 是使用一个名为 `Interface Builder` 的独立应用程序设计的。\n\n***\n\nApple 将\
  \ iPhone 模拟器作为 `iOS SDK` 的一部分发布。模拟器复制了你的大部分 iPhone 环境，包括主屏幕、Safari 网页浏览器、联系人应用等。模拟器让调试你的应用程序变得容易得多；你不需要将应用程序的每个迭代版本下载到真实的\
  \ iPhone 设备上然后在那里进行调试。这可以节省你大量的精力和时间。要在 iPhone 设备上运行应用程序，你需要注册 iPhone 开发者计划并向 Apple\
  \ 支付 99 美元的费用（截至本文编写时）。反之，你将收到一个激活码，它将允许你获取 iPhone 开发证书，以便在你的 iPhone 上测试和安装应用程序。遗憾的是，如果不经过这个过程，你甚至无法为自己的\
  \ iPhone 开发应用程序。请注意，我们在本章开发的应用程序将在 iPhone 模拟器上加载和测试，而不是在 iPhone 设备上。\n\n### 创建新的\
  \ iPhone 应用程序项目\n\n让我们回到开发第一个应用程序。安装 `iOS SDK` 后，启动 `Xcode` 应用程序。选择 `File`、`New`，然后\
  \ `New Project...`。在 iOS 下（如果你在左侧栏没有看到它，说明你没有安装 `iOS SDK`），点击 `Application`。你应该能看到一个窗口，如\
  \ 图 21.3 所示。\n\n**图 21.3. 创建新的 iOS 项目。**\n\n![image](img/21fig03.jpg)\n\n在这里你可以看到提供不同类型应用的模板，如\
  \ 表 21.1 所示。\n\n**表 21.1. iPhone 模板**\n\n![image](img/21tab01.jpg)\n\n回到项目界面，在右侧选择\
  \ `Window-based`，然后点击 `Next` 按钮。在 `Product Name` 中输入 `iPhone_1`，在 `Company Identifier`\
  \ 中任意填写，将 `Device Family` 设置为 `iPhone`，取消勾选 `Use Core Data` 和 `Include Tests`。你的屏幕应该像\
  \ 图 21.4。\n\n**图 21.4. 选择项目选项。**\n\n![image](img/21fig04.jpg)\n\n点击 `Next` 并保持出现的\
  \ `Save As` 字段不变。你可以指定创建新项目的地方，无需担心 `Source Control` 框是否勾选。你的屏幕现在应该像 图 21.5。\n\n\
  **图 21.5. 指定存储位置。**\n\n![image](img/21fig05.jpg)\n\n现在点击 `Save`。正如你之前用 `Xcode` 创建的项目一样，现在将为你创建一个项目，其中包含了你将使用的模板。如\
  \ 图 21.6 所示，其中 `iPhone_1` 文件夹显示了三个文件：`iPhone_1AppDelegate.h`、`iPhone_1AppDelegate.m`\
  \ 和 `MainWindow.xib`。最右侧的面板包含了应用程序支持的方向以及应用程序图标。我们将忽略这个面板。\n\n**图 21.6. 创建了 iOS\
  \ 项目 iPhone_1。**\n\n![image](img/21fig06.jpg)\n\n根据你的设置和之前对 `Xcode` 的使用，你的窗口可能与\
  \ 图 21.6 所示的不完全相同。你可以根据你当前的布局操作，或者尝试让它更接近图片。\n\n在 `Xcode` 窗口的左上角，你会看到一个标记为 `Scheme`\
  \ 的下拉菜单。因为我们不是开发直接在 iPhone 上运行的应用程序，所以你希望 SDK 设置为与 iPhone 模拟器运行。在 `Scheme` 下拉菜单中选择\
  \ iPhone 模拟器，如 图 21.7 所示。\n\n**图 21.7. 选择 iPhone 模拟器。**\n\n![image](img/21fig07.jpg)\n\
  \n\n\n\n现在我们可以开始修改一些项目文件了。请注意，系统为你创建了名为 `project-name`AppDelegate.h` 和 `project-name`AppDelegate.m`\
  \ 的类，在示例中 `project-name` 是 `iPhone_1`。你创建的每一个新 iOS 应用程序都会创建一个应用程序代理子类。通常情况下，该类中包含了控制应用程序执行的方法。这包括在应用程序启动时、进入和离开后台时、系统通知它内存使用过多以及终止时等要执行的操作。我们还将让它负责处理按下标记为“1.\\\
  .”的按钮的事件。在这里，我们将定义一个方法来响应该 `action` 在 iPhone 窗口中发生（在我们的示例中，即点击按钮）时的回动作。你很快就会看到如何将该事件与特定方法的执行连接起来。\n\
  \n你的对象还可以拥有实例变量，其值对应于 iPhone 窗口中的某些控件，例如标签上的名称或在可编辑文本框中显示的文本。这些变量被称为 `outlets`（输出），你将看到如何将实例变量连接到\
  \ iPhone 窗口中的实际控件。\n\n对于我们的第一个应用程序，我们需要一个方法来响应按下标记为 1.\\. 按钮的动作。我们还需要一个输出变量，其中包含（以及其他信息）要在\
  \ iPhone 窗口顶部创建的标签中显示的文本。\n\n编辑文件 `iPhone_1AppDelegate.h` 以添加一个名为 `display` 的新 `UILabel`\
  \ 属性，并声明一个名为 `click1` 的动作方法以响应按钮按下。你的接口文件应该像程序 21.1 所示。（文件头部自动插入的注释行在此处未显示。）\n\n\
  **程序 21.1. `iPhone_1AppDelegate.h`**\n\n```\n#import <UIKit/UIKit.h>\n\n@interface\
  \ iPhone_1AppDelegate : NSObject <UIApplicationDelegate> {\n\n@private\n\n}\n\n\
  @property (nonatomic, retain) IBOutlet UIWindow *window;\n\n@property (nonatomic,\
  \ retain) IBOutlet UILabel  *display;\n\n-(IBAction) click1;\n\n@end\n```\n\n注意，iPhone\
  \ 应用程序导入了头文件 `<UIKit/UIKit.h>`。该头文件又导入了其他的 UIKit 头文件，就像 `Foundation.h` 头文件导入了你需要的其他头文件（如\
  \ `NSString.h` 和 `NSObject.h`）一样。\n\n`iPhone_1AppDelegate` 类有两个属性。第一个是名为 `window`\
  \ 的 `UIWindow` 对象。该属性在你创建项目时自动创建，并引用 iPhone 的主窗口。\n\n### 注意\n\nXCode 没有将 `window`\
  \ 列为大括号内部的实例变量（正如我们在本文中所做的那样）。事实上，你从实现部分可以看到该属性与一个名为 `_window` 的实例变量相关。因此，你的应用代理类将有一个名为\
  \ `_window` 的实例变量以及一个关联的属性 `window`。`@private` 指令确保其他类（包括子类）定义的方法无法通过名称直接访问实例变量。访问实例变量的优方法是通过访问器。Xcode\
  \ 生成模板代码来鼓励这样做。\n\n你又添加了属于 `UILabel`类的属性 `display`。这是一个连接到标签的输出属性。当你设置此属性的文本字段时，它会更新窗口中对应标签的文本。为\
  \ `UILabel` 类定义的其他方法允许你设置和检索标签的其他属性，例如颜色、行数字体大小。\n\n随着你学习更多 iPhone 编程知识，你可能想在接口中使用其他类，我们在这里不会进行描述。其中一些名称可以提示它们的用途：`UITextField,\
  \ UIFont, UIView, UITableView, UIImageView, UIImage, UISlider` 和 `UIButton`。\n\n\
  `window` 和 `display` 属性都是输出（outlets），在属性声明中，请注意 `IBOutlet` 标识符的使用。在 UIKit 头文件 `UINibDeclarations.h`\
  \ 中，`IBOutlet` 实际上被定义为空（也就是说，预处理器在源文件中将其字面量替换为空空内容）。然而，它是必要的，因为 Xcode 在读取你的头文件时会寻找\
  \ `IBOutlets`，以确定你的哪些变量可以作为输出，并连接到接口中相应的 UI 元素。\n\n`click1` 方法定义为返回 `IBAction` 类型的值（这在\
  \ `UINibDeclarations.h` 头文件中定义为 `void`）。与 `IBOutlet` 类似，Xcode 在检查头文件时使用此标识符来识别可以作为动作的方法。\n\
  \n现在是时候修改你类对应的 `iPhone_1AppDelegate.m` 实现文件了。在这里，你将为 `display` 属性合成访问器方法（`window`\
  \ 的访问方法已经为你合成），并添加 `click1` 方法的定义。\n\n### 注意\n\n在进行任何更改之前，请查看 XCode 插入的 `@synthesize`\
  \ 指令：\n\n```\n@synthesize window=_window;\n```\n\n正如早前的注释提到的，这将实例变量 `_window` 与接口部分定义的属性\
  \ `window` 关联起来。这样做的目的是鼓励通过合成的访问方法进行访问，而不是直接通过实例变量访问。\n\n现在编辑你的实现文件，使其类似于程序 21.1\
  \ 中的文件。\n\n**程序 21.1. `iPhone_1AppDelegate.m`**\n\n```\n#import \"iPhone_1AppDelegate.h\"\
  \n\n@implementation iPhone_1AppDelegate\n\n@synthesize window=_window, display;\n\
  \n- (BOOL)application:(UIApplication *)application didFinishLaunching:(NSDictionary\
  \ *)launchOptions\n{\n    // 应用程序启动后的自定义点\n    [self.window makeAndVisible];\n \
  \   return YES;\n}\n\n-(IBAction) click1\n\n{\n    display.text = @\"1\";\n}\n\n\
  - (void) dealloc {\n    [_window release];\n    [display release];\n    [super dealloc];\n\
  }\n```\n\n`applicationDidFinishLaunching:` 方法由 iPhone 运行时自动调用一次，正如其名称所示，你的应用程序已启动。这是你可以实例化变量、在屏幕上绘制内容并让窗口可见的地方。最后的操作通过向你的窗口发送\
  \ `makeAndVisible` 消息完成。\n\n`click1` 方法通过设置 `UILabel` 的 `text` 属性将输出变量 `display`\
  \ 设置为字符串“1”。在你将按下连接到该方法的调用后，它就可以执行预期的动作。为了建立这种连接，你现在必须学习如何使用置 内的界面设计工具。\n\n### 设计界面\n\
  \n在图 21.4 以及你的 Xcode 主窗口中，注意一个名为 `MainWindow.xib` 的文件。`xib` 文件包含程序用户界面的信息，包括窗口、按钮、标签、标签栏、文本框等的信息。当然你还没有用户界面！那是下一步。\n\
  \n从左侧面板选择 `MainWindow.xib` 文件。这会导致界面设计工具出现，如图 21.8 所示。右侧面板显示 iPhone 的主窗口，默认情况下它是空的且背景为白色。\n\
  \n从 View（视图）菜单，选择 Utilities（工具）、Attributes Inspector（属性检查器），接着选择 Utilities（工具）、Object\
  \ Library（对象库）。你的窗口应该像图 21.9 所示以一种显示格式出现。\n\n**图 21.8. 用户界面设计面板。**\n\n![image](img/21fig08.jpg)\n\
  \n\n\n\n## 图 21.9. Interface Builder MainWindow.xib。\n\n![image](img/21fig09.jpg)\n\
  \n(如果你想尝试让你的屏幕与该图匹配，请查看编辑器和工具栏中选中的各种选项。此图显示了位于右上角面板的属性检查器（Attributes Inspector）以及位于右下角处于图标视图模式下的对象库（Object\
  \ Library）。)\n\n我们将做的第一件事是将 iPhone 窗口设置为黑色。要做到这一点，首先点击中间面板格中的 iPhone 窗口内部。\n\n如果你向下查看检查器面板的视图（View）部分，你会看到一个标记为\
  \ `Background`（背景）的属性。如果你点击 `Background` 旁边白色填充的矩形内部，会弹出颜色选项供你选择。选择 `Black Color`（黑色），这会将检查器中\
  \ `Background` 属性旁边的矩形从白色变为黑色。\n\n如果你查看中间面板格（它代表 iPhone 窗口），你会发现它已经变成了黑色，如图 21.10\
  \ 所示。\n\n## 图 21.10. iPhone 窗口变为黑色。\n\n![image](img/21fig10.jpg)\n\n你可以通过从对象库面板拖入对象到\
  \ iPhone 窗口，在你的 iPhone 界面窗口中创建新对象。现在拖入一个 `Label`（标签）。当标签靠近窗口左侧靠近顶部时松开鼠标，如图 21.11\
  \ 所示。\n\n## 图 21.11. 添加标签。\n\n![image](img/21fig11.jpg)\n\n当你在窗口内移动标签时，会出现蓝色的引导线。有时，这些引导线会帮助你将对象与窗口中之前放置的其他对象对齐。在其他时候，它们出现是为了确保你的对象与其他对象以及窗口边缘之间的间距足够大，以符合\
  \ Apple 的界面指南。\n\n在未来的任何时候，你都可以选中标签并将其拖到窗口内的另一个位置来在窗口中重新定位标签。\n\n现在让我们为这个标签设置一些属性。在你的\
  \ iPhone 窗口中，如果它目前没有被选中，请点击你刚刚创建的标签以选中它。注意，检查器面板提供了有关你窗口中当前选中对象的信息。我们不希望此标签默认显示任何文本，因此将\
  \ `Text` 值更改为空字符串。（也就是说，从检查器面板中显示的文本框中删除字符串 `Label`。）\n\n对于 `Alignment`（对齐）属性，选择右对齐图标。最后，将标签的背景颜色更改为蓝色（或你选择的任何颜色），就像你之前将窗口背景颜色更改为黑色一样。\n\
  \n现在让我们更改标签的大小。回到 `Window`，简单地通过拉动它的角和侧边来调整标签的大小。调整并重新定位标签，使其看起来像图 21.12 所示所示。\n\
  \n## 图 21.12. 更改标签的属性和大小。\n\n![image](img/21fig12.jpg)\n\n现在我们将向界面添加一个按钮。从对象库面板拖入一个\
  \ `Rounded Rect Button`（圆矩形按钮）对象到你的界面窗口中，将其放置在窗口的左下角，如图 21.12 所示（注意此图显示对象库窗口已从图标视图切换到列表视图）。你可以通过两种方式之一更改按钮上的标签：双击按钮然后输入你的文本，或者通过设置检查器面板中的\
  \ `Title`（标题）字段。无论你选择哪种方式，请让你的窗口与图 21.13 所示的窗口匹配。\n\n## 图 21.13. 向界面添加按钮。\n\n![image](img/21fig13.jpg)\n\
  \n现在我们有一个标签，我们想将其连接到程序中的 `display` 实例变量，这样当我们在程序中设置该变量时，标签的文本就会发生变化。\n\n我们还有一个标记为\
  \ `1` 的按钮，我们希望在它每次被按下时都去调用我们的 `click1()` 方法。该方法将 `display` 文本字段的值设置为 `1`。由于该变量将连接到标签，标签随后就会更新。回顾一下，这是我们想要设置的序列：\n\
  \n1. 用户按下标记为 1 的按钮。\n2. 此事件导致 `click1()` 方法被执行。\n3. `click1()` 方法将实例变量 `display`\
  \ 的文本属性更改为字符串 1。\n4. 因为 `UILabel` 对象 `display` 连接到 iPhone 窗口中的标签，此标签更新为相应的文本值，或值\
  \ 1。\n\n为了让此序列工作，我们只需要建立这两个连接。有几种方法可以实现，这里我们只描述一种方法。\n\n首先，让我们在第三个面板格中显示源代码。要做到这一点，首先选择\
  \ `View`（视图）、`Utilities`（工具）、`Hide Utilities`（隐藏工具）。接下来，选择 `View`（视图）、 `Editor`（编辑器）、`Assistant`（助手）。希望你的\
  \ Xcode 窗口将接近图 21.14 所示。\n\n## 图 21.14. 在界面旁边显示源代码。\n\n![image](img/21fig14.jpg)\n\
  \n首先，让我们把按钮连接到 `click1()` 方法。要做到这一点，只需按住 `Control` 键并点击按钮，将出现的蓝线拖动到界面文件中定义的 `click1()`\
  \ 方法。这如图 21.15 所示。\n\n## 图 21.15. 为按钮添加动作。\n\n![image](img/21fig15.jpg)\n\n现在，让我们将\
  \ `display` 变量连接到标签。选中 iPhone 窗口中的标签，按住 `Control` 键并将出现的蓝线拖动到界面中的 `display` 属性声明。这如图\
  \ 21.16 所示。\n\n## 图 21.16. 连接输出变量。\n\n![image](img/21fig16.jpg)\n\n当你松开鼠标时，连接就建立了。\n\
  \n这就完成了！从 `Product`（产品）菜单或工具栏选择 `Run`（运行）。如果一切顺利，程序将成功构建并开始执行。执行开始后，程序将加载到模拟器，它将出现在你的电脑上。模拟器应该如图\
  \ 21.1 所示。你可以通过点击模拟器来模拟按下按钮。我们概述的序列将在显示顶部显示 1。\n\n### iPhone 分数器\n\n下一个示例稍微复杂一些，但上一个示例的概念同样适用。我们不会展示创建此示例的所有步骤，而是给出步骤的总结以及设计方法的概述。当然，我们还会显示所有的代码。\n\
  \n首先，让我们看看应用程序是如何工作的。图 21.17 显示了应用程序启动后在模拟器中的样子。\n\n## 图 21.17. 启动后的分数器。\n\n![image](img/21fig17.jpg)\n\
  \n该计算器程序允许你通过先输入分子、按下标记为 `Over` 的键，然后输入分母来输入分数。因此，要输入分数 2/5，你需要按下 2，然后是 Over，最后是\
  \ 5。你会与其他计算器不同，它实际上在显示中显示分数，因此 2/5 显示为 2/5。\n\n输入一个分数后，通过按下相应的标记键 `+`、`−`、`×` 或\
  \ `÷` 来选择操作——加法、减法、乘法或除法。\n\n输入第二个分数后，通过按下 `=` 键来完成操作，就像使用标准计算器一样。\n\n### 注意\n\n\
  此计算器设计用于仅执行两个分数之间的单一操作。我们在本章末尾留了一个练习，供你移除此限制。\n\n\n\n\n显示器随着按键的按下持续更新。图 21.18 显示了输入分数\
  \ 4/6 并按下乘法键后的显示情况。\n\n**图 21.18。输入操作。**\n\n![image](img/21fig18.jpg)\n\n图 21.19\
  \ 显示 4/6 和 2/8 相乘的结果。你会注意到 1/6 的结果已经进行了约分。\n\n**图 21.19。两个分数相乘。**\n\n![image](img/21fig19.jpg)\n\
  \n## 创建 Fraction_Calculator 项目\n\n第一个 iPhone 程序是基于模板启动的。在这里，你直接在应用程序控制器（`AppDelegate`\
  \ 类）中进行（最小）UI 工作。这不是开发富 UI 程序的推荐方法。`AppDelegate` 类通常处理与应用程序状态的变化，例如应用程序启动或被停用时。\n\
  \n视图控制器（用 `UIViewController` 类实现）是你执行与 UI 相关的操作的地方。这可能是显示文本、响应按钮按下，或在 iPhone 屏幕上放置全新的视图。\n\
  \n对于第二个示例，你将通过创建一个新项目开始。这一次，在新建窗口中选择 View-based Application。将你的新项目命名为 `Fraction_Calculator`。\n\
  \n当你创建项目时，这一次 Xcode 会为你定义两个类。`FractionAppDelegate.h` 和 `FractionAppDelegate.m` 定义了应用程序控制器，而\
  \ `FractionViewController.h` 和 `FractionViewController.m` 定义了视图控制器。正如提到的，你将在最后一个类中执行所有的工作。\n\
  \n我们将从应用程序控制器开始。它包含两个实例变量：一个引用 iPhone 的窗口，另一个用于视图控制器。这些都由 Xcode 为你设置。事实上，你不需要对应用程序控制器的\
  \ `.h` 或 `.m` 文件进行任何更改。\n\n`FractionAppDelegate` 的接口文件如程序 21.2。\n\n**程序 21.2. FractionAppDelegate.h\
  \ 接口文件**\n\n```objc\n#import <UIKit/UIKit.h>\n\n@class Fraction_ViewController;\n\
  \n@interface Fraction_AppDelegate : NSObject\n\n    <UIApplicationDelegate> {\n\
  }\n\n@property (nonatomic, retain) IBOutlet UIWindow *window;\n\n@property (nonatomic,\
  \ retain) IBOutlet\n      Fraction_ViewController *viewController;\n\n@end\n```\n\
  \n`UIWindow` 实例变量 `window` 的作用与第一个示例相同：它代表 iPhone 的窗口。`Fraction_ViewController`\
  \ 实例变量代表管理用户交互以及显示内容的控制器。在该类的实现文件中，你将处理与这些任务相关的工作。\n\n程序 21.2 显示应用程序控制器的实现文件，去除了这里没有显示的存根方法。正如提到的，我们没有像程序\
  \ 21.1 那样在该文件中执行任何工作。因此该文件保持了创建新项目时 Xcode 生成的原样目。\n\n**程序 21.2. FractionAppDelegate.m\
  \ 实现文件**\n\n```objc\n#import \"FractionAppDelegate.h\"\n\n#import \"FractionViewController.h\"\
  \n\n@implementation Fraction_AppDelegate\n\n@synthesize window=_window\n\n@synthesize\
  \ viewController=_viewController\n\n- (BOOL)applicationDidFinishLaunching:(UIApplication\
  \ *)application\n        didFinishLaunchingWithOptions:(NSDictionary *)launchOptions{\n\
  \n    // 应用程序启动后的自定义点\n    self.window.rootViewController = self.viewController;\n\
  \    [self.window makeKeyAndVisible];\n    return YES;\n}\n\n- (void)dealloc {\n\
  \    [_window release];\n    [_viewController release];\n    [super dealloc];\n\
  }\n\n@end\n```\n\n## 定义视图控制器\n\n现在为视图控制器类 `FractionViewController` 编写代码。我们将从接口文件开始。如程序\
  \ 21.2 所示。\n\n**程序 21.2. FractionViewController.h 接口文件**\n\n```objc\n#import <UIKit/UIKit.h>\n\
  \n#import \"Calculator.h\"\n\n@interface Fraction_ViewController : UIViewController\
  \ {\n\n    UILabel         display;\n    char            op;\n    int          \
  \   currentNumber;\n    NSMutableString *displayString;\n    BOOL            firstOperand,\
  \ isNumerator;\n    Calculator      myCalculator;\n}\n@property (nonatomic, retain)\
  \ IBOutlet *display;\n@property (nonatomic, retain) NSMutableString *displayString;\n\
  -(void) processDigit:(int) digit;\n-(void) processOp:(char) theOp;\n-(void) storeFracPart;\n\
  // 数字键\n-(IBAction) clickDigit:(UIButton *) sender;\n// 算术键\n-(IBAction) clickPlus;\n\
  -(IBAction) clickMinus;\n-(IBAction) clickDivide;\n// 其他键\n-(IBAction) clickEquals;\n\
  -(IBAction) clickClear;\n@end\n```\n\n有用于构建分数的变量（`currentNumber`、`firstOperand`\
  \ 和 `isNumerator`），以及用于构建显示字符串的变量（`displayString`）。还有一个对象（`Calculator`）可以执行两个分数之间的实际计算。我们将关联一个名为\
  \ `clickDigit:` 的方法来处理 0-9 任意数字的按下。该方法将接收一个指示实际按下数字的参数，你很快就会看到。最后，我们定义了处理要执行的操作的方法（`clickPlus`、`clickMinus`、`clickDivide`）、在按下\
  \ = 键时执行实际计算（`clickEquals`）、清除当前操作（`clickClear`）以及在按下 Over 键时分离分子分母（`clickOver`）。定义了几个方法（`processDigit:`、`processOp:`\
  \ 和 `storeFracPart`）来协助完成这些杂务。程序 21.2 显示该类的实现文件。\n\n**程序 21.2. FractionViewController.m\
  \ 实现文件**\n\n```objc\n#import \"FractionViewController.h\"\n\n@implementation Fraction_ViewController\n\
  \n@synthesize display,displayString;\n\n- (void)dealloc {\n    [display release];\n\
  \    [displayString release];\n    [myCalculator release];\n    [super dealloc];\n\
  }\n\n-(void)viewDidLoad {\n    // 应用程序启动后的自定义点\n    firstOperand = YES;\n    isNumerator\
  \ = YES;\n    self.displayString = [NSMutableString stringWithCapacity: 40];\n \
  \   myCalculator = [[Calculator alloc] init];\n}\n\n-(void) processDigit:(int) digit\
  \ {\n    currentNumber = currentNumber * 10 + digit;\n    [displayString appendString:[NSString\
  \ stringWithFormat: @\"%i\", digit]];\n    display.text = displayString;\n}\n\n\
  - (IBAction) clickDigit:(UIButton *) sender {\n    int digit = sender.tag;\n   \
  \ [self processDigit: digit];\n}\n\n-(void) processOp:(char) theOp {\n    NSString\
  \ *opStr;\n    op = theOp;\n    switch (theOp) {\n        case '+':\n          \
  \  opStr = @\" + \";\n            break;\n        case '-':\n            opStr =\
  \ @\" – \";\n            break;\n        case '*':\n            opStr = @\" × \"\
  ;\n            break;\n        case '/':\n            opStr = @\" ÷ \";\n      \
  \      break;\n    }\n    [self storeFracPart];\n    firstOperand = NO;\n    isNumerator\
  \ = YES;\n    [displayString appendString: opStr];\n    display.text = displayString;\n\
  }\n\n@end\n```\n\n\n\n\n```objc\nif (firstOperand) {\n    if (isNumerator) {\n \
  \       myCalculator.operand1.numerator = currentNumber;\n        myCalculator.operand1.denominator\
  \ = 1; // 例如 3 * 4/5 =\n    }\n    else\n        myCalculator.operand1.denominator\
  \ = currentNumber;\n}\nelse if (isNumerator) {\n    myCalculator.operand2.numerator\
  \ = currentNumber;\n    myCalculator.operand2.denominator = 1; // 例如 3/2 * 4 =\n\
  }\nelse {\n    myCalculator.operand2.denominator = currentNumber;\n    firstOperand\
  \ = YES;\n}\ncurrentNumber = 0;\n}\n```\n\n```objc\n-(IBAction) clickOver\n{\n \
  \   [self storeFracPart];\n    isNumerator = NO;\n    [displayString appendString:\
  \ @\"/\"];\n    display.text = displayString;\n}\n```\n\n### 算术操作键\n\n```objc\n\
  -(IBAction) clickPlus\n{\n    [self processOp: '+'];\n}\n\n-(IBAction) clickMinus\n\
  {\n    [self processOp: '-'];\n}\n\n-(IBAction) clickMultiply\n{\n    [self processOp:\
  \ '*'];\n}\n\n-(IBAction) clickDivide\n{\n    [self processOp: '/'];\n}\n```\n\n\
  ### 其他键\n\n```objc\n-(IBAction) clickEquals\n{\n    if ( firstOperand == NO ) {\n\
  \        [self storeFracPart];\n        [myCalculator performOperation: op];\n \
  \       [displayString appendString: @\" = \"];\n        [displayString appendString:\
  \ [myCalculator.accumulator\n            convertToString]];\n        display.text\
  \ = displayString;\n        currentNumber = 0;\n        isNumerator = YES;\n   \
  \     firstOperand = YES;\n        [displayString setString: @\"\"];\n    }\n}\n\
  \n-(IBAction) clickClear\n{\n    isNumerator = YES;\n    firstOperand = YES;\n \
  \   currentNumber = 0;\n    [myCalculator clear];\n    [displayString setString:\
  \ @\"\"];\n    display.text = displayString;\n}\n```\n\n@end\n\n* * *\n\n计算器的窗口仍然像之前的应用程序一样，只包含一个标签，我们仍然称之为\
  \ `display`。当用户逐位输入数字时，我们需要在过程中构建该数字。变量 `currentNumber` 存储正在处理的数字，而 `BOOL` 变量 `firstOperand`\
  \ 和 `isNumerator` 则跟踪输入的是第一个还是第二个操作数，以及用户当前正在输入该操作数的分子还是分母。\n\n当按下计算器上的数字按钮时，我们进行设置，使得某些标识信息将传递给\
  \ `clickDigit:` 方法，以识别按下的是哪一个数字按钮。这是通过在检查器面板（Inspector pane）中设置按钮的 `Tag` 属性，为每个数字按钮设置一个唯一值来实现。在这种情况下，我们希望将标记\
  \ 设置为对应的数字。因此，标签为 0 的按钮的 tag 将设置为 0，标签为 1 的按钮 tag 将设置为 1，以此类推。发送给 `clickDigit:`\
  \ 方法的 `sender` 参数是 iPhone 窗口中被点击的实际 `UIButton` 对象。通过访问该对象的 `tag` 属性，你可以获取按钮的 tag\
  \ 值。这在 `clickDigit:` 方法中的实现所示：\n\n```objc\n-(IBAction) clickDigit: (UIButton *)\
  \ sender\n{\n    int digit = sender.tag;\n    [self processDigit: digit];\n}\n```\n\
  \n按钮比第一个应用程序多得多。视图控制器的实现大部分围绕着构建分数和显示它们展开。正如所提到的，当按下 0–9 的任意一个数字按钮时，就会执行动作 `clickDigit:`。该方法调用\
  \ `processDigit:` 方法，将数字附加到变量 `currentNumber` 中正在构建的数字末尾。该方法还将将数字添加到存储在变量 `displayString`\
  \ 中的当前字符串中，并更新显示内容：\n\n```objc\n-(void) processDigit: (int) digit\n{\n    currentNumber\
  \ = currentNumber * 10 + digit;\n    [displayString appendString:[NSString format:@\"\
  %i\", digit]];\n    display.text = displayString;\n}\n```\n\n当按下 `=` 键时，会调用 `clickEquals`\
  \ 方法来执行操作。计算器执行两个分数之间的运算，并将结果存储在它的 `accumulator` 中。该 `accumulator` 在 `clickEquals`\
  \ 方法内部被获取，结果被添加到显示器中。\n\n#### 分数类\n\n`Fraction` 类与本文早期的示例相比很大程度上没有变化。新增了一个 `convertToString`\
  \ 方法，用于将分数转换为其字符串表示。`Fraction` 接口后面之后是对应的实现文件。\n\n**程序 21.2.h 接口文件**\n\n```objc\n\
  #import <UIKit/UIKit.h>\n\n@interface Fraction : NSObject {\n    int numerator;\n\
  \    int denominator;\n}\n@property numerator, denominator;\n-(void) print;\n-(void)\
  \ setTo:(int) n over:(int) d;\n-(Fraction *) add:(Fraction *) f;\n-(Fraction *)\
  \ subtract:(Fraction *) f;\n-(Fraction *) multiply:(Fraction *) f;\n-(Fraction *)\
  \ divide:(Fraction *) f;\n-(void) reduce;\n-(double) convertToNum;\n-(NSString *)\
  \ convertToString;\n@end\n```\n\n**程序 21.2. Fraction.m 实现文件**\n\n```objc\n#import\
  \ \"Fraction.h\"\n\n@implementation Fraction\n@synthesize numerator, denominator;\n\
  \n-(void) setTo:(int) n over:(int) d\n{\n    numerator = n;\n    denominator = d;\n\
  }\n\n-(void) print\n{\n    NSLog(\"%i/%i\", numerator, denominator);\n}\n\n-(double)\
  \ convertToNum\n{\n    if (denominator != 0)\n        return (double) numerator\
  \ / denominator;\n    else\n        return NAN;\n}\n\n-(NSString *) convertToString\n\
  {\n    if (numerator == denominator) {\n        if (numerator == 0)\n          \
  \  return @\"0\";\n        else\n            return @\"1\";\n    }\n    else if\
  \ (denominator == 1)\n        return [NSString format:@\"%i\", numerator];\n   \
  \ else\n        return [NSString format:@\"%i/%i\", numerator, denominator];\n}\n\
  \n// 将分数加到接收者\n-(Fraction *) add:(Fraction *) f\n{\n    // 两个分数相加：\n    // a/b +\
  \ c/d = ((a*d) + (b*c)) / (b * d)\n    // result 将存储加法结果\n    Fraction *result =\
  \ [[[Fraction] init] autorelease];\n    result.numerator = numerator * f.denominator\
  \ +\n                      denominator * f.numerator;\n    result.denominator =\
  \ denominator * f.denominator;\n    [result reduce];\n    return result;\n}\n\n\
  -(Fraction *) subtract:(Fraction *) f\n{\n    // 分数相减：\n    // a/b - c/d = ((a*d)\
  \ - (b*c)) / (b * d)\n    Fraction *result = [[[Fraction] init] autorelease];\n\
  \    result.numerator = numerator * f.denominator -\n                      denominator\
  \ * f.numerator;\n    result.denominator = denominator * f.denominator;\n    [result\
  \ reduce];\n    return result;\n}\n\n-(Fraction *) multiply:(Fraction *) f\n{\n\
  \    Fraction *result = [[[Fraction] init] autorelease];\n    result.numerator =\
  \ numerator * f.numerator;\n    result.denominator = denominator * f.denominator;\n\
  \    [result reduce];\n    return result;\n}\n\n-(Fraction *) divide:(Fraction *)\
  \ f\n{\n    Fraction *result = [[[Fraction] init] autorelease];\n    result.numerator\
  \ = numerator * f.denominator;\n    result.denominator = denominator * f.numerator;\n\
  \    [result reduce];\n    return result;\n}\n\n-(void) reduce\n{\n    int u = numerator;\n\
  \    int v = denominator;\n    int temp;\n    if (u == 0)\n        return;\n   \
  \ else if (u < 0)\n        u = -u;\n    while (v != 0) {\n        temp = u % v;\n\
  \        u = v;\n        v = temp;\n    }\n    numerator /= u;\n    denominator\
  \ /= u;\n}\n\n@end\n```\n\n\n\n\n回想在 `convertToString:` 中使用的 `stringWithFormat:`\
  \ 方法，它根据格式字符串（类似于 `NSLog`）和逗号分隔的参数列表返回字符串。你通过逗号分隔参数传递给一个接收可变参数的方法，就像你向 `NSLog` 函数传递参数时一样。\n\
  \n### 处理分数的 `Calculator` 类\n\n接下来，是时候查看 `Calculator` 类了。这个概念与我们在书中之前开发的同名类相似。但在这一次，我们的计算器必须知道如何处理分数。以下是我们的新的\
  \ `Calculator` 类接口和实现文件。\n\n#### 程序 21.2. Calculator.h 接口文件\n\n```objc\n#import\
  \ <UIKit/UIKit.h>\n\n#import \"Fraction.h\"\n\n@interface Calculator : NSObject\
  \ {\n\n    Fraction *operand1;\n    Fraction *operand2;\n    Fraction *accumulator;\n\
  }\n\n@property (retain, nonatomic) Fraction *operand1, *operand2, *accumulator;\n\
  \n-(Fraction *) performOperation: (char) op;\n\n-(void) clear;\n\n@end\n```\n\n\
  #### 程序 21.2. Calculator.m 实现文件\n\n```objc\n#import \"Calculator.h\"\n\n@implementation\
  \ Calculator\n\n@synthesize operand1, operand2, accumulator;\n\n-(id) init\n{\n\
  \    self = [super init];\n    if (self) {\n        operand1 = [[Fraction alloc]\
  \ init];\n        operand2 = [[Fraction alloc] init];\n        accumulator = [[Fraction\
  \ alloc] init];\n    }\n    return self;\n}\n\n-(void) clear\n{\n    accumulator.numerator\
  \ = 0;\n    accumulator.denominator = 0;\n}\n\n-(Fraction *) performOperation: (char)\
  \ op\n{\n    Fraction *result;\n    switch (op) {\n        case '+':\n         \
  \   result = [operand1 add: operand2];\n            break;\n        case '-':\n\
  \            result = [operand1 subtract: operand2];\n            break;\n     \
  \   case '*':\n            result = [operand1 multiply: operand2];\n           \
  \ break;\n        case '/':\n            result = [operand1 divide: operand2];\n\
  \            break;\n    }\n    accumulator.numerator = result.numerator;\n    accumulator.denominator\
  \ = result.denominator;\n    return accumulator;\n}\n\n-(void) dealloc\n{\n    [operand1\
  \ release];\n    [operand2 release];\n    [accumulator release];\n    [super dealloc];\n\
  }\n\n@end\n```\n\n#### 设计 UI\n\n你可能已经注意到项目中有两个 xib 文件：一个名为 `MainWindow.xib`，另一个名为\
  \ `Fraction_CalculatorViewController.xib`。你完全不需要处理前者，因此请在左侧窗格中选择并打开后者。在出现的 View（视图）窗口中设计你的界面。这个视图与你的视图控制器（`Fraction_CalculatorViewController`）关联，并将在应用程序开始执行时自动加载。\n\
  \n#### 注意\n\n随着你对 iOS 应用开发的深入学习，你会发现你可以处理许多不同的视图控制器，每个控制器通常控制 iPhone 屏幕上的一个视图。你将学习如何在视图之间切换以及如何在它们之间传递数据。在这种情况下，你拥有的不仅仅是两个\
  \ nib 文件，通常每个视图控制器都有单独的 nib 文件。\n\n将你在视图中布局的每个数字按钮连接到 `clickDigit:` 方法。通过按住 Control\
  \ 点击并拖拽（Control-click-dragging），将每个按钮依次连接到视图控制器接口文件或实现文件中的 `clickDigit:` 方法。对于每个数字，将\
  \ `tag` 属性设置为相应的数字。\n\n### 总结\n\n以下是你所遵循的步骤的总结：\n\n1. 创建了一个新的 `Calculator` 应用程序。\n\
  2. 创建了 `Fraction_CalculatorViewController` 代理。\n3. 添加了 `Fraction` 和 `Calculator`\
  \ 类。\n4. 打开 `Fraction_CalculatorViewController.xib` 创建 UI。\n5. 在 View 窗口中创建了标签（label）和按钮。\n\
  6. 添加了名为 `display` 的 `UILabel` `IBOutlet`。\n7. 设置了 `IBAction` 按钮。\n8. 从每个按钮 Control\
  \ 点击并拖拽到 `clickDigit:` 方法。\n\n### 练习\n\n1. 为分数应用添加一个 `Convert` 按钮。当按下按钮时，使用 `Fraction`\
  \ 类的 `convertToNum` 方法生成结果的数值表示。将结果转换为字符串并显示在计算器中。\n2. 修改分数应用，使得在输入分子之前按下 – 键时，可以输入负分数。\n\
  3. 如果任一操作数的值为 0，则在计算器的显示屏上显示字符串 `Error`。\n4. 修改分数应用以便可以进行链式计算。例如，允许执行以下操作：`1/5 +\
  \ 2/7 – 3/8 =`。\n5. 你可以为应用程序添加一个图标，它将出现在 iPhone 的主屏幕上。可以通过将其拖到 App Icons 部分来实现。对于普通尺寸的图标（iPhone\
  \ 3GS 及之前的型号），图标大小应为 57x57 像素。对于 Retina 显示 iPhone（iPhone 4 及后续型号），图标图像文件应为 114x114\
  \ 像素。\n6. 使用你自己的图像为计算器的按钮提供自定义外观。首先将图像添加到项目中（将其拖入左侧窗格）。接下来，在检查器窗口中将按钮类型设置为 Custom，并将\
  \ Image 设置为你刚刚复制到项目中的文件。\n\n\n\n\n一种为了方便创建子类的类。实例是从子类创建的，而不是从抽象类创建。*另见* 具体子类。\n\n\
  ### 访问器方法 (accessor method)\n用于获取或设置实例变量值的方法。使用访问器方法设置和检索实例变量的值符合数据封装的方法论。\n\n###\
  \ 应用程序包 (Application Kit)\n一个用于开发应用程序用户界面的框架，包含了菜单、工具栏和窗口等对象。它是 Cocoa 的一部分，通常被称为\
  \ AppKit。\n\n### 归档 (archiving)\n将对象数据的表示转换为稍后可以恢复（反归档）的格式。\n\n### 数组 (array)\n\
  一种值的有序集合。数组可以被定义为 Objective-C 的基本类型，并在 Foundation 中通过 `NSArray` 和 `NSMutableArray`\
  \ 类作为对象实现。\n\n### 自动变量 (automatic variable)\n一种在进入和退出语句块（block）时自动分配和释放的变量。自动变量的作用域限于其定义的块，且没有默认初始值。其前面可选地带有关键字\
  \ `auto`。\n\n### 自动释放池 (autorelease pool)\n在 Foundation 框架中定义的一个对象，用于跟踪在池本身释放时应当释放的对象。通过向对象发送\
  \ `autorelease` 消息将对象添加到池中。\n\n### 位域 (bitfield)\n一个包含一个或多个指定位宽整数字段的结构。位字段可以像其他结构成员一样被访问和操纵。\n\
  \n### 块 (block)\nApple 公司对 C 语言的扩展。block 具有类似函数的语法，在定义时捕获其作用域内变量的值，并可以赋值给变量或作为参数传递给方法或函数。block\
  \ 可以高效地调度到另一个线程或处理器上执行。\n\n### 类别 (category)\n一组在指定名称下分组在一起的方法。类别可以对类的方法定义模块化，并可用于向现有类添加新方法。\n\
  \n### 字符字符串 (character string)\n以空字符终止的字符序列。\n\n### 类 (class)\n一组实例变量以及能够访问这些变量的方法。在定义类之后，可以创建该类的实例（即对象）。\n\
  \n### 类方法 (class method)\n在类对象上调用的方法（用前加 `+` 符号定义）。*另见* 实例方法。\n\n### 类对象 (class\
  \ object)\n一个标识特定类的对象。类名可以作为消息的接收者来调用类方法。在其他地方，可以在类上调用 `class` 方法创建一个类对象。\n\n###\
  \ 簇 (cluster)\n一种将一组私有具体子类的抽象类，通过抽象类向用户提供简化的接口。\n\n### Cocoa\n一个由 Foundation、Core\
  \ Data 和 Application Kit 框架组成的开发环境。\n\n### Cocoa Touch\n一个由 Foundation、Core Data\
  \ 和 UIKit 框架组成的开发环境。\n\n### 集合 (collection)\n一种 Foundation 框架对象，可以是数组、字典或集合，用于分组和操作相关对象。\n\
  \n### 编译时间 (compile time)\n源代码被分析并转换为称为对象代码（object code）的低级格式的时间。\n\n### 复合类 (composite\
  \ class)\n一个由其他类的对象组成的类；通常被用作子类化的替代方案。\n\n### 具体子类 (concrete subclass)\n抽象类的子类。可以从具体子类创建实例。\n\
  \n### 遵守 (conform)\n如果一个类通过直接实现或间接继承采纳了协议中的所有要求的方法，则该类遵守该协议。\n\n### 常量字符字符串 (constant\
  \ character string)\n包含在一对双引号内的字符序列。如果前面带有 `@` 字符，它定义了一个类型为 `NSConstantString` 的常量字符字符串对象。\n\
  \n### 数据封装 (data encapsulation)\n认为对象的数据存储在它的实例变量中，并且仅通过对象的方法进行访问的概念。这维护了数据的完整性。\n\
  \n### 代理 (delegate)\n一个被指示由另一个对象执行动作的对象。\n\n### 指定初始化器 (designated initializer)\n\
  类中所有其他初始化方法（或子类中通过向 `super` 发送消息）将调用的方法。\n\n### 字典 (dictionary)\n在 Foundation 中通过\
  \ `NSDictionary` 和 `NSMutableDictionary` 类实现的键值对集合。\n\n### 指令 (directive)\n在 Objective-C\
  \ 中，以 `@` 符号开头的特殊结构。`@interface`、`@implementation`、`@end` 和 `@class` 都是指令的示例。\n\n\
  ### 分布式对象 (Distributed Objects)\n一个应用程序中的 Foundation 对象与另一个应用程序（可能运行在另一台机器上）中的 Foundation\
  \ 对象通信的能力。\n\n### 动态绑定 (dynamic binding)\n在运行时确定要调用的方法，而不是在编译时确定。\n\n### 动态类型 (dynamic\
  \ typing)\n在运行时确定对象所属的类，而不是在编译时确定。*另见* 静态类型类型。\n\n### 封装 (encapsulation)\n*见* 数据封装。\n\
  \n### 外部变量 (extern variable)\n*见* 全局变量。\n\n### 工厂方法 (factory method)\n*见* 类方法。\n\
  \n### 工厂对象 (factory object)\n*见* 类对象。\n\n### 正式协议 (formal protocol)\n一组在用 `@protocol`\
  \ 指令声明的名称下分组的相关方法。不同的类（不一定相关）可以通过实现（或继承）其所有要求的方法来遵守一个正式协议。*另见* 非正式协议。\n\n### 转发\
  \ (forwarding)\n将消息及其相关参数发送到另一个方法进行执行的过程。\n\n### Foundation 框架 (Foundation framework)\n\
  一组类、函数和协议，构成了应用程序开发的基础，提供了基本功能，如内存管理、文件和 URL 访问、归档以及处理集合、字符串、数字和日期对象。\n\n### 框架\
  \ (framework)\n一组类、函数、协议、文档、头文件和其他资源。例如，Cocoa 框架用于在 Mac OS 下开发交互式应用程序。\n\n### 函数\
  \ (function)\n一个由名称标识的语句块，可以接受通过值传递给它的一个或多个参数，并可选地返回值。函数可以是局部的（静态的），也可以全局的，这样就可以从其他文件中定义的函数或方法调用。\n\
  \n### 垃圾回收 (garbage collection)\n一种自动释放未引用对象所用内存的内存管理系统。iPhone 运行时不支持垃圾回收。\n\n###\
  \ gcc\n由自由软件基金会（FSF）开发的编译器。gcc 支持多种编程语言，包括 C、Objective-C 和 C++。gcc 是 Mac OS X 上编译\
  \ Objective-C 程序的标准编译器。\n\n### gdb\n用于 gcc 编译程序的调试工具。\n\n### Getter 方法 (getter method)\n\
  获取实例变量值的访问器方法。*另见* Setter 方法。\n\n### 全局变量 (global variable)\n定义在任何方法或函数之外的变量，可以在同一源文件中的任何方法或函数访问，也可以从声明该变量为\
  \ `extern` 的其他源文件访问。\n\n### 头文件 (header file)\n包含定义、宏和变量声明的文件，通过 `#import` 或 `#include`\
  \ 语句包含在程序中。\n\n### id\n可以持有任何类型对象指针的通用对象类型。\n\n### 不变对象 (immutable object)\n\n\n\
  \n\n\n### 一个值不能被修改的对象。Foundation 框架中的示例包括 `NSString`、`NSDictionary` 和 `NSArray`\
  \ 对象。*另参见* 可变对象。\n\n### 实现部分 (implementation section)\n类定义中包含实际代码（即实现）的部分，这些代码对应相应接口部分（或根据协议定义指定）中声明的方法。\n\
  \n### 非正式协议 (informal protocol)\n一组逻辑上相关的方法，被声明为一个分类（category），通常作为根类的一个分类。与正式协议不同，非正式协议中的所有方法并不一定需要实现。*另参见*\
  \ 正式协议。\n\n### 继承 (inheritance)\n从根对象开始，将方法和实例变量从类传递给类的过程。\n\n### 实例 (instance)\n\
  类的具体表示。实例通常是通过向类对象发送 `alloc` 或 `new` 消息而创建的对象。\n\n### 实例方法 (instance method)\n可以通过类的实例调用的方法。*另参见*\
  \ 类方法。\n\n### 实例变量 (instance variable)\n声明在接口部分（或从父类继承）的变量，包含在对象的每个实例中。实例方法可以直接访问其实例变量。\n\
  \n### Interface Builder\nMac OS X 下的一个工具，用于为应用程序构建图形用户界面。\n\n### 接口部分 (interface\
  \ section)\n用于声明类、其父类、实例变量和方法的部分。对于每个方法，还声明了参数类型和返回类型。*另参见* 实现部分。\n\n### 国际化 (internationalization)\n\
  *参见* 本地化。\n\n### isa\n根对象中定义的特殊实例变量，所有对象都继承它。`isa` 变量用于在运行时识别对象所属的类。\n\n### 链接 (linking)\n\
  将一个或多个对象文件转换为可执行程序的过程。\n\n### 局部变量 (local variable)\n其作用域局限于定义它的代码块（block）的变量。变量可以是方法、函数或语句块的局部的。\n\
  \n### 本地化 (localization)\n使程序适用于在特定地理区域执行的过程，通常通过将消息翻译成本地语言并处理本地时区、货币符号、日期格式等事项来实现。有时\
  \ *本地化* 仅指代语言翻译，而 *国际化* 一词用于指代过程的其他部分。\n\n### 消息 (message)\n发送给对象（接收者的方法及其关联参数。\n\
  \n### 消息表达式 (message expression)\n方括号括起来的表达式指定了对象（接收者）和要发送给对象的消息。\n\n### 方法 (method)\n\
  属于某个类的过程，可以通过向类对象或该类的实例发送消息来执行。*另参见* 类方法。\n\n### 可变对象 (mutable object)\n值可以改变的对象。Foundation\
  \ 框架中的示例包括可变字符串等。*另参见* 不可变对象。\n\n### nil\n一个表示空对象的特殊指针。`nil` 可以接收任何消息而不会崩溃。\n\n\
  ### 链接 (linking)\n将一个或多个对象文件转换为可执行程序的过程。\n\n### 局部变量 (local variable)\n其作用域局限于定义它的代码块（block）的变量。变量可以是方法、函数或语句块的局部的。\n\
  \n### 本地化 (localization)\n使程序适用于在特定地理区域执行的过程，通常通过将消息翻译成本地语言并处理本地时区、货币符号、日期格式等事项来实现。有时\
  \ *本地化* 仅指代语言翻译，而 *国际化* 一词用于指代过程的其他部分。\n\n### 消息 (message)\n发送给对象（接收者）的方法及其关联参数。\n\
  \n### 消息表达式 (message expression)\n方括号括起来的表达式指定了对象（接收者）和要发送给对象的消息。\n\n### 方法 (method)\n\
  属于某个类的过程，可以通过向类对象或该类的实例发送消息来执行。*另参见* 类方法。\n\n### 可变对象 (mutable object)\n值可以改变的对象。Foundation\
  \ 框架中的示例包括可变字符串等。*另参见* 不可变对象。\n\n### nil\n一个表示空对象的特殊指针。`nil` 可以接收任何消息而不会崩溃。\n\n\
  ### 通知 (notification)\n每当特定事件发生时，向注册的对象发送消息的过程。\n\n### NSObject\nFoundation 框架中的根类。\n\
  \n### nil 指针 (null pointer)\n一个表示空对象的特殊指针。\n\n### 接收者 (receiver)\n接收消息的对象。在方法内部可以使用\
  \ `self` 来引用接收者。\n\n### 引用计数 (reference count)\n*参见* 引用计数。\n\n### 引用计数 (retain count)\n\
  对象被引用的次数计数。通过向对象发送 `retain` 消息增加，通过向其发送 `release` 消息减少。\n\n### 根对象 (root object)\n\
  没有父类的没有没有中的顶级对象。\n\n### 运行时 (runtime)\n程序执行的时间；也负责执行程序指令的机制。\n\n### 选择器 (selector)\n\
  用于选择对象方法的名称。编译后的选择器类型为 `SEL`，可以使用 `@selector` 指令生成。\n\n### self\n方法内部用于引用接收者的变量。\n\
  \n### 集合 (set)\n在 Foundation 中使用 `NSSet`、`NSMutableSet` 和 `NSCountedSet` 类实现的无序唯一集合。\n\
  \n### setter 方法 (setter method)\n设置实例变量值的访问方法。*另参见* getter 方法 (getter method)。\n\
  \n### 语句 (statement)\n以分号结束的多个表达式。\n\n### 语句块 (statement block)\n在大括号括起来的多个语句。可以在语句块中声明局部变量，其作用域局限于该块。\n\
  \n### 静态函数 (static function)\n使用 `static` 关键字定义的函数，仅由同一源文件的其他函数或方法调用。\n\n### 静态类型\
  \ (static typing)\n在编译时明确识别对象所属的类。*另参见* 动态类型。\n\n### 静态变量 (static variable)\n作用域局限于定义它的块或模块的变量。静态变量具有默认初始值\
  \ 0，并在方法或函数调用期间保持其值。\n\n### 结构体 (structure)\n可以包含不同类型成员的聚合数据类型。结构体可以赋值给其他结构体，作为参数传递给函数和方法，并由它们返回。\n\
  \n### 多态 (polymorphism)\n不同类接受相同消息的能力。\n\n### 预处理器 (preprocessor)\n对源代码进行处理，以 `#`\
  \ 开头。\n\n### 过程化编程语言 (procedural programming language)\n通过过程和函数定义程序的语言。\n\n### 属性声明\
  \ (property declaration)\n一种为实例变量生成访问方法的方法。属性声明可以在运行时动态加载。\n\n### 属性列表 (property\
  \ list)\n通常以 XML 格式存储的不同类型的表示。\n\n### 协议 (protocol)\n类必须实现或遵循的方法列表。*另参见* 正式协议 和\
  \ 非正式协议。\n\n### 子类 (subclass)\n\n\n\n\n\n也称为`child class`，子类继承其父类或超类的方法和实例变量。\n\n\
  ### `super`\n在方法中使用的关键字，用于引用接收者的父类。\n\n### `super class`\n特定类的父类。参见 `super` (#apa.html)。\n\
  \n### `synthesized method`\n编译器为你为你创建的 setter（设置方法）或 getter（访问方法）。它是在 Objective\
  \ C 2.0 中引入的。\n\n### `UIKit`\n一个用于开发 iOS 设备应用程序的框架。除了提供了处理窗口、按钮和标签等常用元素的类外，它还定义了用于处理设备特定功能（如加速度计和触摸界面）的类。\n\
  \n### `Unicode character`\n一种用于表示数百万个字符的标准。`NSString` 和 `NSMutableString` 用于处理字符串。\n\
  \n### `union`\n一种聚合数据类型，例如包含共享相同存储区域成员的结构体。在任何时候，这些成员中仅有一个可以占据该存储区域。\n\n### `Xcode`\n\
  一个用于在 Mac OS 上进行程序开发的编译和调试工具。\n\n### `XML`\n可扩展标记语言。Mac OS 上的默认格式。\n\n### `zone`\n\
  用于分配数据的指定内存区域。程序可以操作多个 zone 来高效地管理内存。\n\n## 附录 B. 通讯录源代码\n为了参考参考，这里是你在第二部分（#pt2.html）“基础”中贯穿完成的通讯录示例的完整接口和实现文件。这包含了\
  \ `AddressCard` 和 `AddressBook` 类的定义。你应该在你的系统上实现这些类；然后扩展类定义以使其更具实用性和强大性。这是你学习该语言并熟悉构建程序、处理对象以及使用框架的极佳方法。\n\
  \n### `AddressCard` 接口\n```objc\n#import <Foundation/h>\n\n@interface AddressCard\
  \ <NSCopying, NSCoding>\n{\n    NSString *name;\n    NSString *email;\n}\n@property\
  \ (nonatomic, copy) NSString *name, *email;\n-(void) setName:(NSString *)nameEmail:(NSString\
  \ *)email;\n-(void) retainName:(NSString *)nameEmail:(NSString *)email;\n-(NSComparisonResult)\
  \ compareNames:(id)element;\n-(void) print;\n@end\n```\n\n### `AddressCard` 实现\n\
  ```objc\n#import \"AddressCard.h\"\n\n@implementation AddressCard\n@synthesize name,\
  \ email;\n\n-(void) setName:(NSString *)nameEmail:(NSString *)email\n{\n    self.name\
  \ = nameEmail;\n    self.email = email;\n}\n// 比较指定通讯录中的两个名称\n-(NSComparisonResult)\
  \ compareNames:(id)element\n{\n    return [name compare: [element name]];\n}\n-(void)\
  \ print\n{\n    NSLog (@\"====================\");\n    NSLog (@|              \
  \            |);\n    NSLog (@| %-31s |\", [name UTF8String]);\n    NSLog (@| %-31s\
  \ |\", [email UTF8String]);\n    NSLog (@|                          |);\n    NSLog\
  \ (@|                          |);\n    NSLog (@|                          |);\n\
  \    NSLog (@|                          ||);\n    NSLog (@\"====================\"\
  );\n}\n-(id) copyWithZone:(NSZone *)zone\n{\n    id newCard = [[self class] allocWithZone:\
  \ zone];\n    [newCard retainName:nameEmail:email];\n    return newCard;\n}\n-(void)\
  \ retainName:(NSString *)nameEmail:(NSString *)email\n{\n    self.name = nameEmail;\n\
  \    self.email = email;\n}\n-(void) encodeWithCoder:(NSCoder *)encoder\n{\n   \
  \ [encoder encodeObject: name forKey: @\"CardName\"];\n    [encoder encodeObject:\
  \ email forKey: @\"CardEmail\"];\n}\n-(id) initWithCoder:(NSCoder *)decoder\n{\n\
  \    name = [[decoder decodeForKey: @\"CardName\"] retain];\n    email = [[decoder\
  \ decodeForKey: @\"CardEmail\"] retain];\n    return self;\n}\n-(void) dealloc\n\
  {\n    [name release];\n    [email release];\n    [super dealloc];\n}\n@end\n```\n\
  \n### `AddressBook` 实现\n```objc\n#import \"AddressBook.h\"\n\n@implementation AddressBook\n\
  @synthesize book, bookName;\n\n// 设置 AddressBook 的名称和一个空的通讯录\n-(id) initWithName:(NSString\
  \ *)name\n{\n    self = [super init];\n    if (self) {\n        bookName = [NSString\
  \ alloc] initWithString: name];\n        book = [[NSMutableArray alloc] init];\n\
  \    }\n    return self;\n}\n-(id) init\n{\n    return [self initWithName: @\"Book\"\
  ];\n}\n-(void) sort\n{\n    [book sortUsingSelector: @selector(compareNames:)];\n\
  }\n// 使用 blocks 进行交替排序\n-(void) sort2\n{\n    [book sortUsingComparator:\n    ^(id\
  \ obj1, id obj2) {\n        return [[obj1 name] compare: [obj2 name]];\n    }];\n\
  }\n-(void) addCard:(AddressCard *) theCard\n{\n    [book addObject: theCard];\n\
  }\n-(void) removeCard:(AddressCard *) theCard\n{\n    [book removeObjectIdenticalTo:\
  \ theCard];\n}\n-(int) entries\n{\n    return [book count];\n}\n-(void) list\n{\n\
  \    NSLog (@\"======== Contents of: %@==\", bookName);\n    for ( AddressCard *theCard\
  \ in book )\n        NSLog (@\"%-20s  %-32s\", [theCard.name UTF8String],\n    \
  \          [theCard.email UTF8String]);\n    NSLog (@\"==================================\"\
  );\n}\n// 根据名称查找通讯录卡 — 假设完全匹配\n-(AddressCard *) lookup:(NSString *) theName\n{\n\
  \    for ( AddressCard *nextCard in book )\n        if ( [[nextCard name] caseInsensitiveCompare:\
  \ theName]\n            == NSOrderedSame )\n            return nextCard;\n    return\
  \ nil;\n}\n-(void) dealloc\n{\n    [bookName release];\n    [book release];\n  \
  \  [super dealloc];\n}\n-(void) encodeWithCoder:(NSCoder *)encoder\n{\n    [encoder\
  \ encodeObject:bookName forKey: @\"AddressBookBookName\"];\n    [encoder encodeObject:book\
  \ forKey: @\"AddressBookBook\"];\n}\n-(id) initWithCoder:(NSCoder *)decoder\n{\n\
  \    bookName = [[decoder decodeForKey: @\"AddressBookBookName\"] retain];\n   \
  \ book = [[decoder decodeForKey: @\"AddressBookBook\"] retain];\n    return self;\n\
  }\n// NSCopying 协议的方法\n-(id) copyWithZone:(NSZone *)zone\n{\n    id newBook = [[self\
  \ class] allocWithZone: zone];\n    [newBook initWithName: bookName];\n    // 以下将通讯录进行浅拷贝\n\
  \    [newBook setBook: book];\n    return newBook;\n}\n@end\n```\n\n## 索引\n\n###\
