  \n# 第 1 章 引言\nAT&T 贝尔实验室的 Dennis Ritchie 在 20 世纪 70 年代初创立了 C 语言。然而，这种编程语言直到 20 世纪\
  \ 70 年代后期才开始普及。这是因为在此之前，C 编译器在贝尔实验室之外无法轻易获得。\n\nBrad J. Cox 在 20 世纪 80 年代设计了 Objective-C\
  \ 语言。该语言基于一种名为 SmallTalk-80 的语言。Objective-C 是在 C 语言之上的*分层*，这意味着在 C 的基础上添加了扩展，以创建一种可以创建和操作*对象*的新编程语言。\n\
  \nNeXT Software 在 1988 年授权了 Objective-C 语言，并开发了库以及名为 NEXTSTEP 的开发环境。1992 年，自由软件基金会的开发环境增加了\
  \ Objective-C 支持。自由软件基金会（FSF）产品版权归 FSF 所有。它根据 GNU 通许可证发布。\n\n1994 年，NeXT 和太阳公司发布了\
  \ NEXTSTEP 系统的标准规范，称为 OPENSTEP。自由软件会对 OPENSTEP 的实现称为 GNUSTp。包含 Linux 内核和 GNUSTp\
  \ 开发环境的 Linux 版本，恰其成地被称为 LinuxSTEP。\n\n1996 年 12 月 20 日，苹果计算机宣布收购了 NeXT Software，NEXTSTEP/OPENSTEP\
  \ 环境成为了苹果操作系统下一个重大版本 OS X 的基础。苹果版本的这一开发环境被称为 Cocoa。\n\n2007 年，苹果对 Objective-C 语言发布了更新，并将其标记为\
  \ Objective-C 2.0。该语言版本构成了本书第二版的基础。\n\n\n\n\n\n当 iPhone 在 2007 年发布时，开发者们竞相渴求为这款革命性设备开发应用程序的机会。最初，Apple\
  \ 并不欢迎第三方应用程序开发。公司安抚那些渴望成为 iPhone 开发者的方法是允许他们开发基于 Web 的应用程序。基于 Web 的应用程序在 iPhone\
  \ 内置的 `Safari` 浏览器下运行，并要求用户连接到托管该应用程序的网站才能运行。开发者对基于 Web 的程序的许多固有局限性并不满意，Apple 在此后不久宣布开发者将能够为\
  \ iPhone 开发所谓的 `native`（原生）应用程序。\n\n原生应用程序是存储在 iPhone 上并在 iPhone 操作系统下运行的程序，这与 iPhone\
  \ 内置应用程序（如联系人、股票和天气状况）在设备上的运行方式相同。iPhone 的操作系统实际上是 Mac OS X 的一个版本，这意味着可以在 MacBook\
  \ Pro 等设备上进行程序的开发和调试。事实上，Apple 很快提供了一个强大的软件开发工具包（SDK），允许快速进行 iPhone 应用程序的开发和调试。iPhone\
  \ 模拟器的出现使得开发者能够直接在开发系统上调试他们的应用程序，避免了在实际 iPhone 或 iPod Touch 设备上下载和测试程序的麻烦。\n\n随着\
  \ 2010 年 iPad 的推出，Apple 开始对用于操作系统和 SDK 的术语进行通用化，这些工具现在支持具有不同物理尺寸和屏幕分辨率的不同设备。`iOS\
  \ SDK` 允许你为任何 iOS 设备开发应用程序，截至本文写作时，`iOS 4` 是该操作系统的当前版本。\n\n### 你将从本书中学学到什么\n\n当我考虑写一本关于\
  \ Objective-C 的教程时，我必须要做一个基础性的决定。和其他其他关于 Objective-C 的书籍一样，我可以写的书假设读者已经知道如何编写 C\
  \ 语言程序。我也可以从使用丰富的例程库的角度来教授这种语言，例如 `Foundation` 和 ``UIKit`` 框架。有些书籍还采用教授如何使用开发工具的方法，例如\
  \ Mac 的 `Xcode` 以及以前被称为 Interface Builder 的工具来设计 UI。\n\n在采用这种方法时我遇到了几个问题。首先，在学习\
  \ Objective-C 之前学习整个 C 语言是错误的。C 是一种 `procedural`（过程化）语言，包含许多在 Objective-C 编程并非所需的特性，特别是在初学者阶段。事实上，诉诸这些特征中的某些特性违背了遵循良好的\
  \ ``object-oriented programming` methodology`` 的原则。在学习面向对象的语言之前学习学习过程化语言的所有细节也不是一个好主意。这会让程序员从错误的方向开始，并为培养良好的面向对象编程风格提供错误的导向和心态。仅仅因为\
  \ Objective-C 是 C 语言的扩展，并不意味着你必须先学 C 语言。\n\n所以我决定既不先教 C 语言，也不假设具备该语言的先验。相反，我决定采取一种非传统的方法，将\
  \ Objective-C 和底层的 C 语言视为一种单一的集成语言，从面向对象编程的角度进行教导。本书的目的正如其名所示：教你如何使用 `Objective-C\
  \ 2.0` 进行编程。它并不声称会详细教你如何使用可用于输入和调试程序的开发工具，或提供关于如何开发交互式图形应用程序的深入说明。在你学会了如何编写 Objective-C\
  \ 程序之后，你可以在其他地方更详细地学习所有这些材料。事实上，当你拥有了坚实的 Objective-C 编程基础时，掌握这些材料将容易得多。本书并不假设（或几乎没有）以前的编程经验。事实上，如果你是一个初级程序员，只要有投入和努力，你就应该能够学习\
  \ Objective-C 作为你的第一门编程语言。根据我从本书之前的版本收到的反馈，其他读者在这一点上取得了成功。\n\n本书通过示例教授 Objective-C。每当我介绍语言的每个新特性时，我通常会提供一个短小的完整程序示例来说明该特性。正如画画胜千言，选择得恰当的程序示例也是如此。我们强烈鼓励你运行每个程序（所有程序均可在网上获得），并将你系统上获得的结果与文中显示的结果进行比较。通过这种方式，你将学习这门语言及其语法，还将熟悉编译和运行\
  \ Objective-C 程序的过程。\n\n### 本书的结构\n\n本书分为三个逻辑部分。第一部分“Objective-C 2.0 语言”教了该语言的精要内容。第二部分“Foundation\
  \ 框架”教你如何使用构成 Foundation 框架的丰富预定义类集合。第三部分“Cocoa、Cocoa Touch 和 iOS SDK”为你提供了 Cocoa\
  \ 和 Cocoa Touch 框架的概述，然后带你通过使用 iOS SDK 开发简单的 iOS 应用程序的过程。\n\n``framework``是一组逻辑分组的类和例程，使得程序开发变得更容易。Objective-C\
  \ 编程的很大力量取决于可提供的扩展框架。\n\n第二章“在 Objective-C 中编程”从教你如何用 Objective-C 编写第一个程序开始。\n\n\
  由于这不是一本关于 Cocoa 或 iOS 编程的书，图形用户界面（GUI）没有被详尽教授，在第三部分之前几乎没有被提到。因此需要一种方法来获取输入并产生输出。书中的大多数示例从键盘获取输入并在窗口输出：使用命令行\
  \ `gcc`“类、对象和方法”涵盖了面向对象编程的基础。本章介绍了一些术语，但保持在最低限。我引入了定义类的机制以及向实例或对象发送消息的手段。经验丰富的 Objective-C\
  \ 程序员会注意到我在声明对象时使用了`static` 类型。我认为这是学生开始的最好方式，因为编译器可以发现更多错误，并鼓励新程序员在类型已知时显式声明。结果是，`id`\
  \ 类型的概念及其力量直到第九章](#ch09.html)“多态、动态类型和动态绑定”才被充分探索。\n\n第四章“数据类型和表达式”描述了基本的 Objective-C\
  \ 数据类型以及如何在程序中使用它们。\n\n第五章“程序循环”引入了你可以在程序使用的三种循环语句：`for`、`while` 和 `do`。\n\n做出决策是任何计算机编程语言的基础。第六章“做出决策”详细介绍了\
  \ Objective-C 语言的 `if` 和 `switch` 语句。\n\n\n\n\n第 8 章“继承”引入了继承这一核心概念。这一特性使得程序开发变得更容易，因为你可以利用上层提供的内容。继承和子类的概念使得修改和扩展现有的类定义变得简单。\n\
  \n第 9 章讨论了 Objective-C 语言的三个基本特征。多态性、动态类型和动态绑定是这里涵盖的关键概念。\n\n第 10 章–第 13 章完善了对 Objective-C\
  \ 语言的讨论，涵盖了对象初始化、块（blocks）、协议（protocols）、分类（categories）、预处理器以及一些底层 C 特性，包括函数、数组、结构体和指针。在首次开发面向对象的应用程序时，这些底层特性通常是不必要的（而且最好尽量避免）。建议你在第一次阅读全本书时快速浏览一下第\
  \ 13 章“底层 C 特性”，仅在需要进一步了解语言的某个特定特性时再返回阅读。第 13 章还介绍了 C 语言最近添加的一个特性，即块 (blocks)。应该在学习了如何编写函数之后再学习，因为前者的语法源于后者。\n\
  \n第二部分从第 14 章“Foundation 框架简介”开始，该章节介绍了 Foundation 框架以及如何使用其海量的文档。\n\n第 15 章–第 19\
  \ 章涵盖了 Foundation 框架的重要特性。这些包括数字和字符串对象、集合、文件系统、内存管理以及对象的拷贝和归档过程。\n\n当你完成第二部分时，你将能够使用\
  \ Objective-C 开发配合 Foundation 框架的相当复杂的程序。\n\n第三部分从第 20 章“Cocoa 和 Cocoa Touch 简介”开始。在这里，你将快速概述这些提供了你在\
  \ Mac 和你的 iOS 设备上开发复杂的图形化应用程序所需的类的框架。\n\n第 21 章“编写 iOS 应用程序”引入了 iOS SDK 和 UIKit\
  \ 框架。本章说明了编写简单 iOS 应用程序的逐步步骤方法，随后是一个更复杂的计算器应用程序，该程序允许你使用 iPhone 进行分数的简单算术计算。\n\n\
  由于面向对象的术语涉及大量的专业名词，附录 A“术语表”提供了一些常用术语的定义。\n\n在学习了如何编写 Objective-C 程序之后，你可以向几个方向发展。你可能想学习更多关于底层的\
  \ C 语言语言——或者你可能开始编写运行在 Mac OS X 上的 Cocoa 程序，或者开发更复杂的 iOS 应用程序。\n\n### 支持\n\n如果你访问\
  \ `classroomM.com/objective-c`，你会发现一个内容丰富的论坛。在那里，你可以获得源代码（注意，你不会在那里找到所有示例的“官方”源代码，因为我坚信学习过程的很大一部分发生在你自己输入程序示例并学习如何识别和纠正任何错误的过程中）、练习题答案、勘误表、测验，并向我以及论坛成员提问。该论坛已变成了一个由活跃成员组成的丰富社区，他们乐于帮助其他成员解决问题并回答他们的问题。请前往、加入并参与吧！\n\
