  \n### 基础文件操作：`NSFileHandle`\n\n`NSFileHandle` 提供的方法允许你更紧密地处理文件。在本章开头，我们列出了在使用这些方法时通的三个步骤：\n\
  \n1. 打开文件并获取 `NSFileHandle` 对象。\n2. 对打开的文件执行你的 I/O 操作。\n3. 关闭文件。\n\n表 16.7 总结了一些常用的\
  \ `NSFileHandle` 方法。在此表中，`fh` 是 `NSFileHandle` 对象，`data` 是 `NSData` 对象，`path` 是\
  \ `NSString` 对象，`offset` 是 `unsigned long long`。\n\n**表 16.7 `NSFileHandle` 方法**\n\
  \n![image](img/16tab07.jpg)\n\n此处未显示获取标准输入、标准输出、标准错误和空设备的 `NSFileHandles` 方法。这些格式为\
  \ `fileHandleWithDevice`，其中 `Device` 可以是 `StandardInput`、`StandardOutput`、`StandardError`\
  \ 或 `NullDevice`。\n\n同样未显示后台读写数据的方法。\n\n你应该注意 `NSFileHandle` 类没有提供创建文件。这必须通过 `NSFileManager`\
  \ 方法完成，正如我们描述过的。因此，`fileHandleForWritingAtPath:` 和 `fileHandleForUpdatingAtPath:`\
  \ 都假设文件存在，如果不存在则返回 `nil`。两种情况下，文件偏移量设置为文件开头，因此写入（或更新模式读取）从文件开始。此外，如果你习惯在 UNIX 下编程，应该注意打开文件进行写入不会截断文件。如果你有此意图，必须自己这样做。\n\
  \nProgram 16.7 打开你在章节开头创建的原始 `testfile` 文件，读取其内容并将其复制到名为 `testout` 的文件中。\n\n**程序\
  \ 16.7**\n\n```objc\n// 一些基础的文件句柄操作\n// 假设在当前工作目录下存在一个名为 \"testfile\" 的文件\n\n#import\
  \ <Foundation/Foundation.h>\n\nint main (int argc, char *argv[])\n{\n   NSAutoreleasePool\
  \ * pool = [[NSAutoreleasePool alloc] init];\n   NSFileHandle      *inFile, *outFile;\n\
  \   NSData            *buffer;\n   // 打开 testfile 文件进行读取\n```\n\n\n\n```objc\ninFile\
  \ = [NSFileHandle fileHandleForReadingAtPath: @\"testfile\"];\nif (inFile == nil)\
  \ {\n    NSLog(@\"Open of testfile for failed\");\n    return 1;\n}\n// 如果必要创建输出文件\n\
  [[NSFileManager defaultManager] createFileAtPath: @\"out\" contents:nil attributes:nil];\n\
  // 现在打开 outfile 进行写入\noutFile = [NSFileHandle fileHandleForWritingAtPath: @\"out\"\
  ];\nif (outFile == nil) {\n    NSLog(@\"Open of test for writing failed\");\n  \
  \  return 2;\n}\n// 截断输出文件，因为它可能包含数据\n[outFile truncateFileAtOffset:0];\n// 从 inFile\
  \ 读取数据并写入 outFile\nbuffer = [inFile readDataToEndFile];\n[outFile writeData: buffer];\n\
  // 关闭两个文件\n[inFile closeFile];\n[outFile closeFile];\n// 验证文件内容\nNSLog(@\"%@\",\
  \ [NSString stringWithContentsOfFile: @\"out\" encoding:NSUTFStringEncoding error:nil]);\n\
  [pool drain];\nreturn 0;\n```\n\n#### 16.7. 输出\n\n这是一个包含一些数据的测试文件。\n这是另一行数据。\n这是第三行。\n\
  \n`readDataToEndFile:` 方法每次读取最多 `UINT_MAX` 字节的数据，该值定义在 `<limits.h>` 中并等于 `0xFFFFFFFF`。这对于你要写入的任何应用程序都足够大。你也可以将操作拆分以执行较小规模的读写。你甚至可以设置循环，使用\
  \ `readDataOfLength:` 方法一次在文件之间传输满字节的缓冲区。例如，你的缓冲区大小可能是 8,192 (8kb) 或 131,072 (128kb)\
  \ 字节。通常使用 2 的幂次是因为底层系统通常以这种大小的块执行 I/O 操作。你可能想在你的系统上尝试不同的值，看看什么效果最好。\n\n如果读取方法在没有读取到任何数据的情况下到达文件结束，它将返回一个空的\
  \ `NSData` 对象（即没有任何字节的缓冲区）。你可以对缓冲区应用 `length` 方法并测试其是否等于零，以检查文件中是否还有剩余数据需要读取。\n\n\
  如果你打开文件进行更新，文件偏移量设置为文件的开头。你可以通过在文件中进行寻址（seek）来更改该偏移量，然后在文件上执行读取或写入操作。因此，要跳转到句柄为\
  \ `databaseHandle` 的文件的第 10 个字节，你可以编写以下消息：\n`[databaseHandle seekToFileOffset: 10]`\n\
  \n相对文件定位是通过获取当前文件偏移量然后对其加或减来实现的。因此，要跳过文件中的接下来的 128 字节，请写：\n`[databaseHandle seekToFileOffset:[databaseHandle\
  \ offsetInFile] + 128]`\n\n要回到文件中文件中等同于五个整数的位置，请写：\n`[databaseHandle seekToFileOffset:[databaseHandle\
  \ offsetInFile] – 5 * sizeof (int)]`\n\n`Program 16.8` 将一个文件的内容追加到另一个文件中。它通过打开第二个文件进行写入，跳转到文件末尾，然后将第一个文件的内容写入第二个文件来实现。\n\
  \n#### Program 16.8\n\n```objc\n// 将文件 \"fileA\" 追加到 \"fileB\" 的末尾\n#import <Foundation/Foundation.h>\n\
  int main (int argc, char *argv[])\n{\n    NSAutoreleasePool * pool = [[NSAutleasePool\
  \ alloc] init];\n    NSFileHandle *inFile, *outFile;\n    NSData *buffer;\n    //\
  \ 打开文件 fileA 读取\n    inFile = [NSFileHandle fileHandleForReadingAtPath: @\"fileA\"\
  ];\n    if (inFile == nil) {\n        NSLog(@\"Open of fileA for failed\");\n  \
  \      return 1;\n    }\n    // 打开文件 fileB 进行更新\n    outFile = [NSFileHandle fileHandleForWritingAtPath:\
  \ @\"fileB\"];\n    if (outFile == nil) {\n        NSLog(@\"Open of fileB writing\
  \ failed\");\n        return 2;\n    }\n    // 跳转到 outFile 的末尾\n    [outFile seekToEndFile];\n\
  \    // 读取 inFile 并写入其内容\n    buffer = [inFile readDataToEndFile];\n    [outFile\
  \ writeData: buffer];\n    // 关闭两个文件\n    [inFile closeFile];\n    [outFile closeFile];\n\
  \    // 验证其内容\n    NSLog(@\"%@\", [NSString stringWithContentsOfFile: @\"fileB\"\
  \ encoding:NSUTFStringEncoding error:nil]);\n    [pool drain];\n    return 0;\n\
  }\n```\n\n运行 `Program 16.8` 之前 `fileA` 的内容：\n这是第一个文件的第 1 行。\n这是第一个文件的第 2 行。\n运行\
  \ `Program 16.8` 之前 `fileB` 的内容：\n这是第二个文件的第 1 行。\n这是第二个文件的第 2 行。\n\n#### 16.8. 输出\n\
  \n`fileB` 的内容\n这是第二个文件的第 1 行。\n这是第二个文件的第 2 行。\n这是第一个文件的第 1 行。\n这是第一个文件的第 2 行。\n\n\
  你可以从输出可以看出第一个文件的内容已成功追加到第二个文件的末尾。顺便提一下，`seekToEndFile` 在执行跳转后返回当前的文件偏移量。我们忽略了那个值；如果你需要，可以使用该信息来获取文件的大小。\n\
  \n### `NSURL` 类\n\n`NSURL` 类为你在程序中处理 URL 地址提供了一种方便的方法。例如，给定一个网络上文件的 http 地址，你可以通过几个方法调用来读取该文件的内容。在\
  \ Foundation 中有很多接受 `NSURL` 对象作为参数的方法。只需记住 `NSURL` 对象不是字符串对象（如 `@\"http://www.apple.com\"\
  `），但你可以使用 `URLWithString:` 方法从字符串对象轻松创建一个。`Program 16.9` 展示了如何从网络地址读取 html 内容到程序中。\n\
  \n#### Program 16.9\n\n```objc\n// 读取存储在 URL 上的文件\n#import <Foundation/Foundation.h>\n\
  int main (int argc, const char * argv[]) {\n    NSAutoreleasePool * pool = [[NSoreleasePool\
  \ alloc] init];\n    NSURL *myURL = [NSURL URLWithString: @\"http://classroom.com\"\
  ];\n    NSString *myHomePage = [NSString stringWithContentsOfURL: myURL encoding:NSASCIIStringEncoding\
  \ error:NULL];\n    NSLog(@\"%@\", myHomePage);\n    [pool drain];\n    return 0;\n\
  }\n```\n\n#### Program 16.9. 部分输出\n\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML 1.0 Transitional//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\"><head>\n<meta http-equiv=\"Content-Type\"\
  \ content=\"text/html; charset=iso-8859-1\" />\n<meta http-equiv=\"Content-Style-Type\"\
  \ content=\"text/css\" />\n<meta name=\"google-site-verification\"\ncontent=\"J75b1yb6mDQItzHDxWDph1bNC8rVuc0Oz8gzlj9y8\"\
  \ />\n<title>iPhone Online Course and iPhone Programming Training - Home</title>\n\
  ...\n```\n\n你可以看到从互联网获取数据是简单。如果你在网络地址处有一个属性列表存储的字典（dictionary），你也可以读取它，使用 `dictionaryWithContentsOfURL:`\
  \ 方法。如果它是存储为属性列表的数组（array），则改用 `arrayWithContentsOfURL:` 方法。\n\n\n\n\n以下语句将返回存储在你的应用程序\
  \ bundle 中名为 `instructions.txt` 的文件的路径：\n\n```objc\nNSString *txtFilePath = [[NSBundle\
  \ mainBundle] pathForResource: @\"instructions\" ofType: @\"txt\"];\n```\n\n`mainBundle`\
  \ 方法提供应用程序 bundle 所在的目录。你可以对 Mac OS X 或 iOS 应用程序使用此方法。`pathForResource:ofType:`\
  \ 方法将在该目录内定位指定的文件，并返回该文件的路径。随后，你可以使用如下语句将文件内容读取到你的应用程序中：\n\n```objc\nNSString *instructions\
  \ = [NSString stringWithContentsOfFile: txtFilePath encoding:NSUTF8StringEncoding\
  \ error: NULL];\n```\n\n如果你想在应用程序 bundle 的 `images` 目录中查找所有扩展名为 `jpg` 的 JPEG 图像，可以如下所示使用\
  \ `pathsForResourcesOfType:inDirectory:` 方法：\n\n```objc\nNSArray *birds = [[NSBundle\
  \ mainBundle] pathsForResourcesOfType:@\"jpg\" inDirectory: @\"birdImages\"];\n\
  ```\n\n该方法返回一个路径名称数组。如果你的 JPEG 图片没有存储在应用程序的子目录中，你可以将 `inDirectory:` 参数的值指定为 `@\"\
  \"`。\n\n`NSBundle` 类中还有更多你想要学习的方法。请查阅文档获取详细信息。\n\n### 练习题\n\n1. 修改 程序 16.6 中开发的复制程序，使其能够接受多个源文件并将其复制到目录中，类似于标准的\
