  \ 第 13 章\n¹](#ch13.html_page_01)) 技术上说，它定义在 `NSObjCRuntime.h` 中，该文件在 `Foundation.h`\
  \ 中被导入。\n²](#ch13.html_page_02)) 注意程序中的 `\"A string to be copied.\"` 和 `\"So is\
  \ this.\"`。这些不是对象，而是 C 风格字符串，其特征是前面没有 `@` 符号。如果一个函数期望 `char` 数组作为参数，你可以传递 `char`\
  \ 数组或字面量 C 风格字符串，但不是字符串对象。\n\n### 第 15 章\n¹](#ch15.html_page_01)) 目前，`unichar` 字符占用\
  \ 16 位，但 Unicode 标准提供了更大的字符。因此在未来，`unichar` 字符可能会大于 16 位。底线是永远不要对 Unicode 字符的大小做假设。\n\
  ²](#ch15.html_page_02)) Mac OS X 和 iOS 提供了了整个 Address Book 框架，为处理通讯录提供了极其强大的功能。\n\
  ³](#ch15.html_page_03)) 你可能还想要一个 `initWithName:andEmail:` 初始化方法，但在这里没有显示它。\n⁴](#ch15.html_page_04))\
  \ 一个名为 `sortUsingFunction:context:` 的方法允许你使用函数而不是方法来执行比较。\n⁵](#ch15.html_page_05))\
  \ 一个更通用的方法可以调用每个对象的 `description` 方法来显示集合中的每个成员。这将允许包含任何类型对象的集合以可读的格式显示。另外注意，你只需调用一次\
  \ `NSLog` 并使用“打印对象”格式化字符 `\"%@\"` 即可显示任何集合的内容。\n\n"
