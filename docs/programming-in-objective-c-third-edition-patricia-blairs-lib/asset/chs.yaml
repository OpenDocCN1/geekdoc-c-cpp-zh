  \ in C* (Sams, 2004)、*Programming in ANSI C* (Sams, 1994) 和 *Topics in C Programming*\
  \ (Wiley, 1991)，以及几本 Unix 相关书籍，包括*Exploring the Unix System* (Sams, 1992) 和 *Unix\
  \ Shell Programming* (Sams, 2003)。自 1984 年第一台 Mac 推出以来他一直在 Macintosh 电脑上编程，并作为 Apple\
  \ Press Library 的编写了 *Programming C for the Mac*。2003 年，Kochan 编写了*Programming in\
  \ Objective-C* (Sams, 2003)，随后又出了另一本与 Mac 相关的书籍*Beginning AppleScript* (Wiley, 2004)。\n\
  \n# 关于技术审核员\n**Wendy Mui** 是旧金山湾的一名程序员和软件开发经理。在从 Steve Kochan 书的第二版中学习 Objective-C\
  \ 后，她在 Bump Technologies 找到了工作，在那里她利用自己的编程技能开发 Bump 的客户端应用以及为第三方开发者提供的 API/SDK。在拥有\
  \ iOS 经验之前，Wendy 曾在硅谷和旧金山的其他各种科技公司度过成长阶段。她在加利福尼亚大学伯克利分校获得数学学士学位时迷上了编程。在不工作时，Wendy\
  \ 正在追求她的四段跆拳道黑带。\n\n**Michael Trent** 自 1997 年起一直使用 Objective-C 编程——在此之前就开始为 Mac\
  \ 编程了。他是 Steven Frank 的网站 `www.cocoadev.com` 的经常贡献者，是许多书籍和杂志文章的技术审核员，也是 Mac OS X\
  \ 开源项目的偶尔参与者。目前，他正在使用 Objective-C 和苹果计算机的 Cocoa 框架为 Mac OS X 构建专业的视频应用。Michael 拥有威斯康星州博莱特学院（Beloit\
  \ College）的计算机科学学士学位和音乐学士学位。他住在加利福尼亚州圣克拉拉，与他可爱的妻子 Angela 在一起。\n\n# 我们想听听你的意见！\n\
