  \ 的定义，你会发现你从未定义过这样的方法。`initVar` 是定义在 `ClassA` 中的，而因为 `ClassA` 是 `ClassB` 的父类，`ClassB`\
  \ 可以使用 `ClassA` 的所有方法。因此，对于 `ClassB` 而言，`initVar` 是一个*继承的*方法。\n\n* * *\n\n### 注意\n\
  \n我们目前为止简要提到了这一点，但 `alloc` 和 `init` 是你一直以来使用的方法，它们从未在你的类中被定义过。这是因为你利用了它们是从 `NSObject`\
  \ 类继承的方法这一事实。\n\n* * *\n\n向 `b` 发送 `initVar` 消息后，你调用了 `printVar` 方法来显示实例变量 `x` 的值。`x\
  \ = 100` 的输出确认了 `printVar` 能够访问该实例变量。这是因为与 `initVar` 方法一样，它是被继承的。\n\n记住，继承的概念一直适用于链的末端。所以，如果你定义了一个名为\
  \ `ClassC` 的新类，其父类是 `ClassB`，如下所示\n\n```objc\n@interface ClassC: ClassB;\n   ...\n\
  @end\n```\n\n那么 `ClassC` 将继承 `ClassB` 的所有方法和实例变量，而这些又继承了 `ClassA` 的所有方法和实例变量，继而继承了\
  \ `NSObject` 的所有方法和实例变量。\n\n务必理解，类的每个实例都有它们自己的实例变量，即使它们是继承来的。因此，一个 `ClassC` 对象和一个\
  \ `ClassB` 对象将各自拥有它们相互不同的实例变量。\n\n### 寻找正确的方法\n\n当你向一个对象发送消息时，你可能会好奇如何选择正确的方法来应用于该对象。规则实际上非常简单。首先检查对象所属的类，查看该类中是否显式定义了特定名称的方法。如果是，则使用该方法。如果那里没有定义，则检查父类。如果父类中定义了，则使用该方法。如果还没有，则继续搜索。\n\
  \n会一直检查父类，直到发生两种情况之一：要么你找到了包含指定方法的类，要么在回溯到根类后仍未找到该方法。如果发生第一种，你就搞定了；如果发生第二种，你就遇到了问题，并会生成如下所示的警告消息：\n\
  \n```\nwarning: 'ClassB' may not respond to '-inity'\n```\n\n在这种情况下，你无意中尝试向一个类型为类\
  \ `ClassB` 的变量发送名为 `inity` 的消息。编译器告诉你，来自该类的对象不知道如何响应此类方法。同样，这是在检查了 `ClassB` 的方法及其回溯到根类的父类方法（在本例中是\
  \ `NSObject`）后确定的。\n\n你将在第 9 章“多态、动态类型和动态绑定”中学习更多关于系统如何检查执行正确方法的内容。\n\n### 通过继承进行扩展：添加新方法\n\
  \n继承经常用于扩展类。例如，假设你刚刚被分配了任务，开发一些用于处理 2D 图形对象（如矩形、圆形和三角形）的类。目前，我们只关注矩形。回到第 4 章“数据类型和表达式”中的练习\
  \ 7，从该示例的 `@interface` 部分开始：\n\n```objc\n@interface Rectangle: NSObject\n\n{\n \
  \  int width;\n   int height;\n}\n@property int width, height;\n-(int) area;\n-(int)\
  \ perimeter;\n@end\n```\n\n你将拥有`*合成方法*](#apa.html_gloss01_099)来设置矩形的宽度和高度并返回这些值，以及你自己的方法来计算它的面积和周长。让我们添加一个方法，允许通过同一个消息调用同时设置矩形的宽度和高度，如下：\n\
  \n```objc\n-(void) setWidth: (int) w andHeight: (int) h;\n```\n\n假设你将这个新类声明在一个名为\
  \ `Rectangle.h` 的文件中。以下是实现文件 `Rectangle.m` 可能的样子：\n\n```objc\n#import \"Rectangle.h\"\
  \n\n@implementation Rectangle\n\n@synthesize width, height;\n\n-(void) setWidth:\
  \ (int) w andHeight: (int) h\n{\n    width = w;\n    height = h;\n}\n\n-(int) area\n\
  {\n    return width * height;\n}\n\n-(int) perimeter\n{\n    return (width + height)\
  \ * 2;\n}\n\n@end\n```\n\n每个方法的定义都足够简单。程序 8.2 展示了一个测试它的 `main` 例程。\n\n**程序 8.2**\n\
  \n* * *\n\n```objc\n#import \"Rectangle.h\"\n\nint main (int argc, char *argv[])\n\
  {\n    NSAutleasePool *pool = [NSAutleasePool pool];\n    Rectangle *myRect = [[Rectangle\
  \ alloc] init];\n    [myRect setWidth:5 andHeight:8];\n    NSLog(@\"Rectangle: w\
  \ = %i, h = %i\", myRect.width, myRect.height]);\n    NSLog(@\"Area = %i\", [myRect\
  \ area]);\n    NSLog(@\"Perimeter = %i\", [myRect perimeter]);\n    [myRect release];\n\
  \    [pool drain];\n    return 0;\n}\n```\n\n**程序 8.2 输出**\n\n* * *\n\n```\nRectangle:\
  \ w = 5, h = 8\nArea = 40\nPerimeter = 26\n```\n\n\n\n\n\n```objc\n#import <Foundation/Foundation.h>\n\
  \nint main (int argc, char *argv[])\n{\n    NSAutoreleasePool * pool = [[NSAutoreleasePool\
  \ alloc] init];\n    Square *mySquare = [[Square alloc] init];\n    [mySquare setSide:\
  \ 5];\n    NSLog (@\"Square s = %i\", [mySquare side]);\n    NSLog (@\"Area = %i,\
  \ Perimeter = %i\",\n        [mySquare area], [mySquare perimeter]);\n    [mySquare\
  \ release];\n    [pool drain];\n    return 0;\n}\n```\n\n* * *\n\n**程序 8.3 输出**\n\
  \n* * *\n\nSquare s = 5\n\nArea = 25, Perimeter = 20\n\n* * *\n\n你定义 `Square` 类的方法是\
  \ Objective-C 中处理类的一项基本技术：扩展你或他人已经完成的工作以适应你的需求。此外，一种名为 `categories`（分类扩展）的机制允许你以模块化的方式向现有类定义中添加新方法——也就是说，无需不断向同一个接口和实现文件中添加新的定义。当你想要对一个无法访问源代码的类进行此操作时，这特别方便。你将在[第\
  \ 11 章]“分类与协议”中学习分类扩展。\n\n### Point 类与内存分配\n\n`Rectangle` 类只存储矩形的尺寸。在真实世界的图形应用程序中，你可能需要跟踪各种额外信息，例如矩形的填充颜色、线条颜色、在窗口内的位置（原点）等。你可以轻松地扩展你的类来实现这些功能。现在，让我们来处理矩形原点的概念。假设“原点”意味着矩形在某个笛卡尔坐标系\
  \ (x, y) 中的左下角位置。如果你正在编写一个绘画程序，这个点可能代表矩形在窗口内的位置，如图 8.4 所示。\n\n**图 8.4. 在窗口中绘制的矩形**\n\
  \n![image](img/08fig04.jpg)\n\n在图 8.4 中，矩形的原点显示在 (x[1], y[1])。\n\n你可以扩展 `Rectangle`\
  \ 类，将矩形原点的 x、y 坐标存储为两个独立的值。或者你可能会发现，在开发图形应用程序时，必须处理大量的坐标，因此决定定义一个名为 `XYPoint` 的类（你可能在第\
  \ 3 章第 7 题中遇到过这个问题）：\n\n```objc\n#import <Foundation/Foundation.h>\n\n@interface\
  \ XYPoint: NSObject\n{\n    int x;\n    int y;\n}\n@property int x, y;\n\n-(void)\
  \ setX: (int) xVal andY: (int) yVal;\n@end\n```\n\n现在让我们回到你的 `Rectangle` 类。你想能够存储矩形的原点，因此你会在\
  \ `Rectangle` 类的定义中添加另一个名为 `origin` 的实例变量：\n\n```objc\n@interface Rectangle: NSObject\n\
  {\n    int width;\n    int height;\n    XYPoint *origin;\n}\n...\n```\n\n添加一个方法来设置和获取矩形的原点是合理的。为了说明一个重要的点，我们现在不会为\
  \ `origin` 合成访问器方法。相反，我们将自己编写它们。\n\n### @class 指令\n\n现在你可以处理矩形（以及正方形！）了并且能够设置它们的宽度、高度和原点。首先，让我们完整查看你的\
  \ `Rectangle.h` 接口文件：\n\n```objc\n#import <Foundation/Foundation.h>\n\n@class XYPoint;\n\
  \n@interface Rectangle: NSObject\n{\n    int width;\n    int height;\n    XYPoint\
  \ *origin;\n}\n@property int width, height;\n\n-(XYPoint *) origin;\n-(void) setOrigin:\
  \ (XYPoint *) pt;\n-(void) setWidth: (int) w andHeight: (int) h;\n-(int) area;\n\
  -(int) perimeter;\n@end\n```\n\n你在 `Rectangle.h` 头文件中使用了一个新指令：\n\n`@class XYPoint;`\n\
  \n你需要它是因为编译器在遇到 `XYPoint` 且它是为 `Rectangle` 定义的实例变量之一时，需要知道 `XYPoint` 是什么。类名也分别用于你的\
  \ `setOrigin:` 和 `origin` 方法的参数和返回类型声明。你也有另一个选择。你可以改为导入头文件，如下所示：\n\n`#import \"\
  XYPoint.h\"`\n\n使用 `@class` 指令更高效，因为编译器不需要导入并处理整个 `XYPoint.h` 文件（即使它很小）；它只需要知道 `XYPoint`\
  \ 是一个类的名称。如果你需要引用 `XYPoint` 的某个类方法（例如在实现中），`@class` 指令是不够的，因为编译器需要更多信息；它需要知道方法接受多少参数、它们的类型是什么，以及方法的返回类型是什么。\n\
  \n所以请确保你理解这里 `@class` 指令的使用。它只是告诉编译器 `XYPoint` 是一个类的名称。这样，当它看到这一行时：\n\n`XYPoint\
  \ *origin;`\n\n它就知道 `origin` 是一个来自 `XYPoint` 类的对象。这就是编译器需要知道的所有。\n\n让我们为你的 `XYPoint`\
  \ 类和 `Rectangle` 类填空空白，这样你就可以在程序测试它们。8.4 显示了 `Rectangle` 类的实现文件。8.4 显示了 `Rectangle`\
  \ 类的新方法。\n\n**Rectangle.m 增加的方法**\n\n```objc\n#import \"Rectangle.h\"\n\n-(void)\
  \ setOrigin: (XYPoint *) pt\n{\n    origin = pt;\n}\n-(XYPoint *) origin\n{\n  \
  \  return origin;\n}\n@end\n```\n\n接下来是 `XYPoint` 类和 `Rectangle` 类的定义，紧接着是用于测试它们的程序。\n\
  \n**XYPoint.h 接口文件**\n\n```objc\n#import <Foundation/Foundation.h>\n\n@interface\
  \ XYPoint: NSObject\n{\n    int x;\n    int y;\n}\n@property int x, y;\n\n-(void)\
  \ setX: (int) xVal andY: (int) yVal;\n@end\n```\n\n**XYPoint.m 实现文件**\n\n```objc\n\
  #import \"XYPoint.h\"\n\n@implementation XYPoint\n@synthesize x, y;\n\n-(void) setX:\
  \ (int) xVal andY: (int) yVal\n{\n    x = xVal;\n    y = yVal;\n}\n@end\n```\n\n\
  **Rectangle.h 接口文件**\n\n```objc\n#import <Foundation/Foundation.h>\n\n@class XYPoint;\n\
  \n@interface Rectangle: NSObject\n{\n    int width;\n    int height;\n    XYPoint\
  \ *origin;\n}\n@property int width, height;\n\n-(XYPoint *) origin;\n-(void) setOrigin:\
  \ (XYPoint *) pt;\n-(void) setWidth: (int) w andHeight: (int) h;\n-(int) area;\n\
  -(int) perimeter;\n@end\n```\n\n**Rectangle.m 实现文件**\n\n```objc\n#import \"Rectangle.h\"\
  \n\n@implementation Rectangle\n@synthesize width, height;\n\n-(void) setWidth: (int)\
  \ w andHeight: (int) h\n{\n    width = w;\n    height = h;\n}\n-(void) setOrigin:\
  \ (XYPoint *) pt\n{\n    origin = pt;\n}\n-(int) area\n{\n    return width * height;\n\
  }\n-(int) perimeter\n{\n    return (width + height) * 2;\n}\n-(XYPoint *) origin\n\
  {\n    return origin;\n}\n@end\n```\n\n**8.4 测试程序**\n\n```objc\n#import \"Rectangle.h\"\
  \n#import \"XYPoint.h\"\n\nint main (int argc, char *argv[])\n{\n    NSAutoreleasePool\
  \ * pool = [[NSAutoreleasePool alloc] init];\n    Rectangle *myRect = [[Rectangle\
  \ alloc] init];\n    XYPoint *myPoint = [[XYPoint alloc] init];\n    [myPoint setX:\
  \ 100 andY: 200];\n    [myRect setWidth: 5 andHeight: 8];\n    myRect.origin = myPoint;\n\
  \    NSLog (@\"Rectangle w = %i, h = %i\", myRect.width, myRect.height);\n    NSLog\
  \ (@\"Origin at (%i, %i)\",myRect.origin.x, myRect.origin.y);\n    NSLog (@\"Area\
  \ = %i, Perimeter = %i\",\n        [myRect area], [myRect perimeter]);\n    [myRect\
  \ release];\n    [myPoint release];\n    [pool drain];\n    return 0;\n}\n```\n\n\
  \n\n\n在 `main` 例程中，你分配并初始化了一个标识为 `myRect` 的矩形和一个名为 `myPoint` 的点。使用 `setX:andY:`\
  \ 方法，你将 `myPoint` 设置为 `(100, 200)`。在将矩形的宽度和高度分别设置为 `5` 和 `8` 后，你调用了 `setOrigin`\
  \ 方法将矩形的原点设置为 `myPoint` 所指向的点。随后，三个 `NSLog` 调用获取并打印了这些值。该表达式\n\n```\nmyRect.origin.x\n\
  ```\n\n获取访问器方法 `origin` 返回的 `XYPoint` 对象，并应用点运算符来获取矩形原点的 x 坐标。类似地，下面的表达式获取了矩形原点的\
  \ y 坐标：\n\n```\nmyRect.origin.y\n```\n\n### 拥有其对象的类\n\n你能解释 程序 8.5 的输出吗？\n\n**程序\
  \ 8.5**\n\n***\n\n```objectivec\n#import \"Rectangle.h\"\n\n#import \"XYPoint.h\"\
  \n\nint main (int argc, char *argv[])\n{\n    NSAutoreleasePool * pool = [[NSAutoreleasePool\
  \ alloc] init];\n    Rectangle *myRect = [[Rectangle alloc] init];\n    XYPoint\
  \   *myPoint = [[XYPoint alloc] init];\n    [myPoint setX: 100 andY: 200];\n   \
  \ [myRect setWidth: 5 andHeight: 8];\n    myRect.origin = myPoint;\n    NSLog (@\"\
  Origin at (%i, %i)\", myRect.origin.x, myRect.origin.y);\n    [myPoint setX: 50\
  \ andY: 50];\n    NSLog (@\"Origin at (%i, %i)\", myRect.origin.x, myRect.origin.y);\n\
  \    [myRect release];\n    [myPoint release];\n    [pool drain];\n    return 0;\n\
  }\n```\n\n***\n\n**程序 8.5 输出**\n\n***\n\nOrigin at (100, 200)\n\nOrigin at (50,\
  \ 50)\n\n***\n\n你在程序中将 `myPoint` 从 `(100, 200)` 改为了 `(50, 50)`，显然这也改变了矩形的原点！但为什么会发生这种情况？你并没有显式地重置矩形的原点，为什么矩形的原点会改变呢？回到\
  \ `setOrigin:` 方法的定义，也许你会发现原因：\n\n```objectivec\n-(void) setOrigin: (XYPoint *)\
  \ pt\n{\n    origin = pt;\n}\n```\n\n当使用以下表达式调用 `setOrigin:` 方法时\n\n```\nmyRect.origin\
  \ = myPoint;\n```\n\n`myPoint` 的值被作为参数传递给方法。该值指向此 `XYPoint` 对象在内存中的存储位置，如图 8.5\n\
  \n存储在 `myPoint` 内部的值（指向内存的指针）被复制到方法内部定义的局部变量 `pt` 中。现在 `pt` 和 `myPoint` 都引用内存中存储的相同数据。图\
  \ 8.6 说明了这一点。\n\n**图 8.6 将矩形的原点传递给方法**\n\n![image](img/08fig06.jpg)\n\n当方法内部将 `origin`\
  \ 变量设置为 `pt` 时，存储在 `pt` 内部的指针被复制到实例变量 `origin` 中，如图 8.7 所示。\n\n**图 8.7 设置矩形的原点**\n\
  \n![image](img/08fig07.jpg)\n\n由于 `myPoint` 和存储在 `myRect` 中的 origin 变量引用内存中的同一区域（局部变量\
  \ `pt` 也是如此），当你随后将 `myPoint` 的值改为 `(50, 50)` 时，矩形的原点也随之改变了。\n\n你可以通过修改 `setOrigin:`\
  \ 方法来避免这个问题，使其分配自己的点并将 `origin` 设置为该点。如下所示：\n\n```objectivec\n-(void) setOrigin:\
  \ (XYPoint *) pt\n{\n    if (! origin)\n        origin = [[XYPoint alloc] init];\n\
  \    origin.x = pt.x;\n    origin.y = pt.y;\n}\n```\n\n该方法首先测试实例变量 `origin` 是否非零（请确保你理解该测试以及所使用的逻辑非运算符\
  \ `!`）。记住，所有实例变量最初都设置为零。因此，当分配一个新的 `Rectangle` 对象时，包括 `origin` 在内的实例变量将被设置为零。\n\n\
  如果 `origin` 为零，`setOrigin:` 方法将分配一个新的 `XYPoint`并将 `origin` 设置为该点。`origin` 方法返回 `XYPoint`\
  \ 对象，并使用点运算符获取矩形原点的 x 坐标。\n\n\n\n\n你认为这段代码执行后，`myRect` 的原点会发生什么变化？对，它的原点会变为 (200,\
  \ 300)。getter 返回的原点对象是“脆弱的”。任何人更改其 `x` 或 `y` 值都会相应地改变矩形的 `x` 或 `y` 值。出于这个原因，编写一个返回对象的\
  \ getter 最安全的方法实际上是为该对象创建一个副本并返回该副本。这样，你就可以保护实例变量不被无意修改。我们在这里不会进行此更改，而是将其留作你的一项练习。请注意，如果你在返回对象之前对其复制，将会面临性能开销。在设计类时，你需要判断这种权衡是否值得。\n\
  \n## 重写方法\n\n我们在在本章早些时候提到，你无法通过继承来移除或减去方法。然而，你可以通过`重写`（overriding）来改变被继承方法的定义。\n\
  \n回到你的两个类 `ClassA` 和 `ClassB`，假设你想为 `ClassB` 编写你自己的 `initVar` 方法。你已经知道 `ClassB`\
  \ 将继承在 `ClassA` 中定义的 `initVar` 方法，但你是否可以创建一个同名的方法来替换被继承的方法？答案是肯定的，你只需简单定义一个同名的新方法即可。与父类同名定义的方法将替换或重写被继承的定义。你的新方法必须与你正在重写的方法具有相同的返回类型，并带有相同数量和类型的参数。\n\
  \n程序 8.6 显示了一个简单的示例，用来阐明这一概念。\n\n### 程序 8.6\n\n```objectivec\n// Overriding Methods\n\
  \n#import <Foundation/Foundation.h>\n\n// ClassA 声明和定义\n\n@interface ClassA: NSObject\n\
  {\n   int x;\n}\n\n-(void) initVar;\n\n@end\n\n////////////////------------\n\n\
  @implementation ClassA\n\n-(void) initVar\n{\n    x = 100;\n}\n\n@end\n\n// ClassB\
  \ 声明和定义\n\n@interface ClassB: ClassA\n\n-(void) initVar;\n\n-(void) printVar;\n\n\
  @end\n\n////////////////------------\n\n@implementation ClassB\n\n-(void) initVar\
  \    // added method\n{\n    x = 200;\n}\n\n-(void) printVar\n{\n    NSLog (@\"\
  x = %i\", x);\n}\n\n@end\n\n////////////////------------\n\nint main (int argc,\
  \ char *argv[])\n{\n    NSAutoreleasePool * pool = [[NSAutoreleasePool alloc] init];\n\
  \    ClassB  *b = [[ClassB alloc] init];\n    [b initVar];  // uses overriding method\
  \ in B\n    [b printVar];  // reveal value of x;\n    [b release];\n    [pool drain];\n\
  \    return 0;\n}\n```\n\n### 程序 8.6 输出\n\n```\nx = 200\n```\n\n显然，消息 `[b initVar];`\
  \ 导致使用了在 `ClassB` 中定义的 `initVar` 方法，而不是像上一个示例那样使用 `ClassA` 中定义的那个。图 8.9 插释了这一点。\n\
  \n**图 8.9. 重写 `initVar` 方法**\n\n![image](img/08fig09.jpg)\n\n### 选择了哪个方法？\n\n我们已经涵盖了系统如何沿层级向上查找以应用于对象的方法。如果你在不同的类中拥有同名方法，则将根据消息接收者的类来选择正确的方法。程序\
  \ 8.7 使用了与相同的 `ClassA` 和 `ClassB` 类定义。\n\n### 程序 8.7\n\n```objectivec\n#import <Foundation/Foundation.h>\n\
  \n// 在此处插入 ClassA 和 ClassB 的定义\n\nint main (int argc, char *argv[])\n{\n    NSAutoreleasePool\
  \ * pool = [[NSAutoreleasePool alloc] init];\n    ClassA  *a = [[ClassA alloc] init];\n\
  \    ClassB  *b = [[ClassB alloc] init];\n    [a initVar];    // uses ClassA method\n\
  \    [a printVar];  // reveal value of x;\n    [b initVar];  // use overriding ClassB\
  \ method\n    [b printVar];  // reveal value of x;\n    [a release];\n    [b release];\n\
  \    [pool drain];\n    return 0;\n}\n```\n\n当你编译此程序时，会收到此警告消息：\n`warning: 'ClassA'\
  \ may not respond to '-printVar'`\n\n这里发生了什么？我们在之前的章节中讨论过这一点。请看 `ClassA` 的声明和定义：\n\
  \n```objectivec\n// ClassA 声明和定义\n@interface ClassA: NSObject\n{\n   int x;\n}\n\
  \n-(void) initVar;\n\n@end\n```\n\n注意，`ClassB` 继承了 `ClassA` 的 `initVar` 方法，但它没有\
  \ `printVar` 方法。如果你尝试对 `ClassA` 实例调用 `[a printVar]`，它将失败，因为 `ClassA` 没有定义它。\n\n\
  ### 重要规则\n\n- 不要修改内容的语义。\n- 不要删除有价值的信息。\n- 确保输出是标准的 Markdown 格式。\n- 输出应包含在 `[content]...[/content]`\
  \ 中。\n\n\n\n因此，为你的 `Rectangle` 类重写 `dealloc` 方法的策略是：首先释放 `origin` 占用的内存，然后调用父类的\
  \ `dealloc` 方法来完成后续工作。以下是新方法：\n\n```objc\n-(void) dealloc\n{\n   if (origin)\n \
  \     [origin release];\n\n   [super dealloc];\n}\n```\n\n`dealloc` 方法定义为没有返回值。在\
  \ `dealloc` 方法内部，会在释放 `origin` 之前进行测试，检查它是否为非零。矩形的起点可能从未被设置过；在这种情况下，它的默认值为 0。然后，我们调用父类的\
  \ `dealloc` 方法，这正是 `Rectangle` 类在没有被重写时本应继承的方法。\n\n你也可以用更简单的方式编写 `dealloc` 方法：\n\
  \n```objc\n-(void) dealloc\n{\n   [origin release];\n   [super dealloc];\n}\n```\n\
  \n因为向 `nil`（零）对象发送消息是安全的。此外，你很小心地在这里是 `release` origin 而不是 `dealloc` 它。如果没有其他地方在使用\
  \ `origin`，那么该 `release` 消息最终会调用 `origin` 的 `dealloc` 方法来释放它的空间。\n\n有了这个新方法，你现在只需要释放你分配的矩形，而无需担心它们包含的\
  \ `XYPoint` 对象。在程序 8.5 中显示的两个 `release` 消息现在足以释放你在程序中分配的所有对象，包括由 `setOrigin:` 创建的\
  \ `XYPoint` 对象：\n\n```objc\n[myRect release];\n[myPoint release];\n```\n\n## 通过继承扩展：添加新的实例变量\n\
  \n你不仅可以通过添加新方法来有效扩展类的定义，还可以添加新的实例变量。在这两种情况下，其效果都是累积的。你永远无法通过继承来删减方法或实例变量；你只能添加——或者，对于方法来说，是添加或重写。\n\
  \n让我们回到你简单的 `ClassA` 和 `ClassB` 类并做一些更改。为 `ClassB` 添加一个新的新实例变量 `y`，如下所示：\n\n```objc\n\
  @interface ClassB: ClassA\n{\n   int  y;\n}\n\n-(void) printVar;\n@end\n```\n\n\
  尽管根据之前的声明，`ClassB` 似乎只有一个名为 `y` 的实例变量，但它实际上有两个：它继承了来自 `ClassA` 的变量 `x`，并添加了自己的自己的实例变量\
  \ `y`。\n\n***\n\n### 注意\n\n当然，它还拥有继承自 `NSObject` 类的实例变量，但我们目前选择忽略这个细节。\n\n***\n\n\
  让我们把这些内容整合到一个简单的示例中来阐明这一概念（参见程序 8.8）。\n\n**程序 8.8**\n\n***\n\n```objc\n// 实例变量的扩展\n\
  #import <Foundation/Foundation.h>\n\n// Class A 的声明与定义\n@interface ClassA: NSObject\n\
  {\n   int  x;\n}\n-(void) initVar;\n@end\n\n@implementation ClassA\n-(void) initVar\n\
  {\n   x = 100;\n}\n@end\n\n// ClassB 的声明与定义\n@interface ClassB: ClassA\n{\n   int\
  \  y;\n}\n-(void)  initVar;\n-(void)  printVar;\n@end\n\n@implementation ClassB\n\
  -(void) initVar\n{\n   x = 200;\n   y = 300;\n}\n-(void) printVar\n{\n   NSLog (@\"\
  x = %i\", x);\n   NSLog (@\"y = %i\", y);\n}\n@end\n\nint main (int argc, char *argv[])\n\
  {\n   NSAutoreleasePool * pool = [[NSAutoreleasePool alloc] init];\n   ClassB *b\
  \ = [[ClassB alloc] init];\n   [b initVar];  // 使用 ClassB 中的重写方法\n   [b printVar];\
  \  // 显示 x 和 y 的值\n   [b release];\n   [pool drain];\n\n   return 0;\n}\n```\n\n\
  ***\n\n**程序 8.8 输出**\n\n***\n\nx = 200\ny = 300\n\n***\n\n`ClassB` 对象 `b` 是通过调用\
  \ `ClassB` 内部定义的 `initVar` 方法初始化的。回想该方法重写了 `ClassA` 的 `initVar` 方法。该方法还将将 `x`（继承自\
  \ `ClassA`）的值设置为 `200`，并将 `y`（在 `ClassB` 中定义）的值设置为 `300`。接下来，使用 `printVar` 方法来显示这两个实例变量的值。\n\
  \n在响应消息时选择正确方法的想法中，还有许多许多微妙之处。（此处原文存在大量重复，翻译已清理）。\n\n你不仅可以通过添加新方法来有效扩展类的定义，还可以添加新的实例变量。在这两种情况下，其效果都是累积的。你永远无法通过继承来删减方法或实例变量；你只能添加——或者，对于方法，是添加或重写。\n\
  \n`ClassB` 对象 `b` 是通过调用 `ClassB` 内部定义的 `initVar` 方法初始化的。回想该方法重写了 `ClassA` 的 `initVar`\
  \ 方法。该方法还将 `x`（继承自 `ClassA`）的值设置为 `200`，并将 `y`（在 `ClassB` 中定义）的值设置为 `300`。接下来，使用\
  \ `printVar` 方法来显示这两个实例变量的值。\n\n## 抽象类\n\n有什么比这些术语来更好地结束本章呢？我们在这里引入它。\n\n那么，你为什么想要创建一个子类？\n\
  1. 你想通过添加某些方法来扩展类的功能。\n2. 你想创建一个类的特殊版本。\n3. 你需要通过重写某些方法来改变默认行为。\n\n`NSNumber` 类拥有所有数字类型的通用接口。\n\
  \n实际上，这可能看起来有点“抽象”（抱歉）；不用担心——在这里掌握基本概念即可。\n\n### 练习\n\n1. 添加一个名为 `ClassC` 的新类，它是\
  \ `ClassB` 的子类，参见程序 8.1。编写一个 `initVar` 方法将其实例变量 `x` 的值设置为 `300`。编写一个测试程序，声明 `ClassA`、`ClassB`\
  \ 和 `ClassC` 对象并调用它们相应的 `initVar` 方法。\n\n2. 处理高分辨率设备时，你可能需要使用允许指定浮点值而非简单整数的坐标系（iOS\
  \ 使用 `CGRect` 结构来处理矩形。在这种情况下，所有坐标和大小都以浮点数表示）。修改本章中的 `XYPoint` 和 `Rectangle` 类以处理浮点数。\n\
  \n\n\n\n### 4. 为 `Rectangle` 类编写一个名为 `translate:` 的方法，接受一个 `XYPoint` 对象作为参数。让矩形的原点根据指定的向量进行移动。注意：移动意味着将点从一个位置移动到另一个位置。\n\
  \n### 5. 定义一个名为 `GraphicObject` 的新类，并使其成为 `NSObject` 的子类。在你的新类中定义如下实例变量：\n\n```objc\n\
  int  fillColor;    // 32 位颜色\nBOOL filled;        // 对象是否被填充？\nint  lineColor; \
  \   // 32 位线条颜色\n```\n\n编写方法来设置和获取之前定义的变量。\n\n将 `Rectangle` 类设为 `GraphicObject`\
  \ 的子类。\n\n定义新类 `Circle` 和 `Triangle`，它们也是 `GraphicObject` 的子类。编写方法来设置和获取这些对象的各种参数，并计算圆的周长和面积，以及三角形的周和面积。\n\
  \n### 6. 为 `Rectangle` 类编写一个名为 `containsPoint:` 的方法，接受一个 `XYPoint` 对象作为参数：\n\n```objc\n\
  -(BOOL) containsPoint: (XYPoint *) aPoint;\n```\n\n如果矩形包含指定的点，则该方法返回 `BOOL` 值 `YES`，如果不包含则返回\
  \ `NO`。\n\n### 7. 为 `Rectangle` 类编写一个名为 `intersect:` 的方法，接受一个矩形作为参数并返回一个表示两个矩形重叠区域的矩形。例如，给定图\
  \ 8.10 所示两个矩形，该方法应返回一个原点位于 `(400, 420)`、宽度为 `50`且高度为 `60`的矩形。\n\n**图 8.10. 相交的矩形**\n\
  \n![image](img/08fig10.jpg)\n\n如果矩形不相交，返回一个宽度和高度均为零且原点位于 `(0,0)`的矩形。\n\n### 8. 为\
  \ `Rectangle` 类编写一个名为 `draw` 的方法，使用破线和垂直线字符绘制矩形。以下代码序列\n\n```objc\nRectangle *myRect\
  \ = [[Rectangle alloc] init];\n[myRect setWidth: 10 andHeight: 3];\n[myRect draw];\n\
  [myRect release];\n```\n\n将产生以下输出：\n\n```\n----------\n|          |\n|         \
  \ |\n|          |\n----------\n```\n\n> **注意**：你应该使用 `printf` 来绘制你的字符，因为 `NSLog`\
  \ 每次被调用时都会显示新行。\n\n***\n\n## 第 9 章. 多态、动态类型和动态绑定\n\n在本章中，你将学习 Objective-C 语言的特性，这些特性使其成为一种如此强大的编程语言，并将其与其他一些面向对象的编程语言（如\
  \ C++）区分开来。本章描述了三个核心概念：多态、动态类型和动态绑定。多态 允许开发程序，使得来自不同类的对象可以定义具有相同名称的方法。动态类型 将对象所属类的确定确定推迟到程序执行时。动态绑定\
  \ 将在对象上要调用的实际方法的确定推迟到程序运行期间。\n\n### 多态：同名，异类\n\n程序 9.1 显示了名为 `Complex` 的类的接口文件，它用于在程序中表示复数。\n\
  \n**程序 9.1 接口文件 `Complex.h`**\n\n***\n\n```objc\n// Complex 类的接口文件\n#import <Foundation/Foundation.h>\n\
  \n@interface Complex: NSObject\n\n{\n    double real;\n    double imaginary;\n}\n\
  @property double real, imaginary;\n\n-(void) print;\n-(void) setReal: (double) a\
  \ andImaginary: (double) b;\n-(Complex *) add: (Complex *) f;\n@end\n```\n\n***\n\
  \n你应该已经完成了第 7 章“类的进阶”中练习 6 和 7 true 类的实现部分。我们添加了额外的 `setReal:andImaginary:` 方法，以便你通过一条消息同时设置数的实部和虚部，并合成了访问器方法。如下所示。\n\
  \n**程序 9.1 实现文件 `Complex.m`**\n\n***\n\n```objc\n// Complex 类的实现文件\n#import \"Complex.h\"\
  \n\n@implementation Complex\n\n@synthesize real, imaginary;\n\n-(void) print\n{\n\
  \    NSLog (@\" %g + %gi \", real, imaginary);\n}\n\n-(void) setReal: (double) a\
  \ andImaginary: (double) b\n{\n    real = a;\n    imaginary = b;\n}\n\n-(Complex\
  \ *) add: (Complex *) f\n{\n    Complex *result = [[Complex alloc] init];\n    result.real\
  \ = real + f.real;\n    result.imaginary = imaginary + f.imaginary;\n    return\
  \ result;\n}\n@end\n```\n\n***\n\n**程序 9.1 测试 `main.m`**\n\n***\n\n```objc\n// 共享名称：多态\n\
  #import \"Fraction.h\"\n#import \"Complex.h\"\n\nint main (int argc, char *argv[])\n\
  {\n    NSoreleasePool * pool = [[AutoreleasePool alloc] init];\n\n    Fraction *f1\
  \ = [[Fraction alloc] initWithReal:1 imaginary:2];\n    Fraction *f2 = [[Fraction\
  \ alloc] initWithReal:3 imaginary:4];\n    Fraction *fracResult = [f1 add: f2];\n\
  \    printf(\"Fraction: %g + %gi\\n\", fracResult.real, fracResult.imaginary);\n\
  \n    Complex *c1 = [[Complex alloc] initWithReal:1 imaginary:2];\n    Complex *c2\
  \ = [[Complex alloc] initWithReal:3 imaginary:4];\n    Complex *compResult = [c1\
  \ add: c2];\n    printf(\"Complex: %g + %gi\\n\", compResult.real, compResult.imaginary);\n\
  \n    [pool drain];\n    return 0;\n}\n```\n\n***\n\n**程序 9.1 输出**\n\n***\n\n```\n\
  Fraction: 4 + 6i\nComplex: 4 + 6i\n```\n***\n\n\n\n\n\n第 4 章 简要介绍了 `id` 数据类型，并指出它是一个通用的对象类型。这意味着，`id`\
  \ 可以用于存储属于任何类的对象。这种数据类型的真正威力体现在程序执行期间，通过通过这种方式在变量中存储不同类型的对象。请研究程序 9.2 及其相关的输出。\n\
  \n### 程序 9.2. 测试程序 `main.m`\n\n* * *\n\n```objc\n// 演示动态类型与绑定\n#import \"Fraction.h\"\
  \n\n#import \"Complex.h\"\n\nint main (int argc, char *argv[])\n{\n    NSAutoreleasePool\
  \ * pool = [[NSAutoreleasePool alloc] init];\n    id    dataValue;\n    Fraction\
  \ *f1 = [[Fraction alloc] init];\n    Complex  *c1 = [[Complex alloc] init];\n \
  \   [f1 setTo: 2 over: 5];\n    [c1 setReal: 10.0 andImaginary: 2.5];\n    // 第一个\
  \ dataValue 获得一个分数\n    dataValue = f1;\n    [dataValue print];\n    // 现在 dataValue\
  \ 获得一个复数\n    dataValue = c1;\n    [dataValue print];\n    [c1 release];\n    [f1\
  \ release];\n    [pool drain];\n    return 0;\n}\n```\n\n* * *\n\n### 程序 9.2. 输出\n\
  \n* * *\n\n```\n2/5\n10 + 2.5i\n```\n\n* * *\n\n变量 `dataValue` 被声明为 `id` 对象类型。因此，`dataValue`\
  \ 可以用来持有程序中的任何类型对象。注意在声明行中没有使用星号：\n\n`id dataValue;`\n\n`Fraction f1` 被设置为 `2/5`，复数\
  \ `Complex` `c1` 被设置为 `(10 + 2.5i)`。赋值 `dataValue = f1;` 将 `Fraction f1` 存储在 `dataValue`\
  \ 中。现在，你对 `dataValue` 可以做什么呢？嗯，你可以对 `dataValue` 调用任何你在 `Fraction` 对象上可以使用的方法，尽管\
  \ `dataValue` 的类型是 `id` 而不是 `Fraction`。但如果 `dataValue` 可以存储任何类型的对象，系统如何知道该调用哪个方法呢？也就是说，当它遇到消息表达式时\n\
  \n```objc\n[dataValue print];\n```\n\n它如何知道调用哪个 `print` 方法？你为 `Fraction` 和 `Complex`\
  \ 类都定义了 `print` 方法。\n\n如以前所述，答案在于 Objective-C 系统始终跟踪对象所属的类。这也取决于动态类型和动态绑定的概念——也就是说，系统在运行时对对象的类做出决定，因此动态地决定调用哪种方法，而不是在编译时决定。\n\
  \n因此，在程序执行期间，在系统向 `dataValue` 发送 `print` 消息之前，它首先检查存储在 `dataValue` 内部对象的类。在程序 9.2\
  \ 的第一个情况下，该变量包含一个 `Fraction` 对象，因此使用了 `Fraction` 类中定义的 `print` 方法。这通过程序的输出得到了证实。\n\
  \n在第二种情况下，发生了同样的事情。首先，将复数 `c1` 赋值给 `dataValue`。接下来，执行以下消息表达式：\n\n```objc\n[dataValue\
  \ print];\n```\n\n这一次，因为 `dataValue` 包含一个属于 `Complex` 类的对象，因此选择了该类相应的 `print` 方法进行执行。\n\
  \n这是一个简单的例子，但你可以将此概念扩展到更复杂的应用程序。与多态结合时，动态绑定和动态类型允许你轻松地编写代码，向来自不同类的对象发送相同的消息。\n\n\
  例如，考虑一个用于在屏幕上绘制图形对象的 `draw` 方法。你可能为你的每个图形对象都定义了不同的 `draw` 方法，例如文本、圆形、矩形、窗口等。如果要绘制的特定对象存储在一个名为\
  \ `currentObject` 的 `id` 变量中（例如），那么你只需通过向它发送 `draw` 消息即可在屏幕上绘制它：\n\n```objc\n[currentObject\
  \ draw];\n```\n\n你甚至可以先进行测试，以确保存储在 `currentObject` 中的对象实际上响应 `draw` 方法。你将在本章稍后的章节“[关于类的提问]](#ch09.html_ch09lev1sec5)”中看到如何这样做。\n\
  \n### 编译时与运行时检查\n\n由于存储在 `id` 变量内部的对象类型在编译时是不确定的，某些测试会被推迟到运行时——即程序执行时。\n\n考虑以下代码序列：\n\
  \n```objc\nFraction *f1 = [[Fraction alloc] init];\n[f1 setReal: 10.0 andImaginary:\
  \ 2.5];\n```\n\n回想起 `Fraction` 没有 `setReal:andImaginary:` 方法，Objective-C 编译器知道 `f1`\
  \ 是一个 `Fraction` 并发布以下消息：`'Fraction' may not respond to 'setReal:andImaginary:'`。\n\
  \n现在考虑以下情况：\n\n```objc\nid dataValue = [[Fraction alloc] init];\n[dataValue setReal:\
  \ 10.0 andImaginary: 2.5];\n```\n\n由于 `dataValue` 是 `id`，编译器不知道它内部的类型，因此没有发布警告。然而，当程序运行时，系统会检查它的内部类型。由于\
  \ `dataValue` 包含一个 `Fraction`，它会寻找 `setReal:andImaginary:`。\n\n### 编译时与运行时检查（续）\n\
  \n（注：此处原文逻辑似乎重复，已按原文结构翻译）\n\n### 编译时与运行时检查\n\n由于存储在 `id` 变量内部的对象类型在编译时是不确定的，某些测试会被推迟到运行时——即程序执行时。\n\
  \n考虑以下代码序列：\n\n```objc\nFraction *f1 = [[Fraction alloc] init];\n[f1 setReal: 10.0\
  \ andImaginary: 2.5];\n```\n\n回想起 `Fraction` 没有 `setReal:andImaginary:` 方法，Objective-C\
  \ 编译器知道 `f1` 是一个 `Fraction` 并发布以下消息：`'Fraction' may not respond to 'setReal:andImaginary:'`。\n\
  \n现在考虑以下情况：\n\n```objc\nid dataValue = [[Fraction alloc] init];\n[dataValue setReal:\
  \ 10.0 andImaginary: 2.5];\n```\n\n由于 `dataValue` 是 `id`，编译器不知道它内部的类型，因此没有发布警告。然而，当程序运行时，系统会检查它的内部类型。由于\
  \ `dataValue` 包含一个 `Fraction`，它会寻找 `setReal:andImaginary:`。\n\n### `id` 类型与静态类型\n\
  \n如果存储在 `id` 变量内部的对象类型是不确定的，那么你为什么不把所有对象都声明为 `id` 呢？由于几个原因，你不希望使用通用类型。\n\n首先，当你将变量定义为特定类时，你正在使用静态类型。“静态](#apa.html_gloss01_019)一词指的是存储在变量中的对象类型是显式声明的。因此，该对象的类型是预定的。当你使用静态类型时，编译器尽可能确保在程序范围内一致一致。编译器可以检查应用于对象的方法是否由该类定义或继承；否则它会发布警告消息。因此，当你声明一个名为\
  \ `myRect` 的 `Rectangle` 变量时，编译器会检查对 `myRect` 调用的任何方法是否在 `Rectangle` 类中定义或从其基类继承。\n\
  \n* * *\n\n### 注意\n\n某些技术使得通过变量调用方法成为可能，在这种情况下编译器无法为你进行检查。\n\n* * *\n\n然而，即使这种检查最终会在运行时执行，你为什么还要关心静态类型呢？你关心是因为在编译阶段发现错误比在执行阶段发现要好得多。如果你把问题留到运行时，当错误发生时你可能甚至不是运行程序的人。当你的程序投入生产时，某个可怜的用户可能会在运行程序时发现某个对象不识别某个方法，导致程序崩溃。\n\
  \n\n\n\n\n使用静态类型的另一个原因是它可以让你的程序更具可读性。考虑以下声明：\n\n```\nid f1;\n```\n\n相比于\n\n```\n\
  Fraction *f1;\n```\n\n你认为哪一个更易理解——也就是说，哪一个能让变量 `f1` 的意图用途更清晰？静态类型与有意义的变量名的结合（我们在上一个示例中特意没有选择这种方式）可以很大程度上让你的程序更具自文档化特征。\n\
  \n## 动态类型中的参数和返回类型\n\n如果你使用动态类型来调用方法，请注意以下规则：如果你的多个类中都实现了同名的方法，则每个方法必须在每个参数的类型以及其返回值的类型上保持一致，这样编译器才能为你的消息表达式（message\
  \ expressions）生成正确的代码。\n\n编译器会对它看到的每个类声明进行一致性检查。如果一个或多个方法在参数或返回类型上存在冲突，编译器会发出警告信息。例如，`Fraction`\
  \ 和 `Complex` 类都包含 `add:` 方法。然而，`Fraction` 类接收 `Fraction` 对象作为参数并返回 `Fraction` 对象，而\
  \ `Complex` 类接收并返回的是 `Complex` 对象。如果 `frac1` 和 `myFract` 是 `Fraction` 对象，而 `comp1`\
  \ 和 `myComplex` 是 `Complex` 对象，那么像：\n\n```\nresult = [myFract add: frac1];\n```\n\
  \n和\n\n```\nresult = [myComplex add: comp1];\n```\n\n就不会引起任何问题。这是因为在两种情况下，消息的接收者都是静态类型的，编译器可以检查其与接收者类中定义的方法的一致性。\n\
  \n如果 `dataValue1` 和 `dataValue2` 是 `id` 变量，语句\n\n```\nresult = [dataValue1 add:\
  \ dataValue2];\n```\n\n会导致编译器生成代码将参数传递给 `add:` 方法，并通过做出假设来处理其返回值。\n\n在运行时，Objective-C\
  \ 运行时系统将检查存储在 `dataValue1` 中的对象的实际类，并从正确的类中选择适当的方法执行。然而，在更一般的情况下，编译器可能会生成错误的代码将参数传递给方法或处理其返回值。例如，如果一个方法接收对象作为参数，而另一个方法接收浮点值，就会发生这种情况。或者，如果一个方法返回对象而另一个方法返回整数，也会发生这种情况。如果两个方法之间不一致仅仅是不同类型的对象（例如，`Fraction`\
  \ 的 `add:` 方法接收 `Fraction` 对象作为参数并返回一个，而 `Complex` 的 `add:` 方法接收并返回 `Complex` 对象），编译器仍然会生成正确的代码，因为内存地址（即指针）无论如何都是作为对象的引用传递的。\n\
  \n### 关于类的提问\n\n当你开始处理可能包含不同类对象的变量时，你可能需要询问诸如下的问题：\n\n- 这个对象是矩形吗？\n- 这个对象支持 `print`\
  \ 方法吗？\n- 这个对象是 `Graphics` 成员或其后代之一吗？\n\n然后你可以利用这些问题的答案来执行不同的代码序列、避免错误，或者在程序执行时检查程序的完整性。\n\
  \n[表 9.1] 总结了 `NSObject` 类支持的用于此类问题的的一些基本方法。在表中，`class-object` 是一个类对象（通常通过 `class`\
  \ 方法生成），`selector` 是一个 `SEL` 类型的值（通常通过 `@selector` 指令创建）。\n\n**表 9.1. 用于处理动态类型的方法**\n\
  \n![image](img/09tab01.jpg)\n\n其他方法未在此涵盖。其中一种方法允许你询问一个对象是否符合某个协议（参见[第 11 章]，“分类与协议”）。其他方法允许你询问关于动态解析的问题。然而，在更一般的情况下，编译器可能会生成错误的代码将参数传递给方法或处理其返回值。例如，如果一个方法接收对象作为参数，而另一个方法接收浮点值，就会发生这种情况。或者，如果一个方法返回对象而另一个方法返回整数，也会发生这种情况。如果两个方法之间不一致仅仅是不同类型的对象（例如，`Fraction`\
  \ 的 `add:` 方法接收 `Fraction` 对象作为参数并返回一个，而 `Complex` 的 `add:` 方法接收并返回 `Complex` 对象），编译器仍然会生成正确的代码，因为内存地址（即指针）无论如何都是作为对象的引用传递的。\n\
  \n\n\n\n\n```objc\nNSLog (@\"mySquare is a member of Rectangle class\");\n\nif (\
  \ [mySquare isMemberOfClass: [NSObject class]] == YES )\n    NSLog (@\"mySquare\
  \ is a member of NSObject class\");\n\n// isKindOf:\n\nif ( [mySquare isKindOfClass:\
  \ [Square class]] == YES )\n    NSLog (@\"mySquare is a kind of Square\");\n\nif\
  \ ( [mySquare isKindOfClass: [Rectangle class]] == YES )\n    NSLog (@\"mySquare\
  \ is a kind of Rectangle\");\n\nif ( [mySquare isKindOfClass: [NSObject class]]\
  \ == YES )\n    NSLog (@\"mySquare is a kind of NSObject\");\n\n// respondsTo:\n\
  \nif ( [mySquare respondsToSelector: @selector (setSide:)] == YES )\n    NSLog (@\"\
  mySquare responds to setSide: method\");\n\nif ( [mySquare respondsToSelector: @selector\
  \ (setWidth:andHeight:)] == YES )\n    NSLog (@\"mySquare responds to setWidth:andHeight:\
  \ method\");\n\nif ( [Square respondsToSelector: @selector (alloc)] == YES )\n \
  \   NSLog (@\"Square class responds to alloc method\");\n\n// instancesRespondTo:\n\
  \nif ([Rectangle instancesRespondToSelector: @selector (setSide:)] == YES)\n   \
  \ NSLog (@\"Instances of Rectangle respond to setSide: method\");\n\nif ([Square\
  \ instancesRespondToSelector: @selector (setSide:)] == YES)\n    NSLog (@\"Instances\
  \ of Square respond to setSide: method\");\n\nif ([Square isSubclassOfClass: [Rectangle\
  \ class]] == YES)\n    NSLog (@\"Square is a subclass of a rectangle\");\n\n[mySquare\
  \ release];\n\n[pool drain];\n\nreturn 0;\n}\n```\n\n***\n\n确保使用 `Square`、`Rectangle`\
  \ 和 `XYPoint` 类的实现文件来编译此程序，这些类在第 8 章中都介绍过。\n\n#### 程序 9.3 输出\n\n***\n\nmySquare\
  \ is a member of Square class\nmySquare is a kind of Square\nmySquare is a kind\
  \ of Rectangle\nmySquare is a kind of NSObject\nmySquare responds to setSide: method\n\
  mySquare responds to setWidth:andHeight: method\nSquare class responds to alloc\
  \ method\nInstances of Square respond to setSide: method\nSquare is a subclass of\
  \ a rectangle\n\n***\n\n来自程序 9.3 的输出应该是清晰的。记住 `isMemberOfClass:` 测试的是对类的直接成员关系，而\
  \ `isKindOfClass:` 检查继承层次结构中的成员关系。因此，`mySquare` 是 `Square` 类的成员——但它也是“一种” `Square`、`Rectangle`\
  \ 和 `NSObject`，因为存在于该类层次结构中（显然，所有对象在 `NSObject` 类的 `isKindOf:` 测试上都应该返回 `YES`，除非你定义了一个新的根对象）。\n\
  \n#### 测试\n\n```objc\nif ( [Square respondsToSelector: @selector (alloc)] == YES\
  \ )\n```\n\n测试测试 `Square` 类是否响应类方法 `alloc`，它确实响应了，因为它继承自根对象 `NSObject`。注意，你始终可以直接使用类名作为消息表达式的接收者，而不需要在之前的表达式中写出来（尽管如果你想写的话也可以写）：\n\
  \n```objc\n[Square class]\n```\n\n这是你唯一可以这样做的地方。在其他地方，你需要应用 `class` 方法来获取类对象。\n\n\
  ### 使用 `@try` 进行异常处理\n\n良好的编程习惯要求你尝试预测程序中可能发生的问题。你可以通过测试可能导致程序异常终止的条件并处理这些情况，或许通过记录日志消息并优雅地终止程序，或采取其他纠正措施。例如，你在本章的早些部分已经看到过如何测试对象是否响应某个特定消息。在避免错误的情况下，在程序执行期间进行此项测试可以让你避免向对象发送未识别的消息。当尝试发送此类未识别的消息时，你的程序通常会通过抛出所谓的\
  \ `exception`（异常）而立即终止。\n\n请看程序 9.4。我们没有在 `Fraction` 类中定义名为 `noSuchMethod` 的方法。当你编译程序时，你将获得相应的警告消息。\n\
  \n#### 程序 9.4\n\n***\n\n```objc\n#import \"Fraction.h\"\n\nint main (int argc, char\
  \ *argv [])\n{\n    NSAutoreleasePool * pool = [[NSAutoreleasePool alloc] init];\n\
  \    Fraction *f = [[Fraction alloc] init];\n    [f noSuchMethod];\n    NSLog (@\"\
  Execution continues!\");\n    [f release];\n    [pool drain];\n    return 0;\n}\n\
  ```\n\n尽管有警告，也可以运行程序。如果你这样做，可以预计程序将异常终止，并出现类似这些错误：\n\n#### 程序 9.4 输出\n\n***\n\n\
  *** Terminating app due to uncaught exception 'NSException', reason:-[Fraction noSuchMethod]:\
  \ unrecognized selector sent to instance 0x\n\n***\n\n为了避免在某种情况下程序终止，你可以将一个或多个语句放在块中，格式如下：\n\
  \n```objc\n@try {\n    statement\n}\n@catch (exception) {\n    statement\n}\n```\n\
  \n当异常发生时，将执行 `@catch` 块。一个包含异常信息的 `NSException` 对象将作为参数传递到此块中。如你所见，`name` 方法获取异常的名称，`reason`\
  \ 方法给出异常的原因（运行时系统之前也自动打印了）。\n\n在 `@catch` 块的最后一个语句执行后（我们这里只有一个），程序继续执行紧随块后的语句。在本例中，我们执行了一个\
  \ `NSLog` 调用以验证执行已继续而没有终止。\n\n这是一个非常简单的示例，说明了如何在程序中捕获异常。`@finally` 块可以用于包含无论 `@try`\
  \ 块中的语句是否抛出异常都会执行的代码。\n\n`@throw` 指令允许你抛出自己的异常。你可以使用它来抛出一个特定的异常，或者在 `@catch` 块内部抛出带入块的同一个异常，如下：\n\
  \n```objc\n@throw\n```\n\n你可能想在自己处理异常后这样做（例如在执行清理工作之后）。你可以让系统为你处理剩余的工作。\n\n一个可能的动作序列程序\
  \ 9.5 释了异常处理。其后面是程序的输出。\n\n#### 程序 9.5 异常处理\n\n***\n\n```objc\n#import \"Fraction.h\"\
  \n\nint main (int argc, char *argv [])\n{\n    NSAutoreleasePool * pool = [[NSAutleasePool\
  \ alloc] init];\n    Fraction *f = [[Fraction alloc] init];\n    @try {\n      \
  \  [f noSuchMethod];\n    }\n    @catch (NSException *exception) {\n        NSLog(@\"\
  Caught %%@\", [exception name], [exception reason]);\n    }\n    NSLog (@\"Execution\
  \ continues!\");\n    [f release];\n    [pool drain];\n    return 0;\n}\n```\n\n\
  #### 程序 9.5 输出\n\n***\n\nCaught NSInvalidArgumentException: -[Fraction noSuchMethod]:\n\
  unrecognized selector sent to instance 0x3280\n\nExecution continues!\n\n***\n\n\
  你可以拥有多个 `@catch` 块，按顺序排列以捕获和处理不同类型的异常。\n\n\n\n\n\n通常情况下，你不希望程序在运行期间发生异常。因此，在错误发生之前进行测试，比在发生后进行捕获，被认为是更好的编程实践。在方法中测试错误并返回某个值作为错误指示，也比抛出异常更好。抛出异常会消耗大量的系统资源，因此\
  \ Apple 通常不建议不必要的抛出异常（例如，你不应该仅仅因为无法打开文件就抛出异常）。\n\n### 练习题\n\n1. 如果在执行加法之后（但在释放 `compResult`\
  \ 之前）程序 9.1 中插入消息表达式\n\n```\n[compResult reduce];\n```\n\n会发生什么？尝试一下看看。\n\n2. 程序\
  \ 9.2 定义的变量 `dataValue` 是否可以赋值一个你在第 8 章中定义的 `Rectangle` 对象？也就是说，语句\n\n```\ndataValue\
  \ = [[Rectangle alloc] init];\n```\n\n是否有效？为什么可以或为什么不可以？\n\n3. 为你在第 8 章中定义的 `XYPoint`\
  \ 类添加一个 `print` 方法。让它以 (x, y) 的格式显示点。然后修改程序 9.2 以包含 `XYPoint` 对象。让修改后的程序创建一个 `XYPoint`\
  \ 对象，设置其值，将其赋值给变量 `id` `dataValue`，然后显示它的值。\n\n4. 根据本章关于参数和返回类型的讨论，修改 `Fraction`\
  \ 和 `Complex` 类中的两个 `add:` 方法，使其接收并返回 `id` 对象。然后编写一个包含以下代码序列的程序：\n\n```\nresult\
  \ = [dataValue1 add: dataValue2];\n[result print];\n```\n\n在这里，`result`、`dataValue1`\
  \ 和 `dataValue2` 都是 `id` 对象。确保你在程序中适当设置了 `dataValue1` 和 `dataValue2`，并在程序终止前释放所有对象。\n\
  \n### 注意\n\n你必须将方法名称更改为 `add:`以外的名称。这是因为系统的 `NSObjectController` 类也有一个 `add:` 方法。正如本章早些在“动态类型下的参数和返回类型”节中所提到的，如果不同类中存在同名方法，且接收者的类型在编译时未知，编译器将执行一致性检查，以确保相似命名方法之间的参数和返回类型是一致的。\n\
  \n5. 给定你在本文使用的 `Fraction` 和 `Complex` 类定义以及以下定义：\n\n```\nFraction *fraction = [[Fraction\
  \ alloc] init];\nComplex  *complex = [[Complex alloc] init];\nid      number = [[Complex\
  \ alloc] init];\n```\n\n确定以下消息表达式的返回值。然后将它们输入程序以验证结果。\n\n```\n[fraction isMemberOfClass:\
  \ [Complex class]];\n[complex isMemberOfClass: [NSObject class]];\n[complex isKindOfClass:\
  \ [NSObject class]];\n[fraction isKindOfClass: [Fraction class]];\n[fraction respondsToSelector:\
  \ @selector (print)];\n[complex respondsToSelector: @selector (print)];\n[Fraction\
  \ instancesRespondToSelector: @selector (print)];\n[number respondsToSelector: @selector\
  \ (print)];\n[number isKindOfClass: [Complex class]];\n[number respondsToSelector:\
  \ @selector (release)];\n[[number class] respondsToSelector: @selector (alloc)];\n\
  ```\n\n## 第 10 章 变量与数据类型\n\n在本章中，我们将更详细地讨论变量作用域、对象的初始化方法以及数据类型。\n\n对象的初始化值得特别关注，我们在此处对其进行介绍。\n\
  \n我们在第 7 章“类进阶”中简要讨论了实例变量以及静态变量和局部变量的作用域。在这里我们将更多地讨论静态变量，并引入全局和外部变量的概念。此外，你可以向 Objective-C\
  \ 编译器提供某些指令，以更精确地控制实例变量的作用域。我们在本章中也会涵盖这些指令。\n\n枚举数据类型允许你为数据类型定义一个名称，仅用于存储指定的值列表。Objective-C\
  \ 语言的 `typedef` 语句允许为你内置或派生的数据类型分配自定义名称。最后，在本章中，我们将详细描述 Objective-C 编译器在表达式求转换数据类型时遵循的精确步骤。\n\
  \n## 初始化对象\n\n你以前见过这种模式了：你分配一个对象的新实例，然后使用如下熟悉的序列对其进行初始化：\n\n```\nFraction *myFract\
  \ = [[Fraction alloc] init];\n```\n\n在调用这两个方法后，你通常会给新对象分配一些值，如下：\n\n```\n[myFract\
  \ setTo: 1 over: 3];\n```\n\n初始化对象后将其设置为某些初始值的过程通常合并为单个方法。例如，你可以定义一个 `initWith:over:`\
  \ 方法来初始化分数，并将分子和分母设置为提供的两个参数。\n\n包含许多方法和实例变量的类通常也有几个初始化方法。例如，Foundation 框架的 `NSArray`\
  \ 类包含以下六个初始化方法：\n\n- `initWithArray:`\n- `initWithCopy:`\n- `initWithContentsFile:`\n\
  - `initWithContentsURL:`\n- `initObjects:`\n- `initWithObjects:`\n\n数组可以这样分配并初始化：\n\
  \n```\nmyArray = [[NSArray alloc] initWithArray:];\n```\n\n以 `init` 开始是常见的做法。你可以看到，`NSArray`\
  \ 的初始化方法遵循了这个约定。如果你的类包含多个初始化方法，其中一个应该是你指定的(#apa.html_01_02)初始化器，所有其他初始化方法都应该使用它。创建一个指定的初始化器可以将初始化代码集中在一个方法中。任何类的子类都可以重写你指定的初始化器，以确保新实例被正确初始化。\n\
  \n根据这些讨论，你 `Fraction` 类的初始化方法 `initWith:over:` 可能如下：\n\n```objc\n-(Fraction *)initWith:(int)\
  \ n over:(int) d\n{\n    self = [super init];\n    if (self)\n        [self setTo:\
  \ n over: d];\n    return self;\n}\n```\n\n该方法调用了父类初始化器，即 `NSObject` 的 `init` 方法（记住这是\
  \ `Fraction` 的父类）。你必须将结果赋值回 `self`，因为初始化器有权改变对象的位置。在初始化 `super` 后（通过返回非零值指示成功），你使用\
  \ `setTo:over:` 方法设置分子和分母。与其他初始化方法一样，你预期返回初始化的对象，你在这里正是这样做的。\n\n程序 10.1 测试了你新的 `initWith:over:`\
  \ 初始化方法。\n\n**程序 10.1**\n\n```objc\n#import \"Fraction.h\"\n\nint main (int argc,\
  \ char *argv[])\n{\n    NSAutleasePool * pool = [[NSAutleasePool alloc] init];\n\
  \    Fraction *a, *b;\n    a = [[Fraction alloc] initWith: 1 over: 3;\n    b = [[Fraction\
  \ alloc] initWith: 3 over: 7;\n    [a print];\n    [b print];\n    [a release];\n\
  \    [b release];\n    [pool drain];\n    return 0;\n}\n```\n\n**程序 10.1. 输出**\n\
  \n```\n1/3\n\n3/7\n```\n\n\n\n\n为了为了遵循之前提到的关于指定初始化器的规则，你还应该在你的 `Fraction` 类中重写 `init`。如果你的类可能会被子类化，这一点尤为重要。\n\
  \n以下是 `init` 方法可能的写法：\n\n```objc\n-(id) init\n{\n    return [self initWith: 0 over:\
  \ 0];\n}\n```\n\n我们在这里正在重写一个继承的方法，所以你可能记得在这样的情况下，我们不需要接口接口（interface section）中声明\
  \ `init`。此外，请注意 `init` 被定义为返回 `id` 类型。这是为可能被子类化的类编写 `init` 方法的通用规则。在这些情况下，你不希望硬编码类名，因为子类将不会是与父类相同类的对象。为了保持一致，你应该回到\
  \ `initWith:over:` 方法并将其返回类型更改为 `id`。\n\n当你的程序开始执行时，它会向你所有的类发送 `initialize` 调用方法。如果你有一个类以及相关的子类，父类会先接收该消息。该消息只会向每个类发送一次，并保证在向该类发送任何其他消息之前发送。其目的是让你在该时间点执行任何类初始化。例如，你可能想在该时初始化与类相关的一些静态变量。\n\
  \n## 重新回顾作用域\n\n你可以通过多种方式影响程序中变量的作用域。你可以对实例变量这样做，也可以对定义在函数外部或内部的普通变量这样做。在接下来的讨论中，我们使用*模块*（module）一词是指代包含在单个源文件任意方法或函数定义。\n\
  \n### 控制实例变量作用域的指令\n\n你现在已经知道实例变量的作用域局限于为类定义的实例方法。因此，任何实例方法都可以通过名称直接访问其实例变量，而无需进行任何特殊操作。\n\
  \n你还知道实例变量会被子类继承。继承的实例变量也可以在该子类中定义的任何方法内部通过名称直接访问。同样，这不需要进行任何特殊操作。\n\n当你在接口部分中声明实例变量时，你可以在它们前面放置四个指令，以更精确地控制它们的作用域：\n\
  \n- `@protected`——在类及任何子类中定义的方法可以直接访问紧随其后的实例变量。这是默认情况。\n- `@private`——在类中定义的方法可以直接访问紧随其后的实例变量，但子类不能。\n\
  - `@public`——在类中以及任何其他类或模块中定义的方法可以直接访问紧随其后的实例变量。\n- `@package`——对于 64 位镜像（images），可以在实现该类的镜像任意范围内访问实例变量。\n\
  \n如果你想定义名为 `Printer` 的类，将两个名为 `pageCount` 和 `tonerLevel` 的实例变量保持私有，并且仅允许 `Printer`\
  \ 类中的方法访问，你可以使用如下所示的接口：\n\n```objc\n@interface Printer: NSObject\n{\n@private\n\
  \    int pageCount;\n    int tonerLevel;\n@protected\n    // 其他实例变量\n}\n\n...\n\
  @end\n```\n\n任何子类 `Printer` 的类都无法访问这两个实例变量，因为它们被设为私有。\n\n这些特殊指令就像“开关”；在这些指令之后出现的所有变量（直到标记变量声明结束的右大括号）都具有指定的作用域，除非使用了另一个指令。在之前的示例中，`@protected`\
  \ 指令确保了紧随其后的、直到 `}` 的实例变量可以被子类和 `Printer` 类的方法访问。\n\n`@public` 指令使得其他方法或函数可以通过使用指针运算符（`->`）访问实例变量，这在第\
  \ 13 章 “底层语言特征”中有所介绍。将实例变量设为公共不被认为是良好的编程实践，因为违背了数据封装的概念（即类隐藏其实例变量）。\n\n### 外部变量\n\
  \n如果你在程序的开头编写以下语句：\n\n```objc\nint gMoveNumber = 0;\n```\n\n在任何方法、类定义或函数外部——那么它的值可以在该模块的任何地方被引用。在这种情况下，我们说\
  \ `gMoveNumber` 被定义为*全局*变量。按照惯例，通常使用小写 *g* 作为全局变量的首字母，以向程序的读者指示其作用域。\n\n实际上，变量 `gMoveNumber`\
  \ 的相同定义也使得它的值可以从其他文件访问。具体来说，前述语句不仅将变量 `gMoveNumber` 定义为全局变量，还定义为*外部*全局变量。\n\n*外部*变量是指值可以被任何其他方法或函数访问和更改的变量。在想要访问外部变量的模块内部，以普通方式声明变量，并在声明之前放置关键字\
  \ `extern`。这向系统发出了要访问来自另一个文件的全局定义变量信号。以下是将变量 `gMoveNumber` 声明为外部变量的示例：\n\n```objc\n\
  extern int gMoveNumber;\n```\n\n出现上述声明的模块现在可以访问并修改 `gMoveNumber` 的值。其他模块也可以通过类似的\
  \ `extern` 访问 `gMoveNumber` 的值。\n\n在处理外部变量时，请遵循这一重要规则：变量必须在你的源文件某处被定义。这是通过在任何函数外部声明变量来实现，并且前面*没有*\
  \ `extern` 关键字，如下：\n\n```objc\nint gMoveNumber;\n```\n\n在这里，可以可选地为变量分配初始值，如之前所示。\n\
  \n定义外部变量的另一种方法是在函数外部声明变量，在声明前放置 `extern` 关键字并显式分配初始值，如下：\n\n```objc\nextern int\
  \ gMoveNumber = 0;\n```\n\n然而，这不是首选的方法，编译器会警告你同时声明了 `extern` 变量并对其赋值。这是因为使用 `extern`\
  \ 单词使其成为一个声明，而不是定义。记住，声明不会为变量分配存储空间，但定义会。之前的示例通过强制将声明视为定义而违反了这一条规则。\n\n在处理外部变量时，你可以在许多地方将变量声明为\
  \ `extern`，但你只能定义一次。\n\n考虑一个简单的程序示例来说明外部变量的使用。假设我们定义了一个名为 `Foo` 的类，并在名为 `main.m`\
  \ 的文件中输入以下代码：\n\n```objc\n#import \"Foo.h\"\n\nint gGlobalVar = 5;\n\nint main (int\
  \ argc, char *argc[])\n{\n    NSAutleasePool * pool = [[NSAutleasePool alloc] init];\n\
  \    Foo *myFoo = [[Foo alloc] init];\n    NSLog (@%i \", gGlobalVar);\n    [myFoo\
  \ setgGlobalVar: 100];\n    NSLog (@%i\", gGlobalVar);\n    [myFoo release];\n \
  \   [pool drain];\n    return 0;\n}\n```\n\n上述程序中全局变量 `gGlobalVar` 的定义使得任何使用适当 extern\
  \ 声明的方法（或函数）访问其值。假设你的 `Foo` 方法 `setgGlobalVar:` 如下：\n\n```objc\n-(void) setgGlobalVar:\
  \ (int) val\n{\n    extern int gGlobalVar;\n    gGlobalVar = val;\n}\n```\n\n该程序将产生以下输出：\n\
  \n```\n5\n100\n```\n\n这将证明了 `setgGlobalVar:` 方法能够访问并更改外部变量 `gGlobalVar` 的值。\n\n\n\
  \n\n如果有许多方法需要访问 `gGlobalVar` 的值，那么在文件开头只进行一次 `extern` 声明会更方便。然而，如果只有一个方法或少数几个方法需要访问该变量，那么在每个此类方法中分别进行\
  \ `extern` 声明也有其道理；这会使程序结构更有组织性，并将特定变量的使用限制在那些实际使用它的函数中。请注意，如果变量定义在访问该变量的代码文件内部，则不需要单独的\
  \ `extern` 声明。\n\n### 静态变量\n\n刚才展示的示例违背了数据封装和良好的面向对象编程原则。然而，你可能需要处理某些在不同方法调用之间共享其值的变量。尽管将\
  \ `gGlobalVar` 设置为 `Foo` 类的实例变量可能并不合理，但更好的方法可能是通过限制其访问该类定义的 setter（set）和 getter（get）方法，将其“隐藏”在\
  \ `Foo` 类内部。\n\n你现在知道，任何定义在方法之外的变量不仅是全局变量，而且外部变量。在很多情况下，你希望定义一个变量为全局的但不是外部的。换句话说，你希望将一个全局变量定义为特定模块（文件）的局部变量。如果没有特定类定义内部的方法之外的任何方法需要访问该特定变量，那么以这种方式定义变量是有意义的。你可以通过在包含特定类实现的文件内部将变量定义为\
  \ `static` 来实现这一点。\n\n如果定义在任何方法（或函数）之外，以下语句使得 `gGlobalVar` 的值在定义出现的文件中的后续任何点都可访问，但无法从其他文件中包含的方法或函数中访问：\n\
  \n```c\nstatic int gGlobalVar = 0;\n```\n\n记住，类方法无法访问实例变量（你可能想重新思考一下为什么会这样）。然而，你可能希望类方法能够设置和访问变量。一个简单的例子是类分配器方法，你希望跟踪它所分配的对象的数量。你可以通过在类的实现文件中设置一个**静态变量**（static\
  \ variable）来完成此任务。分配方法就可以直接访问该变量，因为它不是实例变量。该类的用户不需要知道这个变量。由于它在实现文件中被定义为静态变量，它的作用域被限制在那个文件中。因此，用户将无法直接访问它，也不会违背数据封装的原则。如果需要从类外部访问，你可以写一个方法来获取该变量的值。\n\
  \n`Program 10.2` 通过增加两个新方法扩展了 `Fraction` 类定义。`allocF` 类方法分配一个新的 `Fraction` 并跟踪它分配了多少个\
  \ `Fraction`，而 `count` 方法返回该计数。请注意，后者方法也是一个类方法。它也可以实现为实例方法，但询问类它分配了多少个实例，比向类的特定实例发送消息更有意义。\n\
  \n以下是要添加到 `Fraction.h` 头文件中的两个新类方法的声明：\n\n```objc\n+(Fraction *) allocF;\n+(int)\
  \  count;\n```\n\n注意，这里没有重写被继承的 `alloc` 方法；相反，你定义了自己的分配器方法。你的方法将利用继承的 `alloc` 方法。将此代码放在你的\
  \ `Fraction.m` 实现文件中：\n\n```objc\nstatic int gCounter;\n\n@implementation Fraction\n\
  \n+(Fraction *) allocF\n{\n   extern int gCounter;\n   ++gCounter;\n   return [Fraction\
  \ alloc];\n}\n\n+(int) count\n{\n   extern int gCounter;\n   return gCounter;\n\
  }\n\n// Fraction 类的其他方法放在这里\n\n```  ...\n\n@end\n```\n\n### 注意\n\n重写 `alloc` 不被认为是良好的编程习惯，因为该方法处理内存的物理分配。你不应该参与那个层级。\n\
  \n`gCounter` 的静态声明使得实现部分定义的任何方法都能访问它，但并无法从文件外部访问。`allocF` 方法简单地递增 `gCounter` 变量，然后使用\
  \ `alloc` 方法创建一个新的 `Fraction` 并返回结果。`count` 方法简单地返回计数器的值，从而将其直接访问与用户隔离开。\n\n记住，这两个方法中不需要\
  \ `extern` 声明，因为 `gCounter` 变量定义在文件内部。它只是有助于阅读方法的读者理解正在访问一个定义在方法之外的变量。变量名中的 `g`\
  \ 前缀对读者也起相同的作用；由于这个原因，大多数程序员通常不包含 `extern` 声明。\n\n`Program 10.2` 测试了新方法。\n\n**Program\
  \ 10.2**\n\n```objc\n#import \"Fraction.h\"\n\nint main (int argc, char *argv[])\n\
  {\n   NSAutoreleasePool * pool = [[NSAutoreleasePool alloc] init];\n   Fraction\
  \ *a, *b, *c;\n   NSLog (@\"Fractions allocated: %i\", [Fraction count]);\n   a\
  \ = [[Fraction allocF] init];\n   b = [[Fraction allocF] init];\n   c = [[Fraction\
  \ allocF] init];\n   NSLog (@\"Fractions allocated: %i\", [Fraction count]);\n \
  \  [a release];\n   [b release];\n   [c release];\n   [pool drain];\n   return 0;\n\
  }\n```\n\n**Program 10.2 输出**\n\n```\nFractions allocated: 0\nFractions allocated:\
  \ 3\n```\n\n当程序执行时，`gCounter` 的值自动设置为 `0`（记住，如果你想对类进行任何特殊的初始化，可以重写继承的 `initialize`\
  \ 方法，例如将其他静态变量设置为非零值）。在使用 `allocF` 方法分配（并初始化）三个 `Fraction` 后，`count` 方法检索计数器变量，其值被正确设置为\
  \ `3`。如果你想重置计数器或将其设置为特定值，你也可以为类添加一个 setter 方法。不过，对于此应用程序来说并不它。\n\n## 枚举类型\n\nObjective-C\
  \ 语言允许你指定可以赋值给变量的值范围。枚举数据类型的定义由 `enum` 关键字引发。紧接在关键字之后的是枚举类型的名称，随后是一组标识符（括在大括号内），它们定义了可以赋值给类型的允许值。例如，以下语句定义了类型\
  \ `flag`：\n\n```objc\nenum flag { false, true };\n```\n\n在理论上，该数据类型在程序内部可以赋予 `true`\
  \ 和 `false` 值，而不是其他值。遗憾的是，如果违反了这一规则，Objective-C 编译器不会生成警告信息。\n\n要声明一个 `enum flag`\
  \ 变量，你再次使用 `enum` 关键字，后面跟着枚举名称，然后是变量列表。因此，以下语句将两个变量 `endOfData` 和 `matchFound` 定义为\
  \ `flag` 类型：\n\n```objc\nenum flag endOfData, matchFound;\n```\n\n理论上，赋值给这些变量的只有\
  \ `true` 和 `false` 名字。因此，如下语句是有效的：\n\n```objc\nendOfData = true;\n```\n\n以及\n\n\
  ```objc\nif ( matchFound == false )\n```\n\n...\n\n\n\n\n\n如果你想为枚举标识符关联一个特定的整数值，可以在定义数据类型时将该整数赋值给该标识符。随后在列表中出现的枚举标识符将按照从指定的整数值加一开始的顺序整数值赋值。\n\
  \n在接的定义中，定义了一个名为 `direction` 的枚举数据类型，其取值为 `up`、`down`、`left` 和 `right`：\n\n```c\n\
  enum direction { up, down, left = 10, right };\n```\n\n编译器将值 `0` 分配给 `up`，因为它出现在列表中第一个；将\
  \ `1` 分配给 `down`，因为它紧随其后；将 `10` 分配给 `left`，因为显式地为其分配了该值；并将 `11` 分配给 `right`，因为它是列表中前一个\
  \ `enum` 值的递增值。\n\n枚举标识符可以共享相同的值。例如，在\n\n```c\nenum boolean { no = 0, false = 0,\
  \ yes = 1, true = 1 };\n```\n\n给 `enum boolean` 类型的变量赋值 `no` 或 `false` 中的任意一个，都会将其赋值为\
  \ `0`；赋值 `yes` 或 `true` 中的任意一个，则将其赋值为 `1`。\n\n作为枚举数据类型定义的另一个示例，以下代码定义了 `enum month`\
  \ 类型，其允许为该类型变量赋值的值是一年的月份名称：\n\n```c\nenum month { january = 1, february, march,\
  \ april, may, june, july, august, september, october, november, december };\n```\n\
  \nObjective-C 编译器实际上将枚举标识符视为整数常量。如果你的程序包含以下两行代码，值 2 将被赋值给 `thisMonth`（而不是 `february`\
  \ 名字）：\n\n```objectivec\nenum month thisMonth;\n...\nthisMonth = february;\n```\n\
  \n`程序 10.3` 显示了一个使用枚举数据类型的简单程序。该程序读取一个月份数字，然后进入 `switch` 语句来查看输入的是哪个月份。记住，编译器将枚举值视为整数常量，因此它们是有效的分支（case）值。变量\
  \ `days` 被赋值为指定月份的天数，并在退出 `switch` 语句后显示其值。程序中包含一个特殊的测试，以检查该月份是否为二月。\n\n**程序 10.3**\n\
  \n```objectivec\n#import <Foundation/Foundation.h>\n\n// 打印一个月份的天数\nint main (int\
  \ argc, char *argv[])\n{\n    NSAutoreleasePool * pool = [[NSAutoreleasePool alloc]\
  \ init];\n    enum month { january = 1, february, march, april, may, june, july,\
  \ august, september, october, november, december };\n    enum month amonth;\n  \
  \  int      days;\n    NSLog (@\"Enter month number: \");\n    scanf (\"%i\", &amonth);\n\
  \    switch (amonth) {\n        case january:\n        case march:\n        case\
  \ may:\n        case july:\n        case august:\n        case october:\n      \
  \  case december:\n            days = 31;\n            break;\n        case april:\n\
  \        case june:\n        case september:\n        case november:\n         \
  \   days = 30;\n            break;\n        case february:\n            days = 28;\n\
  \            break;\n        default:\n            NSLog (@\"bad month number\"\
  );\n            days = 0;\n            break;\n    }\n    if (days != 0 ) {\n  \
  \      NSLog (@\"Number of days is %i\", days);\n    }\n    if (amonth == february\
  \ ) {\n        NSLog (@\"...or 29 if it's leap year\");\n    }\n    [pool drain];\n\
  \    return 0;\n}\n```\n\n**程序 10.3 输出**\n\nEnter month number: 5\nNumber of days\
  \ is 31\n\n**程序 10.3 输出（重新运行）**\n\nEnter month number: 2\nNumber of days is 28...or\
  \ 29 if it's leap year\n\n你可以显式地为枚举数据类型分配一个整数值；你应该使用类型转换运算符来这样做。因此，如果 `monthValue`\
  \ 是一个值为 `6` 的整数变量，那么这个表达式是允许的：\n\n```objectivec\nlastMonth = (enum month)(monthValue\
  \ - 1);\n```\n\n如果你不使用类型转换运算符，编译器（遗憾的是）不会对此进行报错。在使用带有枚举数据类型的程序时，尽量不要依赖于枚举值被视为整数这一事实。相反，应将它们视为不同的数据类型。枚举类型提供了一种将符号名称与整数关联的方法。如果你随后需要更改该数字的值，必须仅在定义枚举的地方进行更改。如果你根据枚举类型的实际值做出假设，就违背了使用枚举的这种处。\n\
  \n在定义枚举数据类型时允许某些变体：可以省略数据类型的名称，并且在定义类型时声明变量为该特定类型。作为一个显示这两种选项的示例，该语句\n\n```c\nenum\
  \ { east, west, south, north } direction;\n```\n\n定义了一个（无名的）枚举数据类型，其取值为 `east`、`west`、`south`\
  \ 或 `north`，并声明变量 `direction` 为该类型。\n\n在 block 内部定义枚举数据类型会将该定义的作用范围限制在该 block 内。另一方面，在程序的开头（任何\
  \ block 之外）定义枚举数据类型将使该定义对整个文件全局可见。定义枚举数据类型时...\n\n\n\n\n你已经看到了如何使用类型转换运算符来显式指定转换。假设\
  \ `total` 和 `n` 都是整数变量：\n\n```c\naverage = (float) total / n;\n```\n\n在执行操作之前，变量\
  \ `total` 的值会被转换为 `float` 类型，从而保证了除法将作为浮点运算进行。\n\n### 转换规则\n\nObjective-C 编译器在评估由不同基本数据类型组成的表达式时，遵循非常严格的规则。以下总结了在表达式的两个操作数进行评估时，转换发生的发生顺序：\n\
  \n1. 如果其中一个操作数的类型为 `long double`，另一个会被转换为 `long double`，结果的类型也是 `long double`。\n\
  2. 如果其中一个操作数的类型为 `double`，另一个会被转换为 `double`，结果的类型也是 `double`。\n3. 如果其中一个操作数的类型为\
  \ `float`，另一个会被转换为 `float`，结果的类型也是 `float`。\n4. 如果其中一个操作数的类型为 `_Bool`、`char`、`short\
  \ int` 或位域（bit field），或者枚举数据类型，它会被转换为 `int`。\n\n5. 如果其中一个操作数的类型为 `long long int`，另一个会被转换为\
  \ `long long int`，结果的类型也是 `long long int`。\n6. 如果其中一个操作数的类型为 `long int`，另一个会被转换为\
  \ `long int`，结果的类型也是 `long int`。\n7. 如果到达这一步，则两个操作数的类型均为 `int`，结果的类型也是 `int`。\n\n\
  这实际上是表达式中操作数转换涉及步骤的简化版。当涉及 `unsigned` 操作数时，规则会变得复杂，但对于本文来说已经足够详细。\n\n通过这一系列步骤可以意识到，每当你到达说明“这就是结果的类型”的步骤时，你就完成了转换过程。\n\
  \n为了说明遵循这些步骤的示例，让我们看看如何评估以下表达式，其中 `f` 定义为 `float`，`i` 为 `int`，`l` 为 `long int`，`s`\
  \ 为 `short int` 变量：\n\n```c\nf * i + l / s\n```\n\n首先考虑 `f` 与 `i` 的乘法，即 `float`\
  \ 与 `int` 的相乘。根据步骤 3，你知道因为 `f` 的类型是 `float`，另一个操作数（`i`）也将转换为 `float` 类型，这将是乘法结果的类型。\n\
  \n接下来，`l` 除以 `s`，即 `long int` 除以 `short int`。步骤 4 告诉你 `short int` 将被提升为 `int`。继续后续，步骤\
  \ 6 显示，因为其中一个操作数（`l`）是 `long int`，另一个操作数将被转换为 `long int`，这也是结果的类型。因此，此除法将产生一个 `long\
  \ int` 类型的值，除法产生的任何小数部分将被截断。\n\n最后，步骤 3 指明，如果表达式中的一个操作数类型为 `float`（如 `f * i` 的乘法结果），另一个操作数将被转换为\
  \ `float` 类型，这将结果的类型。因此，在 `l` 除以 `s` *之后*，操作的结果将被转换为 `float` 类型，然后加到 `f` 和 `i` 的乘积中。因此，上述表达式的最终结果是一个\
  \ `float` 类型的值。\n\n记住，类型转换运算符始终可以用于显式强制转换，从而控制特定表达式的评估方式。\n\n因此，如果你不想在上述表达式评估中让\
  \ `l` 除以 `s` 的结果被截断，你可以将其中一个操作数强制转换为 `float` 类型，从而强制评估作为浮点除法进行执行：\n\n```c\nf * i\
  \ + (float) l / s\n```\n\n在这个表达式中，`l` 在执行除法操作之前会被转换为 `float`，因为类型转换运算符的优先级高于除法运算符。由于除法的两个操作数之一将是\
  \ `float` 类型，另一个操作数（`s`）将自动转换为 `float` 类型，而这将是结果的类型。\n\n## 位运算符\n\nObjective-C 语言中的各种运算符用于表示整数值的特定位操作。表\
  \ 10.1 展示了这些运算符。\n\n**表 10.1. 位运算符**\n\n![image](img/10tab01.jpg)\n\n***\n\n###\
  \ 注意事项\n\n在你的 Objective-C 程序中，你可能很少甚至根本不使用位运算符，尽管你会在框架头文件中遇到它们。由于这些内容对于初学者来说可能有点晦涩，你可以只需略过这一部分，并在需要时以后再查阅。\n\
  \n***\n\n表 10.1 中列出的所有运算符除位取反运算符（`~`）外都是二元运算符，因此需要两个操作数。位操作可以在任何类型的整数值上执行，但不能在浮点值上执行。\n\
  \n在后续示例中，你将学习如何在二进制表示和十六进制表示之间进行转换。一个十六进制（16 进制）数字由 4 位组成。表 10.2 显示了如何在这些基数之间转换。\n\
  \n**表 10.2. 二进制、进制和十六进制等效值**\n\n![image](img/10tab02.jpg)\n\n### 位与运算符\n\n当对两个值进行\
  \ AND 运算时，会对它们的二进制表示逐位进行比较。只有当第一个值的位为 `1` 且第二个值的位也为 `1` 时，结果的对应位才为 `1`；否则为 `0`。如果\
  \ `b1` 和 `b2` 代表相应的位，下表显示了 `b1` 与 `b2` 进行与运算的结果。\n\n![image](img/213tab01.jpg)\n\
  \n例如，如果 `w1` 和 `w2` 被定义为 `short int`，且 `w1` 设置为十六进制 `15`，`w2` 设置为十六进制 `0c`，那么以下语句将\
  \ `0x04` 赋值给 `w3`：\n\n```c\nw3 = w1 & w2;\n```\n\n通过将 `w1`、`w2` 和 `w3` 的值视为二进制，可以更容易地看到这一点。假设你处理的是\
  \ 16 位的 `short int`：\n\n![image](img/213tab02.jpg)\n\n位与经常用于掩码操作。也就是说，该运算符可以用来将字的特定位设置为\
  \ `0`。例如，以下语句将 `w1` 与 `3` 进行与运算的结果赋值给 `w3`：\n\n```c\nw3 = w1 & 3;\n```\n\n这将是将 `w3`\
  \ 中除最后两位以外的所有位设置为 `0`，并保留 `w1` 的最后两位。\n\n与 Objective-C 中所有二元算术运算符一样，位运算符也可以通过添加等号作为赋值运算符。因此，语句\n\
  \n```c\nword &= 15;\n```\n\n执行的功能与 `word = word & 15;` 相同，效果是将 `word` 中除最后 4 位以外的所有位设置为\
  \ `0`。\n\n### 位或运算符\n\n当在 Objective-C 中对两个值进行位或（OR）运算时，会对两个值的二进制表示再次逐位进行比较。这一次，只要第一个值的位为\
  \ `1` 或第二个值的位为 `1`，结果的对应位就会产生 `1`。位或运算符的真值表所示：\n\n![image](img/214tab01.jpg)\n\n\
  所以，如果 `w1` 是十六进制 `19` 的 `short int`，而 `w2` 是十六进制 `6a` 的 `short int`，那么 `w1` 和 `w2`\
  \ 的位或运算将产生十六进制 `7b` 的结果，如下：\n\n![image](img/214tab02.jpg)\n\n位或运算（通常称为 OR 运算）用于将字的某些指定位设置为\
  \ `1`。例如，以下语句无论这些位在操作执行前的状态如何，都会将 `w1` 的最后三位设置为 `1`：\n\n```c\nw1 = w1 | 07;\n```\n\
  \n\n\n当然，你可以在语句中使用特殊的赋值运算符，如下句所示：\n\n```c\nw1 |= 07;\n```\n\n我们推迟稍后提供一个说明使用包含性或运算符（Inclusive-OR\
  \ operator）的程序示例。\n\n### 按位异或运算符\n\n按位异或运算符（Bitwise Exclusive-OR operator，通常称为 XOR\
  \ 运算符）的工作原理如下：对于两个操作数对应的位，如果其中一个位为 `1`——但不是两个位均为 `1`——则结果对应的位为 `1`；否则，则为 `0`。该运算符的真值表所示。\n\
  \n![image](img/214tab03.jpg)\n\n如果 `w1` 和 `w2` 分别设置为十六进制的 `5e` 和 `d6`，则 `w1` 与 `w2`\
  \ 进行异或运算的结果将是十六进制的 `e8`，如下所示：\n\n![image](img/215tab01.jpg)\n\n### 取反运算符\n\n取反运算符（Ones\
  \ complement operator）是一个一元运算符，它的作用仅仅是“翻转”操作数的位。操作数中每个 `1` 位都变为 `0`，每个 `0` 位都变为\
  \ `1`。这里提供真值表仅仅是为了完整性。\n\n![image](img/215tab02.jpg)\n\n如果 `w1` 是一个 16 位的 `short\
  \ int` 且被设置为十六进制的 `a52f`，那么对该值取反得到的结果是十六进制的 `5ad0`：\n\n```text\nw1   1010  0101\
  \  0010  1111     0xa52f\n~w1   0101  1010  1101  0000     0x5ad0\n```\n\n当你不知道操作中正在处理的数据的精确位宽时，取反运算符非常有用，它的使用可以帮助减少程序对整数数据类型特定大小依赖。例如，为了将名为\
  \ `w1` 的 `int` 的低位设置为 `0`，你可以将 `w1` 与一个除最右位为 `0` 外全为 `1` 的 `int` 进行与（AND）运算。因此，C\
  \ 语言中的如下语句在整数用 32 位表示的机器上运行良好：\n\n```c\nw1 &= 0xFFFFFFFE;\n```\n\n如果你将前面的语句替换为这一句，则\
  \ `w1` 在任何机器上都将与正确的值进行与运算：\n\n```c\nw1 &= ~1;\n```\n\n这是因为将计算 `1` 的取反值，它将包含填充 `int`\
  \ 大小所需的尽可能左的 `1` 位（在 64 位整数系统上为左侧的 63 位）。\n\n现在是时候展示一个实际的程序示例来说明各种位运算符的用法了（参见程序\
  \ 10.4）。\n\n**程序 10.4**\n\n```c\n// 按位运算符示例说明\n#import <Foundation/Foundation.h>\n\
  \nint main (int argc, char *argv[])\n{\n    NSAutoreleasePool * pool = [[NSAutoreleasePool\
  \ alloc] init];\n    unsigned int w1 = 0xA0A0A0A0, w2 = 0xFFFF0000,\n          \
  \            w3 = 0x00007777;\n    NSLog (@\"%x %x %x\", w1 & w2, w1 | w2, w1 ^\
  \ w2);\n    NSLog (@\"%x %x %x\", ~w1, ~w2, ~w3);\n    NSLog (@\"%x %x %x\", w1\
  \ ^ w1, w1 & ~w2, w1 | w2 | w3);\n    NSLog (@\"%x %x\", w1 | w2 & w3, w1 | w2 &\
  \ ~w3);\n    NSLog (@\"%x %x\", ~(~w1 & ~w2), ~(~w1 | ~w2));\n    [pool drain];\n\
  \    return 0;\n}\n```\n\n**程序 10.4 输出**\n\n```text\na0a00000 ffffa0a0 5f5fa0a0\n\
  5f5f5f5f ffff ffff8888\n0 a0a0 fffff7f7\na0a0a0a0 ffffa0a0\nffffa0a0 a0a0000\n```\n\
  \n计算程序 10.4 中的每项操作，以验证你是否理解了这些结果是如何得到的。\n\n在第四次 `NSLog` 调用中，重要的是要注意按位与运算符的优先级高于按位或运算符，因为这一事实会影响结果的值。第五次\
  \ `NSLog` 调用说明了德·摩根法则（DeMorgan’s rule）：`(~a & ~b)` 等于 `a | b`，而 `(~a | ~b)` 等于 `a\
  \ & b`。\n\n### 左移运算符\n\n当对一个值执行左移操作时，该值包含的位将向左移动。与此操作相关是要移动的位数（位移）。通过高位移出的位将丢失，而\
  \ `0` 总是通过低位移入。因此，如果 `w1` 等于 `3`，那么执行\n\n```c\nw1 << 1;\n```\n\n将结果左移一位。在整数用 32\
  \ 位表示的机器上，如下 C 语句可以正常工作：\n\n```c\nw1 <<= 1;\n```\n\n如果你将前面的语句替换为这一句，则 `w1` 在任何机器上都将与正确的值进行与运算：\n\
  \n```c\nw1 <<= 1;\n```\n\n这是因为将计算 `1` 的取反值将包含填充 `int` 大小所需的尽可能左的 `1` 位（在 64 位整数系统上为左侧的\
  \ 63 位）。\n\n### 右移运算符\n\n当对一个值执行右移操作时，该值包含的位将向右移动。与此操作相关是要移动的位数（位移）。通过低位移出的位将丢失，而\
  \ `0` 总是通过高位移入。因此，如果 `w1` 等于 `3`，那么执行\n\n```c\nw1 >> 1;\n```\n\n将结果右移一位。在整数用 32\
  \ 位表示的机器上，如下 C 语句可以正常工作：\n\n```c\nw1 >>= 1;\n```\n\n如果你将前面的语句替换为这一句，则 `w1` 在任何机器上都将与正确的值进行与运算：\n\
  \n```c\nw1 >>= 1;\n```\n\n#### 注意\n\n不要假设系统实现算术右移或逻辑右移。如果 `w1` 是一个 `unsigned int`\
  \ 占 32 位，且被设置为十六进制的 `F777EE22`，那么执行\n\n```c\nw1 >> 1;\n```\n\n得到十六进制的 `7BBBF71`，如下所示：\n\
  \n```text\nw1   1111  0111  0111  1110     0xf777ee22\n>>1   0111  1011  1011  1111\
  \     0x7bbf71\n```\n\n如果 `w1` 是有符号的 `short int`，则结果取决于机器如何实现算术右移或逻辑右移。\n\n### 练习\n\
  \n1. 使用第 8 章 中的 `Rectangle` 类，根据如下声明添加一个初始化方法：\n\n（注意：确保重覆盖 `init` 以使用此初始化。）\n\n\
  ```objc\n-(id)initWithWidth: (int) w andHeight: (int) h;\n```\n\n2. 假定将第 1 题中的方法标记为\
  \ `Rectangle` 类的指定初始化，并根据第 8 章中的 `Square` 和 `Rectangle` 类定义，为 `Square` 类添加一个初始化方法：\n\
  \n```objc\n-(id)initWithSide: (int) side;\n```\n\n3. 为 `Fraction` 类的 `add:` 方法添加计数器以统计其调用的次数。你如何获取计数器的值？\n\
  \n4. 使用 `typedef` 和枚举数据类型定义名为 `Day` 的类型，可选值为 `Sunday`、`Monday`、`Tuesday`、`Wednesday`、`Thursday`、`Friday`\
  \ 和 `Saturday`。\n\n5. 使用 `typedef` 定义名为 `FractionObj` 的类型，允许编写如下语句：\n\n```objc\n\
  FractionObj f1 = [[Fraction alloc] init],\n                 f2 = [[Fraction alloc]\
  \ init];\n```\n\n6. 根据以下定义：\n\n```c\nfloat f = 1.00;\nshort int i = 100;\n```\n\n\
  \n\n\n```\nlong int l = 500L;\n\ndouble d = 15.00;\n```\n\n结合本章概述的表达式中操作数转换的七步，确定以下表达式的类型和值：\n\
  \n`f + i`\n`l / d`\n`i / l + f`\n`l * i`\n`f / 2`\n`i / (d + f)`\n`l / (i * 2.0)`\n\
  `l + i / (double) l`\n\n# 第 11 章：分类与协议\n\n在本章中，你将学习如何通过分类（categories）以模块化的方式为类添加方法，以及如何创建一个供他人实现的标准化的方法列表。\n\
  \n### 分类 (Categories)\n\n有时你可能正在处理一个类定义，并想向其添加一些新方法。例如，你可能决定为你的 `Fraction` 类除了用于两个两个分数的\
  \ `add:` 方法外，你还希望拥有用于减法、乘法和除法两个分数的方法。\n\n另一个例子，假设你正在进行一个大型编程项目，作为该项目的一部分，你的小组正在定义一个包含许多不同方法的新类。你被分配的任务是为该类编写与文件系统交互的方法。其他项目成员被分配了负责创建和初始化类实例、对类中的对象执行操作，以及在屏幕上绘制类中对象表示的方法。\n\
  \n最后一个例子，假设你已经学会了如何使用库中的类（例如 Foundation 框架中的数组类 `NSArray`），并意识到你希望该类能实现一个或多个方法。当然，你可以编写\
  \ `NSArray` 类的新子类并实现新方法，但可能存在更简单的方法。\n\n解决所有这些情况的实用方案是 `categories`。分类为你提供了一种简单的方法，将类的定义模块化为相关方法的组或分类。它还为你提供了一种扩展现有类定义的简单方法，甚至无需访问类的原始源代码，也不需要创建子类。这是一个强大且易于学习的概念。\n\
  \n让我们回到第一个案例，展示如何为 `Fraction` 类添加一个新的分类来处理四种基础数学运算。我们首先向你展示原始的 `Fraction` 接口部分：\n\
  \n```objc\n#import <Foundation/Foundation.h>\n\n// 定义 Fraction 类\n\n@interface Fraction\
  \ : NSObject\n\n{\n   int numerator;\n   int denominator;\n}\n\n@property int numerator,\
  \ denominator;\n\n-(void) setTo: (int) n over: (int) d;\n\n-(Fraction *) add: (Fraction\
  \ *) f;\n\n-(void) reduce;\n\n-(double) convertToNum;\n\n-(void) print;\n\n@end\n\
  ```\n\n接下来，让我们从这个接口部分移除 `add:` 方法，并将其添加到一个新的分类中，同时加上你想要实现的其他三个数学运算。以下是你的新分类 `MathOps`\
  \ 的接口部分对应的内容：\n\n```objc\n#import \"Fraction.h\"\n\n@interface Fraction (MathOps)\n\
  \n-(Fraction *) add: (Fraction *) f;\n\n-(Fraction *) mul: (Fraction *) f;\n\n-(Fraction\
  \ *) sub: (Fraction *) f;\n-(Fraction *) div: (Fraction *) f;\n\n@end\n```\n\n请注意，尽管这是一个接口部分的定义，它是对现有接口的扩展。因此，你必须包含原始的接口部分，以便编译器知道\
  \ `Fraction` 类（除非你将新分类直接合并到原始的 `Fraction.h` 头文件中，这也是选择）。\n\n在 `#import` 之后，你会看到下面这一行：\n\
  \n```objc\n@interface Fraction (MathOps)\n```\n\n这告诉编译器你正在为 `Fraction` 类定义一个新的分类，其名称为\
  \ `MathOps`。分类名称包含在类名后的括号中。注意，你在这里不需要列出 `Fraction` 的父类；编译器已经从 `Fraction.h` 中知道了。此外，你不需要告诉它实例变量，就像你在之前定义的所有接口部分中所做的那样。事实上，如果你尝试列出父类或实例变量，你将得到编译器的语法错误。\n\
  \n此接口部分告诉编译器，你正在为名为 `MathOps` 的分类为 `Fraction` 类添加一个扩展。`MathOps` 分类包含四个实例方法：`add:`、`mul:`、`sub:`\
  \ 和 `div:`。每个方法都接受一个分数作为参数，并返回一个分数。\n\n你可以将所有方法的定义放在一个实现部分中。也就是说，你可以将 `Fraction.h`\
  \ 中接口部分的所有方法，加上 `MathOps` 分类中的所有方法定义在一个实现部分中。或者，你也可以将分类的方法定义在单独的实现部分中。在这种情况下，这些方法的实现部分也必须识别方法所属的分类。与接口部分一样，你通过在类名后的括号内包含分类名称来实现这一点，如下：\n\
  \n```objc\n@implementation Fraction (MathOps)\n\n   // 分类方法代码\n\n   ...\n\n@end\n\
  ```\n\n在 程序 11.1 中，新 `MathOps` 分类的接口部分和实现部分连同测试程序一起组合在一个文件中。\n\n**程序 11.1. MathOps\
  \ 分类与测试程序**\n\n* *\n\n```objc\n#import \"Fraction.h\"\n\n@interface Fraction (MathOps)\n\
  \n-(Fraction *) add: (Fraction *) f;\n\n-(Fraction *) mul: (Fraction *) f;\n\n-(Fraction\
  \ *) sub: (Fraction *) f;\n\n-(Fraction *) div: (Fraction *) f;\n\n@end\n\n@implementation\
  \ Fraction (MathOps)\n\n-(Fraction *) add: (Fraction *) f\n{\n   // 两个分数相加\n   //\
  \ a/b + c/d = ((a*d) + (b*c)) / (b*d)\n   Fraction *result = [[Fraction alloc] init];\n\
  \   result.numerator = (numerator * f.denominator + denominator * f.numerator);\n\
  \   result.denominator = denominator * f.denominator;\n   [result reduce];\n   return\
  \ result;\n}\n\n-(Fraction *) sub: (Fraction *) f\n{\n   // 两个分数相减\n   // a/b -\
  \ c/d = ((a*d) - (b*c)) / (b*d)\n   Fraction *result = [[Fraction alloc] init];\n\
  \   result.numerator = (numerator * f.denominator - denominator * f.numerator);\n\
  \   result.denominator = denominator * f.denominator;\n   [result reduce];\n   return\
  \ result;\n}\n\n-(Fraction *) mul: (Fraction *) f\n{\n   // 两个分数相乘\n   // a/b *\
  \ c/d = (a*c) / (b*d)\n   Fraction *result = [[Fraction alloc] init];\n   result.numerator\
  \ = numerator * f.numerator;\n   result.denominator = denominator * f.denominator;\n\
  \   [result reduce];\n   return result;\n}\n\n-(Fraction *) div: (Fraction *) f\n\
  {\n   // 两个分数相除\n   // a/b / c/d = (a*d) / (b*c)\n   Fraction *result = [[Fraction\
  \ alloc] init];\n   result.numerator = numerator * f.denominator;\n   result.denominator\
  \ = denominator * f.numerator;\n   [result reduce];\n   return result;\n}\n\n@end\n\
  \nint main (int argc, char *argv[])\n{\n   NSAutleasePool * pool = [[NSAutleasePool\
  \ alloc] init];\n   Fraction *a = [[Fraction alloc] init];\n   Fraction *b = [[Fraction\
  \ alloc] init];\n   Fraction *result;\n   [a setTo: 1 over: 3];\n   [b setTo: 2\
  \ over: 5];\n   [a print]; NSLog(@\"+\"); [b print]; NSLog(@\"-----\");\n   result\
  \ = [a add: b];\n   [result print];\n   NSLog(@\"\\n\");\n   [result release];\n\
  \   [a print]; NSLog(@\"-\"); [b print]; NSLog(@\"-----\");\n   result = [a sub:\
  \ b];\n   [result print];\n   NSLog(@\"\\n\");\n   [result release];\n   [a print];\
  \ NSLog(@\"*\"); [b print]; NSLog(@\"-----\");\n   result = [a mul: b];\n   [result\
  \ print];\n   NSLog(@\"\\n\");\n   [result release];\n   [a print]; NSLog(@\"/\"\
  ); [b print]; NSLog(@\"-----\");\n   result = [a div: b];\n   [result print];\n\
  \   NSLog(@\"\\n\");\n   [result release];\n   [a release];\n   [b release];\n \
  \  [pool drain];\n   return 0;\n}\n```\n\n* *\n\n**程序 11.1. 输出**\n\n* *\n\n1/3\n\
  \    +\n2/5\n-----\n11/15\n1/3\n    -\n2/5\n-----\n-1/15\n1/3\n    *\n2/5\n-----\n\
  2/15\n1/3\n    /\n2/5\n-----\n5/6\n\n```\n\n\n\n\n程序 11.1 将新类别的接口部分和实现部分与测试程序放在同一个文件中。如前提到的，该类别的接口部分可以放在原始的\
  \ `Fraction.h` 头文件中，以便所有方法都声明在一个地方，也可以放在它自己的头文件中。\n\n### 注意事项\n\n按照惯例，类别（category）的\
  \ `.h` 和 `.m` 文件的基础名称是类名加上类别名。在我们的示例中，我们将该类别的接口部分放在名为 `FractionMathOps.h` 的文件中，将实现部分放在名为\
  \ `FractionMathOps.m` 的文件中。\n\n如果你将类别放入一个主类定义文件中，那么该类的所有用户都可以访问该类别中的方法。如果你没有能力直接修改原始头文件（例如，考虑为来自库中的现有类添加类别，如第二部分，“Foundation\
  \ 框架”所示），那么你别无选择将它们分开。\n\n#### 关于类别的的一些说明\n\n关于类别有几点值得提一下。首先，虽然类别可以访问原始类的实例变量，但它不能添加任何自己的实例变量。如果你需要这样做，请考虑子类化（subclassing）。\n\
  \n此外，类别可以覆盖类中的另一个方法，但这被认为是不良的编程习惯。其一在于，覆盖方法后，你再无法访问原始方法了。因此，你必须小心地在替换方法中复制被覆盖方法的所有功能。如果你确实需要覆盖一个方法，子类化可能是正确的选择。如果你在子类中覆盖了一个方法，你仍然可以通过向\
  \ `super` 发送消息来引用父类的方法。因此，你不需要理解所覆盖方法的所有细节；你只需要调用父类的方法并在子类的方法中添加你自己的功能即可。\n\n遵循我们在这里列出的规则，你可以拥有任意数量的类别。如果一个方法在多个类别中都有定义，该语言并没有规定将使用哪一个。\n\
  \n与普通的接口部分不同，你不需要实现类别中的所有方法。这对于增量程序开发非常有用，因为你可以声明类别中的所有方法并随着时间的推移实现它们。\n\n记住，通过类别添加新方法来扩展类不仅会影响该类，还会影响它的所有子类。如果例如向根对象\
  \ `NSObject` 添加新方法，这可能是危险的，因为无论你的意图如何，每个人都会继承这些新方法。\n\n通过类别为现有类添加的新方法可以很好地满足你的需求，但它们可能与类的原始设计或意图不一致。例如，通过添加新类别和一些方法将\
  \ `Square` 变成 `Circle`（诚然，这是一种夸张）会混淆类的定义，不是良好的编程习惯。\n\n此外，对象/类别的命名对必须是唯一的。在给定的 Objective-C\
  \ 命名空间中只能存在一个 `NSString (Private)` 类别。这很微妙，因为 Objective-C 命名空间是在程序代码与所有库、框架和插件之间共享的。对于编写屏幕保护程序、偏好设置和其他插件的\
  \ Objective-C 程序员来说尤为重要，因为他们的代码会被注入到他们无法控制应用程序或框架代码中。\n\n### 协议与委托\n\n协议 是在类之间共享的方法列表。协议中列出的方法没有相应的实现；它们旨在由他人（比如你！）来实现。协议提供了一种定义一组方法的方法，这些方法与特定的名称有某种关联。通常对这些方法会有文档说明，以便你知道它们是如何执行的，并在需要时在自己的自己的类定义中实现它们。\n\
  \n协议列出一组方法，其中一些你可以可选地实现，另一些是你必须实现的。如果你决定实现某个特定协议的所有强制方法，则被称为`遵循`（conform to）或`采用`（adopt）该协议。你允许定义一个所有方法都是可选的协议，或者一个所有方法都是强制的协议。\n\
  \n定义协议非常简单：你只需要使用 `@protocol` 指令后加上协议名称（由你决定）。之后，你像在接口部分中那样声明方法。所有的方法声明到 `@end`\
  \ 指令为止都成为协议的一部分。\n\n当你与 Foundation 框架一起工作时，你会发现定义了几个协议。其中一个名为 `NSCopying`，它声明了一个如果你的类要支持复制就需要实现的方法。（第\
  \ 18 章，“复制对象”）\n\n以下是 `NSCopying` 协议在标准头文件 `NSObject.h` 中的定义：\n\n```objc\n@protocol\
  \ NSCopying\n\n- (id)copyWithZone:(NSZone *)zone;\n\n@end\n```\n\n如果你在类中采用 `NSCopying`\
  \ 协议，你必须实现一个名为 `copyWithZone:` 的方法。你通过在 `@interface` 行的角括号对（`<`...>）中列出协议名称来告诉编译器你正在采用一个协议。协议名称位于类名及其父类名之后，如下：\n\
  \n```objc\n@interface AddressBook: NSObject <NSCopying>\n```\n\n这表示 `AddressBook`\
  \ 是一个父类为 `NSObject` 的对象，并声明它遵循 `NSCopying` 协议。由于系统已经知道之前为协议定义的方法（在本例中，它是从 `NSObject.h`\
  \ 知知的），所以你不需要在接口部分声明这些方法。然而，你需要在实现部分定义它们。\n\n在 `AddressBook` 的实现部分，编译器期望看到 `copyWithZone:`。\n\
  \n如果你的类采用了多个协议，只需将它们列在角括号内，并用逗号分隔：\n\n```objc\n@interface AddressBook: NSObject\
  \ <NSCopying, NSCoding>\n```\n\n这告诉编译器 `AddressBook` 类采用了 `NSCopying` 和 `NSCoding`\
  \ 协议。再次，编译器期望在 `AddressBook` 的实现部分实现这些协议的所有强制方法。\n\n如果你定义了自己的协议，你并不需要自己实际实现它。然而，你是在提醒其他程序员，如果他们想采用该协议，就必须实现强制方法。这些方法可以从父类继承。因此，如果一个类遵循\
  \ `NSCopying` 协议，它的子类也是如此（尽管并不意味着方法在子类中已正确实现）。\n\n你可以使用协议来定义你希望子化类的人实现的方法。也许你可以为你的\
  \ `GraphicObject` 类定义一个 `Drawing` 协议；在其中，你可以定义 `paint`、`erase` 和 `outline` 方法：\n\
  \n```objc\n@protocol Drawing\n\n-(void)paint;\n\n-(void)erase;\n\n@optional\n\n\
  -(void)outline;\n\n@end\n```\n\n作为 `GraphicObject` 类的创建者，你并不想要实现这些绘画方法。然而，你想指定那些子化\
  \ `GraphicObject` 类的人需要实现的方法，以符合他们正尝试创建的对象的标准。\n\n\n\n\n注意这里使用了 `@optional` 指令。列在该指令之后的任何方法都是可选的。这意味着是，`Drawing`\
  \ 协议的采纳者不必实现 `outline` 方法即可符合该协议。（你随后可以在协议定义内部使用 `@required` 指令来切换回列出必要方法。）\n\n\
  ### 注意\n\n好吧，至少从意图的初衷来说是这样的。编译器允许你声称你符合某个协议，并且只有在你没有实现这些方法时，才会发出警告信息。\n\n所以，如果你为\
  \ `GraphicObject` 创建了一个名为 `Rectangle` 的子类，并声明（即，*记录*）你的 `Rectangle` 类符合 `Drawing`\
  \ 协议，那么该类的用户就会知道他们可以向该类的实例发送 `paint`、`erase` 和（可能的）`outline` 消息。\n\n请注意，该协议没有引用任何类；它是*无类化（classless）*的。任何类都可以符合\
  \ `Drawing` 协议，而不仅仅是 `GraphicObject` 的子类。\n\n你可以通过 `conformsToProtocol:` 方法来检查一个对象是否符合某个协议。例如，如果你有一个名为\
  \ `currentObject` 的对象，并想查看它是否符合 `Drawing` 协议以便向其发送绘制消息，你可以这样写代码：\n\n```\nid currentObject;\n\
  \n...\n\nif ([currentObject conformsToProtocol: @protocol (Drawing)] == YES)\n{\n\
  \  // 向 currentObject 发送 paint, erase 和/或 outline 消息\n  ...\n}\n```\n\n在这里使用的特殊\
  \ `@protocol` 指令接收协议名称并产生一个 `Protocol` 对象，这正是 `conformsToProtocol:` 方法期望的参数。\n\n\
  要测试 `currentObject` 是否已经实现了可选的 `outline` 方法，你可以这样写代码：\n\n```objc\nif ([currentObject\
  \ respondsToSelector: @selector (outline)] == YES)\n    [currentObject outline];\n\
  ```\n\n你可以利用编译器的帮助来检查变量的符合性，方法是在类型名后的尖角括号内包含协议名称，如下所示：\n\n```objc\nid <Drawing>\
  \ currentObject;\n```\n\n这告诉编译器 `currentObject` 将引用符合 `Drawing` 协议的对象。如果你将一个不符合\
  \ `Drawing` 协议的静态类型对象赋值给 `currentObject`（假设你有一个不符合该协议的 `Square` 类），编译器会发出如下所示的警告信息：\n\
  \n`warning: class 'Square' does not implement the 'Drawing' protocol`\n\n这是一个编译检查，因此将一个\
  \ `id` 变量赋值给 `currentObject` 不会生成此消息，因为编译器无法得知存储在 `id` 变量中的对象是否符合 `Drawing` 协议。\n\
  \n如果变量将持有符合多个协议的对象，你可以列出多个协议，如此行所示：\n\n```objc\nid <NSCopying, NSCoding> myDocument;\n\
  ```\n\n当你定义一个协议时，可以扩展现有协议的定义。此协议声明表示 `Drawing3D` 协议也采用了 `Drawing` 协议：\n\n```objc\n\
  @protocol Drawing3D <Drawing>\n```\n\n因此，任何采纳 `Drawing3D` 协议的类必须实现该协议列出的方法，以及来自\
  \ `Drawing` 协议的方法。\n\n最后，分类（category）也可以采纳协议，如下：\n\n```objc\n@interface Fraction\
  \ (Stuff) <NSCopying, NSCoding>\n```\n\n在这里，`Fraction` 有一个分类 `Stuff`（好吧，这不是最好的命名选择！），它采纳了\
  \ `NSCopying` 和 `NSCoding` 协议。\n\n与类名一样，协议名称必须是唯一的。\n\n### 委托\n\n你也可以将协议想为两个类之间的*接口（interface）*定义。定义协议的类可以被认为是在*委托（delegating）*将协议中方法定义的工作给实现这些方法的类。通过这种方式，该类可以定义得更通用，而具体的操作由委托类在响应某些事件或定义特定参数时执行。Cocoa\
  \ 和 iOS 高度依赖这种委托概念。例如，当你在 iPhone 屏幕上设置一个表格时，你会使用 `UITableView` 类。但该类不知道表格的标题、包含多少个节（sections）或行（rows），或者在表格的每行（cell）中放入什么。因此它通过定义一个名为\
  \ `UITableViewDataSource` 的协议将该责任委托给你。当它需要信息时（例如，表格每个节中有多少行），它将调用你根据协议在你的类中定义的相应方法。`UITableView`\
  \ 类还定义了另一个名为 `UITableViewDelegate` 的协议。该协议中的方法定义了（除其他之外）当表格中的某一行被选中时应该执行什么。该类不知道应该采取什么操作，因此它将该责任委托给你。\n\
  \n### 非正式协议\n\n你在阅读时时可能会遇到*非正式（informal）*协议的概念。这实际上是一个列出一组方法但没有实现这些方法的分类。每个人（或几乎所有人）都继承自同一个根对象，因此非正式分类通常为根类定义。有时，非正式协议也被称为*抽象（abstract）*协议。\n\
  \n如果你查看头文件 `<NSScriptWhoseTests.h>`，你可能会发现一些这样的方法声明：\n\n```objc\n@interface NSObject\
  \ (NSComparisonMethods)\n\n- (BOOL)isEqualTo:(id)object;\n- (BOOL)isLessThanOrEqualTo:(id)object;\n\
  - (BOOL)isLessThan:(id)object;\n- (BOOL)isGreaterThanOrEqualTo:(id)object;\n- (BOOL)isGreaterThan:(id)object;\n\
  - (BOOL)isNotEqualTo:(id)object;\n- (BOOL)doesContain:(id)object;\n- (BOOL)isLike:(NSString\
  \ *)object;\n- (BOOL)isCaseInsensitiveLike:(NSString *)object;\n\n@end\n```\n\n\
  这为 `NSObject` 类定义了一个名为 `NSComparisonMethods` 的分类。这个非正式协议列了一组（这里列出了九个）方法，这些方法可以作为协议的一部分被实现。非正式协议实际上只是一个名称下的方法分组。这在文档说明和模块化方面有一定的帮助。\n\
  \n声明非正式协议的类在类本身中不实现这些方法，而选择实现这些方法的子类需要在其接口部分重新声明它们，并实现其中一个或多个方法。与正式协议不同，编译器不会为非正式协议提供任何帮助；不存在符合性检查或编译器测试的概念。\n\
  \n如果一个对象采纳了正式协议，该对象必须符合协议中的所有必要消息。这可以在运行时和编译时强制执行。如果一个对象采纳了非正式协议，取决于协议，该对象可能不需要采用中的所有方法。非正式协议的符合性可以在运行时（通过\
  \ `respondsToSelector:`）强制执行，但无法在编译时执行。\n\n\n\n\n举个例子，考虑你在第 8 章“继承”中定义的 `Square`\
  \ 类。你将它定义为 `Rectangle` 的子类，因为你意识到正方形只是边长相等的矩形。当你定义一个子类时，它会继承父类所有的实例变量和方法。在某些情况下，这种做法是不理想的——例如，父类中定义的某些方法可能不适用于子类使用。`Rectangle`\
  \ 的 `setWidth:andHeight:` 方法被 `Square` 类继承了，但它实际上并不适用于正方形（尽管它可以正常工作）。此外，当你创建一个子类时，你必须确保所有继承的方法都能正常工作，因为该类的用户将能够访问这些方法。最后，子类依赖于父类。父类的更改可能会在无意中导致子类中的方法失效。\n\
  \n作为子类化的替代方案，你可以定义一个新类，并将你想要扩展的类的对象作为其实例变量之一包含在内。这样一来，你只需要在新类中定义适用于该类的方法即可。回到 `Square`\
  \ 的示例，这里是定义 `Square` 的另一种方式：\n\n```objc\n@interface Square: NSObject\n\n{\n   Rectangle\
  \ *rect;\n}\n\n-(int) setSide: (int) s;\n\n-(int) side;\n\n-(int) area;\n\n-(int)\
  \ perimeter;\n\n@end\n```\n\n这里的 `Square` 类定义了四个方法。与子类版本不同（子类版本让你可以直接访问 `Rectangle`\
  \ 的方法：`setWidth:`, `setHeight:`, `setWidth:andHeight:`, `width` 和 `height`），而这个\
  \ `Square` 的定义中并没有包含这些方法。这在这里是合理的，因为在处理正方形时，这些方法确实并不适用。\n\n如果你这样定义 `Square`，那么它就负责为它所包含的矩形分配内存。例如，在没有重写方法的情况下，语句\n\
  \n```objc\nSquare *mySquare = [[Square alloc] init];\n```\n\n分配了一个新的 `Square` 对象，但没有为存储在它的实例变量\
  \ `rect` 中的 `Rectangle` 对象分配内存。\n\n解决方案是重写 `init` 或添加诸如 `initWithSide:` 的新方法来执行分配。该方法可以分配\
  \ `Rectangle rect` 并恰当地设置其边长。你还需要重写 `dealloc` 方法（你已经在第 8 章中看到过如何对 `Rectangle` 类这样做），以便在\
  \ `Square` 释放时释放 `Rectangle rect` 使用的内存。\n\n在 `Square` 类中定义方法时，你仍然可以利用 `Rectangle`\
  \ 的方法。例如，你可以这样实现 `area` 方法：\n\n```objc\n-(int) area\n{\n  return [rect area];\n\
  }\n```\n\n其余方法的实现留给你练习（参见下文的练习 5）。\n\n### 练习\n\n1. 扩展程序 11.1 中的 `MathOps` 分类，添加一个\
  \ `invert` 方法，该方法返回接收者倒数的 `Fraction`。\n\n2. 为 `Fraction` 类添加一个名为 `Comparison` 的分类。在该分类中，根据以下声明添加方法：\n\
  \n```objc\n-(BOOL) isEqualTo: (Fraction *) f;\n\n-(int) compare: (Fraction *) f;\n\
  ```\n\n如果两个分数相同，第一个方法应返回 `YES`，否则返回 `NO`。在比较分数时要小心（例如，比较 `3/4` 和 `6/8` 应返回 `YES`）。\n\
  \n如果接收者小于参数所表示的分数，第二个方法应返回 `–1`；如果两者相等，返回 `0`；如果接收者大于参数，则返回 `1`。\n\n3. 通过添加符合本章稍后列出的非正式协议\
  \ `NSComparisonMethods` 的方法来扩展 `Fraction` 类。实现该协议的前六个方法（`isEqualTo:`, `isLessThanOrEqualTo:`,\
  \ `isLessThan:`, `isGreaterThanOrEqualTo:`, `isGreaterThan:`, `isNotEqualTo:`）并对它们进行测试。\n\
  \n4. 函数 `sin()`、`cos()` 和 `tan()` 是标准 C 库的一部分（正如 `scanf()` 一样）。这些函数在系统头文件 `math.h`\
  \ 中声明，当你当你导入 `Foundation.h` 时，它会自动导入到你的程序中。\n\n你可以使用这些函数分别计算其 `double` 类型参数的正弦、余弦或正切值，该参数以弧度表示。结果也以双精度浮点值返回。因此，你可以使用这一行代码计算以弧度表示的角度\
  \ `d` 的正弦值：\n\n```objc\nresult = sin (d);\n```\n\n为第 6 章“做出决策”中定义的 `Calculator`\
  \ 类添加一个名为 `Trig` 的分类。在该分类中添加此类声明的方法来计算正弦、余弦和正切：\n\n```objc\n-(double) sin;\n\n-(double)\
  \ cos;\n\n-(double) tan;\n```\n\n5. 结合本章关于复合对象的讨论以及以下接口部分：\n\n```objc\n@interface\
  \ Square: NSObject\n\n{\n    Rectangle *rect;\n}\n\n-(Square *) initWithSide: (int)\
  \ s;\n\n-(void) setSide: (int) s;\n\n-(int) side;\n\n-(int) area;\n\n-(int) perimeter;\n\
  \n@end\n```\n\n编写 `Square` 的实现部分，并确保重写 `init` 以及 `initWithSide:`。\n\n## 12. 预处理器\n\
  \n预处理器提供了一些工具，让你能够编写出易于开发、修改和移植到不同系统的程序。你也可以使用预处理器来定制 Objective-C 语言以适应特定的应用程序。预处理器是\
  \ Objective-C 编译过程的一部分，它识别穿插在程序中的特殊语句。正如其名所示，预处理器会在分析 Objective-C 程序本身之前处理这些语句。预处理器语句通过井号（`#`）识别，井号必须是行的第一个非空白字符。正如你将看到的，预处理器语句的语法与普通的\
  \ Objective-C 语句略有不同。我们从检查 `#define` 语句开始。\n\n### #define 语句\n\n`#define` 语句的主要用途之一是为常量分配符号名称。预处理器语句\n\
  \n```objc\n#define TRUE 1\n```\n\n定义了 `TRUE` 等于 `1`。随后，`TRUE` 名称可以在程序中任何可以使用常量 `1`\
  \ 的地方使用。每当该名称出现，预处理器会自动将其定义值 `1` 替换到程序中。例如，你可能有使用定义名称 `TRUE` 的 Objective-C 语句：\n\
  \n```objc\ngameOver = TRUE;\n```\n\n该语句将 `TRUE` 的值赋值给 `gameOver`。你不需要关心为 `TRUE`\
  \ 定义的实际值，但因为你知道将其定义为 `1`，前面的语句的效果是将 `1` 赋值给 `gameOver`。预处理器语句\n\n```objc\n#define\
  \ FALSE 0\n```\n\n定义了 `FALSE` 名称，并使其在程序中的后续使用等同于指定 `0`。因此，语句\n\n```objc\ngameOver\
  \ = FALSE;\n```\n\n将 `FALSE` 的值赋值给 `gameOver`，而语句\n\n```objc\nif ( gameOver == FALSE\
  \ )\n```\n\n将 `gameOver` 的值与 `FALSE` 的定义值进行比较。\n\n定义名称*不是*变量。因此，你无法给它赋值，除非替换定义值的结果是一个变量。每当在程序中使用定义名称时，预处理器会自动将\
  \ `#define` 语句中定义名称右侧的内容替换到程序中。这类似于在文本编辑器中执行搜索并替换；在这种情况下，预处理器会将所有定义名称的出现替换为其关联的文本。\n\
  \n\n\n\n注意`#define` 语句具有特殊的语法：没有使用等号将值 `1` 赋值给 `TRUE`。此外，语句末尾*没有*出现分号。很快你就会理解为什么存在这种特殊语法。\n\
  \n`#define` 语句通常放置在程序的开头，位于 `#import` 或 `#include` 语句之后。这并不是要求的；它们可以出现在程序的任何地方。然而，一个名称在程序引用它之前必须已经定义。定义的名称行为与变量不同：不存在所谓的局部定义（local\
  \ define）。一旦一个名称被定义，它在之后可以在程序的*任何地方*使用。大多数程序员将定义放在头文件中，以便于多个源文件可以使用它们。\n\n作为使用定义名称的另一个例子，假设你想写两个方法来计算\
  \ `Circle` 对象的面积和周长。因为这两个方法都需要使用常量 `π`，而这个常量并不特别容易记忆，因此在程序开始时定义一次该常量的值，然后在每个方法中需要的地方使用该值，可能会是有意义的。\n\
  \n因此，你可以在程序中包含以下内容：\n\n```\n#define PI     3.141592654\n```\n\n然后你就可以在两个 `Circle`\
  \ 方法中使用它（假设 `Circle` 类有一个名为 `radius` 的实例变量）：\n\n```c\n-(double) area\n{\n    return\
  \ PI * radius * radius;\n}\n\n-(double) circumference\n{\n    return 2.0 * PI *\
  \ radius;\n}\n```\n\n（注意：我们承认已经存在一个名为 `M_PI` 的预定义符号，你可以在任何需要 `π` 的值时使用它。）将常量赋值给符号名称，可以让你无需在每次想在程序中使用它时都记住那个特定的常量值。此外，如果你需要更改常量的值（例如，你可能发现自己使用了错误的值），你只需要更改程序中唯一一处的值：即在\
  \ `#define` 语句中。如果没有这种方法，你必须搜索整个程序，并在每次使用该常量时显式地更改它的值。\n\n你可能已经注意到到为止为止的所有定义（`TRUE`、`FALSE`\
  \ 和 `PI`）都是用大字母写的。这样做是为了在视觉上将定义值与变量区分开。一些程序员采用所有定义名称均大写的惯例，以便判断一个名称代表的是变量、对象、类名还是定义名称。另一种常见的惯例是在定义名前加上字母\
  \ `k`。在那种情况下，名称的后续字符就不大写了。`kMaximumValues` 和 `kSignificantDigits` 就是两个遵循这一惯例的定义名称示例。\n\
  \n使用定义名称作为常量值有助于使程序更具扩展性。例如，当你学习如何处理数组时，与其硬编码（hard-coding）想要分配的数组大小，你可以如下所示定义一个值：\n\
  \n```\n#define MAXIMUM_DATA_VALUES  1000\n```\n\n然后你就可以基于这个定义值处理所有的引用（例如在内存中分配数组）以及该数组的有效索引。\n\
  \n此外，如果程序被写为在所有使用数组大小的地方使用 `MAXIMUM_DATA_VALUES`，那么如果你以后需要更改数组大小，那么之前的定义可能是程序中唯一需要更改的语句。\n\
  \n### 更高级的定义类型\n\n名称的定义可以包含简单的常量值以外。它可以包含表达式，而且正如你很快看到的，几乎包含任何其他内容！\n\n以下定义将名称 `TWO_PI`\
  \ 为 `2.0` 和 `3.141592654` 的乘积：\n\n```\n#define TWO_PI  2.0 * 3.141592654\n```\n\n\
  随后，你可以在程序中任何表达式 `2.0 * 3.141592654` 有效的地方使用这个定义名称。因此，你可以将上一个示例中 `circumference`\
  \ 方法的 `return` 语句替换为以下语句：\n\n```c\nreturn TWO_PI * radius;\n```\n\n当 Objective-C\
  \ 程序中遇到定义名称时，`#define` 语句中定义名称右侧出现的内容字面上会被替换为程序中该位置的名称。因此，当预处理器在之前显示的 `return` 语句中遇到名称\
  \ `TWO_PI` 时，它会将 `#define` 语句中该名称对应的任何内容替换掉该名称。因此，每当程序中出现定义名称 `TWO_PI`，预处理器都会字面上替换为\
  \ `2.0 * 3.141592654`。\n\n预处理器每当定义名称出现时都执行字面文本替换这一事实，解释了为什么你通常不想用分号结束你的 `#define`\
  \ 语句。如果你这样做了，分号也会在定义名称出现的任何地方被替换到程序中。如果你定义 `PI` 为：\n\n```\n#define PI     3.141592654;\n\
  ```\n\n然后写下\n\n```c\nreturn 2.0 * PI * r;\n```\n\n在预处理器进行替换后，编译器将看到定义名称 `PI` 的出现被替换为\
  \ `3.141592654;`。因此，编译器将把此语句视为：\n\n```c\nreturn 2.0 * 3.141592654; * r;\n```\n\n\
  一个定义本身并不非是一个有效的 Objective-C 表达式，只要结果生成的表达式在它被使用的任何地方都是有效的即可。例如，你可以设置这些定义：\n\n```\n\
  #define AND  &&\n#define OR   ||\n```\n\n然后你就可以写出这样的表达式：\n\n```c\nif ( x > 0 AND\
  \ x < 10 )\n```\n\n以及\n\n```c\nif ( y == 0 OR y == value )\n```\n\n你甚至可以为相等测试包含一个\
  \ `#define`：\n\n```\n#define EQUALS ==\n```\n\n然后，你可以写：\n\n```c\nif ( y EQUALS 0\
  \ OR EQUALS value )\n```\n\n为了增加趣味性，定义值本身可以引用另一个定义值。因此这两行 `#define` 语句是完全有效的：\n\n\
  ```\n#define PI     3.141592654\n#define TWO_PI  2.0 * PI\n```\n\n名称 `TWO_PI` 是根据之前定义的名称\
  \ `PI` 定义的，因此不再需要重复写出值 `3.141592654`。\n\n反转定义的顺序（如示例所示）也是有效的：\n\n```\n#define TWO_PI\
  \  2.0 * PI\n#define PI     3.141592654\n```\n\n规则是，只要在定义定义名称时一切已定义，就可以就可以定义中引用其他定义值。\n\
  \n良好的 `#define` 使用通常可以减少程序内部注释。考虑以下语句：\n\n```c\nif ( year % 4 == 0 && year % 100\
  \ != 0 || year % 400 == 0 )\n```\n\n这个表达式测试变量 `year` 是否为闰年。现在考虑下面的 `#define` 语句和随后的\
  \ `if` 语句：\n\n```\n#define IS_LEAP_YEAR  year % 4 == 0 && year % 100 != 0 \\\n \
  \                            || year % 400 == 0\n```\n\n```c\nif ( IS_LEAP_YEAR\
  \ )\n```\n\n通常，预处理器假设定义包含在程序的一行中。如果需要第二行，行的最后一个字符必须是反斜杠字符。该字符向预处理器发送延续信号，在其他情况下会被忽略。对于多行延续，情况也是如此；每一行需要延续的行都以反斜杠字符结束。\n\
  \n\n\n\n\n前面的 `if` 语句比直接在其之前的那个要容易理解得多。不需要注释，因为该语句是自而易懂的。当然，该定义将你限制为测试变量 `year`\
  \ 以判断它是否为闰年。如果可以编写一个定义来判断任何年份是否为闰年，而不仅仅是变量 `year`，那就太好了。实际上，你可以编写一个接受一个或多个参数的定义，这引出了我们下一个讨论的点。\n\
  \n`IS_LEAP_YEAR` 可以定义为接受一个名为 `y` 的参数，如下：\n\n```c\n#define IS_LEAP_YEAR(y)  y % 4\
  \ == 0 && y % 100 != 0 \\\n                             || y % 400 == 0\n```\n\n\
  与方法定义不同，你在这里不需要定义参数 `y` 的类型，因为你仅仅是在字面文本替换——你并没有调用函数。注意，在定义带有参数的名称时，定义的名称与参数列表的左括号之间不允许有空格。\n\
  \n使用之前的定义，你可以编写像下面这样的语句：\n\n```c\nif ( IS_LEAP_YEAR (year) )\n  ...\n```\n\n这测试了\
  \ `year` 的值是否为闰年。或者你可以写这样的语句来测试 `nextYear` 的值是否为闰年：\n\n```c\nif ( IS_LEAP_YEAR (nextYear)\
  \ )\n  ...\n```\n\n在前面的语句中，`IS_LEAP_YEAR` 的定义被直接替换到 `if` 语句内部，参数 `nextYear` 替换定义中任何出现\
  \ `y` 的地方。因此编译器看到的 `if` 语句实际上：\n\n```c\nif ( nextYear % 4 == 0 && nextYear % 100\
  \ != 0 || nextYear % 400 == 0 )\n  ...\n```\n\n定义通常被称为*宏*（macros）。这个术语更多地应用于接受一个或多个参数的定义。\n\
  \n这个名为 `SQUARE` 的宏简单地计算其参数的平方：\n\n```c\n#define SQUARE(x) x * x\n```\n\n尽管 `SQUARE`\
  \ 的宏定义非常直观，但在定义宏时你必须避免一个有趣的陷阱。正如我们所描述的，语句\n\n```c\ny = SQUARE (v);\n```\n\n将 `v²`\
  \ 的值赋值给 `y`。考虑一下以下语句会发生什么：\n\n```c\ny = SQUARE (v + 1);\n```\n\n这条语句*并没有*如你预期的那样将\
  \ `(v + 1)²` 的值赋值给 `y`。因为预处理器执行参数到宏定义的字面文本替换，前面的表达式实际上求值如下：\n\n```c\ny = v + 1 *\
  \ v + 1;\n```\n\n这显然没有产生预期的结果。为了妥善处理这种情况，在 `SQUARE` 宏的定义中需要括号：\n\n```c\n#define\
  \ SQUARE(x)  ( (x) * (x) )\n```\n\n尽管之前的定义看起来很奇怪，但请记住传递给 `SQUARE` 宏的整个表达式会被字面替换到定义中任何出现\
  \ `x` 的地方。有了你新的 `SQUARE` 宏定义，语句\n\n```c\ny = SQUARE (v + 1);\n```\n\n随后被正确地求值为：\n\
  \n```c\ny = ( (v + 1) * (v + 1) );\n```\n\n下面的宏允许你从你的 `Fraction` 类中动态创建新的分数：\n\n\
  ```objc\n#define MakeFract(x,y) ([[Fraction alloc] initWith: x over: y])\n```\n\n\
  然后你可以编写这样的表达式：\n\n```objc\nmyFract = MakeFract (1, 3);  // 创建分数 1/3\n```\n\n条件表达式运算符在定义宏时特别有用。下面定义了一个名为\
  \ `MAX` 的宏，它给出两个值中的最大值：\n\n```c\n#define MAX(a,b)  ( ((a) > (b)) ? (a) : (b) )\n\
  ```\n\n这个宏允许你随后编写像这样的语句：\n\n```c\nlimit = MAX (x + y, minValue);\n```\n\n这将 `x +\
  \ y` 和 `minValue` 中的最大值赋值给 `limit`。在整个 `MAX` 定义周围加上括号是为了确保像像这样的表达式被正确求值：\n\n```c\n\
  MAX (x, y) * 100\n```\n\n在每个参数周围单独放置括号，是为了确保下面的表达式被正确求值：\n\n```c\nMAX (x & y, z)\n\
  ```\n\n`&` 运算符是按位与运算符，它的优先级低于宏中使用的 `>` 运算符。如果宏定义中没有括号，`>` 运算符将在按位与之前计算，产生错误的结果。\n\
  \n下面的宏测试一个字符是否为小写字母：\n\n```c\n#define IS_LOWER_CASE(x) ( ((x) >= 'a') && ((x) <=\
  \ 'z') )\n```\n\n它因此允许你编写像这样的表达式：\n\n```objc\nif ( IS_LOWER_CASE (c) )\n  ...\n\
  ```\n\n你甚至可以在另一个宏定义中使用这个宏将字符从小写转换为大写，同时保持任何非小写字符不变：\n\n```objc\n#define TO_UPPER(x)\
  \ ( IS_LOWER_CASE (x) ? (x) - 'a' + 'A' : (x) )\n```\n\n再次，你在这里处理的是标准的 ASCII 字符集。当你学习\
  \ Foundation 时，你会看到如何使用这些。\n\n\n\n\nObjective-C 预处理器提供了一种名为*条件编译*的特性。条件编译通常用于创建一个可以被编译并运行在不同计算机系统上的程序。它还经常用于在程序中开启或关闭各种语句，例如打印变量值或追踪程序执行流的调试语句。\n\
  \n## `#ifdef`、`#endif`、`#else` 和 `#ifndef` 语句\n\n遗憾的是，程序有时必须依赖于与系统相关的参数，这些参数在不同设备（例如\
  \ iPhone 与 iPad）或特定版本的操作系统（例如 Leopard 豹系统与 Snow Leopard 雪雪豹系统）上需要以不同的方式进行指定。\n\n\
  如果你有一个大型程序，并且它对计算机系统的特定硬件和/或软件有许多此类依赖关系（你应该尽可能地减少这种依赖），那么你可能会发现为了在另一个环境中运行，必须更改许多许多值。\n\
  \n你可以通过使用预处理器的条件编译能力来帮助减少更改这些值的问题，并为每种不同的机器将这些定义的数值整合到程序中。作为一个简单的例子，以下语句的作用是：如果符号\
  \ `IPAD` 之前已经被定义，则将 `kImageFile` 定义为 `@\"barnHD.png\"`，否则定义为 `@\"barn.png\"`：\n\n\
  ```\n#ifdef IPAD\n#  define kImageFile  @\"barnHD.png\"\n#else\n#  define kImageFile\
  \  @\"barn.png\"\n#endif\n```\n\n如你所见，你可以在起始预处理器语句的 `#` 之后放置一个或多个空格。\n\n`#ifdef`、`#else`\
  \ 和 `#endif` 语句的行为正如你所预期。如果 `#ifdef` 行上指定的符号已经定义（通过 `#define` 语句或在编译程序时通过命令行），编译器将处理后续\
  \ `#else`、`#elif` 或 `#endif` 之前的行；否则，这些行将被忽略。\n\n要向预处理器定义符号 `IPAD`，使用以下语句：\n\n```\n\
  #define IPAD  1\n```\n\n甚至只需：\n\n```\n#define IPAD\n```\n\n就足够了。如你所见，为了满足 `#ifdef`\
  \ 测试，在定义的名称之后不需要出现任何文本。编译器还允许你在编译程序时，通过编译器命令的特殊选项为预处理器定义一个名称。命令行：\n\n```\ngcc –framework\
  \ Foundation -D IPAD program.m –\n```\n\n该命令向预处理器定义名称 `IPAD`，导致 `program.m` 内部所有的\
  \ `#ifdef IPAD` 语句都评估为 `TRUE`（注意，你必须在命令行的程序名称之前输入 `-D IPAD`）。这种技术允许你在无需编辑源程序的情况下定义名称。\n\
  \n在 Xcode 中，你可以通过选择 Build Settings、All、LLVM GCC 4.2 – Preprocessing、Preprocessor\
  \ Macros，来添加新的定义名称并指定它们的值。你可以看到在 Xcode 4 中定义符号 `IPAD` 的截图，见图 12.1。\n\n**图 12.1.\
  \ 定义预处理器标识符 IPAD**\n\n![image](img/12fig01.jpg)\n\n`#ifndef` 语句的情况与 `#ifdef` 类似。该语句的使用方式相似，不同之处在于如果指定的符号*未*定义，则会处理后续行。\n\
  \n正如前面提到的，条件编译在调试程序时非常有用。你的程序可能嵌入了许多 `NSLog` 调用，用于显示中间结果和追踪执行流。如果定义了特定的名称（如 `DEBUG`），你可以通过将其条件编译到程序中来开启这些语句。例如，你可以使用如下的一系列语句，仅当程序在定义了\
  \ `DEBUG` 的情况下进行编译时才显示某些变量的值：\n\n```\n#ifdef DEBUG\n  NSLog (@\"User name = %s,\
  \ id = %i\", userName, userId);\n#endif\n```\n\n整个程序中可能有很多这样的调试语句。每当程序进行调试时，都可以在定义\
  \ `DEBUG` 的情况下进行编译，以使所有调试语句被编译。当程序运行正常时，可以在不定义 `DEBUG` 的情况下重新编译。这的额外好处是减小了程序的大小，因为所有的调试语句都没有被编译进去。\n\
  \n### `#if` 和 `#elif` 预处理器语句\n\n`#if` 预处理器语句提供了一种更通用的控制条件编译的方法。`#if` 语句可以测试常量表达式的值是否为非零。如果表达式的结果非零，则处理后续到\
  \ `#else`、`#elif` 或 `#endif` 之前的行；否则，跳过这些行。\n\n作为如何使用这种方法的示例，以下行出现在 Foundation 头文件\
  \ `NSString.h:` 中：\n\n```\n#if MAC_OS_X_VERSION_MIN_REQUIRED < MAC_OS_X_VERSION_10_5\n\
  #define NSMaximumStringLength   (INT_MAX-1)\n#endif\n```\n\n这测试了定义变量 `MAC_OS_X_VERSION_MIN_REQUIRED`\
  \ 的值与定义变量 `MAC_OS_X_VERSION_10_5` 的值。如果前者小于后者，则处理随后的 `#define`；否则，跳过。推测，如果程序是在 MAC\
  \ OS X 10.5 或更高版本上编译的，这将字符串的最大长度设置为整数的最大值减去 1。\n\n特殊运算符 `defined (name)` 也可以用于 `#if`\
  \ 语句。这组预处理器语句的作用相同：\n\n```\n#if defined (DEBUG)\n  ...\n#endif\n\n#ifdef DEBUG\n\
  \  ...\n#endif\n```\n\n以下语句出现在 `NSObjcRuntime.h` 头文件中，根据所使用的编译器定义 `NS_INLINE`（如果它尚未定义）：\n\
  \n```\n#if !defined(NS_INLINE)\n    #if defined(__GNUC__)\n      #define NS_INLINE\
  \ static __attribute_((always_inline))\n    #elif defined(__MWERKS__) || defined(__cplusplus)\n\
  \      #define NS_INLINE static inline\n    #elif defined(_MSC_VER)\n      #define\
  \ NS_INLINE static __inline\n    #elif defined(__WIN32__)\n      #define NS_INLINE\
  \ static __inline\n    #endif\n#endif\n```\n\n`#if` 的另一种常见用法如下：\n\n```\n#if defined\
  \ (DEBUG) && DEBUG\n...\n#endif\n```\n\n当 `DEBUG` 定义且值为非零时，处理 `#if` 到 `#endif` 之间的语句。\n\
  \n由于可以使用表达式且 0 总是假的，程序员（包括我）经常会通过一对 `#if 0` ... `#endif` 来注释掉代码。\n\n### `#undef`\
  \ 语句\n\n有时你需要让定义的名称变为未定义。你可以使用 `#undef` 语句。要移除特定的定义，写入：\n\n```\n#undef name\n```\n\
  \n因此，该语句删除了 `IPAD` 的定义：\n\n```\n#undef IPAD\n```\n\n随后的 `#ifdef IPAD` 或 `#if defined\
  \ (IPAD)` 结果为 `FALSE`。\n\n到此，我们对预处理器的讨论结束。\n\n### 练习题\n\n**1.** 在你的机器上找到系统头文件 `limits.h`\
  \ 和 `float.h`。检查这些文件以查看内容。如果这些文件包含了其他头文件，务必也追踪并检查它们的内容。\n\n**2.** 定义一个名为 `MIN` 的宏，返回两个值的最小值。然后编写一个程序测试该宏定义。\n\
  \n**3.** 定义一个名为 `MAX3` 的宏，返回三个值的最大值。编写一个程序测试该定义。\n\n**4.** 编写一个名为 `IS_UPPER_CASE`\
  \ 的宏，如果字符是大写字母则返回非零值。\n\n**5.** 编写一个名为 `IS_ALPHABETIC` 的宏，如果字符是字母则返回非零值。该宏使用文中定义的\
  \ `IS_LOWER_CASE` 宏以及练习题 4 中定义的 `IS_UPPER_CASE` 宏。\n\n\n\n**6.** 编写一个名为 `IS_DIGIT`\
  \ 的宏，如果字符是数字 `0` 到 `9` 中的任意一个，则返回非零值。在定义另一个名为 `IS_SPECIAL` 的宏时使用该宏，如果字符是特殊字符（即既不是字母也不是数字），则该宏返回非零结果。请务必使用在练习\
  \ 5 中开发的 `IS_ALPHABETIC` 宏。\n\n**7.** 编写一个名为 `ABSOLUTE_VALUE` 的宏，用于计算其参数的绝对值。确保该宏能够正确求值如下所示表达式：\n\
  \n```\nABSOLUTE_VALUE (x + delta)\n```\n\n# 第 13 章 底层 C 语言特性\n\n本章描述了 Objective-C\
  \ 语言中一些在编写 Objective-C 程序时并不一定需要的特性。事实上，这些特性中的大部分源自底层的 C 编程语言。函数、结构体、指针、联合体和数组等特性最好在需要时再学习。由于\
  \ C 是一门过程化语言，这些特性中的某些违背了面向对象编程的原则。它们还可能干扰 Foundation 框架实现的某些策略，例如内存分配方法或处理包含多字节字符的字符串的操作。\n\
  \n### 注意事项\n\n在 C 级别有处理多字节字符的方法，但 Foundation 通过其 `NSString` 类提供了一个更优优雅的解决方案。\n\n\
  另一方面，某些应用程序可能要求你使用低级方法，可能是为了优化。例如，如果你正在处理大型数据数组，你可能希望使用 C 的内置数据结构，而不是 Foundation\
  \ 的数组对象（这些在第 15 章“数字、字符串和集合”中描述）。如果使用得当，函数在对重复操作分组和使程序模块化方面也非常有用。\n\n快速浏览本章以获取材料概述，并在读完第二部分“Foundation\
  \ 框架”后再回来。或者你可以完全跳过它，直接进入涵盖 Foundation 框架的第二部分。如果你最终需要支持他人的代码或开始研究某些 Foundation\
  \ 框架头文件，你将会遇到本章涵盖的一些构造结构。若干 Foundation 数据类型（如 `NSRange`、`NSPoint` 和 `NSRect`）需要对结构体有基本的了解，结构体在这里进行了了描述。在这种情况下，你可以返回本章并阅读相关章节以理解这些概念。\n\
  \n## 数组\n\nObjective-C 语言允许用户定义一组有序的数据项，称为数组。本节阐述了如何定义和操作数组。后续章节将阐述数组如何与函数、结构体、字符字符串和指针协同工作。\n\
  \n假设你想将一组成绩读入计算机，然后对这些成绩进行一些操作，例如按升序排序、计算平均值或找到中位数。在对一组成绩排序的过程中，在输入所有成绩之前，你无法执行此类操作。\n\
  \n在 Objective-C 中，你可以定义一个名为 `grades` 的变量，它代表的不是单个成绩值，而是整组成绩。然后你可以使用被称为*索引*（index）数字或*下标*（subscript）的数字来引用集合中的每个元素。在数学中，下标变量\
  \ `x[i]` 指代集合中的第 *i* 个元素 `x`，而在 Objective-C 中，等价表示法如下：\n\n```\nx[i]\n```\n\n因此，表达式\
  \ `grades[5]`（读作“grades sub 5”）指向名为 `grades` 的数组中索引为 `5` 的元素。在 Objective-C 中，数组元素从数字\
  \ `0` 开始，因此 `grades[0]` 实际上指向数组的第一个元素。\n\n你可以在任何可以使用普通变量的地方使用单个数组元素。例如，你可以使用如下语句将数组值赋值给另一个变量：\n\
  \n```\ng = grades[50];\n```\n\n该语句将 `grades[50]` 中包含的值赋值给 `g`。更通俗地说，如果 `i` 被声明为整数变量，语句\
  \ `g = grades[i]` 将 `grades` 数组中索引为 `i` 的元素的值赋值给 `g`。\n\n只需通过在等号左侧指定数组元素，即可将值存储在数组元素中。在语句\n\
  ```\ngrades[100] = 95;\n```\n中，值 `95` 被存储在 `grades` 数组的元素 `100` 中。\n\n你可以通过改变作为数组下标的变量的值，轻松地遍历数组中的元素。因此，`for`\
  \ 循环\n```\nfor ( i = 0; i < 100; ++i )\n    sum += grades[i];\n```\n会遍历 `grades`\
  \ 数组的前 100 个元素（元素 `0–99`），并将每个成绩的值加到 `sum` 中。当 for 循环结束时，变量 `sum` 包含 `grades` 数组前\
  \ 100 个值的总和（假设在循环之前已将 `sum` 设置为 `0`）。\n\n对于其他类型的变量，你必须在使用它们之前声明数组。声明数组涉及声明数组中将包含的元素类型（如\
  \ `int`、`float` 或对象），以及数组内部将存储的最大元素数量。定义如下：\n\n```\nFraction *fract\n```\n\n\n\n\
  你不需要完全初始化整个数组。如果指定的初始值较少，则只初始化相同数量的元素；数组中的剩余值将设置为零。因此，如下声明\n\n```cfloat sample_data[500]\
  \ = { 100.0, 300.0, 500.5 };\n```\n\n将 `sample_data` 的前三个值初始化为 `100.0`、`300.0` 和\
  \ `500.5`，并将剩余的 497 个元素设置为 `0`。\n\n通过将元素索引封装在一对括号中，你可以按任何顺序初始化特定的数组元素。例如：\n\n```c\n\
  int x = 1233;\n\nint a[] = { [9] = x + 1, [2] = 3, [1] = 2, [0] = 1 };\n```\n\n\
  定义了一个名为 `a` 的 10 数组（基于数组中的最大索引），并将最后一个元素初始化为 `x + 1` 的值 (`1234`）。此外，它分别将前三个元素初始化为\
  \ `1`、`2` 和 `3`。\n\n### 字符数组\n\n程序 13.2 展示了你如何使用字符数组。然而，有一点值得讨论。你能发现它吗？\n\n**程序\
  \ 13.2**\n\n```objc\n#import <Foundation/Foundation.h>\n\nint main (int argc, char\
  \ *argv[])\n{\n   NSAutoreleasePool * pool = [[NSAutoreleasePool alloc] init];\n\
  \   char word[] = { 'H', 'e', 'l', 'l', 'o', '!' };\n   int i;\n   for ( i = 0;\
  \ i < 6; ++i )\n       NSLog (@\"%c\", word[i]);\n   [pool drain];\n   return 0;\n\
  }\n```\n\n**程序 13.2. 输出**\n\n```\nH\ne\nl\nl\no\n!\n```\n\n在这种情况下，数组的大小是根据初始化元素的数量自动确定的。因为\
  \ 程序 13.2 为数组 `word` 列出了六个初始值，Objective-C 语言隐式地将数组维度确定为六个元素。\n\n只要你在定义数组时初始化了数组中的每个元素，这种方法就能正常工作。如果并非如此，你必须显式指定数组的维度。\n\
  \n如果你在字符数组的末尾放置一个终止`空字符`（`'\\0'`），你就创建了通常被称为`字符字符串`的东西。如果你将 程序 13.2 中对 `word` 的初始化替换为这一行：\n\
  \n```c\nchar word[] = { 'H', 'e', 'l', 'l', 'o', '!', '\\0' };\n```\n\n你随后可以使用单个\
  \ `NSLog` 调用来显示该字符串，如下所示：\n\n```objc\nNSLog (@\"%s\", word);\n```\n\n这之所以有效，是因为\
  \ `%s` 格式化字符告诉 `NSLog` 继续显示字符，直到遇到终止空字符为止。那恰就是你放在 `word` 数组末尾的那个字符。\n\n### 多维数组\n\
  \n到目前为止你看到的数组类型都是线性数组——也就是说，它们都处理单个维度。该语言允许你定义任意维度的数组。本节将要介绍二维数组。\n\n二维数组最自然的应用之一出现在矩阵的情况下。考虑此处所示的\
  \ 4 × 5 矩阵：\n\n![image](img/252tab01.jpg)\n\n在数学中，矩阵的元素通常通过双下标来引用。如果前面的矩阵被称为 `M`，那么表示法\
  \ `M[i,j]` 指的是第 `i` 行第 `j` 列的元素，其中 `i` 的范围从 `1` 到 `4`，`j` 的范围从 `1` 到 `5`。表示法 `M[3,2]`\
  \ 指的是值 `20`，该值位于矩阵的第三行第二列。同样，`M[4,5]` 指的是包含第四行第五列的元素（值 `6`）。\n\n在 Objective-C 中，引用二维数组的元素时使用了类似的表示法。然而，由于\
  \ Objective-C 喜欢从 0 开始计数，因此矩阵的第一行实际上是第 0 行，矩阵的第一列是第 0 列。前面的矩阵的行和列标记将如下图所示：\n\n![image](img/252tab02.jpg)\n\
  \n虽然在数学中使用表示法 `M[i,j]`，但在 Objective-C 中，对应的表示法如下：\n\n```objc\nM[i][j]\n```\n\n记住，第一个索引数字指的是行号，而第二个索引数字引用列。因此，语句\n\
  \n```objc\nsum = M[0][2] + M[2][4];\n```\n\n将包含第 0 行第 2 列的值（`-3`）与包含第 2 行第 4 列的值（`14`）相加，并将结果\
  \ `11` 赋值给变量 `sum`。\n\n二维数组的声明方式与一维数组相同；因此，\n\n```objc\nint M[4][5];\n```\n\n\n\n\
  \n```objc\nNSLog (@\"Programming is fun.\");\n\n}\n\nint main (int argc, char *argv[])\n\
  {\n    NSAutoreleasePool * pool = [[NSAutoreleasePool alloc] init];\n    printMessage\
  \ ();\n    [pool drain];\n    return 0;\n}\n```\n\n* * *\n\n**程序 13.3. 输出**\n\n\
  * * *\n\n编程很有趣。\n\n* * *\n\n程序 13.3 包含两个函数：`printMessage` 和 `main`。如前所述，调用函数的想法并不新鲜。由于\
  \ `printMessage` 不接受任何参数，你只需通过列出它的名称并在后跟一对圆括号来调用它。\n\n### 参数与局部变量\n\n在第 5 章 “程序循环”中，你编写了用于计算三角形数的程序。在这里，你定义了一个函数来生成三角形数并调用了它，函数名起得恰当是\
  \ `calculateTriangularNumber`。作为函数的参数，你指定了要计算哪一个三角形数。然后该函数会计算所需的数值并显示结果。程序 13.4\
  \ 展示了完成该任务的函数以及一个尝试运行它的 `main` 程。\n\n**程序 13.4**\n\n* * *\n\n```objc\n#import <Foundation/Foundation.h>\n\
  \n// 计算第 n 个三角形数的函数\nvoid calculateTriangularNumber (int n)\n{\n    int i, triangularNumber\
  \ = 0;\n    for ( i = 1; i <= n; ++i )\n        triangularNumber += i;\n    NSLog\
  \ (@\"Triangular number %i is %i\", n, triangularNumber);\n}\n\nint main (int argc,\
  \ char *argv[])\n{\n    NSAutoreleasePool * pool = [[NSAutoreleasePool alloc] init];\n\
  \    calculateTriangularNumber (10);\n    calculateTriangularNumber (20);\n    calculateTriangularNumber\
  \ (50);\n    [pool drain];\n    return 0;\n}\n```\n\n* * *\n\n**程序 13.4. 输出**\n\n\
  * * *\n\nTriangular number 10 is 55\nTriangular number 20 is 210\nTriangular number\
  \ 50 is 1275\n\n* * *\n\n`calculateTriangularNumber` 函数的第一行是这样的：\n\n```objc\nvoid\
  \ calculateTriangularNumber (int n)\n```\n\n它告诉编译器 `calculateTriangularNumber` 是一个没有返回值的函数（关键字为\
  \ `void`），并且它接受一个名为 `n` 的单一参数，该参数类型为 `int`。再次注意，你不能将参数类型放在圆括号内，这与你编写方法时习惯的写法不同。\n\
  \n左大括号表示函数定义的开始。由于你想计算第 *n* 个三角形数，你必须设置一个变量来存储计算过程中的三角形数值。你还需要一个变量作为循环索引。变量 `TriangularNumber`\
  \ 和 `i` 就是为了这些目的而定义的，并被声明为 `int` 类型。你定义和初始化这些变量的方式，与你在之前的程序在 `main` 程中定义和初始化变量的方式相同。\n\
  \n函数中的局部变量的行为与在方法中相同：如果给函数内部的变量赋了一个初始值，那么每次调用该函数时，该初始值都会赋给该变量。\n\n在函数内部定义的变量（如方法中）被称为*自动局部*变量，因为它们在每次调用函数时都会自动被“创建”，并且它们的值是局限于函数的。\n\
  \n*静态局部*变量使用关键字 `static` 声明，它们在函数调用之间会保留其值，并具有默认初始值 `0`。\n\n局部变量的值只能由定义它的函数进行访问。无法从函数外部直接访问它的值。\n\
  \n回到我们的程序示例，在定义了局部变量后，函数计算三角形数并在终端显示结果。右大括号随后定义了函数的结束。\n\n在 `main` 程中，在第一次调用 `calculateTriangularNumber`\
  \ 时，值 `10` 作为参数传递进去。执行流随后直接转移到函数内部，此时该值 `10` 变成了函数内部形式参数 `n` 的值。然后该函数计算第 10 个三角形数的值并显示结果。\n\
  \n下一次调用 `calculateTriangularNumber` 时，传递了参数 `20`。在之前描述的类似过程中，该值变成了函数内部 `n` 的值。然后该函数计算第\
  \ 20 个三角形数的值并显示答案。\n\n### 返回函数结果\n\n与方法一样，函数可以返回一个值。用 `return` 语句返回的值的类型必须与为函数声明的返回类型一致。如下所示的函数声明\n\
  \n```objc\nfloat kmh_to_mph (float km_speed)\n```\n\n开始了函数 `kmh_to_mph` 的定义，它接受一个名为\
  \ `km_speed` 的 `float` 参数并返回一个浮点值。同样地，\n\n```objc\nint gcd (int u, int v)\n```\n\
  \n定义了一个带有参数 `u` 和 `v` 的函数 `gcd`，并返回一个整数。让我们用函数的形式重写程序 5.7 中使用的最大公约数算法。\n\n**程序 13.5**\n\
  \n* * *\n\n```objc\n#import <Foundation/Foundation.h>\n\n// 函数找到两个整数的最大公约数\n// 并返回结果\n\
  int gcd (int u, int v)\n{\n    int temp;\n    while ( v != 0 )\n    {\n        temp\
  \ = u % v;\n        u = v;\n        v = temp;\n    }\n    return u;\n}\n\nint main\
  \ (int argc, char *argv[])\n{\n    NSAutoreleasePool * pool = [[NSAutoreleasePool\
  \ alloc] init];\n    NSLog (@The gcd of 150 and 35 is %i\", gcd(150, 35));\n   \
  \ NSLog (@The gcd of 1026 and 405 is %i\", gcd(1026, 405));\n    NSLog (@The gcd\
  \ of 83 and 240 is %i\", gcd(83, 240));\n    [pool drain];\n    return 0;\n}\n```\n\
  \n* * *\n\n**程序 13.5. 输出**\n\n* * *\n\nThe gcd of 150 and 35 is 5\nThe gcd of 1026\
  \ and 405 is 27\nThe gcd of 83 and 240 is 1\n\n\n\n\n函数声明不仅用于声明函数的返回类型，还用于告诉编译器函数接受多少参数以及这些参数的类型是什么。这与在定义新类时在\
  \ `@interface` 部分声明方法是相似的。\n\n要将 `absoluteValue` 声明为一个返回 `float` 类型值且接收单个（同样为 `float`\
  \ 类型参数的函数，可以使用以下原型声明：\n\n```c\nfloat absoluteValue (float);\n```\n\n如你所见，你只需要在括号内指定参数类型，而不需要指定名称。如果你愿意，也可以在类型后可选地指定一个“占位”名称：\n\
  \n```c\nfloat absoluteValue (float x);\n```\n\n这个名称不需要与函数定义中使用的名称相同——编译器反正会忽略它。\n\
  \n编写原型声明的一种万无一失的方法是直接从函数的实际定义的第一行复制。记得在末尾加上分号。\n\n如果函数接受可变数量的参数（例如 `NSLog` 和 `scanf`\
  \ 的情况），则必须通知编译器。该声明：\n\n```c\nvoid NSLog (NSString *format, ...);\n```\n\n告诉编译器\
  \ `NSLog` 接收一个 `NSString` 对象作为第一个参数，随后是任意数量的额外参数（使用 `...`）。`NSLog` 定义在特殊文件 `Foundation/Foundation.h`\
  \ 中，这就是为什么你一直在每个程序的开头放置下面这一行的原因之一：\n\n```objc\n#import <Foundation/Foundation.h>\n\
  ```\n\n如果没有这一行，编译器会假设 `NSLog` 接受固定数量的参数，这可能会生成错误的代码。\n\n只有当你调用函数之前已经放置了函数的定义，或者声明了函数及其参数类型时，编译器会在调用函数时自动将数值参数转换为相应的类型。\n\
  \n关于函数的一些提醒和建议：\n\n- 默认情况下，编译器假设函数返回 `int`。\n- 在定义返回 `int` 的函数时，请按此方式定义。\n- 在定义不返回值的函数时，将其定义为\
  \ `void`。\n- 只有在你之前定义或声明了函数的情况下，编译器才会将你的参数转换为与函数预期的匹配。\n\n为了安全起见，请在你的程序中声明所有函数，即使它们在调用之前已经定义。（你之后可能决定将它们移动到文件的其他位置，甚至移动到另一个文件中。）一个良好的策略是将函数声明放在头文件中，然后只需将该文件导入到你的模块中。\n\
  \n函数默认情况下是*外部*的。也就是说，函数的默认作用范围是它可以被与函数链接的任何文件中的任何函数或方法调用。你可以通过将其设为 `static` 来限制函数的作用范围。你通过在函数声明前放置\
  \ `static` 关键字来实现这一点，如下：\n\n```c\nstatic int gcd (int u, int v)\n{\n   ...\n}\n\
  ```\n\n`static function` 只能由包含函数定义的同一个文件中其他函数或方法调用。\n\n### 函数、方法和数组\n\n要向函数或方法传递单个数组元素，你可以按照通常方式将数组元素作为参数指定。因此，如果你有一个计算平方根的\
  \ `squareRoot` 函数，并想要获取 `averages[i]` 的平方根并将结果赋值给名为 `sq_root_result` 的变量，像下面这样的语句就可以工作：\n\
  \n```c\nsq_root_result = squareRoot (averages[i]);\n```\n\n向函数或方法传递整个数组则是完全另一回事了。要传递数组，你需要在函数或方法调用的内部仅列出数组的名称，而不带任何下标。例如，假设\
  \ `grade_scores` 已声明为包含 100 个元素的数组，则表达式\n\n```c\nminimum (grade_scores)\n```\n\n\
  会将数组 `grade_scores` 中包含的全部 100 个元素传递给名为 `minimum` 的函数。自然地，`minimum` 函数必须期望接收整个数组作为参数，并且必须进行相应的形式参数声明。\n\
  \n此函数找到包含指定数量元素的数组中的最小整数值：\n\n```c\n// 寻找数组中最小值的函数\nint minimum (int values[], int\
  \ numElements)\n{\n    int minValue, i;\n    minValue = values[0];\n    for ( i\
  \ = 1; i < numElements; ++i )\n        if ( values[i] < minValue )\n           values[i \n\
  �\n```\n\n函数\nminimum\n\n为接收两个参数：第一个是你想寻找最小值的数组，第二个是数组中的元素数量。函数头中紧跟在 `values` 之后的左右括号告诉编译器\
  \ `values` 是一个整数数组。编译器并不关心它有多大。\n\n形式参数 `numElements` 在 `for` 语句内部作为上限。因此，`for`\
  \ 语句从 `values[1]` 开始遍历数组，直到数组的最后一个元素，即 `values[numElements - 1]`。\n\n如果函数更改了数组的值，该更改作用于原始数组，而不是副本。因此，当函数或方法返回时，这些更改仍然有效。\n\
  \n## Blocks\n\nBlocks 是语言的一项最新扩展。它们不是标准定义的一部分，是由 Apple, Inc. 添加到语言中的。Blocks 的外观和行为与函数非常相似。语法需要一些适应。你可以向块返回值。与函数不同，块\
  \ 定义在函数或方法内部，并且可以访问其作用范围内外部定义的任何变量。通常情况下，可以访问这些变量，但不能修改它们的值。有一个特殊的 `__block` 修饰符（在\
  \ block 之前有两个下划线），允许你在块内部修改变量的值。\n\nBlocks 可以作为参数传递给函数和方法，在第二部分“Foundation Framework”中，你将学习一些期待接收块参数的方法。块\
  \ 的优势之一是它们可以被系统分发，由其他处理器或应用程序内的其他线程执行。\n\n让我们从一个简单的示例开始。回顾我们在本章中写的第一个名为 `printMessage`\
  \ 的函数：\n\n```c\nvoid printMessage (void)\n{\n   NSLog (@\"Programming is fun.\"\
  );\n}\n```\n\n这是一个完成相同任务的 block：\n\n```objc\n^(void)\n{\n   NSLog (@\"Programming\
  \ is fun.\");\n}\n```\n\nBlock 通过领先的插入字符 ^ 来识别。后面跟着块接受的括号参数列表。在我们的案例中，块不接受任何参数，所以就像我们在函数定义中所写的\
  \ `void` 一样。\n\n\n\n你可以将此块赋值给一个名为 `printMessage` 的变量，只要该变量已正确声明（这正是语法变得复杂的地方）：\n\
  \n```objc\nvoid (^printMessage)(void) =\n    ^(void){\n        NSLog (@\"Programming\
  \ is fun.\");\n    };\n```\n\n在等号左侧，我们指定 `printMessage` 是一个指向不接受参数且不返回值的 block 指针。注意，赋值语句以分号结束。\n\
  \n执行由变量引用的 block 方法与调用函数的方法相同：\n\n```objc\nprintMessage ();\n```\n\n程序 13.6 将这些内容整合进示例中。\n\
  \n**程序 13.6**\n\n* * *\n\n```objc\n#import <Foundation/Foundation.h>\n\nint main\
  \ (int argc, char *argv[])\n\n{\n    NSAutoreleasePool * pool = [[NSAutoreleasePool\
  \ alloc] init];\n    void (^print_message)(void) =\n        ^(void) {\n        \
  \    NSLog (@\"Programming is fun.\");\n        };\n    printMessage ();\n    [pool\
  \ drain];\n    return 0;\n}\n```\n\n* * *\n\n**程序 13.6. 输出**\n\n* * *\n\nProgramming\
  \ is fun.\n\n* * *\n\n程序 13.7 是程序 13.4 的重写，使用 block 代替函数。block 可以在全局或局部定义。在这种情况下，我们将在\
  \ `main` 外部定义 block，使其在作用域上是外部且全局的。\n\n**程序 13.7**\n\n* * *\n\n```objc\n#import\
  \ <Foundation/Foundation.h>\n\n// 计算第 n 个三角形数的 block\nvoid (^calculateTriangularNumber)\
  \ (int) =\n    ^(int n) {\n        int i, triangularNumber = 0;\n        for ( i\
  \ = 1; i <= n; ++i )\n            triangularNumber += i;\n        NSLog (@\"Triangular\
  \ number %i is %i\", n, triangularNumber);\n    };\nint main (int argc, char *argv[])\n\
  {        NSAutoreleasePool * pool = [[NSAutoreleasePool alloc] init];\n    calculateTriangularNumber\
  \ (10);\n    calculateTriangularNumber (20);\n    calculateTriangularNumber (50);\n\
  \    [pool drain];\n    return 0;\n}\n```\n\n* * *\n\n**程序 13.7. 输出**\n\n* * *\n\
  \nTriangular number 10 is 55\nTriangular number 20 is 210\nTriangular number 50\
  \ is 1275\n\n* * *\n\n比较程序 13.4 中函数的语法与程序 13.7 中定义的 block。block 指针变量 `calculateTriangularNumber`\
  \ 定义为接收一个 `int` 参数且不返回值。\n\n正如本节开头提到的，block 可以返回一个。这里是程序 13.5 中 `gcd` 函数的 block\
  \ 形重写：\n\n```objc\nint (^gcd) (int, int) =\n    ^(int u, int v){\n        int temp;\n\
  \        while ( v != 0 )\n        {\n            temp = u % v;\n            u =\
  \ v;\n            v = temp;\n        }\n        return u;\n    };\n```\n\nblock\
  \ 可以访问其定义所在作用域内的变量。该变量的值是它*在 block 定义时*的值。这在程序 13.8 中得到了体现。\n\n**程序 13.8**\n\n*\
  \ * *\n\n```objc\n#import <Foundation/Foundation.h>\n\nint main (int argc, char\
  \ *argv[])\n{\n    NSAutoreleasePool * pool = [[NSAutoreleasePool alloc] init];\n\
  \    int foo = 10;\n    void (^printFoo)(void) =\n        ^(void) {\n          \
  \  NSLog (@\"foo = %i\", foo);\n        };\n    foo = 15;\n    printFoo ();\n  \
  \  [pool drain];\n    return 0;\n}\n```\n\n* * *\n\n**程序 13.8. 输出**\n\n* * *\n\n\
  foo = 10\n\n* * *\n\n`printFoo` block 可以访问局部变量 `foo` 的值。注意，显示的值是 10 而不是 15，因为它是\
  \ block **定义时**的值，而不是执行时的值。\n\n默认情况下，你无法修改在 block 外部定义的变量值。因此，如果你尝试在 block 内部更改\
  \ `foo` 的值（参见程序 13.9），你将收到编译器的错误：**Assignment of read-only variable ‘foo.’**。\n\n\
  **程序 13.9**\n\n* * *\n\n```objc\n#import <Foundation/Foundation.h>\n\nint main (int\
  \ argc, char *argv[])\n{\n    NSAutoreleasePool * pool = [[NSAutoreleasePool alloc]\
  \ init];\n    int foo = 10;\n    void (^printFoo)(void) =\n        ^(void) {\n \
  \           NSLog (@\"foo = %i\", foo);\n        };\n    foo = 15;\n    printFoo\
  \ ();\n    [pool drain];\n    return 0;\n}\n```\n\n\n\n\n```objc\nNSLog (@\"Today's\
  \ date is %i/%i/%.2i.\", today.month,\n      today.day, today.year % 100);\n\n[pool\
  \ drain];\n\nreturn 0;\n}\n```\n\n### 程序 13.10. 输出\n\n今天的日期是 9/25/11。\n\n`main`\
  \ 内部的第一条语句定义了一个名为 `date` 的结构，它包含三个整数成员，称为 `month`、`day` 和 `year`。在第二个语句中，声明变量 `today`\
  \ 的类型为 `struct date`。因此，第一条语句仅仅定义了 `date` 结构在 Objective-C 编译器中的形式，而没有在计算机内部保留任何存储。第二个语句声明了一个类型为\
  \ `struct date` 的变量，因此为存储结构变量 `today` 的三个整数成员留了内存。\n\n赋值后，通过适当的 `NSLog` 调用显示结构中包含的值。`today.year`\
  \ 除以 100 的余数在传递给 `NSLog` 函数之前进行了计算，因此年份只显示 `11`。`NSLog` 调用中的格式字符 `%.2i` 指定了至少显示两个字符，从而强制显示显示前导零。\n\
  \n在表达式求值时，结构成员遵循的与 Objective-C 语言中普通变量相同的规则。整数结构成员除以另一个整数的操作按整数除法执行，如下：\n\n```objc\n\
  century = today.year / 100 + 1;\n```\n\n假设你想写一个简单的程序，接受今天的日期作为输入，并向用户显示明天的日期。乍一看，这似乎是一个完美的任务。你可以要求用户输入今天的日期，然后通过一系列语句计算明天的日期，如下：\n\
  \n```objc\ntomorrow.month = today.month;\ntomorrow.day  = today.day + 1;\ntomorrow.year\
  \ = today.year;\n```\n\n当然，上述语句对于大多数日期都可以正常工作，但以下两种情况将无法被正确处理：\n\n- 如果今天的日期是月份的最后\n\
  - 如果今天的日期是一年的最后（也就是说，如果今天的日期是 12 月 31 日）\n\n判断今天的日期是否为月份最后的一种简单方法是建立一个整数数组，该数组对应每个月的天数。通过在数组中查找特定月份即可得到该月份的天数。\n\
  \n#### 结构的初始化\n\n初始化结构与初始化数组类似——元素简单地列在一对括号内，并用逗号分隔每个元素。\n\n将 `date` 结构变量 `today`\
  \ 初始化为 2011 年 7 月 2 日，可以使用此语句：\n\n```objc\nstruct date today = { 7, 2, 2011 };\n\
  ```\n\n与初始化数组一样，列出的值可以少于结构所包含的成员。因此，语句\n\n```objc\nstruct date today = { 7 };\n\
  ```\n\n将 `today.month` 设置为 `7`，但没有给 `today.day` 或 `today.year` 任何初始值。在这种情况下，它们的默认初始值是未定义的。\n\
  \n可以在初始化列表中使用 `.member = value` 记法以任何顺序为特定成员指定初始化，如下：\n\n```objc\nstruct date today\
  \ = { .month = 7, .day = 2, .year = 2011 };\n```\n\n以及\n\n```objc\nstruct date today\
  \ = { .year = 2011 };\n```\n\n最后一条语句仅将结构中的年份设置为 2011。如你所知，另外两个成员是未定义的。\n\n#### 嵌套结构\n\
  \nObjective-C 在定义结构方面提供了极大的灵活性。例如，你可以定义一个结构，其本身包含其他结构作为一个或多个成员，或者你可以定义包含数组的结构。\n\
  \n你在第 10 章“关于变量和数据类型的更多”中学习了 `typedef` 语句。在你的 iOS 程序中，你将经常需要处理矩形。例如，矩形定义了 iPhone\
  \ 或 iPad 屏幕上窗口的大小和位置。它们还定义了子窗口（或称为子视图）的位置和大小。使用了 `typedef` 定义的三种基本数据类型：\n\n1. `CGPoint`\
  \ – 描述一个 (x,y) 点\n2. `CGSize` – 描述宽度和高度\n3. `CGRect` – 是包含原点（一个 `CGPoint`）和尺寸（一个\
  \ `CGSize`）的矩形\n\n以下来自 Apple 的 `CGGeometry.h` 头文件的 `typedef` 定义：\n\n```objc\n/*\
  \ Points. */\nstruct CGPoint {\n  CGFloat x;\n  CGFloat y;\n};\ntypedef struct CGPoint\
  \ CGPoint;\n\n/* Sizes. */\nstruct CGSize {\n  CGFloat width;\n  CGFloat height;\n\
  };\ntypedef struct CGSize CGSize;\n\n/* Rectangles. */\nstruct CGRect {\n  CGPoint\
  \ origin;\n  CGSize size;\n};\ntypedef struct CGRect CGRect;\n```\n\n`typedef` 提供了一种方便的方法来声明变量，无需使用\
  \ `struct` 关键字。`CGFloat` 只是基本浮点型数据类型的 `typedef`。因此，如果你想声明一个 `CGPoint` 变量并将其 `x`\
  \ 成员设置为 100，`y` 成员设置为 200，你可以编写这段代码序列：\n\n```objc\nCGPoint startPt;\nstartPt.x =\
  \ 100;\nstartPt.y = 200;\n```\n\n\n\n\nObjective-C 中有两种方法可以将信息打包在一起。一种方法简单地将数据表示在整数内部，然后使用第\
  \ 4 章“数据类型与表达式”中描述的位运算符来访问整数的特定位。\n\n另一种方法是使用一种名为位域（`bit field`）的 Objective-C 结构来定义一个打包信息的结构。这种方法在结构定义中使用了一种特殊语法，允许你定义一个位字段并为该字段命名。\n\
  \n要定义位域字段赋值，你可以定义一个名为 `packedStruct` 的结构，例如所示：\n\n```c\nstruct packedStruct\n{\n\
  \   unsigned int f1:1;\n   unsigned int f2:1;\n   unsigned int f3:1;\n   unsigned\
  \ int type:4;\n   unsigned int index:9;\n};\n```\n\n结构 `packedStruct` 被定义为包含五个成员。第一个成员名为\
  \ `f1`，是一个无符号整型（`unsigned int`）。紧跟在成员名后面的 `:1` 指定该成员将存存储在 1 位中。标志位 `f2` 和 `f3` 同样被定义为长度为\
  \ 1 位。成员 `type` 被定义为占用 4 位，而成员 `index` 被定义为长度为 9 位。\n\n编译器会自动将之前的位域定义打包在一起。这种方法的巧妙之处在于，定义为\
  \ `packedStruct` 类型的变量字段现在可以像引用普通结构成员一样以方便的方式进行引用。所以，如果你如下声明了一个名为 `packedData` 的变量：\n\
  \n```c\nstruct packedStruct packedData;\n```\n\n你可以通过这个简单的语句轻松将 `packedData` 的 `type`\
  \ 字段设置为 `7`：\n\n```c\npackedData.type = 7;\n```\n\n你也可以通过类似的语句将该字段设置为 `n` 的值：\n\n\
  ```c\npackedData.type = n;\n```\n\n在最后一种情况下，你不需要担心 `n` 的值是否大到无法放入 `type` 字段；只有 `n`\
  \ 的低 4 位会被分配给 `packedData.type`。\n\n从位域中提取值也是自动处理的，因此语句\n\n```c\nn = packedData.type;\n\
  ```\n\n会从 `packedData` 中提取 `type` 字段（根据需要自动将其移位到低位）并将其赋值给 `n`。\n\n你可以在普通表达式中使用位域，并将其自动转换为整数。因此，语句\n\
  \n```c\ni = packedData.index / 5 + 1;\n```\n\n是完全有效的，下面的语句也是如此：\n\n```c\nif ( packedData.f2\
  \ )\n...\n```\n\n这测试了标志位 `f2` 是开启还是关闭。关于位域值得注意的一点是，没有规定规定字段在内部是从左到右分配还是从右到左分配的。因此，如果位域是从右到左分配的，`f1`\
  \ 将位于低位位置，`f2` 位于 `f1` 左侧相邻的位，依此类推。除非你处理的是由不同程序或不同机器创建的数据，否则这不会成为问题。\n\n你还可以在包含位域的结构中包含普通数据类型。所以，如果你想定义一个包含\
  \ `int`、一个 `char` 和两个 1 位标志位的结构，那么以下定义是有效的：\n\n```c\nstruct table_entry\n{\n   int\
  \      count;\n   char     c;\n   unsigned int f1:1;\n   unsigned int f2:1;\n};\n\
  ```\n\n位域按照它们在结构定义中出现的顺序打包到“单元”（`units`）中，其中“单元”的大小由实现定义，最可能是一个字（word）。Objective-C\
  \ 编译器不会重新排列位域定义以尝试优化存储空间。\n\n可以指定一个没有名字位域来跳过字内部的位。以下定义定义了一个结构 `x_entry`，它包含一个名为\
  \ `type` 的 4 位字段和一个名为 `count` 的 9 位字段：\n\n```c\nstruct x_entry\n{\n   unsigned int\
  \ type:4;\n   unsigned int :3;\n   unsigned int count:9;\n};\n```\n\n未命字段指定用 3 位分隔\
  \ `type` 字段和 `count` 字段。\n\n字段规范的最后一点涉及长度为 0 的未命名字段的特殊情况。你可以利用它强制结构中的下一个字段在单元边界的起始对齐。\n\
  \n### 不要忘记面向对象编程！\n\n现在你已经知道如何定义一个结构来存储日期，并且你已经编写了各种处理该日期结构的例程。但是面向对象编程呢？你难道应该创建一个名为\
  \ `Date` 的类，然后开发用于处理 `Date` 对象的方法吗？那样难道不是更好的方法吗？是的，如此。希望在我们讨论在程序中存储日期时，这个想法进入了你的脑海。\n\
  \n当然，如果你在程序中必须处理大量日期，定义一个类和处理日期的方法是更好的方法。事实上，Foundation 框架有两个名为 `NSDate` 和 `NSCalendarDate`\
  \ 的类，是为此类目的定义的。我们将此留作一项练习题，让你实现一个 `Date` 类，将日期作为对象而不是结构来处理。\n\n## 指针\n\n指针 允许你有效地表示复杂的数据结构，更改作为函数和方法参数传递的值，并更简洁高效地处理数组。在本章结束时，我们让你了解指针在\
  \ Objective-C 实现中的重要性。\n\n我们在第 8 章“继承”中讨论 `Point` 和 `Rectangle` 类时已经引入了指针的概念。要理解指针的操作方式，你首先必须理解“间接性”（`indirection`）。我们在日常生活中就能这种概念。例如，假设我需要为我的打印机购买一个新的墨盒。在我工作的公司，采购部门处理所有的购买。所以我给采购部的\
  \ Jim 打电话，让他帮我订购。然后 Jim 会联系本地商店订购。为了获得我的新墨盒，我采用的是间接方法，因为我不是直接从商店订购的。\n\n同样的间接概念也适用于\
  \ Objective-C 中指针的工作方式。指针提供了访问特定数据项目的间接手段。正如有通过采购部门订购墨盒的理由（我不需要知道墨盒是从哪个特定的商店订购的），在\
  \ Objective-C 中使用指针是有理由的。\n\n但话如此，是时候看看指针到底是如何工作的。假设你定义了一个名为 `count` 的变量：\n\n```c\n\
  int count = 10;\n```\n\n你可以定义另一个名为 `intPtr` 的变量，通过以下声明来间接访问 `count` 的值：\n\n```c\n\
  int *intPtr;\n```\n\n星号向 Objective-C 系统定义 `intPtr` 是指向 `int` 的指针。这意味着程序将使用 `intPtr`\
  \ 间接访问一个或多个整数的值。\n\n你已经在之前的程序 `scanf` 调用中见过我们如何使用 `&` 运算符。这个一元运算符被称为“地址运算符”，它在 Objective-C\
  \ 中为变量创建指针。所以，如果 `x` 是某个特定类型的变量，表达式 `&x` 就是该变量的指针。如果你愿意，可以将表达式 `&x` 分配给任何已声明为与 `x`\
  \ 类型相同的指针变量。\n\n因此，根据给出的 `count` 和 `intPtr` 的定义，你可以编写如下语句：\n\n```c\nintPtr = &count;\n\
  ```\n\n\n\n\n为了建立 `intPtr` 和 `count` 之间的间接引用，地址运算符赋值给变量 `intPtr` 的不是 `count` 的值，而是指向变量\
  \ `count` 的指针。图 13.1 展示了 `intPtr` 和 `count` 之间建立的链接。定向线说明了 `intPtr` 并不直接包含 `count`\
  \ 的值，而是包含一个指向变量 `count` 的指针。\n\n**图 13.1 指向整数的指针**\n\n![image](img/13fig01.jpg)\n\
  \n要通过指针变量 `intPtr` 引用 `count` 的内容，你需要使用间接运算符，即星号（`*`）。如果 `x` 被定义为 `int` 类型，则语句\n\
  \n```\nx = *intPtr;\n```\n\n将通过 `intPtr` 间接引用的值赋值给变量 `x`。由于 `intPtr` 之前被设置为指向 `count`，这条语句的效果是将变量\
  \ `count` 中包含的值（即 `10`）赋值给变量 `x`。\n\n程序 13.11 包含了之前的语句，并说明了两个基本的指针运算符：地址运算符（`&`）和间接运算符（`*`）。\n\
  \n**程序 13.11**\n\n* * *\n\n```\n// 用于说明指针的程序\n#import <Foundation/Foundation.h>\n\
  \nint main (int argc, char *argv[])\n{\n    NSAutoreleasePool * pool = [[NSAutoreleasePool\
  \ alloc] init];\n    int  count = 10, x;\n    int  *intPtr;\n    intPtr = &count;\n\
  \    x = *intPtr;\n    NSLog (@\"count = %i, x = %i\", count, x);\n    [pool drain];\n\
  \    return 0;\n}\n```\n\n* * *\n\n**程序 13.11 输出**\n\n* * *\n\ncount = 10, x = 10\n\
  \n* * *\n\n变量 `count` 和 `x` 按照正常方式声明为整数变量。在下一行中，变量 `intPtr` 被声明为类型“指向 `int` 的指针”。注意，这两行声明可以合并为单行：\n\
  \n```\nint count = 10, x, *intPtr;\n```\n\n接下来，将地址运算符应用于变量 `count`，其效果是创建一个指向该变量的指针，然后程序将该指针赋值给变量\
  \ `intPtr`。\n\n执行程序中的下一条语句\n\n```\nx = *intPtr;\n```\n\n过程如下：间接运算符告诉 Objective-C\
  \ 系统将变量 `intPtr` 视为包含指向另一个数据项的指针。然后使用该指针来访问所需的数据项，其类型由指针变量的声明指定。因为你在声明变量时已经告诉编译器\
  \ `intPtr` 指向整数，所以编译器知道表达式 `*intPtr` 所引用的值是一个整数。此外，由于你在上一个程序语句中设置 `intPtr` 指向整数变量\
  \ `count`，该表达式便间接地访问了 `count` 的值。\n\n程序 13.12 展示了指针变量的一些有趣属性。该程序使用了指向字符的指针。\n\n\
  **程序 13.12**\n\n* * *\n\n```\n#import <Foundation/Foundation.h>\n\nint main (int\
  \ argc, char *argv[])\n{\n    NSAutoreleasePool * pool = [[NSAutoreleasePool alloc]\
  \ init];\n    char c = 'Q';\n    char *charPtr = &c;\n    NSLog (@\"%c %c\", c,\
  \ *charPtr);\n    c = '/';\n    NSLog (@\"%c %c\", c, *charPtr);\n    *charPtr =\
  \ '(';\n    NSLog (@\"%c %c\", c, *charPtr);\n    [pool drain];\n    return 0;\n\
  }\n```\n\n* * *\n\n**程序 13.12 输出**\n\n* * *\n\nQ Q\n\n/ /\n\n( (\n\n* * *\n\n字符变量\
  \ `c` 被定义并初始化为字符 `'Q'`。在程序的下一行中，变量 `charPtr` 被定义为类型“指向 `char` 的指针”，这意味着存储在该变量中的任何值都应被视为指向字符的间接引用（指针）。注意，你可以按照正常方式为该变量分配初始值。你在程序中赋值给\
  \ `charPtr` 的值是指向变量 `c` 的指针，这是通过对变量 `c` 应用地址运算符得到的。（注意，如果 `c` 在此语句之后定义，这种初始化将产生编译器错误，因为变量在表达式中引用其值之前必须先声明。）\n\
  \n变量 `charPtr` 的声明及其初始值的赋值可以用两个独立的语句等效表示，如下：\n\n```\nchar *charPtr;\ncharPtr = &c;\n\
  ```\n\n### 指针与结构\n\n你已经学会了如何定义指向 `int` 或 `char` 等数据类型的指针。但你也可以定义一个指向结构的指针。在本章的较早部分，你定义了\
  \ `date` 结构如下：\n\n```\nstruct date\n{\n    int month;\n    int day;\n    int year;\n\
  };\n```\n\n就像你定义变量为 `struct date` 类型一样，例如：\n\n```\nstruct date todaysDate;\n```\n\
  \n你可以定义一个变量为指向 `struct date` 的指针：\n\n```\nstruct date *datePtr;\n```\n\n然后你就可以按照预期的方式使用刚刚定义的变量\
  \ `datePtr` 了。例如，你可以通过以下赋值语句将其指向 `todaysDate`：\n\n```\ndatePtr = &todaysDate;\n\
  ```\n\n在此类赋值之后，你可以通过以下方式间接访问 `datePtr` 指向的 `date` 结构的任何成员：\n\n```\n(*datePtr).day\
  \ = 21;\n```\n\n这条语句将 `datePtr` 指向的 `date` 结构的日期设置为 21。之所以需要括号，是因为结构成员运算符 `.` 的优先级高于间接运算符\
  \ `*`。\n\n要测试 `datePtr` 指向的 `date` 结构中存储的 `month` 值，可以使用如下语句：\n\n```\nif ( (*datePtr).month\
  \ == 12 )\n```\n\n指向结构的指针非常常用，以至于该语言有一个特殊的运算符。结构指针运算符 `->`（破折号后跟大于号）允许原本应写为 `(*x).y`\
  \ 的表达式更清晰地表示为 `x->y`。\n\n因此，你可以方便地将之前的 `if` 语句写如下：\n\n```\nif ( datePtr->month ==\
  \ 12 )\n```\n\n我们使用结构指针的概念重写了程序 13.10（第一个说明结构的程序）。程序 13.13 展示了该程序。\n\n\n\n\n\n```objc\n\
  NSAutoreleasePool * pool = [[NSAutoreleasePool alloc] init];\n\nstruct date\n{\n\
  \    int month;\n    int day;\n    int year;\n};\n\nstruct date today, *datePtr;\n\
  datePtr = &today;\ndatePtr->month = 9;\ndatePtr->day = 25;\ndatePtr->year = 2011;\n\
  NSLog (@\"Today's date is %i/%i/%.2i.\",\n     datePtr->month, datePtr->day, datePtr->year\
  \ % 100);\n\n[pool drain];\n\nreturn 0;\n}\n```\n\n***\n\n**程序 13.13. 输出**\n\n***\n\
  \n今天的日期是 9/25/11。\n\n***\n\n### 指针、方法与函数\n\n你可以像平常一样将指针作为方法或函数的参数传递，也可以让函数或方法返回一个指针作为其结果。仔细想起来，这正是你的\
  \ `alloc` 和 `init` 方法直以来做的事情——返回指针。我们将在本章末尾详细介绍这一点。\n\n现在考虑 程序 13.14。\n\n**程序 13.14**\n\
  \n***\n\n```objc\n// 指针作为函数的参数\n#import <Foundation/Foundation.h>\n\nvoid exchange\
  \ (int *pint1, int *pint2)\n{\n    int temp;\n    temp = *pint1;\n    *pint1 = *pint2;\n\
  \    *pint2 = temp;\n}\n\nint main (int argc, char *argv[])\n{\n    NSAutoreleasePool\
  \ * pool = [[NSAutoreleasePool alloc] init];\n    void exchange (int *pint1, int\
  \ *pint2);\n    int  i1 = -5, i2 = 66, *p1 = &i1, *p2 = &i2;\n    NSLog (@\"i1 =\
  \ %i, i2 = %i\", i1, i2);\n    exchange (p1, p2);\n    NSLog (@\"i1 = %i, i2 = %i\"\
  , i1, i2);\n    exchange (&i1, &i2);\n    NSLog (@\"i1 = %i, i2 = %i\", i1, i2);\n\
  \    [pool drain];\n    return 0;\n}\n```\n\n***\n\n**程序 13.14. 输出**\n\n***\n\n\
  i1 = -5, i2 = 66\ni1 = 66, i2 = -5\ni1 = -5, i2 = 66\n\n***\n\n`exchange` 函数的作用是交换其两个参数所指向的两个整数值。本地整数变量\
  \ `temp` 用于在交换时持有其中一个整数值。它的值被设置为与 `pint1` 所指向的整数相等。然后，将 `pint2` 所指向的整数复制到 `pint1`\
  \ 所指向的整数中，并将 `temp` 的值存储在 `pint2` 所指向的整数中，从而完成交换。\n\n`main` 根程序定义了整数 `i1` 和 `i2`，值分别为\
  \ `-5` 和 `66`。接着定义了两个整数指针 `p1` 和 `p2`，并将它们分别指向 `i1` 和 `i2`。程序接下来显示了 `i1` 和 `i2`\
  \ 的值，并调用 `exchange` 函数，将两个指针（`p1` 和 `p2`）作为参数传递。`exchange` 函数交换了包含 `p1` 指向整数的值与\
  \ `p2` 指向整数的值。由于 `p1` 指向 `i1` 且 `p2` 指向 `i2`，该函数交换了 `i1` 和 `i2` 的值。第二次 `NSLog` 用的输出验证了交换正常工作。\n\
  \n第二次调用 `exchange` 稍微有点意思。这一次，传递给函数的参数是指向 `i1` 和 `i2` 的指针，这些指针是通过对这两个变量应用地址操作符现场生成的。由于表达式\
  \ `&i1` 产生一个指向整数变量 `i1` 的指针，这符合你的函数对第一个参数的预期类型（一个指向整数的指针）。第二个参数也是如此。正如从程序的输出所示，`exchange`\
  \ 函数完成了它的工作，并将 `i1` 和 `i2` 的值切换回了原始值。\n\n请详细学习 程序 13.14。\n\n### 指针与数组\n\n如果你有一个名为\
  \ `values` 的整数数组，你可以通过以下语句定义指针 `valuesPtr` 并将其设置为指向 `values` 的第一个元素：\n\n```objc\n\
  int *valuesPtr = values;\n```\n\n现在 `valuesPtr` 指向数组的第一个元素。要访问第二个元素，你可以使用以下表达式：\n\
  \n```objc\n*(valuesPtr + 1)\n```\n\n通常情况下，如果 `a` 是一个类型为 `x` 的元素数组，`px` 的类型是“指向 x\
  \ 的指针”，且 `i` 和 `n` 是整数常量，那么语句\n\n```objc\npx = a;\n```\n\n将 `px` 设置为指向 `a` 的第一个元素，随后表达式\
  \ `*(px + i)` 引用了 `a[i]` 中包含的值。此外，语句\n\n```objc\npx += n;\n```\n\n将 `px` 设置为指向数组中后第\
  \ `n` 个元素，无论该数组包含什么种类型的元素。\n\n假设 `fractsPtr` 指向分数数组中的一个分数。进一步假设你想将其与数组中下一个元素的分数相加，并将结果赋值给\
  \ `Fraction` 对象 `result`。你可以通过以下代码来实现：\n\n```objc\nresult = [*fractsPtr add: *(fractsPtr\
  \ + 1)];\n```\n\n递增和递减运算符（`++` 和 `--`）在处理指针时特别有用。对指针应用递增运算符的效果与指针加 1 相同，而应用递减运算符的效果与指针减去\
  \ 1 相同（这里的“1”意味着一个单位，即指针声明为指向的数据项的大小）。因此，如果 `textPtr` 被定义为 `char` 指针并设置为指向名为 `text`\
  \ 的字符数组的开头，那么语句\n\n```objc\n++textPtr;\n```\n\n将 `textPtr` 设置为指向 `text` 中的下一个字符，即\
  \ `text[1]`。同样地，语句\n\n```objc\n--textPtr;\n```\n\n将 `textPtr` 设置为指向 `text` 中的上一个字符（当然假设在该语句执行之前，`textPtr`\
  \ 并没有指向 `text` 的开头）。\n\n\n\n\n在 Objective-C 中比较两个指针变量是完全有效的。这在比较同一个数组中的两个指针时特别有用。例如，你可以通过将指针\
  \ `valuesPtr` 与数组最后一个元素的指针进行比较，来测试指针 `valuesPtr` 是否指向了包含 100 个元素的数组末尾。因此，表达式\n\n\
  ```\nvaluesPtr > &values[99]\n```\n\n如果 `valuesPtr` 指向 `values` 数组最后一个元素之后，则该表达式为\
  \ `TRUE`（非零），否则为 `FALSE`（零）。根据我们早的讨论，你可以将之前的表达式替换为它的等效表达式：\n\n```\nvaluesPtr > values\
  \ + 99\n```\n\n这是可能的，因为在不使用下标的情况下 `values` 时，它是指向 `values` 数组开头的指针。（记住这等同于编写 `&values[0]`。）\n\
  \n程序 13.15 展示了指向数组的指针。`arraySum` 函数计算整数数组包含元素的和。\n\n**程序 13.15**\n\n* * *\n\n```\n\
  // 计算整数数组元素和的函数\n#import <Foundation/Foundation.h>\n\nint arraySum (int array[],\
  \ int n)\n{\n   int sum = 0, *ptr;\n   int *arrayEnd = array + n;\n   for ( ptr\
  \ = array; ptr < arrayEnd; ++ptr )\n       sum += *ptr;\n   return (sum);\n}\n\n\
  int main (int argc, char *argv[])\n{\n   NSAutoreleasePool * pool = [[NSAutoreleasePool\
  \ alloc] init];\n   int arraySum (int array[], int n);\n   int values[10] = { 3,\
  \ 7, -9, 3, 6, -1, 7, 9, 1, -5 };\n   NSLog (@\"The sum is %i\", arraySum (values,\
  \ 10));\n   [pool drain];\n   return 0;\n}\n```\n\n* * *\n\n**程序 13.15. 输出**\n\n\
  * * *\n\n```\nThe sum is 21\n```\n\n* * *\n\n在 `arraySum` 函数内部，定义了整数指针 `arrayEnd`\
  \ 并将其设置为指向 `array` 最后一个元素的后续位置。然后设置一个 `for` 循环来遍历 `array` 的元素；在进入循环时，`ptr` 的值被设置为指向\
  \ `array` 的开头。每次循环，`ptr` 所指向的 `array` 元素都会被加到 `sum` 中。然后 `for` 循环递增 `ptr` 的值，使其指向\
  \ `array` 中的下一个元素。当 `ptr` 指向 `array` 结尾之后时，`for` 循环退出，并将 `sum` 的值返回给调用者。\n\n###\
  \ 它是数组还是指针？\n\n要将数组传递给函数，只需指定数组的名称，就像你之前调用 `arraySum` 函数时做的那样。但我们在节中也提到，要产生指向数组的指针，只需要指定数组的名称。这意味着在调用\
  \ `arraySum` 函数时，一个指向数组 `values` 的指针被传递给了函数。情况恰恰如此，这解释了为什么你可以在函数内部更改数组的元素。\n\n但如果传递给函数的是数组指针，为什么函数内部的形式参数没有声明为指针呢？换句话说，在\
  \ `arraySum` 函数的 `array` 声明中，为什么没有使用这种声明？\n\n```\nint *array;\n```\n\n从函数内部对数组的所有引用不都应该使用指针变量完成吗？\n\
  \n为了回答这些问题，我们必须首先重申之前关于指针和数组的话。我们提到，如果 `valuesPtr` 指向的元素类型与名为 `values` 的数组包含的元素类型相同，那么表达式\
  \ `*(valuesPtr + i)` 与表达式 `values[i]` 等效，前提是 `valuesPtr` 已设置为指向 `values` 的开头。由此得出的结论是，你也可以使用表达式\
  \ `*(values + i)` 来引用数组 `values` 的第 `i` 个元素——通常情况下，如果 `x` 是任何类型的数组，表达式 `x[i]` 在\
  \ Objective-C 中始终等效地表示为 `*(x + i)`。\n\n正如你所见，指针和数组在 Objective-C 中是密不可相关的，这就是为什么你可以在\
  \ `arraySum` 函数内部将 `array` 声明为“`int` 数组”类型，或者“指向 `int` 的指针”类型。这两种声明在之前的程序中运行良好——试试看。\n\
  \n如果你将使用索引号来引用数组元素，请将相应的的形式参数声明为数组。这更准确地反映了函数对数组的使用。同样，如果你将使用参数作为指向数组的指针，请将其声明为指针类型。\n\
  \n### 字符字符串指针\n\n使用数组指针最常见的应用之一是作为字符字符串的指针。原因在于符号表示的方便效率。为了展示你如何方便地使用字符字符串指针，让我们写一个函数将一个字符串拷贝到另一个。如果你使用普通的数组索引来编写，你可能会这样编写函数：\n\
  \n```\nvoid copyString (char to[], char from[])\n{\n   int i;\n   for ( i = 0; from[i]\
  \ != '\\0'; ++i)\n      to[i] = from[i];\n   to[i] = '\\0';\n}\n```\n\n如果你使用指针编写\
  \ `copyString`，就不再需要索引 `i` 了。程序 13.16 展示了指针版本。\n\n**程序 13.16**\n\n* * *\n\n```\n\
  #import <Foundation/Foundation.h>\n\nvoid copyString (char *to, char *from)\n{\n\
  \   for ( *from != '\\0'; ++from, ++to )\n      *to = *from;\n   *to = '\\0';\n\
  }\n\nint main (int argc, char *argv[])\n{\n   NSAutoreleasePool * pool = [[NSAutoreleasePool\
  \ alloc] init];\n   char string1[] = \"A string to be copied.\";\n   char string2[50];\n\
  \   copyString (string2, string1);\n   NSLog (@\"%s\", string2);\n   copyString\
  \ (string2, \"So is this.\");\n   NSLog (@\"%s\", string2);\n   [pool drain];\n\
  \   return 0;\n}\n```\n\n* * *\n\n**程序 13.16. 输出**\n\n* * *\n\n```\nA string to\
  \ be copied.\nSo is this.\n```\n\n* * *\n\n`copyString` 函数将形式参数 `to` 和 `from` 定义为指针而不是数组。这反映了函数使用这些变量的方式。然后进入\
  \ `for` 循环（无初始条件），将 `from` 指向的字符串拷贝到 `to` 指向的字符串中。每次循环，`from` 和 `to` 指针都会递增。这使得\
  \ `from` 指针指向源字符串的下一个字符，并使得 `to` 指针指向目标字符串中存储下一个字符的位置。\n\n当 `from` 指针指向空字符时，`for`\
  \ 循环退出。函数随后在目标字符串的末尾放置空字符。\n\n在 `main` 例程中，`copyString` 函数被调用两次——第一次是将 `string1`\
  \ 的内容拷贝到 `string2`，第二次是将常量字符字符串 `\"So is this.\"` 的内容拷贝到 `string2`。\n\n### 常量字符字符串与指针\n\
  \n之前的程序中 `copyString (string2, \"So is this.\");` 调用有效，这意味着当常量字符字符串作为参数传递给函数时，该字符字符串实际上被传递给了指针。这不仅在这种情况下成立，而且还可以概括为：每当在\
  \ Objective-C 中使用常量字符字符串时，都会产生该字符字符串的指针。\n\n这一点现在听起来可能有点困惑，但正如我们在第 4 章 中简要提到的，这里提到的常量字符字符串被称为\
  \ C 风格字符串。它们不是对象。正如你所知，常量字符字符串对象是通过在字符串前加上 @ 符号创建的，例如 `@\"This is okay.\"`。你不能相互替代。\n\
  \n所以，如果 `textPtr` 被声明为字符指针，例如\n\n```\nchar *textPtr;\n```\n\n那么语句\n\n```\ntextPtr\
  \ = \"A character string.\";\n```\n\n\n\n将 `textPtr` 赋值为指向常量字符字符串 `\"A character\
  \ string\"` 的指针。请注意区分此处字符指针和字符数组之间的区别，因为之前所示的赋值类型对于字符数组是无效的。例如，如果 `text` 被定义为 `char`\
  \ 数组，并且如下所示：\n\n```c\nchar text[80];\n```\n\n你不能写出像这样的语句：\n\n```c\ntext = \"This\
  \ is not valid.\";\n```\n\n只有在初始化字符数组时，Objective-C 才允许你对字符数组执行这种类型的赋值：\n\n```c\n\
  char text[80] = \"This is okay.\";\n```\n\n以这种方式初始化 `text` 数组的效果并不是在 `text` 内部存储一个指向字符字符串\
  \ `\"This is okay.\"` 的指针。相反，字符本身以及紧随其后的终止空字符，被存储在 `text` 数组相应的元素中。\n\n如果 `text`\
  \ 是一个字符指针，通过以下语句初始化 `text`\n\n```c\nchar *text = \"This is okay.\";\n```\n\n将给它赋值一个指向字符字符串\
  \ `\"This is okay.\"` 的指针。\n\n### 重新复习自增和自减运算符\n\n到为止，每当你使用自增或自减运算符时，它都是表达式中出现的唯一运算符。当你编写表达式\
  \ `++x` 时，你知道这会将变量 `x` 的值加 1。正如你刚刚看到的，如果 `x` 是指向数组的指针，这会将 `x` 指向数组的下一个元素。\n\n你可以在其他运算符也出现的表达式中使用自增和自减运算符。在这种情况下，更精确地了解这些运算符是如何工作的就变得非常重要。\n\
  \n每当你使用自增或自减运算符时，你总是将它们放在要递增或减少的变量之前。因此，要递增变量 `i`，你只需要写：\n\n```c\n++i;\n```\n\n\
  你也可以将自增运算符放在变量之后，如下：\n\n```c\ni++;\n```\n\n这两个表达式都是有效的，并且都实现了相同的结果——即增加 `i` 的值。在第一种情况下（`++`\
  \ 放在操作数之前），递增操作被更精确地识别为“前置递增”（pre-increment）。在第二种情况下（`++` 放在操作数之后），该操作被识别为“后置递增”（post-increment）。\n\
  \n同样的讨论也适用于自减运算符。因此，语句\n\n```c\n--i;\n```\n\n在技术上执行的是 `i` 的前置自减，而语句\n\n```c\ni--;\n\
  ```\n\n执行的是 `i` 的后置自减。两者的结果相同，都是从 `i` 的值减去 1。\n\n当自增和自减运算符用于更复杂的表达式时，这些运算符的前置和后置性质的区别就体现出来了。\n\
  \n假设你有两个整数，分别称为 `i` 和 `j`。如果你将 `i` 的值设置为 `0`，然后写语句\n\n```c\nj = ++i;\n```\n\n赋值给\
  \ `j` 的值是 `1` ——而不是你可能预想的 `0`。对于前置递增运算符，变量在它的值被表达式使用之前就已经进行了递增。因此，在前面的表达式中，`i` 的值首先从\
  \ `0` 增加到 `1`，然后将其值赋值给 `j`，就像是写了以下两个语句一样：\n\n```c\n++i;\nj = i;\n```\n\n如果你在语句\n\
  \n```c\nj = i++;\n```\n\n中使用后置递增运算符，`i` 在其值赋值给 `j` 之后才进行递增。因此，如果在执行上一个语句之前 `i` 是\
  \ `0`，那么 `0` 会赋值给 `j`，然后 `i` 会增加 1，就像是使用了这些语句一样：\n\n```c\nj = i;\n++i;\n```\n\n\
  另一个例子是，如果 `i` 等于 `1`，语句\n\n```c\nx = a[--i];\n```\n\n具有将 `a[0]` 的值赋值给 `x` 的效果，因为变量\
  \ `i` 在其值被用于 `a` 的索引之前被递减了。而使用的语句\n\n```c\nx = a[i--];\n```\n\n将 `a[1]` 的值赋值给 `x`，因为\
  \ `i` 在其值被用于 `a` 的索引之后才会被递减。\n\n作为前置和后置自增自减运算符区别的第三个例子，函数调用\n\n```objc\nNSLog (@\"\
  %i\", ++i);\n```\n\n会递增 `i`，然后将其值发送给 `NSLog` 函数；而调用\n\n```objc\nNSLog (@\"%i\",\
  \ i++);\n```\n\n在将其值发送给函数之后才递增 `i`。因此，如果 `i` 等于 `100`，第一个 `NSLog` 调用将在终端显示 `101`，而第二个\
  \ `NSLog` 调用将显示 `100`。在任何情况下，语句执行后，`i` 的值都等于 `101`。\n\n在我们介绍程序之前，关于这个主题的最后一个例子是，如果\
  \ `textPtr` 是字符指针，表达式\n\n```c\n*(++textPtr)\n```\n\n首先递增 `textPtr`，然后获取它指向的字符；而表达式\n\
  \n```c\n*(textPtr++)\n```\n\n在 `textPtr` 的值增加之前先获取它所指向的字符。在任何情况下，都不需要括号，因为 `*` 和\
  \ `++` 的优先级更高（注：此处指后置自增的特殊性）。\n\n让我们回到 13.16 中的 `copyString` 函数并重写它，将递增操作直接并赋值语句。由于\
  \ `*` 和 `++` 运算符相同但从右向左结合（注：原文此处表述可能有误，意指优先级与结合顺序），`for` 循环变为：\n\n```c\nfor ( ;\
  \ *from != '\\0'; )\n    *to++ = *from++;\n```\n\n`while` 循环执行如下：`from` 指向的字符被获取，然后\
  \ `from` 递增指向下一个字符。该字符被存储在 `to` 指向的位置；然后 `to` 递增指向下一个字符。这已经在程序 13.17 中完成，`while`\
  \ 循环利用了空字符等于 `0` 的事实，正如 Objective-C 程序员通常所做的那样。\n\n**程序 13.17**\n\n```objc\n// 将一个字符串拷贝到另一个字符串的函数\n\
  //指针 2\n#import <Foundation/Foundation.h>\n\nvoid copyString (char *to, char *from)\n\
  {\n    while ( *from )\n        *to++ = *from++;\n    *to = '\\0';\n}\n\nint main\
  \ (int argc, char *argv[])\n{\n    NSoreleasePool * pool = [[NSoreleasePool alloc]\
  \ init];\n    void copyString (char *to, char *from);\n    char string1[] = \"A\
  \ string to be copied.\";\n    char string2[50];\n    copyString (string2, string1);\n\
  \    NSLog (@\"%s\", string2);\n    copyString (string2, \"So is this.\");\n   \
  \ NSLog (@\"%s\", string2);\n\n    [pool drain];\n    return 0;\n}\n```\n\n**程序\
  \ 13.17 输出**\n\n```\nA string to be copied.\nSo is this.\n```\n\n#### 指针操作\n\n正如你在本章所示，你可以对指针进行加或减整数的操作。此外，你可以比较两个指针以查看它们是否相等，或者一个指针是否小于或大于另一个指针。指针上允许的其他操作是相同类型指针的减法。两个指针相减的结果是这两个指针之间的元素数量。因此，如果\
  \ `a` 指向任意类型元素的数组，且 `b` 指向同一数组中靠后的另一个元素，表达式 `b - a` 代表了这两个指针之间的元素个数。例如，如果 `p` 指向数组\
  \ `x` 中的某个元素，那么\n\n```c\nn = p - x;\n```\n\n\n\n\n将变量 `n`（此处假设为整数变量）赋值为 `x` 内部 `p`\
  \ 所指向的元素的索引号。因此，如果通过类似下方的语句将 `p` 设置为指向 `x` 中的第 100 个元素：\n\n```c\np = &x[99];\n```\n\
  \n那么在执行之前的减法操作后，`n` 的值将是 `99`。\n\n## 函数指针\n\n这是一个性质稍微高级一点的概念，但为了完整性起见，在这里也进行了介绍，即函数指针。在处理函数指针时，Objective-C\
  \ 编译器不仅需要知道指针变量指向一个函数，还需要知道该函数返回值的类型，以及其参数的数量和类型。要声明一个变量 `fnPtr` 的类型为“返回 `int` 且不接受任何参数的函数指针”，你需要编写如下声明：\n\
  \n```c\nint (*fnPtr) (void);\n```\n\n`*fnPtr` 外围的括号是必须的；否则，Objective-C 编译器会将前面的语句视为一个名为\
  \ `fnPtr` 的函数的声明，该函数返回一个指向 `int` 的指针（因为函数调用运算符 `()` 的优先级高于指针间接引用运算符 `*`）。\n\n要让你的函数指针指向特定的函数，你只需将函数名赋值给它。因此，如果\
  \ `lookup` 是一个返回 `int` 且不接受任何参数的函数，那么语句\n\n```c\nfnPtr = lookup;\n```\n\n会将指向该函数的指针存储在函数指针变量\
  \ `fnPtr` 中。编写函数名而不带随后的括号，其处理方式类似于编写数组名而不带下标。Objective-C 编译器会自动生成一个指向指定函数的指针。在函数名面前面允许使用\
  \ `&` 符号，但并不是必须的。\n\n如果程序中之前没有定义 `lookup` 函数，则你必须在执行之前的赋值之前声明该函数。需要类似下方的语句：\n\n\
  ```c\nint lookup (void);\n```\n\n在将该函数的指针赋值给变量 `fnPtr` 之前。\n\n你可以通过对指针应用函数调用运算符，并在括号内列出函数的任何参数，来调用通过指针变量间接引用的函数。例如：\n\
  \n```c\nentry = fnPtr ();\n```\n\n这将调用 `fnPtr` 所指向的函数，并将返回的值存储在变量 `entry` 中。\n\n\
  函数指针的一个常见应用是将它们作为参数传递给其他函数。标准库在 `qsort` 函数中使用了这一点，该函数对数据元素数组进行快速排序。该函数的一个参数之一就是指向函数的指针，每当\
  \ `qsort` 需要比较正在排序数组中的两个元素时，就会调用该函数。通过这种方式，`qsort` 可以用于排序任何类型的数组，因为数组中任何两个元素的实际比较是由用户提供的函数完成的，而不是由\
  \ `qsort` 函数本身。\n\n在 Foundation 框架中，某些方法接受函数指针作为参数。例如，`NSMutableArray` 类中定义了 `sortUsingFunction:context:`\
  \ 方法，每当待排序数组中的两个元素需要比较时，它就会调用指定的函数。\n\n函数指针的另一个常见应用是创建分发表（dispatch tables）。你不能将函数本身存储在数组元素中。但你可以在数组中存储函数指针。据此，你可以创建一个包含要调用的函数指针表格。例如，你可能会为处理用户输入的不同命令创建一个表格。表格中的每个条目都可以同时包含命令名称和指向用于处理该特定命令的函数指针。现在，每当用户输入一个命令时，你就可以在表中查找该命令并调用相应的函数来处理它。\n\
  \n### 指针与内存地址\n\n在结束对 Objective-C 指针的讨论之前，我们应该指出它们实际上是如何实现的细节。计算机内存可以被概念化为顺序存储单元集合。计算机内存的每个单元都有一个与其相关的数字，称为地址。通常，计算机内存的第一个地址编号为\
  \ 0。在大多数计算机系统中，一个单元是 1 字节。\n\n计算机使用内存来存储你的计算机程序的指令，以及存储与程序相关的变量的值。因此，如果你声明一个名为 `count`\
  \ 的变量类型为 `int`，系统将在程序执行期间分配内存位置（或）来存放 `count` 的值。例如，该位置可能位于计算机内存中的地址 `1000FF[16]`\
  \ 处。\n\n幸运的是，你不需要担心分配变量的具体内存地址——系统会自动处理它们。然而，每个变量都与一个唯一的内存地址相关这一知识将帮助你理解指针的操作方式。\n\
  \n每当你在 Objective-C 中对变量应用地址运算符`&`）时，生成的值是该变量在计算机内存中的实际地址。（显然，这就是地址运算符名称的由来。）因此，语句\n\
  \n```c\nintPtr = &count;\n```\n\n将计算机内存中分配给变量 `count` 的地址赋值给 `intPtr`。因此，如果 `count`\
  \ 位于地址 `1000FF[16]`，该语句将把值 `0x1000FF` 赋值给 `intPtr`。\n\n对指针变量应用间接引用运算符`*`，如表达式\n\n\
  ```c\n*intPtr\n```\n\n其效果是将指针变量中包含的值视为内存地址。存储在该内存地址的值将根据指针声明的类型进行获取和解释。如果 `intPtr`\
  \ 类型为指向 `int`，系统会将存储的值解释为整数。\n\n## 联合（Unions）\n\nObjective-C 语言中比较特殊的结构之一是联合。这种结构主要用于高级编程应用程序，需要在同一存储区域存储不同类型的数据。例如，如果你想定义一个名为\
  \ `x` 的变量，它可以存储字符、浮点数或整数，你首先需要定义如下联合（命名为 `mixed`）：\n\n```c\nunion mixed\n{\n   \
  \ char c;\n    float f;\n    int i;\n};\n```\n\n联合的声明与结构体相同，只是在原本指定 `struct` 的地方使用了\
  \ `union` 关键字。结构体和联合之间的真正区别在于内存分配的方式。声明变量类型为 `union mixed`，如下所示：\n\n```c\nunion\
  \ mixed x;\n```\n\n并不是定义 `x` 包含独立的成员 `c`、`f` 和 `i`；相反，它定义 `x` 包含一个单一成员，`c`、`f` 或\
  \ `i`。这样，你可以使用变量 `x` 来存储 `char`、`float` 或 `int`，但不能同时存储三个（甚至不能存储两个）。你可以通过以下语句在变量\
  \ `x` 中存储一个字符：\n\n```c\nx.c = 'K';\n```\n\n要在 `x` 中存储浮点值，使用记法 `x.f`：\n\n```c\nx.f\
  \ = 786.3869;\n```\n\n最后，将整数 `count` 除以 2 的结果存储到 `x` 中，使用此语句：\n\n```c\nx.i = count\
  \ / 2;\n```\n\n由于 `x` 的 `float`、`char` 和 `int` 成员在内存中共同存在于同一位置，因此 `x` 只能存储一个值。此外，你必须确保从联合中获取的值与最后存储在联合中的方式是一致的。\n\
  \n\n\n在定义 `union`（联合体）时，联合体的名称不是强制要求的，并且可以在定义联合体的同时声明变量。你也可以声明指向联合体的指针，它们的语法和操作规则与结构体（structs）相同。最后，你可以像这样初始化联合体变量：\n\
  \n```c\nunion mixed x = { '#' };\n```\n\n这会将 `x` 的第一个成员（即 `c`）设置为字符 `#`。特定的成员也可以通过名称进行初始化，如下所示：\n\
  \n```c\nunion mixed x = {.f = 123.4;};\n```\n\n你可以将一个自动联合体变量初始化为另一个相同类型的联合体变量。\n\
  \n`union` 允许你定义数组，可以使用这些数组来存储不同数据类型的元素。例如，以下语句设置了一个名为 `table` 的数组，它由 `kTableEntries`\
  \ 个元素组成：\n\n```c\nstruct\n{\n    char *name;\n    int  type;\n    union\n    {\n\
  \        int   i;\n        float  f;\n        char  c;\n    } data;\n} table [kTableEntries];\n\
  ```\n\n数组的每个元素都包含一个结构体，该结构体由一个名为 `name` 的字符指针、一个名为 `type` 的整数成员和一个名为 `data` 的联合体成员组成。数组中的每个\
  \ `data` 成员可以包含一个 `int`、一个 `float` 或一个 `char`。你可以使用整数成员 `type` 来跟踪存储在成员 `data` 中的值的类型。例如，如果包含\
  \ `int`，你可以给它赋值 `INTEGER`（假设已适当定义）；如果它包含 `float`，则赋值 `FLOATING`；如果包含 `char`，则赋值\
  \ `CHARACTER`。这些信息将使你知道如何引用特定数组元素的特定 `data` 成员。\n\n为了在 `table[5]` 中存储字符 `'#'` 并随后设置\
  \ `type` 字段以指示该位置存储了字符，你需要使用以下两个语句：\n\n```c\ntable[5].data.c = '#';\ntable[5].type\
  \ = CHARACTER;\n```\n\n在遍历 `table` 元素时，你可以通过建立一系列的测试语句来确定每个元素中存储的数据值的类型。例如，以下循环将在终端上显示\
  \ `table` 中的每个名称及其关联的值：\n\n```objc\nenum symbolType { INTEGER, FLOATING, CHARACTER\
  \ };\n\n  ...\n\nfor ( j = 0; j < kTableEntries; ++j )\n{\n    NSLog (@\"%s \",\
  \ table[j].name);\n    switch ( table[j].type )\n    {\n        case INTEGER:\n\
  \            NSLog (@\"%i\", table[j].data.i);\n            break;\n        case\
  \ FLOATING:\n            NSLog (@\"%g\", table[j].data.f);\n            break;\n\
  \        case CHARACTER:\n            NSLog (@\"%c\", table[j].data.c);\n      \
  \      break;\n        default:\n            NSLog (@\"Unknown type (%i), element\
  \ %i\",\n                  table[j].type, j );\n            break;\n    }\n}\n```\n\
  \n之前示例所示的应用类型在存储符号表中可能非常实用，符号表可能包含每个符号的名称、类型和值（可能还有其他关于符号的信息）。\n\n### 它们不是对象！\n\n\
  现在你已经知道如何定义数组、结构体、字符字符串和联合体，以及如何在程序中操作它们。记住最基本的一点：它们不是对象。因此，你不能向它们发送消息。你无法无法利用它们来充分利用\
  \ Foundation 框架提供的优秀特性，例如内存分配策略。这就是我鼓励你跳过这一章稍后再回来的原因之一。通常情况下，学习如何使用 Foundation 定义数组和字符串为对象的类，比使用语言内置的类型对你有利。只有在你真的需要时才诉助于使用本章定义的类型——希望你永远不需要！\n\
  \n### 杂项语言特性\n\n某些语言特征并不很好地适应于\n\n### 复合字面量\n\n*复合字面量*（compound literal）是一个括括号括的名称，后面跟着一个初始化列表。它创建了一个无名类型，其作用域限于创建它的块（block）。在后者的情况下，必须指定初始化器。例如：\n\
  \n```c\n(union mixed){.f = 123.4}\n```\n\n### `goto` 语句\n\n执行 `goto` 语句会导致跳转到指定的点。为了识别程序中何处进行跳转，需要一个标签（label）。标签是根据与变量相同的规则形成的名称；后面必须紧跟冒号。例如：\n\
  \n```objc\nout_of_data: NSLog (@\"Unexpected end of data.\");\n```\n\n懒惰的程序员经常滥用\
  \ `goto` 语句跳转到代码的其他部分。`goto` 语句中断了程序的正常流程。结果是程序变得难以理解。在程序中使用许多 `goto` 可能会导致无法破译。\n\
  \n#### 空语句（null Statement）\n\nObjective-C 允许你在任何可以出现普通语句的地方放置一个单独的分号。这种被称为*空*语句（null\
  \ statement）语句的效果是什么都不做。这看起来可能完全没用，但程序员经常在 `while`、`for` 和 `do` 语句这样做。例如，以下语句的目的是从*标准输入*（默认情况下为你的终端）读取的所有字符存储在\
  \ `text` 指向的字符数组中，直到遇到换行符为止。该语句使用了库函数 `getchar`，它每次从标准输入读取并返回单个字符：\n\n```c\nwhile\
  \ (*text++ = getchar ()) != '' ;\n```\n\n所有的操作都在 `while` 语句的循环条件部分执行。需要空语句是因为编译器会将紧随循环表达式的语句作为循环体。如果没有空语句，编译器将把程序中随后的任何语句视为循环体。\n\
  \n### 逗号运算符\n\n在优先级图形图（可以这么说）的底部是逗号运算符。在第 5 章“程序循环”中，我们指出在 `for` 语句内部，你可以通过逗号分隔每个表达式，在任何字段中包含多个表达式。例如，以下\
  \ `for` 语句\n\n```c\nfor ( i = 0, j = 100; i != 10; ++i, j -= 10 )\n```\n\n在循环开始之前将\
  \ `i` 的值初始化为 `0`，`j` 初始化为 `100`，并在执行循环体后增加 `i` 的值并从 `j` 的值减去 10。\n\n由于 Objective-C\
  \ 中的所有运算符都会产生值，因此逗号运算符的值是最右侧表达式的值。\n\n\n\n\n尽管你不应该对程序中数据类型的大小做任何假设，但有时你确实需要这些信息。这可能发生在使用\
  \ `malloc` 等库例程进行动态内存分配时，或者在向文件写入或存档数据时。Objective-C 提供了一个名为 `sizeof` 的运算符，你可以用它来确定数据类型或对象的大小。`sizeof`\
  \ 运算符返回指定项目以字节为单位的大小。`sizeof` 运算符的参数可以是一个变量、数组名、基本数据类型的名称、对象、派生数据类型的名称或表达式。例如，编写\n\
  \n```\nsizeof (int)\n```\n\n会得到存储一个整数所需的字节数。在我的 MacBook Air 上，这产生的结果是 `4`（或 32 位）。如果\
  \ `x` 被声明为包含 100 个 `int` 的数组，那么表达式\n\n```\nsizeof (x)\n```\n\n将给出存储 `x` 中的 100 个整数所需的存储空间大小。\n\
  \n假设 `myFract` 是一个包含两个 `int` 实例变量（`numerator` 和 `denominator`）的 `Fraction` 对象，那么表达式\n\
  \n```\nsizeof (myFract)\n```\n\n在任何使用 4 字节表示指针的系统上都会产生值 `4`。事实上，这是 `sizeof` 对任何对象都会产生的值，因为在这里你请求的是指向对象数据的指针的大小。要获取存储\
  \ `Fraction` 对象实例的实际数据结构的大小，你应该编写以下代码：\n\n```\nsizeof (*myFract)\n```\n\n在我的 MacBook\
  \ Air 上，这给了我一个 `12` 的值。即 `numerator` 和 `denominator` 各占 4 个字节，再加上本章末尾“事物是如何工作的”节中提到的继承自\
  \ `isa` 成员的 4 个字节。\n\n表达式\n\n```\nsizeof (struct data_entry)\n```\n\n其值为存储一个 `data_entry`\
  \ 结构体所需的存储空间大小。如果 `data` 被定义为 `struct data_entry` 元素的数组，表达式\n\n```\nsizeof (data)\
  \ / sizeof (struct data_entry)\n```\n\n将给出 `data` 中包含的元素个数（`data` 必须是之前定义的数组，而不是形式参数或外部引用数组）。表达式\n\
  \n```\nsizeof (data) / sizeof (data[0])\n```\n\n产生相同的结果。\n\n尽可能使用 `sizeof` 运算符，以避免在程序中手动计算并硬编码大小。\n\
  \n### 命令行参数\n\n通常，开发一个程序可能需要用户在终端输入少量信息。这些信息可能包含一个指示你想要计算的三角形数的数字，或者一个你想要在字典中查找的单词。\n\
  \n与其让程序向用户请求此类信息，你可以在程序执行时直接向程序提供这些信息。命令行参数提供了这种能力。\n\n我们已经指出，`main` 函数唯一的特殊之处是它的名称是特殊的；它指定了程序执行的起始位置。事实上，运行时系统实际上在程序执行开始时会调用\
  \ `main` 函数，就像你在自己的程序内部调用函数一样。当 `main` 完成执行时，控制权返回给运行时系统，系统随后知道你的程序已经完成。\n\n当运行时系统调用\
  \ `main` 时，有两个参数传递给该函数。第一个参数按照惯命名为 `argc`（代表参数计数），是一个整数值，指定了在命令行上输入的参数个数。`main`\
  \ 的第二个参数是一个字符指针数组，按照惯命名为 `argv`（代表参数向量）。此外，该数组中包含了 `argc` + 1 个字符指针。该数组中的第一个条目指向正在执行的程序名称的指针，或者如果系统上没有程序名称，则指向一个空字符串。数组中的后续条目指向与启动程序执行的命令同一行指定的值。`argv`\
  \ 数组中的最后一个指针 `argv[argc]` 被定义为空。\n\n要访问命令行参数，`main` 函数必须被恰当地声明为接收两个参数。我们在书中所有程序中使用的惯用声明已经足够了：\n\
  \n```\nint main (int argc, char *argv[])\n\n{\n  ...\n}\n```\n\n记住，`argv` 的声明定义了一个包含“指向\
  \ `char` 指针”类型元素的数组。作为命令行参数的一个实际用途，假设你开发了一个在字典内部查找单词并打印其含义的程序。你可以使用命令行参数，以便在执行程序的同时指定你想要查找含义的单词，如下例中的命令所示：\n\
  \n```\nlookup aerie\n```\n\n这消除了程序提示用户输入单词的需求，因为该单词已经在命令行上输入了。\n\n如果执行了上述命令，系统会自动将\
  \ `argv[1]` 中指向字符字符串 `\"aerie\"` 的指针传递给 `main` 函数。记得 `argv[0]` 将包含一个指向程序名称的指针，在这种情况下，该名称为\
  \ `\"lookup\"`。\n\n`main` 例程可能所示：\n\n```c\n#include <Foundation/Foundation.h>\n\n\
  int main (int argc, char *argv[])\n\n{\n  struct entry dictionary[100] =\n\n   \
  \ { { \"aardvark\", \"a burrowing African mammal\" },\n     { \"abyss\", \"a bottomless\
  \ pit\" },\n     { \"acumen\", \"mentally sharp\" },\n     { \"addle\", \"a jelly\
  \ made from seaweed\" },\n     { \"affix\", \"to append\" },\n     { \"agar\", \"\
  a high nest\" },\n     { \"ahoy\", \"a nautical call of greeting\" },\n     { \"\
  igrette\", \"an ornamental cluster of feathers\" },\n     { \"ajar\", \"partially\
  \ opened\" },\n     { \"apple\", \"to become confused\" },\n     { \"argue\", \"\
  to attach\" },\n     { \"argum\", \"a argument\" },\n     { \"arium\", \"a cluster\
  \ of fruit\" } };\n\n  int entries = 10;\n  int entryNumber;\n\n  if ( argc != 2\
  \ )\n  {\n    NSLog (\"No word typed on the command line.\");\n    return (1);\n\
  \  }\n\n  entryNumber = lookup (dictionary, argv[1], entries);\n  if ( entryNumber\
  \ != -1 )\n  {\n    NSLog (\"%s\", dictionary[entryNumber].definition);\n  }\n \
  \ else\n  {\n    NSLog (\"Sorry, %s is not in my dictionary.\", argv[1]);\n  }\n\
  \  return (0);\n}\n```\n\n\n\n\n如果我们不在结束本章之前先将几件事联系起来，那将是不称职的。由于 Objective-C 语言底层是\
  \ C 语言，因此值得提到两者之间的联系。你可以忽略这些实现细节，也可以利用它们来更好地理解程序的运行机制，就像学习指针作为内存地址可以帮助你更好地理解指针一样。我们在这里不会说得太详尽，只需陈述关于\
  \ Objective-C 和 C 之间关系的四个事实。\n\n### 事实 #1：实例变量存储在结构体中\n\n当你定义一个新的类及其实例变量时，这些实例变量实际上存储在一个结构体（structure）中。这就是你能够操作对象的方式；它们实际上是成员为你的实例变量的结构体。因此，继承的实例变量加上你在类中添加的变量组成了一个单一结构体。当你使用\
  \ `alloc` 分配新对象时，会留出足够的空间来容纳这些结构体之一。\n\n结构体的一个继承成员（它源自根对象）是一个名为 `isa` 的受保护成员，用于标识对象所属的类。由于它是结构体的一部分（因此也是对象的一部分），它随对象一起移动。这样，运行时系统始终可以通过查看其\
  \ `isa` 成员来识别对象的类（即使你将其赋值给通用的 `id` 对象变量）。\n\n你可以通过将成员标记为 `@public` 来直接访问对象结构体的成员（参见第\
  \ 10 章中的讨论）。例如，如果你对 `Fraction` 类中的 `numerator` 和 `denominator` 成员这样做，你可以在程序中编写如下表达式：\n\
  \n```\nmyFract->numerator\n```\n\n来直接访问 `Fraction` 对象 `myFract` 的 `numerator` 成员。但我们强烈建议不要这样做。正如我们在第\
  \ 10 章中提到的，这违背了数据封装的原则。\n\n### 事实 #2：对象变量实际上是一个指针\n\n当你定义一个对象变量，如 `Fraction` 时，如下：\n\
  \n```\nFraction *myFract;\n```\n\n你实际上是在定义一个名为 `myFract` 的指针变量。该变量被定义为指向 `Fraction`\
  \ 类型（这是你类的类名）。当你分配一个 `Fraction` 的新实例时：\n\n```\nmyFract = [Fraction alloc];\n```\n\
  \n你正在内存中分配空间来存储一个新的 `Fraction` 对象（即存储结构体的空间），然后将返回该结构体的指针存储在指针变量 `myFract` 中。\n\n\
  当你将一个对象变量赋值给另一个时，如下：\n\n```\nmyFract2 = myFract1;\n```\n\n你仅仅是在复制指针。两个变量最终都指向存储内存某处的同一个结构体。因此，对\
  \ `myFract2` 引用（即指向）的某个成员进行更改，将改变 `myFract1` 所引用的同一个实例变量（即结构体成员）。\n\n### 事实 #3：方法是函数，而消息表达式是函数调用\n\
  \n方法实际上就是函数。当你调用一个方法时，你是在调用一个与接收者类关联的函数。传递给函数的参数是接收者（`self`）以及方法的参数。因此，无论你谈论的是函数还是方法，关于函数传递参数、返回值以及自动变量和静态变量的所有规则都是相同的。Objective-C\
  \ 编译器使用类名和方法名的组合为每个函数创建一个唯一的名称。\n\n### 事实 #4：`id` 类型是一种泛型指针类型\n\n由于对象是通过指针（指针只是内存地址）引用的，你可以自由地在\
  \ `id` 变量之间分配它们。因此，一个返回 `id` 类型的方法只是返回一个指向内存中某个对象的指针。然后你可以将该值赋值给任何对象变量。由于对象无论去哪里都带有它的\
  \ `isa` 成员，它的类始终可以被识别，即使你将其存储在 `id` 类型的通用对象变量中。\n\n## 练习题\n\n1. 编写一个函数计算 10 个浮点数数组的平均值并返回结果。\n\
  \n2.  `Fraction` 类中的 `reduce` 方法通过寻找分子和分母的最大公约数来简化分数。修改该方法，使其改用程序 13.5 中的 `gcd`\
  \ 函数。你认为应该将函数定义放在什么位置？将函数设为静态的（static）有什么好处吗？你认为哪种方法更好：使用 `gcd` 函数还是像之前那样将代码直接整合到方法中？为什么？\n\
  \n3. 一种被称为*埃拉托尼筛法*（Sieve of Erastosthenes）的算法可以生成质数。这里给出了该程序的算法。编写一个实现该算法的程序。让程序找到\
  \ `n` = 150 之前的所有质数。与文中用于计算质数的算法相比，该算法有什么特点？\n\n   - 步骤 1：定义一个整数数组 `P`。将所有元素 `P[i]`\
  \ 设置为 0，`2 <= i <= n`。\n   - 步骤 2：将 `i` 设置为 2。\n   - 步骤 3：如果 `i` > `n`，算法终止。\n \
  \  - 步骤 4：如果 `P[i]` 为 `0`，则 `i` 是质数。\n   - 步骤 5：对于所有满足 `i`×`j<=n` 的正整数 `j`，将 `P[i*j]`\
  \ 设置为 1。\n   - 步骤 6：`i` 加 1 并回到步骤 3。\n\n4. 编写一个函数加上数组传递给它的所有 `Fractions` 并返回结果。\n\
  \n5. 为 `struct date` 编写一个名为 `Date` 的 `typedef` 定义，以便你可以在程序中写：\n\n```\nDate todaysDate;\n\
  ```\n\n6. 正如文中提到的，定义 `Date` 类而不是结构体更符合面向对象编程的理念。定义这样一个具有适当 setter 和 getter 方法的类。此外添加一个名为\
  \ `dateUpdate` 的方法，返回其参数的后一天。你认为将 `Date` 定义为类而不是结构体有什么优点？你认为有任何缺点吗？\n\n7. 给定以下定义：\n\
  \n```\nchar *message = \"Programming in Objective-C is fun\";\nchar message2[] =\
  \ \"You said it\";\nint x = 100;\n```\n\n判断以下组中的每个 `NSLog` 调用是否有效，以及它们是否产生与该组内其他调用相同的输出。\n\
  \n   - 组 1:\n     ```\n     NSLog (@\"Programming in Objective-C is fun\");\n  \
  \   NSLog (@\"%s\", \"Programming in Objective-C is fun\");\n     NSLog (@\"%s\"\
  , message);\n     ```\n   - 组 2:\n     ```\n     NSLog (@\"You said it\");\n   \
  \  NSLog (@\"%s\", message2);\n     NSLog (@\"%s\", &message2[0]);\n     ```\n \
  \  - 组 3:\n     ```\n     NSLog (@\"said it\");\n     NSLog (@\"%s\", message2 +\
  \ 4);\n     NSLog (@\"%s\", &message2[4]);\n     ```\n\n8. 编写一个程序打印其所有的命令行参数，每行打印一个。注意将包含空格字符的参数封装在引号内的效果。\n\
  \n9. 下列语句哪些产生输出 `This is a test`？请解释。\n\n   ```\n   NSLog (@\"This is a test\");\n\
  \   NSLog (\"This is a test\");\n   NSLog (@\"%s\", \"This is a test\");\n   NSLog\
  \ (@\"%s\", @\"This is a test\");\n   NSLog (\"%s\", \"This is a test\");\n   NSLog\
  \ (\"%s\", @\"This is a test\");\n   NSLog (@\"%@\", @\"This is a test\");\n   NSLog\
  \ (@\"%@\", \"This is a test\");\n   ```\n\n10. 将程序 13.14 中的 `exchange` 函数重写为块并进行测试。\n\
  \n\n\n\n为你的所有程序开发提供基础或底层的框架被称为 `Foundation` 框架。该框架是本书第二部分的主题，它允许你处理基本对象（如数字和字符串）以及对象集合（如数组、字典和集合）。其他功能还包括处理日期和时间、使用自动内存管理、与底层文件系统工作、存储（或`archiving`）对象，以及处理点和矩形等几何数据结构。\n\
  \n`Application Kit`(#apa.html_gloss01_003) 框架包含了大量的类和方法，用于开发交互式图形应用程序。这些方法提供了易于处理文本、菜单、工具栏、表格、文档、剪贴板和窗口的能力。在\
  \ Mac OS X 中，`Cocoa`(#apa.html_gloss01_016) 一词统指 `Foundation` 框架、`Application Kit`\
  \ 框架以及名为 `Core Data` 的第三个框架。`Cocoa Touch`(#apa_html_gloss01_017) 统指 `Foundation`、`Core\
  \ Data` 和 `UIKit` 框架。第三部分“Cocoa, Cocoa Touch 和 iOS SDK”对这一主题提供了更多详细信息。\n\n## Foundation\
  \ 文档\n\n你应该利用存储在系统中的 `Foundation` 框架文档（如果你选择了下载本地副本），以及在 Apple 网站上提供的提供的在线文档。大多数文档以\
  \ HTML 文件的形式存在，供浏览器查看，或者以 Acrobat `pdf` 文件的形式存在。该文档包含了所有 `Foundation` 类以及所有实现的方法和函数的描述。我将\
  \ `Foundation` 文档的 URL 设置为浏览器书签，这样我可以方便地查找有关 `Foundation` 类的信息。\n\n如果你正在使用 Xcode\
  \ 开发程序，可以通过几种不同的方式方便地访问文档。你可以从 `Help` 菜单进入主文档窗口 `Xcode Help`。此窗口允许你轻松搜索并访问存储在计算机本地或可以在网上获取文档。图\
  \ 14.1 显示了在 `Xcode Help` 窗口中搜索字符串 `NSString` 的结果。\n\n**图 14.1. 使用 Xcode 参考文档**\n\
  \n![image](img/14fig01.jpg)\n\n如果你在 Xcode 中编辑文件，并想立即获取特定头文件、方法或类的文档，只需将光标放置在你想要搜索的类、方法或变量上，按住\
  \ `Option` 键并点击。你将获得所选内容的快速摘要。图 14.2 a 显示了当鼠标光标位于文本 `NSAutoreleasePool` 并按下 `Option`\
  \ 键且点击鼠标时出现的面板。\n\n**图 14.2. `NSAutoreleasePool` 的快速参考**\n\n![image](img/14fig02.jpg)\n\
  \n在出现面板的右上角，你会注意到两个图标：第一个是书，第二个是带有字母 `h` 的页面。如果你点击第一个，Xcode 将为所选的类、协议、定义或方法搜索文档。如果你点击后者，你将看到包含所选项目定义的头文件。这个快速帮助（Quick\
  \ Help）面板还允许你通过超链接（可用时）快速访问其他引用、相关文档以及使用指定类或方法的示例代码。这真真的是一个非常棒且方便的工具，你应该习惯使用它！\n\
  \n你还可以通过选择 `View`、`Utilities`、`Quick Help` 来开启快速帮助面板，使其始终出现，并在你在程序中输入或选择项目时自动更新。这将提供一个类似于图\
  \ 14.3 所示的窗口布局，`Quick Help` 菜单默认出现在最右侧的面板。\n\n**图 14.3. 在 View 面板中显示的快速帮助。**\n\n\
  ![image](img/14fig03.jpg)\n\n你可以在 [`developer.apple.com/library/mac/navigation/index.html`](http://developer.apple.com/library/mac/navigation/index.html)\
  \ 在线访问 OS X 参考库并导航到相应的引用。在该地址，你还会发现许多涵盖特定编程问题的文档，例如内存管理、字符串和文件管理。\n\n除非你用 Xcode\
  \ `subscribe` 某个特定的文档集，否则在线文档可能比存储在磁盘上的更更新。\n\n到此，我们对 `Foundation` 框架的简要介绍结束。现在是时候学习它的一些类以及你如何将它们应用到应用程序中了。\n\
  \n## 第 15 章：数字、字符串和集合\n\n本章描述了如何使用 `Foundation` 框架提供的一些基本对象。这些包括数字、字符串和集合，集合指的是以数组、字典和集合的形式处理一组对象的能力。\n\
  \n`Foundation` 框架包含了大量的类、方法和函数供你使用。Mac OS X 下提供了约 125 个头文件。为了方便起见，你可以直接使用以下导入：\n\
  \n```objc\n#import <Foundation/Foundation.h>\n```\n\n由于 `Foundation.h` 文件导入了几乎所有其他头文件，你不需要担心是否导入了正确的头文件，正如你所见\n\
  \n## 数字对象\n\n我们目前处理的所有数字类型（如整数、浮点和长整数）在 Objective-C 中都是基本类型——也就是说它们不是对象。你不能向它们发送消息。有时，你需要将这些作为对象处理。例如，`NSArray`\
  \ 允许存储这些值。为了存储任何类型（包括 `char` 类型），你可以使用 `NSNumber` 类来创建对象。参见程序 15.1。\n\n**程序 15.1**\n\
  \n```objc\n#import <Foundation.h>\n\nint main (int argc, char *argv[])\n{\n    NSAutleasePool\
  \ * pool = [[NSAutleasePool alloc] init];\n    NSNumber *myNumber, *floatNumber,\
  \ *intNumber;\n    NSInteger myInt;\n\n    // 整数值\n    intNumber = [NSNumber integer:100];\n\
  \    myInt = [intNumber integerValue];\n    NSLog (\"%li\", (long) myInt);\n\n \
  \   // 长值\n    myNumber = [NSNumber long:0abcdef];\n    NSLog (\"%lx\", [myNumber\
  \ longValue]);\n\n    // 字符值\n    myNumber = [NSNumber char:'X'];\n    NSLog (\"\
  %c\", [myNumber charValue]);\n\n    // 浮点值\n    floatNumber = [NSNumber float:100.00];\n\
  \    NSLog (\"%g\", [floatNumber floatValue]);\n\n    // 双精度\n    myNumber = [NSNumber\
  \ double:12345e+15];\n    NSLog (\"%lg\", [myNumber doubleValue]);\n\n    // 错误的访问\n\
  \    NSLog (\"%li\", (long) [myNumber integerValue]);\n\n    // 测试两个数字是否相等\n   \
  \ if ([intNumber isEqualToNumber: floatNumber] == YES)\n        NSLog (\"数字相等\"\
  );\n    else\n        NSLog (\"数字不相等\");\n\n    // 测试一个数字是否小于、等于或大于另一个数字\n    if\
  \ ([intNumber compare: myNumber] == NSOrderedAscending)\n        NSLog (\"第一个数字小于第二个\"\
  );\n\n    [pool drain];\n    return 0;\n}\n```\n\n\n\n\n# 程序 15.1. 输出\n\n* * *\n\
  \n100\nabcdef\nX\n100\n1.2345e+19\n0\n数字相等\n第一个数字小于第二个数字\n\n* * *\n\n## 快速了解自动释放池\
  \ (Autorelease Pool)\n\n程序 15.1 中的第一行出现在本书的每一个程序中。下一行在内存中为自动释放池预留空间，并将其分配给 `pool`：\n\
  \n```\nNSAutoreleasePool * pool = [[NSAutoreleasePool alloc] init];\n```\n\n自动释放池负责自动释放添加到该池中的对象所使用的内存。当向对象发送\
  \ `autorelease` 消息时，它会被添加到池中。当池被释放或“清空”（drained）时，添加到其中的所有对象都会被释放。因此，所有此类对象都会被销，除非它们被指定在自动释放池的作用范围内存在（如它们的引用计数所示）。\n\
  \n通常情况下，你不需要担心释放 Foundation 方法返回的对象。有时，该对象是由返回它的方法所有的。另另，该对象是由方法新创建并添加到自动释放池中的。正如第一部分中“Objective-C\
  \ 语言”详细描述的那样，当你完成对显式使用 `alloc` 方法创建的任何对象（包括 Foundation 对象）的使用后，仍然需要释放它们。\n\n* *\
  \ *\n\n### 注意\n\n你还需要通过 copy 或 `new` 方法创建的对象，正如你将在第 17 章中所学到的。\n\n* * *\n\n第 17\
  \ 章“内存管理”详细描述了引用计数、自动释放池以及自动垃圾收集的概念。\n\n让我们回到程序 15.1。`NSNumber` 类包含许多方法，允许你创建带有初始值的\
  \ `NSNumber` 对象。例如，这一行\n\n```\nintNumber = [NSNumber numberWithInteger: 100];\n\
  ```\n\n根据一个值为 100 的整数创建一个对象。\n\n从 `NSNumber` 对象中检索的值必须与存储在其中的值类型一致。因此，在程序后续的语句中\n\
  \n```\nmyInt = [intNumber integerValue]\n```\n\n检索存储在 `intNumber` 内部的整数值并将其存储在 `NSInteger`\
  \ 变量 `myInt` 中。注意，`NSInteger` 不是对象，而是基本数据类型的 `typedef`。它在 64 位构建中被定义为 `long`，或者在\
  \ 32 位构建中被定义为 `int`。`NSUInteger` 也存在一个类似的 `typedef` 用于在程序中处理无符号整数。\n\n在 `NSLog`\
  \ 调用中，我们将 `NSInteger myInt` 强制转换为 `long`，并使用格式化字符 `%li` 以确保即使程序为 32 位架构编译，该值也能正确地传递和显示。\n\
  \n对于每种基本数据类型，都存在一个类方法来分配 `NSNumber` 对象并设置为指定的值。这些方法以 `numberWith` 开头，后跟类型，例如 `numberWithLong:`、`numberWithFloat:`\
  \ 等。此外，可以使用实例方法将之前 `alloc` 过的 `NSNumber` 对象设置为指定值。这些方法都以 `initWith` 开头，例如 `initWithLong:`\
  \ 和 `initWithFloat:`。\n\n表 15.1 列出了设置 `NSNumber` 对象值的类方法和实例方法，以及检索其值的对应实例方法。\n\n\
  **表 15.1. `NSNumber` 创建与检索方法**\n\n![image](img/15tab01.jpg)\n\n回到程序 15.1，程序接下来使用类方法创建\
  \ `long`、`char`、`float` 和 `double` 类型的 `NSNumber` 对象。注意在使用这一行代码创建一个 double 对象后发生了什么\n\
  \n```\nmyNumber = [NSNumber numberWithDouble: 12345e+15];\n```\n\n然后尝试用下面这一行（错误地）检索并显示它的值：\n\
  \n```\nNSLog (@\"%li\", (long) [myNumber integerValue]);\n```\n\n你得到了这个输出：\n\n0\n\
  \n此外，系统没有返回任何错误信息。通常，确保如果你在 `NSNumber` 对象中存储了一个值，就以一致的方式检索它，这是你的责任。\n\n在 `if` 语句内部，消息表达式\n\
  \n```\n[intNumber isEqualToNumber: floatNumber]\n```\n\n使用 `isEqualToNumber:` 方法在数值上比较两个\
  \ `NSNumber` 对象。程序测试返回的 `BOOL` 值以判断两个数字是否相等。\n\n你可以使用 `compare:` 方法来测试一个数值在数值上是否小于、等于或大于另一个数值。消息表达式\n\
  \n```\n[intNumber compare: myNumber]\n```\n\n如果存储在 `intNumber` 中的数值小于包含在 `myNumber`\
  \ 中的数值，该表达式返回值 `NSOrderedAscending`；如果两个数字相等，则返回值 `NSOrderedSame`；如果第一个数字大于第二个，则返回值\
  \ `NSOrderedDescending`。这些值定义在头文件中。\n\n注意，你不能更改已创建的 `NSNumber` 对象的值。例如，这样：\n\n```\n\
  NSNumber *myNumber = [[NSNumber alloc] initWithInt:50];\n```\n\n最后一条语句在运行时会导致程序崩溃：\n\
  \n```\n1000];\n```\n\n根据之前的讨论，如果你以这种方式（使用 `alloc`）创建了 `myNumber`，在你在使用它时负责释放它，例如使用\n\
  \n```\n[myNumber release];\n```\n\n为了确保你理解使用 `numberWithInt:` 和 `numberWithInteger:`\
  \ 的区别，只需遵循以下规则：\n\n1. 如果使用 `numberWithInt:` 创建整数，你应该使用 `intValue` 检索其值，并可以使用 `%i`\
  \ 作为格式化字符显示它。\n2. 如果使用 `numberWithInteger:` 创建整数，你应该使用 `integerValue` 检索其值，如果使用\
  \ `stringWithFormat:` 等方法格式化字符串，则应将其强制转换为 `long`。在这种情况下使用的格式化字符为 `%li`。\n\n类似的讨论适用于使用\
  \ `numberWithUnsignedInt:` 与 `numberWithUnsignedInteger:`。\n\n在本章剩余部分，你会反复遇到 `NSNumber`\
  \ 对象。在进入下一节之前，你可能想查看 `NSDecimalNumber` 类的文档。该类是 `NSNumber` 的子类，提供了在对象级别进行数字运算的方法。\n\
  \n### 字符串对象\n\n你以前在程序中遇到过字符串对象。每你在双引号内包含一组字符序列时，例如\n\n```\n@\"Programming is fun\"\
  \n```\n\n你在 Objective-C 中创建了一个字符字符串对象。Foundation 框架支持 `NSString` 类来处理字符字符串对象。C 风格字符串由\
  \ `char` 字符组成，而 `NSString` 对象由 `unichar` 字符组成。`unichar` 字符是 Unicode 标准的多字节字符。这使得你能够处理包含数百万字符字符集。幸运的是，你不需要担心字符串中字符的内部表示，因为\
  \ `NSString` 类会自动为你处理这些。通过使用该类的方法，你可以更容易地开发出可以*本地化*——即适应世界上不同语言的应用程序。\n\n正如你所知，通过在双引号字符字符串前面加上\
  \ `@` 字符，可以在 Objective-C 中创建一个常量字符字符串对象。因此，表达式\n\n\n\n\n\n创建一个常量字符字符串对象。具体而言，它是一个属于\
  \ `NSConstantString` 类的常量字符字符串。`NSConstantString` 是字符串类 `NSString` 的子类。\n\n## 关于\
  \ `NSLog` 函数的更多内容\n\n下面的程序 15.2 显示了如何定义一个 `NSString` 对象并为其赋值初始值。它还展示了如何使用格式化 `%@`\
  \ 来显示一个 `NSString` 对象。\n\n**程序 15.2**\n\n```objc\n#import <Foundation/Foundation.h>\n\
  \nint main (int argc, char *argv[])\n{\n   NSAutoreleasePool * pool = [[NSAutoreleasePool\
  \ alloc] init];\n   NSString *str = @\"Programming is fun\";\n   NSLog (@\"%@\"\
  , str);\n   [pool drain];\n   return 0;\n}\n```\n\n**程序 15.2 输出**\n\n```\nProgramming\
  \ is fun\n```\n\n在这一行中：\n\n`NSString *str = @\"Programming is fun\";`\n\n常量字符串对象\
  \ `Programming is fun` 被赋值给 `NSString` 变量 `str`。然后使用 `NSLog` 显示它的值。\n\n`NSLog` 格式化字符\
  \ `%@` 不仅可以显示 `NSString` 对象，还可以显示其他对象。例如，给定以下内容：\n\n`NSNumber *intNumber = [NSNumber\
  \ numberWithInteger: 100];`\n\n通过 `NSLog` 调用：\n\n`NSLog (@\"%@\", intNumber);`\n\
  \n产生以下输出：\n\n```\n100\n```\n\n### `description` 方法\n\n你也可以使用 `%@` 格式化字符来显示数组、字典和集合的所有内容。事实上，只要你重写了类继承的\
  \ `description` 方法，就可以用它来显示你自定义类的对象。如果你没有重写该方法，`NSLog` 只会显示对象所属的类名以及该对象在内存中的地址。这是从\
  \ `NSObject` 类继承的 `description` 方法的默认实现。\n\n下面是一个 `description` 方法的示例，你可以将其添加到 `Fraction`\
  \ 类的实现部分，以便能够格式化 `Fraction` 对象。它使用了 `NSString` 的 `stringWithFormat:` 方法；该方法类似于 `NSLog`，但与函数不同，该方法的目的是将格式化后的字符串作为结果返回，而不是将其写入控制台：\n\
  \n```objc\n-(NSString *) description\n{\n   return [NSString stringWithFormat: @\"\
  %i/%i\", numerator, denominator];\n}\n```\n\n### 注意\n\n诸如 `stringWithFormat:` 等方法允许提供数量的参数（在此情况下为格式化字符串和要格式化的数据）。这些参数以逗号分隔的值列表的形式提供给方法。\n\
  \n在你的 `Fraction` 类中定义了这个方法后（并适当设置了两个 `Fraction` 对象 `f1` 和 `f2`），你可以在程序中编写如下的语句：\n\
  \n`sum = [f1 add: f2];`\n\n`NSLog (@\"The sum of %@ and %@ is %@\", f1, f2, sum);`\n\
  \n以得到如下单行输出：\n\n```\nThe sum of 1/2 and 1/4 is 3/4\n```\n\n在你的类中添加自己的 `description`\
  \ 方法是一个很好的调试工具——它允许你以有意义的方式显示你的对象。\n\n## 可变与不可变对象\n\n当你通过编写如 `@\"Programming is\
  \ fun\"` 这样的表达式创建一个字符串对象时，你创建了一个内容无法更改的对象。这被称为不可变对象。`NSString` 类处理不可变字符串。你经常需要处理更改字符的字符串。例如，你可能想从字符串中删除某些字符，或对字符串执行搜索替换操作。这些类型的字符串通过\
  \ `NSMutableString` 类处理。\n\n程序 15.3 显示了在程序中处理不可变字符字符串的基本方法。\n\n**程序 15.3**\n\n```objc\n\
  // 基本字符串操作\n#import <Foundation/Foundation.h>\n\nint main (int argc, char *argv[])\n\
  {\n   NSAutoreleasePool  *pool = [[NSAutoreleasePool alloc] init];\n   NSString\
  \  *str1 = @\"This is string A\";\n   NSString  *str2 = @\"This is string B\";\n\
  \   NSString  *res;\n   NSComparisonResult  compareResult;\n\n   // 计算字符数量\n   NSLog\
  \ (@\"Length of str1: %lu\", [str1 length]);\n\n   // 将一个字符串拷贝到另一个\n   res = [NSString\
  \ stringWithString: str1];\n   NSLog (@\"copy: %@\", res);\n\n   // 将一个字符串追加到另一个的末尾\n\
  \   str2 = [str1 stringByAppendingString: str2];\n   NSLog (@\"Concatentation: %@\"\
  , str2);\n\n   // 测试两个字符串是否相等\n   if ([str1 isEqualToString:res]) {\n      NSLog(\"\
  str1 == res\");\n   } else {\n      NSLog(\"str1 != res\");\n   }\n\n   // 测试一个字符串是否小于另一个\n\
  \   compareResult = [str1 compare: str2];\n   if (compareResult == NSOrderedAscending)\
  \ {\n      NSLog(\"str1 < str2\");\n   } else if (compareResult == NSOrderedSame)\
  \ {\n      NSLog(\"str1 == str2\");\n   } else {\n      NSLog(\"str1 > str2\");\n\
  \   }\n\n   // 将字符串转换为大写\n   res = [str1 uppercaseString];\n   NSLog (@\"Uppercase\
  \ conversion: %@\", res);\n\n   // 将字符串转换为小写\n   res = [str1 lowercaseString];\n\
  \   NSLog (@\"Lowercase conversion: %@\", res);\n\n   [pool drain];\n   return 0;\n\
  }\n```\n\n**程序 15.3 输出**\n\n```\nLength of str1: 16\ncopy: This is string A\nConcatentation:\
  \ This is string AThis is string B\nstr1 != res\nstr1 < str2\nUppercase conversion:\
  \ THIS IS STRING A\nLowercase conversion: this is string a\n```\n\n\n\n\n\n`uppercaseString`\
  \ 和 `lowercaseString` 是程序 15.3 中用于将字符串分别转换为大写和小写的最后两个 `NSString` 方法。同样，如输出的最后一行所示，这种转换不会影响原始字符串。\n\
  \n请确保理解 `str1` 和 `str2` 被声明为不可变字符串对象，这意味着它们所引用的字符串对象中的字符不能被更改。然而，引用 `str1` 和 `str2`\
  \ 是可以改变的。也就是说，这两个变量可以重新赋值以引用不同的不可变字符串对象。这是一个非常重要的点。让我们通过图表再次来看这一点。图 15.1 显示了变量 `res`\
  \ 和 `str1` 刚刚声明并初始化后的状态。变量 `res` 没有被设置任何初始值，因此其内容显示为空白。另一方面，`str1` 被设定为指向存储在内存某处的常量字符字符串对象\
  \ `@\"This is string A\"`。\n\n**图 15.1. 不变字符串对象的声明和初始化**\n\n![image](img/15fig01.jpg)\n\
  \n当我们向程序 15.3 中的 `str1` 发送 `uppercaseString` 消息时，我们将得到从 `str1` 创建的新字符串，该字符串对象中的任何小写字母都被替换为大写。这在图\
  \ 15.2 中所示。\n\n**图 15.2. 向字符串对象发送 `uppercaseString` 消息**\n\n![image](img/15fig02.jpg)\n\
  \n注意，`str1` 仍然指向原始字符串对象，并且创建了一个字符串对象。\n\n向 `str1` 发送 `lowercaseString` 消息的方式相同：创建一个新的字符串对象，由\
  \ `str1` 中的所有大写字母转换为小写字母组成。然后将该新创建的字符串对象的引用存储在变量 `res` 中。这在图 15.3 中所示。注意，不再存在对上一步创建的大写字符串的引用。你不需要担心这一点；系统的内存管理会为你清理掉。\n\
  \n**图 15.3. 向字符串对象发送 `lowercaseString` 消息**\n\n![image](img/15fig03.jpg)\n\n程序 15.4\
  \ 阐述了处理字符串的其他方法。这些方法允许你从字符串中提取子字符串，并在一个字符串中搜索另一个字符串的出现。\n\n某些方法要求你通过指定范围来识别子字符串。范围由一个起始索引数字加上字符计数组成。索引从零开始，因此字符串中的前三个字符通过数字对\
  \ `{0, 3}` 来指定。`NSString` 类（以及其他 Foundation 类）的一些方法使用特殊数据类型 `NSRange` 来创建范围规范。它实际上是一个结构体的\
  \ `typedef` 定义，该结构包含两个成员 `location` 和 `length`，每个成员都定义为 `NSUinteger` 类型。程序 15.4\
  \ 使用了这种数据类型。\n\n***\n\n### 注意事项\n\n你可以在第 13 章“底层 C 语言特性”中阅读关于结构体的内容。不过，你可能通过在本章随后的讨论中获得足够用于操作它们的信息。\n\
  \n***\n\n**程序 15.4**\n\n***\n\n```objc\n// Basic String Operations – Continued\n\
  \n#import <Foundation/Foundation.h>\n\nint main (int argc, char *argv[])\n\n{\n\
  \    NSAutoreleasePool  *pool = [[NSAutoreleasePool alloc] init];\n    NSString\
  \  *str1 = @\"This is string A\";\n    NSString  *str2 = @\"This is string B\";\n\
  \    NSString  *res;\n    NSRange   subRange;\n    // 从字符串中提取前 3 个字符\n    res =\
  \ [str1 substringToIndex: 3];\n    NSLog (@\"First 3 chars of str1: %@\", res);\n\
  \    // 从索引 5 开始到字符串末尾提取字符\n    res = [str1 substringFromIndex: 5];\n    NSLog (@\"\
  Chars from index 5 of str1: %@\", res);\n    // 提取从索引 8 到 13 的字符（6 个字符）\n    res\
  \ = [[str1 substringFromIndex: 8] substringToIndex: 6];\n    NSLog (@\"Chars from\
  \ index 8 through 13: %@\", res);\n    // 同样操作更简单的方法\n    res = [str1 substringWithRange:\
  \ NSMakeRange (8, 6)];\n    NSLog (@\"Chars from index 8 through 13: %@\", res);\n\
  \    // 在另一个字符串内部查找字符串\n    subRange = [str1 rangeOfString: @\"string A\"];\n  \
  \  if (subRange.location == NSNotFound) {\n        NSLog (@\"String not found\"\
  );\n    } else {\n        NSLog (@\"String found at index %lu, length %lu\", subRange.location,\
  \ subRange.length);\n    }\n    [pool drain];\n    return 0;\n}\n```\n\n***\n\n\
  **程序 15.4 输出**\n\n***\n\nFirst 3 chars of str1: Thi\nChars from index 5 of str1:\
  \ string A\nChars from index 8 through 13: is str\nChars from index 8 through 13:\
  \ is str\nString found at index 8, length 6\n\n\n\n\n\n当我们谈论可变与不可变字符串对象时，我们指的是改变字符串内部的实际字符。在程序执行期间，无论是可变还是不可变的字符串对象，都可以被设置为完全不同的字符串对象。这在程序\
  \ 15.3 的讨论中已经强调过。例如，请考虑以下内容：\n\n```\nstr1 = @\"This is a string\";\n...\nstr1 =\
  \ [str1 substringFromIndex: 5];\n```\n\n在这种情况下，`str1` 首先被赋值为一个常量字符字符串对象。在程序的后续部分，它被赋值为一个子字符串。在这种情况下，`str1`\
  \ 既可以声明为可变的也可以是不可变的字符串对象。请务必理解这一点。\n\n程序 15.5 展示了在程序中使用可变字符串的某些方法。\n\n### 程序 15.5\n\
  \n```objc\n// 基础字符串操作 - 可变字符串\n#import <Foundation/Foundation.h>\n\nint main (int\
  \ argc, char *argv[])\n{\n    NSAutoreleasePool * pool = [[NSAutoreleasePool alloc]\
  \ init];\n    NSString *str1 = @\"This is string A\";\n    NSString *search, *replace;\n\
  \    NSMutableString *mstr;\n    NSRange substr;\n\n    // 从不可变字符串创建可变字符串\n    mstr\
  \ = [NSMutableString stringWithString: str1];\n    NSLog (@\"%@\", mstr);\n\n  \
  \  // 插入字符\n    [mstr insertString: @\" mutable\" atIndex: 7];\n    NSLog (@\"%@\"\
  , mstr);\n\n    // 如果在末尾插入，则是有效的拼接\n    [mstr insertString: @\" and string B\" atIndex:\
  \ [mstr length]];\n    NSLog (@\"%@\", mstr);\n\n    // 或者可以直接使用 appendString\n\
  \    [mstr appendString: @\" and string C\"];\n    NSLog (@\"%@\", mstr);\n\n  \
  \  // 根据范围删除子字符串\n    [mstr deleteCharactersInRange: NSMakeRange (16, 13)];\n  \
  \  NSLog (@\"%@\", mstr);\n\n    // 先找到范围，然后将其进行删除\n    substr = [mstr rangeOfString:\
  \ @\"string B and \"];\n    if (substr.location != NSNotFound) {\n        [mstr\
  \ deleteCharactersInRange: substr];\n        NSLog (@\"%@\", mstr);\n    }\n\n \
  \   // 直接设置可变字符串\n    [mstr setString: @\"This is string A\"];\n    NSLog (@\"%@\"\
  , mstr);\n\n    // 现在让我们用另一个字符串替换一段范围字符\n    [mstr replaceCharactersInRange: NSMakeRange(8,\
  \ 8)\n                               withString: @\"a mutable string\"];\n    NSLog\
  \ (@\"%@\", mstr);\n\n    // 搜索并替换\n    search = @\"This is\";\n    replace = @\"\
  An example of\";\n    substr = [mstr rangeOfString: search];\n    if (substr.location\
  \ != NSNotFound) {\n        [mstr replaceCharactersInRange: substr\n           \
  \                          withString: replace];\n        NSLog (@\"%@\", mstr);\n\
  \    }\n\n    // 搜索并替换所有出现次数\n    search = @\"a\";\n    replace = @\"X\";\n    substr\
  \ = [mstr rangeOfString: search];\n    while (substr.location != NSNotFound) {\n\
  \        [mstr replaceCharactersInRange: substr\n                              \
  \       withString: replace];\n        substr = [mstr rangeOfString: search];\n\
  \    }\n    NSLog (@\"%@\", mstr);\n    [pool drain];\n    return 0;\n}\n```\n\n\
  #### 程序 15.5 输出\n\n```\nThis is string A\nThis is mutable string A\nThis is mutable\
  \ string A and string B\nThis is mutable string A and string B and string C\n...\n\
  An example of a mutable string\n```\n\n#### 声明\n`NSMutableString *mstr;` 声明 `mstr`\
  \ 为一个变量，它持有一个字符串对象，该对象的内容在程序执行期间可能会发生。`mstr = [NSMutableString stringWith: str1];`\
  \ 行将 `mstr` 设置为字符串对象，其内容是 `str1` 中字符的副本，即 `\"This is string A\"`。当将 `stringWithString:`\
  \ 方法发送给 `NSMutableString` 类时，会返回一个可变字符串对象。当它发送给 `NSString` 类时（如程序 15.5 所示），你得到的是一个不可变字符串。\n\
  \n`insertString:atIndex:` 方法将指定的字符字符串插入到接收者指定的数字起始的位置。在这种情况下，你将字符串 `@\" mutable\"\
  ` 插入到从索引 `7` 开始的字符串中，或者说字符串第 8 个字符之前。与不可变字符串对象不同，这里没有返回值，因为接收者被修改了——你可以这样做是因为它是一个可变字符串。\n\
  \n第二次 `insertString:atIndex:` 调用使用 `length` 方法在另一个字符串的末尾插入一个字符串。`appendString:`\
  \ 方法让这项任务变得稍微简单一点。\n\n通过使用 `deleteCharactersInRange:` 方法，你可以从字符串中删除指定数量的字符。当范围 `{16,\
  \ 13}` 应用于字符串 `This is mutable string A and string B and string C` 时，它会删除从索引号 16（即字符串中第\
  \ 17 个字符）开始的 13 个字符 `\"string A and \"`。这在图 15.4 中有所描述。\n\n### 图 15.4. 字符串的索引\n\n\
  ![image](img/15fig04.jpg)\n*This is mutable string A and string B and string C*\n\
  \n`rangeOfString:` 方法在程序 15.5 的后续行中被使用，展示了如何先找到字符串然后进行删除。在确认字符串 `\"string B and\
  \ \"` 存在于 `mstr` 后，使用 `deleteCharactersInRange:` 删除字符。\n\n你可以使用 `setString:` 方法直接设置可变字符串的内容。在使用该方法将\
  \ `mstr` 设置为字符串 `\"This is string A\"` 后，`replaceCharactersInRange:withString:`\
  \ 方法替换字符串中的某些字符。字符串的大小不需要相等；因此在语句\n\n```objc\n[mstr replaceCharactersInRange: NSMakeRange(8,\
  \ 8)\n                           withString: @\"a mutable string\"];\n```\n中 8 个字符\
  \ `\"string A\"` 被替换为 16 个字符 `\"a mutable string\"`。\n\n程序的剩余部分展示了如何执行搜索和替换。在第一种情况下，你在设置为\
  \ `\"This is a mutable string\"` 的 `mstr` 中查找字符串 `\"This is\"`。该字符串被找到并替换为字符串 `\"\
  An example of\"`。结果是 `mstr` 变成了字符串 `\"An example of a mutable string\"`。\n\n程序接下来设置了一个循环来演示如何实现替换所有出现次数的操作。搜索字符串设置为\
  \ `@\"a\"`，替换字符串设置为 `@\"X\"`。注意，如果替换字符串也包含搜索字符串（例如考虑将字符串 `\"a\"` 替换为 `\"aX\"`），你会陷入无限循环。其次，如果替换字符串为空（即它不包含任何字符），你实际上就删除了所有的搜索字符串。空常量字符串对象通过一对相邻的引号指定，中间没有空格：\n\
  \n```objc\nreplace = \"\";\n```\n当然，如果你只想删除字符串的一个出现处，可以使用 `deleteCharactersInRange:`\
  \ 方法，正如你所看到的。\n\n最后，`NSMutableString` 类还包含一个名为 `replaceOccurrencesOfString:withString:options:range:`\
  \ 的方法，你可以用它对字符串进行全部替换。事实上，你可以将程序 15.5 中的 `while` 循环替换为这一单一语句：\n\n```objc\n[mstr\
  \ replaceOccurrencesOfString: search\n                             withString: replace\n\
  \                             options: nil\n                             range:\
  \ NSMakeRange (0, [mstr length])];\n```\n这实现了相同的结果，并避免了无限循环的风险，因为该方法防止了此类情况发生。\n\
  \n#### 那些对象都去哪了？\n\n\n\n\n\n程序 15.4 和 15.5 涉及到许多由各种 `NSString` 和 `NSMutableString`\
  \ 方法创建并返回的字符串对象。正如本章开头讨论过的，你不需要释放这些对象所使用的内存；这些对象的创建者负责。推测创建者已经将所有这些对象添加到了自动释放池（autorelease\
  \ pool）中，这些对象将在池被清空时被释放。然而，请注意，如果你正在开发一个创建大量临时对象的程序，这些对象使用的内存可能会累积。在这种情况下，你可能需要采用不同的策略，允许内存在程序执行期间释放，而不仅仅是在自动释放池清空时。第\
  \ 17 章 描述了这一概念。目前，只需意识到这些对象占用的内存会随着你程序的执行而扩展即可。\n\n`NSString` 类包含了超过 100 个可以与字符串对象一起的方法。表\
  \ 15.2 总结了一些最常用的方法，而 表 15.3 列出了 `NSMutableString` 类提供的一些额外方法。其他 `NSString` 方法（例如处理路径名和将文件内容读取到字符串）将在本书的其余部分向你介绍。你应该查看\
  \ `NSString` 类的文档，以更好地了解你可以使用的各种丰富方法。\n\n### 表 15.2. 常见的 `NSString` 方法\n\n![image](img/15tab02.jpg)\n\
  \n![image](img/15tab02a.jpg)\n\n### 表 15.3. 常见的 `NSMutableString` 方法\n\n![image](img/15tab03.jpg)\n\
  \n在 表 15.2 和 15.3 中，`url` 是一个 `NSURL` 对象，`path` 是指定文件路径的 `NSString` 对象，`nsstring`\
  \ 是一个 `NSString` 对象，`i` 是表示字符串有效字符数量的 `NSUInteger` 值，`enc` 是指定字符编码的 `NSStringEncoding`\
  \ 对象，`err` 是发生错误时描述错误的 `NSError` 对象，`size` 和 `opts` 是 `NSUInteger`，而 `range` 是指示字符串内有效字符范围的\
  \ `NSRange` 对象。\n\n表 15.3 中的方法要么创建要么修改 `NSMutableString` 对象。\n\n`NSString` 对象在本文的其余部分被广泛使用。如果你需要将字符串解析为标记（tokens），可以查看\
  \ Foundation 的 `NSScanner` 类。\n\n## 数组对象\n\nFoundation 数组是对象的有序集合。通常，数组中的元素是同一种特定类型，但并非强制。就像存在可变和不可变字符串一样，也有可变和不可变数组。不可变数组由\
  \ `NSArray` 类处理，而可变数组由 `NSMutableArray` 处理。后者是者的子类，这意味着它继承了前者的方法。\n\n程序 15.6 设置了一个数组来存储一年的月份名称，然后打印它们。\n\
  \n**程序 15.6**\n\n```objc\n#import <Foundation/Foundation.h>\n\n#import <Foundation/NSAutoreleasePool.h>\n\
  \nint main (int argc, char *argv[])\n{\n   int    i;\n   NSAutoreleasePool   * pool\
  \ = [[NSAutoreleasePool alloc] init];\n   // 创建一个包含月份名称的数组\n   NSArray  *monthNames\
  \ = [NSArray  arrayWithObjects:\n      @\"January\", @\"February\", @\"March\",\
  \ @\"April\",\n      @\"May\", @\"June\", @\"July\", @\"August\", @\"September\"\
  ,\n      @\"October\", @\"November\", @\"December\", nil ];\n   // 现在列出数组中的所有元素\n\
  \   NSLog (@\"Month    Name\");\n   NSLog (@\"=====    ====\");\n   for (i = 0;\
  \ i < 12; ++i)\n       NSLog (@ %2i      %%@\", i + 1, [monthNames objectAtIndex:\
  \ i]);\n   [pool drain];\n   return 0;\n}\n```\n\n**程序 15.6 输出**\n\n```text\nMonth\
  \    Name\n=====    ====\n  1      January\n  2      February\n  3      March\n\
  \  4      April\n  5      May\n  6      June\n  7      July\n  8      August\n \
  \ 9      September\n 10      October\n 11      November\n 12      December\n```\n\
  \n你可以使用类方法 `arrayWithObjects:` 创建一个以对象列表作为元素的数组。在这种情况下，对象按顺序列出并用逗号分隔。这是可以接受变长参数的方法所使用的特殊语法。为了标记列表的结束，必须指定\
  \ `nil` 为列表的最后一个值——它实际上存储在数组内部。在 程序 15.6 中，`monthNames` 被设置为 `arrayWithObjects:`\
  \ 指定的 12 个值。\n\n\n\n\n\n### 注意\n\n`NSLog` 如何知道如何显示存储在数组中的对象？对于数组中的每个元素，`NSLog` 都会使用该元素所属类中的\
  \ `description` 方法。如果它是继承自 `NSObject` 的默认方法，正如之前提到的，你只会得到对象的类名和地址。然而，在这种情况下，你会得到一个有意义的显示——这表明\
  \ `NSNumber` 类中实现了一个自定义的 `description` 方法。\n\n用于处理数组的 Foundation 类提供了许多便利性。然而，在使用复杂算法处理大型数字数组的情况下，学习如何使用底层\
  \ C 语言提供的低级数组结构来执行此类任务，在内存使用和执行速度方面可能更高效。更多信息请参阅第 13 章中标题为 `Arrays` 的章节。\n\n####\
  \ 创建通讯录\n\n让我们来看一个示例，该示例通过创建一个通讯录，开始结合你目前为止学到的许多内容。你的通讯录将包含地址卡。为了简单起见，你的地址卡将只包含人的姓名和电子邮件地址。将此概念扩展到其他信息（如地址和电话号码）是很直接的，但我们将其留作在本章末尾的练习。\n\
  \n我们将创建的两个类——`AddressBook` 类和 `AddressCard` 类，以及它们之间的关系如图图 15.5\n\n#### 创建地址卡\n\n\
  我们从定义 `AddressCard` 类开始。你希望具备创建新地址卡、设置其姓名和电子邮件字段、检索这些字段并打印卡片的能力。在图形环境中，你可以使用一些方便的方法在计算机屏幕或\
  \ iOS 设备的窗口上绘制你的卡片。但在这里，你只需使用一个简单的控制台界面来显示你的地址卡。\n\n程序 15.8 显示了你新 `AddressCard`\
  \ 类的接口文件。我们现在不会合成访问器方法；由自己编写它们将提供宝贵的教训。\n\n**程序 15.8. 接口文件 AddressCard.h**\n\n```objc\n\
  #import <Foundation/Foundation.h>\n\n@interface AddressCard: NSObject\n\n{\n  NSString\
  \  *name;\n  NSString  *email;\n}\n\n-(void) setName: (NSString *) theName;\n\n\
  -(void) setEmail: (NSString *) theEmail;\n-(NSString *) name;\n-(NSString *) email;\n\
  -(void) print;\n\n@end\n```\n\n这是非常直接的，程序 15.8 中的实现文件也是如此。\n\n**程序 15.8. 实现文件 AddressCard.m**\n\
  \n```objc\n#import \"AddressCard.h\"\n\n@implementation AddressCard\n\n-(void) setName:\
  \ (NSString *) theName\n{\n    name = [[NSString alloc] initWithString: theName];\n\
  }\n\n-(void) setEmail: (NSString *) theEmail\n{\n    email = [[NSString alloc] initWithString:\
  \ theEmail];\n}\n\n-(NSString *) name\n{\n  return name;\n}\n\n-(NSString *) email\n\
  {\n  return email;\n}\n\n-(void) print\n{\n    NSLog (@\"==================================\"\
  );\n    NSLog (@\"|                              |\");\n    NSLog (@\"|  %-31s |\"\
  , [name UTF8String]);\n    NSLog (@\"|  %-31s |\", [email UTF8String]);\n    NSLog\
  \ (@\"|                              |\");\n    NSLog (@\"|                    \
  \          |\");\n    NSLog (@\"|                              |\");\n    NSLog\
  \ (@\"|                              |\");\n    NSLog (@\"==================================\"\
  );\n}\n\n@end\n```\n\n你可以通过如下定义让 `setName:` 和 `setEmail:` 方法将对象直接存储在它们的实例变量中：\n\n\
  ```objc\n-(void) setName: (NSString *) theName\n{\n  name = theName;\n}\n\n-(void)\
  \ setEmail: (NSString *) theEmail\n{\n  email = theEmail;\n}\n```\n\n但 `AddressCard`\
  \ 对象将不会拥有其成员（它仅包含传递给方法的参数的引用）。我们在第 8 章中讨论过关于 `Rectangle` 类拥有其对象时对象获取所有权的动机。\n\n\
  以以下方式定义方法也是一种错误的方法，因为 `AddressCard` 方法仍然不拥有 name 和 email：\n\n```objc\n-(void) setName:\
  \ (NSString *) theName\n{\n  name = [NSString stringWith: theName];\n}\n\n-(void)\
  \ setEmail: (NSString *) theEmail\n{\n  email = [NSString stringWith: theEmail];\n\
  }\n```\n\n在这里，对象是由 `NSString` 类自动释放的。你可以通过 `retaining` 它们来“留住”它们。但我们将这一讨论留到第 17\
  \ 章。\n\n### 注意\n\n如果你不保留这些对象，当自动释放池被清空时，你可能会丢失它们。在本书中所看到的示例中，这种情况发生在 `main` 结束时。然而，一旦你开始编写\
  \ iOS 应用程序，你要记住自动释放池在每次循环结束（也称为运行循环）时都会清空一次。\n\n回到程序 15.8，`print` 方法尝试向用户展示一个类似于通讯录卡格式的精美地址卡显示。`%-31s`\
  \ 字符指示 `NSLog` 在 31 个字符的字段宽度显示 UTF-8 字符串，并向左对齐。这确保了你的地址卡的右边缘是对齐的。在本文示例中使用它完全出于美观考虑。有了你的\
  \ `AddressCard` 类，你可以编写一个测试程序来创建地址卡、设置其值并显示它。\n\n**程序 15.8 测试程序**\n\n```objc\n#import\
  \ \"AddressCard.h\"\n#import <Foundation/NSAutleasePool.h>\n\nint main (int argc,\
  \ char *argv[])\n{\n  NSAutleasePool * pool = [[NSAutleasePool alloc] init];\n \
  \ NSString  *aName = @\"Julia Kochan\";\n  NSString  *aEmail = @\"jewls337@axlc.com\"\
  ;\n  AddressCard  *card1 = [[AddressCard alloc] init];\n  [card1 setName: aName];\n\
  \  [card1 setEmail: aEmail];\n  [card1 print];\n  [card1 release];\n  [pool drain];\n\
  \  return 0;\n}\n```\n\n**程序 15.8 输出**\n\n```\n===================================\n\
  |                              |\n| Julia Kochan                  |\n| jewls337@axlc.com\
  \             |\n|                              |\n===================================\n\
  ```\n\n\n\n\n\n这些是新的 `setName:` 和 `setEmail:` 方法，它们确保我们有一个能够正确处理内存管理的类：\n\n```objectivec\n\
  -(void) setName: (NSString *) theName\n{\n   if (name != theName) {\n      [name\
  \ release];\n      name = [[NSString alloc] initWithString: theName];\n   }\n}\n\
  \n-(void) setEmail: (NSString *) theEmail\n{\n   if (email != theEmail) {\n    \
  \  [email release];\n      email = [[NSString alloc] initWithString: theEmail];\n\
  \   }\n}\n```\n\n你可以向 `nil` 对象发送消息；因此，消息表达式\n\n```\n[name release];\n```\n\n和\n\n\
  ```\n[email release];\n```\n\n即使 `name` 或 `email` 之前没有被设置过，这些表达式也是安全的。设置 `if` 测试是为了防止有人向\
  \ setter 传递了已经存储在实例变量中的相同对象。该测试防止了对象在被 `initWithString:` 方法使用之前，可能被 `release` 方法销毁。如果传入的对象与存储的对象相同，我们就不需要进行任何操作了。\n\
  \n## 合成的的 `AddressCard` 方法\n\n现在我们已经讨论了编写访问器方法 `setName:` 和 `setEmail:` 的正确方法，并且你理解了这些重要的原则，我们可以返回让系统为你生成访问器方法。考虑\
  \ `AddressCard` 接口文件的第二个版本：\n\n```objectivec\n#import <Foundation/Foundation.h>\n\
  \n@interface AddressCard: NSObject\n{\n   NSString     *name;\n   NSString     *email;\n\
  }\n\n@property (copy, nonatomic) NSString *name, *email;\n-(void) print;\n@end\n\
  ```\n\n`@property (copy, nonatomic) NSString *name, *email;` 这一行列出了属性的 `copy` 和\
  \ `nonatomic` 属性。`copy` 属性表示在 setter 方法中创建实例变量的副本，就像在你编写的版本中做的那样。默认操作是不创建副本，而是执行简单的赋值（那是默认属性\
  \ `assign`），正如我们最近讨论的，在这种情况下这是不正确的方法。\n\n`nonatomic` 属性指定 getter 方法在返回其值之前不要 `retain`\
  \ 或 `autorelease` 实例变量。`第 18 章`更详细地讨论了这一话题。\n\n`Program 15.9` 是新的 AddressCard 实现文件，它指定访问器方法要被合成。\n\
  \n**Program 15.9. 实现文件 AddressCard.m 带有合成方法**\n\n```objectivec\n#import \"AddressCard.h\"\
  \n\n@implementation AddressCard\n\n@synthesize name, email;\n\n-(void) print\n{\n\
  \    NSLog (@\"===================================\");\n    NSLog (@\"|        \
  \                       |\");\n    NSLog (@\"|  %-31s |\", [name UTF8String]);\n\
  \    NSLog (@\"|  %-31s |\", [email UTF8String]);\n    NSLog (@\"|             \
  \                  |\");\n    NSLog (@\"|                               |\");\n\
  \    NSLog (@\"|                               |\");\n    NSLog (@\"|          O\
  \            O        |\");\n    NSLog (@\"===================================\"\
  );\n}\n@end\n```\n\n现在为你的 `AddressCard` 类添加另一个方法。你可能想通过一次调用同时设置卡片的名称和电子邮件字段。要做到这一点，添加一个新方法\
  \ `setName:andEmail:`。新方法看起来如下：\n\n```objectivec\n-(void) setName: (NSString *)\
  \ theName andEmail:(NSString *) theEmail\n{\n   self.name = theName;\n   self.email\
  \ = theEmail;\n}\n```\n\n回想起编写 `self.name = theName` 等同于编写 `[self setName:theName]`，因此它使用了实例变量的\
  \ setter 方法。相比之下，编写 `name = theName` 则会绕过 setter 将参数的值赋值给实例变量。通过依赖合成的 setter 来设置合适的实例变量（而不是在方法内部直接设置它们），你增加了一层抽象，因此使程序稍微独立于其数据结构。你还利用了合成属性的属性，在一种种情况下，它将值拷贝到实例变量中。`Program\
  \ 15.9` 测试了你的新方法。\n\n**Program 15.9. 测试**\n\n```objectivec\n#import \"AddressCard.h\"\
  \nint main (int argc, char *argv[])\n{\n   NSAutleasePool * pool = [[NSAutleasePool\
  \ alloc] init];\n   NSString *aName = @\"Julia Cochan\";\n   NSString *aEmail =\
  \ @\"jew337@axlc.com\";\n   NSString *bName = @\"Tony Iannino\";\n   NSString *bEmail\
  \ = @\"tony.iannino@techfitness.com\";\n   AddressCard *card1 = [[AddressCard alloc]\
  \ init];\n   AddressCard *card2 = [[AddressCard alloc] init];\n   [card1 setName:aName\
  \ andEmail:aEmail];\n   [card2 setName:bName andEmail:bEmail];\n   [card1 print];\n\
  \   [card2 print];\n   [card1 release];\n   [card2 release];\n   [pool drain];\n\
  \   return 0;\n}\n```\n\n**Program 15.9. 输出**\n\n```\n===================================\n\
  |          Julia Cochan           |\n|      jew337@axlc.com         |\n|       \
  \                        |\n|                               |\n|          O    \
  \        O        |\n===================================\n===================================\n\
  |                               |\n|          Tony Iannino          |\n| tony.iannino@techfitness.com```\n\
  \n## `AddressBook` 类\n\n你的 `AddressCard` 类看起来已经工作了。如果你想处理大量的 `AddressCard` 呢？收集它们是合理的，这正是我们将通过定义一个新的\
  \ `AddressBook` 类来实现的。`AddressBook` 类将存储名称和 `AddressCard` 集合。在开始，你将想要创建一个新的书籍，添加卡片。以后，你将想要搜索书籍、删除条目、排序甚至创建一个它的副本。让我们从一个简单的接口文件开始（参见\
  \ `Program 15.10`）。\n\n**Program 15.10. AddressBook.h**\n\n```objectivec\n#import\
  \ <Foundation/Foundation.h>\n#import \"AddressCard.h\"\n\n@interface AddressBook:\
  \ NSObject\n{\n   NSString *bookName;\n   NSMutableArray *book;\n}\n\n-(id) initWith:(NSString\
  \ *) name;\n-(void) addCard:(AddressCard *) theCard;\n-(int) entries;\n-(void) list;\n\
  -(void) dealloc;\n\n@end\n```\n\n`initWith:` 方法初始化存储卡片的数组并书籍名称，而 `addCard:` 方法将\
  \ `AddressCard` 添加到书中。`entries` 方法报告书中卡片的数量，而 `list` 方法提供其内容的简洁列出。`Program 15.10`\
  \ 显示了你的 `AddressBook` 类的实现文件。\n\n**Program 15.10. AddressBook.m**\n\n```objectivec\n\
  #import \"AddressBook.h\"\n\n@implementation AddressBook\n\n// 设置 AddressBook 的名称和空的书籍\n\
  -(id) initWith:(NSString *) name\n{\n   self = [super init];\n   if (self) {\n \
  \     bookName = [[NSString alloc] initWithString: name];\n      book = [[NSMutableArray\
  \ alloc] init];\n   }\n   return self;\n}\n\n-(id) init\n{\n   return [self initWithName:@\"\
  NoName\"];\n}\n\n-(void) addCard:(AddressCard *) theCard\n{\n   [book addObject:\
  \ theCard];\n}\n\n-(int) entries\n{\n   return [book count];\n}\n\n-(void) list\n\
  {\n   NSLog (@\"======== Contents of: %@ =========\", bookName);\n   for ( AddressCard\
  \ *theCard in book )\n      NSLog (@\"%-20s    %-32s\", [theCard.name UTF8String],\
  \ [theCard.email UTF8String]);\n}\n\n@end\n```\n\n\n\n\n\n```objectivec\nNSLog (@\"\
  ==================================================\");\n}\n\n-(void) dealloc {\n\
  \    [bookName release];\n    [book release];\n    [super dealloc];\n}\n\n@end\n\
  ```\n\n`initWithName:` 方法首先调用父类的 `init` 方法来执行初始化。接下来，它会创建一个字符串对象（使用 `alloc` 使其拥有该对象），并将其设置为作为\
  \ `name` 传入的地址簿名称。随后，它分配并初始化了一个空的可变数组，并将其存储在实例变量 `book` 中。\n\n你将 `initWithName:`\
  \ 定义为返回一个 `id` 对象，而不是 `AddressBook` 对象。如果 `AddressBook` 被子类化，那么 `initWithName:`\
  \ 消息的接收者（因此也包括返回值）就不再是一个 `AddressBook` 对象；它的类型是子类的类型。正由于这个原因，你将返回类型定义为一种通用对象类型。\n\
  \n请注意，在 `initWithName:` 中，你通过使用 `alloc` 获取了 `bookName` 和 `book` 实例变量的所有权。例如，如果你使用\
  \ `NSMutableArray array` 方法为 `book` 创建数组，如下所示：\n\n```objectivec\nbook = [NSMutableArray\
  \ array];\n```\n\n你仍然不是 `book` 数组的所有者；它会被自动释放（autoreleased），你需要对其进行 `retain` 才能保留它（这在第\
  \ 17 章中会有详细讨论）。\n\n我们在这里重写了 `init` 方法，以确保如果有人执行了 `alloc` 后接 `init`，他们仍然能够正确设置地址簿，尽管默认名称是“NoName”。因此，这里的\
  \ `initWithName:` 方法是我们的指定初始化器，我们希望确保 `init` 使用它。\n\n`addCard:` 方法接收作为参数的 `AddressCard`\
  \ 对象并将其添加到地址簿中。\n\n`count` 方法给出数组中的元素数量。`entries` 方法利用此返回地址簿中存储的地址卡片的数量。\n\n###\
  \ 快速枚举（Fast Enumeration）\n\n`list` 方法中的 `for` 循环显示了一个你之前未见过的结构：\n\n```objectivec\n\
  for ( AddressCard *theCard in book )\n    NSLog (@\"%-20s    %-32s\", [theCard.name\
  \ UTF8String],\n                  [theCard.email UTF8String]);\n```\n\n这使用了一种名为*快速枚举*（fast\
  \ enumeration）的技术来顺序遍历 `book` 数组中的每个元素。语法足够简单：你定义了一个变量来按顺序持有数组中的每个元素（`AddressCard\
  \ *theCard`）。紧接着是关键字 `in`，然后列出数组的名称。当 `for` 循环执行时，它会将数组中的第一个元素赋值给指定的变量，然后执行循环体。接着它将数组中的第二个元素赋值给该变量并再次执行循环体。这个过程会持续进行，直到数组中的所有元素都赋值给变量，并且每个每个元素都执行了循环体。\n\
  \n注意，如果 `theCard` 之前已经被定义为 `AddressCard` 对象，那么 `for` 循环将变得更加简单：\n\n```objectivec\n\
  for ( theCard in book )\n    ...\n```\n\n程序 15.10 是你新定义的 `AddressBook` 类的测试程序。\n\
  \n**程序 15.10. 测试程序**\n\n```objectivec\n#import \"AddressBook.h\"\n\nint main (int\
  \ argc, char *argv[])\n{\n    NSAutoreleasePool * pool = [[NSAutoreleasePool alloc]\
  \ init];\n    NSString  *aName = @\"Julia Kochan\";\n    NSString  *aEmail = @\"\
  jewls337@axlc.com\";\n    NSString  *bName = @\"Tony Iannino\";\n    NSString  *bEmail\
  \ = @\"tony.iannino@techfitness.com\";\n    NSString  *cName = @\"Stephen Kochan\"\
  ;\n    NSString  *cEmail = @\"steve@classroomM.com\";\n    NSString  *dName = @\"\
  Jamie Baker\";\n    NSString  *dEmail = @\"jbaker@classroomM.com\";\n    AddressCard\
  \ *card1 = [[AddressCard alloc] init];\n    AddressCard *card2 = [[AddressCard alloc]\
  \ init];\n    AddressCard *card3 = [[AddressCard alloc] init];\n    AddressCard\
  \ *card4 = [[AddressCard alloc] init];\n\n    // 设置一个新的地址簿\n    AddressBook  *myBook\
  \ = [[AddressBook alloc]\n                         initWithName: @\"Linda's Address\
  \ Book\"];\n    NSLog (@\"Entries in address book after creation: %i\", [myBook\
  \ entries]);\n\n    // 现在设置地址卡\n    [card1 setName: aName andEmail: aEmail];\n \
  \   [card2 setName: bName andEmail: bEmail];\n    [card3 setName: cName andEmail:\
  \ cEmail];\n    [card4 setName: dName andEmail: dEmail];\n\n    // 将卡片添加到地址簿\n \
  \   [myBook addCard: card1];\n    [myBook addCard: card2];\n    [myBook addCard:\
  \ card3];\n    [myBook addCard: card4];\n    NSLog (@\"Entries in address book after\
  \ cards: %i\", [myBook entries]);\n\n    // 列出簿中所有的条目\n    [myBook list];\n    [card1\
  \ release];\n    [card2 release];\n    [card3 release];\n    [card4 release];\n\
  \    [myBook release];\n    [pool drain];\n    return 0;\n}\n```\n\n**程序 15.10 输出**\n\
  \n```\nEntries in address book after creation: 0\nEntries in address book after\
  \ cards: 4\n====================\nContents of Linda's Address Book\nJulia Kochan\
  \    jewls337@axlc.com\nTony Iannino    tony.iannino@techfitness.com\nStephen Kochan\
  \    steve@classroomM.com\nJamie Baker    jbaker@classroomM.com\n```\n\n程序创建了一个名为“Linda's\
  \ Address Book”的地址簿，然后设置了四个地址卡。这四个卡片通过 `addCard:` 方法添加到地址簿，`list` 方法用于列出地址簿完整内容。\n\
  \n### 在地址簿中查找某人\n\n当你有一个大型地址簿时，你不想每次都列出它的内容。因此，添加一个方法来执行查找是合理的。让我们把方法命名为 `lookup:`\
  \ 并让它接收名称作为参数，并在地址簿中查找匹配项（忽略大小写）。如果找到了，它将返回匹配的 `AddressCard` 条目；如果该名称没有出现在地址簿中，它将返回\
  \ `nil`。\n\n这里是我们新的 `lookup:` 方法：\n\n```objectivec\n// 按姓名查找 -- 假设忽略大小写匹配\n-(AddressCard\
  \ *) lookup: (NSString *) theName\n{\n    for ( AddressCard *theCard in book )\n\
  \        if ( [theCard.name caseInsensitiveCompare:theName] == NSOrderedSame )\n\
  \            return theCard;\n    return nil;\n}\n```\n\n如果你将方法的声明放在接口文件中，并将定义放在实现文件中，你可以编写一个测试程序来尝试你的新方法。程序\
  \ 15.11 展示了这样一个程序，紧接着是它的输出。\n\n**程序 15.11. 测试程序**\n\n（此处代码已在上方 15.10 示例中类似，为保持简洁，不再重复完整代码块，但逻辑一致）\n\
  \n**输出：**\n\n```\nStephen Kochan\nsteve@classroomM.com\n```\n\n\n\n\n\n```objective-c\n\
  \    NSLog (@\"Haibo Zhang\");\n\n    myCard = [myBook lookup: @\"Haibo Zhang\"\
  ];\n\n    if (myCard != nil)\n      [myCard print];\n    else\n      NSLog (@\"\
  Not found!\");\n\n    [card1 release];\n    [card2 release];\n    [card3 release];\n\
  \    [card4 release];\n    [myBook release];\n    [pool drain];\n\n    return 0;\n\
  }\n```\n\n* * *\n\n### 程序 15.11. 输出\n\n* * *\n\n查找: Stephen Kochan\n\n====================================\n\
  |                                |\n| Stephen Kochan                |\n| steve@classroomM.com\
  \           |\n|                                |\n|                           \
  \     |\n|                                |\n|       O        O                |\n\
  ====================================\n查找: Haibo Zhang\nNot found!\n\n* * *\n\n当\
  \ `lookup:` 方法在地址录中找到 Stephen Kochan 时（利用了不区分大小写的匹配特性），该方法通过执行 `return` 语句立即返回匹配的卡片，这终止了循环并返回\
  \ `nextCard` 的值。然后，该匹配的卡片被交给 `AddressCard` 的 `print` 方法进行显示。在第二次查找中，没有找到名字为 Haibo\
  \ Zhang。\n\n这个 `lookup:` 方法非常原始，因为它需要找到整个名称的精确匹配。更好的方法是执行部分匹配并能够处理多个匹配项。例如，以下消息表达式\n\
  \n```objective-c\n[myBook lookup: @\"steve\"]\n```\n\n可以匹配到“Steve Kochan”、“Fred\
  \ Stevens”和“steven levy”的条目。因为可能存在多个匹配项，很好的方法可能是创建一个包含所有匹配项的数组，并将该数组返回给方法的调用者（参见本章末的练习\
  \ 2），如下所示：\n\n```objective-c\nmatches = [myBook lookup: @\"steve\"];\n```\n\n###\
  \ 从地址录中删除某人\n\n任何允许你添加条目的地址录管理器，若不具备删除条目的功能，都是不完整的。你可以制作一个 `removeCard:` 方法来从地址录中删除特定的\
  \ `AddressCard`。另一种可能性是创建一个 `remove:` 方法，根据姓名删除某人（参见本章末的练习 6）。\n\n由于你对接口文件进行了一些更改，程序\
  \ 15.12 再次显示了带有新 `removeCard:` 方法的代码。其后是你新方法的实现代码。\n\n#### 程序 15.12. Addressbook.h\
  \ 接口文件\n\n* * *\n\n```objective-c\n#import \"AddressCard.h\"\n\n@interface AddressBook:\
  \ NSObject\n{\n    NSString        *bookName;\n    NSMutableArray  *book;\n}\n\n\
  -(id) initWithName: (NSString *) name;\n-(void) addCard: (AddressCard *) theCard;\n\
  -(void) removeCard: (AddressCard *) theCard;\n-(AddressCard *) lookup: (NSString\
  \ *) theName;\n-(int) entries;\n-(void) list;\n@end\n```\n\n* * *\n\n这里是新的 `removeCard:`\
  \ 方法：\n\n```objective-c\n-(void) removeCard: (AddressCard *) theCard\n{\n    [book\
  \ removeObjectIdentical: theCard];\n}\n```\n\n关于什么被视为相同对象，我们使用的是“完全相同的对象”的概念，即在内存中具有相同位置的对象。因此，`removeObjectIdentical:`\
  \ 不认为包含相同信息但位于不同位置的两个地址卡（如果你复制了 `AddressCard` 则可能会发生）是相同的。顺便提一下，`removeObjectIdentical:`\
  \ 会移除与其参数相同的所有对象。然而，如果你的数组中有多个相同对象的副本，这就会成为问题。\n\n你可以通过 `removeObject:` 方法让你的处理相等对象的方法变得更复杂，然后使用你自己的\
  \ `isEqual:` 方法来测试两个对象是否相等。如果你使用 `removeObject:`，系统会自动为数组中的每个元素调用 `isEqual:` 方法，并提供两个元素进行比较。在这种情况下，由于你的地址录包含\
  \ `AddressCard` 对象作为元素，你必须为该类添加一个 `isEqual:` 方法（你将重写该类继承自 `NSObject` 的方法）。该方法可以自己决定如何判断相等。比较两个名字和邮箱是有意义的。如果两者都相等，你可以从方法返回\
  \ `YES`；否则，你可以返回 `NO`。你的方法可能像这样：\n\n```objective-c\n-(BOOL) isEqual: (AddressCard\
  \ *) theCard\n{\n    if ([name isEqualToString theCard.name] == YES && [email isEqualToString\
  \ theCard.email] == YES)\n      return YES;\n    else\n      return NO;\n}\n```\n\
  \n注意，其他 `NSArray` 方法，如 `containsObject:` 和 `indexOfObject:`，也依赖于这种 `isEqual:` 策略来确定对象是否被相等。程序\
  \ 15.12 测试了 `removeCard:` 方法。\n\n#### 程序 15.12. 测试程序\n\n* * *\n\n```objective-c\n\
  #import \"AddressBook.h\"\n\nint main (int argc, char *argv[])\n{\n    NSAutleasePool\
  \ * pool = [[NSAutleasePool alloc] init];\n    AddressCard *myCard;\n    NSString\
  \ *aName = @\"Julia Kochan\";\n    NSString *aEmail = @\"jewls37@axlc.com\";\n \
  \   NSString *bName = @\"Tony Iannino\";\n    NSString *bEmail = @\"tony.iannino@techfitness.com\"\
  ;\n    NSString *cName = @\"Stephen Kochan\";\n    NSString *cEmail = @\"steve@classroomM.com\"\
  ;\n    NSString *dName = @\"Jamie Baker\";\n    NSString *dEmail = @\"jbaker@classroomM.com\"\
  ;\n    AddressCard *card1 = [[AddressCard alloc] init];\n    AddressCard *card2\
  \ = [[AddressCard alloc] init];\n    AddressCard *card3 = [[AddressCard alloc] init];\n\
  \    AddressCard *card4 = [[AddressCard alloc] init];\n    AddressBook *myBook =\
  \ [[AddressBook alloc]\n                          initWithName: @\"Linda's Book\"\
  ];\n    // Now set up four address cards\n    [card1 setName: aName andEmail: aEmail];\n\
  \    [card2 setName: bName andEmail: bEmail];\n    [card3 setName: cName andEmail:\
  \ cEmail];\n    [card4 setName: dName andEmail: dEmail];\n    // Add some cards\
  \ to the address book\n    [myBook addCard: card1];\n    [myBook addCard: card2];\n\
  \    [myBook addCard: card3];\n    [myBook addCard: card4];\n    // Look up a person\
  \ by name\n    NSLog (@\"Lookup: Stephen Kochan\");\n    myCard = [myBook lookup:\
  \ @\"Stephen Kochan\"];\n    if (myCard != nil)\n      [myCard print];\n    else\n\
  \      NSLog (@\"Not found!\");\n    // Now remove the entry from the phone book\n\
  \    [myBook removeCard: myCard];\n    [myBook list];   // verify it's gone\n  \
  \  [card1 release];\n    [card2 release];\n    [card3 release];\n    [card4 release];\n\
  \    [myBook release];\n    [pool drain];\n    return 0;\n}\n```\n\n\n\n\n如果你的通讯录中包含大量条目，按字母顺序排序可能会非常方便。你可以通过为你的\
  \ `AddressBook` 类添加一个 `sort` 方法，并利用名为 `sortUsingSelector:` 的 `NSMutableArray` 方法来轻松实现这一点。该方法的参数是一个选择器，`sortUsingSelector:`\
  \ 方法使用该选择器来比较两个元素。数组可以包含任何类型的对象，因此实现泛型排序方法的唯一方法是你来决定数组中的元素是否有序。要做到这一点，你必须添加一个方法来比较数组中的两个元素。该方法返回的结果类型应为\
  \ `NSComparisonResult`。如所述，如果你希望排序方法将数组中的第一个元素放在第二个元素之前，则应返回 `NSOrderedAscending`；如果两个元素被认为相等，则返回\
  \ `NSOrderedSame`；如果第一个元素在排序后的数组中应该在第二个元素之后，则返回 `NSOrderedDescending`。\n\n首先，这是你的\
  \ `AddressBook` 类中新增的 `sort` 方法：\n\n```objc\n-(void) sort\n{\n    [book sortUsingSelector:\
  \ @selector(compareNames:)];\n}\n```\n\n正如你在第 9 章“多态、动态类型和动态绑定”中所学习的，表达式\n\n`@selector\
  \ (compareNames:)` 根据指定的方法名创建一个类型为 `SEL` 的选择器；这是 `sortUsingSelector:` 方法在比较数组中两个元素时使用的选择器。当它需要进行此类比较时，它会调用指定的方法，向数组中的第一个元素（接收者）发送消息，以与它的参数进行比较。返回的值应该如之前所述，类型应为\
  \ `NSComparisonResult`。\n\n由于你通讯录中的元素是 `AddressCard` 对象，因此比较方法必须添加到 `AddressCard`\
  \ 类中（确保你完全理解了这一点）。你必须回到你的 `AddressCard` 类并为其添加一个 `compareNames:` 方法。显示如下：\n\n```objc\n\
  // 比较指定地址卡片中的两个名称\n-(NSComparisonResult) compareNames: (id) element\n{\n    return\
  \ [name compare: [element name]];\n}\n```\n\n由于你正在对通讯录中的两个名称进行字符串比较，你可以使用 `NSString\
  \ compare:` 方法来替你完成工作。\n\n如果你在 `AddressBook` 类中添加了 `sort` 方法并在 `AddressCard` 类中添加了\
  \ `compareNames:` 方法，你就可以编写一个测试程序来对其测试。\n\n#### 程序 15.13. 测试程序\n\n```objc\n#import\
  \ \"AddressBook.h\"\n\nint main (int argc, char *argv[])\n{\n    NSAutoreleasePool\
  \ * pool = [[NSAutoreleasePool alloc] init];\n    NSString  *aName = @\"Julia Kochan\"\
  ;\n    NSString  *aEmail = @\"jewls337@axlc.com\";\n    NSString  *bName = @\"Tony\
  \ Iannino\";\n    NSString  *bEmail = @\"tony.iannino@techfitness.com\";\n    NSString\
  \  *cName = @\"Stephen Kochan\";\n    NSString  *cEmail = @\"steve@classroomM.com\"\
  ;\n    NSString  *dName = @\"Jamie Baker\";\n    NSString  *dEmail = @\"jbaker@classroomM.com\"\
  ;\n    AddressCard  *card1 = [[AddressCard alloc] init];\n    AddressCard  *card2\
  \ = [[AddressCard alloc] init];\n    AddressCard  *card3 = [[AddressCard alloc]\
  \ init];\n    AddressCard  *card4 = [[AddressCard alloc] init];\n    AddressBook\
  \  *myBook = [AddressBook alloc];\n\n    // 首先设置四个地址卡片\n    [card1 setName: aName\
  \ andEmail: aEmail];\n    [card2 setName: bName andEmail: bEmail];\n    [card3 setName:\
  \ cName andEmail: cEmail];\n    [card4 setName: dName andEmail: dEmail];\n    myBook\
  \ = [myBook initWithName: @\"Linda's Address Book\"];\n\n    // 向通讯录中添加一些卡片\n  \
  \  [myBook addCard: card1];\n    [myBook addCard: card2];\n    [myBook addCard:\
  \ card3];\n    [myBook addCard: card4];\n\n    // 列出未排序的簿\n    [myBook list];\n\n\
  \    // 排序并再次列表\n    [myBook sort];\n    [myBook list];\n\n    [card1 release];\n\
  \    [card2 release];\n    [card3 release];\n    [card4 release];\n    [myBook release];\n\
  \    [pool drain];\n    return 0;\n}\n```\n\n#### 程序 15.13. 输出\n\n```\n========\
  \ Contents of Linda's Address Book =========\nJulia Kochan     jewls337@axlc.com\n\
  Tony Iannino     tony.iannino@techfitness.com\nStephen Kochan  steve@classroomM.com\n\
  Jamie Baker      jbaker@classroomM.com\n===================================\n========\
  \ Contents of Linda's Address Book =========\nJamie Baker      jbaker@classroomM.com\n\
  Julia Kochan     jewls337@axlc.com\nStephen Kochan  steve@classroomM.com\nTony Iannino\
  \     tony.iannino@techfitness.com\n===================================\n```\n\n\
  注意，排序是升序的。然而，你可以通过修改 `AddressCard` 类中的 `compareNames:` 方法来反转返回的值，从而轻松执行降序排序。\n\n\
  ##### 使用 Blocks 排序\n\n`NSArray` 和 `NSMutableArray` 类中存在以 block 作为参数的排序方法。\n\n`NSArray`\
  \ 方法接受 block 作为参数的通用格式如下：\n\n`(NSArray *)sortedArrayUsingComparator:(NSComparator)block`\n\
  \n而 `NSMutableArray` 方法原地进行排序，格式如下：\n\n`(void)sortUsingComparator:(NSComparator)block`\n\
  \n`NSComparator` 在系统文件中的定义方式如下：\n\n`typedef NSComparisonResult (*NSComparator)(id\
  \ obj1, id obj2);`\n\n翻译成英文，`NSComparator` 是一个接受两个对象作为参数并返回 `NSComparisonResult`\
  \ 类型的 block。它指示第一个对象被认为小于、相等还是大于第二个对象。这与使用选择器的非 block 方法是一致的。\n\n我们提供的 `sortUsingComparator:`\
  \ 方法的 block 可以调用我们的 `compareNames:` 方法：\n\n```objc\n-(void) sort\n{\n    [book sortUsingComparator:\n\
  \    ^(id obj1, id obj2) {\n        return [obj1 compareNames:obj2];\n    }];\n\
  }\n```\n\n这种方法可行，但考虑到，它不会提供任何性能提升，因为我们的 block 调用了相同的 `compareNames:` 方法。所以，更好的方法是在\
  \ block 内部完成所有工作；这有助于提高速度：\n\n```objc\n-(void) sort\n{\n    [book sortUsingComparator:\n\
  \    ^(id obj1, id obj2) {\n        return [[obj1 name] compare: [obj2 name]];\n\
  \    }];\n}\n```\n\n\n\n\n# 表 15.5 常见的 `NSMutableArray` 方法\n\n![image](img/15tab05.jpg)\n\
  \n在表 15.4 和 15.5 中，`obj`、`obj1` 和 `obj2` 是任意对象；`i` 是一个 `NSUInteger` 整数，表示数组的有效索引值；`selector`\
  \ 是类型为 `SEL` 的选择器对象；`size` 是一个 `NSUInteger` 整数。\n\n## `NSValue` 类\n\n正如我们所看到的，像数组这样的\
  \ Foundation 集合只能存储对象。这意味着你不能在它们内部存储如 `int` 这样的基础数据类型。为了解决这个问题，你需要创建 `NSNumber`\
  \ 对象的数组，而不是 `int` 数组。\n\n当你开始开发 iOS 应用程序时，还会遇到其他想要存储集合中的类型。这些类型是结构体（structures），它们是\
  \ C 语言中的派生数据类型，而不是对象。例如，你将使用 `CGPoint`（一个通过 `typedef` 定义的名称）在应用程序中定义 (x, y) 坐标。这就是你如何指定矩形起点的方法。事实上，矩形是一个\
  \ `CGRect` 类型，它本身是一个包含两个其他结构的结构：定义矩形起点的 `CGPoint` 结构，以及定义其宽度和高度的 `CGSize` 结构。\n\n\
  这里讨论的重点在于让你注意，这些是在你可能想要存储在集合中的结构体。你不能直接这样做。`NSValue` 类的出现解决了这个问题，它允许将这些结构体之一转换为对象，从而允许你将其存储在集合内部。将结构体等数据类型转换为对象的过程有时被称为*包装*（wrapping*）。正如你所预期的，获取对象并提取其底层数据类型的逆向过程通常被称为*解包*（unwrapping*）。\n\
  \n表 15.6 显示了一些将 C 数据类型转换为对象的包装方法，以及相应的解包逆向方法。有关更多信息，请参阅 `NSValue` 类的文档。\n\n### 表\
  \ 15.6 一些 `NSValue` 包装和解包方法\n\n![image](img/15tab06.jpg)\n\n这里有一个代码片段，获取一个 `CGPoint`\
  \ 结构并将其添加到名为 `touchPoints` 的可变数组中：\n\n```objc\nCGPoint  myPoint;\nNSValue  *pointObj;\n\
  NSMutableArray *touchPoints = [NSMutableArray array];\n\n   ...\nmyPoint.x = 100;\
  \      //将点设置为 (100, 200)\nmyPoint.y = 200;\n   ...\npointObj = [NSValue valueWithPoint:\
  \ myPoint];  // 将其转换为对象\n[touchPoints addObject: pointObj];\n```\n\n请确保你意识到这样做必要性。由于\
  \ `myPoint` 是一个结构，你不能直接将其存储在 `touchPoints` 数组中。因此你必须先将其转换为对象。我们使用 `valueWithPoint:`\
  \ 方法来完成此。\n\n如果你随后想从 `touchPoints` 数组中获取最后一个点并将其转换回 `CGPoint` 结构，这一行代码就能起作用：\n\n\
  ```objc\nmyPoint = [[touchPoints lastObject] pointValue];\n```\n\n### 字典对象\n\n字典是一个由键值对（key-object\
  \ pairs）组成的数据集合。就像你在字典中查找单词定义一样，你通过键从 Objective-C 字典中获取值（对象）。字典中的键必须是唯一的，它们可以是任何对象类型，尽管它们通常是字符串。与键关联的值也可以是任何对象类型，但不能为\
  \ nil。\n\n字典可以是可变的或不可变的；可变的字典可以动态添加和删除条目。可以根据特定的键搜索字典，并对其内容进行枚举。程序 15.14\n{\n  \
  \ NSAutoreleasePool  * pool = [[NSAutoreleasePool alloc] init];\n   NSMutableDictionary\
  \ *glossary = [NSMutableDictionary dictionary];\n\n   // 在词表中存储三个条目\n   [glossary\
  \ setObject: @\"A class defined so other classes can inherit from it\"\n       \
  \              forKey: @\"abstract class\"];\n   [glossary setObject: @\"To implement\
  \ all the methods defined in a protocol\"\n                     forKey: @\"adopt\"\
  ];\n   [glossary setObject: @\"Storing an object for later use\"\n             \
  \    forKey: @\"archiving\"];\n\n   // 获取并显示\n   NSLog (@\"abstract class: %@\"\
  , [glossary objectForKey: @\"abstract class\"]);\n   NSLog (@\"adopt: %@\", [glossary\
  \ objectForKey: @\"adopt\"]);\n   NSLog (@\"archiving: %@\", [glossary objectForKey:\
  \ @\"archiving\"]);\n\n   [pool drain];\n   return 0;\n}\n```\n\n#### 程序 15.14 输出\n\
  \nabstract class: A class defined so other classes can inherit from it\nadopt: To\
  \ implement all the methods defined in a protocol\narchiving: Storing an object\
  \ for later use\n\n表达式 `[NSMutableDictionary dictionary]` 创建了一个空的可变字典。你可以使用 `setObject:forKey:`\
  \ 方法向字典添加键值对。在构建字典后，可以使用 `objectForKey:` 方法获取给定的键。程序 15.14 展示了如何获取这些条目。\n\n### 枚举字典\n\
  \n程序 15.15 阐了如何使用 `dictionaryWithObjects:` 方法使用初始键值对定义字典。创建一个不可变字典，程序还展示了如何使用快速枚举循环获取每一个项。\n\
  \n```objc\n#import <Foundation/Foundation.h>\n\nint main (int argc, char *argv[])\n\
  {\n   NSAutoreleasePool  * pool = [[NSAutoreleasePool alloc] init];\n   NSDictionary\
  \ *glossary = [NSDictionary dictionaryWithObjectsAndKeys:\n      @\"A class defined\
  \ so other classes can inherit from it\",\n      @\"abstract class\",\n      @\"\
  To implement all the methods defined in a protocol\",\n      @\"adopt\",\n     \
  \ @\"Storing an object for later use\",\n      @\"archiving\",\n      nil];\n\n\
  \   // 打印字典的所有键值对\n   for ( NSString *key in glossary )\n      NSLog (@\"%@: %@\"\
  , key, [glossary objectForKey: key]);\n\n   [pool drain];\n   return 0;\n}\n```\n\
  \n#### 程序 15.15 输出\n\nabstract class: A class defined so other classes can inherit\
  \ from it\nadopt: To implement all the methods defined in a protocol\narchiving:\
  \ Storing an object for later use\n\n`dictionaryWithObjects:` 的参数是一个对象-键对列表（是的，按此顺序），每对对之间用逗号分隔。列表必须以特殊的\
  \ `nil` 对象结束。在程序创建字典后，它设置了一个循环来枚举其内容。正如提到的，键是从字典中依次获取的，没有特殊顺序。\n\n\n\n\n如果你想按字母顺序显示字典的内容，可以从字典中获取所有的键，对它们进行排序，然后按照这些排序后的键顺序从字典获取每个对应的值。你可以先使用\
  \ `NSDIctionary` 的 `allKeys` 方法将字典中的所有键提取到数组中，然后对该数组进行排序。接下来，你可以枚举这个排序后的键数组，并从字典中获取对应的值。例如，假设你有一个名为\
  \ `states` 的字典，其中包含美国各州的名称作为键，它们对应的首都是值。以下代码段将按字母顺序显示每个州名及其对应的首都是：\n\n```objc\n\
  NSArray *keys = [states allKeys];\n\nkeys = [keys sortedArrayUsingComparator:\n\
  \        ^(id obj1, id obj2) {\n            return [obj1 compare: obj2];\n    }];\n\
  \nfor (NSString *aState in keys)\n    NSLog (@\"State: %@  Capital: %@\", aState,\
  \ [states objectForKey: aState]);\n```\n\n我们在这里刚刚展示了字典的一些基本操作。表 15.7 和 15.8 分别总结了处理不可变字典和可变字典的一些常用方法。由于\
  \ `NSMutableDictionary` 是 `NSDictionary` 的子集，它继承了它的方法。\n\n**表 15.7。常用的 `NSDictionary`\
  \ 方法**\n\n![image](img/15tab07.jpg)\n\n**表 15.8。常用的 `NSMutableDictionary` 方法**\n\
  \n![image](img/15tab08.jpg)\n\n在表 15.7 和 15.8 中，`key`、`key1`、`key2`、`obj`、`obj1`和`obj2`是任意对象，而\
  \ `size` 是一个 `NSUInteger` 无符号整数。\n\n### 集合对象\n\n一个集合是唯一对象的集合，它可以是可变的也可以是不可变的。操作包括包括搜索、添加和删除成员（对于可变集合）；比较两个集合；以及找到两个集合的交集和并集。\n\
  \n在本节中，我们将快速查看三个集合类：`NSSet`、`NSMutableSet`和`NSIndexSet`。我们还会顺带提一下 `NSCountedSet`\
  \ 类，这样你就能知道什么时候可能需要或想要使用该集合。\n\n程序 15.16 展示了集合的一些基本操作。假设你想在程序执行期间多次显示你的集合内容。因此，你决定创建一个名为\
  \ `print` 的新方法。你通过创建一个名为 `Printing` 的新分类，将 `print` 方法添加到 `NSSet` 类中。由于 `NSMutableSet`\
  \ 是 `NSSet` 的子类，因此可变集合也可以使用这个新的 `print` 方法。\n\n**程序 15.16**\n\n```objc\n#import\
  \ <Foundation/Foundation.h>\n\n// 创建一个整数对象\n#define INTOBJ(v) [NSNumber numberWithInteger:\
  \ v]\n\n// 通过 Printing 分类为 NSSet 添加一个 print 方法\n\n@interface NSSet (Printing)\n\
  -(void) print;\n@end\n\n@implementation NSSet (Printing)\n\n-(void) print {\n  \
  \  printf (\"{\");\n    for (NSNumber *element in self)\n        printf (\" %li\
  \ \", (long) [element integerValue]);\n    printf (\"}\\n\");\n}\n@end\n\nint main\
  \ (int argc, char *argv[])\n{\n    NSAutoreleasePool  pool = [[NSAutoreleasePool\
  \ alloc] init];\n    NSMutableSet *set1 = [NSMutableSet setWithObjects:\n      \
  \      INTOBJ(1), INTOBJ(3), INTOBJ(5), INTOBJ(10), nil];\n    NSSet *set2 = [NSSet\
  \ setWithObjects:\n            INTOBJ(-5), INTOBJ(100), INTOBJ(3), INTOBJ(5), nil];\n\
  \    NSSet *set3 = [NSSet setWithObjects:\n            INTOBJ(12), INTOBJ(200),\
  \ INTOBJ(3), nil];\n    NSLog (@\"set1: \");\n    [set1 print];\n    NSLog (@\"\
  set2: \");\n    [set2 print];\n    // 等值测试\n    if ([set1 isEqualToSet: set2] ==\
  \ YES)\n        NSLog (@\"set1 equals set2\");\n    else\n        NSLog (@\"set1\
  \ is not equal to set2\");\n    // 成员性测试\n    if ([set1 containsObject: INTOBJ(10)]\
  \ == YES)\n        NSLog (@\"set1 contains 10\");\n    else\n        NSLog (@\"\
  set1 does not contain 10\");\n    if ([set2 containsObject: INTOBJ(10)] == YES)\n\
  \        NSLog (@\"set2 contains 10\");\n    else\n        NSLog (@\"set2 does not\
  \ contain 10\");\n    // 从可变集合 1 中添加和移除对象\n    [set1 addObject:INTOBJ(4)];\n   \
  \ [set1 removeObject:INTOBJ(10)];\n    NSLog (@\"set1 after adding 4 and removing\
  \ 10: \");\n    [set1 print];\n    // 获取两个集合的交集\n    [set1 intersectSet: set2];\n\
  \    NSLog (@\"set1 intersect set2: \");\n    [set1 print];\n    // 两个集合的并集\n  \
  \  [set1 unionSet: set3];\n    NSLog (@\"set1 union set3: \");\n    [set1 print];\n\
  \    [pool drain];\n    return 0;\n}\n```\n\n**程序 15.16 输出**\n\n```\nset1: { 1 3\
  \ 5 10 }\nset2: { -5 100 3 5 }\nset1 is not equal to set2\nset1 contains 10\nset2\
  \ contains 5\nset1 after adding 4 and removing 10: { 3 5 }\nset1 intersect set2:\
  \ { 3 5 }\nset1 union set3: { 1 3 5 10 12 200 }\n```\n\n\n\n让我们来看另一种类型的集合：`NSIndexSet`。此类用于存储指向某些其他数据结构（通常是数组）的有序索引。你可以使用该类，例如，从对象数组高效地生成一个索引数字列表，其中每个对象都满足你指定的某些标准。你需要注意的是，`NSIndexSet`\
  \ 类没有可变版本。\n\n例如，`NSArray` 的方法 `indexOfObjectsPassingTest:` 接受一个块（block）作为参数。该块会为数组中的每个元素执行一次，并传入数组元素、索引号以及一个指向\
  \ `BOOL` 变量的 `pointer`（指针）。块中的代码将推测会测试该元素是否符合某些标准，如果数组元素满足标准则返回 `YES`，如果不满足则返回 `NO`。即使该方法返回了\
  \ `YES`，它也会继续处理数组中的下一个元素，直到所有元素都处理完毕。你可以通过将 `BOOL` 指针引用的值设置为 `YES` 来随时停止处理。（关于指针的讨论，请参阅第\
  \ 13 章。）\n\n如果 `indexOfObjectsPassingTest:` 找到了匹配项（意味着你至少一次从块中返回了 `YES`），它将返回集合中最低的匹配索引。否则，如果没有找到匹配项，它将返回\
  \ `NSNotFound`。\n\n这里是 `AddressBook` 类中 `lookup:` 方法的一个修改版本。\n\n```objc\n-(AddressCard\
  \ *) lookup: (NSString *) theName\n{\n    NSUInteger result = [book indexOfObjectsPassingTest:\n\
  \      ^ (id obj, NSUInteger idx, BOOL *stop)\n      {\n          if ([[obj name]\
  \ caseInsensitiveCompare: theName] ==\n              NSOrderedSame) {\n        \
  \      *stop = YES;  // 找到了匹配项，一个足够了\n              return YES;\n          }\n \
  \         else\n              return NO;   // 继续查找\n    }];\n    // 检查是否找到了匹配项\n\
  \    if (result != NSNotFound) // 应该只有一个元素\n        return [book objectAtIndex:\
  \ result];\n    else\n        return nil;\n}\n```\n\n如果你想找到数组中的所有匹配项，可以在块内部将每个匹配项存储在一个内部数组中，并且永远不要将\
  \ `stop` 指针设置为 `YES`。这样，`indexOfObjectsPassingTest:` 方法就会检查数组中的所有元素。此类方法可能如下所示：\n\
  \n```objc\n-(NSMutableArray *) lookupAll: (NSString *) theName\n{\n    NSMutableArray\
  \ *matches = [NSMutableArray array];\n    NSIndexSet *result = [book indexOfObjectsPassingTest:\n\
  \      ^ (id obj, NSUInteger idx, BOOL *stop)\n        {\n          if ([[obj name]\
  \ caseInsensitiveCompare: theName] ==\n              NSOrderedSame) {\n        \
  \      [matches addObject: obj];\n              return YES;\n          }\n     \
  \     else\n              return NO;\n    }];\n    // 检查是否找到了匹配项\n    if ([matches\
  \ count])\n        return matches;\n    else\n        return nil;\n}\n```\n\n如果你在从数组中寻找多个匹配项，也可以使用\
  \ `indexesOfPassingTest:` 方法。该方法返回一个 `NSIndexSet`，包含数组中所有符合标准的元素索引。下面的版本使用了这个新方法来查找并返回所有匹配卡片的索引。\n\
  \n```objc\n-(NSIndexSet *) lookupAll: (NSString *) theName\n{\n    NSIndexSet *result\
  \ = [book indexOfObjectsPassingTest:\n      ^ (id obj, NSUInteger idx, BOOL *stop)\n\
  \      {\n        if ([[obj name] caseInsensitiveCompare: theName] ==\n        \
  \    NSOrderedSame) {\n            return YES;  // 找到了匹配项，继续进行\n        }\n    \
  \    else\n            return NO;  // 继续查找\n    }];\n    // 返回结果\n    return result;\n\
  }\n```\n\n这里留给你一个练习：将 `lookupAll:` 方法的第二个版本修改为像第一个版本一样也返回匹配卡片的数组。（提示：在 `indexesOfPassingTest:`\
  \ 方法完成后，枚举索引集的每个索引，并将相应的元素添加到数组中。）\n\n在表 15.11 中列了一些代表性的 `NSIndexSet` 方法。在表中，`idx`\
  \ 是一个 `NSUInteger` 整数。鼓励你在文档中查询此类并学习更多关于它的信息。\n\n**表 15.11 某些 NSIndexSet 方法**\n\n\
  ![image](img/15tab11.jpg)\n\n### 练习\n\n1. 在文档中查找 `NSDate` 类。然后为 `NSDate` 添加一个名为\
  \ `ElapsedDays` 的新分类（category）。在新分类中，根据以下方法添加一个方法：\n`-(unsigned long) elapsedDays:\
  \ (NSDate *) theDate;`\n让新方法返回接收者和参数之间经过的天数。编写一个测试程序来测试你的新方法。（提示：查看 `years:months:days:hours:seconds:sinceDate:`\
