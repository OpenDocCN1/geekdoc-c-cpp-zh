  \ lookup:@\"steve\"]` 应该匹配名称中任何地方包含 `steve` 字符串的条目。对使用 `sortedArrayUsingSelector:`\
  \ 方法的版本进行修改，同时也对在本章结尾使用 `indexesOfPassingTest:` 方法的版本进行修改。\n\n3. 如果你在从数组中寻找多个匹配项，你也可以使用\
  \ `indexesOfPassingTest:` 方法。该方法返回一个 `NSIndexSet`，包含数组中所有符合标准的元素索引。下面的版本使用了这个新方法来查找并返回所有匹配卡片的索引。（注：此处原文提供的代码块逻辑似乎与前面的描述重复，但根据指令要求翻译文本并保持代码块不变）。\n\
  ... \n\n\n\n\n## 9. 定义三个新类，分别称为 `Song`、`PlayList` 和 `MusicCollection`。`Song` 对象将包含特定歌曲的信息，例如其标题、艺术家、专辑和播放时长。`PlayList`\
