  md: "off, and (b) retries indefinitely (whereas the client retries a few times before\
    \ reporting a failure).\n\nTry the client, queue, and workers, such as by using\
    \ a script like this:\n\n```\nppqueue & \nfor i in 1 2 3 4; do\nppworker &\nsleep\
    \ 1\ndone\nlpclient &\n```\n\nYou should see the workers die one-by-one as they\
    \ simulate a crash, and the client eventually give up. You can start and restart\
    \ the queue and both client and workers will reconnect and carry on. And no matter\
    \ what you do to queues and workers, the client will never get an out-of-order\
    \ reply: the whole chain works, or the client abandons.\n\n# Heartbeating\n\n\
    Heartbeating solves the problem of knowing whether a peer is alive or dead. This\
    \ is not an issue specific to MQ. TCP has a long timeout (30 minutes or so), which\
    \ means it can be impossible to know whether a peer has died, been disconnected,\
    \ or gone on a weekend to Prague with a case of vodka, a redhead, and a large\
    \ expense incurred.\n\nIt's not easy to get heartbeating right. When writing the\
    \ Paranoid Pirate examples, it took about five hours to get the heartbeating working\
    \ properly. The rest of the request-reply chain peaks ten minutes. It is especially\
    \ to create “false failures”, i.e., when peers decide they are disconnected because\
    \ the heartbeats aren't sent properly.\n\nWe'll look at the three main answers\
    \ people use for heartbeating with MQ.\n\n# Shrugging It Off\n\nThe common approach\
    \ is to not have heartbeating at all and hope for the best. Many if not MQ applications\
    \ do this. MQ encourages this by hiding peers in many cases. What problems does\
    \ this approach cause?\n\n+   When we use a ROUTER socket in an application that\
    \ tracks peers, as peers disconnect and reconnect, the application will leak memory\
    \ (resources that the application holds for each peer) and get slower and slower.\n\
    \n+   When we use SUB- or DEALER-based data recipients, we can't tell the difference\
    \ between good silence (there's no data) and bad silence (the other end died).\
    \ When a recipient knows the other side died, it can example switch over to a\
    \ backup route.\n\n+   If we use a TCP connection that stays for a long while,\
    \ it will, in some networks, just die. Sending something (technically, a “keep-alive”)\
    \ more than a heartbeat) will keep the network alive."
