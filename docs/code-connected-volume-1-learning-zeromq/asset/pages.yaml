    # ## Pros and Cons of Pub-Sub


    0MQQ''s low-level patterns have their different characters. Pub-sub addresses
    an old messaging problem, which is *multicast* or *group messaging*. It has unique
    mix of meticulous simplicity and brutal indifference that characterizes 0MQQ.
    It''s worth understanding the trade-offs that pub-sub makes, how these benefit
    us, and how we can work around them if needed.


    First, PUSH sends each to "all of many", whereas PUSH and DEALER rotate messages
    to "one of many". You cannot replace PUSH with PUB or vice versa and hope that
    things will work. This repeats because people see to often suggest this.


    More profoundly, pub-sub is aimed at scalability. This means large volumes of
    data, sent rapidly to many recipients. If you need millions of messages per second
    sent to thousands of points, you’ll appreciate pub-sub a lot more than you need
    a few messages a second sent to a handful of recipients.


    To get scalability, pub-sub uses the same trick as push-pull, which is to get
    rid of back-chatter. This means recipients don''t talk back to senders. There
