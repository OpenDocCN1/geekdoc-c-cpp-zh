  md: '# Code Connected Volume 1 - Chapter 4. Reliable-Request-Reply Patterns


    +   * Any automatic exploration of the network. The Binary Star pair is manually
    and explicitly defined in the network and is known to applications (at least in
    their configuration data).


    +   * Replication of state or messages between servers. All server-side state
    must be recreated by applications when they fail over.


    Here is the key terminology we use in Binary Star:


    +   * *Primary*: the server that is normally or initially active.


    +   * *Backup*: the server that is normally passive. It will become active if
    when the primary server disappears from the network, and client applications ask
    the backup server to connect.


    +   * *Active*: the server that accepts client connections. There is at most one
    active server.


    +   * *Passive*: the server that takes over if the active disappears. Note that
    when a Binary Star pair is running normally, the primary server is active, and
    the backup is passive. When a failover has happened, the roles are switched.


    To configure a Binary Star pair, you need to:


    +   1. Tell the primary server where the backup server is located.


    +   2. Tell the backup server where the primary server is located.


    +   3. Optionally, tune the failover response times, which must be the same for
    both servers.


    The tuning concern is how frequently you want the servers to check their peering
    status, and how quickly you want to activate failover. In our example, the failover
    timeout defaults to 2000 msec. If you reduce this, the backup server will take
    over as more rapidly but may take over cases where the primary server could recover.
    For example, you may have wrapped the primary server in a shell script that restarts
    if it crashes. In that case, the timeout should be higher than the time needed
    to restart the primary server.


    For client applications to work properly with a Binary Star pair, they must:


    +   1. Know both server addresses.


    +   2. Try to connect to the primary server, and if that fails, to the backup
    server.


    +   3. Detect a failed connection, typically using heartbeat.


    +   4. Try to reconnect to the primary, and then backup (in that order), with
    a delay between retries that is at least as high as the server failover timeout.


    +   5. Recreate all of the state they require on a server.


    +   6. Retransmit messages lost during a failover, if messages need to be reliable.


    It’s not trivial work, and we’d usually wrap this in an API that hides it from
    real end-applications.


    These are the main limitations of the Binary Star pattern:


    +   * A server process cannot be part of more than one Binary Star pair.'
