    # Binary Star Reactor


    Binary Star is useful and generic enough to package up as a reusable reactor.
    The reactor then runs and calls our code whenever it has a message to process.
    This is much nicer than copying/pasting the Binary Star code into each server
    where we have that capability.


    In C, we wrap the CZMQ zloop class that we saw before. zloop lets you register
    handlers to react to socket and timer events. In the Binary Star reactor, we provide
    handlers for voters and for state changes (active to passive, and vice versa).
    Here is the bstar API:


    ```

    // Create a new Binary Star instance, using local (bind) and

    // remote (connect) endpoints to set up the server peering.

    bstar_t *bstar_new(int primary, char *local, char *remote);

    ```


    ```

    // Destroy a Binary Star instance

    void bstar_destroy(bstar_t **self_p);

    ```


    ```

    // Return underlying zloop reader, for timer and reader

    // registration and cancellation.

    zloop_t *bstar_zloop(bstar_t *self);

    ```


    ```

    // Register voting reader

    int bstar_voter(bstar_t *self, char *endpoint, int type,

    nzloop_fn handler, void *arg);

    ```


    ```

