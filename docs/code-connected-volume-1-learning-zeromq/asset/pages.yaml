    \ Let's compare the same server in C+\n+:\n\nExample 2. Hello World server (hserver.cpp)\n\
    \n| | Client |\n| REQ |\n| Hello | World |\n| REP |\n| Server |\n\nFigure 2. Request-Reply\n\
