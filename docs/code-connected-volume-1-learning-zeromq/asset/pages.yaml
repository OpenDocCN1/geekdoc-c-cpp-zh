    +   - Each broker needs a way to delegate tasks to a peer and get replies back,
    asynchronously. We''ll do this using ROUTER sockets; no other combination works.
    Each broker has sockets: one for tasks it receives and one for tasks it delegates.
    If we didn''t use two sockets, it would be more work to know we were reading a
    request or a reply each time. That would mean adding more information to the message
