  md: 'Code Connected Volume 1 - Chapter 3. Advanced Request-Reply Patterns


    ROUTER sockets don''t care about the whole envelope. They don''t know anything
    about the empty delimiter. They all care about is that identity frame that lets
    them figure out which connection to send a message to.


    # Recap of Request-Reply Sockets


    Let''s recap:


    +   - The REQ socket sends, to the network, an empty delimiter frame in front
    of the message data. REQ sockets are synchronous. REQ sockets always send one
    request and wait for one reply. REQ sockets talk to one peer at a time. If you
    connect a REQ socket to multiple peers, requests are distributed to and replies
    from each peer one at a time.

    - The REP socket reads and saves all identity frames up to and including the empty
    delimiter, passes the following frame or frames to the caller. REP sockets are
    synchronous and talk to one peer at a time. If you connect to multiple peers,
    requests are read from peers in fair fashion, and replies are always sent to the
    same peer that made the last request.

    - The DEALER socket is oblivious to the reply envelope and handles this like any
    multipart message. DEALER sockets are asynchronous and like PUSH and PULL. They
    distribute sent messages among all connections, and fair-queued messages from
    all connections.

    - The ROUTER socket is oblivious to the reply envelope, like DEALER. It creates
    identities for its connections, and passes these identities to the caller as a
    first frame in any received message. Conversely, when the caller sends a message,
    it use the first message frame as an identity to look up the connection to send
    to. ROUTERS are asynchronous.


    # Request-Reply Combinations


    We have four request-reply sockets, each with a certain behavior. We''ve seen
    how they connect in simple and extended request-reply patterns. But these sockets
    are building blocks that you can use to solve many problems.


    These are the legal combinations:


    +   - REQ to REP

    - DEALER to REP

    - REQ to ROUTER

    - DEALER to ROUTER

    - DEALER to DEALER

    - ROUTER to ROUTER


    And these combinations are invalid (and I''ll explain why):


    +   - REQ to REQ

    - REQ to DEALER'
