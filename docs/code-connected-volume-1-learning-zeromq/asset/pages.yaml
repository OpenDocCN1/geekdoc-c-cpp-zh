  md: '+   - REP to REP: both sides would wait for the other to send the first message.


    +   - REP to ROUTER: the ROUTER socket can then initiate the dialog and send a
    properly-formatted request, if it knows the REP socket has connected and it knows
    the identity of that connection. It’s messy and adds nothing over DEALER to ROUTER.


    The common thread in this valid invalid breakdown is that ØMQ socket connection
    is always biased towards one peer that binds to an endpoint, and another connects
    to that. Further, that side binds and which side connects is not arbitrary, but
    follows natural patterns. The side that we expect to be “there” binds: it’ll be
    a server, a broker, a publisher, a collector. The side that “comes and goes” connects:
    it’ll be clients and workers. Remembering this will help you design better ØMQ
    architectures.


    # Exploring ROUTER Sockets


    # Identities and Addresses


    The identity in ØMQ refers specifically to ROUTER sockets and how they identify
    the connections they have to other sockets. More broadly, the identities are used
    as addresses in the reply envelope. In most cases, the identity is arbitrary and
    local to the ROUTER socket: it’s a lookup key in a hash table. Independently,
    a peer can have an address that is physical (a network endpoint like “tcp://192.168.55.117:5670”)
    or logical (a UUID or email address or other unique key).


    An application that uses a ROUTER socket to talk to specific peers can convert
    a logical address to an identity if it has built the necessary hash table. Because
    ROUTER sockets only announce the identity of a connection (to a specific peer)
    when hear peers send a message, you can only reply to a message, spontaneously
    talk to a peer.


    This is true if you flip the rules and make the ROUTER connect to the peer rather
    than wait for the peer to connect to the ROUTER. However you can force the ROUTER
    socket to use a logical address in place of its identity. The zmq_setsock reference
    page calls this setting the socket identity. It works as follows:


    +   - The application sets the ZMQ_IDENTITY option of its peer socket (DEALER
    or REQ) before binding or connecting.


    +   - Usually the peer connects to the already-bound ROUTER socket. But the ROUTER
    can also connect to the peer.


    +   - At connection time, the peer socket tells the router, “please use this identity
    for this connection”.


    +   - If the peer socket doesn’t say that, the router generates its usual random
    identity for the connection.


    +   - The ROUTER socket now provides this logical address to the application as
    a prefix identity frame for any messages coming in that peer.'
