    # Last Value Caching


    If you''ve used commercial pub-sub systems, you may be used to use some features
    that are missing in the fast and cheerful OMQ pub-sub model. One of these is last
    value caching (LVC). This solves the problem of how a new subscriber catches up
    when it joins the network. The theory is that publishers get notified when a new
    subscriber joins and subscribes to specific topics. The publisher can reprocast
    the last message for those topics.


