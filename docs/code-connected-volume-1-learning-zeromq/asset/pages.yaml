  md: '# Code Connected Volume 1 - Chapter 3. Advanced Request-Reply Patterns


    +   - As an application that reads the message and acts on it.


    In the first case, the ROUTER simply reads all frames, including the artificial
    identity frame, and passes them blindly. In the second case the ROUTER MUST know
    the format of the reply envelope it''s being sent. As the other peer is a REQ
    socket, the ROUTER gets the identity frame, an empty frame, and then the data
    frame.


    # The DEALER to ROUTER Combination


    Now we can switch out REQ and REP with DEALER and ROUTER to get the most powerful
    socket combination, which is DEALER talking to ROUTER. It gives us asynchronous
    clients talking to asynchronous servers, where both sides have full control over
    the message formats.


    Because both DEALER and ROUTER can work with arbitrary message formats, if you
    hope to use them safely, you have to become a little bit of a protocol designer.
    At the very least you must decide whether you wish to emulate the REQ/REP envelope.
    It depends on whether you actually need to send replies or not.


    # The DEALER to DEALER Combination


    You can swap a REP with a ROUTER, but you can also swap a REP with a DEALER, if
    the DEALER is talking to one and only one peer.


    When you replace a REP with a DEALER, your worker suddenly go asynchronous, sending
    any number of replies back. The cost is that you have to manage the reply envelopes
    yourself, and get them right, or nothing at all will. We''ll see a worked example
    later. Let''s say for now that DEALER to DEALER is one of the trickier patterns
    to get right, and happily it''s rare that we need it.


    # The ROUTER to ROUTER Combination


    This sounds perfect for N-to-N connections, but it''s the most difficult combination
    to use. You should avoid it unless you are advanced with Ø. We''ll see one example
    in the Freelance pattern in “Reliable Request-Reply Patterns”, and an alternative
    DEALER to ROUTER design for peer-to-peer work in Code Connected Volume 2.


    # Invalid Combinations


    Mostly, trying to connect clients to clients, or servers to servers is a bad idea
    and won''t work. However, rather than giving vague genre warnings, I''ll explain
    in detail:


    +   - REQ to REQ: both want to start sending messages to each other, and this
    could only work if you timed things so that both peers exchanged messages at the
    same time. It hurts my brain to even think about it.


    +   - REQ to DEALER: you could in theory do this, but it would break if you added
    a second REQ because DEALER has no way of sending a reply to the original peer.
    Thus the REQ socket would get confused, and/or return messages meant for another
    client.'
