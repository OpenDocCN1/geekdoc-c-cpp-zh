    \n+   * We calculate a liveness, which is how many heartbeats we can still miss\
    \ before deciding the queue is dead. It starts at three and we decrement each\
    \ time we miss a heartbeat.\n* We wait, in the zm_poll loop, for one second each\
    \ time, which is our heartbeat interval.\n* If there’s any message from the queue\
    \ during that time, we reset our liveness to three.\n* If there’s no message during\
    \ that time, we count down our liveness.\n* If the liveness reaches zero, we consider\
    \ the queue dead.\n* If the queue is dead, we destroy our socket, create a new\
    \ one, and reconnect.\n* To avoid opening and closing many sockets, we wait for\
    \ a certain interval before connecting, and we double the interval each time until\
    \ it reaches 32 seconds.\n\nAnd this is how we handle heartbeats to the queue:\n\
    \n+   * We calculate when to send the next heartbeat; this is a single variable\
    \ because we’re talking to one peer, the queue.\n* In the zm_poll loop, whenever\
    \ we pass this time, we send a heartbeat to the queue.\n\nHere’s the essential\
    \ heartbeat code for the worker:\n\n```\n#define HEARTBEAT_LIVENESS 3    // 3-5\
    \ is reasonable\n#define HEARTBEAT_INTERVAL 1000 // msecs\n#define INTERVAL_INIT\
    \ 1000 // Initial reconnect\n#define INTERVAL_MAX 32000 // After exponential backoff\n\
    \n// If liveness hits zero, the queue is disconnected\nsize_t liveness = HEARTBEAT_LIVENESS;\n\
    size_t interval = INTERVAL_INIT;\n\n// Send out heartbeats at regular intervals\n\
    int64_t heartbeat_at = zclock_time () + HEARTBEAT_INTERVAL;\n\nwhile (true) {\n\
    \  zmq_pollitem_t items [] = { worker, 0, ZMQ_POLL, 0 };\n  int rc = zmq_poll(items,\
    \ 1, HEARTBEAT_INTERVAL * ZMQ_POLL_SEC);\n\n  if (items[0].revents & ZMQ_POLL)\
    \ {\n    // Receive any message from queue\n    liveness = HEARTBEAT_LIVENESS;\n\
    \    interval = INTERVAL_INIT;\n```"
