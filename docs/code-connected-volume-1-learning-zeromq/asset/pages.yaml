  md: 'Code Connected Volume 1 - Chapter 5. Advanced Pub-Sub Patterns


    # Repubishing Updates from Clients


    In our second model, changes to the key-value store come from the server itself.
    This is a centralized model that is useful, for example if we have a central configuration
    file we want to distribute, with local caching on each node. A more interesting
    model takes updates from clients, not the server. The server becomes a stateless
    broker. This gives us some benefits:


    +   - We''re less worried about the reliability of the server. If it crashes,
    we can start a new instance and feed it values.


    +   - We can use the key-value store to share knowledge between active peers.


    To send updates from clients back to the server, we can use a variety of patterns.
    The simplest plausible solution is a PUSH-PULL combination (see figure 60).


    Why don''t we allow clients to publish updates directly to each other? While this
    would reduce latency, it would remove the guarantee of consistency. You can''t
    get consistent shared state you allow the order of updates to change depending
    on who receives them. We say we have two clients, changing keys. This will work
    fine but if the two clients try to change the same key at the same time, they''ll
    end up with different notions of its value.


    There are few strategies for obtaining consistency when changes happen in multiple
    places at once. We''ll use the approach of centralizing all change. No matter
    the precise timing of the changes that clients make, they are all pushed through
    the server, which enforces a single sequence according to the order in which it
    gets updates.


    By mediating changes, the server can also add a unique sequence number to all
    updates. With unique sequencing, clients can detect the nastiest failures, including
    network congestion and queue overflow. If a client discovers that its incoming
    message stream has a hole, it can take action. It seems sensible that the client
    contacts the server and ask for the missing messages, but in practice that is
    not useful. If there are holes, they''re caused by network stress, and adding
    more stress to the network will make things worse. The client can do is warn its
    users that it is “unable to continue”, stop, and not restart until someone manually
    checked the cause of the problem.


