  md: "# Code Connected Volume 1 - Chapter 5. Advanced Pub-Sub Patterns\n\nIf you\
    \ make a nontrivial protocol and you expect analytics to implement properly, most\
    \ developers will get it wrong most of the time. You're going to be left with\
    \ a lot of unhappy people complaining that your protocol is too complex, fragile,\
    \ and too hard to use. Whereas if you give them a simple API to call, you have\
    \ some chance of them buying in.\n\nOur multithreaded API consists of a frontend\
    \ object and a background agent, connected by two PAIR sockets (see figure 63).\
    \ Connecting two PAIR sockets like this is so useful that your high-level binding\
    \ should probably do what CZMQ does, which is package a “create new thread with\
    \ a pipe that I can use to send messages to it” method.\n\n![](img/4bfb6119de42e06bff7b1880c181ba6e_297_0.png)\n\
    \nFigure 63. Multithreaded API\n\nThe multithreaded API that we see in this book\
    \ can handle the following:\n\n+   - The constructor for the object (clone_new)\
    \ creates a context and starts a background thread connected with a pipe. It holds\
    \ onto one end of the pipe so it can send commands to the background thread.\n\
    - The background thread starts an agent that is essentially a zmq_poll loop reading\
    \ from the pipe socket and any other sockets (here, the DEALER and SUB sockets).\n\
    - The main thread and the background thread communicate only via OMQ messages.\
    \ By convention, the frontend sends string commands that each method on the class\
    \ turns into a message to the backend agent, like this:\n\n```\nvoid\nclone_connect(clone_t\
    \ *self, char *address, char *service)\n{\n  assert(self);\n  zmq_t *msg = zmq_new();\n\
    \  zmq_addr(msg, \"CONNECT\");\n  zmq_addr(msg, address);\n  zmq_addr(msg, service);\n\
    \  zmq_send(&msg, self->pipe);\n}\n```\n\n+   - If the method needs to return\
    \ a code, it can wait for a reply message from the agent.\n- If the agent needs\
    \ to send asynchronous events back to the frontend, we add a recv method to the\
    \ class, which waits for messages on the frontend pipe."
