    # Service Discovery


    So, we have a nice service-oriented broker, but we have no way of knowing whether
    a particular service is available or not. We know whether a request failed, but
    we don’t know why. It is useful to ask the broker, “is the echo service running?”
    The most obvious way would be to modify our MDP/Client protocol to add commands
    to ask this. But MDP/Client has the great charm of being simple. Adding service
    discovery to it would make it as complex as the MDP/Worker protocol.


    Another option is to do what email does, and ask that undeliverable be be. This
    can work in an asynchronous worker, but it also adds complexity. We need ways
    to distinguish requests from replies and to handle these properly.


    Let’s try to use what we’ve already built, building on top of MDP instead of modifying
    it. Service discovery is itself, a service. It might be one of several management
    services, as “disable service X”, “provide statistics”, and so on. What we are
    a general, extensible solution that doesn’t affect the protocol or existing applications.


    So here’s a small RFC that layers on top of MDP: the Majordomo Management Interface
    (MMI). We already implemented it in the broker, though unless you read the whole
    thing you probably missed. I’ll explain how it works in the broker:


    +   * When a client requests a service that starts with mmi,, instead of routing
    this to a worker, we handle it internally.

    * We handle one service in this broker, which is mmi.service, the service discovery
    service.

    * The payload for the request is the name of an external service (a real one,
    provided by a worker).

    * broker returns “200” (OK) or “404” (Not found), depending on whether others
    workers are registered for service or not.


    Here’s how we use the service discovery in an application:


