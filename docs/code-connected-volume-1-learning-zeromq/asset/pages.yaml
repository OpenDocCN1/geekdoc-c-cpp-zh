  md: '# # Preface


    # ## ØMQ in a Hundred Words


    ØMQ (also known as ZeroMQ, ØMQ, or zmq) looks like an embeddable networking library
    but acts like a concurrency framework. It gives you sockets that carry atomic
    messages across various transports like in-process, inter-process, TCP, and multicast.
    You can connect sockets N-to-N with patterns like fan-out, pub-sub, task distribution,
    and request-reply. It''s fast enough to be the fabric for clustered products.
    Its asynchronous I/O model gives you scalable multicore applications, built as
    asynchronous message-processing tasks. ØMQ has a score of language APIs and runs
    on most operating systems. ØMQ is from iMatix and is LGPLv3 open source.


    # ## How It Began


    We took a TCP socket, injected with a mix of radioactive isotopes stolen from
    a secret Soviet atomic research project, bombarded with 1950-era cosmic rays,
    and put it into the hands of a drug-added comic book author with a badly-disguised
    fetish for bulging muscles in spandex (see figure 1). Yes, ØMQ sockets are the
    world-saving superheroes of the networking world.


    # ## The Zen of Zero


    The Ø in ØMQ is all about tradeoffs. On the one hand this strange name lowers
    ØMQ''s visibility on Google and Twitter. On the other hand it annoys the out of
    Danish folk who write things like “OMG rotfl!”, and “Ø is not a funny looking
    zero!” and ”Røygød med Fløde!”, which is apparently an insult that means “may
    your neighbours be the direct descendants of Grendel!” Seems like a fair trade.


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_6_0.png)


    Figure 1. A terrible accident...'
