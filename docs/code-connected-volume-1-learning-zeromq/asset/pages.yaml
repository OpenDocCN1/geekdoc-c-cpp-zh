    # # Multithreading with 0MQ


    0MQ is perhaps the nicest ever to write multithreaded (MT) applications. Whereas
    0MQ sockets require some readjustment if you are used to traditional sockets,
    0MQ multithreading will take everything you know about writing MT applications,
    throw it into a heap in the garden, pour gasoline over it, and set it alight.
    It’s a rare book that deserves burning, but most books on concurrent programming.


    To make utterly perfectly MT programs (and I mean literally), we don’t need mutexes,
    or any other form of inter-thread communication except messages sent across 0MQ
    sockets.


    By “perfect MT programs”, I mean that’s easy to write and understand, that works
    with the same design approach in any programming language, and on any operating
    system, that scales across any number of CPUs with zero wait states and no point
    of diminishing returns.


    If you’ve spent years learning to make your MT code work at all, let alone rapidly,
    with locks and semaphores and critical sections, you will be disgusted when you
    realize it all for nothing. There’s one lesson we’ve learned from 30+ years of
    concurrent programming, it is: don’t share state. It’s like two drunkards trying
    to share a beer. It doesn’t matter if they’re good buddies. Sooner or later, they’re
    going to get into a fight. And the more drunkards you add to the table, the more
    they fight each over the beer. The tragic majority of MT applications look like
    drunken bar fights.


    The list of weird problems that you need to fight as you write classic shared-state
    MT code would be hilarious if it didn translate into stress and risk, code that
    seems to suddenly fails under pressure. A large firm with world-beating experience
    in bug code riddled its list of “11 Likely Problems In Your Multithreaded Code”,
    which covers forgotten synchronization, incorrect granularity, and read and writing,
    lock-free ordering, lock convoys, two-step dance, and priority inversion.


    We counted seventeen problems, not even. That’s not the point though. The point
    is, do you really want that running the power grid or stock market to start getting
    two-step lock convoys at 3 p.m. on a busy Thursday? Who cares the terms actually
    mean? This is not what turned us to programming, fighting ever more complex effects
    with ever more complex hacks.


    Some widely used models, despite being the base for entire industries, are fundamentally
    broken, and shared state concurrency is one of them. Code that to scale without
    limit does it like the Internet, by sending messages and sharing nothing except
    a common contempt for broken programming models.'
