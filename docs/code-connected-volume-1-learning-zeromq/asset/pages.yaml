  md: '# 224 Code Connected Volume 1 - Chapter 4. Reliable-Request-Reply Patterns


    let the client “know” the identity of the server. Doing the other way around would
    be insane, on top of complex and nasty, because any number of clients should be
    able to arise independently. Insane, complex and nasty are great attributes for
    a genoc dictator, but terrible ones for software.


    Rather than invent yet another concept to manage, we''ll use the connection endpoint
    as identity. This is a unique string on both sides can agree without prior knowledge
    than they already have for the shotgun model. It''s a sneaky and effective way
    to connect two ROUTER sockets.


    Remember how ØMQ identities work. The ROUTER socket sets an identity before it
    binds it. When a client connects, they do a little handshake to exchange identities,
    before either side sends a real message. The client ROUTER socket, not having
    an identity, sends a null identity to the server. The server generates a random
    UUID to designate for its own use. The server sends its identity (which we''ve
    agreed is going to be an endpoint string) to the client.


    This means that our client can route a message to the server (i.e., send on its
    ROUTER socket, specifying the server endpoint as identity) as soon as the connection
    is established. There''s not immediately after doing a zmq_connect(), but some
    random thereafter. Here lies one problem: we don''t know when the server will
    actually be available and complete its handshake. If the server is online, it
    could be after a few milliseconds. If the server is out to lunch, it could be
    an hour from now.


    There''s a small paradox. We need to know when servers become connected and available
    for work. In the Freelance pattern, unlike the broker-based patterns we saw earlier
    in this chapter, servers are silent until spoken to. Thus we can''t talk to a
    server until it tells us it''s online, which it can''t do until we''ve asked it.


    My solution is to mix in a little of the shotgun approach from model 2, meaning
    we''ll free (harmless) shots at anything we can, and if anything moves, we know
    it''s alive. We''re not going to find real requests, but ping-pong heartbeats.


