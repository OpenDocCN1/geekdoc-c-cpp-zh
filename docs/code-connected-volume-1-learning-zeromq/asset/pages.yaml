  md: '# Code Connected Volume 1 - Chapter 2. Sockets and Patterns


    It’s better to think of intermediaries as simple stateless message switches. A
    good analogy is an HTTP proxy; it’s there, but doesn’t have any special role.
    Adding a pub-sub proxy solves the dynamic discovery problem in our example. We
    set the proxy in the “middle” of the network (see figure 13). The proxy opens
    an XSUB socket, and binds to well-known IP addresses and ports. Then, all other
    processes connect to the proxy, instead of each other. It becomes trivial to add
    more subscribers or publishers.


    We need XPUB and XSUB sockets because OMQ does subscription forwarding from subscribers
    to publishers. XSUB and XPUB are exactly like SUB and PUB except they expose subscriptions
    as special messages. The proxy has to forward these messages from subscriber to
    publisher side, by reading them from the XPUB socket and writing them to the XSUB
    socket. This is the main use case for XSUB and XPUB (see figure 14).


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_48_0.png)


    # Shared Queue (DEALER and ROUTER sockets)


    In the Hello client/server application, we have one client that talks to one service.
    In real cases we usually need to allow multiple services as well as multiple clients.
    This lets us scale up the power of the service (many threads or processes or nodes
    rather than just one). The only constraint is that services must be stateless,
    all state being in the request or in some shared storage as a database.


    There are two ways to connect multiple clients to multiple servers. One client
    can connect to multiple service sockets, and the REQ socket will then distribute
    requests among these services. Let’s say we connect a client socket to three service
    endpoints; A, B, and C. The client makes requests R1, R2, R3, R4. R1 and R4 go
    to service A, B, and R3 goes to service C (see figure 15).


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_48_1.png)'
