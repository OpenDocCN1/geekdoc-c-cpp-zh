  md: '+   - **Multithreaded API**: the client API consists of two parts, a synchronous
    flaky class that runs in the application thread, and an asynchronous agent class
    runs as a background thread. Remember how OMQ makes it easy to create multithreaded
    apps. The flaky and agent classes talk to each other with messages over an inproc
    socket. All OMQ aspects (such as creating and destroying a context) are in the
    API. The agent in effect acts like a mini-broker, talking to servers in the background,
    so that when we make a request, it can make a best effort to reach a server it
    believes is available.


    +   - **Tickless poll timer**: in previous poll loops we always used a fixed tick
    interval, e.g., 1 second, which is simple enough but not excellent on power-sensitive
    clients (such as notebooks or mobile phones), waking the CPU costs power. For
    fun, and to save the planet, the agent uses a tickless timer, which calculates
    the poll delay based on the next timeout we''re expecting. A proper implementation
    would keep an ordered list of timeouts, we just check all timeouts and calculate
    the poll delay until the next one.


