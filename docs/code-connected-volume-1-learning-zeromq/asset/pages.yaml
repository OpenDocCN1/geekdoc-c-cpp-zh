  md: 'You should follow some rules to write multithreaded code with ØMQ:


    +   - Isolate data privately within its thread and never share data in multiple
    threads. The only exception to these are ØMQ contexts, which are threadsafe.


    +   - Stay away from the classic concurrency mechanisms like mutexes, threads,
    semaphores, etc. These are an anti-pattern in ØMQ applications.


    +   - Create one ØMQ context at the start of your process, and pass that to all
    threads you want to connect via inproc sockets.


    +   - Use attached threads to create structure within your application, and connect
    these to their parent threads using PAIR sockets over inproc. The pattern is:
    bind socket, create child thread which connects its socket.


    +   - Use detached threads to simulate independent tasks, with their own contexts.
    Connect these over tcp. Later you can move these to stand-alone processes without
    changing the code significantly.


    +   - All interaction between threads has ØMQ messages, which you can define more
    or less smartly.


    +   - Don''t share ØMQ sockets between threads. ØMQ sockets are not threadsafe.
    Technically it''s possible to migrate a socket from one thread to another but
    it demands scale. The only place where it''s remotely sane to share sockets between
    threads are in language bindings that do not make like garbage collection on sockets.


    If you need to start more than one proxy in an application, for example, you will
    want to run each in their thread. It is easy to make the error of creating the
    proxy frontend and backend sockets in one thread, and then passing the sockets
    to the proxy in another thread. This may appear to work at first but will fail
    randomly in real use. Remember: Do not use or close sockets in the thread that
    you created.


    If you follow these rules, you can quickly build elegant multithreaded applications,
    and split off threads into separate processes as you need to. Application logic
    can sit in threads, processes, or nodes: whatever your scale requires.


    ØMQ uses native threads rather than virtual “green” threads. The advantage is
    that you don''t need to learn any new threading API, and that ØMQ maps cleanly
    to your operating system. You can use standard tools like Intel''s ThreadChecker
    to see what your application is doing. The disadvantages are that native threading
    APIs are not always portable, and if you have a large number of threads (in the
    thousands), operating systems will get stressed.


    Let''s see how this works in practice. We''ll turn out our Hello World into something
    more capable. The original run ran in a single thread. If the work request is
    large, that one ØMQ thread can run at full speed on a CPU core, with no waits,
    doing an awful lot of work. But realistic servers have to do nontrivial work per
    request. A single core might not be enough when 10,000 clients hit the server
    at once. So a realistic server will start multiple worker threads. It accepts
    requests as fast as it can and distributes these to its threads. The worker threads
    grind through the work and eventually send their replies back.'
