  md: 'What are the answers? One is to pass the problem upstream. A is getting the
    messages from somewhere else. Stop that process, “Stop!” And so on. This is called
    flow control. It sounds plausible, but if you''re sending a Twitter feed? Do you
    tell the whole world to stop tweeting when B gets its act together?


    Flow works in some cases, but not others. The transport layer can''t tell the
    application layer to “stop” any more than a subway system can tell a large business,
    please keep your stuff at work after an hour. I’m too busy”. The answer for messaging
    is to set limits on the size of buffers, and when we reach such limits, to take
    some sensible action. In some cases (not for a subway system, though), the answer
    is to throw away messages. In a others, the best strategy is to wait.


    ØMQ uses the concept of HWM (high-mark) to define the capacity of its internal
    pipes. Each connection out of a socket or into a socket has its own pipe, and
    HWM for sending, receiving, depending on the socket type. Some sockets (PUB, PUSH)
    have only send buffers. Some (SUB, PULL, REQ, REP) have both send and receive
    buffers.


    In ØMQ v2.x, the HWM was infinite by default. This was easy but also typically
    fatal for high-volume publishers. In ØMQ v3.x, it''s set to 1,000 by default,
    which is more sensible. If you''re still using ØMQ v2.x, you should always set
    a HWM on your sockets, or be it 1,000 to match ØMQ v3.x or another figure that
    takes into account your message sizes and expected subscriber performance.


    When your socket reaches its HWM, it will either block or drop data depending
    on the socket type. PUB and ROUTER sockets will drop data if they reach their
    HWM, while other socket types will block. Over the inproc transport, the sender
    and receiver share the same buffers, the real HWM is the sum of the HWM set by
    both sides.


    Lastly, the HWMs are not exact; while you may get up to 1,000 messages by default,
    the real buffer size may be much lower (as little as half), due to the way libzmq
    implements its queues.


