  md: '# Code Connected Volume 1 - Chapter I. Basics


    And this is ØMQ: an efficient, embeddable library that solves most of the problems

    an application needs to become nearly elastic across a network, without much cost.

    Specifically:


    +   - It handles I/O asynchronously, in background threads. These communicate
    with

    ap threads using lock-free data structures, so concurrent ØMQ

    applications need no locks, semaphores, or other wait states.

    - Components come and go dynamically and ØMQ will automatically

    reconnect. This means you can start components in any order. You can create

    “service-oriented architectures” (SOAs) where services can join and leave the

    network at any time.

    - It queues messages automatically when needed. It does intelligently,

    pushing messages as close as possible to the receiver before queuing them.

    - It has ways of dealing with over-full queues (called “high water mark”). When

    a queue is full, ØMQ automatically blocks sends, or throws messages,

    dending on the kind of messaging you are doing (the so-called “pattern”).

    - It lets your applications talk to each other arbitrary transports: TCP,

    micast, in-process, inter-process. You don''t need to change your code to use
    a

    - It handles slow/blocked reads safely, using different strategies that depend
    on

    the messaging pattern.

    - It lets you route messages using a variety of patterns such as request-reply
    and

    p-sub. These patterns are how you create the topology, the structure of your

    network.

    - It lets you create proxies to queue, forward, or capture messages with a single

    call. Proxies can reduce the interconnection complexity of a network.

    - It delivers messages exactly as they were sent, using a single framing on

    the wire. If you write a 10k message, you will receive a 10k.

    - It does not impose any format on messages. They are blobs of zero to gigabytes

    large. When you want to represent data you choose some other product on top,

    such as msgpack, Google''s protocol buffers, and others.

    - It handles network errors intelligently, by retrying automatically in cases

    itmakes sense.

    - It reduces your carbon footprint. Doing more with less CPU means your boxes

    use less power, and you can keep your old boxes in use for longer. Go

    would ØMQ.


