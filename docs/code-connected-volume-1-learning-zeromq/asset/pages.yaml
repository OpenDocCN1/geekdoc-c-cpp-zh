  md: 'Code Connected Volume 1 - Chapter 4. Reliable Request-Reply Patterns


    # One-Way Heartbeats


    A second option is to send a heartbeat message from each node to its peers every
    second or so. When one node hears nothing from another within some timeout (several
    seconds, typically), it will treat that peer as dead. Sounds good, right? Sadly,
    no. This works in some cases has nasty edge cases in others.


    For pub-sub, this does work, and it’s the only model you can use. SUB sockets
    cannot talk back to PUB sockets, but PUB sockets can happily say “I’m alive” messages
    to their subscribers.


    As an optimization, you can send heartbeats only when there is no data to send.
    Furthermore, you can send heartbeats progressively slower and slower, if network
    activity is an issue (e.g., on mobile networks where activity drains the battery).
    As long as the recipient can detect a failure (sharp stop in activity), that’s
    fine.


    Here are the typical problems with this design:


    +   - It can be inaccurate when we send large amounts of data, as heartbeats will
    be delayed behind that data. If heartbeats are delayed, you can get false timeouts
    and disconnections due to network congestion. Thus, always try incoming data as
    a heartbeat, or let the optimizer timeout heartbeats.


    +   - The pub-sub pattern will drop messages for disappeared recipients, PUSH
    and DEALER sockets will queue them. If you send heartbeats to a dead peer and
    it comes back, it will get all the heartbeats you sent, which can be thousands.
    Whoa, whoa!


    +   - This design assumes heartbeat timeouts are the same across the whole network.
    But that won’t be accurate. Some peers will want very aggressive heartbeating
    in order to detect faults rapidly. And some will want very relaxed heartbeating,
    in order to let sleeping networks lie and save power.


    # Ping-Pong Heartbeats


    The third option is to use a ping-pong dialog. One peer sends a ping command to
    the other, which replies with a pong payload. Pings and pongs are not correlated.
    Because the roles of “client” and “server” are arbitrary in some networks, we
    usually specify that either peer can send a ping and expect a pong in response.
    However, the timeouts depend on network topologies known best to dynamic clients,
    it is the client that pings the server.


    This works for all ROUTER-based brokers. The same optimizations we used in the
    second model make this even better: treat any incoming data as a pong, and only
    send a ping when not otherwise sending data.


    # Heartbeating for Paranoid Pirate


    For Paranoid Pirate, we chose the second approach. It might not have been the
    simplest option: if designing this today, I’d probably try a ping-pong approach
    instead.'
