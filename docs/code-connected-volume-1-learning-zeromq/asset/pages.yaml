    # High-Availability Pair (Binary Star Pattern)


    The Binary Star pattern puts two servers in a primary-backup high-availability
    pair (see figure 52). At any given time, one of these (the active) accepts connections
    from client applications. The other (passive) does nothing, but the two servers
    monitor each other. If the active disappears from the network, after a certain
    time the passive takes over active.


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_197_0.png)


    We developed the Binary Star pattern at iMatix for our OpenAMQ server³. We designed
    it:


    +   - To provide a straightforward high-availability solution.

    "- To be simple to actually understand and use.

    "- To fail over when needed, and only when needed.


    Assuming we have a Binary Star pair running, here are the different scenarios
    that will result in a failover (see figure 53):


    > Figure 52. High-Availability Pair, Normal Operation'
