  md: 'The real difficulty is to be able to add and remove clusters at any time. A
    cluster can leave or join the cloud instantly, bringing all its workers and clients
    with it.


    If there are no workers in their own cluster, clients'' tasks will go off to other
    available workers in the cloud.


    Clients send one task at a time, waiting for a reply. If they don''t get an answer
    within X seconds, they''ll send the task again. This isn''t our concern; the client
    API does it already.


    Workers process one task at a time; they are very simple beasts. If they crash,
    they get restarted by whatever script started them.


    So we double-check to make sure that we understood this correctly:


    +   There will be some kind of super-duper network interconnect between clusters,
    right?”, we ask. The client says, "Yes, of course, we are not idiots."


    So we do a little calculation and see that this will work nicely over plain TCP,
    2,500 clients x 10/second x 1,000 x 2 directions = 50MB/sec or 400MB/sec, not
    a problem for a 1GB network.


    It''s a straightforward problem that requires no exotic hardware or protocols,
    just some clever routing algorithms and careful design. We start designing one
    cluster (data center) and then we figure out how to connect clusters together.


    # Architecture of a Single Cluster


    Workers and clients are synchronous. We want to use the load balancing pattern
    to route tasks to workers. Workers are all identical; our facility has no notion
    of different services. Workers are anonymous; clients never address them directly.
    We make no attempt to provide guaranteed delivery, retry, and so on.


    For reasons we already examined, clients and workers won''t speak to each other
    directly. It makes it impossible to add or remove nodes dynamically. So our basic
    model consists of the request-reply message broker we saw earlier (see figure
    39).


    | Client | Client | Client |

    |--- |--- |--- |

    | REQ | REQ | REQ |

    | ROUTER | | |

    | Load balancer | Broker |

    | ROUTER | | |


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_111_0.png)'
