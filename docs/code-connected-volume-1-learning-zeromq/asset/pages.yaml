    And there is also the flow of information between a broker and its local clients
    and workers.


    # The Naming Ceremony


    Three flows x two sockets for each flow = six sockets that we have to manage in
    the broker. Choosing good names is vital to keeping a multocket juggling act coherent
    in minds. Sockets do something and what they should form the basis for their names.
    It''s about being able to read the code weeks later on a cold Monday before coffee,
    and not feel any pain.


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_115_0.png)


    Frontends (incoming)


    Backends (outgoing)


    Let''s do a shamanistic naming ceremony for the sockets. The three flows are:


    +   - A request-reply flow between the broker and its clients and workers.

    - A cloud request-reply flow between the broker and its peers brokers.

    - A state flow between the broker and its peers brokers.


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_115_1.png)


    Figure 44. Broker Socket Arrangement


    Finding meaningful names that are the same length means our code will align nicely.
    It''s not a big thing, but attention to details helps. For each flow the broker
    has two sockets that we can orthogonally call the frontend and backend. We''ve
    used these names often. A frontend receives information or tasks. A backend sends
    those out to other peers. The conceptual flow is from front to back (with replies
    going in the opposite direction from back to front).'
