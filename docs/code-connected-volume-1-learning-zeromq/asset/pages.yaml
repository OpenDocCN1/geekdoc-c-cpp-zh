    ```\n\nHere is the main loop for the lately-recently-used queue. It has two sockets:\
    \ a frontend for clients and a backend for workers. It polls the backend in all\
    \ cases, and polls the frontend when there are one or more workers ready. This\
    \ is a neat way to use ØMQ's own queues to hold messages we're not ready to process\
    \ yet. When we get a client reply, pop the next available worker and send the\
    \ request to it, including the originating client identity. When a worker replies,\
    \ we requue that worker and forward the reply to the client using the reply envelope.\n\
