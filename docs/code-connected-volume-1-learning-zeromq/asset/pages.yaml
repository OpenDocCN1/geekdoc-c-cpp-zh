  md: 'Code Connected Volume 1 - Chapter 3. Advanced-Request-Reply Patterns


    Now for the sockets: we could use the load balancing ROUTER TO DEALER pattern
    to talk to workers, but it''s extra work. In this case, a DEALER TO DEALER pattern
    is probably fine: the trade-off is lower latency for each request, but higher
    risk of unbalanced distribution. Simplicity wins in this case.


    When you build servers that maintain stateful conversations with clients, you
    will run into a classic problem. If the server keeps some state per client, and
    clients keep coming and going, eventually it will run out of resources. Even if
    the same clients keep connecting, if you''re using default identities, each connection
    will look like a new one.


    We cheat in the example by keeping state only for a very short time (the time
    it takes a worker to process a request) and then throwing away the state. But
    that''s not practical for many cases. To properly manage client state in a stateless
    server, you have:


    +   - Do heartbeat from client to server. In our example, we will send a request
    once per second, which can reliably be used as a heartbeat.

    - Store state using the client identity (whether generated or explicit) as key.

    - Detect a spoofed heartbeat. If there''s no request from a client within say,
    two seconds, the server can detect this and destroy any state it''s holding for
    that client.


    # Worked Example: Inter-Broker Routing


    Let''s take everything we''ve seen so far, and scale up to a real application.
    We''ll build this step-by-step over several iterations. Our best client calls
    us urgently and asks for a design of a large cloud computing facility. He has
    this vision of a cloud that spans many data centers, each cluster of clients and
    workers, and that works together as a whole. Because we''re smart enough to know
    that practice beats theory, we propose to make a working simulation using ØMQ.
    Our client, eager to lock down the budget before his own boss changes his mind,
    and having read great things about ØMQ on Twitter, agrees.


    # Establishing the Details


    Several espressos later, we want to jump into writing code, but a little voice
    tells us to get more details before making a sensational solution to entirely
    the wrong problem. "What kind of work is the cloud doing?", we ask.


    The client explains:


    +   - Workers run on various kinds of hardware, but they are all able to handle
    any task. There are several hundred workers per cluster, and as many as a dozen
    clusters in total.

    - Clients create tasks for workers. Each task is an independent unit of work and
    all the client wants is to find an available worker, and send it the task, as
    soon as possible. There will be a lot of clients and they''ll come and go arbitrarily.'
