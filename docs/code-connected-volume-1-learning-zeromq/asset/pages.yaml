    \nSome things to know about multipart messages:\n\n+   - When you send a multipart\
    \ message, the first part (and all following parts) are only actually on the wire\
    \ when you send the final part.\n- If you are using zmq_poll(), when you receive\
    \ the first part of a message, all the rest has also arrived.\n- You will receive\
    \ all parts of a message, or none at all.\n- Each part of a message is a separate\
    \ zmq_msg item.\n- You will receive all parts of a message whether or not you\
    \ check the more property.\n- On sending, ØMQ queues frames in memory until the\
    \ last is received, then sends them all.\n- There is no way to cancel a partially\
    \ sent message, except by closing the socket.\n\n# Intermediaries and Proxies\n\
    \nØMQ aims for decentralized intelligence, but that doesn't mean your network\
    \ is empty space in the middle. It's filled with message-aware infrastructure\
    \ and quite often, we build that infrastructure with ØMQ. The ØMQ plumbing can\
    \ range from tiny pipes to full-blown service-oriented brokers. The messaging\
    \ industry calls this intermediation, meaning that the stuff in the middle deals\
    \ with either side. In ØMQ, we call these proxies, queues, forwards, device, or\
    \ brokers, depending on the context.\n\nThis pattern is extremely common in the\
    \ real world and is why our societies and economies are filled with intermediaries\
    \ who have no other function than to reduce the complexity and scaling costs of\
    \ larger networks. Real-world intermediaries are typically wholesalers, distributors,\
    \ managers, and so on.\n\n# The Dynamic Discovery Problem\n\nOne of the problems\
    \ is when you design large distributed architectures for discovery. That is, how\
    \ do pieces know about each other? It's especially difficult if pieces come and\
    \ go, thus we can call this the “dynamic discovery problem”."
