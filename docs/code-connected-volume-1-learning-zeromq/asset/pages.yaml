    # High-Speed Subscribers (Black Box Pattern)


    Now lets at one way to make our subscribers faster. A common use case for pub-sub
    is distributing large data streams like market data coming from stock exchanges.
    A typical setup would have a publisher connected to a stock exchange, taking price
    quotes, and sending them to a number of subscribers. If there are a handful of
    subscribers, we could use TCP. If we have a larger number of subscribers, we''d
    probably use reliable multicast, i.e., PGM.


    Let''s imagine our feed has an average of 100,000 100-byte messages a second.
    That''s a typical rate, after filtering market data we don''t need to send to
    subscribers. Now we decide to record a day''s data (maybe 250 GB in 8 hours),
    and then replay it to a simulation network, i.e., a small group of subscribers.
    While 100K messages a second is easy for a ØMQ application, we want to replay
    it much faster.


    So we set up our architecture with a bunch of boxes—one for the publisher and
    one for each subscriber. These are well-specified boxes—eight cores, twelve for
    the


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_246_0.png)'
