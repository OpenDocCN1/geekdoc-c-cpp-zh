    # High-Level Messaging Patterns


    These four core patterns are cooked into ØMQ. They are part of the ØMQ API, implemented
    in the C++ library, and are guaranteed to be available in all retail stores.


    On top of these, we add high-level messaging patterns. These high-level patterns
    on top of ØMQ and implement them in whatever language we’re using for our application.
    They are not part of the core library, do not come with the ØMQ package, and exist
    in their own space as part of the ØMQ community. For example the Majordomo pattern,
    which we explore inReliable-Request-Reply Patterns”, sits in the GitHub Majordomo
    project in the ZeroMQ organization.


    One of the things we provide to you in this guide is a set of such high-level
    patterns, both small (to handle messages sanely) and large (to make a reliable
    pub-sub architecture).


    # Working with Messages


    The libzmq library has function in two APIs to send and receive messages. The
    zm_send() and zm_recv() methods that we’ve already seen and used are simple liners.
    We will use these often, but zm_recv() is at dealing with arbitrary message buffer
    size. So there’s a second API that works with zm_msg_t structures, with a richer
    but more difficult API:


    +   * Initialise a message: zm_msg_init(), zm_msg_init_size(), zm_msg_init_data().

    * Sending and receiving a message: zm_msg_send(), zm_msg_recv().

    * Release a message: zm_msg_close().

    * Access message content: zm_msg_data(), zm_msg_size(), zm_msg_more().

    * Work with message properties: zm_msg_get(), zm_msg_set().

    * Message manipulation: zm_msg_copy(), zm_msg_move().'
