  md: 'It takes weeks to learn use, and months to create stable architectures that
    don’t crash when things get hairy.


    Most projects, like AMQP, that try to solve this long list of problems in a reusable
    way so by inventing a new concept, the “broker”, that does addressing, routing,
    and queuing. This results in a client/server protocol or a set of APIs on top
    allow applications to speak to this broker. Brokers are an excellent thing in
    reducing the complexity of large networks. By adding broker-based messaging to
    a product like Zookeeper would make it worse, not better. It would mean adding
    an additional big box, and a new single point of failure. A broker rapidly becomes
    a bottleneck and a risk to manage. If the software it supports, we can add a second,
    third, and fourth broker and make some failover scheme. People do this. It creates
    more moving pieces, more complexity, and more things to think.


    And a broker-centric setup needs its own operations team. You literally need to
    watch the brokers day and night, and beat them with a stick when they misbehaving.
    It is is only worth doing for large applications with many moving pieces, built
    by several teams of people over several years.


    So small to medium application developers are trapped. Either they avoid programming
    and make monolithic applications that do not scale. Or they jump into network
    programming and make brittle, complex applications that are hard to maintain.
    Or they bet on a messaging product, and end up with scalable applications that
    depend on expensive, easily broken technology. There has been no good choice,
    which is why maybe messaging is largely stuck in the last century and stirs strong
    emotions: negative ones for users, gleeful joy for those selling support and licenses
    (see figure 8).


    What we need is something that does the job of messaging, but does it in such
    simple and cheap way that it can work in any application, with close to zero cost.
    It should be a library which you just link, without any other dependencies. No
    additional moving pieces, so no additional risk. It should run on any OS and work
    with any programming language.


