    # # Slow Subscriber Detection (Suicidal Snail Pattern)


    A common problem you will hit when using the pub-sub pattern in real life is the
    slow subscriber. In an ideal world, we stream data at full speed from publishers
    to subscribers. In reality, subscriber applications are often written in interpreted
    languages, or just do a lot of work, or are just badly written, to the extent
    that they can''t keep up with publishers.


    How do we handle a slow subscriber? The ideal fix is to make the subscriber faster,
    but that might take work and time. Some of the classic strategies for handling
    a slow subscriber are:


    +   **Queue messages on the publisher.** This is what Gmail does when I don''t
    read my email for a couple of hours. In high-volume messaging, pushing queues
    upstream has the thrilling but unprofitable result of making publishers out of
    memory and crash—especially if there are lots of subscribers and it''s not possible
    to flush for performance reasons.

    **Queue messages on the subscriber.** This is much better, and it''s what ØMQ
    does by default the network can keep up with things. If anyone''s going to run
    out of memory and crash, it''ll be the subscriber rather than the publisher, which
    is fair. This is perfect for “peaky” streams where a subscriber can''t keep up
    for a while, but can catch up when the stream slows down. However, it''s no answer
    to a subscriber that is too slow in general.

    **Stop queuing new messages after while.** This is what Gmail does when my mailbox
    overflows with its precious gigabytes of space. New messages get rejected or dropped.
    This is a great strategy from the perspective of the publisher, and it''s what
    ØMQ does when the publisher sets a HWM. However, it still doesn''t help us fix
    the slow subscriber. Now we get gaps in message stream.

    Punish slow subscribers with disconnect.** This is what Hotmail (remember that?)
    did when I didn''t log in for two weeks, which is why I was on my fifteenth Hotmail
    account when it hit me that there was perhaps a better way. It''s a nice brutal
    strategy that forces subscribers to sit up and pay attention and would be ideal,
    but ØMQ doesn''t do this, and there''s no value to layer it on top because subscribers
    are invisible to publisher applications.


    None of these classic strategies fit, so we need to get create. Rather than disconnect
    the publisher, let''s convince the subscriber to kill itself. This is the Suicidal
    Snail pattern. When a subscriber detects that it''s running too slowly (where
    “too slowly”) is'
