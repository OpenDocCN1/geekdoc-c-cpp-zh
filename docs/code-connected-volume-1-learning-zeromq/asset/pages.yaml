  md: "Now let’s look at the load balancing algorithm. It requires that both clients\
    \ and workers use REQ sockets, and that workers correctly store and replay the\
    \ envelope on messages they get. The algorithm is:\n\n+   - Create a polset that\
    \ always polls the backend, and polls the frontend only if there are one or more\
    \ workers available.\n\n+   - Poll for activity with infinite timeout.\n\n+  \
    \ - If there is activity on the backend, we either have a “ready” message or a\
    \ reply for a client. In either case, we store the worker address (the first part)\
    \ on our worker queue, and if the rest is a client reply, we send it back to that\
    \ client via the frontend.\n\n+   - If there is activity on the frontend, we take\
    \ the client request, pop the next worker (which is the last), and send the request\
    \ to the backend. This means sending the worker address, empty pant, and the three\
    \ parts of the client request.\n\nYou should now see that you can reuse and extend\
    \ the load balancing algorithm with variations based on the information the worker\
    \ provides in its initial “ready” message. For example, workers might start up\
    \ and do a performance test, tell the broker how fast they are. The broker can\
    \ then choose the fastest available worker rather than the oldest.\n\n# A High-Level\
    \ API for ØMQ\n\n# Making a Detour\n\nWe’re going to push request-reply-onto the\
    \ stack and open a different area, which is the ØMQ API itself. There’s a reason\
    \ for this detour: as we write more complex examples, the low-level ØMQ API starts\
    \ to look increasingly clumsy. Look at the core of the worker thread from our\
    \ load balancing broker:\n\n```\nwhile (true) {\n    // Get address frame and\
    \ empty delimiter\n    char *address = s_recv(worker);\n    char *empty = s_recv(worker);\n\
    \    assert (*empty == 0);\n    free(empty);\n\n    // Get request, send reply\n\
    \    char *request = s_recv(worker);\n    printf(\"Worker: %s\\n\", request);\n\
    \    free(request);\n\n    s_sendmore(worker, address);\n    s_sendmore(worker,\
    \ \"\");\n    s_send (worker, \"OK\"); }\n```"
