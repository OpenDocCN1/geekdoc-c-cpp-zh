    - The examples use five-second heartbeats, mainly to reduce the amount of output\
    \ when you use tracing. Realistic values would be lower for most LAN applications.\
    \ However, any retry has be too slow to allow for a service to restart, say 10\
    \ seconds at least.\n\nWe later improved and extended the protocol and the Majordomo\
    \ implementation, which now sits in its own GitHub project. If you want a properly\
    \ usable Majordomo stack, use our GitHub.\n\n# Asynchronous Majordomo Pattern\n\
    \nThe Majordomo implementation in the previous section is simple and stupid. The\
    \ client is just the original Simple Pirate, wrapped up in a sexy API. When I\
    \ fire up a client, broker, and worker on a test box, it can process 100,000 requests\
    \ in about 14 seconds. That is partially due to the code, which cheerfully copies\
    \ message frames as if CPU cycles were free. The real problem is that we're doing\
    \ network round-trips. OMQ disables Nagle's algorithm, but round-tripping is still\
    \ slow.\n\nTheory is great in theory, but in practice, practice is better. Let's\
    \ measure the actual cost of round-tripping with a simple test program. This sends\
    \ a bunch of messages, first waiting for a reply to each message, and second as\
    \ a batch, reading all the replies as a batch. Both approaches do the same work,\
    \ but they give very different results. We mock up a client, broker, and worker:\n\
    \nExample 48. Round-trip demonstrator (tripping.c)\n\n```\n// Round-trip demonstrator\n\
