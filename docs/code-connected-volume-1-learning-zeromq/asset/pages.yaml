    Here are some things to note about the worker API code:


    +   - The APIs are single-threaded. This means, for example, that the worker won’t
    send heartbeats in the background. Happily, this is exactly what we want: if the
    worker application gets stuck, heartbeats will stop and the broker will stop sending
    requests to the worker.

    - The worker API doesn’t do an exponential back-off; it’s not worth the extra
    complexity.

    - The APIs don’t do any error reporting. If something isn’t as expected, they
    raise an assertion (or exception depending on the language). This is ideal for
    a reference implementation, the API should be robust against invalid messages.


    You might wonder why the worker API is manually closing its socket and opening
    a new one, when ØMQ will automatically reconnect a socket if the peer disappears
    and comes back. Look back at the Simple and Pirate workers to understand. Although
    ØMQ will automatically reconnect workers if the broker dies and comes back up,
    it isn’ not sufficient to re-register the workers with the broker. I know of at
    least two solutions. The simplest, which we use here, is for the worker to monitor
    the connection using heartbeats, and if it decides the broker is dead, to close
    its socket and start afresh with a new socket. The alternative is for the broker
    to challenge unknown workers when it gets a heartbeat from the worker and ask
    them to re-register. That require protocol support.


    Now let’s define the Majordomo broker. Its core structure is a set of queues,
    one per service. We will create these queues as workers appear (we could delete
    them as workers disappear, but forget that for now because it gets complex). Additionally,
    we keep a queue of workers per service.


    And here is the broker:


    ```

    Example 47. Majordomo broker (mdmajordomo.c)

    // Majordomo Protocol broker

    // A minimal C implementation of the Majordomo Protocol as defined in

    // http://rfc.zeromq.org/spec:7 and http://rfc.zeromq.org/spec:8.


    #include "czmq.h"

    #include "mdp.h"


    // We''d normally pull these from config data


    #define HEARTBEAT_LIVENESS 3    // 3-5 is reasonable

    #define HEARTBEAT_INTERVAL 2500 // msecs

    #define HEARTBEAT_EXPIRY HEARTBEAT_INTERVAL * HEARTBEAT_LIVENESS

    ```'
