  md: "content printable string data, sometimes as binary blobs. And we have technical\
    \ challenges, especially if we want to avoid copying data around too much.\n\n\
    The challenge of making a good API affects all languages, though my specific use\
    \ case is C. Whatever language you use, think about how you could contribute to\
    \ your language binding to make it as good (or better) than the C binding I'm\
    \ going to describe.\n\n# Features of a Higher-Level API\n\nMy solution is to\
    \ use three fairly natural and obvious concepts: string (already the basis for\
    \ our s_send and s_recv) helpers, frame (a message frame), and message (a list\
    \ of one or more frames). Here is the worker code, rewritten onto an API using\
    \ these concepts:\n\n```\nwhile (true) {\n    zmsg_t *msg = zmsg_recv (worker);\n\
    \    zframe_reset(zmsg_last (msg), \"OK\", 2);\n    zmsg_send (msg, worker);\n\
    }\n```\n\nCutting the amount of code we need to read and write complex messages\
    \ is great: the results are easy to read and understand. Let's continue this process\
    \ for other aspects of working with ØMQ. Here is a list of things I'd like in\
    \ a higher-level API, based on my experience with ØMQ so far:\n\n+   - Automatic\
    \ handling of sockets. If it is cumbersome to close sockets manually, and to have\
    \ explicitly define the linger timeout in some (but not all) cases. It'd be great\
    \ to have a way to close sockets automatically when I close the context.\n\n+\
    \   - Portable thread management. Every nontrivial ØMQ application uses threads,\
    \ but POSIX threads aren't portable. So decent high-level API should hide this\
    \ under a portable layer.\n\n+   - Piping from parent to child threads. It's a\
    \ recurrent problem: how to signal between parent and child threads. Our API should\
    \ provide a ØMQ message pipe (using PAIR sockets and inproc automatically).\n\n\
    +   - Portable clocks. Getting time to a millisecond resolution, or sleeping for\
    \ some milliseconds, is not portable. Realistic ØMQ applications need portable\
    \ clocks, so our API should provide them.\n\n+   - A reactor to replace zm_poll().\
    \ The poll loop is simple, Writing a list of these, we end up doing the same work\
    \ over and over: calculating timers, and calling code when sockets are ready.\
    \ A simple reactor with socket readers would save a lot of repeated work.\n\n\
    +   - Proper handling of Ctrl-C. We already saw how to catch an interrupt. It\
    \ would be useful if this happened in all applications."
