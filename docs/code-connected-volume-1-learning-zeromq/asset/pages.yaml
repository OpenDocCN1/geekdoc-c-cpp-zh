  md: 'Code Connected Volume 1 - Chapter 4. Reliable-Request-Reply Patterns


    sporadically connected (think of email as an analogy), we can''t use a stateless
    network between clients and workers. We have to put state in the middle.


    So, here''s the Titanic pattern (see figure 51), in which we write messages to
    disk to ensure they never get lost, no matter how sporadically connected clients
    and workers are connected. As we did for service discovery, we''re going to layer
    Titanic on top of MDP rather than extend it. It''s wonderfully lazy because it
    means we can implement our-and-forget reliability in a specialized worker, rather
    than in the broker. This is excellent for several reasons:


    +   - It is much easier because we divide and conquer: the broker handles message
    routing and the worker handles reliability.

    - It lets us mix written in one language with workers written in another.

    - It lets us evolve the fire-and-forget technology independently.


    The only downside is that there''s an extra network hop between broker and hard
    disk. The benefits are easily worth it.


    There are many ways to make a persistent request-reply architecture. We''ll aim
    for one that is simple and painless. The simplest design I could come up with,
    after playing with this for a few hours, is "proxy service". That is, Titanic
    doesn''t affect workers at all. If a client wants a reply immediately, it talks
    directly to a service and hopes the service is available. If a client is happy
    to wait a while, Titanic instead and asks, ''hey, buddy, would you take care of
    me while I go my groceries?''


    | Client | Client | Client |

    | :--- | :--- | :--- |

    | Titanic, give me coffee | | "Titanic, give me tea" |

    | | Broker | Titanic | Disk |

    | "Water" Worker | "Tea" Worker | "Coffee" Worker |


    Figure 51. The Titanic Pattern


    Titanic is thus both a worker and a client. The dialog between client and Titanic
    goes along these lines:


    +   - Client: Please accept this request for me. Titanic: OK, done.'
