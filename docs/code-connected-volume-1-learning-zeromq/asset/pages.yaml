  md: 'I''d like credit, and have no argument against others making money from their
    remixes. Thus, the text is licensed under cc-by-sa.


    For the examples, we started with GPL, but it rapidly became clear this wasn''t
    workable. The point of examples is to give people reusable code fragments so they
    will use OMQ widely, and if these are GPL that won''t happen. We switched to MIT/X11,
    even for the larger and more complex examples that conceivably work as LGPL.


    However when we started turning the examples into stand-alone projects (as with
    Majordomo), we used the LGPL. Again, remixability trumps dissemination. Licenses
    are tools, use them with intent, not ideology.


    # Code Connected Volume 2


    That''s the end of Volume 1. If you''ve worked your way through the examples and
    understand how they work, thank you for your patience and hard work. You can now
    rank yourself as a professional-grade OMQ developer.


    In the next volume, “Code Connected Volume 2”, we''ll take it to the next level.
    Writing code is one thing. Making successful products is something else. In the
    next book you''ll learn how to do large-scale software architecture. I''ll introduce
    a set of techniques of software development, and demonstrate them with worked
    examples, starting with OMQ itself and ending with a general-purpose framework
    for distributed applications (Zyre). These techniques are independent of license,
    though open source amplifies them.'
