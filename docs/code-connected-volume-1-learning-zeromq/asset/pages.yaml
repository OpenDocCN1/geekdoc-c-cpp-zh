  md: "# Code Connected Volume 1 - Chapter 5. Advanced Pub-Sub Patterns\n\nThis frame\
    \ is not shown in the commands explained below.\n\n# State Synchronization\n\n\
    The client MUST start by sending an ICANHAZ command to its snapshot connection.\
    \ This command consists of two frames as follows:\n\n```\nICANHAZ command\n-----------------------------\n\
    Frame 0: \"ICANHAZ?\"\nFrame 1: subtree specification\n```\n\nBoth frames are\
    \ ØMQ strings. The subtree specification MAY be empty. If not, it consists of\
    \ a slash followed by one or more path segments, ending in a slash.\nThe server\
    \ MUST respond to an ICANHAZ command by sending zero or more KVSYNC commands to\
    \ its snapshot port, followed by a KTHXBAI command. The server MUST prefix each\
    \ command with the identity of the client, as provided by ØMQ with the ICANHAZ\
    \ command. The KVSYNC command specifies a key-value-pair value as follows:\n\n\
    ```\nKVSYNC command\n-----------------------------\nFrame 0: key, as ØMQ string\n\
    Frame 1: sequence number, 8 bytes in network order\nFrame 2: <empty>\nFrame 3:\
    \ <empty>\nFrame 4: value, as blob\n```\n\nThe sequence number has no significance\
    \ and may be zero.\nTheTHXBAI command takes this form:\n\n```\nKTHXBAI command\n\
    -----------------------------\nFrame 0: \"KTHXBAI\"\nFrame 1: sequence number,\
    \ 8 bytes in network order\nFrame 2: <empty>\nFrame 3: <empty>\nFrame 4: subtree\
    \ specification\n```\n\nThe sequence number MUST be the highest sequence number\
    \ of the KVSYNC commands previously sent.\n the client has received a KTHXBAI\
    \ command, it SHOULD start to receive messages from its subscriber connection\
    \ and apply them.\n\n# Server-to-Client Updates"
