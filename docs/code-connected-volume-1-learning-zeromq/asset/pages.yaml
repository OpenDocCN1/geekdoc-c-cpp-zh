    \ handles these commands as well as talking to the server(s). Here is the agent's\
    \ logic:\n\n+   1. Start by getting a snapshot from the first server\n2. When\
    \ we get a snapshot to reading from the subscriber socket.\n3. If we don't get\
    \ a snapshot then fail over to the second server.\n4. Poll on the pipe and the\
