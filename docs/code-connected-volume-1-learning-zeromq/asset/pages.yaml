    And here''s the asynchronous client, with a single worker:


    ```

    $ time mdclient2

    100000 replies received


    real Om8.730s

    user Om0.920s

    sys Om1.550s

    ```


    Twice as fast. Not bad, but let''s fire up 10 workers and see how it handles the
    traffic


    ```

    $ time mdclient2

    100000 replies received


    real Om3.863s

    user Om0.730s

    sys Om0.470s

    ```


    It isn''t fully asynchronous because workers get their messages on a strict-used
    basis. It will scale better with more workers. On my PC, after eight or so workers,
    it doesn''t get any faster. Four cores only stretches so far. But we got a 4x
    improvement in throughput with just a few minutes'' work. The broker is still
    unoptimized. Most of its time copying messages around, instead of doing zero-copy,
    which it could. But we''re getting 25K reliable request/reply calls a second,
    with pretty little effort.


    However, asynchronous Majordomo pattern isn''t all roses. It has a fundamental
    weakness, namely that it cannot survive a broker crash without more work. If you
    look at mdclient code you''ll see it does not attempt to reconnect after a failure.
    A proper reconnect would require the following:


    +   - A number on every request and a matching number on every reply, which would
    ideally require a change to the protocol to enforce.

    - Tracking and holding onto all outstanding requests in the client API, i.e.,
    those for which no reply has yet been received.

    - In case of failure, for the client API to resend all outstanding requests to
    the broker.'
