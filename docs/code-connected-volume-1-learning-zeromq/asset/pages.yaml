  md: 'There are several solutions to dynamic discovery. The simplest is to entirely
    avoid it by hard-coding (or configuring) the network architecture so discovery
    is done by hand. That is, when you add a new piece, you reconfigure the network
    to know about it.


    In practice, this leads to increasingly fragile and unwieldy architectures. Let''s
    say you have one publisher and a hundred subscribers. You connect each subscriber
    to the publisher by configuring a publisher endpoint in each subscriber. That''s
    easy (see figure 12). Subscribers are dynamic; the publisher is static. Now you
    may add any more. If you continue to connect each subscriber to each publisher,
    the cost of avoiding discovery gets higher and higher.


    There are quite a few answers to this, but the very simplest is to avoid an intermediary;
    that is, a static point in the network to which all other nodes connect. In classic
    messaging, this is the job of the message broker. OMQ doesn''t come with a message
    broker as such, but it lets us build intermediaries quite easily.


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_47_0.png)


    You might wonder, if all networks eventually get large to need intermediaries,
    why we don''t simply have a message broker in place for all applications? For
    beginners, it''s a fair compromise. Just use a star topology, forget about performance,
    and things will usually work. However, message brokers are greedy things; in their
    role as central intermediaries, they become too complex, too stateful, and eventually
    a problem.


    Figure 12. Small-Scale Pub-Sub Network


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_47_1.png)


    Figure 13. Pub-Sub Network with a Proxy'
