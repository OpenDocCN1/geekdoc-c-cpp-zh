  md: '“Extra Spicy Sockets!”, which leaves us with a strange craving for pizza and
    a desire to know more.


    Like a savory dish, ØMQ sockets are easy to digest. Sockets have a life in four
    parts, just like BSD sockets:


    +   - Creating and destroying sockets, which go together to form a karmic circle
    of socket life (see `zmq_socket()`, `zmq_close()`).

    - Configuring sockets by setting options on them and checking if necessary (see
    `zmq_setsockopt()`, `zmq_getsockopt()`).

    - Plugging sockets onto the network topology by creating ØMQ connections to and
    from them (see `zmq_bind()`, `zmq_connect()`).

    - Using the sockets to carry data by writing and receiving messages on them (see
    `zmq_send()`, `zmq_recv()`).


    Note that sockets are always pointers, and messages (which we''ll come to very
    soon) are structures. In C you pass sockets as such, but you pass addresses of
    messages in all functions that work with messages, like `zmq_send()` and `zmq_recv()`.
    As a mnemonic, realize that in ØMQ, all your sockets are belong to us, but messages
    are things you call in your code.


    Creating, destroying, and configuring sockets works as you''d expect for any object.
    But remember that ØMQ is an asynchronous, elastic fabric. This has some impact
    on how we plug sockets into the network topology and how we use the sockets after
    that.


    # Plugging Sockets into the Topology


    To create a connection between two nodes, you use `zmq_bind()` in one node and
    `zmq_connect()` in the other. As a general rule of thumb, the node that sits on
    a well-known network address, and the node which does `zmq_bind()` is a “server”,
    while `zmq_connect()` is a “client”, with unknown or arbitrary network addresses.
    We say that we “bind a socket to an endpoint” and “connect a socket to an endpoint”,
    the endpoint being that-well-known network address.


    ØMQ connections are different from classic TCP connections. The main notable differences
    are:


    +   - They go across an arbitrary transport (inproc, ipc, tcp, pgm, and epgm).
    See `zmq_inproc()`, `zmq_ipc()`, `zmq_tcp()`, `zmq_pgm()`, and `zmq_epgm()`.

    - One socket may have many outgoing and incoming connections.

    - There is no `zmq_accept()` method. When a socket is bound to an endpoint it
    automatically starts connections.

    - The network connection itself happens in the background, and ØMQ will automatically
    reconnect if the network connection is broken (e.g., if the peer disappears and
    then comes back).

    - Your application code cannot work with these connections directly; they are
    encapsulated under the socket.'
