    \   break;\n\n    // Get request, send reply\n    char request = [256];\n    int\
    \ request_size = zmq_recv(worker, request, 255, 0);\n    if (request_size == -1)\n\
    \        return NULL;\n    request[request_size] = 0;\n    printf(\"Worker: %s\"\
    , request);\n\n    zmq_send(worker, address, address_size, ZMQ_SNDMORE);\n   \
    \ zmq_send(worker, empty, 0, ZMQ_SNDMORE);\n    zmq_send(worker, \"OK\", 2, 0);\n\
    }\n```\n\nAnd when code is too long to write quickly, it's also too long to understand.\
    \ Until now, I've stuck to the native API because, as ØMQ users, we need to know\
    \ intimately. When it gets in our way, we have to treat it as a problem to solve.\n\
    \nWe can't course just change the ØMQ API, which is a documented public contract\
    \ on which thousands of people agree and depend. Instead, we construct a higher-level\
    \ API on top based of our experience so far, and most specifically, our experience\
    \ from writing complex request-reply patterns.\n\nWhat we want is an API that\
    \ lets us receive and send an entire message in one shot, including the envelope\
    \ with any number of reply addresses. That lets us do what we want with the absolute\
    \ least lines of code.\n\nMaking a good message API is fairly difficult. We have\
    \ a problem of terminology: ØMQ uses \"message\" to describe both multipart messages,\
    \ and individual message frames. We have a problem of expectations: sometimes\
    \ it's natural to see message"
