  md: 'Code Connected Volume 1 - Chapter 2. Sockets and Patterns


    # ØMQ is Not a Neutral Carrier


    A common question that newcomers to ØMQ ask (it’s one I’ve asked myself) is, “how
    do I write an XYZ server in ØMQ?” For example, “how do I write an HTTP server
    in ØMQ?” The implication is that we use normal sockets to carry HTTP requests
    and responses, we should be able to use ØMQ sockets to the same, only much faster
    and better.


    The answer to “this is not how it works”, ØMQ is not a neutral carrier, it imposes
    a framing on the transport protocols it uses. This framing is not compatible with
    existing protocols, which tend to use their own framing. For example, compare
    an HTTP request and a ØMQ request, both over TCP/IP.


    The HTTP request uses CR-LF as its simplest framing (see figure 10), whereas ØMQ
    uses a length-specified frame (see figure 11). You could write an HTTP-like protocol
    using ØMQ, using example the request-reply socket pattern. But it would not be
    HTTP.


    | GET /index.html | 13 | 10 | 13 | 10 |


    Figure 10. HTTP on the Wire


    Since v3.3, however, ØMQ has a socket option called ZMQ_ROUTER RAW allows you
    to read and write without the ØMQ. You could use this to read and write HTTP requests
    and responses. Hardeep Singh contributed this change so his ØMQ application. At
    time of writing this is still somewhat experimental, but it shows how ØMQ keeps
    evolving to solve new problems. Maybe the next patch will be yours.


    | 5 | H | E | L | L | 0 |


    Figure 11. ØMQ on the Wire


    # I/O Threads


    We said that ØMQ does I/O in a background thread. One I/O thread (for all sockets)
    is sufficient for all but the most extreme applications. When you create a new
    context, it starts with one I/O thread. The general rule of thumb is to use one
    I/O thread per gigabyte of data in or out second. To reason `zmq_ctx_set()` before
    creating any sockets:


    ```

    int io_threads = 4;

    void *context = zmq_ctx_new();

    zmq_ctx_set(context, ZMQ_IO_THREADS, io_threads);

    asert (zmq_ctx_get(context, ZMQ_IO_THREADS) == io_threads);

    ```


    We’ve seen that one socket can handle dozens, thousands of connections at once.
    This has a fundamental impact on how you write applications. A traditional networked
    application has one process or one thread per remote connection, and that thread
    handles one socket. ØMQ lets you collapse this entire structure into a single
    process and then break it up as necessary for scaling.'
