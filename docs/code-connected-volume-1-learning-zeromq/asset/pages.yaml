    The pipeline pattern also exhibits the “slow joiner” syndrome, leading to accusations
    that PUSH sockets don''t load balance properly. If you are using PUSH and PULL,
    and one of your workers gets away more messages than the others, because that
    PULL socket has joined faster than the others, and grabs a lot of messages before
    the others manage to connect. If you want load balancing, you probably want to
    look at The load balancing pattern in “Advanced Request-Reply Patterns”.


