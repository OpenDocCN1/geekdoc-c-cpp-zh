  md: '# Code Connected Volume 1 - Chapter 4. Reliable Request-Reply Patterns


    The broker and worker are unchanged because we''ve not modified the protocol at
    all. We see an immediate improvement in performance. Here''s the synchronous client
    chugging through 100K request-reply cycles:


    ```

    $ time mdclient

    100000 requests/replies processed


    real Om14.088s

    user Om1.310s

    sys Om2.670s

