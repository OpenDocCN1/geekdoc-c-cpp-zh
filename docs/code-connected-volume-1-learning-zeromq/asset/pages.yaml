  md: '# Code Connected Volume 1 - Chapter 3. Advanced Request-Reply-Patterns


    ID, printing out the replies they get from the server. Look carefully and you''ll
    see each client task gets 0 or more replies per request.


    Some comments on this code:


    +   The clients send a request once per second, and get zero or more replies back.
    To make this work using `zmq_poll()`, we can''t simply poll with a 1-second timeout,
    and we''d end sending a new request only *after we received the last reply*. So
    we poll at a high frequency (100 times at 1/100th of a second per poll), which
    is approximately accurate.


    +   The server uses a pool of worker threads, each processing one request synchronously.
    It connects to its frontend socket using an internal call (see figure 38).


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_109_0.png)


    Note that we''re doing DEALER to ROUTER dialog between client and server, but
    internally between the server main thread and workers; if we were strictly synchronous,
    we would use REP. However, because we want to send multiple replies, we need an
    async socket. We *do not want* to route replies, they always go to the single
    server thread that sent us the request.


    Let''s talk about the routing envelope. The client sends a message consisting
    of a single frame. The server thread receives a two-frame message (original message
    prefixed by client identity). We send these two frames to the worker, which treats
    it as a normal reply envelope, which returns to us as a two frame message. We
    then use the first frame as an identity to route the second frame back to the
    client as a reply.


    It looks something like this:


    ```

    client             server             frontend             worker

    [ DEALER ]---->[ ROUTER <----> DEALER <----> DEALER ]

    1 part               2 parts             2 parts

    ```


    Figure 38. Detail of Asynchronous Server'
