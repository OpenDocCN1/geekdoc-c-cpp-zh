    # Getting an Out-of-Band Snapshot


    Now so we have our second problem: to deal with late-joining clients or clients
    that crash and then restart.


    In order to allow a (or recovering) client to catch up with a server, it has to
    get a snapshot of the server’s state. As we’ve reduced “state” to mean “a sequenced
    key-value pair”, we can reduce “state” to mean “a hash table”. To get the server
    state, a client opens a DEALER socket and asks for it explicitly (see figure 59).


    To make this work, we have to solve a problem of timing. Getting a state snapshot
    will take a certain time, possibly fairly long if the snapshot is large. We need
    to correctly apply updates to the snapshot. The server won’t know when to start
    updates. One way would be to start subscribing, get a first update, and then ask
    for “state for update N”. This would require the server storing one snapshot for
    each update, which isn’t practical.


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_259_0.png)


    So we will do the synchronization in the client, as follows:


    +   - The client first subscribes to updates and then makes a state request. This
    guarantees that the state is going to be newer than the oldest update it has.

    - The client waits for the server to reply with state, and meanwhile queues all
    updates. It does this simply by not reading them: ØMQ keeps them queued on the
    socket queue.

    - When the client receives its state update, it begins again to read updates.
    However, it discards any updates that are older than the state update. So if the
    state update includes updates up to 200, the client will discard updates up to
    201.

    - The client then applies updates to its own state snapshot.'
