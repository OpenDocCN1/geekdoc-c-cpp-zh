    \ can't prioritize our servers, i.e., Primary, then Secondary.\n- Con: the server\
    \ can do at most one request at a time, period.\n\n# Model Three: Complex and\
    \ Nasty\n\nThe shotgun approach seems too good to be true. Let's scientific and\
