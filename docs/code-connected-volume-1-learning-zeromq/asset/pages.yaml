  md: '# Warning: Unstable Paradigms!


    Traditional network programming is built on the general assumption that one socket
    talks to one connection, one peer. There are multicast protocols, but these are
    exotic. When we assume "one socket = one connection", we scale our architectures
    in certain ways. We create threads of logic where each thread work with one socket,
    one peer. We place intelligence and state in these threads.


    In the Ø universe, sockets are doorways to fast little background communications
    that manage a whole set of connections automatically for you. You can''t see,
    work with, open, close, or attach to these connections. Whether you use blocking
    send or receive, or poll, all you can talk to is the socket, the connections it
    manages for you. The connections are private and invisible, and this is the key
    to ØMQ''s scalability.


    This is because your code, talking to a socket, can then handle any number of
    connections across whatever network protocols are around, without change. A messaging
    pattern sitting in ØMQ scales much more cheaply than a messaging pattern sitting
    in your application code.


    So the general assumption no longer applies. As you read the code examples, your
    brain will try to map them to what you know. You will read "socket" and think
    "ah, that represents a connection to another node". That is wrong. You will read
    "thread", and again your brain will think, "ah, a thread represents a connection
    to another node", and your brain will be wrong.


    If you''re reading this Guide for the first time, realize that until you actually
    write ØMQ code for a day or two (and maybe three or four days), you may feel confused,
    especially by how simple ØMQ makes things for you, and you may try to impose that
    general assumption on ØMQ, and it won''t work. And then you will experience your
    moment of enlightenment and trust, that zap-pow-kaboomatori paradigm-shift moment
    when it becomes clear.'
