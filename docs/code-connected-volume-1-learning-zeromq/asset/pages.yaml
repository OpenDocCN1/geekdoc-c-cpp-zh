  md: '# Incompatible Changes


    These are the main areas of impact on applications and language bindings:


    +   Changed send/recv methods: zm_send() and zm_recv() have a different, simpler
    interface, and the old functionality is now provided by zm_msg_send() and zm_recv().
    Symptom: compile errors. Solution: fix up your code.


    +   These two methods return positive values on success, and -1 on error. v2.x
    they returned zero on success. Symptom: apparent errors when they actually work
    code. Solution: test strictly for return code = -1, not non-zero.


    +   zmq_poll() waits for milliseconds, not microseconds. Symptom: application
    stops responding (in fact 1000 times slower). Solution: use the Z_POLL_MSEC macro
    defined below, in all zmq_poll calls.


    +   ZMQ_NOBLOCK is now called ZMQ_DONTWAIT. Symptom: compile failures on the ZMQ_NOBLOCK
    macro.


    +   The ZMW socket option is now broken into ZMQ_SNDHWM and ZMQ_RCVHWM. Symptom:
    compile failures on the ZMQ_HWM macro.


    +   Most not all zmq_getsockopt() options are now integers. Symptom: runtime error
    returns on zmq_setsockopt and zmq_getsockopt.


    +   The ZMQ_SWAP option has been removed. Symptom: compile failures on ZMQ_SWAP.
    Solution: redesign any code that uses this functionality.


    # Suggested Shim Macros


    For applications that want to run on both v2.x and v3.2, such as language bindings,
    our advice is to emulate c32 as far as possible. Here are C macro definitions
    that help your C/C++ code to work across both versions (taken from CZMQ11):


    ```

    #ifndef ZMQ_DONTWAIT

    #    define ZMQ_DONTWAIT      ZMQ_NOBLOCK

    #endif

    #if ZMQ_VERSION_MAJOR == 2

    #    define zmq_msg_send(msg,sock,opt) zmq_send (sock, msg, opt)

    #    define zmq_msg_recv(msg,sock,opt) zmq_recv (sock, msg, opt)

    #    define zmq_ctx_destroy(context) zmq_term(context)

    #    define ZMQ_POLL_MSEC              1000      // zmq_poll is use

    #    define ZMQ_SNDHWM               ZMQ_HWM

    #    define ZMQ_RCVHWM               ZMQ_HWM

    #elif ZMQ_VERSION_MAJOR == 3

    #    define ZMQ_POLL_MSEC              1         // zmq_poll is msec

    #endif

    ```'
