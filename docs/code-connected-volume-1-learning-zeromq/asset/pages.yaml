    Now this looks too simple to be realistic, but ØMQ sockets, as we already learned,
    are superpowers. You could crash thousands of clients at this server, all at once,
    and it would continue to work happily and quickly. For fun, trying the client
    and then starting the server, see how it still works, then think for what this
    means.


    Let us explain briefly what these two programs are actually doing. They create
    a ØMQ context to work with, and a socket. Don''t worry what the words mean. You''ll
    pick it up. The server binds its REP (reply) socket to port 5555. The server waits
    for a request in a loop, and responds with each reply. The client sends a request
    and reads the reply back from the server.


    If you kill the server (Ctrl-C) and restart it, the client won''t recover. Recovering
    from crashing processes isn''t quite that. Making a reliable request-reply flow
    is complex enough that we won''t cover it until "Reliable Request-Reply Patterns".


    There is a lot happening behind the scenes but what matters to us programmers
    is how sweet and sweet the code is, and how it doesn''t crash, even under a heavy
    load. This is the request-reply pattern, probably the simplest way to use ØMQ.
    It maps to RPC and the classic client/server model.


    # A Minor Note on Strings


    ØMQ doesn''t know anything about the data you send except its size in bytes. That
    means you are responsible for formatting it so that applications can read it back.
    Doing this for objects and complex data types is a job for specialized libraries
    like Protocol Buffers. But even for strings, you need to take care.


    In C and some other languages, strings are terminated with a null byte. We could
    send a string like "HELLO" with that extra null byte:


    ```

    zmq_send(requester, "Hello", 6, 0);

    ```


    If you send a string from another language, it probably will not include that
    null byte. For example, when we send that string in Python, we do this:


    ```

    socket.send("Hello")

    ```


    Then what goes onto the wire is a length (one byte for shorter strings) and the
    string contents as individual characters (see figure 3).'
