  md: "clients. As you grow the architecture, this becomes inefficient. Clients specialize\
    \ in different areas.\n\nEven when working with a shared store, some clients will\
    \ want to work only with a part of that store, which we call a subtree. The client\
    \ has to request the subtree it makes a state request, and it must specify the\
    \ subtree it subscribes to updates.\n\nThere are couple of common syntaxes for\
    \ trees. One is the path hierarchy, and another is the topic tree. They look like\
    \ this:\n\n+   - Path hierarchy: /some/list/of/paths\n\n+   - Topic tree: /some.list.of.topics\n\
    \nWe'll use the path hierarchy, and extend our client and server so that a client\
    \ can work with a single subtree you'll be able to extend this yourself to handle\
