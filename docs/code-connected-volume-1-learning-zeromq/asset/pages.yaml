    Although the basic approach is Lazy Pirate, the client aims to just get one successful
    reply. We use two techniques, depending on whether you are running a single server
    or multiple servers:


    +   - With a single server, the client will retry several times, exactly as for
    Lazy Pirate.

    - With multiple servers, the client will try each server at most once until it''s
    received a reply or has tried all servers.


    This solves the main weakness of Lazy Pirate, namely that it could not fail over
    to backup or alternate servers.


    However, this design won''t work in a real application. If we''re connecting many
    sockets and our primary server is down, we''re going to experience this painful
    timeout each time.


    # Model Two: Brutal Shotgun Massacre


    Let''s switch our client to use a DEALER socket. Our goal is to make sure we get
    a reply back within the shortest possible time, no matter whether a particular
    server is up or down. Our client takes this approach:


    +   - We set things up, connecting to all servers.

    - When we receive a request, we blast it out as many times as we have servers.

    - We wait for the first reply, and take that.

    - We ignore any other replies.


    What will happen in practice is that when all servers are running, OMQ will distribute
    the requests so that each server gets one request and sends one reply. When any
    server is offline and disconnected, OMQ will distribute the requests to the remaining
    servers. So a server may in some cases get the same request more than once.


    What''s more annoying for the client is that we''ll get multiple replies back,
    but there''s no guarantee we''ll get a precise number of replies. Requests and
    replies can get lost (e.g., if the server crashes while processing a request).'
