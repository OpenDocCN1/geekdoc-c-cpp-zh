  md: "18\n\nCode Connected Volume 1 - Chapter 1. Basics\n\nHere is a tiny program\
    \ that does:\n\nExample 5. ØMQ version reporting (version.c)\n\n```\n// Report\
    \ OMQ version\n\n#include <zmq.h>\n\nint main (void)\n{\n    int major, minor,\
    \ patch;\n    zmq_version(&major, &minor, &patch);\n    printf(\"Current OMQ version\
    \ is %d.%d.%d\\n\", major, minor, patch);\n    return 0;\n}\n```\n\n# Getting\
    \ the Message Out\n\nThe classic pattern is one-way data distribution, in which\
    \ a server pushes updates to a set of clients. Let's see an example that pushes\
    \ out weather updates consisting of a zip code, temperature, and relative humidity.\
    \ We'll generate random values, just like the real weather stations.\n\nHere's\
    \ the server. We'll use port 5556 for this application:\n\nExample 6. Weather\
    \ update server (wuserver.c)\n\n```\n// Weather update server\n// Binds PUB socket\
    \ to tcp://*:5556\n// Publishes random weather updates\n\n#include \"zhelpers.h\"\
    \n\nint main (void)\n{\n    // Prepare our context and publisher\n    void *context\
