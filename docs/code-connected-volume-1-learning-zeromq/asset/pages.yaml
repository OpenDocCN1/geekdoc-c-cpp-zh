  md: 'When the server has an update for its hashmap MUST broadcast this on its publisher
    socket as a KVPUB command. The KVPUB command has this form:


    ```

    KVPUB command

    Frame 0: key, as OMQ string

    Frame 1: sequence number, 8 bytes in network order

    Frame 2: UUID, 16 bytes

    Frame 3: properties, as OMQ string

    Frame 4: value, as blob

    ```


    The sequence number MUST be strictly incremental. The client MUST discard any
    KVPUB commands whose sequence numbers are not strictly greater than the last KTHXBAI
    or KVPUB command received.


    The UUID is optional and frame 2 MAY be empty (size zero). or more instances of
    "name=value" followed by a newline character. The key-value pair has no properties,
    the properties field is empty.


    If the value is empty, the client SHOULD delete its key-value entry with the specified
    key.


    In the absence of other updates the server SHOULD send a HUGZ command at regular
    intervals, e.g., once per second. The HUGZ command has this format:


    ```

    HUGZ command

    Frame 0: "HUGZ"

    Frame 1: 00000000

    Frame 2: <empty>

    Frame 3: <empty>

    Frame 4: <empty>

    ```


    The client MAY treat the absence of HUGZ as an indicator that the server has crashed
    (see Reliability below).


    # Client-to-Server Updates


    When the client has an update for its hashmap, it MAY send this to the server
    via its publisher connection as a KVSET command. The KVSET command has this form:


    ```

    KVSET command

    Frame 0: key, as OMQ string

    Frame 1: sequence number, 8 bytes in network order

    Frame 2: UUID, 16 bytes

    Frame 3: properties, as OMQ string

    Frame 4: value, as blob

    ```


    The sequence number has no significance and may be zero. The UUID SHOULD be a
    universally unique identifier, if a reliable server architecture is used.'
