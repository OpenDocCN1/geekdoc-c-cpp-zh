  md: 'Code Connected Volume 1 - Chapter 1. Basics


    # Getting the Context Right


    ØMQ applications always start by creating a context, and then using that for creating
    sockets. In C, it is the zmq_ctx_new() call. You should create and use exactly
    one context in your process. Technically, the context is the container for all
    sockets in a single process, and acts as the transport for inproc sockets, which
    are the fastest way to connect threads in one process. If at a process has two
    contexts, these are like separate ØMQ instances. If that explicitly what you want,
    OK, but otherwise remember:


    Do one zmq_ctx_new() at start of your main line, and one zmq_ctx_destroy() at
    the end.


    If you''re using the fork() system call, each process needs its own context. If
    you do zmq_ctx_new() in the main process before calling fork(), the child processes
    get their own contexts. In general, you want to do the interesting stuff in the
    child processes and just manage these from the parent process.


    # Making a Clean Exit


    Class programmers share the same motto as classy hit men: always clean-up when
    you finish the job. When you use ØMQ in a language like Python, stuff gets automatically
    freed for you. But when using C, you have to carefully free objects when you''re
    finished with them or you get memory leaks, unstable applications, and generally
    bad karma.


    Memory leaks are one thing, but ØMQ is quite finicky about how you exit an application.
    The reasons are technical and painful, and the upshot is if you leave any sockets
    open, zmq_ctx_destroy() will by default wait if there are pending sockets or sends
    unless you set the LINGER to zero on those sockets before closing them.


    The ØMQ objects we need to worry about are messages, sockets, and contexts. Luckily
    it''s quite simple, at least in simple programs:


    +   - Use zmq_send() and zmq_recv() when you can, as it avoids the need to work
    with zmq_msg_t objects.

    - If you do not use zmq_msg_recvv() , always release the received message as soon
    as you''re done with it, by calling zmq_msg_close().

    - If you are opening and closing a lot of sockets, that''s probably a sign that
    you need to redesign your application. In some case socket handles won''t be freed
    until you destroy the context.

    - When you exit the process, close your sockets and then call zmq_ctx_destroy().
    This destroys the context.


    This is at least the case for C development. In a language with automatic object
    destruction, sockets and contexts will be destroyed as you leave the scope. If
    you use'
