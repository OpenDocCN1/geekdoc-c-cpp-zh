  md: '# # Chapter 4. Reliable Request-Reply Patterns


    "Advanced Request-Reply Patterns" covered advanced uses of ØMQ''s request-reply
    pattern with working examples. This chapter looks at the general question of reliability
    and builds a set of reliable messaging patterns on top of ØMQ''s core request-reply
    pattern.


    In this chapter, we focus heavily on user-space request-reply *patterns*, reusable
    models that help you design your own ØMQ architectures.


    +   * The *Lazy Pirate* pattern: reliable request-reply from the client side

    * The *Simple Pirate* pattern: reliable request-reply using load balancing

    * The *Paranoid Pirate* pattern: reliable request-reply with heartbeating

    * The *Majordomo* pattern: service-oriented reliable queuing

    * The *Titanic* pattern: disk-based/disconnected reliable queuing

    * The *Binary Star* pattern: primary-backup server failover

    * The *Freelance* pattern: brokerless reliable request-reply


    # ## What is “Reliability”?


    Most people who speak of “reliability” don’t really know what they mean. We can
    only define reliability in terms of failure. That is, if we can handle a certain
    set of well-defined and understood failures, we are reliable with respect to those
    failures. No, more. So let’s look at the possible cases of failure in a distributed
    ØMQ application, roughly descending order of probability:


    +   * Application code is the worst offender. It can crash, freeze and stop responding
    to input, too slowly for its input, exhaust all memory, and so on.

    * System code—like brokers we write using ØMQ—can die for the same reasons as
    application code. System code *should* be more reliable than application code,
    but it can still crash and burn, and especially run out of memory if it tries
    to queue messages for slow clients.

    * Message queues can overflow, typically in system code that has learned to deal
    with slow clients. When a queue overflows, it starts to discard messages. So we
    get “lost” messages.'
