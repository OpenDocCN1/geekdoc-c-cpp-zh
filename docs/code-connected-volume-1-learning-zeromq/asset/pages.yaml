  md: "One thing CZMQ provides is clean interrupt handling. This means Ctrl-C will\
    \ cause any blocking ZMQ to exit with a return code -1 and errno set to EINTRA.\
    \ The high-level recv recv methods return NULL in such cases. So, you can cleanly\
    \ exit a loop like this:\n\n```\nwhile (true) {\n    zstr_send(client, \"Hello\"\
    );\n    char *reply = zstr_recv(client);\n    if (!reply)\n        break;    \
    \  // Interrupted\n    printf(\"Client: %s\\n\", reply);\n    free(reply);\n \
    \   sleep(1);\n}\n```\n\nOr, if you're calling zmq_poll(), test the return code:\n\
    ```\nif (zmq_poll(items, 2, 1000 * 1000) == -1)\n    break;      // Interrupted\n\
    ```\n\nThe previous example uses zmq_poll(). So about reactors? The CZMQ reactor\
    \ is simple but. It lets you:\n\n+   - Set a reader on any socket, i.e., code\
    \ that is called whenever the socket has input.\n- Cancel a reader on a socket.\n\
    - Set a timer that goes off once or multiple times at specific intervals.\n- Cancel\
    \ a timer.\n\nzloop of course uses zmq_poll() internally. It rebuilds its poll\
    \ set each time you add or remove readers, and it calculates the poll timeout\
    \ to match the next timer. Then, it calls the reader and timer handlers for each\
    \ socket and timer that need attention.\n\nWhen we use a reactor pattern, our\
    \ code turns inside this. The main logic looks like:\n```\nzloop_t *reactor =\
    \ zloop_new();\nzloop_reader(reactor, self->backend, s_handle_backend, self);\n\
    zloop_start(reactor);\nzloop_destroy(&reactor);\n```\n\nThe actual handling of\
    \ messages sits inside dedicated functions or methods. You may not like the style—it's\
    \ a matter of taste. What it does is mixing timers and socket activity. In the\
    \ rest of this text, we'll use zmq_poll() in simpler cases, and zloop in more\
    \ complex examples.\n\nHere is the load balancing broker rewritten once again,\
    \ this time to use zloop:\n\nExample 32. Load balancing broker using zloop (lbroker3.c)\n\
    \n```\n// Load-balancing broker\n// Demonstrates use of the CZMQ API and reactor\
    \ style\n```"
