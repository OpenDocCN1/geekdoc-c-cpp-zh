  md: '# Code Connected Volume 1 - Postface


    Let''s walk through the editing and publishing process. Here is how we produce
    the

    online version:


    ```

    bin/buildguide

    ```


    Which works as follows:


    +   - The original text sits in a series of text files (one per chapter).

    - The examples sit in the examples subdirectory, classified per language.

    - We take the text, and process this using a custom Perl script, mwikidot, into
    a set of Wikidot-ready files.

    - We do this for each of the languages that get their own Guide version.

    - We extract the graphics and calls ascito svg and rasterize on each one to produce
    image files, which it stores in the online subdirectory.

    - We extract inline listings (which are not translated) and stores these in the
    listings subdirectory.

    - We use pigmentize on each example and listing to create a marked-up page in
    Wikidot format.

    - We upload all changed files to the online wiki using the Wikidot API.


    Doing from scratch takes a while. So we store the SHA1 signatures of every image,
    listing, example, and text file, and only process and upload changes, that makes
    it easy to publish a new version of the text when people make new contributions.


    To produce the PDF and Epub formats we do this this:


    ```

    bin/build pdfs

    ```


    Which works as follows:


    +   - We use the custom mkdocbook Perl program on the input files to produce a
    DocBook output.

    - We push the DocBook format through docbook2ps and ps2pdf to create clean PDFs,
    in each language.

    - We push the DocBook format though db2epub to create Epub books, in each language.

    - We upload the PDFs to the public wiki using the Wikidot API.


    It''s important, when you create a community project, to lower the "change latency",
    i.e., the time it takes for people to see their work live. Or at least, to see
    that you''ve accepted their pull request. If this is more than a day or two, you''ve
    often lost your contributor''s interest.


    # Licensing


    I want people to reuse this text in their own work: presentations, articles, and
    even other books. However, the deal is that if they remix my work, others can
    remix theirs.'
  merge: -1
