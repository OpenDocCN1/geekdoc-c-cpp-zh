  md: '# 272 Code Connected Volume 1 - Chapter 5. Advanced Pub-Sub Patterns


    # Ephemeral Values


    An ephemeral value is one that expires automatically unless regularly refreshed.
    If you think of Clone being used for a registration service, then ephemeral values
    would let you do dynamic values. A node joins the network, publishes its address,
    and refreshes this regularly. If the node dies, its address eventually gets removed.


    The usual abstraction for ephemeral values is to attach them to a session, and
    delete them when the session ends. In Clone, sessions would be defined by clients,
    and would end if the client died. A simpler alternative is to attach a time to
    live (TTL) to ephemeral values, which the server uses to expire values that haven''t
    been refreshed in time.


    Next, we need to say, "delete this value". Up until now, servers and clients have
    always blindly inserted or updated values into their hash table. We''ll say that
    if the value is empty, that means "delete this key".


    Here''s a complete version of the kvmsg class, which implements the properties
    frame (and adds a UUID frame, which we''ll need later). It also handles empty
    values by deleting the key, if necessary


    Example 79. Key-value message class: full (kvmsg.c)


    ```

