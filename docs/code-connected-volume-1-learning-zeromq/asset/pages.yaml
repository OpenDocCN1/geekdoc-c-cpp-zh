    #  Reliable Queuing (Paranoid Pirate Pattern)


    The Simple Pirate Queue pattern works pretty well, especially because it''s just
    a combination of two existing patterns. Still, it has some weaknesses:


    +   It''s not robust in the face of a queue crash and restart. The client will
    recover, but the workers won''t. ØMQ will reconnect workers'' sockets automatically,
    as far as the newly started queue workers haven''t signaled ready, so don''t expect.
    To fix this, we have to do heartbeating from queue to worker so that the worker
    can detect when the queue has gone away.


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_143_0.png)


    Figure 49. The Paranoid Pirate Pattern


    +   The queue does not detect worker failure, if a worker dies while idle, the
    queue can''t remove it from its worker queue until the queue sends a request.
    The client waits and retries for nothing. It''s not a critical problem, but it''s
    not nice. To make this work properly, we do heartbeating from worker to queue,
    so that the queue can detect a lost worker at any stage.


    We''ll fix these in a properly pedantic Paranoid Pirate Pattern.'
