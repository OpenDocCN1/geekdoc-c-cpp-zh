    . In practice, a broker should remove services that have no workers after some\
    \ configurable timeout.\n\n# Idempotent Services\n\nIdempotency is not something\
    \ you take a pill for. What it means that it's safe to repeat an operation. Checking\
    \ the clock is idempotent. Lending credit card to children is not. While many\
    \ client-to-server use cases are idempotent, some are not. Examples of idempotent\
    \ use cases include:\n\n+   - Stateless task distribution, i.e., a pipeline where\
    \ the servers are stateless workers that compute a request purely based on the\
    \ state provided by a request. In such a case, it's safe (though inefficient)\
    \ to execute the same request many times.\n- A name service that translates logical\
    \ addresses to endpoints to bind or connect to. In such a case, it's safe to make\
    \ the same lookup request many times.\n\nAnd here are examples of a non-idempotent\
    \ use cases:\n\n+   - A logging service. One does not want the same log information\
    \ recorded more than once.\n- Any service that has impact on downstream nodes,\
    \ e.g., sends information to other nodes. If that service gets the same request\
    \ more than once, downstream nodes will get duplicate information."
