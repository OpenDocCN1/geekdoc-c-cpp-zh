  md: '# Postface


    # Tales from Out There


    I asked some of the contributors to this book to tell us what they were doing

    ØMQ. Here are their stories.


    # Rob Gagnon''s Story


    “We use ØMQ to assist in aggregating thousands of events occurring every minute

    across our global network of telecommunications servers so that we can accurately

    report and monitor for situations that require our attention. ØMQ made the

    development of the system not only easier, but faster to develop, and more robust
    and

    fault-tolerant than we had originally planned in our original design.


    “We''re able to easily add and remove clients from the network without the loss
    of any

    message. If we need to enhance the server portion of our system, we can stop and

    restart it as well, without worrying about stopping all of the clients first.
    The

    built-in buffering of ØMQ makes this all possible.”


    # Tom van Leeuwen''s Story


    “I was looking for creating some kind of service connecting all kinds of services

    together. There were already some products that implemented a broker, but they
    did

    not have the functionality I wanted/needed. By accident I stumbled upon ØMQ which

    is awesome. It''s very lightweight, lean, simple and easy to follow since the
    guide is very

    complete and reads very well. I''ve actually implemented the Titanic pattern and
    the

    Majcardo broker with some additions (client/worker authentication and workers

    sending a catalog explaining what they provide and how they should be addressed.)


    “The beautiful thing about ØMQ is the fact that it is a library and not an

    application. You can make it however you like and it simply puts boring things
    like

    queuing, reconnection, tcp sockets and such to the background, making sure you

    concentrate on what is important for you. I''ve implemented all kinds of workers/clients\sand
    the broker in Ruby, that is the main language we use for development, but

    also some php clients to connect to the bus from existing webapps. We use this

    service for bus connecting all kinds of platform devices to a service bus

    exposing functionality for automation.


    ØMQ is very easy to understand and if you spend a day in the guide, you''ll have

    good knowledge of how it works. I''m a network engineer, not a software developer,
    but

    managed to create a very nice solution for our automation needs! ØMQ: Thank you

    very much!”'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# Michael Jakl’s Story


    We use EMMQ for distributing millions of documents per day in our distributed
    processing pipeline. We started out with big message queuing brokers that had
    their respective issues and problems. In quest of simplifying our architecture,
    we chose EMMQ to do the wiring. So far it had a huge impact on how our architecture
    scales and how easy it is to change/move the components. The plethora of language
    bindings lets us choose the right tool for the job without sacrificing interoperability
    in our system. We don’t use a lot of sockets (less than 10 in our application),
    but that’s all we needed to split a huge application into small independent parts.


    All in all, EMMQ lets me keep my sanity and helps my customers to stay within
    budget.


    # Vadim Shalt’s Story


    I am team leader in the company ActForex, which develops software for financial
    markets. Due to the nature of our domain, we need to process large volumes of
    prices. In addition, it’s extremely critical to minimize latency in processing
    orders and prices. Achieve high throughput is not enough. Everything must be handled
    in a soft real time with a predictable low latency per price. The system consists
    of multiple components which exchanging messages. Each price can take a lot of
    processing stages, each of which increases total latency. As a consequence, low
    and predictable latency of messaging between components becomes a key factor of
    our architecture.


    We investigated different solutions to find suitable for our needs. We tried different
    message brokers (RabbitMQ, ActiveMQ Apollo, Kafka), but failed to reach a low
    and predictable latency with any of them. In the end, we have chosen ZeroMQ used
    in conjunction with Zookeeper for service discovery. Complex coordination with
    ZeroMQ requires a large effort and a good understanding, as a result of the natural
    complexity of multi-threading. We found that external agent like Zookeeper is
    better choice for service discovery and coordination with ZeroMQ can be primary
    for simple messaging. ZeroMQ perfectly fit into our architecture. It allowed us
    to achieve the desired latency with minimal efforts. It saved us from a bottleneck
    in the processing of messages and made processing time very stable and predictable.


    I can decidedly recommend ZeroMQ for solutions where low latency is important.


    # How This Book Happened


    When I set out to write a ZeroMQ book, we were still debating the pros and cons
    of forks and we adopted the EMMQ community. Today, for what it’s worth, this argument
    seems settled: the “liberal” policy which we adopted for libzmq in early 2012
    broke our dependency on a single prime author, and opened the floor to dozens
    of new contributors. More profoundly, it allowed us to move to a genuinely organic
    evolution model, very different from the order forced-model march.'
  merge: -1
  pgno: 311
