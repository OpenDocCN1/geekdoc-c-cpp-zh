  md: '# Code Connected Volume 1 - Chapter 2. Sockets and Patterns


    Originally, a ØMQ message was one frame, like UDP. We later extended this with
    multipart messages, which are quite simply series of frames with a “more” bit
    set to one, followed by one with bit set to zero. The ØMQ API then lets you write
    messages with a “more” flag and when you read messages, it lets you check if there''s
    “more”.


    In the low-level ØMQ API and the reference manual, therefore, there''s some fuzziness
    about messages versus frames. Here''s a useful lexicon:


    +   - A message can be one or more parts.

    - These parts are also called “frames”.

    - Each part is `zmq_msg_t` object.

    - You send and receive each part separately, in the low-level API.

    - Higher-level APIs provide wrappers to send multipart messages.


    Some other things that are worth knowing about messages:


    +   - You may send zero-length messages, e.g., for sending a signal from one thread
    to another.

    - ØMQ guarantees to deliver all the parts (one or more) for a message, or none
    of them.

    - ØMQ does not send the message (single or multipart) right away, but at some
    indeterminate later time. A multipart message must therefore fit in memory.

    - A message (single or multipart) must fit in memory. If you want to send files
    of arbitrary sizes, you should break them into pieces and send each piece as separate-part
    messages. Using multipart data will not reduce memory consumption.

    - You must call `zmq_msg_close()` when finished with a received message, in languages
    that don''t automatically destroy objects when a scope closes. You don''t call
    this after sending a message.


    And to repeat, do not use `zmq_msg_init_data()`. This is a zero-copy method and
    is guaranteed to create trouble for you. There are far more important things to
    learn about ØMQ before you worry about having microseconds.


    This API can be tiresome to work with. The methods are optimized for performance,
    not simplicity. If you start using these you will almost get them wrong until
    you''ve read the man pages with some care. One of the jobs of a good language
    binding is to wrap this up in classes that are easy to use.


    # Handling Multiple Sockets


    In all the examples so far, the main loop of most examples has been:


    +   - 1. Wait for message on socket.

