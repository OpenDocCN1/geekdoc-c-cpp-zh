  md: '# Code Connected Volume 1 - Chapter 3. Advanced Request-Reply Patterns


    This design is appealing because the problem is solved in place, invisible to
    the rest of the world. Basically, brokers open secret channels to each other and
    whisper, like camel traders, "Hey, I''ve got some spare capacity. If you have
    too many clients, give me a shout and we''ll deal".


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_113_0.png)


    In effect it is just a more sophisticated routing algorithm: brokers become subcontractors
    for each other. There are other things to like about this design, even before
    we play with real code:


    +   - It treats the common case (clients and workers on the same cluster) as default
    and does extra for the special case (shuffling jobs between clusters).

    - It lets us use different flows for the different types of work. That means we
    can handle them differently, e.g., using different types of network connection.

    - It feels like it would scale smoothly. Interconnecting three or more brokers
    doesn''t get overly complex. If we find this to be a problem, it''s easy to solve
    by adding a super-broker.


    We will now make a worked example. We will pack an entire cluster into one process.
    That is obviously not realistic, but it makes simple to simulate, and the simulation
    can accurately scale to processes. This is the beauty of ØMQ—you can design at
    the micro-level and scale up to the macro-level. Threads become processes, and
    then become boxes and the patterns and logic remain the same. Each of our "cluster"
    processes contains client workers, threads, and a broker thread.


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_113_1.png)


    Figure 41. Idea 1: Cross-connected Workers


    We know the basic model by now:


    +   - The REQ (REQ) threads create workloads and pass them to the broker (ROUTER).

    - The REQ worker (REQ) threads process workloads and return the results to the
    broker (ROUTER).


    Figure 42. Idea 2: Brokers Talking to Each Other'
