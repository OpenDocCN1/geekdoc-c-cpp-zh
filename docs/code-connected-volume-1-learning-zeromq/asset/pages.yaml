  md: '# Scaling to Multiple Clusters


    Now we scale this out to more than one cluster. Each cluster has a set of clients
    and workers, and a broker joins them together (see figure 40).


    The question is: how do we get the clients of each cluster talking to the workers
    of the other cluster? There are a few possibilities, with pros and cons:


    +   - Clients could connect directly to both brokers. The advantage is that we
    don''t need to modify brokers or workers. But clients get more complex and become
    aware of the overall topology. If we want to add a third or fourth cluster, for
    example, all the clients are affected. In effect we have to moving routing and
    failover logic into the clients and that''s not nice.

    - Workers might connect directly to both brokers. But REQ workers can''t, that
    can only reply to one broker. We might use REPs but REPs don''t give us customizable
    broker-to-worker routing like load balancing, only the built-in load balancing.
    That''s a fail; if we want to distribute work to idle workers, we precisely need
    load balancing. One solution would be to ROUTER sockets for the worker nodes.
    Let''s label this “Idea #1”.n- Brokers could connect to each other. This looks
    neat because it creates the fewest connections. We can''t add clusters on the
    fly, but that is probably out of scope. Now clients and workers remain ignorant
    of the network topology, and brokers tell each other when they have spare capacity.
    Let''s label this "Idea #2".


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_112_0.png)


    Let''s explore Idea #1. In this model, we have workers connecting to both brokers
    and accepting jobs from either one (see figure 41).


    It looks feasible. However, it doesn''t provide what we wanted, which was clients
    get local workers if possible and remote workers only if it''s better than waiting.
    Also workers will signal “ready” to both brokers and can get two jobs at once,
    while other workers remain idle. It seems this design fails again we we''re putting
    routing logic at the edges.


    So, idea #2 then. We interconnect the brokers and workers, which are REQs like
    we''re used to (see figure 42).'
