  md: '# ROUTER Error Handling


    ROUTER sockets do have somewhat brutal way of dealing with messages that they
    can’t send anywhere; they drop them silently. It’s an attitude that makes sense
    in working code, but it makes debugging hard. The “send identity as first frame”
    approach is tricky enough that we often get this when we’re learning, and the
    ROUTER’s stony silence when we mess up it’s very constructive.


    Since 0MQ v3.2 there’s a socket option you can set to catch this error:

    ZMQ_ROUTER_MANDATORY. Set that on the ROUTER socket and when you provide an unroutable
    identity on a send call, the socket will signal an EHOSTUNREACH error.


    # The Load Balancing Pattern


    Now let’s look at some code. We’ll see how to connect a ROUTER socket to a REQ
    socket, and then to a DEALER socket. These two examples follow the same logic,
    which is a load balancing pattern. This pattern is our first exposure to using
    the ROUTER socket for deliberate routing, rather than simply acting as a reply
    channel.


    The load balancing pattern is very common and we will see it several times in
    this book. It solves the main problem with simple round robin (as PUSH and DEALER
    offer) which is that round robin becomes inefficient if tasks do not all take
    the same time.


    It’s the post office analogy. If you have one queue counter, and you have some
    people buying stamps (a fast, simple transaction), and some people opening accounts
    (a very slow transaction), and you will find stamps getting unfairly stuck in
    queues. Just as in a post office, if your messaging architecture is unfair, people
    will get annoyed.


    The solution in the post office is to create a single queue so that even if one
    or two counters get stuck with slow work, other counters will continue to serve
    clients on a first-come, first-serve basis.


    One reason PUSH and DEALER use the simplistic approach is sheer performance. If
    you arrive in any US airport, you will find long queues of people waiting at immigration.
    The border officials will send people in advance to queue up at each counter,
    rather than using a single queue. Having people walk fifty yards in advance saves
    a minute or two per passenger. And because every check takes roughly the same
    time, it’s more or less fair. This is the strategy for PUSH and DEALER: send work
    ahead of time so that there is less travel distance.


    This is a recurring theme with 0MQ: the world’s problems are diverse and you can
    benefit from solving different problems in the right way. The airport isn’t the
    post office and one size fits no one, really.


    Let’s return to the scenario of a worker (DEALER or REQ) connected to a broker
    (ROUTER). The broker has to know when the WORKER is ready, and keep a list of
    workers so that it can take the least recently used worker each time.'
