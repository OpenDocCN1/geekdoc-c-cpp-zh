  md: '# Code Connected Volume 1 - Chapter 3. Advanced Request-Reply Patterns


    Notes about this code:


    +   - Each broker has an identity that we use to construct ipc endpoint names.
    A real broker would need to work with TCP and a more sophisticated configuration
    scheme. We''ll look at such schemes later in this book, but for now, using generated
    ipc names lets ignore the problem of where to get TCP/IP addresses or names.


    +   - We use a zmq_poll() as the core of the program. This processes incoming
    messages and sends out state messages. We send a state message only if we did
    not get any incoming messages and we waited for a second. If we send out a state
    each time we get one in, we''ll get storms.


    +   - We use a two-part pub-sub message consisting of sender address and data.
    Note that we will need to know the order of the publisher in order of its tasks,
    and the only way is to send this explicitly as a part of the message.


    +   - We don''t set identities on subscribers because if we didn''t get outdated
    state information when connecting to running brokers.


    +   - We don''t set a HWM on the publisher, but if we were using ØMQ v2.xt that
    would be a wise idea.


    We can build this little program and run it across three clusters. Let''s call
    them DC1, DC2, and DC3 (the names are arbitrary). We run these three commands,
    in a separate window:


    ```

    peerg1 DC1 DC2 DC3 # Start DC1 and connect to DC2 and DC3

    peerg1 DC2 DC1 DC3 # Start DC2 and connect to DC1 and DC3

    peerg1 DC3 DC1 DC2 # Start DC3 and connect to DC1 and DC2

    ```


    You''ll see each cluster report the state of its peers, and after a few seconds
    they all happily be printing random numbers once per second. And this will satisfy
    yourself that the three brokers match up and synchronize to per-second state updates.


    In real life, we''d not send state messages at regular intervals, but rather whenever
    we had a state change, i.e., whenever a worker becomes available or unavailable.
    That may seem like a lot of traffic, but state messages are small and we''ve established
    that the inter-cluster connections are super fast.


    If we wanted to send state messages at precise intervals, we''d create a child
    thread and open the state socket in that thread. We''d then send irregular state
    updates to that child thread from our main thread and allow the child to conflate
    them into outgoing messages. This is more work than we need here.


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_118_0.png)'
