  md: '# Code Connected Volume 1 - Chapter 4. Reliable Request-Reply Patterns


    get tired of waiting and resend the whole lot. It''s not elegant, but system code
    should really not die enough to matter.


    In this chapter we''ll focus on just on request-reply, which is the low-hanging
    fruit of reliable messaging.


    The basic request-reply pattern (a REQ client socket doing a blocking send/receive
    to a REP socket) scores low on handling the most common types of failure. If the
    server crashes while processing the request, the client just hangs forever.


    Request-reply is still much better than TCP, to finish 0MQ''s ability to reconnect
    peers linearly, load balance messages, and so on. But it''s still good enough
    for real work. The only case where you can really trust the basic request-reply
    pattern is between two threads in the same process where there''s no network or
    separate server process to die.


    However, with a little extra work, this humble pattern becomes a good basis for
    real work across a distributed network, and we get a set of reliable request-reply
    (RRR) patterns that I like to call the Pirate patterns (you''ll eventually get
    the joke, I hope).


    There are, in my experience, roughly three ways to connect clients to servers.
    Each needs a specific approach to reliability:


    +   Multiple clients talking directly to a single server. Use case: single well-known
    server to which clients need to talk. Types of failure we handle: server crashes
    and restarts, and network disconnects.


    +   Multiple clients talking to a broker proxy that distributes work to multiple
    workers. Use case: service-oriented transaction processing. Types of failure we
    handle: worker crashes and restarts, worker busy looping, worker overload, queue
    crashes and restarts, and network disconnects.


    +   Multiple clients talking to multiple servers with no intermediary proxies.
    Use case: distributed services such as name resolution. Types of failure we aim
    to handle: service crashes and restarts, service busy looping, service overload,
    and network disconnects.


    Each of these approaches has its trade-offs and often you''ll mix them. We''ll
    look at all three in detail.


    # Client-Side Reliability (Lazy Pirate Pattern)


    We can get very reliable request-reply with some changes to the client. We call
    this Lazy Pirate pattern (figure 47). Rather than doing a blocking receive, we:


    +   Poll the REQ socket and receive from it only when it''s sure a reply has arrived.


    +   Resend a request, if no reply has arrived within a timeout period.


    +   Abandon the transaction if there is still no reply after several requests.


    If you try to use a REQ socket in anything other than a strict send/receive fashion,
    you''ll get an error (technically, the REQ socket implements a small finite-state
    machine'
