  md: '# Brokerless Reliability (Freelance Pattern)


    It might seem ironic to focus so much on broker-based reliability, as we often
    explain ØMQ as "brokerless messaging". However, in messaging, in real life, the
    middleman is a burden and a benefit. In practice, most messaging architectures
    benefit from a mix of distributed and brokered messaging. You get the best results
    when you can decide freely trade-offs you want to make. This is why I can drive
    twenty minutes to a wholesaler to buy free wine for a party, but I can also walk
    ten minutes to a corner store to buy one bottle for dinner. Our highly context-sensitive
    valuations of time, energy, and cost are essential to the real world economy.
    They are essential to an optimal message-based architecture.


    This is why ØMQ does not impose a broker-centric architecture, though it gives
    you the tools to build it, like proxies, and we''ve built a dozen or so different
    ones so far, for practice.


    So we''ll end this chapter by deconstructing the broker-based reliability we''ve
    built so far, turning it into a distributed peer-to-peer architecture I call the
    Freelance pattern. Our use case will be a name resolution service. This is a common
    problem with ØMQ architectures: how do we know to connect to? Hard-coding TCP/IP
    addresses in code is insanely fragile. Using configuration files creates an administration
    nightmare. Imagine if you had to hand-configure your web browser, or every PC
    or mobile phone you used, to realize that "google.com" was "74.125.230.82".


    A ØMQ name service (and we''ll make a simple implementation) must do the following:


    +   - Resolve a logical name to at least a bind endpoint, and connect that endpoint.
    A realistic name service would provide multiple endpoints, and possibly multiple
    connect endpoints as well.


    +   - Allow us to manage multiple parallel environments, e.g., "test" versus "production",
    without modifying code.'
