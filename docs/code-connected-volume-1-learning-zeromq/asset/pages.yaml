  md: '# Code Connected Volume 1 - Chapter 3. Advanced Request-Reply Patterns


    The difficult part of this program is (a) the envelopes that each socket reads
    and writes, and (b) the load balancing algorithm. We''ll take these in turn, starting
    with the message envelope formats.


    Let''s walk through a full request-reply chain from client to worker and back.
    In this code we set the identity of client and worker sockets to make it easier
    to trace the message frames. In reality we''d the ROUTER sockets to inject identities
    for connections. Let''s assume the client''s identity is "CLIENT" and the worker''s
    identity is "WORKER". The client application sends a single frame containing "Hello"
    (see figure 33).


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_96_0.png)


    Because the REQ socket adds its delimiter frame and the ROUTER socket adds its
    connection identity, the proxy reads the frontend ROUTER client address, empty
    delimiter frame, and the data part (see figure 34).


    | | CLIENT | Client address |

    |---|---|---||

    | Frame 1 | 6 | Empty delimiter frame |

    | Frame 2 | 5 | Data frame |


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_96_1.png)


    The broker sends this to the worker, prefixed by the address of the chosen worker
    plus an additional empty part to keep the REQ at the other end happy (see figure
    35).


    | | WORKER | Address of worker |

    |---|---|---||

    | Frame 2 | 0 | Empty delimiter frame |

    | Frame 3 | 6 | Identity of client |

    | Frame 4 | 0 | Empty delimiter frame |

    | Frame 5 | 5 | Data frame |


    This complex envelope stack gets chewed up by the backend ROUTER socket, which
    removes the empty part, and provides the rest to the worker application (see figure
    36).


    The worker has to wrap the envelope (which is all the parts up and including the
    empty frame) and then it can do what''s needed with the data part. Note that a
    REP socket would do this automatically, but we''re using the REQ-ROUTER pattern
    so that we can get proper load balancing.


    On the return path, the messages are the same as when they come in, i.e., the
    backend socket gets a message in five parts, and the broker sends the frontend
    socket in three parts, and the client gets a message in one part.


    | | CLIENT | Identity of client |

    |---|---|---||

    | Frame 2 | 0 | Empty delimiter frame |

    | Frame 3 | 5 | Data frame |


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_96_2.png)'
