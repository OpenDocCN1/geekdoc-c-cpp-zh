- img_proc: true
  md: 'to a design that was understandable, easy to use, and reliable enough to be
    worth using.


    These are our requirements for a high-availability architecture:


    +   - The failover is meant to provide insurance against catastrophic system failures,
    such as hardware breakdown, fire, accident, and so on. There are simpler ways
    to recover from ordinary server crashes and we already covered these.

    - Failover time should be under 60 seconds and preferably under 10 seconds.

    - Failover has to happen automatically, whereas recovery must happen manually.
    We want applications to switch over to the backup server automatically, but we
    do not want them to switch back to the primary server except when the operators
    have fixed whatever problem there was and decided that it is a good time to interrupt
    applications again.

    - The semantics for client applications should be simple and easy for developers
    to understand. Ideally, they should be hidden in the client API.

    - There should be clear instructions for network architects on how to avoid designs
    that could lead to split brain syndrome, in which both servers in a Binary Star
    pair think they are the active server.

    - There should be no dependencies on the order in which the two servers are started.

    - It must be possible to make planned stops and restarts of either server without
    stopping client applications (though they may be forced to reconnect).

    - Operators must be able to monitor both servers at all times.

    - It must be possible to connect the two servers using a high-speed dedicated
    network connection. That is, failover synchronization must be able to use a specific
    IP route.


    We make the following assumptions:


    +   - A single backup server provides enough insurance; we don’t need multiple
    levels of backup.

    - The primary and backup servers are equally capable of carrying the application
    load. We do not attempt to balance load across the servers.

    - There is sufficient budget to cover a fully redundant backup server that does
    nothing almost all the time.


    We don''t cover the following:


    +   - The use of an active backup server or load balancing. In a Binary Star pair,
    the backup server is inactive and does no useful work until the primary server
    goes offline.

    - The handling of persistent messages or transactions in any way. We assume the
    existence of a network of unreliable (and probably untrusted) servers or Binary
    Star pairs.'
