  md: '294 Code Connected Volume 1 - Chapter 5. Advanced Pub-Sub Patterns


    collector. Using proper and consistent abstractions like kvmsg and CZMQ helps
    enormously.


    # The Clustered Hashmap Protocol


    While the server is pretty much mashup of the previous model plus the Binary Star
    pattern, the client is a lot more complex. Before we get to that, let''s look
    at the final protocol. I have written this as a specification on the ZeroMQ RFC
    website as the Clustered Hashmap Protocol22.


    Roughly, there are two ways to design a complex protocol as this one. One way
    is to separate each flow into its own set of sockets. This is the approach we
    used. The advantage is that each flow is simple and clean. The disadvantage is
    that managing multiple sockets at once can be quite complex. Using a reactor makes
    it simpler, but still, it makes a lot of moving pieces that have to fit together.


    The second way to make such a protocol is to use a single socket for everything.
    In this case, I''ve used ROUTER for the server and DEALER for the clients, and
    then done everything over that connection. It makes for a more complex protocol
    but at least the complexity is all in one place. In Code Connected Volume 2 we''ll
    look at an example of protocol done over a ROUTER-DEALER combination.


    Let''s look at CHP in more detail now. Note that "SHOULD", "MUST" and "MAY" are
    key words we use in specification to indicate requirement levels.


    # Goals


    CHP is meant to provide a basis for reliable pub-sub across a cluster of clients
    connected over an 0MQ network. It defines a "hashmap" abstraction consisting of
    keyvalue pairs. Any client can modify any key-value pair at any time, and changes
    are propagated to all clients. A client can join the network at any time.


    # Architecture


    CHP connects a set of client applications and a set of servers. Clients connect
    to the server. Clients do not see each other. Clients can go arbitrarily.


    # Ports and Connections


    The server opens three ports as follows:


    +   - A SNAPSHOT port (0MQ ROUTER socket) at port number P.

    - A PUBLHER port (0MQ PUB socket) at port number P + 1.

    - A COLLECTOR port (0MQ SUB socket) at port number P + 2.


    The client SHOULD open at least two connections:


    +   - A SNAPSHOT connection (0MQ DEALER socket) to port number P.

    - A SUBSCRIBER connection (0MQ SUB socket) to port number P + 1.


    The client MAY open a third connection, if it wants to update the hashmap:


    +   - A PUBLHER connection (0MQ PUB socket) to port number P + 2.


    22 http://rfc.zermq.org/spec:12'
