    The client sequences each message and checks that replies come back exactly in
    order: that no requests or replies are lost, and no replies come back more than
    once, or out of order. Run the test few times until you''re convinced that this
    mechanism actually works. You don''t need sequence numbers in a production application;
    they just help us trust our design.


    The client uses a REQ socket, and the brute force close/reopen REQ sockets impose
    that send/receive cycle. You might be tempted to use a DEALER instead, but it
    would not be a good decision. First, it would mean the secret sauce that REQ does
    with envelopes (if you''ve forgotten what that is, it''s a good sign you don''t
    have to do it). Second, it would mean potentially getting back replies that you
    didn''t expect.


    Handling failures only at the client when we have a set of clients talking to
    a single server. It can handle a server crash, but only if recovery means restarting
    the same server. If there is a permanent error, such as a dead power supply on
    the server hardware, this approach won''t work. Because the application code in
    servers is usually the biggest source of failures in any architecture, depending
    on a single server is not a great idea.


    So, pros and cons:


    +   - Pro: simple to understand and implement.

    - Pro: works easily with existing client and server application code.

    - Pro: ØMQ automatically retries the actual reconnection until it works.

    - Con: doesn''t failover to backup or alternate servers.


    # Basic Reliable Queuing (Simple Pirate Pattern)


    Our second approach extends the Lazy Pattern with a queue proxy that lets us talk,
    transparently, to multiple servers, which we can more accurately call “workers”.
    We''ll develop this in stages, starting with a minimal working model, the Simple
    Pirate pattern.


    In all Pirate patterns, workers are stateless. If the application requires some
    shared state, such as a shared database, we don''t know about it as we design
    our messaging framework. Having a queue proxy means workers can come and go without
    clients knowing about it. If one worker dies, another takes over. This is a nice,
    simple topology with only one real weakness, namely the central queue itself,
    which can become a problem to manage, and a single point of failure.'
