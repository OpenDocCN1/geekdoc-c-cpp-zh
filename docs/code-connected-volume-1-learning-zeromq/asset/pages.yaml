    some reason? Even a simple protocol will, if it''s successful, evolve and become
    more complex.


    Lack of contracts is a sure sign of a disposable application. Let''s write a contract
    for this protocol. How do we do that?


    There''s a wiki rfc.zeromq.org¹ that we made especially as a home for public OMQ
    contracts.


    To create a new specification, register on the wiki if needed, and follow the
    instructions. It''s fairly straightforward, though writing technical texts is
    not everyone''s cup of tea.


    It may take about fifteen minutes to draw the Pirate Pattern Protocol¹⁵ It''s
    not a big specification, but it does capture enough to act the basis for arguments
    (“your queue is PPP compatible; fix it!”).


    Turning PPP into a real protocol would take more:


    +   There should be a protocol version number in the READY command so that it''s
    possible to distinguish between different versions of PPP.


    +   Right now, READY and HEARTBEAT are not entirely distinct from requests and
    replies. To make them distinct, we would need a message structure that includes
    a “message type” part.


    # Service-Oriented Reliable Queuing (Majdomordo Pattern)


    The nice thing about progress is how fast it happens when lawyers and committees
    aren''t involved. The one-page MDP specification¹⁶ turns PPP into something solid
    (see figure 50). This is how we design complex architectures: by writing down
    the contracts, and only write software to implement them.


    The Majdomordo Protocol (MDP) extends and improves PPP in one interesting way:
    it adds a “service name” to requests that the client sends, and asks workers to
    register for specific services. Service names turn Paranoid queue into a service-oriented
    broker. The nice thing about MDP is that it comes out of working code,


