  md: "# Putting it All Together\n\nLet's put this together into a single package.\
    \ As before, we'll run an entire cluster as one process. We're going to take the\
    \ two previous examples and merge them into one properly working design that lets\
    \ simulate any number of clusters. That's\n\nThis code is the size of both previous\
    \ prototypes together, at 270 LoC. That's pretty good for a simulation of a cluster\
    \ that includes clients and workers and cloud distribution. Here is the code:\n\
