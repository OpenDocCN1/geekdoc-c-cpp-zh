    If you''re multithreaded work, it gets rather more complex than this. We''ll get
    to multithreading in the next chapter, because some of you, despite warnings,
    to run before you can safely walk, below is the quick and dirty guide to making
    a clean exit in a multithreaded OMQ option.


    First, not to use the same socket from multiple threads. Please don''t explain
    why you think this would be excellent fun, just don''t do it. Next, you need to
    shut down each socket that has ongoing requests. The proper way is to set a low
    LINGER value (1 second), and then close the socket. If your language binding doesn''t
    do this for you automatically when you destroy a context, I''d suggest sending
    a patch.


    Finally, destroy the context. This will cause any blocking receives or polls in
    attached threads (i.e., which share the same context) to return with an error.
    Catch that error, and let linger on, and close sockets in that thread, and exit.
    Do not destroy the context. The zmq_ctx_destroy in the main thread will block
    until all sockets it knows about are closed.


    Viola! It''s complex and painful enough that any language binding author his or
    her salt will do this automatically and make the socket closing dance unnecessary.


    # # Why We Needed OMQ


    Now that you''ve seen OMQ in action, let''s go back to the “why”.


    Many applications these days consist of components that stretch across some kind
    of network, either a LAN or the Internet. So many application developers end up
    doing some kind of messaging. Some developers use message queuing products, but
    most of the time they do it themselves, using TCP or UDP. These protocols are
    not hard to use, but there is a great difference between sending a few bytes from
    A to B, and messaging in any kind of reliable way.


    Let''s look at the typical problems when we start to connect pieces using raw
    TCP. Our reusable messaging layer would need to solve all of these:


    +   - How do we handle I/O? Does your application block, or do we handle I/O in
    the background? This is a key design decision. Blocking I/O architectures that
    do not scale well. But blocking I/O can be very hard to do right.


    +   - How do we handle dynamic components, i.e., those that go away temporarily?
    Do formally split components into “clients” and “servers” and mandate that servers
    cannot disappear? What if we want to connect to servers? Do we try to reconnect
    every seconds?


    +   - How do we represent a message on the wire? How do we frame data so it''s
    easy to write and read, safe from buffer overflows, efficient for small messages,
    yet adequate for the very largest videos of dancing cats wearing party hats?'
