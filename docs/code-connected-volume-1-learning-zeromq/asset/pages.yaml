    It's a nontrivial program and took about a day to get working. These are the highlights:\n\
    \n+   - The client threads detect and report a failed request. They do this by\
    \ polling for a response and if none arrives after a while (10 seconds), printing\
    \ an error message.\n- Client threads don't print directly, but instead send a\
    \ message to a monitor (PUSH) that the main loop collects (PULL) and prints off.\
    \ This is the first case we've seen of using OmQ sockets for monitoring and logging;\
    \ this is a big use that we'll come back to.\n- Clients simulate varying loads\
    \ to get the cluster 100% at random moments, so tasks are shifted over the cluster.\
    \ The number of clients and workers, and delays in the client and worker threads\
    \ control this. Feel free to play with them to see if you can make a more realistic\
    \ simulation.\n- The main loop uses two polsets. It could fact use three: information,\
    \ backends, and frontends. In the earlier prototype, there is no point in taking\
    \ a frontend message if there is no backend capacity.\n\nThese are some of the\
    \ problems that arose during development of this program:\n\n+   - Clients would\
    \ freeze, due to requests or replies getting lost somewhere. Recall the ROUTER\
    \ drops messages it can't run. The first tactic was to modify the client thread\
    \ to detect and report such problems. Secondly, I zmsg_dump() calls after every\
    \ receive and before sending in the main loop, until the origin of the problem\
    \ was clear.\n- The main loop was mistakenly reading from more than one ready\
    \ socket. This caused the first message to be lost. I fixed that by only reading\
    \ from the first ready socket.\n- The zmsg class was not properly encoding UUIDs\
    \ as C strings. This caused UUIDs that contain 0 bytes to be corrupted. I fixed\
