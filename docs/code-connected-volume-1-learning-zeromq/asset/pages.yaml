    \ make them yourself. It's optional, and in previous pub-sub examples we didn't\
    \ do this. Using a pub-sub envelope is a little more work for simple cases, but\
    \ it's cleaner especially for real cases, where the key and the data are separate\
    \ entities.\n\nRecall that subscriptions to a prefix match. That is, they look\
    \ for \"all messages starting with XYZ\". The obvious question is how to delimit\
