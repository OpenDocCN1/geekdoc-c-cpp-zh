    application that does no external socket I/O) you can set the I/O threads to zero.
    It''s not a significant optimization though, more of a curiosity.


    # Messaging Patterns


    Underneath the brown paper wrapping of ØMQ''s socket API lies the world of messaging
    patterns. If you have a background in enterprise messaging, or know UDP these,
    they will be well familiar. But most ØMQ newcomers, they are a surprise. We''re
    used to the TCP paradigm where a socket maps to one-to-one to another node.


    Let''s recap briefly what ØMQ does for you. It delivers bloss data (messages)
    to nodes, quickly and efficiently. You can map nodes to threads, processes, or
    nodes. ØMQ gives your applications a single socket API to work with, no matter
    what the actual transport (like in-process, inter-process, TCP, or multicast).
    It automatically reconnects to peers as they go. It queues messages at both sender
    and receiver, and manages these queues carefully to ensure processes don''t run
    out of memory, overflowing to when appropriate. It handles socket errors. It does
    all I/O in background threads. It uses lock-free techniques for talking between
    nodes, so there are never locks, waits, semaphores, or deadlocks.


    But cutting through, it routes and queues messages according to precise recipes
    patterns. It is these patterns that drive ØMQ''s intelligence. They encapsulate
    our hard-earned experience of the best ways to distribute data and work. ØMQ''s
    patterns are hard-coded but future versions may allow user-definable patterns.


    ØMQ patterns are implemented by pairs of sockets with matching types. In others,
    to understand ØMQ patterns you need to understand socket types and how they work
    together. Mostly, this just takes study; there is little that is obvious at this
    level. The built-in core ØMQ patterns are:


    +   - Request-reply, which connects a set of clients to a set of services. This
    is a remote procedure call and task distribution pattern.


    +   - Pub-sub, which connects a set of publishers to a set of subscribers. This
    is a data distribution pattern.


    +   - Pipeline, which connects nodes in a fan-out/fan-in pattern that can have
    multiple steps and loops. This is a parallel task distribution and collection
    pattern.


    +   - Exclusive pair, which connects two sockets exclusively. This is a pattern
    for connecting two threads in a process, not to be confused with “normal” pairs
    of sockets.


    We looked at the first three of these in “Basics”, and we''ll see the exclusive
    pair pattern later in this chapter. The zmq_socket() man page is clear about the
    patterns, it''s worth reading several times until it starts to make sense. These
    are the socket combinations that are valid for a connect-bind pair (either side
    can bind):


    +   - PUB and SUB'
