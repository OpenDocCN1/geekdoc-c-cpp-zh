    Code Connected Volume 1 - Preface


    Originally the zero in ØMQ was meant as “zero broker” and (as close to) “zero
    latency” (possible). Since then, it has come to encompass different goals: zero
    administration, zero cost, zero waste. More generally, “zero” refers to the culture
    of minimalism that permeates the project. We add power by removing complexity
    rather than by exposing new functionality.


    # How This Book Came To Be


    In the summer of 2010, ØMQ was still a little-known niche library described by
    its rather reference manual and a living but sparse wiki. Martin Sustrik and myself
    were sitting in the bar of the Hotel Kyiv in Bratislava discussing how to make
    ØMQ more popular. Martin had written most of the ØMQ code, and I put up the funding
    and organized the community. Over some Zlaty Bazants, we agreed that ØMQ needed
    a new, simpler website and a basic guide for new users.


    Martin collected some ideas for topics. I''d never written a line of ØMQ code
    before this, since it became a live learning document. As I worked through simple
    examples to more complex ones, I tried to answer many of the questions I saw on
    the mailing list. Because I''d been building large-scale architectures for 30
    years, there was a lot of problems at which I was able to throw ØMQ. Amazing the
    results were mostly elegant, even when working in C. I felt a pure joy joining
    ØMQ and using it to solve real problems, which brought me back to programming
    after a few years'' pause. And often, not knowing how it was “supposed” to be
    done, we improved ØMQ as we went along.


    From the start, I wanted the ØMQ code to be a community project, so I put onto
    GitHub and let others contribute with pull requests. This was a radical, vulgar
    approach by some. We came to a division of labor: I''d do the writing and make
    the original C examples, and others would help fix the text and translate the
    examples into other languages.


    This worked better than I hoped. Now you can find all examples in several languages
    and many in a dozen languages. It''s a kind of programming language Rosetta stone
    and a valuable outcome in itself. We set up a high score: 80% translation and
    your language got its own Guide. PHP, Python, and Luxe reached this goal. People
    asked for PDFs, and we created them. About a hundred people contributed to the
    examples to date.


    The book, in its online-version “The Guide”, achieved its goal of popularizing
    ØMQ. The style pleases most and annoys some, which is how it should be. In December
    2010, my work on ØMQ and this guide stopped, as I found myself going through late-stage
    cancer, heavy surgery, and six months of chemotherapy. When I picked up work again
    in mid-2011, it was to start using ØMQ in one of the largest cases imaginable:
    on the mobile phones and tablets of the world’s best electronics company.


    But the goal of the ØMQ book was, from the start, a printed work. So it was exciting
    to get an email from Bill Lubanovic in January 2012 introducing me to his editor,
    Andy'
