  md: '# Code Connected Volume 1 - Chapter I. Basics


    This “slow joiner” symptom hits people often enough that we’re going to explain
    it in detail. Remember that OMQ does asynchronous I/O, i.e., in the background.
    Say you have two nodes doing this, in this order:


    +   * Subscriber connects to an endpoint and counts messages.

    * Publisher binds to an endpoint and immediately sends 1,000 messages.


    Then the subscriber will most likely receive anything. You’ll blink, check that
    you set a correct filter and try again, and the subscriber will still not receive
    anything.


    Making a TCP connection involves to and handshaking that takes several milliseconds
    over your network and the number of hops between peers. For sake of argument it
    takes 5 msecs to establish a connection, and that same line can handle 1M messages
    per second. During the 5 msecs that the subscriber is connecting to the publisher,
    it takes the publisher only 1 msec to send out those 1K messages.


    So the client subscribes to its chosen zip code and collects a thousand updates
    for that zip code. Randomly distributed. You can start the client, and then the
    server, and the client will keep working. You can stop and restart the server
    as often as you like, and the client will keep working. When the client has collected
    its thousand updates, it calculates the average, prints it, and exits.


    Some points about the publish-subscribe (pub-sub) pattern:


    +   * A subscriber can connect to more than one publisher, using one connection
    each time. Data will then arrive and be interleaved (“fair-queued”) so that no
    single publisher drowns out the others.

    * If a publisher has no connected subscribers, then it will simply drop all messages.

    * If you’re using TCP and a subscriber is slow, messages will queue up on the
    publisher. We’ll look at how to protect publishers against this using the “high-water
    mark” later.

    * From OMQ v3.3, filtering happens at the publisher side when using a connected
    protocol (tcp:// or ipc://) protocol. Using the eps:// protocol, filtering happens
    at the subscriber side. In OMQ v2, all filtering happened at the subscriber side.'
