  md: '# Removing Friction


    I''ll explain the technical tool chain we deigned in terms of the friction we
    removed. In this book we''re telling a story and the goal is to reach as many
    people as possible, as cheaply and smoothly as we can.


    The idea was to host the text and examples on GitHub and make it easy for anyone
    to contribute. It turned out to be more complex than that, however.


    Let''s start with division of labor. I am a good writer and can produce endless
    amounts of decent text quickly. Since the core OMQ API is in C, it seemed logical
    to write the original examples in C. Also, C is a neutral choice; it''s perhaps
    the only language that doesn''t create strong emotions.


    How to encourage people to make translations of the examples? We tried a few approaches
    and finally what worked best was to offer a "choose your language" link on every
    single example, in the text, or to a page explaining how they could contribute.
    The way it usually works is as people learn OMQ in their preferred language, they
    contribute a handful of translations, or fixes to the existing ones.


    At the same time I noticed a few people quite determined translating every single
    example. This was were a great way to encourage people to use their bindings.
    For their efforts, I extended the scripts to produce language-specific versions
    of the book. Instead of including the C code, we''d use the Python, or PHP code.
    Lua and Hase also got their dedicated guides.


    Once we have an idea of who works on, how we know to structure the work itself.
    It''s clear that to write and test an example, what you want to work on is source
    code. So we import this source code when we build the book, and that''s how we
    make language-specific versions.


    I like to write in a plain text format. It''s fast and under source control systems
    like git. Since the main platform for our websites is Wikidot, I write using Wikidot''s
    very readable markup format.


    At least in the first chapters, it was important to draw pictures to explain the
    flow of messages between peers. Making diagrams by hand is a lot of work, and
    when we want to get final output in different formats, image conversion becomes
    a chore. I started with Ditaa, which turns diagrams into PNGs, then later switched
    to asciitosvg, which produces SVG files, which are rather better. Having the graphics
    in the markup text, also as text, makes it remarkably easy to work.


    By now you realize that the toolchain we use is highly customized, though it uses
    a lot of external tools. All are available on Ubuntu, which is a mercy, and the
    whole custom toolchain is in the zguide repository in the bin subdirectory.'
  merge: -1
