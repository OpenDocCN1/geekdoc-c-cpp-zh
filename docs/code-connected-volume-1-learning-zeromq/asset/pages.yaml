  md: '136 Code Connected Volume 1 - Chapter 4. Reliable-Request-Reply Patterns


    +   * Networks can fail (e.g., WiFi gets switched off or goes out of range). ØMQ
    will automatically reconnect in such cases, but in the meantime, messages may
    get lost.


    +   * Hardware can fail and take it with all the processes running on that box.


    +   * Networks can fail in exotic ways, some ports on a switch may die and those
    parts of the network become inaccessible.


    +   * Entire data centers can be struck by lightning, earthquakes, fire, or more
    mundane power or cooling failures.


    To make a software system fully reliable against all of these possible failures
    is an enormously difficult and expensive job goes beyond the scope of this modest
    guide.


    Because the first five cases in the above list cover 99.9% of real requirements
    outside large companies (according to a highly scientific study I just ran, which
    also told me that 78% of statistics are made up on the spot, and moreover never
    to trust a statistic that didn''t falsify ourselves), that''s what we will examine.
    If you''re a large company with money to spend on the last two cases, contact
    my company immediately! There''s a large hole behind my house waiting to be converted
    into an executive swimming pool.


    # # Designing Reliability


    So to make things brutally simple, reliability is “keeping things working properly
    when code freezes or crashes”, a situation we’ll shorten to “dies”. However, the
    things we want to keep working properly are more complex than just messages. We
    need to take each core ØMQ messaging pattern and see how to make it work (if we
    can) even when code dies.


    Let’s take them one-by-one:


    +   * Request-reply: if the server dies (while processing a request), the client
    can figure that out it won''t get an answer back. Then it can give up in a puff,
    wait and try again, find another server, and so on. For the client dying, we can
    crash that off as “someone else’s problem” for now.


    +   * Pub-sub: if the client dies (having some data), the server doesn’t know
    about it. Pub-sub doesn''t get any information from client to server. But the
    client can contact the server out-of-band, e.g., via request-reply, and ask, “please
    resend everything I missed”. As for server dying, that’s out of scope for here.
    Subscribers can also self-verify that they’re not running too slowly, and take
    action (e.g., warn the operator and die) if they are.


    +   * Pipeline: if a worker dies (while working), the ventilator doesn''t know
    about it. Pipelines, like the grinding gears of time, work in one direction. But
    the downstream collector can detect that one task didn''t get done, and send a
    message back to the ventilator saying, “hey, resend task 324!” If the ventilator
    or collector dies, whatever upstream client originally sent the work batch can'
