  md: '# Code Connected Volume 1 - Chapter 2. Sockets and Patterns


    Let''s look at the main differences between TCP sockets and Ø sockets when it
    comes to working with data:


    +   - Ø sockets carry messages, like UDP, rather than a stream of bytes as TCP
    does. A Ø message is length-streamed binary data. We''ll come to mention shortly,
    their design is optimized for performance and so a little tricky.

    - Ø sockets do their I/O in a background thread. This means messages arrive in
    local input queues and are sent from local output queues, no matter what your
    application is busy doing.

    - Ø sockets have one-to-N routing behavior built-in, according to the socket type.


    | Node |

    | Socket |

    | 1 t 1 |

    | Socket |


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_37_0.png)


    The `zmq_send()` method does not actually send the message to the socket connection(s).
    It queues the message so that the I/O thread can send it asynchronously. It does
    not block except in exception cases. So the message is not necessarily sent when
    `zmq_send()` returns to your application.


    # Unicast Transports


    ØMQ provides a set of unicast transports (inproc, ipc, and tcp) and multicast
    transports (epgm, pgm). Multicast is an advanced technique that we''ll come to
    later. Don''t start using unless you know your fan-out ratios make 1-to-N unicast
    impossible.


    For most cases, use tcp, which is a disconnected TCP transport. It is elastic,
    portable, and fast enough for most cases. We call this disconnected because ØMQ''s
    tcp transport doesn''t require that the endpoint exists before you connect to
    it. Clients and servers can connect and bind at any time, go and come back, and
    it remains transparent to applications.


    The inter-process ipc transport is disconnected, like tcp. It has one limitation:
    it does not work on Windows. By convention we use endpoint names with "ipc" to
    avoid potential conflict with other file names. On UNIX systems, if you use ipc
    endpoints need to create these with appropriate permissions otherwise they may
    not be shareable between processes running under different user IDs. You must
    make sure all processes can access the files, e.g., by running in the same working
    directory.


    The inter-thread transport, inproc, is a connecting signal. It is much faster
    than tcp or ipc. This transport has a specific limitation compared to tpc and
    icp: the server must use a bind before any client connects a connect. This is
    something future versions of ØMQ may fix, but at present this defines how you
    use inproc sockets. We create and bind one socket and start the child threads,
    which create and connect the other sockets.'
