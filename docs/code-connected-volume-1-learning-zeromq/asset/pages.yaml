  md: 'Code Connected Volume 1 - Chapter 4. Reliable Request-Reply Patterns


    Recovery from failover works as follows:


    +   - The operators restart the primary server and fix whatever problems were
    causing it to disappear from the network.

    - The operators stop the backup server at a moment it will cause minimal disruption
    to applications.

    - When applications have reconnected to the primary server, the operators restart
    the backup server.


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_198_0.png)


    Figure 53. High-availability Pair During Failover


    Recovery (using the primary server as active) is a manual operation. Painful experience
    teaches us that automatic recovery is undesirable. There are several reasons:


    +   - Failover creates an interruption of service to applications, possibly lasting
    10-30 seconds. If there is a real emergency, this is much better than total outage.
    But if recovery creates a further 10-30 second outage, it is better that this
    happens off-peak, when users have gone off the network.

    - When there is an emergency, the absolute first priority is certainty for those
    trying to fix things. Automatic recovery creates uncertainty for system administrators,
    who can no longer be sure which server is in charge without double-checking.

    - Automatic recovery can create situations where networks fail over and then recover,
    placing operators in the difficult position of analyzing what happened. There
    was an interruption of service, but the fail isn''t clear


    Having said this, the Binary Star pattern will fail back to the primary server
    if this is running (again) and the backup server fails. In fact, this is how we
    provoke recovery. The shutdown process for a Binary Star pair is to:


    +   - Stop the passive server and stop the active server at any later time, or

    - Stop both servers in any order but within a few seconds of each other.


    Stopping the active and then the passive server with any delay longer than the
    failover timeout will cause applications to disconnect, then reconnect, and then
    disconnect again, which may disturb users.


    # Detailed Requirements


    Binary Star is as simple as it can be, while working accurately. In fact, the
    current design is the third complete redesign. Each of the previous designs we
    found to be too complex, trying to do too much, and we stripped out functionality
    until we came'
