  md: '+   - A primary server can have a single backup server, and no more.


    +   - The passive server does no useful work, and is thus wasted.


    +   - The backup server must be capable of handling full application loads.


    +   - Failover configuration cannot be modified at runtime.


    +   - Client applications must do some work to benefit from failover.


    # Preventing Split-Brain Syndrome


    Split-brain syndrome occurs when different parts of a cluster are active at the
    same time. It causes applications to seeing each other. Binary Star has an algorithm
    for detecting and eliminating split brain, which is based on a three-way decision
    mechanism (a server will not decide to become active until it gets application
    connection requests and cannot see its peer).


    However, it is still possible to (mis)design a network to follow this algorithm.
    A typical scenario would be a Binary Star pair, that is distributed between two
    buildings, each building also had a set of applications and where there was a
    single network link between both buildings. Breaking this link would create two
    sets of client applications, with each half of the Binary Star pair, and each
    failover server would become active.


    To prevent split-brain situations, we must connect a Binary Star pair using a
    dedicated network, which can be as simple as plugging them both into the same
    switch, or by using, crossover cable directly between two machines.


    We must not split a Binary Star architecture into two islands, each with a set
    of applications. While this may be a common type of network architecture, you
    should use federation, not high-availability failover, in such cases.


    A suitably paranoid network configuration would use two private cluster interconnects,
    rather than a single one. Further, the network cards used for the cluster would
    be different from those used for message traffic, and possibly even on different
    paths on the server hardware. The goal is to separate possible failures in the
    network and Network ports can have a relatively high failure rate.


