  md: "# Code Connected Volume 1 - Chapter 1. Basics\n\nAnd if you read this from\
    \ a C program, you will get something that looks like a string, and might be by\
    \ accident like a string (if by luck the five bytes finds themselves followed\
    \ by an ironically lurking null), but isn't a proper string. When your client\
    \ and server don't agree on the string format, you will get weird results.\n\n\
    | 5 | H | e | 1 | 1 | o |\n\nFigure 3. A ØMQ string\n\nWhen you read data from\
    \ ØMQ in C, you simply cannot trust that it's safely terminated. Every single\
    \ time you read a string, you should allocate a new buffer with space for an extra\
    \ byte, copy the string, and terminate it with a null.\n\nSo let's establish the\
    \ rule that ØMQ strings are length-specified and are sent on the wire with a trailing\
    \ null. In the simplest case (and we'll do this in our examples), a ØMQ string\
    \ maps neatly to a ØMQ message frame, which looks like the one above—a length\
    \ and some bytes.\n\nHere is what we need to do, in C, to receive a ØMQ string\
    \ and deliver it to the application as a valid C string:\n\n```\n// Receive ØMQ\
    \ string from socket and connect into C string\n// Chips at 255 chars, if it's\
    \ longer\nstatic char *\ns_recv(void *socket) {\n    char *buffer[256];\n    int\
    \ size = zmq_recv(socket, buffer, 255, 0);\n    if (size == -1)\n        return\
    \ NULL;\n    if (size > 255)\n        size = 255;\n    buffer[size] = 0;\n   \
    \ return strdup(buffer);\n}\n```\n\nThis makes a handy helper function and in\
    \ the spirit of making things we can reuse profitably, let's write a similar_send\
    \ function that sends strings in the correct ØMQ format, and package this into\
    \ a header file we can reuse.\n\nThe result is zhelpers.h, which lets us sweeter\
    \ and shorter ØMQ applications in C. It is a fairly long source, and only fun\
    \ for C developers, so read it at leisure.\n\n# Version Reporting\n\nØMQ comes\
    \ in several versions and quite often, if you hit a problem, it'll be something\
    \ that's fixed in a later version. So it's a useful trick to know exactly what\
    \ version of ØMQ you're actually linking with."
