    Figure 29. Reply with one Address


    The REQ socket picks this message, and checks that the first frame is the empty
    delimiter, which it is. The REQ socket discards that frame and passes “World”
    to the calling application, which prints it out to the amazement of the younger
    looking at OMQ for the first time.


    | Frame 1 | 0 | Empty delimiter frame |

    | Frame 2 | 5 | World | Data frame |


    Figure 30. Reply with Minimal Envelope


    # What’s Good For?


    To be honest, the cases for strict-reply or extended request-reply are somewhat
    limited. For one thing, there’s no easy way to recover from common failures like
    the server crashing due to bug application. We’ll see more about this in “Reliable
    Request-Reply Patterns”. However once you grasp the way these four sockets talk
    to each other, they can do very useful things. We see how ROUTER uses the envelope
    to decide which client REQ socket to route a reply back to. Now let’s explore
    this another way:


    +   - Each time ROUTER gives you a message, it tells you what peer came from,
    as an identity.

    - You can use this with a hash table (with the identity as key) to track new peers
    as they arrive.

    - ROUTER will route messages asynchronously to any peer connected to it, if you
    prefix the identity as the first frame of the message.'
