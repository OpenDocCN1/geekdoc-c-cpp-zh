  md: '+   - Any service that modifies shared data in some non-idempotent way; e.g.,
    a service that debits a bank account is not idempotent without extra work.


    When our server applications are not idempotent, we have to think more carefully
    about exactly they might crash. If an application dies when it''s idle, or while
    it''s processing a request, that''s usually fine. We can use database transactions
    to make sure a debit and a credit are always done together, at all. If the server
    dies while sending its reply, that''s a problem, because as far as it''s concerned,
    it has done its work.


    If the network dies just as the reply is making its way back to the client, the
    problem arises. The client will think the server died and will resend the request,
    and the server will do the same work, which is not what we want.


    To handle non-idempotent operations, use the fairly standard solution of detecting
    and rejecting duplicate requests. This means:


    +   - The client must stamp every request with a unique client identifier and
    a unique message number.


    +   - The server, before sending back a reply, stores it using the combination
    of client ID and message number as a key.


    +   - The server, when getting a request from a given client, first checks whether
    it has a reply for that client ID message number. If so, it does not process the
    request, but just resends the reply.


    # Disconnected Reliability (Titanic Pattern)


    Once you realize Majordomo is a "reliable" message broker, you might be tempted
    to add spinning rust (that is, ferrous-based disk platters). After all, this works
    for all the enterprise messaging systems. It''s such tempting idea that it''s
    a little sad to have negative toward it. But brutal cynicism is one of my specialties.
    So, reasons you don''t want rust-based brokers sitting in the center of your architecture
    are:


    +   - As you''ve seen, the Lazy Pirate client performs surprisingly well. It works
    across a whole range of architectures, from direct client-to-server to distributed
    queue proxies. It does not assume that workers are stateless and idempotent. But
    we can work around limitation resorting to rust.


    +   - Rust brings a set of problems, from slow performance to additional pieces
    that you have to manage, repair, and handle 6 a.m. panics, from as they inevitably
    break at the start of daily operations. The beauty of the Pirate patterns in general
    is their simplicity. They won''t crash. And if you''re still worried about the
    hardware, you can move to a peer-to-peer pattern that has no broker at all. I''ll
    explain later in this chapter.


    Having said this, however, there is one sane case for rust-based reliability,
    which is an asynchronous disconnected network. It solves a major problem with
    Pirate, namely that a client has to wait for an answer in real time. If clients
    and workers are only'
