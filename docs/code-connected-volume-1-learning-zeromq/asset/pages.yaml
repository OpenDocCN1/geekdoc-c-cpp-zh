    +   - The Broker queues and distributes workloads using the load balancing pattern.


    # Federation Versus Peering


    There are several possible ways to interconnect brokers. What we want is to be
    able to tell other brokers, “we have capacity”, and then receive multiple tasks.
    We also need to be able to tell other brokers, “stop, we’re full”. It doesn’t
    need to be perfect; sometimes we may accept jobs we can’t process immediately,
    then we’ll do that as soon as possible.


    The simplest interconnect is federation, in which brokers simulate clients and
    workers for each other. We would do this by connecting our frontend to the other
    broker''s backend socket (see figure 43). Note that it is legal to bind a socket
    to an endpoint and connect it to other endpoints.


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_114_0.png)


    This would give us simple logic in both and a reasonably good mechanism: when
    there are no clients, tell the other broker “ready”, and accept one job from it.
    The problem is also that it is too simple for this problem. A federated broker
    would be able to handle only one task at a time. If broker emulates a lock-step
    client and worker, it is by definition also going to lockstep, if it has lots
    of available workers they won’t be used. Our brokers need to be connected in a
    fully asynchronous fashion.


    The federation model is perfect for other kinds of routing, especially service-oriented
    architectures (SOAs), which route by service name and proximity rather than load
    balancing or robin robin. So don’t dismiss it useless, it’s just not right for
    all cases.


    Instead of federation, let’s look at a peering approach in which brokers are explicitly
    aware of each other and talk over privileged channels. Let’s break this down,
    assuming we want to interconnect N brokers. Each broker has (N - 1) peers, and
    all brokers are using exactly the same code and logic. There are two distinct
    flows of information between brokers:


    +   - Each broker needs to tell its peers how many workers it has available at
    any time. This can be fairly simple—just a quantity that is updated regularly.
    The obvious (and correct) socket pattern for this is pub-sub. Every broker opens
    a PUB socket and publishes state information on that, and every broker also opens
    a SUB socket and connects to the PUB socket of every other broker to get state
    information from its peers.'
