    exceptions, e.g., SUB sockets will send subscriptions to PUB sockets, but it''s
    anonymous and infrequent.


    Killing back-chatter is essential to real scalability. With pub-sub, it''s how
    the pattern can cleanly switch to the PGM multicast protocol, which is handled
    by the network switch. In other words, subscribers don''t connect to the publisher
    at all, they connect to a multicast group on the switch, which the publisher sends
    its messages.


    When we remove back-chatter, our overall message flow becomes much simpler, lets
    us make simpler APIs, simpler protocols, and in general reach many more people.
    But we also remove any possibility to coordinate servers and receivers. What this
    means is:


    +   * Publishers can''t tell when subscribers are successfully connected, both
    on initial connections, and on reconnections after network failures.

    * Subscribers can''t tell publishers anything that would allow publishers to control
    the rate of messages they send. Publishers only have one setting, which is full,
    and subscribers must either keep up or lose messages.

    * Publishers can''t tell when subscribers have disappeared due to processes crashing,
    networks breaking, and so on.


    The downside is that we actually need all of these if we want to reliable multicast.
    When a subscriber is connecting, when a network failure occurs, or if just the
    subscriber or network can''t keep up with the publisher.


    The upside is that there are many cases where almost reliable multicast is just
    fine. When we need this back-chatter, we can either switch to using ROUTERDE (which
    I intend to do for most normal volume cases), or we can add a separate channel
    for synchronization (we''ll see an example of this later in this chapter).


    Pub-sub is like a radio broadcast; you miss everything before you join, and then
    how much information you get depends on the quality of your subscription. Surprisingly,
    this model is useful and widespread because it maps perfectly to real world distribution
    of information. Think of Facebook and Twitter, the BBC World Service, and the
    sports results.


    As we did for request-reply, let''s define reliability in terms of what can go
    wrong. Here are the classic failure cases for pub-sub:


    +   * Subscribers join late, so they miss the messages already sent.

    * Subscribers fetch fetch too slowly, so queues build up and then overflow.

    * Subscribers can drop off and lose messages while they are away.

    * Subscribers can crash and restart, and lose whatever data they already received.

    * Networks can become overloaded and drop data (specifically, for PGM).

    * Networks can become too slow, so publisher-side overflow and publishers crash.


    A lot more can go wrong but these are the typical failures we see in a realistic
    system. Since v3.x, ØMQ has default limits on its internal buffers (the-called
