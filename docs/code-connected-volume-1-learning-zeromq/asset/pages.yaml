  md: 'Brooks missed free and open source software, which solved that crisis, enabling
    us to share knowledge efficiently. Today we face another software crisis, but
    it''s one we don''t talk about much. The largest, richest firms can afford to
    create applications. There is a cloud, but it''s proprietary. Our data and our
    knowledge is disappearing from our personal computers into clouds that we cannot
    access and with which we cannot compete. Whose our social networks? It is the
    mainframe-PC revolution in reverse.


    We can learn the political philosophy for another book³. The point is that while
    the Internet offers the potential of massively connected, the reality is that
    this is out of reach for most of us, and so large problems (in health, education,
    economics, transport, and so on) remain unresolved because there is no way to
    connect the code, and no way to connect the brains that work together to solve
    these problems.


    There have been many attempts to solve the challenge of connected code. There
    are thousands of IETF specifications, each solving part of the puzzle. For application
    developers, HTTP is perhaps the one solution to be simple enough to work, but
    it arguably makes the problem worse by encouraging developers and architects to
    think in terms of big servers and thin clients.


    Today people are still connecting applications using UDP and TCP, proprietary
    protocols, HTTP, and Websockets. It remains painful, slow, hard to scale, and
    essentially decentralized. Distributed P2P architectures are mostly for play,
    not work. How many applications use Skype or Bittorent to exchange data?


    Which brings us back to the science of programming. To fix the world, we needed
    to do two things. One, to solve the general problem of “how to connect any code
    to code, anywhere”. Two, to wrap that up in the simplest possible building blocks
    that people could understand and use easily_.


    It sounds ridiculously simple. It is it. And maybe that''s kind of the whole point.


    # Starting Assumptions


    We assume you are using version 3.2 of ØZMQ. We assume you are using a Linux box
    or something similar. We assume you can read C code, more or less, as that’s the
    default language for the examples. We assume that when we write constants like
    PUSH or SUBSCRIBE, you can imagine they are really called ZMQ_PUSH or ZMQ_SUBSCRIBE
    if the programming language needs it.'
