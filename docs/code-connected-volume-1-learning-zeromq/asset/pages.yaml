  md: '# Code Connected Volume 1 - Chapter 4. Reliable Request-Reply Patterns


    +   - Be reliable, because if it is unavailable, applications won''t be able to
    connect to the network.


    Putting a name service behind a service-oriented Majdomo broker is clever from
    some points of view. However, it''s simpler and less surprising to just expose
    the name service as a server to which clients can connect directly. If we do this
    right, the name service becomes the only global network endpoint we need to hard-code
    in our code or configuration files.


    The types of failure we aim to handle server crashes and restarts, server looping,
    server overload, and network issues. To get reliability, we''ll create a pool
    of name servers if one crashes or goes away, clients can connect to another, and
    so on. In practice, two for the example, we''ll assume the pool can be any size
    (see figure 55).


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_214_0.png)


    In this architecture, a large set of clients connect to a small set of servers
    directly. The servers bind to their respective addresses. It''s fundamentally
    different from a broker-based approach like Majdomo, where workers connect to
    the broker. Clients have a couple of options:


    +   - Use REQ sockets and the Lazy Pirate pattern. Easy, but we would need some
    additional intelligence so clients don''t stupidly try to reconnect over and over.

    - Use DEALER sockets and blast out requests (which will be balanced to all connected
    servers) until they get a reply. Effective, but not elegant.

    - Use ROUTER sockets so clients can address specific servers. But how does the
    client know the identity of the server sockets? Either the server has to ping
    the client first (complex), or the server has to use a hard-coded, fixed identity
    known to the client (nasty).


    We''ll develop each of these in the following subsections.


    # Model One: Simple Retry and Failover


    Our menu appears to offer: simple, brutal, complex, or nasty. Let''s start with
    simple and then work out the kinks. We take Lazy Pirate and rewrite it to work
    with multiple server endpoints.'
