  md: 'accurately. It’s hard to prove software correct; instead we hammer it until
    we can’t prove it wrong.


    Failover happens as follows:


    +   - The client detects that primary server is no longer sending heartbeats,
    and concludes that it has died. The client connects to the backup server and requests
    a new state snapshot.

    - The backup server starts to receive snapshot requests from clients, and detects
    that primary server has gone, so it takes over as primary.

    - The backup server applies its pending list to its own hash table, and then to
    process snapshot requests.


    When the primary server comes back online, it will:


    +   - Start up as passive server, and connect to the backup server as a Clone
    client.

    - Start to receive updates from clients, via its SUB socket.


    We make a few assumptions:


    +   - At least one server will keep running. If both servers crash, we lose all
    server state and there’s no way to recover it.

    - Multiple clients do not update the hash keys at the same time. Client updates
    will arrive at the two servers in a different order. Therefore, the backup server
    may apply updates from its pending list in a different order than the primary
    server would or. Updates from one client will always arrive in the same order
    on both servers, so that is safe.


    Thus the architecture for our high-availability server pair using the Binary Star
    pattern has two servers and a set of clients that talk to both servers (see figure
    62).


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_285_0.png)


    Figure 62. High-availability Clone Server Pair'
