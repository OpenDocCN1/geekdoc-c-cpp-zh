  md: '# Code Connected Volume 1 - Chapter 2. Sockets and Patterns


    Many architectures follow some kind of client/server model, where the server is
    the component that is most static, and the clients are the components that are
    most dynamic, i.e., they come and go most. There are sometimes issues of addressing:
    servers will be visible to clients, but not necessarily versa. Most so it''s obvious
    which node should be doing `zmq_bind()` (the server) and which should be doing
    `zmq_connect()` (the client). It also depends on the kind of sockets you''re using,
    with some exceptions for unusual network architectures. We''ll look at socket
    types later.


    Now, imagine we start client before we start the server. In traditional networking,
    we get a big Red Fail. But ØMQ lets us start and stop pieces arbitrarily. As soon
    as the client node does `zmq_connect()`, the connection exists and that node can
    write messages to the socket. At some stage (hopefully before messages queue up
    so much that they start to get discarded, or the client blocks), the server comes
    alive, done `zmq_bind()` and ØMQ delivers messages.


    A server node can bind to many endpoints (that is, a combination of protocol and
    address) and it can do this using a single socket. This means it will accept connections
    across different transports:


    ```

    zmq_bind(socket, "tcp://*:5555")

    zmq_bind(socket, "tcp://*:9999")

    zmq_bind(socket, "inproc://somename")

    ```


    With transports, you cannot bind to the same endpoint twice, unlike for example
    in UDP. The ipc transport does, however, let one process bind to an endpoint already
    used by a first process. It''s meant to allow a process to recover after a crash.


    Although ØMQ tries to be neutral about which side binds and which side connects,
    there are differences. We''ll discuss this in more detail later. The upside is
    that you should usually think in terms of "servers" as static parts of your topology
    that bind to more or less fixed endpoints, and "clients" as dynamic parts that
    go and connect to these endpoints. Then, design your architecture around this
    model. The chances that it will "work" are much better like that.


    Sockets have types. The socket type defines the semantics of the socket, its policies
    for routing messages inwards and outwards, queuing, etc. You can connect certain
    types of socket together, e.g., a publisher socket and a subscriber socket. Sockets
    work together in "messaging patterns". We''ll look at this in more detail later.


    It''s the ability to connect sockets in different ways that makes ØMQ''s basic
    power as a messaging queue system. There are layers on top of this, such as proxies,
    which we''ll get to later. But essentially, with ØMQ you define your architecture
    by plugging pieces together like a child''s construction toy.


    # Sending and Receiving Messages


    To send and receive messages you use the `zmq_msg_send()` and `zmq_msg_recv()`
    methods. The names are conventional, but ØMQ''s I/O model is different enough
    from the classic TCP model (see figure 9) that you will need time to get your
    head around it.'
