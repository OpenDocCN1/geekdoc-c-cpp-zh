  md: "Code Connected Volume 1 - Chapter 2. Sockets and Patterns\n\nTo do zero-copy,\
    \ you use zm_msg_init_data() to create a message that refers to a block of data\
    \ allocated with malloc() or some other allocator, and then you pass that to zm_msg_send().\
    \ When you create the message, you also pass a function that OMQ will call to\
    \ free the block of data, when it has finished sending the message. This is the\
    \ simplest example, assuming buffer is a block of 1,000 bytes allocated on the\
    \ heap:\n\n```\nvoid my_free (void *data, void *hint) {\n    free(data);\n}\n\
    // Send message from buffer, which we allocate and OMQ will free for you\nzmq_msg_t\
    \ message;\nzmq_msg_init_data(&message, buffer, 1000, free, NULL);\nzmq_msg_send(socket,\
    \ &message, 0);\n```\n\nNote that you don't call zmq_msg_close() after sending\
    \ a message—libzmq will do this automatically when it's actually sending the message.\n\
    \nThere is no way to zero-copy on receive: OMQ delivers a buffer that you can\
    \ store as long as you wish, but you will not write data into application buffers.\n\
    \nOn writing, OMQ's multipart messages work nicely together with zero-copy. In\
    \ traditional messaging, you need to marshall buffers together into one buffer\
    \ that you can send. With copying data With OMQ, you can send multiple buffers\
    \ coming from different sources as individual message frames. Each field is a\
    \ length-delimited frame. To the application, it looks like a series of send and\
    \ receive calls. Internally, the multiple parts get written to the network and\
    \ read back with single system calls, so it's very efficient.\n\n# Pub-Sub Message\
    \ Envelopes\n\nIn the pub-sub pattern, we can split the key into a separate message\
