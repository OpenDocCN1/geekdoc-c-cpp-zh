    +   * Client: Do you have a reply for me? Titanic: Yes, here it is. Or, no, not
    yet.

    * Client: OK, you can wipe that request now, I''m happy. Titanic: OK, done.

    * Titanic: Hey, Broker, is there a coffee service? Broker: Uhm, Yeah, seems like.

    * Titanic: Hey, coffee service, please handle this for me.

    * Coffee: Sure, here you are.

    * Titanic: Swee!


    Whereas the dialog between Titanic and broker worker goes like this:


    You can work through this and the possible failure scenarios. If a worker crashes
    while processing a request, Titanic retries indefinitely. If a reply gets lost
    somewhere, Titanic will retry. the request gets processed but the client doesn''t
    get the reply, it will ask again. If Titanic crashes while processing a request
    or a reply, the client will try again. As long as requests are fully committed
    to storage, worker can''t get last.


    The handshaking is pedantic, but can be pipelined, i.e., clients can use the asynchronous
    Majordo pattern to do a lot of work and then get the responses later.


    We need some way for a client to request its replies. We will have many clients
    for the same services, and clients disappear and reappear with different identities.
    Here is a simple, reasonably secure solution:


    +   * Every request generates a uniquely ID (UUID), which Titanic returns to the
    client after it has queued the request.

    * When a client asks for a reply, it must specify the UUID for the original request.


    In a realistic case, the client would want to store its UUIDs safely, e.g., in
    a local database.


    Before we jump off and write another formal specification (fun, fun!), let''s
    consider how client talks to Titanic. One way is to use a single service and send
    it different request types. Another way, which seems simpler, is to use three
    services:


    +   * titanic.request: store a request message, and return a UUID for the request.

    * titanic.reply: fetch a reply, if available, for a given UUID.

    * titanic.close: confirm that a reply has been stored and processed.


