  md: 'Code Connected Volume 1 - Preface


    Oram, at O''Reilly, suggesting a ØMQ book. Where do I sign? How much do I have
    to pay? Oh, I get money for this? All I have to do is finish it?


    As soon as O''Reilly announced a ØMQ book, other publishers started sending out
    emails to potential authors. You''ll probably see a race of ØMQ books coming out
    next year. That''s good. Our niche library has hit the mainstream and deserves
    its six inches of shelf space. My apologies to the other ØMQ authors. We''ve set
    the bar horribly high, and my advice is to make your books complementary. Perhaps
    focus on a specific language, platform, or pattern.


    This is the magic and power of communities: be the first community in a space,
    stay healthy, and you own that space for ever.


    # Audience


    This book is written for professional programmers who want to learn how to make
    the massively distributed software that will dominate the future of computing.
    We assume you can read C code, because most of the examples here are in C even
    though ØMQ is used in many languages. We assume you care about scale, because
    ØMQ solves problem over all others. We assume you need the best possible results
    with the least possible cost, because otherwise you won''t appreciate the trade-offs
    ØMQ makes. Other than that basic background, we try to present all the concepts
    in networking and distributed computing you will need to use ØMQ.


    # Code Connected


    This book, "Code Connected Volume 1", is the first volume covering the theme of
    how to build distributed software over ØMQ. In this book, you''ll learn how to
    use the ØMQ library. We''ll cover the basics, the API, the different socket types
    and how they work, reliability, and a host of patterns you can use in your applications.
    You''ll get the best results by working through the examples and text from start
    to end.


    This is the Professional Edition for C/C++ developers. But whatever your programming
    language, the patterns and techniques that Code Connected explains are relevant
    to you. Get the examples online in C, C++, C#, Clojure, Delphi, Erlang, Go, Haskell,
    Haxe, Java, Lisp, Lua, Node.js, Objective-C, Perl, PHP, Python, Ruby, Scala, and
    Tcl.'
