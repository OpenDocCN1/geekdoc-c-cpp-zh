  md: '# # Chapter 3. Advanced Request-Reply Patterns


    In "Sockets and Patterns” we worked through the basics of using ØMQ by developing
    a series of small applications, each time exploring new aspects of ØMQ. We’ll
    continue this approach in this chapter as we explore advanced patterns built on
    top of ØMQ’s core request-reply pattern.


    We’ll cover:


    +   - How the request-reply mechanisms work.

    - How to combine REQ, REP, DEALER, and ROUTER sockets.

    - How ROUTER sockets work, in detail.

    - The load balancing pattern.

    - Building a simple load balancing message broker.

    - Designing a high-level API for ØMQ.

    - Building an asynchronous request-reply server.

    - A detailed inter-broker routing example.


    # ## The Request-Reply Mechanisms


    We already looked briefly at multipart messages. Let’s now look at a major case,
    which is reply message envelopes. An envelope is a way of safely packaging up
    data with an address, without touching the data itself. By separating addresses
    into an envelope we make it possible to write general purpose intermediaries such
    as APIs and proxies that create, read, and remove addresses no matter what the
    message payload or structure.


    In the request-reply pattern, the envelope holds the return address for replies.
    It is how a ØMQ network with no state can create round-trip request-reply dialogues.


    When you use REQ and REP sockets you don’t even envelopes; these sockets deal
    with them automatically. But for some of the most interesting request-reply patterns,
    you’ll want to understand envelopes and particularly ROUTER sockets. We’ll work
    through this step-by-step.


    # ## The Simple Reply Envelope


    A request-reply exchange consists of a request message, and an eventual reply
    message. In the simple request-reply pattern, there’s one reply for each request.
