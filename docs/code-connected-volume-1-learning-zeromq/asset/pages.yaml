- img_proc: true
  md: 'This design lets you add more clients cheaply. You can also add more services.
    Each client will distribute its requests to the services. Each client has to know
    the topology. If you have 100 clients and then you decide to add three more services,
    you need to reconfigure and restart 100 clients in order for the clients to know
    about the new services.


    That''s clearly the kind of thing we want to be doing at 3 a.m. when our supercomputing
    cluster has out of resources and we desperately need to add a couple of new service
    nodes. Too many static pieces are like liquid concrete: knowledge is distributed
    and the more static pieces you have, the more effort it is to change the topology.
    What we want is something sitting between clients and services that centralizes
    all knowledge of the topology. Ideally, we should be able to add and remove services
    at any time without touching any other part of the topology.


    So we''ll write a little message queuing broker that gives us this flexibility.
    The broker to two endpoints, a frontend for clients and a backend for services.
    It uses zmq_poll() to monitor these two sockets for activity and when it has some,
    it shuttles messages between them. It doesn''t actually manage any queues explicitly—ØMQ
    does automatically on each socket.


    When we use REQ to REP, you get a strictly synchronous request-reply dialog. The
    client sends a request. The service receives the request and sends a reply. If
    either the client or the service try to do anything else (e.g., sending two requests
    in a row without waiting for a response), you will get an error.


    But our broker has to be non-blocking. Obviously, we can use zmq_poll() to wait
    for activity on either socket, but we can''t use REP and REP.


    Luckily, there are two sockets called DEALER and ROUTER that let you do non-blocking
    request-response. You''ll see in “Advanced Request-Reply Patterns” how DEALER
    and ROUTER sockets let you build all kinds of asynchronous request-reply flows.
    For now, we''re just going to see how DEALER and ROUTER let us extend REQ-REP
    across an intermediary, that is, our little broker.


    In this simple extended request-reply pattern, REQ talks to ROUTER and DEALER
    talks to REP. Between the DEALER and ROUTER, we have to have code (like our broker)
    that pulls messages off one socket and shoves them onto the other (see figure
    16).


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_49_0.png)'
