  md: '# Prototyping the Local and Cloud Flows


    Let''s now prototype at the flow of tasks via the local and cloud sockets (see
    figure 46). This code pulls requests from cloud clients and distributes them to
    local workers and cloud peers on a random basis.


    Before we jump into the code, which is getting a little complex, let''s sketch
    the core routing logic and break it down into a simple yet robust design.


    We need two queues, one for requests from local clients and one for requests from
    cloud clients. One option would be to pull messages off the local and cloud frontends,
    and pump these into their respective queues. This is this kind of pointless because
    OMQ sockets are already used. So let''s use the OMQ socket buffer as queues.


    This was the technique used in the load balancing broker, and it worked nicely.
    We only read from the two frontends when there is somewhere to send the requests.
    We can always read from the backends, as they give us replies to route back. As
    long as the backends aren''t talking to us, there''s no point in even looking
    at the frontends.


    Our main loop becomes:


    +   - Poll the backends for activity. When we get a message, it may be “ready”
    from a worker or it may be a reply. If it''s a reply, route back via the local
    or cloud frontend.

    - If a required, it became available, so we queue it and count it.

    - While there are workers available, take a request, if any, from either frontend
    and to a local worker, or randomly, to a cloud peer.


    Randomly sending tasks to a peer broker rather than a worker simulates work distribution
    across the cluster. It''s dumb, but that''s for this for stage.


    We use broker identities to route messages between brokers. Each broker has a
    name that we provide on the command line in this simple prototype. As long as
    these names don''t overlap with the OMQ-generated UUIDs used for client nodes,
    we can figure out whether to route a reply to a client or to a broker.


    Here is how this works in code. The interesting part starts around the comment
    “Interesting part”.


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_119_0.png)'
