  md: "# Code Connected Volume 1 - Chapter 2. Sockets and Patterns\n\nThe simple answer\
    \ is to build a bridge. A bridge is a small application that speaks one protocol\
    \ at one socket, and converts to/from another protocol at another socket. A protocol\
    \ interpreter, if you like. A common bridging problem in ØMQ is to bridge two\
    \ transports or networks.\n\nAs an example, we're going to a little proxy that\
    \ sits between a publisher and a set of subscribers, bridging two networks. The\
    \ frontend socket (SUB) faces the internal network where the weather server is\
    \ sitting, and the backend (PUB) faces subscribers on the external network. It\
    \ subscribes to the weather service on the frontend socket, and repubishes its\
    \ data on the backend socket.\n\nWeather update proxy (wuprobe.c)\n\n```\n// Weather\
    \ proxy demo\n\n#include \"zhelpers.h\"\n\nint main(void)\n{\n\tvoid *context\
    \ = zmq_ctx_new();\n\n\t\t// This is where the weather server sits\n\tvoid *frontend\
    \ = zmq_socket(context, ZMQ_XUB);\n\tmq_connect(frontend, \"tcp://192.168.55:210:5556\"\
    );\n\n\t\t// This is our public endpoint for subscribers\n\tvoid *backend = zmq_socket(context,\
    \ ZMQ_PUB);\n\tmq_bind(backend, \"tcp://10.1.1.0:8100\");\n\n\t\t// Run the proxy\
    \ until the user interrupts it\n\tmq_proxy(frontend, backend, NULL);\n\n\tmq_close(frontend);\n\
    \tmq_close(backend);\n```\n\n![](img/4bfb6119de42e06bff7b1880c181ba6e_54_0.png)"
