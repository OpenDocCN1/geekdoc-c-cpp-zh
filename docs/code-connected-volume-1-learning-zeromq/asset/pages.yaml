  md: "# Code Connected Volume 1 - Postface\n\nThe reason I was confident this would\
    \ work was that our work on this book had, for a year or more, shown the way.\
    \ True, the text is my own work, which is perhaps as it should be. Writing is\
    \ not programming. When we write, we tell a story and one doesn't different voices\
    \ telling one all, it feels strange.\n\nFor the real long-term value of the book\
    \ is the repository of examples: about 65,000 lines of code in 24 different languages.\
    \ It's partly about making 0MQ accessible to more people. People already refer\
    \ to the Python and PHP example repositories—two of the most complete—when they\
    \ want to tell others how to learn 0MQ. But it's also learning programming languages.\n\
    \nHere's a loop of code in Tc:\n\n```\nwhile i {\n    # Process all parts of the\
    \ message\n    zmq message message\n    frontend recv_msg message\n    set more\
    \ [frontend getsockopt RCVMORE]\n    backend send_msg message [expr {$more?\"\
    SNDMORE\":\"\"}]\n    message close\n    if (!more) {\n        break; # Last message\
    \ part\n    }\n}\n```\n\nHere's the same loop in Lua:\n\n```\nwhile true do\n\
    \    -- Process all parts of the message\n    local msg = frontend:recv()\n  \
    \  if (frontend:getopt(zmq.RCVMORE) == 1) then\n        backend:send(msg, SNDMORE)\n\
    \    else\n        backend:send(msg, 0)\n        break; -- Last message part\n\
    \    end\n```\n\nAnd this particular example (rboker) is in C#, C++, CL, Cloj,\
    \ Erlang, F#, Go, Haskell, Haxe, Java, Lua, Perl, PHP, Python, Ruby, Scala, Tac,\
    \ and all of C. This code base, provided as open source under the MIT/X11 license,\
    \ may form the basis for other books, or projects.\n\nBut what this collection\
    \ of translations says most profoundly is: the language you choose is a detail,\
    \ even a distraction. The power of OMQ lies in the patterns it gives you and lets\
    \ you build, and these transcend the comings and goes of languages. My goal as\
    \ a software and social architect is to build structures that can last generations.\
    \ There seems no point in aiming for mere decades."
