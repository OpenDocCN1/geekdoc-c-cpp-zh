  md: '# 42 Code Connected Volume 1 - Chapter 2. Sockets and Patterns


    On the wire, ØMQ messages are blobs of any size from zero upwards that fit in
    memory. You do your own serialization using protocol buffers, msgpack, JSON, or
    whatever your applications need to speak. It''s wise to choose a data representation
    that is portable, but you can make your own decisions about trade-offs.


    In memory, ØMQ messages are zmq_msg_t structures or classes depending on your
    language. Here are the ground rules for using ØMQ messages in C:


    +   - You create and pass zmq_msg_t objects, not blocks of data.

    - To read a message, use zmq_msg_init() to create an empty message, and then pass
    that to zmq_msg_recv().

    - To create a message from new data, use zmq_msg_init_size() to create a message
    and at the same time allocate a block of data of some size. You then fill that
    data using memcpy, and pass the message to zmq_msg_send().

    - To release (destroy) a message, use zmq_msg_close(). This drops a reference,
    and eventually ØMQ will destroy the message.

    - To access the content, use zmq_msg_data(). To know how much data the message
    contains, use zmq_msg_size().

    - Do not use zmq_msg_move(), zmq_msg_copy(), or zmq_msg_init_data() unless you
    read the pages and know precisely which you need these.

    - After you pass a message to zmq_msg_send(), ØMQ will clear the message, i.e.,
    set the size to zero. You cannot send the same message twice, and you cannot access
    the data after sending it.

    - These rules don''t apply if you use zmq_msg_recv() and zmq_msg_copy(), to which
    you pass byte arrays, not message structures.


    If you want to send the same message more than once, and it''s sizable, create
    a second message, initialize it using zmq_msg_init(), and then use zmq_msg_copy()
    to create a copy of the first message. This does not copy the data but copies
    a reference. You can then send the message twice (or, if you create more copies)
    and the message will only be finally destroyed when the last copy is sent or closed.


    ØMQ also supports multipart messages, which let you send or receive a list of
    frames as a single on-the-wire message. This is widely used in real applications
    and we''ll look later in this chapter and in "Advanced Request-Reply Patterns".


    Frames (also called "message parts") in the ØMQ reference manual pages) are the
    basic format for ØMQ messages. A frame is a length-specified block of data. The
    length can be zero upwards. If you''ve done TCP programming you''ll appreciate
    why frames are a useful answer to the question "how much data am I supposed to
    read of this network socket?


    There is a wire-level protocol called ZTMP¹² that defines how ØMQ reads and writes
    frames on a TCP connection. If you''re interested in how this works, the spec
    is quite short.'
