  md: '# Code Connected Volume 1 - Chapter 2. Sockets and Patterns


    This is the first time we''ve shown an example using PAIR. Why use PAIR? Other
    socket combinations might seem to work, but they all have side effects that could
    interfere with signaling:


    +   - You can use PUSH for the sender and PULL for the receiver. This looks simple
    and will work, remember that PAIR will distribute messages to all available receivers.
    If by accident start two receivers (e.g., you already have one running and you
    start a second), you’ll “lose” half of your signals. PAIR has the advantage of
    refusing more than one connection; the pair is exclusive.

    - You can use DEALER for the sender and ROUTER for the receiver. ROUTER, wraps
    your message in an “envelope”, meaning your zero-size signal turns into a multipart
    message. If you don’t care about the data and treat anything as valid signal,
    and if you don’t read more than once from the socket, that won’t matter. If, however,
    you decide to send real data, you suddenly find ROUTER providing you with “wrong”
    messages. DEALER also distributes outgoing messages, giving the same risk as PUSH.

    - You can use PUB for the sender and SUB for the receiver. This will correctly
    deliver your messages exactly as you sent them and PUB does not distribute as
    PUSH or DEALER. However, you need to configure the subscriber with an empty subscription,
    which is annoying.


    For these reasons, PAIR makes the best choice for coordination between pairs of
    threads.


    # Node Coordination


    When you want to coordinate a set of nodes on a network, PAIR sockets won’t work
    well more. This is one of the few areas where the strategies for threads and nodes
    are different. Principally, nodes come and whereas threads are usually static.
    PAIR sockets do not automatically reconnect the remote node goes away and comes
    back.


    The second difference between threads and nodes is that you typically have a fixed
    number of threads but a more variable number of nodes. Let’s take one of our earlier
    scenarios (the weather server and clients) and use node coordination to ensure
    that subscribers don’t lose data when starting up.


