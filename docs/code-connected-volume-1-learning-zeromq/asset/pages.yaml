    # Programming with 0MQ


    Having some examples, you might be eager to using 0MQ in some apps. Before you
    start, take a deep breath, chillax, and reflect on some basic advice that will
    save you stress and confusion.


    +   - Learn 0MQ step-by-step. It''s just one simple API, but it hides a world
    of possibilities. Take the possibilities slowly and master each one.

    - Write nice code. Ugly code hides problems and makes it hard for others to help
    you. You might get used to using meaningless variable names, but people reading
    your code won''t. Use names that are real words, that say something other than
    “I''m too scared to tell you what this variable is really for”. Consistent indentation
    and clean layout. Write nice code and your world will be comfortable.

    - Test what you make as you it. When your program doesn''t work, you should know
    which five lines are to blame. This is especially true when you do 0MQ magic,
    which just won''t work the first few times you try.

    - When you find that things don''t work as expected, break your code into pieces,
    test each one, see which one is not working. 0MQ lets you essentially modular
    code; use that to your advantage.

    - Make abstractions (classes, methods, whatever) as you need them. If you copy/paste
    a lot of code, you''re going to copy/paste errors, too.'
