  md: '# 248 Code Connected Volume 1 - Chapter 5. Advanced Pub-Sub Patterns


    And as we pump data into our subscribers, we notice two things:


    +   1. When we do even the slightest amount of work with a message, it slows down
    our subscriber to the point where it can''t catch up with the publisher again.

    2. We''re hitting a ceiling, at both publisher and subscriber, to around 6M messages
    a second, even after careful optimization and TCP tuning.


    The first thing we have to do is break our subscriber into a multithreaded design
    so that we can work in threads, while reading messages in another. Typically,
    we don''t want to process every message the same way. Rather, the subscriber will
    filter some messages, perhaps by prefix key. When a message matches some criteria,
    the subscriber will call a worker to deal with it. In ØMQ terms, this means sending
    the message to a worker thread.


    So the subscriber looks something like a queue device. We could use various sockets
    to connect the subscriber and workers. If we assume one-way traffic and workers
    are all identical, we can use PUSH and PULL and delegate all the routing work
    to ØMQ (see figure 56). This is the simplest and fastest approach.


    The subscriber talks to the publisher over TCP or PGM. The subscriber talks to
    its workers, which are all in the same process, or proc://.


    Now to break that ceiling. The subscriber thread hits 100% of CPU and because
    it is one thread, it cannot use more than one core. A single thread will always
    have a ceiling, it at 2M, or more messages per second. We want to split the work
    across multiple threads that can run in parallel.


    The approach used by many high-performance products, which works here, is sharding;
    splitting the work into parallel and independent streams, such as half of the
    topic keys in one stream, and half in another. We could use many streams, but
    performance won''t scale unless we have free cores. So let''s see how to shard
    into two streams (see figure 57).


    ![](img/4bfb6119de42e06bff7b1880c181ba6e_247_0.png)


    With two threads, working at full speed, we would configure ØMQ as follows:


    +   * Two I/O threads, rather than one.

    * Two network interfaces (NIC), one per subscriber.

    * Each I/O thread bound to a specific NIC.'
