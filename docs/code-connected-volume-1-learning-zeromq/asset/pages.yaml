    +   - How do we handle messages that we can''t deliver immediately? Particularly,
    if we''re waiting for a component to come back online? Do we discard messages,
    put them into a database, or into a memory queue?


    +   - Where do we store queues? What happens if the component reading from a queue
    is very slow and causes us queues to build up? What''s our strategy?


    +   - How do we handle lost messages? Do wait for fresh data, request a resend,
    or do we build some kind of reliability layer that ensures messages cannot be
    lost? What if that layer crashes?


    +   - What if we need to use a different network transport. Say, instead of TCP
    unicast? Or IPv6? Do we need to rewrite the applications, or is the transport
    abstracted in some layer?


    +   - How do we route messages? Can we send the same message to multiple peers?
    Can we send replies to an original requestor?


    +   - How do we write an API for another language? Do we re-implement a wire-level
    protocol or do we repack a library? If the former, how can we guarantee efficient
    and stable stacks? If the latter, how can we guarantee interoperability?


    +   - How do we represent data so that it can be read between different architectures?
    Do we enforce a particular encoding for data types? How far is this job of the
    messaging system rather than a higher layer?


    +   - How do we handle network errors? Do we wait and retry, ignore them silently,
    or abort?


    Take a typical source project like Hadoop Zookeeper and read the C API code in
    /src/src/zookeeper.c. When I read this, in January 2013, it was 4,200 lines of
    mystery and there is an undocumented, client/server network communication protocol.
    I see it''s efficient because it uses epoll instead of select. Really, Zookeeper
    should be using a generic messaging layer and an explicitly documented wire level
    protocol. It is incredibly wasteful to be building this particular wheel over
    and.


    But how to make a reusable messaging layer? Why, when so many projects need this
    technology, are people still doing the hard way by driving TCP sockets in their
    code, and solving the problems in that long list over and over (see figure 7)?


