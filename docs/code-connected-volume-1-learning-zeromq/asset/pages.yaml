  md: '# # Chapter 1. Basics


    # ## Fixing the World


    How to explain? Some of us start by saying all the wonderful things it does. It''s
    sockets on steroids. It''s like mailboxes with routing. It''s fast! Others try
    to share their moment of enlightenment, taught. We zap-pow-kaboom satori paradigm-shift
    moment when it all becomes obvious. Things just become simpler. Complexity goes
    away. It opens the mind.* Others try to explain by comparison. It''s smaller,
    simpler, but still looks familiar. Personally, I like to remember why we made
    ÖMQ at all, because that''s most likely where we, the reader, are still today.


    Programming is science dressed as art because most of us don''t understand the
    physics of software and it''s rarely, if ever, taught. The physics of software
    is not algorithms, data structures, languages and abstractions. We use, throw
    away. The real physics of software is the physics of people—specifically, our
    limitations when it comes to complexity, and our desire to work together to solve
    problems in pieces. This is the science of programming: making building blocks
    that people can understand and *easily*, and people will work together to solve
    the very largest problems.


    We live in a connected world, and modern software has to navigate this world.
    So the building blocks of tomorrow''s very large systems are connected and massively
    parallel. It''s not enough for code to be “strong and silent” any more. Code has
    to talk chat, well-connected. Code has to run like the human brain, trillions
    of individual neurons firing messages to each other, a massively parallel network
    with no central control, no single point of failure, yet able to solve difficult
    problems. And it''s no accident that the future of code looks like the human brain,
    because the endpoints of every network are, at some level, human brains.


    If you''ve done any with threads, protocols, or networks, you''ll realize this
    is pretty impossible. It''s a dream. Even connecting a few programs across a few
    sockets is plain nasty when you start to handle real life situations. Trillions!
    The cost would be unimaginable. Connecting computers is so difficult that software
    and services to do this is a multi-billion dollar business.


    So we live in a world where the wiring is years ahead of our ability to use it.
    We had a software crisis in the 1980s, when leading engineers like Fred Brooks
    believed there was no “Silver Bullet” to “promise even one order of magnitude
    of improvement in productivity, reliability, or simplicity”.'
