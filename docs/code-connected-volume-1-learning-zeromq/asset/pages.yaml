    Ideally, we want to match the number of fully-loaded threads in our architecture
    with the number of cores. When threads start to fight for cores and CPU cycles,
    the cost of adding more threads outweighs the benefits. There would be no benefit,
    for example, in creating more I/O threads.


    # Reliable Pub-Sub (Clone Pattern)


    As a larger worked example, we''ll take the problem of making a reliable pub-sub
    architecture. We will develop this in stages. The goal is to allow a set of applications
    to share some common state. Here are our technical challenges:


    +   * We have a large set of client applications, thousands or tens of thousands.

    * They will join and leave the network arbitrarily.

    * These applications share a single eventually-consistent state.

    * Any application can update the state at any point in time.


    Let''s say that updates are reasonably low-volume. We don''t have real time goals.
    The whole state can fit into memory. Some plausible use cases are:


    +   * A configuration that is shared by a group of cloud servers.

    * Some state shared by a group of players.

    * Exchange rate data that is updated in real time and available to applications.


    # Centralized Versus Decentralized


    A first decision we have to make is whether we work with a central server or not.
    It makes a big difference in the resulting design. The trade-offs are these:


    +   * Conceptually, a central server is simpler to understand because networks
    are not naturally symmetrical. With a central server, we avoid all questions of
    discovery, bind vertex connect, and so on.

    * Generally, a fully-distributed architecture is technically more challenging
    but ends up with simpler protocols. That is, each node must act as server and
    client in the right way, which is delicate. When done right, the results are simpler
    than using a central server. We saw this in the Freel pattern in “Reliable Request-Reply
    Patterns”.

    * A central server will become a bottleneck in high-volume use cases. If handling
    scale in the order of millions of messages a second is required, we should aim
    for decentralization right away.'
