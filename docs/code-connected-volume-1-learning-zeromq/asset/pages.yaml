    \ 2 | Address | Address of publisher |\n| Frame 3 | Data | Actual message body\
    \ |\n\n> Figure 24. Pub-Sub Envelope with Sender Address\n\n# # High-Water Marks\n\
    \nWhen you send messages rapidly from process to process, you soon discover that\
    \ memory is a precious resource, and one that can be trivially filled up. A few\
    \ seconds of delay in a process can turn into a backlog that blows up a server\
    \ unless you understand the problem and take precautions.\n\nThe problem is this:\
    \ imagine you have process A sending messages at high frequency to process B,\
    \ which is processing them. Suddenly B gets very busy (garbage collection, CPU\
    \ overload, whatever), and can't process the messages for a short period. It could\
    \ be a few seconds for some heavy garbage collection, or it could be much longer,\
    \ if there's a more serious problem. What happens to the messages that process\
    \ A is still trying to send frantically? Some will sit in B's network buffers.\
    \ Some will sit on the Ethernet itself. And the rest will accumulate in A's memory,\
    \ as rapidly as the application before A sends them. If you don't take some precaution,\
    \ A can easily run out of memory and crash.\n\nIt is a consistent, classic problem\
    \ with message brokers. What makes it hurt more than it's B's fault, superefficially,\
    \ and B is typically a user-written application which A has no control over."
