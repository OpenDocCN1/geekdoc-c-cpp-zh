    \ (e.g., sending two messages in\nrow) will result in a return code of -1 from\
    \ the send or recv\ncall. Similarly, the services use zmq_recv() and then zmq_send()\n\
    in that order, as often as it needs to.\n\nuses C as its reference language and\
