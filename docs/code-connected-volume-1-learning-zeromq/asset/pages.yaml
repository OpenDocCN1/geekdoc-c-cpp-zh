  md: '+   * REP to REP

    * REP to ROUTER


    Here are some tips for remembering the semantics. DEALER is like an asynchronous
    REQ socket, and ROUTER is like a REP socket. Where we use a REQ socket, we can
    use a DEALER; we just have to read and write the envelope ourselves. Where we
    use a REP socket, we can stick a ROUTER; we just need to manage the identities
    ourselves.


    Think of REQ and DEALER sockets as “clients” and REP and ROUTER sockets as “servers”.
    Mostly, you''ll want to bind REP and ROUTER sockets, and connect REQ and DEALER
    sockets to them. It''s not always going to be this simple, but it is a clean and
    memorable place to start.


    # The REQ to REP Combination


    We''ve already covered a REQ client talking to a REP server but let''s take one
    aspect: the REQ client must initiate the message flow. A REP server cannot talk
    to a REQ client that hasn''t sent it a request. Technically, it’s not even possible,
    and the API returns an EFSM error if you try it.


    # The DEALER to REP Combination


    Now, let''s replace the REQ client with a DEALER. This gives us an asynchronous
    client that can talk to multiple REP servers. If we rewrote the “Hello World”
    client using DEALER, we''d be able to send off any number of “Hello” requests
    without waiting for replies.


    When we use a DEALER to talk to a REP socket, we must accurately emulate the envelope
    that the REQ socket would have sent, otherwise the REP socket will discard the
    message as invalid. So, to send a message, we:


    +   * Send an entry message frame with the MORE flag set; then

    * Send the message body.


    And when we receive a message, we:


    +   * Receive the first frame and if it’s not empty, discard the whole message;

    * Receive the next frame and pass that to the application.


    # The REQ to ROUTER Combination


    In the way that we can replace REQ with DEALER, we can replace REP with ROUTER.
    This gives us an asynchronous server that can talk to multiple REQ clients at
    the same time. If we rewrote the “Hello World” server using ROUTER, we''d be able
    to process any number of “Hello” requests in parallel. We saw this in the “Sockets
    and Patterns” mtserver example.


    We can use ROUTER in two ways:


    +   * As a proxy that switches messages between frontend and backend sockets.'
