  md: 'Code Connected Volume 1 - Chapter 5. Advanced Pub-Sub Patterns


    If the value is empty, the server MUST delete its key-value entry with the specified
    key.


    The server SHOULD accept the following properties:


    +   - ttl: specifies a time-to-live in seconds. If the KVSET command has a ttl
    property, the server SHOULD delete the key-pair and broadcast a KVPUB with an
    empty value in order to delete this from all clients when the TTL has expired.


    # Reliability


    CHP may be used in a dual-server configuration where a backup server takes over
    if the primary server fails. CHP does not specify the mechanisms used for this
    failover or the Binary Star pattern may be helpful.


    To assist server client MAY:


    +   - Set a UUID in every KVSET command.

    - Detect the lack of HUGZ over a time period and use this as an indicator that
    the current server has failed.

    - Connect to a backup server and re-request a state synchronization.


    # Scalability and Performance


    CHP is designed to be scalable to large numbers (thousands) of clients, limited
    only by system resources on the broker. Because all updates pass through a single
    server, the overall throughput will be limited to some millions of updates per
    second at peak, and probably less.


    # Security


    CHP does not implement any authentication, access control, or encryption mechanisms
    and should not be used in any deployment where these are required.


    # Building a Multithreaded Stack and API


    The client stack we''ve used so far is smart enough to handle this protocol properly.
    As soon as we start heartbeats, we need a client stack that can run in a background
    thread. In the Freelance pattern at the end of “Reliable Request-Reply Patterns”
    we used a multithreaded API but didn’t explain it in detail. It turns out that
    multithreaded APIs are quite useful when you start to make more complex ØMQ protocols
    like CHP.'
