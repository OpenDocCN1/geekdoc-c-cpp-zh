    # 7.3 Exclusion Region Hierarchies


    An exclusion region clustering algorithm generates a partition at an exclusion
    threshold. Successive thresholds can be used to build a general rooted tree, but
    more typically a forest of trees whose roots start at a specific starting threshold
    [140]. The representatives or centrotypes form the successive nodes of the tree
    in an agglomerative fashion. This form of hierarchy can produce overlapping clusters,
    thus creating a general pyramidal clustering hierarchy [2, 7, 8].


    The simple exclusion region Algorithm 3.5 in Chapter 3 can be modified to iterate
    over a sequence of successive thresholds, where the thresholds are increasingly
    larger—growing towards the root of the tree and allowing merging at each level.
    This algorithm requires considerable subroutine support, the details of which
    are glossed over. Figure 7.2 is a general tree example of an exclusion region
    generated hierarchy. The trees may be rooted or a forest of trees. The leaves
    represent a partition of the data at the last tier. The algorithm takes a sparse
    matrix at the stopping threshold and successively clusters at larger and larger
    dissimilarity thresholds until a threshold less than or up to the threshold at
    which the sparse matrix was created is reached.


    ```

    Algorithm 7.4 ExclusionRegion(SparseMatrix, StartThreshold,

    StopThreshold, Increment)

    1: Step ← Increment

    2: Threshold ← StartThreshold

    3: Stop ← StopThreshold

    4: repeat

    5:   repeat

    ```'
