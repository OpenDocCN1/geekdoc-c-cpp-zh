    # 2.6.3.2 Manhattan Distance


    The Manhattan Distance, sometimes called the city block, or taxicab metric, defines
    the shortest distance given a grid, hence the name. More formally, it is defined
    by


    $$

    d = \sum_{i=1}^{N} |x_i - y_i|.

    \tag{2.32}

    $$


    This measure is sometimes used for faster computation on large data sets or for
    special feature variables.


    # 2.6.3.3 $L_\infty$ or Supremum Norm


    $L_\infty$ or Supremum Norm is a curious metric in that it simply defines the
    distance as the maximum difference between the respective features of the vectors
    $x$ and $y$; it is defined by


    $$

    d = \max \left(|x_i - y_i|\right),

    \tag{2.33}

    $$


    for $i = 1, 2, \ldots, N$, where $N$ is the dimension of the vectors. Metrics
    like the Manhattan and the Supremum Norm are fast to calculate, so if the data
    and application warrants, these metrics can at times be useful, when calculating
    more complicated metrics or measures is out of the question due to very large
    data sizes.


    # 2.6.3.4 Cosine


    The cosine similarity is a common measure that can be defined by its usual vector
    dot product form,


    $$

    s = \frac{\mathbf{x} \cdot \mathbf{y}}{\|\mathbf{x}\| \, \|\mathbf{y}\|}

    \tag{2.34}

    $$


    It defines the cosine of the angle between the two vectors $\mathbf{x}$ and $\mathbf{y}$.
    This measure can be very useful in a number of different settings, as can, by
    extension, simply the dot product.'
