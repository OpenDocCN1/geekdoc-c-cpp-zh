    # Large Scale and Parallel Algorithms


    Large scale data sets are becoming more common in drug discovery and bioinformatics.
    Gene expression, genomics, metabolic pathways, chemical libraries, and molecular
    conformation data sets are all examples of data types that may require large scale
    clustering applications [50, 93]. Access to data through the creation and automation
    of experimental technologies has resulted in larger microarrays and High Throughput
    Screening assays which create simply more data to evaluate either as a pre-condition
    or post-process. Also, virtual combinatorial libraries of compounds and the conformational
    expansion of large libraries of compounds can be in the hundreds of millions even
    billions. Effectively grouping these data sets is a significant problem. Of course
    the question can be asked: is there a good scientific reason to cluster a given
    data set? Typically cost benefit and efficiency play a role in the decision to
    use computational tools to add scientific reasoning to the decision making process
    for large scale datasets. For example, compound acquisitions costs both in real
    dollars and in time create a sufficient reason to cluster large data sets and
    incorporate more knowledge into the decision making process. Compound diversity
    is another area where the application of clustering techniques has played a role,
    and though there are often non-clustering methods that can be used to identify
    diversity within a large set, there are often valid reasons to create diverse
    sets with clustering. As cluster membership can help in QSAR studies with diverse
    sets of compounds. It can certainly be suggested when gene expression screening
    data sets substantially larger, there will continue to be good reasons for clustering
    such data for exploratory data analysis and predictive modeling. The clustering
    of very large sets of molecular conformations is more speculative at this point,
    but they may help researchers organize shape data for searching and fast lookup.


    Exclusion region algorithms are parallelizable with some inter-processor communication
    cost, as is *K*-means. The caveat is that exclusion region algorithms need to
    have all-pairs similarities calculated as a pre-process, even if only a sparse
    matrix is eventually stored. Fortunately, this is embarrassingly parallel, and
    can be done on large clusters of processors and cores effectively. However, internal
    memory for storing even the resulting sparse matrix and spreading that across
    processor memory in a load balanced form is a non-trivial problem. If shared memory
    is available across all processors and cores, the memory may have to be very large
    accordingly. *K*-means and leader algorithms do not have nearly the same memory
    constraints, as the data are effectively'
