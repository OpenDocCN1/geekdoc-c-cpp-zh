    are possibly faced with arbitrary choices. The number of arbitrary choices made
    while clustering a data set is combinatorially related to the overall ambiguity
    of the clustering results. This fact relates to the data input order stability
    of the algorithm: namely, that in a stable algorithm the output results should
    be invariant to the input order of the data. For example, Ward''s clustering is
    stable with respect to continuous measures and distinct data. It is not stable
