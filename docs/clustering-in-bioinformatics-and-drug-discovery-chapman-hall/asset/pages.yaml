    # 2.6.3 Continuous Data Measures


    The most natural continuous data measure is the Euclidean distance, or the \(L_2\)
    norm. The terminology of \(L_2\) norm comes from the general class of metrics
    known as the Minkowski metric, defined as:


    \[L_n(x,y)=\sqrt[n]{\sum_{i=1}^{N}\left(\lvert x_i-y_i\rvert\right)^n}.\tag{2.28}\]


    where \(N\) is the dimension, and \(n \ge 1\). Aside from any issues of precision,
    problems arising from discrete types are not an issue. Other norms can be used
    such as \(L_1\) (the City Block or Manhattan distance) and \(L_{\infty}\), though
    most common uses of the Minkowski metric are of the Euclidean form. There may
    however be special cases where specific data applications might warrant the use
    of other Minkowski metrics. Modifications of the Euclidean distance concern how
    variables are possibly weighted or normalized. Weighting for issues concerning
    noise and variable correlation also drive the use of other methods for determining
    a measure among continuous values, such as the use of the Mahalanobis measure,
    the use of principal components analysis, or the use of the Pearson correlation
    coefficient to derive a useful dissimilarity measure between data elements for
    clustering. These three methods and especially latter two are more in line with
    transformations of the data.


    # 2.6.3.1 Continuous and Weighted Forms of Euclidean Distance


    \[d=\sqrt{\sum_{i=1}^{N}(x_i-y_i)^2}.\tag{2.29}\]


    where \(x\), and \(y\) are now continuous valued vectors, and \(i\) refers to
    the \(i\)th element in the respective vector. The Euclidean distance can be weighted
    if there is expert knowledge concerning the relative contribution of each variable,
    as expressed by a vector of weights \(a\).


    \[d=\sqrt{\sum_{i=1}^{N}a_i(x_i-y_i)^2}.\tag{2.30}\]'
