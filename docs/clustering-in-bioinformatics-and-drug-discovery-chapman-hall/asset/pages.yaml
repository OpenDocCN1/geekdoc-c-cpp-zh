  md: '# ## 7.4 Biclustering


    Biclustering, sometimes called subspace clustering, co-clustering, or block selection,
    can be thought of as trying to perform feature selection in both dimensions: what
    features are important, and what data items are important. Approaches to the problem
    were first offered by Hartigan [64]. Nearly three decades later, approaches to
    the problem were first applied to gene expression data [27]. To find an optimal,
    global solution to this problem requires $2^{N+P}$ combinations of data items
    and features. Such a problem is NP-hard and clearly requires heuristics. As portrayed
    in Figure 1.7 the goal is to design an optimizing criterion that permutes both
    dimensions (e.g., genes and experiments) such that they align into subset blocks.


    A naive approach is to simply cluster both dimensions as can be seen in Figure
    3.7 or 3.8. It is evident in these examples that there are apparent blocks of
    possible interest. However, the specific permutations of the data by formation
    of the dendrogram in either dimension is not unique. There may be better more
    salient block features than revealed by these permutations. The application may
    also dictate how to optimize a block. There are four basic types of optimization
    goals:


    +   1. Constant values along the rows

    +   2. Constant values along the columns

    +   3. Constant values over the entire block

    +   4. A coherence of values over a block


    Using Figure 1.7, the naive method of hierarchical clustering of both dimensions
    reveals blocks with near constant values for both rows and columns. (The original
    matrix in that example was of course symmetric, so there is a greater chance that
    there will be constant value blocks.) There are now a great many algorithms designed
    with these various goals in mind, each with features and shortcomings. For a survey
    on methods commonly used with gene expression data see [77]. A broader, more recent
    survey can be found in [87].


    # ## 7.5 Glossary


    **hybrid algorithm:** an algorithm that is a combination of algorithms that could
    be applied independently


    **pyramidal clustering:** overlapping hierarchical clustering'
  merge: -1
  img_proc: true
