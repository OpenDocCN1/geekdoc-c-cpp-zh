    A cut at a level of 0.7 partitions the data into five clusters and an arbitrary
    cut represented by the dotted line partitions the data into ten clusters. The
    arbitrary cut is just an example of the fact that one can make any cut to create
    a partition that represents a clustering; however, the straight'
