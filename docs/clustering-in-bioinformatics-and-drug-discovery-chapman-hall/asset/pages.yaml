  md: 'primes?) that have profoundly deep mathematical solutions, or remain open -
    leading to a great deal of additional mathematics and more questions, simple and
    otherwise.


    A prominent feature among many of these facts, theorems, and questions (stated
    in the positive, conjectures, e.g., there are infinitely many twin primes) are
    the prime numbers and their distribution among the natural numbers. A few theorems
    and definitions include:


    +   - **Theorem**: There are infinitely many prime numbers.

    +   - **Theorem**: Any natural number can be factored into a unique set of prime
    numbers.

    +   - **Theorem**: The distribution of primes in the natural numbers is bounded.

    +   - **Definition**: If the prime factorization of any two distinct natural numbers
    contain no prime number in common, those two natural numbers are considered *relatively
    prime* or *coprime*. Namely, there is no common divisor between the two numbers,
    so they are relatively prime to one another.

    +   - **Definition**: The numerator and denominator of a fully reduced common
    fraction (fractions between 0 and 1) are coprime to one another. The sequence
    of such pairs is known as the Farey sequence.


    The above definitions and theorems concern the frequency and enumeration of primes
    and relatively primes. Primes appear to occur in a strange and apparently random
    frequency with increasing number of natural numbers up to some large N. Mathematicians
    began to ask what was the nature of this frequency and could it be quantified
    or bounded in some way. The first real exploration of the frequency of primes
    is due to Gauss. He realized that there was a rough relationship in terms of the
    natural logarithm, called the integral logarithm, li(x):


    $$li(x) = ∫₀ˣ dt / ln t    (12.19)$$


    where x is a positive real number and x ≠ 1. He showed that the number of primes
    less than or equal to large N is roughly N / ln N. It follows also that the probability
    of any positive integer between 1 and N being prime is roughly to 1 / ln N. This
    is known as the *prime number theorem* and it is an instance of analytical number
    theory.


    A simple notion that one learns in grammar school is how to reduce a proper fraction
    (rational numbers between 0 and 1) to a form where they can be reduced no further.
    As stated above such pairs of numbers are relatively prime. A French mathematician
    in the 19th century described a method for generating all proper fractions p/q,
    where p < q, q ≤ n, and p and q are coprime'
