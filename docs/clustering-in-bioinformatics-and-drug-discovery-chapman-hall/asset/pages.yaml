    # 9.4  Measure Probability and Distributions


    The distribution of the measure operating on a discrete data type can impact clustering
    results. In Chapter 2 the distributions of measures operating on all possible
    pairs of binary strings of length 5 and length 6 were shown (Figure 2.5 and Figure
    2.6). These distributions over the entire binary string space are somewhat misleading,
    in that for a given application data set, the number of binary strings is a tiny
    fraction of the possible number of strings, and as a sample distribution may be
    quite different from the entire set. In past literature, researchers used histograms
    or density plots to visualize these distributions, often obscuring the true discrete
    and often fractal nature of the distributions [17]. Such depictions may not have
    been detrimental to the research at hand at the time, but lent to the overall
    notion that these distributions behaved much like continuous valued distributions.


    # 9.4.1  Number Theory in Measures


    Motivation and theoretical basis molecular structures are often encoded in the
    form of binary fingerprints for a number of reasons: fast database searching and
    retrieval; similarity searching, clustering, and predictive modeling. They can
    be compared with binary similarity coefficients such as the Tanimoto similarity
    computed among many others. All of the common similarity coefficients operating
    on fixed length binary fingerprints have the property that the number of possible
    coefficient values is finite. The number of possible values depends on the coefficient
    and the length of the binary string. A simple example is to generate the bit strings
    of length 5, of which there are 32, and calculate the Tanimoto coefficient among
    all pairs of these strings. There are only 10 possible values that the coefficient
    can generate among any pair of strings. In order of their respective magnitude,
    these are: 1, 0.5, 1/4, 1/3, 2/5, 1/2, 3/5, 2/3, 3/4, and 1. This finite sequence
