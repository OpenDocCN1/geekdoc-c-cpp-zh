- pgno: 67
  md: '# ## 2.4 Formats


    Data are the precursor to clustering. Much preprocessing and focus can be placed
    on the data that is to be clustered, given the many available formats. Data extracted
    from databases is typically in or can be easily converted to a standard usable
    format. Whether proprietary or public, databases in Bioinformatics and Drug Discovery
    in general can be an analyst’s friend or foe for this reason. Flat files of data
    are still commonplace in the industry.


    There are many publicly available gene and protein sequence databases. *GenBank,
    GenPept, European Molecular Biology Laboratory (EMBL), Protein Sequence Database
    (PIR-PSD), RCSB Protein Data Bank (PDB), NCBI Gene Expression Omnibus (GEO)* represent
    some of the major repositories [38, 47, 113, 112, 4]. BioCyc contains databases
    of metabolic pathways/genomes [81]. The larger collections of chemical structure
    databases are available through chemical vendors directly, their webservice providers
    (e.g., *eMolecules*) [39] or academic (*ZINC*) [74], journals, or government institutions,
    (e.g., *PubChem*) [48]. Assay data for small molecule ligand binding has recently
    been more available to the public (*PubChem*) [48]. Such data has been determined
    to be proprietary by pharmaceutical and biotechnology companies, so there is a
    lot of data of this type inside companies that have drug discovery markets. The
    list of chemical formats is quite vast. A few common formats are InChI, SMILES,
    SDF, Mol2, etc. [91]. Typically each drug design software vendor has its own proprietary
    format, but will input and export to many of the more commonly used formats to
    facilitate interoperability. Databases and formats change and may go in and out
    of vogue, but many now are quite stable and have had continued use for many years—namely,
    they have stood the test of time.


    # ## 2.5 Data Matrices


    Formats and databases aside, in the abstract, the data will be in the form of
    a matrix, where the rows represent the data items, and the columns represent the
    dimension of the data. There will be *N* rows and *p* dimensions. Informally,
    the extremes of data matrices for clustering will fall under the following headings:
    *long and tall data* are where *N* >> *p*, and *N* is large; *short and fat data*
    are where *N* < *p*, and *N* is small. How to treat these extremes in terms of
    cluster analysis typically relates to the computational complexity of *N* in the
    former case and *p* in the latter case. For example, there is a strong chance
    that *short and fat* is over determined in the sense that many of the variables
    may be highly correlated. Dimension reduction of *p* is likely called'
