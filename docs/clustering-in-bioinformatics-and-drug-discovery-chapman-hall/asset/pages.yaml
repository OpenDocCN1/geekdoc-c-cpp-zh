    # 4.3 Spectral Clustering


    Spectral clustering was introduced in the late 1990s in conjunction with image
    processing. For example, clustering of pixels is an important part of image segmentation,
    where pixels may be vectors of RGB colors or the seven spectral bands common in
    satellite imagery. Such problems can be relatively large, though the dimension
    is typically small, in the hundreds of thousands or millions of pixels, so spectral
    clustering is typically done on small images or subsets of larger images. Luckily,
    computing eigenvalues and eigenvectors of fairly large matrices is possible, making
    spectral clustering of modestly large data sets in the thousands of data items
    in higher dimensions more reasonable. Therefore, spectral clustering has begun
    to be used in cheminformatics applications, with several groups now exploring
    its efficacy with respect to various data types within the early drug discovery
    process [18, 58].'
