    Sequence analysis data are often clustered to find relationships or classes among
    protein sequences. Many of these results are then in turn used to create phylogenetic
    trees. Phylogenetic tree construction can however include other features and data
    types, but there is a common overarching connection, and that is understanding
    the relationships of ancestry.


    Early papers on the use of cluster analysis in drug design largely concerned the
    structure activity relationships among small drug-like molecules [20], or determining
    a diverse set of small drug-like molecules [102, 120]. Hundreds of papers have
