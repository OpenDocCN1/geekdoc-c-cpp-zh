  md: '# ## 8.2 Algorithms


    # ### 8.2.1 Strongly Connected Components Agglomerative Hierarchical Algorithm


    Strongly connected components (SCC) is a directed graph algorithm that finds components
    in a graph if they admit to being cycles. More formally, a strongly connected
    component in the graph is a vertex set, where there is a directed path from vertex
    u to vertex v for all u and v in the vertex set. If the graph is weighted, the
    SCC algorithm can be used recursively to first find the smallest strongly connected
    components with the sum of the least weighted edges, and successively merging
    components with the sum of the least weights until there is just one strongly
    connected component representing all of the vertices in the graph. This process
    builds an agglomerative hierarchy from single data items through components of
    ever increasing size. Much like complete link and single link can be considered
    in terms of graph models (finding maximal cliques, and finding minimum spanning
    tree subgraphs respectively). The SCC agglomerative hierarchical algorithm is
    a directed graph approach that lies somewhere in between furthest neighbor behavior
    of complete link clustering and the chaining behavior of single link approach.
    Its closest analogue to undirected graphs is bi-connected components (there are
    at least two paths between u and v in the vertex set in an undirected graph).
    (Note, there are other forms of connectivity: tri-connected, k-connected, that
    have also been used in clustering [67, 119].)


    An efficient algorithm for the use of SCC to create an agglomerative hierarchy
    is due to Tarjan [131]. To see how the method works however we show it here in
    the form of a simple agglomerative hierarchical algorithm, where the merge criterion
    is based on merging strongly connected components with the least edge weights.


    **Algorithm 8.1 SCC AgglomerativeHierarchy(Data)**


    ```

    ```

    1: N ← Size(Data)

    2: G ← Groups(Data) //One data element per group in G

    3: repeat

    4:   G ← MergeWeightedSCC(G) //Merge closest group based on SCC edge weights

    5:   Output: Merged Group Pair and Merge Criterion Value //Value is the weight
    of the last edge added to create the SCC

    6: until |G| == 1

    ```

    ```


