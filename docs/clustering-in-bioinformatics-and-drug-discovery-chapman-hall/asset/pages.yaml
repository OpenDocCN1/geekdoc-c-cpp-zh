    based molecular graphs (essentially, hashing induced subgraphs, where there are
    unique paths of a length no greater than a specific threshold path length), keys
    generated from structure dictionaries or pre-defined keys based on relevance to
    drug discovery [91]. Originally designed for database searching, more commonly
    referred to as similarity searching, and the fingerprints were subsequently used
    to cluster compounds [20, 149]. Bits in common among a set of fingerprints form
    a mode or modal fingerprint [121]. A modal fingerprint can be used to determine
    a common substructure among all of the structures represented by the fingerprint
    set. The modal can be parameterized such that not all bits need be in common,
    but some typically high percentage of the bits need to be in common. The modal
    fingerprint can then be used to search through a different database of fingerprints
    as a substructure searching procedure, or a way of visualizing the common substructure
    in a set of compounds.


    Similarity searching and clustering applications compound selection are motivated
    by what is known as the similar property principle [79]: namely, similar drug
    or drug-like compounds have similar biological activity. Whereas there is considerable
    evidence that this is true, it is confounded by factors such as molecular shape,
    conformational energy, and electrostatics. These can be included in a broader
    definition of structure, but it is difficult to encapsulate or encode all of these
    factors into a single, efficient, data type. So much effort has been expended
    in designing structural, 2D, binary fingerprints and binary measures of similarity,
    trying to find the best mix that correlates structure to biological activity.
    These in turn have additional biases, where the size of the molecules play a role,
    leading researchers to navigate the choice of fingerprint and measure best suited
    to their data [35, 46, 72, 147].


    Many various forms of binary fingerprints have since been designed, and of various
    fixed lengths, though the lengths are often in multiples of 32 or 64 bit words,
    making them more efficient for both storage and calculating similarity. Fingerprint
    methods can be either general or data set specific. Early fingerprinting methods
    developed by software vendors, MDL, Daylight, and BCI are still in use today [73,
    25, 129]. More recent additions continue to be developed, especially those of
    a data specific natures. Other common molecular formats are the Protein Data Bank
    (PDB) file, the MOL2 file, and the Structure-Data File (SDF). The fingerprints
    are often independent of the graph encoding such that they can be derived from
    any number of these graph encodings, not just SMILES strings.


    The SMARTS subgraphs can be very specific (e.g., a benzene ring), or very general
    as in the example in Figure 2.2. Similarity measures for fixed length bit strings
    are very fast to compute. Though there is a loss of information, searching the
    database by these binary string encodings is a great deal faster, and the storage
    of those strings is also less in general, as they can be stored as bit per bit.
    There are many efficient similarity measures that can be used'
