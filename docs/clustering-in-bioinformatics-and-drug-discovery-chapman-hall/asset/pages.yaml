- pgno: 135
  md: 'somewhat uniformly about the feature space that contains the data. In this
    way, via the iterative process, the adjusted centroids will more likely find regions
    of density, such that those regions are well defined and separate from one another.
    Compare this notion to the leader algorithm, where the initialization of the algorithm
    starts with a single random choice of a data item and an exclusion threshold to
    be used to generate clusters. If the data has a tendency to cluster, then there
    are dense regions in the feature space, and the initial random point will more
    likely be in one of these dense regions. But, nevertheless, there is a small but
    likely significant probability that it will not be. It may be an outlier for example.
    This is especially true of high dimensional spaces, where it is often the case
    that some data items will lie at the periphery of the feature space. Though again
    small, there is also a significant probability that the randomly selected data
    item will lie between clusters and may draw into the first cluster that would
    otherwise be some members of several other clusters. Once the first cluster is
    defined and excluded, the question arises how to best continue the random selection
    of the remaining points to obviate some of the problems of the choice of the first
    random selection.


    Like K-means, one would like to be assured that each new random sample from the
    remaining, yet unclustered data, is spread again somewhat uniformly throughout
    the feature space. Variations on the leader algorithm concern just that: strategies
    for choosing the next random sample point in the remaining unclustered data. A
    simple first pass at this is to use information from what has been calculated
    so far. At each iteration a 1 × (Nᵢ − Cᵢ) set of dissimilarities has just been
    calculated, where Cᵢ is the set of clusters up to the iᵗʰ iteration, and |Cᵢ|
    is the number of data items so far clustered. Those dissimilarities that lie outside
    the range of the threshold are all of the remaining data items that have not been
    clustered, and from which the next random data item will be chosen. Which one?
    One method is to choose the furthest from the most recent random data item, requiring
    a small computational hit for finding the maximum in the list. This process may
    have a tendency to pick outliers about the edge of the features space. Another
    method is to select arbitrarily any data item outside the exclusion region, with
    only a small probability that the data item will be near an exclusion region,
    at least at the beginning of the algorithm when there are just a few clusters.
    Another method is to choose, if possible, a point that lies 2 times the radius
    of any previous exclusion region. This latter method is most akin to the K-means
    uniform random sampling, as it successively chooses points that are spread throughout
    the data, and it has the flavor of a quasi-random sampling, a method known as
    Poisson disk sampling for Monte Carlo integration, still an active area of research
    in computer graphics [29, 123, 51]. This method however requires storing and processing
    all previous dissimilarities, so it is both slower and uses significantly more
    memory, but it may be more effective as it will sample the feature space density
    of the data with a Monte Carlo integration-like process. The type of space is
    defined by the metric or measure and therefore its exclusion region can be quite
    different than our usual notion of Euclidean space and distance. This is especially
    noticeable'
