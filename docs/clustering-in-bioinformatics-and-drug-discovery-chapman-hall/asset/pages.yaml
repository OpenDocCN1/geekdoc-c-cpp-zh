    +   - 1-3H3,RYYVLZVUIVJGVH-UHFFFAOYSA-N


    ![](img/0faee1c17bea0aab06ee9523a28c4eaf_60_0.png)


    FIGURE 2.1: A 2-dimensional depiction of the caffeine molecule


    Whether utilizing InChI strings or canonical SMILES for exact structure lookup
    in chemical database systems, searching for substructure matches or similar compounds
    within a database using a string similarity measure (e.g., edit distance or n-gram
    analysis [57]) is somewhat inefficient. Thus, for database storage and retrieval
