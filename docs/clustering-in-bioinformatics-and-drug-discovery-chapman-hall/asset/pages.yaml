  md: '# About the Authors


    John D. MacCuish received his MS in computer science from Indiana University in
    1993, where his research interests were graph theory, algorithm animation, and
    scientific visualization. After graduating from Indiana University, he worked
    for 3 years as a graduate research assistant at Los Alamos National Laboratory,
    while pursuing a Ph.D. in computer science at the University of New Mexico. At
    Los Alamos, he worked on numerous projects, such as fraud detection, a software
    workbench for combinatorics, and parallel implementations of cluster algorithms
    for image processing. In 1996, John left the laboratory and the Ph.D. program
    at UNM to join the software and consulting fields as a scientist working on data
    mining projects across industries. He developed software and algorithms for data
    mining and statistical modeling applications, such as anomaly detection and automated
    reasoning systems for drug discovery. In 1999, he formed Mesa Analytics & Computing,
    Inc. John has published numerous articles and technical reports on graph theory,
    algorithm animation, scientific visualization, image processing, chemoinformatics,
    and data mining. He has also co-authored several software patents.


    Norah E. MacCuish received her Ph.D. from Cornell University in the field of theoretical
    physical chemistry in 1993. Her educational training included experimental and
    theoretical work in the areas of ultrafast laser spectroscopy, spectroscopic simulation
    of fluids, synthetic organic chemistry, and biochemistry. Norah did her post-doctoral
    work in the pharmaceutical industry in such areas as compound diversity assessment
    for compound acquisitions and structural diversity analysis of compound leads
    from high throughput screening. She continued in the pharmaceutical industry as
    a scientist working on therapeutic project teams involved in combinatorial library
    design and data integration projects. To further her career in chemoinformatics
    she joined a scientific software vendor, Daylight Chemical Information Systems,
    in 1997, as a chemical information systems specialist. After a number of years
    at Daylight, Norah helped found Mesa Analytics & Computing, Inc., where, as chief
    science officer, she acts as both a consultant in the areas of drug design and
    compound acquisition, and as a developer of the company''s commercial chemical
    information software products. Norah has numerous publications in the areas of
    fluid simulations, chemical diversity analysis, object-relational database systems,
    chemical cluster analysis, and chemical education. She has been the principal
    investigator for Mesa''s National Science Foundation SBIR grants.'
