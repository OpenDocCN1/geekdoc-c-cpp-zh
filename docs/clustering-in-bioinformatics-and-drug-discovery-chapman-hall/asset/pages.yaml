    The recursive nature of divisive algorithms makes them only less efficient at
    building an entire hierarchy in general than agglomerative algorithms. However,
    if only a portion of the hierarchy is created with some non-trivial stopping criterion,
    divisive methods can be fast. It is equally true that agglomerative methods can
    be stopped at a certain level without creating the entire hierarchy and can also
    be made equally fast if not faster. But some stopping criterion is needed for
    both methods, which if quantitative may slow the procedures such that the benefit
    is negligible. Expert knowledge about the data however may warrant the use of
    divisive over agglomerative, either in terms of efficiency or efficacy. Equally
    true is whether or not the divisive criteria are any better than merge criteria
    is an open question.


    # ### 3.3 Mixture Models


    Mixture models often presuppose that a good deal about the data are known as to
    the processes that generated the data, that the data follow some probability distributions,
    and that the number of groups are more or less known. We make only brief mention
    of these types of clustering algorithms, in the case that the practitioner should
    be confronted with such data, and because there are several important statistical
    notions that relate to clustering in general - a cluster follows some probability
    distribution. Figure 1.4 in chapter 1 would be an ideal set to cluster with a
    mixture model given that we assume the clusters have a gaussian distribution and
    we could estimate very roughly the four means and variances for the four clusters.
    One such method is known as the Expectation Maximization (EM) algorithm, in which
    we could do just that: supply the algorithm with four starting means and variances,
    and after so many iterations the algorithm would converge and approximate the
    true means and variances of the four clusters. If we supplied too few or too many
    mean variance pairs, or means and variances that were wildly off from the true
    mean and variances of the clusters, the results would likely be nonsensical.'
