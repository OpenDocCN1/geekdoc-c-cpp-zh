    modern computers eliminates the chance of ties due to precision. It can be shown,
    for example, that using the Tanimoto measure with fingerprints of size 1024 will
    not produce ties in proximity due to precision (e.g., given the 32 bit float data
    type in the C programming language). Providing for sufficient precision removes
