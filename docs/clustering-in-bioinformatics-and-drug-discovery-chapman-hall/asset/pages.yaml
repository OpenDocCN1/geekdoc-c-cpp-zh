  md: 'the resulting similarity is strongly asymmetric, and when both parameters are
    near one, the resulting similarity has very little asymmetry.


    # ### 8.1.2 Edit Distance


    Edit distance is a commonly used measure in sequence alignment [11, 94]. Given
    two sequences the edit distance is the least costly transformation, namely the
    sum of the least number of deletions, insertions or substitutions necessary to
    transform one sequence into the other. For example, the edit distance to transform
    the string *EDIT* into *TEXT* is greater than the edit distance required to transform
    the string *NEXT* into *TEXT*, since the latter requires only a letter exchange
    and the transformation for the former requires more than one step (e.g., a letter
    exchange, a deletion and an insertion). There are potentially many possible transformations,
    the edit distance is the transformation which requires the least costly number
    of steps.


    $D_{ab} = \min \sum_{j=1}^{N} c_i(j) + c_s(j) + c_d(j),$ (8.2)


    Where $D_{ab}$ is the edit distance between two sequences $a$ and $b$, $c_i(j)$
    is the cost of the insertion steps in the transformation, $c_s(j)$ is the cost
    of the exchange steps and $c_d(j)$ is the cost of the deletion steps for a given
    transformation, $j$, in the set of $N$ all possible transformations.


    ![](img/0faee1c17bea0aab06ee9523a28c4eaf_164_0.png)


