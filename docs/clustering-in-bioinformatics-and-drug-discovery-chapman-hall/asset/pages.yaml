    # ### 2.1.2 Count Data


    Count data are quite common across most disciplines, and bioinformatics and cheminformatics
    are no different. The number of rotatable bonds is a one dimensional count variable
    for compound data, but there can be many dimensional count data. Consider the
    binary representation of chemical structure: there can be more than one distinct
    subgraph key within a molecule. In the binary representation, if the subgraph
    key is extant in the molecule, the bit is turned on. However, there may be more
    than one instance of that subgraph key. Say, the subgraph key is the benzene ring
    and there are three distinct benzene rings within the compound; a count representation
    would signify the number 3 for that key, rather than just turning on that bit
    key. In the nomenclature of cheminformatics, this is known as the count fingerprint.
    Such counts are often across a small range and lead to issues of comparison similarity
    to binary data.


    Changes from type to type can alter the properties of measures used to compare
    them. The Tanimoto or Jaccard measure is a metric with binary'
