  md: '# Chapter 3


    # Clustering Forms


    There are two basic forms of clustering algorithms: partitional and hierarchical.
    In their simplest form, partitional algorithms take as input the data set with
    N members, and a number, k << N and, in all likelihood, k > 2, and return a partition
    of the data set into k disjoint subsets that represent the clusters of the data
    set. There are however a vast number of possible partitions for large N and non-trivial
    k. Even if N = 50 and k = 5, there are 50 choose 5 possible partitions: there
    are over 2 million such partitions. To get a sense of the explosive nature of
    the number of possible partitions, say, we have 60 items and think that there
    are 15 clusters: there are over 53 trillion possible distinct partitions to search
    exhaustively to find the optimal one.


    Almost surely we will not know exactly what number of clusters there should be
    and we will want to test across some range of k. We can look at the total number
    of possible partitions over all of k of a set with N members to get a wild upper
    bound on the number of partitions we may have to explore. This is given by the
    Bell number [41, 55, 115], i.e., the sum of the Sterling numbers of the second
    kind, S(N,k), over all k, where k = 0,1,...,N.


    $$B_N = \sum_{k=0}^{N} S(N,k) \qquad (3.1)$$


    The Bell number is exponential in N, so that the number of possible partitions
    of a data set grows very rapidly as a function of its size in N. When N = 10 there
    are already 115,975 possible partitions for all k. For most applications k is
    likely to be in a small range, but this still represents a exponential number
    of partitions with respect to N. It is important to recognize that, though partitional
    algorithms are not designed to search all possible S(N,k) for the optimal partition
    under some criterion, the partition space is very large and that such algorithms
    may only return a suboptimal solution for non-trivial k.


    Hierarchical algorithms construct a tree, either from the top down, splitting
    the data set into smaller and smaller groups—known as divisive clustering, or
    from the bottom up, merging single data elements into groups and then merging
    larger and larger groups—known as agglomerative clustering. In most instances
    these trees are rooted binary trees, labeled at the leaves with the N data elements
    to be clustered. As the tree represents, loosely, a topology of relationships
    between the data elements and increasingly larger groups of those elements.'
  merge: -1
