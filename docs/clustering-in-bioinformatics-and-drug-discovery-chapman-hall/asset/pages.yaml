  md: '# 1.3 Statistical Learning Theory and Exploratory Data Analysis


    Epistemology is the philosophical study of how humans obtain knowledge. Statistics
    is one such tool we use to obtain knowledge: it is a quantitative study of data,
    and, as such, we can think of it as a window into realms of the world around us
    that we might not otherwise comprehend. It is a form of learning via inference
    and obtaining knowledge thereby. The hope is that the knowledge is somehow useful
    or helpful, and that it can be acted upon reliably in the future. There are two
    outstanding ways in which statisticians think about inference. They are referred
    to as *Bayesian* and *Frequentist* approaches. Bayesian concept of probability
    relates to measuring the state or states of knowledge. This seemingly subjective
    notion is formalized by methods that treat prior knowledge of events and update
    probabilities with new knowledge of events. Frequentists on the other hand treat
    probability as the frequency of events in a system that has a definite population
    of events. This is a seemingly more objective point of view, in spite of the fact
    that a specific population may be quite vague or even largely unknown. Though
    philosophical underpinnings may differ between Bayesian or Frequentist camps concerning
    matters of statistical inference, each lead to the practical application of methods
    and algorithms designed to learn from the data.


    Statistical learning theory is a portion of statistics that can be divided into
    two basic subheadings: *unsupervised learning* and *supervised learning*. The
    former concerns learning of groups or classes quantitatively—primarily cluster
    analysis; the latter concerns using known classes (classification) or known continuous
    responses (regression) to predict future cases (predict classes or continuous
    responses). The application of quantitative predictive methods with data sets
    is often referred to as *predictive modeling*. Occasionally, cluster analysis
    is used in conjunction with predictive modeling, but otherwise, these two forms
    of learning theory are distinct and their methods for validation differ. In cases
    where clustering is used for predictive purposes, generally it is used to segment
    the data to form classes, and then predictive models for those classes are developed
    in turn. However, these models should be regarded with considerable caution as
    the classes, so called, are of a hypothetical nature, and the noise and ambiguity
    inherent in the clustering process are carried forward into the predictive modeling.
    It is not necessarily a bad idea—it may be a method of last resort, or a prescription
    for predictive modeling as a form of exploratory data analysis.


    It should be noted at the outset to help eliminate any confusion, that the word
    *classification* is overloaded and has several meanings in statistical learning
    theory. In supervised learning theory, *classification* refers to the building
    of predictive models that involve known classes. However, in unsupervised learning
    *classification* refers to the to the basic task of assigning classes; namely:'
  merge: -1
  img_proc: true
