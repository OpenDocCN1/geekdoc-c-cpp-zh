    # ## 1.5 Computational Complexity


    Calculation takes time. Fortunately, computers are now very fast, and they will
    likely get faster and faster for the foreseeable future. Likewise, the size of
    data storage, whether on disk or in the computer memory, has increased along with
    computer processor speeds. This allows the user''s ability to compute algorithms
    more quickly, and do so on larger and larger problems, and store the results more
    efficiently and effectively. Nevertheless, it is still necessary to understand
    the computational complexity of a problem and to have metrics that can rank problems,
    and at least implicitly rank the performance of implementations of algorithmic
    solutions to those problems. The overall algorithmic performance should also be
    somewhat independent of any specific instance of the respective problem.


    Some problems are not computable. Some are computable but impractical (more technically,
    these problems are called *intractable problems*) even on today''s or tomorrow''s
    machines; some are computable, but algorithms designed to compute them may or
    may not be the most efficient, or efficient within reason of the resources at
    hand. There are some problems that are intractable, but nevertheless there are
    practical solutions, either approximation algorithms or *heuristics*, that arrive
    at solutions - solutions that are hopefully near optimal but may not be. For some
    intractable problems there are approximation algorithms such that solutions resulting
    therefrom can get arbitrarily close to the optimal solution, and thus approximate
    the optimal solution. They differ from *heuristics* where there is no guarantee
    of getting near an optimal solution. With a *heuristic*, a solution can be far
    from optimal. Clustering algorithms are really a set of *heuristics* that generate
    what are hoped to be near optimal solutions; namely, finding the optimal partition
    of a set of objects in the respective feature space is an *intractable problem*,
    where *heuristics* are common and efficient approximation algorithms are more
    difficult to design.


    To understand both the time and space requirements of different algorithms in
    general and in terms of the size of the problem. We need to assume across the
    board that simple, basic arithmetic or comparison operations take roughly the
    same time, knowing of course in practice they don''t; and that unlimited space
    can be randomly accessed more or less in constant time, again, knowing that in
    practice this is also not the case. The level playing field of these assumptions
    form the basis of what is known as the random access model (*RAM*), used for understanding
    the computational complexity of algorithms. In this model, constants wash away
    and relative algorithm performance be-'
