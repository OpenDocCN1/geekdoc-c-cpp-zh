    # ## 4.2 Jarvis-Patrick


    There are two basic forms of the Jarvis-Patrick algorithm based on constraints
    imposed on nearest neighbor tables generated to form the partition. The most basic
    constraint is the overall length of the nearest neighbor table to be considered,
    K. Namely, only those nearest neighbors up to K are to be considered in assembling
    the clusters. The next constraint is K_min, where K_min ≤ K, and K_min, K_min
    ≥ 1. At least K_min near neighbors must match between the any two respective K
    length near neighbor lists to be within the same cluster. Both of these constraints
    presents problems with ties in proximity leading to cluster ambiguity that will
    be considered in chapter 9.


    Algorithm 4.4 below sketches the simple Jarvis-Patrick(K, K_min) version. K near
    neighbors must be found for all rows in FindNN(Data, K), requiring sorting of
    each row, O(N^2 log N) overall - or K calls to min(). Of course if K > log N,
    this is of no help. In worst case, naively the algorithm must search an additional
    O(KN^2) pairs. In practice, the interplay of K_min and K_max and the data make
    worst case performance unlikely. Creating and sorting the near neighbor lists
    is the bulk of the execution time. The algorithm has a near neighbor form of chaining
    akin to the minimum spanning tree. So on the one hand the algorithm is not constrained
    to hyper-spherical (exclusion region algorithms) or hyper-rectangular (recursive
    partitioning regions) regions as some algorithms produce, but it often has many
    singletons as the chaining is somewhat localized. The algorithm was often used
    for fairly large scale clustering in chemoinformatics [120]. FindNN(Data,K) is
    embarrassingly parallel, but the core portion of Jarvis-Patrick is not. Efforts
    to scale the algorithm to fit very large data sets through parallelization is
    therefore somewhat limited. However, medium sized near neighbor tables in the
    tens of thousands are quite manageable with Jarvis-Patrick. It is therefore a
    convenient algorithm'
