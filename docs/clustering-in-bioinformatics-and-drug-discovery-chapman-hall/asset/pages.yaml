    a result: First, is the ambiguity within a result nontrivial? And secondly, if
    it is nontrivial, can we still use this result within the context of the application
    at hand? These questions are somewhat subjective, but assume that if there are
    only a very few minor changes due to ambiguity in the results, then the ambiguity
    is trivial. In many instances however this is not the case for data sets of any
    significant size (e.g., 100 elements)98. Also, there may be a significant amount
    of ambiguity, but not necessarily in terms of use of clustering in the application
    at hand. A simple chemical diversity application can act as an example: here clustering
    is used to choose representatives or centrotypes from groups, and is therefore
    largely independent of the confounding nature of clustering ambiguity as it relates
    to all of the members and size of each group.


    It is clear that all of the above mentioned algorithms can produce ambiguous clustering
    results, but the larger issue is whether the level of ambiguity can be quantified,
    and is such ambiguity significant from the standpoint of drug discovery applications?


    ![](img/0faee1c17bea0aab06ee9523a28c4eaf_177_0.png)


