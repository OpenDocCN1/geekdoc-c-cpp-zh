    # ## 1.4 Clustering Algorithms


    An algorithm is a step by step process that typically takes some input and arrives
    at a result. It can be thought of as the instructions of a calculating machine,
    however complicated and convoluted. The steps may be sequential or in parallel.
    Clustering algorithms take the data as input and return some form of a *partition*
    of the data into groups or a hierarchy representing some or all of the relationships
    among the data, from which a partition of the data can be derived by cutting the
    hierarchy at a hopefully meaningful level.


    The algorithms can vary from these two general models such that the partitions
    and indeed the partitions of the hierarchies may not necessarily be disjoint—overlapping
    clusters are output by these algorithms. Rather than a strict partition, overlapping
    clusters are, to use a term from set theory, a *cover*. Fuzzy clustering 9, 157,
    155 algorithms operate on data items that have a probability or coefficient of
    membership within clusters, and have the flavor of overlapping clusters, but are
    indeed distinct from these algorithms. There are both partitional and hierarchical
    forms of fuzzy clustering. Not all data admit to symmetrical similarity relationships.
    These data have asymmetrical measures of similarity for which there are asymmetric
    clustering algorithms of both partitional and hierarchical forms. Hybrids that
    contain elements from several different forms of clustering algorithms are often
    designed such that somewhat confound the simple taxonomy of clustering algorithms
    outlined above.


    Luckily, in general clustering algorithms and their related data structures are
    not particularly complicated, but as will become apparent there are typically
    many variations on a theme. However, in some instances there may be ambiguity
    as to the group membership, caused either by some decision within the clustering
    algorithm or in the discrete nature of the similarity measure used. Modifying
    the algorithm to resolve or report cluster ambiguity can complicate the implementation
    of the algorithm and the analysis of cluster validity.


    Effectiveness often is data dependent as to what form of algorithms are applied
    to a specific problem. Computationally intensive algorithms are not particularly
    useful with very large data sets; generating a hierarchy for a very large data
    set may simply not be practical within the computational resources at hand, even
    if it might be what is desired, or prove to be the most revealing if it were doable.
    Whereas, the structure of a small data set may be revealed in all of its topological
    glory via a hierarchical algorithm, even though the algorithm is computationally
    expensive. The dimension of the data will almost certainly play a role as well
    in determining which algorithms to try. If the similarity of'
