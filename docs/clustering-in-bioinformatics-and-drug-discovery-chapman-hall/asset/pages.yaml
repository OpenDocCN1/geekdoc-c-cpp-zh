    ![](img/0faee1c17bea0aab06ee9523a28c4eaf_33_0.png)


    **FIGURE 1.1:** 100 pseudo random points on the unit square.


    A nagging doubt remains however: are the groups that we find quantitatively meaningful
    or useful? A data set may have faint structure that may be simply indicative of
    a purely random process, and this is an important point throughout the study of
    cluster analysis, namely, one of validity. Is there strong reason to believe that
    the data show meaningful structure? and at what scale (e.g., local galaxies or
    the entire universe)? Can we make conjectures and develop hypotheses about possible
    classes within the domain of study? Or, are we simply grouping randomly produced
    structure? Take for example, the scatter of rain drops as they first appear on
    a flag stone or square slab of concrete in the open air: if we assume that the
    pattern as it develops is random, we nevertheless will see regions where the density
    of drops is slightly greater, and other regions where it is slightly less dense
    overall. We can infer nothing about these slight groupings of drops on the stone
    or pavement: at any point in time their pattern is just an artifact of their being
    a sample of a uniform'
