  md: 'data, whereas, it is not so with count data. This can have important consequences
    in the choice of clustering algorithms used with each. Count data are often treated
    as if were continuous data and the Euclidean distance is used to measure dissimilarity.
    This too can lead to odd effects of ambiguity in clustering algorithm results,
    so care must be taken when evaluating the results.


    # ### 2.1.3 Continuous Data


    Continuous data are really not continuous at all when represented in a computer.
    However, with a sufficient range, precision, and size (large number of values),
    such data for the purposes of data analysis can behave like continuous values.
    Nevertheless, it is wise to understand how the values are represented, with what
    precision their range, how they will behave under transformations, and any properties
    of their possible recording error. Any elementary text on numerical analysis will
    have a discussion on rounding error and computer arithmetic [21].


    # ### 2.1.4 Categorical Data


    Categorical data are a form of labels; e.g., “yellow,” “red,” “blue,” where there
    is no sense of measure or distance between them. They are themselves classes.
    That is not to say that we can not use this data in conjunction with other data
    of different types and design a measure that takes into account all of the types.
    If the data are a response, say a class of activity (inactive or active) or expression
    (down regulated, up regulated), these data may be more appropriately used for
    supervised learning. namely, used to build predictive classifiers. If there are
    just two categories, these can be transformed to “1” and “0” to put the categorical
    data on a numerical footing.


    # ### 2.1.5 Mixed Type Data


    Mixed data presents significant issues in terms of the choice of transformations,
    the introduction of precision for binary or count data, and the choice of measures
    then used. Binary data may be converted to count data, where the counts are simply
    1 and 0, or count data may be transformed to binary data, etc., such that all
    of the data are of one type. Then, an appropriate measure of that type can be
    used to compare data items. In addition, given the different types, some care
    and thoughtfulness about the possible need for weighting or scaling the transformed
    variables should be taken.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# ## 2.2 Normalization and Scaling


    Different dimensions of the data may have different ranges: they may be on completely
    different scales. If we were to cluster a classroom of students on their height
    and weight, it is clear that these two dimensions are on different scales and
    that the values will almost surely have different ranges. However, it is hard
    to know necessarily if it is wise to leave the data on their respective scales,
    or to place them on the same scale; and if the latter, what scaling to use. Again,
    this goes back to expert knowledge about the data in question. Some scalings can
    be detrimental to the clustering process. The best clustering separation for the
    data may be the raw data or some combination where some features are scaled and
    others are not. Figure 2.3 shows simulated data where there are clearly two well
    separated clusters and when scaled in one dimension (feature), this separation
    disappears. With small data sets with just a few features, this property can be
    done by simple inspection, but for any data set of significant size and dimension
    this becomes a much more difficult exercise.


    The most common scaling is the z-value scaling, putting the values on a range
    determined by the units of the standard deviation of the sample, with a mean of
    zero. Normalization to the range of 0 and 1 can also be made which may have various
    effects with outlying values. Outliers in the data can greatly impact clustering
    results, so normalization or scaling of the data may be helpful or detrimental
    in this regard. Because such changes in clustering results are so data driven
    there is really no set preference or preferences for normalization or scaling
    methods. It may be best to perform various preliminary outlier detection routines
    on the raw data and making decisions at that time what methods should be performed
    going forward, or even removing outliers if the situation warrants.


    # ## 2.3 Transformations


    Modeling and interpretation of data tends to be far easier if the data are on
    a linear scale, and in many cases non-linear data can be transformed to a linear
    scale. The left hand panel of Figure 2.4 displays an exponential transformation
    of raw feature data. The exponential transformation of the data in the right hand
    panel exposes some heteroscedasticity (a change in variance as the values increase),
    which was not nearly as apparent in the data in its original form on the left.
    It may be hard to determine absent expert knowledge whether to transform any number
    of features, and it may be the case where inspection and trial and error are the
    only guides.


    Recorded values may be on a scale such that taking the log of the data'
