- pgno: 39
  md: 'A famous example of the problem of scale and random process versus class structure
    appeared in the 1960s and 1970s, popularly known as *cancer clusters* [101]. In
    health care demographics it was discovered that on occasion there were slight
    densities of cancer patients in a locale above the average density for a population.
    (For an example of cancer clusters in the workplace see [118].) The question became:
    were these indeed groups that were formed by some process other than random density
    fluctuations? Was there something in the water, in the air, in the workplaces,
    etc. that caused the greater incidence of a form of cancer or forms of cancers
    in a locale, or did these groups appear randomly? Analogously, were the data like
    Figure 1.2? or more like Figure 1.5? These analyses may be confounded by other
    random factors in what sample of data are collected, or how the data are collected.
    Whether clustering galaxies, cancer incidence, gene or protein expression, sequence
    analysis data, or drug-like compounds, it is clearly important to consider that
    purely random processes and the form of the sampling can play a strong role in
    how groups form.


    # ## 1.1 History


    The early Greek philosophers had a charming habit of explaining the world around
    them as a set of properties, whose cardinality was often 3 or 4; or 12; e.g.,
    there are four basic elements, earth, water, fire, and air. They posited no particular
    algorithms or analysis to quantify how they arrived at these groupings or classes.
    That is not to disparage the great intellects from the Pre-Socratics onward: they
    were after all using what they had at hand which were largely qualitative observations
    of their surroundings. And this qualitative approach continued largely unabated
    from Aristotle to Kant, such that many similar groupings based on qualitative
    observation were offered up as important classes in philosophy and science. In
    hindsight they seem somewhat arbitrary and without much in the way of foundation
    today, but nevertheless, they were well reasoned and analyzed, though nowhere
    are there proofs of validity from a quantitative or statistical sense. Collecting
    data and applying mathematics to it was relatively rare throughout the history
    of civilization well into the second millennium. Thus, even as the Greeks had
    developed extraordinary mathematics for their day, the development of mathematics
    and its application proceeded in fits and starts thereafter.


    But, as science developed into a more quantitative discipline, efforts were made
    to focus on more narrow sets of observations, rather than attempting to explain
    all of, say, cosmology or physics with a few classes and processes. The change
    from (now depreciated term) *natural philosophy* to science as a more quantitatively
    driven endeavor, more dependent on the rigor of quantitative mathematics, has
    only been accelerated by computing machines and comput-'
  merge: -1
  img_proc: true
