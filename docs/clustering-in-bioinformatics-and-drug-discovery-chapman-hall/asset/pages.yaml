  md: 'The metric property is often important in what clustering algorithms can be
    used with various types of data. Thus, measures can be classified by type, and
    whether or not they are a metric. Clustering algorithms can then be classified
    as to what data types and measures can be used effectively. By leaving out the
    triangle inequality, we can define what is known as the *semi-metric* property.
    Again, some clustering methods operate on both metric and semi-metric measures.
    Hierarchical procedures can induce a metric on a more general dissimilarity measure
    that is not a metric. Metrics and induced metrics under hierarchical procedures
    form what is known as an *ultrametric* such that we can add one more property
    with the additional constraint:


    +   * $d(\mathbf{x}, \mathbf{z}) \leq \max(d(\mathbf{x}, \mathbf{y}), d(\mathbf{y},
    \mathbf{z}))$


    This latter property can be reflected in a matrix such that respective matrix
    indices $i$, $j$, and $k$ of $\mathbf{x}$, $\mathbf{y}$, and $\mathbf{z}$ form
    the following relationship:


    $$d(i, k) \leq \max(d(i, j), d(j, k)) \quad (2.2)$$


    where $d(\;)$ here represents the element value defined for the row, column pair,
    for all $i$, $j$, and $k$. This matrix has the property of ultrametricity as will
    be discussed in the *proximity matrices* section below.


    All of the measures in this section are symmetric: the similarity between any
    two data elements $A$ and $B$ is the same as the similarity between $B$ and $A$.
    Some measures of similarity are not necessarily symmetric however. These measures
    are more often found in the social sciences. Take for example a social scientist
    who wishes to find subgroups of like-minded friends among a large group of people
    who all know each other. The scientist designs a measure of 1 to 10 as to how
    much each person likes the other and canvases them as to their preference for
    the other members of the group. Individual $A$ for example may judge individual
    $B$ with a score of 8, whereas individual $B$ may score individual $A$ with a
    score of 7. An $N$ by $N$ proximity matrix based on these preferences would likely
    be asymmetric. The scientist would then be faced with trying to find like-minded
    groups (namely clusters, and informally, *cliques*) among the entire group. There
    are a number of clustering methods that can be used to perform asymmetric clustering,
    or transformations of the proximity matrix that transform the asymmetric matrix
    to a symmetric matrix so that symmetric clustering algorithms can be used. These
    measures and methods concerning asymmetry will be discussed in further detail
    in Chapter 8.


