    # ## 3.8 Hybrids


    The design of algorithms [124] is not just concerned with various forms of efficiency
    but also *efficacy*. This is especially true of clustering algorithms, where researchers
    are often faced with new and different data sets that present challenges for the
    common clustering algorithm software they may have at hand. In almost every field
    attempts are made at designing new clustering algorithms, often out of those portions
    of existing algorithms that have some property the designers have confidence in,
    success with, knowledge of, or simply that it will fit with some other aspect
    of another clustering algorithm. These attempts are not always successful, but
    that does not stop them from necessarily being published in the literature.


    # ## 3.9 Glossary


    +   - **agglomerative**: grouping starting from individual data items (bottom
    up)

    +   - **clustering hierarchy**: a ranking of subset relationships that reflects
    the feature space of the objects, given a measure of similarity and a merging
    criterion. Sometimes referred to as representing a *topology* of those relationships.

    +   - **disjoint partition**: disjoint subsets of a set (no members in common),
    the union of which is the set.

    +   - **divisive**: splitting into groups recursively

    +   - **false singleton**: a member identified as an outlier which is within a
    threshold distance from a cluster member

    +   - **fuzzy**: an assignment of partial membership

    +   - **random sampling**: the random sampling of some distribution (uniform,
    normal, unknown, etc.) whether generated via some sequence on a computer such
    as pseudo or quasi-random sequence generation, or via some natural process.'
  merge: -1
  img_proc: true
