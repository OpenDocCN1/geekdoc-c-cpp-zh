    # ## 12.2 Primer on Probability Theory


    Probability theory concerns the quantitative analysis of random events and the
    probability distribution of random events. There are two basic and parallel notions
    of random variables, namely, *discrete* and *continuous*. In the discrete case,
    there are $n$ possible events, each with a non-negative probability, $p_i$, of
    occurring, such that,


    $$\sum_{i=1}^{n} p_i = 1. \tag{12.13}$$


    The *probability mass function* is expressed by the discrete random variable,
    $x$, taking on the any one of the events. In the finite set of events, $X$, such
    that


    $$\sum_{x \in X} P(x) = 1. \tag{12.14}$$


    If $x$ takes on continuous values, the probability can only be determined over
    an interval. This translates into what is known as the *probability density function*


    $$\int_{-\infty}^{\infty} p(x)\,dx = 1. \tag{12.15}$$


    Here $x$ is assumed to take on values over the interval $(-\infty, \infty)$, and
    the probabilities are non-negative.


    The *expectation* of the distribution of a random variable is defined as


    $$\mathbb{E}[x] = \sum_{x \in X} xP(x) \tag{12.16}$$


    This is commonly referred to as the *mean* or *average*, and often denoted as
    $\mu$.'
  merge: -1
  img_proc: true
