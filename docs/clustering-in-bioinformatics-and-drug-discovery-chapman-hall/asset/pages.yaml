    # ## 9.5 Algorithm Decision Ambiguity


    It must be noted that clustering ambiguity problem is distinct from two other
    clustering issues mentioned above.


    In the case of an agglomerative hierarchical algorithms, arbitrary decisions related
    to the treatment of ambiguous ties in proximity lead to the generation of a dendrogram
    with ambiguity resident at those levels of the dendrogram where the arbitrary
    decisions were made; such decisions change the underlying topology represented
    by the dendrogram, and in many cases changes the possible set partitions that
    can be derived from the dendrogram. Thus, for every arbitrary decision, a conceivably
    different dendrogram, and therefore topology, can be generated. For each arbitrary
    decision there is a separate and unique dendrogram, and simply reordering the
    input can generate a different dendrogram. Considering the set of possible dendrograms,
    the partition defined by any particular level may or may not be the same among
    the dendrograms. This naturally can change the results of any level selection
    technique across the set of dendrograms. Figure 9.7 shows schematically a single
    unique dendrogram (symbolically represented as a triangle) that one might generate
    from continuous data versus the possible multiple dendrograms that one might generate
    from discrete data via ambiguous decisions. A cut at any level k, represented
    by the horizontal line that cuts across all of the dendrograms, may produce different
    partitions.


    ![](img/0faee1c17bea0aab06ee9523a28c4eaf_176_0.png)


    **FIGURE 9.7:** Dendrogram (represented here as a triangle) generated by continuous
    data versus multiple dendrograms generated by ambiguous decisions with discrete
    data.'
