  md: '# 10.1.3.1  Tendency to Cluster


    Some work has been done to try to see if it is possible to more quickly determine
    whether the data has at least some significant tendency to cluster: more than
    say, the fact clustering we observed in Chapter 1 concerning a uniform sampling
    of points. Early work concerned the use of random graph theory [13] that realistically
    can only be used on small data sets. This method however is still worthwhile to
    understand as it relates to the probability of a proximity matrix at a threshold.
    There are several different models of random graph generation, but the simplest
    [40] and the one applicable to a proximity matrix at a threshold is G(n,p), where
    G is the graph with the vertex set, V of cardinality n, and p is the independent
    probability that each possible edge in G will occur. With p set low it is quite
    apparent that G is unlikely to be connected, and thus be a set of components.
    The components represent a partition of the set V. For small n it is possible
    to calculate a table of the size and distribution of components given p. A curious
    property of random graphs in this model is that as p grows, the number of unconnected
    components are less likely, but not in a particularly uniform way with respect
    to the size of the components. Indeed, the most common feature is that these graphs
    have a single, large component (in technical terms its Big Component) with a distribution
    of much smaller components. When clustering large data sets and the resulting
    clusters take on sizes with this curious random graph distribution, it can give
    one pause. It is not necessarily the case that the data does not have a clustering
    tendency above and beyond a partition that would likely be formed by a random
    graph model, but suspicions might well be aroused.


    If a clustering however does not have a common distribution of partitions formed
    by random graphs, then the probability is low that the clustering is happening
    by chance and there is good reason to assume that the clustering does show the
    data have a clustering tendency. For small data sets where the random graph distribution
    probabilities are known, one can pick a probability threshold and determine with
    the respective confidence whether or not the clustering partition differs significantly.


    # 10.1.3.2  Application Dependence and Domain Knowledge


    Within a given application domain, there may be enough expert knowledge to determine
    a test or preliminary set of classes that can be used to compare to how well a
    clustering method (or group of methods) perform. For example, given a set of compounds
    a group of medicinal chemists can arrive at a consensus as to a partition of the
    compound set into a set of classes they all agree on. The partitions that clustering
    methods arrive at independently can then be compared to the expert derived set
    of classes with a set of measures. The relative performance of the clustering
    methods can then inform the experts as to which method(s) might be best to use
    with other similar data sets [59, 148].


    This procedure is quite simple. A partition of the test data of size, N, is returned
    from a clustering method in the form of C = {C1, C2, ..., Ck}. The'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'partition generated by the experts is $\mathcal{E} = \{E_1, E_2, \ldots, E_k\}$.
    Note that the number of clusters in $C$ may not be the same as the number of classes
    in the expert partition. With $C$ form an $N \times N$ matrix, $A_C$. Here, the
    $(i,j)$ matrix element represents the presence (1) or absence (0) of the $i$ and
    $j$ data members in the same cluster. Similarly, a binary matrix is generated
    using the expert partition, $\mathcal{E}$, $A_E$. The binary matrices can then
    be compared much like the binary strings in Chapter 2. Only the $(N)(N-1)/2$ triangular
    portions of the matrices are needed as the binary matrices are each symmetric.
    Any of the various binary measures can be used but typically the most common is
    the Tanimoto (for historical reasons more commonly referred to as the Jaccard
    in this application) to capture the similarity between the clustering and the
    expert partition. It is then a question as to what value is sufficient to make
    the claim that the clustering method works well. If the clustering method is hierarchical
    in nature, then comparisons can be made between different levels of the hierarchy
    and the expert partition.


    Other measures are also used in this connection, most notably Hubert’s $\Gamma$
    statistic,


    $\Gamma = \sum_{i=1}^{N-1}\sum_{j=i+1}^{N} A_C(i,j)A_E(i,j), \qquad (10.8)$


