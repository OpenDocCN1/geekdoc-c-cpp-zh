  md: '# 1.2 Bioinformatics and Drug Discovery


    A large component of drug discovery involves searching for, and subsequently modifying
    or designing, small molecules; namely, ligands that bind to protein targets. Small
    molecule ligands are most often identified through *High Throughput Screening*
    (HTS), virtual studies in computational chemistry, or databases containing prior
    ligand activity data for a given target. Searching for drugs, or *lead discovery*,
    and modifying and designing drugs has traditionally been the domain of medicinal
    chemistry and computational chemists. The analysis and storage of this data has
    come to be known as cheminformatics. Targets are typically identified by biologists,
    geneticists, and bioinformaticians, often via systems biology. However, within
    drug discovery the study of drug design incorporates the study of the ligand-target
    interaction. Thus, there are certain areas of intersection between bioinformatics,
    cheminformatics, and even medicinal informatics within the domain of drug discovery.
    Figure 1.8 shows these disciplines and the important aspects of their intersection,
    such as genetic variation, drug design, and drug-like compound relationships.
    In Figure 1.9a this interaction is revealed in more detail under the common heading
    of the Drug Discovery Pipeline. The beginnings of drug discovery require the identification
    of a target for a particular disease of interest.


    ![](img/0faee1c17bea0aab06ee9523a28c4eaf_44_0.png)


    **FIGURE 1.8:** A broad overview of the intersection of cheminformatics, bioinformatics,
    and medicinal informatics within drug discovery.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'identification and validation of the target requires biologists and bioinformaticians.
    Once the target is identified and validated the quest for finding a ligand which
    binds to the target requires medicinal chemists, biological screening experts,
    computational chemists. Once a lead series or several lead series are identified,
    the leads require an iterative optimization process. Again some of the same chemists,
    biochemists, biologists, pharmacologists, crystallographers and toxicologists
    all participate in optimizing the potency of a lead without introducing toxicity
    or other undesired effects. Successful leads are transformed into new drug entities
    and animal and human studies follow. Ultimately if the process is successful the
    resulting drug is approved for sale to the targeted market. Medicine and medical
    informatics is utilized in the later stages of the drug discovery process, when
    the drugs are administered to patient subjects.


    In isolation, drug discovery topics in chemoinformatics often lack the medicinal
    or larger biological context. The study of how ligands bind to protein targets,
    namely 3D drug design, is intimately connected to the study of proteins and to
    protein structure, and thus to the biology of drug discovery and bioinformatics.
    Protein and gene expression, and even to some extent phylogenetic studies 85 have
    become more important within drug discovery, given the area of research known
    as *personalized medicine* 6 where drugs are designed for specific groups of individuals
    given their genetic similarity, rather than for the population at large. Bioinformatics
    and medicinal informatics help to pinpoint genetic variation, such that genetic
    subgroups that express a particular disease that is genetically related can be
    identified and targeted for specific drugs. Sometimes a drug developed for the
    general population impacts a small genetically related subgroup adversely. Having
    the ability to identify such persons and have them take other medication or design
    a new drug or set of drugs specifically for them is another form of *personalized
    medicine* that draws on the three informatic fields shown in *Figure 1.9a*.


    Drug discovery is by in large a commercial enterprise and therefore is not always
    driven by altruistic concerns. Academic and government researchers have opportunities
    to study a broader range of targets, those which do not necessarily have a bias
    toward market size, yet funding sources can influence the kinds of studies undertaken.
    It is important to keep in mind the motivations behind the results of any clustering
    literature coming out of these venues if claims are more than modest. No method
    is best necessarily for any class of data. Current and future practitioners should
    always keep this in mind.'
