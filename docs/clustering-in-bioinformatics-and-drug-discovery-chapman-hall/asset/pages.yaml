    # **Algorithm 5.1 Leader(DataSet, Threshold)**


    ```

    1: DataElement ← SampleRandom(Data) // Arbitrarily choose a data element from
    the data

    2: Data ← DataSet \ DataElement // Remove DataElement from Data

    3: Append(DataElement.C) // Append the DataElement to first cluster

    4: repeat

    5:   G ← Append(FindNN(Data, Threshold).C) // Append NN to cluster

    6:   Append(C,G) // Append C to set of clusters G

    7:   Data ← Data \ C // Remove cluster elements from data

    8:   DataElement ← SamplingMethod(Data) // Choose new centroid

    9: until |Data| == 0

    10: Output : G

    ```


    Online versions of this algorithm can also be used for vast data sets, where only
    a subset of the data are used in the iterative process, then additional data are
    added either to the now existing clusters, or new clusters are created. This provides
    additional speed up as not all of the data are considered at once, but the loss
    of the additional dissimilarity comparisons given all of the data lessens the
    amount of possibly useful information that can be used for the sampling procedure.
    The online versions rely even more on the notion that the feature space density
    of the data can be sampled normally with considerable effect. This is somewhat
    data dependent, but almost surely there is an additional drop off in efficacy
    as a result of more chance of obtaining a poor sampling.


    A slightly more complex variant of this algorithm is called *Leader-Follower*.
    In this algorithm, the data items are associated with the random sample data item,
    but that initial centroid is adjusted by the inclusion of the data point by some
    small factor, λ towards the data item, such that subsequent data items are gathered
    as it were with respect to the new centroid that is very likely not a data item
    at all. New centroids are randomly selected from the data items when a data item
    does not fit within any region of an already existing centroid. This algorithm
    is very closely related to online *K*-means. Leader and Leader-Follower algorithms
    also lend themselves naturally to online clustering (also known as competitive
    learning such as online SOM and other neural net approaches).'
