  md: 'The transpose of a matrix, $A^T$, swaps the $(i,j)$th element for the $(j,i)$th
    element. The determinant of a matrix is given the notation, $|A|$, and it represents
    an operation that returns a scalar value. If all the vectors of a matrix are linearly
    independent (their pair-wise inner product is zero), the determinant is non-zero.
    The inverse of a matrix, akin to the reciprocal of a real number, is denoted by
    $A^{-1}$, providing the matrix is invertible; that is, the determinant of the
    matrix is not zero—analogous to the fact that there is no reciprocal of zero in
    simple arithmetic.


    The concept of eigenvalues and eigenvectors are very important and often fundamental
    to a considerable amount of statistical learning theory. It is used in single
    value decomposition, principal component analysis, spectral clustering, and multi-dimensional
    scaling among other applications. It would be nice therefore to give a more extended
    presentation on this topic, thereby giving an intuitive feel for the subject,
    rather than just a set of definitions, equations, and identities.


    Starting with the mathematics, for an $n \times n$ matrix $A$, the linear equation


    $$A\mathbf{x}=\lambda\mathbf{x}, \tag{12.9}$$


    can be solved in $n$ ways. Namely, there are $n$ possible vectors that $\mathbf{x}$
    can take on with a corresponding $n\,\lambda$s (that may not be necessarily unique).
    Namely,


    $$A\mathbf{x}_i=\lambda_i\mathbf{x}_i, \tag{12.10}$$


    where $i=1,2,\ldots,n$.


    To solve for $\mathbf{x}_i$ and $\lambda_i$, Equation 12.9 can be transformed
    to


    $$(A-\lambda I)\mathbf{x}=0, \tag{12.11}$$


    where $0$ is a vector of $n$ zeros. Now if we take the determinant of the expression
    $A-\lambda I$, where $A$ is an $n \times n$ square matrix, we get the characteristic
    equation,


    $$|A-\lambda I|=\lambda^n+a_1\lambda^{n-1}+\cdots+a_{n-1}\lambda+a_n=0. \tag{12.12}$$


    This equation can be solved for $n$, not necessarily unique roots, $\lambda$.
    With each $\lambda_i$ we can solve the set of linear equations that would occur
    by substitution in 12.11 and derive the corresponding eigenvector, $\mathbf{x}_i$.


    To obtain an intuition as to the mathematics we can use the application of finding
    the principal axis of a 3-dimensional data set, with the understanding that the
    application can be generalized to $N$-dimensions. Figure 12.1 contains a cloud
    of points. The points were generated via the Marshev sequence in 3-dimensions
    in a cube, and a central ellipsoid subset of those points were selected by rejecting
    all the points outside of the ellipsoid. Here we have mean centered the data about
    the origin, and then generated the eigenvectors and eigenvalues (either via singular
    value decomposition on the mean centered data or via principal components analysis,
    using the covariance matrix of the mean centered data), and rotated the points
    to their orthogonal eigenvector'
