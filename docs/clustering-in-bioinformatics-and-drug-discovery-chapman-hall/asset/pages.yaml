  md: 'In Figure 9.8, the three diagrams represent three cases where in diagram 1
    the clusters are disjoint, to diagram 2, where there is only a small amount of
    overlapping, to diagram three, where there is a great deal of overlapping and
    ambiguity, and where it would be difficult to distinguish groups. Given ties in
    proximity and decision ties in general, a result like diagram 1 is unlikely, and
    the situation in diagram 2 is preferable to diagram 3. There is a need to distinguish
    between results that diagram 2 and diagram 3 describe. More generally, there is
    a quantitative measure that can be designed that identifies whether the ambiguity
    is significant in either relative or absolute terms.


    A decision tie within the operation of a clustering algorithm presents an arbitrary
    change in the partition of the data set or in the construction of the topology
    represented by a hierarchy. The number of possible disjoint clusterings turns
    out to be the Bell number and it is exponential in the number of elements of the
    set to be clustered, N. One possible measure of ambiguity is to divide the log
    of the number of decision ties and hence partitions, with the log of the Bell
    number for N. Decision ties however may not be one to one with changes in partitions.
    Namely, successive decision ties within an algorithm may in fact arrive at the
    same partition, as from a different set of decision ties. This can be seen most
    readily within hierarchical algorithms, where minor changes in decision ties may
    have no impact at much higher levels of the hierarchy. If the hierarchy is partitioned
    via level selection, there are only n-1 possible partitions per hierarchy. Also,
    the number of possible topologies as defined by the hierarchies happens to be
    the total number of possible rooted, and leaf-labeled, binary trees with N labels;
    namely,


    $$(2N - 3)!!.$$　　　　　　　　　　　　　　　　　　　　　　　　　　　　(9.2)


    This number grows at a rate that exceeds the Bell number for any sizeable N (at
    N = 4, both sequences are 15, but at N = 5, the Bell number is 52, but the number
    of trees is 105, etc.). Thus there are many more trees than possible partitions,
    so the trees must duplicate partitions. However, for any one tree there are only
    a very small number of partitions that can be obtained via level selection versus
    the total number of partitions. It is impractical to calculate the Bell number
    for common data set sizes and compare them with the number of decision ties that
    may result in a change in the partition. Another possible ambiguity measure is
    to simply sum the number of decision ties, normalized to N, with the understanding
    that this measure is over counting with respect to the total number of possible
    partitions. Naturally, we can compute a measure that compares the disjoint clustering
    obtained by making arbitrary decisions with the number of data elements involved
    in overlapping clusters found by using the decision ties-based overlapping version
    of the clustering algorithm.


    Ties in proximity can quite naturally propagate to the measures used in grouping,
    or grouping criteria. The clustering algorithm, Ward''s, for example, uses a squared
    error merging criterion, but, given that the values used to form the square error
    are from a finite source, the possible number of square error measure values is
    also finite, however combinatorially explosive.'
