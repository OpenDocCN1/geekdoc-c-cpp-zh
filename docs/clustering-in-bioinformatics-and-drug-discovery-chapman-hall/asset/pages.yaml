    associations between the binary strings, and correlations that are analogous to
    the correlation measures found for continuous valued data, such as the common
    Pearson correlation coefficient. Where the use of correlation is more appropriate
    for the data, and the size of the data are not too prohibitive, these measures
    can be used.


    # ### 2.6.1.1 The Tanimoto or Jaccard Measure


    The most common measure of similarity for binary data are known as the Tanimoto
    in the drug discovery literature. It is more commonly referred to as the Jaccard
    coefficient in other fields: a name which pre-dates the Tanimoto by many decades
    75, 130. Its compliment, 1 – Tanimoto is known as the Soergel dissimilarity. In
    the chemoinformatics clustering literature, authors often refer to the measure
    they used as the Tanimoto, though in general it can be inferred that they used
    the Soergel when operating on the data for their clustering algorithms. It is
    a simple measure that compares what is most like among two bit strings, counting
    bits in common. There are two formulations. The first and somewhat simpler to
    understand, starts by counting the bits in common between the two strings, A and
    B. Let the bits in common be c. Let a be those bits on in A but not in B; and,
    let b be those bits on in B but not in A. Then, the Tanimoto similarity, s, between
    A and B is


    $$ s = \frac{c}{a+b+c} \qquad (2.3) $$


    The range of s is of course [0, 1], and it can be turned into a dissimilarity,
    or informally, a distance, via d = 1.0 – s. In the other formula, let c be all
    of the bits turned on in either A and B, and let a and b be defined as a equals
    all of the bits turned on in A and b equals all the bits turned on in B. Then
    the alternate formula for the Tanimoto is


    $$ s = \frac{c}{(a+b)-c} \qquad (2.4) $$


    An equivalent formulation set notation is sometimes found in the literature:


    $$ s = \frac{|A \cup B|}{|A| + |B| - |A \cup B|} \qquad (2.5) $$


    It is typically more efficient to generate the Tanimoto measures by implementing
    Equation 2.4, but it is often best to see all three of the equations above to
    quickly get a sense of the measure. It is easier to see directly the discrete
    nature of the measure, given Equation 2.3. Note, that if N is the'
