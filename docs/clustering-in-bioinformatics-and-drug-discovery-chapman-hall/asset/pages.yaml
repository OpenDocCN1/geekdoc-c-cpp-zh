    # ## 9.6 Overlapping Clustering Algorithms Based on Ambiguity


    # ### 9.6.1 Modified Taylor-Butina Algorithm


    The first algorithm we discuss in detail is Taylor-Butina leader algorithm [132,
    22], often used for cluster sampling or clustering large data sets such as can
    be found in compound diversity studies for compound library design. Below we list
    the various steps of this algorithm and identify those steps that contain the
    possibility of an arbitrary decision.


    +   1. Create thresholded nearest neighbor table.

    +   2. Find true singletons: all those data items with an empty nearest neighbor
    list.

    +   3. Find the data item with the largest nearest neighbor list (thereby becoming
    the centrotype). There may be more than one such data item, namely, there is more
    than one such data item with the same number of items in its respective nearest
    neighbor list. We will call this decision tie an exclusion region tie.

    +   4. The chosen data item from 3 and the data items from its nearest neighbor
    list form a cluster, and all are excluded from consideration in the next step—the
    centrotype and the data items from the respective nearest neighbor list are removed
    from all remaining nearest neighbor lists.

    +   5. Repeat 3 until no data items exist with a non-empty nearest neighbor list.'
