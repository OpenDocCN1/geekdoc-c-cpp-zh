  md: '# # Chapter 7


    # ## Hybrid Algorithms


    There is no real restraint to creating new clustering methods by way of drawing
    on basic components of other methods. There may be numerous motivations for such
    methods such as efficiency in time or space, or the developers may have good reason
    to believe that the new method is very effective for a certain type of data. Methods
    for bi-clustering are a good case in point, where there is a very specific clustering
    problem that is data driven. In this chapter, we will examine several newer methods
    that draw on both the partial and hierarchical methodologies to create clustering
    methods that are used either in bioinformatics or drug discovery domains. The
    methods shown here of course are not exhaustive but cover the broad notions of
    combining hierarchical and partition methods in thoughtful and intriguing ways.


    # ### 7.1 Self-Organizing Tree Algorithm


    The self-organizing tree algorithm, commonly referred to as (SOTA) [70], has the
    rather unique property of building a hierarchy in an organic fashion, that is
    somewhat unlike traditional hierarchical clustering methods. Agglomerative hierarchical
    algorithms generate either a rooted tree or a forest of trees at a specific threshold,
    and level cuts of these trees create partitions that are clusters. Divisive hierarchies
    typically start at a single root and create a tree whose leaves may stop at a
    non-trivial a partition, though again, level selection is used to create clustering
    partitions. SOTA is a divisive methodology of growing a tree from the top down,
    but the leaves are the final partition, and the splitting criterion is based on
    the SOM method. As part of the criterion, a measure is generated, the Resource,
    R_i, for the ith node in the tree, the sum of which over the generated tree can
    conveniently be used to validate the resulting clusters. The Resource sum is in
    fact a stopping criterion once a preset threshold is reached.


    $$R_i = \sum_{j \in J_i} \frac{(x_j - \bar{x}_i)^2}{n_i}$$  (7.1)'
