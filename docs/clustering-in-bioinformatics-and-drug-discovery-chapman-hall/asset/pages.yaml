  md: '# Algorithm 4.1 Kmeans(Data, K, Iterations)


    ```

    1: 𝒢 ← KEmptyLists()

    2: M ← ArbCenters(Data, K) // Find K arbitrary centers

    3: Axis ← PrincipalAxis(M) // Find principal axis of centroids

    4: 𝒢 ← FindNN(Data, M, Axis) // Find the Nearest Neighbors to M

    5: M ← FindCenters(Data, M) // Find the centers of the groups in 𝒢

    6: i ← 1

    7: repeat

    8:     𝒢′ ← 𝒢

    9:     Axis ← PrincipalAxis(M) // Find principal axis of centroids

    10:    𝒢 ← FindNN(Data, M, Axis) // Find the Nearest Neighbors to M

    11:    M ← FindCenters(Data, M) // Find the centers of the groups in 𝒢

    12:    i ← i + 1

    13: until i = Iterations OR 𝒢 = 𝒢′

    14: Output: 𝒢, M

    ```


    # 4.1.1  K-Medoid


    The K-medoid algorithm is very much like K-means, but instead of finding centroids
    that may not be the actual data items in K-means. K-medoids always use actual
    data items as the group''s centers. The term medoids has the flavor of measure
    of central tendency like a median value, versus a mean, and the medoids or centers
    themselves are often called centroids or exemplars. From a statistical standpoint,
    this approach is also very much like choosing the median versus the mean of a
    distribution as a measure of central tendency as it is less effected by outliers
    and noise. In practice this is often a modest improvement over K-means results
    that can be especially useful when the data does indeed have outliers and noise.


    Just as in K-means, an arbitrary set of K centroids can be chosen randomly, or
    more thoughtful initial data centroids can be chosen [82]. Rather than find centroids,
    K-medoid swaps each data point with each centroid and calculates a measure (often
    the average or sum of distances) to determine if the new configuration is better
    under some cost function, and if so, whether to swap the centroid to the new data
    point. This is done repeatedly until no centroids are swapped. However, with discrete
    data, it is possible that arbitrary choices must be made that may cascade to other
    swaps.


