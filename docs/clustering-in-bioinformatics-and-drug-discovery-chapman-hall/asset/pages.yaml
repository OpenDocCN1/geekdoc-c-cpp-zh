    # ### 2.6.2 Count Data Measures


    Count measures can be derived from both binary and continuous measures. Thus,
    for example there is an analogous Tanimoto measure for count data (count fingerprints);
    and the Euclidean distance can be used with the count data type, by converting
    the count data into real valued numbers (e.g., assign 4.0 to the count value 4).
    The discrete nature of the values does not relate to the range of possible counts.
    In the discussion above concerning the counts of subgraph matches of a single
    fingerprint subgraph key, it was noted that the typical subgraph key would rarely
    have more than just a few matches within a single compound. Thus, say for a database
    of several million compounds, if no key has more than some small number of matches
    (e.g., << 100), the number of possible similarity values will not increase by
    a great deal over the binary case for the measure in question. Indeed, it was
    noticed that for this and other reasons, the results one obtains for count data
    concerning both clustering and similarity searching is often only marginally different
    from those obtained with the equivalent binary data.


    # #### 2.6.2.1 The Tanimoto Count Measure


    The count Tanimoto similarity is defined as follows, where N is the dimension:


    $$ s = \sum_{i=1}^{N} \frac{a_i}{b_i}. \tag{2.27} $$


    where a_i is the lesser of the ith count from either of what are now defined as
    count vectors, A and B, and b_i is the greater. If b_i is 0, then that term of
    the sum is 0. This similarity cannot be transformed into a dissimilarity metric
    that satisfies the triangle inequality. The values of this expression are also
    not necessarily within a range of [0,1]. Normalizing the values to [0,1] is also
    not necessarily straight forward, as it can skew the distribution greatly. This'
