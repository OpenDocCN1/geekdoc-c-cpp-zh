    $$E_C = \frac{1}{\sum_{p \neq q} \eta_p \eta_q} \sum_{p \neq q} \eta_p \eta_q
    E_{C_p,C_q} \tag{10.6}$$


    Though it may be best to regard these measures separately, we can compose a simple
    measure of the overall homogeneity and separation as:


    $$R_C = \frac{I_C}{E_C}, \tag{10.7}$$


    where, providing d(·) in both cases is a dissimilarity. I_C tends to zero, and
    E_C grows, if the clusters have strong homogeneity and strong separation.


    Given k clusterings, a ranking of the R_C values for each clustering will give
    us at least a quantitative ranking in order to determine the best clustering.
    If the data set is large and if k is large the computational aspects of the above
    equations (even as simple as 10.1 and 10.4 are) become prohibitive.


    Another internal measure that can be used globally with hierarchical clustering
    is what is known as the cophenetic correlation coefficient. Given an agglomerative
    hierarchical clustering, the merge criterion value where the (i,j) pair of data
    items are first merged form N(N-1)/2 values. These values form a matrix where
    by convention the upper triangular portion of the matrix is filled with these
    (i,j) values, and the rest of the matrix elements are zero. Implicitly, the matrix
    represents the structure of the hierarchy. How well this matrix correlates with
    the actual proximity matrix is a measure of the global fit of the hierarchy to
    the data. The cophenetic correlation can be computed simply as a form of element-wise
    Pearson correlation of the N(N-1)/2 values of each matrix (namely, the correlation
    between vectors of length N(N-1)/2). This is also known as the Mantel statistic
    [10] on full matrices, where the correlation takes over the entire matrix. If
    the cophenetic correlation is near one, the hierarchy well represents the structure
    of the data. This is not to say that it is known or easily tested (Monte Carlo
    sampling) how close to 1 the correlation needs to be to be assured of this. The
    correlation tends to be larger with large data sets, and certain hierarchical
    algorithms may bias the correlation some, but in general it is a good first approximation
    as to the internal validity of a single clustering if the cophenetic correlation
    is above 0.8, especially for small data sets.


    # ### 10.1.3 Uses of External Cluster Measures


    There are three basic uses of external clustering validity: the tendency of the
    data to cluster, testing different clusterings, and testing clusterings against
    randomly generated clusterings of the same data.'
