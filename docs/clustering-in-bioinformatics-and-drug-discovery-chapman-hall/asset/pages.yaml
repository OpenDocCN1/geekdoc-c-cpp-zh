    # ## 9.1 Discrete Valued Data Types


    One common misunderstanding is that clustering ambiguity and more specifically
    ties in proximity result from duplicate data. For example, it is quite common
    in binary bit string data of any significant size that there will be duplicate
    fingerprints, especially if the length of the binary string is relatively small.
    In chemical fingerprints, the same fingerprint may represent more than one compound.
    This is a fact common among chemical fingerprints such as daylight fingerprints
    and the MDL MACCS key fingerprints—that not all structural nuances and differences
    are captured by the binary encoding, regardless of the form of encoding, even
    *n-gram* analysis of the direct encoding of the structure (e.g., SMILES stings)
    57 . Depending on the fingerprint length and the compound data set there is often
    between 5 and 15 percent fingerprint duplicates, even with fingerprints of length
    1024 bits 14 . Such duplicates will naturally cause ties in proximity, but removal
    of unnecessary duplicates suffices. It is the other forms of ties in proximity
    and decision ambiguity that we are concerned with in what follows.


    # ## 9.2 Precision


    Another problem relates to the precision of the data (dis)similarity coefficient
    values. Ties in proximity can be derived from the use of small precision as mentioned
