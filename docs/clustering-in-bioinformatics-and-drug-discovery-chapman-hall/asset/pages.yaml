- pgno: 28
  md: '# Foreword


    Clustering is basically collecting together objects, which are alike, and separating
    them from other groups of like objects, which are unlike; i.e., grouping and discriminating.
    We do this intuitively all the time in our daily lives. Without it, every object
    we encountered would be new. By recognizing *critical features* which make the
    new object like something we have seen before, we can benefit from earlier encounters
    and be able to deal quickly with a fresh experience. Equally, we are very efficient.
    For instance, we recognize a group of friends and relatives, even if they are
    in a large crowd of people, by selecting a *subset of features*, which separate
    them from the population in general.


    Chemists, for example, even in the days when chemistry was emerging from alchemy,
    were putting substances into classes such as “metals.” This “metal” class contained
    things such as iron, copper, silver, and gold, but also mercury which, even though
    was liquid, still had enough properties in common with the other members of this
    class to be included. In other words, scientists were grouping together things
    that were related or similar, but not necessarily identical, and separating them
    from the “non-metals.” As Hartigan [65] has pointed out, today’s biologist would
    be reasonably happy with the way Aristotle classified animals and plants, and
    would probably use only a slightly modified version of a Linnaean-type hierarchy:
    kingdom, phylum, class, order, family, genus, and species.


    So, if we are so good at clustering and the related processes of classifying and
    discrimination in our daily lives, why do we need a book to tell us how to do
    this for chemistry and biology, which are, after all, fundamentally classification
    sciences? The answer to this question is twofold.


    Firstly, the datasets we are dealing with are very large and have high dimensionality,
    so we cannot easily find patterns in data. Consider for example one of the best
    known datasets in chemistry, the Periodic Table of Elements. It is “exactly what
    it says on the tin.” Mendeleyev (or Mendeleev) had the 60 or 70 known elements
    by atomic weight, that, when set out in a table, grouped the elements by properties.
    So the alkali metals all came in one row in his original version, the halogens
    in another, and so on. He had enough belief in his model to leave gaps for yet
    undiscovered elements and correct atomic weights of elements that did not fit.
    What he did not do was try and cluster the properties of the elements. Even for
    such a small dataset, questions would arise as how to combine, say, a density
    value, which is real, with a valence value, which is an'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'integer. The datasets we are considering today very rarely, if ever have such
    a dominant property.


    Secondly, with advances in computer power and algorithm development, analyses
    can be data driven, where the distinct and varied properties of the data can be
    taken into consideration. In the past we have carried out many analyses because
    we could gloss over these distinctions with a single type, rather than because
    we should. Data had to be regarded as real distributed in a Cartesian space so
    we could make use of the computing tools that were available. This is not meant
    as a criticism of what was done: often the outcome was useful and allowed science
    to progress. An example of this comes from the work of Sokal and Sneath, the fathers
    of numerical taxonomy [27]. They struggled with what they believed to be an intractable
    problem: how should one weight the different attributes of the organisms? They
    realized and assumed that the attributes should have equal weights because their
    apparent importance arose from their mutual correlations. Sneath published an
    illustration of this data from Chromobacterium, one of the earliest papers to
    use computers in taxonomy [125].


    In this volume, the authors present sufficient options so that the user can choose
    the appropriate method for their data. Again, because of the advances in the hardware
    and software more than one method can be used to find which is the “best.” This
    is extremely valuable as quite often what is seen as the “best” mathematically
    is not the one that allows other progress to be made. So, again, the user needs
    to be clear about the purpose of the analysis: is it post facto rationalization
    of historical data or an attempt to make use of past data to suggest experiments
    to move the science forward? In the latter case, more common in drug research,
    higher risk and less statistical rigor may be acceptable. Having chosen clustering
    methods, which is appropriate for our data, we still have the thorny question
    of what similarity measure to use. This is governed to a certain extent by the
    data and the method. Our assessment of similarity varies whether we ask the question,
    “How alike are A and B?” or “How like A is B?” In the first form, the relationship
    is symmetrical. In the second it is asymmetric, i.e., more weight is given to
    A than B. The authors deal with this in Chapter 8. It may be that the choice can
    only be made by trial and error, i.e., which measure works best.


    Then there are the data values themselves, which describe the objects we are trying
    to cluster. We are almost always choosing only a subset of the possible descriptors
    of an object: this may be a source of bias. If the descriptor is real valued,
    almost certainly it will need to be scaled. It is possible they may need weighting
    as well.


    Only when all these things have been considered are we in the position to start
    our analyses; so it is clear that clustering is not a technique that sits under
    a button on a (molecular) spreadsheet. Practitioners in the pharmaceutical industry
    need an expert guide, which the authors of this book provide, to extract the most
    information from their data. Those of us who learned'
