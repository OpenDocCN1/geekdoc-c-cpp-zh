    \ algorithms continue to appear in the literature across many domains, often merely\
    \ modifications of already well known algorithms to suit a specific application.\
    \ One can design new clustering algorithms, but it is often prudent to thoroughly\
    \ review the literature, and not just within the broad application domain—there\
    \ is a strong likelihood that a new algorithm or one nearly identical to it has\
    \ already been published.\n\nCluster analysis as an exploratory data analysis\
    \ tool is dependent on the ability to visually display results and thereby help\
    \ interpret the results. Thus, the visualization of clustering results has received\
    \ a boost in recent years with advances in high end computer graphics, but there\
    \ is still a great deal of work to be done to effectively visualize the clustering\
    \ results of large data sets or data sets with large dimensions. Multivariate\
    \ analysis contributes important methods aligned with cluster analysis such as\
    \ principal component analysis (PCA) [80] and various forms of multi-dimensional\
    \ scaling (MDS) techniques, useful for both exploratory data analysis, and data\
    \ and cluster visualization [16, 31]. PCA has also been used to develop clustering\
    \ algorithms for gene expression data [154]. More recently, similar methods such\
    \ as non-negative matrix factorization [34] have been developed and used for both\
    \ exploratory analysis and modified for cluster analysis. These tools have their\
