  md: '# # Chapter 10


    # ## Validation


    Cluster validity is a hard problem, especially for data sets of any significant
    size as the validity techniques are typically computationally expensive. In the
    literature, researchers will often include some form of cluster validity to help
    justify their results, even if the validity is some form of relative measure.
    Large data sets however prohibit the use of validation, so researchers have to
    rely on previous work with smaller sets within the application domain, or perform
    those studies themselves if the use of their clustering method is new to their
    application domain.


    When presented with a specific partition as the result of a clustering method,
    from a quantitative standpoint *internally* validating that a partition as a significant
    set of groups is based on two basic ideas that can be formalized mathematically.
    First, what is the general *homogeneity* or *compactness* of each individual cluster?
    That is to say, broadly, how self consistent is the cluster in terms of how similar
    all of its members are; cluster members should be very similar. There are naturally
    several common tests of cluster homogeneity that follow the statistical methods
    for determining data homogeneity based on the mean, variance, and the standard
    error. Second, how distinct are clusters from one another? Namely, what is the
    *separation* of clusters. The goal of course is that the results of a clustering—the
    partition into groups—will produce clusters that are well separated and each cluster''s
    homogeneity is such that all the cluster members are very similar.


    A combination of a measure of homogeneity and a measure of separation, typically
    in the form of a ratio, can then be used to compare clustering results *externally*
    in a relative sense—the clustering *A* of the data has a better *homogeneity/separation*
    ratio than that of the clustering *B* of the data. Providing the clusterings are
    not overlapping, the ratio is independent of whether the results come from two
    very different clustering methods, or, just a slight change in an input parameter
    to the same method; or, in the case of a hierarchy, two different partitions of
    the hierarchy. Validation tests need, of course, to be modified for overlapping
    or fuzzy clustering results, where quantifying homogeneity and separation are
    confounded.


    At least in the distinct partition case, the above notion of validation seems
    simple enough, but it must always be balanced against what is known (if anything)
    about the data before clustering. For example, it might be known that the number
    of groups is probably within some range, and the partition we create during clustering
    is far outside this range. Nevertheless, the homogene-'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'ity and separation may be very good at that clustering scale, perhaps even
    better than any such measure within the appropriate range of the data given the
    domain knowledge, but the clustering is of no use for the application. If a reference
    classification can be created from a small set by those experts in the domain
    application, this set can be clustered with a clustering method or with several
    methods, and the clustering or clusterings can be compared with the reference
    classification to determine if the type of the data might have clustering tendencies,
    given the data types associated with the data. Such procedures are often used
    to verify to the researchers that they can then go forward and cluster with larger
    data sets, given that the data appears to have some clustering tendency with respect
    to the reference classification. In the absence of such information however, validation
    must rely on other quantitative measures. Validation methods can measure the ratio
    or relationship of some measure of homogeneity versus some measure of the separation
    - and disregarding trivial values at or very near the extrema of either a cluster
    for each data object (a singleton per cluster), or just one cluster for all of
    the data.


    It would certainly be of value to know also that the groups found differs significantly
    from those found by some random partition. Since the number of possible partitions
    is so large in general for any data set of significant size, it is only possible
    to sample such partitions and compare those partitions with the partition formed
    by the clusterings. Of course it will be important to create such a sample in
    a systematic way, one that draws from the almost certainly arbitrary distribution
    all possible partitions in terms of, for example, their ratios of homogeneity
    to separation. Some statistical confidence can thereby be gained by hypothesis
    testing. One may be able to have at least loose confidence at some interval of
    rejecting the null hypothesis or not rejecting the null hypothesis of the cluster
    being simply formed largely by chance, assuming the vast majority of the partitions
    are just that random, and the clustering’s validation measure is quite distinct
    from those sampled.


    # 10.1 Validation Measures


    Validation methods fall into two categories. The first is the how well does the
    clustering exhibit the features of homogeneity and separation internally, irrespective
    of other partitions of the data. The second is external validation, which considers
    other partitions of the data for comparison.


    # 10.1.1 Internal Cluster Measures


    For the given $k$th cluster, $C_k$, one measure of homogeneity, $IC_k$, is simply
    the average of the similarity or dissimilarity to $C_k$''s centroid or centrotype,
    $\bar{m}$.'
