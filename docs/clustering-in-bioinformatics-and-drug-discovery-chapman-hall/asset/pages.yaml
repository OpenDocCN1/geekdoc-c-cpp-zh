  md: '# ## 2.6.1.2 The Baroni-Urbani/Buser Coefficient


    The Tanimoto measure has a slight bias towards making bit strings that both have
    a large percentage of bits turned on as being more similar than two bit strings
    with only a few bits on in each. This bias can have an impact on clustering results,
    and may bias the *centrotype* size (number of bits turned on in what might be
    more loosely and perhaps inaccurately referred to as the *centroid* of a cluster)
    relative to the other members of a cluster.


    The Baroni-Urbani/Buser (BUB) measure was developed to study the probability of
    various binary coefficients in the context of the Jaccard measure. Like the Dice
    coefficient (see in Other Binary Measures) it has a similar form to the Tanimoto:


    $$s = \frac{\sqrt{cd} - c}{\sqrt{cd} + a + b + c}, \quad (2.7)$$


    where *d* is the number of zero bits in common to both binary fingerprints. Again,
    and for what follows *a* and *b* are the earlier definitions of bit turned on
    but not in common to A and B. BUB has been shown to be roughly equivalent if not
    marginally better than the Tanimoto with respect to structural fingerprints in
    similarity searching and clustering of drug or drug-like compounds. The square
    root term helps to remove the size bias common in other measures such as the Tanimoto
    and Euclidean. The *d* terms helps to factor in the size of the fingerprint and
    changes to a small degree the distributional properties of the measure versus
    the Tanimoto. Figure 2.5 shows a comparison between the Tanimoto and the Baroni-Urbani/Buser
    coefficients given all binary strings of length 5. Both are discrete and have
    a fractal ruler pattern, where the Baroni-Urbani/Buser tends to have more larger
    values. Binary strings of length 6 are used in Figure 2.6. With binary strings
    of length 5 there are fewer possible values given the Baroni-Urbani/Buser coefficient
    than that of the Tanimoto. The opposite is true of these coefficients given binary
    strings of length 6. This variability in the number of possible values has to
    do with the number of divisors of the length of the binary string. When the length
    of the string is a prime number the number of possible values tends to be less
