    $$d = \sqrt{\frac{\sum_{i=1}^{N}|(A_i-B_i)|}{N}} = \sqrt{\frac{\sum_{i=1}^{N}XOR(A_i,B_i)}{N}}.$$
    (2.10)


    where $XOR$ returns 1 and 0 for true and false respectively. When implemented
    the latter expression may be the most efficient. Its similarity expression, known
    as the Minkowski measure, in terms of the symbols used to describe the Tanimoto
    measure is simply,


    $$s = \sqrt{\frac{a+b}{c+d}},$$ (2.11)


    where $c+d$ of course equals $N$.


    Like the simple matching coefficient, its similarity compliment, there are only
    $N+1$ possible values. The Euclidean measure is a dissimilarity with a range of
    $[0,1]$. It has the opposite bias of the Tanimoto, making bit strings with fewer
    bits on appear to be more similar than the counterpart—bit strings with many bits
    turned on. Researchers have noted that taking the product of the Soergel and the
    squared Euclidean dissimilarity [35] may help to ameliorate the biases of both.
