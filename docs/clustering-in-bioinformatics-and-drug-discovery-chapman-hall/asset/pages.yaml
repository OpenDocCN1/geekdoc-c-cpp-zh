  md: '# ### 9.6.4 Hierarchical or Pyramidal Algorithms


    A commonly used hierarchical algorithm used in chemoinformatics and elsewhere
    is Wards algorithm. A fast implementation of this algorithm uses RXN. RXN can
    also be employed similarly with two other common hierarchical algorithms, complete
    link, and group average. Decision ties that lead to clustering ambiguity reside
    directly within RXN. The core operation of RXN is to form a nearest neighbor (NN)
    chain until a RXN (each is the NN of the other) is found. Two questions arise
    in its implementation: What if there is more than one NN? And what if in turn
    there is more than one RXN? An NN chain assumes that each NN is unique. Given
    ties in proximity however, for any given data item there may be more than one
    NN. If the chain is altered arbitrarily due to ties. this situation gives rise
    to the second question. namely, the resulting RXN may also differ. RXNs may represent
    either data items or merged groups in the agglomerative process via the merging
    criterion in the implementation of this class of hierarchical algorithms. As represented
    in the dendrogram. arbitrary decisions are embedded where ever they occur within
    the tree. The amount of ambiguity is related to the similarity coefficient and
