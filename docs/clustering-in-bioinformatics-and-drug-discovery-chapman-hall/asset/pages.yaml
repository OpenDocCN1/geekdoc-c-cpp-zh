- pgno: 122
  md: '# # Chapter 4


    # ## Partitional Algorithms


    Partitional clustering algorithms are quite popular in both bioinformatics and
    drug discovery. Variations of K-means continue to spring up in the literature,
    largely in an effort to tackle larger and larger data sets efficiently. Jarvis-Patrick
    was a popular method for clustering large scale data sets of binary fingerprints
    early on in cheminformatics, but has been supplanted largely by K-means-like and
    sampling algorithms. Spectral clustering, popular in the imaging community, has
    had some adherents for medium sized data sets in cheminformatics. Self-organizing
    maps of various forms have become popular in bioinformatics, though originally
    coming from the engineering literature. They have an analog computing flavor with
    numerous parameters that vary throughout the clustering process, but it can be
    shown that they are really quite similar to K-means in their overall behavior.
    Their popularity is in part due to the fact that they provide a convenient way
    in which to visualize the results as a part of the process and output.


    # ### 4.1 K-Means


    A basic form of the K-means algorithm shown in chapter 3 (Algorithm 3.1) can be
    modified at will seemingly (e.g., see [97, 49, 100, 66, 82, 128, 95] for various
    examples). Some are due to the types of data, others are for performance reasons
    or notions of attaining a more nearly optimal partition by careful selection of
    the starting centroids. The few rationales are presented here and examined in
    connection to efficacy and data type. In addition, though online clustering algorithms
    are important in fields such as cyber security and fraud detection of enormous
    streaming data sets and are rarely needed in bioinformatics and drug discovery
    applications, they may be useful for clustering very large data sets. The algorithm
    starts by generating arbitrary centers within the feature space of the data. Such
    points can be either randomly generated or actual data points randomly selected
    from the data, either pseudo randomly or quasi-randomly chosen (e.g., Van der
    Corput sequence [52] scaled to the indices of the data).'
  merge: -1
  img_proc: true
