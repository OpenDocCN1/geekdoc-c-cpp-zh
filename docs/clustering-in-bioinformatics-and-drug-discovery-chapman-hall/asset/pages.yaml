  md: 'the reduced natural number fractions, where the denominator is less than or
    equal to 5, and the numerator is never greater than the denominator. Such a sequence
    of fractions is called the Farey sequence N, where N is the largest denominator—in
    this example the number 5. There are however 32 strings and therefore 32 choose
    2, or 496, possible unique pairs of strings. In Figure 2.5, the distribution of
    those values is plotted.


    It is a discrete, very coarse grain distribution, and the relative frequency of
    values is not the least bit uniform. The situation improves somewhat as the length
    of the string grows large. In fact, we can calculate the approximate number of
    possible coefficient values based on the length of the string, given the Tanimoto
    coefficient. This turns out to be the sum of the Farey sequence N, where N is
    in this case the number of bits in the bit string, and whose asymptotic expected
    value is


    $$\frac{3N^2}{\pi^2}+O(N\log N). \tag{9.1}$$


    For a binary string of length 1,024 bits, the exact number of Farey numbers for
    N = 1024 is 318,954 possible Tanimoto values (the expected Farey value from Equation
    9.1 turns out to be roughly 329,000 possible values). Some coefficients have never
    been. The Euclidean distance, operating on a pair of bit strings of length N,
