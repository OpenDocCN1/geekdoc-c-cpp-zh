    # ### 4.1.2 K-Modes


    K-modes algorithm is nearly identical to K-medoid, but for the fact that it operates
    on categorical data and the corresponding measures of (dis)similarity. Binary
    string data can be regarded as categorical data, bringing into play the various
    binary data measures. The centrotypes are swapped in and out again in connection
    with a cost function determined now by the categorical measures. In the context
    of binary strings, rather than the mean or medoid center, modal fingerprints (see
    Chapter 2 modal fingerprint definition) can be used as centers. The parameterization
    of the modal fingerprints can significantly alter the results, and, given the
    discrete nature of the fingerprints or categorical data, K-modes is even more
    likely to have odd swapping effects like K-medoid.


    # **Algorithm 4.2** *Kmodes(Data, K, Iterations)*


    ```

    ~~~

    1: 𝒢 ← KEmptyLists()

    2: M ← ArbCenters(Data, K) //Find K arbitrary centertypes within Data

    3: 𝒢 ← FindN(Data, M) //Find the Nearest Neighbors to M

    4: M ← FindModal(Data, M) //Find the centers of the groups in 𝒢

    5: i ← 1

    6: repeat

    7: M′ ← Swap(Data, M) //Perform swaps to determine M

    8: 𝒢 ← FindN(Data, M′) //Find the centers of the groups in 𝒢

    9: i ← i+1

    10: until i == Iterations OR M == M′

    11: Output: 𝒢, M

    ~~~

    ```


    # ### 4.1.3 Online K-Means


    Online K-means performs the K-means algorithm with two small twists. The closest
    centroid to an input data item is updated as the data are streamed in one by one.
    The updating of the centroids is no longer the mean of the nearest neighbors,
    but rather by some small fraction λ. Thus, if the data item is x_j and its closest
    centroid is m_i, then the centroid is updated immediately via:


    m_i′ = m_i + λx_j.    (4.1)


    This form of the algorithm is very much like Self-Organizing Maps (see Section
    4.4.1). In fact, it differs very little from an online version of SOM. It is fairly
    easy to see that this impacts the stability of the results with respect to input
    order regardless of the data type.'
