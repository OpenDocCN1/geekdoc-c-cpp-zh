  md: 'or some measure of density can be applied to each of the tied rows to determine
    which row is the densest. An example of such is: choose the row with the minimum
    sum of all cluster members to the representative (centroid or centrotype). This
    is simple and fast as it is simply the sum of the row entries. Even with various
    tie breaking schemes this algorithm is typically not invariant to input order.
    Not all ties might be resolved analytically - there may even be minimum sum of
    distances ties for example. This problem is especially true when the number of
    cluster members gets small. However, if the tied clusters do not overlap, and
    thereby change the remaining clusters, the resulting clusters will be the same,
    only output in a different order. If there are a set of tied candidate rows for
    the next cluster and at least one pair of overlap, the choice of which row is
    considered a cluster can significantly alter some of the clusters that come thereafter.


    One of the nice features of this algorithm is that upon completion, the representative
    for each cluster is known and can be output as the first member of the cluster.
    Also, the sparse matrices, though typically only a constant fraction of the total
    $O(N^2)$ size, can often be as little as one percent of the full matrix in practice.
    This makes for a very fast algorithm for large data sets once the sparse matrix
    has been created. Generating very large sparse matrices is this algorithm''s drawback
    for very large data sets. Even the sparse matrices can get very large, especially
    if the data set is huge.


