  md: '# ### 1.5.2 Parallel Algorithms


    So far we have discussed algorithms in terms of single processor, and as a set
    of sequential processes. Some problems are fundamentally sequential, but many
    problems can be parallelized. In the simplest case, consider the generation of
    a dissimilarity matrix. The generation and storage of the matrix can be decomposed
    into blocks and assembled as these blocks are completed. Thus, if we have numerous
    processors (or processor cores), where the generation of these blocks can be distributed
    and then assembled in memory or on disk, we can in principle, reduce the time
    it takes to generate the matrix by a factor of the number of processors we use
    to generate the blocks, minus the time to distribute the data and then assemble
    it—a form of latency. Such a problem is known as *embarrassingly parallel*, meaning
    there is no real communication necessary among the processors other than the distribution
    of data and the collection and assembly of the results. There are problems however,
    that, though still parallelizable, need to have processors communicate results
    or data among them. This communication cost forms another more serious form of
    latency, but nevertheless, it is still worthwhile to perform the parallel implementation
    of an algorithm over a sequential implementation in terms of the time cost. The
    asymptotic notation for parallel algorithms includes the order of the number of
    processors. So for example, a sorting algorithm may have an O(N) time in the size
    N of the data, and with O(lg P), in P, the number of processors. It should be
    noted that though a problem may be parallelizable, typically the more complex
    the problem the less likely there is a straightforward translation of the most
    efficient sequential solution to a parallelizable one. One might think of this
    as a *solution latency* above and beyond the pre- or post-processing latency of
    *embarrassingly parallel* algorithms, or communication latency.


    Increasingly, computers have multiple processors with multiple cores, allowing
    desktops, and even laptops the ability to perform significant parallel algorithms.
    Clusters of computers can now do enormous data sets in parallel. Latency may be
    large in practice. Say for example you have access to 32 cores and you run your
    clustering algorithm on this system and it takes a day. And yet, you run the sequential
    version of the algorithm on a single core and it only takes 5 days. That is nothing
    like 32 times speed up, but if you have the resources it might be better to get
    the job done in a day versus waiting 5 days. But now let us say that you only
    have 4 cores. It may well be that the same job now takes *longer* than the sequential
    version on one core due to the latency. In some instances, with certain algorithms
    the latency is such that the speedup obtained via parallelization can''t effectively
    grow significantly beyond a certain point *regardless* of the number of processors
    thrown at the problem. Thus, though the development of clustering algorithms that
    can be parallelized is a boon, and often independent of the nature of the latency,
    the amount of computing resources may be critical and will need to be carefully
    considered in the development and use of parallel versions of an algorithm.'
