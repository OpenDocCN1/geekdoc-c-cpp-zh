  md: '# 3.2  Hierarchical


    There are many agglomerative hierarchical algorithms, based on the notion of merging
    the closest pair and updating the data, treating the pair as a single data element.
    For example in Figure 3.1, the first pair to be merged is (4, 30). This pair is
    now considered a single data item, and the next possible pair is merged, and so
    forth. The criterion by which the groups are merged distinguishes the agglomerative
    algorithm. In the generic agglomerative hierarchical algorithm in Algorithm 3.2,
    the MergeGroup() function contains the specific merging criterion that operates
    on the proximity matrix A. A is updated to reflect the merged groups and the proximity
    between groups, and not just the (i, j) data item pairs. From the output of the
    merged pairs and the merging criterion value, a permutation of the data element
    leaves and the dendrogram hierarchy can be constructed.


    ```

    **Algorithm 3.2** *AgglomerativeHierarchy(Data, A)*


    1: `N ← Size(Data)`

    2: `𝒢 ← Groups(Data)`  // One data element per group in 𝒢

    3: `repeat`

    4: `    (𝒢′, A′) ← MergeGroup(𝒢, A)`  // Merge closest group

    5: `    Output: Merged Group Pair and Merge Criterion Value`

    6: `    (𝒢, A) ← (𝒢′, A′)`  // Update matrix and groups

    7: `until 𝒢 = ∅`

    ```


    The simplest merging criterion, and of rather limited value, generates what is
    known as *single link* clustering. It merges two clusters based on the minimum
    dissimilarity between candidate groups, namely, the minimum nearest neighbor pair
    among all current groups. It has the effect of merging subgraphs that are the
    corresponding minimum spanning tree for successively larger subgraphs. Complete
    link clustering algorithm has as its merge criterion the furthest neighbor criterion.
    In a graph theory sense, this criterion can be expressed as finding the minimum
    clique, where all pairs of dissimilarities (edges) need to be joined within a
    group, at each merge step. In single link, the graph analogy is expressed as only
    a single edge need be considered. Wards clustering merges groups based on minimizing
    the squared error between candidate groups, and thereby considers the minimum
    variance as the merging criterion instead of the proximity values directly.


