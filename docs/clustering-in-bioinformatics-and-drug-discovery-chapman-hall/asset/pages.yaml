    a smaller set of features, or a smaller linear combination of the features. These
    can be used to explore the data as a set of projections, or even to use the small
    or transformed set of features for clustering. The latter has the caveat that
    such linear selection or transformations may not be optimal for the natural grouping
    of the data.


