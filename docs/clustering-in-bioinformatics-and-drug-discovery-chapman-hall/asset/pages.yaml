    # **2.6.1.4 The Binary Euclidean Measure**


    The Euclidean distance in Equation 2.1 can be made into a convenient dissimilarity
    measure by the following:


    $$d = \sqrt{\frac{\sum_{i=1}^{N}(A_i-B_i)^2}{N}},$$ (2.9)


    where $A$ and $B$ binary bit strings have been substituted for the vectors, $x$,
    and $y$ respectively, and $i$ refers to the $i$th bit, and $N$ is the length of
