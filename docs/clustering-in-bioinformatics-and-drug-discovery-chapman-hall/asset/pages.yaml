  md: "# 5.2 Taylor-Butina Algorithm\n\nExclusion region algorithms are similar to\
    \ leader algorithms but require that all pair-wise dissimilarities have been computed\
    \ in order to generate a near-neighbor table at the specified threshold. Taylor\
    \ and Butina arrived at a similar algorithm separately [132, 22]. Their method\
    \ is on the surface extremely simple. A near neighbor table at a threshold is\
    \ a sparse matrix with N number of rows. The entry rows are data items that have\
    \ no nearer neighbors and are thus singleton clusters. These can be removed first.\
    \ Successively, all the row with the most neighbors is considered a cluster and\
    \ it is removed, and all of its members are removed if they are in any other row\
    \ of the matrix. This process is repeated with the newly formed sparse matrix.\
    \ Each new cluster is smaller for each new iteration. The iterations stop when\
    \ the matrix contains all empty near neighbor tables. However, this leaves out\
    \ what are known as false singletons: data items that are within a threshold of\
    \ some other cluster members, but not a cluster member themselves. The false singletons\
    \ can be assigned to the clusters with the nearest neighbor cluster members.\n\
    \n```\nAlgorithm 5.2 TaylorButina(SparseMatrix, Threshold)\n1: CollectSingletons(SparseMatrix)\
    \ // Remove singletons.\n2: repeat\n3:   C ← FindLargestSetNN(SparseMatrix) //\
    \ Assign largest row in\n     matrix to cluster\n4:   SparseMatrix ← SparseMatrix\
    \ \\\\ C // Remove row and its elements\n     from the matrix\n5: Append(C, G)\
    \ // Append cluster C to set of clusters G\n6: until SparseMatrix == NULL\n7:\
    \ G ← AssignFalseSingletons(G) // Assign false singletons to clusters with\n \
    \    nearest neighbors\n8: Output G\n```\n\nFigure 5.2 provides a 2D visualization\
