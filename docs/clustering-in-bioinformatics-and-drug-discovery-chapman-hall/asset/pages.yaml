    \ Norah E. MacCuish.  \n p. ; cm. — (Chapman & Hall/CRC mathematical and computational\
    \ biology series)  \nIncludes bibliographical references and index.  \nSummary:\
    \ \"This book presents an introduction to cluster analysis and algorithms in the\
    \ context of drug discovery clustering applications. It provides the key to understanding\
    \ applications in clustering large combinatorial libraries (in the millions of\
    \ compounds) for compound acquisition. HTS results, 3D lead hopping, gene expression\
    \ for toxicity studies, and protein reaction data. Bringing together common and\
    \ emerging methods, the text covers topics peculiar to drug discovery data, such\
    \ as asymmetric measures and asymmetric clustering algorithms as well as clustering\
    \ ambiguity and its relation to fuzzy clustering and overlapping clustering algorithms.\"\
    —Provided by publisher.\n\nISBN 978-1-4398-1678-3 (hardcover : alk. paper)  \n\
