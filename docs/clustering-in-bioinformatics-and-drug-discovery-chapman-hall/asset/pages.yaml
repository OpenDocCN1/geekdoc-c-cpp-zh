  md: 'The exclusion region tie can cause a significant amount of ambiguity within
    the clustering results if the exclusion regions overlap. An overlapping exclusion
    region tie is shown schematically in two dimensions in Figure 9.9. The arbitrary
    choice of either region as the cluster to remove from the data set will almost
    surely impact the subsequent partitioning of the data. If this choice is based
    on the input order of the data items, stability of input order is lost. Since
    the decision is based on the largest integral value of neighbors, even if the
    proximity measure is continuous there is a significant chance for the occasional
    exclusion region tie among data items whose similarity is of a continuous nature.
    One of the drawbacks of this algorithm is that at completion there may be remaining
    data items with empty nearest neighbor tables. These we call false singletons
    in that they do have neighbors within the threshold, but these neighbors have
    been rounded up by other clusters. This problem can be addressed with the following
    option: 6. assign remaining false singletons to the cluster that contains their
    nearest neighbor within the threshold value. This modification however also introduces
    the possibility of ties in nearest neighbors in different exclusion regions for
    false singletons. In Figure 9.10, a two-dimensional schemata depicts the condition
    of a false singleton tie between two exclusion regions, where the centroid is
    denoted by a small circle in the center of the larger exclusion region circles,
    and the remaining data items are shown as stars. The false singleton clearly lies
    within the threshold proximity of members from each exclusion region and in this
    case equidistant in proximity. An apparent true singleton is also shown as lying
    outside any possible threshold region. Other simple modifications can be made
    to this algorithm that changes somewhat the nature of the ambiguity:


    +   1. Use another criterion to break exclusion region ties. Such criteria may
    in turn have ties.

    +   2. Use asymmetric measures which may change the number of ties.

    +   3. Use the various decision ties in all of the above mentioned steps to create
    overlapping clusters rather than clusters formed by a disjoint partition of the
    data.


    A simple and fast criterion for breaking exclusion ties is to sum the minimum
    proximity between the centroid and the other data items within the exclusion region.
    This sum is compared with the sums obtained from the other tied exclusion regions.
    Though rare for exclusion regions containing any sizeable number of data items,
    this measure too may be tied and an arbitrary decision must be made to select
    the exclusion region.


