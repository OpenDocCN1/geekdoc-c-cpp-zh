- pgno: 3
  md: "# Aims and scope:\n\nThis series aims to capture new developments and summarize\
    \ what is known over the entire spectrum of mathematical and computational biology\
    \ and medicine. It seeks to encourage the integration of mathematical, statistical,\
    \ and computational methods into biology by publishing a broad range of textbooks,\
    \ reference works, and handbooks. The titles included in the series are meant\
    \ to appeal to students, researchers, and professionals in the mathematical, statistical\
    \ and computational sciences, fundamental biology and bioengineering, as well\
    \ as interdisciplinary researchers involved in the field. The inclusion of concrete\
    \ examples and applications, and programming techniques and examples, is highly\
    \ encouraged.\n\n# Series Editors\n\nN. F. Britton  \n*Department of Mathematical\
    \ Sciences*  \n*University of Bath*\n\nXiaohong Lin  \n*Department of Biostatistics*\
    \  \n*Harvard University*\n\nHershel M. Safer\n\nMaria Victoria Schneider  \n\
    *European Bioinformatics Institute*\n\nMona Singh  \n*Department of Computer Science*\
    \  \n*Princeton University*\n\nAnna Tramontano  \n*Department of Biochemical Sciences*\
    \  \n*University of Rome La Sapienza*\n\nProposals for the series should be submitted\
    \ to one of the series editors above or directly to:  \nCRC Press, Taylor & Francis\
    \ Group  \n4th, Floor, Albert House  \n1-4 Singer Street  \nLondon EC2A 4BQ  \n\
    UK"
  merge: -1
  img_proc: true
