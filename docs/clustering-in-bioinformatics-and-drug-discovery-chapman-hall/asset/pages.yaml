    Broadly, cluster analysis of these data falls into three types: clustering of
    the gene expression data across experiments (sometimes referred to as samples;
    e.g., expression in response to various forms of cancer), clustering experiments
    across the expression data; and what is termed bi-clustering, finding distinct
    or overlapping sub-matrices of interest at some quantitative threshold within
    the expression-experiment matrix. There are numerous reasons to cluster the expression
    data: generating hypotheses about groups of co-regulating genes and groups that
    could possibly identify functional categories; genes that express in a common
    temporal class; and possibly determine process artifacts and error in the arrays.
    Clustering of the columns of experiments are often used to generate hypotheses
    about cell types or cancer classes. The motivation for bi-clustering takes into
    account that a subset of genes and a subset of experiments (e.g., cellular processes)
    are of interest. Finding possibly overlapping block matrices is a hard problem,
    considering that it depends upon permutations of both the rows and columns of
    the matrix to align the sub-blocks of interest. Thus, there are a number of heuristics
    employed to find solutions that are hoped to be near optimal. Figure 1.7 shows
    a made up example of biclustered groups, colored and hatched to denote overlapping
