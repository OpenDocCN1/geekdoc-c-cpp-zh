  md: "# ### 3.4 Sampling\n\nVery large sets of data tax computational resources.\
    \ Thus, methods have been developed that, rather than inspect all of the data\
    \ pairwise relationships necessarily, the methods instead sample pairwise relationships\
    \ and form partitions of the entire set based on the sampling. This form of clustering\
    \ is akin to Monte Carlo integration, where the notions of pseudo and quasi-random\
    \ sampling come into play. It is also based on a simple fact that if data item\
    \ A is very dissimilar to data item B, and data item C is very close to data item\
    \ B, then it can be inferred that the data item A is also very dissimilar to data\
    \ item C. If the dissimilarity relationships between A and B, and B and C have\
    \ been computed, then there may be no need to compute the dissimilarity between\
    \ A and C. Choose a random data item and determine all of the dissimilarity values\
    \ of the remaining data items to it. Include those items that are within some\
    \ near neighbor threshold value, let that be a cluster, and then exclude them\
    \ from further consideration. Repeat this with the remaining data items, forming\
    \ all of the subsequent clusters similarly. Since we have excluded the items of\
    \ the first cluster without determining their dissimilarity to any of the other\
    \ items, but for the random one chosen, there are $k \\times (N - k - 1)$ dissimilarities\
    \ that need not be computed, where $k$ is the number of items in the exclusion\
    \ region minus the random one chosen. For each iteration, the size of the cluster\
    \ membership will likely vary, but in principle the number of dissimilarities\
    \ computed is only $O(G \\times N)$, where $G$ is the number of clusters, and\
    \ not the $O(N^2)$ computation for generating all pairwise dissimilarities.\n\n\
    ```\nAlgorithm 3.4 SimpleLeader(Data, Threshold)\n1: DataElement ← SampleRandom(Data)\
    \ //Arbitrarily choose a data ele-\n   ment from the data\n2: Data ← Data \\ DataElement\
    \ //Remove DataElement from Data\n3: Append(DataElement, C) //Append the DataElement\
    \ to first cluster, C\n4: repeat\n5:    C ← Append(FindNN(Data, Threshold, DataElement),\
    \ C) //Ap-\n      pend NNs to cluster, C\n6:    Append(C, G) //Append cluster\
    \ C to set of clusters G\n7:    Data ← Data \\ C //Remove cluster elements from\
    \ data\n8:    DataElement ← SampleRandom(Data) //Arbitrarily choose a data\n \
    \     element from the data\n9: until |Data| == 0\n10: Output : G\n```\n\nIn another\
    \ form of cluster sampling the entire pairwise dissimilarities are computed, but\
    \ only a small fraction of the values are stored and operated on by another clustering\
    \ sampling algorithm. Namely, if there is a dissimilarity threshold, where we\
    \ know that we are not concerned with groupings outside"
  merge: -1
  img_proc: true
- pgno: 113
  md: 'that dissimilarity threshold, we can choose not to store those values nor operate
    on them during the clustering. Though all pairwise dissimilarities have been computed,
    the clustering sampling algorithm will likely proceed much faster given a much
    smaller set of dissimilarity values to operate on. One peculiarity of the exclusion
    region algorithms is that they tend to produce a great many singletons (clusters
    with only one member each). The singletons are of two types given this algorithm:
    Singletons that are not near any other data element given the threshold, and singletons
    that are within the threshold of some neighbor or neighbors, but have been left
    out of any exclusion region. These *false singletons* can be gathered up and distributed
    to an exclusion region cluster where they have a nearest neighbor within the threshold.


    # **Algorithm 3.5** *ExclusionRegion(SparseMatrix)*


    ```

    1: repeat

    2:   C ← FindLargestSetNN(SparseMatrix) // Assign largest row in matrix to cluster,
    C

    3:   SparseMatrix ← SparseMatrix \ C // Remove row and its elements from the matrix

    4:   Append(C, G) // Append cluster C to set of clusters G

    5: until SparseMatrix == NULL

    6: Output : G

    ```


    # 3.5 Overlapping


    There are many cases where groups or classes are confounded in that they overlap,
    given the measure or space that the data represents. Consider Figure 3.9. Assume
    that the data in this scatter plot represents the true four classes shown in terms
    of their point marker. These classes overlap, the boundaries shown with the convex
    hull about each class, yet our disjoint algorithms will partition these into four
    groups, ignoring the overlapping of the classes. If the disjoint constraint is
    allowed to lapse somewhat, we may be able to get overlapping clusters that better
    define the classes in terms of the data features and measures that describe the
    data in this overlapping fashion.


    In some cases, experts in the field in question may prefer overlapping clusters
    from disjoint ones, where there is either ambiguity as to membership of some data
    items, or some data items could easily have several class memberships. Consider
    for example how it is sometimes uncertain what group an organism belongs to in
    a taxonomy. Rather than force a class decision, it may be of more use to represent
    the uncertainty in having the organism belong to more than one group. There are
    clustering algorithms that return results that do just that. In many cases, an
    algorithm that returns disjoint clusters can be modified to return overlapping
    clusters.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'The generic exclusion region Algorithm 3.5 can be modified to produce overlapping
    clusters given false singletons, under the assumption that it is possible for
    false singletons to have nearest neighbors in more than one exclusion region.
    One could argue that it would be better to distribute the false singletons to
    that exclusion region with its nearest neighbor. This would indeed produce disjoint
    regions. However, with discrete measures, there can be ties in nearest neighbor
    values. This ambiguity can be used to produce overlapping clusters. Figure 3.10
    displays the fraction of a dataset involved in overlaps versus the Tanimoto threshold
    applied. A comparison of three different fingerprints is made with the shortest
    key based fingerprint revealing the largest portion of the data set participating
    in overlapping groups.


    ```

    Algorithm 3.6 ExclusionRegionOverlapping(SparseMatrix)

    1: repeat

    2:     TiedRows ← FindLargestSetsNN(SparseMatrix) //Find largest row(s)

    3:     i = 1

    4:     repeat

    5:         C ← AssignClusters(TiedRows[i]) //Assign rows to cluster non-disjoint
    clusters

    6:         Append(C, G) //Append cluster C to set of clusters G

    7:         i = i + 1

    8:     until i == |TiedRows| //Repeat until largest tied rows processed

    9:     SparseMatrix ← SparseMatrix \ TiedRows //Remove row and its elements from
    the matrix

    10: until SparseMatrix == NULL

    11: F ← FindFalseSingletons(SingletonClusters(G))

    12: G'' ← DistributeFalseSingletons(F, G) //Distribute false singletons to any
    cluster with a NN

    13: Output : G''

    ```


    Since overlapping clusters are a cover rather than a partition, any significant
    overlapping can be explosive combinatorially. If the groups are well-separated
    at the scale of the threshold, there will be very little ambiguity, and in practice
    in this instance most of the overlapping concerns a few false singletons, and
    perhaps a few overlapping groups of the same size.


    # 3.6 Fuzzy


    Fuzzy clustering is related to the principle of overlapping clusters, but unlike
    the simple overlapping clustering expressed in the last section, data elements
    have a degree of membership across those clusters that might contain them. It
    is sometimes useful to regard the degree of membership as a'
  merge: -1
