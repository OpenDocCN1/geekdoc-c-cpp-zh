  md: "probability, but it need not be considered in those terms necessarily. Somewhat\
    \ analogous to K-means, fuzzy clustering attempts to iteratively refine the degree\
    \ or probability of membership to those groups that are most alike under some\
    \ criterion. Thus, for example, at the end of the number of iterations, many data\
    \ elements have very little or no degree of membership for most clusters, and\
    \ only for a few clusters are their respective degrees of membership significant,\
    \ or even exclusive to a single cluster. Data items can be assigned disjoint clusters\
    \ given their respective highest final membership coefficient, or the coefficients\
    \ can be used to assign membership to more than one cluster to form a cover rather\
    \ than a partition.\n\n```\n    Algorithm 3.7 Fuzzy(Data,K,Threshold)\n    1:\
    \ U ← FEmptyLists(K)\n    2: M' ← AssignMembership(Data,K) //Assign memberships\n\
    \    3: repeat\n    4:   M ← M'\n    5:   U ← FindCenters(Data,M,K) //Find the\
    \ cluster centroids\n    6:   M' ← ComputeMembership(Data,U) //Compute memberships\
    \ to current cluster\n    7: until MembershipDifference(M,M') < Threshold\n  \
    \  8: G ← AssignGroups(M) //From final membership, M, assign groups to G\n   \
    \ 9: Output: G, M\n```\n\nFuzzy clustering typically has a learning parameter\
    \ that is somewhat arbitrary across a certain range, and even updated and changed\
    \ over the span of the iterations. Tuning parameters such as these are also found\
    \ in the following section. Self-Organizing clustering methods. They bring to\
    \ these methods an amorphous almost artful feel in determining what initial and\
    \ subsequent values to input to arrive at useful clusterings. These methods can\
    \ converge fairly quickly and arrive at reasonable solutions efficiently, but\
    \ they are not typically fast enough for very large scale clustering.\n\n# ###\
    \ 3.7 Self-Organizing\n\nSelf-Organizing clustering algorithms use either a preset\
    \ number of clusters or nodes, or generate clusters (not necessarily predefined)\
    \ where the clusters are adapted from the data. The main distinction of SO algorithms\
    \ is this adjustment of many (possibly all) of the cluster nodes or a neighborhood\
    \ of them to the data items individually, rather than calculating the centroids\
    \ simply as a response to near neighbors as in K-means [158].\n\nThe most popular\
