    # 9.6.3  *K-Means*


    *K-means* clustering [43, 100] is a common clustering algorithm used in many fields
    to cluster relatively large data sets. It is more likely to be used with continuous
    data, but binary string data are sometimes employed. To use K-means with fingerprints,
    the 0, 1 bits are converted to continuous valued 0.0, and 1.0 respectively, and
    treated as separate variables. The algorithm steps are as follows:


    +   - Choose k seed centroids from data set (e.g., quasi-randomly via van der
    Corput sequence)

    +   - Find nearest neighbors to each of the centroids forming nearest neighbor
    group

    +   - Recompute new centroids from nearest neighbor lists of old centroids.

    +   - Repeat 2 until no neighbors change groups or some iterative threshold.


