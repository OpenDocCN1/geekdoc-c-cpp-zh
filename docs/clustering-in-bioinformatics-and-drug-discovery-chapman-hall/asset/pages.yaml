  md: '# # Chapter 2


    # ## Data


    Data in bioinformatics and drug discovery are manifold. The data are often empirically
    collected and input into a computer either by hand or automatically; or data can
    be derived from known properties and thus generated on the computer. These data
    are then typically placed in a database or flat file for analysis. Of course,
    within any given data set there may be error, missing data, erroneous elements,
    mixed types, or a mixture of empirical and derived elements. As a result, data
    quality analysis and expert knowledge about the data are almost always necessary
    to go forward with meaningful exploratory data analysis. Having a thorough understanding
    of the data, its generation, its scale, its range, its anomalies and outliers,
    goes a long way in determining the type of clustering algorithms to apply, and
    how to evaluate and validate the results. How the data are represented internally
    within a computer is also important: the precision, memory usage, and disk space
    used to represent the data can impact the choice and effectiveness of the cluster
    analysis performed.


    In order to input data into a clustering algorithm, additional processing is often
    required. The data may need to be scaled, normalized, or otherwise transformed.
    A measure of proximity between data elements will then need to be chosen. Depending
    on the clustering method, the data matrix (sometimes called the *pattern matrix*)
    or some form of a proximity matrix can then be used as input. In turn, there are
    a number of different ways to consider a proximity matrix, either for matrix manipulation
    through matrix algebra, or as combinatorial graph objects. Each also has ramifications
    for how one may visualize and interpret clustering results, or design, or intuitively
    understand clustering algorithms.


    # ### 2.1 Types


    There are four basic data types: binary, ordinal (count data), continuous (ratio
    data), and categorical data. These are not hard and fast types in that they can
    be converted from one to the other, and for any particular data set, there may
    be several different types that make up the dimension of the data. Thus, for example,
    a set of small drug and drug-like molecules may have binary data that represents
    the chemical graph structural properties of each'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'molecule, a collection of calculated properties such as the molecule’s molecular
    weight, the number of rotatable bonds, a measure of lipophilicity, and so forth.
    The binary data are typically a fixed length string of 1s and 0s, whereas the
    number of rotatable bonds is in the set of whole numbers (that has an effective
    range of between 0 and, say, 30). The molecular weight and measure of lipophilicity
    are continuous valued data, but the precision of these values make them effectively
    transformable to, though large, a nevertheless finite set of whole numbers. Regardless
    of continuous valued nature of the numbers, some form of computer (or machine)
    precision, or arbitrary precision set by a programmer, defines these values in
    a finite scale. As long as the scale is large, the discrete nature of the computer
    representation behaves very much like continuous values. The set of molecules
    may also have categorical data, say, that each compound has a unique identifier
    assigned by a company or chemical vendor, for example. This data may be important
    in some applications, but is quite distinct from numerical data, as it has no
    ordering, nor any measure of similarity absent some other property.


    For an application, it may be that just one or a few of these types are pertinent
    to the clustering application at hand. For example, one may want to group the
    compounds on their chemical graph structural properties alone, or on their calculated
    properties alone, etc. It is often convenient if the data are all of the same
    type. This helps to narrow the choice of similarity measure to those common to
    that type. In such cases, transforming to the most common type is often the typical,
    though not necessarily best, solution. Again, this can be very data and application
    dependent.


    # 2.1.1 Binary Data


    Binary data are common in drug discovery and a bit less so in bioinformatics.
    How a medicinal chemist can input a known compound into a computer is a question
    of encoding. Once a set of compounds are encoded into a machine readable form,
    a way of searching that set and operating on that set is within the domain of
    chemical information systems.


    In the mid 1950s the Wiswesser Line Notation (WLN) was introduced and enjoyed
    widespread use as a common chemical encoding. 152. In the 1980s one of the most
    commonly used encodings still in use today is what is known as SMILES [145], an
    ASCII string containing an extended alphabet and a grammar that operates on that
    alphabet to define a chemical graph encoding. A SMILES encoding of benzene is
    simply *c1ccccc1*. A caffeine SMILES string is *c1c2nc(n(c(nc(=O)C)=O)C)nc2C*.
    These strings are not necessarily unique, but given a set of rules, SMILES strings
    can be canonicalized, such that they can be made unique [146]. The OpenBabel canonicalizing
    program outputs the following SMILES string for caffeine, *Cn1c nc2c1c(=O)n(c(=O)n2C*.
    The order of the atoms has changed but the chemical graph is the same [3]. A more
    recently adopted encoding is what is known as the International Chemical Identifier
    (InChI™) string. InChI strings were created to provide an'
