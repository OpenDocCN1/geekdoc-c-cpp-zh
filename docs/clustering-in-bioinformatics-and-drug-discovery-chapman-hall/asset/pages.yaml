    formed by pseudo random points and exclusion region rejection

    +   - **similarity threshold:** a level that is set above which two objects being
    compared are considered similar

    +   - **sparse matrix:** a thresholded matrix

    +   - **true singleton:** outside any exclusion region or cluster member by the
    threshold dissimilarity'
