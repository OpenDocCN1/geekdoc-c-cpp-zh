  md: 'If in Equation 10.1, $d(i, \bar{m})$ is a normalized measure ([0,1]), then
    the resulting $I_{C_k}$ is also normalized.


    $$I_{C_k} = \frac{1}{n_k} \sum_{i \in C_k} d(i, \bar{m}), \tag{10.1}$$


    where $i$ is a cluster member in $C_k$. Note that cluster members $i$ and $j$,
    though distinct cluster members in $C_k$, may be identical in the feature space
    (e.g., remember that two distinct compounds may have the same fingerprint). As
    long as they are distinct members in the cluster, their respective (dis)similarity
    is considered in the sum. Another measure averages the all-pairs (dis)similarities
    between the members of cluster $C_k$, where $n$ is the total number of cluster
    members in $C_k$.


    $$I_{C_k} = \binom{n_k}{2}^{-1} \sum_{i \neq j \in C_k} d(i,j) \tag{10.2}$$


    Both of these measures are impacted by whether the clustering algorithm used to
    produce the clusters has a penchant for chaining (e.g., single link clustering)
    or, at the other end of the scale, compactness (e.g., an exclusion region algorithm).
    Which homogeneity measure is used may depend on both the type of clustering algorithm
    and of course the application data and the clustering goal. The measure in Equation
    10.1 is just $O(n)$ to compute, whereas Equation 10.2 is $O(n^2)$, but nevertheless
    not particularly prohibitive. Other more complex measures can be computed, such
    as squaring $d()$ and taking the square root of the resulting $I_C$, to take into
    account a more refined understanding of the impact of outliers in the clustering—computational
    resources notwithstanding. The overall homogeneity for a clustering can then be
    computed as the sum and average of one of the desired equations above. Given Equation
    10.1, the overall homogeneity is:


    $$I_C = \frac{1}{N} \sum n_k I_{C_k} \tag{10.3}$$


    # ### 10.1.2 External Cluster Measures


    Separation measures are analogous to homogeneity measures. The separation measure
    in Equation 10.4 is simply the (dis)similarity measure between pairs of clusters’
    centroids.


    $$E_{C_p,C_q} = d(\bar{m}_{C_p}, \bar{m}_{C_q}). \tag{10.4}$$


    Or, as in Equation 10.2, the pair-wise (dis)similarities are summed between the
    clusters’ members


    $$E_{C_p,C_q} = (n_p n_q)^{-1} \sum_{i \in C_p, j \in C_q} d(i,j). \tag{10.5}$$'
