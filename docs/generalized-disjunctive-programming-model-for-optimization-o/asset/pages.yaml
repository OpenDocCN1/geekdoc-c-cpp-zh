    used, RED would make up –40% of the desalination plant’s energy demand in almost
    all locations. However, energy losses and untreated brine discharge remain challenges.
    Our results show that there is a gap to bridge between the thermodynamics and
    the initial RED energy system processes. Several variables affect the RED process,
    adding complexity to define optimal system designs by trial and error evaluations.
    We propose an optimization model formulated as a Generalized Disjunctive Programming
    (GDP) problem to define the optimal RED process for different deployments.


    Even past research has validated RED-based electricity from waste streams desalinations
