    # 2. Objective function: Levelized Cost of Energy (LCOE)


    The objective of the problem is to minimize the LCOE of the RED process. LCOE
    (USD/kWh), a common metric to benchmark renewable power technologies, estimates
    the average cost per unit of energy generated over the lifetime of a power plant.
    The LCOE considers operating costs (OPEX in USD/year), and capital costs (CAPEX
    in USD) averaged over the expected lifetime of the plant, in years, using the
    discount rate $r$, that therefore define the total annual cost of the RED system.


    Assuming the energy produced is constant during the lifetime of the project, the
    annual energy yield (kWh) of the RED plant operating at capacity, 8760 hours per
    year, with a load factor, of 90% (i.e., runs 8000 hours per year). The summation
    of the net power output over the candidate unit yields the nominal capacity of
    the RED system (16), the total power output TNP, in kW.


    ```

    LCOE = \frac{CAPEX + OPEX}{r}

    CRF = \frac{r}{1-(1 + r)^{-LT}}

    TNP = \frac{NP}{YEARU}

    ```


    To estimate the investment, we determine the cost of RED units, pumps, and civil
    infrastructure cost.


    ```

    CAPEX = CAPEX_{stack} + CAPEX_{pump} + CAPEX_{civil}

    ```


    ```

    OPEX = OPEX_{pump} + OPEX_{rem} + 0.2 \times CAPEX

    ```


    Whenever needed, all costs are converted to USD_{2010} according to historical
    exchange rate of the corresponding publication year.


    # 2.8 Solution strategy


    For the solution of the non-convex GDP problem, we use the logic-based solver
    Gdp built on Pyomo, an open source ecosystem for GDP modeling and development,
    built on top of the Pyomo algebraic modeling language (Chen, Johnson, et al.,
    2021).


    We apply the Logic-based Outer Approximation (GLAOAM) (Lee and Grossmann, 2021;
    2018) to solve the GDP problem. This strategy decomposes the GDP into reduced
    NLP subproblems and master MILP, to avoid "non-flow" issues arising in nonlinear
    design problems when units or streams disappear.


    The GAMS/COMPLEX MILP solver and GAMS/MSNLP(IPOPT) NLP solver were used through
    Pyomo-GAMS interface using GAMS 34.1.


    # 3. CASE STUDY: ENERGY RECOVERY FROM DESALINATION CONCENT


    We consider a case study of the retrofit of medium-large capacity seawater osmosis
    (SWRO) desalination plants worldwide with a RED-based recovery system. The RED
    unit retrieves electricity from desalination concentrate effluent mixed with different
    alternative low-salinity sources (e.g., WWTP, effluent, seawater water). Data
    on concentration, temperature, and volumetric flow rate of the high- and low-feed
    streams were from (Tristan, Marcos Fallanza, et al., 2020).


    The study restricts to one parallel branch setting the flow rate and the outlet
    stream of the RED unit is fed to the input of pump equal to the operating conditions
    of the 1st RED unit in two scenarios for hydraulic arrangement:


    (b) GDP layer, leaving the interconnection between the parallel branches and the
    inlet leaves the surface area as a discrete function.


    The upper limit of parallel branches was considered that the RED system treats
    desalination''s concentrate effluent in full, ensuring no shortage of low-salinity
    feed stream. The net power output of the RED system scales with the number of
    parallel branches.


    The method refers to a chemical RED unit with an assigned number of cell pairs
    of industrial-scale stacks. Data on RED stack''s processes and specifications
    can be found in (Tristan, Marcos Fallanza, et al., 2020).


    # 4. RESULTS AND DISCUSSION


    The optimization model provides an optimized RED''s flowchart design in all scenarios
