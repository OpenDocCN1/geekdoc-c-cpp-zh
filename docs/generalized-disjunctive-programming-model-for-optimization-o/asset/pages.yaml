    # 2.3 Flow and mass balance formulation


    We formulated flow and mass balance equations considering total flows (volumetric
    flow rate; $q$ in $m^3/h$) and species concentration functions of sodium chloride,
    $C$ in high- and low-quality streams.


    The mixer applies to the inlet ports of the discharge units, the units unit, and
    the active RED units (i.e., when $Y_i = True$). Mixing equations are nonlinear
    and nonconvex due to bilinear terms from the product of volumetric flow times
    concentration, which challenges finding a global optimum.


    The splinter applies to the outlet ports of the feed units, the sources unit,
    and the active RED units (i.e., when $Y_i = True$). Splitting equations are linear
    and convex.


    # 2.4 Bounds on variables


    Each RED unit has limits on the flow, according to the maximum flow-velocity across
    the length of the RED stack as per the manufacturer''s specifications. The lower
    bound on velocity and flow in the low salinity cells is a designer''s choice.


    The upper bound on concentration species can be as high as the maximum concentration
    of the feed streams, in (if there are multiple feed alternates), while for the
    dilute streams, the concentration can be as high as the concentration reached
    after the complete mixing of the concentrate and dilute streams reached thermodynamic
    equilibrium. The opposite holds for the lower bound on the concentration of the
    concentrate and dilute streams.


    # 2.5 RED stack model formulation


    We used a simplified version of the RED rigorous model from our research (Tristán,
    M. Fallanza, A., et al., 2020), to find a middle-ground between model fidelity
    and tractability.


    The semi-rigorous model is a system of differential and algebraic equations defining
    RED''s performance from cell to module. A cell pair is a repeating unit in series
    to form the RED, assembled by cation- and anion-exchange membrane (CEM and AEM,
    respectively) with two adjacent spacer-fitted compartments that contain the concentrate
    and dilute water streams.


    The cell pair describes the main transport mechanisms, mass balance, distributed
    pressure, energy yield, and electric variables; i.e., the potential and internal
    resistance, within a cell pair.


    At RED stack scale, the model computes the overall values (electric potential,
    current, internal resistance, pressure) of the whole set of cell pairs each distributed
    in the flow direction (taking the integral over the length, m). The model also
    computes the net and power output (deducting the power consumption from the group
    power output) to define performance based on power density, energy yield, and
    efficiency of each stack. The RED model computes the net power output of the stack.


    The reader is referred to (Tristán, M. Fallanza, et al., 2020) for more details
    on the RED model.


    As nonlinear solvers are unable to handle the backward finite difference method
    and the trapezoid rule to reformulate first-order ordinary differential equations,
    and integrate them into algebraic equations,


    # 2.6 Assumptions


    We assumed:


    +   (a) The feed streams are pure sodium chloride, ideal aqueous solutions (i.e.,
    activity coefficients to 1), neglecting the non-idealities of solution and existence
    of other species that would limit the RED performance.


    +   (b) There is no non-ionic contribution in the internal losses attributed to
    concentration polarization in the cell and dilute membrane-solution interfaces
    and owing to concentration dependent decline in the main flow. We only consider
    contribution due to solutions'' ionic conductivity and membranes ionic resistance.


    +   (c) There is no water transport to osmosis from the low-saline to high-saline
    one streams.


    +   (d) Dilativities in the membrane phase are constant independent of the concentration
    and temperature.


    +   (e) All cell pairs behave equally, as we assumed no fluid leakage or short
    circuits in the RED stack''s manifolds.


    +   (f) Co-flow of the high- and low-concentration streams.'
