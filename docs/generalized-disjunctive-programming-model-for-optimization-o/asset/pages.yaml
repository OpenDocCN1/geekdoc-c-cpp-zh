    # ## 1. INTRODUCTION


    The progressive shift from conventional emissions to decentralized renewable power
    sources with reduced water needs will be decisive in a sustainable water and energy
    supply. Reverse electrolysis (RED), an electrochemical technology that uses ion-selective
    membranes to generate electricity from chemical energy released when two solutions
    mixes, i.e., salinity gradient energy (SGE), has the potential of being a clean
    and stable renewable resource to power the sector from the embedded energy of
    water.


