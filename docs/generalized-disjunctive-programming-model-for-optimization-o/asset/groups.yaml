    ## 1. 引言


    从传统排放向需水量更低的去中心化再生能源逐步转变，将对可持续的水和能源供应具有决定性意义。反电解（RED）是一种电化学技术，利用离子选择膜从两种溶液混合时释放的化学能中发电，即盐度梯度能量（SGE），具有成为清洁且稳定的再生资源的潜力，通过水的嵌入能为该部门提供动力。


    基于全球的 RED 能量回收系统应用于中大型海水淡化厂中（参考 Tristán, Marcus Fallanzana, 等人）。如果利用了所有的 SGE，RED
    将占据几乎所有地点海水淡化厂能量需求的的 40%。然而，能量损耗和未经处理的盐水排放仍然是挑战。我们的结果表明，热力学与初始 RED 能量系统过程之间存在需要弥合的差距。多个变量影响
