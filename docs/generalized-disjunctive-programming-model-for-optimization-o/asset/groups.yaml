    ## 2.6 Assumptions


    We assumed:


    - (a) The feed streams are pure sodium chloride, ideal aqueous solutions (i.e.,
    activity coefficients to 1), neglecting the non-idealities of solution and existence
    of other species that would limit the RED performance.

    - (b) There is no non-ionic contribution in the internal losses attributed to
    concentration polarization in the cell and dilute membrane-solution interfaces
    and owing to concentration dependent decline in the main flow. We only consider
    contribution due to solutions'' ionic conductivity and membranes ionic resistance.

    - (c) There is no water transport to osmosis from the low-saline to high-saline
    one streams.

    - (d) Dilativities in the membrane phase are constant independent of the concentration
    and temperature.

    - (e) All cell pairs behave equally, as we assumed no fluid leakage or short circuits
    in the RED stack''s manifolds.

    - (f) Co-flow of the high- streams.

    - (g) The RED systems operate under isothermal and adiabatic conditions.


    ## 2.7 Objective function: Levelized Cost of Energy (LCOE)


    The objective of the problem is to minimize the LCOE (USD/kWh), a common metric
    to benchmark technologies, estimates the average cost per unit of energy generated.
    Assuming the energy produced is constant during the lifetime of the plant, using
    the discount rate $r$, that therefore define the total power output TNP, in kW.


    $$LCOE = \frac{CAPEX + OPEX}{r}$$

    $$CRF = \frac{r}{(1 + r)^{-LT}}$$

    $$TNP = \frac{NP}{YEARU}$$


    To estimate the investment, we determine the cost of RED units, pumps, and civil
    infrastructure.


    $$CAPEX = CAPEX_{stack} + CAPEX_{pump} + CAPEX_{civil}$$

    $$OPEX = OPEX_{pump} + OPEX_{rem} + 0.2 \times CAPEX$$


    Whenever needed, all costs are converted to USD_{2010} according to historical
    exchange rate of the corresponding year.


    ## 2.8 Solution strategy


    For the solution of the non-convex GDP, we use the logic-based solver Gdp built
    on Pyomo, an open source ecosystem for GDP modeling and development, built on
    top of the Pyomo algebraic language (Chen, Johnson, et al., 2021).


    We apply the Logic-based Outer Approximation (Lee and Grossmann, 2021) to solve
    the GDP problem. This strategy decomposes the GDP into reduced NLP subproblems
    and master MILP, to avoid "non-flow" issues arising in nonlinear design when units
    or streams disappear.


    The GAMS/COMPLEX MILP solver and GAMS/MSNLP(IPOPT) NLP solver were used through
    Pyomo-GAMS interface.


