    **Abstract:** Reverse electrolysis (RED), an emerging electrochemical technology
    that uses ion-selective membranes to generate electricity from salinity differences
    between solutions, i.e., salinity gradient energy (SGE), has the potential to
    be a clean and stable renewable resource to scale water and energy supply. Although
    RED has made notable advances, full-scale RED process demands more economic and
    environmental assessments that consider full design and operational decision space
    from model-to-system. This work presents an optimization model formulated as a
    Generalized Disjunctive Programming to define the RED process for different deployments.
    We use a predictive model of the RED stack and validated in our research to fully
    capture the behavior of the system. The problem addressed is to determine the
    RED plant’s topology and the working conditions for a given design of each RED
    stack which renders the optimal-cost for the defined problem and scenario. Our
    results show, with simulation-based approaches, mathematical programming techniques
    are an efficient approach to provide reliable results and support for early-scale
    RED implementation in real scenarios.


