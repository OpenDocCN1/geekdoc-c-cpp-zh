    # REFERENCES


    The GDP option model reflects a floatsheet design (Fig. 2) that reduces the LCOE
    by 9% and increases the net output of the RED system, which in turn could reduce
    around 16% of the desalination plant''s specific energy consumption by the local
    grid if scale two orders of magnitude down the current cost of membranes.


