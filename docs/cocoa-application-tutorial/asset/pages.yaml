- pgno: 16
  md: 'Figure 2-3      The new Currency Converter project in Xcode


    ![](img/52b51a77032f3549c0adc4a141b59201_16_0.png)


    # # The Xcode Project Interface


    The Groups & Files list allows you to easily navigate through your project’s files
    and traits. All the source files, images, and other resources that make up a project
    are grouped in the project group, the first item in the Groups & Files list; this
    group is named after the project (here, Currency Converter). The project’s files
    are grouped into subgroups, such as Classes, Other Sources, Resources, and so
    on, as shown in Figure 2-3. Groups are very flexible because they do not necessarily
    reflect either the on-disk layout of files in the project or the way the build
    system handles those files. Groups are purely for organizing your project. The
    groups created by Xcode should be suitable for most developers, but you can customize
    them however you like.


    These are the groups Xcode sets up for Cocoa applications:


    +   - **Classes.** This group holds all the classes required by your application.

    +   - **Other Sources.** This group contains the `main.m` file, which defines
    the `main` function that runs the application. (You shouldn’t have to modify this
    file.) It also contains `Currency_Converter_Prefix.pch`. This “prefix header”
    helps Xcode reduce compilation time. You don’t need to worry about this file.

    +   - **Resources.** This group contains the nib files and other resources that
    specify the application’s user interface.

    +   - **Frameworks.** This group contains the frameworks (which are similar to
    libraries) that the application uses.

    +   - **Products.** This group contains the results of project builds and is automatically
    populated with references to the products created by each target in the project.'
  merge: -1
  img_proc: true
- pgno: 17
  md: "Below the project group are other groups, including smart groups. **Smart groups**—identified\
    \ by the purple folders on the left side of the list—allow you to access the project’s\
    \ files using custom rules in a way similar to using smart playlists in iTunes.\n\
    \nThese are some of the other groups in the Groups & Files list:\n\n+   - **Targets.**\
    \ This group lists the end results of your builds. This group usually contains\
    \ one target, such as an application or a framework, but it can consist of multiple\
    \ items.\n+   - **Executables.** This group contains the executable products your\
    \ project creates.\n+   - **Errors and Warnings.** This group displays the errors\
    \ and warnings encountered in your project when you perform a build.\n\nCurious\
    \ folks might want to look in the project directory in Finder to see the files\
    \ it contains. Among the project files are:\n\n+   - `Currency Converter.xcodeproj`\
    \  \n+     This package contains information that defines the project. You should\
    \ not modify it directly. You can open your project by double-clicking this package.\n\
    +   - `main.m`  \n+     An Objective-C file, generated for each project, that\
    \ contains the `main` function of the application.\n+   - `English.lproj`  \n\
    +     A directory containing resources localized to the English language. In this\
    \ directory are nib files automatically created for the project. You may find\
    \ other localized resource directories, such as `Dutch.lproj`.\n\n# What’s Next?\n\
    \nIn this chapter, you made an Xcode project that will contain all the resource\
    \ files for a Cocoa application. In the next chapter, you will learn how to create\
    \ the model, the basic functionality behind an application."
  merge: -1
