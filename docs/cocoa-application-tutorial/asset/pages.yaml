- pgno: 54
  md: "# # Configuring Your Application\n\nNow that you have your very own functional\
    \ application, it’s time to give it individual properties instead of the default\
    \ properties. In this chapter, you learn about the `Info.plist` file, which is\
    \ where you can change properties that govern your application’s attributes. This\
    \ chapter also describes the essential identification properties required for\
    \ Mac OS X applications. It walks you through the process of configuring these\
    \ properties in Currency Converter. You learn what changing these various properties\
    \ does when viewing information about the application. Finally, you learn how\
    \ to give an application its own icon so it is set apart from other applications.\n\
    \n# ## The Info.plist File\n\nMac OS X applications contain information to help\
    \ distinguish them from one another. This information includes the application’s\
    \ primary and secondary version numbers, and the icon that the Finder and the\
    \ Dock use to represent it. The file that stores these details is known as the\
    \ information property list file (named `Info.plist`). This property list file\
    \ is stored with the executable files and resources that make up an application,\
    \ known as an application bundle.\n\n> > **Note:** A **bundle** is a directory\
    \ that groups files in a structured hierarchy. To make it easy for users to manipulate\
    \ bundles, bundles can be represented as files instead of folders in the Finder;\
    \ these bundles are known as **packages**. An **application bundle** stores the\
    \ executable files and resources that make up an application. Although it’s more\
    \ correct to refer to application bundles as *application packages* because they’re\
    \ always shown to users as single files in the Finder, this chapter adopts the\
    \ term application bundle instead of application package. For more information\
    \ on bundles and packages, see *Bundle Programming Guide*.\n\n# ## Basic Project\
    \ Attributes\n\nThere are several essential properties that identify applications\
    \ to users and to Mac OS X: application identifier, build version number, release\
    \ version number, copyright notice, application name, and application-icon filename.\n\
    \n+   - Without application identifiers, administrators would have to navigate\
    \ to the location of each managed application, a relatively tedious task. The\
    \ **application-identifier** property specifies a string that Mac OS X uses to\
    \ identify an application. This property does not identify a specific application\
    \ bundle in the filesystem or a particular version of the application. In normal\
    \ conditions, users don’t see application identifiers.\n+   \n+     The application-identifier\
    \ property is specified with the `CFBundleIdentifier` key in the `Info.plist`\
    \ file."
  merge: -1
  img_proc: true
- pgno: 55
  md: 'Application identifiers are uniform type identifiers (UTIs) or reverse Domain
    Name System (DNS) names; that is, the top-level domain comes first, then the subdomains,
    separated by periods ( . ). There are two parts to an application identifier:
    the *prefix* and the *base*. The **application-identifier prefix** identifies
    the company or organization responsible for the application and is made up of
    two or more domains. The first prefix domain, or top-level domain, is normally
    `com` or `org`. The second domain is the name of the company or organization.
    Subsequent domains can be used as necessary to provide a narrower scope. Prefix
    domains use lowercase letters by convention. For example, Apple applications use
    application identifiers that start with `com.apple`.


    The **application-identifier base** comprises a single domain, which refers to
    the application proper. This domain should use word capitalization, for example,
    *AddressBook*. See *Uniform Type Identifiers Overview* for more information about
    uniform type identifiers.


    Mac OS X uses application identifiers to precisely refer to application bundles
    irrespective of their location on the filesystem. For example, some Mac OS X features,
    such as parental controls, use only application identifiers to refer to applications
    on a user’s computer. The Parental Controls preferences pane contains a list of
    application filenames, in which administrators select the applications for which
    a user is to have managed access, as shown in Figure 7-1.


    **Figure 7-1** Benefits of using application identifiers


    ![](img/52b51a77032f3549c0adc4a141b59201_55_0.png)'
  merge: -1
  img_proc: true
- pgno: 56
  md: '+   - The **build-version-number** property identifies an iteration of the
    application.


    The build-version-number property is specified with the CFBundleVersion key in
    the Info.plist file.


    The build version number is made up of a string of period-separated integers.
    Each integer must be equal to or greater than zero. For example, 55, 1.2, and
    1.2.0.55, are all valid build version numbers.


    Mac OS X uses the build version number to, for example, decide which version of
    an application to launch to open a file when there are multiple versions in the
    filesystem (as determined by their application identifiers). In such cases, Mac
    OS X launches the application bundle with the highest build version number. To
    ensure the accurate operation of this mechanism, you must adhere to one version-numbering
    style as you release new versions of your application. That is, if you publish
    your application for the first time using a multi-integer build version number,
    subsequent publicly available versions must use the same number of integers in
    their build version numbers.


    > > **Note:** The application''s build version number does not appear in Finder
    windows.


    +   - The **release-version-number** property specifies the version information
    the Finder displays for the application. When you specify both a build version
    number and a release version number, the About window displays the release version
    number, followed by the build version number in parenthesis, as shown in Figure
    7-2.


    Figure 7-2    Build and release version numbers in Finder preview panes and About
    windows


    ![](img/52b51a77032f3549c0adc4a141b59201_56_0.png)'
  merge: -1
  img_proc: true
- pgno: 57
  md: "The release-version-number property is specified with the `CFBundleShortVersionString`\
    \ key in the `Info.plist` file.\n\nThe release version number identifies a released\
    \ iteration of the application. Similar to the build version number, the release\
    \ version number is made up of a string of period-separated integers. However,\
    \ you should specify no more than three integers for the release version number.\
    \ By convention, the first integer represents major revisions to the application,\
    \ such as revisions that implement new features or major changes. The second integer\
    \ denotes revisions that implement less prominent features. The third integer\
    \ represents maintenance releases.\n\n+   - The **copyright-text property** specifies\
    \ the copyright notice for the application, for example, `© 2007, My Company.`\
    \ This notice is shown to users in the About window of the application.\n+   \n\
    +     The copyright-notice property is specified with the `NSHumanReadableCopyright`\
    \ key in the `Info.plist` file.\n+   \n+   - The **application-name property**\
    \ specifies the title of the application menu in the menu bar when the application\
    \ opens and the name of the application in its About window.\n+   \n+     The\
    \ application-name property is specified with the `CFBundleName` key in the `Info.plist`\
    \ file.\n+   \n+     > **Note:** Xcode sets the application name to the project\
    \ name when you create a new application project.\n+   \n+   - The **application-icon-filename\
    \ property** specifies the icon the Finder, the Dock, and the application’s About\
    \ window display for the application.\n+   \n+     The application-icon-filename\
    \ property is specified with the `CFBundleIconFile` key in the `Info.plist` file.\n\
    +   \n+     An icon file contains one or more images that depict an application’s\
    \ icon at various resolutions. These separate versions of an icon allow the Finder\
    \ and the Dock to render icons as sharp as possible at different sizes. You create\
    \ icon files using the Icon Composer application.\n\nFor further details on these\
    \ and other application properties, see *Runtime Configuration Guidelines*.\n\n\
    # # Specify the Identifier, Version, and Copyright Information\n\nThis section\
    \ shows how to specify Currency Converter’s identifier, release version number,\
    \ and copyright text.\n\n> > **Important:** To complete this task, you need to\
    \ open this document’s companion archive, `ObjCTutorial_companion.zip`.\n\nCurrency\
    \ Converter’s name property is set to the project name you entered in “Creating\
    \ a Project in Xcode” (page 15), `Currency Converter`. Therefore, you don’t need\
    \ to change the value of this property.\n\nFirst, remove the `InfoPlist.strings`\
    \ file from the project. This file is used for internationalization, a subject\
    \ outside the scope of this tutorial."
  merge: -1
  img_proc: true
