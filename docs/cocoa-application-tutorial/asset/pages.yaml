- pgno: 18
  md: '# # Defining the Model


    Model objects contain special knowledge and expertise. They hold data and define
    the logic that manipulates that data. For example, a customer object, common in
    business applications, is a model object. In Currency Converter, the model class
    you’re going to create is the converter class. In the MVC design pattern, instances
    of a model class do not communicate directly with the user interface.


    In this chapter, you will create the model for your application. First, you will
    learn how to create a new class in Xcode. Then, you will define the interface
    for your model before implementing it. Finally, you will implement the entire
    functionality of the class. In the process, you will learn some of the syntax
    of Objective-C, including how to declare variables and methods. You will also
    be introduced to the concept of declared properties—a feature in Objective-C 2.0
    that makes writing accessor methods incredibly quick and simple.


    # ## Specify the Model Class


    +   1. Select the Classes group in the Groups & Files list.

    +   2. Choose File > New File.

    +   3. Select Objective-C class in the Cocoa Class group. Leave it as a subclass
    of NSObject, and click Next.


    ![](img/52b51a77032f3549c0adc4a141b59201_18_0.png)'
  merge: -1
  img_proc: true
