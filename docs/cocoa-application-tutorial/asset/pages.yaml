- pgno: 39
  md: '> > **Note:** `IBOutlet` is a null-defined macro that the C preprocessor removes
    at compile time. Interface Builder uses it to identify outlet declarations so
    that it can display them when connecting outlets visually.


    Objects with `id` as their type are dynamically typed, meaning the class of the
    object is determined at runtime. You can use `id` as the type for any object.
    The dynamically typed object’s class can be changed as needed, even during runtime,
    which should invoke a sense of both excitement and extreme caution in even the
    most organized OO veteran. This can be a tremendous feature and allows for very
    efficient use of memory, but casting a type to an object that cannot respond to
    the messages for that type can introduce puzzling and difficult-to-debug problems
    into your application.


    When you don’t need a dynamically typed object, you can—and should, in most cases—statically
    type it as a pointer to an object of a specific class:


    ```

    IBOutlet NSButton* myButton;

    ```


    You usually set an outlet’s target in Interface Builder by drawing connection
    lines between objects. There are ways other than outlets to reference objects
    in an application, but outlets and the ability of Interface Builder to initialize
    them are a great convenience.


    At application load time, the instance variables that represent outlets are initialized
    to point to the corresponding target. For example, the parameter of the controller
    instance that receives the value from the exchange rate in the view would be initialized
    with a reference to the Exchange Rate text field object (see “Connect the ConverterController
    Instance to the Text Fields” (page 45) for details). When an outlet is not connected,
    the value of the corresponding instance variable is `nil`.


    It might help to understand connections by imagining an electrical outlet plugged
    into the destination object. Also picture an electrical cord extending from the
    outlet in the source object. Before the connection is made, the cord is not plugged
    in, and the value of the outlet is `nil`; after the connection is made (the cord
    is plugged in), a reference to the destination object is assigned to the source
    object’s outlet.


    # Target/Action in Interface Builder


    You can view (and complete) target/action connections in the Connections pane
    in the Interface Builder inspector. This pane is easy to use, but the relation
    of target and action in it might not be apparent. First, a target is an outlet
    of a cell object that identifies the recipient of an action message. Well, you
    may say, what’s a cell object and what does it have to do with a button?


    One or more cell objects are always associated with a control object (that is,
    an object inheriting from `NSControl`, such as a button). Control objects “drive”
    the invocation of action methods, but they get the target and action from a cell.
    `NSActionCell` defines the target and action outlets, and most kinds of cells
    in the Application Kit inherit these outlets.


    For example, when a user clicks the Convert button in the Currency Converter window,
    the button gets the required information from its cell and invokes the `convert`
    method on the target outlet object, which is an instance of the custom class `ConverterController`.
    Figure 5-2 shows the interactions between the `ConverterController` class, the
    Convert button, and the Amount in Other Currency: field.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# **Figure 5-2**  Relationships in the target-action paradigm


    ![](img/52b51a77032f3549c0adc4a141b59201_40_0.png)


    In the Actions column (in the Connections pane of the inspector), all action methods
    are defined by the class of the target object and known by Interface Builder.
    Interface Builder identifies action methods because their names follow this syntax:


    ```

    `- (IBAction)myAction:(id)sender;`

    ```


    > **Note:** `IBAction`, like `IBOutlet`, is a null defined macro, that the C preprocessor
    removes at compile time. Interface Builder uses it to identify action declarations
    so it can display them when connecting actions visually.


    # Which Direction to Connect?


    Usually the outlets and actions you connect belong to a custom subclass of `NSObject`.
    For these occasions, you need only to follow a simple rule to know which way to
    specify a connection in Interface Builder. Create the connection from the object
    that sends the message to the object that receives the message:


    +   - To make an action connection, create the connection from an element in the
    user interface, such as a button or a text field, to the custom object you want
    to send the message to.

    +   - To make an outlet connection, create the connection from the custom object
    to another object (another custom object or a user interface element) in the application.


    These are only rules of thumb for common cases and do not apply in all circumstances.
    For instance, many Cocoa objects have a `delegate` outlet. To connect these, you
    draw a connection line from the Cocoa object to your custom object.


    Another way to clarify connections is to consider who needs to find whom. With
    outlets, the object with the outlet needs to find some other object, so the connection
    is from the object with the outlet to the other object. With actions, the control
    object needs to find the target, so the connection is from the control object
    to the custom object.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# # Defining the Controller Class


    Interface Builder is a versatile tool for application developers. It enables you
    to not only compose the application’s graphical user interface, it gives you a
    way to define much of the programmatic interface of the application’s classes
    and to connect the objects eventually created from those classes.


    The rest of the chapter shows how to define the `ConverterController` class and
    connect it to Currency Converter’s user interface.


    +   1. Select the Classes group in your project’s Groups and Files list.

    +   2. Choose File > New File.

    +   3. Choose Objective-C Class and click Next.

    +   4. Name the file `ConverterController.m`.

    +   5. Make sure “Also create ‘ConverterController.h’” is selected and click Finish.


    # # Defining the Outlets for the ConverterController Class


    The `ConverterController` object needs to communicate with the user interface
    elements in the Currency Converter window. It must also communicate with an instance
    of the `Converter` class, defined in “Defining the Model” (page 19). The `Converter`
    class implements the conversion computation.


    +   1. Open the ConverterController.h file for editing, if it’s not already open.

    +   2. Add the following lines between the brackets in the ConverterController
    interface file:


    ```

    IBOutlet NSTextField *amountField;

    IBOutlet NSTextField *dollarField;

    IBOutlet NSTextField *rateField;

    ```


    These lines declare three outlets, one for each of the three text fields in your
    interface. Notice that the three text field outlets are of type `NSTextField`.
    Because Objective-C is a dynamically typed language, it’s fine to define all the
    outlets as type `id`. However, it’s a good idea to get into the habit of setting
    the types for outlets since statically typed instance variables receive much better
    compile-time error checking.


    # # Declare the Controller Method


    The `ConverterController` class needs one action method, `convert:`. When the
    user clicks the Convert button, the `convert:` message is sent to the target object,
    an instance of the `ConverterController` class. The `ConverterController` class
    must implement `convert:` so something will happen when a converter controller
    object receives the `convert:` message.


    +   1. Add the declaration line for the convert: method to the interface file,
    as shown:'
  merge: -1
  img_proc: true
- pgno: 42
  md: "```\n```objc\n#import <Cocoa/Cocoa.h>\n\n@interface ConverterController : NSObject\
    \ {\n    IBOutlet NSTextField *amountField;\n    IBOutlet NSTextField *dollarField;\n\
    \    IBOutlet NSTextField *rateField;\n}\n- (IBAction)convert:(id)sender;\n@end\n\
    ```\n```\n\n+   2. Save the file.\n\nYou might be asking yourself why the calculations\
    \ aren’t done here in the controller. It would obviously be faster without the\
    \ extra layer of communication. It is entirely possible to design an application\
    \ this way, but the MVC design pattern was created to enable portability and maintainability.\
    \ In more complex applications, the underlying functionality may be operating\
    \ system-dependent. If you make the controller have a method `convert:`, all the\
    \ view needs to know is to call this method. From there, the various controllers\
    \ written for the different operating systems can take care of calling the correct\
    \ model functions. In this way, it’s similar to writing an API for this particular\
    \ application. Similarly, by factoring out the functionality into clearly distinct\
    \ pieces, it’s easy to remember what objects are responsible for what functionality.\n\
    \n# Interconnecting the Controller with the View\n\nYou’re now ready to connect\
