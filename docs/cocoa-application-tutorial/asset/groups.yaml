    \n没有标签的文本字段会让人困惑，因此请使用资源库中现成的标签对象为它们添加标签。\n\n- 1. 从 Cocoa 资源库中将“标签”元素拖到窗口上。\n\n\
    \  ![](img/52b51a77032f3549c0adc4a141b59201_29_0.png)\n\n- 2. 将标签设置为右对齐：\n\n \
    \ 选中标签元素后，在检查器中“文本字段属性”标签页的“对齐”区域，点击从左数第四个按钮，如图 4-5 所示。\n\n  > **注意：** 要在 Interface\
    \ Builder 中打开检查器，请选择“工具 > 检查器”。\n\n  **图 4-5** 在 Interface Builder 中将文本标签右对齐\n\
    \n  ![](img/52b51a77032f3549c0adc4a141b59201_29_1.png)\n\n- 3. 在“标题”文本字段中输入“每\
    \ 1 美元的汇率：”。\n- 4. 复制该标签两次。将第二个文本标签的标题设置为“要转换的美元金额：”，将第三个标签的标题设置为“其他货币金额：”。\n\
    - 5. 向左扩展标签，使其完整标题可见，如图 4-6 所示。\n\n  **图 4-6** Currency Converter 窗口中的文本字段和标签\n\
    \n  ![](img/52b51a77032f3549c0adc4a141b59201_30_0.png)\n\n### 更改文本字段属性\n\n底部的文本字段显示货币换算计算的结果，因此应具有与其他文本字段不同的属性。用户不能编辑该字段。\n\
    \n- 1. 选中第三个文本字段。\n- 2. 在检查器中，导航到“文本字段属性”标签页。\n- 3. 点击“可编辑”选项以移除勾选标记，这样用户就不能更改文本字段的内容。保留“可选择”选项处于勾选状态，以便用户可以将文本字段的内容复制到其他应用。\n\
