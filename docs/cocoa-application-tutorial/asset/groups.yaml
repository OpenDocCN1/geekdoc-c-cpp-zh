    \ 在资源库顶部的列表中，打开“资源库”，然后打开“Cocoa”，并选择“视图与单元格”。\n- 3. 请注意图 4-3 中的图标带有标签。要显示标签，请从资源库窗口底部的齿轮菜单中选择“视图\
    \ > 图标与标签”。这将使你更容易找到所需的对象。\n- 4. 在 Currency Converter 窗口中放置一个文本字段。\n\n  找到“文本字段”项（在图\
    \ 4-3 中高亮显示），并将“文本字段”对象从资源库拖到窗口的右上角。请注意，当对象被拖到与相邻对象或窗口边缘接近适当距离时，Interface Builder\
    \ 会显示布局参考线，从而帮助你按照 Apple 人机界面指南放置对象。\n\n- 5. 增大文本字段的尺寸，使其宽度增加约三分之一。\n\n  通过抓住控制柄并向希望其增大的方向拖移，来调整文本字段的大小。在本例中，向左拖动左侧控制柄以增大文本字段，如图\
    \ 4-4 所示。\n\n  **图 4-4** 调整文本字段大小\n\n  ![](img/52b51a77032f3549c0adc4a141b59201_28_0.png)\n\
    \n- 6. 再添加两个文本字段，二者都与第一个大小相同。\n\n  有两种选择：你可以从调板中再拖一个文本字段到窗口，并使其与第一个大小相同；也可以复制窗口中已有的文本字段。\n\
    \n  要复制 Currency Converter 窗口中的文本字段：\n\n  - a. 如果文本字段尚未选中，请选中它。\n  - b. 从“编辑”菜单中选择“复制”（Command-D）。新文本字段会出现在与原字段略有偏移的位置。\n\
    \  - c. 将新文本字段放置到第一个文本字段下方。请注意，布局参考线会出现，Interface Builder 会将文本字段吸附到位。\n  - d.\
