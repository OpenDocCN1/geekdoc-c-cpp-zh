  mdcn: "\n\n## 第 4 章——定义视图：构建用户界面\n\n每个应用都有用户界面。如果没有好的程序辅助，设计用户界面可能会是一项枯燥且令人沮丧的任务。Interface\
    \ Builder 是 Xcode 随附的应用，它让设计用户界面变得简单，从而把枯燥的任务变得轻松。\n\n本章将教你 Interface Builder\
    \ 如何与 Cocoa 集成。它会引导你为自己的应用构建用户界面。你将了解在哪里找到所需的工具，以及如何使用 Interface Builder 中的功能，为你的应用创建完美的用户界面。\n\
    \n### 用户界面元素与 Interface Builder\n\nInterface Builder 是一个应用，可帮助你设计用户界面，并连接应用的不同部分。它包含用于\
    \ UI 设计的拖放界面，以及一个检查器，可让你查看和更改设计中各种对象的属性，以及它们之间的连接。\n\n### 什么是 nib 文件？\n\n每个带有图形用户界面的\
    \ Cocoa 应用至少有一个 nib 文件。主 nib 文件会在应用启动时自动加载。它包含菜单栏，通常还至少包含一个窗口以及各种其他对象。一个应用也可以有其他\
    \ nib 文件。每个 nib 文件包含：\n\n- **归档对象。** 也称为“扁平化”或“序列化”对象——意思是对象已经以某种方式编码，以便可以保存到磁盘，并在之后恢复到内存中。归档对象包含诸如大小、位置以及在对象层级中的位置等信息。在归档对象层级的顶部是文件所有者（File’s\
    \ Owner）对象，它是一个代理对象，在运行时会成为拥有该 nib 文件的实际对象（通常是从磁盘加载该 nib 文件的对象）。\n- **图像。** 出现在应用界面中某处的图像文件，例如按钮或图像视图。\n\
    - **类引用。** Interface Builder 可以存储 Cocoa 对象以及你放入静态调板中的对象的详细信息，但它不知道如何归档自定义类的实例，因为它无法访问这些类的代码。对于这些类，Interface\
    \ Builder 会存储一个代理对象，并将你的自定义类信息附加到该代理对象上。\n- **连接信息。** 关于类层级中的对象如何相互连接的信息。当你保存文稿时，nib\
    \ 中对象之间的连接信息会与对象本身一起归档。\n\n**图 4-1** 手动调整窗口大小\n\n![](img/52b51a77032f3549c0adc4a141b59201_25_0.png)\n\
    \n你可以使用窗口大小检查器更精确地调整窗口大小。\n\n- 1. 通过点击窗口的标题栏，或在 MainMenu.xib 窗口中选择其图标，来选中该窗口。\n\
    - 2. 选择“工具 > 检查器”。\n- 3. 点击看起来像黄色标尺的“大小”图标。\n- 4. 在“内容大小与位置”组中，你可以设置窗口的宽度、高度以及默认的\
    \ x 和 y 坐标。\n- 5. 使用宽度和高度字段输入宽度 400 和高度 200，如图 4-2 所示。\n\n  **图 4-2** 使用检查器调整窗口大小\n\
    \n  ![](img/52b51a77032f3549c0adc4a141b59201_26_0.png)\n\n- 6. 在“初始位置”中，你会看到窗口和屏幕的图形表示。将窗口拖到方框的左上角，以获得传统的默认窗口位置。\n\
    \n### 更改窗口标题\n\n窗口的默认标题是 Currency Converter，也就是你的项目名称。如果愿意，你可以在检查器的“属性”标签页中更改标题。Currency\
    \ Converter 作为窗口标题很合适，因此保持原样即可。\n\n### 添加文本字段\n\nInterface Builder 的资源库窗口包含用户界面元素，你可以将这些元素拖到窗口或菜单中，以创建应用的用户界面。\n\
    \n- 1. 如果资源库尚未打开（如图 4-3 所示），请选择“工具 > 资源库”。\n\n  **图 4-3** Interface Builder 资源库窗口中的\
