    \ to alter the contents of the text field. Leave the Selectable option checked\
    \ so users can copy the contents of the text field to other applications.\n\n\
    ### Configure a Button\n\nProviding a button to convert the currency amount creates\
    \ a clear action for the user to take. To add a button to the Currency Converter\
    \ window:\n\n- 1. Drag the Push Button object from the library to the bottom-right\
    \ corner of the window.\n- 2. Double-click the button and change its title to\
    \ Convert.\n- 3. In the Key Equiv. section of the Button Attributes inspector,\
    \ click the gray box. Now press Return. A return symbol should appear in the gray\
