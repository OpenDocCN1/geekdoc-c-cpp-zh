    \n    **图7-7** 选择要添加到Currency Converter项目的图标文件\n\n    ![](img/52b51a77032f3549c0adc4a141b59201_63_0.png)\n\
    \n- 4. 在接下来出现的对话框（如图7-8所示）中，点按“添加”。\n\n    **图7-8** 指定项目文件添加选项\n\n    ![](img/52b51a77032f3549c0adc4a141b59201_63_1.png)\n\
    \n- 5. 最后，在目标属性的“图标文件”（Icon File）字段中指定图标文件的名称。\n\n要在项目中查看图标：\n\n- 1. 如果尚未退出Currency\
