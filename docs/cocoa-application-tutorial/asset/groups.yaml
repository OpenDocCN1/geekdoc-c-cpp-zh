    ### 测试界面


    Interface Builder 让你无需编写代码即可测试应用程序的用户界面。要测试 Currency Converter 用户界面：


    1. 选择 File > Save 保存工作。

    2. 选择 File > Simulate Interface。

    3. 尝试各种用户操作，例如按 Tab 切换，以及在文本栏之间剪切和粘贴。

    4. 完成后，从应用程序菜单中选择 Quit Cocoa Simulator 退出测试模式。


    ### 接下来做什么？


    在本章中，你构建了应用程序的用户界面。你放置并组织了用户在使用应用程序时将与之交互的各种对象，并对它们进行了配置，使它们能够正确交互。下一章将指导你创建一个控制器，将你刚刚创建的视图与上一章实现的模型连接起来。


    ### Interface Builder 中的 Target/Action


    > **注意：** `IBOutlet` 是一个空定义宏，C 预处理器会在编译时将其移除。Interface Builder 使用它来标识出口声明，以便在可视化连接出口时显示这些声明。


    以 `id` 为类型的对象是动态类型的，这意味着对象的类在运行时确定。你可以将 `id` 用作任何对象的类型。动态类型对象的类可以按需更改，甚至在运行时也可以更改；即便对于最有经验的面向对象老手，这也应唤起一种既兴奋又极度谨慎的感觉。这可能是一个强大的特性，并允许非常高效地使用内存，但将类型强制转换为一个无法响应该类型消息的对象，可能会在应用程序中引入令人困惑且难以调试的问题。


    当你不需要动态类型对象时，可以——而且在大多数情况下应该——将其静态类型化为指向特定类对象的指针：


    ```

    IBOutlet NSButton* myButton;

    ```


    你通常通过在 Interface Builder 中在对象之间绘制连接线来设置出口的目标。除了出口之外，还有其他方式可以在应用程序中引用对象，但出口以及 Interface
    Builder 初始化它们的能力带来了极大的便利。


    在应用程序加载时，表示出口的实例变量会被初始化，以指向相应的目标。例如，控制器实例中接收视图中汇率值的参数，将用对 Exchange Rate 文本栏对象的引用进行初始化（详情参见“Connect
    the ConverterController Instance to the Text Fields”（第 45 页））。当出口未连接时，相应实例变量的值为
    `nil`。


    通过想象一个插入目标对象的电源插座，可能有助于理解连接。再想象一根电源线从源对象中的出口延伸出来。在建立连接之前，电源线未插入，出口的值为 `nil`；建立连接后（电源线插入），目标对象的引用会被赋给源对象的出口。


    例如，当用户单击 Currency Converter 窗口中的 Convert 按钮时，按钮从其单元格获取所需信息，并在目标出口对象上调用 `convert`
    方法，该对象是自定义类 `ConverterController` 的实例。图 5-2 展示了 `ConverterController` 类、Convert
    按钮和 Amount in Other Currency 栏之间的交互。


