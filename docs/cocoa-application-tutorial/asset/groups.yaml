  - "[PAGE 20]\n\nObjective-C 2.0 provides a feature called **declared properties**.\
    \ A property declaration is, effectively, a shorthand for declaring the setter\
    \ and getter for an attribute of an instance of a class. In addition to the declaration\
    \ itself, there are directives to instruct the compiler to synthesize the accessors\
    \ and to inform the compiler that you will provide the methods yourself at runtime.\
    \ There are two parts to a property, its declaration and its implementation.\n\
    \nYou declare a property as follows:\n\n```\n~~~\n@property(attributes) Type variableNameList;\n\
    ~~~\n```\n\nwhere *attributes* is a comma-separated list of keywords such as *readwrite*\
    \ and *copy*, for example:\n\n```\n~~~\n@property(copy) NSString *name;\n~~~\n\
    ```\n\nYour converter class wants to provide access to its data to external objects,\
    \ so you need to declare accessor methods.\n\n+   1. Place your insertion point\
    \ after the closing brace of the instance method declarations in `Converter.h`,\
    \ just before the `@end` directive.\n+   2. Add the following property declaration\
    \ for your two instance variables.\n+   \n+      `@property(readwrite) float sourceCurrencyAmount,\
    \ rate;`\n\nAt compile time, the compiler treats this as if you had declared the\
    \ following methods:\n\n```\n~~~\n- (float)sourceCurrencyAmount;\n- (void)setSourceCurrencyAmount:(float)newSourceCurrencyAmount;\n\
    - (float)rate;\n- (void)setRate:(float)newRate;\n~~~\n```\n\nThe property declaration\
    \ simply declares what the accessor methods will look like. In the next section,\
    \ you will provide an implementation for the accessor methods.\n\n# ## Declare\
    \ the Model Method: convertCurrency\n\nThe one method the model requires is a\
    \ simple function to multiply the two values encapsulated by the converter class.\n\
    \nAdd the following line as the next line of code in `Converter.h`:\n\n```\n~~~\n\
    - (float)convertCurrency;\n~~~\n```\n\nAlthough this method takes no arguments,\
    \ it nonetheless provides the result of multiplying the source currency amount\
    \ with the conversion rate. This is possible because instance methods have access\
    \ to the instance variables of their object. At runtime, the instance method treats\
    \ all instance variables as if they were local variables. It is common practice\
    \ to use accessor methods even when the variable is in scope. This practice makes\
    \ it clear that the code is accessing an instance variable, rather than a local\
    \ variable."
