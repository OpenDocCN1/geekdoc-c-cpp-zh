    \ the `convert:` method to the interface file, as shown:\n\n```objc\n#import <Cocoa/Cocoa.h>\n\
    \n@interface ConverterController : NSObject {\n    IBOutlet NSTextField *amountField;\n\
    \    IBOutlet NSTextField *dollarField;\n    IBOutlet NSTextField *rateField;\n\
    }\n- (IBAction)convert:(id)sender;\n@end\n```\n\n- 2. Save the file.\n\nYou might\
    \ be asking yourself why the calculations aren’t done here in the controller.\
    \ It would obviously be faster without the extra layer of communication. It is\
    \ entirely possible to design an application this way, but the MVC design pattern\
    \ was created to enable portability and maintainability. In more complex applications,\
    \ the underlying functionality may be operating system-dependent. If you make\
    \ the controller have a method `convert:`, all the view needs to know is to call\
    \ this method. From there, the various controllers written for the different operating\
    \ systems can take care of calling the correct model functions. In this way, it’s\
    \ similar to writing an API for this particular application. Similarly, by factoring\
    \ out the functionality into clearly distinct pieces, it’s easy to remember what\
    \ objects are responsible for what functionality.\n\n## Interconnecting the Controller\
    \ with the View\n\nYou’re now ready to connect the Currency Converter user interface\
    \ and the `ConverterController` object to each other.\n\n### Add the ConverterController\
    \ Class to Your Nib File\n\nAs the final step of defining a class in Interface\
    \ Builder, you create an instance of the `ConverterController` class and connect\
    \ its outlets and actions. Add this class to your nib file.\n\n- 1. In Interface\
    \ Builder, choose File > Read Class Files.\n- 2. Select the `ConverterController.h`\
    \ file and click Open.\n- 3. In the library, drag an object item into the `MainMenu.xib`\
    \ window.\n- 4. Select the new object and navigate to the Identity tab in the\
    \ Inspector.\n- 5. In the Class drop-down box, type `ConverterController` and\
    \ press Return. The class actions and class outlets are filled in to match the\
    \ outlets and actions you defined in the `ConverterController.h` file.\n\n**Figure\
    \ 5-3** A newly instantiated instance of `ConverterController`\n\n![](img/52b51a77032f3549c0adc4a141b59201_43_0.png)\n\
    \nThe result of these operations when the class is viewed in the object inspector\
    \ in Interface Builder is shown in Figure 5-4.\n\n**Figure 5-4** Outlets and actions\
    \ in the Converter Controller Identity inspector\n\n![](img/52b51a77032f3549c0adc4a141b59201_44_0.png)\n\
    \n### Connect the ConverterController Instance to the Text Fields\n\nBy connecting\
    \ the `ConverterController` instance to specific objects in the interface, you\
    \ initialize its outlets. The `ConverterController` object uses these outlets\
    \ to get and set values in the user interface. To connect the instance to the\
    \ user interface:\n\n- 1. Control-drag a connection from the `ConverterController`\
    \ instance to the Exchange Rate text field.\n  - Interface Builder displays the\
    \ possible connections in a black box.\n- 2. Select the outlet that corresponds\
    \ to the first field, `rateField`, as shown in Figure 5-5.\n\n**Figure 5-5** Connecting\
    \ `ConverterController` to the `rateField` outlet\n\n![](img/52b51a77032f3549c0adc4a141b59201_45_0.png)\n\
    \n- 3. Following the same steps, connect the `ConverterController` class’s `dollarField`\
    \ and `amountField` outlets to the appropriate text fields.\n\n### Connect the\
    \ Convert Button to the Appropriate Methods\n\nTo connect the user interface elements\
    \ in the Currency Converter window to the methods of the `ConverterController`\
    \ class:\n\n- 1. Control-drag a connection from the Convert button to the `ConverterController`\
    \ instance in the nib file window.\n- 2. A black box will pop up similar to the\
    \ one we used to connect outlets. Choose `convert:`.\n- 3. Save the nib file.\n\
    \n### Check Your Work\n\nTo make sure everything is done correctly:\n\n- 1. Select\
    \ the Converter Controller instance in the `MainMenu.nib` window.\n"
  mdcn: "\n**图 5-2** target-action 范式中的关系\n\n![](img/52b51a77032f3549c0adc4a141b59201_40_0.png)\n\
    \n在“动作”列（检查器的“连接”窗格）中，所有动作方法都由目标对象的类定义，并且 Interface Builder 知道这些方法。Interface Builder\
    \ 识别动作方法，因为它们的名称遵循以下语法：\n\n```objc\n- (IBAction)myAction:(id)sender;\n```\n\n\
    > **注意：** `IBAction` 与 `IBOutlet` 类似，是一个空定义的宏，C 预处理器会在编译时移除它。Interface Builder\
    \ 利用它来识别动作声明，以便在直观连接动作时显示这些声明。\n\n## 该从哪个方向连接？\n\n通常，你要连接的出口和动作属于 `NSObject` 的自定义子类。在这些情况下，只需遵循一个简单规则，就知道在\
    \ Interface Builder 中应如何指定连接方向。连接应从发送消息的对象指向接收消息的对象：\n\n- 要建立动作连接，请从用户界面中的某个元素（如按钮或文本字段）连接到您想要发送消息的自定义对象。\n\
    - 要建立出口连接，请从自定义对象连接到应用程序中的另一个对象（另一个自定义对象或用户界面元素）。\n\n这些只是常见情况下的经验法则，并非适用于所有情况。例如，许多\
    \ Cocoa 对象都有一个 `delegate` 出口。要连接这些对象，需要从 Cocoa 对象画一条连接线到您的自定义对象。\n\n另一种澄清连接方向的方法是考虑谁需要找到谁。对于出口，拥有出口的对象需要找到另一个对象，因此连接方向是从拥有出口的对象指向另一个对象。对于动作，控件对象需要找到目标，因此连接方向是从控件对象指向自定义对象。\n\
    \n## 定义控制器类\n\nInterface Builder 对应用程序开发者而言是一个多功能的工具。它不仅使您能够构建应用程序的图形用户界面，还让您能够定义应用程序类的大部分程序化接口，并连接最终由这些类创建的对象。\n\
    \n本章的其余部分将展示如何定义 `ConverterController` 类，并将其连接到 Currency Converter 的用户界面。\n\n\
    - 1. 在项目的 Groups and Files 列表中选择 Classes 组。\n- 2. 选择 File > New File。\n- 3. 选择\
    \ Objective-C Class，然后点击 Next。\n- 4. 将文件命名为 `ConverterController.m`。\n- 5. 确保选中\
    \ “Also create ‘ConverterController.h’”，然后点击 Finish。\n\n### 为 ConverterController\
    \ 类定义出口\n\n`ConverterController` 对象需要与 Currency Converter 窗口中的用户界面元素进行通信。它还必须与\
    \ `Converter` 类的一个实例通信，该类的定义参见“定义模型”（第 19 页）。`Converter` 类实现转换计算。\n\n- 1. 打开 `ConverterController.h`\
    \ 文件进行编辑（如果尚未打开）。\n- 2. 在 `ConverterController` 接口文件的括号之间添加以下几行：\n\n```objc\n\
    IBOutlet NSTextField *amountField;\nIBOutlet NSTextField *dollarField;\nIBOutlet\
    \ NSTextField *rateField;\n```\n\n这些代码行声明了三个出口，分别对应界面中的三个文本字段。请注意，这三个文本字段出口的类型为\
    \ `NSTextField`。由于 Objective-C 是一种动态类型语言，将所有这些出口定义为 `id` 类型也是可以的。不过，最好养成设置出口类型的习惯，因为静态类型的实例变量可以获得更好的编译时错误检查。\n\
    \n### 声明控制器方法\n\n`ConverterController` 类需要一个动作方法 `convert:`。当用户点击 Convert 按钮时，`convert:`\
    \ 消息会发送到目标对象，也就是 `ConverterController` 类的一个实例。`ConverterController` 类必须实现 `convert:`，这样当控制器对象收到\
    \ `convert:` 消息时，才会有相应的操作发生。\n\n- 1. 将 `convert:` 方法的声明行添加到接口文件中，如下所示：\n\n```objc\n\
    #import <Cocoa/Cocoa.h>\n\n@interface ConverterController : NSObject {\n    IBOutlet\
    \ NSTextField *amountField;\n    IBOutlet NSTextField *dollarField;\n    IBOutlet\
    \ NSTextField *rateField;\n}\n- (IBAction)convert:(id)sender;\n@end\n```\n\n-\
    \ 2. 保存文件。\n\n您可能会问自己，为什么计算不在控制器中完成。显然，减少一层通信会更快。完全可以用这种方式设计应用程序，但 MVC 设计模式的初衷是为了实现可移植性和可维护性。在更复杂的应用程序中，底层功能可能依赖于操作系统。如果让控制器拥有一个\
    \ `convert:` 方法，视图只需要知道调用这个方法即可。接下来，针对不同操作系统编写的各种控制器可以负责调用正确的模型函数。从这个角度看，这类似于为特定应用程序编写\
    \ API。同样，通过将功能分解为清晰独立的模块，很容易记住哪些对象负责哪些功能。\n\n## 将控制器与视图相互连接\n\n现在，您可以将 Currency\
    \ Converter 用户界面和 `ConverterController` 对象相互连接了。\n\n### 将 ConverterController\
    \ 类添加到 Nib 文件\n\n作为在 Interface Builder 中定义类的最后一步，您需要创建 `ConverterController` 类的一个实例，并连接其出口和动作。将该类添加到您的\
    \ nib 文件中。\n\n- 1. 在 Interface Builder 中，选择 File > Read Class Files。\n- 2. 选择\
    \ `ConverterController.h` 文件，然后点击 Open。\n- 3. 在库中，将一个对象项拖入 `MainMenu.xib` 窗口。\n\
    - 4. 选择新对象，然后在检查器中导航到 Identity 标签页。\n- 5. 在 Class 下拉框中，键入 `ConverterController`，然后按\
    \ Return 键。类动作和类出口会自动填充，与您在 `ConverterController.h` 文件中定义的出口和动作相匹配。\n\n**图 5-3**\
    \ `ConverterController` 的新实例化对象\n\n![](img/52b51a77032f3549c0adc4a141b59201_43_0.png)\n\
    \n在 Interface Builder 的对象检查器中查看该类时，这些操作的结果如图 5-4 所示。\n\n**图 5-4** Converter Controller\
    \ 的 Identity 检查器中的出口和动作\n\n![](img/52b51a77032f3549c0adc4a141b59201_44_0.png)\n\
    \n### 将 ConverterController 实例连接到文本字段\n\n通过将 `ConverterController` 实例连接到界面中的特定对象，您可以初始化其出口。`ConverterController`\
    \ 对象使用这些出口来获取和设置用户界面中的值。要将实例连接到用户界面：\n\n- 1. 按住 Control 键，从 `ConverterController`\
    \ 实例拖一条连接线到 Exchange Rate 文本字段。\n  - Interface Builder 会在一个黑色弹出框中显示可能的连接。\n- 2.\
    \ 选择与第一个字段对应的出口 `rateField`，如图 5-5 所示。\n\n**图 5-5** 将 `ConverterController` 连接到\
    \ `rateField` 出口\n\n![](img/52b51a77032f3549c0adc4a141b59201_45_0.png)\n\n- 3.\
    \ 按照相同步骤，将 `ConverterController` 类的 `dollarField` 和 `amountField` 出口连接到相应的文本字段。\n\
    \n### 将 Convert 按钮连接到相应的方法\n\n要将 Currency Converter 窗口中的用户界面元素连接到 `ConverterController`\
    \ 类的方法：\n\n- 1. 按住 Control 键，从 Convert 按钮拖一条连接线到 nib 文件窗口中的 `ConverterController`\
    \ 实例。\n- 2. 会弹出一个黑色框，与之前连接出口时使用的类似。选择 `convert:`。\n- 3. 保存 nib 文件。\n\n### 检查您的操作\n\
    \n要确保所有操作都正确完成：\n\n- 1. 在 `MainMenu.nib` 窗口中选择 Converter Controller 实例。\n\n"
