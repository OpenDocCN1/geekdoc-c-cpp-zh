  mdcn: "\n## 在 Xcode 中创建项目\n\n每个 Cocoa 应用程序都始于一个项目。**项目**是所有构成应用程序的元素的仓库，例如源代码文件、框架、库、应用程序的用户界面、声音和图像。你使用\
    \ Xcode 应用程序来创建和管理项目。在本章中，你将学习创建一个项目，并了解项目的各个部分分别有什么用途。在此过程中，你将学习如何在 Xcode 用户界面中导航，并了解所有可供你使用的不同文件夹。\n\
    \n### 打开 Xcode\n\n要打开 Xcode：\n\n- 1. 在 Finder 中，前往 `/Developer/Applications`。\n\
    - 2. 双击图标，如图 2-1 所示。\n\n**图 2-1** Xcode 应用程序图标\n\n![](img/52b51a77032f3549c0adc4a141b59201_14_0.png)\n\
    \n首次启动 Xcode 时，它会引导你完成一个快速设置过程。默认设置应适用于大多数用户。\n\n### 新建项目\n\n本节将引导你完成创建项目的过程。虽然本节重点在于创建一个适合\
    \ Currency Converter 的项目，但你将了解在创建新项目时可供你使用的其他选项。\n\n#### 选择新建项目命令\n\n要创建项目，请选择\
    \ File > New Project。此时会出现新建项目助理。\n\n#### 选择项目类型\n\nXcode 可以构建许多不同类型的应用程序，包括从\
    \ Carbon 和 Cocoa 应用程序到 Mac OS X 内核扩展和 Mac OS X 框架的各种应用。本教程使用 Cocoa Application\
    \ 模板。\n\n- 1. 选择 Cocoa Application，然后点击 Choose…，如图 2-2 所示。\n\n**图 2-2** Xcode\
    \ 中的新建项目助理\n\n![](img/52b51a77032f3549c0adc4a141b59201_15_0.png)\n\n- 2. 在存储表单中输入项目名称\
    \ Currency Converter，并选择项目的保存位置。然后点击 Save。\n\nXcode 会创建项目的文件并显示项目窗口，如图 2-3 所示。\n\
    \n**图 2-3** Xcode 中新建的 Currency Converter 项目\n\n![](img/52b51a77032f3549c0adc4a141b59201_16_0.png)\n\
    \n### Xcode 项目界面\n\nGroups & Files 列表让你可以轻松浏览项目的文件和目标。构成项目的所有源文件、图像和其他资源都分组在项目组中，即\
    \ Groups & Files 列表中的第一项；该组以项目命名（此处为 Currency Converter）。项目的文件被分组到子组中，例如类、其他源文件、资源等，如图\
    \ 2-3 所示。组非常灵活，因为它们不一定反映项目中文件在磁盘上的布局，也不一定反映构建系统处理这些文件的方式。组纯粹用于组织项目。Xcode 创建的组应适合大多数开发者，但你可以按自己的喜好自定义它们。\n\
    \n以下是 Xcode 为 Cocoa 应用程序设置的组：\n\n- **类。** 该组包含应用程序所需的所有类。\n- **其他源文件。** 该组包含 `main.m`\
    \ 文件，其中定义了运行应用程序的 `main` 函数。（你不应需要修改此文件。）它还包含 `Currency_Converter_Prefix.pch`。这个“前缀头文件”帮助\
    \ Xcode 减少编译时间。你无需担心此文件。\n- **资源。** 该组包含 nib 文件以及指定应用程序用户界面的其他资源。\n- **框架。** 该组包含应用程序使用的框架（类似于库）。\n\
    - **产品。** 该组包含项目构建的结果，并自动填充对项目中每个目标所创建产品的引用。\n\n项目组下方是其他组，包括智能组。**智能组**——由列表左侧的紫色文件夹标识——允许你使用自定义规则访问项目文件，类似于在\
    \ iTunes 中使用智能播放列表。\n\n以下是 Groups & Files 列表中的其他一些组：\n\n- **目标。** 该组列出构建的最终结果。该组通常包含一个目标，例如应用程序或框架，但也可以由多个项目组成。\n\
    - **可执行文件。** 该组包含项目创建的可执行产品。\n- **错误和警告。** 该组显示执行构建时项目中遇到的错误和警告。\n\n好奇的人可能想在 Finder\
    \ 中查看项目目录，以了解其中包含的文件。项目文件中包括：\n\n- `Currency Converter.xcodeproj`  \n  此包包含定义项目的信息。你不应直接修改它。你可以通过双击此包打开项目。\n\
    - `main.m`  \n  一个为每个项目生成的 Objective-C 文件，包含应用程序的 `main` 函数。\n- `English.lproj`\
    \  \n  一个包含英语本地化资源的目录。此目录中有为项目自动创建的 nib 文件。你可能会找到其他本地化资源目录，例如 `Dutch.lproj`。\n\
    \n### 下一步是什么？\n\n在本章中，你创建了一个 Xcode 项目，它将包含 Cocoa 应用程序的所有资源文件。在下一章中，你将学习如何创建模型，即应用程序背后的基本功能。\n\
    \n## 定义模型\n\n模型对象包含专门的知识和专业技能。它们保存数据并定义操作该数据的逻辑。例如，业务应用程序中常见的客户对象就是一个模型对象。在 Currency\
    \ Converter 中，你将创建的模型类是转换器类。在 MVC 设计模式中，模型类的实例不直接与用户界面通信。\n\n在本章中，你将创建应用程序的模型。首先，你将学习如何在\
    \ Xcode 中创建新类。然后，你将在实现模型之前定义其接口。最后，你将实现该类的全部功能。在此过程中，你将学习 Objective-C 的一些语法，包括如何声明变量和方法。你还将了解声明属性的概念——这是\
    \ Objective-C 2.0 中的一项特性，它使编写访问器方法变得极其快速和简单。\n\n### 指定模型类\n\n- 1. 在 Groups & Files\
    \ 列表中选择 Classes 组。\n- 2. 选择 File > New File。\n- 3. 在 Cocoa Class 组中选择 Objective-C\
    \ 类。将其保留为 NSObject 的子类，然后点击 Next。\n\n![](img/52b51a77032f3549c0adc4a141b59201_18_0.png)\n\
    \nObjective-C 2.0 提供了一项称为**声明的属性**的特性。属性声明实际上是一种简写形式，用于声明类实例某个属性的设置器和获取器。除了声明本身之外，还有一些指令用于指示编译器合成访问器，并告知编译器你将在运行时自行提供这些方法。属性分为两部分：声明和实现。\n\
    \n你按如下方式声明属性：\n\n```\n@property(attributes) Type variableNameList;\n```\n\n其中\
    \ *attributes* 是以逗号分隔的关键字列表，比如 *readwrite* 和 *copy*，例如：\n\n```\n@property(copy)\
    \ NSString *name;\n```\n\n你的转换器类希望向外部对象提供对其数据的访问，因此你需要声明访问器方法。\n\n- 1. 将插入点放在\
    \ `Converter.h` 中实例方法声明的右花括号之后，即 `@end` 指令之前。\n- 2. 为两个实例变量添加以下属性声明。\n\n  `@property(readwrite)\
    \ float sourceCurrencyAmount, rate;`\n\n在编译时，编译器会将其视为你已声明了以下方法：\n\n```objc\n-\
    \ (float)sourceCurrencyAmount;\n- (void)setSourceCurrencyAmount:(float)newSourceCurrencyAmount;\n\
    - (float)rate;\n- (void)setRate:(float)newRate;\n```\n\n属性声明只是声明访问器方法将是什么样子。在下一节中，你将提供访问器方法的实现。\n\
    \n### 声明模型方法：convertCurrency\n\n模型需要的一个方法是一个简单函数，用于将转换器类封装的两个值相乘。\n\n在 `Converter.h`\
    \ 中，将以下行添加为下一行代码：\n\n```objc\n- (float)convertCurrency;\n```\n\n尽管此方法不接受参数，但它仍然提供源货币金额与转换率相乘的结果。这是可行的，因为实例方法可以访问其对象的实例变量。在运行时，实例方法会将所有实例变量视为局部变量。即使变量在作用域内，也通常使用访问器方法。这种做法清楚地表明代码访问的是实例变量，而不是局部变量。\n\
    \n"
