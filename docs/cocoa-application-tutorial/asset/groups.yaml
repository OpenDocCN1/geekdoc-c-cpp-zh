    # # Create an Icon File


    When you create a Cocoa application without specifying an icon for it, the Finder
    and the Dock assign it the generic application icon, as shown in Figure 7-4 (page
    61). To make your applications more appealing to their users and to differentiate
    them from other applications, you should give your applications distinctive icons.
    As a result, your applications stand out from other applications in Finder windows
    and in the Dock. This section describes the process of creating an icon file using
    Icon Composer and configuring Currency Converter to use the icon file. To do this,
    you must have downloaded the companion file provided with this document.'
