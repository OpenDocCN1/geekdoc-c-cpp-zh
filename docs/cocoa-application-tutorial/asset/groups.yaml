    ## 引言


    Cocoa 应用教程简介


    - 面向对象环境中的应用开发流程是怎样的

    - 如何制作一个 Cocoa 应用

    - 接下来如何通过运用所学知识继续深入


    ### 先决条件


    为了充分利用本文档的教学价值，你应该了解 C 语言，但不一定要掌握面向对象编程或应用设计。


    为了帮助你在学习本教程时排查问题，本文档附带了一个已完成的 Currency Converter 项目，作为配套归档文件（`ObjC-Tutorial_companion.zip`）。该归档文件还包含完成本文档中某些操作步骤所需的文件。


    Xcode 开发环境是 Mac OS X 安装介质的一部分，也可以从 [developer.apple.com](http://developer.apple.com)
    下载。在按照本文档中的说明进行操作之前，你必须在计算机上安装 Xcode。


    ### 参见


    以下文档提供了有关 Cocoa 开发的详细信息：


    - *《Cocoa 入门》*提供了学习 Cocoa 的路线图。

    - *《Cocoa 基础指南》*描述了 Cocoa 应用程序环境。

    - *《Objective-C 编程语言》*介绍了 Objective-C，并描述了 Objective-C 运行时系统，该系统是 Cocoa 大部分动态行为和可扩展性的基础。

    - *《Apple 人机界面指南》*解释了如何布局用户界面元素，以提供愉悦的用户体验。


    ## Cocoa 的本质


    本章介绍 Cocoa 中最常用的面向对象设计模式，并展示该范式如何应用于应用程序开发。设计模式是一种设计模板，用于在特定情境中解决普遍且反复出现的问题。如果你以前做过面向对象设计，可能想知道这种模式如何融入
    Cocoa 的世界。本教程将帮助你理解 Cocoa 作为一个面向对象框架的本质。如果你以前只做过过程式编程，也不必担心，本教程同样会讲解面向对象编程的基础知识。你将学习
    MVC 设计模式，这是应用程序开发者非常常用的实践。


    ### 什么是 Cocoa？


    Cocoa 是一个面向对象的工具库，包含为 Mac OS X 开发优秀应用所需的许多对象和方法。通过向程序员提供这些工具，它让编写应用不再单调乏味，同时也使用户界面开发变得简单。如果你曾经尝试过通过编写实际代码来设计用户界面，就会明白这有多难。在本教程中，你将了解只需把对象拖到窗口上就能创建精美用户界面是多么容易。


    如果你希望更详细地了解可以用 Cocoa 做什么，以及它如何融入 Mac OS X，请参阅 *《Cocoa 基础指南》*。


    ### 类和对象


    对象由数据以及操作这些数据的方法组成。对象是类的一个实例，这意味着会为该特定实例分配内存。对象的一个基本特征是封装数据。其他对象或外部代码不能直接访问对象的数据，但可以通过向对象发送消息来请求数据。请再读一遍这句话，因为它道出了面向对象开发的核心。*其他对象或外部代码不能直接访问对象的数据，但可以通过向对象发送消息来请求数据。*你的任务就是让这些对象相互通信，并通过它们的方法共享信息。


    对象会调用与传递给它的消息相对应的方法，并可向发送消息的一方返回数据。对象的方法实际上实现了封装，规范了对对象数据的访问。对象的方法也是对象的接口，阐明了对象与外部世界通信的方式。


    由于对象封装了一组定义好的数据和逻辑，你可以轻松地为其分配程序中的特定职责。从概念上讲，它就像一个功能单元（例如“客户记录”），你可以在设计板上移动它；然后根据其他对象的接口规划与之通信的路径。


    在设计面向对象应用程序时，以图形方式描绘对象之间的关系通常很有帮助。本文档以图形方式描绘对象，如图 1-1 所示。


    **图 1-1** 一个对象


    ![](img/52b51a77032f3549c0adc4a141b59201_11_0.png)


    *有关数据封装、消息、方法以及其他面向对象编程相关内容的更完整描述，请参阅《Objective-C 编程语言》。*


    ### MVC 设计模式


    模型-视图-控制器（MVC）是一种源自 Smalltalk-80 的设计模式。它提出应用程序中的三类对象，按抽象边界分隔，并跨这些边界相互通信，如图 1-2
    所示。这是许多面向对象程序设计背后的设计模式。这种设计模式有助于开发可维护、可扩展且易于理解的系统。


    **图 1-2** 模型-视图-控制器范式中的对象关系


    ![](img/52b51a77032f3549c0adc4a141b59201_11_1.png)


    #### 模型对象


    这类对象代表特定的知识与专业能力。模型对象保存数据，并定义操作这些数据的逻辑。例如，假设你有一个客户对象——商业应用中常见的对象——它保存了客户的所有关键信息，包括姓名、出生日期和电话号码。该对象就属于模型对象，因为它表示你的应用程序要操作的数据，并且可以访问获取和分发这些信息的方法。更专门的模型可以是一个气象系统中名为
    Front 的模型；这种类型的对象将包含表示天气锋面的数据和智能。模型对象不会由应用程序用户直接访问。它们通常可重用、可分发、可持久化，并且可移植到多种平台。


    #### 视图对象


    视图对象表示用户界面上可见的内容（例如窗口或按钮）。视图对象对它显示的数据来源“一无所知”。Application Kit 是组成 Cocoa 的框架之一，通常会提供你所需的所有基本视图对象：窗口、文本字段、滚动视图、按钮、浏览器等。但你可能希望创建自己的视图对象，以新颖的方式显示或表示数据（例如图形视图）。你也可以在窗口内以特定于应用程序的新颖方式组合视图对象。视图对象往往具有很强的可重用性，从而在应用程序之间提供一致性。


    #### 控制器对象


    控制器对象在应用程序中充当模型对象和视图对象之间的中介。控制器对象在模型对象与视图对象之间来回传递数据。例如，控制器对象可以协调将街道地址（来自客户模型对象）传输到窗口上可见的文本字段（视图对象）。它还执行其所处应用程序特有的所有事务。由于控制器所做的事情非常特定于具体应用程序，因此通常不可重用，尽管它往往构成了应用程序代码的很大一部分。（不过，这最后一句并不意味着控制器对象不能被重用；只要设计得当，它们也可以被重用。）由于控制器处于核心的中介角色，模型对象无需了解用户界面的状态和事件，视图对象也无需了解模型对象的程序化接口。你甚至可以把自己的视图对象和模型对象放到
    Interface Builder 的组件面板中，供其他开发者使用。


    #### 混合模型


    严格遵循 MVC 并不总是最佳解决方案。有时最好将角色结合起来。例如，在图形密集型应用（如街机游戏）中，你可能会让一些视图对象同时承担视图和模型两种角色。在某些应用中，尤其是简单的应用，你可以结合控制器和模型的角色；这些对象把模型对象独特的数据结构和逻辑与控制器同界面之间的连接结合起来。


    ### Currency Converter 应用


    MVC 设计模式虽然非常简化，但可以直接应用于 Currency Converter 应用。Currency Converter 是一个简单的应用，它根据用户输入的汇率将美元兑换成另一种货币。尽管它是一个非常简单的应用，但仍可用来传达使用
    MVC 设计模式进行 Cocoa 应用开发的基本要素。


    底层功能（即模型）根据汇率将美元兑换成另一种货币。为此，有一个单独的函数 `convertCurrency`，它将美元金额乘以汇率，得到另一种货币的金额。


    所有图形应用程序都有一个供用户交互的用户界面，这就是视图。在本应用中，用户在一个文本字段输入汇率，在下一个文本字段输入要兑换的美元金额，然后点击“转换”按钮或按
    Return 键执行计算。最终结果出现在最后一个文本框中，即另一种货币的金额。


    视图需要以某种方式将用户输入的数据发送给模型。具体做法是创建一个控制器：控制器从视图收集汇率和美元金额，将这些值发送给模型，并将结果写入视图。

    '
