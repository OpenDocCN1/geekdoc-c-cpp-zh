    # # Refining the Layout and View Functionality


    The Currency Converter window now contains all the necessary objects for it to
    function as designed. This section guides you through formatting the window and
    menu to make it more user friendly.


    # ## Aligning Objects in a Window


    In order to make an attractive user interface, you should visually align interface
    objects in rows and columns. “Eyeballing” the alignments can be very difficult,
    and typing in x/y coordinates by hand is tedious and time consuming. Aligning
    user interface elements is made even more difficult because the elements have
    shadows and user interface guideline metrics do not typically take the shadows
    into account. Interface Builder uses visual guides and layout rectangles to help
    you with object alignment.


    In Cocoa, all drawing is done within the bounds of an object’s frame. Because
    interface objects have shadows, they do not visually align correctly if you align
    the edges of the frames. For example, Apple Human Interface Guidelines says that
    a push button should be 20 pixels tall, but you actually need a frame of 32 pixels
    for both the button and its shadow. The layout rectangle is what you must align.
    You can view the layout rectangles of objects in Interface Builder using the Show
    Layout Rectangles command in the Layout menu.


    Interface Builder gives you several ways to align objects in a window:


    +   - Dragging objects with the mouse in conjunction with the layout guides


    +   - Pressing the arrow keys (with the grid off, the selected objects move one
    pixel)'
