    \ Currency Converter配上了一个优雅的图标\n\n    ![](img/52b51a77032f3549c0adc4a141b59201_64_0.png)\n\
    \n适当地配置应用程序对于为客户提供良好体验至关重要。\n\n### 下一步是什么？\n\n既然你的项目已经完成，你可能想了解Cocoa与其他框架的区别。你可能已经注意到，无需对这些功能进行编程，你构建的应用程序就能实现多少功能。在下一章中，你将了解Cocoa提供的许多功能以及如何利用它们。\n\
    \n## 第7章：配置你的应用程序\n\n## 第8章：拓展基础知识\n\nCocoa的设计宗旨是让应用程序开发变得简单，并从应用程序开发中去除许多无趣且重复的工作。用户可能认为理所当然的许多常见应用程序功能，其实编写起来相当困难。Cocoa实现了这些功能中的很大一部分，因此你可以将时间花在让应用程序变得特别的事情上，而不是实现基本功能。本章介绍Cocoa的这些集成组件。你可能会惊讶于Cocoa为最大限度地提高你的生产力而打包了多少类和功能。\n\
    \n### 使用Cocoa即可免费获得\n\n最简单的Cocoa应用程序，即使不添加一行代码，也包含大量你可以“免费获得”的功能。你不必自己编写这些功能。当你在Interface\
    \ Builder中测试界面时，就能看到这一点。\n\n### 应用程序和窗口行为\n\n在Interface Builder测试模式下，Currency\
    \ Converter的行为几乎与屏幕上的任何其他应用程序一样。点按屏幕上的其他位置，Currency Converter就会变为非活动状态，被其他应用程序的窗口完全或部分遮挡。\n\
    \n如果你关闭了应用程序，请再次运行它。一旦Currency Converter窗口打开，可以通过其标题栏移动它。以下是一些你可以尝试的其他测试：\n\n\
    - 1. 打开“编辑”菜单。与任何应用程序菜单一样，它的菜单项会在你释放鼠标按钮时出现然后消失。\n- 2. 点按“最小化”按钮。点按程序坞中该窗口的图标以恢复应用程序。\n\
    - 3. 点按“关闭”按钮；Currency Converter窗口消失。\n\n如果你没有在Interface Builder中将Currency Converter窗口配置为移除大小调整框，那么你现在就可以调整它的大小。你还可以设置窗口及其视图的自动调整大小属性，使窗口元素随窗口大小按比例调整，或保持其初始大小（有关自动调整大小的详细信息，请参阅Interface\
    \ Builder帮助）。\n\n### 控件和文本\n\nCurrency Converter的按钮和文本字段具有许多内置行为。注意“转换”（Convert）按钮会脉动（这是与Return键关联按钮的默认行为）。点按“转换”按钮。注意按钮如何被高亮显示片刻。如果你使用不同样式的按钮，它们也会以特有的方式响应鼠标点按。\n\
    \n现在点按其中一个文本字段。注意插入点是如何就地闪烁的。输入一些文本并选中它。使用“编辑”菜单中的命令将其复制并粘贴到另一个文本字段中。\n\n你还记得你在Currency\
    \ Converter文本字段之间建立的`nextKeyView`连接吗？将光标插入文本字段，按Tab键，观察光标从一个字段跳到另一个字段。\n\n###\
    \ 菜单命令\n\nInterface Builder为每个新应用程序提供一个默认菜单，其中包括应用程序、文件、编辑、窗口和帮助菜单。其中一些菜单（如编辑）包含现成的命令集。例如，通过“服务”子菜单（其菜单项由其他应用程序在运行时添加），你可以与其他Mac\
    \ OS X应用程序通信。你可以使用“窗口”菜单管理应用程序的窗口。\n\nCurrency Converter只需要少数几个命令：“退出”和“隐藏”命令，以及“编辑”菜单中的“拷贝”、“剪切”和“粘贴”命令。如果你愿意，可以删除不需要的命令。但是，你也可以添加新的命令并获得“免费”行为。在Interface\
    \ Builder中设计的应用程序只需简单添加一个菜单或菜单命令即可获得额外功能，而无需编译。例如：\n\n- “字体”子菜单为文本视图对象中的文本应用字体添加了行为，就像“文本”面板中的文本视图对象那样。你的应用程序“免费”获得“字体”窗口和字体管理器。应用程序中的文本元素可以立即使用此功能。有关更多信息，请参阅*字体面板*。\n\
    - “文本”子菜单允许你在任何可编辑文本的位置对齐文本，并在`NSText`对象中显示标尺，用于制表、缩进和对齐。\n- 得益于Mac OS X的PDF图形核心，许多显示文本或图像的对象都可以将其内容打印为PDF文档。\n\
    \n### 文档管理\n\n许多应用程序会创建和管理称为文档的可重复、半自治对象。文档包含离散的信息集，并支持这些信息的输入和维护。文字处理文档就是一个典型例子。应用程序与用户协调，并与其文档通信，以创建、打开、保存、关闭文档或以其他方式管理它们。你也可以通过一些额外代码将Currency\
    \ Converters保存为文档。\n\n有关更多信息，请参阅Cocoa设计指南文档中的*基于文档的应用程序概述*。\n\n### 文件管理\n\n应用程序可以使用由Application\
    \ Kit框架创建和管理的“打开”对话框，帮助用户在文件系统中定位文件并打开它们。它还可以使用“保存”对话框将信息保存到文件中。Cocoa还提供了一些类，用于管理文件系统中的文件（创建、比较、拷贝、移动等）以及管理用户默认设置。\n\
    \n"
