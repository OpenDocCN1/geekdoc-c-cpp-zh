    \ the same word. A pop-up menu with a list of method names appears.\n- 5. Choose\
    \ `[NSCell setFloatValue]`. This time, Xcode displays the `NSCell.h` header file\
    \ in an editor window and highlights the declaration of the `setFloatValue` method.\n\
    - 6. Close the header file.\n\n### Run the Application\n\nYour hard work is about\
    \ to pay off. Because you haven’t edited any code since the last time you built\
    \ the project, the application is ready to run.\n\n- 1. Choose Build > Build and\
    \ Go.\n- 2. After the Currency Converter application launches, enter a rate and\
    \ a dollar amount.\n- 3. Click Convert.\n- 4. Select the text in a text field\
    \ and choose the Currency Converter > Services submenu.\n  \n  The Services menu\
    \ lists other applications that can operate on the selected text.\n- 5. Choose\
    \ Currency Converter > Quit Currency Converter from the application menu to quit\
    \ Currency Converter.\n\n### Correct Build Errors\n\nOf course, rare is the project\
    \ that is flawless from the start. For most applications you write, Xcode is likely\
    \ to catch some errors when you first build them. Thankfully, Xcode offers tools\
    \ to help you catch those bugs and move on.\n\n- 1. To get an idea of the error-checking\
    \ features of Xcode, introduce a mistake into the code and click Build again.\n\
    \  \n  You can now see that the left column of your code contains one or more\
    \ error indicators.\n  \n  While the error indicator helps you understand the\
    \ location of the error, you may want to examine the nature of the problem.\n\
    - 2. In the project window, click the Build Results tab.\n- 3. Double-click the\
    \ error to open it in an editor window and display the error.\n- 4. Fix the error\
    \ in the code and build the application again. The errors go away, and the status\
    \ bar indicates that the build was successful.\n\n### Great Job!\n\nAlthough Currency\
    \ Converter is a simple application, creating it illustrates many of the concepts\
    \ and techniques of Cocoa programming. Now you have a much better grasp of the\
    \ skills you need to develop Cocoa applications. You learned:\n\n- To compose\
    \ a graphical user interface (GUI) in Interface Builder\n\n## Configuring Your\
    \ Application\n\nNow that you have your very own functional application, it’s\
    \ time to give it individual properties instead of the default properties. In\
    \ this chapter, you learn about the `Info.plist` file, which is where you can\
    \ change properties that govern your application’s attributes. This chapter also\
    \ describes the essential identification properties required for Mac OS X applications.\
    \ It walks you through the process of configuring these properties in Currency\
    \ Converter. You learn what changing these various properties does when viewing\
    \ information about the application. Finally, you learn how to give an application\
    \ its own icon so it is set apart from other applications.\n\n### The Info.plist\
    \ File\n\nMac OS X applications contain information to help distinguish them from\
    \ one another. This information includes the application’s primary and secondary\
    \ version numbers, and the icon that the Finder and the Dock use to represent\
    \ it. The file that stores these details is known as the information property\
    \ list file (named `Info.plist`). This property list file is stored with the executable\
    \ files and resources that make up an application, known as an application bundle.\n\
    \n> **Note:** A **bundle** is a directory that groups files in a structured hierarchy.\
    \ To make it easy for users to manipulate bundles, bundles can be represented\
    \ as files instead of folders in the Finder; these bundles are known as **packages**.\
    \ An **application bundle** stores the executable files and resources that make\
    \ up an application. Although it’s more correct to refer to application bundles\
    \ as *application packages* because they’re always shown to users as single files\
    \ in the Finder, this chapter adopts the term application bundle instead of application\
    \ package. For more information on bundles and packages, see *Bundle Programming\
    \ Guide*.\n\n### Basic Project Attributes\n\nThere are several essential properties\
    \ that identify applications to users and to Mac OS X: application identifier,\
    \ build version number, release version number, copyright notice, application\
    \ name, and application-icon filename.\n\n- Without application identifiers, administrators\
    \ would have to navigate to the location of each managed application, a relatively\
    \ tedious task. The **application-identifier** property specifies a string that\
    \ Mac OS X uses to identify an application. This property does not identify a\
    \ specific application bundle in the filesystem or a particular version of the\
    \ application. In normal conditions, users don’t see application identifiers.\n\
    \  \n  The application-identifier property is specified with the `CFBundleIdentifier`\
    \ key in the `Info.plist` file.\n"
  mdcn: "\n\n## 第5章：连接模型与视图：控制器\n\n- 2. 在检查器（Inspector）中导航到“连接”（Connections）标签页。\n\
    - 3. 将鼠标悬停在连接上，确保每个插座（outlet）都连接到正确的文本字段，如图5-6所示。\n\n**图5-6** 检查插座连接\n\n![](img/52b51a77032f3549c0adc4a141b59201_46_0.png)\n\
    \n### 将控制器连接到模型\n\n在 Xcode 的 `ConverterController` 类内创建一个转换器类的实例。\n\n- 1. 在“组和文件”（Groups\
    \ and Files）侧边栏的“类”（Classes）文件夹中，双击 `ConverterController.h` 在编辑窗口中打开。\n- 2. 在声明完插座之后、结束括号之前，将下面一行代码添加到你的代码中，声明一个指向转换器对象的指针：\n\
    \n```\nConverter *converter;\n```\n\n当被点击时，“转换”（Convert）按钮会向 `ConverterController`\
    \ 对象发送 `convert:` 消息。补全 `ConverterController` 中 `convert:` 方法的定义，使其向 `Converter`\
    \ 实例发送 `convertCurrency` 消息以执行转换：\n\n```\nconverter = [[Converter alloc]init];\n\
    ```\n\n这行代码在内存中为 Converter 实例分配空间，使用后应将其释放。你可能会注意到你并没有释放这个实例。\n\n之所以可以这样做，是因为\
    \ Objective-C 2.0 利用了**垃圾回收**（garbage collection）。要启用垃圾回收：\n\n- 1. 选择“项目”（Project）>“编辑项目设置”（Edit\
    \ Project Settings）\n- 2. 转到“构建”（Build）标签页\n- 3. 在“GCC 4.0 - Code Generation”下，将“Objective-C\
    \ Garbage Collection”的值设置为 `Supported`。\n\n通过支持垃圾回收，你无需担心释放所实例化的对象。你可以保持代码现状，无需担心内存泄漏。\n\
    \n更多有关垃圾回收的信息，请参阅 *GNU/C++/Objective-C 4.0.1 编译器用户指南*。\n\n### 下一步是什么？\n\n你现在已经完成了\
    \ Currency Converter 的实现。请注意，你只需编写很少的代码，而你的应用程序现在拥有一个功能完整的货币转换系统和一个漂亮的用户界面。在下一章中，你将学习如何构建并运行该应用程序。\n\
    \n## 第6章：构建并运行你的应用程序\n\n既然你已经编写了应用程序运行所需的全部代码，构建了用户界面并将各个类连接在一起，那么是时候看看你的应用程序能否编译了。在本章中，你将学习如何运行将项目构建为应用程序的过程，还将学习如何检查编译时发生的错误。\n\
    \n### 构建应用程序\n\n要构建 Currency Converter 应用程序：\n\n- 1. 在 Xcode 中，选择“文件”（File）>“全部保存”（Save\
    \ All）以保存对项目源文件所做的更改。\n- 2. 点击项目窗口中的“构建”（Build）工具栏项。\n\n项目窗口底部的状态栏会显示构建的状态。当 Xcode\
    \ 完成且途中未遇到任何错误时，状态栏会显示“构建成功”（Build succeeded）。但如果存在错误，你需要纠正它们并重新开始构建过程。有关详细信息，请参见“纠正构建错误”（第52页）。\n\
    \n### 额外内容：查阅文档\n\nXcode 允许你访问 ADC 参考库的内容。在项目工作时，你可以直接跳转到文档和头文件。试一试：\n\n- 1. 在编辑窗口中打开\
    \ `ConverterController.m` 文件。\n- 2. 按住 Option 键并双击代码中的 `setFloatValue` 一词。（按住\
    \ Option 键并双击该词。）此时会弹出“快速帮助”（Quick Help）窗口，其中显示参考文档的摘要。点击书本图标可获取所选方法的完整描述。更多内容请阅读“扩展基础知识”（第67页）。\n\
    - 3. 关闭“快速帮助”窗口。\n- 4. 按住 Command 键并双击同一个词。此时会出现一个包含方法名称列表的弹出菜单。\n- 5. 选择 `[NSCell\
    \ setFloatValue]`。这一次，Xcode 会在编辑窗口中显示 `NSCell.h` 头文件，并高亮显示 `setFloatValue` 方法的声明。\n\
    - 6. 关闭头文件。\n\n### 运行应用程序\n\n你的辛勤工作即将得到回报。由于自上次构建项目以来你尚未编辑任何代码，因此应用程序已可以运行。\n\n\
    - 1. 选择“构建”（Build）>“构建并运行”（Build and Go）。\n- 2. 在 Currency Converter 应用程序启动后，输入汇率和美元金额。\n\
    - 3. 点击“转换”（Convert）。\n- 4. 选中文本字段中的文本，然后选择“Currency Converter”>“服务”（Services）子菜单。\n\
    \  \n  服务菜单列出了可以对所选文本进行操作的其他应用程序。\n- 5. 从应用程序菜单中选择“Currency Converter”>“退出 Currency\
    \ Converter”（Quit Currency Converter）以退出 Currency Converter。\n\n### 纠正构建错误\n\n\
    当然，从一开始就完美无瑕的项目是罕见的。对于你编写的大多数应用程序，Xcode 很可能在首次构建时发现一些错误。谢天谢地，Xcode 提供了工具来帮助你捕获这些错误并继续前进。\n\
    \n- 1. 为了了解 Xcode 的错误检查功能，请在代码中引入一个错误并再次点击“构建”（Build）。\n  \n  现在你可以看到代码左侧列包含一个或多个错误指示符。\n\
    \  \n  虽然错误指示符有助于你了解错误的位置，但你可能还想检查问题的性质。\n- 2. 在项目窗口中，点击“构建结果”（Build Results）标签页。\n\
    - 3. 双击错误以在编辑窗口中打开并显示错误。\n- 4. 修正代码中的错误并再次构建应用程序。错误消失，状态栏显示构建成功。\n\n### 干得漂亮！\n\
    \n虽然 Currency Converter 是一个简单的应用程序，但创建它展示了 Cocoa 编程的许多概念和技术。现在你已经更好地掌握了开发 Cocoa\
    \ 应用程序所需的技能。你学到了：\n\n- 在 Interface Builder 中组合图形用户界面（GUI）\n\n## 配置你的应用程序\n\n现在你有了自己的功能应用程序，是时候为它设置单独的属性，而不是默认属性了。在本章中，你将了解\
    \ `Info.plist` 文件，该文件是你可以更改控制应用程序属性的地方。本章还介绍了 Mac OS X 应用程序所需的基本标识属性。它将引导你完成在\
    \ Currency Converter 中配置这些属性的过程。你将了解在查看应用程序信息时更改这些不同属性会产生什么效果。最后，你将学习如何为应用程序提供自己的图标，使其与其他应用程序区分开来。\n\
    \n### Info.plist 文件\n\nMac OS X 应用程序包含用于彼此区分的信息。这些信息包括应用程序的主版本号和次版本号，以及 Finder\
    \ 和 Dock 用来表示它的图标。存储这些详细信息的文件称为信息属性列表文件（名为 `Info.plist`）。此属性列表文件与构成应用程序的可执行文件和资源存储在一起，称为应用程序包。\n\
    \n> **注意：** **包**（bundle）是一个以结构化层次结构对文件进行分组的目录。为了方便用户操作包，包可以在 Finder 中表示为文件而不是文件夹；这些包称为**软件包**（packages）。**应用程序包**存储构成应用程序的可执行文件和资源。虽然更准确的做法是将应用程序包称为*应用程序软件包*，因为它们在\
    \ Finder 中始终以单个文件形式显示给用户，但本章采用应用程序包而不是应用程序软件包。有关包和软件包的更多信息，请参阅 *Bundle 编程指南*。\n\
    \n### 基本项目属性\n\n有几个基本属性用于向用户和 Mac OS X 标识应用程序：应用程序标识符、构建版本号、发布版本号、版权声明、应用程序名称和应用程序图标文件名。\n\
    \n- 如果没有应用程序标识符，管理员将不得不导航到每个受管应用程序的位置，这是一项相对繁琐的任务。**应用程序标识符**属性指定一个字符串，Mac OS\
    \ X 使用它来标识应用程序。此属性不标识文件系统中的特定应用程序包，也不标识应用程序的特定版本。在正常情况下，用户看不到应用程序标识符。\n  \n  `Info.plist`\
    \ 文件中的 `CFBundleIdentifier` 键用于指定应用程序标识符属性。\n\n"
