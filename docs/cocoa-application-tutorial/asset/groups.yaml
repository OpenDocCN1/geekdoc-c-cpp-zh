    \ build version number does not appear in Finder windows.\n\n- The **release-version-number**\
    \ property specifies the version information the Finder displays for the application.\
    \ When you specify both a build version number and a release version number, the\
    \ About window displays the release version number, followed by the build version\
    \ number in parenthesis, as shown in Figure 7-2.\n\n    Figure 7-2    Build and\
    \ release version numbers in Finder preview panes and About windows\n\n    ![](img/52b51a77032f3549c0adc4a141b59201_56_0.png)\n\
    \n    The release-version-number property is specified with the `CFBundleShortVersionString`\
    \ key in the `Info.plist` file.\n\n    The release version number identifies a\
    \ released iteration of the application. Similar to the build version number,\
    \ the release version number is made up of a string of period-separated integers.\
    \ However, you should specify no more than three integers for the release version\
    \ number. By convention, the first integer represents major revisions to the application,\
    \ such as revisions that implement new features or major changes. The second integer\
    \ denotes revisions that implement less prominent features. The third integer\
    \ represents maintenance releases.\n\n- The **copyright-text property** specifies\
    \ the copyright notice for the application, for example, `© 2007, My Company.`\
    \ This notice is shown to users in the About window of the application.\n\n  \
    \  The copyright-text property is specified with the `NSHumanReadableCopyright`\
    \ key in the `Info.plist` file.\n\n- The **application-name property** specifies\
    \ the title of the application menu in the menu bar when the application opens\
    \ and the name of the application in its About window.\n\n    The application-name\
    \ property is specified with the `CFBundleName` key in the `Info.plist` file.\n\
    \n    > **Note:** Xcode sets the application name to the project name when you\
    \ create a new application project.\n\n- The **application-icon-filename property**\
    \ specifies the icon the Finder, the Dock, and the application’s About window\
    \ display for the application.\n\n    The application-icon-filename property is\
    \ specified with the `CFBundleIconFile` key in the `Info.plist` file.\n\n    An\
    \ icon file contains one or more images that depict an application’s icon at various\
    \ resolutions. These separate versions of an icon allow the Finder and the Dock\
    \ to render icons as sharp as possible at different sizes. You create icon files\
    \ using the Icon Composer application.\n\nFor further details on these and other\
    \ application properties, see *Runtime Configuration Guidelines*.\n\n## Specify\
    \ the Identifier, Version, and Copyright Information\n\nThis section shows how\
    \ to specify Currency Converter’s identifier, release version number, and copyright\
    \ text.\n\n> **Important:** To complete this task, you need to open this document’s\
    \ companion archive, `ObjCTutorial_companion.zip`.\n\nCurrency Converter’s name\
    \ property is set to the project name you entered in “Creating a Project in Xcode”\
    \ (page 15), `Currency Converter`. Therefore, you don’t need to change the value\
    \ of this property.\n\nFirst, remove the `InfoPlist.strings` file from the project.\
    \ This file is used for internationalization, a subject outside the scope of this\
    \ tutorial.\n\n1. In the Currency Converter project window, select the Resources\
    \ group in the Groups & Files list.\n2. In the detail view, select the `InfoPlist.strings`\
    \ file.\n3. Choose Edit > Delete.\n4. In the dialog that appears, click Also Move\
    \ to Trash.\n\nTo set the application-identifier and build-version-number, follow\
    \ these steps:\n\n1. Open the Targets group in the project window and select the\
    \ Currency Converter target.\n2. Choose File > Get Info to view the Target Info.\n\
    3. Click the Properties tab to display the target’s properties.\n4. Enter `com.mycompany.CurrencyConverter`\
    \ in the Identifier field to set the application identifier.\n5. Enter `100` in\
    \ the Build field to set the build-version-number to 100.\n\nThe release-version-number\
    \ and copyright-text properties aren’t exposed in the Properties tab. You can\
    \ edit them, and other attributes stored in the `Info.plist` file, by opening\
    \ the `Info.plist` file and editing it directly.\n\n1. Click the Open `Info.plist`\
    \ as File button at the bottom of the Properties tab.\n\n    The `Info.plist`\
    \ file is displayed in an editor, showing a list of keys on the left side and\
    \ their associated values on the right side.\n\n2. Set the release version number\
    \ to `1.0.0`.\n\n    Find the “Bundle version string, short” entry in the editor\
    \ and change its value to “1.0.0”.\n\n3. Set the copyright text to © 2009, My\
    \ Company:\n\n    a. Select a line of the `Info.plist` file and click the plus\
    \ button at the right end of the line.\n\n    b. Choose “Copyright (human-readable)”\
    \ from the list of keys.\n\n    c. Double-click the value cell on the right side\
    \ of the table and enter the text “© 2009, My Company.”\n\n4. Save the `Info.plist`\
    \ file.\n\nTo see how this affects your application:\n\n1. Clean the project,\
    \ and build and run the application.\n2. Choose Currency Converter > About Currency\
    \ Converter.\n\n    Notice how the name, version number, and copyright information\
    \ you entered in the `Info.plist` file are displayed correctly here.\n"
  mdcn: "\n应用程序标识符是统一类型标识符（UTI）或反向域名系统（DNS）名称；也就是说，顶级域名在前，然后是子域名，以句点（.）分隔。应用程序标识符由两部分组成：*前缀*和*基础部分*。**应用程序标识符前缀**标识负责该应用程序的公司或组织，由两个或更多域组成。第一个前缀域（即顶级域名）通常是\
    \ `com` 或 `org`。第二个域是公司或组织的名称。可根据需要使用后续域来提供更窄的范围。按约定，前缀域使用小写字母。例如，Apple 应用程序使用以\
    \ `com.apple` 开头的应用程序标识符。\n\n**应用程序标识符基础部分**由一个域组成，该域指代应用程序本身。此域应使用单词首字母大写，例如\
    \ *AddressBook*。有关统一类型标识符的更多信息，请参阅*统一类型标识符概述*。\n\nMac OS X 使用应用程序标识符来精确指代应用程序包，无论其在文件系统中的位置如何。例如，某些\
    \ Mac OS X 功能（如家长控制）仅使用应用程序标识符来指代用户计算机上的应用程序。家长控制偏好面板包含一个应用程序文件名列表，管理员可在其中选择要为用户提供受管理访问权限的应用程序，如图\
    \ 7-1 所示。\n\n**图 7-1** 使用应用程序标识符的好处\n\n![](img/52b51a77032f3549c0adc4a141b59201_55_0.png)\n\
    \n- **构建版本号**属性标识应用程序的某个迭代版本。\n\n    构建版本号属性通过 `Info.plist` 文件中的 `CFBundleVersion`\
    \ 键指定。\n\n    构建版本号由一串以句点分隔的整数组成。每个整数都必须等于或大于零。例如，55、1.2 和 1.2.0.55 都是有效的构建版本号。\n\
    \n    Mac OS X 使用构建版本号，例如，当文件系统中存在多个版本的应用程序（由其应用程序标识符确定）时，决定启动哪个版本的应用程序来打开文件。在这种情况下，Mac\
    \ OS X 会启动构建版本号最高的应用程序包。为确保此机制准确运行，您在发布应用程序新版本时必须遵循同一种版本编号风格。也就是说，如果您首次发布应用程序时使用多整数构建版本号，那么后续公开发布的版本必须在其构建版本号中使用相同数量的整数。\n\
    \n    > **注意：** 应用程序的构建版本号不会出现在 Finder 窗口中。\n\n- **发布版本号**属性指定 Finder 为应用程序显示的版本信息。同时指定构建版本号和发布版本号时，“关于”窗口会显示发布版本号，并在括号中紧跟构建版本号，如图\
    \ 7-2 所示。\n\n    图 7-2    Finder 预览面板和“关于”窗口中的构建版本号与发布版本号\n\n    ![](img/52b51a77032f3549c0adc4a141b59201_56_0.png)\n\
    \n    发布版本号属性通过 `Info.plist` 文件中的 `CFBundleShortVersionString` 键指定。\n\n    发布版本号标识应用程序的某个已发布迭代版本。与构建版本号类似，发布版本号由一串以句点分隔的整数组成。但是，发布版本号最多只能指定三个整数。按约定，第一个整数表示应用程序的主要修订，例如实现新功能或重大更改的修订。第二个整数表示实现较次要功能的修订。第三个整数表示维护版本。\n\
    \n- **版权文本属性**指定应用程序的版权声明，例如 `© 2007, My Company.`。此声明会在应用程序的“关于”窗口中向用户显示。\n\n\
    \    版权文本属性通过 `Info.plist` 文件中的 `NSHumanReadableCopyright` 键指定。\n\n- **应用程序名称属性**指定应用程序打开时菜单栏中应用程序菜单的标题，以及其“关于”窗口中的应用程序名称。\n\
    \n    应用程序名称属性通过 `Info.plist` 文件中的 `CFBundleName` 键指定。\n\n    > **注意：** 创建新的应用程序项目时，Xcode\
    \ 会将应用程序名称设置为项目名称。\n\n- **应用程序图标文件名属性**指定 Finder、Dock 和应用程序“关于”窗口为该应用程序显示的图标。\n\
    \n    应用程序图标文件名属性通过 `Info.plist` 文件中的 `CFBundleIconFile` 键指定。\n\n    图标文件包含一个或多个图像，这些图像以各种分辨率描绘应用程序的图标。图标的这些独立版本使\
    \ Finder 和 Dock 能够在不同大小下尽可能清晰地渲染图标。您可以使用 Icon Composer 应用程序创建图标文件。\n\n有关这些及其他应用程序属性的更多详细信息，请参阅*运行时配置指南*。\n\
    \n## 指定标识符、版本和版权信息\n\n本节介绍如何指定 Currency Converter 的标识符、发布版本号和版权文本。\n\n> **重要：**\
    \ 要完成此任务，您需要打开本文档的配套归档文件 `ObjCTutorial_companion.zip`。\n\nCurrency Converter 的名称属性已设置为您在“在\
    \ Xcode 中创建项目”（第 15 页）中输入的項目名 `Currency Converter`。因此，您无需更改此属性的值。\n\n首先，从项目中移除\
    \ `InfoPlist.strings` 文件。此文件用于国际化，该主题超出本教程的范围。\n\n1. 在 Currency Converter 项目窗口中，在“组与文件”列表中选择“资源”组。\n\
    2. 在详细信息视图中，选择 `InfoPlist.strings` 文件。\n3. 选取“编辑”>“删除”。\n4. 在出现的对话框中，点按“同时移到废纸篓”。\n\
    \n要设置应用程序标识符和构建版本号，请执行以下步骤：\n\n1. 在项目窗口中打开“目标”组，然后选择 Currency Converter 目标。\n\
    2. 选取“文件”>“显示简介”以查看“目标简介”。\n3. 点按“属性”标签页以显示目标的属性。\n4. 在“标识符”栏中输入 `com.mycompany.CurrencyConverter`\
    \ 以设置应用程序标识符。\n5. 在“构建”栏中输入 `100`，将构建版本号设置为 100。\n\n发布版本号和版权文本属性未在“属性”标签页中公开。您可以通过打开\
    \ `Info.plist` 文件并直接编辑它，来编辑这些属性以及存储在 `Info.plist` 文件中的其他属性。\n\n1. 点按“属性”标签页底部的“打开\
    \ `Info.plist` 作为文件”按钮。\n\n    `Info.plist` 文件会显示在编辑器中，左侧显示键列表，右侧显示其关联值。\n\n2.\
    \ 将发布版本号设置为 `1.0.0`。\n\n    在编辑器中找到“Bundle version string, short”条目，并将其值更改为“1.0.0”。\n\
    \n3. 将版权文本设置为 © 2009, My Company：\n\n    a. 选择 `Info.plist` 文件中的一行，然后点按该行右端的加号按钮。\n\
    \n    b. 从键列表中选择“Copyright (human-readable)”。\n\n    c. 双击表格右侧的值单元格，然后输入文本“© 2009,\
    \ My Company.”。\n\n4. 存储 `Info.plist` 文件。\n\n要查看这对应用程序的影响：\n\n1. 清理项目，然后构建并运行应用程序。\n\
    2. 选取 Currency Converter > 关于 Currency Converter。\n\n    请注意，您在 `Info.plist` 文件中输入的名称、版本号和版权信息在此处正确显示。\n"
