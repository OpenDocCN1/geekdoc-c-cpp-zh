    \n    **图7-5** 将`c_conv512.png`拖到图标文件编辑器中\n\n    ![](img/52b51a77032f3549c0adc4a141b59201_61_0.png)\n\
    \n  - b. 系统会弹出对话框，询问是否要将图像复制到其他尺寸。选择“复制到所有较小尺寸”，然后按“导入”。这会自动将512 x 512图像缩放到较小尺寸。\n\
