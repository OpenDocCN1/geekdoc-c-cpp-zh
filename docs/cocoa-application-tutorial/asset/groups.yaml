    Builder 库中的许多对象都有一个名为 `nextKeyView` 的出口。此变量标识用户按下 Tab 键时下一个接收键盘事件的对象。Cocoa 应用程序默认会“尽力猜测”如何处理文本栏的
    Tab 切换，但你可以根据应用程序的特定需求显式设置下一个键视图，从而改进默认行为。通过连接 `nextKeyView` 出口，可以为对象设置下一个键视图。


