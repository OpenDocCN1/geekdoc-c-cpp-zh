    To create the icon file for Currency Converter:


    +   1. Launch Icon Composer, located in `/Developer/Applications/Utilities`. Icon
    Composer displays an empty icon file editor window.

    +   2. In the Finder, navigate to the `ObjCTutorial_companion/application_icon_images`
    **directory**. This directory contains the image file that depicts the Currency
    Converter application icon.

    +   3. Add the image file to the icon file.

    +      a. Drag `c_conv512.png` from the Finder window to the Large Image image
    well in the icon file editor, as shown in Figure 7-5.


    **Figure 7-5**    Dragging `c_conv512.png` to the icon file editor


    ![](img/52b51a77032f3549c0adc4a141b59201_61_0.png)


    +      b. A dialog asks if you would like to copy the image to other sizes. Choose
    “Copy to all smaller sizes” and press Import. This automatically scales the 512
    x 512 image to the smaller sizes.

    +      c. The hit masks for all sizes are automatically extracted. Hit masks are
