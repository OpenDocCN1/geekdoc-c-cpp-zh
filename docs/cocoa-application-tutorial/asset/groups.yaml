    ### 在窗口中排列对象


    为了打造美观的用户界面，你应该在视觉上按行和列排列界面对象。“目测”对齐可能非常困难，而手动输入 x/y 坐标既繁琐又耗时。对齐用户界面元素甚至更加困难，因为这些元素带有阴影，而用户界面指南度量通常不会考虑阴影。Interface
    Builder 使用视觉参考线和布局矩形来帮助你进行对象对齐。


    在 Cocoa 中，所有绘制都在对象框架的边界内完成。由于界面对象带有阴影，如果对齐框架边缘，它们在视觉上并不会正确对齐。例如，Apple Human Interface
    Guidelines 指出按钮应高 20 像素，但实际上按钮及其阴影需要 32 像素的框架。你必须对齐的是布局矩形。你可以使用 Layout 菜单中的 Show
    Layout Rectangles 命令在 Interface Builder 中查看对象的布局矩形。


