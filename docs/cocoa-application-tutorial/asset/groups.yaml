    \ (the `.app` suffix is optional).\n\n- 5. In the Dock, Control-click or click-and-hold\
    \ the Currency Converter icon and choose Show In Finder from the shortcut menu,\
    \ as shown in Figure 7-3.\n\n    **Figure 7-3** Locating the application bundle\
    \ from the Dock\n\n    ![](img/52b51a77032f3549c0adc4a141b59201_59_0.png)\n\n\
    \    The Finder opens a window shown in Figure 7-4, displaying the Currency Converter\
    \ application bundle. Notice that the release version number (CFBundleShortVersionString)\
    \ appears in the preview column (in column view) and in the info window for the\
    \ application bundle. The About Currency Converter window shows the application\
    \ name (CFBundleName), build version number (CFBundleVersion) in parentheses,\
    \ release version number, and copyright text (NSHumanReadableCopyright).\n\n \
    \   **Figure 7-4** Application properties as seen by the user\n\n    ![](img/52b51a77032f3549c0adc4a141b59201_60_0.png)\n\
    \n- 6. Quit Currency Converter.\n\nNow the only essential application identification\
    \ information left unspecified for Currency Converter is its icon.\n\n### Create\
    \ an Icon File\n\nWhen you create a Cocoa application without specifying an icon\
    \ for it, the Finder and the Dock assign it the generic application icon, as shown\
    \ in Figure 7-4 (page 61). To make your applications more appealing to their users\
    \ and to differentiate them from other applications, you should give your applications\
    \ distinctive icons. As a result, your applications stand out from other applications\
    \ in Finder windows and in the Dock. This section describes the process of creating\
    \ an icon file using Icon Composer and configuring Currency Converter to use the\
    \ icon file. To do this, you must have downloaded the companion file provided\
    \ with this document.\n\n**Note:** Before doing this, make sure you have downloaded\
    \ the companion archive (`ObjCTutorial_companion.zip`). The archive contains the\
    \ icon image you will be using for this section.\n\nTo create the icon file for\
    \ Currency Converter:\n\n- 1. Launch Icon Composer, located in `/Developer/Applications/Utilities`.\
    \ Icon Composer displays an empty icon file editor window.\n- 2. In the Finder,\
    \ navigate to the `ObjCTutorial_companion/application_icon_images` **directory**.\
    \ This directory contains the image file that depicts the Currency Converter application\
    \ icon.\n- 3. Add the image file to the icon file.\n  - a. Drag `c_conv512.png`\
    \ from the Finder window to the Large Image image well in the icon file editor,\
    \ as shown in Figure 7-5.\n\n    **Figure 7-5** Dragging `c_conv512.png` to the\
    \ icon file editor\n\n    ![](img/52b51a77032f3549c0adc4a141b59201_61_0.png)\n\
    \n  - b. A dialog asks if you would like to copy the image to other sizes. Choose\
    \ “Copy to all smaller sizes” and press Import. This automatically scales the\
    \ 512 x 512 image to the smaller sizes.\n  - c. The hit masks for all sizes are\
    \ automatically extracted. Hit masks are a bitmapping of the locations in which\
    \ the image will respond when it is clicked.\n\n- 3. In the dialog that appears,\
    \ select the `APPL.icns` file in the Currency Converter project directory, and\
    \ click Add, as shown in Figure 7-7.\n\n    **Figure 7-7** Selecting the icon\
    \ file to add to the Currency Converter project\n\n    ![](img/52b51a77032f3549c0adc4a141b59201_63_0.png)\n\
    \n- 4. In the dialog that appears next, shown in Figure 7-8, click Add.\n\n  \
    \  **Figure 7-8** Specifying project file-addition options\n\n    ![](img/52b51a77032f3549c0adc4a141b59201_63_1.png)\n\
    \n- 5. Finally, specify the name of the icon file in the Icon File field of the\
    \ target properties.\n\nTo see the icon in your project:\n\n- 1. Quit Currency\
    \ Converter if you have not done so already.\n- 2. Choose Build > Clean.\n- 3.\
    \ Click \"Build and Go\" to build and run the application.\n- 4. Currency Converter\
    \ now has a distinguishing icon, shown in Figure 7-9.\n\n    **Figure 7-9** Currency\
    \ Converter sporting an elegant icon\n\n    ![](img/52b51a77032f3549c0adc4a141b59201_64_0.png)\n\
    \nConfiguring your applications appropriately is essential for providing a good\
    \ experience to your customers.\n\n### What's Next?\n\nNow that your project is\
    \ complete, you may want to learn about what separates Cocoa from other frameworks.\
    \ You probably noticed how much you can do with the application you built without\
    \ programming any of those features. In the next chapter, you learn about many\
    \ of the features Cocoa supplies and how to take advantage of them.\n\n## CHAPTER\
    \ 7: Configuring Your Application\n\n## CHAPTER 8: Expanding on the Basics\n\n\
    Cocoa was designed to make application development simple and to take a lot of\
    \ the uninteresting, repetitive work out of application development. Many common\
    \ features of applications that users may take for granted are quite difficult\
    \ to program. Cocoa implements a large selection of these features so you can\
    \ spend your time on what makes your application special, instead of implementing\
    \ baseline features. This chapter describes those integrated components of Cocoa.\
    \ You may be surprised how many classes and features come packaged with Cocoa\
    \ to maximize your productivity.\n\n### For Free with Cocoa\n\nThe simplest Cocoa\
    \ application, without a line of code added to it, includes a wealth of features\
    \ you get “for free.” You do not have to program these features yourself. You\
    \ can see this when you test an interface in Interface Builder.\n\n### Application\
    \ and Window Behavior\n\nIn the Interface Builder test mode, Currency Converter\
    \ behaves almost like any other application on the screen. Click elsewhere on\
    \ the screen, and Currency Converter is deactivated, becoming totally or partially\
    \ obscured by the windows of other applications.\n\nIf you closed your application,\
    \ run it again. Once the Currency Converter window is open, move it around by\
    \ its title bar. Here are some other tests you can do:\n\n- 1. Open the Edit menu.\
    \ Its items appear and then disappear when you release the mouse button, as with\
    \ any application menu.\n- 2. Click the miniaturize button. Click the window’s\
    \ icon in the Dock to get the application back.\n- 3. Click the close button;\
    \ the Currency Converter window disappears.\n\nIf you hadn’t configured the Currency\
    \ Converter window in Interface Builder to remove the resize box, you could resize\
    \ it now. You could also have set the autoresizing attributes of the window and\
    \ its views so that the window’s elements would resize proportionally to the resized\
    \ window or would retain their initial size (see Interface Builder Help for details\
    \ on autoresizing).\n\n### Controls and Text\n\nThe buttons and text fields of\
    \ Currency Converter come with many built-in behaviors. Notice that the Convert\
    \ button pulsates (as is the default for buttons associated with the Return key).\
    \ Click the Convert button. Notice how the button is highlighted for a moment.\
    \ If you had buttons of a different style, they would also respond in characteristic\
    \ ways to mouse clicks.\n\nNow click in one of the text fields. See how the insertion\
    \ point blinks in place. Type some text and select it. Use the commands in the\
    \ Edit menu to copy it and paste it in the other text field.\n\nDo you recall\
    \ the `nextKeyView` connections you made between the Currency Converter text fields?\
    \ Insert the cursor in a text field, press the Tab key and watch the cursor jump\
    \ from field to field.\n\n### Menu Commands\n\nInterface Builder gives every new\
    \ application a default menu that includes the application, File, Edit, Window,\
    \ and Help menus. Some of these menus, such as Edit, contain ready-made sets of\
    \ commands. For example, with the Services submenu (whose items are added by other\
    \ applications at runtime) you can communicate with other Mac OS X applications.\
    \ You can manage your application’s windows with the Window menu.\n\nCurrency\
    \ Converter needs only a few commands: the Quit and Hide commands and the Edit\
    \ menu’s Copy, Cut, and Paste commands. You can delete the unwanted commands if\
    \ you wish. However, you could also add new ones and get “free” behavior. An application\
    \ designed in Interface Builder can acquire extra functionality with the simple\
    \ addition of a menu or menu command, without the need for compilation. For example:\n\
    \n- The Font submenu adds behavior for applying fonts to text in text view objects,\
    \ like the one in the text view object in the Text palette. Your application gets\
    \ the Font window and a font manager “for free.” Text elements in your application\
    \ can use this functionality right out of the box. See *Font Panel* for more information.\n\
    - The Text submenu allows you to align text anywhere text is editable and to display\
    \ a ruler in the `NSText` object for tabbing, indentation, and alignment.\n- Thanks\
    \ to the PDF graphics core of Mac OS X, many objects that display text or images\
    \ can print their contents as PDF documents.\n\n### Document Management\n\nMany\
    \ applications create and manage repeatable, semi-autonomous objects called documents.\
    \ Documents contain discrete sets of information and support the entry and maintenance\
    \ of that information. A word-processing document is a typical example. The application\
    \ coordinates with the user and communicates with its documents to create, open,\
    \ save, close, and otherwise manage them. You could also save your Currency Converters\
    \ as documents, with a little extra code.\n\nSee *Document-Based Applications\
    \ Overview* in Cocoa Design Guidelines Documentation for more information.\n\n\
    ### File Management\n\nAn application can use the Open dialog, which is created\
    \ and managed by the Application Kit framework, to help the user locate files\
    \ in the file system and open them. It can also use the Save dialog to save information\
    \ in files. Cocoa also provides classes for managing files in the file system\
    \ (creating, comparing, copying, moving, and so forth) and for managing user defaults.\n"
