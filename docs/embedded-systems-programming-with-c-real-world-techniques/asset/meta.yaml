  - 传输层安全 (TLS)
- - '###'
  - IPsec (网协议安全)
- - '##'
  - MQTT (消息队列遥传输协议)：在物联网应用中特别流行，`MQTT` 是一种用于低带宽、高延迟环境的轻量级消息协议。它支持通过 `TLS` 进行安全通信，从而增强资源受限嵌入式系统的安全性。
- - '##'
  - DTLS (数据报传输层安全协议)：`DTLS` 通过在 `UDP` 上实现 `TLS` 为基于数据报的应用程序提供安全性。它适用于降低延迟并能忍受潜在丢包而不损害安全性的场景。
