  md: 'lead to transfer in all cases. For example, common container-like data structures
    in C (e.g., lists, trees, or hash tables) typically store pointers to data objects.
    Clearly, storing an object in one of these containers allows it to escape. However,
    most of these containers do not take ownership of their elements: the caller must
    still manage their memory. Ma and Foster [10] note that ownership transfer in
    library interfaces is relatively rare; we note that escaping parameters are anything
    but rare. We therefore suggest that escape analysis is distinct from ownership
    transfer analysis. In this section, we present a transfer analysis to more accurately
    identify ownership transfers in C library functions. We revisit escape analysis
    in section 5.


    The essence of our ownership transfer analysis follows from our resource ownership
    model in section 2. We consider a structure field to be owned if that field will
    be finalized within the context of a finalizer function. Thus, ownership of an
    object is transferred from a caller when another object assumes responsibility
    for finalizing it (i.e., it is stored into a field that will be finalized). Fields
    finalized in other contexts are sometimes used to store temporary allocations,
    but these fields are not guaranteed to be finalized with the rest of the object
    and are managed separately. The analysis proceeds in two phases. First it identifies
    all of the owned fields in a library. Then it identifies all of the function parameters
    that may be stored into an owned field. We describe fields in terms of symbolic
    access paths. Note that we assume that any given field is either always owned
    or never owned. We do not attempt to reason about fields that are only owned sometimes.
    Furthermore, we assume that, if one element held in a container-like field (i.e.,
    an array or linked data structure) is owned, all elements in that field are owned.


    # 4.1 Symbolic Access Paths


    This analysis is based on symbolic access paths [2, 7]; we follow the formulation
    of Matosevic and Abdelrahman [11]. An access path describes a memory location
    accessible from a base value by a (possibly empty) sequence of path components.
    While we will only discuss field accesses in this paper, pointer dereferences,
    array accesses, and union accesses are also valid path components. We treat all
    array elements in a single array as identical; a more precise analysis could differentiate
    between them. This treatment of field accesses is unsound when pointers to struct
    types are cast to unrelated types [15], which could cause the analysis to identify
    invalid ownership transfers.


    Let ap(v) represent the access path for a source expression v. For example, the
    assignment on line 18 of figure 3 assigns a value to lst→head. The corresponding
    access path ap(lst→head) is the pair (lst, {head}). In this pair, lst is the base
    value and {head} is a sequence of one field access to reach the affected memory
    location. We sometimes refer to locations abstractly in terms of a base type rather
    than a base value. Here, lst type pvl_list, so the abstract access path for this
    field access is (pvl_list, {head}).


    Following Matosevic and Abdelrahman we construct symbolic access paths by traversing
    the call graph bottom-up, with strongly-connected components being iteratively
    re-analyzed until a fixed-point is reached. We will assume that functions are
    normalized such that the return value is the first parameter in the list of formal
    parameters (always indexed as zero). Functions return values by writing to their
    return parameter. Void functions have a placeholder in argument zero. For each
    library analyzed, we construct two maps, each keyed by function and formal parameter
    number:


    +   - Let f be a function and i be the zero-based index of a parameter to that
    function. Then finalizePaths[f, i] is a set of access paths that function f finalizes
    in its iᵗʰ parameter.

    +   - Let f be a function and i be the zero-based index of a parameter to that
    function. Then writePaths[f, i] is a set of triples of the form (p, j, q) where
    function f reads the value at access path q


    of its jᵗʰ parameter and ultimately stores this value into access path p of its
    iᵗʰ parameter.

    Let argno(v) return the index of formal parameter v in the formal parameter list
    of the enclosing function. Let base(p) return the base of access path p and components(p)
    return the path components of p. The access path extend operation p₁ ⊕ p₂ extends
    p₁ by p₂ in the natural way; the resulting path has the same base value as p₁
    and the path components of p₂ appended to those of p₁. The set-valued operation
    nr(p) returns the singleton set containing p if each path component in components(p)
    is unique within p; otherwise, it returns the empty set. Likewise, nr((p, j, q))
    returns a singleton set containing a triple if neither p nor q has repeated path
    components. This condition excludes cyclic paths that could grow indefinitely;
    such paths are common in the presence of inductive data structures.


    Our handling and representation of cyclic access paths differs from Matosevic
    and Abdelrahman [11]. They represent paths using a regular expression-like language
    with repetition operators. Our analysis does not require information about cycles
    in paths, so we use the simpler representation discussed above; this requires
    the no-repetition condition (through the nr() operator) to prevent cyclic paths
    from growing without bound. This less expressive treatment of paths is a potential
    source of unsoundness, though it has not been a problem in practice.


    We analyze code represented as LLVM bitcode: three-address code in static single
    assignment (SSA) form [8]. Two types of statements add elements to finalizePaths
    or writePaths: function calls and store instructions. This analysis is flow-insensitive
    and paths are created or extended for any relevant store or function call that
    may be executed. We consider function calls first. Suppose function f contains
    a function call of the form g(value). Let p = ap(value) be the access path of
    value. If g is a finalizer and base(p) is among the formal parameters of f, then:
    finalizePaths[f, argno(base(p))] ⊇ nr(p)


    Now consider a store of the form *location = value in function f. Let lp = ap(location)
    and p = ap(value). If both base(lp) and base(p) are among the formal parameters
    of f, then: writePaths[f, argno(base(lp))] ⊇ nr((lp, argno(base(p)), p))


    Calls to non-finalizer functions generate new paths by extending access paths
    in finalizePaths and writePaths. At a high level, paths are extended by mapping
    access paths in callees to the arguments of their callers. For each call callee(...,
    aᵢ, ...) in function f where a is the iᵗʰ argument to callee and p ∈ finalizePaths[callee,
    i], let pext = ap(a) ⊕ p. If base(pext) is a formal parameter of f, then: finalizePaths[f,
    argno(base(pext))] ⊇ nr(pext)


    For each call callee(..., aᵢ, ..., bⱼ, ...) in function f where a and b are the
    iᵗʰ and jᵗʰ arguments to callee, respectively, and (p, j, q) ∈ writePaths[callee,
    i], let qext = ap(b) ⊕ q and pext = ap(a) ⊕ p. Let qextB = base(qext) and pextB
    = base(pext). If both qextB and pextB are formal parameters of f, then: writePaths[f,
    argno(pextB)] ⊇ nr((pext, argno(qextB), qext))'
