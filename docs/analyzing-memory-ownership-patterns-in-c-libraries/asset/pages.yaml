  md: '# Analyzing Memory Ownership Patterns in C Libraries *


    Tristan Ravitch

    Department of Computer Sciences

    University of Wisconsin–Madison

    travitch@cs.wisc.edu


    Ben Liblit

    Department of Computer Sciences

    University of Wisconsin–Madison

    liblit@cs.wisc.edu


    # Abstract


    Programs written in multiple languages are known as polyglot programs. In part
    due to the proliferation of new and productive high-level programming languages,
    these programs are becoming more common in environments that must interoperate
    with existing systems. Polyglot programs must manage resource lifetimes across
    language boundaries. Resource lifetime management bugs can lead to leaks and crashes,
    which are more difficult to debug in polyglot programs than monoglot programs.


    We present analyses to automatically infer the ownership semantics of C libraries.
    The results of these analyses can be used to generate bindings to C libraries
    that intelligently manage resources, to check the correctness of polyglot programs,
    and to document the interfaces of C libraries. While these analyses are unsound
    and incomplete, we demonstrate that they significantly reduce the manual annotation
    burden for a suite of fifteen open source libraries.


    Categories and Subject Descriptors D.2.11 [Software Engineering]: Software Architectures—Languages;
    D.2.12 [Software Engineering]: Interoperability; D.2.13 [Software Engineering]:
    Reusable Software—Reusable libraries; D.3.2 [Programming Languages]: Language
    Classifications—C, Python; D.3.3 [Programming Languages]: Language Constructs
    and Features—Dynamic storage management, Procedures, functions, and subroutines;
    D.3.4 [Programming Languages]: Processors—Code generation, Memory management;
    E.1 [Data Structures]: Arrays, Records; F.3.2 [Logics and Meanings of Programs]:
    Semantics of Programming Languages—Program analysis


