  md: 'identify reference-counted types and their associated reference count management
    functions.


    Our algorithms automatically infer hundreds of annotations describing the resource
    ownership semantics of fifteen significant open source libraries, significantly
    reducing the manual annotation burden for those wishing to generate library bindings.
    While these inferred annotations clearly have applications to polyglot programming,
    they are also useful for understanding and documenting the behavior of complex
    C libraries.


