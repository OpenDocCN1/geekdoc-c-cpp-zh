    # 4.2 Identifying Owned Fields


    After all of the symbolic access paths in a library are constructed, we next identify
    the owned fields in the library. According to our resource ownership model from
    section 2, owned fields of a type are those fields that will be finalized when
    an object of that type is finalized. Our analysis determines this by analyzing
    the finalized access paths of each function: if a field of the argument of a finalizer
    function is finalized, that field is owned. That is, if some function f is a finalizer
    for its iᵗʰ formal parameter, all of the fields in finalizePaths[f, i] are owned
    fields.


    In figure 3, the function icalcomponent_free is a finalizer because the c parameter
    (of type icalcomponent*) is finalized (or NULL) on every path. The pvl_free and
    icalcomponent_free functions are finalizers as well (implementations not shown).
    We see that icalcomponent_free passes the return value of pvl_pop to a finalizer.
    pvl_pop returns the data from the head of its list argument through the access
    path (lst, ⟨head,data⟩). Thus, the value passed to the finalizer is (icalcomponent,
    ⟨components,head,data⟩); we conclude that this field of icalcomponent is owned.


    # 4.3 Transferred Ownership


    The key insight of the ownership transfer analysis is that ownership of any function
    argument stored into an owned field is transferred from the caller. Assume a function
    f has formal parameters a and b at positions i and j in the formal parameter list
    respectively. If (p, j, q) ∈ writePaths[f, i] where ap(b) is q (q is the degenerate
    access path of just the formal parameter b) and the last component of p is an
    owned field, as per section 4.2, then f transfers ownership of b to a.


    Returning to figure 3, the function pvl_push stores its d argument into a field
    of lst, which is summarized by the access path (lst, ⟨head,data⟩). icalcomponent_add_component
    calls pvl_push with a field of c, components, as an argument, extending the write
    access path to (c, ⟨components,head,data⟩). The first phase of the analysis identified
    the last component of this path as an owned field, and thus the c argument of
    icalcomponent_add_component assumes ownership of child. Note that icalcomponent_set_parent
    does not assume ownership of its parent parameter: the corresponding field is
    never finalized, and is thus not owned.


    Our access path construction proceeds backwards from an address across pointer
    dereferences, field accesses, union accesses, and array accesses. We stop the
    construction at SSA φ-nodes to avoid a potential exponential explosion of generated
    access paths. While this is unsound, we have not observed any missed ownership
    transfers in practice.


    # 5. An Improved Escape Analysis


    While the results of the transfer analysis are essential to minimize the effort
    of generating language bindings that automate resource management, an escape analysis
    still provides important information. If a pointer to an object escapes, but ownership
    of that object is not transferred, we still learn information about the lifetime
    of that object. While we cannot always automatically manage this lifetime, the
    user can at least be informed that some scope management is required. Helper functions
    could be used to pin objects with scoped lifetimes to keep them from being collected
    while references exist in a C library that are not visible to the garbage collector.
    While prior work has described an escape analysis for this purpose, we present
    a more precise analysis that eliminates many of the false positives of prior work.


    We describe a bottom-up summary-based flow-insensitive escape analysis with limited
    field and context sensitivity for C. This analysis is a form of stack escape analysis
    [3, 21], rather than a thread escape analysis [19]. Our analysis is based on a
    value flow escape graph, which is a value flow graph [9] with extra annotations.
    Our analysis is most similar to that of Whaley and Rinard [21], though ours is
    flow-insensitive and requires only a single graph per function. Like Whaley and
    Rinard [21], we analyze functions independently of their callers. We require this
    because callers may be written in another language and unavailable at analysis
    time. Furthermore, we trade precision for speed and simpler handling of callees.
    Instead of unifying the points-to escape graph of each callee into the graph of
    the caller at call sites, we use summary information to mark only the escaping
    parameters as escaping. This allows for more compact representations of callees
    at the cost of some of the precision of graph unification. We conservatively assume
    that values passed to callees with no summaries do escape. The value flow graph
    does not allow us to answer points-to queries, which we do not require, but it
    can be constructed in a single pass, unlike the points-to escape graph.


    Our value flow graph has two types of nodes: location nodes and sink nodes. An
    edge a → b denotes that values flow from a to b. A value escapes if there is a
    path from it to a sink. The analysis is conservative and identifies values that
    may escape. This approximation is appropriate in that false positives (values
    incorrectly identified as escaping) lead to leaks, not crashes.


    Sink nodes are created for (1) return statements in functions that return aggregate
    or pointer values and (2) stores to global variables, arguments, the return values
    of callees, and access paths thereof. A sink is also created for each escaping
    actual argument of a callee. The following statements induce edges in the value
    flow graph:


    +   - *a = b adds b → a or bₚ → a

    +   Assignments cause the source operand to flow to the destination operand. The
    edge bₚ → a is added if the right-hand side of the assignment is a field reference
    with concrete access path (b, ⟨p⟩); if there is no field access, the simpler form
    b → a is added.

    +   - return a adds a → sink_ret

    +   The returned value flows to the special return sink node.


    For example, the function CaseWalkerInit in figure 5 has the value-flow escape
    graph shown in figure 6. We represent location nodes as circles and sinks as rectangles.
    The argument src is represented by its location node, which flows into a field
    of the w argument. src escapes because there is a path from it to a sink.


    Function calls of the form f(a1, a2, ..., aN) act as a sequence of assignments
    *f₁ = a1, *f₂ = a2, ..., *f_N = aN where fᵢ is the node representing the iᵗʰ formal
