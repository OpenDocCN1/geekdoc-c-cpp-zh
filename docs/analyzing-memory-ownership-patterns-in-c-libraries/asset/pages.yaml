    \ of GObject, so the second algorithm recognizes them.\n\n# 9. Related Work\n\n\
    The C/C++ leak detector of Heine and Lam [6] is very similar in spirit to our\
    \ work. They present an inference algorithm based on inequality constraints to\
    \ assign an owner to each object in a program. Our algorithms work on partial\
    \ programs (libraries) and are formulated in terms of symbolic access paths. Our\
    \ major contributions beyond their work are to (1) recognize ownership semantics\
    \ for C objects with a generalized notion of allocators and finalizers (instead\
    \ of C++) and (2) incorporate shared ownership via reference counting and inferred\
    \ contracts on function pointers used in library code. Rayside and Mendel [17]\
    \ take a more dynamic approach with ownership profiling; they report detailed\
    \ hierarchical ownership information that is more precise than what we can achieve\
    \ statically. Negara et al. [13] describe an inference algorithm based on liveness\
    \ analysis for identifying ownership transfer semantics in message passing applications.\
    \ In cases where ownership can be proved to transfer to another process via message\
    \ passing, the copy of the message can be skipped and the receiving process can\
    \ assume ownership of the message directly. Boyapati et al. [1] address ownership\
    \ at the type level with work on ownership types. Müller and Rudich [12] extend\
    \ Universe Types to support ownership transfer. Their notion of temporary aliases\
    \ correspond closely to our transient references. In effect, we infer ownership\
    \ types for C. Focusing specifically on memory, Wegiel and Krintz [20] discuss\
    \ methods for sharing heap-allocated objects between different managed run-time\
    \ environments. They do not need to establish an owner for each heap object because\
    \ the run-time environments are able to cooperate and safely share objects. Since\
    \ one of our run-time systems is C, which has no facilities for such object sharing,\
    \ we must infer ownership.\n\nAs discussed in section 7, we do not verify the\
    \ correctness of reference count handling in the libraries we analyze. Emmi et\
    \ al. [4] present an analysis to perform this complex verification building on\
    \ the Blast model checker. Our work is complementary in that Emmi et al. require\
    \ manual specification of the set of reference-counted types, which could be automated\
    \ with our analysis.\n\n# 10. Conclusion\n\nWe have described an ownership model\
    \ for C resources to make sharing resources between languages in polyglot programs\
    \ safer. Documenting the ownership properties of even moderately large programs\
    \ by hand is difficult and labor-intensive. We have described the allocator and\
    \ finalizer analyses of Ravitch et al. in terms of our ownership model. We have\
    \ discussed the difficulty in relying only on an escape analysis to model the\
    \ ownership of objects in C libraries: many manual annotations are required to\
    \ compensate for the prevalence of escaping function parameters when true ownership\
    \ transfer is rare. We addressed this difficulty by describing a new ownership\
