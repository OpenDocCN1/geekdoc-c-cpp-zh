  md: 'Note that the transfer analysis requires an accurate view of the finalizer
    functions in a given library. The finalizer analysis is beyond the scope of this
    paper, and the one used for this evaluation was not able to identify all of the
    finalizers in the libraries used for this evaluation. To compensate, we manually
    annotated four missed finalizers in ical and two in glpk. The finalizers in archive,
    freenect, and fuse were automatically identified. We have exhaustively inspected
    the results for glpk or gsl and some finalizers may have been missed in those
    libraries; if so, our ownership transfer analysis would identify more transferred
    parameters if the missed finalizers were manually annotated. We note that manually
    annotating finalizers is significantly easier than manually examining possible
    ownership transfers because finalizers tend to follow uniform naming conventions.


    In the remainder of this subsection, we provide a more detailed analysis of the
    results for three of the libraries in our evaluation. These three libraries were
    chosen because they have interesting ownership transfer properties while being
    small enough to thoroughly evaluate by hand.


    # 8.1.1 ical


    The ical library provides a representation of calendar data. It has many functions,
    but only a few actually transfer ownership of objects. The primary data structures
    in this library form a tree; when an item is added to a tree representing some
    calendar event, that tree assumes ownership of the new item.


    The two analyses agree that 10 parameters induce ownership transfers. The escape
    analysis flags over 100 extra parameters, however. Some of these non-transferred
    escapes can be explained by the presence of a container API that does not own
    its elements: adding an item to the container causes an escape but the container
    does not own anything except its own internal structures. Many of the remaining
    discrepancies arise from parent pointers. When one item is inserted as the child
    of another in a tree, the parent field of the newly inserted item is updated to
    point to its new parent element. This causes the child to escape into the parent
    and the parent to escape into the child. Similarly, many functions cause one or
    more of their parameters to escape into themselves. These self-escapes could potentially
    be special-cased when generating library bindings.


    One function with an escape annotation but no transfer annotation was particularly
    interesting. This function adds an attachment to another object; however, attachments
    are the one resource in ical that are reference-counted. Since attachments are
    reference-counted, they do not have a finalizer function that our analysis could
    automatically identify. Adding a manual annotation to the unref function for attachments
    causes the analysis to correctly identify the ownership transfer in question.
    This suggests that it may be prudent to consider unref functions for reference-counted
    resources as finalizers for the purposes of the ownership transfer analysis.


    # 8.1.2 freenect


    This library provides a driver and userspace control for Kinect hardware. Our
    analysis infers ownership transfer of two parameters in two different functions,
    freenect_init and fnusb_init. Both of these inferences are incorrect. The root
    cause is fnusb_init, which freenect_init calls. The parameter in question is an
    optional libusb_context. If the caller provides a context, the library keeps a
    reference to it but does not assume ownership. However, if the caller does not
    provide a context, fnusb_init allocates its own context over which it does assume
    ownership. This ownership is recorded with a flag alongside the reference to the
    libusb_context. This violates one of the assumptions of our ownership transfer
    analysis: that fields are either always owned or never owned. This particular
    field is sometimes owned. While these inferred transfer annotations are not correct,
    the analysis still relieves the user of having to provide


    eleven annotations to compensate for the overzealous escape analysis. The transfer
    analysis also reduced the amount of code that must be inspected manually to two
    functions.


    We could adapt our analysis to make special note of fields that are only sometimes
    finalized. Perhaps we could restrict it to fields that are finalized only based
    on some flag. These conditionally-owned fields could be reported in diagnostics
    and in generated documentation; with this extra information, users could decide
    on the correct ownership semantics for their case. Although adding to the manual
    inspection burden for users is undesirable, our analysis can show users exactly
    where the ambiguity arises, limiting the scope of the inspection to just unusual
    finalizers, rather than potentially every function in the library.


    # 8.1.3 fuse


    The fuse library is the userspace component of the Filesystem in Userspace project
    for some *NIX systems. This library has only a handful of ownership transfers;
    three of the four are transfers of a single type. In these cases, fuse_session
    objects assume ownership of communication channels through constructors and an
    explicit fuse_session_add_chan function.


    The fourth ownership transferring function, fuse_session_new, is more interesting.
    It creates a new fuse_session with two parameters: a void* for arbitrary user-provided
    data and a struct with metadata. Among the metadata is an optional function to
    finalize the user-provided data, which the finalizer for fuse_session objects
    invokes if it is present.


    This function exhibits an unforeseen interaction with our assumption that fields
    will either always be owned or never owned: the user has control over the ownership
    of a field, and our analysis finds evidence within the library being analyzed
    that the field may be owned. This case suggests that our restriction, as well
    as our notion of finalizers, could benefit from more nuance. In this case, we
    see that a field is conditionally finalized based on a value provided by the user,
    whereas the example in freenect made its decision to finalize or not based on
    a field set by the library. While the correctness of the transfer annotation in
    the case of this user data parameter to fuse_session_new may depend on the preferences
    of the library user, the transfer analysis still saves a user from having to provide
    at least 24 annotations to prevent leaks due to the escape analysis. Furthermore,
    the user need only examine the four annotations inferred by the transfer analysis.
    In reading the documentation on how to call fuse_session_new, the meaning of the
    transfer annotation on the user data parameter would become clear.


    One might be tempted to generate library bindings that never transfer ownership
    of user data pointers to a C library. This example shows that such special treatment
    for even this extremely common C idiom is not completely safe. In most cases user
    data is not owned, but when it is the type system bears no indication one way
    or another.


    Most of the escaping parameters whose ownership is not transferred are other user
    data pointers. There are also a few instances of self-escaping parameters as in
    ical. A third class of escapes are due to an imprecision in the escape analysis
    that could be fixed. The fuse library uses non-escaping heap allocations; parameters
    stored into these heap allocations are reported as escaping because our escape
    analysis does not take advantage of the fact that pointers returned by allocators
    like malloc are not aliased by anything. This could be fixed by treating heap-allocated
    locals in the same way that we treat non-escaping stack-allocated locals.


