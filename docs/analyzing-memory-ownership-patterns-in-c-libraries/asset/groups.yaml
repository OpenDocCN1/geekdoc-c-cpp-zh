    \n大多数未转移所有权的逃逸参数是其他用户数据指针。还有一些与ical中类似的自逃逸参数实例。第三类逃逸是由于逃逸分析中的不精确性导致的，这种不精确性是可以修复的。fuse库使用非逃逸的堆分配；存储到这些堆分配中的参数被报告为逃逸，因为我们的逃逸分析没有利用这样一个事实：即像malloc这样的分配器返回的指针不会被任何东西别名化。这可以通过像对待非逃逸栈分配局部变量一样对待堆分配局部变量来修复。\n\
    \n### 8.2 引用计数分析\n\n表2总结了我们的引用计数分析的结果。该分析是基于dbus-1、exif、gobject-2.0和gio-2.0库设计的。对于每个库，我们报告（1）库中函数的数量，（2）函数的数量，这些函数是\n\
