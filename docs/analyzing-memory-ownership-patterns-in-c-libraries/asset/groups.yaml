    # 1. Introduction


    High-level programming languages have been gaining acceptance in many application
    domains where unsafe low-level languages like C and C++ were once the only option.
    For example, Python and JavaScript have a significant presence in the desktop
    application space. Additionally, Python has gained acceptance in the scientific
    computing community [14]. Unfortunately, these high-level languages do not exist
    in a vacuum. They depend on code written in unsafe lower-level languages for,
    among other reasons, performance and interoperability. Some performance-sensitive
    pieces of code simply cannot be rewritten in the desired high-level language.
    In other cases, it is possible but not economically feasible to rewrite working
    and tested code, so the original implementation must be used from the high-level
    language.


    Production-quality high-level languages support calling functions from libraries
    written in other languages through foreign function interfaces (FFIs). High-level
    language programs using FFIs execute code from more than one language, making
    them polyglot programs. A critical challenge in writing correct polyglot programs
    lies in managing the flow of resources across language boundaries. Programs lacking
    a precise cross-language ownership semantics are vulnerable to resource leaks,
    threatening reliability. Unclear ownership semantics can also lead to crashes
    induced by use-after-free or double-free errors. Both of these types of errors
    are more difficult to debug in polyglot programs, as common debugging tools target
    programs written in a single language.


    Most low-level languages like C do not provide any means for describing, much
    less checking, object ownership semantics. Instead, this critical information
    must be conveyed through documentation or recovered through static analysis. Library
    interfaces defined in C typically refer to dynamically-allocated resources by
    their address (a pointer). Unfortunately one cannot simply call free on all pointers
    obtained from a low-level language to release the associated resources, or finalize
    them. This approach fails because, while C functions expose most resources through
    pointers, they use pointers for many other purposes as well.


    Consider the two C function declarations in figure 1. Each returns a char*. The
    value returned by strdup must be freed to prevent memory leaks, but freeing the
    value returned by asctime will cause a crash. The caller owns the result of strdup
    but not the result of asctime. Furthermore, some dynamically-allocated resources
    may require specialized finalizer functions instead of generic free. Consider
    fopen and fclose: calling free on the result of fopen is a partial resource leak.
    Thus, functions returning managed resources must be identified along with their
    associated resource finalizers.'
