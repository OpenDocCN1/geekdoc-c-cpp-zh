    \n# 2.1 Memory Ownership in C\n\nA memory allocator is an abstraction over the\
    \ most prevalent resource in most programs: dynamically allocated memory. The\
    \ standard C library’s allocator and finalizer functions are malloc and free,\
    \ respectively. When the memory allocator owns a piece of memory (i.e., the memory\
    \ is unallocated), it is an error for any other part of the program to use it.\
    \ When the allocator function is called, it completely transfers ownership of\
    \ the memory to the caller via the returned owning reference.\n\nComplex resources\
    \ may own other resources through owned pointer fields. Finalizers for these complex\
    \ resources must finalize their owned resources to obey the ownership model and\
    \ to avoid leaks, as in figures 2 and 3. The icalcomponent type is a resource\
    \ allocated with icalcomponent_new. It owns a component list, along with each\
    \ of the components in the list of children. The finalizer for this type, icalcomponent_free,\
    \ finalizes the list of children as well as the child components before finalizing\
    \ the component itself with a call to free on line 23.\n\nOwnership extends beyond\
    \ just allocators and finalizers. For example, the function icalcomponent_remove_component\
    \ removes a child component from a component without finalizing it."
