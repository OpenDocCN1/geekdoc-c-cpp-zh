  mdcn: "\n\n### 表 2. 推断出的引用计数标注数量。\n\n“Ref/Unref”指推断出的 IncRef 和 DecRef 函数对的数量，而非单个函数。\n\
    \n| 分析的库 | 引用计数 | | | |\n|---|---|---|---|---|\n| 名称 | 函数 | 分配器 | 终结器 | Ref/Unref\
    \ |\n| cairo | 379 | 2 | 2 | 4 |\n| dbus-1 | 804 | 36 | 8 | 11 |\n| exif | 142\
    \ | 16 | 5 | 7 |\n| fontconfig | 196 | 51 | 8 | 3 |\n| freetype | 289 | 9 | 6\
    \ | 3 |\n| gio-2.0 | 1772 | 58 | 11 | 9 |\n| glib-2.0 | 1529 | 228 | 39 | 16 |\n\
    | gobject-2.0 | 394 | 15 | 3 | 1 |\n| soup-2.4 | 530 | 46 | 6 | 3 |\n\n```\nvoid\
    \ exif_mem_free(ExifMem *mem, void *d)\n{\n    if (!mem) return;\n    if (mem->free_func)\
    \ {\n        mem->free_func(d);\n        return;\n    }\n}\n```\n\n### 图 11. exif\
    \ 库中的终结器\n\n分配器，(3) 作为终结器的函数数量，以及 (4) IncRef 和 DecRef 函数对的数量。与我们之前的所有权转移分析一样，引用计数分析需要准确了解每个库中存在的分配器和终结器。为了识别全部\
    \ allocators 和 finalizers，dbus-1 库需要两条手动标注，exif 需要四条，gobject 需要一条，glib 需要七条。其中一些库使用自定义内存分配器，而另一些库的终结器与我们的工具所使用的终结器概念不完全吻合，因为它们包含额外的非\
    \ NULL 检查。图 11 展示了一个示例。在第 4 行，该终结器检查它调用的一个函数指针是否为非 NULL。扩展分配器和终结器识别分析超出了本工作的范围。\n\
    \n该分析在多个方面很有用。首先，它提醒用户其库使用了引用计数。我们的实验在未预期的库中发现了引用计数类型，包括 ical 和 libusb。引用计数在这两个库中都不是主要的资源管理方式，但仍然很重要，而且仅靠视觉扫描并不明显。更重要的是，即使在引用计数是主要资源管理方式的情况下，我们的引用计数分析也能识别多态的\
    \ IncRef/DecRef 函数及其操作的类型。例如，在 dbus-1 中，我们识别出 dbus_auth_unref 和 dbus_auth_ref\
    \ 是三种相关类型（DBusAuthClient、DBusAuthServer 和 DBusAuth）引用计数的多态管理器。\n\ngio-2.0 库凸显了在多态引用计数器存在时引用计数分析的重要性。尽管\
    \ gio-2.0 有 9 对由分析识别出的 IncRef/DecRef 函数对，但它还定义了另外 138 种由 gobject-2.0 库中定义的 g_object_unref\
    \ 和 g_object_ref 函数管理的类型。请注意，这 9 种具有自己引用计数函数的类型不能使用通用的 gobject-2.0 引用计数函数来管理，尽管这些类型的名称中没有任何信息暗示这一点。第\
    \ 7.2 节描述了两种算法，用于识别哪些类型由多态引用计数函数管理。第一种依赖于类型特定终结器的存在，第二种仅依赖于结构子类型。第二种算法在实践中更可靠，识别出\
    \ 23 种由 gobject-2.0 引用计数函数管理的类型，而第一种算法遗漏了这些类型。第一种算法遗漏这些类型是因为它们没有需要终结的类型特定资源，因此没有定义终结器。但是，它们仍然是\
    \ GObject 的结构子类型，因此第二种算法能够识别它们。\n\n## 9. 相关工作\n\nHeine 和 Lam [6] 的 C/C++ 泄漏检测器在本质上与我们的工作非常相似。他们提出了一种基于不等式约束的推断算法，为程序中的每个对象分配一个所有者。我们的算法则针对部分程序（库）工作，并使用符号化访问路径表示。我们相对于他们工作的主要贡献是：(1)\
    \ 通过泛化的分配器和终结器概念（而非 C++）来识别 C 对象的所有权语义；(2) 通过引用计数和库代码中函数指针的推断契约来纳入共享所有权。Rayside\
    \ 和 Mendel [17] 采取了一种更动态的方法进行所有权分析；他们报告了详细的分层所有权信息，比我们通过静态分析获得的结果更精确。Negara 等人\
    \ [13] 描述了一种基于活跃性分析的推断算法，用于识别消息传递应用中的所有权转移语义。在可以通过消息传递证明所有权已转移给另一个进程的情况下，可以跳过消息的副本，接收进程可以直接承担消息的所有权。Boyapati\
    \ 等人 [1] 从类型层面入手，研究了所有权类型。Müller 和 Rudich [12] 扩展了 Universe Types 以支持所有权转移。他们提出的临时别名概念与我们的瞬态引用非常对应。实际上，我们是在为\
    \ C 语言推断所有权类型。Wegiel 和 Krintz [20] 专门关注内存方面，讨论了在不同托管运行时环境之间共享堆分配对象的方法。他们无需为每个堆对象建立所有者，因为这些运行时环境能够协同工作并安全地共享对象。由于我们的运行时环境之一是\
    \ C，它没有这种对象共享机制，因此我们必须推断所有权。\n\n如第 7 节所述，我们并不验证所分析库中引用计数处理正确性。Emmi 等人 [4] 提出了一种分析，在\
    \ Blast 模型检查器之上执行这一复杂验证。我们的工作是互补的，因为 Emmi 等人需要手动指定引用计数类型的集合，而这可以通过我们的分析自动化完成。\n\
    \n## 10. 结论\n\n我们描述了一种针对 C 资源的所有权模型，以使多语言程序中语言之间的资源共享更加安全。即使对于中等规模的程序，手动记录所有权属性也是困难且劳动密集的。我们用我们的所有权模型描述了\
    \ Ravitch 等人的分配器和终结器分析。我们讨论了仅依靠逃逸分析来建模 C 库中对象所有权的困难：由于真正的所有权转移很少发生，而逃逸函数参数却很普遍，因此需要大量手动标注来弥补。我们通过描述一种基于所有权模型的新的所有权转移分析解决了这一困难。我们还论证了逃逸分析的结果对于理解库的语义仍然有用。我们提出了一种可扩展、可组合的逃逸分析，以进一步减少误报逃逸标注的数量。我们描述了这种逃逸分析在情境敏感性和字段敏感性方面的权衡，这些权衡适用于分析一类重要的不完整程序：库代码。我们还提出了一种自动识别引用计数类型及其相关引用计数管理函数的分析。\n\
    \n我们的算法自动推断出数百条标注，描述了十五个重要开源库的资源所有权语义，显著减少了那些希望生成库绑定的人所需的手动标注负担。虽然这些推断出的标注显然可用于多语言编程，但它们在理解和记录复杂\
    \ C 库的行为方面也很有用。\n\n## 参考文献\n\n- [1] C. Boyapati, B. Liskov, and L. Shrira. Ownership\
