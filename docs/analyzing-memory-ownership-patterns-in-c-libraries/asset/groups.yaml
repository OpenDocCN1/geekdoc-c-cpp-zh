    \n### 8.1 所有权转移分析\n\n本节评估所有权转移分析的有效性，特别关注与仅依赖逃逸分析结果相比，在减少手动注解负担方面的作用。\n\n表1. 推断出的转移注解和逃逸注解的数量\n\
    \n| 分析的库 | 函数数 | 转移 | 契约 | 间接 | 直接 |\n|---|---|---|---|---|---|\n| archive | 267\
    \ | 9 | 33 | 18 | 47 |\n| freenect | 61 | 2 | 0 | 5 | 13 |\n| fuse | 188 | 4 |\
    \ 5 | 106 | 28 |\n| glpk | 1072 | 0 | 67 | 54 | 149 |\n| gsl | 3910 | 39 | 68\
    \ | 21 | 88 |\n| ical | 1045 | 10 | 0 | 7 | 142 |\n\n表1显示了六个不同规模库的推断注解数量。所有权转移分析是基于archive和ical库设计的。其余库可视为测试集。表中第二列记录每个库中的函数数量。“转移”列报告了我们的分析识别出的、从调用方转移所有权的函数参数数量。其余列对逃逸分析的结果进行了细分。\n\
    \n我们将逃逸参数分为三类：契约逃逸、间接逃逸和直接逃逸。契约逃逸是指通过函数指针调用而逃逸的参数，这些调用的一些目标是已知的，并且所有这些目标都认为该参数不会逃逸。我们将这些参数称为契约逃逸，因为只有当传递给函数指针的契约被违反时，即第6节的假设不适用时，它们才会逃逸。间接逃逸是指作为参数传递给通过函数指针进行的调用，而这些函数指针无法识别出任何目标。然而，在实践中，参数真正通过函数指针逃逸的情况很少见，因为这会使代码难以推理。如果这些分析结果的使用者能够做出这一假设，那么这种区别可能会带来显著差异。例如，fuse客户端库的间接逃逸数量远多于直接逃逸。表1中的直接逃逸是其余逃逸参数：即简单逃逸，例如逃逸到全局变量，而不是由于通过函数指针的调用。\n\
    \n虽然库显然不期望契约逃逸发生，但凭借库提供的初始化器，它们仍然提供了更多信息。每个导致契约逃逸的间接函数调用都会对为该调用解除引用的函数指针施加一个契约。我们可以说，任何可能被该函数指针指向的函数都应遵守其参数不逃逸的契约。契约逃逸在多态行为的库中最常见，正如archive库所示。在这个库中，多态通过存储在每个对象中的函数指针实现。这些函数指针字段在对象创建时使用库中定义的函数进行初始化，从而使我们能够如第6节所建议的那样推断相应的契约。需要注意的是，如果我们仅仅知道某个间接函数调用的一部分目标，我们不会将该调用的参数视为契约逃逸。只有当所有已知调用目标都认为该参数不会逃逸时，我们才将其标记为契约逃逸。\n\
    \n每个转移注解都有一个对应的直接逃逸注解。如果使用所有权转移分析的结果而非逃逸分析的结果来自动化资源管理，那么表1中“直接”和“转移”列之间的差异就是所有权转移分析所节省的手动注解数量。如果没有所有权转移分析，每个额外的逃逸注解都会引入一个必须用手动注解来填补的内存泄漏。这一差异在glpk和ical中非常显著：所有权转移分析在每个库中节省了超过100个手动注解。此外，glpk似乎从不转移所有权。然而，如第5节所讨论的，逃逸注解作为对象生命周期文档对用户仍然有用。\n\
    \n请注意，所有权转移分析需要准确了解给定库中的终结器函数。终结器分析超出了本文的范围，用于本次评估的分析无法识别本次评估所用库中的所有终结器。为了弥补这一点，我们手动注释了ical中四个遗漏的终结器和glpk中两个遗漏的终结器。archive、freenect和fuse中的终结器是自动识别的。我们已经详尽检查了glpk和gsl的结果，这些库中可能遗漏了一些终结器；如果确实如此，那么手动注释这些遗漏的终结器后，我们的所有权转移分析将识别出更多被转移的参数。我们注意到，手动注释终结器比手动检查可能的所有权转移要容易得多，因为终结器往往遵循统一的命名约定。\n\
    \n在本小节的其余部分，我们将对评估中的三个库的结果进行更详细的分析。选择这三个库是因为它们具有有趣的所有权转移特性，同时规模足够小，可以手动全面评估。\n\
    \n#### 8.1.1 ical\n\nical库提供了日历数据的表示。它有很多函数，但真正转移对象所有权的函数很少。该库中的主要数据结构形成一棵树；当一个条目被添加到表示某个日历事件的树中时，该树承担新条目的所有权。\n\
    \n这两种分析一致认为有10个参数会导致所有权转移。然而，逃逸分析标记了超过100个额外的参数。其中一些非转移逃逸可以通过存在一个不拥有其元素的容器API来解释：向容器添加条目会导致逃逸，但容器除了自己的内部结构外不拥有任何东西。许多剩余的差异源于父指针。当一个条目作为另一个条目的子节点插入树中时，新插入条目的父字段会被更新为指向其新的父元素。这导致子条目逃逸到父条目中，同时父条目也逃逸到子条目中。类似地，许多函数会导致其一个或多个参数逃逸到它们自身中。这些自逃逸在生成库绑定时可以特殊处理。\n\
    \n有一个函数带有逃逸注解但没有转移注解，特别有趣。该函数向另一个对象添加一个附件；然而，附件是ical中唯一进行引用计数的资源。由于附件是引用计数的，它们没有我们的分析可以自动识别的终结器函数。为附件的unref函数添加手动注解，使分析能够正确识别该所有权转移。这表明，出于所有权转移分析的目的，将引用计数资源的unref函数视为终结器可能是明智的。\n\
    \n#### 8.1.2 freenect\n\n该库提供了Kinect硬件的驱动程序和用户空间控制。我们的分析推断出在两个不同函数freenect_init和fnusb_init中有两个参数发生所有权转移。这两个推断都是不正确的。根本原因在于freenect_init调用的fnusb_init函数。所讨论的参数是一个可选的libusb_context。如果调用方提供了上下文，库会保留对它的引用，但不会承担所有权。然而，如果调用方没有提供上下文，fnusb_init会分配自己的上下文，并对其承担所有权。该所有权与对libusb_context的引用一起通过一个标志记录。这违反了我们的所有权转移分析的一个假设：字段要么始终被拥有，要么从未被拥有。这个特定字段有时是被拥有的。虽然这些推断出的转移注解并不正确，但该分析仍然使用户无需提供十一个注解来弥补过于激进的逃逸分析。所有权转移分析还将必须手动检查的代码量减少到两个函数。\n\
    \n我们可以调整分析，对仅有时被终结的字段做特别标记。也许我们可以将其限制为仅基于某个标志而终结的字段。这些有条件拥有的字段可以在诊断信息和生成的文档中报告；有了这些额外信息，用户就可以为自己的场景决定正确的所有权语义。虽然增加用户手动检查的负担是不可取的，但我们的分析可以向用户准确展示歧义产生的位置，将检查范围限制在异常终结器上，而不是可能存在于库中的每一个函数。\n\
    \n#### 8.1.3 fuse\n\nfuse库是某些*NIX系统的Filesystem in Userspace项目的用户空间组件。该库只有少数几个所有权转移；四个中有三个是单一类型的转移。在这些情况下，fuse_session对象通过构造函数和显式的fuse_session_add_chan函数承担通信通道的所有权。\n\
    \n第四个转移所有权的函数fuse_session_new更有趣。它使用两个参数创建一个新的fuse_session：一个用于任意用户提供数据的void*，以及一个包含元数据的struct。元数据中包含一个可选的用于终结用户提供数据的函数，如果存在，fuse_session对象的终结器会调用它。\n\
    \n该函数与我们关于字段要么始终被拥有、要么从未被拥有的假设产生了意想不到的交互：用户控制着某个字段的所有权，而我们的分析在正在分析的库中找到了该字段可能被拥有的证据。这一案例表明，我们的限制以及我们对终结器的概念，可以从更细微的区分中受益。在这种情况下，我们看到字段是根据用户提供的值有条件地终结的，而freenect中的示例是根据库设置的字段来决定是否终结。虽然对于fuse_session_new的这个用户数据参数，转移注解的正确性可能取决于库用户的偏好，但所有权转移分析仍然使用户无需提供至少24个注解来防止因逃逸分析导致的泄漏。此外，用户只需检查所有权转移分析推断出的四个注解。在阅读如何调用fuse_session_new的文档时，用户数据参数上的转移注解的含义就会变得清晰。\n\
