- md: "\n# Methods and Selectors\n\nCompiled selectors identify name, not method implementations.\
    \ The display method for one class, for example, has the same selector as display\
    \ methods defined in other classes. This is essential for polymorphism and dynamic\
    \ binding; it lets you send the message to receivers belonging to different classes.\
    \ If there were one selector per method implementation, a message would be different\
    \ from a function class.\n\nA class and an instance method with the same name\
    \ are assigned the same selector. However, because of their separate domains,\
    \ there's no confusion between the two. A class could define a display method\
    \ in addition to a display instance method.\n\n# Method Return and Parameter Types\n\
    \nThe messaging routine has access to method implementations only through selectors,\
    \ so it treats all methods with the same selector alike. It discovers the return\
    \ type of a method, and the data types of its parameters, from the selector. However,\
    \ except for messages sent to typed receivers, dynamic binding requires all implementations\
    \ of identically named methods to have the same return type and same parameter\
    \ types (Statically typed receivers are an exception to this rule because the\
    \ compiler can learn about the method implementation from the class type).\n\n\
    Although identically named class methods and instance methods are represented\
    \ by the same selector, they can have different parameter types and return types.\n\
    \n# Varying the Message at Runtime\n\nThe performSelector:performSelector:withObject;\
    \ and performSelector:withObject:with methods defined in the NSObject protocol,\
    \ take SEL as their initial parameters. All three methods map directly into the\
    \ messaging function. For\n\n```\n[friend performSelector:@selector(gossipAbout:)\n\
    withObject:aNeighbor];\n```\n\nis equivalent to:\n\n```\n[friend gossipAbout:aNeighbor];\n\
    ```\n\nThese methods make possible to vary a message at runtime, just as it's\
    \ possible to vary the object that receives the message. Variable names can be\
    \ used in both halves of a message expression:\n\n```\nid helper = getTheReceiver();\n\
    SEL request = getSelector();\n[helper performSelector:request];\n```\n\nIn this\
    \ example, the receiver (helper) is chosen at runtime (by the fictitious getReceiver\
    \ function), and the method the receiver is asked to perform (request) is also\
    \ determined at runtime (by the equally fictitious getSelector function).\n\n\
    # CHAPTER 10 Selectors\n\n## Selectors\n\n> Note: performSelector: and its companions\
    \ return an object of type id. If the method's performed returns a different type,\
    \ it should be cast to the proper type. (However, casting doesn't work for all\
    \ types; the method should return a pointer or a compatible type with a pointer.)\n\
    \n# The Target-Action Design Pattern\n\nIn its treatment of user-interface controls,\
    \ AppKit makes good use of the ability to vary when giving instructions to an\
    \ application. Most of the message at runtime.\n\nNSControl objects are graphical\
    \ devices that can be used to give instructions to an application. Most resemble\
    \ real-world control devices such as buttons, switches, knobs, text fields, dials,\
    \ menu items, and the text. In software, these devices stand between the application\
    \ and the user. They interpret events coming from hardware devices such as the\
    \ keyboard and translate them into application-specific instructions. For example,\
    \ a button labeled \"Find\" would translate a mouse click into an instruction\
    \ for the application to start searching.\n\nAppKit defines a template for creating\
    \ control devices and defines a few off-shelf devices of its own. For example,\
    \ NSButton defines an object that you can assign to an NS instance and initialize\
    \ with a size, a label, a font, and a keyboard shortcut. When the user clicks\
    \ the button (or uses the shortcut), the NSButton sends a message instructing\
    \ the application to do something. To do this, NSButton object must be initialized\
    \ not just with an image, a size, and a label, but with message to send and who\
    \ to send it to. Accordingly, an NSButton is initialized for an action message\
    \ (the method it selects in the message sends) and a target (the object should\
    \ receive the message).\n\n```\n[myButton action:@selector(theReap:)]\n[myButton\
    \ target:anObject];\n```\n\nWhen the user clicks the corresponding button, the\
    \ button sends the message using the NSObject protocol method performSelector:with:.\
    \ All messages take a single parameter, the id of control sending the message.\n\
    \nIf Objective-C didn't allow the message to be varied, all NS objects would have\
    \ to send the same message; the name of the message would be frozen in the NSButtoncell\
    \ code. Instead of implementing a mechanism for interacting users across all controls,\
    \ buttons and other controls would have to contain the content of the message.\
    \ Constrained messaging would make it difficult for any object to respond to more\
    \ than one button. There would either be one target for each button, or the target\
    \ object would have to discover which button the message came from and accordingly.\
    \ Each time you rearranged the user interface, you would also have to reimplement\
    \ the method that responds to the action message. An absence of dynamic messaging\
    \ would create an unnecessary complication that Objective-C happily avoids.\n\n\
    # Avoiding Messaging Errors\n\nIf an object receives a message to perform that\
    \ isn't in its repertoire, an error results. It's the same sort of error calling\
    \ a nonexistent function. But because messaging occurs at runtime, the error often\
    \ isn't evident until the program executes.\n\n# CHAPTER 10 Selectors\n\n## Selectors\n\
    \nIt's relatively easy to avoid this error when the message selector is constant\
    \ and the class of the receiving object is known. As you write your programs,\
    \ you can make sure that the receiver is able to respond. If the receiver is statically\
    \ typed, the compiler performs this test for you.\n\nHowever, if the message selector\
    \ or the class of the receiver varies, it may be necessary to postpone this test\
    \ until runtime. The respondsToSelector: method, defined in the NSObject class,\
    \ tests whether a receiver can respond to a message. It takes the method selector\
    \ as a parameter and returns whether the receiver has access to a method matching\
    \ the selector:\n\n```\nif ([object respondsToSelector:@selector(setOrigin:])\n\
    \    [anObject setObjectOrigin:0.0 0.0];\nelse\n    fprintf(stderr,\"%s can't\
    \ be placed\\n\",\n    [NSString stringWithClass((anObject class)) UTF8String]);\n\
    ```\n\nThe respondsToSelector: runtime test is especially important when you send\
    \ messages to objects that you don't have control over a variable that can set.\
    \ For example, if you write code that sends a message to an object represented\
    \ by a variable that others can set, you should make sure the receiver implements\
    \ a method that can respond to the message.\n\n> Note: An object can also arrange\
    \ to have messages it receives forwarded to other objects if it doesn't respond\
    \ to them directly. In that case, from the caller's perspective, the object appears\
    \ to handle the message directly, even though it handles the message indirectly\
    \ by forwarding it to another object. See \"Message Forwarding\" in Objective-C\
    \ Runtime Programming Guide for more information.\n\n# Exception Handling\n\n\
    The Objective-C language has an exception-handling syntax similar to that of Java\
    \ and C++. By using this syntax with Exception, NSError, or custom classes, you\
    \ can add robust error-handling to your programs. This chapter provides a summary\
