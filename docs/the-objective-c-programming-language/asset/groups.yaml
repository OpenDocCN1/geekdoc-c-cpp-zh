    # GLOSSARY


    **link** time when files compiled from different source modules are linked into
    a single program. Decisions made by the linker are constrained by the compiled
    code and ultimately by the information contained in source code.


    **message** In object-oriented programming, the method selector (name) and accompanying
    parameters that tell the receiving object in a message what to do.


    **message expression** In object-oriented programming, an expression that sends
    a message to an object. In the Objective-C language, message expressions are enclosed
    within square brackets and consist of a receiver by a message (method selector
    and parameters).


    **method** In object-oriented programming, a procedure that can be executed by
    an object.


    **mutex** short for *mutual exclusion* semaphore. An object used to synchronize
    thread execution.


    **namespace** A logical subdivision of a program which names belong to. Symbols
    in one namespace do not conflict with identically named symbols in another namespace.
    For example, in Objective-C, the instance methods of a class are in a unique namespace
    for the class. Similarly, the methods of a class are in their own namespace, and
    the instance variables of a class are in their own namespace.


    **nil** in the Objective-C language, an object *id* with a value of 0.


    **object** a programming unit that groups a data structure (instance variables)
    and the operations (methods) that can use or affect them. Objects are the principal
    building blocks of object-oriented programming.


    **outlet** An instance variable that points to another object. Instance variables
    are a way for an object to keep track of the objects to which it may send messages.


    **polymorphism** In object-oriented programming, the ability of different objects
    to respond, each in its own way, to the same message.


    **procedural programming language** A language, such as C, that organizes a program
    as a set of procedures that have definite boundaries and ends.


    **protocol** in the Objective-C language, the declaration of a group of methods
    not associated with any class. Each can also conform *formal protocol*, *informal
    protocol*.


    **receiver** In object-oriented programming, the object that is sent a message.


    **reference counting** A memory-management technique in which each entity claims
    ownership of an object increments its reference count and decrements it. When
    the object''s count reaches zero, it is deallocated. This technique allows one
    instance of an object to be safely shared among other objects.


    **remote message** A message sent from one application to an object in another
    application.


    **remote object** An object in another application, that''s a potential receiver
    for a remote message.


    **runtime** The time after a program is launched and while it''s running. Decisions
    made at runtime can be influenced by the choices made.


    **selector** in the Objective-C language, the name of a method when it''s used
    in a source-code message to an object, or the identifier that replaces the name
    when the source code is compiled. *SEL*.


    **static** in the Objective-C language, giving the compiler information about
    what kind of object instance is, by typing it as a pointer to class.


    **subclass** in the Objective-C language, any class that''s one step above another
    in the inheritance hierarchy. Occasionally used generally to mean any class that
    inherits from another class. Also used as a verb to mean the process of defining
    a subclass of another class.


    **superclass** in the Objective-C language, a class that''s one step above another
    in the inheritance hierarchy; the class through which a subclass inherits methods
    and instance variables.'
