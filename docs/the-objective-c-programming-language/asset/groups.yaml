    # 第一章


    对象、类与消息传递


    图 1-1 某些绘图程序的类


    ![](img/6f9b7a92b4fae621991881021b9bf44a_23_0.png)


    图 1-1 显示 Square 类是 Rectangle 子类，Rectangle 类是 Shape 的子类，Shape 是 Graphic 的子类，而 Graphic
    是 NSObject 的子类。继承是累积的。因此，Square 拥有为 Rectangle、Shape、Graphic 和 NSObject 定义的方法和实例变量，以及专门为
    Square 定义的内容。简单来说，Square 类型的对象不仅是一个正方形，它还是一个矩形、一个形状以及一个 NSObject 类型的对象。


    每个 NSObject 类都可以被视为另一个类的特化或自适应。每个子类进一步定义了所继承内容的总和。Square 类仅定义了将矩形转换为正方形所需的最小内容。


    当你定义一个类时，通过声明其子类可以将其与层次结构连接起来；你创建的每个类都应该是另一个类的子类（除非你定义了一个新的根类）。有许多潜在的父类可供选择。Cocoa
    包含了 NSObject 类以及几个框架，其中包含了 250 多个额外类的定义。有些类是你可以直接取用并直接整合到程序中的类。你可能希望通过定义子类来根据你的需求进行调整。


    某些框架定义了你需要的一切，但将某些特定细节留到子类中实现。通过编写极少量的并复用框架开发人员所完成的工作，你可以创建非常复杂的对象。


    # NSObject 类


    NSObject 是一个根类，它没有父类。它定义了 Objective-C 对象和交互的基本框架。对于类及其类的实例来说，让它们继承在运行时表现行为和操作的能力，这一点是至关重要的。


    即使一个类不需要从另一个类继承任何特殊行为，它也应该是 NSObject 类的子类。该类的实例至少具备在运行时表现得像 Objective-C 对象的能力。从
    NSObject 类继承这种能力，比在一个新的类定义中重新发明它要简单得多，可靠得多。


    # 对象、类与消息传递


    > 注意：实现一个新的根类是一项细致的任务，带有许多隐藏的危险。该类必须复制 NSObject 类的大部分功能，例如分配实例、将它们连接到所属类以及向运行时系统标识它们。出于原因，你通常应该使用
    Cocoa 提供的 NSObject 类作为根类。更多信息，请参阅 NSObject 类参考和 NSObject 协议。


    # 继承实例变量


    当一个类创建一个新实例时，该实例不仅包含为该类定义的实例变量，还包含其父类的变量，一直追溯到根类。因此，NS 类中定义的 `isa` 实例变量将每个对象与其类连接起来。


    图 1-2 显示了为 Rectangle 的特定实现可能定义的实例变量以及它们的来源。请注意，构成矩形的变量被添加到构成形状的变量中，而构成形状的变量又被添加到构成图形的变量中，依此类推。


    # 图 1-2 Rectangle 实例变量


    | 类 | isa: | 声明于 |

    |---|---|---|

    | NSPoint | origin; | in NSObject |

    | NSColor | *colorPrimary; | in Graphic |

    | Pattern | linePattern; | in Shape |

    | float | width; | |

    | float | height; | |

    | BOOL | filled; | in Rectangle |

    | NSColor | *fillColor; | |


    类并不需要声明实例变量。如果它需要任何实例变量，它可以仅定义新方法并依赖于它继承的实例变量。例如，Square 可能不会声明任何属于自己的实例变量。


    # 继承方法


    对象不仅可以访问为其类定义的方法，还可以访问其父类以及其超父类定义的方法，一直追溯到层次结构的根部。例如，Square 对象可以使用 Rectangle、Shape、Graphic
    和 NSObject 类中定义的方法，也可以使用在其自己的类中定义的方法。


    你在程序中定义的任何新类都可以利用为上述层次结构中其上方所有类编写的代码。这种继承类型是面向对象编程的一大优势。当你使用 Cocoa 提供的面向对象框架之一时，你的程序可以利用编码在框架类中的基本功能。你只需要将自定义标准功能的代码添加到你的程序中。


    类对象也继承自它们在层次结构中上方的类。但因为它们没有实例变量（只有实例才有），所以它们继承的是方法。


    # 用一个方法覆盖另一个方法


    继承有一个非常有用的例外：当你定义一个新类时，可以实现一个与层次结构中更高级类定义的方法同名的新方法。新方法会覆盖原始方法，新类的实例将执行新方法而不是原始方法，而新类的子类也将继承新方法而不是原始方法。


    例如，`Graphic` 定义了一个 `display` 方法，`Rectangle` 通过定义自己的 `display` 版本覆盖了它。`Graphic`
    方法适用于所有继承 `Graphic` 类的对象——但不适用于 `Rectangle` 对象，后者执行的是 `Rectangle` 版本的 `display`。


    虽然覆盖方法会阻止原始定义被继承，但新类中定义的其他方法可以跳过重定义的方法并找到原始方法（“发送给自己和父的消息”，第43页）。


    重新定义的类也可以包含它所覆盖的方法。当这样做时，新方法仅用于精炼或修改它，而不是直接替换。当层次结构中的多个类定义相同的方法时，如果每个新版本都覆盖它，那么该方法的实现实际上分布在所有类中。


    虽然子类可以覆盖继承的方法，但它不能覆盖实例变量。因为对象为它继承的每个实例变量分配了内存，所以它不能通过声明一个同名的新变量来覆盖继承的变量。如果你尝试这样做，编译器将会报错。


    # 抽象类


    某些类的设计初衷是为了让其他类能够继承它们。这些抽象类将方法和实例变量由许多子类定义到一个公共定义中。抽象类本身通常是不完整的，但包含了用于定义其子类实现的有用代码。（因为抽象类必须有子类才有用，所以它们有时被称为**抽象子类**）。


    与其他某些语言不同，Objective-C 没有没有将类标记为抽象的语法，也不会阻止你创建抽象类的实例。


    `NSObject` 类是 Cocoa 中抽象类的经典示例。你永远不会在应用程序中使用 `NSObject` 实例——它没什么用；它只是一个没有任何特殊能力的通用对象。


    另一方面，`UIView` 类提供了一个抽象类的示例，你有时会直接使用它的实例。


    抽象类通常包含有助于定义应用程序结构的代码。当你创建这些类的子类时，你新类的实例可以轻松地契合到应用程序结构中，并与其他对象协作工作。


    # 类类型


    类定义是对某种对象的规范。类实际上定义了一个数据类型。该类型不仅取决于类定义的数据结构（实例变量），还取决于定义中包含的行为（方法）。


    '
