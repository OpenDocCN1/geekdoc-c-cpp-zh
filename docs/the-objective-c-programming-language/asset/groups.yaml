    # CHAPTER 11


    # Exception Handling


    ```

    @throw exception;

    userInfo: nil];

    ```


    > **Important:** In many environments, use of exceptions is fairly commonplace.
    For example, you might throw an exception to signal that a routine not execute
    normally—such as when a file is missing or data could not be parsed correctly.
    Exceptions are resource-intensive in Objective-C. You should not use exceptions
    for general flow-control, or simply to signify errors. Instead you should use
    the return value of a method or function to indicate that an error has occurred,
    and provide information about the problem in an error object. For more information,
    *Error Handling Programming Guide.*


    Inside a @catch| block, you can throw the exception using the @throw directive
    without providing an argument. Leaving the argument in this case can help make
    your code more readable.


    You are not limited to throwing `NSException` objects. You can throw any Objective-C
    object as an exception object. The `NSException` class provides methods that help
    in exception processing, but you can implement your own if you so desire. You
    can also subclass `NSException` to implement specialized types of exceptions,
    such as file-system exceptions or communications exceptions.'
