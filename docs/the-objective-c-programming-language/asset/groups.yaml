    \n## 点语法\n\n使用点语法是一种简单的调用方法，而且通常比方括号语法更简洁。\n\n## 消息\n\n消息是对象之间通信的机制。当你向一个对象发送消息时，你实际上是在请求它执行某些操作。\n\
    \n## 类\n\n面向对象的程序通常由各种对象构建。一个基于 Cocoa 框架的程序可能会使用 NSMatrix 对象、NSWindow 对象、NSDictionary\
