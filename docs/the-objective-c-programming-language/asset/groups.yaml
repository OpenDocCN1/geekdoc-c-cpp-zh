    \ instead. The designer of Low didn't want Low objects to perform the inherited\
    \ method.\n\n+   - The Mid method makeLastingPeace, sending the negotiate message\
    \ to super (as shown in the second implementation), intentionally skipped over\
    \ the Mid version of negotiate (and over any versions that might be defined in\
