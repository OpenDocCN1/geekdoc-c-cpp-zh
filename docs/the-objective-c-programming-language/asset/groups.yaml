    \ of Exception* (page 104).\n- You use the @throw to throw an exception, which\
    \ is essentially an Objective-C object. You typically use an NSException object,\
    \ but you are not required to.\n- A @finally block contains code that must be\
    \ executed whether an exception is thrown or not.\n\nThis example depicts a simple\
    \ exception-handling algorithm:\n\n```\nCup cup = [[Cup alloc] init];\n@try {\n\
    \  [cup fill];\n}\n```"
- md: "\n# CHAPTER 11\n\n## Exception Handling\n\n```objc\n@catch (NSException *exception)\
    \ {\n    NSLog(@main: Caught %@:%@\", [exception name], [exception reason]);\n\
    }\nfinally {\n    [cup release];\n}\n```\n\n## Catching Different Types of Exception\n\
    \nTo catch an exception thrown in a @try[] block, use one or more @catch[] blocks\
    \ following the @try block. The @catch[] blocks should be ordered from most-specific\
    \ to least-specific. That way you can tailor the processing of exceptions groups,\
    \ as shown in Listing 11-1.\n\n**Listing 11-1** An exception handler\n\n```objc\n\
    @try {\n    @catch (CustomException *ce) {\n        // 1\n    }\n    @catch (NSException\
    \ *ne) {\n        // 2\n        // Perform processing necessary at this level\n\
    \    }\n    @catch (id ue) {\n    }\nfinally {\n    // 3\n    // Perform processing\
    \ necessary whether an exception occurred or not.\n}\n```\n\nThe following list\
    \ describes the numbered code lines:\n\n- 1. Catches the most specific exception\
    \ type.\n- 2. Catches a more general exception type.\n- 3. Performs any clean-up\
    \ processing that must always be performed, whether exceptions were thrown or\
    \ not.\n\n## Throwing Exceptions\n\nTo throw an exception, you must instantiate\
    \ an object with the appropriate information, such as the exception name and the\
    \ reason it was thrown.\n\n```objc\nNSException *exception = [NSException exceptionWithName:@\"\
    HotTeaException\" reason:@\"The tea is too hot\"]\n```\n\n```objc\n@throw exception;\n\
    userInfo: nil];\n```\n\n> **Important:** In many environments, use of exceptions\
    \ is fairly commonplace. For example, you might throw an exception to signal that\
    \ a routine not execute normally—such as when a file is missing or data could\
    \ not be parsed correctly. Exceptions are resource-intensive in Objective-C. You\
    \ should not use exceptions for general flow-control, or simply to signify errors.\
    \ Instead you should use the return value of a method or function to indicate\
    \ that an error has occurred, and provide information about the problem in an\
    \ error object. For more information, *Error Handling Programming Guide.*\n\n\
    Inside a @catch| block, you can throw the exception using the @throw directive\
    \ without providing an argument. Leaving the argument in this case can help make\
    \ your code more readable.\n\nYou are not limited to throwing `NSException` objects.\
    \ You can throw any Objective-C object as an exception object. The `NSException`\
    \ class provides methods that help in exception processing, but you can implement\
    \ your own if you so desire. You can also subclass `NSException` to implement\
    \ specialized types of exceptions, such as file-system exceptions or communications\
    \ exceptions.\n\n# CHAPTER 12\n\n## Threading\n\nObjective-C provides support\
    \ for thread synchronization and exception handling, which are explained in this\
    \ chapter and in \"Exception Handling\" (page 103). To turn on for these features,\
    \ use the `-fobjc-exceptions` switch of the GNU Compiler Collection (GCC) version\
    \ 3.3 and later.\n\nNote: Using either of these features in a program renders\
    \ the application runnable only on Mac OS v10.3 and because later runtime support\
    \ for exception handling is not present in earlier versions of the software.\n\
    \nObjective-C supports multithreading in applications. Therefore, two threads\
    \ can try to modify the same object at the same time, a situation that can cause\
    \ serious problems in a program. To protect sections of code from being executed\
    \ by more than one thread at a time, Objective-C provides the `@synchronized()`\
    \ directive.\n\nThe `@synchronized` directive locks a section of code for use\
    \ by a single thread. Other threads are blocked until the thread exits the protected\
    \ code—that is, when execution continues past the last statement in the `@synchronized`\
    \ block.\n\nThe `@synchronized` directive takes its argument as any Objective-object,\
    \ locking self. The object is known as a mutual exclusion or mutex. it allows\
    \ a thread to lock a section of code to prevent its use by others. You should\
    \ use separators to protect different critical sections of a program. It is safest\
    \ to create all mutual exclusion objects before the application becomes multithreaded,\
    \ to avoid race conditions.\n\nListing 12-1 shows how to use `self` as the mutex\
    \ to synchronize access to the instance methods of the current object. You can\
    \ take a similar approach to synchronize the class methods of the associated class,\
    \ using the class object of `self`. In the latter case, of course, only one thread\
    \ at a time is allowed to execute a class method because there is only one class\
    \ that is shared by all callers.\n\n**Listing 12-1 Locking a method using self**\n\
    \n```objc\n(void)criticalMethod {\n    @synchronized(self) {\n        // Critical\
    \ code.\n    }\n}\n```\n\nListing 12-2 shows a general approach. Before executing\
    \ a critical process, the code obtains a semaphore from the `Account` class and\
    \ uses it to lock the critical section. The `Account` class could create the semaphore\
    \ in its `initialize` method.\n\n**Listing 12-2 Locking a method using a custom\
    \ semaphore**\n\n```objc\nAccount *account = [Account accountFromString:[account\
    \ string]];\n// Get the semaphore.\n```\n\n```objc\nid accountSemaphore = [Account\
    \ semaphore];\n@synchronized(accountSemaphore) {\n  // Critical code.\n}\n```\n\
    \nThe Objective-C synchronization feature supports recursive and reentrant code.\
    \ A thread can use a single semaphore several times in a recursive manner; other\
    \ threads are blocked until the thread exits the protected code—that is, when\
    \ execution continues past the last statement in the @synchronized block.\n"
