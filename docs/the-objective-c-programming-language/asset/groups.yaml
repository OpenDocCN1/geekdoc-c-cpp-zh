  - '[PAGE 27]


    # Class Objects


    A class definition contains various kinds of information, much of it about instances
    of the class: its superclass


    +   * The name of the class and its class

    * A template describing a set of instance variables

    * The declarations of method names and their return and parameter types

    * The method implementations


    This information is compiled and recorded in data structures made available to
    the runtime system. The compiler creates just one object, a class object, to represent
    the class. The class object has access to all the information about the class,
    which means mainly information about what instances of the class are. It is able
    to produce new instances according to the plan put forward in the class definition.


    Although a class object keeps the prototype of a class, it''s not an instance
    itself. It has no variables of its own and it can''t perform methods intended
    for instances of the class. However, a class definition can include methods intended
    for the class object—class methods as opposed to instance methods. A class object
    inherits methods from the classes above it in the hierarchy, as instances inherit
    instance methods.


    In source code, the class object is represented by the name. In the following
    example, the Rectangle class returns the class number using a method inherited
    from the NSObject class:


    ```

    int versionNumber = [Rectangle version];

    ```


    However, the class stands for the class object only as the receiver in a message
    expression. Elsewhere, you need to ask an instance or the class to return the
    class id. Both respond to a class message:


    ```

    id aClass = [anObject class];

    id rectClass = [Rectangle class];

    ```


    As these examples show, class objects like all other objects, be typed id. But
    class objects can also be more specifically typed to the Class data type:


    ```

    Class aClass = [anObject class];

    Class rectClass = [Rectangle class];

    ```


    All class objects are of type Class. Using this name for a class is equivalent
    to using the class name to statically an instance.


    Class objects are full-fledged objects that can be dynamically typed, receive
    messages, and inherit methods from other classes. They''re special only in that
    they are created by the compiler, lack data structures (instance variables) of
    their own other those built from the class definition, and are the agents for
    producing instances at runtime.'
