    # An Example: Using self and super


    The difference between self and super becomes clear when using a hierarchy of
    three classes. Suppose, for example, that we create an object belonging to a class
    called Low. The subclass of Low is Mid; the subclass of Mid is High. All three
    classes define a method called negotiate, which each class uses for its own purpose.
    In addition, Mid defines an ambitious method called makeLastingPeace, which itself
    employs the negotiate method. The classes and those methods are illustrated in
    Figure 2-2.


    Figure 2-2 The hierarchy of High, Mid, and Low


    ![](img/6f9b7a92b4fae621991881021b9bf44a_43_0.png)


    Suppose that the implementation of makeLastingPeace (in the Mid class) uses self
    to indicate the object to send the negotiate message to:


    ```

    makeLastingPeace

    {\  [self negotiate];

    }

    ```


    When a message is sent to a Low object to perform the makeLastingPeace method,
    makeLastingPeace sends a negotiate message to the same Low object. The messaging
    routine finds the version of negotiate defined in Low, the class of self.'
