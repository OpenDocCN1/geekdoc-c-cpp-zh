    # CHAPTER 1

    Objects, Classes, and Messaging


    # id


    In Objective-C, object identifiers are of a data type: id. This type is the general
    type for any kind of object regardless of class and can be used for instances
    of a class and for class objects themselves.


    ```

    id anObject;

    ```


    For the object-oriented constructs of Objective-C, such as method return values,
    id replaces int as the default type. (for strictly C, such as function values,
    int remains the default type.)


    The keyword nil is a null object, an id with a value of 0. id, nil, and the other
    basic types of Objective-C are defined in the header file objc/objc.h.


    ```

    id is defined as an object data structure:

    ttypedef struct objc_object {

    Class isa:

    *id;

    ```


    Every object has an isa variable that tells it what class it is an instance. The
    Class type is itself defined as a pointer:


    ```

    typedef struct objc_class *Class;

    isa variable is frequently referred to as the "isa pointer."

    ```


    # Dynamic Typing


    The id type is completely nonrestrictive. By itself, it yields no information
    about an object, except that it is an object. At some point, a program typically
    needs to find more information about the objects it contains. The id type designator
    can''t supply such specific information to the compiler, each object has to be
    able to supply it at runtime


    The isa variable identifies the object''s class—what kind of object it is. Objects
    with the same behavior (methods) and the same data (instance variables) are members
    of the same class.


    Objects are dynamically typed at runtime. Whenever it needs to, the runtime system
    can find the class that an object belongs to, by asking the object. (To learn
    more about this, see Objective-C Runtime Programming Guide.) typing in Objective-C
    serves as the foundation for dynamic binding, discussed later.


    The isa variable enables objects for introspection—to find out themselves (or
    other objects). The compiler records information about class definitions in data
    structures for the runtime system to use. Using the runtime system, you can, for
    example, determine whether an object implements a particular method or discover
    the name of its subclass.


    Object classes are discussed in more detail "Classes" (page 23).


    It''s also possible to give the compiler information about the class of an object
    by statically typing it in source code using the name. Classes are particular
    kinds of objects, and the class can serve as a type name. See "Class Types" (page
    26) and "Enabling Static Behavior" (page 95).'
  - "[PAGE 14]\n\n# Memory Management\n\nIn any program, it is important to ensure\
    \ that objects are deallocated when they are no longer—otherwise your application's\
    \ memory footprint becomes larger than necessary. It is also important to ensure\
    \ that you do not deallocate objects while they're being used.\n\nObjective-C\
    \ offers two mechanisms for memory management that allow you to meet these goals:\n\
    \n+   * **Reference counting**, you are ultimately responsible for determining\
    \ the lifetime of objects.\n  Reference counting is described in *Memory Management\
    \ Programming Guide.*\n\n+   * **Garbage collection**, you pass responsibility\
    \ for determining the lifetime of objects to an automatic \"collector.\"\n  Garbage\
    \ collection is described in *Garbage Collection Programming Guide*. (Not available\
    \ for iOS—you cannot access this document through the iOS Dev Center.)\n\n# Object\
    \ Messaging\n\nThis section explains the syntax of sending messages, including\
    \ how you can nest message expressions. It also discusses the scope or \"visibility\"\
    \ of an object's instance variables, and the concepts of polymorphism and dynamic\
    \ binding.\n\n# Message Syntax\n\nTo get an object to do something, you send it\
    \ a **message** telling it to apply a method. In Objective-C, **message expressions**\
    \ are enclosed in brackets:\n\n```\n[receiver message]\n```\n\nThe **receiver**\
    \ is an object, and the message tells it what to do. In source code, the message\
    \ is the name of a method and what parameters it takes. When a message is sent,\
    \ the runtime system selects the appropriate method from the receiver's repertoire\
    \ and invokes it.\n\nFor example, this message tells the `myRectangle` object\
    \ to perform its `display` method, which causes the rectangle to display itself:\n\
    \n```\n[myRectangle display];\n```\n\nThe message is followed by a \":\"—as is\
    \ normal for a statement in C.\n\nBecause the method name in a message serves\
    \ to \"select\" a method implementation, method names in messages are often referred\
    \ to as **selectors**.\n\nMethods can also take parameters, sometimes called `arguments`.\
    \ A message with a single parameter affixes a colon (:) to the name and puts the\
    \ parameter right after the colon:\n\n```\n[myRectangle setWidth:20];\n```"
- md: "\n# CHAPTER 1\n## Objects, Classes, Messaging\n\nFor methods with multiple\
    \ parameters, Objective-C's method name are interleaved with the parameters such\
    \ that the method's name naturally describes the parameters expected by the method.\
    \ The imaginary message below tells the myRectangle to set its origin to the coordinates\
    \ (30.0, 50.0):\n\n```\n[myRectangle setOrigin:30.0 y:50.0]; // This is a good\
    \ example of\n// multiple parameters\n```\n\nA selector includes all of the parts\
    \ of the name, including colons, the selector in the preceding example is named\
    \ setOrigin:; it has two colons, because it takes two parameters. The selector\
    \ does not, however, including anything else, such as return type or parameter\
    \ types.\n\n> **Important:** The subparts of Objective-C selector are not optional,\
    \ nor can they be varied. In some languages, the terms \"named parameters\" and\
    \ \"keyword parameters\" carry the implications that parameters can vary at runtime,\
    \ can have default values, can be in a different order, and can possibly have\
    \ added named parameters. None of these characteristics about parameters are true\
    \ for Objective-C.\n\nFor all intents and purposes, an Objective-C method declaration\
    \ is a C function that prefers two additional parameters (see \"Messaging\" in\
    \ the \"Objective-C Runtime Programming Guide\"). Thus, the structure of an Objective-C\
    \ method declaration differs from the structure of a method that uses named or\
    \ keyword parameters in a language like Python, the following example illustrates:\n\
    \n```\ndef func(a, b=SuperNext, Thing=DefaultThing):\n    pass\n```\n\nIn this\
    \ Python example, Thing and NextMode might be omitted or have different values\
    \ when called.\n\nIn principle, a Rectangle class could not interleave the method\
    \ setOrigin:: with no label for the second parameter, which would have been invoked\
    \ as:\n\n```\n[myRectangle setOrigin:30.0 :50.0]; // This is a bad example of\
    \ multiple\nparameters\n```\n\nWhile syntactically legal, setOrigin:: does not\
    \ interleave the method name with parameters. Thus, the second parameter is effectively\
    \ ineffective and it is difficult for a reader of this to determine the kind or\
    \ purpose of the method's parameters.\n\nMethods that take a variable number of\
    \ parameters are also possible, though they're somewhat rare. Extra parameters\
    \ are separated by commas after the end of method name (Unlike, the commas are\
    \ not considered part of the name). In the following example, the imaginary makeGroup:\
    \ passed with one required parameter and three that are optional:\n\n```\n[receiver\
    \ makeGroup:group, memberOne, memberTwo, memberThree];\n```\n\nLike C functions,\
    \ methods can return values. The following example sets the variable isFilled\
    \ YES if myRectangle is drawn as a solid rectangle, or NO if it is drawn in outline\
    \ format.\n\n```\nBOOL isFilled;\nisFilled = [myRectangle isFilled];\n```\n\n\
    Note that a variable and a method can have the same name.\n\nOne message expression\
    \ can be nested inside another. The color of one rectangle is set to the color\
    \ of another:\n\n```\n[myRectangle setPrimaryColor:[other primaryColor]];\n```\n\
    \n## Objects-C, Classes, Messaging\n\nObjective-C also provides a dot (.) operator\
    \ that offers a compact and convenient syntax for invoking an object's accessor\
    \ methods. The dot operator is typically used in conjunction with the declared\
    \ properties feature (\"Declared Properties\" (page 69) and is described in \"\
    Dot Syntax\" (page 19).\n\n## Sending Messages to nil\n\nIn Objective-C, it is\
    \ valid to send a message to nil—simply has no effect at runtime. There are several\
    \ patterns in Cocoa that take advantage of this fact. The value returned from\
    \ a message to nil may also be valid:\n\n- If the method returns an object, a\
    \ message sent to nil returns 0 (nil). For example:\n  Person *motherInLaw = [[a\
    \ spouse] mother];\n- If the spouse object is nil, then mother is sent to nil\
    \ and the method returns nil.\n- If the method returns any pointer type, any integer\
    \ scalar of less than or equal to sizeof(void*), a float, a double, a long double,\
    \ or a long long, then a message sent to nil returns 0.\n- If the method returns\
    \ a struct, as defined by the Mac OS ABI Function Call Guide returns 0.0 for every\
    \ field in the struct. Other struct data types will not be filled with zeros.\n\
    - If the method returns anything other than the mentioned value, the return value\
    \ of a message sent to nil is undefined. The following code fragment illustrates\
    \ a valid use of sending a message to nil:\n\n```\nid anObjectMaybeNil = nil;\n\
    \n// this is valid\nif ([anObjectMaybeNil methodDouble] == 0.0)\n{\n    // implementation\
    \ continues...\n}\n```\n\nNote: The behavior of sending messages to nil changed\
    \ slightly with Mac OS X10.5. Mac OS X10.4 and earlier, a message to nil is also\
    \ valid, as long as the message returns an object, any pointer type, or any integer\
    \ scalar of less than or equal to sizeof(void); if it does, a message sent to\
    \ nil returns the aforementioned value (any struct, floating-point number, or\
    \ vector).\n\n## The Receiver's Instance Variables\n\nA method has automatic access\
    \ to the receiver's instance variables. You don't need to pass them as parameters.\
    \ For example, the primaryStage method implemented above takes no parameters,\
    \ yet it can find the color and return it. This convention uses Objective-C source\
    \ code. It also supports programmers think about objects and messages. Messages\
    \ sent to receivers are delivered to itself.\n\nA method has access only to the\
    \ receiver's instance variables. If it requires information about a variable in\
    \ another object, it must send a message to it. The primaryStage and isFilled\
    \ methods shown early are just for this purpose. See \"Defining a Class\" (page\
    \ 35) for more information on instance variables.\n\n## Polymorphism\n\nAs the\
    \ earlier examples illustrate, messages in Objective-C appear in the same syntactic\
    \ positions as function calls. But, because messages \"belong\" to an object,\
    \ they don't behave in the same way as function calls. In particular, an object\
    \ can be operated on by only those methods that were defined for it. It can't\
    \ confuse methods defined for other kinds of object if another object has a method\
    \ with the same name. Therefore, two objects can respond to the same message.\
    \ For example, each kind of object that receives a message could display itself\
    \ in a unique way.\n\nThis feature, referred to as polymorphism, plays a significant\
    \ role in the design of object-oriented programs. With dynamic binding, it permits\
    \ you to write code that might apply to any number of different kinds of objects\
    \ without having to choose at the time what kinds of objects they might be. They\
    \ might be developed later by working on other projects. If you write code that\
    \ sends a message to an id variable, any object that has a method is a potential\
    \ receiver.\n\n## Dynamic Binding\n\nA crucial difference between function calls\
    \ and messages is that a function and its parameters are joined together in the\
    \ compiled code, a message and a receiving object aren't united until the program\
    \ is running and the message is sent. Therefore the exact method invoked to respond\
    \ to a message can be determined at runtime, not when the code is compiled.\n\n\
    When a message is sent, a runtime messaging routine looks at the receiver and\
    \ the method named in the message. It locates the receiver's implementation of\
    \ a method matching, \"calls\" the method, and passes a pointer to the receiver's\
    \ instance variables (For more on this routine, \"Messaging\" in Objective-C Runtime\
    \ Programming Guide).\n\nThis dynamic binding of methods works in hand with polymorphism\
    \ to give object-oriented programming much of its flexibility and power. Because\
    \ each object can have its own version of a method, an Objective-C statement can\
    \ enable a variety of results, not by binding the message but by the object that\
    \ receives the message. Receivers can be defined as the program runs; the choice\
    \ of receiver can be made dependent on factors such as user actions.\n\nWhen executing\
    \ code based upon the Application Kit (AppKit), for example, users determine which\
    \ objects receive messages from commands such as Cut, Copy, and Paste. The message\
    \ goes to object controls the selection. An object that displays text would read\
    \ to a copy differently than an object that displayed images. An object that represents\
    \ a set of shapes would respond differently to a copy message because messages\
    \ do not select methods until runtime (from another perspective, binding of methods\
    \ does not occur until runtime), these differences in behavior are isolated to\
    \ the objects themselves. The code that sends the message doesn't have to be concerned\
    \ with them; it doesn't have to enumerate the possibilities. Application objects\
    \ can each respond in its own way copy messages.\n\nObjective-C dynamic binding\
    \ one step further and allows even the message that's sent (the method selector)\
    \ to be a variable determined at runtime. This mechanism is discussed in the section\
    \ \"Messaging\" in Objective-C Runtime Programming Guide.\n\n## Dynamic Method\
    \ Resolution\n\nYou can provide implementations of class and instance methods\
    \ at runtime using dynamic method resolution. See \"Dynamic Method Resolution\"\
    \ in Objective-C Runtime Programming Guide for more details.\n\n## Dot Syntax\n\
    \nObjective-C provides a dot (.) operator that offers an alternative to square\
    \ bracket notation [] to invoke accessor methods. Dot syntax uses the same pattern\
    \ as accessing C structure elements:\n\n```\nmyInstance.value = 10;\nprintf(\"\
    myInstance.value: %d\", myInstance.value);\n```\n\nWhen used with objects, dot\
    \ syntax acts as \"syntactic sugar\"—it is transformed by the compiler into an\
    \ invocation of an accessor method. Dot syntax does not directly get or set an\
    \ instance variable. The code example above is exactly equivalent to the following:\n\
    \n```\n[myInstance setValue:10];\nprintf(\"myInstance.value: %d\", [myInstance\
    \ value]);\n```\n"
  mdcn: "\n\n# 第一章\n## 对象、类、消息传递\n\n对于具有多个参数的方法，Objective-C 的方法名与参数是交替的，使得方法名自然地描述了该方法预期的参数。下方的虚构消息告诉\
    \ `myRectangle` 将原点设置为坐标 (30.0, 50.0)：\n\n```\n[myRectangle setOrigin:30.0 y:50.0];\
    \ // 这是一个多参数的\n// 良好范例\n```\n\n一个选择器（selector）包含了名称的所有部分，包括冒号。上一个示例中的选择器名称为 `setOrigin:`\
    \ ；它有两个冒号，因为它接收两个参数。然而，选择器并不包含任何其他内容，例如返回类型或参数类型。\n\n> **重要：** Objective-C 选择器的子部分不是可选的，也无法更改。在某些语言中，“命名参数”（named\
    \ parameters）和“关键字参数”（keyword parameters）这些术语意味着参数可以在运行时变化、可以有默认值、顺序可以不同，并且可能添加额外的命名参数。这些关于参数的这些特性在\
    \ Objective-C 中均不成立。\n\n从所有意义上来说，一个 Objective-C 方法声明是一个优先带有两个额外参数的 C 函数（参见《Objective-C\
    \ 运行时编程指南》中的“消息传递”）。因此，Objective-C 方法声明的结构与 Python 等语言中使用命名或关键字参数的方法结构不同，如下例所示：\n\
    \n```\ndef func(a, b=SuperNext, Thing=DefaultThing):\n    pass\n```\n\n在这个 Python\
    \ 示例中，调用时 `Thing` 和 `NextMode` 可能被省略或具有不同的值。\n\n从原则上讲，Rectangle 类不能将对第二个参数没有标签的方法\
    \ `setOrigin::` 进行交替，其调用方式将是：\n\n```\n[myRectangle setOrigin:30.0 :50.0]; // 这是一个多参数的//\
    \ 糟糕范例\n```\n\n虽然在语法上是法的，但 `setOrigin::` 并没有将方法名与参数交替。因此，第二个参数实际上是无效的，读者很难判断该方法参数的类型或目的。\n\
    \n也可以接收变数量参数的方法，尽管它们并不多见。额外的参数在方法名结束后通过逗号分隔（与此不同，逗号不被视为名称的一部分）。在以下示例中，虚构的 `makeGroup:`\
    \ 传递了一个必选参数和三个可选参数：\n\n```\n[receiver makeGroup:group, memberOne, memberTwo, memberThree];\n\
    ```\n\n像 C 函数一样，方法可以返回值。接下来的示例如果 `myRectangle` 被绘制为实心矩形，则将变量 `isFilled` 设置 YES；如果以轮廓格式绘制，则设置为\
    \ NO。\n\n```\nBOOL isFilled;\nisFilled = [myRectangle isFilled];\n```\n\n注意，变量和方法可以同名。\n\
    \n一个消息表达式可以嵌套在另一个表达式内部。将一个矩形的颜色设置为另一个矩形的颜色：\n\n```\n[myRectangle setPrimaryColor:[other\
    \ primaryColor]];\n```\n\n## Objective-C、类、消息传递\n\nObjective-C 还提供了点（（.）运算符，为调用对象的访问方法提供了一种简洁方便的语法。点运算符通常与声明属性功能结合使用（“声明属性”，见第\
    \ 69 页），并在“点语法”（见第 19 页）中进行了描述。\n\n## 向 nil 发送消息\n\n在 Objective-C 中，向 nil 发送消息是有效的——只是在运行时没有任何影响。Cocoa\
    \ 中有几种模式利用了这一事实。向 nil 发送消息的返回值也可能是有效的：\n\n- 如果方法返回对象，向 nil 发送的消息返回 0 (nil)。例如：\n\
    \  `Person *motherInLaw = [[a spouse] mother];`\n- 如果 `spouse` 对象为 nil，则 `mother`\
    \ 将被发送给 nil，方法返回 nil。\n- 如果方法返回任何指针类型、小于或等于 `sizeof(void*)` 的任何整数标量、浮点数（float）、双精度浮点数（double）、长双精度（long\
    \ double）或 long long，则向 nil 发送的消息返回 0。\n- 如果方法返回一个结构体（如 Mac OS ABI 函数调用指南中定义），则对结构体中的每个字段都返回\
    \ 0.0。其他结构体数据类型不会被填充零。\n- 如果方法返回上述以外的任何值，则向 nil 发送消息的返回值是未定义的。以下代码片段说明了向 nil 发送消息的有效用法：\n\
    \n```\nid anObjectMaybeNil = nil;\n\n// 这是有效的\nif ([anObjectMaybeNil methodDouble]\
    \ == 0.0)\n{\n    // 继续实现...\n}\n```\n\n注意：向 nil 发送消息的行为在 Mac OS X 10.5 中发生了微变化。在\
    \ Mac OS X 10.4 及之前的版本中，向 nil 发送消息也是有效的，只要该消息返回对象、任何指针类型或小于或等于 `sizeof(void)`\
    \ 的任何整数标量；如果是，向 nil 发送的消息将返回上述值（任何结构体、浮点数或向量）。\n\n## 接收者的实例变量\n\n方法可以自动访问接收者的实例变量。你不需要将它们作为参数传递。例如，上面实现的\
    \ `primaryColor` 方法没有接收任何参数，但它可以找到颜色并返回它。这种约定使用了 Objective-C 源代码。它也支持程序员思考对象和消息。发送给接收者的消息会传递给自身。\n\
    \n方法只能访问接收者的实例变量。如果它需要另一个对象中变量的信息，它必须向该对象发送消息。早期显示的 `primaryColor` 和 `isFilled`\
    \ 方法正是为此目的。关于实例变量的更多信息，请参见“定义类”（第 35 页）。\n\n## 多态\n\n正如前面的示例所示，Objective-C 中的消息在语法位置上与函数调用相同。但由于消息“属于”一个对象，它们的行为与函数调用不同。特别是，一个对象只能通过为它定义的方法进行操作。如果另一个对象有一个同名的方法，它也不会混淆为为其他类型对象定义的方法。因此，两个对象可以响应相同的消息。例如，每种接收消息的对象类型都可以以独特的方式显示自己。\n\
    \n这种特征被称为多态（polymorphism），它在面向对象程序的设计中起着重要作用。通过动态绑定（dynamic binding），它允许你编写可能适用于任意数量不同类型对象的代码，而不需要在选择时决定它们是什么类型的对象。它们以后可以通过其他项目进行开发。如果你编写了向\
    \ `id` 变量发送消息的代码，那么任何具有方法的对象都是潜在的接收者。\n\n## 动态绑定\n\n函数调用和消息之间的一个关键区别在于，函数及其参数在编译代码中连接在一起，而消息和接收对象直到程序运行并发送消息时才结合在一起。因此，响应消息的精确方法可以在运行时确定，而不是在代码编译时确定。\n\
    \n当发送消息时，运行时消息处理程序会查看接收者和消息中命名的方法。它找到接收者中匹配的方法实现，“调用”该方法，并传递一个指向接收者实例变量的指针（有关此处理程序的更多信息，请参见《Objective-C\
    \ 运行时编程指南》中的“消息传递”）。\n\n这种方法的动态绑定与多态协作工作，赋予了面向对象编程大量的活性和力量。由于每个对象都可以有自己的方法版本，Objective-C\
    \ 语句可以产生多种结果，这并不是通过绑定消息，而是通过接收消息的对象。接收者可以在程序运行时定义；接收者的选择可以取决于用户操作等因素。\n\n例如，在执行基于\
    \ Application Kit (AppKit) 代码时，用户决定哪些对象接收来自“剪切”（Cut）、“复制”（Copy）和“粘贴”（Paste）等命令的消息。消息发送到控制选择的对象。显示文本的对象复制方式与显示图像的对象不同。表示一组形状的对象对复制消息的响应不同，因为消息在运行时才选择方法（从另一个角度看，方法的绑定直到运行时才发生），这些差异被隔离在对象本身。发送消息的代码不需要考虑它们；它不需要枚举所有可能性。应用程序对象可以以自己的方式响应复制消息。\n\
    \nObjective-C 将动态绑定更了一了一步，允许发送的消息（方法选择器）是运行时确定的变量。这种机制在《Objective-C 运行时编程指南》的“消息传递”章节中讨论。\n\
    \n## 动态方法解析\n\n你可以在运行时使用动态方法解析提供类和实例方法的实现。更多详情请《Objective-C 运行时编程指南》中的“动态方法解析”。\n\
    \n## 点语法\n\nObjective-C 提供了一个点（.）运算符，作为方括号符号 `[]` 调用访问方法的替代方案。点语法的使用与访问 C 结构体元素的模式相同：\n\
    \n```\nmyInstance.value = 10;\nprintf(\"myInstance.value: %d\", myInstance.value);\n\
    ```\n\n当与对象时，点语法充当“语法糖”——它被编译器转换为访问方法的调用。点语法并不直接获取或设置实例变量。上面的代码示例完全等同于以下代码：\n\n\
    ```\n[myInstance setValue:10];\nprintf(\"myInstance.value: %d\", [myInstance value]);\n\
    ```\n\n"
