- md: "\n# CHAPTER 2\n\n## Defining a Class\n\nWhen the instance variable belongs\
    \ to an object that's not receiver, the object's type must be made explicit to\
    \ the compiler through static typing. In referring to the instance variable of\
    \ a statically typed object, the pointer operator (->) is used.\n\nSuppose, for\
    \ example, that the Sibling class declares a statically typed object, twin, as\
    \ an instance variable:\n\n```\n@Interface Sibling : NSObject\n{\n Sibling *twin;\n\
    \ int gender;\n struct features *appearance;\n}\n```\n\nAs long as the instance\
    \ variables of the statically typed object are within the scope of the class (as\
    \ they are here when twin is typed to the same class), a Sibling method can set\
    \ them directly:\n\n```\n- makidenticalTwin\n{\n if (Itwin ()) {\n twin = [[Sibling\
    \ alloc] init];\n twin->gender = gender;\n twin->appearance = appearance;\n return\
    \ twin;\n}\n}\n```\n\n## The Scope of Instance Variables\n\nAlthough they're declared\
    \ in the class interface, instance variables are more a matter of the way a class\
    \ is implemented than of the way it's used. An object's interface lies in its\
    \ methods, not in its internal data structures.\n\nOften there is a one-to-one\
    \ correspondence between a method and an instance variable, as in the following\
    \ example:\n\n```\n- (BOOL)isFilled\n{\n return filled;\n}\n```\n\nBut this is\
    \ not the case. Some methods might return information not stored in instance variables,\
    \ and some instance variables might store information that an object is unwilling\
    \ to reveal.\n\nAs a result from time to time, the choice of instance variables\
    \ may change, even though the method retains its name. As long as the vehicle\
    \ for interacting with instances of the class, these changes won't affect its\
    \ interface.\n\nTo enforce the ability of an object to hide its data, the compiler\
    \ limits the scope of instance variables—that is, its visibility within the program.\
    \ But to provide flexibility, it also explicitly sets the scope at four levels.\
    \ Each level is marked by a compiler directive:\n\n| Directive | Meaning |\n|\
    \ --- | --- |\n| @private | The instance variable is accessible only within the\
    \ class that declares it. |\n\n## Defining a Class\n\n| Directive | Meaning |\n\
    | --- | --- |\n| @protected | The instance variable is accessible within the class\
    \ that declares it and within classes that inherit it. All instance variables\
    \ without an explicit scope directive have @protected scope. |\n| @public | The\
    \ instance variable is accessible everywhere. |\n| @package | Using the modern\
    \ runtime, an @package instance variable has @public scope inside the executable\
    \ image that implements the class, but acts like @private outside. The @package\
    \ scope for Objective-C instance variables is analogous to private_extern for\
    \ C variables and functions. Any code outside the class implementation's image\
    \ that tries to use the variable gets a link error. This scope is most useful\
    \ for instance variables in framework classes, where @private may be too restrictive\
    \ but @protected or @public too permissive. |\n\nFigure 2-1 illustrates the levels\
    \ of scoping.\n\n### Figure 2-1 The scope of instance variables (@package scope\
    \ not shown)\n\n![](img/6f9b7a92b4fae621991881021b9bf44a_40_0.png)\n\nA scoping\
    \ directive applies to all the instance variables listed after it, up to the next\
    \ directive or the end of the list. In the following example, the age and evaluation\
    \ instance variables are private; name, Job, and wage are protected; boss is public.\n\
    \n```\n@interface Worker : NSObject\n  char *name;\n  @private\n  int age;\n \
    \ char *evaluation;\n  @protected\n```\n\n## Class Implementation\n\n# CHAPTER\
    \ 2\nDefining a Class\n\n```\nid job:\nfloat wage:\n@public\nid boss:\n}\n```\n\
    \nBy default, all unmarked instance variables (like name) are @protected.\n\n\
    All instance variables that a class declares, no matter how they're marked, are\
    \ within the scope of the class definition. For example, a class declares a job\
    \ instance variable, such as the Worker class shown above, can refer to it in\
    \ a method definition:\n\n```\npromoteTo:newPosition\n{\nid old = job;\njob =\
    \ newPosition;\nreturn old;\n}\n```\n\nObviously, if a class can't access its\
    \ own instance variables, the instance variables would be of no use whatsoever.\n\
    \nNormally, a class also has access to the instance variables it inherits. The\
    \ ability to refer to an instance variable is usually inherited with the variable.\
    \ It makes sense for classes that have their entire data structures within their\
    \ scope, if you think of a class definition as merely an elaboration of the class\
    \ it inherits from. The promoteTo: method illustrated earlier could just as well\
    \ defined in any class that inherits the job variable from the Worker class.\n\
    \nHowever, there are reasons why you might want to restrict inheriting classes\
    \ from directly accessing an instance variable:\n\n- Once a subclasses accesses\
    \ an inherited variable, the class that declares the variable is tied to that\
    \ part of its implementation. In later versions, it can't eliminate the variable\
    \ or alter the role it plays without inadvertently breaking the subclass.\n- Moreover,\
    \ if a subclass accesses an inherited instance variable and alters its value,\
    \ it may inadvertently introduce bugs in the class that declares the variable,\
    \ especially if the variable is involved in class-internal details.\n\nTo limit\
    \ an instance variable's scope to just the class that declares it, you must mark\
    \ @private. Instance variables marked @private are only available to subclasses\
    \ by calling public accessor methods, if they exist.\n\nAt the other extreme,\
    \ making a variable @public makes it generally available, even outside of classes\
    \ that inherit or declare the variable. Normally, to get information stored in\
    \ an instance variable, other objects must send a message requesting it. A public\
    \ instance variable can be accessed anywhere as if it were a field in a C structure.\n\
    \n```\nWorker *ceo = [[Worker alloc] init];\nceo->boss = nil;\n```\n\nNote that\
    \ the object must be statically typed. Marking variables @public defeats the ability\
    \ of an object to hide its data. Runs counter to a fundamental principle of object-oriented\
    \ programming—the encapsulation of data within objects. Public instance variables\
    \ should therefore be avoided in extraordinary cases.\n\n## Messages to self and\
    \ super\n\nObjective-C provides two methods that can be used within a method definition\
    \ to refer to the object that performs the method—self and super.\n\nSuppose,\
    \ for example, that you define a reposition method that needs to change the coordinates\
    \ of whatever object it acts on. Can invoke the setOrigin:: method to make the\
    \ change. All it needs to do is send setOrigin:: the same object that the message\
    \ was sent to. When you're writing the reposition code, you can refer to that\
    \ object as either self or super. The reposition method could read either:\n\n\
    ```\nreposition {\n    [self setOrigin:someX :someY];\n}\n```\n\nor:\n\n```\n\
    reposition {\n    [super setOrigin:someX :someY];\n}\n```\n\nHere, self and super\
    \ both refer to the object receiving the message, whatever object may happen to\
    \ be. The two messages are quite different, however. self is one of the hidden\
    \ parameters that the messaging routine passes to every method; it is a local\
    \ variable that can be freely within a method implementation, just as the names\
    \ of instance variables can be. super is a term that substitutes for self only\
    \ as the receiver in a message expression. As receivers, the two terms differ\
    \ in how they affect the messaging process:\n\n- self searches for the method\
    \ implementation in the usual manner, starting in the dispatch table of the receiving\
    \ object's class. In the example above, it would begin with the class of the object\
    \ receiving the message.\n- super searches for the method implementation in a\
    \ very different place. It begins in the superclass of the class that defines\
    \ the method where super appears. In the example, it would begin with the superclass\
    \ of the class where reposition is defined.\n\nWherever super receives a message,\
    \ the compiler substitutes another messaging routine for the obj_msgSend function.\
    \ The substitute routine looks directly to the superclass of the defining class—that\
    \ is, the superclass of the class sending the message to super—rather than to\
    \ the class of the object receiving the message.\n```\n"
  mdcn: "\n\n# 第 2 章\n\n## 定义类\n\n当实例变量属于一个非接收者（receiver）的对象时，必须通过静态类型向编译器显式指定该对象的类型。在引用静态类型对象的实例变量时，使用指针运算符\
    \ (->)。\n\n例如，假设 `Sibling` 类声明了一个静态类型的对象 `twin` 作为其实例变量：\n\n```objc\n@Interface\
    \ Sibling : NSObject\n{\n Sibling *twin;\n int gender;\n struct features *appearance;\n\
    }\n```\n\n只要静态类型对象的实例变量在类的作用范围内（在此处，当 `twin` 被类型为同一类时，它们如此），`Sibling` 方法就可以直接设置它们：\n\
    \n```objc\n- makidenticalTwin\n{\n if (Itwin ()) {\n twin = [[Sibling alloc] init];\n\
    \ twin->gender = gender;\n twin->appearance = appearance;\n return twin;\n}\n\
    }\n```\n\n## 实例变量的作用范围\n\n尽管实例变量在类的接口中声明，但它们更多地关乎类的实现方式，而不是其使用方式。对象的接口存在于方法中，而不是存在其内部数据结构中。\n\
    \n通常情况下，方法和实例变量之间存在一种一一对应的关系，如下例所示：\n\n```objc\n- (BOOL)isFilled\n{\n return filled;\n\
    }\n```\n\n但事实并非如此。某些方法可能返回未存储在实例变量中的信息，而某些实例变量可能存储对象不愿公开的信息。\n\n结果随着时间的推移，实例变量的选择可能会发生，即使方法名称保持不变。只要它是与类实例进行交互的载体，这些更改就不会影响其接口。\n\
    \n为了强制对象隐藏数据的能力，编译器限制了实例变量的作用范围——即它们在程序中的可见性。但为了提供灵活性，它还显式设置了四个级别的作用范围。每个级别都由一个编译器指令标记：\n\
    \n| 指令 | 含义 |\n| --- | --- |\n| @private | 实例变量仅在声明它的类内部可访问。 |\n\n## 定义类\n\n|\
    \ 指令 | 含义 |\n| --- | --- |\n| @protected | 实例变量在声明它的类以及继承它的类内部可访问。所有没有显式作用范围指令的实例变量都具有\
    \ @protected 作用范围。 |\n| @public | 实例变量随处可访问。 |\n| @package | 使用现代运行时，@package\
    \ 实例变量在实现该类的可执行镜像内部具有 @public 作用范围，但在外部表现类似于 @private。Objective-C 实例变量的 @package\
    \ 作用范围类似于 C 变量和函数的 `private_extern`。类实现镜像之外任何尝试使用该变量的代码都会获得链接错误。这种作用范围对于框架类中的实例变量最有用，在这些类，@private\
    \ 可能过于严格，而 @protected 或 @public 又过于宽松。 |\n\n图 2-1 展示了作用范围的级别。\n\n### 图 2-1 实例变量的作用范围（未显示\
    \ @package 作用范围）\n\n![](img/6f9b7a92b4fae621991881021b9bf44a_40_0.png)\n\n作用范围指令适用于其列出的所有实例变量，直到下一个指令或列表结束。在示例中，`age`\
    \ 和 `evaluation` 实例变量是私有的；`name`、`Job` 和 `wage` 是受保护的；`boss` 是公共的。\n\n```objc\n\
    @interface Worker : NSObject\n  char *name;\n  @private\n  int age;\n  char *evaluation;\n\
    \  @protected\n```\n\n## 类实现\n\n# 第 2 章\n定义类\n\n```objc\nid job:\nfloat wage:\n\
    @public\nid boss:\n}\n```\n\n默认情况下，所有未标记的实例变量（如 `name`）都是 @protected。\n\n一个类声明的所有实例变量，无论如何标记，都在类定义的作用范围内。例如，声明了\
    \ `job` 实例变量的类（如上面的 `Worker` 类）可以在方法定义中引用它：\n\n```objc\n- promoteTo:newPosition\n\
    {\nid old = job;\njob = newPosition;\nreturn old;\n}\n```\n\n显然，如果一个类无法访问自己的实例变量，那么这些实例变量将毫无用。\n\
    \n通常，一个类还可以访问它继承的实例变量。引用实例变量的能力通常随着变量一起继承。如果你认为类定义仅仅是对其所继承类的详细阐述，那么对于那些其整个数据结构都在其作用范围内的类来说，这样做是合理的。之前说明的\
    \ `promoteTo:` 方法也可以定义在任何从 `Worker` 类继承 `job` 变量的类中。\n\n然而，你可能想限制继承类直接访问实例变量，原因如下：\n\
    \n- 一旦子类访问了继承的变量，声明该变量的类就与该实现的某部分绑定。在后续版本中，它无法在不意外破坏子类的情况下消除该变量或更改其扮演的角色。\n- 此外，如果子类访问了继承的实例变量并更改了它的值，可能会意外在声明该变量的类中引入错误，特别是当变量涉及类内部细节时。\n\
    \n要将实例变量的作用范围限制为声明它的类，你必须标记为 @private。标记为 @private 的实例变量仅可以通过调用公共访问器方法（如果存在的话）供子类使用。\n\
    \n在另一个极端，将变量标记为 @public 会使其变为可用，甚至在继承或声明该变量的类之外。通常，为了获取存储在实例变量中的信息，其他对象必须发送消息请求它。公共实例变量可以在地方访问，就像它是\
    \ C 结构中的字段一样。\n\n```objc\nWorker *ceo = [[Worker alloc] init];\nceo->boss = nil;\n\
    ```\n\n注意对象必须是静态类型。将变量标记为 @public 破坏了对象隐藏数据的能力。因此，应在特殊情况下避免公共实例变量。这违背了面向对象编程的基本原则——数据的封装。\n\
    \n## 向 self 和 super 发送消息\n\nObjective-C 提供了两种可以在方法定义内部引用执行该方法的对象——self 和 super。\n\
    \n例如，假设你定义了一个 `reposition` 方法，需要更改它所作用对象的坐标。调用 `setOrigin::` 方法来更改。它只需要向接收消息的对象发送\
    \ `setOrigin::`。当你编写 `reposition` 代码时，可以使用 self 或 super 来引用该对象。`reposition` 方法可以这样：\n\
    \n```objc\n- reposition {\n    [self setOrigin:someX :someY];\n}\n```\n\n或者：\n\
    \n```objc\n- reposition {\n    [super setOrigin:someX :someY];\n}\n```\n\n在这里，self\
    \ 和 super 都指向接收消息的对象。然而，这两个消息大不相同。self 是消息例传递给每个方法的隐藏参数之一；它是方法实现内部可以自由使用的局部变量，就像实例变量名一样。super\
    \ 是仅在消息表达式作为接收者时替换 self 的术语。作为接收者，这两个术语影响消息过程的方式不同：\n\n- self 以通常方式搜索方法实现，从接收对象类的分发表开始。在上面的示例中，它将从接收消息对象的类开始。\n\
    - super 在非常不同的地方搜索方法实现。它从出现 super 的方法的父类开始。在示例中，它将从定义 reposition 的类的父类开始。\n\n\
    在任何 super 接收消息的地方，编译器都会用另一个消息例程替换 `obj_msgSend` 函数。替换例程直接查找定义类的父类——即发送消息给 super\
    \ 的类的父类——而不是接收消息对象的类。\n```\n\n"
