    \ 方法可以释放接收者并返回 `nil`，表示无法创建请求的对象。\n\n由于 `init` 方法返回的可能不是新分配的实例，甚至可能返回 `nil`，因此让程序使用初始化方法的返回值，而不仅仅是使用\
    \ `alloc` 或 `allocWithName` 的返回值，是非常关重要的。以下代码非常危险，因为它忽略了 `init` 的返回值。\n\n```\n\
    id addObject = [[SomeClass alloc];\n[anObject init];\n[anObject someOtherMessage];\n\
    ```\n\n要初始化一个对象，你应该将分配和初始化消息合并在一行：\n\n```\nid addObject = [[SomeClass alloc] init];\n\
    [anObject someOtherMessage];\n```\n\n如果存在 `init...` 方法可能返回 `nil` 的情况（参见“处理初始化失败”，第52页），你应该在继续操作之前检查返回值：\n\
    \n```\nid addObject = [[SomeClass alloc] init];\nif (anObject)\n    [anObject\
