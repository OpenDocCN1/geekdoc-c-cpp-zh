  - "[PAGE 106]\n\n# CHAPTER 12\n\n# Threading\n\nObjective-C provides support for\
    \ thread synchronization and exception handling, which are explained in this chapter\
    \ and in \"Exception Handling\" (page 103). To turn on for these features, use\
    \ the `-fobjc-exceptions` switch of the GNU Compiler Collection (GCC) version\
    \ 3.3 and later.\n\nNote: Using either of these features in a program renders\
    \ the application runnable only on Mac OS v10.3 and because later runtime support\
    \ for exception handling is not present in earlier versions of the software.\n\
    \nObjective-C supports multithreading in applications. Therefore, two threads\
    \ can try to modify the same object at the same time, a situation that can cause\
    \ serious problems in a program. To protect sections of code from being executed\
    \ by more than one thread at a time, Objective-C provides the `@synchronized()`\
    \ directive.\n\nThe `@synchronized` directive locks a section of code for use\
    \ by a single thread. Other threads are blocked until the thread exits the protected\
    \ code—that is, when execution continues past the last statement in the `@synchronized`\
    \ block.\n\nThe `@synchronized` directive takes its argument as any Objective-object,\
    \ locking self. The object is known as a mutual exclusion or mutex. it allows\
    \ a thread to lock a section of code to prevent its use by others. You should\
    \ use separators to protect different critical sections of a program. It is safest\
    \ to create all mutual exclusion objects before the application becomes multithreaded,\
    \ to avoid race conditions.\n\nListing 12-1 shows how to use `self` as the mutex\
    \ to synchronize access to the instance methods of the current object. You can\
    \ take a similar approach to synchronize the class methods of the associated class,\
    \ using the class object of `self`. In the latter case, of course, only one thread\
    \ at a time is allowed to execute a class method because there is only one class\
    \ that is shared by all callers.\n\n# Listing 12-1 Locking a method using self\n\
    \n```\n(void)criticalMethod {\n    @synchronized(self) {\n        // Critical\
    \ code.\n    ...}\n}\n```\n\nListing 12-2 shows a general approach. Before executing\
    \ a critical process, the code obtains a semaphore from the `Account` class and\
    \ uses it to lock the critical section. The `Account` class could create the semaphore\
    \ in its `initialize` method.\n\n# Listing 12-2 Locking a method using a custom\
    \ semaphore\n\n```\nAccount *account = [Account accountFromString:[account string]];\n\
    // Get the semaphore.\n```\n\n2020-10-08 | © 2020 Apple Inc. All Rights Reserved.\n\
    \n107"
  - "[PAGE 107]\n\n# Threading\n\n```\nid accountSemaphore = [Account semaphore];\n\
    @synchronized(accountSemaphore) {\n  // Critical code.\n}\n```\n\nThe Objective-C\
    \ synchronization feature supports recursive and reentrant code. A thread can\
    \ use a single\nsemaphore several times in a recursive manner; other threads are\
    \ blocked from using it until the thread\nreleases all the locks obtained with\
    \ it; that is, every @synchronized() block is exited normally or through\nan exception.\n\
    \nWhen code in an @synchronized() block throws an exception, the Objective-C runtime\
    \ catches the\nexception, releases the semaphore (so that the protected code can\
    \ be executed by other threads), and\nrethrows the exception to the next exception\
    \ handler."
