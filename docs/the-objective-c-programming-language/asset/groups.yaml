    # CHAPTER 6


    Categories and Extensions


    Note that a category can declare additional instance variables for the class;
    it includes only methods. However, all instance variables within the scope of
    the class are also within the scope of the category. That includes all instance
    variables declared by the class, even ones declared @private.


    There''s no limit to the number of categories you can add to a class, but each
    category name must be different, and each should declare and define a different
    set of methods.


    # How You Can Use Categories


    There are several ways in which you can use categories:


    +   - Extend classes defined by other implementors


    For example, you may add methods to the classes defined in the Cocoa frameworks.
    The added methods are inherited by subclasses and are indistinguishable at runtime
    from the original methods of the class.


    +   - As an alternative to a subclass


    Rather than define a subclass to extend an class, through a category you can add
    methods to the class directly. For example, you could add categories to NSArray
    and other Cocoa classes. As in the case of a subclass, you dont need source code
    for the class you''re extending.


    +   - To distribute the implementation of a new class into multiple source files


    For example, you could group the methods of a large class into several categories
    and put each category in its own file. When used this, categories can benefit
    the development process in a number of ways—

    - Provide a simple way of grouping related methods. Similar methods in different
    classes can be kept together in the same source file.

    - Simplify the management of a large class when several developers contribute
    to the class definition.

    - Let you achieve more locality of reference for many commonly used methods.

    - Enable you to configure a class differently for separate applications, without
    having to maintain different versions of the source code.


    +   - To declare informal protocols


    See "Informal Protocols" (page 63), as discussed under "Declaring Interfaces for
    Others to Implement" (page 59).


    Although the Objective-C language allows you to use a category to override methods
    the class inherits, or even methods declared in the class interface, you are strongly
    discouraged from doing so. A category is not a shortcut for a subclass. There
    are several significant shortcuts to using a category to override methods:'
  - '[PAGE 82]


    # CHAPTER 6

    Categories and Extensions


    +   * When a category overrides an inherited method, the method in the category
    can, as usual, invoke the inherited implementation via a message to super. However,
    if a category overrides a method that exists in the category''s class, there is
    no way to invoke the original implementation.


    +   * A category cannot reliably override methods declared in another category
    of the same class.


    This issue is of particular significance because many of the Cocoa classes are
    implemented using categories. A framework-defined method you try to override may
    itself have been implemented in a category, and so which implementation takes
    precedence is not defined.


    +   * The very presence of some categories may cause behavior changes across all
    frameworks. For example, if you use the windowWillClose delegate in category on
    NSObject, all window delegates in your program respond when using the category
    method; the behavior of all instances of NSString may change. Categories you add
    on a framework class may cause mysterious changes in behavior and lead to crashes.


    # Categories of the Root Class


    A category can add methods to any class, including the root class. Methods added
    to NSObject become available to all classes that are linked to your code. Adding
    methods to the root class with a category can be useful at times, but it can also
    be dangerous. Although it may seem that the modifications category makes are well
    understood and of limited impact, inheritance gives them a scope. You may be making
    unintended changes to unseen classes in your application; you may not know all
    the consequences of what you''re doing. Moreover, others working on your application,
    who are unaware of your changes, won''t understand what they''re.


    In addition, there are two other considerations to keep in mind when implementing
    methods for the root class:


    +   * Messages to super are invalid (there is no subclass of NSObject).


    +   * Classes objects can perform instance methods defined in the root class.


    Normally, classes can perform only class methods. But instance methods defined
    in the root class are a special case. They define an interface to the runtime
    that all objects inherit. Class objects are full-fledged objects and share the
    same interface.


    This feature means that you need to take into account the possibility that an
    instance method you define in a category of the NSObject class might be performed
    not only by instances but by class objects as well. For example, within the method,
    self might mean a class object as well as an instance. See NSObject Class Reference
    for more information on class access to root methods.


    # Extensions


    Class extensions are like anonymous categories, except that the methods they declare
    must be implemented in the main @implementation block for the corresponding class.'
  - '[PAGE 83]


    # CHAPTER 6


    # Categories and Extensions


    It is common for a class to have a publicly declared API and to have additional
    methods declared privately for sole use by the framework within which the class
    resides. You can declare such methods in a category (or in more than one category)
    in a private header file or implementation file as mentioned above. This works,
    but the compiler cannot verify that all methods are implemented.


    For example, the following declarations and implementation compile without error,
    even though the setNumber: method has no implementation:


    ```

    @interface MyObject : NSObject

    NSNumber *number;

    -(NSNumber *)number;

    @end

    ```


    ```

    @implementation MyObject

    -(NSNumber *)number {

    return number;

    }

    @end

    ```


    Invoking setNumber:at, however, would generate an error.


    Class extensions allow you to declare additional required methods for a class
    in locations other than the primary classinterface block, as illustrated in the
    following example:


    ```

    @interface MyObject : NSObject

    NSNumber *number;

    -(NSNumber *)number;

    @end

    ```


    ```

    @interface MyObject ()

    -(void)setNumber:(NSNumber *)newNumber;

    @end

    ```


    ```

    @implementation MyObject

    -(NSNumber *)number {

    return number;

    }

    -(void)setNumber:(NSNumber *)newNumber {

    number = newNumber;

    }

    @end

    ```


    Notice that in this case:


    +   - No name is given in the parentheses in the second @interface block.'
  - '[PAGE 84]


    +   * The implementation of the `setNumber:` method appears within the main `@implementation`
    block for the class.


    The implementation of the `setNumber:` method *must* appear within the main `@implementation`
    block of the class (you cannot implement it in a category). If this is not the
    case, the compiler emits a warning that it cannot find a method definition for
    `setNumber:`.'
