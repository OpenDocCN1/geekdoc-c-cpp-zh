    \nCovering inherited initialization methods makes the class you define more portable\
    \ to other applications. If you leave an inherited method uncovered, someone else\
    \ may use it to produce incorrectly initialized instances of your class.\n\n#\
    \ The Designated Initializer\n\nIn the example given in \"Coordinating Classes\"\
