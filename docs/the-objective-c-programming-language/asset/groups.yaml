  - '[PAGE 68]


    # Declared Properties


    The Objective-C declared properties feature provides a simple way to declare and
    implement an object’s accessor methods.


    # Overview


    There are two aspects to this language feature: the syntactic elements you use
    to specify and optionally synthesize declared properties, and a related syntactic
    element that is described in “Dot Syntax” (page 19).


    You typically access an object’s properties (in the sense of its attributes and
    relationships) through a pair of accessor (getter/setter methods). By using accessor
    methods, you adhere to the principle of encapsulation ("Mechanisms Of Abstraction"
    in *Object-Oriented Programming with Objective-C*). You can exercise tight control
    of the getter/setter pair and the underlying state management while clients of
    the API remain insulated from the implementation changes.


    Although using accessor methods has significant advantages, writing accessor methods
    is nevertheless a tedious process—particularly if you have to write code to support
    garbage-collected and reference-counted elements. Moreover, aspects of the property
    that may be important to consumers of the API are left obscured—such as whether
    the accessor methods are thread-safe or whether new values are copied when set.


    Declared properties address the problems with standard accessor methods by providing
    the following features:


    +   * The property declaration provides a clear, explicit specification of how
    the accessor methods behave.

    * The compiler can synthesize accessor methods for you, according to the specification
    you provide in the declaration. This means you have less code to write and maintain.

    * Properties are represented syntactically as identifiers and are scoped, so the
    compiler can detect use of undeclared properties.


    # Property Declaration and Implementation


    There are two parts to a declared property, its declaration and its implementation.'
