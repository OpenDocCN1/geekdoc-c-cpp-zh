    \nA class must also make sure that all inherited initialization methods work.\
    \ For example, if class A defines an init method and its subclass B defines an\
    \ initWithName: method, as shown in Figure 3-1, B must also make sure that an\
    \ init message successfully initializes B instances. The easiest way to do that\
    \ is to replace the inherited init method with a version that invokes initWithName:\n\
    \n```\ninit (\n    return [super initWithName:\"default\\];\n)\n```\n\nThe initWithName:\
    \ method would, in turn, invoke the inherited method, as shown earlier. Figure\
