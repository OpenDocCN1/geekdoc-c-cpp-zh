    # 第 5 章


    声明属性


    ## 核心基础


    正如“属性声明特性”（第 70 页）所示，在 Mac OS X v10.6 之前，你不能为非对象类型指定 `retain`。因此，如果你声明了一个类型为 `CFType`
    的属性，且合成器按照如下例所示了这些属性：


    ```

    @interface MyClass : NSObject

    CGImageRef myImage;


    @property(readwrite) CGImageRef myImage;

    @end


    @implementation MyClass

    @synthesize myImage;

    @end

    ```


    那么在引用计数的环境中，合成的 setter 仅仅是将新值赋值给实例变量（新值不会被 `retain`，旧值也不会被 `release`）。对于 Core
    Foundation 对象，简单的赋值通常是不正确的；你不应该合成这些方法，而应该自己实现。


    在垃圾回收的环境中，如果图像变量被声明为 `__strong`：


    ```

    ...

    __strong CGImageRef myImage;

    @property CGImageRef myImage;

    ```


    那么访问器就会被适当地合成——例中的图像不会被 `CFRetain` 保留，但合成的 setter 方法会触发写屏障（writer barrier）。


    ## 示例：声明属性和合成访问器


    列表 5-4 中的示例展示了以不同方式使用属性：


    - `Link` 协议声明了一个属性 `next`。

    - `MyClass` 采用了 `Link` 协议，因此它隐式地声明了 `next`。`MyClass` 还声明了其他属性。

    - `creationTimestamp` 和 `next` 是合成的，但使用了不同名称的实例变量。

    - `name` 是合成的并使用了实例合成（回想，旧版运行时不支持实例变量合成——请参阅“属性实现指令”（第 73 页）和“运行时差异”（第 80 页））。

    - `gratuitFloat` 有一个动态指令——它通过直接方法支持；它是默认值；它通过直接方法实现支持（因为它是只读的，所以只需要一个 getter），并带有指定的名称（`nameAndAgeString`）。


    # 声明属性


    列表 5-4 为类声明属性


    ```

    @protocol Link

    @property id <Link> next;

    @end

    ```


    ```

    @interface MyClass : NSObject <Link>

    NSTimeInterval intervalSinceReferenceDate;

    CGFloat gratuitFloat;

    id <Link> nextLink;

    @property(readonly) NSTimeInterval creationTimestamp;

    @property(copy) NSString *name;

    @property CGFloat gratuitFloat;

    @property(readonly,get=nameAndAgeString) NSString *nameAndAge;

    @end

    ```


    ```

    @implementation MyClass

    ```


    ```

    @synthesize creationTimestamp = intervalSinceReferenceDate;

    // 在旧版运行时中合成 "name" 是错误；

    // 在现代运行时中，会合成实例变量。

    @synthesize next = nextLink;

    // 使用实例变量 "nextLink" 进行存储。

    @dynamic gratuitFloat;

    // 此指令并非严格必须。

    (CGFloat)gratuitousFloat {

    return gratuitFloat;

    }

    (void)setGratuitousFloat:(CGFloat)value {

    gratuitousFloat = value;

    }

    (NSString*)nameAndAgeString {

    return [NSString stringWithFormat:@%@%fs", self.name, [NSDate timeIntervalSinceReferenceDate]
    intervalSinceReferenceDate];

    }

    ```


    ```

    -(id)init {

    self = [super init];

    if (self) {

    intervalSinceReferenceDate = [NSDate timeIntervalSinceReferenceDate];

    }

    return self;

    }

    ```


    ```

    -(void)dealloc {

    [nextLink release];}

    ```


    ```

    [name release]:

    [super dealloc];

    }

    @end

    ```


    ## 属性子类化


    你可以重写一个只读属性使其变为可写。例如，你可以定义一个类 `MyInteger`，其中包含一个只读属性 `value`：


    ```

    @interface MyInteger : NSObject

    {

    NSInteger value;

    }

    @property(readonly) NSInteger value;

    @end

    ```


    ```

    @implementation MyInteger

    @synthesize implement

    @end

    ```


    你可以实现一个子类 `MyMutableInteger`，它重新定义了属性以使其可写：


    ```

    @interface MyMutableInteger : MyInteger

    @property(readwrite) NSInteger value;

    @end

    ```


    ```

    @implementation MyMutableInteger

    @dynamic value;

    ```


    ```

    (void)setValue:(NSInteger)newX {

    value = newX;

    }

    @end

    ```


    ## 性能与线程


    如果你提供了自己的访问器方法实现，那么声明属性的这一事实对方法的效率或线程安全没有影响。


    如果你使用合成的访问器，编译器生成的方法实现取决于你在属性声明中提供的规范。影响性能和线程的属性有 `retain`、`assign`、`copy` 和 `nonatomic`。这前三个属性仅影响
    `set` 方法赋值部分的实现，如下所示实现所示：


    ```

    // assign

    property = newValue;


    // retain

    if (property != newValue) {

    ```


    ```

    [property release];

    property = [newValue retain];

    }

    ```


    ```

    // copy

    if (property != newValue) {

    [property release];

    [newValue copy];

    }

    ```


    `atomic` 属性的效果取决于环境。默认情况下，在引用计数的环境中，合成的访问器是原子的。（注：原文此处存在大量重复句子，译文已按逻辑处理）。


