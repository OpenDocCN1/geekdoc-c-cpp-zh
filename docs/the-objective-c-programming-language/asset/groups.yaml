    \ to the principle of encapsulation (\"Mechanisms Of Abstraction\" in *Object-Oriented\
    \ Programming with Objective-C*). You can exercise tight control of the getter/setter\
    \ pair and the underlying state management while clients of the API remain insulated\
    \ from the implementation changes.\n\nAlthough using accessor methods has significant\
    \ advantages, writing accessor methods is nevertheless a tedious process—particularly\
    \ if you have to write code to support garbage-collected and reference-counted\
    \ elements. Moreover, aspects of the property that may be important to consumers\
    \ of the API are left obscured—such as whether the accessor methods are thread-safe\
    \ or whether new values are copied when set.\n\nDeclared properties address the\
    \ problems with standard accessor methods by providing the following features:\n\
    \n- *The property declaration provides a clear, explicit specification of how\
    \ the accessor methods behave.*\n- The compiler can synthesize accessor methods\
    \ for you, according to the specification you provide in the declaration. This\
    \ means you have less code to write and maintain.\n- Properties are represented\
    \ syntactically as identifiers and are scoped, so the compiler can detect use\
    \ of undeclared properties.\n\n# Property Declaration and Implementation\n\nThere\
    \ are two parts to a declared property, its declaration and its implementation.\n\
    \n# CHAPTER 5\n\nDeclared Properties\n\n# Property Declaration\n\nA property declaration\
