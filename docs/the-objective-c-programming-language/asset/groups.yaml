  - '[PAGE 48]


    # Allocating and Initializing Objects


    # Allocating and Initializing Objects


    It takes two steps to create an object using Objective-C. You must:


    +   - Dynamically allocate memory for the new object

    - Initialize the newly allocated memory to appropriate values


    An object isn''t fully initialized until both steps have been completed. Each
    step is accomplished by a separate method typically in a single line of code:


    ```

    id anObject = [[Rectangle alloc] init];

    ```


    Separating allocation from initialization gives you control over each step so
    each can be modified independently of the other. The following sections look first
    at allocation and then at initialization and discuss how they are controlled and
    modified.


    In Objective-C, memory for new objects is allocated using class methods defined
    in the NSObject class. NSObject defines two primary methods for this purpose,
    alloc and allocWithZone:.


    These methods allocate enough memory to hold all the instances of an object belonging
    to the receiver. They do not need to be overridden and modified in subclasses.


    The alloc and allocWithZone methods initialize a newly allocated object''s isa
    variable so that it points to the class (the class object). All other instance
    variables are set to 0. An object needs to be specifically initialized before
    it can be safely used.


    This initialization is the responsibility of class-specific instance methods that,
    by convention, the abbreviation init. If the method takes no parameters, the method
    name is just four letters, init. If it takes parameters, labels for the parameters
    follow the "init" prefix. For example, an NSView object can be initialized with
    initFrame:method.


    Every class that declares instance must provide an init... to initialize them.
    The NSObject declares the isa variable and defines an init method. However, because
    isa is initialized when memory for an object is allocated, the init method of
    NSObject returns self. NSObject declares the method to establishing the naming
    convention described earlier.


    # The Returned Object


    An init... method normalizes the instance variables of the receiver and returns
    it. It''s the responsibility of the method to return an object that can be used
    without error.


    Allocating and Initializing Objects


    2010-12-08 | © 2010 Apple Inc. All Rights Reserved.'
- md: "\n## CHAPTER 3\n## Allocating Objects\n\nIn some cases, this responsibility\
    \ can mean returning a different object from the receiver. For example, if a class\
    \ needs a list of objects, it might provide an `initWithName:` method to initialize\
    \ new instances. If there can be no than one object per name, `initWithName:`\
    \ might refuse to assign the same name to a new instance, and if name is already\
    \ being used by another object, it may free the newly allocated instance and return\
    \ the other object—thus ensuring the uniqueness of the name while at the same\
    \ time providing what was asked for, in an instance.\n\nIn a few cases, it might\
    \ be impossible for an `init...` method to do what it's asked to do. For example,\
    \ `initFromFile:` method might get the data from a file passed as an argument.\
    \ If the filename passed doesn't correspond to an actual file, it will fail to\
    \ complete the initialization. In such a case, the `init...` method could free\
    \ the receiver and return `nil`, indicating that the requested object cannot be\
    \ created.\n\nBecause an `init` method might return other than the newly allocated\
    \ object, or even return `nil`, it is important that programs use the value returned\
    \ by the initialization method, not just that of `alloc` or `allocWithName`. The\
    \ following code is very dangerous, since it ignores the return of `init`.\n\n\
    ```\nid addObject = [[SomeClass alloc];\n[anObject init];\n[anObject someOtherMessage];\n\
    ```\n\nTo initialize an object, you should combine allocation and initialization\
    \ messages in one line\n\n```\nid addObject = [[SomeClass alloc] init];\n[anObject\
    \ someOtherMessage];\n```\n\nIf there's a case the `init...` method might return\
    \ `nil` (see \"Handling Initialization Failure\" (page 52)), then you should check\
    \ the return value before proceeding:\n\n```\nid addObject = [[SomeClass alloc]\
    \ init];\nif (anObject)\n    [anObject someOtherMessage];\nelse\n```\n\n## Implementing\
    \ an Initializer\n\nWhen an object is created, all bits of memory (except for\
    \ `isa`)—and the values for all instance variables—are set to 0. In some situations,\
    \ this may be all you require when an object is initialized; in many cases, you\
    \ want to provide default values for an object's instance variables, or you want\
    \ to pass values as parameters to the initializer. In these other cases, you need\
    \ to write a custom initializer. In Objective-C, custom initializers are subject\
    \ to more constraints and conventions than are most other methods.\n\n## Constraints\
    \ and Conventions\n\nThere are several constraints and conventions that apply\
    \ to initializer methods that do not apply to other methods:\n\n- * By convention,\
    \ the name of a custom initializer method begins with `init`.\n\n## Allocating\
    \ and Initializing Objects\n\nExamples from the Foundation framework include initWith;\
    \ initWithObjects; and initWithObjectsKeys.\n\n- * The return type of an initializer\
    \ method should be id.\n\nThe return type should be id because id gives an indication\
    \ that the class is purposely not considered—that the class is unspecified and\
    \ subject to change, depending on context of invocation. For example, NSString\
    \ provides the method initWithFormat: when you send to an instance of NSMutableString\
    \ (a subclass of NSString), the message returns an instance of NSMutableString.\
    \ (See, also, the singleton example given in \"Combining Allocation and Initialization\"\
    \ (page 57)).\n\n- * In the implementation of a custom initializer, you must invoke\
    \ a designated initializer.\n\nDesignated initializers are described in \"The\
    \ Designated Initializer\" (page 55); a full explanation of this is given in \"\
    Coordinating Classes\" (page 53).\n\nIn brief, if you are implementing a designated\
    \ initializer, it must invoke its superclass's designated initializer. If you\
    \ are implementing any other initializer, it should invoke its own class's designated\
    \ initializer, or another of its own initializers that ultimately invokes the\
    \ designated initializer.\n\nBy default, the designated initializer is init.\n\
    \n- * You should assign self to the value returned by the initializer because\
    \ the initializer could return an object different from the one returned by the\
    \ receiver.\n\n- * If you set the value of an instance variable, you typically\
    \ do direct assignment rather than using an accessor method.\n\nDirect assignment\
    \ avoids the possibility of triggering unwanted side effects in the accessors.\n\
    \n- * At the end of the initializer, you must return self unless the initializer\
    \ fails, in which case you return nil.\n\nFailed initializers are discussed in\
    \ more detail in \"Handling Initialization Failure\" (page 52).\n\nThe following\
    \ example illustrates the implementation of a custom initializer that inherits\
    \ from NSObject and has an instance variable, creationDate, that represents the\
    \ time when the object was created:\n\n```\n(init {\n    // Assign self to value\
    \ returned by super's designated initializer\n    // Designated initializer for\
    \ NSObject is init\n    self = [super init];\n    if (self) {\n        creationDate\
    \ = [[NSDate alloc] init];\n    }\n    return self;\n})\n```\n\n(The reason for\
    \ using the (self) pattern is discussed in \"Handling Initialization Failure\"\
    \ (page 52).\n\n## CHAPTER 3\n## Allocating and Initializing Objects\n\nAn initializer\
    \ doesn't need to provide a parameter for each variable. For example, if a class\
    \ requires instances to have a name and a data source, it might provide an `initWith:fromURL:`\
    \ method, but set nonessential instance variables to arbitrary values or allow\
    \ them to have the null values set by default. It could rely on methods like `setEnabled:`,\
    \ `setFriend:`, and `setDimensions:` to modify default values after the initialization\
    \ phase has been completed.\n\nThe next example illustrates the implementation\
    \ of a custom initializer that takes a single parameter. In this case, it inherits\
    \ from `UIView`. It shows what you can do before invoking the superclass's designated\
    \ initializer.\n\n```\n(id)initWith:(NSImage *)image {\n// Find the size for the\
    \ new instance from the image\nNSSize size = image.size;\nNSFrame frame = NSMakeRect(0.0,\
    \ 0.0, size.width, size.height);\n\n// Assign to value returned by super's designated\
    \ initWithFrame:\nself = [super initWithFrame:frame];\nif (self) {\n    image\
    \ = [image retain];\n}\nreturn self;\n}\n```\n\nThis example doesn't show what\
    \ to do if there are any problems during initialization; how to handle such problems\
    \ is discussed in the next section.\n\n## Handling Initialization Failure\n\n\
    In general, if there is a problem during an initialization method, you should\
    \ call the `release` method and return `nil`.\n\nThere are two consequences of\
    \ this policy:\n\n- Any object (whether your own class, a subclass, or an external\
    \ caller) that receives `nil` from an initializer method should be able to deal\
    \ with it. In the unlikely case that the caller has established any external references\
    \ to the object before, you must not add connections.\n- You must make sure that\
    \ `dealloc` methods are safe in the presence of partially initialized objects.\n\
    \n> You should call the `release` method on `self` at the point of failure. If\
    \ you get `nil` back from an invocation of the superclass initializer, you should\
    \ not also call `release`. You should clean up any references you have used that\
    \ are not dealt with in `dealloc` and return `nil`. These steps are typically\
    \ handled by the superclass of performing initialization within a block dependent\
    \ on the result value of the superclass—as seen in the following examples:\n\n\
    ```\n(id)init {\nself = [super init];\nif (self) {\n    creationDate = [[NSDate\
    \ alloc] init];\n}\nreturn self;\n```\n\n## CHAPTER 3\nThe following example builds\
    \ on that shown in \"Constraints and Conventions\" (page 50) to show how to\n\
    handle an inappropriate value by the parameter:\n\n```\n(id)initWithImage:(UIImage*)anImage\
    \ {\n    if (anImage == nil) {\n        [self release];\n        return nil;\n\
    \    }\n    // Find the size for the new instance from the image\n    NSSize size\
    \ = anImage.size;\n    CGRect frame = NSMakeRect(0.0, 0.0, size.width, size.height);\n\
    \n    // Assign value returned by super's designated initializer\n    // Designated\
    \ initializer for UIView\n    self = [super initWithFrame:frame];\n    if (self)\
    \ {\n        image = [anImage retain];\n        return self;\n    }\n}\n```\n\n\
    The next example illustrates best practice, in case of a problem, there is a possibility\
    \ of returning\nmeaningful information in the form of an NSError object by reference:\n\
    \n```\n(id)initWithURL:(NSURL*)aURL error:(NSError**)errorPtr {\n    self = [super\
    \ init];\n    if (self) {\n        NSData *data = [NSData alloc] initWithContentsOfURL:aURL\
    \ options:NSUncachedRead error:errorPtr];\n        if (data == nil) {\n      \
    \      // In this case the error object is created in the NSData initializer\n\
    \            [self release];\n            return nil;\n        }\n        // implementation\
    \ continues...\n```\n\nYou would typically not use exceptions to signify errors\
    \ of this sort—for more information, see Error Handling Programming Guide.\n\n\
    ## Coordinating Classes\n\nThe init... methods typically initialize only those\
    \ variables declared in that class. Inherited\ninstance variables are initialized\
    \ by sending a message to super to perform an initialization method defined\n\
    sewhere up in the hierarchy:\n\n```\n(id)initWithName:(NSString*)string {\n  \
    \  self = [super init];\n    if (self) {\n        name = [string copy];\n    }\n\
    ```\n\nImplementing an Initializer\n"
  mdcn: "\n\n## 第3章\n## 分配对象\n\n在某些情况下，这种责任可能意味着从接收者返回一个不同的对象。例如，如果一个类需要一个对象列表，它可能会提供一个\
    \ `initWithName:` 方法来初始化新实例。如果每个名称只能有一个对象，那么 `initWithName:` 可能会拒绝为新实例分配相同的名称；如果该名称已被另一个对象使用，它可能会释放新分配的实例并返回另一个对象——从而在确保名称唯一性的同时，在实例层面上提供了所请求的内容（在另一个实例中）。\n\
