  - '[PAGE 99]


    # Methods and Selectors


    Compiled selectors identify name, not method implementations. The display method
    for one class, for example, has the same selector as display methods defined in
    other classes. This is essential for polymorphism and dynamic binding; it lets
    you send the message to receivers belonging to different classes. If there were
    one selector per method implementation, a message would be different from a function
    class.


    A class and an instance method with the same name are assigned the same selector.
    However, because of their separate domains, there''s no confusion between the
    two. A class could define a display method in addition to a display instance method.


    # Method Return and Parameter Types


    The messaging routine has access to method implementations only through selectors,
    so it treats all methods with the same selector alike. It discovers the return
    type of a method, and the data types of its parameters, from the selector. However,
    except for messages sent to typed receivers, dynamic binding requires all implementations
    of identically named methods to have the same return type and same parameter types
    (Statically typed receivers are an exception to this rule because the compiler
    can learn about the method implementation from the class type).


    Although identically named class methods and instance methods are represented
    by the same selector, they can have different parameter types and return types.


    # Varying the Message at Runtime


    The performSelector:performSelector:withObject; and performSelector:withObject:with
    methods defined in the NSObject protocol, take SEL as their initial parameters.
    All three methods map directly into the messaging function. For


    ```

    [friend performSelector:@selector(gossipAbout:)

    withObject:aNeighbor];

    ```


    is equivalent to:


    ```

    [friend gossipAbout:aNeighbor];

    ```


    These methods make possible to vary a message at runtime, just as it''s possible
    to vary the object that receives the message. Variable names can be used in both
    halves of a message expression:


    ```

    id helper = getTheReceiver();nSEL request = getSelector();n[helper performSelector:request];

    ```


    In this example, the receiver (helper) is chosen at runtime (by the fictitious
    getReceiver function), and the method the receiver is asked to perform (request)
    is also determined at runtime (by the equally fictitious getSelector function).'
  - '[PAGE 100]


    # CHAPTER 10


    Selectors


    > Note: performSelector: and its companions return an object of type id. If the
    method''s performed returns a different type, it should be cast to the proper
    type. (However, casting doesn''t work for all types; the method should return
    a pointer or a compatible type with a pointer.)


    # The Target-Action Design Pattern


    In its treatment of user-interface controls, AppKit makes good use of the ability
    to vary when giving instructions to an application. Most the message at runtime.


    NSControl objects are graphical devices that can be used to give instructions
    to an application. Most resemble-world control devices such as buttons, switches,
    knobs, text fields, dials, menu items, and the. In software, these devices stand
    between the application and the user. They interpret events coming from hardware
    devices such as the keyboard and translate them into application-specific instructions.
    For example, a button labeled "Find" would translate a mouse click into an instruction
    for the application to starting searching search.


    AppKit defines a template for creating control devices and defines a few off-shelf
    devices of its own. For example, NSButton defines an object that you can assign
    to an NS instance and initialize with a size, a label, a font, and a keyboard
    shortcut. When the user clicks the button (or uses the shortcut), the NSButton
    sends a message instructing the application to do something. To do this, NSButton
    object must be initialized not just with an image, a size, and a label, but with
    message to send and who to send it to. Accordingly, an NSButton is initialized
    for an action message (the method it selects in the message sends) and a target
    (the object should receive the message).


    ```

    [myButton action:@selector(theReap:)]

    [myButton target:anObject];

    ```


    When the user clicks the corresponding button, the button sends the message using
    the NSObject protocol method performSelector:with:. All messages take a single
    parameter, the id of control sending the message.


    If Objective-C didn''t allow the message to be varied, all NS objects would have
    to send the same message; the name of the message would be frozen in the NSButtoncell
    code. Instead of implementing a mechanism for interacting users across all controls,
    buttons and other controls would have to contain the content of the message. Constrained
    messaging would make it difficult for any object to respond to more than one button.
    There would either be one target for each button, or the target object would have
    to discover which button the message came from and accordingly. Each time you
    rearranged the user interface, you would also have to reimplement the method that
    responds to the action message. An absence of dynamic messaging would create an
    unnecessary complication that Objective-C happily avoids.


    # Avoiding Messaging Errors


    If an object receives a message to perform that that isn''t in its repertoire,
    an error results. It''s the same sort of error calling a nonexistent function.
    But because messaging occurs at runtime, the error often isn''t evident until
    the program executes.


