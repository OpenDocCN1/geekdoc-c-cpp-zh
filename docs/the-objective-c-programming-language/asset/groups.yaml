- md: "\n# CHAPTER 1\n\n# Objects, Classes, and Messaging\n\n```\n@implementation\
    \ MyClass\n// implementation continues\n```\n\nIn a more sophisticated implementation,\
    \ you can declare a variable to be static, provide class methods to manage it.\
    \ Declaring a static variable limits its scope to the class—and to just the part\
    \ of the class that's implemented in file. (Unlike instance variables, static\
    \ variables cannot be inherited, or directly manipulated by subclasses.) This\
    \ pattern is commonly used to define shared instances of a class (such as singletons);\
    \ \"Creating a Singleton Instance\" in Cocoa Fundamentals Guide.)\n\n```\nstatic\
    \ MyClass *MCLASSSharedInstance;\n```\n\n```\n@implementation MyClass\n\n+(MyClass\
    \ *)sharedInstance\n{\n    // check for existence of shared instance\n    // create\
    \ if necessary\n    return MCLASSSharedInstance;\n}\n// implementation continues\n\
    ```\n\nStatic variables give the class object more functionality than just of\
    \ a factory producing instances; it can approach being a complete and versatile\
    \ object in its own. A right class can be used to coordinate the instances it\
    \ creates, dispense instances from lists of objects already created, or manage\
    \ others essential to the application. In the case you need only one object of\
    \ a particular class, you can put the object's state into static variables and\
    \ use only class methods. This saves the step of allocating and initializing an\
    \ instance.\n\n> Note: It is also possible to use external variables that are\
    \ not declared static, but the limited scope of static variables serves the purpose\
    \ of encapsulating data into separate objects.\n\n# Initializing a Class Object\n\
    \nIf you want to use a class object for anything besides allocating instances,\
    \ you may need to initialize it as you would instance. Although programs do not\
    \ allocate objects, Objective-C provides a way for programs to initialize them.\n\
    \nIf a class makes use of static or global variables, the initialize method is\
    \ a good place to set their initial values. For example, if a class maintains\
    \ an array of instances, the initialize method could set up the array and even\
    \ one or two defaults instances to have ready.\n\nThe runtime system sends an\
    \ initialize message to class object before it receives any other messages and\
    \ after its superclass has received the initialize message. This sequence gives\
    \ the class to set up its runtime environment before it's used. If initialization\
    \ is not needed, you don't need to write an initialize method to respond to the\
    \ message.\n\nBecause of inheritance, an initialize message sent to a class that\
    \ doesn't implement it is forwarded to the superclass, even though the superclass\
    \ has already received the initialize message. For example, assume class A implements\
    \ the initialize method, and class B inherits from class A but does not implement\
    \ the initialize method. Just before class B is to receive its first message,\
    \ the runtime system sends initialize to it. But, because class B doesn't implement\
    \ initialize, class A is executed instead. Therefore, class A should ensure that\
    \ its initialization logic is performed only once, and for the appropriate class.\n\
    \n# CHAPTER 1\n\nObjects, Classes, and Messaging\n\nTo avoid performing initialization\
    \ logic more than once, use the template in Listing 1-3 when implementing the\
    \ `initialize` method.\n\n# Listing 1-3 Implementation of the initialize method\n\
    \n```\n+ (void)initialize\n{\n  if (self == [ThisClass class]) {\n    // Perform\
    \ initialization here\n  }\n}\n```\n\n> Note: Remember that the runtime sends\
    \ `initialize` to each class individually. Therefore, in a class's implementation\
    \ of the `initialize` method, you must not send the `initialize` message to its\
    \ superclass.\n\n# Methods of the Root Class\n\nAll objects, classes and instances\
    \ alike, need an interface to the runtime system. Both class objects and instances\
    \ should be able to inspect their attributes and report their place in the inheritance\
    \ hierarchy. It is the province of the `NSObject` class to provide this interface.\n\
    \nSo that NSObject methods do not have to be implemented twice—once to provide\
    \ a runtime interface for instances and again to duplicate that for classes—objects\
    \ are given special dispensation to perform methods defined in the root class.\
    \ When a class receives a message that it cannot respond with, the runtime determines\
    \ there's a root instance method that it can respond. The only instance methods\
    \ that a class object can perform are defined in the root class, and if there's\
    \ no class method that can do the job.\n\nFor more on this peculiar of class objects\
    \ to perform root instance methods, see `NSObject` Class Reference.\n\n# Class\
    \ Names in Source Code\n\nIn source code, class names can be used in only two\
    \ different contexts. These contexts reflect the dual role of class as a data\
    \ type and as an object:\n\n- The class name can be used as a type name for a\
    \ kind of object. For example:\n\n```\nRectangle *anObject;\n```\nHere `anObject`\
    \ is statically tied to a pointer to a `Rectangle` object. The compiler expects\
    \ it to have the data structure of a `Rectangle` instance and to have the methods\
    \ defined and inherited by the `Rectangle` class. Static tying enables the compiler\
    \ to do better type checking and make source code self-documenting. See \"Enabling\
    \ Static Behavior\" (page 95) for details.\n\n- As the receiver in a message expression\n\
    \n```\nif ( [anObject isKindOfClassOfClass:[Rectangle class]] )\n```\n\nIt would\
    \ have been illegal to simply use the name \"Rectangle\" as the parameter. The\
    \ class name can only be a receiver.\n\nIf you don't know the class at compile\
    \ time but have it as a string at runtime, you can use NSStringFromString to return\
    \ the class object:\n\n```\nNSString *className = ...;\n```\n\n```\nif ( [anObject\
    \ isKindOfClassClass:NSStringFromString(className)] )\n```\nThis function returns\
    \ nil if the string's not a valid class name.\n\nClasses exist in the same namespace\
    \ as global variables and function names. A class and a global variable can have\
    \ the same name. Class names are the only names with global visibility in Objective-C.\n\
    \n# Testing Class Equality\n\nYou can test two class objects for equality using\
    \ a direct pointer comparison. It is important, to get the correct class. There\
    \ are several features in the Cocoa frameworks that dynamically and transparently\
    \ subclass existing classes to extend their functionality (for example, key-value\
    \ observing and Core Data do this—see Key-Value Programming Guide and Core Data\
    \ Programming Guide respectively). In a dynamically-created subclass, the class\
    \ method is typically overridden so that the subclass masquerades as the class\
    \ it replaces. When testing for class equality, you should compare the values\
    \ returned by the method rather than those returned by lower-level functions.\
    \ In terms of API, the following inequalities permit for dynamic subclasses:\n\
    \n```\n[object class] != object_getClass(object) != *((Class*)object)\n```\n\n\
    You should therefore test two classes for equality as:\n\n```\nif ([objectA class]\
    \ == [objectB class]) { //...\n```\n\n# Defining a Class\n\nMuch of object-oriented\
    \ programming consists of writing the code for new objects—defining new classes.\
    \ In Objective-C, classes are defined in two parts:\n\n- An interface that declares\
    \ the methods and instance variables and names its superclass\n- An implementation\
    \ that actually defines the class (contains the code that implements methods)\n\
    \nEach of these parts is typically in one file. Sometimes, however, a class definition\
    \ spans files through the use of a feature called a category. Categories can compartmentalize\
    \ a class definition or extend an existing one. Categories are described in \"\
    Categories and Extensions\" (page 81).\n\n# Source Files\n\nAlthough the compiler\
    \ doesn't require it, class interface and implementation are usually in two different\
    \ files. The interface file must be made available to anyone who uses the class.\n\
    \nA single file can declare or implement more than one class. Nevertheless, it's\
    \ customary to have a separate interface file for each class, if not a separate\
    \ implementation file. Keeping class interfaces better reflects their status as\
    \ independent entities.\n\nInterface and implementation files are typically named\
    \ after the class. The name of the implementation file has the .m extension, indicating\
    \ that it contains Objective-C source code. The interface file can be assigned\
    \ any extension. Because it is included in other source files, the name of the\
    \ interface file usually has the .h extension of header files. For example, the\
    \ Rectangle class would be declared in Rectangle.h and defined in Rectangle.m.\n\
    \nSeparating an object from its implementation fits well with the design of object-oriented\
    \ programs. object is a self-contained entity that can be viewed from the outside\
    \ as a black box. Once you've determined how an object interacts with other elements\
    \ in your program—that is, once you've declared the interface—you can freely alter\
    \ its implementation without affecting any other part of your application.\n\n\
    # Class Interface\n\nThe declaration of a class interface begins with the compiler\
    \ directive @interface and ends with the @end. (All Objective-C directives begin\
    \ with \"@\")\n\n```\n@interface ClassName : ItsSuperclass\n instance variable\
    \ declarations\n}\nmethod declarations\n```\n"
  mdcn: "\n\n# 第一章\n\n# 对象、类与消息\n\n```objectivec\n@implementation MyClass\n// 实现继续\n\
    ```\n\n在更复杂的实现中，你可以声明一个变量为静态的（static）的，并提供类方法来管理它。声明静态变量会将其作用域限制在类内部——并且仅限于该类在文件中实现的部分。（与实例变量不同，静态变量无法被继承，也无法被子类直接操作。）这种模式通常用于定义类的共享实例（例如单例）；请参阅《Cocoa基础指南》中的“创建单例实例”。\n\
    \n```objectivec\nstatic MyClass *MCLASSSharedInstance;\n```\n\n```objectivec\n\
    @implementation MyClass\n\n+(MyClass *)sharedInstance\n{\n    // 检查共享实例是否存在\n\
    \    // 如果必要则创建\n    return MCLASSSharedInstance;\n}\n// 实现继续\n```\n\n静态变量为类对象提供了比仅仅作为产生实例的工厂更丰富的功能；它可以趋成为一个功能完全且多用途的对象。一个合适的类可以用于协调它创建的实例，从已创建的对象列表中分发实例，或者管理应用程序的其他其他部分。当你只需要某个特定类的一个对象时，你可以将对象的状态放入静态变量中并仅使用类方法。这节省了分配和初始化实例的步骤。\n\
    \n> 注意：也可以使用未声明为静态的外部变量，但静态变量有限的作用域实现了将数据封装到独立对象中的目的。\n\n# 初始化类对象\n\n如果你想将类对象用于分配实例之外的任何用途，你可能需要像初始化实例一样对其进行初始化。虽然程序不分配对象，但\
    \ Objective-C 提供了一种程序初始化它们的方法。\n\n如果一个类使用了静态或全局变量，`initialize` 方法是设置它们初始值的好地方。例如，如果一个类维护一个实例数组，`initialize`\
    \ 方法可以设置该数组，甚至准备好一两个默认实例。\n\n运行时系统在接收任何其他消息之前、在其父类接收到 `initialize` 消息之后，向类对象发送\
    \ `initialize` 消息。这个序列使得类可以在被使用之前设置好它的运行时环境。如果不需要初始化，你就不需要写 `initialize` 方法来响应该消息。\n\
    \n由于继承机制，发送给没有实现该方法的 `initialize` 消息会被转发给父类，即使父类已经收到了 `initialize` 消息。例如，假设类 A\
    \ 实现了 `initialize` 方法，而类 B 继承自类 A 但没有实现 `initialize` 方法。在类 B 接收第一条消息之前，运行时系统向它发送\
    \ `initialize`。但由于类 B 没有实现 `initialize`，因此执行的是类 A。因此，类 A 应该确保其初始化逻辑只执行一次，并且针对正确的类。\n\
    \n# 第一章\n\n对象、类与消息\n\n为了避免多次执行初始化逻辑，在实现 `initialize` 方法时，请使用列表 1-3 中的模板。\n\n#\
    \ 列表 1-3：initialize 方法的实现\n\n```objectivec\n+ (void)initialize\n{\n  if (self\
    \ == [ThisClass class]) {\n    // 在此处执行初始化\n  }\n}\n```\n\n> 注意：记住，运行时会单独向每个类发送\
    \ `initialize`。因此，在类 `initialize` 方法的实现中，你不能向其父类发送 `initialize` 消息。\n\n# 根类的方法\n\
    \n所有对象、类和实例都需要一个与运行时系统的接口。类对象和实例都应该能够检查它们的属性并报告它们在继承层次结构中的位置。提供这一接口是 `NSObject`\
    \ 类的职责。\n\n为了让 `NSObject` 方法不需要实现两次（一次为实例提供运行时接口，再次为类重复该操作），对象被赋予了特殊许可来执行在根类中定义的方法。当一个类接收到它无法响应的消息时，运行时会确定是否存在它可以响应的根实例方法。类对象可以执行的唯一实例方法是定义在根类中的，并且当没有类方法可以完成工作时。\n\
    \n更多关于类对象执行根实例方法这一奇特现象的细节，请参阅 `NSObject` 类参考。\n\n# 源代码中的类名\n\n在源代码中，类名只能用于两种不同的语境。这些语境反映了类作为数据类型和作为对象的双重角色：\n\
    \n- 类名可以用作某种对象的类型名。例如：\n\n```objectivec\nRectangle *anObject;\n```\n在这里，`anObject`\
    \ 被静态绑定到指向 `Rectangle` 对象的指针。编译器期望它具有 `Rectangle` 实例的数据结构，并拥有由 `Rectangle` 类定义和继承的方法。静态绑定允许编译器进行更好的类型检查，并使源代码具有自文档性。详细信息请参见“启用静态行为”（第\
    \ 95 页）。\n\n- 作为消息表达式中的接收者\n\n```objectivec\nif ( [anObject isKindOfClassOfClass:[Rectangle\
    \ class]] )\n```\n\n仅仅使用 \"Rectangle\" 名称作为参数将是非法的。类名只能作为接收者。\n\n如果你在编译时不知道该类，但在运行时拥有其字符串形式的类，你可以使用\
    \ `NSStringFromString` 返回类对象：\n\n```objectivec\nNSString *className = ...;\n```\n\
    \n```objectivec\nif ( [anObject isKindOfClassClass:NSStringFromString(className)]\
    \ )\n```\n如果字符串不是有效的类名，该函数返回 nil。\n\n类与全局变量和函数名处于相同的命名空间中。类和全局变量可以有相同的名称。类名是 Objective-C\
    \ 中唯一具有全局可见性的名称。\n\n# 测试类的等效性\n\n你可以使用直接指针比较来测试两个类对象的相等性。获取正确的类很重要。Cocoa 框架中有几个功能可以动态且透明地扩展类以增强其功能（例如，键值观察和\
    \ Core Data 分别参见《键值编程指南》和《编程指南）。在动态创建的子类中，类方法通常会被重写，以便伪装成它所替换的类。测试类的相等性时，你应该比较由方法返回的值，而不是低级函数返回的值。\n\
    \n```\n[object class] != object_getClass(object) != *((Class*)object\n```\n\n\
    因此，你应该这样测试两个类是否相等：\n\n```objectivec\nif ([objectA class] == [objectB class])\n\
    \n# 定义类\n\n面向对象编程的大部分是编写新对象的代码——定义新类。在 Objective-C 中，类的定义分为两个部分：\n\n- 接口：声明方法和实例变量并命名其父类\n\
    - 实现：实际定义类（包含方法的代码）\n\n这些部分部分通常在一个文件中。然而，有时类定义通过使用名为“分类”（Category）的特性跨文件存在。分类可以对类定义进行模块化或扩展现有类。参见“分类与扩展”（第\
    \ 81 页）。\n\n# 源文件\n\n尽管编译器并不要求，但类的接口和实现通常位于两个不同的文件中。接口文件必须对任何使用该类的人可用。\n\n一个文件可以声明或实现多个类。尽管如此，习惯上为每个类准备一个单独的接口文件，至少是实现文件。保持类接口分离反映反映它们作为独立实体的状态。\n\
    \n接口文件和实现文件通常根据类命名。实现文件的扩展名为 `.m`，表示它包含 Objective-C 源代码。接口文件可以分配任何扩展名。因为它包含在其他源文件中，所以接口文件名通常具有头文件的\
    \ `.h`。例如，Rectangle 类会在 Rectangle.h 中声明，在 Rectangle.m 中定义。\n\n将对象与其实现分离符合面向对象程序的设计。对象是一个自包含的实体，从外部看可以是一个黑盒。一旦你确定了对象与程序与其他元素的交互方式——一旦你声明了接口——你就可以自由地更改实现而不影响应用程序的任何部分。\n\
    \n# 类接口\n\n类接口的声明以编译器指令 @interface 开始，以 @end 结束。（所有 Objective-C 指令都以 @ 开头）\n\n\
    ```objectivec\n@interface ClassName : ItsSuperclass\n 实例变量声明\n}\n方法声明\n```\n\n"
