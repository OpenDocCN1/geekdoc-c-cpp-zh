    \ Objective-C 中，自定义初始化器受到的约束和约定比大多数其他方法都要多。\n\n## 约束与约定\n\n有若干适用于初始化方法的约束和约定，但这些并不适用于其他方法：\n\
    \n- * 按照约定，自定义初始化方法的名称以 `init` 开头。\n\n## 分配和初始化对象\n\nFoundation 框架的示例包括 `initWith`；`initWithObjects`\
    \ 以及 `initWithObjectsKeys`。\n\n- * 初始化方法的返回类型应该是 `id`。\n\n返回类型应该是 `id`，因为 `id`\
    \ 表示有意地不考虑具体的类——该类是未指定的，并根据调用上下文而改变。例如，`NSString` 提供了 `initWithFormat:` 方法，当你向\
    \ `NSMutableString` 实例（NSString 的子类）发送该消息时，该消息返回一个 `NSMutableString` 实例。（另见“结合分配与初始化”（第57页）中的单例示例）。\n\
    \n- * 在自定义初始化器的实现中，你必须调用一个指定初始化器。\n\n指定初始化器在“指定初始化器”（第55页）中有所描述；其完整解释在“协调类”（第53页）中。\n\
    \n简而言之，如果你正在实现一个指定初始化器，它必须调用其父类的指定初始化器。如果你正在实现任何其他初始化器，它应该调用其所属类的指定初始化器，或者调用它的另一个最终调用指定初始化器的初始化器。\n\
    \n默认情况下，指定初始化器是 `init`。\n\n- * 你应该将 `self` 赋值给初始化器的返回值，因为初始化器返回的对象可能与接收者返回的对象不同。\n\
    \n- * 如果你设置了实例变量的值，你通常使用直接赋值而不是使用访问器方法。\n\n直接赋值避免了触发访问器中意外副作用的可能性。\n\n- * 在初始化器的末尾处，你必须返回\
    \ `self`，除非初始化器失败，在这种情况下你返回 `nil`。\n\n失败的初始化器在“处理初始化失败”（第52页）中进行了更详细的讨论。\n\n下面的示例说明了继承自\
    \ `NSObject` 的自定义初始化器的实现，它有一个实例变量 `creationDate`，代表对象被创建的时间：\n\n```\n(init {\n\
    \    // 将 self 赋值给父类指定初始化器的返回值\n    // NSObject 的指定初始化器是 init\n    self = [super\
    \ init];\n    if (self) {\n        creationDate = [[NSDate alloc] init];\n   \
    \ }\n    return self;\n})\n```\n\n（使用 `(self)` 模式的原因在“处理初始化失败”（第52页）中进行了讨论。\n\n\
    ## 第3章\n## 分配和初始化对象\n\n初始化器不需要为每个变量提供参数。例如，如果一个类要求实例具有一个名称和一个数据源，它可能会提供一个 `initWith:fromURL:`\
    \ 方法，但将非本质的实例变量设置为任意值，或者允许它们具有默认设置的空值。它可以依赖于 `setEnabled:`、`setFriend:` 和 `setDimensions:`\
    \ 等方法在初始化阶段完成后修改默认值。\n\n下一个示例说明了带有单个参数的自定义初始化器的实现。在这种情况下，它继承自 `UIView`。它展示了在调用父类指定初始化器之前你可以做些什么。\n\
    \n```\n(id)initWith:(NSImage *)image {\n// 从图像中查找新实例的大小\nNSSize size = image.size;\n\
    CGRect frame = NSMakeRect(0.0, 0.0, size.width, size.height);\n\n// 调用父类指定初始化器的返回赋值\n\
    self = [super initWithFrame:frame];\nif (self) {\n    image = [image retain];\n\
    }\nreturn self;\n}\n```\n\n此示例没有说明在初始化过程中出现问题时该做什么；此类问题将在下一节讨论。\n\n## 处理初始化失败\n\
    \n通常情况下，如果初始化过程中出现问题，你应该调用 `release` 方法并返回 `nil`。\n\n这种策略有两个后果：\n\n- 任何（无论是你的类、子类还是外部调用者）从初始化器接收到\
    \ `nil` 应该处理它。\n- 你必须确保在部分初始化对象的情况下 `dealloc` 方法是安全的。\n\n> 如果你在调用父类初始化器时得到 `nil`\
    \ 返回，你不应该再次调用 `release` 方法。你应该清理你已使用的任何引用，如如下示例所示：\n\n```\n(id)init {\n    self\
    \ = [super init];\n    if (self) {\n        creationDate = [[NSDate alloc] init];\n\
    \    }\n    return self;\n}\n```\n\n"
