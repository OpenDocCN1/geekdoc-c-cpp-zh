    # Enabling Static Behavior


    This chapter explains how static typing works and discusses some other features
    of Objective-C, including ways to temporarily overcome its inherent dynamism.


    # Default Dynamic Behavior


    By design, Objective-C objects are dynamic entities. As many decisions about them
    as possible are pushed from compile time to runtime:


    +   - The memory for objects is **dynamically allocated** at runtime by class
    methods that create new instances.

    - Objects are **dynamically typed**. In source code (compile time), any object
    variable can be of type id no matter what the object''s class is. The exact class
    of an id variable (and therefore its methods and data structure) is not determined
    until the program runs.

    - Messages and methods are **dynamically bound**, as described in "Dynamic Binding"
    (page 19). A runtime procedure matches the selector in the message to a implementation
    that "belongs" to the receiver.


    These features object-oriented programs grant a great deal of flexibility and
    power, but there''s a price to pay. In particular, the compiler can''t check the
    types (classes) of id variables. To permit better compile-time checking, and to
    make code more self-documenting, Objective-C allows objects to be statically typed
    with a class name rather than generically typed as id. Objective-C lets you turn
    off some of object-oriented features in order to shift operations from runtime
    to compile time.


    > Note: Messages are somewhat slower than function calls, typically incurring
    an insignificant amount of overhead compared to actual work performed. The exceptionally
    rare case where bypassing the dynamism of Objective-C is warranted can be proven
    by use of analysis tools like Shark or Instruments.


    # Static Typing


    If a pointer to a class name is used in place of id in an object declaration such
    as

    Rectangle *thisObject:


    the compiler restricts the value of the declared variable to be either an instance
    of a class named in the declaration or an instance of a class that inherits from
    the named class. In the example above, thisObject can only be a Rectangle object
    of some kind.'
