    # Glossary


    **abstract class** A class that''s defined solely so that other classes can inherit
    from it. Programs don''t use instances of an abstract class; they use only instances
    of its subclasses.


    **abstract superclass** Same as abstract class.


    **class method** In the Objective-C language, a method that can operate on class
    objects rather than instances of classes.


    **adopt** object of unknown class, a class is said to adopt a protocol if it declares
    it implements all the methods in the protocol. Protocols are adopted by listing
    their names between brackets in a class or category declaration.


    **class object** In the Objective-C language, an object that represents a class
    and knows how to create instances of it. Class objects are created by the compiler,
    but otherwise behave like instance variables, and can be like all other objects.
    As the receiver in a message expression, a class object is represented by the
    class name.


    **anonymous object** An object of unknown class. The interface to it is through
    protocol declaration.


    **Cocoa** An object-oriented development platform for Mac OS. Cocoa is a set of
    frameworks whose primary programming interfaces are in Objective-C.


    **AppKit** Sometimes called *Application Kit* framework that implements an user''s
    interface. AppKit provides a basic program structure for applications that draw
    on the screen and respond to events.


    **compile time** The time when code is compiled. Decisions made at compile time
    are constrained by the amount and information contained in source files.


    **asynchronous message** A message that returns immediately, without waiting for
    the message to respond. The sending application and the receiving application
    act independently, and are not in sync.


    **conform** In the Objective-C language, a class is said to conform to a protocol
    if it (or a subclass) implements the methods declared in the protocol. An instance
    conforms to a protocol if its class does. Thus, an instance that conforms to a
    protocol may perform any of the instance methods declared in the protocol.


    **category** In the Objective-C language, a set of method definitions that is
    segregated from the rest of the class definition. Categories can be used to split
    a class into parts or to add methods to an existing class.


    **delegate** An object that acts on behalf of another object.


    **class** In the Objective-C language, a prototype for a particular kind of object.
    A class definition declares instance variables and defines methods for all members
    of the class.


    **designated initializer** *init...* method that has responsibility for initializing
    new instances of a class. Each class defines or inherits its designated initializer.
    Through messages to *self*, other *init...* methods in the same class directly
    or indirectly invoke the designated initializer; the designated initializer, a
    message to `super`, invokes the designated initializer of its superclass.


    **id** In the Objective-C language, the general type for any kind of object regardless
    of class. `id` is defined as a pointer to an object data structure. It can be
    used for both class and instances of a class.


    **dispatch table** The Objective-C runtime table contains entries that associate
    selectors with the class-specific addresses of the methods they identify.


    **implementation** The part of an Objective-C specification that defines public
    methods (declared in the class interface) as well as private methods (not declared
    in the class''s interface).


    **distributed objects** An architecture that facilitates communication between
    objects in different address spaces.


    **informal protocol** In Objective-C language, a protocol declared as a category,
    is a category of the NSObject class. The language gives explicit support to protocols,
    but not to informal ones.


    **dynamic allocation** A technique used in C-based languages where the operating
    system provides memory to a running application as it needs, instead of it launches.


    **Inheritance** In object-oriented programming, the ability of a subclass to inherit
    its characteristics (methods and instance variables) onto its subclasses.


    **inheritance hierarchy** In object-oriented programming, the hierarchy of classes
    that is defined by the arrangement of subclasses and classes. Every class (except
    root classes as NSObject) has a superclass, and may have unlimited number of subclasses.
    Through its subclass, class inherits from above it in the hierarchy.


    **dynamic binding** Binding to a message—that is, finding the method implementation
    to invoke in response to the message—at runtime, rather than at compile time.


    **dynamic typing** Discovering the class of an object at runtime rather than at
    compile time.


    **instance** In the Objective-C language, an object that belongs to (is a member
    of) a particular class. Instances are created at runtime using the specification
    in the class definition.


    **encapsulation** A programming technique that hides the implementation of an
    operation from its users by an abstract interface. It allows the implementation
    to be updated or changed without impacting the users of the object.


    **instance method** In the Objective-C language, any method that can be called
    by an instance of a class rather than the class itself.


    **event** The direct or indirect report of external activity, especially user
    activity on the keyboard and mouse.


    **instance variable** In the Objective-C language, any variable that part of the
    internal data structure of an instance. Instance variables are declared in a class
    definition and become part of all objects that inherit from the class.


    **factory** Same as a class object.


    **factory object** Same as class object.


    **interface** The part of an Objective-C specification that declares its public
    interface, which includes its supername, instance variables, and public-method
    protocols.


    **formal protocol** In the Objective-C language, a protocol that''s declared with
    `@protocol` directive. Classes can adopt formal protocols, objects can respond
    when asked to a formal protocol, and instances can be typed by the protocols they
    conform to.


    **Interface Builder** A tool that lets you graphically specify your application''s
    interface. It sets up the corresponding objects for you and makes it easy for
    you to establish connections between these objects and your own code where needed.


    **framework** A way to package a related set of classes, protocols, and functions
    together with localized strings, online documentation, and other pertinent files.
    Cocoa provides the Foundation framework and the App framework, among others.


    **link** time when code is compiled and linked into a single program. Decisions
    made at link time are constrained by the amount and information contained in source
    files.


    **message** In object-oriented programming, the selector (name) and parameters
    that tell the receiving object what to do.


    **message expression** In object-oriented programming, an expression that sends
    a message. In Objective-C, messages are enclosed within square brackets and consist
    of a receiver and selector.


    **method** In object-oriented programming, a procedure that can be executed.


    **mutex** short for *mutual exclusion* semaphore. An object used to synchronize
    thread execution.


    **namespace** A logical subdivision of a program which names belong to. Symbols
    in one namespace do not conflict with identically named symbols in another. For
    example, in Objective-C, the methods of a class are in a unique namespace. Similarly,
    the instance variables of a class are in their own namespace.


    **nil** in the Objective-C language, an object *id* with a value of 0.


    **object** a programming unit that groups a data structure (instance variables)
    and the operations (methods) that can use them. Objects are the principal building
    blocks of object-oriented programming.


    **outlet** An instance variable that points to another object. Instance variables
    are a way for an object to keep track of the objects to which it may send messages.


    **polymorphism** In object-oriented programming, the ability of different objects
    to respond, each in its own way, to the same message.


    **procedural programming language** A language, such as C, that organizes a program
    as a set of procedures that have definite boundaries and ends.


    **protocol** in the Objective-C language, the declaration of a group of methods
    not associated with any class. Each can also conform *formal protocol*, *informal
    protocol*.


    **receiver** In object-oriented programming, the object that is sent a message.


    **reference counting** A memory-management technique in which each entity claims
    ownership of an object increments its reference count and decrements it. When
    the object''s count reaches zero, it is deallocated. This technique allows one
    instance of an object to be safely shared among other objects.


    **remote message** A message sent from one application to an object in another
    application.


    **remote object** An object in another application, that''s a potential receiver
    for a remote message.


    **runtime** The time after a program is launched and while it''s running. Decisions
    made at runtime can be influenced by the choices made.


    **selector** in the Objective-C language, the name of a method when it''s used
    in a source-code message to an object, or the identifier that replaces the name
    when the source code is compiled. *SEL*.


    **static** in the Objective-C language, giving the compiler information about
    what kind of object instance is, by typing it as a pointer to class.


    **subclass** in the Objective-C language, any class that''s one step above another
    in the inheritance hierarchy. Occasionally used generally to mean any class that
    inherits from another class. Also used as a verb to mean the process of defining
    a subclass of another class.


    **superclass** in the Objective-C language, a class that''s one step above another
    in the inheritance hierarchy; the class through which a subclass inherits methods
    and instance variables.

    '
