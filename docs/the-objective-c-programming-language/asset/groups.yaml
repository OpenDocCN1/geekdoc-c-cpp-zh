  - "[PAGE 39]\n\n# CHAPTER 2\n\n# Defining a Class\n\nWhen the instance variable\
    \ belongs to an object that's not receiver, the object's type must be made explicit\
    \ to the compiler through static typing. In referring to the instance variable\
    \ of a statically typed object, the pointer operator (->) is used.\n\nSuppose,\
    \ for example, that the Sibling class declares a statically typed object, twin,\
    \ as an instance variable:\n\n```\n@Interface Sibling : NSObject\n{\n Sibling\
    \ *twin;\n int gender;\n struct features *appearance;\n}\n```\n\nAs long as the\
    \ instance variables of the statically typed object are within the scope of the\
    \ class (as they are here when twin is typed to the same class), a Sibling method\
    \ can set them directly:\n\n```\n- makidenticalTwin\n{\n if (Itwin ()) {\n twin\
    \ = [[Sibling alloc] init];\n twin->gender = gender;\n twin->appearance = appearance;\n\
    \ return twin;\n}\n```\n\n# The Scope of Instance Variables\n\nAlthough they're\
    \ declared in the class interface, instance variables are more a matter of the\
    \ way a class is implemented than of the way it's used. An object's interface\
    \ lies in its methods, not in its internal data structures.\n\nOften there is\
    \ a one-to-one correspondence between a method and an instance variable, as in\
    \ the following example:\n\n+   - (BOOL)isFilled\n{\n return filled;\n}\n\nBut\
    \ this is not the case. Some methods might return information not stored in instance\
    \ variables, and some instance variables might store information that an object\
    \ is unwilling to reveal.\n\nAs a result from time to time, the choice of instance\
    \ variables may change, even though the method retains its name. As long as the\
    \ vehicle for interacting with instances of the class, these changes won't affect\
    \ its interface.\n\nTo enforce the ability of an object to hide its data, the\
    \ compiler limits the scope of instance variables—that is, its visibility within\
    \ the program. But to provide flexibility, it also explicitly sets the scope at\
    \ four levels. Each level is marked by a compiler directive:\n\n| Directive |\
    \ Meaning |\n| --- | --- |\n| @private | The instance variable is accessible only\
    \ within the class that declares it. |"
  - "[PAGE 40]\n\n# Defining a Class\n\n| Directive | Meaning |\n| --- | --- |\n|\
    \ @protected | The instance variable is accessible within the class that declares\
    \ it and within classes that inherit it. All instance variables without an explicit\
    \ scope directive have @protected scope. |\n| @public | The instance variable\
    \ is accessible everywhere.\n| @package | Using the modern runtime, an @package\
    \ instance variable has @public scope inside the executable image that implements\
    \ the class, but acts like @private outside. The @package scope for Objective-C\
    \ instance variables is analogous to private_extern for C variables and functions.\
    \ Any code outside the class implementation's image that tries to use the variable\
    \ gets a link error. This scope is most useful for instance variables in framework\
    \ classes, where @private may be too restrictive but @protected or @public too\
    \ permissive. |\n\nFigure 2-1 illustrates the levels of scoping.\n\n# Figure 2-1\
    \ The scope of instance variables (@package scope not shown)\n\n![](img/6f9b7a92b4fae621991881021b9bf44a_40_0.png)\n\
    \nA scoping directive applies to all the instance variables listed after it, up\
    \ to the next directive or the end of the list. In the following example, the\
    \ age and evaluation instance variables are private; name, Job, and wage are protected;\
    \ boss is public.\n\n```\n@interface Worker : NSObject\n  char *name;\n  @private\n\
    \  int age;\n  char *evaluation;\n  @protected\n```\n\n# Class Implementation"
  - '[PAGE 41]


    # CHAPTER 2

    Defining a Class


    ```

    id job:

    float wage:

    @public

    id boss:

    }

    ```


    By default, all unmarked instance variables (like name) are @protected.


    All instance variables that a class declares, no matter how they''re marked, are
    within the scope of the class definition. For example, a class declares a job
    instance variable, such as the Worker class shown above, can refer to it in a
    method definition:


    ```

    promoteTo:newPosition

    {

    id old = job;

    job = newPosition;

    return old;

    }

    ```


    Obviously, if a class can''t access its own instance variables, the instance variables
    would be of no use whatsoever.


    Normally, a class also has access to the instance variables it inherits. The ability
    to refer to an instance variable is usually inherited with the variable. It makes
    sense for classes that have their entire data structures within their scope, if
    you think of a class definition as merely an elaboration of the class it inherits
    from. The promoteTo: method illustrated earlier could just as well defined in
    any class that inherits the job variable from the Worker class.


    However, there are reasons why you might want to restrict inheriting classes from
    directly accessing an instance variable:


    +   - Once a subclasses accesses an inherited variable, the class that declares
    the variable is tied to that part of its implementation. In later versions, it
    can''t eliminate the variable or alter the role it plays without inadvertently
    breaking the subclass.

    - Moreover, if a subclass accesses an inherited instance variable and alters its
    value, it may inadvertently introduce bugs in the class that declares the variable,
    especially if the variable is involved in class-internal details.


    To limit an instance variable''s scope to just the class that declares it, you
    must mark @private. Instance variables marked @private are only available to subclasses
    by calling public accessor methods, if they exist.


    At the other extreme, making a variable @public makes it generally available,
    even outside of classes that inherit or declare the variable. Normally, to get
    information stored in an instance variable, other objects must send a message
    requesting it. A public instance variable can be accessed anywhere as if it were
    a field in a C structure.


    ```

    Worker *ceo = [[Worker alloc] init];

    ceo->boss = nil;

    ```


    Note that the object must be statically typed.


    Marking variables @public defeats the ability of an object to hide its data. Runs
    counter to a fundamental principle of object-oriented programming—the encapsulation
    of data within objects where it is protected from view and unintended error. Public
    instance variables should therefore be avoided in extraordinary cases.


    42 Class Implementation

