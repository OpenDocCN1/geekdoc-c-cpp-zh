    +   The following code generates a compiler warning because the readonlyProperty
    property is declared with readonly access (warning: assignment to readonly property
    ''readonlyProperty'').


    ```

    /* Property declaration. */

    @property(readonly) NSInteger readonlyProperty;


    /* Method declaration. */

    (void) setReadOnlyProperty:(NSInteger)newValue;


    /* Code fragment. */

    self.readonlyProperty = 5;

    ```


    Even so, because the setter method is present, this code works at runtime. This
    is strongly discouraged because adding a setter for a property does not imply
    readonly access. Be sure to explicitly set property access correctly in a property
    declaration statement.


    # Classes


    An object-oriented program is typically built from a variety of objects. A program
    based on the Cocoa frameworks might use NSMatrix objects, NSWindow objects, NSDictionary
    objects, NSFont objects, NSText objects, and many others. Programs use more than
    one object of the same kind or class—several NSArray or NSWindow objects, for
    example.


    In Objective-C, you define objects by defining their class. The class is a prototype
    for a kind of object; it declares the variables that become property of every
    member of the class, and defines a set of methods that all objects in the class
    can use.


    The compiler creates one accessible object for each class, a class knows how to
    build new objects belonging to the class.(For this reason it''s traditionally
    called a factory object.) The class object is the compiled version of the class;
    it builds instances of the class. The objects that are the main work of your program
    are instances created by the class at runtime.


    All instances of a class have the same set of methods, and they all have a set
    of instance variables cut from the same mold. Each object gets its own instance
    variables, but the methods are shared.


    By convention, names begin with an uppercase letter (such as Rectangle); the names
    of instances typically begin with a lowercase letter (such as myRectangle).


    # Inheritance


    Class definitions are additive; each new class that you define is based on another
    class from which it inherits methods and instance variables. The new class adds
    to or modifies what it inherits. It doesn''t need to duplicate inherited code.


    Inheritance links all classes together in a hierarchical tree with one class at
    the root. When writing code is based upon the Foundation framework, root class
    is typically NSObject. Every class (except the root class) is a superclass one
    step near the root, and any class (including a root class) can be the superclass
    for any number of subclasses one step further from the root. Figure 1-1 illustrates
    the hierarchy for a few of the classes used in a drawing program.'
