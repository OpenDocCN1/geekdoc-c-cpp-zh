    \ makeLastingPeace is defined. Neither implementation finds the Mid version of\
    \ negotiate.\n\nAs this illustrates, super provides a way to bypass a method that\
    \ overrides another method. Here, the use of super enabled makeLastingPeace to\
    \ bypass the Mid version of negotiate that redefined the High version of that\
    \ method.\n\nNot being able to reach the Mid version of negotiate, as just described,\
    \ may seem like a flaw, but under the circumstances it intentional:\n\n+   - The\
    \ author of the Low class intentionally overrides the Mid version of negotiate\
