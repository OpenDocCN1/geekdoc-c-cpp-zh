    \nObjective-C 的声明属性特性提供了一种简单的方法，用于声明和实现对象的访问器方法。\n\n# 概览 (Overview)\n\n该语言特性包含两个方面：你用于指定并可选地合成声明属性的语法元素，以及在“点点语法”（第\
    \ 19 页）中描述的相关的语法元素。\n\n你通常通过一对访问器方法（getter/setter 方法）来访问对象的属性（即其属性和关系）。通过使用访问器方法，你遵循了封装原则（在\
    \ *Object-Oriented Programming with Objective-C* 一书中被称为“*抽象的的机制*”）。你可以对 getter/setter\
    \ 对以及底层状态管理进行严密控制，而 API 的调用者可以不受实现细节更改的影响。\n\n尽管使用访问器方法具有显著优势，但编写访问器方法仍然是一个枯燥的过程——当你必须编写代码来支持垃圾回收和引用计数元素时尤其如此。此外，属性的一些对\
    \ API 消费者可能重要的方面被隐藏了——例如访问器方法是否是线程安全的，或者在设置时是否拷贝了新值。\n\n声明属性通过提供以下功能解决了标准访问器方法的问题：\n\
    \n- *属性声明为访问器方法的行为提供了清晰、显式的规范。*\n- 编译器可以根据你在声明中提供的规范为你合成访问器方法。这意味着你需要编写和维护的代码更少了。\n\
    - 属性在语法上表示为标识符并具有作用域，因此编译器可以检测到对未声明属性的使用。\n\n# 属性声明与实现 (Property Declaration and\
    \ Implementation)\n\n声明属性包含两个部分：它的声明和实现。\n\n# 第 5 章\n\n声明属性\n\n# 属性声明 (Property\
    \ Declaration)\n\n属性声明以 @property 关键字开始。@property 可以出现在 @Interface 块中类中方法声明列表的任何位置。@property\
    \ 也可以出现在协议或分类（category）的声明中。\n\n```objc\n@property(attributes) type name;\n```\n\
    \n@property 声明了一个指令。一组可选的可参数属性集提供了关于属性存储机制和行为的额外详细信息——可能值参见“属性声明属性”（第 70 页）。像任何其他\
    \ Objective-C 类型一样，每个属性都有类型规范和名称。\n\n列表 5-1 演示了一个简单属性的声明。\n\n# 列表 5-1 声明一个简单属性\n\
    \n```objc\n@interface MyClass : NSObject\n{\n    float value;\n}\n@property float\
    \ value;\n@end\n```\n\n你可以认为属性声明等同于声明两个访问器方法。因此\n\n`@property float value;`\n\n\
    等同于：\n\n- - (float)value;\n- (void)setValue:(float)newValue;\n\n属性声明提供了关于访问器方法实现的额外信息（如“属性声明属性”第\
    \ 70 页所示）。\n\n# 属性声明属性 (Property Declaration Attributes)\n\n你可以使用 @property([attribute,\
    \ attribute2, ...]) 的形式用属性修饰属性。方法和属性的作用域限于它们所属的接口声明。对于使用逗号分隔的变量名列表的属性声明，属性属性适用于所有命名的属性。\n\
    \n如果你使用 @synthesize 指令告诉编译器创建访问器方法：\n\n# 访问器方法名称 (Accessor Method Names)\n\ngetter-getterName\n\
    指定该属性的访问器名称。getter 必须返回与属性类型匹配的类型且不接受任何参数。\n\nsetter-setterName\n指定该属性的访问器名称。setter\
    \ 方法必须接受一个类型匹配的参数并返回 void。\n如果你指定属性为只读（readonly）且指定了带 - 开头的 setter，你将得到编译器警告。\n\
    \n它们都是可选的，并且可以与任何其他属性一起出现（对于 setter 来说，readonly 除外）。\n\n通常，你应该指定符合键值编码（参见《键值编码编程指南》[Key-Value\
    \ Coding Programming Guide]）的方法名——使用 getter 装饰器以遵循布尔值 `isProperty` 惯例的常见原因。\n\n\
    # 可写性 (Writability)\n\n这些属性指定属性是否有关联 setter。它们是互斥的。\n\nreadwrite\n表示该属性应被处理为读/写。该属性是默认值。\n\
    在 @implementation 块中需要一个 getter 和 setter 方法。如果你在实现块中使用 @synthesize 指令，则会合成 getter\
    \ 和 setter 方法。\n\nreadonly\n表示属性是只读的。\n如果你指定了 readonly，则 @implementation 块中只需要一个\
    \ getter 方法。如果你在实现块中使用 @synthesize 指令，则只会合成 getter 方法。\n此外，如果你尝试使用 Objective-C\
    \ 语法赋值，你将得到编译器错误。\n\n# Setter 语义 (Setter Semantics)\n\n这些属性指定 set 访问器的语义。它们是互斥的。\n\
    \nassign\n指定 setter 使用简单赋值。该属性是默认值。\n你通常将其用于标量类型，如 NSInteger 和 CGRect（或者在引用计数环境中，用于你不拥有的对象，如代理对象\
    \ delegates）。\n在垃圾回收环境中，retain 和 assign 实际上是相同的。\n\nretain\n指定在对象赋值时调用 retain。（默认是\
    \ assign）。\n向旧值发送 release 消息。\n在 Mac OS X v10.6 之前，这仅对对象类型有效——参见 Core Foundation（第\
    \ 77 页）。\n在 Mac OS X v10.6 及更高版本中，你可以使用 __attribute__ 关键字指定 Core Foundation 属性处理为\
    \ Objective-C 对象：\n@property(retain) __attribute((NSObject)) myDictionary;\n\n\
    # 第 5 章\n\n声明属性\n\ncopy\n指定赋值时应使用对象的拷贝。（默认是 assign）。\n向旧值发送 release 消息。\n拷贝是通过调用\
    \ copy 方法完成的。该属性仅对实现 NSCopying 的对象类型有效。更多讨论，请参见“Copy”（第 75 页）。\n具体取决于你是否使用垃圾回收：\n\
    \n- 如果你不使用垃圾回收，对于对象属性，你必须指定 assign、retain、copy 之一——否则你会收到警告。\n- 如果你使用垃圾回收，使用默认值（如果你不指定\
    \ assign、retain、copy 中的任何一个）将不会收到警告，除非属性类型是符合 NSCopying 的类。默认值是你想要的；然而，如果属性类型可以拷贝，为了保持封装，你通常会创建对象的私有拷贝。\n\
    \n要决定选择哪一个，你需要了解 Cocoa 内存管理策略（参见内存编程指南 Memory Programming Guide）。\n\n# 原子性 (Atomicity)\n\
    你可以使用此属性指定访问器方法是非原子的（没有表示原子的关键字）。\n\nnonatomic\n指定访问器是非原子的。默认情况下，访问器是原子的。\n属性默认是原子的，以便合成的访问器在多线程环境中提供稳健的访问——也就是说，\
    \ getter 或 setter 返回的值总是被检索或设置。更多细节，请参见“性能与线程”（第 79 页）。\n\n如果你 retain 或 copy 且没有指定\
    \ nonatomic，那么在引用计数环境中，对象属性的合成访问器将使用锁、释放并返回结果——实现将类似于：\n\n```\n[internal lock];\
    \ // 使用对象级锁\nid result = [[retain] autorelease];\n[internal unlock];\nreturn result;\n\
    ```\n\n如果你指定了 nonatomic，对象属性的合成访问器将直接返回值。\n\n# 标记与弃用 (Markup and Deprecation)\n\
    属性支持全范围的 C 风格装饰。属性可以被弃用并支持\n__attribute__\n\n```objc\n@property CGFloat x AVAILABLE_MAC_OS_X_VERSION_10_AND_LATER_BUT_DEPRECATED_IN_MAC_OS_X_VERSION_10_4;\n\
    @property CGFloat y __attribute__();\n```\n\n"
