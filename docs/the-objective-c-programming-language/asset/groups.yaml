    \ simple\n\nsuper is a flag for the compiler telling it where to begin searching\
    \ for the method to perform; it's used only as the receiver of a message. But\
    \ self is a variable name that can be used in any number of ways, even assigned\
    \ a new value.\n\nThere's a tendency to do just that in definitions of class methods.\
    \ Class methods are often concerned not with the object, but with instances of\
    \ class. For example, many class methods combine allocation and initialization\
    \ of an instance, often setting up instance variables at the same time. In such\
    \ a method, it might be tempting to send messages to the newly allocated instance\
    \ and call the instance self, as an instance method. But that would be an error.\
