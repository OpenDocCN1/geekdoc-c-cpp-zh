    # CHAPTER 1


    Objects, Classes, and Messaging


    A class name can appear in source code wherever a type specifier is permitted
    in C—for example, as an argument to the `sizeof` operator:


    ```

    int i = sizeof(Rectangle);

    ```


    ## Static Typing


    You can use a class name in place of `id` to designate an object''s type:


    Rectangle `myRectangle:`;


    Because of why declaring an object type gives the compiler information about the
    kind of object it is, it''s known as **static typing**. As `id` is actually a
    pointer, objects are statically typed as pointers to a class. Objects are always
    typed by pointer. Static typing makes the pointer more explicit; `id` hides it.


    Static typing permits the compiler to do some type checking—for example, if an
    object would receive a message that it appears not able to respond to—or loosen
    some restrictions that apply to generically typed `id`. In addition, it can make
    your intentions clearer to others who read your source code; however, it doesn''t
    prevent dynamic binding or alter the dynamic of a receiver''s class at runtime.


    An object can be statically typed to its own class or to any class it inherits
    from. For example, because inheritance means a `Rectangle` object is a `Graphic`
    object (as shown in the class hierarchy in [Figure 1-1](page 24)), a `Rectangle`
    instance can be statically typed to the `Graphic` class:


    Graphic `myRectangle:`;


    See [Enabling Static Behavior](page 95) for more static typing and its benefits.


    ## Type Introspection


    Instances reveal their types at runtime. The `isMemberOf:` method, defined in
    the `NSObject` class, checks whether the receiver is an instance of a particular
    class:


    ```

    if ([anObject isMemberOf:someClass])

    ```


    The `isKindOf:` method, also defined in the `NSObject` class, checks more generally
    whether the receiver inherits from or is a member of a particular class (whether
    it has the class in its inheritance path):


    ```

    if ([anObject isKindOf:someClass])

    ```


    The set of classes for which `isKindOf:` returns `YES` is the same set to which
    the receiver can be statically typed.


    Introspection is limited to type information. Later sections of this chapter discuss
    methods that return the class object, whether an object can respond to a message,
    and provide other information.


    See `NSClass Reference` for more on `isKindOf:`, `isMemberOfClass:`, and related
    methods.


    ## Class Objects


    A class definition contains various kinds of information, much of it about instances
    of the class: its superclass


    - The name of the class and its class

    - A template describing a set of instance variables

    - The declarations of method names and their return and parameter types

    - The method implementations


    This information is compiled and recorded in data structures made available to
    the runtime system. The compiler creates just one object, a class object, to represent
    the class. The class object has access to all the information about the class,
    which means mainly information about what instances of the class are. It is able
    to produce new instances according to the plan put forward in the class definition.


    Although a class object keeps the prototype of a class, it''s not an instance
    itself. It has no variables of its own and it can''t perform methods intended
    for instances of the class. However, a class definition can include methods intended
    for the class object—class methods as opposed to instance methods. A class object
    inherits methods from the classes above it in the hierarchy, as instances inherit
    instance methods.


    In source code, the class object is represented by the name. In the following
    example, the Rectangle class returns the class number using a method inherited
    from the NSObject class:


    ```

    int versionNumber = [Rectangle version];

    ```


    However, the class stands for the class object only as the receiver in a message
    expression. Elsewhere, you need to ask an instance or the class to return the
    class id. Both respond to a class message:


    ```

    id aClass = [anObject class];

    id rectClass = [Rectangle class];

    ```


    As these examples show, class objects like all other objects, be typed `id`. But
    class objects can also be more specifically typed to the Class data type:


    ```

    Class aClass = [anObject class];

    Class rectClass = [Rectangle class];

    ```


    All class objects are of type Class. Using this name for a class is equivalent
    to using the class name to statically type an instance.


    Class objects are full-fledged objects that can be dynamically typed, receive
    messages, and inherit methods from other classes. They''re special only in that
    they are created by the compiler, lack data structures (instance variables) of
    their own other than those built from the class definition, and are the agents
    for producing instances at runtime.


    > Note: The compiler also builds a metaclass object for each class. It describes
    the class object just as the class object instances of the class. But you can
    send messages to instances and the class object; the metaclass object is used
    internally by the runtime system.


    ## Creating Instances


    A fundamental function of a class object is to create new instances. This code
    tells the Rectangle class to create a new rectangle instance and assign it to
    the myRectangle variable:


    ```

    id myRectangle;

    myRectangle = [[Rectangle alloc] init];

    ```


    The alloc dynamically allocates memory for the new object''s instance variables
    and initializes them to 0–nil, that is, except the isa variable that connects
    the new instance to its class. For an object to be useful, it generally needs
    to be more completely initialized. The function of an init method typically follows:


    ```

    myRectangle = [[Rectangle alloc] init];

    ```


    ## Customization with Class Objects


    When a matrix creates NSCell objects, they should be initialized with a kind of
    cell. The NSMatrix uses the class object to produce new cells when it''s initialized
    and whenever it''s resized to contain more cells. The NSMatrix also defines a
    setCellClass method that passes the class object for the kind of NSCell a matrix
    should use to fill empty slots.


    ```

    [matrix setCellClass:[NSButtonCell]];

    ```

