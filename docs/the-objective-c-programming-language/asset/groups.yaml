    # CHAPTER 1


    Objects, Classes, and Messaging


    Figure 1-3 The inheritance hierarchy for NSCell


    ![](img/6f9b7a92b4fae621991881021b9bf44a_29_0.png)


    When a matrix creates NSCell objects, they should be NSButton objects to display
    a bank of buttons or switches, NSTextFieldCell objects to display fields where
    the user can enter and edit text, or some other kind of NSCell? NSMatrix object
    must allow for any kind of cell, even types that haven''t been invented.


    One solution to this problem would be to define the NSMatrix class as abstract
    and require everyone who uses it to declare a subclass and implement the methods
    that produce new cells. Because they would be implementing the methods, users
    would make sure that the objects they created were of the right type.


    This solution would require users of the NSMatrix class to do what ought to be
    done in the NSMatrix class itself, and it unnecessarily proliferates the number
    of classes. Because an application need more than one kind of matrix, each with
    a different kind of cell, it could become cluttered with subclasses. Every time
    you invent a new kind of NSCell, you would also have to define a new kind of NSMatrix.
    Moreover, programmers on different projects would be writing identical code to
    do the same job, all to make up for the failure of NSMatrix to do it.


    A better solution, and the solution that NSMatrix class adopts, is to allow NSMatrix
    to be initialized with a kind of NSCell—that is, with a class object. The NSMatrix
    class also defines a setCellClass method that passes the class object for the
    kind of NSCell an NSMatrix should use to fill empty slots.


    ```

    [matrix setCellClass:[NSButtonCell]];

    ```


    The NSMatrix uses the class object to produce new cells when it''s initialized
    and whenever it''s resized to contain more cells. This kind of customization would
    be difficult if classes weren''t objects that could be passed in messages and
    assigned to variables.


    # Variables and Class Objects


    When you define a new class, you can specify instance variables. Every instance
    of the class you declare—each object owns its own data. There is, however, no
    class counterpart to an instance variable. Only internal data structures, initialized
    from the class definition, are provided for the class. Moreover, a class object
    has no access to the instance variables of any instances; it can''t initialize,
    read, or alter them.


    For all instances of a class to share data, you must define an external variable
    of some sort. The simplest way to do this is to declare a variable in the class
    implementation file:


    ```

    int NSGlobalVariable;

    ```


