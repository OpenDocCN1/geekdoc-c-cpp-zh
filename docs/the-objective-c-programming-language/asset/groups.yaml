    # Fast Enumeration


    Fast enumeration is a language feature that allows you to efficiently and safely
    enumerate over the contents of a collection using a concise syntax.


    # The for...in Syntax


    The syntax for fast enumeration is defined as follows:


    ```

    for ( Type newVariable in expression ) ( statements )

    ```


    or


    ```

    for ( existingItem in expression ) ( statements )

    ```


    In cases, expression yields an object that conforms to the NSEnumeration protocol
    (see "Adopting Fast Enumeration" (page 91)). The iterating variable is set to
    each item in the returned object in turn, and the code defined by statements is
    set to nil when the loop ends by exhausting the source pool of objects. If the
    loop is terminated early, the iterating variable is left pointing to the last
    item.


    There are several advantages to using fast enumeration:


    +   * The enumeration is considerably more efficient than, for example, using
    NSEnumerator directly.

    * The syntax is concise.

    * Enumeration is "safe”—the enumerator has a mutation guard that so if you attempt
    to modify the collection during iteration, an exception is raised.


    Because mutation of the object during iteration is forbidden, you can perform
    multiple enumerations concurrently.


    # Adopting Fast Enumeration


    Any class that provides access to a collection of other objects can adopt the
    NSEnumeration protocol. The collection classes in the Foundation framework—NSArray,
    NSDictionary, and NSSet—adopt this protocol, using NSEnumerator. It should be
    obvious that in the cases of NSArray and NSSet the enumeration is over their contents.
    For others, the corresponding documentation should make clear what property is
    iterated—for example, NSDictionary and the Core Data class NSManagedObjectModel
    support for fast enumeration; NSDictionary enumerates its keys, and NSManagedObjectModel
    enumerates its entities.


    The for...in Syntax

