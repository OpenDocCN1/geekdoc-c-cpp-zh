    # Performance and Threading


    If you supply your own accessor method implementation, the fact that you declared
    a property has no effect on the method''s efficiency or thread safety.


    If you use a synthesized accessor, method implementation generated by the compiler
    depends on the specification you provide in the property declaration. The attributes
    that affect performance and threading are retain, assign, copy, and nonatomic.
    The first three of these only affect the implementation of the assignment part
    of the set, as illustrated in a possible implementation:


    ```

    // assign

    property = newValue;


    // retain

    if (property != newValue) {

    ```


