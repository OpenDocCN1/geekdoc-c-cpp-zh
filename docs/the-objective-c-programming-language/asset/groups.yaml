    The effect of the atomic attribute depends on the environment. By default, synthesized
    accessors are atomic, in a reference-counted environment, guaranteeing atomic
    behavior requires the use of a lock; moreover a returned object is retained and
    autoreleased, as illustrated in "Atomicity" (page 72). If such accessors are invoked
    frequently, guaranteeing atomicity may have a significant negative impact on performance.
    In a garbage-collected environment, most synthesized accessors are atomic without
    incurring overhead.


    It is important to understand that the goal of atomic implementation is to provide
    robust accessors—it does not guarantee correctness of your code. Although "atomic"
    means access to the property is thread-safe, simply making the properties in your
    class atomic does not mean that your class or generally your object graph is "thread-safe"—thread
    safety cannot be expressed at the level of individual accessor methods. For more
    about multithreading, see Thread Programming Guide.


    # Runtime Difference


    In the general behavior of properties is identical on both modern and legacy runtimes
    (see "Runtime Versions and Platforms" in Objective-C Runtime Programming Guide).
    There is one key difference: the modern runtime supports instance synthesis whereas
    the legacy runtime does not.


    For @synthesize to work in the legacy runtime, you must either provide an instance
    variable with the same name and compatible type of the property or specify another
    instance variable in the @synthesize statement. With the modern runtime, if you
    do not provide an instance variable, the compiler adds one for you. For example,
    the following class declaration and implementation:


    ```

    @interface MyClass : NSObject

    float floatName;

    float otherName;


    @property float floatName;

    @property float differentName;

    @property float noDeclaredivar;

    @end

    ```


    ```

    @implementation MyClass

    @synthesize sameName;

    @synthesize differentName=otherName;

    @synthesize noDeclaredivar;

    @end

    ```


    the compiler for the legacy runtime would generate an error at @synthesize noDeclaredivar;
    whereas the compiler for the modern runtime would add an instance variable to
    represent noDeclaredivar.


