    # 第一章


    对象、类与消息传递


    类名可以出现在 C 语言中任何允许使用类型说明符的地方——例如作为 `sizeof` 运算符的参数：


    ```

    int i = sizeof(Rectangle);

    ```


    ## 静态类型


    你可以使用类名来代替 `id` 以指定对象的类型：


    Rectangle `myRectangle:`;


    由于声明对象类型会向编译器提供关于该对象种类的信息，因此这被称为**静态类型**。由于 `id` 实际上是一个指针，因此对象被静态类型化为指向某个类的指针。对象总是通过指针进行类型化的。静态类型让指针更具显式；而
    `id` 则隐藏了它。


    静态类型允许编译器执行一些类型检查——例如，如果一个对象将接收到一条它似乎无法响应的消息——或者可以放宽适用于泛型类型 `id` 的某些限制。此外，它可以让阅读你源代码的人更清楚地理解你的意图；然而，它并不能防止动态绑定或在运行时更改接收者类的动态特性。


    对象可以被静态类型化为它所属的类或它所继承的任何类。例如，由于继承意味着 `Rectangle` 对象是一个 `Graphic` 对象（如[图 1-1](page
    24)中的类层次所示），`Rectangle` 实例可以被静态类型化为 `Graphic` 类：


    Graphic `myRectangle:`;


    访问[启用静态行为](page 95)了解更多关于静态类型及其优势。


    ## 类型内省


    实例在运行时揭示它们的类型。在 `NSObject` 类中定义的 `isMemberOf:` 方法检查接收者是否是特定类的实例：


    ```

    if ([anObject isMemberOf:someClass])

    ```


    `isKindOf:` 方法同样定义在 `NSObject` 类中，它更通用地检查接收者是否继承自特定类或是否是该类的成员（即其继承路径中是否包含该类）：


    ```

    if ([anObject isKindOf:someClass])

    ```


    `isKindOf:` 返回 `YES` 的类集合与接收者可以被静态类型化的类集合是相同的。


    内省限于类型信息。本章的后续章节将讨论返回类对象的方法、对象是否能响应消息，以及提供其他信息。


    访问 `NSClass Reference` 了解更多关于 `isKindOf:`、`isMemberOfClass:` 以及相关方法的信息。


    ## 类对象


    类定义包含各种信息，其中大部分关于类的实例：它的父类


    - 类的名称及其所属的类

    - 描述一组实例变量的模板

    - 方法名的声明及其返回值和参数类型

    - 方法的实现


    这些信息被编译并记录在运行时系统可用的数据结构中。编译器只创建一个对象，即**类对象**，来表示该类。类对象可以访问关于该类的所有信息，这意味着主要是关于该类的实例是什么的信息。它能够根据类定义中提出的方案产生新实例。


    虽然类对象保留了类的原型，但它本身并不是一个实例。它没有自己的变量，也无法执行为该类实例设计的方法。然而，类定义可以包含为类对象设计的方法——即类方法，区别于实例方法。类对象从其层次结构中上方的类继承方法，就像实例继承实例方法一样。


    在源代码中，类对象由名称表示。在接下来的示例中，`Rectangle` 类使用一个继承自 `NSObject` 类的方法返回类编号：


    ```

    int versionNumber = [Rectangle version];

    ```


    然而，类仅在消息表达式中作为接收者时才代表类对象。在其他地方，你需要请求实例或类来返回类 id。它们都响应类消息：


    ```

    id aClass = [anObject class];

    id rectClass = [Rectangle class];

    ```


    如这些示例所示，类对象像所有其他对象一样可以被类型为 `id`。但类对象也可以被更具体地类型为 `Class` 数据类型：


    ```

    Class aClass = [anObject class];

    Class rectClass = [Rectangle class];

    ```


    所有类对象都是 `Class` 类型。对类使用此名称等同于使用类名对实例进行静态类型化。


    类对象是功能完全的对象，可以进行动态类型、接收消息并从其他类继承方法。它们的特殊之处在于它们是由编译器创建的，除了根据类定义构建的之外没有自己的数据结构（实例变量），并且是运行时产生实例的代理。


    > 注意：编译器还会为每个类构建一个元类对象（metclass object）。它描述类对象的方式就像类对象描述实例一样。但你可以向实例和类对象发送消息；元类对象由运行时系统内部使用。


    ## 创建实例


    类对象的一个基本功能是创建新实例。这段代码告诉 `Rectangle` 类创建一个新的 `Rectangle` 实例并将其赋值给 `myRectangle`
    变量：


    ```

    id myRectangle;

    myRectangle = [[Rectangle alloc] init];

    ```


    `alloc` 为新对象的实例变量动态分配内存并将其初始化为 0–nil，即除了连接新实例与其类的 `isa` 变量外。为了让一个对象有用，它通常需要更完整的初始化。`init`
    方法的功能通常如下：


    ```

    myRectangle = [[Rectangle alloc] init];

    ```


    ## 使用类对象进行自定义


    当矩阵创建 `NSCell` 对象时，它们应该被初始化为某种单元格。`NSMatrix` 在初始化以及每当调整大小包含更多单元格时，都会使用类对象产生新单元格。`NSMatrix`
    还定义了 `setCellClass` 方法，用于传递矩阵应用于填充空槽的 `NSCell` 类的类对象。


    ```

    [matrix setCellClass:[NSButtonCell]];

    ```


    '
