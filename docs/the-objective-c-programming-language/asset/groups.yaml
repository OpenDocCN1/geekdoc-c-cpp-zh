    ## Subclassing with Properties


    You can override a readonly property to make it writable. For example, you could
    define a class MyInteger with a readonly property, value:


    ```

    @interface MyInteger : NSObject

    {

    NSInteger value;

    }

    @property(readonly) NSInteger value;

    @end

    ```


    ```

    @implementation MyInteger

    @synthesize implement

    @end

    ```


    You could implement a subclass, MyMutableInteger, which redefines the property
    to make it writable:


    ```

    @interface MyMutableInteger : MyInteger

    @property(readwrite) NSInteger value;

    @end

    ```


    ```

    @implementation MyMutableInteger

    @dynamic value;

    ```


    ```

    (void)setValue:(NSInteger)newX {

    value = newX;

    }

    @end

    ```


    ## Performance and Threading


    If you supply your own accessor method implementation, the fact that you declared
    a property has no effect on the method''s efficiency or thread safety.


    If you use a synthesized accessor, method implementation generated by the compiler
    depends on the specification you provide in the property declaration. The attributes
    that affect performance and threading are retain, assign, copy, and nonatomic.
    The first three of these only affect the implementation of the assignment part
    of the set, as illustrated in a possible implementation:


    ```

    // assign

    property = newValue;


    // retain

    if (property != newValue) {

    ```


    ```

    [property release];

    property = [newValue retain];

    }

    ```


    ```

    // copy

    if (property != newValue) {

    [property release];

    [newValue copy];

    }

    ```


