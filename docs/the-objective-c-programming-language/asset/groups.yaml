    Figure 1-1 shows that the Square class is a subclass of the Rectangle class, the
    Rectangle class is a subclass of Shape, Shape is a subclass of Graphic, and Graphic
    is a subclass of NSObject. Inheritance is cumulative. So a Square has the methods
    and instance variables defined for Rectangle, Shape, Graphic, and NSObject, as
    well as those defined specifically for Square. This is simply to say that an object
    of type Square is not only a square, it''s also a rectangle, a shape, and an object
    of type NSObject.


    Every class NSObject can then be seen as a specialization or an adaptation of
    another class. Each subclass further defines the cumulative total of what''s inherited.
    The Square class defines only the minimum needed to turn a rectangle into a square.


    When you define a class, you link it to the hierarchy by declaring its subclass;
    every class you create be the subclass of another class (unless you define a new
    root class). Plenty of potential superclasses are available. Cocoa includes the
    NSObject class and several frameworks containing definitions for more than 250
    additional classes. Some are classes that you can use off the shelf and incorporate
    into your program as is. You might want to adapt to your needs by defining a subclass.


    Some frameworks define everything you need, but leave some specifics to be implemented
    in a subclass. You can create very sophisticated objects by writing only a small
    amount of code and reusing work done by the programmers of the framework.


    # The NSObject Class


    NSObject is a root class, and doesn''t have a superclass. It defines the basic
    framework for Objective-C objects and interaction. It matters to the classes and
    instances of classes that they inherit the ability to behave and operate with
    the runtime.


    A class that doesn''t need to inherit any special behavior from another class
    should nevertheless be made a subclass of the NSObject class. Instances of the
    class must at least have the ability to behave like Objective-C objects at runtime.
    Inheriting this ability from the NSObject class is much simpler and much more
    reliable than reinventing it in a new class definition.


    # Objects, Classes, and Messaging


    > Note: Implementing a new root class is a delicate task with many hidden hazards.
    The class must duplicate much of what the NSObject class does, as to allocate
    instances, connect them to their class, and identify them to the runtime system.
    For this reason, you should generally use the NSObject class provided with Cocoa
    as the root class. For more information, see NSObject Class Reference and the
    NSObject Protocol.


    # Inheriting Instance Variables


    When a class creates a new instance, the instance contains not only the instance
    variables that were defined for its class but also those for its superclass, all
    the way back to the root. Thus, the isa instance variable defined in the NSObject
    class connects each object to its class.


    Figure 1-2 shows some of the instance variables that could be defined for a particular
    implementation of a Rectangle and where they come from. Note that the variables
    that make the rectangle are added to the ones that make it a shape, and the ones
    that make it a shape are added to the ones that make a graph, and so.


    # Figure 1-2 Rectangle instance variables


    | Class | isa: | declared in |

    |---|---|---|

    | NSPoint | origin; | in NSObject |

    | NSColor | *colorPrimary; | in Graphic |

    | Pattern | linePattern; | in Shape |

    | float | width; | |

    | float | height; | |

    | BOOL | filled; | in Rectangle |

    | NSColor | *fillColor; | |


    A class does not have to declare instance variables. It can simply define new
    methods and rely on the instance variables it inherits, if it needs any instance
    variables at all. For example, Square might not declare any instance variables
    of its own.


    # Inheriting Methods


    An object has access not only to the methods defined for its class but also to
    the methods defined for its superclass, and for its super-superclass, all the
    way back to the root of the hierarchy. For instance, a Square object can use methods
    defined in the Rectangle, Shape, Graphic, and NSObject classes as well as methods
    defined in its own class.


    Any new class you define in program can take use of the code written for all the
    classes above it in the hierarchy. This type of inheritance is a major benefit
    of object-oriented programming. When you use one of the object-oriented frameworks
    provided by Cocoa, your programs can take advantage of the basic functionality
    coded into the framework classes. You only have to add the code that custom the
    standard functionality to your program.


    Class objects also inherit from the classes above them in the hierarchy. But because
    they don''t have instance variables (only instances do), they inherit methods.


    # Overriding One Method with Another


    There''s one useful exception to inheritance: When you define a new class, you
    can implement a new method with the same name as one defined in a class further
    up the hierarchy. The new method overrides the original, instances of the new
    class perform it rather than the original, and subclasses of the new class inherit
    it rather than the original.


    For example, `Graphic` defines a `display` method that `Rectangle` overrides by
    defining its own version of `display`. The `Graphic` method is available to all
    kind of objects that inherit from the `Graphic` class—but not to `Rectangle` objects,
    which instead perform the `Rectangle` version of `display`.


    Although overriding a method blocks the original definition from inherited, other
    methods defined in the new class can skip over the redefined method and find the
    original ("Messages to self and super") (page 43).


    A redefined class can also incorporate the method it overrides. When it does,
    the new method serves only to refine or modify the, rather than replace it outright.
    When several classes in the hierarchy define the same method, but each new version
    overrides the, the implementation of the method is effectively spread over all
    the classes.


    Although a subclass can override inherited methods, it can''t override instance
    variables. Because an object has memory allocated for every instance variable
    it inherits, it can''t override an inherited variable by declaring a new one with
    the same name. If you try, the compiler will complain.


    # Abstract Classes


    Some classes are designed or primarily so that other classes can inherit from
    them. These abstract class groups methods and instance variables are defined by
    a number of subclasses into a common definition. The abstract class is typically
    incomplete by itself, but contains useful code to define the implementation of
    its subclasses. (Because abstract classes must have subclasses to be useful, they''re
    sometimes called **abstract subclasses**).


    Unlike some other languages, Objective-C does not have syntax to mark classes
    as abstract, nor does it prevent you from creating an instance of an abstract
    class.


    The `NSObject` class is the classic example of an abstract class in Cocoa. You
    never use instances of the `NSObject` class in an application—would'''' be good
    for anything; it be a generic object with the ability to do nothing in particular.


    The `UIView` class, on the other hand, provides an example of an abstract class,
    instances of which you occasionally use directly.


    Abstract classes often contain code that helps define the structure of an application.
    When you create subclasses of these classes, instances of your new classes fit
    effortlessly into the application structure and work automatically with other
    objects.


    # Class Types


    A class definition is a specification for a kind of object. The class, in effect,
    defines a data type. The type is not just on the data structure the class defines
    (instance variables), but also on the behavior included in the definition (methods).

