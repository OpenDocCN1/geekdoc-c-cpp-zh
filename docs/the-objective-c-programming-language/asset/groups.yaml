    # Combining Allocation and Initialization


    Allocating and Initializing Objects


    In Cocoa, some classes define creation methods that combine the two steps of allocating
    and initializing to return new, initialized instances of the class. These methods
    are often referred to as convenience constructors and typically take the form
    + className...where className is the name of the class. For example, NSString
    has the following methods (among others):


    +   + (id)stringWithCString:(const char *)string encoding:(NSStringEncoding)enc;

    +(id)stringWithFormat:(NSString *)format, ...;


    Similarly, NSArray defines the following class methods that combine allocation
    and initialization:


    +   + (id)array;


    Figure 3-4 The initialization chain


    ![](img/6f9b7a92b4fae621991881021b9bf44a_56_0.png)


    Note that B version of init sends a message to self to invoke the initWithName:
    method. Therefore, when the receiver is an instance of the B class, it invokes
    the B version of initWithName:, and when the receiver is an instance of the C
    class, it invokes the C version.'
  - "[PAGE 57]\n\n# CHAPTER 3\nAllocating and Initializing Objects\n\n```\n+ (id)arrayWithObject:(id)object;\n\
    + (id)arrayWithObjects:(id)firstObj; ...\n```\n\n> Important: You must understand\
    \ the memory management implications of using these methods if you do not use\
    \ garbage collection (\"Memory Management\" (page 15)). You must read Memory Management\
    \ Programming Guide to follow the policy that these allocate to these constructors.\n\
    \nThe return type of constructor is id for the same reason it is id for initializer\
    \ methods, discussed in \"Constraints and Conventions\" (page 50).\n\nMethods\
    \ that combine allocation and initialization are particularly valuable if the\
    \ allocation must be informed by the initialization. For example, if the data\
    \ is taken from a file, and the file might contain enough data to initialize more\
    \ than one object, it would be impossible to know how many objects to allocate\
    \ until the file is opened. In this case, you might implement a list: method that\
    \ takes the name of the file as a parameter. It would open the file, see how many\
    \ objects to allocate, and create a List object to then allocate and initialize\
    \ the objects from data file, put them in the list, and finally return the list.\n\
    \nIt also makes sense to combine allocation and initialization in a single method\
    \ if you want to avoid the stress of blindly allocating memory for an object that\
    \ you might not use. As mentioned in \"The Returned Object\" (page 49), an init...\
    \ method might substitute another object for the receiver. For example, when initWithName:\
    \ is passed a name that's already taken, it can free the memory and in its place\
    \ return the object that was previously assigned the name. This means, of course,\
    \ that an object is allocated and freed immediately without ever being used.\n\
    \nIf the code determines whether the receiver should be initialized inside the\
    \ method that the allocation instead inside init..., you can avoid the step of\
    \ allocating a new instance when one isn't needed.\n\nIn the following example,\
    \ the solo method ensures that there's no more than one instance of the Soloist\
    \ class. It allocates and initializes a shared instance:\n\n```\n+ (Soloist)solo\
    \ {\n    static Soloist *instance = nil;\n\n    if (instance == nil) {\n     \
    \   instance = [[self alloc] init];\n    }\n    return instance;\n}\n```\n\nNotice\
    \ that in this case the return type is Soloist *. Because this method returns\
    \ a singleton instance, strong typing is appropriate—there is no expectation that\
    \ this method will be overridden."
  - '[PAGE 58]


    # Protocols


    Protocols declare methods that can be implemented by any class. Protocols are
    useful in at least three situations:


    +   - To declare methods that others are expected to implement

    - To declare the interface to an object while concealing its class

    - To capture similarities among classes that are not hierarchically related


    # Declaring Interfaces for Others to Implement


    Class and category interfaces declare methods that are associated with a particular
    class—mainly methods that implement the classes. Informal and formal protocols,
    on the other hand, declare methods that are independent of any specific class,
    but which any, and perhaps many classes, implement.


    A protocol is simply a list of method declarations, unattached to a class definition.
    For example, these methods that report user actions on the mouse could be gathered
    into a protocol:


    ```

    (void)mouseDown:(NSEvent *)theEvent;

    (void)mouseDragged:(NSEvent *)theEvent;

    (void)mouseUp:(NSEvent *)theEvent;

    ```


    Any class that wants to respond to mouse events could adopt the protocol and implement
    its methods.


    Protocols free methods from dependency on the class hierarchy, so they can be
    used in ways that classes and categories cannot. Protocols list methods that are
    implemented somewhere, but the identity of the class that implements them is not
    of interest. What is of interest is whether or not a class conforms to the protocol—whether
    it has implementations of the methods of the protocol declares. Classes can be
    grouped into types not just on the basis of similarities inheriting from the same
    class, but also on the basis of similarity in conforming to the same protocol.
    Classes in unrelated branches of the inheritance hierarchy might be typed alike
    because they conform to the same protocol.


    Protocols can play a significant role in object-oriented design, especially when
    a project is divided among many implementors or it incorporates objects developed
    in other projects. Cocoa software uses protocols heavily to support process communication
    through Objective-C messages.


    However, an Objective-C program doesn''t need to use protocols. Unlike class definitions
    and message expressions, they are optional. Some Cocoa frameworks use them; some
    don''t. It depends on the task at hand.'
- md: "\n## Methods for Others to Implement\n\nIf you know the class of an object,\
    \ you can look at its interface declaration (and the interface declarations of\
    \ the classes it inherits from) to find what messages it responds to. These declarations\
    \ advertise the messages it can receive. Protocols provide a way for it to also\
    \ advertise the messages it sends.\n\nCommunication works both ways: an object\
    \ sends messages and can receive them. For example, an object might delegate responsibility\
    \ for a certain operation to another object, or on occasion simply need to ask\
    \ another object for information. In some cases, an object might be wishing to\
    \ notify other objects of its actions so they can take whatever collateral measures\
    \ might be required.\n\nIf you develop the class of the sender and the class of\
    \ the receiver as part of the same project (or if someone has supplied you with\
    \ the receiver and its interface), this communication is easily coordinated. The\
    \ sender imports the interface of the receiver. The imported file selects the\
    \ methods the sender uses in the messages it sends.\n\nHowever, if you develop\
    \ an object that sends messages aren't yet defined—you're leaving for others to\
    \ implement—you won't have the receiver's interface file. You need another way\
    \ to define the methods you use but don't implement. A protocol serves this purpose.\
    \ It informs the compiler about the methods class uses and informs other implementors\
    \ of the methods they need to define to have their objects work with.\n\nSuppose,\
    \ for example, that you develop an object that asks for the assistance of another\
    \ by sending help: other messages. You use an assistant instance variable to record\
    \ the outlet for others and define a companion method to set the instance variable.\
    \ This method lets other objects register themselves as recipients of your object's\
    \ messages:\n\n- - setAssistant:anObject - assistant:anObject;\n\nThen, when a\
    \ message is sent to the assistant, a check is made to be sure that the receiver\
    \ implements a method that can respond:\n\n```objc\n(BOOL)doWork {\n    if ([assistant\
    \ respondsToSelector:@selector(helpOut)]) {\n        [assistant helpOut:self];\n\
    \        return YES;\n    }\n    return NO;\n}\n```\n\nBecause, at the time you\
    \ wrote this code, you can't know what kind of object might register itself as\
    \ the assistant, you can only declare a protocol for the helpOut: method; you\
    \ can't import the interface of the class that implements it.\n\n## Declaring\
    \ Interfaces for Anonymous Objects\n\nA protocol can be used to declare the methods\
    \ of an anonymous object, an object of unknown class. An anonymous object may\
    \ represent a service or handle a limited set of functions, especially when only\
    \ one object of its kind is needed. (Objects that play a fundamental role in defining\
    \ an application's architecture and objects that are not anonymous before using\
    \ are good candidates for anonymity.)\n\nObjects are not anonymous to their developers,\
    \ of course, but they are anonymous when the developer supplies them to someone\
    \ else. For example, consider the following situations:\n\n- - Someone who supplies\
    \ a framework or a suite of objects for others to use objects that are not identified\
    \ by a class name or interface file. Failing the name and class interface, users\
    \ have no way of creating instances of it. Instead, the supplier must provide\
    \ a ready-made instance. Typically, a method in another class returns a usable\
    \ object:\n\n```objc\nid formatter = [receiver formattingService];\n```\n\nThe\
    \ object returned by the method is an object without a class identity, at least\
    \ not one supplier is willing to reveal. For it to be of any use at all, the supplier\
    \ must be identifying at least some of the messages it can respond to. The messages\
    \ are identified by associating the object with a list of methods declared in\
    \ a protocol.\n\n- You can send Objective-C messages to remote objects—in other\
    \ applications (\"Remote Messaging in the Objective-C Runtime Programming Guide,\
    \ discusses this in more detail.)\n\nEach application has its own structure, classes\
    \ and internal logic. But you don't need to know how another application works\
    \ or what components it to communicate with it. As an outsider, you need to know\
    \ what messages you send (the protocol) and where to send them (the receiver).\n\
    \nAn application that publishes one of its objects as a potential receiver of\
    \ remote messages must also publish a protocol declaring the methods the object\
    \ will use to respond to messages. It doesn't need to disclose anything about\
    \ the object. The sending application doesn't need to know the class of the object\
    \ or the class in its own design. All this is needed.\n\nProtocols make anonymous\
    \ objects possible. Without a protocol, there would be no way to declare an interface\
    \ to an object without identifying its class.\n\n> Note: Even though the supplier\
    \ of an anonymous object doesn't reveal its class, the object itself reveals it\
    \ at runtime. However, there's usually little point in discovering this extra\
    \ information; the information in the protocol is sufficient.\n\n## Nonhierarchical\
    \ Similarities\n\nIf more than one class implements a set of methods, those classes\
    \ are often grouped under an abstract class that declares the methods they have\
    \ in common. Each subclass can reimplement the methods in its own way, but the\
    \ inheritance hierarchy and the common declaration in the abstract class capture\
    \ the similarity between the subclasses.\n\n## CHAPTER 4\n### Protocols\n\nHowever,\
    \ sometimes it's not possible to group common methods in an abstract class. Classes\
    \ that are unrelated in most respects might nevertheless need to implement some\
    \ methods. This limited similarity may not justify a hierarchical relationship.\
    \ For example, you might want to add support for creating XML representations\
    \ of objects in your application and for initializing objects from an XML representation:\n\
    \n- - (NSMLElement *)XMLRepresentation;\n  initFromXMLRepresentation:(NSMLElement\
    \ *)xmlString;\n\nThese methods could be grouped into a protocol and the similarity\
    \ between implementing classes according or by noting that they all conform to\
    \ the same protocol.\n\nObjects can be typed by this similarity (the protocols\
    \ they conform to), rather than by their class. For example an NSMatrix instance\
    \ must communicate with the.\n\n## Formal Protocols\n\nObjective-C provides a\
    \ way to formally declare methods (including properties). Formal protocols are\
    \ supported by the language and the runtime system. For example, the compiler\
    \ can check at compile time nor a check at runtime whether an object conforms\
    \ to the protocol.\n\n### Declaring a Protocol\n\nYou declare protocols with the\
    \ @protocol directive:\n\n```objc\n@protocol ProtocolName\n  method declarations\n\
    end\n```\n\nFor example, you could declare an XML representation like this:\n\n\
    ```objc\n@protocol XMLSupport\n  initFromXMLRepresentation:(NSMLElement *)element;\n\
    \  (NSMLElement*)XMLRepresentation;\nend\n```\n\nUnlike classes, protocol names\
    \ do not have global visibility. They live in their own namespace.\n\n### Optional\
    \ Protocol Methods\n\nProtocol methods can be marked as optional using the @optional\
    \ keyword. Corresponding to the @optional keyword, there is @required to formally\
    \ denote the semantics of the default. You can use @optional and @required to\
    \ partition your protocol into sections you see fit. If you do not specify any,\
    \ the default is @required.\n\n```objc\n@protocol MyProtocol\n\n  -(void)requiredMethod;\n\
    \n  @optional\n  -(void)anOptionalMethod;\n  -(void)anotherOptionalMethod;\n\n\
    \  @required\n  -(void)anotherRequiredMethod;\n\n@end\n```\n\n> Note: In Mac OS\
    \ X v10.5, protocols cannot include optional properties. This constraint was introduced\
    \ in Mac OS X v10.6.\n\n## Informal Protocols\n\nIn addition to formal protocols,\
    \ you can also define an informal protocol by grouping the methods in a category\
    \ declaration:\n\n```objc\n@interface NSObject ( XMLSupport )\n  -initFromXMLRepresentation:(NSMLElement\
    \ *)element;\n  -(NSMLElement*)XMLRepresentation;\n@end\n```\n\nInformal protocols\
    \ are typically declared as categories of the NSObject class, because that broadly\
    \ associates the method names with any class that inherits from NSObject. Because\
    \ all classes inherit from the root class, the methods arent restricted to any\
    \ part of the inheritance hierarchy. (It is also possible to declare an informal\
    \ protocol as a category of another class to limit it to a branch of the inheritance\
    \ hierarchy, but there is little reason to do so)\n\nWhen used to declare a protocol,\
    \ a category interface does not have a corresponding implementation. Instead,\
    \ classes that implement the protocol declare the methods again in their own interface\
    \ files and define them with other methods in their implementation files.\n\n\
    An informal protocol binds the rules of category declarations to list a group\
    \ of methods but do not associate with any particular class or implementation.\n\
    \nInformal protocols declared in categories do not receive much language support.\
    \ There type no checking at compile time nor a check at runtime to see whether\
    \ an object conforms to the protocol. To get these benefits, you must use a formal\
    \ protocol. An informal protocol may be useful when all the methods are optional,\
    \ such as for a delegate, but (in Mac OS X v10.5 and later) it is typically better\
    \ to use a formal protocol with optional methods.\n"
  mdcn: "\n\n## 其他人实现的方法\n\n如果你知道一个对象的类，就可以查看它的接口声明（以及它所继承的类的接口声明），以找到它响应的消息。这些声明宣告了它能够接收的消息。协议（Protocols）提供了一种方式，让它也能宣告它发送的消息。\n\
    \n通信是双向的：对象既可以发送消息，也可以接收消息。例如，一个对象可能会将某些操作的委托给另一个对象，或者在某些情况下只需向另一个对象询问信息。在某些情况下，对象可能希望通知其他对象它的行为，以便它们采取可能需要的任何附带措施。\n\
    \n如果你在同一个项目中开发了发送者类和接收者类（或者有人向你提供了接收者及其接口），那么这种通信是很容易协调的。发送者导入接收者的接口。导入的文件决定了发送者在发送的消息中使用的方法。\n\
    \n然而，如果你开发的对象会发送消息，但这些消息尚未定义——即你正把它们留给他人实现——那么你就没有接收者的接口文件。你需要另一种方法来定义你使用但未实现的方法。协议就具有此目的。它告诉编译器类所使用的方法，并通知其他实现者他们需要定义哪些方法才能使他们的对象与之协作。\n\
    \n例如，你开发了一个对象，通过发送 `help:` 等其他消息来请求另一个对象的协助。你使用一个助手实例变量来记录其他出口，并定义一个辅助方法来设置该实例变量。此方法允许其他对象注册为你的对象消息的接收者：\n\
    \n- - setAssistant:anObject - assistant:anObject;\n\n然后，当向助手发送消息时，会进行检查，以确保接收者实现了一个可以响应的方法：\n\
    \n```objc\n(BOOL)doWork {\n    if ([assistant respondsToSelector:@selector(helpOut)])\
    \ {\n        [assistant helpOut:self];\n        return YES;\n    }\n    return\
    \ NO;\n}\n```\n\n因为在你编写这段代码时，你无法知道会有什么种对象将自己注册为助手，你只能为 `helpOut:` 方法声明一个协议；你无法导入实现它的类的接口。\n\
    \n## 为匿名对象声明接口\n\n协议可以用于声明匿名对象（即类未知的对象）的方法。匿名对象可以代表某种服务或处理一组有限的函数，特别是当仅需要一个此类类型的对象时。（在定义应用程序架构中起基础性作用的对象，以及在使用之前不是匿名的对象，是匿名化的良好候选者。）\n\
    \n当然，对象对开发者来说不是匿名的，但当开发者将它们提供给他人时，它们就是匿名的。例如，考虑以下情况：\n\n- 有人为他人提供一个框架或对象set，而这些对象没有通过类名或接口文件标识。由于缺少名称和类接口，用户没有办法创建它的实例。相反，提供者必须提供一个现成的实例。通常，另一个类中的方法返回一个可用的对象：\n\
    \n```objc\nid formatter = [receiver formattingService];\n```\n\n方法返回的对象是一个没有类标识的对象，至少不是提供者愿意公开的标识。为了让它产生任何作用，提供者必须识别出它能够响应的一些消息。这些消息通过将对象与协议中声明的方法列表关联来标识。\n\
    \n- 你可以向远程对象发送 Objective-C 消息——在其他应用程序中（《Objective-C 运行时编程指南》中更详细地讨论了这一点）。\n\n\
    每个应用程序都有自己的结构、类和内部逻辑。但你不需要知道另一个应用程序是如何工作的，也不需要它与哪些组件进行通信。作为局外人，你只需要知道你发送什么消息（协议）以及将它们发送到哪里（接收者）。\n\
    \n发布其一个对象作为远程消息潜在接收者的应用程序还必须发布一个协议，声明该对象将用于响应消息的方法。它不需要披露关于对象的任何内容。发送应用程序不需要知道该对象的类或其自身设计中的类。这些就足够了。\n\
    \n协议使得匿名对象成为可能。没有协议，就无法在不标识其类的情况下声明对象的接口。\n\n> 注意：尽管匿名对象的提供者没有暴露它的类，但对象本身在运行时会揭露它。然而，发现这些额外信息通常没有意义；协议中的信息已经足够了。\n\
    \n## 非层次结构的相似性\n\n如果多个类实现一组方法，这些类通常被归类在一个抽象类下，该抽象类声明了它们共同的方法。每个子类都可以以自己的方式重新实现方法，但继承层次结构和抽象类中的共同声明捕捉了子类之间的相似性。\n\
    \n## 第 4 章\n### 协议\n\n然而，有时无法在抽象类中对共同方法进行类。在大多数方面无关的类可能仍然需要实现某些方法。这种有限的相似性可能不足以建立层次关系。例如，你可能希望在你的应用程序中添加创建对象的\
    \ XML 表示的支持，以及从 XML 表示初始化对象的功能：\n\n- - (NSMLElement *)XMLRepresentation;\n  initFromXMLRepresentation:(NSMLElement\
    \ *)xmlString;\n\n这些方法可以组在协议中，实现类之间的相似性可以通过遵循或通过注意到它们都遵循相同的协议来体现。\n\n对象可以通过这种相似性（它们遵循的协议）而不是通过它们的类来确定类型。例如，一个\
    \ NSMatrix 实例必须与……通信。\n\n## 正式协议\n\nObjective-C 提供了一种正式声明方法（包括属性）的方法。正式协议受到语言和运行时系统的支持。例如，编译器可以在编译时检查，或者在运行时检查一个对象是否符合该协议。\n\
    \n### 声明协议\n\n你使用 `@protocol` 指令声明协议：\n\n```objc\n@protocol ProtocolName\n  method\
    \ declarations\nend\n```\n\n例如，你可以这样声明一个 XML 表示：\n\n```objc\n@protocol XMLSupport\n\
    \  initFromXMLRepresentation:(NSMLElement *)element;\n  (NSMLElement*)XMLRepresentation;\n\
    end\n```\n\n与类不同，协议名称没有全局可见性。它们存在于自己的命名空间中。\n\n### 可选协议方法\n\n可以使用 `@optional`\
    \ 关键字将协议方法标记为可选。与 `@optional` 关键字对应的是 `@required`，用于正式表示默认的语义。你可以使用 `@optional`\
    \ 和 `@required` 将你的协议划分为你认为合适的部分。如果不指定任何，默认是 `@required`。\n\n```objc\n@protocol\
    \ MyProtocol\n\n  -(void)requiredMethod;\n\n  @optional\n  -(void)anOptionalMethod;\n\
    \  -(void)anotherOptionalMethod;\n\n  @required\n  -(void)anotherRequiredMethod;\n\
    \n@end\n```\n\n> 注意：在 Mac OS X 10.5 中，协议不能包含可选属性。这一限制是在 Mac OS X 10.6 中引入的。\n\n\
    ## 非正式协议\n\n除了正式协议，你还可以通过在分类（category）声明中分组方法来定义非正式协议：\n\n```objc\n@interface\
    \ NSObject ( XMLSupport )\n  -initFromXMLRepresentation:(NSMLElement *)element;\n\
    \  -(NSMLElement*)XMLRepresentation;\n@end\n```\n\n非正式协议通常声明为 NSObject 的分类，因为这将方法名与任何继承自\
    \ NSObject 的类广泛关联。由于所有类都继承自根类，这些方法不受限制在继承层次结构的任何部分。（也可以将非正式协议声明为另一个类的分类，以限制其在继承层次结构的分支中，但没有理由这样做。）\n\
    \n当用于声明协议时，分类接口没有相应的实现。相反，实现协议的类在它们自己的接口文件中再次声明这些方法，并在它们的实现文件中与其他方法一起定义它们。\n\n\
    非正式协议绑定分类声明的规则来列出一组方法，但不与任何特定的类或实现关联。\n\n在分类中声明的非正式协议没有得到太语言支持。没有编译时检查，也没有运行时检查来查看对象是否符合该协议。要获得这些优势，你必须使用正式协议。非正式协议在所有方法都是可选的情况下可能有用（例如对于代理），但（在\
    \ Mac OS X 10.5 及更高版本中）通常使用带有可选方法的正式协议更好。\n\n"
