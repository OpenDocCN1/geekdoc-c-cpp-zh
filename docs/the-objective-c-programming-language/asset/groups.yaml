    # Declared Properties


    getter-getterName

    Specifies the name of the accessor for the property. The getter must return a
    type matching the property''s type and take no parameters.


    setter-setterName

    Specifies the name of the accessor for the property. The setter method must take
    a single parameter of a matching type and return void.

    If you specify that property is readonly and also specify a setter with-, you
    get a compiler warning.


    Typically you should specify method names that are key-value coding (see Key-Value
    Coding Programming Guide)—a common reason for using the getter decorator to adhere
    to isProperty convention for Boolean values.


    # Writability


    These attributes specify whether or not a property has an associated setter. They
    are mutually exclusive.


    readwrite

    Indicates that the property should be treated as read/write. The attribute is
    the default.

    Both a getter and setter method are required in the @implementation block. If
    you use the @synthesize directive in the implementation block, the getter and
    setter methods are synthesized.


    readonly

    Indicates that the property is read-only.

    If you specify readonly, only a getter method is required in the @implementation
    block. If you use the @synthesize directive in the implementation block, only
    the getter method is synthesized.

    Moreover, if you attempt to assign a value using the Objective-C syntax, you get
    a compiler error.


    # Setter Semantics


    These attributes specify the semantics of a set accessor. They are mutually exclusive.


    assign

    Specifies that the setter uses simple assignment. This attribute is the default.

    You typically use this for scalar types such as NSInteger and CGRect, (or in a
    reference-counted environment) for objects you don''t own, as delegates.

    retain and assign are effectively the same in a garbage-collected environment.


    retain

    Specifies that retain should be invoked on the object assignment. (The default
    is assign).

    The previous value is sent a release release message.

    Prior to Mac OS X v10.6, this is valid only for Objective-C object types (so you
    cannot specify retain for Core Foundation objects—see “Core Foundation (page 77)).

    In Mac OS X v10.6 and later, you can use the __attribute__ keyword to specify
    that a Core Foundation property be treated like an Objective-C object for memory
    management:

    @property(retain) __attribute__((NSObject)) myDictionary;'
  - '[PAGE 71]


    # CHAPTER 5

    Declared Properties


    copy

    Specifies that a copy of the object should be used for assignment. (The default
    is assign).

    The previous value is a release message.

    The copy is made by invoking the copy method. This attribute is valid only for
    object types, which must implement the NSCopying protocol. For further discussion,
    see "Copy" (page 75).

    Different apply depending on whether or not you use garbage collection:


    +   * If you do not use garbage collection, for object properties you must specify
    one of assign, retain, copy—otherwise you get a compiler warning. This constraint
    constrains you to think about memory management behavior you want and to type
    behavior explicitly).

    * If you use garbage collection, you don''t get a warning if you use the default
    (if you don''t specify any of assign, retain, or copy) unless the property''s
    type is a class that conforms to NSCopying. The default is what you want; if the
    property type can be copied, however, to preserve encapsulation you often to make
    a private copy of the object.


    To decide which one you choose, you need to understand Cocoa memory management
    policy (see Memory Programming Guide).


    # Atomicity

    You can use this attribute to specify that accessor methods are not atomic. (There
    is no keyword to denote atomic).


    nonatomic

    Specifies that accessors are nonatomic. By default, accessors are atomic.

    Properties are atomic by default so that synthesized accessors provide robust
    access to properties in a multithreaded environment—that is, the value returned
    from the getter or setter is always retrieved or set regardless of what threads
    are executing concurrently. For more details, see "Performance and Threading"
    (page 79).


    If you retain or copy and do not specify nonatomic, then in a reference-counted
    environment, a synthesized accessor for an object property uses a lock and autorelease
    and returns the returned value—the implementation will be similar to the following:


    ```

    [internal lock]; // lock using an object-level lock

    id result = [[retain] autorelease];

    [internal unlock];

    return result;

    ```


    If you specify nonatomic, a synthesized accessor for an object property simply
    returns the value directly.


    # Markup and Deprecation

    Properties support the full range of C-style decorators. Properties can be deprecated
    and support

    __attribute__


    ```

    @property CGFloat x

    AVAILABLE_MAC_OS_X_VERSION_10_AND_LATER_BUT_DEPRECATED_IN_MAC_OS_X_VERSION_10_4;

    @property CGFloat y _attribute__(()).

    ```'
- md: "\n# CHAPTER 5\n## Declared Properties\n\nIf you want to specify that a property\
    \ is an Interface outlet, you can use the IBOutlet identifier:\n\n@property (nonatomic,\
    \ retain) IBOutlet UIButton *myButton;\n\nIBOutlet is not though a formal part\
    \ of the list of attributes.\n\nIf you use garbage collection, you can use the\
    \ storage modifiers __weak and __strong in a property’s declaration:\n@property\
    \ (nonatomic, retain) __weak Link *parent;\n\nBut again, storage modifiers are\
    \ not a formal part of the list of attributes.\n\n## Property Implementation Directives\n\
    \nYou can use the @synthesize and @dynamic directives in @implementation blocks\
    \ to trigger specific actions. Note that neither is required for any given @property\
    \ declaration.\n\n> **Important:** If you do not either @synthesize or @dynamic\
    \ for a particular property, you must provide a getter and setter (or just a readonly\
    \ property) property method implementation for that property. If you do not, the\
    \ compiler generates a warning.\n\n### @synthesize\nYou use the @synthesize directive\
    \ to tell the compiler that it should synthesize the setter and/or getter methods\
    \ for a property if you do not supply them within the @implementation block.\n\
    \n+   Listing 5-2 Using @synthesize\n@interface MyClass : NSObject\n\nNSString\
    \ *value;\n@property (copy, readwrite) NSString *value;\n@end\n\n@implementation\
    \ MyClass\n@synthesize value;\n@end\n\nYou can use the property-ivar to indicate\
    \ that a particular instance variable should be used for the property, for example:\n\
    @synthesize firstName, lastName, age = yearsold;\n\nThis specifies the accessor\
    \ for firstName, lastName, and age will be synthesized and that the property age\
    \ is represented by the instance variable yearsold. Other aspects of the synthesized\
    \ methods are determined by the optimal attributes (see \"Property Declaration\
    \ Attributes\" (page 70).\n\nWhether or not you synthesize the name of the instance,\
    \ the @synthesize directive can use an instance variable only from the current\
    \ class, not a superclass.\nThere are differences in the behavior of accessor\
    \ synthesis that depends on the runtime (see also \"Runtime Difference\" (page\
    \ 80)).\n\n- For the legacy runtimes, instance variables must be declared in the\
    \ @interface block of the current class. If an instance variable of the same name\
    \ as the property exists, and if its type is compatible with the property's type,\
    \ it is used—otherwise, you get a compiler error.\n- For the modern runtimes (see\
    \ \"Runtime Versions and Platforms\" in Objective-C-Runtime), instance variables\
    \ are synthesized. If an instance variable of the same name already exists, it\
    \ is used.\n\n### @dynamic\nYou use the @dynamic keyword to tell the compiler\
    \ that you will fulfill the API contract implied by a property by providing method\
    \ implementations directly or at runtime using other mechanisms such as dynamic\
    \ loading of code or dynamic method resolution. It suppresses the warning that\
    \ the compiler would generate if it can't find implementations. You should use\
    \ it only if you know the methods will be available at runtime.\n\nThe example\
    \ in Listing 5-3 illustrates @dynamic with a subclass of NSManagedObject.\n\n\
    ### Listing 5-3 Using @dynamic with NSManagedObject\n\n```\n@interface MyClass\
    \ : NSManagedObject\n    @property(nonatomic, retain) NSString *value;\n@end\n\
    \n@implementation MyClass\n    @dynamic value;\n@end\n```\n\nNSManagedObject is\
    \ provided by the Core Data framework. A managed object class has a schema that\
    \ defines attributes and relationships for the class; at runtime, the Core Data\
    \ framework generates accessor methods for these as necessary. You therefore typically\
    \ declare properties for the attributes and relationships, but you don't have\
    \ to implement the accessor methods yourself and shouldn't ask the compiler to\
    \ do so. If you just declared the property without any implementation, however,\
    \ the compiler would generate a warning. Using @dynamic suppresses the warning.\n\
    \n## Using Properties\n\n### Supported Types\n\nYou can declare a property for\
    \ an Objective-C class, Core Foundation data type, or \"plain old data\" (POD)\
    \ type (see C++ Language Note: POD Types). For constraints on using Core Foundation\
    \ types, however, see \"Core Foundation\" (page 77).\n\n## Property Redeclaration\n\
    \nYou can redeclare a property in a subclass, but (with the exception of readonly\
    \ versus readwrite) you must repeat its attributes in the subclasses. The same\
    \ holds true for a property declared in a category or protocol—the property may\
    \ be redeclared in a category or protocol, the property’s attributes must be repeated\
    \ in.\n\nIf you declare a property in one as readonly, you can redeclare it as\
    \ readwrite in a class extension (see \"Extensions\" (page 83)), in a protocol,\
    \ or in a subclass (\"Subclassing with Properties\" (page 79)). In the case of\
    \ a class redeclaration, the fact that the property redeclared prior to any@synthesize\
    \ statement causes the setter to be synthesized. The ability to redeclare a read-only\
    \ property as read/write enables two common implementation patterns: a mutable\
    \ subclass of an immutable class (NSString, NSArray and NSDictionary are all)\
    \ and a property that has a public API that is readonly but a private readwrite\
    \ implementation to the class. The following example shows using class extension\
    \ to provide a property that is declared as read-only in the public header but\
    \ is redeclared privately\n\n```\n// public header\n@interface NSObject {\nNSString\
    \ *language;\n@property(readonly, copy) NSString *language;\n@end\n```\n\n```\n\
    // private implementation file\n@interface NSObject (\n@property(readwrite, copy)\
    \ NSString *language;\nend\n```\n\n```\n@implementation MyObject\n@synthesize\
    \ language;\nend\n```\n\n## Copy\n\nIf you use the copy declaration attribute,\
    \ you specify that a value is copied during assignment. If you synthesize the\
    \ corresponding accessor, the synthesized method uses the copy method. Copying\
    \ is useful for attributes such as string objects where there is a possibility\
    \ that the new value passed in a setter may be mutable (for example, an instance\
    \ of NSMutableString and you want to ensure that your object has its own immutable\
    \ copy). For example, if you declare a property as:\n\n@property(atomic, copy)\
    \ NSString *string;\n\nthen the synthesized setter method is similar to the following:\n\
    \n```\n-(void)setString:(NSString *)newString {\n    if (string !=newString) {\n\
    \        [string release];\n        string = [newString copy];\n    }\n}\n```\n\
    \nAlthough this pattern works well for strings, it may present a problem if the\
    \ attribute is a collection such as an array or set. Typically you want such collections\
    \ to be mutable, the copy method returns an immutable version of the collection.\
    \ In this situation, you have to provide your own implementation of the setter\
    \ method, as illustrated in the following example.\n\n```\n@interface MyClass\
    \ : NSObject\n  NSMutableArray *myArray;\n  @property (nonatomic, copy) NSMutableArray\
    \ *myArray;\n@end\n```\n\n```\n@implementation MyClass\n\n  @synthesize myArray;\n\
    \n  (void)setArray:(NSMutableArray*)newArray {\n    if (myArray != newArray) {\n\
    \      [myArray release];\n      myArray = [newArray mutableCopy];\n    }\n  }\n\
    \n@end\n```\n\n## dealloc\n\nDeclared properties, along with the @synthesize directive,\
    \ take the place of accessor method declarations; when you synthesize a property,\
    \ the compiler creates accessor methods as needed. However, there is no direct\
    \ interaction between property declaration and the dealloc method—properties are\
    \ not automatically released for you. Declared properties do, however, provide\
    \ a useful way to cross-check the implementation of your dealloc method: you can\
    \ look for all the property declarations in your header file and make sure that\
    \ properties not marked assign are those marked assign are not released.\n\n>\
    \ Note: In a dealloc method you should release instance variables directly (rather\
    \ than invoking a setter and passing nil as the parameter), as illustrated in\
    \ this example:\n\n(void)dealloc {\n  [property release];\n  [super dealloc];\n\
