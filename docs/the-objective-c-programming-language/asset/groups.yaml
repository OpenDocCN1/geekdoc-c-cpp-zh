    \ 80 页））。\n\n- 对于旧版运行时，实例变量必须在当前类的 @interface 块中声明。如果存在一个与属性同名的实例变量，且其类型与属性的类型兼容，则会使用它——否则，你将得到编译器错误。\n\
    - 对于现代运行时（见 Objective-C-Runtime 中的“运行时版本和平台”），实例变量是合成的。如果已经存在同名的实例变量，则使用它。\n\n\
    ### @dynamic\n你使用 @dynamic 关键字告诉编译器，你将通过直接提供方法实现或在运行时使用其他机制（如代码的动态加载或动态方法解析）来履行属性隐含的\
    \ API 合约。它抑制编译器在找不到实现时会生成的警告。只有当你确定方法在运行时可用时才应该使用它。\n\n列表 5-3 中的示例说明了 NSManagedObject\
    \ 子类中的 @dynamic。\n\n```\n@interface MyClass : NSManagedObject\n    @property(nonatomic,\
    \ retain) NSString *value;\n@end\n\n@implementation MyClass\n    @dynamic value;\n\
    @end\n```\n\nNSManagedObject 由 Core Data 框架提供。管理对象类有一个定义类属性和关系的模式（schema）；在运行时，Core\
    \ Data 框架会根据需要为这些内容生成访问方法。因此，你通常为属性和关系声明属性，但你不需要自己实现访问方法，也不应该要求编译器这样做。然而，如果你只是声明了属性而没有任何任何实现，编译器将生成一个警告。使用\
    \ @dynamic 可以抑制该警告。\n\n## 使用属性\n\n### 支持的类型\n\n你可以为 Objective-C 类、Core Foundation\
    \ 数据类型或“纯旧数据”（POD）类型（参见 C++ 语言备注：POD 类型）声明属性。但是，关于使用 Core Foundation 类型的限制，请参见“Core\
