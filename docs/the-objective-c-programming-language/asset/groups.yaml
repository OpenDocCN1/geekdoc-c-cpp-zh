  - "[PAGE 34]\n\n# Defining a Class\n\nMuch of object-oriented programming consists\
    \ of writing the code for new objects—defining new classes.\nin Objective-C, classes\
    \ are defined in two parts:\n\n+   - An interface that declares the methods and\
    \ instance variables of the class and names its superclass\n- An implementation\
    \ that actually defines the class (contains the code that implements methods)\n\
    \nEach of these parts is typically in one file. Sometimes, however, a class definition\
    \ spans files through the use of a feature called a category. Categories can compartmentalize\
    \ a class definition or extend an existing one. Categories are described in \"\
    Categories and Extensions\" (page 81).\n\n# Source Files\n\nAlthough the compiler\
    \ doesn't require it, class interface and implementation are usually in two different\
    \ files.\nThe interface file must be made available to anyone who uses the class.\n\
    \nA single file can declare or implement more than one class. Nevertheless, it's\
    \ customary to have a separate interface file for each class, if not a separate\
    \ implementation file. Keeping class interfaces better reflects their status as\
    \ independent entities.\n\nInterface and implementation files are typically named\
    \ after the class. The name of the implementation file has the .m extension, indicating\
    \ that it contains Objective-C source code. The interface file can be assigned\
    \ any extension. Because it is included in other source files, the name of the\
    \ interface file usually has the .h extension of header files. For example, the\
    \ Rectangle class would be declared in Rectangle.h\\and defined in Rectangle.m.\n\
    \nSeparating an object from its implementation fits well with the design of object-oriented\
    \ programs.\n object is a self-contained entity that can be viewed from the outside\
    \ as a black box. Once you've determined how an object interacts with other elements\
    \ in your program—that is, once you've declared the\ninterface—you can freely\
    \ alter its implementation without affecting any other part of your application.\n\
    \n# Class Interface\n\nThe declaration of a class interface begins with the compiler\
    \ directive @interface and ends with the\n@end. (All Objective-C directives begin\
    \ with \"@\")\n\n```\n@interface ClassName : ItsSuperclass\n instance variable\
    \ declarations\n}\nmethod declarations\n```"
- md: "\n# CHAPTER 2\n## Defining Class\n\n@end\n\nThe first line of the declaration\
    \ presents the new class name and links to its superclass. The super-class defines\
    \ the position of the new class in the inheritance hierarchy, as discussed under\
    \ \"Inheritance\" (page 23). If the colon and superclass are omitted, the new\
    \ class is declared as a root class, a rival to the NSObject class.\n\nFollowing\
    \ the first part of the class declaration, braces enclose instance variables,\
    \ the data structures that are part of each instance of the class. Here's a partial\
    \ list of instance variables that might be declared in the Rectangle class:\n\n\
    ```\nfloat width;\nfloat height;\nBOOL filled;\nNSColor *fillColor;\n```\n\nMethods\
    \ for the class are declared next, after the braces enclosing instance variables\
    \ and before the end of the class declaration. The names of methods that can be\
    \ used by class objects, class methods, are preceded by a plus sign:\n\n- ++ alloc;\n\
    \nThe methods that instances of a class can use, instance methods, are marked\
    \ with a minus sign:\n\n- - (void)display;\n\nAlthough it's not common practice,\
    \ you can declare a class method and an instance method with the same name. A\
    \ method can also have the same name as an instance variable, which is more common,\
    \ especially if the method returns the value in the variable. For example, Circle\
    \ has a radius method that could match a radius instance variable.\n\nMethod return\
    \ types are declared using the standard C syntax for one type to another:\n\n\
    - - (float)radius;\n\nParameter types are declared in the same way:\n\n- - (void)setRadius:(float)radius;\n\
    \nIf a return or parameter is not explicitly declared, it's assumed to be the\
    \ default type for methods and messages—an id. The alloc method illustrated earlier\
    \ returns id.\n\nWhen there's more than one parameter, the parameters are declared\
    \ within the method name after the colons. Parameters break the name apart in\
    \ the declaration, just as in a message. For example:\n\n- - (void)setWidth:(float)width\
    \ height:(float)height;\n\nMethods that take a variable number of parameters declare\
    \ them using a comma and ellipsis points, just as a function would:\n\n- - makeGroup:group,\
    \ ...;\n\n# Class Interface\n\n## Importing to the Interface\n\nThe interface\
    \ file must be included in any source module that depends on the class interface—that\
    \ includes any module that creates an instance of the class, sends a message to\
    \ invoke a method declared for the class, or mentions an instance variable declared\
    \ in the class. The interface is usually included with the #import\n\n```\n@import\
    \ \"Rectangle.h\"\n```\n\nThis directive is ideal to #include, except that it\
    \ makes sure that same file is never included more than once. This therefore preferred\
    \ and used in place of #include in code examples throughout Objective-C based\
    \ documentation.\n\nTo reflect that a class builds on the definitions of inherited\
    \ classes, an interface file begins by importing the interface for its superclass:\n\
    \n```\n@import \"ItsSuperClass.h\"\n@Interface ClassName : ItsSuperclass\n   \
    \ Instance variable declarations\n    method declarations\n@end\n```\n\nThis convention\
    \ means that every interface file includes files, indirectly, the interface files\
    \ for all inherited classes. When a source module imports a class interface, it\
    \ gets interfaces for the entire inheritance hierarchy that the class is built\
    \ upon.\n\nNote that if there is a precomp—a precompiled header—that supports\
    \ the superclass, you may prefer to import the precomp instead.\n\n## Referring\
    \ to Other Classes\n\nAn interface file declares a class and, by importing its\
    \ superclass, implicitly contains declarations for all inherited classes, from\
    \ NSObject down through its superclass. If the interface mentions classes not\
    \ in this hierarchy, it must import explicitly or declare them with the @class\
    \ directive:\n\n```\n@class Rectangle, Circle;\n```\n\nThis directive informs\
    \ the compiler that \"Rectangle\" and \"Circle\" are class names. It doesn't import\
    \ their interface files.\n\nAn interface file mentions names when it typically\
    \ uses instance variables, return values, and parameters. For example, this declaration\n\
    \n```\n(void)setPrimaryColor:(NSColor *)aColor;\n```\n\nmentions the NSObject\
    \ class.\n\nBecause declarations like this use the class as a type and don't depend\
    \ on any of the class interface (methods and instance variables), the @class directive\
    \ gives the compiler sufficient forewarning of what to expect. However, when the\
    \ interface to a class is actually used (instances created, messages sent), the\
    \ class interface must be imported. Typically, an interface file uses @class to\
    \ declare classes, and the corresponding implementation file imports its interfaces\
    \ (if it needs to create instances of those classes or send them messages).\n\n\
    The @class directive minimizes the amount of code seen by the compiler and linker,\
    \ and is therefore the simplest way to give a forward declaration of a class name.\
    \ Being simple, it avoids potential problems that may come with importing files\
    \ that import other files. For example, if one class declares a statically typed\
    \ instance variable of another class, and their two interface files import each\
    \ other, neither class may compile correctly.\n\n# CHAPTER 2\n\n## The Role of\
    \ the Interface\n\nThe purpose of the interface file is to declare the new class\
    \ to other source modules (and to other programmers). It contains information\
    \ they need to work with the class (programmers might appreciate a little documentation).\n\
    \n- The interface file tells users how the class is connected into the inheritance\
    \ hierarchy and what other classes—inherited or simply referred to somewhere in\
    \ the class—are needed.\n- The interface also tells the compiler what instance\
    \ variables an object contains, and tells programmers what subclasses inherit.\
    \ Although instance variables are most viewed as a matter of the implementation\
    \ of a class rather than its, they must never be declared in the interface file.\
    \ This declaration is necessary because the compiler must be aware of the structure\
    \ of an object where it is used.\n- Finally, through its list of method declarations,\
    \ the interface lets others know what messages can be sent to the class.\n\n##\
    \ Class Implementation\n\nThe definition of a class is structured very much like\
    \ its declaration. It begins with the @implementation directive and ends with\
    \ the @end.\n\n```\n@implementation ClassName : ItsSuperclass\n{\n    instance\
    \ variable declarations\n}\nmethod definitions\n@end\n```\n\nHowever, every implementation\
    \ file must import its own interface. For example, Rectangle.m imports Rectangle.h.\
    \ Because the implementation doesn't need to repeat any of the declarations it\
    \ imports, it can safely omit:\n\n- The name of thesuperclass\n- The declarations\
    \ of instance variables\n\n## Defining a Class\n\nImporting the interface simplifies\
    \ the implementation and makes it mainly devoted to method definitions:\n\n```\n\
    #import \"ClassName\"\n@implementation ClassName\nmethod definitions\n@end\n```\n\
    \nMethods for a class are defined, like C functions, within a pair of braces.\
    \ Before the braces, they're declared in the same manner as in the interface file,\
    \ but without the semicolon. For example:\n\nMethods that take a variable number\
    \ of parameters handle them just as a function would:\n\n```\n#import <stdarg.h>\n\
    ...\n- getGroup:group, ...\\{\nva_list ap;\nva_start(ap, group);\n...\n}\n```\n\
