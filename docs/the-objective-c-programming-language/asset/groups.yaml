    \n- - makeGroup:group, ...;\n\n# 类接口\n\n## 导入到接口\n\n接口文件必须包含在任何依赖该类接口的源模块中——这包括任何创建该类实例、向类发送消息以调用为类声明的方法、或提到类中声明的实例变量的模块。接口通常通过\
