    \ The designated initializer is the method in each class that guarantees instance\
    \ variables are initialized (by sending a message to super to perform an inherited\
    \ method). It's also the method that does most of the work, and the one that other\
    \ initialization methods in the same class invoke. It's a Cocoa convention that\
    \ the designated initializer is always the method that has the most parameters,\
    \ but the freedom to determine the character of a new instance (usually this is\
    \ the one with the most parameters, but not always).\n\nIt's important to know\
    \ the designated initializer when defining a subclass. For example, class C, subclass\
