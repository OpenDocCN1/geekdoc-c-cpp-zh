  - "[PAGE 101]\n\n# CHAPTER 10\n\n# Selectors\n\nIt's relatively easy to avoid this\
    \ error when the message selector is constant and the class of the receiving object\
    \ is known. As you write your programs, you can make sure that the receiver is\
    \ able to respond. If the receiver is statically typed, the compiler performs\
    \ this test for you.\n\nHowever, if the message selector or the class of the receiver\
    \ varies, it may be necessary to postpone this test until runtime. The respondsToSelector:\
    \ method, defined in the NSObject class, tests whether a receiver can respond\
    \ to a message. It takes the method selector as a parameter and returns whether\
    \ the receiver has access to a method matching the selector:\n\n```\nif ([object\
    \ respondsToSelector:@selector(setOrigin::)])\n    [anObject setObjectOrigin:0.0\
    \ 0.0];\nelse\n    fprintf(stderr,\"%s can't be placed\\n\",\n    [NSString stringWithClass((anObject\
    \ class)) UTF8String]);\n```\n\nThe respondsToSelector: runtime test is especially\
    \ important when you send messages to objects that you don't have control over\
    \ a variable that can set. For example, if you write code that sends a message\
    \ to an object represented by a variable that others can set, you should make\
    \ sure the receiver implements a method that can respond to the message.\n\n>\
    \ Note: An object can also arrange to have messages it receives forwarded to other\
    \ objects if it doesn't respond to them directly. In that case, from the caller's\
    \ perspective, the object appears to handle the message directly, even though\
    \ it handles the message indirectly by forwarding it to another object. See \"\
    Message Forwarding\" in Objective-C Runtime Programming Guide for more information."
  - "[PAGE 102]\n\n# Exception Handling\n\nThe Objective-C language has an exception-handling\
    \ syntax similar to that of Java and C++. By using this syntax with the Exception,\
    \ NSError, or custom classes, you can add robust error-handling to your programs.\
    \ This chapter provides a summary of exception syntax and handling; for more details,\
