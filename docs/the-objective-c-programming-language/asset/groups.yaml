    \ Properties”，见第 69 页）来更改它们。\n\n列表 1-1 说明了几种情况。\n\n- **列表 1-1** 使用点语法访问属性\n\n\
    ```\nGraphic *graphic = [[Graphic alloc init];\n\nNSColor *color = graphic.color;\n\
