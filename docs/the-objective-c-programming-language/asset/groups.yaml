    # CHAPTER 1


    Objects, Classes, and Messaging


    A class name can appear in source code wherever a type specifier is permitted
    in C—for example, as an argument to the `sizeof` operator:


    ```

    int i = sizeof(Rectangle);

    ```


    # Static Typing


    You can use a class name in place of `id` to designate an object''s type:


    Rectangle `myRectangle:`


    Because of why declaring an object type gives the compiler information about the
    kind of object it is, it''s known as **static typing**. As `id` is actually a
    pointer, objects are statically typed as pointers to a class. Objects are always
    typed by pointer. Static typing makes the pointer more explicit; `id` hides it.


    Static typing permits the compiler to do some type checking—for example, if an
    object would receive a message that it appears not able to respond to—or loosen
    some restrictions that apply to generically typed `id`. In addition, it can make
    your intentions clearer to others who read your source code; however, it doesn''t
    prevent dynamic binding or alter the dynamic of a receiver''s class at runtime.


    An object can be statically typed to its own class or to any class it inherits
    from. For example, because inheritance means a `Rectangle` object of a `Graphic`
    object (as shown in the class hierarchy in [Figure 1-1](page 24)), a `Rectangle`
    instance can be statically typed to the `Graphic` class:


    Graphic `myRectangle:`


    See [Enabling Static Behavior](page 95) for more static typing and its benefits.


    # Type Introspection


    Instances reveal their types at runtime. The `isMemberOf:` method, defined in
    the `NSObject` class, checks whether the receiver is an instance of a particular
    class:


    ```

    if ([anObject isMemberOf:someClass])

    ```


    The `isKindOf:` method, also defined in the `NSObject` class, checks more generally
    whether the receiver inherits from or is a member of a particular class (whether
    it has the class in its inheritance path):


    ```

    if ([anObject isKindOf:someClass])

    ```


    The set of classes for which `isKindOf:` returns `YES` is the same set to which
    the receiver can be statically typed.


    Introspection is limited to type information. Later sections of this chapter discuss
    methods that return the class object, whether an object can respond to a message,
    and provide other information.


    See `NSClass Reference` for more on `isKindOf:`, `isMemberOfClass:`, and related
    methods.


