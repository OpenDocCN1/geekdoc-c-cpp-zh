    ## Core Foundation


    As noted in "Property Declaration Attributes" (page 70), prior to Mac OS X v10.6
    you cannot specify the retain for non-object types. If, therefore, you declare
    a whose type is a CFType and the synthesizer synthesizes the attributes as illustrated
    in the following example:


    ```

    @interface MyClass : NSObject

    CGImageRef myImage;


    @property(readwrite) CGImageRef myImage;

    @end


    @implementation MyClass

    @synthesize myImage;

    @end

    ```


    then in a reference-counted environment, the synthesized setter simply assigns
    the new value to the instance variable (the new value is not retained and the
    old value is not released). Simple assignment is typically incorrect for Core
    Foundation objects; you should not synthesize the methods but rather implement
    yourself.


    In a garbage collected environment, if the image variable is declared __strong:


    ```

    ...

    __strong CGImageRef myImage;

    @property CGImageRef myImage;

    ```


    then the accessors are synthesized appropriately—the image in this example is
    not retained by CFRetain, but the synthesized setter method triggers a writer
    barrier.


    ## Example: Declaring Properties and Synthesizing Accessors


    The example in Listing 5-4 illustrates the use of properties in different ways:


    - The Link protocol declares a property, next.

    - MyClass adopts the link protocol, so it implicitly declares the next.MyClass
    also declares other properties.

    - creationTimestamp and next are synthesized but using instance variables with
    different names.

    - name is synthesized and uses instance synthesis (recall that instance variable
    synthesis is not supported using the legacy—see "Property Implementation Directives"
    (page 73) and "Runtime Difference" (page 80)).

    - gratuitFloat has a dynamic directive—it is supported using direct method; it
    is the default value; it is supported by a direct method implementation (since
    it is read-only, it requires only a getter) with a specified name (nameAndAgeString).


