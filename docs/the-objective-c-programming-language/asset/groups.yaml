  mdcn: "\n\n# 方法与选择器\n\n编译后的选择器（selectors）标识的是名称，而不是方法的实现。例如，一个类的 `display` 方法与其他类中定义的\
    \ `display` 方法具有相同的选择器。这对于多态和动态绑定至关重要；它允许你向属于不同类的接收者发送消息。如果每个方法实现都对应一个选择器，那么消息将与函数类有所不同。\n\
    \n同名的类方法和实例方法被分配相同的选择器。然而，由于它们属于不同的领域，两者之间不会产生混淆。一个类可以在定义 `display` 实例方法的同时，再定义一个\
    \ `display` 类方法。\n\n# 方法返回值与参数类型\n\n消息传递例程仅通过选择器访问方法实现，因此它对具有相同选择器的方法一视为同仁。它从选择器中发现方法的返回类型及其参数的数据类型。然而，除了发送给强类型接收者的消息外，动态绑定要求所有同名方法的实现必须具有相同的返回类型和相同的参数类型（静态类型接收者是这一规则的例外，因为编译器可以从类类型中获取有关方法实现的信息）。\n\
    \n尽管同名的类方法和实例方法由同一个选择器表示，但它们可以具有不同的参数类型和返回类型。\n\n# 在运行时更改消息\n\n在 `NSObject` 协议中定义的\
    \ `performSelector:performSelector:withObject:` 和 `performSelector:withObject:with`\
    \ 方法将 `SEL` 作为它们的初始参数。这三个方法都直接映射到消息传递函数。对于：\n\n```\n[friend performSelector:@selector(gossipAbout:)\n\
    withObject:aNeighbor];\n```\n\n等于：\n\n```\n[friend gossipAbout:aNeighbor];\n```\n\
    \n这些方法使得在运行时更改消息成为，就像更改接收消息的对象一样。变量名可以用消息表达式的两个部分：\n\n```\nid helper = getTheReceiver();\n\
    SEL request = getSelector();\n[helper performSelector:request];\n```\n\n在这个示例中，接收者（helper）是在运行时选择的（通过虚构的\
    \ `getReceiver` 函数），而要求接收者执行的方法（request）也是在运行时确定的（通过同样虚构的 `getSelector` 函数）。\n\
    \n# 第 10 章 选择器\n\n## 选择器\n\n> 注意：`performSelector:` 及其同类方法返回 `id` 类型的对象。如果执行的方法返回不同的类型，则应将其转换为适当类型。（然而，强制转换并不适用于所有类型；该方法应返回指针或与指针兼容的类型。）\n\
    \n# 目标-动作设计模式\n\nAppKit 在处理用户界面控件时，很好地利用了在向应用程序发送指令时更改指令的能力。大多数消息在运行时。\n\n`NSControl`\
    \ 对象是可用于向应用程序发送指令的图形设备。大多数设备类似于现实世界的控制设备，如按钮、开关、旋钮、文本字段、拨盘、菜单项和文本。在软件中，这些设备介于应用程序和用户之间。它们解释来自键盘等硬件设备的事件，并将其翻译为特定于应用程序指令。例如，一个标记为“查找”的按钮会将鼠标点击转换为让应用程序开始搜索的指令。\n\
    \nAppKit 定义了创建控制设备的模板，并定义了一些现成的设备。例如，`NSButton` 定义了一个可以赋值给 `NS` 实例并用大小、标签、字体和键盘快捷键初始的对象。当用户点击按钮（或使用快捷键）时，`NSButton`\
    \ 发送消息指示应用程序执行某些操作。为了做到，`NSButton` 对象不仅要用图像、大小和标签初始化，还要用要发送的消息以及发送给谁来初始化。相应的，`NSButton`\
    \ 是为了动作消息（它在消息中选择的方法）和一个目标（应该接收消息的对象）而初始化的。\n\n```\n[myButton action:@selector(theReap:)]\n\
    [myButton target:anObject];\n```\n\n当用户点击相应的按钮时，该按钮使用 `NSObject` 协议方法 `performSelector:with:`\
    \ 发送消息。所有消息都接受一个参数，即发送消息的控制器的 `id`。\n\n如果 Objective-C 不允许更改消息，所有 `NS` 对象都必须发送相同的消息；消息的名称将冻结在\
    \ `NSButtoncell` 的代码中。与其为所有控件实现一种与用户交互的机制，按钮和其他控件将必须包含消息的内容。受限的消息传递将使任何对象难以响应多个一个按钮。要么是为每个按钮设置一个目标，要么目标对象必须发现消息源于哪个按钮并据此做出反应。每当你重新排列用户界面时，你都必须重新实现响应动作消息的方法。动态消息的缺失将产生一个\
    \ Objective-C 乐意规避的非必要复杂性。\n\n# 避免消息错误\n\n如果对象接收到执行一个不在其范围内的消息，则会导致错误。这与调用不存在的函数错误相同。但由于消息传递发生在运行时，错误通常在程序执行时才显现出来。\n\
    \n# 第 10 章 选择器\n\n## 选择器\n\n当消息选择器是常量且接收对象的类是已知时，避免这种错误是相对的。在编写程序时，你可以确保接收者能够响应。如果接收者是静态类型类型，编译器会替你执行此测试。\n\
    \n然而，如果消息选择器或接收者的类发生变化，则可能需要将此测试推到运行时。在 `NSObject` 类中定义的 `respondsToSelector:`\
    \ 方法测试接收者是否能响应某个消息。它将方法选择器作为参数，并返回接收者是否有权访问与选择器匹配的方法：\n\n```\nif ([object respondsToSelector:@selector(setOrigin:])\n\
    \    [anObject setObjectOrigin:0.0 0.0];\nelse\n    fprintf(stderr,\"%s can't\
    \ be placed\\n\",\n    [NSString stringWithClass((anObject class)) UTF8String]);\n\
    ```\n\n当你向你无法控制其设置变量的表示的对象发送消息时，`respondsToSelector:` 运行时测试尤为重要。例如，如果你编写代码向由他人可以设置的变量表示的对象发送消息，你应该确保接收者实现了一个可以响应该消息的方法。\n\
    \n> 注意：如果一个对象不直接响应它收到的消息，也可以安排将其收到的消息转发给其他对象。在这种情况下，从调用者的角度来看，该对象似乎直接处理了消息，尽管它是通过将消息转发给另一个对象来间接处理的。更多信息请参阅《Objective-C\
    \ 运行时编程指南》中的“消息转发”。\n\n# 异常处理\n\nObjective-C 语言具有与 Java 和 C++ 类似的异常处理语法。通过结合 `Exception`、`NSError`\
    \ 或自定义类使用这种语法，你可以为程序添加健壮的错误处理。本章提供了异常语法和处理的总结；更多细节请参阅“异常主题”。\n\n# 启用异常处理\n\n使用\
    \ GNU编译器 (GCC) 3.3 及以后版本，Objective-C 提供了语言级的异常处理支持。要开启这些功能，请使用 GNU编译器 (GCC) 3.3\
    \ 及以后版本的 `-fobjc-exceptions` 开关。（注意这使得应用程序可以在 Mac OS X10.3 及更高版本上运行，早期版本的软件不存在异常处理和同步支持。）\n\
    \n# 异常处理\n\n异常是一种中断正常执行流的特殊情况。有多种原因产生异常（异常通常被称为引发或抛出），来自硬件或软件。示例包括算术错误（如除零）、下溢出、调用未定义的指令（例如尝试调用未实现的方法）以及访问越界集合。\n\
    \nObjective-C 异常使用四个控制器：@try、@catch、@throw 和 @finally：\n\n- 可能抛出异常的代码被封装在 @try\
    \ 块中。\n- @catch 块包含对 @try 块中抛出的异常的处理逻辑。你可以针对不同类型的异常设置多个 @catch 块。代码示例请参见“捕获不同类型的异常”（104页）。\n\
    - 你使用 @throw 来抛出异常，异常本质上是一个 Objective-C 对象。你通常使用 `NSException` 对象，但不是要求的。\n- @finally\
    \ 块包含无论是否抛出异常都必须执行的代码。\n\n此示例描述了一个简单的异常处理算法：\n\n```\nCup cup = [[Cup alloc] init];\n\
    @try {\n  [cup fill];\n}\n```\n\n"
