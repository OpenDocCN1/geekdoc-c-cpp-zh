    # Introduction


    The Objective-C language is a computer language designed to enable sophisticated
    object-oriented programming. Objective-C is defined as a small but powerful set
    of extensions to the standard ANSI C language. Its additions to C are mostly based
    on Smalltalk, one of the first object-oriented programming languages. Objective-C
    is designed to give C full object-oriented programming capabilities, and to do
    so in a simple and straightforward way.


    Most object-oriented development environments consist of several parts:


    +   * An object-oriented programming language

    * A library of objects

    * A suite of development tools

    * A runtime environment


    This document is the first component of the development environment—the programming
    language. It fully describes the version of the Objective-C language released
    in Mac OS X10.6 and iOS 4.0. This document also provides a foundation for learning
    about the second component, the Objective-C application frameworks—collectively
    known as Cocoa. The runtime environment is described in a separate document, Objective-C
    Runtime Programming Guide.


    # Who Should Read This Document


    The document is intended for readers who may be interested in:


    +   * Programming in Objective-C

    * Finding out about the basis for the Cocoa application frameworks


    This document introduces both the object-oriented model that Objective-C is based
    upon and fully documents the language. It concentrates on the Objective-C extensions
    to C, not on the C language itself.


    Because this isn''t a document about C, it assumes some acquaintance with that
    language. Object-oriented programming in Objective-C is, however, sufficiently
    different from procedural programming in ANSI C that you won''t be hampered if
    you''re not an experienced C programmer.


    # Organization of This Document


    The following chapters cover all the features Objective-C adds to standard.'
- md: "\n# INTRODUCTION\n\nIntroduction\n\n- \"Objects, Classes, and Messaging\" (page\
    \ 13)\n- \"Defining a Class\" (page 35)\n- \"Allocating and Initializing Objects\"\
    \ (page 49)\n- \"Protocols\" (page 59)\n- \"Declared Properties\" (page 69)\n\
    - \"Categories and Extensions\" (page 81)\n- \"Associative References\" (page\
    \ 87)\n- \"Fast Enumeration\" (page 91)\n- \"Enabling Static Behavior\" (page\
    \ 95)\n- \"Selectors\" (page 99)\n- \"Exception Handling\" (page 103)\n- \"Threading\"\
    \ (page 107)\n\nA glossary at the end of this document provides definitions of\
    \ terms specific to Objective-C and object-oriented programming.\n\n## Conventions\n\
    \nThis document makes special use of computer voice and italic fonts. Computer\
    \ voice denotes words or characters that are to be taken literally (typed as they\
    \ appear). Italic fonts denotes what representing something else or can be varied.\
    \ For example, the syntax:\n\n```\n@interface ClassName CategoryName ()\n```\n\
    \nmeans that @interface and the two parentheses are required, but that you can\
    \ choose the class name and category name.\n\nWhere code is shown, ellipsis points\
    \ indicates the parts, often substantial parts, that have been omitted:\n\n```\n\
    (void)encodeWithCoder:(NSCoder *)coder\n{\n    [super encodeWithCoder:coder];\n\
    \    ...\n}\n```\n\n## See Also\n\nIf you have never used object-oriented programming\
    \ to create applications, you should read Object-Oriented Programming with Objective-C.\
    \ You should also consider reading it if you have used other object-oriented development\
    \ environments as C++ and Java because they have many expectations and conventions\
    \ different from those of Objective-C. Object-Oriented Programming with Objective-C\
    \ is designed to help you become familiar with object-oriented development from\
    \ the perspective of an Objective-C developer. It spells out some of the implications\
    \ of object-oriented design and gives you a flavor of what writing an object-oriented\
    \ program is really like.\n\n## The Runtime System\n\nObjective-C Runtime Programming\
    \ Guide describes the aspects of the Objective-C runtime and how you can use it.\n\
    \nObjective-C Runtime Reference describes the data structures and functions of\
    \ the Objective-C runtime support library. Your programs can use these interfaces\
    \ to interact with the Objective-C runtime system. For example, you can add classes\
    \ or methods, or obtain a list of all class definitions for loaded classes.\n\n\
    ## Memory Management\n\nObjective-C supports two mechanisms for memory management:\
    \ automatic garbage collection and reference counting:\n\n- *Garbage Collection\
    \ Programming Guide* describes the garbage collection system used in Mac OS X\
    \ (Not available for iOS—you cannot access this document through the iOS Dev Center).\n\
    - *Memory Management Programming Guide* describes the reference counting system\
    \ used in iOS and Mac OS X.\n\n## Objects, Classes, and Messaging\n\nThis chapter\
    \ describes the fundamentals of objects, classes, and messaging as used and implemented\
    \ by the Objective-C language. It also introduces the Objective-C runtime.\n\n\
    ## The Runtime System\n\nThe Objective-C language defers as many decisions as\
    \ it can from compile time and link time to runtime. Whenever possible, it dynamically\
    \ performs operations such as creating objects and determining what method to\
    \ invoke. Therefore, the language requires not just a compiler, but also a runtime\
    \ to execute the compiled code. The runtime system acts as a kind of operating\
    \ system for the Objective-C language; it's what makes the language work. Typically,\
    \ however, you do need to interact with the runtime directly. To understand more\
    \ about the functionality it offers, though, see Objective-C Runtime Programming\
    \ Guide.\n\n## Objects\n\nAs the names imply, object-oriented programs are built\
    \ around objects. An object associates with the particular operations that can\
    \ use or affect that data. Objective-C provides a data type to identify an object\
    \ variable without specifying a particular class of the object.\n\n## Object Basics\n\
    \nAn object associates with the particular operations that can use or affect that\
    \ data. In Objective-C, these operations are known as the object's methods; the\
    \ data they affect are instance variables (in environments they may be referred\
    \ to as iv or member variables). In essence, an object bundles a data structure\
    \ (instance variables) and a group of procedures into a self-contained programming\
    \ unit.\n\nIn Objective-C, an object's instance variables are internal to the\
    \ object; generally, you get access to them only through the object's methods\
    \ (you can specify which subclasses or other objects can access instance variables\
    \ directly by using scope selectors, see \"The Scope of Instance Variables\" (page\
    \ 40)). For others to find out anything about an object, there has to be a method\
    \ to supply the information. For example, a rectangle would reveal its size and\
    \ position.\n\nMoreover, an object sees only the methods that were designed for\
    \ it; it can not mistakenly perform methods intended for other types of objects.\
    \ Just as a C function protects its local variables, hiding them from the rest\
