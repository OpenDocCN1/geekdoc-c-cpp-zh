  - "[PAGE 86]\n\n# Associative References\n\nUse associative references to simulate\
    \ the addition of object instance variables to an existing class.\nAssociative\
    \ references are available only in iOS and Mac OS X v10.6 and later.\n\n# Adding\
    \ Storage Outside a Class Definition\n\nUsing associative references, you can\
    \ add storage to an object without modifying the class declaration. This may be\
    \ useful if you do not have access to the source code for the class, or if binary-compatibility\
    \ reasons you cannot alter the layout of the object.\n\nAssociations are based\
    \ on a key, so for any object you can add as many associations as you want, each\
    \ using a different key. An association can also ensure that the object remains\
    \ valid for at least the lifetime of the source object (without the possibility\
    \ of introducing unretained cycles in a garbage-collected environment).\n\n# Creating\
    \ Associations\n\nYou use the Objective-C runtime function objc_setAssociatedObject\
    \ to make an association between one object and another. The function takes four\
    \ parameters: the source object, a key, the value, and an association policy.\
    \ Of these, the key and the association policy merit further discussion.\n\n+\
    \   - The key is a void pointer. For each association must be unique. A typical\
    \ pattern is to use a static variable.\n- The policy specifies whether the object\
    \ is assigned, retained, or copied, and whether the association be made atomically\
    \ or non-atomically. This pattern is similar to that of the attributes of a declared\
    \ property (\"Property Declaration Attributes\" (page 70)). You specify the policy\
    \ for the relationship using a constant (objc_AssociationPolicy and Associative\
    \ Object Behaviors).\n\nListing 7-1 shows how you can establish an association\
    \ between an array and a string.\n\nListing 7-1 Establishing an association between\
    \ an array and a string\n\n```\nNSArray *array = =\n[[NSArray alloc] initWithObjects:@One,\
    \ @Two, @Three, nil];\n// For the purposes of illustration, use initWithFormat:\
    \ \n// the string can be deallocated\nNSString *overview =\n[[NSString alloc]\
    \ initWithFormat:@\"%\", @First three numbers];\n```"
- md: "\n# CHAPTER 7\n\nAssociative References\n\n```objc\nobjc_setAssociatedObject\
    \ (\n    array,\n    &overviewKey,\n    overview,\n    OBJC_ASSOCIATION_RETAIN\n\
    );\n\n[overview release];\n// (1) overview valid\n[array release];\n// (2) overview\
    \ invalid\n```\n\nAt point 1, string overview is still valid because the OBJC_ASSOCIATION_RETAIN\
    \ policy specifies that the array retains the associated object. When the array\
    \ deallocated, however (at point 2), overview is released and so this case also\
    \ deallocates. If you try to, for example, log the value of overview, you generate\
    \ a runtime exception.\n\n# Retrieving Associated Objects\n\nYou retrieved an\
    \ associated object using the Objective-C runtime objc_getAssociatedObject. Continuing\
    \ the example in Listing 7-1 (page 87), you could retrieve the overview from the\
    \ array using the following line of code:\n\n```objc\nNSString *associatedObject\
    \ = (NSString*)objc_getAssociatedObject(array,&overviewKey);\n```\n\n# Breaking\
    \ Associations\n\nTo break an association, you typically call objc_setAssociatedObject,\
    \ nil as the value.\nContinuing the example in Listing 7-1 (page 87), you could\
    \ break the association between the array and the string overview&overviewKey.\n\
    \n```objc\nobjc_setAssociatedObject(array,&overviewKey,nil,OBJC_ASSOCIATION_ASSIGN);\n\
    ```\n\nGiven that the association is set to nil, the policy isn't actually important.\n\
    \nTo break all associations for an object, you can call objc_removeAssociatedObjects.\
    \ In general, however, you are discouraged from using this function because it\
    \ breaks all associations for all clients. Use this function only if you need\
    \ to restore an object to a \"pristine condition\".\n\n# Complete Example\n\n\
    The following program combines code from the preceding sections.\n\n```objc\n\
    #import <Foundation.h>\n#import <objc/runtime.h>\n```\n\n```objc\nint main (int\
    \ argc, const char * argv[]) {\n    NSAutleasePool *pool = [[NSAutleasePool alloc]\
    \ init];\n\n    static char overviewKey;\n    NSArray *array = [[NSArray alloc]\n\
    \        initWithObjects:@\"One\", @\"Two\", @\"Three\", nil];\n    // For the\
    \ purposes of illustration, use initWithFormat: to ensure\n    // we get a deallocable\
    \ string\n    NSString *overview = [[NSString alloc]\n        initWithFormat:@\"\
    @\", @\"First three numbers\"];\n\n    objc_setAssociatedObject(\n        array,\n\
    \        &overviewKey,\n        overview,\n        OBJC_ASSOCIATION_RETAIN\n \
    \   );\n    [overview release];\n\n    NSString *associatedObject =\n        (NSString\
    \ *)objc_getAssociatedObject(array, &overviewKey);\n    NSLog(@\"associatedObject:\
    \ %@\", associatedObject);\n\n    objc_setAssociatedObject(\n        array,\n\
    \        &overviewKey,\n        nil,\n        OBJC_ASSOCIATION_ASSIGN\n    );\n\
    \n    [array release];\n\n    [pool drain];\n    return 0;\n}\n```\n\nComplete\
    \ Example\n2010-12-08 | © 2010 Apple Inc. All Rights Reserved.\n\n# Fast Enumeration\n\
    \nFast enumeration is a language feature that allows you to efficiently and safely\
    \ enumerate over the contents of a collection using a concise syntax.\n\n# The\
    \ for...in Syntax\n\nThe syntax for fast enumeration is defined as follows:\n\n\
    ```objc\nfor ( Type newVariable in expression ) ( statements )\n```\n\nor\n\n\
    ```objc\nfor ( existingItem in expression ) ( statements )\n```\n\nIn cases, expression\
    \ yields an object that conforms to the NSEnumeration protocol (see \"Adopting\
    \ Fast Enumeration\" (page 91)). The iterating variable is set to each item in\
    \ the returned object in turn, and the code defined by statements is set to nil\
    \ when the loop ends by exhausting the source pool of objects. If the loop is\
    \ terminated early, the iterating variable is left pointing to the last item.\n\
    \nThere are several advantages to using fast enumeration:\n\n- The enumeration\
    \ is considerably more efficient than, for example, using NSEnumerator directly.\n\
    - The syntax is concise.\n- Enumeration is \"safe\"—the enumerator has a mutation\
    \ guard that so if you attempt to modify the collection during iteration, an exception\
    \ is raised.\n\nBecause mutation of the object during iteration is forbidden,\
    \ you can perform multiple enumerations concurrently.\n\n# Adopting Fast Enumeration\n\
    \nAny class that provides access to a collection of other objects can adopt the\
    \ NSEnumeration protocol. The collection classes in the Foundation framework—NSArray,\
    \ NSDictionary, and NSSet—adopt this protocol, using NSEnumerator. It should be\
    \ obvious that in the cases of NSArray and NSSet the enumeration is over their\
    \ contents. For others, the corresponding documentation should make clear what\
    \ property is iterated—for example, NSDictionary and the Core Data class NSManagedObjectModel\
    \ support for fast enumeration; NSDictionary enumerates its keys, and NSManagedObjectModel\
    \ enumerates its entities.\n\n# Fast Enumeration\n\nThe following code example\
    \ illustrates fast enumeration with NSArray and NSDictionary.\n\n```objc\nNSArray\
    \ *array = [NSArray arrayWithObjects:\n@\"One\", @\"Two\", @\"Three\", @\"Four\"\
    , nil];\n\nfor (NSString *element in array) {\n    NSLog(\"element: %@\", element);\n\
    }\n\nNSDictionary *dictionary = [NSDictionary dictionaryWithObjectsAndKeys:\n\
    @\"quattor\", @\"four\", @\"quinque\", @\"five\", @\"sex\", @\"six\", nil];\n\n\
    NSString *key;\nfor (key in dictionary) {\n    NSLog(\"English: %@, Latin: %@\"\
    , key, [dictionary objectForKey:key]);\n}\n```\n\nYou can also use NSArray objects\
    \ with fast enumeration, as illustrated in this example:\n\nFor collections or\
    \ enumerators that have a well-defined order—such as an NSArray or an NSEnumerator\
    \ instance proceeds in that order, so simply counting iterations gives you the\
    \ index inside the collection if you need it.\n\n```objc\nNSArray *array = /*\
    \ assume this exists */\nNSUInteger index = 0;\n\nfor (id element in array) {\n\
    \    NSLog(\"Element at index %u: %@\", index, element);\n    index++;\n}\n```\n\
    \nIn other respects, the feature behaves like a standard loop. You can use break\
    \ to interrupt the iteration; and if you want to skip elements, you can use a\
    \ nested conditional statement:\n\n```objc\nNSArray *array = /* assume this exists\
    \ */\n\nfor (id element in array) {\n    if (/* some test element */) {\n    \
    \    // statements that apply only to elements passing test\n    }\n}\n```\n\n\
    If you want to skip the first element and then process no more than five further\
