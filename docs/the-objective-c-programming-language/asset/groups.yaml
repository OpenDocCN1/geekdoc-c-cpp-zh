    # 术语表


    **抽象类 (abstract class)** 一种仅为了其他类继承自它而定义的类。程序不使用抽象类的实例；它们只使用其子类的实例。


    **抽象父类 (abstract superclass)** 与抽象类相同。


    **类方法 (class method)** 在 Objective-C 语言中，一种可以对类对象而非类实例操作的方法。


    **采纳 (adopt)** 指未知类类型的对象，如果一个类声明它实现了协议中的所有方法，则称该类采纳了该协议。通过在类或分类（category）声明中使用括号列出协议名称来采纳协议。


    **类对象 (class object)** 在 Objective-C 语言中，代表类并知道如何创建其实例的对象。类对象由编译器创建，但在其他情况下表现得像实例变量，并且像所有其他对象一样。作为消息表达式中的接收者时，类对象由类名表示。


    **匿名对象 (anonymous object)** 一个未知类类型的对象。其接口是通过协议声明实现的。


    **Cocoa** 一种用于 Mac OS 的面向对象开发平台。Cocoa 是一系列框架，其主要的编程接口是 Objective-C 的。


    **AppKit** 有时被称为 *应用程序工具包 (Application Kit)* 框架，用于实现用户界面。AppKit 为在屏幕上绘图并响应事件的应用程序提供了基本的程序结构。


    **编译时 (compile time)** 代码被编译的时间。在编译时做出的决策受源文件中包含的内容和信息的限制。


    **异步消息 (asynchronous message)** 一种立即返回的消息，无需等待消息的响应。发送应用程序和接收应用程序独立运行，彼此不同步。


    **遵循 (conform)** 在 Objective-C 语言中，如果一个类（或其子类）实现了协议中声明的方法，则称该类遵循该协议。如果一个实例的类遵循协议，则该实例也遵循该协议。因此，遵循协议的实例可以执行协议中声明的任何实例方法。


    **分类 (category)** 在 Objective-C 语言中，一组与类定义的其他部分分离的方法定义。分类用于将一个类拆分为若干部分，或向现有类添加方法。


    **代理 (delegate)** 代表另一个对象执行操作的对象。


    **类 (class)** 在 Objective-C 语言中，特定类型对象的原型。类定义声明了实例变量，并为类的所有成员定义了方法。


    **指定初始化 (designated initializer)** 负责初始化类新实例的 *init...* 方法。每个类都定义或继承了它的指定初始化器。通过向
    *self* 发送消息，同一类中的其他 *init...* 方法直接或间接地调用该指定初始化器；指定初始化器通过向 `super` 发送消息调用其父类的指定初始化器。


    **id** 在 Objective-C 语言中，不分类别的任何对象的通用类型。`id` 被定义为指向对象数据结构的指针。它可以同时用于类和类的实例。


    **分发表 (dispatch table)** Objective-C 运行时表包含条目，将选择器（selectors）与它们识别的方法的类特定地址关联起来。


    **实现 (implementation)** Objective-C 规范中定义公有方法（在类接口中声明）以及私有方法（未在类接口中声明）的部分。


    **分布式对象 (distributed objects)** 一种促进不同地址空间中的对象进行通信的架构。


    **非正式协议 (informal protocol)** 在 Objective-C 语言中，声明为分类的协议是 NSObject 类的一个分类。语言对协议提供显式支持，但不支持非正式的协议。


    **动态分配 (dynamic allocation)** 一种用于基于 C 语言的技术，操作系统在运行程序需要时提供内存，而不是在启动时提供。


    **继承 (Inheritance)** 在面向对象编程中，子类继承其特性（方法和实例变量）到其子类中的能力。


    **继承层次结构 (inheritance hierarchy)** 在面向对象编程中，通过子类和类的排列定义的类层级结构。每个类（除 NSObject 等根类外）都有一个父类，并可能有无限数量的子类。通过其子类，类继承自其层次结构上方的内容。


    **动态绑定 (dynamic binding)** 在运行时对消息绑定——即在运行时查找用于响应消息的方法实现，而不是在编译时。


    **动态类型 (dynamic typing)** 在运行时发现对象的类，而不是在编译时。


    **实例 (instance)** 在 Objective-C 语言中，属于特定类（是该类的成员）的对象。实例在运行时使用类定义中的规范进行创建。


    **封装 (encapsulation)** 一种编程技术，通过抽象接口向用户隐藏操作的实现。它允许在不影响对象用户的情况下更新或更改实现。


    **实例方法 (instance method)** 在 Objective-C 语言中，任何可以由类的实例而非类本身调用的方法。


    **事件 (event)** 对外部活动的直接或间接报告，特别是键盘和鼠标上的用户活动。


    **实例变量 (instance variable)** 在 Objective-C 语言中，一种由类执行的变量。


    **工厂 (factory)** 与对象相同，类可以发送消息的对象。


    **方法 (method)** 与对象相同。在 Objective-C 语言中，一个方法。


    **接口 (interface)** Objective-C 规范中定义公有方法（在类接口中声明）以及私有方法（未在类接口中声明）的部分。


    **正式协议 (formal protocol)** Objective-C 语言中，作为分类声明的一组不属于任何类的方法声明。每个类都可以遵循其声明的协议。类也可以遵循*正式协议*、*非正式协议*。


    **接收者 (receiver)** 在面向对象编程中，接收消息的对象。


    **引用计数 (reference counting)** 一种内存管理技术，每个声称拥有对象的实体增加其引用计数，释放时减少。当对象的计数归零时，它会被释放。这种技术允许在对象之间安全地共享一个实例。


    **远程消息 (remote message)** 从一个应用程序发送到另一个应用程序中对象的消息。


    **远程对象 (remote object)** 另一个应用程序中的对象，是远程消息的潜在接收者。


    **运行时 (runtime)** 程序启动后运行期间的时间。在运行时做出的决策可以受所选的影响。


    **选择器 (selector)** 在 Objective-C 语言中，在向对象发送消息时的方法名称，或者在源代码编译时替换名称的标识符。*SEL*。


    **静态 (static)** 在 Objective-C 语言中，通过将其类型为指向类的指针为编译器提供对象实例类型的信息。


    **子类 (subclass)** 在 Objective-C 语言中，继承层次结构中位于另一个下方的类。有时泛指任何继承自另一个类的类。也可以作为动词使用，指定义另一个类的子类的过程。


    **父类 (superclass)** 在 Objective-C 语言中，继承层次结构中位于上方的类；子类从中继承方法和实例变量的类。


    '
