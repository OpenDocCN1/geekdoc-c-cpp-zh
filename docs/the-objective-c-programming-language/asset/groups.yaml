  - "[PAGE 49]\n\n# CHAPTER 3\nAllocating Objects\n\nIn some cases, this responsibility\
    \ can mean returning a different object from the receiver. For example, if a class\
    \ needs a list of objects, it might provide an `initWithName:` method to initialize\
    \ new instances. If there can be no than one object per name, `initWithName:`\
    \ might refuse to assign the same name to a new instance, and asked is already\
    \ being used by another object, it may free the newly allocated instance and return\
    \ the other object—thus ensuring the uniqueness of the name while at the same\
    \ time providing what was asked for, in an instance.\n\nIn a few cases, it might\
    \ be impossible for an `init...` method to do what it's asked to do. For example,\
    \ `initFromFile:` method might get the data from a file passed as an argument.\
    \ If the filename passed doesn't correspond to an actual file, it will fail to\
    \ complete the initialization. In such a case, the `init...` method could free\
    \ the receiver and return `nil`, indicating that the requested object cannot be\
    \ created.\n\nBecause an `init` method might return other than the newly allocated\
    \ object, or even return `nil`, it is important that programs use the value returned\
    \ by the initialization method, not just that of `alloc` or `allocWithName`. The\
    \ following code is very dangerous, since it ignores the return of `init`.\n\n\
    ```\nid addObject = [[SomeClass alloc];\n[anObject init];\n[anObject someOtherMessage];\n\
    ```\n\nTo initialize an object, you should combine allocation and initialization\
    \ messages in one line\n\n```\nid addObject = [[SomeClass alloc] init];\n[anObject\
    \ someOtherMessage];\n```\n\nIf there's a case the `init...` method might return\
    \ `nil` (see \"Handling Initialization Failure\" (page 52)), then you should check\
    \ the return value before proceeding:\n\n```\nid addObject = [[SomeClass alloc]\
    \ init];\nif (anObject)\n    [anObject someOtherMessage];\nelse\n```\n\n# Implementing\
    \ an Initializer\n\nWhen an object is created, all bits of memory (except for\
    \ `isa`)—and the values for all instance variables—are set to 0. In some situations,\
    \ this may be all you require when an object is initialized; in many cases, you\
    \ want to provide default values for an object's instance variables, or you want\
    \ to pass values as parameters to the initializer. In these other cases, you need\
    \ to write a custom initializer. In Objective-C, custom initializers are subject\
    \ to more constraints and conventions than are most other methods.\n\n# Constraints\
    \ and Conventions\n\nThere are several constraints and conventions that apply\
    \ to initializer methods that do not apply to other methods:\n\n+   * By convention,\
    \ the name of a custom initializer method begins with `init`.\n\nImplementing\
    \ an Initializer\n2010-12-08 | © 2010 Apple Inc. All Rights Reserved."
  - "[PAGE 50]\n\n# Allocating and Initializing Objects\n\nExamples from the Foundation\
    \ framework include initWith; initWithObjects; and initWithObjectsKeys.\n\n+ \
    \  The return type of an initializer method should be id.\n\nThe return type should\
    \ be id because id gives an indication that the class is purposely not considered—that\
    \ the class is unspecified and subject to change, depending on context of invocation.\
    \ For example, NSString provides the method initWithFormat: when you send to an\
    \ instance of NSMutableString (a subclass of NSString), the message returns an\
    \ instance of NSMutableString. (See, also, the singleton example given in \"Combining\
    \ Allocation and Initialization\" (page 57)).\n\n+   In the implementation of\
    \ a custom initializer, you must invoke a designated initializer.\n\nDesignated\
    \ initializers are described in \"The Designated Initializer\" (page 55); a full\
    \ explanation of this is given in \"Coordinating Classes\" (page 53).\n\nIn brief,\
    \ if you are implementing a designated initializer, it must invoke its superclass'\
    \ designated initializer. If you are implementing any other initializer, it should\
    \ invoke its own class's designated initializer, or another of its own initializers\
    \ that ultimately invokes the designated initializer.\n\nBy default, the designated\
    \ initializer is init.\n\n+   You should assign self to the value returned by\
    \ the initializer because the initializer could return an object different from\
    \ the one returned by the receiver.\n\n+   If you set the value of an instance\
    \ variable, you typically do direct assignment rather than using an accessor method.\n\
    \nDirect assignment avoids the possibility of triggering unwanted side effects\
    \ in the accessors.\n\n+   At the end of the initializer, you must return self\
    \ unless the initializer fails, in which case you return nil.\n\nFailed initializers\
    \ are discussed in more detail in \"Handling Initialization Failure\" (page 52).\n\
    \nThe following example illustrates the implementation of a custom initializer\
    \ that inherits from NSObject and has an instance variable, creationDate, that\
    \ represents the time when the object was created:\n\n```\n(init {\n    // Assign\
    \ self to value returned by super's designated initializer\n    // Designated\
    \ initializer for NSObject is init\n    self = [super init];\n    if (self) {\n\
    \        creationDate = [[NSDate alloc] init];\n    }\n    return self;\n})\n\
    ```\n\n(The reason for using the (self) pattern is discussed in \"Handling Initialization\
    \ Failure\" (page 52).\n\n# Implementing Initializer"
  - "[PAGE 51]\n\n# CHAPTER 3\n\n# Allocating and Initializing Objects\n\nAn initializer\
    \ doesn't need to provide a parameter for each variable. For example, if a class\
    \ requires instances to have a name and a data source, it might provide an `initWith:fromURL:`\
    \ method, but set nonessential instance variables to arbitrary values or allow\
    \ them to have the null values set by default. It could rely on methods like `setEnabled:`,\
    \ `setFriend:`, and `setDimensions:` to modify default values after the initialization\
    \ phase has been completed.\n\nThe next example illustrates the implementation\
    \ of a custom initializer that takes a single parameter. In this case, it inherits\
    \ from `UIView`. It shows what you can do before invoking the superclass's designated\
    \ initializer.\n\n```\n(id)initWith:(NSImage *)image {\n// Find the size for the\
    \ new instance from the image\nNSSize size = image.size;\nNSFrame frame = NSMakeRect(0.0,\
    \ 0.0, size.width, size.height);\n\n// Assign to value returned by super's designated\
    \ initWithFrame:\nself = [super initWithFrame:frame];\nif (self) {\n    image\
    \ = [image retain];\n}\nreturn self;\n}\n```\n\nThis example doesn't show what\
    \ to do if there are any problems during initialization; how to handle such problems\
    \ is discussed in the next section.\n\n# Handling Initialization Failure\n\nIn\
    \ general, if there is a problem during an initialization method, you should call\
    \ the `release` method and return `nil`.\n\nThere are two consequences of this\
    \ policy:\n\n+   - Any object (whether your own class, a subclass, or an external\
    \ caller) that receives `nil` from an initializer method should be able to deal\
    \ with it. In the unlikely case that the caller has established any external references\
    \ to the object before, you must not add connections.\n- You must make sure that\
    \ `dealloc` methods are safe in the presence of partially initialized objects.\n\
    \n> You should call the `release` method on `self` at the point of failure. If\
    \ you get `nil` back from an invocation of the superclass initializer, you should\
    \ not also call `release`. You should clean up any references you have used that\
    \ are not dealt with in `dealloc` and return `nil`. These steps are typically\
    \ handled by the superclass of performing initialization within a block dependent\
    \ on the result value of the superclass—as seen in the following examples:\n\n\
    ```\n(id)init {\nself = [super init];\nif (self) {\n    creationDate = [[NSDate\
    \ alloc] init];\n}\nreturn self;\n```\n\nImplementing an Initializer\n2010-12-08\
    \ | © 2010 Apple Inc. All Rights Reserved."
  - "[PAGE 52]\n\n# CHAPTER 3\n\nThe following example builds on that shown in \"\
    Constraints and Conventions\" (page 50) to show how to\nhandle an inappropriate\
    \ value by the parameter:\n\n```\n(id)initWithImage:(UIImage*)anImage {\n    if\
    \ (anImage == nil) {\n        [self release];\n        return nil;\n    }\n  \
    \  // Find the size for the new instance from the image\n    NSSize size = anImage.size;\n\
    \    CGRect frame = NSMakeRect(0.0, 0.0, size.width, size.height);\n\n    // Assign\
    \ value returned by super's designated initializer\n    // Designated initializer\
    \ for UIView\n    self = [super initWithFrame:frame];\n    if (self) {\n     \
    \   image = [anImage retain];\n        return self;\n    }\n}\n```\n\nThe next\
    \ example illustrates best practice, in case of a problem, there is a possibility\
    \ of returning\nmeaningful information in the form of an NSError object by reference:\n\
    \n```\n(id)initWithURL:(NSURL*)aURL error:(NSError**)errorPtr {\n    self = [super\
    \ init];\n    if (self) {\n        NSData *data = [NSData alloc] initWithContentsOfURL:aURL\
    \ options:NSUncachedRead error:errorPtr];\n        if (data == nil) {\n      \
    \      // In this case the error object is created in the NSData initializer\n\
    \            [self release];\n            return nil;\n        }\n        // implementation\
    \ continues...\n```\n\nYou would typically not use exceptions to signify errors\
    \ of this sort—for more information, see Error Handling Programming Guide.\n\n\
    # Coordinating Classes\n\nThe init... methods class typically initialize only\
    \ those variables declared in that class. Inherited\ninstance variables are initialized\
    \ by sending a message to super to perform an initialization method defined\n\
    sewhere up in the hierarchy:\n\n```\n(id)initWithName:(NSString*)string {\n  \
    \  self = [super init];\n    if (self) {\n        name = [string copy];\n    }\n\
    ```\n\nImplementing an Initializer"
- md: "\n## CHAPTER 3\nAllocating and Initializing Objects\n\nreturn self;\n}\n\n\
    The message to super chains together initialization methods in all inherited classes.\
    \ Because it comes first, it ensures that superclass variables are initialized\
    \ before those declared in subclasses. For example, a Rectangle object must be\
    \ initialized as an NSObject, a Graphic object, and a Shape object before it's\
    \ initialized as a Rectangle object.\n\nThe connection between the initWithName:\
    \ method illustrated above and the inherited init method is illustrated in Figure\
    \ 3-1.\n\n## Figure 3-1 Incorporating an inherited initialization method\n\n![](img/6f9b7a92b4fae621991881021b9bf44a_53_0.png)\n\
    \nA class must also make sure that all inherited initialization methods work.\
    \ For example, if class A defines an init method and its subclass B defines a\
    \ initWithName: method, as shown in Figure 3-1, B must also make sure that an\
    \ init message successfully initializes B instances. The easiest way to do that\
    \ is to replace the inherited init method with a version that invokes initWithName:\n\
    \n```objc\n- (init)init {\n    return [super initWithName:@\"default\"];\n}\n\
    ```\n\nThe initWithName: method would, in turn, invoke the inherited method, as\
    \ shown earlier. Figure 3-2 includes the B version of init.\n\n## CHAPTER 3\n\
    Allocating and Initializing Objects\n\n## Figure 3-2 Covering an inherited initialization\
    \ method\n\n![](img/6f9b7a92b4fae621991881021b9bf44a_54_0.png)\n\nCovering inherited\
    \ initialization methods makes the class you define more portable to other applications.\
    \ If you leave an inherited method uncovered, someone else may use it to produce\
    \ incorrectly initialized instances of your class.\n\n## The Designated Initializer\n\
    \nIn the example given in \"Coordinating Classes\" (page 53), initWithWithName\
    \ would be the designated initializer for its class (B). The designated initializer\
    \ is the method in each class that guarantees instance variables are initialized\
    \ (by sending a message to super to perform an inherited method). It's also the\
    \ method that does most of the work, and the one that other initialization methods\
    \ in the same class invoke. It's a Cocoa convention that the designated initializer\
    \ is always the method that has the most parameters, but the freedom to determine\
    \ the character of a new instance (usually this is the one with the most parameters,\
    \ but not always).\n\nIt's important to know the designated initializer when defining\
    \ a subclass. For example, class C, subclass of B implements initWithWithName:from:method.\
    \ In addition to this, you have to make sure that the inherited init and initWithName:\
    \ methods of class B work for instances of C, which you can do by just covering\
    \ the B class's initWithName: with a version that invokes initWith:from:\n\n```objc\n\
    - (id)initWithWithName:(char *)string {\n  return [self initWithName:string:NULL];\n\
    }\n```\n\nFor an instance of class C, the inherited init method invokes initWithName:\
    \ initWithName:from:. The relationship between these methods is shown in Figure\
    \ 3-3.\n\n## Figure 3-3 Covering the designated initializer\n\n![](img/6f9b7a92b4fae621991881021b9bf44a_55_0.png)\n\
    \nThis figure omits an important detail. The initWithName:fromFile: method, being\
    \ the designated initializer for the C class, sends a message to super to invoke\
    \ an inherited initialization method. But which of B's methods would it invoke,\
    \ init or initWithName?: It can't invoke init, for two reasons:\n\n- Circularity\
    \ would result (init invokes C's initWithName:, which invokes initWithName:fromFile:,\
    \ which invokes init again).\n- It won't be able to change the initialization\
    \ code in B's version of initWithName:\n\nTherefore, initWithName:fromFile: must\
    \ invoke initWithName:\n\n```objc\n- (id)initWithWithName:(char*)string fromFile:(char*)pathname\
    \ {\n    self = [self initWithWithName:string];\n    if (self) {\n    }\n    return\
    \ self;\n}\n```\n\n> General principle: The designated initializer in a class\
    \ must, through a message to super, invoke the designated initializer in a superclass.\n\
    \nDesignated initializers are chained to each other through messages to super,\
    \ while other initialization methods are chained to designated initializers through\
    \ messages to self.\n\nFigure 3-4 shows how all the initialization methods in\
    \ classes A, B, and C are linked. Messages to self are shown on the left and messages\
    \ to super are shown on the right.\n\n## Combining Allocation and Initialization\n\
    \nAllocating and Initializing Objects\n\nIn Cocoa, some classes define creation\
    \ methods that combine the two steps of allocating and initializing to return\
    \ new, initialized instances of the class. These methods are often referred to\
    \ as convenience constructors and typically take the form + className...where\
    \ className is the name of the class. For example, NSString has the following\
    \ methods (among others):\n\n- + (id)stringWithCString:(const char *)string encoding:(NSStringEncoding)enc;\n\
    - + (id)stringWithFormat:(NSString *)format, ...;\n\nSimilarly, NSArray defines\
    \ the following class methods that combine allocation and initialization:\n\n\
    - + (id)array;\n\n## Figure 3-4 The initialization chain\n\n![](img/6f9b7a92b4fae621991881021b9bf44a_56_0.png)\n\
    \nNote that B version of init sends a message to super to initWithName: (Wait,\
    \ the text says B version of init sends a message to initWithName:)\n\n## CHAPTER\
    \ 3\nAllocating and Initializing Objects\n\n## Designated Initializer\n\n```objc\n\
    - (id)initWithWithName:(char *)string;\n  return [self initWithWithName:string:NULL];\n\
    ```\n\n> General principle: The designated initializer in a class must, through\
    \ a message to super, invoke the designated initializer in a superclass.\n"
  mdcn: "\n\n## 第 3 章\n分配与初始化对象\n\nreturn self;\n}\n\n向 super 发送的消息会将所有继承类中的初始化方法链联起来。由于它是第一个执行的，确保了父类变量在子类声明的变量之前完成初始化。例如，一个\
    \ `Rectangle` 对象在初始化为 `Rectangle` 对象之前，必须先初始化为 `NSObject`、`Graphic` 对象和 `Shape`\
    \ 对象。\n\n图 3-1 展示了上述 `initWithName:` 方法与继承自父的 `init` 方法之间的关系。\n\n## 图 3-1 结合继承的初始化方法\n\
    \n![](img/6f9b7a92b4fae621991881021b9bf44a_53_0.png)\n\n类还必须确保所有继承的初始化方法都能正常工作。例如，如果类\
    \ A 定义了一个 `init` 方法，而其子类 B 定义了 `initWithName:` 方法（如图 3-1 所示），则 B 必须确保 `init` 消息能够成功初始化\
    \ B 的实例。实现这一点的最简单方法是将继承的 `init` 方法替换为调用 `initWithName:` 的版本：\n\n```objc\n- (init)init\
    \ {\n    return [super initWithName:@\"default\"];\n}\n```\n\n相反，`initWithName:`\
    \ 方法会调用继承的方法，如前所示。图 3-2 包含了 B 版本的 `init`。\n\n## 第 3 章\n分配与初始化对象\n\n## 图 3-2 覆盖继承的初始化方法\n\
    \n![](img/6f9b7a92b4fae621991881021b9bf44a_54_0.png)\n\n覆盖继承的初始化方法可以使你定义的类在其他应用程序中更具移植性。如果你没有对继承的方法进行覆盖，其他人可能会使用它来产生初始化错误的你的类实例。\n\
    \n## 指定初始化器 (The Designated Initializer)\n\n在“协调类”（Coordinating Classes，第 53 页）提供的示例中，`initWithWithName:`\
    \ 将是其类（B）的初始化器。指定初始化器是每个类中保证实例变量已初始化的方法（通过向 super 发送消息来执行继承的方法）。它也是执行大部分工作的方法，并且同类中其他初始化方法所调用的方法。Cocoa\
    \ 的惯例是指定初始化器始终是参数最多的方法，但决定新实例特征的自由是自由的（通常是参数最多的那个，但并非总是如此）。\n\n在定义子类时，了解指定初始化器非常重要。例如，类\
    \ B 的子类 C 实现了 `initWithWithName:from:method`。此外，你必须确保类 B 继承的 `init` 和 `initWithName:`\
    \ 方法对于 C 的实例有效，你可以通过将 B 类的 `initWithName:` 覆盖为调用 `initWithWithName:from:` 的版本来实现：\n\
    \n```objc\n- (id)initWithWithName:(char *)string {\n  return [self initWithName:string:NULL];\n\
    }\n```\n\n对于类 C 的实例，继承的 `init` 方法会调用 `initWithName:`，以及 `initWithName:from:`。这些方法之间的关系如图\
    \ 3-3 所示。\n\n## 图 3-3 覆盖指定初始化器\n\n![](img/6f9b7a92b4fae621991881021b9bf44a_55_0.png)\n\
    \n此图省略了一个重要的细节。`initWithName:fromFile:` 方法作为 C 类的初始化器，会向 super 发送消息以调用继承的初始化方法。但它会调用\
    \ B 的哪一个方法，是 `init` 还是 `initWithName:`？它不能调用 `init`，原因有两个：\n\n- 会导致循环（`init` 调用\
    \ C 的 `initWithName:`，后者调用 `initWithName:fromFile:`，进而再次调用 `init`）。\n- 它无法更改 B\
    \ 版本的 `initWithName:` 中的初始化代码。\n\n因此，`initWithName:fromFile:` 必须调用 `initWithName:`：\n\
    \n```objc\n- (id)initWithWithName:(char*)string fromFile:(char*)pathname {\n \
    \   self = [self initWithWithName:string];\n    if (self) {\n    }\n    return\
    \ self;\n}\n```\n\n> 通用原则：类中的指定初始化器必须通过向 super 发送消息来调用父类中的指定初始化器。\n\n指定初始化器通过向\
    \ super 发送消息相互连接，而其他初始化方法通过向 self 发送消息连接指定初始化器。\n\n图 3-4 显示了类 A、B 和 C 中的所有初始化方法是如何关联的。向\
    \ self 发送的消息显示在左侧，向 super 发送的消息显示在右侧。\n\n## 结合分配与初始化\n\n分配与初始化对象\n\n在 Cocoa 中，某些类定义了结合分配和初始化这两个步骤的方法，以返回新的已初始化类实例。这些方法通常被称为便利构造函数（convenience\
    \ constructors），通常形式为 `+ className...`，其中 `className` 是类名。例如，`NSString` 拥有以下方法（其他还有）：\n\
    \n- + (id)stringWithCString:(const char *)string encoding:(NSStringEncoding)enc;\n\
    - + (id)stringWithFormat:(NSString *)format, ...;\n\n同样，`NSArray` 定义了以下结合分配和初始化的类方法：\n\
    \n- + (id)array;\n\n## 图 3-4 初始化链\n\n![](img/6f9b7a92b4fae621991881021b9bf44a_56_0.png)\n\
    \n注意 B 版本的 `init` 向 super 发送 `initWithName:` 消息（文中说 B 版本的 `init` 向 `initWithName:`\
    \ 发送消息）：\n\n## 第 3 章\n分配与初始化对象\n\n## 指定初始化器\n\n```objc\n- (id)initWithWithName:(char\
    \ *)string;\n  return [self initWithWithName:string:NULL];\n```\n\n> 通用原则：类中的指定初始化器必须通过向\
    \ super 发送消息来调用父类中的指定初始化器。\n\n"
