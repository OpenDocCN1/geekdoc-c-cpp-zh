  - "[PAGE 59]\n\n# Methods for Others to Implement\n\nIf you know the class of an\
    \ object, you can look at its interface declaration (and the interface declarations\
    \ of the classes it inherits from) to find what messages it responds to. These\
    \ declarations advertise the messages it can receive. Protocols provide a way\
    \ for it to also advertise the messages it sends.\n\nCommunication works both\
    \ ways: an object sends messages and can receive them. For example, an object\
    \ might delegate responsibility for a certain operation to another object, or\
    \ on occasion simply need to ask another object for information. In some cases,\
    \ an object might wishing to notify other objects of its actions so they can take\
    \ whatever collateral measures might be required.\n\nIf you develop the class\
    \ of the sender and the class of the receiver as part of the same project (or\
    \ if someone has supplied you with the receiver and its interface), this communication\
    \ is easily coordinated. The sender imports the interface of the receiver. The\
    \ imported file selects the methods the sender uses in the messages it sends.\n\
    \nHowever, if you develop an object that sends messages aren't yet defined—you're\
    \ leaving for others to implement—you won't have the receiver's interface file.\
    \ You need another way to define the methods you use but don't implement. A protocol\
    \ serves this purpose. It informs the compiler about the methods class uses and\
    \ informs other implementors of the methods they need to define to have their\
    \ objects work with.\n\nSuppose, for example, that you develop an object that\
    \ asks for the assistance of another by sending help: other messages. You use\
    \ an assistant instance variable to record the outlet for others and define a\
    \ companion method to set the instance variable. This method lets other objects\
    \ register themselves as recipients of your object's messages:\n\n+   - setAssistant:anObject\
    \ - assistant:anObject;\n\nThen, when a message is sent to the assistant, a check\
    \ is made to be sure that the receiver implements a method that can respond:\n\
    \n```\n(BOOL)doWork {\n    if ([assistant respondsToSelector:@selector(helpOut)])\
    \ {\n        [assistant helpOut:self];\n        return YES;\n    }\n    return\
    \ NO;\nn\n```\n\nBecause, at the time you wrote this code, you can't know what\
    \ kind of object might register itself as the assistant, you can only declare\
    \ a protocol for the helpOut: method; you can't import the interface of the class\
    \ that implements it."
  - '[PAGE 60]


    # Declaring Interfaces for Anonymous Objects


    A protocol can be used to declare the methods of an anonymous object, an object
    of unknown class. An anonymous object may represent a service or handle a limited
    set of functions, especially when only one object of its kind is needed.(Objects
    that play a fundamental role in defining an application''s architecture and objects
    that are not anonymous before using are good candidates for anonymity.)


    Objects are not anonymous to their developers, of course, but they are anonymous
    when the developer supplies them to someone else. For example, consider the following
    situations:


    +   - Someone who supplies a framework or a suite of objects for others to use
    objects that are not identified by a class name or interface file. Failing the
    name and class interface, users have no way of creating instances of it. Instead,
    the supplier must provide a ready-made instance. Typically, a method in another
    class returns a usable object:


    ```

    id formatter = [receiver formattingService];

    ```


    The object returned by the method is an object without a class identity, at least
    not one supplier is willing to reveal. For it to be of any use at all, the supplier
    must be identifying at least some of the messages it can respond to. The messages
    are identified by associating the object with a list of methods declared in a
    protocol.


    +   - You can send Objective-C messages to remote objects—in other applications
    ("Remote Messaging in the Objective-C Runtime Programming Guide, discusses this
    in more detail.)


    Each application has its own structure, classes and internal logic. But you don''t
    need to know how another application works or what components it to communicate
    with it. As an outsider, you need to know what messages you send (the protocol)
    and where to send them (the receiver).


    An application that publishes one of its objects as a potential receiver of remote
    messages must also publish a protocol declaring the methods the object will use
    to respond to messages. It doesn''t need to disclose anything about the object.
    The sending application doesn''t need to know the class of the object or the class
    in its own design. All this is needed.


    Protocols make anonymous objects possible. Without a protocol, there would be
    no way to declare an interface to an object without identifying its class.


    > Note: Even though the supplier of an anonymous object doesn''t reveal its class,
    the object itself reveals it at runtime. However, there''s usually little point
    in discovering this extra information; the information in the protocol is sufficient.


    # Nonhierarchical Similarities


    If more than one class implements a set of methods, those classes are often grouped
    under an abstract class that declares the methods they have in common. Each subclass
    can reimplement the methods in its own way, but the inheritance hierarchy and
    the common declaration in the abstract class capture the similarity between the
    subclasses.'
  - "[PAGE 61]\n\n# CHAPTER 4\nProtocols\n\nHowever, sometimes it's not possible to\
    \ group common methods in an abstract class. Classes that are unrelated in most\
    \ respects might nevertheless need to implement some methods. This limited similarity\
    \ may not justify a hierarchical relationship. For example, you might want to\
    \ add support for creating XML representations of objects in your application\
    \ and for initializing objects from an XML representation:\n\n+   - (NSMLElement\
    \ *)XMLRepresentation;\n  initFromXMLRepresentation:(NSMLElement *)xmlString;\n\
    \nThese methods could be grouped into a protocol and the similarity between implementing\
    \ classes according or by noting that they all conform to the same protocol.\n\
    \nObjects can be typed by this similarity (the protocols they conform to), rather\
    \ than by their class. For example an NSMatrix instance must communicate with\
    \ the objects that represent its cells. The matrix could require each of these\
    \ to be kind of NSCell (a type based on class) and rely on the fact that all objects\
    \ inherit from NSCell have the methods needed to respond to NSMatrix messages.\
    \ Alternatively, the NSMatrix could require objects representing cells that can\
    \ respond to a set of messages (a type based on protocol). In this case, the NSMatrix\
    \ object wouldn't care what a cell object belongs to, just that it implemented\
    \ the methods.\n\n# Formal Protocols\n\nThe Objective-C provides a way to formally\
    \ declare a list of methods (including declared properties) as a protocol. Formal\
    \ protocols are supported by the language and the runtime system. For example,\
    \ the compiler can check for types based on protocols, and objects can introspect\
    \ at runtime whether or not they conform to a protocol.\n\n# Declaring a Protocol\n\
    \nYou declare protocols with the @protocol directive:\n\n```\n@protocol ProtocolName\n\
    method declarations\nend\n```\n\nFor example, you could declare an XML representation\
    \ protocol like this:\n\n```\n@protocol MyXMLSupport\n  initFromXMLRepresentation:(NSMLElement\
    \ *)element;\n  (NSMLElement *)XMLRepresentation;\nend\n```\n\nUnlike classes,\
    \ protocol names do not have global visibility. They live in their own namespace.\n\
    \n# Optional Protocol Methods\n\nProtocol methods can be marked as optional using\
    \ the @optional keyword. Corresponding to the @optional modal keyword, there is\
    \ a @required to formally denote the semantics of the default behavior. You can\
    \ use @optional and @required to partition your protocol into sections you see\
    \ fit. If you do not specify any, the default is @required."
  - "[PAGE 62]\n\n# CHAPTER 4\nProtocols\n\n```\n@protocol MyProtocol\n\n  -(void)requiredMethod;\n\
    \n  @optional\n  -(void)anOptionalMethod;\n  -(void)anotherOptionalMethod;\n\n\
    \  @required\n  -(void)anotherRequiredMethod;\n\n@end\n```\n\n> Note: In Mac OS\
    \ X v10.5, protocols cannot include optional declared properties. This constraint\
    \ was introduced in Mac OS X v10.6 and later.\n\n# Informal Protocols\n\nIn addition\
    \ to formal protocols, you can also define an informal protocol by grouping the\
    \ methods in a category declaration:\n\n```\n@interface NSObject ( XMLElementSupport\
    \ )\n  -initFromXMLRepresentation:(NSMLElement*)element;\n  -(NSMLElement*)XMLRepresentation;\n\
    @end\n```\n\nInformal protocols are typically declared as categories of the NSObject\
    \ class, because that broadly associates the method names with any class that\
    \ inherits from NSObject. Because all classes inherit from the root class, the\
    \ methods arent restricted to any part of the inheritance hierarchy. (It is also\
    \ possible to declare an informal protocol as a category of another class to limit\
    \ it to a branch of the inheritance hierarchy, but there is little reason to do\
    \ so)\n\nWhen used to declare a protocol, a category interface does not have a\
    \ corresponding implementation. Instead, classes that implement the protocol declare\
    \ the methods again in their own interface files and define them with other methods\
    \ in their implementation files.\n\nAn informal protocol binds the rules of category\
    \ declarations to list a group of methods but do not associate with any particular\
    \ class or implementation.\n\nInformal protocols declared in categories do not\
    \ receive much language support. There type no checking at compile time nor a\
    \ check at runtime to see whether an object conforms to the protocol. To get these\
    \ benefits, you must use a formal protocol. An informal protocol may be useful\
    \ when all the methods are optional, such as for a delegate, but (in Mac OS X\
    \ v10.5 and later) it is typically better to use a formal protocol with optional\
    \ methods.\n\nInformal Protocols\n2010-12-08 | © Apple Inc. All Rights Reserved."
- md: "\n# Protocol Objects\n\nJust as classes are represented at runtime by class\
    \ objects and methods by selectors, formal protocols are represented by a special\
    \ data type—instances of the Protocol class. Source code that deals with a protocol\
    \ (other than to use it in a type specification) must refer to the corresponding\
    \ protocol object.\n\nIn many ways, protocols are similar to class definitions.\
    \ They both declare methods, and at runtime they are both represented by classes—instances\
    \ of Class and by instances of Protocol. Like class objects, protocols are created\
    \ automatically from the declarations and definitions found in source code and\
    \ they're not allocated and initialized in program code.\n\nSource code can refer\
    \ to a protocol using the @protocol() directive—the same directive that declares\
    \ a protocol, except that it has a set of trailing parentheses. The parentheses\
    \ enclose the protocol name:\n\n```\nProtocol *myXMLSupportProtocol = @protocol(MyXMLSupport);\n\
    ```\n\nThis is the only way that source code can conjure a protocol object. Unlike\
    \ a class name, a protocol name does not designate the object—except inside @protocol().\n\
    The compiler creates an adapter for each protocol declaration it encounters, but\
    \ only if the protocol it is:\n\n- Adopted by a class, or\n- Referred to somewhere\
    \ in source code (using @protocol())\n\nProtocols that are declared but not used\
    \ (except for type checking as described below) aren't represented by protocol\
    \ objects at runtime.\n\n# Adopting a Protocol\n\nAdopting a protocol is similar\
    \ in ways of declaring a subclass. Both methods assign methods to the class. The\
    \ superclass declaration assigns the protocol methods declared in the protocol\
    \ list. A class is said to adopt a formal protocol if its declaration lists the\
    \ protocol within angle brackets after the superclass:\n\n```\n@Interface ClassName\
    \ : Superclass < protocol list >\n```\n\nCategories adopt protocols in the same\
    \ way:\n\n```\n@Interface ClassName ( CategoryName ) < protocol list >\n```\n\n\
    A class can adopt more than one protocol; names in the protocol list are separated\
    \ by commas.\n@Interface Formatter : NSObject < Formatting, Prettyifying >\n\n\
    A class or category that adopts a protocol must implement all the required methods\
    \ the protocol declares, otherwise the compiler issues a warning. The Formatter\
    \ class above would define the required methods declared in the two protocols\
    \ it adopts, in addition to any it might have declared itself.\n\n# CHAPTER 4\n\
    Protocols\n\nA class or category that adopts a protocol must import the header\
    \ file where the protocol is declared. The methods declared in the adopted protocol\
    \ are not declared elsewhere in the class or category interface.\n\nIt's possible\
    \ for a class to adopt protocols and declare no other methods. For example, the\
    \ following class declaration adopts the Formatting and Pettifying protocols,\
    \ but declares no instance variables or methods of its own:\n\n```\n@interface\
    \ Formatter : NSObject <Formatting, Pettifying>\n@end\n```\n\n# Conforming to\
    \ a Protocol\n\nA class is said to conform to a formal protocol if it adopts the\
    \ protocol or inherits from any other class that adopts it. An instance of a class\
    \ is said to conform to the same set of protocols its class conforms to.\n\nBecause\
    \ a class must implement all the required methods declared in the protocol it\
    \ adopts, saying that a class or instance conforms to a protocol is equivalent\
    \ to saying that it has in its repertoire all the methods declared.\n\nIt's possible\
    \ to check whether an object conforms to a protocol by sending a conformsToProtocol\
    \ message:\n\n```\nif ([receiver conformsToProtocol:@protocol(MyXMLSupport)] )\
    \ {\n    // Object does not conform to MyXMLSupport protocol\n    // If you are\
    \ expecting receiver to implement methods declared in the\n    // conformsProtocol,\
    \ this is probably an error\n}\n```\n\n(Note that there is also a method with\
    \ the same name—conformsToSelector:)\n\nThe conformsToSelector: test is also for\
    \ a single method, except that it tests whether the protocol has been adopted\
    \ (presumably all the methods declared) rather than just implemented. It checks\
    \ for all the methods in the protocol, conformsTo: can be more efficient than\
    \ respondsToSelector:\n\nThe conformsToProtocol: test is also like the isKindOfClass:\
    \ test, except that it tests for a type based on a protocol rather than the inheritance\
    \ hierarchy.\n\n# Type Checking\n\nType declarations for objects can be extended\
    \ to include formal protocols. Protocols thus offer the possibility of another\
    \ level of type checking by the compiler, one that's more abstract since it's\
    \ not tied to particular implementations.\n\nIn a type declaration, protocol names\
    \ are listed between angle brackets after the type name:\n\n```\n(id <Formatting>)formattingService;\n\
    id <MyXMLSupport> anObject;\n```\n\n# CHAPTER 4\nProtocols\n\nJust as static typing\
    \ permits the compiler to test for a type based on the class hierarchy, this syntax\
    \ permits the compiler to test for a type based on conformance to a protocol.\n\
    \nFor example, if Formatter is an abstract class, the declaration\n\n```\nFormatter\
    \ *anObject;\n```\n\ngroups objects that inherit from Formatter into a type and\
    \ permits the compiler to check assignments against type.\n\nSimilarly, the declaration\n\
    \n```\nid <Formatting> anObject;\n```\n\ngroups objects that conform to the Formatting\
    \ protocol into a type, regardless of their positions in the class hierarchy.\
    \ The compiler can make sure only objects that conform to the protocol are assigned\
    \ to the type.\n\nIn each case, type groups similar objects—either because they\
    \ share a common inheritance, or because they converge on a common set of methods.\n\
    \nThe two types can be combined in a single declaration:\n\n```\nFormatter <Formatting>\
    \ *anObject;\n```\n\nProtocols cannot be used to type class objects. Only instances\
    \ can be statically typed to a protocol, just as only instances can be statically\
    \ typed to a class. (However, at runtime, classes and instances respond to conformsTo:\
    \ message.)\n\n# Protocols Within Protocols\n\nOne protocol can incorporate other\
    \ protocols using the same syntax that classes use to adopt a protocol:\n\n```\n\
    @protocol ProtocolName < protocol list >\n```\n\nAll the protocols listed between\
    \ angle brackets are considered part of the ProtocolName. For example, if the\
    \ Paging protocol incorporates the Formatting protocol\n\n```\n@protocol Paging\
    \ < Formatting >\n```\n\nany object that conforms to the Paging protocol also\
    \ conforms to Formatting. Type declarations such as\n\n```\nid <Paging> someObject;\n\
    ```\n\nand conformsToProtocol: messages such as\n\n```\nif ( [anotherObject conformsToProtocol:@protocol(Paging)]\
    \ ]\n )\n```\n\nneed to mention only the Paging protocol to test for conformance\
    \ to Formatting as well.\n\n# CHAPTER 4\nProtocols\n\nWhen a class adopts a protocol,\
    \ it must implement the required methods the protocol declares, as mentioned earlier.\
    \ In addition, it must conform to any protocols the adopted protocol incorporates.\
    \ If an incorporated protocol incorporates other protocols, the class must also\
    \ conform to them. A class can conform to an incorporated protocol using either\
    \ of these techniques:\n\n- Implementing the methods protocol declares\n- Inheriting\
    \ from a class that adopts the protocol and implements the methods\n\nSuppose,\
    \ for example, the Pager class adopts the Paging protocol. If Pager is a subclass\
    \ of NSObject as shown here:\n\n```\n@Interface Pager : NSObject < Paging >\n\
    ```\n\nit must implement all the Paging methods, including those declared in the\
    \ incorporated protocol protocol. It adopts the Formatting protocol along Paging.\n\
    \nOn the other hand, if Pager is a subclass of Formatter (a class that independently\
    \ adopts the Formatting protocol) as shown here:\n\n```\n@Interface Pager : Formatter\
    \ < Paging >\n```\n\nit must implement all the methods declared in the Paging\
    \ protocol proper, but not declared in Formatting. Pager inherits conformance\
    \ to the Formatting protocol from Formatter.\n\nNote that a class can conform\
    \ to a protocol without adopting it, by implementing the methods declared in the\
    \ protocol.\n\n# Referring to Other Protocols\n\nWhen working on complex applications,\
    \ you occasionally find yourself writing code that looks like this:\n\n```\n#import\
    \ \"B.h\"\n@protocol A\nfoo:(id <B>)anObject;\nend\n```\n\nwhere protocol B is\
    \ declared like this:\n\n```\n#import \"A.h\"\n@protocol B\nbar:(id <A>)anObject;\n\
    end\n```\n\nIn such a situation, circularity results and neither file will compile\
    \ correctly. To break this recursive cycle, you must use the @protocol directive\
    \ to make a forward reference to the needed protocol instead of importing the\
    \ interface file where the protocol is defined:\n\n```\n@protocol B\n@protocol\
    \ A\n```\n"
  mdcn: "\n\n# 协议对象\n\n正如类在运行时由类对象表示、方法由选择器（selectors）表示一样，正式协议由一种特殊数据类型表示——`Protocol`\
    \ 类的实例。处理协议的源代码（除用于在类型规范中使用它除外）必须引用相应的协议对象。\n\n在许多方面，协议与类定义相似。它们都声明了方法，并且在运行时都由类表示——即通过\
    \ `Class` 的实例和 `Protocol` 的实例。像类对象一样，协议是根据源代码中的声明和定义自动创建的，它们不会在程序代码中被分配和初始化。\n\
    \n源代码可以使用 `@protocol()` 指令引用协议——该指令与声明协议的指令相同，区别在于它有一组尾随的括号。括号内包含了协议的名称：\n\n```\n\
    Protocol *myXMLSupportProtocol = @protocol(MyXMLSupport);\n```\n\n这是源代码创建协议对象的唯一方法。与类名不同，协议名并不指定具体对象——在\
    \ `@protocol()` 内部除外。\n编译器会为它遇到的每个协议声明创建一个适配器（adapter），但仅当该协议满足以下条件时：\n\n- 被类采纳（Adopted），或\n\
    - 在源代码某处被引用（使用 `@protocol()`）\n\n已声明但未使用的协议（下文提到的类型检查除外）在运行时不会由协议对象表示。\n\n# 采纳协议\n\
    \n采纳协议与声明子类在某些方面是相似的。两种方法都将方法分配给类。超类声明分配了协议列表中声明的方法。如果一个类的声明在超类之后的角括号内列出了协议，则称该类采纳了某个正式协议：\n\
    \n```\n@Interface ClassName : Superclass < protocol list >\n```\n\n分类（Categories）以相同的方式采纳协议：\n\
    \n```\n@Interface ClassName ( CategoryName ) < protocol list >\n```\n\n一个类可以采纳多个协议；协议列表中的名称用逗号分隔。\n\
    @Interface Formatter : NSObject < Formatting, Prettyifying >\n\n\n\n采纳协议的类或分类必须实现该协议声明的所有要求方法，否则编译器会发出警告。上面的\
    \ `Formatter` 类将定义它采纳的两个协议中声明的所有方法，加上它可能自己声明的任何方法。\n\n# 第 4 章\n协议\n\n采纳协议的类或分类必须导入声明协议所在的头文件。在纳的协议中声明的方法在类或分类的接口的其他地方没有声明。\n\
    \n一个类可以采纳协议但不声明任何其他方法。例如，以下类声明采纳了 `Formatting` 和 `Pettifying` 协议，但没有声明它自己的任何实例变量或方法：\n\
    \n```\n@interface Formatter : NSObject <Formatting, Pettifying>\n@end\n```\n\n\
    # 符合协议\n\n如果一个类采纳了某个协议，或者继承自任何采纳该协议的类，则称该类符合该正式协议。类的实例被认为符合其类所符合的相同协议set。\n\n\
    由于类必须实现其采纳的协议中声明的所有要求方法，因此说一个类或实例符合某个协议，等同于说它在功能库中包含了所有声明的方法。\n\n可以通过发送 `conformsToProtocol`\
    \ 消息来检查对象是否符合某个协议：\n\n```\nif ([receiver conformsToProtocol:@protocol(MyXMLSupport)]\
    \ ) {\n    // 对象不符合 MyXMLSupport 协议\n    // 如果你期望 receiver 实现 conformsProtocol\
    \ 中声明的方法，\n    // 这可能是一个错误\n}\n```\n\n（注意，还有一个同名的方法——`conformsToSelector:`）\n\n\
    `conformsToSelector:` 测试也是针对单个方法的，区别在于它测试的是协议是否已被采纳（假设所有声明的方法都已存在），而不仅仅是实现。它检查协议中的所有方法，相比之下\
    \ `conformsTo:` 可以比 `respondsToSelector:` 更高效。\n\n`conformsToProtocol:` 测试也类似于\
    \ `isKindOfClass:` 测试，区别在于它是基于协议进行类型测试，而不是基于继承层级。\n\n# 类型检查\n\n对象的类型声明可以扩展以包含正式协议。因此，协议为编译器提供了编译器的另一层类型检查的可能性，这种检查更加抽象，因为它没有绑定到具体的实现。\n\
    \n在类型声明中，协议名列在类型名称之后的角括号内：\n\n```\n(id <Formatting>)formattingService;\nid <MyXMLSupport>\
    \ anObject;\n```\n\n# 第 4 章\n协议\n\n正如静态类型允许编译器根据类层级测试类型一样，这种语法允许编译器根据对协议的符合性测试类型。\n\
    \n例如，如果 `Formatter` 是一个抽象类，则声明：\n\n```\nFormatter *anObject;\n```\n\n将继承自 `Formatter`\
    \ 的对象分到一个类型中，并允许编译器根据类型检查赋值。\n\n同样，声明：\n\n```\nid <Formatting> anObject;\n```\n\
    \n将符合 `Formatting` 协议的对象分到一个类型中，无论它们在类层级中的位置如何。编译器可以确保只有符合协议的对象被分配给该类型。\n\n在每情况下，类型组了相似的对象——要么是因为它们共享共同的继承关系，要么是因为它们收敛于共同的方法集。\n\
    \n这两种类型可以在同一个声明中组合：\n\n```\nFormatter <Formatting> *anObject;\n```\n\n协议不能用于类对象的类型化。只有实例可以被静态类型为协议，正如只有实例可以被静态类型为类一样。（然而，在运行时，类和实例都会响应\
    \ `conformsTo:` 消息。）\n\n# 协议中的协议\n\n一个协议可以使用类采纳协议的相同语法来包含其他协议：\n\n```\n@protocol\
    \ ProtocolName < protocol list >\n```\n\n角括号之间列出的所有协议都被视为 `ProtocolName` 的一部分。例如，如果\
    \ `Paging` 协议包含了 `Formatting` 协议\n\n```\n@protocol Paging < Formatting >\n```\n\
    \n任何符合 `Paging` 协议的对象也符合 `Formatting`。如下类型声明：\n\n```\nid <Paging> someObject;\n\
    ```\n\n以及 `conformsToProtocol:` 消息如\n\n```\nif ([anotherObject conformsToProtocol:@protocol(Paging)]\
    \ )\n```\n\n只需要提到 `Paging` 协议即可测试符合 `Formatting`。\n\n# 第 4 章\n协议\n\n当一个类采纳协议时，它必须实现该协议声明的方法，如前。此外，它必须符合所采纳协议包含的任何协议。如果包含协议包含了包含了协议，该类也必须符合这些协议。类可以使用以下技术之一符合包含协议：\n\
    \n字体 实现协议声明的方法\n- 继承采纳该协议并实现方法的类\n\n假设，`Pager` 类采纳了 `Paging` 协议。如果 `Pager` 是 `NSObject`\
    \ 的子类，如下：\n\n```\n@Interface Pager : NSObject <Paging >\n```\n\n它必须实现所有的 `Paging`\
    \ 方法，包括包含协议中声明的方法。它连同 `Formatting` 协议一起采纳。\n\n另一方面，如果 `Pager` 是 `Formatter`（独立采纳\
    \ `Formatting` 协议的类）的子类，如下：\n\n```\n@Interface Pager : Formatter <Paging >\n```\n\
    \n它必须实现 `Paging` 协议本身声明的方法，但不包含 `Formatting` 中定义的。`Pager` 继承了对 `Formatting` 协议的符合性。\n\
    \n注意，类可以通过实现协议中声明的方法来符合协议而不采纳它。\n\n# 引用其他协议\n\n在开发复杂的应用程序时，你偶尔会发现自己在编写如下代码：\n\n\
    ```\n#import \"B.h\"\n@protocol A\nfoo:(id <B>)anObject;\nend\n```\n\n其中协议 B 的声明如下：\n\
    \n```\n#import \"A.h\"\n@protocol B\nbar:(id <A>)anObject;\nend\n```\n\n在这种情况下，会导致循环，两个文件都无法正确编译。为了打破这种递归循环，你必须使用\
    \ `@protocol` 指令对所需的协议进行前向引用，而不是导入定义协议的接口文件：\n\n```\n@protocol B\n@protocol A\n\
    ```\n\n"
