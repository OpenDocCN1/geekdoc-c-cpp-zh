    - (void)setValue:(float)newValue;\n\nA property declaration provides additional\
    \ information about how the accessor methods are implemented (as described in\
    \ \"Property Declaration Attributes\" (page 70)).\n\n# Property Declaration Attributes\n\
    \nYou can decorate a property with attributes using the form @property([attribute,\
