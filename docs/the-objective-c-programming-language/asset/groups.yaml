    \n# 重定义非常简单\n\nsuper 是编译器的一个标志标志，告诉它从哪里开始搜索要执行的方法；它仅用作消息的接收者。但 self 是一个变量名，可以用任意方式使用，甚至可以赋予新值。\n\
    \n在类方法的定义中，存在这种做法的倾向。类方法通常关注的不是对象，而是类的实例。例如，许多类方法结合了实例的分配和初始化，通常同时设置实例变量。在这样的方法中，可能会尝试向新分配的实例发送消息并像实例方法一样调用实例的\
    \ `self`。但那将是一个错误。self 和 super 都指向接收者——对象；在类方法内部，self 指的是类对象。这是一个不应该这么做的示例：\n\n\
    ```objectivec\n+(Rectangle)rectangleOf:(NSColor*)color\nself = [[Rectangle alloc]\
    \ init]; // 错误\n[self setColor:];\nreturn [self autorelease];\n```\n\n为了避免混淆，在类内部使用变量\
    \ own self 来引用实例更好：\n\n```objectivec\n+(id)rectangleOf:(NSColor*)color\nid newInstance\
    \ = [[Rectangle alloc] init]; // 正确\n[newInstance setColor:];\nreturn [newInstance\
    \ autorelease];\n```\n\n事实上，与其向类发送 `alloc` 消息，通常向 self 发送 `alloc` 更好。这样，如果类被子类，返回的实例将与类的类型相同（例如，NSArray\
    \ 的数组方法）。\n\n"
