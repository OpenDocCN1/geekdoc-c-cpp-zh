- md: "\n# CHAPTER 6\n\nCategories and Extensions\n\nNote that a category can declare\
    \ additional instance variables for the class; it includes only methods. However,\
    \ all instance variables within the scope of the class are also within the scope\
    \ of the category. That includes all instance variables declared by the class,\
    \ even ones declared @private.\n\nThere's no limit to the number of categories\
    \ you can add to a class, but each category name must be different, and each should\
    \ declare and define a different set of methods.\n\n# How You Can Use Categories\n\
    \nThere are several ways in which you can use categories:\n\n- Extend classes\
    \ defined by other implementors\n\nFor example, you may add methods to the classes\
    \ defined in the Cocoa frameworks. The added methods are inherited by subclasses\
    \ and are indistinguishable at runtime from the original methods of the class.\n\
    \n- As an alternative to a subclass\n\nRather than define a subclass to extend\
    \ an class, through a category you can add methods to the class directly. For\
    \ example, you could add categories to NSArray and other Cocoa classes. As in\
    \ the case of a subclass, you don't need source code for the class you're extending.\n\
    \n- To distribute the implementation of a new class into multiple source files\n\
    \nFor example, you could group the methods of a large class into several categories\
    \ and put each category in its own file. When used this, categories can benefit\
    \ the development process in a number of ways—\n- Provide a simple way of grouping\
    \ related methods. Similar methods in different classes can be kept together in\
    \ the same source file.\n- Simplify the management of a large class when several\
    \ developers contribute to the class definition.\n- Let you achieve more locality\
    \ of reference for many commonly used methods.\n- Enable you to configure a class\
    \ differently for separate applications, without having to maintain different\
    \ versions of the source code.\n\n- To declare informal protocols\n\nSee \"Informal\
    \ Protocols\" (page 63), as discussed under \"Declaring Interfaces for Others\
    \ to Implement\" (page 59).\n\nAlthough the Objective-C language allows you to\
    \ use a category to override methods the class inherits, or even methods declared\
    \ in the class interface, you are strongly discouraged from doing so. A category\
    \ is not a shortcut for a subclass. There are several significant shortcuts to\
    \ using a category to override methods:\n\n- When a category overrides an inherited\
    \ method, the method in the category can, as usual, invoke the inherited implementation\
    \ via a message to super. However, if a category overrides a method that exists\
    \ in the category's class, there is no way to invoke the original implementation.\n\
    \n- A category cannot reliably override methods declared in another category of\
    \ the same class.\n\nThis issue is of particular significance because many of\
    \ the Cocoa classes are implemented using categories. A framework-defined method\
    \ you try to override may itself have been implemented in a category, and so which\
    \ implementation takes precedence is not defined.\n\n- The very presence of some\
    \ categories may cause behavior changes across all frameworks. For example, if\
    \ you use the windowWillClose delegate in category on NSObject, all window delegates\
    \ in your program respond when using the category method; the behavior of all\
    \ instances of NSString may change. Categories you add on a framework class may\
    \ cause mysterious changes in behavior and lead to crashes.\n\n# Categories of\
    \ the Root Class\n\nA category can add methods to any class, including the root\
    \ class. Methods added to NSObject become available to all classes that are linked\
    \ to your code. Adding methods to the root class with a category can be useful\
    \ at times, but it can also be dangerous. Although it may seem that the modifications\
    \ category makes are well understood and of limited impact, inheritance gives\
    \ them a scope. You may be making unintended changes to unseen classes in your\
    \ application; you may not know all the consequences of what you're doing. Moreover,\
    \ others working on your application, who are unaware of your changes, won't understand\
    \ what they're.\n\nIn addition, there are two other considerations to keep in\
    \ mind when implementing methods for the root class:\n\n- Messages to super are\
    \ invalid (there is no subclass of NSObject).\n\n- Classes objects can perform\
    \ instance methods defined in the root class.\n\nNormally, classes can perform\
    \ only class methods. But instance methods defined in the root class are a special\
    \ case. They define an interface to the runtime that all objects inherit. Class\
    \ objects are full-fledged objects and share the same interface.\n\nThis feature\
    \ means that you need to take into account the possibility that an instance method\
    \ you define in a category of the NSObject class might be performed not only by\
    \ instances but by class objects as well. For example, within the method, self\
    \ might mean a class object as well as an instance. See NSObject Class Reference\
    \ for more information on class access to root methods.\n\n# Extensions\n\nClass\
    \ extensions are like anonymous categories, except that the methods they declare\
    \ must be implemented in the main @implementation block for the corresponding\
    \ class.\n\nIt is common for a class to have a publicly declared API and to have\
    \ additional methods declared privately for sole use by the framework within which\
    \ the class resides. You can declare such methods in a category (or in more than\
    \ one category) in a private header file or implementation file as mentioned above.\
    \ This works, but the compiler cannot verify that all methods are implemented.\n\
    \nFor example, the following declarations and implementation compile without error,\
    \ even though the setNumber: method has no implementation:\n\n```\n@interface\
    \ MyObject : NSObject\nNSNumber *number;\n-(NSNumber *)number;\n@end\n```\n\n\
    ```\n@implementation MyObject\n-(NSNumber *)number {\nreturn number;\n}\n@end\n\
    ```\n\nInvoking setNumber:at, however, would generate an error.\n\nClass extensions\
    \ allow you to declare additional required methods for a class in locations other\
    \ than the primary class interface block, as illustrated in the following example:\n\
    \n```\n@interface MyObject : NSObject\nNSNumber *number;\n-(NSNumber *)number;\n\
    @end\n```\n\n```\n@interface MyObject ()\n-(void)setNumber:(NSNumber *)newNumber;\n\
    @end\n```\n\n```\n@implementation MyObject\n-(NSNumber *)number {\nreturn number;\n\
    }\n-(void)setNumber:(NSNumber *)newNumber {\nnumber = newNumber;\n}\n@end\n```\n\
    \nNotice that in this case:\n\n- No name is given in the parentheses in the second\
    \ @interface block.\n\n- The implementation of the `setNumber:` method appears\
    \ within the main `@implementation` block for the class.\n\nThe implementation\
    \ of the `setNumber:` method *must* appear within the main `@implementation` block\
    \ of the class (you cannot implement it in a category). If this is not the case,\
    \ the compiler emits a warning that it cannot find a method definition for `setNumber:`.\n\
    \n# Associative References\n\nUse associative references to simulate the addition\
    \ of object instance variables to an existing class.\nAssociative references are\
    \ available only in iOS and Mac OS X v10.6 and later.\n\n# Adding Storage Outside\
    \ a Class Definition\n\nUsing associative references, you can add storage to an\
    \ object without modifying the class declaration. This may be useful if you do\
    \ not have access to the source code for the class, or if binary-compatibility\
    \ reasons you cannot alter the layout of the object.\n\nAssociations are based\
    \ on a key, so for any object you can add as many associations as you want, each\
    \ using a different key. An association can also ensure that the object remains\
    \ valid for at least the lifetime of the source object (without the possibility\
    \ of introducing unretained cycles in a garbage-collected environment).\n\n# Creating\
    \ Associations\n\nYou use the Objective-C runtime function objc_setObject to make\
    \ an association between one object and another. The function takes four parameters:\
    \ the source object, a key, the value, and an association policy. Of these, the\
    \ key and the association policy merit further discussion.\n\n- The key is a void\
    \ pointer. For each association must be unique. A typical pattern is to use a\
    \ static variable.\n- The policy specifies whether the object is assigned, retained,\
    \ or copied, and whether the association be made atomically or non-atomically.\
    \ This pattern is similar to that of the attributes of a declared property (\"\
    Property Declaration Attributes\" (page 70)). You specify the policy for the relationship\
    \ using a constant (objc_AssociationPolicy and Associative Object Behaviors).\n\
    \nListing 7-1 shows how you can establish an association between an array and\
    \ a string.\n\nListing 7-1 Establishing an association between an array and a\
    \ string\n\n```\nNSArray *array = =[[NSArray alloc] initWithObjects:@One, @Two,\
    \ @Three, nil];\n// For the purposes of illustration, use initWithFormat: \n//\
    \ the string can be deallocated\nNSString *overview = [[NSString alloc] initWithFormat:@\"\
    %\", @First three numbers];\n```\n"
  mdcn: "\n\n# 第6 章\n\n分类（Categories）与扩展（Extensions）\n\n注意，分类可以为类声明额外的实例变量；它仅包含方法。然而，类的作用范围内的所有实例变量也是分类的作用范围内。这包括类声明的所有实例变量，即使是标记为\
    \ @private 的变量。\n\n你可以向类中添加的分类数量没有限制，但每个分类的名称必须是唯一的，且每个分类应该声明并定义一组不同的方法。\n\n#\
    \ 你如何使用分类\n\n你有几种方法可以使用可以使用分类：\n\n-   **扩展由其他实现者定义的类**\n\n例如，你可以为 Cocoa 框架中定义的类添加方法。新添加的方法会被子类继承，并且在运行时与该类的原始方法无法区分。\n\
    \n-   **作为子类的替代方案**\n\n与其通过定义子类来扩展一个类，不如说你可以通过分类直接向该类添加方法。例如，你可以为 `NSArray` 和其他\
    \ Cocoa 类添加分类。与子类的情况一样，你不需要被扩展类的类的源代码。\n\n-   **将新类的实现分布到多个源文件中**\n\n例如，你可以将一个大类的方法分组到几个分类中，并将每个分类存放在它自己的文件中。使用这种方法时，分类可以在许多方面有利于开发过程——\n\
    - 提供了一种了一种对相关方法进行分组的方法。不同类中相似的方法可以保持在同一个源文件中。\n-   当多个开发者参与类定义时，可以简化对大类的管理。\n\
    - 让你对许多常用方法实现更高的**引用局部性**（locality of reference）。\n- 允许你为不同的应用程序对类进行不同的配置，而无需维护不同版本的源代码。\n\
    \n-   **声明非正式协议（informal protocols）**\n\n请参见“非正式协议”（第63页），在“为他人实现声明接口”（第59页）下讨论的内容。\n\
    \n尽管 Objective-C 语言允许你使用分类来覆盖类继承的方法，甚至可以覆盖在类接口中声明的方法，但强烈建议不要这样做。分类不是子类的快捷方式。使用分类来覆盖方法有几个显著的捷径风险：\n\
    \n-   当分类覆盖一个继承的方法时，分类中的方法可以像往常一样通过向 super 发送消息来调用继承的实现。然而，如果分类覆盖了该类中已存在的方法，则没有办法调用原始实现。\n\
    \n-   分类无法可靠地覆盖同类中另一个分类里声明的方法。\n\n这个问题具有特别的意义，因为许多 Cocoa 类是使用分类实现的。你尝试覆盖的框架定义方法本身可能是在一个分类中实现的，因此哪种实现具有优先级并未定义。\n\
    \n-   某些分类的存在本身可能会导致所有框架的行为变化。例如，如果你在 `NSObject` 的分类中使用了 `windowWillClose` 代理，那么你程序中的所有窗口代理在使用分类方法时都会响应；`NSString`\
    \ 所有实例的行为可能会发生变化。在框架类上添加的分类可能会导致奇怪的行为变化并引发崩溃。\n\n# 根类的分类\n\n分类可以为任何类添加方法，包括根类。添加到\
    \ `NSObject` 的方法对所有链接到你代码的类可见。使用分类为根类添加方法有时有用，但也可能是危险的。虽然分类所做的修改似乎是明确的且影响有限，但继承赋予了它们作用域。你可能对应用程序中不可见的类造成了无意的更改；你可能不知道你所做事情的所有后果。此外，开发你程序的其他人如果不知道你的更改，将无法理解这些更改是什么。\n\
    \n此外，在为根类实现方法时，还有两个点需要考虑：\n\n-   向 super 发送的消息是无效的（没有 `NSObject` 的子类）。\n\n-  \
    \ 类对象可以执行根类中定义的实例方法。\n\n通常情况下，类只能执行类方法。但在根类中定义的实例方法是一个特例。它们为运行时定义了一个所有对象继承的接口。类对象是功能完整的对象并共享相同的接口。\n\
    \n这一特性意味着你需要考虑一种可能性：你在 `NSObject` 类的分类中定义的实例方法可能不仅被实例执行，还被类对象执行。例如，在方法内部，`self`\
    \ 可能既代表一个类对象，也代表一个实例。有关类访问根方法的更多信息，请参阅 `NSObject Class Reference`。\n\n# 扩展（Extensions）\n\
    \n类扩展就像匿名分类，不同之处在于它们声明的方法必须在对应类的主 `@implementation` 块中实现。\n\n一个类具有公开声明的 API，并声明私有的额外方法仅供该类所属的框架使用，这是很常见的。如上所述，你可以在私有头文件或实现文件中通过分类（或多个分类）来声明此类方法。这种方法行得通，但编译器无法验证所有所有方法都已实现。\n\
    \n例如，以下声明和实现可以无错误编译，尽管 `setNumber:` 方法没有实现：\n\n```\n@interface MyObject : NSObject\n\
    NSNumber *number;\n-(NSNumber *)number;\n@end\n```\n\n```\n@implementation MyObject\n\
    -(NSNumber *)number {\nreturn number;\n}\n@end\n```\n\n然而，调用 `setNumber:at` 将生成错误。\n\
    \n类扩展允许你在主类接口块之外的位置为类声明额外的必需方法，如下例所示：\n\n```\n@interface MyObject : NSObject\n\
    NSNumber *number;\n-(NSNumber *)number;\n@end\n```\n\n```\n@interface MyObject\
    \ ()\n-(void)setNumber:(NSNumber *)newNumber;\n@end\n```\n\n```\n@implementation\
    \ MyObject\n-(NSNumber *)number {\nreturn number;\n}\n-(void)setNumber:(NSNumber\
    \ *)newNumber {\nnumber = newNumber;\n}\n@end\n```\n\n注意，在这种情况下：\n\n- 在第二个 `@interface`\
    \ 块中没有给出名称。\n\n- `setNumber:` 方法的实现**必须**出现在类的主 `@implementation` 块中（不能在分类中实现）。如果找不到\
    \ `setNumber:` 方法定义，编译器将发出警告。\n\n# 关联引用（Associative References）\n\n使用关联引用模拟向现有类添加实例变量。关联引用仅适用于\
    \ iOS 和 Mac OS 10.6 及更高版本。\n\n# 在类定义之外添加存储\n\n使用关联引用，你可以在不修改类的情况下为对象添加存储。如果你无法访问类的源代码，或者由于二进制性原因无法更改对象的布局，这可能有用。\n\
    \n关联基于键，因此对于任何对象你可以添加多个关联，每个关联使用不同的键。关联还可以确保对象在源对象的范围内有效（而不会在垃圾回收环境中引入未保留循环）。\n\
    \n# 创建关联\n\n你使用 Objective-C 运行时函数 `objc_setObject` 在对象之间建立关联。该函数接受四个参数：源对象、键、值和关联策略。其中，键和关联策略值得进一步讨论。\n\
    \n- 键是一个空指针。每个关联必须是唯一的。典型的模式是使用静态变量。\n- 策略指定了对象是被赋值、保留还是拷贝，以及关联是以原子还是非原子方式创建的。这种模式与声明属性的属性相似（“属性声明属性”，第70页）。你使用常量来指定关系的策略（`objc_AssociationPolicy`\
    \ 和 `Associative Object Behaviors`）。\n\n列表 7-1 显示了你如何在数组和字符串之间建立关联。\n\n列表 7-1\
    \ 在数组和字符串之间建立关联\n\n```\nNSArray *array = =[[NSArray alloc] initWithObjects:@One,\
    \ @Two, @Three, nil];\n// 为了演示，使用 initWithFormat: \n// 字符串可以被释放\nNSString *overview\
    \ = [[NSString alloc] initWithFormat:@\"%\", @First three numbers];\n```\n\n"
