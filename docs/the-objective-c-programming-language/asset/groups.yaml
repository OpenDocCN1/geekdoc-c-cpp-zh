    # CHAPTER 2

    Defining Class


    @end


    The first line of the declaration presents the new class name and links to its
    superclass. The superclass defines the position of the new class in the inheritance
    hierarchy, as discussed under "Inheritance" (page 23). If the colon and superclass
    are omitted, the new class is declared as a root class, a rival to the NSObject
    class.


    Following the first part of the class declaration, braces enclose instance variables,
    the data structures that are part of each instance of the class. Here''s a partial
    list of instance variables that might be declared in the Rectangle class:


    ```

    float width;

    float height;

    BOOL filled;

    NSColor *fillColor;

    ```


    Methods for the class are declared next, after the braces enclosing instance variables
    and before the end of the class declaration. The names of methods that can be
    used by class objects, class methods, are preceded by a plus sign:


    +   + alloc;


    The methods that instances of a class can use, instance methods, are marked with
    a minus sign:


    +   - (void)display;


    Although it''s not common practice, you can declare a class method and an instance
    method with the same name. A method can also have the same name as an instance
    variable, which is more common, especially if the method returns the value in
    the variable. For example, Circle has a radius method that could match a radius
    instance variable.


    Method return types are declared using the standard C syntax for one type to another:


    +   - (float)radius;


    Parameter types are declared in the same way:


    +   - (void)setRadius:(float)radius;


    If a return or parameter is not explicitly declared, it''s assumed to be the default
    type for methods and messages—an id. The alloc method illustrated earlier returns
    id.


    When there''s more than one parameter, the parameters are declared within the
    method name after the colons. Parameters break the name apart in the declaration,
    just as in a message. For example:


    +   - (void)setWidth:(float)width height:(float)height;


    Methods that take a variable number of parameters declare them using a comma and
    ellipsis points, just as a function would:


    +   - makeGroup:group, ...;


