  - "[PAGE 42]\n\n# Messages to self and super\n\nObjective-C provides two methods\
    \ that can be used within a method definition to refer to the object that performs\
    \ the method—self and super.\n\nSuppose, for example, that you define a reposition\
    \ method that needs to change the coordinates of whatever object it acts on. Can\
    \ invoke the setOrigin:: method to make the change. All it needs to do is send\
    \ setOrigin:: the same object that the message itself was sent to. When you're\
    \ writing the reposition code, you can refer to that object as either self or\
    \ super. The reposition method could read either:\n\n```\nreposition {\n    [self\
    \ setOrigin:someX :someY];\\}\n```\n\nor:\n\n```\nreposition {\n    [super setOrigin:someX\
    \ :someY];\\}\n```\n\nHere, self and super both refer to the object receiving\
    \ a reposition message, whatever object may happen to be. The two messages are\
    \ quite different, however. self is one of the hidden parameters that the messaging\
    \ routine passes to every method; it is a local variable that can be freely within\
    \ a method implementation, just as the names of instance variables can be. super\
    \ is a term that substitutes for self only as the receiver in a message expression.\
    \ As receivers, the two terms differ in how they affect the messaging process:\n\
    \n+   * self searches for the method implementation in the usual manner, starting\
    \ in the dispatch table of the receiving object's class. In the example above,\
    \ it would begin with the class of the object receiving the message.\n* super\
    \ searches for the method implementation in a very different place. It begins\
    \ in the superclass of the class that defines the method where super appears.\
    \ In the example, it would begin with the superclass of the class where reposition\
    \ is defined.\n\nWherever super receives a message, the compiler substitutes another\
    \ messaging routine for the obj_msgSend function. The substitute routine looks\
    \ directly to the superclass of the defining class—that is, to the superclass\
    \ of the class sending the message to super—rather than to the class of the object\
    \ receiving the message."
- md: "\n# An Example: Using self and super\n\nThe difference between self and super\
    \ becomes clear when using a hierarchy of three classes. Suppose, for example,\
    \ that we create an object belonging to a class called Low. The subclass of Low\
    \ is Mid; the subclass of Mid is High. All three classes define a method called\
    \ negotiate, which each class uses for its own purpose. In addition, Mid defines\
    \ an ambitious method called makeLastingPeace, which itself employs the negotiate\
    \ method. The classes and those methods are illustrated in Figure 2-2.\n\nFigure\
    \ 2-2 The hierarchy of High, Mid, and Low\n\n![](img/6f9b7a92b4fae621991881021b9bf44a_43_0.png)\n\
    \nSuppose that the implementation of makeLastingPeace (in the Mid class) uses\
    \ self to indicate the object to send the negotiate message to:\n\n```\nmakeLastingPeace\n\
    {\n  [self negotiate];\n}\n```\n\nWhen a message is sent to a Low object to perform\
    \ the makeLastingPeace method, makeLastingPeace sends a negotiate message to the\
    \ same Low object. The messaging routine finds the version of negotiate defined\
    \ in Low, the class of self.\n\n# CHAPTER 2\n\n# Defining a Class\n\nHowever,\
    \ if the implementation of makeLastingPeace instead uses super as the receiver,\n\
    \n```\n- makeLastingPeace\n{\n  [super negotiate];\n}\n```\n\nthe messaging routine\
    \ finds the version of negotiate defined in High. It ignores the class (Low) of\
    \ the object that received the makeLastingPeace message and skips to the superclass\
    \ of Mid, but Mid where makeLastingPeace is defined. Neither implementation finds\
    \ the Mid version of negotiate.\n\nAs this illustrates, super provides a way to\
    \ bypass a method that overrides another method. Here, the use of super enabled\
    \ makeLastingPeace to bypass the Mid version of negotiate that redefined the High\
    \ version of that method.\n\nNot being able to reach the Mid version of negotiate,\
    \ as just described, may seem like a flaw, but under the circumstances it intentional:\n\
    \n- The author of the Low class intentionally overrides the Mid version of negotiate\
    \ so that instances of Low (and its subclasses) would invoke the version of method\
    \ instead. The designer of Low didn't want Low objects to perform the inherited\
    \ method.\n\n- The Mid method makeLastingPeace, sending the negotiate message\
    \ to super (as shown in the second implementation), intentionally skipped over\
    \ the Mid version of negotiate (and over any versions that might be defined in\
    \ classes like Low that inherit from Mid) to perform the defined in the High class.\
    \ The designer of the second implementation of makeLastingPeace wanted to use\
    \ the High version of negotiate and no other.\n\nThe Mid version of negotiate\
    \ could still be used, but it would take a direct message to a Mid instance to\
    \ do so.\n\n# Using super\n\nMessages to super allow method implementations to\
    \ be distributed over more than one class. You can override an existent method\
    \ to modify or to still incorporate the original method in the modification:\n\
    \n```\n- negotiate\n{\n  return [super negotiate];\n}\n```\n\nFor some tasks,\
    \ each class in the inheritance hierarchy can implement a method that does part\
    \ of the job and passes the message to super for the rest. The init method, which\
    \ initializes a newly allocated instance, is designed to work like this. Each\
    \ init method has responsibility for initializing the instance variables defined\
    \ in its. But before doing so, it calls an init method to super to have the classes\
    \ it inherits from initialize their instance variables. Each version of init follows\
    \ this procedure, so classes initialize their instance variables in the order\
    \ of:\n\n```\n- (id)init\n{\n  self = [super init];\n}\n```\n\nMessages to self\
    \ and super\n\n2010-12-08 | 2020 Apple Inc. All Rights Reserved.\n\n# CHAPTER\
    \ 2\n\n# Defining Class\n\n```\nif (self) {\n    ...\n}\n```\n\nInitializer methods\
    \ have additional constraints; they are described in more detail in \"Allocating\
    \ and Initializing Objects\" (page 49).\n\nIt's also possible to concentrate core\
    \ functionality in one method defined in a superclass and subclasses incorporate\
    \ the method through messages to super. For example, every class method that creates\
    \ an instance must allocate storage for the new object and initialize its isa\
    \ variable to the class structure. Allocation is typically left to the alloc and\
    \ allocWithZone: methods defined in the NSObject class. If another class overrides\
    \ these methods (a rare case), it can still get the basic functionality by sending\
    \ a message to super.\n\n# Redefining is simple\n\nsuper is a flag for the compiler\
    \ telling it where to begin searching for the method to perform; it's used only\
    \ as the receiver of a message. But self is a variable name that can be used in\
    \ any number of ways, even assigned a new value.\n\nThere's a tendency to do just\
    \ that in definitions of class methods. Class methods are often concerned not\
    \ with the object, but with instances of class. For example, many class methods\
    \ combine allocation and initialization of an instance, often setting up instance\
    \ variables at the same time. In such a method, it might be tempting to send messages\
    \ to the newly allocated instance and call the instance self, as an instance method.\
    \ But that would be an error. self and super both refer to the receiver—object;\
    \ inside a class method, self refers to the class object. This is an example of\
    \ what not to do:\n\n```\n+(Rectangle)rectangleOf:(NSColor*)color\nself = [[Rectangle\
    \ alloc] init]; // BAD\n[self setColor:];\nreturn [self autorelease];\n```\n\n\
    To avoid confusion, it's better to use a variable than self to refer to an instance\
    \ inside a class\n\n```\n+(id)rectangleOf:(NSColor*)color\nid newInstance = [[Rectangle\
    \ alloc] init]; // GOOD\n[newInstance setColor:];\nreturn [newInstance autorelease];\n\
    ```\n\nIn fact, rather than sending the alloc message to the class, it's often\
    \ better to send alloc to self. This way, if the class is subclassed, the instance\
    \ returned is the same type as the class (for example, array method of NSArray).\n"
