    @synthesize firstName, lastName, age = yearsold;\n\n这指定了 firstName、lastName 和\
    \ age 的访问器将被合成，并且属性 age 由实例变量 yearsold 表示。合成方法的其他方面由最优属性决定（参见“属性声明属性”（第 70 页））。\n\
