    \ 的使用使得 makeLastingPeace 能够跳过重定义了 High 方法版本的 Mid 版本的 `negotiate`。\n\n如上述描述，无法到达\
    \ Mid 版本的 `negotiate` 似乎是一个缺陷，但在这种情况下是有故意的：\n\n- Low 类的作者刻意覆盖了 Mid 版本的 `negotiate`，以便\
    \ Low 的实例（及其子类）能够调用该方法的其他版本。Low 的设计者不希望 Low 对象执行继承的方法。\n\n- Mid 方法 makeLastingPeace\
    \ 通过向 super 发送 `negotiate` 消息（如第二个实现所示），刻意跳过了 Mid 版本的 `negotiate`（以及在继承 Mid 的\
    \ Low 等类中定义的任何版本），以执行在 High 类中定义。makeLastingPeace 第二种实现的设计者想要使用 High 版本的 `negotiate`\
    \ 而使用其他版本。\n\nMid 版本的 `negotiate` 仍然可以使用，但需要向 Mid 实例发送直接消息才能做到。\n\n# 使用 super\n\
    \n向 super 发送消息允许将方法的实现分布在多个类中。你可以覆盖一个现有的方法来修改它，或者在修改中仍然原始方法：\n\n```\n- negotiate\n\
    {\n  return [super negotiate];\n}\n```\n\n对于某些任务，继承层级结构中的每个类都可以实现一个执行部分工作的方法并将剩余部分传递给\
    \ super。初始化新分配实例的 `init` 方法被设计为这样工作。每个 `init` 方法都负责初始化其内部定义的实例变量。但在这样做之前，它会调用\
    \ super 的 `init` 方法，让它继承的类也初始化它们的实例变量。每个 `init` 版本都遵循这一过程，因此类按照以下顺序初始化它们的实例变量：\n\
    \n```\n- (id)init\n{\n  self = [super init];\n}\n```\n\n向 self 和 super 发送消息\n\n\
    2010-12-08 | 2020 Apple Inc. 版权所有。\n\n# 第二章\n\n# 定义类\n\n```\nif (self) {\n   \
    \ ...\n}\n```\n\n初始化方法具有额外的限制；它们在“分配和初始化对象”（第 49 页）中有更详细的描述。\n\n也可以将核心功能集中在父类定义的一个方法中，子类通过向\
