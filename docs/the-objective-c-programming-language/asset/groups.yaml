    # CHAPTER 9

    ## Enabling Static Behavior


    Statically typed objects have the same internal data structures as objects declared
    to be of type id. The type does not affect the effect; it affects only the amount
    of information given to the compiler about the object and the amount of information
    available to those reading the source code.


    Static typing does not affect how the object is treated at runtime. Statically
    typed objects are dynamically allocated by the same methods that create instances
    of type id. If Square is a subclass of Rectangle, the following code would still
    produce an object with all the instance variables of a Square object, not just
    those of a Rectangle:


    ```

    Rectangle *thisObject = [[Square alloc] init];

    ```


    Messages sent to statically typed objects are dynamically bound, as messages to
    typed id are. The exact type of a statically typed receiver is determined at runtime
    as part of the processing message. A display message is sent to the thisObject:


    ```

    [thisObject display];

    ```


    performs the version of the method defined in the Square class, not the one in
    the Rectangle superclass.


    By giving the compiler more information about an object, static typing opens up
    possibilities that are absent for typed id:


    - In certain situations, it allows for compile-time type checking.

    - It can free objects from the restriction that identically named methods must
    have identical return and parameter types.

    - It permits you to use the structure pointer to directly access an object''s
    instance variables.


    The first two possibilities are discussed in the sections that follow. The third
    is covered in “Defining a Class” (page 35).


    ## Type Checking


    With the additional information provided by static typing, the compiler can deliver
    better type-checking in two situations:


    - When a message is sent to a statically typed receiver, the compiler can make
    sure the receiver can respond. A warning is issued if the receiver doesn''t have
    access to the method named in the message.

    - When a statically typed object is assigned to a statically typed variable, the
    compiler makes sure the types are compatible. A warning is issued if they''re
    not.


    An assignment can be made without warning, provided the class of the object being
    assigned is identical to, or inherits from, the class of the variable being assigned.
    The following example illustrates this:


    ```

    Shape *aShape;

    Rectangle *aRect;

    aRect = [[Rectangle alloc] init];

    aShape = aRect;

    ```


    Here aRect can be assigned to aShape because aShape is a kind of shape—the Rectangle
    class inherits from Shape. However, if the roles of the two variables are reversed
    and aShape is assigned to aRect, the compiler generates a warning: not every shape
    is a rectangle. For reference, see Figure 1-2 (page 25), which shows the class
    hierarchy Shape and Rectangle.


    There''s no check when the expression on either side of the assignment operator
    is of type id. A statically typed object can be freely assigned to an id object,
    or an object to a statically typed object. Methods like alloc and init return
    objects of type id, the compiler doesn''t ensure that a compatible object is returned
    to a statically typed variable. The following code is error-prone, but is allowed
    nonetheless


    ```

    Rectangle *aRect;

    aRect = [[Shape alloc] init];

    ```


    ## Return and Parameter Types


    In general, methods in different classes that the selector (the same name) must
    also share the same return and parameter types. This constraint is imposed by
    the compiler to allow dynamic binding. Because the class of a message receiver
    (and therefore class-specific details about the method it''s asked to perform),
    can''t be known at compile time, the compiler must treat all methods with the
    same name alike. When it prepares information on method return and parameter types
    for the runtime system, it creates one method description for each selector.


    However, when a message is sent to a statically typed object, the class of the
    receiver is known by the compiler. The compiler has class-specific information
    about the methods. Therefore, the message is free from the restrictions on its
    return and parameter types.


    ## Static Typing to an Inherited Class


    An instance can be statically typed to its own class or any class that it inherits
    from. All instances, for example, can be statically typed as NSObject.


    However, the compiler understands the class of a statically typed object only
    from the class name in the type designation, and does its type checking accordingly.
    Typing an inherited class can therefore result in discrepancies between what the
    compiler would think at runtime and what actually happens.


    For example, if you type a Rectangle instance as Shape as shown here:


    ```

    Shape *myRect = [[Rectangle alloc] init];

    ```


    the compiler treats it as a Shape instance. If you send the object a message to
    perform a Rectangle method,


    ```

    BOOL solid = [myRect isFilled];

    ```


    the compiler complains. The isFilled method is defined in the Rectangle class,
    not in Shape.


    However, if you send it a message to perform a method that the Shape class knows
    about such


    ```

    [myRectangle display];

    ```


    the compiler doesn''t complain, even though Rectangle overrides the method. At
    runtime, the Rectangle version of the method is performed.


    Similarly, suppose that the Upper class declares a worry method that returns a
    double as shown here:


    - (double)worry;


    and the Middle subclass of Upper overrides the method and declares a new return
    type:


    - (Int)worry;


    If an instance is statically typed to the Upper class, the compiler thinks that
    its worry method returns an Int. Errors if a Middle instance is typed to the Upper
    class: the compiler informs the runtime system that a worry message sent to the
    object returns a double, but at runtime it actually returns int and generates
    an error.


    Static typing can freely identify named methods from the restriction that they
    must have identical return and parameter types, but it can do so reliably only
    if the methods are declared in different branches of the class hierarchy.


    ## Selectors


    In Objective-C, selector has two meanings. It can be used to refer simply to the
    name of a method when it''s used in a source-code message to an object. It also,
    refers to the unique identifier that replaces the name when the source code is
    compiled. Compiled selectors are of type SEL. All methods with the same name have
    the same selector. You can use a selector to invoke a method on an object—this
    provides the basis for the implementation of the target-action design pattern
    in Cocoa.


    ## Methods and Selectors


    For efficiency, all ASCII names are not used as method selectors in compiled code.
    Instead, the compiler writes each method name into a table, then pairs the name
    with a unique identifier that represents the method at runtime. The runtime system
    makes sure each identifier is unique: No two selectors are the same, and all methods
    with the same name have the same selector.


    ## SEL and @selector


    Compiled selectors are assigned to a special type, SEL, to distinguish them from
    other data. Valid selectors are never 0. You must let the system assign SEL identifiers
    to methods; it''s futile to assign them arbitrarily.


    The @selector directive lets you refer to the compiled selector, rather than the
    full method name. Here, the selector for initWith:height is assigned to the setHeight
    variable.


    ```

    SEL setWidthHeight;

    setWidthHeight = @selector(setWidth:);

    ```


    It''s most efficient to assign values to SEL at compile time using the @selector()
    directive. However, in cases, you may need to convert a string to a selector at
    runtime. You can do this with the NSStringFromString function:


    ```

    setWidthHeight = NSNSStringFromString(aBuffer);

    ```


    Conversion in the opposite direction is also possible. The NSStringFromSelector
    function returns a method name for the selector.


    ```

    NSString *method;

    method = NSStringFromSelector(setWidthHeight);

    ```

