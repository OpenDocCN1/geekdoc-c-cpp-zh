  md: "# CHAPTER 1\n\n# Objects-C, Classes, Messaging\n\nObjective-C also provides\
    \ a dot (.) operator that offers a compact and convenient syntax for invoking\
    \ an object's accessor methods. The dot operator is typically used in conjunction\
    \ with the declared properties feature (\"Declared Properties\" (page 69) and\
    \ is described in \"Dot Syntax\" (page 19).\n\n# Sending Messages to nil\n\nIn\
    \ Objective-C, it is valid to send a message to nil—simply has no effect at runtime.\
    \ There are several patterns in Cocoa that take advantage of this fact. The value\
    \ returned from a message to nil may also be valid:\n\n+   - If the method returns\
    \ an object, a message sent to nil returns 0 (nil). For example:\n  Person *motherInLaw\
    \ = [[a spouse] mother];\n- If the spouse object is nil, then mother is sent to\
    \ nil and the method returns nil.\n- If the method returns any pointer type, any\
    \ integer scalar of less than or equal to sizeof(void*), a float, a double, a\
    \ long double, or a long long, then a message sent to nil returns 0.\n- If the\
    \ method returns a struct, as defined by the Mac OS ABI Function Call Guide returns\
    \ 0.0 for every field in the struct.Other struct data types will not be filled\
    \ with zeros.\n- If the method returns anything other than the mentioned value\
    \ types, the return value of a message sent to nil is undefined.\n\nThe following\
    \ code fragment illustrates a valid use of sending a message to nil.\n\n```\n\
    id anObjectMaybeNil = nil;\n\n// this is valid\nif ([anObjectMaybeNil methodReturnsDouble]\
    \ == 0.0)\n{\n    // implementation continues...\n}\n```"
  merge: -1
