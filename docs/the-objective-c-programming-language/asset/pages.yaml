  md: '# Declared Properties


    getter-getterName

    Specifies the name of the accessor for the property. The getter must return a
    type matching the property''s type and take no parameters.


    setter-setterName

    Specifies the name of the accessor for the property. The setter method must take
    a single parameter of a matching type and return void.

    If you specify that property is readonly and also specify a setter with-, you
    get a compiler warning.


    Typically you should specify method names that are key-value coding (see Key-Value
    Coding Programming Guide)—a common reason for using the getter decorator to adhere
    to isProperty convention for Boolean values.


    # Writability


    These attributes specify whether or not a property has an associated setter. They
    are mutually exclusive.


    readwrite

    Indicates that the property should be treated as read/write. The attribute is
    the default.

    Both a getter and setter method are required in the @implementation block. If
    you use the @synthesize directive in the implementation block, the getter and
    setter methods are synthesized.


    readonly

    Indicates that the property is read-only.

    If you specify readonly, only a getter method is required in the @implementation
    block. If you use the @synthesize directive in the implementation block, only
    the getter method is synthesized.

    Moreover, if you attempt to assign a value using the Objective-C syntax, you get
    a compiler error.


    # Setter Semantics


    These attributes specify the semantics of a set accessor. They are mutually exclusive.


    assign

    Specifies that the setter uses simple assignment. This attribute is the default.

    You typically use this for scalar types such as NSInteger and CGRect, (or in a
    reference-counted environment) for objects you don''t own, as delegates.

    retain and assign are effectively the same in a garbage-collected environment.


    retain

    Specifies that retain should be invoked on the object assignment. (The default
    is assign).

    The previous value is sent a release release message.

    Prior to Mac OS X v10.6, this is valid only for Objective-C object types (so you
    cannot specify retain for Core Foundation objects—see “Core Foundation (page 77)).

    In Mac OS X v10.6 and later, you can use the __attribute__ keyword to specify
    that a Core Foundation property be treated like an Objective-C object for memory
    management:

    @property(retain) __attribute__((NSObject)) myDictionary;'
