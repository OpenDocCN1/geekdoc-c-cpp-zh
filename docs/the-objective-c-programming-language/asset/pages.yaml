    # Testing Class Equality


    You can test two class objects for equality using a direct pointer comparison.
    It is important, to get the correct class. There are several features in the Cocoa
    frameworks that dynamically and transparently subclass existing classes to extend
    their functionality (for example, key-value observing and Core Data do this—see
    Key-Value Programming Guide and Core Data Programming Guide respectively). In
    a dynamically-created subclass, the class method is typically overridden so that
    the subclass masquerades as the class it replaces. When testing for class equality,
    you should compare the values returned by the method rather than those returned
    by lower-level functions. In terms of API, the following inequalities permit for
    dynamic subclasses:


    ```

    [object class] != object_getClass(object) != *((Class*)object)

    ```


    You should therefore test two classes for equality as:


