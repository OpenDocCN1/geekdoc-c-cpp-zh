  md: "# Messages to self and super\n\nObjective-C provides two methods that can be\
    \ used within a method definition to refer to the object that performs the method—self\
    \ and super.\n\nSuppose, for example, that you define a reposition method that\
    \ needs to change the coordinates of whatever object it acts on. Can invoke the\
    \ setOrigin:: method to make the change. All it needs to do is send setOrigin::\
    \ the same object that the message itself was sent to. When you're writing the\
    \ reposition code, you can refer to that object as either self or super. The reposition\
    \ method could read either:\n\n```\nreposition {\n    [self setOrigin:someX :someY];\\\
    }\n```\n\nor:\n\n```\nreposition {\n    [super setOrigin:someX :someY];\\}\n```\n\
    \nHere, self and super both refer to the object receiving a reposition message,\
    \ whatever object may happen to be. The two messages are quite different, however.\
    \ self is one of the hidden parameters that the messaging routine passes to every\
    \ method; it is a local variable that can be freely within a method implementation,\
    \ just as the names of instance variables can be. super is a term that substitutes\
    \ for self only as the receiver in a message expression. As receivers, the two\
    \ terms differ in how they affect the messaging process:\n\n+   * self searches\
    \ for the method implementation in the usual manner, starting in the dispatch\
    \ table of the receiving object's class. In the example above, it would begin\
    \ with the class of the object receiving the message.\n* super searches for the\
    \ method implementation in a very different place. It begins in the superclass\
    \ of the class that defines the method where super appears. In the example, it\
    \ would begin with the superclass of the class where reposition is defined.\n\n\
