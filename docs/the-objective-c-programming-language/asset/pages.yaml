  md: '# CHAPTER 6

    Categories and Extensions


    +   * When a category overrides an inherited method, the method in the category
    can, as usual, invoke the inherited implementation via a message to super. However,
    if a category overrides a method that exists in the category''s class, there is
    no way to invoke the original implementation.


    +   * A category cannot reliably override methods declared in another category
    of the same class.


    This issue is of particular significance because many of the Cocoa classes are
    implemented using categories. A framework-defined method you try to override may
    itself have been implemented in a category, and so which implementation takes
    precedence is not defined.


    +   * The very presence of some categories may cause behavior changes across all
    frameworks. For example, if you use the windowWillClose delegate in category on
    NSObject, all window delegates in your program respond when using the category
    method; the behavior of all instances of NSString may change. Categories you add
    on a framework class may cause mysterious changes in behavior and lead to crashes.


    # Categories of the Root Class


    A category can add methods to any class, including the root class. Methods added
    to NSObject become available to all classes that are linked to your code. Adding
    methods to the root class with a category can be useful at times, but it can also
    be dangerous. Although it may seem that the modifications category makes are well
    understood and of limited impact, inheritance gives them a scope. You may be making
    unintended changes to unseen classes in your application; you may not know all
    the consequences of what you''re doing. Moreover, others working on your application,
    who are unaware of your changes, won''t understand what they''re.


    In addition, there are two other considerations to keep in mind when implementing
    methods for the root class:


    +   * Messages to super are invalid (there is no subclass of NSObject).


    +   * Classes objects can perform instance methods defined in the root class.


    Normally, classes can perform only class methods. But instance methods defined
    in the root class are a special case. They define an interface to the runtime
    that all objects inherit. Class objects are full-fledged objects and share the
    same interface.


    This feature means that you need to take into account the possibility that an
    instance method you define in a category of the NSObject class might be performed
    not only by instances but by class objects as well. For example, within the method,
    self might mean a class object as well as an instance. See NSObject Class Reference
    for more information on class access to root methods.


    # Extensions


    Class extensions are like anonymous categories, except that the methods they declare
    must be implemented in the main @implementation block for the corresponding class.'
