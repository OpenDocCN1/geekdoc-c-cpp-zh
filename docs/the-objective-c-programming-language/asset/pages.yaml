  md: '# Declaring Interfaces for Anonymous Objects


    A protocol can be used to declare the methods of an anonymous object, an object
    of unknown class. An anonymous object may represent a service or handle a limited
    set of functions, especially when only one object of its kind is needed.(Objects
    that play a fundamental role in defining an application''s architecture and objects
    that are not anonymous before using are good candidates for anonymity.)


    Objects are not anonymous to their developers, of course, but they are anonymous
    when the developer supplies them to someone else. For example, consider the following
    situations:


    +   - Someone who supplies a framework or a suite of objects for others to use
    objects that are not identified by a class name or interface file. Failing the
    name and class interface, users have no way of creating instances of it. Instead,
    the supplier must provide a ready-made instance. Typically, a method in another
    class returns a usable object:


    ```

    id formatter = [receiver formattingService];

    ```


    The object returned by the method is an object without a class identity, at least
    not one supplier is willing to reveal. For it to be of any use at all, the supplier
    must be identifying at least some of the messages it can respond to. The messages
    are identified by associating the object with a list of methods declared in a
    protocol.


    +   - You can send Objective-C messages to remote objects—in other applications
    ("Remote Messaging in the Objective-C Runtime Programming Guide, discusses this
    in more detail.)


    Each application has its own structure, classes and internal logic. But you don''t
    need to know how another application works or what components it to communicate
    with it. As an outsider, you need to know what messages you send (the protocol)
    and where to send them (the receiver).


    An application that publishes one of its objects as a potential receiver of remote
    messages must also publish a protocol declaring the methods the object will use
    to respond to messages. It doesn''t need to disclose anything about the object.
    The sending application doesn''t need to know the class of the object or the class
    in its own design. All this is needed.


    Protocols make anonymous objects possible. Without a protocol, there would be
    no way to declare an interface to an object without identifying its class.


    > Note: Even though the supplier of an anonymous object doesn''t reveal its class,
    the object itself reveals it at runtime. However, there''s usually little point
    in discovering this extra information; the information in the protocol is sufficient.


    # Nonhierarchical Similarities


    If more than one class implements a set of methods, those classes are often grouped
    under an abstract class that declares the methods they have in common. Each subclass
    can reimplement the methods in its own way, but the inheritance hierarchy and
    the common declaration in the abstract class capture the similarity between the
    subclasses.'
