  md: "# Threading\n\n```\nid accountSemaphore = [Account semaphore];\n@synchronized(accountSemaphore)\
    \ {\n  // Critical code.\n}\n```\n\nThe Objective-C synchronization feature supports\
    \ recursive and reentrant code. A thread can use a single\nsemaphore several times\
    \ in a recursive manner; other threads are blocked from using it until the thread\n\
    releases all the locks obtained with it; that is, every @synchronized() block\
    \ is exited normally or through\nan exception.\n\nWhen code in an @synchronized()\
    \ block throws an exception, the Objective-C runtime catches the\nexception, releases\
    \ the semaphore (so that the protected code can be executed by other threads),\
    \ and\nrethrows the exception to the next exception handler."
  merge: -1
