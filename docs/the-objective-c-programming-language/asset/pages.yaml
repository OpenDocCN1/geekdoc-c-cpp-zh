    \ a static variable limits its scope to the class—and to just the part of the\
    \ class that's implemented in file. (Unlike instance variables, static variables\
    \ cannot be inherited, or directly manipulated by subclasses.) This pattern is\
    \ commonly used to define shared instances of a class (such as singlelets); \"\
    Creating a Singleton Instance\" in Cocoa Fundamentals Guide.)\n\n```\nstatic MyClass\
    \ *MCLASSSharedInstance;\n```\n\n```\n@implementation MyClass\n\n+(MyClass *)sharedInstance\n\
    {\n    // check for existence of shared instance\n    // create if necessary\n\
    \    return MCLASSSharedInstance;\n}\n// implementation continues\n```\n\nStatic\
    \ variables give the class object more functionality than just of a factory producing\
    \ instances; it can approach being a complete and versatile object in its own.\
    \ A right class can be used to coordinate the instances it creates, dispense instances\
    \ from lists of objects already created, or manage others essential to the application.\
    \ In the case you need only one object of a particular class, you can put the\
    \ object's state into static variables and use only class methods. This saves\
    \ the step of allocating and initializing an instance.\n\n> Note: It is also possible\
    \ to use external variables that are not declared static, but the limited scope\
    \ of static variables serves the purpose of encapsulating data into separate objects.\n\
    \n# Initializing a Class Object\n\nIf you want to use a class object for anything\
    \ besides allocating instances, you may need to initialize it as you would instance.\
    \ Although programs do not allocate objects, Objective-C provides a way for programs\
    \ to initialize them.\n\nIf a class makes use of static or global variables, the\
    \ initialize method is a good place to set their initial values. For example,\
    \ if a class maintains an array of instances, the initialize method could set\
    \ up the array and even one or two defaults instances to have ready.\n\nThe runtime\
    \ system sends an initialize message to class object before it receives any other\
    \ messages and after its superclass has received the initialize message. This\
    \ sequence gives the class to set up its runtime environment before it's used.\
    \ If initialization is not needed, you don't need to write an initialize method\
    \ to respond to the message.\n\nBecause of inheritance, an initialize message\
    \ sent to a class that doesn't implement it is forwarded to the superclass, even\
    \ though the superclass has already received the initialize message. For example,\
    \ assume class A implements the initialize method, and class B inherits from class\
    \ A but does not implement the initialize method. Just before class B is to receive\
    \ its first message, the runtime system sends initialize to it. But, because class\
    \ B doesn't implement initialize, class A is executed instead. Therefore, class\
    \ A should ensure that its initialization logic is performed only once, and for\
    \ the appropriate class."
