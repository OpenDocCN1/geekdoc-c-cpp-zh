  md: '# Introduction


    The Objective-C language is a computer language designed to enable sophisticated
    object-oriented programming. Objective-C is defined as a small but powerful set
    of extensions to the standard ANSI C language. Its additions to C are mostly based
    on Smalltalk, one of the first object-oriented programming languages. Objective-C
    is designed to give C full object-oriented programming capabilities, and to do
    so in a simple and straightforward way.


    Most object-oriented development environments consist of several parts:


    +   * An object-oriented programming language

    * A library of objects

    * A suite of development tools

    * A runtime environment


    This document is the first component of the development environment—the programming
    language. It fully describes the version of the Objective-C language released
    in Mac OS X10.6 and iOS 4.0. This document also provides a foundation for learning
    about the second component, the Objective-C application frameworks—collectively
    known as Cocoa. The runtime environment is described in a separate document, Objective-C
    Runtime Programming Guide.


    # Who Should Read This Document


    The document is intended for readers who may be interested in:


    +   * Programming in Objective-C

    * Finding out about the basis for the Cocoa application frameworks


    This document introduces both the object-oriented model that Objective-C is based
    upon and fully documents the language. It concentrates on the Objective-C extensions
    to C, not on the C language itself.


    Because this isn''t a document about C, it assumes some acquaintance with that
    language. Object-oriented programming in Objective-C is, however, sufficiently
    different from procedural programming in ANSI C that you won''t be hampered if
    you''re not an experienced C programmer.


    # Organization of This Document


    The following chapters cover all the features Objective-C adds to standard.'
