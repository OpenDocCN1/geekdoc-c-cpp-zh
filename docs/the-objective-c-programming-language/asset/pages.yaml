    The alloc dynamically allocates memory for the new object''s instance variables
    and initializes them to 0–nil, that is, except the isa variable that connects
    the new instance to its class. For an object to be useful, it generally needs
    to be more completely initialized. The function of an init method typically follows
    immediately after allocation:


    ```

    myRectangle = [[Rectangle alloc];

    ```


    This line of code, or one like it, would be necessary before myRectangle could
    receive any of the messages that were illustrated in previous examples of this
    chapter. The alloc method returns a new instance and that performs an init method
    to set its initial state. Every class object has at least one method (like alloc)
    that enables it to produce objects, and every instance has at least one method
    (like init) that prepares it for use. Initialization methods take parameters to
    allow particular values to be passed and have keywords to load the parameters
    (initWithPositionSize; for example, is method that might initialize a new Rectangle
    instance), but every initialization method begins with "init":


    # Customization with Class Objects


    It''s not just the Objective-C language that classes are treated as objects. It''s
    a choice that has been intended, with surprising, benefits for design. It''s possible,
    for example, to customize an object with a class, where the class belongs to an
    open-ended set. In AppKit, for example, NSMatrix object can be customized with
    a particular kind of NSCell object.


    An NSMatrix object can take responsibility for creating the individual objects
    that represent its cells. It can do this when the matrix is first initialized
    and when new cells are needed. The visible matrix that NSMatrix draws on the screen
    can grow and shrink at runtime, in response to user actions. When it grows, the
    matrix needs to produce new objects to fill the slots that are added.


    But what kind of objects should they be? Each matrix displays just one kind of
    NSCell, but there are many different kinds. The inheritance hierarchy in Figure
    1-3 shows some of those provided by AppKit. All inherit from the generic NSCell
    class.'
