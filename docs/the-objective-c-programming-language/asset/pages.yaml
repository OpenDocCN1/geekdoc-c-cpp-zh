  md: '# CHAPTER 1


    Objects, Classes, and Messaging


    # Dynamic Binding


    A crucial difference between function calls and messages is that a function and
    its parameters are joined together in the compiled code, a message and a receiving
    object aren''t united until the program is running and the message is sent. Therefore
    the exact method invoked to respond to a message can be determined only at runtime,
    when the code is compiled.


    When a message is sent, a runtime messaging routine looks at the receiver and
    the method named in the message. It locates the receiver''s implementation of
    a method matching, "calls" the method, and passes a pointer to the receiver''s
    instance variables.(For more on this routine, "Messaging" in Objective-C Runtime
    Programming Guide.)


    This dynamic binding of methods works in hand with polymorphism to give object-oriented
    programming much of its flexibility and power. Because each object can have its
    own version of a method, an Objective-C statement can enable a variety of results,
    not by binding the message but by the object that receives the message. Receivers
    can be defined as the program runs; the choice of receiver can be made dependent
    on factors such as user actions.


    When executing code based upon the Application Kit (AppKit), for example, users
    determine which objects receive messages from commands such as Cut, Copy, and
    Paste. The message goes to object controls the selection. An object that displays
    text would read to a copy differently than an object that displayed images. An
    object that represents a set of shapes would respond differently to a copy message
    because messages do not select methods until runtime (from another perspective,
    binding of methods does not occur until runtime), these differences in behavior
    are isolated to the objects themselves. The code that sends the message doesn''t
    have to be concerned with them; it doesn''t have to enumerate the possibilities.
    Application objects can each respond in its own way copy messages.


    Objective-C dynamic binding one step further and allows even the message that''s
    sent (the method selector) to be a variable determined at runtime. This mechanism
    is discussed in the section "Messaging" in Objective-C Runtime Programming Guide.


    # Dynamic Method Resolution


    You can provide implementations of class and instance methods at runtime using
    dynamic method resolution. See "Dynamic Method Resolution" in Objective-C Runtime
    Programming Guide for more details.


    # Dot Syntax


    Objective-C provides a dot (.) operator that offers an alternative to square bracket
    notation [] to invoke accessor methods. Dot syntax uses the same pattern as accessing
    C structure elements:


    ```

    myInstance.value = 10;

    printf("myInstance.value: %d", myInstance.value);

    ```


    When used with objects, dot syntax acts as "syntactic sugar"\it is transformed
    by the compiler into an invocation of an accessor method. Dot syntax does not
    directly get or set an instance variable. The code example above is exactly equivalent
    to the following:


    ```

    [myInstance setValue:10];

    printf("myInstance.value: %d", [myInstance value]);

    ```'
