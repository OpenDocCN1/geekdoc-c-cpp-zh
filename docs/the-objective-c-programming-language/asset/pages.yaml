    **abstract superclass** Same as abstract class.


    **class method** In the Objective-C language, a method that can operate on class
    objects rather than instances of classes


    **adopt** object of unknown class, a class is said to adopt a protocol if it declares
    it implements all the methods in the protocol. Protocols are adopted by listing
    their names between brackets in a class or category declaration.


    **class object** In the Objective-C language, an object that represents a class
    and knows how to create instances of it. Class objects are created by the compiler,
    but otherwise behave like instance variables, and can be like all other objects.
    As the receiver in a message expression, a class object is represented by the
    class name.


    **anonymous object** An object of unknown class. The interface to it is through
    protocol declaration.


    **Cocoa** An object-oriented development platform for Mac OS. Cocoa is a set of
    frameworks whose primary programming interfaces are in Objective-C.


    **AppKit** Sometimes called *Application Kit* framework that implements an user''s
    interface. AppKit provides a basic program structure for applications that draw
    on the screen and respond to events.


    **compile time** The time when code is compiled. Decisions made at compile time
    are constrained by the amount and information contained in source files.


    **asynchronous message** A message that returns immediately, without waiting for
    the message to respond. The sending application and the receiving application
    act independently, and are not in sync.


    **conform** In the Objective-C language, a class is said to conform to a protocol
    if it (or a subclass) implements the methods declared in the protocol. An instance
    conforms to a protocol if its class does. Thus, an instance that conforms to a
    protocol may perform any of the instance methods declared in the protocol.


    **category** In the Objective-C language, a set of method definitions that is
    segregated from the rest of the class definition. Categories can be used to split
    a class into parts or to add methods to an existing class.


    **delegate** An object that acts on behalf of another object.


    **class** In the Objective-C language, a prototype for a particular kind of object.
    A class definition declares instance variables and defines methods for all members
    of the class. Objects that have the


