    \ the second implementation of makeLastingPeace wanted to use the High version\
    \ of negotiate and no other.\n\nThe Mid version of negotiate could still be used,\
    \ but it would take a direct message to a Mid instance to do so.\n\n# Using super\n\
    \nMessages to super allow method implementations to be distributed over more than\
    \ one class. You can override an existent method to modify or to still incorporate\
    \ the original method in the modification:\n\n```\n- negotiate\n{\n  return [super\
    \ negotiate];\n}\n```\n\nFor some tasks, each class in the inheritance hierarchy\
