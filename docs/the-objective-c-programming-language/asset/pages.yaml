  md: '# CHAPTER 4

    Protocols


    When a class adopts a protocol, it must implement the required methods the protocol
    declares, as mentioned earlier. In addition, it must conform to any protocols
    the adopted protocol incorporates. If an incorporated protocol incorporates other
    protocols, the class must also conform to them. A class can conform to an incorporated
    protocol using either of these techniques:


    +   * Implementing the methods protocol declares

    * Inheriting from a class that adopts the protocol and implements the methods


    Suppose, for example, the Pager class adopts the Paging protocol. If Pager is
    a subclass of NObject as shown here:


    ```

    @Interface Pager : NSObject < Paging >

    ```


    it must implement all the Paging methods, including those declared in the incorporated
    Formatting protocol. It adopts the Formatting protocol along Paging.


    On the other hand, if Pager is a subclass of Formatter (a class that independently
    adopts the Formatting protocol) as shown here:


    ```

    @Interface Pager : Formatter < Paging >

    ```


    it must implement all the methods declared in the Paging protocol proper, but
    not declared in Formatting. Pager inherits conformance to the Formatting protocol
    from Formatter.


    Note that a class can conform to a protocol without adopting it, by implementing
    the methods declared in the protocol.


    # Referring to Other Protocols


    When working on complex applications, you occasionally find yourself writing code
    that looks like this:


    ```

    #import "B.h"

    @protocol A

    foo:(id <B>)anObject;

    end

    ```


    where protocol B is declared like this:


    ```

    #import "A.h"

    @protocol B

    bar:(id <A>)anObject;

    end

    ```


    In such a situation, circularity results and neither file will compile correctly.
    To break this recursive cycle, you must use the @protocol directive to make a
    forward reference to the needed protocol instead of importing the interface file
    where the protocol is defined:


    ```

    @protocol B

    @protocol A

    ```


    Referring to Other Protocols

    2010-12-08 | © 2010 Apple Inc. All Rights Reserved.'
