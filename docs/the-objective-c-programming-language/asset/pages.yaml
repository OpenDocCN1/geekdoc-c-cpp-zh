  md: "# Exception Handling\n\nThe Objective-C language has an exception-handling\
    \ syntax similar to that of Java and C++. By using this syntax with the Exception,\
    \ NSError, or custom classes, you can add robust error-handling to your programs.\
    \ This chapter provides a summary of exception syntax and handling; for more details,\
    \ see *Exception Programming Topics*.\n\n# Enabling Exception-Handling\n\nUsing\
    \ GNU Compiler Collection (GCC) version 3.3 and later, Objective-C provides language-level\
    \ support for exception handling. To turn on support for these features, use the\
    \ -fobjc-exceptions switch of the GNU Compiler Collection (GCC) version 3.3 and\
    \ later. (Note that this makes application runnable on Mac OS X10.3 and later\
    \ runtime support for exception handling and synchronization is not present in\
    \ earlier versions of the software.)\n\n# Exception Handling\n\nAn exception is\
    \ a special condition that interrupts the normal flow of program execution. There\
    \ are a variety of reasons why an exception may be generated (exceptions are typically\
    \ said to be raised or thrown), by hardware or as software. Examples include arithmetic\
    \ errors such as division by zero, underflow or overflow, calling undefined instructions\
    \ (such as attempting to invoke an unimplemented method), and attempting to access\
    \ a collection out of bounds.\n\nObjective-C exception uses four controllers:\
    \ @try, @catch, @throw, and @finally:\n\n+   - Code that can throw an exception\
    \ is enclosed in a @try block.\n- A @catch block contains exception-handling logic\
    \ for exceptions thrown in a @try block. You can have multiple @catch blocks to\
    \ different types of exception. For a code example, *Catching Different Types\
    \ of Exception* (page 104).\n- You use the @throw to throw an exception, which\
    \ is essentially an Objective-C object. You typically use an NSException object,\
    \ but you are not required to.\n- A @finally block contains code that must be\
    \ executed whether an exception is thrown or not.\n\nThis example depicts a simple\
    \ exception-handling algorithm:\n\n```\nCup cup = [[Cup alloc] init];\n@try {\n\
    \  [cup fill];\n}\n```"
