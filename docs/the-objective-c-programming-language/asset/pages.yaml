  md: '# GLOSSARY


    indirectly invoke the designated initializer, the designated initializer, a message
    to `super`, invokes the designated initializer of its superclass.


    id In the Objective-C language, the general type for any kind of object regardless
    of class. `id` is defined as a pointer to an object data structure. It can be
    used for both class and instances of a class.


    dispatch table The Objective-C runtime table contains entries that associate selectors
    with the class-specific addresses of the methods they identify.


    implementation The part of an Objective-C specification that defines public methods
    (declared in the class interface) as well as private methods (not declared in
    the class''s interface).


    distributed objects An architecture that facilitates communication between objects
    in different address spaces.


    informal protocol In Objective-C language, a protocol declared as a category,
    is a category of the NSObject class. The language gives explicit support to protocols,
    but not to informal ones.


    dynamic allocation A technique used in C-based languages where the operating system
    provides memory to a running application as it needs, instead of it launches.


    Inheritance In object-oriented programming, the ability of a subclass to inherit
    its characteristics (methods and instance variables) onto its subclasses.


    inheritance hierarchy In object-oriented programming, the hierarchy of classes
    that is defined by the arrangement of subclasses and classes. Every class (except
    root classes as NSObject) has a superclass, and may have unlimited number of subclasses.
    Through its subclass, class inherits from above it in the hierarchy.


    dynamic binding Binding to a message—that is, finding the method implementation
    to invoke in response to the message—at runtime, rather than at compile time.


    dynamic typing Discovering the class of an object at runtime rather than at compile
    time.


    instance In the Objective-C language, an object that belongs to (is a member of)
    a particular class. Instances are created at runtime using the specification in
    the class definition.


    encapsulation A programming technique that hides the implementation of an operation
    from its users by an abstract interface. It allows the implementation to be updated
    or changed without impacting the users of the object.


    instance method In the Objective-C language, any method that can be called by
    an instance of a class rather than the class itself.


    event The direct or indirect report of external activity, especially user activity
    on the keyboard and mouse.


    instance variable In the Objective-C language, any variable that part of the internal
    data structure of an instance. Instance variables are declared in a class definition
    and become part of all objects that inherit from the class.


    factory Same as a class object.


    factory object Same as class object.


    interface The part of an Objective-C specification that declares its public interface,
    which includes its supername, instance variables, and public-method protocols.


    formal protocol In the Objective-C language, a protocol that''s declared with
    `@protocol` directive. Classes can adopt formal protocols, objects can respond
    when asked to a formal protocol, and instances can be typed by the protocols they
    conform to.


    Interface Builder A tool that lets you graphically specify your application''s
    interface. It sets up the corresponding objects for you and makes it easy for
    you to establish connections between these objects and your own code where needed.


    framework A way to package a related set of classes, protocols, and functions
    together with localized strings, online documentation, and other pertinent files.
    Cocoa provides the Foundation framework and the App framework, among others.'
