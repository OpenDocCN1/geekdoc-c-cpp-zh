  md: "# CHAPTER 11\n\nException Handling\n\n```\n@catch (NSException *exception)\
    \ {\n    NSLog(@main: Caught %@:%@\", [exception name], [exception reason]);\n\
    }\nfinally {\n    [cup release];\n}\n```\n\n# Catching Different Types of Exception\n\
    \nTo catch an exception thrown in a @try[] block, use one or more @catch[] blocks\
    \ following the @try block. The @catch[] blocks should be ordered from most-specific\
    \ to least-specific. That way you can tailor the processing of exceptions groups,\
    \ as shown in Listing 11-1.\n\n**Listing 11-1** An exception handler\n\n```\n\
    @try {\n@catch (CustomException *ce) {\n    // 1\n}\n@catch (NSException *ne)\
    \ {\n    // 2\n    // Perform processing necessary at this level\n}\n@catch (id\
    \ ue) {\n}\nfinally {\n    // 3\n    // Perform processing necessary whether an\
    \ exception occurred or not.\n}\n```\n\nThe following list describes the numbered\
    \ code lines:\n\n+   1. Catches the most specific exception type.\n2. Catches\
    \ a more general exception type.\n3. Performs any clean-up processing that must\
    \ always be performed, whether exceptions were thrown or not.\n\n# Throwing Exceptions\n\
    \nTo throw an exception, you must instantiate an object with the appropriate information,\
    \ such as the exception name and the reason it was thrown.\n\n```\nNSException\
    \ *exception = [NSException exceptionWithName:@\"HotTeaException\" reason:@\"\
    The tea is too hot\"]\n```"
