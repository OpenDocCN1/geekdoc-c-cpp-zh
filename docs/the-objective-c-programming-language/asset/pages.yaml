  md: '# Objects, Classes, and Messaging


    This chapter describes the fundamentals of objects, classes, and messaging as
    used and implemented by the Objective-C language. It also introduces the Objective-C
    runtime.


    # The Runtime System


    The Objective-C language defers as many decisions as it can from compile time
    and link time to runtime. Whenever possible, it dynamically performs operations
    such as creating objects and determining what method to invoke. Therefore, the
    language requires not just a compiler, but also a runtime to execute the compiled
    code. The runtime system acts as a kind of operating system for the Objective-C
    language; it''s what makes the language work. Typically, however, you do need
    to interact with the runtime directly. To understand more about the functionality
    it offers, though, see Objective-C Runtime Programming Guide.


    # Objects


    As the names imply, object-oriented programs are built around objects. An object
    associates with the particular operations that can use or affect that data. Objective-C
    provides a data type to identify an object variable without specifying a particular
    class of the object.


    # Object Basics


    An object associates with the particular operations that can use or affect that
    data. In Objective-C, these operations are known as the object''s methods; the
    data they affect are instance variables (in environments they may be referred
    to as iv or member variables). In essence, an object bundles a data structure
    (instance variables) and a group of procedures into a self-contained programming
    unit.


    In Objective-C, an object''s instance variables are internal to the object; generally,
    you get access to them only through the object''s methods (you can specify which
    subclasses or other objects can access instance variables directly by using scope
    selectors, see "The Scope of Instance Variables" (page 40)). For others to find
    out anything about an object, there has to be a method to supply the information.
    For example, a rectangle would reveal its size and position.


    Moreover, an object sees only the methods that were designed for it; it can not
    mistakenly perform methods intended for other types of objects. Just as a C function
    protects its local variables, hiding them from the rest of the program, an object
    hides both its instance variables and its method implementations.'
