  md: '# CHAPTER 1

    Objects, Classes, and Messaging


    Note: The behavior of sending messages to nil changed slightly with Mac OS X10.5.

    Mac OS X10.4 and earlier, a message to nil is also valid, as long as the message
    returns an object, any pointer type, void, or any integer scalar of size less
    than or equal to sizeof(void); if it does, a message sent to nil returns anything
    other than the aforementioned value (for example, if the message sent to nil returns
    any struct, any floating-point number, or any vector) the return value is undefined,
    in Mac OS X10.4 and earlier, you should not rely on the return value of messages
    sent to nil unless the return type is an object, any pointer type, or any integer
    scalar of size less than or equal to sizeof(void).


    # The Receiver''s Instance Variables


    A method has automatic access to the receiving object''s instance variables. You
    don''t need to pass them to the method as parameters. For example, the primaryStage
    method implemented above takes no parameters, yet it can find the color forRect
    and return it. Every method assumes the receiver and its instance variables without
    having to declare them as parameters.


    This convention uses Objective-C source code. It also supports the object-oriented
    programmers think about objects and messages. Messages are sent to receivers whose
    letters are delivered to the home. Message parameters bring information from the
    outside to the receiver; they don''t need to bring the receiver to itself.


    A method has access only to the receiver''s instance variables. If it requires
    information about a stored variable in another object, it must send a message
    to the object asking to reveal the contents of the variable. The primaryStage
    and isFilled methods shown early are just for this purpose.


    See "Defining a Class" (page 35) for more information on referencing instance
    variables.


    # Polymorphism


    As the earlier examples illustrate, messages in Objective-C appear in the same
    syntactic positions as function called in C. But, because messages "belong" to
    an object, messages don''t behave in the same way that function calls.


    In particular, an object can be operated on by only those methods that were defined
    for it. It can''t confuse methods defined for other kinds of object, even if another
    object has a method with the same name. Therefore, two objects can respond to
    the same message. For example, each kind of object that receives a display message
    could display itself in a unique way. A Circle and a Rectangle would respond differently
    to identical identifications to track the cursor.


    This feature, referred to as polymorphism, plays a significant role in the design
    of object-oriented programs. With dynamic binding, it permits you to write code
    that might apply to any number of different kinds of objects, without having to
    choose at the time what kinds of objects they might be. They might be objects
    that will be developed later, by other programmers working on other projects.
    If you write code that sends a display message to an id variable, any object that
    has a display method is a potential receiver.


