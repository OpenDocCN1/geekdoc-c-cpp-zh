  md: '# Protocol Objects


    Just as classes are represented at runtime by class objects and methods by selectors,
    formal protocols are represented by a special data type—instances of the Protocol
    class. Source code that deals with a protocol (other than to use it in a type
    specification) must refer to the corresponding protocol object.


    In many ways, protocols are similar to class definitions. They both declare methods,
    and at runtime they are both represented by classes—instances of Class and by
    instances of Protocol. Like class objects, protocols are created automatically
    from the declarations and definitions found in source code and they''re not allocated
    and initialized in program code.


    Source code can refer to a protocol using the @protocol() directive—the same directive
    that declares a protocol, except that it has a set of trailing parentheses. The
    parentheses enclose the protocol name:


    ```

    Protocol *myXMLSupportProtocol = @protocol(MyXMLSupport);

    ```


    This is the only way that source code can conjure a protocol object. Unlike a
    class name, a protocol name does not designate the object—except inside @protocol().

    The compiler creates an adapter for each protocol declaration it encounters, but
    only if the protocol it is:


    +   - Adopted by a class, or

    - Referred to somewhere in source code (using @protocol())


    Protocols that are declared but not used (except for type checking as described
    below) aren''t represented by protocol objects at runtime.


    # Adopting a Protocol


    Adopting a protocol is similar in ways of declaring a subclass. Both methods assign
    methods to the class. The superclass declaration assigns the protocol methods
    declared in the protocol list. A class is said to adopt a formal protocol if its
    declaration lists the protocol within angle brackets after the superclass:


    ```

    @Interface ClassName : Superclass < protocol list >

    ```


    Categories adopt protocols in the same way:


    ```

    @Interface ClassName ( CategoryName ) < protocol list >

    ```


    A class can adopt more than one protocol; names in the protocol list are separated
    by commas.

    @Interface Formatter : NSObject < Formatting, Prettyifying >


    A class or category that adopts a protocol must implement all the required methods
    the protocol declares, otherwise the compiler issues a warning. The Formatter
    class above would define the required methods declared in the two protocols it
    adopts, in addition to any it might have declared itself.'
