  md: "# CHAPTER 3\nAllocating Objects\n\nIn some cases, this responsibility can mean\
    \ returning a different object from the receiver. For example, if a class needs\
    \ a list of objects, it might provide an `initWithName:` method to initialize\
    \ new instances. If there can be no than one object per name, `initWithName:`\
    \ might refuse to assign the same name to a new instance, and asked is already\
    \ being used by another object, it may free the newly allocated instance and return\
    \ the other object—thus ensuring the uniqueness of the name while at the same\
    \ time providing what was asked for, in an instance.\n\nIn a few cases, it might\
    \ be impossible for an `init...` method to do what it's asked to do. For example,\
    \ `initFromFile:` method might get the data from a file passed as an argument.\
    \ If the filename passed doesn't correspond to an actual file, it will fail to\
    \ complete the initialization. In such a case, the `init...` method could free\
    \ the receiver and return `nil`, indicating that the requested object cannot be\
    \ created.\n\nBecause an `init` method might return other than the newly allocated\
    \ object, or even return `nil`, it is important that programs use the value returned\
    \ by the initialization method, not just that of `alloc` or `allocWithName`. The\
    \ following code is very dangerous, since it ignores the return of `init`.\n\n\
    ```\nid addObject = [[SomeClass alloc];\n[anObject init];\n[anObject someOtherMessage];\n\
    ```\n\nTo initialize an object, you should combine allocation and initialization\
    \ messages in one line\n\n```\nid addObject = [[SomeClass alloc] init];\n[anObject\
    \ someOtherMessage];\n```\n\nIf there's a case the `init...` method might return\
    \ `nil` (see \"Handling Initialization Failure\" (page 52)), then you should check\
    \ the return value before proceeding:\n\n```\nid addObject = [[SomeClass alloc]\
    \ init];\nif (anObject)\n    [anObject someOtherMessage];\nelse\n```\n\n# Implementing\
    \ an Initializer\n\nWhen an object is created, all bits of memory (except for\
    \ `isa`)—and the values for all instance variables—are set to 0. In some situations,\
    \ this may be all you require when an object is initialized; in many cases, you\
    \ want to provide default values for an object's instance variables, or you want\
    \ to pass values as parameters to the initializer. In these other cases, you need\
    \ to write a custom initializer. In Objective-C, custom initializers are subject\
    \ to more constraints and conventions than are most other methods.\n\n# Constraints\
    \ and Conventions\n\nThere are several constraints and conventions that apply\
    \ to initializer methods that do not apply to other methods:\n\n+   * By convention,\
    \ the name of a custom initializer method begins with `init`.\n\nImplementing\
    \ an Initializer\n2010-12-08 | © 2010 Apple Inc. All Rights Reserved."
