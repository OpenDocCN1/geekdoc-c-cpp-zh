  md: "# Memory Management\n\nIn any program, it is important to ensure that objects\
    \ are deallocated when they are no longer—otherwise your application's memory\
    \ footprint becomes larger than necessary. It is also important to ensure that\
    \ you do not deallocate objects while they're being used.\n\nObjective-C offers\
    \ two mechanisms for memory management that allow you to meet these goals:\n\n\
    +   * **Reference counting**, you are ultimately responsible for determining the\
    \ lifetime of objects.\n  Reference counting is described in *Memory Management\
    \ Programming Guide.*\n\n+   * **Garbage collection**, you pass responsibility\
    \ for determining the lifetime of objects to an automatic \"collector.\"\n  Garbage\
    \ collection is described in *Garbage Collection Programming Guide*. (Not available\
    \ for iOS—you cannot access this document through the iOS Dev Center.)\n\n# Object\
    \ Messaging\n\nThis section explains the syntax of sending messages, including\
    \ how you can nest message expressions. It also discusses the scope or \"visibility\"\
    \ of an object's instance variables, and the concepts of polymorphism and dynamic\
    \ binding.\n\n# Message Syntax\n\nTo get an object to do something, you send it\
    \ a **message** telling it to apply a method. In Objective-C, **message expressions**\
    \ are enclosed in brackets:\n\n```\n[receiver message]\n```\n\nThe **receiver**\
    \ is an object, and the message tells it what to do. In source code, the message\
    \ is the name of a method and what parameters it takes. When a message is sent,\
    \ the runtime system selects the appropriate method from the receiver's repertoire\
    \ and invokes it.\n\nFor example, this message tells the `myRectangle` object\
    \ to perform its `display` method, which causes the rectangle to display itself:\n\
    \n```\n[myRectangle display];\n```\n\nThe message is followed by a \":\"—as is\
    \ normal for a statement in C.\n\nBecause the method name in a message serves\
    \ to \"select\" a method implementation, method names in messages are often referred\
    \ to as **selectors**.\n\nMethods can also take parameters, sometimes called `arguments`.\
    \ A message with a single parameter affixes a colon (:) to the name and puts the\
    \ parameter right after the colon:\n\n```\n[myRectangle setWidth:20];\n```"
  merge: -1
  pgno: 14
