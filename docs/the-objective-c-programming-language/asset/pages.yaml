  md: '# Methods and Selectors


    Compiled selectors identify name, not method implementations. The display method
    for one class, for example, has the same selector as display methods defined in
    other classes. This is essential for polymorphism and dynamic binding; it lets
    you send the message to receivers belonging to different classes. If there were
    one selector per method implementation, a message would be different from a function
    class.


    A class and an instance method with the same name are assigned the same selector.
    However, because of their separate domains, there''s no confusion between the
    two. A class could define a display method in addition to a display instance method.


    # Method Return and Parameter Types


    The messaging routine has access to method implementations only through selectors,
    so it treats all methods with the same selector alike. It discovers the return
    type of a method, and the data types of its parameters, from the selector. However,
    except for messages sent to typed receivers, dynamic binding requires all implementations
    of identically named methods to have the same return type and same parameter types
    (Statically typed receivers are an exception to this rule because the compiler
    can learn about the method implementation from the class type).


    Although identically named class methods and instance methods are represented
    by the same selector, they can have different parameter types and return types.


    # Varying the Message at Runtime


    The performSelector:performSelector:withObject; and performSelector:withObject:with
    methods defined in the NSObject protocol, take SEL as their initial parameters.
    All three methods map directly into the messaging function. For


    ```

    [friend performSelector:@selector(gossipAbout:)

    withObject:aNeighbor];

    ```


    is equivalent to:


    ```

    [friend gossipAbout:aNeighbor];

    ```


    These methods make possible to vary a message at runtime, just as it''s possible
    to vary the object that receives the message. Variable names can be used in both
    halves of a message expression:


    ```

    id helper = getTheReceiver();nSEL request = getSelector();n[helper performSelector:request];

    ```


    In this example, the receiver (helper) is chosen at runtime (by the fictitious
    getReceiver function), and the method the receiver is asked to perform (request)
    is also determined at runtime (by the equally fictitious getSelector function).'
