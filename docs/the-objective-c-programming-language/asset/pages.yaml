    # Property Implementation Directives


    You can use the @synthesize and @dynamic directives in @implementation blocks
    to trigger specific actions. Note that neither is required for any given @property
    declaration.


    > **Important:** If you do not either @synthesize or @dynamic for a particular
    property, you must provide a getter and setter (or just a readonly property) property
    method implementation for that property. If you do not, the compiler generates
    a warning.


    @synthesize

    You use the @synthesize directive to tell the compiler that it should synthesize
    the setter and/or getter methods for a property if you do not supply them within
    the @implementation block.


    +   Listing 5-2 Using @synthesize

    @interface MyClass : NSObject


    NSString *value;

    @property (copy, readwrite) NSString *value;

    @end


    @implementation MyClass

    @synthesize value;

    @end


    You can use the property-ivar to indicate that a particular instance variable
    should be used for the property, for example:

    @synthesize firstName, lastName, age = yearsold;


    This specifies the accessor for firstName, lastName, and age will be synthesized
    and that the property age is represented by the instance variable yearsold. Other
    aspects of the synthesized methods are determined by the optimal attributes (see
    "Property Declaration Attributes" (page 70).


    Whether or not you synthesize the name of the instance, the @synthesize directive
    can use an instance variable only from the current class, not a superclass.

    There are differences in the behavior of accessor synthesis that depends on the
    runtime (see also "Runtime Difference" (page 80)).'
