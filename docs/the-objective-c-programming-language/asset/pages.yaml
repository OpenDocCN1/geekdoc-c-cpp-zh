  md: '# CHAPTER 1

    Objects, Classes, and Messaging


    # id


    In Objective-C, object identifiers are of a data type: id. This type is the general
    type for any kind of object regardless of class and can be used for instances
    of a class and for class objects themselves.


    ```

    id anObject;

    ```


    For the object-oriented constructs of Objective-C, such as method return values,
    id replaces int as the default type. (for strictly C, such as function values,
    int remains the default type.)


    The keyword nil is a null object, an id with a value of 0. id, nil, and the other
    basic types of Objective-C are defined in the header file objc/objc.h.


    ```

    id is defined as an object data structure:

    ttypedef struct objc_object {

    Class isa:

    *id;

    ```


    Every object has an isa variable that tells it what class it is an instance. The
    Class type is itself defined as a pointer:


    ```

    typedef struct objc_class *Class;

    isa variable is frequently referred to as the "isa pointer."

    ```


    # Dynamic Typing


    The id type is completely nonrestrictive. By itself, it yields no information
    about an object, except that it is an object. At some point, a program typically
    needs to find more information about the objects it contains. The id type designator
    can''t supply such specific information to the compiler, each object has to be
    able to supply it at runtime


    The isa variable identifies the object''s class—what kind of object it is. Objects
    with the same behavior (methods) and the same data (instance variables) are members
    of the same class.


    Objects are dynamically typed at runtime. Whenever it needs to, the runtime system
    can find the class that an object belongs to, by asking the object. (To learn
    more about this, see Objective-C Runtime Programming Guide.) typing in Objective-C
    serves as the foundation for dynamic binding, discussed later.


    The isa variable enables objects for introspection—to find out themselves (or
    other objects). The compiler records information about class definitions in data
    structures for the runtime system to use. Using the runtime system, you can, for
    example, determine whether an object implements a particular method or discover
    the name of its subclass.


    Object classes are discussed in more detail "Classes" (page 23).


    It''s also possible to give the compiler information about the class of an object
    by statically typing it in source code using the name. Classes are particular
    kinds of objects, and the class can serve as a type name. See "Class Types" (page
    26) and "Enabling Static Behavior" (page 95).'
