  md: '# Categories and Extensions


    A category allows you to add methods to an existing class—even to one for which
    you do not have the source. Categories are a powerful feature that allows you
    to extend the functionality of existing classes without subclassing. Using categories,
    you can also distribute the implementation of your own classes among several files.
    Class extensions are similar, but allow additional required APIs to be declared
    for a class in locations other than the primary class @interface block.


    # Adding Methods to Classes


    You can add methods to a class by declaring them in an interface file under a
    category name and defining them in an implementation file under the same name.
    The category name indicates that the methods are added to a class elsewhere, not
    a new class. You cannot, however, use a category to add additional instances to
    a class.


    The category methods become part of the class type. For example, methods added
    to the NSArray in a category are included as methods the compiler expects an NSArray
    instance to have. Methods added to the NSArray in a subclass, however, are not
    included in the NSArray type. (This matters only for statically typed objects
    because static typing is the only way the compiler can know an object''s class.)


    Category methods can do anything that methods defined in the class proper do.
    At runtime, there''s no difference. The category methods to a class are inherited
    by all the class subclasses, just like other methods.


    The declaration of a category interface looks very much like a class declaration—except
    the category is named within parentheses after the class name and the superclass
    isn''t mentioned. Unless its methods don''t access variables of the class, the
    category must import the interface file for the class it extends:


    ```

    @import "ClassName.h"

    @interface ClassName ( CategoryName )

    // method declarations

    @end

    ```


    The implementation, as usual, imports its own interface. A common naming convention
    is that the filename is the name of the class extended by "+" followed by the
    name of the category. A category implementation (in a file ClassName+CategoryName.m)
    might therefore look like this:


    ```

    @import "ClassName+CategoryName.h"

    @implementation ClassName ( CategoryName )

    // method definitions

    @end

    ```


    Adding Methods to Classes

    2010-12-08 | © 2010 Apple Inc. All Rights Reserved.'
