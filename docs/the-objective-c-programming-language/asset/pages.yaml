  md: "# CHAPTER 3\nAllocating and Initializing Objects\n\n```\n+ (id)arrayWithObject:(id)object;\n\
    + (id)arrayWithObjects:(id)firstObj; ...\n```\n\n> Important: You must understand\
    \ the memory management implications of using these methods if you do not use\
    \ garbage collection (\"Memory Management\" (page 15)). You must read Memory Management\
    \ Programming Guide to follow the policy that these allocate to these constructors.\n\
    \nThe return type of constructor is id for the same reason it is id for initializer\
    \ methods, discussed in \"Constraints and Conventions\" (page 50).\n\nMethods\
    \ that combine allocation and initialization are particularly valuable if the\
    \ allocation must be informed by the initialization. For example, if the data\
    \ is taken from a file, and the file might contain enough data to initialize more\
    \ than one object, it would be impossible to know how many objects to allocate\
    \ until the file is opened. In this case, you might implement a list: method that\
    \ takes the name of the file as a parameter. It would open the file, see how many\
    \ objects to allocate, and create a List object to then allocate and initialize\
    \ the objects from data file, put them in the list, and finally return the list.\n\
    \nIt also makes sense to combine allocation and initialization in a single method\
    \ if you want to avoid the stress of blindly allocating memory for an object that\
    \ you might not use. As mentioned in \"The Returned Object\" (page 49), an init...\
    \ method might substitute another object for the receiver. For example, when initWithName:\
    \ is passed a name that's already taken, it can free the memory and in its place\
    \ return the object that was previously assigned the name. This means, of course,\
    \ that an object is allocated and freed immediately without ever being used.\n\
    \nIf the code determines whether the receiver should be initialized inside the\
    \ method that the allocation instead inside init..., you can avoid the step of\
    \ allocating a new instance when one isn't needed.\n\nIn the following example,\
    \ the solo method ensures that there's no more than one instance of the Soloist\
