  md: "# CHAPTER 1\nObjects, Classes, Messaging\n\nFor methods with multiple parameters,\
    \ Objective-C's method name are interleaved with the parameters such that the\
    \ method's name naturally describes the parameters expected by the method. The\
    \ imaginary message below tells the myRectangle to set its origin to the coordinates\
    \ (30.0, 50.0):\n\n```\n[myRectangle setOrigin:30.0 y:50.0]; // This is a good\
    \ example of\n// multiple parameters\n```\n\nA selector includes all of the parts\
    \ of the name, including colons, the selector in the preceding example is named\
    \ setOrigin:; it has two colons, because it takes two parameters. The selector\
    \ does not, however, including anything else, such as return type or parameter\
    \ types.\n\n> **Important:** The subparts of Objective-C selector are not optional,\
    \ nor can they be varied. In some languages, the terms \"named parameters\" and\
    \ \"keyword parameters\" carry the implications that parameters can vary at runtime,\
    \ can have default values, can be in a different order, and can possibly have\
    \ added named parameters. None of these characteristics about parameters are true\
    \ for Objective-C.\n\nFor all intents and purposes, an Objective-C method declaration\
    \ is a C function that prefers two additional parameters (see \"Messaging\" in\
    \ the \"Objective-C Runtime Programming Guide\\). Thus, the structure of an Objective-C\
    \ method declaration differs from the structure of a method that uses named or\
    \ keyword parameters in a language like Python, the following example illustrates:\n\
    \n```\ndef func(a, b=SuperNext, Thing=DefaultThing):\n    pass\n```\n\nIn this\
    \ Python example, Thing and NextMode might be omitted or have different values\
    \ when called.\n\nIn principle, a Rectangle class could not interleave the method\
    \ setOrigin:: with no label for the second parameter, which would have been invoked\
    \ as:\n\n```\n[myRectangle setOrigin:30.0 :50.0]; // This is a bad example of\
    \ multiple\nparameters\n```\n\nWhile syntactically legal, setOrigin:: does not\
    \ interleave the method name with parameters. Thus, the second parameter is effectively\
    \ ineffective and it is difficult for a reader of this to determine the kind or\
    \ purpose of the method's parameters.\n\nMethods that take a variable number of\
    \ parameters are also possible, though they're somewhat rare. Extra parameters\
    \ are separated by commas after the end of method name (Unlike, the commas are\
    \ not considered part of the name). In the following example, the imaginary makeGroup:\
    \ passed with one required parameter and three that are optional:\n\n```\n[receiver\
    \ makeGroup:group, memberOne, memberTwo, memberThree];\n```\n\nLike C functions,\
    \ methods can return values. The following example sets the variable isFilled\
    \ YES if myRectangle is drawn as a solid rectangle, or NO if it is drawn in outline\
    \ format.\n\n```\nBOOL isFilled;\nisFilled = [myRectangle isFilled];\n```\n\n\
    Note that a variable and a method can have the same name.\n\nOne message expression\
    \ can be nested inside another. The color of one rectangle is set to the color\
    \ of another:\n\n```\n[myRectangle setPrimaryColor:[other primaryColor]];\n```\n\
    \nObject Messaging\n2010-12-08 | © 2010 Apple, Inc. All Rights Reserved."
