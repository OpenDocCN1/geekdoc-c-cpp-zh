  md: '# INTRODUCTION


    Introduction


    # See Also


    If you have never used object-oriented programming to create applications, you
    should read Object-Oriented Programming with Objective-C. You should also consider
    reading it if you have used other object-oriented development environments as
    C++ and Java because they have many expectations and conventions different from
    those of Objective-C. Object-Oriented Programming with Objective-C is designed
    to help you become familiar with object-oriented development from the perspective
    of an Objective-C developer. It spells out some of the implications of object-oriented
    design and gives you a flavor of what writing an object-oriented program is really
    like.


    # The Runtime System


    Objective-C Runtime Programming Guide describes the aspects of the Objective-C
    runtime and how you can use it.


    Objective-C Runtime Reference describes the data structures and functions of the
    Objective-C runtime support library. Your programs can use these interfaces to
    interact with the Objective-C runtime system. For example, you can add classes
    or methods, or obtain a list of all class definitions for loaded classes.


    # Memory Management


    Objective-C supports two mechanisms for memory management: automatic garbage collection
    and reference counting:


    +   * Garbage Collection Programming Guide describes the garbage collection system
    used in Mac OS X. (Not available for iOS—you cannot access this document through
    the iOS Dev Center).

    * Memory Management Programming Guide describes the reference counting system
    used in iOS and Mac OS X.'
