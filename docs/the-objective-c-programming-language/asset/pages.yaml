  md: "# CHAPTER 2\n\n# Defining Class\n\nmessages sent), the class interface must\
    \ be imported. Typically, an interface file uses @class to declare classes, and\
    \ the corresponding implementation file imports its interfaces (if it needs to\
    \ create instances of those classes or send them messages).\n\nThe @class directive\
    \ minimizes the amount of code seen by the compiler and linker, and is therefore\
    \ the simplest way to give a forward declaration of a class name. Being simple,\
    \ it avoids potential problems that may come with importing files that import\
    \ other files. For example, if one class declares a statically typed instance\
    \ variable of another class, and their two interface files import each other,\
    \ neither class may compile correctly.\n\n# The Role of the Interface\n\nThe purpose\
    \ of the interface file is to declare the new class to other source modules (and\
    \ to other programmers). It contains information they need to work with the class\
    \ (programmers might appreciate a little documentation).\n\n+   - The interface\
    \ file tells users how the class is connected into the inheritance hierarchy and\
    \ what other classes—inherited or simply referred to somewhere in the class—are\
    \ needed.\n- The interface also tells the compiler what instance variables an\
    \ object contains, and tells programmers what subclasses inherit. Although instance\
    \ variables are most viewed as a matter of the implementation of a class rather\
    \ than its, they must never be declared in the interface file. This declaration\
    \ is necessary because the compiler must be aware of the structure of an object\
    \ where it's used, not just where it's defined. As a programmer, you can generally\
    \ ignore the instance variables of the classes you use, except when defining a\
    \ subclass.\n- Finally, through its list of method declarations, the interface\
    \ file lets others know what messages can be sent to the class object and instances\
    \ of the class. Every method that can be used outside the class definition is\
    \ declared in the interface file; methods that are internal to the class can be\
    \ omitted.\n\n# Class Implementation\n\nThe definition of a class is structured\
    \ very much like its declaration. It begins with the @implementation directive\
    \ and ends with the @end.\n\n```\n@implementation ClassName : ItsSuperclass\n\
    {\n    instance variable declarations\n}\nmethod definitions\n@end\n```\n\nHowever,\
    \ every implementation file must import its own interface. For example, Rectangle.m\
    \ imports Rectangle.h. Because the implementation doesn't need to repeat any of\
    \ the declarations it imports, it can safely omit:\n\n+   - The name of thesuperclass\n\
    - The declarations of instance variables\n\nClass Implementation"
