  md: '# CHAPTER 9

    Enabling Static Behavior


    Statically typed objects have the same internal data structures as objects declared
    to be of type id. The type does not affect the effect; it affects only the amount
    of information given to the compiler about the object and the amount of information
    available to those reading the source code.


    Static typing does not affect how the object is treated at runtime. Statically
    typed objects are dynamically allocated by the same methods that create instances
    of type id.If Square is a subclass of Rectangle, the following code would still
    produce an object with all the instance variables of a Square object, not just
    those of a Rectangle:


    ```

    Rectangle *thisObject = [[Square alloc] init];

    ```


    Messages sent to statically typed objects are dynamically bound, as messages to
    typed id are. The exact type of a statically typed receiver is determined at runtime
    as part of the processing message. A display message is sent to the thisObject:


    ```

    [thisObject display];

    ```


    performs the version of the method defined in the Square class, not the one in
    the Rectangle superclass.


    By giving the compiler more information about an object, static typing opens up
    possibilities that are absent for typed id:


    +   - In certain situations, it allows for compile-time type checking.


    +   - It can free objects from the restriction that identically named methods
    must have identical return and parameter types.


    +   - It permits you to use the structure pointer to directly access an object''s
    instance variables.


    The first two possibilities are discussed in the sections that follow. The third
    is covered in “Defining a Class” (page 35).


    # Type Checking


    With the additional information provided by static typing, the compiler can deliver
    better type-checking in two situations:


    +   - When a message is sent to a statically typed receiver, the compiler can
    make sure the receiver can respond. A warning is issued if the receiver doesn''t
    have access to the method named in the message.


    +   - When a statically typed object is assigned to a statically typed variable,
    the compiler makes sure the types are compatible. A warning is issued if they''re
    not.


    An assignment can be made without warning, provided the class of the object being
    assigned is identical to, or inherits from, the class of the variable being assigned.
    The following example illustrates this:


    ```

    Shape *aShape;

    Rectangle *aRect;

    aRect = [[Rectangle alloc] init];

    aShape = aRect;

    ```'
