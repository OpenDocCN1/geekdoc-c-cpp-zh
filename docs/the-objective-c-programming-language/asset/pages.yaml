  md: "# CHAPTER 3\nAllocating and Initializing Objects\n\nreturn self;\n}\n\nThe\
    \ message to super chains together initialization methods in all inherited classes.\
    \ Because it comes first, it ensures that superclass variables are initialized\
    \ before those declared in subclasses. For example, a Rectangle object must be\
