  md: '# LAB PROBLEMS


    1. Use LTspice to find the voltage across the 10Ω resistor in the following circuit.
    (Hint: Do not forget to assign a ground node in LTspice!)


    ![](img/d1b4f05eead98e7b59e76deae28a6347_266_0.png)


    2. The circuit above is powered by 2 AA batteries. How long will the circuit last
    if a single AA battery holds 10kJ of energy?


    3. Find the voltage across the current source in the circuit shown below. The
    current source is called "Current" and is found in the same library that holds
    the "Voltage" source. Print the LTspice schematic showing the voltage at the top
    of the current source.


    ![](img/d1b4f05eead98e7b59e76deae28a6347_266_1.png)


    4. Find the current through the voltage source of the three-dimensional cube of
    1kΩ resistors shown below. Print the LTspice schematic showing the current through
    the voltage source. Some versions of LTspice show current in wire after simulation
    hovering over it; some show the currents in the postsimulation screen. Take a
    screenshot of the current through the voltage source. Do not be concerned if the
    current is positive or negative; the sign indicates only the direction of flow.


    ![](img/d1b4f05eead98e7b59e76deae28a6347_266_2.png)


    5. The duty cycle of a square wave is the ratio of the time the cycle is spent
    "on" divided by the total length of time of each period. For instance, if the
    "on" time is 1 second, and the "off" time is 3 seconds, then the total'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'period is 4 seconds, the duty cycle is 1/4=25%, and the frequency is 1/period=1/4
    Hz. Find resistors needed to build the 555 circuit discussed in the Tip that oscillates
    at 1 kHz at a 33.3% duty cycle, then analyze it using LTspice and print out 4ms
    of the waveform showing the current through the LED. Use a 1 µF capacitor.


    +   6. Repeat Problem 5 for a circuit that oscillates at 100 Hz at a 10% duty
    cycle. Use a 1 µF capacitor. Print the LTspice schematic and a plot of the first
    50 ms of current through the LED.


    +   7. Design a second-order Butterworth low pass filter with a cutoff frequency
    of 60 Hz using 100 k resistors. Analyze it using an AC sweep analysis. Print both
    the LTspice schematic and the plot of just the output magnitude, not phase, using
    the Snip & Sketch Tool on Windows or Command+Shift+4 on Mac. Hint: if LTspice
    returns an "unknown subcircuit", check that "Universal Opamp2" was used and not
    "opamp2."


    +   8. Calculate the Bode plot for the high pass filter shown below as the input
    frequency varies from 1 Hz to 10kHz. Print both the LTspice schematic and the
    plot of just the output magnitude, not phase, using the Snip & Sketch Tool on
    Windows or Command+Shift+4 on Mac. Use the net method discussed on page 255 to
    avoid crossed wires. Hint: if LTspice returns an "unknown subcircuit" error, check
    that "Universal Opamp2" was used and not "opamp2"


    ![](img/d1b4f05eead98e7b59e76deae28a6347_267_0.png)


    +   9. You are an Electrical Engineer working for a company that designs natural
    gas powered electrical plants. One of the newly hired members on your team is
    upset that the company is not spending more time examining the profitability of
    generators powered by renewable energy sources, such as wind and solar. The issue
    was already examined in a lengthy and expensive'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'study a decade earlier, and it was found then that renewable energy sources
    would not be as profitable as the company in the foreseeable future. The employee
    argues that the study''s goal was fundamentally flawed: that the decision did
    not solely rest on profitability, but that ethical responsibility to reduce carbon
    emissions should also play a role. The five-step method of David Jonassen with
    the NSPE Code of Ethics to analyze the situation from the viewpoint of the new
    hire and from the viewpoint of the company''s board of directors. Which viewpoint
    do you find more compelling?


    Use the five-step method of David Jonassen with the NSPE Code of Ethics to analyze
    the following, unfortunately realistic, situation an engineer may encounter.


    You are an electrical engineer working for a defense contractor. Your team is
    completing work on the guidance control system for any anticircraft missile defense
    system. Early testing showed that under certain situations the guidance could
    malfunction, resulting in unstable missile flight over friendly airspace. The
    guidance control system was modified to maintain controlled flight in that particular
    situation. Although the system now passes all tests, you believe the earlier failures
    may point to a deeper problem with the guidance system, given the right test conditions
    could again lead to loss of missile flight control. However, you never be sure
    of this; all you know is that the system redesigned to successfully pass the limited
    number of flight scenarios proposed at the project outset. When you present your
    concerns to the company management, they assure you that all tests show that the
    missile is safe and that further testing would not only be unnecessary but would
    lead to extremely costly penalties for failing to produce the device on the contract
    deadline and may jeopardize the division''s (and therefore your job''s) existence.
    They hint that if you fail to approve the system, you may be replaced with a coworker
    who would be more willing to approve the project.


    You feel torn between your duties to your coworkers, your employer, and the military
    personnel who will be relying on this technology. You do not know if your concerns
    are valid without months of additional simulations. What do you do?'
  merge: -1
  img_proc: true
