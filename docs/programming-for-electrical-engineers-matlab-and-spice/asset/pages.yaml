  md: '# WORKING WITH VECTORS


    MATLAB offers several methods for working with vectors. The examples below assume
    the vector is stored in variable v


    # Viewing a Vector


    To view a vector, type the variable that stores the vector. For example,

    v


    # Not Viewing a Vector


    When a vector is created in MATLAB, the result is echoed to the screen by default.
    This can be a problem if you are creating a vector with several thousand elements.
    To suppress the echoing, end the command with a semicolon, e.g.,

    v = ones(1,1000);


    > Remember that typing a semicolon at the end will keep MATLAB from printing all
    1000 numbers when you create the v.


    # Vector Length


    length(v)

    Returns the number of elements in a vector.

    For example, length([7 6 1]) returns 3

    N = length(y)

    Sets variable N to the number of data points present in y'
