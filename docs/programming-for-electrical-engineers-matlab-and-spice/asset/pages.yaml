- pgno: 23
  md: '# PRACTICE PROBLEMS


    ![](img/d1b4f05eead98e7b59e76deae28a6347_23_0.png)


    # TECH TIP: OHM''S LAW


    About two centuries ago, Georg Ohm summarized the relationship among current,
    voltage, and resistance with the formula named after him. The formula is:


    ```

    V = IR

    ```


    where V is voltage, I is current, and R is resistance. If we try to understand
    this relationship in terms of the water analogy, it conveys two different ideas:


    +   1. Voltage is proportional to current: as more water current is forced through
    a narrowed pipe, a greater pressure will develop across it; and,

    2. Voltage is proportional to resistance: as the pipe narrows and its resistance
    increases, water flowing through it will also cause a greater pressure to develop
    across it.


    There are two other formulations of Ohm''s Law, one solved for current, shown
    below:


    ```

    I = V / R

    ```


    and similarly, one solved for resistance, as follows:


    ```

    R = V / I

    ```'
