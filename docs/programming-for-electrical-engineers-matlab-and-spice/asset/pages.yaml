    # USING NESTED LOOPS TO SEARCH FOR BEST SOLUTIONS


    Finding exact solutions, as done in the previous section, is done by testing with
    the == operator. Sometimes exact solutions do not exist, in which case one must
    settle for the best solution. Finding this best solution requires keeping track
    of the current best solution, and checking through every iteration to see if the
    current computation is better. Error is often computed using code of the form
    error = abs(currentComputation - desired) since it is the absolute error that
    needs to be minimized.'
