    # FUNCTION ARGUMENTS


    The variables passed into out of functions are called arguments. We have seen
    that these are declared in the first line of the function declaration, e.g.


    ```

    function outputArguments = functionName(inputArguments)

    ```


    This declaration ensures that the variable outputArguments will be created inside
    the function and will set it equal to computed result. Let us examine, then, how
    many input arguments can be passed into the function and any number of output
    arguments can be passed out of the function.


    # One Output Argument


    This is the most common case. Examples include the built-in function exp() and
    sin(). The function is declared as follows, where input arguments are abbreviated
    with=""


    ```

    function outputArgument = functionName (...)

    ```


    For an example, a function that converts meters to inches could be defined as


    ```

    function inches = mm2inches(mm)

    inches = mm ./ 25.4;

    ```'
