    and MATLAB provides a way for title(), xlabel(), ylabel(), legend(), and text()
    to display them.


    # Greek Symbols


    Greek symbols are very common in Electrical Engineering, as described in the previous
    Tech Tip, and they can be embedded using the backslash character \ by the name
    of the Greek symbol. The following command labels the horizontal axis with "Resistance
    in M\Omega":


    ```

