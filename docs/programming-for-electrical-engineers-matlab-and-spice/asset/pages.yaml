- pgno: 184
  md: '# PROGRAMMING II: LOOPING


    Looping is a powerful programming technique that allows MATLAB users to execute
    a set of code multiple times, or over every value in a vector. For example, if
    you need to run a simulation in which a filter''s response to variations in resistor
    tolerance is calculated and displayed for 1000 random perturbations in resistances,
    or calculate the output of a circuit whose input is a complicated waveform sampled
    at 1000 different times, the for-end loop makes such applications possible.


    # OBJECTIVES


    After completing this chapter, you will be able to use MATLAB to do the following:


    +   * Program using for-end loops

    * Understand how to index vectors within for

    * Nest loops inside each other

    * Create functions that call other user functions

    * Program using while-end loops

    * Understand how to preallocate memory to speed program execution


    ![](img/d1b4f05eead98e7b59e76deae28a6347_184_0.png)'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# DISP


    Previously, fprintf() was introduced as a function to print text and numbers on
    the screen, using formatting characters including tabs and newlines. A simpler
    command that can print either pure string text or a variable containing a number
    or vector, but not combined with numbers, disp(). For example,


    ```

    disp(''Hello world'')nv = [1 2 3 4]; disp(v)

    ```


    will cause the following to print to the command window:


    Hello worldn1 2 3 4ninstead of fprintf() when you only need to print a simple
    variable. It is frequently helpful when debugging to put in a disp() statement
    to check how the code is evaluating inside a function.


    # FOR-END LOOP


    The for-end loop is used to repeat a section of code for a known number of times,
    as in the example below:


    ```

    for i = 1 : 10ndisp(''ECE is fun'';)

    end

    ```


    The for-end loop requires the creation of a loop variable, called i, and a loop
    vector, here the set of numbers from 1 to 10. The loop executes as many times
    as there are entries in the loop vector, for each iteration the loop variable
    takes a successive value of the loop vector. There can be any number of command
    lines inside the for-end loop. Notice how these commands are typically indented
    to make them easier to read, the commands inside the if-else-end block are indented.'
  merge: -1
  img_proc: true
