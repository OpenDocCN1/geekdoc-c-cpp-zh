    > PRO TIP: IEEE

    Electrical engineers can choose to belong to an international professional society
    called the Institute of Electrical and Electronic Engineers (IEEE), which is pronounced
    "triple-E" This society has thousands of chapters around the world that meet monthly,
    typically over dinner, to talk about topic of current engineering interest. These
    meetings are popular among working engineers to network, socialize, and stay current
    in the field. Most universities sponsor a student chapter, which may arrange interuniversity
    robotics competitions, lead field trips, and help students find internships and
    ultimately, jobs. Find out more at ieee.org.


