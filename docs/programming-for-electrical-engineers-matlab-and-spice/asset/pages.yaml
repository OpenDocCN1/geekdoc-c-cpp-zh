  md: '# PRO TIP: IEEE CODE OF ETHICS


    To follow the IEEE Code of Ethics, electrical engineers agree to accept responsibility
    in making decisions consistent with the welfare of the public, and to disclose
    promptly factors that might endanger the public or the environment;


    +   1. accept responsibility in making decisions consistent with the welfare of
    the public, and to disclose promptly factors that might endanger the public or
    the environment;

    2. avoid real or perceived conflicts of interest where possible, and to disclose
    them to affected parties when they do;

    3. be honest and realistic in stating claims or estimates based on available data;

    4. reject bribery in all its forms;

    5. improve the understanding of technology and potential consequences;

    6. improve our technical competence and undertake technological tasks for others
    only if qualified by training or experience, or after full disclosure of pertinent
    limitations;

    7. seek and offer honest criticism of technical work, to correct errors, and to
    credit the contributions of others;

    8. treat fairly all persons and not to engage in acts of discrimination based
    on race, religion, gender, age, national origin, sexual orientation, gender identity,
    or expression;

    9. avoid injuring others, property, reputation, or employment by false or malicious
    action;

    10. assist colleagues with professional development and support them in following
    this Code.


    See the unabridged text at https://www.ieee.org/about/ethics.html.'
