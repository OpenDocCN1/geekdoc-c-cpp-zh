- pgno: 145
  md: 'Notice using ./ / rather than just / means the function mm2inches() will work
    if given a vector or scalar. The above function is saved as mm2inches.m and can
    be called from the command line using the following syntax:

    myInchesVariable = mm2inches(254)

    After calling this function, myInchesVariable holds 10.


    # Two or More Output Arguments


    Sometimes you will need to return more than one variable. An example of this is
    a program that converts mm to inches and feet. The declaration for multiple output
    arguments wraps the output variable names in square parentheses, like so For example,
    a function that converts millimeters to feet could be written


    ```

    function [output1, output2] = myFunction(...)

    function [feet, inches] = mm2ftin(mm)

    inches = mm / 25.4;

    feet = floor(inches/12);

    inches = inches - feet*12;

    ```


    > RECALL

    The floor() command returns the integer part of its argument.floor(3.7) for instance
    returns 3.


    The above function must be saved as the file mm2ftin.m and can be called from
    the command line using the following syntax:

    [myfeet, myinches] = mm2ftin(5000)

    Now the variable equals 16 and myinches equals 4.8504. Notice another power of
    using functions. Since you previously created a mm2inches() function, you could
    change the second line in inches = mm / 25.4; to

    inches = mm2inches(mm)

    which which simplifies your program by calling a function from within your function.'
