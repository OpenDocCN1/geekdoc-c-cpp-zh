    # SCHEMATIC EDITOR


    Circuit simulation begins with schematic capture, which means creating a schematic
    diagram in the schematic editor. A schematic is composed of components (such as
    voltage and current sources, resistors, capacitors, inductors, diodes, transistors,
    and integrated circuits), at least one ground symbol, and wires connecting the
    components and ground. Every component has two pieces of associated data: its
    name, reference designator, and data describing its value. For example, a particular
    resistor may be named with a designator R11 and have a value of 4.3 kΩ, or a voltage
    source may be called V1 and have a value of 12V.


