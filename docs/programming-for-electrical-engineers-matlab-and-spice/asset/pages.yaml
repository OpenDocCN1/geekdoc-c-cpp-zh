    As an example, the following commands create a set of two long, narrow plots,
    one over the other, the one graphing $v_1(t)=\sin(t)$ and the bottom graphing
    $v_2(t)=a$ triangle wave, for $0 \le t \le 4\pi$:


    ```

    t1 = linspace(0,4*pi,1000);

    v1 = sin(t1);

    t2 = linspace(0,4*pi,9);

