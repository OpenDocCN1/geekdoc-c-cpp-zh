  md: 'since by default, it returns 4 decimal digits in its scientific notation format.
    Later in this book we will introduce engineering notation, which is an even more
    compact way to write these values than scientific notation.


    # EXPONENTIALS AND THEIR INVERSES: exp, ^, sqrt, log, log10


    Electrical engineers frequently use the natural exponential function, e. It is
    so common that than having a defined number for e and ending as powers, MATLAB
    has its own built-in function called exp(x). For example, to compute e^(-1) in
    MATLAB, rather typing 2.718^(-1), one would type:


    ```

    >> exp(-1)

    ```


    The inverse of the natural exponent is the logarithm. Some mathematical textbooks
    call this In, as in In(2), but MATLAB calls it log, as in log(2). Thus, the following
    command equal log-3.5:


    ```

    >> log(exp(-3.5))

    ```


    Electrical engineers often use base-10 logarithms when analyzing signals amplitudes
    vary widely. The loudness of a signal, for example, measured in decibels, which
    involve base-10 logarithms. To find a logarithm to the base 10, e, log10(10000)=4,
    use the MATLAB command log10(), as follows:


    ```

    >> log10(10000)

    ```


    Raising numbers other than e to various powers is done using the ^ symbol. For
    example, to represent 2^32 in MATLAB, type:


    ```

    >> 2^32

    ```


    The square root of a number can be found in MATLAB with the sqrt() function. For
    example, sqrt(65536 (another common number in EE) is found by typing:


    ```

    >> sqrt(65536)

    ```'
