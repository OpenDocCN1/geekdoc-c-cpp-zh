- pgno: 107
  md: '# PRO TIP: PROFESSIONAL LICENSURE (PE)


    Just as doctors and lawyers are licensed to practice medicine and law, engineers
    can be licensed as well. Licensed engineers are called “Professional Engineers,”
    and they add the letters P.E. after their name, like John Doe. Unlike law and
    medicine, most electrical engineering careers do not require licensure (however,
    such requirements are becoming increasingly common). Careers in which licensure
    is especially helpful


    +   - Architecture and Building: Only P.E.s may certify certain types of engineering
    plans.

    - Consulting: Only P.E.s may engage in private engineering consulting, and engineering
    consultant firms are required to maintain a certain minimum ratio of licensed
    engineers on their staff.

    - Government: Being a P.E. is a common requirement for higher-level state and
    federal engineering jobs.

    - Energy: Most power distribution companies seek P.Es to help them certify power
    station plans.

    - Teaching: Some states require engineering departments to ensure that a certain
    percentage of their engineering faculty is licensed.


    Licensing requirements vary by state, but a typical path includes graduating from
    a 4-year engineering program, passing the Fundamentals of Engineering (F.E.) exam,
    working for 4 years under a P.E., and then passing the P.E. exam.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# PLOTTING SCRIPTS


    Students often find themselves copying many previously typed lines of commands
    when modifying complicated plots. There is a way to do this much more efficiently
    by creating a MATLAB script:


    +   1. Navigate into your personal directory using the MATLAB folder and directory
    toolbar, as highlighted below:


    ![](img/d1b4f05eead98e7b59e76deae28a6347_108_0.png)


    2. From the MATLAB command window edit. This will spawn a text editing window.
    In the text editing window, type the commands shown below (in this case, to plot
    a sine waveform):


    ```

    t = linspace(-10,10,100);

    y1 = sin(t)/t;

    y2 = zeros(size(y1));

    plot(t,''b-'',t,y2,''k-'')

    ```


    +   3. Save the file as ''figure1.m''. All MATLAB code files must end with a .m
    suffix. The editor window would now look like the figure below:


    ![](img/d1b4f05eead98e7b59e76deae28a6347_108_1.png)'
  merge: -1
  img_proc: true
- pgno: 109
  md: '4. To run the code, a script, go back to the main MATLAB command window and
    type the name of the file without the suffix. In this case, run the script in
    figure1.m and generate the figure below, type figure1 in the command window.


    ![](img/d1b4f05eead98e7b59e76deae28a6347_109_0.png)


    The extra work to create a script to generate complex plots is often justified
