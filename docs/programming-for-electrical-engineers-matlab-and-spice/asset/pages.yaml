    # VECTOR MATHEMATICS


    Many functions take scalar and vector arguments, and with one important difference,
    these work as you would expect: functions that take a single argument, like cos(),
    operate on each element of the vector independently. Operators that take two vectors,
    like +, operate on respective elements of each vector. For instance, if x = [2
    4 7], then cos(x) returns a vector of all three cosines and x + x returns [4 8
    14]. Other functions that you have used that vector arguments include addition,
    subtraction, sqrt(), exp(), and all the trigonometric functions like sin().


    Vector mathematics using the four basic operations of addition, subtraction, multiplication,
    and division have some special behaviors. Addition and subtraction only operate
    on respective elements: [5 3]-[1 2]. Multiplication and division between two vectors
    do not use the standard * and operators. For reasons described in linear algebra
    courses, multiplying two row vectors like [5 3]*[1 2] will generate an error message.
    To multiply or divide respective elements, prefix the multiplication or division
    sign with a dot. For example, [5 3].*[1 2] will work, as [4 8]/[2 4], yielding
    [5 6] and [2 2], respectively.'
