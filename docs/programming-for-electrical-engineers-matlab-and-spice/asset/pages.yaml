  md: "# USING NESTED LOOPS TO SEARCH FOR EXACT SOLUTIONS\n\nConsider a program that\
    \ searches for integer solutions for the sides of a right triangle, known as Pythagorean\
    \ triples, satisfying $c = \\sqrt{a^2+b^2}$. The program searches for integer\
    \ hypotenuses as side $a$ ranges from 1 to some given upper bound N and as side\
    \ $b$ ranges from 1 to $N$.\n\n![](img/d1b4f05eead98e7b59e76deae28a6347_196_0.png)\n\
    \nEvery time an integer hypotenuse $c$ is found, it is printed to the command\
    \ window, as shown below:\n\n```\nfunction pythagorean(N)\n    % pythagorean(N)\
    \ searches for integer sides of right\n    % triangles for lengths of sides varying\
    \ from 1 to N\n    for a = 1:N\n        % side a\n        for b = 1:N\n      \
    \      % side b\n            c = sqrt(a*a+b*b);\n            % side c, the hypotenuse\n\
    \            if (c==floor(c)) % a solution is found\n                disp(c)\n\
    \        end\n        % loop through side b values\n    % loop through side a\
    \ values\nend\n```\n\n# PRACTICE PROBLEMS\n\n+   The above code for pythagorean()\
