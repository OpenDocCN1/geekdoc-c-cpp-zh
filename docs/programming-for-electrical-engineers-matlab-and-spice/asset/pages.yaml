- pgno: 114
  md: '# SUBPLOT


    You have learned how to plot multiple items on the same set of axes using hold()
    or plot(x1,y1,x2,y2). Sometimes you may want to group multiple axes in the same
    plot as the figure below, which shows the frequency response of a Butterworth
    lowpass filter plotted against various combinations of axis scaling. Note that
    neither hold nor plot can put these on the same set of axes, since it is the same
    data plotted using different axis scalings.


    ![](img/d1b4f05eead98e7b59e76deae28a6347_114_0.png)


    Instead, use the subplot() command. This command divides the master plot into
    rows and columns of subplots (two rows and two columns in the above example) and
    sets the "active" subplot, which shows that the next plot() command will draw
    into it. To create a set of r rows by c columns of subplots and to set the active
    subplot to p, use the command:


    ```

    subplot(r,c,p)

    ```'
