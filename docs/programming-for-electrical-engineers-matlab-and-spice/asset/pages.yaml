    # SPECIAL SYMBOLS: i, j, and π


    Electrical engineers use imaginary numbers very frequently, for instance 3+j7,
    where j=\sqrt{-1}. This is different from the way most mathematicians would write
    it: 3+7i. Engineers use j since i is reserved to mean current, and we place the
    symbol in front of the number rather than behind it. MATLAB uses both i and j
    to mean \sqrt{-1}, so 3+j7 would be entered in MATLAB as follows:


    +   >> 3+j7


    Another contrast that electrical engineers use surprisingly often is the ratio
    of the circle''s perimeter to its diameter, or π. In MATLAB it is called:


    +   >> p1


    # FORMATING NUMBERS


    Internally, MATLAB keeps track of all numbers up to about 16 digits of precision,
    but by default only displays numbers to 4 decimal places. You can also see more
    digits in any answer by typing:


    +   >> format long'
