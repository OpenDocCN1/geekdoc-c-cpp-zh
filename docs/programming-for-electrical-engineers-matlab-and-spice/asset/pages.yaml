    # MORE COMPLEX FUNCTION EXAMPLES


    Examine the following functions to develop your programming ability.


    # Example: Complex Parts in Polar Form Using Radians to Complex


    Complex numbers in Electrical Engineering are often given in complex polar form,
    written with a magnitude and an angle that can be in radians or degrees. These
    were introduced in Chapter 2 in the Complex Numbers section on page 49; an example
    is 23.12 (radians) or $23.45^{\circ}$ (degrees). MATLAB requires complex numbers
    to be changed to rectangular form, i.e., using real and imaginary parts like $4+3j$
    or $6\cos(45)-j\sin(12)$. Chapter 2 described how a complex number can be changed
    from polar form of mag*angle into rectangular form of real+j*imagpart using the
    following formulas:


    ```

    realpart = mag*cos(angle)

    imagpart = mag*sin(angle)

    ```


    Once the real and imaginary parts of the number are obtained, they can be assembled
    into a single complex number z using the command:


    ```

    z = realpart + j*imagpart

    ```'
