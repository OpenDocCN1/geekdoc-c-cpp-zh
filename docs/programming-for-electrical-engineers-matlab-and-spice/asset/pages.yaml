    be the ratio, 180/π or π/180. There are more degrees in any angle than radians,
    so to convert degrees by 180/π. There are fewer radians than degrees in an angle,
    so to convert to radians by π/180.


    # CREATING VECTORS


    So far, MATLAB variables have been scalars, e.g., single numeric values like a=57.
    MATLAB variables can also be collections of numbers called vectors. Vectors are
    defined in square brackets like this:


    +   - y = [12 3 -45 2.7 pi]


    Most common mathematical functions operate on each of the numbers within the vector,
    such as exp(), log(), cos(), and the others we have discovered so far. Using the
    y vector defined above,


