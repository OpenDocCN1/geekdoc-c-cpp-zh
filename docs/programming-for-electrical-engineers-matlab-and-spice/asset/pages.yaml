- pgno: 90
  md: '> RECALL

    The commands +, -, *, and work between a scalar and a

    vector. Between two vectors, the commands + and - add or

    subtract corresponding elements of the two vectors. You must

    use * and / to multiply or divide corresponding elements

    two two vectors.


    # Selecting Line Colors


    MATLAB will select blue for plot lines by default. To select a different color,
    such as

    plotting the previous example in red, type

    `plot(t, y, ''r'')`

    where ''r'' stands for red.


    MATLAB has predefined eight colors with single-letter shortcuts.


    | Color | Abbreviation |

    |---|---|

    | blue | ''b'' |

    | green | ''g'' |

    | red | ''r'' |

    | cyan | ''c'' |

    | magenta | ''m'' |

    | yellow | ''y'' |

    | black | ''k'' |

    | white | ''w'' |


    You do not need to memorize these abbreviations; find them by typing

    `help plot`


    > DIGGING DEEPER

    If you need to embed MATLAB plots in Microsoft Word, do

    not use screen grab tools, which only capture low-quality

    bitmaps that will appear blurry when printed. Instead,

    select the plot window you wish to copy; choose Edit ->

    Copy Figure from the menu; and paste it into the Word document.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Selecting Line Styles


    By default, MATLAB uses solid lines to draw plots; however, other line styles
    can be specified, such as dotted, dashed, and dash dot:


    | Style | Abbreviation |

    | --- | --- |

    | Solid | ''-'' |

    | Dotted | '':'' |

    | Dashed | ''--'' |

    | Dash dot | ''-.'' |


    ![](img/d1b4f05eead98e7b59e76deae28a6347_91_0.png)


    To create a dotted line, as shown in the plot of the right, type


    ```

    plot(t, y, '':'')

    ```


    This command can be used in addition to the line color, as shown in the following
    example:


    ```

    plot(t, y, ''r:'')

    ```


    This creates a red dotted line. Notice how the commands are combined into a single
    quoted command.


    # Choosing Line Width and Arbitrary Colors


    Specifying predefined colors and line styles is so common that they are integrated
    into the plot command itself. Less-common-options, such as choosing the width
    of the line or choosing an arbitrary color, are accessed through the keywords
    at the end of the plot command, followed by a number or vector.


    # Varying Plot Line Width


    The line width is set to 1 by default. To make it five times thicker, choose the
    width of 5 using this command:


    ```

    plot(t, y, ''linewidth'', 5)

    ```'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'Examples of plots with line widths ranging from 1 to 15 are shown below:


    ![](img/d1b4f05eead98e7b59e76deae28a6347_92_0.png)


    Similarly, if you need a color other than one of the eight predefined colors that
    MATLAB uses, the ''color'' keyword, followed by the color specification in [red,
    green, blue] coordinates. This is a vector of three numbers, with each number
    varying between 0 and 1, that defines how red, blue, and green (respectively)
    are present. This color specification system is a common one in computer graphics.
    For example, orange is mixed with a lot of red, mixed with a medium amount of
    green and no blue, so the RGB coordinates [1 0.5 0] yields an orange hue, which
    can be plotted using the following command:


    ```

    plot(t, y, ''color'', [1 0.5 0])

    ```


    # Combining Commands


    Commands to plot() must be grouped into two parts. The first is the x,y data,
    followed by the single-character color and the one- or two-character linestyle.
    Any color and linestyle characters must be all together and enclosed in a single
    set of quotes, e.g. ''r-'' rather than ''r'',''''. Commands that are given in
    two parts, like ''linewidth'', 10, must come at the end. For example, to draw
    the red dotted line shown on the next page, use the command:


    ```

    plot(t, y, ''r:'',''linewidth'',10)

    ```'
  merge: -1
  img_proc: true
