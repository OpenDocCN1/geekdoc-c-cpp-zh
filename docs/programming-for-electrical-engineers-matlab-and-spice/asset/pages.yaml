- pgno: 159
  md: 'As an example, suppose you need to check the validity of numbers in a large
    data-set of electronically sampled location measurements. These numbers should
    all be nonnegative integers less than 10 or could be –1 if the sensor is returning
    an error condition. The following function tests whether a particular number meets
    these criteria:


    ```

    function out = test(in)

    isError = (in == -1); % 0 if non-error, 1 if error

    isInteger = (in == floor(in)); % 0 if non-integer, else 1

    isInRange = (in >= 0) && (in < 10)

    out = isInteger && (isInRange || ~isError);

    ```


