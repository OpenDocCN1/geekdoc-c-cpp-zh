- pgno: 54
  md: '# Accessing and Changing Values in Vectors


    MATLAB handles vectors differently from other programming languages in two

    important ways:


    +   - It indexes vectors starting from 1, not 0. The first value in vector v is
    found at the first index. Most computer languages say the first value is at index
    0.

    - MATLAB uses parentheses ( ), not square brackets [ ], to index vectors.


    Thus, the MATLAB command to read the fourth value in vector v and set variable
    x equal to it is:


    ```

    x = v(4)

    ```


    To set the second vector in v to pi, type:


    ```

    v(2) = pi

    ```


    You can retrieve multiple values at once by providing not a single index, but
    a vector of indices. For example, to retrieve the third through seventh values
    of v=11:21, type:


    ```

    v(3:7)

    ```


    This will return the vector [13 14 15 16 17]. Do you see? The 3:7 created a vector
    of indices, and that vector was used as an index to retrieve those values of v.
    You can also set multiple values at once by using vectors both to your main vector
    and to those values. For example, you can type:


    ```

    v(3:5) = [1 pi sqrt(2)]

    ```


    This sets v(3) to 1, v(4) to pi, and v(5) to √2.


    # Using the End Operator


    To specify the first elements (say, the first five elements) of a vector v, you
    might type this notation:


    ```

    v(1:5)

    ```'
