- pgno: 191
  md: '# TECH TIP: MONTE CARLO SIMULATIONS


    Monte Carlo simulations are commonly used in EE to test how engineering designs
    respond to random changes in component tolerance. For example, consider the low
    pass circuit shown below, which passes low frequencies but tends to block frequencies
    above $f=\frac{1}{2\pi RC}$


    ![](img/d1b4f05eead98e7b59e76deae28a6347_191_0.png)


    Choose R=1 kΩ and C=1 $\mu$F to make the filter pass frequencies below 160 Hz.
    How will this cutoff frequency vary given resistor tolerance of $\pm5\%$ and capacitor
    tolerance of $\pm10\%$? A graduate-level course in stochastic theory will derive
    the result exactly, but it is simpler to simulate the results several thousand
    times, each time with different random resistor and capacitor values.


    In MATLAB, `rand` returns a random number between [0,1]. To change this to $[-0.05+0.05]$
    to simulate a 5% resistor tolerance, there is a desired span of 0.1 in $[-0.05+0.05]$,
    so `(rand*0.1)` gives the correct span of [0 0.1]. Subtract 0.05 to create the
    desired range $[-0.05 0.1]$. Therefore, `rand*0.1-0.05` gives a random number
    between -0.05 and 0.05 for the resistors. `rand*0.2-0.1` gives a random number
    from -0.1 to 0.1 for the capacitors.


    ```

    function result = MonteCarlo(N)

    % N is the number of simulations desired

    result = zeros(1,N); % fill result with

    % N zeros

    for i = 1 : N % do the simulation N times

    ```'
  merge: -1
  img_proc: true
