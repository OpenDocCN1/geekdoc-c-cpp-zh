  md: '# CREATING HELP


    You have used help with built-in functions, such as


    ```

    help linspace

    ```


    You can build help text into your functions as well. This is done by inserting
    comments on the second line, immediately under the function declaration. All comments
    between the function declaration and the first line of executable code are returned
    to the command window when the user types


    ```

    help functionName

