  md: '# Tab Control


    # Layout Control


    ![](img/d1b4f05eead98e7b59e76deae28a6347_12_0.png)


    MATLAB is composed of several controls and windows. The most important window
    is the center "command" window, shown above, into which all MATLAB commands are
    entered.


    The MATLAB environment looks substantially different from the image above, set
    the tab control in the upper left to home and choose default from the dropdown
    layout control in the upper toolbar. Keep the tab control in the home position;
    the other positions offer various wizards (for example, to assist in plotting
    or filter design) that tend to be more cumbersome to use than learning the direct
    syntax, as is described in this text.


    Next, create a data folder and make MATLAB''s current working directory (i.e.
    the directory in which MATLAB expects to find the user''s data and programs):


    +   1. Locate the directory control in the toolbar (top left) of the main window.

    2. Use the directory control to navigate to your data directory.

    3. Inside your data directory, create a new subfolder for your EE course.

    4. Inside that folder, create a subfolder called "Chapter 1".

    5. Note that the "Current Directory" input box in the toolbar now points to your
    "Chapter 1"working directory.'
