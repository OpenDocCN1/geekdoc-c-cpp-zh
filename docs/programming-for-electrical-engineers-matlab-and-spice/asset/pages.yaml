  md: '# WHY PROGRAM?


    A MATLAB program is simply a collection of commands that one could type from the
    command line. These commands are grouped together into a file called a program
    and are run by typing the file''s name into the MATLAB command window. There is
    nothing one can accomplish from a MATLAB program that cannot be accomplished by
    typing commands at the command line. So why program? Programs are important because:


    +   - Simplify a calculation. For instance, instead of having to type the formula
    Rparallel = (R1*R2)/(R1+R2) every time you need it, just create a program called
    Rparallel.m.

    - Hide complexity. A user can call a program called plotFigure2(), for instance,
    without having to remember or understand how plotFigure2() works.


    This chapter introduces programming, which involves two types of text:

    - The commands entered at the command prompt >> in the MATLAB command to run the
    program,

    - The program itself that is saved in a separate text file.


    Programming for Electrical Engineers colors code to differentiate between these
    two cases: blue text represents commands entered in the command window following
    the >> prompt, and red text represents the program code saved in separate file
    as shown in the diagram below:


    ![](img/d1b4f05eead98e7b59e76deae28a6347_136_0.png)


    ```

    function inches = mmInches(mm)

    inches = m . / 25.4;

    ```'
