- pgno: 88
  md: '# TYPES OF PLOTS


    Electrical engineers use a wide variety of graphs to show data. The most common
    types are the line plot, the scatter plot, and the bar plot, as shown below. The
    line plot is used to show continuously varying data, much as an oscilloscope may
    be used to view a time-varying voltage. The scatter plot is used to show discretely
    measured data (i.e., the actual vs. rated resistance of a sample of six inductors).
    If there is too much data to display using a scatter plot (i.e., a data set sampling
    10,000 resistors), the data may be grouped into bins and displayed in a bar plot.


    ![](img/d1b4f05eead98e7b59e76deae28a6347_88_0.png)


    Common types of plots used in electrical and computer engineering are shown above.
    "Voltage versus time" shows the line plot (with two differently formatted lines
    on the same axes), while "Inductance value" and "Resistor value distribution"
    are examples of the scatter plot and the bar chart, respectively. In this chapter,
    you will learn how to make all of these in MATLAB.'
  merge: -1
  img_proc: true
- pgno: 89
  md: "# LINE PLOT\n\nThe line plot is the most common type of graph. It requires\
    \ two vectors of equal length: one that specifies the horizontal coordinates of\
    \ each point and one that specifies the corresponding vertical points. In high-school\
    \ mathematics classes, horizontal distances are often called x and vertical distances\
    \ y. In electrical engineering, the horizontal axis is often t for time, and the\
    \ vertical axis is a voltage v(t), a current i(t), or a generic signal, as x(t)\
    \ or y(t).\n\n![](img/d1b4f05eead98e7b59e76deae28a6347_89_0.png)\n\n+   Create\
    \ the horizontal vector with enough points to give a smooth plot:\n t = linspace(0,\
    \ 5, 1000);\n\n+   Recall that a semicolon is needed at the end of the command\
    \ to suppress echoing the 1000 elements of t to the screen.\n\n+   Create the\
    \ vertical y vector to the desired function:\n y = t/2 .* cos(t);\n\nRemember\
    \ that .* is needed for multiplication between corresponding vector elements.\n\
    \n+   Create the plot using plot(horizontal, vertical)\n plot(t,y)"
