- pgno: 58
  md: '# COMPLEX NUMBERS


    Although mathematicians use the i to represent $\sqrt{-1}$, electrical engineers
    use j since it is reserved for current (from a French word for intensity). MATLAB
    accepts both i and j variables to represent imaginary numbers. This text will
    follow the EE convention of using j.


    A complex number like 4+3j is composed of both real and imaginary parts, and it
    is often drawn on the complex plane, shown below:


    ![](img/d1b4f05eead98e7b59e76deae28a6347_58_0.png)


    There are three common ways of writing complex numbers: rectangular, polar, and
    complex exponential.


    > DIGGING DEEPER

    Since positive multiplied by a positive is positive and a negative multiplied
    by a negative is also positive, it is not possible to find two real numbers when
    multiplied together to make a negative number. We therefore must de\fineine $\sqrt{-1}$
    as something that is not real; we call it j so that $j^2=-1$. It is ironic that
    one of history''s greatest mathematicians, Euler, discovered several important
    relationships involving complex numbers, including the famous Euler''s identity
    of $e^{i\theta}=\cos(\theta)+j\sin(\theta)$, but ultimately dismissed them, saying
    they were mathematical curiosities of ultimately no practical significance. Now
    they are used throughout signal processing, communication theory, and control
    theory.


    Chapter 2: MATLAB as a Calculator'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Rectangular


    This may be the most familiar to you. The complex number z in the diagram (above)
    is written as the sum of its real part and its imaginary part, or z=4+j3. Mathematicians
    would write the same number as 4 + 3; electrical engineers place the j in front
    of its coefficient for emphasis. Notice that complex variables are bold.


    The same complex number z can also be written as its magnitude, or distance away
    the origin to the complex number z makes with respect to the positive horizontal
    axis. See the diagram (opposite) for a graphical example of z=5∠37°, or 5∠0.64
    radians. Note that this represents the same number as 4+j3, expressed in rectangular
    coordinates.


    # Complex Exponential


    Euler''s Identity paved the way for a third representation of complex numbers,
    closely related to polar, but which is actually a function that can be evaluated.
    Using the above example z=5ej37, or z=5e0.64 in radians. Note the similarity to
    this and the polar form.


    # Entering Complex Numbers in MATLAB


    MATLAB uses rectangular notation to enter and display complex numbers. Thus, to
    create a complex number 4+j3 in MATLAB, recall that implied multiplication is
    not supported and instead type the expression:


    ```

    z = 4 + j*3

    ```'
