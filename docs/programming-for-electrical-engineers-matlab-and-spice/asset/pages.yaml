  md: '# OBJECTIVES


    After completing this chapter, you will be able to use LTspice to do the following:


    +   - Use LTspice to create a schematic

    - Analyze a DC circuit, and find the internal voltages and currents, as if with
    a DMM

    - Analyze a time-varying circuit, and find internal voltages, as if with oscilloscope

    - Analyze a circuit whose output changes with frequency

    - Describe the several meanings of “ground"

    - Describe the differences between energy and power, and use LTspice to compute
    them

    - Simulate two common types of ICs: the 555 timermer and the operational amplifier


    # CIRCUIT SIMULATION


    General circuit simulators calculate the voltages and currents in arbitrary circuits.
    They have been in existence since the early 1960s, encouraged by increasingly
    complex circuit designs and initially funded by the US Department of Defense.
    An undergraduate class project in Berkeley spurred some of the first to the open-source
    program we now know as SPICE, the Simulation Program with Integrated Circuit Emphasis.
    The first complete version was authored by Laurence Nagel in 1973, and SPICE has
    since evolved to become the de facto open-source standard for all circuit simulation
    packages.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '![](img/d1b4f05eead98e7b59e76deae28a6347_234_0.png)


    Most popular circuit simulators use SPICE at their core, including LTspice by
    Analog Devices, PSPICE by OrCAD, and Multisim by National Instruments. This text
    uses LTspice, which is free and available for both Windows and Mac operating systems.


    # # UTILITY


    There are often two stages involved in solving real-world engineering problems:
    design and validation. In the design phase, the engineer uses the problem specification
    to create the schematic using techniques in circuit and logic design courses.
    The design phase cannot be aided by circuit simulation, although there are other
    packages that assist with this phase, as filter design programs.


    The validation phase confirms that the circuit created in the design phase works
    as intended. Circuit simulators assist this phase by testing how the design performs
    in both ideal and nonideal conditions, and they can evaluate performance given
    a range of component tolerances, temperatures, and operating conditions.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# INSTALLING LTSPICE


    Download LTSpice from the Analog Devices website (http://www.analog.com). Versions
    are available for both PC and Mac operating systems. Both are relatively small
    downloads, and despite possible differences in version numbers, both offer near-identical
    user experiences. Microsoft users should choose the 64 bit version if prompted
    during installation.


    When the installation is complete, the program will automatically load and show
    the screen below:


    ![](img/d1b4f05eead98e7b59e76deae28a6347_235_0.png)


    # STEPS IN SIMULATING


    This textbook describes the following three steps in circuit simulation in detail:


    +   Draw the schematic (i.e., schematic capture). Three different types of entities
    must be defined in this stage:

    - Components, such as voltage and current sources, resistors, capacitors.

    - Ground.

    - Wires connecting the above elements.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '2. Define the analysis type. In this textbook, we will describe the three

    most common types:


    +   A. DC Analysis: DC analysis assumes all sources are constant, so the

    outputs will be constant.

    B. Transient Analysis: Transient analysis measures time-varying outputs.

    C. AC Analysis: AC analysis measures how the circuit responds to differ-

    frequencies of an input sinusoidal source.


    +   3. View the results. Depending on the analysis type, this output may be

    aumber, like a reading from a digital voltmeter; a time-dependent

    waveform like an oscilloscope trace; or a frequency-dependent plot.


    ![](img/d1b4f05eead98e7b59e76deae28a6347_236_0.png)


    # TECH TIP: WHAT IS GROUND?


    Unlike most components, there are three commonly used

    symbols for ground: ⚩ �. LTSpice uses the triangular

    symbol in the center. To make matters more confusing,

    y of these ground symbols can mean any of three different

    concepts, depending on the context:


    +   1. Ground can mean a physical connection to the earth,

    often through a copper spike driven into the ground.

    Ground is required by certain types of radio antennas,

    aswell as by electrical power safety codes to protect the

    user in case insulation fails.


    +   2. Ground can also refer to the set of conductors that return

    current to the power source in a circuit. For example,

    most electrical equipment in automobiles have two

    ower connections: one connected by wires through

    a fuse to the +12V source and the other to the metal

    assis of the car, called "ground." The car chassis is

    connected to the negative side of the electrical

    source by a thick ground wire.'
  merge: -1
  img_proc: true
