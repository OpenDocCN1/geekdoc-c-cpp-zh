    The LTsice voltage and current sources are very flexible; they can represent constant-voltage
    or current sources, a square wave, a sinusoidal wave, or a number of other commonly
    encountered waveforms. By default, it is a DC (constant) source. To select a different
    waveform, right-click the symbol (not the text) and choose the “Advanced" button.


    To change the designator ID of the source, right-click the text surrounding the
    source. Typical names for voltage sources are V1, V2, etc., and I1, I2, etc.,
    for current sources.


    # Other Common Components: Resistors, Capacitors, Inductors, Diodes, and Transistors


    Resistors, capacitors, inductors, LEDs, transistors, and more can be selected
    using the component dialog box. The only abbreviated names are “res,"cap” and
    “ind” for resistor, capacitor, and inductor. These three and the diode have dedicated
    toolbar buttons, also: ☍ ⍞ You can use the prefix symbols M, k, m, and u to stand
    for Mega, kilo, milli, and respectively, (note that u is used instead of μ). For
    example, it is less error prone to specify a 2.2 μF capacitor as 0.0000022.


