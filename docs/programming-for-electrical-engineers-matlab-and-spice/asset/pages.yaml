- pgno: 13
  md: '# USING MATLAB AS A CALCULATOR


    At this point, type the following commands in the command window and observe what
    they do. Press "Enter" after each line. The MATLAB prompt >> and should not be
    typed:


    +   >> 2 / 5

    >> 3 + (4*9) ^ 20 (MATLAB formats large numbers like 2-10^34 as 2e+34)

    >> x = 5

    >> x + 32

    >> x = 2

    >> y = x + 1

    >> sqrt(16)

    >> sqrt(-25)


    MATLAB can be used as a sophisticated calculator, and it recognizes the following
    basic commands:


    +   +

    \*

    /

    ^


    sqrt()

    As many programming languages, multiplication, division, and powers are represented
    by *, /, and ^. MATLAB uses the standard order of operator precedence to evaluate
    expressions, so 1 + 3 ^ 2 is the same as 1 + (3^2) = 10, not (1 + 3) ^ 2 = 16.
    When in doubt, use parentheses to be clear.


    Notice that if you do not save your calculation result into a variable, MATLAB
    will save it into a variable "ans",short for "answer",so you can reuse it in the
    next calculation, like this:


    +   >> 2 + 3

    >> ans / 10

    returns 0.5'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'MATLAB is like a high-end scientific calculator in several ways:


    +   1. MATLAB only operates on the current line. When the value of x was changed
    from 5 to 2 in the previous example, unlike a spreadsheet, but like a calculator,
    it did not change previous calculations involving x, but rather, only changed
    current and future calculations.


    +   2. When there are variables involved (like x and y, in this example) and an
    equals sign, MATLAB first evaluates the statement to the right of the equals sign,
    and then it sets the value to number. Most programming languages also follow this
    method.


    MATLAB is unlike a calculator in other ways, which may be confusing at first:


    +   1. MATLAB cannot perform symbolic algebra without special toolboxes. Unlike
    many modern calculators, which have modes allow one to enter $x^2 = 1$ and solve
    for $x$, MATLAB does not understand how to work with variables that are not set
    to a numeric value. Thus, MATLAB will understand $x = 4 + 7$ because $x$ is set
    to a specific number. It will then understand $y = x + 5$ and set $y$ to 16. If
    you want to solve for $y$ in this expression, it will not know what to do with
    $2*y = 3*x$. You must do it yourself using algebra, and then enter $y = 3*x/2$.


    +   2. MATLAB does not understand implicit multiplication. $4(3+1)$ will generate
    an error message, unlike $4*(3+1)$, which will evaluate to 16.


