  md: 'and we know f=2000, C=20-10-9, and R2=3000, while one could type


    +   - R1 = 1/(2*3.14159*2000*20e-9) - 3000


    it is clearer and less error-prone to type:


    +   - f = 2000;


    +   - C = 20e-9;


    +   - R2 = 3000;


    +   - R1 = 1/(2*pi*f*C) - R2


    Notice several things in this example: it makes the problem statement more


    +   1. Why we are using variables: it makes natural. It makes it easy to re-run
    the problem with different values. To see how f=1000 changes the calculation,
    for example, change the f line to f=100; and then re-evaluate R1=1/(2*pi*f*C)
    - R2


    +   3. Semicolons at the end stop MATLAB from echoing the result of line. For
    example, typing:


    ```

    f = 2000

    ```


    will cause MATLAB to parrot the following result back to the screen: This is unnecessary
    when declaring variables, so suppressing each semicolon, like so


    ```

    f = 2000;

    ```


    # NAMING AND INSPECTING VARIABLES


    Variable names must begin with a letter. They may be any length, and capitalization
    matters. Electrical engineers tend to name resistors as R, R1, R2, R3, etc., capacitors
    as C, C1, C2, frequency as f, and time as t. Note that MATLAB considers R1 and
    r1 to be two different variables.


    Variables may be composed of letters (lower and uppercase), numbers (but not as
    the leading character), and the underscore _character.'
  merge: -1
  img_proc: true
