    ![](img/d1b4f05eead98e7b59e76deae28a6347_243_0.png)


    # TYPES OF LTSPSICE SIMULATIONS


    There are three commonly used SPICE analysis types at the undergraduate level:
    DC Operating Point, Transient, and AC Sweep.


    **DC Operating Point: This is a complicated name for a simple concept.** Use this
    analysis type if the circuit has only unchanging sources, making constant-voltage
    and constant-current sources. In this case, all voltages and currents in the circuit
    will also be constant, and would be measured in a real-world circuit using a digital
    multimeter. There are no options for this simulation, and the results are viewed
    by hovering the cursor over the wire or component of interest.


    **Transient Analysis:** This is the analysis to use if the circuit has changing
    voltages and currents. Examples includes circuits whose sources step from one
    voltage to another, or are defined to a square wave, or if the circuit oscillates.
    The real-world circuit would require an oscilloscope to view how the circuit voltages
    and currents change in time; the simulated results are viewed by clicking the
    wire or component of interest after simulation to show their voltages on a simulated
    oscilloscope.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# AC Sweep: Electrical engineers are often concerned with how a circuit changes
    a purely sinusoidal source of various frequencies. For instance, a high-fidelity
    audio amplifier should exhibit the same signal gain for input frequencies spanning
    the range of human hearing (often taken to be 20Hz~20kHz), or a low pass filter
    that routes signal energy to bass speakers should pass frequencies below 150 Hz
    but attenuate higher-frequency signals. This analysis is performed with an AC
    Sweep, in which one source is defined to be the source of the variable-frequency
    AC signal, and the resulting change in the signal magnitude and phase is displayed
    versus frequency. This is the equivalent of attaching a spectrum analyzer to a
    real-world circuit, and the resulting magnitude versus frequency plot is commonly
    called a Bode plot.


