  md: '3. In this chapter, however, ground refers to an imaginary, arbitrary voltage
    reference point in a circuit. Voltage is always measured between two points, which
    makes it awkward to describe in a circuit simulator, since the number of possible
    combinations of any two points in a circuit rises very rapidly with circuit complexity.
    When the user attaches the ground symbol to a point, say at "Point B," she is
    saying all voltages are measured relative to Point B. A single ground symbol does
    not change the circuit behavior in any way; it just lets say "the voltage between
    Point A and Point B is 6V." In other words, we define the other circuit voltages
    relative to ground.


    Ground is often placed at the most negative point in the circuit, which is often
    the negative terminal of the power source. In this case, all other voltages in
    the circuit (relative to ground) will be positive, and all current in the circuit
    will return through ground the power source.


    The schematic below (L) shows a number of voltages between various points. The
    adjacent schematic (R) adds a ground symbol, which lets the same voltages be redefined
    in a much simpler manner. Which would you rather?


    ![](img/d1b4f05eead98e7b59e76deae28a6347_237_0.png)'
