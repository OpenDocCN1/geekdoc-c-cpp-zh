- pgno: 33
  md: '# GETTING HELP


    This text is a study guide, not a MATLAB reference manual. A reference manual
    is an exhaustive listing of what every command, listed alphabetically, but it
    does not provide instruction on how to use the system as a whole. By contrast,
    a study guide teaches the reader by introducing commands in small, sequential
    units that build upon each other. MATLAB has two different built-in reference
    manuals: an abbreviated manual, called "help," and a more detailed manual, called
    "doc." To get quick, but abbreviated help with the syntax for a MATLAB command,
    type the following:


    ```

    help <command>

    ```


    For instance, you might type:


    ```

    help plot

    ```


    This will return information about the plot command in the command window

    plot Linear plot.

    plot (X,Y) plots Y versus vector X. If X or Y is a matrix, then the vector is
    plotted versus the rows or columns of the matrix, whichever line up. If X is a
    scalar and Y is a vector, disconnected line objects are created and plotted as
    vertically at X.


    ```

    plot (Y) plots the columns of Y versus their index.

    ```


    Various line types, plot symbols and colors may be obtained with plot (X,Y,S)
    where S is a character string from one element from any or all the following three
    columns:


    | b | blue | | point | | solid |

    | g | green | | circle | | dotted |

    | r | red | | x-mark | | dashdot |

    | c | cyan | | plus | | dashed |

    | m | magenta | | star | | (none) | no line |


    Chapter 1: Introduction to MATLAB 23'
