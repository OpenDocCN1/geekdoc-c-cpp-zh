  md: '# PRO TIP: BUYING A DIGITAL MULTIMETER (DMM)


    The digital multimeter is an important tool for practicing electrical engineers,
    and one you will use frequently. Unlike relatively expensive oscilloscopes, a
    good DMM costs relatively little and will last a long time. If you decide to purchase
    your own DMM, look for the following features (in addition to the resistance and
    AC/DC voltage and current measuring that all the DMMs should have):


    +   - Sound continuity (buzzes when the probes are connected so you can check
    for shorts and opens while looking at your work—very helpful for debugging!)

    - Diode checking

    - Capacitance measuring

    - Frequency measurement (optional)


    Other features are more expensive, and you are less likely to need them as you
    start out. These features include


    +   - True RMS measurement

    - NIST-traceable calibration

    - Go/no-go testing

    - Bargraph displays


