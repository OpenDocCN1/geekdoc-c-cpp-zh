- pgno: 142
  md: '# How the Function Runs


    When a function is called by the user in the command line, like so:

    `ParallelFunction(10,15)`

    the function begins to execute. It begins with the first line:

    `function Rp = ParallelFunction(R1, R2)`


    This first line tells the function to create variables R1 and R2 to assign them
    the values that were passed into the function (i.e., 10 and 15, respectively).
    Unlike a script, these temporary variables R1 and R2 will not stay in memory when
    the function exits, and they will not interfere with any other variables in the
    command window, even if the command window already holds variables of the same
    name.


    Except for the variable names are handled, the rest of the function works as a
    script, or if it were typed directly in the command line. For example,

    `Rp = (R1*R2) / (R1+R2)`ncreates a temporary variable Rp and assigns the result
    of the computation, with the temporary variables R1 and R2. Here the variable
    Rp is not left in memory the program exits, or if the command window had a variable
    named Rp, the temporary variable would not interfere with it. Inside the function,
    variables from the command window are accessible.


    After the last line of the function is run, the function goes back to its declaration:

    `function Rp = ParallelFunction(R1, R2)`

    returns Rp to the command line. This can be viewed if the user calls the function
    in the command line, as follows:


    ```

    ParallelFunction(10,15)

    >> 6

    ```


    Or it can be set to a variable of the user''s choice, like so:

    `Rout = ParallelFunction(10,15)`

    This creates the variable Rout and sets it to 6. In either case, the temporary
    variables R1, R2, and Rp inside the function will not be left in the command window''s
    memory, and if the command window had already defined variables R1, R2, and Rp,
    they would not be changed by the function run.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'In summary, functions, unlike scripts, pass whatever variables they need in
    and out using the function declaration, eliminating the possibility of variable
    name conflicts. Any variables created while a functions executes will be removed
    once the function ends, leaving only the variable(s) that the function was designed
    to return. This behavior of the function is so preferable to that of scripts that
    we will use functions exclusively from this point onwards in Programming for Electrical
    Engineers.


