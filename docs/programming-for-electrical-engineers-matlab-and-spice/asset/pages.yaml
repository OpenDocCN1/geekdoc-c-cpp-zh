  md: 'You can get more comprehensive help by typing:


    +   > doc <command>


    For instance,


    +   > doc plot


    will spawn a help window with detailed description of the desired command.


    # SAVING AND LOADING VARIABLES


    MATLAB does not remember variables between sessions; that is, when MATLAB is started,
    it starts with no variables defined, except for a few hidden constants pi. Once
    variables are defined, they may be saved or loaded. Variables saving are typically
    large vectors or matrices holding a lot of data. These may be very large; for
    example, a vector defined to hold all the close-of-day stock prices for IBM would
    over 20,000 numbers in it.


    To save a variable, which may be real or complex, scalar or vector, in a file
    called "x.txt" in ASCII format (which is a format that you can read and edit in
    a program like Notepad), enter the following:


    +   > save (''x.txt'', ''x'', ''-ascii'')


    The filename first, encased in single quotes, followed by your variable in single
    quotes, and then the ''ascii'' to save the data in an easily read and modified,
    with each of these parts separated by a comma. Committing the ''ascii'' option
    will save the data as a compressed .mat file, which takes less disk space but
    is essentially unreachable by any program other than MATLAB. If the above syntax
    seems difficult to remember, do not worry. As long as you know the name and purpose
    of the save() command, you can get help by typing:


    +   > help save


    ![](img/d1b4f05eead98e7b59e76deae28a6347_34_0.png)


    NOTE

    MATLAB uses single quotes for strings, not double quotes.'
