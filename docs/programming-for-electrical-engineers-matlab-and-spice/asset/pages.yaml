- pgno: 261
  md: '# ADVANCED TIP: USING NETS


    The opamp schematic is functional, looks messy because of the 5V sources providing
    power to the op-amps. If we defined a symbol like +5V to be 5V and another -5V
    to be -5V, then we could significantly neaten the schematic while making the intent
    clearer. These symbols are examples of nets, as illustrated in the following schematic:


    ![](img/d1b4f05eead98e7b59e76deae28a6347_261_0.png)


    The circuit on the right is functionally the same as the previously analyzed circuit
    on the left. The two voltage sources that are apparently unconnected define two
    nets called +5V and 5V, which are used to power the opamp on the right. It also
    uses multiple ground nets to simplify the schematic further. Practicing engineers
    much prefer this to the schematic on the left.


    LTspice permits the definition of nets using the tool. As an example of using
    it to simplify the previous schematic, first create the following schematic capture:


    ![](img/d1b4f05eead98e7b59e76deae28a6347_261_1.png)'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'Then click the pen tool and create the net name +5V, of Port Type "none," and
    place as shown below. Similarly, create a -5V net name and place as shown in the
    figure below:


    ![](img/d1b4f05eead98e7b59e76deae28a6347_262_0.png)


    Wire them up as shown below. Now every time a +5V net symbol is used, it is functionally
    identical to being wired to a +5V voltage source whose negative end is wired to
    ground. This is perhaps only marginally neater in this single-opamp example, but
    becomes far neater in more complex circuits that use multiple opamps.


    ![](img/d1b4f05eead98e7b59e76deae28a6347_262_1.png)'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# PRO TIP: LIFELONG LEARNING


    In 1962, economist Fritz Machlup coined the phrase "Half-life of knowledge" to
    quantify how quickly knowledge becomes obsolete. The outlook is not sanguine for
    electrical engineers; about a century ago, it was estimated to be 35 years, a
    half-century ago, this dropped to a decade, and in 2002, the president of the
    National Academy of Engineering stated it was between 2.5 and 7 years, depending
    on the subfield. Entire career fields mobile; a generation ago could expect to
    carve out a niche in one well-defined area for one company—missile guidance systems
    by Lockheed, for example—and remain there for a career. No longer.


    What can electrical students do safeguard hard-won technology skills?


    +   1. Accept that the skills learned as an undergraduate can be generalized and
    designed to be transferable. MATLAB and Spice have existed for a long time (since
    1984 and 1973 respectively), but both may be superseded by new technologies in
    a career lifetime. It is unlikely, however, that the underlying programming and
    circuit analysis skills gained by learning them will be similarly replaced. It
    is much, easier to learn a second programming language or circuit analysis system
    after the first.

    2. Continue to learn and retrain throughout one’s career. Use IEEE membership
    to keep abreast of new software and hardware developments through'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'section meetings, and read publications like the monthly IEEE Spectrum that
    comes with IEEE mem-ship. Many companies offer in-house training programs and
    reimburse educational expenses weekend seminars to full university degrees. Most
    employers reimburse continued education training expenses required to maintain
    PE licenses. Electrical engineering also has a large presence in the relatively
    recent introduction of Massive Open Online Courses (MOOCs); some excellent ones
    are offered at http://courses.edx.org and through the IEEE.


    Ultimately, it is the same love of learning that drives people to become engineers
    that keeps them current throughout their careers. Although the profession is changing
    more rapidly than ever before, engineering culture is equally quickly adapting
    to the reality that education is not a college degree but a lifetime process.'
  merge: -1
  img_proc: true
