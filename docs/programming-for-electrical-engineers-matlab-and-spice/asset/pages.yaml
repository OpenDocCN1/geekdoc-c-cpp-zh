- pgno: 15
  md: '# TECH TIP: CHARGE AND CURRENT


    ![](img/d1b4f05eead98e7b59e76deae28a6347_15_0.png)


    Two important quantities in ECE are current and charge. An accurate way to think
    of these quantities is the analogy of water being pumped through pipes around
    a closed circuit.


    # Charge


    The amount of water (measured in gallons) is like electrical charge (measured
    in Coulombs, or “C”).). Engineers typically use the variable “Q” to stand for
    the amount of charge, such as Q₁=0.023 C.


    # Current


    The quantity of water flowing past a point (measured in gallons per second) is
    like electrical current (measured in Amps, or “A”).). Engineers use the variable
    “I” to stand for current, such as I₂=12 A.


    # Charge and Constant Current


    We can intuitively understand the relationship between a steady current flow and
    amount of charge that passes: if 2 gallons per second of current passed a point,
    in 3 seconds there would be 2 g/s * 3 s=6 gallons of water that flowed. In the
    same way, if there was a constant I=2 A of current that flowed a wire for 3 seconds,
    there would be a total charge that passed of Q=2 A * 3 s=6C.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'For a constant current flow of I Amps over a period of t seconds, the general
    equation for total current Q in Coulombs is


    **Q=It**


    Graphically, this is shown as follows:


    ![](img/d1b4f05eead98e7b59e76deae28a6347_16_0.png)


    Important: Notice that instead of the formula above, the charge that flows from
    time 0 to time t1 is also equal to the area under the current line between t=0
    and t=t1. This is true even if the current changes with time. Think about using
    the water analogy until it seems obvious.


    # DIGGING DEEPER


    Those who have taken calculus will recognize that the formula for constant current
    Q=i×t generalizes to:


    ```

    Q = ∫ i(t) dt

    ```


    for changing current i(t). Yet the concept remains that the current Q is equal
    to the area under the current graph.'
  merge: -1
  img_proc: true
