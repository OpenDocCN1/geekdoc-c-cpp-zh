    # PRO TIP: INDUSTRY OR GRADUATE SCHOOL?


    Even at the start of their studies, EE students often wonder if they should enter
    industry or graduate school after completing their bachelor''s degree. It is a
    hard decision and perhaps best summarized by listing the benefits of each approach.


    The benefits of going directly into graduate school:


    +   - Many careers require a graduate degree, such as managing engineering projects
    or performing cutting-edge research.

    - Most electrical engineers eventually earn a graduate degree, so it makes sense
    to do so when:

    - Material learned as an undergraduate is the freshest Additional life responsibilities
    are less likely to infringe on studies

    - An early start may help boost career advancement significantly.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# The benefits of going into industry first:


    +   - Graduate school requires a specialization within EE, and it can be difficult
    to choose without some industry expo-first.

    - Since graduate school admissions favor a student''s most recent accomplishments,
    students without high-graduate GPAs may do well in industry and then gain entry
    into graduate programs they would not have been accepted directly out of college.

    - New graduates can earn and save significantly during a few years in industry.

    - Many employees, especially large ones, pay their employees to get an M.S. in
    a related field.

    - New graduates may find they enjoy the industry position they land with their
    B.S., thus saving the time, expense, and opportunity cost of pursuing unnecessary
    graduate studies.


    With these many reasons supporting both courses of action, it is not surprising
    that there is no consensus. Statistics indicate that roughly 25% of graduate seniors
    continue directly to graduate programs in electrical engineering and computer
    engineering and about 55% enter engineering-related industry and government positions
    after graduating. The remaining 20% pursue a variety of other options including
    military, business, law, and medicine. Of those students who graduate and enter
    engineering industry, about 75% will continue at some point in their career to
    graduate school, often after first working 3 to 5 years.'
  merge: -1
  img_proc: true
