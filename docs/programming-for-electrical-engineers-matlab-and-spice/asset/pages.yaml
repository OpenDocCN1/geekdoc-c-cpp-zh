  md: '# FOREWORD


    Welcome, students, as you begin your journey to becoming electrical engineers!

    You probably chose this major because you wanted a search of a challenging and
    rewarding college experience. Perhaps you came in search of a field of study that
    would suit your natural inclinations towards math and science. While some of you
    have prior experiences from First Robotics, Lego League, or a high school electronics
    course, others may never have considered engineering as a career before a guidance
    counselor suggested it. Perhaps you have always known engineering was right for
    you the first time you took apart a household gizmo or saved spare parts taken
    from broken toys. While most people see engineering as a way to solve society''s
    problems using technology, all of you will soon learn to appreciate our profession
    as an extended family of colleagues who share an oddball sense of humor, who have
    actually read their calculator manuals, and who are bothered by technical faults
    in science fiction movies.


    ![](img/d1b4f05eead98e7b59e76deae28a6347_2_0.png)'
  merge: -1
  img_proc: true
- pgno: 3
  md: 'We have designed this textbook not only to help you learn MATLAB programming
    and Spice simulation skills, but also to introduce you to the culture and profession
    of Electrical Engineering. As you progress through the curriculum, you will find
    the way you think about problems will change; your analysis will become clearer,
    your ability to discard confounding variables sharpen, and your ability to construct
    and test models of processes will improve. This will be true whether the problem
    is how to build an improved voltage amplifier, how to increase the morale of the
    junior engineers in your unit, or how to grow a company in the face of international
    competition. EE graduates perform well in engineering, leadership, and business
    roles upon graduation, and many go on to diverse careers in law, medicine, and
    the military. Indeed, Forbes Magazine notes that engineering and computer science
    majors were found to have higher salaries than any other major¹. These advantages
    do not attenuate over time; engineering has long been ranked as the most common
    undergraduate degree among Fortune 500 CEOs², more than business and economics
    majors.


    While a degree in engineering confers many benefits upon graduation, most of all,
    we hope to convey that we become engineers neither for the economic benefits nor
    the opportunity to use technology to help solve societal problems (which we are
    grateful for). We become engineers because we love the challenge of solving difficult
    problems. That is the thought that first-year students and seasoned professionals
    motivated into the early morning hours, and it is a large part of the success
    and satisfaction you will find in-ever career you ultimately choose.


    Welcome to the field,


    ![](img/d1b4f05eead98e7b59e76deae28a6347_3_0.png)


