    Analyze the performance of the filter over the same 1 Hz to 10 kHz range. Record
    a screen grab of the analysis window using the Snip & Sketch Tool using Windows
    or Command-Shift+4 on a Mac. Does the cutoff frequency increase or decrease as
    resistor values are increased? ��ing'
