  md: '# RECALL


    Need to find a root other than a square root? Cube roots and higher are the same
    as taking reciprocal exponentials. For example, $\sqrt[5]{1024}=1024^{1/5}$, or
    in MATLAB, $1024^{1/7}$.


    MATLAB''s $\^$ function will thus find you any root.


    # PRACTICE PROBLEMS


    +   15. Use MATLAB to evaluate $e^{-5}$. $\circledR$


    +   16. Use MATLAB to find $2\log_{10}\sqrt{2}$

    Hint: The MATLAB command for a square root of x is `sqrt(x)`. This number, surprisingly
    close to an integer, turns up frequently in filter design problems. $\circledR$


    # TRIG FUNCTIONS AND THEIR INVERSES


    Electrical frequently use trigonometric functions, especially cosines, to represent
    signals. MATLAB''s trig functions are $cos()$, $sin()$, and $tan()$ to find the
    cosine, sine, and tangent of a number given in radians. For example, $cosine(\pi/2)$
    is found by typing the following:


    ```

    cos(pi/2)

    ```


    Inverse trig functions are given by $acos()$, $asin()$, and $atan()$, where the
    result is returned in radians. For example, the inverse cosine in radians of $-0.5$
    is:


    ```

    acos(-0.5)

    ```'
