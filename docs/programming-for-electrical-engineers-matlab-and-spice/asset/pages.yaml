- pgno: 55
  md: 'But how can you specify the elements from the third through the last? You could
    find the value of the last element using length(v), and use this to build up the
    command:


    ```

    v(3:length(v))

    ```


    MATLAB provides a shortcut for this operation: the end operator, indicating the
    last value of the vector. To simply type:


    ```

    v(3:end)

    ```


    Similarly, the last five elements can be extracted or set using the command:


    ```

    x = v(end-4:end) to extract, or v([1 2 3 4]) to set.

    ```


    # Removing Elements in Vectors


    What does removing an element" in a vector mean? We already know how to set it
    to zero; for example, setting the first element in vector v = [1 2 3] to 0 can
    be done with the following command:


    ```

    v(1) = 0;

    ```


    To fully remove the value means to shorten the length of the vector, and this
    is accomplished by setting the value equal to [], the null vector. In the above
    example, typing


    ```

    v(1) = [] changes vector v from [1 2 3] to [2].

    ```


    Now length(v) returns 2.


    # Building Vectors from Other Vectors


    Vectors can be assembled from other vectors and scalars. If x = [1 2 3] and y
    = [6 7 8], then typing


    ```

    z = [x 7.5 y]

    ```


    create vector z with the components [1 2 3 7 5 6 8].'
