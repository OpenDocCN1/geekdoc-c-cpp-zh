- pgno: 146
  md: '# Zero Output Arguments


    Occasionally, it is useful for function to not return any arguments, such as when
    a function displays a plot. An example you have already encountered the built-in
    `plot(x, y)` command. The declaration for a zero output function is `function
    myFunction(...)`


    For example, the following function creates an artistic-looking plot and returns
    no arguments to the command line:


    ```

    function coolPlot()

    plot(fft(eye(11)));

    ```


    ![](img/d1b4f05eead98e7b59e76deae28a6347_146_0.png)


    # One or More Input Arguments


    Variables are passed into functions in the first-line declaration statement to
    manage the right of the equals sign, as shown below for three input arguments:


    ```

    function outputs = myFunction(input1,input2,input3)

    ```


    When this function is called from the command window using the syntax below, `x
    = myFunction(1,2,3)` then variables input1, input2, and input3 will be created
    and set equal to 1, 2, and 3, respectively. The function can also be called using
    the syntax `x = myFunction(a,b,c)`


    Whatever the variable a, b, and c hold will now be assigned to input1, input2,
    and input3. Variables a, b, and c not be visible inside the function, but input1,
    input2, and input3 will be destroyed. Once the function ends, any changes the
    function makes to variables input1, input2, and input3 will not propagate outside
    the function.'
