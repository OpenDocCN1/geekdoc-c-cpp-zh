  md: '# PRO TIP: NON-ENGINEERING CAREERS


    Many electrical engineering graduates choose to pursue careers other than Electrical
    Engineering, and find that the quantitative skills they learned as students transfer
    well. Popular non-engineering careers for EE graduates include


    +   - Sales: There are many opportunities for qualified engineers who are more
    interested in working with people than design. Although these jobs are really
    about building trusting relationships, many require engineering-level knowledge
    about the system being sold, such as when selling substation transformers to provide
    to growing communities.

    - Project management: This is another people-centric position, and it requires
    the ability to manage teams of engineers during the development phase of a project.
    Such positions require far more communication and planning skills than design
    skills.

    - Military: Increasing automation, especially in the technology-centric branches
    of the Air Force and Navy, calls for greater numbers of engineers. There are special
    ROTC scholarships reserved specifically for engineering majors to help fill this
    gap.

    - Medicine: Engineers have higher Medical Admission Test (MCAT) scores on average
    than both biology majors and "pre-med" health science majors¹, and the analytical
    training they receive gives them advantages in certain specialties, including
    cardiology, neurology, and radiology.'
  merge: -1
  img_proc: true
