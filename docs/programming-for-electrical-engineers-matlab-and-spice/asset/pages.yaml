- pgno: 5
  md: '# INTRODUCTION


    # PURPOSE OF THIS TEXT


    We wrote Programming for Electrical Engineers because we could not find

    "ideal" laboratory manual from among the currently available introductions to

    MATLAB and introductions to Spice tailored for students of Electrical Engineering

    (EE). Many such texts read like user manuals (e.g., "this key does this, this,
    command that"), without much attention to connecting to the underlying principles

    of Electrical Engineering. Other texts were abstract, focusing more on the heart

    of procedural programming, but likely too advanced for a first-year engineering

    aience. A few of the texts currently available provide excellent introductions

    to general engineering principles, but they do not focus on the unique concerns

    of specific majors.


    Unlike other manuals, Programming for Electrical Engineers introduces MATLAB,

    Spice, and general programming and analysis contexts within an Electrical

    Engineering context, and it tailors its content to the specific needs of a single-

    semester course. Thus, Programming for Electrical Engineers is accessible for

    first-year students, whether or not they have a background in programming or

    circuit analysis. While this textbook omits concerns that would be critically
    important to a Computer Science student, like data structures, it includes specialized

    mathematics applications, like complex phase analysis, which are central to

    frequency-domain analysis in Electrical Engineering. Programming for Electrical

    Engineers also provides an overview of computationally intensive methods used

    in Circuit Analysis, Electronics, Signals and Systems, Controls, and Digital Signal

    Processing. It touches on some ideas from the digital courses as well, with the'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'exception of hardware description language (HDL) modeling of general digital
    systems, which deserves an entire course of its own. In short, this textbook offers
    both a general introduction to the analog aspects of Electrical Engineering and
    a specific overview of the programming packages of MATLAB and Spice.


    # SOFTWARE OVER ELECTRICAL ENGINEERS


    There are a number of software packages commonly used in Electrical and Computer
    Engineering, including MATLAB, Spice, C++, VHDL, Python, Java, C#, JavaScript,
    Multisim, and Verilog. You will learn about the first two in this text, and many
    more as you progress through the curriculum.


    +   * **MATLAB:** MATLAB is the lingua franca of Electrical Engineering, Aeronautics,
    and Bioengering, and it is becoming increasingly common in Mechanical Engineering
    as well. MATLAB is an advanced calculator, a graphing package with vastly more
    customizable results than Excel, and a general programming language. MATLAB works
    primarily with numbers; although it has symbolic capabilities, it is not intended
    to be an algebraic solver, like Wolfram Alpha or Mathematica.


    +   * **Spice:** Spice is a circuit simulator of simulating almost any analog
    or digital circuit. Lets the user build the circuit graphically and then probe
    it to read voltages and currents. There are many variants of Spice; in this course,
    we will use a freeware version LTSpice, published by Analog Devices.


    +   * **C:** The oldest of the programming languages still widely in use, C''s
    simple syntax is well-suited for embedded systems (miniaturized computers on a
    chip). It is very closely related to the language to program Arduino microcontrollers.
    Despite its ubiquity in miniaturized embedded systems, you will not find it in
    fullsized PC programs because it cannot make complex applications as easily as
    modern programming languages that support object-oriented behavior.'
  merge: -1
  img_proc: true
- pgno: 7
  md: '+   * C++: This language (pronounced "Cee-plus-plus") is one of the most common
    languages used to develop programs that run on personal computers and web. Unlike
    MATLAB and Python, it can run directly from the operating system as a standalone
    program (MATLAB and Python programs typically must run from within a MATLAB or
    Python shell). C++ is a superset of the C programming language that adds object-oriented
    behavior.


    +   * VHDL:VHDL is a specialized language used to program a specific type of integrated
    circuit called a Field Programmable Gate Array (FPGA). These chips do not execute
    code in a typical fashion; rather, they run thousands of processes at the same
    time, and they require a specialized language to do so. VHDL is slightly more
    common among defense contractors to its major competitor, Verilog.


    +   * Python: This relatively new language is similar to an open-source version
    of MATLAB. Python has become increasingly common in the hobby-world, it does not
    require an expensive MATLAB license, but it is not yet as common as MATLAB in
    industry and academia.


    +   * Java: Java is a popular multipatform programming language. Like C++, it
    is object-oriented and creates stand-alone programs, and many feel it has a cleaner
    syntax than C++. Java is very common, but its overall use is declining.


    +   * JavaScript: Despite its name, JavaScript has little in common with Java.
    This language has grown in popularity since it became an embedded-part of HTML
    (which is one of the main reasons that the use of Java has declined), and it is
    now most commonly used within the html of web pages.


    +   * C#: C# is a modern, object-oriented programming language, similar in syntax
    to C++, but also cleaner, like Java. It has become more popular than Java for
    creating Windows-based programs that run on PCs and the web, but it is tied to
    the Microsoft operating system.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '+   - Multisim: Multisim is another popular circuit simulator, similar to Spice.
    It is currently popular among hobbyists, but it is steadily gaining traction among
    industry professionals.


    +   - Verilog: Like VHDL, Verilog is another language used to program FPGAs. Verilog
    is more common among nondefense contractors in the United States, and the language
    looks more like C.


    +   - MathCAD: MathCAD is a hybrid of a spreadsheet and a higher-mathemat package,
    like MATLAB. It is faster to learn, but it also has less programming power. MathCAD
    is commonly used in Civil Engineering.


    +   - AutoCAD, Solidworks, and Inventor: These are solid-modeling-programs to
    create virtual models of two- or three-dimensional structures. AutoCAD is very
    commonly used by civil engineers, while mechanical engineers generally prefer
    SolidWorks or Solid modeling skills are usually not expected among Electrical
    Engineering students, but they are useful to have.


    # Why MATLAB and Spice?


    It would be impressive to have students finish their first semester with a working
    knowledge of all of the above programs, we concentrate on MATLAB and Spice in
    this course because:


    +   1. There is not enough time to cover all the packages and languages used by
    electrical engineers.


    +   2. Many of the above programs will not make sense until you take more advanced
    engineering courses. VHDL and Verilog, for example, first require an understanding
    of state machines and combinatorial logic, topics taught in Digital Logic courses.


    +   3. You will likely find MATLAB and Spice helpful in future courses, such as
    Circuits, Digital Signal Processing, and Electronics.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# FORMATTING CONVENTIONS


    Each chapter in Programming for Electrical Engineers has two types of problems:
    "Practice Problems" and "Lab Problems." Practice Problems will check your general
    comprehension of specific material from the preceding pages. At the end of each
    chapter, Lab Problems present more difficult problems that will challenge you
    to synthesize and implement the material you have learned throughout the previous
    chapter.


    > BOXED ITEMS

    Boxed items like this highlight Practice Problems, which should be completed as
    you read through the chapter. These relatively simple problems help to significantly
    increase understanding and retention of the material in a way reading alone does
    not.


    SHADED CALLOUTS

    Callouts like this one are useful, but not essential. They include:


    +   **Tech Tip:** Discussions that link the material to more advanced circuit
    analysis and laboratory skills

    **Pro Tip:** Topics relating to the profession of Electrical Engineering as a
    whole

    **Recall:** A review of algebra skills or other materials covered earlier in the
    text

    **Take Note:** Particularly important formulas or concepts

    **Digging Deeper:** Optional, in-depth explorations of topics to enrich your introduction
    to Electrical Engineering'
  merge: -1
