  md: '# Inserting Elements in Vectors


    To insert a 5 at the start of vector v = [1 2 3], type the command:


    ```

    v = [ 5 v ]

    ```


    You will find that vector v now holds [5 1 2 3].


    To insert a 7 at the end of vector v = [1 2 3], type the command:


    ```

    v = [ 7 ]

    ```


    Vector v now holds [1 2 3 7].


    To insert a 5 into the middle of vector v = [1 2 3], type the command:


    ```

    v = v(1:2) 5 v(3:4)

    ```


    While this command may seem like a syntactic mouthful, it follows from the preceding
    steps. v(1:2) returns the first two elements of v, v(3:4) returns the last elements
    of v, and those with the inserted value of 5 are all assembled into a new vector,
    assigned to v. It could have been assigned to a new vector called x if the original
    vector v was needed in other calculations.


