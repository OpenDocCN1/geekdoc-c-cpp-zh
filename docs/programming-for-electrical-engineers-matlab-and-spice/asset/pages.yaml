- pgno: 100
  md: '# TECH TIP: LOW PASS FILTERS


    Low pass filters are a common type of circuit that removes high frequencies and
    allows lower ones to pass through. The simplest type can be constructed from a
    single resistor and capacitor, as shown below on the left. Circuit analysis courses
    can teach you how to derive the equation shown on the right, which completely
    describes the circuit''s behavior. This equation is the circuit''s transfer function
    H(f) and evaluates to a complex number, as described in Chapter 2. To see what
    the circuit does to an input signal of frequency f, evaluate H(f) at that frequency
    and take the magnitude of the resulting complex number. if |H(f)| = 1, it passes
    frequency without change; if |H(f)| > 1, it amplifies the signal; and |H(f)| <
    1, it attenuates the signal.


    ![](img/d1b4f05eead98e7b59e76deae28a6347_100_0.png)


    H(f) is complex; it is the magnitude |H(f)| that is commonly plotted against frequency
    f and often as a Bode plot, which along a logarithmically scaled horizontal axis,
    and plots the magnitude |H(f)| in dB.'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'For example, plot the response of this circuit with R=1 kΩ and C=1.6 \muF from
    $1\le f\le10$ kHz with the following commands:


    ```

    R = 1000;

    C = 1.6e-6nf = logspace(0,4,100); % defines the component values

    creates a log-spaced frequency vector from 1 to 10,000 Hz

    ```


    ```

    H = 1./(1+j2*pi*f*R*C); % calculates the H vector

    dB = 20*log10(abs(H)); % calculates the magnitude in dB

    ```


    ```

    semilogx(f,dB)

    title(''Lowpass filter'')\xlabel(''Frequency (Hz)'')nylabel(''Amplitude (dB)'')ngrid(''on'')

    ```


    ![](img/d1b4f05eead98e7b59e76deae28a6347_101_0.png)


    A lowpass filter response is shown above. It starts to cut frequencies above about
    100 Hz.'
  merge: -1
  img_proc: true
