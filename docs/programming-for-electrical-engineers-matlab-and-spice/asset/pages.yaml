  md: "# break\n\nIt is sometimes necessary to break out of the middle of a loop before\
    \ it is completed. For example, this might happen if the loop is searching for\
    \ some criteria to be met, such as trying to minimize a calculated error below\
    \ some threshold. Once this is accomplished, the loop has served its purpose;\
    \ in such a case, you can exit the loop immediately using the break command.\n\
    \n![](img/d1b4f05eead98e7b59e76deae28a6347_202_0.png)\n\nAnother example involves\
    \ searching to see if a given number is prime. Method, given a number n, is to\
    \ loop over all possible integers between 2 and n to see if there are any factors\
    \ of the given number. The moment any factors are found, the loop exits and reports\
    \ that the number is not prime. If the loop completes with no factors, the function\
    \ reports that the number must be prime. By rather searching for possible factors\
    \ from 2 through n, one only needs to search up to the square root of n, since\
    \ any factor greater than this must be multiplied by a factor less than this.\n\
    \nDefine the following helper function and save as isInteger.m:\n\n```\nfunction\
    \ b = isInteger(x)\nb = x = floor(x); % b is 1 if x is an integer,\n    % otherwise\
    \ 0\n```\n\nLast, define the main function to locate primes, and save as isPrime.m:\n\
    \n```\nfunction b = isPrime(n)\nb = 1; % assume it is prime, then check\nfor f=2:floor(sqrt(n))\
    \ % f cycles through\n    % all possible factors\n```"
  merge: -1
