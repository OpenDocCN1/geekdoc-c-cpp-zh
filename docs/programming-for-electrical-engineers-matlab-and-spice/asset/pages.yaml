  md: '> NOTE

    Scripts and function names cannot have spaces in them.

    ParallelR.m is a valid MATLAB filename, whereas Parallel R.m is not.


    # PRACTICE PROBLEMS


    +   1. Create a script called CurrentSolver that expects to have the variables
    V and R defined. It should create a variable I and set it equal to the current
    defined by Ohm''s Law: V=I/R.


    # FUNCTIONS


    Functions, like scripts, are programs consisting of collections of MATLAB commands
    stored in a .m file. But functions correct two major problems with scripts involving
    how variables are passed into and out of the program and how variables created
    inside the program are handled after the program ends.


    # How Scripts Work


    Scripts require variables to be predefined with specific names before the script
    is run, such as R1 and R2 in the previous example. The script is run, and the
    script creates variables to store the result, Rp in the previous example. A more
    complicated script may create intermediate variables to help work out the final
    answer. All of these variables still exist when the script exits—the output variable
    that holds the answer and any intermediate variables created to help compute the
    answer.'
