- pgno: 97
  md: '# PRACTICE PROBLEMS


    +   4. Create an oscilloscope-like plot (that is, use a grid) of the waveform
    x(t)=cos(3t)–2 for 0 ≤ t ≤ 5 s. Label the plot as “Oscilloscope trace”, the horizontal
    axis as “time (s),” and the vertical axis as “Volts (V)”. Ⓡ


    # Logarithmic Axis Scaling


    Logarithmic axis scaling is useful when plotting values where the independent
    (horizontal) or dependent (vertical) variables have dense information for small
    values, but progressively spread larger values. For example, attempting to plot
    each of the 145 standard value 5% resistor values from 1Ω to 1MΩ would be impossible
    on a scale, linear-scaled axis because the 0.1Ω difference between 1.0Ω and 1.1Ω
    would not be visible on a scale extended to 1,000,000Ω.


    To fix the horizontal, vertical, or both axes of a plot may be logarithmically
    scaled, using the following commands, respectively:


    ```

    semilogx(horizontal_data, vertical_data)

    semilog(horizontal_data, vertical_data)

    loglog(horizontal_data, vertical_data)

    ```


    These commands are used in place of the plot() command and have the exact same
    syntax. For example, to create a log-scaled voltage data in vector v measured
    at corresponding times t, using a black line five times thicker than the MATLAB
    default type


    ```

    semilog(t,v,''k'',''linewidth'',5)

    ```


    Note that a logarithmically scaled axis cannot contain a zero value, since log(0)=∞.'
  merge: -1
