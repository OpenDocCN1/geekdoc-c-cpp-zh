  img_proc: true
- pgno: 118
  md: '# Using get() to Get the Keyword Names of Settable Properties


    To handle graphics, it is necessary to understand how MATLAB stores graphics information.
    All information about the plot, from data, to line style, to axis tick labels,
    is stored inside one of three elements: the figure window, the axis, or the line
    plot. These are the same three elements that are selectable by the active deactivating
    mode. To see the options for each element, use get().


    # Figure Window


    get(gcf) lists figure window properties. There are about 60 of these properties,
    including:


    +   - ''position'', [x,y,width,height] sets the size and location of the figure
    window relative to the desktop.

    - ''color'', [r,g,b] sets the color, in [red green blue] coordinates, and the
    background of the figure window


    # Axis


    get(gca) lists all axis properties (there over 120), including:


    +   - ''position'', [x,y,width,height] sets the size and location of the axis
    window relative to the figure window

    - ''xtick'', 1:10 sets the numeric position of the tick marks along the axis

    - ''fontSize'', 12 sets the font size in points of the text labeling the axis

    - ''visible'', ''off'' makes the axis invisible but keeps the data that they display


    # Data


    h = get(gca, ''children'');get(h) lists the properties of the plotted data. The
    number of these properties depends on the type of plot, but for a data line plot
    have 36 of them, including:


    +   - ''markerfacecolor'', [r,g,b] sets the fill color for the data markers

    - ''edgecolor'', [r,g,b] sets the color for the outside border

    - ''linecolor'', [r,g,b] sets the fill color for the data markers'
  merge: -1
  img_proc: true
