    Practice Problem). Follow the steps below to gain a solid working knowledge of
    AC sweep analysis. When the schematic capture is complete, it should look as below
    on the right. Notice that because ground is defined, there is no need to bring
    the lower wire out to the schematic to define Vout between two points; it is now
    the single point from the right of the opamp.


    ![](img/d1b4f05eead98e7b59e76deae28a6347_257_0.png)


    # Open up a Blank Schematic


    +   - Open LTSpice, and from the menu, File → New Schematic.

    - Save it immediately using menu, File → Save As. Give it simple name with no
    spaces under "Name" (e.g., spice_ac). Save it in your personal data directory
    for this course.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# Add Opamp Integrated Circuit


    +   - Integrated circuits are separated by folders. Choose the [Opamp] folder
    and select the “UniversalOpamp2” component. Typing the first few letters of the
    name will autscroll to the right location. If you were physically prototyping
    the circuit, you could achieve a more accurate simulation by selecting an opamp
    part number rather than the generic UniversalOpamp2 part.


    # Add Voltage Sources


    +   - Click the component icon. Find the “voltage” component—typing the first
    few letters will scroll to it—double-click to select it, and place it in your
    schematic by clicking once. You may want to use Ctrl-R. Right-click the symbol,
    not the text, to set the opamp sources to 5V. You may need to zoom out with the
    tool to place all of the sources. To indicate that the input on the left is the
    AC sinusoidal source frequency will be swept during the analysis stage, leave
    the DC value blank, choose “Advanced” and then in the “Small signal AC” panel
    enter “1” for AC Amplitude.


    # Add Resistors, Capacitors, and Ground


    +   - Click the resistor icon, place two resistors, right-click the component
    symbol (not text), and give them values of 10k. Spike understands “k” and there
    is no need to add the Ω symbol. Do the same for the capacitors using the symbol
    (you may want to rotate one using Ctrl-R before placing). The ground is placed
    with the symbol.


    # Wire It Up


    +   - Use the tool to wire the circuit together.


    # Run the AC Sweep Analysis


    +   - Specify the type of analysis to run. From the menu, choose Simulate → Edit
    Simulation CMD and choose “AC Analysis” tab. AC Analysis determines the magnitude
    of the output voltage changes as a designated input sinusoid varies in frequency.
    To analyze the circuit over'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'a range of frequencies from 1Hz to 10 kHz, choose the "Decade" type of sweep
    (this is the standard Bode-style range of logarithmic frequencies earlier studied),
    100 points per decade (higher is more accurate, lower is faster), 1 as the start
    frequency, and 10k as the stop.


    +   Choose "OK" and place the .ac dec 100 10k" anywhere on a blank area of the
    schematic.


    +   Select Simulate → Run from the window or choose the button. The following
    schematic/analysis window will appear:


    ![](img/d1b4f05eead98e7b59e76deae28a6347_259_0.png)


    +   Position the cursor over a schematic wire of whose voltage you want to examine
    a Bode-style plot of the voltage versus frequency. The above example highlights
    the cursor hovering over the wire that is exiting out of the opamp. The cursor
    changes to resemble a red probe.


    +   Click on the probe to display the corresponding voltage.


    ![](img/d1b4f05eead98e7b59e76deae28a6347_259_1.png)


    # Chapter 6: Spice'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'Two plots are automatically created; one shows the magnitude of the signal
    in green, whose value is plotted relative to the axis on the left, and the other
    plot shows the phase in red, whose value is plotted relative to the axis on the
    right. These Bode plots. To remove the phase trace, click on the right axis and
    choose “Don''t plot phase.”Notice how the data show low frequency signals under
    100Hz are not attenuated. Earlier chapters describe how dB are calculated using
    a logarithmic-scale of 10dB/20, so 0dB = 10dB⁰ = 10¹ = 100% passed at low frequencies.
    Higher-frequency signals are reduced; the approximately -40dB of attenuation at
    1 kHz corresponds to the circuit passing just 10⁻² = 1% of the input signal.


    ![](img/d1b4f05eead98e7b59e76deae28a6347_260_0.png)


    # PRACTICE PROBLEMS


