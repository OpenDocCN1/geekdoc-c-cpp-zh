  md: 'Modern multimeters typically measure from 1 Ω up to 1 MQ

    (million Ohms) or more. The size of that span is amazing—it is like a kilometer-long
    ruler marked in millimeters!

    The exact value of a resistor is guaranteed to be within a percentage of its marked
    value. This percentage is called a tolerance; common ones are 1% and 5%. Since
    it does not make sense to stock resistors in increments of 1% if their tolerance
    is only guaranteed to the nearest 5%, resistor values are available in standardized
    sets of values in increments approximately equal to their. For example, the first
    5% tolerance resistor values (omitting their Ω units) are 1.0, 1.1, 1.2, 1.3,
    1.5, 1.6, 1.8, 2.0, 2.2, 2.4, 2.7, 3.0, 3.3, 3.6, 3.9, 4.3, 4.7, 5.1, 5.6, 6.2,
