- pgno: 209
  md: '# PRO TIP: FUNDAMENTALS OF ENGINEERING


    An earlier Pro Tip discussed the advantages of taking the optional step of earning
    the Professional Engineering license. The first step in a PE is to pass the Fundamentals
    of Engineering (FE) exam. This test is designed to be taken during the senior
    year, or by recent graduates of an engineering program. There are versions of
    the FE exam for Electrical, Mechanical, Civil, and other engineering majors; the
    FE exam topics common to all of these majors, such as mathematics, probability,
    ethics, and engineering economics, as well as topics unique to the selected discipline.
    The EE exam, for instance, also includes circuit analysis, signal processing,
    electromagnetics, digital systems, and programming. The exam is composed of two
    three-hour computer-graded segments, which are taken with a break for lunch. Certain
    models of scientific non-programmable calculators are authorized, and a book containing
    reference equations is provided. You can find out more about the exam, how to
    purchase a copy of the reference equation book, and how to register for it by
    visiting NCEES.org, the administering testing agency.


    Although scores are reported, it is essentially a pass/fail exam since its only
    purpose is to serve as one of several steps required to become eligible to take
    the PE exam. In past years, roughly 70% of electrical and computer engineering
    test-takers earned passing scores, and one can retake the exam as many times as
    required, up to once in every two-months testing window, and up to three times
    per year.'
