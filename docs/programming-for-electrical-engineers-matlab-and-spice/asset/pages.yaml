  md: 'Plots comparing the same data with without logarithmic scaling of the horizontal
    axis are shown below. Notice how horizontal log scaling of this particular data
    reveals important information lost in the linearly scaled plot, even though the
    horizontal and vertical ranges of the axes are the same in both.


    ![](img/d1b4f05eead98e7b59e76deae28a6347_98_0.png)


    # TECH TIP: BODE PLOTS


    Bode plots are a type of plot used by electrical engineers to represent the frequency-specific
    amount of signal passed by a filter. The vertical scale is measured in decibels
    (abbreviated as dB), which are calculated as $20 log_{10}(x)$, where x is the
    amount of signal. The horizontal scale is always plotted logarithmically. For
    example, to plot the frequency (Hz), voltage (V) pairs (1, 1), {10, 1}, (100,
    0.1), and (1000, 0.01) as a Bode plot in MATLAB:


    ```

    f = [1 10 100 1000];

    y = [1 1 0.1 0.01];

    db = 20*log10(y);

    semilogx(f,db)

    title(''Bode Plot'')

    xlabel(''Frequency (Hz)'')

    ylabel(''Amplitude (dB)'')

    ```'
  merge: -1
  img_proc: true
