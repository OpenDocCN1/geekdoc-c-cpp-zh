- pgno: 164
  md: "# CONDITIONAL BRANCHING: if-else-end\n\nIn the previous section, a sinc function\
    \ was developed that ran set of code if x equal zero and used a second statement\
    \ to run a second set of code if x was not zero. To need, run one set of code\
    \ if the logical test is true, and a different set of code if the logical test\
    \ is false, so common that it has its own syntax: if-else-end.\n\n```\nif (logical\
    \ expression here evaluates to true or false)\n    % statements execute if the\
    \ logical\n    % expression is true\nelse\n    % statements execute if the logical\n\
    \    % expression is false\nend\n```\n\nThe sinc(x) function developed in the\
    \ previous section can be simplified by this syntax, as shown below:\n\n```\n\
    function sinc(x)\n    % sinc(x) takes a scalar, returns sinc\n    if (x==0) %\
    \ if x is zero\n        out = 1;\n    else\n        out = sin(x)/x;\nend\n```\n\
    \nAll conditionally executing blocks of code can have many statements that run\
    \ if the logical test is true or false, although this example has just one line\
    \ of code in each. Remember to end the if-else block with an end statement to\
    \ mark the code that will run regardless of the if's logical test.\n\n![](img/d1b4f05eead98e7b59e76deae28a6347_164_0.png)\n\
    \nif-else-end flowchart showing program execution flow."
  merge: -1
