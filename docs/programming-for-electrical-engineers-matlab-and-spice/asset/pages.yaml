- pgno: 77
  md: 'The amount of voltage dropped by R1 is proportional to the ratio of R1 to the
    total circuit resistance R1 + R2. Since the entire applied voltage must be dropped
    by the two resistors, it is intuitive that it is split according to each resistor''s
    relative contribution to the total resistance.


    By the same reasoning, the voltage across R2 is


    ```

    $V_2 = V_{in} \frac{R_2}{R_1 + R_2}$

    ```


    This means the sum of the voltage drops across both resistors is


    ```

    $V_{in} \frac{R_1}{R_1 + R_2} + V_{in} \frac{R_2}{R_1 + R_2}$

    ```


    which simplifies to $V_{in}$ the total applied voltage, just as we expect.


