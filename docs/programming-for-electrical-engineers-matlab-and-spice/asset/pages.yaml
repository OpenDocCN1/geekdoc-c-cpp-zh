  md: '# CREATING MATRICES


    As with creating vectors, there are several different ways to create matrices:


    +   - Defining components explicitly

    - Filling with duplicate values

    - Filling with vectors

    - Filling with random values


    # Defining Components Explicitly


    To create the matrix x= \begin{bmatrix} 2 & -3 \ 1 & 0 \end{bmatrix}


    type the following in MATLAB:


    ```

    x = [2 -3; 1 0]

    ```


    Compare that with how you earlier defined the top row vector y=[2 -3];

    expressed as:


    ```

    y = [2 -3]

    ```


    The semicolon operator ; separates rows when used inside a matrix definition.
    Note that square brackets [] are used to define matrices and vectors.


    > RECALL

    The semicolon has another purpose besides separating matrix rows; when placed
    at the end of a line, it prevents MATLAB from displaying the calculation results.


    # Filling with Duplicate Values


    The zeros() and ones() commands can work to create matrices, as well as vectors
    described previously.


    zeros(2,4) creates a matrix filled with 2 rows of 4 zeros and is equivalent to
    typing:


    ```

    [0 0 0 0; 0 0 0 0]

    ```'
