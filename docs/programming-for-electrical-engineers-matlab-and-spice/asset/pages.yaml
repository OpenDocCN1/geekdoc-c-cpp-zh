    # MATRICES


    Thus far, the vectors discussed in this chapter have been either a single column
    or row of numbers. A **matrix** is a collection of both rows and columns of numbers,
    e.g.,


    ```

    \begin{bmatrix} -4 & 1.7 \ 2 & \sqrt{2} & 0 \end{bmatrix}

    ```


    The dimensions of the matrix indicate how many rows and columns it has, with the
    number of rows listed first, followed by the number of columns. Thus, the $2\times3$
    column matrix above is a $2\times3$ matrix. Matrices are used in digital signal
    processing to hold streams of data, where the data streams can be very large.
    For example, a 100-second song recorded at the CD-quality of 44,000 samples/second
    can be represented as a 2-column $\times4,000$-row matrix. The columns represent
    the left and right channels of the signal, and each row represents a sample, i.e.,
    a snapshot in time of the voltage to be applied to a speaker.


    # Special Matrix Dimensions


    If a matrix has a single row, such as 1x5, it is called a **row vector**. The
    vectors discussed earlier in this chapter are examples of row vectors. A **matrix**
    may also have a single column, like 5x1. These are called **column vectors**.
    Matrices may also have a single row and column; these matrices are **scalars**,
    or "regular" num-matrices. Matrices may even be **null**, meaning they have zero
    rows and columns; then they hold nothing.'
  merge: -1
