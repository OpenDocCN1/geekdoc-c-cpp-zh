    # GROWING VERSUS PRE-ALLOCATING VECTORS


    Often a function will return a vector whose elements are calculated inside a loop.
    In this case, the vector may be either initialized to the full size with zeros()
    command and then filled inside the loop or grow size inside the loop with its
    length increasing with every loop. The former method is much more efficient and
    is accomplished by reserving the required memory for the vector before the loop
    begins with a command like this:


    ```

    result = zeros(1,1000);

    ```


    The less-efficient method is to grow the size of vector in the middle of the loop,
    like this:


    ```

    result = [newvalue result];

    ```


    If the resulting vector size is known before the loop begins executing, as is
    often the case, use the former method. Only if the resulting vector length is
    not known in advance should the latter method be used.'
