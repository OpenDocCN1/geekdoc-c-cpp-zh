- pgno: 121
  md: '# TECH TIP: GREEK SYMBOLS IN ECE


    Electrical engineers commonly use 19 of the 24 letters in the Greek alphabet,
    and it is important to be able to recognize and pronounce the names of them. The
    table below pairs each symbol with its application in ECE:


    | | | |

    |---|---|---|

    | α | alpha | exponential decay rate |

    | β | beta | transistor current gain |

    | Γ | Gamma | transmission reflection |

    | Δ | Delta | change |

    | δ | delta | impulse function |

    | η | eta | efficiency ratio |

    | θ | theta | angle |

    | λ | lambda | exponential decay rate |

    | μ | mu (micro) | 10⁻⁶ |

    | ξ | xi | damping ratio |

    | Π | Pi | product |

    | π | pi | 3.14159... |

    | Σ | Sigma | sum |

    | ∂ | sigma | conductivity, real part of a complex number |

    | τ | tau | time constant |

    | Φ | Phi | magnetic flux |

    | φ | phi | angle (similar use as θ) |

