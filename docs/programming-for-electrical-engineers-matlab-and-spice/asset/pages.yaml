  md: '# TECH TIP: OSCILLOSCOPES


    ![](img/d1b4f05eead98e7b59e76deae28a6347_96_0.png)


    Electrical engineers often use oscilloscopes to graph time-varying voltages in
    circuits. Oscilloscopes are usually marked with a grid background. The user sets
    the scope so that each vertical division of the grid represents a certain number
    of volts (abbreviated V/div), and so that each horizontal division corresponds
    to a known amount of time (abbreviated time/div).


    # Grids


    You can add an oscilloscope-like grid to your plots with the grid command. After
    creating your basic plot, turn the grid on or off using these commands:


    ```

    grid(''on'')

    grid(''off'')

    ```'
