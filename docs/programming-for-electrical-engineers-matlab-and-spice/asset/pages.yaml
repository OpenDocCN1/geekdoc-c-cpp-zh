    # PRO TIP: ETHICS II


    Your engineering integrity will likely be tested many times throughout your career,
    which is why the Accreditation Board for Engineering and Technology (ABET) requires
    that ethics be an integral part of engineering education. Besides the IEEE Code
    of Ethics, described in an earlier Pro Tip, engineers who earn the Professional
    Engineer (PE) certification promise to abide by a similar set of rules set by
    the National Society of Professional Engineers (NSPE). This organization represents
    all engineering fields, including electrical, computer, mechanical, civil, biomedical,
    chemical, nuclear, and petroleum.


    Chapter 6: Spice'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'The preamble of the NSPE Code of Conduct for Engineers (2007) states:


    Engineers shall at all times recognize that their primary obligation is to protect
    the safety, health, property, and welfare of the public. If their professional
    judgment is overruled under circumstances where the safety, health, property,
    or welfare of the public are endangered, they shall notify their employer or client
    and such other authority as may be appropriate.


    David Jonassen developed a generic framework to help you use this NSPE Code of
    Ethics, or the IEEE Code of Ethics, with any engineering ethics problem (Journal
    of Education, vol. 98, no. 3, 2009). His analysis method consists of five steps:


    +   * State the problem. Define the ethical problem clearly in a few words.

    * Get the facts.

    * Identify and defend competing moral viewpoints. Most ethical problems involve
    multiple perspectives, and each viewpoint may lead to a different conclusion.

    * Identify the best course of action.

    * Qualify the course of action decision with facts.


    When faced with a difficult decision, consider documenting your decision using
    this framework.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# TECH TIP: 555 TIMER


    There are over ½ million integrated circuits (ICs) sold just by Digi-Key, one
    of the largest electrical parts vendors. Of these, the 555 timer is historically
    the most popular. Since its introduction by Signetics in 1972, this chip has outsold
    all other types of ICs. It has been used in medical monitors, spacecraft navigation
    systems, and children''s toys. Although it can be used in many different configurations,
    one of the most common is as an astable multivibrator—in simpler words, oscillator.
    The frequency is set using two resistors and a capacitor; it does not change significantly
    with changes in the powering voltage. The schematic using it as an astable multivibrator
    and the pin numbering for the IC is shown below.


    Notice that although the schematic symbol is rectangular like the IC, the pin
    numbering of the schematic does not have to correspond to the pin positions on
    the actual device, which allows the schematic to be drawn more simply. For instance,
    the schematic shows pins 4 and 8 next to each other since they are electrically
    connected with a wire, although on the physical device those pins are diagonally
    across the body of the IC.


    ![](img/d1b4f05eead98e7b59e76deae28a6347_251_0.png)


    Schematic


    The design equations for this circuit are:

    LED blinks on for 0.693*R2*C seconds

    LED blinks off for 0.693*(R1+R2)*C seconds


    Pin numbering'
