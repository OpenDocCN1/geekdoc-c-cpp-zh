- pgno: 105
  md: '# SCATTER PLOTS


    Scatter plots use similar data to line plots, but instead of joining each (x,y)
    pair of data with lines, scatter plots mark the points themselves with markers.
    They are most appropriate when graphing discrete data values, where the linear
    interpolation between data points that are implied by connecting them with a line
    may not be appropriate. To create scatter plots, use the same syntax as for a
    plot, but use one of the symbols in the table below instead of a line style symbol:


    | Symbol | Abbreviation |

    |---|---|n| * | '','' |

    | o | ''o'' |

    | x | ''x'' |

    | + | ''+'' |

    | * | ''*'' |

    | Δ | ''^^'' |

    | □ | ''s'' |


    To create a scatter plot for measured resistances r = [57 65 63 59 65] of five
    different heating elements x = [1 2 3 4 5], use the following code:


    ```

    x = 1:5;

    r = [57 65 63 59 65];

    plot(x,r,''o'')

    ```


    ![](img/d1b4f05eead98e7b59e76deae28a6347_105_0.png)'
  merge: -1
  img_proc: true
