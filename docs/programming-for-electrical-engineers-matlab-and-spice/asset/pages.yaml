  md: 'By contrast, typing:


    +   >> format short


    returns MATLAB to displaying the default form, rounded to four decimal places.

    In electrical engineering classes, we tend to keep MATLAB in short format and
    typically only report 3 significant digits in our answers. This is because components
    we use—resistors, capacitors, and inductors—rarely have more than 3 significant
    digits of accuracy in their values, and the instruments we use to measure voltage
    and current in undergraduate laboratories are usually limited to 3 significant
    digits as well.


    ![](img/d1b4f05eead98e7b59e76deae28a6347_25_0.png)


    # SCIENTIFIC NOTATION


    Very large and very small numbers are more easily read in scientific notation.
    For example, a typical capacitor used in our field is a 6.8·10⁻¹² Farad capacitor.
    It would be much harder to pick one out from the parts cabinet if its label read
    0.000000000000068. In MATLAB, one can enter values in scientific notation using
    this shortcut (given for the above example):


    +   >> 6.8e-12


    Notice that there is no space between the 6.8 and the e; this is not implied multiplication
    (which MATLAB does not), but rather a shortcut that gives the same result as entering
    6.8*10^(-12), and yet is easier to enter and read (and internally for MATLAB,
    faster to process). MATLAB evaluates this input as follows:


    +   >> 6.8000e-12'
