  md: '# Script Problems


    Scripts have two problems. First, the script user must know the name of the input
    variables and the names of the new variable that the script creates to hold the
    answer. If you use someone else''s script, you will have to open up the script
    in an editor to figure out what input and output variables are called. If the
    script happened to use the same output variable name that you were already using,
    your data would be overwritten by the script.


    Another problem is that the script may need to create many intermediate variables
    to help compute the answer. All of these intermediate variables remain in memory
    after the script exits, potentially cluttering up workspace with many undesired
    temporary variables. If any of these variables happen to have the same name as
    variables you were using, your variables would be overwritten. Both of these problems
    can be avoided by using functions.


    # How Functions Work


    Functions are written the same way that scripts are written, except that they
    add an extra first line. This extra line declares the program is a function, defines
    the outputs, and defines the inputs. This is called the function declaration,
    and it will be discussed in detail in the following section.


    Functions are called differently than scripts. Scripts are called by first defining
    the input variables and then running the script. Functions do not require defining
    variables; variables are passed into and out of the function using the syntax:


    ```

    outputVariables = functionName(inputVariables)

    ```


    You have used this with built-in functions, like these:


    ```

    y = exp(-6) % The input variable is -6 and y is set

    % to the function''s result

    x = sin(pi) % The input variable is \pi and x is set

    % to the function''s result

    ```'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'Here is a comparison of the ParallelScript program as a function, now called
    ParallelFunction:


    | Script | Function |

    | --- | --- |

    | Script program | Function program |

    | Rp = (R1*R2) / (R1+R2) | function Rp = ParallelFunction(R1, R2)

    Rp = (R1*R2) / (R1+R2) |


    Using the function

    R1 = 10

    R2 = 15

    ParallelFunction(10,15)


    The script creates the variable Rp = 6 returns to the command window. Since it
    was not assigned it is assigned to the default ans: ans = 6


    Notice that the script requires the input variables to be defined R1 and R2 and
    creates the output variable that is always named Rp. Unlike the script, the function
    does not require input variables to be defined at all. In this example, the variables
    were passed directly in, and passed directly out. One could have them them using
    the same names as the function declaration used, as:


    ```

    R1 = 10

    R2 = 15

    Rp = ParallelFunction(R1, R2)

    ```


    But the variables could also have been defined as anything because the function
    is not aware of any variables in the command window, except those passed by the
    input arguments. For example, the following commands will just work as well as
    those in the previous example:


    ```

    FirstR = 10

    SecondR = 15

    OutputR = ParallelFunction(FirstR, SecondR)

    ```


    In fact, the input variables do not need to be separately defined, as this equivalent
    example shows:


    ```

    OutputR = ParallelFunction(10,15);

    ```'
