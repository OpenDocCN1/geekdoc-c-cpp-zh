    # PRACTICE PROBLEMS


    10. Modify the above function to take a number as an argument and test to see
    if it is 999. If so, it outputs 1; otherwise, it outputs a 0. Call the function
    problem10().©


    # LOGICAL OPERATORS


    Logical operators operate on logical true (1) or false (0) arguments are particularly
    important to ECE students, since binary true/false signals form the basis of all
    digital computers. Common ones are listed below:


    | Operator | Name | Example | Example result |

    |---|---|---|---|n| && | AND.True if both operands are true. | x=5; (x<1) && (x<4)
    | 0 (only one is true) |

    | || | OR.True if either operand is true. | x=5; (x<1) || (x<4) | 1 (the first
    test is true) |

    | NOT | Changes true to false and to true. | a=''Hello''; ~equal(a,''T'') | 1
    (the strings are not equal) |


    If you are familiar with digital gates, the digital logic symbols are:


    | Operator | Symbol |

    |---|---|n| AND | && |

    | OR | || |

    | NOT | ~ |'
  - '[PAGE 159]


    As an example, suppose you need to check the validity of numbers in a large data-set
    of electronically sampled location measurements. These numbers should all be nonnegative
    integers less than 10 or could be –1 if the sensor is returning an error condition.
    The following function tests whether a particular number meets these criteria:


    ```

    function out = test(in)

    isError = (in == -1); % 0 if non-error, 1 if error

    isInteger = (in == floor(in)); % 0 if non-integer, else 1

    isInRange = (in >= 0) && (in < 10)

    out = isInteger && (isInRange || ~isError);

    ```


    # PRACTICE PROBLEMS


    +   11. Create a function called problem11() that takes a scalar (single number)
    and returns 1 if the input is not an an integer is negative. Thus problem11 (pi)
    returns 0, but problem11 (-pi) returns 1. ©


    # LOGICAL OPERATIONS ON VECTORS AND MATRICES


    It is frequently desirable to perform logical operations on large datasets vectors
    or matrices. A logical operation on a vector will return a vector of logical results.
    For example,


    ```

    v = [-2 -1 0 1 2]

    b = (v >= 0)

    ```


    results in

    b = [0 0 1 1 1]'
  - '[PAGE 160]


    There are four common actions done with such a resulting vector (or matrix) of
    logical values:


    +   - Determine if any of the logical results are true

    - Determine if all of the logical results are true

    - Determine how many of the results are true

    - Replace the values of the vector or matrix for which the given relationship
    is true with another number


    # Determine if Any of the Logical Results Are True


    Use the any() logical operator. In the above example,

    any(b)

    or equivalently

    any(v>=0)


    evaluates to true (returns 1) since some of the values in vector v are positive.


    # Determine If All of the Logical Results Are True


    Use the all() logical operator. In the above example,

    all(b)

    or equivalently

    all(v>=0)


    evaluates to false (returns 0) since not all of the values in vector v are positive.


    # Determine How Many Results Are True


    Since logical true values are represented by the numeric value of 1, summing the
    results will return the total number of operations that evaluates to true. The
    above example,


    sum(b)

    or more directly

    sum(v>=0)

    will return 3.'
  - '[PAGE 161]


    # Replace the Values of the Vector for Which the Given Relationship Is True With
    Another Number


    This is a very common requirement and has its syntax. Up to this point, vectors
    have been indexed with a number like v(4) and matrices have been indexed with
    a pair of numbers like m(3,4). However, they can also be indexed by a logical
    vector or matrix of the same size as shown in the following example. To replace
    the negative elements in the following vector with 9''s,


    ```

    v = [-2 -1 0 1 2]

    v(v<0) = 9

    Now v = [9 9 0 1 2]

    ```


