    # TECH TIP: OPERATIONAL AMPLIFIERS


    The operational amplifier, or more simply “opamp,” is a very commonly used integrated
    circuit. It is available in a stunning number of varieties; Digi-key sells 35,000
    different types of opamps. Op-amps are thoroughly described in circuit courses;
    this textbook considers one application of an idealized opamp whose schematic
    symbol is:


    ![](img/d1b4f05eead98e7b59e76deae28a6347_255_1.png)


    Chapter 6: Spice 249'
  - '[PAGE 256]


    The opamp is used for many different purposes, including: amplifying, filtering,
    and even as an analog computer, integrating and differentiating input signals.
    An example of a low pass filter is shown below. The signal input $v_{in}(t)$ to
    the opamp is on the left, the output is on the right, and the vertical wires in
    the middle of the opamp with the small polarity symbols are the DC power connections
    to the opamp.


    The circuit shown below, known as a second-order Butterworth low pass filter,
    will pass sinusoids with frequencies below a preset frequency $f_0$ but attenuate
    sinusoids of higher frequencies. It could be placed before a bass amplifier to
    ensure no high frequencies are sent to the woofer speakers.


    ![](img/d1b4f05eead98e7b59e76deae28a6347_256_0.png)


    The right-most 5V source crosses, but does not connect to, the output of the opamp.
    The convention in EE is that two wires crossing perpendicularly do not connect
    unless there is a large black dot drawn at their intersection.


    The design equations for this circuit, given desired cutoff frequency $f_0$ and
    resistor value $R$, are


    ```

    $C_1 = \frac{\sqrt{2}}{2\pi R f_0}$ and $C_2 = \frac{C_1}{2}$

    ```'
