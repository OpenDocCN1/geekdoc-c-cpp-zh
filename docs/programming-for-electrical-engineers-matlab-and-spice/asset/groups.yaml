    logspace(a


    # Filling with Random Values


    You have already been introduced to random number generation in Chapter 1. It
    is common to need random numbers in electrical engineering problems, such as when
    you need to simulate the effects of random variances of resistor values.


    ```

    v = rand(1,10)

    Creates a vector v filled with 10 random numbers between 0 and 1. The first number,
    1, directs the rand() command to create a vector. The second number is the number
    of random values to be made on the interval [0, 1), to just under 1.

    ```


    ```

    10*rand(1,20)-5

    Creates a vector with 20 random numbers, between -5 and 5.

    ```


    # DIGGING DEEPER


    The numbers produced by the MATLAB random generator are not truly random—they
    are pseudandom, since they are generated deterministically by an algorithm. This
    algorithm uses a seed to generate its initial seed value; each successive pseudorandom
    number seeds the next value generated. When MATLAB launches, it initializes its
    seed according to the current date and time, measured in hundredths of a second,
    so it always appears to generate a new sequence of random numbers.'
