  mdcn: "\n\n逻辑表达式是一个求值为“true（真）或“false（假）”的语句。关系运算符是逻辑运算符的一种，用于比较两个值，例如 5 > 4（真）或\
    \ 3≤–4（假）。MATLAB 返回 1 表示真，返回 0 表示假。MATLAB 有几种类型的关系运算符；下面列出了其中最常见的几种：\n\n| 运算符\
    \ | 名称 | 示例 | 示例结果 |\n|---|---|---|---|\n| > | 大于 | (5 > 2) | 1 |\n| < | 小于 |\
    \ 7 < -6 | 0 |\n| >= | 大于等于 | a=-5; a>=6 | 0 |\n| <= | 小于等于 | a=7; b<=a+b | 0\
    \ |\n| == | 等于 | 5 == 5 | 1 |\n| ~= | 不等于 | 5 ~= 5 | 0 |\n| isequal() | 等于（适用于字符串、向量和矩阵）\
    \ | a='hello'; b='Hello'; isequal(a,b) | 0 (区分大小写) |\n\n注意，最常用的关系语句之一——测试两个标量数字是否相同的语句，不是\
    \ = 而是 ==。\n\n在下面的示例中，名为 password() 的函数测试输入是否为 \"secret\"，如果是，则输出 1；否则输出 0：\n\n\
    ```\nfunction result = password(input)\n% password tests to see if the input is\n\
    % the string 'secret'\nresult = isequal(input, 'secret');\n```\n\n# 练习题\n\n10.\
    \ 修改上面的函数，接受一个数字作为参数并测试它是否为 999。如果是，输出 1；否则输出 0。调用函数 problem10()。\n\n# 逻辑运算符\n\
    \n逻辑运算符作用在逻辑真 (1) 或假 (0) 参数上，这对于电子与计算机工程（ECE）学生尤为重要，因为二进制真/假信号构成了所有数字计算机的基础。常见的运算符列如下：\n\
    \n| 运算符 | 名称 | 示例 | 示例结果 |\n|---|---|---|---|\n| && | 与 (AND)。如果两个操作数都为真则为真。 |\
    \ x=5; (x<1) && (x<4) | 0 (只有一个为真) |\n| || | 或 (OR)。如果任一操作数为真则为真。 | x=5; (x<1)\
    \ || (x<4) | 1 (第一个测试为真) |\n| NOT | 非 (NOT)。将真变为假，将假变为真。 | a='Hello'; ~equal(a,'T')\
    \ | 1 (字符串不相等) |\n\n如果你熟悉数字逻辑门，则数字逻辑符号如下：\n\n| 运算符 | 符号 |\n|---|---|\n| AND |\
    \ && |\n| OR | || |\n| NOT | ~ |\n\n例如，假设你需要检查一个来自电子采样位置测量的大型数据集中数字的有效性。这些数字都应该是小于\
    \ 10 的非负整数，或者当传感器返回错误状态时可能为 –1。接下来的函数测试一个特定数字是否符合这些标准：\n\n```\nfunction out =\
    \ test(in)\nisError = (in == -1); % 非错误为 0，错误为 1\nisInteger = (in == floor(in));\
    \ % 非整数为 0，否则为 1\nisInRange = (in >= 0) && (in < 10)\nout = isInteger && (isInRange\
    \ || ~isError);\n```\n\n# 练习题\n\n11. 创建一个名为 problem11() 的函数，接受一个标量（单个数字），如果输入不是整数或为负数则返回\
    \ 1。因此，problem11 (pi) 返回 0，但 problem11 (-pi) 返回 1。\n\n# 向量和矩阵上的逻辑操作\n\n通常需要对大型数据集的向量或矩阵执行逻辑操作。对向量进行逻辑操作将返回一个逻辑结果向量。例如，\n\
    \n```\nv = [-2 -1 0 1 2]\nb = (v >= 0)\n```\n\n结果为\nb = [0 0 1 1 1]\n\n对于这种生成的逻辑值结果向量（或矩阵），通常有四种常见操作：\n\
    \n- 确定是否存在任何逻辑结果为真\n- 确定是否所有逻辑结果都为真\n- 确定有多少个结果为真\n- 将向量或矩阵中关系为真的值替换为另一个数字\n\n\
    # 确定是否存在任何逻辑结果为真\n\n使用 any() 逻辑运算符。在上面的示例中，\nany(b) 或等价的 any(v>=0) 求值为真（返回 1），因为向量\
    \ v 中的某些值为正数。\n\n# 确定是否所有逻辑结果都为真\n\n使用 all() 逻辑运算符。在上面的示例中，\nall(b) 或等价的 all(v>=0)\
    \ 求值为假（返回 0），因为向量 v 中的并非所有值都是正数。\n\n# 确定有多少个结果为真\n\n由于逻辑值由数值 1 表示，对结果求和将返回值为真的总数。上面的示例中\n\
    sum(b) 或更直接的 sum(v>=0) 将返回 3。\n\n# 将向量中关系为真的值替换为另一个数字\n\n这是一个常见需求并具有语法。到目前为止，向量使用如\
    \ v(4) 的数字进行索引，矩阵使用一对数字如 m(3,4) 进行索引。然而，它们也可以通过与尺寸相同的逻辑向量或矩阵进行索引，如下所示。要将以下向量中的负元素替换为\
    \ 9，\n\n```\nv = [-2 -1 0 1 2]\nv(v<0) = 9\nNow v = [9 9 0 1 2]\n```\n\n# 练习题\n\
    \n1. 创建一个函数 problem12()，接受一个数字向量并返回两个变量。第一个返回变量 \"count\"，是输入向量中所有大于 0 的值的计数。第二个是名为\
    \ \"result\" 的向量，等于输入值，但将大于 0 的值替换为 10。换句话说，它的函数定义为\n\n```\nfunction [count, result]\
    \ = problem12(x)\n```\n会导致 count = 2 且 result = [-5 10 10]。\n\n# 条件分支：if-end\n\
    \n到目前为止，我们讨论的每个 MATLAB 程序在运行时都会执行每一行代码。if-end 块是一个例外；if 和 end 之间的代码只有在逻辑语句为真时才会运行，例如：\n\
    \n```matlab\nif (求值为真或假的逻辑表达式)\n    % 如果表达式为真，则执行这里的语句。\n    % 直到 end 之前的所有语句都会执行。\n\
    ```\n\n在下面的示例中，名为 password() 的函数测试输入是否为 \"secret\"，如果是，则输出 1；否则输出 0：\n\n```matlab\n\
    function result = password(input)\n% password tests to see if the input is\n%\
    \ the string 'secret'\nresult = isequal(input, 'secret');\n```\n\n# 练习题\n\n10.\
    \ 修改上面的函数，接受一个数字作为参数并测试它是否为 999。如果是，输出 1；否则，输出 0。调用函数 problem10()。\n\n# 逻辑运算符\n\
    \n作用在逻辑真 (1) 或假 (0) 参数上的逻辑运算符对 ECE 学生尤为重要，因为二进制真/假信号构成了所有数字计算机的基础。常见的运算符如下：\n\n\
    | 运算符 | 名称 | 示例 | 示例结果 |\n|---|---|---|---|\n| && | 与 (AND)。如果两个操作数都为真则为真。 | x=5;\
    \ (x<1) && (x<4) | 0 (只有一个为真) |\n| || | 或 (OR)。如果任一操作数为真则为真。 | x=5; (x<1) || (x<4)\
    \ | 1 (第一个测试为真) |\n| NOT | 非 (NOT)。将真变为假，将假变为真。 | a='Hello'; ~equal(a,'T') | 1\
    \ (字符串不相等) |\n\n如果你熟悉逻辑门，则数字逻辑符号如下：\n\n| 运算符 | 符号 |\n|---|---|\n| AND | && |\n\
    | OR | || |\n| NOT | ~ |\n\n例如，假设你需要检查一个来自电子采样位置测量的大型数据集中数字的有效性。这些数字都应该是小于 10\
    \ 的非负整数，或者当传感器返回错误状态时可能为 –1。接下来的函数测试一个特定数字是否符合这些标准：\n\n```matlab\nfunction out\
    \ = test(in)\nisError = (in == -1); % 非错误为 0，错误为 1\nisInteger = (in == floor(in));\
    \ % 非整数为 0，否则为 1\nisInRange = (in >= 0) && (in < 10)\nout = isInteger && (isInRange\
    \ || ~isError);\n```\n\n# 练习题\n\n11. 创建一个名为 problem11() 的函数，接受一个标量（单个数字），如果输入不是整数或为负数则返回\
    \ 1。因此，problem11 (pi) 返回 0，但 problem11 (-pi) 返回 1。\n\n# 向量和矩阵上的逻辑操作\n\n通常需要对大型数据集的向量或矩阵执行逻辑操作。对向量进行逻辑操作将返回一个逻辑结果向量。例如，\n\
    \n```matlab\nv = [-2 -1 0 1 2]\nb = (v >= 0)\n```\n\n结果为\nb = [0 0 1 1 1]\n\n\
    对于这种生成的逻辑值结果向量（或矩阵），通常有四种常见操作：\n\n- 确定是否存在任何逻辑结果为真\n- 确定是否所有逻辑结果都为真\n- 确定有多少个结果为真\n\
    - 将向量或矩阵中关系为真的值替换为另一个数字\n\n# 确定是否存在任何逻辑结果为真\n\n使用 any() 逻辑运算符。在上面的示例中，\nany(b)\
    \ 或等价的 any(v>=0) 求值为真（返回 1），因为向量 v 中的某些值为正数。\n\n# 确定是否所有逻辑结果都为真\n\n使用 all() 逻辑运算符。在上面的示例中，\n\
    all(b) 或等价的 all(v>=0) 求值为假（返回 0），因为向量 v 中的并非所有值都是正数。\n\n# 确定有多少个结果为真\n\n由于逻辑值由数值\
    \ 1 表示，对结果求和将返回值为真的总数。上面的示例中\nsum(b) 或更直接的 sum(v>=0) 将返回 3。\n\n# 将向量中关系为真的值替换为另一个数字\n\
    \n这是一个常见需求并具有语法。到目前为止，向量使用如 v(4) 的数字进行索引，矩阵使用一对数字如 m(3,4) 进行索引。然而，它们也可以通过与尺寸相同的逻辑向量或矩阵进行索引，如下所示。要将以下向量中的负元素替换为\
    \ 9，\n\n```matlab\nv = [-2 -1 0 1 2]\nv(v<0) = 9\nNow v = [9 9 0 1 2]\n```\n\n\
    # 练习题\n\n1. 创建一个函数 problem12()，接受一个数字向量并返回两个变量。第一个返回变量 \"count\"，是输入向量中所有大于 0\
    \ 的值的计数。第二个是名为 \"result\" 的向量，等于输入值，但将大于 0 的值替换为 10。换句话说，它的函数定义为\n\n```matlab\n\
    function [count, result] = problem12(x)\n```\n会导致 count = 2 且 result = [-5 10\
    \ 10]。\n\n# 条件分支：if-end\n\n到目前为止，我们讨论的每个 MATLAB 程序在运行时都会执行每一行代码。if-end 块是一个例外；if\
    \ 和 end 之间的代码只有在逻辑语句为真时才会运行，例如：\n\n```matlab\nif (求值为真或假的逻辑表达式)\n    % 如果表达式为真，则执行这里的语句。\n\
    \    % 直到 end 之前的所有语句都会执行。\n```\n\n在下面的示例中，名为 password() 的函数测试输入是否为 \"secret\"\
    ，如果是，则输出 1；否则输出 0：\n\n```matlab\nfunction result = password(input)\n% password\
    \ tests to see if the input is\n% the string 'secret'\nresult = isequal(input,\
    \ 'secret');\n```\n\n# 练习题\n\n13. 创建一个名为 problem13 的函数，接受一个字符串并返回一个字符串，如果提供的密码为\
    \ \"secret\" 则设置为 \"unlocked\"，否则设置为 \"locked\"。提示：\n- 与其他编程语言不同，MATLAB 使用单引号\
    \ ' 表示字符串，而不是双引号。\n- == 和 ~= 比较数字；isequal() 和 ~isequal 比较字符串、向量和数组。\n\n# 条件分支：if-else-end\n\
    \n在上一节中，开发了一个 sinc 函数在 x 等于零运行时一组代码，并使用第二个语句在 x 不为零运行时另一组代码。在逻辑测试为真时运行一组代码，在为假运行时运行另一组代码是非常常见的，以至于它有自己的语法：if-else-end。\n\
    \n```matlab\nif (这里的逻辑表达式求值为真或假)\n    % 如果表达式为真执行这些语句\nelse\n    % 如果表达式为假执行这些语句\n\
    end\n```\n\n上一节中开发的 sinc(x) 函数可以通过这种语法简化，如下所示：\n\n```matlab\nfunction sinc(x)\n\
    \    % sinc(x) 接受一个标量，返回 sinc\n    if (x==0) % 如果 x 为零\n        out = 1;\n   \
    \ else\n        out = sin(x)/x;\nend\n```\n\n所有条件执行代码块都可以有许多在逻辑测试为真或假时执行的语句，尽管这个示例中每个部分只有一行代码。记住用\
    \ end 语句结束 if-else 块，以标记无论 if 的逻辑测试如何都会运行的代码。\n\n![](img/d1b4f05eead9e7b59e76deae28a6347_162_0.png)\n\
    \nif-else-end流程流程显示程序执行流。\n\n更复杂的示例评估了 sinc(x) 函数，这是一个信号处理中常用的函数，其定义如下：\n\n$$\\\
    sin(x) = \\begin{cases} \\frac{\\sin(x)}{x}, & x \\neq 0 \\\\ 1, & x = 0 \\end{cases}$$\n\
    \n这通过下面的示例实现：\n\n```matlab\nfunction y = sinc(x)\nif x ~= 0\n y = sin(x)/x;\n\
    end\nif x==0\n y = 1;\nend\n```\n\n# 练习题\n\n13. 创建一个名为 problem13 的函数，接受一个字符串并返回一个字符串，如果提供的密码为\
    \ \"secret\" 则设置为 \"unlocked\"，否则设置为 \"locked\"。提示：\n- 与其他编程语言不同，MATLAB 使用单引号\
    \ ' 表示字符串，而不是双引号。\n- == 和 ~= 比较数字；isequal() 和 ~isequal 比较字符串、向量和数组。\n\n"
