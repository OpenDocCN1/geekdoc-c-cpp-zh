    There are three commonly used SPICE analysis types at the undergraduate level:
    DC Operating Point, Transient, and AC Sweep.


    **DC Operating Point: This is a complicated name for a simple concept.** Use this
    analysis type if the circuit has only unchanging sources, making constant-voltage
    and constant-current sources. In this case, all voltages and currents in the circuit
    will also be constant, and would be measured in a real-world circuit using a digital
    multimeter. There are no options for this simulation, and the results are viewed
    by hovering the cursor over the wire or component of interest.


    **Transient Analysis:** This is the analysis to use if the circuit has changing
    voltages and currents. Examples includes circuits whose sources step from one
    voltage to another, or are defined to a square wave, or if the circuit oscillates.
    The real-world circuit would require an oscilloscope to view how the circuit voltages
    and currents change in time; the simulated results are viewed by clicking the
    wire or component of interest after simulation to show their voltages on a simulated
    oscilloscope.'
  - '[PAGE 244]


    # AC Sweep: Electrical engineers are often concerned with how a circuit changes
    a purely sinusoidal source of various frequencies. For instance, a high-fidelity
    audio amplifier should exhibit the same signal gain for input frequencies spanning
    the range of human hearing (often taken to be 20Hz~20kHz), or a low pass filter
    that routes signal energy to bass speakers should pass frequencies below 150 Hz
    but attenuate higher-frequency signals. This analysis is performed with an AC
    Sweep, in which one source is defined to be the source of the variable-frequency
    AC signal, and the resulting change in the signal magnitude and phase is displayed
    versus frequency. This is the equivalent of attaching a spectrum analyzer to a
    real-world circuit, and the resulting magnitude versus frequency plot is commonly
    called a Bode plot.


    # DC SIMULATION WALKTHROUGH


    The second and third phases of circuit simulation, defining the analysis type
    and viewing the results, are best taught by example. The first of the main types
    of circuit analysis this chapter covers DC simulation, and it will be taught by
    completing an analysis of the circuit shown below:


    ![](img/d1b4f05eead98e7b59e76deae28a6347_244_0.png)


    Follow these steps to gain a solid working knowledge of DC circuit analysis.


    Open up a Blank Schematic


    +   * Open LTSpice and from the menu, File → New Schematic.

    * Save it immediately using menu, File → Save As. Give the schematic a simple
    name with no spaces under "Name" (e.g., spice_dc). Save it in your personal data
    directory for this course.'
  - '[PAGE 245]


    # Add a 10V Source


    +   Click the component icon �. Find the “voltage” component—typing the few letters
    will scroll to it—double-click to select it, and place it in your schematic by
    clicking once. If you click again, you will place a second voltage source; to
    prevent this and get out of “create voltage source” mode, press the Esc key.


    +   How to delete and move components: rather than select-and-drag, or select-and-delete,
    as in most programs, select the first action, and then select the thing you want
    to change. Create a second voltage source now using the above steps to practice:


    +   To delete the second voltage source, delete the tool ✱, and then click on
    the offending voltage source. Press Esc to delete mode.


    +   Move your desired V1 source to the left middle screen by selecting the tool
    ☭. If you forget which it is, hover the mouse icons for the tooltip. Select the
    voltage source you want to move, move your mouse and click to place it. Press
    Esc to move mode.


    +   To set the voltage to 10V, right-click inside the symbol. Do not right-click
    on text outside the symbol or you will change the name of the source but not its
    **value**.


    +   Set the DC voltage to 10 (the “V” at the end is optional), leave the series
    resistance box empty and press OK.


    +   Save your work! Ctrl-S or from the menu, File → Save.


    **Review:** to make a 10V source, select the part using �and choose “Voltage,”
    then set the value of the source by right-clicking inside the symbol.


    # Add Two Resistors


    +   You could click � and choose “resistor,” but resistors are so common they
    have their own icon: �. Click it and place two resistors stacked vertically separated
    by a small distance to the right of the voltage source. Click “Esc” to exit resistor-placing
    mode.


    +   Want to change the vertical orientation of your resistors? Try placing one
    horizontally oriented. To do this, choose the resistor again'
