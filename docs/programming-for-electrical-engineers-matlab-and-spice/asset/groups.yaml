    a) 使用 MATLAB 的向量函数，当 n=100、1000 和 10000 时计算该方程。第一个命令应为 n = [100 1000 10000]。使用一个额外的向量命令完成题目。提示：注意向量的“点”符号。

    b) 计算 n=100, 1000 和 10000 时的 %误差 = (近似值-精确值)/精确值 x 100%。记得指数函数是 exp()。使用单个向量命令完成。注意使用向量如何简化工作。


    7. 使用 MATLAB 计算 2.5 A 电源运行 45 秒后通过电路的总电荷。（记得在答案中写上单位！）


