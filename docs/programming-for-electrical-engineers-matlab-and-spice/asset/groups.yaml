    # TECH TIP: VOLTAGE DIVID


    One of the most common circuits is the voltage divider. It is composed of two
    resistors in series so that a voltage across both is split, with part being dropped
    by the first resistor and the remainder by the second as shown in the schematic
    below. The formula to find the voltage $V_1$ that is across $R_1$ is given in
    the figure:


