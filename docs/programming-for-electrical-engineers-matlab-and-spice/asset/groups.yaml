    # TECH TIP: WIRE SIZING


    Wire sizes in North America are specified by the American Wire Gauge (AWG) standard.
    Smaller wire diameters have higher wire gauge sizes. General-purpose hookup wire
    used in electronics prototyping is typically 22 AWG; thicker wire used to carry
    electricity to kitchen appliances is often 18 AWG, and heavy-duty power extension
    cables are 14 AWG. Wire is sized as a function of its maximum required carrying
    capacity and by the length over it is required to carry the current. The table
    below lists common AWG sizes with wire diameter and its recommended current capacity
    over short distances such as inside appliances:


    | AWG | Conductor diameter (in.) | Max current capacity (Amps) |

    |---|---|---|n| 12 | 0.0808 | 41 |

    | 14 | 0.0641 | 32 |

    | 16 | 0.0508 | 22 |

    | 18 | 0.0403 | 16 |

    | 20 | 0.0320 | 11 |

    | 22 | 0.0253 | 7 |

    | 24 | 0.0201 | 4 |


    Wire is also available in two types: solid and stranded. Solid wire is composed
    of a single, solid (usually copper) conductor.'
