    # SCRIPTS


    There are two fundamentally different types of MATLAB programs: scripts and functions.
    A script file is a collection of MATLAB commands, saved in a file that ends in
    a .m suffix. When executed, it behaves exactly as if the commands typed from the
    command line. All variables created in the MATLAB session before the script is
    run are available inside the script, and any variables created in the script are
    left in memory after the script finishes. This means that the user will need to
    remember the names of the variables that the script expects and ensure they exist
    before calling the script.


    To create a script that computes the value of two resistors in parallel:


