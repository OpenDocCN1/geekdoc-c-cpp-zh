    \ v。\n\n> 提示：购买计算器\n\n工业界的电气工程师有自己的办公室，并且通常使用 MATLAB 进行计算。但对于大学生来说，最重要的工具之一是便携式计算器。与大多数专业不同，电子电气工程（ECE）学生必须拥有能够处理复杂矩阵的计算器，以解决由正弦源引起的问题；TI-86\
    \ 及以下型号无法做到，包括 TI-84。不要被购买内置了许多特殊工程程序的昂贵仪器所误导；这些程序很少用。TI-89、TI-91 或更高型号，以及较新的\
    \ Nspire 系列都运行良好。Nspire 以文档为核心的特性是独特的；有些学生偏于使用它，但将其视为一种将他们与单纯求解方程隔离开的抽象。\n\n电气工程师编程\n\
    \n# 矩阵操作\n\n### 矩阵大小\n\n正如 `length()` 命令可以确定向量中有多少个元素一样，`size()` 命令返回矩阵中有多少行和列。例如，\n\
    \n```\nx = [4 3; 2 -4; 5 7] (即 x= [4 3; 2 -4; 5 7])\n```\n\n然后可以使用以下命令找到矩阵维度：\n\
    \n```\n[rows, cols] = size(x)\n```\n\n这会将变量 rows 设置为 3，cols 设置为 2。注意 `size()`\
    \ 如何同时设置两个变量。由于向量只是只有一行或一列的矩阵，`size()` 也作用于向量：\n\n```\nsize([10 20 30 40 50])\
    \ 返回 [1, 5]，且\nsize([10; 20; 30; 40; 50]) 返回 [5, 1]\n```\n\n### 转置\n\n转置矩阵会交换行和列。例如，使用撇号\
    \ `'` 转置矩阵，如左所示：\n\n```\n4 2 5\n3 -4 7\n```\n\n变为\n\n```\n4 3\n2 -4\n5 7\n```\n\
    \n### 矩阵数学\n\n矩阵运算包括加法、减法、乘法和除法。加法和减法作用于对应元素，例如：\n\n```\n[1 2; 3 4] + [5 6; 7\
    \ 8] = [6 8; 10 12]\n```\n\n```\n[1 2; 3 4] - [5 6; 7 8] = [-4 -4; -4 -4]\n```\n\
    \n乘法和除法作用于对应元素：\n\n```\n[1 2; 3 4] .* [5 6; 7 8] = [19 22; 43 50]\n```\n\n```\n\
    [1 2; 3 4] ./ [5 6; 7 8] = [0.2 0.3333; 0.4286 0.6667]\n```\n\n### 矩阵乘法\n\n矩阵乘法与元素级乘法不同。例如：\n\
    \n```\n[1 2; 3 4] * [5 6; 7 8] = [19 22; 43 50]\n```\n不，上面的例子是元素级乘法。真正的矩阵乘法是：\n\
    \n```\n[1 2; 3 4] * [5 6; 7 8] = [19 22; 43 50]\n```\n等等，让我重新计算：\n$1*5 + 2*7 =\
    \ 5 + 14 = 19$\n$1*6 + 2*8 = 6 + 16 = 22$\n$3*5 + 4*7 = 15 + 28 = 43$\n$3*6 +\
    \ 4*8 = 18 + 32 = 50$\n结果确实是 `[19 22; 43 50]`。\n\n矩阵除法也不同于元素的除法。例如：\n\n```\n[1\
    \ 2; 3 4] / [5 6; 7 8] = [0.0714 0.3333; 0.4286 0.625]\n```\n\n### 练习题\n\n使用矩阵\
