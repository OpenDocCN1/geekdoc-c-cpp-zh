    > 复习

    `+`、`-`、`*` 命令用于标量和向量之间。在两个向量之间，`+` 和 `-` 命令用于加或减两个向量对应的元素。你必须使用 `*` 和 `/` 来相乘或除以两个向量对应的元素。


    ## 选择线条颜色


    MATLAB 默认为绘图线条选择蓝色。若要选择不同的颜色，例如将上一个示例绘制为红色，请输入

    `plot(t, y, ''r'')`

    其中 ''r'' 代表红色。


    MATLAB 预定义了八种颜色，并配有单字母缩写。


    | 颜色 | 缩写 |

    |---|---|

    | 蓝色 | ''b'' |

    | 绿色 | ''g'' |

    | 红色 | ''r'' |

    | 青色 | ''c'' |

    | 品红 | ''m'' |

    | 黄色 | ''y'' |

    | 黑色 | ''k'' |

    | 白色 | ''w'' |


    你不需要记忆这些缩写；可以通过输入 `help plot` 来查找它们。


    > 深入探索

    如果你需要将 MATLAB 图形嵌入 Microsoft Word 中，请勿使用屏幕截屏工具，因为它们只能捕捉低质量的位图，打印时会显得模糊。相反，选择你想要复制的图形窗口；从菜单中选择
    编辑（Edit）->复制图形（Copy Figure）；然后将其粘贴到 Word 文档中。


    ## 选择线条样式


    MATLAB 默认使用实线绘制图形；然而，也可以指定其他线条样式，例如点线、虚线点划线：


    | 样式 | 缩写 |

    | --- | --- |

    | 实线 | ''-'' |

    | 点线 | '':'' |

    | 虚线 | ''--'' |

    | 点划线 | ''-.'' |


    ![](img/d1b4f05eead98e7b59e76deae28a6347_91_0.png)


    要创建一条点线，如右侧图表所示，请输入


    ```

    plot(t, y, '':'')

    ```


    此命令可以与线条颜色结合使用，如下例所示：


    ```

    plot(t, y, ''r:'')

    ```


    这将创建一条红色点线。注意这些命令是如何组合到一个单引号命令中的。


    ## 选择线条宽度和任意颜色


    指定预定义颜色和线条样式是非常常见的，以至于它们已经集成到 plot 命令本身中。不常用的选项，例如选择线条宽度或选择任意颜色，可以通过 plot 命令末尾的关键字访问，后跟一个数字或向量。


    ## 改变绘图线条宽度


    线条宽度默认设置为 1。若要使其加粗五倍，请使用此命令选择宽度 5：


    ```

    plot(t, y, ''linewidth'', 5)

    ```


    下面显示了线条宽度从 1 到 15 的图形示例：


    ![](img/d1b4f05eead98e7b59e76deae28a6347_92_0.png)


    同样，如果你需要 MATLAB 使用的八种预定义颜色以外的颜色，可以使用 ''color'' 关键字，后跟 [红, 绿, 蓝] 坐标中的颜色规范。这是一个三数字数字向量，每个数字在
    0 到 1 之间变化，定义了红色、蓝色和绿色的呈现方式。这种颜色规范系统在计算机图形中非常常见。例如，橙色混合了大量的红色，混合了中等量的绿色且没有蓝色，因此
    RGB 坐标 [1 0.5 0] 产生橙色色调，可以使用以下命令绘制：


    ```

    plot(t, y, ''color'', [1 0.5 0])

    ```


    ## 组合命令


    `plot()` 的命令必须分为两部分。第一部分是 x,y 数据，后面是单字符颜色和单字符或双字符线条样式。任何颜色和线条样式字符必须放在一起并包含在单引号内，例如使用
    ''r-'' 而不是 ''r'',''-''。以两部分形式给出的命令（如 ''linewidth'', 10）必须放在末尾。例如，要绘制下一页所示的红色点线，使用命令：


    ```

    plot(t, y, ''r:'',''linewidth'',10)

    ```


    ![](img/d1b4f05eead98e7b59e76deae28a6347_93_0.png)


    ## 练习题


