    \ 如何同时设置两个变量。由于向量只是只有一行或一列的矩阵，`size()` 也作用于向量：\n\n```\nsize([10 20 30 40 50])\
    \ 返回 [1, 5]，且\nsize([10; 20; 30; 40; 50]) 返回 [5, 1]\n```\n\n### 转置\n\n转置矩阵会交换行和列。例如，使用撇号\
