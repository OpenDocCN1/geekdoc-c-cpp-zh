    # TECH TIP: VOLTAGE, CURRENT, CHARGE, AND RESISTANCE


    We already presented an analogy between water flowing in a closed-loop set of
    pipes and electric current flowing through a set of wires: the amount of water
    in gallons flowing past a point over a given time interval is like the charge
    that flows in Coulombs past a point in a wire in a time interval. The amount of
    water flow, measured in gallons per minute, is the amount of charge flow, called
    current, which is measured in Coulombs per second, or more conveniently, in Amps.
    To complete the analogy, the pump that creates a pressure difference in the water
    to make the current flow is like a voltage source; the pressure difference between
    any two points is like a voltage difference; and the resistance in the piping
    system to the flow of water is like a resistor. In summary, these are shown with
    their schematic symbols in the figure on the following page.


    | Quantity | Abbreviation | Units | Water analogy |

    | --- | --- | --- | --- |

    | Charge | Q | Coulombs (C) | Volume of water, measured in gallons |

    | Current | I | Amps (A) | Flow of water, measured in gallons per second |

    | Voltage | V | Volts (V) | Pressure difference |

    | Resistance | R | Ohms (Omega) | Narrow pipe causing resistance to water flow
    |


    To create a circuit, we need the following components:


    | Component | Schematic symbol | Water analogy |

    | --- | --- | --- |

    | Wire | | Pipe |

    | Voltage source | | Pump creating a pressure difference |

    | Resistor | | Narrowed pipe resisting water flow |


    A simple electrical circuit and its water analogy are shown below. Try to visualize
    the electrical current flow through the circuit, as it is pressurized to flow
    by the voltage source, and loses that pressure as it squeezes through the resistor.


    ![](img/22_0.png) Pumped water system (left) and analogous electrical circuit
    (right). The pump creates a pressure difference to encourage water to flow through
    a restricted pipe, the voltage source (battery) creates a voltage difference,
    causing electrical current to flow through a resistor. The resistance in the pipe
    and circuit are both unavoidable and necessary to keep current from flowing.


