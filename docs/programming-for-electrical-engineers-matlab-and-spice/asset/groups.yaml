    # PRO TIP: IEEE CODE OF ETHICS


    To follow the IEEE Code of Ethics, electrical engineers agree to accept responsibility
    in making decisions consistent with the welfare of the public, and to disclose
    promptly factors that might endanger the public or the environment;


    +   1. accept responsibility in making decisions consistent with the welfare of
    the public, and to disclose promptly factors that might endanger the public or
