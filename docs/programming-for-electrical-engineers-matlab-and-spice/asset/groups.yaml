    - 2. 重复上述操作，使用绿色的点线，宽度比默认粗 10 倍。


    ## 轴标签和标题


    大多数图形都需要一个标题和每个坐标轴的标签。这可以在图形创建后使用 `title`、`xlabel` 和 `ylabel` 命令完成，如下例所示，该例绘制了衰减电压指数函数的前
    5 秒：


    ```

    t = linspace(0,5,100);

    y = exp(-t);

    plot(t,y)

    title(''Decaying Exponential'')

    xlabel(''time (s)'')

    ylabel(''amplitude (V)'')

    ```


    注意 MATLAB 中的字符串包含在单引号中，与大多数编程语言使用的双引号不同。查看下方生成的图形：


