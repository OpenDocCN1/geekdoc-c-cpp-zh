    ## 进阶提示：使用网络（Nets）


    放大器原理图功能完备，但由于 5V 电源为放大器供电，看起来很杂乱。如果我们定义一个符号 +5V 代表 5V，另一个符号 -5V 代表 -5V，那么我们就可以显著地简化原理图，同时使意图更加清晰。这些符号就是网络的示例，如下图所示：


    ![](img/d1b4f05eead98e7b59e76deae28a6347_261_0.png)


    右侧的电路在功能上与之前分析的左侧电路相同。两个显然没有连接的电压源定义了两个名为 +5V 和 5V 的网络，用于为右侧的放大器供电。它还使用了多个地网络来进一步简化原理图。实践工程师更倾向于这种而非左侧的原理图。


    LTspice 允许使用工具定义网络。作为一个使用其简化之前原理图的示例，首先创建以下原理图捕获：


    ![](img/d1b4f05eead98e7b59e76deae28a6347_261_1.png)


    然后点击笔工具，创建类型为“none”的网络名称 +5V，并如下所示放置。同样，创建一个 -5V 网络名称并如下所示放置：


    ![](img/d1b4f05eead98e7b59e76deae28a6347_262_0.png)


    如下所示将它们连接起来。现在，每当使用 +5V 网络符号时，它在功能上等同于连接到一个 +5V 电压源，该电源的负极连接到地。在这个单放大器示例中，这可能只是稍微整洁一点，但在使用多个放大器的复杂电路中，它会变得简洁得多。


    ![](img/d1b4f05eead98e7b59e76deae28a6347_262_1.png)


    ## 专家提示：终身学习


    1962年，经济学家弗里茨·马赫卢普（Fritz Machlup）提出了“知识的半衰期”一词，用以量化知识过时的速度。对于电气工程师来说，前景并不乐观；大约一个世纪前，这个数字估计35年；半世纪年前，这个数字下降到10年；而在2002年，美国工程科学院院长表示，这个数字在2.5到7年之间，取决于子领域。整个职业领域都在变化；一个世代前，人们可以期望在一家公司的一个定义良好的特定领域内开辟出一片天地——例如洛克希德工厂的导弹制导系统——并在那里工作一辈生。现在已不再如此。


    电气专业的学生可以做什么来保护得之不易的技术技能呢？


    - 1. 接受本科阶段学到的技能是通用的且被设计为可迁移的。MATLAB 和 Spice 已经存在很久（分别自1984年和1973年），但在职业生涯中，两者都可能被新技术取代。然而，通过学习它们而获得的底层编程和电路分析技能不太可能被同样取代。在学习了第一种之后，学习第二种编程语言或电路分析系统要容易得多。

    - 2. 在整个职业生涯持续学习和重新培训。利用 IEEE 会员身份通过分会会议跟上软硬件的发展，并阅读如 IEEE 会员附带的每月一次 IEEE Spectrum
    等刊物。许多公司提供内部培训计划，并报销从周末研讨会到全日大学学位的教育费用。大多数雇主都会报销维持专业工程师（PE）执照所需的继续教育培训费用。电气工程在近期引入的大规模开放在线课程（MOOCs）中也占很大；一些优秀的课程通过
    http://courses.edx.org 和 IEEE 提供的。


    最终，正是那种驱动人们成为工程师的学习热爱，让他们在整个职业生涯中与时俱进。尽管这个职业的变化比以前任何时候都快，但工程文化同样迅速地适应了现实：教育不是一个大学学位，而是一个终身过程。


    ## 命令回顾


    ### 原理图捕获命令


    - File → New Schematic：开始一个新的原理图。

    - Place a component：放置元件

    - Voltage：放置电压源（在选择后）

    - Place a resistor：放置电阻

    - Place a capacitor：放置电容

    - Place an inductor：放置电感

    - Place a wire：放置导线

    - Place ground：放置地

    - Zoom：放大，缩小


    ### 原理图编辑命令


    - Delete tool：删除工具

    - Move tool：移动工具

    - Undo tool：撤销工具


    ### 分析命令


    - Simulation：选择仿真类型

    - DC：直流仿真

    - Transient：瞬态仿真

    - AC Sweep：交流频率扫描仿真


    ### 查看结果


    - DC：直流显示

    - Transient：示波器显示

    - AC Sweep：Bode 图


    ## 习


    - 1. 使用 LTspice 找到以下电路中电阻两端的电压（提示：不要忘记地！）![](img/d1b4f05eead98e7b59e76deae28a6347_266_0.png)

    - 2. 上述电路由电池供电。该电路能持续多久？

    - 3. 找到所示 10kΩ 电阻的电流。某些版本的 LTspice 会显示电流的正负；符号仅表示方向。![](img/d1b4f05eead98e7b59e76deae28a6347_266_1.png)

    - 4. 方波的占空比是周期内“接通”时间占总时间的比例。例如，如果“接通”时间为1秒，“关闭”时间为3秒，那么总周期为4秒，占空比为1/4=25%，频率为1/4
    Hz。找到构建提示中提到的555 电路所需的电阻，该电路在1 kHz、占空比33.3%下振荡，然后使用 LTspice 进行分析，并打印4ms的 LED 电流波形。使用一个1
    µF 电容。

    - 5. 重复上述步骤，针对在100 Hz、占空比10%下振荡的电路。使用一个1 µF 电容。打印 LTspice 原理图和前50 ms 的 LED 电流图。

    - 6. 使用100 kr 设计一个截止频率为 60 Hz 的二阶巴特沃斯低通滤波器。使用交流频率扫描进行分析。

    - 7. 计算所示高通滤波器在输入频率从1 Hz 变到 10kHz 时的 Bode 图。使用 Windows 上的截图工具或 Command+Shift+4
    打印 LTspice 原理图和仅输出幅度（不含相位）的图。使用第255页讨论的网络方法来避免导线交叉。提示：如果 LTspice 返回“未知子电路”错误，请检查使用的是“Universal
    Opamp2” 而非“opamp2”。

    - 8. 你是一家设计天然气发电厂公司的电气工程师。你团队中的一名新入成员感到不满，因为公司没有花更多时间研究可再生能源（如风能和太阳能）发电组的盈利能力。这个问题已经进行过了一项长期且昂贵的


    '
