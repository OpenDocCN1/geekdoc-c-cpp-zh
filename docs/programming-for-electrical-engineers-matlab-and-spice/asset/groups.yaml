    ## 使用 get() 获取可设置属性的关键字名称


    为了处理图形，有必要理解 MATLAB 如何存储图形信息。关于图表的所有信息，从数据、线型到坐标轴刻度标签，都存储在三个元素之一：图形窗口（figure window）、轴（axis）或线图（line
    plot）。这些可以通过激活/取消模式选择的相同三个元素。要查看每个元素的选项，请使用 get()。


    ## 图形窗口


    get(gcf) 列出图形窗口属性。大约有 60 个属性，包括：


    - ''position'', [x,y,width,height] 设置图形窗口相对于桌面的尺寸和位置。

    - ''color'', [r,g,b] 以[红、绿、蓝]坐标设置图形窗口的颜色和背景。


    ## 轴


    get(gca) 列出所有轴属性（多于 120 个），包括：


    - ''position'', [x,y,width,height] 设置轴窗口相对于图形窗口的尺寸和位置

    - ''xtick'', 1:10 设置沿轴刻度标记的数值位置。

    - ''fontSize'', 12 设置轴标签文本的字体大小（磅）。

    - ''visible'', ''off'' 使轴不可见，但保留它们显示的数据。


    ## 数据


    h = get(gca, ''children''); get(h) 列出绘图数据的属性。这些属性的数量取决于绘图类型，但对于数据折线图有 36 个，包括：


    - ''markerfacecolor'', [r,g,b] 设置数据标记的填充颜色。

    - ''edgecolor'', [r,g,b] 设置外边框的颜色。

    - ''linecolor'', [r,g,b] 设置数据标记的线条填充颜色。


    ![](img/d1b4f05eead98e7b59e76deae28a6347_119_0.png)


    ## 使用 set() 获取可设置属性的关键字名称


    要设置属性，请使用 set() 命令代替 get() 命令，并对你想要设置的属性使用双部分关键字/值对，例如：


    | 关键字 | 值 |

    |---|---|

    set(gcf, ''position'', [50,50,500,100]) 使图形窗口变宽（500 像素）变短（100 像素），并将其放置在桌面的左下角
    |


    | 关键字 | 值 |

    |---|---|

    set(gca, ''xtick'', [0 1]) 将水平刻度位置更改为 0 和 1 |


    | 关键字 | 值 |

    |---|---|


    ```

    h = get(gca, ''children'');

    ```


    set(h, ''markerfacecolor'', [1,0,1]) 将标记填充为粉色


    ## 练习题


    - 14. 使用数据 x = [0.5 1.5 1], y = [0.5 0.5 1.4] 创建一个散点图，使用大小为 20 的黑色圆。提示：在创建数据后，你可以用单个命令绘制它。使用交互式编辑器将其填充为绿色。®

    - 15. 创建一个脚本文件，使用句柄图形 set 命令实现与上述相同的功能。提示：更改标记填充颜色是数据的一个属性。©


    ## 文本注释


    在图表的任意位置创建文本，请使用以下命令：


    ```

    text(x,y,''text string'')

    ```


    下面的示例说明了这种技术并展示了结果图：


    ```

    t = linspace(0, 5, 1000);

    y = t/2 .* cos(t);

    plot(t,y)

    text(0.5,0.5,''Local maxima'')

    text(3,-1.8,''Global minima'')

    ```


    ![](img/d1b4f05eead98e7b59e76deae28a6347_120_0.png)


    ## 技术贴士：ECE 中的希腊字母


    电气工程师通常使用希腊字母表中 24 个字母中的 19 个，能够识别并读出它们的名称是非常重要的。下表将每个符号与其在电子工程（ECE）中的应用配对：


    | | |

    |---|---|

    | α | alpha | 指数衰减率 |

    | β | beta | 电晶管增益 |

    | Γ | Gamma | 传输 |

    | Δ | Delta | 变化 |

    | δ | delta | 脉冲函数 |

    | η | eta | 效率比 |

    | θ | theta | 角度 |

    | λ | lambda | 指数衰减率 |

    | μ | mu (micro) | 10⁻ |

    | ξ | xi | 阻尼比 |

    | Π | Pi | 积 |

    | π | pi | 3.14159 |

    | Σ | Sigma | 求和 |

    | ∂ | sigma | 导电率，复数的实部 |

    | τ | tau | 时间常数 |

    | Φ | Phi | 磁通 |

    | φ | phi | 角度（与 θ 类似） |

    | Ω | Omega (ohm) | 电阻单位

    | ω | omega | 角频率 |


    ## 高级文本格式


    电气工程图表通常需要指数、下标或希腊字母，MATLAB 提供了通过 title(), ylabel() 和 text() 显示它们的方法。


    ### 希腊字母


    如之前的贴士所述，希腊字母在电气工程中非常常见，可以使用反斜杠后跟希腊字母名称来嵌入。以下命令将横轴标记为“Resistance in Ω”：


    ```

    xlabel(''Resistance in \Omega'')

    ```


    | | |

    |---|---|

    | 0.5 | 1 |

    | 0 | Resistance in \Omega |


    ### 上标和下标


    如果上标或下标只是单个字符，那么像 t²（幂）和 V1（下标）这样的标在 MATLAB 文本中非常易于创建：分别使用 `^` 或 `_`。以下命令创建标题
    V1(t)=f(t²） ：


    ```

    title(''V_1(t) = f(t²)'')

    ```


    ![](img/d1b4f05eead98e7b59e76deae28a6347_122_0.png)


    若要在上标或下标中组合多个字符，请用花括号将其括起来（即 {}）。以下命令创建文本 f(t) = e^{ω t}（注意它也包含了希腊字母）：


    ```

    text(0.25,0.5, ''e^{\omega t}'')

    ```


    ![](img/d1b4f05eead98e7b59e76deae28a6347_124_0.png)


    - 16. 绘制 v₁(t) = 2e^{-t},0 ≤ t ≤ 5；将纵轴标记为“v，”


    ## 三维图


    到目前为止的二维线条、散点图和柱状图是电气工程师最常用的类型，但三维图可以显示一个变量如何随两个独立变量变化。例如，本章之前讨论的 sin 函数作为两个变量的函数存在，用于图像处理。该函数由方程描述：


    z(x,y) = \frac{\sin(\sqrt{x^2+y^2})}{\sqrt{x^2+y^2}}


    要在 -15 ≤ x ≤ 15 和 -15 ≤ y ≤ 15 之间绘制此图，使用 meshgrid() 创建 x 和 y 矩阵，它可以被视为 linspace()
    的三维对应物：


    ```

    [x, y] = meshgrid(-15:15,-15:15);

    ```


    然后定义绘图函数：


    ```

    z = sin(sqrt(x.^2+y.^2))./sqrt(x.^2+y.^2);

    ```


    最后，使用 surf() 创建三维图：


    ![](img/d1b4f05eead98e7b59e76deae28a6347_124_0.png)


    为了获得更平滑的图表，添加 shading() 命令，这将关闭黑色边缘并使色彩过渡更自然：


    ```

    shading(''interp'')

    ```


    ![](img/d1b4f05eead98e7b59e76deae28a6347_124_1.png)


    实表面由 surf() 命令创建。要创建线框图，请用 mesh() 代替 surf()，所示：


    ```

    [x, y] = meshgrid(-15:15,-15:15);

    z = sin(sqrt(x.^2+y.^2))./sqrt(x.^2+y.^2);

    mesh(x,y,z)

    ```


    ![](img/d1b4f05eead98e7b59e76deae28a6347_125_0.png)


    ## 练习题


    - 17. 使用跨越 x 和 y 从 -10 到 10 的网格创建以下函数的曲面图。Ⓡ


    ```

    z (x, y) = \sin\left(\frac{x}{3}\right) \cos\left(\frac{y}{3}\right)

    ```


    '
