    \n类似于\n\n```\nv = [-2 -4 -6 -8 -10], 然后\nv(2:4) 返回\n[-4 -6 -8],\n```\n\n我们可以使用冒号\
    \ `:` 运算符访问矩阵的部分。\n\n使用上一节中的示例矩阵 m，其中 m=\n\n```\nm(1:2, 1:2)\n[-5 7\n 8 0]\n```\n\
    \n返回该方阵。\n\n冒号运算符比这强大得多。可以使用简写形式 m(:,) 来指定整行或整列。例如，要将 x 赋值为 m 的第二行，输入：\n\n```\n\
    x = m(2, :);\n[8 0 9]\n```\n\n现在要将 m 的第一个元素设置为（注意矩阵的单列是一个列向量），输入：\n\n```\nm(:,1)\
    \ = [1;2];\n[1 7 2.4\n2 0 9]\n```\n\n现在 m=\n\n### 删除矩阵中的元素\n\n类似于向量操作，通过将赋值为空矩阵\
    \ `[]` 来删除矩阵块。注意，你可以删除矩阵的任意数量的整行或整列，但与向量不同，删除单个值是没有意义的；因为矩阵将不再是方阵或矩阵。例如，\n\n```\n\
    m(:,4) = []      删除第四列\nm(2:3,:) = []     删除第 2 行和第 3 行\nm(:,3:end) = []   删除前两列以外的所有列\n\
    m(1:2:end,:) = [] 删除所有奇数行\n```\n\n# 练习题\n\n这些题目使用矩阵 m。你不知道 m 的元素是什么，但你知道它是一个 2x2\
