    \ executing, as is often the case, use the former method. Only if the resulting\
    \ vector length is not known in advance should the latter method be used.\n\n\
    # Good practice: preallocate memory\n\n```matlab\nfunction v = GoodProgram(n)\n\
    % return v of length n and preallocate v\nv = zeros(n);\nfor i = 1 : n\n  v(n)\
