    # KEYBOARD SHORTCUTS


    Very often you will need to repeat a sequence of keystrokes exactly almost exactly.
    This has probably happened to you already, and you will find these keyboard shortcuts
    very convenient.


    To recall previous commands, press the arrow key ↑. Keep pressing to go back in
    the command history. Once the command is visible, you can edit it or run it again
    by pressing "Enter".


    Another way to rerun a command is to look in the command history window, circled
    in the screen below. While this is easier to remember than using the arrow key,
    the arrow key is much faster.


    ![](img/d1b4f05eead98e7b59e76deae28a6347_35_0.png)


    # PRO TIP: CAREERS IN ELECTRICAL ENGINEERING


    Careers in electrical engineering can be examined by sector, title, or by discipline.
    “Sector” refers to who hires the engineer: a company, the government, or a university.
    “Title” refers to the job description, which is a function of the sector. “Subdiscipline”
    refers to the specific electrical engineering field, such as microelectronics,
    power, or telecommunication. There are three primary sectors that hire electrical
    engineers; these are private industry, government, and academia (in order of the
    number of annual hires), and each has unique benefits. Salaries tend to be highest
    in private industry, while government positions generally offer the greatest job
    security, and engineers working in academic institutions enjoy significant independence
    in choosing research topics.


    Each sector offers different types of job titles. Private industry has a great
    variety, including:


    - Research and development: Develop prototypes of devices and technologies;

    - Production: Optimize manufacturing processes to reduce cost;

    - Sales: Work as part of a team to sell a technological solution to a client;

    - Project Management: Manage teams of engineers and other specialists as they
    solve problems too broad in scope for a single engineer; and

    - Consulting: Help other companies solve technological problems, often involving
    production and project management.


    ![](img/d1b4f05eead98e7b59e76deae28a6347_36_0.png)


    Programming for Electrical Engineers


    Government jobs often involve:


    - Project Management: Oversee private industries as they perform government contract
    work; and

    - Testing: Determine if products meet safety and health requirements, which can
    be difficult to ascertain when the technology under review is novel.


    Academic positions typically include:


    - Research and Development: Often with a longer time horizon to implementation
    with R&D positions in private industries; and

    - Teaching: Both undergraduate and graduate students.


    Any employment sector can be involved with any of the main subdisciplines of Electrical
    Engineering. Major EE subdisciplines include:


    - Microelectronics: Fabrication of extremely small integrated circuits;

    - Power: Generation and transmission of large amounts of electrical power over
    long distances;

    - Controls: Use programmable logic or microcontrollers to precisely control motion
    or heat;

    - Instrumentation: Design systems that measure electrical quantities or pressure,
    flow, and temperature;

    - Telecommunications: Build systems that transmit data by wire, optical fiber,
    or radio wave; and

    - Computer Engineering: Design of computers and associated hardware.


    # COMMAND REVIEW


    # Basic Math Operations


    - - * / ^ means multiply. No implied multiplication

    - sqrt() square root

    - log() natural log

    - log10() log base 10

    - exp() natural exponent


    # Predefined Constants and Notation


    - i, j asin(-1), can be used, for instance, as 3+j*7;

    - pi π


    # Formatting Numbers


    - 68e-12 type of scientific notation, here representing 68×10⁻¹²

    - format long shows all significant digits (about 16)

    - format short shows about four significant digits of answer


    # Saving and Loading Data


    - save(''x.txt'', ''x'', ''-ascii'') saves variable x in an ascii-readable file
    x.txt

    - save(''x.mat'', ''x'') saves variable x in a compressed file called x.mat

    - load(''x.txt'') loads the variable in x.txt back into variable


    # Trigonometric Functions


    - cos(), sin(), tan() cosine, sine, and tangent functions given an argument in
    radians

    - acos(), asin(), atan() inverse functions of the above, returning radians

    - cosd(), sind(), tand() cosine, sine, and tangent functions given degrees

    - acos(), asind(), atand() inverse functions of the above, returning degrees


    # Vector Functions


    - [2 4 -6] creates a vector with components 2, 4, and -6

    - 12:3:24 shorthand for [12 15 18 24]. The increment number may be negative; 10:-1:0
    counts down from 10 to 0.

    - rand(1,17) a vector of 17 random numbers, each independently


    # Plots


    - plot(x,y) plots the set of lines whose horizontal positions are in x and whose
    vertical positions are in y


    # Keyboard Shortcuts


    - ↑ (up arrow) recall last command

    - ↑ recall second to last command, etc.


    # LAB PROBLEMS


    Practice Problems that were designed to check general comprehension. For each
    question record the MATLAB command if there is a to the problem, and the MATLAB
    result if there is b to the problem. Example of a question with both:


    Question: Use MATLAB to evaluate $4 + \sqrt{5}$

    Answer: Command: 4+(5^(1/2))

    Result: 5.3077


    1. Computers use sets of binary digits, bits, to represent. A bit can be 0 or
    1, so a single bit can store two states. Two bits can store states, namely 00,
    01, 10, or 11. Many microprocessor store information in sets of 8 bits, called
    a byte. How many unique states be represented in a byte? Hint: it is more than
    16. Most modern desktop computers store information in sets of 64 bits, called
    a 64-bit word. How many unique states can represent?


    2. A common circuit analyzed in future courses is the voltage divider, which is
    associated with the equation: $V_1 = \frac{V_u R_2}{R_1 + R_2}$

    a. Use MATLAB to define $V_u, R_1$, and $R_2$ equal to 12, 68 $\Omega$, and 12
    $\Omega$, respectively. Calculate $V_1$. Hint: Do not use dimensions such as Volts
    and $\Omega$ in MATLAB, but remember to write them in your result.

    b. Repeat the above calculation with $R_1 = 13 \Omega$. Notice how defining variables
    can make easier.


    3. Modern synthesizer design leans heavily on signal processing theory. The noted
    A4 has a frequency of 440 Hz (cycles per second). Each "semitone" above it is
    $\sqrt{2}$ times higher in frequency than the note before. For example, one semitone
    higher than A4 has a frequency of $440 \sqrt{2}$ Hz, and two semitones higher
    has frequency of $440 (\sqrt{2})^2 = 493.9 Hz. Use MATLAB to calculate the frequency
    of the note 7 semitones higher than A4 (musicians would call note E5).


    4. $\sqrt{3} + \sqrt{4}$ Hint: read the shaded "Recall" box on page 17.


    5. Use MATLAB to determine what famous irrational number, used frequently in signal
    processing, this continued fraction is approximating: $3 + \frac{1}{7 +\frac{1}{16}}$


    6. One way to approximate the irrational number e frequently encountered in control
    theory is by the following equation: $\lim_{n \to \infty} (1 + \frac{1}{n})^n$

    a) Using MATLAB''s vector functions, evaluate this equation for n = 100, 1000,
