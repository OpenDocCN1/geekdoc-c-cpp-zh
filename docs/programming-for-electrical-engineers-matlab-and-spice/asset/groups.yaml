    # SOLVING SIMULTANEOUS EQUATIONS USING MATRICES


    For the various $V_1$, $V_2$, and $V_3$ in the following set of equations:


    ```

    $V_1 + 2V_2 + V_3 = 5$

    $3V_1 - V_2 + 2V_3 = 2$

    $-V_1 + V_2 - 2V_3 = -4$

    ```


    To do this create an **A** matrix with the coefficients of the unknown voltages
    and a **b** column vector with the values to the right of the equals sign, as
    follows:


    ```

    A = [1 2 1; -1 2; -1 2]

    b = [5; 2; -4]

    ```


    The solution is (note the backwards division sign):


    ```

    V = A\b

    ```


    When using nodal and mesh methods to analyze the response of circuits containing
    **capacitors** and **inductors**, you will solve sets of complex matrices. There
    is no difference as far as MATLAB is concerned; the **A** matrix will have complex
    values such as for this example solving for complex currents:


    ```

    A = [1j 2-j; -3+3j]

    b = [j; 2-j]

    I = A\b

    ```


    On a vintage 2012 computer, MATLAB can solve a set of 100 equations in under 1
    ms—less than time to depress the Enter key.


