    但你如何指定从第三个到最后一个元素呢？你可以使用 `length(v)` 找到最后一个元素的值，并用此构建命令：


    ```

    v(3:length(v))

    ```


    MATLAB 为此操作提供了一个快捷方式：`end` 运算符，它表示向量的最后一个值。只需输入：


    ```

    v(3:end)

    ```


    同样，可以使用以下命令提取或设置最后五个元素：


    ```

    x = v(end-4:end) 提取提取，或使用 v([1 2 3 4]) 进行设置。

    ```


    ## 移除向量中的元素


    在向量中“移除一个元素”是什么意思？我们已经知道如何将其设置为 0；例如，将向量 `v = [1 2 3]` 中的第一个元素设置为 0，可以使用以下命令：


    ```

    v(1) = 0;

    ```


    完全移除该值意味着缩短向量的长度，这通过将该值赋值为 `[]`（空向量）来实现。在上面的示例中，输入


    ```

    v(1) = [] 将向量 v 从 [1 2 3] 变为 [2]。

    ```


    现在 `length(v)` 返回 2。


    ## 从其他向量构建向量


    向量可以其他向量和标量组合。如果 `x = [1 2 3]` 且 `y = [6 7 8]`，那么输入


    ```

    z = [x 7.5 y]

    ```


    将创建一个向量 z，其组件为 [1 2 3 7 5 6 8]。


    ## 在向量中插入元素


    要在向量 `v = [1 2 3]` 的开头插入 5，请输入命令：


    ```

    v = [ 5 v ]

    ```


    你会发现向量 v 现在持有 [5 1 2 3]。


    要在向量 `v = [1 2 3]` 的末尾插入 7，请输入命令：


    ```

    v = [ 7 ]

    ```


    向量 v 现在持有 [1 2 3 7]。


    要在向量 `v = [1 2 3]` 的中间插入 5，请输入命令：


    ```

    v = v(1:2) 5 v(3:4)

    ```


    虽然这个命令看起来语法很复杂，但它是遵循前面的步骤的。`v(1:2)` 返回 v 的前两个元素，`v(3:4)` 返回 v 的最后元素，加上插入的值 5，它们都被组合成一个新的向量，并赋值给
    v。如果在其他计算中需要原始向量 v，也可以将其赋值给一个名为 x 的向量。


    ## 练习题


    - 给定 `x=20:30`，编写 MATLAB 命令以：

    - 8. 找出向量 x 包含多少个数字。

    - 9. 显示 x 的内容。

    - 10. 获取 x 向量的第二个值。

    - 11. 将向量 y 设置为等于 x 的第二到第五个元素。

    - 12. 设置向量 y = x，但在向量 x 的开头和末尾各插入一个 1。即 `y = [1 20 21 22 ... 29 30 1]`，但要使用 x
    向量来创建。


    ## 专家提示：购买数字万用表 (DMM)


    数字万用表是电气工程师练习中的重要工具，也是你将频繁使用的工具。与相对昂贵的示波器不同，一个良好的 DMM 价格便宜，而且可以使用很长时间。如果你决定购买自己的
    DMM，请寻找以下功能（除了所有 DMM 都应该具备的电阻、交流/直流电压和电流测量）：


    - 蜂鸣连续性测试（探针连接时发出嗡嗡声，这样你可以在观察工作时检查短路和开路——对调试非常有帮助！）

    - 二极测试

    - 电容测量

    - 频率测量（可选）


    其他功能更贵，而且在你刚开始时可能不太需要它们。这些功能包括


    - 真值 RMS 测量 (True RMS measurement)

    - NIST 可追溯校准

    - 通过/通过测试 (Go/no-go testing)

    - 数字条形显示 (Bargraph displays)


    ![](img/d1b4f05eead98e7b59e76deae28a6347_57_0.png)


    像 Fluke 这样的品牌仪器通常非常坚固且准确，但价格更高。作者使用的一个品牌（所示）大约有 5 年历史了。现在具有类似功能的仪器价格比一台高端学生工程计算器还便宜。


    ## 复数


    虽然数学家使用 $i$ 来表示 $\sqrt{-1}$，但电气工程师使用 $j$，因为它被留给电流（源自法语中强度的词）。MATLAB 同时接受 $i$ 和
    $j$ 变量来表示虚数。本文将遵循电子工程（EE）使用 $j$ 的习惯。


    像 $4+3j$ 这样的复数由实部和虚部组成，通常在复平面上绘制，如下所示：


    ![](img/d1b4f05eead98e7b59e76deae28a6347_58_0.png)


    复数有常用的表示方法：直角坐标、极坐标和复指数。


    > 深度学习

    > 由于正负正还是正，负负也还是正，因此无法通过两个实数相乘来得到负数。因此我们必须定义 $\sqrt{-1}$ 为一个非实数；我们称之为 j。

