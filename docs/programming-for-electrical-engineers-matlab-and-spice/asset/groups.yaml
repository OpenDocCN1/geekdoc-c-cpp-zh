    signal changes and when the gate responds, called propagation delay $t_p$. The
    following propagation delays are tested for the common 74LS04 chip, a NOT gate.


    | $t_p$ | 2.5ns | 2.75ns | 3ns | 3.25ns | 3.5ns |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | # of chips | 2 | 12 | 27 | 16 | 3 |


    Create a bar plot displaying the above values. Label the axes and give it a title.
    Rather than converting very small numbers like 2.5 ns to 0.0000000025, leave it
    as 2.5 and label the appropriate axis as "time (ns)". Ⓡ


