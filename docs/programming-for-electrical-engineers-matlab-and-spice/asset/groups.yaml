    ```

    function [count, result] = problem12(x)

    and as an example of its use

    [count, result] = problem12([-5 20 6 11])

    ```


    causes count = 2 and result = [-5 10 6 10].'
  - "[PAGE 162]\n\n# CONDITIONAL BRANCHING: if-end\n\nThus far, every MATLAB program\
    \ we have discussed executed every line of code in when it run. if-end statement\
    \ blocks are an exception; the code between the if-end statement only runs if\
    \ a logical statement is true, e.g.,\n\n```\nif (logical expression that evaluates\
    \ to true or false)\n    % Statements here execute if the logical\n    % expression\
    \ is true.\n    % All statements until the closing end are\n    % conditionally\
    \ run\nend\n```\n\nFor example, the following statements duplicate the functionality\
    \ of abs(x), which takes the absolute value of x:\n\n```\nif (x < 0) % if x is\
    \ negative\n    x = -x;\n    % continue program\n```\n\nNotice that if statement\
    \ needs to be paired with a matching end statement. Also notice that the statements\
    \ between the if and end pairs are indented. Since MATLAB ignores spaces, these\
    \ indentations are optional, but they make the code easier to read.\n\n![](img/d1b4f05eead98e7b59e76deae28a6347_162_0.png)"
