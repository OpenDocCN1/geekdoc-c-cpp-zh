    # 练习题


    - 1. 1. 使用上述 Bode 样式绘制以下滤波器响应：$y = \frac{1}{10000 + f^2}$。使用 `logspace` 在 `f`
    向量中生成从 1Hz 到 10,000Hz 的对数分布点。换句话说，技术提示（Tech Tip）已经给出了 f 和 y 向量。现在，请使用 `logspace`
    和给定的方程计算它们。

    - * 如果 `logspace` 返回无穷值，请重新阅读[第 2 章]中的相关章节。

    - * 回想 $*$ 和 $^$ 在处理向量和矩阵参数时的工作方式与标量不同。你如何修改它们以便处理两个向量之间的对应元素？

    - * 虽然题目要求你创建自己的水平和垂直数据向量，但 dB 计算和对数刻度轴绘图程序与示例相同（实际上，对于任何 Bode 图都是如此）。


    # 技术提示：低通滤波器


    低通滤波器是一种常见的电路，它可以滤除高频并允许低频通过。最简单的类型可以由单个电阻和一个电容组成，如左图所示。电路分析课程可以教你如何推导出右图所示的方程，它完全描述了电路的行为。该方程是电路的传输函数
    $H(f)$，如第 2 章所述，它的结果是一个复数。要查看电路对频率为 $f$ 的输入信号的作用，请在该频率处计算 $H(f)$ 并取所得复数的模。如果 $|H(f)|
    = 1$，则频率无变化地通过；如果 $|H(f)| > 1$，则放大信号；如果 $|H(f)| < 1$，则衰减信号。


    ![](img/d1b4f05eead98e7b59e76deae28a6347_100_0.png)


    $H(f)$ 是复数；通常随频率 $f$ 绘制图的是其模 $|H(f)|$，且通常以 Bode 图的形式呈现，即在对数刻度的水平轴上绘制 dB 单位的模 $|H(f)|$。


    例如，使用以下命令绘制 $R=1\text{ k}\Omega$ 和 $C=1.6\mu F$ 电路在 $1\le f\le10\text{ kHz}$ 的响应：


    ```

    R = 1000;

    C = 1.6e-6;

    f = logspace(0,4,100); % 定义元件值

    创建一个从 1 到 10,000 Hz 的对数分布频率向量

    ```


    ```

    H = 1./(1+j2*pi*f*R*C); % 计算 H 向量

    dB = 20*log10(abs(H)); % 计算 dB 单位的模

    ```


    ```

    semilogx(f,dB)

    title(''Lowpass filter'')

    xlabel(''Frequency (Hz)'')

    ylabel(''Amplitude (dB)'')

    grid(''on'')

    ```


    ![](img/d1b4f05eead98e7b59e76deae28a6347_101_0.png)


    上方显示了一个低通滤波器响应。它从约 100 Hz 以上的频率开始截断。


    # 练习题


    - 6. 使用 $R=5\text{k}\Omega$ 和 $C=3.2\mu F$ 的值重做之前的技术提示示例。绘制从 0.1Hz 到 10kHz 对数跨度为
    30 个频率的 $|H(f)|$（单位为 dB）。


    # 多线条折线图


    正如示波器通常有两个输入数据通道一样，工程师经常在同一组坐标轴上绘制多一组数据。两组数据 $\{t1, y1\}$ 和 $\{t2, y2\}$ 可以使用以下命令绘制在同一坐标轴上：


    ```

    plot(t1,y1,y2,y2)

    ```


    以下命令在 $0 \le t \le6$ 范围内同一坐标轴上绘制 $y_1=\sin(t)$ 和 $y_2=\cos(t)$：


    ```

    t = linspace(0,6,1000);

    y1 = sin(t);

    y2 = cos(t);

    plot(t,y1,y2)

    ```


    ![](img/d1b4f05eead98e7b59e76deae28a6347_102_0.png)


    注意，之前介绍的所有选项均按预期工作。以下命令将第一条线变为绿色，第二条线变为黑色虚线，且每条线的宽度都是 MATLAB默认宽度的两倍（见对应的图）：


    ```

    plot(t,y1,''g'',t,y2,''k--'',''linewidth'',2)

    ```


    ![](img/d1b4f05eead98e7b59e76deae28a6347_103_0.png)


    一组坐标轴上绘制的线条数量没有限制；例如，通过更多计算出的 $y_3, y_4$ 等值，可以使用如下命令：


    ```

    plot(t1,y1,t2,y2,t3,y4...)

    ```


    ![](img/d1b4f05eead98e7b59e76deae28a6347_103_1.png)


    # 添加图例


    图例允许观众区分在同一组坐标轴上绘制的不同线条。为两条线添加图例，使用以下语法：


    ```

    legend(''name1'', ''name2'')

    ```


    为 $\sin/\cos$ 图添加图例，输入：


    ```

    legend(''sin(t)'', ''cos(t)'')

    ```


    可以用鼠标移动图例以避免覆盖数据。


    ![](img/d1b4f05eead98e7b59e76deae28a6347_104_0.png)


    图例在黑白打印时特别有用。在这种情况下，使用实线和虚线区分图表。


