    \n# 显示 (DIS)\n\n之前引入了 `fprintf()` 作为在屏幕上打印文本和数字的函数，使用包括制表符和换行符在内的格式化字符。一个更简单的命令可以打印字符串文本或包含数字或向量的变量，但不能与数字结合打印，即\
