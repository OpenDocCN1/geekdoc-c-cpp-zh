    In electrical engineering classes, we tend to keep MATLAB in short format and
    typically report 3 significant digits in our answers. This is because components
    we use—resistors, capacitors, and inductors—rarely have more than 3 significant
    digits of accuracy in their values, and the instruments we use to measure voltage
    and current in undergraduate laboratories are usually limited to 3 significant
    digits as well.


