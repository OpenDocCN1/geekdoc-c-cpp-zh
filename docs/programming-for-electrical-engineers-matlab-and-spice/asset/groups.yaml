    # Choosing Line Width and Arbitrary Colors


    Specifying predefined colors and line styles is so common that they are integrated
    into the plot command itself. Less-common-options, such as choosing the width
    of the line or choosing an arbitrary color, are accessed through the keywords
    at the end of the plot command, followed by a number or vector.


    # Varying Plot Line Width


