    5. 编写单条命令删除矩阵 $m$ 中的所有偶索引行，$m$ 可以是任意大小。例如，在 $6\times6$ 矩阵中，该命令将删除第二、第四和第六行，但在
    $2\times2$ 矩阵中只删除第二行。


    6. 什么 MATLAB 命令将任何矩阵 $m$ 的第一列替换为零？


    7. 什么 MATLAB 命令将矩阵 $m$ 的第二行替换为向量 $v$（假设 $m$ 的列数与 $v$ 相同）？例如，如果 $m = [1 2 3 4]$
    且 $v = [9 9]$，这将创建一个矩阵 $[1 2; 9 9]$。


    8. 如果给定向量 $x$，编写 MATLAB 命令：

    a) 提取前五个数字

    b) 删除最后五个数字


    9. 编写 MATLAB 命令，给定长度为 5 的预定义向量 $v$，只返回奇索引值。例如，如果 $v = [1 5 -3 0]$，它将返回 $[1 3 0]$。


    10. 与上述相似更难：编写 MATLAB 命令，给定任意长度的预定义向量 $v$，只返回奇索引值。该命令必须无论向量长度如何都有效。例如，如果 $v =
    [1 5 -3 0]$，它将返回 $[1 3]$，但如果 $v=[1 5]$，它将返回 $[3]$。这种数据长度的减少在应用于数字处理时被称为下采样。


    11. 创建一个长度为 $2^{10}=1024$ 的交替数字 $[1 -1 ...]$ 向量 $v_3$。提示：不要独立指定每个值，因为那样太长了。要么考虑如何将
    $[1 -1]$ 拼接成更长的单位，或者考虑如何利用 $(-1)^0=1, (-1)^1=-1, (-1)^2=1, (-1)^3=-1$ 等事实。


    12. 对于任意长度的 $x$，什么 MATLAB 命令可以创建一个由 $x$ 中每个奇索引值的向量？例如，如果 $x=[5 1 2]$，则 $y=[5]$；如果
    $x=[1]$，则 $y=[1]$。


    13. 使用索引而不是内置的 `flip()`，编写 MATLAB 命令获取任意长度的给定向量 $g$，并从其产生其翻转向量 $f$。例如，如果 $g=[1
    2]$，则 $f=[2 1]$；如果 $g=[1 2 3 4]$，则 $f=[4 3 2 1]$。提示：向量增量可以是负数。


    14. 对于任意长度的 $x$，编写 MATLAB 命令创建向量 $y$，通过重复每个值使向量 $x$ 倍。例如，如果 $x=[2 -1]$，则命令将创建
    $[2 2 -1 -1]$；如果 $x=[2 -1 3]$，则命令将返回 $[2 2 -1 -1 3 3]$。


    从以下命令开始，找到第三条命令来解决问题：


    ```

    y = zeros(1,2*length(x));

    y(1:2:end-1) = x;

    ```


    这种通过重复值增加数据长度是数字模拟转换零阶保持的近似方法。


    15. 给定任意长度的向量，编写 MATLAB 命令返回向量 $v$，使其等于 $s$ 相邻值的平均值。例如，如果 $v=[1 4 -2]$，则 $s$ 将是
    $[2.5 1 0]$（见下图）。注意结果的长度总是比给定向量短。


    ![](img/d1b4f05eead98e7b59e76deae28a6347_82_0.png)


    虽然示例使用了长度为 4 的向量，但该命令适用于任何长度为 2 或更大的 $s$ 向量。答案是一个单一的 MATLAB 命令，部分如下。请填补省略号 (...)表示的部分。


    ```

    s = (v:end-1)/2

    ```


    这被称为*移动平均滤波器*，它在电子工程中用于市场分析。


    '
