    \ large or small numbers so that mantissas are always between 1 and 1000. This\
    \ is not scientific notation: 4.3 × 10⁻¹ in scientific notation is written in\
    \ engineering notation as simply 43, for example. These postfixes are in ratios\
    \ of 1000. Note: Capitalization matters! A 1 MΩ resistor is extremely large; a\
    \ 1 mΩ resistor is very small.\n\n| Prefix | Name | Scaling | Engineering example\
    \ | Scientific notation (do not use!) |\n|---|---|---|---|---|\n| p | pico | 10⁻²\
    \ | 12 pF | 12 × 10⁻² F |\n| n | nano | 10⁻⁹ | 434 nV | 434 × 10⁻⁹ V |\n| μ |\
    \ micro | 10⁻⁶ | 1.2 µA | 1.2 × 10⁻⁶ A |\n| m | milli | 10⁻³ | 150 mH | 0.15 H\
    \ |\n| | | 1 | 36 H | 36 H |\n| k | kilo | 10³ | 13 kV | 13,000 V |\n| M | Mega\
    \ | 10⁶ | 1 MΩ | 10⁶ Ω |\n| G | Giga | 10⁹ | 96 GB | 96 × 10⁹ B |\n| T | Tera\
    \ | 10¹² | 2 TB | 2 × 10¹² B |\n\nAs you get used to these postfixes range will\
    \ help you do mathematics spanning large intervals. For instance, a 12 µA current\
    \ through a 4 MΩ resistor generates its product in voltage, which is 12×4 in units\
    \ of μ (two up from the center) times M (two down from the center), which is simply\
    \ 48 times the center, or 48V. No powers of 10 are required!\n\nThe if-elseif-else-end\
    \ construct can be used to change numbers into engineering form. Here is an implementation\
    \ that works for milli, (unity), and kilo prefixes:\n\n```matlab\nfunction s =\
    \ engform(x)\n% engform take a number and rewrites it in\n% engineering form\n\
    % 0.0032 is returned as 3.2m.\n% 12452 is returned as 12.45k\n% 98.6 is returned\
    \ unchanged as 98.6\nif (x<1e3) % values is in milli units\n    x = x*1000;\n\
    \    prefix = 'm';\nif (x<1e3) % no prefix needed between 1 and 1000\n    prefix\
    \ = '';\nelse % value is in a kilo units\n    x = x/1000;\n    prefix = 'k';\n\
    end\ns = sprintf('%g %s',x,prefix);\n```\n\nNote that %g is used in sprintf for\
    \ numbers and %s is used for strings.\n\n![](img/d1b4f05eead98e7b59e76deae28a6347_171_0.png)\n\
    \n> ### TECH TIP: RESISTOR COLOR CODES\n\nThe size of a resistor is not related\
    \ to its resistance but rather to how much power it can dissipate. Many modern\
    \ ones are in extremely small surface mount packages. The 0201 package, for instance,\
    \ is about 0.02”×0.01”; two could fit on the period at the end of this sentence.\
    \ However, most resistors used for prototyping in solderless breadboards are 1/4W\
    \ or 1/8W sized and look like this magnified image:\n\n![](img/d1b4f05eead98e7b59e76deae28a6347_172_0.png)\n\
    \nThese resistors have four bands of color that with some practice can be read\
    \ by sight according to the following diagram:\n\n![](img/d1b4f05eead98e7b59e76deae28a6347_172_1.png)\n\
    \n| Color | Digit | Digit | Multiplier | Tolerance |\n|---|---|---|---|---|\n\
    | Black | 0 | 0 | 1 | |\n| Brown | 1 | 1 | 10 | 1% |\n| Red | 2 | 2 | 100 | |\n\
    | Orange | 3 | 3 | $10^3$ | |\n| Yellow | 4 | 4 | $10^4$ | |\n| Green | 5 | 5\
    \ | $10^5$ | |\n| Blue | 6 | 6 | $10^6$ | |\n| Violet | 7 | 7 | | 0.1% |\n| Gray\
    \ | 8 | 8 | | |\n| White | 9 | 9 | | |\n| Gold | | | | 5% |\n\nThe above resistor\
    \ is gray, red, yellow, and gold, meaning $82 \\times 10^4 = 820 \\text{ k}\\\
    Omega$, 5% tolerance.\n"
  mdcn: "\n\n14. 更新之前的 problem13 函数，使用 if-else-end 语句，并将其另存为 problem14。\n\n## 条件分支：if-elseif-else-end\n\
    \n如果测试结果有一个输出需要执行特殊代码，我们使用 `if-end` 块。如果有两个不同的结果且每个结果都需要特殊的处理，我们使用 `if-else-end`\
    \ 块。如果有两个以上的不同结果需要执行不同的代码块，则使用 `if-elseif-elseif...else-end` 块，它对每个可能的结果使用多个 `elseif`\
    \ 语句，并最后用一个可选的 `else` 语句处理所有剩余情况。\n\n![](img/d1b4f05eead98e7b59e76deae28a6347_165_0.png)\n\
    \n`if-elseif-else-end` 块的多种可能结果。\n\n例如，可以生成一个 0 到 1 之间的随机数，并根据该数字提供多个不同的响应。例如：\n\
    \n```matlab\nfunction out = isCEFfun()\nr = rand();\nif (r<0.2)\n    out = 'always!';\n\
    ```\n\n```matlab\nelseif (r<0.4)\nout = 'sometimes';\nelseif (r<0.6)\nout = 'usually,\
    \ but not on Mondays';\nelseif (r<0.8)\nout = 'up until 1:30AM';\nelse\nout =\
    \ 'can I change my major to biology?';\nend\n```\n\n## 练习题\n\n- 15. 创建一个名为 `problem15`\
    \ 的函数，计算控制理论中使用的符号函数。它接受一个数字，如果输入为负则返回 –1，为零则返回 0，为正数则返回 1。使用 `if-else-end` 结构。\n\
    \n## 创建嵌入数字的字符串\n\n要创建一个包含文本和嵌入数字的字符串，请使用 `sprintf()`。例如，命令：\n```matlab\ncurrent\
    \ = 36.5;\ns = sprintf('The current is %g Amps.', current);\n```\n会创建一个内容为 `The\
    \ current is 36.5 Amps.` 的字符串 `s`。\n\n![](img/d1b4f05eead98e7b59e76deae28a6347_166_0.png)\n\
    \n单引号内的每个 `%g` 字符都会被引号后的后的数字所替换。可以有多个变量，例如：\n\n```matlab\nnode = 5; voltage =\
    \ 42;\ns = sprintf('Node %g voltage is %g Volts', node, voltage)\n% s 将持有字符串 Node\
    \ 5 voltage is 42 Volts\n```\n\n`sprintf()` 命令允许广泛的格式化。三个最常用的格式化命令是：插入新行的 `\\\
    n` 命令（即垂直间隔）、插入制表符以帮助对齐表格的 `\\t` 命令，以及将数字格式化为两位小数的 `%0.2f` 命令。例如，考虑以下单行代码：\n\n\
    ```matlab\ns = sprintf('Node 1:\\t%0.2f\\nNode 2:\\t%0.2f',pi,2*pi);\n```\n将创建一个显示以下两行格式化文本的字符串：\n\
    Node 1 = 3.14V\nNode 2 = 6.28V\n\n## 在命令行窗口显示字符串\n\n有时我们需要直接将结果显示在命令行窗口中，而不是设置一个字符串变量来存储它。在这种情况下，使用\
    \ `fprintf()` 而不是 `sprintf()`，如下：\n\n```matlab\nfprintf('Node 1 = %0.2f\\nNode\
    \ 2 = %0.2f\\n',pi,2*pi);\n```\n在命令行中打印以下内容：\nNode 1 = 3.14V\nNode 2 = 6.28V\n\
    \n引号内部末尾的 `\\n` 是必须的，因为没有它，光标将悬挂在最后一个写入的字符处（在上例中最后一个 \"V\" 字符的右侧），并且下一个写入的字符将从该点继续，而不是如预期那样重置到下一行的开头。\n\
    \n## 练习题\n\n- 16. 编写 `fprintf()` 命令（不是整个函数），在给定变量 `R` 的情况下，在命令行打印语句（例如，当 `R=26.2`\
    \ 时）：\nThe resistance is 26.2 Ohms\n\n![](img/d1b4f05eead98e7b59e76deae28a6347_168_0.png)\n\
    \n## 技术技巧：电线规格\n\n北美的电线规格由美国线线规（AWG）标准规定。线径越小，线规规格越高。电子原型制作中使用的通用跳线线通常是 22 AWG；用于向厨房电器供电的较粗线通常是\
    \ 18 AWG，而重型电源扩展线为 14 AWG。电线的规格是根据其最大所需载流能力以及传输电流所需的长度决定的。下表列出了常见的 AWG 尺寸、线线直径及其在短距离内（如电器内部）的推荐电流能力：\n\
    \n| AWG | 导体直径（英寸） | 最大电流能力（安培） |\n|---|---|---|\n| 12 | 0.0808 | 41 |\n| 14 |\
    \ 0.0641 | 32 |\n| 16 | 0.0508 | 22 |\n| 18 | 0.0403 | 16 |\n| 20 | 0.0320 | 11\
    \ |\n| 22 | 0.0253 | 7 |\n| 24 | 0.0201 | 4 |\n\n电线还有两种类型：硬线和股线。硬线由单个实心（通常是铜）导体组成；优选用于原型制作，因为它可以插入无源面包板的孔中，并用于电源分配。股线由多根线束在一起而成；比硬线更灵活，优适用于可能反复弯曲的应用。\n\
    \n## 练习题\n\n- 17. 创建一个名为 `problem17` 的函数，接受一个 AWG 尺寸（偶数尺寸 12–24）并返回以下字符串：“AWG\
    \ 12 is 0.0808 inches, max current 41A”。使用 `if-elseif-else` 语句检查电线规格并设置线径和电流变量。然后在最后使用一个\
    \ `sprintf()` 语句创建一个字符串。\n\n## 技术技巧：工程计数法\n\n工程师使用后缀（数字后面的字母）来表示大数字或小数字，使得尾数始终保持在\
    \ 1 到 1000 之间。这与科学计数法不同：1M 是极大的，而 1m 是非常小的。\n\n| 前缀 | 名称 | 缩放 | 科学计数法示例 |\n|---|---|---|---|\n\
    | p | 皮 | 10⁻² | 12 × 10⁻² |\n| n | 纳 | 10⁻⁹ | 434 × 10⁻⁹ |\n| μ | 微 | 10⁻⁶ |\
    \ 1.2 × 10⁻⁶ |\n| m | 毫 | 10⁻³ | 15 |\n| k | 千 | 10³ | 36 |\n| M | 兆 | 10⁶ | 96\
    \ |\n| G | 吉 | 10⁹ | 96 |\n| T | 太 | 10¹² | 2 × 10¹² |\n\n习惯了这些后缀可以帮助你进行数学运算。例如，124\
    \ 在工程计数法中是简单的 43，而在科学计数法中，大小写至关重要！\n\n`if-elseif-else-end` 结构可以用于将数字转换为工程格式。这里有一个实现：\n\
    \n```matlab\nfunction s = engform(x)\n% engform 将一个数字转换为工程格式\n% 0.032 返回 32m\n\
    if (x<1e3) % 在毫单位范围内\n    x = x*1000;\n    prefix = 'm';\nelse % 在千单位范围内\n   \
    \ % 无需前缀\n    prefix = '';\nend\nend\ns = sprintf('%g%s',x,prefix);\n```\n注意 `%g`\
    \ 用于数字，`%s` 用于字符串。\n\n![](img/d1b4f05eead98e7b59e76deae28a6347_171_0.png)\n\n\
    > ### 技术技巧：电阻颜色\n\n电阻的大小与其阻值无关，而是取决于它能耗散多少功率。许多现代电阻是极小的贴封装。例如，0201 封装约为 0.02”×0.01”；两个可以放在句末的句号处。然而，大多数面包板上使用的电阻是\
    \ 1/4W 或 1/8W 尺寸，看起来如下放大图：\n\n![](img/d1b4f05eead98e7b59e76deae28a6347_172_0.png)\n\
    \n这些电阻有四个色环，通过练习可以根据下面的图示识别：\n\n![](img/d1b4f05eead98e7b59e76deae28a6347_172_1.png)\n\
    \n| 颜色 | 数字 | 数字 | 乘数 | 误差 |\n|---|---|---|---|---|\n| 黑色 | 0 | 0 | 1 | |\n| 棕色\
