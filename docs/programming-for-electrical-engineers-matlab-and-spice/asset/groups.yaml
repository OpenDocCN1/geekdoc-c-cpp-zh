    # TECH TIP: POWER VERSUS ENERGY (WORK)


    Many people use the terms "power" and "energy" interchangeably, but these terms
    have very different meanings. Energy, measured in Joules (J), is the ability to
    do work—examples of a quantity of energy include a coin lifted by 1 foot (20 J),
    two AA batteries (20 kJ), a ham sandwich (2 MJ), or 20 gallons of gasoline (2.4
    J). The rate at which energy is used is measured in Watts (W). A Ferrari will
    be able to deliver more power than a Volkswagen Beetle, even though both may start
    with their gas tanks identically full (i.e., they begin with the same energy,
    but the greater power of the Ferrari will cause it to use that energy more quickly).
    A car going up a hill will use more power than the same car traveling on flat
    ground. The ham sandwich will power a young child for longer than an adult, and
    the AA battery will light a 150mW LED for about twice as long as a brighter LED
    rated for 300mW of power consumption.


    Mathematically, energy is the time-integral of power (or power x time, if power
    is constant), and power is the time-derivative of energy (or energy/time, if power
    is constant).


    ```

    power = d/dt energy(t) = energy/time (if power is constant)

    ```


    ![](img/d1b4f05eead98e7b59e76deae28a6347_248_0.png)'
