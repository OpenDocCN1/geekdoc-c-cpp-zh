    # 技术提示：功率与能量（功）的区别


    许多人交替使用“功率”（power）和“能量”（energy）这两个词，但这些术语的含义非常不同。能量以焦耳（J）为单位，是做功的能力——能量的示例包括：举起
    1 英高的硬币（20 J）、两节 AA 电池（20 kJ）、一个火腿明治（2 MJ）或 20 加仑汽油（2.4 J）。能量使用的速率以瓦特（W）为单位。法拉利提供的功率会比大众甲虫大，尽管两者的油箱在开始时可能都是满的（即它们拥有的能量相同，但法拉利更大的功率会导致它更快地消耗这些能量）。上山坡的汽车使用的功率比在平地上行驶的同一汽车大。火腿明治为儿童提供的能量时间比成人长，而
    AA 电池点亮 150mW LED 的时间大约是额定功率为 300mW 的亮度 LED 的倍。


    从数学上讲，能量是功率的时间积分（如果功率恒定，则为功率乘以时间），而功率是能量的时间导数（如果功率恒定，则为能量除以时间）。


    ```

    power = d/dt energy(t) = energy/time (if power is constant)

    ```


    ![](img/d1b4f05eead98e7b59e76deae28a6347_248_0.png)


    # 练习题


    4. 使用 LTspice 确定下图电压源提供了多少功率：Ⓡ


    ![](img/d1b4f05eead98e7b59e76deae28a6347_249_0.png)


    5. 如果一节 AA 电池含有约 10 kJ 的能量，8 节 1.5V AA 电池可以为上述电路供电多久？提示：根据给出的 power = energy 公式求解时间。©®


    # 专业提示：伦理 II


    你的工程职业诚信在职业生涯中可能会多次受到考验，这就是为什么工程技术认证委员会（ABET）要求将伦理作为工程教育不可或缺的一部分。除了之前的专业提示中描述的
    IEEE 伦理守外，获得专业工程师（PE）认证的工程师承诺遵守美国专业工程师协会（NSPE）制定的类似规则。该组织代表了所有工程领域，包括电气、计算机、机械、土木、生物医学、化学、核能和石油。


    第 6 章：Spice


    NSPE 工程师行为准则（2007年）序言规定：


    工程师应始终意识到其首要义务是保护公众的安全、健康、财产和福利。如果在公众安全、健康、财产或福利受到威胁的情况下，他们的专业判断被否决，他们应当通知其雇主或客户或其他适当的机构。


    David Jonassen 开发了一个通用框架，帮助你在处理任何工程伦理问题时使用此 NSPE 伦理守则或 IEEE 伦理守（Journal of Education,
    vol. 98, no. 3, 2009）。他的分析方法包含五个步骤：


    - 陈述问题。用几个词清晰地定义伦理问题。

    - 获取事实。

    - 识别并辩竞争性的道德观点。大多数伦理问题涉及多个视角，每个观点可能导致不同的结论。

    - 确定最佳行动方案。

    - 用事实对行动决策进行说明。


    当面临艰难决策时，考虑使用此框架记录你的决定。


    # 技术提示：555 定器


    仅 Digi-Key 一家最大的元件供应商之一就销售了超过 50 万个集成电路（IC）。在这些电路中，555 定器在历史上是最受欢迎的。自 Signetics
    于 1972 年推出以来，该芯片的销量一直超过了所有其他类型的集成电路。它被用于医疗监护器、航天器导航系统和儿童玩具。尽管它可以用于许多不同的配置，但最常见的配置之一是作为无稳多谐荡器——简单来说，就是振荡器。频率使用两个电阻和一个电容器设置；它不会随电源电压的变化而发生显著变化。将其作为无稳多谐荡器的原理图以及
    IC 的引脚编号所示。


    注意，虽然原理图符号像 IC 一样是矩形的，但原理图的引脚编号不需要与实际设备的引脚位置对应，这使得原理图画得更简单。


    ![](img/d1b4f05eead98e7b59e76deae28a6347_251_0.png)


