    # BAR PLOTS


    A bar plot is a convenient way to visualize large quantities of raw data grouped
    into bins. For example, if a large class completes a lab and measures the following-voltages
    across a capacitor:


    | Vc | 3.3 | 3.4 | 3.5 | 3.6 | 3.7 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | Number of observations | 3 | 12 | 34 | 25 | 9 |


    Then to graph this relationship, use the same syntax as the plot command, but
    use bar(). As always, the horizontal data go first, followed by the vertical data:


    ```

    v = 3.3:0.1:3;

    n = [3 12 34 25 9];

    bar(v,n)

    ```


    ![](img/d1b4f05eead98e7b59e76deae28a6347_112_0.png)


    The same techniques used to adorn line plots also work with bar plots. For example,
    the previous plot could have a title and axis labels applied using title(), xlabel(),
    and ylabel(), or the axis() command could be used to change the axis scaling to
    eliminate the white space at the right side of the plot.


    Bar plots can be colored and also grouped into different series as shown below:
    type help bar for more information.


    ![](img/d1b4f05eead98e7b59e76deae28a6347_113_0.png)


