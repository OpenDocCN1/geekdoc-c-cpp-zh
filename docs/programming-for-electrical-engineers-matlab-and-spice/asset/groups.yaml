    # ADVANCED PLOT DECORATION


    There are two fundamentally different methods to gain complete control over all
    aspects of plots:


    +   - the interactive plot editor

    - handle graphics


    Interactive Plot Editor


    To enter the interactive plot editor, first create a plot, and then from the plot''s
    figure window menu, choose Tools → Edit Plot.


    ![](img/d1b4f05eead98e7b59e76deae28a6347_116_0.png)'
  - '[PAGE 117]


    Square selection boxes appear in this mode. There are three selectable things,
    as shown below: the Figure Window, the Axis Window, and the Data Set.


    ![](img/d1b4f05eead98e7b59e76deae28a6347_117_0.png)


    Once the desired item is selected, double click to enter the editor. The editor
    is context-sensitive and will offer choices dependent on the currently selected
    item. Because it is graphical and interactive, the interface is very intuitive
    to use. This is the primary benefit of using this method: it is fast.


    # Handle Graphics


    An entirely different method to fully your graphics is to use handle graphics.
    This method uses keyword/value pairs, like `linewidth`,5. The difficulty with
    this method is that there are many different keyword pairs, and they are accessed
    through handle graphics, which means you will need to use the new commands `get()`
    to learn which keywords are available and `set()` to change them. If you need
    to print an idea quickly, you might find the interactive plot editor helpful.
    However, in practice, this is rare; if you need to adjust details of the plot,
    it is often because you plan to use the plot in a document or presentation (which
    you may need to revise at a later date). All changes made using the interactive
    plot editor are lost, whereas with handle graphics, one can build a script file
    to build and modify each figure and recreate it later, thus preserving the document''s
    editability.'
