    # LAYERING PLOT COMMANDS USING hold()


    One of the most powerful abilities of plot() is its ability to layer multiple
    line plots on the same axis. There are two different ways to accomplish this:


    - 1. Use the plot(x1, y1, x2, y2) syntax earlier introduced

    - 2. Use plot(x1, y1), hold(''on''), plot(x2, y2), hold(''off'')


    Let''s begin by describing the weakness of the first method. You know how to plot
    two sets of data (x1, y1) and (x2, y2) with two lines using:


    ```

    plot(x1, y1, x2, y2)

    ```


    You also know how to format them individually—for instance, making the first line
    red and solid the second line black and dotted. Recall the commands must be grouped
    with the data, as in the following example:


    | first line | second line |

    | :--- | :--- |

    | plot(x1, y1, ''r-'', x2, y2, ''k:'') |


    ![](img/d1b4f05eead98e7b59e76deae28a6347_110_0.png)


    The second black dotted line here is hard to see because it is small. How can
    make the first line thick and the second line thin? Two-part commands like ''linewidth'',
    5 and ''color'', [1 0 1] will not work because they must appear at the very end
    of the plot() command, and so they apply to all the line plots within the plot()
    command, as shown below:


    first line

    second line

    whole-plot line

    plot(x1,y1,''r-'',x2,y2,''k:'',''linewidth'',5)


    ![](img/d1b4f05eead98e7b59e76deae28a6347_111_0.png)


    To obtain the desired effect of just the second (black) line being thicker, one
    must use the hold() command to layer two different plot() commands on top of each
    other. To do this, plot only the first line, and then turn on using hold(''on''),
    as follows:


    ```

    plot(x1,y1,''r-''); hold(''on'')

    ```


    Then the second thick black line with the linewidth modifier:

    ```

    plot(x2,y2,''k:'',''linewidth'',5)

    ```


    Do not forget to turn hold off, or the next plot you create will continue to layer
    on top of the current plot:


    ```

    hold(''off'')

    ```


    ![](img/d1b4f05eead98e7b59e76deae28a6347_111_1.png)


