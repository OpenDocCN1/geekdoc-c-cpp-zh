    ## 深入探索


    对瞬态仿真分析的其他选项感兴趣吗？大多数选项都相当深奥，可以在“帮助 > LTspice > 瞬态分析”中进行研究。常用的三个调整选项是停止时间（Stop
    time）、开始保存数据的时间（Time to start saving data）和最大时间步长（Maximum timestep）。如果不感兴趣电路的早期行为，停止时间就是仿真的持续时间（秒）。LTspice
    会自动选择输出值的频率——值变化快时输出频率较高，变化慢时较低。这可以通过设置最大时间步长（通常为毫秒或秒）来手动控制。


    - 在原理图的空白区域点击“OK”并仿真“tran 0.5s”。

    - 从窗口中选择“仿真 → 运行”或点击相应的按钮。将出现以下原理图/分析窗口。


    ![](img/d1b4f05eead98e7b59e76deae28a6347_254_0.png)


    - 将光标置在原理图的某条导线上，以查看电压随频率变化的示波器风格图。在上面的示例中，光标悬停在连接到引脚 3 OUT 的导线上。光标会变成红色的示波器探针。

    - 点击探针以显示相应的电压波形。


    ## 电气工程师的编程


    ![](img/d1b4f05eead98e7b59e76deae28a6347_255_0.png)


    - 点击其他导线以添加轨迹。在轨迹上点击右键，并从弹出菜单中选择“编辑 → 删除”将其移除。


    ## 练习题


    修改上面的操作步骤以打印一秒钟的数据。使用“剪辑和标记”工具（如果在 Windows 上）或 Command+Shift+4（如果是在 Mac 上）记录分析窗口的截图。


    ## 技术技巧：运算放大器


    运算放大器，或简单地称为“opamp”，是一种非常常用的集成电路。它的种类多得惊人；Digi-key 销售 35,000 种不同的运放器。运放在电路课程中有详细描述；本教材考虑了理想运算放大器的一个应用，其原理图符号为：


    ![](img/d1b4f05eead98e7b59e76deae28a6347_255_1.png)


    第 6 章：Spice 249


    运放用于许多不同的用途，包括放大、滤波，甚至作为模拟计算机对输入信号进行积分和微分。下面是一个低通滤波器的示例。输入运放的信号 $v_{in}(t)$ 在左侧，输出在右侧，运放中间带有小极性符号的垂直导线是连接到运放的直流电源连接。


    所示电路称为二阶巴特沃斯低通滤波器，它会通过频率低于预设频率 $f_0$的正弦波，但会衰减较高频率的正弦波。它可以放置低音放大器之前，以确保没有高频信号发送到低音扬器。


    ![](img/d1b4f05eead98e7b59e76deae28a6347_256_0.png)


    最右侧的 5V 源跨越但没有连接到运放的输出。电气工程的习惯是，两条垂直交叉的线是不连接的，除非它们的交点处画有一个大黑点。


    在给定所需的截止频率 $f_0$ 和电阻值 $R$ 的情况下，该电路的设计方程为：


    ```

    $C_1 = \frac{\sqrt{2}}{2\pi R f_0}$ 和 $C_2 = \frac{C_1}{2}$

    ```


    8. 使用上述方程选择 C₁ 和 C₂ 来设计一个截止频率为 200Hz 的低通滤波器。


