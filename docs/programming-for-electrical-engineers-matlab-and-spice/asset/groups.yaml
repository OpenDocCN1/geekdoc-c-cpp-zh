    \n# 向量的增长与预分配\n\n函数通常会返回一个向量，其元素是在循环内部计算的。在这种情况下，该向量可以先使用 `zeros()` 命令初始化为完整大小然后在循环内进行填充，也可以在循环内部增长其大小，使其长度随每次循环而增加。前者方法效率高得多，通过在循环开始前使用如下命令为向量预留内存来实现：\n\
