    ![](img/d1b4f05eead98e7b59e76deae28a6347_94_0.png)


    ## 轴限制


    MATLAB 在选择垂直轴和水平轴限制方面通常做得很好，但不总是如此。例如，如果你需要 MATLAB 使用的八种预定义颜色以外的颜色，可以使用 ''color''
    关键字，后跟 [红, 绿, 蓝] 坐标中的颜色规范。这是一个三数字数字向量，每个数字在 0 到 1 之间变化，定义了红色、蓝色和绿色的呈现方式。这种颜色规范系统在计算机图形中非常常见。例如，橙色混合了大量的红色，混合了中等量的绿色且没有蓝色，因此
    RGB 坐标 [1 0.5 0] 产生橙色色调，可以使用以下命令绘制：


    ```

    plot(t, y, ''color'', [1 0.5 0])

    ```


    ## 组合命令


    `plot()` 的命令必须分为两部分。第一部分是 x,y 数据，后面是单字符颜色和单字符或双字符线条样式。任何颜色和线条样式字符必须放在一起并包含在单引号内，例如使用
    ''r-'' 而不是 ''r'',''-''。以两部分形式给出的命令（如 ''linewidth'', 10）必须放在末尾。例如，要绘制下一页所示的红色点线，使用命令：


    ```

