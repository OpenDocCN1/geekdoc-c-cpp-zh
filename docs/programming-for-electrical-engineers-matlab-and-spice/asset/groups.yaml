    \n# 矩阵\n\n### 矩阵大小\n\n正如 `length()` 命令可以确定向量中有多少个元素一样，`size()` 命令返回矩阵中有多少行和列。例如，\n\
    \n```\nx = [4 3; 2 -4; 5 7] (即 x= [4 3; 2 -4; 5 7])\n```\n\n然后可以使用以下命令找到矩阵维度：\n\
