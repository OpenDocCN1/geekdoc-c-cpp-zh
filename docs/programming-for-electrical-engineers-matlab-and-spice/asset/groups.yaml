    # TECH TIP: MESH AND NODAL ANALYSIS METHODS


    Techniques for solving complex circuits with many resistors include Node Voltage
    Analysis and Mesh Current Analysis. These methods are usually taught in circuit
    analysis courses, but at their core, they are a systematic way of applying Ohm''s
    Law, V = IR, repeatedly over circuit fragments. They create systems of equations
    that can be solved simultaneously to find every voltage (for Node Voltage Analysis)
    or current (for Mesh Current Analysis). MATLAB can solve these simultaneous equations,
    which sometimes include more than 100 unknowns, in less than a second.


    The diagrams below show on the left, a circuit, its voltage definitions, and the
    set of equations generated by the Node Voltage Analysis method for its voltages;
    and on the right, the same circuit with its currents defined, as well as the set
    of equations derived using the Mesh Analysis method to find these currents. Beginning
    EE students should know the names of these methods, but need not know how to apply
    them.


    ![](img/d1b4f05eead98e7b59e76deae28a6347_74_0.png)


    ![](img/d1b4f05eead98e7b59e76deae28a6347_74_1.png)


    voltage equations for above


    3V1 - V2 - 2V3 = -16

    -3V1 + 7V2 - 2V3 = 0

    -3V1 + 3V2 + 5V3 = 30


    current equations for above

    6I1 - 2I2 - 3I3 = 10

    I2 = 2

    -3I1 - 3I2 + 9I3 = 0'
