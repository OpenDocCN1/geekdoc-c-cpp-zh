    # TECH TIP: CHARGE AND CURRENT


    ![](img/d1b4f05eead98e7b59e76deae28a6347_15_0.png)


    Two important quantities in ECE are current and charge. An accurate way to think
    of these quantities is the analogy of water being pumped through pipes around
    a closed circuit.


