  - '[PAGE 88]


    # TYPES OF PLOTS


    Electrical engineers use a wide variety of graphs to show data. The most common
    types are the line plot, the scatter plot, and the bar plot, as shown below. The
    line plot is used to show continuously varying data, much as an oscilloscope may
    be used to view a time-varying voltage. The scatter plot is used to show discretely
    measured data (i.e., the actual vs. rated resistance of a sample of six inductors).
    If there is too much data to display using a scatter plot (i.e., a data set sampling
    10,000 resistors), the data may be grouped into bins and displayed in a bar plot.


    ![](img/d1b4f05eead98e7b59e76deae28a6347_88_0.png)


    Common types of plots used in electrical and computer engineering are shown above.
    "Voltage versus time" shows the line plot (with two differently formatted lines
    on the same axes), while "Inductance value" and "Resistor value distribution"
    are examples of the scatter plot and the bar chart, respectively. In this chapter,
    you will learn how to make all of these in MATLAB.'
