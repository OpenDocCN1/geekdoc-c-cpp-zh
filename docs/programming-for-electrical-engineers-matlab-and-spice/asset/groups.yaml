    % return v of length n and preallocate v\nv = zeros(n);\nfor i = 1 : n\n  v(n)\
    \ = rand + sin(2*i);\nend\n```\n\n# Bad practice: grow memory\n\n```\nfunction\
    \ v = BadProgram(n)\n% return v of length n but grow v to grow\nv=[];\nfor i =\
    \ 1 : n\n  newval = rand + sin(2*i); % newval is calculated\n  v = [newval v];\
    \ % insert newval at start of v\nend\n```\n\n> **DIGGING DEEPER**\nThe reason\
    \ why vectors should be initialized with some value like zeros, rather than as\
    \ needed, is because of the way MATLAB grows vectors. If a vector needs to grow\
    \ to accommodate a new value, for instance, to grow from 100 to 101, MATLAB must\
    \ internally create an entirely new 101 length vector, then copy the original\
    \ 100 values over to it, then save the additional single value, and destroy the\
    \ original length 100 vector. Compare this with the faster alternative of preallocating\
    \ memory for the final array once, and then replacing the initialized values with\
    \ the calculated values."
