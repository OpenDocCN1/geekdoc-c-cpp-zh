    # WORKING WITH MATRICES


    # Matrix Size


    Just as the length() command can be used to determine how many elements are in
    a vector, the size() command returns how many rows and columns are in a matrix.
    For example,


    ```

    x = [4 3; 2 -4; 5 7] (that is, x= [4 3 \ 2 -4 \ 5 7])

    ```


    then the matrix dimensions can be found using


    ```

    [rows, cols] = size(x)

    ```


    This sets the variable rows to 3 and cols to 2. Note how size() sets two variables
    at the same time. Since a vector is just a matrix with one row or column, size()
    also works on vectors:


    ```

    size([10 20 30 40 50])returns [1, 5] and

    size([10; 20; 30; 40; 50]) returns [5, 1]

    ```


    # Transpose


    Transposing a real matrix interchanges rows for columns. Thus, the matrix on the
    left in the example


    ```

    4 3

    2 -4 becomes 4 2 5

    5 7 3 -4 7 when transposed.

    ```


    The MATLAB command to do this is the apostrophe '' . For example,

    x = [4 3; 2 -4; 5 7]enters the matrix in the upper left, and

    y = x'' enters the matrix in the upper right.

    nThis can also be used to change column vectors to row vectors and vice-versa.


    For example, defining the column vector


    ```

    resistors = [10; 11; 12; 13; 15]

    ```'
