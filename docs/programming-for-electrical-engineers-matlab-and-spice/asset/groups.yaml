    # USING NESTED LOOPS TO SEARCH FOR BEST SOLUTIONS


    Finding exact solutions, as done in the previous section, is done by testing with
    the == operator. Sometimes exact solutions do not exist, in which case one must
    settle for the best solution. Finding this best solution requires keeping track
    of the current best solution, and checking through every iteration to see if the
    current computation is better. Error is often computed using code of the form
    error = abs(currentComputation - desired) since it is the absolute error that
    needs to be minimized.


    For example, if you need to find the value of two standard value resistors from
    1 Ω to 1 MΩ in series, whose sum is as close as possible to a given desired value,
    enter the following:


    ```matlab

    function [Rbest, R2best] = findclosetseries(Desired)

    % create VR with standard value resistors from 1 to 9.1

    VR = [1.1 1.2 1.3 1.5 1.6 1.8 2 2.2 2.4 2.7 3 ...

    3.3 3.6 3.9 4.3 4.7 5.1 5.6 6.2 6.8 7.5 8.2 9.1];

    % wraps the line


    % duplicate VR by multiples of 10 to create all

    % standard value Rs

    VR = [0 VR*100 VR*1e3 VR*1e4 VR*1e5 1e6];

    Rbest = 0; % we haven''t yet found the best value of R1

    R2best = 0; % we haven''t yet found the best value of R2

    bestError = 1e2; % our initial error is huge

    ```


    ```matlab

    % loop through find every possible value of R1

    for il = 1:length(VR)

    R1 = VR(il);

    % loop through find every possible value of R2

    for i2 = 1:length(VR)

    R2 = VR(i2);

    Rseries = R1+R2;

    currentError = abs(Rseries - Desired);

    if (currentError < bestError)

    % we found a better solution

    Rbest = R1;

    R2best = R2;

    bestError = currentError;

    end

    end

    end

    ```


    # PRACTICE PROBLEMS


    - 9. Change the above program to print out the closest value of two standard-value
    resistors in parallel to a given desired resistor. Test to find the nearest parallel
    combination of standard resistor values to match R=40.5 Ω. How close is it? Ⓡ


    tic, toc


    The commands tic, toc will time how long it takes MATLAB to execute the commands
    that separate them. These commands must be either within a function or cut into
    the command window; otherwise, most of the delay between the “tic” and the “toc”
    will be from your typing speed, not MATLAB’s calculation limitations.


    ```matlab

    function calculationspeed

    % find how long it takes to create two random 50x50

    % matrices and multiply them together

    tic

    a = rand(50,50); % create two random 50x50 matrices

    b = rand(50,50);

    c = a*b; % multiply them together

    toc

    ```


    MATLAB then returns the following on my 2017-era computer:


    ```

    Elapsed time is 0.278700 seconds.

    ```


    The toc command will also return the elapsed time in seconds to a variable.


