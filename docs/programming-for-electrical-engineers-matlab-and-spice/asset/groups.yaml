  md: '

    But how can you specify the elements from the third through the last? You could
    find the value of the last element using length(v), and use this to build up the
    command:


    ```

    v(3:length(v))

    ```


    MATLAB provides a shortcut for this operation: the end operator, indicating the
    last value of the vector. To simply type:


    ```

    v(3:end)

    ```


    Similarly, the last five elements can be extracted or set using the command:


    ```

    x = v(end-4:end) to extract, or v([1 2 3 4]) to set.

    ```


    ## Removing Elements in Vectors


    What does removing an element" in a vector mean? We already know how to set it
    to zero; for example, setting the first element in vector v = [1 2 3] to 0 can
    be done with the following command:


    ```

    v(1) = 0;

    ```


    To fully remove the value means to shorten the length of the vector, and this
    is accomplished by setting the value equal to [], the null vector. In the above
    example, typing


    ```

    v(1) = [] changes vector v from [1 2 3] to [2].

    ```


    Now length(v) returns 2.


    ## Building Vectors from Other Vectors


    Vectors can be assembled from other vectors and scalars. If x = [1 2 3] and y
    = [6 7 8], then typing


    ```

    z = [x 7.5 y]

    ```


    create vector z with the components [1 2 3 7 5 6 8].


    ## Inserting Elements in Vectors


    To insert a 5 at the start of vector v = [1 2 3], type the command:


    ```

    v = [ 5 v ]

    ```


    You will find that vector v now holds [5 1 2 3].


    To insert a 7 at the end of vector v = [1 2 3], type the command:


    ```

    v = [ 7 ]

    ```


    Vector v now holds [1 2 3 7].


    To insert a 5 into the middle of vector v = [1 2 3], type the command:


    ```

    v = v(1:2) 5 v(3:4)

    ```


    While this command may seem like a syntactic mouthful, it follows from the preceding
    steps. v(1:2) returns the first two elements of v, v(3:4) returns the last elements
    of v, and those with the inserted value of 5 are all assembled into a new vector,
    assigned to v. It could have been assigned to a new vector called x if the original
    vector v was needed in other calculations.


    ## PRACTICE PROBLEMS


    - Given x=20:30, write the MATLAB commands to

    - 8. Find out how many numbers vector x holds.

    - 9. Display the contents of x.

    - 10. Retrieve the second value of the x vector.

    - 11. Set vector y to equal the second through fifth elements of x.

    - 12. Set vector y = x but with a 1 inserted into the front and end of vector
    x. That is, y = [1 20 21 22 ... 29 30 1], but create using the x vector.


    ## PRO TIP: BUYING A DIGITAL MULTIMETER (DMM)


    The digital multimeter is an important tool for practicing electrical engineers,
    and one you will use frequently. Unlike relatively expensive oscilloscopes, a
    good DMM costs relatively little and will last a long time. If you decide to purchase
    your own DMM, look for the following features (in addition to the resistance and
    AC/DC voltage and current measuring that all the DMMs should have):


    - Sound continuity (buzzes when the probes are connected so you can check for
    shorts and opens while looking at your work—very helpful for debugging!)

    - Diode checking

    - Capacitance measuring

    - Frequency measurement (optional)


    Other features are more expensive, and you are less likely to need them as you
    start out. These features include


    - True RMS measurement

    - NIST-traceable calibration

    - Go/no-go testing

    - Bargraph displays


    ![](img/d1b4f05eead98e7b59e76deae28a6347_57_0.png)


    Name brand instruments like Fluke tend to be very rugged and accurate, but they
    also cost more. One brand used by the authors, shown here, is about 5 years old.
    Instruments with similar capabilities now cost less than a high-end student engineering
    calculator.


    ## COMPLEX NUMBERS


    Although mathematicians use the i to represent $\sqrt{-1}$, electrical engineers
    use j since it is reserved for current (from a French word for intensity). MATLAB
    accepts both i and j variables to represent imaginary numbers. This text will
    follow the EE convention of using j.


    A complex number like 4+3j is composed of both real and imaginary parts, and it
    is often drawn on the complex plane, shown below:


    ![](img/d1b4f05eead98e7b59e76deae28a6347_58_0.png)


    There are three common ways of writing complex numbers: rectangular, polar, and
    complex exponential.


    > DIGGING DEEPER

    Since positive multiplied by a positive is positive and a negative multiplied
    by a negative is also positive, it is not possible to find two real numbers when
    multiplied together to make a negative number. We therefore must define $\sqrt{-1}$
    as something that is not real; we call it j.


