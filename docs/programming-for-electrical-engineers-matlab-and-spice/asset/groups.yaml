    # PRO TIP: CAREERS IN ELECTRICAL ENGINEERING


    Careers in electrical engineering can be examined by sector, title, or by discipline.
    “Sector” refers to who hires the engineer: a company, the government, or a university.
    “Title” refers to the job description, which is a function of the sector. “Subdiscipline”
    refers to the specific electrical engineering field, such as microelectronics,
    power, or telecommunication. There are three primary sectors that hire electrical
    engineers; these are private industry, government, and academia (in order of the
    number of annual hires), and each has unique benefits. Salaries tend to be highest
    in private industry, while government positions generally offer the greatest job
    security, and engineers working in academic institutions enjoy significant independence
    in choosing research topics.


    Each sector offers different types of job titles. Private industry has a great
    variety, including:


    +   * Research and development: Develop prototypes of devices and technologies;

    * Production: Optimize manufacturing processes to reduce cost;

    * Sales: Work as part of a team to sell a technological solution to a client;

    * Project Management: Manage teams of engineers and other specialists as they
    solve problems too broad in scope for a single engineer; and

    * Consulting: Help other companies solve technological problems, often involving
    production and project management.


    ![](img/d1b4f05eead98e7b59e76deae28a6347_36_0.png)


    Programming for Electrical Engineers'
