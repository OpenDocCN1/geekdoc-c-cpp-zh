    # DIGGING DEEPER


    The numbers produced by the MATLAB random generator are not truly random—they
    are pseudandom, since they are generated deterministically by an algorithm. This
    algorithm uses a seed to generate its initial value; each pseudandom number seeds
    the next value. When MATLAB launches, it initializes its seed according to the
    current date and time, measured in hundredths of a second, so it always appears
    to generate a new sequence of random numbers.


