    ## ADVANCED TEXT FORMAT


    Electrical Engineering plots often require exponents, subscripts, or Greek symbols,
    and MATLAB provides way for title(), ylabel(), and text() to display them.


    ### Greek Symbols


    Greek symbols are very common in Electrical Engineering, as described in the previous
    Tip, and they can be embedded using backslash by the name of the Greek symbol.
    The following command labels the horizontal axis with "Resistance in Ω":


    ```

    xlabel(''Resistance in \Omega'')

    ```


    | | |

    |---|---|

    | 0.5 | 1 |

    | 0 | Resistance in \Omega |


    ### Super and Subscripts


    Superscripts, like powers, such as t², and subscripts, like V1, are easy to create
    in MATLAB text if superscript or subscript is just a single character: use ^ or
    _ respectively. The following command creates the title V1(t)=f(t²):


    ```

    title(''V_1(t) = f(t²)'')

    ```


    ![](img/d1b4f05eead98e7b59e76deae28a6347_122_0.png)


    To group multiple characters in the superscript or subscript, surround them with
    curly braces (i.e., {}). The following command creates the text f(t) = e^{ω t}
    (notice it also includes Greek symbols):


    ```

    text(0.25,0.5, ''e^{\omega t}'')

    ```


    ![](img/d1b4f05eead98e7b59e76deae28a6347_123_0.png)


    - 16. Graph v₁(t) = 2e^{-λt}, 0 ≤ t ≤ 5, where λ=4; label the vertical axis “v,”
    and give it the title “2e^{-λt}, λ=4”


    ## THREE-DIMENSIONAL PLOTS


    Although the two-dimensional line, scatter, and bar plots described so far are
    the most common types of graphs used by electrical engineers, three-dimensional
    plots can show how one dependent variable changes as a function of two independent
    variables. For example, the sin function discussed earlier in this chapter also
    exists as a function of two variables, and it is used in image processing. This
    function is described by the equation:


    z(x,y) = \frac{\sin(\sqrt{x^2+y^2})}{\sqrt{x^2+y^2}}


    To graph this between -15 ≤ x ≤ 15 and -15 ≤ y ≤ 15, create x and y matrices using
    meshgrid(), which can be thought of to be 3D counterpart of linspace(). Meshgrid''s
    first argument is the vector of x locations, and its second is the vector of y
    locations, as follows:


    ```

    [x, y] = meshgrid(-15:15,-15:15);

    ```


    Then define the function to plot:


    ```

    z = sin(sqrt(x.^2+y.^2))./sqrt(x.^2+y.^2);

    ```


    Last, create the 3D plot with surf():


    ![](img/d1b4f05eead98e7b59e76deae28a6347_124_0.png)


    To get a smoother-looking plot, add a shading() command, which will turn off the
    black edges and make the shading more gradual:


    ```

    shading(''interp'')

    ```


    ![](img/d1b4f05eead98e7b59e76deae28a6347_124_1.png)


    Solid surfaces are created by the surf() command. To create a wireframe, use mesh()
    instead of surf(), as shown below:


    ```

    [x, y] = meshgrid(-15:15,-15:15);

    z = sin(sqrt(x.^2+y.^2))./sqrt(x.^2+y.^2);

    mesh(x,y,z)

    ```


    ![](img/d1b4f05eead98e7b59e76deae28a6347_125_0.png)


    ## PRACTICE PROBLEMS


