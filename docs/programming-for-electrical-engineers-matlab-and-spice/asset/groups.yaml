    ```

    t = linspace(-10,10,100);

    y1 = sin(t)/t;

    y2 = zeros(size(y1));

    plot(t,''b-'',t,y2,''k-'')

    ```


    - 3. 将文件保存为 ''figure1.m''。所有 MATLAB 代码文件必须以 .m 后缀结尾。编辑器窗口现在看起来如下所示：


    ![](img/d1b4f05eead98e7b59e76deae28a6347_108_1.png)


