    # 布局控制


    ![](img/d1b4f05eead98e7b59e76deae28a6347_12_0.png)


    MATLAB 由几个控制控件和窗口组成。最重要的窗口是中间的“命令”（command）窗口，如上所示，所有的 MATLAB 命令都输入此处。


    MATLAB 环境与上面的图片有很大不同，请将左上角的标签页控制设置为“主页”（home），并在上方工具栏的布局控制下拉菜单中选择“默认”（default）。保持标签页在“主页”位置；其他位置提供了各种向导（例如，辅助绘图或滤波器设计），但这些向导的使用通常比学习本文描述的直接语法要繁琐得多。


    接下来，创建一个数据文件夹，并将 MATLAB 的当前工作目录（即 MATLAB 期望查找用户数据和程序的目录）：


    - 1. 在主窗口的工具栏（左上角）中找到目录控件。

    - 2. 使用目录控件导航到你的数据目录。

    - 3. 在你的数据目录内部为你的电子工程（EE）课程创建一个新的子文件夹。

    - 4. 在该文件夹内部创建一个名为“Chapter 1”的子文件夹。

    - 5. 注意工具栏中的“当前目录”（Current Directory）输入框现在指向你的“Chapter 1”工作目录。


    # 将 MATLAB 作为计算器


    此时，在命令窗口中输入以下命令并观察它们的作用。每行结束后按“回车键”（Enter）。MATLAB 提示符 >> 是不需要输入的：


    - >> 2 / 5

    >> 3 + (4*9) ^ 20 (MATLAB 将像 2-10^34 这样的大数格式化为 2e+34)

    >> x = 5

    >> x + 32

    >> x = 2

    >> y = x + 1

    >> sqrt(16)

    >> sqrt(-25)


    MATLAB 可以用作复杂的计算器，并且它可以识别以下基本命令：


    - +

    - *

    - /

    - ^

    - sqrt()


    与许多编程语言一样，乘法、除法和幂分别由 *、/ 和 ^ 表示。MATLAB 使用标准的运算符优先级顺序来评估表达式，因此 1 + 3 ^ 2 等同于 1
    + (3^2) = 10，而不是 (1 + 3) ^ 2 = 16。有疑问时，请使用括号以确保清晰。


    注意，如果你不将计算结果保存到变量中，MATLAB 将其保存到变量 "ans" 中（answer 的缩写），这样你可以在下一次计算中重用它，如下：


    - >> 2 + 3

    >> ans / 10

    返回 0.5


    MATLAB 在几个方面类似于高档科学计算器：


    - 1. MATLAB 只对当前行进行操作。在在上一个示例中，当 x 的值从 5 变为 2 时，与电子表格不同，但像计算器一样，它没有改变涉及 x 的之前的计算，而是只改变了当前和未来的计算。

    - 2. 当涉及变量（例如示例中的 x 和 y）和等号时，MATLAB 首先评估等号右侧的语句，然后将结果赋值给数字。大多数编程语言也遵循这种方法。


    MATLAB 在其他方面与计算器不同，这在起初可能会令人困惑：


    - 1. 如果没有特殊的工具箱，MATLAB 无法执行符号代数运算。与许多现代计算器具有模式允许输入 $x^2 = 1$ 并求解出 $x$ 不同，MATLAB
    不理解如何处理未设置数值的变量。因此，MATLAB 会理解 $x = 4 + 7$，因为 $x$ 被设置为了特定的数字。然后它会理解 $y = x + 5$
    并将 $y$ 设置为 16。如果你想在该表达式中解出 $y$，它将不知道如何处理 $2*y = 3*x$。你必须自己使用代数进行计算，然后输入 $y = 3*x/2$。

    - 2. MATLAB 不理解隐式乘法。$4(3+1)$ 将产生错误消息，而 $4*(3+1)$ 则会被求值为为 16。


