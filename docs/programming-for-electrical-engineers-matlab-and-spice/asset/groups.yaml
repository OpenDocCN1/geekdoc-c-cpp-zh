    # TECH TIP: RESISTORS IN SERIES AND PARALLEL


    The most common electronic circuit component is the resistor. Our analogy in the
    Chapter 1 Tech Tip on page 11 likened resistors to a restriction in a pipe that
    limits the flow of water (current) when driven by a constant pressure (voltage).
    Two resistors of resistance R1 and R2 can be connected in series or parallel to
    create a new equivalent resistance, as shown below:


    | Two resistors | Equivalent resistance | Water analogy |

    |---|---|---|

    | Series | ![R1 R2 series](image) | ![R1 R2 series water](image) |

    | Parallel | ![R1 R2 parallel](image) | ![R1 R2 parallel water](image) |


    It is important for EE students to develop their intuition so that the mathematical
    equations become obvious. Using the water analogy, think of two resistors in series
    as two restrictions in series, as shown above. A pump (voltage source) must push
    water (current) through the first, and then through the second, so it follows
    that the equivalent resistance is the sum of the two individuals, or R1+R2. The
    water analogy for two resistors in parallel shows that adding a second resistor
    increases the number of paths that can flow, so it decreases resistance, as opening
    a second adjacent door will decrease resistance to traffic flow. The equivalent
    resistance of two resistors in parallel is


    > $R_1 \times R_2$

    nR_1 + R_2$


    This formula is often memorized as "product over sum" and will always return an
    equivalent resistance lower than either of the resistors that comprise it.'
