  - '[PAGE 167]


    Each occurrence of the %g character inside the single quotation marks is replaced
    by the number that follows the quotation marks. There can be more than one variable,
    e.g.,


    ```

    node = 5; voltage = 42;

    s = sprintf(''Node %g voltage is %g Volts, node, voltage)

    will s hold the string Node 5 voltage is 42 Volts

    ```


    The sprintf() command permits extensive formatting. Three of the most common formatting
    commands are the \n command that inserts a new line (i.e., a vertical line space),
    the \t command that inserts a tab to help align tables, and the %0.2f command
    that formats the number with two decimal spaces. For example, consider the single
    line:


    ```

    s = sprintf(''Node 1:\t%0.2f\nNode 2:\t%0.2f'',pi,2*pi);

    will create a string that displays the following two lines of formatted text:

    Node 1 = 3.14V

    Node 2 = 6.28V

    ```


    # Display Strings to the Command Window


    Sometimes we will need to display a result to the command window directly, rather
    than setting a string variable to hold it. In this case, use fprintf(), instead
    of sprintf(), as follows:


    ```

    fprintf(''Node 1 = %0.2f\nNode 2 = %0.2f\n'',pi,2*pi);

    prints the following to the command line:

    Node 1 = 3.14V

    Node 2 = 6.28V

    ```


    The trailing \n inside the quotation marks; it is necessary because without it,
    the cursor will be dangling at the last character written (to the right of the
    final "V"character in the example just given), and the next character written
    will continue from that point, rather than being reset to the beginning of the
    next line as expected.'
