    2. 定义分析类型。在本书中，我们将描述最常见的三个类型：


    - A. 直流分析 (DC Analysis)：直流分析假设所有源都是恒定的，因此输出也将是恒定的。

    - B. 瞬态分析 (Transient Analysis)：瞬态分析测量随变化的输出。

    - C. 交流分析 (AC Analysis)：交流分析测量电路对不同频率的正弦源的响应。


    - 3. 查看结果。根据分析类型的不同，输出可能是数字（例如数字电压表的读数）、随时间变化的波形（例如示波器轨迹），或随频率变化的图表。


    ![](img/d1b4f05eead98e7b59e76deae28a6347_236_0.png)


    # 技术提示：什么是地？


    与大多数元件不同，地有三种常用的符号：⚩ ��。LTSpice 使用中间的三角形符号。更让事情变得复杂的是，根据上下文的不同，这些地符号中的任何一个都可以代表三个不同概念之一：


    - 1. 地可以指与地球的物理连接，通常通过插入大地的铜钉实现。某些类型的无线天线需要地，电气电源安全规范也需要地，以在绝缘失效时保护用户。


    - 2. 地也可以指电路中将电流返回电源源的导体组。例如，汽车中的大多数电气设备有两个电源连接：一个通过保险丝通过电线连接到 +12V 源，另一个连接到汽车的金属底盘，称为“地”。汽车底盘通过一根粗地线连接到电源的负极。


    - 3. 然而，在本章中，地指的是电路中一个虚拟的、任意的电压参考点。电压总是在两点之间测量的，这使得在电路仿真器中描述起来很很方便，因为电路中任意两点的可能组合数量随着电路复杂性的增加而迅速增加。当用户将地符号连接到某一点（例如“B
    点”）时，她实际上是在说所有电压都是相对于 B 点测量的。单个地符号不会以任何方式改变电路行为；它只是表示“A 点和 B 点之间的电压为 6V”。换句话说，我们相对于地定义其他电路电压。


    地通常放置在电路中最负的点上，这通常是电源的负极。在这种情况下，电路中的所有其他电压（相对于地）将是正值，电路中的所有电流将通过地返回电源。


    下面的原理图 (L) 显示了各个点之间的若干电压。相邻的原理图 (R) 增加接地符号，这可以用更简单的方法重新定义相同的电压。你更倾向于哪一个？


