    - 11. 数字逻辑门在输入信号变化和门响应之间存在（通常是不需要的）延迟，称为传播延迟 $t_p$。对常见的 74LS04 芯片（非门）测试了以下传播延迟：


    | $t_p$ | 2.5ns | 2.75ns | 3ns | 3.25ns | 3.5ns |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 芯片数量 | 2 | 12 | 27 | 16 | 3 |


    创建一个显示上述值的柱状图。标记轴并给出一个标题。与其将 2.5 ns 这样很小的数字转换为 0.000000025，不如保留 2.5 并将轴标记为“time
    (ns)”。


    # subplot


    你已经学习了如何使用 `hold()` 或 `plot(x1,y1,x2,y2)` 在同一坐标轴上绘制多个项目。有时你可能想将多个轴分在同一个图中，如下所示，它显示了巴特沃斯低滤波器相对于各种轴缩放组合的频率响应。注意
    `hold` 或 `plot` 无法将这些内容放在同一坐标轴上。


    ![](img/d1b4f05eead98e7b59e76deae28a6347_114_0.png)


    相反，使用 `subplot()` 命令。该命令将图形分为 $r$ 行 $c$ 列，并将活动子图设置为 $p$：


    ```

    subplot(r,c,p)

    ```


    子图的编号按照我们的阅读顺序，即从左到右，从上到下：


    ![](img/d1b4f05eead98e7b59e76deae28a6347_115_0.png)

