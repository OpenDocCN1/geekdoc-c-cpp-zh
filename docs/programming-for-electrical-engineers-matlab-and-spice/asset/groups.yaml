    3. 现代合成器设计高度依赖信号处理。A4 音符的频率为 440 Hz（每秒）。上面的每个“半音”频率都高 $\sqrt{2}$ 倍。例如，比 A4 高一个半音的频率为
    $440 \sqrt{2}$ Hz，高两个半音的频率为 $440 (\sqrt{2})^2=493.9$ Hz。使用 MATLAB 计算高 7 个半音音符频率（音乐家称为
