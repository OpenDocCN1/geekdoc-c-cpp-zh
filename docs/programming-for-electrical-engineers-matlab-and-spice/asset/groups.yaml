    # 前言


    欢迎学生们，开启你们成为电气工程师的旅程！你们可能选择这个专业是因为想寻找一种具有挑战性且有回报的大学体验。也许你们是为了寻找一个符合你们对数学和科学天赋倾向的专业领域。虽然你们中一些人拥有来自机器人大赛、乐高联盟或高中电子课程的先验经验，另一些人在此之前从未考虑过将工程作为职业。正如某些人的建议，你们在之前可能就发现工程是适合自己的。虽然你们中一些人拥有机器人大赛、乐高联盟或高中电子课程的先验经验，另一些人在此之前从未考虑过将工程作为职业。正如某些人的建议，你们在之前可能就发现工程是适合自己的。虽然你们中一些人……（此处原文似乎存在重复内容）


    ![](img/d1b4f05eead98e7b59e76deae28a6347_1_0.png)


    我们编写《电气工程师编程指南》是因为在现有的 MATLAB 和 Spice 介绍中，我们找不到针对电气工程学生的“理想”实验手册。许多此类书籍读起来像用户手册（例如，“这个按键执行这个、这个、命令”），而没有对电气工程的底层原理过多关注。其他书籍则过于抽象，更多关注过程化编程的核心，但对于一年级工程学生来说可能太难了。目前某些书籍提供了通用工程原理的优秀介绍，但它们没有关注特定专业的特殊问题。


    与其他手册不同，《电气工程师编程指南》在电气工程的背景下引入了 MATLAB、Spice 以及通用的编程和分析背景，并根据单学期的特定需求定制内容。因此，无论是否具有编程或电路分析背景，一年级学生都能学习《电气工程师编程指南》。虽然本教程省略了对计算机科学学生至关重要的问题（如数据结构），但它包含了专门的数学应用（例如复相位分析），这些是电气工程频域分析的核心。《电气工程师编程指南》还概述了电路分析、电子、信号与系统、控制以及数字信号处理中使用的计算密集型方法。它还触及了数字课程的一些观点，随着你们


