    \ C 编程语言的超集，增加了面向对象的行为。\n\n- **VHDL：** VHDL 是一种特殊语言，用于编写一种名为现场可编程门阵列（FPGA）的特定集成电路。这些芯片并不以典型方式执行代码；相反，它们同时运行成上万个进程，需要特殊的语言来实现。在国防承包商中，VHDL\
