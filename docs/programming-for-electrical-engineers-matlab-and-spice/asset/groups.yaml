    # 技术贴士：电荷与电流


    ![](img/d1b4f05eead98e7b59e76deae28a6347_15_0.png)


    电子工程中两个重要的物理量是电荷和电流。准确理解这些物理量的一种方法是类比为泵入电路的水。


    # 电荷


    通过电路的水量（单位为升）就像是电荷（Q，单位为库仑）。


    # 电流


    单位时间内通过的水量（每秒）就像电流（I，单位为安培）。


    # 恒定电流


    我们可以通过水流类比来理解恒定电流和电荷：如果水流以每秒2升的速度通过，那么在3秒内通过了6升。如果电流是2安培，那么在3秒内通过了6库仑的电荷。对于恒定电流，$Q
    = I \times t$。


    对于变化的电流，公式推广为：


    ```

    Q = \int i(t) dt

    ```


    注意，如果电流 $i(t)$ 是随时间变化的，那么在 $0$ 到 $t$ 时间内的总电荷 $Q$ 为：


    ```

    Q = \int_{0}^{t} i(\tau) d\tau

    ```


    恒定电流在图中所示：


    ![](img/d1b4f05eead98e7b59e76deae28a6347_16_0.png)


    # 练习题


    - 3. 使用 MATLAB 计算 $2^{100}$，并用科学指数计数法写出（例如 $2.4 \cdot 10^{30}$）。©®

    - 4. 路灯开启了45秒。如果电流为0.75A，请使用 MATLAB 计算它们消耗了多少电荷。©®


