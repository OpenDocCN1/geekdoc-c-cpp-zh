    # 柱状图


    柱状图是将大量原始数据分组可视化的方便方法。例如，如果一个大班完成了一个实验并测量了电容上的以下电压：


    | Vc | 3.3 | 3.4 | 3.5 | 3.6 | 3.7 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 观测次数 | 3 | 12 | 34 | 25 | 9 |


    要绘制这种关系，请使用与 `plot` 命令相同的语法，但使用 `bar()`。按照习惯，水平数据在前，其后是垂直数据：


    ```

    v = 3.3:0.1:3;

