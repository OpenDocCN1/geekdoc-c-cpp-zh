    # 创建帮助文档


    你已经使用过内置函数的帮助功能，例如：


    ```

    help linspace

    ```


    你也可以在自己的函数中构建帮助文本。这是通过在函数声明的第二行（紧接声明下方）插入注释来实现。函数声明与第一行可执行代码之间的所有注释会在用户输入以下命令时返回到命令行窗口：


    ```

    help functionName

    ```


    其中 `functionName` 是函数声明中的函数名，与函数的名称相同。基于上一个示例：


    ```matlab

    function I = ISolveFunction(V, R)

    % ISolveFunction finds current voltage and resistance

    % I = ISolveFunction(V, R)

    ```


    ```matlab

    I = V./R; % this is Ohm''s Law V=I R solved for I

    ```


    如果将其保存为 `ISolveFunction.m`，用户输入命令。命令行窗口将返回：


    ```

    ISolveFunction finds current voltage and resistance

    I = ISolveFunction(V, R)

    ```


    注意程序内部添加的额外空行。MATLAB 会忽略空行，因此它们可以帮助将你的程序组织成逻辑块，例如此示例中的帮助区域和代码区域。


    # 练习题


    8. 创建带注释的函数 `F2C()`，将华氏度温度转换为摄氏度温度。它应该可以通过命令 `F2C(32)` 运行，例如这将返回 0。转换公式为 $C=\frac{F-32}{9}$。


    该函数应实现帮助功能；当用户输入 `help F2C` 时，命令行将返回以下内容：


    ```

    F2C returns a temperature in Celsius given a temperature in Fahrenheit.

    ```


    # 复杂的函数示例


    通过以下函数来提高你的编程能力。


    ## 示例：使用弧度将极坐标形式转换为复数


    电气工程中的复数通常以复极坐标形式给出，由幅度和可以是弧度或度的角度组成。这些在第 2 章第 49 页的“复数”节中介绍；例如 23.12（弧度）或 $23.45^{\circ}$（度）。MATLAB
    要求将复数转换为矩形式，即使用实部和虚部，如 $4+3j$ 或 $6\cos(45)-j\sin(12)$。第 2 章描述了如何使用以下公式将复数从极形式
    `mag*angle` 转换为矩形式 `real+j*imagpart`：


    ```matlab

    realpart = mag*cos(angle)

    imagpart = mag*sin(angle)

    ```


    一旦获得了数的实部和虚部，可以使用命令将它们组合成单个复数 `z`：


    ```matlab

    z = realpart + j*imagpart

    ```


    注意 MATLAB 中的 `cos()` 和 `sin()` 期望角度为弧度；如果你需要转换度角度，请使用 `cosd()` 和 `sind()` 函数。整个转换过程如下：


    ```matlab

    function z = polarRadian2Complex(magnitude, radians)

    % polarRadian2Complex assembles the magnitude and

    % angle parts of a complex number

    % into a single complex number.


    realpart = magnitude * cos(radians)

    impart = magnitude * sin(radians)

    z = realpart + j*imagpart

    ```


    要将输入 23.0 传入变量 x，将其保存为 `polarRadian2Complex.m` 并从命令行调用它，如下：


    ```matlab

    x = polarRadian2Complex(23,0.5)

    ```


    MATLAB 将响应：


    ```

    x = 20.1844 + 11.0268i

    ```


    > 在函数内部，输出变量名为 "z"，但从命令行调用它时使用的是完全不同的变量 "x"。这是函数的优势之一——使用函数的人不需要知道函数在内部是如何调用其变量的。


    ## 示例：给定截止频率绘制低通滤波器的响应


    信号与系统课程将开发以下描述低通滤波器的方程：


    H(f) = \frac{1}{1+j(f/f_o)}$


    在该方程中，f 是单位为 Hz 的输入频率，$f_o$ 是单位为 Hz 的截止频率。该滤波器设计用于通过低于 $f_o$ 的频率并阻挡高于它的频率。


    > 回想

    > 在函数内部，输出变量名为 "z"，但从命令行调用它时使用的是完全不同的变量 "x"。这是函数的优势之一——使用函数的人不需要知道函数在内部是如何调用其变量的。


    ### 问题

    创建一个名为 `lowpass` 的函数，接收一个截止频率。


    ### 解决方案

    由于函数接收 `fo` 并返回：


    ```matlab

    function lowpass(fo)

    % lowpass(fo) creates a Bode-style plot

    H = 1/(1+j(f/fo));

    ```


    接下来，计算 $H(f)$：


    ```matlab

    H = 1/(1+j(f/fo));

    ```


    找到整个转换过程如下：


    ```matlab

    H = 1/(1+j(f/fo));

    ```


    找到图形并标记它：


    ```matlab

    semilog(f)

    title(''Lowpass filter'')

    xlabel(''Frequency (Hz)'')

    ylabel(''Amplitude (dB)'')

    grid(''on'')

    ```


    将程序保存为 `lowpass.m` 并从命令行调用它，如下：


    ```matlab

    x = lowpass(100)

    ```


    MATLAB 将响应：


    ```

    x = 20.1844 + 11.0268i

    ```


