    A vector is simply list of numbers, e.g., [3, -2.4, π, √3, 7–j2]. It can hold
    any amount of numbers, including the special cases of 0 or 1 length. A 0-length
    vector is called a null or empty vector and holds nothing. A vector of length
    1 is simply a number, also known as a scalar.


