  - '[PAGE 157]


    A logical expression is a statement that evaluates to either "true" or "false."
    Relational operators are a type of logical operator, and compare two values such
    as 5 > 4 (true) or 3≤–4 (false). MATLAB returns a 1 to indicate true and 0 to
    indicate false. MATLAB has several types of relational operators; some of the
    most common are listed below:


    | Operator | Name | Example | Example result |

    |---|---|---|--|

    | > | Greater than | (5 > 2) | 1 |

    | < | Less than | 7 < -6 | 0 |

    | >= | Greater than or equal to | a=-5; a>=6 | 0 |

    | <= | Less than or equal to | a=7; b<=a+b | 0 |

    | == | Equal to | 5 == 5 | 1 |

    | ~= | Not equal to | 5 ~= 5 | 0 |

    | isequal() | Equal to, with strings, vectors, and matrices | a=''hello''; b=''Hello'';
    isequal(a,b) | 0 (capitalization matters) |


    Note that one of the most common relational statements, the test to see if two
    scalar numbers are the same, is not = but rather ==.


    In the example below, the function called password() tests to see if the input
    is "secret" and outputs a 1, if so, and 0, otherwise:


    ```

    function result = password(input)

    % password tests to see if the input is

    % the string ''secret''

