    # TECH TIP: ENGINEERING NOTATION


    Engineers use unit postfixes (a letter following a number) to express large or
    small numbers so that the mantissas are always between 1 and 1000. This is not
    scientific notation: 4.3 × 10⁻¹¹ in scientific notation is written in engineering
    notation as simply 43 p, for example. These postfixes are in ratios of 1000. Common
    ones used in our profession are shown below. Note: Capitalization matters! A 1
    MΩ resistor is extremely large; a 1 mΩ resistor is very small. Notice how the
    numerical parts of all the examples are between 1 and 1000.


    | Prefix | Name | Scaling | Engineering example | Scientific notation (do not
    use!) |

    |---|---|---|---|--|

    | p | pico | 10⁻² | 12 pF | 12 × 10⁻² F |

    | n | nano | 10⁻⁹ | -434 nV | -434 × 10⁻⁹ V |

    | μ | micro | 10⁻⁶ | 1.2 µA | 1.2 × 10⁻⁶ A |

    | m | milli | 10⁻³ | 150 mH | 0.15 H |

    | | | 1 | 36 H | 36 H |

    | k | kilo | 10³ | 13 kV | 13,000 V |

    | M | Mega | 10⁶ | 1 MΩ | 10⁶ Ω |

    | G | Giga | 10⁹ | 96 GB | 96 × 10⁹ B |

    | T | Tera | 10¹² | 2 TB | 2 × 10¹² B |


    As you get used to these postfixes spanning range will help you do mathematics
    spanning large intervals. For instance, a 12 µA current through a 4 MΩ resistor
    generates its product in voltage, which is 12×4 in units of μ (two up from the
    center) times M (two down from the center), which is simply 48 times the center,
    or 48V. No powers of 10 are required!'
