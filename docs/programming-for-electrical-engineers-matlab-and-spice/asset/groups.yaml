    和 $10.0\text{k}\Omega$。使用圆圈作为标记绘制这些值。对于水平轴，使用测量数字 1, 2, 3, 4 和 5。标记坐标轴并为图添加标题。


    # 专业提示：专业执照 (PE)


    正如医生和律师需要执照才能行医和执法一样，工程师也可以获得执照。获得执照的工程师被称为“注册工程师”（Professional Engineers），他们在名字后加上
    P.E. 字母，例如 John Doe。与法律和医学不同，大多数电气工程不需要执照（但这种要求变得越来越常见）。执照特别有帮助的职业：


    - 建筑与工程：只有 PE 可以认证某些类型的工程图。

    - 咨询：只有 PE 可以从事私人工程咨询，工程咨询公司要求员工中必须有最低比例的持证工程师。

    - 政府：成为 PE 是高级州级和联邦工程工作的共同要求。

    - 能源：大多数配电公司寻求 PE 来帮助他们认证电站规划。

    - 教学：某些州要求工程系确保其教职员工中有一定比例持证。


    执照要求因州而异，但典型的路径包括从四年制工程专业毕业、通过工程基础考试 (F.E.)、在 PE 的指导下工作4 年，然后通过 PE 考试。


