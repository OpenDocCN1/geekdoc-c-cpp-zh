    \ by 2 column matrix using the predefined columns C1 and C2, where C1 and C2 are\
    \ predefined to be column vectors of length 100.\n\n# CHANGING MATRIX VALUES\n\
    \n### Accessing and Changing Values in Matrices\n\nMatrices are addressed using\
    \ rounded parentheses; always in row, column order; and always using the convention\
    \ that the row and column index counts with 1. For example,\n\n```\nm = [-5 7\
    \ 2.4; 8 0 9]\nx = [-5 7 2.4; 8 0 9]\n```\n\nthen x = m(2,3)\nwill set the scalar\
    \ variable x equal to 9.\nm(2,3) = p1 creates the following matrix:\n\n```\n[-5\
    \ 7 2.4\n8 0 3.14159]\n```\n\n### Accessing and Changing Whole Rows and Columns\n\
    \nMuch like if\n\n```\nv = [-2 -4 -6 -8 -10], then\nv(2:4) returns\n[-4 -6 -8],\n\
    ```\nwe can address parts of matrices using the colon : operator.\n\nUsing the\
    \ example matrix m from the previous section, where m=\n\n```\nm(1:2, 1:2)\n[-5\
    \ 7\n 8 0]\n```\n\nreturns the square matrix.\n\nThe colon operator is even more\
    \ powerful than this. It can be used to specify an entire row or column using\
    \ the shortened form: m(:,). For example, to set x equal to the second row of\
    \ m, type:\n\n```\nx = m(2, :);\n[8 0 9]\n```\n\nNow x= set the first element\
    \ of m to (note how a single column of a matrix is a column vector), type:\n\n\
    ```\nm(:,1) = [1;2];\n[1 7 2.4\n2 0 9]\n```\n\nNow m=\n\n### Removing Elements\
    \ in Matrices\n\nSimilar to vector manipulation, remove chunks of matrices by\
    \ setting equal to the null matrix []. Note that you can delete any number of\
    \ whole rows or columns of a matrix, but unlike vectors, it does not make sense\
    \ to delete a single value; then the matrix would not be square or rectangular.\
    \ For example,\n\n```\nm(:,4) = []      deletes the fourth column\nm(2:3,:) =\
    \ []     deletes rows 2 and 3\nm(:,3:end) = []   deletes all columns except the\
    \ first two\nm(1:2:end,:) = [] deletes all odd-numbered rows\n```\n\n# PRACTICE\
    \ PROBLEMS\n\nUse the matrix m for these problems. You do not know what the elements\
    \ of m are, but you know it is a 2x2 matrix. Write the MATLAB command to\n\n-\
    \ 25. Create variable x and set it equal to the second row, second column value\
    \ of m.\n- 26. Set the second row, first column value of m to 0.\n- 27. Remove\
    \ the entire row of m.\n- 28. Replace the first column of m with random numbers\
    \ created using rand ().\n- 29. Create a vector v equal to the last column of\
    \ m.\n\n> PRO TIP: BUYING A CALCULATOR\n\nElectrical engineers in industry have\
    \ their own offices, and typically perform computations using MATLAB. But for\
    \ college students, one of the most important tools is the portable calculator.\
    \ Unlike most majors, ECE students must have calculators capable of handling complex\
    \ matrices to solve problems driven by sinusoidal sources; the TI-86 and below\
    \ will not do this, including the TI-84. Do not be misled into purchasing an expensive\
    \ instrument with many specialized engineering programs built into it; these are\
    \ rarely useful. A TI-89, TI-91, or higher, the newer Nspire series all work well.\
    \ The Nspire's document-centric nature is unique; some students prefer it but\
    \ see it as an abstraction that separates them from simply solving equations.\n\
    \nProgramming for Electrical Engineers\n\n# WORKING WITH MATRICES\n\n### Matrix\
    \ Size\n\nJust as the length() command can be used to determine how many elements\
    \ are in a vector, the size() command returns how many rows and columns are in\
    \ a matrix. For example,\n\n```\nx = [4 3; 2 -4; 5 7] (that is, x= [4 3; 2 -4;\
    \ 5 7])\n```\n\nthen the matrix dimensions can be found using\n\n```\n[rows, cols]\
    \ = size(x)\n```\n\nThis sets the variable rows to 3 and cols to 2. Note how size()\
    \ sets two variables at the same time. Since a vector is just a matrix with one\
    \ row or column, size() also works on vectors:\n\n```\nsize([10 20 30 40 50])\
    \ returns [1, 5] and\nsize([10; 20; 30; 40; 50]) returns [5, 1]\n```\n\n### Transpose\n\
    \nTransposing a real matrix interchanges rows for columns. Thus, the matrix on\
    \ the left in the example\n\n```\n4 3\n2 -4\n5 7\n```\n\nbecomes\n\n```\n4 2 5\n\
    3 -4 7\n```\n\nwhen transposed. The MATLAB command to do this is the apostrophe\
    \ '. For example, x = [4 3; 2 -4; 5 7] enters the matrix in the upper left, and\
    \ y = x' enters can also be used to change column vectors to row vectors. For\
    \ example, defining column vector\n\n```\nresistors = [10; 11; 12; 13; 15]\n```\n\
    \nis the same as defining the transpose of the row vector\n\n```\nresistors =\
    \ [10 11 12 13 15]'\n```\n\n### Matrix Mathematics\n\nMatrix mathematics using\
    \ the four basic operations of addition, subtraction, multiplication, and division\
    \ have special behaviors according to rules of matrix algebra. Addition and subtraction\
    \ operate on respective elements:\n\n```\n[1 5; 2 3] + [-1 6; 0 1] = [0 11; 2\
    \ 4]\n```\n\nHowever, as you learned with vectors, multiplication and division\
    \ between two matrices do not operate on respective elements using * and /. If\
    \ this needed, prefix the multiplication or division sign with a dot. For example,\
    \ [2 5; 0 3].[-1 3; 2 1] will work as expected, yielding [-2 4; 0 3]. Multiplication\
    \ and division work with the standard * / between a matrix and a scalar, where\
    \ it is understood each element of the matrix will be multiplied or divided by\
    \ that scalar. For example, [2 -3; 0 4]*2 yields [4 -6; 0 8].\n\n# PRACTICE PROBLEMS\n\
    \n- 30. What single MATLAB command will allow you to evaluate the expression below\
    \ given the vector of t values t=0:5?\ny = cos(t/2 + pi/4)/(t+1)\n\n# TECH TIP:\
    \ MESH AND NODAL ANALYSIS\n\nTechniques for solving complex circuits with many\
    \ resistors include Node Voltage Analysis and Mesh Current Analysis. These methods\
    \ are usually taught in circuit analysis, but at their core, they are a systematic\
    \ way of Ohm's Law, V = IR, repeatedly over circuit fragments. They create systems\
    \ of equations that can be solved simultaneously to find every voltage (Node Voltage\
    \ Analysis) or current (Mesh Current Analysis). The diagrams below show on the\
    \ left, a circuit, its voltage definitions, and the set of equations generated\
    \ by the Node Voltage method for its voltages; and on the right, the same circuit\
    \ with its currents defined, as well as the set of equations derived using the\
    \ Mesh method to find these currents. Beginning EE students should know the names\
    \ of these methods, but need not know how to apply them.\n\n![](img/d1b4f05eead98e7b59e76de28a6347_74_0.png)\n\
    \n![](img/d1b4f05eead98e7b59e76de28a6347_74_1.png)\n\nvoltage equations for above\n\
    \n3V1 - V - 2V3 = -16\n-3V1 + 7V2 - 2V3 = 0\n-3V1 + 3V2 + 5V3 = 30\n\ncurrent\
    \ equations for above\n6I1 - 2I2 - 3I3 = 10\nI2 = 2\n-3I1 - 3I2 + 9I3 = 0\n\n\
    # SOLVING SIMULTANEOUS EQUATIONS USING MATRICES\n\nFor the various $V_1$, $V_2$,\
    \ and $V_3$ in the following set of equations:\n\n```\nV_1 + 2V_2 + V_3 = 5\n\
    3V_1 - V_2 + 2V_3 = 2\n-V_1 + V_2 - 2V_3 = -4\n```\n\nTo do this create an **A**\
    \ matrix with the coefficients of the unknown voltages and a **b** column vector\
    \ with the values to the right of the equals sign, as follows:\n\n```\nA = [1\
    \ 2 1; -1 2; -1 2]\nb = [5; 2; -4]\n```\n\nThe solution is (note the backwards\
    \ division sign):\n\n```\nV = A\\b\n```\n\nWhen using nodal and mesh methods to\
    \ analyze the response of circuits containing **capacitors** and **inductors**,\
    \ you will solve sets of complex matrices. There is no difference as far as MATLAB\
    \ is concerned; the **A** matrix will have complex values such as for this example\
    \ solving for complex currents:\n\n```\nA = [1j 2-j; -3+3j]\nb = [j; 2-j]\nI =\
    \ A\\b\n```\n\nOn a vintage 2012 computer, MATLAB can solve a set of 100 equations\
    \ in under 1 ms—less than time to depress the Enter key.\n\n![](img/d1b4f05eead98e7b59e76de28a6347_75_0.png)\n\
    \nMatrices can solve more than simultaneous equations for circuit analysis; they\
    \ are essential to manipulating video, rotating photos, providing equalization\
    \ to audio streams, finding particular frequencies present in signals, controlling\
    \ motors, and are the discrete mathematics counterpart of integration and differentiation.\n"
  mdcn: "\n\n# 练习题\n\n编写 MATLAB 命令来生成以下矩阵：\n\n- 20. 第一行包含 -2 和 3，第二行包含 100 和 0 的矩阵。\n\
