  md: '

    study a decade earlier, and it was found then that renewable energy sources would
    not be as profitable as the company in the foreseeable future. The employee argues
    that the study''s goal was fundamentally flawed: that the decision did not solely
    rest on profitability, but that ethical responsibility to reduce carbon emissions
    should also play a role. The five-step method of David Jonassen with the NSPE
    Code of Ethics should be used to analyze the situation from the viewpoint of the
    new hire and from the viewpoint of the company''s board of directors. Which viewpoint
    do you find more compelling?


    Use the five-step method of David Jonassen with the NSPE Code of Ethics to analyze
    the following, unfortunately realistic, situation an engineer may encounter.


    You are an electrical engineer working for a defense contractor. Your team is
    completing work on the guidance control system for any anticircraft missile defense
    system. Early testing showed that under certain situations the guidance could
    malfunction, resulting in unstable missile flight over friendly airspace. The
    guidance control system was modified to maintain controlled flight in that particular
    situation. Although the system now passes all tests, you believe the earlier failures
    may point to a deeper problem with the guidance system, given the right test conditions
    could again lead to loss of missile flight control. However, you never be sure
    of this; all you know is that the system redesigned to successfully pass the limited
    number of flight scenarios proposed at the project outset. When you present your
    concerns to the company management, they assure you that all tests show that the
    missile is safe and that further testing would not only be unnecessary but would
    lead to extremely costly penalties for failing to produce the device on the contract
    deadline and may jeopardize the division''s (and therefore your job''s) existence.
    They hint that if you fail to approve the system, you may be replaced with a coworker
    who would be more willing to approve the project.


    You feel torn between your duties to your coworkers, your employer, and the military
    personnel who will be relying on this technology. You do not know if your concerns
    are valid without months of additional simulations. What do you do?


