  - '[PAGE 155]


    # PRO TIP: GRADUATE STUDIES IN EE


    # Masters


    There are two types of master''s degree programs: industrial and research. This
    is confusing since there are no standardized names for each type of program. Some
    universities offer both, while others offer only one of the two. Some call one
    degree a Masters of Science (M.S.) and the other a Masters of Engineering (M.Eng.),
    while some programs call both an M.S. Examining the graduation requirements will
    make clear which course(s) a particular university offers.


    +   Industrial M.S.: Industrial M.S. programs prepare students for jobs in industry.
    They typically require 8–10 classes. A thesis, if required, is small, i.e., the
    equivalent of one or two courses. It takes one full year to complete, with the
    associated cost of tuition.


    +   Research M.S.: This prepares the student for a research position and is the
    first step in earning a doctorate. Coursework varies widely, as little as three
    courses to as much as required for an industrial masters. A thesis is mandatory
    and is a major component of the work. It takes longer than an industrial masters,
    18–24 months. This is often not a separate degree program but part of a doctoral
    degree program, so tuition cost may be waived in return for work as a Teaching
    Assistant (TA) and Research Assistant (RA), desccribed below.


    # Doctorate


    Engineering doctorate degree programs are usually sponsored fully through a mix
    of Teaching Assistantships (TAs)'
  - '[PAGE 156]


    and Research Assistantships (RAs), which typically provide tuition remission and
    a modest stipend to pay for food and basic accommodations.


    In the first year, the student usually works as a TA and teaches undergraduate
    students. During this year, the doctoral candidate is expected to seek longer-term
    funding from professors as an RA. This is done by visiting research labs whose
    work the student finds appealing. If the student and the principal investigator
    (or PI, the laboratory''s lead professor) think they may be a good match (i.e.,
    the PI believes the student will be an asset to the laboratory, and the student
    enjoys the type of research work, likes the other RAs, and trusts the professor),
    then the student begins part time in the laboratory as a trial run. After a semester
    of this, it should be clear if the lab is a good fit for the student, and the
    PI will offer an RA to the student. This will allow the student to drop the TA,
    keep the tuition waiver, and now be paid to do the research that is required by
    his or her thesis. The PI becomes the student’s primary research advisor.


    A less-common, but more prestigious, type of funding is a fellowship. A doctoral
    student holding a fellowship receives tuition remission and a stipend comparable
    to that of an RA, but the source of funding for the fellowship comes from an outside
    agency, rather than from the PI who funds the RA. This makes students with fellowships
    very desirable for PIs, who no longer to pay for their tuition and stipend.'
