    $v_i(t)$ 和 $v_o(t)$，标记坐标轴并创建图例。使用尽可能多的点来生成平滑图。


    # 散点图


    散点图的数据与折线图类似，但它们不是用线条连接每对 $(x,y)$ 数据，而是用标记标记点本身。在绘制离散值时，通过线条进行线性插值可能并不合适。创建散点图使用与
    `plot` 相同的语法，但使用以下符号：


    | 符号 | 缩写 |

    |---|---|

    | * | ''*'' |

    | o | ''o'' |

    | x | ''x'' |

    | + | ''+'' |

    | Δ | ''^'' |

    | □ | ''s'' |


    为测量的电阻 $r = [5:6]$ 的五个元件 $x = [1:5]$ 创建散点图，使用以下代码：


    ```

    x = 1:5;

    r = [5:6];

    plot(x,r,''o'')

    ```


    ![](img/d1b4f05eead98e7b59e76deae28a6347_105_0.png)


    # 装饰散点图


    之前通过 `plot()` 学习的指定标记颜色、标题、轴标记和网格的技巧也适用于散点图（现在 `color` 指定的是标记颜色而非线条颜色）。你还可以用 `markersize`
    关键字指定标记大小。例如，可以使用以下命令将上一页的图改为：


    ```

    plot(x,r,''^'',''color'',[1 0.5 0],''markersize'',25)

    ```


    ![](img/d1b4f05eead98e7b59e76deae28a6347_106_0.png)


