    bar(v,n)

    ```


    ![](img/d1b4f05eead98e7b59e76deae28a6347_112_0.png)


    用于装饰线条图的相同技术也适用于柱状图。例如，之前的图表可以使用 `title()`、`xlabel()` 和 `ylabel()` 应用标题和轴标签，或者可以使用
    `axis()` 命令更改轴缩放以消除图表右侧的空白。


