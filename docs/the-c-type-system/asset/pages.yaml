    \ MusicTrack\n{\n    public MusicTrack(string artist, string name)\n        =>\
    \ (Artist, Name) = (artist, name);\n\n    public string Artist { get; }\n    public\
    \ string Name { get; }\n\n    public override bool Equals(object? obj)\n     \
    \   => obj is MusicTrack other &&\n           this.Artist == other.Artist &&\n\
    \           this.Name == other.Name;\n}\n```\n\nListing 5-11: Overriding the Equals\
    \ method\n\nBecause we’re customizing the implementation of an inherited virtual\
    \ method, we use the override keyword, and the method’s signature must match the\
