  md: "# Mutable By-Reference Parameters\n\nBy default, method parameters are value\
    \ parameters, meaning that arguments passed to them are passed by value, regardless\
    \ of the argument’s type. In this section, we’ll look at the mutable by-reference\
    \ parameters, ref and out, which cause arguments to be passed instead by reference.\n\
    \nValue type instances and references can both be passed by reference by using\
    \ the ref or out modifiers, so it’s important to understand that by-reference\
    \ parameters are different from reference type value parameters. When we pass\
    \ a reference as an argument to a reference type value parameter, the same object\
    \ instance is referenced by both the argument and parameter variables, and any\
    \ change to the instance is visible via either variable. A by-reference parameter,\
    \ in contrast, is an alias for the value of the argument variable, whether that\
    \ value is a reference or value type instance.\n\nThe presence of a ref or out\
    \ modifier on a parameter means that when we call the method, the address of the\
    \ argument’s value is passed rather than a copy of the value. This extra level\
    \ of indirection means that regardless of the argument’s type, both the caller\
    \ and the method directly access the same value. If the argument’s value is a\
    \ reference, we can change it to refer to a new instance or assign null to it,\
    \ and that change is visible via both the argument and the parameter variables.\n\
    \nTo illustrate the difference between reference variables and by-reference parameters,\
    \ consider Listing 3-5, where we pass a reference by value to the AutoAppend method\
    \ that attempts to change its name parameter.\n\n```\npublic void AutoAppend(string\
    \ name, string extension)\n{\n    if(!name.EndsWith(extension))\n        name\
    \ += extension;\n}\n\nvar saveName = \"Alfred\";\nAutoAppend(saveName, \".docx\"\
    );\n\nAssert.That(saveName, Is.EqualTo(\"Alfred.docx\"));\n```\n\nListing 3-5:\
    \ Creating a new instance versus changing an instance\n\nThis test fails, even\
    \ though string is a reference type. Although the += operator appears as though\
    \ it’s mutating the string, it actually creates a new string with the updated\
    \ contents and returns a new reference to it. The new reference and instance are\
    \ visible within the AutoAppend method but not outside it. The original string\
    \ is unchanged.\n\nThe AutoAppend method isn’t changing the shared string instance,\
