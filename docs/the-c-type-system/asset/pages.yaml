  md: "It makes no difference whether Speed is a reference type or a value type. Passing\
    \ a ref or out argument is essentially passing the address of the argument, and\
    \ we can’t pass the address of a nonvariable.\n\n# Overloading on By-Reference\
    \ Parameters\n\nBy-reference parameter modifiers are part of the signature of\
    \ a method. A reference or output parameter is effectively a different type than\
    \ its value parameter equivalent. If we have a method that takes a ref parameter,\
    \ we can overload it with a method that takes that parameter by value.\n\nMethod\
    \ overloads can have different return types, so we can write a method that takes\
    \ its parameters by value and returns a new object, and overload it with a version\
    \ taking a ref parameter that modifies the object in place, as shown in Listing\
    \ 3-12.\n\n```\npublic Speed Increment(Speed initial, double amount)\n    => new\
    \ Speed { InMetersPerSecond = initial.InMetersPerSecond + amount };\n\npublic\
    \ void Increment(ref Speed initial, double amount)\n    => initial.InMetersPerSecond\
    \ += amount;\n```\n\nListing 3-12: Overloading on by-reference modifiers\n\nWhen\
    \ we call the Increment method, the compiler selects the correct overload based\
    \ on whether we modify the Speed argument with the ref keyword to pass it by reference\
    \ or omit the modifier to call the version with a value parameter.\n\nWe can’t,\
    \ however, overload a method when the only difference is the kind of by-reference\
    \ modifier for its parameters, as we try to do in Listing 3-13.\n\n```\npublic\
    \ void Increment(ref Speed initial, double amount)\n    => initial.InMetersPerSecond\
    \ += amount;\n\npublic void Increment(out Speed initial, double amount)\n    =>\
    \ initial = new Speed { InMetersPerSecond = amount };\n```\n\nListing 3-13: Overloading\
    \ on different modifiers\n\nThis might seem an arbitrary restriction. After all,\
    \ calling code must differentiate between passing a ref argument and passing an\
    \ out argument. However, the compiler rejects this overload because the Common\
    \ Language Infrastructure (CLI) has no way to distinguish between ref and out\
    \ in the method signature. Both are just by-reference parameters, so the two overloads\
    \ have the same signature, as far as the CLI is concerned, resulting in ambiguity.\n\
    \nThe same restriction applies with in parameters, which we cover in “Read-Only\
    \ References and Returning by Reference” on page 92. As with ref and out parameters,\
    \ an in parameter is simply another kind of by-reference parameter, as far as\
    \ the CLI is concerned."
