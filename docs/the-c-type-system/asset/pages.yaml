- pgno: 250
  md: "arises as a result of the first: it makes little sense for a value type to\
    \ be fully abstract, since a defining feature of value and value-like types is\
    \ that we compare them according to the value they represent. It follows, then,\
    \ that value types are concrete types. The built-in value-like class string leads\
    \ the way with this advice, which is why string is intentionally a sealed class.\n\
    \nSimilar to strings, records are reference types that have value semantics for\
    \ the purpose of comparisons with Equals. Unlike strings, records can inherit\
    \ from other records, but just as when we derive from a concrete class, a derived\
    \ record inherits all the base record’s behavior. Therefore, we must still take\
    \ care to uphold the base record’s promises in a derived record; however, as with\
    \ classes, doing so isn’t always as simple as it might seem. Even though records\
    \ permit inheritance, they’re specifically intended to model value types, so the\
    \ advice to seal value types applies equally to them.\n\n# Inheriting Record Types\n\
    \nWhen compiled, a record type is a class with some compiler-generated methods,\
    \ including everything required for value-based equality. Moreover, records defined\
    \ using the positional syntax are immutable by default.\nUsing records instead\
    \ of classes for creating value-like types, then, saves us from having to write\
    \ a lot of boilerplate code.\n\nRecords, unlike structs, can inherit from other\
    \ records, although they can’t be part of an inheritance relationship with a class.\
    \ We might therefore recast our Color and TranslucentColor types as records, as\
    \ in Listing 7-12.\n\n```\npublic record Color(int Red, int Green, int Blue);\n\
    \npublic record TranslucentColor(int Red, int Green, int Blue, int Alpha)\n  \
    \  : Color(Red, Green, Blue);\n```\n\nListing 7-12: Inheriting record types\n\n\
    Here we define Color and TranslucentColor as positional records with positional\
    \ parameters that represent read-only properties with those names, and a constructor\
    \ taking parameters of the same type. The inheritance syntax for records differs\
    \ slightly from that for classes because we need to initialize the positional\
    \ parameters in the base record. The TranslucentColor record derives from Color\
    \ and passes its Red, Green, and Blue parameter values to the respective positional\
    \ parameters of Color.\n\nAs we explored in Chapter 5, the compiler generates\
    \ the implementations of the constructor and properties for us, along with implementations\
    \ for various overrides of Equals and a few methods, including a value-based implementation\
    \ of GetHashCode, ToString, and others. Equality comparisons between record variables\
    \ compare the value of each property, so two record variables are equal if all\
    \ their properties are equal.\n\nWe can write our own implementation of the type-safe\
    \ Equals method created by the compiler if we wish. However, the implementation\
    \ of Equals provided by the compiler is specially crafted to take inheritance\
    \ into account."
