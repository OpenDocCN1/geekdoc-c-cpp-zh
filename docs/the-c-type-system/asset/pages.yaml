- pgno: 346
  md: '# DISCOVER THE VALUE IN VALUE TYPES


    ![](img/47f0004b0ac0322f285ca59a19bca333_346_0.png)


    The type system is the foundation upon which all C# programs are built. The C#
    Type System will show you how to define and implement value types effectively,
    and write more performant and robust code. Real-world code examples and test cases
    throughout will elevate your programming with C# and show you how best to implement
    the principles you’re learning.


    Among the core aspects of working with the type system, you’ll learn:


    +   - How user-defined value types, and even simple types, can enhance your code’s
    readability

    +   - How reference and value types differ within C#

    +   - How method parameters and arguments relate to reference and value types

    +   - How differences in copy semantics between value and reference types affect
    a program’s behavior

    +   - How the different methods of value comparisons for equality work behind
    the scenes


    +   - The unique characteristics and roles of various types in an application,
    especially how value types go beyond mere data storage

    +   - Why inheritance isn’t optimal for value types

    +   - How to measure and evaluate the performance of an app’s use of different
    data types


    Whether you’re a novice or seasoned programmer, you’ll find *The C# Type System*
    indispensable in your efforts to turn good code into great.


    # ABOUT THE AUTHOR


    Steve Love is a professional developer with over 20 years of experience using
    C# in a wide range of industries, including logistics, public services, and finance.
    He is the editor of C Vu, the members’ journal of the ACCU (https://accu.org/),
    as well as a frequent speaker at conferences.


    Covers: C# 10 (.NET 6) and higher


    ![](img/47f0004b0ac0322f285ca59a19bca333_346_1.png)'
