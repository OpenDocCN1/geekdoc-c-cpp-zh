  md: 'Although the headline time for the Purchase.Equals method is almost identical
    in each case, the SequenceEqual method using the record struct in Table 8-19 is
    considerably slower than for the record in Table 8-18. Record structs can’t take
    advantage of the simple reference identity optimization available to records,
    although many of the calls to Product.Equals will have been inlined by the JIT
    compiler. The result is that we see the extra cost of having to copy the record
    struct values and compare their fields in SequenceEqual, rather than Purchase.Equals.


    # Measuring the Compiler-Generated Equals Method


    The positional record struct syntax used in Listing 8-18 for the Purchase and
    Product types makes their definition compact, but that comes with minor, although
    measurable, efficiency compromises. The type-safe Equals method implementing the
    IEquatable<T> interface for records and record structs is generated by the compiler,
    whether or not they use the positional syntax. While convenient, that’s not necessarily
    the most efficient implementation. When we’re working with many objects, it can
    be worth our while to write our own Equals method for record and record struct
    types, in which case the compiler won’t generate one for us.


    You saw in Chapter 5 that the compiler inserts code to obtain the default EqualityComparer
    object for each field. For example, Listing 8-21 shows roughly the Equals method
    created by the compiler for the Purchase record struct in Listing 8-18.


    ```

    public bool Equals(Purchase other)

    => EqualityComparer<Product>.Default.Equals(_Item_field, other._Item_field) &&

    EqualityComparer<DateTime>.Default.Equals(_Ordered_field, other._Ordered_field)
    &&

    EqualityComparer<int>.Default.Equals(_Quantity_field, other._Quantity_field);

    ```


    Listing 8-21: A record struct’s Equals method


    The real names of the backing fields assigned by the compiler are invalid in regular
    C#, so there’s no chance they could clash with any of our own identifiers; the
    names used here merely illustrate the idea. Despite using the backing fields directly
    rather than accessing the properties to perform the comparisons, obtaining the
    default EqualityComparer implementation for each field on every call to Equals
    could impair efficiency. Table 8-20 shows the profiler output when using the SequenceEqual
    method to compare two lists of 10 million Purchase record struct objects.'
