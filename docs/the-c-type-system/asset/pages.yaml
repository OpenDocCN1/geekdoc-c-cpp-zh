- pgno: 222
  md: "Well-encapsulated types aid us in reasoning about code because we can always\
    \ be sure that private fields have consistent values, and that those values can\
    \ never change without our knowing about it. More than that, it means that, as\
    \ designers, we can change the underlying representation without changing the\
    \ interface. If we never directly expose a type’s data, no code other than that\
    \ type’s member instance methods can ever depend on its representation.\n\nBy\
    \ encapsulating the double amount field of Speed as private and exposing or operating\
    \ on it only under the controlled conditions afforded by member methods and properties,\
    \ we limit the scope and impact of changing the representation to just those members.\n\
    \nCorrespondingly, if we limit the number of members with direct access to a field,\
    \ we reduce the scope of the change even further. If we write methods that depend\
    \ only on the public interface of Speed, they’ll continue to work even if we change\
    \ the underlying data type.\n\n# Extending the Interface\n\nIf we add too many\
    \ instance methods to any type, we risk cluttering its interface. The core interface\
    \ of a type is harder to discover when the type has methods that are only occasionally\
    \ useful. By contrast, keeping the methods of a type to a reasonable minimum makes\
    \ the code easier to understand.\n\nOne alternative to instance member methods\
    \ is to use extension methods, which are defined outside the type they extend.\
    \ An example extension method for Speed is shown in Listing 6-13, where the WithPercentAdded\
    \ method uses the public methods and properties defined in Speed to create a new\
    \ Speed with a different value.\n\n```\npublic static class SpeedExtensions\n\
    {\n    public static Speed WithPercentAdded(this Speed speed, double percent)\n\
    \        => Speed.FromMetersPerSecond(speed.InMetersPerSecond +\n            percent\
    \ / 100 * speed.InMetersPerSecond);\n}\n\nvar start = Speed.FromMetersPerSecond(100);\n\
    var end = start.WithPercentAdded(25);\n\nAssert.That(end.InMetersPerSecond, Is.EqualTo(125));\n\
    ```\n\nListing 6-13: Extending the interface of Speed\n\nThe WithPercentAdded\
    \ method doesn’t modify the instance of Speed passed to it—it can’t, because Speed\
    \ is a read-only struct. Instead, we return a new instance of Speed with the desired\
    \ value. An extension method must be defined in a static class, so it’s always\
    \ a static method. It’s common to group methods that extend a particular type\
    \ together in one static class definition, so the SpeedExtensions class might\
    \ include several methods to extend the interface of Speed."
