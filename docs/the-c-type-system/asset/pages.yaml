    As an object-oriented programming (OOP) language, C# has good support for features
    that allow us to capture complex ideas and express them intuitively, such as classes,
    virtual methods, and inheritance. However, the language support for inheritance
    doesn’t extend to value types. Structs and record structs implicitly derive from
    the ValueType class, which is derived directly from object, but they can’t inherit
    any other type and can’t themselves be inherited; that is, structs and record
    structs are implicitly sealed. Inheritance is a central feature of OOP that enables
    us to treat a reference to a derived class as though it refers to the base class,
    overriding the base class’s properties and methods to have new behavior as needed.
    These features don’t apply to value types, but that doesn’t mean value types are
    inferior.


    Using the term polymorphism interchangeably with inheritance is common, but polymorphism
    is a more general concept; it relates to writing'
