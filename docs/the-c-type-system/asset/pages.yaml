  md: "If we use a class or record instead of a struct or record struct, we can prevent\
    \ default values and force our users to specify the correct units when creating\
    \ instances. However, classes and records are both reference types, meaning that\
    \ variables can have a null value. We can mitigate that in C# v8.0 and later by\
    \ taking as much advantage of non-nullable references as we can, although that\
    \ might not prevent every possible misuse.\n\nNotwithstanding that, when we’re\
    \ deciding between a class or record to model a type that has value-like characteristics,\
    \ a record is almost always preferable. Records are specifically intended to define\
    \ types that have value semantics, and the compiler provides the default equality\
    \ behavior for records based on the state of the instances being compared.\n\n\
    # Implementing Custom vs. Generated Behavior\n\nIf we want a class to have value-based\
    \ equality, we must define it ourselves. As a minimum, we should override the\
    \ Equals(object?) and GetHashCode methods, but, as you saw in Chapter 5, a more\
    \ complete definition includes implementing the IEquatable<T> interface and overloading\
    \ operator==, and its companion operator!=, to make equality comparisons natural\
    \ and easy.\n\nFor most value-like types, implementing those methods is straightforward\
    \ as long as we’re careful to avoid common mistakes. However, if we use record\
    \ instead of class, the compiler generates implementations for all those methods.\
    \ This makes a record type definition smaller and easier to comprehend and saves\
    \ us from having to remember all the potential pitfalls.\n\nFor our prospective\
    \ Temperature type, we might consider a positional record, saving us the trouble\
    \ of a complete definition. A provisional implementation of Temperature as a positional\
    \ record might look like the definition in Listing 6-15, but positional records\
    \ have limitations to take into account.\n\n```\npublic sealed record Temperature(double\
    \ InCelsius)\n{\n    public static Temperature FromCelsius(double val)\n     \
    \   => new Temperature(val);\n\n    public double InFahrenheit => InCelsius *\
    \ 1.8 + 32;\n    public static Temperature FromFahrenheit(double val)\n      \
    \  => new Temperature((val - 32) / 1.8);\n};\n```\n\nListing 6-15: A positional\
    \ Temperature record\n\nThe compiler uses the parameters of Temperature’s definition\
    \ to automatically generate a property named InCelsius, but we must write our\
    \ own InFahrenheit property so we can add the code to perform the conversion.\
    \ Users can invoke the class factory methods to create Temperature instances with\
    \ different units, but the constructor for Temperature generated by the compiler\
    \ is public. The generated constructor also won’t validate its parameters, and\
    \ we might want to ensure that a Temperature can’t be below absolute zero."
