- pgno: 63
  md: '# Static fields


    These fields are associated with a type, rather than individual instances of the
    type. The lifetime of a static field is normally tied to an application, so the
    instances associated with static fields are usually released when an application
    exits.


    # Array elements


    Individual elements in an array are all variables. We can access a particular
    element by its index and alter the element instance if it is mutable.


    # Method parameters


    The parameters in a method definition are technically called formal parameters
    but are commonly known as just parameters. A parameter’s scope is the body of
    the method, exactly as if the parameter were declared as a local variable within
    the method’s body. In code that calls a method, we pass actual parameters, better
    known as arguments, that correspond to the method’s parameters.


    Regardless of its kind, a variable always has an associated type. This might be
    an explicitly declared type, as in the declaration int size, or, for local variables,
    the type might be implied with the var keyword. If the variable’s type is a reference
    type, the variable’s value is a reference. A non-null reference is a handle to
    an instance somewhere on the heap. If the variable’s type is a value type, the
    variable’s value is an instance of the type.


    # Variables vs. Values


    It’s not always easy to intuit what counts as a variable and what counts as a
    value, but the distinction is important:


    +   - Variables can be assigned to, although a readonly field variable can be
    assigned only within a constructor of the type of which it is a member, or using
    field initialization (which we’ll discuss in “Field Initializers” on page 58).

    +   - Values are the results of expressions—such as the result of calling new,
    the return value from a method, or a constant expression such as a literal number
    or string literal. Values can’t be assigned to, but we use them to initialize
    variables by using assignment or passing them as arguments to method parameters.


    Variables, for the most part, have names. Strictly speaking, individual array
    elements don’t have their own names, but for an array variable arr, the expression
    arr[index] is essentially the element’s identifier. A value can have a name but
    doesn’t require one: the expression 2 + 2 produces a new value, but it is anonymous
    unless we assign that value to a variable.


    The type of a value defines what an instance looks like. Among other things, the
    type might have multiple fields that need space allocated in memory when an instance
    of the type is created. The type of a variable defines the sort of value it can
    contain.'
