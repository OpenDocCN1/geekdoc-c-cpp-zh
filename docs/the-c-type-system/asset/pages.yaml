    # Controllers


    Controllers are the task objects in a system: they do things. Entities and controllers
    generally cooperate to perform activities. Controllers are often also persistent
    and may have some state, which is usually related to their collaborations with
    other objects. Controllers are frequently employed to mediate the interactions
    between entities and services.


    These are the application roles that define the behavior of a specific design
    and solution domain. These four are common in most systems, although not all applications
    will use or need all of them. Other categories of objects—such as collections,
    lifetime managers, and exceptions—have supporting roles in an application rather
    than being design elements in a system.


    Values in C# are usually represented by structs, records, or record structs, although
    they can be modeled using classes, as you’ve seen with string. Each of the other
    roles will almost always be fulfilled by a class. Up to this point, the term object
    has been reserved for reference type instances. If we consider a value to be another
    kind of object, we have a common and uniform basis for comparing the characteristics
    of all the objects in an application.


    The characteristics of a particular object, then, suggest the role it’s fulfilling.
    Put another way, we can identify an object’s role by looking at the characteristics
    of that object’s implementation.


    # Object Characteristics


    The three non-value roles—service, entity, and controller—are strongly behavioral
    in the sense that we use them to perform operations or tasks. By contrast, values
    tend to have a passive role in a system and are generally used by other objects.


    Behavior is one of three main characteristics shared by all objects in a system,
    as described by Grady Booch and his coauthors in Object-Oriented Analysis and
    Design with Applications (Addison-Wesley, 2007). The other two primary characteristics
    are state and identity (see Figure 6-1), and the importance of each relative to
    the others is different for every application role.


