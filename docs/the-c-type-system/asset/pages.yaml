    # Listing 8-4: Storing byte fields for color components


    We still allow int arguments to the Color constructor so that our users won’t
    have to explicitly cast the arguments to byte when creating Color values. Casting
    the int values explicitly to byte has the same effect as the masking operations
    we used in Listing 8-3: the value is truncated to just the lowest 8 bits. If we
    use this version of Color in the test to produce a HashSet from Listing 8-3, the
    results are quite different. Table 8-2 shows just the call tree for AddIfNotPresent.


    # Table 8-2: Profile Report of Adding Objects with byte Fields to the HashSet


    | Method | Time (ms) | Signature |

    |---|---|---|

    | 99.9% AddIfNotPresent | 7,494 | System.Collections.Generic.HashSet`1.AddIfNotPresent(T,
    out Int32) |

    | 39.6% Equals | 2,967 | System.ValueType.Equals(Object) |

    | 8.66% [Garbage collection] | 650 | |

    | 0.16% [Thread suspended] | 12 | |


    We see a dramatic change in the execution profile of the code, with the AddIfNotPresent
    method taking well over seven full seconds to complete. Comparing this report
    to Table 8-1, we can see clearly that the main reason for the extra time is the
    Equals method inherited by Color from the ValueType base class.


    In some instances, ValueType.Equals can perform a very fast bitwise comparison,
    but with several caveats: this comparison can’t be used if any field is a reference,
    a floating-point number, or a type that itself overrides Equals. Two different
    reference values could refer to objects of a type with its own Equals method,
    and a bitwise comparison would compare them as not equal, even if Equals would
    return true. For the same reason, any value type with its own Equals method could
    use that method to compare some values with different bit patterns as equal. Two
    floating-point numbers with matching bit patterns aren’t necessarily equal; in
    particular, if both values are NaN, they shouldn’t compare equal.


    Another condition for the fast comparison to be used is that a struct must be
    tightly packed, meaning its fields don’t require any padding to be properly aligned
    in memory. The three int fields in the original implementation of Color would
    automatically be aligned in memory. However, using byte instead means the fields
    aren’t tightly packed, so we must use another, much slower comparison, with the
    substantial performance penalty shown in Table 8-2.'
