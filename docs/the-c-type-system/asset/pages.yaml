    # Boxed Method Parameters


    A value will be automatically boxed when we pass it to a method that takes an
    object or other reference type parameter. The effects are the same as assigning
    directly to an object variable, as we did in Listing 5-19, but the box is less
    obvious in our code.


    Consider Listing 5-21, where we pass the same value twice to the object .ReferenceEquals
    method, which takes two object parameters and compares them for identity equality.


    ```

    Color x = new Color();


    Assert.That(object.ReferenceEquals(x, x), Is.False);

    ```


    Listing 5-21: Passing values as boxed arguments


    This test asserts that the two arguments to ReferenceEquals are not equal. Should
    the test pass?


    Yes, it should. The arguments to ReferenceEquals are different object variables.
    Passing a value type as an argument to an object parameter boxes the value. Even
    though the same value is passed to both parameters, each argument is boxed separately,
    resulting in two independent boxes. The outcome is identical to explicitly boxing
    the same value into separate object variables, like this:


    ```

    object a = x;

    object b = x;


    Assert.That(object.ReferenceEquals(a, b), Is.False);

    ```


    The value of x is explicitly boxed into two separate object references. The call
    to ReferenceEquals is equivalent to a == b, and they do not compare equal because
    they’re different objects.


    Compare Listing 5-21 with the following, where we explicitly box the value to
    an object variable before calling ReferenceEquals:


    ```

    object x = new Color();


    Assert.That(object.ReferenceEquals(x, x), Is.True);

    ```


    We pass the same reference for both arguments to ReferenceEquals, so they compare
    equal. The call to ReferenceEquals in this instance is identical to the expression
    x == x, and the x variable is a reference to a boxed Color, as shown in Figure
    5-3.'
