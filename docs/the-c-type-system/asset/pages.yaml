    # Nonstandard Operator Behavior


    Occasionally, arithmetic operators are useful beyond truly arithmetic operations.
    For example, string instances can be “added” together, and most programmers understand
    that adding two strings concatenates them, so "key" + "board" becomes "keyboard".
    In arithmetic, addition is commutative, so a + b gives the same result as b +
    a. This clearly isn’t true when used with string instances, but concatenating
    two strings with + is a widely used and accepted convention.


    When we bend the rules this way, it’s especially important that we’re mindful
    of conventions, natural usage, and expectations. For instance, in arithmetic the
    ability to add numbers together goes hand in hand with the facility for subtraction.
    Consider what subtracting one string from another might mean. Would it remove
    all instances of the right-hand argument from the left-hand string? Only if it
    appeared at the end of the string? String subtraction doesn’t have the natural
    and conventional appeal that string addition/concatenation does.


    We’d normally expect to find a symmetry between + and -, and symmetry is usually
    a desirable quality. When we overload ==, the compiler insists that we also implement
    the != operator. Coupling addition with subtraction for string values is one example
    where symmetry is undesirable, because it introduces conflicting expectations.


    Symmetry is inappropriate in other situations too. For example, matching every
    property get accessor with a corresponding set is superficially attractive but
    contradicts the recommendation that value types are immutable. This is another
    instance where we need to apply our own judgment on whether symmetry is a positive
    characteristic.


    # Summary


    > It''s not hard to make decisions when you know what your values are.

    > —Roy Disney, American film writer and producer


    Although C# has its own definition of ValueType, the broader concept of a value
    isn’t specific to C#. That more general idea of a value type has commonalities
    with the C# definition, but notable differences exist.


    The language definition of a value type focuses mainly on the memory requirements
    and behavior associated with structs. We need to take other factors into account,
    however, in order to decide when and how to introduce values into our programs.
    In this chapter, we’ve explored some of those considerations by contrasting values
    with reference types—in particular, by examining how values fulfill specific and
    important roles in a program.


    Object-oriented systems are made up of several kinds of objects with varying emphasis
    on the characteristics of identity, state, and behavior.'
