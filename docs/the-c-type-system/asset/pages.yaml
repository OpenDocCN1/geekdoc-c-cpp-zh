    # How Type Affects Performance


    Our choice of types in an application can affect its overall performance in various
    ways. The types we use to represent values in an application are the most important
    part of that choice because the other types will usually be classes in any case.
    Values, on the other hand, can be represented as structs, classes, records, or
    record structs. In this section, we’ll examine some of the factors that can help
    us decide between using struct types and class types to implement those value
    types, and how much those factors affect performance.


    We often hear that structs, and therefore record structs, should be small because
    it’s expensive to copy large instances around in memory. With that in mind, we’ll
    start by attempting to isolate the cost of copying instances from the other factors
    affecting performance.


    # Measuring the Cost of Copying


    As with our previous performance measurements, we need to establish a simple baseline
    against which we can compare further performance reports. Since we want to measure
    the cost of copying a large value type, first we have to measure the cost of copying
    a small, simple type, like the IntField struct we create in Listing 8-15.'
