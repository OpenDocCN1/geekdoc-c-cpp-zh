  md: 'A value is just a pattern of bits. The type is a formal specification for interpreting
    that bit pattern to give it meaning in a program. Two values with identical bit
    patterns may be interpreted differently if they are different types. A pattern
    of bits that are all 0 means one thing if the type is long, but something else
    entirely if the type is DateTime.


    A variable of value type directly contains its data, whereas a variable of reference
    type contains a reference to its data. More precisely, reference variables have
    a value that is a reference to an object somewhere on the heap. Put simply, a
    reference refers to an instance of a reference type; the value of a reference
    type variable is a reference.


    The relationship between variables and values is that all variables have a value,
    although the value can’t be accessed until the variable has been definitely assigned.


    # Definite Assignment


    We can’t read the value of a variable unless the compiler is satisfied that the
    variable has definitely been given an initial value. More formally, a variable
    can be read only after a value has been definitely assigned to it. The C# Language
    Specification precisely defines what constitutes definite assignment, but the
    essence is that a variable must have been assigned or initialized with a value
    at least once before its value is read.


    If we try to obtain the value of any variable that hasn’t been definitely assigned,
    the compiler raises an error to tell us that this isn’t allowed. For example,
    when we declare a local variable within a method, it is uninitialized unless or
    until we assign a value to it. Such variables are initially considered unassigned.
    Conceptually, at least, an unassigned variable doesn’t have a value.


    When we assign something to a variable, we give that variable a new value. When
    we read from a variable, we obtain its value. Variables and values are both expressions,
    meaning we can evaluate them to produce a value, as long as they have been definitely
    assigned.


    To reiterate, attempting to read a value from any variable that hasn’t yet been
    definitely assigned is an error. When we use a var declaration for a local variable,
    we must provide an initial value where the variable is declared, because the type
    of the variable is inferred from the type of the value being assigned to it.


