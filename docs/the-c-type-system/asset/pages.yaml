    +   - Eric Lippert discusses the Liskov substitutability principle more generally
    in a series of articles starting here: https://ericlippert.com/2015/04/27/wizards-and-warriors-part-one/.

    +   - Lippert argues that all equality can be derived simply from a conforming
    implementation of CompareTo at https://www.informit.com/articles/article.aspx?p=2425867.

    +   - This article by Kevlin Henney on strings and value types is based on the
    C++ string, but many of the observations are relevant to C#: https://www.slideshare.net/Kevlin/highly-strung.

    +   - The term seam is usually attributed to Michael Feathers from his book Working
    Effectively with Legacy Code (Pearson, 2004). The relevant chapter is available
    online at https://www.informit.com/articles/article.aspx?p=359417&seqNum=2.

    +   - Mock objects have been a feature of object-oriented unit testing for a long
    time, and Wikipedia has a good overview at https://en.wikipedia.org/wiki/Mock_object.

    +   - Gerard Meszaros describes the more general concept of a test double in his
    book xUnit Test Patterns (Addison-Wesley, 2007) and online at http://xunitpatterns.com/Test%20Double.html.

    +   - Henney makes a case against the term reuse at https://kevlinhenney.medium.com/simplicity-before-generality-use-before-reuse-722a8f967eb9.

    +   - For a summary of C# v8.0 ranges that includes the related specification
    for a generalized index operator, see the Microsoft documentation at https://docs.microsoft.com/en-us/dotnet/csharp/language-reference/proposals/csharp-8.0/ranges.'
