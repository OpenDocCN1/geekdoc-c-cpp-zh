- pgno: 247
  md: '# Inclusion Polymorphism and Subtyping


    We think of the classes, structs, records, and record structs we write as being
    user-defined types. By extension, then, it’s natural to think that the definition
    of a class is its type. That perception is partially true, but a more formal distinction
    between type and class exists.


    The polymorphism afforded by using inheritance is known as inclusion polymorphism.
    If we were to group all the objects in a system by type, each group of any specific
    type would include all the types that inherit from it, known as subtypes. In our
    example, the group for the Color type includes both the Color and TranslucentColor
    types.


    An object’s type is a contract for its interface and describes the allowable operations
    on the object. The operations defined by a type are, therefore, valid for any
    subtypes in its group. Practically speaking, if we derive from a given type, all
    the operations that are valid for an object of the base type must be valid—and
    behave correctly—for an object of the derived type.


    In our example, a TranslucentColor object is an instance of a Color type as well
    as being a TranslucentColor. This relationship means we can invoke any Color operation
    on a TranslucentColor, which in turn means we can pass a TranslucentColor instance
    to a method taking a Color parameter. As far as the compiler is concerned, a TranslucentColor
    must be able to support all the operations of its base type, so it allows the
    substitution.


    The type of an object establishes which operations a subtype must support, but
    it doesn’t specify any structural details or specific implementation. We’re free
    to implement the same interface in different ways, using various classes. However,
    while the contract for a type doesn’t mandate a specific implementation, it does
    define the expected behavior of any of its operations. When we inherit from a
    concrete class, we inherit its implementation, and this sets an expectation for
    that behavior. When implementing a type as a class or record, we must be mindful
    of the distinction between subtyping and subclassing, since we can inherit from
    reference types unless they’re explicitly sealed. For value types in C#, this
    isn’t an issue, because they’re implicitly sealed and so can’t have derived types.


    As noted earlier in this chapter, implementation and interface inheritance differ.
    In other words, simply inheriting from a class isn’t the same as actually respecting
    its behavioral characteristics. Code written in terms of the more general type,
    which defines the interface, may well depend on the specific characteristics of
    the class, which represents a particular implementation. If the derived class
    doesn’t respect the behavioral aspect of the type’s contract, when we use an instance
    of the derived class in code written for the base type, that code will very likely
    have unexpected behavior.


    When we inherit from a class, we inherit its behavior, characteristics, and expectations.
    A class that inherits from another concrete class is, then, a subclass, and only
    a true subtype if code using the base class type can use the derived class transparently
    with no change in observable behavior. When we inherit only the type, we have
    no implementation behavior to consider.


    Mechanically speaking, we can substitute a reference to a TranslucentColor where
    a Color is required because we can use a reference to the derived type'
