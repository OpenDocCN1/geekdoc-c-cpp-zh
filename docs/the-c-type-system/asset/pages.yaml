    \ |\n| 0.60% get_Default | 6.0 | System.Collections.Generic.EqualityComparer`1.get_Default()\
    \ |\n\nWhile the JIT compiler may inline some or all of the uses of the EqualityComparer<T>.Default\
    \ property and the calls to its Equals method, there’s no guarantee that it will\
