- pgno: 223
  md: 'Extension methods are useful for adding utility methods to a type without overburdening
    its principal internal interface.


    # Reducing the Internal Interface


    A type’s interface defines the collaborations that objects of that type can have
    with other objects in a system. The public methods, constructors, and properties
    defined within the type form the internal, or intrinsic, interface and define
    what other objects can do with instances of the type. A type also has an external,
    or incidental, interface comprising methods that take parameters of the type but
    are defined outside it. The external interface defines which other objects depend
    on the type. Those external methods can’t access the type’s internals, so they’re
    unaffected by any changes to the underlying representation.


    The essential characteristics of a type with many public members can be difficult
    to discern because the physical definition of the class becomes large. If we restrict
    the internal interface members to those that require access to the type’s private
    implementation details, the type definition becomes shorter and thereby easier
    to comprehend. Methods that can be implemented entirely in terms of the internal
    public interface can be factored out into separate classes. Whether to make them
    extension methods or plain static methods depends on which is the most natural
    usage.


    The logical conclusion is that, where possible, we should actively try to reduce
    the internal interface as much as we can without breaking the type’s encapsulation
    or reducing its cohesion. This approach has two competing perspectives. On one
    hand, by extracting methods like WithPercentAdded that are implemented in terms
    of Speed’s other public methods, we make Speed smaller and easier to comprehend.
    We also reduce the potential impact of any changes we might make to Speed’s internal
    representation. On the other hand, WithPercentAdded is still part of the overall
    accessible interface of Speed, and by extracting that method out separately, we
    make it harder to discover.


    We must find the balance between the internal and external interfaces of Speed.
    Although the WithPercentAdded method may be a useful utility for Speed values,
    it isn’t really intrinsic to the concept of Speed. Extracting it as an extension
    method doesn’t reduce Speed’s cohesion or break its encapsulation by requiring
    us to introduce a new property that would otherwise be unneeded or change a private
    member to be public. Collecting extension methods like WithPercentAdded in one
    place is one way to make the external interface easier to discover.


    The FromKmh class factory method, on the other hand, is much better suited as
    a member of Speed. We could implement it as a static method on a different type
    and in terms of FromMetersPerSecond. However, doing so would reduce the cohesion
    of Speed because FromKmh and FromMetersPerSecond naturally go together. If we
    extracted both of those methods to a separate type, we’d need to make Speed’s
    constructor public, reducing its encapsulation. The FromKmh method is intrinsic
    to the interface of Speed because it represents a way to create a Speed in specific
    units and has a natural affinity with other intrinsic methods.'
