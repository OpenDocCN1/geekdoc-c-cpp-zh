  md: 'we can’t use a value type in a lock statement to prevent a section of code
    from being executed concurrently by multiple threads. The compiler forbids it
    because the variable used as a lock needs to be a reference to an object on the
    heap. The purpose of locking an object is to allow only a single thread to execute
    the code it protects at any given time. The object instance identifies the lock
    and can then have multiple references to it from different threads.


    The underlying mechanism for the lock statement is the System.Threading.Monitor
    class. The lock statement translates to the Enter method of Monitor, which takes
    object as its parameter. Any instance of a value type passed to Monitor.Enter
    as an argument will automatically be boxed. Each thread calling Monitor.Enter
    will box the value separately, and the acquisition of the lock would never fail,
    rendering it pointless.


    When we’ve finished with the lock, we need to call Monitor.Exit and pass the same
    reference used to acquire the lock with Monitor.Enter. The compiler inserts the
    code to call Monitor.Exit at the closing brace of a lock block. If we use a value
    type, the call to Exit will result in a new boxed value on the heap, and so will
    be a different reference to that used in the call to Enter. The result is that
    releasing the lock will fail with a SynchronizationLockException error.


    This is one situation actively requiring reference semantics, because passing
    a reference to the Enter method doesn’t copy the instance. The monitor and the
    code using the lock both have a reference to the same instance.


    # Identity Equality vs. Value Equality


    When we say we’re comparing variables to see whether they’re equal, what we really
    mean is that we’re comparing the variables’ values. If two variables have the
    same value, they’re considered equal. The type of each value plays an important
    role: the values being compared must be the same type, although one or both values
    may have resulted from an implicit conversion.


    If we compare the values of two variables of the same reference type, their respective
