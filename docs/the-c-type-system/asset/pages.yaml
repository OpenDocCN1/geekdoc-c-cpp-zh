- pgno: 225
  md: 'general-purpose way in C# of creating our own types because they support all
    the object-oriented facilities of the language, such as inheritance and virtual
    methods. Class instances also benefit from the automatic memory management afforded
    to objects allocated on the heap. Generally, only when we need the behavior associated
    with value semantics should we define a type differently.


    We have a few indicators that value semantics are appropriate for a type we’re
    defining. Values shouldn’t support changes to their state, which is why it’s recommended
    that value types contain only other values. When all value types are immutable,
    regardless of whether they’re implemented using classes, records, structs, or
    record structs, we don’t have to worry about the state of an object changing unexpectedly,
    because the behavior of our code is more predictable. A type that requires unrestricted
    write access to its state is usually a poor candidate for being a value.


    A related indicator is needing the type to support a full deep copy of its state.
    We need a *deep copy*, also known as a *clone*, to copy mutable state when we
    want to avoid the side effects associated with aliasing references. Most commonly,
    the state needs to be written only immediately after cloning so that the new object
    can have different properties than the original. The non-destructive mutation
    facility we examined in Chapters 2 and 4 is a good example of providing limited
    mutability for value-like types.


    Anytime we customize equality behavior for a class so that two instances can be
    compared according to their state, it’s another strong indicator that the type
    should be implemented as a full-fledged value. Cloning is often accompanied by
    an overridden Equals method.


    State-based equality behavior and support for deep copies to avoid aliasing problems
    are two of the strongest signs that value semantics are needed. Although it’s
    possible to use a class to implement a value (as we’ve seen with string), the
    other kinds of type definition are usually preferable.


    Records, structs, and record structs are all facilities for creating types that
    represent values—that is, for defining types that have *value semantics*. The
    choice between them isn’t necessarily obvious, as each has different advantages
    and disadvantages.


    # Avoiding the Pitfalls of Default Variables


    For struct and record struct types, we need to remember that instances can always
    be default-initialized, so the default value must be considered valid both by
    the type’s implementation and by code using the type. For simple numeric types
    like Speed or Length, this isn’t a problem. The default value for such types is
    0, which is a perfectly acceptable state no matter the unit: 0 meters is precisely
    the same value as 0 miles or 0 inches.


    The same is not universally true for all values. In temperature measurements,
    for example, the unit of the stored value matters: 0°C is 32°F, and 0°F is approximately
    −17.78°C. We might establish the convention that the default unit for Temperature
    is Celsius, but it’s hard to make that explicit without having a separate type
    for each unit, which seems unnecessary.'
