  md: "This precision matters because when we’re talking about passing or copying\
    \ variables, we really mean passing or copying *values*. For value types, this\
    \ distinction doesn’t exist: the value of a struct variable *is* the instance.\
    \ However, reference variables are distinct from the instances they refer to—when\
    \ we copy a reference variable’s value, we’re making a copy of the reference,\
    \ not the instance.\n\nSome languages use pointers to objects in memory, but a\
    \ reference isn’t quite the same as a pointer. References can’t be used for just\
    \ anything in memory. They’re specifically used to access reference type objects\
    \ on the heap and to track those objects when they move around as a result of\
    \ garbage collection and memory compaction. The details of those processes are\
    \ hidden from us and handled automatically as part of the memory management for\
    \ reference types.\n\nWe can think of the value of a reference as being a kind\
    \ of address. In this respect, a reference value behaves very much like a value\
    \ type instance. Like a value type variable, a reference type variable directly\
    \ contains its value (an address) and lives within the scope of its parent, which\
    \ might be the stack frame for the local variables of a method.\n\nWith that in\
    \ mind, consider this: *all* variables, whether they represent reference or value\
    \ types, have values that may be copied. More than that, by default, all variable\
    \ values are copied—and passed—*by value*.\n\n# Reference Variables and Aliasing\n\
    \n*Aliasing* refers to accessing a single memory location via multiple variables.\
    \ As you’ve seen, when we copy one reference to another, such as when we pass\
    \ a reference as an argument to a method, we create two aliasing references—the\
    \ argument variable and the parameter variable—to the same object in memory.\n\
    \nIn contrast, when we pass a value type instance as an argument, the argument\
    \ variable and parameter variable are identical but independent copies of each\
    \ other. The difference between reference types and values in this respect is\
    \ most significant when the instances are mutable (that is, their state can be\
    \ altered).\n\nAliasing can be intentional and useful, such as when we want changes\
    \ to an object to be observable by all references to it, wherever they might be.\
