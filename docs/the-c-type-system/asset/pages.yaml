  md: 'The EqualityComparer<T>.Default static property returns an implementation of
    the standard IEqualityComparer<T> interface with the appropriate behavior for
    the T type parameter. When T implements IEquatable<T>, the Default property returns
    an implementation of IEqualityComparer<T> that uses the type-specific overload
    of the Equals method.

    Besides HashSet, the Dictionary collection and some LINQ algorithms use IEqualityComparer<T>
    to define equality between elements. They can all be given a specific IEqualityComparer<T>
    implementation, so we can provide our own implementation of it to customize that
    behavior. We’ll use this technique in Chapter 8 to modify the behavior of the
    SequenceEqual method.

    The EqualityComparer<T> class is designed for generic code but can be useful when
    equality comparisons need to be made in the most general and efficient manner
    possible. One such situation is in code generated by the compiler.


    # Compiler-Generated Equality


    The compiler itself is capable of synthesizing a correct and complete implementation
    of equality for some types. The code generated by the compiler uses the same techniques
    we’ve been exploring. In this section, we’ll look at examples to better appreciate
    what the compiler is prepared to generate on our behalf, even for something as
    fundamental as equality comparison of variables.


    # Records and Record Structs


    Records and record structs give us a compact way of creating a type that has value
    semantics built in. Records are syntactically different from both classes and
    structs, but in the CIL they’re just classes with some compiler-generated features,
    including overrides of the Equals and GetHashCode methods. Similarly, record structs
    are structs in the compiled code and have most of the same compiler-provided features
    as records.


    The notable exception is that the compiler implements a Clone method for records,
    but not for record structs. Clone emulates copying a record instance by value
    to support non-destructive mutation, which we examined in Chapter 4. Since record
    structs are natively copied by value, they have no need for a Clone method.


    Both records and record structs implement IEquatable<T>, and the compiler-generated
    type-specific overload of the Equals method compares each field of the type, exactly
    as we did earlier in MusicTrack and Color. The GetHashCode method implementation
    uses all the fields to provide well-distributed hash codes. All this is in contrast
    to plain structs, where the default value-based equality behavior is provided
    by a common base class, ValueType.


    This simple Color type is implemented as a positional record and demonstrates
    admirably how compact a record definition can be:


    ```

    public sealed record Color(int Red, int Green, int Blue);

    ```'
