  md: '+   - The Microsoft documentation for the ValueType override of Equals is at
    https://docs.microsoft.com/en-us/dotnet/api/system.valuetype.equals?view=net-6.0.

    +   - Sergey Tepliakov’s blog has a wealth of information on why overriding Equals
    is so important, and some good advice and interesting background on ValueType.GetHashCode:
    https://devblogs.microsoft.com/premier-developer/performance-implications-of-default-struct-equality-in-c/.

    +   - For the .NET 6 implementation of the default GetHashCode method, see https://github.com/dotnet/runtime/blob/release/6.0/src/coreclr/vm/comutilnative.cpp#L1878.

    +   - The default equality for structs is defined in ValueType at https://github.com/dotnet/runtime/blob/release/6.0/src/coreclr/System.Private.CoreLib/src/System/ValueType.cs#L21.

    +   - Niklaus Wirth’s documentation for Project Oberon can be found at https://people.inf.ethz.ch/wirth/ProjectOberon/PO.System.pdf.'
