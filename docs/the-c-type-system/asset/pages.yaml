- pgno: 51
  md: "Listing 1-33 shows how we would use these instance methods in the Displacement\
    \ method. Compare this with Listing 1-31, where we called Math.Cos directly.\n\
    \n```\nvar x = speed * elapsedTime * angle.Cos();\nvar y = speed * elapsedTime\
    \ * angle.Sin()\n    - 0.5 * Gravity.Earth * Math.Pow(elapsedTime.TotalSeconds,\
    \ 2);\n```\n\nListing 1-33: Invoking our new instance trigonometric methods\n\n\
    Our second option is to provide our own static class mirroring the Math class\
    \ with static Sin and Cos methods that take an Angle rather than a plain double\
    \ for their parameters. Each method would need to access the InRadians property\
    \ because it would not have access to the private size field. While this approach\
    \ follows a common convention established by the static Math class, we lose the\
    \ more compact usage of calling a member method.\n\nThe third alternative is to\
    \ define extension methods, which are used as if they’re instance methods but\
    \ are defined in a separate static class. Listing 1-34 defines Sin and Cos extension\
    \ methods to extend Angle’s interface.\n\n```\npublic static class AngleExtensions\n\
    {\n    public static double Cos(this Angle angle)\n        => Math.Cos(angle.InRadians);\n\
    \n    public static double Sin(this Angle angle)\n        => Math.Sin(angle.InRadians);\n\
    }\n```\n\nListing 1-34: Defining extension methods for Angle\n\nThe Cos and Sin\
    \ methods in the static AngleExtensions class use the special syntax this Angle\
    \ for their parameter, which tells the compiler that the method is an extension\
    \ for an Angle. Each method simply forwards the InRadians property of the angle\
    \ to its counterpart method in the Math namespace. We use the extension methods\
    \ in exactly the same way we called the instance method versions in Listing 1-33.\n\
    \nOne benefit of both the static and extension method implementations that is\
