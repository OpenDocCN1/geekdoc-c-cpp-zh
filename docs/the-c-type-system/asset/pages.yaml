    \ a slightly modified version of Listing 2-31 calling ToTitleCase, where any null\
    \ elements are filtered out before the method is called.\n\n```\n```csharp\nvar\
    \ properNames = names\n    .Where(name => name is not null)\n    .Select(name\
    \ => ToTitleCase(name));\n```\n```\n\n*Listing 2-33: Removing null elements before\
    \ the method call*\n\nThis code gives us the same warning as in Listing 2-31,\
    \ however, because the compiler can’t be certain ToTitleCase won’t be invoked\
    \ with a null argument. Although it looks as if the check for null is being made\
    \ inline, in fact we’re calling a lambda function to make that comparison, and\
    \ the compiler doesn’t attempt to analyze every possible code path to make this\
    \ safe. Fortunately, we have a workaround.\n\n# The Null-Forgiving Operator\n\n\
    We can use the *null-forgiving operator* to inform the compiler that we definitely\
    \ know what we’re doing and that no null references are used as arguments to a\
    \ non-nullable parameter. The null-forgiving operator is an ! appended to the\
    \ variable, which is why it’s also referred to as the *dammit operator*, as in,\
    \ “It’s definitely not null, dammit!” When we’ve filtered out all the null elements\
    \ from our collection, we apply the dammit operator to the argument for ToTitleCase,\
    \ as shown in Listing 2-34.\n\n```\n```csharp\nvar properNames = names\n    .Where(name\
    \ => name is not null)\n    .Select(name => ToTitleCase(name!));\n```\n```\n\n\
    *Listing 2-34: Using the null-forgiving operator*"
