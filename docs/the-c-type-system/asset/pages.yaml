    \ Testing simple copies\n\nFor this test, we’ll profile a debug build of this\
    \ code to try to minimize the effects of the method inlining performed by the\
    \ JIT compiler. Method arguments are copied only if the method is invoked normally,\
    \ and inlining would make measuring the cost of those copies unreliable; two different\
    \ runs of the code could easily make a different number of copies. Table 8-13\
    \ shows the CPU sampling report for comparing two sequences of 10 million IntField\
    \ items in a debug build, which inhibits the JIT compiler from inlining method\
    \ calls.\n\n# Table 8-13: Measuring the Cost of Copying a Simple Struct\n\n| Method\
    \ | Time (ms) | Signature |\n|---|---|---|\n| 57.0% SequenceEqual | 90 | System.Linq.Enumerable.SequenceEqual(IEnumerable,\
    \ IEnumerable) |\n| 7.60% Equals | 12 | IntField.Equals(IntField) |\n\nThe SequenceEqual\
