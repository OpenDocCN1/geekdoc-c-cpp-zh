- pgno: 321
  md: '+   - The calculation for relative luminance was lifted approximately from
    the International Telecommunication Union Radiocommunication Sector (ITU-R) recommendation
    on Wikipedia at https://en.wikipedia.org/wiki/Luma_(video), but it’s used in this
    chapter only to demonstrate implicit conversions.

    +   - C# has a few ways to represent conversions between types. Lippert’s description
    of is and as is at https://docs.microsoft.com/en-us/archive/blogs/ericlippert/is-is-as-is-as-is
    and https://ericlippert.com/2013/05/30/what-the-meaning-of-is-is/.

    +   - These articles by Henney are targeted at C++ programmers, but the principles
    are broadly applicable in any object-oriented language, including C#: https://www.slideshare.net/Kevin/promoting-polymorphism
    and https://www.slideshare.net/Kevin/substitutability.

    +   - The rules for overload resolution can be found in the C# Language Specification
    at https://docs.microsoft.com/en-us/dotnet/csharp/language-reference/language-specification/expressions#1164-overload-resolution.

    +   - Jon Skeet has blogged about overloading at https://csharpindepth.com/articles/Overloading.

    +   - Lippert looks at some interesting gotchas with respect to overload resolution
    at https://ericlippert.com/2006/04/05/odious-ambiguous-overloads-part-one/ and
    https://ericlippert.com/2006/04/06/odious-ambiguous-overloads-part-two/.

    +   - For a high-level description of record types in C# v9.0, see the Microsoft
    documentation: https://docs.microsoft.com/en-us/dotnet/csharp/whats-new/csharp-9#record-types.

    +   - Type builders are a variation on the Factory pattern. See Erich Gamma et
    al., *Design Patterns: Elements of Reusable Object-Oriented Software* (Addison-Wesley,
    1995).

    +   - Henney describes mutable companions and other value object patterns in his
    paper “The Good, the Bad, and the Koyaanisqatsi: Consideration of Some Patterns
    for Value Objects,” from the 2003 VikingPLoP (Pattern Languages of Programs) conference,
    at https://www.researchgate.net/publication/244405850.


    # Chapter 8


    +   - One example of an intentionally slow algorithm is the bogosort, which is
    sometimes used as a simple way to deliberately keep a CPU busy; Wikipedia has
    details at https://en.wikipedia.org/wiki/Bogosort.

    +   - One popular library to benchmark code for performance measurement is BenchmarkDotNet,
    described at https://benchmarkdotnet.org.

    +   - Joe Duffy’s blog about performance and optimization is now more than a decade
    old but still thought-provoking, and the principles remain relevant: http://joeduffyblog.com/2010/09/06/the-premature-optimization-is-evil-myth/.'
