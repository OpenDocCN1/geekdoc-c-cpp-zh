    \ ToList(int count)\n{\n    var items = new List<Purchase>(count);\n    for(int\
    \ i = 0; i != count; ++i)\n    {\n        items.Add(MakePurchase(i));\n    }\n\
    \    return items;\n}\n```\n\nListing 8-27: Using a simple for loop\n\nAs we did\
    \ for the foreach loop, we must create the target List<Purchase> before entering\
    \ the loop, and we use the constructor to set its capacity. In the loop’s body,\
    \ we use the MakePurchase method to add a new Purchase as we have previously.\
    \ Table 8-26 shows the profiler report for creating a list of 10 million Purchase\
    \ objects with the for loop."
