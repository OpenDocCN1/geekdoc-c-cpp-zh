- pgno: 207
  md: 'This characteristic isn’t limited to the built-in value types. The same is
    true of other values, such as a monetary amount like $9.99, the string "To be,
    or not to be", and the date January 1st 2024. They’re just there when we need
    them.


    In practice, real variables certainly do have a measurable lifetime, and each
    instance requires storage, so we can’t simply dismiss the technical needs of our
    environment. Nonetheless, the theoretical view of eternal, immutable values is
    a useful way to model the way our own value types should behave.


    When we add two numbers, we don’t change either of them; rather, we get a new
    number representing their sum. Similarly, adding a day to a DateTime or rounding
    an amount of money to the nearest whole dollar doesn’t alter the original—it produces
    a new value.


    We can’t change the value of the number 100,¹ but we can produce a new number
    by using 100 in an expression with another number. If we add 1 to 100, the value
    of 100 doesn’t go away, even though we have a new number as a result of the expression.
    The same holds true for dates, speeds, lengths, temperatures, and other natural
    values. Values are immutable by nature.


    Immutability can seem like an unnecessary restriction when we’re creating types
    that represent values. After all, if we increase a speed value, we might not care
    about the previous value. Isn’t it usually more efficient to change a value in
    place than to create a new instance with a changed value? Well, perhaps—we’d have
    to measure that. However, immutability has other, more subtle consequences and
    benefits.


    Two immutable values—and remember from Chapter 4 that read-only isn’t always the
    same thing as immutable—that compare equal will always do so. This has important
    implications for keys in hashed containers such as Dictionary collections. Hashed
    containers depend on the invariance of their keys. If we change the value of a
    particular key after it’s been added to a container, we can’t subsequently use
    the value to look up an item because, in a sense, we’ve altered that key’s identity
    by changing its value.


    The difference between state and instance identity is largely about equality.
    Specifically, when we check to see if one value equals another, are we interested
    in whether they have the same state or whether they’re the same object? If it’s
    the latter, we need a class. If it’s the former—we’re interested in the content
    and don’t care whether the variables are the same instance—we need a value type.


