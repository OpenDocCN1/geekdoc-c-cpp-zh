    this chapter discusses, inheritance is just one kind of polymorphism, and while
    there are sound technical and semantic reasons for why value types can’t employ
    inheritance relationships, they can take advantage of other kinds of polymorphism.


    We’ll explore the following:


    +   - Why value types are sealed and why value-like types in general shouldn’t
    use inheritance

    +   - How subtyping differs from subclassing and why it matters

    +   - What *type substitutability* means and how it relates to inheritance

    +   - Where to use other kinds of polymorphism, rather than inheritance, to model
    relationships between objects


    # Why Value Types Are Sealed


    The principal technical reason for prohibiting inheritance for structs, and by
    extension record structs, is that they have different lifetime and storage characteristics
    than reference types. The restriction is more than an arbitrary rule: it results
    directly from how value type variables behave in memory, and how that behavior
    differs from reference types.


    Inheritance between classes allows us to use a reference to a base class type
    to refer to an instance of a derived class, so the static, compile-time type of
    a reference variable isn’t necessarily the same as the dynamic, run-time instance
    type. This characteristic permits *virtual dispatch* for method calls—the mechanism
    whereby the appropriate method implementation will be called based on the actual
    type of the object at run time—and relies on the extra level of indirection afforded
    by references; therefore, inheritance is appropriate only for reference types.


    Value type variables directly contain their data, so we can’t declare a variable
    as one type to represent an instance of a different type, other than via boxing.
    Inheriting from a struct thus makes no sense, and the compiler forbids it.


    Remember, though, that we can use classes to model value-like behavior. As you
    saw in Chapter 6, string behaves like a value but is implemented as a reference
    type. The string type uses a value-based (rather than identity-based) equality
    comparison, is immutable, and has various other characteristics that identify
    it as a value. Being a class, string could support virtual method dispatch, but
    we can’t derive from the string class because it’s explicitly sealed. This means
    we can’t create our own augmented subclass of string any more than we could inherit
    from DateTime, Guid, or any other value type.


    Like the string class, records are reference types but have value-like equality
    behavior. Records can derive from other records and can also have virtual methods,
    so they seemingly unify the ideas of values and'
