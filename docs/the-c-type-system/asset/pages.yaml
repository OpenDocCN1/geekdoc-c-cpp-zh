    \ 0xDD);\nvar pink = new Color(0xFF, 0xCC, 0xCC);\n\nAssert.That(plum != pink,\
    \ Is.True);\n```\n\nWe’re not permitted to alter the implementations of operator==\
    \ or operator!= synthesized by the compiler for records and record structs, but\
    \ we can add overloads of them to accept different types, just as we can with\
