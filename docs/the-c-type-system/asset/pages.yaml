- pgno: 248
  md: "as an argument to a method expecting the base type. However, as you’ve seen\
    \ with the behavior of Equals, using Color and TranslucentColor instances interchangeably\
    \ is not really possible.\n\nThe lack of substitutability between Color and TranslucentColor\
    \ arises because TranslucentColor is a subclass but not a true subtype of Color.\n\
    \n# Working with Input and Output Types of Virtual Methods\n\nThe difference between\
    \ a subtype and a subclass has implications that go beyond how an inherited Equals\
    \ method is implemented. We can override any virtual method with an implementation\
    \ that is appropriate for the derived class. If the observable effects, including\
    \ any side effects, of calling the more derived method are identical to the effects\
    \ of the base class, then the derived type is a good substitute for its base type—that\
    \ is, the derived type is a proper subtype. Side effects might include writing\
    \ to a file or to the screen, or perhaps updating the value of a variable visible\
    \ outside the method. If a derived class does any of these things when its base\
    \ class doesn’t, it’s not a true subtype.\n\nA method’s behavior includes what\
    \ the method considers to be valid inputs and outputs—that is, what parameters\
    \ a method accepts and what it may return—each of which directly affects the method\
    \ caller. To illustrate, suppose we add a virtual method to the Color class like\
    \ the one in Listing 7-11 to subtract one Color value from another.\n\n```\npublic\
    \ virtual Color Subtract(Color? other)\n{\n    --snip--\n}\n```\n\n*Listing 7-11:\
    \ Adding a virtual Subtract method to Color*\n\nSince the Subtract method is virtual,\
    \ we can specialize its implementation in TranslucentColor to handle subtraction\
    \ appropriately for TranslucentColor instances. Regardless of the actual algorithm\
    \ used to implement Subtract, its return value is the observable behavior of the\
    \ method, as long as it has no side effects.\n\nIf the Subtract implementation\
    \ in Color never returns a null reference but the overridden version in TranslucentColor\
    \ might, then the TranslucentColor method has a weaker behavioral contract than\
    \ the base class method. Allowing the TranslucentColor implementation to return\
    \ a null value requires extra checking in the calling code to avoid null-reference\
    \ exceptions. The calling code, knowing only about the Color type, might reasonably\
    \ expect only non-null values. The weaker requirements on the return type mean\
    \ that TranslucentColor isn’t substitutable for Color.\n\nA corresponding situation\
    \ arises when we strengthen requirements on the parameters in an overridden method.\
    \ If we insist on non-null values in the derived type but the base class accepts\
    \ null references, we break the contract established by the base class method.\
    \ Once again, code written in terms of the base class has no notion of those requirements\
    \ in derived classes and can easily violate them."
