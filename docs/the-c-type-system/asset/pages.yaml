- pgno: 276
  md: 'improving performance. Once a block has been translated by the JIT compiler,
    its native code remains in memory, so it usually doesn’t need to be recompiled
    if the program runs it more than once.


    In a debug build, the JIT compiler is much less aggressive in the optimizations
    it applies so that normal debugging operations are supported. When we’re trying
    to assess our code’s performance, it usually makes the most sense to base that
    assessment on a release build so it will account for all of the optimizations
    performed by the JIT compiler.


    # Performance Benchmarks


    When our code runs more slowly than we expect, simply observing the running application
    may give us some insights, but measuring performance precisely will allow us to
    target our optimization efforts more effectively.


    Recording the time it takes for code to run—whether it’s a complete end-to-end
    run or just a portion of a program—is known as benchmarking. More generally, a
    benchmark is a standard against which something is measured. By timing our code,
    we establish a benchmark with which to compare a new version, to determine whether
    our changes have made the code faster or slower, or have had no discernible effect.


    Many unit-testing frameworks report how long it takes for the tests to run, and
    even the elapsed time taken for individual tests. Keeping an eye on these numbers
    is certainly worthwhile because a sudden increase can indicate that an efficiency
    problem has been introduced somewhere. This approach can be particularly valuable
    in an automated continuous integration (CI) service, in which changes from multiple
    contributors are automatically integrated into a program; we can set up a CI service
    to alert us if the timing of the unit tests begins to change. If a particular
    test that usually runs in a few hundred milliseconds starts taking considerably
    longer, we can focus on the piece of code being tested to see if further investigation
    is warranted.


    A more fine-grained and precise approach to measuring how fast a section of code
    runs is to instrument the code itself. The basic technique is simple in principle:
    just before running the code to be measured, we create a timer to record the elapsed
    time, and when the code has finished running, we record the timer’s measurement.
    Listing 8-1 shows a simple but naïve benchmark using the Stopwatch class from
    the System.Diagnostics namespace.


    ```

    // Start the clock

    var clock = Stopwatch.StartNew();


    // Run the code to be measured

    var result = SomeTask();


    // Stop the clock, and record elapsed time

    clock.Stop();

    var millisecs = clock.ElapsedTicks * 1000.0 / Stopwatch.Frequency;

    ```


    Listing 8-1: A simple benchmarking approach'
