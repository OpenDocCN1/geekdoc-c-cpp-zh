    \ accept this syntax, and they all behave the same way. The initialization process\
    \ is the same for each: a constructor is invoked in the usual way to create an\
    \ instance, and then the value is assigned to the property of the instance. In\
    \ this example, a Brush is created using a parameterless constructor (or one with"
