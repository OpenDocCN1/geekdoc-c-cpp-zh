- pgno: 272
  md: "to any method that expects a Color. Any code written for Color instances won’t\
    \ be expecting to be able to use the mutating properties of the companion class,\
    \ so the conversion is safe and convenient.\n\nThe ColorBuilder can be substituted\
    \ for Color courtesy of the implicit conversion. No information is lost because\
    \ the two types share a common representation; however, a narrowing of the interface\
    \ occurs, because the Color target type has no set accessors for its properties.\n\
    \nConversions represent a form of polymorphism, as we explicitly allow a variable\
    \ of one type to be coerced to a variable of a different but unrelated type. Like\
    \ parametric polymorphism using generics, and ad hoc polymorphism with overloading,\
    \ coercion polymorphism is a compile-time activity, in contrast to the dynamic,\
    \ run-time characteristic of inclusion polymorphism using inheritance. Inclusion\
    \ polymorphism is a powerful tool, but because the type relationships are resolved\
    \ at run time, the compiler can’t identify many of the errors that may occur.\
    \ When we improperly use generics, overloading, or coercions, we can rely on the\
    \ compiler to tell us about most errors in our code.\n\n# Summary\n\n> *Trying\
    \ to outsmart a compiler defeats much of the purpose of using one.*  \n> —Brian\
    \ Kernighan and P.J. Plauger, *The Elements of Programming Style*\n\nAsking how\
    \ to make value types behave correctly when used polymorphically is the wrong\
    \ question: polymorphism itself takes many forms! Combining value types and inheritance\
    \ can cause hard-to-diagnose errors, but inheritance is only one kind of polymorphism.\
    \ The dynamic nature of inclusion polymorphism with virtual dispatch brings an\
    \ expectation of type substitutability and doesn’t sit well with value-based equality.\n\
    \nInheriting one type from another imposes a responsibility on the derived type\
    \ to respect the contract established by the base class. Failing to uphold that\
    \ contract can lead to undesirable behavior. One type is genuinely substitutable\
    \ for another only if they share the same behavioral contract, which is something\
    \ the compiler can’t enforce. It’s up to us, the programmers, to judge whether\
    \ inheritance is appropriate. In the case of structs, it’s not even permitted,\
    \ freeing us from that particular responsibility.\n\nWith records, we need to\
    \ pay just as much attention to the base class contract as we do with classes.\
