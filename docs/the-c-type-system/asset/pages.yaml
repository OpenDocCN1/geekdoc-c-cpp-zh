  md: "The compiler performs static analysis that enables it to issue a warning if\
    \ a non-nullable reference can’t be guaranteed to be non-null. To state that with\
    \ fewer negatives, the compiler issues a warning if a value that may be null is\
    \ assigned to a non-nullable reference. In particular, assigning null to a non-nullable\
    \ reference, as we just did, provokes this warning:\n\n> [CS8600] Converting null\
    \ literal or possible null value to non-nullable type\n\nIf we attempt to pass\
    \ a possibly null value as an argument to a non-nullable method parameter, we’ll\
    \ get a warning from the compiler. Consider the method in Listing 2-30, which\
    \ capitalizes the first character of each word in a string.\n\n```\npublic static\
    \ string ToTitleCase(string original)\n{\n    var txtInfo = Thread.CurrentThread.CurrentCulture.TextInfo;\n\
    \    return txtInfo.ToTitleCase(original.Trim());\n}\n```\n\n_Listing 2-30: Defining\
    \ the ToTitleCase method with a non-nullable reference parameter_\n\nWithin the\
    \ ToTitleCase method, we should be able to depend on the original parameter having\
    \ a real, non-null value, because it’s a non-nullable string. That means we can\
    \ avoid explicitly writing code to check that it isn’t null. When we call ToTitleCase,\
    \ if the compiler can’t guarantee that the argument we pass isn’t null, it will\
    \ give us a warning.\n\nWe might have a legitimate need for a null reference,\
    \ however, in which case we mark the type of a variable as nullable to suppress\
    \ the compiler warnings about possible null assignment. The syntax is the same\
    \ as for nullable value types: we append a ? to the type. Listing 2-31 shows a\
    \ collection of nullable string elements designated by the string? type name.\n\
    \n```\nvar names = new List<string?>();\n// Load names from somewhere, may contain\
    \ null elements\n--snip--\nvar properNames = names.Select(name => ToTitleCase(name));\n\
    ```\n\n_Listing 2-31: Passing a possibly null argument for a non-nullable parameter_\n\
    \nIf we apply the ToTitleCase method from Listing 2-30 to this collection, we\
    \ get a similar compiler warning as with Listing 2-29, where we explicitly assigned\
    \ null to a non-nullable reference type variable:\n\n> [CS8604] Possible null\
    \ reference argument for parameter 'original' in 'string ToTitleCase(string original)'.\n\
    \nWe’re given this warning because the compiler can’t guarantee that the collection\
    \ contains no null elements. The compiler assumes any of the elements may be null\
    \ because the element type of the collection is a nullable reference."
