- pgno: 299
  md: "**Table 8-15: Performance Report for Creating the Purchase Sequence**\n\n|\
    \ Method | Time (ms) | Signature |\n|---|---:|---|\n| 29.4% MakePurchase | 294\
    \ | `MakePurchase(Int32)` |\n| 2.45% `op_Implicit` | 25 | `System.Decimal.op_Implicit(Int32)`\
    \ |\n| 2.03% `Purchase..ctor` | 20 | `Purchase..ctor(Product, DateTime, Int32)`\
    \ |\n| 1.41% `Product..ctor` | 14 | `Product..ctor(Int32, Decimal, String)` |\n\
    \nWhile the nested constructor for the Product type increases the time taken to\
    \ create Purchase objects, the majority of the time is spent within the implementation\
    \ of MakePurchase, suggesting that initializing the instances and copying them\
    \ around is the costlier factor. In particular, creating a new Product and then\
    \ copying the instance to the Purchase constructor is one copy we can avoid by\
    \ making Product a reference type.\n\n# Reference Type Performance\n\nWhen we\
    \ copy a reference variable, the object instance isn’t copied at all, making the\
    \ copy inexpensive. Here we make Product a sealed record instead of a read-only\
    \ record struct:\n\n```\npublic sealed record Product\n    (int Id, decimal Price,\
    \ string Name);\n```\n\nRecords using this positional syntax are immutable reference\
    \ types by default. For the Product type, the compiler inserts init-only properties\
    \ for the Id, Price, and Name properties, meaning that one instance can be safely\
    \ and efficiently referenced by several containing objects. Since none of the\
    \ properties has a set accessor, there’s no risk of inadvertent changes being\
    \ made via aliasing references. More pertinently for our test, once the Product\
    \ instance is created, only the reference to it needs to be passed to the Purchase\
    \ constructor.\n\nFor this test, we leave the Purchase type as a record struct,\
    \ since we’re trying to avoid having to copy its nested Product. However, using\
    \ a reference type for Product introduces other overhead, as we can see in the\
    \ profiler report in Table 8-16 for creating 10 million Purchase objects.\n\n\
    **Table 8-16: Performance Report for Creating Reference Type Values**\n\n| Method\
    \ | Time (ms) | Signature |\n|---|---:|---|\n| 77.8% MakePurchase | 1,409 | `MakePurchase(Int32)`\
    \ |\n| **34.9% [Garbage collection]** | **632** |  |\n| 0.33% `Product..ctor`\
    \ | 6.0 | `Product..ctor(Int32, Decimal, String)` |\n| 0.33% `Purchase..ctor`\
    \ | 6.0 | `Purchase..ctor(Product, DateTime, Int32)` |"
