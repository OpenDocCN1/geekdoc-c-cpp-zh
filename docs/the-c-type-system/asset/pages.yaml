    type. Two reference type instances have different identities—they’re independent
    objects—regardless of whether they have fields containing the same values. We
    can think of the address of an object as its identity, although this is only an
    analogy: an object’s address can change if it’s moved in memory because of heap
    defragmentation or other memory management tasks, but the object retains its identity.


    In Chapter 2, you saw how the lock statement relies on reference semantics; that’s
    one example of an object’s identity being more important than the state it contains,
    even though the underlying Monitor class doesn’t attempt to mutate the object
    used as a lock in any way. The implementation of Monitor relies on knowing the
    identity of a specific object instance, and that the identity is valid across
    multiple threads of execution.


    Reference semantics is an important element in our toolbox so that we can identify
    a specific object instance, not just an object that has the same state as another
    object. Two reference variables to different class instances with exactly the
    same state shouldn’t usually compare equal.


