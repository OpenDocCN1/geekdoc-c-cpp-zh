- pgno: 300
  md: "The MakePurchase method is significantly slower than in Table 8-15, with the\
    \ main culprit being garbage collection. Changing Product to be a record rather\
    \ than a record struct has put considerable pressure on the garbage collector,\
    \ which takes time even if it can’t collect any objects.\n\nThe lesson here is\
    \ that the common advice to use value types for objects that are short-lived is\
    \ at least partly related to memory pressure and the cost of garbage collection.\
    \ Value type instances, because they aren’t allocated on the heap, don’t incur\
    \ those costs. Copying even huge object instances isn’t always the most significant\
    \ expense, so changing large value types to be reference types to avoid copying\
    \ can, as in this example, have a detrimental effect on a program’s overall performance.\n\
    \nWe have other factors to consider. If, for instance, we expect many of the Purchase\
    \ objects in an application to have identical Product values, we may benefit considerably\
    \ by having all those Purchase instances sharing the same Product instance, making\
    \ a reference type implementation much more attractive.\n\n# Benefits of Reference\
    \ Equality\n\nThe MakePurchase method from Listing 8-19 that we’ve been using\
    \ to create Purchase instances creates a new Product object for each Purchase\
    \ object. In Listing 8-20, we change MakePurchase so that rather than creating\
    \ a new Product each time, we assign one of a small number of shared Product instances\
    \ to each new Purchase. Since Product is a record and therefore a reference type,\
    \ each Product will be shared by many Purchase objects.\n\n```\nprivate static\
    \ readonly List<Product> SharedProducts = new()\n{\n    new Product(0, 0, \"Some\
    \ Description\"),\n    new Product(1, 1, \"Some Description\"),\n    new Product(2,\
    \ 2, \"Some Description\"),\n    new Product(3, 3, \"Some Description\"),\n  \
    \  new Product(4, 4, \"Some Description\"),\n};\n\nprivate static Purchase MakePurchase(int\
    \ id)\n{\n    var component = SharedProducts[id % SharedProducts.Count];\n   \
    \ return new Purchase(component, DateTime.MinValue, id);\n}\n```\n\nListing 8-20:\
    \ Sharing references among objects\n\nWe initialize a short list of Product instances\
    \ before creating any Purchase objects. A Product reference is selected from this\
    \ list according to the id value used to create a Purchase. Now that the MakePurchase\
    \ method isn’t creating any new Product instances, we’d expect it to run much\
    \ more quickly, which the report in Table 8-17 confirms."
