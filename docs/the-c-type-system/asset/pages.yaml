    \ a ColorBuilder and Color value.\n\n```\npublic static double RelativeLuminance(Color\
    \ color)\n    => 0.2126 * color.Red + 0.7152 * color.Green + 0.0722 * color.Blue;\n\
    \nvar background = new Color(0, 0, 0);\n\nvar builder = new ColorBuilder();\n\
    builder.Red = 0xFF;\nbuilder.Green = 0xFF;\nbuilder.Blue = 0;\n\nif(RelativeLuminance(builder)\
    \ < RelativeLuminance(background))\n    background = builder;\n```\n\nListing\
    \ 7-38: Converting a companion type\n\nThe implicit conversion operator we defined\
    \ for ColorBuilder in Listing 7-37 permits us to pass the mutable builder variable\
    \ as an argument"
