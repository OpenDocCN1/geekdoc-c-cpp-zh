    Listing 7-10: Testing the stability promise


    In the first assertion, the pencil and crayon references are automatically converted
    to Color references when we call the EqualViaBase method because a reference to
    a derived class is implicitly convertible to a reference to any of its base classes.
    The call to Equals within EqualViaBase invokes Color’s implementation, which incorrectly
    determines the parameter variables to be equal. The EqualViaDerived method calls
    TranslucentColor.Equals directly, which correctly reports that the parameter variables
    are not equal.


    The equality implementation for TranslucentColor isn’t stable: it can produce
    a different result for the same two instances depending on the static type of
    the variable used to refer to those instances, even when their underlying state
    remains unchanged.


    # Breach of Contract


    The behavior of the tests in Listing 7-10 demonstrates that TranslucentColor breaks
    the promise of stability established by the contract for equality—namely, that
    the result of Equals doesn’t change if the values being compared don’t change.
    When we compare two variables that have different values, they should compare
    not equal, and as long as no changes are made to either variable’s state, the
    result of the comparison shouldn’t change.


    One problem with our Equals implementation is that the type-specific overload
    of Equals in the Color class isn’t virtual, and therefore it can’t be overridden
    in TranslucentColor. The virtual version of Equals, which takes an object parameter,
    isn’t considered in overload resolution because the overload with a Color parameter
    is a much better match, even when the run-time type is derived from Color.


    To get the test in Listing 7-9 to pass, we could make the type-specific Equals
    method virtual in Color and add an override for it in TranslucentColor. Another
    possibility would be to remove the implementation of the IEquatable<T> interface
    for Color so that the only Equals method would be virtual. We’d lose the facility
    for type-specific comparisons, with a small performance cost, but this option
    would address the problem of stability. However, either approach would be solving
    the wrong problem.


    The real underlying problem is that we’ve used inheritance inappropriately, not
    that our implementation of equality is incorrect. To fully appreciate why, we
    need to be clear on the difference between subclasses and subtypes.'
