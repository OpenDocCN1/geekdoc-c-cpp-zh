    \ compiler creates a virtual property named EqualityContract, which uses typeof\
    \ to report the static (compile-time) type of its containing record. The implementation\
    \ of Equals for the Color record shown in Listing 7-14 is equivalent to the one\
    \ generated by the compiler, although, as you saw in Chapter 5, some implementation\
    \ details differ.\n\n```\npublic class Color : IEquatable<Color>\n{\n    --snip--\n\
