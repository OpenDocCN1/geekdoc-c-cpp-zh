  md: 'purpose. Doing so can lead us to unduly rely on the built-in types and to oversimplify
    our custom value type implementations, resulting in what Martin Fowler describes
    as an *anemic domain model*.


    The types used in an anemic design are perfunctory representations for common
    concepts in the design, especially for the value types. Such types often consist
    only of public properties, all of which have public getters and setters. They
    have no other associated behavior, instead relying on the surrounding code to
    perform common tasks such as data validation, calculations, and even managing
    comparisons. In turn, this leads to duplicated code, scattered error handling,
    and fragmented responsibilities.


    The antidote to anemic design is a *rich domain model*, in which different kinds
    of types have individual roles and well-defined responsibilities. Each type incorporates
    behavior specific to it, rather than the behavior being scattered around the rest
    of the code. To successfully identify the types our applications require, we must
    recognize that objects aren’t all the same; however, objects in even the most
    complicated systems do fall into a few categories.


    # Kinds of Objects


    If we don’t take care to partition our application’s roles, our design can end
    up becoming incoherent, making it difficult to manage and maintain. Once we recognize
    the main roles that different kinds of objects can play, we can classify the types
    we create by those roles, giving our designs more structure and making them easier
    to understand and work with. Objects fall broadly into one of four categories:


    # Values


    Values are responsible for ensuring that an application’s data is valid and consistent
    and for controlling access to that data. They don’t usually outwardly collaborate
    with other objects in a system, except to contain other values. A value’s properties
    commonly don’t change over time, but new values with different properties occur
    frequently.


    # Services


    Services are boundary objects that represent interfaces to systems that are external
    to the application. Services are often stateless; they can be used and accessed
    as they’re needed. They may be perpetual, meaning they are static types or have
    a global instance, or they’re ephemeral and instantiated as and when required.
    Services may be used by many objects but generally have few collaborations of
    their own.


    # Entities


    Entities are the higher-order design elements in an application. Whereas values
    are the currency of information, entities represent the transactions that use
    or act upon that information. They are often persistent, in the sense that they
    remain in memory rather than being created and destroyed often. They may change
    their properties over time—perhaps frequently—according to the needs of the system,
    and they collaborate'
