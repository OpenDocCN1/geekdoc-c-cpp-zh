    | 0.38% Unbox | 6.0 | System.Runtime.CompilerServices.CastHelpers.Unbox(Void*,
    Object) |


    We can see that garbage collection contributes a significant portion of the time
    required by Equals. Each call to Equals with a Purchase instance results in the
    argument being boxed, as Purchase is a struct and the parameter type of the Equals
    override is object, a reference type. Furthermore, the Purchase.Equals method
    calls Product.Equals, which also requires its argument to be boxed. The consequence
    is that we’re allocating many boxed objects on the heap, placing the garbage collector
    under fairly significant pressure to keep memory usage under control.


    In each Equals method, the parameter needs to be unboxed back to its original
    type so that its properties can be compared; the cost of unboxing the object parameter
    for each of the Equals methods is tiny but has a measurable impact. We can avoid
    the costs of boxing, and much of the associated cost of garbage collection, by
    implementing IEquatable<T> for both Purchase and Product types.


    # The Effect of IEquatable<T>


    The SequenceEqual method automatically selects the best (the most efficient) implementation
    of Equals available to perform the comparisons. Internally, SequenceEqual uses
    the EqualityComparer helper class from Chapter 5 to determine how to compare elements.
    If the element type T implements IEquatable<T>, it’s guaranteed to implement a
    type-safe overload of Equals, and that overload will be called by SequenceEqual.


    If we implement the IEquatable<Purchase> interface and provide our own type-safe
    overload of Equals, the SequenceEqual method will use the IEquatable<Purchase>
    interface method by default, avoiding the need for boxing and then unboxing the
    argument to Equals. In turn, this reduces memory pressure because the arguments
    aren’t copied to the heap, resulting in fewer objects for the garbage collector
    to inspect. In our example, those reductions are considerable, so implementing
    the IEquatable<Purchase> interface should produce a measurable benefit. Listing
    8-9 shows the changes required in Purchase.'
