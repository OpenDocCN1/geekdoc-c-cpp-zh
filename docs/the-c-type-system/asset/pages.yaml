  md: 'NOTE To reiterate, by-reference parameters aren''t the same as reference type
    variables. A reference type variable refers to an instance of a reference type,
    whereas a by-reference parameter refers to a variable, which can be either a reference
    type or a value type.


    References can refer only to an object on the heap. If we assign a reference type
    variable to an instance of a value type, the value is boxed onto the heap, and
    the variable refers to the boxed copy. A by-reference parameter adds an extra
    level of indirection to a variable''s value. When we pass a value type instance
    by reference, the value is neither boxed nor copied.


    # Working with Output Parameters


    Output parameters, designated by the out modifier, are mutable by-reference parameters
    and are usually used when we require a method to create a new instance of an object
    for that parameter variable. They''re similar to reference parameters in that
    they, too, alias the variable used as the argument. The argument we pass to the
    method is usually uninitialized, and the method will initialize it by assigning
    a value to populate the output parameter variable.


    More formally, the difference between a reference parameter and an output parameter
    is that a reference argument must be definitely assigned before it''s passed,
    whereas an output argument may or may not be initialized when it''s passed, but
    the parameter must be assigned a value within the method either way.


    Output parameters are typically used when acquiring a new instance of an object
    could fail without the failure being a fatal or even serious problem. Examples
    include parsing a string for a specifically formatted value, connecting to an
    unreliable service, and reading a value from a shared resource such as a queue,
    which could be empty. In cases like these, we often want a way to attempt the
    process and be able to either ignore a failure or retry the operation. If the
    operation succeeds, we receive a valid object as a result.


    The common approach to this use case is to define a method that takes at least
    one output parameter and returns a bool indicating success or failure. If the
    method succeeds, the out parameter is initialized with a new object, and the method
    returns true, indicating that the argument passed has been successfully initialized.
    If the operation is unsuccessful, the method returns false, indicating to the
    caller that the output argument''s value should be ignored. This is a common technique
    in C# known as TryXXX.


    # Using the TryXXX Idiom


    The Standard Library has several examples of using TryXXX to parse a string for
    a specific kind of value, such as a DateTime object. The DateTime.TryParse method
    takes a string parameter and an output parameter for a DateTime value. If the
    parse fails, the method returns false. If the parse succeeds, the'
