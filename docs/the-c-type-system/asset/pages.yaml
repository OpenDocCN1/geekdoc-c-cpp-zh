    # Strings and Value Equality


    Although string variables are references, when we compare them we’re usually more
    concerned with whether their contents are the same rather than whether they refer
    to the same string instance.


    The string class overloads the default behavior of == and Equals to give strings
    value-like semantics. Comparing strings with either == or Equals performs a value-based
    rather than reference-based comparison. It’s possible to have more than one reference
    to a single string instance on the heap, and those references will still compare
    equal. However, it’s also possible to have two independent string instances that
    have the same content, and those instances also compare equal.


    For example, in Listing 5-9, the x and y variables don’t refer to the same string
    instance but do have the same value at run time.


    ```

    var monarch = "Henry";

    var number = "IV";


    var x = $"{monarch} the {number}";

    var y = $"{monarch} the {number}";


    Assert.That(x == y, Is.True);

    Assert.That(x.Equals(y), Is.True);


    Assert.That(ReferenceEquals(x, y), Is.False);

    ```


    Listing 5-9: Comparing string values


    The string class customizes the behavior of both == and the Equals method, so
    the x and y variables compare equal because they both have the same content, although
    they’re references to distinct instances. Since string overrides the behavior
    of ==, we use the ReferenceEquals method here to perform a reference comparison.
    ReferenceEquals is a static method defined on object and performs an identity
    comparison between any two reference type variables. In this example, ReferenceEquals
    returns false because its arguments are references to different objects on the
    heap.


    The x and y variables in Listing 5-9 both use string interpolation to insert the
    values of named variables within the string, ensuring that x and y really are
    distinct instances—at least in debug mode. If we use two simple string literals,
    as we do in Listing 5-10, ReferenceEquals gives us a different result.


    ```

    var x = "Henry the IV";

    var y = "Henry the IV";


    Assert.That(ReferenceEquals(x, y), Is.True);

    ```


    Listing 5-10: Comparing string literal values'
