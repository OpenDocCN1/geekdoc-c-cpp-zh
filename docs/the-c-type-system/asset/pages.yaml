    \ which both expect a double argument, with the angle variable directly if we\
    \ could treat Angle instances as double values.\n\nThe result of the whole expression\
    \ would be a TimeSpan, which is the result type from multiplying a TimeSpan by\
    \ a number, so we’d need to access the TotalSeconds property at some point. Still,\
    \ removing the need to access the Amount and Size properties of Speed and Angle\
    \ would simplify and shorten the method’s implementation.\n\nOne way to achieve\
    \ that outcome is by defining our own implicit conversion operators. This approach\
    \ is superficially appealing because it is simple to implement, but it has several\
    \ drawbacks. Let’s examine some of those potential problems.\n\n# Implicit Conversions\n\
    \nWe define an implicit conversion for our own types by implementing an implicit\
    \ conversion operator method and specifying the target type we need, as shown\
    \ for Speed in Listing 1-12.\n\n```\npublic readonly struct Speed\n{\n    --snip--\n\
    \    public static implicit operator double(Speed speed)\n        => speed.Amount;\n\
    }\n```\n\n*Listing 1-12: Defining an implicit conversion for Speed*\n\nThe target\
    \ type here is double, and we simply return the value of the Amount property.\
    \ We also add a similar conversion operator for Angle (not shown here) that returns\
    \ its Size property. Now we no longer need to explicitly use angle.Size when calling\
    \ Math.Cos and Math.Sin, and we can multiply speed by the elapsedTime.TotalSeconds\
    \ value without needing to get the speed.Amount property. Compare Listing 1-13\
    \ with the earlier version in Listing 1-11.\n\n```\nvar x = speed * elapsedTime.TotalSeconds\
    \ * Math.Cos(angle);\nvar y = speed * elapsedTime.TotalSeconds * Math.Sin(angle)\n\
    \      - 0.5 * Gravity.Earth * Math.Pow(elapsedTime.TotalSeconds, 2);\n```\n\n\
    *Listing 1-13: Using implicit conversions*"
