    # Boxing Values and Comparing by Identity


    Values are implicitly boxed anytime we use a reference type variable to refer
    to a value type instance. Because value types have value-based equality and reference
    type variables have reference-based equality, boxing has implications for object
    identity and equality. We went to some effort to ensure that Equals and == have
    identical behavior when comparing Color instances, but when we compare Color values
    that have been boxed, Equals and == behave differently.


    To illustrate how boxing affects equality, Listing 5-19 creates two instances
    of the Color struct, but instead of having the compiler deduce the variable types
    as Color, we explicitly declare them as object, causing the values to be boxed.
    The variables aren’t equal when we use == to compare them.


