  md: '# ACKNOWLEDGMENTS


    This book has benefited greatly from the support, encouragement, and criticisms
    of many people. I’m extremely grateful to Jon Skeet, who provided honest and detailed
    feedback on all the material. Jon’s expert eye caught many of my errors and incorrect
    assumptions early on, giving me the opportunity to do better! Any errors and inconsistencies
    that remain are wholly my fault.


    Thanks also to the editorial and production teams at No Starch Press, especially
    Rachel Monaghan, Sharon Wilkey, Jill Franklin, and Sydney Cromwell, for their
    patience, diligence, and good humor.


    The list of people who have in some way contributed to the content of this book
    is extremely long because the book distills a lot of knowledge I have somehow
    accumulated over more than two decades of reading books and articles, listening
    to talks at conferences, and just talking to other programmers. To all the people
    who are habitually generous with their time and wisdom, you’re an inspiration,
    and I’m very grateful.


    More directly, thank you to these busy folks who kindly reviewed chapter drafts
    and shared their thoughts: Andy Balaam, Tim Barrass, Jack Berry, Fran Buontempo,
    Liz Chadwick, Pete Goodliffe, Richard Harris, Kevlin Henney, Jez Higgins, Jon
    Jagger, Burkhard Kloss, Will Mainwaring, Chris Oldwood, Daniel Pludowski, Richard
    Poulton, Jackie Ungerer, Emyr Williams, and Matthew Wilson.'
