    # Deciding Whether to Abstract Types


    Introducing a new type like Velocity is not always the most appropriate approach.
    For example, consider the return value from the Displacement method:


    ```

    public static (Distance, Distance) Displacement(

    --snip--

    ```


    With our discussion of using types to represent concepts, abstracting the tuple
    of Distance values as a new type may seem attractive. But we should consider several
    factors, including how the values will be used, whether there’s any domain-specific
    behavior we want to associate with an independent type, and whether adding a new
    type will increase clarity or obscure it.


    If a value is used in only a few places, creating a custom type to represent it
    may not be worthwhile, unless doing so will also reduce code duplication. If there’s
    behavior that we want to encapsulate, we’ll benefit from locating that behavior
    in one place and being able to test it in one place too.


    Whether we can give a useful name to the new type is another important consideration.
    For example, the tuple of two Distance values is similar to a coordinate point,
    with the x and y values representing distance traveled in two dimensions from
    a point of origin. However, the name Coordinate would be misleading, because the
    elements of a coordinate are positions or points rather than distances. Now that
    we’ve created a Velocity type, however, we might consider revisiting the implementation
    of Displacement to try to resolve the design problems noted earlier when we introduced
    the Distance type. Our example doesn’t warrant the extra complexity that would
    involve, so instead, we’ll take a simpler approach.


    In the value returned from Displacement, the names of the tuple components are
    more important than giving a name to a new type. Rather than defining a completely
    new type to return from Displacement, we can take advantage of rich tuple support
    in C# v7.0 and onward to directly “unpack” the return value into named variables,
    as shown in Listing 1-37.


    ```

    var (range, elevation) = Displacement(velocity, TimeSpan.FromSeconds(0.9));

    Assert.That(range.InMeters, Is.EqualTo(19.09).Within(.01));

    Assert.That(elevation.InMeters, Is.EqualTo(18.78).Within(.01));

    ```


    Listing 1-37: Unpacking tuple values


    In this example we use tuple deconstruction, giving each member of the returned
    tuple value its own name. The compiler deduces the type of the range and elevation
    variables from the values in the tuple, so in this example they’re both instances
    of the Distance type. This has the advantages of being both compact and descriptive
    enough for many purposes.'
