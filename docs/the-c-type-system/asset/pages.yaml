    # Using Alternative Number Representations


    We must always keep in mind that floating-point numbers aren''t real numbers in
    the mathematical sense, inasmuch as many real numbers can''t be expressed as a
    floating-point value. Real numbers have infinite precision, but computer memory
    is finite, so the fixed and limited precision of double and float values is a
    compromise.


    Whether the imprecision of floating-point values matters will depend on our objective.
    One alternative is to use a different representation, such as the decimal type
    that''s represented in decimal rather than binary and has a greater precision
    than a double. In practice, a decimal can represent more real numbers exactly,
    because it has a greater number of significant digits with which to represent
    them. This means decimal values are less prone to rounding. However, each type
    has its own trade-offs, and decimal isn''t a general-purpose type: it''s intended
    for calculations that are most naturally represented in decimal, such as financial
    calculations. The representation of a decimal has a smaller range than either
    float or double, so the largest positive and negative values are smaller than
    either float or double can represent. Another consideration is that a decimal
    value requires more memory than a double.


    As an example of the practical implications of choosing between double and decimal,
    consider the trigonometry methods in the Math class, such as Sin and Cos, which
    take double as their parameter and don''t provide overloads taking decimal values.
    If our code uses these methods, we can''t substitute double for decimal, because
    the decimal type is specifically designed for monetary values and thus can''t
    represent the results of trigonometric operations.


    # Handling Invalid Numbers


    Another consequence of working with double and float values is that some operations
    can produce a NaN (not a number) result, which has no numerical representation.
    When we''re using double or float values, we need to make sure we correctly identify
    when the result of a calculation is NaN, because NaN is viral: any calculation
    involving NaN produces NaN as its result. We would get a NaN, for example, if
    we tried to divide 0.0 by 0.0.


    We might expect that we could identify a NaN with a direct comparison using ==,
    as in Listing 5-5.


    ```

    var x = 0.0 / 0.0;


    Assert.That(x == double.NaN, Is.True);

    ```


    Listing 5-5: Comparing NaNs'
