    We’ll take a forensic approach to see how the compiler treats equality for different
    types and explore why there’s more to the topic of equality than just Equals and
    ==. Having more than one way to compare values underscores just how important
    this most basic comparison is. First, let’s look at how equality works for the
    built-in types.


    # Built-in Equality


    In this section, we’ll look at the basics of equality comparisons between C#’s
    built-in types—including integers and floating-point numbers, reference variables,
    and arrays—and how some built-in types override the default behavior of equality.


    > NOTE The convention equals-equals, or double-equals as it’s sometimes known,
    is used by several languages to distinguish the comparison for equality from the
    assignment operator =, which is just equals. JavaScript has a third variation,
    equals-equals-equals, to check that two variables have the same type and value.


    Because every type in C# inherits the Equals method from object, we can compare
    any two variables with that method. However, using == to compare variables of
    the built-in types is more efficient and may even result in different behavior
    than using Equals, as you’ll soon see.


    Equality comparisons using == are baked into the CLR for all the intrinsic types—that
    is, all the numeric types except decimal (which has built-in compiler support
    but isn’t a native CLR type), the char and bool types, and references. The CLR
    has a built-in instruction to compare two intrinsic values, so we can always compare
    those values with ==, and it’s as efficient as it could possibly be.


    # Whole Numbers


    The built-in integral types—int, short, long, and byte—represent whole numbers,
    and the char type represents UTF-16 characters. They all have the same behavior
    for the purposes of equality comparison. Values of bool type, while not strictly
    speaking numeric values, are compared the same way too. Listing 5-1 compares two
    integer values by using the == operator.


    ```

    int x = 10;

    int y = x;


    Assert.That(x == y, Is.True);

    ```


