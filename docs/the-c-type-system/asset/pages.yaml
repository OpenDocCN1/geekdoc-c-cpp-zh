    \ of the Coordinate value type and returns an object reference to it. The returned\
    \ value is a reference to a Coordinate that has been boxed.\n\n```\npublic readonly\
    \ struct Coordinate\n{\n    public int X { get; init; }\n    public int Y { get;\
    \ init; }\n\n    public object Clone()\n    {\n        var item = new Coordinate\
    \ { X = this.X, Y = this.Y };\n        return item;\n    }\n    --snip--\n}\n\
    ```\n\nListing 4-10: Returning a reference to a boxed value type variable\n\n\
