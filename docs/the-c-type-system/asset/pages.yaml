  md: 'You know from previous chapters that copying references is always a cheap operation,
    because it doesn’t also copy the instance. When we copy a value type instance,
    however, the value of each field is also copied, costing time and memory space,
    especially if the instance consists of several fields. Knowing when copying might
    occur, then, may help us identify opportunities to avoid some copies, thereby
    improving our program’s memory usage and speed.


    The relative cost difference between copying a reference and copying an instance
    is part of the rationale behind the common advice to make value types small. However,
    the cost of copying is only one part of the story. Copying value type instances
    around is usually cheap, although some pathological cases may be cause for concern,
    but working with a copy might also have semantic implications. In particular,
    if we haven’t noticed that we’ve made a copy, we might be surprised that changes
    we’ve made to a value aren’t visible in the way we expect. Correspondingly, unexpected
    changes to an instance that have occurred using a copied reference can be the
    cause of subtle problems.


    # Copying by Simple Assignment


    The differences in copy behavior of value types and reference types can have subtle
    consequences that can be hidden in apparently simple expressions that make a copy.
    The simplest example of copying occurs as the result of assignment:


    ```

    var copy = existing;

    ```


    Assigning the value of one variable to another like this is called simple assignment,
    and the left side—the target of the assignment—must be either a variable, or a
    property or indexer with an accessible set accessor. The right side is an expression,
    which describes anything that can be evaluated to produce a value. The expression
    might be a simple value like a literal or an enum member, another variable, or
    a more complex expression, such as a call to a method.


    Both variables and values are associated with a type. Since in the preceding example
    we use type deduction for copy with the var declaration, the compiler deduces
    the type of the copy variable from the type of the value of existing. The type
    of the target variable doesn’t necessarily need to be identical to the type of
    the value being assigned. If we specify a different type for the target variable,
    the type of the value on the right must be implicitly convertible to the type
    of the variable on the left.


    We can try to explicitly coerce the value to the target type by using an explicit
    cast, which you saw in Chapter 2. For example, a double can be explicitly cast
    to an int, although the conversion may lose information because the value is truncated.
    If the compiler detects that an explicit conversion can never succeed, such as
    from a string to an int, the code won’t'
