- pgno: 245
  md: "# Equality Comparisons and Type Substitution\n\nWe’ve used a suite of tests\
    \ to reassure us that the equality contract is intact for both Color and TranslucentColor\
    \ when we’re using variables whose dynamic (run-time) instance type is the same\
    \ as their static (compile-time) variable type. However, the types might not always\
    \ match. The compiler allows us to pass a reference to a TranslucentColor anywhere\
    \ a Color reference is required because Color is a direct base class of TranslucentColor.\
    \ In other words, the Color type can be substituted by a TranslucentColor. At\
    \ run time, any Color reference may, in fact, refer to a TranslucentColor instance.\n\
    \nTo illustrate the effect on equality of using a base class reference to a derived\
    \ class instance, Listing 7-9 explicitly uses a Color base class reference to\
    \ declare two TranslucentColor values that aren’t equal because their Alpha properties\
    \ differ.\n\n```\nColor pencil = new TranslucentColor(0xFF, 0, 0xFF, 0x77);\n\
    Color crayon = new TranslucentColor(0xFF, 0, 0xFF, 0);\n\nAssert.That(pencil ==\
    \ crayon, Is.False);\n```\n\nListing 7-9: Testing equality from the base class\n\
    \nThis test fails: the pencil and crayon variables compare equal even though the\
    \ instances have different values. It makes no difference whether we compare the\
    \ variables with == or call the Equals method; the outcome is the same.\n\nThe\
    \ static types being compared are Color variables, so what’s invoked here is the\
    \ base class implementation of operator==, which in turn calls the Equals method.\
    \ The Equals method in Color knows nothing about the Alpha property of TranslucentColor,\
    \ so Equals determines equality by using only the Red, Green, and Blue properties.\
    \ Those properties are all identical, so according to Color.Equals, the two objects\
    \ are equal.\n\nThose are the mechanics that explain why our pencil and crayon\
    \ variables incorrectly compare equal, but type substitution isn’t always so easy\
    \ to spot, and its consequences are far-reaching.\n\n# The Effects of Type Substitution\n\
    \nWe would rarely explicitly use a Color reference for a TranslucentColor object,\
    \ but we can use a TranslucentColor reference as an argument to a method with\
    \ a Color parameter. We can substitute a TranslucentColor when a Color is expected.\n\
    \nListing 7-10 shows that if we pass two references to TranslucentColor objects\
    \ that differ only in their Alpha values to a method with Color parameters, those\
    \ parameter variables compare equal within the method. If we pass the same two\
    \ references to a method that takes TranslucentColor parameters, the values won’t\
    \ compare equal even though they haven’t changed.\n\n```\nbool EqualViaBase(Color\
    \ left, Color right)\n    => left.Equals(right);\n\nbool EqualViaDerived(TranslucentColor\
    \ left, TranslucentColor right)\n    => left.Equals(right);\n```"
