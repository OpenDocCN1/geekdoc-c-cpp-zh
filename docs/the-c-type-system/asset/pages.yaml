    \ instance is copied in full to the target variable. This behavior applies only\
    \ to user-defined constructors of struct and record struct types; the default\
    \ constructor for a value type simply default-initializes each field and thus\
    \ doesn’t require a hidden copy.\n\nAs we saw with object initialization, the\
    \ hidden __temp variable prevents a partially constructed instance from ever being\
    \ observable. In practice, the compiler can typically optimize away the hidden\
    \ instance altogether, but in some circumstances, such as when constructing an\
    \ instance might fail with an exception, a hidden copy can’t be avoided. Consider\
    \ the Brush class in Listing 4-8, whose background field is initialized using\
