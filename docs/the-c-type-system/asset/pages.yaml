- pgno: 275
  md: '+   - How to evaluate code performance and target its bottlenecks

    +   - When making small optimizations may be worth the trouble


    # Measuring and Optimizing Performance


    The term optimization is often used to mean altering code to make a program run
    more quickly, but we might want to optimize for many other outcomes: lower memory
    use, higher numeric calculation precision, increased data throughput, and ease
    of deployment, to name just a few. Sometimes we trade raw performance for code
    readability or even convenience. We may decide that making our code easy to test
    is more important than making the program run at maximum speed. However, optimizing
    for one area can often adversely affect one or more other areas of an application,
    so we must make sure that the potential benefits are worth the cost and that our
    efforts aren’t actually leading to pessimization: writing or using code that prevents
    a program from running efficiently.


    The easiest and most direct method for optimizing a program’s performance is to
    enable optimizations in the build configuration. A release build configuration
    has optimizations enabled by default. When building the debug configuration, the
    compiler generates code that closely matches the source code’s structure and logic,
    which allows for setting diagnostic features like breakpoints, step-by-step debugging,
    and inspecting variables. The optimizations enabled in a release build may change
    the code’s logical structure in subtle ways, making debugging much more difficult
    but potentially improving the code’s efficiency or reducing the program’s size.


    The C# compiler itself performs very little in the way of optimizing the code,
    leaving the majority of that work to the JIT compiler.


    # The JIT Compiler


    The C# compiler translates our C# code into CIL format, which in turn is translated
    to native machine code either ahead of time (AOT) by a tool such as the CrossGen
    utility or at run time by the JIT compiler, the latter being the default. In normal
    operation, the JIT compiler translates the program piecemeal; rather than producing
    the machine code for the entire program all at once before running it (as AOT
    tools do), the JIT compiler translates portions of the CIL to native format just
    in time. A portion would generally be a method, but in principle it could be part
    of a method, such as a loop or if block.


    Because JIT compiler optimizations occur during a program’s execution, they’ll
    vary among platforms and run-time environments. While AOT compilation may improve
    a program’s startup time, the JIT compiler can take advantage of optimizations
    specific to a particular CPU, register set, operating system, and program state
    to produce efficient code on the fly.


    One common optimization is to inline the code within a method, avoiding the overhead
    of a method call. The JIT compiler may also be able to replace some method calls
    with native intrinsic CPU instructions, further'
  merge: -1
