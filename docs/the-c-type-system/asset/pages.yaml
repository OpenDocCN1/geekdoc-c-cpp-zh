    # Figure 1-1: Projectile displacement


    The angle, initial speed, and time labels in Figure 1-1 correspond to the t, v,
    and s parameters for Displacement, respectively. The x and y values correspond
    to the components of the tuple returned by that method. The projectile is launched
    with an initial speed, at a particular angle, and follows a well-defined ballistic
    arc. The Displacement method calculates the projectile’s position on that arc
    after a given amount of time has passed.


    We won’t go into the algorithm being used here, as our focus is merely on making
    the purpose of this method more immediately clear. The first barrier to our understanding
    of the Displacement method is the meaning of its parameters and return value.


    I have deliberately exaggerated the issue with single-letter names, but I’ve seen
    similar examples in the real world and thought, What on earth do those parameters
    represent? Even if we carefully inspect how the parameters have been used, determining
    their meaning requires being familiar with the equations. That is just poor code
    craft. Not all of us have kept up with our ballistics studies.


    We want to make it as easy as possible for the reader to determine the purpose
    of the method, whether they’re familiar with the topic or not. The quickest way
    to accomplish this is to ensure that the parameter names better reflect what they
    represent. In particular, code should avoid relying on specialist jargon. The
    t here stands for theta, which is typically used in physics to represent the magnitude
    of an angle, but even if we replaced t with the full word theta, readers unfamiliar
    with this mathematical convention would be unlikely to make that connection.


    Instead of using potentially obscure single-letter names, let’s give the parameters
    names that properly signify their meaning:


    ```

    public static (double, double)

    Displacement(double angle, double speed, double elapsedTime)

    {

    --snip--

    ```


    By renaming t as angle, v as speed, and s as elapsedTime, we’ve made their purpose
    clearer. Changing velocity to speed might seem a minor'
