  md: 'when we talk to other people working on the same project, the names we use
    match the names in the code.


    Using a specific named type instead of a built-in primitive type also prevents
    simple errors, such as mistakenly using a temperature value when we mean to use
    a length. If, for example, we pass an instance of a Temperature type to a method
    expecting a Length, the program won’t compile. Such errors are easy to miss when
    we use built-in types like double to represent values for both length and temperature.


    Other value candidates are less easily represented with primitive types because
    they consist of multiple components. Types to represent concepts such as currency
    rates of exchange, color spaces, Cartesian coordinates, and telephone numbers
    each have several related parts. Still, they all represent distinct abstractions
    to which we can give meaningful names like FxRate, Color, Coordinate, and PhoneNumber.


    The names we give our types should provide vital information about their purpose.
    We could collect the red, green, and blue components of an RGB color space into
    a simple tuple type, but it would be hard to distinguish such a value from a tuple
    containing the x, y, and z components of a three-dimensional coordinate value.
    Creating separate user-defined types for Color and Coordinate makes our code easier
    for other programmers to understand.


    When we use the name of an abstraction, we’re implicitly referring to the behavior
    associated with that abstraction. The name becomes shorthand for the concept and
    is most easily understood when the type representing that abstraction is a single,
    cohesive idea and its behavior is well encapsulated. Value types are a rich vein
    for exploring those ideas, although the same principles apply for all types.


    # Encapsulation and Cohesion


    When we’re designing our own type, beyond giving it a name that conveys its purpose,
    it’s also beneficial to collect the behavior that’s appropriate for the abstraction
    we’re modeling. This is what’s commonly meant by encapsulation: assembling the
    object’s data and the methods that support it. However, encapsulation is much
    more than just adding member methods; we also need to keep in mind a type’s cohesion,
    which is a much less tangible concept.


    A type is cohesive if the operations defined for it all work together to provide
    a well-defined and sensible interface for using instances of the type. In other
    words, cohesion means that the concept of the type makes sense as a whole. In
    this context, we’re talking about whether other programmers find a type easy to
    comprehend. The compiler cares only about what’s syntactically correct, but we’d
    likely be surprised to find a method for converting a string to uppercase on a
    type mostly concerned with money.


    A type is more than just a place for defining methods; those methods should contribute
    to the abstraction we’re trying to represent. Conversely, as mentioned earlier,
    a type with no behavior at all, such as the Speed type in Listing 6-9, is often
    simplistic.'
