- pgno: 249
  md: 'The Subtract method shown in Listing 7-11 mitigates both of these potential
    problems by using the nullable reference type feature available since C# v8.0.
    The return type of the base Subtract method is non-nullable, and the compiler
    will warn us if we override it with a method having a nullable reference type
    or if that method attempts to return a null reference. Similarly, the parameter
    to the Color.Subtract method is a nullable reference, indicating that null is
    an acceptable argument. If we override the method with a non-nullable reference
    type, the compiler will warn us that the method signature doesn’t match the base
    declaration.


    Note that if the base method returns a nullable reference and we override it to
    return a non-nullable reference, the compiler won’t give a warning. That is because
    in this case we’re strengthening the behavioral contract in the derived method,
    and it’s entirely reasonable for the more derived method to prohibit null, even
    if the base method allows it. The requirements on any code calling the method
    from a base type reference aren’t affected.


    Likewise, the compiler is silent if the base method has a non-nullable parameter
    and we override it to allow a null reference to be passed to the derived method,
    because weakening the parameter’s contract in the more derived type is safe and
    reasonable. The change is visible only to code using the more derived type directly
    rather than via a base type reference.


    # Upholding a Type’s Contract


    Our test for equality using base class references in Listing 7-9 fails because
    the contract for Color.Equals isn’t properly fulfilled by the derived class. The
    expectations set out by Color aren’t met by TranslucentColor, which imposes a
    new requirement on Equals because equality between TranslucentColor instances
    must also compare the Alpha property. Our test fails as a direct result of our
    using implementation inheritance and expecting type substitutability, when in
    fact TranslucentColor isn’t substitutable for a Color. The implications of implementation
    inheritance apply to all inheritance relationships, not just when we’re modeling
    value semantics.


    Upholding a type’s contract matters in practical ways. The behavior of an inherited
    method is part of that contract, and failing to uphold it can result in extremely
    hard-to-diagnose errors. If we fail to meet the interface contract of a base class—for
    instance, by using a different signature in an overridden method—the compiler
    will inform us with an error. However, the compiler can’t check that we’ve also
    kept the behavioral promises of a base class. Here we must use our own judgment,
    and that’s not necessarily as straightforward as it might seem.


    One rule of thumb is to avoid implementation inheritance whenever we use inheritance.
    The simplest way to be certain of that is to never derive from a class that has
    any concrete behavior—including abstract classes with any nonabstract methods.
    Types defined with the interface keyword can’t have any implementation, and any
    class implementing an interface is a true subtype.


    Another rule is that value types implemented as classes shouldn’t inherit from
    anything and should be sealed. In fact, this second rule'
