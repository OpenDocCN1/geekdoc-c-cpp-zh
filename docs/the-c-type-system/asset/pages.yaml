  md: "# References to References\n\nWhen a reference variable goes out of scope,\
    \ the instance it represented still exists on the heap until it is garbage collected.\
    \ We can, therefore, safely return a reference to an instance field from a property\
    \ or method of a class or a record. In fact, holding such a by-reference variable\
    \ prevents the instance from being garbage collected. In Listing 3-32, we take\
    \ a reference to an instance field of a local reference type object and return\
    \ it.\n\n```\npublic ref readonly Address GetAddress()\n{\n    var local = new\
    \ Mail(\"G Lad Esq.\",\n        new (\"62 West Wallaby Street\", \"Wigan\", \"\
    Lancashire\", \"WG7 7FU\"));\n\n    ref readonly var address = ref local.Destination;\n\
    \    return ref address;\n}\n```\n\nListing 3-32: Returning a reference to a field\
    \ of a local object\n\nThe compiler accepts this code, and it’s safe to use this\
    \ method, although we should certainly be cautious because this technique relies\
    \ on a somewhat esoteric feature of the garbage collector. When GetAddress returns,\
    \ the local variable goes out of scope, leaving no live reference variables directly\
    \ to the Mail instance created inside the GetAddress method. Normally, that instance\
    \ would then become eligible for garbage collection, making the by-reference return\
    \ value a dangling reference. However, the returned by-reference variable is enough\
    \ to prevent the garbage collector from destroying the Mail instance, so holding\
    \ a by-reference variable to one of its fields remains valid.\n\nBehind the scenes,\
    \ a by-reference variable or parameter to a field within a class or record instance\
    \ represents a managed pointer. Managed pointers are an implementation detail\
    \ of the CLR, but the takeaway here is that they’re tracked by the garbage collector\
    \ and considered object roots—simply put, references or managed pointers to objects\
    \ known to be live when the garbage collector runs. Those objects, in turn, may\
    \ contain references to other objects on the heap, so the chain of references\
    \ forms a graph of objects currently in use at the time the garbage collector\
    \ runs.\n\nThe garbage collector uses object roots to determine whether object\
    \ instances can be collected: any instance it can’t reach from an object root\
    \ by following the object graph is eligible for collection, and any object that\
    \ is reachable survives. Storing a ref local variable is enough to keep the owning\
    \ object from being garbage collected.\n\nWe can always safely return a by-reference\
    \ parameter variable by reference because the variable aliased by the parameter\
    \ must be in scope for the calling code. Strictly, the scope of the variable includes\
    \ the method accepting the parameter by reference, as shown in Listing 3-33."
