    \ message makes little sense, and ordering them by severity isn’t necessary for\
    \ our use case.\n\nThe `TimeStamp` property of `LogEntry` is a `DateTime` instance,\
    \ which itself implements the `IComparable` interface, so Listing 6-18 implements\
    \ `CompareTo` for `LogEntry` simply by comparing only the `TimeStamp` properties.\n\
    \n```\npublic readonly record struct LogEntry(DateTime TimeStamp,\n    Severity\
    \ Level,\n    string Message)\n: IComparable<LogEntry>\n{\n    public int CompareTo(LogEntry\
    \ other)\n        => TimeStamp.CompareTo(other.TimeStamp);\n}\n```\n\n*Listing\
