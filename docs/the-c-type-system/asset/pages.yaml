  md: '# 1


    # MAKING THE MOST OF THE TYPE SYSTEM


    ![](img/47f0004b0ac0322f285ca59a19bca333_26_0.png)


    Clear and readable source code matters much more to humans than it does to computers.
    Whether we’re trying to debug existing code or learning to use a new feature,
    we inevitably find ourselves reading through source code. It’s important to ensure
    that our code is as readable as possible so that its meaning is clear to other
    readers. Code that’s hard to follow or easily misunderstood is a breeding ground
    for errors.


    One way to improve the clarity of our code is to use the type system to our advantage
    by creating our own types and giving them names that clearly describe their purpose.
    Good names are important for all the types in a system, but it’s easy to neglect
    the simple value types that represent an application’s most granular information.


    In this chapter, we’ll examine a short but unclear piece of code and improve it
    over several iterations through a series of techniques that will'
