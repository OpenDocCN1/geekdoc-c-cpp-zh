  md: "# Copying Large Instances\n\nCopying a simple struct type such as the IntField\
    \ struct in Listing 8-15 is no more expensive than copying a plain int value;\
    \ a simple test (not shown here) that compares two sequences of int values will\
    \ confirm it. The IntPlus3x16 struct in Listing 8-17, which adds three entirely\
    \ redundant Guid fields, is significantly larger than the IntField struct. Each\
    \ Guid is 16 bytes, making this struct somewhat larger than even the most generous\
    \ recommended limit for the size of a value type.\n\n```\npublic readonly struct\
    \ IntPlus3x16 : IEquatable<IntPlus3x16>\n{\n    public IntPlus3x16(int value)\n\
    \        => this.value = value;\n\n    public bool Equals(IntPlus3x16 other)\n\
    \        => value == other.value;\n\n    private readonly int value;\n\n    private\
    \ readonly Guid _padding1 = Guid.Empty;\n    private readonly Guid _padding2 =\
    \ Guid.Empty;\n    private readonly Guid _padding3 = Guid.Empty;\n}\n```\n\nListing\
    \ 8-17: Creating an extremely large struct\n\nNote one subtlety in the IntPlus3x16\
    \ struct: the Equals method doesn’t consider any of the Guid fields of the type,\
    \ because they’re always all identical in any case. The reason is that we’re trying\
    \ to measure just the cost of copying, so this Equals method performs precisely\
    \ the same operations as the IntField type in Listing 8-15. While the padding\
    \ fields play no part in the Equals method or any other operation, the IntPlus3x16\
    \ type is a struct and therefore copied by value, so every field will be copied.\
    \ We run the same test from Listing 8-16, with the results shown in Table 8-14.\n\
    \n# Table 8-14: Measuring the Cost of Copying an Extra-Large Struct\n\n| Method\
    \ | Time (ms) | Signature |\n|---|---|---|\n| 52.5% SequenceEqual | 228 | System.Linq.Enumerable.SequenceEqual(IEnumerable,\
    \ IEnumerable) |\n| 2.71% Equals | 12 | IntPlus3x16.Equals(IntPlus3x16) |\n\n\
    Compare Table 8-14 with Table 8-13: the time spent in the Equals method is identical\
    \ in both reports, although the SequenceEqual method has taken over twice as long\
    \ to complete because of the extra overhead of copying the instances of the larger\
    \ IntPlus3x16 type. The Equals method in both tests is performing the same operation,\
    \ so the increase in time must be entirely due to the cost of copying instances."
