    \ Color(0xFF, 0, 0);\n\nAssert.That(pencil == crayon, Is.True);\n\npencil = new\
    \ Color(0, 0xFF, 0);\n\nAssert.That(pencil != crayon, Is.True);\n```\n\nListing\
    \ 7-6: Testing that equality is stable\n\nSince Color’s properties are immutable,\
    \ we can change the value of pencil only by assigning it to a new instance. However,\
    \ the effect is the same as if we had mutated one or more of the properties, because\
    \ we have arranged for Color instances to be compared by value.\n\nWe have one\
    \ other requirement for the Equals method and its operator counterparts: they\
    \ must never throw an exception. Our implementation has no danger of that, since\
    \ we have already tested that it is safe with null.\n\n# Equality Behavior in\
    \ Derived Classes\n\nThe next step is to implement equality for the derived TranslucentColor\
    \ class, which, as we know, inherits all the methods and properties from Color.\
    \ Since TranslucentColor is a value-like type, it should implement the IEquatable<T>\
    \ interface for itself, substituting the T for TranslucentColor. As Listing 7-7\
    \ shows, implementing IEquatable<TranslucentColor> is a little simpler than the\
    \ Color base class, which already does most of the work.\n\n```\npublic class\
    \ TranslucentColor : Color, IEquatable<TranslucentColor>\n{\n    public int Alpha\
    \ { get; }\n\n    public bool Equals(TranslucentColor? other) ①\n        => base.Equals(other)\
    \ && Alpha == other.Alpha;\n\n    public override bool Equals(object? obj)\n \
