    Listing 4-9: Cloning a record instance by using with


    Cloning an instance by using non-destructive mutation means that the original
    instance is preserved while the copied instance is changed. In Listing 4-9, the
    cloned variable orange takes all the properties from pink except the Blue property,
    which is explicitly given the value 0.


    The same syntax can be used to copy structs and record structs and provides a
    convenient way to set init-only properties on the target variable. Record types
    have an additional benefit because they’re reference types and thus don’t have
    the copy-by-value semantics of a true value type. If we just assign a record variable
    to another variable, we still get two references to the same instance, as shown
    here:


    ```

    var black = pink;

    Assert.That(ReferenceEquals(black, pink), Is.True);

    ```


    If the pink variable were a value type, black would be a copy of the instance.
    The with keyword always copies an instance, regardless of whether it’s a value
    type or reference type.


    Just as with object initialization, the compiler creates a hidden temporary instance
    and sets its properties before copying it to the target variable. Non-destructive
    mutation differs from object initialization in that, for records, the new instance
    is created using a virtual compiler-generated Clone method. This method is essential
    because, by default, positional records like the Color record in this example
    do not have an accessible parameterless constructor.


    Record structs and structs can always be constructed without arguments and are
    always copied by value, meaning they don’t have or need a'
