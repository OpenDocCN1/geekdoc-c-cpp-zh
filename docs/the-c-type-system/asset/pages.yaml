    \ = new Color(0, 0xFF, 0);\n\nAssert.That(blue < green, Is.True);\n```\n\nIf we\
    \ had made the conversion operator implicit in Color, this code would compile\
    \ but would compare two int values, probably with unexpected results.\n\nThe cast\
    \ to int in Listing 7-36, while explicit and obvious in the code, doesn’t say\
    \ much about the intention behind the conversion, which is implied to some extent\
    \ by the use. We might consider replacing an explicit outward conversion like\
    \ this with a method or property that more definitively describes the intent of\
    \ the conversion, perhaps by calling it ToWebColor.\n\nNaming the conversion allows\
    \ us to better express what we mean and why, making the code more self-documenting\
    \ without being overly intrusive or syntax-heavy compared to an explicit cast.\
    \ One frequently overlooked consequence of using a named property instead of a\
    \ cast is that the property name is easier to search for, should we need to find\
    \ everywhere it’s used.\n\n# For Purpose\n\nConversion operators, even implicit\
    \ conversions, aren’t exclusively a bad choice. Conversions are commonly used\
    \ to allow a value to be represented by unrelated types that support different\
    \ operations, although the value itself has a common representation. For example,\
    \ Color is an immutable value type, but we might want to build up its value incrementally.\
    \ A Color has multiple properties, and sometimes setting them individually might\
    \ be more convenient than setting them all at once in a constructor."
