    \ during testing so that the testing doesn’t need access to an external or expensive\
    \ resource, such as a real database.\n\nWhen value types implement one or more\
    \ interfaces, it’s to define specific protocols, such as IEquatable<T> and IComparable<T>,\
    \ rather than to allow client code to use different implementations. Value types,\
    \ no matter the mechanism we use to implement them, should stand alone and be\
    \ largely, if not wholly, independent of other types in an application.\n\nThe\
    \ advice to avoid implementation inheritance leads to the recommendation that\
    \ records should always be sealed, because they’re specifically designed for modeling\
    \ value types. Classes should also be sealed by default, whether or not we’re\
    \ using them to model values, and inheritance enabled only when we have a specific\
    \ design rationale for it.\n\nAlthough this advice might seem to limit the flexibility\
    \ of our designs, we can use other ways to define relationships in our code without\
    \ deriving new types from existing ones. Inheritance isn’t the only option for\
    \ reusing the implementation of an existing type to extend its capabilities.\n\
