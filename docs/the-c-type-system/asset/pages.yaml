  md: '# About the Author


    Steve Love is a professional developer with over 20 years of experience using
    C# in a wide range of industries, including logistics, public services, and finance.
    He is the editor of *C Vu*—the members’ journal of the ACCU (https://accu.org)—as
    well as a frequent speaker at conferences.


    # About the Technical Reviewer


    Jon Skeet is a staff software engineer for Google, working on the .NET client
    libraries for Google Cloud Platform. He’s a regular contributor to Stack Overflow,
    the creator of the .NET date/time library Noda Time, and the author of *C# in
    Depth*, now in its fourth edition. Jon loves diving into all aspects of C# and
    occasionally twisting it horribly out of shape.'
