- pgno: 114
  md: 'The direct effect of the TryRemote method is the bool return value indicating
    the success or failure of initializing its output parameter. We use the return
    value to determine whether the connection variable has been initialized; in other
    words, the direct effect tells us whether the side effect was successful. In this
    case, a connection exists between the side and direct effects of TryRemote, but,
    as with other TryXXX methods, the direct effect seems secondary to the side effect!


    Methods with by-reference parameters, and more generally those that rely substantially
    on operating by side effect, often result in very procedural code comprising a
    set of logical steps or instructions to accomplish a task. Procedural solutions
    are described as imperative code because they’re an explicit sequence of instructions
    to be processed to achieve a result. The contrasting approach is declarative code,
    which emphasizes outcomes over specific implementation. A more declarative approach
    pulls the focus away from how things get done and allows us to concentrate instead
    on the outcomes.


    One aspect of a declarative style is that we attach more importance to the direct
    effect of a method and make a clear separation between a method’s inputs and its
    output.


    We could make our TryRemote method in Listing 3-19 more declarative by removing
    the out parameter and returning the required DataStore reference directly; since
    DataStore is a reference type, we can return null if the TryRemote method fails.
    However, the side effects associated with by-reference parameters aren’t really
    an issue when those parameters are reference types. Reference types are often
    mutable—by design, and for good reason—and the fact that multiple variables can
    refer to a single instance is often desirable behavior, as you saw in “Reference
    Variables and Aliasing” on page 74. The benefits of declarative code are much
    more important when we’re using value types, which should be immutable.


    # Mutation vs. Creation


    A method that uses ref and out parameters is giving a strong signal that those
    parameters will change within the method. Since such parameters are aliases for
    the variables passed as arguments to them, we need to pay attention to which variables
    may be changed. Unexpected modifications to variables can cause errors that are
    hard to identify, especially in code that uses multiple threads. If we follow
    the common advice to make our own value types immutable, we reduce the likelihood
    of such problems occurring, which means we should also avoid mutable by-reference
    parameters of value type. Then, there’s only one way that a value type variable
