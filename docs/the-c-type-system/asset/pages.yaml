  md: 'those arguments are passed by reference. Might the preference for returning
    values over using ref or out parameters affect the efficiency of our code?


    For values with several fields, avoiding the copying might well represent a net
    performance gain, but we should also consider the impact of our choices on human
    readers. It might seem attractive to use by-reference parameters to avoid copying
    large values, except that using a ref or out parameter strongly implies that the
    argument passed is likely to change. If we want our code to be as self-documenting
    as possible, using ref parameters as an optimization might be surprising.


    Rather than using the mutable out or ref parameters, we can use in parameters,
    which are immutable by-reference parameters. Arguments for in parameters are passed
    by reference in exactly the same way as ref and out arguments, but an in parameter
    variable is read-only within the method. In the next section, we’ll explore how
    to avoid copying value type method arguments by using read-only reference parameters,
    as well as how to return values by reference.


    # Read-Only References and Returning by Reference


    Read-only references and returning by reference are related concepts, and both
    can help us reduce the number of copies of value type instances in our code. First
    we’ll look at read-only reference parameters, which we denote using the in keyword
    on a method parameter. The in modifier, like the ref and out modifiers, makes
    a by-reference parameter, but, unlike ref or out parameters, it prevents the value
    of the underlying variable from being changed. In other words, an in parameter
    variable is immutable. Using in parameters when we’re passing large value type
    instances as arguments might be beneficial because we avoid copying the instance.


    Technically, we can also pass a reference to an in parameter, but there’s no reason
    to do so. Passing a reference by reference is useful only if we need to change
    the reference to refer to a new instance. For that to work, we need a ref or out
    parameter. No performance benefit is associated with passing a reference by reference,
    as there may be with value types.


    Listing 3-22 shows a simple expression-bodied method, DistanceInKm, that calculates
    a distance from its speed and time parameter values, both of which are value types.


    ```

    public double DistanceInKm(in Speed speed, in TimeSpan time)

    => speed.InKmh * time.TotalHours;

    ```


    Listing 3-22: Read-only reference parameters


    Both the speed and time variables use the in modifier, making them read-only reference
    parameters in the DistanceInKm method. Since the parameter variables are read-only,
    the compiler will reject any attempt to set mutable properties, change public
    fields, or assign a new value to either of them.'
