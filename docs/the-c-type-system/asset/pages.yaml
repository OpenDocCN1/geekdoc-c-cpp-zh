    # The Iterator Approach


    Iterators are a fundamental part of C# and underpin other higher-level features,
    including LINQ. In fact, LINQ has become so ubiquitous in modern C# that it can
    be easy to forget that it’s based on two system interfaces: the IEnumerable<T>
    interface, which is an abstract view of a sequence of elements of type T, and
    the IEnumerator<T> interface, which represents an iterator that can get each element
    of an IEnumerable<T> one at a time. The basic mechanics are that the IEnumerable<T>
    interface has a single method named GetEnumerator that returns an implementation
    of IEnumerator<T>.


    Both interfaces are largely hidden in modern code, although IEnumerable<T> remains
    important as the protocol for types that represent sequences and as the home of
    the extension methods, such as Select and Where, that make up most of the LINQ
    system.


    The IEnumerator<T> interface also forms the basis for the foreach loop, which
    is one way of enumerating the elements of a sequence that'
