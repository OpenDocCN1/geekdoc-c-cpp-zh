    We’ll explore the following:


    +   - How *reference* and *by reference* differ in meaning

    +   - Why aliasing and mutability are so closely related

    +   - How avoiding side effects can make our code clearer

    +   - When to pass values by reference as an optimization


    Passing method parameters by value or by reference isn’t the same as those parameters
    being value or reference types. In other words, the parameter’s type (value or
    reference) differs from how the method uses that parameter (by value or by reference).
    *Passing* in this context refers to'
