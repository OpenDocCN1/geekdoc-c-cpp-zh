    \ and what assumptions it makes.\n\n# Automatic vs. Nonautomatic Properties\n\n\
    Although the properties of both the Speed and Angle types in Listing 4-28 are\
    \ get-only, they differ in the way they’re implemented. The InRadians property\
    \ of Angle is an automatic property, meaning the compiler introduces a hidden\
    \ backing field for it and generates the implementation of the get accessor to\
    \ obtain the field’s value. If we had also specified a set accessor for InRadians,\
    \ the compiler would generate the corresponding implementation to set the backing\
    \ field’s value.\n\nBy contrast, the InMetersPerSecond property of Speed is an\
    \ expression-bodied property, meaning it returns the value of an explicitly declared\
    \ private field. An expression-bodied property is equivalent to a nonautomatic\
    \ property with no set accessor, like this:\n\n```\npublic double InMetersPerSecond\n\
    {\n    get { return amount; }\n}\n```\n\nWe’d normally understand this to be a\
    \ read-only property, since we can’t usually change the value of a property with\
    \ no set accessor. However, C# has no rule that says get accessors can’t modify\
    \ the fields of a type; it’s merely a convention. Within BallisticRange, the InMetersPerSecond\
    \ property is accessed via an immutable reference; if the get accessor did indeed\
    \ modify the value of the parameter, that change would be visible outside the\
    \ BallisticRange method because the argument was passed by reference.\n\nIf the\
    \ parameter variable is supposed to be immutable, as with in parameters, the compiler\
    \ must satisfy itself that using the variable in any way won’t change its value.\
