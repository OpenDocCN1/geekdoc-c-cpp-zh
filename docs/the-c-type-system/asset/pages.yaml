  md: 'the mechanism for supplying values to a method’s parameters and receiving the
    result the method returns.


    Before we get into those distinctions in detail, let’s look at how method parameters
    and arguments work.


    # Method Parameters and Arguments


    As explained in Chapter 2, method parameters are a particular kind of variable.
    A parameter variable is declared with a name and explicit type in the method’s
    definition and goes out of scope when the method ends. If the method is defined
    in a generic type or the method itself is generic, the parameter type can be generic.
    When we call the method, we pass arguments to each parameter.


    C# has four kinds of method parameters:


    # Value parameters


    The most common kind of parameter, value parameters, behave as if they’re local
    variables in the method. A value parameter is initialized with the value of the
    argument passed to it.


    # Reference parameters


    These parameters take the ref modifier, signifying that they’re passed by reference.
    The arguments passed also use the ref modifier to reinforce that the argument
    and the parameter both refer to the same memory location.


    # Output parameters


    These are parameters that use the out modifier, meaning they’re given a new value
    by the method. Output parameters are also passed by reference. As with the ref
    modifier for reference parameters, we use the out modifier for both the argument
    being passed and the parameter.


    # Input parameters


    This special kind of reference parameter uses the in modifier to indicate that
    its value doesn’t change within the method. Unlike ref or out parameters, the
    argument passed to an input parameter doesn’t require the in modifier, because
    in is designed to be transparent to calling code.


    Reference, output, and input parameters are special variables in that they indicate
    a level of indirection to an actual variable. They are known collectively as by-reference
    parameters.


    When we call a method, the arguments we pass populate the parameters we’ve declared
    for that method. When the parameter is a value parameter, our argument for it
    is passed by value. When the parameter is any of the by-reference parameters,
    our argument is passed by reference.


    # Reference Types vs. By-Reference Parameters


    By-reference parameters are sometimes confused with reference type variables,
    in part because the phrase pass by reference is often used along with its'
