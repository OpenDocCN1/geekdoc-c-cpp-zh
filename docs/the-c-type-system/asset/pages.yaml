    from any valid values for int. We can use a nullable variable for any value type,
    not just built-ins. The default value for a nullable is null, as shown here:


    ```

    ```csharp

    int? x = default;

    int? y = null;


    Assert.That(x.Equals(y), Is.True);

    ```

    ```


    This test passes because x and y are both null. The declaration of x in the first
    line doesn’t initialize a default int but rather a default Nullable<int>. Equality
    comparison between nullable values compares the underlying value if there is one.
    Two nullable values are equal if they both have no value, or values that themselves
    compare equal. Nullable<T> is a struct and overrides the Equals method to provide
    this behavior.


    As a consequence of not being able to assign null to a plain value type variable,
    we can’t use a plain value type on the right-hand side of an as expression, like
    this:


    ```

    ```csharp

    object speed = new Speed();

    var actual = speed as Speed;

    ```

    ```


    If Speed is a struct or record struct, this code won’t compile, because if the
    cast fails, the as operator will return null. As we know, null can’t be assigned
    to a value. The solution is to use a nullable value type as the source of the
    conversion, as shown here:


    ```

    ```csharp

    var actual = speed as Speed?;

    ```

    ```


    The type of the actual variable is a nullable Speed in this example and will have
    the value null if the conversion fails—that is, if the speed variable is not in
    fact a Speed type.


    # Nullable Reference Types


