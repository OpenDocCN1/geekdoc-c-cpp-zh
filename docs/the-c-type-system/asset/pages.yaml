    # Avoiding Implementation Inheritance


    Our problems with inheriting Equals and CompareTo demonstrate why value types
    don’t make good base types, regardless of whether we use class or record to define
    them.


    More generally, inheriting any implemented behavior makes it challenging to ensure
    that code written for the base type will work correctly if we substitute an inherited
    type. Even if we don’t override the base type’s methods, we can’t easily guarantee
    that those methods will work correctly for any derived type. While inheritance
    is a popular mechanism for reusing a base type’s implementation, fulfilling the
    base type behavioral contract in a derived type is often much more difficult than
    it appears.


    One way to ensure that one type can be substituted for another is to avoid implementation
    inheritance entirely. Remember, when we implement an interface, the implementing
    class is truly a subtype of the interface type; there’s no behavioral contract
    to consider because interfaces have no implementation. An interface type defines
    what an implementing type must be able to do but doesn’t prescribe any specific
    implementation. An interface, in effect, defines only a type, not a class.


    An interface type can be substituted by any implementing type, so we can use different
    implementations under different circumstances.


    Code that depends only on an interface type—whether as a parameter in a method
    or a field in a type—is completely decoupled from the way that interface is implemented.
    This means that interfaces are seams—customization points in our code where we
    can swap one implementation for another.


    Code that’s written in terms of interface types rather than concrete implementations
    is more flexible because it doesn’t depend on a particular implementation. It’s
    also easier to test because we can switch out concrete implementations of an interface
    with our own test double, sometimes known as a stub, fake, or mock object.


    It’s common to see interface types represent the controllers and services described
    in Chapter 6, sometimes with several implementations. A specific'
