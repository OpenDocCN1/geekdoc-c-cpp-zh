    ```\n```\n\nThe most straightforward way to avoid the error in this example would\
    \ be to preemptively assign null to the connection parameter before returning\
    \ false. By convention, an argument passed to a TryXXX method should be considered\
    \ to have a valid value in the calling code only if the method returns true.\n\
    \nThe target out variables in the calling code are considered definitely assigned\
    \ only after a *normal* return from a method. It’s possible for control to leave\
    \ the method *abnormally* by throwing an exception before all of its out parameters\
    \ have been assigned. If the method exits with an exception, the variables used\
    \ as out arguments that weren’t definitely assigned prior to the method call remain\
    \ not definitely assigned. Any arguments that were already definitely assigned\
    \ before the call remain definitely assigned, although they may still have been\
    \ given a new value within the method before the exception was thrown.\n\nHowever,\
    \ we’d usually use the TryXXX idiom to *avoid* exceptions, as most users will\
    \ expect such methods to not throw any exceptions.\n\n# Selecting Operations\n\
    \nUsing the TryXXX idiom with an out parameter, like that shown in Listing 3-9,\
    \ is appealing because the method can be used inline in a simple if statement\
    \ to test the return value and capture the required output argument’s value all\
    \ in one place. In Listing 3-10, we use the TryRemote method to determine how\
    \ to obtain a list of results, using the ternary conditional operator ?: rather\
    \ than if…else blocks. The connection output variable is declared inline in the\
    \ argument list for the method.\n\n```\n```csharp\nList<Record> results = TryRemote(remoteName,\
    \ out DataStore connection)\n    ? connection.LoadData()\n    : LoadFromCache();\n\
    ```\n```\n\n*Listing 3-10: Using a simple out parameter*\n\nIf TryRemote returns\
    \ true, the branch following ? is taken, and we can use the connection output\
    \ variable in the call to TryRemote. If the method returns false, indicating the\
    \ connection to the remote resource failed, our code takes the branch following\
