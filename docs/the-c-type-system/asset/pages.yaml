    *Listing 7-18: Containing Color rather than inheriting from it*


    Here, the compiler provides the implementation for IEquatable<T> for each type,
    leaving us to define just the properties and behavior for them. The TranslucentColor
    type contains a read-only Color instance, and we add a new constructor as a convenience
    for our users, who can either create a new Color value to pass to TranslucentColor''s
