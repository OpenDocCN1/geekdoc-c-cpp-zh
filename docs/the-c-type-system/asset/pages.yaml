  md: "Rather than compromising the immutable nature of Color by adding set accessors\
    \ for its properties, we introduce a new companion type that looks very much like\
    \ Color, except that it allows its properties to be changed. When the values are\
    \ in their final state, we can then materialize an instance of the mutable type\
    \ into an immutable Color. Key to this is that we can easily convert from the\
    \ companion type to the target value type. Listing 7-37 shows such a mutable companion\
    \ type for Color that allows an implicit conversion to the immutable target value.\n\
    \n```\npublic class ColorBuilder\n{\n    public int Red { get; set; }\n    public\
    \ int Green { get; set; }\n    public int Blue { get; set; }\n\n    public static\
    \ implicit operator Color(ColorBuilder color)\n        => new Color(color.Red,\
    \ color.Green, color.Blue);\n}\n```\n\nListing 7-37: A mutable companion for Color\n\
    \nThe ColorBuilder type isn’t itself a value type; its sole purpose is to provide\
    \ a kind of factory for Color values.\n\nApplications of the Mutable Companion\
    \ pattern are fairly common, and we see it in the Standard Library with string\
    \ and StringBuilder. The string type is immutable, and when we need to build up\
    \ a string variable from several parts, using its mutable companion, StringBuilder,\
    \ is efficient. When we’ve finished “building” the string, we turn it into its\
    \ immutable state.\n\nUnlike with ColorBuilder, we must call the ToString method\
    \ of StringBuilder to turn it into a string, but an implicit conversion can be\
    \ used to good effect here. Since ColorBuilder is implicitly convertible to a\
    \ Color, we can call a method taking a Color parameter with a ColorBuilder value,\
