    \ a hard-coded constant. Either way, this is a quick and simple method for comparing\
    \ floating-point values. The disadvantage is that it’s insensitive to differences\
    \ smaller than the number of decimal places we’ve specified and inaccurate when\
    \ comparing very large numbers.\n\nA second approach is to find out whether the\
    \ difference between two numbers is smaller than a certain tolerance, like this:\n\
    \n```\npublic static bool ApproximatelyEqual(double x, double y)\n=> Math.Abs(x\
    \ - y) < Tolerance;\n```\n\nThis ApproximatelyEqual method returns true if the\
    \ absolute difference between two floating-point numbers is smaller than a predefined\
    \ tolerance, but we need to define a sensible value for the Tolerance. Doing so\
    \ isn’t straightforward, because the difference between two floating-point values\
    \ can vary according to their magnitude. Listing 5-4 uses a value for tolerance\
    \ that is weighted according to the magnitude of the smaller of the numbers being\
    \ compared.\n\n```\nprivate const double Tolerance = 1E-15;\n\npublic static bool\
    \ ApproximatelyEqual(double x, double y)\n=> Math.Abs(x - y) <\n    Math.Max(Tolerance,\
    \ Math.Min(x, y)) * Tolerance;\n```\n\nListing 5-4: Approximate comparison using\
    \ a weighted tolerance\n\nWe’ve added a Tolerance constant to represent how sensitive\
    \ we want our comparison to be, although we don’t use its unqualified value in\
    \ the comparison. The rounding error for very large values has a far greater magnitude\
    \ than the error for very small numbers, and our tolerance needs to be sensitive\
    \ to that. Instead, we scale the tolerance according to the numbers being compared.\
    \ We use the smaller of the two values for scaling because that’s probably where\
    \ we’re most sensitive to the rounding error. As a compromise to avoid multiplying\
    \ by 0, if the smallest value is smaller than Tolerance, we scale Tolerance by\
    \ itself, which might cost us some precision in comparing tiny values.\n\nThe\
    \ value chosen for Tolerance here is sensitive enough to be able to distinguish\
    \ differences within around 25 decimal places when the values"
