    \ interning, whereby it maintains an intern pool containing a single instance\
    \ of each unique string literal used in a program. This way, even if the same\
    \ string literal appears more than once in the code, only one instance is in memory.\
    \ Strings are immutable, so having multiple references to one instance can never\
