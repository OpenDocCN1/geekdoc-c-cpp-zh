    \ interface, which requires us to implement a single method named `CompareTo`\
    \ for a type. If the left argument is less than the right, `CompareTo` returns\
    \ a negative integer; if the right is less than the left, the result is positive.\
    \ Otherwise, the result is 0.\n\nWhen we compare two `LogEntry` values to see\
