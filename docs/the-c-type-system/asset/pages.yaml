- pgno: 41
  md: "not a speed at all: multiplying a speed by a time produces a distance, which\
    \ we can represent directly in our code by introducing a new Distance type, as\
    \ shown in Listing 1-18.\n\n```\npublic readonly struct Distance\n{\n    public\
    \ Distance(double amount)\n        => Amount = amount;\n\n    public double Amount\
    \ { get; }\n}\n```\n\nListing 1-18: The Distance type\n\nWe can now create a new\
    \ overload of operator* for Speed that multiplies a Speed directly by a TimeSpan\
    \ and produces a Distance. Even better, we can define this overload in addition\
    \ to the multiplication operator we've already defined that takes a plain double\
    \ and returns a new Speed. Listing 1-19 shows both operator overloads.\n\n```\n\
    public readonly struct Speed\n{\n    public static Speed operator*(Speed left,\
    \ double right)\n        => new (left.Amount * right);\n\n    public static Distance\
    \ operator*(Speed left, TimeSpan right)\n        => new (left.Amount * right.TotalSeconds);\n\
    \n    --snip--\n}\n```\n\nListing 1-19: Overloading operator*\n\nOverloading is\
    \ versatile. We can overload a method with different types of parameters, and\
    \ each overload can return a different type. The rules for overloading consider\
    \ only the method signature—that is, the number and types of the parameters. We\
    \ can therefore return a Speed from the overload taking a double and return a\
    \ Distance from the method taking a TimeSpan instance.\n\n# Refining the New Type\n\
    \nNext, we need to add behavior to the new Distance type so that it will work\
    \ correctly in our Displacement implementation. Multiplying a Speed by a TimeSpan\
    \ gives us a Distance value, which we use in further arithmetic expressions of\
    \ its own, shown in Listing 1-20.\n\n```\nvar distance = speed * elapsedTime;\
    \    // a Distance\n\nvar x = distance * Math.Cos(angle.Size);\nvar y = distance\
    \ * Math.Sin(angle.Size)\n    - 0.5 * Gravity.Earth * Math.Pow(elapsedTime.TotalSeconds,\
    \ 2);\n```\n\nListing 1-20: The Distance type in use"
