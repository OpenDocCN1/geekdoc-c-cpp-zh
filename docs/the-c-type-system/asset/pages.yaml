- pgno: 161
  md: 'Speed. The compiler adds the IsReadOnlyAttribute attribute to every method
    and property of a read-only type.


    We can avoid almost all defensive copies by making our value types read-only because
    this provides the strongest possible guarantee to the compiler that its instance
    methods and properties don’t mutate the value.


    Making a value type read-only isn’t sufficient to avoid all invisible copies the
    compiler makes. Using a property as an argument to an in parameter will always
    copy the property value if it’s a value type. Regardless of the type’s immutability,
    a property isn’t a variable, so the compiler must copy its value so that a reference
    to it can be passed to an in parameter.


    When the compiler determines that a defensive copy is required to protect a value
    from potential change, the copy is invisible. The purpose of reference parameters,
    and local reference variables in particular, is to avoid unnecessary copying to
    make our code more efficient. Defensive copies negate any advantage of passing
    value type instances by reference. Using the readonly keyword on all structs and
    record structs is the most effective way to reduce the need for those invisible
    copies.


    # Summary


    > The real problem is that programmers have spent far too much time worrying about
    efficiency in the wrong places and at the wrong times.

    > —Donald E. Knuth, “Computer Programming as an Art,” Communications of the ACM
    1974


    Values are copied a lot in most programs—perhaps more than many programmers think.
    It’s easy, for example, to overlook the fact that when we access a property, we’re
    making a copy of the value, and the pass-by-value nature of value type instances
    can make this a hidden cost. Practically every access of a value type instance
    involves a copy. Some copies are obvious, immediately apparent when we read the
    code. Other copies are more subtle, and still others are completely invisible
    and might even be surprising. Whether it’s references or instances that we’re
    copying, those copies happen frequently, often implicitly, and sometimes unexpectedly.


    It’s widely recommended to make value types small to minimize the cost of copying
    them. In practice, however, too much emphasis is placed on their size. Making
    copies of values, even when they’re instances with several fields, is generally
    inexpensive but may still be costlier than copying a reference.


    We can model values as classes or use records that have value-like behavior to
    try to alleviate the cost of copies. Knowing when copies occur—and how often—can
    help us choose between implementing a value as a value type or a reference type.
    This knowledge can also play an important role in identifying algorithm bottlenecks
    in existing programs. Minimizing copying is certainly a micro-optimization, however,
    and whether the cost of copying is significant is something we can judge only
    by measuring it. We need to weigh the cost of copying value type instances against
    other penalties, such as the garbage-collection overhead we’d add by introducing
    a reference type instead.'
