    The x variable used to invoke Equals is an object reference but still refers to
    an instance of Color, so here it’s our override of Equals that’s called. If Color
    didn’t override Equals, the ValueType implementation would be called instead.
    In either case, Equals returns true because the two instances of Color have exactly
    the same state.


    We can think of a boxed value as an instance of a simple reference type on the
    heap that contains a copy of the value in a field with the same type as the original
    value. Since the box is on the heap, it can be referenced by more than one reference
    variable, as shown in Listing 5-20.


    ```

    var color = new Color(0xFF, 0xA0, 0);


    object x = color;

    object y = x;


    Assert.That(x == y, Is.True);

    Assert.That(x.Equals(y), Is.True);

    ```


    Listing 5-20: Two references to one boxed value


    In this example, x is a reference to a boxed value, and y is a different reference
    to the same box, illustrated in Figure 5-2.


