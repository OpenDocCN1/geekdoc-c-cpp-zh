  md: '# ABSTRACT BASE TYPES


    An abstract type is one that can be used only as a base type for inheritance;
    it can’t be instantiated directly with new. One implication is that while classes
    and records can be abstract, structs and record structs can’t. It would make no
    sense: we can’t inherit from a value type, so it could never be instantiated.


    In an abstract type, we can designate methods and properties as abstract, meaning
    they have no implementation. Their purpose is simply to define the operations
    that a concrete type must support. An abstract method or property is implicitly
    virtual, but providing an implementation for one prompts a compiler error. Abstract
    types don’t have to define any abstract members, but only abstract classes or
    records can have abstract methods and properties. Any abstract methods or properties
    remain abstract unless they’re explicitly overridden in a derived class. Providing
    an implementation for an abstract method in a derived type makes that method concrete.


    We can inherit one abstract type from another and choose to either provide implementations
    for the base type’s abstract methods or leave them as abstract. We can only directly
    create an instance of a class or record that is fully concrete; that is, any and
    all abstract methods have been overridden.


    If we inherit from an abstract class, we can’t then inherit from any other class
    because that would be a form of multiple inheritance, which is prohibited.


    It can be tempting to think of C# interfaces and their members as being abstract
    (especially for users familiar with C++, where interfaces are commonly implemented
    as classes with all pure-virtual methods), but that’s not the case. An interface
    contains only signatures of methods and properties; they are neither abstract
    nor virtual.


    Inheritance is a central feature of object-oriented code, but it applies exclusively
    to reference types. Inheritance—as well as the features that support it, such
    as virtual methods—is not appropriate for value types, in part because of the
    way value type instances use memory.


    # Type Instance Lifetimes


    Value types and reference types differ in the way each uses memory and, more specifically,
    in the lifetime of their instances. Value type instances are short-lived, and
    their lifetime is bound to the lifetime of the variables that represent them.
    For value types, the variable is the instance; when we create a new instance of
    a value type, the target variable effectively contains the instance data—that
    is, the value of each field of the type.


    In many cases, the lifetime of a variable is defined by a block, such as a method
    body or a foreach loop. Any local variables within the block cease to exist when
    the block ends. Alternatively, a variable might be contained in another object,
    in which case the variable’s lifetime is defined by the lifetime of the enclosing
    object. Whenever we copy a value type variable by'
