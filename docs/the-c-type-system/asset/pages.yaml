  md: 'Value types are treated differently because their memory isn’t necessarily
    allocated at run time: for local value type variables, the compiler may reserve
    memory for the instance data, and the program accesses that memory directly. The
    underlying Common Intermediate Language (CIL) has an efficient instruction for
    default-initializing value type instances that effectively zeroes out the memory
    used by the instance, wherever its memory actually resides.


    We can think of the default initialization of a struct or record struct as being
    performed by a compiler-provided default constructor, because the result is identical
    in any case. Default-initializing value types offers a minor performance advantage
    because it doesn’t require a method call to a constructor, although it’s almost
    never the most significant optimization.


    In a positional record or a positional record struct, the compiler generates a
    public constructor based on the parameters we use in the type definition, like
    this:


    ```

    public sealed record Color(int Red, int Green, int Blue);

    ```


    The parameters to Color in this example tell the compiler to create public properties
    using those names and their types. The compiler also creates a constructor with
    the same signature as the record’s parameter list, where the properties are assigned
    their values. The constructor generated by the compiler is the equivalent of this:


    ```

    public Color(int Red, int Green, int Blue)

    => (this.Red, this.Green, this.Blue) = (Red, Green, Blue);

    ```


    Although the constructor has been generated by the compiler, it’s still considered
    a user-defined constructor and therefore still suppresses the default constructor
    for the Color record.


    Regardless of its type, an instance is always default-initialized when it’s first
    created, whether its memory is being allocated on the heap or elsewhere.


    When we define our own constructor for a class, we can rely on all the fields
    having been default-initialized prior to the constructor’s body; the fields of
    a class are considered initially assigned within the constructor. In a struct’s
    constructor, the fields are initially unassigned, so we must definitely assign
    a value for every field of a struct or record struct, even if it’s simply to replace
    the value with its default-initialized equivalent.


    # Overloaded Constructors


    We can provide a constructor with parameters for any type, and we can overload
    the constructor by defining several constructors that have different numbers or
    types of parameters. This is useful when we want to support different ways to
    construct our type. For instance, Listing 2-14 shows a struct that has two constructors
    with differing signatures.'
