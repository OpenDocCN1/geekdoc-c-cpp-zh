    # Semantics and Type


    Value types have semantic implications that go beyond being an instance of a struct
    or record struct. Choosing a value type instead of a reference type when we define
    our own types requires much more than a consideration of possible optimizations.
    Records, in particular, differ from classes, because even though records are compiled
    into classes and are therefore reference types, they share some important behavioral
    characteristics with value types.


    Before delving into the behavior of record and record struct types, we need to
    better understand how structs differ from classes.


    # The Common Type System


    C# has a hierarchical type system, known as the *Common Type System*, in which
    all types derive from object, a keyword alias for the System.Object type. This
    is why we can always use object to refer to any other variable—although, as you
    just saw, in the case of value types, the instances are boxed so they can be referred
    to by object references.


