  md: 'The Speed and Angle types are the same as those in Listing 4-28, but they’re
    read-only fields rather than parameters. Since read-only fields must be immutable,
    the compiler makes a defensive copy of the initialSpeed field’s value for each
    access to the field’s InMetersPerSecond property. Using the Angle.InRadians property
    doesn’t cause a defensive copy, because it’s an automatic property.


    Interestingly, if we made the fields of Projectile non-read-only, the compiler
    would omit the defensive copies. The reason should be clear by now: the defensive
    copies are required to prevent unwanted modifications to read-only variables from
    being visible. If the variables are not read-only, allowing them to be altered
    causes no problems and requires no defensive intervention by the compiler.


    However, making conceptually immutable fields and properties mutable isn’t really
    a solution. What we’d really like are stronger guarantees of immutability, rather
    than sacrificing immutability in favor of fewer defensive copies. We can take
    measures that allow us to use in parameters, ref local variables, and read-only
    fields without incurring the cost of extra defensive copies made by the compiler.


    # THE CAUSES OF DEFENSIVE COPIES


    Many caveats exist around read-only references and read-only fields, so if we’re
    to avoid the potential copies introduced by the compiler, we have a lot to consider.
    The compiler may introduce defensive copying in several situations, but the rules
    can be summarized quite simply:


    For some expression x.Y, where Y might be a property or a method, the compiler
    makes a defensive copy of the value of x if all of the following are true:


    +   - x is a read-only field, an in parameter, or a ref readonly local.

    +   - The type of x is a non-read-only value type.

    +   - Y is not marked readonly.


    If Y is a field, no defensive copy is needed in any circumstance because just
    reading a field can’t possibly mutate it. Any attempt to write to Y will be caught
    by the compiler because x is read-only. However, avoiding defensive copies isn’t
    a good reason to expose public fields on structs or record structs, because in
    doing so we lose all the benefits of encapsulated data. Using the readonly modifier
    on the type, or at least the properties and methods, encodes the intent of immutability
    much more effectively.


    # Defending Against Mutation


    We can alter our code in a few ways to avoid the need for defensive copying. In
    each approach, we provide a guarantee that a method or property never'
