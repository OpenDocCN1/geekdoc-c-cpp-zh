  md: 'The == operator will return the result of Equals if the left parameter is not
    null; otherwise, it returns true if both the parameters are null. The != operator
    returns the opposite of == by inverting the comparisons.


    # The Contract for Equality


    Implementing equality in a way that is self-consistent is critical. It would be
    a strange state of affairs if we had two references to the same instance of Color
    that did not compare equal, and stranger still if Equals could return false when
    comparing a value with itself. Equality has a contract similar to the one you
    saw for less-than comparisons in Chapter 6. Namely, equality has the following
    characteristics:


    # Reflexive


    x == x is always true.


    # Symmetric


    If x == y, then y == x.


    # Transitive


    If x == y and y == z, then it follows that x == z.


    # Safe


    Non-null values are never equal to null.


    # Stable


    The result of x == y doesn’t change as long as x and y don’t change.


    In Listing 7-5, we write some tests to prove that we’ve met the requirements of
    the equality contract.


    > NOTE

    > These tests are presented this way for emphasis, not to demonstrate a good style
    of assertion writing.


    The first test also ensures that we’re comparing the variables by value, not merely
    comparing references.


    ```

    var pencil = new Color(0xFF, 0, 0);

    var crayon = new Color(0xFF, 0, 0);

    var brush =  new Color(0xFF, 0, 0);


    // Reflexive, value-based equality

    Assert.That(pencil == pencil, Is.True);

    Assert.That(pencil == new Color(0xFF, 0, 0), Is.True);


    // Symmetric

    Assert.That(pencil == crayon, Is.True);

    Assert.That(crayon == pencil, Is.True);


    // Transitive

    Assert.That(pencil == crayon, Is.True);

    ```'
  merge: -1
  img_proc: true
