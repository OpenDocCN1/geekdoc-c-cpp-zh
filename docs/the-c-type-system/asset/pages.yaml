    # Summary


    > We do not consider it as good engineering practice to consume a resource lavishly
    just because it happens to be cheap.

    > —Niklaus Wirth, Project Oberon: The Design of an Operating System, a Compiler,
    and a Computer


    Code optimized by hand is often harder for a human reader to follow, usually because
    it frequently involves replacing simple idioms, such as loops and pattern matching,
    with lower-level constructs. When a program runs more slowly than we think it
    should, it can be tempting to dive straight in and change the parts of the code
    we suspect are bottlenecks. Programmers’ optimization instincts are, however,
    notoriously unreliable. We’re likely to make our code more difficult to read while
    failing to improve performance in any meaningful way.


    Optimizing code by hand is almost always an exercise in exchanging clarity and
    simplicity for performance. We can judge whether this is a reasonable trade only
    by measuring the performance before and after the change. Even when we improve
    performance in a section of code, we must still decide whether we’ve made the
    code less clear and, if so, whether the change is justified. We must also be certain
    that our optimizations haven’t changed the program’s behavior in any way. Slow,
    correct code is always preferable to incorrect code, however good its performance.
    That’s not to say that good enough can’t be correct—frequently a compromise is
    necessary between performance and accuracy or precision—but we need to know the
    point at which inaccurate really does mean incorrect.


    The use of well-known idioms and patterns helps human readers easily understand
    code. Correspondingly, when we depart from those common designs, we make our code
    harder to follow. Therefore, we must be selective in applying optimizations to
    the areas of code that will bring the greatest benefits.


    Overriding the behavior of Equals isn’t difficult for the vast majority of types,
    but it adds an implementation detail that represents extra cognitive overhead
    for anyone who needs to understand our code.


    Using records to represent value-like types removes much of that added complexity
    because the compiler generates the correct implementations for us. However, even
    accepting that default behavior won’t necessarily yield the most efficient code.


    Careful code optimization, supported by evidence from a profiler, can yield better
    performance in both speed and memory use. Modern computers are fast and usually
    have more than enough memory, but that doesn’t mean we should waste either resource.'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# AFTERWORD


    > There are two ways of constructing a software design: One way is to make it
    so simple that there are obviously no deficiencies, and the other way is to make
    it so complicated that there are no obvious deficiencies. The first method is
    far more difficult.

    > —Tony (C.A.R.) Hoare, 1980 Turing Award Lecture


    ![](img/47f0004b0ac0322f285ca59a19bca333_312_0.png)


    Computer programming is a subtle art. A successful programmer needs more than
    knowledge of a programming language’s syntax. Getting the most out of any programming
    language requires a deep understanding of its mechanics (how the syntax elements
    fit together) and its semantics (how those elements define and control the resulting
    program’s behavior).


    Semantics can be low level, such as the effects of copy-by-value behavior on equality
    comparisons between objects, or more conceptual, such as the application of different
    kinds of polymorphism. Semantics also plays a part in application design: carefully
    designed objects can express different concepts in a system, giving the code structure
    and meaning.


    Understanding the mechanics and semantics of C# allows us to write code that makes
    better use of the language constructs. This comes with several potential benefits:
    more efficient use of memory and processor'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'resources; simpler, easier-to-understand code (by other programmers as well
    as ourselves); and an enhanced capability to add new features and diagnose errors.


    When designing a system, whatever its size and purpose, it’s easy to focus on
    the big architectural components that form the application’s overall shape. Even
    when a design is emergent—that is, it takes shape organically as we start creating
    features—the fine-grained values are easily forgotten or dismissed as the small,
    passive bits of data passed between the more interesting system interfaces. In
    this book, we’ve explored the relationship between those values and other application
    elements because recognizing value types as the currency of information in a system
    gives us opportunities not only to better express the overall design, but also
    to clarify the purpose of the code that uses them. Rich custom value types help
    us establish a ubiquitous language in an application that plays an important part
    in conveying a design and its overall purpose. They also enable the compiler to
    catch more errors before run time.


    Addressing every feature of a complex language like C# in a book like this is
    not practical, partly because C# is an evolving language. Its features expand
    constantly to meet the needs of programmers in all domains. This is a Good Thing™
    because the software development landscape is also continually evolving, but C#
    programming practitioners are responsible for keeping up with that progress. In
    this book, I’ve presented numerous techniques and features to help you better
    understand C# as it is today, and I hope I’ve also inspired you to explore the
    characteristics, performance, and semantics of features that the C# language designers
    add in the future.


    Understanding the intricacies of C# semantics for value and value-like types can
    be challenging, but your effort will be rewarded with richer, clearer designs
    that are easier to maintain and extend. I hope this book has given you a deeper
    appreciation for and knowledge of the diverse facilities that C# provides for
    creating these types, and, most importantly, I hope it has made you a better programmer.'
