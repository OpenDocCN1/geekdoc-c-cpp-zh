- pgno: 277
  md: 'The Stopwatch class is a lightweight high-resolution timer that records elapsed
    time with very high precision. The Stopwatch.Frequency value is the number of
    ticks per second, so by multiplying the count of elapsed ticks by 1000.0 before
    dividing by the frequency, we can report the time taken with millisecond granularity.
    This technique simply measures the elapsed time since the clock was started, so
    it can''t, for instance, determine whether the code being measured is actually
    running for all that time. The clock continues to tick even if the code is interrupted
    (for example, by switching to a different thread).


    Instrumenting code with a timer and recording it in the log or another audit trail
    can be a useful way to measure code running in a live system. However, measuring
    and reporting the performance takes time too, so we must be sure to take the measurements
    at a relatively high level. For instance, measuring and reporting how long code
    takes to respond to an HTTP request or call a remote procedure probably wouldn''t
    significantly impact the application''s performance. On the other hand, using
    this technique in a tight loop might well introduce more overhead than the cost
    of the loop itself.


    Benchmarking is also a useful way to explore performance in a test environment,
    perhaps to compare alternative approaches to solving a specific problem. The technique
    in Listing 8-1 is naïve in that it measures the code only once. A more accurate
    approach for measuring performance would run the code many times and report the
    average time. We could write our own framework based on Listing 8-1, although
    a few freely available libraries for C# will do the heavy lifting for us, producing
    a report of the recorded performance along with other useful statistics, such
    as margin for error.


    # The Profiler


    Benchmarking will tell us overall how quickly a piece of code runs, but to determine
    what the code does in detail, we need a profiler. Using a benchmarking tool in
    combination with profiling will give us the most accurate measurements. Among
    the several kinds of profiler available, the two most common are performance profilers
    and memory profilers.


    A memory profiler will show us where our program allocates memory, how much is
    being used, and when it''s garbage collected. If we need to find out which parts
    of our code are using the most CPU time or which methods are being called most
    often, a performance profiler will give us precise measurements, allowing us to
    target specific hot spots in the code and optimize them if necessary. While optimizing
    memory usage is important, in this chapter we''ll focus on discovering bottlenecks
    in our code by using a performance profiler.


    Performance profilers usually operate on a release build of a program and so take
    into account any optimizations applied by the compiler and JIT compiler. Measuring
    a debug build for its performance usually makes little sense, although sometimes
    it can be useful: comparing the results of profiling both a debug build and a
    release build of the same code, for instance, can provide insights into some of
    the optimizations the JIT compiler performs.'
  merge: -1
