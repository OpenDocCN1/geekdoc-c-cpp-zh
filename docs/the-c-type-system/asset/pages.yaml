- pgno: 49
  md: "```\npublic readonly struct Speed\n{\n    --snip--\n    public double InMetersPerSecond\
    \ => amount;\n    public double InKmPerSecond     => amount / 1000.0;\n    public\
    \ double InKmPerHour       => amount / 1000 * 3600;\n\n    private readonly double\
    \ amount;\n}\n```\n\nListing 1-30: Viewing Speed in different units\n\nWe introduce\
    \ a private data member that can be used from each of these properties. Doing\
    \ so avoids property forwarding (one property invoking another to obtain the needed\
    \ value) but also allows us to use an expression body for all three properties.\
    \ This is largely an aesthetic choice; the most obvious alternative employing\
    \ property forwarding is shown here:\n\n```\npublic double InMetersPerSecond {\
    \ get; }\npublic double InKmPerSecond     => InMetersPerSecond / 1000.0;\npublic\
    \ double InKmPerHour       => InMetersPerSecond / 1000 * 3600;\n```\n\nWhichever\
    \ approach we choose, we have, in effect, renamed the vague Amount property as\
    \ InMetersPerSecond, whose purpose is to return the internal value of a Speed.\
    \ The new name better expresses the property's meaning, matches the naming convention\
    \ used for the other properties, and mirrors the class factory method FromMetersPerSecond.\n\
    \nBy using similar naming conventions for the From... methods and the In... properties,\
    \ we improve the clarity of Speed's interface. When we see a method such as FromKmPerHour,\
    \ we naturally expect a corresponding method or property that provides the reverse\
    \ conversion.\n\nThe class factory methods and corresponding properties provide\
    \ a compact way of expressing units in either direction, and they force us to\
    \ consciously make clear what we mean when we use a Speed.\n\n# Making Units Explicit\n\
    \nThe Displacement method does not directly use the units of a Speed, because\
    \ they are encapsulated in the multiplication operator we created for Speed and\
    \ TimeSpan. Displacement does use the units of an angle, although those units\
    \ are currently implied in the Angle.Size property, as shown in Listing 1-31.\n\
    \n```\nvar x = speed * elapsedTime * Math.Cos(angle.Size);\n--snip--\n```\n\n\
    Listing 1-31: Angles in Displacement\n\nBoth Math.Cos and Math.Sin require a measurement\
    \ of an angle in radians, the SI unit for measuring angles. In Listing 1-32, we\
    \ rename the Size property as InRadians to make the units explicit, and add the\
    \ conversions to and from degrees as well."
