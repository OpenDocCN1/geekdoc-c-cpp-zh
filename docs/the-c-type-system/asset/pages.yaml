  md: "```\npublic readonly struct Speed\n{\n    private const double C = 299792458;\n\
    \n    public Speed(double val)\n        => amount = val switch\n        {\n  \
    \          ① double.NaN => throw new ArgumentException(\n                message:\
    \ \"Must be a number\",\n                paramName: nameof(val)),\n\n        \
    \    ② < 0 or > C => throw new ArgumentOutOfRangeException(\n                paramName:\
    \ nameof(val),\n                message: $\"Must be between 0 and {C}\"),\n\n\
    \            ③ _ => val\n        };\n        --snip--\n\n    private readonly\
    \ double amount;\n}\n```\n\nListing 6-11: Defining a simple value type with validation\n\
    \nThe constructor for Speed ensures that we’ll never have a value that is not\
    \ a number, is negative, or is greater than the speed of light.\n\nThe patterns\
    \ within the switch expression are matched from top to bottom, and wherever the\
    \ value being tested—the val parameter in this case—matches the pattern, the associated\
    \ expression is evaluated to produce a result. The first two patterns here are\
    \ the error conditions and throw exceptions instead of producing a value.\n\n\
    The first pattern is a constant pattern matching NaN, as you saw in Chapter 5\
    \ ①. The second pattern throws an ArgumentOutOfRange exception if val is either\
    \ less than 0 or greater than the constant C ②. This pattern uses a combination\
    \ of facilities available since C# v9.0: a relational pattern and a disjunctive\
    \ pattern.\n\nThe relational pattern, which is appropriate for any of the built-in\
    \ numeric types, uses the relational operators <, >, <=, or >= to determine whether\
    \ a number is within a given range. The disjunctive pattern combines other patterns\
    \ by using the or keyword, and the pattern matches if any of its expressions match.\
    \ The similar conjunctive pattern (not used here) uses the and keyword and matches\
    \ if all of its component expressions match.\n\nIf the val value doesn’t match\
    \ either of the first two patterns, it matches the final discard pattern, whose\
    \ expression is simply the value of val ③. This becomes the result of the whole\
    \ switch expression and is assigned to the amount field. Since the discard is\
    \ always a match, it must be the final pattern in the switch expression.\n\nIn\
    \ addition to encapsulating validation logic within the Speed type, we’ve made\
    \ Speed immutable to ensure that an instance, once successfully validated, can\
    \ never become invalid. If the state can’t be changed, the class invariant needs\
    \ to be checked only once—in the constructor."
