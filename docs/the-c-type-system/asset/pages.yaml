- pgno: 47
  md: "Always converting Speed values to meters per second in the constructor presents\
    \ an additional problem: the amount used to create a Speed is altered when we\
    \ use units other than MetersPerSecond. To demonstrate the issue, consider Listing\
    \ 1-26, where we copy a Speed value by using its Amount property and the same\
    \ units used to create the original.\n\n```\nvar original = new Speed(3.6, Speed.Units.KmPerHour);\n\
    \nvar copy = new Speed(original.Amount, Speed.Units.KmPerHour);\n\nAssert.That(original.Equals(copy),\
    \ Is.True);\n```\n\nListing 1-26: Testing equality of copied values\n\nMost people\
    \ would expect this test to pass, but it fails because original.Amount was converted\
    \ to meters per second by Speed’s constructor. The solution is to use the In method\
    \ to make the copy, like this:\n\n```\ncopy = original.In(Speed.Units.KmPerHour);\n\
    ```\n\nConverting all Speed values to the common unit of meters per second simplifies\
    \ the implementation of Speed, but it’s less convenient for users wishing to use\
    \ Speed values measured in a different unit.\n\nIn the same way, although representing\
    \ Angle values in radians is convenient when we need to use an angle in a trigonometric\
    \ method, it’s much less convenient for users. As mentioned earlier, most humans\
    \ naturally think of angles in degrees rather than radians, and while the conversion\
    \ is relatively simple, it’s not part of the Standard Library.\n\nWe therefore\
    \ still need to bridge the gap between what’s intuitive for a user and what our\
    \ code uses internally. Next, we look at an alternative approach to enumerations:\
    \ using static methods that make our types convenient for humans to use and also\
    \ work seamlessly with standard methods like Math.Sin.\n\n# Static Creation Methods\n\
    \nInstead of using a constructor with an enum parameter to represent units, we\
    \ can employ the Class Factory Method pattern, which replaces public constructors\
    \ with static methods to simplify creating instances. These methods have names\
    \ that reflect the units they represent instead of requiring a separate enum value\
    \ to identify those units.\n\nIn our Speed type, we use the class factory methods\
    \ in Listing 1-27 to convert the input value to the units used by Speed internally,\
    \ and return a new Speed instance with that converted value.\n\n```\npublic static\
    \ Speed FromMetersPerSecond(double amount)\n    => new (amount);\n\npublic static\
    \ Speed FromKmPerSecond(double amount)\n    => new (amount * 1000);\n```"
  merge: -1
  img_proc: true
- pgno: 48
  md: "```\npublic static Speed FromKmPerHour(double amount)\n    => new (amount *\
    \ 1000 / 3600);\n```\n\nListing 1-27: Using class factory methods to encode units\n\
    \nHere, we have three separate ways to create a new Speed, each returning a Speed\
    \ value converted from the units indicated by the name of the method. When we\
    \ require a new Speed instance, we use the method representing the units we want,\
    \ as demonstrated in Listing 1-28.\n\n```\nvar limit = Speed.FromKmh(88);\nvar\
    \ sound = Speed.FromMetersPerSecond(343);\nvar escape = Speed.FromKmPerSecond(11.2);\n\
    ```\n\nListing 1-28: Creating Speed values with our new class factory methods\n\
    \nNow there’s no need for Speed’s constructor to be public. If we allow our users\
    \ to create Speed instances directly with new, they’ll bypass the class factory\
    \ methods and lose the benefits of the conversions. To avoid that, in Listing\
    \ 1-29 we make the constructor private.\n\n```\nprivate Speed(double amount)\n\
    {\n    if(amount < 0)\n    {\n        throw new ArgumentOutOfRangeException(\n\
    \            paramName: nameof(amount),\n            message: \"Speed must be\
    \ positive\");\n    }\n    Amount = amount;\n}\n```\n\nListing 1-29: Making our\
    \ Speed constructor private\n\nThe constructor still contains the validation logic,\
    \ but now it can be called only by our class factory methods, with the argument\
    \ suitably scaled to meters per second. We can’t prevent instances of Speed from\
    \ being default-initialized, but that results in the value being 0, a value that\
    \ is the same regardless of the units. Note that this is not always true, so we\
    \ need to be alert for cases where this does not hold. For example, 0 degrees\
    \ Celsius is not the same as 0 degrees Fahrenheit for temperature.\n\n# Symmetry\
    \ in Design\n\nWhile our class factory methods allow us to create Speed values\
    \ from values measured in different units, the internal representation of a Speed\
    \ value is in meters per second. To improve usability, we need to provide corresponding\
    \ conversions in the other direction, so users of Speed can choose the units they\
    \ want when they obtain the value. In Listing 1-30, we add properties to convert\
    \ a Speed from its internal value to the unit encoded in the name of the property."
