  md: "# Records and the Equality Contract\n\nThe contract for equality applies to\
    \ records just as for any other type, and the code provided by the compiler ensures\
    \ that every aspect of the contract is respected, including the stability of comparisons\
    \ via base class references. The test in Listing 7-13 differs from the test in\
    \ Listing 7-10 in that the Color and TranslucentColor types are records rather\
    \ than classes. Here we compare two TranslucentColor record values with different\
    \ Alpha properties and assert that they compare unequal whether we compare them\
    \ directly using their concrete type or indirectly via a base class reference.\n\
    \n```\nbool EqualViaBase(Color left, Color right)\n    => left.Equals(right);\n\
    \nbool EqualViaDerived(TranslucentColor left, TranslucentColor right)\n    =>\
    \ left.Equals(right);\n\nvar pencil = new TranslucentColor(0xFF, 0, 0xFF, 0x77);\n\
    var crayon = new TranslucentColor(0xFF, 0, 0xFF, 0);\n\nAssert.That(EqualViaBase(pencil,\
    \ crayon), Is.False);\n\nAssert.That(EqualViaDerived(pencil, crayon), Is.False);\n\
    ```\n\nListing 7-13: Equality between record types\n\nThis test passes, and the\
    \ pencil and crayon variables compare not equal whichever method we call, EqualViaDerived\
    \ or EqualViaBase.\n\nBecause the compiler-generated implementation of equality\
    \ pays particular attention to the equality contract, the variables compare not\
    \ equal whether we use a base Color record reference or the derived TranslucentColor\
    \ reference. In particular, the type-safe implementation of Color.Equals(Color)\
    \ is virtual in a record implementation and is overridden in the derived TranslucentColor\
    \ record. As mentioned, doing this for our class implementations would make the\
    \ test behave correctly. With records, the compiler injects those implementations\
