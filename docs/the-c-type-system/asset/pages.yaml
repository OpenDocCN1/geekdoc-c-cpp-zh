  md: 'When we assign one value to another or pass a value type instance as an argument
    by value, we copy the value. Two value type variables are always independent instances.
    This is the essence of copy-by-value semantics.


    Reference type variables behave differently because their value is a reference.
    A reference’s value is used to identify an instance of the type on the heap or
    is null.


    # The Value of a Reference


    When we create an instance of a reference type, memory is allocated on the heap,
    and a reference identifying the location of that memory is stored in the variable.
    Syntactically, it appears that the type of a reference variable is the type of
    the instance to which it refers, as illustrated here with a string variable:


    ```

    string name = "Alfred";

    ```


    We’d normally refer to the name variable as a string. However, that’s not completely
    accurate. It’s more precise to say that name is a variable whose type is string
    and whose value is a reference to an instance of the string type. The type of
    a reference variable need not exactly match the type of the instance. For example,
    we can use a base class reference variable, such as object, to refer to a more
    specific reference type instance, such as string.


    A reference’s value is an opaque handle used by the Common Language Runtime (CLR)
    to identify an object. We’re not really interested in what the value of a reference
    is; references are just the mechanism by which we access and manipulate instances
    of a reference type, as illustrated in Figure 3-3.


    ![](img/47f0004b0ac0322f285ca59a19bca333_98_0.png)


    In Figure 3-3, name is a variable whose value is a reference. A reference does
    not itself have a distinct type (certainly not one we can name), but it does have
    a value. The value of a non-null reference is a handle to an area of memory allocated
    on the heap that contains the instance of a reference type.'
