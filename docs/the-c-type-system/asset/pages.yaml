- pgno: 38
  md: 'Our implementation of Displacement is now much more compact—but we’ve introduced
    some hidden problems.


    # Unexpected Interactions


    Implicit conversions weaken the interface to Speed and Angle by allowing them
    to participate everywhere that a double might be used, which means they can be
    used in expressions where it’s not appropriate. For example, dividing a speed
    by an angle would be a legal expression, as demonstrated in Listing 1-14.


    ```

    ```text

    var angle = new Angle(.523);

    var speed = new Speed(65);


    var unknown = speed / angle;

    ```

    ```


    Listing 1-14: Unplanned behavior resulting from an implicit conversion


    This expression is valid owing to the implicit conversions from both Speed and
    Angle to double, but the result is meaningless, and we get no warning from the
    compiler. In addition, implicit conversions are usually invisible in our code.
    If we pass a Speed value to Math.Cos instead of an Angle, the resulting calculation
    errors could be hard to find.


    # Discarded Invariants


    One of the benefits we realized by introducing a custom type for Speed was that
    we could encapsulate validation logic in Speed’s constructor.


    Allowing the implicit conversion from Speed to double means that code using the
    double result can breach the constraints on the allowable range of a Speed. In
    Listing 1-15, we subtract one Speed from another smaller value, leaving us with
    a result that’s less than 0.


    ```

    ```text

    var verySlow = new Speed(10);

    var reduceBy = new Speed(30);


    var outOfRange = verySlow - reduceBy;

    ```

    ```


    Listing 1-15: Unchecked constraints resulting from an implicit conversion


    This subtraction expression, which is between two double values as a result of
    the implicit conversion from Speed to double, will run just fine. The result is
    negative and thus out of range for a Speed, but it’s a perfectly legal double
    value.


    To address this out-of-range value, we need to restrict the permitted operations
    on Speed and Angle so they make sense for those measurements. This was the whole
    purpose of introducing a class invariant for Speed to ensure that instances of
    it always have a valid value. Furthermore, we want to prohibit operations that
    make no sense, ideally in a way that would allow the compiler to tell us when
    something is wrong.'
