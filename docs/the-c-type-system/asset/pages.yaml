    \ Equals, indicating that we know the parameter could be null and can handle that\
    \ circumstance safely. Here we use the as operator to cast obj to Color in order\
    \ to call the type-safe Equals method. If obj isn’t a Color or is null, the argument\
    \ passed will be null, which is explicitly handled by the type-safe overload in\
    \ Listing 7-4.\n\n```\npublic bool Equals(Color? other)\n    => (object?)this\
    \ == (object?)other ||\n       other is not null &&\n       GetType() == other.GetType()\
    \ &&\n       Red == other.Red && Green == other.Green && Blue == other.Blue;\n\
    ```\n\nListing 7-4: Implementing IEquatable<Color>\n\nThe type-safe Equals implementation\
    \ of the IEquatable<Color> interface takes a nullable Color parameter. This overload\
    \ will always be preferred over the method taking an object? parameter when we’re\
    \ comparing two variables whose static type is Color, including when we call it\
    \ from the operator== or operator!= methods."
