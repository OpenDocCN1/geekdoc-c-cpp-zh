  md: "Overloading operators isn’t essentially different from overloading other methods,\
    \ but rather than using named methods, we’re overloading symbols to behave in\
    \ a polymorphic way with our types. A good example of symbolic polymorphism is\
    \ embodied in the string class, which defines the + symbol to mean concatenation\
    \ rather than addition. This is a widely accepted convention familiar to most\
    \ programmers.\n\nWe should be cautious of introducing our own operations that\
    \ don’t follow the usual rules. Overloading methods, and especially operators,\
    \ requires careful thought and a hefty dose of what we might call “good taste.”\
    \ Families of methods overloaded for different types give the impression of type\
    \ substitutability by giving one common name to an operation that may be implemented\
    \ differently for each type.\n\nThe string class doesn’t, for example, allow us\
    \ to add a number with a string, for the simple reason that the type of the result\
    \ may be misinterpreted: should \"5\" + 0.5 be the same as 0.5 + \"5\"? The designers\
    \ of the string class decided to disallow either use to avoid any potential confusion.\n\
    \n# Generic Delegates for Polymorphism\n\nA delegate is a type that represents\
    \ a method with a specific signature—the type and number of parameters—and a delegate\
    \ object can be constructed from different methods as long as the signature matches\
    \ the delegate type. Delegates are a central feature of the LINQ libraries; for\
    \ example, the Select method takes a delegate parameter to represent the method\
    \ for transforming one element of a sequence into a different type. We most commonly\
    \ see lambdas being used as the arguments for methods with delegate type parameters,\
    \ as shown in Listing 7-30.\n\n```\nvar colors = new List<Color>\n{\n    --snip--\n\
    };\n\nvar formatted = colors.Select(\n    color => $\"{color.Red:X2}{color.Green:X2}{color.Blue:X2}\"\
    );\n```\n\nListing 7-30: Passing a lambda for a delegate parameter\n\nSelect is\
    \ an extension method for IEnumerable<T>, and here we call it via the colors variable,\
    \ passing a lambda to represent a method taking a Color parameter, since that’s\
    \ the element type of the colors sequence. The lambda is invoked for each element\
    \ in the sequence and returns a hexadecimal representation of the value as a string\
    \ formatted to \"RRGGBB\"—the reverse operation of the Parse method defined in\
    \ Listing 7-22.\n\nInline lambdas like the one in Listing 7-30 are convenient\
    \ but generally lack the flexibility offered by method overloads. For example,\
    \ if we change the element type of colors to be TranslucentColor instead of Color,\
    \ our code still compiles, and the lambda implementation will continue to work\
    \ with the TranslucentColor type defined in Listing 7-18, but the result won’t\
