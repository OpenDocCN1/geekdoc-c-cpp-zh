    \ boxing always copies to the heap, the box is subject to garbage collection and\
    \ other heap management tasks. If we box values indiscriminately, then our program’s\
    \ performance and memory use will suffer. Taking the time to identify and remove\
    \ unnecessary boxing will improve our code’s efficiency.\n\nBoxing occurs anytime\
    \ we use a reference type variable to refer to a value type instance. It usually\
    \ happens implicitly (although we can explicitly box a value, it’s rarely necessary).\
    \ Recall from Chapter 2 that all types ultimately derive from object, so we can\
    \ always implicitly cast a value of any type to object. When that value isn’t\
