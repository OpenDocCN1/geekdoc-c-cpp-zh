  md: 'the CIL generated by the compiler, we see how these built-in types get special
    support at run time:


    ```

    1 L_0001: ldc.i4.s 10

    L_0003: stloc.0  // x


    2 L_0004: ldloc.0  // x

    L_0006: stloc.1  // y


    3 L_0007: ldloc.0  // x

    L_0008: ldloc.1  // y


    4 L_0009: ceq

    ```


    CIL instructions all follow a similar low-level format. Each line has a label
    in the format L_0XXX, followed by the instruction itself and any arguments it
    needs. The first instruction, ldc.i4.s, pushes its argument, the value 10, onto
    the evaluation stack ①. The next instruction, stloc.0, has no arguments but pops
    the value at the top of the evaluation stack into the variable at location 0,
    which, as the decompiler helpfully tells us in a comment, is the x variable. The
    outcome of these first two lines is that the x variable is assigned the value
    10.


    Next, the previously stored value of x is loaded and then stored in y ②. Then,
    the values of both x and y are pushed back onto the evaluation stack so they can
    be interpreted by the next instruction ③. Lastly, the built-in instruction ceq
    compares the two values on the top of the evaluation stack for equality ④. The
