  md: 'floating-point numbers for strict equality isn’t reliable. In Listing 5-17,
    we try to identify whether the collection has a specific double value.


    ```

    var history = new HashSet<double>();


    var rate = 0.1+0.2;

    history.Add(rate);


    Assert.That(history.Contains(0.3));

    ```


    Listing 5-17: Using floating-point numbers as keys


    This test fails because the value 0.3 doesn’t exactly match the representation
    of 0.1 + 0.2. Because calculations using double values are imprecise, they’re
    generally a bad choice as keys in a hashed collection. By extension, the same
    reasoning applies to user-defined types that have floating-point field values;
    comparing objects of such a type for equality necessarily means comparing any
    floating-point fields, with the same potential for errors.


    In a type with floating-point fields, we might be tempted to override its Equals
    method by using an approach similar to the ApproximatelyEqual implementations
    from Listings 5-3 and 5-4, but doing so would introduce two problems. First, equality
    is a transitive relationship between values: for three values x, y, and z, if
    x is equal to y, and y is equal to z, then x must be equal to z. Implementing
    Equals to mean approximately equal means the transitive relationship wouldn’t
    necessarily hold, because the difference between x and z could be larger than
    any tolerance we define, even when x.Equals(y) and y.Equals(z) are both true.


    The second issue is directly related to hash codes. Recall that objects that compare
    equal should have the same hash code. Using ApproximatelyEqual to implement Equals
    could easily break that rule, because two almost equal values will still produce
    different hash codes. We could implement GetHashCode to ignore any floating-point
    fields, but doing so would compromise how well our objects’ hash codes are distributed.
    It also raises the question of what to do about types that have only a single
    field that’s a floating-point value, such as the Speed and Angle types we developed
    in Chapter 1.


    Floating-point numbers and types containing floating-point values, then, don’t
    make good keys for hash tables, dictionaries, and other data structures that depend
    on the implementation of GetHashCode. Unfortunately, C# doesn’t allow us to prevent
    a particular type from being used as a key in a hash table or similar data structure,
    because GetHashCode is defined on object and can’t be hidden. It’s up to us to
    make sure that the keys we use are suitable for that purpose.


    Strings make excellent keys for hash tables, because the string class overrides
    Equals and GetHashCode to compare the string contents. This is the same behavior
    the compiler adds for us in record and record struct types. Both the Equals method
    and GetHashCode are synthesized by the compiler, so record and record struct instances
    use their value for equality comparisons and for generating their hash codes.
    Although records are reference types, like strings they work very well as keys,
    subject to the caveats we’ve just discussed regarding floating-point fields.'
