  md: "```\npublic sealed class DataAdapter<TResult>\n{\n    public DataAdapter(IEnumerable<string>\
    \ source)\n        => items = source;\n\n    public IEnumerable<TResult> Read<TParser>(TParser\
    \ parser)\n        where TParser : IParser<TResult>\n    {\n        foreach (var\
    \ item in items)\n        {\n            yield return parser.Parse(item);\n  \
    \      }\n    }\n\n    private readonly IEnumerable<string> items;\n}\n```\n\n\
    Listing 7-24: Defining DataAdapter.Read as a generic method\n\nThe DataAdapter\
    \ no longer needs a field to store a TParser object since it’s passed to the Read\
    \ method. The generic method still requires the interface constraint so that we\
    \ can call the Parse method via the parser variable, but we don’t need to specify\
    \ the type of the parser argument when passing it; the compiler infers the type\
    \ of TParser based on the argument we pass to Read, as shown in Listing 7-25.\n\
    \n```\nvar provider = new DataAdapter<Color>(messages);\n\nforeach (Color color\
    \ in provider.Read(new ColorParser()))\n{\n    --snip--\n}\n```\n\nListing 7-25:\
    \ Parameter type inference\n\nWe mention the ColorParser type just once, when\
