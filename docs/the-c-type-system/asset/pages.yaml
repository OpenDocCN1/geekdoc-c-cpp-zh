  md: '# Clarifying with Symmetry


    The role of symmetry in an interface is often underestimated, but it can be important
    in making our types easy to use and understand. For instance, you saw in Chapter
    1 how class factory methods can help us represent units for a type like Speed.
    We use such methods instead of directly accessing a public constructor, and each
    method encapsulates the name of the units it represents. Listing 6-12 shows how
    we can couple the class factory methods with their corresponding properties to
    obtain a value in different units.


    ```

    public static Speed FromMetersPerSecond(double value) => new Speed(value);

    public        double InMetersPerSecond => amount;


    public static Speed FromKmh(double value) => new Speed(value * 1000 / 3600);

    public        double InKmh => amount * 3600 / 1000;

    ```


    Listing 6-12: Applying symmetry by pairing class factory methods with their respective
    properties


    We’d probably expect that if we can create a Speed by using a value in kilometers
    per hour, we could get the value in the same unit at a later stage. We emphasize
    the symmetry between each class factory method and its corresponding property
    by declaring each pair for a particular unit together.


    The methods and properties in Listing 6-12 don’t prevent us from using the wrong
    units. We could still pass a value in kmh to the FromMetersPerSecond factory method.
    However, by encoding the units that we’re using in the names of the class factory
    methods and properties, we make them more explicit and more expressive than using
    a plain constructor.


    Being explicit helps to make the interface to Speed consistent and easier to use
    correctly than incorrectly. Our Speed type has become much more than a simple
    wrapper around a primitive value.


    Using explicit names like FromKmh and InKmh to represent the available conversions
    for a Speed instance helps maintain the encapsulation of the internal representation.
    A constructor taking a double parameter, along with a vaguely named property to
    simply return that value, leaks the detail that Speed has a particular underlying
    representation. The class factory methods and properties shown here hide these
    implementation details and add value for users in the form of some common conversions.


    We can easily imagine using similar class factory methods and properties to convert
    between units for other types, such as between Celsius and Fahrenheit for temperature,
    or meters and feet for length.


    # Encapsulation and the Public Interface


    While it involves more than making data private, encapsulation is built on the
    premise that a type’s internal data can’t be directly accessed—and especially
    can’t be changed—by code other than the type’s methods. Access to private data
    is controlled by the type’s public interface.'
