    \ As noted previously, the compiler creates a default constructor for class and\
    \ record types if no user-defined or positional constructors are present; however,\
    \ the compiler won’t synthesize a parameterless constructor for any value type.\
    \ Therefore, if we want to use field or property initializers for struct or record\
    \ struct types, we must also define at least one constructor of our own. This\
