    # Summary


    > All animals are equal, but some animals are more equal than others.

    > —George Orwell, Animal Farm


    For such a simple expression, comparing two variables for equality can represent
    a wide variety of behavior, from using a simple built-in equality check with ceq
    in the compiled code all the way up to the compiler automatically generating the
    correct code to perform a comparison. We’ve looked at how references are compared,
    how overriding the Equals method and == operator can affect behavior, and how
    the compiler can generate code to make sure the “right thing” happens.


    For many programmers, using == to compare variables comes more naturally than
    calling the Equals method. For the built-in numeric types, using == is always
    more efficient, although with the binary floating-point types float and double,
    we have to be cautious of using either approach. Notwithstanding that, the cost
    of calling a method is very small, but it can never be as fast as the intrinsic
    ceq instruction.


    The purpose of examining these effects in such intricate detail is to demonstrate
    that we can’t necessarily take for granted what such a simple expression does
    when a program runs. The run-time complexity of any expression may be hidden from
    view, perhaps masked by the compiler choosing an unexpected method overload or
    override instead of a direct comparison between two variables. Certainly the performance
    costs in such examples are small, but they might be significant in “hot” paths
    through a program.


