- pgno: 39
  md: "We introduced Speed and Angle as specific types so that we could tell them\
    \ apart, and because using a plain double was simply too general to represent\
    \ those measurements. However, the implicit conversions make Speed and Angle indistinguishable\
    \ from double.\n\nWe can still achieve our objective of making our types easy\
    \ to use in arithmetic expressions, but we need to keep control over which operations\
    \ those types can perform. We’ll allow specific operations on Speed and Angle\
    \ without sacrificing their natural usage or compromising the encapsulation of\
    \ the types.\n\n# Overloading Arithmetic Operators\n\nOur initial motivation for\
    \ introducing implicit conversions for Speed was to support the multiplication\
    \ operation between a Speed and the TotalSeconds property of a TimeSpan value.\
    \ Currently, we must use the Amount property of a Speed to make that calculation,\
    \ as shown here:\n\n```\nvar x = speed.Amount * elapsedTime.TotalSeconds *\n\n\
    --snip--\n```\n\nArithmetic operations such as * for multiplication are predefined\
    \ for the built-in numeric types like double. We can define the meaning of these\
    \ symbols for our own types by providing arithmetic operator overloads. Listing\
    \ 1-16 shows the multiplication operator overload for Speed.\n\n```\npublic readonly\
    \ struct Speed\n{\n    public static Speed operator*(Speed left, double right)\n\
    \        => new (left.Amount * right);\n\n    --snip--\n}\n```\n\n*Listing 1-16:\
    \ Supporting multiplication in Speed*\n\nWe use a target-typed new expression,\
    \ introduced in C# v9.0, to create the value for operator* to return. The compiler\
    \ knows that the expected type is a Speed, as it’s being directly returned, so\
    \ we don’t need to explicitly specify the type as new Speed(...). The compiler\
    \ will infer the type according to the value expected by the left side of the\
    \ expression.\n\nBeing able to multiply a speed value by a number makes intuitive\
    \ sense; something might be traveling at double the speed of something else, for\
    \ example. We implement the operator by creating a new Speed from the product\
    \ of the Amount property and the value passed to the operator’s parameter. The\
    \ constructor for Speed will check that the result is within the allowed range\
    \ of a Speed and will throw an exception if the result is out of range. We can\
    \ demonstrate that this works with a simple test, such as Listing 1-17, where\
    \ we attempt to multiply a Speed by a negative number."
