- pgno: 170
  md: 'Dividing 0.0 by 0.0 certainly produces a NaN, so many programmers would expect
    this equality test with NaN to pass, but it doesn’t. The IEEE-754 standard states
    that two NaN values don’t compare equal, so this test’s failure is correct behavior.
    Instead, C# provides the IsNaN static method, which we use like this:


    ```

    Assert.That(double.IsNaN(x), Is.True);

    ```


    As of C# v8.0, we can use a constant pattern to make the comparison more naturally:


    ```

    Assert.That(x is double.NaN, Is.True);

    ```


    The compiler translates the pattern expression into double.IsNaN(x), so there’s
    no comparison using either == or Equals. The IsNaN method will always give us
    the correct result. It also highlights one important difference between comparing
    floating-point values with == and using the double.Equals method: the Equals method
    compares floating-point values with ceq, but, unlike the == operator, Equals also
    calls IsNaN when the values are not equal. Consider the following test, where
    we compare two NaN values by using the Equals method:


    ```

    var x = 0.0 / 0.0;


    Assert.That(x.Equals(Double.NaN), Is.True);

    ```


    This test passes because, according to the Equals method, double and float values
    compare equal when the values are exactly equal or are both NaN. The result of
    Equals for floating-point numbers may therefore differ from the result of using
    ==, which doesn’t compare the results of IsNaN. Both Equals and == ultimately
    make a strict comparison of float and double values using ceq, so we shouldn’t
    rely on using either approach to compare floating-point numbers, because the result
    might not be what we expect.


    NOTE

    Some calculations can result in positive or negative infinity, represented as
    double.PositiveInfinity and double.NegativeInfinity, respectively. While either
    value may be an incorrect result, infinite values aren’t usually considered invalid
    in the same way as NaN. We can compare a value with double.PositiveInfinity or
    double.NegativeInfinity in a constant pattern by using the is keyword, but values
    can also be directly compared using == with either kind of infinity.


    # Reference Equality


    As Chapter 2 explained, a reference is either null or an opaque handle to an object
    on the heap. An object can have several references to it, and two references to
    the same object compare equal. Every object instance has a unique identity, and
    the value of a non-null reference is the identity of the object to which it refers.
    To tell whether two references refer to the same object or different instances,
    then, we use an identity comparison.'
