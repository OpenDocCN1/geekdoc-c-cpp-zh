  md: '# Non-destructive Mutation


    Records and record structs support the non-destructive mutation syntax, and as
    of C# v10.0, so do structs and anonymous types. Syntactically, non-destructive
    mutation is similar to object initialization, except that it initializes a new
    instance by copying an existing one and providing new values for selected properties
    in that copy. Listing 2-22 demonstrates this syntax, using the with keyword to
    copy the orange record variable to a new variable named yellow, and then assigning
    a new value to one of the properties of the copy.


    ```

    public sealed record Color(int Red, int Green, int Blue);

    var orange = new Color(0xFF, 0xA5, 0);


    var yellow = orange with { Green = 0xFF };


    Assert.That(yellow.Red, Is.EqualTo(0xFF));

    Assert.That(yellow.Green, Is.EqualTo(0xFF));


    Assert.That(orange.Green, Is.EqualTo(0xA5)); // unchanged in orange

    Assert.That(orange.Blue, Is.EqualTo(0));

    ```


    Listing 2-22: Initializing a copy of a record with non-destructive mutation


    The with expression we use when we create the yellow variable creates a new instance
    of the Color record with property values identical to the original orange instance.
    Those properties specified between the braces following with are then assigned
    the values by using the same syntax as object initialization. This approach is
    called non-destructive mutation because no changes are made to the original record.


    Constructors and initializers are both ways we can create new instances with known
    values. However, sometimes we can’t provide an initial value for a variable, but
    leaving it uninitialized is too restrictive: we can’t even test it to see whether
    it has a value, owing to the rules governing definite assignment. In the next
    section, we’ll examine the options open to us when we need a variable with no
    value, and how value types and reference types differ here too.


    # null Values and Default Values


    A plain value type variable can never be null. An instance of a value type directly
    contains all of its fields, and there’s not necessarily a representation of “no
    value.” A default-initialized instance of a value type is not the same thing—it’s
    a complete instance of the type, just with the default-initialized values for
    each of its fields.


    We can employ a nullable value type, which can be assigned and compared with the
    value null, as you’ll see shortly, but plain value type instances are incompatible
    with null. The null constant expression is a reference and therefore can be assigned
    only to reference variables. One of the'
