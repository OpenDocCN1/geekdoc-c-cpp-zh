- pgno: 50
  md: "```\npublic readonly struct Angle\n{\n    private Angle(double size)\n    \
    \    => radians = size;\n\n    public static Angle FromRadians(double size)\n\
    \        => new (size);\n\n    public static Angle FromDegrees(double size)\n\
    \        => new (size * Math.PI / 180);\n\n    public double InRadians => radians;\n\
    \    public double InDegrees => radians * 180 / Math.PI;\n\n    private readonly\
    \ double radians;\n}\n```\n\nListing 1-32: Adding unit conversions to Angle\n\n\
    Just as we did for Speed, we’ve added class factory methods to create an Angle\
    \ in either degrees or radians, with corresponding properties to obtain the value\
    \ in either unit. Now we can use an Angle easily with methods that require a value\
    \ in radians, and using Angle is also much more convenient for users, who tend\
    \ to think in degrees.\n\n# Choosing the Most Natural Usage\n\nThe Math.Cos and\
    \ Math.Sin methods take a double argument, so we need to explicitly access the\
    \ Angle.InRadians property to call those methods. We can’t change the parameter\
    \ type of those methods because they’re part of the Standard Library, but we can\
    \ add similarly named methods to the interface of Angle, which would allow us\
    \ to encapsulate the explicit need to express the units. We can take three main\
    \ approaches, each with its advantages and drawbacks, and each implemented by\
    \ forwarding an Angle value in radians to its counterpart static Sin and Cos methods\
    \ in the Math static class.\n\nThe most direct approach is to introduce Sin and\
    \ Cos instance methods for Angle, passing the size field value to the corresponding\
    \ Math method, like this:\n\n```\npublic readonly struct Angle\n{\n    --snip--\n\
    \n    public double Sin() => Math.Sin(size);\n    public double Cos() => Math.Cos(size);\n\
    \n    private readonly double size;\n}\n```\n\nThis approach works because we’ve\
    \ chosen radians as the underlying unit for an Angle and we provide methods to\
    \ convert to and from degrees."
