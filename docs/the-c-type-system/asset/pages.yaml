- pgno: 309
  md: "# Table 8-26: The Direct for Loop Performance\n\n| Method | Time (ms) | Signature\
    \ |\n|---|---|---|\n| 100% ToList | 417 | ToList(Int32) |\n| 67.3% MakePurchase\
    \ | 281 | MakePurchase(Int32) |\n| 5.70% op_Implicit | 24 | System.Decimal.op_Implicit(Int32)\
    \ |\n\nOnce again, there’s no significant difference between the performance of\
    \ the for loop approach and that of the other approaches we’ve tried. The main\
    \ difference between using LINQ and using either the foreach or for loop is one\
    \ of style: the LINQ code is more direct and allows us to express our intent declaratively,\
    \ whereas the for and foreach loops are more procedural. The LINQ expression allows\
    \ us to focus on the outcome we require, whereas both looping approaches focus\
    \ on the steps or instructions to follow.\n\n# Pattern Matching and Selection\n\
    \nOne common benefit of a declarative rather than procedural style is that we\
    \ write less code to achieve the same result. While this saves on the amount of\
    \ typing we do, that is just a side effect. The real benefit comes from having\
    \ less syntax for a human reader to comprehend. Replacing explicit loops with\
    \ LINQ-style functional expressions is one example. Many of the LINQ expressions\
    \ are based on loops internally, but the loop constructs themselves are hidden\
    \ from user code. Manually iterating sequences with loops and explicit conditions\
    \ can be prone to errors, and complex loop constructs are generally harder for\
    \ a human reader to follow than a call to a method like Select or ToList.\n\n\
    The other common application of declarative techniques is in selection code: replacing\
    \ if and switch statements with pattern-matching expressions. Consider the constructor\
    \ in Listing 8-28, which validates the parameter value by matching it against\
    \ the rules specified by some patterns.\n\n```\nprivate const double ZeroKelvin\
    \ = -273.15;\n\nprivate Temperature(double celsius)\n    => amount = celsius switch\n\
    \    {\n        double.NaN\n            => throw new ArgumentException(--snip--),\n\
    \n        < ZeroKelvin or double.PositiveInfinity\n            => throw new ArgumentOutOfRangeException(--snip--),\n\
    \n        _ => celsius\n    };\n```\n\nListing 8-28: Pattern matching for validation"
