- pgno: 282
  md: "# The ValueType.Equals Method\n\nWhen the fast bitwise comparison isn’t applicable,\
    \ the implementation of Equals in ValueType is necessarily very general, because\
    \ it must work for any struct type, regardless of the number of fields the struct\
    \ has or their type. In addition to having fields of built-in primitive types,\
    \ a struct can contain references to class instances and instances of other user-defined\
    \ values, any of which may have its own custom Equals implementation.\n\nThe implementation\
    \ of ValueType.Equals first must determine which fields need to be compared. It\
    \ does this by using reflection—programmatically inspecting (or changing) the\
    \ run-time structure of the program—to discover all the instance fields, which\
    \ immediately comes with a quite significant run-time cost. Reflection isn’t usually\
    \ associated with high-performance algorithms, and this certainly accounts for\
    \ the reduction in performance caused by altering our struct’s int fields to use\
    \ byte instead.\n\nAfter determining the array of fields, ValueType.Equals obtains\
    \ each field’s value. If the field value isn’t a null reference, its Equals method\
    \ is called with the value from the corresponding field in the struct being compared.\
    \ As a result, every value type field in both structs will be boxed in order to\
    \ perform the comparison, because using reflection to obtain the values means\
    \ each value is accessed via an object reference, adding further cost.\n\nThe\
    \ root cause of our performance problem is that the change from using int properties\
    \ to byte values means that the underlying backing fields of Color are no longer\
    \ tightly packed. Consequently, ValueType.Equals can’t use the fast bitwise comparison\
    \ and instead employs reflection to discover the values to be compared. To address\
    \ this issue, in Listing 8-5 we override the Equals method and provide our own\
    \ implementation to compare the property values.\n\n```\npublic readonly struct\
    \ Color\n{\n    public Color(int r, int g, int b)\n        => (Red, Green, Blue)\
    \ = ((byte)r, (byte)g, (byte)b);\n\n    public byte Red { get; }\n    public byte\
    \ Green { get; }\n    public byte Blue { get; }\n\n    public override bool Equals(object?\
    \ obj)\n        => obj is Color other &&\n           Red == other.Red && Green\
    \ == other.Green && Blue == other.Blue;\n}\n```\n\nListing 8-5: Overriding the\
    \ Equals method"
