- pgno: 310
  md: "The Temperature constructor throws an exception if the argument given is double.NaN\
    \ and also prohibits values that are less than ZeroKelvin or equal to PositiveInfinity.\
    \ Values for the celsius parameter that don’t match either of those rules are\
    \ assigned to the amount field by the discard pattern, which is the final pattern\
    \ in the switch expression.\n\nCompare Listing 8-28 with Listing 8-29, which achieves\
    \ exactly the same outcome but uses if…else statements to test the incoming parameter\
    \ value.\n\n```\nprivate Temperature(double celsius)\n{\n    if(celsius is double.NaN)\n\
    \    {\n        throw new ArgumentException(--snip--);\n    }\n    else if(celsius\
    \ < ZeroKelvin || celsius is double.PositiveInfinity)\n    {\n        throw new\
    \ ArgumentOutOfRangeException(--snip--);\n    }\n    else\n    {\n        this.amount\
    \ = celsius;\n    }\n}\n```\n\nListing 8-29: Chaining if and else for validation\n\
    \nWe could make this code less syntax-heavy by removing the redundant else statements\
    \ and allowing the if blocks to fall through if the value doesn’t meet the if\
    \ condition. While doing so would make the code shorter, it’s more error-prone\
    \ if new conditions are added.\n\nAnother alternative is to use a switch statement,\
    \ as shown in Listing 8-30.\n\n```\nswitch (celsius)\n{\n    case double.NaN:\n\
    \        throw new ArgumentException(--snip--);\n\n    case < ZeroKelvin:\n  \
    \  case double.PositiveInfinity:\n        throw new ArgumentOutOfRangeException(--snip--);\n\
    \n    default:\n        this.amount = celsius;\n        break;\n}\n```\n\nListing\
    \ 8-30: Using a switch statement for validation\n\nThis version is closer to the\
    \ switch expression in Listing 8-28, and the two forms of switch can be easily\
    \ confused. The principal difference is that here we assign the amount field as\
    \ part of the default leg, whereas in the switch expression, the amount field\
    \ is assigned the value of the whole expression."
