    like games and more, or you just want to be able to add something new to your
    toolbelt of coding languages that you want to learn along the way, you will find
    that the `C++` language is going to be the right choice for your needs.


    ## Drawbacks of C++


    Now, we do need to remember that even though the `C++` language has a whole host
    of benefits to work with as we discussed above, there are going to be a number
    of drawbacks to working with this language, which is why not every programmer
    out there will choose this one for their needs.


    The first negative here is that there isn’t any security with this language. In
    a world that is very connected, and exploitation can happen at any turn, the lack
    of security is going to be a big turn off for a lot of programmers. A few of the
    other negatives that we are going need to consider when it comes to using the
    `C++` language include:


    1. It is going to be hard to work with when we want to combine it or use it in
    a high-level program, especially one that is large.

    2. It is often going to be used just for some platforms that are application-specific.

    3. It is often going to be used just for one particular platform or operating
    system. It could be switched over to something else if we would like, but the
    library is going to lock on the one and will struggle when moved in some cases.

    4. When we try to work with `C++` for some of our web applications, the coding
    can be a bit complex to handle, and often there will be a lot of difficulties
    when it is time to debug it.

    5. This language is not going to support the process of garbage collection.

    6. `C++` is not going to be secure because it is going to come with a few different
    parts that prevent this, most notably the `global variable`, `friend function`,
    and the `pointer`.

    7. And there will also not be any support for the threads that are built into
    all of this.

