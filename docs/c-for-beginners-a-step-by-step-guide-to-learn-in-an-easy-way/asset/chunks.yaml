    1. 在基类中存在的友元函数。

    2. 在基类中存在的重载运算符。

    3. 与我们的基类涉及的析构函数、构造函数以及任何拷贝构造函数。


    我们需要确保特别关注访问控制中出现的某些不同部分。如果基类中存在某些限制，这将介入并导致我们正在处理的继承出现一些问题。子类（或派生类）也会在此过程中注意到这一点。


    ### 继承类型


    既然谈到了这里，我们需要更仔细地观察我们可以使用的继承类型。当我们首先尝试从其中一个基类派生出一个类类时，该基类有可能通过私有（private）、受保护（protected）或公有（public）继承被继承。你使用的继承类型将通过我们在上面讨论过的访问修饰符来指定。现在，你会发现我们使用私有或受保护的继承并不常见，尽管这是可行的。只需注意在此过程中会出现一些问题，而且这些问题处理起来并不那么容易。


    我们最可能使用的方法是公有继承。尽管公有选项是我们最常用的，但我们需要查看在处理不同类型的继承时会发生的一些规则。我们在处理这种继承时，需要记住的不同规则包括：


