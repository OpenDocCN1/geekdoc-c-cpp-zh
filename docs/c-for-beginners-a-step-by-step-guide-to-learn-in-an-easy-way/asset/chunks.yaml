  trans: '


    # 9. C++ 将成为一种能够与其他语言协作的语言，并且它与 `C` 语言是自动兼容的。


    如果你过去使用过 `C` 语言并希望将它们结合起来，那么你会发现 `C++` 完全能够适应这一点，而且花时间学习如何实现这一点是值得的。


    # 10. C++ 语言的特性


    根据我们使用该语言进行编码的总体目标，在在使用 `C++` 语言时，我们还将享许多其他特性。


    它将允许我们重用某些代码（例如继承所必需的代码），并且也将支持多态过程。当我们使用这种语言时，还有良好的可移植性。`C++` 提供的可移植性将允许无论我们想使用哪种硬件，都能开发出我们需要的程序。如果我们将来担心这方面的问题，它还允许我们将所有程序开发工作从一个平台迁移到另一个平台。


    这些只是程序员喜欢使用 `C++` 语言的少数原因之一。在处理我们拥有的编码项目时，它包含了我们寻找的所有兼容性、强大、特性等，并且确实能确保我们完成工作。有时，它被批评为比
    `Python` 等其他选项稍微难学，但它拥有你所需的所有部分，并可以在短时间内完成所有工作。


    正如我们在这里看到的，当我们需要使用 `C++` 语言时，我们可以享受到很多好处。它可能不是在你尝试学习新编码语言时首先出现的语言，但它是最好的语言之一，将是确保我们能够在过程中获得理想结果的绝佳选择。无论你是在寻找一种能够处理你想创建的强大程序（如游戏等）的语言，还是只是想在学习过程中为编码语言工具箱添加一些新东西，你都会发现
    `C++` 语言将是你需求的正确选择。


    ## C++ 的缺点


    现在，我们需要记住，尽管正如我们上面讨论的，`C++` 语言拥有一系列优势，但使用这种语言也会存在许多缺点，这就是为什么并不是每个程序员都会根据自己的需求选择它。


    这里的第一个负面因素是这种语言没有任何安全性。在一个连接非常紧密的世界里，漏洞利用在任何一个转角都可能发生，缺乏安全性将让许多程序员望而却步。在使用 `C++`
    语言时，我们还需要考虑的其他几个负面因素包括：


    1. 当我们想将其结合或在高级程序（尤其是大型程序）中使用它时，它会很难处理。

    2. 它通常只用于某些特定应用程序的平台。

    3. 它通常只用于某个特定的平台或操作系统。如果我们愿意，可以将其切换到其他东西，但库将锁定在特定的一个，并在某些情况下移动时遇到困难。

    4. 当我们尝试用 `C++` 开发某些 Web 应用程序时，编码处理可能有点复杂，在需要调试时通常会有很多困难。

    5. 这种语言将不支持垃圾回收过程。

    6. `C++` 将是不安全的，因为它包含几个防止安全性的不同部分，最显著的是`global variable`（全局变量）、`friend function`（友函数）和
    `pointer`（指针）。

    7. 此外，对所有这些内置线程将没有任何任何支持。


