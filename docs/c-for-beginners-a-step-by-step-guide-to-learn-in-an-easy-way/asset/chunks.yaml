    # Starting New Lines At the Right Time in C++


    The spacing and the lines that you use in this language will be really important
    to the amount of success that you are going to see with it. If you do not space
    things out in the proper manner, there could be some trouble with reading and
    understanding the code that you write, and this can add to more trouble later
    on.


    When you decide to write out any of the codes that are needed in your program
    for C++, it is important that you go through and use the right line spacing to
    make it work. It is not necessarily a good thing for us to go through and write
    out the whole code on one single line, without pauses or any breaks to it at all.
    This is technically fine to do because the compiler will be able to read through
    it whether you do this or use another method of separating things out. But when
    an actual person takes a look at it and tries to figure out what is showing up
    there, they will be confused because it is such a mess.


    To see how this works and what we are talking about here, consider the following
    example:

    ```cpp

    cout << Try This;

    >> endl; << Today I ate Pizza and did Math;>> endl; <<6=(7-1);>> endl; << That
    is what I learned today;>> endl; return 0

    ```

    This line is technically right. You would be able to put it into the compiler,
    and it will read through all of this just fine. However, it is really hard to
    read through this, especially if you are brand-new to the idea of coding. This
    particular one would not be that bad, but if you get to a longer code, it would
    be almost impossible to figure out what is going on or even to catch mistakes
    that you may have made.


    There is another way that you can write out the code. It will mean the exact same
    thing, and the compiler will read it the same way, but it is better because other
    programmers, as well as yourself, will be able to read through the code a little
    bit better. a better way to write out the code includes the following:

    ```cpp

    cout << Try This;

    >> endl; <<Today I ate Pizza and did Math;>> endl; <<6=(7-1);>> endl; << That
    is what I learned today;>> endl; return 0

    ```

    As you can see, this is much easier to read through. It says the exact same thing
    as the first one, but it looks a lot better and it easier easier to read. Good
    coding practices will ask you to write like on the second example, rather than
    the first one, although your compiler will accept both.


    ## The C++ Functions


    We can’t get too far in our discussion about how to work with C++, or any coding
    language for that matter, without first taking a closer look at how the functions
    are going to behave for us. When we work with the functions, this simply means
    that we are focusing some attention on a group of statements that are supposed
    to work together to help us get a specific task done in the process.


    You will find that each of the programs and applications that you use C++ to create
    will have at least one function in it, which is going to be known simply as the
    `main()` function here. But it is common, especially when you are working with
    some of the longer codes and programs, to have a bunch of functions that will
    show up in your code.


    There are a few ways that we can take these functions and make them work well.
    First, we can take our code and divide it up so that we have several functions
    in control, based on what the code is supposed to do. How you go through and divide
    up the code is going to depend on what you are trying to do with that code overall.
    But the most logical choice that a lot of programmers are going to focus on is
    to divide up all of the functions so that they are able to handle some of their
    own tasks.


    To get the function to work at all, though, we need to declare that function.
    A function declaration is going to tell the compiler about the functions name,
    the parameters that we want to have around the function, and the return type that
    we want to get back. However, the definition of a function is going to be provided
    in the body of any function that we want to create.


    The standard library that we see with this language will provide us with a number
    of functions that are already usable and that we can call up. For example, one
    of these is the `strcat()` function, and it can be used in order to concatenate
    two strings, and then you can use the function of `memcpy()` to help us take the
    location of memory from one spot to one one. These are just a few of the functions
    that you can work with and they will work in a similar way.


    So, let’s take a look at how the functions in C++ will work. You can define it
    with the following:

    ```cpp

    Return_type function_name (parameter list ) {

    Body of the function

    }

    ```

    The definition of the functions that we have here are going to consist of a header
    for the function, as well as its body. Some of the different function parts that
    we need to look at will include the following:


    ### 1. The return type

    In some cases, when we are using a function, it is going to return a value of
    some sort to us. When this is going to happen, we are going to work with the `return_type`
    in order to get something to actually come back to us. Some of our functions will
    be able to do the operations that you would like here without returning value
    to you. With the syntax that we wrote out above, you would get a value returned,
    though the value is going to be “void.”


    ### 2. Function name

    Then we are able to work with the function name. This is going to be the name
    that you can give to your function with a parameter when you are ready. You will
    also end up getting what is known as the function signature as well.


    ### 3. Parameters

    The parameters are simply going to be a kind of placeholder to work with. When
    you are ready to invoke one of your functions, you will simply pass value over
    to one of the parameters. This value is going to be referred back as the argument
    or the actual parameter. The parameter list will then be able to refer to the
    order, the number, and the type of parameters that go to the function. It is possible,
    in some cases, to work with a function that does not have these parameters in
    place at all.


    ### 4. Function body

