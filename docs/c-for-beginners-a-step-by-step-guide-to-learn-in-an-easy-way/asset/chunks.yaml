    \n### While 循环\n\n我们在这里看到的第一个循环被称为 `while` 循环。`while` 循环是在当满足条件时继续循环并重复必要的行的选择。程序将读取信息并每次测试条件。一旦条件不再为真，循环将停止并进入代码的下一个部分。\n\
    \n```cpp\nwhile (condition) {\n    // Statements\n}\n```\n\n### For 循环\n\n我们可以处理的第二种循环被称为\
    \ `for` 循环。这种 `for` 循环是在首先测试条件为真后才重复自身的。根据我们上面做的 `while` 循环，这意味着根据给计算机的输入，当条件被视为假时，循环将不会发生。如果你正在做一个循环至少发生一次的程序，那么\
    \ `for` 循环是正确的选择。\n\n```cpp\nfor (i: conditions; increment) {\n    // Statements\n\
    }\n```\n\n### Do While 循环\n\n第三种循环是这里讨论的、在 C++ 中运行良好的独特类型。`do-while` 循环稍有不同，尽管你会注意到它与我们上面做的\
