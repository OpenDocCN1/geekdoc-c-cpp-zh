    ## The Comments in C++


    The first part of the syntax that we are going to take a look at in the C++ language
    is the comments. These are going to be a nice thing to learn about because they
    will ensure that we are able to leave a little message or a note in the code that
    we are writing, without it affecting how the code is going to behave. These comments
    are going to help us or others who take a look at the code, get a better understanding
    of what you would like to accomplish with this code. As a beginner, you will find
    that a lot of codes that will include these kinds of comments so that you will
    have a better idea of what is going on there. You will find that these comments
    are going to help to guide you with what you are hoping to get done in the code,
    and we are technically able to add in as many of these as we want into our codes.
    The rule of thumb here, though, is that you want to limit the comments to just
    the ones that are necessary so that you don’t make the codes a mess.


    To make the comments in this language, we need to use the `//` symbol ahead of
    the comment. This is going to tell the compiler that you are writing out one of
    these comments, and it should just skip over this part and not include it int
    the execution that you work with here. You can add these into any part of the
    code that you would like, and the compiler will know what is going on. It is also
    possible for us to write out a comment that takes up more than one line, or is
    a little bit longer even in this language. This is something that is a bit hard
    to do in other languages but is unique to the C++ language. When you want to go
    through and have a code that takes on more than one line, you would add in the
    `/*` to the beginning of the comment, and then whenever it ends, you would use
    the `*/` symbol. When the compiler sees this, then it is going to know that it
    should proceed through the code without reading any of this at all.


