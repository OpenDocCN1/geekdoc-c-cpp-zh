  trans: "\n我们将处理的最后一种继承类型是私有继承。当我们尝试从一个私有基类派生新类时，基类中的受保护（protected）和公共（public）成员都会进入派生类，但这些成员将变为私有（private）成员。正如我们看到的，这些情况彼此会有所不同。这就是为什么我们需要对要使用的继承类型保持谨慎。如果你处于不同的继承类型中，成员函数并不总是按照你想要的方式工作。双重检查你处于哪种继承中，并确保设置了正确的类型，以便它能够按照你想要的方式运行。\n\
    \n## 多重继承\n\n在 C++ 语言能够实现的的某些继承中，我们最后想要看的内容是处理多重继承的想法。这种语言中的其中一个类可以通过继承获得来自多个类的成员。我们可以在此基础上使用的扩展语法如下所示：\n\
    \n`Class derived-class; access baseA, access baseB, …`\n\n我们可以根据需要添加尽可能数量的基类，但请确保只使用必要的类，否则在过程中你最终会面对得一团糟。我们之前讨论过的访问权限规则在这一过程也同样适用。访问权限为\
    \ private、protected 或 public 之一，并将为每个基类提供，然后使用我们说过的相同语法用逗号隔开。\n\n观察这些多重继承如何工作的一种好方法也是对它们进行一些练习。看看下面的代码，看看我们如何创建一个这样的类，或者至少基于几个不同的基类来创建一个新的派生类：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\n// 基类 Shape\nclass Shape\
    \ {\npublic:\n    void setWidth(int w) {\n        width = w;\n    }\n    void\
    \ setHeight(int h) {\n        height = h;\n    }\nprotected:\n    int width;\n\
    \    int height;\n};\n\n// 基类 PaintCost\nclass PaintCost {\npublic:\n    int getCost(int\
    \ area) {\n        return area * 70;\n    }\n};\n\n// 派生类\nclass Rectangle: public\
    \ Shape, public PaintCost {\npublic:\n    int getArea() {\n        return (width\
    \ * height);\n    }\n};\n\nint main(void) {\n    Rectangle Rect;\n    int area;\n\
    \    Rect.setWidth(5);\n    Rect.setHeight(7);\n    area = Rect.getArea();\n \
    \   // 打印对象的面积。\n    cout << \"Total area: \" << Rect.getArea() << endl;\n   \
    \ // 打印油漆的总成本\n    cout << \"Total paint cost: $\" << Rect.getCost(area) << endl;\n\
    \    return 0;\n}\n```\n\n花些时间输入这些代码并看看在这个过程中你能得到什么结果。答案应该告诉我们总面积，同时给出我们应该处理的总油漆成本。这只是我们通过多重继承能够做到的示例之一，但正如你所看到的，使用它非常有趣，而且相当简单。\n\
    \n在你自己的代码中，会有很多次想要处理和使用继承。这是一个非常简单的过程，当它正确完成时，将对于确保我们的代码结构整洁非常有帮助，并在过程中可以节省大量时间。请记住，这些继承是独特的，因为它们只在我们讨论过的这些面向对象编程（OOP）语言中起作用。如果我们不使用这些类型的语言之一，那么这种语言附带的基本概念将无法真正起，如果我们尝试的话，最终会演变成一团糟。但由于\
    \ C++ 语言被视为这些 OOP 语言之一，因此我们可以利用它的优势之一来处理继承，这是很有意义的。虽然看起来获取一个类并使用该信息来创建一个我们选择的新基类很困难，但我们上面写的代码将向我们展示它是如何工作的，以及处理它是有多简单。\n\
    \n在本章中讨论的继承有很多益处。它们可以帮助清理我们想要处理的代码；它们将确保我们能够重用部分内容，在过程中节省大量时间，并且将真正加快你代码的实现。如果你需要重用某些代码，或者你希望将旧代码部分中的某些功能添加到你创建的新类中，那么继承就是完成此任务的方法。\n\
    \n## 第 9 章：多态的概念\n\n我们还需要花一些时间查看另一个事情是多态的概念。这是一个独特的想法，与我们在其他某些选项中看到的有所不同，但在过程中，它将真正帮助我们在代码的某些部分获得良好的结果。考虑到这一点，让我们看看如何处理多态，以及它将如何融入你想要处理的代码中。\n\
    \n首先，“多态”这个词意味着它有许多形式。在大多数情况下，我们将看到多态发生在代码中已经存在类层次结构时，并且由于由于我们上面讨论的继承过程，所有这些类都是相关的。C++\
    \ 多态意味着对成员函数的调用将导致实际执行不同的函数。这里执行的函数将取决于调用该函数的对象类型。观察所有所有多态在我们的代码中应该是如何工作的的一种好方法，我们可以看一个示例。下面的示例将向我们展示一个基类是如何被另外两个类派生的：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nclass Shape {\n    protected:\n\
    \    int width, height;\n    public:\n        Shape( int a = 0, int b = 0){\n\
    \            width = a;\n            height = b;\n        }\n        int area()\
    \ {\n            cout << \"Parent class area :\" <<endl;\n            return 0;\n\
    \        }\n};\n\nclass Rectangle: public Shape {\n    public:\n    Rectangle(\
    \ int a = 0, int b = 0):Shape(a, b) { }\n    int area () {\n        cout << \"\
    Rectangle class area :\" <<endl;\n        return (width * height);\n    }\n};\n\
    \nclass Triangle: public Shape {\n    public:\n        Triangle( int a = 0, int\
    \ b = 0):Shape(a, b) { }\n    int area () {\n        cout << \"Triangle class\
    \ area :\" <<endl;\n        return (width * height / 2);\n    }\n};\n\n// 程序的主函数\n\
    int main() {\n    Shape *shape;\n    Rectangle rec(10,7);\n    Triangle tri(10,5);\n\
    \    // 存储 Rectangle 的地址\n    shape = &rec;\n    // 调用 rectangle 面积。\n    shape->area();\n\
    \    // 存储 Triangle 的地址\n    shape = &tri;\n    // 调用 triangle 面积。\n    shape->area();\n\
    \    return 0;\n}\n```\n\n当你完成编译代码并给它一些时间执行时，你应该得到基类的面积。但这两个部分都保持为空。这种错误输出的原因是\
    \ `area` 函数的调用是在基类中设置的。我们可以将其称为静态解析，或静态链接。这对我们意味着，在我们甚至执行想要运行的程序之前，函数调用就已经固定了。这被称为早期绑定，因为\
    \ `area()` 函数是在编译期间设置的。但现在我们需要转向另一个方向，并对我们的程序进行一些小修改。在这种情况下，我们在类中 `area()` 的声明之前加上\
    \ `virtual` 关键字。代码看起来如下所示：\n\n```cpp\nclass Shape {\n    protected:\n    int width,\
    \ height;\n    public:\n        Shape( int a = 0, int b = 0) {\n            width\
    \ = a;\n            height = b;\n        }\n        virtual int area() {\n   \
    \         cout << \"Parent class area :\" <<endl;\n            return 0;\n   \
    \     }\n};\n```\n\n在我们能够进行这个小修改后，然后我们再次编译并执行代码，它将在过程中给我们一个稍微不同的结果。我们将得到 Rectangle\
    \ 类面积和 Triangle 类面积。在这种情况下，编译器将查看指针中的内容而不是它的类型。因为 `rec` 和 `tri` 的地址存储在 `shape`\
    \ 中，相应的 `area()` 函数将在任何时刻被调用。这被称为晚绑定或动态链接。除了这一切之外，你可能还会想要在基类中包含你自己的 `virtual`\
    \ 函数以便处理，这通常是可行的方法。\n\n## 总结\n\n感谢你完成《初学者 C++》的最后，希望它是有启发性的，并为你提供了所需的所有工具。下一步是开始编写你想要的各种不同程序。即使你只是刚开始，只想花时间练习一些代码，C++\
    \ 语言也是处理它的最佳选择。\n\n\n"
