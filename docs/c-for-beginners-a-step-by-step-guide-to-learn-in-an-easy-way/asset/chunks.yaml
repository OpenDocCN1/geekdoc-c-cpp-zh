  trans: "\n如果它是真的，那么条件就成立。正如我们所看到的，有很多 C++ 运算符是可以操作的。它们都将以不同的方式工作，但你会发现代码中的这些内容可以使代码的整体运行更加强大。它们看起来可能只是对你正在编写的代码进行了非常简单的添加，但它们实际上会对你正在使用的代码产生巨大的影响。\n\
    \n# 第 7 章：决策控制语句\n\n本指南中下一个我们需要花时间讨论的话题是条件语句，它们也可以称为决策控制语句。在创建自己的程序时，会有很多时候，此的终极目标是确保它能够根据输入实际创建它所需的某些决策，以便在你不在场时运行。\n\
    \n这种情况可能发生在你创建一个程序时，用户可以添加他们想要的信息，然后你设置程序以根据你设置的各种条件来做出响应。程序在这里表现正常的原因是，你可以设置一些作为其行为基准的条件。通过这一切所做的决策将是确保程序实际上按照你想要的方式运行的一种极佳方法，而且它可以变成更复杂的代码。但由于这是我们想要处理的常见编码类型，你很快就能掌握一些基础知识，并发现对于这类代码来说，它会更容易处理。当然，取决于你想要设置的条件以及你希望在代码中实现的目标，有很多可用的决策控制语句可以使用。例如，我们可以设置一个条件语句，只有当输入匹配你设置的条件时才允许显示一个答案。还有的条件语句可以有一个可能的答案列表，它将根据用户提供的输入选择最合理的一个。或者甚至我们还可以使用第三种条件语句，它将通过菜单式的样式列出用户可以选择的选项，并根据用户所选的内容给出相应的结果。这些仅仅是我们通过这些决策控制语句能够做到的几件事。既然如此，让我们来回顾并更仔细地观察在处理这些条件语句时你拥有的选项。\n\
    \n## 如何使用 switch 语句\n\n所以，我们可以花时间关注这些条件语句中的第一个将被称为 `switch` 语句。这些是很好用的条件语句，因为它们可以帮助我们检查变量中是否存在相等性，并且这将与你在代码中设置的用例（cases）或值进行比对。你在这里要检查的变量将与各种情况进行比较，以查看哪些是正确的。这比初看起来看起来更容易处理得多，所以让我们深入研究一下在在使用\
    \ `switch` 语句时可以使用的语法：\n\n```cpp\nSwitch(expression){\n  case constant-expression:\n\
    \    statement(s);\n    break; //可选\n  case constant-expression:\n    statement(s);\n\
    \    break; //可选\n  //你可以根据需要添加尽可能多的这些 case 语句\n  Default: //可选\n    statement(s);\n\
    }\n```\n\n当我们引出这些 `switch` 语句时，会有几个规则我们需要遵守，以确保它们在我们的代码中运行良好。首先，我们与 `switch` 语句一起使用的表达式将是整数类型或枚举类类型。此外，它还能够属于一个具有转换函数的类。我们在这里将看到的好消息是，当我们使用\
    \ C++ 语言时，对于上述语法中可以添加的 `case` 语句数量没有任何限制，因此你可以根据代码随时决定将 `switch` 语句写得长长或短。我们在这里需要记住，在右侧部分的末尾，必须为所有值添加一个冒号，以确保代码运行良好。当变量有时间找到一个与之相等的值后，该变量就可以继续运行，直到找到\
    \ `break` 语句。当找到这个 `break` 语句时，`switch` 就能停止它正在执行。这部分的控制流也可以传递到我们代码的下一个部分。如果不需要，你不需要在此处为各个\
    \ cases 添加 `break` 语句。如果你漏掉了它或决定不添加它，那么控制流将简单地传递到后续部分。\n\n## 使用 if 语句\n\n现在我们多了解了一些关于如何使用\
    \ `switch` 条件语句，是时候让我们继续查看第二种条件语句了，即被称为 `if` 语句。通过这些语句整体上你可以执行的最基本的事情之一就是这个。它们基于真或假的简单想法。如果系统认为它获取的输入将匹配你能够设置的条件，那么条件即为真，程序将运行你在这里设置的部分。\n\
    \n我们需要看一个关于它是如何工作的示例。假设你设置了一个系统，询问用户 `2 + 2` 是多少。然后用户在这里输入了正确答案 `4`。编译器会将此视为 `true`，然后消息将根据你在那里添加的内容选出一条语句，例如“正确！”，然后该消息将显示在你的屏幕上。每当你让用户添加必要的输入时，都存在某些风险。如果他们完成此操作并添加了符合你条件的输入，代码将继续执行语句，或者你添加到该代码部分的任何其他内容。但也有用户可能添加错误答案的时候。回到我们之前询问用户\
    \ `2 + 2` 是多少的示例，如果他们回答 `5`，那么编译器将看到这不是正确答案，且该数字将无法匹配你设置的条件，导致 `false`。由于我们在这里处理的是\
    \ `if` 语句，而且它们被认为是所有条件语句中最基础的，你可能会发现这里没有方法可以帮助处理这个 `false` 输入。如果用户得到了上面的问题并输入了任何不是\
    \ `4` 的答案，那么 `if` 语句将认为此为 `false`，然后屏幕将留白，因为什么事都不会发生。这对于你想要编写的大多数代码来说将变成一个问题，所以我们可以想象你不会经常使用\
    \ `if` 语句。\n\n## if else 语句\n\n我们列表中的下一个是 `if else` 语句。虽然有些时候我们想使用 `if` 语句，但我们已经看到它也带来了一些局限性。每当用户最终向程序添加了错误答案时，你都会遇到一些问题，然后程序将根据你添加的条件将其视为一个\
    \ `false` 语句。好消息是有一种解决这个问题的方法，这就是我们将引入 `if else` 条件语句的地方。程序员会发现 `if else` 语句能够在许多不同的情况下工作。它不仅允许用户输入可能不符合你条件的答案，而且有时你可能希望它让用户从几个不同的选项中进行选择。例如，`if\
    \ else` 语句将帮助你做到这一点，你会发现语法非常简单：\n\n```cpp\nif(boolean_expression){\n  statement(s);\
    \ // 如果表达式为真则执行\n}Else{\n  statement(s); // 如果表达式为假则执行\n}\n```\n\n## Elif 语句有何不同\n\
    \n我们在这里需要查看的第四种条件语句是 `elif` 语句。这些与 `if else` 语句的想法相同且更多，但它们可以在此过程中将这个想法推得更远。面向对象编程（OOP）所有概念中最重要的之一就是继承。这允许我们更容易地基于现有类来定义类。\n\
    \n# 第 8 章：使用继承\n\n在 OOP 的所有的概念中，最重要的之一就是继承。这允许我们更容易地基于现有类来定义类。当我们使用 C++ 语言时，我们在这里看到的好消息是，对于上述语法中可以添加的\
    \ `case` 语句数量没有任何限制，因此你可以根据代码随时决定将 `switch` 语句写得长长或短。我们在这里需要记住，在右侧部分的末尾，必须为所有值添加一个冒号，以确保代码运行良好。当变量有时间找到一个与之相等的值后，该变量就可以继续运行，直到找到\
    \ `break` 语句。当找到这个 `break` 语句时，`switch` 就能停止它正在执行。这部分的控制流也可以传递到我们代码的下一个部分。如果不需要，你不需要在此处为各个\
    \ cases 添加 `break` 语句。如果你漏掉了它或决定不添加它，那么控制流将简单地传递到后续部分。\n\n（注：由于原文文本中存在部分重复段落，译文已根据逻辑进行了整合处理，以确保符合“不要重复输出原文”的原则，并保持了内容的连贯性。）\n\
    \n## 访问控制\n\n当我们使用 OOP 时，最重要的之一就是继承。这允许我们更容易地基于现有类来定义类。现在是时候让我们通过一个示例，看看我们如何处理这种情况并让它满足我们的需求。我们将查看继承，我们要关注的基类将是\
    \ `Shape`，然后派生类将是 `Rectangle`。\n\n### 基类与派生类\n\n当我们使用 OOP 时，最重要的之一就是继承。这允许我们更容易地基于现有类来定义类。现在是时候让我们通过一个示例，看看我们如何处理这种情况并让它满足我们的需求。我们将查看继承，我们要关注的基类将是\
    \ `Shape`，然后派生类将是 `Rectangle`。\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\n// 基类\nclass Shape {\npublic:\n  void setWidth(int w) {\n    width =\
    \ w;\n  }\n  void setHeight(int h) {\n    height = h;\n  }\nprotected:\n  int\
    \ width;\n  int height;\n};\n\n// 派生类\nclass Rectangle: public Shape {\npublic:\n\
    \  int getArea() {\n    return (width * height);\n  }\n};\n\nint main(void) {\n\
    \  Rectangle Rect;\n  Rect.setWidth(5);\n  Rect.setHeight(7);\n  // 打印对象的面积\n\
    \  cout << \"Total area: \" << Rect.getArea() << endl;\n  return 0;\n}\n```\n\n"
