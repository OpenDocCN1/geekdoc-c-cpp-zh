  trans: "\n虽然我们通常能够规避这些问题可能产生的一些负面影响，但我们必须记住它们，并思考这些因素对于我们想要在编程中完成的工作是否重要。权衡利弊是确保我们最终能根据需求选择正确的编程语言（例如\
    \ `C++`）来满足所有需求的最佳方法。\n\n# 第 2 章：创建你的第一个程序之步骤\n\n现在我们已经了解了使用 `C++` 编程的一些基础知识，以及为什么有如此多的程序员想要花时间学习如何让它运行，现在是时候将这些都推向下一个阶段了。在本章中，我们需要查看编写自己代码时需要采取的一些步骤。为了做到这一点，我们需要从基础做起，之后你就可以利用这些知识来编写你自己的代码了。在流程的第一部分，在我们能够编写任何代码之前，是处理\
    \ `C++` 环境。环境简单来说就是我们编写代码并将其设置好执行的地方，这就是为什么我们需要确保它已经准备就绪，并且我们使用的是正确的环境。这里需要记住的正面消息是，有很多有很多\
    \ `C++` 环境，尽管最好的通常在 `C++` 的官方网站上找到。一旦下载了该编程语言的环境并准备就绪，就是学习编写第一个代码的正确步骤了。\n\n我们在本章的目标是编写一段代码，在计算机屏幕上显示“Try\
    \ this”（尝试这个）这个短语。这只需要几行就能完成，但它确实包含了我们在代码中所需的许多语法，以获得我们想要看到的最佳结果。仅仅因为它是简单的，并不意味着它不会按照我们想要的方式运行。考虑到这一点，我们用来让这段代码运行良好的代码包括：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main (){\n  cout << “Use\
    \ This One!\";\n  return 0;\n}\n```\n\n在编写这段代码时，你有几个选项可用。你可以选择在你的编译器中编写它（它会出现在你的环境中），或者你可以选择编写它并将其保存到电脑中。第二种方案有时很不错，因为这样你就有了代码的冷备份，并在代码中需要时任何时候都可以复制和粘贴。无论哪种方式，你都应该仔细考虑你想要使用的文本编辑器。大多数编辑器都是特定设备的，因此你需要寻找与你特定电脑匹配的那个。你可以选择的一些选项包括\
    \  记本、`vlm`、`vl`、`Brief` 和 `EMACS`。如果你想要一个可以在多个平台上运行的编辑器，那么 `vlm` 和 `vl` 选项是最好的。\n\
    \n当你在使用 `C++` 编写一些代码时，你需要确保它们是在文本编辑器中写出来的。这将为你的程序提供一个良好的草稿，完成后，它就可以由编译器运行了。这让你的生活变得更简单，因为你可以在运行之前检查代码的机会，并确保其内部不再有任何错误。\n\
    \n## C++ 编译器\n\n既然我们谈到了这里，我们需要看一眼 `C++` 编译器，看看它能为我们做什么工作。就像我们谈过的环境和文本编辑器一样，有很多编译器可以供你选择。不过，这些问题在于，虽然你有很多选项可以尝试，但你会很快发现很多编译器的使用费用非常昂贵。其主要原因是它们被留给精英黑客使用，或者为他们提供了特殊功能。这些人是已经掌握了现有的低级编译器，并正在寻找提升到下一个水平所需的步骤的人。许多\
    \ `C++` 编译器会迎合这一群体，但当然，是有代价的。\n\n这里的好消息是，希望并没有破灭。世界上有一些很棒的 `C++` 编译器既安全可靠又是免费的。你只需要留心并观察你在做什么，以确保找到的是最好的、且仍然具有我们想要全部功能的那些。可以帮助我们进行\
    \ `C++` 编码并具有一些对初学者友好功能的不同编译器之一被称为 `GNU`。它是与 Linux 系统配合使用的最好工具，如果你想使用的正是这个操作系统，那么它已经内置其中了。要检查\
    \ `GNU` 编译器是否已存在于你的电脑上，你只需要使用下面的代码：\n\n```\n$ g++ -v\n```\n\n如果编译器已安装，你应该会在屏幕上看到这条消息：\n\
