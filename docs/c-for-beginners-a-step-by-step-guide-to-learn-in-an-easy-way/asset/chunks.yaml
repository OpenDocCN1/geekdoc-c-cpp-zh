    # 第 4 章：C++ 变量


    在阅读这本指南的过程中，我们稍微提到过变量，但现在是时候深入了解关于这些变量是什么以及为什么它们如此重要的细节了。变量几乎会出现在我们想要使用的任何一种编程语言中，因此现在学习它们对于帮助我们在过程中获得一些结果至关重要。


    它们基本上存储我们需要的某些值，将它们存储在所选计算机的内存中，以便编译器在代码执行时能够将其提取并使用。在我们进行所有 C++ 编码时，重要的一点就是变量。这些变量非常重要，因为它们将帮助我们确保代码的不同部分能够相互匹配，并确保程序在需要使用时实际上能够找到并提取这些部分。


    当你自己的代码中使用这些不同的变量时，你基本上是在为你自己的计算机存储空间留出一个位置。这将使得你在代码稍后需要执行它们时更容易调用它们。你将处理的所有变量都可以关联到不同的类型，而这些类型将有助于决定变量所依赖的内存的大小和布局。当你需要设置一组可以使用并存储在内存中特定位置的值范围时，这也会非常有用。


    话虽如此，你会发现命名变量非常简单。事实上，无论你是否在命名其他标识符，其过程都是相同的。你可以使用字母、数字或下划线来帮助命名变量。请确保不要用数字开头，并且你使用的所有字母都是区分大小写的。除了这少数规则之外，你可以选择任何喜欢的名称作为标识符。


    关于 C++ 中的变量，需要记住的一点是，你有许多类型的变量供你选择。其中最流行的变量包括：


    - `Wchart_t`: 这被认为是宽字符类型的变量

    - `Double`: 这是一个具有双倍精度的浮点值

    - `Void`: 这是表示没有使用某种类型的变量

    - `Int`: 这是一个整数

    - `Float`: 这是浮点数，它只有单倍精度

    - `Bool`: 这是一个返回真或假结果的变量

