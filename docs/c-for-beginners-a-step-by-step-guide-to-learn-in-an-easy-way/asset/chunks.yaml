    # 10. Features of C++ Language


    There are a number of other features that we will enjoy when it comes to working
    with the `C++` language, based on our overall goals when it comes to using this
    for coding.


    It will allow us to reuse some of the codes, such as is necessary for inheritances,
    and it is going to accept the process of polymorphism as well. There is also a
    good deal of portability that will happen when we use this kind of language. The
    portability that comes in `C++` is going to allow us to develop some of the programming
    that we need, no matter what kind of hardware we want to use. It is also going
    to allow us to move the development of all our programming form one of the platforms
    over to another if this is ever a concern for us.


    These are just a few of the reasons that programmers like to work with the `C++`
    language. It has all of the compatibility, power, features, and more that we are
    looking for when it comes to handling the coding projects that we have, and it
    can really ensure that we get the work done. Sometimes it is criticized for being
    a bit tougher to learn how to use than some of the other options like `Python`,
    but it has all of the parts that you need and can get everything done in no time
