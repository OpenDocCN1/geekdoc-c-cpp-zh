    These arithmetic operators are going to use when it comes to addition, subtractions,
    division, and multiplication based on what you are hoping to get the program to
    do. Some of the arithmetic operators that are going to happen in C++ that fit
    in this category and can work well in your code include some of the following:


    - `+`: this is the addition operator that will add together two operands of your
