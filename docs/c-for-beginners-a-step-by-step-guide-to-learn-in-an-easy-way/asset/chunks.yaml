    C++ 语言语法是如何运作的，以及为了让这门语言能够按照我们想要的方式运行而必须出现的一些不同部分。在我们学习本章时，请对我们正在做的内容做笔记，然后留意这些部分何时出现，以及它们在我们想要编写的代码中实际使用的频率有多高。记住，之前我们查看了一个如何在
    C++ 语言中编写代码的良好示例，甚至是代码中将出现的一些主要部分。现在这些都已完成，是时候进一步研究一些通过 C++ 语法可以做的事情了。任何语言的语法（无论我们是在说
    C++ 还是其他语言）都非常重要，因为它确保了代码最终转换为编译器能够理解并执行的内容。考虑到这些，我们是时候学习更多 C++ 语言的语法了，以便能够良好使用它。


    ## C++ 中的注释


    我们在 C++ 语言中将查看的第一部分语法是注释。这是一个非常值得学习的内容，因为它们将确保我们能够在编写的代码中留下一些短消息或备注，而不会影响代码的运行方式。这些注释将帮助我们或其他查看代码的人更好地理解你想要通过这段代码实现的目标。作为初学者，你会发现很多代码都会包含这类注释，这样你就能更好地了解其中发生了什么。你会发现这些注释将帮助你引导你在代码中希望完成的任务，从技术上讲，我们可以在代码中添加任意数量的此类注释。但这里的黄金法是，你要将注释限制在必要的注释上，以免让代码变得混乱。


    为了在这门语言中编写注释，我们需要在注释前使用 `//` 符号。这会告诉编译器你正在编写此类注释，它应该直接跳过这部分，不将其包含在你处理的执行过程中。你可以将这些内容添加到代码的任何部分，编译器都会知道正在发生什么。在这一语言中，我们还可以编写跨多行的注释，即使是稍长一点的注释。这在其他语言中比较难做到，但是
    C++ 语言所特有的。当你想要让代码占据多行时，你可以在注释的开头添加 `/*`，然后在任何结束的地方使用 `*/` 符号。当编译器看到这些符号时，它将知道应该继续执行代码而完全不读取其中的任何内容。


    ##不同的数据类型


    我们想要花时间研究的种编程语言都会花精力研究数据类型的概念。这些类型将帮助推动代码运行，并让你在过程中更容易实际存储你想要的信息。C++ 对这些数据类型的重视程度与其他所有语言一样。你会发现，在
    C++ 语言中编码时，数据类型及其多样性在任何其他语言中一样重要。例如，你经常会花时间处理被称为变量的数据类型，它们是计算机内存中预留的区域，可以确保特定值是安全的，并在需要时可以被提取出来。我们还需要处理许多其他类型的数据点，其中一些包括：


    1. 无值 (Valueless)

    2. 双精度浮点 (Double floating-point)

    3. 宽字符 (Wide character)

    4. 浮点数 (Floating-point)

    5. 整数 (Integer)

    6. 字符 (Character)

    7. 布尔值 (Boolean)


