    ## 引言

    恭喜购买《C++ for Beginners》，感谢您的支持。接下来的章节将讨论在处理 `C++` 语言时需要知道的所有不同事项。在处理编码和编程工作时，我们有许多不同的选项可以探索，其中许多选项都将带来巨大的优势，吸引你使用它们。


    但当需要使用一种背后拥有强大力量和功能的简单编码语言时，就是该使用 `C++` 编码语言的时候了。本指南将花费一些时间查看我们使用 `C++` 语言能做的所有事情，以及学习这种语言实际上有多棒。本指南的开头将花一些时间了解
    `C++` 语言的本质，以及将其引入你的程序带来的某些益处，而不是使用其他许多选项之一。


    当我们掌握了一些基础知识，并对为什么想要使用这种语言有了良好的想法后，就是时候进一步研究我们如何实际上用这种语言编写代码了。在接下来的几章中，我们将观察帮助在该语言中创建我们的第一个程序的正确步骤，然后我们可以花更多时间专门研究
    `C++` 的语法，以及它对于编写我们想要使用的某些代码有多重要。


    现在是时候进入我们专门通过这种语言可以做的某些有趣事情了。既然我们已经知道了如何使用这种语言，以及如何编写简单的代码，我们就可以更进一步，学习如何处理 `C++`
    变量、循环以及数组。我们甚至会更进一步，查看你实际创建某些循环和数组需要的一些代码，并观察如何为变量添加值的基础知识，以便代码以后可以将它们提取出来。


    当我们完成所有这些，并对目前为止关注的某些简单代码的编写方法有了良好的想法时，就是该更进一步了。虽然我们早些在处理变量时看了一些运算符（我们将在指南中讨论这一点），但我们将更深入地研究
    `C++` 中存在的不同类型的运算符以及为什么这非常重要。然后，我们通过查看如何创建自己的决策控制语句来结束这部分，这将确保我们的程序能够根据我们在代码中设置的条件在运行过程中做出正确的决策。


    然后，我们将直接跳到我们可以关注的 `C++` 编码语言的一些更高级的部分。我们将观察如何处理继承的概念，这可以帮助我们充分利用这种语言的 `OOP` 部分，然后我们可以深入研究多态概念需要的一些编码和更多内容，并在此过程中使其针对我们的某些需求良好地工作。


    我们可以处理的编码语言有很多种，其中许多种可以帮助你完成编码工作。但当你想要最好的语言，即那种易于学习同时带有了你在编码语言中想要的所有功能及更多功能的语言时，那么
    `C++` 语言就是你使用的正确选择。当你准备好开始这种特定的编码语言时，请务必查看本指南以开始。


    ## 第 1 章：什么是 C++

    当需要选择一种你想要使用的编码语言时，有很多选择。有些语言是专为在编码方面完全没有经验的初学者设计的。有些编码语言非常适合那些寻找创建在线内容以帮助构建网站或应用程序的方法的人员。


    某些语言与特定的操作系统配合得更好，某些更适合游戏，而另一些则可以用于帮助手机和移动端的需求。在选择编码语言来完成任务时，你有很多选择可以做。了解你想完成哪些项目将帮助你获得结果，会让生活变得简单得多。


    在本指南中，我们将花费一些时间查看 `C++` 语言以及我们能做什么让它为我们良好工作。当处理一种带有深厚历史的优秀编码语言时，你会发现 `C++` 语言是入门的完美选择。事实上，它被认为是世界上最早的语言之一，是第一批帮助我们学习如何编写代码的语言之一。


    由于这种语言已经存在了很长时间，有很多资深程序员和编码人员正在学习如何使用它，并且理解这种编码语言的基础知识以便让它为他们服务。正如我们在这里很快猜到的，`C++`
    将是一种用于编写你想要设计的某些不同代码和不同应用程序的编程语言。


    与今天在市面上找到的许多其他编码语言一样，`C++` 将是一种 `OOP` 语言或面向对象的语言。这对我们来说，这意味着这种语言能够围绕类和对象展开，而不是其他某些选择中的抽象概念。这使得我们更容易编写我们想要的某些代码，你将利用它来防止这些语言必须处理的一些常见问题。`C++`
    是一门很好的学习的编码语言，因为它在设计时就包含了你完成任务所需的所有灵活性。它将带来很大的速度，这将使其成为一种更好的工作编码语言。


