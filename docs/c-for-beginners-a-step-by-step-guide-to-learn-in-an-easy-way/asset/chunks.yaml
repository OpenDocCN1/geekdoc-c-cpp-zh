    \ you are creating, then the inheritances are the way to get this done.\n\n##\
    \ Chapter 9: The Idea of Polymorphism\n\nAnother thing that we need to spend some\
    \ time taking a look at is the idea of polymorphism. This is a unique idea that\
    \ is a bit different than what we are able to see with some of the other options\
    \ out there, but it is going to really help us to get some good results on certain\
    \ parts of our code along the way. With this in mind, let’s take a look at how\
    \ to work with polymorphism and how it is going to fit in with some of the codings\
    \ that you want to work with.\n\nTo start, the word of polymorphism means that\
    \ it will have many forms. For the most part, we are going to see that polymorphism\
    \ is going to occur when there is already a hierarchy of our classes in the code,\
    \ and when all of these classes are going to be related, thanks to the process\
    \ of inheritance that we talked about above. C++ polymorphism means that a call\
    \ to a member function is going to cause a different function to actually be executed.\
    \ The function that is going to be executed here is going to depend on the object\
    \ type that would invoke the function to start with . A good way to see how all\
    \ of this polymorphism is supposed to work in our codes, we can take a look at\
    \ an example. This example below is going to show us where a base class has been\
    \ derived by two other classes as well:\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nclass Shape {\n    protected:\n    int width, height;\n  \
    \  public:\n        Shape( int a = 0, int b = 0){\n            width = a;\n  \
    \          height = b;\n        }\n        int area() {\n            cout << \"\
    Parent class area :\" <<endl;\n            return 0;\n        }\n};\n\nclass Rectangle:\
    \ public Shape {\n    public:\n    Rectangle( int a = 0, int b = 0):Shape(a, b)\
    \ { }\n    int area () {\n        cout << \"Rectangle class area :\" <<endl;\n\
    \        return (width * height);\n    }\n};\n\nclass Triangle: public Shape {\n\
    \    public:\n        Triangle( int a = 0, int b = 0):Shape(a, b) { }\n    int\
    \ area () {\n        cout << \"Triangle class area :\" <<endl;\n        return\
    \ (width * height / 2);\n    }\n};\n\n// Main function for the program\nint main()\
    \ {\n    Shape *shape;\n    Rectangle rec(10,7);\n    Triangle tri(10,5);\n  \
    \  // store the address of Rectangle\n    shape = &rec;\n    // call rectangle\
    \ area.\n    shape->area();\n    // store the address of Triangle\n    shape =\
    \ &tri;\n    // call triangle area.\n    shape->area();\n    return 0;\n}\n```\n\
    \nWhen you have finished with compiling the code above, and you give it some time\
    \ to execute, you should get the result of the parent class area there. But both\
    \ parts are going to be left blank . The reason for this incorrect output is that\
    \ the call of the function `area` is going to be set once by the compiler as the\
    \ version that is defined in our base class. We are able to call this the static\
    \ resolution of the function call, or the static linkage. What this means for\
    \ us is that the function call is going to be fixed before we even go through\
    \ and execute the program we want to work with. This is also going to be something\
    \ that we can call early binding because the `area()` function is set during the\
    \ compilation of the program. But now we need to move in a different direction\
    \ and make some small modifications to our program. In this one, we are going\
    \ to precede the declaration of `area()` in our class with the `virtual` keyword.\
    \ The way that this code is going to look is below:\n\n```cpp\nclass Shape {\n\
    \    protected:\n    int width, height;\n    public:\n        Shape( int a = 0,\
    \ int b = 0) {\n            width = a;\n            height = b;\n        }\n \
    \       virtual int area() {\n            cout << \"Parent class area :\" <<endl;\n\
    \            return 0;\n        }\n};\n```\n\nAfter we are able to make this small\
    \ modification, and then we are able to go through and compile and then execute\
    \ the code again, it is going to give us a slightly different result in the process.\
    \ We are going to get the Rectangle class area and Triangle class area instead.\
    \ With this one, the compiler is going to look at the contents that are in the\
    \ pointer instead of its type. Because the addresses of `rec` and `tri` are going\
    \ to be stored in `shape`, the respective `area()` function is going to be called\
    \ up at any given point. This is known as late binding or dynamic linkage. In\
    \ addition to all of this, it is possible that you will want to go through and\
    \ include your own `virtual` functions in the base class to work with, which is\
    \ usually the way to go.\n\n## Conclusion\n\nThank you for making it through the\
    \ end of C++ for Beginners, let’s hope was informative and able to provide you\
    \ with all the tools you need. The next step is to start writing out some of the\
    \ different programs that you want. Even if you are just starting and just want\
    \ to spend your time practicing with some codes, the C++ language is the best\
    \ option to work with.\n\n"
