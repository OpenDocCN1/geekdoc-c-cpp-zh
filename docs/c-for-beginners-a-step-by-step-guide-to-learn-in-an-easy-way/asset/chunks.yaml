    ## 1. The Null Pointers

    The C++ language does support the null pointer. This is going to be a constant
    that has a value of zero, and it is going to be defined with several standard
    libraries along the way.


    ## 2. Pointer arithmetic

    You will find in C++ that we can work with four operators that fit in this category
    of arithmetic and can be used as pointers . These will include `++`, `--`, `+`,
    and `-` .


    ## 3. Pointers vs. arrays

    As you go through here, you are going to notice that there is a close relationship
    present when we talk about the arrays and pointers in this language.


    ## 4. An array of pointers

    It is also possible for us to go through and define our arrays so that they can
    hold onto the pointers that we want.


    ## 5. Pointer to pointer

    C++ will let us have some fun here by allowing for us to have a pointer on a pointer,
    and even more levels of this if we need it.


    ## 6. How to pass the pointers to the functions

    Being able to pass the argument is going to be important here. And passing this
    argument as one of the addresses or our references will allow the argument to
    have some changes occur so that it can call up the function that we want along
    the way.


    ## 7. Return pointer from your functions

    You will find that the C++ language is going to allow us a way to use our functions
    to come through and return one of these pointers to our local variable, to the
    allocated memory that is dynamic, and to the static variables. As we can see here,
    there are a lot of different ways that we are able to work with our pointers,
    and they can fit in well with some of the other topics that we discussed in this
    guidebook. As we go through and learn more about our operators, the variables,
    and even the arrays and the loops that will make up our codes, we can start to
    see how we can put this all together and get some good results with our codes,
    without it getting too complex or hard to deal with along the way either.


