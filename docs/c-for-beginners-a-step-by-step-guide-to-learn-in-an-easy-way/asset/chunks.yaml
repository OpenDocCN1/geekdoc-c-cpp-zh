    # 在 C++ 中正确合适的地方换行


    在这一语言中，你使用的间距和换行对你将取得的成功程度至关重要。如果你不以适当的方式留出空格，在阅读和理解你编写的代码时可能会遇到困难，这在以后会带来更多麻烦。


    当你决定为你的 C++ 程序编写所需的任何代码时，检查并使用正确的行间距来使其正常运行是非常重要的。将整个代码写在单行内，且完全没有任何停顿或断开，对我们来说并不是是一件好事。这在技术上是可行的，因为无论你是这样做还是使用其他方法分隔内容，编译器都能读取它。但当真正的人查看并试图弄清楚那里显示的内容时，他们会感到困惑，因为代码太乱了。


    为了了解它是如何工作的以及我们在这里讨论的内容，请考虑以下示例：

    ```cpp

    cout << Try This;

    >> endl; << Today I ate Pizza and did Math;>> endl; <<6=(7-1);>> endl; << That
    is what I learned today;>> endl; return 0

    ```

    这一行代码在技术上是正确的。你可以将其放入编译器，它会顺利地读取所有内容。然而，这真的非常难以阅读，特别是如果你对编程概念完全是新手。这个特定的例子可能不会那么糟，但如果你遇到较长的代码，几乎不可能弄清楚发生了什么，甚至无法捕捉到你可能犯的错误。


    还有另一种编写代码的方法。它的含义完全相同，编译器的方式也相同，但更好，因为其他程序员以及你自己都能更轻松地阅读代码。编写代码的更好方法包括如下：

    ```cpp

    cout << Try This;

    >> endl; <<Today I ate Pizza and did Math;>> endl; <<6=(7-1);>> endl; << That
    is what I learned today;>> endl; return 0

    ```

    如你所见，这容易读得多。它表达的内容与第一个完全一样，但看起来好得多，而且更易读。良好的编码规范会要求你像第二个示例那样编写，而不是第一个，尽管你的编译器会接受这两种。


    ## C++ 函数


    在讨论如何使用 C++（或任何编程语言）之前，如果我们不先仔细观察函数行为将如何为我们工作，讨论就无法深入下去。当我们处理函数时，这简单意味着我们将注意力放在一组语句上，这些语句旨在共同工作，帮助我们在过程中完成某个特定任务。


    你会发现，你用 C++ 创建的每个程序和应用程序中都至少有一个函数，它在这里被简单地称为 `main()` 函数。但很常见，特别是当你处理一些较长的代码和程序时，代码中会出现许多函数。


    我们有几种方法可以处理这些函数并让它们良好运行。首先，我们可以对代码进行划分，根据代码预期的功能，由几个函数来控制。你如何检查并划分代码取决于你总体想用这些代码做什么。但许多程序员会关注的最符合逻辑的选择是划分所有函数，以便它们能够处理自己的一些任务。


    然而，为了让函数运行起来，我们需要声明该函数。函数声明将告诉编译器函数的名称、我们希望在函数周围拥有的参数以及我们希望得到的返回类型。然而，函数的定义将在我们要创建的任何函数体中提供。


    我们看到的该语言的标准库将为提供许多已经可以使用且我们可以调用的函数。例如，其中之一是 `strcat()` 函数，用于连接两个字符串；然后你可以使用 `memcpy()`
    函数来帮助我们将内存位置从一个地方移动到另一个地方。这些只是你可以使用的的几个函数，它们的工作方式是相似的。


    所以，让我们来看 C++ 中的函数将如何工作。你可以通过以下方式定义它：

    ```cpp

    Return_type function_name (parameter list ) {

    Body of the function

    }

    ```

    我们这里的函数定义将由函数头及其函数体组成。我们需要查看的不同的函数部分包括以下：


    ### 1. 返回类型

    在某些情况下，当我们使用函数时，它会向我们返回某种值。当这种情况发生时，我们将处理 `return_type` 以便有东西实际返回给我们。我们的一些函数可以执行你想要的操作，而不向你返回值。使用我们上面写的语法，你将得到一个返回值，尽管该值将是“void”。


    ### 2. 函数名

    然后我们可以处理函数名。这是在你准备好时可以给你的带参数函数命名的名称。你还将获得所谓的函数签名。


    ### 3. 参数

    参数简单来说是用于操作的某种占位符。当你准备好调用其中一个函数时，只需将值传递给其中一个参数。这个值将被称为实参或实际参数。参数列表将能够引用进入参数顺序、数量和类型。在某些情况下，可能处理一个完全没有这些参数的函数。


    ### 4. 函数体


