    ## The Logical Operators

    To help us get started on this process, we are going to spend some of our time
    on the logical operators. These logical operators are going to be the ones that
    you want to use in order to compare together the different parts of the code that
    you want to add to the system and can help you to figure whether those parts are
    going to be considered true or false, whether they go together, and more based
    on the conditions that you are able to work with here. Some of the logical operators
    that you are most likely to work with when it comes to the C++ language will include:


    - `!`: This operator is known as the logical NOT. This is going to be used at
    any time that you would like to reverse the stated status of your operand. So,
    if you have a condition that is false, you would be able to use this operator
    in order to make the condition true.

    - `&&`: This operator is known as the logical AND. This is going to be used if
    you have two operands who do not equal zero. If this happens, then the condition
    will end up being true.

    - `||`: This operator is known as the logical OR. When you are working with this
    one, the condition will be true if at least one of the operands ends up being
    equal to zero.


    ## The Arithmetic Operators

    The second type of operator that we are going to spend some time here are the
    arithmetic operators. These are often going to be seen as some of the easiest
