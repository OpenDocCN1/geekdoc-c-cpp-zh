    ### Type of Inheritance


    While we are here, we need to take a closer look at the types of inheritances
    that we are able to work with. When we try to derive a class from one of our base
    classes in the first place, then the base class has the possibility of being inherited
    through a private, a protected, or a public inheritance. The type of inheritance
    that you use is going to be specified through the access-specifier, as we talked
