    ## 1. 空指针

    C++ 语言确实支持空指针。这将是一个值为零的常量，并且会在过程中通过多个标准库进行定义。


    ## 2. 指针算术

    在 C++ 中，你会发现我们可以使用四种属于算术类别的运算符，它们可以作为指针使用。这些运算符包括 `++`、`--`、`+` 和 `-`。


    ## 3. 指针与数组

    在学习这里时，你会注意到当我们谈论这种语言中的数组和指针时，它们之间存在着密切的关系。


    ## 4. 指针数组

    我们也可以遍历并定义数组，以便它们能够存储我们想要的指针。


    ## 5. 二级指针

    C++ 会让我们在这里玩点小技巧，允许我们拥有指针的指针，如果需要，甚至可以拥有更多级别的指针。


    ## 6. 如何将指针传递给函数

    能够传递参数在这里是非常重要的。将此参数作为我们的地址或引用之一进行传递，将允许参数发生变化，以便在过程中调用我们需要的函数。


    ## 7. 从函数返回指针

    你会发现 C++ 语言允许我们使用函数来返回局部变量、动态分配的内存以及静态变量的其中一个指针。正如我们在这里看到的，有很多种方法可以处理指针，它们可以与本指南中讨论的其他主题很好地结合在一起。随着我们不断学习更多运算符、变量，甚至是构成代码的数组和循环，我们可以开始看到如何将所有这些整合在一起，并通过我们的代码获得良好的结果，而又不会在此过程中变得过于复杂或难以处理。


    # 第 6 章：C++ 中的运算符及其使用场景

    我们能够处理的下一个主题被称为运算符。这些运算符非常重要，因为尽管它们很简单，但它们为我们想要使用的代码增加了大量的能量。我们可以关注许多许多不同类型的运算符，学习如何将每种运算符添加到我们想要处理的代码中是非常重要的。这些运算符被视为代码处理中的基础或简单部分，但它们仍然能够为我们编写的某些代码增加巨大的力量。无论我们是使用
    C++ 语言还是其他类型的编程，了解这些都是非常有用的。对于你想要处理的任何类型的编程语言，学习不同类型的运算符都非常重要，因为它们会告诉程序你想要完成的操作。它们是我们能够处理的简单符号，但可以增加更多功能。虽然有很多不同的运算符可以处理，但我们将花时间研究与
    C++ 语言配合得很好的四种常见类型。每一种都负责帮助我们的代码以不同的方式运行。随着我们学习所有这些，你将很快发现每种运算符的效果如何，以及它们都能做什么。在这种语言中我们需要花时间研究的四种运算符包括逻辑运算符、赋值运算符、算术运算符和关系运算符。考虑到这一点，我们需要花一点时间研究我们可以处理的每种运算符类型。这将帮助我们更多地了解运算符，以及它们在你自己的代码内部如何表现。


    ## 逻辑运算符

    为了帮助我们开始这个过程，我们将花一些时间研究逻辑运算符。这些逻辑运算符是你用来比较你想要添加到系统的代码不同部分的，并可以帮助你判断这些部分是否被视为真（true）或假（false），它们是否匹配，以及根据你在这里可以处理的条件得出其他结果。在
    C++ 语言中，你最可能使用的逻辑运算符包括：


    - `!`: 此运算符被称为逻辑非（NOT）。在任何你想要反转操作数描述的状态时，都可以使用它。例如，如果你有一个为假的条件，你可以使用这个运算符使该条件变为真。

    - `&&`: 此运算符被称为逻辑与（AND）。如果你有两个不等于零的操作数，则该运算符将被使用。如果发生这种情况，条件将变为真。

    - `||`: 此运算符被称为逻辑或（OR）。当你使用这个运算符时，如果至少有一个操作数等于零，条件将为真。


    ## 算术运算符

    我们在这里花时间的研究第二种运算符是算术运算符。这些通常被认为是所有 C++ 运算符中最容易处理的，你在代码中将它们与赋值运算符一起使用是很常见的。如果你回想起过去的一些数学课，你应该应该能够查看其中一些运算符并识别出它们是什么以及它们是如何工作的。这些算术运算符将根据你希望程序执行的操作用于加法、减法、除法和乘法。在
    C++ 中常用的算术运算符包括：


    - `+`: 此运算符是加法运算符，用于将两个操作数相加。

    - `-`: 此是减法运算符。它将右侧的操作数减去左侧的操作数。

    - `*`: 此运算符使得在 C++ 中进行乘法成为。

    - `/`: 此运算符帮助你在 C++ 中进行除法。

    - `++`: 此是自增运算符。它将你的操作数增加 1。

    - `--`: 此是自减运算符。它将操作数的值减少 1。


    你会发现在处理这些算术运算符时，有很多选项可以选择。首先，我们可以根据需要一次处理许多个此类运算符。例如，如果我们有一组想要相加的十个数字，这也是可能的。你也可以一次处理几个此类运算符，例如在处理过程中进行乘法和除法。你只需要注意运算符的顺序，以确保按照正确的顺序执行并获得正确的答案。


    ## 赋值运算符

    现在是时候让我们转向 C++ 语言中运行良好的第三种运算符了。这一类别是赋值运算符。它是为了让你的代码良好运行的最常用的运算符，通常用于帮助将值分配给变量以便其正常工作。这种赋值运算符非常重要，因为它负责帮助为变量分配值或名称。在处理任何代码时，它用于保存、搜索等更多功能都是一个很好的选择。除了给变量赋值的点号外，我们可以使用的其他类型赋值运算符包括：


    - `=`: 此运算符是简单的赋值运算符。它将右侧操作数的值赋值给左侧。


