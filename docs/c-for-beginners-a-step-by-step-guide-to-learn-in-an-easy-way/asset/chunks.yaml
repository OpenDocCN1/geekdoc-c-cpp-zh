    \ the positives and the negatives are the best way to make sure that we will end\
    \ up with the right coding language, such as `C++`, for all of our needs.\n\n\
    # Chapter 2: The Steps to Creating Your First Program\n\nNow that we know a few\
    \ of the basics that come with coding in `C++` and why so many programmers want\
    \ to spend their time learning how to make this work, it is time to take everything\
    \ to the next step as well. In this chapter, we need to take a look at some of\
    \ the steps that we need to take in order to write out our own codes. To do this,\
    \ we need to work on the basics, and then you can take these on to write some\
    \ of your own codes at a later time. The first part of the process, before we\
    \ are able to write out ay codes, is to work on the `C++` environment. The environment\
    \ is simply the place where we are able to write out some of our codes and then\
    \ set it up to execute, which is why we need to make sure that this is ready to\
    \ go and that we use the right one. The good news to remember here is that there\
    \ are many environments for `C++` out there, though the best one is usually found\
    \ on the main website for `C++`. Once the environment for this coding language\
    \ is downloaded and ready to go, it is time to learn the right steps to writing\
    \ our first code.\n\nOur goal in this chapter is going to write out a code that\
    \ shows the phrase “Try this” on the screen of our computer. This is only going\
    \ to take a few lines to accomplish, but it does include a lot of the syntax that\
    \ we need in our codes to see the best results that we want as well. Just because\
    \ it is simple doesn’t mean that it won’t work the way that we want. With that\
    \ in mind, the code that we need to use to make this one behave well includes:\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main (){\n  cout << “Use\
    \ This One!\";\n  return 0;\n}\n```\n\nYou have a few options available when it\
    \ comes to writing this out. You can choose to write this out in your compiler,\
    \ which will be available in your environment, or you can choose to write it out\
    \ and save it to your computer. The second option is sometimes nice because then\
    \ you would have the code saved and cold copy and paste it any time that you would\
    \ need it in your code. Either way, you should carefully consider the type of\
    \ text editor that you want to work with. Most of them are going to be device-specific,\
    \ so you will need to look for the one that goes with your particular computer.\
    \ Some of the options that you can go with include Windows Notepad, `vlm`, `vl`,\
    \ `Brief`, and `EMACS`. If you would like to have an editor that is able to go\
    \ on more than one platform, then the `vlm` and `vl` options are the best ones.\n\
    \nWhen you are working on writing some codes in `C++`, you need to make sure that\
    \ they are written out in the text editor. This is going to provide you with a\
    \ good rough draft on the program, and then, when it is done, it can be run by\
    \ the compiler. This makes life easier for you because you get the option of checking\
    \ the code before running it, and ensuring that there are no longer any errors\
    \ found inside of it.\n\n## The C++ Compilers\n\nWhile we are here, we need to\
    \ take a look at the `C++` compiler and see what job it is able to do for us here.\
    \ Just like how we talked about with the environment and the text editors, there\
    \ are going to be a large number of compilers that you can choose to work with.\
    \ The problem with all of this, though, is that while you do get a number of choices\
    \ to work with on these, you will quickly notice that a lot of the compilers are\
    \ going to be really expensive to use. The main reason for this is that they are\
    \ going to be saved for, or have special features for, elite hackers. These are\
    \ the individuals who have been able to master the lower level compilers that\
    \ are out there and who are looking for the steps that they need to make it to\
    \ the next level. A lot of the `C++` compilers are going to cater to this group\
    \ but at a cost, of course.\n\nThe good news here, though, is that all hope is\
    \ not lost. There are some great `C++` compilers out there that are safe and secure,\
    \ while also being free. You just have to be careful and watch what you are doing\
    \ to ensure that you are finding the ones that are the best and will still have\
    \ all of the features that we want to work with. One of the different compilers\
    \ that can help us with our `C++` coding, and will have some features that are\
    \ good for beginners is known as `GNU`. It is going to be the best one to use\
    \ with the Linux system, and if this is the operating system that you want to\
    \ work with, then this is already there. To check out whether the `GNU` compiler\
    \ is already found on your computer, you just need to use the code below:\n\n\
    ```\n$ g++ -v\n```\n\nIf the compiler is installed, then you should see this message\
    \ on the screen:\n`Using built-in specs.Target: i386-redhat-linuxConfigured with:\
    \ ../configure –prefix=/usr …...Thread model: posixgcc version 4.1.2 20080704\
    \ (Red Hat 4.1.2-46)`\n\nIf you typed in the code above and you did not get that\
    \ message to come up on the screen, it means that you either did not download\
    \ the compiler the proper way or you do not have it on your computer in the first\
    \ place.\n\n## Some of the Basic Syntax to Understand\n\nBefore we end out this\
    \ chapter, we need to take a moment to look at some of the basic syntaxes that\
    \ are going to come with the `C++` language. This is going to be important to\
    \ ensure that, when it is time to move on to writing our own codes later, we are\
    \ actually able to get it all done. The `C++` language is one that we are able\
    \ to define as a program that will use lots of objects, objects that are then\
    \ able to help us keep things organized, and will allow our code to communicate\
    \ as well as invoke some of the other methods that are there. There are four main\
    \ parts that are going to show up with this kind of language and will be seen\
    \ as an important part of the syntax that we are working with as well. these four\
    \ main parts include:\n\n1. **The classes**: These are important because they\
    \ are the tools of organization in the `C++` language. They can be seen simply\
    \ as little boxes that are going to hold onto objects, and then can sort out some\
    \ of the objects that are similar to one another. You are able to give any label\
    \ that you want to the class, but it is often good practice in coding to place\
    \ objects that are similar to the class in some manner together.\n2. **The objects**:\
    \ The objects are next on the list, and they are the parts of the code that will\
    \ come with states and behaviors. These could be things like shapes, textures,\
    \ colors, and more. You will be able to classify these objects into the classes\
    \ they belong to based on how similar they are to the other objects in that class.\
    \ So, if you have a class that was labeled `dogs`, you could add in any objects\
    \ that talked about dogs into it.\n3. **The methods**: The methods are next, and\
    \ this is going to be one of the terms that we are able to use for coding behavior.\
    \ There are as many or as few of these methods as you feel comfortable with using,\
    \ and they are going to be able to manipulate some of the data and actions and\
    \ how they will play out on your code. Without the right method in place, then\
    \ the program is going to b at a loss for how you want it to behave when you execute\
    \ it.\n4. **The instant variable**:\n"
