    the potential of a program that is not going to work all that well.No one wants
    to have a program that is not going to showcase off anything, even when the answer
    is wrong, and the blank screen that could show up is never going to look all that
    professional.But it is still an important option to learn how to use because it
    allows us a chance to go through and really work with some of these statements
    and get more familiar with it in the process.The other three conditional statements
    can show up a lot in the codes that we want to work with as well.These are going
    to be important to ensuring that our codes are able to make some of their own
    decisions, even if we are not sure what the results or the input are going to
    be from the user.These can take over, and we can set up the conditions that will
    tell them how to behave along the way .This is going to make it easier for us
    to ensure that the codes we have are always going to behave well.There are a lot
    of different ways that we can bring in the conditional statements and get them
    to work the way that we want.There is a lot of power that comes with these statements,
    and they will allow us to get the program to work the way that you would like.You
    can get it to make some good decisions for you and get it to behave in the manner
    that you would like as well.Before you move on to some of the other topics that
    are out there concerning the C++ language, take some time to practice these so
    that you can bring them out in any codes that you would like.Chapter 8: Working
    With InheritancesThe next thing that we are going to take a look at here is going
    to be the inheritances.These are a bit more complex than some of the other stuff
    in this guidebook, but at this point, you are ready to take it on and really work
    with something that is more advanced.You will find that wen these inheritances
    come out, we are going to see some of the beauty that is there with the OOP languages
    that we talked about before, and we can actually go through and reuse parts of
    the code that we want to work with.One of the most important out of all the concepts
    that come with OOP languages is that of the inheritance.This idea is going to
    make it easier for us to define a class based on the terms of another class in
    our code.This is useful because it allows us to have an easier way to create and
    maintain one of the applications that we want to work with.It is also going to
    be useful in providing an opportunity for us to reuse the functionality of the
    code and to get the implementation done faster than ever before .Any time that
    we want to go through and create a class, rather than having to go through and
    write out a brand new members of data and members of functions each time that
    you do it, the programmer is able to designate that the new class is supposed
    to inherit the members of a class that is already found in the code.This can make
    it a lot easier than having to redefine the members and the functions as you go
    through the code again and again.The class that we are basing our work on or the
    existing class is going to be known as the base class.Then the new class that
    we are trying to create, and the one that will take that information and the data
    or the functions out of the base class, is going to be known as the derived class.The
    idea that we are going to see with the inheritance is that it implements the “is
    a” relationship.For example, it can work with the idea of a mammal is an animal;
    the dog is a mammal; hence dog is an animal as well.This is going to kind of simplify
    the process that we are working with here, but still, give us a good idea of what
    we are working with along the way.The Base and the Derived ClassWith this in mind,
    it is time for us to go through some of the particulars that we are able to do
    when it comes to working with the classes that are at hand.Remember that we are
    going to have two classes in mind when we do this, the base class and the derived
    classes.These are going to work together to help us write out the different codes
    that we want to see work well in all of this.A class can easily be derived from
    more than one class if we would like to use it in this manner.When this happens,
    this means that it is able to inherit data and functions from more than one base
    class as we go along.To help us define a derived class, we are going to work with
    a class derivation list to help specify the base class or base classes that we
    want to work with as we go through this process.We can make this as simple or
    as hard as we would like based on some of the work that we are trying to accomplish.For
    example, we are able to work with defining a derived class, and this can be done
    by using the list of class derivation to help specify the classes to help us out
    .The class derivation list names one or more base classes that we want to work
    with.And the form that helps us to do this is below:Class derived-class: access-specifier
    base-classThere are a few things that we need to keep in mind when we are working
    with this one.Where you see the access specifier part of the code, we need to
    go through and choose whether it is public, protected, or private.All of these
    are going to have some important meanings in the code, and you have to decide
    which one you would like this class to have.When we are working with the idea
    of public access, it means that we are going to work with a class that is open
    for anyone to use.Other classes in our code are able to come in and access that
    one or use it, and there are not that many limitations on what can happen with
    the class.This is usually not the option that we want to go with because it leaves
    that class vulnerable to issues and even attacks, but in some cases, it is going
    to be the right one for us to choose to work with.Then we have protected access
    .This one is kind of the same in that it is open to quite a few things.But we
    are going to put it under some protections and limitations so that it is not openly
    available to everything and everyone.This one will ensure that only the parts
    of the code that we want to have access to this class will actually be able to
    access it at all.And then we are able to end this one with the private option.This
    one is going to be the most restrictive, and you should only use it when you know
    the exact class or part of the code that should access it, and you want to make
    sure that no other part is able to do so.Along with our access-specifier part
    of the code, you will notice that the base-class is simply going to be the name
    of the class that we defined earlier.If you find that the access-specifier is
    left blank or you forget to add something there, keep in mind that the default
    is going to be private in order to keep things safe.If you definitely want to
    change this up and you do not want this to be private, then this is something
    that you have to change .Now it is time for us to go through and look at an example
    of how we are able to work with this and get it to work for our needs.We are going
    to look at inheritance, and the base class that we want to focus on will be Shape,
    and then the derived class is going to be Rectangle.The code that we are able
    to use to make this one happen is below:#include <iostream>using namespace std;//
    Base classclass Shape {public:void setWidth(int w) {width = w;}void setHeight(int
    h) {height = h;}protected:int width;int height;};// Derived classclass Rectangle:
    public Shape {public:int getArea() {return (width * height);}};int main(void)
    {Rectangle Rect;Rect.setWidth(5);Rect.setHeight(7);// Print the area of the object.cout
    << "Total area: " << Rect.getArea() << endl;return 0;}Take some time to type this
    code into your compiler and see what is going to happen.You should find out what
    the total area of it all is going to be, and you can work from there.As we can
    see here, while we did work with an example of an inheritance, it was not that
    bad to handle, and it is a great option that will ensure that we are able to reuse
    parts of the code, get the implementation of the code to be easier, and will ensure
    that we actually get a chance to work with the code without wasting a lot of time
    in the process.The Access Control of Our InheritanceThe next thing that we need
    to take a look at is access control and inheritance.A derived class is able to
    access all of the parts of the base class that are not private at the time.This
    means that the base class means that the members of the base class that should
    not be accessible to all of the member functions of the derived classes are going
    to be declared as private for the base class when we are doing this as well.You
    will notice as we go through this that the derived class is going to be able to
    inherit all of the base class methods.There are going to be a few different exceptions
    that we are able to use with this one based on what results we are hoping to get.
    Some of the exceptions that we need to remember include:'
