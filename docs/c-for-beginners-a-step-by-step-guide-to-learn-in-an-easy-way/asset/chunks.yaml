    ## Introduction

    Congratulations on purchasing `C++ for Beginners`, and thank you for doing so.
    The following chapters will discuss all of the different things that you need
    to know when it comes to working with the `C++` language. There are a lot of different
    options that we are able to explore when it comes to handling our work in coding
    and programming, and many of them are going to come with a ton of benefits that
    can pull you to them.


    But when it is time to work with a simple coding language that has a lot of power
    and functionality behind it, then it is time to work with the `C++` coding language.
    This guidebook is going to take some time to look over all of the things that
    we are able to do with the `C++` language, and how great learning this language
    can really be. The beginning of this guidebook is going to spend some time taking
    a look at what the `C++` language is all about and some of the benefits of bringing
    this one to the table, and to your programs, rather than using one of the other
    many options.


    When we have some of the basics down and a good idea of why we would want to use
    this language, it is time to look a bit more at how we can actually write our
    codes in this language. We will spend the next few chapters looking at the right
    steps to use to help create our first program in this language, and then we can
    spend a bit more time looking specifically at the syntax of `C++` and how that
    is important in writing out some of the codes that we want to use in the future.


    Now it is time to move into some of the fun stuff that we are able to do with
    this language in particular. Now that we know how to work with this language,
    and how to write out a simple code, we can take that a bit further and learn how
    to work with the `C++` variables, and the loops and arrays as well. We will even
    take this further and look at a few of the codes that you need to actually create
    some of your loops and arrays, and look at the basics of how to add value to your
    variables so the code can pull them out later.


    When we are done with all of this and have a good idea of how to write out some
    of the simple codes that we have focused on so far, it is time to go a bit further.
    While we looked at a few of the operators when it comes to our variables earlier
    on (and we will discuss how this is so in this guidebook), we will dive more into
    some of the different types of operators that are present in `C++` and why this
    is so important. And then we finish out this part by looking at how to create
    some of our own decision controls statements, which will ensure that our program
    is able to make the right decisions as it goes, based on the conditions that we
    set in the code.


    Then we are going to jump right into some of the more advanced parts of the `C++`
    coding language that we are able to focus on. We will look at how to work with
    the idea of inheritances, which can help us to take full advantage of the `OOP`
    part of this language, and then we can dive into some of the coding and more that
    we need with the idea of polymorphism and getting this to work well for some of
    our needs along the way as well.


    There are a lot of coding languages that we are able to work with, and a lot of
    them can help you to get your coding done. But when you want the best language,
    the one that is easy to learn while bringing on all of the functionality and more
    that you want in a coding language, then the `C++` language is the right one for
    you to use. When you are ready to get started with this particular coding language,
    make sure to check out this guidebook to get started.


