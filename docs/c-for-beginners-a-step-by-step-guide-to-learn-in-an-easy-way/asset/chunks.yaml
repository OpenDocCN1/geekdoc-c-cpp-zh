    ## 1. Prepackaged scripts

    These are going to be really important to you as a beginner because they will
    help you to practice some of the hacking techniques that we are going to talk
    about in this guidebook. These are packaged ahead of time so that you can learn
    without having to set it all up on your own.


    ## 2. Videos games

    C++ is is the language that is behind many popular video games that are out now.
    While this guidebook is not going to go so in-depth that you will be able to create
    your own video game when you are done, it is definitely something that you can
    learn how to do with this language.


    ## 3. Web pages

    There are many web pages that will rely on `C++` because this language is really
    easy to manipulate and will make sure that any websites that you create with it
    are quick and easy to use. You can even use this language to help you come up
    with some cool interactive features. Popular websites like eBay and Amazon utilize
    this kind of language.


    ## 4. Phone apps

    If you are a fan of using your smartphone and playing with some of the apps that
