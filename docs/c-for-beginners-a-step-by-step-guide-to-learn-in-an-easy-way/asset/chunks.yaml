    ## 1. 预封装脚本

    对于初学者来说，这些脚本将非常重要，因为它们将帮助你练习本指南中将讨论的一些黑客技术。这些脚本是预先打包好的，这样你无需自己完成所有设置即可开始学习。


    ## 2. 视频游戏

    C++ 是目前许多流行视频游戏背后的语言。虽然本指南的深度不会让你到让你在完成后就能创建出自己的视频游戏，但这绝对是你可以通过这种语言学习如何实现的内容。


    ## 3. 网页

    有许多网页将依赖于 `C++`，因为这种语言非常容易操作，并且可以确保你用它创建的任何网站都快速且易用。你甚至可以使用这种语言来帮助你构思一些酷的交互功能。像
    eBay 和 Amazon 这样的热门网站就使用了这种语言。


    ## 4. 手机应用

    如果你喜欢使用智能手机并尝试各种可用应用程序，那么你可能会发现使用 `C++` 可以让体验变得更好。这种语言可以帮助你在短时间内创建出你自己的手机应用。


    ## C++ 简史

    我们接下来需要关注的是 `C++`的一些历史。这门编程语言拥有非常丰富的历史，因为它是最早的编程语言之一。它始于人们对计算机编程了解极少之前，而且在人们甚至考虑将这种工作作为生计很久以前。回想
    1979 年左右，当时电话黑客之类的事情开始出现。为了学习这门编程语言的开端，我们需要追溯到那么久远。你会发现，仍在使用的编程语言中，没有多少语言能追溯到如此远。


    比雅恩·斯特拉斯鲁普（Bjarne Stroustrup）在写他的博士论文时，决定使用一种名为 Simula 的编程语言。这种语言是计算机时代最早的编程语言之一。然而，它非常慢而且充满了漏洞。斯特拉斯鲁普提出了带类的
    C（C with Classes）的想法。这是一种比 Simula 快得多的编程语言。带类的 C 后来变成了 `Cfront`，加速了创建语言的过程。然而，当
    `C++` 出现时，`Cfront` 被甩在了身后，因为它在语言中加入了编译器，比当时的任何其他项目语言都更容易使用且更快速。从那时以后，出现了注释参考指南和语言更新，使其变得更好、更快、更易于用。《C++
    入门》是该语言的一本流行指南。`C++` 实际上是目前顶尖的编程语言之一。这种语言将是许多行业的最佳选择，因此，与其花费大量精力去发明一种新语言（这非常耗时耗力），他们决定使用
    `C++` 并根据其多功能性将其适应到他们想要做的不同部分和项目中。


    ## 为什么程序员使用这门语言？

    正如我们之前提到的，市上有许多编程语言可供我们使用，你可能有些好奇为什么程序员会选择 `C++` 语言而不是其他选项。首先，许多程序员喜欢 `C++` 是因为它具有极大的灵活性和速度。这是世界上最古老的语言之一，但它能够跟上你的需求，并为我们提供完成程序和应用所需的所有代码及更多。它还被认为是初学者的良好语言，因为一旦你学会了基础，就可以利用这些知识指导你学习其他编程语言。此外，如果你想更多地学习如何使用一种处理计算机工作之外的不同项目的编程语言，那么
    `C++` 是一个很好的起点。它在用于网页、移动应用等更多领域的代码上将产生奇妙的效果。当然，我们上面讨论的一些选项仅仅是程序员如此喜爱使用 `C++` 的原因之一。其他一些让我们爱上这门编程语言的优点还包括：


    1. **它拥有非常大的库**：由于 `C++` 已经存在了很长时间，它也带有一个庞大的库。任何使用这种语言的程序员都能使用这个库，可以使选择代码和正确的函数变得更简单，同时节省时间。你甚至可以在需要时自己创建代码，但对于初学者来说，这个库将帮助你迈好第一步。

    2. **它可以与其它语言良好协作**：在某些情况下，你可能在使用 `C++` 之外还需要另一种编程语言。当你处理 `C++` 时，实现这一点非常简单。这确保了你能迅速完成所有编码，并让你更容易处理想要完成的工作，无论你的编码需求是简单还是复杂。

    3. **它能够处理大量的编码项目**：通常，你选择的其他编程语言设置时只能处理极少数的项目。例如，使用 `JavaScript` 作为编码语言意味着我们只想创建自己的网站之一。但当我们使用这种语言时，它能够处理大量的不同的项目，而不只是网站。它可以帮助我们创建新程序，甚至可以与网站协作，或者如果你想用你的语言做其他事情，`C++`
    代码也能帮助你完成。

    4. **工作快速且非常可靠**：如果你曾有机会使用市面上的其他语言或进行过编码（即那些受欢迎的语言），那么你可能知道它们并不总是像承诺的那样可靠。信息可能会丢失，或者它们无法按照你需要的方式运行。如果你想找到一种第一次就能真正运行且整个过程中都可以信赖的东西，那么
    `C++` 语言正适合你。

    5. **拥有你所需的力量**：任何决定从事编程和某些编码，并希望确保他们创建的代码具有正确力量的人，都会喜欢使用 `C++` 语言及其提供的所有功能。它将拥有必要的力量，并且通常被视为比市面上其他一些编码语言更强大的选择。

    6. **C++ 语言将被视为一种低级语言**：这会让初学者更容易与之工作，但可能会让我们在做某些想要实现的高级内容时变得非常困难，并可能导致我们缺乏正在寻找的一些功能。

    7. **你会很快发现 C++ 语言支持所谓的“多范式编程”（multi-paradigm programming）**：这种范式意味着编程风格更多地关注我们在编程中所使用的过程、结构和逻辑。`C++`
    不仅仅是一种范式，而且是多范式的，这意味着它遵循现有的三种主要的范式，即面向对象（object-oriented）、命令式（imperative）和泛型（generic）。

    8. **如果你正在寻找一种能够为你提供性能以处理即使是更大的项目，并在过程中提供大量高效内存的编码语言，那么 C++ 语言将正适合你。**


    '
