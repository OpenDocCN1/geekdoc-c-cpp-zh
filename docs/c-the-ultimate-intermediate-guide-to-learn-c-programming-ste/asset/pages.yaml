  md: "# C# 7.0\n\n+   * Out variables\n* Tuples and deconstruction\n* Pattern matching\n\
    * Local functions\n* Expanded expression-bodied members\n* Ref locals and returns\n\
    \n# September 2019\n\n# C# 0.8\n\n+   * Readonly members\n* Default interface\
    \ methods\n* Pattern matching enhancements\n  * Switch expressions\n  * Property\
    \ patterns\n  * Tuple patterns\n  * Positional patterns\n\n+   * Using declarations\n\
    * Static local functions\n* Disposable ref structs\n* Nullable reference types\n\
    * Asynchronous streams\n* Indices and ranges\n* Null-coalescing assignment\n*\
    \ Unmanaged constructed types\n* Stackalloc in nested expressions\n* Enhancement\
    \ of interpolated verbatim strings\n\n# Running C# on Windows\n\nYou are probably\
    \ familiar with all of the things we are going to cover in this chapter, but we\
    \ have to go through them because going the basics is always a good idea. Think\
    \ of it as a much-needed refresher for those who have stepped away from programming.\
    \ It's better to work with C# on Windows, as C# is a Microsoft language. The Windows\
    \ operating system is optimized for it.\n\n# Mac Users:\n\nYou can work with C#\
    \ on Mac. Microsoft has released a Visual Studio version for Mac, but the experience\
    \ of working with C# on a Windows laptop is better. It helps that you can run\
    \ Windows OS on Mac using tools like VirtualBox.\n\n# 1. Object-Oriented Language\n\
    \nEverything in C# is an object except primitive data types. Objects as have properties\
    \ and building functions. If you have worked with other object-oriented languages,\
    \ you have seen this. We are going to see more of this in the upcoming chapters.\
    \ C# is easily maintainable and can be object-oriented.\n\n# 2. Strongly Typed\n\
    \nAs you would expect from a programming language based-off, C# is strongly typed.\
    \ Meaning, unlike Javascript, you have to specify data types in your program.\
    \ This significantly reduces run-time error. This is referred as type safety.\
    \ The benefit of type safety becomes more apparent as you work with bigger applications.\n\
    \n# 3. Automatic Garbage Collection\n\nC# regularly runs garbage collection, which\
    \ removes unused objects and dangling pointers, refreshing memory. The .NET framework\
    \ runs this task. You do not have to do these cumbersome tasks yourself; saves\
    \ you time and allows you to focus on your applications' functionality."
