    \ The GUI has a part that allows you to drag and drop tables and anywhere you\
    \ can drop stored procedures. Select, drag and drop all essential tables and databases.\n\
    \n# Selecting Data:\n\nAs soon as we have our \"dbml\" file and its \"DataContext,\"\
    \ LINQ queries can use objects to communicate with the databases. Here's an example\
