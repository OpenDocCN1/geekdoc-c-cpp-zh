  md: "# CHAPTER 15:\n\n# THE OBSERVER PATTERN\n\nIn some cases, you will need to\
    \ create two classes that have an observer and observed relations. In other words,\
    \ one object needs to observe or watch another object for its functions. For example,\
    \ you can have a class that collects data about the environment around you: time,\
    \ weather, locations, and more. You might also have another object that needs\
    \ to alert a of your friends nearby, of the weather, and remind them of events\
    \ and plans. To be able to do this, you will need an Observer Pattern because\
    \ an object needs to observe other objects for its main functions.\n\nHow it essentially\
    \ works:\n\nObserve patterns are popular among developers because of the functions\
    \ we use in the described way. There is the Subject and the Observer. Observing\
    \ and being the object are descriptions of behavior, so we implement Observer\
    \ and Subject interfaces. This will allow classes to apply Observer and Subject\
    \ behaviors. All classes have to call their interfaces.\n\nAll classes implementing\
    \ the Observer interface will have a list of subjects to watch. You will need\
    \ an update method, which updates their data based on the relevant changes in\
    \ the subject objects.\n\nAll classes implementing the Subject interface will\
    \ have a list of observer objects to notify users of changes in data.\n\nWhen\
    \ there is a change in the subject object, it will call the notify() method, which\
    \ notifies a list of its observers. Once the observers are notified, they call\
    \ the update() method, which updates their data based on the subject's recent\
    \ update.\n\nWhen implementing the observer pattern, you only need to think about\
    \ two things: the number of observers and number of subjects. We are going to\
    \ be working with multi-observe and multi-subject scenarios to show dynamics.\n\
    \n# The Observer Pattern, in C#\n\n==================\n\nBelow is how the observer\
    \ pattern looks in C#. You will see two sets of class/interface pairs. We will\
    \ start with the Observer pair.\n\n```\n/*\n * All Observing Classes implement\
    \ an Observer abstraction\n * It can:\n * - update object data based on subjects\n\
    \ * - Observing Classes may need a List of Subjects to access\n * - (added on\
    \ Observer Class)\n */\ninterface Observer {\n    void update();\n    // enter\
    \ any other methods\n}\n\n/*\n * Observing Classes have:\n * - working version\
    \ of the update() method\n * - any number of additional fields & methods\n */\n\
    class ObservingClass : Observer {\n    // enter any other fields;\n    // INPUT:\
    \ (optional)\n    // OUTPUT: none\n    // EFFECT: updates data in response to\
    \ subject\n    void update() {\n        // make any changes to observer's key\
    \ fields here\n    }\n}\n```\n\nBelow is the subject class/interface pair.\n\n\
    ```\n/*\n```"
