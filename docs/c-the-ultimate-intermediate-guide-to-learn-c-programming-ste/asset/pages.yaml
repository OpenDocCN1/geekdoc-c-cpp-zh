  md: "# CHAPTER 12:\n\n# ANONYMOUS TYPES\n\nC# allows us to create new data types\
    \ called anonymous data types. We can create them without defining them. They\
    \ are created at instantiation, and they are both compiler generation and reference\
    \ types. The compiler will define them on their properties. Anonymous types are\
    \ an important feature used in SQL, and are useful in LINQ queries. Anonymous\
    \ types are read-only.\n\nIn this chapter, we will study “Anonymous” types:\n\n\
    Contents\n\n+   * The Var Statement\n* Creating and Using Anonymous Types\n* Comparing\
    \ Two Anonymous Instances\n\n# Var Statement\n\nVars were introduced in C# 3.0.\
    \ As the name suggests, they are used to declare local variables implicitly, meaning\
    \ you don't have to specify the data type with hold. Let's have a look at the\
    \ example below:\n\nvar str='name';\nvar num='89';\nvar array=new int[]{1,2,3};\n\
    \nThe compiler will compile all that code like this:\n\nvar str='name'; // string\
    \ str='name';\nvar num='89'; // int num='5';\nvar array=new int[]{1,2,3}; // int\
    \ array=new int[]{1,2,3};\n\nLet's have a look at the example below:\n\n# Example\
    \ 1:\n\n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\nusing System.Threading.Tasks;\nnamespace anonymous\n\nclass\
    \ Program\n{\n    static void Main(string[] args)\n    {\n        var name = \"\
    Jonathan Davis\";\n        var number = 25;\n        string s = \"USA\";\n   \
    \     var s2 = s;\n        s2 = null;\n        string s3 = null;\n        var\
    \ s4 = s3;\n        Console.WriteLine(name);\n        Console.WriteLine(number);\n\
    \        Console.WriteLine(s);\n        Console.WriteLine(s2);\n        Console.WriteLine(s3);\n\
