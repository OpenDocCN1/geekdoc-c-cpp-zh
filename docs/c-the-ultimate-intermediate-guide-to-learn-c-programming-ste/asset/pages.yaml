    \ conditions of more than six characters long and containing the letter o.\n\n\
    # Select\n\nThe select query is often used with objects that have multiple members.\
    \ It is used to extract a specific member of an object collection; it can also\
    \ be used by any object. The example below illustrates the Select query.\n\n#\
    \ Example 4:\n\n```\nusing System;\nusing System.Collections;\nusing System.Collections.Generic;\n\
    using System.Linq;\nnamespace MyCSharpApplication\n{\n    public class Person\n\
