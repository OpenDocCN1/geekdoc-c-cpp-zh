  md: "# CHAPTER 11:\n\n# NULLABLE TYPES\n\nC# provides a special null value type\
    \ with its own range. An int32 data type has a range of -2147483648 to 2147483647,\
    \ nullable int32 can store a null value of all numbers in the int data type range.\
    \ A Nullable of Boolean is able to store true, false, or a null value.\n\nIn this\
    \ chapter, we are going to look at:\n\nContents\n\n+   - Structures of Nullable\
    \ types\n- Syntax of Nullable types\n- The HasValue and Property\n- The Null Coalescing\
    \ operator\n\n# Structures of Nullable types in C#\n\nThe table below shows you\
    \ Nullable types of primitive data types along their range. As we have illustrated,\
    \ Nullable types have an extra value.\n\n| Type | Range |\n| Nullable Boolean\
    \ | True or False or Null |\n| Nullable byte | 0 to 255 or Null |\n| Nullable\
    \ decimal | (-7.9 to 1028 to 7.9 x 1028) / 100 to 28 or Null |\n| Nullable double\
    \ | (+/-35.0 to 10-324 to (+/-1.7 x 10308 or Null |\n| Nullable DateTime | Represents\
    \ an instant in Time or Null |\n| Nullable int | -32,768 to 32,767 or Null |\n\
    | Nullable int32 | -2,147,483,648 to 2,147,483,647 or +9,223,372,036,854,775,807\
    \ Or Null |\n| Nullable int64 | -9,223,372,036,854,775,808 to +9,223,372,036,854,775,807\
    \ Or Null |\n| Nullable Single | Single value or Null |\n| Nullable char | U+0000\
    \ to U+FFFF or Null |\n\n# Syntax for Nullable types in C#\n\nThere are two ways\
    \ of declaring the Nullable type. The first one is as follows:\n\n```\nSystem.Nullable<variable_name>;\n\
    ```\n\nIt opens with a Nullable keyword (which is called the relevant object),\
    \ followed by the specification of the data type — int, and the variable name.\n\
    \nThe other way of declaring a Nullable type looks like this:\n\n```\n<type> ?\
    \ <variable_name> = null;\n```\n\nIt opens with the type specification, a question\
    \ mark, and variable name.\n\nLet's look at some examples.\n\nExample 1:\n\n```\n\
    Namespace nullable\n{\n    Class Program\n    {\n        static void Main()\n\
    \        {\n            int? x = null;\n            int y = 11;\n            if(x==null)\n\
    \                Console.WriteLine(y.Value);\n            else\n             \
    \   Console.WriteLine(\"Undefined\");\n        }\n    }\n}\n```"
