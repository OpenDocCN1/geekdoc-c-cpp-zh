  md: '# CHAPTER 14:


    # THE FACTORY AND COMPOSITE PATTERN


    # Factory Pattern


    Factory patterns allow you to create multiple objects with using a boilerplate
    object making.


    How it essentially works:


    You start by creating a class interface that standardizes data creation. You would
    use subclasses to create the data objects. The subclass allows for flexibility
    in what you are able to create. If the programming language you use not have interfaces
    or abstract classes, you will need to create a factory class and have subclasses
    extending it.


    Imagine you were charged with a wide range of sports balls at any given time.
    You would have basketballs, cricket balls, volleyballs, footballs, and more. You
    would always know how make each one when requested. What would your code look
    like for each? This why you need to create an interface that outlines the construction
    of the objects.


    We will call the interface "BallMaker." For each ball, we would create a subclass
    that extends "BallMaker." The subclasses would make the ball objects, each one
    doing according to its own specifications. This means a FootballMaker would make
    footballs, and BasketballMaker would make basketballs.


    The implementation pseudocode is available in the Archive. It should help you
    create the pattern for the language of your choosing.


    # Factory Pattern, in C#


    This is implemented by any subclasses that need to use it


    ```

