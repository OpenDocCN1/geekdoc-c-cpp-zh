  md: '# CHAPTER 9:


    # GARBAGE COLLECTION


    When you create an object, CLR allocates memory from the Heap. This process repeats
    each time new objects form and are made. But it cannot go forever, because memory
    is limited. Now and then, the system has to purge unused objects and make space
    for new ones. Garbage Collection, or GC, manages memory. It allocates and reclaims
    memory. It allocates memory for new objects and goes to the heap to remove objects
    that are not in use by the program. This means memory is still available.


    # Memory Facts


    When the process is triggered, it is a piece of virtual space that stems from
    your memory. Physical memory is the actual memory that your computer uses, RAM.
    Programs deal with virtual space - that''s working memory. Machines deal with
    physical space.


    Virtual memory has free-blocks that called holes. When an object asks for memory,
    GC looks for an empty block and assigns it to the objects. Virtual memory is the
    memory that the computer has given to the program or code to work within.


    Below are the three types of blocks in virtual memory:


    There are three blocks in virtual memory:


    +   * Free, which is empty space

    * Reserved, which is already allocated

    * Committed, which is reserved for physical memory and cannot be allocated


    # How Does GC Work?


    The Heap is a memory block that is for storing objects. When GC happens in the
    Heap, it looks for inactive objects and removes them, and then compact the remaining
    objects to get free more memory.


    The Heap is managed by a group of generators. These generations store and handle
    short-term and long-term objects. These generations are:


    +   * 0 Generation - it holds short-term, temporary objects that don''t last Long,
    GC is activated frequently.

    * 1 Generation - is the buffer existing between short-term and long-term objects

    * 2 Generation - holds long-term objects, such as static and global variables,
    that need to last, and that the program may depend on. When an object is not collected
    in 0 generation, it is moved to 1 Generation. That object called a survivor. If
    it is not collected again in 1 generation it is moved up to 2 Generation because
    it is important if it is still active.


    # How Does GC Determine the Live Objects?


    To determine if an object is live or not, GC will check the information:


    +   * All object handles that are not allocated by CLR or by user code are collected

    * Static objects are referenced by any other object are tracked

    * GC uses the Stack Walker and JIT Stack.


    # When Does GC Get Triggered?


    There is no set time when GC gets triggered. It is triggered when the conditions
    below are met:


    +   * When virtual memory is low

    * When the memory is repressed past a certain threshold. GC discovers a high level
    of living objects, it increases the allocation

    * It is also triggered and is called specifically using the GC.Collect() method.
    This is rare because GC is always active and performs actions needed.


    # What are the Managed/Unmanaged Objects or Resources?


    In a nutshell:'
