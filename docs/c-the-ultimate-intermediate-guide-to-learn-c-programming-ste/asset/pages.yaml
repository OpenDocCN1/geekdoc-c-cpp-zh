    \ to LINQ.\n\n# Mapping LINQ to SQL\n\nMapping LINQ to SQL when .NET recognizes\
    \ a database as Objects(Classes). It is easy to do. You Open Visual Studio, project\
    \ in solution explorer. Click Add, then select New Item. Select \"Data\" from\
