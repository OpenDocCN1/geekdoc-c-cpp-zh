    # LAMBDA EXPRESSIONS AND EXPRESSION TREES


    In this section, we are going to discuss Lambda expressions and expression trees.
    We are going to learn how they are created and how we use them to simplify and
    enhance our code. Understanding delegates, which we discussed in the first book,
    is essential.


    # Lambda Expressions


    Lambda Expressions are anonymous, unspecified functions that create delegates
    or expression trees. They provide fast and easy ways of defining delegates. They
    are methods without declaration-like access modifiers. They will make your code
    more compact, reducing lines of code and making it easy to maintain and reuse.


    With Lambda Expressions, we can write our methods at the same place we are going
    to use them. They are like anonymous methods, but they have a simpler syntax.


    Lambdas are critical in method-based LINQ queries that can be fed in the standard
    query operator methods like the "Where".


    Below is the basic structure of Lambda Expressions :


    Parameters => Executed code


    # Example 1:


    ```

    x => x*;

    ```


    The input parameter is ''x'', and ''x*x'' is the expression. The x value is returned
    after it has been multiplied by itself.


    Lambda expressions can be assigned to delegate as follows:


    ```

    delegate int Main(string[] args)

    static void Main(string[] args)

    delegate myDelegate = x => x * x;

    int resultVariable=myDelegate(8);


    ```


    We have assigned the Lambda Expression "x => x * x" to a delegate called "myDelegate".
    Then we called myDelegate and passed "8". The result is stored in an integer variable
    "resultVariable" which gave us 64.


    # Example 2:


    ```

    Class LambdaExpression()

    static void Main(string[] args)

    List<string> names=new List<string>();

    names.Add(''Mark'');

    names.Add(''Jeff'');

    names.Add(''John'');

    string result=names.Find(name=>name.Equals(''Jeff''));


    ```


    Above we declared a list of String values "names". Then we added it to list with
    the list.Add method. Then we use the list.Find, passing the Lambda Expression
    "name=>name.Equals(''Jeff'')" which gives our result in a string literal "resultString",


    # Example 3:


    ```

    namespace lambdaexample

    class QueryOperator

    {

    static void Main(string[] args)

    {

    int[] numbers = { 1, 1, 2, 3, 5, 8, 13, 24 };

    double average=numbers.Where(num=> num % 2 == 1).Average();

    Console.WriteLine(averageNumber);


    ```'
