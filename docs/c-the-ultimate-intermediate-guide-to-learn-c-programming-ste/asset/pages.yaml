  md: '# CHAPTER 17:


    # ASYNCHRONOUS PROGRAMMING


    C# allows you to write asynchronous code. Suppose you were working on a Windows
    program that downloads images. Clicking the button and downloading the image would
    take more than 30 seconds, and your program would be unresponsive if you tried
    downloading the image synchronously. A better way would be asynchronous.


    We are going to explore what this means and how we can use it in our applications.


    Contents


    +   - **Asynchronous Programming using async and await***


    We can use asynchronous programming by using two keywords: async and await. Let''s
    look at both.


    # Async


    If we put the keyword before a function when we declare it, that function become
    asynchronous. This keyword activates resources of the .NET framework that allows
    us to create an asynchronous framework. The function will be called asynchronous.
    Below is the syntax:


    public async void MyProcess()


    ```

    {}

    ```


    The function above will be called asynchronously.


    # Await


    The function that has "async" before it must also have an "await" keyword inside.
    Its syntax is as follows:


    public async void MyProcess()


    ```

    {

    // do the asynchronous work

    await Task.delay(5);

    }

    ```


    The function above will activate after waiting for 5 seconds.


    The code below downloads images asynchronously from the web.


    # Example 1:


    private void button_Click(object sender, EventArgs e)

    {

    WebClient image = new WebClient();

    byte[] imageData = image.DownloadData("http://{urlOfTheImage}");

    this.imageView.Image = Image.FromStream(new MemoryStream(imageData));

    }


    Your application will become unresponsive while the code executes, and that is
    not desirable. We can fix this using async and await like this


    # Example 2:


    ```

    private async void button_Click(object sender, EventArgs e)

    {

    WebClient image = new WebClient();

    byte[] imageData = await image.DownloadDataTaskAsync("http://{urlOfTheImage}");

    this.imageView.Image = Image.FromStream(new MemoryStream(imageData));

    }

    ```


    If you look at blocks of code, you will find three differences:'
