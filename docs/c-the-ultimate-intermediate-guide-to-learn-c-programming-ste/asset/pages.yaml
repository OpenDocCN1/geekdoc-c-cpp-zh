  md: "# CHAPTER 3:\n\n# NAMESPACES\n\nNamespaces allow us to separate and use functions\
    \ that have similar names and parameters but serve different purposes(\"C# Namespaces\"\
    ). It is not common for programming languages to allow it. Every function has\
    \ to have a name that is unique.\n\nHere's the syntax:\n\n```\nnamespace namespaceName\
    \ {\n  Class definition {\n    // Define the functions\n  }\n}\n```\n\nAll functions\
    \ defined will belong to the 'namespaceName' namespace. In some programs, you\
    \ will need the following definition.\n\n```\nusing System;\n```\n\nIt will result\
    \ in using the functions defined in the 'System' namespace.\n\n**Example:** The\
    \ program below is used to showcase how to use namespaces.\n\n```\nusing System;\n\
    \n// One namespace\nnamespace NameA {\n  public class ClassA {\n    public void\
    \ FunctionA() {\n      Console.WriteLine(\"This is from namespace A\");\n    }\n\
    \  }\n}\n\n// Second namespace\nnamespace NameB {\n  public class ClassB {\n \
    \   public void FunctionB() {\n      Console.WriteLine(\"This is from namespace\
    \ B\");\n    }\n  }\n}\n\nnamespace Demo {\n  class Program {\n    // The main\
    \ function\n    static void Main(string[] args) {\n      // Using the namespaces\n\
    \      NameA.ClassA clsA = new NameA.ClassA();\n      clsA.FunctionA();\n\n  \
    \    NameB.ClassB clsB = new NameB.ClassB();\n      clsB.FunctionB();\n\n    \
    \  Console.Read();\n    }\n  }\n}\n```\n\nIn the program above:"
