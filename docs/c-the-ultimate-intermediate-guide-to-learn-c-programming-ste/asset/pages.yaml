    \ is like a tower of bricks, with new items being added on top of the pile. It\
    \ is not necessarily an organized way of doing things, but it can be very powerful.\
    \ In a regular stack, as in a computer stack, it is dangerous to remove from the\
    \ middle of the bottom, so things that are added last are removed first, and you\
    \ cannot remove things in the middle or the bottom.\n\nAdding stuff to the stack\
    \ is called pushing. You can perform this whenever you need. Removing an item\
    \ is called popping. When you pop something, it is removed from the stack, but\
    \ you can do something with it. You can also throw it away completely.\n\nLists\
    \ and stacks are important to computer programming. If you master them, you will\
    \ see your skill improve overall as you will be able to manipulate data, keep\
    \ logs, and run algorithms more efficiently."
