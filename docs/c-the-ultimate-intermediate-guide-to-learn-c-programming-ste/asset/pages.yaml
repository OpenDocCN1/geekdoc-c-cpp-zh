  md: '# CHAPTER 2:


    # C# INTERFACES


    Interfaces are classes that contain declarations of functions that can be inherited
    by other classes. The classes that inherit the method define the method.


    Interfaces are defined like this:


    ```

    public interface interfacename

    {

    // interface methods declaration

    }

    ```


    The inheriting class then defines the methods like this:


    ```

    class classname: interfacename

    {

    // interface method definition

    }

    ```


    Here is an application using interfaces.


    ```

    using System;

    namespace Demo

    {

    // Defining the interface

    public interface Score

    {

    // Declaring the interface methods

    void DisplayScore();

    int Calculate();

    }

    public class Player

    {

    public int PlayerID;

    public string PlayerName;

    public int score1,score2;

    // Defining the interface methods

    public void DisplayScore()

    {

    Console.WriteLine("The score for try 1 is " + score1);

    Console.WriteLine("The score for try 2 is " + score2);\n}

    public int Calculate()

    {

    return score1 + score2;

    }

    }

    class Program

    {

    // The main function

    static void Main(String[] args)

    {

    Player player1 = new Player();

    player1.PlayerID = 1;

    player1.PlayerName = "John";

    player1.score1 = 10;

    player1.score2 = 20;

    player1.DisplayScore();

    Console.WriteLine("The total score is " + player1.Calculate());

    Console.Read();

    }

    }

    ```


    Here is what we see happen in the code above:'
