    }\n```\n\nWe are only going to get Toronto and New York printed in the console\
    \ because they are the only cities that meet both conditions of more than six\
    \ characters long and containing the letter o.\n\n## Select\n\nThe select query\
    \ is often used with objects that have multiple members. It is used to extract\
    \ a specific member of an object collection; it can also be used by any object.\
    \ The example below illustrates the Select query.\n\n## Example 4:\n\n```csharp\n\
    using System;\nusing System.Collections;\nusing System.Collections.Generic;\n\
    using System.Linq;\nnamespace MyCSharpApplication\n{\n    public class Person\n\
    \    {\n        public int age;\n        public string name;\n        public Person(int\
    \ age, string name)\n        {\n            this.age = age;\n            this.name\
    \ = name;\n        }\n    }\n}\n\nclass Program\n{\n    public static void Main(string[]\
    \ args)\n    {\n        Person p1 = new Person(9, \"James\");\n        Person\
    \ p2 = new Person(8, \"Carrie\");\n        Person p3 = new Person(13, \"Matthew\"\
    );\n        Person p4 = new Person(15, \"Evelyn\");\n        Person p5 = new Person(6,\
    \ \"Max\");\n        List<Person> list = new List<Person>();\n        list.Add(p1);\n\
    \        list.Add(p2);\n        list.Add(p3);\n        list.Add(p4);\n       \
    \ list.Add(p5);\n        List<string> names = list.Where(p => p.age <= 12).Select(p\
    \ => p.name).ToList();\n        foreach(string name in names)\n        {\n   \
    \         Console.WriteLine(name);\n        }\n        Console.Read();\n    }\n\
    }\n```\n\nWe made a class that has two member variables: age and name. They are\
    \ initialized the constructor. Then we created five Person objects and stored\
    \ them in a Person collection named list. We then used a LINQ query with Where\
