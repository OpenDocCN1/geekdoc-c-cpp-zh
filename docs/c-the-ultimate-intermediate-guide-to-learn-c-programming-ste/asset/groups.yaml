    Walnuts\", \"Pistachios\"))\n```\n\nOur output will be:\n\n800\n\nPistachios\n\
    \nIn the example, we had to specify the data type in the list in the \"<>.\" What\
    \ is interesting that even if we don't specify the data type, the C# compiler\
    \ would still be able to run the method because it can find out what data type\
    \ is in the list. This is known as type interfacing. To see it in action, we have\
    \ to try the code again, like this:\n\nHere is an example of both methods:\n\n\
    ```\nConsole.WriteLine(MathEx.Max(63, 800, 700))\n```\n\n```\nConsole.WriteLine(MathEx.Max(\"\
    Almonds\", \"Walnuts\", \"Pistachios\"))\n```\n\nOur output will be:\n\n800\n\n\
    Pistachios\n\nOur output is the same as before, even when we didn't specify the\
    \ data type in the list. The only time that this method would fail is if we mixed\
    \ different data types in one list. So, you can't run it on a list of integers\
    \ and floats, for example.\n\n# CHAPTER 9:\n\n# GARBAGE COLLECTION\n\nWhen you\
    \ create an object, CLR allocates memory from the Heap. This process repeats each\
    \ time new objects form and are made. But it cannot go forever, because memory\
    \ is limited. Now and then, the system has to purge unused objects and make space\
    \ for new ones. Garbage Collection, or GC, manages memory. It allocates and reclaims\
    \ memory. It allocates memory for new objects and goes to the heap to remove objects\
    \ that are not in use by the program. This means memory is still available.\n\n\
    # Memory Facts\n\nWhen the process is triggered, it is a piece of virtual space\
    \ that stems from your memory. Physical memory is the actual memory that your\
    \ computer uses, RAM. Programs deal with virtual space - that's working memory.\
    \ Machines deal with physical space.\n\nVirtual memory has free-blocks that called\
    \ holes. When an object asks for memory, GC looks for an empty block and assigns\
    \ it to the objects. Virtual memory is the memory that the computer has given\
    \ to the program or code to work within.\n\nBelow are the three types of blocks\
    \ in virtual memory:\n\nThere are three blocks in virtual memory:\n\n- Free, which\
    \ is empty space\n- Reserved, which is already allocated\n- Committed, which is\
    \ reserved for physical memory and cannot be allocated\n\n# How Does GC Work?\n\
    \nThe Heap is a memory block that is for storing objects. When GC happens in the\
    \ Heap, it looks for inactive objects and removes them, and then compact the remaining\
    \ objects to get free more memory.\n\nThe Heap is managed by a group of generators.\
    \ These generations store and handle short-term and long-term objects. These generations\
    \ are:\n\n- 0 Generation - it holds short-term, temporary objects that don't last\
    \ Long, GC is activated frequently.\n- 1 Generation - is the buffer existing between\
    \ short-term and long-term objects\n- 2 Generation - holds long-term objects,\
    \ such as static and global variables, that need to last, and that the program\
    \ may depend on. When an object is not collected in 0 generation, it is moved\
    \ to 1 Generation. That object called a survivor. If it is not collected again\
    \ in 1 generation it is moved up to 2 Generation because it is important if it\
    \ is still active.\n\n# How Does GC Determine the Live Objects?\n\nTo determine\
    \ if an object is live or not, GC will check the information:\n\n- All object\
    \ handles that are not allocated by CLR or by user code are collected\n- Static\
    \ objects are referenced by any other object are tracked\n- GC uses the Stack\
    \ Walker and JIT Stack.\n\n# When Does GC Get Triggered?\n\nThere is no set time\
    \ when GC gets triggered. It is triggered when the conditions below are met:\n\
    \n- When virtual memory is low\n- When the memory is repressed past a certain\
    \ threshold. GC discovers a high level of living objects, it increases the allocation\n\
    - It is also triggered and is called specifically using the GC.Collect() method.\
    \ This is rare because GC is always active and performs actions needed.\n\n# What\
    \ are the Managed/Unmanaged Objects or Resources?\n\nIn a nutshell:\n\n- Any object\
    \ created, managed, and within the CLR scope is a managed object. It is managed\
    \ if it is .Net, runtime-managed, and within the scope. Any classes within the\
    \ .NET framework count as managed objects.\n- Any project that is not CLR managed\
    \ is externally managed by the .NET library and is not a managed object. These\
    \ include COM objects, interop objects, and all third party objects within the\
    \ .NET framework.\n\n# Cleaning up the Resources that Unmanaged\n\nGC cannot clean\
    \ unmanaged objects. It is the programmer's responsibility to explicitly get rid\
    \ of them when completed. Unmanaged objects are hidden around operating system\
    \ resources like database connections, file streams, handles, etc. GC can track\
    \ life cycle of managed and unmanaged resources, but the responsibility of removing\
    \ unmanaged objects lies with the programmer.\n\nHere are a few ways you can do:\n\
    \n- Implementing the Dispose method and IDisposable interface\n- By the \"using\"\
    \ code\n\nYou can implement the Dispose method in two ways:\n\n- By using SafeHandle\
    \ class containing IDisposable interface and Finalizer.\n- By overriding the Finalize\
    \ method, which is destroyed by object.\n\n# The 'using' statement\n\nThe \"using\"\
    \ statement ensures that the object is removed. If the object falls outside of\
    \ scope, the Dispose method is called. It acts the same as Try... I will show\
    \ you how works by creating a class with IDisposable implementation.\n\n```csharp\n\
    class Test:IDisposable\n{\n    public void Dispose()\n    {\n        // Dispose\
    \ of objects here\n        // clean resources\n        Console.WriteLine();\n\
    \    }\n}\n\nclass Program\n{\n    static void Main()\n    {\n        // Use the\
    \ using statement that implements Dispose.\n        using (IDisposable obj= new\
    \ Test())\n        {\n            Console.WriteLine();\n        }\n    }\n}\n\
    ```\n\n//output:\n\n// Try...Finally code below\n\n```csharp\nIDisposable obj\
    \ = new Test();\ntry\n{\n    //the code goes here\n}\nfinally\n{\n    if (obj\
    \ != null)\n        obj.Dispose();\n}\n```\n\nIn a set like this, is printed,\
    \ the 'using' block calls the Dispose method, followed by the statement.\n\n#\
    \ Quick Primer\n\n- Object-oriented programming, or OOP, is programming that reflects\
    \ real-world objects\n- C# classes describe what a category of objects does, the\
    \ data type it will hold, and functions\n- Creating new objects is as easy as\
    \ Random(). This will create object which generates random numbers\n- Destructors\
    \ are generally not needed in C# because Garbage Collection disposes of an object\
    \ when it is not in use\n- Stack and Heap manage memory\n- Garbage Collector allocates\
    \ and deallocates memory\n- GC manages the Heap - a memory block used for storing\
    \ objects\n- GC is not scheduled; it is triggered when certain conditions are\
    \ met.\n- Unmanaged objects are hidden or wrapped around the resources of the\
    \ operating system\n- We can use the Dispose method and/or 'using' statement to\
    \ remove unmanaged objects\n\n# CHAPTER 10:\n\n# LAMBDA EXPRESSIONS AND EXPRESSION\
    \ TREES\n\nIn this section, we are going to discuss Lambda expressions and expression\
    \ trees. We are going to learn how they are created and how we use them to simplify\
    \ and enhance our code. Understanding delegates, which we discussed in the first\
    \ book, is essential.\n\n# Lambda Expressions\n\nLambda Expressions are anonymous\
    \ unspecified functions that create delegates or expression trees. They provide\
    \ fast and easy ways of defining delegates. They are methods without declaration-like\
    \ access modifiers. They will make your code more compact, reducing lines of code\
    \ and making it easy to maintain and reuse.\n\nWith Lambda Expressions, we can\
    \ write our methods at the same place we are going to use them. They are like\
    \ anonymous methods, but they have a simpler syntax.\n\nLambdas are critical in\
    \ method-based LINQ queries that can be fed in the standard query operator methods\
    \ like \"Where\".\n\nBelow is the basic structure of Lambda Expressions:\n\nParameters\
    \ => Executed code\n\n# Example 1:\n\n```csharp\nx => x*x;\n```\n\nThe input parameter\
    \ is 'x', and 'x*x' is the expression. The x value is returned after it has been\
    \ multiplied by itself.\n\nLambda expressions can be assigned to delegate as follows:\n\
    \n```csharp\ndelegate int Main(string[] args)\nstatic void Main(string[] args)\n\
    delegate myDelegate = x => x * x;\nint resultVariable=myDelegate(8);\n```\n\n\
    We have assigned the Lambda Expression \"x => x * x\" to a delegate called \"\
    myDelegate\". Then we called myDelegate and passed \"8\". The result is stored\
    \ in an integer variable \"resultVariable\" which gave us 64.\n\n# Example 2:\n\
    \n```csharp\nclass LambdaExpression()\n{\n    static void Main(string[] args)\n\
    \    {\n        List<string> names=new List<string>();\n        names.Add('Mark');\n\
    \        names.Add('Jeff');\n        names.Add('John');\n        string result=names.Find(name=>name.Equals('Jeff'));\n\
    \    }\n}\n```\n\nAbove we declared a list of String values \"names\". Then we\
    \ added it to list with the list.Add method. Then we use the list.Find, passing\
    \ the Lambda Expression \"name=>name.Equals('Jeff')\" which gives our result in\
    \ a string literal \"resultString\",\n\n# Example 3:\n\n```csharp\nnamespace lambdaexample\n\
    class QueryOperator\n{\n    static void Main(string[] args)\n    {\n        int[]\
    \ numbers = { 1, 1, 2, 3, 5, 8, 13, 24 };\n        double average=numbers.Where(num=>\
    \ num % 2 == 1).Average();\n        Console.WriteLine(average);\n    }\n}\n```\n"
  mdcn: "\n这里是两种方法的示例：\n\n```c\nConsole.WriteLine(MathEx.Max<int>(63, 800, 700))\n\
    ```\n\n```c\nConsole.WriteLine(MathEx.Max<string>(\"Almonds\", \"Walnuts\", \"\
    Pistachios\"))\n```\n\n我们的输出将是：\n\n800\n\nPistachios\n\n在示例中，我们必须在 `<>` 列表中指定数据类型。有趣的是，即使我们不指定数据类型，C#\
    \ 编译器仍然能够运行该方法，因为它可以识别出列表中的数据类型是什么。这被称为类型推接口（type interfacing）。为了看到它的效果，我们必须再次尝试代码，如下：\n\
    \n这里是两种方法的示例：\n\n```c\nConsole.WriteLine(MathEx.Max(63, 800, 700))\n```\n\n```c\n\
    Console.WriteLine(MathEx.Max(\"Almonds\", \"Walnuts\", \"Pistachios\"))\n```\n\
    \n我们的输出是：\n\n800\n\nPistachios\n\n即使我们没有在列表中指定数据类型，输出与之前相同。这种方法唯一失效的情况是在一个列表中混合了不同的数据类型。因此，你不能在整数和浮点数的列表上运行它，例如。\n\
    \n# 第 9 章：\n\n# 垃圾回收\n\n当你创建一个对象时，CLR 会从堆（Heap）分配内存。这个过程在每次形成并创建新对象时重复。但它不能无限持续下去，因为内存是有限的。系统偶尔需要清理未使用的对象并为新对象腾出空间。垃圾回收（Garbage\
    \ Collection，简称 GC）管理内存。它分配并回收内存。它为新对象分配内存，并进入堆移除程序不再使用的对象。这意味着内存仍然可用。\n\n# 内存常识\n\
    \n当进程被触发时，它是源自你内存的一段虚拟空间。物理内存是计算机使用的实际内存，即 RAM。程序处理的是虚拟空间——这就是工作内存。机器处理的是物理空间。\n\
    \n虚拟内存具有被称为“空洞”（holes）的空闲块。当对象请求内存时，GC 会寻找一个空块并分配给该对象。虚拟内存是计算机提供给程序或代码运行范围的内存。\n\
    \n以下是虚拟内存中三种类型的块：\n\n虚拟内存中有三种块：\n\n- 空闲（Free），即空闲空间\n- 预留（Reserved），即已经分配\n- 已提交（Committed），已预留给物理内存且无法分配\n\
    \n# GC 如何工作？\n\n堆是一个用于存储对象的内存块。当堆中发生 GC 时，它会寻找不活跃的对象并将其移除，然后对剩余对象进行压缩以释放更多内存。\n\
    \n堆由一组代际（generators）管理。这些代际存储并处理短期和长期对象。这些代际是：\n\n- 0 代 - 持有持续时间不长的短期、临时对象，GC\
    \ 频繁激活。\n- 1 代 - 是存在于短期和长期对象之间的缓冲区\n- 2 代 - 持有长期对象，例如静态和全局变量，这些对象需要持久存在且程序可能依赖它们。当对象在\
    \ 0 代中未被收集时，它会被移动到 1 代。该对象被称为幸存者（survivor）。如果在 1 代中再次没有被收集，它将移动到 2 代，因为如果它仍然活跃，就很重要。\n\
    \n# GC 如何确定存活对象？\n\n为了确定一个对象是否存活，GC 将检查以下信息：\n\n- 所有未由 CLR 或用户代码分配的对象句柄都会被收集\n\
    - 被任何其他对象引用的静态对象会被跟踪\n- GC 使用栈跟踪器（Stack Walker）和 JIT 栈。\n\n# GC 何时被触发？\n\nGC 触发没有固定的时间。它在满足以下条件时被触发：\n\
    \n- 当虚拟内存过低时\n- 当内存压力超过某个阈值时。GC 发现存活对象比例较高时，它会增加分配\n- 也可以通过专门使用 `GC.Collect()`\
    \ 方法来触发。这种情况很少见，因为 GC 始终处于激活状态并执行所需的操作。\n\n# 什么是托管/非托管对象或资源？\n\n简而言之：\n\n- 任何在\
