    ).Last();\n    int newId = Convert.ToInt32(lastToy.Attribute(\"ID\").Value) +\
    \ 1;\n    newToy.SetAttributeValue(\"ID\",newId);\n    doc.Element.Add(newToy);\n\
    \    doc.Save(file);\n} catch (Exception err) {\n    MessageBox.Show(err.Message);\n\
    }\n```\n\n在创建 \"Element\" 对象后，我们创建了一个与 \"Toy\" 元素签名相同的 \"Element\" 类型。我们在这一行中执行了操作：XElement\
    \ newToy = new XElement('Toy', new XElement('Name', name), XElement('Price', price))。我们使用\
    \ XElement.Descendants('Toy').Last() 通过变量 lastToy 选择了最后一个玩具。我们访问了 \"ID\" 值并对其递增，直到将其设置为新玩具的属性。我们通过这一行实现了这一点：newToy.SetAttribute('ID',++newId)。最后，我们使用\
    \ \"Add() 方法\" 插入了 \"toy\" 对象并保存。\n\n## 输出 3:\n\nXML 文件现在将包含第四个子元素。如果我们传递 \"Thor\"\
    \ 作为名称并将 \"0.65\" 作为价格，我们将得到如下的第四个元素。\n\n```xml\n<Toy>\n  <Name>Thor</Name>\n\
    \  <Price>$0.65</Price>\n</Toy>\n```\n\n要修改 XML 文件，我们必须定位目标元素。第一行执行了：\"XElement\
    \ cToy=doc.Descendants('Toy').Where(c=>c.Attribute('ID').Value.Equals(id));\"\n\
    \n它寻找匹配提供的 ID，允许 \"XElement\" 对象指向它。一旦完成，我们可以使用 cToy.Element(\"Price\") = price\
    \ 更新其内部值。然后保存我们所做的更改。如下：\n\n## 示例 4:\n\n```csharp\nprivate string file = \"SampleData.xml\"\
    ;\nprivate void UpdateData(string name, string price, int id)\n{\n    try {\n\
    \        XDocument doc = XDocument.Load(file);\n        XElement cToy = doc.Descendants(\"\
    Toy\").Where(c=>c.Attribute(\"ID\").Value.Equals(id));\n        cToy.Element(\"\
    Name\") = name;\n        cToy.Element(\"Price\") = price;\n        doc.Save(file);\n\
    \    }\n    catch (Exception err) {\n        MessageBox.Show(err.Message);\n \
    \   }\n}\n```\n\n## 输出 4:\n\n如果我们传递 id=1, name=\"Batman\", price=\"$0.90\"，我们将得到如下玩具：\n\
    \n```xml\n<Toy ID=\"1\">\n  <Name>Batman</Name>\n  <Price>$0.90</Price>\n</Toy>\n\
    ```\n\n# 第 14 章：工厂模式与组合模式\n\n## 工厂模式\n\n工厂模式允许你使用模板代码创建多个对象。其工作原理如下：你首先创建一个标准化创建过程的类接口。使用子类来创建提供了灵活性。如果编程语言没有接口或抽象类，你需要创建一个工厂类并拥有子类。想象你在任何时候都被要求创建各种球类。你有篮球、排球球、足球等。你总是知道如何制作每一个。一个概述构造过程的接口，我们称为\
    \ \"BallFactory\"。对于每个球，我们创建一个扩展 \"BallFactory\" 的子类。子类根据自己的规格制作球。伪代码可用。\n\n##\
    \ C# 中的工厂模式\n\n由任何需要使用它的子类实现。\n\n```csharp\n// 接口 Factory\n// 输入：你的选择\n// 输出：你的选择\n\
    // 实现此接口的构造函数\npublic interface Factory {\n    void createObject();\n}\n\n// SubFactory1:\n\
    // 根据工厂创建不同的对象\nclass SubFactory1 : Factory {\n    // 实现接口定义的函数\n    public void\
    \ createObject() {\n        // 在此包含其他代码\n    }\n}\n\n// SubFactory2:\n// 根据工厂创建不同的对象\n\
    class SubFactory2 : Factory {\n    // 实现接口定义的函数\n    public void createObject()\
    \ {\n        // 在此包含其他代码\n    }\n}\n```\n\n## 实现工厂模式\n\n使用你喜欢的 IDE 来实现代码。你可以使用如\
