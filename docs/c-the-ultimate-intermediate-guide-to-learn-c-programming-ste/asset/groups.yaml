    \ because an object needs to observe other objects for its main functions.\n\n\
    How it essentially works:\n\nObserve patterns are popular among developers because\
    \ of the functions we use in the described way. There is the Subject and the Observer.\
    \ Observing and being the object are descriptions of behavior, so we implement\
    \ Observer and Subject interfaces. This will allow classes to apply Observer and\
    \ Subject behaviors. All classes have to call their interfaces.\n\nAll classes\
    \ implementing the Observer interface will have a list of subjects to watch. You\
    \ will need an update method, which updates their data based on the relevant changes\
    \ in the subject objects.\n\nAll classes implementing the Subject interface will\
    \ have a list of observer objects to notify users of changes in data.\n\nWhen\
    \ there is a change in the subject object, it will call the notify() method, which\
    \ notifies a list of its observers. Once the observers are notified, they call\
    \ the update() method, which updates their data based on the subject's recent\
    \ update.\n\nWhen implementing the observer pattern, you only need to think about\
    \ two things: the number of observers and number of subjects. We are going to\
    \ be working with multi-observe and multi-subject scenarios to show dynamics.\n\
    \n# The Observer Pattern, in C#\n\nBelow is how the observer pattern looks in\
    \ C#. You will see two sets of class/interface pairs. We will start with the Observer\
    \ pair.\n\n```c\n/*\n * All Observing Classes implement an Observer abstraction\n\
    \ * It can:\n * - update object data based on subjects\n * - Observing Classes\
    \ may need a List of Subjects to access\n * - (added on Observer Class)\n */\n\
    interface Observer {\n    void update();\n    // enter any other methods\n}\n\n\
    /*\n * Observing Classes have:\n * - working version of the update() method\n\
    \ * - any number of additional fields & methods\n */\nclass ObservingClass : Observer\
    \ {\n    // enter any other fields;\n    // INPUT: (optional)\n    // OUTPUT:\
    \ none\n    // EFFECT: updates data in response to subject\n    void update()\
    \ {\n        // make any changes to observer's key fields here\n    }\n}\n```\n\
    \nBelow is the subject class/interface pair.\n\n```c\n// All Subject Classes implement\
    \ a Subject abstraction\n// It contains\n// - notify observers\n// - add/remove\
    \ observers in its update list\n// Subject Classes also need a List of Observers\
    \ to Update\n// (added on Subject Class)\ninterface Subject {\n    public void\
    \ notifyObservers();\n    public void addObs(Observer o);\n    public void deleteObs(Observer\
    \ o);\n    // enter any other methods here\n}\n```\n\n```c\n// Subject Classes\
    \ have:\n// - a List of observers to notify\n// - a working version of notifyObservers()\n\
    // - any number of additional fields & methods\n// Subject Classes also need a\
    \ List of Observers to Update\n// (added on Subject)\nclass SubjectClass {\n \
    \   // enter any key fields.\n    private List<Observer> obs = new List<Observer>();\n\
    \    // INPUT: (optional)\n    // OUTPUT: none\n    // EFFECT: updates observers\
    \ in list of any changes\n\npublic void notifyObservers() {\n    foreach (var\
    \ o in obs) {\n        o.update();\n    }\n}\n\n// Add/Delete Methods:\n// INPUT:\
    \ - Observer\n// OUTPUT: none\n// EFFECT: updates data in response to subject\n\
    public void addObs(Observer o) {\n    obs.add(o);\n}\n\npublic void deleteObs(Observer\
    \ o) {\n    obs.remove(o);\n}\n```\n\nNow, we go through implementing an observer\
    \ pattern in detail.\n\n# Implementing the Observer Pattern\n\nUse an IDE of your\
