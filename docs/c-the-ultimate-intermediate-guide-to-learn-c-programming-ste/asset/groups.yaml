    # CHAPTER 16:


    # THE FACADE PATTERN


    Driving a car is easy. To start a car, you twist the keys in the ignition or press
    a button. To accelerate, you step on the gas pedal. To slow down or stop, you
    step on the brake pedal, and the steering wheel allows you to control the direction
    of the car.


    However, a car is very complex. Starting a car requires a lot of energy. It requires
    gasoline. Gasoline needs oil for the engine pistons and all the other parts. The
    spark plugs need to ignite the engine cylinders and create enough energy for the
    car to move. Functions like steering, acceleration, and braking require a system
    of different, components to work together.


    From the driver''s seat, we don''t have access to all of this complexity. We can
    only see the simple tools in front of us. In a nutshell, a Facade.


    # How the Facade Pattern Works


    A Facade Pattern works the way. It provides a top-level component that oversees
    the functionality of a complex system. This makes operating a complex system simpler
    because all you have to control in the Facade is the simple system in front of
    you. Our car anomaly shows you this. The driver doesn''t need to work every component
    himself, go inside the engine, or perform a billion operations to make the car
    move. He just needs to understand how to operate the gear stick, pedal, wheel,
    and how basic things—simplifying something that is complex. Each driver takes
    stepping off a chain of events.


    # Creating the Facade Pattern


    When you want to implement a Facade Pattern, you need to first understand the
    core Procedures and/or Behaviors we would benefit from simplifying.


    Using an interface, we would follow the steps:


    +   1. Create a Facade interface that includes the core procedures

    2. Create a general client class that encompasses the Facade interface

    3. The general client should apply ALL the major procedures and contain as many
    component instances as necessary.

    4. If necessary, create multiple Facade interfaces and client classes. When you
    do, repeat steps 1 to 3.

    5. Create subclasses for general client classes when necessary; code that accesses
    the system does so as a client subclass.


    Follow these steps if you''re using an encompassing class:


    +   1. Create the "Facade" class. This class implements ALL the Major Procedures
    mentioned earlier. It should contain as many instances as needed.

    2. Create a general client class. It should contain an instance of the Facade
    class.

    3. If appropriate, create multiple Facade classes and repeat steps 1 & 2.

    4. Create subclasses for the general client if needed. Any code that accesses
    the system does it through the Facade class in the subclasses.


    The steps you take depend on your situation. Decide if using one encompassing
    Facade wrapper class is appropriate.


    # The Facade Pattern, in C#


    ```

