    abstract class Component {\n  string name;\n  Date dateCreated;\n  Date dateModified;\n\
    }\n```\n\n## Step 2: Customizing the Component Constructor\n\nThen we code a slightly\
    \ different version of our superclass. When a new component is made, name will\
