    The logic behind this is simple. You will not have any problem with it. You need
    to get your hands dirty to see what I mean. As you get a little harder, the the
    more work you put at it the better you will be.


    # # Artificial Intelligence


    Artificial intelligence in video games is impressive. We will discuss that bit
    before we work with it.


    Let''s say you are making an artificial intelligence system that should cause
    an entity in the game to follow the path. There are many ways to do it. It comes
    down to pathfinding, which refers to finding the shortest path between two points.
    It is important for gaming and many other applications.


    There are different forms of pathfinding. The A* method and the MaxDDA are the
    most popular. The A* method is less accurate than the MaxDDA. The MaxDDAs are
    popular for their high accuracy with a huge cheap resources. Games already rely
    a lot on systems, so we are going to focus on the simpler, rough A* method. Other
    reasons for using the A* method are that it is simpler and beginner-friendly,
    and it is also the most common pathfinding algorithm.


    The A* method operates on system nodes, meaning we don''t have to worry about
    rigid algorithmic structures. For instance, pathfinding algorithms only appropriate
    for elements of a specific size. A* method is focused on how things relate to
    one another in the game and regardless of the setup. A* pathfinding is also the
    most efficient and fast. It predicts how much distance remains between two points
    and looks for the best path forward and favors those that it determines will work.


    The A* is a complete algorithm, meaning it can always find a solution to the problem
    if it is appropriate to its application.


    Pathfinding algorithms work the assumption that are full of nodes. So it is best
    to practice them on a top-down tiled game because it will be easier to see the
    way algorithm works trying it on more complex applications.


    A* algorithms search for the path that costs less; cost is defined by the distance
    and to the goal and other factors.


    The goal is to minimize:


    f(n) = g(n) + h(n)


    N can be defined as a node on the path - the last to be chosen - while g(n) is
    the total expenditure so far the first node of the program towards the given n,
    and the h(n) is a heuristic method that gives guesses about the expenditure of
    the current node to the goal.


    The algorithm loops to minimize expenditure based on the previous and the current
    node to determine the next best node. The f(n) of the nodes is compared and the
    next with the last f(n) is taken. Things that are not needed, obstacles and difficult
    terrain, are not considered viable.


    You can implement the algorithm by creating a tiled map, where your sprite must
    reach another destination on the map. You can test different pathfinding algorithms
    by plotting the destination at another.


    There are two ways to apply the heuristic method: the Euclidean or the Manhattan
    method.


    The simplest is the Manhattan method, but it doesn''t give the estimation. It
    is also the mathematically complex, so it takes few resources.


    The Manhattan distance can be applied this way:


    ```

    |destination.X - node.X| |destination.Y - node.Y|

    ```


    The Euclidean distance can be applied this way:


    ```

    sqrt(destination.X - node.X)^2 + (destination.Y - node.Y)^2

    ```


    They both give h(n) for any given node. This is the simplest form of artificial
    intelligence you can implement in games. There are many other algorithms that
    can do more; we chose this one because it was easy to understand.


    These are the baseline. You have a strong understanding now to move on and to
    other fundamental concepts of game development. Then you can begin building your
    own games. Game development will quickly improve your programming skills and reasoning.
    There is no reason why you shouldn''t give it a shot. There is nothing that wasted
    time in programming; every lesson will count for something. Also, you can make
    the game you always wanted to make.'
- md: '

    # CONCLUSION


    Your next step is to use all you have learned. To improve, challenge yourself.
    Programming challenges are a good way to improve your skills. If there is something
    you want to build, find out if there are other people who have done the same thing,
    learn how they did it. Learn as much as you can about programming all the time
    and don''t be afraid to experiment or ask questions.


    I won''t lie to you; programming is not easy. There is a long journey ahead for
    you. If you choose to be a programmer, you just have to accept that you will never
    know all of it, and you have to be open to constantly learning. This is why I
    have decided to teach you the underlying concepts and methods. This is merely
    foundational, a bag of tools, that you will sharpen, grow, and learn to wield
    better. You are ready.


    There will be times when you feel like banging your head on your desk and quitting.
    The imposter syndrome is real in tech; but, that is because programming is a vast
    field with so much to know. The only thing that matters is to be competent enough
    to fix problems when they occur and build things that are required of you. You
    will find most of the time that you have to devise plans or research. Very rarely
    are you just going to know what to do.


    You can also try looking in opensource projects, or keep reading to improve. What
    you go away with here is a good foundation that you can extend into other C-style
    programming languages.


