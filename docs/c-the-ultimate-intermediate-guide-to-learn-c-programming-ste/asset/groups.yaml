    \n# LINQ and Lambda Expressions\n\nWhile we have already discussed Lambda Expressions\
    \ here, LINQ queries mostly imply Lambda Expressions in decorating with collections\
    \ to filter list items based on specific criteria. Here is how\n\n# Example 4:\n\
    \n```\nIEnumerable<SelectListItem> toys = database.Toys\nWhere(toy => toy.Tag\
    \ == curTagID)\nSelect(toy => new SelectListItem(Value = toy.Name, Text = toy.ID));\n\
    ViewBag.Toys = toys;\n```\n\nIn the code above, we have declared the variable\
    \ \"toys\" and are casting it to type \"SelectListItem\" to store the result from\
    \ our LINQ query. The line \"toy => toy.Tag==curTagID\" selects a toy based on\
    \ a passed ID, whereas the line \"toy => new SelectListItem(Value = toy.Name,\
    \ Text = toy.ID)\" selects a particular toy based an ID and name. The result that\
    \ this method is saved in the \"toys\" variable.\n\n# Working with XML\n\nLet's\
    \ look at how we use LINQ to work with XML data. XML data is widely used on the\
    \ Wide Web because of its compatibility with different systems. It is often referred\
    \ as self-describing or self-defining data. XML is highly standardized, and its\
    \ customizable tags are used in sharing, accessing, and manipulating data."
- md: "\nWe will see how we can use LINQ to:\n\n# Contents\n\n- Retrieve and delete\
    \ XML data\n- Insert and update XML data\n\n## Retrieve and Delete XML Data\n\n\
    XML files have a root/parent tag that encapsulates, defines the type of child\
    \ record and its attributes. The child records (elements) contain the data. Look\
    \ at the XML code below. We will be using it to test our LINQ queries.\n\n## Sample\
    \ XML Data\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<Toys>\n  <Toy\
    \ ID=\"1\">\n    <Name>Batman</Name>\n    <Price>$0.45</Price>\n  </Toy>\n  <Toy\
    \ ID=\"2\">\n    <Name>Snowwhite</Name>\n    <Price>$0.40</Price>\n  </Toy>\n\
    \  <Toy ID=\"3\">\n    <Name>Hulk</Name>\n    <Price>$0.55</Price>\n  </Toy>\n\
    </Toys>\n```\n\nToys is the root element with Toy elements inside. Every toy element\
    \ has an ID attribute and \"Price\" and \"Name\" as inner elements.\n\nNow lets\
    \ extract data from the table using LINQ queries.\n\n## Example 1:\n\n```csharp\n\
    private string file = \"SampleData.xml\";\nprivate void GetData()\n{\n    try\n\
    \    {\n        XDocument doc = XDocument.Load(file);\n        var query = from\
    \ toy in doc.Descendants(\"Toy\")\n        select new {\n            ID=toy.Attribute(\"\
    ID\").Value,\n            Name = toy.Element(\"Name\").Value,\n            Price\
    \ = toy.Element(\"Price\").Value\n        };\n        foreach (var x in query)\n\
    \        {\n            Console.WriteLine(\"ID\", x.ID);\n            Console.WriteLine(\"\
    Name\", x.Name);\n            Console.WriteLine(\"Price\", x.Price);\n       \
    \ }\n    }\n    catch (Exception ex)\n    {\n        MessageBox.Show(ex.Message);\n\
    \    }\n}\n```\n\nThe opening line to our XML data file is called \"SampleData.xml.\"\
    \ In the function, we load the xml file using the \"Load(file)\" function. After\
    \ the file is loaded, extract \"toy\" elements using the \"Descendants()\" method.\
    \ We get the ID attribute and its inner elements, and store them in the dynamic\
    \ variable.\n\n## Output:\n\n| Toy ID | Name | Price |\n| :--- | :--- | :--- |\n\
    | 1 | Batman | $0.45 |\n| 2 | Snowwhite | $0.40 |\n| 3 | Hulk | $0.55 |\n\nIf\
    \ you want to remove a name from the data file you would do the following:\n\n\
    ## Example 2:\n\n```csharp\nprivate string file = \"SampleData.xml\";\nprivate\
    \ void DeleteData(int id)\ntry {\n    XDocument sampleXML = XDocument.Load(file);\n\
    \    XElement cToy = sampleXML.Descendants(\"Toy\").Where(c=> c.Attribute(\"ID\"\
    ).Value.Equals(id));\n    cToy.Remove();\n    sampleXML.Save(file);\n} catch (Exception\
    \ e) {\n    MessageBox.Show(e.Message);\n}\n```\n\nAfter the file is loaded, the\
    \ code goes the child elements looking for a match, and when it finds it, it removes\
    \ the child with the \"Remove\" method, saving the resulting file.\n\n## Insert\
    \ and Update XML data\n\nThere isn't any big difference between inserting data\
    \ and extracting data from an XML file. We will only need an \"Element\" that\
    \ has the same signature as elements in the target XML file. Then we insert the\
    \ \"Element\" object into the file using \"XDocument\" object.\n\n## Example 3:\n\
    \n```csharp\nprivate string file = \"SampleData.xml\";\nprivate void InsertData(string\
    \ name, string price)\ntry {\n    XDocument doc = XDocument.Load(file);\n    XElement\
    \ newToy = new XElement(\"Toy\", new XElement(\"Name\", name), new XElement(\"\
    Price\", price));\n    XElement lastToy = doc.Descendants(\"Toy\").Last();\n \
    \   int newId = Convert.ToInt32(lastToy.Attribute(\"ID\").Value) + 1;\n    newToy.SetAttributeValue(\"\
    ID\",newId);\n    doc.Element.Add(newToy);\n    doc.Save(file);\n} catch (Exception\
    \ err) {\n    MessageBox.Show(err.Message);\n}\n```\n\nAfter creating \"Element\"\
    \ object, we created an \"Element\" type with the same signature as the \"Toy\"\
    \ element. We did this in this line: XElement newToy = new XElement('Toy', new\
    \ XElement('Name', name), XElement('Price', price)). We selected the last toy\
    \ with the var lastToy using the XElement.Descendants('Toy').Last(). We accessed\
    \ the \"ID\" value and incremented it until we set that as an attribute for our\
    \ new toy. We did this by line: newToy.SetAttribute('ID',++newId). Lastly, we\
    \ inserted the \"toy\" object with the \"Add() method, then saved out.\n\n## Output\
    \ 3:\n\nThe XML file will now contain a fourth child. If we passed \"Thor\" as\
    \ the name and \"0.65\" as the price, we would get the following as the fourth\
    \ element.\n\n```xml\n<Toy>\n  <Name>Thor</Name>\n  <Price>$0.65</Price>\n</Toy>\n\
    ```\n\nTo make changes to the XML file, we have to locate our target element.\
    \ The first line does: \"XElement cToy=doc.Descendants('Toy').Where(c=>c.Attribute('ID').Value.Equals(id));\"\
    \n\nIt looks for an element that matches an ID provided, allowing the \"XElement\"\
    \ object, \"cToy\", to point at it. Once it is done, we can update its inner values\
    \ using:\ncToy.Element(\"Price\").Value = price\n\nThen we save the changes we\
    \ have made. All this shown below.\n\n## Example 4:\n\n```csharp\nprivate string\
    \ file = \"SampleData.xml\";\nprivate void UpdateData(string name, string price,\
    \ int id)\n{\n    try {\n        XDocument doc = XDocument.Load(file);\n     \
    \   XElement cToy = doc.Descendants(\"Toy\").Where(c=>c.Attribute(\"ID\").Value.Equals(id));\n\
    \        cToy.Element(\"Name\").Value = name;\n        cToy.Element(\"Price\"\
    ).Value = price;\n        doc.Save(file);\n    }\n    catch (Exception err) {\n\
    \        MessageBox.Show(err.Message);\n    }\n}\n```\n\n## Output 4:\n\nIf we\
    \ passed id=1, name=\"Batman\", price=\"$0.90\" we would have the following toy:\n\
    \n```xml\n<Toy ID=\"1\">\n  <Name>Batman</Name>\n  <Price>$0.90</Price>\n</Toy>\n\
    ```\n\n# CHAPTER 14: THE FACTORY AND COMPOSITE PATTERN\n\n## Factory Pattern\n\
    \nFactory patterns allow you to create multiple objects using boilerplate code.\
    \ How essentially works:\n\nYou start by creating a class interface that standardizes\
    \ creation. You would use subclasses to create the objects. The subclass allows\
    \ for flexibility in what you are able to create. If the programming language\
    \ does not have interfaces or abstract classes, you will need to create a factory\
    \ class and have subclasses. Imagine you were charged with a wide range of sports\
    \ balls at any given time. You would have basketballs, volleyballs, footballs,\
    \ and more. You would always know how to make each one when requested. What would\
    \ your code look like for each?\n\nAn interface that outlines the construction.\
    \ We will call the interface \"BallFactory.\" For each ball, we would create a\
    \ subclass that extends \"BallFactory.\" The subclasses would make the ball, each\
    \ one according to its own specifications. The implementation pseudocode is available.\
    \ It should help you create the pattern for the language of choosing.\n\n## Factory\
    \ Pattern, in C#\n\nThis is implemented by any subclasses that need to use it.\n\
    \n```csharp\n// Interface Factory\n// INPUT: your choice\n// OUTPUT: your choice\n\
    // Constructor for Classes that implement this interface\npublic interface Factory\
    \ {\n    void createObject();\n}\n\n// SubFactory1:\n// creates distinct objects\
    \ based on Factory\nclass SubFactory1 : Factory {\n    // implements the same\
    \ function outlined in the interface\n    public void createObject() {\n     \
    \   // include other code here\n    }\n}\n\n// SubFactory2:\n// creates distinct\
    \ objects based on Factory\nclass SubFactory2 : Factory {\n    // implements the\
    \ same function outlined in the interface\n    public void createObject() {\n\
    \        // include other code here\n    }\n}\n```\n\n## Implementing the Factory\
    \ Pattern\n\nUse an IDE of your choice to implement the code. You can use online\
    \ ones like codechef.com, rextester.com, ideone.com, or codepad.org. Now let's\
    \ see the factory pattern first-hand with an example. There will also be a workshop\
    \ that allows you to continue with the pattern.\n\n## Sports Ball Creator\n\n\
    Imagine you had a build-to-order web app for creating sports balls of different\
    \ kinds. Below is how a general class would look:\n\n```csharp\n// A Sports Ball\
    \ has:\n// the type of ball it is\n// an array of materials used to manufacture\
    \ it\n// its size, as a radius (inches)\n// any additional comments required\n\
    // the company brand that made it\n// a product name\nclass SportsBall {\n   \
    \ public string[] materialsUsed;\n    public float radius;\n    public string\
    \ comments;\n    public string make;\n    public string modelName;\n}\n```\n\n\
    As you can see, a lot of small details are involved in creating sports ball objects.\
    \ For instance, if you had to create a football, the process would be different\
    \ than creating a tennis ball. They use different materials, in different sizes,\
    \ and different styles. In the real world, they are probably made by different\
    \ companies that give them different features. If you wanted to create a ball\
    \ easily, with less code, you would use the factory pattern method. However, as\
    \ you can see, let's say there are many small details involved in creating objects\
    \ for sports balls. So you had to create a certain baseball, the process would\
    \ be different than creating a soccer ball. Both would have different types, materials,\
    \ and sizes. They would also probably be created by different brands and would\
    \ have different features, too. Let's go through the steps in implementing a design\
    \ pattern. You will then practice by extending the work.\n\n## Step 1: The Factory\
    \ Interface\n\nWe start by creating the interface that all creating factory classes\
    \ will implement. It has one method, creating and returning instances of sports\
    \ balls.\n\n```csharp\n// The BallFactory\n// interface for how a ball will be\
    \ created\ninterface BallFactory {\n    // INPUT: none\n    // OUTPUT: A Sports\
    \ Ball object\n    // EFFECT: Creates a Sports Ball;\n    // Classes that implement\
    \ this will have their own distinctions in making\n    SportsBall createBall();\n\
    }\n```\n\n## Step 2: The First Factory Class\n\nNow we create a class that implements\
    \ the BallFactory interface. Right now, it only creates blockchains.\n\n```csharp\n\
    // The BasketballMaker:\n// create basketball objects with distinct fields\nclass\
    \ BasketballMaker : BallFactory {\n    // method implements the Interface Version\n\
    \    // EFFECT: Creates a sports ball as a Basketball\n    public SportsBall createBall()\
    \ {\n        SportsBall b = new SportsBall();\n        b.type = \"Basketball\"\
    ;\n        b.materialsUsed = new string[1];\n        b.materialsUsed[0] = \"rubber\"\
    ;\n        return b;\n    }\n}\n```\n"
  mdcn: "\n\n我们将看到如何使用 LINQ 来：\n\n# 目录\n\n- 获取并删除 XML 数据\n- 插入和更新 XML 数据\n\n## 获取并删除\
    \ XML 数据\n\nXML 文件有一个根节点/父标签，它封装并定义了子记录的类型及其属性。子记录（元素）包含数据。请看下方的 XML 代码。我们将使用它来测试我们的\
    \ LINQ 查询。\n\n## 示例 XML 数据\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    ?>\n<Toys>\n  <Toy ID=\"1\">\n    <Name>Batman</Name>\n    <Price>$0.45</Price>\n\
    \  </Toy>\n  <Toy ID=\"2\">\n    <Name>Snowwhite</Name>\n    <Price>$0.40</Price>\n\
    \  </Toy>\n  <Toy ID=\"3\">\n    <Name>Hulk</Name>\n    <Price>$0.55</Price>\n\
    \  </Toy>\n</Toys>\n```\n\n`Toys` 是根元素，内部包含 `Toy` 元素。每个 `toy` 元素都有一个 `ID` 属性，并包含\
    \ \"Price\" 和 \"Name\" 作为内部元素。\n\n现在让我们使用 LINQ 查询从数据表中提取数据。\n\n## 示例 1:\n\n```csharp\n\
    private string file = \"SampleData.xml\";\nprivate void GetData()\n{\n    try\n\
    \    {\n        XDocument doc = XDocument.Load(file);\n        var query = from\
    \ toy in doc.Descendants(\"Toy\")\n        select new {\n            ID=toy.Attribute(\"\
    ID\").Value,\n            Name = toy.Element(\"Name\").Value,\n            Price\
    \ = toy.Element(\"Price\").Value\n        };\n        foreach (var x in query)\n\
    \        {\n            Console.WriteLine(\"ID\", x.ID);\n            Console.WriteLine(\"\
    Name\", x.Name);\n            Console.WriteLine(\"Price\", x.Price);\n       \
    \ }\n    }\n    catch (Exception ex)\n    {\n        MessageBox.Show(ex.Message);\n\
    \    }\n}\n```\n\n我们 XML 数据文件的打开行名为 \"SampleData.xml\"。在函数中，我们使用 \"Load(file)\"\
    \ 函数加载 XML 文件。文件加载后，使用 \"Descendants()\" 方法提取 \"toy\" 元素。我们获取 ID 属性及其内部元素，并将它们存储在动态变量中。\n\
    \n## 输出:\n\n| Toy ID | Name | Price |\n| :--- | :--- | :--- |\n| 1 | Batman |\
    \ $0.45 |\n| 2 | Snowwhite | $0.40 |\n| 3 | Hulk | $0.55 |\n\n如果你想从数据文件中删除一个名称，可以执行以下操作：\n\
    \n## 示例 2:\n\n```csharp\nprivate string file = \"SampleData.xml\";\nprivate void\
