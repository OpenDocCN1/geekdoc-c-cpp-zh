    \ the memory available for today, so arrays played an important role in preventing\
    \ processes from hanging.\n\nThese days, programmers can write more dynamic programs\
    \ that can shrink and expand as the needs arise because computers have more memory,\
    \ and they are stronger. This is good for programmers to write more exciting things\
    \ as there is no room for them to do (without being irresponsible, of course).\n\
    \nThis is why list becomes more popular nowadays programmers are looking for flexibility\
    \ and power. If you have worked with languages like Python, this is not new to\
    \ you. List is a flexible array.\n\nLists can grow to whatever size is needed\
    \ at any given time as things change. Lists don't have a defined length. They\
    \ can always be added to. They are like fossils, there was a time when they weren't\
    \ any. They have now developed over millions of years, and they are alive today\
    \ and that will be alive in the future. They will be added to that list as long\
