    # Expression Trees


    Expression trees are data structures that contain expressions like Lambda Expressions.
    At their core, expressions are pieces of code that have a tree structure. You
    can use them to run Lambda Expressions on data sets. They are like a binary tree
    because trees can quickly find data. They give you the ability to translate executable
    code into data. For example, you can change the LINQ expression to function on
    another SQL database process.


    # Example 4


    Func<int, int, int> function = (a, b) => a + b;


    The above statement has three parts:


    +   * The declaration: Func<int,int,int> function

    * An equals sign operator =

    * A Lambda Expression:(a,b) => a+b;


    The executable code is located in the "function" variable which can house the
    result from the Lambda Expression(a,b) => a+b). The Lambda Expression looks like
    this:


    int d = function(2, 8);


    When we call it, the variable ''d'' will be equal to 20.


    Because Expression trees are data structures, the code can be converted into a
    data structure by using LINQ syntax. To do this, you will have to add the Linq.Expressions
    namespace:


    using System.Linq;


    Then you would create the Expression tree like this:


    Expression:Func<int, int, int>> expression = (a,b) => a + b;


    The Lambda Expression is now changed into an Expression Tree, which looks like
    this: "Expression<X>," You won''t be able to execute the identifier expression
    because it now counts as a data structure.


    In Visual Studio (IDE), you can use the "ExpressionTreeVisualizer" to see the
    tree of the expression statement.'
