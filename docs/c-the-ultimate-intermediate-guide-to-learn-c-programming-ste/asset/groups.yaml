- md: "\n# CHAPTER 17:\n\n# ASYNCHRONOUS PROGRAMMING\n\nC# allows you to write asynchronous\
    \ code. Suppose you were working on a Windows program that downloads images. Clicking\
    \ the button and downloading the image would take more than 30 seconds, and your\
    \ program would be unresponsive if you tried downloading the image synchronously.\
    \ A better way would be asynchronous.\n\nWe are going to explore what this means\
    \ and how we can use it in our applications.\n\nContents\n\n- **Asynchronous Programming\
    \ using async and await***\n\nWe can use asynchronous programming by using two\
    \ keywords: async and await. Let's look at both.\n\n## Async\n\nIf we put the\
    \ keyword before a function when we declare it, that function become asynchronous.\
    \ This keyword activates resources of the .NET framework that allows us to create\
    \ an asynchronous framework. The function will be called asynchronous. Below is\
    \ the syntax:\n\n```csharp\npublic async void MyProcess()\n{\n}\n```\n\nThe function\
    \ above will be called asynchronously.\n\n## Await\n\nThe function that has \"\
    async\" before it must also have an \"await\" keyword inside. Its syntax is as\
    \ follows:\n\n```csharp\npublic async void MyProcess()\n{\n    // do the asynchronous\
    \ work\n    await Task.delay(5);\n}\n```\n\nThe function above will activate after\
    \ waiting for 5 seconds.\n\nThe code below downloads images asynchronously from\
    \ the web.\n\n## Example 1:\n\n```csharp\nprivate void button_Click(object sender,\
    \ EventArgs e)\n{\n    WebClient image = new WebClient();\n    byte[] imageData\
    \ = image.DownloadData(\"http://{urlOfTheImage}\");\n    this.imageView.Image\
    \ = Image.FromStream(new MemoryStream(imageData));\n}\n```\n\nYour application\
    \ will become unresponsive while the code executes, and that is not desirable.\
    \ We can fix this using async and await like this:\n\n## Example 2:\n\n```csharp\n\
    private async void button_Click(object sender, EventArgs e)\n{\n    WebClient\
    \ image = new WebClient();\n    byte[] imageData = await image.DownloadDataTaskAsync(\"\
    http://{urlOfTheImage}\");\n    this.imageView.Image = Image.FromStream(new MemoryStream(imageData));\n\
    }\n```\n\nIf you look at blocks of code, you will find three differences:\n\n\
    - Adding the async keyword before the function.\n- The await keyword creates the\
    \ image download method.\n- DownloadDataAsync has replaced the DownloadData method.\n\
    \n\"DownloadData\" method downloads data synchronously. When it's finished, it\
    \ returns control to the caller which makes the program unresponsive. \"DownloadDataAsync\"\
    \ returns the control and downloads asynchronously. The await method releases\
    \ the UI thread until download is complete. When the await keyword is encountered,\
    \ the function returns when a specified process completes, and the function continues\
    \ executing from where it stopped.\n\nNOTE: Asynchronous methods can return three\
    \ types of values.\n\n- Void: return nothing.\n- Task: It will perform one operation.\n\
    - Task<T>: Will return a task with a T type parameter.\n\n**Task:** A Task will\
    \ return no value (given it is void), while Task<int> will return an int type\
    \ element. We can call this a generic type.\n\n**Note:** An async method will\
    \ run synchronously if the await keyword is missing.\n\n## **Example 3:**\n\n\
    ```csharp\nusing System;\nusing System.IO;\nusing System.Threading.Tasks;\nclass\
    \ Program\n{\n    static void Main()\n    {\n        Task task = new Task(ProcessDataAsync());\n\
    \        task.Start();\n        task.Wait();\n        Console.ReadLine();\n  \
    \  }\n    static async void ProcessDataAsync()\n    {\n        Task<int> int =\
    \ await HandleFileAsync(@\"C:\\enable.txt\");\n        Console.WriteLine(\"Wait\
    \ \" + \"while I carry out something vital.\");\n        int x = await task;\n\
    \        Console.WriteLine(\"Count: \" + x);\n    }\n    static async Task<int>\
    \ HandleFileAsync(string file)\n    {\n        Console.WriteLine(\"HandleFile\
    \ enter\");\n        int count = 0;\n        using (StreamReader reader = new\
    \ StreamReader(file))\n        {\n            string v = await reader.ReadToEndAsync();\n\
    \            for (int i = 0; i < 10000; i++)\n            {\n                int\
    \ x = v.GetHashCode();\n                if (x == 0)\n                {\n     \
    \               count--;\n                }\n            }\n        }\n      \
    \  Console.WriteLine(\"HandleFile exit\");\n        return count;\n    }\n}\n\
    ```\n\n## **Output initial 3:**\n\nHandleFile enter\n\nPlease wait patiently while\
    \ I do something important.\n\n# Output final 3:\n\nHandleFile enter\n\nWait while\
    \ I carry out something vital.\n\nHandleFile exit\n\nCount: 1916146\n\nAfter the\
    \ main method, we created an instance of the ProcessDataAsync task method as an\
    \ argument. In the next line, we initiated the task with the \"task.Start(),\"\
    \ and then waited for it to finish with the \"task.Wait().\" The \"async\" signature\
    \ in the ProcessDataAsync tells us the method is asynchronous, which makes \"\
    await\" mandatory.\n\nThe first line inside the method calls the \"HandleFileAsync\"\
    \ method. This means control will be returned before the \"ProcessDataAsync\"\
    \ method. Then the second line is printed on the screen. The total computed result\
    \ is then assigned to the variable \"x,\" which prints on the screen.\n\nHandleFile\
    \ enter\n\nPlease wait patiently while I do something important.\n\nThe first\
    \ line is from HandleFileAsync. It gets printed to the screen, and then control\
    \ returns back to the \"ProcessDataAsync\" method. Then the second line is printed\
    \ on the screen. The total computed result is then assigned to the variable \"\
    x,\"\n\nLet's turn attention to the second HandleFileAsync method. After the first\
    \ HandleFileAsync, we initialize the string to count. We then use the reader to\
    \ count....,,,,,,, the the the the value, HandleFile exit.\n\n# CHAPTER 18:\n\n\
    # GAME DEVELOPMENT\n\nWe are going to explore how we can use C# in our applications.\n"
