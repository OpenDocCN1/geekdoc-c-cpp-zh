    \    XElement cToy = sampleXML.Descendants(\"Toy\").Where(c=> c.Attribute(\"ID\"\
    ).Value.Equals(id));\n    cToy.Remove();\n    sampleXML.Save(file);\n} catch (Exception\
    \ e) {\n    MessageBox.Show(e.Message);\n}\n```\n\n文件加载后，代码将遍历子元素寻找匹配项，当找到匹配项时，使用\
    \ \"Remove\" 方法删除该子元素并保存结果文件。\n\n## 插入和更新 XML 数据\n\n向 XML 文件插入数据与从其提取数据没有太大区别。我们只需要一个与目标\
    \ XML 文件中的元素具有相同签名 \"Element\"。然后，我们使用 \"XDocument\" 对象将 \"Element\" 对象插入文件。\n\
    \n## 示例 3:\n\n```csharp\nprivate string file = \"SampleData.xml\";\nprivate void\
    \ InsertData(string name, string price)\ntry {\n    XDocument doc = XDocument.Load(file);\n\
    \    XElement newToy = new XElement(\"Toy\", new XElement(\"Name\", name), new\
