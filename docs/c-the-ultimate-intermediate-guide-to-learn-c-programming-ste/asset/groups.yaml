    \n## ArrayList\n\nArrayList containers store values of the same data type. Let's\
    \ look at an example of this. You define ArrayList the following way:\n\n```csharp\n\
    ArrayList variableName = new ArrayList();\n```\n\n\"VariableName\" is assigned\
    \ to the ArrayList so that we can use all kinds of methods on it. This is using\
    \ Add method to add an item to the ArrayList. We can access this element by its\
    \ index if we need. Here is an example of array lists:\n\n```csharp\nusing System;\n\
    using System.Collections;\nnamespace Demo\n{\n    class Program\n    {\n     \
    \   static void Main(string[] args)\n        {\n            // Defining ArrayList\n\
    \            ArrayList ar = new ArrayList();\n\n            // Adding elements\
    \ to the array list\n            ar.Add(10);\n            ar.Add(15);\n      \
    \      ar.Add(20);\n\n            // Displaying the elements of the array\n  \
    \          Console.WriteLine(\"The first element of the array is \" + ar[0]);\n\
    \            Console.WriteLine(\"The second element of the array is \" + ar[1]);\n\
    \            Console.WriteLine(\"The third element of the array is \" + ar[2]);\n\
    \n            Console.Read();\n        }\n    }\n}\n```\n\nThis is what we are\
    \ going to see in the console:\n\nThe first element of the array is 10\n\nThe\
    \ second element of the array is 15\n\nThe third element of the array is 20\n\n\
    We can add all kinds of types to ArrayList. This program shows the way to use\
