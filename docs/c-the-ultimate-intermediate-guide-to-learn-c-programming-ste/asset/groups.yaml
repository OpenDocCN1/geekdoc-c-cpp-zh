  - '[PAGE 24]


    # CHAPTER 6:


    # COLLECTIONS


    Collections, collections are special classes working with special data classes
    ("Collection in C#").


    For instance, collections have a size() method inside an ArrayList that can get
    an array''s size without cumbersome code.


    C# has the following collection classes:


    +   - ArrayList - Arrays are used to store continuous values of the same data
    type.

    - SortedList - These are sequences that permit the insertion of constant time
    and delete operations. Operations can be done in both directions.

    - Stacks - This is a type designed for LIFO (last-in-first-out) situation, where
    items are inserted and extracted from one end of the container.

    - Queues - This is a type designed for FIFO (first-in-first-out) situation, where
    items are inserted on one side and extracted on the other.


    Let''s look at one more detail. It''s important to have a clear understanding
    of these concepts.


    Arrays are great because we can make them small or big as we need them to be.
    Because the memory used is contiguous, we know that arrays are efficient and fragile.
    But arrays are not dynamic. With the computing powers of today, programmers have
    to get creative to overcome this. To be a strength it means arrays wouldn''t grow
    out of control and over system memory. Computers back then did not have the memory
    available for today, so arrays played an important role in preventing processes
    from hanging.


    These days, programmers can write more dynamic programs that can shrink and expand
    as the needs arise because computers have more memory, and they are stronger.
    This is good for programmers to write more exciting things as there is no room
    for them to do (without being irresponsible, of course).


    This is why list becomes more popular nowadays programmers are looking for flexibility
    and power. If you have worked with languages like Python, this is not new to you.
    List is a flexible array.


    Lists can grow to whatever size is needed at any given time as things change.
    Lists don''t have a defined length. They can always be added to. They are like
    fossils, there was a time when they weren''t any. They have now developed over
    millions of years, and they are alive today and that will be alive in the future.
    They will be added to that list as long as there is no Earth. How fossils can
    be added to the list is not limited by any inherent size. The size is only as
    long as the Earth existed, and with it life, we would have fossils being added.
    The principle applies to all.


    Lists also come with fully-fledged functions. To use lists and take advantage
    of all their features, you will need to import the System.Collections namespace.


    When using lists, you will have to declare the list and use it, like this:


    ```

    List<type> name = new List<type>();

    ```


    You add items using the Add method, like this:


    ```

    myList.Add(2);

    myList.Add(5);

    myList.Add(8);

    ```


    You can also add arrays to the lists using the AddRange method like this:


    ```

    myList.AddRange(arrayName);

    ```


    ```

    myList.remove(5); // will remove the 5, by value

    myList.removeAt(0); // will remove the 2, by index

    ```


    // only 8 is left within the list. Notice we are working on the list we made in
    the previous example.'
