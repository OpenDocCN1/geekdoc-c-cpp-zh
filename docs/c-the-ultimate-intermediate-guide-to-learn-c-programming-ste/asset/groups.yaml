    \nImagine you had organized data in a hierarchical manner, and all this data looked\
    \ like 'files' and 'folders.' As you know, files can go into folders, and folders\
    \ can go into other folders and so on. You will want to have something without\
    \ replicating unnecessary code. A composite pattern can help with that.\n\n##\
    \ How it works:\n\nThere are two classes: a File class and a Folder class. Think\
    \ of them as an item and group, toys and box, or clothing and bag. It is a combination\
    \ of classes in which one is made of types. Both might have similar traits, methods,\
    \ and fields, you might need to write twice the code you would normally: one for\
    \ the items and the other for groupings. To solve this, you need to extend a common\
    \ superclass or abstract class. Without a component, there needs to be one important\
    \ distinction: the Group should be the collection of the superclass. They emanate\
    \ from a common superclass, the Group class has a collection of groups or items.\n\
    \nSo if you have two classes, Clothing and Bag, a Bag contains clothes, but it\
    \ can also contain bags inside. They similar qualities, like the name and description.\
    \ You can use a Composite Pattern where both clothing and bags extend code for\
    \ each instance if share so many similarities. You can apply a Composite Pattern\
    \ where both clothing and bags extend a superclass. The bag was tweaked so it\
    \ can accept either bags or clothes.\n\nThe important thing is that item/container\
    \ classes extend a common superclass or component. The container class will contain\
    \ a list of items, which can be items or containers.\n\nDepending on your language,\
    \ the superclass can be an abstract class, interface, or other kinds of abstractions\
    \ available to the language. The pseudocode of the composite pattern is included\
    \ in the Archive, so if you need to use it a different language, it will help\
    \ you.\n\nNow, let's look at the Composite Pattern below: \n\n# The Composite\
    \ Pattern, in C#\n\n======================================================================================\n\
    \nHere is how the Composite Pattern looks in C#:\n\n```csharp\n/*\n// Component\
    \ is the superclass which File and Folder classes extend\n// You may define any\
    \ fields and methods shared by subclasses\n*/\nabstract class Component {\n  \
    \  // Insert any amount of fields and methods\n    // where necessary\n    string\
    \ field;\n    void someMethod();\n}\n\n// General Item Class (as File):\n// contains\
    \ all fields and methods defined at Component\nclass File : Component {\n}\n\n\
    // General Group Class (as Folder):\n// contains all fields and methods defined\
    \ at Component\n    // Also has:\n    // a List of Components, which can contain\
    \ either items or Groups\nclass Folder : Component {\n    List<Component> contents\
    \ = new List<Component>();\n}\n```\n\n# Implementing the Composite Pattern\n\n\
    Using an IDE of your choice to implement the code. You can use online ones like\
    \ codechef.com, rextester.com, ideone.com, or codepag.org.\n\n======================================================================================\n\
    \nWe are going to consider a situation where having a Composite Pattern is a great\
