    # Basic Unit Collision


    Unit collision is one of the most important features of game programming. Everything
    in a game is presented as a texture. Every the game menu is a texture. If you
    want to check things like mouse hover events, you have to use unit collision.


    Unit collisions come in many forms. The simplified form is a bounding box collision.
    This is the one we are going to focus on. Bounding is on the idea that all sprites
    can be rectangles with width and height. If the lines of one rectangle intersect
    with another we can conclude they are colliding.


    Remember, this is the least-intensive unit collision; it''s not the best. For
    instance, if you have something in your game to check for collisions, like bullets,
    you will need a unit that is more refined. For our purposes, this is the best
    way to teach the basics of unit collision and detection.


    Rectangles in XNA have an in-built collision detection, which means you don''t
    have to worry about writing it. If you prefer, you can try your hand at writing
    one. We are going to cover the catered XAN rectangle collision detection.


    The first thing we define is rectangles of the two entities:


    ```

    Rectangle(X_position, Y_position, Width, Height);

    You could create two:

    ```


    ```

    Rectangle playerRect = new Rectangle(playerPosition.X, playerPosition.Y, playerTexture.Width,
    playerTexture.Height);

    and do so for the opponent:

    ```


    ```

    Rectangle enemyRect = new Rectangle(enemyPosition.X, enemyPosition.Y, enemyTexture.Width,
    enemyTexture.Height);

    ```


    ```

    Then write an if statement for the collision:

    if (playerRect.collides(enemyRect)) {

    // collision detection logic goes within

    }

    ```'
