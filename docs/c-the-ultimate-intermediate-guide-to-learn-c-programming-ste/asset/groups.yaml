  - "[PAGE 20]\n\n# CHAPTER 4:\n\n# ADVANCED DECISION STATEMENTS AND FLOW CONTROL\n\
    \n# The != Operator\n\nThe != operator is used to check if two given operands\
    \ are NOT equal. The != operator can also be used to negate conditions. It is\
    \ used to execute code when the opposite of a condition is true.\n\nThe syntax\
    \ would like this:\n\n```\nbool levelComplete = (score >= neededToPass);\n{\n\
    \    Console.WriteLine(\"You haven't won yet. Keep trying...\");\n}\n```\n\nYou\
    \ can use != with other operators, but you should keep in mind that != has higher\
    \ precedence than relational operators. This means it is checked before the others.\
    \ If you want a relational operator to be checked before negation, you will need\
    \ to put the relational conditionals in parentheses just like you would in math,\
    \ like this:\n\n```\nif((score <= oddScore))\n{\n    // that's the same as:\n\
    \    if(score <= oddScore)\n}\n```\n\nIn programming, there are many ways of doing\
    \ the same thing. You just have to choose the most simple and appropriate. One\
    \ shouldn't complicate code unnecessarily.\n\n# Conditional Operators: && & ||\n\
    \nYour conditionals can be used to track more than one thing. Let's say you are\
    \ making a game where a player controls an avatar through tough terrain. The player\
    \ loses when the avatar's energy is gone, or food is gone. If they run out of\
    \ energy, they can always have food as long as it's available. If they run out\
    \ of time, they can live off their energy until they hit the next stage. The only\
    \ way to lose is if there is no energy and no food. So, you will need a conditional\
    \ that checks both conditions and ends the game when both conditions are met.\n\
    \nTo do this, you will need to use the AND operator (&&).\n\nThis is where we\
    \ use conditional operators. The AND operator (&&), and the OR operator (||),\
    \ as mentioned, and these are what we use to check several elements at a time:\n\
    \n```\nint energy = 50;\nint time = 40;\nif(time < 0 || energy < 0)\n{\n    Console.WriteLine(\"\
    You lost. Try again!\");\n}\n```\n\nThis means if food is less or equal to zero\
    \ and energy is less than or equal to zero, the game should end.\n\nThe || only\
    \ needs one condition to be true. It would work better in a game where you can\
    \ die in two ways. Let's imagine our avatar when their energy is zero or they\
    \ run out of time (in this instance, we don't have the food variable). Only one\
    \ of these needs to be true for the game to end, not both of them.\n\nYou should\
    \ know that by default, computers do \"lazy evaluations,\" which means they will\
    \ not check the condition if the first one is. The only time they will check the\
    \ second condition (energy) is if the first one (time) is not met."
- md: "\nIt is possible to put multiple conditional operations together. You can get\
    \ very creative by using parentheses. But always, when you make these conditions,\
    \ remember to make it simple for others to read and never make things too complicated\
    \ for their purpose.\n\n## CHAPTER 5:\n## REFLECTION\n\nThe ability of C# to retrieve\
    \ information from sections of code during runtime is called reflection. You would\
    \ use reflection if you wanted to know more information about a method (\"C# Reflection\"\
    ). We can do more than that: we can also create objects and invoke methods during\
    \ runtime through reflections.\n\nIn the example, we use \"Type\" datatype to\
    \ get information about a class.\n\n## Using the Type to get information on a\
    \ class\n\nHere's what we have done:\n\nUsing \"Type\", we get information about\
    \ the 'player1' object.\n\nWe were able to get the class of the object.\n\nBelow\
    \ is what we would see as the output:\n\n# The object is of Type Demo.Player\n\
    \n## MethodInfo\n\nThe following reflection method is used to get information\
    \ about a method from a class.\n\nBelow is an example:\n\nThe next program showcases\
    \ the way to use MethodInfo.\n\n```csharp\nusing System;\nusing System.IO;\nusing\
    \ System.Reflection;\nnamespace Demo\n{\n    class Player\n    {\n        // Defining\
    \ the members\n        public int id;\n        public string name;\n        public\
    \ void Display()\n        {\n            Console.WriteLine(\"The ID is \" + id);\n\
    \            Console.WriteLine(\"The player name is \" + name);\n        }\n \
    \   }\n\n    class Program\n    {\n        // The main function\n        static\
    \ void Main(string[] args)\n        {\n            Player player1 = new Player();\n\
    \            // Trying to get the type of object\n            Type myTypeObj =\
    \ player1.GetType();\n            Console.WriteLine(\"The object is of \" + myTypeObj);\n\
    \            // Using reflection to get information about the Display method\n\
    \            MethodInfo myMethodInfo = myTypeObj.GetMethod(\"Display\");\n   \
    \         Console.WriteLine(\"Is the method a static method?\" + myMethodInfo.IsStatic);\n\
    \            Console.Read();\n        }\n    }\n}\n```\n\nThe program will give\
    \ us the following results:\n\nThe object is of Type Demo.Player\n\nIs the method\
    \ a static method? False.\n\n## CHAPTER 6:\n## COLLECTIONS\n\nCollections, collections\
    \ are special classes working with special data classes (\"Collection in C#\"\
    ).\n\nFor instance, collections have a size() method inside an ArrayList that\
