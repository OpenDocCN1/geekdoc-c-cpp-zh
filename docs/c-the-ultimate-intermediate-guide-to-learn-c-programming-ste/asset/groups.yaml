    \ Collision\n- Artificial Intelligence\n\n## CONCLUSION\n\n## REFERENCES\n\n##\
    \ CHAPTER 1: INTRODUCTION - SETUP AND HISTORY OF C#\n\nMicrosoft announced C#\
    \ in 2000 and launched the language in 2002. C# was supposed to be called \"Cool,\"\
    \ which stands for \"C-like object-oriented programming.\" C# is a C-based programming\
    \ language. It is pronounced C-sharp; the hash symbol was meant to signify that\
    \ C# is the later iteration of C++.\n\nBelow is the timeline of C#, detailing\
    \ what has been added to each version (\"C# Introduction\"):\n\n**Jan 2002**\n\
    C# 1.0\n- Typesafe programming language\n- Modern\n- OOP (Object Oriented Programming)\n\
    \n**Nov 2005**\nC# 2005\n- Generics\n- Partial classes\n- Anonymous types\n- Iterators\n\
    - Nullable types\n- Static classes\n\n**Nov 2007**\nC# 2007\n- Improvements of\
    \ previous additions\n- Extensions methods\n- Expression trees\n\n**April 2010**\n\
    C# 4.0\n- Dynamic binding\n- Unique naming arguments (optional)\n\n**Aug 2012**\n\
    C# 5.0\n- Asynchronous Programming (allowing programmers to create multithreaded\
    \ applications)\n\n**July 2015**\nC# 6.0\n- Exception filters\n- String interpolation\n\
    - Namespaces\n\n**Aug 2017**\nC# 7.0\n- Out variables\n- Tuples and deconstruction\n\
    - Pattern matching\n- Local functions\n- Expression-bodied members\n- Ref locals\n\
    \n**September 2019**\nC# 8.0\n- Readonly members\n- Default interface methods\n\
    - Pattern matching enhancements\n- Switch expressions\n- Positional patterns\n\
    - Using declarations\n- Static local functions\n- Disposable structs\n- Nullable\
    \ reference types\n- Asynchronous streams\n- Indices and ranges\n- Nullcoalescing\
    \ assignment\n- Unmanaged types\n- Stackalloc\n- Interpolated strings\n\nRunning\
    \ C# on Windows: You are probably familiar with all the things we are going to\
    \ cover in this chapter, but it is always a good idea to work with C# on Windows,\
    \ as C# is a Microsoft language and the Windows operating system is optimized\
    \ for it.\n\nMac Users: You can work with C# on Mac. Microsoft has released a\
    \ Visual Studio for Mac, but the experience of working with C# on Windows is better\
    \ using tools like VirtualBox.\n\n1 Object-Oriented Language: Everything in C#\
    \ is object-oriented except primitive data types and building functions. If you\
    \ have worked with other object-oriented languages, you have seen this. C# is\
    \ easily maintainable.\n\n2 Strongly Typed: As you would expect from a programming\
    \ language, C# is strongly typed. Unlike Javascript, you have to specify data\
    \ types in your program. This significantly reduces runtime error. The benefit\
    \ of type safety becomes more apparent as you work with bigger applications.\n\
    \n3 Automatic Garbage Collection: C# regularly runs garbage collection, which\
    \ removes unused objects and pointers, refreshing memory. The .NET framework runs\
    \ this task. You do not have to do these cumbersome tasks yourself; saves you\
    \ time and allows you to focus on your functionality.\n\n4 Easy to Learn: C# is\
    \ a high-level programming language, which makes it easier to learn. Unlike low-level\
    \ programming languages like C and C++, many of the tasks you would have to perform\
    \ – like memory management and pointers – are done automatically. This makes your\
    \ code lot more concise and focused. Something that takes ten lines of code in\
    \ C#\n\n5 Application Range: C# is at the core of Microsoft's ecosystems. Many\
    \ of its technologies run on it. Windows C#, ASP.NET for its backend, and Windows\
    \ Forms and Windows Presentation Framework run on C#. If you are building something\
    \ to run on Windows and want it to run, C# is the best choice. There are other\
    \ ways to write programs that will run on Windows, but performance will be the\
    \ same unless you go the extra mile to optimize your program. From web development,\
    \ to applications, operating systems and game engines, C# can do plenty.\n\n6\
    \ Part of Visual Studio: Visual Studio is one of the most used IDEs globally,\
    \ and C# is the part of Visual Studio that highlights the importance and power\
    \ of the language.\n\n7 Huge Community: When working with a program, it is always\
    \ a big help when the development community for it is larger. This means if problems\
    \ arise, it is more likely that someone has encountered that problem, logged it,\
    \ and found a solution for it. As a result, you will not be stuck for long, and\
    \ you have plenty free support. C# has the 4th largest community on Stack Overflow.\
    \ What's also interesting that Stack Overflow is written in C#.\n\nEnvironment\
    \ Setup:\n\nHere is what we talked about in the first book. When working with\
    \ C#, it is best to do it on a Windows machine with the latest .NET framework.\
    \ When you install Visual Studio, all the files and frameworks you need to develop\
    \ in C# will be loaded to your system. Visual Studio is the go-to IDE for C#.\
    \ You can download the latest Visual Studio here. You should see this when you.\n\
    \n![](img/46e1be02fba72d093773b160a10368bf_7_0.png)\n\nDownloads:\n\nYou will\
    \ find Visual Studio in three versions: the Community version, which is free,\
    \ Professional, and Enterprise versions which are paid. The community version\
    \ requires you to have a Microsoft account. If you are on a Windows machine, you\
    \ probably have one already. If you don't have one, it is easy to create, and\
    \ it is free. The installation process is just like downloading any other program.\
    \ It does not require anything.\n\nRunning Your First Program:\n\nFollow these\
    \ steps to run your C# program.\n\n1. Open Visual Studio on the start menu or\
    \ search for it in the Windows search box (“Visual Studio”)\n"
