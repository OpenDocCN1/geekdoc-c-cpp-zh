    \ cities = {\"Frankfurt\", \"New York\", \"Cardiff\", \"Sydney\", \"Toronto\"\
    \ };\n```\n\nThe string array contains the names of cities. A collection like\
    \ this is called a local sequence because all the items in it are in the local\
    \ memory of the system.\n\n# Query Operators\n\nQuery operators take LINQ sequences\
    \ as input, transform, and return the transformed sequence as output. The Enumerable\
    \ class of the System.Linq namespace has 40 query operators. Let's look at the\
    \ most used LINQ operators.\n\n# Where Operator\n\nThe \"where\" operator filters\
    \ a sequence based on a set of conditions. For instance, you want to get a list\
    \ of cities in the array where the length of characters is equal or greater than\
    \ 8. Here is an example of that below.\n\n# Example 1:\n\n# Output:\n\nFrankfurt\n\
    \nNew York\n\nThe LINQ query sequence is similar to an SQL query. We have illustrated\
    \ this above by fetching cities lists that are eight characters or longer. \"\
    New York\" makes it cut because spaces count as characters.\n\t\t\tThis LINQ syntax\
    \ is often referred to as the query syntax because of its similarity to an SQL\
    \ query syntax. There is another way of executing LINQ queries using Lambda Expressions.\
    \ It is called fluent syntax. The example below illustrates it:"
- md: "\n## Example 2:\n\n```csharp\nusing System;\nusing System.Collections;\nusing\
    \ System.Collections.Generic;\nusing System.Linq;\nnamespace MyCSharpApplication\n\
    {\n    class Program\n    {\n        public static void Main()\n        {\n  \
    \          string[] cities = { \"Frankfurt\", \"New York\", \"Cardiff\", \"Sydney\"\
    , \"Toronto\"};\n            List<string> citieswithlength = cities.Where(c =>\
    \ c.Length >= 8).ToList();\n            foreach(string c in citieswithlength)\n\
    \            {\n                Console.WriteLine(c);\n            }\n       \
    \ }\n    }\n}\n```\n\nJust like SQL, you can use logical operators with comparison\
    \ operators in LINQ. For instance, you might want to get a list of cities that\
    \ have more than six characters and have the letter \"o\" in their names. The\
    \ AND operators will help you achieve this, as shown below.\n\n## Example 3:\n\
    \n```csharp\nusing System;\nusing System.Collections;\nusing System.Collections.Generic;\n\
    using System.Linq;\nnamespace MyCSharpApplication\n{\n    class Program\n    {\n\
    \        public static void Main()\n        {\n            string[] cities = {\
