    is about them. Textures allow you to make character animations and graph representations
    of items in your game.


    Textures can be imported through the content pipeline. They can then be imported
    into the LoadContent appropriate methods. This is done after they are initialized
    with the Initialize method.


    A 2D sprite is initialized below:


    ```

    private Texture2D myTexture;

    ```


    A SpriteBatch object has to be created in order to draw all your textures, so
    this should be earlier. Usually, the standard template had already created SpriteBatch
    when you started your game project.


    You write the following code in the LoadContent method:


    ```

    myTexture = Content.Load<Texture2D}("textureName");

    ```


    When finished, you draw the sprite in the Draw() method.


    You begin with the drawing process like:


    ```

    spriteBatch.Begin();

    ```


    Then you draw the sprite:


    ```

    spriteBatch.Draw(myTexture, Vector2(0, 0), Color.White);

    ```


    Vector2 gives you the x and y coordinates to draw the sprite at. Starting at the
    top left of the sprite. Moving to the right and down are bigger; those the left
    and up are smaller. Color. White gives you draw your texture a tint. The sprite
    is also loaded with the default coloration, as you have specified. Without it,
    your sprite would have a different color.


    The SpriteBatch process is ended like:


    ```

    spriteBatch.End();

    ```


    You can run the game to see if your sprite has loaded. It should load on top of
    your default Cornflower Blue. If that was successful, congrats! You now understand
    how to load images into the game. It is an extremely useful skill to have.


    # Taking Information from Keyboard and Mouse


    We are going to look how the keyboard and mouse input work. MonoGame has support
    for all kinds of input like gamepads and touchscreens, but for our purpose, it
    would be much simpler if we used the tools you already have access to. It is one
    of the best places to start.


    XNA and MonoGame have simplified working with input. Input is based on the state
    of given peripherals: keyboard, mouse, game. The logic is in the update function
    after initialization. Assume all in this section occurs in the Update function.


    To work with the keyboard, you need to create a KeyboardState and get the information
    from the keyboard. Because the Update method runs continuously, the information
    will always be collected.


    You will need to create a KeyboardState object. You can call it when you want,
    but get the current state, you will need to use the GetState method of the Keyboard
    class.


    ```

    KeyboardState state = KeyboardState.GetState();

    ```


    Here''s how you check if a key is pressed. Let''s say every sprite has an X and
    Y coordinate stored as a 2D vector, like:


    ```

    Vector2 spritePosition = Vector2.Zero;

    ```


    The position will be drawn with Draw(). Its position will be updated by the update()
    method. If you wanted to move the sprite to the corresponding position when a
    key is pressed, you write IsKeyDown checks. When the key is down, the position
    changed. Keys are stored with an enumeration in the Keyspace, there is no mapping
    to worry about


    We would put the following logic in the Update method:


    ```

    if (state.IsKeyDown(Keys.W))

    spritePosition.Y -= 5;

    ```


    ```

    if (state.IsKeyDown(Keys.A))

