    \ for Mac, but the experience of working with C# on a Windows laptop is better.\
    \ It helps that you can run Windows OS on Mac using tools like VirtualBox.\n\n\
    # 1. Object-Oriented Language\n\nEverything in C# is an object except primitive\
    \ data types. Objects as have properties and building functions. If you have worked\
    \ with other object-oriented languages, you have seen this. We are going to see\
    \ more of this in the upcoming chapters. C# is easily maintainable and can be\
    \ object-oriented.\n\n# 2. Strongly Typed\n\nAs you would expect from a programming\
    \ language based-off, C# is strongly typed. Meaning, unlike Javascript, you have\
    \ to specify data types in your program. This significantly reduces run-time error.\
    \ This is referred as type safety. The benefit of type safety becomes more apparent\
    \ as you work with bigger applications.\n\n# 3. Automatic Garbage Collection\n\
    \nC# regularly runs garbage collection, which removes unused objects and dangling\
    \ pointers, refreshing memory. The .NET framework runs this task. You do not have\
    \ to do these cumbersome tasks yourself; saves you time and allows you to focus\
    \ on your applications' functionality."
  - '[PAGE 7]


    # 4. Easy to Learn


    C# is a high-level programming language, which makes it easier to learn. Unlike
    low-level programming languages like C and C++, many of the tasks you would have
    to perform – like memory management and pointers – are done automatically. This
    makes your code lot more concise and focused. Something that take ten lines of
    code in C#


    # 5. Application Range


    C# is at the core of Microsoft''s ecosystems. Many of its technologies run on
    it. Windows C#, ASP.NET C# for its backend, and Windows Form and Windows Presentation
    Framework also run on C#. If you are building something to run on Windows and
    want it to run, C# is the best choice. There are other ways to write programs
    that will run on Windows, but performance will be the same unless you go the extra
    mile to optimize your program. From web development, to applications, operating
    systems and game engines, C# can do plenty.


    # 6. Part of Visual Studio


    Visual Studio is one of the most used IDEs globally, and C# is the part of Visual
    Studio languages that highlights the importance and power of the language.


    # 7. Huge Community


    When working with a program, it is always a big help when the development community
    for it is larger. This means if problems arise, it is more likely that someone
    has encountered that problem, logged it, and found a solution for it. As result,
    you will not be stuck for long, and you have plenty free support. C# has the 4th
    largest community on Stack Overflow. What''s also interesting that Stack Overflow
    is written in C#.


    # Environment Setup


    Here is what we talked about in the first book. When working with C#, it is best
    to do it on a Windows machine with the latest .NET framework. When you install
    Visual Studio, all the files and frameworks you need to develop in C# will be
    loaded to your system. Visual Studio is the go-to IDE for C#. You can download
    the latest Visual Studio here. You should see this when you.


    ![](img/46e1be02fba72d093773b160a10368bf_7_0.png)


    # Downloads


    You will find Visual Studio in three versions: the Community version, which is
    free, Professional, and Enterprise versions, which are paid. The community version
    requires you to have a Microsoft account. If you are on a Windows machine, you
    probably have one already. If you don''t have one, it is easy to create, and it
    is free. The installation process is just like downloading any other program.
    It does not require anything.


    # Running Your First Program


    Follow these steps to run your C# program.


    +   1. Open Visual Studio on the start menu or search for it in the Windows search
    box (“Visual Studio”)'
