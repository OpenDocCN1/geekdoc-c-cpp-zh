    \ This is a type designed for FIFO (first-in-first-out) situation, where items\
    \ are inserted on one side and extracted on the other.\n\nLet's look at one more\
    \ detail. It's important to have a clear understanding of these concepts.\n\n\
    Arrays are great because we can make them small or big as we need them to be.\
    \ Because the memory used is contiguous, we know that arrays are efficient and\
