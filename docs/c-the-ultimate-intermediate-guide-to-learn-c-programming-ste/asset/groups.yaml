    # CHAPTER 1:


    # INTRODUCTION - SETUP AND HISTORY OF C#


    Microsoft announced C# in 2000 and launched the language in 2002. C# was supposed
    to be called "Cool," which stands for "C-like object-oriented programming." C#
    is a C-based programming language. It is pronounced C-sharp; the hash symbol was
    meant to signify that C# is the later iteration of C++.


    Below is the timeline of C#, detailing what has been added to each version ("C#
    Introduction"):


    Jan 2002


    C# 1.0


    +   - Typesafe programming language

    - Modern

    - OOP (Object Oriented Programming)


    Nov 2005


    C# 2005


    +   - Generics

    - Partial classes

    - Anonymous types

    - Iterators

    - Nullable types

    - Static classes


    Nov 2007


    C# 2007


    +   - Improvements of previous additions

    - Extensions methods

    - Expression trees

    - Partial methods


    April 2010


    C# 4.0.


    +   - Dynamic binding techniques

    - Unique naming and arguments (optional)


    Aug 2012


    C# 5.0


    +   - Asynchronous Programming (A huge addition allowing programmers to create
    multithreaded applications)

    - Attributes for caller info


    July 2015


    C# 6.0 (This includes this book includes this version and)


    +   - Exception filters

    - String interpolation

    - Namespaces including static type members

    - Compiler as a service


    Aug 2017'
