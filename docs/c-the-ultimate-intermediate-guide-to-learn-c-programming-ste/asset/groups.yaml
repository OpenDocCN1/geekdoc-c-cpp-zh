    # 第 15 章：\n\n# 观察者模式 (THE OBSERVER PATTERN)\n\n在某些情况下，你可能需要创建具有观察者（observer）和被观察者（observed）关系的类。换句话说，一个对象需要观察或监控另一个对象的功能。例如，你可以有一个类来收集你周围环境的数据：时间、天气、位置等。你可能还有另一个对象，需要提醒你附近所有的朋友天气情况，并提醒他们活动和计划。为了实现这一点，你需要使用观察者模式，因为一个对象需要观察其他对象来执行其主要功能。\n\
    \n其基本原理如下：\n\n观察者模式在开发者中非常流行，因为我们以描述的方式使用了这些功能。它包含主体（Subject）和观察者（Observer）。观察和作为对象是行为的描述，因此我们实现了\
    \ Observer 和 Subject 接口。这将允许类应用 Observer 和 Subject 行为。所有类都必须调用它们的接口。\n\n所有实现 `Observer`\
    \ 接口的类都将有一个观察的主体列表。你需要一个 `update` 方法，根据主体对象的相关变化来更新它们的数据。\n\n所有实现 `Subject` 接口的类都将有一个观察者对象列表，用于通知用户数据的更改。\n\
    \n当主体对象发生变化时，它将调用 `notify()` 方法，该方法会通知观察者列表。一旦观察者收到通知，它们就会调用 `update()` 方法，根据主体的最新更新来更新它们的数据。\n\
    \n在实现观察者模式时，你只需要考虑两件事：观察者的数量和主体的数量。我们将处理多观察者和多主体的场景以展示动态过程。\n\n# C# 中的观察者模式\n\n\
    下面是观察者模式在 C# 中的外观。你将看到两组类/接口对。我们将从 Observer 对开始。\n\n```csharp\n/*\n * 所有观察者类都实现了\
    \ Observer 抽象\n * 它可以：\n * - 根据主体更新对象数据\n * - 观察者类可能需要一个主体列表以便进行访问\n * - (在 Observer\
    \ 类上添加)\n */\ninterface Observer {\n    void update();\n    // 输入任何其他方法\n}\n\n\
    /*\n * 观察者类拥有：\n * - update() 方法的可运行版本\n * - 任意数量的额外字段和方法\n */\nclass ObservingClass\
    \ : Observer {\n    // 输入其他字段；\n    // 输入：(可选)\n    // 输出：无\n    // 效果：响应主体更新数据\n\
    \    void update() {\n        // 在此处对观察者的关键字段进行任何更改\n    }\n}\n```\n\n下面是主体的类/接口对。\n\
    \n```csharp\n// 所有主体类都实现了 Subject 抽象\n// 它包含\n// - 通知观察者\n// - 在其更新列表中添加/删除观察者\n\
    // 主体类还需要一个观察者列表来更新\n// (在 Subject 类上添加)\ninterface Subject {\n    public void\
    \ notifyObservers();\n    public void addObs(Observer o);\n    public void deleteObs(Observer\
    \ o);\n    // 在此处输入任何其他方法\n}\n```\n\n```csharp\n// 主体类拥有：\n// - 一个用于通知的观察者列表\n\
    // - notifyObservers() 的运行版本\n// - 任意数量的额外字段和方法\n// 主体类还需要一个观察者列表来更新\n// (在 Subject\
    \ 上添加)\nclass SubjectClass {\n    // 输入任何关键字段。\n    private List<Observer> obs\
    \ = new List<Observer>();\n    // 输入：(可选)\n    // 输出：无\n    // 效果：根据列表中任何更改更新观察者\n\
    \npublic void notifyObservers() {\n    foreach (var o in obs) {\n        o.update();\n\
    \    }\n}\n\n// 添加/删除方法：\n// 输入：Observer\n// 输出：无\n// 效果：响应主体更新数据\npublic void\
    \ addObs(Observer o) {\n    obs.add(o);\n}\n\npublic void deleteObs(Observer o)\
    \ {\n    obs.remove(o);\n}\n```\n\n现在，我们详细实现观察者模式。\n\n# 实现观察者模式\n\n使用你选择的 IDE\
    \ 实现代码。你可以使用你在现实世界中可能会遇到的例子。在这个例子中，你是一个追踪专家。\n\n# 追踪 (Manhunt)\n\n想象你被 FBI 招募捕捉恐怖分子。你需要创建一个在分子附近时通知代理的原型。\n\
    \n# 第 1 步：识别主体\n\n在这个场景中，恐怖分子是主体，代理是观察者。\n\n# 第 2 步：设置 Observer 接口\n\n我们需要定义所有观察者都要实现的接口。\n\
    \n```csharp\ninterface Observer {\n    void update();\n}\n```\n\n# 第 3 步：实现主体类\n\
    \n主体类将管理观察者列表并通知它们更改。\n\n```csharp\nclass TerroristGroup {\n    private List<Observer>\
    \ observers = new List<Observer>();\n\n    public void addObserver(Observer o)\
    \ {\n        observers.add(o);\n    }\n\n    public void removeObserver(Observer\
    \ o) {\n        observers.remove(o);\n    }\n\n    public void notifyObservers()\
    \ {\n        foreach (Observer o in observers) {\n            o.update();\n  \
    \      }\n    }\n}\n```\n\n# 第 4 步：实现 Observer 类\n\n每个代理将实现 Observer 接口以响应通知。\n\
    \n```csharp\nclass Agent : Observer {\n    private string name;\n    public Agent(string\
    \ name) {\n        this.name = name;\n    }\n    public void update() {\n    \
    \    Console.WriteLine(\"代理 \" + name + \" 已警报：附近有恐怖!\");\n    }\n}\n```\n\n#\
    \ 第 5 步：运行模拟\n\n最后，我们将创建小组和代理，注册代理，并触发通知。\n\n```csharp\nTerroristGroup group =\
    \ new TerroristGroup();\nAgent agent1 = new Agent(\"Alpha\");\nAgent agent2 =\
    \ new Agent(\"Beta\");\n\ngroup.addObserver(agent1);\ngroup.addObserver(agent2);\n\
    \n// 模拟发现分子\ngroup.notifyObservers();\n```\n"
