  mdcn: "\n它是关于它们的。纹理允许你制作角色动画以及你游戏中物品的图表表示。\n\n纹理可以通过内容流水线导入。然后它们可以被导入到相应的 `LoadContent`\
    \ 方法中。这是在用 `Initialize` 方法进行初始化后完成。\n\n下面初始化了一个 2D 精灵图：\n\n```\nprivate Texture2D\
    \ myTexture;\n```\n\n为了绘制所有的纹理，必须创建一个 `SpriteBatch` 对象，因此这应该更早执行。通常情况下，在你开始游戏项目时，标准模板已经创建了\
    \ `SpriteBatch`。\n\n你在 `LoadContent` 方法中编写以下代码：\n\n```\nmyTexture = Content.Load<Texture2D>(\"\
    textureName\");\n```\n\n完成后，你在 `Draw()` 方法中绘制精灵图。\n\n你开始绘制过程如下：\n\n```\nspriteBatch.Begin();\n\
    ```\n\n然后你绘制精灵图：\n\n```\nspriteBatch.Draw(myTexture, new Vector2(0, 0), Color.White);\n\
    ```\n\n`Vector2` 为你提供了绘制精灵的 x 和 y 坐标。从精灵的左上角开始。向右和向下移动数值越大；向左和向上移动数值越小。`Color.White`\
    \ 为你绘制的纹理提供色调。精灵还加载了默认颜色，正如你指定的指定的。如果没有它，你的精灵图将会有不同的颜色。\n\n`SpriteBatch` 进程如下结束：\n\
    \n```\nspriteBatch.End();\n```\n\n你可以运行游戏来查看精灵图是否已加载。它应该加载在你默认的康乃花蓝（Cornflower\
    \ Blue）之上。如果成功，恭喜你！你现在理解了如何将图像加载到游戏中。这是一项非常有用的技能。\n\n## 从键盘和鼠标获取信息\n\n我们将查看键盘和鼠标输入是如何工作的。MonoGame\
    \ 支持各种输入，如游戏手柄和触摸屏，但对于我们的目的，如果使用你已经可以访问的工具将会要简单得多。这是最好的起点之一。\n\nXNA 和 MonoGame\
    \ 简化了输入处理工作。输入基于给定外设的状态：键盘、鼠标、游戏。逻辑位于初始化后的 `update` 函数中。假设本节的所有内容都发生在 `Update`\
    \ 函数中。\n\n要处理键盘，你需要创建一个 `KeyboardState` 并从键盘获取信息。由于 `Update` 方法持续运行，这些信息将始终被收集。\n\
    \n你需要创建一个 `KeyboardState` 对象。你可以在需要时调用它，但要获取当前状态，你需要使用 `Keyboard` 类的 `GetState`\
    \ 方法。\n\n```\nKeyboardState state = KeyboardState.GetState();\n```\n\n这里是如何检查按键是否被按下。假设每个精灵图都存储了一个\
    \ 2D 向量的 X 和 Y 坐标，例如：\n\n```\nVector2 spritePosition = Vector2.Zero;\n```\n\n\
    位置将通过 `Draw()` 绘制。它的位置将由 `update()` 方法更新。如果你想在按下键时将精灵移动到相应位置，你就编写 `IsKeyDown`\
    \ 检查。当键按下时，位置发生改变。按键存储在 `Keys` 命名空间的枚举中，不需要担心映射。\n\n我们会在 `Update` 方法中放入以下逻辑：\n\
    \n```csharp\nif (state.IsKeyDown(Keys.W))\n    spritePosition.Y -= 5;\n```\n\n\
    ```csharp\nif (state.IsKeyDown(Keys.A))\n    spritePosition.X -= 5;\nif (state.IsKeyDown(Keys.S))\n\
    \    spritePosition.Y += 5;\nif (state.IsKeyDown(Keys.D))\n    spritePosition.X\
    \ += 5;\n```\n\n在这个例中，A 让精灵向左移动，W 向上移动，S 向下移动，D 向右移动。由于 `Update()` 方法一直在运行，这些条件将不断被检查，这意味着游戏在按键按下时会立即做出响应。我们可以实现一个\
    \ Escape 键，在被按下时关闭游戏。\n\n```csharp\nExit();\n```\n\n调试并测试它。如果你导入的所有按键和纹理都按预期方式移动，就运行它。\n\
    \n让我们看看处理来自鼠标的输入。它与键盘输入有相似之处，因为一切都基于鼠标当前的状态。重用键盘逻辑并将其替换为以下代码：\n\n```csharp\nMouseState\
    \ state = Mouse.GetState();\n```\n\n绘制你的精灵的位置，通过将其绘制到向量 `SpritePosition` 让它随鼠标移动。使用鼠标返回的向量移动它：\n\
    \n```csharp\nspritePosition.X = state.X;\nspritePosition.Y = state.Y;\n```\n\n\
    它们将不会相互靠近。当你移动鼠标时，精灵图也应该移动。自己测试并调试程序。\n这比你刚开始时的输入要多。现在你看到了它们在基础层是如何工作的。知识可以很容易扩展到其他输入设备，如游戏手柄。\n\
    \n## 基础单元碰撞\n\n单元碰撞是游戏编程中最重要的功能之一。游戏中的一切都以纹理的形式呈现。每个游戏菜单都是一个纹理。如果你想检查诸如鼠标悬停事件，你必须使用单元碰撞。\n\
    \n单元碰撞有许多形式。简化的形式是边界框碰撞（bounding box collision）。这是我们将关注的。边界的概念是所有精灵图都可以具有宽度和高度的矩形。如果一个矩形的线条与另一个矩形相交，我们就可以得出它们正在碰撞的结论。\n\
    \n记住，这是消耗最低的单元碰撞；它不是最好的。例如，如果你的游戏中有东西需要检查碰撞（比如子弹），你需要一个更精细的单元。对于我们的目的，这是教授单元碰撞和检测基础知识的最佳方法。\n\
    \n## 人工智能\n\n（注：原文此处开始出现大量重复的段落，根据指令“一定不要重复输出原文”，此处仅翻译核心差异内容或按逻辑要求处理。由于原文后续是完全重复的碰撞检测描述，作为高级文档工程师，应忽略重复部分。）\n\
    \n单元碰撞是游戏编程中最重要的功能之一。游戏中的一切都以纹理的形式呈现。每个游戏菜单都是一个纹理。如果你想检查诸如鼠标悬停事件，你必须使用单元碰撞。\n\n\
    （省略后续重复内容）\n"
