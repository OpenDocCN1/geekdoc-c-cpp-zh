    namespace Demo\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            // Defining the ArrayList\n            ArrayList\
    \ ar = new ArrayList();\n\n            // Adding elements to the array list\n\
    \            ar.Add(10);\n            ar.Add(\"There\");\n            ar.Add(\"\
    World\");\n\n            // Displaying the elements of the array\n           \
    \ Console.WriteLine(\"The first element of the array is \" + ar[0]);\n       \
    \     Console.WriteLine(\"The second element of the array is \" + ar[1]);\n  \
    \          Console.WriteLine(\"The third element of the array is \" + ar[2]);\n\
    \n            Console.Read();\n        }\n    }\n}\n```\n\nThe output in the console\
    \ will be:\n\nThe first element of the array is Hi\n\nThe second element of the\
    \ array is There\n\nThe third element of the array is World\n\nThe ArrayList class\
    \ has many methods that can be used to manipulate data.\n\n## ArrayList Operations\n\
    \nThe section below summarizes the operations available for ArrayList.\n\n| Function\
    \ | Description |\n|---|---|\n| size | This property tells us the size of the\
    \ ArrayList |\n| Clear() | This function removes all elements in an ArrayList\
    \ |\n| Contains() | This method checks if an ArrayList contains a particular element\
    \ returns a Boolean value: True if it does and False if it doesn't. |\n| IndexOf()\
    \ | This method returns the index of the specified element in the ArrayList |\n\
    | Insert() | This method inserts a value/item in a particular index in the ArrayList\
    \ |\n| Remove() | This method removes an item from an ArrayList |\n| RemoveAt()\
    \ | This method will remove an item at a specified index |\n| Reverse() | This\
    \ method reverses elements in an ArrayList |\n| Sort() | This method sorts the\
    \ elements in an array alphabetically or in ascending order if they're numbers.\
    \ |\n| GetRange() | This method is used to extract an array and add it to an ArrayList\
    \ |\n\nLet's look at how each method briefly defined above works.\n\n## Size Function\n\
    \nThis property tells us the size of the ArrayList, as in the number of elements\
    \ in it. We are going to use the intuitive Count method to do this.\n\n## Using\
    \ count property\n\n```csharp\nusing System;\nusing System.Collections;\nnamespace\
    \ Demo\n{\n    class Program\n    {\n        // The main function\n        static\
