    list.Add(5);\nlist.Add(8);\n```\n\nYou can also add arrays to the lists using\
    \ the AddRange method like this:\n\n```csharp\nlist.AddRange(arrayName);\n```\n\
    \n```csharp\nlist.Remove(5); // will remove by value\nlist.RemoveAt(0); // will\
