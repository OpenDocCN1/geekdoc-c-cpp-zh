    \ the Select operator, the whole object would be extracted, but that is not what\
    \ we want. We want the names of people who meet those conditions. This is why\
    \ we used a Select operator and passed a Lambda Expression that got the name.\
    \ LINQs are vast topics that can fill an entire book. We will discuss the end\
    \ of the operators here.\n\n# Working with Other Data Types\n\nWhat makes LINQ\
    \ an attractive technology to work with is its compatibility with many data types.\
    \ You can use the same syntax to handle data from an external source, while other\
    \ query languages require a different syntax for each. For instance, SQL queries\
    \ for interacting with SQL server and Xquery for XML data types. In this section,\
    \ we will look at the relationship:\n\n# Contents\n\n+   - LINQ and SQL\n- LINQ\
    \ and Lambda Expressions\n\n# LINQ and SQL\n\nLINQ is the smarter alternative\
    \ to working with SQL data. You will hear the term \"LINQ to SQL,\" which demands\
    \ accessing an SQL database with LINQ. The way to do that is to map the target\
    \ database to LINQ.\n\n# Mapping LINQ to SQL\n\nMapping LINQ to SQL when .NET\
    \ recognizes a database as Objects(Classes). It is easy to do. You Open Visual\
    \ Studio, project in solution explorer. Click Add, then select New Item. Select\
    \ \"Data\" from \"Categories\" options, and select \"LINQ to SQL Classes\" from\
    \ the Templates on the left. You end up with a .dbml file that produces a Graphical\
    \ User Interface. The GUI has a part that allows you to drag and drop tables and\
    \ anywhere you can drop stored procedures. Select, drag and drop all essential\
    \ tables and databases.\n\n# Selecting Data:\n\nAs soon as we have our \"dbml\"\
    \ file and its \"DataContext,\" LINQ queries can use objects to communicate with\
    \ the databases. Here's an example below:\n\n# Example 1:\n\n```\npublic bool\
    \ checkUser(string name, string password)\nDBTOysDataContext sampleDB = new DBTOysDataContext();\n\
    var getter = from u in sampleDB.Users\n             where u.Username == name\n\
    \             && u.Password == password\nselect u;\n```"
