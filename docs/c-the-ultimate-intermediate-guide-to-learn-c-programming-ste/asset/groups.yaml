    # CHAPTER 18:


    # GAME DEVELOPMENT


    We are going to learn how we use our C# skills in game development. We will explore
    the basic aspects of game development and how we can work with C# to develop video
    games.


    Many people believe writing games is one of the best ways to learn programming.
    Games will teach you many things that are related to programming as a whole. You
    will encounter programming concepts you would not have any other way and it expands
    your thinking and logical reasoning.


    In 2004, Microsoft announced a game engine called XNA. Titles like Terraria were
    developed using this engine. XNA is now outdated. It has been integrated into
    another game engine called MonoGame, which is more popular and allows developers
    to develop across platforms, XNA only allowed you to develop for Microsoft. MonoGame
    has built games for Microsoft (Xbox), Sony (PlayStation), Apple (iPhone), and
    Google (Android).


    MonoGame is free and open-source. You can download it and make changes to the
    code, giving you greater autonomy over the software. You can find MonoGame easily
    online. There are many tutorials on MonoGame online, and we are going to explain
    the concepts in-depth, so you will have an easier time following.


    # Content Pipeline


    All games need content. The content pipeline is the method you use to feed your
    game content. The MonoGame content pipeline runs parallel with Visual Studio,
    providing you with a simple way of creating and importing content. For example,
    if you need to create a character, you will need to create a new Sprite in your
    content pipeline. If you need to import character art, you will use the content
    pipeline to do.


    # The Structure of a MonoGame Program


    The MonoGame project has few methods in the automatically created class. You will
    find Update, Initialize, LoadContent, and Unload among them. It''s important that
    you know how these work.


    All these are protected methods. You can override them with the new classes you
    created from the Game class. You can call LoadContent and UnloadContent from your
    newly created classes. It makes sense because it might be useful to get rid of
    specific game assets to do something more appropriate for your project. For instance,
    if an enemy dies and it is the last time it will be seen in the game, you would
    use an overridden UnloadContent to unload the asset from game, improving performance.


    The default classes are the most important to understand, so we will explore them
    below.


    Draw is used to draw a frame on the screen. It is used for determining logic.
    You''ll need to draw an independent draw function from the protected method and
    defined within the specifications of a relevant class. However, it''s important
    to understand how it functions in the context of the game.


    Initialize initializes your content. It is called after the Game and the GraphicsDevice
    objects are created and before the LoadContent method is called. You can use it
    if you want to initialize something after the game has started.


    LoadContent unloads all the game''s resources. These can be used at any time,
    for example if you don''t need a specific spirit anymore, as we talked earlier.
    The method can be called within the Game class or in a derived class. It is especially
    important to know when working with bigger games.


    Update your game. This method runs constantly and varies with your game''s logic.
    This includes things like artificial intelligence, unit collision, and more. It
    contains anything in your game that is happening. It is a very important part.


    All these are the five primary methods that are created when starting a new instance
    of a Game class. There are other protected Game class methods. These are the ones
    you need to know at this point.


    # Textures


    Textures refer to images that are used by the game to represent data. They can
    be constantly updated. Nothing'
