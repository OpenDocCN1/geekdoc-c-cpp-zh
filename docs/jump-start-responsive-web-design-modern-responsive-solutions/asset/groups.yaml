    \n2-11. 带视口的演示页面\n\n好多了！\n\n# 响应式设计的基础组件\n\n## 视口\n\n**Viewport**（Viewport）是计算机图形中的一个老术语，用于定义渲染用户在浏览器中看到的元素的（通常是矩形的）屏幕区域。当网页浏览限于桌面浏览器时，视口仍然存在但设计师很少更改。随着浏览器尺寸多样性的增加，HTML5\
