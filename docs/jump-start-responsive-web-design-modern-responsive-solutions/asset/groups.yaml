    \ page elements into the desired position. As the example was simple, it wasn't\
    \ too hard to achieve this, but as grids get more complex, especially nested grids,\
    \ floats quickly become messy, and the solutions to cope with aren't ideal.\n\n\
    The CSS Flexible Box (\"flexbox\") Layout Module is a recent part of the CSS spec\
    \ already enjoys good browser support. It was designed to provide a better and\
    \ more modern solution for this type of layout, offering you specific functionality\
    \ for the task.\n\nAfter an initial page restructure and learning new concepts,\
    \ you'll find that using flexbox for your page components will drastically simplify\
