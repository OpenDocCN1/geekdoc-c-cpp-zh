- md: "\nSo that's it, you're right? Unfortunately, no. Inspect one of the images\
    \ in your web inspector and you'll notice that all we're resizing a very large\
    \ image. Even though it looks small, the actual file is still large, adding a\
    \ lot of page weight. Look at the network requests: these five images nearly 4MB,\
    \ which is a lot of data for a mobile user to load. To make your images fully\
    \ responsive, you need to make sure the right file is served to the device.\n\n\
    ![](img/bd4041c3e441a42781fa04a5cb5b773b_123_0.png)\n\n## 5-5. Image sizes\n\n\
    ## The Right Image for the Right Device\n\nThere are two methods for handling\
    \ images responsive. One is srcset, an attribute to the img tag you already know,\
    \ and the other is the new HTML5 picture element. Both methods use media query\
    \ syntax to select the image most suited to the device capabilities, but srcset\
    \ allows the browser to make the final decision on what image to render, and picture\
    \ explicitly tells the browser which image to render. srcset will be all you need,\
    \ but for design heavy sites when you want more control over how a browser renders\
    \ image (e.g. cropping an image instead of resizing it) then the picture tag will\
    \ suit you better.\n\nMuch like the CSS rules loaded by your media queries, what\
    \ image sizes you use and support is up to you and your use case. The example\
    \ project is moderately optimized, but could be better. For example, we could\
    \ reduce the maximum size of images loaded on smaller screens. The queries can\
    \ take the same format as those outlined in Chapter 2.\n\nI created each of the\
    \ images needed for the design manually, giving them a width roughly matching\
    \ the maximum width image will be displayed at:\n\n- Small Image: 320px wide.\n\
    \n## Jump Start Responsive Web Design\n\n- Medium Image: 480px wide.\n- Large\
    \ Image: 768px wide.\n\nCreating different versions of images manually is tedious,\
    \ but gives you control over what gets shown in each image size. If you'd rather\
    \ automate the generation of these images, there are several options, such as:\n\
    \n- batch processing in an image editor like Photoshop or XnView (Windows).\n\
    - batch processing with a build tool such as Gulp.\n- using a plugin for your\
    \ CMS or site generator, which is likely a wrapper around the popular imagagick\
    \ or OptiPNG libraries.\n\n### srcset\n\nReplace the existing image element with\
    \ the following:\n\n```html\n<section class=\"tshow\">\n  <h3>show1-medium</h3>\n\
    \  <img src=\"../images/show1-medium.jpg\"\n       srcset=\"../images/show1-small.jpg\
    \ 320w,\n       ../images/show1-large.jpg 768w\"\n       sizes=\"(max-width: 768px)\
    \ 480px,\n            (max-width: 1800px) 320px, 768px\"\n       class=\"thumbnail\"\
    \ />\n  <p class=\"showdescription\">Lorem dolor sit amet, consectetur adipiscing\
    \ elit.</p>\n</section>\n```\n\n> Some Homework\n> This example replaces one image,\
    \ and to reduce repetition, I haven't included code for replacing the other four\
    \ images. You can find the code for the remaining images in the code archive if\
    \ you want to try replacing the others too. Keep the media queries the same and\
    \ replace the images with the appropriate files.\n\nThis requires breaking down,\
    \ and the layout we're using also adds complexity.\n\nThe first part of the element\
    \ is normal, as is the last class property, the second and third lines are the\
    \ new syntax. srcset is designed to allow the browser to make the best decisions\
    \ about what image to display based on information you provide it. Each pair in\
    \ the second line defines the images available and tells the browser width, appended\
    \ with a w. The third line defines the viewport sizes you want to load a particular\
    \ image, and what image to load.\n\nThe example above declares:\n\n- Up to a viewport\
    \ width of 768px, load an image of 480px width.\n- Between a viewport width of\
    \ 768 and 1800px, load an image of 320px width.\n- If no other rule applies, then\
    \ load an image of 768px.\n\nYou can be subtle with these declarations, for example:\n\
    \n```html\n<img src=\"../images/show1-medium.jpg\"\nsrcset=\"../images/show1-medium.jpg\
    \ 480w,\n../images/show1-small.jpg 320w,\n../images/show1-large.jpg 768w\"\nsizes=\"\
    (max-width: 768px) 90vw,\n(max-width:1800px) 24vw, 50vw\"\nclass=\"thumbnail\"\
    \ />\n```\n\nThis instead declares that at the different viewport sizes pick an\
    \ image that suits best certain viewport width (vw) size. For this design, they\
    \ are essentially the same, but it gives you an idea of how smart can let your\
    \ browser be. its worth noting that this smartwatch can actually cause confusion\
    \ when testing: I have frequently found myself wondering why the tag wasn't working\
    \ when I expected it to, only to realize that it was by the browser holding on\
    \ cached version of the images, or optimizing for a retina screen, and again caching\
    \ those images. To debug what's happening while figuring out your srcsets, I recommend\
    \ using incognito / private windows, double-checking your screen resolution, and\
    \ keeping developer tools open to see what files the browser\n\n## Jump Start\
    \ Responsive Web Design\n\n## The Right Image for the Right Device\n\n## srcset\n\
