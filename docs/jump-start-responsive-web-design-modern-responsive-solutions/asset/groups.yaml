    }\n```\n\n最后对于大屏幕和电视：\n\n```\n@media only screen and (min-width: 1800px) {\n \
    \ .show1 {\n    background: transparent url(\"../images/show1-large.jpg\")\n \
    \ 0 0 / cover-repeat;\n  }\n}\n```\n\n现在，为每个视频创建匹配的类和样式。这对于响应式非常棒！你可以在代码中找到。\n\
    \n# 可点击图像\n\n创建完全响应式视频的另一种解决方案是使用 `picture` 标签替换播放器，它在点击时加载播放器。\n\n首先，为每个展示将 `picture`\
