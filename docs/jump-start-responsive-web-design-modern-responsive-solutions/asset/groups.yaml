    # 启动响应式网页设计\n\n![bd4041c3e441a2781fa04a5cbb773b_48.png]\n\n# 移动优先\n\n在第 1 章中我引入了“移动优先”的概念。目前，页面可以在不同设备尺寸上运行，但并不是移动优先，因为“默认”样式（即不在媒体查询中的样式）实际上是为较大的设备设计的。所以让我们进行一些重排和重构，使设计移动优先。这不会涉及太多工作。\n\
