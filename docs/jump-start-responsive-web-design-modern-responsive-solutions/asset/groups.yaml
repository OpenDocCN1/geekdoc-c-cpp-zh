    3-8. The page as a grid


    You could set up all these columns and grids manually for each project, but it''s
    a much better idea to make something usable and reusable. We''re going to create
    a lot of new styles and changes to our HTML and CSS files now. Then I''ll show
    easier ways to achieve the same result. Sometimes it''s a good idea to learn the
    hard way before knowing how to make it easier.


    Set up the base styles for the columns and rows, and replace any existing matching
    classes:'
  - "[PAGE 69]\n\n# Better Responsive Structures with Grid Systems 57\n\n```\n.row,\n\
    .column {\n  box-sizing: border-box;\n}\n\nrow:before {\n  content: \" \";\n \
    \ display: table;\n}\n\nrow:after {\n  clear: both;\n}\n\ncolumn {\n  position:\
    \ relative;\n  float: left;\n}\n\n.column + .column {\n  margin-left: 1.6%;\n\
    }\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_69_0.png)\n\n# Using the Adjacent\
    \ Sibling Selector\n\n> The adjacent sibling selector (+) above is a useful CSS\
    \ trick that adds a margin only to the matching element following another matching\
    \ element. In our case, it means the first column won't have a left margin.\n\n\
    The first step is to define the width of one column, not forgetting the margin\
    \ between each column.\n\nA single column width is equal to 100 (as we're working\
    \ with percentages) minus the margin value, multiplied by the number of columns\
    \ minus 1 (you don't need a left margin in the first column), all divided by the\
    \ number of columns."
