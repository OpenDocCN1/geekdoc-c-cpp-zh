  mdcn: "\n\n所以就是这样，对吧？遗憾的是，并不是。在你的网页检查器中检查其中一张图片，你会发现我们只是在缩放一张很大的图片。尽管它看起来很小，但实际文件仍然很大，增加了大量的页面权重。查看网络请求：这五张图片几乎有\
    \ 4MB，对于移动用户加载来说，数据量太大了。要让你的图片完全响应式，你需要确保为设备提供了正确的文件。\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_123_0.png)\n\
    \n## 5-5. 图片尺寸\n\n## 为正确的设备选择正确的图片\n\n处理响应式图片有两种方法。一种是 `srcset`，你已经用过的 `img` 标签的属性，另一种是新的\
    \ HTML5 `picture` 元素。这两种方法都使用媒体查询语法来选择最适合设备能力的图像，但 `srcset` 允许浏览器对渲染哪张图像做出最终决定，而\
    \ `picture` 则显式地告诉浏览器渲染哪张图像。对于大多数情况，`srcset` 就足够了，但对于设计密集型网站，当你需要对浏览器渲染图像有更多控制权（例如裁剪图像而不是缩放它），`picture`\
    \ 标签会更适合你。\n\n就像媒体查询加载的 CSS 规则一样，你使用和支持的图片尺寸取决于你和你的场景。示例项目经过了中度优化，但还可以更好。例如，我们可以减少在较屏幕上加载的图片的最大尺寸。查询可以采用第2章概述的相同格式。\n\
    \n我手动创建了设计所需的每张图片，它们的宽度大致匹配将显示的最大宽度：\n\n- 小图片：320px 宽。\n\n## 快速上手响应式网页设计\n\n-\
    \ 中等图片：480px 宽。\n- 大图片：768px 宽。\n\n手动创建不同版本的图片是枯燥的，但它可以让你控制每个图片尺寸下显示的内容。如果你更愿意自动生成这些图片，有几种选择，例如：\n\
    \n- 在 Photoshop 或 XnView (Windows) 等图像编辑器中进行批量处理。\n- 使用 Gulp 等构建工具进行批量处理。\n- 为你的\
    \ CMS 或站点生成器使用插件，这些很可能是流行的 `imagagick` 或 `OptiPNG` 库的封装。\n\n### srcset\n\n将现有的图像元素替换为以下内容：\n\
    \n```html\n<section class=\"tshow\">\n  <h3>show1-medium</h3>\n  <img src=\"../images/show1-medium.jpg\"\
    \n       srcset=\"../images/show1-small.jpg 320w,\n       ../images/show1-large.jpg\
    \ 768w\"\n       sizes=\"(max-width: 768px) 480px,\n            (max-width: 1800px)\
    \ 320px, 768px\"\n       class=\"thumbnail\" />\n  <p class=\"showdescription\"\
    >Lorem dolor sit amet, consectetur adipiscing elit.</p>\n</section>\n```\n\n>\
    \ 课后作业\n> 这个示例替换了一张图片，为了减少重复，我没有包含替换其他四张图片的代码。如果你想尝试替换其他图片，可以在代码存档中找到剩余图片的代码。保持媒体查询不变，并用相应的文件替换图片。\n\
    \n这需要进行拆分，而且我们使用的布局也增加了复杂度。\n\n元素的第一个部分是正常的，最后一个类属性也是如此，第二行和第三行是新语法。`srcset` 设计用于允许浏览器根据你提供的信息对显示哪种图像做出最佳决定。第二行中的每一对都定义了可用图像，并告诉浏览器宽度（后跟\
    \ `w`）。第三行定义了你想要加载特定图片的视口尺寸，以及加载哪张图片。\n\n上面的示例声明了：\n\n- 当视口宽度为 768px 时，加载 480px\
    \ 的图片。\n- 当视口宽度在 768px 和 1800px 之间时，加载 320px 的图片。\n- 如果适用其他规则，加载 768px 的图片。\n\n\
    你可以使用这些声明这些不同的尺寸，例如：\n\n```html\n<img src=\"../images/show1-medium.jpg\"\n   \
    \    srcset=\"../images/show1-medium.jpg 480w,\n       ../images/show1-small.jpg\
    \ 320w,\n       ../images/show1-large.jpg 768w\"\n       sizes=\"(max-width: 768px)\
    \ 90vw,\n            (max-width:1800px) 50vw, 50vw\"\n       class=\"thumbnail\"\
    \ />\n```\n\n这声明了最适合的视口尺寸。对于这种设计，它们基本上是相同的，但它给了你关于浏览器如何智能处理的思路。这在测试时可能会导致困惑：我经常发现它没有按预期方式工作，直到我意识到是浏览器缓存了版本，或者再次缓存了图片。在调试你的\
    \ `srcset` 时，我建议使用无痕模式检查你的屏幕分辨率，并打开开发者工具查看浏览器的文件。\n\n"
