    \  width: 66%;\n  }\n}\n```\n\nBut this is a poor solution, and you'll lose track\
    \ of what class equals what size.\n\nYou could change the class applied to the\
    \ div with JavaScript, and in the past, this was a solution to the problem. But\
    \ instead, I'll show you some more modern (and better) options that will make\
    \ the principle of grids more useful for responsive design.\n\n# Flexbox\n\nWhile\
    \ the \"column method\" above isn't that hard to understand and implement, as\
    \ your layouts become more complex you can start to introduce a lot of nested\
