    # Device Orientation


    We''ve already seen how to detect and react to device orientation with media queries,
    but we could also react dynamically to device orientation. For example, we could
    switch a video file to a format more suitable for a landscape or portrait video.


    If you want to get more experimental, what about controlling playback of a video
    based on the orientation of a device? For example, if a user tilts their phone
    in one direction, we could pause the video, and vice versa.


    For this example, we''ll create a new, simplified version of the page that''s
    purely for playing one video.


