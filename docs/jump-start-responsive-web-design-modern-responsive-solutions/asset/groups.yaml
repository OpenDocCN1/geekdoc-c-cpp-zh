    +   - minimum-scale: the minimum zoom level, or how much the user can zoom out.

    - maximum-scale: the maximum zoom level, or how much the user can zoom in.

    - user-scalable=no: disables zooming. While this has a limited number of cases,
    it significantly reduces the accessibility of your page.


    # # Any Queries?


    The selective nature of media queries makes them an essential tool in your responsive
    toolbox, and in this chapter, we''ve learned how to create and use them.


    Every modern browser now supports them, and they offer the potential to target
    any specific environments you need to design for.


    In coming chapters, we''ll leverage the responsive foundation that media queries
    and the viewport offer to add polish and shine to our responsive designs.'
  - '[PAGE 59]


    # Chapter

    3


    # Better Responsive Structures with Grid

    Systems


    So far, we''ve looked at the underlying principles of responsive design and the
    power of media queries to build page structures optimized for different devices.
    In this chapter, we''ll see how grid systems can supplement and even replace some
    of the techniques we''ve covered so far, providing more flexibility for how pages
    display across different devices.


    While flexibility in design is endless in theory, a common design ethic in print
    and digital design has been to use loose horizontal and vertical grids for element
    layout. They help break up sections of a page into logical areas that are easier
    to manage, and our brains like to see items in a composition in predictable lines.
    Composition in artwork and photos is a long-standing field of study, and many
    of its theories continue into web design.'
