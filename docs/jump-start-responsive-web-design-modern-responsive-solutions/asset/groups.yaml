  - "[PAGE 52]\n\n# 40 Jump Start Responsive Web Design\n\nMedia queries allow us\
    \ to set different styles for different screen sizes. So, if your desktop browser's\
    \ viewport is 1200px wide, any media query targeting that screen width will apply.\
    \ If you're on a mobile device with a viewport width of 320px wide, you'd expect\
    \ that any styles targeting a 320px viewport would kick into action. There's a\
    \ very big catch. By default, many devices, such as mobile phones and tablets,\
    \ act as if they have a wider screen than they really do.\n\nTo explain what's\
    \ going on, let's look at the iPhone, where this behavior originated. The first\
    \ iPhone had a screen/viewport width of 320px. However, most websites designed\
    \ for desktops were much wider than that. To avoid seeing the top left corner\
    \ of these sites on initial load, Apple developed the concept of a \"virtual viewport\"\
    \ or \"layout viewport\". Websites were loaded onto this much wider viewport,\
    \ which was then scaled down to fit the screen. Most sites got rendered on iPhones\
    \ with tiny text that you had to zoom to be able to read.\n\nApple's virtual viewport\
    \ was set at 980px, so as long as a website was no wider than that, the layout\
    \ would appear on screen. Any layouts wider than 980px would be partly hidden\
    \ to the right, requiring sideways scrolling. And that's still the case today.\
    \ The virtual viewport idea has been adopted by other device makers as well, though\
    \ the default width varies.\n\nWhen designing a responsive site, we really don't\
    \ want this default behavior on mobile devices. We want to know that the canvas\
    \ we're working with is the actual screen area of each device. Frankly, there's\
    \ a simple way to tell these devices not to behave in the default way. All we\
    \ need to do is add a special meta element to the head of each page. Here's a\
    \ typical example:\n\n```\n<meta name=\"viewport\" content=\"width=device-width,\n\
    \     initial-scale=1\">\n```\n\nAs a general rule, the line above is all you\
    \ need to ensure your media queries do what you expect on mobile devices. The\
    \ name attribute specifies that we're targeting the virtual viewport, and the\
    \ content attribute specifies how we want the device to behave. In the example\
    \ above, we're specifying that the virtual viewport should match the actual width\
    \ of the screen, and that there should be no zoom applied to the content."
