    \ Design 21\n\n# Chapter 2\n\n# The Building Blocks of Responsive Design\n\nThere\
    \ are two main building blocks at the heart of responsive web design: media queries\
    \ and viewports.\n\n**Media queries** represent the glue that joins a lot of other\
