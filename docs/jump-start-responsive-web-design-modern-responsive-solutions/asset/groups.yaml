    \ Web Design\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_76_0.png)\n\n3-13. What\
    \ happens on a smaller screen size\n\nNot a great look: the TV show elements have\
    \ become squashed. Some of this is to the images not reducing appropriately in\
    \ size yet—a topic we’ll cover further in Chapter 5. This is also a problem with\
    \ a fluid grid. In theory, what should happen at smaller sizes is that the layout\
    \ should stack vertically.\n\n# Flexbox\n\nFlexbox is a modern layout model for\
    \ designing flexible layouts in rows or columns. It makes it easier to align items\
    \ and distribute space within a container, even when the size of the items is\
    \ unknown. Flexbox is a one-dimensional layout method, meaning it deals with layout\
    \ in either a row or a column, but not both. For two-dimensional layouts, use\
    \ CSS Grid.\n\nFlexbox consists of a flex container and its flex items. You define\
    \ a container by setting its `display` property to `flex` or `inline-flex`. The\
    \ direct children become flex items.\n\nThe key properties of the flex container:\n\
    \n- `flex-direction`: Sets the main axis, along which flex items are placed (values:\
    \ `row`, `row-reverse`, `column`, `column-reverse`).\n- `flex-wrap`: Controls\
    \ whether flex items wrap onto multiple lines or stay on a single line (values:\
    \ `nowrap`, `wrap`, `wrap-reverse`).\n- `justify-content`: Defines how items are\
    \ aligned and how extra space is distributed along the main axis (values: `flex-start`,\
    \ `flex-end`, `center`, `space-between`, `space-around`).\n- `align-items`: Defines\
    \ how items are aligned along the cross axis (values: `stretch`, `flex-start`,\
    \ `flex-end`, `center`, `baseline`).\n\nKey properties for flex items:\n\n- `flex-grow`:\
    \ Defines the ability for a flex item to grow if necessary.\n- `flex-shrink`:\
    \ Defines the ability for a flex item to shrink if necessary.\n- `flex-basis`:\
    \ Defines the initial size of a flex item before the space is distributed.\n-\
    \ `flex-self`: Overrides the `align-items` value set by the container, but only\
    \ for an individual flex item.\n- `order`: Determines the order of a flex item\
    \ relative to the other items.\n\nThe following example shows how to use flexbox:\n\
    \n```css\n.container {\n  display: flex;\n  flex-direction: row;\n  justify-content:\
    \ space-around;\n  align-items: center;\n}\n\n.item {\n  flex-grow: 1;\n}\n```\n\
    \nFlexbox is a powerful tool for creating responsive layouts. By mastering its\
    \ properties, you can build complex and dynamic interfaces that adapt to different\
    \ screen sizes.\n\n# Starting Flexbox\n\nFlexbox is a modern layout model for\
    \ designing flexible layouts in rows or columns. It makes it easier to align items\
    \ and distribute space within a container.\n\nLet's start with a flex container:\n\
    \n```html\n<div class=\"container\">\n  <div class=\"item\">1</div>\n  <div class=\"\
    item\">2</div>\n  <div class=\"item\">3</div>\n</div>\n```\n\nAnd the following\
    \ CSS:\n\n```css\n.container {\n  display: flex;\n}\n```\n\nBy default, the flex\
    \ items will be placed in a row. Let's change the `flex-direction` to column:\n\
    \n```css\n.container {\n  display: flex;\n  flex-direction: column;\n}\n```\n\n\
    Now the items will be stacked vertically. Let's use `justify-content` to align\
    \ them along the main axis:\n\n```css\n.container {\n  display: flex;\n  flex-direction:\
    \ column;\n  justify-content: space-between;\n}\n```\n\nThe items will be spread\
    \ out throughout the container. Finally, let's use `align-items` to align them\
    \ along the cross axis:\n\n```css\n.container {\n  display: flex;\n  flex-direction:\
    \ column;\n  justify-content: space-between;\n  align-items: center;\n}\n```\n\
    \nThe items are now centered horizontally. Flexbox is a powerful tool for creating\
    \ responsive layouts. By mastering its properties, you can build complex and dynamic\
    \ interfaces that adapt to different screen sizes.\n\n# Flexbox Layouts\n\nLet's\
    \ use flexbox to create a simple navigation bar:\n\n```html\n<nav class=\"navbar\"\
    >\n  <div class=\"logo\">Brand</div>\n  <ul class=\"nav-links\">\n    <li><a href=\"\
    #\">Home</a></li>\n    <li><a href=\"#\">About</a></li>\n    <li><a href=\"#\"\
    >Contact</a></li>\n  </ul>\n</nav>\n```\n\nAnd the CSS:\n\n```css\n.navbar {\n\
    \  display: flex;\n  justify-content: space-between;\n  align-items: center;\n\
    \  background-color: #333;\n  padding: 1rem;\n}\n\n.nav-links {\n  display: flex;\n\
    \  list-style: none;\n}\n\n.nav-links li {\n  margin-left: 20px;\n}\n\n.nav-links\
    \ a {\n  color: white;\n  text-decoration: none;\n}\n```\n\nThis creates a responsive\
    \ navigation bar with the logo on the left and the links on the right. The `justify-content:\
    \ space-between` property ensures that they are pushed to the ends of the container.\n\
    \nLet's use flexbox to create a multi-column layout:\n\n```html\n<div class=\"\
    layout\">\n  <aside class=\"sidebar\">\n    Sidebar Content\n  </aside>\n  <main\
    \ class=\"content\">\n    Main Content\n  </main>\n</div>\n```\n\nAnd the CSS:\n\
    \n```css\n.layout {\n  display: flex;\n}\n\n.sidebar {\n  flex: 1;\n  background-color:\
    \ #f4f4f4;\n  padding: 1rem;\n}\n\n.content {\n  flex: 3;\n  padding: 1rem;\n\
    }\n```\n\nThis creates a two-column layout where the main content area is wider\
