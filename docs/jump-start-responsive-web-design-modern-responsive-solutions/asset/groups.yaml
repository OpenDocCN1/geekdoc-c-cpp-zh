    \ that don't support picture, meaning that the browser will load a default image\
    \ if it doesn't support the newer element.\n\nI chose the medium-sized image,\
    \ as it's not too large or small, allowing for a reasonable level of responsiveness\
    \ on unsupported browsers."
  - "[PAGE 127]\n\n# Responsive Images and Video\n\n# Supporting Older Browsers\n\n\
    > If you want better support for older browsers, you can use a \"polyfill\" (a\
    \ term for a library that plugs missing functionality). Specifically, in this\
    \ case, that's Scott Jehl's picturefill.\n\nOther useful application of the picture\
    \ element, enabled through its inner source element, is to load different image\
    \ formats, such as scaleable vector images (SVGs):\n\n```\n<picture>\n  <source\
    \ srcset=\"logo.svg\" type=\"image/svg+xml\">\n  <img src=\"logo.png\" alt=\"\
    Logo\">\n</picture>\n```\n\nIf the browser doesn't support SVG images, then it\
    \ will load the PNG instead.\n\nAnother option is to load higher resolution images\
    \ for high resolution screens:\n\n```\n<picture>\n  <source srcset=\"../images/show1-2x.jpg\"\
    \ media=\"(min-resolution: 120dpi)\\ class=\"thumbnail\">\n  <img src=\"../images/show1-medium.jpg\"\
    \ class=\"thumbnail\">\n</picture>\n```\n\n# Responsive Video\n\nContinuing the\
    \ theme of semantic elements in HTML5, the respective elements for video and audio\
    \ are video and audio. Since we're building a video site in this book, I won't\
    \ focus too much on the audio element, but I think after using the picture and\
    \ video elements, you'll understand how to use it."
  - "[PAGE 128]\n\n# 116 Jump Start Responsive Web Design\n\n# The video Element\n\
    \nMany years ago, I made a site of music videos. This was prior to the widespread\
    \ availability of broadband, and I spent a long time optimizing videos as much\
    \ as possible to make them viewable on slow connections. I also had to decide\
    \ what video plugin to use to display the video. It would be best with Quicktime?\n\
    RealPlayer? Or the tool everyone loves to hate (but which was popular at the time),\
    \ Flash?\n\nThose video format was largely over now, replaced by a series of standard\
    \ formats and HTML5, making a designer's life much easier, and also reducing user-experience-killing\
    \ process of having to download a plugin to view a video. The video element has\
    \ a wider support than picture, with only IE8 and early Android versions likely\
    \ to cause you problems.\n\nHowever, the file formats supported by the video element\
    \ still present problems, mostly thanks to vendors' differing attitudes to DRM\
    \ and to which format is the \"best\" to use (each user preferring the format\
    \ it supports or helped to). All browsers that support the video element support\
    \ MPEG-4/H.264, which is a compressed format. But it's also proprietary, which\
    \ means browser manufacturers must pay a license to use it. Support for the WebM\
    \ and Ogg/Theora formats is common, with only Chrome, Firefox, and Opera (which\
    \ are open formats) supporting them.\n\nHere's an example of the video element\
    \ in:\n\n```\n<video width=\"320\" height=\"240\" autoplay>\n  <source src=\"\
    file.mp4\" type=\"video/mp4\">\n  <source src=\"file.ogg\" type=\"video/ogg\"\
    >\nYour browser does not support the video tag.\n</video>\n```\n\nIt's a much\
    \ simpler and consolidated HTML element than the options that existed before.\
    \ It loads whichever video format is supported by the user's browser, or a default\
    \ string of text if the video element or the file formats it contains aren't supported.\
    \ The source elements are processed in the order presented. So, in the example\
    \ above, if the browser supports both formats, it will load the first one it"
- md: "\n# Responsive Images and Video 117\n\nsees. That's about it; there isn't much\
    \ particularly responsive about the video element, except that it loads suitable\
    \ video files with controls for them.\n\nThere are a few tricks you can try to\
    \ make videos more responsive, but let's start simply by making the video player\
    \ controls visible, adding a poster image (a thumbnail shows before the video\
    \ plays), and removing the manual size.\n\n```\n<video controls poster=\"../images/show1-medium.jpg\"\
    >\n  <source src=\"../videos/show1.ogv\" type=\"video/ogg\">\n  <source src=\"\
    ../videos/show1.mp4\" type=\"video/mp4\">\n  Your browser does not support the\
    \ video tag.\n</video>\n```\n\nEarly proposals for the video element included\
    \ having own media queries (like the picture element, as we have saw). But the\
    \ idea was dropped, meaning different video files can't be swapped out for different\
    \ devices. The only real way to make the video responsive in any way is to use\
    \ percentage widths, for example:\n\n```\nvideo {\n  width: 100%;\n  height: auto;\n\
    }\n```\n\nThis will make the video scale to fit its containing element, and you\
    \ could use a max-width property to limit the dimensional size it could grow to,\
    \ or a smaller value, such as 50%. However at larger screen sizes it won't prevent\
    \ upscaling of the video, meaning it could look pixelated if sized too large.\n\
    \nUnless you specify otherwise, a video will start to download to your browser\
    \ once the page is loaded (so that it's ready to view if a user chooses to watch\
    \ it). Notice the potential network overhead with a video, which isn't great for\
    \ mobile users:\n\n# 1 Jump Start Responsive Design\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_130_0.png)\n\
    \n5-8. The video file size shown in the web inspector\n\nThere's a partial solution\
    \ to this problem: add preload=\"*\" to the video tag:\n\n```html\n<video controls\
    \ poster=\"../images/show1-medium.jpg\"\n...\n</video>\n```\n\nThe video will\
    \ only load when a user clicks the play button, allowing the user to choose when/if\
    \ it's loaded.\n\nIn our code files, go ahead and come out the picture element\
    \ (for now) and replace it with the video element as shown above.\n\n# Site Name\n\
    \nMenu Item  Menu Item  Menu Item\n\n# Site Introduction\n\nLorem ipsum dolor\
    \ sit amet, consectetur adipiscing elit. Septem illum non suo, sed populorum suffragio\
    \ omnis nominati sunt. Itaque senalibus ratione adduct et ratione effecta sensus\
    \ non reliquit. Videmus igtur ut conquisescere infantes quidem posuere. Quod eum\
    \ a me expectare nol.\n\n# Show 1\n\n# Show 2\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_131_0.png)\n\
    \nLorem ipsum dolor sit amet, consectetur adipiscing ...\n\nLorem ipsum dolor\
    \ sit amet, consectetur adipiscing ...\n\n# Show 3\n\n# Show 4\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_131_1.png)\n\
    \n5-9. Videos loaded on a tablet device\n\nIf you use a larger video, then the\
    \ video scales quite well at larger sizes. But you'll notice that at player sizes\
    \ (the tablet and TV breakpoints) the poster image is pixelated.\n\nThere are\
    \ no ideal solutions to this problem, and hopefully, better solutions will emerge\
    \ as the element evolves. (One possible solution I'd like to see would be the\
    \ option to set the poster image along with the source sub-elements inside the\
    \ video tags, ideally with support for breakpoints and media format selective\
    \ loading.)\n\n# Using a Larger Image as a Poster\n\nReplacing the poster image\
    \ with the large variant will mean the poster image scales across all file sizes,\
    \ but it does mean that we're loading an unnecessarily large file at certain breakpoints.\n\
    \nIf you want to style the poster element further (to change the dimensions or\
    \ add padding), you can target it directly with the following selector:\n\n```\n\
    video[poster] {\n  ...\n}\n```\n\n# Background Image\n\nA way to create a responsive\
    \ image representation of the video is to remove the poster image and instead\
    \ set a background image for the video, allowing use media queries to load the\
    \ appropriate image.\n\nYou'll need to set a background image inline within the\
    \ video tag, or create a CSS style for each video to set the image, because each\
    \ video needs a different image as a background.\n\nWith an inline style:\n\n\
    ```\n<video controls preload=\"none\"\nstyle=\"background: transparent\nurl('../images/show1-large.jpg')\n\
    0 0 / cover-repeat;\">\n</video>\n```\n\nAnd with a CSS class: To avoid repeated\
    \ typing on a production site, you’d probably use a templating system as Twig\
    \ or Mustache, which would loop through the videos you use to display and populate\
    \ the various names as required. If you don’t want to use inline styles you could\
    \ use a CSS preprocessor such as Less or Sass, which allows you to use functions\
    \ and arguments (in this case, the background image) to generate the necessary\
    \ classes for you, but this will result in lot of CSS.\n\nTo demonstrate the principle,\
    \ let’s take an approach somewhere between the two above, without using any new\
    \ dependencies. First, remove all the poster attributes from the video tags and\
    \ add a class to each video, then create the styles needed for the background\
    \ image at each breakpoint. For example:\n\n```\n<video controls preload=\"none\"\
    \ class=\"show1\">\n</video>\n```\n\nAnd the CSS for mobile-first layout:\n\n\
    ```\n.show1 {\n  background: transparent url(\"../images/show1-medium.jpg\")\n\
    \  0 0 / cover-repeat;\n}\n```\n\n# Jump Start Responsive Design\n\nThen for larger\
    \ mobile devices:\n\n```\n@media only screen and (min-width: 480px) {\n  .show1\
    \ {\n    background: transparent url(\"../images/show1-large.jpg\")\n  0 0 / cover-repeat;\n\
    \  }\n}\n```\n\nFor larger tablets and desktop devices:\n\n```\n@media only screen\
    \ and (min-width: 992px) {\n  .show1 {\n    background: transparent url(\"../images/show1-small.jpg\"\
    )\n  0 0 / cover-repeat;\n  }\n}\n```\n\nAnd finally for large screens and TVs:\n\
    \n```\n@media only screen and (min-width: 1800px) {\n  .show1 {\n    background:\
    \ transparent url(\"../images/show1-large.jpg\")\n  0 0 / cover-repeat;\n  }\n\
    }\n```\n\nNow create matching classes and styles for each video thumbnail. That's\
    \ great for responsiveness, but lot of code! You can find the complete example\
    \ in the code archive.\n\n# Clickable Image\n\nAnother different solution to creating\
    \ a fully responsive video is to replace the video player with a picture tag that,\
    \ when clicked, loads the player. This allows you to use the best of all responsive\
    \ worlds, but will need JavaScript. It will also allow you to add features such\
    \ as opening the video in a layer above the web page.\n\nFirst, add the picture\
    \ and video tags together for each TV show:\n\n```\n<section class=\"tvshow\"\
    >\n  <h3>Show 1</h3>\n  <picture>\n    <source srcset=\"../images/show1-small.jpg\"\
    \ media=\"max-width: 320px\" class=\"thumbnail\">\n    <source srcset=\"../images/show1-medium.jpg\"\
    \ media=\"(min-width: 320px) and (max-width: 480px)\" class=\"thumbnail\">\n \
    \   <source srcset=\"../images/show1-large.jpg\" media=\"min-width: 480px\" class=\"\
    thumbnail\">\n    <img src=\"../images/show1-medium.jpg\" class=\"thumbnail\"\
    >\n  </picture>\n  <video controls=\"../images/show1-medium.jpg\" preload=\"none\"\
    >\n    <source src=\"../videos/show1.mp4\" type=\"video/mp4\">\n    <source src=\"\
    ../videos/show1.og\" type=\"video/ogg\">\n    Your browser doesn't support HTML5\
    \ video tag.\n  </video>\n  <p class=\"showdescription\">Lorem ipsum dolor sit\
    \ amet, consectetur adipiscing elit.</p>\n</section>\n```\n\nDo the same for each\
    \ other show, replacing the images and video sources.\n\nNow set the video element\
    \ to be hidden by default:\n\n```\nvideo {\n  display: none;\n  width: 100%;\n\
    \  height: auto;\n}\n```\n\n# A Note on JavaScript\n\nThe JavaScript code in this\
    \ chapter and in Chapter 6 are mostly presented in isolation, as they offer separate\
    \ options to experiment with. If you wanted to combine and use all of the examples\
    \ together, you'd need to plan further, especially in trying to minimize the number\
    \ of event handlers required.\n\nNext, add the following JavaScript that adds\
    \ a click event listener to the page. If a click is detected, the code will check\
    \ if the click was on a thumbnail. If it was, then it calls a toggle_visibility\
    \ function. This function shows the hidden video, plays it and hides the image\
    \ that was clicked.\n\nAdd the following JavaScript inside a script tag to the\
    \ index.html file, which adds the event listener:\n\n```\nfunction () {\n  document.addEventListener('click',\
    \ toggle_visibility,\n  false);\n}\n```\n\nOnce inside the function, if the element\
    \ clicked was one of the video thumbnails, then continue, ignoring all other elements:\n\
    \n```\nfunction toggle_visibility(id) {\n  clickedElement = id.target;\n  if (clickedElement.classList.contains('thumbnail'))\
    \ {\n```\n\nNext, you need to detect which image was clicked, find the relevant\
    \ video for the thumbnail, start playing it and hide the thumbnail image.\n"
  mdcn: "\n\n# 响应式图像与视频 117\n\n看到。就这些了；video 元素并没有特别的响应式，除了它可以加载带有控制控件的合适视频文件。\n\n\
    你可以尝试一些技巧让视频更具响应性，但让我们先简单地让视频播放器控件可见、添加海报（视频播放前显示的缩略图）并移除手动尺寸开始。\n\n```\n<video\
    \ controls poster=\"../images/show1-medium.jpg\">\n  <source src=\"../videos/show1.ogv\"\
    \ type=\"video/ogg\">\n  <source src=\"../videos/show1.mp4\" type=\"video/mp4\"\
    >\n  您的浏览器不支持 video 标签。\n</video>\n```\n\nvideo 元素的早期建议包含自己的媒体查询（正如我们看到的 `picture`\
    \ 元素一样）。但这个想法被舍弃了，这意味着无法为不同的设备切换不同的视频文件。让视频具有响应式的唯一真实方法是使用百分比宽度，例如：\n\n```\nvideo\
    \ {\n  width: 100%;\n  height: auto;\n}\n```\n\n这将使视频缩放以适应其容器元素，你可以使用 `max-width`\
