    \ sit amet, consectetur adipiscing elit.\n\nI am a footer\n\n### 3-18. The final\
    \ flexbox layout\n\nOne other cool flexbox trick is to set the order of elements\
    \ using the order property, and a number that defines its position. For example,\
    \ you could use the following to rearrange page elements on a mobile device:\n\
    \n```css\nnav { order: 1; }\nheader { order: 2; }\nmain { order: 3; }\nfooter\
    \ { order: 4; }\n```\n\n## Better Responsive Structures with Grid Systems 71\n\
    \n![](img/bd4041c3e441a42781fa04a5cb5b773b_83_0.png)\n\nBut if you wanted to remove\
    \ page elements, you'd still need to use media queries.\n\nThis has been a brief\
    \ example of how to use flexbox, but as you can see, once you've restructured\
    \ your page, flexbox handles a lot of the manual page reflowing for you.\n\n##\
    \ CSS Grid Layout\n\nComplementary to flexbox is the CSS Grid Layout Module, which\
    \ helps you define and lay out the regions of a page. In the past, the main option\
    \ open to web\n\n### 3-19. Setting the order of page elements\n\n## 72 Jump Start\
    \ Responsive Web Design\n\ndevelopers for flexible (I use this term loosely) page\
    \ layouts was using HTML tables to define page areas with rows and columns, but\
    \ these were terrible for accessibility. The grid layout is something of a modern\
    \ re-interpretation of that concept.\n\n> Browser Support for Grid Layout\n> Grid\
    \ shipped for all the newest versions of the major browsers in early 2017, so\
    \ a fallback strategy is required if your layouts needs to be supported in older\
    \ browsers. You can check online for details on which browser versions do and't\
    \ support Grid.\n\nLet's try applying the grid layout to the demo site, starting\
    \ with the code from the beginning. Again, make a container div inside the body\
    \ to contain the layout:\n\n```html\n<div class=\"container\">\n...\n</div>\n\
    ```\n\nMove the aside from inside main to outside of it. This lets you treat it\
    \ like a proper column in its own:\n\n```html\n<!-- 3-20. Chapter 3/index.html\
    \ (excerpt) -->\n<main>\n<aside class=\"left\">\n  <ul>\n    <li>one</li>\n  \
    \  <li>two</li>\n    <li>three</li>\n  </ul>\n</aside>\n\n\n## Better Responsive\
    \ Structures with Grid Systems 73\n\nIn the CSS, change the display to grid:\n\
    \n```css\n.container {\n  display: grid;\n}\n```\n\nNow the grid display gets\
