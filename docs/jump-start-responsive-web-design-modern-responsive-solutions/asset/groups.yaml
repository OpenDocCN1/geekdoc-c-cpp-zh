    \nApple 的虚拟视口被设置为 980px，因此只要网站宽度不宽 980px，布局就会显示在屏幕上。任何宽于 980px 的布局都会在右侧被部分隐藏，需要横向滚动。今天的情况依然如此。其他设备制造商也采用了虚拟视口的想法，尽管默认宽度各不相同。\n\
