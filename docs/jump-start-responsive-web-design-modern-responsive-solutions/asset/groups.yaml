    \ But notice what happens when you get to a smaller screen size:\n\n# 64 Jump\
    \ Start Responsive Web Design\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_76_0.png)\n\
    \n3-13. What happens on a smaller screen size\n\nNot a great look: the TV show\
    \ elements have become squashed. Some of this is to the images not reducing appropriately\
    \ in size yet—a topic we’ll cover further in Chapter 5. This is also a problem\
    \ with a fluid grid. In theory, what should happen at smaller sizes is that the\
    \ layout should stack vertically.\n"
  mdcn: "\n\n# 使用网格系统改进响应式结构 59\n\n```\nColumnWidth = (SingleColumnWidth * CurrentColumn)\
    \ + \n(MarginValue * (CurrentColumn - 1))\n```\n\n例如，这里是找到跨越两列所需的数值：\n\n```\n\
    (SingleColumnWidth * CurrentColumn)\n6.866666666667 * 2 = 13.7333333333\n\n(CurrentColumn\
    \ - 1)\n2 - 1 = 1\n\n(MarginValue * (CurrentColumn - 1))\n1.6 * 1 = 1.6\n\n(SingleColumnWidth\
    \ * CurrentColumn) + (MarginValue *\n(CurrentColumn - 1))\n13.7333333333 + 1.6\
    \ = 15.3333333333\n```\n\n这将产生以下 column-n 类，表示你想要跨越的列数。将这些类添加到 layout.css 中：\n\
    \n```css\n.column-1 {\n  width: 6.86666666667%;\n}\n.column-2 {\n  width: 15.33333333333%;\n\
    }\n.column-3 {\n  width: 23.8%;\n}\n.column-4 {\n  width: 32.26666666667%;\n}\n\
    .column-5 {\n  width: 40.73333333333%;\n}\n.column-6 {\n  width: 49.2%;\n}\n.column-7\
    \ {\n  width: 57.66666666667%;\n}\n.column-8 {\n  width: 66.13333333333%;\n}\n\
    .column-9 {\n  width: 74.6%;\n}\n.column-10 {\n  width: 83.06666666667%;\n}\n\
    .column-11 {\n  width: 91.53333333333%;\n}\n.column-12 {\n  width: 100%;\n}\n\
    ```\n\n再次，不要担心记住这些数值。一旦定义了它们，只需要使用相应的 CSS 类即可。\n\n# 减少重复工作\n\n你也可以使用 CSS 预处理器——例如\
    \ Sass 或 Less——它们提供了一个额外的框架来帮助你生成重复且复杂的 CSS。在其他功能中，这包括为你完成上述计算。\n\n现在你希望页眉和导航栏始终占据\
    \ 12 列以更好地适应网格模型，因此让我们页眉和导航元素重新排列为行，并添加相应的列类。这些是基础列类和填充 12 列的 column-12：\n\n```html\n\
    <header class=\"row\">\n  <h1 class=\"column column-12\">站点名称</h1>\n</header>\n\
    <nav class=\"row\">\n  <ul class=\"column column-12\">\n    <li><a href=\"#\"\
    >菜单项</a></li>\n    <li><a href=\"#\">菜单项</a></li>\n    <li><a href=\"#\">菜单项</a></li>\n\
    \  </ul>\n</nav>\n```\n\n左侧内容区域需要 9 列宽，右侧侧边栏需要 3 列，因此添加这些类：\n\n```html\n<section\
    \ class=\"showlisting column column-9\">\n...\n</section>\n\n<aside class=\"column\
    \ column-3\">\n...\n</aside>\n```\n\n现在为内容区域内的电视节目添加列类：\n\n```html\n<section class=\"\
    tvshow column column-2\">\n--\n</section>\n```\n\n在 tvshow 类中，你现在可以移除 width 和\
    \ display 属性，并将高度更改为 auto 以获得更强大的响应式效果：\n\n```css\nsection.tvshow {\n  height:\
    \ auto;\n}\n```\n\n页面布局看起来与之前没有太大区别，但这些关键的变化增加了灵活性。想让电视节目列表更紧凑吗？那么将类改为 column-3。\n\
    \n想要更宽的侧边栏菜单？将它的类改为 column-4，并将列表宽度类改为 column-8：\n\n# 使用网格系统改进响应式结构 63\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_75_0.png)\n\
    \n3-12. 具有更宽侧边栏的页面\n\n随着浏览器窗口大小的变化，你会看到页面元素平滑地收缩和放大，这非常适合响应式 Web 设计。但注意当到达较小屏幕尺寸时会发生什么：\n\
    \n# 64 快速上手响应式设计\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_76_0.png)\n\n3-13.\
    \ 在较小屏幕尺寸下发生了什么\n\n看起来不太好：电视节目元素被压扁了。部分原因是图片还没有适当缩小尺寸——我们将在第 5 章中进一步讨论这一主题。这也是流式网格的问题。理论上，在较小尺寸下发生的情况应该是布局应该垂直堆叠。\n\
    \n# Flexbox\n\nFlexbox 是一种用于在行或列中设计灵活布局的现代布局模型。它使得在容器内对齐项目和分配空间变得更容易，即使项目的大小是未知的。Flexbox\
    \ 是一种一维布局方法，意味着它处理行或列布局，而不是兼顾。对于二维布局，请使用 CSS Grid。\n\nFlexbox 由一个 flex 容器及其 flex\
    \ 项目组成。你通过将 `display` 属性设置为 `flex` 或 `inline-flex` 来定义容器。\n\nflex 容器的关键属性：\n\n\
    - `flex-direction`：设置主轴，项目在该轴上放置（值：`row`、`row-reverse`、`column`、`column-reverse`）。\n\
    - `flex-wrap`：控制 flex 项目是换行还是保持单行（值：`nowrap`、`wrap`、`wrap-reverse`）。\n- `justify-content`：定义如何在主轴上对齐以及如何分配额外空间（值：`flex-start`、`flex-end`、`center`、`space-between`、`space-around`）。\n\
    - `align-items`：定义如何在交叉轴对齐（值：`stretch`、`flex-start`、`flex-end`、`center`）。\n\n\
    flex 项目的关键属性：\n\n- `flex-grow`：项目增长的能力。\n- `flex-shrink`：项目收缩的能力。\n- `flex-basis`：分配空间之前的项目初始大小。\n\
    - `flex-self`：覆盖容器设置的 `align-items` 值，但仅针对单个项目。\n- `order`：项目相对于其他项目的顺序。\n\n以下示例显示了如何使用\
    \ flexbox：\n\n```css\n.container {\n  display: flex;\n  flex-direction: row;\n\
    \  justify-content: space-around;\n  align-items: center;\n}\n\n.item {\n  flex-grow:\
    \ 1;\n}\n```\n\nFlexbox 是创建响应式布局的强大工具。通过掌握它的属性，你可以构建适应不同屏幕尺寸的复杂动态界面。\n\n# Flexbox\
    \ 布局\n\n使用 flexbox 创建简单的导航栏：\n\n```html\n<nav class=\"navbar\">\n  <div class=\"\
    logo\">品牌</div>\n  <ul class=\"nav-links\">\n    <li><a href=\"#\">首页</a></li>\n\
    \    <li><a href=\"#\">关于我们</a></li>\n    <li><a href=\"#\">联系我们</a></li>\n  </ul>\n\
    </nav>\n```\n\n对应的 CSS：\n\n```css\n.navbar {\n  display: flex;\n  justify-content:\
    \ space-between;\n  align-items: center;\n  background-color: #333;\n  padding:\
    \ 1rem;\n}\n\n.nav-links {\n  display: flex;\n  list-style: none;\n}\n\n.nav-links\
    \ li {\n  margin-left: 20px;\n}\n\n.nav-links a {\n  color: white;\n  text-decoration:\
    \ none;\n}\n```\n\n这创建了一个 logo 在左侧、链接在右侧的响应式导航栏。`justify-content: space-between`\
    \ 属性确保它们被推到容器的两端。\n\n使用 flexbox 创建多列布局：\n\n```html\n<div class=\"layout\">\n \
    \ <aside class=\"sidebar\">\n    侧边栏内容\n  </aside>\n  <main class=\"content\"\
    >\n    主内容\n  </main>\n</div>\n```\n\n对应的 CSS：\n\n```css\n.layout {\n  display:\
    \ flex;\n}\n\n.sidebar {\n  flex: 1;\n  background-color: #f4f4f4;\n  padding:\
    \ 1rem;\n}\n\n.content {\n  flex: 3;\n  padding: 1rem;\n}\n```\n\n这创建了一个双列布局，其中主内容区域比侧边栏宽。`flex`\
    \ 属性用于定义项目的增长比例。\n\n最后，使用 flexbox 创建一个响应式网格：\n\n```html\n<div class=\"grid\">\n\
    \  <div class=\"card\">1</div>\n  <div class=\"card\">2</div>\n  <div class=\"\
    card\">3</div>\n  <div class=\"card\">4</div>\n</div>\n```\n\n对应的 CSS：\n\n```css\n\
    .grid {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n}\n\n.card {\n  flex:\
    \ 1 calc(25% - 10px);\n  border: 1px solid #ccc;\n  padding: 1rem;\n  text-align:\
    \ center;\n}\n\n@media (max-width: 768px) {\n  .card {\n    flex: 1 calc(50% -\
    \ 10px);\n  }\n}\n\n@media (max-width: 480px) {\n  .card {\n    flex: 1 100%;\n\
    \  }\n}\n```\n\n这创建了一个适应不同屏幕尺寸的响应式网格。Flexbox 是构建现代布局的通用且强大的工具。\n"
