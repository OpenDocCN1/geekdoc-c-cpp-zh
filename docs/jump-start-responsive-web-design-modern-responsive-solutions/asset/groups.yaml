  mdcn: "\n对于页面的小屏幕版本（即默认样式），节目描述文本实际上是隐藏的，因此我们不需要担心对其进行格式化。然而，当屏幕空间有限时，主站描述占据了过多的空间，因此使用\
    \ `:not` 伪类来减小默认字体大小并排除节目描述：\n\n```\nsection.showlisting p:not(.showdescription)\
    \ {\n  font-size: 0.8em;\n}\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_113_0.png)\n\
    \n## 4-10. 网站介绍文本调整大小\n\n随着屏幕尺寸的增大，除了观看视频之外，节目描述可能是人们想要访问的内容，所以让文字稍微大一点，以便更突出。在等等屏幕尺寸下，仍然显示文本摘要，因此这足够提高它的可读性了：\n\
    \n```\n@media only screen and (min-width: 768px) {\n  .showdescription {\n   \
    \ font-size: 1.2em;\n  }\n}\n```\n\n## 4-11. 节目描述现在变大了\n\n屏幕变大了，让我们增大字体大小并收紧行间距，特别是人们现在可能在安坐享受晚上娱乐时，从另一个房间阅读这些描述。\n\
    \n```\n/* 中等设备和桌面电脑 */\n@media only screen and (min-width: 992px) {\n  .showdescription\
    \ {\n    font-size: 1.3em;\n    line-height: 1.1em;\n  }\n}\n```\n\n| 节目 | 节目\
    \ | 节目 | 节目 | 节目 |\n| --- | --- | --- | --- | --- |\n| 350-150 | 350-150 | 350-150\
    \ | 350-150 | 350-150 |\n| Lorem ip... | Lorem ip... | Lorem ip... | Lorem ip...\
    \ | Lorem ip... |\n\n## 4-12. 完整的描述文本\n\n# 响应式 Web 设计入门\n\n## 继续阅读\n\n在本章中，我介绍了与响应式设计相关的排版概念，并展示了它们如何在\
    \ CSS 中表示。我还涵盖了你可以用于设置这些属性的各种尺寸单位，以及如何让你页面上的重要文本具有可读性。在下一章中，我将展示如何对页面的其余内容进行相同的操作，例如图像和视频。\n\
    \n# 第 5 章\n\n## 响应式图像和视频\n\n基于内容的交换促成了 Web 的诞生，但图像和其他富媒体一直使其不断演变，并使其成为我们所有人所知/喜爱/厌恶的样子。\n\
    \n使图像响应式的方案在近年来发展迅速，已经能够加载完美适配用户设备的图像。此外，视频等新 HTML 元素的加入为响应式设计开启了新的选择。这是一个全新的领域，但也充满了陷阱、折中和需要学习的新技术。所以，让我们开始吧！\n\
    \n# 响应式图像和视频 105\n\n## 图像\n\n图像是一种强大的通信工具，能够传达信息、意图、解释，并为你的网页注入生命。\n\n多年来，图像一直是设计师（网页和打印）痛苦的源源，尽管\
    \ HTML5 带来了许多改进，但在你的网页中添加响应式图像仍然需要规划和准备。\n\n在本章中，我用来自版权免费网站的图像替换了此处为止网站使用的占位图形，以代表一个拥有真实电视节目的网站可能的样子。\n\
    \n![](img/bd4041c3e441a42781fa04a5cb5b773b_117_0.png)\n\n### 5-1. 添加图像\n\n添加真实图像后，页面出现了一些问题。最明显的是，虽然布局仍然良好，但所有图像都被强制设置为相同的尺寸，这意味着它们没有利用可用的屏幕空间。示例网站用于浏览和观看视频，因此让视觉内容尽可能突出且易于观察是有意义的。\n\
    \n为了展示如何使用响应式图像，我们将更改演示网站，使其在第 3 章定义的断点处适应每种用例的不同图像尺寸和布局。\n\n首先，更改 CSS 和 HTML\
    \ 以更好地适应我们将添加的图像。让我们给主内容区域留更多空间并缩小侧边菜单的大小：\n\n```\n@media only screen and (min-width:\
    \ 992px) {\n  aside {\n    width: 15%;\n    display: block;\n  }\n\n  section.showlisting\
    \ {\n    width: 75%;\n  }\n}\n```\n\n为包含节目详情的 `div` 添加移动端样式。这设置了 480px 的最大宽度，居中，理想宽度占据大部分屏幕：\n\
    \n```\nsection.tvshow {\n  width: 90%;\n  max-width: 480px;\n  margin: 0 auto;\n\
    \  display: block;\n}\n```\n\n接下来，为同一个 `div` 在更大屏幕上显示时添加一个媒体查询——仍然居中并填充大部分屏幕：\n\
    \n```\n@media only screen and (min-width: 480px) {\n  section.tvshow {\n    max-width:\
    \ 768px;\n  }\n}\n```\n\n当我们跳转到更大的屏幕时，我们将行内显示更多一个图像，它们仍然居中并占据大部分屏幕。这意味着图像将变小，且每个\
    \ `div` 的最大宽度是屏幕的一半，通过以下媒体查询实现：\n\n```\n@media only screen and (min-width: 768px)\
    \ {\n  section.tvshow {\n    max-width: 50%;\n  }\n}\n```\n\n在屏幕上显示时，为同一个 `div`\
    \ 添加另一个媒体查询：\n\n```\n@media only screen and (min-width: 992px) {\n  section.tvshow\
    \ {\n    max-width: 768px;\n  }\n}\n```\n\n最后，针对大屏幕的媒体查询：\n\n```\n/* 大屏幕设备和显示器\
    \ */\n@media only screen and (min-width: 1200px) {\n  section.tvshow {\n    width:\
    \ 33%;\n  }\n}\n```\n"
