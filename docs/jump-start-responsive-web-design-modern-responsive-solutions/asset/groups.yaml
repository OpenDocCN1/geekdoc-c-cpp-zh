  - "[PAGE 50]\n\n# Mobile First\n\nIn Chapter 1. I introduced the “mobile first”\
    \ concept. Currently, the page works on different device sizes but not mobile\
    \ first, because the “default” styles—that is, those not inside media queries—are\
    \ really designed for larger devices. So let's do some rearranging and refactoring\
    \ to make the design mobile first. This won't involve too much work.\n\nMake the\
    \ following changes to the classes outside of the media queries:\n\n```\naside\
    \ {\n  display: none;\n}\n\nsection.showlisting {\n  margin-bottom: 25px;\n  width:\
    \ 100%;\n}\n\n.showdescription {\n  display: none;\n}\n```\n\nYou can now remove\
    \ the corresponding classes from inside the @media only screen and (min-width:\
    \ 320px) media query.\n\nThat's it! In essence, all “mobile first” means is to\
    \ make the default styles relevant to mobile devices and older browsers that don't\
    \ support media queries and add more specific styles (via media queries) from\
    \ there.\n\nThere's another, more hidden advantage to the mobile first approach.\
    \ While modern browsers now support media queries, some older versions (Internet\
    \ Explorer 8, for example) don't, and in this case, the default CSS styles will\
    \ still be loaded."
- md: "\n# The Building Blocks of Responsive Design 39\n\n## The Viewport Meta Element\n\
    \nIn the last section, I covered making the demo page mobile first with media\
    \ queries. If you try the example in your desktop browser and resize the window,\
    \ everything looks as you would expect. But if you try it in a mobile browser,\
    \ or with an emulated mobile browser, you'll probably see something like the screenshot\
    \ below and be disappointed. Aren't media queries supposed to make pages better\
    \ in a mobile browser?\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_51_0.png)\n\
    \n2-9. Mobile first with no viewport\n\n# 40 Jump Start Responsive Web Design\n\
    \nMedia queries allow us to set different styles for different screen sizes. So,\
    \ if your desktop browser's viewport is 1200px wide, any media query targeting\
    \ that screen width will apply. If you're on a mobile device with a viewport width\
    \ of 320px wide, you'd expect that any styles targeting a 320px viewport would\
    \ kick into action. There's a very big catch. By default, many devices, such as\
    \ mobile phones and tablets, act as if they have a wider screen than they really\
    \ do.\n\nTo explain what's going on, let's look at the iPhone, where this behavior\
    \ originated. The first iPhone had a screen/viewport width of 320px. However,\
    \ most websites designed for desktops were much wider than that. To avoid seeing\
    \ the top left corner of these sites on initial load, Apple developed the concept\
    \ of a \"virtual viewport\" or \"layout viewport\". Websites were loaded onto\
    \ this much wider viewport, which was then scaled down to fit the screen. Most\
    \ sites got rendered on iPhones with tiny text that you had to zoom to be able\
    \ to read.\n\nApple's virtual viewport was set at 980px, so as long as a website\
    \ was no wider than that, the layout would appear on screen. Any layouts wider\
    \ than 980px would be partly hidden to the right, requiring sideways scrolling.\
    \ And that's still the case today. The virtual viewport idea has been adopted\
    \ by other device makers as well, though the default width varies.\n\nWhen designing\
    \ a responsive site, we really don't want this default behavior on mobile devices.\
    \ We want to know that the canvas we're working with is the actual screen area\
    \ of each device. Frankly, there's a simple way to tell these devices not to behave\
    \ in the default way. All we need to do is add a special meta element to the head\
    \ of each page. Here's a typical example:\n\n```\n<meta name=\"viewport\" content=\"\
    width=device-width,\n     initial-scale=1\">\n```\n\nAs a general rule, the line\
    \ above is all you need to ensure your media queries do what you expect on mobile\
    \ devices. The name attribute specifies that we're targeting the virtual viewport,\
    \ and the content attribute specifies how we want the device to behave. In the\
    \ example above, we're specifying that the virtual viewport should match the actual\
    \ width of the screen, and that there should be no zoom applied to the content.\n\
    \nWith the viewport declaration in place, you can be sure that media queries targeting\
    \ a device that's 320px will actually be recognized by that device.\n\nLet’s modify\
    \ our demo site to add a viewport declaration. Add the following meta tag inside\
    \ your current head element:\n\n```html<head>\n  <meta charset=\"UTF-8\">\n  <title>App\
    \ Name</title>\n  <link rel=\"stylesheet\" type=\"text/css\" media=\"all\" href=\"\
    layout.css\">\n  <meta name=\"viewport\" content=\"width=device-width,initial-scale=1.0\"\
    >\n</head>\n```\n\nRefresh the page:\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_54_0.png)\n\
    \n2-11. Demo page with viewport\n\nMuch better!\n\n# The Building Blocks of Responsive\
    \ Design\n\n## The Viewport\n\n**Viewport** is an old term in computer graphics\
    \ to define the (typically rectangular) screen area used to render the elements\
    \ that users see in a browser. When web browsing was limited to desktop browsers,\
    \ the viewport still existed but was rarely changed by designers. With the increasing\
    \ variety of browser dimensions, HTML5 introduced a **viewport** attribute to\
    \ the **meta** element that allowed designers to set and manipulate this area.\n\
    \nThe meta element was initially proposed by Apple to set the initial state of\
    \ the page to the correct size and was later introduced as part of the HTML5 standard.\n\
    \nGenerally, you set the viewport to the width of the current device with `width=device-width`\
    \ and leave the content unscaled (with initial-scale=1.0).\n\nThe width attribute\
    \ is a pixel value, and the `device-width` detects the current device width, meaning\
    \ you don't need to handle the myriad sizes that may be available; the meta element\
