    \ on the golden ratio provides a nice explanation). Popular column values are\
    \ 12, 16 and 24, and I'll focus on the 12-column grid here. 12 is popular, as\
    \ it can be divided into a variety of commonly used sizes such as a half, a third,\
    \ and a quarter.\n\n### Creating Your Grid\n\nYou may be wondering how a 12-column\
    \ layout helps you create a layout like our example—and yes, it's confusing at\
    \ first. The columns are used as structural underpinnings, and through CSS you\
    \ define how many columns you want your elements to span. To make this clearer,\
    \ here's an example of the 12-column 1180px grid:\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_67_0.png)\n\
    \nAnd here's how the grid will represent this page (yes, grids within grids, or\
    \ \"nested grids\", are okay):\n\n## 56 Jump Start Responsive Web Design\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_68_0.png)\n\
    \n3-8. The page as a grid\n\nYou could set up all these columns and grids manually\
    \ for each project, but it's a much better idea to make something usable and reusable.\
    \ We're going to create a lot of new styles and changes to our HTML and CSS files\
    \ now. Then I'll show easier ways to achieve the same result. Sometimes it's a\
    \ good idea to learn the hard way before knowing how to make it easier.\n\nSet\
    \ up the base styles for the columns and rows, and replace any existing matching\
    \ classes:\n\n## Better Responsive Structures with Grid Systems 57\n\n```css\n\
    .row,\n.column {\n  box-sizing: border-box;\n}\n\nrow:before {\n  content: \"\
    \ \";\n  display: table;\n}\n\nrow:after {\n  clear: both;\n}\n\ncolumn {\n  position:\
    \ relative;\n  float: left;\n}\n\n.column + .column {\n  margin-left: 1.6%;\n\
    }\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_69_0.png)\n\n### Using the\
    \ Adjacent Sibling Selector\n\n> The adjacent sibling selector (+) above is a\
    \ useful CSS trick that adds a margin only to the element following another matching\
    \ element. In our case, it means the first column won't have a left margin.\n\n\
    The first step is to define the width of one column, not forgetting the margin\
    \ between each column.\n\nA single column width is equal to 100 (as we're working\
    \ with percentages) minus the margin value, multiplied by the number of columns\
    \ minus 1 (you don't need a left margin in the first column), all divided by the\
    \ number of columns.\n\n## Jump Start Responsive Web Design\n\nIf you prefer to\
    \ look at formulas:\n\n```css\nSingleColumnWidth = (100 - (MarginValue * (NumberOfColumns\
    \ - 1))) / NumberOfColumns\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_70_0.png)\n\
    \n3-10. An explanation of the formula\n\nThis should give the nice, memorable\
    \ result of 6.86666666667% ... but don't worry: a number like this is what's expected,\
    \ and after the initial setup, you won't need to remember these values.\n\nNext,\
    \ apply this number into a new formula for each of the columns. You want to know\
    \ the width values of column spans—that is, how to spread content across more\
    \ than one column.\n\nA column width is equal to the SingleColumnWidth value multiplied\
    \ by the current column, added to the margin value multiplied by the number of\
    \ columns minus 1.\n\nOr as a formula:\n"
