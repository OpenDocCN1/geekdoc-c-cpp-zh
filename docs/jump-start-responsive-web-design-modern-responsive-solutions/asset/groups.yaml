    \ 144\nResponding to All.........................................................................\
    \ 150\n\n# Preface\n\nThe pixel-perfect web is dead. The days of positioning elements\
    \ on a web page and expecting them to always display how we wanted are a distant\
    \ memory; we now cope with the constant barrage of new and varied devices that\
    \ our designs need to look fantastic on.\n\nThis book aims to get you started\
    \ understanding using the suite of CSS and HTML tools for responding to this new\
    \ world of devices. It will introduce you to the building blocks that help your\
    \ pages adapt to different devices, take this step further with grids, show you\
    \ how to make text and images readable on all devices, and in the final chapter,\
    \ cover how to utilize more device capabilities.\n\nLet's get started.\n\n# Who\
    \ Should Read This Book\n\nThis book is for web designers and front-end developers.\
    \ You'll need to be familiar with HTML and CSS, but no previous responsive web\
    \ design experience is required. Some JavaScript familiarity is useful for the\
    \ latter parts of the book.\n\n# Conventions\n\nYou'll notice that we've used\
    \ certain typographic and layout styles throughout this book to signify different\
    \ types of information. Look out for the following items.\n\n# Code Samples\n\n\
    Code in this book is displayed using a fixed-width font, like so:\n\n```\n<h1>A\
    \ Perfect Summer's Day</h1>\n<p>It was a lovely day for a walk in the park. The\n\
    birds were singing and the kids were all back at school.</p>\n```\n\nIf the code\
    \ is to be found in the book's code archive, the name of the file will appear\
    \ at the top of the program listing, like this:\n\n```\n0-1. example.css\n.footer\
    \ {\n  background-color: #CCC;\n  border-top: 1px solid #333;\n}\n```\n\nIf only\
    \ part of the file is displayed, this is indicated by the word *excerpt*:\n\n\
    ```\n0-2. example.css (excerpt)\n.footer {\n  background-color: #CCC;\n  border-top:\
    \ 1px solid #333;\n}\n```\n\nIf additional code is to be inserted into an existing\
    \ example, the new code will be displayed in bold:\n\n```javascript\nfunction\
    \ animate() {\n  new_variable = \"Hello\";\n}\n```\n\nWhere existing code is required\
    \ for context, rather than repeat all of it, : will be displayed:\n\n```javascript\n\
    function animate() {\n  :\n  new_variable = \"Hello\";\n}\n```\n\nSome lines of\
    \ code should be entered on one line, but we've had to wrap them—cause of page\
    \ constraints. An ↩ indicates a line break that exists for formatting purposes\
    \ only, and should be ignored:\n\n```javascript\nURL.open(\"http://www.sitepoint.com/responsive-web-design-real-user-testing/?responsive1\"\
    );\n```\n\n# Tips, Notes, and Warnings\n\n> Hey, You!\nTips provide helpful little\
    \ pointers.\n\n> Ahem, Excuse Me ...\nNotes are useful aides that are related—but\
    \ not critical—to the topic at hand. Think of them as extra tidbits of information.\n\
    \n> Make Sure You Always ...\npay attention to these important points.\n\n> Watch\
    \ Out!\n\nWarnings highlight any gotchas that are likely to trip you up along\
    \ the way.\n\n# Supplementary Materials\n\n- The book's code archive contains\
    \ downloadable code and sample videos to accompany the examples presented.\n-\
    \ https://www.sitepoint.com/community/ are SitePoint's forums, for help on any\
    \ tricky web problems.\n- books@sitepoint.com is our email address, should you\
    \ need to contact us to report a problem, or for any other reason.\n\n# Chapter\
    \ 1\n\n# The Meaning and Purpose of Responsive Web Design\n\nIt used to be so\
    \ simple: you'd design a website or application for a 15-inch monitor, and—incompatibilities\
    \ between browsers aside—you were done.\n\nThen mobile phones with web browsers\
    \ came aside and ruined our easy lives. Worst of all, people loved browsing the\
    \ Web on them!\n\n> The Rise of Mobile\n> In 2016, browsing the web on mobile\
    \ devices overtook desktop browsing for the first time.\n\nJust as developers\
    \ and designers got used to building websites for phones, along came tablets,\
    \ watches, TVs, cars, glasses, larger desktop screens, high-resolution.\n\n# Jump\
    \ Start Responsive Design\n\nHow do we support this endless stream of devices?\
    \ The answer is responsive design, which harnesses technologies that allow websites\
    \ to adapt to screens. For example, many older projects, are unresponsive.\n\n\
    # The Meaning and Purpose of Responsive Web Design\n\nResponsive web design (RWD)\
    \ subscribes to the popular development maxim \"Don’t Repeat Yourself\" (usually\
    \ abbreviated to \"DRY\"). Instead of maintaining multiple codebases for each\
    \ device you wish to support, RWD aims to use a single set of HTML, CSS, and JavaScript,\
    \ and display appropriately for each platform.\n\n# 4 Jump Start Responsive Design\n\
    \nSound good to you? To begin, let's go back in time a few years.\n\n# History\n\
    \n“Responsive” design is not necessarily new and is a term that can mean different\
    \ things to different people, making its exact history hard to track down.\n\n\
    In theory, developers have been creating responsive designs since there was more\
    \ than one browser. Browsers always had subtle (and not subtle) rendering differences\
    \ between them, and developers have been learning how to cope with these quirks\
    \ for decades. If you're new(er) to web development, be thankful the dominance\
    \ of Internet Explorer's earlier versions is mostly over. The days of dealing\
    \ with their quirks were dark.\n\nSince 2004, responsive design has adopted the\
    \ more specific meaning of adapting your designs to a user's device of choice—typically\
    \ based on screen size, but also other capabilities. The concepts for responsive\
    \ design solidified in 2008, and the term is also referred to as \"flexible\"\
    , \"liquid\", and \"elastic\" design.\n\nIt was the inclusion of media queries\
    \ in the CSS3 specification that fully gave responsive design the potential it\
    \ needed to be a genuine and more usable concept. We'll cover media queries in\
    \ detail Chapter 2, but in summary, they allow you to change what you show in\
    \ a web page based on pre-defined screen sizes or types. Ethan Marcello coined\
    \ the term “responsive web design” in an article for A List Apart in 2010.\n\n\
    To me, “responsive design” is something of a combination of all these ideas and\
    \ principles. It's not just adapting design to screen sizes, but also to other\
    \ factors such as color depth, media type (say, a laptop screen, or an eReader),\
    \ or location.\n"
