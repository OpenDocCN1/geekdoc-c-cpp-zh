    \nIf you resize the page in your desktop browser, you'll see the aside appearing\
    \ and disappearing as you widen and narrow the browser, the main content adjusting\
    \ appropriately.\n\n## Responsive Design\n\nYou can use basic logic in your media\
    \ queries. This allows you to combine multiple conditions. For example, you can\
    \ use a logical AND:\n\n```\n@media screen (min-width: 640px) and (max-width:\
    \ 1136px) {\n  ...\n}\n```\n\nThe code above will invoke the CSS styles within\
    \ the query if a device's screen width is between 640px and 1136px. The min-width\
    \ property is the minimum width of the screen, and max-width the maximum. For\
    \ this media query to match, both conditions need to be true. It's also possible\
    \ to match queries if only one condition is true with a logical OR, which is represented\
    \ with a comma. The query below will apply on screen or print devices:\n\n```\n\
    @media only screen, print {\n  ...\n}\n```\n\nYou can also combine ANDs with ORs\
    \ to make more complex queries. Here's the current page rendered on a larger sized\
    \ phone, but in landscape mode:\n\n## The Building Blocks of Responsive Design\
    \ 27\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_39_0.png)\n\n2-3. The current\
    \ phone layout in landscape mode\n\nIn the screenshot, the screen is 732px wide,\
    \ which is above the 640px set above. Still, the aside doesn't quite fit into\
    \ the window, so let's hide it if the screen size is below 640px, or if the device\
    \ is in landscape mode:\n\n```\n@media screen and (max-width: 680px), screen and\n\
    \  (orientation: landscape) and (max-width: 750px) {\n  aside {\n    display:\
    \ none;\n  }\n}\n```\n\nAnd the corresponding media query for the listings section:\n\
    \n```\n@media screen and (max-width: 680px), screen and\n  (orientation: landscape)\
    \ and (max-width: 750px) {\n  section.showlisting {\n    width: 100%;\n  }\n}\n\
    ```\n\n## Responsive Web Design\n\nYou'll see that I added a max-width check,\
    \ to show the aside on tablets in landscape mode, but also to show how you can\
    \ combine logical checks together.\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_40_0.png)\n\
    \n## Logical Queries with Only and Not\n\nYou can also make precise media queries\
    \ using only and not. For example, this media query will match devices that are\
    \ at least 640px wide and exclude the print media type:\n\n```\n@media not print\
    \ and (min-width: 640px) {\n  ...\n}\n```\n\nIn contrast, this query will only\
    \ apply to screen devices that are at least 640px wide:\n\n```\n@media only screen\
    \ and (min-width: 640px) {\n  ...\n}\n```\n\n## The Building Blocks of Responsive\
    \ Design 29\n\n## Query Features\n\nThe width and height queries we've looked\
    \ at so far are some of the most widely used, but there are several other media\
    \ features that are also useful for checking against device features. These include\
    \ color capabilities, aspect ratio, orientation, resolution, and vendor-specific\
    \ features for Mozilla- and WebKit-based browsers. Most of these accept min- and\
    \ max prefixes that work in a similar way to the dimension queries above.\n\n\
    ### aspect-ratio\n\nThe aspect-ratio feature allows you to check the ratio of\
    \ horizontal pixels to vertical pixels, separated by a slash. For example:\n\n\
    ```\n@media screen and (min-aspect-ratio: 1/1) {\n  ...\n}\n```\n\nThe above rule\
    \ will match a device where the screen's width to height ratio is 1:1 or more,\
    \ so square or landscape.\n\nA common use for this would be to detect wider screens,\
