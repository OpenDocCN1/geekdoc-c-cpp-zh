    # The Building Blocks of Responsive Design 29


    # Query Features


    The width and height queries we''ve looked at so far are some of the most widely
    used, but there are several other media features that are also useful for checking
    against device features. These include color capabilities, aspect ratio, orientation,
    resolution, and vendor-specific features for Mozilla- and WebKit-based browsers.
    Most of these accept min- and max prefixes that work in a similar way to the dimension
    queries above.


    aspect-ratio


    The aspect-ratio feature allows you to check the ratio of horizontal pixels to
    vertical pixels, separated by a slash. For example:


    ```

    @media screen and (min-aspect-ratio: 1/1) {

    ...}

    ```


    The above rule will match a device where the screen''s width to height ratio is
    1:1 or more, so square or landscape.


    A common use for this would be to detect wider screens, useful when you''re displaying
    videos:


    ```

    @media screen and (min-aspect-ratio: 16/9) {

    ...}

    ```


    orientation


    As shown earlier, this feature checks if the device is in landscape or portrait
    mode. For example:'
- md: "\n```css\n@media all and (orientation: landscape) {\n...\n}\n```\n\nAnd:\n\n\
    ```css\n@media all and (orientation: portrait) {\n...\n}\n```\n\ncolor\n\nThis\
    \ feature checks if a device can support a certain bit-level of color. For example,\
    \ this is how to check that a device supports at least 8-bits of color (that is,\
    \ 256 colors):\n\n```css\n@media all and (min-color: 8) {\n...\n}\n```\n\ncolor-index\n\
    \nThis plays a role similar to color, but lets you check for the number of colors\
    \ instead of the bit-level:\n\n```css\n@media all and (min-color-index: 256) {\n\
    ...\n}\n```\n\n# The Building Blocks of Responsive Design\n\nmonochrome\n\nAgain,\
    \ similar to color, monochrome lets you check the levels of gray in a device:\n\
    \n```css\n@media all and (min-monochrome: 8) {\n...\n}\n```\n\nresolution\n\n\
    This feature targets devices that have high-resolution screens:\n\n```css\n@media\
    \ all and (min-resolution: 120dpi) {\n...\n}\n```\n\nscan\n\nThe scan media feature\
    \ lets you check the scanning process of TVs, the options being interlace or progressive:\n\
    \n```css\n@media all and (scan: progressive) {\n...\n}\n```\n\ngrid\n\ngrid is\
    \ used for checking if a device is a terminal-like device. This also includes\
    \ older phones (that is, non-smartphones), accessible phones (for those with poor\
    \ vision), and braille devices. It returns a boolean value if true:\n\n```css\n\
    @media grid {\n  ...\n}\n```\n\nAs you can see, through combinations of dimension-\
    \ and feature-based queries, you can construct complex stylesheets to target a\
    \ multitude of devices effectively with styles that work most efficiently for\
    \ them. This is the main point of media queries: they allow you to selectively\
    \ load CSS styles for particular device configurations.\n\n# Streamlining the\
    \ Example App\n\nNow that you have a basic understanding, let's continue to build\
    \ upon the media queries added earlier to make the example site tidier.\n\nFirst,\
    \ you can consolidate the queries already written, moving the classes into two\
    \ groups of media queries:\n\n```css\n/* Media Queries */\n/* For example, desktop\
    \ devices */\n@media screen and (min-width: 680px) {\n  aside {\n    width: 33%;\n\
    \  }\n\n  section.showlisting {\n    width: 66%;\n  }\n}\n\n/* For example, medium-width\
    \ screens or smaller screens in landscape */\n@media screen and (max-width: 680px),\
    \ screen and (orientation: landscape) and (max-width: 750px) {\n  aside {\n  \
    \  display: none;\n  }\n```\n\n# The Building Blocks of Responsive Design\n\n\
    ```css\nsection.showlisting {\n  width: 100%;\n}\n```\n\nMuch tidier! You can\
    \ keep adding new styles for each query into these sections.\n\nLet's look back\
    \ to our demo site specification outlined in Chapter 1 for what else needs to\
    \ be optimized for each screen size. The next step will be hiding the TV show\
    \ description on small screens, and shorten it on medium-sized screens.\n\nIt\
    \ would be a lot easier to do this if the description text had a class, add one\
    \ to each instance of the p tag that contains the show description:\n\n```html\n\
    <section class=\"tvshow\">\n  <h3>Show/</h3>\n  <img src=\"http://placeholder.it/350x150\"\
    \ class=\"thumbnail\">\n  <p class=\"showdescription\">Lorem ipsum dolor sit amet,\
    \ consectetur adipiscing elit.</p>\n</section>\n```\n\nLet's add new media queries\
    \ to accommodate the various sizes we aim to support, and in doing so, tidy up\
    \ the existing ones.\n\nThe specific widths at which we want our design to reflow\
    \ are known as breakpoints. The breakpoints we'll add are not exhaustive: there's\
    \ a huge range of device sizes, and more are appearing all the time, so it's futile\
    \ to try to target each device with separate queries. A better approach is to\
    \ assess the points at your design needs to reflow, and create media queries for\
    \ those breakpoints. This is the beauty of responsive web design: you can ensure\
    \ that each device will get an appropriate layout without having to design separately\
    \ for each device.\n\nAdd the following breakpoints and refactor our existing\
    \ styles into them:\n\n```css\n/* Media Queries */\n\n/* For example, older phones\
    \ */\n@media only screen and (min-width: 320px) {\n  aside {\n    display: none;\n\
    \  }\n\n  section.showlisting {\n    width: 100%;\n  }\n\n  .showdescription {\n\
    \    display: none;\n  }\n}\n\n/* For example, newer phones */\n@media only screen\
