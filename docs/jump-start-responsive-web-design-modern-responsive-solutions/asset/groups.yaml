    \ as an element several deep may end up smaller or larger than you expect.\n\n\
    # Rem\n\nThe rem unit stands for \"root em\", and the sizing representation of\
    \ the unit is the same. But \"root\" implies that the relative sizing is calculated\
    \ from one base element—which is the html element—rather than the immediate containing\
    \ element. This gives you a more predictable alternative to ems, as it's easier\
    \ to tell what the size is relative to.\n\nAs an example, let's try applying rem\
    \ sizing to the demo.\n\nAdd a base font size to the html of 12px (assuming a\
    \ default of 16px):\n\n```\nhtml {\n  font-size: 75%;\n}\n```\n\nThen inside the\
    \ tablet and desktop media queries, add font sizes for the larger screen sizes:\n\
    \n```\n@media only screen and (min-width: 768px) {\n  html {\n    font-size: 1rem;\n\
    \  }\n}\n\n@media only screen and (min-width: 992px) {\n  html {\n    font-size:\
    \ 1.25rem;\n  }\n}\n```\n\nNot much changes when applied to the demo site, as\
    \ it's effectively the same sizing. Now add the following styles to the nested\
    \ list example from above:\n\n```\naside ul {\n  font-size: 0.75rem;\n}\n```\n\
    \nNow the sizing is 3/4 of the current base font size.\n\n# Site Name\n\n- Menu\
    \ Item Menu Item Menu Item\n\n# Site Introduction\n\nLorem ipsum dolor sit amet,\
    \ consectetur elit. Septem aut illi non suo, sed ullamcorper nominat sunt. Itaque\
    \ risus rationem adiunct et effecta sunt. Vidimus igitur quisiscere infantes quantum\
    \ possit. Quod iam metare non.\n\n- one\n- sub item\n- two\n- sub item\n- three\n\
    - sub item\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_109_0.png)\n\nLorem ipsum\
    \ dolor sit amet, consectetur elit. Lorem ipsum dolor sit amet, consectetur elit.\
    \ Lorem ipsum dolor sit amet, consectetur elit. Lorem ipsum dolor sit amet, consectetur\
    \ elit. Lorem ipsum dolor sit amet, consectetur elit.\n\n4-8. Rem cascade example\n\
    \nSizes based on percentages, ems and rem are not the only options available to\
    \ you. There are actually nine in total. Some are quite obscure, or not really\
    \ necessary, but others are more useful after an initial learning curve. Take,\
    \ for example, the vw and v units, which are a percentage of the width and height\
    \ respectively.\n\nThere is vmin (based on which is smallest of the viewport height\
    \ and width) and vmax (based on which is largest of the viewport height and width).\
    \ These are amazingly flexible, as the size will automatically react to the size\
    \ of the viewport, but you can lose track of what sizes actually are.\n\nTake\
    \ a viewport that's 1000px wide and 800px:\n\n- 1vw is 1% of the total width,\
    \ i.e. 10px\n- 100vw is 100% of the width, i.e. 1000px\n- 50vw is 50% of the width,\
    \ i.e. 500px\n- 1vh is 1% of the height, i.e. 8px\n- 1vmin is 1% of the smallest\
    \ of the two sizes, i.e. 8px\n- 1vmax is 1% of the largest of the two sizes, i.e.\
    \ 100px\n\nTry adding the following to the body element:\n\n```\nbody {\n  font-size:\
    \ 1.5vw;\n}\n```\n\nYour base font size will now be 1.5% of your body width, which\
    \ will depend on the width of browser window. At first, it looks like viewport\
    \ sizing is the answer to your responsive dreams, but you'll notice that, as you\
    \ shrink the browser window, the font size becomes unreadable, as 1.5% of a small\
    \ viewport width is a tiny font.\n\n# Responsive Text\n\nOf course, you could\
    \ fix this with breakpoints, but then that defeats the purpose of using this sizing\
    \ unit in the first place. There's a clever workaround for this, thanks to Zell\
    \ Liew and Mike Reithuller:\n\n```\nbody {\n  font-size: calc(16px + 0.25vw);\n\
    }\n/* The above won't work in Safari, but the below does */\nbody {\n  font-size:\
    \ calc(100% + 0.25vw);\n}\n```\n\nThis works by using the CSS calc function to\
    \ calculate a base font size (16px or 100%) and then adding 0.25% of the viewport\
    \ width to it, reducing the amount of variation between sizes as the viewport\
    \ dimensions change. You're free to change the values in the calculation to suit\
    \ your needs.\n\n> Browser Support\nSome viewport sizing and the calc functions\
    \ are not fully supported in all browsers, with even recent versions of Internet\
    \ Explorer and Edge not supporting the vmax property, and older versions of the\
    \ Android browser not supporting all calculation types in calc.\n\nFor the remainder\
    \ of this chapter, I'll use the em unit, but before refactoring the demo site\
    \ text, let's return to typography and optimizing it for the web.\n\n# Creating\
    \ Readable Text\n\nYou can use all the typographical properties outlined earlier\
    \ in this chapter in conjunction with the sizing units also discussed, allowing\
    \ for fine-grained tweaking of text to make it the most readable on any device.\n\
    \nThere are, of course, many schools of thought on what \"good text\" looks like,\
    \ and it depends on how much text your pages show and how important it is to those\
    \ pages. The example site in this book has a small amount of text, so it's relatively\
    \ easy to make it readable.\n\n# 100 Jump Start Responsive Web Design\n\nText-heavy\
    \ sites such as a blog will need more thought and consideration.\n\nYou should\
    \ consider what font faces, styles, sizes, and layouts suit various screen sizes\
    \ and resolutions and balance this with any style guides your project may have.\n\
    \nLet's start overuling the text of the demo site by tweaking the base text properties:\n\
    \n```\nbody {\n  font-size: 1em;\n}\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_112_0.png)\n\
    \nThis sets the default font size to be the browser default, likely 16px as discussed\
    \ earlier.\n"
