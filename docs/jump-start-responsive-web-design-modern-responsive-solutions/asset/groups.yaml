    \  flex-wrap: wrap;\n  gap: 10px;\n}\n\n.card {\n  flex: 1 1 calc(25% - 10px);\n\
    \  border: 1px solid #ccc;\n  padding: 1rem;\n  text-align: center;\n}\n\n@media\
    \ (max-width: 768px) {\n  .card {\n    flex: 1 1 calc(50% - 10px);\n  }\n}\n\n\
