  - "[PAGE 78]\n\n# Jump Start Responsive Web Design\n\nEverything that you want flexbox\
    \ to manage is contained within a “flex container”. Much like earlier examples,\
    \ begin with the code from the start of this chapter and continue to use a containing\
    \ div:\n\n```\n<div class=\"container\">\n  ...\n</div>\n```\n\nAnd the CSS for\
    \ this container:\n\n```\n.container {\n  display: flex;\n  flex-flow: row wrap;\n\
    }\n```\n\nThe display property is set to flex to enable flex layout. The flex-flow\
    \ property is shorthand for two other properties.\n\nThe first of these properties\
    \ is flex-direction, which defines how the individual items inside a flex container\
    \ will be placed. The most common values are row and column. Using row will place\
    \ items horizontally (left to right or to left, depending on your preference).\
    \ Column works similarly, but instead places elements from top to bottom. You\
    \ can reverse the direction by appending with -reverse.\n\nThe flex display mode\
    \ is one-dimensional (running either horizontally or vertically) and will attempt\
    \ to keep fitting items on one line. The flex-wrap property determines what will\
    \ happen if the container can’t fit all items on one line. The items can be set\
    \ to wrap to the next line or be forced into one line with nowrap.\n\nNext, let’s\
    \ handle the header, nav, and footer page elements, which fill the entire width\
    \ of the page container. Replace any existing styles with the following:"
  - "[PAGE 79]\n\n# Better Responsive Structures with Grid Systems 67\n\n```\nheader,\
    \ nav, footer {\n  flex: 100%;\n}\n```\n\nflex is shorthand for three combined\
    \ properties, in the following order:\n\n+   - flex-grow determines how much space\
    \ an item is allowed to use in a container, and the sizes are relative to each\
    \ other. If every item in a container has a flex-grow value of 1, then each item\
    \ is evenly distributed. If one item has a value of 2, it will take up twice as\
    \ much space as the other items.\n- flex-shrink determines whether or if so, to\
    \ which value. The default is 1, so if you want to keep proportions no matter\
    \ what, leave the value empty.\n- flex-basis allows you to set a default item\
    \ size before space is distributed, any of the typical CSS sizing units.\n\nMoving\
    \ to the main content area, again replacing any existing styles, you can also\
    \ remove any of the previous methods for resizing elements inside media queries:"
  - "[PAGE 80]\n\n# 68 Jump Start Responsive Web Design\n\n```\nmain {\n  flex-grow:\
    \ 2;\n  flex-basis: 66%;\n}\naside {\n  flex-grow: 1;\n  flex-basis: 33%;\n}\n\
    ...\n@media only screen and (min-width: 320px) {\n  aside {\n    display: none;\n\
    \  }\n\n  section.showlisting {\n  }\n\n  .showdescription {\n    display: none;\n\
    \  }\n}\n@media only screen and (min-width: 992px) {\n  aside {\n    display:\
