    \ 元素设置为默认隐藏：\n\n```\nvideo {\n  display: none;\n  width: 100%;\n  height: auto;\n\
    }\n```\n\n# 关于 JavaScript 的说明\n\n本章和第 6 章中的 JavaScript 代码大多是独立演示的，因为它们提供了单独的选择。如果你想合并并使用所有示例，你需要进一步计划，特别是要尽量减少所需的事件处理程序数量。\n\
