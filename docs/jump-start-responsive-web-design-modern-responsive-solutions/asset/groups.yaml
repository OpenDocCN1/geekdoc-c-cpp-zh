  - "[PAGE 38]\n\n# Jump Start Responsive Web Design\n\nYou can use basic logic in\
    \ your media queries. This allows you to combine multiple conditions. For example,\
    \ you can use a logical AND:\n\n```\n@media only screen (min-width: 640px) and\
    \ (max-width:\n1136px) {\n  ...\n}\n```\n\nThe code above will invoke the CSS\
    \ styles within the query if a device's screen width is between 640px and 1136px.\
    \ The min-width property is the minimum width of the screen, and max-width the\
    \ maximum.\n\nFor this media query to match, both conditions need to be true.\
    \ It's also possible to match queries if only one condition is true with a logical\
