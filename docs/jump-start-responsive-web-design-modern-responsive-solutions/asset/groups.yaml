    \ 63\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_75_0.png)\n\n3-12. The page with\
    \ a wider aside\n\nAs the browser window changes size, you'll see page elements\
    \ shrink and grow smoothly, perfect for responsive web design. But notice what\
