- pgno: 327
  md: "```\n```objective-c\n- (void)observeValueForKeyPath:(NSString *)keyPath\n \
    \                    ofObject:(id)object\n                       change:(NSDictionary\
    \ *)change\n                      context:(void *)context {\n    if ([keyPath\
    \ isEqualToString:@\"countOne\"]) {\n        [self updateDisplayOne:[object valueForKeyPath:keyPath]];\n\
    \    } else if ([keyPath isEqualToString:@\"countTwo\"]) {\n        [self updateDisplayTwo:[object\
    \ valueForKeyPath:keyPath]];\n    }\n}\n- (void) finalize {\n    [counter removeObserver:self\
    \ forKeyPath:@\"countOne\"];\n    [counter removeObserver:self forKeyPath:@\"\
    countTwo\"];\n    [super finalize];\n}\n@end\n```\n```\n\nI'm not particularly\
    \ proud of code like this. For the most part, you've seen that we can wiggle out\
    \ of a lot of conditionals when we code in Cocoa using Objective-C. This gives\
    \ us a cleaner path through the code.\n\nIn the next two sections I'll show you\
    \ two different approaches. First, we'll use KVC to call the correct method depending\
    \ on the key of the notification we are sent. Second, we'll introduce dedicated\
    \ observer objects. The difference between these two approaches comes down to\
    \ making the decision at the time you register as an observer or when you receive\
    \ the notification. I prefer using dedicated observers, but I'm not religious\
    \ about it.\n\n# ## 20.10 Selecting Methods Using KVC\n\nWhen we receive a notification,\
    \ it is because of changes either to countOne or to countTwo. So, one approach\
    \ we could take is to rename the methods for updating the two displays:\n\nDownload\
    \ KVC/CountDisplay.m\n\n```\n```objective-c\n- (void) updateDisplayForCountOne:\
    \ (NSNumber *) newValue {\n    [displayFieldOne setIntegerValue:[newValue integerValue]];\n\
    }\n- (void) updateDisplayForCountTwo: (NSNumber *) newValue {\n    [displayFieldTwo\
    \ setIntegerValue:[newValue integerValue]];\n}\n```\n```"
