- pgno: 297
  md: '# # Key Value Coding


    It''s so easy to miss the point of Key Value Coding. Most people focus on the
    mechanism and not on what it allows you to do. Let''s get some of the how out
    of the way so that we can think a bit more about the why and when.


    Suppose you have a class named ProgBook, and it has a property title. Then if
    jrport is an instance of ProgBook, you would get its title like this:


    ```

    `NSString *bookTitle = [jrport title];`

    ```


    You might also use this dot syntax to access the property.


    ```

    `NSString *bookTitle = jrport.title;`

    ```


    With Key Value Coding, which we''ll call KVC from now on, you would write something
    more like this:


    ```

    `NSString *bookTitle = [jrport valueForKey:@"title"];`

    ```


    That looks horrible. There are so many ways in which that is clearly worse than
    the direct approach. First, it''s more typing. Second, we''re passing the name
    of the variable in as a string, so there is no compile-time checking. Third, why
    would anyone come up with such a stupid way of accessing variables?


    KVC is the first step in our path to understanding Key Value Observing, Bindings,
    and Core Data. In this chapter, you''ll get a feel for what it is, how you''ll
    use it, and why you''ll want to use it.'
  merge: -1
  img_proc: true
- pgno: 298
  md: "# 19.1  Treating Objects Like Dictionaries\n\nOnce we calm down, we remember\
    \ that we’ve seen notation like valueForKey: before. This looks a lot like the\
    \ objectForKey: method we used when we worked with dictionaries.\n\nWe started\
    \ out by pulling out specific entries from the dictionary using hard-coded keys.\
    \ When we got to Chapter 16, *Displaying Data in a Table*, everything changed.\
    \ We were filling tables by keying off the column identifier. This meant that\
    \ we filled the table with the contents of these dictionaries without writing\
    \ a lot of conditional code. With KVC, we can pull the same tricks with objects\
    \ and their variables.¹\n\nWe’re going to build an application that lets you type\
    \ *author* or *title* into one text field, and the author’s name or the book’s\
    \ title will appear in the other text field. The GUI will look like this:\n\n\
    ![](img/9355405953264484a02198b0e3d25b7e_298_0.png)\n\nCreate a new Cocoa application\
