- pgno: 388
  md: "natural to you. Next, let’s extend this example by passing blocks to a collection.\n\
    \n# 24.5 Blocks and Collections\n\nApple has added dozens of methods to let you\
    \ pass blocks into collections for sorting or transforming the elements in Snow\
    \ Leopard. As an example of how to use them, let’s put a handful of integers into\
    \ an NSArray and then iterate through the array and multiply each element by 3.\n\
    \nCreate a new Cocoa project named CollectionCalc. In applicationDidFinishLaunching:,\
    \ we’ll create and display our initial array, multiply each of the elements by\
    \ 3, and display the result.\n\n```\n```objective-c\n- (void)applicationDidFinishLaunching:(NSNotification\
    \ *)aNotification {\n    NSArray *numbers = [self createArray];\n    NSLog(@\"\
    Elements in the initial array:%@\", numbers);\n    NSArray *transformedNumbers\
    \ = [self tripleElementsIn: numbers];\n    NSLog(@\"Elements in the tripled array:%@\"\
    , transformedNumbers);\n}\n```\n```\n\nThere’s not much to the createArray method.\
    \ You just need to remember that arrays can contain only objects, not primitives,\
    \ so we have to convert our NSIntegers to NSNumbers.\n\n```\n```objective-c\n\
    - (NSArray *) createArray {\n    return [NSArray arrayWithObjects:[NSNumber numberWithInt:5],\n\
    \                                    [NSNumber numberWithInt:2],\n           \
    \                         [NSNumber numberWithInt:17],\n                     \
    \               [NSNumber numberWithInt:3],\n                                \
    \    [NSNumber numberWithInt:14],nil];\n}\n```\n```\n\nWe will transform the array\
    \ in the tripleElementsIn: method. If we weren’t using blocks, we’d just use the\
    \ for in fast enumeration introduced in Objective-C 2.0. In this case, we would\
    \ be responsible for enumerating through the array. After the enumerator moves\
    \ to the next element, it asks us what work needs to be done.\n\n```\n```objective-c\n\
    for (NSNumber *element in originalArray) {\n    // do some work\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 389
  md: "With Snow Leopard, we can call this method on an array:\n\n```\n```objective-c\n\
    - (void)enumerateObjectsUsingBlock:\n             (void (^)(id obj, NSUInteger\
    \ idx, BOOL *stop))block\n```\n```\n\nNow we’re telling the array to apply the\
    \ work we pass in to each of its elements. We aren’t calling out the enumeration\
    \ as a separate activity. Here’s how we use this technique to triple each value\
    \ in the array:\n\n```\n```objective-c\n(NSArray *) tripleElementsIn: (NSArray\
    \ *) originalArray {\n    NSMutableArray *tempArray =\n        [[NSMutableArray\
    \ alloc] initWithCapacity:[originalArray count]];\n    [originalArray enumerateObjectsUsingBlock:\n\
    \                         ^(id obj, NSUInteger idx, BOOL *stop) {\n        [tempArray\
    \ addObject:[NSNumber numberWithInt:3 * [obj intValue]]];\n    }];\n    return\
    \ tempArray;\n}\n```\n```\n\nNotice in this array example that the block is passed\
    \ three parameters. The first parameter, obj, is the pointer to the current element.\
    \ That gives us a handle to the object whose value we’re tripling. The second\
    \ parameter is the index of the current element. We don’t have any need for it\
    \ in our current application. The final parameter acts as a break. It is a BOOL\
    \ that allows you to stop iterating through the array when you set its value to\
    \ YES. You might, for example, want to traverse an array until you find the first\
    \ occurrence of something. At that point, you would set stop to YES.\n\nAt this\
    \ point, there’s probably a “What’s the big deal?” welling up inside you. Good\
    \ question. Let’s dig a little deeper. Remember, blocks are objects. We can declare\
    \ and initialize them and pass them around instead of just declaring them in place.\
    \ Let’s see how that changes our code.\n\n# 24.6 Declaring, Defining, and Using\
    \ Blocks\n\nSo far, we’ve described our blocks inline. When blocks are very short,\
    \ this is a convenient way to capture the work that needs to be done. But blocks\
    \ are also objects, so we can declare them and use them as we would other objects.\
    \ For example, let’s declare a block that multiplies an NSNumber and an NSInteger\
    \ and returns their product as an NSNumber. We’ll create both an instance variable\
    \ and the corresponding property in CollectionCallAppDelegate.h."
  merge: -1
  img_proc: true
- pgno: 390
  md: "Download Blocks/CollectionCalc2/CollectionCalcAppDelegate.h\n\n```\n```objc\n\
    #import <Cocoa/Cocoa.h>\n\n@interface CollectionCalcAppDelegate : NSObject <NSApplicationDelegate>\
    \ {\n    NSNumber *(^multiply)(NSNumber *, NSInteger);\n}\n@property(copy) NSNumber\
    \ *(^multiply)(NSNumber *, NSInteger);\n@end\n```\n```\n\nDon't forget to synthesize\
    \ this property at the top of CollectionCalcAppDelegate.m:\n\nDownload Blocks/CollectionCalc2/CollectionCalcAppDelegate.m\n\
    \n```\n```objc\n@synthesize multiply;\n```\n```\n\nAdd the block initialization\
    \ to the applicationDidFinishLaunching: method:\n\nDownload Blocks/CollectionCalc2/CollectionCalcAppDelegate.m\n\
    \n```\n```objc\n- (void)applicationDidFinishLaunching:(NSNotification *)aNotification\
    \ {\n    NSArray *numbers = [self createArray];\n    self.multiply = ^(NSNumber\
    \ *x, NSInteger y) {\n        return [NSNumber numberWithInt:[x intValue] * y];\n\
    \    };\n    NSLog(@\"Elements in the initial array:%@\", numbers);\n    NSArray\
    \ *transformedNumbers = [self tripleElementsIn:numbers];\n    NSLog(@\"Elements\
    \ in the tripled array:%@\", transformedNumbers);\n}\n```\n```\n\nIf you're passing\
    \ a block out of the scope where it was created, you need to copy it. Otherwise,\
    \ the block may be destroyed when the method containing the block initialization\
    \ returns. This is why we are using the property for multiply. We are taking advantage\
    \ of the copy memory attribute that we set on multiply.\n\nNow use this block\
    \ from inside the block we are using when enumerating the array:\n\nDownload Blocks/CollectionCalc2/CollectionCalcAppDelegate.m\n\
    \n```\n```objc\n-(NSArray *) tripleElementsIn:(NSArray *) originalArray {\n  \
    \  NSMutableArray *tempArray =\n        [[NSMutableArray alloc] initWithCapacity:[originalArray\
    \ count]];\n    [originalArray enumerateObjectsUsingBlock:\n        ^(id obj,\
    \ NSUInteger idx, BOOL *stop) {\n            [tempArray addObject:multiply(obj,3)];\n\
    \        }];\n    return tempArray;\n}\n```\n```"
