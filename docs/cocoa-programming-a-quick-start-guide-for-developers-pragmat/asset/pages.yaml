  md: "```\n```objective-c\n#import <Cocoa/Cocoa.h>\n#import \"ActivityMonitorDelegate.h\"\
    \n@class CurrentApp;\n\n@interface ActivityController : NSObject <ActivityMonitorDelegate>\
    \ {\n    CurrentApp *currentApp;\n    NSTextField *activityDisplay;\n}\n@property\
    \ CurrentApp *currentApp;\n@property IBOutlet NSTextField *activityDisplay;\n\
    @end\n```\n```\n\nClick Build & Run. There should be no warnings, but nothing\
    \ much should happen when you run the application.\n\n# 12.4 Requiring Methods\n\
    \nRemove the `@optional` line from the protocol, and click Build & Run. You’ll\
    \ get warnings like these:\n\n+   - Incomplete implementation of class `ActivityController`\n\
    +   - Method definition for `-applicationDidTerminate:` not found\n+   - Method\
    \ definition for `-applicationDidLaunch:` not found\n+   - Class `ActivityController`\
    \ does not fully implement the `ActivityMonitorDelegate` protocol\n\nNow that\
    \ applicationDidLaunch: and applicationDidTerminate: are required, we’ll need\
    \ to implement them in ActivityController.m:\n\n```\n```objective-c\n-(void) applicationDidLaunch:\
    \ (CurrentApp *) app {\n    [self.activityDisplay setStringValue:@\"Launched\"\
    ];\n}\n-(void) applicationDidTerminate: (CurrentApp *) app {\n    [self.activityDisplay\
    \ setStringValue:@\"Terminated\"];\n}\n```\n```\n\nClick Build & Run, and the\
    \ warnings are gone again. We’ve set up the delegate and created a protocol that\
    \ declares the methods we need. We’ve used the protocol and implemented the required\
    \ methods. Now let’s finish by replacing posting notifications in CurrentApp with\
    \ sending messages to the delegate."
