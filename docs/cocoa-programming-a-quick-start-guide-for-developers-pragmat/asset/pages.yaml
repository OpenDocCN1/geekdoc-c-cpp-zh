  md: "# 14.10  Loading the Window Nib\n\nOpen MainMenu.xib. Delete the CurrentApp\
    \ object, the ActivityController object, and the NSWindow object along with the\
    \ ContentView inside of it. There’s not much left—just the app delegate, the menu,\
    \ and a couple of stock items.\n\n![](img/9355405953264484a02198b0e3d25b7e_238_0.png)\n\
    \n```\nHelloApplication.xcodeproj\n```\n\nThe app delegate no longer has a connection\
    \ to the model, the window, or the view controller. We’ll figure out where to\
    \ reconnect all of these objects in a bit. Right now we can clear out the header\
    \ file for our app delegate:\n\nDownload MultipleNibs/HelloApplication20/HelloApplicationAppDelegate.h\n\
    \n```\n```objective-c\n#import <Cocoa/Cocoa.h>\n\n@interface HelloApplicationAppDelegate\
    \ : NSObject <NSApplicationDelegate> {\n}\n\n@end\n```\n```\n\nIn the implementation\
    \ file, we’ll instantiate the window controller and load its nib file:\n\nDownload\
    \ MultipleNibs/HelloApplication20/HelloApplicationAppDelegate.m\n\n```\n```objective-c\n\
    #import \"HelloApplicationAppDelegate.h\"\n#import \"MyWindowController.h\"\n\n\
    @implementation HelloApplicationAppDelegate\n\n- (void)applicationDidFinishLaunching:(NSNotification\
    \ *)aNotification {\n    [[MyWindowController alloc] initWithWindowNibName:@\"\
    MainWindow\"];\n}\n@end\n```\n```\n\nThe initWithWindowNibName: takes the name\
    \ of the nib as an NSString. This means there can’t be any compile-time checking\
    \ that you’ve typed the name correctly. You type in the name of the nib but not\
    \ the suffix"
