- pgno: 423
  md: "We have a race condition. There is no guarantee that calculateColor will be\
    \ executed before self is drawn in the main queue. This illustrates the problem\
    \ that we avoided in the previous section by using serial dispatch queues. In\
    \ this code, we send the calculation of the tile’s color to a global concurrent\
    \ thread using dispatch_async(). We don’t wait for the color calculation to complete\
    \ when we send an asynchronous request to the main queue to draw the tile.\n\n\
    Let’s make one tiny change to the code. Change the first call to the function\
    \ dispatch_async() in the cycle to dispatch_sync().\n\n```\n```objc\n-(void) cycle()\
    \ {\n    dispatch_sync(\n        dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT,\
    \ 0), ^{\n            [self calculateColor];\n        });\n    dispatch_async(dispatch_get_main_queue(),\
    \ ^{\n        [self.grid tilesAddedObject:self];\n        [self.grid setNeedsDisplayInRect:self.frame];\n\
    \    });\n    if (self.frame.size.width > 1) {\n        [self split];\n    }\n\
    }\n```\n```\n\nNow the calculation of the tile’s color completes before we push\
    \ the request to draw the tile to the main thread. This version runs in the same\
    \ way as the version using the serial queues without the overhead of creating\
    \ those queues.\n\nIn this quick introduction to dispatch queues, we looked at\
    \ the three basic types of queues and how to send tasks to them using the functions\
    \ dispatch_async() and dispatch_sync(). If this example program were the ends\
    \ and not the means, we would have a lot of tuning left to do. We could streamline\
    \ the drawing routine so that we don’t redraw cells where nothing is changing.\
    \ We would also speed up the algorithm without losing accuracy.\n\nYou can gain\
    \ a lot of speed and responsiveness using queues, but there are costs. You need\
    \ to make sure you don’t accidentally introduce unintended behavior, and you have\
    \ to make sure that adding the complexity that queues require really results in\
    \ perceivable improvements."
  merge: -1
