  md: "Next let’s allow users to pause and resume the spinning:\n\n```\n```objective-c\n\
    - (IBAction)toggleIsSuspended:(id)sender {\n    [queue setSuspended:![queue isSuspended]];\n\
    }\n```\n```\n\nWhen you send the queue the message setSuspended:YES, the queue\
    \ will be paused. As with cancel, the progress indicators that are currently spinning\
    \ will continue to spin until they have finished, but no further indicators will\
    \ spin until you send the queue the message setSuspended:NO.\n\nFinally, we can\
    \ create an array of the operations in the queue and ask each one if it is executing\
    \ or in a ready state. Operations that are executing are also considered to be\
    \ ready.\n\n```\n```objective-c\n- (IBAction)queueStatus:(id)sender {\n    NSArray\
    \ *ops = [queue operations];\n    int executing = 0;\n    int ready = 0;\n   \
    \ for (NSOperation *operation in ops) {\n        if ([operation isExecuting])\
    \ executing++;\n        if ([operation isReady]) ready++;\n    }\n    NSLog(@\"\
    Status for %d operations: executing %d and %d are waiting.\",\n          [queue\
    \ operationCount], executing, ready - executing);\n}\n```\n```\n\nThis will generate\
    \ reports like the following in the Console. After nine operations have completed,\
    \ this is the report that I get:\n\n```\n```text\nStatus for 16 operations: executing\
    \ 3 and 13 are waiting.\n```\n```\n\nHead over to Interface Builder, and add these\
    \ three buttons to the top of the window:\n\n![](img/9355405953264484a02198b0e3d25b7e_404_0.png)\n\
    \nWire your actions to these buttons. Save, and click Build & Run. The buttons\
    \ should work just as I’ve described them."
