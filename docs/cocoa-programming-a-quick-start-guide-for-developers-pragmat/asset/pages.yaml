    \ but more importantly, it’s kind of fun to watch.\n\n# ### 26.7 Synchronizing\
    \ on the Main Queue\n\nWe’ve sped up the application—it now looks and feels better—but\
    \ we’ve also introduced a problem. Because this is a concurrent application, you\
    \ may see this message in your Console each time you run the application. When\
    \ the minimum size is small enough, I fairly consistently see this warning:\n\n\
    ```\n*** -[NSCFArray initWithObjects:count:]:\n    attempt to insert nil object\
    \ at objects[5733]\n```\n\nThe problem is that we are adding objects to and removing\
    \ objects from the `tiles` property, an array belonging to our `Grid` object.\
    \ We are adding the objects to the array from the main queue, which is a global\
    \ serial queue, but not removing them from that queue, so the program may be checking\
    \ whether the tile needs to be drawn after it has been removed from the array.\
    \ We can fix the problem by dispatching the call to remove objects from the `tile`\
    \ array to the main queue.\n\n```\n- (void) split {\n    CGFloat size = (self.frame.size.width)/2;\n\
    \    CGFloat x = self.frame.origin.x;\n    CGFloat y = self.frame.origin.y;\n\
    \    dispatch_async(\n        dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT,\
    \ 0), ^{\n        [self tileWithX:x Y:y size:size];\n        [self tileWithX:x\
    \ Y:y+size size:size];\n        [self tileWithX:x+size Y:y size:size];\n     \
    \   [self tileWithX:x+size Y:y+size size:size];\n    });\n    dispatch_async(dispatch_get_main_queue(),\
    \ ^{\n        [self.grid.tiles removeObject:self];\n    });\n}\n```\n\nThe main\
    \ queue is a serial queue, so by accessing the array only from the main queue,\
    \ we can ensure that there will be no resource contention. The main queue is also\
    \ where events are processed, so that is where you can do any other UI tasks you\
    \ need to do.\n\nYou might also notice that the animation is a bit different.\
    \ I preferred the way it was before with an initial coloring of the entire view\
    \ and"
