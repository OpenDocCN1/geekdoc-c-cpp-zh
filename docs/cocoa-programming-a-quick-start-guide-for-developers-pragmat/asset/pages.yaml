- pgno: 330
  md: "```\n```objectivec\n-(void) updateDisplayTwo: (NSNumber *) newValue {\n   \
    \ [displayFieldTwo setIntegerValue:[newValue integerValue]];\n}\n-(void) awakeFromNib\
    \ {\n    observerOne = [[Observer alloc]\n                    initWithTarget:self\n\
    \                            action:@selector(updateDisplayOne:)];\n    observerTwo\
    \ = [[Observer alloc]\n                    initWithTarget:self\n             \
    \               action:@selector(updateDisplayTwo:)];\n    [counter addObserver:observerOne\n\
    \               forKeyPath:@\"countOne\"\n                  options:NSKeyValueObservingOptionNew\n\
    \                  context:NULL];\n    [counter addObserver:observerTwo\n    \
    \           forKeyPath:@\"countTwo\"\n                  options:NSKeyValueObservingOptionNew\n\
    \                  context:NULL];\n}\n-(void) finalize {\n    [counter removeObserver:observerOne\
    \ forKeyPath:@\"countOne\"];\n    [counter removeObserver:observerTwo forKeyPath:@\"\
    countTwo\"];\n    [super finalize];\n}\n@end\n```\n```\n\nSmall, single-purpose\
    \ classes like Observer can unclutter your code. Each instance of the Observer\
    \ knows which object to send which method when it gets called.\n\n# 20.12 Updating\
    \ Dependent Variables\n\nSometimes within a class you have variables that depend\
    \ on the values of other variables. The dependent variables can always be recalculated\
    \ from the independent variables. Suppose, for example, we want to introduce a\
    \ new variable called `totalCount` in `UpOrDown` that represents the sum of `countOne`\
    \ and `countTwo`. Any time a user clicks either of the steppers, the value of\
    \ `totalCount` will change.\n\nWe need to be able to do the following:\n\n+  \
    \ * Register that `totalCount` depends on both `countOne` and `countTwo`.\n+ \
    \  * Add an observer that listens for changes in `totalCount`. It actually will\
    \ listen for changes in any of the attributes that we registered in the previous\
    \ step.\n+   * Specify what we want to have happen when we receive a notification\
    \ of a change in `totalCount`."
