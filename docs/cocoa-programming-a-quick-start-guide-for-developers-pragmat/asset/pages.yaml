- pgno: 48
  md: 'Let''s assume you have instantiated the two objects involved in this action.
    You have an instance of NSButton named backButton and an instance of WebView named
    myWebView. When the user clicks the Back button, essentially this message is sent:


    ```

    `[myWebView goBack]`

    ```


    The square brackets and everything in between make up the *message expression*.
    In this simplest of cases, there are only two parts: the receiver and the message.
    The myWebView object is the receiver. It is the target—the object to which you
    are sending the message. In this example, the message is goBack.


    We are sending a message with no arguments. In this form, the call will look like
    this:


    ```

    `[receiver message]`

    ```


    Depending on the programming language you use now, this might look like a function
    call or method call. In other words, in your own language the following Objective-C
    message:


    ```

    `[myWebView goBack]`

    ```


    looks something like this:


    ```

    `myWebView.goBack()`

    ```


    As you would expect, you can chain messages together in much the same way as you
    would chain methods. In Java or C#, you might write something like this:


    ```

    `myWebView.oneMethod().anotherMethod()`

    ```


    This invokes oneMethod() on myWebView, and then anotherMethod() is called on the
    result.


    In Objective-C you would write this same fictional code as follows:


    ```

    `[[myWebView oneMethod] anotherMethod]`

    ```


    You read these nested calls from the inside out. First the message oneMethod is
    sent to myWebView. Then the result of this call is the target of the message anotherMethod.


    What messages can you really send to myWebView? You''ll spend a lot of time looking
    through the documentation of Apple''s APIs. Let''s take a look at the docs for
    WebView and find a description of this goBack method.'
  merge: -1
  img_proc: true
