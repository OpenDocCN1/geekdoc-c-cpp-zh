  md: '# Chapter 26


    # Dispatch Queues


    As computers ship with more cores, one way to make your application faster and
    more responsive is to keep those processors busy. In the previous chapter, you
    learned the easiest way for your application to take advantage of concurrency
    is to operation queues.


    Sometimes you need finer control or need to integrate with system-level activities.
    If you’re writing an iPhone app or a desktop app that targets Leopard or earlier,
    you’re out of luck. You have to use threads. It’s hard to write and schedule threads.
    It’s easy to make a mistake when you’re using threads and actually make your app
    worse.


    Apple introduced Grand Central Dispatch (GCD) in Snow Leopard. GCD puts the operating
    system in charge of managing the tasks in the threads. You add tasks to dispatch
    queues, and GCD takes care of when to send the tasks in the various queues off
    to a processor.


    In this chapter, you’ll learn how and when to use the different types of dispatch
    queues. We’re just skimming the surface of a deep and difficult topic, but you’ll
    get an idea of what is possible and how to integrate dispatch queues in your application.


    # 26.1  When to Use Dispatch Queues


    Imagine you’ve written a program that searches different websites for the least
    expensive flights to a particular location on a particular day. Your program would
    ask the user where they want their trip to begin and end and then why they want
    to travel. You wouldn’t think of searching one site at a time. The user could
    do that themselves. You would send'
