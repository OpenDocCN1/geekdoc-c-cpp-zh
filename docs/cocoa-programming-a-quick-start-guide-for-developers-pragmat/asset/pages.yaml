- pgno: 369
  md: 'functionality to the NSSet class, so the category''s implementation file is
    named NSSet+Persistence.m.


    A category cannot contain any instance variables. You are essentially decorating
    a class after the memory has been allocated and the variables have been initialized.
    You can add new methods to the class you''re decorating, but that''s all.


    This may seem a little bit like protocols. There''s a huge difference. As you
    saw back in Chapter **12**, *Creating Protocols for Delegation*, on page **203**,
    a protocol is a collection of method declarations that can be optional or required.
    Any class is free to adopt a protocol. A class that promises in its header file
    to conform to a protocol is promising to implement the required methods somehow.


    A category, on the other hand, is tied to a specific class, which it must name
    in both the interface and implementation. The category also has to implement the
    methods it declares. The methods you declare and implement in a category are just
    like the ones you declare and implement in the class'' header and implementation
    file.


    Doctor up your header file to look like this:


    ```

    ```objective-c

    Download Categories/Bounce3/NSSet+Persistence.h


    #import <Cocoa/Cocoa.h>


    @interface NSSet(Persistence)


    - (BOOL)writeToFile:(NSString *)path atomically:(BOOL)flag;

    + (id)setWithContentsOfFile:(NSString *)aPath;


    @end

    ```

