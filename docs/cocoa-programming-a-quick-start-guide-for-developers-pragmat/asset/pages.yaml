  md: '# Chapter 2


    # Using What’s There


    We’re going to start by creating a web browser that looks like this:


    ![](img/9355405953264484a02198b0e3d25b7e_23_0.png)


    We’ll create our browser without writing a line of code. It won’t be fancy, but
    it will mostly work. You’ll be able to type in URLs to load your favorite websites.
    You’ll be able to navigate around the sites by following links the way you would
    in an ordinary browser, and you’ll be able to use a couple of buttons to move
    forward and backward through your browsing history.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'In this chapter, we’ll use Interface Builder and off-the-shelf components to
    build our browser. We’ll pick a couple of buttons, a text field, and a special
    component for displaying web pages from a library. We’ll drag these components
    onto our window, arrange them the way we want them to look, and make sure they
    visually behave right when we shrink or stretch the window. We’ll then use Interface
    Builder to enable the behavior we want. Once we get everything working the best
    we can for now, we’ll take a quick look behind the scenes at some of the backstage
    magic.


    # 2.1 Creating Your Project in Xcode


    As we bounce back and forth between IB¹ and Xcode in these first few chapters,
    you’ll get a feel for what each is for. Mostly, you’ll use Xcode as an IDE to
    work on your code, your data model, and your project. The work you do in Xcode
    will feel familiar to you if you use other IDEs.


    As you might expect, you’ll create your GUI using Interface Builder. You’ll also
    use Interface Builder to connect the elements of the GUI to data sources, to other
    GUI elements, and to methods described in code. You’re going to spend almost all
    of your time in this first example using Interface Builder.


    Even though you won’t write any code for this SimpleBrowser example, you’ll need
    to create the project from Xcode. Start Xcode, and create a new project using
    either ⌘ N or File > New Project.²


    You’ll be presented with a variety of options for project templates that you can
    use to develop applications for the iPhone or for Mac OS X. Choose Mac OS X >
    Application > Cocoa Application. Leave the checkboxes unselected for creating
    a document-based app or for using Core Data. Click the Choose button or just press
    ↵.


    I have saved the project as SimpleBrowser in ~/Dev/UsingWhatsThere/. You can choose
    another name or location if you prefer.


    +   1. This is short for Interface Builder and is pronounced “I.B.” but written
    IB.

    +   2. You’ll find Xcode in the /Developer/Applications directory. You will use
    it enough that you should drag it to the Dock to create a shortcut. Also, remember
    you can always use Spotlight by clicking the magnifying glass in the far right
    of the menu bar.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'Your new project should look something like this:


    ![](img/9355405953264484a02198b0e3d25b7e_25_0.png)


    There’s quite a bit of infrastructure automatically created for you. We’re going
    to ignore almost all of these files for now. In this chapter, you’ll do all of
    your work in the MainMenu.xib file.


    Your SimpleBrowser application doesn’t do anything yet, but you can take it for
    a test-drive. Click Build & Run, and after a moment of compiling and launching,
    you’ll see an empty SimpleBrowser window and a menu bar populated with the standard
    set of menus and menu items. You may also notice that SimpleBrowser.app is no
    longer highlighted in red in Xcode because the file now exists. Quit SimpleBrowser,<sup>3</sup>
    and let’s get started on creating the interface.


    # 2.2 Creating the Appearance with Interface Builder


    Double-click MainMenu.xib (English) in the Xcode window. This is your main nib
    file. A nib file contains all of the work you do in Interface Builder. You create,
    configure, and connect objects using graphical tools in Interface Builder. Each
    nib file is essentially a freeze-dried object graph that is reconstituted at runtime.
    This first application will have a single nib file. Later in the book you’ll build
    more complicated applications with more than one.


    Nib files used to be stored in a binary format and had the extension nib. They
    are now stored as XML during development so that they work bet-


    <sup>3.</sup> Closing the window doesn’t quit the application. You need to stop
    the task from within Xcode, or while SimpleBrowser is active, you can press ⌘
    Q or use the menu to quit.'
