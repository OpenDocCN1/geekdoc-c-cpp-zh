- pgno: 120
  md: 'So instead of using this:


    ```

    [[NSString alloc] initWithFormat:@"Hello, %@!", self.name]

    ```


    we''ll use the following:


    ```

    [NSString stringWithFormat:@"Hello, %@!", self.name]

    ```


    These two versions are not exactly the same. Let''s review our rules.


    If you create a string using the first version, then you own it and are responsible
    for releasing it. When we use alloc, we increase the reference count by one and
    need to release the string either by calling release or by using the autorelease
    mechanism.


    On the other hand, what do the rules say about an object created using the second
    method? We didn''t explicitly use alloc or new to create the string, and we didn''t
    hold on to it using retain or copy. Therefore, we don''t own it.


    The stringWithFormat: is called a convenience constructor because it is used to
    create and initialize an object and give it back to us already autoreleased. In
    other words, the following:


    ```

    [NSString stringWithFormat:@"Hello, %@!", self.name]

    ```


    is equivalent to this:


    ```

    [[[NSString alloc] initWithFormat:@"Hello, %@!", self.name] autorelease]

    ```


    # 6.13 Exercise: Creating and Using a Convenience Constructor


    Create your own convenience constructor for the Greeter class named greeterWithName:.
    You will need to declare it in Greeter.h and implement it in Greeter.m.


    Refactor the applicationDidFinishLaunching: method in FlashlightAppDelegate.m
    to use this method to create an instance of the Greeter class. After you are done
    writing to the Console, the Greeter will be autoreleased, and Greeter''s dealloc
    method will be called.'
