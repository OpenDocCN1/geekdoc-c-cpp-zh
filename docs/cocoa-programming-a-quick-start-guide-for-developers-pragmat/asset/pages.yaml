- pgno: 56
  md: "Here’s more than you need to know: at runtime, the selector is matched to an\
    \ entry in the dispatch table for the object’s class, which points to the memory\
    \ location of the procedure that implements the requested method. If no selector\
    \ exists in that class, then the search continues in the class’ superclass and\
    \ on up the tree to the root class. For more information on this, read Apple’s\
    \ *The Objective-C 2.0 Programming Language*, which you can access from Xcode’s\
    \ Documentation window.\n\n# 3.5  Problems Sending Messages\n\nThere are two basic\
    \ things that could go wrong with a simple message in Objective-C: either the\
    \ receiver may not exist, in which case it has the value nil, or the object may\
    \ be valid but may not understand the message being sent to it. You may get a\
    \ compiler warning when you try to build the application, but neither type of\
    \ error will break the build or prevent someone from trying to run the application.\n\
    \nIn the first case, you are sending a message of the following form:\n\n```\n\
    [nil someMessage];\n```\n\nYou won’t get an error at compile time or exception\
    \ at runtime. Also, if someMessage returns an object, pointer type, or most valid\
    \ numeric types, then this message returns 0.\n\nIn the second case, you are sending\
    \ a message like this:\n\n```\n[validObject someMessageItDoesNotUnderstand];\n\
    ```\n\nThis time the application will terminate when the receiver is sent a message\
    \ it doesn’t understand.⁷ This problem snuck by you at compile time but has led\
    \ to a runtime exception. If validObject is an instance of the fictional class\
    \ CustomClass, you’ll see a message like this in the console:\n\n```\n*** -[CustomClass\
    \ someMessageItDoesNotUnderstand]:\n        unrecognized selector sent to instance\
    \ 0x102980\n*** Terminating app due to uncaught exception 'NSInvalidArgumentException'\n\
    ```\n\n⁷. An object will “understand” a message if it or one of its superclasses\
    \ declare and implement the corresponding method."
