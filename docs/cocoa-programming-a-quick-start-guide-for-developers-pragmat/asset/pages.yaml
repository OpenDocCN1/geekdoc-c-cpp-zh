- pgno: 216
  md: "```\nif (notification.name == NSWorkspaceDidLaunchApplicationNotification)\
    \ {\n    methodName = @selector(applicationDidLaunch:);\n} else {\n    methodName\
    \ = @selector(applicationDidTerminate:);\n}\nif ([self.delegate respondsToSelector:methodName])\
    \ {\n    self.name = [notification.userInfo objectForKey:@\"NSApplicationName\"\
    ];\n    [self.delegate performSelector:methodName withObject:self];\n}\n\n-(void)\
    \ applicationDidLaunch: (NSNotification *) notification {\n    [self respondToChange:notification];\n\
    }\n\n-(void) applicationDidTerminate: (NSNotification *) notification {\n    [self\
    \ respondToChange:notification];\n}\n```\n\nThis is much nicer.² We’ve captured\
    \ the common behavior in the respondToChange: method. We start by setting the\
    \ method name to applicationDidLaunch: or applicationDidTerminate: based on the\
    \ value of notification.name.\n\nOne difference is the way in which we call the\
    \ method and pass self in as a parameter. When we have the method name, we could\
    \ make a call like this:\n\n```\n[self.delegate applicationDidLaunch:self]\n```\n\
    \nNow we need to use performSelector:withObject:\n\n```\n[self.delegate performSelector:methodName\
    \ withObject:self];\n```\n\nI’m happy that we’ve eliminated the repeated code,\
    \ but I’m bothered by the if statement. Control statements like if, for, case,\
    \ and so on, are not necessarily bad, but you should consider whether there might\
    \ be a more direct path through your code.\n\nIn our simple case, there are many\
    \ ways of eliminating the if. I’m going to show you a technique that uses dictionaries.\n\
    \n2. As one reviewer noted, we could eliminate the applicationDidLaunch: and applicationDidTerminate:\
    \ methods altogether at this point and eliminate redundancy further. Unfortunately,\
    \ we'd have to add them back in just a few sections, so I'm leaving them in."
  merge: -1
  img_proc: true
- pgno: 217
  md: "# ## 13.6 Using a Dictionary for Flow Control\n\nLet’s take another look at\
    \ that if statement:\n\n```\n~~~\nDownload Dictionaries/HelloApplication1/CurrentApp.m\n\
    if (notification.name == NSWorkspaceDidLaunchApplicationNotification) {\n    methodName\
    \ = @selector(applicationDidLaunch:);\n} else {\n    methodName = @selector(applicationDidTerminate:);\n\
    }\n~~~\n```\n\nLet’s create a dictionary that has the notification names as the\
    \ keys and the names of the methods as values. Then we can replace the if statement\
    \ with this:\n\n```\n~~~\nDownload Dictionaries/HelloApplication1/CurrentApp.m\n\
    SEL methodName = NSSelectorFromString(\n    [delegateMethods objectForKey:[notification\
    \ name]]);\n~~~\n```\n\nThere’s no decision to make. We just pull the method name\
    \ from the dictionary.\n\nWe need to declare an instance variable named delegateMethods\
    \ of type NSDictionary in CurrentApp.h. We don’t need it to be a property. We’ll\
    \ initialize it like this:³\n\n```\n~~~\nDownload Dictionaries/HelloApplication1/CurrentApp.m\n\
    - (void) initializeMethodDictionary {\n    delegateMethods = [[NSDictionary alloc]\
    \ initWithObjectsAndKeys:\n        @\"applicationDidLaunch:\",\n        NSWorkspaceDidLaunchApplicationNotification,\n\
    \        @\"applicationDidTerminate:\",\n        NSWorkspaceDidTerminateApplicationNotification,\n\
    \        nil];\n}\n~~~\n```\n\nWe pass in the key-value pairs as a comma-separated\
    \ nil-terminated list. In each pair, we pass in the value first followed by the\
    \ key. We store the method names as NSStrings because the values we put into our\
    \ dictionary must be objects.\n\n# ## 13.7 Adding and Removing Entries with a\
    \ Mutable Dictionary\n\nThere are times when you want to add an entry to the dictionary\
    \ or remove one or more entries from the dictionary. You can’t make these\n\n\
    3. Add a call to initializeMethodDictionary to the end of the init method."
