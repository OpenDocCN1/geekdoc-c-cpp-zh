    your way through the documentation without my help—I just want to point out some
    of what you''ll find as a way of encouraging you to look.


    Type *webview* into the search box in the upper-right corner of the Doc viewer
    and experiment with the different results you get depending on whether you choose
    to search through the doc sets for iPhone, Mac OS X, Xcode, or some combination.[^2]
    You can also choose whether you are interested only in results that start with,
    contain, or match the search string exactly.


    You can narrow your search in many ways. For now, choose to limit the doc sets
    to the Mac OS X 10.6 Core Library, enable all languages, and choose Exact. The
    returned results will be grouped under the headings API, Title, and Full Text
