- pgno: 94
  md: '# Joe Asks...

    Why Should I Bother Using the Dot Syntax?


    There has been a fair amount of controversy over this issue. Some people object
    to the fact that when you write code like this:


    ```

    self.name = newName;

    ```


    you are making a method call even though it doesn''t look as if you are. That''s
    true, but the advantage of using the dot syntax is that getting or setting a property
    is a different activity from sending a message to an object even if underneath
    the mechanism is the same. The dot syntax clarifies your intent.


    When you send a message like this:


    ```

    [greeter greeting];

    ```


    it is clearly completely different from setting or getting the value of a property.
    You''ll find that Apple embraces the dot syntax in its modern APIs. As you look
    at the tasks for a given class, you''ll see that many of them are actually properties.
    After you''ve used the dot notation for get and set for a while, you''ll find
    that your code is easier to read and to more quickly understand.


    At http://eschatologist.net/blog/?p=160, Chris Hanson explains passionately and
    in greater detail why you want to use dot syntax for properties.


    And now we''ve declared and synthesized a property, so you now set the value of
    the variable like this:


    ```

    self.name = newName;

    ```


    We haven''t come full circle. When you use self.name = newName, you are using
    the setter method and not directly setting the underlying variable.


    You want to use the property and not the variable to take advantage of the various
    settings we will soon add to the property. This is one of the most common mistakes
    with properties. You go to all the trouble of declaring and synthesizing a property,
    and then you forget to use self and end up using the instance variable directly
    and not the property.'
  merge: -1
