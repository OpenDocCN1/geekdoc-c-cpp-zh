- pgno: 72
  md: '# Organizing Files


    At the left side of your Editor window you should see a section labeled Groups
    & Files. You may need to use the disclosure triangle next to your application''s
    name to reveal folders labeled Classes, Other Sources, Resources, Frameworks,
    and Products.


    When you create a new class in Xcode, the implementation and header files will
    appear in whatever directory is selected. If none is selected, they will appear
    in the top level under the application name. There is no correspondence between
    where the files actually live on the disk and where they appear in this organizer.
    The organizer works more like playlists in iTunes than like mailboxes in Mail.


    Create other folders if you like, but for small projects you want to keep your
    source code in the Classes folder. Either select Classes before you create a new
    class or drag the files into the folder afterward.


    Name your file Greeter.m.⁶ Also, make sure that the checkboxes to create Greeter.h
    and to target HelloWorld are selected. Generally, if you accept the defaults,
    you should be OK. Click Finish. You''ve now generated the header file Greeter.h
    and the implementation file Greeter.m.


    The header file contains the public interface for the Greeter class. You use it
    to tell other people how they can interact with your class. At the top of the
    file you''ll often import the header files of other classes your class might want
    to use. In this case, Xcode has already included the directive to import Cocoa.h,
    which includes the header files for all of the Cocoa classes you might need to
    use.


    6. Begin class names with an uppercase letter, and use camel case. Begin variable
    names and methods with a lowercase letter. Remember to check out *Coding Guidelines
    for Cocoa* [App06], which includes Apple documentation on naming classes, variables,
    methods, and functions.'
  merge: -1
