- pgno: 101
  md: '# Chapter 6


    # Memory


    You’ve learned how to create objects in Interface Builder and in code. You’ve
    seen how to send messages to objects, and you’ve used properties to change the
    state of some of your objects. In this chapter, you’ll learn the rules for managing
    memory in your Cocoa applications.


    Whenever you create an object, you’re using a small chunk of memory. If, at some
    point later, you’re no longer using that object, you want to make sure that memory
    chunk is no longer spoken for. Over the lifetime of a program, you may end up
    creating thousands or millions of transient objects. If you don’t arrange for
    these to be tidied up, all that memory will just be wasted (and, what’s worse,
    unavailable to other applications). So, as responsible developers, we make sure
    that all these waste objects are returned to the pool of available memory.


    If you fail to reclaim objects you’re no longer using, your application leaks
    memory. Over time, it will grow and grow, sometimes to the point where it can
    no longer run (or it prevents other programs from running).


    On the other hand, if you reclaim an object that is still being used, there’s
    a chance that this object will be overwritten by other code that grabs the reclaimed
    memory—this will lead to data corruption.


    And that’s what this chapter is about—how to organize things so that memory is
    reclaimed when it is no longer needed but not before.^1


    1. As you follow along in this chapter, every once in a while your program may
    fail when it shouldn’t or not fail when it should. Select Build > Clean All Targets...,
    and try to run again.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# ### 6.1 Reference Counting


    Reference counting is the technique we use to manage the memory of objects ourselves.
    The rules for memory management are simpler to express than to apply:


    +   - If you own an object, you are responsible for releasing it when you are
    finished with it. Claiming ownership of an object increases its reference count.
    Releasing that object decreases the count. An object is unused when its reference
    count is zero.

    +   - If you don''t own an object, you should never release it.


    If you violate the first rule, you cause a memory leak. If you violate the second
    rule, then you could be causing an object to disappear while others still need
    to send it messages.


    So, when do you own an object?


    Any time you create a new object using `alloc`, you own the object and need to
    release it when you are no longer using it. There is also a class method named
    `new`, which is a combination of `alloc` and `init`. In other words, the following
    does exactly the same thing:


    ```

    Greeter *host = [[Greeter alloc] init];

    ```


    as the following:


    ```

    Greeter *host = [Greeter new];

    ```


    We tend not to use `new` in Objective-C even though it’s available. The point
    here is that when you use it, you own the object. The reference count is increased
    by one, and you are responsible for releasing it when you are finished with it.


    You may also want to take ownership of an object that has been created elsewhere.
    When you are given an object you need to hold on to, you are responsible for sending
    a `retain` or `copy` message to the object. This increases its reference count
    by one. Whether you create an object using `alloc` or `new` or if you hold onto
    one using `retain` or `copy`, you now own that object and are responsible for
    releasing it when you no longer need it.²


    2. You''ll soon see that if instead you create an object using a class method,
    you have not retained that object. It is autoreleased. If you want to hold onto
    the newly created object, you must explicitly retain it.'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'When you are done with an object, you are responsible for sending a release
    message to the object. This decreases its reference count by one. When an object’s
    reference count is zero, its dealloc will be called to clean up the object resources
    and release the memory.


    You never call the dealloc method directly. You can’t know if someone else is
    holding a reference to the object that you would be destroying. You just call
    release to signal that you are no longer interested in this object. If everyone
    plays by the rules, then when no one is interested in the object, its reference
    count will be zero, and dealloc will be called.


    That’s all there is to it. Those are the rules for when the reference count is
    increased or decreased. Although the rules for manual memory management are straightforward,
    you can find more information in Apple’s Memory Management Programming Guide for
    Cocoa [App09c] and Garbage Collection Programming Guide [App08d].


    # ## 6.2 Finding Leaks with the Clang Static Analyzer


    To make things easier up to this point, you might remember that I had you turn
    automatic garbage collection on. To cause a leak, we need to turn garbage collection
    off. Choose the menu item Project > Edit Project Settings, and on the Build tab,
    filter for the garbage collection setting. Set the value of Objective-C Garbage
    Collection to Unsupported.


    ![](img/9355405953264484a02198b0e3d25b7e_103_0.png)


    Now let’s cause a deliberate memory leak.'
