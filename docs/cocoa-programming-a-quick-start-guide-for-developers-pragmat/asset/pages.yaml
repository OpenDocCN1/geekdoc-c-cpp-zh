    \ have any choice but to fix errors.\n\nA warning lets you know there may be a\
    \ problem, but it wasn’t severe enough to keep your code from compiling. This\
    \ could mean that everything will be fine, or it could mean that you end up with\
    \ a runtime error. A warning could be a note at compile time telling you that\
    \ you’ve sent a message to an object that didn’t declare a method with that signature.\
