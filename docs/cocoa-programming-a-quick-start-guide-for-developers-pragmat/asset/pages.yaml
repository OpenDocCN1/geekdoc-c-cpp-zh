- pgno: 34
  md: '# Reading the Nib


    All of the work you have done so far is stored as XML in the MainMenu.xib file.
    There is no reason for you to directly read or change the XML you’ve generated.
    This is a format meant to be created and interpreted by Interface Builder. For
    kicks, you may want to open the file in your favorite text editor and take a look
    around. You can find the text field, the two buttons, and the web view. It’s not
    pretty, and you wouldn’t want to have to interact with your GUI setup this way,
    but it may be reassuring that the format is one that you can poke around in if
    you want. Quietly close the file without saving any changes. We’ll take another
    look at MainMenu.xib before the end of the chapter.


    # 2.5 Wiring Up the Components


    You’ve used Interface Builder to select and configure the visual elements you
    will use in this application. You’ve placed them in your window, changed their
    appearance, set default values, adjusted their sizes, and set up how they would
    adjust as the window size changes. Now you are ready to wire them together.


    For example, you want to connect the Back button to the web view. When you click
    the button, you want the web view to display the contents of the previous URL.
    Your average button isn’t going to know a thing about web views. A web view, however,
    should know how to move back in its history and should be triggered by some outside
    source. So, you just need to wire up the web view’s ability to go back to this
    button’s clicks.


    Similarly, a text field shouldn’t know about URLs and web views. If a text field
    had to know about everything it could supply text for, the API would be huge and
    brittle. But a web view should know how to get a URL from a string from some other
    element. So, you just need to wire the web view’s “get the URL from a string”
    ability to the component providing the string.


    # Connecting the Web View


    It doesn’t always work, but it helps to think of who knows what. In this case,
    most of the knowledge is in the web view. Much of what an'
