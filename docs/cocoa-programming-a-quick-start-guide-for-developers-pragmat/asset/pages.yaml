  md: "Under Behavior, I’ve unselected Display When Stopped, and under Drawing, I’ve\
    \ unselected Hidden.\n\nHere’s the final version of the implementation file. We\
    \ need to add a couple of lines of code to the webView:didFinishLoadForFrame:\
    \ method to stop the progress bar’s animation and hide it. We also need to unhide\
    \ the progress indicator and start it spinning in the webView:didStartProvisionalLoadForFrame:\
    \ method.\n\n```\n```objective-c\n#import \"BrowserController.h\"\n#import <WebKit/WebKit.h>\n\
    \n@implementation BrowserController\n\n@synthesize myWebView, address, backButton,\
    \ forwardButton, progress;\n\n- (void)resetButtons {\n    [self.backButton setEnabled:[self.myWebView\
    \ canGoBack]];\n    [self.forwardButton setEnabled:[self.myWebView canGoForward]];\n\
    }\n\n- (void)awakeFromNib {\n    [self.address setStringValue:@\"http://pragprog.com\"\
    ];\n    [self.myWebView takeStringURLFrom:self.address];\n}\n\n- (void)webView:(WebView\
    \ *)sender\n didReceiveTitle:(NSString *)title\n        forFrame:(WebFrame *)frame\
    \ {\n    [[sender window] setTitle:title];\n}\n\n- (void)webView:(WebView *)sender\n\
    \ didFinishLoadForFrame:(WebFrame *)frame {\n    [self.address setStringValue:[sender\
    \ mainFrameURL]];\n    [self resetButtons];\n    [self.progress stopAnimation:self];\n\
    }\n\n- (void)webView:(WebView *)sender\n didStartProvisionalLoadForFrame:(WebFrame\
    \ *)frame {\n    [self.progress startAnimation:self];\n}\n@end\n```\n```\n\nThat’s\
    \ still not much code. In the next chapter, we’ll see what needs to be changed\
    \ to implement our SimpleBrowser for the iPhone."
