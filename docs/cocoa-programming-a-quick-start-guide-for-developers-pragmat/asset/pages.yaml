- pgno: 317
  md: 'Save your work, and head over to Interface Builder to wire everything up.


    Add an object of type `Display` and an object of type `UpOrDown` to your Document
    window. In the Connections Inspector, first break the direct connection between
    the stepper and the text field. Click `UpOrDown`, and connect the `display` outlet
    to the `Display` object. Connect the `step:` received action to the stepper. Click
    the `Display`. Connect the `displayField` outlet to the text field. Save, and
    click **Build & Run**.


    From a user''s standpoint, there is no difference between this version and the
    codeless version.


    Notice that the `Display` object doesn''t have to know anything about the `UpOrDown`
    object, but the `UpOrDown` object needs to know about the `Display` object. Coming
    up next, we''ll turn this on its head when we make the `Display` object an observer.


    # ## 20.3 Introducing an Observer


    With the traditional target-action approach, the `UpOrDown` object had a handle
    to the `Display` object and sent the message `updateDisplay:` to that object.
    With KVO, the observer knows who it is watching. The observed object just sends
    out a message when the state has changed—all registered observers will get the
    notification.


    In our example, the `Display` object will need to send a message to the `UpOrDown`
    object to register as an observer. This means that our `Display` object will need
    a handle to the `UpOrDown` object. At this point, you have a relationship that
    looks like this:


    ![](img/9355405953264484a02198b0e3d25b7e_317_0.png)'
