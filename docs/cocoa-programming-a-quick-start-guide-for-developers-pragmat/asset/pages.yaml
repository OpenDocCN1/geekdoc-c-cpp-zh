  md: "# 15.3  Exercise: Changing the Stroke Color\n\nI want you to draw a red frame\
    \ when an application quits and a green frame when one launches. Don’t bother\
    \ filling in the rectangle.\n\nAdd a property named alertColor of type NSColor\
    \ to your IconView. Change the drawRect: code to set the pen color to the alertColor\
    \ and stroke the rectangle.\n\nImplement the applicationDidLaunch: in the IconViewController\
    \ to set the IconView’s alertColor to green. The IconView instance is the IconViewController’s\
    \ view. Unfortunately, you need to cast the type of the variable view to be an\
    \ IconView in order to set the alertColor property.\n\nThere is one more step.\
    \ You need to mark the IconView as dirty so that it will be redrawn. You signal\
    \ that the view needs to be redrawn by sending it the following message:\n\n```\n\
    `[self.view setNeedsDisplay:YES]`\n```\n\nImplement the applicationDidTerminate:\
    \ method, and set the alertColor to red. Click Build & Run. When the application\
    \ finishes launching, you should see a green frame. When you quit another application,\
    \ the frame should turn to red.\n\n# 15.4  Solution: Changing the Stroke Color\n\
    \nWhen you add the alertColor property, you need to specify the memory attribute\
    \ as copy because NSColor conforms to the NSCopying protocol. I’ve also added\
    \ an NSRect named frameRect as an instance variable.\n\n```\n```objc\n#import\
    \ <Cocoa/Cocoa.h>\n\n@interface IconView : NSView {\n    NSColor *alertColor;\n\
    \    NSRect frameRect;\n}\n@property(copy) NSColor *alertColor;\n@end\n```\n```\n\
    \nIn the view’s implementation file, we send the set method to the alert-Color\
    \ and stroke the boundary of the rectangle. I’ve created the rectangle and set\
    \ the line width to 12 in awakeFromNib to avoid doing so every time drawRect:\
    \ is called."
