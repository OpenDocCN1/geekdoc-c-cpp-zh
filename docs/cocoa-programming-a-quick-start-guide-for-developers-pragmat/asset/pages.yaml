  md: "dictionary to eliminate an if in another part of our code. This time we'll\
    \ use another technique.\n\n# 16.7 Table Column Identifiers as Keys\n\nInstead\
    \ of using the column header titles in our if statement, we can use another property\
    \ of table columns called the *identifier*. The title is text that is visible\
    \ at the top of the column in the header cell. That text is meant to communicate\
    \ with the application user. The identifier is invisible to the end user. The\
    \ data source uses it to identify the column. We can use the identifier as a key\
    \ in a dictionary or as a name of a property or method.\n\nSo, select the table’s\
    \ first column in Interface Builder, and use the Attributes inspector to set the\
    \ Identifier to icon. Similarly, set the Identifier in the second column to localizedName.\
    \ I haven’t chosen those names at random; these are the names of the properties\
    \ in the NSRunningApplication class that I want to appear in each of the columns.\n\
    \n![](img/9355405953264484a02198b0e3d25b7e_264_0.png)\n\nNow we can call the method\
    \ with the same name as the identifier. It is just the getter for the property\
    \ with that name.\n\n```\n```objc\n- (id)tableView:(NSTableView *)aTableView\n\
    \       objectValueForTableColumn:(NSTableColumn *)aTableColumn\n            \
    \                  row:(NSInteger)rowIndex {\n    return [[self.runningApps objectAtIndex:rowIndex]\n\
    \        performSelector:NSSelectorFromString([aTableColumn identifier])];\n}\n\
    ```\n```\n\nHere’s roughly what has to happen to fill the table with icons and\
    \ names. First the table view asks its data source how many rows are in this table.\
