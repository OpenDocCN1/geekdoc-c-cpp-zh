- pgno: 138
  md: "```\n```objective-c\n[self.textField setStringValue:\n    [NSString stringWithFormat:@\"\
    Hello, %@!\", NSFullUserName()]];\n[self.button setTitle:@\"Generalize\"];\nisPersonalized\
    \ = YES;\n}\n- (void) generalize {\n    self.window.backgroundColor = [NSColor\
    \ greenColor];\n    [self.textField setStringValue:@\"Hello, World!\"];\n    [self.button\
    \ setTitle:@\"Personalize\"];\n    isPersonalized = NO;\n}\n- (void)applicationDidFinishLaunching:(NSNotification\
    \ *)aNotification {\n    [self generalize];\n}\n-(IBAction) changeGreeting:(id)sender\
    \ {\n    if (isPersonalized) [self generalize];\n    else [self personalize];\n\
    }\n@end\n```\n```\n\nThe code is not really much shorter, but it is easier to\
    \ read. In the next section, we’ll take advantage of another feature of Objective-C\
    \ to make one more change.\n\n# 7.12 Creating Selectors from Strings\n\nLet’s\
    \ take a step back and notice that when the button’s title is “Personalize,” we\
    \ call the method personalize, and when the button’s title is “Generalize,” we\
    \ call the method generalize.\n\nIt would be nice if we could take the button’s\
    \ title, convert it to lowercase, and use it as the method name we’re calling.\
    \ Because its value changes at runtime, we’ll use the function NSSelectorFromString()\
    \ like this:\n\n```\n```objective-c\nNSSelectorFromString([self.button title]\
    \ lowercaseString]);\n```\n```\n\nThis returns a selector—you can think of that\
    \ as the method’s formal name. We then call the method with that name by sending\
    \ the message performSelector: to self with the selector we just created as the\
    \ argument.\n\nIn other words, the changeGreeting: can change to this:\n\nDownload\
    \ Outlets/HelloWorldPro/HelloWorldProAppDelegate.m\n\n```\n```objective-c\n-(IBAction)\
    \ changeGreeting:(id)sender {\n    [self performSelector:\n        NSSelectorFromString([self.button\
    \ title] lowercaseString)];\n}\n```\n```"
