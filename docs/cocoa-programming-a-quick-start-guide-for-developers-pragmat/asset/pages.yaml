  md: "Who should be the sender? How does changeGreeting: have a handle to\nthe button\
    \ if it's not called in response to a button click?\n\nLet's introduce an outlet\
    \ for our button:\n\nDownload Outlets/HelloWorldPro/HelloWorldProAppDelegate.h\n\
    \n```\n```\n#import <Cocoa/Cocoa.h>\n\n@interface HelloWorldProAppDelegate : NSObject\
    \ <NSApplicationDelegate> {\n    NSWindow *window;\n    NSTextField *textField;\n\
    \    NSButton *button;\n    BOOL isPersonalized;\n}\n@property (assign) IBOutlet\
    \ NSWindow *window;\n@property (assign) IBOutlet NSTextField *textField;\n@property\
    \ (assign) IBOutlet NSButton *button;\n\n-(IBAction) changeGreeting:(id)sender;\n\
    @end\n```\n```\n\nConnect this new outlet to your button in Interface Builder.\
    \ If you'd\nlike, you can delete the button's title so that it is blank. Save.\n\
    \nIn the implementation file, you'll need to synthesize button. Now you\ncan change\
    \ the use of sender to self.button inside changeGreeting:. Let's\nmake applicationDidFinishLaunching:\
    \ worse for a moment before we make\nit better.\n\nDownload Outlets/HelloWorldPro/HelloWorldProAppDelegate.m\n\
    \n```\n```\n- (void)applicationDidFinishLaunching:(NSNotification *)aNotification\
    \ {\n    self.window.backgroundColor = [NSColor greenColor];\n    [self.textField\
    \ setStringValue:@\"Hello, World!\"];\n    [self.button setTitle:@\"Personalize\"\
    ];\n    isPersonalized = NO;\n}\n```\n```\n\nThis code is now identical to the\
    \ true branch of the if statement, so let's\nrefactor. Introduce two utility methods,\
    \ personalize and generalize, and\nuse them in applicationDidFinishLaunching:\
    \ and changeGreeting:.\n\nDownload Outlets/HelloWorldPro/HelloWorldProAppDelegate.m\n\
    \n```\n```\n#import \"HelloWorldProAppDelegate.h\"\n\n@implementation HelloWorldProAppDelegate\n\
    \n@synthesize window, textField, button;\n\n- (void) personalize {\n    self.window.backgroundColor\
    \ = [NSColor redColor];\n```\n```"
