- pgno: 367
  md: '# # Categories


    Way back on Section 17.5, *Saving an Archive to Disk*, on page 276, we wanted
    to save an NSSet to disk and then read it back later. This would have been easy
    if we had an NSArray. An NSArray has built-in methods for writing itself to a
    file and for creating an array from a file. NSSet doesn''t have this ability.


    Categories let us scoff at these limitations. We use categories to declare and
    implement new methods for existing classes. These can be classes that we create,
    or they can be classes for which we don''t even have access to the source code.


    In this chapter, we will use categories to teach a set to save itself to and retrieve
    itself from disk. Then we''ll use a variant of categories to declare private methods
    in our code. Finally, we''ll use categories with Core Data to modify the behavior
    of objects in two different ways.


    # ## 23.1 Overcoming Limitations


    Let''s start with a simple application that can read and write an array to disk.
    Create a new Cocoa application named Bounce. Make sure that the Use Core Data
    for Storage checkbox is unselected. Our application will create an array, save
    it to disk, create a second array from what is saved on disk, and log the new
    array.'
  merge: -1
  img_proc: true
- pgno: 368
  md: "The simplest way is to put this code in the applicationDidFinishLaunching:\
    \ method in the file BounceAppDelegate.m:\n\nDownload Code Categories/Bounce/BounceAppDelegate.m\n\
    \n```\n```\n- (void)applicationDidFinishLaunching:(NSNotification *)aNotification\
    \ {\n    NSArray *source = [NSArray arrayWithObjects:@\"One\", @\"Two\", nil];\n\
    \    [source writeToFile:@\"savedArray\" atomically:YES];\n    NSArray *fromDisk\
    \ = [NSArray arrayWithContentsOfFile:@\"savedArray\"];\n    NSLog(@\"Array from\
    \ disk: %@\",fromDisk);\n}\n```\n```\n\nClick Build & Run, and everything works\
    \ fine. Our first array is created and saved to disk. Our second array is created\
    \ with the contents of what was saved, and the following is logged to the Console\
    \ window:\n\n```\n```\nArray from disk: (\n    One,\n    Two\n)\n```\n```\n\n\
    I'd like to do the same thing with an NSSet instead of an NSArray. In other words,\
    \ I'd like to change the applicationDidFinishLaunching: method implementation\
    \ to the following and have it just work:\n\nDownload Code Categories/Bounce2/BounceAppDelegate.m\n\
    \n```\n```\n- (void)applicationDidFinishLaunching:(NSNotification *)aNotification\
    \ {\n    NSSet *source = [NSSet setWithObjects:@\"One\", @\"Two\", nil];\n   \
    \ [source writeToFile:@\"savedSet\" atomically:YES];\n    NSSet *fromDisk = [NSSet\
    \ setWithContentsOfFile:@\"savedSet\"];\n    NSLog(@\"Set from disk: %@\",fromDisk);\n\
    }\n```\n```\n\nThe compiler complains that NSSet may not respond to the methods\
    \ writeToFile:atomically: and setWithContentsOfFile:. Even worse, if we ignore\
    \ these warnings and run our application, we get a runtime exception because the\
    \ selector writeToFile:atomically: doesn't exist.\n\nLet's fix that. An NSSet\
    \ doesn't know how to write itself to a file location. We're going to create a\
    \ category for NSSet named Persistence to add this ability.\n\n# ## 23.2 Creating\
    \ a Category\n\nCreate a new Objective-C class that extends NSObject. I know we\
    \ are really creating a category and not a class, but there currently isn't a\
    \ template for a category. The convention is to name the file by combining the\
    \ name of the category with the name of the class it is a category on. We will\
    \ name our category Persistence. It will add"
  merge: -1
