    \ up your actions and outlets in Interface Builder, and remove the stale links.\n\
    \nBack in Xcode, finish up with Display.m. For the most part, we are doing everything\
    \ twice. We could have gotten clever with KVC, but that would have obscured the\
    \ point of this example, which is how one object observes more than one attribute.\n\
    \nThe Display object is listening for changes both to countOne and to countTwo.\
    \ If either changes, then the observeValueForKeyPath: method is called. That means\
    \ we have to figure out why this method is being called. One solution, highlighted\
    \ here, is to examine the keypath, and if need be, the object that is being observed\
    \ to see who issued the notification and why.\n\nDownload KVO/Counter7/Display.m\n\
    \n```\n```objc\n#import \"Display.h\"\n\n@implementation Display\n\n- (void) updateDisplayOne:\
    \ (NSNumber *) newValue{\n    [displayFieldOne setIntegerValue:[newValue integerValue]];\n\
    }\n- (void) updateDisplayTwo: (NSNumber *) newValue{\n    [displayFieldTwo setIntegerValue:[newValue\
    \ integerValue]];\n}\n- (void) awakeFromNib {\n    [counter addObserver:self\n\
    \              forKeyPath:@\"countOne\"\n                 options:NSKeyValueObservingOptionNew\n\
    \                 context:NULL];\n    [counter addObserver:self\n            \
    \  forKeyPath:@\"countTwo\"\n                 options:NSKeyValueObservingOptionNew\n\
    \                 context:NULL];\n}\n```\n```"
