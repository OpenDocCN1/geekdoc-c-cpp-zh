  md: "So, for example, when we quit iCal, our display should look something like\
    \ this:\n\n![](img/9355405953264484a02198b0e3d25b7e_221_0.png)\n\nWe can accomplish\
    \ this change by adding an outlet to the ActivityController header file, and by\
    \ reshaping our code. As is often the case with Cocoa programming, it can take\
    \ a while to figure out how to accomplish this third step. Let’s take care of\
    \ the easier steps first.\n\nIn Xcode, add an outlet named imageView to the header\
    \ file ActivityController.h. The outlet should be a pointer to an NSImageView.\n\
    \nIn Interface Builder, find an NSImageView described as an *image well* in the\
    \ Library, and drag it into your window. Adjust the window, text field, and image\
    \ well so that they look like the picture you saw at the beginning of this section.\n\
    \nAdjust the size settings so that the user can adjust the size of the window\
    \ only in the horizontal direction. When the window grows, the image well should\
    \ stay where it is, and the text field should grow so that it remains the same\
    \ distance from the left and right sides.\n\nBefore leaving Interface Builder,\
    \ connect the imageView outlet you created in your header file to the image well.\
    \ Save your work.\n\nWe’ll take advantage of a new class that was added in Snow\
    \ Leopard. NSRunningApplication lets you send messages and get information about\
    \ a currently running user application. Look back at the last entry we saw when\
    \ we displayed the userInfo dictionary in the Console window:\n\n```\nNSWorkspaceApplicationKey\
    \ = \"<NSRunningApplication:\n    0x200019ae0 (com.apple.iCal - 7130)>\";\n```\n\
    \nThe NSRunningApplication has the following properties:\n\n```\nactivationPolicy\n\
    active\nbundleIdentifier\nbundleURL\nexecutableArchitecture\nexecutableURL\n```"
