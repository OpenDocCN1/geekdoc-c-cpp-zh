- pgno: 63
  md: "# Functions\n\nNSLog() looks nothing like the square brackets, colons, targets,\
    \ and actions we saw in the previous chapter.\n\nIt shouldn't. NSLog() is not\
    \ an Objective-C method—it is a C function. Objective-C sits on top of C. Although\
    \ you should prefer to use the Objective-C style of sending messages to classes\
    \ and objects, you can also use good old-fashioned C for getting things done.\n\
    \nYou'll see a lot of C-style functions when you work with system-level calls\
    \ and with APIs that work with graphic objects. You can recognize C functions\
    \ because they use ordinary parentheses to capture their arguments, and you just\
    \ call the function without a target. In this chapter, I'll point out the differences\
    \ now and again, and soon you'll get used to the mixture of C and Objective-C\
    \ constructs.\n\nIn a traditional C \"Hello, World!\" application (or even in\
    \ older versions of Cocoa \"Hello, World!\" applications) that you might have\
    \ seen, you would put this line in main(). Your program has a main() in the file\
    \ main.m, which you can find in Groups & Files in the Other Sources directory.\n\
    \n`Download Code / Classes/HelloWorld/main.m`\n\n```\n#import <Cocoa/Cocoa.h>\n\
    \nint main(int argc, char *argv[])\n{\n    return NSApplicationMain(argc, (const\
    \ char **) argv);\n}\n```\n\nWe're going to leave main.m alone. We aren't going\
    \ to ever add to it or modify it. All of the action for main() is contained in\
    \ the call to the function NSApplicationMain(). In our case, this function creates\
    \ an instance of the NSApplication class and loads the MainMenu nib. In other\
    \ words, it launches the application.\n\nIf you're a C programmer, you'll be tempted\
    \ to put more of your programming logic here in the main() function. Don't. There\
    \ is a new place for this customization, the application delegate. You're going\
    \ to see a lot of this delegate pattern throughout this book.\n\nThis first time\
    \ through, I'm going to gloss over the details, but the big idea is that the NSApplication\
    \ class knows a lot about how an application"
  merge: -1
  img_proc: true
- pgno: 64
  md: "should behave in general. It can't possibly know how any particular application\
    \ should behave. One solution would be for us to subclass NSApplication and override\
    \ the appropriate methods with our custom behavior. We tend to take a different\
    \ approach in Cocoa applications. We assign a delegate object to the NSApplication\
    \ and implement only those methods we need to implement. And what's a delegate?\
    \ You can think of it as an assistant class that the main class passes work to.\
    \ When the main class, in this case Application, needs something done, it calls\
    \ a method in its delegate class.\n\nFortunately, the Cocoa Application template\
    \ created an application delegate for us named HelloWorldAppDelegate. You'll find\
    \ the source files in the Classes folder under Groups & Files.²\n\n+   - HelloWorld\n\
    +     - Classes\n+       - HelloWorldAppDelegate.h\n+       - HelloWorldAppDelegate.m\n\
    +     - Other Sources\n+     - Resources\n+     - Frameworks\n+     - Products\n\
    \nThe Cocoa Application template has created the files HelloWorldAppDelegate.h\
    \ and HelloWorldAppDelegate.m, which together define the class HelloWorldAppDelegate.\n\
    \nInside HelloWorldAppDelegate.m, there is a method named applicationDidFinishLaunching:\
    \ that contains the following comment:\n\n```\n// Insert code here to initialize\
    \ your application\n```\n\nAdd the log line in place of the comment like this:\n\
    \n[Download Classes/HelloWorld/HelloWorldAppDelegate.m](#)\n\n```\n```\n#import\
    \ \"HelloWorldAppDelegate.h\"\n@implementation HelloWorldAppDelegate\n@synthesize\
    \ window;\n\n- (void)applicationDidFinishLaunching:(NSNotification *)aNotification\
    \ {\n    NSLog(@\"Hello, World!\");\n}\n@end\n```\n```\n\n2. If you don't find\
    \ these files, you are probably using Xcode version 3.1 or earlier and need to\
    \ move to Xcode 3.2 or later."
  merge: -1
  img_proc: true
- pgno: 65
  md: 'How is this method ever called? We don’t call it explicitly from main(). In
    fact, we don’t explicitly call it from anywhere.


    The simple explanation is that at runtime after the application finishes launching,
    the application object sends its delegate the message applicationDidFinishLaunching.
    The slightly longer version is what you saw in the previous chapter: if the delegate
    didn’t implement this method, then there would be a runtime error when it is called.
    So, what really happens is the application object checks to make sure the delegate
    implements the method, and if it does, then it sends the message.


    ![](img/9355405953264484a02198b0e3d25b7e_65_0.png)


    To run the application, first show the Console with Run > Console or ⇧ ⌘ R. Next,
    clear the Console by selecting Run > Clear Console, by pressing ⌃ ⌘ R, or by clicking
    the Clear Console button if it is visible. Finally, click Build & Run (or use
    the keyboard shortcut for this, ⌘ ->).


    HelloWorld should start up, the empty window will appear, and the Console should
    contain a line indicating the time at which the session started followed by a
    line with a time stamp, the process ID, and the string we created. Mine looks
    like this:


    ```

    HelloWorld[19673:10b] Hello, world!

    ```


    Once you’ve admired your achievements for a bit, you can quit HelloWorld and get
    back to work.


