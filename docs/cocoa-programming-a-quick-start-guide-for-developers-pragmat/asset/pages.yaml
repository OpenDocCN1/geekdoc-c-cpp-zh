  md: "# 17.6  Reading and Using Preferences\n\nWe’ll create a very basic preference\
    \ panel that allows the user to choose whether to use the stored list of removed\
    \ applications or to instead start from scratch when we launch HelloApplication.\
    \ In this section, we assume the preference exists and has been set.\n\nCurrently\
    \ we ask whether the data file exists before we try to restore apps from disk.\
    \ Modify this check to make sure that the user wants us to restore from disk and\
    \ that the data file exists.\n\n```\n```objc\n- (id)init {\n    if (self = [super\
    \ init]) {\n        if ([self shouldLoadSavedRemovedApps] &&\n            [[NSFileManager\
    \ defaultManager] fileExistsAtPath:self.dataFile]) {\n            self.apps =\
    \ [NSMutableArray arrayWithContentsOfFile:self.dataFile];\n        } else {\n\
    \            self.apps = [NSMutableArray arrayWithCapacity:5];\n        }\n  \
    \  }\n    return self;\n}\n```\n```\n\nThe method shouldLoadSavedRemovedApps returns\
    \ a value based on what is stored in the preferences.\n\n```\n```objc\n- (BOOL)\
    \ shouldLoadSavedRemovedApps {\n    return [[NSUserDefaults standardUserDefaults]\n\
    \                    boolForKey:@\"LoadSavedRemovedApps\"];\n}\n```\n```\n\nThis\
    \ is a familiar pattern by now. You ask for the standard user defaults the same\
    \ way you’ve asked for the default workspace or the file manager. Once you have\
    \ the instance you need, you ask it for the value that corresponds to the key\
    \ LoadSavedRemovedApps and return that value as a BOOL.\n\n# 17.7  Setting the\
    \ Factory Defaults\n\nLet’s set a default value for shouldLoadSavedRemovedApps.\n\
    \nThere are five levels of defaults that you can set in a Cocoa application. We’ll\
    \ just worry about two of them: the factory defaults and the user defaults. We’ll\
    \ ignore defaults that are passed in on the command line,"
  merge: -1
  img_proc: true
- pgno: 278
  md: "those that are set for the entire system, and the ones that depend on localization.\
    \ We’ll load the factory defaults right away and then check to see whether the\
    \ user has used a preference panel to change any values.\n\nIn this section, we’ll\
    \ look at the defaults set in the registration domain. You can think of these\
    \ as the factory settings—these are the values before the user makes any adjustments.\
    \ Let’s set the value of should-LoadSavedRemovedApps to NO.\n\nThe best place\
    \ to set the registration domain defaults is in an initialize method. The reason\
    \ is that the initialize method is a class method that is called before any other\
    \ method is called on HelloApplicationAppDelegate or a subclass. Anything in the\
    \ initialize method will be done before anything else using our app delegate—even\
    \ before the applicationDidFinishLaunching: method executes.\n\nDownload Persistence/HelloApplication40/HelloApplicationAppDelegate.m\n\
    \n```\n```\n+(void)initialize {\n    NSDictionary *defaults =\n        [NSDictionary\
    \ dictionaryWithObject:[NSNumber numberWithBool:NO]\n                        \
    \            forKey:@\"LoadSavedRemovedApps\"];\n    [[NSUserDefaults standardUserDefaults]\
    \ registerDefaults:defaults];\n}\n```\n```\n\nClick Build & Run. Each time you\
    \ run the app, you’ll be starting with an empty array of removed applications.\
    \ Change the NO to a YES, and you will now launch with the saved list of removed\
    \ applications.\n\nActually, you don’t need to be so explicit when you place the\
    \ BOOL in the dictionary. You could pass in the value YES or NO as a string and\
    \ still create a BOOL from this value when you read from the preferences.\n\n\
    Download Persistence/HelloApplication40/HelloApplicationAppDelegate.m\n\n```\n\
    ```\n+(void)initialize {\n    NSDictionary *defaults =\n        [NSDictionary\
    \ dictionaryWithObject:@\"NO\"\n                                    forKey:@\"\
    LoadSavedRemovedApps\"];\n    [[NSUserDefaults standardUserDefaults] registerDefaults:defaults];\n\
