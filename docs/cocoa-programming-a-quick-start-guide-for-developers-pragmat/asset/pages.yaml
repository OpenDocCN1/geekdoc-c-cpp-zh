    +   - If createLabel had instead been defined to be a C-style function, we would\
    \ have replaced [self createLabel] with createLabel();\n+   - The refactoring\
    \ tool will place the new method in the source code above the line where the method\
    \ is called. Think of the compiler as reading your source code from top to bottom.\
    \ When it gets to the line in which the method is called, the compiler needs to\
    \ have already encountered the implementation of the method. If a method occurs\
    \ in the source code below where it is called, you will get a compiler warning.\n\
    \nNow that we’ve separated the code that creates the label, I don’t mind adding\
