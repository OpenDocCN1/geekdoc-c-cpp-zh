- pgno: 245
  md: "For now, here’s how we would create a blue rectangle inside the view:\n\n```\n\
    ```objective-c\n#import \"IconView.h\"\n\n@implementation IconView\n\n- (void)drawRect:(NSRect)dirtyRect\
    \ {\n    NSRect innerRect = NSMakeRect(18, 42, 180, 180);\n    [[NSColor blueColor]\
    \ set];\n    [NSBezierPath fillRect:innerRect];\n}\n\n@end\n```\n```\n\nAt first\
    \ this looks weird. You are sending the set message to the NSColor object. It\
    \ may seem at first that you should be telling the NSView to set its color to\
    \ blue. With views, you need to keep in mind that they draw themselves. When they\
    \ need to be redrawn, the focus is locked on the view being drawn, its drawRect:\
    \ method is called, and then the focus is unlocked.\n\nHere’s how you have to\
    \ think about the drawing that goes on within the drawRect: method. When you send\
    \ set to [NSColor blueColor], you are saying, “Blue crayon you are selected. Put\
    \ yourself in my hand.” Then in the next line when you fill in the rectangle,\
    \ the blue crayon is in your hand, so that’s what you use.\n\nSuppose you now\
    \ want to draw a black boundary around your blue rectangle. If we use the same\
    \ dimensions for the rectangle and choose a stroke width of 12, our framed rectangle\
    \ will look like this:\n\n![](img/9355405953264484a02198b0e3d25b7e_245_0.png)"
  merge: -1
  img_proc: true
- pgno: 246
  md: "Notice there’s more room below the rectangle than there is above it. That’s\
    \ because the coordinate system is anchored in the lower-left corner of our view.\
    \ The x-axis increases to the right, and the y-axis increases from bottom to top.\
    \ So, we’ve constructed a rectangle that starts at the point (18, 42) with and\
    \ height 180. The stroke, unless we specify otherwise, will straddle the line,\
    \ so really the bottom-left corner of the black frame is at the point (12, 36).\n\
    \nA lot of our work with graphics objects will feel more like C than Objective-C.\
    \ For example, this NSRect is a struct that represents a rectangle. It consists\
    \ of two other structs: an NSPoint that is used to specify the position of the\
    \ rectangle and an NSSize that is used to specify the width and height of the\
    \ rectangle.\n\nAlso note that NSMakeRect() is a standard C function and not an\
    \ Objective-C method. You’ll find these constructor functions for most of the\
    \ structs that you will use.\n\nOnce you’ve created your rectangle, you’ll use\
    \ it for the blue fill and for the black stroke. After you’ve finished filling\
    \ in your blue rectangle, you then say [[NSColor blackColor] set] and draw something\
    \ different with your black canvas. Instead of fillRect:, this time you’ll use\
    \ strokeRect: to draw a black border around the blue rectangle.\n\n```\n```objc\n\
    - (void)drawRect:(NSRect)dirtyRect {\n    NSRect innerRect = NSMakeRect(18, 42,\
    \ 180, 180);\n    [[NSColor blueColor] set];\n    [NSBezierPath fillRect:innerRect];\n\
    \    [[NSColor blackColor] set];\n    [[NSBezierPath setDefaultLineWidth:12];\n\
    \    [[NSBezierPath strokeRect:innerRect];\n}\n```\n```\n\nCheck out the documentation\
    \ for NSBezierPath, and you can see that you can use it to draw all sorts of shapes.\
    \ We’ll stick with rectangles when we create a custom view for HelloApplication.\n\
    \nSo far, we’re drawing the rectangle only when the view is first instantiated.\
    \ Next let’s redraw the view whenever an application launches or terminates."
