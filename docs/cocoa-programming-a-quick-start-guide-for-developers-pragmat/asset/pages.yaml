- pgno: 18
  md: 'need to be as careful of being fooled by the similarities as you are of being
    challenged by the differences.³ You can get used to the square brackets and the
    way that code is structured pretty quickly. You also have to get comfortable with
    the common patterns that Cocoa programmers use.


    In Chapter 3, *Methods and Parameters*, on page 48, we''ll get you comfortable
    reading some Objective-C. We''ll start with messages because sending messages
    is the core of Cocoa programming. Even experienced object-oriented programmers
    lose sight of this. We tend to think that OO is all about the objects.


    Objective-C sits on top of C, but it owes many of its ideas to Smalltalk. It helps
    to reread Alan Kay''s 1998 reminder on the Squeak mailing list every now and then
    in which he expresses his regret at coining the term *objects* because it encourages
    people to focus on the wrong thing.⁴ Kay explains that “The key in making great
    and growable systems is much more to design how its modules communicate rather
    than what their internal properties and behaviors should be.”


    # 1.3 Installing the Tools


    Check that you have installed the free developer tools. By default the installer
    puts the developer applications, documentation, examples, and other files in the
    Developer directory at the root level. Even though the developer tools are free
    and included on the install discs that come with Mac OS X, they are not installed
    by default. Check the Developer directory to make sure they are installed. Also
    select Xcode and choose File > Get Info or press ⌘I to bring up the info window
    for Xcode. Check the version number. The examples in this book assume you are
    running at least Xcode 3.2.


    Get the most recent developer tools (including beta releases) by joining the Apple
    Developer Connection (ADC) at http://developer.apple.com/. *You should* join the
    ADC. There is currently a free membership level that gives you access to much
    of the prerelease software. There are also paid membership levels that come with
    different benefits.


    3. One of the great selling points for Java was also its weakness. Its syntax
    was familiar. C programmers could easily write Java code. But they often wrote
    Java code that looked a little too much like C code. The same is true for many
    other programming languages including Objective-C. Objective-C sits on top of
    C, so you could write pure C code. Don''t.


    4. http://lists.squeakfoundation.org/pipermail/squeak-dev/1998-October/017019.html'
  merge: -1
