  md: "Let’s use a method with more arguments to help you better understand the differences.\
    \ WebView contains a method with the rather lengthy name `searchFor:direction:caseSensitive:wrap:`.\
    \ That is the entire method name. In other languages, this might be called `searchFor`,\
    \ but in Objective-C the description of all the arguments is included as part\
    \ of the method name. Separate the method into pieces that end with a colon. When\
    \ you call the method, you need to supply one argument for each colon. The method\
    \ signature makes this clearer because it specifies the return type of the method\
    \ and the type of each of the arguments.\n\n```\n```objective-c\n- (BOOL)searchFor:(NSString\
    \ *)string\n           direction:(BOOL)forward\n       caseSensitive:(BOOL)caseFlag\n\
    \                wrap:(BOOL)wrapFlag\n```\n```\n\nHere’s how you might use it:\n\
    \n```\n```objective-c\n[myWebView searchFor:myString direction:YES caseSensitive:NO\
    \ wrap:YES]\n```\n```\n\nThe equivalent in Java or C# might be something like\
    \ this:\n\n```\n```java\nmyWebView.searchFor(myString, true, false, true)\n```\n\
    ```\n\nNewcomers to Objective-C tend to be more put off by the colons and by having\
    \ arguments mixed in than they are by the square brackets. I completely understand.\
    \ I think part of the difficulty comes when a method is short enough to list on\
    \ one line. Instead, you might find it easier to read if we use this more vertical\
    \ orientation:\n\n```\n```objective-c\n[myWebView searchFor:myString\n       \
    \     direction:YES\n        caseSensitive:NO\n                 wrap:YES]\n```\n\
    ```\n\nHere we are following the Objective-C code formatting standard and aligning\
    \ the colons. It makes it easy to see the method name as the combination of the\
    \ elements to the left of the colon and that the arguments sit to the right side\
    \ of each colon.\n\nThe Objective-C version might look like named parameters,\
    \ but they are not. The order of the arguments cannot be changed. You can’t leave\
    \ any of them out. The method name is `searchFor:direction:caseSensitive:wrap:`,\
    \ which is also called the *selector* because it is used at runtime to select\
    \ the method that will be called.\n\nYou will come to really appreciate the fact\
    \ that you don’t have to recall what the parameters true, false, and true refer\
    \ to as you do in the Java or C# versions. In the Objective-C version, you know\
    \ that you are conduct-"
  merge: -1
