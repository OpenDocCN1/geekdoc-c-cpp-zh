- pgno: 53
  md: 'These two methods are completely different. The trailing colon on the `goBack:`
    method indicates that it takes a single argument.


    Look up the `goBack:` method in the WebView class reference. Its signature is
    very different from the no-argument `goBack` method:


    # goBack:


    An action method that loads the previous location in the back-forward list.


    ```

    ```objc

    - (void)goBack:(id)sender

    ```

    ```


    **Parameters**


    *sender*


    The object that sent this message.


    **Discussion**


    This method does nothing if it is unable to move backward.


    **Availability**


    Available in Mac OS X v10.2 with Safari 1.0 and later.

    Available in Mac OS X v10.2.7 and later.


    **See Also**


    - `goForward:`


    **Declared In**


    `WebView.h`


    When you connected your Back button to the web view, you chose this `goBack:`
    method as the action. You''ll see this type of signature a lot with methods designed
    to be called by GUI components. The sender argument is a handle back to the calling
    object. The type of sender is upcast to `id`. This is the generic type for Cocoa.
    Any pointer to an object is at least of type `id`. Having a handle to the sender
    allows us to communicate with the object that called `goBack:` no matter what
    its type is. We''ll look at a typical example of how you might take advantage
    of this in Section 3.6, *Links Back to Yourself*, on page 58.⁴


    Here''s how you call a method that takes a single argument:


    ```

    ```objc

    [myWebView goBack:self]

    ```

    ```


    If you are still translating back and forth between Objective-C and another language,
    you might be used to something like this:


    ```

    ```text

    myWebView.goBack(this)

    ```

    ```


    ⁴. The return type of `goBack:` is `IBAction`. We''re going to wait until Chapter
    8, *Creating a Controller*, on page 141 to talk about what that means. For now,
    you can treat it as a void.'
