    \ named HelloApplication.\n\n![](img/9355405953264484a02198b0e3d25b7e_273_0.png)\n\
    \n# 17.3 Saving to a Plist\n\nObjects of type NSArray know how to write themselves\
    \ to a plist file. In fact, any collection that consists of objects of type NSDictionary,\
    \ NSArray, NSString, NSData, or NSNumber can easily write itself to disk as a\
    \ plist. You can make other objects fit by converting them to NSData and stuffing\
    \ them inside an array or dictionary.\n\nWe want to save the contents of the apps\
    \ array whenever we add an application to it. Add the highlighted line to your\
    \ add: method.\n\n```\n```objc\n-(void)add:(NSString *)app {\n    if ([self contains:app])\
    \ return;\n    [self.apps addObject:app.localizedName];\n    [self.apps writeToFile:self.dataFile\
    \ atomically:YES];\n}\n```\n```\n\nThis is pretty amazing. All you have to do\
    \ is tell the array to save itself to a file and provide the path to that file.\
    \ Arrays, dictionaries, strings,"
