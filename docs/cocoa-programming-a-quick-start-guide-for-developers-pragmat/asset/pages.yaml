- pgno: 182
  md: "# 10.6 Using the Text Field Delegate\n\nYou just used the text field to set\
    \ its look and the look of the keyboard associated with it. But the virtual keyboard\
    \ doesn’t know how to react after the user has entered data and clicks the Go\
    \ button. For that we need a delegate.[^6]\n\nIn Interface Builder, use the Connections\
    \ inspector to connect the text field’s delegate outlet to the File’s Owner and\
    \ save. In Xcode, add the declaration of the UITextFieldDelegate to the MobileBrowserViewController’s\
    \ header file in angle brackets:\n\n```\n```objc\n@interface MobileBrowserViewController\
    \ : UIViewController\n                                 <UITextFieldDelegate> {\n\
    ```\n```\n\nWith that we’ve just announced to the world that our MobileBrowserViewController\
    \ knows how to respond to any of seven optional messages for beginning and ending\
    \ editing, responding to Return, clearing the field, and changing some of the\
    \ characters.\n\nFor example, let’s disable the web view when the user starts\
    \ to edit the URL:\n\n```\n```objc\n-(void)textFieldDidBeginEditing:(UITextField\
    \ *)textField {\n    [self disableWebView];\n}\n```\n```\n\nTo disable the web\
    \ view, we’ll prevent the user from interacting with it, and we’ll dim it by adjusting\
    \ the alpha value to visually imply that it is not currently active. We’ll also\
    \ reenable the web view by reversing the steps we took in disabling it.[^7]\n\n\
    ```\n```objc\n-(void) disableWebView {\n    self.webView.userInteractionEnabled\
    \ = NO;\n    self.webView.alpha = 0.25;\n}\n-(void) enableWebView {\n    self.webView.userInteractionEnabled\
    \ = YES;\n    self.webView.alpha = 1.0;\n}\n```\n```\n\n[^6]: In the case of an\
    \ NSTextField, you’re working with a physical keyboard and don’t need a delegate.\n\
    \n[^7]: Note that alpha is a property of UIView, so you can adjust this value\
    \ for any subclass of UIView and not just a UIWebView."
