  md: "# 7.7  Exercise: Hiding the Button\n\nI don’t really like the current state\
    \ of the application. After the user clicks Personalize and the text field displays\
    \ a personal greeting, the button still says “Personalize” even though there’s\
    \ nothing more for the user to do.\n\nAfter the user personalizes the output,\
    \ hide the button.\n\n# 7.8  Solution: Hiding the Button\n\nYou’ll tend to write\
    \ less code when you are writing Cocoa apps in Objective-C, but it will initially\
    \ take you longer to find what that code is that you need to write. You’ll spend\
    \ a lot of time in the docs and searching the Internet. A lot of Cocoa coding\
    \ requires that you not do more than you have to do.\n\nFor example, our goal\
    \ here was to hide the button. We know that we have to send a message to the button,\
    \ so how do we do that? We could create an outlet for an NSButton in HelloWorldPro4AppDelegate.h\
    \ and connect the outlet to the button in the nib. This would be correct, but\
    \ it would be unnecessary.\n\nAt least for now, the only place we need access\
    \ to the button is inside the changeGreeting: method. And you have a handle to\
    \ the button there—it’s the sender that gets passed in as a parameter. All you\
    \ need to do is turn around and send the right message to the button by adding\
    \ this single line to your changeGreeting: implementation:\n\n```\n```objective-c\n\
    -(IBAction) changeGreeting:(id)sender {\n    self.window.backgroundColor = [NSColor\
    \ redColor];\n    [self.textField setStringValue:\n        [NSString stringWithFormat:@\"\
    Hello, %@\", NSFullUserName()]];\n    [sender setHidden:YES];\n}\n```\n```\n\n\
    If it would make you feel better, you can cast the sender to an NSButton so that\
    \ it is clearer who you are sending the message to:\n\n```\n```objective-c\n[(NSButton\
    \ *)sender setHidden:YES];\n```\n```\n\nSo, how did we know which message to send\
    \ to the button? First you head to the docs for NSButton and look through the\
    \ tasks for anything that has to do with hiding a button. There’s nothing there.\
    \ So, you go to the top of the documentation for NSButton, and you see that it\
    \ inherits"
