  md: "Connect your new outlet and action in the nib file. Set your bottom text field\
    \ to be selectable and editable and to send its value on Enter.\n\nSynthesize\
    \ the `keyField` property in the implementation file, and implement the `setValue:`\
    \ action like this:\n\n```\n~~~\nDownload KVC/Bookshelf3/BookshelfController.m\n\
    - (IBAction) setValue:(id) sender {\n    [self.book setValue:[sender stringValue]\n\
    \                forKey:[self.keyField stringValue]];\n}\n~~~\n```\n\nNow you\
    \ can get and set the value of any defined property as if you were using keys\
    \ and values in a dictionary. Let’s take that a step further.\n\n# ## 19.6 KVC\
    \ and Dictionaries\n\nSo, we’ve seen that Key Value Coding lets us treat properties\
    \ and their values as if they were entries in a dictionary. Let’s take a step\
    \ further—it turns out to be trivial to use a dictionary to fill an object’s properties\
    \ or to create a dictionary from a class so long as the keys match the names of\
    \ the properties.\n\nLet’s transform our running Bookshelf example to instantiate\
    \ our ProgBook and fill it with values pulled from a dictionary. This time, instead\
    \ of initializing the properties in book, we create a dictionary named bookInfo\
    \ with the keys title and author. We now set the values of book’s properties all\
    \ at once from the bookInfo dictionary like this:\n\n```\n~~~\nDownload KVC/Bookshelf4/BookshelfController.m\n\
    - (ProgBook *) book {\n    if (!book) {\n        self.book = [[ProgBook alloc]\
    \ init];\n        NSDictionary *bookInfo =\n            [NSDictionary dictionaryWithObjectsAndKeys:\n\
    \                @\"Manage Your Project Portfolio\", @\"title\",\n           \
    \     @\"Johanna Rothman\", @\"author\", nil];\n        [self.book setValuesForKeysWithDictionary:\
    \ bookInfo];\n    }\n    return book;\n}\n~~~\n```\n\nThat’s it.\n\nGoing the\
    \ other way is only slightly more involved. We need to pass in an array that is\
    \ filled with the new dictionary’s keys. These are the same as the object properties\
    \ we want to capture in this dictionary. In"
  merge: -1
