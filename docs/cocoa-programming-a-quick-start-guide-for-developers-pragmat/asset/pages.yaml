  md: "The other option is to set our property's underlying variable to point to the\
    \ object the argument is pointing to. This is the pointer version of `assign`,\
    \ and if it weren't for the memory management, the implementation would be exactly\
    \ the same. Suppose we have a property named `buddy` of type `Greeter`. The setter\
    \ looks something like this:\n\n```\n```objective-c\n-(void) setBuddy:newBuddy\
    \ {\n    if (buddy != newBuddy) {\n        [buddy release];\n        buddy = [newBuddy\
    \ retain];\n    }\n} //retain\n```\n```\n\nThese rules apply for both iPhone and\
    \ Mac OS X development. If you are taking advantage of the garbage collector,\
    \ then you don't need to worry about retaining and releasing variables, so you\
    \ can use `assign` anywhere you would have used either `assign` or `retain`.⁵\n\
    \nYou have one more attribute to set if you want to declare a property to be `nonatomic`.\
    \ By default, accessors are `atomic`. When your property is `atomic`, access to\
    \ that property is thread safe. In a desktop app where you are using the garbage\
    \ collector, this comes at very little cost. When you aren't using the garbage\
    \ collector, then in a getter you will have to set an object-level lock, retrieve\
    \ the value you want, release the lock, and then return the retrieved value. The\
    \ details for implementing an atomic setter in this situation are similar.\n\n\
    When you are writing code for the iPhone, you won't have a garbage collector available.\
    \ If you access properties a lot, you will feel a dip in performance. So when\
    \ we declare our properties for the iPhone, we will tend to set the attribute\
    \ `nonatomic`, and when we are developing for the desktop, we will use the default\
    \ setting. For more information, read the “Declared Properties” chapter of Apple’s\
    \ *The Objective-C Programming Language* [App09].\n\n# ## 5.7 Exercise: Adding\
    \ Properties\n\nAdd these three properties to `Greeter`: an `NSInteger` named\
