    \ (void)applicationDidFinishLaunching:(NSNotification *)aNotification {\n    \
    \    [self createSetOnDisk];\n        [self setFromDisk];\n        NSLog(@\"Set\
    \ from disk: %@\", self.retrievedSet);\n    }\n```\n\nThe additional line uses\
    \ the property’s getter, and this change to set-FromDisk uses the property’s setter:\n\
    \n```\n    Download Categories/Bounce/BounceAppDelegate.m\n\n    - (void) setFromDisk\
    \ {\n        self.retrievedSet = [NSSet setWithContentsOfFile:@\"savedSet\"];\n\
    \    }\n```\n\nMake the property writable by overriding the declaration of the\
    \ retrieved-Set property:\n\n```\n    Download Categories/Bounce/BounceAppDelegate.m\n\
    \n    @interface BounceAppDelegate()\n    - (void)createSetOnDisk;\n    - (void)setFromDisk;\n\
    \    @property(copy) NSSet *retrievedSet;\n    @end\n```\n\nNow any client code\
    \ that imports the header will see this property as read-only while internally\
    \ we have redefined the property as read-write before synthesizing the methods.\
    \ You can’t add a new property in the class extension unless there is already\
    \ an underlying instance variable. Here we’ve just modified the attributes of\
    \ an existing property.\n\n# ### 23.7 Categories and Core Data\n\nSuppose I want\
    \ to add behavior to my Core Data entities. Suppose I want to log some sort of\
