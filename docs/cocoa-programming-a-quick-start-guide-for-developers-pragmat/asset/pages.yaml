- pgno: 228
  md: "```\nDownload Dictionaries/HelloApplication/8/CurrentApp.m\n\n```objc\n- (void)setUpNotification:(NSString\
    \ *)notification withSelector:(SEL)methodName {\n    [[NSNotificationCenter defaultCenter]\n\
    \        addObserver:self\n             selector:methodName\n                \
    \ name:notification\n               object:nil];\n}\n```\n```\n\nThis method is\
    \ just a wrapper around a call to the shared workspace’s notification center to\
    \ register our notification.\n\nBreaking down the process into these smaller pieces\
    \ makes each piece easier to understand. We understand immediately what is being\
    \ done in the init method even though we don’t have all the details of how. We\
    \ could have written one long init method that replaced each piece with the code\
    \ that it calls. There would be no need to make up new names for our own methods\
    \ and pass information around. Everything would have been in one location.\n\n\
    The same tension applies when we design classes and objects. We’ve isolated the\
    \ model behavior in CurrentApp and the controller behavior in ActivityController.\
    \ Each piece is now easier to understand, but we spent the past three chapters\
    \ exploring different ways to communicate between them. We could have combined\
    \ them into one harder to understand object that might have been easier to implement.\n\
    \nIn this case, I chose to separate them because I get flexibility I wouldn’t\
    \ otherwise have. I’m going to be able to use this same model for an entirely\
    \ different controller and view without rewriting a line of code in CurrentApp.m.\
    \ Later when I need to make further adjustments to the code, I will know whether\
    \ the change needs to be to the model or the controller. In other words, in this\
    \ case the simplicity of the objects is more important than the difficulty of\
    \ communicating between them.\n\n# 14.2  Splitting Nibs\n\nWe have a single nib\
    \ file named MainMenu.xib that contains a lot of objects."
