  md: "We’ll ignore this problem for now and focus on the other issue. If you look\
    \ at this code, you’ll see that we own host because we created it with an alloc:\n\
    \n```\nDownload Memory/Flashlight9/Classes/FlashlightAppDelegate.m\n\n- (Greeter\
    \ *) greeterFor:(NSString *) personName {\n    return [[Greeter alloc] initWithName:personName];\n\
    }\n```\n\nTo highlight the problem, let’s create the object and release it in\
    \ two different steps like this:\n\n```\nDownload Memory/Flashlight9/Classes/FlashlightAppDelegate.m\n\
    \n- (Greeter *) greeterFor:(NSString *) personName {\n    Greeter *tempGreeter\
    \ = [[Greeter alloc] initWithName:personName];\n    return tempGreeter;\n}\n```\n\
    \nWhere can we release tempGreeter?\n\nYou can’t just release tempGreeter before\
    \ you return it, or the retain count will be zero and tempGreeter will be dereferenced\
    \ before you try to return it. You can’t ignore the reference you hold for tempGreeter.\
    \ That’s the memory leak we’re trying to fix. If you don’t release it, you may\
    \ be holding on to tempGreeter after no object is really using it because you\
    \ haven’t decremented its retain count.\n\nThe solution is to use an autorelease\
    \ pool.ⁱ⁰ You send tempGreeter the autorelease message, and it is marked to be\
    \ released once the method that calls the greeterFor: method completes. You can\
    \ also do this when you create the Greeter instance. In that case, you can eliminate\
    \ the temporary variable and accomplish your needs like this:\n\n```\nDownload\
    \ Memory/Flashlight10/Classes/FlashlightAppDelegate.m\n\n- (Greeter *) greeterFor:(NSString\
    \ *) personName {\n    return [[[Greeter alloc] initWithName:personName] autorelease];\n\
    }\n```\n\nNow we can solve our second problem by removing the call to [host release]\
    \ in applicationDidFinishLaunching:. The object the host variable points to is\
    \ not retained because it is now autoreleased. Since we no longer own this object,\
    \ we are no longer allowed to release it.\n\n+   9. I’ll assume that it's obvious\
    \ that you couldn’t put the call to release the object in the line after the return.\n\
    +   10. For more information on autorelease pools and memory management, see Apple’s\
    \ publication *Memory Management Programming Guide for Cocoa*."
