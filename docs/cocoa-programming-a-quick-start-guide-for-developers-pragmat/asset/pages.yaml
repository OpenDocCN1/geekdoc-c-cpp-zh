    ```\n```objective-c\n- (Greeter *) greeter {\n    return [[Greeter alloc] init];\n\
    }\n```\n```\n\nWe’d kind of like our applicationDidFinishLaunching: method to\
    \ come at the top of our code so people can glance at it and get an idea of what\
    \ the class does. Remember, the compiler reads your code from top to bottom. If\
    \ the applicationDidFinishLaunching: were at the top, the compiler would complain\
    \ that it doesn’t know about the greater method or the labelWithText: method.\
    \ The program would still run fine, but you would have these warnings.\n\nWe could\
    \ declare the greater and labelWithText: methods in the header file, but they\
    \ really aren’t part of the public interface. We’ll learn other tricks, but for\
    \ now we’ll leave the applicationDidFinishLaunching: method at the bottom.\n\n\
    # 4.9  Initializing Your Objects\n\nWhen we create a new Greeter object, we allocate\
    \ memory, and then we call the init method. But you’ve seen the Greeter. It doesn’t\
    \ have an init method of its own. When you call init on an instance of Greeter,\
    \ you are really calling init on Greeter’s superclass NSObject.\n\n9. We could\
    \ leave the creation of the Greeter object inlined as part of the applicationDidFinishLaunching:\
    \ method. I've split it out to emphasize small methods and to provide more experience\
