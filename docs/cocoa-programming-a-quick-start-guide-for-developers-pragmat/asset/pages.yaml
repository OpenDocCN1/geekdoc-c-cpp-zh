  md: 'Don’t worry if this isn’t clicking for you yet. I mainly want you to be prepared
    when the compiler complains about this problem later in the book. The main place
    you will have to think about managing your memory is when creating apps for the
    iPhone, iPod touch, and iPad. For the remainder of the chapter we’ll look at an
    example of an iPhone app.


    # 6.5 Creating a Flashlight


    Currently, if you are targeting the iPhone or iPad, you have to use reference
    counting and manage the memory yourself. Let’s build the iPhone version of our
    HelloWorld project so that we can experiment with some of the rules you’ve learned.


    You need to register to become an iPhone developer at http://developer.apple.com/iphone.
    It’s free but requires that you agree to Apple’s terms. When you are ready to
    deploy to your phone or distribute on the App Store, you’ll need to join one of
    the programs that cost money.


    If you are not registered as an iPhone developer, you can just continue to work
    with our current example; just set garbage collection back to being Unsupported.


    Create a new project in Xcode (File > New Project...). This time choose the iPhone
    > Application > Window-based Application template. Make sure the checkbox for
    using Core Data is unselected, and click Choose. Name the project Flashlight,
    and choose Save.


    Click Build & Run, and the iPhone Simulator will launch and run your application.
    You should see a plain white screen with the status bar at the top. Congratulations,
    you’ve built a flashlight. People have sold these on the App Store.


    We need to copy the header and implementation files for the Greeter class. Select
