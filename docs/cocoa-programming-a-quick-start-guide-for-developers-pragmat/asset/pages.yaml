  md: 'Finally, you need to bind the table column to the Chapter Controller. As before,
    you’ll bind Value with the Controller Key setting of arrangedObjects because you
    are binding a column to the contents of an array. You’ll use the Model Key Path
    setting of title. I’ll pause while you retrace these steps for the author table
