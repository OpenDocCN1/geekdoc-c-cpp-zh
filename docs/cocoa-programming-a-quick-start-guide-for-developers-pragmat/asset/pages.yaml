- pgno: 284
  md: '# Chapter 18


    # Changing Views


    Back in Chapter 16, *Displaying Data in a Table*, on page 256, we made it easy
    to swap which view controller and view were used by the window controller. The
    good news is that you can switch back and forth by changing the name of the view
    controller class and the nib name and recompiling. The bad news is that your user
    can’t make that same change at runtime.


    In this chapter, we’ll create a new preference that the user can set to specify
    which view should be visible when the application launches. We’ll then use that
    preference to display the view that the user chose at launch time. We’ll then
    extend the example to allow the user to switch back and forth as often as they’d
    like while the application is running.


    We wrapped up the first act of our story by re-creating our simple web browser
    for the iPhone. That wasn’t a lot of new material, but the point was to take another
    quick pass through what you’ve learned so far in a new context.


    As the curtain falls on our second act, let’s look back on some of the techniques
    you’ve learned while working with this example. Although you’ll learn new things
    here and there, the main goal is for you to see the advantages of working with
    multiple nibs and small well-defined classes and methods.


    # 18.1 Working with Radio Buttons


    Let’s add a group of radio buttons to the preference panel. Double-click Preferences.xib,
    and search in the Library for *Radio*.'
  merge: -1
  img_proc: true
