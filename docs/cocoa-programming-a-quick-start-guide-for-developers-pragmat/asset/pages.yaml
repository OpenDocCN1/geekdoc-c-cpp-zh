  md: 'You have already done a Build & Run, so there is a product available for us
    to run in Instruments. In Xcode choose the menu item Run > Run with Performance
    Tool > Leaks. The Instruments application will launch, and your Flashlight application
    will launch from within Instruments. Almost immediately you should see a vertical
    blue line in the top row of the Instruments window as objects are being allocated.
    About ten seconds later, you should see a red line with a series of blue lines
    in the second row of the Instruments window. The red line represents the number
    of leaks discovered, and the blue lines represent the bytes that have been leaked.


    ![](img/9355405953264484a02198b0e3d25b7e_111_0.png)


    The leak happened much earlier, but the default setting is to sample for leaks
    every ten seconds. By default the Object alloc data is reported in the lower-right
    portion of the Instruments window. Select the Leaks instrument at the top left,
    and you should see the leak information. You can see in this sample output that
    the leak is reported to originate in FlashlightAppDelegate’s applicationDidFinishLaunching:
    method. That is enough information for us to find the leak, although if you double-click
    the line reporting the leaked Greeter object, you will be taken to the offending
    lines in the source code. Now that we know where the leak is, let’s fix it.


    # ### 6.7 Fixing the Memory Leak on the iPhone


    Memory management is a balance of many constraints. The most elementary is that
    you don’t want to release the memory for an object while something else might
    still be pointing to it. On the other hand, you don’t want to create a memory
    leak by hanging on to objects long after no one needs them anymore. The way to
    accomplish this in Objective-C is through reference counting.'
