- pgno: 319
  md: "```\nDownload KVC/Counters/UpOrDown.h\n\n#import <Cocoa/Cocoa.h>\n\n@interface\
    \ UpOrDown : NSObject {\n    NSNumber *count;\n}\n-(IBAction) step:(id) sender;\n\
    @end\n```\n\nLet's go fix the nib file and then come back and implement these\
    \ two classes. In Interface Builder, break the connection between UpOrDown's display\
    \ outlet and Display. Select Display, and connect its counter outlet to UpOrDown.\
    \ Save your work.\n\nNow we're ready to set up our observer. There are three basic\
    \ steps:\n\n+   1. The observer needs to register with the object that contains\
    \ a property it wants to observe.\n+   2. The observed object must update its\
    \ property in such a way that observers will be notified of the change.\n+   3.\
    \ The observer must respond to notifications it receives.\n\nLet's look at each\
    \ of these in turn.\n\n# ## 20.4 Registering an Observer\n\nRegistering as an\
    \ observer is easy. You just send this message to the object you want to observe:\n\
    \n```\naddObserver:forKeyPath:options:context:\n```\n\nPass in a pointer to the\
    \ observer as the first parameter. In this case, we'll pass in self, but you can\
    \ use any object. The keypath is the path to the property we're interested in.\
    \ This is the same form that you saw when learning about KVC. Four options are\
    \ available to you, and you can combine them using |.\n\nThe four NSKeyValueObservingOptions\
    \ are NSKeyValueObservingOptionNew, NSKeyValueObservingOptionOld, NSKeyValueObservingOptionInitial,\
    \ and NSKeyValueObservingOptionPrior. The first two control whether you get the\
    \ new or old value of the attribute you're watching. The third sends a notification\
    \ when you are first setting up the observer. The last indicates you want a message\
    \ sent before and after each change instead of just after."
  merge: -1
  img_proc: true
- pgno: 320
  md: "Here’s how we register our Display to listen for changes in the count property\
    \ of the UpOrDown object. We’ll register when the Display object awakes from nib.\n\
    \n```\n```objc\n-(void) awakeFromNib {\n    [counter addObserver:self\n      \
    \        forKeyPath:@\"count\"\n                 options:NSKeyValueObservingOptionNew\n\
    \                 context:NULL];\n}\n```\n```\n\nAll objects inherit addObserver:forKeyPath:options:context:\
    \ from NSObject so the Display object can send that message to the UpOrDown object\
    \ to register itself as an observer of the count property.\n\nDon’t forget to\
    \ clean up after yourself. You need to unregister your observers when the observer\
    \ is being released. When we managed memory by reference counting, we released\
    \ resources in the dealloc method. Now, with automatic garbage collection turned\
    \ on, we instead use the finalize method as dealloc is never called.\n\n```\n\
    ```objc\n-(void) finalize {\n    [counter removeObserver:self forKeyPath:@\"count\"\
    ];\n    [super finalize];\n}\n```\n```\n\nThat’s all there is to responsibly registering\
    \ an observer.\n\n# 20.5 Making Changes Observable\n\nWe’ve seen so much magic\
    \ in Cocoa that it seems as if you should just be able to set the value of UpOrDown’s\
    \ ivar count like this and have the change get picked up by Display.\n\n```\n\
    ```objc\n-(void) step: (id) sender {\n    //not good enough\n    count = [NSNumber\
    \ numberWithInteger:[sender integerValue]];\n}\n```\n```\n\nUnfortunately, when\
    \ you set a variable directly, you need to bracket the change with a signal that\
    \ an observed value is about to change and another signal that the observed value\
    \ did change."
  merge: -1
  img_proc: true
- pgno: 321
  md: "The corrected code looks like this:\n\nDownload KVO/Counters/UpOrDown.m\n\n\
    ```\n~~~\n-(IBAction) step: (id) sender {\n    [self willChangeValueForKey:@\"\
    count\"];\n    count = [NSNumber numberWithInteger:[sender integerValue]];\n \
    \   [self didChangeValueForKey:@\"count\"];\n}\n~~~\n```\n\nThis is a pain in\
    \ the neck. There are two other less painful ways. One is to use Key Value Coding.\
    \ When you use setValue:forKey:, the observers are notified. KVC and KVO are made\
    \ to work together. Here’s how you would modify UpOrDown to use KVC:\n\nDownload\
    \ KVO/Counters/UpOrDown.m\n\n```\n~~~\n-(IBAction) step: (id) sender {\n    [self\
    \ setValue:[NSNumber numberWithInteger:[sender integerValue]]\n            forKey:@\"\
    count\"];\n}\n~~~\n```\n\nI don’t know if that went by too quickly for you to\
    \ notice how slick it was. count is an instance variable and not a property, and\
    \ we just used KVC to change its value. I know I said we could in the previous\
    \ chapter, but now you can see an added benefit of doing so. You change the value\
    \ of the variable, and you send notifications of that change to observers that\
    \ have registered using KVO.\n\nAnother solution is to declare and use a property\
    \ for the variable count. Add your property to the header file:\n\nDownload KVO/Counters/UpOrDown.h\n\
    \n```\n~~~\n#import <Cocoa/Cocoa.h>\n\n@interface UpOrDown : NSObject {\n    NSNumber\
    \ *count;\n}\n@property(copy) NSNumber *count;\n-(IBAction) step:(id) sender;\n\
    @end\n~~~\n```\n\nSet the property value directly. The observer will be notified\
    \ of the change:\n\nDownload KVO/Counters/UpOrDown.m\n\n```\n~~~\n#import \"UpOrDown.h\"\
    \n\n@implementation UpOrDown\n@synthesize count;\n~~~\n```"
  merge: -1
