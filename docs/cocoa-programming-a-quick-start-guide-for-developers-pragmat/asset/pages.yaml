    the Enabled checkbox so that initially the user can''t click the Back button.
    Similarly, set the Forward button''s Identifier to Fast Forward, and unselect
    the Enabled checkbox.


    Lastly, select a UIWebView, and position it to occupy all of the view below the
    toolbar. Open the Attributes inspector for the web view, and check the box Web
    View > Scales Page to Fit. Save your work. That''s our interface for now.


