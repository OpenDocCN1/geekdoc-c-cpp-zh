- pgno: 227
  md: "or implement an action or perform a calculation. Methods that belong together\
    \ are collected in a class. Objects are instances of these classes. We often collect\
    \ objects that need to communicate with each other in a nib file.\n\nIn other\
    \ words, a nib is a cohesive collection of objects, their initial state, and their\
    \ connections to each other in the same way that an object is a collection of\
    \ variables, their initial state, and the messages the object understands. Over\
    \ the next few chapters, I will help you see that one nib is seldom enough for\
    \ your application any more than a single object is.\n\nBefore we start splitting\
    \ this nib into smaller pieces, let's consider the advantages and disadvantages\
    \ that you've seen when refactoring methods or classes. Shorter methods can be\
    \ more easily described, and what they do is more easily understood. For example,\
    \ when we create a new instance of CurrentApp, we currently do this:\n\n```\n\
    Download Dictionaries/HelloApplication18/CurrentApp.m\n\n- (id) init {\n    if\
    \ (self = [super init]) {\n        [self registerNotifications];\n        [self\
    \ initializeMethodDictionary];\n    }\n    return self;\n}\n```\n\nOur customization\
    \ is to register the notifications for this object and to initialize the method\
    \ dictionary. This method reads like prose. The registerNotifications method looks\
    \ like this:\n\n```\nDownload Dictionaries/HelloApplication18/CurrentApp.m\n\n\
    - (void) registerNotifications {\n    [self setUpNotification:NSWorkspaceDidLaunchApplicationNotification\n\
    \            withSelector:@selector(applicationDidLaunch:)];\n    [self setUpNotification:NSWorkspaceDidTerminateApplicationNotification\n\
    \            withSelector:@selector(applicationDidTerminate:)];\n}\n```\n\nAgain,\
    \ once you've wrapped your head around Objective-C syntax, this reads clearly.\
    \ It says that we are setting up the \"did launch\" application notification with\
    \ the callback method applicationDidLaunch: and the \"did terminate\" application\
    \ notification with the callback method applicationDidTerminate:. How we actually\
    \ do that is captured in the setUpNotification:withSelector: method."
