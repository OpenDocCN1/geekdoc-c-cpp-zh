  md: "More formally, when the browser application starts up, an instance of the UIApplication\
    \ class is created, and the MainWindow nib is loaded.²\n\n![](img/9355405953264484a02198b0e3d25b7e_175_0.png)\n\
    \n![](img/9355405953264484a02198b0e3d25b7e_175_1.png)\n\nThe nib contains an object\
    \ that represents the application whose delegate outlet is connected to the MobileBrowserAppDelegate.\
    \ The nib file also contains the MobileBrowserViewController. In the app delegate's\
    \ applicationDidFinishLaunching: method, the view controller's view is added to\
    \ the window.\n\n```\n~~~objective-c\nBrowserAppDelegate.m\n\n- (void)applicationDidFinishLaunching:(UIApplication\
    \ *)application {\n    // Override point for customization after app launch\n\
    \    [window addSubview:viewController.view];\n    [window makeKeyAndVisible];\n\
    }\n~~~\n```\n\nThis is the way most iPhone apps work. They have a single window\
    \ for the entire application. What you think of as a screen are the contents of\
    \ a view, and when you switch from one screen to another using the tab bar, nav\
    \ bar, or some other means, you are replacing the window's old view with the new\
    \ view by working with their view controllers.\n\nGenerally, each of these top-level\
    \ views is contained in its own nib file with its view controller as the File's\
    \ Owner. I'm not going to talk about the File's Owner yet. Let's just say that\
    \ most of our work for this application will happen in the second nib file and\
    \ in the view controller.\n\nA view controller's job, as you might have guessed,\
    \ is to control a view. While the view is all about appearance, the controller\
    \ defines the\n\n2\\. iPhone-specific classes often begin with UI and not NS as\
    \ you saw in desktop applications."
