    \               initWithNibName:@\"ActivityView\" bundle:nil];\n    self.currentApp\
    \ = [[CurrentApp alloc] init];\n    self.currentApp.delegate = self.ac;\n    [self.window\
    \ setContentSize:[self.ac.view bounds].size];\n    self.window.contentView = self.ac.view;\n\
