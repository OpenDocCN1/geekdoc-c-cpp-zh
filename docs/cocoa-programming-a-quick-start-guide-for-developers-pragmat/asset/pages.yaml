  md: 'it isn’t. Once the second page loads, enter a third URL. Now the Back button
    is enabled, and you can use it to navigate all the way back to the first page.
    The problem is that it takes a while for the URL to load, and you have already
    set the state of the buttons based on the status just after the request to load
    the URL was made. It would be better if you selected canGoBack: and canGoForward:
    after the URL starts to load.


    Quit the application, and launch it again. Enter a URL. Once the page loads, click
    a link. Once that page loads, follow another link. As long as you continue to
    use the links in the web view, the buttons are never enabled. The history is being
    maintained, but there’s no callback to resetButtons. You can see this if you enter
    a URL. Once the page loads, you can use the buttons to move back and forward through
    the history.


    All of the methods we’ve seen so far execute immediately. What we need is a way
    of delaying when a message is sent—don’t ask me if I can go back or forward until
    I have loaded the page you requested. Fortunately, this notification mechanism
    is built into Cocoa with the notion of delegates. We’ll look into how they work
    in the next chapter.'
