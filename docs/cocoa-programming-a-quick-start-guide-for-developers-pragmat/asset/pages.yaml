  md: "The power of blocks is that you can change the body of this function to return\
    \ the product instead just by passing in a different block. Here is the complete\
    \ applicationDidFinishLaunching: method. I've highlighted in passing the two different\
    \ blocks.\n\n```\nDownload Blocks/SimpleCalc4/SimpleCalcAppDelegate.m\n\nLine\
    \ 1\n- (void)applicationDidFinishLaunching:(NSNotification *)aNotification {\n\
    \    NSNumber *firstNumber = [NSNumber numberWithInteger:7];\n    NSNumber *secondNumber\
    \ = [NSNumber numberWithInteger:5];\n    NSNumber *sum = [self combine:firstNumber\n\
    5\n                    with:secondNumber\n                    usingBlock:^(NSNumber\
    \ x,NSNumber y){return x+y;}];\n        NSLog(@\"The sum of %@ and %@ is %@.\"\
    ,\n            firstNumber, secondNumber, sum);\n    NSNumber *product = [self\
    \ combine:firstNumber\n10\n                    with:secondNumber\n           \
    \         usingBlock:^(NSNumber x,NSNumber y){return x*y;}];\n        NSLog(@\"\
    The product of %@ and %@ is %@.\",\n            firstNumber, secondNumber, product);\n\
    }\n```\n\nYou already know how to provide a block as a parameter. We pass in blocks\
    \ for addition and multiplication in lines 6 and 11.\n\nThis was sort of a silly\
    \ example of using wrappers, but it illustrated the technique. A more typical\
    \ situation might be performing actions on a file that is stored remotely. No\
    \ matter what your action, you need to perform a set of steps to access the file\
    \ before your action, and you need to perform another set of steps to clean up\
    \ your resource after your action. It would make sense to write a method that\
    \ includes that protocol with the action accepted in the middle as a block. In\
    \ fact, any time you have more than one action that is preceded and/or followed\
    \ by the same steps, consider using this wrapper technique with blocks.\n\nWhat\
    \ about iterating through an array and performing an action on each one of the\
    \ elements? It turns out that this is such a common situation that Apple has built\
    \ in the ability to send a block to each element of a collection into arrays,\
    \ sets, and dictionaries. We'll look at that after we look at how blocks work\
    \ with variables defined in the same scope.\n\n# ### 24.4 Capturing Values\n\n\
    So far, I've ignored a major feature of blocks: they include a snapshot of the\
    \ values of variables that are in scope at the time the block is"
