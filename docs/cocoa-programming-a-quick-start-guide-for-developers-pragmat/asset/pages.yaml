    \ = [[NSMutableArray alloc] initWithCapacity:20];\n        [self.runningApps addObjectsFromArray:[[NSWorkspace\
    \ sharedWorkspace]\n            runningApplications]];\n    }\n    return self;\n\
    }\n```\n```\n\nNext, let’s take this to the next stage and display something different\
    \ in each column.\n\n# ### 16.6 Filling Cells Based on Table Column Titles\n\n\
    It’s easy for the body of the tableView:objectValueForTableColumn:row: method\
    \ to get ugly. For example, how would you display the application’s icon in the\
