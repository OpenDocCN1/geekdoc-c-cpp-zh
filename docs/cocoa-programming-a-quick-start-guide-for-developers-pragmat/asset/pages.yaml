- pgno: 234
  md: '# 14.6　The File’s Owner


    One advantage of having small focused nib files like ActivityView.xib is that
    we can choose a File’s Owner that better fits. Here the nib file is currently
    the view that we’ll be displaying in the main window, so our File’s Owner will
    be in charge of managing the view and its contents. The natural choice for the
    File’s Owner is the ActivityController object we created in MainMenu.xib.


    To set the File’s Owner, select File’s Owner in the ActivityView.xib’s Document
    window. Use the Identity inspector to change the class name of the File’s Owner
    to ActivityController, and save your work.


    ![](img/9355405953264484a02198b0e3d25b7e_234_0.png)


    Let’s connect up the ActivityController. There are five possible connections.
    The two reference outlets are connected in MainMenu.xib.


    ![](img/9355405953264484a02198b0e3d25b7e_234_1.png)


    We need to connect the three outlets in ActivityView.xib. Connect the view outlet
    to the Custom View, the imageView outlet to the NSImageView, and the activityDisplay
    outlet to the NSTextView.'
