  md: "# ### 15.6 Drawing Text\n\nYou should use a text field or a text view when\
    \ you are displaying a lot of text. We aren't. We are displaying a simple and\
    \ short message, so we can draw text into our custom view. This section shows\
    \ you the techniques you'll use when you need to draw text into a custom view.\n\
    \nTo draw a string into the custom view, we'll send the message drawIn-Rect:withAttributes:\
    \ to that string inside the drawRect: method. This method takes two parameters.\
    \ The first is the location and dimensions of the rectangle into which the string\
    \ will be drawn. The second is a dictionary containing any special attributes\
    \ you want to set.\n\nAdd an instance variable for the rectangle and for the string\
    \ that will hold the name of the application to IconView.h. Create a property\
    \ for the appName variable:\n\n```\n~~~\nDownload CustomView/HelloApplication27/IconView.h\n\
    #import <Cocoa/Cocoa.h>\n\n@interface IconView : NSView {\n    NSColor *alertColor;\n\
    \    NSRect frameRect;\n    NSImageView *imageView;\n    NSRect imageRect;\n \
    \   NSString *appName;\n    NSRect textRect;\n}\n@property(copy) NSColor *alertColor;\n\
    @property NSImageView *imageView;\n@property(copy) NSString *appName;\n@end\n\
    ~~~\n```\n\nIn IconView.m, add this line to create this rectangle to the end of\
    \ the awakeFromNib method:\n\n```\n~~~\nDownload CustomView/HelloApplication27/IconView.m\n\
    textRect = NSMakeRect(36, 10, 144, 20);\n~~~\n```\n\nThat way, you create the\
    \ rectangle once, and you write different text in it every time the drawRect:\
    \ method is called. In this version, we'll use the default look, so we'll pass\
    \ in nil in place of the dictionary. Add this line to the end of the drawRect:\
    \ method:\n\n```\n~~~\nDownload CustomView/HelloApplication27/IconView.m\n[self.appName\
    \ drawInRect:textRect withAttributes:nil];\n~~~\n```"
