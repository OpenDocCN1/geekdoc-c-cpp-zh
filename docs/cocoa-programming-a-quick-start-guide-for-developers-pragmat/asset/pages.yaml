    \ Pretty nifty.\n\nLook how this simplifies the code—there are no choices to make.\
    \ Better yet, we don't have to change this code if we introduce new columns.\n\
    \n# ## 16.8 Previews of Coming Attractions\n\nIt turns out that one advantage\
    \ of properties is that they follow a certain naming convention that allows us\
    \ to treat objects as if they were dictionaries. In other words, we can pass in\
    \ the name of the property whose value we want the same way we pass in keys to\
    \ a dictionary. You'll learn a lot more about this in Chapter 19, *Key Value Coding*,\
    \ on page 298.\n\nThis is such a great place to apply the technique that I just\
    \ can't wait until we get there. You don't need to understand KVC to appreciate\
    \ this application. Instead of converting the identifier to a SEL and then performing\
    \ that selector, we use the `valueForKey:` method and pass in the identifier as\
    \ the key.\n\n```\n```objective-c\nDownload Table/HelloApplication34/ActivityController.m\n\
    - (id)tableView:(NSTableView *)aTableView\n    objectValueForTableColumn:(NSTableColumn\
    \ *)aTableColumn\n        row:(NSInteger)rowIndex {\n    return [[self.runningApps\
    \ objectAtIndex:rowIndex]\n        valueForKey:[aTableColumn identifier]];\n}\n\
    ```\n```\n\nThis is yet another thing about programming with Cocoa that makes\
    \ me smile.\n\n# ## 16.9 Exercise: Adding and Removing Rows\n\nOur mini-Dock now\
    \ shows a snapshot of the icons and names of the applications that are running\
