  md: 'It looks a little different than the inspector window when you are creating
    Mac OS X applications. You have four tabs that you''ll use to inspect and change
    the attributes, connections, size, and identity. Choose the Attributes inspector
    for the Back button.


    ![](img/9355405953264484a02198b0e3d25b7e_177_0.png)


