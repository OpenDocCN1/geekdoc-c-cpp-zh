- pgno: 73
  md: "Here’s the header file with two comments I’ve inserted to help our discussion:\n\
    \n[Download](Classes/HelloWorld5/Greeter.h)\n\n```\n#import <Cocoa/Cocoa.h>\n\n\
    @interface Greeter : NSObject {\n    // you'll declare instance variables here\n\
    }\n\n    // you'll declare methods here\n\n@end\n```\n\nEverything between @interface\
    \ and @end is the description of the public interface for the Greeter class. Greeter\
    \ : NSObject indicates that the Greeter class directly extends the root class\
    \ NSObject. WebView, in contrast, is a subclass of NSView, which in turn is a\
    \ subclass of NSResponder, which is a subclass of NSObject. Unless you specifically\
    \ override it, you benefit from inheriting the behavior of any of your superclasses.\
    \ The behavior that is common to all objects is specified in the root class NSObject.\
    \ You will sometimes have to look in the documentation of a superclass to find\
    \ methods that are available to objects created from your class.\n\nIn the header\
    \ file, the comments I’ve added to the template code show that you add the declaration\
    \ for your instance variables inside the curly braces, and you declare your methods\
    \ between the closing brace and the @end.\n\nHere’s Greeter.m, the implementation\
    \ file you just generated:[^7]\n\n[Download](Classes/HelloWorld5/Greeter.m)\n\n\
    ```\n#import \"Greeter.h\"\n\n@implementation Greeter\n\n@end\n```\n\nThe file\
    \ begins by importing the header file for Greeter. Other than that, you won’t\
    \ see anything other than the beginning and end markers for the class implementation.\
    \ Notice that in this file you don’t specify that the Greeter inherits from NSObject.\n\
    \n[^7]: Note the suffixes of the two files Greeter.h and Greeter.m. The h is for\
    \ header, and the m is for implementation. You’ll find this and other fun facts\
    \ in the Objective-C FAQ at http://www.faqs.org/faqs/computer-lang/Objective-C/faq/."
  merge: -1
  img_proc: true
- pgno: 74
  md: "You will use this combination of the Greeter.h and Greeter.m files to define\
    \ the Greeter class. A class’s header file contains the information you are happy\
    \ to share publicly. Other classes will import this header file so they know which\
    \ messages they can send this class. The implementation file contains the part\
    \ of the class that is no one else’s business. The header file tells others what\
    \ they can ask this class or objects of this type to do. The implementation hides\
    \ away the details of how this work is accomplished.\n\n# ### 4.6 Creating and\
