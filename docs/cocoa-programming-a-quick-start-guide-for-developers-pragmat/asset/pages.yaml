- pgno: 57
  md: 'This tells you that the message someMessageIDoesNotUnderstand was sent to an
    instance of CustomClass and that CustomClass does not implement that method.


    So, why wasn’t this caught at compile time? It probably was. You will most likely
    get a warning that CustomClass may not respond to the message someMessageIDoesNotUnderstand.⁸


    There are times that we will take advantage of the dynamic typing and dynamic
    binding and other times that we will find it helps to take advantage of the help
    the compiler can give us if it knows the types we are targeting. One way to avoid
    runtime errors is to become familiar with Apple’s docs so that you are sending
    objects messages they understand.


    # 3.6  Links Back to Yourself


    We used the WebView method takeStringURLFrom: to use the URL the user types into
    the text field for the web view. The takeStringURLFrom: signature looks a lot
    like the goBack: method’s.


    ```

    - (IBAction)takeStringURLFrom:(id)sender

    ```


    Assume that we have an instance of WebView named myWebView and the text field
    is an instance of NSTextField named addressField. Then when the user enters a
    string in the text field and hits ↵, something like this message is sent:


    ```

    [myWebView takeStringURLFrom: self]

    ```


    You might want to visualize this as a message from the text field with the target
    as the WebView instance.


    ![](img/9355405953264484a02198b0e3d25b7e_57_0.png)


    ⁸. There are times that you can carefully ignore this warning. You may know that
    at runtime validObject will not be an instance of CustomClass but will be an instance
    of a class that can handle someMessageIDoesNotUnderstand.'
