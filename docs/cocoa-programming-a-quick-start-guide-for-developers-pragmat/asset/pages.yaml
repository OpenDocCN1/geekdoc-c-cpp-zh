- pgno: 290
  md: "controller. The value with key “nib” is a string with the name of the nib for\
    \ our view.\n\nIf you’d rather not write this file by hand, you can write it in\
    \ code. Add this to your app delegate’s applicationDidFinishLaunching: method,\
    \ click Build & Run, and then remove this code. This will create a file named\
    \ Views in your build directory.\n\n```\n```objc\nNSDictionary *tableview = [NSDictionary\
    \ dictionaryWithObjectsAndKeys:\n        @\"ActivityView\", @\"nib\", @\"ActivityController\"\
    , @\"class\", nil];\nNSDictionary *iconView = [NSDictionary dictionaryWithObjectsAndKeys:\n\
    \        @\"IconView\", @\"nib\", @\"IconViewController\", @\"class\", nil];\n\
    NSArray *viewArray =\n        [NSArray arrayWithObjects:tableview, iconView, nil];\n\
    [viewArray writeToFile:@\"/Views\" atomically:YES];\n```\n```\n\nWhichever way\
    \ you created the Views file, you now need to add it to your project. Control-click\
    \ Folder under Groups & Files, and choose Add > Existing Files.... Navigate to\
    \ your Views file, and click the Add button. When this list drops down, check\
    \ the “Copy items into destination group’s folder (if needed)” checkbox, and set\
    \ Reference Type to Relative to Project using the drop-down menu. This will enable\
    \ us to access the file by its name without providing a long path. Click the Add\
    \ button to finish.\n\nUp until now your code is unchanged. We’ve moved both the\
    \ magic number and the decision making into this new configuration file we’ve\
    \ created. Now let’s use it in MyWindowController.m. We can replace both the loadIconView\
    \ and loadTableView methods with this method:\n\nDownload ChangingViews/HelloApplication2nd/MyWindowController.m\n\
    \n```\n```objc\n- (void)loadView {\n    NSArray *viewArray = [NSArray arrayWithContentsOfFile:\n\
    \            [[NSBundle mainBundle] pathForResource:@\"Views\"\n             \
    \                               ofType:nil]];\n    NSDictionary *view = [viewArray\
    \ objectAtIndex:\n            [[NSUserDefaults standardUserDefaults]\n       \
    \             objectForKey:@\"TagForView\"] intValue];\n    self.ac =\n      \
    \      [[NSClassFromString([view objectForKey:@\"class\"]) alloc]\n          \
    \          initWithNibName:[view objectForKey:@\"nib\"] bundle:nil];\n    [self\
    \ setUpView];\n}\n```\n```\n\nWe start by creating our array of dictionaries from\
    \ the Views file. Then we use the value of the tagForView preference to select\
    \ which dictionary we want. Then we create a new view controller using the class\
    \ name and nib name stored in the dictionary."
