  md: "declared. I'm going to simplify our example in a couple of ways. First, I'm\
    \ going to replace the NSNumbers with NSIntegers to eliminate the converting back\
    \ and forth. That was useful to show you how and why we would use blocks to pass\
    \ an operation into a wrapper, but it now muddies things a bit. Second, instead\
    \ of multiplying two numbers together, I will triple a number that is defined\
    \ in a local variable in the same scope as where the block is defined.\n\n```\n\
    Download Blocks/SimpleCalc/SimpleCalcAppDelegate.m\n\n```objective-c\n#import\
    \ \"SimpleCalcAppDelegate.h\"\n\n@implementation SimpleCalcAppDelegate\n\n- (NSInteger)\
    \ tripleUsingBlock:(NSInteger (^)(NSInteger)) block\n{\n    return block(3);\n\
    }\n\n- (void)applicationDidFinishLaunching:(NSNotification *)aNotification {\n\
    \    NSInteger multiplicand = 5;\n    NSInteger product = [self tripleUsingBlock:^(NSInteger\
    \ multiplier){\n        return multiplier * multiplicand;\n    }];\n    NSLog(@\"\
    Triple %d is %d.\", multiplicand, product);\n}\n@end\n```\n```\n\nThere's a lot\
    \ going on in this short listing. Start with the declaration of the tripleUsingBlock:\
    \ method in line 5. We aren't passing in the value of the multiplicand. The only\
    \ parameter is the block itself.\n\nThe multiplicand is declared in applicationDidFinishLaunching:\
    \ just before we declare the block on line 11. Here's the actual block definition:\n\
    \n```\n`^(NSInteger multiplier){ return multiplier * multiplicand; }`\n```\n\n\
    The block takes a single argument, an NSInteger named multiplier. Now here's the\
    \ point of this example. The block returns the result of multiplying this multiplier\
    \ by a second variable named multiplicand. The value of the multiplicand is 5\
    \ at the point that the execution hits the ^, so that value travels with the block.\
    \ The result is that when the block is called in line 10, the value of multiplicand\
    \ is still frozen at 5, so that's the value that 3 is multiplied by.\n\nNow that\
    \ you understand what's going on, take another look back at the code. Initially,\
    \ blocks look a bit strange. As you look back at the code listing with greater\
    \ understanding, they will start to look more"
