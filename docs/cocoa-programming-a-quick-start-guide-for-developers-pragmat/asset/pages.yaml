- pgno: 106
  md: 'Click Build & Analyze, and the memory leak has disappeared.


    Whoa—you just learned a whole new way to manage memory. No need for reference
    counting and balancing your new, local, retain, or copy with a release. In this
    book, I’m assuming that you are deploying to Leopard or later, so the advice is
    that simple:


    Turn garbage collection on.


    People who have mastered reference counting feel that trusting the garbage collector
    is an affront to them as programmers. It’s not. If you are programming for Mac
    OS X, turn on the garbage collector, and leave reference counting behind.


    The first garbage-collected system I worked with was Java. Back in the really
    old days of Java, everything would come to a halt when the garbage was collected.
    In fact, there was an animation that would appear on the screen. It was a bulldozer
    collecting stuff.


    For a while people would study the byte code generated by the compiler and look
    for little optimizations. One of them involved turning for loops around so that
    instead of incrementing from 0 to some limit, it was more efficient to decrement
    from that limit to 0.


    But while we were learning these clever little hacks, the garbage collector was
    getting better at optimizing for situations that naturally arose. It turned out
    that our clever little hacks were now making it harder for the garbage collector
    to do its job.


    That’s kind of where we are now with Cocoa on the desktop.


    That said, you still need to understand reference counting. We’ll soon explore
    an iPhone example where you have no other choice but to manage your memory manually.
    First I want to show you what the garbage collector can and can’t help with when
    it comes to the memory attribute for properties.


    # 6.4 Properties and Garbage Collection


    Now that we have garbage collection turned on, let’s reconsider the property declarations
    in the Greeter header file:


    ```

    ```objective-c

    #import <Cocoa/Cocoa.h>


    @interface Greeter : NSObject {

    }

    ```

    ```'
