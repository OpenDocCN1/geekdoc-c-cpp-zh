    \ \"PragBook+Report.h\"\n\n@implementation PragBook(Report)\n-(void)PP_report\
    \ {\n    NSLog(@\"%@\",[self description]);\n}\n@end\n```\n```\n\nThe header file\
    \ needs to import PragBook, and that’s something we’re not able to do.\n\n```\n\
    ```objective-c\n// Download Categories/CDBookshell9/PragBook+Report.h\n#import\
    \ <Cocoa/Cocoa.h>\n#import \"PragBook.h\"\n\n@interface PragBook(Report)\n-(void)PP_report;\n\
    @end\n```\n```\n\nPragBook.h doesn’t exist. Currently the class associated with\
    \ the PragBook entity is NSManagedObject. We need to generate the PragBook class\
    \ source code.\n\nSelect your data model, and choose the menu item File > New\
    \ File.... If you have the data model selected, when you do this, then you’ll\
    \ see a new option listed under Mac OS X > Cocoa Class. Choose the Managed Object\
    \ Class, and click the Next button. The wizard will let you select the location,\
    \ project, and targets. Stick with the defaults, and click the Next button again.\n\
    \nThe next panel lets you choose which entities you are generating classes for.\
    \ Select the PragBook entity. You have three options at the bottom of the panel.\
    \ Select the Generate Obj-C 2.0 Properties box, and leave the “Generate accessors”\
    \ and “Generate validation methods” checkboxes unselected. Click the Finish button."
