- pgno: 215
  md: "The objectForKey: lets us read a particular entry from the dictionary. We pass\
    \ in the key NSApplicationName and get back the name of the launching or terminating\
    \ application as an NSString.\n\nUse the fact that the app is passed in as a parameter\
    \ to the applicationDidLaunch: and applicationDidTerminate: methods to create\
    \ formatted strings in ActivityController.m to enhance the output.\n\n```\nDownload\
    \ `Dictionaries/HelloApplication13/ActivityController.m`\n\n```objective-c\n#import\
    \ \"ActivityController.h\"\n#import \"CurrentApp.h\"\n\n@implementation ActivityController\n\
    \n@synthesize activityDisplay;\n\n-(void) applicationDidLaunch: (CurrentApp *)\
    \ app {\n    [self.activityDisplay setStringValue:\n        [NSString stringWithFormat:@\"\
    Launched: %@\", app.name]];\n}\n-(void) applicationDidTerminate: (CurrentApp *)\
    \ app {\n    [self.activityDisplay setStringValue:\n        [NSString stringWithFormat:@\"\
    Terminated: %@\", app.name]];\n}\n@end\n```\n```\n\n# 13.5 Reducing Redundancy\n\
    \nThe two applicationDidXxx: method implementations in CurrentApp are nearly identical.\
    \ In each case, I've inserted the check that the delegate does respond to our\
    \ selector to guard against passing a method name in that isn't implemented.\n\
    \n```\n```objective-c\nif ([self.delegate\n        respondsToSelector:@selector(applicationDidXxx:)])\
    \ {\n    self.name = [notification.userInfo objectForKey:@\"NSApplicationName\"\
    ];\n    [self.delegate applicationDidXxx:self];\n}\n```\n```\n\nWe just need a\
    \ way of making sure that Xxx is Launch in one case and Terminate in the other.\
    \ We could pass the notification on to a utility method and choose the method\
    \ to call based on the name of the notification like this:\n\n```\nDownload `Dictionaries/HelloApplication14/CurrentApp.m`\n\
    \n```objective-c\n-(void) respondToChange: (NSNotification *) notification {\n\
    \    SEL methodName;\n```\n```"
