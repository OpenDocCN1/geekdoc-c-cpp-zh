- pgno: 14
  md: '# Chapter 1


    # Introduction


    As I finished up the final walk-through of our new house, a woman called to me
    from across the street. “Tonight’s our annual progressive dinner,” she shouted.
    “Come meet the neighborhood.”


    I followed along and met our new neighbors all at once. It went fast and was a
    bit overwhelming, and there was a ton of information, some of which I was able
    to sort out later. Mostly, it made me feel a lot better about my new neighborhood.
    I knew the questions to ask, and I had met the people who could answer them for
    me.


    That’s the goal in this book. It’s not a guide for tourists that lists the things
    you’d want to see if you were only going to live with Cocoa for a day. It’s not
    a comprehensive almanac that lists every API class by class and method by method.
    This is designed to get you through those first weeks and months of moving to
    Cocoa.


    This is the coding equivalent of finding out where to go for coffee, which streets
    are safe to walk on at night, and which teacher to request for your kids. Once
    you get a feel for the neighborhood, you’ll have more questions, but you’ll know
    where and how to get them answered.


    # 1.1  Moving In


    Moving to Cocoa is like moving to a new neighborhood. You need to figure out where
    everything is and get used to the local customs. You’ll find that some aspects
    of developing Cocoa apps for Mac OS X are very similar to what you’ve been doing,
    while other aspects feel very strange.


    In this book you’ll get a feel for working with the following:


    +   - *Objective-C*: The language of Cocoa development'
  merge: -1
  img_proc: true
- pgno: 15
  md: '+   - *Xcode, Interface Builder, and Instruments*: The tools for Cocoa development

    +   - *Cocoa*: The frameworks full of existing classes created by Apple that will
    give your applications the features and polish of your favorite Mac OS X applications


    What, you ask, is a framework? A *framework* is a directory that contains some
    related set of resources. You can think of a framework as a library or a package,
    but it can also contain image files, documentation, localization strings, and
    other constructs that you’ll learn about later in this book. You’ll see in Chapter
    *2, Using What’s There*, on page *24* that we bring in all the resources for programming
    web applications by adding the WebKit framework to our project.


    Frameworks are kind of like what you know already and kind of different. For now
    you can think of them as libraries, and you’ll be fine. You’ll learn about many
    ideas in Mac OS X development that are close to what you already know. You’ll
    be tempted to hold on the way you used to do things. Don’t. You don’t want to
    be the only one driving on the wrong side of the road. It’s not good for you,
    and it’s not good for others sharing the same road.


    No one likes a new neighbor who goes on about how good it was where they came
    from. It’s the same here in OS X. It isn’t that the old-timers are being mean.
    It’s just that they have a way of doing things. You will have an incredible amount
    of power at your fingertips to quickly develop native Mac OS X applications if
    you embrace Objective-C, use the development tools, and take advantage of the
    Cocoa frameworks. You will tend to get much further much more quickly if you use
    what is proved for you and follow local customs rather than fight with the culture.


    Use Objective-C. Sure, you can write Cocoa applications in other languages. But
    for now, learn the native language. There is a lot of support for new developers
    on the various Apple lists¹ and in the support documentation, tutorials, and sample
    code accessible from Xcode. You will have an easier time of getting your question
    answered if you use the lingua franca of Cocoa development.


    1. For a comprehensive list, visit http://lists.apple.com/. You will probably
    want to subscribe to the http://lists.apple.com/mailman/listinfo/cocoa-dev list.
    Also look for lists that serve specific areas that you target in your application.
    If you have a specific need that is only temporary, you can also search the archives.'
  merge: -1
  img_proc: true
