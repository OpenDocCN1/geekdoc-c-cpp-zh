  md: "# 12.5  Responding to Selector\n\nHere’s how you’ll test whether you can call\
    \ the delegate method from your delegating object:\n\n```\n```objective-c\n-(void)\
    \ applicationDidLaunch: (NSNotification *) notification {\n    if ([self.delegate\n\
    \          respondsToSelector:@selector(applicationDidLaunch:)]) {\n        NSLog(@\"\
    Delegate implements applicationDidLaunch.\");\n    } else {\n        NSLog(@\"\
    We're on our own.\");\n    }\n}\n```\n```\n\nYou ask the delegate whether it implements\
    \ the method before you call it. You check by sending the respondsToSelector:\
    \ message to the delegate and passing in the name of the method on which you are\
    \ checking.\n\nClick Build & Run. You should see the message “Delegate implements\
    \ applicationDidLaunch:.” in the Console window.\n\nLet’s cause a problem or two.\
    \ Comment out this line in ActivityController.m:\n\n```\n```objective-c\nself.currentApp.delegate\
    \ = self;\n```\n```\n\nClick Build & Run. This time you should see “We’re on our\
    \ own.” in the Console.\n\nUncomment that last line, and comment out the applicationDidLaunch:\
    \ method in ActivityController.m. Click Build & Run. Ignore the warning. Again,\
    \ you’ll see “We’re on our own.” in the Console.\n\nUncomment the method, and\
    \ click Build & Run one more time to confirm that the delegate method can be called\
    \ successfully.\n\n# 12.6  Exercise: Calling the Delegate Methods\n\nWe’re ready\
    \ to finish our delegate. In CurrentApp’s applicationDidLaunch: method, check\
    \ to see that the delegate responds to a method named applicationDidLaunch:. If\
    \ it does, call the method, and pass in self as the CurrentApp object.\n\nDo the\
    \ analogous thing in CurrentApp’s applicationDidTerminate: method. When you click\
    \ Build & Run, you should see “Launched.” and “Terminated.” in the text field\
    \ when you start and quit applications."
