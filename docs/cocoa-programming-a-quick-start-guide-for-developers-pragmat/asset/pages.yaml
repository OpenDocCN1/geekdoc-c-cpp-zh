  md: '![](img/9355405953264484a02198b0e3d25b7e_130_0.png)


    # Joe Asks...


    # Where Do I Find the Outlet That I Just Added in Code?


    If you add an outlet to a class named NSFoo, then you will find that outlet in
    IB on any object of type NSFoo. This will become second-nature, but many people
    new to Interface Builder will complain that they added the outlet to the class
    but it’s not showing up in IB. There are usually two reasons something is going
    wrong:


    +   - Make sure you save the header file in Xcode. Files that need to be saved
    are slightly gray in the Groups & Files panel.

    +   - Make sure you are looking in the right object. In our example, we added
    the outlet in the source file HelloWorldAppDelegate.h, so in Interface Builder,
    select the HelloWorldAppDelegate object and look in the Connections inspector.


    If these steps are obvious to you, great. You understand the relationship between
    what you do in Xcode and what you do in Interface Builder.


    We''ll have to declare and implement a method in Xcode that will be called when
    the button is clicked. The first step is to declare a method using the proper
    syntax. For all Mac OS X Cocoa applications, your actions have to be declared
    like this:


    ```

    -(IBAction) actionSelector: (id) sender;

    ```


    This is the same format you saw for the web view''s goBack: method. The method
    must be an instance method that takes a single parameter of return type id. By
    convention we name the parameter sender.


    The return type is IBAction. This return type signals two things at once. First,
    this helps Interface Builder understand that this method is an action so that
    it can be displayed in the Connections inspector. Second, IBAction is typedefed
    to a void, so IBAction tells you that the method doesn''t return anything.3


    3. The IBAction return type is not enough to get the method to show up in Interface
    Builder. IB is smart enough to make sure that there is also a single parameter
    of type id.'
  merge: -1
  img_proc: true
