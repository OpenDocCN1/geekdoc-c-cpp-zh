- pgno: 157
  md: '# Chapter 9


    # Customizing with Delegates


    Stuff happens.


    In fact, lots of stuff is happening as your end user enters URLs and clicks buttons
    and links in your SimpleBrowser. The most basic type of event is target-action.
    The user clicks a button, and an action is sent to a target. You’ve learned two
    ways of working with these events: you can use Interface Builder to directly wire
    the object sending the message to the target object that will perform the action,
    or you can create a controller.


    But once you enter a URL or use the Back or Forward button, additional events
    and messages are flying by that you don’t even see. For example, when you load
    a page in Safari, you’ve probably noticed that the title of the new page is displayed
    above your toolbar before the page actually loads. Meanwhile, you can see the
    progress of the page being loaded by the blue bar that works its way across the
    text field containing your URL. There are messages being sent that Safari is able
    to capture and respond to. What about us?


    There are plenty of messages zipping by us all the time. In this chapter, you’ll
    learn to listen for them and how to respond to them. We’ll display the title of
    the web page we’re loading and fix the buttons and the URL while we’re at it.
    Delegates will let us customize behavior for a class without creating a subclass.


    # 9.1 Understanding Delegates


    Before we apply delegates to our browser example, we will use the NSWindow class
    to explore how delegates work.'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'Imagine that our NSWindow object is appearing on a Cocoa game show. If you
    look at the documentation for NSWindow, you will see more than 200 methods listed
    as tasks that our window object might be asked to perform.


    Our window object is pretty confident that it knows how to respond to most of
    the messages it might be sent. For example, it knows how to respond to the message
    setShowsToolbarButton:. If our window has a toolbar, then passing in YES displays
    the toolbar button, and passing in NO hides the toolbar button. If our window
    doesn’t have a toolbar, then calling this method doesn’t do anything.


    On the other hand, there are some tasks that our window doesn’t know how to react
    to. For example, what if our window is asked this on the talk show?


    ![](img/9355405953264484a02198b0e3d25b7e_158_0.png)


    The answer is not as simple as you may think. Usually, when someone clicks the
    red button, the window will close, and the application will continue to run. Even
    though this is the default behavior, it is not the only possibility. For example,
    if you open System Preferences and click the red button, the window closes, and
    this time the application quits too.


    You’ll see a third type of behavior if you open a web page in Safari and then
    create a new tab (with tabbed browsing enabled, select File > New Tab or ⌘T).
    Open a web page in the new tab, and then hit the red button.


    Even though you’ve clicked the same red button in the same application, the window
    doesn’t automatically close when you have multiple tabs open. Instead, it asks
    you, “Are you sure you want to close this window?”'
  merge: -1
  img_proc: true
- pgno: 159
  md: '![](img/9355405953264484a02198b0e3d25b7e_159_0.png)


    These variations present a dilemma for our window. What should it answer if it
    is asked by the game show host, “What would happen if I click your red button”?


    The window wants to answer “It depends,” but that’s not an acceptable answer in
    a game show or in a running Cocoa application. So, the window chooses to get help
    answering this question by phoning a friend.


    Here’s the way the rules work for this game. The window identifies all the messages
    that it might need help with ahead of time and labels those as delegate methods.¹
    In the case of the NSWindow class, here are all of the delegate methods:


    ```

    ```

    window:shouldDragDocumentWithEvent:from:withPasteboard:

    window:shouldPopUpDocumentPathMenu:

    window:willPositionSheet:usingRect:

    windowDidBecomeKey:

    windowDidBecomeMain:

    windowDidChangeScreen:

    windowDidChangeScreenProfile:

    windowDidDeminiaturize:

    ```

    ```


    1. In this chapter, we’re using protocols and delegates that Apple created. We’ll
    create our own delegate and protocol in Chapter 12, *Creating Protocols for Delegation*,
    on page 203.'
