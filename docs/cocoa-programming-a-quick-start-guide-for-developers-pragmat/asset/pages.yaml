    # 21.10  The Big Finish


    Click Build & Run. Click the + button, and add books to your list. Click the -
    button, and remove some.


    I know this isn’t magic, but it feels pretty close. With a minimal amount of code,
    we’ve created an application that allows us to add entries to a table and remove
    them.


    This should be enough to get you started with controllers. You can use the user
    defaults controller to bind GUI elements to your stored defaults. The dictionary
    and tree controllers are similar to the array controller, but they manage (obviously)
    dictionaries and trees. For more information, have a look at Apple’s *Cocoa Bindings
    Programming Topics* [App08a] and Apple’s *Cocoa Bindings Reference* [App08b].


    You can add code to customize your controllers in much the same way that we customized
    the view to do things that weren’t easy in Interface Builder. I’m not suggesting
    that you don’t code—I’m saying that you should take advantage of what you get
