  md: "addition, this direct call increases the running time of the application.\n\
    Leave the call as setNeedsDisplayInRect: and not drawRect:.\n\nNext let’s add\
    \ some multithreading goodness.\n\n# 26.5  The Main Queue\n\nRemember that several\
    \ global queues are available to you and that the one associated with the main\
    \ thread is a serial queue known as the *main queue*. Events and changes to your\
    \ GUI happen on the main thread, so as you start to use asynchronous threads to\
    \ get better performance in your app, you’ll push updates to the main thread so\
    \ that your users aren’t sitting there watching the spinning beach ball. This\
    \ is going to take us a couple of sections to get right.\n\nYou don’t create the\
    \ main queue or any of the global queues yourself. You will call a function that\
    \ returns a reference to the queue you are requesting. In the case of the main\
    \ queue, you use the function dispatch_get_main_queue() to get a reference to\
    \ it. Here’s how you get and store a handle to the main queue. Note the type is\
    \ dispatch_queue_t.\n\n```\ndispatch_queue_t main = dispatch_get_main_queue();\n\
    ```\n\nWe’ll be passing blocks to queues using either the dispatch_async() or\
    \ dispatch_sync() function. Mostly we’ll use dispatch_async() so that we don’t\
    \ have to wait for the task to complete. Both methods take two arguments. The\
    \ first is the queue, and the second is the block describing the task to be performed.\n\
    \n```\ndispatch_async(main, ^{\n    //code to be executed\n});\n```\n\nRevise\
    \ the cycle method to push our requests both to add the tile to the Grid’s array\
    \ and to display the results to the main thread.\n\n```\n```objective-c\n-(void)\
    \ cycle {\n    [self calculateColor];\n    dispatch_async(dispatch_get_main_queue(),\
    \ ^{\n        [self.grid.tiles addObject:self];\n        [self.grid setNeedsDisplayInRect:self.frame];\n\
    \    });\n    if (self.frame.size.width > 2) {\n        [self split];\n    }\n\
