- pgno: 202
  md: '# # Creating Protocols for Delegation


    Notifications are great when more than one object might need to be told about
    a change or when you might not know ahead of time which object(s) might be interested
    in being notified. For example, the application we wrote in the previous chapter
    is listening for notifications that the NSWorkspace sends out. That’s a great
    use of notifications in our application.


    On the other hand, the communication between our model and our controller is not
    a very good use of notifications.¹ The CurrentApp object’s applicationDidLaunch:
    and applicationDidTerminate: methods each do little more than call methods of
    essentially the same name in the ApplicationController object. This is being accomplished
    in a roundabout way right now. The CurrentApp methods are posting notifications
    that the ApplicationController has registered to observe. We’d be better off using
    a delegate instead of notifications.


    You’ve used protocols and delegates before. In this chapter, we will create our
    own protocol and add it to the controller’s header file. We’ll make the controller
    the delegate for our model. Then comes the tricky part. The model will turn around
    and call the delegate methods if they exist.


    1. If it’s not a good use of notifications, then why did I show it to you? I used
    notifications in this way so that I could show you how to generate your own notifications.
    My goal is to use this example to show you a range of useful techniques.'
  merge: -1
  img_proc: true
- pgno: 203
  md: "# 12.1  Exercise: Creating and Setting the Delegate\n\nCreate a new property\
    \ named delegate in the CurrentApp class. For now we use id as the type of delegate,\
    \ so any object can be assigned to it.\n\nRemove all the methods from ActivityController.m\
    \ except for awakeFromNib. We’ll put some of it back before we’re done, but this\
    \ will help you see some of the details in declaring and implementing a protocol.\
    \ Set CurrentApp’s delegate to self in awakeFromNib.\n\n# 12.2  Solution: Creating\
    \ and Setting the Delegate\n\nAdd the delegate instance variable and property\
    \ to CurrentApp.h:\n\n```\nDownload Protocols/HelloApplication7/CurrentApp.h\n\
    \n#import <Cocoa/Cocoa.h>\n\n@interface CurrentApp : NSObject {\n    id delegate;\n\
    }\n@property id delegate;\n\n@end\n```\n\nWe’ve labeled the delegate as an id\
    \ so that an object of any type could be set as the CurrentApp delegate. Remember\
    \ to synthesize the property in CurrentApp.m.\n\nFor now, we’re doing just three\
    \ things in the ActivityController’s awakeFromNib method: we’re creating an instance\
    \ of CurrentApp, we’re assigning this to our instance variable, and we’re setting\
    \ that object’s delegate to be ourselves.\n\n```\nDownload Protocols/HelloApplication7/ActivityController.m\n\
    \n#import \"ActivityController.h\"\n#import \"CurrentApp.h\"\n\n@implementation\
    \ ActivityController\n\n@synthesize currentApp, activityDisplay;\n\n-(void)awakeFromNib\
    \ {\n    self.currentApp = [[CurrentApp alloc] init];\n    self.currentApp.delegate\
    \ = self;\n}\n@end\n```"
