  md: "by converting them to NSIntegers the same way we did in both add:to: and multiply:by:.\
    \ Our new method will have a third parameter that will accept the operation that\
    \ will act on the two NSIntegers. This information is captured in a block.\n\n\
    # ## 24.2 Declaring a Block\n\nHere's the signature for the method we'll use to\
    \ replace add:to: and multiply:by:\n\n```\n~~~\nDownload Blocks/SimpleCalc4/SimpleCalcAppDelegate.m\n\
    -(NSNumber *) combine:(NSNumber *) x\n            with:(NSNumber *) y\n      \
    \ usingBlock:(NSInteger (^)(NSInteger,NSInteger)) block\n~~~\n```\n\nBefore we\
    \ look at the block declaration, take another look at how we declare the first\
    \ parameter of the combine:with:usingBlock: method:\n\n```\n~~~\n(NSNumber *)\
    \ x\n~~~\n```\n\nWe put the type for x in parentheses before the variable. This\
    \ type is a pointer to an NSNumber.\n\nThe third parameter declares a special\
    \ kind of object called a block. A block is essentially a function that captures\
    \ and copies data at the moment that execution passes over the point of declaration\
    \ of the block. A block may take one or more inputs, and it might have a return\
    \ value. The format for specifying a block as a method parameter looks generally\
    \ like this:\n\n```\n~~~\n(return_type (^) (parameterType1, parameterType2)) block_name\n\
    ~~~\n```\n\nThe ^ indicates a block. It is preceded by the type returned by the\
    \ block and followed by the types of the block's parameters.\n\nIn our specific\
    \ case, the block is declared like this:\n\n```\n~~~\n( NSInteger (^) (NSInteger,\
    \ NSInteger)) block\n~~~\n```\n\nIn words, our block will be referred to by the\
    \ name block. It is a function that takes two NSIntegers and returns an NSInteger.\
    \ This lets the compiler check to make sure the block being passed in has the\
    \ right signature.\n\nLater in the chapter we'll declare a block as a variable.\
    \ That form looks slightly different. Here is what our example block would look\
    \ like:\n\n```\n~~~\nNSInteger (^block) (NSInteger, NSInteger) = // block definition\n\
    ~~~\n```"
  merge: -1
  img_proc: true
- pgno: 385
  md: "We use that same form if our block is a parameter in a C function:\n\n```\n\
    ~~~objc\n(NInteger *) combineUsingBlock (NSNumber *x, NSNumber *y,\n         \
    \                       NSInteger (^block)(NSInteger,NSInteger)){\n  //function\
    \ body\n}\n~~~\n```\n\nWe're going to continue with the method parameter version.\
    \ Next, let's see how you would implement and call this particular block.\n\n\
    # ## 24.3 Using Blocks in Wrappers\n\nYou use the block inside the combine:with:usingBlock:\
    \ method as you would a function.\n\nDownload Blocks/SimpleCalc4/SimpleCalcAppDelegate.m\n\
    \n```\n~~~objc\n-(NSNumber *) combine:(NSNumber *) x\n                with:(NSNumber\
    \ *) y\n           usingBlock:(NSInteger (^)(NSInteger,NSInteger)) block\n{\n\
    \    NSInteger xAsInt = [x integerValue];\n    NSInteger yAsInt = [y integerValue];\n\
    \    NSInteger result = block(xAsInt, yAsInt);\n    return [NSNumber numberWithInteger:result];\n\
    }\n~~~\n```\n\nWe're all set up to accept and use a block in the combine:with:usingBlock:\
    \ method. Here's the block we're going to pass to this method to add two numbers.\
    \ In this case, the return type of the block can be inferred and doesn't need\
    \ to be specified.\n\n```\n~~~objc\n^(NSInteger x, NSInteger y) {\n    return\
    \ x+y;\n}\n~~~\n```\n\nThis type of expression is called a *block literal*. The\
    \ body can contain multiple statements and declared variables. Ours happens to\
    \ be very simple. It is a block that takes two NSIntegers as arguments. We need\
    \ to name these arguments so that we can use them inside the body of the block.\
    \ We'll name them *x* and *y*, and the block will do nothing more than return\
    \ their sum.\n\nSo when you call block(xAsInt,yAsInt); in combine:with:usingBlock:,\
    \ it's as if you are calling this function:\n\n```\n~~~objc\n(NSInteger) block(NSInteger\
    \ x, NSInteger y) {\n    return x+y;\n}\n~~~\n```"
