- pgno: 359
  md: 'Our entity relationship diagram now looks like this:


    ![](img/9355405953264484a02198b0e3d25b7e_359_0.png)


    We have a simple data model with three entities, a handful of attributes, and
    a relationship between each pair of entities. We have one more step before our
    model is ready for prime time.


    # 22.6 Choosing a Relationship’s Delete Rule


    Before we wrap up this data model, we need to consider what happens when the user
    deletes data. For instance, when the user deletes a book, then the book’s chapters
    should disappear as well. But when the user deletes a chapter, the book shouldn’t
    disappear. When the user deletes a book, what should happen to the authors?


    We have several options when the user deletes an entity: Deny, Nullify, Cascade,
    and No Action. These delete rules are part of defining a relationship. Let’s look
    at some examples in our current model.


    To start with, how should we set the delete rule for the chapters relationship?
    We want to make sure that if there are any chapters left in a book, then the user
    can’t delete the book that currently contains the chapters.


    In other words, we choose the Deny option so that when a user tries to delete
    the book, their request will be denied if there are still chapters that would
    be orphaned without the book they belong to. The Deny option won’t let you delete
    the entity if there is at least one item at the relationship’s destination.


    Authors are different. One author may have written more than one book, so we don’t
    want to delete the authors when we delete a book. In this case, we choose Nullify
    as the option. With Nullify, we are not prevented from deleting the book if one
    or more authors still exist. We will set the book relationship in each of the
    authors to be null. We nullify that relationship because that book no longer exists,
    so the author couldn’t have written it.'
  merge: -1
  img_proc: true
- pgno: 360
  md: 'We have another option for the chapters relationship. When we delete the book,
    we could delete all of the chapters for that book as well. In other words, we
    want the delete to cascade down. We are still enforcing the idea that it doesn’t
    make sense for the chapters to survive if the book doesn’t—we’ve just chosen a
    different result.


    So, set the Delete rule for chapters to Cascade. The inverse relationship book
    should have the Delete rule Nullify. When we delete a chapter, we don’t delete
    the book it belongs to, but we make sure the book no longer has a reference to
    this deleted chapter. Similarly, the rule for authors and books should be Nullify.⁶


    # 22.7 Updating the View


    By this point, you should be comfortable using Interface Builder without a lot
    of direction. Open your nib file, select your table view, and reduce the number
    of columns to one. Select all of the components inside your content view, and
    choose Layout > Embed Objects In > Box. Change the box’s title to Prag Books.
    Select that box, paste it twice, and customize the contents to look like this:


    ![](img/9355405953264484a02198b0e3d25b7e_360_0.png)


    The contents of the chapter and authors boxes need to depend on which book is
    selected. That’s a job for the controller layer.


    6. You can compare your work with the data model in CDBookshelf2 in the code download.'
