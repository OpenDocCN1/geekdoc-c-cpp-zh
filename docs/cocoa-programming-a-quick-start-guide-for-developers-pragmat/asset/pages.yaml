- pgno: 193
  md: "# ### 11.3 Registering for Notifications\n\nHere's how an object registers\
    \ to receive notifications:\n\n```\n```objc\n[[NSNotificationCenter defaultCenter]\n\
    \    addObserver:observerObject\n    selector:@selector(methodName:)\n    name:NameOfNotification\n\
    \    object:notifyingObject];\n```\n```\n\nZero, one, or many objects can register\
    \ with a notification server for the same notification, and an object can register\
    \ for as many different types of notifications it wants to receive. Let's take\
    \ a closer look at each of the arguments used in registration:\n\n+   - You are\
    \ sending the addObserver:selector:name:object: message to the default notification\
    \ center.\n+   - In our case, we will set the observerObject to self, but it can\
    \ be any object interested in receiving the notification. This will be the target\
    \ for the action you are setting to be triggered by the notification.\n+   - The\
    \ selector specifies the action. This is the name of the method belonging to the\
    \ observer that will be called when the notification is received.\n+     - The\
    \ name of this method ends with a colon because this method will take a single\
    \ parameter.\n+     - This single parameter is the notification object that is\
    \ passed in when the notification is sent.\n+   - The name is the name of the\
    \ notification being registered for.\n+   - The object refers to the object whose\
    \ notifications you are interested in. In our SimpleBrowser example, you may have\
    \ more than one web view that is posting notifications, and you might only want\
    \ to monitor a particular one. You can also pass in nil to receive this type of\
    \ notification posted by any object in your application.\n\nIn the stock example,\
    \ the observerObject is you or your agent. The selector is the action to be performed\
    \ like buy: or sell:. The name is the notification you are registering for like\
    \ “price drops to $yyy.” The object could be the name of the stock to which you\
    \ are listening.\n\nThe big idea is that you register to listen for a notification\
    \ by passing in the name of a method that will be called on a particular object.\
    \ When the method is called, it receives an NSNotification object as its only\
    \ parameter."
