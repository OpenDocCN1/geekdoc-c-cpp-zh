  md: "As an aside, when you are designing applications for the iPhone or the iPod\
    \ touch, you can use two additional variations. You can create an action that\
    \ has no arguments. The following signature will work fine in Cocoa Touch:4\n\n\
    ```\n```objective-c\n- (IBAction) actionSelector\n```\n```\n\nThis version is\
    \ always my first choice when working with Cocoa Touch. If I had this no argument\
    \ signature available to me in Cocoa, it would be my first choice here as well.\
    \ In the case that I need to pass along the sender, I love having the option to\
    \ do so. But there are many times where I don't need to communicate with the sender\
    \ and don't need to know anything about the sender. I'd like that to be more clearly\
    \ expressed in my code by using the no-argument version.\n\nOn the other hand,\
    \ sometimes I need to know more than can be communicated by just passing along\
    \ the sender. Sometimes I'd like to know something about the event that triggered\
    \ the message. If you are writing a Cocoa Touch application, you can use this\
    \ signature for an IBAction:\n\n```\n```objective-c\n- (IBAction)respondToButtonClick:(id)sender\
    \ forEvent:(UIEvent*)event;\n```\n```\n\nCurrently, for desktop applications,\
    \ we need to use the single argument form for declaring an IBAction. For Cocoa\
    \ Touch applications, we are free to use the no-argument and two-argument versions\
    \ as well.\n\nBack to our current example, add this highlighted declaration to\
    \ the header file, and save your work:\n\n![](img/9355405953264484a02198b0e3d25b7e_131_0.png)\n\
    \n```\n```objective-c\n#import <Cocoa/Cocoa.h>\n\n@interface HelloWorldProAppDelegate\
    \ : NSObject <NSApplicationDelegate> {\n    NSWindow *window;\n    NSTextField\
    \ *textField;\n}\n@property (assign) IBOutlet NSWindow *window;\n@property (assign)\
    \ IBOutlet NSTextField *textField;\n\n- (IBAction) changeGreeting:(id)sender;\n\
    @end\n```\n```\n\n4. Cocoa Touch is how we describe the Cocoa APIs that target\
    \ the iPhone OS."
