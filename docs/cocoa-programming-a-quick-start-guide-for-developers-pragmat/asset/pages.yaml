  md: '# Chapter 8


    # # Creating a Controller


    You can’t accomplish everything you want your application to do just by dragging
    connections between the visual elements in Interface Builder. On the one hand,
    it’s pretty amazing how easily we created a simple web browser in Chapter 2, Using
    What’s There, on page 24 just using visual tools. On the other hand, the browser
    leaves a lot to be desired. There are some things we’re just going to need to
    code ourselves.


    In this chapter, we’ll create a controller for our SimpleBrowser example. To keep
    things simple, we won’t have a model—we’ll just have a view and a controller.
    The main point of this example is creating a new class and instantiating it to
    communicate with objects you created in Interface Builder.


    # ## 8.1 How We’ve Created Objects


    We have created and connected objects in two different ways. In the SimpleBrowser
    example, all of our objects are created in the nib. We dragged in buttons, a text
    field, and a web view, and they joined the SimpleBrowserAppDelegate and all of
    the other objects that are created in the nib.'
