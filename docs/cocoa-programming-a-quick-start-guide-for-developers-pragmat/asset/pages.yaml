- pgno: 324
  md: "```\n```objc\n#import \"Logger.h\"\n\n@implementation Logger\n-(void)logValue:\
    \ (NSNumber *) value{\n    NSLog(@\"%@\", value);\n}\n-(void) awakeFromNib {\n\
    \    [counter addObserver:self\n              forKeyPath:@\"count\"\n        \
    \         options:NSKeyValueObservingOptionNew\n                 context:NULL];\n\
    }\n-(void)observeValueForKeyPath:(NSString *)keyPath\n                     ofObject:(id)object\n\
    \                       change:(NSDictionary *)change\n                      context:(void\
    \ *)context {\n    [self logValue:[object valueForKeyPath:keyPath]];\n}\n-(void)\
    \ finalize {\n    [counter removeObserver:self forKeyPath:@\"count\"];\n    [super\
    \ finalize];\n}\n@end\n```\n```\n\nSo, it’s easy to add as many observers as you’d\
    \ like. They don’t affect the object they’re observing, and they don’t need to\
    \ know about other observers.\n\nOn the other hand, things get complicated when\
    \ you have one object observe more than one attribute in one or more objects.\n\
    \n# 20.9 The Ugly Way to Observe More Than One Attribute\n\nLet’s double our fun\
    \ with two steppers and two displays. Each display is tied to just one of the\
    \ steppers. We’re going to use UpOrDown to interact with both steppers. Display\
    \ will register as an observer for the current counts for both steppers.\n\nThis\
    \ means the same object will be an observer for two different attributes. We’ll\
    \ handle this in two ways—but first we need to do a little prep work."
