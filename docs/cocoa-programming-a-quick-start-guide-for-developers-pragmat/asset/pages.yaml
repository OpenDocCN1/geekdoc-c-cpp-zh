    # ### 8.3 Creating an Instance of Our Controller in IB


    We’re now going to create an instance of the BrowserController class in Interface
    Builder.^2


    When we created instances of our buttons, we just looked in the Library for an
    NSButton that looked like the one we wanted and dragged it into our window. We
    can’t do that with our BrowserController because there’s no way that Interface
    Builder’s Library would contain our BrowserController class—we just made it up.
    Fortunately, Snow Leopard and Xcode 3.2 have made this a lot easier for us.^3


    Double-click MainMenu.xib to open the nib file in IB. You aren’t interested in
    the Window view anymore because there is no visual representation of the controller
    for the end user to see. Instead, bring up the Document window in Interface Builder
    with the key sequence ⌘0 or Window > Document.


    Interface Builder provides us with a representation of our BrowserController object.
    In IB, go to the Library, and this time choose the Classes tab and look for BrowserController.


    2. Actually, the instance isn’t really created until the nib is unarchived when
    the application starts up. We can think of the instance being created at this
    point in the same way we talked about creating an object in code when we learned
    to use a call like this `[[BrowserController alloc] init]`.


    3. If you are running an earlier version of Xcode, you will need to adjust the
    directions that follow so that you drag an NSObject into the Document window and
    change its type using the Identity Inspector.'
