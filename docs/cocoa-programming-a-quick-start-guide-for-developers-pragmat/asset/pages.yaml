- pgno: 311
  md: "There's more to this than first might appear. We have an array named chapters\
    \ whose entries are all objects of type Chapter. Each chapter has two properties:\
    \ chapterTitle and pageCount. Imagine the steps you would have to go through to\
    \ create this array in the past. You would have to create the new array and copy\
    \ the elements over from the old array. It's not a huge deal, but KVC makes it\
    \ cleaner and easier.\n\nBut that's not all.\n\nYou can operate on these new collections\
    \ and perform all sorts of calculations. The pageCount property, for example,\
    \ is a number, so you can calculate the sum or the average of all the page counts\
    \ in chapters. Here's how you would calculate the sum:\n\n```\n```\n[self.book\
    \ valueForKeyPath:@\"chapters.@sum.pageCount\"]\n```\n```\n\nIsn't that cool?\
    \ You just insert @sum before pageCount in the keypath. In general, you insert\
    \ the operator between the keypath to the array and the keypath to the property.\n\
    \nThere are two types of operators. The first type operates on a collection of\
    \ numbers and returns the average, maximum, minimum, or sum (respectively, @avg,\
    \ @max, @min, and @sum). The second type operates on collections and returns their\
    \ @count, @distinctUnionOfArrays, @distinctUnionOfObjects, @distinctUnionOfSets,\
    \ @unionOfArrays, @unionOfObjects, and @unionOfSets.\n\nWe can take some of these\
    \ for a ride in our application. Declare an instance method named createReport\
    \ in the BookshelfController's header file, and implement it like this:\n\n```\n\
    ```\nDownload KVC/Bookshelf/BookshelfController.m\n```\n```\n\n```\n```\n- (void)createReport\
    \ {\n    NSLog(@\"There are %@ chapters.\",\n        [self valueForKeyPath:@\"\
    book.chapters.@count.chapterTitle\"]);\n    NSLog(@\"The titles are: %@\",\n \
    \       [self.book.chapters valueForKey:@\"chapterTitle\"]);\n    NSLog(@\"This\
    \ book has %@ pages so far.\",\n        [self.book.chapters valueForKeyPath:@\"\
    chapters.@sum.pageCount\"]);\n    NSLog(@\"The longest chapter is %@ pages long.\"\
    ,\n        [self valueForKeyPath:@\"book.chapters.@max.pageCount\"]);\n    NSLog(@\"\
    The average chapter length is %@.\",\n        [self.book.chapters valueForKeyPath:@\"\
    @avg.pageCount\"]);\n}\n```\n```\n\nYou might notice that again I've used different\
    \ anchors for the keypaths to show you where to insert the operator. Call this\
    \ method from the end of the applicationDidFinishLaunching: method in your app\
    \ delegate."
  merge: -1
