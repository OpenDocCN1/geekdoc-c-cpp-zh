    \ is\n\n```\nTERMINATING DUE TO UNCAUGHT_EXCEPTION\n```\n\nThe stack trace isn’t\
    \ very helpful, but if you look at the Console, you will see the problem pretty\
    \ quickly. Open the Console using ⇧⌘R or Run > Console. You’ll see a gdb prompt.\
    \ Scroll back past a listing of the stack. Just above this you will see a series\
    \ of lines that each begin with a time stamp, the word SimpleBrowser, and brackets\
    \ around an identifier that includes the process number. Once you parse away all\
    \ of this information, you should be left with something like this:\n\n```\nAn\
    \ uncaught exception was raised\n-[NSKeyedUnarchiver decodeObjectForKey:]\n  \
    \      cannot decode object of class (WebView)\nTerminating app due to uncaught\
