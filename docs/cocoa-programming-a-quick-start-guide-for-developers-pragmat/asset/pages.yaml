    Forward and Back buttons are disabled. Try to enter a URL. Click the text field.
    This looks promising. The text field clears, and the keypad appears. You can type
    in a new URL.


    Now what?


    You hit ↵, and nothing happens. If you click in another area of the screen, the
    keyboard is dismissed, but the next time you select the text field, the URL will
    be cleared, and you need to start all over again. How can you enter a URL and
    navigate to the site? It turns out, we''re going to need two more delegates.


