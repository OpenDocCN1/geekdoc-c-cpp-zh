- pgno: 160
  md: "```\n    windowDidEndSheet:\n    windowDidExpose:\n    windowDidMiniaturize:\n\
    \    windowDidMove:\n    windowDidResignKey:\n    windowDidResignMain:\n    windowDidResize:\n\
    \    windowDidUpdate:\n    windowShouldClose:\n    windowShouldZoom:toFrame:\n\
    \    windowWillBeginSheet:\n    windowWillClose:\n    windowWillMiniaturize:\n\
    \    windowWillMove:\n    windowWillResize:toSize:\n    windowWillReturnFieldEditor:toObject:\n\
    \    windowWillReturnUndoManager:\n    windowWillUseStandardFrame:defaultFrame:\n\
    ```\n\nThe delegate methods come in three flavors: something will happen, something\
    \ did happen, and something should happen. You implement the will version to change\
    \ the behavior before an action happens and the did version to respond after the\
    \ action happens. The should version returns a BOOL that allows you to cancel\
    \ an action if you determine it shouldn’t happen.\n\nJust like the game shows\
    \ where a contestant can “call a friend,” each window object gets to designate\
    \ a single friend that can be called when any of these methods is called. That\
    \ friend is the delegate.\n\nWe don’t really expect one friend to be able to respond\
    \ to all of these messages, but our window must choose only one delegate ahead\
    \ of time. Unfortunately, the window can’t say, “I know who would know how to\
    \ answer that question” and decide who will be called at runtime. The delegate\
    \ is chosen before the question is asked.\n\nBefore the game begins, we preinterview\
    \ the delegate. This way, we know which messages the delegate can handle and which\
    \ ones it can’t. In Cocoa terms, the delegate may implement none, any, or all\
    \ of the delegate methods for an object. If a delegate has not implemented a method,\
    \ it will not be called to handle that message. The window will have to come up\
    \ with its own answer.\n\nThese rules might seem complicated—but a quick example\
    \ should clarify the situation."
  merge: -1
  img_proc: true
- pgno: 161
  md: '# ## 9.2 The Default Window Behavior


    Create a new project in Xcode that is a Mac OS X > Application > Cocoa Application
    called WindowDressing. We’re going to use a delegate to change the default behavior
    of the green and red buttons.


    Click Build & Run. When you click the green button, the window should zoom up
    to fill most of the screen. Click it again, and the window will zoom to its original
    size. Click the red button and the window closes, but the application doesn’t
    quit. Once you click the red button, there’s not much more you can do. We can’t
    create a new window so we have to quit this application anyway.


    So far, we’ve seen the default behavior when the green or red button is clicked.
    This is the behavior the window provides when it isn’t allowed to phone a friend.
    In the next section, we’ll provide alternate behavior using a delegate.


    # ## 9.3 Turning the Background Red


    Let’s change the behavior so that when the user clicks the red button, the background
    of the window turns red. We’ll follow these steps:


    +   1. We’ll need to create a new class that we can instantiate to create the
    window’s delegate.

    +   2. We’ll designate that object as the window’s delegate.

    +   3. We’ll identify the delegate method we need to implement.

    +   4. Finally, we’ll implement the method.


    The second and third steps are where people often make small, hard-to-trace mistakes.
    It’s easy to forget to connect the window to its delegate in Interface Builder.
    Also, make sure that you save your nib file after you make a change. When you
    build your project in Xcode, you will be asked whether you want to save any source
    files that have been changed, but you may have unsaved changes in Interface Builder
    as well.


    I guarantee this is going to bite you at some point. If you have been bouncing
    back and forth between Xcode and Interface Builder and your project isn’t behaving
    the way you expect, take a look at your nib’s Document window. If you see a dark
    dot in the middle of the red close button, then your file is dirty and needs to
    be saved.


    ![](img/9355405953264484a02198b0e3d25b7e_161_0.png)'
