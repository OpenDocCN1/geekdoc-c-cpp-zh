  md: "So, I’ll introduce a utility method named `setUpNotification:withSelector:`\n\
    and refactor like this:\n\n```\nDownload Notification/HelloApplication5/CurrentApp.m\n\
    \n#import \"CurrentApp.h\"\n\n@implementation CurrentApp\n\n-(void) applicationDidLaunch:\
    \ (NSNotification *) notification {\n    NSLog(@\"Launched.\");\n}\n-(void) applicationDidTerminate:\
    \ (NSNotification *) notification {\n    NSLog(@\"Terminated.\");\n}\n-(void)setUpNotification:(NSString\
    \ *)notification withSelector:(SEL)methodName {\n    [[[NSWorkspace sharedWorkspace]\
    \ notificationCenter]\n                    addObserver:self\n                \
    \       selector:methodName\n                           name:notification\n  \
    \                       object:nil];\n}\n-(void) registerNotifications {\n   \
    \ [self setUpNotification:NSWorkspaceDidLaunchApplicationNotification\n      \
    \         withSelector:@selector(applicationDidLaunch:)];\n    [self setUpNotification:NSWorkspaceDidTerminateApplicationNotification\n\
    \               withSelector:@selector(applicationDidTerminate:)];\n}\n-(id) init\
    \ {\n    if (self = [super init]) {\n        [self registerNotifications];\n \
    \   }\n    return self;\n}\n@end\n```\n\nNow when I click Build & Run, launch,\
    \ and quit iCal, I see this in the Console:\n\n```\nLaunched.\nLaunched.\nTerminated.\n\
    ```\n\n# 11.8 Posting Notifications\n\nSuppose we now want to add a text field\
    \ to the window and display\n“Launched.” or “Terminated.” in that text field.\
    \ How might you do that?"
