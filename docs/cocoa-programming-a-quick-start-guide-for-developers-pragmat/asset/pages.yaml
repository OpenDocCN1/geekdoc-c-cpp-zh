  md: '# # Chapter 24


    # # Blocks


    Usually when we have work to do, we call a method that knows how to do the work
    and send it the data it needs. In this chapter, we''ll look at three cases where
    we also send the method some of the work that needs to be done. This work is passed
    in as a special Objective-C object known as a *block*. A block is a chunk of executable
    code that can be passed around along with data that is copied from the scope containing
    the block.


    We''re going to look at three uses of blocks. First we''ll look at wrappers—code
    that performs some specific setup, invokes the code in a block, and then possibly
    does some tidying up after the block finishes. Next we''ll look at how well blocks
    work with collections of objects—they allow you to specify code that applies to
    each element of the collection independent of the way you access the collection.
    And finally we''ll look at callbacks—the ability to have a chunk of code run when
    some event occurs.^1


    If you have used blocks, closures, lambdas, or even function pointers in other
    languages, much of what you know applies here as well. The syntax and specifics
    may be different, but the big ideas and general strategies are the same.


    1. In addition, we''ll look at applications of blocks to concurrency in Chapter
    26, *Dispatch Queues*, on page 412.'
  merge: -1
  img_proc: true
- pgno: 383
  md: "# Official Support for Blocks\n\nBlocks are currently available only in Mac\
    \ OS X Snow Leopard and newer. You won’t use blocks if you are targeting the iPhone\
    \ or earlier releases of Mac OS X.\n\n# 24.1  The Need for Blocks in Wrappers\n\
    \nSuppose we want to add two integers that I’ve stored as NSNumbers. Create a\
    \ new Cocoa application named SimpleCalc, and create this add:to: method in SimpleCalcAppDelegate.m.²\n\
    \n```\n```objective-c\n// Download Blocks/SimpleCalc/SimpleCalcAppDelegate.m\n\
    -(NSNumber *) add:(NSNumber *)x to:(NSNumber *)y {\n    NSInteger xAsInt = [x\
    \ integerValue];\n    NSInteger yAsInt = [y integerValue];\n    NSInteger result\
    \ = xAsInt + yAsInt;\n    return [NSNumber numberWithInteger:result];\n}\n```\n\
    ```\n\nThe two NSNumbers are converted to NSIntegers and added together, and then\
    \ the sum is converted back to an NSNumber and returned.\n\nVery little of this\
    \ code has anything to do with the actual calculation. To see this, we can create\
    \ a new method named multiply:by: that multiplies two NSNumbers. There’s a lot\
    \ of repeated code between this method and add:to:. We still have to convert the\
    \ NSNumbers to NSIntegers, and we still have to return the result. The only thing\
    \ that changes is the method name and the operation on the two NSIntegers.\n\n\
    ```\n```objective-c\n// Download Blocks/SimpleCalc/SimpleCalcAppDelegate.m\n-(NSNumber\
    \ *) multiply:(NSNumber *)x by:(NSNumber *)y {\n    NSInteger xAsInt = [x integerValue];\n\
    \    NSInteger yAsInt = [y integerValue];\n    NSInteger result = xAsInt * yAsInt;\n\
    \    return [NSNumber numberWithInteger:result];\n}\n```\n```\n\nWhat I really\
    \ want is a method that allows me to pass in the two NSNumbers and the operation\
    \ to be performed on them. This new method will take the two NSNumbers as its\
    \ first two parameters and will begin\n\n² I’ve removed the window property from\
    \ the app delegate. Make sure you edit the project settings so that garbage collection\
    \ is required."
