- pgno: 112
  md: "You've seen briefly that when you create an object of type Greeter with code\
    \ that looks like this, the reference count is set to one when alloc is called:\n\
    \n```\n```objective-c\nGreeter *host = [[Greeter alloc] initWithName:@\"Maggie\"\
    ];\n```\n```\n\nThat is exactly the error being reported by Build & Analyze. It\
    \ knows that you increased the reference count to one and never used the variable\
    \ again. It wants you to acknowledge that you have no further interest in the\
    \ variable. You do that by calling this:\n\n```\n```objective-c\n[host release];\n\
    ```\n```\n\nThis decrements the reference count by one. In our case, that's enough.\
    \ The reference count for host will be zero, and its dealloc method will be called\
    \ to clean up the object resources and release the memory. Send the release message\
    \ to the host object when you know that you won't need it anymore. In our case,\
    \ you would do it here:\n\n```\n```objective-c\nDownload Memory/Flashlight2/Classes/FlashlightAppDelegate.m\n\
    \n- (void)applicationDidFinishLaunching:(UIApplication *)application {\n    Greeter\
    \ *host = [[Greeter alloc] initWithName:@\"Maggie\"];\n    NSLog(@\"Greeter %@\"\
    , host);\n    [host release];\n}\n```\n```\n\nClick Build & Analyze, and this\
    \ particular memory leak is now gone. Next let's take a minute to look at what\
    \ happens when you make the other key memory mistake. What happens when you try\
    \ to send a message to an object that has been freed?\n\n# 6.8 Using Zombies\n\
    \nSo far, we've created an object of type Greeter, we've printed its contents\
    \ to the Console, and we've freed that object. Now let's deliberately send this\
    \ freed object another message. We'll just print its contents to the Console again\
    \ like this:\n\n```\n```objective-c\nDownload Memory/Flashlight3/Classes/FlashlightAppDelegate.m\n\
    \n- (void)applicationDidFinishLaunching:(UIApplication *)application {\n    Greeter\
    \ *host = [[Greeter alloc] initWithName:@\"Maggie\"];\n    NSLog(@\"Greeter %@\"\
    , host);\n    [host release];\n    NSLog(@\"Greeter %@\", host);\n}\n```\n```"
