- pgno: 167
  md: "The `webView:didReceiveTitle:forFrame:` method is called when the title is\
    \ available. You can see that the message we receive also includes the title as\
    \ a parameter. Here’s how we’ll use it:\n\n+   - We don’t add anything to the\
    \ header file. All fifteen of the methods listed in the `WebFrameLoadDelegate`\
    \ protocol are now available to us in `BrowserController`. The docs tell us that\
    \ the `WebFrameLoadDelegate` is an informal protocol, so we don’t declare it in\
    \ the `BrowserController` header file.\n\n+   - We need to implement `webView:didReceiveTitle:forFrame:`\
    \ in `BrowserController.m` by filling in the body of this method:\n\n```\n~~~\n\
    - (void)webView:(WebView *)sender didReceiveTitle:(NSString *)title\n    forFrame:(WebFrame\
    \ *)frame {\n}\n~~~\n```\n\n+   - We wait. The `webView:didReceiveTitle:forFrame:`\
    \ method gets called once the title for the URL being loaded is available.\n\n\
    When this method is invoked, you want to set the title attribute of the application\
    \ window to the title that is returned to you. Looking at the method signature,\
    \ you can see that when the method is called, you will be passed a handle to the\
    \ web view you are using and to the title of the new page. You can use the web\
    \ view to get a pointer to the window containing the web view like this:\n\n```\n\
    ~~~\n[sender window];\n~~~\n```\n\nUnfortunately, you won’t find the method you\
    \ need in the `WebView` documentation. You have to look at the superclass `NSView`,\
    \ where you will find the `window` method. The `window` method is also highlighted\
    \ in the `NSView` as a commonly used method that “Returns the `NSWindow` object\
    \ that contains the `NSView` object.”\n\nOnce you have this window, you ask it\
    \ to set its title to the title that you get when this delegate method is called.\
    \ You need to add this method to `BrowserController.m`:\n\n```\n~~~\n- (void)webView:(WebView\
    \ *)sender\ndidReceiveTitle:(NSString *)title\n    forFrame:(WebFrame *)frame\
    \ {\n  [[sender window] setTitle:title];\n}\n~~~\n```"
