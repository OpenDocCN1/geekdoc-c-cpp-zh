  md: "chapterTitle and pageCount. Let's use KVC to set the values of the chapter's\
    \ title and page count in the book method in BookshelfController.m. I've used\
    \ setValue:forKeyPath: twice in the highlighted lines.\n\n```\n~~~objectivec\n\
    Download KVC/Bookshelf6/BookshelfController.m\n\n-(PragBook *) book {\n    if\
    \ (!book) {\n        self.book = [[PragBook alloc] init];\n        NSDictionary\
    \ *bookInfo =\n            [NSDictionary dictionaryWithObjectsAndKeys:\n     \
    \           @\"Manage Your Project Portfolio\", @\"title\",\n                @\"\
    Johanna Rothman\", @\"author\", nil];\n        [self.book setValuesForKeysWithDictionary:\
    \ bookInfo];\n        [self.book setValue:@\"Preface\"\n                 forKeyPath:@\"\
    chapter.chapterTitle\"];\n        [self setValue:[NSNumber numberWithInt:4]\n\
    \                 forKeyPath:@\"book.chapter.pageCount\"];\n    }\n    return\
    \ book;\n}\n~~~\n```\n\nI've used two different paths just for illustration. When\
    \ I start at book, I use the keypath chapter.chapterTitle. When I start at self\
    \ (in other words at the BookshelfController level), the keypath is book.chapter.pageCount.\n\
    \nNotice that we use the method setValue:forKeyPath: where we used to use the\
    \ method setValue:forKey:. You can actually view the keys as a very short keypath\
    \ and use setValue:forKeyPath: in our setValue: action.\n\n```\n~~~objectivec\n\
    Download KVC/Bookshelf6/BookshelfController.m\n\n-(IBAction) setValue:(id) sender\
    \ {\n    [self.book setValue:[sender stringValue]\n             forKeyPath:[self.keyField\
    \ stringValue]];\n}\n~~~\n```\n\nSimilarly, the getter valueForKeyPath: is used\
    \ where we used to use valueForKey:. This will let us enter keys or keypaths where\
    \ before we could only enter keys.\n\n```\n~~~objectivec\nDownload KVC/Bookshelf6/BookshelfController.m\n\
    \n-(IBAction) getValue:(id) sender {\n    [self.valueField setStringValue:\n \
    \       [self.book valueForKeyPath:[sender stringValue]]];\n}\n~~~\n```\n\nSo\
    \ now, in addition to entering the author and title keys in the top text field,\
    \ we can safely use the keypaths \"chapter.chapterTitle\" and \"chapter.pageCount\"\
    \ to get and set those values as well."
