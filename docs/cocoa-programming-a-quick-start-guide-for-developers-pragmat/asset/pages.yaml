    \ this:\n\n```\n```objc\ndispatch_release(myQ)\n```\n```\n\nSimilarly, if you\
    \ had to pass one of these queues around, any object that needed to own the queue\
    \ would have to explicitly retain it and later release it. When you create a serial\
    \ queue using `dispatch_queue_create()`, the reference count for the returned\
    \ queue is one. That’s why we needed to manually release it once we’re done with\
    \ it.\n\nClick Build & Run, and this works fine. There’s a lot of overhead here,\
    \ though. You’re creating and destroying a lot of dispatch queue objects. You\
    \ can see this by running Instruments against this version of the project using\
    \ the Dispatch instrument. You can see that a ton of queues are created and used\
    \ for a very short time.\n\nIn general, when you create or use a queue, you want\
    \ to make sure that it’s doing enough work to justify its use. Unfortunately,\
    \ sometimes you can’t avoid this overhead. Next we’ll consider a situation where\
    \ we don’t need to use the main queue or these private dispatch queues.\n\n# 26.9\
    \  Synchronous Tasks\n\nEverything is running so much faster and better that you’re\
    \ going to be tempted to use dispatch queues everywhere. For example, let’s push\
    \ the calculation of the color of the tile into a concurrent queue:\n\n```\n```objc\n\
    -(void) cycle {\n    dispatch_async(\n        dispatch_get_global_queue(\n   \
    \         DISPATCH_QUEUE_PRIORITY_DEFAULT, 0), ^{\n            [self calculateColor];\n\
    \        });\n    dispatch_async(dispatch_get_main_queue(), ^{\n        [self.grid.tiles\
    \ addObject:self];\n    });\n}\n```\n```"
