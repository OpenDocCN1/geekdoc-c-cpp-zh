  md: '# Chapter 13


    # # Working with Dictionaries


    In the past couple of chapters, we used notifications and delegates to output
    “Launched.” and “Terminated.” In this chapter, you’ll learn to work with dictionaries
    to answer the questions “Launched what?” and “Terminated what?”


    There is a lot of information contained in the notification that we are not yet
    using. Remember that an NSNotification has the name of the notification, the object
    sending the notification, and a dictionary named userInfo filled with key-value
    pairs of information about the specific notification.


    In this chapter, we’ll dig into the contents of that dictionary.[^1] It turns
    out that this is an important technology to know—Cocoa frameworks use dictionaries
    all over the place.


    # ## 13.1  Looking at the User Info


    There are three basic usage patterns for notifications:


    +   - In the first case, all that matters is that you get the notification—all
    you need to know is that the event you were waiting to hear about has occurred.

    +   - In the second case, you might use the notification’s name or object.

    +   - In the third case, you need further information contained in the userInfo
    dictionary. For example, when you get notification that an application has launched,
    you may want to know the name of


    [^1]: Depending on which language you’re coming from, you may use the term *hash*
    instead of *dictionary*.'
