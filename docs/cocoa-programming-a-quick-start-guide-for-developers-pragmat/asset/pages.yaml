    \ {\n    Greeter *greeter = [self greeter];\n    NSLog(@\"Greeter: %@\", greeter);\n\
    \    NSLog(@\"This occurred in %@ at line %d in file %s.\",\n          NSStringFromSelector(_cmd),\
    \ __LINE__);\n    NSTextField *label = [self labelWithText:[greeter greeting]];\n\
    \    [[self.window contentView] addSubview:label];\n}\n```\n```\n\nClick Build\
    \ & Run. Unfortunately, the Greeter object doesn’t know how to describe itself,\
    \ so you inherit the default behavior from NSObject. You’ll see something like\
