  md: "![](img/9355405953264484a02198b0e3d25b7e_178_0.png)\n\nThere’s a lot missing,\
    \ but the most immediate issue for us is that a WebView was able to receive the\
    \ message takeStringURLFrom: and a UIWebView can’t. That’s a problem. In the desktop\
    \ version, it meant that we could wire the web view up to the text field and pass\
    \ the URL without any code. Now we need to find another way.\n\n# 10.4 Loading\
    \ a Web Page at Launch\n\nWe can’t wire the text field and the web view directly\
    \ to each other, so both will need to be connected to our controller. Add two\
    \ outlets to the header file for the MobileBrowserViewController.\n\n```\n```objc\n\
    #import <UIKit/UIKit.h>\n\n@interface MobileBrowserViewController : UIViewController\
    \ {\n    UIWebView *webView;\n    UITextField *address;\n}\n@property(nonatomic,retain)\
    \ IBOutlet UIWebView *webView;\n@property(nonatomic, retain) IBOutlet UITextField\
    \ *address;\n\n@end\n```\n```\n\nUnlike the desktop version, the UIWebView is\
    \ part of the iPhone framework that we are importing at the top of this file,\
    \ so we don’t have to do any special import, and we don’t have to add a framework\
    \ to our target as we did before.\n\nThe properties are different as well. Because\
    \ we are writing for the iPhone, we’ll add the nonatomic attribute to our properties\
    \ as we’re writing for UIKit’s single-threaded, single-core model. We also don’t\
