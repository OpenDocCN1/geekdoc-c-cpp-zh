- pgno: 61
  md: '# Chapter 4


    # # Classes and Objects


    We’re going to set our browser example aside for a few chapters. Now that you
    can read methods, it’s time to write a few of our own. This is the chapter where
    you begin to write Objective-C code. You’ll start with a fairly basic “Hello,
    World!” application and learn to create classes, objects, variables, and methods.


    Remember that our purpose is not to create a great “Hello, World!” application.
    The output of our program won’t change very much during the course of the chapter.
    The point is our progression through using different techniques. You’ll use one
    of Apple’s classes and then create one of your own. You’ll communicate with these
    classes using class methods. You’ll then create an instance of a class and use
    instance methods to communicate with these objects. After we’ve regained our self-respect
    as real developers, we’ll return to our web browser example in Chapter 8, Creating
    a Controller, on page 141 and customize the behavior by writing our own code.


    # ## 4.1 Creating “Hello, World!”


    Let’s create our “Hello, World!” project in Xcode. Remember in Xcode you create
    a new project with File > New Project or ⇧ ⌘ N. Choose the Application > Cocoa
    Application template, leaving all the check boxes unselected, and name the project
    HelloWorld. Click Build & Run, and after a pause, an empty window will appear.
    The application works; it just doesn’t do anything. Quit HelloWorld, or stop the
    tasks from within Xcode by clicking the stop sign, by choosing Run > Stop, or
    by pressing ⇧ ⌘ ↩.'
  merge: -1
