- pgno: 322
  md: "```\n```objective-c\n-(IBAction) step: (id) sender {\n    self.count = [NSNumber\
    \ numberWithInteger:[sender integerValue]];\n}\n@end\n```\n```\n\nIn this section,\
    \ you've seen three methods of changing the value of a variable in such a way\
    \ that observers can be notified. First, you can directly change the value of\
    \ the variable, but you have to wrap it in calls to willChangeValueForKey: and\
    \ didChangeValueForKey:. Second, you can use KVC to change the value of the variable\
    \ using setValue:forKey:. Finally, you can create a property and change the value\
    \ of the property instead of the underlying instance variable.\n\n# ## 20.6 Observing\
    \ the Changes\n\nNow the observer is registered, and the attribute it is watching\
    \ is set up to be observed and to notify the observer of changes. The last step\
    \ is for the observer to respond to the changes. I have to warn you, this is the\
    \ part that gets a lot of complaints. Here's what it might look like in our application:\n\
    \n```\n```objective-c\n// PowerTool KVC/Counters/Display.m\n- (void)observeValueForKeyPath:(NSString\
    \ *)keyPath\n        ofObject:(id)object\n        change:(NSDictionary *)change\n\
    \        context:(void *)context {\n    [self updateDisplay:[object valueForKeyPath:keyPath]];\n\
    }\n```\n```\n\nThe method signature is four lines long while the method body is\
    \ a single line. In line 5, I've chosen to update the display with the new value\
    \ that I pull off the change dictionary.\n\nSo, what's the complaint?\n\nThis\
    \ method gets called for every property this object is observing. You might be\
    \ listening for changes in multiple properties in the same object, or you might\
    \ be listening for changes in properties that belong to different objects. If\
    \ you are registered to be notified of updates to a property, then this is the\
    \ method that gets called, and it's up to you to figure out who called you and\
    \ what to do about it.\n\nThis isn't a big deal, but this differs from the way\
    \ notifications work. With notifications, you get to specify which method in which\
    \ object would be called for any given notification. This is a different mecha-"
  merge: -1
  img_proc: true
- pgno: 323
  md: "nism, and people who want to interact with it the same way they worked with\
    \ notifications complain loudly.\n\nThere are many ways to handle this limitation.\
    \ One is to check that the keypath is to the count property. You’ll soon see that\
    \ this can get ugly and out of hand if we are listening for changes in more than\
    \ one property. The easiest way to get around this limitation is to create small\
    \ focused observers that each only listen for changes in a single property. We’ll\
    \ come back to that approach later in this chapter.\n\n# 20.7  Exercise: Adding\
    \ a Second Observer\n\nOne advantage of KVO is that the object containing the\
    \ attribute being observed doesn’t need to know anything about the observer. You\
    \ can add as many observers as you want.\n\nLet’s do that. Add a second observer\
    \ for the count property in UpOrDown. Create a class named Logger that outputs\
    \ the counter’s new value to the Console. You shouldn’t have to make any changes\
    \ to UpOrDown or to Display.\n\n# 20.8  Solution: Adding a Second Observer\n\n\
    Add a new Objective-C class named Logger to your project. Logger will need an\
    \ outlet to connect it to the UpOrDown instance, so your header should look something\
    \ like this:\n\n[Download KVO/Counter/Logger.h]\n\n```\n#import <Cocoa/Cocoa.h>\n\
    @class UpOrDown;\n\n@interface Logger : NSObject {\n    IBOutlet UpOrDown *counter;\n\
    }\n@end\n```\n\nAdd an outlet for your Logger object in CounterAppDelegate.h.\
    \ Create an instance of Logger in Interface Builder, and connect its counter outlet\
    \ to UpOrDown. Connect CounterAppDelegate’s logger outlet to your Logger outlet.\
    \ Save.\n\nThe implementation of Logger is almost identical to Display. The differences\
    \ are highlighted here. I’m showing you all of Logger since you’ve only seen Display\
    \ in bits and pieces."
