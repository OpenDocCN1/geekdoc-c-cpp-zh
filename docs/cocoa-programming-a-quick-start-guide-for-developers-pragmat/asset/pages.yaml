- pgno: 269
  md: '# Chapter 17


    # # Saving Data to Disk


    At the end of the previous chapter, we added the ability for your users to remove
    applications from the table view. If you’re playing a game at work or surfing
    the Net, you might not want the game or your web browser to be in your visible
    list of running applications.


    But, as we''ve coded things now, the next time you run HelloApplication, the banished
    items will pop up on the list again. In this chapter, you’ll persist the list
    of removed items in two different ways. You’ll also learn how to work with preferences
    to allow the user to choose whether to use the saved list of removed items.


    As always, the example is just a vehicle. We’ll look at creating, saving, and
    reading property lists. We’ll learn to archive, save, and unarchive object graphs.
    Finally, we’ll learn how to create and read two types of defaults.


    First, we’ll work with saving the list of banished apps in our running application.


    # ## 17.1 Saving in Your Running Application


    Before we worry about remembering the removed items from previous times we ran
    HelloApplication, we need to remember the removed items while our application
    is running. Start up HelloApplication, and I’ll show you what I mean.


    Remove one of the applications from your list—I’ll use iCal as an example. iCal
    is still running, but it’s not on your list. So, quit iCal. Now start iCal. See?
    There it is again at the end of your list of running applications. I don’t want
    you to have to remove iCal from the list every time you restart it.'
  merge: -1
  img_proc: true
- pgno: 270
  md: "To solve this problem, we’ll create a helper class for keeping track of which\
    \ apps we’ve removed. Create a new class named BanishedApps using the NSObject\
    \ template. We’ll keep a list of the names of the banished applications in an\
    \ NSMutableArray. We’ll also need methods for adding apps to this array and for\
    \ checking whether an app is already a member.\n\n```\nDownload Persistence/HelloApplications37/BanishedApps.h\n\
    \n#import <Cocoa/Cocoa.h>\n\n@interface BanishedApps : NSObject {\n    NSMutableArray\
    \ *apps;\n}\n@property (retain) NSMutableArray *apps;\n-(void)add:(NSRunningApplication\
    \ *) app;\n-(BOOL)contains:(NSRunningApplication *) app;\n@end\n```\n\nThere’s\
    \ not much to our implementation. We’ll initialize the mutable array in the init\
    \ method. The add: and contains: methods are light wrappers that allow us to pass\
    \ in objects of type NSRunningApplication but store the information as a string\
    \ using the application’s localizedName.\n\n```\nDownload Persistence/HelloApplications37/BanishedApps.m\n\
    \n#import \"BanishedApps.h\"\n\n@implementation BanishedApps\n\n@synthesize apps;\n\
    \n-(BOOL)contains:(NSRunningApplication *) app {\n    return [self.apps containsObject:app.localizedName];\n\
    }\n-(void)add:(NSRunningApplication *) app {\n    if ([self contains:app]) return;\n\
    \    [self.apps addObject:app.localizedName];\n}\n-(id)init {\n    if (self =\
    \ [super init]) {\n        self.apps = [NSMutableArray arrayWithCapacity:5];\n\
    \    }\n    return self;\n}\n@end\n```\n\nThe first line of the add: method might\
    \ look a little odd."
