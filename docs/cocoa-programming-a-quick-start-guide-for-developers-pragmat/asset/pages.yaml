  md: 'You should find this widget:


    ![](img/9355405953264484a02198b0e3d25b7e_285_0.png)


    Drag it onto the preference window. Resize your widget and window, and add text
    to the right of the two radio buttons so it looks something like this:


    ![](img/9355405953264484a02198b0e3d25b7e_285_1.png)


    Take a look at the hierarchy of GUI elements in the Preferences.xib Document window:


    ![](img/9355405953264484a02198b0e3d25b7e_285_2.png)


    We could connect to and interact with each NSButtonCell object in the radio button
    group individually. Instead, we’re going to work with the group as a whole by
    using the NSMatrix object.


    To set which radio button is selected from the PreferencesController object, add
    a property named groupOf type NSMatrix to the PreferencesController class. You
    also need to add an action to PreferencesController that is called whenever a
    radio button is selected. Name your action chooseView:, and save PreferencesController.h.
    In IB, use the Connections inspector to wire this outlet and action to the NSMatrix.


    If we’re going to connect the controller to the NSMatrix and not the individual
    buttons, we need a way to tell the two buttons apart so that we can figure out
    which one is selected. When we worked with tables, we used the column’s identifier.
    NSButtonCells don’t have identifiers, but they do have tags.'
