- pgno: 199
  md: "Start by adding an outlet to the controller of type `NSTextField` named `activityDisplay`:\n\
    \n```\n```objc\n#import <Cocoa/Cocoa.h>\n@class CurrentApp;\n\n@interface ActivityController\
    \ : NSObject {\n    CurrentApp *currentApp;\n    NSTextField *activityDisplay;\n\
    }\n@property CurrentApp *currentApp;\n@property IBOutlet NSTextField *activityDisplay;\n\
    @end\n```\n```\n\nIn Interface Builder, drag a multiline text field into your\
    \ application window. Unselect the Selectable checkbox in the Attributes inspector.\
    \ Connect the outlet to the text field, and save.\n\nHow should we communicate\
    \ the launch and terminate notifications to this view? The controller should be\
    \ the object that lets the view know, but how should the controller get the news?\n\
    \nWe could register the controller to get the launch and terminate notifications\
    \ and then pass the news on to the model. The controller knows about the model\
    \ (after all, it creates the model), so this would be perfectly natural. The model\
    \ could contact the controller when there are changes to report. This is less\
    \ natural because the model doesn’t know about the controller yet. In the next\
    \ chapter, we’ll set the controller up as the model’s delegate, and much later\
    \ in the book we’ll learn how to use the Key Value Observing mechanism.\n\nAnother\
    \ solution is for us to post notifications of our own. Here’s how to post notifications\
    \ named Launched and Terminated from the applicationDidLaunch and applicationDidTerminate\
    \ methods:\n\n```\n```objc\n-(void) applicationDidLaunch: (NSNotification *) notification\
    \ {\n    [[NSNotificationCenter defaultCenter]\n                          postNotificationName:@\"\
    Launched\" object:self];\n}\n-(void) applicationDidTerminate: (NSNotification\
    \ *) notification {\n    [[NSNotificationCenter defaultCenter]\n             \
    \             postNotificationName:@\"Terminated\" object:self];\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 200
  md: "First we obtain our application’s notification center with this call:\n\n```\n\
    ```objc\n[NSNotificationCenter defaultCenter]\n```\n```\n\nNote that this is a\
    \ different call than when we were getting a handle to the notification center\
    \ for our workspace. Once we have the notification center, we post notifications\
    \ using postNotificationName:object:. All that remains is for us to register for\
    \ and respond to these notifications.\n\n# 11.9  Exercise: Receiving the Custom\
    \ Notifications\n\nRegister observers in the ActivityController for the notifications\
    \ we created in the previous section. Implement methods applicationDidLaunch:\
    \ and applicationDidTerminate: in ActivityController that print “Launched.” or\
    \ “Terminated.” in the text field when the appropriate notification is received.\n\
    \n# 11.10  Solution: Receiving the Custom Notifications\n\nYou know how to do\
    \ every step in this exercise; now let’s put it all together. Add the registerNotifications\
    \ and setUpNotificationsWithSelector: methods that we used in CurrentApp. Call\
    \ registerNotifications from awakeFromNib.\n\nWhen you receive a notification,\
    \ you need to change the activeDisplay’s string value to either “Launched.” or\
    \ “Terminated.”\n\n```\n```objc\n// Download Notification/HelloApplication6/ActivityController.m\n\
    #import \"ActivityController.h\"\n#import \"CurrentApp.h\"\n\n@implementation\
    \ ActivityController\n\n@synthesize currentApp, activityDisplay;\n\n-(void) applicationDidLaunch:\
    \ (NSNotification *) notification {\n    [self.activityDisplay setStringValue:@\"\
    Launched.\"];\n}\n-(void) applicationDidTerminate: (NSNotification *) notification\
    \ {\n    [self.activityDisplay setStringValue:@\"Terminated.\"];\n}\n-(void)setUpNotification:\
    \ (NSString *)notification withSelector:(SEL)methodName {\n    [[NSNotificationCenter\
    \ defaultCenter]\n        addObserver:self\n        selector:methodName\n    \
    \    name:notification\n        object:nil];\n}\n```\n```"
