  md: "It's not really a big deal in this little toy example, but there are times\
    \ that I don't like either one of these choices. My source file could be getting\
    \ long, so I want to group my methods logically for a human reader unconstrained\
    \ by a compiler that reads through the source code linearly. On the other hand,\
    \ these methods are not part of the public interface. I don't want to declare\
    \ them in the header file. What I really want is a way of declaring them privately.\n\
    \nThe class extension is created for exactly this situation. Add this to the top\
    \ of your implementation file just under your imports:\n\n```\n```objc\n@interface\
    \ BounceAppDelegate()\n@end\n```\n```\n\nA class extension looks just like a category\
    \ with no name. Because the extension is defined in our implementation file, we\
    \ aren't sharing these method declarations with anyone else. These are private\
    \ functions just for our own use. Declare our new methods in the class extension,\
    \ and then you are free to put the methods anywhere in the class implementation.\n\
    \nDownload Categories/Bounce4/BounceAppDelegate.m\n\n```\n```objc\n#import \"\
    BounceAppDelegate.h\"\n#import \"NSSet+Persistance.h\"\n\n@interface BounceAppDelegate()\n\
    - (void)createSetOnDisk;\n- (void)setFromDisk;\n@end\n\n@implementation BounceAppDelegate\n\
    @synthesize window;\n- (void)applicationDidFinishLaunching:(NSNotification *)aNotification\
    \ {\n    [self createSetOnDisk];\n    [self setFromDisk];\n}\n- (void) createSetOnDisk\
    \ {\n    NSSet *source = [NSSet setWithObjects:@\"One\", @\"Two\", nil];\n   \
    \ [source writeToFile:@\"savedSet\" atomically:YES];\n}\n- (void) setFromDisk\
    \ {\n    NSSet *fromDisk = [NSSet setWithContentsOfFile:@\"savedSet\"];\n    NSLog(@\"\
    Set from disk: %@\",fromDisk);\n}\n@end\n```\n```"
