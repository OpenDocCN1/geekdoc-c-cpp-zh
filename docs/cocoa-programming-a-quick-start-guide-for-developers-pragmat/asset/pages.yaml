  md: '![](img/9355405953264484a02198b0e3d25b7e_235_0.png)


    Your ActivityController object has a foot in both nibs so you can make some of
    the connections in the first nib and other connections in the second nib. The
    ActivityController object is the link between these two worlds.


    I want to stress an important point here. The File’s Owner ActivityController
    is a proxy to the ActivityController instance you created in the MainMenu.nib.
    It is the same object.


    If instead you had dragged an ActivityController into the ActivityView nib, you
    would have been creating a new instance of the ActivityController. These would
    have been two separate objects, so the connections in one nib and the connections
    in the other nib would not have helped communicate at all.


