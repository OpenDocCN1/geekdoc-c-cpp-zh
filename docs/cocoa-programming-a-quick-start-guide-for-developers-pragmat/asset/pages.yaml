  md: "```\n```objective-c\n- (id) initWithWindowNibName:(NSString *)windowNibName\
    \ {\n    if (self = [super initWithWindowNibName:windowNibName]) {\n        [self\
    \ setUpView];\n        [self showWindow:self];\n    }\n    return self;\n}\n@end\n\
    ```\n```\n\n+   - We instantiate the ActivityController and load the nib it will\
    \ control in lines 10 and 11.\n+   - We instantiate the CurrentApp object on the\
    \ next line and then set the ActivityController to be its delegate.\n+   - On\
    \ line 14, we resize the window so that its content size exactly matches the size\
    \ of the view.\n+   - Once its properly sized, we then set the content view to\
    \ be replaced by the view controller’s view.\n+   - Finally on line 16, we initialize\
    \ the view controller to use the icon and app name for our HelloApplication app.\n\
    \nWe now have three separate nibs that are cohesive and easy to understand. The\
    \ first, MainMenu.xib, consists of the app, the app delegate, and the (unused)\
    \ menu. The second nib is loaded, and its File’s Owner is created by the app delegate.\
    \ The second nib, MainWindow.xib, contains the window and has the window controller\
    \ as its File’s Owner. The window controller loads the third nib and creates its\
    \ File’s Owner—the ActivityController along with the model. This third nib, ActivityView.xib,\
    \ contains the view and has the view controller as its File’s Owner.\n\nThere\
    \ were a lot of steps in this chapter. The techniques are important. Keep your\
    \ eye on your nib files the same way you do on your classes. When they get too\
    \ big and lose focus, then consider splitting them. There are two main reasons\
    \ to split a nib file. First, you want to keep them cohesive and single-purpose.\
    \ Second, as you’ll see in Chapter 17, *Saving Data to Disk*, on page 270, you\
    \ can manage your memory better by loading the nib when you need it and releasing\
    \ the memory when you aren’t using it."
