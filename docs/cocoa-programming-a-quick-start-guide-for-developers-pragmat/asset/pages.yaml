    # 9.9 Exercise: Updating the URL and Setting Buttons


    Now that you’ve seen how to display the page title as the window’s title when
    it’s available, you can reset the buttons and update the URL once the page is
    loaded. Until now, if the user clicks a link in a web page, the new page will
    load, but the URL won’t change in the text field as the user would expect from
    experience with pretty much every other browser.


    To reset the buttons and update the URL after the page is loaded, identify a method
    in the WebFrameLoadDelegate protocol that is called when the frame has completed
    loading. Implement the delegate method to do two things: (a) set the text field’s
    string value to be the URL for the page’s main (and only) frame and (b) call resetButtons.


    Hint 1: If you look in the NSTextField class reference for a method to set the
    text field’s string value, you won’t find what you are looking for. Remember,
    the inherited methods do not appear in the Cocoa docs. So, you need to look at
    the class reference for NSTextField’s superclass NSControl. You’ll find setStringValue:
    in “Tasks” under “Setting the Control’s Value.”


    Hint 2: WebView has a lot of methods. It’s easy to miss the one you want for fetching
    the right URL. Look in the “Tasks” section under the heading “Getting and Setting
    Frame Contents.”'
