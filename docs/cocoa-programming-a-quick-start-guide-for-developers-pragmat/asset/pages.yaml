    \ the corresponding buttons.\n\n# 9.6 **Application Delegate**\n\nWe’ve actually\
    \ been using delegates since our very first project. The Cocoa Application template\
    \ introduced in Xcode 3.2 includes an application delegate. Now that you understand\
    \ the idea in the context of windows, you should be able to see how it applies\
    \ to applications.\n\nWhen an application launches, there are lots of things that\
    \ must happen, and Apple takes care of that for you. But there are also things\
    \ that are special to your application that Apple can’t possibly know about. If\
