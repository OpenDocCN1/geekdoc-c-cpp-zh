- pgno: 255
  md: '# # Displaying Data in a Table


    We''re going to work with successively cooler and more powerful ways to interact
    with data between now and the end of the book. In this chapter, you''ll learn
    a fairly basic way to display data in a table view.


    We''ll use an array as the data source for our table view. Each entry in the array
    will consist of an NSRunningApplication instance that will be used to populate
    a row in our displayed table. The object properties will correspond to the table
    columns. This correspondence between column identifiers and properties will be
    your first step on our journey through Key Value Coding, Key Value Observing,
    and the rest of Bindings on our way to Core Data.


    By the end of this chapter, your table view will respond to updates to the underlying
    data, and you will be able to update your data from the table view. To get going,
    we''ll create a table view and tie it to a simulated data source.


    # ## 16.1 Tables and Data Sources


    Let''s start by setting up your table view and its corresponding data source.
    In this first example, you''ll just fill each cell in the table with its row and
    column numbers. We can reuse the ActivityView nib and the ActivityController for
    this example.'
  merge: -1
  img_proc: true
