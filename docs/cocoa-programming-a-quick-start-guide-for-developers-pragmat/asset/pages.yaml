  md: "# 25.5  Custom NSOperations\n\nBlock operations and invocation operations are\
    \ going to meet most of your needs. When they don't, you can create your own subclass\
    \ of NSOperation to create custom operations that you add to a queue.\n\nAdd a\
    \ new file to your project, a class of type NSObject named SpinnerOperation. We\
    \ need to make some changes to the header file. The SpinnerOperation class must\
    \ subclass the NSOperation class. We also need to declare an instance variable\
    \ for the spinner and a custom init method to set the spinner when we initialize\
    \ the SpinnerOperation object.\n\n```\n#import <Foundation/Foundation.h>\n\n@interface\
    \ SpinnerOperation : NSOperation {\n    NSProgressIndicator *spinner;\n}\n-(id)\
    \ initWithSpinner:(NSProgressIndicator *) newSpinner;\n\n@end\n```\n\nImplement\
    \ the custom init like this:\n\n```\n-(id) initWithSpinner:(NSProgressIndicator\
    \ *) newSpinner {\n    if (self = [super init]) {\n        spinner = newSpinner;\n\
    \    }\n    return self;\n}\n```\n\nWhen you subclass NSOperation and you don't\
    \ have to worry about concurrency, put work that needs to be performed by this\
    \ operation in the main method.³\n\n```\n-(void) main {\n    [spinner startAnimation:self];\n\
    \    sleep(4);\n    [spinner stopAnimation:self];\n}\n```\n\n> ³. The NSOperation\
    \ docs specify a lot of extra work that needs to be done if you are making your\
    \ operations concurrent. We aren't, and you never have to if you use your operations\
    \ with an operation queue. The NSOperation docs make it clear that when you use\
    \ an operation queue, there is no reason to make your operation concurrent."
