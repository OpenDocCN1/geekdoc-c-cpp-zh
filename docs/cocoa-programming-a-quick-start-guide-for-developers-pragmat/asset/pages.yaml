    ```\n\nClick Build & Run. Applications you remove should not appear in your table\
    \ view even if you quit and relaunch either HelloApplication or the applications\
    \ you remove.\n\n# 17.5 Saving an Archive to Disk\n\nYou’ll normally use plists\
    \ to persist relatively small amounts of application data (often configuration\
    \ related). But what if you want to store large amounts of data or if you want\
    \ to persist an object tree? For the most part, you’ll want to use the techniques\
    \ I’ll describe in Chapter 22, Core Data, on page 350. There are, however, in-between\
    \ times when you need to write your data as an archive.\n\nThere are essentially\
    \ two levels to saving an object graph to disk. At the top level, you need to\
    \ create an archive of all the objects that need to be saved and later retrieved.\
    \ These actions are handled by methods in instances of the NSKeyedArchiver and\
    \ NSKeyedUnarchiver classes. You pass in the object at the root of the tree, and\
    \ each object will be asked to encode or decode itself.\n\nAt this object level,\
    \ each object is responsible for knowing what part of its state needs to be persisted\
    \ using the encodeWithCoder: method. Loading the data from disk is the inverse\
    \ operation and uses each object’s initWithCoder: method.\n\nI’m not going to\
    \ have you build a new application to illustrate this concept. For the most part,\
    \ you should either be able to use the plist"
  merge: -1
  img_proc: true
- pgno: 276
  md: "approach, or you should look to use Core Data. But imagine that the apps is\
    \ an NSMutableSet instead of an NSMutableArray.²\n\nSuppose you want to persist\
    \ the current state of your BanishedApps object to disk. There are only two variables\
    \ that we could think of persisting: apps and dataFile. It makes no sense to persist\
    \ dataFile because it is the path to the directory where I would be persisting\
    \ it—we’d never have any use for the saved value. So when it is time to save our\
    \ BanishedApps object, we just need to encode the contents of apps. Implement\
    \ the encodeWithCoder: method.\n\n```\n```objective-c\n- (void) encodeWithCoder:\
    \ (NSCoder *) coder {\n    [coder encodeObject:self.apps forKey:@\"bannedApps\"\
    ];\n}\n```\n```\n\nYou don’t call encodeWithCoder:. It is called by the keyed\
    \ archiver when it is saving the object tree. Our BanishedApps object is part\
    \ of the tree that has an ActivityController object above it. So, we might create\
    \ the archive in the window controller with a call like this:\n\n```\n```objective-c\n\
    [NSKeyedArchiver archiveRootObject:ac toFile:self.dataFile];\n```\n```\n\nHere\
    \ ac is the instance of the ActivityController that will be at the root of our\
    \ tree, and dataFile points to the file where we are writing the data.\n\nWe reverse\
    \ this process with a call like this:\n\n```\n```objective-c\nself.ac = [NSKeyedUnarchiver\
    \ unarchiveObjectWithFile:self.dataFile];\n```\n```\n\nDuring the unarchiving\
    \ process, each object must know how to unencode itself. We do this in a variant\
    \ on the init method named initWithCoder:. For example, somewhere inside the initWithCoder:\
    \ method for BanishedApps will have this line:\n\n```\n```objective-c\nself.apps\
    \ = [coder decodeObjectForKey:@\"bannedApps\"];\n```\n```\n\nThose are the four\
    \ steps to create archives when your objects are comprised of types that don’t\
    \ know how to write themselves to files. Now let’s get back to our running example\
    \ and allow the user to set preferences for your application.\n\n2. It is easy\
    \ enough to convert an NSSet to an NSArray and back again that in practice we\
    \ would do the conversion and persist as a plist. The purpose here is to show\
    \ you how to use an NSCoder."
