  md: "We create our mutable dictionary in the init method. Use the setObject:forKey:\
    \ method to add a new entry to the dictionary that has the application’s name\
    \ as a key and a time stamp as its value whenever an application is launched.⁶\n\
    \n```\n[runningApps setObject:[NSDate date] forKey:appName];\n```\n\nIn place\
    \ of appName, we’ll need to retrieve the name of the application from the userInfo\
    \ dictionary for our notification. Similarly, we’ll use the removeObjectForKey:\
    \ method whenever an application is terminated to remove the entry with the key\
    \ equal to the name of the application that is terminated.\n\n```\n[runningApps\
    \ removeObjectForKey: appName];\n```\n\nLet’s add logging to display the value\
    \ of the runningApps variable at the end of the respondToChange: method. When\
    \ I run the application and start up iCal, I see this in my Console window:\n\n\
    ```\nHelloApplication = \"2009-10-03 10:45:36 -0400\";\niCal = \"2009-10-03 10:45:39\
    \ -0400\";\n```\n\nFor completeness, here is CurrentApp.m:\n\n```\nDownload Dictionaries/HelloApplication16/CurrentApp.m\n\
    \n#import \"CurrentApp.h\"\n\n@implementation CurrentApp\n\n@synthesize delegate,\
    \ name;\n\n-(void) respondToChange: (NSNotification *) notification {\n    SEL\
    \ methodName = NSSelectorFromString(@\"delegateMethods objectForKey:[notification\
    \ name]\");\n    if ([self.delegate respondsToSelector:methodName]) {\n      \
    \  self.name = [notification.userInfo objectForKey:@\"NSApplicationName\"];\n\
    \        [self.delegate performSelector:methodName withObject:self];\n    }\n\
    \    NSLog(@\"%@\", runningApps);\n}\n-(void) applicationDidLaunch: (NSNotification\
    \ *) notification {\n    [runningApps setObject:[NSDate date]\n              \
    \       forKey:[notification.userInfo\n                             objectForKey:@\"\
    NSAppleApplicationName\"]];\n    [self respondToChange:notification];\n}\n```\n\
    \n6. There’s no real reason for doing this other than to show that we can add\
    \ and remove entries to/from our dictionary."
