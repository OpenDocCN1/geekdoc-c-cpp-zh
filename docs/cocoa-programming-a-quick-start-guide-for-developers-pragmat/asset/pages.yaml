- pgno: 318
  md: "In other words, you haven't changed the relationship between UpOrDown and the\
    \ stepper or between Display and the text field. But now Display needs to know\
    \ about UpOrDown, whereas before it was the other way around.\n\nOur diagram points\
    \ out a problem that we have now that we didn't before. Nothing holds on to the\
    \ Display object. We're running our applications with garbage collection on. The\
    \ Display object will register itself as an observer and then be garbage collected\
    \ unless we hold on to it.\n\nAdd a property to the app delegate:\n\nDownload\
    \ KVCO/Counter3/CounterAppDelegate.h\n\n```\n    #import <Cocoa/Cocoa.h>\n   \
    \ @class Display;\n\n    @interface CounterAppDelegate : NSObject <NSApplicationDelegate>\
    \ {\n        NSWindow *window;\n        Display *display;\n    }\n    @property\
    \ (assign) IBOutlet NSWindow *window;\n    @property IBOutlet Display *display;\n\
    \    @end\n```\n\nSynthesize the property in the implementation file, and connect\
    \ this outlet in Interface Builder to the Display object.\n\nNext we connect the\
    \ Display object to the UpOrDown object and prepare the objects for adding an\
    \ observer. First, add an IBOutlet to the Display header:\n\nDownload KVCO/Counter3/Display.h\n\
    \n```\n    #import <Cocoa/Cocoa.h>\n    @class UpOrDown;\n\n    @interface Display\
    \ : NSObject {\n        IBOutlet NSTextField *displayField;\n        IBOutlet\
    \ UpOrDown *counter;\n    }\n    @end\n```\n\nI've removed the declaration for\
    \ the updateDisplay: method. We'll still implement this method, but it no longer\
    \ is part of the Display's public interface.\n\nNext, let's move over to the object\
    \ it's observing. The UpOrDown header file can be altered a bit. We'll remove\
    \ all references to Display and add an ivar of type NSNumber named count."
