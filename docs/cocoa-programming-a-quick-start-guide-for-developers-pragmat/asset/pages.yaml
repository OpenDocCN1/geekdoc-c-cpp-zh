  md: '# 2.3　Testing the Interface with the Cocoa Simulator


    You should pause now and then to play with your interface to make sure it is behaving
    the way you want it to behave. You first need to have Interface Builder selected
    as your application (click any IB window). Start the Cocoa Simulator using either
    ⌘R or File > Simulate Interface.


    Nothing is wired together, so you can’t check behavior yet. For now, all you can
    test is that the application looks right. Resize the window. Make it really big.
    Make it really small.


    The items probably don’t behave the way you want them to behave. When you make
    the window really big, you expect the web view to grow accordingly. When you stretch
    the window out wide, you expect the buttons and text field to stay close to each
    other and to have the text field grow to make up the difference.


    The problem is, you haven’t told the application how you want the components to
    behave as the window is stretched and shrunk. Quit the simulator with ⌘Q or Cocoa
    Simulator > Quit Cocoa Simulator.


    Let’s fix how the size of the components change when the window is resized. You’ll
    need to open the Size inspector in IB. You can do this with ⌘3. (You use ⌘3 because
    the Size inspector is the third tab in the inspector window.) You can also use
    your mouse to choose the Size inspector with Tools > Size Inspector. If the inspector
    is already open, you can select the third tab from the left.⁵ That’s the one with
    the icon that looks like a ruler. You can also open the inspector using ⌘I or
    Tools > Inspector. In any case, if you select a button and the Size inspector,
    you should see something that looks like the screenshot on the next page.


    To change the size settings for a component, you select the component and then
    make adjustments in the Size inspector. For now we’re making adjustments to the
    “autosizing” settings. You should experiment with setting the four struts, the
    I-beam shapes, on the outside of the inner square.


    5.　There are lots of ways to get to each of the inspectors. I present more than
    one because some people like menus and others like keyboard shortcuts. Choose
    the one you like the best.'
