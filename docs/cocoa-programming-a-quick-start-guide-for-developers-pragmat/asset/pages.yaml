- pgno: 325
  md: "Our interface looks like this:\n\n![](img/9355405953264484a02198b0e3d25b7e_325_0.png)\n\
    \nLet’s get rid of the logger files. They don’t do any harm, but they clutter\
    \ up this example a bit. You’ll need to delete Logger.h and logger.m. Don’t forget\
    \ to delete the Logger object from Interface Builder’s Document window and remove\
    \ the logger property from CounterAppDelegate.\n\nUpOrDown will now need two outlets\
    \ and two properties:\n\nDownload KVO/Counter/UpOrDown.h\n\n```\n```objc\n#import\
    \ <Cocoa/Cocoa.h>\n\n@interface UpOrDown : NSObject {\n    NSNumber *countOne,\
    \ *countTwo;\n}\n@property(copy) NSNumber *countOne, *countTwo;\n-(IBAction) stepOne:(id)\
    \ sender;\n-(IBAction) stepTwo:(id) sender;\n@end\n```\n```\n\nIn UpOrDown.m,\
    \ you need to synthesize both variables and implement the actions to set the properties\
    \ using the current counter value:\n\nDownload KVO/Counter/UpOrDown.m\n\n```\n\
    ```objc\n#import \"UpOrDown.h\"\n\n@implementation UpOrDown\n\n@synthesize countOne,\
    \ countTwo;\n\n-(IBAction) stepOne: (id) sender {\n    self.countOne = [NSNumber\
    \ numberWithInteger:[sender integerValue]];\n}\n-(IBAction) stepTwo: (id) sender\
    \ {\n    self.countTwo = [NSNumber numberWithInteger:[sender integerValue]];\n\
    }\n@end\n```\n```"
