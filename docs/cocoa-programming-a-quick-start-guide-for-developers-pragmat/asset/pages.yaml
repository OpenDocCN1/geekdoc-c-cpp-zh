    # ## 11.1 Exercise: Creating a Model


    Our next running example will display the name and icon of applications as they
    launch and terminate. As with the browser, the point of this application is not
    to build a full-featured application but rather to use it to learn more about
    aspects of Cocoa programming. In this chapter, we''ll start with notifications.


    Create a new Cocoa application, and name it HelloApplication. Remember, we''re
    back in the world of Mac OS X apps, so we won''t need to manage our own memory.
    Change the Project setting so that garbage collection is required. You''ll do
    that for every project we create from here on out.


    Add two classes that each extend NSObject. The CurrentApp class will represent
    your model for this application. Don''t customize it in any way yet. The class
    ActivityController will be our controller. Instantiate it in MainMenu.xib. Create
    an instance of CurrentApp in the ActivityController''s awakeFromNib, and store
    it in a property named currentApp.


    # ## 11.2 Solution: Creating a Model


    By now you should be building some muscle memory for creating new projects and
    files. You created your HelloApplication with all of the checkboxes unselected.
    You created a new file CurrentApp.m that was an Objective-C class that extends
    NSObject. You then repeated the process for ActivityController.m.


    Now instantiate your classes. In Interface Builder drag an instance of ActivityController
    into the MainMenu.xib''s Document window.


    In Xcode, declare an instance variable and a property named currentApp of type
    CurrentApp to ActivityController.h. Remember to use @class to forward declare
    the CurrentApp class.


    1. In this chapter we won''t be looking at this notification object. Our example
    will focus on registering to receive notifications and responding to receiving
    a notification. We''ll return to this subject and show you how to work with the
    notification object in Chapter 13, *Working with Dictionaries*.'
