- pgno: 349
  md: '# Chapter 22


    # Core Data


    We’ve been pretty successful at separating our model, view, and controller. You’ve
    seen from our work in custom views that we can write code to describe our views,
    but you’ve also seen the power and flexibility we get by creating as much of our
    views as we can using Interface Builder. You’ve also seen that the controller
    layer provides the glue between the model and the view. We’ve written much of
    the controller logic in code, but you’ve seen the power of using Cocoa Bindings
    to wire up our view and model again in Interface Builder.


    But if you look back at the past couple of chapters, there hasn’t been a lot to
    our model. We’ve created a couple of classes that contain a couple of properties.
    Core Data lets us build models like this using GUI tools. Entities and attributes
    will be the Core Data analog for classes and properties.


    Core Data provides you with a tool for designing the elements of your model and
    how they interact with each other. It automatically creates the classes and objects
    your program will need to work with these model objects, and it takes care of
    persistence for you. If you are writing data to or reading data from disk in your
    Cocoa app, you should be using Core Data.


    In this chapter, we’ll revisit the book example we’ve worked with and create an
    entity relationship diagram with Xcode’s data modeling tool. We’ll re-create and
    extend this entire example without writing any code. Each book will have a title,
    one or more authors, and a collection of chapters. We’ll allow the user to add,
    remove, or alter this information for any book they select. We’ll also look at
    how Bindings and Core Data work together to fill these tables, to save and retrieve
    the information from disk, and to support sorting and searching.'
  merge: -1
  img_proc: true
