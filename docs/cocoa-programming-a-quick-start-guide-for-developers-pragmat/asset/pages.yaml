- pgno: 214
  md: "# ### 13.3  Exercise: Displaying the Name\n\nAdd a property named name of type\
    \ NSString to CurrentApp. Set the value of name property when you receive a notification\
    \ by reading it from the userInfo dictionary. Your application window should look\
    \ something like this:\n\n![](img/9355405953264484a02198b0e3d25b7e_214_0.png)\n\
    \nIn other words, when you update the text field, the message should read “Launched:\
    \ iCal” or “Terminated: iCal,” respectively, when you start or quit iCal.\n\n\
    # ### 13.4  Solution: Displaying the Name\n\nAdd the name instance variable and\
    \ property to the header file. Specify the memory model as copy because NSString\
    \ conforms to the NSCopying protocol.\n\n```\n```objective-c\n#import <Cocoa/Cocoa.h>\n\
    #import \"ActivityMonitorDelegate.h\"\n\n@interface CurrentApp : NSObject {\n\
    \    NSObject <ActivityMonitorDelegate> *delegate;\n    NSString *name;\n}\n@property\
    \ IBOutlet NSObject <ActivityMonitorDelegate> *delegate;\n@property(copy) NSString\
    \ *name;\n\n@end\n```\n```\n\nSet the name in the applicationDidLaunch: and applicationDidTerminate:\
    \ methods in CurrentApp.m:\n\n```\n```objective-c\n-(void) applicationDidLaunch:\
    \ (NSNotification *) notification {\n    self.name = [notification.userInfo objectForKey:@\"\
    NSApplicationName\"];\n    [self.delegate applicationDidLaunch:self];\n}\n-(void)\
    \ applicationDidTerminate: (NSNotification *) notification {\n    self.name =\
    \ [notification.userInfo objectForKey:@\"NSApplicationName\"];\n    [self.delegate\
    \ applicationDidTerminate:self];\n}\n```\n```"
