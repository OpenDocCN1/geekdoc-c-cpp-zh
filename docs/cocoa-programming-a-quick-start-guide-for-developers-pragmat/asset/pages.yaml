    # 16.4  Exercise: Introducing a Data Source


    Right now we don''t have any real data backing our table. Let’s create an array
    of the applications that are running when our application first launches and display
    that in the table. For now you''ll display the same information in both columns.


    Declare a mutable array called runningApps to be a property of Activity-Controller.
    Override initWithNibName:Bundle: to set the value of this array to runningApplications
    for the shared instance of the NSWorkspace.³


    Your table view is going to display the contents of the runningApps array. How
    many rows are there in the table? The answer to that question is the value you
    will return from numberOfRowsInTableView.


    All that remains is for you to fill each cell with the application name for each
    record. The runningApps array is filled with objects of type NSRunningApplication.
    You know how to retrieve the application name. You’ll need to get the object from
    the runningApps array that has the same index as the rowIndex.


    ³ This is marked as a class method in the docs, but at the time of this writing
    is implemented as an instance method.'
