- pgno: 333
  md: '# Chapter 21


    # Cocoa Bindings


    So far, we’ve used Interface Builder to create our GUI and to connect buttons,
    labels, tables, and more to controllers and models. This eliminates a lot of boilerplate
    code. You don’t need to inherit from an NSButton and configure its look and placement
    in code. You know from your work with custom views that you can write that code—you
    just don’t have to this.


    Cocoa Bindings looks at the controller layer and asks how much of the repetitive
    code can be removed. It turns out, if you are careful to work with KVO- and KVC-compliant
    classes, the answer is “most of it.” Much of this chapter will find us back in
    Interface Builder making connections and typing in keypaths. We’ll have a little
    bit of code to write but not much.


    We’ll start this chapter by creating a new Cocoa application named CounterWithBindings.
    You will add a new Objective-C class named Counter, declare a property named count
    of type NSNumber, and synthesize it. That’s all the code you’re going to need
    to write to create your model.


    As for the view, you’ll drag a stepper and a text field into the window. We’ll
    add more as the chapter progresses, but that will be good enough to begin with.


    That leaves us with the controller. In this chapter, you won’t be implementing
    the controller in code. You’ll use Cocoa Bindings and the fact that your model
    is KVC and KVO compliant to create your controller using Interface Builder. Cocoa
    Bindings will let the view and model communicate without us writing a lot of boilerplate
    glue code. We’ll start by revisiting our example from the previous chapter.'
  merge: -1
  img_proc: true
- pgno: 334
  md: "# 21.1  The Model and View for Our Counter with Bindings\n\nCreate a new project\
    \ named CounterWithBindings. Add a new Objective-C class named Counter that contains\
    \ the property count. In other words, you add two lines of code to the header\
    \ file template:\n\n```\nDownload Bindings/CounterWithBindings/Counter.h\n\n#import\
    \ <Cocoa/Cocoa.h>\n\n@interface Counter : NSObject {\n    NSNumber *count;\n}\n\
    @property(copy) NSNumber *count;\n\n@end\n```\n\nYou also need to add one line\
    \ of code to the implementation to synthesize the property count:\n\n```\nDownload\
    \ Bindings/CounterWithBindings/Counter.m\n\n#import \"Counter.h\"\n\n@implementation\
    \ Counter\n\n@synthesize count;\n\n@end\n```\n\nWe have a single class with a\
    \ single property defined. There will be no other code in this application for\
    \ the first part of this chapter.\n\nNow let’s create the view. Drag a stepper\
    \ and a text field into the main window. As before, use the Attributes inspector\
    \ so that the stepper’s behavior is set to Value Wraps. Resize the window to look\
    \ like this:\n\n![](img/9355405953264484a02198b0e3d25b7e_334_0.png)\n\nOK. Now\
    \ we have our model and our view. Let’s create the controller.\n\n# 21.2  Creating\
    \ and Connecting the NSObjectController\n\nIn Interface Builder, drag a Counter\
    \ object from the Library, and drop it on the Document window. This is the instance\
    \ of your model."
  merge: -1
  img_proc: true
- pgno: 335
  md: '# Joe Asks…


    # **Wouldn’t Code Be Better?**


    Depending on your background, it sure can feel like that. A lot of the logic now
    moves to files you set up with Interface Builder. When you have a problem, you
    can’t use the techniques you’ve been using forever. Initially, it is harder to
    locate problems. On the other hand, you’re less likely to create these problems
    by making mistakes in what should be boilerplate code.


    Cocoa Bindings can be scary. But soon you’ll get a feel for where you should look
    when things go wrong. If you think back to your early days coding, the same thing
    was true there. You had to learn where to look for problems. You probably stared
    long and hard before you found that you typed = when you meant to type ==. So,
    this isn’t a new frustration so much as a new frontier for an old one.


    Next, drag an NSObjectController from your Library to the Document window. Remember
    back to our early examples in this book. The controller sits between the model
    and the view. The controller insists on being an intermediary. You will need to
    configure your controller by following these three steps:


    +   1. Connect to the object that the object controller is controlling.

    +   2. Specify which keys the object controller is responsible for.

    +   3. Bind each element to a property that the object controller is controlling.


    # Connecting the Controller


    The object controller needs to know which object it is controlling. Click the
    object controller, and look in the Connections inspector for its content outlet.
    Connect this content connection to the Counter object. You can (and soon will)
    have more than one object of the same type. This is the step where you are specifying
    which one the object controller is responsible for.'
  merge: -1
  img_proc: true
