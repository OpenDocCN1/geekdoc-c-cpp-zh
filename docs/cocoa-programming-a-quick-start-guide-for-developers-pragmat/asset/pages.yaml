    -(void) setUpView {\n    self.currentApp = [[CurrentApp alloc] init];\n    self.currentApp.delegate\
    \ = self.ac;\n    [self.window setContentSize:[self.ac.view bounds].size];\n \
    \   self.window.center = self.ac.view;\n    [self.ac applicationDidLaunch:\n \
    \                 [NSRunningApplication currentApplication]];\n}\n```\n```\n\n\
    The setUpView method was meant to be called only once when the application first\
    \ launches. Now it is called every time we switch views. There’s no reason to\
    \ create a fresh instance of CurrentApp every time we switch views. We also only\
