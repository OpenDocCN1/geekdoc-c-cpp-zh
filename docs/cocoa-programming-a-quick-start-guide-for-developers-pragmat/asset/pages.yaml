  md: 'traditional target-action approach. In the next section, we’ll make this even
    more explicit with code so you can see the direction of the message being sent.
    Then we’ll turn the model on its head and introduce an observer.


    # 20.2 A Target-Action Counter


    Before we set up an observer, I’m going to have you expand this example by inserting
    two objects between the stepper and the text field to illustrate that we are currently
    using target action. The stepper will send a message to an UpOrDown object, which
    will send a message to a Display object, which will send a message to the text
    field. The flow is something like this:


    ![](img/9355405953264484a02198b0e3d25b7e_315_0.png)


    This might feel like a step in the wrong direction, but I think it will help you
    better see what KVO gives you when we get there in the next section.


    Create a new Objective-C class, and name it Display. This class will need an outlet
    that you’ll connect to the text field, and it will need a method that can be called
    by the UpOrDown object to pass in the new value for the text field.


    Notice that there is no property for the displayField, so we indicate that it
    is an IBOutlet when we declare the variable. If there was a corresponding property,
    we technically could leave the IBOutlet label with the declaration of the instance
    variable, but it is better form to move it to the property declaration as we’ve
    done before.'
