  md: "What should get returned for the cells in a particular row? The localizedName\
    \ of the RunningApplication object at that same index should be returned.\n\n\
    ```\n```\nDownload Tables/HelloApplication31/ActivityController.m\n- (id)tableView:(NSTableView\
    \ *)aTableView\n    objectValueForTableColumn:(NSTableColumn *)aTableColumn\n\
    \    row:(NSInteger)rowIndex {\n    return [[runningApps objectAtIndex:rowIndex]\
    \ localizedName];\n}\n```\n```\n\nThe hard part of this exercise is initializing\
    \ runningApps. We can’t just cast the runningApplications array to a mutable array.\
    \ Instead, we create a mutable array and then add the contents of runningApplications\
    \ to it.\n\n```\n```\nDownload Tables/HelloApplication31/ActivityController.m\n\
    - (id)initWithNibName:(NSString *)nibName bundle:(NSBundle *)nibBundle{\n    if\
