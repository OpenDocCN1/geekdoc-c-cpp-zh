    # ## 18.7 Moving the Main Window


    When a user selects one of the two menu items, the obvious object to respond is
    the window controller. The window controller is set up to swap one view for another.
    Unfortunately, the menu items and the window controller are in separate nibs,
    so we can’t just create an action in the window controller and wire it to a menu
    item.


    Open MainMenu.xib in Interface Builder. Drag an instance of MyWindowController
    from the Classes tab of the Library into the Document window. Now we have to adjust
    how we load our window controller and MainWindow nib.


    The applicationDidFinishLaunching: method in HelloApplicationAppDelegate contains
    this single line:


    ```

    ```objective-c

    [[MyWindowController alloc] initWithWindowNibName:@"MainWindow"];

    ```

    ```


    We need to remove it. By dragging MyWindowController into the MainMenu, we are
    instantiating it there. We shouldn’t create a separate instance of it in the app
    delegate, or we will be looking at one instance and sending messages to another
    instance. Get rid of this line so that the applicationDidFinishLaunching: method
    is empty.


    If you click Build & Run at this point, the application will launch, but you won’t
    see a window. Take a look at MyWindowController.m. It has the method initWithWindowNibName:,
    but there’s nothing left to tell it what its nib name is.'
