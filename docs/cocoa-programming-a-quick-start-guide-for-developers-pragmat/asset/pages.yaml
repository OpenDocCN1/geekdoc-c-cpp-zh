- pgno: 242
  md: '# Creating Custom Views


    Until now, we’ve used Interface Builder to build our entire view. In this chapter,
    we’re taking the first step toward a more complicated UI. You’re going to have
    to supplement the information entered in Interface Builder with code. You are
    going to subclass NSView to create your own custom views.


    We’ll start by drawing the launched or terminated application’s icon into an NSImageView.
    Then we will create a custom view and learn how to draw shapes and text on it.
    Finally, we’ll move our icon display onto the custom view so that you will see
    how to draw images in a custom view.


    # ## 15.1 Creating a Custom View


    Create a new view-based nib file to use for our drawing, and call it IconView.xib.
    We’ll need a view controller for this nib, so create a new NSObject named IconViewController.
    Change the header file so that it extends NSViewController and implements the
    ActivityMonitorDelegate protocol.


    ```

    ```objectivec

    // Download CustomView/HelloApplication22/IconViewController.h

    #import <Cocoa/Cocoa.h>

    #import "ActivityMonitorDelegate.h"


    @interface IconViewController : NSViewController <ActivityMonitorDelegate>{

    }

    @end

    ```

    ```'
