  md: "We just need to implement the two methods we declared in the header file. Remember,\
    \ the strategy is to convert our set to and from an array and then use the array’s\
    \ methods to write to and read from disk. Fortunately, NSSet has a class method\
    \ setWithArray: that creates a new NSSet from an NSArray. We can chain that with\
    \ NSArray’s arrayWithContentsOfFile: like this:\n\n```\n```objc\n+ (id)setWithContentsOfFile:(NSString\
    \ *)aPath {\n    return [NSSet setWithArray:[NSArray arrayWithContentsOfFile:aPath]];\n\
    }\n```\n```\n\nIt’s slightly trickier to write to disk because NSArray doesn’t\
    \ have a convenience constructor for creating an array from a set. Create an NSMutableArray\
    \ of the same size as our NSSet, and iterate through all elements of the set,\
    \ adding them one at a time to the array. Once you’re done, the array can write\
    \ itself to disk.\n\n```\n```objc\n- (BOOL)writeToFile:(NSString *)path atomically:(BOOL)flag\
    \ {\n    NSMutableArray *temp = [NSMutableArray arrayWithCapacity:self.count];\n\
    \    for (id element in self) {\n        [temp addObject:element];\n    }\n  \
    \  return [temp writeToFile:path atomically:YES];\n}\n```\n```\n\nNotice we can\
    \ call methods and access instance variables from the class we’re decorating.\
    \ We’re using count and iterating over all of the elements of the underlying NSSet\
    \ object.\n\nClick Build & Run. You should still get the two compiler warnings\
    \ that NSSet may not respond to the methods writeToFile:atomically: and setWithContentsOfFile:.\
    \ This time, however, there are no runtime errors. The application runs perfectly.\
    \ The set is created, and the methods added in the category take care of writing\
    \ it to and reading it from disk.\n\n# 23.3  Category Cautions\n\nDid you notice\
    \ what just happened?\n\nWe wrote some client code that called two methods that\
    \ didn’t exist in the NSSet class. The compiler complained, and we got a runtime\
    \ exception. We fixed our problem without ever touching this code again and without\
    \ having access to the NSSet source code."
