  md: "In Interface Builder, select the button you've labeled Display Icon view at\
    \ startup. Look at the bottom of the Attributes inspector, and you should see\
    \ the attribute Tag with the value 1. Similarly, the Tag attribute for the other\
    \ button cell has the value 0.¹\n\n# 18.2 Adding Preferences for View at Launch\n\
    \nWe need to do four things to get the preferences working:\n\n+   1. Choose a\
    \ name for the preference and a format for it.\n+   2. Create a default value\
    \ that will be used before the user sets their own preferences.\n+   3. Read from\
    \ the preference when our PreferencesController awakes from nib.\n+   4. Write\
    \ to the preference when the user selects a radio button.\n\nWe could store our\
    \ preference as a boolean like we did for the checkbox. This would work fine for\
    \ now because either we are using the Icon view or we're not. We've done that\
    \ already. Let's do something different.\n\nLet's store the tag of the currently\
    \ selected button as the value of the preference. The tag is an int. We need to\
    \ convert it to and from an NSNumber when writing to or reading from preferences.\
    \ We create an NSNumber from an int with the class method numberWithInt:. Going\
    \ the other way, we extract the int from the NSNumber with the method intValue.\n\
    \nNow that we have a format for our preference, we can name it to communicate\
    \ what it is. Let's call it TagForView. We can register the default value in HelloApplicationAppDelegate.m\
    \ just below where we registered the default value for LoadSavedRemovedApps.\n\
    \n```\n```objective-c\n+(void)initialize {\n    NSDictionary *defaults =\n   \
    \     [NSDictionary dictionaryWithObjectsAndKeys:\n            @\"NO\", @\"LoadSavedRemovedApps\"\
    ,\n            [NSNumber numberWithInt:1], @\"TagForView\",\n            nil];\n\
    \    [[NSUserDefaults standardUserDefaults] registerDefaults:defaults];\n}\n```\n\
    ```\n\n¹ If the values of these tags are different, please change them to 1 and\
    \ 0."
