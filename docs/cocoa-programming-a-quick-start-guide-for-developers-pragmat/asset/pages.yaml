- pgno: 398
  md: "```\n```objective-c\n- (void)applicationDidFinishLaunching:(NSNotification\
    \ *)aNotification {\n    NSArray *arrayOfSpinners = [self arrayOfSpinners];\n\
    \    for (NSProgressIndicator *spinner in arrayOfSpinners) {\n        [self spin:spinner];\n\
    \    }\n}\n```\n```\n\nI’m going to size the window and place the progress indicators\
    \ so that if all were visible at once, they would look like this:\n\n![](img/9355405953264484a02198b0e3d25b7e_398_0.png)\n\
    \nTo do this, resize the window in Interface Builder so that its width is 415\
    \ and its height is 56. Create and place the progress indicators using Xcode in\
    \ the arrayOfSpinners method.\n\n```\n```objective-c\n- (NSArray *) arrayOfSpinners\
    \ {\n    NSMutableArray *array = [[NSMutableArray alloc] initWithCapacity:25];\n\
    \    for (int i = 0; i < 25; i++) {\n        NSProgressIndicator *spinner = [[NSProgressIndicator\
    \ alloc]\n                         initWithFrame:NSMakeRect(16 + i * 8, 20, 16,\
    \ 16)];\n        [spinner setStyle:NSProgressIndicatorSpinningStyle];\n      \
    \  [spinner setControlSize:NSSmallControlSize];\n        [spinner setDisplayedWhenStopped:NO];\n\
    \        [window.contentView addSubview:spinner];\n        [array addObject:spinner];\n\
    \    }\n    return array;\n}\n```\n```\n\nThe arrayOfSpinners method returns an\
    \ array filled with the progress indicators. We iterate through this array and\
    \ tell each one to start animating, sleep for one second, and then stop animating.\n\
    \n```\n```objective-c\n- (void) spin:(NSProgressIndicator *) spinner {\n    [spinner\
    \ startAnimation:self];\n    sleep(1);\n    [spinner stopAnimation:self];\n}\n\
    ```\n```\n\nClick Build & Run. The application will start up, and the progress\
    \ indicators will appear and spin one at a time. If you hover your mouse"
  merge: -1
  img_proc: true
- pgno: 399
  md: "pointer over the window, you will see the spinning beach ball. You might notice\
    \ that the window is not the active window. If you try to click the window, it\
    \ will be unresponsive.\n\n![](img/9355405953264484a02198b0e3d25b7e_399_0.png)\n\
    \nYou can also see this if you create a release version of the application and\
    \ run it as a stand-alone application. It will be reported as “not responding”\
    \ in your window for force-quitting applications.\n\n![](img/9355405953264484a02198b0e3d25b7e_399_1.png)\n\
    \nThe app is nonresponsive because its main event processing thread is blocked\
    \ waiting on the spin method to complete. We’ll fix this lack of responsiveness\
    \ with operations and queues. There are three basic types of operations. We’ll\
    \ begin with a type that allows us to turn a method call into an operation.\n\n\
    # 25.2 Invocation Operations\n\nRight now we just call the spin: method directly:\n\
    \n```\n```objc\nfor (NSProgressIndicator *spinner in arrayOfSpinners) {\n    [self\
    \ spin:spinner];\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 400
  md: "An NSInvocationOperation allows us to create an object from this method call\
    \ by specifying the method, the target for the method, and the parameter to be\
    \ passed to the method.\n\n```\n```objc\nNSInvocationOperation *op =\n    [[NSInvocationOperation\
    \ alloc] initWithTarget:self\n        selector:@selector(spin:)\n        object:spinner];\n\
    ```\n```\n\nOnce you have some sort of an operation, you add it to an operation\
    \ queue that manages the operations in it.\n\n```\n```objc\nDownload Operations/Spinner2/SpinnerAppDelegate.m\n\
    \n- (void)applicationDidFinishLaunching:(NSNotification *)aNotification {\n  \
    \  NSArray *arrayOfSpinners = [self arrayOfSpinners];\n    NSOperationQueue *queue\
    \ = [[NSOperationQueue alloc] init];\n    for (NSProgressIndicator *spinner in\
    \ arrayOfSpinners) {\n        [queue addOperation:[[NSInvocationOperation alloc]\n\
    \            initWithTarget:self\n            selector:@selector(spin:)\n    \
    \        object:spinner]];\n    }\n}\n```\n```\n\nClick Build & Run, and things\
    \ are quite a bit different.¹ All of the spinners spin at once, and you can select\
    \ the application window. There's no spinning beach ball. The window will become\
    \ the active window.\n\n![](img/9355405953264484a02198b0e3d25b7e_400_0.png)\n\n\
    So, how do we get the spinners to spin one at a time? We can cap the number operations\
    \ that can be performed concurrently. We can set this value to three and watch\
    \ three progress indicators spin at a time. As a special case, we can set this\
    \ value to one and turn the queue into a serial queue. The operations will be\
    \ performed one at a time.\n\n```\n```objc\nDownload Operations/Spinner3/SpinnerAppDelegate.m\n\
    \n- (void)applicationDidFinishLaunching:(NSNotification *)aNotification {\n  \
    \  NSArray *arrayOfSpinners = [self arrayOfSpinners];\n    NSOperationQueue *queue\
