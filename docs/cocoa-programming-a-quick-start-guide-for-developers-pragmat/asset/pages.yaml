    \ disk. You can see its bundle identifier and other identifiers. We'll start by\
    \ pulling out the name.\n\n# ## 13.2 Reading from a Dictionary\n\nThere are many\
    \ ways to read from a dictionary. You can use a key enumerator to move through\
    \ the dictionary entries in order and pick out values. You can get an array of\
    \ all the keys or all the values. We'll use the objectForKey: method:\n\n```\n\
    ```objc\n[notification.userInfo objectForKey:@\"NSApplicationName\"]\n```\n```\n\
    \nNow when we click Build & Run, we'll log the name of the applications that are\
    \ launched to the Console window. That's all there is to reading from a dictionary."
