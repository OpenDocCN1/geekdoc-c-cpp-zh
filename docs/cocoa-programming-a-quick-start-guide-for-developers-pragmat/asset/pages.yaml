- pgno: 208
  md: "# ## 12.7 Solution: Calling the Delegate Methods\n\nThis is one of those exercises\
    \ that might have taken longer to describe than actually do. Here are your changes\
    \ in `applicationDidLaunch:` and `applicationDidTerminate:`:\n\n```\n```objc\n\
    - (void) applicationDidLaunch: (NSNotification *) notification {\n    if ([self.delegate\n\
    \            respondsToSelector:@selector(applicationDidLaunch:)]) {\n       \
    \ [self.delegate applicationDidLaunch:self];\n    }\n}\n- (void) applicationDidTerminate:\
    \ (NSNotification *) notification {\n    if ([self.delegate\n            respondsToSelector:@selector(applicationDidTerminate:)])\
    \ {\n        [self.delegate applicationDidTerminate:self];\n    }\n}\n```\n```\n\
    \nYou’ll also need to import `ActivityMonitorDelegate.h` in your `CurrentApp`\
    \ header file. You could use a forward declaration in your header file and import\
    \ in your implementation file, but I know we’re going to need to move it in a\
    \ minute, so I’m placing the import in the header file.\n\n# ## 12.8 Exercise:\
    \ Cleaning Up\n\nHere’s a rule of thumb for you: if you *can* do something in\
    \ Interface Builder, then you *should* do it in Interface Builder.\n\nSure, there\
    \ are exceptions, and we’ll experiment with doing things in code that *can* be\
    \ done in IB, but you’ll go much further if you follow that principle.\n\nLet’s\
    \ apply that to our current example to do a little cleaning up. Create your `CurrentApp`\
    \ object in the nib, and set its delegate there as well. You’ll need to hold onto\
    \ this object, so let’s set an outlet in the app delegate and connect it to the\
    \ `CurrentApp` object.\n\n# ## 12.9 Solution: Cleaning Up\n\nWe can get rid of\
    \ the `awakeFromNib` method in `ActivityController.m` because we’re going to create\
    \ the object and set the delegate in the nib."
