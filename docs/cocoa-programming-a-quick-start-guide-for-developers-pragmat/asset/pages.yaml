  md: "typedef’d to be a float for code running under 32-bit and a double for code\
    \ running under 64-bit. In any case, a variable of type NSInteger is not a pointer,\
    \ so there’s no *.³\n\nThis can get confusing. An NSNumber is an object, while\
    \ an NSInteger isn’t. You need to consult the docs to see which is which. Here’s\
    \ how you might declare two variables where one is an NSNumber while the other\
    \ is an NSInteger:\n\n```\nNSNumber *income;\nNSInteger age;\n```\n\nObjective-C\
    \ also has a BOOL type for handling booleans. We tend not to do tricky and unreadable\
    \ arithmetic for logical calculations. Instead, we think of a BOOL as having one\
    \ of the values YES or NO. We’re particularly careful not to use words like *true*\
    \ or *false* when talking about booleans. We don’t want people thinking we’re\
    \ from out of town.\n\n# 5.3 Getters and Setters\n\nWe can easily get and set\
    \ the value of name inside the Greeter class. In the first highlighted line in\
    \ the following example, we are getting and printing out the value of name, and\
    \ in the second highlighted line we are setting its value:\n\nDownload `Properties/HelloWorld12/Greeter.m`\n\
    \n```\n#import \"Greeter.h\"\n\n@implementation Greeter\n-(NSString *) greeting\
    \ {\n    return [[NSString alloc] initWithFormat:@\"Hello, %@!\", name];\n}\n\
    -(id) initWithName:(NSString *) newName {\n    if (self = [super init]){\n   \
    \     name = newName;\n    }\n    return self;\n}\n-(id) init {\n    return [self\
    \ initWithName:@\"World\"];\n}\n```\n\n3. There is a great explanation of objects\
    \ and simple C structures in the answer to this Stack Overflow question http://stackoverflow.com/questions/2189212/why-object-doesomething-and-not-object-dosomething.\
    \ The answer is written by Apple engineer Bill Bumgarner who posts under his standard\
    \ username: bbum. It’s always worth seeking out his posts on Stack Overflow and\
    \ his contributions to various other lists such as the cocoa-dev list at http://lists.apple.com.\
    \ From time to time he summarises his thoughts on his blog at http://www.friday.com/bbum/."
