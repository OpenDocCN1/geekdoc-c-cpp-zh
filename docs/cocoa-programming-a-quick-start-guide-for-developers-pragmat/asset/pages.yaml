- pgno: 20
  md: 'know that those two lines probably exist. When you don’t know what to do yourself,
    you’ll know where to go to find help.


    You’ll find your favorite paths into the documentation. I tend to hold down the
    Option and Command keys (⌥ ⌘) and double-click a class name or a method name to
    view the docs for the class or method. You can also right-click or Control-click
    part of your code and get a pop-up context-sensitive help menu that can include
    refactorings, links to definitions, and other available actions. You don’t need
    to memorize these key bindings; you can always navigate to the docs using the
    Xcode menus.


    You will find great third-party web sites, and you can join the *cocoa-dev* mailing
    list that you can find at [http://lists.apple.com](http://lists.apple.com). Lurk
    first to get a feel for the list. And when you have really tried to figure out
    something for yourself, go ahead and ask a question that explains what you’ve
    done and what you don’t understand or are hoping to learn.


    # 1.5  In This Book


    There are four sections in this book. The first section is an introduction to
    Cocoa, Objective-C, and the tools. The second section takes you to a level where
    you are comfortable with the fundamental techniques of creating a Cocoa application.
    The third and fourth sections consist of material that can wait. It’s essential
    that you understand the concepts presented there, but you need to wait until you
    have some experience.


    In the first section, you’ll start to use Xcode and Interface Builder. You’ll
    get used to the rhythm of bouncing back and forth between them. We’ll start in
    Chapter *2, Using What’s There*, on page *24* with a web browser that you create
    without writing any code at all. Between there and Chapter *9, Customizing with
    Delegates*, on page *158*, you’ll master the basics of Cocoa and Objective-C.


    In this first section, you’ll learn to create and call methods and overcome any
    fear you might have of the funny-looking syntax with its square brackets and colons.
    You’ll design classes in Xcode and create objects in Xcode and in Interface Builder.
    You’ll embrace properties and the dot syntax and use automatic garbage collection
    wherever you can. You’ll learn the rules of reference counting for situations—like
    iPhone apps—when you need to manage memory manually. You’ll be introduced to the
    two fundamental patterns in Cocoa development:'
