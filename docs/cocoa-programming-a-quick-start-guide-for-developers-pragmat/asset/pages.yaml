- pgno: 114
  md: "# ### 6.9 Cleaning Up in dealloc\n\nWhen the reference count for an object\
    \ reaches zero, its `dealloc` is called. This is where you clean up the resources\
    \ used by your object. For example, in `Greeter` there are two pointers to objects\
    \ that we own: `name` and `today`. We need to send each a `release` when our `Greeter`\
    \ object is about to be destroyed. We do this by overriding the `dealloc` method:\n\
    \nDownload Memory/Flashlight16/Classes/Greeter.m\n\n```\n```objective-c\n- (void)\
    \ dealloc {\n    [name release];\n    [today release];\n    [super dealloc];\n\
    }\n```\n```\n\nNote that in the `init` method we let the superclass do its initialization\
    \ before we did our custom initialization. Here we clean our custom objects up\
    \ first and end with a call to `[super dealloc]`.\n\nYou can add this line to\
    \ your `dealloc` to output a quick message to the Console window when your `Greeter`\
    \ object is being freed.\n\n```\n```objective-c\nNSLog(@\"In Greeter dealloc.\"\
    );\n```\n```\n\nIf you are a belt and suspenders type of person and want to make\
    \ sure that there's no chance that you end up sending a message to a freed object,\
    \ then you may want to set the variables to `nil` after you release them like\
    \ this:\n\nDownload Memory/Flashlight16/Classes/Greeter.m\n\n```\n```objective-c\n\
    - (void) dealloc {\n    [name release];\n    name = nil;\n    [today release];\n\
    \    today = nil;\n    [super dealloc];\n}\n```\n```\n\nHere you are releasing\
    \ the instance variable and setting it to `nil`. You can combine these steps using\
    \ the corresponding property like this:\n\nDownload Memory/Flashlight16/Classes/Greeter.m\n\
    \n```\n```objective-c\n- (void) dealloc {\n    self.name = nil;\n    self.today\
    \ = nil;\n    [super dealloc];\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 115
  md: "As you'll see in the next section, self.name = nil will both release name and\
    \ set it to nil.⁶\n\n# 6.10 Retain and Release in a Setter\n\nHere's an example\
    \ of the retain-release pattern you'll use when changing the value of an object.⁷\
    \ Suppose you already have created an object named greeter of type Greeter. An\
    \ idiomatic setGreeter method using the retain-release pattern would look something\
    \ like this:\n\n```\n- (void) setGreeter: (Greeter *) newGreeter {\n    if (newGreeter\
    \ != greeter) {\n        [newGreeter retain];\n        [greeter release];\n  \
    \      greeter = newGreeter;\n    }\n}\n```\n\nYou are being sent the object newGreeter.\
    \ You want to own it to do something with it, so it is your job to retain it.\
    \ On the other hand, you are about to set the variable greeter to point to the\
    \ object referenced by newGreeter.\n\nFirst, check to make sure the pointers aren't\
    \ pointing at the same memory location. If they are, then there is nothing to\
    \ do. If not, then go ahead and set greeter to now point to the object referenced\
    \ by newGreeter.\n\nYou are going to need to hold on to the object that newGreeter\
    \ points to, so you send it a retain message. On the other hand, you don't need\
    \ the object that greeter points to anymore, so you release it. Now you set greeter\
    \ to point to what newGreeter points to. Even though you are never going to use\
    \ the variable newGreeter again, you are going to use what it pointed to. This\
    \ whole retain-release cycle was retaining and releasing what the variables point\
    \ to and not the variables themselves.\n\nThis retain-release method of memory\
    \ management does have parallels in everyday life. For example, the conference\
    \ hotel where I wanted to stay was completely booked. They put me on the waiting\
    \ list, and I\n\n> 6. There are potential consequences that could come up if you\
    \ are using Key Value Observing and someone else is still registered to listen\
    \ to changes in the object being released and set to nil. I tend to just send\
    \ the variable the release message in dealloc and leave it at that.\n\n> 7. You\
    \ saw this briefly when we were looking at property memory attributes in the previous\
    \ chapter. This version is slightly different, and now you better understand the\
    \ retain-release cycle."
