    #import <Cocoa/Cocoa.h>\n\n@interface WindowHelper : NSObject <NSWindowDelegate>\
    \ {\n}\n@end\n```\n```\n\nIf you check the docs for the NSWindowDelegate protocol,\
    \ you’ll see that all of the methods are listed as optional. In other words, you\
    \ are free to implement only the ones you need.\n\nThere are only two delegate\
    \ methods that have anything to do with a window closing. There’s windowShouldClose:\
    \ and windowWillClose:. The windowShouldClose: method is called when the user\
    \ clicks the red button and gives you an opportunity to say “Don’t close the window.”\
    \ The windowWillClose: method is called just before the window closes. That’s\
    \ too late for our needs.\n\nWe’ll use the windowShouldClose: method. Because\
    \ it’s so easy to introduce types that are hard to detect and debug, I often go\
    \ to the docs and cut and paste the method signature.\n\nThe windowShouldClose:\
    \ method needs to do two things. It has to set the window’s background color to\
    \ red. This time, the sender is the window, so we can just tell the sender to\
    \ set its background color to red.\n\nThe method also has to return NO so that\
    \ the window doesn’t close. If you return YES, the window will close. Here’s WindowHelper.m:\n\
    \nDownload Delegates/WindowDressing2/WindowHelper.m\n\n```\n```objc\n#import \"\
    WindowHelper.h\"\n\n@implementation WindowHelper\n- (BOOL)windowShouldClose:(id)sender\
    \ {\n    [sender setBackgroundColor:[NSColor redColor]];\n    return NO;\n}\n\n\
    @end\n```\n```"
