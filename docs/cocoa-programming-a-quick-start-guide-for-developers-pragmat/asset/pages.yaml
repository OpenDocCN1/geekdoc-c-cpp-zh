  md: "Download KVO/Counter9/Observer.m\n\n```\n```objc\n#import \"Observer.h\"\n\n\
    @implementation Observer\n\n@synthesize targetObject, targetAction;\n\n- (void)observeValueForKeyPath:(NSString\
    \ *)keyPath\n        ofObject:(id)object\n          change:(NSDictionary *)change\n\
    \         context:(void *)context {\n    [self.targetObject performSelector:self.targetAction\n\
    \                            withObject:[object valueForKeyPath:keyPath]];\n}\n\
    \n- (id)initWithTarget:(id)object action:(SEL)action {\n    if (self = [super\
    \ init]) {\n        self.targetObject = object;\n        self.targetAction = action;\n\
    \    }\n    return self;\n}\n@end\n```\n```\n\nNow our Display class can be simplified.\
    \ Declare the instance variables observerOne and observerTwo of type Observer\
    \ in the Display header file:\n\nDownload KVO/Counter9/Display.h\n\n```\n```objc\n\
    #import <Cocoa/Cocoa.h>\n@class UpOrDown;\n@class Observer;\n\n@interface Display\
    \ : NSObject {\n    IBOutlet NSTextField *displayFieldOne, *displayFieldTwo;\n\
    \    IBOutlet UpOrDown *counter;\n    Observer *observerOne, *observerTwo;\n}\n\
    @end\n```\n```\n\nRegister the new observers in awakeFromNib. Remove the observeValueForKeyPath:ofObject:change:context:\
    \ method. It’s now implemented in the observer. Release the observers in the finalize\
    \ method.\n\nDownload KVO/Counter9/Display.m\n\n```\n```objc\n#import \"Display.h\"\
    \n#import \"Observer.h\"\n\n@implementation Display\n\n- (void) updateDisplayOne:\
    \ (NSNumber *) newValue {\n    [displayFieldOne setIntegerValue:[newValue integerValue]];\n\
    }\n```\n```"
