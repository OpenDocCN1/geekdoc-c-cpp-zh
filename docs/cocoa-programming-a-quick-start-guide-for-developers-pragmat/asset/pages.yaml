- pgno: 135
  md: 'from NSControl : NSView : NSResponder : NSObject. This sends you up the inheritance
    tree. You check NSControl, and there’s nothing there, so you move on to NSView.


    Scanning through the tasks, there’s a Hiding Views heading, and one of the methods
    is setHidden:. We could also have decided to remove the button entirely using
    this:


    ```

    ~~~objc

    [sender removeFromSuperview];

    ~~~

    ```


    From the user’s point of view, there is no difference between these two approaches;
    however, there is an important difference between these two from a memory standpoint.
    When we dragged the button onto the window in Interface Builder, the button’s
    superview (the window’s content view) owned the button and increased its reference
    count by one. If we hide the button, it still exists; it’s just not visible. If,
    on the other hand, we remove the button from its superview, then the only object
    that ever owned the button will now release the button, and the button will be
    freed.


    Neither approach is right or wrong. You need to decide in your situation whether
    you are done with the button and want to release it.


