- pgno: 391
  md: "Isn’t that nice? If I didn’t have to shorten the lines to fit in this book,\
    \ we’d have the entire array transformation on a single line.\n\n# 24.7 Using\
    \ `__block`\n\nWe are going to push this example in several different directions\
    \ to explore variables. In this section, let’s create a new method named `squareElementsIn:`\
    \ to return an array containing the square of each element in the original array.\n\
    \n```\n```objective-c\n- (NSArray *) squareElementsIn:(NSArray *) originalArray\
    \ {\n    NSMutableArray *tempArray =\n    [[NSMutableArray alloc] initWithCapacity:[originalArray\
    \ count]];\n    [originalArray enumerateObjectsUsingBlock:\n        ^(id obj,\
    \ NSUInteger idx, BOOL *stop) {\n            [tempArray addObject:multiply(obj,\
    \ [obj intValue])];\n        }];\n    return tempArray;\n}\n```\n```\n\nCall this\
    \ method in `applicationDidFinishLaunching:`, and display the results. When you\
    \ click Build & Run, everything runs fine, and you should get an array containing\
    \ the squares of the original array.\n\nNow, introduce a temporary variable for\
    \ `[obj integerValue]` outside the block so you can see what can go wrong.\n\n\
    ```\n```objective-c\n- (NSArray *) squareElementsIn:(NSArray *) originalArray\
    \ {\n    NSMutableArray *tempArray =\n    [[NSMutableArray alloc] initWithCapacity:[originalArray\
    \ count]];\n    NSInteger multiplier;\n    [originalArray enumerateObjectsUsingBlock:\n\
    \        ^(id obj, NSUInteger idx, BOOL *stop) {\n            multiplier = [obj\
    \ intValue];\n            [tempArray addObject:multiply(obj, multiplier)];\n \
    \       }];\n    return tempArray;\n}\n```\n```\n\nThis won’t even compile. We’ve\
    \ declared an NSInteger outside the block and tried to update it. The error message\
    \ is “Assignment of read-only variable ‘multiplier’.” We could have avoided this\
    \ problem by declaring the variable inside the block, but the point is for us\
    \ to understand why multiplier is read-only."
  merge: -1
  img_proc: true
- pgno: 392
  md: "This is a very important point. When you enter the block, the runtime takes\
    \ a snapshot of the accessible variables at that time. That’s how we were able\
    \ to use the multiplicand variable in the block we used back in Section 24.4,\
    \ *Capturing Values*, on page 387. Unless you indicate otherwise, these variables\
    \ are treated as if they were constants—code in the block can read their values\
    \ but not alter them. This helps with performance and multithreading.\n\nMore\
    \ precisely, when we enter the block, execution passes over to the block literal.\
    \ Nonobject types have their values set at that point. If instead of an NSInteger,\
    \ multiplier was an object, then the object the variable points to would be mutable\
    \ by the block.\n\nSo, how do you indicate otherwise? If you need the block to\
    \ change the value of a nonobject variable that is declared outside the block,\
    \ then you need to use __block when you declare the variable.³ With this single\
    \ change, the application now builds and runs fine.\n\n```\n```objective-c\n-(NSArray\
    \ *) squareElementsIn:(NSArray *) originalArray {\n    NSMutableArray *tempArray\
    \ =\n    [[NSMutableArray alloc] initWithCapacity:[originalArray count]];\n  \
    \  __block NSInteger multiplier;\n    [originalArray enumerateObjectsUsingBlock:\n\
    \       ^(id obj, NSUInteger idx, BOOL *stop) {\n           multiplier += [obj\
    \ value];\n           [tempArray addObject:multiply(obj,multiplier)];\n      \
    \ }];\n    return tempArray;\n}\n```\n```\n\nThere are a lot of subtleties with\
    \ blocks and variables. You should definitely read Apple’s *Blocks Programming\
    \ Topics* [App09b], particularly the section titled “Blocks and Variables.”\n\n\
    # 24.8 Cleaning Up with typedef\n\nLet’s declare a second block named add with\
    \ the same signature as multiply. Declare it to be a property and synthesize it.\
    \ We aren’t going to use this block; I’m only introducing it to show you a way\
    \ to clean up your declarations.\n\n³. That is two underscores followed by the\
    \ word block."
  merge: -1
  img_proc: true
- pgno: 393
  md: "Download Blocks/CollectionCalc6/CollectionCalcAppDelegate.h\n\n```\n```objc\n\
    #import <Cocoa/Cocoa.h>\n\n@interface CollectionCalcAppDelegate : NSObject <NSApplicationDelegate>\
    \ {\n    NSNumber *(*multiply)(NSNumber *, NSInteger);\n    NSNumber *(*add)(NSNumber\
    \ *, NSInteger);\n}\n@property(copy) NSNumber *(*multiply)(NSNumber *, NSInteger);\n\
    @property(copy) NSNumber *(*add)(NSNumber *, NSInteger);\n@end\n```\n```\n\nThe\
    \ add and multiply blocks have the same type—they both take an NSNumber and an\
    \ NSInteger and return an NSNumber. Let's formalize that concept by using typedef\
    \ to define this new type that we'll call ArithmeticOperation.\n\nDownload Blocks/CollectionCalc7/CollectionCalcAppDelegate.h\n\
    \n```\n```objc\n#import <Cocoa/Cocoa.h>\n\ntypedef NSNumber *(*ArithmeticOperation)(NSNumber\
    \ *, NSInteger);\n\n@interface CollectionCalcAppDelegate : NSObject <NSApplicationDelegate>\
    \ {\n    ArithmeticOperation multiply;\n    ArithmeticOperation add;\n}\n@property(copy)\
    \ ArithmeticOperation multiply;\n@property(copy) ArithmeticOperation add;\n@end\n\
    ```\n```\n\nThere are positives and negatives to this approach. On the plus side,\
    \ you can certainly see that the code is much cleaner. On the negative side, it\
    \ can be a pain in larger programs for people to locate the typedefs and figure\
    \ out what is going on underneath.\n\n# ## 24.9 Exercise: Using Blocks in Callbacks\n\
    \nLet's round out this introduction to blocks with an example of a callback. Our\
    \ application will listen for all notifications issued from the notification center\
    \ and log them to the Console. We need to send a message to the notification center\
    \ and specify the object and method that should be called by the notification\
    \ center whenever this type of notification is posted. Once we've set this up\
    \ in the traditional way, you'll replace the callback mechanism with a block."
  merge: -1
  img_proc: true
- pgno: 394
  md: "Create a new Cocoa application that doesn’t use Core Data. Name it Callback,\
    \ and change the CallbackAppDelegate.m file to this:\n\n```\nDownload Blocks/Callback/CallbackAppDelegate.m\n\
    \n#import \"CallbackAppDelegate.h\"\n\n@implementation CallbackAppDelegate\n\n\
    @synthesize window;\n\n-(void) response:(NSNotification *) notification {\n  \
    \  NSLog(@\"Received: %@\", [notification name]);\n}\n\n-(void) registerWithoutBlocks\
    \ {\n    [[NSNotificationCenter defaultCenter]\n                         addObserver:self\n\
    \                         selector:@selector(response:)\n                    \
    \     name:nil\n                         object:nil];\n}\n\n-(void)applicationDidFinishLaunching:(NSNotification\
    \ *)aNotification {\n    [self registerWithoutBlocks];\n}\n@end\n```\n\nLook at\
    \ the registerWithoutBlocks method where we register to receive notifications.\
    \ In this case, we pass in nil for the notification name to receive every notification.\
    \ We also specify which object is to be notified and which method will be called\
    \ back when the notification is received.\n\nYou can see that the callback method\
    \ response: doesn’t do very much.\n\nThe Snow Leopard APIs adds a new method for\
    \ registering a block to receive notifications. You eliminate the need for the\
    \ callback method by passing in what you want done when the notification is received\
    \ as a block. This one method combines both the registration for notifications\
    \ and the callback.\n\n```\naddObserverForName:(NSString *)name\n            \
    \     object:(id)obj\n                  queue:(NSOperationQueue *)queue\n    \
    \       usingBlock:(void (^)(NSNotification *arg1))block\n```\n\nRevise CallbackAppDelegate.m\
    \ to use this method and a block.\n\n4. I do find it a bit disturbing that we\
    \ just have to know that the callback method needs to accept a single parameter\
    \ of type NSNotification. You’ll see that this requirement is clearer in the blocks\
    \ version."
  merge: -1
  img_proc: true
- pgno: 395
  md: "# ## 24.10  Solution: Using Blocks in Callbacks\n\nYou can eliminate the response:\
    \ method and replace the registerWithout-Blocks method with this method:\n\n```\n\
    ```objc\n// Download Blocks/Callback2/CallbackAppDelegate.m\n-(void)registerWithBlocks\
    \ {\n    [[NSNotificationCenter defaultCenter]\n                   addObserverForName:nil\n\
    \                              object:nil\n                               queue:nil\n\
    \                          usingBlock:^(NSNotification *notification) {\n    \
    \                          NSLog(@\"Received: %@\", [notification name]);\n  \
    \                        }];\n}\n```\n```\n\nThe body of the block is the body\
    \ of the old response. For clarity, I've changed the name of the NSNotification\
    \ from arg1 to notification. One advantage of using blocks is that you are expressing\
    \ what needs to be done where it needs to be done. Your logic isn't split all\
    \ over the place.\n\nClick Build & Run, and your Console should be filled with\
    \ notifications like these:\n\n```\n```text\nReceived: NSMenuDidChangeItemNotification.\n\
    Received: NSWindowDidBecomeKeyNotification.\nReceived: NSWindowDidBecomeMainNotification.\n\
    ```\n```\n\nThere is a big problem with this code. The problem isn't block-specific,\
    \ but it trips people up enough that we should talk a bit about it. After a few\
    \ seconds, the notifications stop. Even if you resize the application window,\
    \ you won't see an NSWindowDidResizeNotification or other related event notifications.\n\
    \nYou may remember this problem from when we worked with KVO. With automatic garbage\
    \ collection, we have to explicitly hold on to the observer, or it is garbage\
    \ collected, and there is no object there to receive the notification. Add an\
    \ instance variable to the header file.\n\n```\n```objc\n// Download Blocks/Callback3/CallbackAppDelegate.h\n\
    #import <Cocoa/Cocoa.h>\n@interface CallbackAppDelegate : NSObject <NSApplicationDelegate>\
    \ {\n    NSWindow *window;\n    NSObject *observer;\n}\n@property (assign) IBOutlet\
    \ NSWindow *window;\n@end\n```\n```"
  merge: -1
  img_proc: true
- pgno: 396
  md: "Set observer to be the object returned when we register to listen for notifications\
    \ and retain this object.\n\nDownload Blocks/Collection3/CallBackAppDelegate.m\n\
    \n```\n    -(void)registerWithBlocks {\n        observer = [[NSNotificationCenter\
    \ defaultCenter]\n                    addObserverForName:nil object:nil queue:nil\n\
    \                    usingBlock:^(NSNotification *notification) {\n          \
    \              NSLog(@\"Received: %@.\", [notification name]);\n             \
    \       }] retain];\n    }\n```\n\nNow everything works perfectly. Notifications\
    \ are sent and received until we quit the application.\n\nBlocks turn the way\
    \ you think about code on its head. Instead of passing a lot of parameters to\
    \ a method that knows what to do with them, you are passing in an action to the\
    \ object along with a snapshot of some of the data that needs to be acted upon.\
    \ With practice, you'll get a feel for whether you are in a situation that would\
    \ benefit from blocks.\n\nThere is a lot of good online material on blocks. BBum\
    \ has an essential series of posts that you should read on his weblog-o-mat. In\
    \ particular, read Basic Blocks⁴ and Blocks Tips & Tricks.⁶ Mike Ash posted two\
    \ very good entries in his Friday Q&A series on blocks.⁷,⁸ Joachim Bengtsson has\
    \ an online introduction to blocks,⁹ and Drew McCormack wrote an excellent guide\
    \ to “10 Uses for Blocks” in his Cocoa for Scientists series.¹⁰\n\nIn this chapter,\
    \ you got a feel for various ways to use blocks when you need to wrap some behavior,\
    \ use a callback, or work with collections. Next we'll look at concurrency and\
    \ how blocks are built to make your code perform better.\n\n+   5. http://www.friday.com/bbum/2009/08/29/basic-blocks/\n\
    +   6. http://www.friday.com/bbum/2009/08/29/blocks-tips-tricks/\n+   7. http://mikeash.com/pyblog/friday-qa-2008-12-26.html\n\
    +   8. http://mikeash.com/pyblog/friday-qa-2009-08-14-practical-blocks.html\n\
    +   9. http://thundergod.eu/pwcblocks/\n+   10. http://www.macresearch.org/cocoa-scientists-xxii-10-uses-blocks-cocoa-objective-c"
