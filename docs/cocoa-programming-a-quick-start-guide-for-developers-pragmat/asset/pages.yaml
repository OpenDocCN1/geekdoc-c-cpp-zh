  md: "Here is the HelloWorldAppDelegate.m file that results:\n\n```\nDownload Classes/HelloWorld/HelloWorldAppDelegate.m\n\
    \n```objc\n#import \"HelloWorldAppDelegate.h\"\n@implementation HelloWorldAppDelegate\n\
    @synthesize window;\n\n-(void)createLabel {\n    NSRect labelFrame = NSMakeRect(20,\
    \ 20, 540, 50);\n    NSTextField *label = [[NSTextField alloc] initWithFrame:labelFrame];\n\
    \    [label setStringValue:@\"Hello, World!\"];\n    [[self.window contentView]\
    \ addSubview:label];\n}\n-(void)applicationDidFinishLaunching:(NSNotification\
    \ *)aNotification {\n    [self createLabel];\n}\n@end\n```\n```\n\nNow applicationDidFinishLaunching:\
    \ is nice and clean. It consists only of a call to createLabel. Four quick notes:\n\
    \n+   - There is no reason that createLabel had to be a method. I could have chosen\
    \ during the refactoring to make it an ordinary C function.\n+   - Remember that\
    \ we call methods by sending messages to objects. In this case, the target of\
