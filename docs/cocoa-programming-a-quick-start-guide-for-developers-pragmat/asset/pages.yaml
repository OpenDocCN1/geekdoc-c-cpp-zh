- pgno: 58
  md: 'The web view receives this message and prepares to load a new web page. First
    it needs to get the string containing the URL from somewhere. As a result of the
    message it just received, it knows from where. The WebView object sends a message
    back to the object sending the takeStringURLFrom: message asking for its string
    value.


    ![](img/9355405953264484a02198b0e3d25b7e_58_0.png)


    The WebView object sends this message:


    ```

    [sender stringValue]

    ```


    The web view sends a message back to the object sending the takeString-URLFrom:
    message asking for its string value. The sender is a valid object, and we assume
    its type is such that it will respond to the stringValue message, but the compiler
    can’t check this for us. We can’t know the type of the sender at compile time,
    and yet everything works fine at runtime.


    The web view then tries to load the URL provided as a string in response to this
    message.


