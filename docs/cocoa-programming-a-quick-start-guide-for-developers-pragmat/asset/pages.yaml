  md: "We could just regenerate the list each time an application launches or terminates\
    \ from NSWorkspace’s runningApplications array. My goal here, though, is to show\
    \ you how to add to and remove from the underlying data source of a table view\
    \ and then update the view.\n\nYou already have delegate methods that respond\
    \ when an application is launched or terminates. Implement one to add the launching\
    \ application to the bottom of the table view by adding an entry to the end of\
    \ runningApps and updating the table view. Similarly, implement the other to remove\
    \ the terminating application from the table view by removing the appropriate\
    \ entry from runningApps and updating the table view.\n\n# ## 16.10 Solution:\
    \ Adding and Removing Rows\n\nWe are going to need to contact the table view from\
    \ our ActivityController. Add an outlet to the header file:\n\nDownload Tables/HelloApplication35/ActivityController.h\n\
    \n```\n```objective-c\n#import <Cocoa/Cocoa.h>\n#import \"ActivityMonitorDelegate.h\"\
    \n\n@interface ActivityController : NSViewController <ActivityMonitorDelegate,\n\
    NSTableViewDelegate, NSTableViewDataSource> {\n    NSMutableArray *runningApps;\n\
    \    NSTableView *table;\n}\n@property(retain) NSMutableArray *runningApps;\n\
    @property IBOutlet NSTableView *table;\n@end\n```\n```\n\nIn Interface Builder,\
    \ connect this outlet to your table view.\n\nBack in Xcode, you should have added\
    \ these two methods to your implementation file for ActivityController. Then add\
    \ and remove the appropriate entry to the runningApps array, and tell the table\
    \ view to reload.^5\n\nDownload Tables/HelloApplication35/ActivityController.m\n\
    \n```\n```objective-c\n- (void) applicationDidLaunch: (NSRunningApplication *)\
    \ app {\n    [self.runningApps addObject:app];\n    [self.table reloadData];\n\
    }\n```\n```\n\n5. Also, you should remember that every time we add a property\
    \ in a header file that you need to synthesize it in the corresponding implementation\
    \ file."
