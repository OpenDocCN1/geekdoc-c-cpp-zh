  md: "# Joe Asks…\n\n# Do I Have to Follow These Naming Conventions?\n\nYes. It’s\
    \ important to follow these naming conventions because they will enable a lot\
    \ of the magic that you’ll see before long. These are just conventions—the compiler\
    \ doesn’t enforce these names, but it is *very* important that you follow them.\n\
    \n```\n```objc\n-(NSString *)description {\n    return [[NSString alloc] initWithFormat:@\"\
    name: %@ \\\\n created: %@\",\n           name, [NSDate date]];\n}\n@end\n```\n\
    ```\n\nIf we wanted to allow other objects to get and set the value of name, we\
    \ would declare a getter and setter in the Greeter header file and implement them\
    \ in the implementation file.\n\nThe getter is an instance method that returns\
    \ the current value of the name instance variable, so the return type must be\
    \ NSString *. The getter doesn’t take any parameters. The only thing left to worry\
    \ about is what to call it. In Objective-C the getter for the property xyz is\
    \ also named xyz. You don’t insert *get* into the name at all.\n\nThe setter is\
    \ also an instance method. It doesn’t return anything, but it needs to take the\
    \ new value of name as an NSString * that we’ll call name. As for the method name,\
    \ in Objective-C the setter for the property xyz is named setXyz. In other words,\
    \ you start the name with *set* and follow it with the variable name with the\
    \ first letter converted to uppercase.\n\nAdd these declarations for the accessors\
    \ to your header file:\n\nDownload PropertiesHelloWorld13/Greeter.h\n\n```\n```objc\n\
    #import <Cocoa/Cocoa.h>\n\n@interface Greeter : NSObject {\n    NSString *name;\n\
    }\n-(NSString *) greeting;\n-(id) initWithName:(NSString *)name;\n-(NSString *)\
    \ name;\n-(void) setName:(NSString *) name;\n@end\n```\n```"
