  md: "Synthesize the sort descriptor and initialize to key off the chapterNumber\
    \ attribute by implementing the app delegate’s applicationDidFinishLaunching:\
    \ method like this:\n\nDownload CodeData/CDBookshelf1/CDBookshelf_AppDelegate.m\n\
    \n```\n```objective-c\n@synthesize window, sortDescriptors;\n\n- (void)applicationDidFinishLaunching:\
    \ (NSNotification *) notification {\n    self.sortDescriptors = [NSArray arrayWithObject:\n\
    \        [[NSSortDescriptor alloc] initWithKey:@\"chapterNumber\"\n          \
    \  ascending:YES]];\n}\n```\n```\n\nNow that we’ve created and initialized the\
    \ sortDescriptors, we can bind the Chapter Controller’s sort descriptors to it:\n\
    \n![](img/9355405953264484a02198b0e3d25b7e_366_0.png)\n\nClick Build & Run, and\
    \ now the chapters remain ordered according to their chapter number from launch\
    \ time to quit time.\n\nIn this chapter, I’ve described how you work with Core\
    \ Data in apps that target Mac OS X. Remember that we don’t have bindings yet\
    \ in iPhone OS, so the details of how you work with Core Data are a little bit\
    \ different. You still define your data in the same way, but you fetch the data\
    \ a bit differently.\n\nThere’s no way to completely cover Core Data in a chapter\
    \ or two. Marcus Zarra’s *Core Data* [Zar09] book looks at some of the more advanced\
    \ ideas. You should also look at Apple’s *Introduction to Core Data Programming*\
    \ [App09d].\n\nMuch of the code you will need or want to write will fit nicely\
    \ into the controller layer or into your app delegate. There are times, however,\
    \ when you’d really like to make changes or additions to a class that represents\
    \ an entity. In the next chapter, you’ll learn a technique that makes it easier\
    \ to make changes to classes outside of the class itself using a powerful technique\
    \ called *categories*."
