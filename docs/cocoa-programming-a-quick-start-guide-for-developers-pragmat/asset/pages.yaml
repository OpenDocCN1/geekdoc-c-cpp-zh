- pgno: 165
  md: 'Notice that your app delegate header file has the protocol declaration `NSApplicationDelegate`
    included, and the delegate outlet is connected in Interface Builder from your
    application to the app delegate.


    If you check the NSApplicationDelegate docs, you’ll find methods that help you
    specialize your application’s behavior at dozens of different key points in your
    application’s life. There are delegate methods that deal with launching and terminating
    the app, hiding the app, managing its windows, and so on.


    Delegates are an important design pattern for Cocoa applications. You’ll mainly
    find them in the modern Cocoa desktop APIs like WebKit. You’ll also find delegates
    used throughout the iPhone APIs.


    # ### 9.7 Delegates for Your Web View


    During the rest of the chapter, we’ll apply what we’ve learned about delegates
    to our SimpleBrowser example. Let’s close the WindowDressing project and reopen
    our SimpleBrowser project.


    In object-oriented programming, if you want to change the behavior of a class,
    you often create a subclass and override one or more methods. Delegation allows
    us to avoid creating inheritance chains every time we want to modify something
    in a base class. With delegation, we identify the methods that will most often
    need to be changed, label them delegate methods, and provide default behavior
    that will be executed unless we provide a delegate and implement that method with
    custom behavior.


    An object of type NSWindow can specify a single delegate object. That is the way
    delegates usually work in Cocoa. Sometimes, though, you’ll have a class with multiple
    delegates. For example, the WebView class designers looked at all of the behavior
    that you might want to customize and grouped them into four delegates.


    These four delegates are listed in the overview section of the WebView class reference:


    +   - WebFrameLoadDelegate

    +   - WebPolicyDelegate

    +   - WebResourceLoadDelegate

    +   - WebUIDelegate'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'You can think of our WebView back on our Cocoa game show, but this time it
    can choose to call one of four friends depending on which category the question
    is in.


    These four Delegate collections are protocols and not classes. They specify the
    method signatures that can be used by a class implementing the protocol. This
    ensures that when a message is sent to the delegate object, the corresponding
    method will be called. This also means that the compiler can let you know whether
    there’s a problem.


    Look in the “Tasks” section of the WebView docs under “Getting and Setting Delegates,”
    and you will see ten methods for assigning and working with delegates. You can
    set delegates using outlets in Interface Builder, or you can set them programmatically
    using a method like setUIDelegate:.


    # ### 9.8 Setting the Window Title


    Next let’s update the browser window’s title bar with the title of the page you’re
    loading. We’ll use the webView:didReceiveTitle:forFrame: method in the WebFrameLoadDelegate.


    Which object should be our delegate? We can either create a new class and instantiate
    it or use an instance of an existing class. In this case, the BrowserController
    object that we’ve already created is the best choice because it has connections
    to the GUI elements we need to access. Connect the delegate to our controller
    in Interface Builder like this:


    ![](img/9355405953264484a02198b0e3d25b7e_166_0.png)


    Select the web view, and open the Connections inspector. You should see the four
    delegate methods mixed in with the other outlets. Drag to connect frameLoadDelegate
    to your BrowserController. Save your work. We’ll head back to Xcode to finish
    up.'
