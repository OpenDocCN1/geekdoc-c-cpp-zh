  md: "# 18.5 Eliminating Magic Numbers\n\nI’m going to take a brief side trip for\
    \ those of you disturbed by the use of a magic number in our solution. Make a\
    \ copy of your project because we’re going to return to this stage of the code\
    \ in the next section. You can safely skip this section and pick up the story\
    \ in the next section.\n\nThe problem is the use of the number 1 here:\n\n```\n\
    ```objective-c\nDownload: ChangingViews/HelloApplication42/MyWindowController.m\n\
    -(BOOL)shouldLoadIconView{\n    return (1 == [[NSUserDefaults standardUserDefaults]\n\
    \                 objectForKey:@\"TagForView\"] intValue]);\n}\n```\n```\n\nThe\
    \ 1 is a magic number that is tied to the tag of our radio buttons used to select\
    \ which view to load. You can place #define ICON_VIEW_ID 1 just below @implementation\
    \ and use ICON_VIEW_ID in place of 1. That certainly makes the intent of the code\
    \ clearer to other developers. You can also declare and define a public constant\
    \ in the application delegate.\n\nLet’s create and use a property list named Views:\n\
    \n```\n```xml\nDownload: ChangingViews/HelloApplication42/Views\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\"\
    \n\"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">\n<plist version=\"1.0\"\
    >\n<array>\n    <dict>\n        <key>class</key>\n        <string>ActivityController</string>\n\
    \        <key>nib</key>\n        <string>ActivityView</string>\n    </dict>\n\
    \    <dict>\n        <key>class</key>\n        <string>IconViewController</string>\n\
    \        <key>nib</key>\n        <string>IconView</string>\n    </dict>\n</array>\n\
    </plist>\n```\n```\n\nThis is short enough to enter by hand. It is an array of\
    \ dictionaries. The dictionary at index 0 represents the table view, and the dictionary\
    \ at index 1 represents the Icon view. If we add more views, then we would just\
    \ add entries to this array. Each dictionary has a string with key “class” whose\
    \ corresponding value is the class name of the view"
  merge: -1
