    # ## 22.9 Exercise: Enabling Author Addition and Removal


    Add an Author Controller to your nib file. It should connect to the managed object
    context and work with Author entities associated with the selected book. Connect
    and bind the visual elements to the Author Controller much as you did for the
    Chapter Controller.[^7]


    Click Build & Run. Without writing any code, you have a fully functional app that
    allows you to add and remove book titles and their chapter titles. Your buttons
    will be enabled or disabled appropriately, and the information will be saved to
    and retrieved from disk. We’ve got Undo for free. Add some books and their corresponding
    chapters. Now use Edit > Undo or ⌘Z, and you can undo your work one step at a
    time.


    # ## 22.10 Sorting


    You might have noticed that there’s a slight problem—if you quit and restart the
    application, add a chapter entry, or just move from book to book, the chapter
    order may change. The reason is that the content sets are sets. In other words,
    there is no built-in order. You can enter the chapters for a book in order, but
    there’s no way to guarantee they will come up in that same order the next time
    you select the book or restart the app. There has been discussion on the Apple
    cocoa-dev list about this over the years.[^8] People like Tim Isted[^9] and Brian
    Webster[^10] have created useful workarounds that are beyond the scope of this
    book.


    We’ll take a simpler approach and create another attribute to store the chapter
    numbers and allow the chapter table to be sorted on this list. Before we start,
    delete the CDBookshelf directory from Application Support.


    +   [^7]: You can find the solution in CDBookshelf3 in the code download.

    +   [^8]: For example, see this thread: http://www.cocoabuilder.com/archive/message/cocoa/2005/6/14/138793.

    +   [^9]: http://www.fimisted.net/blog/archive/core-data-drag-drop/.

    +   [^10]: http://www.fatcastfoware.com/blog/2008/12/26/per-objected-relationships-using-core-data.'
