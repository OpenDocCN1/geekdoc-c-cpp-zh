- pgno: 123
  md: '# ## Chapter 7


    # # Outlets and Actions


    Cocoa programming separates the application logic from the look and feel using
    Model-View-Controller (MVC). For the model, we''ll create the application logic
    in Objective-C using Xcode. You''ve already seen how to create the view using
    Interface Builder.


    The controller is the bridge between the model and the view. When the user clicks
    a button or types in a text field or does anything to the view, the controller
    responds to these actions often by sending messages on to the model. Similarly,
    when the model changes, the controller updates the view so that the changes are
    visible to the user.


    The controller has to have a foot in each world. There is a class file that you
    use to create methods and send messages to the model or the view. We''ll create
    an instance of the controller class in Interface Builder. This gives us a visual
    representation of the controller that lives in a nib that you use to wire the
    controller''s code to the visual components you create in IB. It''s sort of like
    having the real version of the controller living in code and its avatar living
    in IB.


    You''ll create a controller for our Simple Browser in the next chapter. In this
    chapter, we''re going to look at how you communicate from these GUI elements created
    in Interface Builder to your code and how your code can make changes in the GUI.
    Once you have a feel for these actions and outlets, you will find yourself using
    them all the time.¹


    1. Although we''re starting with this simple view of outlets and actions, we''ll
    use them in more sophisticated ways as we progress.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# 7.1  The Big Picture


    Imagine we have a window with a button and a text field. When the user clicks
    the button, we will display “Hello, World!” in the text field. We need a way to
    connect our button to code so that when the button is clicked, a method will be
    called in our code to do the work for us. We also need some connection back to
    the text field so we can set its text to “Hello, World!”


    There are basically two ways in which the controller connects to UI elements:


    +   - **Actions:** Controller methods used when an element such as a button wants
    to initiate an action performed by the controller

    +   - **Outlets:** Controller instance variables that point to the UI elements
    the controller needs to send messages to


    Actions and outlets are specifically designed for connections created in Interface
    Builder. Here’s a look at the basic flow.


    ![](img/9355405953264484a02198b0e3d25b7e_124_0.png)


    When a user clicks a button, a message is sent to a specified target to initiate
    a specific action. You create this target action in a controller, and you make
    the connection in Interface Builder. The action is just a method that will get
    called when the button is clicked.


    There are times the controller is going to need to communicate with an object
    you created using IB. One way is to give the controller a handle to the object.
    Imagine that our controller has an outlet that is a text field. In other words,
    the controller has an instance variable that points to the text field. Just like
    a wall socket, the outlet is a place in the controller where the visual element
    plugs into.


    # 7.2  Using an Outlet


    Create a new project using the Cocoa Application template with all checkboxes
    unselected, and call it HelloWorldPro.'
