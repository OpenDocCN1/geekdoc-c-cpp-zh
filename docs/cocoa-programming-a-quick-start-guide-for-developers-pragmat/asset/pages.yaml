  md: "```\n```objc\n-(void)awakeFromNib{\n    [self addObserver:self\n          \
    \ forKeyPath:@\"totalCount\"\n              options:NSKeyValueObservingOptionNew\n\
    \              context:NULL];\n}\n-(void)observeValueForKeyPath:(NSString *)keyPath\n\
    \                     ofObject:(id)object\n                       change:(NSDictionary\
    \ *)change\n                      context:(void *)context {\n    NSLog(@\"%@\"\
    , self.totalCount);\n}\n@end\n```\n```\n\nIn addition to keyPathsForValuesAffectingTotalCount,\
    \ we register the observer in the awakeFromNib method. We also have a getter method\
    \ for totalCount that returns the sum of countOne and countTwo. This is called\
    \ from the observeValueForKeyPath:ofObject:change:context: method whenever either\
    \ value is changed. In response, we just log the total to the Console.¹\n\nThis\
    \ chapter took you through the fundamentals of observing.² You register an object\
    \ and wait until it is called back. This is like a notification without a notification\
    \ center. This is just a relationship between two objects, and only the observer\
    \ needs to know about the observed. You've seen how to register multiple observers\
    \ to one attribute and how to register a single observer to multiple attributes.\
    \ Finally, you saw how to set up a dependent variable so its observers were updated\
    \ when the variables it depends on change.\n\nAs cool as KVO and KVC are both\
    \ individually and together, their real power is in the technologies they enable.\
    \ We'll strip out code from the controller layer with Bindings and from the model\
    \ layer with Core Data.\n\nYou can use KVO and KVC whether you're developing for\
    \ Mac OS X or for iPhone OS. If you are mainly interested in developing for Mac\
    \ OS X, you're going to love where we're headed next. We're going to see how these\
    \ technologies enable bindings, which let you write less code for the controller\
    \ layer. Unfortunately, there currently isn't any support for bindings for iPhone\
    \ OS.\n\n+   1. See KVO/Counter1 in the code zip file to see that you can remove\
    \ the totalCount instance variable and property and still get this same behavior.\n\
    +   2. You can find more information in Apple's Key-Value Observing Guide [App08]."
