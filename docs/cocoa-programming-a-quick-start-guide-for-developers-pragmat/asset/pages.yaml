  md: 'sophisticated techniques that allow you to create powerful and flexible applications
    by writing only the code that is required.


    The fourth section is a brief one that introduces blocks and two methods for working
    with concurrency. In Chapter **24**, *Blocks*, on page **383**, you will learn
    a new construct that was added to Snow Leopard. Although I am assuming you are
    developing in Snow Leopard, all of the techniques you learn up to this point apply
    to code you are deploying to Leopard as well.[^5] If you use blocks in your code,
    you cannot target Leopard or the iPhone. You are restricted to Snow Leopard and
    above.


    I wrestled with whether to cover concurrency in this book. It’s such a difficult
    thing to get right in your code, and I could have written an entire book on this
    topic. My advice is simple: don’t use threads directly. First, reach for operation
    queues, and if they don’t meet your needs and if you are on Snow Leopard or above,
    go ahead and work with dispatch queues.


    As you can see, the book focuses on techniques and not APIs. By the end of this
    book, you should be well positioned to take on any Cocoa task. Even though you
    might not have learned about the specific problem you need to tackle, you’ll have
    enough experience to find the right place in the Apple documentation and figure
    out how to do what you need to do.


    Welcome to the neighborhood. I’m so glad you’re here. I can’t wait to see the
    cool applications you develop after you read this book.


    > [^5]: The APIs may differ, but the techniques are the same.'
