- pgno: 295
  md: "We’ll solve the first problem with lazy initialization and the second problem\
    \ by figuring out whether the current app is running.\n\n# ### 18.10 Lazy Initialization\n\
    \nWe don’t want to create a CurrentApp instance every time we switch views. We\
    \ want to instantiate CurrentApp only the first time we need it.\n\nEven though\
    \ our getter and setter for the currentApp property are generated for us, we are\
    \ free to override them. We’ll override the getter method currentApp like this:\n\
    \n```\n~~~objectivec\nDownload from ChangingViews/HelloApplication45/MyWindowController.m\n\
    -(CurrentApp *) currentApp {\n    if (!currentApp) {\n        self.currentApp\
    \ = [[CurrentApp alloc] init];\n    }\n    return currentApp;\n}\n~~~\n```\n\n\
    If the currentApp instance variable is not nil, then we just return it. If it\
    \ doesn’t exist yet, then we create an instance of CurrentApp and assign it to\
    \ our property using the setter.\n\nUpdate the init method in CurrentApp.m to\
    \ set its app property to be the current application:\n\n```\n~~~objectivec\n\
    Download from ChangingViews/HelloApplication45/CurrentApp.m\n-(id) init {\n  \
    \  if (self = [super init]) {\n        [self registerNotifications];\n       \
    \ [self initializeMethodDictionary];\n        self.app = [NSRunningApplication\
    \ currentApplication];\n    }\n    return self;\n}\n~~~\n```\n\nNow we have a\
    \ single instance of CurrentApp throughout the lifetime of our application, and\
    \ it always knows what the launching or terminating application is.\n\nThere are\
    \ many ways to figure out whether our current application is launching or terminating.\
    \ For example, we could add a property to CurrentApp to hold this information.\
    \ We could save the notification in the view controller and key off of its type.\
    \ I’ve taken a simpler approach. Since we know what the app is that just launched\
    \ or terminated, we can check to see whether it is in the array of running applications."
