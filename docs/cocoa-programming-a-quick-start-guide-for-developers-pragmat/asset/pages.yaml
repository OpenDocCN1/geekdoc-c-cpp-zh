  md: '![](img/9355405953264484a02198b0e3d25b7e_26_0.png)


    # ### Joe Asks...

    **Shouldn’t We Be Writing Code?**


    Anything that can be done in Interface Builder can also be done in code. But,
    in general, anything that can be done in Interface Builder should be done in Interface
    Builder and not in code.


    If you follow this rule as strictly as possible, then most of the time when you
    are coding, you will be writing code that is specific to your application and
    not general-purpose code. There probably is nothing special about the way in which
    you need to instantiate and place buttons in your application—so use Interface
    Builder to do so.


    In this chapter, we are only using common visual components such as windows, buttons,
    text fields, and web views. We don’t need to create our own classes because Apple
    has created them for us and included (most of them) in the Cocoa frameworks. We
    are going to create instances of these visual elements and arrange them so they
    look right in Interface Builder.


    By the end of this chapter, you’ll see that we can also use Interface Builder
    to connect a button to the action it performs. The web view that Apple provides
    us with already knows how to go to a provided URL and to navigate back and forward
    in the browser history. We’ll use this built-in behavior for now and delay writing
    code until we want to customize the behavior of the browser.


    ter with version control. You still should only interact with these files using
    Interface Builder so the persistence format is transparent to you. The only difference
    you’ll see is that the XML versions use the xib extension. Despite this change,
    they are mostly still referred to as nib files (pronounced “nib” and not “N.I.B.”),
    although some people pronounce xib files as “zibs.”⁴


    SimpleBrowser consists of a single window with off-the-shelf components. You’ll
    fill the MainMenu nib with a web view for rendering the


    4. The name nib comes from the acronym for NeXT Interface Builder. Interface Builder
    and the framework that has become Cocoa were developed at NeXT Computer. Also,
    when you create a release, the xib files are compiled into nibs.'
