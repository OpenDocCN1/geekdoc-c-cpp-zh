  md: "action that will be called when a notification is received. The notification\n\
    will be sent as the parameter.\n\nHere’s the entire CurrentApp.m listing:\n\n\
    [Download Notification/HelloApplication2/CurrentApp.m](Notification/HelloApplication2/CurrentApp.m)\n\
    \n```\n```objc\n#import \"CurrentApp.h\"\n\n@implementation CurrentApp\n\n-(void)\
    \ reportActivity: (NSNotification *) notification {\n    NSLog(@\"%@\", notification.name\
