  md: '# 16.2  Exercise: Implementing a Basic Data Source


    Click Build & Run, and you should get this error:


    ```

    Illegal NSTabViewNew data source (<ActivityController: 0x200053b60>).\nMust implement
    numberOfRowsInTableView: and\ntableView:objectValueForTableColumn:row:

    ```


    This is as helpful as an error message could possibly be. It tells us which methods
    to implement in ActivityController so that it can act as the data source for our
    table view. I’m going to let you try it first as an exercise.


    The rows in a table represent different records in your data source, and the columns
    are various attributes for each record. So, for example, we could display a roster
    of people in your local CocoaHeads group. The first column might contain their
    first name, and the second column might contain their last name. You might even
    have more information in your data source (email addresses, phone numbers, ...)
    than you want to display in your table.


    You set up the columns in Interface Builder when you created your table view,
    but usually you won’t know the number of records in the data source until runtime.
    In fact, if you create an application where you can add and delete records, then
    this number will change at run-time. So, your data source must be able to tell
    the table how many rows are in the table view. The table view can then fill itself
    in by looping through the number of visible rows and columns and asking the data
    source what belongs in each cell by calling the tableView:objectValueForTableColumn:row:
    method for each cell.


    The data source records are often stored in an array, but actually they can be
    stored any way you want as long as the data source can respond to the two methods
    numberOfRowsInTableView: and tableView:objectValueForTableColumn:row:. What this
    amounts to is that the records must be able to be indexed by integers.


    Implement these methods in the most simplistic way possible. Return a fixed integer
    from numberOfRowsInTableView:. Choose a large enough number like 100 so that the
    scroll view is engaged as well. Return the row number (as a string) from tableView:objectValueForTableColumn:row:.
    Both columns of the row will show the row number.'
  merge: -1
  img_proc: true
- pgno: 259
  md: "Use the documentation to get the method signatures right. Search the docs on\
    \ the name of the method. Once you locate the method, copy the method signature\
    \ from the documentation and paste it into your code. Whatever you do, don’t type\
    \ all of that in yourself!\n\nUh-oh. We have another problem. You should have\
    \ an easy enough time returning the row number, but how do you find the column\
    \ number? Search through the NSTableColumn docs, and you'll see methods like identifier,\
    \ dataCellForRow:, and headerCell. It doesn't look as if the column knows its\
    \ index number. You'll soon see why. For now, just fill each cell with the row\
    \ number.\n\n# 16.3 Solution: Implementing a Basic Data Source\n\nYou shouldn’t\
    \ have made any changes to the ActivityController header file. If you stop to\
    \ think a moment, that may actually be surprising. You didn’t have to declare\
    \ that ActivityController is implementing the NSTableViewDataSource or NSTableViewDelegate\
    \ protocol. You are free to add them if you want—in fact, that might better communicate\
    \ the purpose of the ActivityController to others reading your source code. You\
    \ aren’t required to because only the table view will be calling the methods declared\
    \ in the protocol, so no warnings will appear.\n\nAs for the implementation file,\
    \ you should have added these methods:\n\n```\n```objc\n- (NSInteger)numberOfRowsInTableView:(NSTableView\
    \ *)aTableView {\n    return 100;\n}\n- (id)\ttableView:(NSTableView *)aTableView\n\
    objectValueForTableColumn:(NSTableColumn *)aTableColumn\n                 row:(NSInteger)rowIndex\
    \ {\n    return [NSString stringWithFormat:@\"Row = %d\", rowIndex];\n}\n```\n\
    ```\n\nClick Build & Run. With the application running, double-click the first\
    \ column to select it. Drag that column to the right until the two columns switch\
    \ places like the picture on the following page."
