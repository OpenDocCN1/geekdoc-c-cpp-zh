    Save your work, and test the results in the Cocoa Simulator. Shrink the window
    all the way down, and then expand it back out. Chances are, that will make your
    interface behave badly. You should set the minimum size for your window. To do
    this, quit the Cocoa Simulator, and select the Window object. In the Size inspector,
    you''ll see a Window Size section. Select the Minimum Size checkbox, and click
    the Use Current button. Save your work. Now the user will not be able to shrink
    the window beyond its current size. If you''d like, you can set the maximum size
    for the window in the same way.


    Again, test your results in the Cocoa Simulator. While you are here, take a few
    minutes to experiment with the settings for the struts and springs, and try different
    maximum and minimum sizes for the window.


