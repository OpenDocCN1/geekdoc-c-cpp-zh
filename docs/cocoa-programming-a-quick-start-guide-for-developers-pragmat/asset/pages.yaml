- pgno: 425
  md: '# Chapter 27


    # Up and Out


    So now you’ve gotten a solid introduction to the Mac and iPhone developers’ neighborhood.
    You know the programming equivalent of where to go for coffee and where to catch
    the bus that takes you downtown. I didn’t list the entire menu and prices for
    the local coffeehouse nor did I give you the entire bus schedule. These details
    will change, and you can look them up when you need them.


    You’ve been on quite a journey. You’ve learned how to use the fundamental development
    tools for Mac OS X and iPhone apps. You’ve learned the ins and outs of Cocoa and
    Objective-C. Most importantly, you’ve learned how to get the most out of this
    platform using the techniques and design patterns central to Cocoa development.


    # 27.1  But What About...


    There are a ton of topics I considered including but didn’t. I wanted to keep
    the focus of the book on the skills you needed for programming and not on the
    APIs. You will have pet topics that you hoped would be covered but weren’t.


    For instance, I developed a web services example where you would have created
    a simple Twitter client. When I stepped back and looked at the example, it was
    way too API focused. You learned how to send synchronous and asynchronous requests,
    parse the XML that you received in response, and even respond to an authentication
    challenge. This is similar to an example used in our iPhone SDK book and to a
    sequence we teach in our iPhone Studio course, but it didn’t fit this book. Other
    than introducing you to a few more classes and methods, the main technique used
    in this example was delegates.'
  merge: -1
  img_proc: true
- pgno: 426
  md: 'Similarly, at one point I ported the Core Data example to the iPhone. There
    are no bindings on the iPhone, so you have to fetch the data yourself and present
    it in the table views. Although this is a difference in the specific settings
    of Core Data, it uses techniques that you used to fill tables long before we got
    to Core Data, so there was no justification for including this material.


    And so it went. This book could have easily been twice as long as it is, but in
    each case I asked the material to justify its existence. Do you really add something
    new here? Often the candidate chapters shrugged their shoulders and said, “I guess
    not.”


    There was one exception. I wrestled with whether to end with a chapter on OpenCL
    for months. I finally decided that it was a niche topic. In fact, this decision
    made me scale back the chapter on Grand Central Dispatch to cover the basics.


    So when you say, “You could have included a chapter on...,” I agree with you.
    I could have. In many cases, I considered doing so but decided the book would
    not have been made stronger with this additional material. I wanted to minimize
    the side trips that we’d take on this journey through Cocoa development techniques.


    # ## 27.2 What''s Next


    It''s time to stop reading books and to start writing a real application.


    Before you sit down and write a line of code, make sure you nail what it is you
    are writing and who it''s for. Can you picture someone using your app? What are
    they doing with it? When do they use it? What itch are they scratching, or what
    problem are they solving? How will you explain to someone why they should download
    or pay money for your app?


    This sounds small, but if you look at the previous section, you can see how useful
    it was. I knew exactly who I intended this book for and what it was I was providing
    for you in this book. It made the hard decisions easier. Identify your audience
    and what they will get from your application.


    You still aren''t ready to write any code. Sketch your screens, and imagine the
    user navigating from screen to screen and interacting with your application. This
    paper prototyping step might feel unnecessary, but it'
  merge: -1
  img_proc: true
- pgno: 427
  md: 'helps you think through the flow of your application. It''s a lot easier to
    fix problems before you start writing code and creating nibs than after.


    During these initial steps, make sure that you don''t use words that programmers
    use. Don''t talk about using a delegate or describe your model or talk about separate
    nibs. All of your thoughts at this point should be in terms of the person using
    your application. This is the hardest rule to follow, but the idea is that you
    should not be worried about implementation at this point. For now, you''re making
    sure that you have something worth implementing.


    Now you are ready to open up Xcode and start coding. When you have something you
    can get into the hands of testers, do so. You are too close to the application.
    You know that you have to go to some particular submenu to find just what you
    need—if this isn''t clear to your testers, then you need to address it. For the
    most part, you want your app to behave consistently with other Mac or iPhone applications.


    Along the way, you will run into dead ends. You won''t be able to find what you
    need in the docs. You''ll need some special case that isn''t covered in this book
    or in any of the other books you own. Arm yourself with Mike Ash''s post on “Getting
    Answers,” and head to Apple and third-party forums and mailing lists.¹


    Keep pushing and polishing, but remember Steve Jobs'' famous admonition that “Real
    artists ship.”²


    I can''t wait to see what you come up with.


    # 27.3 Acknowledgments


    I couldn''t figure out where to put the acknowledgments in this book. I know they
    usually go up front, but this book is about your journey, not mine. I couldn''t
    see starting you on this journey and then stopping to talk about me. If this were
    a GCD-enabled program and not a book, I would have kept the book on the main queue
    and sent the thanks to a concurrent high-priority thread. Please understand that
    these acknowledgments have not been left to the end because they aren''t important.


    First, thanks to Kimberli Diemer and Margaret Steinberg. No one is more important
    to me than my wife, Kim, and my daughter, Maggie.


    +   1. http://www.mikeash.com/getting_answers.html

    +   2. http://www.fakore.com/StoryView.py?story=Pirate_Flag.txt'
  merge: -1
  img_proc: true
- pgno: 428
  md: 'Nothing gets done without their help and support and daily doses of reality.


    Second, thanks to Dave Thomas for agreeing to edit this book. That was a gift
    that I have benefited on every page of this book. He made suggestions to the prose
    and the code. Anything that you don’t like about the book is definitely his fault.


    Of course, I’m kidding. It’s probably Andy Hunt’s fault.


    Yes, kidding again. Beyond editing the book, I’d like to thank Dave and Andy for
    giving me a home as an author and editor and for providing a great set of tools
    that support the writing and life cycle of a technology book.


    Thanks to Mike and Nicole Clark for letting me teach Cocoa programming and iPhone
    programming at the Pragmatic Studios. Thanks to the many students in the studios
    who gave me great feedback on the material. Thanks to friends and colleagues Craig
    Castelaz, Chris Adamson, Bill Dudney, Eric Freeman, Scott Kovatch, and Dee Wu
    for their helpful comments throughout the life of this project.


    Thanks also to the tech reviewers and the readers who submitted errata over the
    year that this book was in beta. Thanks to folks at Apple who I’m not allowed
    to name or it would get them in trouble. Two in particular took me out to lunch
    several years ago to make sure I understood that I needed to move from Java to
    Objective-C if I wanted to continue to write code for this platform. Finally,
    thanks to the folks at Apple who have created such a wonderful platform. Writing
    Cocoa and Objective-C is a pleasure.


    # 27.4  Dedication


    This book is dedicated to my friend James Duncan Davidson.


    I met Duncan at an Apple Worldwide Developer Conference (WWDC) back when they
    were held in San Jose. He was researching his book *Learning Cocoa* [DA02]. Honestly,
    if I’d had my druthers, he would have written this book, and I would have edited
    it. I’ve tried to be true to the spirit of this book.


    Duncan met Kim, my wife, on a Mac geek cruise and quickly became a family friend.
    He first met my daughters while visiting before the two'
  merge: -1
  img_proc: true
- pgno: 429
  md: 'of us drove up to Mac Hack. In other words, all of my family''s first interactions
    with this man were tied up in Mac events.


    My daughter Maggie would tell her friends in a hushed voice, "He''s very famous.
    He created Ant and Tomcat." She also messed up his name on purpose and called
    him James David Duncanson.


    I loved his relationship with my youngest daughter. Both in our house and when
    we visited him in Portland or met him in San Francisco, they had a special give-and-take.
    She would tease him and flirt with him, and in return he would talk to her in
    a way that was both age appropriate and respectful of who she was. Yes, was. After
    Elena died, Duncan came out and took care of us. He dropped everything and stayed
    with us after the funeral was over and made sure we had what we needed.


    A couple of years ago I approached Duncan about writing an updated version of
    his Cocoa book. He declined, and he suggested I write it. I was nervous. I remembered
    him saying to the Cleveland Java Users Group that he had thought he was an OO
    "badass" when he was working at Sun on Java but that working with Objective-C
    and Cocoa made him realize he wasn''t at the time. That thought was what stood
    at the core of this book for me. I didn''t want to walk through Cocoa APIs and
    just teach you tools. I wanted to look at the techniques that would make you an
    OO badass.


    Thank you, James.'
