- pgno: 79
  md: "All this inheritance worked fine because Greeter didn’t have any of its own\
    \ variables to initialize. There was nothing that was in a Greeter that wasn’t\
    \ already in an NSObject that needed initialization.\n\nLet’s change that. Let’s\
    \ add an instance variable named name to Greeter. Remember, we need to add a declaration\
    \ between the curly braces in the header file Greeter.h.\n\n```\n```objective-c\n\
    #import <Cocoa/Cocoa.h>\n\n@interface Greeter : NSObject {\n    NSString * name;\n\
    }\n-(NSString *) greeting;\n@end\n```\n```\n\nWhat are we going to do with our\
    \ new variable? First, we’re going to need to set its value when the object is\
    \ initialized. We’re going to have to write our own init method in which we set\
    \ the value of name to World. Then we’re going to have to change the implementation\
    \ of greeting so that it inserts the value of name between *Hello,* and *!*.\n\
    \nWe’ll go through the following code slowly starting with init:\n\n```\n```objective-c\n\
    #import \"Greeter.h\"\n\n@implementation Greeter\n\n-(NSString *) greeting {\n\
    \    return [[NSString alloc] initWithFormat:@\"Hello, %@!\", name];\n}\n\n-(id)\
    \ init {\n    if (self = [super init]){\n        name = @\"World\";\n    }\n \
    \   return self;\n}\n@end\n```\n```\n\nLet’s start with line 10. It sure looks\
    \ wrong. You might think that there should be a double equals between `self` and\
    \ `[super init]`, but this really is an assignment and not a test for equality.\
    \ So, what’s going on in the assignment?\n\n```\n```objective-c\nself = [super\
    \ init];\n```\n```"
