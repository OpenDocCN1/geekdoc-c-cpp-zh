- pgno: 449
  md: '# Core Animation for OS X/iPhone


    Have you seen Apple''s Front Row application and Cover Flow effects? Then you''ve
    seen Core Animation at work. It''s about making applications that give strong
    visual feedback through movement and morphing, rather than repainting panels.
    This comprehensive guide will get you up to speed quickly and take you into the
    depths of this new technology.


    **Core Animation for Mac OS X and the iPhone: Creating Compelling Dynamic User
    Interfaces**

    Bill Dudley

    (220 pages) ISBN: 978-1-934356-1-4. $34.95

    http://pragprog.com/titles/bdcora


    ![](img/9355405953264484a02198b0e3d25b7e_449_0.png)


    # Core Data


    Learn the Apple Core Data APIs from the ground up. You can concentrate on designing
    the model for your application, and use the power of Core Data to do the rest.
    This book will take you from beginning with Core Data through to expert level
    configurations that you will not find anywhere else. Learn why you should be using
    Core Data for your next Cocoa project, and how to use it most effectively.


    **Core Data: Apple''s API for Persisting Data under Mac OS X**

    Marcus S. Zarra

    (256 pages) ISBN: 978-1-934356-32-6. $32.95

    http://pragprog.com/titles/mzcd


    ![](img/9355405953264484a02198b0e3d25b7e_449_1.png)'
  merge: -1
  img_proc: true
- pgno: 450
  md: '# More iPhone and iPad


    # iPhone SDK Development


    Jump into application development for today’s most remarkable mobile communications
    platform, the Pragmatic way. This Pragmatic guide takes you through the tools
    and APIs, the same ones Apple uses for its applications, that you can use to create
    your own software for the iPhone and iPod touch. Packed with useful examples,
    this book will give you both the big-picture concepts and the everyday “gotcha”
    details that developers need to make the most of the beauty and power of the iPhone
    OS platform.


    ![](img/9355405953264484a02198b0e3d25b7e_450_0.png)


    **iPhone SDK Development**

    Bill Dudney, Chris Adamson, Marcel Molina

    (545 pages) ISBN: 978-1-9343562-5-8. $38.95

    http://pragprog.com/titles/amiphp


    # iPad Programming


    It’s not an iPhone and it’s not a laptop: the iPad is a groundbreaking new device.
    You need to create true iPad apps to take advantage of all that is possible with
    the iPad. If you’re an experienced iPhone developer, *iPad Programming* will show
    you how to write these outstanding new apps while completely fitting your users’
    expectation for this device.


    ![](img/9355405953264484a02198b0e3d25b7e_450_1.png)


    **iPad Programming: A Quick-Start Guide for iPhone Developers**

    Daniel H Steinberg and Eric T Freeman

    (250 pages) ISBN: 978-1934356-7-9. $34.95

    http://pragprog.com/titles/sfipad'
  merge: -1
  img_proc: true
- pgno: 451
  md: "# More Productive\n\n# TextMate\n\nIf you’re coding Ruby or Rails on a Mac,\
    \ then you owe it to yourself to get the TextMate editor. And, once you’re using\
    \ TextMate, you owe it to yourself to pick up this book. It’s packed with information\
    \ that will help you automate all your editing tasks, saving you time to concentrate\
    \ on the important stuff. Use snippets to boilerplate code and refactorings to\
    \ move stuff around. Learn how to write your own extensions to customize it to\
    \ the way you work.\n\n**TextMate: Power Editing for the Mac**  \nJames Edward\
    \ Gray II  \n(200 pages) ISBN: 0-9787392-3-X. $29.95  \n[http://pragprog.com/titles/txmate](http://pragprog.com/titles/txmate)\n\
    \n![](img/9355405953264484a02198b0e3d25b7e_451_0.png)\n\n# Pomodoro Technique\
    \ Illustrated\n\nDo you ever look at the clock and wonder where the day went?\
    \ You spent all this time at work and didn’t come close to getting everything\
    \ done. Tomorrow, try something new. In *Pomodoro Technique Illustrated*, Staffan\
    \ Nöteberg shows you how to organize your work to accomplish more in less time.\
    \ There’s no need for expensive software or fancy planners. You can get started\
    \ with nothing more than a piece of paper, a pencil, and a kitchen timer.\n\n\
    **Pomodoro Technique Illustrated: The Easy Way to Do More in Less Time**  \nStaffan\
    \ Nöteberg  \n(144 pages) ISBN: 9781934356500. $24.95  \n[http://pragprog.com/titles/sfocus](http://pragprog.com/titles/sfocus)\n\
    \n![](img/9355405953264484a02198b0e3d25b7e_451_1.png)"
  merge: -1
  img_proc: true
- pgno: 452
  md: '# Debug It!


    Debug It! will equip you with the tools, techniques, and approaches to help you
    tackle any bug with confidence. These secrets of professional debugging illuminate
    every stage of the bug life cycle, from constructing software that makes debugging
    easy; through bug detection, reproduction, and diagnosis; to rolling out our eventual
    fix. Learn better debugging whether you’re writing Java or assembly language,
    targeting servers or embedded micro-controllers, or using agile or traditional
    approaches.


    ![](img/9355405953264484a02198b0e3d25b7e_452_0.png)


    **Debug It! Find, Repair, and Prevent Bugs in Your Code**

    Paul Butcher

    (232 pages) ISBN: 978-1-9343562-8-9. $34.95

    http://pragprog.com/titles/pbcd


    # SQL Antipatterns


    If you''re programming applications that store data, then chances are you''re
    using SQL, either directly or through a mapping layer. But most of the SQL that
    gets used is inefficient, hard to maintain, and sometimes just plain wrong. This
    book shows you all the common mistakes, and then leads you through the best fixes.
    What’s more, it shows you what’s behind these fixes, so you’ll learn a lot about
    relational databases along the way.


    ![](img/9355405953264484a02198b0e3d25b7e_452_1.png)


    **SQL Antipatterns: Avoiding the Pitfalls of Database Programming**

    Bill Karwin

    (300 pages) ISBN: 978-1-9343565-5-5. $34.95

    http://pragprog.com/titles/bkscla'
  merge: -1
  img_proc: true
