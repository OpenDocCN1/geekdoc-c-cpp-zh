    IconView\" bundle:nil];\n```\n\nClick Build & Run, and you should see an empty\
    \ window proudly displaying our new view. In a minute, we'll fill this window\
    \ with something.\n\n# ## 15.2 Drawing Shapes into a Custom View\n\nBefore we\
    \ draw shapes or text into a custom view, you need to understand how an NSView\
    \ draws itself. It's different from what you've seen so far.\n\nIn the previous\
    \ chapter, when you drew an icon onto an image view, you sent the message setImage:\
    \ to an instance of NSImageView. Also, when you wanted to display text in a text\
    \ field, you sent the message setStringValue: to an instance of NSTextField. This\
    \ is probably a model you are used to from other platforms. You call the various\
    \ configuring and drawing methods on the object you are drawing.\n\nDrawing into\
    \ an NSView is completely different. You set all of the parameters and instructions\
    \ for the drawing inside the NSView's drawRect: method. You don't call drawRect:\
    \ directly. It will be called when your view first needs to be drawn, and soon\
    \ I'll show you how you signal that it needs to be called again to redraw a view."
