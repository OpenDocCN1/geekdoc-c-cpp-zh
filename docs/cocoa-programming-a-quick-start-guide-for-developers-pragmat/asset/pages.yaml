    \ size = (self.frame.size.width)/2;\n    CGFloat x = self.frame.origin.x;\n  \
    \  CGFloat y = self.frame.origin.y;\n    dispatch_async(\n        dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT,0),^{\n\
    \            [self tileWithX:x y:y size:size];\n            [self tileWithX:x\
    \ y:y+size size:size];\n            [self tileWithX:x+size y:y size:size];\n \
    \           [self tileWithX:x+size y:y+size size:size];\n    });\n}\n```\n```\n\
    \nClick Build & Run. I see splotches of color on a black background. The code\
    \ to draw the rectangles to the screen is being called before the color has been\
    \ calculated. You can see varying amounts of black by changing the number of iterations\
    \ in Newton’s method from 2,000 to 200 to 20 if you’d like.\n\n![](img/9355405953264484a02198b0e3d25b7e_422_0.png)"
