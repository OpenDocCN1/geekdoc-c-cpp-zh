  md: "Although you probably didn't pay attention at the time, the window contains\
    \ a ContentView. When you dropped the text field onto the window, you were creating\
    \ an instance of NSTextField, and you were adding it as a subview of the ContentView.\n\
    \nYou then repositioned the text field and changed the text to display what you\
    \ wanted. Here's how we might do this in code:⁴\n\n```\n```objc\nDownload Class:\
    \ HelloWorld2/HelloWorldAppDelegate.m\n#import \"HelloWorldAppDelegate.h\"\n@implementation\
    \ HelloWorldAppDelegate\n@synthesize window;\n\n-(void)applicationDidFinishLaunching:(NSNotification\
    \ *)aNotification {\n    NSRect    labelLocation = NSMakeRect(20, 20, 540, 50);\n\
    \    NSTextField *label = [[NSTextField alloc] initWithFrame:labelLocation];\n\
    \    [label setStringValue:@\"Hello, World!\"];\n    [[self.window contentView]\
    \ addSubview:label];\n}\n@end\n```\n```\n\nFirst, we create an NSRect that holds\
    \ the information for the size and location of the label. This matches the work\
    \ we did using Interface Builder in Chapter 2, *Using What's There*, on page 24,\
    \ where we resized the text field or set its dimensions in the Size inspector.\
    \ Notice that NSMakeRect() is a C function and not a method. This is fairly typical\
    \ when we work with graphic elements. Although this is certainly too much information\
    \ for now, an NSRect or an NSPoint is a C struct and not an Objective-C object.\
    \ There will always be a corresponding C function such as NSMakeRect() or NSMakePoint()\
    \ to create and configure these elements.\n\nNext we create an instance of NSTextField\
    \ named label and set its location and dimensions to those described by the labelLocation\
    \ variable. We set the label's string value to be Hello, World! and add the label\
    \ as a subview of the window's content view.\n\n---\n⁴ I'll assume for now you\
    \ understand that *self.window* refers to the current object's window instance.\
    \ I'll explain the dot syntax in Chapter 5, *Instance Variables and Properties*,\
    \ on page 86."
