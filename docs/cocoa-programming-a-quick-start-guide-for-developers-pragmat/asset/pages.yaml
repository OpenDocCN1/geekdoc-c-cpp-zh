    # ## 2.9 The Nib File


    All the work you did in this chapter is captured in a nib file. A *nib* is an
    archive of objects. In Cocoa, nib files contain all the information you need to
    bring your UI elements to life at runtime. A typical Cocoa application will have
    many nib files that are loaded only as they are needed to create instances of
    the objects that make up your user interface and, as you’ll see in Chapter 8,
    *Creating a Controller*, on page 141, nonvisual objects as well.


    The nib file represents the graph of objects you built using Interface Builder
    so that your interface and other objects captured in the nib can be reconstructed
    each time your application begins. You will work in Xcode to define your classes,
    and you will instantiate classes into objects in either Xcode or Interface Builder.
    A nib file that you create in Interface Builder is a frozen graph of objects that
    will be brought back to life at runtime.


    We’ll return to Interface Builder and nib files throughout this book. You’ll also
    find a great deal of information on them in Apple’s *Interface Builder User Guide*
    [App08e]. Scott Stevenson also has a nice quick-start tutorial of creating a different
    application with no code.<sup>10</sup> It currently uses Xcode 3.1, so what you’ll
    see in Snow Leopard will be slightly different from what he shows you.


