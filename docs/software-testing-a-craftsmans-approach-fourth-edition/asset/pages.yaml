  md: '# Life Cycle–Based Testing


    opposing teams are locked together and try to hook the football back to their
    respective sides. rugby scrum requires organized teamwork—hence, the name for
    the software process.

    The quick view of Scrum (the development life cycle) is that it is mostly newly
    names for old ideas. This is particularly true about the accepted Scrum vocabulary.
    Three examples: roles, ceremonies, and artifacts. In common parlance, Scrum roles
    refer to project participants; the ceremonies are meetings; the artifacts are
    products. Scrum masters are supervisors with less administrative power. Product
    owners are the customers of old, and the Scrum team is a development team. Figure
    11.9 is adapted from the "official" Scrum literature, the Scrum Alliance (http://www.scrumalliance.org/learn_about_scrum).
    Think about the activities in the iterative life cycle of scrum in 11.3. The traditions
    become "sprints," which last from 2 to 4 weeks. In a sprint, there is a daily
    stand-up meeting of the Scrum team to focus on what happened the previous day
    and what needs to be in the new day. Then there is a short burst of design-code-test
    followed by an integration of the team’s work at the end of the day. This is the
    agile part—a daily build that contributes to a sprint-level work in a short interval.
    The biggest differences between Scrum and the traditional view of iterative development
    are the special vocabulary and the duration of the iterations.

    Testing in the Scrum life cycle occurs at two levels—the unit level at each day’s
    end, and the integration of the small release is done by the product owner (the
    customer), which corresponds roughly to the product backlog for requirements step.
    Sprint definition looks a lot like preliminary design because this is the point
    where the Scrum team identifies the sequences and contents of individual sprints.
    The bottom line? Scrum has two distinct levels of testing—unit and integration/system.
    Why "integration/system?" The small release is a deliverable product usable by
    the product owner, so it is clearly a system-level work product. But this is the
    point where all of the development is integrated for the first time.


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_247_0.png)


    Figure 11.9 The Scrum life cycle.'
