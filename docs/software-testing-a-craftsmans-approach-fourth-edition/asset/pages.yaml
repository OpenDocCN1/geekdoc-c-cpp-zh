  md: '# Preface to the Second Edition


    # Software Testing: A Craftsman''s Approach, Second Edition


    Seven years have passed since I wrote the preface to the First Edition. Much has
    happened in that time, hence this new edition. The most significant change is
    the dominance of the unified modeling language (UML) as a standard for the specification
    and design of object-oriented software. This is reflected in the five chapters
    in Part V that deal with testing object-oriented software. Nearly all of the material
    in Part V is UML-based.


    The second major change is that the Pascal examples of the First Edition are replaced
    by a language pseudo-code. The examples have been elaborated: Visual Basic executable
    modules available on the CRC Press website support them. Several new examples
    illustrate some of the issues of testing object-oriented software. There are dozens
    of other changes: an improved description of equivalence class testing, a continuing
    case study, and more details about integration testing are the most important
    additions.


    I am flattered that the First Edition is one of the primary references on software
    testing in the trial-use standard “Engineering Body of Knowledge” jointly produced
    by the ACM and IEEE Computer Society (www.swebook.org). This recognition makes
    the problem of uncorrected mistakes of a bunder. Prof. G. H. Kwon of Kyongi University
    in South Korea means me a list of 38 errors in the First Edition, and students
    in my graduate class on software testing have generously contributed others. There
    is a nice analogy with testing here: I have fixed all the known errors, and my
    editor tells me it is time to look for others. If you find any, please let know—they
    are my responsibility. My email address jrogensp@gsvsu.edu.


    I need to thank Jerry Papule and Helena Redcap at CRC Press for their patience.
    I also want to thank my friend and colleague, Prof. Roger Ferguson, for his continued
    help with the new material in Part V, especially the continuing object-oriented
    calendar example. In a sense, Roger has been a tester of numerous drafts of chapters
    sixteen through twenty.


    Paul C. Jorgensen

    Rockford, Michigan'
