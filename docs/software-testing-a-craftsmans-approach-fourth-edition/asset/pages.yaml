    We will see why we use discuss equality. The decision rule approach is more complicated,
    and this complexity carries both advantages and penalties. We could define the
    years for NextDate as


    ```

    Y = {year: 1812 ≤ year ≤ 2012}

    ```


    which reads “Y is the set of all years that (the colon is ‘such that’) the years
    are between 1812 and 2012 inclusive.” When a decision rule is used to define a
    set, the rule must be unambiguous. Given any possible value of year, we can then
    determine whether or not year is in our set Y.


