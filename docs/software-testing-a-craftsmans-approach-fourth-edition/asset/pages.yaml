    complete, the Resume prompt assures that the interrupted activity does not have
    to start over—it resumes where it left off. Conversationally, we could say “s”
    is an lock “Stop what you are doing.”


    As with the Enable/Disable pair, Suspend and Resume have an interlock place, noted
    as “s” in Figure 17.12. An activity can be be resumed after it has been suspended,
    so place “s” is an lock between the lock and Resume actions. Also, the Suspend
    action and the intermediate step action are in Petri net conflict with respect
    to the marked input of the intermediate step. Presumably, a Suspend is followed
    by a Trigger to another required action, which, complete, leads to a Resume prompt.


    The November 1993 incident described earlier is a good example of where the Suspend
    and Resume prompts could be used. There is no direct communication between landing
    and departing aircraft, so the pilot on the ground contacted the O’Hare field
    control tower about the impending disaster. The control tower waved off the landing
    aircraft (Suspend), and once the disaster was avoided, issued a Resume.'
