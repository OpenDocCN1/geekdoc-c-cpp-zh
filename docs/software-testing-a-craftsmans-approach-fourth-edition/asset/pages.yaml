  md: '# A Closer Look at All Pairs Testing ■ 405


    Table 20.9 Applications Appropriate for All Pairs Testing


    | Single Processor | Multiple Processors |

    |---|--|

    | Static | All Pairs potentially OK | All cannot deal with input orders |

    | Dynamic | All Pairs potentially problematic | All Pairs cannot deal with input
    orders |


    data (Harel, 1988). Classic COBOL programs with their Input, Processing, and Output
    divisions are good examples of static applications.


    Dynamic applications are those in which all of the inputs that determine the ultimate
    path through a program are available at the outset of calculation. Harel use the
    term “reactive” to convey the fact that these applications react to input that
    occur in time sequence. The difference between static and dynamic applications
    is analogous to the difference between combinatorial and sequential circuits of
    discrete components. Because the order of inputs important, dynamic applications
    are not very appropriate to the All Pairs technique. There is no way to guarantee
    that interesting pairs will occur in the necessary order. Also, dynamic applications
    frequently contain context-sensitive input events where the meaning of a physical
    input is determined by the context in which it occurs. The conversion example
    in Section 20.1 contains context-sensitive inputs.


    The second consideration is whether the application executes on a single or on
    multiple processors. The All Pairs technique cannot guarantee appropriate pairs
    of input across multiple processors. Race conditions, duration of events in real
    time, and asynchronous input orders are common in multiprocessing applications,
    and these needs will likely not be met by All Pairs. Therefore, applications on
    the dynamic side of the partition, whether in single or in multiple processors,
    are not appropriate for All Pairs.


    The remaining quadrant, static applications in a multiple processing environment,
    is less clear. These applications are usually computation intensive (hence the
    need for parallel processing). If they are truly static, within a processor, All
    Pairs can be an appropriate choice.


    # 20.4 Recommendations for All Pairs Testing


    All Pairs testing is just another shortcut. When the time allocated for testing
    shrinks, as it frequently, shortcuts are both attractive and risky. If the following
    questions can all be answered “yes,” then the risk of using All Pairs is reduced.


    +   - The inputs are exclusively data (rather than a mix of data and events)?

    - The variables are logical (rather than physical)?

    - The variables are independent?

    - Do the variables have usefulness classes?

    - Is the order of inputs irrelevant (i.e., is the application both static and
    single processor)?


    Since the All Pairs algorithm only generates the input portion of a test case,
    one last question: can the expected outputs for All Pairs test cases be determined?


    # EXERCISE


    +   1. Download the allpairs.exe program from James Bach’s website and experiment
    with your version of the YesterDate program.'
