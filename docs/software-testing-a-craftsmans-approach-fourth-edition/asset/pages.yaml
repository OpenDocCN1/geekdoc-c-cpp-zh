    **Figure 8.12** Condensing with respect to structured programming constructs.


    so one conclusion is that such these violations increase cyclomatic complexity.
    The *pièce de résistance* of McCabe’s analysis is that these violations cannot
    occur by themselves: if one occurs in a program, there must be at least one, so
    a program cannot only be slightly unstructured. Because these increase cyclomatic
    complexity, the minimum number of tests is increased. In the next chapter, we
    will see that the violations have interesting implications for data flow testing.


    The bottom line for testers is this: programs with high cyclomatic complexity
    require more testing. Of the organizations that use the cyclomatic complexity
    metric, most set some guideline for maximum acceptable complexity; $V(G)=10$ is
    a common choice. What happens if a unit has a higher complexity? Two possibilities:
    either simplify the unit or to do more testing. If the unit is well structured,
    its essential complexity is 1; so it can be simplified easily. If the unit has
    an essential complexity greater than 1, often the best choice is to eliminate
    the violations.'
