  md: '# System Testing ■ 281


    Finite state machines are the preferred model for identifying execution probabilities.
    The mathematics behind this is that the transition probabilities can be expressed
    as a "transition matrix" where the element in row i, column j is the probability
    of the transition from state i to state j. Powers of transition matrix are analogous
    to the powers of the adjacency matrix when we discussed reachability in Chapter
    4. For small systems, it is easier to show the transition probabilities in a spreadsheet,
    as in Table 14.12. Once the probabilities are known, they sorted by execution
    probability, most to least possible. This is done in Table 14.13.


    Just as the quality of model-based testing is limited by the correctness of the
    underlying model, the analysis of operational profiles is limited by the validity
    of the transition probability estimates. There are strategies to develop these
    estimates. One is to use historical data from similar systems. Another is to use
    customer-supplied estimates. Still another is to use a Delphi approach in which
    a group of experts give their guesses, and some average series of estimates, or
    possibly by having several experts, and minimizing the high and low extremes.


