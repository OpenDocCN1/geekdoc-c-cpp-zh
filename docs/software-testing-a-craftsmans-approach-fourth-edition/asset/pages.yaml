    is usually enough to recognize this problem. Given a final issues list, the review
    leader makes a Go/No Go decision based on the number and severity of the issues.
    (Review cancellation should be rare, but it is wise to allow for the possibility.)
    Assuming the review will occur, the review leader prepares the final agenda by
    prioritizing the merged issues—a form of triage.


    # 22.5.4 Review Meeting


    The actual review meeting should be conducted as an effective business meeting.
    In Section 22.2.2, there is a list of characteristics of a poorly run business
    meeting. Some steps in the review process have already been taken to ensure an
    effective review meeting:


    +   - The review team was carefully selected, so the right people will be in the
    meeting.

    - The agenda is based on the prioritized list of issues, so there should not be
    a sense that the meeting is a waste of time.

    - The process calls for budgeted preparation in which issues are identified before
    the meeting.


    Normally, the first order of business is to decide if the meeting should be postponed.
    The main reasons are most likely absent or unprepared team members. Assuming that
    the review will proceed, the main job of the review is to follow the agenda, and
    make sure that issues are identified, and agreed upon, not resolved. Once the
    agenda has been completed, the review leader asks for a consensus of the review
    recommendation. Recall that the options are Accept as is, Accept with minor review
    but no additional review is needed, or Reject. The review meeting ends with a
    short wrap-up conducted by the recorder in which the issues list is finalized,
    the individual ballots are balloted, and the team checks that was not forgotten.


    # 22.5.5 Report Preparation


    The review leader is primarily responsible for writing the review report, with
    assistance from the recorder is certainly in order. The report is a technical
    recommendation to management, and it ends the technical responsibility (but not
    the accountability). If there are any issues, they are noted as action items that
    require additional work from the producer. The review report, and all other materials,
    should be open to the entire organization, as this enhances accountability.


    # 22.5.6 Disposition


    Once the producer’s supervisor receives the report, it becomes the basis of a
    management decision. There may be pressing reasons to ignore the technical findings,
    but if this happens, it is clearly a management choice. Assuming the recommendation
    is to accept the work product, it becomes subject to the configuration management
    function, and the work product is no longer a design object; it is a configuration
    item. As such, it can be used in the remainder of the project as a reliable component,
    not subject to change. If the review recommendation lists action items, the producer’s
    supervisor and the producer make an estimate of the effort required to resolve
    the action items, and the work is done by the producer. Once all action items
    are resolved, the supervisor closes the report or starts a re-review process.'
