  md: '# 23.3.3 System-Level Model-Based Testing


    If an executable specification is used, a large number of system-level test cases
    can be automatically generated. This itself greatly offsets the extra effort of
    creating an executable model. In addition, this enables direct tracing of system
    testing against a requirements model. Because executable specifications are provocative,
    the automatically generated system test cases include many possibilities that
    otherwise might not be created.


    # 23.3.4 System Testing Extensions


    For complex, mission-critical applications, spread thread testing is necessary
    but not sufficient. At a minimum, thread interaction testing is needed. Particularly
    in complex systems, thread interactions are both serious and difficult to identify.
    Stress testing is a brute force of identifying thread interaction. Many times,
    just the sheet manager on interactions forced by stress testing reveals the presence
    of previously undiscovered faults (Hill, 2006). Hill notes that stress testing
    is focused on known (or suspected) weak spots in the software, and pass/fail judgments
    are typically more subjective than conventional testing. Risk-based testing is
    a shortcut that may be necessary. Risk-based testing is an extension of the operational
    approaches discussed in Chapter 14. Rather than just test the most frequent (high
    probability) threads, risk-based testing multiplies the probability of a thread
    by the cost (or penalty) of failure. When time is severely limited, threads are
    tested in terms of risk rather than simple probability.


    # 23.3.5 Incidence Matrices to Guide Regression Testing


    Both traditional and object-oriented software projects benefit from an incidence
    matrix. For procedural software, the incidence between mainline functions (sometimes
    called features) and the implementing procedures is recorded in the matrix. Thus,
    for a particular function, the set of procedures needed to support that function
    is readily identified. Similarly for object-oriented software, the incidence between
    use cases and classes is recorded. In this paradigm, information can be used to


    +   - Determine the order and contents of builds (or increments)

    - Facilitate fault isolation when faults are revealed (or reported)

    - Guide regression testing


    # 23.3.6 Use of MM-Paths for Integration Testing


    Given the three fundamental approaches to integration testing discussed in Chapter
    13, MM-paths are demonstrably superior. They can also be used with incidence matrices
    in a way that parallels that for system-level testing.


    # 23.3.7 Intelligent Combination of Specification-Based and Code-Based Unit Testing


    Neither specification-based nor code-based unit testing is sufficient by itself,
    but the combination is highly desirable. The best practice is to choose a specification-based
    technique based on the nature of the unit (see Chapter 10), run the test cases
    with a tool to show test coverage, and then'
