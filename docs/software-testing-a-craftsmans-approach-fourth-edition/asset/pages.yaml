    The static/dynamic dichotomy is more complex. We borrow two terms from database
    technology to explain the difference. In database parlance, we can refer to the
    intention and extension of a database. The intention (it is unique) is the fundamental
    database structure, presumably expressed in a data modeling language. Populating
    a database creates an extension, and changes to a populated database result in
    new extensions. In this, static backward slice S(v) consists of all the statements
    in a program that determine the value of variable *v* at statement *n*, independent
    of values used in statements. Dynamic slices reveal execution-time change of portions
    of a static slice with specific values of all variables in S(v, n). This is illustrated
    in Figures 9.6 and 9.7.


    Listing elements of a slice S(V, n) will be cumbersome, technically, the elements
    program statement fragments. It is much simpler to list the statement fragment
    numbers in P(G), so we make the following change.


    # Definition


    Given a program *P* and a program graph *G(P)* in which statements and statement
    fragments are numbered, and a set *V* of variables in *P*, the static, backward
    slice on the variable set *V* at statement *n*, written *S(V, n)*, is the node
    of all statement fragments in *P* that contribute to the values of variables *V*
    at statement *n*.


    The idea of program slicing is to separate a program into components that have
    some useful (functional) meaning. Another refinement is whether or not a program
    slice is executable. Adding all the declaration statements and other necessary
    statements clearly increases the size of a slice, but the full version can be
    compiled and separately executed and tested. For such compilable slices "sliced"
    together (Gallagher and Lyle, 1991) as a bottom-up way to develop a program. As
    a test of diction, Gallagher and Lyle suggest the term "slice slicing." In a sense,
    this is a precursor to agile programming. The alternative is to just consider
    program fragments, for space and clarity considerations. Eventually, we will develop
    a


