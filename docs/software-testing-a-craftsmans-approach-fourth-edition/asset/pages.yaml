  md: '# 13.2.1 Pairwise Integration


    The idea behind pairwise integration is to eliminate the stub/driver development
    effort. Instead of developing stubs and/or drivers, why not use the actual code?
    At first, this sounds like big integration, but we restrict a session to only
    a few units in the call graph. The result is that we have one integration test
    for each edge in the call graph. Pairwise integration results in an increased
    number of sessions when a node (unit) is used by two or more other units. In the
    Calendar example, there would be 15 sessions for top-down integration (one for
    each stub replacement); this increases to 19 sessions for pairwise integration
    (one for each edge in the call graph). This is offset by a reduction in stub/driver
    development. Three pairwise integration sessions are shown in Figure 13.9.


    The main advantage of pairwise integration is the high degree of fault isolation.
    If a test fails, the fault must be in one of the two units. The biggest drawback
    is that, for units involved on several pairs, a fix that works in one pair may
    not work in another pair. This is yet another example of the testing pendulum
    discussed in Chapter 10. Call graph integration is slightly better than the decomposition
    tree-based approach, but can be removed from the reality of the code being tested.


    # 13.2.2 Neighborhood Integration


    We can let the mathematics carry us further by borrowing the notion of a neighborhood
    from topology (which is a branch of topology). The neighborhood of a node in a
    graph is the set of nodes that are one edge away from the given node. (Technically,
    this is a neighborhood of radius 1; in larger systems, it makes sense to increase
    the neighborhood radius.) In a directed graph, this includes all the predecessor
    nodes and all the immediate successor nodes (notice that these are the set of
    stubs and drivers of the node). The neighborhoods of getDate, Friday13th, and
    weekDay are shown in Figure 13.10.


    The 15 Neighborhoods for the Calendar example (based on the call graph in Figure
    13.7) are listed in Table 13.1. To make the table simpler, the original unit names
    are replaced by node numbers (in Figure 13.11), where the numbering is generally
    breadth first. The juxtaposition and connectivity is preserved in Figure 13.11.


    The information in Table 13.1 is given in Table 13.2 as the adjacency matrix for
    the call graph. The column sums show the indegrees of each node, and the row sums
    show the outdegrees.


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_267_0.png)


    Figure 13.9 Three pairs for pairwise integration.'
