  md: 'The individual members in a marking can be thought of as snapshots of the executing
    EDPN in discrete points in time; these members are alternatively referred to as
    time steps, p-tuples, or marking vectors. This lets us think of time as an ordering
    that allows us to recognize “before” and “after.” If we attach instantaneous time
    as an attribute of port events, data places, and transitions, we obtain a much
    clearer picture of thread behavior. One awkward part of this is to treat tokens
    in a port output event place. Port output places always have outdegree = 0; in
    an ordinary Petri net, tokens cannot be removed from a marking with a zero outdegree.
    If the tokens in a port output event place persist, this suggests that the event
    occurs indefinitely. Here, the time attribute resolves the confusion: time we
    need a denote of the marked output event. (Another possibility is to remove tokens
    from a marked output event place after one time step; this works reasonably well).


    # 4.3.5 StateCharts


    David Harel had two goals when he developed the StateChart notation: he wanted
    to devise a visual notation that could mimic the ability of Venn diagrams to express
    hierarchy and the ability of directed graphs to express connectedness (Harel,
    1988). Taken together, these capabilities provide an elegant answer to the “state
    explosion” problem of finite state machines. The result is a highly sophisticated
    and precise notation that is supported by commercially available CASE tools, notably
    the StateMate system. StateCharts are now the control model of choice for the
    Unified Modeling Language (UML) from IBM. (See http://www-306.ibm.com/software/rational/uml
    for more details).


    Harel uses the methodology term “blob” to describe the basic building block of
    a StateChart. Blobs can contain other blobs in the same way that Venn diagrams
    show set containment. Blobs can be connected to other blobs with edges in the
    same way that directed graphs show connectedness. In Figure 4.11, blob A contains
    two blobs (B and C), and they are connected by edges. Blob A is also connected
    to blob D by an edge.


    As Harel intends, we interpret blobs as states and transitions. The full StateChart
    system supports an elaborate language that defines how and when transitions occur
    (their training course runs for a full week, so this section is a highly simplified
    introduction). StateCharts are executable in a much elaborate way than ordinary
    finite state machines. Executing a StateChart requires a notion similar to Petri
    nets. The “initial state” of a StateChart is indicated by an edge that has no
    source state.


    When states are nested within others, the indication is used to show the lower-initial
    state. In Figure 4.12, state A is the initial state and when it is entered, state
    B is also entered at the lower level. When a state is entered, we can think of
    it as active in a way analogous to a marked place in a Petri net. (The StateChart
    tool uses colors to show which states are active, and this is equivalent to marking
    places in a Petri net.) A subtlety exists in Figure 4.12, the transition


