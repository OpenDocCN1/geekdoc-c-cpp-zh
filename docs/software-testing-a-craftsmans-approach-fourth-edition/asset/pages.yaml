    #  14.4.2 An Industrial Test Execution System


    This section describes a system for automatic test execution that I was responsible
    for in the early 1980s. Since it was intended for executing regression test cases
    (a very boring manual assignment), it was named the Automatic Regression Testing
    System (ARTS). This is as close as I came to the art world. The ARTS system had
    a human readable test case language that was preemptively executed on a personal
    computer. In the ARTS language, there were two verbs: CAUSE would cause a poor
    input event to occur, and VERIFY would observe a output event. In addition, a
    tester could refer to a limited number of devices and to a limited number of input
    events associated with those devices. Here is a paraphrased excerpt of a typical
    ARTS test case.


    CAUSE Go-Offook On Line 4

    VERIFY Dialtone On Line 4

    CAUSE TouchDigit ''3'' On Line 4

    VERIFY NoDialtone On Line 4'
