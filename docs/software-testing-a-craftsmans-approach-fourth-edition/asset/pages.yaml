  md: '# 20.2 A Closer Look at the NIST Study


    Most introductory logic courses discuss a class of arguments known as informal
    fallacies. One of

    these, the Fallacy of Extension, occurs when an argument is extended from a simple
    to an extreme

    situation where it is easier to persuade the point to be made. The conclusion
    is then brought back

    to the simple case. The Fallacy of Extension most commonly occurs when someone
    is asking for

    special consideration, and the response is something like "What if we let EVERYONE
    have that

    exception?"


    There is an element of the Fallacy of Extension in the myriad of papers that emphasize
    how

    All Pairs algorithms compress an enormous number of test cases into a smaller,
    more manageable\sset. While the popular papers consider the NIST study as the
    basis for the All Pairs technique,

    t NIST papers (Wallace and Kuhn, 2000) do not stress this idea of compression;
    rather,

    they stress that faults due to more than two variables are relatively rare (2%
    in the examples we

    studied). Both papers are concerned with describing faults, identifying root causes,
    and suggesting\fair software engineering techniques to find similar faults in
    future systems.


    The closest NIST papers consider to the dominant All Pairs emphasis on test compression

    is when they discuss their analysis of 109 failure reports. They note that, "Only
    three of the

    109 failure reports indicated that more than two conditions were required to cause
    the failure"

    (Wallace and Kuhn, 2000). Further, "The most of these [three failures] involved
    four

    conditions." The conclusion of that part of the report is that ... of the 109
    reports that are

    detailed, 98% showed that the problem could have been detected by testing the
    device with all

    pair of parameter settings." The report notes that most medical devices have "a
    relatively small number of input variables, with each either a small discrete
    set of possible settings or a finite range values." Then the Fallacy of Extension
    occurs. Quoting from Wallace and Kuhn (2000):


    > Medical devices vary among treatment areas, but in general have a relatively
    small number of input variables, with each either a small discrete set of possible
    settings, or a finite range of values. For example, consider a device that has
    20 inputs, with 10 settings, for a total of 10^20 combinations of settings. The
    few hundred test cases that can be built under most development budgets will cover
    less than a tiny fraction of the possible combinations. The number of pairs of
    settings is in fact very small, and since each test case must have a value for
    each of the variables, more than one pair can be included in a single test case.
    Algorithms based on orthogonal squares are available that can generate test data
    for all pairs (or higher order combinations) at a reasonable cost. One method
    makes it possible to cover all pairs of values for this using only 180 test cases
    [8].


    What is really perplexing about this is they preface it with the note that most
    devices only have a few input settings, so the extension to 10^20 cases makes
    little sense.


    # 20.3 Appropriate Applications for All Pairs Testing


    Table 20.9 presents two considerations that help determine whether All Pairs is
    appropriate for a given application. The first consideration is whether the application
    is static or dynamic. Static applications are in which all inputs are available
    before calculation begins. David Harel refers to such applications as "transformational"
    because they transform their inputs into output'
