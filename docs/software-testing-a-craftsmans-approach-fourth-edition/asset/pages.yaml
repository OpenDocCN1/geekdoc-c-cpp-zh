  md: 'Recall simplification that the slice $V(n)$ is a slice on one variable; the
    slice $V$ counts of a single variable, $v$. If statement fragment $n$ is a defining
    node for $v$, then $n$ is included in the slice. If statement fragment $n$ is
    a usage node for $v$, then $n$ is not included in the slice. If a statement is
    both a defining and a usage node, then it is included in the slice. In a static
    slice, P-uses and C-uses of other (not the $v$ in the slice-set $V$) are included
    to the extent that their execution affects the variable $v$. As a guideline, if
    the value of $v$ is whether a statement fragment is included or excluded, exclude
    the statement fragment.


    L-use and I-use variables are typically invisible outside their units, but this
    hardly precludes the problems such variables often create. Another judgment call:
    here (with some peril), we choose to exclude them from the intent of “contribute.”
    Thus, O-use, L-use, and I-use nodes are excluded from slices.


