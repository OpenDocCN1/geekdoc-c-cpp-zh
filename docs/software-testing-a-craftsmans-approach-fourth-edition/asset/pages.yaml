    # 15.1.4 Implications of Polymorphism


    The essence of polymorphism is that the same method applies to different objects.
    Considering classes as unites implies that any issues of polymorphism will be
    covered by the class/unit testing. Again, the redundancy of testing polymorphic
    operations sacrifices hoped-for economies.


    # 15.1.5 Levels of Object-Oriented Testing


    Three or four levels of object-oriented testing are used, depending on the choice
    of which constitutes a unit. If individual objects or methods are considered to
    be units, we have four levels: operation/method, class, integration, and system
    testing. With this choice, operation/method testing is identical to unit testing
    of procedural software. Class and integration testing can be renamed as intraclass
    and interclass testing. The second level, then, consists of testing interactions
    among previously tested operations/methods. Integration testing, which we will
    see the major issue of object-oriented testing, must be concerned with testing
    interactions among previously tested classes. Finally, system testing is conducted
    at the port event level, and is (or should) identical to system testing of traditional
    software. The only difference is where system-level test cases originate.


    # 15.1.6 Data Flow Testing for Object-Oriented Software


    When we considered data flow testing in Chapter 9, it was restricted to a single
    unit. The issues of inheritance and composition require a deeper view. The emerging
    concerns in the object-oriented testing community is that some of data flow “should”
    address these special needs. In Chapter 9, we saw that data flow testing is based
    on identifying define and use nodes in the program graph of a unit and then considering
    define/use paths. Paths in traditional software complicate this formulation; one
    common work-around is to embed calls into the unit tested (very much like fully
    flattened classes). Later in this chapter (Section 15.4), we develop a revision
    of Event-Dri Petri Nets (EDPNs) that exactly describe data flow among objects.
    Within this formulation, we can express the object-oriented extension of data
    flow testing.'
