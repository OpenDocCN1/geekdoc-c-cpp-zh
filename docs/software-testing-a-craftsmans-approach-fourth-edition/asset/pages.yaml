  md: '# 396 ■ Software Testing


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_426_0.png)


    **Figure 20.1** Combinatorial explosion.


    Given a program with $n$ input variables, the All Pairs technique is a way to
    identify each pair. Mathematically, this is commonly called the number of combinations
    of $n$ things taken two at a time, and is computed by the formula


    > $$C_2 = n! / (2!(n-2)!)$$


    which is for the well-known "combinatorial explosion." The first 20 values of
    $_C_2$ are graphed in Figure 20.1. With the All Pairs technique, for example,
    the 66 pairs of interactions among 12 variables are exercised in a single test
    case.


    Perhaps the most commonly cited example of All Pairs testing was developed by
    Bernie Berger and presented at the STARTEast conference in 2003 (Berger, 2003).
    His paper contains a mortgage application example that has 12 input variables.(In
    a private e-mail, he said that "12" is a simplification.) Berger identified equivalence
    classes for the 12 variables, varying in number between seven variables to two
    classes for six variables. The cross product of the equivalence classes results
    in 725,760 cases. Applying the All Pairs technique, this is reduced to 50 cases—quite
    a reduction.


    The All Pairs technique is supported by a commercial tool, the Automatic Efficient
    Test Generator (AETG) system (Cohen, 1994). It is also supported by a free program
    that is available from James Bach at http://www.satisfice.com. The technique makes
    the following assumptions:


    +   - Meaningful equivalence classes can be identified for each program input.

    - Program inputs are independent.

    - There is no order to program inputs.

    - Faults are due only to the interaction of pairs of program inputs.


    The necessity of each assumption is demonstrated (with counter-examples).


    # 20.1.1 Program Inputs


    As we have seen in earlier chapters, program inputs can be either events or data.
    The All Pairs technique refers only to data; that, inputs are values of variables,
    not events. It is useful to distinguish'
  merge: -1
