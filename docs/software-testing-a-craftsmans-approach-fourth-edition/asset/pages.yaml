  md: 'systems. There are scores of extensions to Petri nets; Peterson grouped these
    together for simplicity. Marked graphs are a formalization of data flow diagrams,
    and Peterson shows them to be formal duals of finite state machines.


    Peterson''s lattice is a good starting point for MBT. Given an application, good
    practice chooses a model that is both necessary and sufficient—neither too weak
    nor too strong. If a model is too weak, important aspects of the application will
    not be modeled, and hence not tested. If a model is too strong, the extra effort
    to develop the model may be unnecessary.


    Peterson''s lattice predates the invention of StateCharts by David Havel, which
    raises the question of where they fit in Peterson''s lattice. They are at least
    equivalent, and probably more expressive than most extensions of Petri nets. Several
    graduate students at Grand State University explored this question, with a variety
    of approaches. Their work is persuasive, but as yet, I have no formal proof of
    this potential equivalence. However, given a relatively complex StateChart, it
    the rich language associated with StateChart transitions will probably be difficult
    to express in most Petri net extensions. One promising approach offered by DeVries
    (2013) is that of "Swim Lane Petri Nets."


    Figure 12.2 shows the anticipated placement of StateCharts in Peterson''s lattice.
    The one-way arrow reflects the fact that a given StateChart can express concurrency
    (by the concurrent regions), and true concurrency cannot be expressed in a Petri
    net, nor in most extensions. Part of the work by DeVries describes Swim Lane Petri
    Nets. We use the UML notion of "swim lanes" to express parallel activities. We
    will revisit this concept in Chapter 17 when we use it to describe interactions
    among constituent systems in systems of systems. We will use some of the prompts
    of the Extended Systems Modeling Language to show-swim lane communication of Event-Driven
    Petri Nets. Figure 12.3 shows the anticipated lattice among Event-Driven Petri
    Nets, Swim Lane Event-Driven Petri Nets, and a subclass of StateCharts.


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_253_0.png)


    Figure 12.2 Placement of StateCharts in Peterson''s lattice.'
