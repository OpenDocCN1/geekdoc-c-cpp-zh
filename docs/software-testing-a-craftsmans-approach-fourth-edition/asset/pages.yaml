  md: '# 14.7.2 Specification-Based Test Coverage


    The model-based approaches to thread identification are clearly useful, but what
    if behavioral model exists for a system to be tested? The testing craftsman has
    two choices: develop a behavioral model or test the system-level analogs of specification-based
    testing. Recall that specification-based test cases are identified, we use information
    from input and output spaces as well as the function itself. We describe system
    testing threads here in coverage metrics that are derived from three of the basic
    concepts (events, ports, and data).


    # 14.7.2.1 Event-Based Thread Testing


    Consider the span of port input events. Five port input thread coverage metrics
    are easily defined. Attaining these levels of system test coverage requires a
    set of threads such that


    +   * Port Input 1: each port input event occurs

    * Port Input 2: common sequences of port input events occurs

    * Port Input 3: each port input event occurs in every "relevant" data context

    * Port Input 4: for a given context, all "inappropriate" input events occurs

    * Port Input 5: for a given context, all possible input events occur


    The Port Input 1 metric is a bare minimum and inadequate for most systems. Port
    Input 2 coverage is the most common, and it corresponds to the intuitive view
    of system testing because it deals with "normal use." It is difficult to quantify,
    however, What is a common sequence of events? What is an uncommon one?

    The three metrics are defined in terms of a "context." The best view of context
    is that it is a point of event sequence. In the SATM system, screen display occur
    at points of event sequence. Port Input 3 metric defines context-sensitive port
    input events. These are physical input events that have logical meanings determined
    by the context within which they occur. In the SATM system, a keystroke on the
    B1 function button occurs in five contexts (screens displayed) and has three different
    metrics. The key to this metric is that it is driven by an event with a context
    and a variety of events. The Port Input 4 and Port Input 5 metrics are converses:
    they start with a context and end with a variety of testers to try to break a
    system. At a given context, they supply unsolicited inappropriate input events
    to see what happens. In the SATM system, for example, what happens if a button
    is pressed during the PIN entry stage? The appropriate events are the digit and
    keystrokes. The inappropriate events are the keystrokes on the B1, B2, and B3
    buttons.

    This is partially a specification problem: we are discussing the difference between
    prescribed behavior (that should happen) and prescribed behavior (that should
    not happen). Requirements specifications have a hard time describing prescribed
    behavior; it is usually testers who found prescribed behavior. The designer who
    maintains my local SATM system may do that when someone inserted a fish sandwich
    in the deposit slot. (Apparently they thought it was a receptacle.) At any rate,
    no the back anticipated insertion of a fish sandwich as a port input event. The
    Port Input 4 and Port Input 5 metrics are very effective, but they one curious
    difficulty. How does the tester know what the expected response should be to prescribed
    input? Are they simply ignored? Should there be an output warning message? Usually,
    it is left to the tester''s intuition. If time permits, this is a powerful point
    of feedback to requirements specification. It is also highly desirable focus for
    rapid prototyping or executable specifications.'
