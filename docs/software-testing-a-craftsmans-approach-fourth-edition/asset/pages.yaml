  md: '# 9.2.3 Slice Splicing


    The commission program is deliberately small, yet it suffices to illustrate the
    idea of "slice slicing." In 9.11 through 9.14, the commission program is split
    into four slices. Statement fragment numbers and the program graphs are as they
    were in Figure 9.1. Slice 1 contains the input loop controlled by the locks variable.
    This is a good starting point because Slice 2 and Slice 3 use the loop to get
    input values for stocks and barrels, respectively. Slice 1, 2, and 3 each minute
    in a value of sales, which is the starting point for Slice 4, which computes the
    bases on the value of sales.


    This is overkill for this small example; however, the idea extends perfectly to
    larger programs. It also illustrates the basis for program comprehension needed
    in software maintenance. Slices allow the maintenance programmer to focus on the
    issues at hand and avoid the extraneous information that would be in du-paths.


