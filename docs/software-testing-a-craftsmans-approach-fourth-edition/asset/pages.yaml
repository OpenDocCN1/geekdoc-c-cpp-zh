    #  9.1.7 Define/Use Test Coverage Metrics


    The whole point of analyzing a program with definition/use paths is to define
    a set of test coverage known as the Raps–Weyuker flow metrics (Raps and Weyuker).
    The first three of these are equivalent to E.F. Miller’s metrics in Chapter 8:
    All-Paths, All-Edges, and All-Nodes. The others require that define and usage
    nodes be identified for all program variables, and that du-paths have been identified
    with respect to each variable. In the following definitions, T is a set of paths
    in the program G(P) of program P, with the set V variables. It is not enough to
    take the cross product of the set of DEF nodes with the set of USE nodes for a
    variable to define du-paths. This mechanical approach can result in infeasible
    paths. In the next definitions, we assume that the define/use paths are feasible.


    # Definition


    The T satisfies the All-Def criterion for the program P if and only for every
    variable v ∈ V, T contains definition-clear paths from every defining node of
    v to use of v.


    # Definition


    The T satisfies the All-Uses criterion for the program P if and only for every
    variable v ∈ V, T contains definition-clear paths from every defining node of
    v to use of v, and to the successor node of each USE(v, n).


    # Definition


    The T satisfies the All-P-Uses/Some C-Uses criterion for the program P if and
    only for every variable v ∈ V, T contains definition-clear paths from every defining
    node of v to every predicate use of v; and if a definition of v has no P-uses,
    a definition-clear path leads to at least one computation.


    © 2010 Taylor & Francis Group, LLC'
