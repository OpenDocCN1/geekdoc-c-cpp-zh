    # 12.2.2 Expressive Capabilities of Mainline Models


    Peterson looked at four mainline models in terms of the kinds of behavioral issues
    that they can represent. The Venn diagram in Figure 12.4 shows his summary.


    # 12.2.3 Modeling Issues


    Much of the information in this subsection is taken from Jorgensen (2009). There
    are two fundamental types of requirements specification models: those that describe
    structure and those that describe behavior. These correspond to two fundamental
    views of a system: what a system *is* and what a system *does*. Data flow diagrams,
    entity/relation models, hierarchy charts, class diagrams, and object diagrams
    all focus on what a system is—the components, their functionality, and interfaces
    among them. They emphasize structure. The second type, including decision tables,
    finite state machines, StateCharts, and Petri nets, describes system behavior—what
    a system does. Models of system behavior have varying degrees of capability, the
    technical equivalent of being able to express *avinaire* in another language.


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_254_1.png)


    +   1. Data flow

    2. Control flow

    3. Conflict

    4. Mutual exclusion

    5. Fair scheduling

    6. Communication

    7. Synchronization


    Figure 12.4 Expressive capabilities in Peterson''s lattice.'
