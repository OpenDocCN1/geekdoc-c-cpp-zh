    # 6.7 Edge Testing


    The ISTQB Advanced Level Syllabus (ISTQB, 2012) describes a hybrid of boundary
    value analysis and equivalence class testing and gives it the name "edge testing."
    The need for this occurs when contiguous ranges of a particular variable constitute
    equivalence classes. Figure 6.2 shows two equivalence classes of valid values
    for xi, and two for xj. Presumably, these classes refer to variables that are
    "treated the same in some application. This suggests that there may be faults
    near the boundaries of the classes, and edge testing will exercise these potential
    faults. For the example in 6.2, a full set of edge testing values are as follows:


    +   - Normal values for xi: [a, a-, b, b+, c-, c+, d-, d+]

    - Robust values for test cases with xi: [a-, a+, b-, b+, c-, c+, d-, d+, d+]

    - Normal values for test cases with xj: [e-, e+, f-, f+, g-, g+, d+}]


    One subtle difference is that edge testing values do not include the nominal values
    that we had with boundary value testing. Once the sets of edge values are determined,
    edge testing can follow any of the four forms of equivalence class testing. The
    number of test cases obviously increase as with the variations of boundary value
    and equivalence class testing.


    # 6.8 Guidelines and Observations


    Now we have gone through three examples, we conclude with some observations about,
    and for guidelines, equivalence class testing.


    +   1. Obviously, the weak forms of equivalence class testing (normal or robust)
    are not as comprehensive as the corresponding strong forms.

    2. If the implementation language is strongly typed (and invalid values cause
    run-time errors), it makes no sense to use the robust forms.'
