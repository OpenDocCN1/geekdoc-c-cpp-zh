    # # 5.1.1 Generalizing Boundary Value Analysis


    The basic boundary value analysis technique can be generalized in two ways: by
    the number of variables and the kind of ranges. Generalizing the number of variables
    is easy: if we have a function of n variables, we hold all one at the nominal
    values and the remaining variable assume the min, min+, max-, and max values,
    repeating this for each variable. Thus, for a function of n variables, boundary
    value analysis yields 4n + 1 unique test cases.


    Generalizing ranges depends on the nature (or more precisely, the type) of the
    variables themselves. In the NextDate function, for example, we have variables
    for month, the day, and year. In a FORTRAN-like language, we would likely encode
    this, that January would correspond to 1, February to 2, and so on. In a language
    that supports user-defined types (like Pascal or Ada), we could define the variable
    month as an enumerated type [Jan., Feb., ..., Dec.]. Either way, the values for
    min, min+, max-, and max are clear from the context. When a variable has discrete,
    bounded values, enumerated as in the commission problem have, min, min+, max-,
