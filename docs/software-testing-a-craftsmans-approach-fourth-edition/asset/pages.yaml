  md: '# A Closer Look at All Pairs Testing 397


    between physical and logical variables, as in Chapter 10, Table 10.13. As a guideline,
    physical variables are usually associated with some unit of measure, such as velocity,
    altitude, temperature, or mass. Logical variables are seldom associated with units
    of measure; instead, they usually refer to some enumerated type, such as a telephone
    directory number or an employee identification number. It is usually easier to
    identify equivalence classes for logical variables.


    As a counter-example, consider the triangle program. The three sides, a, b, and
    c, are all integers and arbitrarily bounded by 1 ≤ side ≤ 200. The sides are physical
    variables, measured in some unit of length. What equivalence classes apply to
    a, b, and c? Only the robust equivalence classes that deal with invalid input
    values of:


    ```

    EqClass1(side) = {x: x is an integer and x < 1} (invalid values)

    EqClass2(side) = {x: x is an integer and 1 ≤ x ≤ 200} (valid values)

    EqClass3(side) = {x: x is an integer and x > 200} (invalid values)

    ```


    The actual Notepad input file to Bahr''s allpairs program


    ```

    side a b c

    a < 1 b < 1 c < 1

    1 ≤ a ≤ 200 1 ≤ b ≤ 200 1 ≤ c ≤ 200

    a > 200 b > 200 c > 200

    ```


    An interested tester might postulate equivalence classes such as one in which
    exactly two sides are equal, but such on triples of triangle input, not on individual
    variables. Table 20.1 contains the allpairs.exe output generated for these equivalence
    classes; the actual test cases are in Table 20.2.


    As expected from the allpairs.exe output, there is never opportunity to choose
    values for the sides that correspond to an actual triangle. Because six of the
    nine equivalence classes with invalid values, this only exercises data validity,
    not correct function with valid values.


