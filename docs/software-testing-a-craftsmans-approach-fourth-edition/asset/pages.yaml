  md: '# Chapter 21


    # Evaluating Test Cases


    > Quis custodiet ips custodes?

    Juvenal (Satire VI, lines 347–8)

    ca. late 1st century, a.d.


    Just as the Roman satirist Juvenal asked who would guard the guards, no matter
    how carefully a set of tests is developed, software testers should ask how good
    are their test cases. Edsger Dijkstra observed that testing can detect the presence
    of faults but can never assert their absence. Who tests the cases? More precisely,
    how can a set of test cases be tested? One answer has been around for more than
    30 years—mutation testing. A more recent addition, “fuzzing,” is closer to random
    testing. The idea that fishing crew counts as an estimate of test case success
    is both novel and successful. We take a brief look at all three approaches in
    this chapter.


    # 21.1 Mutation Testing


    A story persists, now considered to be an urban legend, about an early space program
    error in a FORTRAN program in which a period was used instead of comma (Myers,
    1976). The statement was (supposedly) a statement like


    ```

    DO 20 I=0,100,2

    ```


    that was entered as DO 20, I=0,100,2, which should have defined a Do-loop terminating
    at statement number 20 in which the loop index, I, was to vary from 0 to 100 in
    steps of 2. Other versions have the blanks being eliminated, creating an assignment
    statement


    ```

    DO201 = 100,2

    ```


    With the typographical error, the loop used the default increment of 1. Supposedly,
    this error caused a Mariner probe to Venus to fail. This kind of fault could have
    been caught by mutation testing.'
