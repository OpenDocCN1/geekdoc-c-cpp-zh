    propositions. Propositions can be simple or compound, where a compound proposition
    contains at least one logical connective. Propositions are also called predicates,
    the that E.F. Miller uses.


    # 8.3.3.3 Coupled Conditions (per Chilenski)


    Two (or more) conditions are coupled if changing one also changes the other).

    When conditions are coupled, it may not be possible to vary individual conditions,
    because the coupled condition(s) might also change. Chilenski notes that conditions
    can be strongly or weakly coupled. In a strongly coupled triplet, changing one
    condition may change one other coupled condition, but not the third one. Chilenski
    offers these examples:


    In ((x = 0) AND A) OR (x != 0 AND B)), the conditions (x = 0) and (x != 0) are
    strongly coupled.

    In (x = 1) OR (x = 2) OR (x = 3)), the three conditions are weakly coupled.'
