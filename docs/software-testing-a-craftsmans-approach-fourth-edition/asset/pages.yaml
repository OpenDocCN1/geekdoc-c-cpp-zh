    # 18.3 Observations and Conclusions


    James Bach maintains that anyone who tests software does a certain amount of exploratory
    testing. It is more accurate to say that debugging one''s own code is exploratory
    testing. Because the descriptions of these forms of testing are general, it is
    difficult to draw precise conclusions about here. Here are mine:


    +   1. Exploratory testing is appropriate, but difficult, in an agile programming
    environment. The whole idea of follow-up tests based on the outcome of previous
    tests presumes a complete application.


    +   2. Exploratory testing is inherently dependent on the domain experience of
    the tester. By analogy, how effectively could a computer science professor conduct
    an oral examination for a history major?'
  merge: -1
