    are called Extended Entry Decision Tables (EEDTs). We will see examples of both
    types for the NextDate problem. Decision tables are deliberately declarative (as
    opposed to imperative); no particular order is implied by the conditions, and
    selected actions do not occur in any particular order.


    # 7.2 Decision Table Techniques


    To identify test cases with decision tables, we interpret conditions as inputs
    and actions as outputs. Sometimes conditions end referring to equivalence classes
    of inputs, and actions refer to major functional processing portions of the test
    item. The rules are interpreted as test cases. Because the decision table can
    mechanically be forced to be complete, we have some assurance that we will have
    a comprehensive set of test cases. Several techniques that produce decision tables
    are more useful to testers. One helpful style is to add an action to show when
    a rule is logically impossible. In the decision table in Table 7.2, we see examples
    of don''t care and impossible rule cases. If the integers a, b, and c do not constitute
    a triangle, we do not even care about possible


