  md: '# Chapter 19


    # Test-Driven Development


    “Pick a little, talk a little, pick a little, talk a little, pick, pick, pick,
    talk a lot, pick a little more.”


    from Meredith Wilson''s musical, The Music Man!


    If we replace “pick” with “test” and “talk” with “code,” the song captures the
    essence of Test-Driven Development: write tests and code in small, incremental,
    alternating steps. A test case is written first-and, and in the absence of the
    corresponding code, the test case fails when executed. Immediately, just enough
    code is written so that the test case will pass. (Note hence: “pass” means the
    observed outputs are consistent with the expected outputs). As code size increases,
    refactoring is permitted, but all the original tests must still pass (otherwise
    the refactoring is faulty!). Test-Driven Development (or just TDD for short) has
    become very popular in the agile programming community. Here we take a closer
    look at the process, using our standby example, the NextDate program.


    # 19.1 Test-Driven-Code Cycles


    Test-Driven Development has matured to the point where there are both commercial
    and free tools to support the process. Two of the tenets of Extreme Programming
    are clearly present in TDD: doing just enough (the “You Aren’t Going to Need It”
    directive) and always having a working, albeit possibly incomplete, version of
    the program. Time to follow the example carefully. The convention is that source
    code in bold font is what has been added to make the corresponding test case pass.
    Advocates of TDD are quick to claim that fault isolation is almost trivial in
    the TDD process. At any point in the process, all previous test cases must have
    passed. If a new test case fails, the fault can only be in the most recently added
    code. This is generally true, but it is not immediately obvious that it will always
    be true for “deeper” faults, such as those revealed only by flow testing.


