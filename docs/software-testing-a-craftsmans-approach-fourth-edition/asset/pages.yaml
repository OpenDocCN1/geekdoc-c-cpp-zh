    # 11.3.1 Extreme Programming


    Extreme Programming (XP) was first applied to a project (a documented way) in
    1996 by Kent Beck (http://www.extreprogramming.org/) while he was at Chrysler
    Corporation. The clear success of the project, even though it was a revision of
    an earlier version, led to his book (Beck, 2004). The main aspects of XP are captured
    in Figure 11.7. It is clearly customer-driven, as shown by the position of user
    stories driving both a release and system testing. The release plan defines a
    sequence of iterations, each of which delivers a working component. One distinction
    of XP is the emphasis on paired programming, in which a pair of developers work
    closely together, often sharing a single development computer and keyboard. One
    person works at the code level, while the other takes a slightly higher view.
    In a sense, the pair is conducting a continuous review. In Chapter 22, we will
    see that this is better described as a continuous code walkthrough. There are
    many similarities to the basic iterative life cycle shown in Figure 11.3. One
    important difference is that there is no overall preliminary design phase. Why?
    Because this XP were truly driven by a sequence of user stories, it is hard to
    imagine what can occur in the release plan phase.


    # 11.3.2 Test-Driven Development


    Test-driven (TDD) is the extreme case of agility. It is driven by a sequence of
    user stories, as shown in Figure 11.8. A user story can be decomposed into several
    tasks, and this is where the big difference occurs. Before any code is written
    for a task, the developer decides how it will be tested. The tests become the
    specification. The next step is—the tests are run on non-existent code. Naturally,
    they fail, but this leads to the best feature of TDD—greatly simplified


