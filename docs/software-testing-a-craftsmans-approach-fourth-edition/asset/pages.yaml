    out what it must do. With this choice, the wiper becomes the "main program” and
    contains the basic logic of the whole system.


    Another choice might be to make the lever class "smart" object because it knows
    when it is in the INT state. With this choice, when the response to a lever puts
    the lever in the INT state, a method gets the dial status (with a dial message)
    and simply tells the wiper what speed is needed. With this choice, the three classes
    are more tightly coupled, and as a result, less reusable. Another problem occurs
    with this choice: What happens if the lever is in the INT position and a subsequent
    dial event occurs? There would be no reason for the lever to get the new dial
    position, and no message would be sent to the wiper class.


    A third choice might be to make the wiper the main program (as in the first choice),
    but use a Has relation to the lever and dial classes. With this choice, the wiper
    class uses the sense operations of the lever and dial classes to detect physical
    events. This forces the wiper class to be continuously active, in a polling sense,
    as asynchronous events at the lever and dial can be observed.


    Consider these three choices from the standpoint of composition and encapsulation.
    The first choice (cleverly named because it is best) has very little coupling
    among classes. This maximizes the potential of the classes to be reused (i.e.,
    composed in unforeseen ways). For example, a cheaper windshield wiper might omit
    the dial altogether, and an expensive windshield wiper might replace the three-position
    dial with a "continuous" dial. Similar changes might be made to the lever. In
    the two other choices, the increased coupling among the classes reduces their
    ability to be composed. Conclusion: good encapsulation results in classes that
    can more easily be composed (and thus reused) and tested.


    # 15.1.3 Implications of Inheritance


    Although the choice of classes as units seems natural, the role of inheritance
    complicates this choice. If a given class inherits attributes and/or operations
    from super classes, the stand-alone compilation criterion of a unit is sacrificed.
    Binder (1996) suggests "flattened classes" as an answer.'
