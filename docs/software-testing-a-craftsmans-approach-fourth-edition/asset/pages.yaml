    # Definition


    A marking M of an EDPN (P, D, S, In, Out) is a sequence M = <m_1, m_2, ...> of
    p-tuples, where p = k + n, and $k$ and $n$ are the number of elements in the sets
    P and D, and individual entries in a p-tuple indicate the number of tokens in
    the event or data place.


    By convention, we put the places first, followed by the input event places, and
    then the output event places. An EDPN may have any number of markings; each corresponds
    to an execution of the net. Table 4.2 shows a sample mapping of the EDPN in Figure
    4.10.


    The rules for enabling and firing in EDPN are exact analogues for traditional
    Petri nets; a transition is enabled if there is at least one token in input place;
    when an enabled transition fires, one token is removed from each of its input
    places, and one token is placed in each of its output places. Table 4.3 follows
    the marking sequence given in Table 4.2, showing transitions are enabled and fired.


    The important difference between EDPNs and traditional Petri nets is that event
    quiescence can be broken by creating a token in a port input event place. In traditional
    Petri nets, when no transition is enabled, the net is dead. In EDPNs, when no
    transition is enabled, the net is at a point of event quiescence. (Of course,
    if no event occurs, this is the same as deadlock.) Event quiescence occurs four
    times in the thread in Table 4.3: at m_1, m_3, m_5, and m_7.


    # Table 4.2 Mapping of EDPN in Figure 4.10


    | Tuple | $(p_u, p_v, d_u, d_v)$ | Description |

    |--- | --- | --- |

    | $m_1$ | (0, 0, 1, 0) | Initial condition, in state $d_5$ |

