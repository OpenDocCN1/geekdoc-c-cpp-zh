    # # 3.3 Relations


    Functions are a special case of a relation: both are subsets of some Cartesian
    relation; however, in the case of functions, we have the well-behaved requirement
    that a domain element cannot be associated with more one range element. This is
    borne out in everyday usage: when we say "is a function" of something else, our
    intent is that there is a deterministic relationship present. Not all relationships
    are strictly functional. Consider the mapping between a set of patients and a
    set of physicians. One patient may be treated by several physicians, and one physician
    may treat several patients—a many-to-many mapping.


    # # 3.3.1 Relations among Sets


    # Definition


    Given two sets $A$ and $B$, a relation $R$ is a subset of the Cartesian product
    $A \times B$.

    Two notations are popular; when we wish to speak about the entire relation, we
    just write $R \subseteq A \times B$ for specific elements $a_i, b_j \in B$, we
    write $R_{a,b}$. Most tasks omit treatment of relations; we are interested in
    them because they are essential to data modeling and object-oriented analysis.

    Next, we have to explain an overloaded term—cardinality. Recall that as it applies
    to sets, cardinality refers to the number of elements in a set. Because a relation
    is also a set, we might expect that the cardinality of a relation refers to how
    many ordered pairs are in the set $R \subseteq A \times B$. Unfortunately, this
    is not the case.


    # Definition


    Given two sets $A$ and $B$, a relation $R \subseteq A \times B$, the cardinality
    of relation $R$ is


    +   - One-to-one $R$ is a one-to-one function from $A$ to $B$

    - Many-to-one $R$ is a many-to-one function from $A$ to $B$

    - One-to-many $R$ iff at least one element $a \in A$ is in two ordered pairs in
    $R$, that is $<a, b> \in R$ and $<a, b''> \in R$

    - Many-to-many $R$ iff at least one element $a \in A$ is in two ordered pairs
    in $R$, that is $<a, b> \in R$ and $<a, b''> \in R$ and at least one element $b
    \in B$ is in two ordered pairs in $R$, that is $<a, b> \in R$ and $<a'', b> \in
    R$


    The distinction between functions into and onto their range has an analog in relations—the
    notion of participation.


    # Definition


    Given two sets $A$ and $B$, a relation $R \subseteq A \times B$, the participation
    of relation $R$ is


    +   - Into iff every element of $A$ is in some ordered pair in $R$

    - Partial iff some element of $A$ is not in some ordered pair in $R$

    - Onto iff every element of $B$ is in some ordered pair in $R$

    - Into iff some element of $B$ is not in some ordered pair in R'
