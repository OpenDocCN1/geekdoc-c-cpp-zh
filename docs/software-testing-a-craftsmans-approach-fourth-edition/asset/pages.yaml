    # 1.4 Identifying Test Cases


    Two fundamental approaches are used to identify test cases; traditionally, these
    have been called functional and structural testing. Specification-based and code-based
    are more descriptive names, and they will be used here. Both approaches have several
    distinct test case identification methods; they are generally just calling testing
    methods. They are methodical in the sense that two testers following the same
    "method" will devise very similar (equivalent?) test cases.'
