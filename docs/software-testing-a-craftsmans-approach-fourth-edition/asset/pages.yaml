  md: '# 210 ■ Software Testing


    (decision tables are an exception), and the need for clarity is obvious. The interesting
    part is completeness—all of the successor life cycles assume incompleteness, and
    depend on some form of iteration to gradually arrive at “completeness."


    # 11.2 Testing in Iterative Life Cycles


    Since the early 1980s, practitioners have devised alternatives in response to
    shortcomings of the traditional waterfall model just mentioned. Common to all
    of these alternatives is the shift away from the functional decomposition to an
    emphasis on iteration and composition. Decomposition is a perfect fit to the top-down
    progression of the waterfall model and to the bottom-up testing order, it relies
    on one of the major weaknesses of waterfall development created by Agresti (1986)—the
    need for “perfect foresight.\ Functional decomposition can only be done when the
    system is completely understood, and it promotes analysis to the near exclusion
    of synonyms. The result is a very long separation between requirements specification
    and a completed system, and during this interval, no opportunity is available
    for feedback from the customer. Composition, on the other hand, is closer to the
    way people work: start with something known and understood, then add to it, and
    may remove undesired portions.


    A very nice angle can be applied to positive and negative sculpture. In negative
    sculpture, work proceeds by removing unwanted material, as in the mathematician’s
    view of Michelangelo’s David: with a piece of marble, and simply chip away all
    non-David. Positive sculpture is often done with a pliable medium, such as wax.
    The central shape is approximated, and then wax is edited until the desired shape
    is attained. The wax original is then cast in plaster. After the plaster harden,
    the wax is melted out, and the plaster “negative” is used as a mold for molten
    bronze. Think about the consequences of a mistake: with negative sculpture, the
    whole work must be thrown away and restarted. (A museum in Florence, Italy, contains
    half a dozen false starts to the David.) With positive sculpture, the erroneous
    part is simply removed and replaced. We will see this is the defining essence
    of the agile life cycle models. The centrality of composition in the alternative
    models has a major implication for integration testing.


    # 11.2.1 Waterfall Spin-Offs


    There are three mainline derivatives of the waterfall model: incremental development,
    and the spiral model (Boehm, 1988). Each of these involves a series of increments
    or builds as shown in Figure 11.3. It is important to keep preliminary design
    as an infrequent phase rather than to amortize it across a series of builds. (To
    do so results in unfortunate consequences of design choices made during the early
    builds that are regrettable in later builds.) This single design step cannot be
    done in the evolutionary and spiral models. This is also a limitation of the bottom-up
    agile methods.


    Within a bound, the waterfall phases from detailed design through testing each
    one important difference: system testing is split into two tests—regression and
    progression testing. The main impact of the series of builds is that regression
    testing becomes the goal. The goal of regression testing is to ensure that things
    that worked previously in the build still work with the newly added code. Regression
    testing can either precede or follow integration testing, or possibly in both
    places. Progression testing assumes that regression testing was successful and
    that the new functionality can be tested. (We like to think that the addition
    of new code represents progress, not a regression.) Regression testing is an absolute
    necessity in a series of builds'
