    # 5.6 Random Testing


    At least two decades of discussion of random testing are included in the literature.
    Most of them are interesting, and in a statistical sense, our sample problems
    lend themselves nicely to random testing. The idea is that, rather than always
    choose the min, min+, max-, and max values of a bounded variable, use a random
    generator to pick test case values. This avoids any form of bias in testing. It
    also raises a serious question: how many random test cases are sufficient? Later,
    when we discuss structural test coverage metrics, we will have an elegant answer.
    For now, Tables 5.6 through 5.8 show the results of randomly generated test cases.
