  md: '# Software Testing


    +   - Mastery of the associated techniques

    - The ability to make appropriate choices about tools and techniques

    - Extensive experience with the subject matter

    - A significant history of high-quality work with the subject matter


    Since the days of Duran and Deming, portions of the software development community
    have been focused on quality. Software quality is desirable; however, it is hard
    to define, and still harder to measure. Simply listing quality attributes, as
    simplicity, extensibility, reliability, testability, maintainability, etc., begs
    the question. The -ability attributes are all similarly hard to define and measure.
    The process community claims that a good result in quality software, but this
    will be hard to prove. Can quality software be developed in an ad hoc process?
    And the agile community believes this. Do standards guarantee software quality?
    This, too, seems problematic. I can imagine a program that conforms to some set
    of defined standards, yet is of poor quality. Where does this leave the person
    who seeks quality? I believe craftsmanship is a pretty good answer, and this is
    where excellence comes in. A true craftsman takes pride in his work—he knows he
    has done his best, and this results in a sense of pride. Pride in one''s work
    also defines definition, but everyone is honest with himself knows when he has
    done a good job. So we have craftsmanship, pride, and excellence tightly coupled,
    recognizable, yet difficult to define, and to measure, but all are associated
    with the concept of best practices.


    # 23.2 Best Practices of Software Testing


    Any list of claimed practices is subjective and always open to criticism. Here
    is a reasonable list of characteristics of a best practice:


    +   - They are usually defined by practitioners.

    - They are “tried and true.”

    - They are very dependent on the subject matter.

    - They have a significant history of success.


    The software development community has a long history of proposed “solutions”
    to the difficulties of software development. In his famous 1986 paper, “No Silver
    Bullet,” Fred Brooks suggested that the software community will never find a single
    technology that will kill the werewolf of software development difficulties (Brooks,
    1986). Here is a partial list of “best practices,” each of which was intended
    as a silver bullet. The list is in approximate chronological order.


    +   - High-level programming languages (FORTRAN and COBOL)

    - Structured programming

    - Third-generation programming languages

    - Software reviews and inspections

    - The waterfall model of the software development life cycle

    - Fourth-generation programming languages (domain specific)

    - The object-oriented paradigm

    - Various replacements for the waterfall

    - Rapid prototyping'
