  md: '# 8.4.1 McCabe’s Basis Path Method


    Figure 8.10 is taken from McCabe (1982). It is a directed graph that we might
    take to be the program graph (the DD-path graph) of some program. For the convenience
    of readers who have encountered this elsewhere (McCabe, 1987; Perry, 1987), the
    original notation for nodes and edges is repeated. (Notice that this is not a
    graph from a structured program: nodes B and C are a loop with two edges, and
    the edge from B to E is a branch into the if-then statement in D, E, and F). The
    program has a single entry (A) and a single exit (G). McCabe based his view of
    testing on a result from graph theory, which states that the cyclomatic number
    (Chapter 4) of a strongly connected graph is the number of linearly independent
    circuits in the graph. (A circuit is similar to a chain: no internal loops or
    decisions occur, but the initial node is the terminal node. A circuit is a set
    of 3-connected nodes.)


    We can always create a strongly connected graph by adding an edge from the (very)
    sink node to the (very) source node. Notice that, if the single-entry, single-exit
    precept is violated, we greatly increase the cyclomatic number we need to add
    edges from each sink node to each source node. The right side of Figure 8.10 shows
    the result of doing this; it also contains labels that are used in the discussion
    that follows.


    Some confusion exists in the literature about the correct formula for cyclomatic
    complexity, while others use the formula $V(G) = e - n + 2p$; everyone agrees
    that $e$ is the number of nodes, and $p$ is the number of connected regions. The
    confusion apparently comes from the transformation of an arbitrary directed graph
    (such as the one in Figure 8.10, left side) to a strongly connected, directed
    graph obtained by adding one edge from the sink to the source node (as in Figure
    8.10, right side). Adding an edge clearly affects value computed by the formula,
    but it should not affect the number of circuits. Counting or not the added edges
    changes the coefficient of p. Since p is usually 1, the extra edge means we move
    from $2p$ to $p$. Here is a way to resolve the apparent inconsistency. The number
    of linearly independent paths from the source to the sink node on the left side
    of Figure 8.10


    $V(G) = e - n + 2p$

    $= 10 - 7 + 2(1) = 5$


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_180_0.png)


    Figure 8.10 McCabe’s control graph and derived strongly connected graph.'
