  md: "# 16.2.1 Integration-Level Cyclomatic Complexity\n\nCyclomatic complexity at\
    \ the integration level echoes the approach we took at the unit level, now we\
    \ use a call graph instead of a program graph. As before, we need to distinguish\
    \ between strongly connected call graphs and call graphs that are “almost” strongly\
    \ connected. Recall we had two equations for this distinction:\n\n+   (1) $V(G)\
    \ = e - n + p$, for strongly connected call graphs\n(2) $V(G) = e - n + 2p$ for\
    \ call graphs that have a single source node and multiple sink nodes\n\nNote that\
    \ the next definitions apply to to both object-oriented and procedural code. We\
    \ repeat two definitions from Chapter 4 next.\n\n# Definition\n\nGiven the call\
    \ graph of a program (regardless of language paradigm), the *integration-level\
    \ cyclomatic complexity* is the cyclomatic complexity of the call graph.\n\n#\
    \ Definition\n\nGiven a directed graph $G$ with $n$ nodes, its *adjacency matrix*\
    \ is the $n \times n$ matrix $A = (a_{i,j})$, where $a_{i,j} = 1$ if there is\
    \ an edge from node $i$ to node $j$, 0 otherwise.\n\nAs we saw in Chapter 4, all\
    \ the information in a directed graph can be derived from its (unique!) adjacency\
    \ matrix, except for the geometric placement of nodes and edges. For example,\
    \ the sum of elements in row $i$ of node $n$; the sum of elements in column $n$\
    \ is the indegree of node $n$. The sum of the indegrees and outdegrees a node\
    \ is the degree of the node. Since every edge contributes to the outdegree of\
    \ some node, this, turn, together with the number of nodes yields the cyclomatic\
    \ complexity $V(G) = edges - nodes + 2p$.\n\nGiven this, many times it is simpler\
    \ to provide an adjacency matrix rather than a drawn call graph. Section 16.3\
    \ develops a full example of unit- and integration-level complexity for a rewritten\
    \ version of NextDate. The call graph of that version is in Figure 16.3, followed\
    \ by its adjacency matrix (Table 16.6).\n\n![](img/caa3a36b6e8a0f28e72c4d26c243e580_369_0.png)\n\
