    customer (or user) understands, and it often borders customer acceptance testing.
    Generally, system testing is functional instead of structural; this is mostly
    due to the lack of higher-level structural notations.


    # 11.1.1 Waterfall Testing


    The waterfall model is closely associated with top-down development and design
    by functional decomposition. The end result of preliminary design is a functional
    decomposition of the entire system into a tree-like structure of functional components.
    With such a decomposition, top-down integration would begin with the main program,
    checking the calls to the next-level units, and so on until the levels of the
    decomposition are reached. At each point, lower-level units are replaced by stubs—throwaway
    code that replaces what the lower-level would when called. Bottom-up integration
    is the opposite sequence, starting with the leaf units and working toward the
    main program, units at higher levels are replaced by drivers (another form of
    throwaway code) that emulate the procedure calls. The “big bang” approach simply
    puts all the units together at once, without stubs or drivers. Whichever approach
    is taken, the goal of traditional integration testing is to integrate previously
    units with respect to the functional decomposition tree. Although this describes
    integration testing as process, discussions of this type offer little information
    about the methods or techniques. We return to this in Chapter 13.


    # 11.1.2 Pros and Cons of the Waterfall Model


    In its history since the first publication in 1968, the waterfall model has been
    analyzed and critiqued. The earliest compendium was by Agresti (1986), which stands
    as a good source. Agresti observes that


    +   - The framework fits well with hierarchical management structures.

    - The phases have clearly defined end products (exit criteria), which in turn
    are convenient for project management.

    - The detailed design phase marks the point where individuals responsible for
    unit can work in parallel, thereby shortening the project development interval.


    More importantly, Agresti highlights major limitations of the waterfall model.
    We shall see that those limitations are answered by the derived life cycle models.
    He observes that


    +   - There is a long feedback cycle between requirements specification and system
    testing, in which the customer is absent.

    - The model emphasizes analysis to the near exclusion of synthesis, which first
    occurs at the point of integration testing.

    - Massive parallel development at the unit level may not be sustainable with staffing
    limitations.

    - Most important, “perfect foresight” is required because any faults or omissions
    on the requirements will penetrate through the entire life cycles.


    The “omission” part was particularly troubling to the early waterfall developers.
    As a result, nearly all of the papers of requirements specification demanded consistency,
    completeness, and clarity. Consistency is impossible to demonstrate for most requirements
    specification techniques'
