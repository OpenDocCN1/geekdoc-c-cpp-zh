  md: 'The lower half of Figure 10.2 shows that, for specification-based testing,
    there is a true tradeoff between test case creation effort and test case execution.
    If the testing is automated, as in a Unit Test, this is not a penalty. On the
    code-based side, as methods get more sophisticated, they concurrently generate
    more test cases.


    The bottom line to this discussion is that the combination of specification-based
    and code-based methods depends on the nature of the unit being tested, and this
    is where testers can exhibit craftsmanship.


    # 10.2 Traversing the Pendulum


    We will use the triangle graph to explore some of the lessons of the testing pendulum.
    We begin with the FORTRAN-like version popular in the early literature. We use
    this implementation here, because it is the most frequently used in testing literature
    (Brown and Lipov, 1975; Pressman, 1982). The flowchart from Chapter 2 is repeated
    here in Figure 10.3, and transformed to a directed graph in Figure 10.4. The numbers
    of the flowchart symbols are preserved as node numbers in the program directed
    acyclic graph in Figure 10.4.


    We can begin to see some of the difficulties when we test on a graph. There are
    80 topologically possible paths in Figure 10.4 (and also in Figure 10.3), but
    only 11 of these are feasible; they are listed in Table 10.1. Since this is at
    an abstract end of the testing pendulum, we cannot expect any automated help to
    separate from infeasible paths. The infeasibility is to reduce the Match variable.
    Its intent was to reduce the number of decisions. By incrementing the Match variable
    during eight paths from box 1 to box 7, the logically possible values of Match
    are 0, 1, 2, 3, and 6. The three impossible paths correspond to exactly two pairs
    of sides being equal, by transitivity, is impossible. There are 13 decisions in
    the flowchart, the goal of reducing decisions was missed anyway.


    What suggests this is a FORTRAN-like implementation is, in the early days of FORTRAN
    programming, memory was expensive and computers were relatively slow. A good FORTRAN
    programmer would compute the sum of the pairs (a + b, a + c, and b + c) only once
    and use these again in the decisions checking the triangle inequality (8, 9, 10,
    14, and 19).


    Moving on path testing, we have another problem. The program graph in Figure 10.4
    has a cyclomatic complexity of 14. McCabe''s base path method would allow us to
    find 14 test cases, but there are only 11 feasible paths. This view is too far
    from the semantic meaning of the code.


    Data flow testing will give us valuable insights. Consider du-paths on the Match
    variable. It has four definitions, three uses, and four predicates, so there are
    28 possible du-paths. Looking at the clear-definition paths would be a good start
    to data flow testing. The sides, a, b, and c, have one definition node and use
    nine nodes. All nine du-paths on these variables will be defined. That means very
    little can happen to these variables unless there is an input problem.


    Testing using backward static slices would be a good idea. Although no variable
    for this appears in the original flowchart, we can postulate a variable, triangleType,
    that has the four string values shown in 11, 12, 15, and 20. The first slice to
    test would be S(triangleType, 11), which represents the only value to scale a
    triangle. We would test it with three test cases: (a, b, c) = (3, 4, 5), = (4,
    5, 3), and = (5, 3, 4). These triplets let each variable take on all three possibilities,'
