    Robust boundary value testing is a simple extension of normal boundary value testing:
    in addition to the five boundary value analysis values of a variable, we see what
    happens when the extreme are exceeded by a value slightly greater than the maximum
    (max+) and a value slightly less than the minimum (min-). Robust boundary value
