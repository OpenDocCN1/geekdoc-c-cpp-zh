    # 13.1.2 Bottom–Up Integration


    Bottom-up integration is a "mirror image" to the top-down, with the difference
    that stubs are replaced by driver modules that emulate units at the next level
    up in the tree. (In Figure 13.4, the gray units are drivers.) Bottom-up integration
    begins with the leaves of the decomposition tree, and use a driver version of
    the unit that would normally call it to provide it with test cases. (Note the
    similarity to test driver units at the unit level. As units are tested, the drivers
    are are gradually replaced, until the full decomposition tree has been traversed.
    Less throwaway code exists in bottom-up integration, but the problem of impossible
    interfaces persists.


    Figure 13.5 shows one case where unit (zodiac) can be tested with a driver. In
    this case, the Calendar driver would probably call zodiac with 36 test dates that
    are the day before a cusp date, the cusp date, and the day after the cusp date.
    The cusp date for Gemini is May 21, so the driver would call zodiac three times,
    with May 20, May 21, and May 22. The expected responses would be "Taurus," "Gemini,"
    and "Gemini," respectively. Note how similar this is to the assert mechanism in
    the JUnit (and related test) environments.


