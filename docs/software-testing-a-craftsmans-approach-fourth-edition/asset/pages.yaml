  md: '# 242 ■ Software Testing


    # Definition


    A message is a programming language mechanism by which one unit transfers control
    to another unit, and acquires a response from the other unit.


    Depending on the programming language, messages can be interpreted as subroutine
    invocations, procedure calls, function references, and the usual messages in an
    object-oriented programming language. We follow the convention that the unit that
    receives a message (the message destination) always returns control to the message
    source. Messages can pass data to other units. We can finally make the definitions
    for path-based integration testing. Our goal is to have an integration testing
    analog of DD-paths.


    # Definition


    An MM-path is an interleaved sequence of module execution paths and messages.
    The basic idea of an MM-path (Jorgensen 1985; Jorgensen and Erickson 1994) is
    that we can now describe sequences of module execution paths that include transfers
    of control among separate units. In traditional software, "MM" is nicely understood
    as module-message; in object-oriented software, it is clearer to interpret "MM"
    as method-message. These transfers are by messages, therefore, MM-paths always
    represent feasible paths, and these paths cross boundaries. The hypothetical example
    in Figure 13.12 shows an MM-path (the solid edges) in which module A calls module
    B, which in turn calls module C. Notice that, for traditional (procedural) software,
    MM-paths will always begin (in and end) in the main program.


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_272_0.png)


    Figure 13.12 Hypothetical MM-path across three units.'
