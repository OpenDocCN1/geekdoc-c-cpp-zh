    # 9.2 Style and Technique


    When we analyze a program in terms of interesting slices, while disregarding unrelated
    parts. We could not do with du-paths—they are sequences that include statements
    and variables that may be of interest. Before discussing some analytic techniques,
    we will first look at "good style". We have built these stylistic precepts into
    the definitions, but then the definitions are more restrictive than necessary.


    +   1. Never make a slice $S(V, n)$ for which variables $v$ of $V$ do not appear
    in statement fragment $n$. This possibility is-permitted by the definition of
    a slice, but it is bad practice. As an example, we define a slice on the locks
    at variable 27. Defining such slices necessitates tracking the values of all variables
    at all points in the program.

    2. Make slices on one variable. The slice $V$ in slice $S(V, n)$ can contain several
    variables, and sometimes such slices are useful.


    ```

    $V = [lockSales, stockSales, barrelSales]$

    ```


    contains all the elements of the slice $S_{30}$: $S(sales, 27)$ except statement
    27.'
