    Boehm, 1981). This is a remarkable comparison as it relates data from three diverse
    organizations.

    (As a curious footnote, the GTE AEL project closest to the Acceptance phase is
    the project for which I prepared data on Dr. Boehm''s project) The cost is a logarithmic
    scale, and the straight line of best fit reveals that correction costs increase
    exponentially with time.


    As early as 1982, Roger Pressman (Pressman, 1982) used a defect amplification
    method that was presented in a case at the IBM Systems Sciences. The model describes
    how defects from one waterfall phase might be amplified in a following phase.
    Some defects might be simply passed through, and others might be amplified by
    work in the successor phase. The defects then form their own waterfall, somewhat
    probably not intended by the waterfall method. The report continues by postulating
    a defect detection step in which technical inspections detect the age of defects
    before they can be passed to successor phases. Pressman presents a hypothetical
    example showing two versions of a waterfall-based software development—one with
    technical inspections and one without. The result: 12 defects without reviews
    were reduced to 3 after reviews a widely agreed-upon fact—reduces cost and consequently
    the overall development cost.


    More recently, Karl Wieners (1995) reports that, in an unnamed German company,
    correcting defects by testing was 14.5 times the cost to find the problem in an
    inspection, and this grew to 68 times if it was reported by a customer. Wieners
    continues with an updated IBM statistic: correcting defects found in a relaxed
    project was 45 times the cost if the defect was fixed at design time. He asserts
    that, while technical inspections may constitute 5%–15% of total project cost,
    Jet Propulsion Laboratory estimated a net savings of $7.5 million from 300 inspections
    performed on software they produced for NASA” and “another company report annual
    savings of $2.5 million.” One last Wieners stated: in an unnamed company, the
    cost to fix a defect by inspection was $146 compared with the cost to fix a defect
    found by customer: $2900, resulting in a cost/benefit ratio of 0.0503.


