    # 8.3.2.5 Dependent pairs of DD-Paths


    Identification of dependencies must be made at the code level. This cannot be
    done just by programming graphs. The $C_d$ metric foreshadows the debt of Chapter
    9—data flow testing. The most common dependency among pairs of DD-paths is the
    definition/reference relationship, in which a variable is defined (receives a
    value) in one DD-path and is referenced in another DD-path. The importance of
    these dependencies is that they are related to the problem of infeasible paths.
    We have good examples of dependent pairs of DD-paths: in Figure 8.5, C and H are
    such a pair, as DD-paths D and H. The variable ISTriangle is set to TRUE at node
    C, and FALSE at node D. Node H is the branch when ISTriangle TRUE the condition
    at node F. Any path containing nodes D and H is infeasible. Simple DD-path coverage
