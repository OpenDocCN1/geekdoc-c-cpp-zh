  md: '# Chapter 13


    # # Integration Testing


    In September 1999, the Mars Climate Orbiter mission failed after successfully
    traveling 416 million miles in 41 weeks. It disappeared just as it was to begin
    Mars. The fault should have been revealed by integration testing: Lockheed Martin
    Astronautics used acceleration data in English units (pounds), while the Jet Propulsion
    Laboratory did its calculations with metric units (newtons). NASA announced a
    $50,000 project to discover how this could have happened (Fahlahl, 1999). They
    should have revealed this chapter.


    Of the three distinct levels of software testing—unit, integration, and system—integration
    is the least understood of these; in practice, it is the phase most poorly done.
    This chapter explores two mainline and one less-known integration testing strategies.
    They are illustrated with a continuing procedural example, discussed in detail,
    and critiqued with respect to their advantages and disadvantages.


    Craftspeople are recognized by two essential characteristics: they have a deep
    knowledge of the tools of their trade, and they have a similar knowledge of the
    medium in which they work so that they understand their tools in terms of how
    they work with the medium. In Chapters 5 through 10, we focused on the tools (techniques)
    available to the crafterson at the unit level. Our goal was to understand testing
    techniques in terms of their advantages and limitations with respect to particular
    types of software. Here, we continue our approach on model-based testing, with
    the goal of improving the crafterson''s judgment through a better understanding
    of three underlying models. Integration testing for object-oriented software is
    integrated into this chapter.


    # ## 13.1 Decomposition-Based Integration


    Mainline introductory software engineering texts, for example, Pressman (2005)
    and Schach (2002), typically present four integration strategies based on the
    functional decomposition of the procedural software: top–down, bottom–up, sandwich,
    and the vividly “big bang.” Many classic software testing texts echo this approach,
    Deutsch (1982), Herzel (1988), Kaner et al. (1993), and Mosley (1993), to name
    a few. Each of these strategies (except big bang) describes the order in which
    units are to be integrated. We can dispense with the big bang'
