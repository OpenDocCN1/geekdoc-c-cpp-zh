  md: '# Data Flow Testing ■ 161


    # Definition


    A definition-clear path with respect to a variable v (denoted dc-path) is a definition/use
    path in PATHS(P) with initial and final nodes DEF(v, m) and USE(v, n) such that
    no other node in the path is a defining node of v.


    Testers should notice how these definitions capture the essence of computing with
    stored data values. Du-paths and dc-paths describe the flow of data across source
    statements from points at which the values are defined to points at which the
    values are used. Du-paths that are not clear are potential trouble spots. One
    of the main values of du-paths is identify points for variable "watches" and breakpoints
    where code is developed in an Integrated Development Environment. Figure 9.3 illustrates
    this well later in the chapter.


    # 9.1.1 Example


    We will use the commission problem and its program graph to illustrate these definitions.
    The numbered pseudocode and its corresponding program graph are shown in Figure
    9.1. This program computes the commission on the sales of the total numbers of
    locks, stocks, and barrels. While the loop is a classic controlled loop in which
    a value of -1 signifies the end of the sales data. The totals are accumulated
    as the data values are read in the loop. After printing this preliminary information,
    the value is computed, using the constant items defined at the beginning of the
    program. The sales value is used to compute the commission in the conditional
    portion of the program.


    Figure 9.2 shows the decision-decision path (DD-path) of the program graph in
    Figure 9.1. More compression exists in this DD-path because of the increased compression
    in the commission problem. Table 9.1 lists the statement fragments aggregated
    with DD-paths. Some DD-paths (per definition in Chapter 8) are complex: to simplify
    the graph. We will need this layer to visualize the differences between DD-paths,
    du-paths, and program slices.


    Table 9.2 lists the definition and usage nodes for the variables in the commission
    problem. We use this information in conjunction with the program graph in Figure
    9.1 to identify various definition/use and ending-clear paths. It is a judgment
    whether nonexecutable statements should be considered constant and variable declaration
    statements should be considered defining nodes. Nodes that are not interesting
    when we follow what happens along du-paths; but if something is wrong, it can
    be helpful to include them. Take your pick. We will refer to the various paths
    as sequences of node numbers.


    Tables 9.3 and 9.4 present some of the du-paths in the commission problem; they
    are identified by their beginning and ending nodes (from Figure 9.1). The third
    column in Table 9.3 indicates whether the du-paths are definition clear.—trivial—for
    example, for lockPrice, stockPrice, and barrel. Others are complex: while the
    loop (node sequence <14, 15, 16, 17, 18, 19, 20>) inputs and accumulates values
    for totalLocks,totalStocks, and totalBarrel, Table 9.3 only shows the details
    for the totalStocks variable. The initial value for totalStocks occurs at node
    11, and it is used at node 17. Thus, the path (11, 17), which consists of the
    node sequence <11, 12, 13, 14, 15, 16, 17>, is definition clear. The path (11,
    22), which consists of the node sequence <11, *>, is not definition clear because
    values of totalStocks are defined at node 11 and (possibly several times at) node
    17. (The asterisk denotes the Kleene star used both in formal logic and regular
    expressions to denote zero or repetitions.)


