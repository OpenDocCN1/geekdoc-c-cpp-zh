  md: '# 298 Software Testing


    A flattened class is an original class expanded to include all the attributes
    operations it inherits. Flattened classes are mildly analogous to the fully flattened
    data flow diagrams of Structured Analysis. (Notice that flattened classes are
    complicated by multiple inheritance, and really complicated by selective and multiple
    selectivity.) Unit testing on a flattened class solves the inheritance problem,
    but it raises another. A flattened class might not be part of a final system,
    so some uncertainty remains. Also, the methods in a flattened class might not
    be sufficient to test the class. The next work-around is to add special-purpose
    test methods. This facilitates class-as-unit testing but raises a problem: a class
    with test methods is not (or should not be) part the delivered system. This is
    perfectly analogous to the question of testing original or instrumented code in
    traditional software. Some ambiguity is also introduced: the test methods could
    also be faulty. What if a test method falsely reports a fault, or incorrectly
    reports success? Test methods are subject to the same false-positive and false-negative
    outcomes as medical experiments. This leads to an unending chain of methods testing
    other methods, much like the attempt to provide external proofs of consistency
    of a formal system.


    Figure 15.2 shows a UML inheritance diagram of our earlier Simple Automated Teller
    Machine (SATM) system: functionality has been added to this better example. Both
    checking and savings accounts have account numbers and balances, and these can
    be accessed and changed. Checking accounts have a per-check processing charge
    that must be deducted from the account balance. Savings accounts draw interest
    that must be calculated and posted on some periodic basis.


    If we did not “flatten” the checkingAccount and savingsAccount classes, we would
    not have access to the balance attributes, and we would not be able to access
    or change the balances. This is clearly unacceptable for unit testing. The “flattened”
    checkingAccount and savingsAccount classes. These are clearly stand-alone units
    that are sensible to test. Solving one problem raises another: with this formulation,
    we would test the getBalance and setBalance operations twice, thereby losing some
    of the hoped-for economies of object orientation.


    | Account |

    | :--- |

    | accountNumber Balance |

    | getBalance() setBalance() |


    | checkingAccount | savingsAccount |

    | :--- | :--- |

    | checkProcessingCharge checkNumber | interestRate |

    | postCharge() | postInterest() |


    Figure 15.2 UML inheritance.'
