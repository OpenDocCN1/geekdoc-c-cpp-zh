  md: '# # Chapter 18


    # ## Exploratory Testing


    Consider a person admitted to a hospital emergency room (ER) who has trouble breathing.
    The ER physician is tasked with identifying the underlying problem and then devising
    a medical response. How does the ER physician proceed? First, a case history of
    relevant information about the patient is gathered. The next likely step is a
    few broad-spectrum tests that are intended to eliminate common causes of the breathing
    difficulty. Knowledge obtained from one test usually leads to follow-up, more
    specific tests. Throughout this process, the ER physician is guided by extensive
    experience and domain knowledge. This same pattern applies to software testing
    in the process known as exploratory testing.


    # ### 18.1 Exploratory Testing Explained


    Andy Tinkham and Cem Kaner present a concise summary of the work (and people)
    that define exploratory testing (Tinkham and Kaner, 2003). They identify five
    essential characteristics of exploratory testing. It is interactive; it involves
    concurrent cognition and execution; it is highly creative; it tends to produce
    results quickly; and reduces the traditional emphasis on formal test documents.
    The first two characteristics also describe a classic learning system. In testing
    terms, the exploratory tester learns about the system under, and uses this new
    knowledge to explore the system more deeply with more focused tests—very much
    like the professor giving an oral examination. Because exploratory testing is
    also highly creative, it is difficult to describe the process precisely. It clearly
    depends on the attitude and motivation of the tester, and it also depends on the
    nature of the system under test and the priorities of the system stakeholders.
    One quick example: imagine the differing priorities of a highly reliable telephone
    system versus the extreme time-to-market pressure of an e-commerce application.


    On the surface, exploratory testing seems to a sophisticated approach for the
    special value test discussed in Chapter 5. Here, pun intended, we explore exploratory
    testing, but first, we need to explore the metaphor. One sense of “explore” is
    to investigate the unknown. This sense conj up images of a scientist in a laboratory,
    or of a world explorer. Both images are relevant—think about the contributions
    famous world explorers have made to the world body of knowledge. The Lewis and
    Clark expedition into the Louisiana Purchase is a good example. Thomas Jefferson'
  merge: -1
