    # 16.2.2 Message Traffic Complexity


    As we saw with unit-level complexity, only considering cyclomatic complexity is
    an oversimplification. Just as not all decisions are equal, neither are all interfaces.
    Suppose, for example, that we find one repeatedly sending messages to the same
    destination—clearly this adds to the overall complexity, and we would like to
    consider this in our integration testing. To do this, we use an extended adjacency
    matrix of the call graph. In the extended version, rather than just 1s and 0’s,
    an element shows the number of times a method (or a unit) refers to another method
    (unit). For the Figure 16.3 example, this only happens once, when the Main unit
    calls printDate twice. We would have this extended adjacency matrix.'
