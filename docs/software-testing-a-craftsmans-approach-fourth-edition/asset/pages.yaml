    # 16.4 Object-Oriented Complexity


    The Chidamber/Kemerer (CK) metrics are the best-known metrics for object-oriented
    software (Chidamber and Kemer, 1994). The names for the CK metrics are almost
    self-explanatory; some can be derived from a call graph; others use the unit-level
    complexity discussed in Section 16.2.


    +   - WMC—Weighted Methods per Class

    - DIT—Depth of Inheritance Tree

    - NOC—Number of Child Classes

    - CBO—Coupling between Classes

    - RFC—Response for Class

    - LCOM—Lack of Cohesion on Methods


