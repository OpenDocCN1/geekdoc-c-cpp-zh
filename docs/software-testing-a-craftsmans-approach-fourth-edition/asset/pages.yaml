  md: '# Chapter 4


    # Graph Theory for Testers


    Graph theory is a branch of topology that is sometimes referred to as "rubber
    sheet geometry." Curious, because the rubber sheet parts of topology have little
    to do with graph theory; furthermore, the graphs in graph theory do not involve
    axes, scales, points, and curves as you might expect. Whatever the origin of the
    term, graph theory is probably the most useful part of mathematics for computer
    science—far more useful than calculus—yet it is not commonly taught. Our excursion
    into graph theory will follow a "pure math" spirit in which definitions are as
    devoid of specific interpretations as possible. Postponing interpretations in
    maximum latitude in interpretations later, much like well-defined abstract data
    types promote reuse.


    Two basic kinds of graphs are used: undirected and directed. Because the latter
    is a special case of the former, we begin with undirected graphs. This will allow
    us to inherit many concepts when we get to directed graphs.


    # 4.1 Graphs


    A graph (also known as a linear graph) is an abstract mathematical structure defined
    from two sets—a set of nodes and set of edges that form connections between nodes.
    A computer network is a fine example of a graph. More formally:


    # Definition


    A graph G = (V, E) is composed of a finite (and nonempty) V of nodes and a set
    E of unordered pairs of nodes.


    $V = \{n_1, n_2, \dots, n_m\}$


    and


    $E = \{e_1, e_2, \dots, e_p\}$'
