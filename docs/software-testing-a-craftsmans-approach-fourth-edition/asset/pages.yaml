    # 7.4 Test Cases for the NextDate Function


    The NextDate function was chosen because it illustrates the problem of dependencies
    in the input domain. This makes it a perfect example for decision table-based
    testing, because decision tables can highlight such dependencies. Recall that,
    in Chapter 6, we identified equivalence classes in the input domain of the NextDate
    function. One of the limitations found in Chapter 6 was that indiscriminate selection
    of input values from the equivalence classes resulted in “strange” test cases,
    as finding the date to June 31, 1812. The problem stems from the presumption that
    the variables are independent. If they are, a Cartesian product of the classes
    makes sense. When logical dependencies exist among variables in the input domain,
    these dependencies are lost (suppressed is better) in a Cartesian product. The
    decision table format allows us emphasize such dependencies using the notion of
    the “impossible” action to denote impossible combinations of conditions (which
    are actually impossible rules). In this section, we will make three tries at a
    decision table formulation of the NextDate function.


    # 7.4.1 First Try


    Identifying appropriate conditions and actions presents an opportunity for craftsmanship.
    Suppose we start with a set of equivalence classes close to the one we used in
    Chapter 6.


    ```

    M1 = {month: month has 30 days}

    M2 = {month: month has 31 days}

    M3 = {month: month is February}

    D1 = {day: 1 ≤ day ≤ 28}

    D2 = {day: day = 29}

    D3 = {day: day = 30}

    D4 = {day: day = 31}

    Y1 = {year: year is a leap year}

    Y2 = {year: year is not a leap year}

    ```


    If we wish to highlight impossible combinations, we could make a limited entry
    decision table with the following conditions and actions. (Note that the equivalence
    classes for the year collapse into one condition in Table 7.12).

    This decision table will have 256 rules, many of which will be impossible. If
    we wanted to show these rules were impossible, we might revise our actions to
    the following:


    +   a1: Day invalid for this month

    a2: Cannot happen in a non-leap year

    a3: Compute the next date


