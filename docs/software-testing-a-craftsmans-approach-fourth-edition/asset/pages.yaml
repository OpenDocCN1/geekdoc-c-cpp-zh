    In the case domain, the usual view is that a use case is a full, end-to-end, transaction.
    for the SATM system, full use cases would start and end with screen 1, the Welcome
    screen. In between, some path would occur, either as a specific use case, a path
    in the finite state machine, or as a marking in the full EDPN. The problem with
    this is that there is a large number of paths in either model, and a large number
    of individual use cases. The end-to-end use case is a “long case”. The use cases
    in Chapter 22 (Software Technical Reviews) are short use cases. As a quick example
    of a long use case, consider a story with the following sequence:


    > A customer enters a valid card, followed by a valid PIN entry on the first try.
    The customer selects the Withdraw option, and enters $20 for the withdrawal amount.
    The SATM system dispenses 10 notes and offers the customer a chance to request
    another transaction. The customer declines, the SATM system updates the customer
    account, returns the customer’s ATM card, prints a transaction receipt, and returns
    to the Welcome screen.


    Here we use "short cases", which begin with a port input event and end with a
    port output event. Short use cases must be at the Expanded Essential Use Case
    level, so the pre-postconditions are known. We can then develop sequences of short
    use cases with the connections based on the pre- and postconditions. Short use
    case B can follow short case A if the postconditions of A are consistent with
    the preconditions of B. The long use case above might be expressed in terms of
    four short cases:


