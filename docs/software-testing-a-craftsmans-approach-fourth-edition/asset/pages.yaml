  md: '# Chapter 7


    # Decision Table-Based Testing


    All of the functional testing methods, those based on decision tables are the
    most rigorous because of their strong logical basis. Two closely related methods
    are used: cause-and-effect graphing (Elmendorf, 1973; Myers, 1979) and the decision
    tableau method (Mosley, 1993). These are more cumbersome to use and are fully
    redundant with decision tables; both are covered in Mosley (1993). For the curious,
    or for the sake of completeness, Section 7.5 offers a short discussion of cause-and-effect
    graphing.


    # 7.1 Decision Tables


    Decision tables have been used to represent and analyze complex logical relationships
    since the early 1960s. They are ideal for describing situations in which a number
    of combinations of actions are taken over varying sets of conditions. Some of
    the decision table terms are illustrated in Table 7.1.


    A decision table has four portions: the part to the left of the bold vertical
    line is the stub portion; to the right is the entry portion. The part above the
    bold horizontal line is the condition portion, and below is the action portion.
    Thus, we can refer to the stub, the condition entries, the entry stub, and the
    action. A column in the entry portion is a rule. Rules indicate which actions
    are, if any, taken for the circumstances indicated in the rule. The decision table
    in Table 7.1, when conditions c1, c2, and c3 are all true, actions a1 and a2 occur.
    When c1 and a2 are both true and c3 is false, then actions a1 and a3 occur. The
    entry for c3 in the rule where c1 is true and c2 is false is called a "don''t"
    entry. The don''t entry has two major interpretations: the condition is irrelevant,
    or the "n/a" symbol for that latter interpretation.


    When we have binary conditions (true/false, yes/no,0/1), the condition portion
    of a decision table is a true table (from propositional logic) that has rotated
    90°. This structure guarantees that we consider every possible combination of
    condition values. When we use decision tables for test case identification, this
    completeness property of a decision table guarantees a form of complete testing.
    Decision tables in which all the conditions are binary are called Limited Entry
    Tables (LETDs). If conditions are allowed to have several values, the resulting
    tables'
