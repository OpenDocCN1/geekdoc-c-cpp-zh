    # 5.1.2 Limitations of Boundary Value Analysis


    Boundary value analysis works well when the program to be tested is a function
    of several independent variables that represent bounded physical quantities. Mathematically,
    the variables need to be described by a true ordering relation, which, for every
    pair <a, b> of a variable, is possible to say that a ≤ b or b ≤ a. (See Chapter
    3 for a detailed definition of ordering relations). Sets of color, for example,
    football teams, do not support ordering; thus, no form of boundary value testing
