    In Pascal, for example, if a variable is defined to be within a certain range,
    values outside that range result in run-time errors that abort normal execution.
    This raises interesting question of implementation philosophy: is it better to
    perform range checking and use exception handling to deal with "robust values,"
    or is it better to stay with strong typing? The exception handling choice mandates
    robustness testing.


    # # 5.3 Worst-Case Boundary Value Testing


    Both forms of boundary value testing, as we said earlier, make the single fault
    assumption of reliability theory. Owinging to their similarity, we treat both
    worst-case boundary value testing and robust worst-case boundary testing in this
    subsection. Rejecting single-fault assumption means that we are interested in
    what happens when one variable has an extreme value. In electronic circuit analysis,
    this is called "worst-case analysis"; we use that here to generate worst-case
    test sets. For each variable, we start with the five-element set that contains
    the min, min+, max-, and max. We take the Cartesian product (see Chapter 3) of
    these sets to generate test cases. The two-variable version of this is shown in
    Figure 5.4.


    Worst-case boundary value testing is clearly more thorough in the sense that boundary
    value analysis cases are a proper subset of worst-case test sets. It represents
    more effort: worst-case testing for a function of n variables generates ⁵ test
    cases, as opposed to 4n + 1 test cases for boundary value analysis.


    Worst-case testing follows the generalization pattern for boundary value analysis.
    It also has its limitations, particularly related to independent input. Probably
    the best application for worst-case testing is where physical variables have many
    interactions, and where failure of the function is extremely costly. For really
    paranoid testing, we could go to robust worst-case testing. This involves the
    Cartesian product of the seven-element sets we used in robustness testing resulting
    in ⁷ test cases. Figure 5.5 shows the robust worst-case test cases for our two-variable
    function.'
