  md: '# Model-Based Testing for Systems of Systems ■ 361


    # 17.4.1.3 Enable, Disable, and Activate


    The Enable prompt expresses the interaction in which one action permits another
    action to occur. There is no requirement that the second action actually occurs,
    just that it may occur. The Petri net in Figure 17.10, the transition labeled
    “controlled action” has two input places. For it to be an enabled transition,
    both its input places must be marked. The place labeled “e/d” can only be marked
    if the enable transition is fired. The controlled action then has one of its prerequisites
    met, but it still needs for the other input place to be marked. When the controlled
    action fires, it marks the e/d place again, so that it remains enabled.


    At a airfield, the air traffic controller selects a runway, and then gives permission
    to arriving aircraft. We can model this with the Enable prompt. Owing to the relationship
    between arriving and departing aircraft, this effectively causes a Disable prompt
    for the aircraft to take off. Since aircraft landings clearly begin and end, this
    can also be interpreted as an Activate prompt. The air traffic controller “activates”
    the landing process.


    The Disable prompt depends on the Petri net conflict. The disable transition and
    the controlled action transitions in Figure 17.10 are in conflict with the e/d
    place. If the disable transition fires, the controlled action transition cannot
    fire. The e/d place acts as anlock between the enable and disable transitions,
    so a controlled action can only be disabled after it has been enabled. The original
    ESML team found that the Enable, Disable sequence occurred so frequently, it acquired
    a name: Activate.


    # 17.4.1.4 Trigger


    The Trigger prompt (Figure 17.11) is a stronger version of the Enable prompt—it
    causes the controlled action to occur immediately. In ordinary language, we could
    say that the effect of Enable is “you may” and that of Trigger is “you, now!”
    Notice that Trigger has the same renewal pattern that we saw with Enable. We could
    modify this if necessary so that Trigger is a one-time action. By removing the
    edge from the controlled action back to the “u” place suffices. The ESML committee
    never made this distinction.


    # 17.4.1.5 Suspend and Resume


    The ESML Suspend and Resume prompts are shown in Figure 17.12. When they occur
    together, their sequence is known as the ESML Pause prompt. Suspend has the same
    interrupting power as the Trigger prompt—it can interrupt an ongoing activity,
    and when the interrupting task is


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_391_0.png)


    Figure 17.10 ESML Enable, Disable, and Activate.'
