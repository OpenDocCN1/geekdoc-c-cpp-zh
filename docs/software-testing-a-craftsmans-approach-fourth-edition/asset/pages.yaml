    # Path Testing


    The distinguishing characteristic of code-based testing methods is that, as the
    name implies, they are all based on the source code of the program tested, and
    not on the specification. Because of this absolute basis, code-based testing methods
    are very amenable to rigorous, mathematical analysis, and useful measurement.
    In this chapter, we examine the two most common forms of path testing. The technology
    behind these has been available since the mid-1970s, and the origins of these
    methods now have companies that market very successful tools that implement the
    techniques. Both techniques start with the program graph; we repeat the improved
    definition from Chapter 4 here.


    # 8.1 Program Graphs


    Definition


    Given a program written in an imperative programming language, its program graph
    is a directed graph in which nodes are statement fragments, and edges represent
    flow of control. (A complete statement is a "default" statement fragment.)


    If i and j are nodes in the program graph, an edge exists from node i to node
    j if and only if the statement fragment corresponding to node j can be executed
    immediately after the statement fragment corresponding to node i.


