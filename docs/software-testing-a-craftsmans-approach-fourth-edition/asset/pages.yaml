  md: "# 10.1 The Test Method Pendulum\n\nAs with many things in life, there is a\
    \ pendulum that swings between two extremes. The test method pendulum swings between\
    \ two extremes of low semantic content—from strictly topological to functional.\
    \ As testing methods move away from the extremes and towards the center, they\
    \ become, at once, more effective and more difficult (see Figure 10.1).\n\nOn\
    \ the code-based side, path-based testing relies on the connectivity of the program\
    \ graph—the semantic meaning of the nodes is lost. A program graph is a purely\
    \ topological abstraction of the code, and is nearly devoid of code meaning—only\
    \ the control flow remains. This gives rise to program paths that can never be\
    \ recognized as infeasible by automated means. Moving to data testing, the kinds\
    \ of dependencies that typically create infeasible paths can often be detected.\
    \ Finally, when viewed in terms of slices, we arrive as close as we can to the\
    \ semantic meaning of the code.\n\nOn the specification-based side, testing only\
    \ on boundary values of the variables is vulnerable to severe gaps and redundancies,\
    \ neither of which can be known in purely specificationbased testing. Equivalence\
    \ class testing uses the \"similar treatment\" idea to identify classes, and in\
    \ doing so, more of the semantic meaning of the specification. Finally, decision\
    \ table testing uses both possible and impossible combinations of conditions,\
    \ derived from the specification, to deal with complex logical considerations.\n\
    \nOn both sides of the dealing pendulum, test case identification becomes easier\
    \ as we move toward the extremes. As testing techniques move toward higher semantic\
    \ meaning, they become more difficult to automate—and more effective. Hmmm could\
    \ it be that, when he wrote \"The Pit and the Pendulum,\" Edgar Allan Poe was\
    \ actually thinking about testing as a pit, and as a pendulum? You decide. Meanwhile,\
    \ these ideas are approximated in Figure 10.2.\n\nThese graphs need some elaboration.\
    \ Starting with program graph testing, notice that the nodes contain absolutely\
    \ no semantic information about the statement fragments—and the edges describe\
    \ whether one fragment can be executed after a predecessor fragment. Paths in\
    \ a\n\n| Code-based testing | Spec-based testing | \n|---|---||\n| Path testing\
    \ | Data flow testing | Slice testing | Decision table testing | Equivalence class\
    \ testing | Boundary value testing |\n| Low semantic content | High semantic content\
    \ | Low semantic content |\n\nFigure 10.1 Test method pendulum."
  merge: -1
