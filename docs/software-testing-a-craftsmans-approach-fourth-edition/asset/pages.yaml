    # ## 16.1.2 Computational Complexity


    Thus far, we have focused on what might be called control complexity, or maybe
    decisional complexity—basically looking at the edges leading nodes in a program
    graph. But what about the nodes themselves? Just as with decisions, all nodes
    are not “created equal.” To explore this, we use the definitions of DD-path and
    DD-path graph method in Chapter 8.


    Recall that DD-path execution is like a sequence of dominoes: once the first statement
    executes, every statement in the DD-path executes, until the next decision is
    reached. At this point, we can begin to think about the length of a DD-path. Since
    a DD-path contains no internal decision-making statements for any program $P$,
    the cyclomatic complexity of $P$ equals the cyclomatic complexity of the DD-path
    graph of $P$. Our problem is now reduced to considering the computational complexity
    of a DD-path, and this is where the Halstead metrics are useful.


    # ## 16.1.2.1 Halstead’s Metrics


    For a given program (DD-path), consider the operators and operands in the program
    code. Operators include the usual arithmetic and logical operators, as well as
    built-in functions such as square root. Operands are identifiers. The Halstead
    metrics are based on the following quantities, derived from the source code of
    the program (DD-path):


    +   - The number of distinct operators, $n_1$

    - The number of distinct operands, $n_2$

    - The total number of operators, $N_1$

    - The total number of operands, $N_2$


    On the basis of these, Halstead defines


    +   - Program length as $N = N_1 + N_2$

    - Program vocabulary as $n = n_1 + n_2$

    - Program volume as $V = N \log_2(n)$

    - Program difficulty as $D = (n_1, N_2)/2n_2$'
