  md: '# 9.1.8 Define/Use Testing for Object-Oriented Code


    All of the define/use definitions far make no mention of where the variable is
    defined and where it is. In a procedural code, this is usually assumed to be within
    a unit, but it can introduce calls to improperly coupled units. We might make
    this distinction by referring to these definitions as "context free"; that is,
    the places where variables are defined and are independent. The object-oriented
    paradigm changes this—we must now consider the define and use locations with class
    aggregation, inheritance, dynamic binding, and polymorphism. The bottom line is
    that data flow testing for object-oriented code moves from the unit level to the
    integration level.


    # 9.2 Slice-Based Testing


    Program slices have surfaced and merged in software engineering literature since
    the early 1980s. They were proposed in Mark Weiser''s dissertation in 1979 (Weiser,
    1979), made more generally available in Weiser (1985), as an approach to software
    maintenance in Gallagher and Lyle (1991), and more recently used to quantify functional
    cohesion in Biem (1994). During the early 1990s, there was a flurry of published
    activity on slices, including a paper (Ball and Eick, 1994) describing a program
    to visualize program slices. This latter paper describes a tool used in industry.
    (Note that it took about 20 years to move a seminal idea into industrial practice.)


    Part of the utility and versatility of program slices is due to the nature, intuitively
    clear of the concept. However, a program slice is a set of program statements
    that contributes to, or affects the value of a variable, at some point in a program.
    This notion of slice corresponds to other disciplines as well. We may study history
    in terms of slices—US history, European history, Russian history, East history,
    Roman history, and so on. The such historical slices turn out to be very analogous
    to the program slices interact.


    We will start by growing our working definition of a program slice. We continue
    with the notation we used for define/use paths: a program $P$ that has a program
    graph $G(P)$ and a set of program variables $V$. The first tries refine the definition
    in Gallagher and Lyle (1991) to allow nodes in $P(G)$ to refer to statement fragments


    # Definition


    Given a program $P$ and a set $V$ of variables in $P$, a *slice* on the variable
    set $V$ at statement $n$, $S(V, n)$, is the set of all statement fragments in
    $P$ that contribute to the values of variables in $V$ at node $n$.


    One simplifying notion—or in discussion, the set $V$ of variables consists of
    a single variable, $v$. Extending this to more than one is obvious and cumbersome.
    For sets more than one, we just take the union of all the slices on the individual
    variables of $V$. There are two basic questions about program slices, whether
    they are backward or forward slices, and whether they are static or dynamic. Backward
    slices refer to statement fragments that contribute to the value of $v$ at statement
    $n$. Forward slices refer to all the program statements that are affected by the
    value of $v$ and statement $n$. This is one place where the define/use notions
    are helpful. In a backward slice $S(v, n)$, statement $n$ is nicely understood
    as a Use node of the variable $v$, however, Forward slices are not as easily described,
    but they certainly depend on predicate uses and computations of the variable $v$.'
