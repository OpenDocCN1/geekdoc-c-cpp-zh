    program graph are all topologically possible—in fact, they can be generated mathematically
    with Marshall''s algorithm. The problem is that the set of topologically possible
    paths includes both feasible and infeasible paths, as we discussed in Chapter
    8. Moving in the direction of McCabe''s base path testing adds a little semantic
    content. The recommended starting point is a mainline path that represents common
    functionality. The basis path runs into trouble after due to the heuristic of
    simply ''flattening'' ''decisions'' as they are encountered on the starting point
    path. This also leads to the possibility of infeasible paths. When moving to the
    define/use domain, we use more semantic meaning. We follow where values of variables
    are defined and used. The distinction between du-paths and definition-clear paths
    gives the even more semantic information. Finally, backward slices do two things,
    they eliminate unwanted detail, and focus attention exactly where it needed—all
    the statements affecting the value of a variable at a given point in a program.
    The program slicing literature contains extensive discussions of automatic slicing
    algorithms that are beyond the scope of this book.


    On the specification-based side, the various forms of boundary value testing are
    shown as the most abstract. All test cases are derived from properties of the
    input space with absolutely no consideration about how the values are used in
    the unit code. When moving to equivalence class testing, the prime factor that
    determines a class is the "similar treatment" principle. Clearly, this moves in
    the direction of semantic meaning. From equivalence class testing to decision
    table testing is usually done for two reasons: the presence of dependencies among
    the variables and the possibility of impossible combinations.


