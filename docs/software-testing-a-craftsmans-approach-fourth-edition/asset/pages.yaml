  md: "# 408 Software Testing\n\nThe term mutant is borrowed from biology, where it\
    \ refers to a small variation of an original organism. Mutation testing begins\
    \ with a unit and a set of test cases for that unit, such that all the test cases\
    \ pass when. Then a small change is made to the original unit, and the test cases\
    \ are run on the mutant. If all test cases pass, we know that the mutant was undetected.\
    \ At this point there are two possibilities—either the change resulted in a logically\
    \ equivalent program, or the set of test cases was incapable of detecting the\
    \ change. This raises one of the problems of mutation testing—identification of\
    \ equivalent mutants. We need some definitions to frame this discussion.\n\n#\
    \ 21.1 Formalizing Program Mutation\n\n# Definition\n\nA mutant P' of a program\
    \ P is the result of making a change to the source code of the original program\
    \ P.\nMutation testing uses small changes, usually only one, to the source code\
    \ of P. Mutation testing begins when there is a set T test cases of P such that,\
    \ for every case t ∈ T, the test passes; specifically, the expected output of\
    \ P executing t matches the observed output. The point of mutation testing is\
    \ to see if the set T detects the small changes in any mutant.\n\n# Definition\n\
    \nGiven a program P, a mutant P', of a set of test cases T such that every t ∈\
    \ T passes for P, the mutant P' is killed if at least one test t ∈ T fails.\n\n\
    # Definition\n\nGiven a program P, a mutant P', of a set of test cases T such\
    \ that every t ∈ T passes both for P and for P', the mutant P' is considered to\
    \ be a live mutant.\n mutants are the hardest part of mutation. There are only\
    \ two possibilities—either a live mutant P' is logically equivalent to P, or the\
    \ test cases in T are not sufficient to reveal the difference. Why is this a problem?\
    \ If P and P' are logically equivalent formally is undecidable. At this point,\
    \ the theory of mutation testing develops guidelines that involve ratios of the\
    \ number of killed mutants to the total number of mutants (which includes an undecidable\
    \ number of equivalent mutants).\n\n# Definition\n\nSuppose a program P, and a\
    \ set M of mutations of P, and a set of test cases T results in x killed mutants\
    \ out of y total in M. The ratio x/y is the mutation score of P with respect to\
    \ M.\nHigher values of mutation score increase the confidence in the utility of\
    \ the original test T. At this point, it is clear that there is a large amount\
    \ of computation associated with mutation. Until recently, the computational size\
    \ relegated mutation testing to the status of an academic curiosity. At this writing,\
    \ there are a few tools available; most are freeware."
  merge: -1
  pgno: 438
