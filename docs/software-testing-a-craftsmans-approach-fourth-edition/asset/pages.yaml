  md: '# Chapter 15


    # Object-Oriented Testing


    Both theoretical and practical work on the testing of object-oriented software
    has flourished since the second half of the 1990s, leading to the clear dominance
    of the paradigm in 2013. One of the original hopes for object-oriented software
    was that objects could be reused without modification or additional testing. This
    was based on the assumption that well-conceived objects encapsulate functions
    and "that belong together," and once such objects are developed and tested, they
    become reusable components. The new consensus is that there is little reason for
    this optimism—object-oriented software has potentially more severe testing problems
    than those for traditional framework. On the positive side, the Unified Modeling
    Language (UML) is clearly the de facto framework for object-oriented software
    development.


    # 15.1 Issues in Testing Object-Oriented Software


    Our goal in this section is to identify the testing issues raised by object-oriented
    software. First, we have the question of levels of testing: this, in turn, requires
    clarification of object-oriented units. Next, we consider some of the implications
    of the strategy of composition (as opposed to functional decomposition). Object-oriented
    software is characterized by inheritance, encapsulation, and polymorphism; therefore,
    we look at how traditional testing can be extended to address the implications
    of these issues. In the remaining sections, we examine class testing, integration,
    system testing, UML-based testing, and the application of data flow testing to
    object-oriented software. We will do this using the object-oriented calendar version
    of the integrationNext procedural example and the windshield wiper controller


    # 15.1.1 Units for Object-Oriented Testing


    Traditional software has a variety of definitions for "unit." Two that pertain
    to object-oriented software are


    +   - A unit is the smallest software component that can be compiled and executed.

    - A unit is a software component that would never be assigned to more than one
    designer to develop.'
