    # 17.3.3 Testing


    Testing for systems of systems must focus on the ways in which constituent systems
    communicate. Just as integration testing presses complete unit-level testing,
    the testing of systems of systems must ensure that the constituent systems have
    been thoroughly tested as stand-alone components. The SysML dialect models are
    only general guidelines for systems testing. The primary goal of testing for systems
    of systems is to focus on the communication among constituents. In this section,
    we develop a set of primitives that describe the type of communication among constituent
    systems. They will be presented as Petri nets, and we will use them to describe
    the control distinctions that are the essence of the four levels of cooperation
    (directed, acknowledged, voluntary, or virtual).


    # 17.4 Communication Primitives for Systems of Systems


    The distinctions among the four types of systems of systems reduce to the manner
    in which the constituents communicate with each other. In this section, we map
    the primitives of the Extended Systems Modeling Language (ESML) into Swim Lane
    Petri Nets. In 17.5, we use the Petri net forms of the ESML primitives in swim
    lanes to illustrate the communication mechanisms of the four types of systems
    of systems. We understand swim lanes to be device oriented, to represent constituent
    systems and the ESML primitives to represent the types of communication among
    constituents. In Section 17.6, we illustrate the systems of systems communication
    using Swim Lane Event-Driven Petri Nets on the November 1993 incident.


    The first candidate for a set of communication primitives is the set of ESML primitives.
    Most of these express the power of the central controlling constituent, they are
    clearly applicable to directed systems of systems, and probably also to acknowledged
    systems of systems. We need similar primitives for the collaborative and virtual
    systems of systems. Here we propose new primitives: Request, Accept, Reject, and
    Postpone.


    # 17.4.1 ESML Prompts as Petri Nets


    The ESML real-time extension to a data flow diagram (Bruyn et al., 1988) was developed
    as a way to describe how one activity in a data flow diagram can control another
    activity. There are five'
  merge: -1
  pgno: 389
- img_proc: true
  md: '# 360 ■ Software Testing


    basic ESML prompts: Enable, Disable, Trigger, Suspend, Resume, and they are most
    appropriate to directed and acknowledged systems of systems. Two others are pairs
    of the original five: Activate is an Enable followed by a Disable, and Pause is
    a Suspend followed by a Resume. The ESML prompts are represented as traditional
    Petri nets and briefly described in this section. The marking and firing of Petri
    nets are described in Chapter 4.


    # 17.4.1.1 Petri Net Conflict


    We describe the Petri net conflict first because it appears in some of the ESML
    prompts. Figure 17.8 shows the basic Petri net conflict pattern—the place p2 is
    an input to both the function 1 and function 2 transitions. Three places are marked,
    so both transitions are enabled, in the Petri net sense. (“Enabling” is an overloaded
    term—the ESML refers to a prompt, and the Petri net sense refers to a property
    of a transition.) If we choose to fire the function 1 transition, the tokens in
    places p1 and p2 are consumed, and this disables the function 2 transition, hence
    the conflict.


    In the air traffic management and control example, two constituents, arriving
    and departing aircraft, both use the same runway, putting them in contention for
    the limited resource—a good example of Petri net conflict. Since arriving aircraft
    have preference over departing aircraft, we have an instance of the interlock
    mechanism described next.


    # 17.4.1.2 Petri Net Interlock


    An interlock is used to ensure that one action precedes (or has priority over)
    another. In Petri nets, this is accomplished by an interlock place, labeled “i”
    in Figure 17.9 that is an output of the preferred transition and is an input to
    the secondary transition. The only way the interlock place is marked is for the
    transition to fire.


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_390_0.png)


