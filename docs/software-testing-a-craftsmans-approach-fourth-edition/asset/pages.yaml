  md: '# Table 8.1 Miller''s Test Coverage Metrics


    | Metric | Description of Coverage |

    | --- | --- |

    | C$_0$ | Every statement |

    | C$_1$ | Every DD-path |

    | C$_{1p}$ | Every predicate to each outcome |

    | C$_2$ | C$_1$ coverage + loop coverage |

    | C$_d$ | C$_1$ coverage + every dependent pair of DD-paths |

    | C$_{MCC}$ | Multiple condition coverage |

    | C$_{ik}$ | Every program path that contains up to $k$ repetitions of a loop
    (usually $k=2$) |

    | C$_{stat}$ | “Statistically significant” fraction of paths |

    | C$_\infty$ | All possible execution paths |


    Statement coverage is generally viewed as the bare minimum. If some statements
    have not been executed by the set of test cases, there is clearly a severe gap
    in the test coverage. Although adequate statement coverage metric ($C_0$) is still
    widely accepted: it is mandated by ANSI (American National Standards Institute)
    Standard 187B and has been used successfully throughout IBM since the mid-1970s.


    # 8.3.2.2 DD-Path Testing


    When every DD-path is traversed (the $C_1$ metric), we know that every predicate
    outcome has been executed; this amounts to traversing every edge in the DD-path
    graph (or program graph). Therefore, the $C_1$ metric is exactly our $G_{chain}$
    metric.


    For if-then and if-else statements, this means that both the true and the false
    branches are covered ($C_{ip}$ coverage). For CASE statements, each clause is
    covered. Beyond this, it is useful to ask how we test a DD-path. Longer DD-paths
    generally represent complex computations, which we can consider as individual
    functions. For such paths, it may be appropriate to apply a number of function
    tests, especially for boundary and special values.


    # 8.3.2.3 Simple Loop Testing


    The $C_2$ metric requires DD-path coverage (the $C_1$ metric) plus loop testing.
    The simple view of loop testing is that every loop involves a decision, and the
    other is to exit (or not enter) the loop. This is carefully proved in Huang (1979).
    Notice that this is equivalent to the $G_{edge}$ test coverage.


