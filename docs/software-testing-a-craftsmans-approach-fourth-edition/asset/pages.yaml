  md: '# 14.4.4 Converting Use Cases to Event-Driven Petri Nets


    Event-Driven Petri Nets (EDPNs) were defined in Chapter 4. They were originally
    developed for use in telephone switching systems. As the name implies, they are
    appropriate for any event-driven system, particularly those characterized by content-sensitive
    port input events. In an EDPN drawing, port events are shown as triangles, data
    places are circles, transitions are narrow rect-angles, and the input and output
    connections are arrows. In an attempt at human factors design,


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_299_0.png)


    Figure 14.10 Event-Driven Petri Net for correct PIN on first try.'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# 270 ■ Software Testing


    EDPN diagrams show input events as a downward pointing triangle as if they were
    a funnel. Similarly, output events are upward pointing, as if they were megaphones.
    Figure 14.10 is the EDPN for our continuing example, Correct PIN on First Try.

    Automatic derivation of an EDPN from a use case is partly successful—input events
    can be derived from the input portion of the event sequence, similarly for output
    events. Also, the interleaved order of input and output events can be preserved.
    Finally, the pre- and postconditions are mapped to data places. There are a few
    problems, however.


    +   1. The most obvious is the output event p1 that refers to screen 2 being displayed
    with four blank positions for the PIN to be entered. It is an orphan, in the sense
    that it is not created by a transition.

    2. Transitions are not named. If a person were to develop the EDPN, there would
    likely be descriptive names for the transitions, for example, sl: accept digit.

    3. An immediate case-and-effect connection is presumed. This would fail if two
    outof-sequence input events were required to produce an output event.

    4. There is no provision for intermediate data that may be produced.

    5. The places d1–d5 do not appear in the use case. (They could be derived from
    the finite state, however).


    One answer to this is to follow the lead of formal systems and define the content
    of a “well-formed use case.” At a minimum, a well-formed use case should conform
    to these requirements.


    +   1. The event sequence cannot begin with an output event. This could be considered
    as a precondition.

    2. The event sequence cannot end with an input event. This could be considered
    as a postcondition.

    3. Preconditions must be both necessary and sufficient to the use case. There
    are no superfluous preconditions, and every precondition must be used or needed
    by the use case. Similarly for postconditions.

    4. There must be at least one precondition and at least one postcondition.


    The value in deriving EDPNs from use cases is that, because they are special cases
    of Petri Nets, they inherit a wealth of analytical proximities. Here are some
    analyses that are easy with Petri Nets, and all but impossible with use cases:


    +   1. Interactions among use cases, such as one use case being a prerequisite
    for another

    2. Use cases that are in conflict with others

    3. Context-sensitive input events

    4. Inverse use cases, where one “undoes” the other


    # 14.4.5 Converting Finite State Machines to Event-Driven Petri Nets


    Mathematically, finite state machines are a special case of ordinary Petri Nets
    in which every Petri Net transition has one input place and one output place.
    Since EDPNs are an extension of ordinary Petri Nets, the conversion of finite
    state machines to EDPNs is guaranteed. Figure 14.11 shows a portion of the finite
    state machine in Figure 14.7 converted to an EDPN.


    © 2010 Taylor & Francis Group, LLC'
