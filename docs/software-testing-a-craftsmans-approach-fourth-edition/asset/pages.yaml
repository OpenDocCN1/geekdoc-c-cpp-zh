  md: '# 9.1 Define/Use Testing


    Much of the formalization of define/use testing was done in the early 1980s (Rapps
    and Weyuk, 1985); the definitions in this section are compatible with those in
    Clarke et al. (1989), which summarizes most define/use testing. This body of research
    is very compatible with the formulation we developed in Chapters 4 and 8. It presumes
    a program graph in which nodes are statement fragments (a fragment may be an entire
    statement) and programs that follow the structured preceptions.


    The following definitions refer to a program $P$ that has a program graph $G(P)$
    and a set of program variables $V$. The program graph $G(P)$ is constructed as
    in Chapter 4, with statement fragments and edges that represent node sequences.
    $G(P)$ has a single-entry node and single-exit node. We also discard edges from
    a node to itself. Paths, subpaths, and cycles as they were in Chapter 4. The set
    of all paths in $P$ is PATHS(P).


    # Definition


    Node $n \in G(P)$ is a defining node of the variable $v \in V$, written as $DEF(v,
    n)$, if and only if the value of $v$ is defined as the statement fragment corresponding
    to node $n$.

    Input statements, assignment statements, loop control statements, and procedure
    calls are all examples of statements that are defining nodes. When the code corresponding
    to such statements executes, the contents of the memory location(s) associated
    with the variables are changed.


    # Definition


    Node $n \in G(P)$ is a usage node of the variable $v \in V$, written as $USE(v,
    n)$, if and only if the value of $v$ is used as the statement fragment corresponding
    to node $n$.

    Output statements, assignment statements, conditional statements, loop control
    statements, and procedure calls are all examples of statements that are usage
    nodes. When the code corresponding to such statements executes, the contents of
    the memory location(s) associated with the variables remain unchanged.


    # Definition


    A define/use path with respect to a variable $v$ (denoted du-path) is a path in
    PATHS($P$) such that, for some $v \in V$, there are define and usage nodes $DEF(v,
    m)$ and $USE(v, n)$ such that $m$ and $n$ are the initial and final nodes of the
    path.


    The nodes corresponding to predicate uses always have an outdegree $\ge 2$, and
    nodes corresponding to computation uses always have an outdegree $\le 1$.'
