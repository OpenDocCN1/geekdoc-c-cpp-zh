    # 5.7 Guidelines for Boundary Value Testing


    With the exception of special value testing, the test methods based on the input
    domain of a function (program) are the most rudimentary of any specification-based
    testing methods. They share the common assumption that the input variables are
    truly independent; and when this assumption is not warranted, the methods generate
    unsatisfactory test cases (such as June 31, 1912, for NextDate). Each of these
    methods can be applied to the output range of a program, as we did for the commission
    problem.


    Another use of output-based test cases is for systems that generate error messages.
    The tester should devise test cases to check that error messages are generated
    when they are appropriate, and not falsely generated. Boundary value analysis
    can also be used for internal variables, as loop control variables, and pointers.
    Strictly speaking, these are not input variables; however, errors in the use of
    these variables are quite common. Robustness testing is a good choice for testing
    internal variables.


