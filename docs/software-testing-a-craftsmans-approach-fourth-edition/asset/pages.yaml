  md: '# Chapter 3


    # Discrete Math for Testers


    More than any other life cycle activity, testing lends itself to mathematical
    description and analysis. In this chapter and in the next, testers will find the
    mathematics they need. Following the craftsperson metaphor, the mathematical topics
    presented here are tools; a testing crafterson should know how to use them well.
    With these tools, a tester gains rigor, precision, and efficiency—all of which
    improve testing. The “for testers” part of the chapter title is important: this
    chapter is written for testers who either have a sketchy math background or who
    have forgotten some of the basics. We will likely be annoyed by the informal discussion
    here. Readers who are already comfortable with the topics in this chapter should
    skip to the next chapter and start right in graph theory.

    In general, discrete mathematics is more applicable to functional testing, while
    graph theory pertains more to structural testing. “Discrete” raises a question:
    What might be discrete about mathematics? The mathematical antonym is continuous,
    as in calculus, which software developers (and testers) seldom use. Discrete math
    includes set theory, functions, relations, propositional logic, and probability
    theory, each of which is discussed here.


    # 3.1 Set Theory


