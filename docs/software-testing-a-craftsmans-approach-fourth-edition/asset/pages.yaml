  md: '# Software Testing


    # Definition


    A source ASF is an Atomic System Function that appears as a source node in the
    ASF graph of a system; similarly, a sink ASF is an Atomic System Function that
    appears as a sink node in the ASF graph.

    In the SATM system, the card entry ASF is a source ASF, and the session termination
    ASF is a sink ASF. Notice that intermediary ASFs could never be tested at the
    system level by themselves—they need the predecessor ASFs to “get there.”


    # Definition


    A system thread is a path from a source ASF to a sink ASF in the ASF graph of
    a system.

    These threads provide a coherent set of increasingly broad views of threads, starting
    with very short threads (within a unit) and ending with interactions among system-level
    threads. We can use these views like the ocular on a microscope, switching among
    them to see different levels of granularity. These concepts only part of the problem;
    supporting them is another. We next take a tester''s view of requirements specification
    to see how to identify threads.


    # 14.2 Basis Concepts for Requirements Specification


    Recall the notion of a basis of a vector space: a set of independent elements
    from all the elements in the space can be generated (see problem 9, Chapter 8).
    Instead of anticipating all the variations in scores of requirements specification
    methods, notations, and techniques, we will discuss testing with respect to a
    basis set of requirements constructions: data, actions, events, and threads. Every
    system can be modeled in terms of these fundamental concepts (every requirements
    specification model uses some combination of these). We examine these fundamental
    concepts here to see how they support the tester''s process of thread identification.


    # 14.2.1 Data


    When a system is described in terms of data, the focus is on the information used
    and created by the system. We describe data in terms of variables, data structures,
    records, data stores, and files. Entity/relationship (E/R) models are the most
    common at the highest level, and some form of regular expression (e.g., Jackson
    diagrams or data structures) is used at a more detailed level. The data-centered
    view is also the starting point for several flavors of object-oriented analysis.
    Data refers to information that is initialized, started, updated, or (possibly)
    destroyed. In the SATM system, initial data describes the various accounts (with
    its Personal Number, or PAN) and the PINs, each has a data structure with information
    such as the account balance. As ATM transactions occur, the results are kept as
    data and used in the daily posting of terminal to the central bank. Many data-centered
    views dominate. These systems are often developed in terms of CRUD operations
    (Create, Retrieve, Update, Delete). We could describe the transaction portion
    of the SATM system in this way, but it would not work for the user interface portion.


    Sometimes threads can be identified from the data model. Relationships among data
    entities can be one-to-one, one-to-many, many-to-one, or many-to-many; these distinctions
    have implications for how threads process the data. For example, if bank customers
    have several accounts, each account needs a unique PIN. If several people access
    the same account, they need'
