  md: '# System Testing ■ 257


    ATM cards with identical PANs. We can also find initial data (such as PAN, ExpectedPIN
    pairs) that are read but never written. Read-only data must be part of the system
    initialization process. If not, there must be threads that create such data. Read-only
    data is therefore an indicator of source ASFs.


    # 14.2.2 Actions


    Action-centered modeling is still a common requirements specification form. This
    is a historical growth of the action-centered nature of imperative programming
    languages. Actions have inputs and outputs (port events). These can be either
    data or port events. Here are some methodology-specific synonyms for actions:
    transform, data transform, control transform, process, activity, task, and service.
    Actions can also be decomposed into lower-level actions, most notably in the data
    flow diagrams of Structured Analysis. The input/output view of actions is exactly
    the basis of specification-based testing, and the decomposition (and eventual
    implementation) of actions is the basis of code-based testing.


    # 14.2.3 Devices


    Every system has port devices; these are the sources and destinations of system-level
    inputs and outputs (port events). The slight distinction between ports and port
    devices is sometimes helpful to testers. Technically, a port is the point at which
    an I/O device is attached to a system, as in serial and parallel ports, network
    ports, and phone ports. Physical actions (keystrokes and light emissions from
    a screen) occur on port devices, and these are translated from physical to logical
    (or logical to physical) forms. In the absence of actual port devices, most of
    testing can be accomplished by "moving the port boundary inward toward the logical
    instances of port events. From now on, we will just use the term "port" to refer
    to port devices. The ports in the SATM system include the digit keys, the function
    keys, the display screen, the deposit and withdrawal doors, and several less obvious
    devices, such as the rollers that move cards and deposit envelopes into the machine,
    the cash dispenser, the receipt printer, and so on. (See Figure 14.1 for our working
    example.)


