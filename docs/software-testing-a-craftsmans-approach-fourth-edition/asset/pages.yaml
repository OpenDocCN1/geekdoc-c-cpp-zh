    A set is defined in three ways: by simply listing elements, by giving a decision
    rule, or by constructing a structure from other sets. The listing option works
    well for sets with only a few elements as well as for which elements obey an obvious
    pattern. We used this method in defining M1 above. We might define the set of
    allowable years in the NextDate program as follows:


    ```

