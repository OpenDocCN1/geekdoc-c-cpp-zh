  md: '# Chapter 14


    # System Testing


    Of the three levels of testing, the system level is closest to everyday experience.
    We test many things: a used car before we buy it, an online network service before
    we subscribe, and so on. A common pattern in these familiar forms is that we evaluate
    a product in terms of our expectations—not with respect to a specification or
    a standard. Consequently, the goal is not to find faults but to demonstrate correct
    behavior. Because of this, we tend to approach testing from a specification-based
    standpoint instead of a code-based one. Because it is intuitively familiar, system
    testing in practice tends to be less formal than it might be, and this is compounded
    by the reduced testing interval that usually remains before a delivery deadline.


    The craftsman metaphor continues to serve. We need a better understanding of the
    medium; we begin with a new construct—an Atomic System Function (ASF)—and develop
    the concept, highlighting some of the practical problems of thread-based system
    testing. System testing is closely coupled with requirements specification; therefore,
    we shall use appropriate system-level methods to enable the benefits of model-based
    testing. Common to all of these is the idea of "threads," so we see how to identify
    system-level threads in a variety of common models. All this leads to an orderly
    thread-based system testing strategy that exploits the symbiosis between specification-based
    and code-based testing. We will apply the strategy to our simple teller machine
    (SATM) system, first described in Chapter 2.


    # 14.1 Threads


    Threads are hard to define; in fact, some published definitions are counterproductive,
    misleading, or wrong. It is possible to treat threads as a primitive concept that
    needs no formal definition. For now, we will use examples to develop a "shared
    vision." Here are several views of a thread:


    +   - A scenario of normal usage

    - A system-level test case

    - A stimulus/response pair

    - Behavior that results from a sequence of system-level inputs'
