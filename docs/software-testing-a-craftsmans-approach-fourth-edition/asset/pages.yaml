  md: '# 8.2 DD-Paths


    The best-known form of code-based testing is based on a construct known as a decision-to-decision
    path (DD-path) (Miller, 1977). The name refers to a sequence of statements that,
    in Miller''s words, begins with the "outway" of a decision statement and ends
    with the "inway" of the next decision statement. Internal branches occur in such
    a sequence, the corresponding code is like a row of dominos lined up so when the
    first falls, all rest in the sequence fall. Miller''s original definition works
    well for second-generation languages like FORTRAN II, because decision-making
    statements (e.g., IFs and DO loops) use statement labels to refer to target statements.
    With modern languages (e.g., Pascal, Ada, C, Visual Basic, Java), the notion of
    statement fragments resolves the difficulty of applying Miller''s original definition.
    Otherwise, we end up with graphs in which these statements are more than one DD-path.
    In the ISTQB literature, and also in Great Britain, the DD-path concept is known
    as a "linear code sequence and jump" and is abbreviated by the acronym LCSAJ.
    Same idea, longer name.


    We define paths in terms of nodes in a program graph. In graph theory, these paths
    are called chains, where a chain is a path in which the initial and terminal nodes
    are distinct, and every interior node has indegree = 1 and outdegree = 1. (See
    Chapter 4 for a formal definition). Notice that the initial node is 2-connected
    to every other node in the chain, and no instances of 1 or 3-connected nodes occur,
    as shown in Figure 8.4. The length (number of edges) of the chain in Figure 8.4
    is 6.


    # Definition


    DD-path is a sequence of nodes in a program graph such that


    +   Case 1: It consists of a single node with indeg = 0.

    Case 2: It consists of a single node with outdeg = 0.

    Case 3: It consists of a single node with indeg ≥ 2 or outdeg ≥ 2.

    Case 4: It consists of a single node with indeg = 1 and outdeg = 1.

    Case 5: It is a maximal chain of length ≥ 1.


    Case 1 and 2 establish the unique source and sink nodes of the program graph of
    a structured program as initial and final DD-paths. Case 3 deals with complex
    nodes; it ensures that no node is contained in more than one DD-path. Case 4 is
    needed for "short branches"; it also preserves the one-fragment, one DD-path principle.
    Case 5 is the "normal case," in which a DD-path is a single entry, single-exit
    sequence of nodes (a chain). The "maximal" part of the case 5 definition is used
    to determine the final node of a normal (nontrivial) chain.


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_166_0.png)


    Figure 8.4 Chain of nodes in a directed graph.'
