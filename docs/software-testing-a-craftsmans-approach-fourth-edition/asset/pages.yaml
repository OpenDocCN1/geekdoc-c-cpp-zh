    # 14.9.2 Mathematical Approaches


    In cases, nonfunctional testing cannot be done either directly, indirectly, or
    with commercial tools. There are three forms of analysis that might help—queuing
    theory, reliability models, and simulation.


    # 14.9.2.1 Queuing Theory


    Queuing theory deals with servers and queues of tasks that use the service. The
    mathematics behind queuing theory deals with arrival rates, and service times,
    as well as the number of queues and the number of servers. In everyday life, we
    see examples of queuing: checkout lines in a grocery store, lines to buy tickets
    at a movie theater, or lift lines at a ski area. Some settings, for example, a
    local post office, use a single queue of patrons waiting for service at one of
    several clerk positions. This happens to be the most efficient queuing discipline—single
    queue, multiple server. Service times represent some form of system capacity,
    and queues represent traffic (transactions) offered to the system.


    # 14.9.2.2 Reliability Models


    Reliability models are somewhat related to queuing theory. Reliability deals with
    failure rates of components and characteristics such as likelihood of failure,
    mean time to failure (MTTF), mean time between failures (MTBF), and mean time
    to repair (MTTR). Given actual or assumed failure rates of system components,
    these quantities can be computed.


    A telephone switching system has a reliability requirement of not than two hours
    of downtime in 40 years of continuous operation. This is an availability of 0.9999429,
    or stated negatively, failure rate of $5.7 \times 10^{-6}$ (0.0000057). How can
    this be guaranteed? Reliability models are the first choice. They can be expressed
    as tree diagrams or as directed graphs, similar to the approach used to compute
    an operational profile. These models are based on failure rates of individual
    system components that are linked together physically, and abstractly in the reliability
    model.


    A digital end entered the rural U.S. market to be certified by an agency of the
    U.S. government, the Rural Electric Administration (REA). That body followed a
    compression strategy, and an on-site test for months. If the system functioned
    with less than 30 minutes of downtime, a few months into the interval, the system
    had less than two minutes of downtime. A tornado hit the test and destroyed the
    building that contained the. The REA declared it to be a failure. Only extreme
    pleading resulted in a retest. The second time, there were less than 30 seconds
    of downtime in the six-month interval.


    Reliability models have a solid history of applicability to physical systems,
    but can they be applied to software? Physical components, which in failures drop
    to nearly zero rapidly. This is usually in the Weibull distribution, which shows
    an increase after an interval that represents the useful life of a component.
    The problem is software, even when well tested, does not deteriorate. The main
    difference between reliability models applied to software versus hardware comes
    down to the arrival rate of failures. Testing on operational profiles, and the
    extension to risk-based testing is a good start; however no guarantee the absence
    of faults.


