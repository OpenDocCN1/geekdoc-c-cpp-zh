  md: '# Chapter 20


    # A Closer Look at All

    Pairs Testing


    When it was first introduced, the All Pairs testing possibility was extremely
    popular. According

    to James Bach, more than 40 journal articles and conference papers have been written
    about the

    technique (Bach and Schroeder, 2003). It continues to be discussed in recent books
    on software

    testing, it is is in the ISTQB Advanced Level syllabus, and the practitioner conferences
    continue to

    offer tutorials on All Pairs testing. It is tempting to say that more has been
    written about All Pairs

    testing than known. In this chapter, as the title implies, we take a closer look
    at the All Pairs

    testing technique, answering these questions:


    +   - What is the All Pairs testing?

    - Why is it so popular?

    - When does it work well?

    - When is it not appropriate?


    The chapter ends with recommendations for appropriate use.


    # 20.1 The All Pairs Technique


    The All Pairs testing technique has its origins in statistical design of experiments.
    There, ortho-

    nal arrays are means of generating all pairs of experimental variables such that
    each pair occurs

    with equal probability. Mathematically, the statistical technique derives from
    Latin Squares

    (Mandl, 1985). The NIST papers by Wallace and Kuhn (2000, 2001) captured the attention
    of

    t software development community, particularly the agile community. The papers
    concluded

    that 98% of the defects in software-controlled medical systems were due to the
    interaction of

    pairs of variables.'
