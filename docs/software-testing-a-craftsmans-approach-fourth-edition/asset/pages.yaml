    trout. Suppose, for example, that the Rogue River is stocked with 1000 marked
    trout, and that during the fishing season, the creel report totals are 500 fish
    caught, of which 300 are hatchery trout. The stream management team would conclude
    that 60% of the trout in the Rogue River are hatchery (planted) fish. The total
    populations could be estimated; in this case, the 500 fish caught represent 30%
    of the total population. This approach to estimation assumes that the hatchery
    and wild fish are caught in a uniform way.


    The same idea can be applied to ensure the success of test cases and the number
    of remaining faults. Suppose an organization keeps demographic information on
    the numbers and types of faults found in developed programs. Assuming new programs
    are roughly similar, a set of known faults is added to the “wild code” and then
    the existing set of test cases is run on the “stocked” code. If the set of test
    cases reveals all the inserted faults, the organization can be pretty confident
    that the set of test cases is acceptable. If only half the inserted faults are
    revealed, the number of “wild faults” probably represents only half the total
    number of faults.


    The efficacy of a fault insertion approach clearly assumes that the inserted faults
    is reasonably representative of the demographic profile of the “wild fault” population.


