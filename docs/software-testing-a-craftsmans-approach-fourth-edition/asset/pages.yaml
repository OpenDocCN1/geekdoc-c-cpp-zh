    # Definition


    An event- and message-driven Petri net (EMDPN) is a quadripartite directed graph
    (P, D, M, S, In, Out) composed of four nodes, P, D, M, and S, and two mappings,
    In and Out, where


    +   * P is a set of port events

    D is a set of data places

    M is a set of message places

    S is a set of transitions

    In is a set of ordered pairs (P U D M) × S

    Out is a set of ordered pairs from S × (P U D M)


    We retain the port input and output events because these will occur in event-driven,
    object-oriented applications. Obviously, we still need data places, and we will
    interpret Petri transitions as method execution paths. The new symbol is intended
    to capture the essence of interobject messages:


    They are an output of a method execution path in the sending object.

    They are an input to a method execution path in the receiving object.

    The return is a very subtle output of a method execution path in the receiving
    object.

    The return is an input to a method execution path in the sending object.


    Figure 15.15 shows the only way that the new message place can appear in an EMDPN.
    The EMPDN structure, because it is a directed graph, provides the needed framework
    for data flow analysis of object-oriented software. Recall that data flow analysis
    for procedural code centers on nodes where values are defined and used. In the
    EMDPN framework, data is represented by a data place, an input to or an output
    of a method execution path; therefore, we can now represent the define/use paths
    (du-path) or de-def/use paths (dd-path) in a way very similar to that for procedural
    code. Even though four types of nodes exist, we still have paths among them; so
    we simply ignore the types of nodes in a du-path and focus only on the connectivity.


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_349_0.png)


    Figure 15.15 Message connection between objects.'
