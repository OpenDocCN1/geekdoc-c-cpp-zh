  md: '# 3.4.2 Logical Expressions


    We use logical operators to build logical expressions in exactly the same way
    that we use arithmetic operators to build algebraic expressions. We can specify
    in which operators are applied with the usual conventions in parentheses, or we
    can employ a precedence order (negation first, then conjunction followed by disjunction).
    Given a logical expression, we can always find its truth table by "building up"
    to following the order determined by the parentheses. For example, the expression
    $\sim(p \to q) \wedge (q \to p)$ has the following truth table:


    | $p$ | $p \to q$ | $q \to p$ | $(p \to q) \wedge (q \to p)$ | $\sim(p \to q)
    \wedge (q \to p)$ |

    | --- | --- | --- | --- | --- |

    | T | T | T | T | F |

    | T | F | T | F | T |

    | F | T | T | F | T |

    | F | F | T | T | F |


    # 3.4.3 Logical Equivalence


    The notions of arithmetic equality and identical sets have analogs in propositional
    logic. Notice that the expressions $\sim((p \to q) \wedge (q \to p))$ and $p \oplus
    q$ have identical truth tables. This means that, no matter what truth values are
    given to the base propositions $p$ and $q$, these expressions will always have
    the same truth value. This property can be defined in several ways: we use the
    simplest.


    # Definition


    Two propositions $p$ and $q$ are *logically equivalent* (denoted $p \Leftrightarrow
    q$) iff their truth tables are identical.

    By the way, the curious "iff" abbreviation we have been using for "if and only
    if" is sometimes called the bi-conditional, so the proposition $p \iff q$ is really
    $(p \to q) \wedge (q \to p)$, which is denoted $p \Leftrightarrow q$.


    # Definition


    A proposition that is always true is a *tautology*; a proposition that is always
    false is a *contradiction*. To be a tautology or a contradiction, a proposition
    must contain at least one or two more primitive propositions. We sometimes denote
    a tautology as a proposition $T$, and a contradiction as a proposition $F$. We
    can now state several laws that are direct analogs of the ones for sets.


    | Law | Expression |

    | --- | --- |

    | Identity | $p \wedge T \Leftrightarrow p$ <br> $p \vee F \Leftrightarrow p$
    |

    | Domination | $p \vee T \Leftrightarrow T$ <br> $p \wedge F \Leftrightarrow F$
    |'
