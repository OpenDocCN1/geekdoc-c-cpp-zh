    # # 13.4.1 Decomposition–Based Integration


    The isLeap and lastOfMonth functions are in the first level of decomposition because
    they must be available to both GetDate and IncrementDate. (We could move isLeap
    to be contained within the scope of lastOfMonth.) Pairwise integration based on
    the decomposition in Figure 13.4 is problematic; the isLeap and lastOfMonth are
    never directly called by the Main program, so these integration sessions would
    be empty. Bottom-up pairwise integration starting with isLeap, then lastOfMonth,
    ValidDate, and GetDate would be useful. The pairs involving Main and GetDate,
    IncrementDate, and PrintDate are all useful (but short) sessions. Building stands
    for ValidDate and lastOfMonth would be easy.


    # # 13.4.2 Call–Based Integration


    Pairwise integration based on the call graph in Figure 13.15 is an improvement
    over that for the decomposition-based pairwise integration. Obviously, there are
    no empty integration sessions because edges refer to actual unit references. There
    is still the problem of structs. Sandwich integration is appropriate because this
    example is small. In fact, it lends itself to a build sequence. Build 1 could
    contain Main and PrintDate. Build 2 could contain Main, IncrementDate, lastOfMonth,
    and IncrementDate in addition to the already present PrintDate. Finally, build
    3 would add the remaining units, GetDate and ValidDate.'
