  md: '# 23.4.1 A Mission-Critical Project


    Mission-critical projects have severe reliability and performance constraints,
    and are often characterized by highly complex software. They are usually large
    enough so that no single person can comprehend the full system with all its potential
    interactions.


    # 23.4.2 A Time-Critical Project


    While mission-critical projects may also be time-critical, this section refers
    to those projects that must be completed rapidly. Time-to-market and the associated
    loss of market share are the usual drivers of this project type.


    # 23.4.3 Corrective Maintenance of Legacy Code


    Corrective maintenance is the most common form of software maintenance. It is
    in response to a reported fault. Software maintenance typically represents three-fourths
    of the programming activity in most organizations, and this is exacerbated by
    the pattern that maintenance changes are usually done by someone who did not create
    the code being changed.


