  md: '# Software Technical Reviews ■ 419


    The bottom line? People in development organizations make mistakes, and the earlier
    these are caught, the cheaper they are to resolve. To be effective, reviews need
    both process and reviewer credibility, they must consider human factors. In the
    next sections, we describe the roles in a review; we then look at and compare
    three types of reviews, the materials needed to conduct a thorough review, a time-tested
    review process, and review etiquette. The chapter concludes with a rather surprising
    study done at Grand Valley University.


    # 22.2 Roles in a Review


    In all three types of reviews, there are similar roles. A review team consists
    of the person who developed the work product, a reviewer leader, and a recorder.
    These roles involve some duplication, and in some cases, some may be missing.
    Reviews are an interesting point in a software project where the outcome of each
    type of review is a technical recommendation to the responsible administrator,
    and this is a crucial point at which responsibility transfers defaults to management.


    # 22.2.1 Producer


    As the name implies, this is the person who created the work product being examined.
    The producer is present in the review meeting but may contribute as much as one
    of the reviewers. We all know it is much easier to proof someone else''s work
    than one''s. The same holds true for technical reviews. In Section 22.3, the roles
    that a producer may have in the different types of reviews are discussed. At the
    end of all types of reviews, the producer will be the person who resolves the
    action items identified during the review meeting.


    # 22.2 Review Leader


    Review leaders are responsible for the overall success of the review. They have
    the following duties:


    +   - Schedule the actual review meeting

    - Ensure all members of the review team have the appropriate review materials

    - Conduct the actual review meeting

    - Write the review report


    To do all of this, a review leader must be technically competent, well organized,
    leader-ship, and must be prioritize. Above all, a review leader must be able to
    conduct an orderly, well-paced business meeting. There are lessons to be learned
    from a poorly run business. Meetings are characterized by some or all of the following:


    +   - Participants see them as a waste of time.

    - The wrong people are at the meeting.

    - There is no agenda, or if there is, it is not followed.

    - There is no prior preparation.

    - No issues are easily identified.

    - The discussion is easily side-tracked.

    - Time is spent fixing problems rather than just identifying them.


    © 2010 Taylor & Francis Group, LLC'
  merge: -1
  pgno: 449
- img_proc: true
  md: '# 420 Software Testing


    Any one of these will doom a review meeting, and it is the responsibility of the
    review leader to assure that they do not occur.


    # 22.2.3 Recorder


    Because of connotations with “secretary,” the preferred term for this role is
    review recorder. As the titles imply, the recorder takes notes during the review
    meeting. To do this, recorders must be able to track conversations and write notes
    in parallel—a skill, and not all of us have that ability. It is helpful if recorders
    can write clearly and succinctly because the recorded notes will be the basis
    for the formal review report. It is good practice for the recorder to have a “mini-review”
    in the last few minutes of the meeting to go over the notes to see if anything
    was missed.


    # 22.2.4 Reviewer


    The individual reviewers are responsible for objectively reviewing the work product.
    To do this, they must be technically competent, and should not have any biases
    or irrelevant agendas. The reviewers identify issues and assign a severity level
    to each item. During the review meeting, these issues are discussed, and the severity
    level may be changed by consensus. Before the review meeting, each reviewer submits
    a review ballot that contains the following information:


    +   - Reviewer name

    - Review preparation time

    - A list of issues with severity

    - An overall review disposition recommendation (OK as is, accept with minor rework,
    rework with a new review needed)


    # 22.2.5 Role Duplication


    In smaller organizations, it may be necessary for one person to fill two review
    roles. Here are some common pairings, each possibility:


    +   - Review leader is the producer—this happens in a walkthrough. It is usually
    a poor idea, particularly if the producer is technically insecure

    - Review leader is the recorder—this can work, but it is difficult.

    - Review leader is a reviewer—this works reasonably well, but is very time consuming.


    # 22.3 Types of Reviews


    There are three fundamental types of software reviews: walkthroughs, technical
    inspections, and audits. Each of these is described here, and then compared with
    the others. Before doing that, we clarify reasons to conduct a review. Here is
    a list of frequently given reasons:'
