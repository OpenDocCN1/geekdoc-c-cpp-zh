    # 14.8.2 Risk-Based Testing


    Risk-based testing is a refinement of operational profiles. Just knowing which
    threads are most likely to execute might not be enough. If a malfunction of a
    somewhat obscure thread were to be extremely costly? The cost might be in terms
    of legal penalties, loss of revenue, or difficulty of repair. The basic definition
    of risk is'
