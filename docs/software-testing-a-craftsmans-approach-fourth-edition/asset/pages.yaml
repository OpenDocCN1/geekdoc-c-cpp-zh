  md: '# 334 ■ Software Testing


    The sum of the reduced outdegrees is the number of cattle pens, but this does
    not count the "outside" cattle pen, which makes 8—the cyclomatic complexity of
    the directed graph. The outdegrees can be determined from the source code, eliminating
    the need to draw the directed graph, and per the other tedious tasks. As a guideline,
    a simple loop determines a cattle pen, as the If, If Then, Else statements. Switch
    (Case) statements with $k$ alternatives determines $k-1$ cattle pens. So now finding
    cyclomatic complexity is reduced to determining the reduced outdegrees of all
    decision-making statements in the source code. We can state this as a formal theorem
    (without proof).


    Theorem: Given a directed graph $G$ of $n$ nodes, the cyclomatic complexity $V(G)$
    is given by the sum of the reduced outdegrees of the nodes of $G$ plus 1, is


    ```

    $V(G)=1+\left(\sum_{i=1}^{n}reducedOut(i)\right)$

    ```


    # 16.1.1.3 Decisional Complexity


    Cyclomatic complexity is a start, but it is an oversimplification. Why? Because
    decision-making statements are not equal—compound conditions add complexity. Consider
    the following code fragment from a program that computes the triangle formed by
    three integers, a, b, and c. The fragment applies the triangle inequality that
    requires each side of a triangle is strictly less than the sum of the other two
    sides.


    +   1. If (a < b + c) AND (b < a + c) AND (c < a + b)

    2. Then IsTriangle = True

    3. Else IsTriangle = False

    4. Endif


    The program graph of this fragment is very simple—it has a cyclomatic complexity
    of 2. From a software testing standpoint, we would apply multiple condition testing,
    or we could rewrite the fragment as follows, with the resulting cyclomatic complexity
    of 4:


    +   1. If (a < b + c)

    2. Then If (b < a + c)

    3. Then If (c < a + b)

    4. Then IsTriangle = True

    5. Else IsTriangle = False

    6. EndIf ''(c < a + b)

    7. Else IsTriangle = False

    8. EndIf ''(b < a + c)

    9. Else IsTriangle = False

    10. EndIf ''(a < b + c)


    The program graphs of these fragments are in Figure 16.2. The added complexity
    of compound conditions cannot be determined from a program graph—it must be derived
    from the source code. Doing a full conditional testing analysis for a compound
    condition entails making a truth table in which simple conditions are considered
    as individual propositions, and then finding the truth table of the compound expression.
    For now, we choose to simplify this and define the added complexity of compound
    conditions to be less than the number of simple conditions in the expression.
    Why one? The compound condition creates a unit of cyclomatic complexity, so this
    avoids "double counting."'
