  md: '# Software Testing


    +   3. If error conditions are a high priority, the robust forms are appropriate.

    4. Equivalence class testing is appropriate when input data is defined in terms
    of intervals and sets of discrete values. This is certainly the case when system
    malfunctions can occur for out-of-limit variable values.

    5. Equivalence class testing is strengthened by a hybrid approach with boundary
    value testing. (We can "reuse" the effort made in defining the equivalence classes).

    6. Equivalence class testing is indicated when the program function is complex.
    In some cases, the complexity of the function can help identify useful equivalence
    classes, as in the NextDate function.

    7. Strong equivalence testing makes a presumption that the variables are independent,
    and the corresponding multiplication of test cases raises issues of redundancy.
    If any dependencies occur, they will often generate "error" test cases, as they
    did in the NextDate function. (The decision technique in Chapter 7 resolves this
    problem).

    8. Several trials may be before the "right" equivalence relation is discovered,
    as we saw in the NextDate example. In other cases, there is an "obvious" or "natural"
    equivalence relation. When in doubt, the best bet is to second-guess aspects of
    any reasonable implementation. This is sometimes known as the "competent programmer
    hypothesis."

    9. The difference between the strong and weak forms of equivalence class testing
    is helpful in the distinction between progression and regression testing.


