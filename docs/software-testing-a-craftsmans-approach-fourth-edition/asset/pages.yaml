    Public function isLeap(year) As Boolean

    Dim c1, c2, c3 As Boolean

    Dim year As Integer


    ```

    1 c1 = (year Mod 4 = 0)

    2 c2 = (year Mod 100 = 0)

    3 c3 = (year Mod 400 = 0)

    4 isLeap = False

    5 If ((c1 AND NOT(c2)) OR (c3)) Then

    6 isLeap = True

    7 End If

