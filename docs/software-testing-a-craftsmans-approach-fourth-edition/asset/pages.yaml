    US dollars, or the Quit button. Clicking on the Compute button, results in the
    conversion of the US dollar amount to the equivalent amount in the selected currency.
    Clicking on the Clear button resets the currency selection, the US dollar amount,
    and the current currency amount and the associated label. Clicking on the Quit
    button ends the application. This nicely illustrates a description with UML and
    an object-oriented implementation, which we will use in Chapter 15.


