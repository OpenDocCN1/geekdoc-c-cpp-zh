    may have links other than to the central control point. The control center portion
    leads to three important distinctions that Maier makes regarding the nature of
    cooperation among the constituent systems.


    # Definition (Maier, 1999)


    +   - A directed system of systems is designed, built, and managed for a specific
    purpose.

    - A collaborative system of systems has limited centralized management and control.

    - A virtual system of systems has no centralized management and control.


    The dominant characteristic that distinguishes these categories is the manner
    in which they communicate and control/cooperate. Maier further asserts that there
    are two essential requirements that a potential system of systems must satisfy:


    +   1. The constituent systems must be stand-alone systems in their own right.

    2. Each constituent has administrative independence from the other constituents.


    Maier’s three categories were extended (Lane, 2012) to include a fourth category:
    acknowledged. From most to least controlling, we have directed acknowledged, collaborative,
    and virtual systems of systems.

    Systems of systems (abbreviated as SoC) evolve. The Henryville tornado incident
    began as a virtual system of systems—there was no centralized control point. When
    the Indiana state police arrived, it evolved into a collaborative system of systems.
    By the next morning, the Indiana National Guard had turned a rest area into a
    command center, and it was then an acknowledged system of systems. Why is this
    not a directed system of systems? The constituents are all independent systems
    that can function in their own right, and each has separate administrative control;
    however, as a system of systems, it was never created with that purpose in mind.


    # 17.2 Sample Systems of Systems


    To gain some insight into Maier’s categories of systems of systems, we consider
    one example of each type. The emphasis in this section is how the constituent
    systems communicate, and how they are, or might be, controlled.


