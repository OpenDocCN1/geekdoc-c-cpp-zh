    (as described in the balance request transaction); if the funds in the account
    are insufficient, screen 8 is displayed. If the account balance is sufficient,
    screen 11 is displayed and the money is dispensed. The balance is printed on the
    transaction receipt as it is for a balance request transaction. After the cash
    has been removed, the system displays screen 14.

    When the “No” button is pressed in screens 10, 12, or 14, the system presents
    screen 15 and returns the customer’s ATM card. Once the card is removed you close
    it closely, screen 1 is displayed. When the “Yes” button is pressed in screens
    10, 12, or 14, the system presents screen 5 so the customer can select additional
    transactions.


    # 2.5.2 Discussion


    A surprising amount of information is “buried” in the system description given.
    For instance, if you read it closely you can infer that the terminal only contains
    $10 bills (see screen 7). This textual definition is probably more precise than
    what is usually encountered in practice. The example is deliberately simple (hence
    the name).

    A plethora of questions could be resolved by a list of assumptions. For example,
    there is a borrowing limit? What keeps customers from taking out more than their
    actual balance if they go to several ATM terminals? A lot of start-up questions
    are used: how much cash is initially in the machine? How are new customers added
    to the system? These and other real-world refinements are eliminated to maintain
    simplicity.


