  md: '# Chapter 10


    # Retrospective on Unit Testing


    When should unit testing stop? Here are some possible answers:


    +   1. When you run out of time

    2. When continued testing causes no new failures

    3. When continued testing reveals no new faults

    4. When you cannot think of any new test cases

    5. When you reach a point of diminishing returns

    6. When mandated coverage has been attained

    7. When all faults have been removed


    Unfortunately, the first answer is all too common, and the seventh cannot be guaranteed.
    This leaves the testing crafterson somewhere in the middle. Software reliability
    models provide answers that support the second and third choices; both of these
    have been used with success in industry. The fourth choice is curious: if you
    have followed the precepts and guidelines we have been discussing, this is probably
    a good answer. On the other hand, the reason is due to a lack of motivation, this
    choice as unfortunate as the first. The point of diminishing returns has some
    appeal: it suggests that serious testing has continued, and the discovery of new
    faults has slowed dramatically. Continued testing becomes very expensive and may
    reveal no new faults. If the cost (or risk) of remaining faults can be determined,
    the trade-off is clear. (This is a IF.) We are left with the coverage answer,
    and this is a pretty good one. In this chapter, we will see how using testing
    as a cross-check on functional testing yields powerful results. First, we take
    a broad brush look at the unit testing methods we studied. Metaphorically, this
    is pictured as a pendulum that swings between extremes. Next, we follow one of
    the swings of the pendulum from the most abstract form of code-based testing through
    strongly semantic-based methods, and then back toward the very abstract shades
    of specification-based testing. We do this methods with this tour with the triangle
    program. After that, some recommendations for both forms of unit testing, followed
    by another case study—this time of an automobile insurance example.'
