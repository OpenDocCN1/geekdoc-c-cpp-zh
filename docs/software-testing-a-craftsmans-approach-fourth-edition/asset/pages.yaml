  md: '# 8.4.3 Essential Complexity


    Part of McCabe''s work on cyclomatic complexity does more to improve programming
    than testing. In this section, we take a quick look at this elegant blend of graph
    theory, structured programming, and the implications these have for testing. This
    whole package centers on the notion of essential complexity (McCabe, 1982), which
    is only the cyclomatic complexity of yet another form of condensation graph. Recall
    that condensation graphs are ways of simplifying an existing graph; thus, our
    simplifications have been based on removing strong components or DD-paths. Here,
    we condense the structured programming constructs, which are repeated as Figure
    8.11.


    The basic idea is to look for the graph of one of the structured programming constructs,
    collapse it into a single node, and repeat until no more structured programming
    constructs can be found. This process is followed in Figure 8.12, which starts
    with the DD-path graph of the pseudocode triangle program. The if-then construct
    condensed nodes a, and then the three then constructs are condensed onto nodes
    b, c, and d. The remaining if-then-else (which corresponds to the IF Triangle
    statement) is condensed into node e, resulting in a condensed graph with cyclomatic
    complexity V(G) = 1. In general, when a program is well structured (i.e., is composed
    solely of the structured programming constructs), it can always be reduced to
    a graph with one.


    The graph in Figure 8.11 cannot be reduced in this way (try it!). The loop with
    nodes B and C cannot be condensed because of the edge from B to E. Similarly,
    nodes D, E, and F look like an if-then construct, but the edge from B to E violates
    the structure. McCabe (1976) went on find elemental "unstructures" that violate
    the precepts of structured programming. These are shown in Figure 8.13. Each of
    these violations contains three distinct paths, opposed to the two paths present
    in the corresponding structured programming constructs;


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_184_0.png)


    Figure 8.11 Structured programming constructs.'
