    # 4.2.7 Strong Components


    The analogy continues. We get two equivalence relations from n-connectedness:
    1-connectedness yields what we call "weak connection," and in this turn yields
    weak components. (These turn out to be the same as we had for ordinary graphs,
    which is what should happen, because 1-connectedness effectively ignores direction.)
    The second equivalence relation, based on 3-connectedness, induces a partition
    on the node set of a digraph, is more interesting. As however, the condensation
    graph is quite different. Nodes that previously were 0-, 1-, or 2-connected remain
    so. The 3-connected nodes become the strong components.


    # Strong Components


    A strong component of a directed graph is a maximal set of 3-connected nodes.


    In our amended example, the strong components are the sets {n3, n4, n6} and {n5}.
    The condensation graph for our amended example is shown in Figure 4.4.

    Strong components let us simplify by removing loops and isolated nodes. Although
    this is not as dramatic as the simplification we had in ordinary graphs, it does
    solve a major testing problem. Notice that the condensation graph of a digraph
    will never contain a loop. (If it did, the loop would have been condensed by the
    maximal aspect of the partition.) These graphs have a special name: directed acyclic
    graphs, sometimes written as DAG.


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_94_1.png)


    Figure 4.4 Condensation graph of digraph in Figure 4.3.'
