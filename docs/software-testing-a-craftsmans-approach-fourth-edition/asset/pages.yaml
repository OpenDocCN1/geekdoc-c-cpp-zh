  md: "# 296 ■ Software Testing\n\nThese guidelines can be contradictory. Certain\
    \ industrial applications have huge classes; these clearly violate the one-designer,\
    \ one-class definition. In such applications, it seems better to define an object-oriented\
    \ unit as the work of one person, which likely ends up as a subset of the class\
    \ operations. In an extreme case, an object-oriented unit might be a subclass\
    \ of a class that contains only the attributes needed by a single operation or\
    \ method. In this chapter, we will use \"operation\" to refer to the definition\
    \ of a class function and \"method\" to refer to its implementation. For such\
    \ units, object-oriented unit testing reduces to traditional testing. This is\
    \ a nice but somewhat problematic because it shifts much of the object-oriented\
    \ testing burden onto integration testing. Also, it does not exploit the gains\
    \ made by encapsulation.\n\nThe class-as-unit has several advantages. In a UML\
    \ context, a class has an associated StateChart that describes its behavior. Later\
    \ we shall see that this is extremely helpful in test case identification. A second\
    \ advantage is that object-oriented integration testing has clearer goals, namely,\
    \ to check the cooperation of separately classes, which echoes software testing.\n\
    \n# 15.1.2 Implications of Composition and Encapsulation\n\nComposition (as opposed\
    \ to decomposition) is the central design strategy in object-oriented software\
    \ development. With the goal of reuse, composition creates the need for very strong\
    \ unit testing. Because a unit (class) may be composed of previously unknown other\
    \ units, the traditional notions of coupling and cohesion are applicable. Encapsulation\
    \ has the potential to resolve this concern, but only if the units (classes) are\
    \ highly cohesive and very loosely coupled. The main implication of composition\
    \ is that, even very poor unit-level testing, the real burden is at the integration\
    \ level.\n\nSome of this is clarified by example. Suppose we revisit the Saturn\
    \ windshield wiper system from an object-oriented viewpoint. We would likely identify\
    \ three classes: lever, wiper, and dial; their behavior is shaped by the finite\
