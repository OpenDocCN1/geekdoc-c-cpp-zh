    # 13.1.1 Top-Down Integration


    Top-down integration begins with the main program (the root of the tree). Any
    lower-unit is called by the main program as a "stub," where stores are pieces
    of throwaway code that emulate a unit. If we performed top-down integration for
    the Calendar program, the first step would be to develop stubs for all the units
    called by the main program—isLeap, weekDay, getDate, zodiac, nextDate, friday13th,
    and memorialDay. In a stub for any unit, the tester hard codes in a correct response
    to the request from the calling/invoking unit. A stub for zodiac, for example,
    if the main program calls with 05, 27, 2012, zodiacStub would return "Gemini."
    In extreme practice, the response might be "pretend zodiac returned Gemini."'
