  md: '# Model-Based Testing ■ 227


    According to Hartman, modeling tools such as IBM’s Rational Rose and Teleologic’s
    Rhapsody and Stalemate provide inputs to true model-based test generators, but
    by themselves, do not generate test cases. Model-based test input generators are
    a step up—they generate the input of test cases, but cannot generate the expected
    output portion. Full model-based test generators require some form of oracle to
    identify outputs. This is the sticking point for full test generation. There are
    some existing university and company proprietary test systems, and a few companies
    claim to have commercial tools available. Until this technology becomes commercially
    viable, note that case-based testing provides the expected output of a case.


    Hartman’s generalization is too sweeping—we know full test cases, with expected
    outcomes, can be derived from even simple finite state machines—provided that
    the model shows the expected outputs. When the modeler is the oracle, and provides
    expected outputs in any model, the model can serve as a full test generator.


    Mark Utting and Bruno Legeard address Model-Based Testing in their excellent book
    (Utting and Legeard, 2006).


