- img_proc: true
  md: '# System Testing ■ 285


    Here is a hypothetical example, with simplified numbers, to help understand the
    compression strategy. Suppose a local switching system must support 50,000 BHCAs.
    To do so, the system might have 5000 DTMF receivers. To test this traffic load,
    somehow 50,000 call originals must be generated in 60 minutes. The whole idea
    of compression strategies is to reduce these numbers to more manageable sizes.
    If a prototype only has 50 DTMF receivers, the load would need to generate 500
    calls at


    This pattern of compressing some form of traffic and associated devices to handle
    the offered traffic occurs in many application domains, hence the general term,
    traffic engineering.


    # 14.9.1.2 Replication


    Some nonfunctional requirements may be unusually difficult to actually perform.
    Many times, actual performance would destroy the system being tested (destructive
    vs. nondestructive testing). In the first frame, Calvin sees on a bridge that
    says "Maximum weight 5 tons." He asks his father how this is determined. The father
    answers that heavily trucks are driven over the bridge collapses. In the last
    frame, Calvin has his standard shock/horror expression. After destroy a system,
    some form of replication can be tested. Examples follow.


    One of the nonfunctional requirements for an army field telephone switching center
    was that it had to be operational after a parachute drop. Doing this was also
    very expensive and logically complex. One of the system knew how to replicate
    this; however, in consultation with a former paratrooper, the testers learned
    that the impact of a parachute drop is similar to jumping off a ten-foot (three
    meter) wall. The testers tested a prototype on a fork lift, lifted it to a height
    of ten feet, and forwarded it until it fell off the skid. After hitting the ground,
    the prototype was still operational, and the test passed.


    One of the most dangerous incidents for aircraft is a mid-air collision with a
    bird. Here is an excerpt of the


    > The Canopy System Must Withstand Impact of a 4 lb Bird at 480 Knots on the Reinforced
    Windscreen and 350 Knots on the Canopy Without:


    +   - Breaking or Deflecting so as to Strike the Pilot When Seated in the Design
    Eye "High" Position,

    - Damage To The Canopy That Would Cause Incapacitating Injury To The Pilot, or

    - Damage That Would Prevent Safe Operation of, or Emergency Egress from the Aircraft


    Clearly it would be impossible to avoid a mid-air collision, so the Lockheed Martin
    replicated the problem with an elaborate cannon that would shoot a dead chicken
    at the windscreen and the tests.


    There is an urban legend, debunked on Snopes.com, about follow-up on a British
    (or French, or fill-in-your-favorite-country) firm that they used for canopy testing,
    but their tests all failed. When they asked the US testers why the failures were
    so consistent, they received an answer: "you need to chew the fat first." Why
    mention this? If nonfunctional testing is done with a replication strategy, it
    is important to replicate, as closely as possible, the actual test scenario. (But
    it is funny.)'
