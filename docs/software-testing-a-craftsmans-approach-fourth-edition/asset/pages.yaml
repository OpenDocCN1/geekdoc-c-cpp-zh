  md: '# 1.4.1 Specification-Based Testing


    The reason that specification-based testing was originally called "functional
    testing" is that any program can be considered to a function that maps values
    from its input domain to values in its output range. (Function, domain, and range
    are defined in Chapter 3.) This notion is commonly used in engineering, when systems
    are considered to be black box. in which the content (implementation) of the black
    box is not known, and the function of the black box is understood completely in
    terms of its inputs and outputs (see Figure 1.4). In Zen and the Art of Motorcycle
    Maintenance, Robert Pirs refers to "romantic" comprehension (Prig, 1973). Many
    times, we operate effectively with black box knowledge; however, this is central
    to object orientation. As an example, many people-fully operate automobiles with
    only black box knowledge.


    With the specification-based approach to test identification, the only information
    used is the specification of the software. Therefore, the test cases have two
    distinct advantages: (1) they are independent of how the software is implemented,
    so if the implementation changes, the test cases are still useful; (2) the test
    case development can occur in parallel with the implementation, reducing the overall
    project development interval. On the negative side, specification-based test cases
    frequently suffer from two problems: significant redundancies may exist among
    test cases, compounded by the possibility of gaps of untested software.


    Figure 1.5 shows the results of test cases identified by two specification-based
    methods. Method A identifies larger set of test cases than method B. Notice, for
    both methods, the set of test cases is completely contained within the set of
    specified behavior. Because specification-based methods are based on the specified
    behavior, it is hard to imagine these methods identifying behaviors that are not
    specified. In Chapter 8, we will see comparisons of test cases generated by various
    specification-based methods for the examples defined in Chapter 2.


    In Chapters 5 through 7, we will examine the mainline approaches to specification-based
    testing, including boundary value analysis, robustness testing, worst-case analysis,
    special value testing, input (domain) equivalence classes, output (range) equivalence
    classes, and decision table-based testing. The common thread through these techniques
    is that all are based on


