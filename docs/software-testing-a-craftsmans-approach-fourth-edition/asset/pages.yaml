  md: '# Definition


    The set $T$ satisfies the All-C-Uses/Some P-Uses criterion for the program $P$
    if and only for every variable $v \in V$, $T$ contains definition clear paths
    from every defining node of $v$ to every computation of $v_i$; and if a definition
    of $v$ has no C-uses, a definition-clear path leads to at least one predicate
    use.


    # Definition


    The set $T$ satisfies the All-DU-paths criterion for the program $P$ if and only
    if for every variable $v \in V$, $T$ contains definition-clear paths from every
    defining node of $v$ to use of $v$ and to the successor node of each $USE(v, n)$,
    and these paths are either single loop traversals or they are cycle free.


    These test coverage metrics have several set-theory-based relationships, which
    are referred to as “subsumption” in Rapps and Weyuker (1985). These relationships
    are shown in Figure 9.5. We now have a more refined view of structural testing
    possibilities between the extremes of the (unat) All-Paths metric and the generally
    accepted minimum, All-Edges. What good is all this? Define/use testing provides
    a rigorous, systematic way to examine points at which faults occur.


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_201_0.png)


    Figure 9.5 Rapps–Weyuker hierarchy of data flow coverage metrics.'
