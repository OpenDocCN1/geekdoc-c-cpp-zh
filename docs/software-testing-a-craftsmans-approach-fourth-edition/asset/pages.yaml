    +   * Communication among developers

    * Training, especially for new personnel, or for personnel recently added to a
    project

    * Management progress reporting

    * Defect discovery

    * Performance evaluation (of the work product producer)

    * Team morale

    * Customer (re)assurance


    All of these can happen with a software review; however, the best (say only!)
    reason to have reviews is to discover defects. With this focus, all of the other
    "reasons" turn out to be diverse, and each diminishes the defect discovery goal.


    # 22.3.1 Walkthroughs


    Walkthroughs are the most common form of review, and they are the least formal.
    They often involve just two people, the producer and a colleague. There is generally
    no preparation ahead of the walkthrough, and usually little or documentation is
    produced. The producer is the review leader; therefore, the utility of a walkthrough
    depends on the real goal of the producer. It is easy for a producer/review leader
    to direct the walkthrough to the "safe" parts of the work product, and avoid the
    portions where the producer is unsure. This is clearly a degenerate case, but
    it happens, particularly when technical people resist the review process. Walkthroughs
    are most effective at the source code level, and with other small products.


    # 22.3.2 Technical Inspections


    Pioneered by Michael Fagan when he was at IBM in the 1970s, technical inspections
    are the most effective form of software reviews. They are a highly formal process,
    and more details of technical inspections are given in Sections 22.4 and 22.5.
    The effectiveness of technical inspections is the result of several successful
    factors, including


    +   * A documented inspection process

    * Formal review training

    * Budgeted review preparation time

    * Sufficient lead time

    * Thoughtful identification of the inspection team

    * A refined review checklist

    * Technically competent participants

    * "Buy in" by both technical and management personnel


    # 22.3.3 Audits


    Audits are usually performed by some external group, rather than the development
    team. Audits may be conducted by a software quality assurance group, a project
    group, an outside agency, or possibly a government standards agency. Audits are
    not primarily concerned with finding defects—the main concern is to confirm some
    expectations, either internal or external. This is not to diminish the importance
    of audits—they can be very expensive because they require


