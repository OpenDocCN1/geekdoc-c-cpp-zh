    # # 6.3 Improved Equivalence Class Testing


    The key (and craft!) of equivalence class testing is the choice of the equivalence
    relation that determines the classes. Very often, we make this choice by second-guessing
    the likely implementation and thinking about the functional manipulations that
    be present in the implementation. We will illustrate this with our continuing
    examples. We need to enrich the function we use in boundary value testing. Again,
    for the sake of comprehensible drawings, the discussion relates to a function,
    of two variables x1 and x2. When F is implemented as a program, the input variables
    x1 and x2 will have the following boundaries, and intervals within the boundaries:


    ```

    a ≤ x1 ≤ d, with intervals [a, b], [b, c], [c, d]

    e e ≤ x2 ≤ g, with intervals [e, f], [f, g]

    ```


    The square brackets and parentheses, respectively, closed and open endpoints.
    The intervals presumably correspond to some distinction in the program being tested,
    for example, the commission ranges in the problem range. Invalid values of x1
    and x2 are <a, d> and x2 <e, >g. The equivalence classes of valid values are


    V1 = {x1; x1 < b}, V2 = {x1; b ≤ x1 < c}, V3 = {x1; c ≤ x1 ≤ d}, V4 = {x2; e ≤
    x2 ≤ f}, V5 = {x2; f ≤ x2 ≤ g}


    The equivalence classes of invalid values are


    ```

    NV1 = {x1; x1 < a}, NV2 = {x1; d < x1}, NV3 = {x2; x2 < e}, NV4 = {x2; g < x2}

    ```


