    # Definition


    The coverage of a methodology M with respect to a metric S is the ratio of n to
    s. We denote it as C(M,S).


    # Definition


    The redundancy of a methodology M with respect to a metric S is the ratio of m
    to s. We denote it as R(M,S).


    # Definition


    The net redundancy of a methodology M with respect to a metric S is the ratio
    of m to n. We denote it as NR(M,S).


    We interpret these metrics as follows: the coverage metric, C(M,S), deals with
    gaps. When this value is less than 1, there are gaps in the coverage with respect
    to the metric. Notice that, when C(M,S) = 1, algebra forces R(M,S) = NR(M,S).
    The redundancy metric is obvious—the bigger it is, the greater the redundancy.
    Redundancy is more useful—it refers to things actually traversed, not to the total
    space of things to be traversed. Together, these three metrics give a quantitative
    way to evaluate the effectiveness of any specification-based testing (except special
    value testing) with respect to a code-based metric. This is only half the battle,
    however. What we really would like to know how effective test cases are with respect
    to kinds of faults. Unfortunately, information such as this simply is not available.
    We can come close by selecting code-based metrics with respect to the kinds of
    faults (or maybe faults we most fear). See the guidelines near the end of this
    chapter for specific advice.


    In general, the sophisticated code-based metrics will tend to become less effective
    when evaluated in terms of more rigorous code-based metrics. This is intuitively
    appealing, and it is borne out by our examples. These metrics are devised such
    that the best possible value is 1. Data from our earlier chapters to apply these
