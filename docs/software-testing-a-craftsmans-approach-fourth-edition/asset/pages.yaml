  md: '# 21.1.2 Mutation Operators


    Ammann and Offut (2008) are two of the long-term mutation researchers. In their
    book, develop 11 categories of mutation operators (Hmmm ... could this be “mutation
    overkill?” Sorry, I just couldn''t resist the pun). To get the flavor of these
    replacements, the most common mutations are the result of replacing a syntactic
    element with another of the same set. For example, the set of arithmetic operators,
    A, is the


    ```

    A = {+, -, *, /, %};

    ```


    We could add exponentiation and other primitives if we wished.) Similarly, the
    set of relational operators, R, is the set


    ```

    R = {<, <=, ==, !=, >=, >};

    ```


    The third common set of replacements, L, deals with logical connectives that we
    use in Chapter 3:


    ```

    L = {∧, v, ⊕, ~};

    ```


    At this point, a mutation tester''s creativity can extend the basic idea to unit-specific
    choices. If a program uses trigonometric functions, they can be replaced by other
    functions; similarly for statistical functions. In Chapter 16, we come close to
    what we discussed Halstead''s metrics. The next three uses off a free, online
    mutation testing tool (PIT) to analyze three of our previously worked examples,
    is.leap (from NextDate), isTriangle (from the Triangle program), and version of
    the commission program. Mutation testers can let their imaginations run wild with
    “mutation explosion.” Recall the Boolean function is.leap from our earlier examples.


    +   Public Function isleap(year) As Boolean

    Dim year As Integer

    Dim c1, c2, c3 As Boolean

    1. c1 = (year % 4 == 0)

    2. c2 = (year % 100 == 0)

    3. c3 = (year % 400 == 0)

    4. isleap = False

    5. If ((c1 AND NOT(c2)) OR (c3)) Then

    6. Isleap = True

    7. Else

    8. Isleap = False

    9. EndIf

    End Function


    “mutation explosion” is only hinted at. In a full mutation, there are four mutations
    of the % operation in statement 1, compounded by five replacements of the == connective.
    Since mutations are made singly, there would be nine mutations of statement 1,
    nearly each for statements 2 and 3. The compound condition in statement 5 contains
    three logical connectives, and each of these could be replaced slight changes
    to the constants: we might replace 4 any of {-4, 3, 0, 5} and any 100 of {101,
    0, 99, -100}. Altogether, we can imagine dozens of mutants of the basic isleap.'
