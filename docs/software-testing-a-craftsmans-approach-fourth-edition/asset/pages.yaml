    that a potential All Pairs tester needs to be the order in which classes of a
    variable are presented to the algorithm.


    # 20.1.4 Failures Due to Pairs of Inputs


    By definition, the All Pairs technique only potentially reveals faults due to
    the interaction of two variables. The NextDate counter-example showed that faults
    due to interaction of three variables (e.g., February 28 in a common year) will
    not be detected. This cannot be an indictment of the All Pairs technique—the advocates
    are quite clear that it is limited to find faults due to the interaction of variables.
    Orthogonal arrays and the OATS technique can be used to find interactions among
    three or more variables. As long as the program being tested uses logical variables,
    there is not too much risk. If a program involves computations with physical variables,
    some insight will likely be needed. Suppose, for example, a ratio is computed,
    and the numerator and denominator are from different classes. There be no problem
    with nominal values, but a very large numerator divided by a very small denominator
    might cause an overflow fault. Worst-case boundary value testing would be a more
    likely method to reveal such a fault.'
