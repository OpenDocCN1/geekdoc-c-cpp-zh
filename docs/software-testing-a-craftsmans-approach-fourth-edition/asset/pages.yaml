    # Definition


    The *reduced outdegree of node $n$ in a *directed graph* is one less than the
    outdegree of $n$.

    Denote the reduced outdegree of node $n$ as $reducedOut(n)$; then we can write


    > $reducedOut(n) = \text{outDeg}(n) - 1$


    We use the reduced outdegree of nodes in a program graph to compute its cyclic
    complexity. Notice that a cattle pen "begins" with a node with $outDeg > 2$. Table
    16.1 shows the nodes in Figure 16.1 that satisfy this observation.


