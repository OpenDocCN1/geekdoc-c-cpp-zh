    # 4.2 Directed Graphs


    Directed graphs are a slight refinement to ordinary graphs: edges acquire a sense
    of direction. Symbolically, the unordered pairs $(n_i, n_j)$ become ordered pairs
    $<n_i, n_j>$, and we speak of a directed edge from node $n_i$ to $n_j$, instead
    of being between the nodes.


    # Definition


    A directed graph $D = (V, E)$ consists of a finite set $V=\{n_1, n_2, \dots, n_m\}$
    of nodes, and a set $E=\{e_1, e_2, \dots, e_p\}$ of edges, where each edge $e_k
    = <n_i, n_j>$ is an ordered pair of nodes $n_i, n_j \in V$.

    In the directed edge $e_k = <n_i, n_j>$, $n_i$ is the initial (start) node and
    $n_j$ is the terminal (or finish) node. Directed graphs fit naturally with many
    software concepts: sequential behavior, imperative programming languages, time-ordered
    events, define/reference pairings, function and procedure calls, and so on. Given
    this, you might ask why we spent (wasted?) so much time on ordinary graphs. The
    difference between declarative and imperative programming languages is very analogous.
    In imperative languages (e.g., COBOL, FORTRAN, Pascal, C, Java, Ada), the sequential
    order of language statements determines the execution order of compiled code.
    This is not true for declarative languages (like Prolog). The most common declarative
    situation for most software developers is entity/relationship (E/R) modeling.
    In an E/R model, we choose entities and identify relationships as edges (If a
    relationship involves three or more entities, we need the notion of a "hyper-edge"
    that has three or more endpoints). The resulting graph of an E/R model is more
    properly interpreted as an ordinary graph. Good E/R modeling suppresses the sequential
    thinking that directed graphs promote.


    When testing a program written in a declarative language, the only concepts available
    to the tester are those that follow from ordinary graphs. Fortunately, most software
    is developed in imperative languages; testers usually have the full power of directed
    graphs at their disposal.


    The next series of definitions parallels the ones for ordinary graphs. We modify
    our following continuing example to the one shown in Figure 4.2.


    We have the same node set $V=\{n_1, n_2, n_3, n_4, n_5, n_6, n_7\}$, and the edge
    set to be the same: $E=\{e_1, e_2, e_3, e_4, e_5\}$. The difference is that the
    edges are ordered pairs of nodes in V:


    ```

    $E = \{<n_1, n_2>, <n_1, n_4>, <n_3, n_4>, <n_2, n_5>, <n_4, n_5>, <n_4, n_6>\}$

    ```'
