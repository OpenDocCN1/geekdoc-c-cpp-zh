    suppose that $f(a) = b, g(b) = c$, and $h(c) = d$. Now the composition of functions
    $h, g,$ and $f$ is


    ```

    $h \circ g \circ f(a) = h(g(f(a))$\n$= h(g(b))\n$= h(c)\n$= d$

    ```


    Function composition is a very common practice in software development; it is
    inherent in the process of defining procedures and subroutines. We have an example
    of it in the commission program, in which


    ```

    $f_1$ (locks, stocks, barrels) = sales$\n\n$f_2$ (sales) = commission

