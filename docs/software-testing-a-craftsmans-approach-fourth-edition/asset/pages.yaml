  md: '# Chapter 11


    # Life Cycle–Based Testing


    In this chapter, we begin with various models of the software development life
    cycle in terms of the implications these life cycles have for testing. We took
    a general view in Chapter 1, where we identified three levels (unit, integration,
    and system) in terms of symmetries in the waterfall model of software development.
    This view has been relatively success for decades, and these levels persist; however,
    the advent of alternative life cycle models mandates a deeper look at alternative
    test cases. We begin with the traditional waterfall model, mostly because it is
    widely understood and is a reference framework for the more recent models. Then
    we look at derivatives of the waterfall model, and finally maintain monotone agile
    variations.


    We also make a major shift in our thinking. We are more concerned with how to
    represent the item tested because representation may limit our ability to identify
    test cases. Take a look at the papers presented at the leading conferences (professional
    or academic) on software testing—you will find nearly as many presentations on
    specification models and on testing techniques. Model-Based Testing (MBT) is the
    meeting place of software modeling and testing at all levels.


    # 11.1 Traditional Waterfall Testing


    The traditional model of software development is the waterfall model, which is
    illustrated in Figure 11.1. It is sometimes drawn as a V as emphasize the basic
    levels of testing reflect the early waterfall phases. In ISTQB circles, this is
    known as the “V-Model.” In this view, information produced in one of the development
    phases constitutes the basis for test case identification at that level. Nothing
    controversial here; we certainly hope that system cases are clearly correlated
    with the requirements specification, and that unit test cases are derived from
    the detailed design of the unit. On the upper left of the waterfall, the tight
    what/how cycles are important. They underscore the fact that the predecessor phase
    defines what is to be done in successor phase. When complete, the successor phase
    states how it accomplishes “what” was to be done. These are also ideal points
    at which conduct software reviews (see Chapter 22). Some might assert that these
    phases are the fault creation phases, and those on the right are the fault detection
    phases.'
