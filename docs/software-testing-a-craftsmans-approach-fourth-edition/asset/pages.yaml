  md: '# 6.3.3 Weak Robust Equivalence Class Testing


    The name for this form is admittedly counterintuitive and oxymoronic. How can
    something be both weak and robust? The robust part comes from consideration of
    invalid values, and the weak part refers to the single fault assumption. The process
    of robust equivalence class testing is a simple extension of that for weak normal
    equivalence class testing—pick test cases such that each equivalence class is
    represented. In Figure 6.4, the test cases for valid classes are as those in Figure
    6.2. The two additional test cases cover all four classes of invalid values. The
    process is similar to that boundary value testing:


    +   1. Valid inputs, use one value from each valid class (as in what we have called
    normal equivalence class testing). (Note that each input in these test cases will
    be valid.)

    2. Invalid inputs, a test case will have one invalid value and the remaining values
    will all be valid. (Thus, a “single failure” should cause the test case to fail.)


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_133_0.png)


    Figure 6.3 Strong normal equivalence class test cases.


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_133_1.png)


    Figure 6.4 Weak robust equivalence class test cases.'
